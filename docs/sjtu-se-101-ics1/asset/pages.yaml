- pgno: 1146
  md: '# Inserting an L1 cache between the CPU and main memory


    The transfer unit between the CPU register file and the cache is a **4-byte**
    block.


    The tiny, very fast CPU register file has room for four 4-byte words.


    The small fast L1 cache has room for two 8-word blocks.


    The transfer unit between the cache and main memory is a **8-word** block (32
    bytes).


    The big slow main memory has room for many 8-word blocks.


    ![](img/b3f8b91675c485f1e811aa092ebbf3d4_1146_0.png)'
  merge: -1
  img_proc: true
- pgno: 1147
  md: '# Generic Cache Memory Organization


    Cache is an array of sets.


    Each set contains one or more lines.


    Each line holds a block of data.


    1 valid bit per line

    tag bits per line

    B = 2^b bytes per cache block


    set 0:

    valid tag 0 1 ... B-1

    ...

    valid tag 0 1 ... B-1

    E lines per set


    S = 2^s sets


    set 1:

    valid tag 0 1 ... B-1

    ...

    valid tag 0 1 ... B-1


    set S-1:

    valid tag 0 1 ... B-1

    ...

    valid tag 0 1 ... B-1'
