- pgno: 945
  md: '# Performance goals: throughput


    +   - Number of completed requests per unit time

    +   - Example:

    +     - 5,00 malloc calls and 5,00 free calls in 1 seconds

    +     - throughput is 1,000 operations/second.'
  merge: -1
  img_proc: true
- pgno: 946
  md: '# Performance goals: peak memory utilization


    +   - Given some sequence of malloc and free requests:

    +     - $R_0, R_1, ..., R_k, ..., R_{n-1}$

    +   - Def: aggregate payload $P_k$:

    +     - malloc(p) results in a block with a payload of p bytes.

    +     - After request $R_k$ has completed, the aggregate payload $P_k$ is the
    sum of currently allocated payloads.'
  merge: -1
  img_proc: true
- pgno: 947
  md: '# Performance goals: peak memory utilization


    +   - Def: current heap size is denoted by Hₖ

    +     - Note that Hₖ is monotonically nondecreasing (can be relaxed)

    +   - Def: peak memory utilization:

    +     - After k requests, peak memory utilization is:

    +       - Uₖ = ( maxᵢ≤ₖ Pᵢ ) / Hₖ'
  merge: -1
  img_proc: true
