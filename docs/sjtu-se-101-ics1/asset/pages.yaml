- pgno: 1096
  md: '# Disk access time


    +   - **Rotational latency**

    +     - Time waiting for first bit of target sector to pass under r/w head.

    +     - Tₐᵥg rotation = 1/2 × 1/RPMs × 60 sec/1 min

    +   - **Transfer time**

    +     - Time to read the bits in the target sector.

    +     - Tₐᵥg transfer = 1/(avg # sectors/track) × 1/RPM × 60 secs/1 min.'
  merge: -1
  img_proc: true
- pgno: 1097
  md: '# Disk access time example


    Example:


    Rotational rate      7,200 RPM


    T_avg seek      9 ms


    Avg # sectors/track      400


    T_avg rotation = 1/2 x (60secs/7200RPM) x 1000ms/sec


    = 4ms


    T_avg transfer = 1/400secs/track x 60sec/7200RPM x 1000ms/sec


    = 0.02 ms


    T_access = 9 ms + 4 ms + 0.02 ms'
  merge: -1
  img_proc: true
- pgno: 1098
  md: '# Disk access time example


    # Important points


    +   - Access time dominated by **seek time** and **rotational latency**

    +   - First bit in a sector is the most expensive, the rest are free


    +   - SRAM access time is about 4 ns/double word

    +   - DRAM is about 60 ns

    +   - Disk is about 40,000 times slower than SRAM

    +   - Disk is about 2,500 times slower then DRAM'
  merge: -1
  img_proc: true
- pgno: 1099
  md: '# Logical disk blocks


    +   - Modern disks present a simpler abstract view of the complex sector geometry:

    +     - The set of available sectors is modeled as a sequence of b-sized logical
    blocks (0, 1, 2, ...)

    +   - Mapping between logical blocks and actual (physical) sectors

    +     - Maintained by hardware/firmware device called disk controller

    +     - Converts requests for logical blocks into (surface, track, sector) triples.'
  merge: -1
  img_proc: true
