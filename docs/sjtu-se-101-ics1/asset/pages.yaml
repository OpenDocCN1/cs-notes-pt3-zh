  md: "# Cool Stuff with Xor\n\n```\nint inplace_swap(int *x, int *y)\n{\n    *x =\
    \ *x ^ *y;  /* #1 */\n    *y = *x ^ *y;  /* #2 */\n    *x = *x ^ *y;  /* #3 */\n\
    }\n```\n\n| Step | *x | *y |\n|---|---|---|\n| Begin | A | B |\n| 1 | A^B | B\
    \ |\n| 2 | A^B | (A^B)^B = A^(B^B) = A^0 = A |\n| 3 | (A^B)^A = (B^A)^A = B^(A^A)\
    \ = B^0 = B | A |\n| End | B | A |"
