  md: '# Internal Fragmentation


    +   - Internal fragmentation

    +     - Is caused by overhead of maintaining heap data structures, padding for
    alignment purposes, or explicit policy decisions (e.g., not to split the block).

    +     - Depends only on the pattern of previous requests, and thus is easy to
    measure.'
