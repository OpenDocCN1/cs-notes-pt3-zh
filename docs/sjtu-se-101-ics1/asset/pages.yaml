  md: '# Shared Libraries


    +   - Synonym

    +     - Shared object on Linux, denoted by .so suffix

    +     - DLL (dynamic link libraries) on Windows

    +   - What sharing means

    +     - Only one .so file for a particular library

    +     - Code and data in the .so file are shared by all of the executable object
    files that reference the library'
