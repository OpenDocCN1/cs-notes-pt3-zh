- pgno: 907
  md: '# Dynamically linking


    +   - Done by execve() & ld-linux.so

    +     - Copy code and data of libc.so and libvector.so into to memory segment

    +     - Relocate any references in p2 to symbols defined by libc.so and libvector.so

    +   - The pathname of the ld-linux.so is contained in the .interp section of p2

    +   - After linking, the locations of the shared libraries are fixed and do not
    change during the execution time'
