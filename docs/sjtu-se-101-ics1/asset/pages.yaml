- pgno: 718
  md: '# IEEE Floating-Point Representation


    +   - Encoding

    +     - `s` | `exp` | `frac`

    +     - `s` is sign bit

    +     - `exp` field encodes *E*

    +     - `frac` field encodes *M*


    +   - Sizes

    +     - Single precision (32 bits): 8 exp bits, 23 frac bits

    +     - Double precision (64 bits): 11 exp bits, 52 frac bits'
  merge: -1
  img_proc: true
- pgno: 719
  md: '# Normalize Values


    +   - **Condition**

    +     - exp ≠ 000...0 and exp ≠ 111...1

    +   - **Exponent coded as biased value**

    +     - *E = Exp - Bias*

    +       - *Exp*: unsigned value denoted by exp

    +       - *Bias*: Bias value

    +         - Single precision: 127 (Exp: 1...254, E: -126...127)

    +         - Double precision: 1023 (Exp: 1...2046, E: -1022 ...1023)

    +     - In general: *Bias = 2^{m-1} - 1*, where m is the number of exponent bits'
  merge: -1
  img_proc: true
- pgno: 720
  md: '# Normalize Values


    +   - Significand coded with implied leading 1

    +     - m = 1.xxx...x₂

    +     - xxx...x: bits of frac

    +     - Minimum when 000...0 (M = 1.0)

    +     - Maximum when 111...1 (M = 2.0 - )

    +     - Get extra leading bit for "free"'
  merge: -1
