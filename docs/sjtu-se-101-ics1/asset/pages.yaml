- pgno: 880
  md: '# Position-Independent Code (PIC)


    +   - Allow multiple running processes to share the same library code

    +     - Save precious memory resource

    +   - Naïve: assign a dedicated address

    +     - Inefficient use of the address space

    +     - Difficult to manage

    +   - Better: load and execute at any address

    +     - Position-independent code (PIC)

    +     - gcc with -fPIC'
  merge: -1
  img_proc: true
- pgno: 881
  md: '# Position-Independent Code (PIC)


    +   - Position-Independent Code (PIC)

    +     - Internally-defined procedures (OK)

    +       - PC-relative reference

    +     - Externally-defined procedures and reference to global variable (NO)

    +       - Indirect reference

