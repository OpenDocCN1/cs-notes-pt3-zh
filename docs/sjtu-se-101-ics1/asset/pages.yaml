- pgno: 1229
  md: '# Cache performance metrics


    +   - **Miss Rate**

    +     - fraction of memory references not found in cache (misses/references)

    +     - Typical numbers:

    +       3-10% for L1

    +       Can be quite small (<1%) for L2, depending on size

    +   - **Hit Rate**

    +     - fraction of memory references found in cache (1 - miss rate)'
  merge: -1
  img_proc: true
- pgno: 1230
  md: '# Cache performance metrics


    +   - Hit Time

    +     - time to deliver a line in the cache to the processor (includes time to
    determine whether the line is in the cache)

    +     - Typical numbers:

    +       1-2 clock cycles for L1 (4 cycles in core i7)

    +       5-10 clock cycles for L2 (11 cycles in core i7)

    +   - Miss Penalty

    +     - additional time required because of a miss

    +     - Typically 50-200 cycles for main memory (Trend: increasing!)'
  merge: -1
  img_proc: true
- pgno: 1231
  md: '# What does Hit Rate Mean?


    +   - Consider

    +     - Hit Time: 2 cycles

    +     - Miss Penalty: 200 cycles

    +     - Average access time:

    +     - Hit rate 99%: 2*0.99 + 200*0.01 = 4 cycles

    +     - Hit rate 97%: 2*0.97 + 200*0.03 = 8 cycles

    +   - This is why "miss rate" is used instead of "hit rate"'
  merge: -1
  img_proc: true
