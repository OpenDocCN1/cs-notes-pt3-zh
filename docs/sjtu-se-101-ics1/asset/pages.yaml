- pgno: 21
  md: '# Enduring concepts


    +   - Computer systems consist hardware and systems software that work together
    to run programs

    +   - Specific implementations of systems change over time

    +   - But the underlying concepts do not

    +   - All computer systems have similar hardware and software components that
    perform similar functions'
  merge: -1
  img_proc: true
