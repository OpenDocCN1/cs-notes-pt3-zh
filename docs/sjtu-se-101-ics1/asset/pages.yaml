- pgno: 1140
  md: '# Types of Cache Misses


    +   - Cold (compulsory) miss

    +     - Cold misses occur because the cache is empty.

    +   - Capacity miss

    +     - Occurs when the set of active cache blocks (working set) is larger than
    the cache.'
  merge: -1
  img_proc: true
- pgno: 1141
  md: '# Types of Cache Misses


    +   - Conflict miss

    +     - Most caches limit blocks at level k+1 to a small subset (sometimes a singleton)
    of the block positions at level k.

    +       - e.g. Block i at level k+1 must be placed in block (i mod 4) at level
    k.

    +     - Conflict misses occur when the level k cache is large enough, but multiple
    data objects all map to the same level k block.

    +       - e.g. Referencing blocks 0, 8, 0, 8, 0, 8, ... would miss every time.'
  merge: -1
  img_proc: true
- pgno: 1142
  md: '# Cache Memory


    +   - History

    +     - At very beginning, 3 levels

    +       - Registers, main memory, disk storage

    +     - 10 years later, 4 levels

    +       - Register, SRAM cache, main DRAM memory, disk storage

    +     - Modern processor, 5~6 levels

    +       - Registers, SRAM L1, L2(,L3) cache, main DRAM memory, disk storage

    +     - Cache memories

    +       - small, fast SRAM-based memories

    +       - managed by hardware automatically

    +       - can be on-chip, on-die, off-chip'
  merge: -1
  img_proc: true
