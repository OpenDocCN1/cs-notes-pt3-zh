  md: '# Commands


    +   - MOST IMPORTANT

    +     - Search Path: `/bin, /usr/bin, ...`

    +     - Command is case sensitive

    +     - `man` - display the on-line manual pages

    +       e.g. `>man man`

    +     - `whatis` - search the whatis database for complete words

    +       e.g. `>whatis passwd`'
  merge: -1
  img_proc: true
- pgno: 1302
  md: "# # Commands\n\n# ## File and Directory\n\n+   - `ls` — list files/dirs  \n\
    +     e.g. `>ls -l`\n+   - `mkdir` — create a dir  \n+     e.g. `>mkdir test`\n\
    +   - `cd` — change dir  \n+     e.g. `>cd test`\n+   - `rm` — remove files/dirs\
    \  \n+     e.g. `>rm -f a.txt`\n+   - `cp` — copy files/dirs  \n+     e.g. `>cp\
    \ a.txt b.txt`\n+   - `mv` — move files/dirs  \n+     e.g. `>mv a.txt c.txt`\n\
    +   - `pwd` — show current path  \n+     e.g. `>pwd`\n+   - `du` — estimate files/dirs\
    \ space usage  \n+     e.g. `>du -c -h test`\n+   - `df` — report free disk space\
    \  \n+     e.g. `>df`"
  merge: -1
  img_proc: true
- pgno: 1303
  md: '# Commands


    +   - File and Directory

    +     - `chmod` - change mode of file/dir

    +       e.g. >chmod 777 test

    +     - `chown` - change owner of file/dir

    +       e.g. >chown rong edit

    +     - `chgrp` - change group of file/dir

    +       e.g. >chgrp guest draft -R


    ```

    $ ls -l

    drwxr--r-- 1 peter admin 4096 Mar 1 2007 drafts

    -rw-r--r-- 1 peter admin 30405 Mar 1 2007 edition-32

    -r-xr-xr-x 1 terry admin 8460 Mar 1 2007 edit

    duuugggoo C owner group size date name

    C: (hard link count)

    ```'
  merge: -1
  img_proc: true
- pgno: 1304
  md: '# Commands


    # Search


    +   - **whereis** - locate special files for a command (binary, src and manual
    file)

    +     e.g. >whereis cp

    +   - **find** - search for files/dirs in a dir hierarchy

    +     e.g. >find . -name "c.txt"

    +   - **locate** - locate files/dirs by name in system based on a database

    +     e.g. >locate test

    +   - **grep** - text search utility

    +     e.g. >grep "abc" . -R'
  merge: -1
  img_proc: true
- pgno: 1305
  md: '# Commands


    # User Account


    +   - **useradd** - create a new user

    +     e.g. `>useradd rong`

    +   - **userdel** - delete a user account

    +     e.g. `>userdel rong`

    +   - **passwd** - set password for a user account based on a database

    +     e.g. `>passwd rong`

    +   - **users** - print name of user currently logged

    +     e.g. `>users`'
  merge: -1
  img_proc: true
- pgno: 1306
  md: '# Commands


    +   - Text

    +     - `cat` - concatenate and print files

    +       e.g. >cat b.txt

    +     - `head` - output the first part of files

    +       e.g. >head -n 4 b.txt

    +     - `tail` - output the last part of files

    +       e.g. >tail -c 50 b.txt

    +     - `wc` - print the number of newlines, words, and bytes in files

    +       e.g. >wc b.txt

    +     - `cut` - remove sections from each line of files

    +       e.g. >cut -c 4-10 b.txt'
  merge: -1
  img_proc: true
- pgno: 1307
  md: '# Commands


    +   - Misc

    +     - **echo** - display a line of text

    +       e.g. >echo $PATH

    +     - **mount** - mount a file system

    +       e.g. >mount /dev/sda3 /mnt

    +     - **umount** - unmount a file system

    +       e.g. >umount /mnt

    +     - **ping** - send ICMP ECHO_REQUEST to network hosts

    +       e.g. >ping 10.132.143.100

    +     - **date** - print or set the system date and time

    +       e.g. >date "%m/%d/%y"

    +     - **time** - time a simple command

    +       e.g. >time locate mapreduce'
  merge: -1
  img_proc: true
- pgno: 1308
  md: '# Commands


    # Misc


    +   - `;` -- join two command in one line

    +     e.g. >echo $PATH; whereis echo

    +   - `< > >>` -- redirect input and output

    +     e.g. >cat b.txt >> c.txt

    +   - `|` -- pipe the former output as the later input

    +     e.g. >cat b.txt | grep "abc"

    +   - `&` -- do command in new process

    +     e.g. >cat b.txt &'
  merge: -1
  img_proc: true
