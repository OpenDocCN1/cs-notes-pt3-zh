  md: '# Setting Conditional Codes


    +   - Implicit Setting By Arithmetic Operations

    +     `addl Src,Dest`

    +     C analog: t = a+b

    +     - CF set if carry out from most significant bit

    +       - Used to detect unsigned overflow

    +     - ZF set if t == 0

    +     - SF set if t < 0

    +     - OF set if two''s complement overflow

