- pgno: 831
  md: '# # FIFA World Cup History


    The FIFA World Cup is an international association football competition contested
    by the senior men''s national teams of the members of the Fédération Internationale
    de Football Association (FIFA), the sport''s global governing body. The championship
    has been awarded every four years since the inaugural tournament in 1930, except
    in 1942 and 1946 when it was not held due to the Second World War.


    The tournament consists of a qualification phase, held over the preceding three
    years, to determine which teams qualify for the tournament phase. In the tournament
    phase, 32 teams compete for the title at venues within the host nation over a
    period of about a month.


    # ## History


    The first World Cup was held in Uruguay in 1930. The host nation won the final
    against Argentina 4–2. The early years of the competition saw European and South
    American teams dominate the tournament. The trophy was designed by French artist
    Abel Lafleur and is made of gold plated sterling silver.


    +   - 1930: Uruguay — Winner: Uruguay

    +   - 1934: Italy — Winner: Italy

    +   - 1938: France — Winner: Italy

    +   - 1950: Brazil — Winner: Uruguay

    +   - 1954: Switzerland — Winner: West Germany

    +   - 1958: Sweden — Winner: Brazil

    +   - 1962: Chile — Winner: Brazil


    | Year | Host | Champion |

    |------|------|----------|

    | 1966 | England | England |

    | 1970 | Mexico | Brazil |

    | 1974 | West Germany | West Germany |

    | 1978 | Argentina | Argentina |

    | 1982 | Spain | Italy |

    | 1986 | Mexico | Argentina |

    | 1990 | Italy | West Germany |'
