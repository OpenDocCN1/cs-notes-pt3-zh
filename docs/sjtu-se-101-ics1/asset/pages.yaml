- pgno: 1226
  md: '# Issues with Writes


    +   - Write hits

    +     - Write through

    +       - Cache updates its copy

    +       - Immediately writes the corresponding cache block to memory

    +     - Write back

    +       - Defers the memory update as long as possible

    +       - Writing the updated block to memory only when it is evicted from the
    cache

    +       - Maintains a dirty bit for each cache line'
  merge: -1
  img_proc: true
- pgno: 1227
  md: '# Issues with Writes


    +   - Write misses

    +     - Write-allocate

    +       - Loads the corresponding memory block into the cache

    +       - Then updates the cache block

    +     - No-write-allocate

    +       - Bypasses the cache

    +       - Writes the word directly to memory

    +   - Combination

    +     - Write through, no-write-allocate

    +     - Write back, write-allocate (modern implementation)'
  merge: -1
  img_proc: true
