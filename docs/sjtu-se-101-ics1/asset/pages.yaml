- pgno: 1128
  md: '# Caches


    +   - Fundamental idea of a memory hierarchy:

    +     - For each K, the faster, smaller device at level K serves as a cache for
    the larger, slower device at level K+1.

    +   - Why do memory hierarchies work?

    +     - Because of locality, programs tend to access the data at level k more
    often than they access the data at level k+1.

    +     - Thus, the storage at level k+1 can be slower, and thus larger and cheaper
    per bit.


    Big Idea: The memory hierarchy creates a large pool of storage that costs as much
    as the cheap storage near the bottom, but that serves data to programs at the
    rate of the fast storage near the top.'
  merge: -1
  img_proc: true
