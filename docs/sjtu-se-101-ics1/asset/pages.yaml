- pgno: 1233
  md: '# Writing Cache-Friendly Code


    +   - Principles

    +     - Programs with better locality will tend to have lower miss rates

    +     - Programs with lower miss rates will tend to run faster than programs with
    higher miss rates'
  merge: -1
  img_proc: true
- pgno: 1234
  md: '# Writing Cache-Friendly Code


    +   - Basic approach

    +     - Make the common case go fast

    +       - Programs often spend most of their time in a few core functions.

    +       - These functions often spend most of their time in a few loops

    +     - Minimize the number of cache misses in each inner loop

    +       - All things being equal'
  merge: -1
  img_proc: true
- pgno: 1235
  md: "# Writing Cache-Friendly Code\n\n(pp. 650)\n\n```\nint sumvec(int v[N])\n{\n\
    \    int i, sum = 0;\n\n    for (i = 0 ; i < N ; i++)\n        sum += v[i] ;\n\
    \    return sum ;\n}\n```\n\nTemporal locality,\nThese variables are usually put\
    \ in registers\n\n| v[i] | i=0 | i=1 | i=2 | i=3 | i=4 | i=5 | i=6 | i=7 |\n|---|---|---|---|---|---|---|---|---|\n\
    | Access order, [h]it or [m]iss | 1[m] | 2[h] | 3[h] | 4[h] | 5[m] | 6[h] | 7[h]\
    \ | 8[h] |"
  merge: -1
  img_proc: true
