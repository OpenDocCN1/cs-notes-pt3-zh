- pgno: 45
  md: '# The C Programming Language


    +   - **C** was developed

    +     - in 1969 to 1973

    +     - by Dennis Ritchie of Bell Laboratories.

    +   - The American National Standards Institute (ANSI)

    +     - ratified the ANSI C standard in 1989.

    +   - The standard defines

    +     - the C language

    +     - and a set of library functions known as the *C standard library*.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# The C Programming Language


    +   - Kernighan and Ritchie describe ANSI C in their classic book

    +     - which is known affectionately as "K&R".

    +   - In Ritchie’s words, C is

    +     - quirky,

    +     - flawed,

    +     - and an enormous success.

    +   - Why the success?'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# The C Programming Language


    +   - *C was closely tied with the Unix operating system*

    +     - C was developed from the beginning as the system programming language
    for Unix.

    +     - Most of the Unix kernel, and all of its supporting tools and libraries,
    were written in C.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# The C Programming Language


    +   - *C was closely tied with the Unix operating system*

    +     - As Unix became popular in universities in the late 1970s and early 1980s,
    many people were exposed to C and found that they liked it.

    +     - Since Unix was written almost entirely in C, it could be easily ported
    to new machines, which created an even wider audience for both C and Unix.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The C Programming Language


    +   - *C is a small, simple language.*

    +     - The design was controlled by a single person, rather than a committee,
    and the result was a clean, consistent design with little baggage.

    +     - The K&R book describes the complete language and standard library, with
    numerous examples and exercises, in only 261 pages.

    +     - The simplicity of C made it relatively easy to learn and to port to different
    computers.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# The C Programming Language


    +   - *C was designed for a practical purpose.*

    +     - C was designed to implement the Unix operating system.

    +     - Later, other people found that they could write the programs they wanted,
    without the language getting in the way.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The C Programming Language


    +   - C is the language of choice for system-level programming

    +   - There is a huge installed base of application-level programs as well.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# The C Programming Language


    +   - However, it is not perfect for all programmers and all situations

    +     - C pointers are a common source of confusion and programming errors

    +     - C also lacks explicit support for useful abstractions such as classes
    and objects

    +     - Newer languages such as C++ and Java address these issues for application-level
    programs'
  merge: -1
  img_proc: true
