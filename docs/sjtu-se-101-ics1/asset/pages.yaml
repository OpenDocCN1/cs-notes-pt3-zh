- pgno: 1080
  md: '# Disk capacity


    +   - Capacity

    +     - maximum number of bits that can be stored

    +     - Vendors express capacity in units of gigabytes (GB), where 1 GB = 10^9.

    +   - Capacity is determined by these technology factors:

    +     - Recording density (bits/in): number of bits that can be squeezed into
    a 1 inch segment of a track.

    +     - Track density (tracks/in): number of tracks that can be squeezed into
    a 1 inch radial segment.

    +     - Areal density (bits/in²): product of recording and track density.'
  merge: -1
  img_proc: true
- pgno: 1081
  md: '# Disk capacity


    +   - Old fashioned disks

    +     - Each track has the same number of sectors

    +   - Modern disks partition tracks into disjoint subsets called recording zones

    +     - Each track in a zone has the same number of sectors, determined by the
    circumference of innermost track

    +     - Each zone has a different number of sectors/track'
  merge: -1
  img_proc: true
- pgno: 1082
  md: '# Computing disk capacity


    ![](img/b3f8b91675c485f1e811aa092ebbf3d4_1082_0.png)


    # Example:


    +   - 512 bytes/sector

    +   - 300 sectors/track (on average)

    +   - 20,000 tracks/surface

    +   - 2 surfaces/platter

    +   - 5 platters/disk


    Capacity = 512 × 300 × 20000 × 2 × 5


    = 30,720,000,000


    = 30.72 GB'
  merge: -1
  img_proc: true
