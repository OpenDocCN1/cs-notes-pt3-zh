- pgno: 1117
  md: '# Locality


    +   - **Principle of Locality:** Programs tend to use data and instructions with
    addresses near or equal to those they have used recently

    +     - Temporal locality

    +       - Recently referenced items are likely to be referenced again in the near
    future

    +     - Spatial locality

    +       - Items with nearby addresses tend to be referenced close together in
    time


    ![](img/b3f8b91675c485f1e811aa092ebbf3d4_1117_0.png)


    ![](img/b3f8b91675c485f1e811aa092ebbf3d4_1117_1.png)'
  merge: -1
  img_proc: true
- pgno: 1118
  md: '# Locality


    +   - All levels of modern computer systems are designed to exploit locality

    +     - Hardware

    +       - Cache memory (to speed up main memory accesses)

    +     - Operating systems

    +       - Use main memory to speed up virtual address space accesses

    +       - Use main memory to speed up disk file accesses

    +     - Application programs

    +       - Web browsers exploit temporal locality by caching recently referenced
    documents on a local disk'
  merge: -1
  img_proc: true
