    \n- 为什么要使用图形用户界面?\n- 一个图形模型\n- 例子\n\n## 为什么要讲图形？\n\n- 图形很常用\n  - 常规PC应用程序的必备\n\
    - 图形的确很有用\n  - 即时反馈\n  - 绘图功能\n  - 显示结果\n- 可用以说明一些有用的概念及技术\n\n## 为什么要讲图形?\n\n\
    - 设计实例丰富,可供学习设计策略与设计技术\n- 图形提供了很多有趣的代码实例\n- 利于解释面向对象程序设计的关键概念及语言特征\n  - 图形不是魔法,其实是一些非常易于理解的面向对象设计\n\
    \  - 因此值得教学\n- 图形很有趣!\n\n## 为什么要使用图形用户界面？\n\n- WYSIWYG\n  - What you see (in your\
    \ code) is what you get (on your screen)\n  - 所见即所得\n- 概念、代码和输出三者之间的直接一致性\n\n\
    ## 一个显示模型\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_810_0.png)\n\n- 对象Objects\
    \ (如Shape) 被附着到Windows对象\n- “显示引擎” 为Windows中的对象调用draw()指令 (例如 “从点x到点y画一条直线”)\n\
    - 对象（如Square）包含一组lines、text等，需要绘制在窗口中\n\n- 一个例子\n```\nint main()\n{\n    using\
    \ namespace Graph_lib;        // use our graphics interface library\n    \n  \
    \  Point tl(100,200);               // a point (obviously)\n    Simple_window\
    \ win(tl,600,400,\"Canvas\"); // make a simple window\n    \n    Polygon poly;\
    \                    // make a shape (a polygon, obviously)\n    poly.add(Point(300,200));\
    \ // add three points\n    poly.add(Point(350,100));\n    poly.add(Point(400,200));\n\
    \    \n    poly.set_color(Color::red); // make the polygon red (obviously)\n \
    \   win.attach(poly);    // connect poly to the window\n    \n    win.wait_for_button();\
    \    // give control to the display engine\n}\n```\n\n- 你将会用到GUI库中已经写好的一些接口类\n\
    \  - 使用流行的GUI 工具包\n    - GUI == Graphical User Interface\n    - FLTK: www.fltk.org\
    \ // Fast Light Tool Kit\n  - 安装等事宜\n    - 参考附录D+多问多学\n      - FLTK\n      - 我们的GUI\
    \ 和图形类\n      - 工程设置\n- 该模型比一般的工具包接口要简单得多\n  - 最简单的FLTK 文档也达370页\n  - 我们的接口类<20\
    \ 个类，不到500 行代码\n  - 可以用这些类写很多代码\n    - 你能创造些什么？\n\n- 代码可方便地移植到任何使用FLTK的平台\n  -\
    \ Windows, Unix, Mac等\n- 该模型易于扩展到大多数常用图形及GUI应用\n- 所给出的这些概念可用于任何一个流行的GUI工具包\n \
    \ - 一旦理解了这些图形类，就会很容易学会任何其他的GUI/图形库\n    - 通常这些库都很庞大\n\nOur code\n\nOur interface\
    \ library\n\nA graphics/GUI library\n(here FLTK)\n\nThe operating system\n(e.g.\
    \ Windows or Linux)\n\nOur screen\n\n即所谓的“分层体系结构”\n\n"
