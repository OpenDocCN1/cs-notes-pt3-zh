  md: "\n## 对于bad()抛出异常\n\n```\n// How to make ist throw if it goes bad:\nist.exceptions(ist.exceptions()|ios_base::badbit);\n\
    ```\n\n```\n// can be read as\n// \"set ist's exception mask to whatever it was\
    \ plus badbit\"\n// or as \"throw an exception if the stream goes bad\"\n```\n\
    \n- 如果这样做了，我们在输入循环就可以不再检查是否是bad状态了，从而可以简化输入循环\n\n## 简化输入循环\n\n```\nvoid fill_vector(istream&\
    \ ist, vector<int>& v, char terminator)\n{\n    // read integers from ist into\
    \ v until we reach eof() or terminator\n    int i = 0;\n    while (ist >> i) v.push_back(i);\n\
    \    if (ist.eof()) return;      // fine: we found the end of file\n\n    // not\
    \ good() and not bad() and not eof(), ist must be fail()\n    ist.clear();   \
