    \ Stanley B. Lippman、 Barbara E. Moo、 Josée LaJoie著，李师贤等人译，人民邮电出版社\n\nThank You!\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1156_0.png)\n\n## 程序设计1\n\nProgramming\
    \ I\n\n## 第28章\n模板3\n\n## Chapter Twenty-eight\nTemplate III\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1157_0.png)\n\
    \n## 内容提纲\n\n- 成员模板\n- 类模板的static成员\n- 模板特化\n- 重载与函数模板\n\n## 成员模板\n\n- 任意类->模板或非模板\n\
    \  - 都可以拥有本身为类模板或函数模板的成员\n  - 这种成员成为成员模板(member template)\n- 在不同(或相同)类型的容器内，元素类型不相同但是互相兼容，则赋值运算必须使用assign函数\n\
    \  - assign的第一个版本用一对迭代器来指定赋值的范围\n  slist1.assign(slist2.begin(), slist2.end());\n\
    \  - assign的第二个版本指定赋值的元素个数和新元素的值\n  slist1.assign(10, \"Hiya!\");\n\n## 成员模板\n\
    \n- 使用迭代器进行初始化的构造函数\n```\nlist<string> slist(svec.begin(), svec.end());\nvector<string>::iterator\
    \ mid = svec.begin() + svec.size()/2;\ndeque<string> front(svec.begin(),mid);\n\
    deque<string> back(mid, svec.end());\n```\n- assign成员和上面的构造函数使我们能够从不同但兼容的元素类型序列，或不同容器类型建立容器\n\
    \n- Queue类的复制构造函数\n  Queue(const Queue &Q):head(0),tail(0){copy_elems(Q);}\n-\
    \ 从vector对象中复制元素创建Queue对象无法实现\n  - 它接受的形参是Queue<Type>的引用\n  - 没有从vector到Queue的转换\n\
    \  - 要想从Queue<short>复制元素到Queue<int>也是不行\n  - 对于赋值操作符也是这样\n- 复制构造器和赋值操作符固定了容器和元素的类型\n\
    \n- 我们将定义构造函数和assign函数成员\n  - 它们接受一对在其他序列中指明范围的迭代器\n  - 这些函数将有一个表示迭代器类型的模板类型形参\n\
    \n```\ntemplate <class Type> class Queue{\npublic:\n    // construct a Queue from\
    \ a pair of iterators on some sequence\n    template <class It> Queue(It beg,\
    \ It end):\n        head(0),tail(0){copy_elems(beg,end);}\n    // replace current\
    \ Queue by contents delimited by the iterators\n    template <class Iter> void\
    \ assign(Iter beg, Iter end){\nprivate:\n    // version of copy to be used by\
    \ assign to copy elems from iterator range\n    template <class Iter> void copy_elems(Iter,\
    \ Iter);\n}\n```\n\n## 成员模板\n\n- 成员模板可以定义在包含它的类或类模板定义的内部或外部\n\n- 在类模板作用域外部定义成员模板时，必须包括两个模板形参表：\n\
    \n```\ntemplate <class T> template <class Iter>\nvoid Queue<T>::assign(Iter beg,\
    \ Iter end)\n{\n    destory();  // remove existing elements in this Queue\n  \
    \  copy_elems(beg, end);\n}\n```\n\n- 第一个模板形参表是类模板的，第二个模板形参表是成员模板的\n\n## 成员模板\n\
    \n- 成员模板遵循与任意其他类成员一样的访问控制\n  - private vs. public\n\n- 与其他成员一样，成员模板只有在程序中使用时才实例化\n\
    \  - 类模板的成员模板的实例化 比 类模板的普通成员函数的实例化要复杂一些\n  - 成员模板有两种模板形参\n    - 由类定义的和由成员模板本身定义的\n\
    \    - 类模板形参由调用函数的对象的类型确定\n    - 成员定义的模板形参的行为与普通函数模板一样\n    - 这些形参都是通过常规模板实参推断而确定\n\
    \n## 成员模板\n\n- 成员模板实例化\n  short a[4] = {0,3,6,9};\n  // instantiates Queue<int>::Queue(short*,\
    \ short*)\n  Queue<int> qi(a, a+4); // copies elems from a into qi\n  vector<int>\
    \ vi(a, a+4);\n  // instantiates Queue<int>::assign(vector<int>::iterator,\n \
    \ //                 vector<int>::iterator)\n  qi.assign(vi.begin(), vi.end());\n\
    \n## 类模板的static成员\n\n- 类模板可以声明static成员\n```\ntemplate <class T> class Foo {\n\
    public:\n    static std::size_t count() {return ctr;}\n    .....\nprivate:\n \
    \   static std::size_t ctr;\n    .....\n}\n```\n\n- Foo类的每个实例都有自己的static成员\n\n\
    - 给定实例的所有对象都共享一个static成员\n\n- Foo<int>的static成员有别于Foo<string>的static成员\n"
