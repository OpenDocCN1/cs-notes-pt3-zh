    \n- 继承以现有的类为基础，复制它，然后通过添加和修改这个副本来创建新类\n- 继承使用基类和派生类的概念表示了类型之间的相似性。一个基类包含其所有派生类共享的特性和行为。\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_737_0.png)\n\n## 继承：复用接口\n\n- 当继承现有类型时，也就创造了新的类型。\n\
