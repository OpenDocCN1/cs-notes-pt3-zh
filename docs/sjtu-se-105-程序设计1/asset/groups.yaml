  - '[PAGE 741]


    # is-a关系


    +   对于继承可能会引发某种争论：


    +   继承应该只覆盖基类的方法（而并不添加在基类中没有的新方法）吗？


    +   如果这样做，就意味着导出类和基类是完全相同的类型，因为它们具有完全相同的接口


    +   结果可以用一个导出类对象来完全替代一个基类对象。这可以被视为“纯粹替代（pure substitution）”，通常称之为“替代法则（substitution
    principle）”'
  - '[PAGE 742]


    # is-a关系


    +   - 在某种意义上，这是一种处理继承的理想方式

    +     - 我们经常将这种情况下的基类与导出类之间的关系称为“is-a”关系

    +     - 因为可以说“一个圆形就是一个几何形状”

    +   - 判断是否继承

    +     - 就是要确定你是否可以用is-a来描述类之间的关系

    +     - 并使之具有实际意义'
  - '[PAGE 743]


    # is-like-a关系


    +   - 有时你必须在导处类型中添加新的接口元素，这样也就扩展了接口并创建了新的类型

    +   - 这个新类型仍然可以替代基类，但是这种替代并不完美

    +     - 因为基类无法访问你新添加的方法

    +   - 这种情况我们可描述为 “is-like-a” 关系

    +     - 新类型具有旧类型的接口，但是它还包含其他方法，所以你不能说它们完全相同'
