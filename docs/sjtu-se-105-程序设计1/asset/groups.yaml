    # 程序编译


    +   - 预处理

    +   - 编译

    +     - 程序被编译后，会生成目标代码，存放在目标文件*.obj中。

    +     - 目标代码即机器代码，是计算机能够识别的指令集合。'
  - '[PAGE 64]


    # 程序链接


    +   - 目标代码不能在计算机上运行

    +     - 目标代码只是个独立的程序段，程序段之间还没有彼此呼应，程序段中用到的C++库代码和其他资源还没挂上

    +   - 为了将成组的目标代码转换为可执行程序，必须进行链接，即将目标代码整合成可执行文件*.exe'
