    # 函数调用


    +   - 函数在运行时被调用。

    +     - 程序控制权被传送给被调用的函数，而当前活动函数的执行被挂起。

    +     - 函数在执行完函数体的最后一条语句或遇到返回语句后完成。

    +     - 当被调用的函数完成时，主调函数在调用语句之后的语句上恢复执行。'
