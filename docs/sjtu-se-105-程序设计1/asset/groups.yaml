    \    Token buffer;       // here is where we keep a Token put back using putback()\n\
    public:\n    Token get();        // get a Token\n    void putback(Token t);  \
    \ // put back a Token\n    Token_stream();     // make a Token_stream that reads\
    \ from cin\n    void ignore(char c);     // discard tokens up to and including\
    \ a c\n};\n```"
