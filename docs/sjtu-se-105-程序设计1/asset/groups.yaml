    # 课程目标


    +   - 教与学

    +     - 基本的编程概念

    +     - 关键的实用技术

    +     - 基本的标准C++工具

    +   - 学习本课程后，你将能够

    +     - 编写小的会话式C++程序

    +     - 阅读更大规模的程序

    +     - 自学许多其他语言的基础知识

    +     - 修“高级”C++程序设计课程

    +   - 学习本课程后，你尚未成为

    +     - 专家级的程序员

    +     - C++语言专家

    +     - 高级库的专家级使用者'
