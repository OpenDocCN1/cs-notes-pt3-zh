  md: "\n## 移除魔幻常量\n\n- 关键问题是\n  - 现在你已经看到了我们前面的代码是多么丑陋\n    - 回去看看吧\n  - 因为我们忘记了，所以编写了这样的代码\n\
    \    - “清理代码”是非常重要的活动\n      - 不只针对学生\n      - 当你做出修改之后，一定要再次测试\n    - 我们应该经常先停止增加新功能，返回去复审代码\n\
    \      - 这样更节约时间\n\n## 使用函数\n\n- 通过使用函数，使每个函数职责都更加明晰\n\n```\nvoid calculate()\
    \  // expression evaluation loop\n{\n    while (cin) {\n        cout << prompt;\n\
    \        Token t = ts.get();\n        while (t.kind == print) t=ts.get(); // first\
    \ discard all \"prints\"\n        if (t.kind == quit) return;      // quit\n \
    \       ts.putback(t);\n        cout << result << expression() << endl;\n    }\n\
    }\n```\n\n```\nint main()\ntry {\n    calculate();\n    keep_window_open();  //\
    \ cope with Windows console mode\n    return 0;\n}\ncatch (runtime_error& e) {\n\
    \    cerr << e.what() << endl;\n    keep_window_open(\"~~\");\n    return 1; }\n\
    catch (...) {\n    cerr << \"exception \\n\";\n    keep_window_open(\"~~\");\n\
    \    return 2; }\n```\n\n```\nswitch (ch) {\n    case quit:\n    case print:\n\
    \    case '(':\n    case ')':\n    case '+':\n    case '-':\n    case '*':\n \
    \   case '/':\n    case '%':\n        return Token(ch); // let each character\
    \ represent itself\n    case '.':      // a floating-point literal can start with\
    \ a dot\n```\n\n## 代码外观布局\n\n```\ncase '0': case '1': case '2': case '3': case\
    \ '4':\ncase '5': case '6': case '7': case '8': case '9':  // numeric literal\n\
    {\n    cin.putback(ch); // put digit back into the input stream\n    double val;\n\
    \    cin >> val;  // read a floating-point number\n    return Token(number,val);\
    \ // \"a number\"\n}\ndefault:\n    error(\"Bad token\");\n}\n}\n```\n\n```\n\
    /* Simple calculator\nRevision history:\n    Revised by Bjarne Stroustrup May\
    \ 2007\n    Revised by Bjarne Stroustrup August 2006\n    Revised by Bjarne Stroustrup\
    \ August 2004\n    Originally written by Bjarne Stroustrup\n      (bs@cs.tamu.edu)\
    \ Spring 2004.\nThis program implements a basic expression calculator.\nInput\
    \ from cin; output to cout.\nThe grammar for input is:\n    Statement:\n     \
    \ Expression\n      ......\nInput comes from cin through the Token_stream called\
    \ ts.\n*/\n\n## 从错误中恢复\n\n- 任何用户错误都会终止程序\n  - 这并不理想\n  - 代码结构\n\n```\nint main()\n\
    try {\n  // ... do \"everything\" ...\n}\ncatch (exception& e) {  // catch errors\
    \ we understand something about\n  // ...\n}\ncatch(...) {  // catch all other\
    \ errors\n  // ...\n}\n```\n\n- 将计算任务从main()中分离\n  - main() 只执行初始化和清理\n\n```\n\
    int main()    // step 1\ntry {\n    calculate();\n    keep_window_open();    \
    \    // cope with Windows console mode\n    return 0;\n}\ncatch (exception& e)\
    \ {        // errors we understand something about\n    cerr << e.what() << endl;\n\
    \    keep_window_open(\"~~\");\n    return 1;\n}\ncatch (...) {              \
    \   // other errors\n    cerr << \"exception \\n\";\n    keep_window_open(\"~~\"\
    );\n    return 2;\n}\n```\n\n- 将读入和计算循环放入calculate() 中，可以简化代码\n\n```\nvoid calculate()\n\
    {\n    while (cin) {\n        cout << prompt;\n        Token t = ts.get();\n \
    \       while (t.kind == print) t=ts.get();    // first discard all \"prints\"\
    \n        if (t.kind == quit) return;            // quit\n        ts.putback(t);\n\
    \        cout << result << expression() << endl;\n    }\n}\n```\n\n- 将处理异常的代码从error()\
    \ 移入calculate()\n\n```\nint main()    // step 2\ntry {\n    calculate();\n   \
    \ keep_window_open();    // cope with Windows console mode\n    return 0;\n}\n\
    catch (...) {    // other errors (don’t try to recover)\n    cerr << \"exception\
    \ \\n\";\n    keep_window_open(\"~~\");\n    return 2;\n}\n```\n\n```\nvoid calculate()\n\
    {\n    while (cin)\n    try {\n        cout << prompt;\n        Token t = ts.get();\n\
    \        while (t.kind == print) t=ts.get();    // first discard all \"prints\"\
    \n        if (t.kind == quit) return;            // quit\n        ts.putback(t);\n\
    \        cout << result << expression() << endl;\n    }\n    catch (exception&\
    \ e) {\n        cerr << e.what() << endl;             // write error message\n\
    \        clean_up_mess();                      // <<< The tricky part!\n    }\n\
    }\n```\n\n- 第一次尝试\n\n```\nvoid clean_up_mess()\n{\n    while (true) {        //\
    \ skip until we find a print\n        Token t = ts.get();\n        if (t.kind\
    \ == print) return;\n    }\n}\n```\n\n- 但是，这不能很好地工作。为什么？\n\n- 考虑输入为：1@$z; 1+3;\n\
    \n- 当因为碰到了@而调用clean_up_mess()时，会调用get，此时得到$，再次是一个“Bad token”，于是错误抛给了main，程序终止\n\
    \n- 在处理错误的代码中不能产生新的错误\n"
