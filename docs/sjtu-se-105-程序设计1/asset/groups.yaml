    \ (这也是缺省格式)\n+     - 科学计数法– 在小数点前有1位，小数点后面有n位，加上一个指数\n+     - 固定位数– 没有指数; 小数点后\
    \ n 位\n\n```\n// simple test:\ncout << 1234.56789 << \"\\t\\t(general)\\n\" //\
    \ \\t\\t to line up columns\n    << fixed << 1234.56789 << \"\\t\\t(fixed)\\n\"\
    \n    << scientific << 1234.56789 << \"\\t\\t(scientific)\\n\";\n```\n\n// results:\n\
    \n+   - 1234.57          (general)\n+   - 1234.567890      (fixed)\n+   - 1.234568e+003\
    \    (scientific)"
  - "[PAGE 468]\n\n+   - 精度(缺省为位)\n+     - 普通格式- 精度是所有数字的个数\n+       - 注意: 普通指示符不是标准规定的,\
    \ 只是在std_lib_facilities.h中规定的\n+     - 科学计数法- 精度是小数点之后的位数\n+     - 固定位数- 精度是小数点之后的位数\n\
    \n```\n// example:\ncout << 1234.56789 << '\\t' << fixed << 1234.56789 << '\\\
    t'\n    << scientific << 1234.56789 << '\\n';\ncout << general << setprecision(5)\n\
    \    << 1234.56789 << '\\t' << fixed << 1234.56789 << '\\t'\n    << scientific\
    \ << 1234.56789 << '\\n';\ncout << general << setprecision(8)\n    << 1234.56789\
    \ << '\\t' << fixed << 1234.56789 << '\\t'\n    << scientific << 1234.56789 <<\
    \ '\\n';\n```\n\n// results (note the rounding):\n1234.57      1234.567890   \
    \   1.234568e+003\n1234.6       1234.56789       1.23457e+003\n1234.5679     \
    \       1234.56789000   1.23456789e+003"
