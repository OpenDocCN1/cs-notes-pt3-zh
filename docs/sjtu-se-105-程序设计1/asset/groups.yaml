    - 很强大！\n\n## 为什么不把所有方法都变成虚函数？\n\n- 虚函数的优点已经很明显了\n- 但是它也有缺点！\n- 主要缺点之一：开销\n  -\
    \ 使用了更多的存储空间\n  - 延迟绑定是 “操作中处理(on the fly)” 的，因此程序运行较慢\n- 因此，虚函数如果不是必需的，则不应该使用\n\
    \n## 扩展类型兼容性\n\n- 假如：\n- Derived是Base的导出类\n  - Derived对象可以赋值给Base类型的对象\n  - 但是反之不可以！\n\
