    const int MAXELTS = 100;\nclass IntSetImpl : public IntSet {\n    int elts[MAXELTS];\n\
    \    int numElts;\npublic:\n    IntSetImpl();\n    void insert(int v);\n    void\
    \ remove(int v);\n    bool query(int v);\n    int size();\n};\n```\n\n# 抽象类\n\n\
    - 典型地，接口在公共头文件(*.h)中定义\n  - 客户端可以引入(include)这个文件\n- 然后，实现在源文件(*.cpp)中定义\n  - 客户端只能链接(link)这个文件\n\
    - 因此，IntSet抽象类的客户端永远都不能看到IntSetImpl类的定义\n\n- 剩下唯一的事情是\n  - 向客户端提供创建新的IntSet的方式\n\
