    # 定义函数模板


    +   - 除了形参类型不同，两个函数完全一样

    +     - 为每种需要比较的类型都编写重复的函数体会显得很麻烦

    +   - 而且，如果事先不知道函数要作用于哪些类型

    +     - 函数有可能会作用于未知类型

    +     - 重复函数体的策略就不适合了

    +   - 此时，可以定义函数模板 function template'
