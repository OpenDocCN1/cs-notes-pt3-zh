    \ table)”\n  - 其中包含一组函数指针\n  - 每个指针指向一个虚函数\n- 这些指针都将初始化为指向恰当的实现\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_701_0.png)\n\
    \n# 虚方法很特殊\n\n- 具有虚方法的类的每个实例都拥有类的状态\n  - 以及一个指向恰当的vtable的指针\n- 所使用的虚函数的实现是与调用函数的对象所对应的实现\n\
    \nfoo\nelts\nnumElts\nvtable\nIntSet vtable\nbar\nelts\nnumElts\nvtable\nMaxIntSet\
    \ vtable\n\n# 虚函数\n\n- 虚函数在编译之前必须实现\n- 否则，在编译时会失败，并报类似下面的错误消息\n  - 对 Class_Name\
    \ 虚表的未定义引用\n\n- 当然，我们可以为虚函数提供一些简单的定义，然后再准备好定义“真正的”版本时，在替换其定义\n\n- 但是这种做法不能应用于纯虚函数\n\
    \  - 纯虚函数不必要定义\n\n- 虚函数强制编译器\n  - 将选择函数实现的工作延迟到运行时\n- 这种函数选择的延迟成为延迟绑定(late binding)\n\
    - 这种将一个函数的多个实现关联起来的机制\n  - 称为多态(Polymorphism)\n- 多态、延迟绑定、虚函数实际上是一回事\n\n# Figure\
    \ 类\n\n- 用于表示若干种图形\n  - 矩形、圆形、椭圆形等\n  - 每个图形都是不同的类\n    - 矩形数据：高、宽、中心点\n    -\
    \ 圆形数据：圆心、半径\n- 所有类都是从同一个父类 Figure 导出的\n- 所需的函数： draw()\n  - 每种图形都有不同方式\n\n# Figure\
    \ 类\n\n- 每个类都需要不同的draw函数\n- 在每个类中都称为draw:\n  rectangle r;\n  circle c;\n  r.draw();\
    \ //调用rectangle类的draw\n  c.draw(); //调用circle类的draw\n- 目前为止，还没有任何新知识点\n\n"
