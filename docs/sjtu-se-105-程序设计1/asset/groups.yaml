    # 定义函数模板


    +   - 模板形参表

    +     - 表示在函数中可以使用的类型或值

    +     - compare函数声明了名为T的类型形参

    +     - compare内部可以使用T引用一个类型

    +     - T表示哪个实际类型由编译器根据所用的函数确定


    +   - 使用函数模板时

    +     - 编译器会推断哪个模板实参绑定到模板形参

    +     - 一旦编译器确定了实际的模板实参，就称它实例化了函数模板的一个实例

    +     - 编译器使用实参代替形参产生并编译该版本的函数

    +     - 编译器为使用的每种类型编写函数'
