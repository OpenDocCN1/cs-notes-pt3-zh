  md: "\n## 赋值操作符\n\n- 但是，lvalue的类实例必须先被销毁\n  - 否则会造成内存泄露\n- 要实现这个目的，需要为IntSet类重新定义赋值操作符\n\
    - 这称为操作符重载\n\n- 赋值操作符\n  - 向其提供目标实例和源实例\n  - 将目标实例变成源实例的一个副本\n\n- 下面是我们定义的赋值操作符：\n\
    \n```\nclass IntSet {\n    // data elements\n    ...\npublic:\n    // Constructors\n\
    \    ...\n    IntSet& operator= (const IntSet& is);\n    ...\n};\n```\n\n- 就像复制构造函数一样\n\
    \  - 赋值操作符接受一个指向常量实例的引用，将其传递给copyFrom\n- 但是，它会返回一个指向拷贝而来的对象的引用\n- 考虑下面的C++表达式\n\
    \  - `x=y=z`\n- 这是一个复合表达式\n  - 由于“=”是自右向左结合的\n  - 因此，首先将z赋值给y，这个表达式产生了新的“y”值\n\
    \  - 然后再赋值给x\n\n- 基本课程中，我们不需要知道：\n  - 为什么赋值操作符会返回 lvalue 的引用\n  - 只需要知道它就是这样做的即可\n\
    - 这里“酷”的是\n  - 由于我们已经写好了 copyFrom\n  - 所以赋值操作符很容易实现\n- 我们只需直接使用 copyFrom 即可\n\n\
    ```\nIntSet& IntSet::operator=(const IntSet &is)\n{\n    if (sizeElts != is.sizeElts)\
    \ {\n        delete [] elts;\n        numElts = is.numElts;\n        elts = new\
    \ int[numElts];\n    }\n    copyFrom(is);\n    return *this;\n}\n```\n\n- 最后一行显得有些奇怪\n\
    - 每个方法都有一个“隐式地(implicit)”局部变量this\n  - this是一个指针，指向在其上调用该方法的当前实例\n- 这一行会对该指针解地址，并返回它所指向的对象的引用\n\
    - 我们不能只返回this\n  - 因为指针与引用并不完全一样\n- 但是，我们必须返回被赋值对象(assigned-to object)的引用\n  -\
    \ 而不是赋值对象(assigned-from object)的引用\n\n## 数组增长\n\n- 我们需要定义 `grow()`\n- `grow` 不需要接受任何引元或返回任何值\n\
    - 它也从来不需要在类的外部被调用\n  - 因此，我们将其作为 private 方法添加到类中\n  - 不接受任何引元并且返回 `void`\n\n```\n\
    class IntSet {\n\n    // data members ...\n    void grow();\n    // EFFECTS: enlarge\
    \ array, preserving current contents\n\npublic:\n    // ...\n}\n```\n\n- 增长看起来很像赋值操作符\n\
    - 它必须执行下面的步骤:\n  - 分配一个更大的数组\n  - 复制较小的数组到较大的数组中\n  - 销毁较小的数组\n  - 修改elts/sizeElts的值为新数组的状态\n\
    \n## grow函数\n\n```\nvoid grow()\n{\n    int *tmp = new int[sizeElts + 1];\n  \
    \  for (int i = 0; i < numElts; i++) {\n        tmp[i] = elts[i];\n    }\n   \
    \ delete [] elts;\n    elts = tmp;\n    sizeElts += 1;\n}\n```\n\n- 这个函数的思想是：\n\
    - 如果数组为空，并且我们想插入新对象\n- 那么就创建一个足够大到能够放下新对象的数组\n- 复制数组中的元素，然后继续\n\n## grow函数的缺陷\n\
    \n- 有可能会导致执行大量的复制操作\n- 假设用户创建了一个容量为 1 的IntSet\n  - 然后向其中插入 N 个元素\n- 在将持有整数个数的上限设置得很紧凑时\n\
    \  - 在最坏情况下，这个函数在不停地进行复制\n- 那么，当我们将数组扩展到可以包括第 N 个元素时\n  - 必须将前 N-1 个元素复制到数组中\n\
    - 当我们将数组扩展到可以包括第 N-1 个元素时\n  - 必须将前 N-2 个元素复制到数组中\n\n- 怎样才能改善这种情况呢？\n- 直觉告诉我们\n\
    \  - 我们没有在每次复制数组时扩展足够多的空间\n- 我们是复制了N个元素，但是只多扩展了一个空位\n- 因此，可以为需要复制的N个元素扩展更多的空位\n\
    - 这就可以极大地减少执行复制的次数\n\n- 下面是一个新版本的grow函数\n- 它只是对旧版本进行了稍微的改动\n  - 但是其性能特性就完全不同了\n\
    \n```\nvoid grow()\n{\n    int *tmp = new int[sizeElts * 2];\n    for (int i =\
    \ 0; i < numElts; i++) {\n        tmp[i] = elts[i];\n    }\n    delete [] elts;\n\
    \    elts = tmp;\n    sizeElts *= 2;\n}\n```\n\n- 唯一的不同就是数组扩展了两倍而不是一个空位\n\n- 在最坏情况下，我们要复制N-1个元素以便插入第N个元素\n\
    - 但是，在此次复制之前的那次复制中\n  - 我们为了插入第 N/2 个元素，复制了前(N/2-1)个元素\n- 依此类推，总共的复制数量为：\n  -\
    \ T=(N-1)+(N/2-1)+(N/4-1)+(N/8-1)+......\n- 我们可以将每一步的\"-1\"项省略\n  - T< N+N/2+N/4+N/8+......\n\
    \n- 因此，这里的根本问题是\n  - 在公式右边终结前到底有多少项\n- 公式右边最终会终结\n  - 因为我们只复制了有限个数的整数\n- 从合并项开始计算：\n\
    \  - T < N+(N/2+N/4)+N/8+...\n  - < N+3N/4+N/8+...\n  - < N+(3N/4+N/8+...\n  -\
    \ < N+7N/8+...\n\n依此类推\n\n- 公式T < N + N/2 + N/4 + N/8 + ...\n- 右边是一个等比数列\n  -\
    \ 每一项都是前一项的1/2\n- 等比数列的前n项和为\n\n$$\\sum_{i=0}^{n-1} a * r^{i} = a * \\frac{1 -\
    \ r^{n}}{1 - r}$$\n\n- 其中 a=N， r=1/2\n- 当 n 变大时， r^n 项就会变小，所以可以忽略它\n- 这样，就可得 T\
    \ < N(1)/(1-1/2) = N*2\n\n- 程序设计 I\n- *Programming I*\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1087_0.png)\n\
    \nThank You!\n\n程序设计 I\n\nProgramming I\n\n## 第26章 模板1（Chapter Twenty-six Template\
    \ I）\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1088_0.png)\n"
