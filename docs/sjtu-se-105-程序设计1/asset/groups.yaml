    \ << \"\\t\\t(scientific)\\n\";\n```\n\n// results:\n\n- 1234.57          (general)\n\
    - 1234.567890      (fixed)\n- 1.234568e+003    (scientific)\n\n- 精度(缺省为位)\n  -\
