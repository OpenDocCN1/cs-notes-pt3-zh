    \      $factorial(0)=1$\n+   \n+     - 其次，其他情况可以按照如下方式解决：\n+       - 先解决更小的问题，它更接近终止情况\n\
    +       - 再在这个更小问题的处理结果上执行简单的附加操作，得到“更大”的结果\n+       - 这就是递归步骤（recursive step），或称为归纳步骤"
