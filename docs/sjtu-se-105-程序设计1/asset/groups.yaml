    \  - 因此，转型为一个基类就是在继承图中向上移动，即“向上转型（upcasting）”\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_745_0.png)\n\
    \n## 类机制的问题\n\n- 在类定义中包含这些内容有两个副作用\n  - 它使类定义变得复杂了\n    - 使得它较难被阅读和理解\n    - 考虑一下使用数组的\
    \ `IntSet` 实现\n  - 它将部分信息暴露给了程序员\n    - 而这些内容不应该暴露给程序员\n\n- 第二个问题会产生非常严重的后果\n\n\
    ## 类机制的问题\n\n- 例如：\n- 如果使用这个类的程序员错误地\n  - 做出假设，认为我们的实现应该会提供某种“操作”\n  - 但是这个类的接口并没有做出这样的承诺\n\
    - 那么我们就会陷入麻烦之中\n- 我们有什么办法吗？\n\n- 我们希望提供这样的类定义：\n  - 不会将任何实现细节暴露给客户端程序员\n  - 只包含接口信息\n\
