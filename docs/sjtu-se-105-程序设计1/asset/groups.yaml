    ```cpp\ntemplate <>\nint compare<const char*>( const char* const & v1,\n  const\
    \ char* const &v2)\n{  return strcmp(v1,v2);\n}\n```\n\n- 特化的声明必须与对应的模板相匹配\n\n\
    ```cpp\nconst char *cp1 = \"world\", *cp2 = \"hi\";\nint i1, i2;\ncompare(cp1,\
    \ cp2); // calls the specialization\ncompare(i1, i2); // calls the generic version\
    \ inst. with int\n```\n\n- 模板特化的作用域\n\n```cpp\ntemplate <class T>\n\nint compare(const\
    \ T& t1, const T& t2) { ...... }\n\nint main() {\n    // uses the generic template\
    \ definition\n    int i = compare(\"hello\", \"world\");\n}\n\n// invalid program:\
    \ explicit specialization after call\ntemplate <>\nint compare<const char*>( const\
    \ char* const & v1,\n                          const char* const &v2)\n{ ......\
    \ }\n```\n\n### 类模板特化\n\n- 支持 C 风格字符串的 Queue\n\n```cpp\ntemplate <> class Queue<const\
    \ char*> {\npublic:\n    void push(const char*);\n    void pop() { real_queue.pop();\
    \ }\n    bool empty() const { return real_queue.empty(); }\n    // note: return\
    \ type does not match template parameter type\n    std::string front() { return\
    \ real_queue.front(); }\n    const std::string front() const { return real_queue.front();\
    \ }\nprivate:\n    Queue<std::string> real_queue; // forward calls to it\n};\n\
    ```\n\n- 在类特化外部定义成员时，成员之前不能加 `template<>` 标记\n\n```cpp\nvoid Queue<const char*>::push(const\
    \ char* val)\n{\n    return real_queue.push(val);\n}\n```\n\n- 这个函数隐式地复制了 `val`\
    \ 指向的字符数组\n  - 该调用从 `const char*` 实参创建了一个新的 `string` 对象\n  - `const char*` 实参使用了以\
    \ `const char*` 为参数的 `string` 构造函数\n  - `string` 构造函数将 `val` 所指的数组中的字符复制到未命名的\
    \ `string` 对象\n  - 该对象被存储在 `push` 到 `real_queue` 的元素中\n\n### 特化成员\n\n- Queue 的特化可以简化\n\
    \  - 只特化 `push` 和 `pop` 函数\n  - `push` 特化为复制字符数组\n  - `pop` 特化为释放副本所用的内存\n\n```cpp\n\
    template <>\nvoid Queue<const char*>::pop(){\n    QueueItem<const char*> *p =\
    \ head;\n    // delete the array allocated in push\n    delete head->item;\n \
    \   head = head->next;\n    delete p;\n}\n```\n\n```cpp\ntemplate <>\nvoid Queue<const\
    \ char*>::push(const char* const &val){\n    char* new_item = new char[strlen(val)+1];\n\
    \    strncpy(new_item, val, strlen(val)+1);\n    QueueItem<const char*>* pt =\n\
    \        new QueueItem<const char*>(new_item);\n    if (empty())\n        head\
    \ = tail = pt;\n    else{\n        tail->next = pt;\n        tail = pt;\n    }\n\
    }\n```\n\n- 类类型 `Queue<const char*>` 将从通用类模板定义实例化而来\n  - `push` 和 `pop` 函数例外\n\
    - 调用 `Queue<const char*>` 对象的 `push` 和 `pop` 函数时\n  - 将调用特化版本\n  - 调用任意其他成员时，将从类模板为\
    \ `const char*` 实例化一个通用版本\n\n### 类模板的部分特化\n\n- 特化某些模板形参而非全部\n\n```cpp\ntemplate\
    \ <class T1, class T2>\nclass some_template {\n    .....\n}\ntemplate <class T1>\n\
    class some_template <T1, int> {\n    .....\n}\n```\n\n- 类模板的部分特化本身也是模板\n- 部分特化的模板形参表只列出未知模板实参的那些形参\n\
    - 部分特化是在程序中使用时隐式实例化的\n\n```cpp\nsome_template <int, string> foo; // uses template\n\
    some_template <string, int> bar; // uses partial template\n```\n\n- 形参为 `string`\
    \ 和 `int` 的 `some_template` 既可以从普通类模板定义实例化，也可以从部分特化实例化\n  - 编译器将为实例化选择最特化的模板定义\n\
    \  - 部分特化的定义与通用模板的定义完全不会冲突\n"
