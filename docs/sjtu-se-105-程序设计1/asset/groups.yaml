    \ << setprecision(8)\n    << 1234.56789 << '\\t' << fixed << 1234.56789 << '\\\
    t'\n    << scientific << 1234.56789 << '\\n';\n```\n\n// results (note the rounding):\n\
    1234.57      1234.567890      1.234568e+003\n1234.6       1234.56789       1.23457e+003\n\
