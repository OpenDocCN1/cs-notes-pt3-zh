    +   - 内存分配工作正如我们所期望的那样

    +     `int *ia = new int[5]`

    +     - 这会在堆中创建一个包含5个整数的数组

    +     - 并在ia中存储一个指向该数组第一个元素的指针

    +   - 与单个整数一样

    +     - 整数数组不必初始化'
