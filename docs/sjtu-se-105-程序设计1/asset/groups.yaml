  md: "\n- 同理，执行：\n\n```\nreturn fact_helper(1,6)\n```\n\n接着\n\n```\nreturn fact_helper(0,6)\n\
    ```\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_358_0.png)\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_358_1.png)\n\
    \n- 将新版本转换成迭代版本：\n```c\nint fact_helper(int n, int result){\n    if (n == 0) {\n\
    \        return result;\n    }\n    else {\n        return fact_helper(n-1, result\
    \ * n);\n    }\n}\n```\n\n问题：递归不变式是什么？\n n! * result = num!\n\n```\nint factorial(int\
    \ num)\n{\n    return fact_helper(num, 1);\n}\n```\n\n## 递归→迭代\n\n- 1 复制函数类型签名\n\
    - 迭代版本与递归版本必须有完全一致的类型签名\n\n```\nint factorial(int num)\n{\n    ......\n}\n```\n\
    \n## ◆ 2 标识“循环变量”\n\n- 在helper 函数中有两个形式参数：`n` 和 `result`\n  - 这些形参在每次递归调用时都会变化\n\
    \n- 因此，在迭代版本中有两个循环变量：\n\n```\nint factorial(int num)\n{\n    int n = ...;\n  \
    \  int result = ...;\n    ......\n}\n```\n\n- ◆ 3 编写初始化代码\n  \n  - 循环变量只是形参\n\
    \  - 对 helper 函数的第一次调用来自 “主” 递归函数\n    - 主递归函数选择的初始值就是我们要来初始化的值：\n```c\nint factorial(int\
    \ num)\n{\n    int n = num;\n    int result = 1;\n    ......\n}\n```\n\n## 4 终止/返回\n\
    \n- 首先确定使用哪种循环\n- 循环语句之间没有本质差异\n- 对于尾递归来说，while循环是最容易实现的\n- 尾递归中的基本情况就是循环的终止条件\n\
    - 基本思想：\n  - 循环遍历问题的每个实例\n  - 在基本情况下终止\n\n## 5 循环体\n\n- 将条件语句中的递归分支转换为循环体\n- 首先，必须理解\n\
    - 尾递归调用被调用时实际做了些什么\n- 再次检查递归中调用栈的情况：\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_367_0.png)\n\
    \n## 5 循环体\n\n- 实际上，n和result被重新赋值\n  n = n - 1\n  result = n * result\n- 直接照搬这两条语句到循环体中是否可以？\n\
    \  - n 如果先递减，那么result将使用n递减后的值\n\n## 5 循环体\n\n- 在递归重新赋值中：\n  - 先一次性计算所有新值\n  -\
    \ 然后赋值给变量\n  - 这就是函数调用的语义\n  - 但是，在C++语句中，每次只能计算一个\n\n- 为了解决这个问题\n  - 需要构建这些赋值语句的依赖图（dependency\
    \ graph）\n  - 这个图可以说明新值与旧值之间的依赖\n\n## 5 循环体\n\n- 构建依赖图：\n  - 每个变量表示为一个顶点\n  -\
    \ 如果在计算变量 foo 的新值时读取了 bar 的值，则\n    - 画一条从 foo 到 bar 的有向边\n    - 不要画顶点到自身的边，例如\
    \ i = i + 1\n\n## 5 循环体\n\n- 构建依赖图:\n  - 在阶乘例子中:\n    - 在计算 n 的新值时，只读取了 n 自身的值\n\
    \    - 而在计算 result 的新值时，读取了 result 自身和 n 的值\n  - 我们忽略自引用，因此依赖图为:\n    - n ← result\n\
    \n## 5 循环体\n\n- 依赖图处理:\n  - 如果对于一个变量，没有任何边以它为终点\n    - 可以编码对其赋值，\n    - 并删除它以及以它为起点的边\n\
    \n## ◆ 5 循环体\n\n- 依赖图处理：\n\n编写循环体第一行代码\n\n```\nint factorial(int num)\n{\n   \
    \ int n = num; result = 1;\n    while (n!=0) {\n        result *= n;\n       \
    \ ....\n    }\n    return result;\n}\n```\n\n## 5 循环体\n\n- 依赖图处理：\n  - 在阶乘例子中：\n\
    \    - result 被删除，与result相关的边被删除\n    - 依赖图变为：\n      - n\n\n## 5 循环体\n\n- 依赖图处理：\n\
    \  - 没有任何边以顶点n为起点，因此编写循环体第二行代码\n\n```\nint factorial(int num) {\n    int n = num;\
    \ result = 1;\n    while (n!=0) {\n        result *= n;\n        n--;\n    }\n\
    \    return result;\n}\n```\n\n## 5 循环体\n\n- 依赖图处理：\n  - 现在依赖图为空，编程完成\n  - 棘手情况：\n\
    \    - 依赖图中有环\n    - 例如：\n\n```\nfoo_helper(int bar, int baz){\n    ...\n    foo_helper(baz-1,\
    \ bar-1);\n}\n```\n\n## ◆ 5 循环体\n\n- 依赖图处理：\n  - bar 和 baz 互相依赖：`bar ↔ baz`\n\
    \  - 不能先更新其中任何一个\n  - 解决办法：\n    - 引入“影子”变量，在赋值之前保存“新”值\n\n```\nint bar_new =\
    \ baz-1;\nint baz_new = bar-1;\nbar = bar_new;\nbaz = baz_new;\n```\n\n## 5 循环体\n\
    \n- 依赖图处理：\n  - 通过引入“影子”变量可以解决问题\n    - 将依赖图中的环打破\n  - 但是，影子变量增加了程序的阅读难度\n   \
    \ - 应该尽量避免使用\n\n- 循环是非常强大的构建程序解决方案的方法\n- 尾递归：\n  - 无需对递归调用返回的结果再执行挂起的操作\n- 普通递归\n\
    \  - 与尾递归情况不同\n- 例如，下面的函数就是尾递归：\n  `int f(int x) { return f(x-1); }`\n- 但是下面的函数就不是：\n\
    \  `int f(int x) { return f(x) - 1; }`\n\n- 尾递归解决方案的本质：\n  - 只需要“常量内存空间”\n   \
    \ - 无论要解决的问题多“大”，只需要固定数量的栈内存帧\n- 对于迭代解决方案也是如此\n- 实际上，两个版本的factorial()非常相似\n- 这种相似性不是偶然的\n\
    - 对于任何尾递归函数，都可编写出等价的迭代版本\n- 换句话说，尾递归“只是”迭代\n\n## 总结\n\n- 这种等价性对于普通递归程序来说并不成立\n\
    \  - 特别是，有些递归程序不能用常量内存空间来解决，例如，树的遍历问题\n\n- 应该尽量以尾递归方式编写递归程序\n- 如果某个递归不是尾递归（就像第一个版本的\
    \ factorial）\n  - 必须引入一个助手函数，将其改写成尾递归\n\n- 程序设计 I\n- *Programming I*\n\nThank\
    \ You!\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_383_0.png)\n"
