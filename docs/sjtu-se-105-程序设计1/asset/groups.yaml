    ```cpp\nFoo<int> fi, fi2; // instantiates Foo<int> class\nsize_t ct = Foo<int>::count();\
    \ // instantiates Foo<int>::count\nct = fi.count(); // ok: uses Foo<int>::count\n\
    ct = fi2.count(); // ok: uses Foo<int>::count\nct = Foo::count(); // error: which\
