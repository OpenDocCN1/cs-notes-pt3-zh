    \     // read a character, hopefully terminator\n    if (c != terminator) {  \
    \    // ouch: not the terminator, so we must fail\n        ist.unget();      \
    \      // maybe my caller can use that character\n        ist.clear(ios_base::failbit);\
    \ // set the state back to fail()\n    }\n}\n```\n\n## 处理所有情况：**超级复杂！**\n\n```cpp\n\
