  - '[PAGE 9]


    # 为什么选择C++？


    +   - 学习编程必须选择一种编程语言

    +   - 编程语言的目的是让我们能够用代码来表示自己的思想

    +   - C++ 能够让我们在绝大多数应用领域表示自己的思想

    +   - C++ 是在工程领域应用得最广的编程语言之一

    +     - http://www.research.att.com/~bs/applications.html'
  - '[PAGE 10]


    +   - C++ 由ISO标准准确而全面地定义

    +     - 而该标准几乎被一致接受

    +   - C++ 可以在几乎所有类型的计算机上使用

    +   - 在使用C++学习到的编程概念可以直接应用于其他语言

    +     - 包括C、Java、C# 和 Fortran'
  - '[PAGE 11]


    +   - 第1部分 基础知识 30hrs

    +     - 1. 编程基本概念

    +     - 2. 数据类型与操作符

    +     - 3. 计算与语句

    +     - 4. 计算实例1：排序和搜索

    +     - 5. 函数与命名空间

    +     - 6. 指针与引用

    +     - 7. 错误处理

    +     - 8. 计算实例2：分解与抽象

    +     - 9. 递归函数

    +     - 10. 函数重载

    +     - 11. I/O

    +     - 12. 定制I/O

    +     - 13. 类

    +     - 14-15. 基础知识综合运用：命令行计算器'
  - '[PAGE 12]


    +   - 第2部分 OO扩展部分 18hrs

    +     - 16. 子类化

    +     - 17. 虚函数

    +     - 18. 纯虚函数

    +     - 19. 类编程实例1：图书馆

    +     - 20. FLTK图形库的使用

    +     - 21. FLTK图形库的设计：接口与实现分离

    +     - 22. 基于FLTK的GUI交互式程序设计

    +     - 23. MFC和QT的图形化设计与FLTK的对比

    +     - 24. 类编程实例2：图形化计算器'
  - '[PAGE 13]


    +   - 第3部分 高级话题 14hrs

    +     - 25. 自由存储

    +     - 26-28. 模板：函数模板和类模板

    +     - 29. 容器类

    +     - 30. 异常机制深入探讨

    +     - 31-32. 程序设计综合实例'
  - '[PAGE 14]


    # 授课特点


    +   - 详细

    +     - 对课程中用到的知识点都进行充分地解释，以求大家真正理解

    +     - 排除任何“魔幻”知识点

    +   - 实用

    +     - 只解释有用的概念、结构和技术

    +     - 不会详细解释所有的犄角旮旯

    +   - 完备

    +     - 课程中介绍的概念、结构和技术可组合使用以构建有用的程序

    +     - 本课程之外当然还有许多有用的概念、结构和技术'
  - '[PAGE 15]


    # 授课特点


    +   - 写实

    +     - 课程中介绍的概念、结构和技术可以用来构建 “工业级” 的程序

    +   - 简单

    +     - 课程中所使用的都是可以阐释所涉及概念、结构和技术的最简单实用的实例

    +   - 可扩展

    +     - 课程中讲授的概念、结构和技术可以应用于构建大型、可靠和高效的程序'
