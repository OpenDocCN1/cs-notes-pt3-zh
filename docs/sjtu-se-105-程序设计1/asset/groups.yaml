    +   - void*指的是“指向那些编译器不知道是什么类型内容的指针”

    +   - 我们使用void*，可以在两端相互不知道对方类型的代码片段间传递内存地址——当然程序员自己得知道具体的类型

    +     - 例: 一个回调函数的参数

    +   - 没有void类型的对象

    +     `void v;    // 错误

    +     void f();   // f() 什么都不返回 - f() 不会返回void类型的对象`

    +   - 指向任何类型的指针都可以被赋值给void*

    +     `int* pi = new int;

    +     double* pd = new double[10];

    +     void* pv1 = pi;

    +     void* pv2 = pd;`'
  - "[PAGE 1041]\n\n+   - 使用void*时，我们必须自己告诉编译器它到底指向的是什么\n\n```\nvoid f(void* pv)\n\
    {\n    void* pv2 = pv;      // 拷贝没有问题 (拷贝就是void* s用途)\n    double* pd = pv;  \
    \   // 错误： 不能将void*转化成double*\n    *pv = 7;             // 错误： 不能对void*解引用\n \
    \                        // int 7 不能像double那样用7.0表示\n    pv[2] = 9;          \
    \  // 错误： 不能对void*使用下标\n    pv++;                 // 错误： 不能自增\n    int* pi = static_cast<int*>(pv);\
    \    // ok: 显示转换\n    // ...\n}\n```\n\n+   - static_cast能够被用于显式将指针转化到某个对象类型\n\
    +     - “static cast”是故意为一个危险的操作取的名字——只有当万不得已时才使用它"
