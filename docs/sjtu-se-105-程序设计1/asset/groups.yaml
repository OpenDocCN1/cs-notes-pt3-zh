  md: "\n## 结构与类\n\n- 结构\n  - 典型地，所有成员都是public的\n  - 没有成员函数\n- 类\n  - 典型地，所有数据成员都是private的\n\
    \  - 接口成员函数都是public的\n\n## 对对象的思考\n\n- 聚焦程序设计上的变化\n  - 之前→算法为中心\n  - OOP → 数据为中心\n\
    - 算法依然存在\n  - 它们聚焦在数据上\n  - 被“制造”出来去“适应”数据\n- 设计软件解决方案\n  - 定义各种各样的对象以及它们之间的交互\n\
    \n## 子类型\n\n- 如果编写的程序被证明非常好，但是想在其中添加新特性，这时怎么办？\n  - 直接修改这个程序吗？\n  - 或者创建该程序的一个副本，然后在这个副本上修改\n\
    \  - 以使得该程序可以被复用？\n- 在现实生活中，我们都想将一样事物扩展为另一样事物\n- 在程序设计中\n  - 我们通过子类型化(sub-typing)来实现此目的\n\
    \n## 子类型\n\n- 如果我们有两个类型 S 和 T\n- S 是 T 的子类型，记作 S<:T，当且仅当：\n  - 对于希望是 T 类型对象的任何实例\n\
    \  - 都可以向其提供 S 类型的对象\n    - 不需要修改原来的任何计算代码以保证程序的正确性\n- 如果 S 是 T 的子类型，那么：\n  -\
    \ T 类型的对象可以被 S 类型的对象所替换\n    - 并没有改变程序的任何属性，例如正确性\n\n- 如果 S<:T，那么也可以说：\n  - T\
    \ 是 S 的超类型(supertype)\n- 超类型 不能 替换 子类型\n  - 所有的苹果都是水果，但是并非所有水果都是苹果\n- 这与类型转换不同\n\
    - 例如：\n  - 当需要 double 类型时\n  - 可以将 int 转换为 double，从而改变 int 的物理表示\n- 在需要使用超类型的地方使用子类型\n\
    \  - 并不会将其转换为超类型，而是将其当做超类型使用\n\n## 子类型示例代码\n\n- `istream` 是 `ifstream` 的超类型，`ifstream`\
    \ 是 `istream` 的子类型\n  - `ifstream` 可以替换 `istream`，并且不会改变程序的正确性\n\n```\nvoid add(istream\
    \ &source) {\n    int n1, n2;\n    source >> n1 >> n2;\n    cout << n1+n2;\n}\n\
    ```\n\n- 下面两种情况都是合法的：\n  1. `add(cin);`\n  2. `ifstream inFile;`\n     `add(inFile);`\n\
    \n- C++拥有支持子类型化的机制\n  - 成为子类化(subclassing)，有时也称为继承(inheritance)\n- 其基本思想是：\n \
    \ - 如果有一个ADT类foo\n  - 并且需要创建其子类型bar，那么就可以声明：\n- 这在声明：\n  - bar是一个foo，可能还包含额外的状态\n\
    \  - 并且可能还包含新的或重定义的成员函数\n\n- 例如：\n```cpp\nclass MaxIntSet : public IntSet {\n\
    // OVERVIEW: a set of non-negative integers, |set| <= 100\npublic:\nint max();\n\
    // REQUIRES: set is non-empty\n// EFFECTS: returns the largest element in set\n\
    };\n```\n\n## MaxIntSet\n\n- 这是一个拥有IntSet所有行为的新类型\n  - 并且还增加了一个操作\n    - 返回最大的元素\n\
    - 我们声明这个MaxIntSet是一个“导出类(derived class)”\n  - 并且是从IntSet导出的\n- 它自动继承了IntSet的所有方法和数据成员\n\
    \n## 如何定义MaxIntSet\n\n- 必须实现MaxIntSet::max()\n- 但是，MaxIntSet::max()不是IntSet的成员\n\
    - IntSet的定义如下：\n```\nclass IntSet  // OVERVIEW: a mutable set of integers\npublic:\n\
    \    void insert(int v);  // MODIFIES: this\n                        // EFFECTS:\
    \ this = this + {v}\n    void remove(int v); // MODIFIES: this\n             \
    \           // EFFECTS: this = this - {v}\n    bool query(int v);   // EFFECTS:\
    \ returns true if v is in this\n    int size();          // EFFECTS: returns |this|\n\
    ;\n```\n- IntSet的所有数据成员都是私有的\n\n## 如何定义MaxIntSet\n\n- 私有意味着它们只对这个类的其他成员是可见的\n\
    - IntSet中的所有数据成员对于下列成员是不可访问的\n  - MaxIntSet类的成员实现\n  - 特别是MaxIntSet::max()\n-\
    \ max()不是IntSet的一部分\n  - 它只是MaxIntSet的一部分\n\n## 如何定义MaxIntSet\n\n- 我们仍旧可以实现下面这个版本：\n\
    \n```\nint MaxIntSet::max() {\n    int i;\n    for (i=INT_MAX; i>=INT_MIN; i--)\
    \ {\n        if (query(i)) return i;\n    }\n}\n```\n\n- 这是一个非常搞笑的实现！\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_678_0.png)\n\
    \n- 如果一个成员是protected的，那就意味着：\n  - 它可以被这个类以及所有的导出类的成员访问\n\n```\nconst int MAXELTS\
    \ = 100;\nclass IntSet {\n    // a mutable set of integers, |set| <= MAXELTS\n\
    \    protected:\n    /* all of the data members plus indexOf */\n    int elts[MAXELTS];\n\
    \    int numElts;\n    public:\n    /* the public interface */\n};\n```\n\n```\n\
    int MaxIntSet::max(){\n    return elts[numElts-1];\n}\n```\n\n- MaxIntSet定义如下:\n\
    \  class MaxIntSet : public IntSet {\n  // OVERVIEW: a mutable set of integers,\
    \ |set| <= 100\n  public:\n      int max();\n      // REQUIRES: set is non-empty\n\
    \      // EFFECTS: returns the largest element in set\n\n## 对于有序的IntSet\n\n- 一切看起来都不错了\n\
    \  - 是否的确如此呢?\n- 天下没有免费的午餐\n\n- 如果将IntSet的实现暴露给MaxIntSet\n  - 那么改变其实现就会导致MaxIntSet也会随之变化\n\
    - 例如\n  - 如果我们将IntSet从有序的实现版本转换到无序的版本\n  - MaxIntSet::max()就会返回错误的值\n  - 更糟糕的是，它可以正确地编译，你无法知道这一点\n\
    - Protected 数据成员使得导出类变得异常脆弱\n  - 这使得我们需要好好考虑是否值得这么做\n\n## 扩展功能\n\n- 如果需要多个方法该怎么办呢？\n\
    - 例如，我们希望能够在MaxIntSet中处理空集合\n- 通过修改新的导出类中的方法\n  - 或者重载/重定义这些方法\n"
