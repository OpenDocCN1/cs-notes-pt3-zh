  - '[PAGE 267]


    # 自动对象


    +   - 自动对象所在存储区从声明它的函数被调用时开始，一直直到该函数结束为止

    +     - 自动对象的存储分配发生在定义它的函数被调用时，分配给自动变量的存储区来自于程序的运行栈

    +       - 自动对象需要被显式初始化，未经初始化的变量的值可能是任意的

    +     - 在函数结束时，它的活动记录被从运行栈中弹出，与该自动对象相关联的存储区被真正释放，它包含的任何值都被抛弃

    +       - 自动对象的地址不应该被作为函数的返回值。

    +       - 当一个自动变量的地址被存储在一个生命周期长于它的指针时，该指针被称为空悬指针'
