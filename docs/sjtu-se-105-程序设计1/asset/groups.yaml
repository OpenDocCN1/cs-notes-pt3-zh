    \      // attach axis xa to the window\nwin.wait_for_button();\n```\n\n## 添加 X\
    \ 轴\n\nCanvas #2\n\nNext\n\nx axis\n\n```\nwin.set_label(\"Canvas #3\");\n\nAxis\
