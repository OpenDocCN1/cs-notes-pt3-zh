    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_961_0.png)\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_961_1.png)\n\
    \n## 层的实例\n\n- 提供服务\n- 使用服务\n\n- 窗口\n  - 有两个按钮Button、两个输入框In_box和一个输出框Out_box\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_962_0.png)\n\n## GUI 实例\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_963_0.png)\n\
    \n- 在输入框In_box中输入一个点\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_964_0.png)\n\n\
    - 当用户点击 ‘next point’ 按钮时候，这个当前的位置变成(x,y)，同时在输出框Out_box中显示\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_965_0.png)\n\
    \n- 添加另外的点，这样就形成了一条直线\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_966_0.png)\n\
    \n- 三个点就形成了两条线\n  - 显然，我们在构造折线\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_967_0.png)\n\
    \n- 以此类推，直到点击 Quit 为止\n\n## 界面元素和实现\n\n- 我们在窗口中看到按钮，输入框和输出框\n  - 我们如何定义一个窗口？\n\
    \  - 我们如何定义按钮？\n  - 我们如何定义输入框和输出框？\n- 点击按钮，然后相应事件发生\n  - 我们如何对动作进行编码？\n  - 我们如何将代码和按钮连接到一起？\n\
    - 用户在输入框中输入信息\n  - 我们如何在代码中得到输入的信息？\n  - 我们如何将字符串转换成数字？\n- 我们看到了输出框里的输出\n  - 我们如何将值输出到那里？\n\
    - 线段出现在窗口中\n  - 我们如何保存线段？\n  - 我们如何绘制线段？\n\n## 映射\n\n- 我们将自己的想法映射到传统的图形/GUI思想的FLTK版本上\n\
    \n```cpp\nstruct Lines_window : Window    // Lines_window inherits from Window\n\
    {\n    Lines_window(Point xy, int w, int h, const string& title); // declare constructor\n\
    \    Open_polyline lines;\n\nprivate:\n    Button next_button;               \
    \ // declare some buttons – type Button\n    Button quit_button;\n    In_box next_x;\
    \                     // declare some i/o boxes\n    In_box next_y;\n    Out_box\
    \ xy_out;\n\n    void next();                       // what to do when next_button\
    \ is pushed\n    void quit();                       // what to do when quit_button\
    \ is pushed\n\n    static void cb_next(Address, Address window);    // callback\
    \ for next_button\n    static void cb_quit(Address, Address window);    // callback\
    \ for quit_button\n};\n```\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_971_0.png)\n\
    \n- 窗口\n  - 有两个按钮、两个输入框和一个输出框\n\n## Lines_window 构造函数\n\n```cpp\nLines_window::Lines_window(Point\
    \ xy, int w, int h, const string& title)\n:Window(xy,w,h,title),\n    // construct/initialize\
    \ the parts of the window:\n    // location        size        name        action\n\
    \    next_button(Point(x_max()-150,0), 70, 20, \"Next point\", cb_next),\n   \
    \ quit_button(Point(x_max()-70,0), 70, 20, \"Quit\", cb_quit),    // quit button\n\
    \    next_x(Point(x_max()-310,0), 50, 20, \"next x:\"),                // io boxes\n\
    \    next_y(Point(x_max()-210,0), 50, 20, \"next y:\"),\n    xy_out(Point(100,0),\
    \ 100, 20, \"current (x,y):\")\n{\n    attach(next_button);    // attach the parts\
    \ to the window\n    attach(quit_button);\n    attach(next_x);\n    attach(next_y);\n\
    \    attach(xy_out);\n    attach(lines);          // attach the open_polylines\
    \ to the window\n}\n```\n\n"
