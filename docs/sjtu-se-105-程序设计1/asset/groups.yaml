    \   - 我们必须保证派生类实现这些函数\n+     - 使它成为纯虚函数 (=0)\n\n+   - 以下代码说明了我们如何定义真正的抽象接口（纯接口）\n\
    \n```\nstruct Engine {        // interface to electric motors\n\n    // no data\n\
