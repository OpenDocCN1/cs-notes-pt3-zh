    \    - 主流的系统一般都采用多种语言，这是一个关于如何跨越语言障碍的例子\n  - 回调函数是从系统惯例映射回 C++\n\n```c++\nvoid\
    \ Lines_window::cb_quit(Address, Address pw)\n    // Call Lines_window::quit()\
    \ for the window located at address pw\n{\n    reference_to<Lines_window>(pw).quit();\
    \    // now call our function\n}\n```\n\n将引用中的地址映射到存储在该地址的对象类型上，以后章节会详细解释。\n\n\
    ## 执行动作的代码\n\n```c++\n// The action itself is simple enough to write\n\nvoid Lines_window::quit()\n\
    {\n    // here we can do just about anything with the Lines_window\n    hide();\
    \      // peculiar FLTK idiom for \"get rid of this window\"\n}\n```\n\n```c++\n\
    // our action for a click (\"push\") on the next button\nvoid Lines_window::next()\n\
    {\n    int x = next_x.get_int();\n    int y = next_y.get_int();\n\n    lines.add(Point(x,y));\n\
    \n    // update current position readout:\n    stringstream ss;\n    ss << '('\
    \ << x << ',' << y << ')';\n    xy_out.put(ss.str());\n\n    redraw(); // now\
    \ redraw the screen\n}\n```\n\n```c++\n// An In_box is a widget into which you\
    \ can type characters\n// It's \"action\" is to receive characters\n\nstruct In_box\
    \ : Widget {\n    In_box(Point xy, int w, int h, const string& s)\n        :Widget(xy,w,h,s,0)\
    \ {}\n    int get_int();\n    string get_string();\n};\n\nint In_box::get_int()\n\
    {\n    // get a reference to the FLTK FL_Input widget:\n    Fl_Input& pi = reference_to<Fl_Input>(pw);\n\
    \    // use it:\n    return atoi(pi.value());      // get the value and convert\n\
    \                                  // it from characters (alpha) to int\n}\n```\n\
    \n## 总结\n\n- 我们已经学习了\n  - 按钮的动作\n  - 交互式 I/O\n    - 文本输入\n    - 文本输出\n    - 图形输出\n\
