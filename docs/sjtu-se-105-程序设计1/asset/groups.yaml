  mdcn: "\n\n# 纯虚函数\n\n- 这些函数被称为纯虚函数(pure virtual function)\n- 我们在它们还不存在的情况下提前进行了声明\n\
    - 可以这样考虑它们： 它们是一组函数指针\n  - 每个指针都指向NULL\n- 注意： 纯虚函数与虚函数并不一样\n\n- 纯虚函数不需要任何定义\n\
    \  - 强制所有的导出类去定义“它们自己的”版本\n\n# 抽象类\n\n- 包含一个或多个纯虚函数的类就是抽象类(abstract class)\n-\
