    \  - 因为信息丢失了\n\n## 切片问题修正\n\n- 在C++中，切片问题是令人讨厌的\n  - 它仍旧是一条纯种的狗\n  - 我们希望在它被当做Pet时仍旧可以引用到其breed属性\n\
