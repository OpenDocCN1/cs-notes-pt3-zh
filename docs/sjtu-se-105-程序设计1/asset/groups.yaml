    - delete[] 操作符则可以看到紧挨指针之前的信息\n  - 即看到需要将多少元素的内存返回给堆\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1019_0.png)\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_1019_1.png)\n\n## 使用动态数组的IntSet\n\n\
    - 我们可以构建一个新的 IntSet 版本\n  - 它可以让用户指定集的容量应该有多大\n- 数据成员将会进行一些修改：\n\n```\nclass IntSet\
    \ {\n    int *elts;    // pointer to dynamic array\n    int sizeElts; // capacity\
    \ of array\n    int numElts; // current occupancy\n    public:\n    ...\n};\n\
    ```\n\n## 使用动态数组的IntSet\n\n- 现在，不是明确地持有 一个数组\n  - 而是持有 一个指针，它指向动态创建的数组\n- sizeElts\
    \ 表示分配的数组尺寸\n  - 它现在不必是 MAXELTS 了\n- numElts 仍旧表示实际上包含多少元素\n- 所有这些改动都基于对集中元素不排序的假设\n\
    \n- 除了缺省构造函数\n  - 我们还可以编写一个可替代构造函数\n- 它与缺省构造函数具有相同的名字\n  - 但是具有不同的类型签名\n  - `IntSet::IntSet(int\
    \ size); // constructor w/ explicit capacity`\n  - `// REQUIRES: size > 0`\n \
    \ - `// EFFECTS: create a set with size capacity`\n  - `...`\n\n```\nclass IntSet\
    \ {\n    int *elts; // pointer to dynamic array\n    int sizeElts  // capacity\
    \ of array\n    int numElts; // current occupancy\n    public:\n    IntSet::IntSet();\
    \ // default constructor\n    // EFFECTS: create a set with MAXELTS capacity\n\
    \    IntSet::IntSet(int size); // constructor w/ explicit capacity\n    // REQUIRES:\
    \ size > 0\n    // EFFECTS: create a set with size capacity\n    ...\n```\n\n\
    ## 构造函数重载\n\n- 重载的构造函数将创建一个具有指定尺寸的数组：\n  `IntSet::IntSet(int size)`\n  ```\n \
    \ {\n    elts = new int[size];\n    sizeElts = size;\n    numElts = 0;\n  }\n\
    \  ```\n- 这属于函数重载\n\n## 构造函数重载\n\n- 由于编译器知道引元的具体类型\n  - 在创建新对象时，它会选择正确的构造函数\n\n\
    - 例如：\n  IntSet is1; // No arguments---calls the default constructor\n  IntSet\
    \ is2(200); // An integer argument---calls alternate\n\n- 注意，这两个构造函数几乎一样\n  -\
    \ 唯一的差别是我们是否使用缺省尺寸 MAXELTS\n\n## 构造函数重载\n\n- 这种代码显得比较浪费！\n- 因为我们在重复编码\n  - 此时应该使用参数泛化机制(parametric\
    \ generalization)\n- 解决此问题的一种方法被称为\n  - 缺省引元(default argument)\n- 要实现此目的，我们可以只定义一个构造器\n\
    \  - 但是它的引元是可选的\n\n- 我们仍然有一个问题没解决\n- 如果定义了一个局部 IntSet，当函数返回时，会发生什么？\n- 为什么这个问题在使用静态数组的\
    \ IntSet 版本中不存在呢？\n\n```\nvoid foo()\n{\n    IntSet is2(300) // Work with is2\
    \ in some way\n}\n```\n\n## 析构器(Destructor)\n\n- 要解决由此引发的内存泄露\n  - 必须执行整数数组的资源回收操作\n\
    \  - 当拥有它的 IntSet 对象被销毁时\n- 可以通过析构器来实现此目的\n- 析构器是构造器的对立面\n- 构造器确保\n  - 对象是合法的类的实例\n\
    - 析构器的工作于此相反\n\n## 析构器(Destructor)\n\n- 在许多类中，析构器不必做任何事\n- 但是，在构造函数(或其他方法)分配了动态存储空间的类中\n\
    \  - 析构器就必须负责回收这些空间\n- 析构器可以声明为:\n  `~IntSet(); // Destroy this IntSet`\n\n- 解析器编码如下：\n\
    \  ```cpp\n  IntSet::~IntSet()\n  {\n  delete[] elts;\n  }\n  ```\n- 注意，必须使用基于数组的\
    \ delete 操作符\n  - 不能使用标准的 delete 操作符\n- 因为用 new[] 创建的对象只能用 delete[] 删除\n\n## 带有析构器的IntSet\n\
    \n- 现在，当 IntSet 被销毁时\n  - 数组元素将首先被删除\n\n- 注意：\n  - 任何在代码块内局部声明的 ADT 对象，其析构器都\n\
    \    - 会在块执行结束的时候自动被调用\n    - 变量作用域结束\n\n- 新的 IntSet 定义可以动态地创建和销毁\n  - 就像其他类型一样\n\
    - 因此：\n  IntSet *ip = new IntSet(50); // a non-standard size\n  // do stuff\n\
    \  delete ip; // Destroys the IntSet\n\n## 带有析构器的IntSet\n\n- 当在带有析构器的类的对象上调用 delete\
    \ 时\n  - 或者在这种实例的数组上调用 delete[] 时\n  - 析构器会首先被调用\n  - 然后这个对象自身被删除\n\n- 回收 IntSet(一个指针和两个整数)\n\
    \  - 调用析构器会回收由 50 个数组构成的数组\n\n## 自由存储小结\n\n- 使用 new 来分配空间\n  - new 会在自由存储上创建一个对象，有时候对象会被初始化，并且返回指向这个对象的指针。\n\
