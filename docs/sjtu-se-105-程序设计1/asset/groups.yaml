  md: "\n# 扩展功能\n\n- 子类型必须遵守替换原则\n- 这就意味着新方法必须执行旧方法中的所有操作\n  - 但是可以做更多的事情\n- 类似地，它对调用者的要求不能比旧方法多\n\
    \  - 但是可以更少\n- 换句话说，能够正常使用超类型的代码\n  - 必须仍旧能够正常使用超类型\n\n# 子类不是子类型\n\n```\nclass\
    \ PosIntSet : public IntSet {\n    // OVERVIEW: a subclass, but not a subtype\n\
    public:\n    void insert(int v);\n    // EFFECTS: if v is non-negative and s has\
    \ room to include it, s=s+{v}\n    // if v is negative throw int -1; if s is full\
    \ thrown int MAXELTS\n};\n\nvoid PosIntSet::insert(int v) {\n    if (v < 0) throw\
    \ -1;\n    IntSet::insert(v);\n}\n```\n\n# 子类不是子类型\n\n- 能够正确使用IntSet的代码在使用PosIntSet时有可能会失败\n\
    \  - 它并没有遵守替换原则\n- C++使用的是“子类”替换，而不是“子类型”替换\n- 这意味着编译器允许子类：\n  - 用于任何希望使用超类型的地方\n\
    \  - 即使它不可替换的\n- 例如，下面的代码是完全合法的：\n\n```\nPosIntSet s;\nIntSet& r = s;\n```\n\n\
    # 明显类型和实际类型\n\n- 当代码中包含引用时，需要区分明显类型和实际类型\n  - Apparent type vs. Actual type\n\
    - 明显类型：引用的声明类型\n- 实际类型：引用的真实类型\n- 注意：即使编译器“看到”这种赋值\n  - 它也不认为它了解的比“声明”更多\n- 在这个例子中，r\
    \ = s 不会改变 r 的明显类型\n  - 这对于方法选择有十分重要的含义\n\n```\nPosIntSet s;\nIntSet& r = s;\n\
    ```\n\n- C++静态地选择要运行的方法\n  - 基于在编译时了解的情况\n  - 或者基于明显类型\n  PosIntSet s;\n  IntSet&\
    \ r = s;\n- 打破了 s 集合的表示不变式，这十分糟糕\n- 静态\n  - 在程序执行之前编译器即知道\n- 动态\n  - 不能静态地知道，只有在运行时才能了解到\n\
    \n# 静态与动态实例\n\n```\nvoid foo(IntSet &bar);\nIntSet s;\nPosIntSet p;\nfoo(s);\n\
