    \n```\nText ts(Point(100,y_orig-30),\"one\");\nText ts2(Point(100,y_orig+y_orig/2-10),\"\
    x/2\");\nText ts3(Point(x_orig-90,20),\"x*x\");\n```\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_916_0.png)\n\
    \n- 我们可以使用坐标轴去表示点 (0,0)和刻度\n  - Axis x(Axis::x, Point(20,y_orig), xlength/x_scale,\
    \ \"one notch == 1 \");\n  - Axis y(Axis::y, Point(x_orig, ylength+20, ylength/y_scale,\
    \ \"one notch == 1\");\n\n# 使用颜色（适度）\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_917_0.png)\n\
    \n```\ns.set_color(Color::green);    x.set_color(Color::red);  \ny.set_color(Color::red);\
    \      ts.set_color(Color::green);\n```\n\n- 我们需要为指定待绘制函数的参数定义一种类型\n  - typedef\
    \ 可以用于声明一个新的类型名\n    - `typedef int Color;` // now Color means int\n  - 定义所需参数的类型\n\
    \    - `typedef double Fct(double);` // now Fct means function\n    // taking\
    \ a double argument\n    // and returning a double\n  - 具有Fct类型的函数的示例:\n    -\
    \ `double one(double x) { return 1; }` // y==1\n    - `double slope(double x)\
    \ { return x/2; }` // y==x/2\n    - `double square(double x) { return x*x; }`\
    \ // y==x*x\n\n```\nstruct Function : Shape    // Function is derived from Shape\n\
    {\n    // all it needs is a constructor:\n    Function(\n        Fct f,      \
    \           // f is a Fct (takes a double, returns a double)\n        double r1,\
    \             // the range of x values (arguments to f) [r1:r2)\n        double\
    \ r2,\n        Point orig,            // the screen location of (0,0)\n      \
    \  int count,             // number of points used to draw the function\n    \
    \                         // (number of line segments used is count-1)\n     \
    \   double xscale ,        // the location (x,f(x)) is (xscale*x,yscale*f(x))\n\
    \        double yscale\n    );\n};\n```\n\n# 函数的实现\n\n```\nFunction::Function(\
    \ Fct f,\n    double r1, double r2,    // range\n    Point xy,\n    int count,\n\
    \    double xscale, double yscale )\n{\n    if (r2-r1<=0) error(\"bad graphing\
    \ range\");\n    if (count <=0) error(\"non-positive graphing count\");\n    double\
    \ dist = (r2-r1)/count;\n    double r = r1;\n    for (int i = 0; i<count; ++i)\
    \ {\n        add(Point(xy.x+int(r*xscale), xy.y-int(f(r)*yscale)));\n        r\
    \ += dist;\n    }\n}\n```\n\n# 缺省参数\n\n- 7个参数就太多了！\n  - 太多\n  - 只会造成混淆和错误\n  -\
    \ 为某些参数提供缺省值\n    - 缺省参数在构造函数中很有用\n\n```\nstruct Function : Shape {\n    Function(\
    \ Fct f, double r1, double r2, Point xy,\n        int count = 100, double xscale\
    \ = 25, double yscale=25 );\n};\n```\n\n```\nFunction f1(sqrt, 0, 11, orig, 100,\
    \ 25, 25 ); // ok (很明显)\nFunction f2(sqrt, 0, 11, orig, 100, 25);      // ok:\
