    +   - 为了正确地构造类，需要注意友元声明与友元定义之间的互相依赖

    +   - 类Window_Mgr必须先定义

    +     - 否则，Screen类就不能将Window_Mgr函数指定为友元

    +     - 只有在定义Screen之后，才能定义relocate函数

    +       - 友元访问了Screen的成员

    +   - 更一般地讲，必须先定义包含成员函数的类，才能将成员函数设为友元

    +     - 另一方面，不必预先声明类和非成员函数来将它们设为友元'
