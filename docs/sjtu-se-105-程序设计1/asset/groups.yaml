    +   - 3. const 成员函数

    +   - 任何不会修改数据成员的函数都应该声明为const 类型

    +   - 如果在编写const 成员函数时，不慎修改了数据成员，或者调用了其它非 const 成员函数，编译器将指出错误，这无疑会提高程序的健壮性

    +   - const 成员函数的声明看起来怪怪的： const 关键字只能放在函数声明的尾部，大概是因为其它地方都已经被占用了'
