  md: "\n## 抽象数据类型\n\n- 抽象数据类型提供了值和操作的“抽象”描述\n- “抽象”意味着程序员不了解其细节\n- 抽象数据类型的定义必须包含：\n\
    - 该类型表示“何种”值的描述\n- 以及这些值可以“如何”被操作的描述\n- 当我们使用ADT时，有关细节部分并不去考虑\n\n- 抽象数据类型具有下面\
    \ 3 个优势：\n- 信息隐藏\n- 我们不必了解对象如何被表示的细节\n- 也不必了解这些对象上的操作是如何实现的\n- 封装\n- 对象及其操作是在同一位置定义的\n\
    - 抽象数据类型将数据与操作组合在同一个实体中\n- 语言中立\n- 可以用许多种语言实现\n- C++的类定义了抽象数据类型\n\n## 抽象数据类型\n\
    \n- 这使得抽象数据类型具有与函数抽象相同的优点：\n- 抽象数据类型的的值是本地化的(local)，只需要查看抽象数据类型的定义即可理解它们；\n- 抽象数据类型是可替换的(可以修改具体实现而不需要告知任何用户)\n\
    - 如果我们想了解抽象数据类型的具体实现，怎么办？\n\n## 类型实现细节\n\n- 我们将类型实现细节称为\n- “具体表示(concrete representation)”\n\
    - 有时也仅称为“表示”\n\n- 但是，我们希望确保：\n- 只有为该类型定义的操作能够直接访问该表示\n- 其他的操作都只能通过成员函数来访问/修改其状态\n\
    \n- 两项任务：\n- 确定哪些具体数据元素将被用来表示各个值\n- 为每一个函数提供一个实现\n\n- 程序设计 I\n- *Programming I*\n\
    \nThank You!\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_614_0.png)\n\n## 程序设计1\n\
    *Programming I*\n\n## 第16章\n子类型与子类\n\nChapter Sixteen\nSubtype and Subclass\n\n\
    ![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_615_0.png)\n\n## C++类\n\n- C++提供了一种“真正”的封装机制\n\
    - 称为“类(Class)”\n\n- 类的基本思想是提供一个单一实体：\n- 它定义了对象的属性\n- 以及在这类对象上能够执行的操作\n\n- 这些操作有时被称为“成员函数(member\
    \ function)”\n- 或“方法(method)” - java\n\n- 对于面向对象编程是必需的\n- 关注于对象\n- 对象(Object)：包含数据和操作\n\
    - 在C++中，class类型的变量就是对象\n\n- 例如：\nclass DayOfYear ←name of new class type\npublic:\n\
    void output();  ←member function!\nint month;\nint day;\n};\n- 注意，这里只有成员函数的原型\n\
    - 函数的实现在其他地方\n\n## C++类\n\n- 我们要注意以下几点：\n- 类的声明中包含：\n- 数据成员(int bar)\n- 以及成员函数/方法(get_value\
    \ 和 set_value)\n- 每个声明的函数都必须有一个相应的规格说明\n- set_value声明要 “修改” this\n- this 对于 “本对象(this\
    \ object)” 来说是一个通用名字\n- 也可以给它起一个具有形式化意义的名字\n\n## C++类\n\n- 缺省情况下，类的所有成员都是私有的(private)\n\
    - 私有成员只对该类的其他成员可视(visible)\n- 但是，如果所有成员都是私有的，那么：\n- 这个类就没什么用！\n- 因此，public关键字就被用来标识\n\
    - 在其后出现的所有成员对任何观察这个类声明的代码都是可视的\n- 不仅仅只是这个类的成员\n\n## 成员函数\n\n- 这个声明并不完整\n- 必须定义或\
    \ “实现(implement)” 类成员函数\n\n- 就像其他函数定义一样\n- 可以在main()定义之后出现\n\n- 必须指定类：\n\n- ::是作用域解析操作符(recall:\
    \ namespace)\n- 指示编译器这个成员属于 “哪个类”\n- ::之前的项称为类型限定符(type qualifier)\n\n- anInt中的成员函数定义如下：\n\
    ```\nint anInt::get_value()\n{\n    return v;\n}\nvoid anInt::set_value(int newValue)\n\
    {\n    v = newValue;\n}\n```\n\n## 成员函数\n\n- 我们可以定义anInt类型的对象：\nanInt foo;\nanInt\
    \ bar;\n\n- 这会产生一个包含两个对象的内存环境\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_625_0.png)\n\
    \n## 类成员访问\n\n- 不做任何处理的话，这些值是未定义的\n- 没有任何初始值\n- 稍后可以看到若干种方式来为数据成员设置初始值\n- 此刻，我们可以调用set_value成员函数\n\
    - foo.set_value(1);\n- 这条语句会调用foo的set_value()函数\n- 这里有一个非常重要的事实:\n- 这个成员对该对象的其他成员也是可视的\n\
    \n- 这是为什么呢？因为，在C++中规定：\n- 代码可以看到在其自己的语句块中定义的变量，以及在将其括起来的语句块中定义的变量\n- 由于成员函数是在类定义的内部声明的\n\
    - 因此，它能够访问在类定义语句块中定义的成员变量\n- 于是，这个方法将对foo的v进行赋值\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_627_0.png)\n\
    \n## 类成员访问\n\n- 不能直接访问v\n`cout << foo.v;`\n`// Compile-time error because v is\
    \ private`\n- 但是，可以通过get_value()函数来访问：\n`cout << foo.get_value(); // OK`\n\n##\
    \ 对象传递\n\n- 类的对象也可以像其他变量一样地传递\n- 并且，像其他变量一样（除数组），是按值传递的\n\n## 对象传递\n\n- 下面的代码会产生什么样的结果呢？\n\
    ```\nvoid add_one(anInt i){\n    i.set_value(i.get_value()+1);\n}\n\nint main(){\n\
    \    anInt foo;\n    foo.set_value(0);\n    add_one(foo);\n    cout << foo.get_value()\
    \ << endl;\n    return 0;\n}\n```\n\n- 如果想按引用传递对象:\n- 就需要使用指针或引用作为参数\n\n```\n\
    void add_one(anInt *ip){\n    ip->set_value(ip->get_value() + 1);\n}\n```\n\n\
    ## IntSet示例\n\n- 假设我们需要构建一个抽象数据类型\n- 它可以持有 一个可变(mutable)整数集(set)\n- “set” 的数学含义：\n\
    - 包含0个或多个整数的集合，其中不包含重复元素\n- “mutable” 的含义：\n- 我们可以在数集中插入或删除对象\n\n- 在这个集上我们定义4个操作：\n\
    - 在集中插入一个值\n- 在集中移除一个值\n- 查询一个值是否在集中\n- 计算集中的元素个数\n"
