    +   - 在前面的例子中

    +     - 退出定义p1的语句块会导致局部变量p1消失

    +     - 但是它所指向的动态对象仍旧存在

    +   - 这会留下一个动态分配的对象

    +     - 没有任何方式可以回收它'
  - '[PAGE 1011]


    # 内存泄露


    +   - 这称为内存泄露 (*memory leak*)

    +     - 如果它发生的频率足够频繁

    +     - 那么程序就可能会到达一种状态

    +     - 在该状态，程序将再也不能分配新的动态对象'
  - '[PAGE 1012]


    +   - 用于通过new()创建的对象的内存空间来自于

    +     - 内存中被称为堆的地方

    +   - 首先探讨典型的C++进程所使用的内存模型

    +     - 每个运行的程序都有一个地址空间

    +       - 该程序可以访问的一组内存位置

    +     - 地址空间对于一个运行的程序是私有的

    +       - 其他任何运行的程序都不能访问/修改它'
  - '[PAGE 1013]


    # 地址空间


    +   - 在地址空间中，典型地有5个部分，被成为段 “segments”：


    |  | address MAX |

    |---|---|

    | stack (grows down) | |

    | big void | |

    | heap (grows up) | |

    | globals

    (fixed size) | |

    | text (the program)

    (fixed size) | |

    | the little void | address 0 |'
  - '[PAGE 1014]


    # 地址空间


    +   - 由编译过的程序构成的代码位于文本段 text segment

    +     - 它位于地址空间中非常低的地址

    +       - 但是通常不是从地址 0 开始

    +   - 紧挨其上是编译器为全局变量分配的空间

    +     - 必要时会对其进行初始化

    +   - 对于通过 new() 分配的对象，位于堆中

    +     - 它可以向上扩展

    +   - 当函数被调用时，会在栈上创建栈内存帧

    +     - 它可以向下扩展'
  - '[PAGE 1015]


    # 尺寸未知的对象


    +   - 目前为止，我们动态创建的对象都具有确定的尺寸

    +     - 编译器知道该尺寸

    +   - 例如：

    +     - 持有 一个整数所需的内存数量很容易计算

    +     - 只要给出恰当的类型定义即可

    +   - 但是，我们也可以创建尺寸未知的对象

    +     - 编译器不了解其尺寸

    +     - 可以通过创建动态数组来实现'
  - '[PAGE 1016]


    # 动态数组


