    ```\n\n## 添加一条正弦曲线\n\nCanvas #4\n\ny axis\n\nx axis\n\nNext\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_825_0.png)\n\
    \n## Demo code 5\n\n```\nwin.set_label(\"Canvas #5\");\n\nsine.set_color(Color::blue);\
