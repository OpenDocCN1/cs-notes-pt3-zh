  - '[PAGE 254]


    # 局部域内的名字解析过程


    +   - 首先查找使用该名字的域，如果找到一个声明，则该名字被解析；如果没有找到，则查找包含该域的域。这个过程会一直继续下去，直到找到一个声明或已经查找完整个全局域。


    +   - 如果查找完整个全局域还没有找到该名字的声明，则这个名字的用法将被标记为错误


    +   - 同一个域内的名字不能重复


    +   - 在外围域中的声明被嵌套域中的同名声明所隐藏'
