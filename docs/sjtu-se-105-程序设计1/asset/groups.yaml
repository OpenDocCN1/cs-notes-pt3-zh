    \ 对小程序也非常有用\n  - 这个概念最初是在 Simula67 中引入的\n\n## 成员和成员访问\n\n- 看待类的方式\n  ```cpp\n\
    \  class X {        // this class'name is X\n  // data members (they store information)\n\
    \  // function members (they do things, using the information)\n  };\n  ```\n\
    - 例如\n  ```cpp\n  class X {\n  public:\n  int m;  // data member\n  int mf(int\
