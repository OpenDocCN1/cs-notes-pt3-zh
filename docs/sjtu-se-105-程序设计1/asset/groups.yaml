    - 模板在使用时实例化\n- 类模板在引用实际模板类类型时实例化\n- 函数模板在调用它或用它对函数指针进行初始化或赋值时实例化\n\n## 类的实例化\n\
    \n- 当编写Queue<int> qi时\n- 编译器自动创建名为Queue<int>的类\n- 用类型int替换模板形参的每次出现\n\n```\ntemplate\
    \ <class Type> class Queue<int> {\npublic:\n    Queue();\n    int &front();\n\
    \    const int &front() const;\n    void push(const int &);\n    bool empty()\
    \ const;\nprivate:\n    // ...\n};\n```\n\n- 要使用类模板，就必须显式指定模板实参：\nQueue qs; //\
    \ error\n- 类模板不定义类型，特定的实例才定义类型\n- 用模板类定义的类型总是包含模板实参\n- Queue不是类型\n- Queue<int>\
    \ 或 Queue<string>是类型\n\n- 使用函数模板时，编译器通常会为我们推断模板实参：\n```\nint main(){\n    compare(1,0);\n\
    \    compare(3.14,2.7);\n}\n```\n- 编译器会实例化两个compare版本，分别用int和double替代模板中的T\n```\n\
