  - '[PAGE 609]


    # 抽象数据类型


    +   - 抽象数据类型提供了值和操作的“抽象”描述

    +     - “抽象”意味着程序员不了解其细节

    +   - 抽象数据类型的定义必须包含：

    +     - 该类型表示“何种”值的描述

    +     - 以及这些值可以“如何”被操作的描述

    +   - 当我们使用ADT时，有关细节部分并不去考虑'
  - '[PAGE 610]


    +   - 抽象数据类型具有下面 3 个优势：

    +     - 信息隐藏

    +       - 我们不必了解对象如何被表示的细节

    +       - 也不必了解这些对象上的操作是如何实现的

    +     - 封装

    +       - 对象及其操作是在同一位置定义的

    +       - 抽象数据类型将数据与操作组合在同一个实体中

    +     - 语言中立

    +       - 可以用许多种语言实现

    +       - C++的类定义了抽象数据类型'
  - '[PAGE 611]


    # 抽象数据类型


    +   - 这使得抽象数据类型具有与函数抽象相同的优点：

    +     - 抽象数据类型的的值是本地化的(local)，只需要查看抽象数据类型的定义即可理解它们；

    +     - 抽象数据类型是可替换的(可以修改具体实现而不需要告知任何用户)

    +   - 如果我们想了解抽象数据类型的具体实现，怎么办？'
  - '[PAGE 612]


    # 类型实现细节


    +   - 我们将类型实现细节称为

    +     - “具体表示(concrete representation)”

    +     - 有时也仅称为“表示”


    +   - 但是，我们希望确保：

    +     - 只有为该类型定义的操作能够直接访问该表示

    +     - 其他的操作都只能通过成员函数来访问/修改其状态


    +   - 两项任务：

    +     - 确定哪些具体数据元素将被用来表示各个值

    +     - 为每一个函数提供一个实现'
