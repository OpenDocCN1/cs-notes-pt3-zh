    \n## 递归函数\n\n- 这个定义有两个特性：\n- 首先，它有一个无需计算的终止情况\n\n$factorial(0)=1$\n\n- 其次，其他情况可以按照如下方式解决：\n\
    - 先解决更小的问题，它更接近终止情况\n- 再在这个更小问题的处理结果上执行简单的附加操作，得到“更大”的结果\n- 这就是递归步骤（recursive\
    \ step），或称为归纳步骤\n\n## 递归解决方案\n\n- 阶乘函数\n\n```\nint factorial(int n)\n// REQUIRES:\
    \ n >= 0 // EFFECTS: computes n!\n1 {\n2   if (n==0) {\n3     return 1; // This\
