  - '[PAGE 668]


    # 对对象的思考


    +   - 聚焦程序设计上的变化

    +     - 之前→算法为中心

    +     - OOP → 数据为中心

    +   - 算法依然存在

    +     - 它们聚焦在数据上

    +     - 被“制造”出来去“适应”数据

    +   - 设计软件解决方案

    +     - 定义各种各样的对象以及它们之间的交互'
  - '[PAGE 669]


    # 子类型


    +   - 如果编写的程序被证明非常好，但是想在其中添加新特性，这时怎么办？

    +     - 直接修改这个程序吗？

    +     - 或者创建该程序的一个副本，然后在这个副本上修改

    +     - 以使得该程序可以被复用？

    +   - 在现实生活中，我们都想将一样事物扩展为另一样事物

    +   - 在程序设计中

    +     - 我们通过子类型化(sub-typing)来实现此目的'
  - '[PAGE 670]


    # 子类型


    +   - 如果我们有两个类型 S 和 T

    +   - S 是 T 的子类型，记作 S<:T，当且仅当：

    +     - 对于希望是 T 类型对象的任何实例

    +     - 都可以向其提供 S 类型的对象

    +       - 不需要修改原来的任何计算代码以保证程序的正确性

    +   - 如果 S 是 T 的子类型，那么：

    +     - T 类型的对象可以被 S 类型的对象所替换

    +       - 并没有改变程序的任何属性，例如正确性'
  - '[PAGE 671]


    +   - 如果 S<:T，那么也可以说：

    +     - T 是 S 的超类型(supertype)

