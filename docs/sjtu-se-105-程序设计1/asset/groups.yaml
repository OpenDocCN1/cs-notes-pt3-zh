    +   - 对于每一个类,

    +     - draw_lines() —— 画线操作

    +     - move(dx,dy) —— 移动操作

    +     - s.add(x) —— 添加某个x(比如，一个点)到shape s中

    +   - 对于一个Shape的每个性质 x,

    +     - x() —— 给出目前的值

    +     - set_x() —— 设置新的值

    +     - e.g.,

    +       Color c = s.color();

    +       s.set_color(Color::blue);'
