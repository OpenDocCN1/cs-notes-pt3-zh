    \n通过继承而产生的类型等价（type equivalence）是理解面向对象程序设计方法内涵的重要门槛。\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_738_0.png)\n\
    \n## 继承：复用接口\n\n- 第二种以及其他使派生类和基类之间产生差异的方法是改变现有基类的方法的行为\n- 这被称为覆盖（overriding）\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_740_0.png)\n\n## is-a 关系\n\n- 对于继承可能会引发某种争论：\n\
    \n- 继承应该只覆盖基类的方法（而并不添加在基类中没有的新方法）吗？\n\n- 如果这样做，就意味着派生类和基类是完全相同的类型，因为它们具有完全相同的接口\n\
    \n- 结果可以用一个派生类对象来完全替代一个基类对象。这可以被视为“纯粹替代（pure substitution）”，通常称之为“替代法则（substitution\
    \ principle）”\n\n## is-a 关系\n\n- 在某种意义上，这是一种处理继承的理想方式\n  - 我们经常将这种情况下的基类与派生类之间的关系称为“is-a”关系\n\
    \  - 因为可以说“一个圆形就是一个几何形状”\n- 判断是否继承\n  - 就是要确定你是否可以用 `is-a` 来描述类之间的关系\n  - 并使之具有实际意义\n\
    \n## is-like-a 关系\n\n- 有时你必须在派生类型中添加新的接口元素，这样也就扩展了接口并创建了新的类型\n- 这个新类型仍然可以替代基类，但是这种替代并不完美\n\
    \  - 因为基类无法访问你新添加的方法\n- 这种情况我们可描述为 “is-like-a” 关系\n  - 新类型具有旧类型的接口，但是它还包含其他方法，所以你不能说它们完全相同\n\
    \n## is-like-a 关系\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_744_0.png)\n\n**恒温器**\
