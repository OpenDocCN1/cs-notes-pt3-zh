    \ Three\nComputation\n\n翻译自Bjarne Stroustrup的课件\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_119_0.png)\n\
    \n- 计算\n  - 什么是可计算的？如何最佳地计算它？\n  - 抽象、算法、启发、数据结构\n- 语言结构和思想\n  - 执行的先后顺序\n  -\
    \ 表达式和语句\n  - 选择\n  - 迭代\n  - 数组和向量vector\n  - 函数\n\n- 已经学过的内容：\n  - 如何进行算术运算\n\
    \    - d = a+b*c\n  - 如何选择\n    - “if 是 true, 这样做; 否则做 else ”\n  - 如何“迭代”\n  \
    \  - “做某事直至完成” while\n    - “做100次”\n  - 如何调用函数\n    - “go ask Joe and bring back\
    \ the answer”\n    - “hey Joe, calculate this for me and send me the answer”\n\
    - 本章内容将主要介绍上述内容的细节\n\n- 输入：从键盘、文件、其他输入设备、其他程序、同一个程序的其他部分\n- 计算：程序对输入进行处理以产生输出\n\
    - 输出：到屏幕、文件、其他输出设备、其他程序、同一个程序的其他部分\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_122_0.png)\n\
    \n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_123_0.png)\n\n- 程序由一系列协作的部分组成\n- 它们互相之间共享数据，这些数据\n\
    \  - 存储在内存中\n  - 存储在持久性介质中(例如硬盘)\n  - 通过网络传输\n- 它们的输入成为引元(argument)，输出成为结果(result)\n\
    \n## 语言特性\n\n- 编程语言的每个特性都是为了表达基本的思想，例如\n  - `+`：加法\n  - `*`：乘法\n  - `if (expression)\
    \ statement else statement;`：选择\n  - `while (expression) statement;`：迭代\n  - `f(x);`：函数/操作\n\
    \  - `…`\n\n➢ 我们组合这些语言特性就编写出来程序\n\n## 表达式\n\n```\n// 计算面积:\nint length = 20; \
    \                // 最简单的表达式: 字面常量 (这里的 20)\n// (这里初始化了一个变量)\nint width = 40;\n\
    int area = length*width;          // 一个乘法\nint average = (length+width)/2;  //\
    \ 加法和除法\n```\n\n- 计算将遵循常见的数学意义上的运算次序\n  `a*b+c/d` 表示 `(a*b)+(c/d)` 而不是 `a*(b+c)/d`\n\
    - 如果有质疑，就加括号；如果计算复杂，也加括号\n- 但是，不要书写过于复杂的表达式:\n  `a*b+c/d*(e-f/g)/h+7`  // 太复杂了！\n\
    - 常量表达式：选择有意义的名字表示常量\n  `const pi = 3.1415926;`\n\n## 操作符\n\n- 表达式是由操作符(operator)和操作数(operand)构成的\n\
    \  - 操作符指定要做什么\n  - 操作数指定操作符操作的数据\n\n- 布尔类型: bool (true 和 false)\n  - 判等操作符: ==\
    \ (相等), != (不等)\n  - 逻辑操作符: && (与), || (或), ! (非)\n  - 关系操作符: < (小于), > (大于),\
    \ <=, >=\n\n- 字符类型: char (e.g., ‘a’, ‘7’, 与 '@')\n\n- 整数类型: short, int, long\n\
    \  - 算术操作符: +, -, *, /, % (取余)\n\n- 浮点类型: e.g., float, double (e.g., 12.45 and\
    \ 1.234e3)\n  - 算术操作符: +, -, *, /\n\n## 操作符\n\n- 许多操作符，基本上都有等价的简洁操作符，例如\n  - a\
    \ += c    表示    a = a+c\n  - a *= scale    表示    a = a*scale\n  - ++a    表示  \
    \  a += 1\n    或者    a = a+1\n- “简洁操作符”通常更适合使用\n  - 更清晰、更直接地表达思想\n  - 执行效率和普通操作符是一样的\n\
    \    - 编译器会编译出一致的代码\n\n## 类型转换\n\n- 在同一个表达式中，可以混合多种类型\n  - 2.5/2   double/int\
    \ 等于1.25\n  - 5/2     int/int 等于2而不是2.5\n  - 'a'+1   char+int 等于int('a')+1\n \
    \ - 编译器将 int 提升转换为 double，将 char 提升转换为 int\n\n- 初始化或赋值操作都会涉及类型转换\n  - double d\
    \ = 2.5;\n  - int i=2;\n  - double d2 = d/i;      //d2 == 1.25\n  - int i2 = d/i;\
    \         // i2 == 1\n  - d2 = d/i;             //d2 == 1.25\n  - i2 = d/i;  \
    \           // i2 == 1\n\n- 语句是\n  - 以分号结尾的表达式\n  - 或者是声明\n  - 或者是确定控制流的控制语句\n\
    - 例如\n  - a = b;\n  - double d2 = 2.5;\n  - if (x == 2) y = 4;\n  - while (cin\
    \ >> number) numbers.push_back(number);\n  - int average = (length+width)/2;\n\
    \  - return x;\n\n## 选择(if else)\n\n- 有时，我们必须在备选项中选择\n- 例如，假设要识别两个数中的较大值，可以使用下面的if语句\n\
    - if 语句的语法\n\n```\nif (a<b)      // Note: 这里没有分号\n    max = b;\nelse         \
    \ // Note: 这里没有分号\n    max = a;\n```\n\n```\nif (condition)\n    statement-1 \
    \   // 如果条件为真，则执行 statement-1\nelse\n    statement-2    //如果条件为假，则执行 statement-2\n\
    ```\n\n- 当选择是基于一组常量值进行比较时\n  - 使用多个嵌套的 if 语句会降低程序的可读性\n  - 可以使用 switch 语句\n- Switch\
    \ 语句包含多个 case 语句\n  - 用于 switch 的必须是整数类型、字符类型，或枚举类型，但不能是字符串类型\n  - case 标号里面必须是常量表达式，不能使用变量\n\
    \  - 每个 case 标号表明一种选择\n  - 两个 case 标号中不能使用相同的值\n  - 多个 case 标号可以使用相同的代码\n  - 每个\
    \ case 标号后面应该紧跟 break 语句\n  - break 语句用于终止 switch 的执行\n  - default 表示不属于任何一个 case\
    \ 的情况\n\n```\ncout << \"Please enter a digit\\n\";\nchar a;\ncin >> a;\n\nswitch\
    \ (a) {\ncase '0': case '2': case '4': case '6': case '8':\n    cout << \"is even\\\
    n\";\n    break;\ncase '1': case '3': case '5': case '7': case '9':\n    cout\
    \ << \"is odd\\n\";\n    break;\ndefault:\n    cout << \"is not a digit\\n\";\n\
    \    break;\n}\n```\n"
