    \ = 0; // define and initialize ctr\n```\n\n## 模板特化\n\n- 某些情况下，通用模板定义对于某个类型可能是错误的\n\
    \n```cpp\ntemplate <typename T>\nint compare(const T &v1, const T &v2)\n{\n  \
    \  if (v1 < v2) return -1;\n    if (v2 < v1) return 1;\n    return 0;\n}\n```\n\
    \n- 如果用两个 `const char*` 实参调用这个模板定义，函数将比较指针值，而不是比较指针所指向的数组的内容\n- 为了能够将 `compare`\
    \ 函数用于 C 风格字符串\n  - 必须提供一个知道如何比较 C 风格字符串的特殊定义\n  - 这个版本是特化的，对模板的用户透明\n  - 用于调用特化函数或使用特化类，与使用从通用模板实例化的版本没有区别\n\
