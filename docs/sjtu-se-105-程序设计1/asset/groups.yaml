  - "[PAGE 638]\n\n# IntSet示例\n\n```\n```cpp\nconst int MAXELTS = 100;\nclass IntSet\
    \ { // a mutable set of integers, |set| <= MAXELTS\nint elts[MAXELTS];\n    int\
    \ numElts;\n  public:\n    void insert(int v); // MODIFIES: this\n           \
    \           // EFFECTS: this = this + {v} if room,\n                      //throws\
    \ int MAXELTS otherwise\n    void remove(int v); // MODIFIES: this\n         \
    \              // EFFECTS: this = this - {v} if v is in this\n               \
    \        // throws int v otherwise.\n    bool query(int v); // EFFECTS: returns\
