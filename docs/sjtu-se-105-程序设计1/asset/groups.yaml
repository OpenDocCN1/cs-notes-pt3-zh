    \ **使用**\n  - `ia[2][2]=1`  ➔  `*(ia[2]+2)=1`\n\n## 函数定义\n\n```\nint abs( int\
    \ iobj ){ return( iobj < 0 ? -iobj : iobj ); }\n\nint min( int p1, int p2 ){ return(\
    \ p1 < p2 ? p1 : p2 ); }\n\nint gcd( int v1, int v2 ){     // 返回最大公约数\n    while\
    \ ( v2 ) {\n        int temp = v2;\n        v2 = v1 % v2;\n        v1 = temp;\n\
    \    }\n    return v1;\n}\n```\n\n- 函数需要先定义再使用\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_205_0.png)\n\
    \n## 函数声明\n\n- 函数声明可以使得函数被提前使用\n- 函数声明由函数返回类型、函数名和形式参数表构成。\n  ```\n  bool IsPrimer(\
    \ int x);        //函数声明，判断x是否为素数\n  int main(){\n      for(int i=2; i<10000; i++)\n\
    \      if(IsPrimer(i))    //函数使用\n          cout<<i;\n  }\n  ```\n- 函数声明中的参数名不是必需的\n\
    \  ```\n  bool IsPrimer( int x);        //函数声明，判断x是否为素数\n  bool IsPrimer( int\
    \ );         //函数声明，判断参数是否为素数\n  ```\n\nbool look_up( int *, int );\n\nint count(\
    \ const string &, char );\n\nvoid sum( vector<int> &, int );\n\nclass Date { /*\
    \ 定义 */};\nDate& calendar( const char* );\n\nint[10] foo_bar(); ➜ int* foo_bar();\n\
    \nconst bool is_equal( vector<int> v1, vector<int> v2 );\n\n## 函数声明的主要作用\n\n-\
    \ 如果程序中需要使用一个函数，可以先声明该函数\n\n- 函数声明为函数定义提供了一个对外的接口。\n  - 只要函数的接口不变，无论函数定义修改多么频繁，也无需改变我们的代码（使用函数），如\n\
    \n- 函数在程序中只能被定义一次，因而不能被其它文件所使用；而函数可以被声明多次。\n  - 函数声明可以被放在头文件中。这些头文件可以被include在每个调用该函数的文件中.\n\
    \n//Global.h\nbool IsPrimer(int x);\n\n//Global.cpp\n#include Global.h\nbool IsPrimer(int\
    \ x){...}\n\n//A.cpp\n#include Global.h\n...if (Isprimer(val)) ...\n\n//B.cpp\n\
    #include Global.h\n...if (Isprimer(val)) ...\n\n//C.cpp\n#include Global.h\n...if\
    \ (Isprimer(val)) ...\n\n## 函数调用\n\n- 函数在运行时被调用。\n  - 程序控制权被传送给被调用的函数，而当前活动函数的执行被挂起。\n\
