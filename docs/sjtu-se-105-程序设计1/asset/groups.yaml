    # 子类不是子类型


    +   - 能够正确使用IntSet的代码在使用PosIntSet时有可能会失败

    +     - 它并没有遵守替换原则

    +   - C++使用的是“子类”替换，而不是“子类型”替换

    +   - 这意味着编译器允许子类：

    +     - 用于任何希望使用超类型的地方

    +     - 即使它不可替换的

