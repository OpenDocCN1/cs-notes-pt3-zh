    +     ```

    +     if (v1 < v2) return -1;

    +     if (v2 < v1) return 1;

    +     return 0;

    +     ```

    +     ```

    +     if (v1 < v2) return -1;

    +     if (v1 > v2) return 1;

    +     return 0;

    +     ```

    +   - 函数体只使用 < 操作显然对实参的要求更少'
