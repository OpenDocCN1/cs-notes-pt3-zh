    \ f4(sqrt, 0, 11, orig);                // ok: 和f1相同\n```\n\n# Function\n\n- Function是一个完美的类吗？？\n\
    \  - 不\n    - 为什么不是？\n  - 你会如何处理所有的位置和刻度？\n    - 见 15.6.3\n  - 如果你不能做到真正聪明，那就做得简单些，这样用户可以自己去做任何需要的事情\n\
    \    - 例如，添加参数使得调用方可以进行控制\n\n```\n#include<cmath>      // standard mathematical\
    \ functions\n\n// You can combine functions (e.g., by addition):\ndouble sloping_cos(double\
    \ x) { return cos(x)+slope(x); }\n\nFunction s4(cos,-10,11,orig,400,20,20);\n\
    s4.set_color(Color::blue);\nFunction s5(sloping_cos,-10,11,orig,400,20,20);\n\
    ```\n\n# Function graphing: more functions\n\n![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_924_0.png)\n\
