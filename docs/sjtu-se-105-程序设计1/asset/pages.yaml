- pgno: 883
  md: '# 相同的暴露策略


    +   - 数据应该是私有的（private）

    +     - 数据隐藏 – 所以数据不会在不经意间被改变

    +     - 使用私有数据和一对公共访问权限的函数就可以得到值并进行设置

    +       ```

    +       c.set_radius(12);                 // set radius to 12

    +       c.set_radius(c.radius()*2); // double the radius (fine)

    +       c.set_radius(-9);                 // set_radius() could check for negative,

    +                                         // but doesn’t yet

    +       double r = c.radius();            // returns value of radius

    +       c.radius = -9;                    // error: radius is a function (good!)

    +       c.r = -9;                         // error: radius is private (good!)

    +       ```

    +   - 函数可以私有(private)也可以公共(public)

    +     - Public用于接口

    +     - Private用于仅仅在类的内部使用的函数'
  merge: -1
  img_proc: true
- pgno: 884
  md: '# Private的好处


    +   - 在发布之后，我们仍能修改我们的实现

    +   - 我们不向用户暴露在表示中使用到的 FLTK类型

    +     - 我们可以在不影响用户代码的情况下，用其他的库来替换FLTK

    +   - 我们可以在访问函数中提供检查功能

    +     - 但是我们还没有系统化地实现这一功能(以后完成?)

    +   - 功能性接口对阅读和使用都显得更加友好化

    +     - 比如, s.add(x) 比 s.points.push_back(x) 更友好

    +   - 我们强制执行shape的不变性

    +     - 仅仅是颜色和风格的变化;而不是点的相对位置的改变

    +     - const 成员函数

    +   - 这种封装性的价值因应用领域的不同而有所不同

    +     - 经常会变得更有价值

    +     - 它是一种理念

    +     - 隐藏表示，除非你有充分的理由不这么做'
  merge: -1
  img_proc: true
