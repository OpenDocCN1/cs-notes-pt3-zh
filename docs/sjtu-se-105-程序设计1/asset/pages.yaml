- pgno: 337
  md: "# 递归函数\n\n+   - 例如，考虑阶乘函数 factorial\n+     - C++（以及绝大多数别的编程语言中）没有阶乘操作符\n+ \
    \    - 必须以编写函数的方式来实现\n\n+   - 首先，考察阶乘的数学定义：\n+   \n+     $$factorial(n)=\\prod_{i=1,n}i\\\
    quad(for\\ n>0)$$\n\n+   - 例如，factorial(3) 的计算如下：\n+   \n+     $$factorial(3)=\\\
    prod_{i=1,n}i=(1\\times2\\times3)$$"
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 递归函数


    +   - 阶乘还有另外一种定义形式：

    +     $$factorial(n) = \begin{cases} 1 & n = 0 \\ n \times factorial(n-1) & n
    > 0 \end{cases}$$


    +   - 这是阶乘的递归定义

    +     - factorial函数是使用factorial自身来定义的'
  merge: -1
  img_proc: true
- pgno: 339
  md: "# 递归函数\n\n+   - 这个定义有两个特性：\n+     - 首先，它有一个无需计算的终止情况\n+   \n+       $factorial(0)=1$\n\
    +   \n+     - 其次，其他情况可以按照如下方式解决：\n+       - 先解决更小的问题，它更接近终止情况\n+       - 再在这个更小问题的处理结果上执行简单的附加操作，得到“更大”的结果\n\
    +       - 这就是递归步骤（recursive step），或称为归纳步骤"
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 递归解决方案


    +   - 阶乘函数


    ```

    int factorial(int n)

    // REQUIRES: n >= 0 // EFFECTS: computes n!

    1 {

    2   if (n==0) {

    3     return 1; // This is the base case---trivial!

    4   } else {

    5     return n*factorial(n-1); // This is the recursive step

    6   }

    7 }

    ```'
  merge: -1
  img_proc: true
