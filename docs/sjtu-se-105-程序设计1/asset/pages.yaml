  md: "# 类模板中的友元声明\n\n+   - 声明依赖性\n+     - 编译器将友元声明当做类或函数的声明对待\n+   - 要想限制对特定实例化的友元关系，必须在可以用于友元声明之前声明类或函数\n\
    \n```\ntemplate <class T> class A;\ntemplate <class T> class B{\npublic:\n   \
    \ friend class A<T>; //ok: A is known to be a template\n    friend class C;  \
    \  //ok: C must be an ordinary, nontemplate class\n    template <class S> friend\
    \ class D; //ok: D is a template\n    friend class E<T>; //error: E wasn’t declared\
    \ as a template\n    friend class F<int>; //error: F wasn’t declared as a template\n\
    }\n```"
