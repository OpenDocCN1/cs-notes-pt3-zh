- pgno: 860
  md: "# 线段组 Lines\n\n```\nstruct Lines : Shape {\n    // 一个Lines对象是一组线段\n    // 可以象操作单个形状一样操作一组形状，例如：同时移动所有形状\n\
    \    void add(Point p1, Point p2);   // 添加一条从p1到p2的线段\n    void draw_lines() const;\
    \        // 由Window调用用来绘制Lines\n};\n```\n\n+   ➢ **术语解释**\n+   \n+   - Lines is\
    \ “derived from” Shape　Lines是从Shape派生的\n+   - Lines “inherit from” Shape　 Lines继承自Shape\n\
    +   - Lines is “a kind of” Shape　 Linse是一种Shape\n+   - Shape is “the base” of\
