- pgno: 1000
  md: '# 动态存储设施


    +   - 这些设施包含两种操作：

    +   - new

    +     - 为某种类型的对象保留内存空间

    +     - 初始化对象

    +     - 并返回指向该对象的指针

    +   - delete

    +     - 传递给它一个指向用new创建的对象的指针

    +     - 销毁该对象

    +     - 并释放该对象先前占用的内存空间'
  merge: -1
  img_proc: true
- pgno: 1001
  md: '# new 和 delete


    +   - 下面是一个示例:

    +     - int *ip = new int;

    +   - 这将为一个整数创建新的内存空间

    +     - 并返回指向该空间的地址，将其赋给ip

    +   - 注意，我们还未对该整数做任何初始化

    +     - 任何随机的适合int表示的整数都是合法的值'
  merge: -1
  img_proc: true
