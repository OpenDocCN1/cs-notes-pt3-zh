  md: "# 模板形参\n\n+   - 模板形参的名字可以\n+     - 在声明为模板形参之后\n+     - 直到模板声明或定义的末尾处使用\n+ \
    \  - 模板形参遵循常规的名字屏蔽规则\n\n```\ntypedef double T;\n\ntemplate <class T> T calc(const\
    \ T &a, const T &b)\n{\n    T tmp = a; // which T ?!\n    return tmp;\n}\n```\n\
    \n+   - T定义为double的全局类型别名被命名为T的类型形参所屏蔽"
