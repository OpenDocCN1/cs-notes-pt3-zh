- pgno: 1181
  md: '# 重载与函数模板


    +   - 如果重载函数中既有普通函数又有函数模板，确定函数调用的步骤如下

    +     - 为这个函数名建立候选函数集合，包括：

    +       - 与被调用函数名字相同的任意普通函数

    +       - 任意函数模板实例化，在其中，模板实参推断发现了与调用中所用函数实参相匹配的模板实参

    +     - 确定哪些普通函数是可行的；候选集合中的每个模板实例都是可行的，因为模板实参推断保证函数可以被调用

    +     - 如果需要转型来进行那个调用，根据转型的种类排列可行函数；调用模板函数的实例所允许的转型是有限的

    +       - 如果只有一个函数可选，就调用这个函数

    +       - 如果调用有二义性，从可行函数集合中去掉所有函数模板实例

    +     - 重新排列去掉函数模板实例的可行函数

    +     - 如果只有一个函数可选，就调用这个函数

    +     - 否则，调用有二义性'
