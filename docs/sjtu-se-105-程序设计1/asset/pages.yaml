- pgno: 30
  md: '# 问题的解决


    +   - 解决问题的策略

    +     - 分而治之（divide and conquer）

    +     - 逐步求精（stepwise refinement）

    +   - 计算机解决问题的方法

    +     - 人们用程序设计语言描述要解决的问题及解决的方案

    +     - 用语言翻译/编译器加工使计算机理解其描述

    +     - 然后就可以使计算机进行工作了'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - 机器语言 ➔ 汇编语言

    +     - a=3*a-2*b+1; //把表达式3*a-2*b+1的结果赋值给a


    | 汇编语言 | 机器语言 |

    |---|---|

    | mov eax, DWORD PTR a_[ebp] | 8b 45 fc |

    | lea eax, DWORD PTR [eax+eax*2] | 8d 04 40 |

    | mov ecx, DWORD PTR b_[ebp] | 8b 4d f8 |

    | add ecx, ecx | 03 c9 |

    | sub eax, ecx | 2b c1 |

    | inc eax | 40 |

    | mov DWORD PTR a_[ebp], eax | 89 45 fc |'
  merge: -1
  img_proc: true
