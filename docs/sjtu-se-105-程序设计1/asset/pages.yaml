    \    for(i = 0; i < length-1; i++){\n        k = i;\n        for(j = i+1; j <\
    \ length; j++)\n            if(r[k] > r[j])\n                k = j;\n        tmp\
    \ = r[i];\n        r[i] = r[k];\n        r[k] = tmp;\n    }\n}\n```"
