- pgno: 920
  md: "# 函数的实现\n\n```\nFunction::Function( Fct f,\n    double r1, double r2,    //\
    \ range\n    Point xy,\n    int count,\n    double xscale, double yscale )\n{\n\
    \    if (r2-r1<=0) error(\"bad graphing range\");\n    if (count <=0) error(\"\
    non-positive graphing count\");\n    double dist = (r2-r1)/count;\n    double\
    \ r = r1;\n    for (int i = 0; i<count; ++i) {\n        add(Point(xy.x+int(r*xscale),\
    \ xy.y-int(f(r)*yscale)));\n        r += dist;\n    }\n}\n```"
  merge: -1
  img_proc: true
