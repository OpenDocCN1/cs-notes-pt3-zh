- pgno: 1188
  md: '# 模板小结


    +   - 模板是C++标准库的基础，是独立于类型的蓝图，编译器可以用它产生多种特定类型的实例

    +   - 我们只需编写一次模板，编译器将为使用模板的不同类型实例化模板

    +   - 既可以编写函数模板，又可以编写类模板


    +   - 显示模板实参能够固定一个或多个模板形参的类型或值

    +   - 模板特化定义了模板的不同版本，将一个或多个形参绑定到特定类型或特定值'
