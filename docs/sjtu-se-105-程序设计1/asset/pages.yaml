  md: "+   - 使用void*时，我们必须自己告诉编译器它到底指向的是什么\n\n```\nvoid f(void* pv)\n{\n    void*\
    \ pv2 = pv;      // 拷贝没有问题 (拷贝就是void* s用途)\n    double* pd = pv;     // 错误： 不能将void*转化成double*\n\
    \    *pv = 7;             // 错误： 不能对void*解引用\n                         // int\
