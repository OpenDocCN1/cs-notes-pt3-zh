  md: '+   - 程序要解决什么问题？

    +     - 问题的描述是否清楚？

    +     - 问题在给定的时间、技能和可用的工具下是否是可管理的？

    +   - 将程序分解为可管理的若干部分

    +     - 是否有工具和库等可以帮助我们解决问题？

    +       - 肯定有！例如 iostreams, vector 等.

    +   - 构建一个小型的有限的可以解决问題核心部分的版本(原型)

    +     - 按照我们的理解、想法和工具来揭示问题

    +     - 可能会改变问题描述的细节以使得它更容易管理

    +   - 如果这个原型无法正常工作

    +     - 将这个版本丢弃，再开发新的版本

    +     - 直至发现一个满意的原型为止

    +   - 构建完整的解决方案

    +     - 理想状态下，能够使用初始版本的各个部分'
