- pgno: 758
  md: '# 抽象类


    +   - 如果某个特定的类只有一个实例，那就有了办法了

    +   - .h 文件可以包含下面的访问函数原型：

    +     IntSet *getIntSet();

    +     // EFFECTS: returns a pointer to the IntSet

    +   - 源文件可以定义其实现的单个静态的实例

    +     - 以及访问函数的函数体

    +     static IntSetImpl i;

    +     IntSet *getIntSet() { return &i; }

    +   - 如果可以有多于一个的实例，那么就需要提供动态创建它们的函数'
  merge: -1
  img_proc: true
- pgno: 759
  md: "# 抽象类\n\n+   - `.h` 文件中的函数要定义成 static 的：\n+   \n+     ```cpp\n+     static\
    \ IntSet *getIntSet();\n+     ```\n+   \n+     ```cpp\n+     // EFFECTS: returns\
    \ a pointer to the IntSet\n+     ```\n\n+   - Static 作用于类的成员\n+     - 数据成员和函数成员\n\
    +     - 表示这些成员不属于某个特有的对象\n+     - 而是所有这个类的对象都具有的属性\n+     - 因此，不需要创建任何对象，即可在类上调用\n\
    +     - `IntSet* s = IntSet::getIntSet()`"
  merge: -1
  img_proc: true
- pgno: 760
  md: '+   - 抽象类是不完整的类

    +     - 它可以包含不是纯虚函数的成员函数

    +     - 只能当做基类使用

    +     - 不能从中创建任何对象

    +       - 因为它没有所有成员的完整定义

    +   - 抽象类的导出类自动是抽象类

    +     - 除非它提供了所有纯虚函数的定义

    +     - 并且不会引入新的纯虚函数'
  merge: -1
  img_proc: true
- pgno: 761
  md: '# 要点


    +   - 除了为了设计一个纯接口类之外，还有其他情况也需要使用纯虚函数

    +   - 基类对于某些成员来说没有“有意义的”定义

    +     - 其目的只是为了让其他类导出

    +   - 回忆Figure类

    +     - 所有图形都是导出类的对象

    +     - 包括矩形、圆形、三角形等

    +     - Figure 类不知道如何绘制draw

    +   - 可以将其声明成纯虚函数：'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# 总结


    +   - 延迟绑定将调用哪个函数实现的决定延迟到了运行时

    +   - 纯虚函数没有任何定义

    +     - 具有至少一个纯虚函数的类是抽象类

    +     - 从抽象类中不能创建任何对象

    +     - 其用法严格限制为只能作为基类供其他类导出

    +   - 导出类对象可以赋值给基类对象

    +     - 成员会丢失，切片问题

    +   - 指针赋值和动态对象

    +     - 可以修复切片问题

    +   - 将所有析构器都设成是virtual的

    +     - 确保内存会被正确释放'
  merge: -1
  img_proc: true
