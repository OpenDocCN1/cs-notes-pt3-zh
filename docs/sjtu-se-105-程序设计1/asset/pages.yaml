- pgno: 1081
  md: '+   - 在最坏情况下，我们要复制N-1个元素以便插入第N个元素

    +   - 但是，在此次复制之前的那次复制中

    +     - 我们为了插入第 N/2 个元素，复制了前(N/2-1)个元素

    +   - 依此类推，总共的复制数量为：

    +     - T=(N-1)+(N/2-1)+(N/4-1)+(N/8-1)+......

    +   - 我们可以将每一步的"-1"项省略

    +     - T< N+N/2+N/4+N/8+......'
  merge: -1
  img_proc: true
- pgno: 1082
  md: '+   - 因此，这里的根本问题是

    +     - 在公式右边终结前到底有多少项

    +   - 公式右边最终会终结

    +     - 因为我们只复制了有限个数的整数

    +   - 从合并项开始计算：

    +     - T < N+(N/2+N/4)+N/8+...

    +     - < N+3N/4+N/8+...

    +     - < N+(3N/4+N/8+...

    +     - < N+7N/8+...


    依此类推'
  merge: -1
  img_proc: true
- pgno: 1083
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1084
  md: "+   - 公式T < N + N/2 + N/4 + N/8 + ...\n+   - 右边是一个等比数列\n+     - 每一项都是前一项的1/2\n\
    +   - 等比数列的前n项和为\n+   \n+     $$\\sum_{i=0}^{n-1} a * r^{i} = a * \\frac{1 - r^{n}}{1\
    \ - r}$$\n+   \n+   - 其中 a=N， r=1/2\n+   - 当 n 变大时， r^n 项就会变小，所以可以忽略它\n+   - 这样，就可得\
    \ T < N(1)/(1-1/2) = N*2"
  merge: -1
  img_proc: true
