- pgno: 1079
  md: "```\nvoid grow()\n{\n    int *tmp = new int[sizeElts * 2];\n    for (int i\
    \ = 0; i < numElts; i++) {\n        tmp[i] = elts[i];\n    }\n    delete [] elts;\n\
    \    elts = tmp;\n    sizeElts *= 2;\n}\n```\n\n+   - 唯一的不同就是数组扩展了两倍而不是一个空位"
  merge: -1
