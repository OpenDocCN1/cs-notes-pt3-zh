  md: "# 简化输入循环\n\n```\nvoid fill_vector(istream& ist, vector<int>& v, char terminator)\n\
    {\n    // read integers from ist into v until we reach eof() or terminator\n \
    \   int i = 0;\n    while (ist >> i) v.push_back(i);\n    if (ist.eof()) return;\
    \      // fine: we found the end of file\n\n    // not good() and not bad() and\
