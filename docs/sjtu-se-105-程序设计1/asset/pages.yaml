    +   - 可以使用 “初始化器(initializer)” 强制初始化

    +     - int *ip = new int(5);


    +   - 这样会为新的整数创建内存空间，并将其初始化为5

    +     - 然后返回指向这个空间的指针


    +   - 这里容易混淆的地方：

    +     - 在上面的语句中包含两个对象'
