- pgno: 1098
  md: '# Const的用法


    +   - 2. 用const 修饰函数的返回值

    +   - 该返回值只能被赋给加const 修饰的同类型指针

    +   - 例如函数

    +   - `const char * GetString(void);`

    +   - 如下语句将出现编译错误：

    +   - `char *str = GetString(); //error`

    +   - 正确的用法是

    +   - `const char *str = GetString();`

    +   - 如果函数返回值采用“值传递方式”，由于函数会把返回值复制到外部临时的存储单元中，加const 修饰没有任何价值'
