  md: "```\nclass Punct_stream { // like an istream, but the user can add to\n   \
    \ // the set of whitespace characters\npublic:\n    Punct_stream(istream& is)\
    \ : source(is), sensitive(true) { }\n\n    void whitespace(const string& s) {\
    \ white = s; }   // make s the whitespace set\n    void add_white(char c) { white\
    \ += c; } // add to the whitespace set\n    bool is_whitespace(char c);      \
    \ // is c in the whitespace set?\n\n    void case_sensitive(bool b) { sensitive\
    \ = b; }\n    bool is_case_sensitive() { return sensitive; }\n\n    Punct_stream&\
