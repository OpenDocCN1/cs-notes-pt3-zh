- pgno: 497
  md: '+   - 分阶段构建程序时，总是会伴随着许多“典型的错误"

    +     - 即使有经验的程序员也会犯错误

    +       - 犯许多错误，这是成长的代价

    +     - 设计优秀的程序相当困难

    +     - 让编译器探测错误比在一开始就仔细确保每个细节都正确要快捷得多

