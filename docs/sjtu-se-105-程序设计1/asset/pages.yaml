  md: '# 编写泛型程序


    +   - 编写模板程序可以不针对特定类型

    +     - 但是对所使用的类型还是要做一些假设

    +     ```

    +     if (v1 < v2) return -1;

    +     if (v2 < v1) return 1;

    +     return 0;

    +     ```


    +   - 隐含条件即被测试的对象支持 < 操作


    +   - 如果被调用的对象是不支持 < 操作的，上述操作将无效


    +   - 泛型程序要保证在模板中使用操作作用于实参时可以正常运行'
  merge: -1
  img_proc: true
