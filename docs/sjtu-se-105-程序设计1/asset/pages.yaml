- pgno: 670
  md: '# 子类型


    +   - 如果我们有两个类型 S 和 T

    +   - S 是 T 的子类型，记作 S<:T，当且仅当：

    +     - 对于希望是 T 类型对象的任何实例

    +     - 都可以向其提供 S 类型的对象

    +       - 不需要修改原来的任何计算代码以保证程序的正确性

    +   - 如果 S 是 T 的子类型，那么：

    +     - T 类型的对象可以被 S 类型的对象所替换

    +       - 并没有改变程序的任何属性，例如正确性'
  merge: -1
  img_proc: true
- pgno: 671
  md: '+   - 如果 S<:T，那么也可以说：

    +     - T 是 S 的超类型(supertype)

    +   - 超类型 不能 替换 子类型

    +     - 所有的苹果都是水果，但是并非所有水果都是苹果

    +   - 这与类型转换不同

    +   - 例如：

    +     - 当需要 double 类型时

    +     - 可以将 int 转换为 double，从而改变 int 的物理表示

    +   - 在需要使用超类型的地方使用子类型

    +     - 并不会将其转换为超类型，而是将其当做超类型使用'
  merge: -1
  img_proc: true
