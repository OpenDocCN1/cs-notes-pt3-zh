  md: "# grow函数\n\n```\nvoid grow()\n{\n    int *tmp = new int[sizeElts + 1];\n  \
    \  for (int i = 0; i < numElts; i++) {\n        tmp[i] = elts[i];\n    }\n   \
    \ delete [] elts;\n    elts = tmp;\n    sizeElts += 1;\n}\n```"
