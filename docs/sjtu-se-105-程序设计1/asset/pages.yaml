- pgno: 1012
  md: '+   - 用于通过new()创建的对象的内存空间来自于

    +     - 内存中被称为堆的地方

    +   - 首先探讨典型的C++进程所使用的内存模型

    +     - 每个运行的程序都有一个地址空间

    +       - 该程序可以访问的一组内存位置

    +     - 地址空间对于一个运行的程序是私有的

    +       - 其他任何运行的程序都不能访问/修改它'
  merge: -1
  img_proc: true
- pgno: 1013
  md: '# 地址空间


    +   - 在地址空间中，典型地有5个部分，被成为段 “segments”：


    |  | address MAX |

    |---|---|

    | stack (grows down) | |

    | big void | |

    | heap (grows up) | |

    | globals

    (fixed size) | |

    | text (the program)

    (fixed size) | |

    | the little void | address 0 |'
  merge: -1
  img_proc: true
- pgno: 1014
  md: '# 地址空间


    +   - 由编译过的程序构成的代码位于文本段 text segment

    +     - 它位于地址空间中非常低的地址

    +       - 但是通常不是从地址 0 开始

    +   - 紧挨其上是编译器为全局变量分配的空间

    +     - 必要时会对其进行初始化

    +   - 对于通过 new() 分配的对象，位于堆中

    +     - 它可以向上扩展

    +   - 当函数被调用时，会在栈上创建栈内存帧

    +     - 它可以向下扩展'
  merge: -1
  img_proc: true
