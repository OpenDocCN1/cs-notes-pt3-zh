  md: '# 类型实现细节


    +   - 我们将类型实现细节称为

    +     - “具体表示(concrete representation)”

    +     - 有时也仅称为“表示”


    +   - 但是，我们希望确保：

    +     - 只有为该类型定义的操作能够直接访问该表示

    +     - 其他的操作都只能通过成员函数来访问/修改其状态


    +   - 两项任务：

    +     - 确定哪些具体数据元素将被用来表示各个值

    +     - 为每一个函数提供一个实现'
