  md: '# 分解的方式


    +   - 每个子问题在详细程度上处于同一个水平

    +   - 每个子问题都可以独立地解决

    +   - 子问题的解决方案结合在一起就构成了对原始问题的解


    +   ◆ 过程化程序设计方法

    +   1、开始游戏

    +   2、黑子先走

    +   3、绘制画面

    +   4、判断输赢

    +   5、轮到白子

    +   6、绘制画面

    +   7、判断输赢

    +   8、返回步骤2

    +   9、输出最后结果


    +   ◆ 对象化程序设计方法

    +   1、黑白双方，这两方的行为是一模一样的

    +   2、棋盘系统，负责绘制画面

    +   3、规则系统，负责判定诸如犯规、输赢等'
