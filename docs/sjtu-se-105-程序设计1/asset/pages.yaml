- pgno: 166
  md: "```\nstring FillZero(string str) {\n    if(str.size()%3==1){\n        str+=\"\
    00\";\n    }else if (str.size()%3==2){\n        str+=\"0\";\n    }\n    return\
    \ str;\n}\n\nstring DelZero(string str) {\n    if(str[0]=='0')\n        str =\
    \ str.substr(1);\n    if(str[0]=='0')\n        str = str.substr(1);\n    return\
    \ str;\n}\n```\n\n```\nstring GetMaxNumber(string str){\n    string max_number=str.substr(0,3);\n\
    \    str=str.substr(3);\n\n    while(str.size()!=0)\n    {\n        string current_number=str.substr(0,3);\n\
    \        if(max_number.compare(current_number)<0){\n            max_number=current_number;\n\
    \        }\n        str=str.substr(3);\n    }\n\n    return max_number;\n}\n```"
