- pgno: 42
  md: '以五子棋游戏为例：


    # 过程化程序设计方法


    +   1、开始游戏

    +   2、黑子先走

    +   3、绘制画面

    +   4、判断输赢

    +   5、轮到白子

    +   6、绘制画面

    +   7、判断输赢

    +   8、返回步骤2

    +   9、输出最后结果


    # 对象化程序设计方法


