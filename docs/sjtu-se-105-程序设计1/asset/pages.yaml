- pgno: 1103
  md: "# 模板形参\n\n+   - 用作模板形参的名字不能在模板内部重用：\n+   \n+   ```cpp\n+   template <class\
    \ T> T calc(const T &a, const T &b)\n+   {\n+       typedef double T;\n+     \
    \  T tmp = a;\n+       return tmp\n+   }\n+   ```\n+   \n+   - 模板形参的名字只能在同一个模板形参中使用一次\n\
    +   \n+   ```cpp\n+   template <class V, class V> V calc(const V&, const V&)\n\
    +   ```\n+   \n+   - 模板形参的名字可以在不同的模板中重用\n+   \n+   ```cpp\n+   template <class\
    \ T> T calc(const T&, const T&)\n+   template <class T> int compare(const T&,\
    \ const T&)\n+   ```"
  merge: -1
