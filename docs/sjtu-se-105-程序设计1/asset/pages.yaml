- pgno: 979
  md: "# 回调函数\n\n+   - 回调函数是对“系统”的接口的一部分\n+     - 在大多数的GUI中，函数和控件的连接都显得很复杂混乱\n+  \
    \   - 它不应该这样，但是\n+       - “系统”并不“了解”C++\n+       - 这种风格(混乱)产生自用C/汇编编写的，或者用于C/汇编的系统\n\
    +       - 主流的系统一般都采用多种语言，这是一个关于如何跨越语言障碍的例子\n+     - 回调函数是从系统惯例映射回 C++\n\n```\n\
    void Lines_window::cb_quit(Address, Address pw)\n    // Call Lines_window::quit()\
    \ for the window located at address pw\n{\n    reference_to<Lines_window>(pw).quit();\
    \    // now call our function\n}\n```\n\n将引用中的地址映射到存储在该地址的对象类型上，以后章节会详细解释"
  merge: -1
  img_proc: true
