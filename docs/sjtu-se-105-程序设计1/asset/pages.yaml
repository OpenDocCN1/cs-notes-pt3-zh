  md: "# 实例\n\n+   - 分解与抽象\n+     - 输入\n+     - 补齐0\n+     - 分割比较\n+     - 删除前导0\n\
    +     - 输出\n\n```\n```cpp\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\n\nstring FillZero(string str)；\nstring DelZero(string str);\nstring GetMaxNumber(string\
    \ str);\n\nint main(){\n    string str;\n    cin >> str;\n    string result;\n\
    \    result = FillZero(str);\n    result = GetMaxNumber(result);\n    result =\
