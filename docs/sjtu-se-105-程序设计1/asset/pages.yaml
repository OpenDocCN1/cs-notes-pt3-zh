- pgno: 929
  md: "```\ndouble fac(int n) {/* ... */}    // factorial\n\ndouble term(double x,\
    \ int n)    // x^n/n!\n{\n    return pow(x,n)/fac(n);\n}\n\ndouble expe(double\
    \ x, int n)    // sum of n terms of x\n{\n    double sum = 0;\n    for (int i\
    \ = 0; i<n; ++i) sum+=term(x,i);\n    return sum;\n}\n```"
