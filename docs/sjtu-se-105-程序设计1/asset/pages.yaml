- pgno: 1075
  md: '# grow函数的缺陷


    +   - 有可能会导致执行大量的复制操作

    +   - 假设用户创建了一个容量为 1 的IntSet

    +     - 然后向其中插入 N 个元素

    +   - 在将持有整数个数的上限设置得很紧凑时

    +     - 在最坏情况下，这个函数在不停地进行复制

    +   - 那么，当我们将数组扩展到可以包括第 N 个元素时

    +     - 必须将前 N-1 个元素复制到数组中

    +   - 当我们将数组扩展到可以包括第 N-1 个元素时

    +     - 必须将前 N-2 个元素复制到数组中'
  merge: -1
