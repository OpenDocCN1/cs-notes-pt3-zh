    +   - 这个世界上10种人，一种懂二进制，一种不懂二进制


    +   - 十进制整型数据（32位）的二进制补码


    +   - 二进制补码表示的数中，最高位是符号位（0为正，1为负）。


    +   - 正整数转换为二进制数据


    +   - 35 = 00000000, 00000000, 00000000, 00100011₂


    +   - 负整数转换为二进制数据


    +   - 先将对应的正整数转换为二进制数据，然后取补（取反加1）


    +   - -35 = 11111111, 11111111, 11111111, 11011101₂'
