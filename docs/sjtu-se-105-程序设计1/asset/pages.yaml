  md: '# 伴随多态的可互换对象


    +   - 将导出类看作是其基类称为向上转型（upcasting）

    +     - “转型（cast）”这个名称的灵感来自于模型铸造的塑模动作，而“向上（up）”这个词来源于继承图的典型布局方式：通常基类在顶部，而导出类在其下部散开。

