- pgno: 608
  md: '# 类型的角色


    +   - 与函数进行对比：

    +   - 函数给出的规格说明(Specification)

    +     - 描述了函数要 “做什么”

    +     - 但是没有描述 “怎样做”

    +   - 例如，如果找到了一种更快的计算阶乘的方式

    +     - 只需将原有实现替换为新的实现

    +     - 程序中任何别的组成部分都无需了解这个细节

    +   - 要想解决此问题，就需要定义抽象数据类型

    +     - Abstract data type， ADT'
  merge: -1
  img_proc: true
- pgno: 609
  md: '# 抽象数据类型


    +   - 抽象数据类型提供了值和操作的“抽象”描述

    +     - “抽象”意味着程序员不了解其细节

    +   - 抽象数据类型的定义必须包含：

    +     - 该类型表示“何种”值的描述

    +     - 以及这些值可以“如何”被操作的描述

    +   - 当我们使用ADT时，有关细节部分并不去考虑'
  merge: -1
  img_proc: true
- pgno: 610
  md: '+   - 抽象数据类型具有下面 3 个优势：

    +     - 信息隐藏

    +       - 我们不必了解对象如何被表示的细节

    +       - 也不必了解这些对象上的操作是如何实现的

    +     - 封装

    +       - 对象及其操作是在同一位置定义的

    +       - 抽象数据类型将数据与操作组合在同一个实体中

    +     - 语言中立

    +       - 可以用许多种语言实现

    +       - C++的类定义了抽象数据类型'
  merge: -1
  img_proc: true
