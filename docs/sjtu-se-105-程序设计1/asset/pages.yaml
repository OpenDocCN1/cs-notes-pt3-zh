- pgno: 992
  md: '# 固定尺寸结构


    +   - 目前为止我们构建的数据结构都能够存放“至多N个”元素

    +   - 例如：

    +     - 大富翁棋盘至多有40个格子

    +     - 各种 IntSet 实现至多能存放100个不同的整数

    +     - 扑克牌游戏中至多存放52张牌

    +   - 因此，我们希望能够扩展它们的尺寸

    +     - 但目前我们只了解如何创建静态的、固定尺寸的结构

    +   - 我们必须声明这些类型的变量能够存放多大的数据

    +     - 并且需要编写代码处理溢出的情况（例如IntSet）'
  merge: -1
  img_proc: true
- pgno: 993
  md: '# 固定尺寸结构


    +   - 有时，我们建模的处理存在物理极限

    +     - 这使得静态的、固定尺寸的结构是合理的选择

    +   - 例如，扑克牌的牌面有52种情况

    +     - 因此，它就有一個明确的上限'
  merge: -1
  img_proc: true
- pgno: 994
  md: '# 固定尺寸结构


    +   - 但是，上限有时是没有意义的

    +     - 对于一个“整数集”来说，限制其上限没有任何意义

    +   - 因此，无论我们将这个集的容量设置成多大

    +     - 某个应用最终可能还是需要更大的容量

    +   - 这个问题对于分配内存空间是至关重要的

    +     - 例如，对变量分配空间

    +   - 有两类这样的变量

    +     - 全局变量和局部变量'
  merge: -1
  img_proc: true
- pgno: 995
  md: '# 全局变量


    +   - 在函数定义之外定义的变量

    +   - 在程序开始执行之前，会为这些变量预留内存空间

    +     - 并将一直保留这些空间，直至程序执行完毕

    +   - 这部分空间是在编译时刻保留的'
  merge: -1
  img_proc: true
- pgno: 996
  md: '# 局部变量


    +   - 在块(block)中定义的所有变量

    +   - 包括函数参数

    +     - 它们就像是在函数最外层的块中定义的变量一样

    +   - 当执行到相关的块时，会为这些变量预留内存空间

    +     - 并将一直保留这些空间，直至块执行完毕

    +   - 这部分空间是在运行时刻保留的，但是编译器知道其尺寸'
  merge: -1
  img_proc: true
