- pgno: 903
  md: "# 纯虚函数\n\n+   - 通常，在接口中函数是无法实现的\n+     - 比如，所需的数据在派生类中被隐藏\n+     - 我们必须保证派生类实现这些函数\n\
    +     - 使它成为纯虚函数 (=0)\n\n+   - 以下代码说明了我们如何定义真正的抽象接口（纯接口）\n\n```\nstruct Engine\
    \ {        // interface to electric motors\n\n    // no data\n\n    // (usually)\
    \ no constructor\n\n    virtual double increase(int i) = 0;   // must be defined\
    \ in a derived class\n\n    // ...\n\n    virtual ~Engine(); // (usually) a virtual\
    \ destructor\n};\n\nEngine eee;  // error: Collection is an abstract class\n```"
  merge: -1
  img_proc: true
- pgno: 904
  md: "+   - 纯接口可以被当作基类使用\n+     - 构造函数和解析函数\n\n```\nClass M123 : public Engine {\
    \ // engine model M123\n    // representation\npublic:\n    M123();  // construtor:\
    \ initialization, acquire resources\n    double increase(int i) {/* ... */}  \
    \ // overrides Engine ::increase\n    // ...\n    ~M123(); // destructor: cleanup,\
    \ release resources\n};\n\nM123 window3_control;     // OK\n```"
  merge: -1
