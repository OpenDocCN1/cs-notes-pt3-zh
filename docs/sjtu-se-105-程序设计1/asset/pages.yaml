- pgno: 110
  md: '# 类型安全


    +   - 语言规则：类型安全

    +     - 每一个对象都将根据其类型使用

    +       - 变量只有被初始化之后才能使用

    +       - 只有为变量声明的类型而定义的操作采用应用其上

    +       - 为变量定义的每个操作在执行后，该变量都将获得一个有效的值

    +   - 理想：静态类型安全

    +     - 违反类型安全的程序将无法通过编译

    +       - (在理想系统中)编译器会报告所有这类违反类型安全的问题

    +   - 理想：动态类型安全

    +     - 如果编写的程序违反了类型安全，在运行时刻可以探测到

    +       - (在理想系统中)某些代码(通常是“运行时系统”)会探测编译器没有发现的所有违规情况'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 类型安全


    +   - 类型安全事关重大

    +     - 要十分仔细，不能违反它

    +     - 在编程时，编译器是最好的朋友

    +   - C++ 不是(完全)静态类型安全

    +     - 没有一种广泛使用的语言是(完全)静态类型安全的

    +     - 要做到完全静态类型安全，可能会影响你表达思想

    +   - C++ 不是(完全)动态类型安全

    +     - 许多语言都是动态类型安全的

    +     - 要做到完全静态类型安全，可能会影响你表达思想

    +     - 并且经常会使得产生的代码量很大或者运行速度很慢

    +   - 这里要学习的大多数内容都是类型安全

    +     - 我们会提到所有类型不安全的做法'
  merge: -1
  img_proc: true
