    +     - 编译器知道该尺寸

    +   - 例如：

    +     - 持有 一个整数所需的内存数量很容易计算

    +     - 只要给出恰当的类型定义即可

    +   - 但是，我们也可以创建尺寸未知的对象

    +     - 编译器不了解其尺寸

