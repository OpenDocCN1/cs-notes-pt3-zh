- pgno: 380
  md: '+   - 循环是非常强大的构建程序解决方案的方法

    +   - 尾递归：

    +     - 无需对递归调用返回的结果再执行挂起的操作

    +   - 普通递归

    +     - 与尾递归情况不同

    +   - 例如，下面的函数就是尾递归：

    +     `int f(int x) { return f(x-1); }`

    +   - 但是下面的函数就不是：

    +     `int f(int x) { return f(x) - 1; }`'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   - 尾递归解决方案的本质：

    +     - 只需要“常量内存空间”

    +       - 无论要解决的问题多“大”，只需要固定数量的栈内存帧

    +   - 对于迭代解决方案也是如此

    +   - 实际上，两个版本的factorial()非常相似

    +   - 这种相似性不是偶然的

    +   - 对于任何尾递归函数，都可编写出等价的迭代版本

    +   - 换句话说，尾递归“只是”迭代'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# 总结


    +   - 这种等价性对于普通递归程序来说并不成立

    +     - 特别是，有些递归程序不能用常量内存空间来解决，例如，树的遍历问题


    +   - 应该尽量以尾递归方式编写递归程序

    +   - 如果某个递归不是尾递归（就像第一个版本的 factorial）

    +     - 必须引入一个助手函数，将其改写成尾递归'
