- pgno: 738
  md: '# 继承：复用接口


    +   - 当继承现有类型时，也就创造了新的类型。

    +     - 这个新的类型不仅包括现有类型的所有成员

    +       - 尽管 private 成员被隐藏了起来，并且不可访问

    +     - 而且更重要的是它复制了基类的接口。


    通过继承而产生的类型等价（type equivalence）是理解面向对象程序设计方法内涵的重要门槛。


    ![](img/d2d3f908f0e1c0f8ca98d9dfbe006a9f_738_0.png)'
