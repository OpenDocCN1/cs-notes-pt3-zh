- pgno: 1016
  md: '# 动态数组


    +   - 创建动态数组的语法与创建单个元素的语法很相似

    +   - 内存分配工作正如我们所期望的那样

    +     `int *ia = new int[5]`

    +     - 这会在堆中创建一个包含5个整数的数组

    +     - 并在ia中存储一个指向该数组第一个元素的指针

    +   - 与单个整数一样

    +     - 整数数组不必初始化'
  merge: -1
  img_proc: true
- pgno: 1017
  md: '# 动态数组


    +   - 释放一个数组的工作与释放单个对象略有差异

    +   - 释放数组：

    +     `delete[] ia;`

    +   - 如果分配了一个 T 类型的数组，那么

    +     - 必须使用 delete[] 操作符来释放它

    +     - 一般的 delete 操作符无法实现此目的

    +   - 概念上讲，数组分配器与单例分配器

    +     - 完全不同

    +     - 混用会导致未定义的行为'
  merge: -1
  img_proc: true
- pgno: 1018
  md: '+   - 这是因为

    +     - 语言的运行时系统必须跟踪数组的尺寸

    +       - 因为(通常)编译器无法知晓

    +     - 这个信息是动态的

    +   - 当new操作符发现需要分配数组时

    +     - 它会将数组的尺寸和数组一起存储

    +   - 它会从数组的空间中辟出一块


