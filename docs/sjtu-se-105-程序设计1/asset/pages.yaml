    \ p1, Point p2) // 构造一条从p1 到 p2的线段\n{\n    add(p1);    // 添加 p1 到该形状 (add() 函数由Shape类提供)\n\
    \    add(p2);    // 添加 p2 到该形状\n}\n```"
