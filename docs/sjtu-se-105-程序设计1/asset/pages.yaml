  md: '# 明显类型和实际类型


    +   - 当代码中包含引用时，需要区分明显类型和实际类型

    +     - Apparent type vs. Actual type

    +   - 明显类型：引用的声明类型

    +   - 实际类型：引用的真实类型

    +   - 注意：即使编译器“看到”这种赋值

    +     - 它也不认为它了解的比“声明”更多

    +   - 在这个例子中，r = s 不会改变 r 的明显类型

    +     - 这对于方法选择有十分重要的含义


