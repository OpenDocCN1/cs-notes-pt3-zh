  md: "# 冒泡排序\n\n```\nvoid BubbleSort(int* r,int length){\n    int i,j,tmp;\n    for(i\
    \ = 0; i < length; i++){\n        for(j = i+1; j < length; j++)\n            if(r[i]\
    \ > r[j]){\n                tmp = r[i];\n                r[i] = r[j];\n      \
    \          r[j] = tmp;\n            }\n    }\n}\n\nint main(){\n    int a[10]\
    \ = {2,4,6,8,10,1,3,5,7,9};\n    BubbleSort(a,10);\n}\n```"
