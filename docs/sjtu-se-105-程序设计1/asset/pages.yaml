- pgno: 633
  md: '+   - 在这个集上我们定义4个操作：

    +     - 在集中插入一个值

    +     - 在集中移除一个值

    +     - 查询一个值是否在集中

    +     - 计算集中的元素个数'
  merge: -1
  img_proc: true
- pgno: 634
  md: '+   - 下面是这个抽象数据类型的“不完整”的定义：

    +   ```

    +   class IntSet {

    +       // OVERVIEW: a mutable set of integers

    +   public:

    +       void insert(int v);  // MODIFIES: this

    +                       // EFFECTS: this = this + {v}

    +       void remove(int v); // MODIFIES: this

    +                       // EFFECTS: this = this - {v}

    +       bool query(int v);   // EFFECTS: returns true if v is in this

    +       int size();          // EFFECTS: returns |this|

    +   }

    +   ```'
  merge: -1
  img_proc: true
- pgno: 635
  md: '+   - 这个类不完整是因为我们还没有为这个集选择一种表示法

    +   - 选择表示法涉及到：

    +     - 确定什么样的具体数据元素将被用来表示集中的值

    +     - 为每个方法提供一个实现

    +   - 即便如此，这个不完整的定义也已经为IntSet的用户提供了所需了解的全部内容：

    +     - 这个抽象数据类型的概况

    +     - 以及每个方法的规格说明'
