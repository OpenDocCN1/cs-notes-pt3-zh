- pgno: 353
  md: '# 尾递归


    +   - 两个递归过程看起来是相同的

    +   - 但是，它们存在本质区别：

    +     - 新版本做的工作更少

    +     - 它从最深层调用直接返回最终结果到最顶层

    +     - 而旧版本在每一层都需要拿到返回结果后再做处理

    +   - 这到底有什么不同呢？'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 尾递归


    +   - 新版本中我们优化了对栈的使用

    +   - 函数的活动记录只有在计算未处理完的情况下才需要

    +   - 只要函数返回值已知，那么活动记录就可以丢弃

    +     - 这就意味着对内存空间的使用更有效率'
  merge: -1
  img_proc: true
- pgno: 355
  md: '+   - 在新版本中，具体的返回值是未知的

    +     - 在每次递归调用时未知


    +   - 但是，每个调用都知道，无论它产生的递归调用返回什么：

    +     - 该返回值也就是这个调用要返回的值


    +   - 这意味着再也不需要为调用者在栈中分配帧

    +     - 我们可以将其丢弃


    +   - 这就是“尾递归（tail-recursion）”


    +   - 由于在每个递归步骤中都不再执行未完成的计算

    +     - 我们可以重用活动记录而不是创建新的活动记录'
  merge: -1
  img_proc: true
