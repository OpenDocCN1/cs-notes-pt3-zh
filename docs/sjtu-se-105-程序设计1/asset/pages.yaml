- pgno: 638
  md: "# IntSet示例\n\n```\n```cpp\nconst int MAXELTS = 100;\nclass IntSet { // a mutable\
    \ set of integers, |set| <= MAXELTS\nint elts[MAXELTS];\n    int numElts;\n  public:\n\
    \    void insert(int v); // MODIFIES: this\n                      // EFFECTS:\
    \ this = this + {v} if room,\n                      //throws int MAXELTS otherwise\n\
    \    void remove(int v); // MODIFIES: this\n                       // EFFECTS:\
    \ this = this - {v} if v is in this\n                       // throws int v otherwise.\n\
    \    bool query(int v); // EFFECTS: returns true if v is in this, false otherwise\n\
    \    int size();        //EFFECTS: returns |this|\n};\n```\n```"
  merge: -1
  img_proc: true
- pgno: 639
  md: "+   - 在这样的表示法和不变式下，可以很容易地写出各个方法\n+   - 从最容易的size()开始：\n+   - 由于不变式要求numElts\
    \ 始终表示集的尺寸，因此可以立即返回它：\n\n```\nint IntSet::size()\n{\n    return numElts;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 640
  md: '# IntSet示例


    +   - 接下来考虑其他三个函数

    +     - query: 在数组中查找某个指定的数字

    +     - remove: 在数组中查找某个数字，如果该数字存在，则移除它

    +     - insert: 在数组中查找某个数字，如果该数字不存在，则插入它

    +   - 所有这些函数的共同点就是都有“查找”部分

    +   - 大家可能会想到使用 query 来编写 insert 和 remove

    +     - 但是这对 remove 行不通

    +     - query 只能告诉我们元素是否存在，但是不能告诉我们其位置

    +   - 因此，我们还需要一个方法

    +     - indexOf(int v): 如果 v 在集中，则返回 v 在集合中的位置'
  merge: -1
  img_proc: true
- pgno: 641
  md: "```\nconst int MAXELTS = 100;\nclass IntSet { // OVERVIEW: a mutable set of\
    \ integers, |set| <= MAXELTS\n    int elts[MAXELTS];\n    int numElts;\n    int\
    \ indexOf(int v); // EFFECTS: returns the index of v if it exists in the array\n\
    \                        // MAXELTS otherwise\n\n    void insert(int v); // MODIFIES:\
    \ this\n                        // EFFECTS: this = this + {v}, throws int MAXELTS\
    \ otherwise\n    void remove(int v); // MODIFIES: this\n                     \
    \   // EFFECTS: this = this - {v} if v is in this; throws int v otherwise\n  \
    \  bool query(int v); // EFFECTS: returns true if v is in this, false otherwise\n\
    \    int size();        // EFFECTS: returns |this|\n}\n```"
  merge: -1
  img_proc: true
- pgno: 642
  md: "# IntSet示例\n\n+   - indexOf(int v)必须是private的\n+   - 这是因为它暴露了具体表示的细节\n+   -\
    \ 这些细节向这个类的客户暴露是不恰当的\n\n```\nint IntSet::indexOf(int v)\n{\n    for (int i = 0;\
    \ i < numElts; i++) {\n        if (elts[i] == v) {\n            return i;\n  \
    \      }\n    }\n    return MAXELTS;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 643
  md: '+   - 有了 indexOf， query 就容易编写了：

    +     ```

    +     bool IntSet::query(int v)

    +     {

    +       return (indexOf(v) != MAXELTS);

    +     }

    +     ```

    +   - insert 也不会困难多少：

    +     - 首先查找待插入元素的索引

    +     - 如果不存在，则需要插入该元素

