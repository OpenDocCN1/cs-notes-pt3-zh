- pgno: 636
  md: '+   - 首先，从set自身的表示法开始

    +   - 使用数组：

    +     - 将尺寸为N的集表示成为一个无序的整数数组

    +     - 由于没有重复元素，所以存储在这个数组的前N个槽位(slot)中

    +   - int numElts: 表示数组中当前的元素个数

    +   - 红色的两句话被称为表示不变式( representation invariants)'
