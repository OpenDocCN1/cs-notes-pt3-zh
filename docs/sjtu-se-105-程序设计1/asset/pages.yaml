- pgno: 644
  md: "# IntSet示例\n\n+   - 由于**numElts**存储了数组中元素的个数\n+     - 当前的末尾就是\n+   - 将待插入元素插入到这个槽位，然后更新numElts\n\
    +   - 唯一的例外就是当 numElts 等于MAXELTS时，插入失败\n\n```\nvoid IntSet::insert(int v){\n \
    \   if (indexOf(v) == MAXELTS) {\n    if (numElts == MAXELTS) throw MAXELTS;\n\
    \    elts[numElts++] = v;\n    }\n}\n```"
