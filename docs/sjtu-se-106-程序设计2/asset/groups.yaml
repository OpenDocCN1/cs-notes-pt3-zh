    \n## 为什么是 C++ 设计？\n\n- ◆ 客户端代码仅依赖于公共接口\n  - 原则上，如果 ColorPoint 接口包含 Point 接口，则任何客户端都可以使用\
    \ ColorPoint 代替 point\n  - 然而 -- 虚函数表中的偏移可能不同\n  - 失去实现效率（像 Smalltalk）\n\n- ◆\
    \ 没有继承的链接\n  - 子类型导致实现效率的损失\n\n- ◆ 还有封装问题：\n  - 基于继承的子类型在基类修改下得以保留 ...\n\n## 示例\n\
    \n- ◆ 如果 circle <: shape，则\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_56_0.png)\n\
    \nC++ 编译器识别有限形式的函数子类型\n\n## 函数的子类型\n\n```\nclass Point {\npublic:\n    int getX();\n\
    \    virtual Point * move(int);\nprotected:    ...\nprivate:      ...\n};\n```\n\
    \n```\nclass ColorPoint: public Point {\npublic:\n    int getX();\n    int getColor();\n\
    \    ColorPoint * move(int);\n    void darken(int);\nprotected:    ...\nprivate:\
    \      ...\n};\n```\n\n继承，但为清晰起见在此重复\n\n- **原则上：** 可以有 `ColorPoint <: Point`\n\
    - **实践中：** 有些编译器允许，其他则没有\n\n这是协变情况；逆变是另一个故事\n\n## 抽象类\n\n- 抽象类：\n  - 一个没有完整实现的类\n\
    \  - 通过 =0 声明（多么棒的语法！）\n  - 有用因为它可以有派生类\n    由于 C++ 中子类型遵循继承，使用抽象类来构建子类型层次结构。\n\
    \  - 建立虚函数表（vtable）的布局\n\n- 示例\n  - 读者附录中的几何类\n    - Shape 是 circle、rectangle\
    \ 等的抽象超类型\n\n## 多重继承\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_59_0.png)\n\n\
    从独立类继承独立功能\n\n## 问题：名称冲突\n\n```\nclass A {\n    public:\n        void virtual\
    \ f() { ... }\n};\nclass B {\n    public:\n        void virtual f() { ... }\n\
    };\nclass C : public A, public B { ... };\n...\n    C* p;\n    p->f();    // error\n\
    ```\n\n在 2 个基类中同名\n\n## 名称冲突的可能解决方案\n\n- 三种通用方法\n  - 隐式解析\n    - 语言用任意规则解决名称冲突\n\
    \  - 显式解析\n    - 程序员必须显式解决名称冲突\n  - 禁止名称冲突\n    - 程序不允许包含名称冲突\n\n- 没有解决方案总是最好\n\
    \n- C++ 使用显式解析\n\n"
