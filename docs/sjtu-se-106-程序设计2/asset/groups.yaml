    # A Recursive Definition for Trees


    +   - When you think about trees with an eye toward representing their internal
    structure, the following definition is extremely useful:

    +     - A *tree* is a pointer to a node.

    +     - A *node* is a structure that contains some number of trees, usually along
    with some additional data.

    +   - Although this definition is clearly circular, it is not necessarily infinite,
    either because

    +     - Tree pointers can be `NULL` indicating an empty tree.

    +     - Nodes can contain an empty list of children.

    +   - In C++, programmers typically define a structure or object type to represent
    a node and then use an explicit pointer type to represent the tree.'
