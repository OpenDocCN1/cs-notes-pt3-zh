    # 7、树和森林


    # 3、树、森林的遍历


    +   森林的前序、中序遍历：


    +   前序遍历类似于树的前序遍历。增加一个虚拟的根结点，它的儿子为各棵树的根。那么对这棵树进行前序遍历，即得到森林的前序序列（不含树根结点）


    +   中序遍历类似于树的后序遍历。增加一个虚拟的根结点，它的儿子为各棵树的根。那么对这棵树进行后序遍历，即得到森林的中序遍历（去掉树根结点）


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_630_0.png)


