    using namespace std;\n\nPersonNode::PersonNode(string name) {\n    this->name\
    \ = name;\n    this->parent = NULL;\n}\n\nstring PersonNode::getName() {\n   \
    \ return name;\n}\n\nvoid PersonNode::addChild(PersonNode *child) {\n    children.add(child);\n\
