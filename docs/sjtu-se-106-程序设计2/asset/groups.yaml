  md: "\n## Graph Terminology\n- Mathematicians often use the words *vertex* and *edge*\
    \ for the structures that computer scientists call *node* and *arc*. We’ll stick\
    \ with the computer science names, but you might see their mathematical counterparts\
    \ in algorithmic descriptions.\n- The nodes to which a particular node is connected\
    \ are called its *neighbors*.\n- In an undirected graph, the number of connections\
    \ from a node is called its *degree*. In a directed graph, the number of arcs\
    \ leading outward is called the *out-degree*, and the number of arcs leading inward\
    \ is called the *in-degree*.\n- A series of arcs that connect two nodes is called\
    \ a *path*. A path that returns to its starting point is called a *cycle*.\n-\
    \ A graph in which there is a path between every pair of nodes is said to be *connected*.\n\
    \n## 图计算\n- 最近我们试图将淘宝的交易记录中的物品和人组成一个对分网络（bipartite network）。对于这个网络的，我们有许多有趣的问题：这个网络中节点的度分布会是什么样？在这个网络中，是否也存在“权威节点”？是否也有所谓的“小世界现象”。工欲善其事必先利其器，在回答这个问题前，如何存储这个图（上亿个节点，几十亿条边），如何快速地将图算法应用到这个图上\n\
    \n## 幂律分布\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_678_0.png)\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_678_1.png)\n\
    \n## 无标度网络(自然图)\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_679_0.png)\nInternet、电子邮件网络、电影演员合作网络、引文关系网络的节点的度都符合幂律分布\n\
    \n## Internet拓扑图\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_680_0.png)\n\n## Designing\
    \ a Graph Interface\n- To take maximum advantage of the intuition that people\
    \ have with graphs, it makes sense to design a graph package in C++ so that it\
    \ adheres as closely as possible to the way graphs in mathematics. In particular,\
    \ the idea that a graph is a set of nodes together with a set of arcs should be\
    \ clear from the definition.\n- Both nodes and arcs have some properties that\
    \ are closely tied to the graph in which they belong. Each node, for example,\
    \ must keep track of the arcs that lead to its neighbors. In much the same way,\
    \ each arc needs to know what nodes it connects.\n- At the same time, both nodes\
    \ and arcs are likely to contain other information that depends on the application,\
    \ such as the name of a node or the cost of traversing an arc.\n\n## Three Strategies\n\
    - 1. *Use low-level structures.* This design uses the structure types `Node` and\
    \ `Arc` to represent the components of a graph. This model gives clients complete\
    \ freedom to extend these structures but offers no support for graph operations.\n\
    \n## The low-level graphtypes.h Interface\n```\n/*\n * File: graphtypes.h\n *\
    \ -------------------\n * This file defines low-level data structures that represent\
    \ graphs.\n */\n\n#ifndef _graphtypes_h\n#define _graphtypes_h\n\n#include <string>\n\
    #include \"map.h\"\n#include \"set.h\"\n\nstruct Node;      /* Forward references\
    \ to these two types so  */\nstruct Arc;       /* that the C++ compiler can recognize\
    \ them. */\n\n/*\n * Type: SimpleGraph\n * -----------------\n * This type represents\
    \ a graph and consists of a set of nodes, a set of\n * arcs, and a map that creates\
    \ an association between names and nodes.\n */\n\nstruct SimpleGraph {\n    Set<Node\
    \ *> nodes;\n    Set<Arc *> arcs;\n    Map<std::string,Node *> nodeMap;\n};\n\
    ```\n\n## The low-level graphtypes.h Interface\n```\n/*\n * Type: Node\n * --------\n\
    \ * This type represents an individual node and consists of the\n * name of the\
    \ node and the set of arcs from this node.\n */\n\nstruct Node {\n    std::string\
    \ name;\n    Set<Arc *> arcs;\n};\n\n/*\n * Type: Arc\n * --------\n * This type\
    \ represents an individual arc and consists of pointers\n * to the endpoints,\
    \ along with the cost of traversing the arc.\n */\n\nstruct Arc {\n    Node *start;\n\
    \    Node *finish;\n    double cost;\n};\n\n#endif\n```\n\n## Three Strategies\n\
    - 1. *Use low-level structures.* This design uses the structure types `Node` and\
    \ `Arc` to represent the components of a graph. This model gives clients complete\
    \ freedom to extend these structures but offers no support for graph operations.\n\
    - 2. *Define classes for each of the component types.* This design uses the `Node`\
    \ and `Arc` classes to define the structure. In this model, clients define subclasses\
    \ of the supplied types to particularize the graph data structure to their own\
    \ application.\n- 3. *Adopt a hybrid strategy.* This design defines a `Graph`\
    \ class but parameterizes that class so that it can use any structures or objects\
    \ as the node and arc types. This strategy retains the flexibility of the low-level\
    \ model and avoids the complexity associated with the class-based approach.\n"
  mdcn: "\n## 图术语\n- 数学家经常使用 *vertex* 和 *edge* 来表示计算机科学家所称的 *node* 和 *arc*。我们将沿用计算机科学的命名，但你在算法描述中可能会看到它们的数学对应词。\n\
    - 与特定节点相连的节点称为其 *neighbors*。\n- 在无向图中，从一个节点发出的连接数称为其 *degree*。在有向图中，向外发出的弧的数量称为\
    \ *out-degree*，向内进入的弧的数量称为 *in-degree*。\n- 连接两个节点的弧的序列称为 *path*。返回到起点的路径称为 *cycle*。\n\
    - 如果图中每对节点之间都存在路径，则称该图为 *connected*。\n\n## 图计算\n- 最近我们试图将淘宝的交易记录中的物品和人组成一个对分网络（bipartite\
    \ network）。对于这个网络的，我们有许多有趣的问题：这个网络中节点的度分布会是什么样？在这个网络中，是否也存在“权威节点”？是否也有所谓的“小世界现象”。工欲善其事必先利其器，在回答这个问题前，如何存储这个图（上亿个节点，几十亿条边），如何快速地将图算法应用到这个图上\n\
    \n## 幂律分布\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_678_0.png)\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_678_1.png)\n\
    \n## 无标度网络(自然图)\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_679_0.png)\nInternet、电子邮件网络、电影演员合作网络、引文关系网络的节点的度都符合幂律分布\n\
    \n## Internet拓扑图\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_680_0.png)\n\n## 设计图接口\n\
    - 为了最大程度利用人们对图的直觉，有意义地用 C++ 设计一个图包，使其尽可能贴近数学中图的定义。特别是，图是一个节点集合加上一个弧集合这一思想应从定义中明确。\n\
    - 节点和弧都有一些与它们所属的图紧密相关的属性。例如，每个节点必须跟踪通向其邻居的弧。同样，每个弧需要知道它连接的是哪些节点。\n- 同时，节点和弧很可能包含其他取决于应用的信息，例如节点的名称或遍历弧的成本。\n\
    \n## 三种策略\n- 1. *使用低层结构。* 这种设计使用结构类型 `Node` 和 `Arc` 来表示图的组件。此模型为客户端提供了完全自由地扩展这些结构，但不提供图操作的支持。\n\
    \n## 低层 graphtypes.h 接口\n```\n/*\n * File: graphtypes.h\n * -------------------\n\
    \ * This file defines low-level data structures that represent graphs.\n */\n\n\
    #ifndef _graphtypes_h\n#define _graphtypes_h\n\n#include <string>\n#include \"\
    map.h\"\n#include \"set.h\"\n\nstruct Node;      /* Forward references to these\
    \ two types so  */\nstruct Arc;       /* that the C++ compiler can recognize them.\
    \ */\n\n/*\n * Type: SimpleGraph\n * -----------------\n * This type represents\
    \ a graph and consists of a set of nodes, a set of\n * arcs, and a map that creates\
    \ an association between names and nodes.\n */\n\nstruct SimpleGraph {\n    Set<Node\
    \ *> nodes;\n    Set<Arc *> arcs;\n    Map<std::string,Node *> nodeMap;\n};\n\
    ```\n\n## 低层 graphtypes.h 接口\n```\n/*\n * Type: Node\n * --------\n * This type\
    \ represents an individual node and consists of the\n * name of the node and the\
    \ set of arcs from this node.\n */\n\nstruct Node {\n    std::string name;\n \
    \   Set<Arc *> arcs;\n};\n\n/*\n * Type: Arc\n * --------\n * This type represents\
    \ an individual arc and consists of pointers\n * to the endpoints, along with\
    \ the cost of traversing the arc.\n */\n\nstruct Arc {\n    Node *start;\n   \
    \ Node *finish;\n    double cost;\n};\n\n#endif\n```\n\n## 三种策略\n- 1. *使用低层结构。*\
    \ 这种设计使用结构类型 `Node` 和 `Arc` 来表示图的组件。此模型为客户端提供了完全自由地扩展这些结构，但不提供图操作的支持。\n- 2. *为每种组件类型定义类。*\
    \ 这种设计使用 `Node` 和 `Arc` 类来定义结构。在此模型中，客户端定义所提供类型的子类，以将图数据结构具体化到其自己的应用。\n- 3. *采用混合策略。*\
    \ 这种设计定义了一个 `Graph` 类，但对该类进行参数化，使其可以使用任何结构或对象作为节点和弧类型。此策略保留了低层模型的灵活性，并避免了基于类的复杂性。\n"
