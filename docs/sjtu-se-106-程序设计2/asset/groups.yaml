    # 图的定义


    +   - 一个 *图* 由一组 *节点* 和一组 *弧* 组成。节点对应于图示中的点或圆圈（可能是城市、词语、神经元，或其他任何东西），而弧对应于连接两个节点的链接。

    +   - 在某些图中，弧带有箭头表示两个节点之间链接的方向。这类图称为 *有向图*。

    +   - 在其他图中，弧只是表示可以在两个节点之间双向移动的简单连接。这些图是 *无向图*。

