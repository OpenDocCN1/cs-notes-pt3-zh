    \n- Separation of concerns\n  - Algorithms manipulate data, but don’t know about\
    \ containers\n  - Containers store data, but don’t know about algorithms\n  -\
    \ Algorithms and containers interact through iterators\n  - Each container has\
    \ its own iterator types\n\n## The STL\n\n- An ISO C++ standard framework of about\
    \ 10 containers and about 60 algorithms connected by iterators\n  - Other organizations\
    \ provide more containers and algorithms in the style of the STL\n    - Boost.org,\
    \ Microsoft, SGI, …\n- Probably the currently best known and most widely used\
