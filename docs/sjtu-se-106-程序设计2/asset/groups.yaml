    - Morphiosm\n  - Static / Dynamic\n  - Efficiency\n  - Evolution\n\n## 方案1：宏\n\
    \n- C的宏来实现通用容器（Linux 内核广泛使用）\n- 宏是模板的超集——因为宏不仅可以参数化类型，宏实质上可以参数化一切文本\n- 宏的最大的缺点就是它并不工作在C++的语法解析层面\n\
