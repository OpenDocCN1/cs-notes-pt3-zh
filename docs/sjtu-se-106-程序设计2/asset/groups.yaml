    取得新的控制面，进行控制面的分裂。将大约一半数据记录移入新的控制面；同时进行顺序索引集合中的相应结点的分裂。必要时，修改索引集合中的信息。 将新记录插入到相应的控制区间。


    ## 5、B树和B+树


    +   - 删除：后面的节点向前移动把空间留给新插入的记录。控制区间变空，修改相应的顺序索引集合中的索引项。

    +   - 优缺点：动态分配和释放存储，无需对文件进行重组，插入、查找快。空间利用率低，通常只有 50% ～ 70%。

    +   - 加速的考虑：设置多个副本的顺序集合索引。


