    ## 树的平衡算法


    AVL 算法是最早的树平衡策略，已被在实践中更有效的新算法所取代。这些算法包括：


    - 红黑树

    - 2-3 树

    - AA 树

    - 斐波那契树

    - 伸展树


    在本课程中，需要了解的重点是：在插入结点的过程中保持二叉树平衡是可行的，从而确保查找操作在 O(log N) 时间内完成。如果你对这类算法非常感兴趣，后续课程将为你提供更深入学习它们的机会。


