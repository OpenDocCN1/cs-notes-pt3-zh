    \ commentary.\n */\n```\n\n练习：实现两个版本的 addNode\n\n```\n/*\n * Method: addNode\n\
    \ * Usage: g.addNode(name);\n *        g.addNode(node);\n * -------------------\n\
    \ * Adds a node to the graph.  The first version of this method\n * creates a\
    \ new node of the appropriate type and initializes its\n * fields; the second\
    \ assumes that the client has already created\n * the node and simply adds it\
    \ to the graph.  Both versions of this\n * method return a pointer to the node\
    \ in case the client needs to\n * capture this value.\n */\n\nNodeType *addNode(string\
    \ name);\nNodeType *addNode(NodeType *node);\n```\n\n## 结束\n\n## 图算法\n\n## 郑伟\
    \ 齐\n\n大部分幻灯片来自 Eric Roberts，CS 106B，斯坦福大学\n\n## 大纲\n\n今天：\n\n- 回顾 `graphtypes.h`\
    \ 和 `graph.h` 接口\n- 带你参观 Pathfinder 作业\n- 描述深度优先和广度优先遍历\n- 讲解 Dijkstra 最短路径算法\n\
    - 讲解 Kruskal 最小生成树算法\n\n## 节点和弧结构\n\n```\n/*\n * Type: Node\n * ------------\n\
    \ * This type represents an individual node and consists of the\n * name of the\
    \ node and the set of arcs from this node.\n */\n\nstruct Node {\n    string name;\n\
    \    Set<Arc *> arcs;\n};\n\n/*\n * Type: Arc\n * ------------\n * This type represents\
    \ an individual arc and consists of pointers\n * to the endpoints, along with\
    \ the cost of traversing the arc.\n */\n\nstruct Arc {\n    Node *start;\n   \
    \ Node *finish;\n    double cost;\n};\n```\n\n## graph.h 接口中的条目\n\n```cpp\ntemplate\
    \ <typename NodeType, typename ArcType>\nclass Graph {\npublic:\n\n    Graph();\n\
    \    ~Graph();\n\n    void clear();\n\n    NodeType *addNode(string name);\n \
    \   NodeType *addNode(NodeType *node);\n\n    ArcType *addArc(string s1, string\
    \ s2);\n    ArcType *addArc(NodeType *n1, NodeType *n2);\n    ArcType *addArc(ArcType\
    \ *arc);\n\n    bool isConnected(NodeType *n1, NodeType *n2);\n    bool isConnected(string\
    \ s1, string s2);\n\n    NodeType *getNode(string name);\n\n    Set<NodeType *>\
    \ & getNodeSet();\n    Set<ArcType *> & getArcSet();\n    Set<ArcType *> & getArcSet(NodeType\
    \ *node);\n\n};\n```\n\n## Pathfinder 作业中的模块\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_702_0.png)\n\
    \n## 深度优先搜索\n\n- *深度优先搜索* 的遍历策略，或简称为 *DFS*，会递归地处理图，沿着每个分支继续，边走边访问节点，直到访问完所有节点。\n\
    - 深度优先搜索算法需要一些结构来跟踪已访问过的节点。常见策略是在每个节点中包含一个 `visited` 标志，或传递一个已访问节点集合，如以下代码所示：\n\
    \n```\nvoid depthFirstSearch(Node *start) {\n    Set<Node *> visited;\n    visitUsingDFS(start,\
    \ visited);\n}\n\nvoid visitUsingDFS(Node *start, Set<Node *> & visited) {\n \
    \   if (visited.contains(start)) return;\n    visit(start);\n    visited.add(start);\n\
    \    foreach (Arc *ap in start->arcs) {\n        visitUsingDFS(ap->finish);\n\
    \    }\n}\n```\n\n"
