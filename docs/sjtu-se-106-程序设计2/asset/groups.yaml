  md: "\n## Deep Blue Beats Gary Kasparov\n\nIn 1997, IBM’s Deep Blue program beat\
    \ Gary Kasparov, who was then the world’s human champion. In 1996, Kasparov had\
    \ won in play that is in some ways more instructive.\n\nGame 6\n\nKasparov\n30.\
    \ b6\n\nDeep Blue\n30. Bb8 ??\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_238_0.png)\n\
    \n## Recursion and Games\n\n- In 1950, Claude Shannon wrote an article for *Scientific\
    \ American* in which he described how to write a chess-playing computer program.\n\
    - Shannon’s strategy was to have the computer try every possible move for white,\
    \ followed by all of black’s responses, and then all of white’s responses to those\
    \ moves, and so on.\n- Even with modern computers, it is impossible to use this\
    \ strategy for an entire game, because there are too many possibilities.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_239_0.png)\n\
    \n*Positions evaluated: ~10^53*\n\n... millions of years later ...\n\n## A Simpler\
    \ Game\n\n- Chess is far too complex a game to serve as a useful example. The\
    \ text uses a much simpler game called *Nim*, which is representative of a large\
    \ class of two-player games.\n- In Nim, the game begins with a pile of coins between\
    \ two players. The starting number of coins can vary and should therefore be easy\
    \ to change in the program.\n- In alternating turns, each player takes one, two,\
    \ or three coins from the pile in the center.\n- The player who takes the last\
    \ coin loses.\n\n## A Sample Game of Nim\n\nThere are 11 coins left.\nI'll take\
    \ 2.\nThere are 9 coins left.\nYour move: 1\nThere are 8 coins left.\nI'll take\
    \ 3.\nThere are 5 coins left.\nYour move: 2\nThere are 3 coins left.\nI'll take\
    \ 2.\nThere is only one coin left.\nYou lose.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_242_0.png)\n\
    \n## Good Moves and Bad Positions\n\n- The essential insight behind the Nim program\
    \ is bound up in the following mutually recursive definitions:\n  - A *good move*\
    \ is one that leaves your opponent in a bad position.\n  - A *bad position* is\
    \ one that offers no good moves.\n- The implementation of the Nim game is really\
    \ nothing more than a translation of these definitions into code.\n\n## Coding\
    \ the Nim Strategy\n\n```\n/*\n * Looks for a winning move, given the specified\
    \ number of coins.\n * If there is a winning move in that position, findGoodMove\
    \ returns\n * that value; if not, the method returns the constant NO_GOOD_MOVE.\n\
    \ * This implementation depends on the recursive insight that a good move\n *\
    \ is one that leaves your opponent in a bad position and a bad position\n * is\
    \ one that offers no good moves.\n */\n\nint findGoodMove(int nCoins) {\n    int\
    \ limit = (nCoins < MAX_MOVE) ? nCoins : MAX_MOVE;\n    for (int nTaken = 1; nTaken\
    \ <= limit; nTaken++) {\n        if (isBadPosition(nCoins - nTaken)) return nTaken;\n\
    \    }\n    return NO_GOOD_MOVE;\n}\n\n/*\n * Returns true if nCoins is a bad\
    \ position.  Being left with a single\n * coin is clearly a bad position and represents\
    \ the simple case.\n */\n\nbool isBadPosition(int nCoins) {\n    if (nCoins ==\
    \ 1) return true;\n    return findGoodMove(nCoins) == NO_GOOD_MOVE;\n}\n```\n\n\
    ## The Minimax Algorithm\n\n- Games like Nim are simple enough that it is possible\
    \ to solve them completely in a relatively small amount of time.\n- For more complex\
    \ games, it is necessary to cut off the analysis at some point and then evaluate\
    \ the position, presumably using some function that looks at a position and returns\
    \ a *rating* for that position. Positive ratings are good for the player to move;\
    \ negative ones are bad.\n- When your game player searches the tree for best move,\
    \ it can’t simply choose the one with the highest rating because you control only\
    \ half the play.\n- What you want instead is to choose the move that minimizes\
    \ the maximum rating available to your opponent. This strategy is called the *minimax*\
    \ algorithm.\n\n## A Minimax Illustration\n\n- Suppose that the ratings two turns\
    \ from now are as shown.\n- From your perspective, the +9 initially looks attractive.\n\
    - Unfortunately, you can’t get there, since the −5 is better for your opponent.\n\
    - The best you can do is choose the move that leads to the −2.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_246_0.png)\n"
  mdcn: "\n\n## Deep Blue 战胜加里·卡斯帕罗夫\n\n1997 年，IBM 的 Deep Blue 程序击败了当时世界人类冠军加里·卡斯帕罗夫。1996\
    \ 年，卡斯帕罗夫在某种程度上更具启发性的对局中获胜。\n\n第 6 局\n\n卡斯帕罗夫\n30. b6\n\nDeep Blue\n30. Bb8 ??\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_238_0.png)\n\n## 递归与游戏\n\n- 1950 年，克劳德·香农在\
    \ *Scientific American* 上发表了一篇文章，描述了如何编写一个下棋的计算机程序。\n- 香农的策略是让计算机尝试白方所有可能的走法，然后是黑方所有的回应，再然后是白方对这些走法的回应，以此类推。\n\
    - 即使使用现代计算机，也不可能对整盘棋使用这种策略，因为可能性太多。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_239_0.png)\n\
    \n*Positions evaluated: ~10^53*\n\n... millions of years later ...\n\n## 一个更简单的游戏\n\
    \n- 国际象棋复杂到无法作为有用的例子。文本使用了一个更简单的游戏叫做 *Nim*，它代表了一大类双人游戏。\n- 在 Nim 中，游戏开始时两名玩家之间有一堆硬币。起始硬币数可以变化，因此在程序中应易于更改。\n\
    - 在交替回合中，每位玩家从中央的堆中取走一枚、两枚或三枚硬币。\n- 取走最后一枚硬币的玩家输掉。\n\n## 一局 Nim 示例\n\n还剩下 11 枚硬币。\n\
    我取 2 枚。\n还剩下 9 枚硬币。\n你的回合：1\n还剩下 8 枚硬币。\n我取 3 枚。\n还剩下 5 枚硬币。\n你的回合：2\n还剩下 3 枚硬币。\n\
    我取 2 枚。\n只剩下 1 枚硬币了。\n你输了。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_242_0.png)\n\
    \n## 好走法与坏位置\n\n- Nim 程序背后的核心洞见包含在以下相互递归的定义中：\n  - *好走法*是指使对手处于坏位置的走法。\n  - *坏位置*是指没有好走法的局面。\n\
    - Nim 游戏的实现实际上只是将这些定义翻译成代码而已。\n\n## 编码 Nim 策略\n\n```\n/*\n * Looks for a winning\
    \ move, given the specified number of coins.\n * If there is a winning move in\
    \ that position, findGoodMove returns\n * that value; if not, the method returns\
    \ the constant NO_GOOD_MOVE.\n * This implementation depends on the recursive\
    \ insight that a good move\n * is one that leaves your opponent in a bad position\
    \ and a bad position\n * is one that offers no good moves.\n */\n\nint findGoodMove(int\
    \ nCoins) {\n    int limit = (nCoins < MAX_MOVE) ? nCoins : MAX_MOVE;\n    for\
    \ (int nTaken = 1; nTaken <= limit; nTaken++) {\n        if (isBadPosition(nCoins\
    \ - nTaken)) return nTaken;\n    }\n    return NO_GOOD_MOVE;\n}\n\n/*\n * Returns\
    \ true if nCoins is a bad position.  Being left with a single\n * coin is clearly\
    \ a bad position and represents the simple case.\n */\n\nbool isBadPosition(int\
    \ nCoins) {\n    if (nCoins == 1) return true;\n    return findGoodMove(nCoins)\
    \ == NO_GOOD_MOVE;\n}\n```\n\n## Minimax 算法\n\n- Nim 之类的游戏足够简单，可以在相对较短的时间内完全解决。\n\
    - 对于更复杂的游戏，有必要在某一点切断分析，然后评估局面， presumably 使用某个函数查看局面并返回该局面的 *评级*。正评级对轮到行动的玩家有利；负评级则不利。\n\
    - 当你的游戏玩家搜索树以寻找最佳走法时，它不能简单地选择评级最高的走法，因为你只能控制一半的对局。\n- 你想要做的是选择使对手可获得的最大评级最小化的走法。这种策略称为\
    \ *minimax* 算法。\n\n## Minimax 说明\n\n- 假设两回合后的评级如图所示。\n- 从你的角度来看，+9 最初看起来很有吸引力。\n\
    - 不幸的是，你无法到达那里，因为 -5 对你的对手更好。\n- 你能做的最好的就是选择导致 -2 的走法。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_246_0.png)\n\
    \n"
