    \ when it reads the header file.\n */\n\n#ifndef _hashmap_h\n\n#include \"error.h\"\
    \n\n/*\n * Implementation notes: HashMap class\n * -----------------------------------\n\
    \ * In this map implementation, the entries are stored in a hashtable.\n * The\
    \ hashtable keeps an array of buckets, where each bucket is a\n * linked list\
    \ of elements that share the same hash code.  If two or\n * more keys have the\
    \ same hash code (which is called a \"collision\"),\n * each of those keys will\
    \ be on the same list.  Ideally, however, the\n * number of such collisions will\
    \ be small, so that all of the operations\n * can run in constant time.  To achieve\
    \ that goal, it is necessary to\n * expand the number of buckets when the lists\
    \ start to fill up.  That\n * operation (called \"rehashing\") is not implemented\
    \ here and is instead\n * left as an exercise.\n */\n```\n"
