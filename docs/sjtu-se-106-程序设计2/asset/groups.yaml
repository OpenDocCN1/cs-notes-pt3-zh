  - '[PAGE 508]


    # Traversal Strategies


    +   - It is easy to write a function that performs some operation for every key
    in a binary search tree, because recursion makes it simple to apply that operation
    to each of the subtrees.

    +   - The order in which keys are processed depends on when you process the current
    node with respect to the recursive calls:

    +     - If you process the current node before either recursive call, the result
    is a *preorder traversal*.

    +     - If you process the current node after the recursive call on the left subtree
    but before the recursive call on the right subtree, the result is an *inorder
    traversal*. In the case of the simple BST implementation that uses strings as
    keys, the keys will appear in lexicographic order.

    +     - If you process the current node after completing both recursive calls,
    the result is a *postorder traversal*. Postorder traversals are particularly useful
    if you are trying to free all the nodes in a tree.'
