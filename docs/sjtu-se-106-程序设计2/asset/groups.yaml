  - '[PAGE 409]


    # Analysis


    +   - Open hashing is most appropriate when the hash table is kept in main memory,
    implemented with a standard in-memory linked list

    +   - We hope that number of elements per bucket roughly equal in size, so that
    the lists will be short

    +   - If there are *n* elements in set, then each bucket will have roughly *n/D*

    +   - If we can estimate *n* and choose *D* to be roughly as large, then the average
    bucket will have only one or two members'
