    \ {\n    return parent;\n}\n\nVector<PersonNode *> PersonNode::getChildren() {\n\
    \    return children;\n}\n```\n\n## 树和类层次结构\n\n- 在很大程度上，像 C++ 和 Java 这样的面向对象语言中的类是作为一棵树来组织的。\n\
    - 面向对象范式的一个决定性特征是类形成 *层次结构*。任何类都可以被指定为某个其他类的 *子类*，后者称为其 *超类*。正如本周讲义中所指出的那样，尽管\
    \ C++ 允许更复杂的结构，但大多数类层次结构都是树状的。\n- 一个类代表其超类的 *特化*。如果你创建一个是某个类的实例的对象，那么该对象也是其超类链中层次结构上方所有其他类的实例。\n\
    - 当你在 C++ 中定义一个新类时，该类会自动 *继承* 其超类的行为。\n\n## 表达式的递归结构\n\n- 在大多数编程语言中，*表达式* 是一种递归结构，可以包含子表达式。\n\
    - 在我第 17 章使用的模型中，每个表达式都属于以下形式之一：\n  - 一个整数常量\n  - 包含整数值的变量名\n  - 由运算符连接的两个表达式\n\
    \  - 用括号括起来的表达式\n- 这种结构可以用 *语法* 的形式表示。\n\n**E** → *constant*\n**E** → *identifier*\n\
    **E** → **E** *op* **E**\n**E** → ( **E** )\n\n## 解析树\n\n当 C++ 编译器查看一个表达式时，它需要通过将其翻译成内部形式来理解表达式的含义。这个过程通常包括两个步骤：\n\
    \n- *词法分析*，其中源文本被分解为称为 *标记* 的单元。\n- *解析*，其中标记被组装成一个递归结构，称为 *解析树*，体现其结构。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_439_0.png)\n\
    \n## 表达式类层次结构\n\n- 由于表达式有多种形式，表示表达式的 C++ 类最容易用类层次结构来表示，其中每种表达式类型都是一个单独的子类，如下图所示：\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_440_0.png)\n\n## C++ 中继承的表示\n\n- 创建\
    \ C++ 子类的第一步是在头行上指明超类，使用以下语法：\n\n```\nclass subclass: public superclass {\n  \
    \  body of class definition\n}\n```\n\n- 与 Java 不同，子类不会自动覆盖其超类中方法的定义。为了允许这种覆盖，两个类都必须用关键字\
    \ `virtual` 标记该方法的原型。\n\n- *抽象类* 是一种实际上不代表任何对象的类，而是仅作为 *具体类* 的共同超类，这些具体类确实对应于对象。在\
    \ C++ 中，抽象类中始终由具体子类实现的方法是通过在原型行上的分号前包含 `= 0` 来表示的。\n\n## exp.h 接口\n\n```\n/*\n\
    \ * File: exp.h\n * ---------\n * This interface defines a class hierarchy for\
    \ expressions,\n * which allows the client to represent and manipulate simple\n\
    \ * binary expression trees.\n */\n\n#ifndef _exp_h\n#define _exp_h\n\n#include\
    \ <string>\n#include \"evalstate.h\"\n\n/*\n * Type: ExpressionType\n * --------------------\n\
    \ * This enumerated type is used to differentiate the three different\n * expression\
    \ types: CONSTANT, IDENTIFIER, and COMPOUND.\n */\n\nenum ExpressionType { CONSTANT,\
    \ IDENTIFIER, COMPOUND };\n```\n\n"
