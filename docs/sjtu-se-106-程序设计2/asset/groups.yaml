    \ 7)\n\n**II**\n\n| Bucket | Record |\n|---:|---:|\n| 0 | 1001 |\n| 1 | 9537 |\n\
    | 2 | 3016 |\n| 3 |  |\n| 4 |  |\n| 5 |  |\n| 6 |  |\n| 7 | 9874 |\n| 8 | 2009\
    \ |\n| 9 | 9875 |\n| 10 | 1052 |\n\n下一个元素在桶 3 中，p = 8/11\n\n"
