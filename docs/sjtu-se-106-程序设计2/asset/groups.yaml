    # Resource Acquisition Is Initialization (RAII)


    +   - Also referred to as the “Guard Idiom”

    +     - However, the term “RAII” is more widely used in C++

    +   - Relies on the fact that in C++ a stack object’s destructor is called when
    stack frame pops

    +   - Idea: we can use a stack object to hold the ownership of a heap object,
    or any other resource that requires explicit clean up

    +     - Initialize stack object when the resource is allocated

    +     - De-allocate resource in the stack object’s destructor'
  - "[PAGE 134]\n\n# RAII Example: Guarding Newly Allocated Object\n\n```\nshared_ptr<Foo>\
    \ createAndInit() {\n  Foo *f = new Foo;\n  shared_ptr<Foo> p(f);\n  init(f);\
    \ // may throw exception\n  return p;\n}\n\nint run () {\n  try {\n    shared_ptr<Foo>\
    \ spf =\n        createAndInit();\n    cout << “*spf is ” << *spf;\n  } catch\
    \ (...) {\n    return -1\n  }\n  return 0;\n}\n```\n\n+   - RAII idiom example\
    \ via **shared_ptr** class template\n+     - `#include <memory>`\n+     - `using\
    \ namespace std;`\n+   - **shared_ptr<X>** assumes and maintains ownership of\
    \ aliased **X**\n+   - Can access the aliased **X** through it (`*spf`)\n+   -\
    \ **shared_ptr** destructor calls `delete` on the pointer to the owned **X** when\
    \ it’s safe to do so (per reference counting idiom discussed next)\n+   - Combines\
    \ well with other memory idioms"
  - '[PAGE 135]


    # Introduction to Reference Counting


    +   - Basic Problem

    +     - Resource sharing is often more efficient than copying

    +     - But it’s hard to tell when all are done using a resource

    +     - Must avoid early deletion

    +     - Must avoid leaks

    +   - Solution Approach

    +     - Share both the resource and also a counter

    +     - Each new reference increments the counter

    +     - When a reference is done, it decrements the counter

    +     - When count drops to zero, delete resource and counter

    +     - “last one out shuts off the lights”


