  - '[PAGE 394]


    # Collision Resolution Policies


    +   - Two classes:

    +     1. Open hashing, a.k.a. separate chaining

    +     2. Closed hashing, a.k.a. open addressing

    +   - Difference has to do with whether collisions are stored *outside the table*
    (open hashing) or whether collisions result in storing one of the records at *another
    slot in the table* (closed hashing)'
  - '[PAGE 395]


    # Closed Hashing


    +   - Associated with closed hashing is a *rehash strategy*:

    +     “If we try to place x in bucket h(x) and find it occupied, find alternative
    location h₁(x), h₂(x), etc. Try each in order, if none empty table is full,”

    +   - h(x) is called *home bucket*

    +   - Simplest rehash strategy is called *linear hashing*

    +     hᵢ(x) = (h(x) + i) % D

    +   - In general, collision resolution strategy is to generate a sequence of hash
    table slots (probe sequence) that can hold the record; test each slot until find
    empty one (probing)'
  - '[PAGE 396]


    # Example Linear (Closed) Hashing


    +   - D=8, keys a,b,c,d have hash values h(a)=3, h(b)=0, h(c)=4, h(d)=3

    +     - Where do we insert d? 3 already filled

    +     - Probe sequence using linear hashing:

    +       - h1(d) = (h(d)+1)%8 = 4%8 = 4

    +       - h2(d) = (h(d)+2)%8 = 5%8 = 5*

    +       - h3(d) = (h(d)+3)%8 = 6%8 = 6

    +       - etc.

    +       - 7, 0, 1, 2

    +     - Wraps around the beginning of the table!


    | Index | Value |

    |---:|:---:|

    | 0 | b |

    | 1 |  |

    | 2 |  |

    | 3 | a |

    | 4 | c |

    | 5 | d |

    | 6 |  |

    | 7 |  |'
  - '[PAGE 397]


    # Operations Using Linear Hashing


    +   - Test for membership: *findItem*

    +     - Examine h(k), h₁(k), h₂(k), …, until we find k or an empty bucket or home
    bucket

    +   - If no deletions possible, strategy works!

    +   - What if deletions?

    +     - If we reach empty bucket, cannot be sure that k is not somewhere else
    and empty bucket was occupied when k was inserted

    +     - Need special placeholder *deleted*, to distinguish bucket that was never
    used from one that once held a value

    +     - May need to reorganize table after many deletions'
  - '[PAGE 398]


    # Performance Analysis - Worst Case


    +   - Initialization: O(b), b# of buckets

    +   - Insert and search: O(n), n number of elements in table; all n key values
    have same home bucket

    +   - No better than linear list for maintaining dictionary!'
  - '[PAGE 399]


    # Performance Analysis - Avg Case


    +   - Distinguish between successful and unsuccessful searches

    +     - Delete = successful search for record to be deleted

    +     - Insert = unsuccessful search along its probe sequence

    +   - Expected cost of hashing is a function of how full the table is: load factor
    α = n/b

    +   - It has been shown that average costs under linear hashing (probing) are:

    +     - Insertion: 1/2(1 + 1/(1 - α)²)

    +     - Deletion: 1/2(1 + 1/(1 - α))'
  - '[PAGE 400]


    # Improved Collision Resolution


    +   - Linear probing: hᵢ(x) = (h(x) + i) % D

    +     - All buckets in table will be candidates for inserting a new record before
    the probe sequence returns to home position

    +     - Clustering of records, leads to long probing sequences

    +   - Linear probing with skipping: hᵢ(x) = (h(x) + i c) % D

    +     - c constant other than 1

    +     - Records with adjacent home buckets will not follow same probe sequence

    +   - (Pseudo)Random probing: hᵢ(x) = (h(x) + rᵢ) % D

    +     - rᵢ is the iᵗʰ value in a random permutation of numbers from 1 to D-1

    +     - Insertions and searches use the same sequence of “random” numbers'
