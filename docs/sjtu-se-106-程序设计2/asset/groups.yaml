    \ describes the representation.\n- The `mapimpl.cpp` file that implements the\
    \ public methods.\n\n## Implementation Strategies for Maps\n\nThere are several\
    \ strategies you might choose to implement the map operations `get` and `put`.\
    \ Those strategies include:\n\n- 1. *Linear search*. Keep track of all the name/value\
    \ pairs in an array. In this model, both the `get` and `put` operations run in\
    \ O(N) time.\n- 2. *Binary search*. If you keep the array sorted by the two-character\
    \ code, you can use binary search to find the key. Using this strategy improves\
    \ the performance of `get` to O(log N).\n- 3. *Table lookup in a grid*. In this\
    \ specific example, you can store the state names in a 26×26 `Grid<string>` in\
    \ which the first and second indices correspond to the two letters in the code.\
