    \ name that holds an integer value\n  - Two expressions joined by an operator\n\
    \  - An expression enclosed in parentheses\n- This structure can be represented\
    \ in the form of a *grammar*.\n\n**E** → *constant*\n**E** → *identifier*\n**E**\
    \ → **E** *op* **E**\n**E** → ( **E** )\n\n## Parse Trees\n\nWhen the C++ compiler\
    \ looks at an expression, it needs to understand what the expression means by\
    \ translating it into an internal form. This process generally consists of two\
    \ steps:\n\n- *Lexical analysis*, in which the source text is broken up into units\
    \ called *tokens*.\n- *Parsing*, in which the tokens are assembled into a recursive\
    \ structure called an *parse tree* that embodies its structure.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_439_0.png)\n\
    \n## The Expression Class Hierarchy\n\n- Because expressions have more than one\
    \ form, a C++ class that represents expressions can be represented most easily\
    \ by a class hierarchy in which each of the expression types is a separate subclass,\
    \ as shown in the following diagram:\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_440_0.png)\n\
    \n## Representing Inheritance in C++\n\n- The first step in creating a C++ subclass\
    \ is to indicate the superclass on the header line, using the following syntax:\n\
    \n```\nclass subclass: public superclass {\n    body of class definition\n}\n\
    ```\n\n- In contrast to Java, a subclass does not automatically override the definition\
    \ of a method in its superclass. To permit such overriding, both classes must\
    \ mark the prototype for that method with the keyword `virtual`.\n\n- An *abstract\
    \ class* is a class that doesn’t actually represent any objects but instead serves\
    \ only as a common superclass for *concrete classes* that do correspond to objects.\
    \ In C++, methods for an abstract class that are always implemented by the concrete\
    \ subclasses are indicated by including `= 0` before the semicolon on the prototype\
    \ line.\n\n## The exp.h Interface\n\n```\n/*\n * File: exp.h\n * ---------\n *\
    \ This interface defines a class hierarchy for expressions,\n * which allows the\
    \ client to represent and manipulate simple\n * binary expression trees.\n */\n\
    \n#ifndef _exp_h\n#define _exp_h\n\n#include <string>\n#include \"evalstate.h\"\
    \n\n/*\n * Type: ExpressionType\n * --------------------\n * This enumerated type\
    \ is used to differentiate the three different\n * expression types: CONSTANT,\
    \ IDENTIFIER, and COMPOUND.\n */\n\nenum ExpressionType { CONSTANT, IDENTIFIER,\
    \ COMPOUND };\n```\n"
