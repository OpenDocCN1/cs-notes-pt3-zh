    \n## Exercise: Preorder Traversal\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_509_0.png)\n\
    \n```\nvoid preorderTraversal(Node *t) {\n    if (t != null) {\n        cout <<\
    \ t->key << endl;\n        preorderTraversal(t->left);\n        preorderTraversal(t->right);\n\
    \    }\n}\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_509_1.png)\n\n## Exercise:\
    \ Inorder Traversal\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_510_0.png)\n\n\
    ```\nvoid inorderTraversal(Node *t) {\n    if (t != null) {\n        inorderTraversal(t->left);\n\
    \        cout << t->key << endl;\n        inorderTraversal(t->right);\n    }\n\
    }\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_510_1.png)\n\n## Exercise:\
    \ Postorder Traversal\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_511_0.png)\n\
    \n```\nvoid postorderTraversal(Node *t) {\n    if (t != null) {\n        postorderTraversal(t->left);\n\
    \        postorderTraversal(t->right);\n        cout << t->key << endl;\n    }\n\
    }\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_511_1.png)\n\n## A Question\
    \ of Balance\n\n- Ideally, a binary search tree containing the names of Disney’s\
    \ seven dwarves would look like this:\n- If, however, you happened to enter the\
    \ names in alphabetical order, this tree would end up being a simple linked list\
    \ in which all the left subtrees were NULL and the right links formed a simple\
    \ chain. Algorithms on that tree would run in O(N) time instead of O(log N) time.\n\
    - A binary search tree is *balanced* if the height of its left and right subtrees\
    \ differ by at most one and if both of those subtrees are themselves balanced.\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_512_0.png)\n\n## Illustrating the AVL\
    \ Algorithm\n\n- H\n- He\n- Li\n- Be\n- B\n- C\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_514_0.png)\n\
    \n## Illustrating the AVL Algorithm\n\nH\n\nHe\n\nLi\n\nBe\n\nB\n\nC\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_515_0.png)\n\
    \n## Illustrating the AVL Algorithm\n\n- H\n- He\n- Li\n- Be\n- B\n- C\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_516_0.png)\n"
  mdcn: "\n\n## 一个简单的 BST 实现\n\n```\n/*\n * Function: insertNode\n * Usage: insertNode(t,\
    \ key);\n * -----------------------------\n * Inserts the specified key at the\
    \ appropriate location in the\n * binary search tree rooted at t.  Note that t\
    \ must be passed\n * by reference, since it is possible to change the root.\n\
    \ */\n\nvoid insertNode(Node * & t, string key) {\n    if (t == NULL) {\n    \
    \    t = new Node;\n        t->key = key;\n        t->left = t->right = NULL;\n\
    \        return;\n    }\n    if (key == t->key) return;\n    if (key < t->key)\
    \ {\n        insertNode(t->left, key);\n    } else {\n        insertNode(t->right,\
    \ key);\n    }\n}\n```\n\n## 练习：构建二叉搜索树\n\n绘制执行以下代码后得到的 BST：\n\n```\nNode *colors\
    \ = NULL;\ninsertNode(colors, \"red\");\ninsertNode(colors, \"orange\");\ninsertNode(colors,\
    \ \"yellow\");\ninsertNode(colors, \"green\");\ninsertNode(colors, \"blue\");\n\
    insertNode(colors, \"indigo\");\ninsertNode(colors, \"violet\");\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_507_0.png)\n\
    \n## 遍历策略\n\n- 编写一个对二叉搜索树中每个键执行某些操作的函数很容易，因为递归使得将该操作应用于每个子树变得简单。\n- 键的处理顺序取决于相对于递归调用何时处理当前节点：\n\
    \  - 如果在任一递归调用之前处理当前节点，结果是 *前序遍历*。\n  - 如果在对左子树的递归调用之后但在对右子树的递归调用之前处理当前节点，结果是\
    \ *中序遍历*。在这种使用字符串作为键的简单 BST 实现中，键将按字典顺序出现。\n  - 如果在完成两个递归调用之后才处理当前节点，结果是 *后序遍历*。后序遍历在尝试释放树中的所有节点时特别有用。\n\
    \n## 练习：前序遍历\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_509_0.png)\n\n```\nvoid\
    \ preorderTraversal(Node *t) {\n    if (t != null) {\n        cout << t->key <<\
    \ endl;\n        preorderTraversal(t->left);\n        preorderTraversal(t->right);\n\
    \    }\n}\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_509_1.png)\n\n## 练习：中序遍历\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_510_0.png)\n\n```\nvoid inorderTraversal(Node\
    \ *t) {\n    if (t != null) {\n        inorderTraversal(t->left);\n        cout\
    \ << t->key << endl;\n        inorderTraversal(t->right);\n    }\n}\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_510_1.png)\n\
    \n## 练习：后序遍历\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_511_0.png)\n\n```\nvoid\
    \ postorderTraversal(Node *t) {\n    if (t != null) {\n        postorderTraversal(t->left);\n\
    \        postorderTraversal(t->right);\n        cout << t->key << endl;\n    }\n\
    }\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_511_1.png)\n\n## 平衡问题\n\n-\
    \ 理想情况下，包含迪士尼七个小矮人名字的二叉搜索树应该看起来像这样：\n- 然而，如果你恰好按字母顺序输入名字，这棵树最终会变成一个简单的链表，其中所有左子树都为\
    \ NULL，右链接形成一条简单的链。在该树上运行的算法将以 O(N) 时间运行而不是 O(log N) 时间。\n- 二叉搜索树是 *平衡* 的，如果其左右子树的高度相差最多为一，并且这两个子树本身也是平衡的。\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_512_0.png)\n\n## 说明 AVL 算法\n\n- H\n\
    - He\n- Li\n- Be\n- B\n- C\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_514_0.png)\n\
    \n## 说明 AVL 算法\n\nH\n\nHe\n\nLi\n\nBe\n\nB\n\nC\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_515_0.png)\n\
    \n## 说明 AVL 算法\n\n- H\n- He\n- Li\n- Be\n- B\n- C\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_516_0.png)\n\
    \n"
