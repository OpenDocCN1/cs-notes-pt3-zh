  mdcn: "\n\n## 解决方案：\n\n- **双字比较并设置。**\n  - 一个 32 位字用于存储地址\n  - 一个 32 位字用于存储更新计数，每次节点被更新时计数递增\n\
    \  - 仅当上述两者都匹配时才进行比较并设置\n  - Java 提供了 **AtomicStampedReference**\n- **使用指针的低位地址位（如果内存是\
    \ 4/8 字节对齐的）来保存一个计数器以进行更新**\n  - 但误判的概率仍然大于双字比较并设置，因为计数器不是有 2^32 种选择，而只有 2^2 或\
    \ 2^3 种选择\n\n## 性能\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_744_0.png)\n\n\
    http://www.cnblogs.com/liuhao/archive/2011/12/21/2295671.html\n\n## 无锁数据结构的缺点\n\
    \n- 当前硬件将 CAS 操作中可用的位数限制为 32/64 位。\n  - 想象一下像 BST 这样的数据结构的实现会带来问题\n    - 当你需要平衡一棵树时，你需要同时更新多个节点。\n\
    - 绕过它的方法\n  - 基于事务内存的系统\n\n## 锁开销\n\n| 操作 | 开销(单位为纳秒) |\n| --- | --- |\n| 整数指令\
    \ | 0.7 |\n| 时钟周期 | 1.4 |\n| 命中二级缓存（Cache） | 12.9 |\n| 原子加 1 | 58.2 |\n| 比较交换\
    \ (cmpxchg) 原子加 1 | 107.3 |\n| 访问主存 | 162.4 |\n| CPU 本地 lock | 163.7 |\n| 缓存传输\
    \ | 170.4-360.9 |\n\n在700MHz的奔腾III机器上的基本操作的开销，在该机器上一个时钟周期能够执行两条整数指令。在1.8GHz的奔腾4机器上，原子加1指令的开销要比700MHz的奔腾III机器慢75纳秒(ns)，尽管CPU速度快两倍多。\n\
    \n## 可扩展性\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_747_0.png)\n\n读写锁rwlock在两个CPU的情况下性能反倒比一个CPU的差，在四个CPU的情况下，refcnt的性能要高于rwlock，refcnt大约是理论性能的45%，而rwlock是理论性能的39%，自旋锁spinlock的性能明显好于refcnt和rwlock，但它也只达到了理论性能的57%，brlock（Big\
    \ Reader Lock）性能可以线性扩展。Br lock是由Redhat的Ingo Molnar实现的一个高性能的rwlock，它适用于读特多而写特少的情况，读者获得brlock的开销很低，但写者获得锁的开销非常大\n\
    \n## 读-拷贝-更新\n\n- *读-拷贝-更新 (RCU):* 另一种同步技术，旨在保护那些主要由多个 CPU 读取的数据结构\n  - RCU 允许多个读者和多个写者并发执行\n\
    \  - RCU 是无锁的\n- 关键思想\n  - 只有**动态**分配并通过指针引用的数据结构才能由 RCU 保护\n  - 在内核控制路径中，临界区内不能睡眠\n\
    \n## RCU API\n\n- 宏\n  - `rcu_read_lock()`\n  - `rcu_read_unlock()`\n  - `call_rcu()`\n\
    - RCU\n  - Linux 2.6 中的新特性\n  - 用于网络层和 VFS\n\n## RCU — 列表更新 — 基本策略\n\n0. 初始列表\n\
    1. 新节点\n2. 复制 B 为 B' 并修改\n3. 将 A.Next 指向 B'\n4. B 仍然可见，但对于新读者不可见\n5. 读者完成，移除 B\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_750_0.png)\n\n## 评估\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_751_0.png)\n\
    \n图 13. 每种页错误并发设计的 Metis 吞吐量。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_751_1.png)\n\
    \n图 15. 每种页错误并发设计的 Dedup 吞吐量。\n\n## 测验\n\n答题前请在纸上写好姓名、学号\n\n## 字符串拼接\n\n编写一个函数，接受两个字符串并将它们组合成第三个字符串，使得第三个字符串是同时包含两个输入字符串作为子字符串的最短字符串。\n\
    \n如果存在多个这样的字符串，请输出先包含第一个字符串的那个字符串。\n\n输入：abcd afgd\n输出：abcdafgd\n\n输入：efgh cdef\n\
    输出：cdefgh\n\n输入：abcd bc\n输出：abcd\n\n输入：abcdefg bcikabc\n输出：bcikabcdefg\n\n## std::string\
    \ 参考\n\n- `string substr (size_t pos = 0, size_t len = npos) const;`\n- `size_t\
    \ find (const string& str, size_t pos = 0) const noexcept;`\n- `string& insert\
    \ (size_t pos, const string& str);`\n- `string& erase (size_t pos = 0, size_t\
    \ len = npos);`\n\n## 链表\n\n```c\nstruct Node {\n    int data;\n    Node *next;\n\
    };\ntypedef struct Node Node;\n```\n\n1. `Node *list1, *list2;`\n   已知 list1 和\
    \ list2 是单调递增的，使用循环将他们两个合并成为一个链表，使得新的链表仍然是单调递增的；\n2. 同第一题，使用递归实现；\n3. 将一个单链表反向；\n\
