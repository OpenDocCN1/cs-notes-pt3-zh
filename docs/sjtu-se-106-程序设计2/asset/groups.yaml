  mdcn: "\n\n谢谢！\n\n## C++ 回顾\n\n## 历史\n- C++ 是 C 的面向对象扩展\n- C 由 Dennis Ritchie 在贝尔实验室设计\n\
    \  - 用于编写 Unix，基于 BCPL\n- C++ 由 Bjarne Stroustrup 在贝尔实验室设计\n  - 他在贝尔的最初兴趣是仿真研究\n\
    \  - 对 C 的早期扩展主要基于 Simula\n  - 在 1980 年代早期被称为“C with classes”\n  - 在 1980 年代后期和\
    \ 1990 年代早期流行度增加\n  - 特性是逐步添加的\n    类、模板、异常、多重继承、类型测试...\n\n## 设计目标\n- 在基于 C 的语言中提供面向对象特性，同时不损害效率\n\
    \  - 与 C 向后兼容\n  - 更好的静态类型检查\n  - 数据抽象\n  - 对象和类\n  - 在可能的情况下优先考虑编译代码的效率\n- 重要原则\n\
    \  - 如果你不使用某个特性，你的编译代码应与该语言不包含该特性时一样高效。 （与 Smalltalk 相比）\n\n## 成功程度如何？\n- 鉴于设计目标和约束，\n\
    \  - 这是一种设计非常好的语言\n- 用户众多——取得了巨大的流行成功\n- 然而，设计非常复杂\n  - 许多特性之间存在复杂交互\n  - 难以从基本原则预测\n\
    \  - 大多数严肃用户选择了语言的子集\n    - 完整语言复杂且不可预测\n  - 许多实现相关的属性\n  - 冒险游戏爱好者的语言\n\n## 重要约束\n\
    - C 有特定的机器模型\n  - 访问底层架构\n- 没有垃圾回收\n  - 与效率目标一致\n  - 需要显式管理对象内存\n- 局部变量存储在激活记录中\n\
    \  - 对象被视为结构体的一种泛化\n    - 对象可以分配在栈上并被视为左值\n    - 栈/堆差异对程序员可见\n\n## C++ 概述\n\n\
    ### 与对象无关的添加和更改\n- type bool\n- 传引用\n- 用户定义的重载\n- 函数模板\n- ...\n\n## C++ 对象系统\n\
    \n### 面向对象特性\n- 类\n- 对象，具有虚拟函数的动态查找\n- 继承\n  - 单继承和多重继承\n  - 公有和私有基类\n- 子类型\n\
    \  - 与继承机制绑定\n- 封装\n\n## 一些好的决策\n- 公有、私有、受保护的可见性级别\n  - Public: 在任何地方都可见\n  -\
    \ Protected: 在类和子类声明内\n  - Private: 仅在声明的类内可见\n- 友元函数和类\n  - 对可见性和数据抽象的细致关注\n\
    - 允许继承而不进行子类型化\n  - 比没有私有基类时对子类型有更好的控制\n\n## 一些问题区域\n- **Casts**\n  - 有时是无操作，有时不是（例如，多重继承）\n\
    - **缺乏垃圾回收**\n  - 内存管理容易出错\n    - 构造函数、析构函数是有帮助的\n- **对象分配在栈上**\n  - 更好的效率，与异常的交互\n\
    \  - 但是赋值工作不佳，可能出现悬空指针\n- **Overloading**\n  - 代码选择机制太多？\n- **Multiple inheritance**\n\
    \  - 为效率而做的努力导致行为复杂\n\n## 示例类：一维点\n\n```\nclass Pt {\n    public:\n        Pt(int\
    \ xv);\n        Pt(Pt* pv);\n        int getX();\n        virtual void move(int\
    \ dx);\n    protected:\n        void setX(int xv);\n    private:\n        int\
    \ x;\n};\n```\n\n重载构造函数\n对私有数据的公有读访问\n虚拟函数\n受保护的写访问\n私有成员数据\n\n## 虚拟函数\n- 成员函数要么是\n\
    \  - 虚拟的，如果显式声明或继承为虚拟\n  - 否则为非虚拟\n- 虚拟函数\n  - 通过对象中的指针间接访问\n  - 可以在派生（子）类中重新定义\n\
    - 非虚拟函数\n  - 以通常的方式调用。 *只是普通函数。*\n  - 不能在派生类中重新定义（除重载外）\n- 只有在使用虚拟函数时才支付开销\n\n"
