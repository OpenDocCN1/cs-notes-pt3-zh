    | 1 | 0 | 0 | 1 | 1 | 0 |


    n = 3 时，6格放置 3 个 1 的序列情况：


    序列总数 = C(3, 2×3)


    不合理的序列总数：C(3+1, 2×3)


    因此，n = 3 时进出栈序列的总数为：

    C(3, 2×3) − C(3+1, 2×3)


    推广到结点数为 n 时的进出栈序列总数：

    C(n, 2×n) − C(n+1, 2n)'
