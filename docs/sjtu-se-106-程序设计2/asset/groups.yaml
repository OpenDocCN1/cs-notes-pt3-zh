    # 6、最优二叉树及其应用


    +   1、最优二叉树（赫夫曼树）


    +   • 赫夫曼算法（产生最优二叉树的算法）的实现：


    +   1、给定一个具有 n 个权值 {w1,w2,……wn} 的结点的集合 F={T1,T2,……Tn}。


    +   2、初始时，设 A=F。


    +   3、执行 i=1 至 n-1 次循环，在每次循环时，做以下事情：

    +   从当前集合中选取权值最小、次最小的两个结点，以这两个结点作为内部结点 b_i 的左右孩子，b_i 的权值为其左右孩子权值之和。在集合中删除这两个权值最小、次最小的结点。这样，在集合
    A 中，结点个数便减少了一个。


    e.g: 权值（此处为使用概率）分别为 {2,7,4,5} 的结点集合 F={C,A,S,T} 已知。请利用赫夫曼算法产生最优二叉树。


    +   1、A= C,2 A,7 S,4 T,5


    +   2、A= b1,6 A,7 T,5


    +   3、A= A,7 b2,11


    +   4、A= b3,18'
