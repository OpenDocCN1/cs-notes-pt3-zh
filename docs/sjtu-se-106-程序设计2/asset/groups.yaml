    \ is a type that supports the “iterator operations”\n  - ++ Go to next element\n\
    \  - * Get value\n  - == Does this iterator point to the same element as that\
    \ iterator?\n- Some iterators support more operations (e.g. --, +, and [ ])\n\n\
    ## The simplest algorithm: **find()**\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_162_0.png)\n\
    \n> _// Find the first element that equals a value_\n\n```\ntemplate<class In,\
