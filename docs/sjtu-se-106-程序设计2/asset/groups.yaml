  - "[PAGE 79]\n\n# Implementing the Template Class\n\n+   - The final change necessary\
    \ to implement the template class is to add **template** structures to every method\
    \ implementation, as in the following updated version of the constructor:\n\n\
    ```\n```cpp\ntemplate <typename ElemType>\nVector<ElemType>::Vector() {\n    capacity\
    \ = INITIAL_CAPACITY;\n    count = 0;\n    elements = new ElemType[capacity];\n\
    }\n```\n```\n\n+   - The new implementations of the methods need to be included\
    \ as part of the **vector.h** header. To avoid having the code be visible to the\
    \ clients, the strategy I’ve used in this book is to put the code in a file called\
    \ **vecimpl.cpp** and then include that file at the end of the interface definition."
  - '[PAGE 80]


    # Implementing Selection Brackets


    +   - Another powerful (but easily abused) feature of C++ is the ability to redefine
    the standard operators so that they invoke particular methods in a class.

    +   - Each operator in C++ has a corresponding identifier that typically consists
    of the keyword `operator` followed by the characters that make up the operator.

    +   - As an example, the identifier name of the + operator typically used to indicate
    addition is `operator+`. By defining a method with the name `operator+`, the C++
    `string` class can use this same operator to indicate concatenation.

    +   - For the `Vector` class, it is convenient to provide a method definition
    for `operator[]`, which is the bracketing selection operator. Doing so makes it
    possible to use array-selection notations on `Vector` objects.'
  - "[PAGE 81]\n\n# Redefining operator []\n\n```\n/*\n * Implementation notes: Vector\
    \ selection\n * ----------------------------------------\n * The following code\
    \ implements traditional array selection using\n * square brackets for the index.\
    \  The name of the method is\n * indicated by specifying the C++ keyword \"operator\"\
    \ followed by\n * the operator symbol.  To ensure that this operator returns an\n\
    \ * assignable value, this method uses an & to return the result\n * by reference.\n\
    \ */\n\ntemplate <typename ElemType>\nElemType & Vector<ElemType>::operator[](int\
    \ index) {\n    if (index < 0 || index >= count) {\n        Error(\"Vector selection\
    \ index out of range\");\n    }\n    return elements[index];\n}\n```"
  - "[PAGE 82]\n\n# Return by Reference\n\n+   - The implementation of `operator[]`\
    \ on the preceding slide uses a new feature of C++ called *return by reference*,\
    \ which indicates that the return value is shared with the caller rather than\
    \ copied.\n+   - The syntax for return by reference is similar to that used for\
    \ call by reference and involves adding an & token between the return type and\
    \ the method name, as in the prototype\n+   \n+   ```\n+   ElemType & Vector<ElemType>::operator[]\
    \ (int index);\n+   ```\n+   - Returning a value by reference means that the result\
    \ into an *lvalue*, which is an expression that can be used on the left side of\
    \ an assignment. This interpretation makes it possible to assign new values to\
    \ vector elements using an expression like\n+   \n+   ```\n+   vec[i] = 17;\n\
    +   ```"
