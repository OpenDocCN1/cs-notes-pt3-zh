    - HOB→BRE→RIV→CAR→LOR (100)\n- HOB→SOU→ISE→EDO (101)\n\n## Kruskal 算法\n\n- 在许多情况下，找到最短路径不如最小化整个网络的成本重要。连接图中每个节点且成本尽可能小的弧集称为\
    \ *最小生成树*。\n- 寻找最小生成树的以下算法由 Joseph Kruskal 于 1956 年开发：\n  - 从一个与原始图具有相同节点但弧集为空的新空图开始。\n\
    \  - 按成本递增的顺序对图中的所有弧进行排序。\n  - 按顺序遍历弧，如果该弧的端点尚未通过路径连接，则将其添加到新图中。\n- 通过在新图中维护节点集合，如下一张幻灯片所述，可以使该过程更高效。\n\
