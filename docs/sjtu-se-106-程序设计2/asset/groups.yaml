  mdcn: "\n\n## 选择排序的运行时间\n\n- 许多操作向量的算法，其运行时间与数组的大小成正比。如果你将值的数量乘以十，你会期望这些算法花费的时间增加十倍。\n\
    - 如前一页幻灯片上的运行时间所示，选择排序的情况非常不同。右侧的表格显示了将选择排序应用于 10、100、1000 和 10000 个值时的平均运行时间。\n\
    - 作为粗略的近似——特别是在使用较大的 N 值时——数组大小每增加十倍，选择排序所需的时间大约增加 100 倍。\n\n| N | time |\n|---|------|\n\
    | 10 | .0024 |\n| 100 | 0.162 |\n| 1000 | 14.32 |\n| 10000 | 1332. |\n\n## 计数操作\n\
    \n- 估计运行时间的另一种方法是计算对大小为 N 的数组进行排序所需的运算次数。\n- 在选择排序的实现中，执行频率最高、因此对运行时间贡献最大的代码部分是\
    \ `findSmallest` 方法的主体。对 `findSmallest` 的每次调用所涉及的运算次数会随着算法的进行而变化：\n  - 第一次调用 `findSmallest`\
    \ 时考虑 N 个值。\n  - 第二次调用时考虑 N − 1 个值。\n  - 第三次调用时考虑 N − 2 个值，以此类推。\n- 在数学记法中，`findSmallest`\
    \ 中考虑的值的数量可以表示为一个求和，然后可以将其转换为一个简单的公式：\n  1 + 2 + 3 + ⋯ + (N − 1) + N = ∑_{i=1}^{N}\
    \ i = (N × (N + 1)) / 2\n\n## 一个几何直观\n\n- 你可以通过几何思考来确信\n\n  1 + 2 + 3 + ⋯ + (N\
    \ − 2) + (N − 1) + N = \\frac{N \\times (N + 1)}{2}\n\n- 左侧公式中的项可以排列成一个三角形，如本幻灯片底部所示，N\
    \ = 6 的情况。\n- 如果你复制该三角形并将其旋转 180°，你会得到一个矩形，在本例中包含 6 × 7 个点，其中一半属于每个三角形。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_290_0.png)\n\
    \n## 二次增长\n\n- 选择排序运行时间快速增长的原因变得清晰，如果你制作一个表格，显示各种 N 值下 $\\frac{N \\times (N +\
    \ 1)}{2}$ 的值：\n- 右列的增长模式与选择排序算法测量的运行时间相似。随着 N 的值增加十倍，$\\frac{N \\times (N + 1)}{2}$\
    \ 的值大约增加 100 倍，即 $10^2$。运行时间与问题规模的平方成比例增长的算法被称为 *二次*。\n\n| N | $\\frac{N \\times\
    \ (N + 1)}{2}$ |\n|---|---|\n| 10 | 55 |\n| 100 | 5050 |\n| 1000 | 500,500 |\n\
    | 10000 | 50,005,000 |\n\n## 大 O 记法\n\n- 表示计算复杂度的最常见方法是使用 *大 O 记法*，该记法由德国数学家 Paul\
    \ Bachmann 于 1892 年引入。\n- 大 O 记法由字母 *O* 加上一个公式组成，该公式对运行时间作为问题规模的函数进行定性评估，传统上用\
    \ *N* 表示。例如，线性搜索的计算复杂度为\n\n  $O(N)$\n\n  而选择排序的计算复杂度为\n\n  $O(N^2)$\n- 如果你大声读出这些公式，你会读作“大\
    \ O 的 *N*”和“大 O 的 *N*²”。\n\n## 大 O 的常见简化\n\n- 鉴于大 O 记法旨在提供定性评估，将括号内的公式尽可能简化非常重要。\n\
    - 当你写大 O 表达式时，你应该始终进行以下简化：\n  1. 消除随着 N 变大，其对运行时间的贡献不再显著的任何项。\n  2. 消除任何常数因子。\n\
    - 因此，选择排序的计算复杂度为\n\n  $O(N^2)$\n\n  而不是\n\n  $O\\left(\\frac{N \\times (N+1)}{2}\\\
