  mdcn: "\n## 大纲\n\n- 1. 哈希表策略的局限性\n- 2. 有序数组中的二分查找\n- 3. 有序数组中的插入\n- 4. 查找链表中间元素的问题\n\
    - 5. 二叉搜索树登场\n- 6. 二叉搜索树的简单实现\n- 7. 构建二叉搜索树\n- 8. 遍历策略\n- 9. 平衡问题\n\n## 哈希表的局限性\n\
    \n- 我们之前介绍的哈希表策略是实践中迄今为止最常用的映射实现。\n- 尽管它有许多优点——尤其是其非凡的效率——哈希表实现并不一定是所有应用的最佳策略。\n\
    - 哈希表策略具有以下局限性：\n  - 哈希表依赖于能够对某个键计算哈希函数。将哈希函数的思想扩展到适用于字符串以外的类型可能很微妙。\n  - 在哈希表上使用\
    \ `foreach` 不会按任何合理的顺序返回键。即使键具有自然顺序（例如字符串使用的字符编码顺序），哈希表的 `foreach` 实现也无法利用这一事实。\n\
    \n## 有序数组中的二分查找\n\n- 假设不使用映射，而是将所有的州缩写（连同它们的名称）输入到一个数组中，并让这些缩写按字母顺序排列：\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_500_0.png)\n\
    \n- 查找一个州缩写（例如 \"GA\"）需要多少次操作（作为规模 N 的函数）？\n\n- 有序数组中的查找操作运行时间为 O(log N)。\n\n\
    ## 有序数组中的插入\n\n- 但添加新键又如何呢？例如，假设波多黎各（PR）成为一个州：\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_501_0.png)\n\
    \n- 数组末尾的所有单元都需要移动以腾出空间。\n\n- 有序数组中的添加操作运行时间为 O(N)。\n\n## 查找中间元素的问题\n\n- 在处理编辑器缓冲区时，我们通过使用链表而不是数组来解决插入问题。\n\
    - 不幸的是，将有序数组转换为链表后，就无法应用二分查找，因为没有办法找到中间元素。\n- 但如果能在链表中指向中间元素呢？这个想法似乎不太可能，但正是找到一种对查找和添加操作都能提供\
    \ O(log N) 性能的数据结构的关键。\n\n## 二叉搜索树\n\n- 最终解决这个问题的结构称为*二叉搜索树*（简称 *BST*）。BST 中的每个节点恰好有两个子树：一个*左子树*，包含当前节点之前的所有节点；一个*右子树*，包含当前节点之后的所有节点。这两个子树中的一个或两个都可以为\
    \ `NULL`。\n- 二叉搜索树的经典示例使用了沃尔特·迪士尼的*白雪公主与七个小矮人*中的名字：\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_503_0.png)\n\
    \n## 一个简单的 BST 实现\n\n- 为了理解二叉搜索树的工作原理，从一个简单设计入手会很有帮助，该设计中的键始终是字符串。\n- 这样，树中的每个节点就是一个包含一个键和两个子树的结构，每个子树要么为\
    \ **NULL**，要么是指向其他某个节点的指针。这一设计给出了以下定义：\n\n  ```\n  struct Node {\n      string\
    \ key;\n      Node *left, *right;\n  };\n  ```\n\n- 在树中查找节点的代码首先会比较目标键和根节点中的键。如果字符串匹配，就找到了正确的节点；如果不匹配，只需根据你要查找的键是在当前节点之前还是之后，递归调用自身处理左子树或右子树。\n\
    \n  ```\n  /*\n   * Function: findNode\n   * Usage: Node *node = findNode(t, key);\n\
    \   * ----------------------------------------\n   * Finds a node with the specified\
    \ key in the binary search tree rooted\n   * at t. If a node matching key appears\
    \ in the tree, findNode returns\n   * a pointer to that node. If the key does\
    \ not appear, findNode\n   * returns NULL.\n   */\n\n  Node *findNode(Node *t,\
    \ string key) {\n      if (t == NULL) return NULL;\n      if (key == t->key) return\
    \ t;\n      if (key < t->key) {\n          return findNode(t->left, key);\n  \
    \    } else {\n          return findNode(t->right, key);\n      }\n  }\n  ```\n\
    \n"
