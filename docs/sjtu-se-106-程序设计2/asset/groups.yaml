    \ a linked list? That idea seems unlikely, but it is the key to finding a data\
    \ structure that offers O(log N) performance for both the lookup and add operations.\n\
    \n## Binary Search Trees\n\n- The structure that ends up solving this problem\
    \ is called a *binary search tree* (or *BST* for short). Each node in a BST has\
    \ exactly two subtrees: a *left subtree* that contains all the nodes that come\
