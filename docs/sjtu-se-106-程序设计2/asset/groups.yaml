  md: "\n## The hashmap.h Interface\n\n```\n/*\n * Constructor: HashMap\n * Usage:\
    \ HashMap<KeyType,ValueType> map;\n * ----------------------------------------\n\
    \ * Initializes a new empty map that associates keys and values of the\n * specified\
    \ types.  The type used for the key must define the == operator,\n * and there\
    \ must be a free function with the following signature:\n *\n *     int hashCode(KeyType\
    \ key);\n *\n * that returns a positive integer determined by the key.  This interface\n\
    \ * exports hashCode functions for string and the C++ primitive types.\n */\n\n\
    HashMap();\n\n/*\n * Destructor: ~HashMap\n * Usage: (usually implicit)\n * ----------------------------\n\
    \ * Frees any heap storage associated with this map.\n */\n\n~HashMap();\n```\n\
    \n## The hashmap.h Interface\n\n```\n/*\n * Method: size\n * Usage: int nEntries\
    \ = map.size();\n * --------------------------------\n * Returns the number of\
    \ entries in this map.\n */\n\nint size();\n\n/*\n * Method: isEmpty\n * Usage:\
    \ if (map.isEmpty()) ...\n * --------------------------------\n * Returns true\
    \ if this map contains no entries.\n */\n\nbool isEmpty();\n\n/*\n * Method: clear\n\
    \ * Usage: map.clear();\n * ----------------\n * Removes all entries from this\
    \ map.\n */\n\nvoid clear();\n```\n\n## The hashmap.h Interface\n\n```\n/*\n *\
    \ Method: put\n * Usage: map.put(key, value);\n * --------------------------------\n\
    \ * Associates key with value in this map.  Any previous value associated\n *\
    \ with key is replaced by the new value.\n */\n    void put(KeyType key, ValueType\
    \ value);\n\n/*\n * Method: get\n * Usage: ValueType value = map.get(key);\n *\
    \ --------------------------------\n * Returns the value associated with key in\
    \ this map.  If key is not\n * found, the get method signals an error.\n */\n\
    \    ValueType get(KeyType key);\n\n/*\n * Method: containsKey\n * Usage: if (map.containsKey(key))\
    \ . . .\n * --------------------------------\n * Returns true if there is an entry\
    \ for key in this map.\n */\n    bool containsKey(KeyType key);\n```\n\n## The\
    \ `hashmap.h` Interface\n\n```cpp\n#include \"hashmappriv.h\"\n\n};\n\n#include\
    \ \"hashmapimpl.cpp\"\n\n/*\n * Function: hashCode\n * Usage: int hash = hashCode(key);\n\
    \ * ------------------------------------------------------\n * Returns a hash\
    \ code for the specified key, which is always a\n * nonnegative integer. This\
    \ function is overloaded to support\n * all of the primitive types and the C++\
    \ <code>string</code> type.\n */\n\nint hashCode(std::string key);\nint hashCode(int\
    \ key);\nint hashCode(char key);\nint hashCode(long key);\nint hashCode(double\
    \ key);\n\n#endif\n```\n\n## The hashmappriv.h File\n\n```\n/*\n * File: hashmappriv.h\n\
    \ * -------------------\n * This file contains the private section of the hashmap.h\
    \ interface.\n */\n\nprivate:\n\n/* Type definition for cells in the bucket chain\
    \ */\n\nstruct Cell {\n    KeyType key;\n    ValueType value;\n    Cell *link;\n\
    };\n\n/* Instance variables */\n\nCell **buckets;    /* Dynamic array of pointers\
    \ to cells */\nint nBuckets;      /* The number of buckets in the array */\nint\
    \ count;         /* The number of entries in the map */\n```\n\n## The hashmappriv.h\
    \ File\n\n```\n/*\n * Private method: findCell\n * Usage: Cell *cp = findCell(bucket,\
    \ key);\n * ----------------------------------------\n * Finds a cell in the chain\
    \ for the specified bucket that matches key.\n * If a match is found, the return\
    \ value is a pointer to the cell containing\n * the matching key.  If no match\
    \ is found, the function returns NULL.\n */\n\nCell *findCell(int bucket, ValueType\
    \ key) {\n    Cell *cp = buckets[bucket];\n    while (cp != NULL && key != cp->key)\
    \ {\n        cp = cp->link;\n    }\n    return cp;\n}\n```\n\n## The hashmapimpl1.cpp\
    \ Implementation\n\n```\n/*\n * File: hashmapimpl1.cpp\n * ----------------------\n\
    \ * This file contains the private section of the hashmap.cpp interface.\n * Because\
