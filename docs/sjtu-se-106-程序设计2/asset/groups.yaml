  mdcn: "\n\n## 比较 *N*² 和 *N* log *N*\n\n- *O(N²)* 和 *O(N log N)* 之间的差异对于较大的 *N* 值来说是巨大的，如下表所示：\n\
    \n| *N* | *N*² | *N* log₂ *N* |\n|---:|---:|---:|\n| 10 | 100 | 33 |\n| 100 |\
    \ 10,000 | 664 |\n| 1,000 | 1,000,000 | 9,966 |\n| 10,000 | 100,000,000 | 132,877\
    \ |\n| 100,000 | 10,000,000,000 | 1,660,964 |\n| 1,000,000 | 1,000,000,000,000\
    \ | 19,931,569 |\n\n- 根据这些数字，使用归并排序代替选择排序对包含 1,000,000 个值的向量进行排序的理论优势因子将超过 50,000。\n\
    \n## 标准复杂度类\n\n- 特定算法的复杂度往往落入少数几个标准复杂度类之一：\n\n| constant | O(1) | Finding first\
    \ element in a vector |\n| logarithmic | O(log N) | Binary search in a sorted\
    \ vector |\n| linear | O(N) | Summing a vector; linear search |\n| N log N | O(N\
    \ log N) | Merge sort |\n| quadratic | O(N²) | Selection sort |\n| cubic | O(N³)\
    \ | Obvious algorithms for matrix multiplication |\n| exponential | O(2^N) | Tower\
    \ of Hanoi solution |\n\n- 通常，理论计算机科学家认为任何复杂度无法表示为多项式的问题都是 *intractable*。\n\n\
    ## 复杂度类的图\n\nrunning time\n\nproblem size\n\nConstant\n\nLogarithmic\n\nLinear\n\
    \nNLogN\n\nQuadratic\n\nExponential\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_303_0.png)\n\
    \n## 冒泡排序\n\n- 最简单的排序算法\n- 思路：\n  - 1. 设置 flag = false\n  - 2. 遍历数组并比较成对的两个元素\n\
    \    - 1.1 如果 E1 ≤ E2 - OK\n    - 1.2 如果 E1 > E2 则 Switch(E1, E2) 并设置 flag = true\n\
    \  - 3. 如果 flag = true goto 1.\n- 会发生什么？\n\n## 冒泡排序\n\n1   1  23  2  56  9  8\
