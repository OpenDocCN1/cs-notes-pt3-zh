    \   30: CAR → RIV\n+   30: CIR → MIN\n+   40: CIR → MOU\n+   40: LOR → MOR\n+\
    \   50: EDO → ISE\n+   50: ISE → SOU\n+   70: BLA → MOU\n\n## An Application of\
