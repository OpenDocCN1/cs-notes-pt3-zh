    \n## Example\n\n- 给定有向图 G 及图中的节点 D 、 F ，求出到D的最短路径不经过F的节点集合。\n\n## The End\n\n\
    ## Lock-free Data Structure\n\nZhengwei QI\n\nShanghai Jiao Tong University\n\n\
    ## Thread-safe\n\n线程安全：在多线程环境中被调用时，能够正确地处理各个线程的局部变量，使程序功能正确完成。\n\n要将非线程安全的函数改为线程安全的，则只需要修改函数的实现部分。一般通过加入同步机制以保护共享的资源，使之不会被几个线程同时访问。\n\
    \n```\nvoid strcpy(char *dest, char *src)\n{\n    while (*dest++ = *src++) {\n\
    \        ;\n    }\n    *dest = NUL;\n}\n```\n\n```\nint Temp;\n\nvoid swap(int\
    \ *x, int *y)\n{\n    Temp = *x;\n    *x = *y;\n    *y = Temp;\n}\n```\n\n## LOW\
    \ PRIORITY TASK\n\n## HIGH PRIORITY TASK\n\n```\nwhile (1) {\n  x = 1;\n  y =\
    \ 2;\n  swap(&x, &y);\n  {\n    Temp = *x;\n    *x = *y;\n    *y = Temp;\n  }\n\
    \  :\n  OSTimeDly(1);\n}\n```\n\n```\nwhile (1) {\n  z = 3;\n  t = 4;\n  swap(&z,\
    \ &t);\n  {\n    Temp = *z;\n    *z = *t;\n    *t = Temp;\n  }\n  .\n  OSTimeDly(1);\n\
    \  .\n}\n```\n\nTemp == 1\n\nTemp == 3!\n\nTemp == 3\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_721_0.png)\n\
    \n+   1. 把Temp定义为局部变量\n+   2. 调用Swap()函数之前关中断，调动后再开中断\n+   3. 用信号量禁止该函数在使用过程中被再次调用\n\
    \n```\n#include <pthread.h>\n\nint increment_counter ()\n{\n    static int counter\
    \ = 0;\n    static pthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;\n\n    pthread_mutex_lock(&mutex);\n\
    \n    // only allow one thread to increment at a time\n    ++counter;\n    //\
    \ store value before any other threads increment it further\n    int result =\
    \ counter;\n\n    pthread_mutex_unlock(&mutex);\n\n    return result;\n}\n```\n\
    \n## Improvement\n\n- c++11中的atomics，可使此函数即线程安全又可重入。\n\n```\n#include <atomic>\n\
    \nint increment_counter ()\n{\n    static std::atomic<int> counter(0);\n\n   \
    \ // increment is guaranteed to be done atomically\n    int result = ++counter;\n\
    \n    return result;\n}\n```\n\n## Inside Atomics\n\n- CAS: Compare and Set primitive\n\
    - boolean cas( int * valueToChange, int valueToSet To, int ValueToCompareTo)\n\
    \  ```\n  if( *valueToChange ==\n  valueToCompareTo) {\n      *valueToChange =\
    \ valueToSetTo;\n      return true;\n  }\n  else {\n      return false;\n  }\n\
    \  ```\n\n## building lock-free data structures\n\n- **What do we need to build\
    \ these lock-free data structures?**\n- **Limit the scope of changes to a single\
    \ atomic variable**\n  - Stack : head\n  - Queue: head or tail depending on enque\
    \ or deque\n\n## A simple lock-free example\n\n- A lock-free Stack\n- Adopted\
    \ from **Geoff Langdale** at CMU\n  - Intended to illustrate the design of lock-free\
    \ data structures and problems with lock-free synchronization\n  - There is a\
    \ primitive operation we need:\n    - Compare and Set (CAS)\n    - Available on\
    \ most modern machines\n      - X86 assembly: xchg\n      - PowerPC assembly:\
    \ LL(load linked), SC (Store Conditional)\n\n## Lock-free Stack with Ints in C\n\
    \n- A stack based on a singly linked list. Not particularly good design!\n- Now\
    \ that we have the nodes let us proceed to body of the stack\n\n```\nstruct NodeEle\
    \ {\n    int data;\n    Node *next;\n};\n\ntypedef NodeEle Node;\n\nNode* head;\
    \ // The head of the list\n```\n"
