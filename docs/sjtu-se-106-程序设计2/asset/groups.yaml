    +   3. 非叶子结点相当于叶子结点的索引（稀疏索引），叶子结点相当于存储（关键字）数据的存储层；

    +   4. 更适合文件索引系统；


    B*树：更稠密，要求非根节点至少 2/3 填充，而不是 1/2


    ## 对比：索引顺序存取方法ISAM


    磁盘是以盘组、柱面和磁道三级地址存取的设备


