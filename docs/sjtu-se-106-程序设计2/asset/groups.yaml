    \ Veldhuizen写了一篇paper，用C++模板构建了一个元图灵机，从而第一次系统证明了C++模板的图灵完备性。\n\n## 泛型程序设计\n\n\
    - 泛型程序设计，简单地说就是使用模板的程序设计法。\n  - 将一些常用的数据结构（比如链表，数组，二叉树）和算法（比如排序，查找）写成模板，以后则不论数据结构里放的是什么对象，算法针对什么样的对象，则都不必重新实现数据结构，重新编写算法。\n\
    \n- 标准模板库 (Standard Template Library) 就是一些常用数据结构和算法的模板的集合。主要由 Alex Stepanov 开发，于1998年被添加进C++标准\n\
    \n- 有了STL 或Boost等标准库，不必再从头写大多标准数据结构和算法，并且可获得非常高的性能。\n\n## Review: 是否忘记一些了？\n\n\
    ```cpp\ntemplate <class T> class vector {\n    T* v;\n    int sz;\npublic:\n \
    \       vector(int);\n        T& operator[](int);\n        T& elem(int i) { return\
    \ v[i]; }\n    // ...\n};\n```\n\nQ：是不是有比这些还要底层和泛用的东西？\nA：涉及到程序语言的基本理论，请参照POPL上的学术会议论文，不过全是公式，不太好懂。也有一些入门的知识，例如图灵机、类型理论、lambda演算等。\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_107_0.png)\n\n## 进化\n\n1. 史前： C 时代\n\
    void qsort(void *base, size_t nmemb, size_t size,\nint (*compar)(const void *,\
    \ const void *));\n\n2. 面向对象：Java 单根继承 / 接口时代\nIUnaryFun for_each(IInputIter first,\
    \ IInputIter last, IUnaryFun func)\n{\n    for(!first.equals(last); first.preIncrement())\
    \   // 对应遍历\n        func.invoke(*first);   // 对应调用\n    return func;\n}\n\n3.\
    \ 模板：非侵入静态多态时代\ntemplate<class RandomAccessIterator, class Compare>\nvoid sort(RandomAccessIterator\
    \ first, RandomAccessIterator last, Compare comp);\n\n4. 进化：让编译器理解模板 / 迭代器 / 容器\
    \ ：\nConcept!\n\n## The End\n\n## Smart Pointers\n\nZhengwei QI\n\nSome slides\
    \ from Internet\n\n## Part I: Concept\n\n## The rule of three\n\n- If you need\
    \ to explicitly declare either the destructor, copy constructor or copy assignment\
    \ operator yourself, you probably need to explicitly declare all three of them.\n\
    \nhttp://stackoverflow.com/questions/4172722/what-is-the-rule-of-three\n\n## Smart->Pointers*\n\
    \nBY: GLENN WHEELER AND MOHAMED SHAIKH\n\n## Smart Pointers\n\n- Introduction\n\
    - What are they?\n- An example of Smart Pointers\n- Benefits of Smart Pointers\n\
    - Conclusion\n\n## Introductions\n\nIn programming, the use of pointers are the\
    \ main source of errors (or bugs) when developing code.\n\nThe main problem found\
    \ are the occurrences of memory leaks, this is due to the way pointers interact\
    \ with memory, such as allocation and deallocation, which when performed inefficiently\
    \ can cause the pointer to hang (or dangle, meaning that the pointer points to\
    \ a previous removed object).\n\nThe solution to this dilemma is the use of Smart\
    \ Pointers.\n\n## What are Smart Pointers?\n\nSmart Pointers look the same as\
    \ normal pointers and utilise the same interfacing operations such as dereferencing\
    \ (*) and indirection (->) yet carry other functionality.\n\nSmart pointers reduce\
    \ bugs and retain efficiency and control memory management by automated methods.\n\
    \n## What are Smart Pointers?\n\nThese automated methods apply to such things\
    \ as allocation and deallocation of resources in the effort of eliminating memory\
    \ leaks.\n\n```\ntemplate <class T> class auto_ptr\n{\n    T* ptr;\npublic:\n\
    \    explicit auto_ptr(T* p = 0) : ptr(p) {}\n    ~auto_ptr()           {delete\
    \ ptr;}\n    T& operator*()        {return *ptr;}\n    T* operator->()       {return\
    \ ptr;}\n};\n```\n\n## An Example of Smart Pointers\n\nWithin the standard C++\
    \ library is an example of a really simple smart pointer implementation.\n\nThis\
    \ example, auto_ptr, demonstrates memory management and is found within the memory\
    \ header file.\n\n## An Example of Smart Pointers\n\n```\ntemplate <class T> class\
    \ auto_ptr\n{\n    T* ptr;\npublic:\n    explicit auto_ptr(T* p = 0) : ptr(p)\
    \ {}\n    ~auto_ptr()             {delete ptr;}\n    T& operator*()          {return\
    \ *ptr;}\n    T* operator->()         {return ptr;}\n};\n```\n\n## An Example\
    \ of Smart Pointers\n\nTherefore instead of writing...\n\nTherefore user writes...\n\
    \n```\nvoid foo()\n{\nMyClass* p(new MyClass);\np->DoSomething();\ndelete p;\n\
    }\n```\n\n```\nvoid foo()\n{\nauto_ptr<MyClass> p(new MyClass);\np->DoSomething();\n\
    }\n```\n"
