    \n- 由 Alex Stepanov 设计\n- 总体目标：以最通用、最高效、最灵活的方式表示概念（思想、算法）\n  - 在代码中分别表示不同的概念\n\
    \  - 在有意义的地方自由组合概念\n- 总体目标是让编程“像数学一样”\n  - 甚至“良好的编程就是数学”\n  - 适用于整数、浮点数、多项式等……\n\
    \n## 基本模型\n\n- 算法\n  - sort、find、search、copy 等……\n\n- 容器\n  - vector、list、map、hash_map\
