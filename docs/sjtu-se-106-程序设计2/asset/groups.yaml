    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_618_0.png)\n\n# 时间复杂性的分析：\n\n- 时间耗费的代价：建堆的时间耗费\
    \ + 排序的时间耗费\n- 建堆的时间耗费：设树根处于第1层，该堆共有 h 层。建堆从第 h-1 层开始进行。只要知道了每一层的结点数（建的小堆的个数），和建每一个小堆所需的比较次数，就以求得建堆的时间耗费。\n\
    - 建的小堆的性质：第 i 层上小堆的个数 = 第 i 层上结点的个数 = 最多 2^(i-1)\n  第 i 层上小堆的高度 = h-i+1\n  建第\
    \ i 层上每个小堆最多所需的比较次数 = 2 × (h-i) 次\n- 建堆的时间耗费：\n\nT(n) <= Σ (i=h-1 to 1) 2^(i-1)\
    \ × (h-i) × 2 = Σ (i=h-1 to 1) 2^(i-1) × (h-i) = Σ (j=1 to h-1) 2^(h-j) × j =\
    \ 2^h Σ (j=1 to h-1) j/2^j\n\n注意：即使是高度为 h 的完全的二叉树，满足以下式子：\n\n2^(h-1) <= n <= 2^h\
    \ -1 故：2^h <= 2n\n\n又： Σ (j=1 to ∞) j/2^j < 2\n\n所以：建堆的时间复杂性为 4n=O(n) 级\n\n# 时间复杂性的分析：\n\
    \n- 时间复杂性的分析：建堆的时间耗费 + 排序的时间耗费\n- 排序的时间耗费：\n\n| 节点个数 | 高度 | 比较次数最多 |\n|---|---|---|\n\
    | j=2 | ⌊log2⌋ + 1 | <= 2×⌊log2⌋ |\n| j=3 | ⌊log3⌋ + 1 | <= 2×⌊log3⌋ |\n| j=4\
    \ | ⌊log4⌋ + 1 | <= 2×⌊log4⌋ |\n| ... | ... | ... |\n| j=n | ⌊logn⌋ + 1 | <= 2×⌊logn⌋\
    \ |\n\n所以： T(n) <= 2( log2 + log3 + ...... + logn ) = 2log(n!)\n\nT(n) = O ( nlogn\
    \ )\n\n# 4、选择排序和堆排序\n\n- 堆排序的时间代价分析推导： In place, O ( n logn )\n\n# 求 y=logx 的积分的示意图\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_621_0.png)\n\n```\nlog(n-1)! = Σ_{j=2}^{n-1}\
    \ logj ≤ ∫_{1}^{n} logx dx\n```\n\n不难求出上述积分的值为： nlogn - nloge + loge ≥ nlogn -\
    \ nloge。注意到： loge = 1.44。\n\n# 6、最优二叉树及其应用\n\n3、赫夫曼算法的实现：使用最小化堆挑出最小的结点。\n\n```\n\
    template<class Type>\nvoid BestBinaryTree ( Type weight[], int n, node<Type> BestBinaryTree[],\
    \ int m ) {\n    // weight[1] 到 weight[n] 保存权值，weight[0] 不用。BestBinaryTree[1]\
    \ 到\n    // BestBinaryTree[2n-1] 保存最优二叉树，BestBinaryTree[0] 不用，m 应为 2n-1.\n   \
    \ node<Type> * minptr = new node<Type>; // 暂存最小值结点。\n    MinHeap< node< Type >\
    \ > MinHp(n); // 建立最小化堆，容量为 n 个单元，0 号单元不用。\n    int j, k = m;\n    for ( j = 1;\
    \ j <= n; j++ )\n        { minptr->setdata( weight[j] ); minptr->setorder( j );\
    \ MinHp.Insert( *minptr ); }\n    for ( j = n+1; j <= m; j++ ) {\n        MinHp.DeleteMin\
    \ ( *minptr ); BestBinaryTree[k] = *minptr;\n        MinHp.DeleteMin ( *minptr\
    \ ); BestBinaryTree[k-1] = *minptr ;\n        minptr->setdata( BestBinaryTree[k].data\
    \ + BestBinaryTree[k-1].data, k, k -1 );\n        minptr->setorder();\n      \
    \  k -= 2; MinHp.Insert( *minptr ); // 内部结点 b_j 插入最小化堆。\n    }\n    MinHp.DeleteMin\
    \ ( *minptr ); BestBinaryTree[1] = *minptr; // 插入根结点。\n}\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_622_0.png)\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_622_1.png)\n\n# 6、最优二叉树及其应用\n\n3、赫夫曼算法的实现：求得赫夫曼编码。\n\
    \n算法：在后序遍历的程序基础上进行改进，注意到当访问到叶子节点时，其父节点全部在堆栈中，通过堆栈中节点之间的关系，可以方便地得到该叶子节点的赫夫曼编码，如右图。\n\
