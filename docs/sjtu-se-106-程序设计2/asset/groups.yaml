  mdcn: "\n## 观察\n\n我们可以（已经）编写出与所用数据类型无关的非常相似的程序\n\n- 使用 **int** 与使用 **double** 并没有太大区别\n\
    - 使用 **vector<int>** 与使用 **vector<string>** 并没有太大区别\n\n## 理想\n\n我们希望编写通用的编程任务，这样每当我们找到一种新的数据存储方式或一种稍微不同的数据解释方式时，都不必重做工作\n\
    \n- 在 **vector** 中查找一个值与在链表或数组中查找一个值并没有多大不同\n- 忽略大小写地查找 **string** 与不忽略大小写地查找\
    \ **string** 并没有多大不同\n- 用精确值绘制实验数据与用舍入值绘制数据并没有多大不同\n- 复制文件与复制 vector 并没有多大不同\n\
    \n## 理想（续）\n\n- 代码应当\n  - 易读\n  - 易修改\n  - 规整\n  - 简短\n  - 快速\n- 对数据的统一访问\n  -\
    \ 与存储方式无关\n  - 与类型无关\n- ...\n\n## 理想（续）\n\n- ...\n- 类型安全的数据访问\n- 方便的数据遍历\n- 紧凑的数据存储\n\
    - 快速\n  - 数据检索\n  - 数据添加\n  - 数据删除\n- 最常见算法的标准版本\n  - 复制、查找、搜索、排序、求和……\n\n## 示例\n\
    \n- 对字符串 vector 排序\n- 根据姓名在电话簿中查找号码\n- 查找最高温度\n- 查找所有大于 800 的值\n- 查找值 17 的首次出现\n\
    - 按单元编号对遥测记录排序\n- 按时间戳对遥测记录排序\n- 查找第一个大于 “Petersen” 的值？\n- 目前看到的最大数量是多少？\n- 查找两个序列之间的第一个差异\n\
    - 计算两个序列元素的成对乘积\n- 一个月中每天的最高温度是多少？\n- 最畅销的前 10 名是什么？\n- “C++” 的条目是什么（比如说在 Google\
    \ 中）？\n- 元素的总和是多少？\n\n## 泛型编程\n\n- 泛化算法\n  - 有时称为“提升算法”\n- 目标（对于最终用户）是\n  - 提高正确性\n\
    \    - 通过更好的规格说明\n  - 更广的使用范围\n    - 可复用的可能性\n  - 更好的性能\n    - 通过更广泛地使用经过调优的库\n\
    \    - 不必要地慢的代码最终会被丢弃\n- 从具体走向更抽象\n  - 反过来通常会导致臃肿\n\n## 提升示例（具体算法）\n\n```\ndouble\
    \ sum(double array[], int n)    // one concrete algorithm (doubles in array)\n\
    {\n    double s = 0;\n    for (int i = 0; i < n; ++i) s = s + array[i];\n    return\
    \ s;\n}\n```\n\n```\nstruct Node { Node* next; int data; };\n```\n\n```\nint sum(Node*\
    \ first)    // another concrete algorithm (ints in list)\n{\n    int s = 0;\n\
    \    while (first) {\n        s += first->data;\n        first = first->next;\n\
    \    }\n    return s;\n}\n```\n\n## 提升示例（抽象数据结构）\n\n// 两个算法更通用版本的伪代码\n\n```\n\
    int sum(data)      // somehow parameterize with the data structure\n{\n    int\
    \ s = 0;               // initialize\n    while (not at end) {     // loop through\
    \ all elements\n        s = s + get value;   // compute sum\n        get next\
    \ data element;\n    }\n    return s;                // return result\n}\n```\n\
    \n- 我们需要（对数据结构的）三个操作：\n  - 未到达末尾\n  - 获取值\n  - 获取下一个数据元素\n\n## 提升示例（STL 版本）\n\n\
    // 两个算法更通用版本的 STL 风格代码\n\n```\ntemplate<class Iter, class T>    // Iter should\
    \ be an Input_iterator\n// T should be something we can + and =\nT sum(Iter first,\
    \ Iter last, T s)    // T is the \"accumulator type\"\n{\n    while (first!=last)\
    \ {\n        s = s + *first;\n        ++first;\n    }\n    return s;\n}\n```\n\
    \n让用户初始化累加器\n\n```\nfloat a[] = { 1,2,3,4,5,6,7,8 };\ndouble d = 0;\nd = sum(a,a+sizeof(a)/sizeof(*a),d);\n\
    ```\n\n"
