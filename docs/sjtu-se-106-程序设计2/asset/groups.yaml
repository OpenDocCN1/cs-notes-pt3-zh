    \ as fast as “hand-crafted” code\n  - Given decent inlining\n- The code’s requirements\
    \ on its data has become explicit\n  - We understand the code better\n\n## The\
    \ STL\n\n- Part of the ISO C++ Standard Library\n- Mostly non-numerical\n  - Only\
    \ 4 standard algorithms specifically do computation\n    - Accumulate, inner_product,\
    \ partial_sum, adjacent_difference\n  - Handles textual data as well as numeric\
    \ data\n    - E.g. string\n  - Deals with organization of code and data\n    -\
    \ Built-in types, user-defined types, and data structures\n- Optimizing disk access\
    \ was among its original uses\n  - Performance was always a key concern\n\n##\
    \ The STL\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_156_0.png)\n\n- Designed\
    \ by Alex Stepanov\n- General aim: The most general, most efficient, most flexible\
    \ representation of concepts (ideas, algorithms)\n  - Represent separate concepts\
    \ separately in code\n  - Combine concepts freely wherever meaningful\n- General\
    \ aim to make programming “like math”\n  - or even “Good programming is math”\n\
    \  - works for integers, for floating-point numbers, for polynomials, for ...\n\
    \n## Basic model\n\n- Algorithms\n  - sort, find, search, copy, ...\n\n- Containers\n\
