    # 8、树的计数


    +   1、互不相似的二叉树的棵数的计算


    +   - 进入栈序列总数的计算为


    2n 个方格中放置 n 个 1 的组合数

    — 不合理的序列总数


    e.g: n = 3 时，6格放置3个 1 的序列

    情况：1 代表进栈，0 表示出栈


    | 1 | 1 | 1 | 0 | 0 | 0 |

    | 1 | 1 | 0 | 1 | 0 | 0 |

