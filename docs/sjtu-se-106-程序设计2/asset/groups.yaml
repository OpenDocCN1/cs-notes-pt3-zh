    \  2. *一个节点在集合中，另一个不在。* 在这种情况下，将新节点添加到同一集合中。\n  3. *端点位于不同的现有集合中。* 在这种情况下，你需要合并这两个集合以创建一个包含现有集合并集的新集合。\n\
    \  4. *端点位于同一集合中。* 在这种情况下，这两个节点之间已存在路径，因此不需要该弧。\n\n"
