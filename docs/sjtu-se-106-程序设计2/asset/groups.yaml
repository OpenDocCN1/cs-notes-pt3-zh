    \n## Map\n\n- A very useful abstraction\n  - Any kind of dictionary, lookup table,\
    \ index, databases, etc.\n- Store key-value pairs\n  - Fast access via key\n \
    \ - Operations to optimize: put, get\n\n## Basic Idea\n\n- Use *hash function*\
    \ to map keys into positions in a *hash table*\n- If element *e* has key *k* and\
    \ *h* is hash function, then *e* is stored in position *h(k)* of table\n- To search\
    \ for *e*, compute *h(k)* to locate position. If no element, dictionary does not\
    \ contain *e*.\n\nIdeally\n\n## Example\n\n- Dictionary Student Records\n  - Keys\
    \ are ID numbers (951000 - 952000), no more than 100 students\n  - Hash function:\
    \ h(k) = k-951000 maps ID into distinct table positions 0-1000\n  - `array table[1001]`\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_390_0.png)\n\n## Analysis (Ideal Case)\n\
    \n- O(b) time to initialize hash table (b number of positions or buckets in hash\
    \ table)\n- O(1) time to perform *insert*, *remove*, *search*\n\n## Ideal Case\
    \ is Unrealistic\n\n- Works for implementing dictionaries, but many applications\
    \ have key ranges that are too large to have 1-1 mapping between buckets and keys!\n\
    \nExample:\n\n- Suppose key can take on values from 0 .. 65,535 (2 byte unsigned\
    \ int)\n- Expect ≈ 1,000 records at any given time\n- Impractical to use hash\
    \ table with 65,536 slots!\n\n## Hash Functions\n\n- If key range too large, use\
    \ hash table with fewer buckets and a hash function which maps multiple keys to\
    \ same bucket:\n  h(k₁) = β = h(k₂): k₁ and k₂ have **collision** at slot β\n\
