    \ arr[aftcurrent].left > 0 ) aftcurrent = arr[aftcurrent].left;\ncurrent = aftcurrent;\
    \ return current; //在中序次序下的下一个被访问的结点的地址。\n}\n```\n\n```\ntemplate <class Type>\n\
    void InorderThreadTree<Type> :: Inorder ( ) { \nint p = First();\nwhile( p !=\
