    \n结果：得到结点 p 的儿子结点 u 的下一个兄弟结点 v。\n\n## 2、二叉树\n\n### 1、定义\n\n空或有一个根，根有左子树、右子树；而左和右子树本身又是二叉树。\n\
    \n和树的区别：可为空\n\n左右子树有序，不可颠倒\n\n例如：二叉树\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_565_0.png)\n\
