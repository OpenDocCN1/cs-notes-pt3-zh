    \ range 650-900 for 10 upper-case letters; good when D around 100, for example\n\
    \  - Order of chars in string has no effect\n\n- Much better: Cyclic Shift\n\n\
    \  ```java\n  static long hashCode(String key, int D)\n  {\n      int h=0;\n \
    \     for (int i=0; i<key.length(); i++){\n          h = (h << 4) | ( h >> 27);\n\
    \          h += (int) key.charAt(i);\n      }\n      return h%D;\n  }\n  ```\n\
    \n## 哈希（Hash）方法\n\n查找及其分析：\n\n查找方法同 hashing 函数的产生方法。\n\n随机探测再散列、二次探测再散列和 hashing\
    \ 法的成功、非成功查找的平均查找长度分析：\n\n设 hashing 函数是均匀的，处理冲突后产生的地址也是均匀的。Hashing 表的长度为 m。\n\n\
    - 查找不成功的平均查找长度\n\n  $$U_n=\\sum_{i=1}^{n+1} i\\times q_i$$\n\n  其中：$q_i$ = 经过\
    \ i 次探测确定某结点不在 hashing 表中的概率。\n\n  = 一直到第 i-1 次探测，由于冲突而失败的概率及第 i 次探测找到空单元的概率。\n\
    \n  $$q_i=\\frac{n}{m}\\times\\frac{n-1}{m-1}\\times\\frac{n-2}{m-2}\\times\\\
    cdots\\times\\frac{n-i+2}{m-i+2}\\left(1-\\frac{n-(i-1)}{m-(i-1)}\\right)$$\n\n\
    \  其中：$1\\le i\\le n+1$\n\n  可推出：$U_n=\\sum_{i=1}^{n+1}i\\times q_i=1/(1-n/(m+1))\\\
    approx\\frac{1}{1-\\alpha}$，其中 $\\alpha=n/m$。\n\n- 查找成功的平均查找长度：\n\n  - 成功地找到某一个\
    \ **key** 所需要的探测次数恰等于将这个 **key** 插入到散列表中所需要的探测次数。\n  - 将 n 个 key 插入到散列表中所需要的探测次数\n\
    \    - = 表空时进行插入时的探测次数\n    - + 表中有一个结点时进行插入时的探测次数\n    - + 表中有二个结点时进行插入时的探测次数\n\
    \    - + 表中有三个结点时进行插入时的探测次数\n    - + 表中有 n-1 个结点时进行插入时的探测次数\n\n  所以：\n\n  $$S_n=\\\
    frac{1}{n}\\sum_{i=0}^{n-1}U_i=\\frac{1}{n}\\sum_{i=0}^{n-1}\\frac{1}{1-i/m}$$\n\
    \n  $$=\\frac{1}{n}\\int_0^n\\frac{1}{1-i/m}\\,di=\\frac{m}{n}\\int_0^\\alpha\\\
    frac{1}{1-x}\\,dx=-\\frac{1}{\\alpha}\\ln(1-\\alpha)$$\n\n## Open Hashing\n\n\
    - Each bucket in the hash table is the head of a linked list\n- All elements that\
    \ hash to a particular bucket are placed on that bucket’s linked list\n- Records\
    \ within a bucket can be ordered in several ways\n  - By order of insertion, by\
    \ key value order, or by frequency of access order\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_408_0.png)\n\
    \n## Analysis\n\n- Open hashing is most appropriate when the hash table is kept\
    \ in main memory, implemented with a standard in-memory linked list\n- We hope\
    \ that number of elements per bucket roughly equal in size, so that the lists\
    \ will be short\n- If there are *n* elements in set, then each bucket will have\
    \ roughly *n/D*\n- If we can estimate *n* and choose *D* to be roughly as large,\
    \ then the average bucket will have only one or two members\n\nAverage time per\
    \ dictionary operation:\n\n- *D* buckets, *n* elements in dictionary ⇒ average\
    \ *n/D* elements per bucket\n- *insert*, *search*, *remove* operation take O(1+n/D)\
    \ time each\n- If we can choose D to be about n, constant time\n- Assuming each\
    \ element is likely to be hashed to any bucket, running time constant, independent\
    \ of n\n\n## Comparison with Closed Hashing\n\n- Worst case performance is O(n)\
    \ for both\n- Number of operations for hashing\n  - 23 6 8 10 23 5 12 4 9 19\n\
    \  - D=9\n  - h(x) = x % D\n\n## Hash Functions\n\n- A hash function is denoted\
    \ by\n  - $h: \\{0,1\\}^* \\to \\{0,1\\}^n$\n  - where n is a security parameter,\
    \ say 128, 160, 256 or 512.\n- In English:\n  - A function which is applicable\
    \ to data of any size.\n  - It produces a fixed length output, usually short.\n\
    - 3 Types of Security Requirements:\n  - One-way: given an output z, it is difficult\
    \ to find x such that z = h(x).\n  - Weak collision-resistant: given x, it is\
    \ difficult to find y ≠ x such that h(y) = h(x).\n  - Strong collision-resistant:\
    \ it is difficult to find any pair (x, y) such that h(x) = h(y).\n- Note: Strong\
    \ collision-resistant ⇒ Weak collision-resistant ⇒ One-way\n- Let m be some message.\
    \ h(x) is called the message digest.\n"
