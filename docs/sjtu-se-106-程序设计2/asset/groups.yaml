    +   父结点P的兄弟结点S是红色的（空结点认为是黑色结点），P的父结点G（结点X的祖父结点），肯定是黑色的。可分二种情况，主要矛盾解决不可以有连续的红结点存在，当然不可违反二叉排序树的性质

    +   B、 结点X是结点G的内侧孙结点：G仍是根结点，但G变为红结点，而其子结点变为黑色结点；仅仅改变颜色而已。


