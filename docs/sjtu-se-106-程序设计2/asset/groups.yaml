  - '[PAGE 369]


    # Implementation Strategies for Maps


    There are several strategies you might choose to implement the map operations
    `get` and `put`. Those strategies include:


    +   1. *Linear search*. Keep track of all the name/value pairs in an array. In
    this model, both the `get` and `put` operations run in O(N) time.

    +   2. *Binary search*. If you keep the array sorted by the two-character code,
    you can use binary search to find the key. Using this strategy improves the performance
    of `get` to O(log N).

    +   3. *Table lookup in a grid*. In this specific example, you can store the state
    names in a 26×26 `Grid<string>` in which the first and second indices correspond
    to the two letters in the code. Because you can now find any code in a single
    step, this strategy is O(1), although this performance comes at a cost in memory
    space.'
  - '[PAGE 370]


    # The Idea of Hashing


    +   - The third strategy on the preceding slide shows that one can make the `get`
    and `put` operations run very quickly, even to the point that the cost of finding
    a key is independent of the number of keys in the table. This $O(1)$ performance
    is possible only if you know where to look for a particular key.

    +   - To get a sense of how you might achieve this goal in practice, it helps
    to think about how you find a word in a dictionary. Most dictionaries have thumb
    tabs that indicate where each letter appear. Words starting with $A$ are in the
    $A$ section, and so on.

    +   - The most common implementations of maps use a strategy called *hashing*,
    which is conceptually similar to the thumb tabs in a dictionary. The critical
    idea is that you can improve performance enormously if you use the key to figure
    out where to look.'
  md: "\n## Maps and Hashing\n\nEric Roberts\nCS 106B\n\n## Part I: Basic Concepts\n\
    \n## An Illustrative Mapping Application\n\n- Suppose that you want to write a\
    \ program that displays the name of a state given its two-letter postal abbreviation.\n\
    - This program is an ideal application for the Map class because what you need\
    \ is a map between two-letter codes and state names. Each two-letter code uniquely\
    \ identifies a particular state and therefore serves as a key for a Map; the state\
    \ names are the corresponding values.\n- To implement this program in C++, you\
    \ need to perform the following steps, which are illustrated on the following\
    \ slide:\n  1. Create a Map<string, string> containing the key/value pairs.\n\
    \  2. Read in the two-letter abbreviation to translate.\n  3. Call get on the\
    \ Map to find the state name.\n  4. Print out the name of the state.\n\n## The\
    \ PostalLookup Program\n\n```\nint main() {\n    Map<string,string> stateMap;\n\
    \    initStateMap(stateMap);\n    while (true) {\n        cout << \"Enter two-letter\
    \ state abbreviation: \";\n        string code = getLine();\n        if (code\
    \ == \"\") break;\n        if (stateMap.containsKey(code)) {\n            cout\
    \ << code << \" = \" << stateMap.get(code) << endl;\n        } else {\n      \
    \      cout << code << \" = ???\" << endl;\n        }\n    }\n}\n```\n\nPostalLookup\n\
    Enter two-letter state abbreviation: HI\nHI = Hawaii\nEnter two-letter state abbreviation:\
    \ WI\nWI = Wisconsin\nEnter two-letter state abbreviation: VE\nVE = ???\nEnter\
    \ two-letter state abbreviation:\n\n- AL=Alabama\n- AK=Alaska\n- AZ=Arizona\n\
    - ...\n- FL=Florida\n- GA=Georgia\n- HI=Hawaii\n- ...\n- WI=Wisconsin\n- WY=Wyoming\n\
    \n## A Simplified Version of the Map Class\n\n| Method | Description |\n|---|---|\n\
    | `map.size()` | Returns the number of key/value pairs in the map. |\n| `map.isEmpty()`\
    \ | Returns **true** if the map is empty. |\n| `map.clear()` | Removes all key/value\
    \ pairs from the map. |\n| `map.put(key, value)` | Makes an association between\
    \ **key** and **value**, discarding any existing one. |\n| `map.get(key)` | Returns\
    \ the most recent value associated with **key**. |\n| `map.containsKey(key)` |\
    \ Returns **true** if there is a value associated with **key**. |\n\n## Implementation\
    \ Strategies for Maps\n\nThere are several strategies you might choose to implement\
    \ the map operations `get` and `put`. Those strategies include:\n\n- 1. *Linear\
    \ search*. Keep track of all the name/value pairs in an array. In this model,\
    \ both the `get` and `put` operations run in O(N) time.\n\n## Exercise: Linear\
    \ Search Map\n\nAs our programming exercise, we’ll build the linear search version\
