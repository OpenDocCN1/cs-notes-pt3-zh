    \n## A Simple BST Implementation\n\n- To get a sense of how binary search trees\
    \ work, it is useful to start with a simple design in which keys are always strings.\n\
    - Each node in the tree is then a structure containing a key and two subtrees,\
    \ each of which is either **NULL** or a pointer to some other node. This design\
