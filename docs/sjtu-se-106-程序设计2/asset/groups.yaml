  mdcn: "\n\n## 练习：三堆 Nim\n\n- 作为今天的最后练习，我想通过使用书中简单的 Nim 程序作为起点，来演示如何实现一个更复杂的 Nim\
    \ 版本。\n- 在这个版本中，有三行硬币，通常的初始配置如下：\n- 一次行动包括拿走任意数量的硬币，但它们必须全部来自同一行。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_247_0.png)\n\
    \n## 递归回溯\n\n- 将问题表述为决策点\n  - 识别需要做出的决策\n  - 识别每个决策可用的选项\n  - 递归调用做出一个决策，并对剩余决策进行递归\n\
    - 回溯方法\n  - 设计递归函数返回成功/失败\n  - 在每次调用时，选择一个选项并执行\n  - 递归继续并观察结果\n  - 如果成功，很好，否则撤销选择并重试\n\
    \  - 如果没有选项可行，返回失败从而触发回溯\n- 启发式方法可能提高效率\n  - 通过剪枝尽早消除死路\n  - 优先尝试最可能的选项\n\n##\
    \ 回溯伪代码\n\n```\nbool Solve(configuration conf)\n{\n    if (no more choices) //\
    \ BASE CASE\n        return (conf is goal state);\n\n    for (all available choices)\
    \ {\n        try one choice c;\n        // solve from here, if works out, you're\
    \ done\n        if (Solve(conf with choice c made)) return true;\n        unmake\
    \ choice c;\n    }\n\n    return false; // tried all choices, no solution found\n\
    }\n```\n\n## 第四部分：递归 VS 迭代\n\nJingyu Zhou\n\n## 递归 vs 迭代\n\n- 迭代：\n  - 将问题分解为*序列*的典型情况\n\
    \  - 识别典型情况（主体）\n  - 识别到下一个情况的*增量*步骤\n  - 识别继续或停止的*条件*\n  - 识别*初始化*\n\n- 递归：(简单)\n\
    \  - 将问题分解为*第一*部分和*剩余*部分\n  - 识别第一种情况\n  - 识别对剩余部分的递归调用\n  - 识别何时应进行递归调用。\n  \
