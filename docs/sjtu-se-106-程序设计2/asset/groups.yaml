    \ complexity of the selection sort algorithm, however, holds out some hope:\n\
    \  - Sorting twice as many elements takes four times as long.\n  - Sorting half\
    \ as many elements takes only one fourth the time.\n  - Is there any way to use\
    \ sorting half an array as a subtask in a recursive solution to the sorting problem?\n\
    \n## The Merge Sort Idea\n\n1. Divide the vector into two halves: v1 and v2.\n\
    2. Sort each of v1 and v2 recursively.\n3. Clear the original vector.\n4. Merge\
    \ elements into the original vector by choosing the smallest element from v1 or\
    \ v2 on each cycle.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_296_0.png)\n\n\
    ## The Merge Sort Implementation\n\n```\n/*\n * The merge sort algorithm consists\
    \ of the following steps:\n *\n * 1. Divide the vector into two halves.\n * 2.\
    \ Sort each of these smaller vectors recursively.\n * 3. Merge the two vectors\
    \ back into the original one.\n */\nvoid sort(Vector<int> & vec) {\n    int n\
    \ = vec.size();\n    if (n <= 1) return;\n    Vector<int> v1;\n    Vector<int>\
    \ v2;\n    for (int i = 0; i < n; i++) {\n        if (i < n / 2) {\n         \
    \   v1.add(vec[i]);\n        } else {\n            v2.add(vec[i]);\n        }\n\
    \    }\n    sort(v1);\n    sort(v2);\n    vec.clear();\n    merge(vec, v1, v2);\n\
    }\n```\n\n## The Merge Sort Implementation\n\n```\n/*\n * Function: merge\n *\
    \ -------------\n * This function merges two sorted vectors (v1 and v2) into the\n\
    \ * vector vec, which should be empty before this operation.\n * Because the input\
    \ vectors are sorted, the implementation can\n * always select the first unused\
    \ element in one of the input\n * vectors to fill the next position.\n */\n\n\
    void merge(Vector<int> & vec, Vector<int> & v1, Vector<int> & v2) {\n    int n1\
    \ = v1.size();\n    int n2 = v2.size();\n    int p1 = 0;\n    int p2 = 0;\n  \
    \  while (p1 < n1 && p2 < n2) {\n        if (v1[p1] < v2[p2]) {\n            vec.add(v1[p1++]);\n\
    \        } else {\n            vec.add(v2[p2++]);\n        }\n    }\n    while\
    \ (p1 < n1) vec.add(v1[p1++]);\n    while (p2 < n2) vec.add(v2[p2++]);\n}\n```\n\
    \n## The Complexity of Merge Sort\n\nSorting 8 items\n\nrequires\n\nTwo sorts\
    \ of 4 items\n\nwhich requires\n\nFour sorts of 2 items\n\nwhich requires\n\n\
    Eight sorts of 1 item\n\nThe work done at each level (i.e., the sum of the work\
    \ done by all the calls at that level) is proportional to the size of the vector.\
    \ The running time is therefore proportional to N times the number of levels.\n\
    \n## How Many Levels Are There?\n\n- The number of levels in the merge sort decomposition\
    \ is equal to the number of times you can divide the original vector in half until\
    \ there is only one element remaining. In other words, what you need to find is\
    \ the value of $k$ that satisfies the following equation:\n\n$$1 = N / 2 / 2 /\
    \ 2 / 2 / \\cdots / 2$$\n\n*(2 is divided $k$ times.)*\n\n- You can simplify this\
    \ formula using basic mathematics:\n\n$$1 = N / 2^k$$\n$$2^k = N$$\n$$k = \\log_2\
    \ N$$\n\n- The complexity of merge sort is therefore $O(N \\log N)$.\n"
  mdcn: "\n\n## 从代码中推导复杂度\n\n- 在很多情况下，你可以直接从代码的结构中推导出程序的计算复杂度。\n- 进行这类分析的标准方法是先寻找程序中比其它部分执行得更频繁的代码段。只要算法中涉及的各个操作耗时大致相同，执行最频繁的操作就会主导整体运行时间。\n\
    - 例如，在选择排序的实现中，执行最频繁的语句是 `findSmallest` 方法内部的 `if` 语句。该语句位于两个 `for` 循环中，一个在 `findSmallest`\
    \ 自身，另一个在 `Sort` 中。它的总执行次数为\n\n1 + 2 + 3 + ⋯ + (N − 1) + N\n\n即 O(N²)。\n\n## 寻找更高效的策略\n\
    \n- 只要数组规模较小，选择排序就是一种完全可行的策略。即便有 10,000 个元素，选择排序的平均运行时间也刚刚超过一秒。\n- 然而，选择排序的平方级行为使其在处理商业应用中常见的大型数组时缺乏吸引力。假设平方级增长模式在表格报告的耗时之外持续成立，那么对\
    \ 100,000 个值进行排序需要两分钟，对 1,000,000 个值进行排序则需要三个多小时。\n- 不过，选择排序算法的计算复杂度仍然带来了一些希望：\n\
    \  - 排序两倍数量的元素需要四倍的时间。\n  - 排序一半数量的元素只需要四分之一的时间。\n  - 有没有办法把“排序半个数组”作为递归解决排序问题的一个子任务呢？\n\
    \n## 归并排序的思路\n\n1. 将向量分为两半：v1 和 v2。\n2. 递归地对 v1 和 v2 分别排序。\n3. 清空原向量。\n4. 在每一轮循环中从\
    \ v1 或 v2 中选出最小的元素，合并回原向量。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_296_0.png)\n\
    \n## 归并排序的实现\n\n```\n/*\n * The merge sort algorithm consists of the following\
    \ steps:\n *\n * 1. Divide the vector into two halves.\n * 2. Sort each of these\
    \ smaller vectors recursively.\n * 3. Merge the two vectors back into the original\
    \ one.\n */\nvoid sort(Vector<int> & vec) {\n    int n = vec.size();\n    if (n\
    \ <= 1) return;\n    Vector<int> v1;\n    Vector<int> v2;\n    for (int i = 0;\
    \ i < n; i++) {\n        if (i < n / 2) {\n            v1.add(vec[i]);\n     \
    \   } else {\n            v2.add(vec[i]);\n        }\n    }\n    sort(v1);\n \
    \   sort(v2);\n    vec.clear();\n    merge(vec, v1, v2);\n}\n```\n\n## 归并排序的实现\n\
    \n```\n/*\n * Function: merge\n * -------------\n * This function merges two sorted\
    \ vectors (v1 and v2) into the\n * vector vec, which should be empty before this\
    \ operation.\n * Because the input vectors are sorted, the implementation can\n\
    \ * always select the first unused element in one of the input\n * vectors to\
    \ fill the next position.\n */\n\nvoid merge(Vector<int> & vec, Vector<int> &\
    \ v1, Vector<int> & v2) {\n    int n1 = v1.size();\n    int n2 = v2.size();\n\
    \    int p1 = 0;\n    int p2 = 0;\n    while (p1 < n1 && p2 < n2) {\n        if\
    \ (v1[p1] < v2[p2]) {\n            vec.add(v1[p1++]);\n        } else {\n    \
    \        vec.add(v2[p2++]);\n        }\n    }\n    while (p1 < n1) vec.add(v1[p1++]);\n\
    \    while (p2 < n2) vec.add(v2[p2++]);\n}\n```\n\n## 归并排序的复杂度\n\n排序 8 个元素\n\n\
    需要\n\n两次对 4 个元素的排序\n\n这又需要\n\n四次对 2 个元素的排序\n\n这又需要\n\n八次对 1 个元素的排序\n\n每一层完成的工作量（即该层所有调用完成工作量的总和）与向量的大小成正比。因此，运行时间与\
    \ N 乘以层数成正比。\n\n## 一共有多少层？\n\n- 归并排序分解中的层数，等于把原始向量不断对半分割直到只剩一个元素所需的次数。换句话说，你需要找到满足以下方程的\
    \ $k$ 值：\n\n$$1 = N / 2 / 2 / 2 / 2 / \\cdots / 2$$\n\n*（除以 2 共 $k$ 次。）*\n\n-\
    \ 你可以用基础数学简化这个公式：\n\n$$1 = N / 2^k$$\n$$2^k = N$$\n$$k = \\log_2 N$$\n\n- 因此，归并排序的复杂度为\
    \ $O(N \\log N)$。\n\n"
