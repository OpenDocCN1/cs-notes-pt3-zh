    # 算法证明


    定理：设T为带权 ω₁ ≤ ω₂ ≤ … ≤ ωᵢ 的最优二叉树，若将以带权 ω₁ 和 ω₂ 的叶子为孩子的分支点改为带权 ω₁+ω₂ 的叶子，得到一棵新树T′，则T′也是最优二叉树。


