    # Parse Trees


    When the C++ compiler looks at an expression, it needs to understand what the
    expression means by translating it into an internal form. This process generally
    consists of two steps:


    +   - *Lexical analysis*, in which the source text is broken up into units called
    *tokens*.

    +   - *Parsing*, in which the tokens are assembled into a recursive structure
    called an *parse tree* that embodies its structure.


