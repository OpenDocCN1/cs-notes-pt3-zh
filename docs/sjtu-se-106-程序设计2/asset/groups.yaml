- raw:
  - "[PAGE 294]\n\n# Deducing Complexity from the Code\n\n+   - In many cases, you\
    \ can deduce the computational complexity of a program directly from the structure\
    \ of the code.\n+   - The standard approach to doing this type of analysis begins\
    \ with looking for any section of code that is executed more often than other\
    \ parts of the program. As long as the individual operations involved in an algorithm\
    \ take roughly the same amount of time, the operations that are executed most\
    \ often will come to dominate the overall running time.\n+   - In the selection\
    \ sort implementation, for example, the most commonly executed statement is the\
    \ `if` statement inside the `findSmallest` method. This statement is part of two\
    \ `for` loops, one in `findSmallest` itself and one in `Sort`. The total number\
    \ of executions is\n+   \n+   1 + 2 + 3 + ⋯ + (N − 1) + N\n+   \n+   which is\
    \ O(N²)."
  - '[PAGE 295]


    # Finding a More Efficient Strategy


    +   - As long as arrays are small, selection sort is a perfectly workable strategy.
    Even for 10,000 elements, the average running time of selection sort is just over
    a second.

    +   - The quadratic behavior of selection sort, however, makes it less attractive
    for the very large arrays that one encounters in commercial applications. Assuming
    that the quadratic growth pattern continues beyond the timings reported in the
    table, sorting 100,000 values would require two minutes, and sorting 1,000,000
    values would take more than three hours.

    +   - The computational complexity of the selection sort algorithm, however, holds
    out some hope:

    +     - Sorting twice as many elements takes four times as long.

    +     - Sorting half as many elements takes only one fourth the time.

    +     - Is there any way to use sorting half an array as a subtask in a recursive
    solution to the sorting problem?'
  - '[PAGE 296]


    # The Merge Sort Idea


    +   1. Divide the vector into two halves: v1 and v2.

    +   2. Sort each of v1 and v2 recursively.

    +   3. Clear the original vector.

    +   4. Merge elements into the original vector by choosing the smallest element
    from v1 or v2 on each cycle.


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_296_0.png)'
  - "[PAGE 297]\n\n# The Merge Sort Implementation\n\n```\n/*\n * The merge sort algorithm\
    \ consists of the following steps:\n *\n * 1. Divide the vector into two halves.\n\
    \ * 2. Sort each of these smaller vectors recursively.\n * 3. Merge the two vectors\
    \ back into the original one.\n */\nvoid sort(Vector<int> & vec) {\n    int n\
    \ = vec.size();\n    if (n <= 1) return;\n    Vector<int> v1;\n    Vector<int>\
    \ v2;\n    for (int i = 0; i < n; i++) {\n        if (i < n / 2) {\n         \
    \   v1.add(vec[i]);\n        } else {\n            v2.add(vec[i]);\n        }\n\
    \    }\n    sort(v1);\n    sort(v2);\n    vec.clear();\n    merge(vec, v1, v2);\n\
    }\n```"
  - "[PAGE 298]\n\n# The Merge Sort Implementation\n\n```\n/*\n * Function: merge\n\
    \ * -------------\n * This function merges two sorted vectors (v1 and v2) into\
    \ the\n * vector vec, which should be empty before this operation.\n * Because\
    \ the input vectors are sorted, the implementation can\n * always select the first\
    \ unused element in one of the input\n * vectors to fill the next position.\n\
    \ */\n\nvoid merge(Vector<int> & vec, Vector<int> & v1, Vector<int> & v2) {\n\
    \    int n1 = v1.size();\n    int n2 = v2.size();\n    int p1 = 0;\n    int p2\
    \ = 0;\n    while (p1 < n1 && p2 < n2) {\n        if (v1[p1] < v2[p2]) {\n   \
    \         vec.add(v1[p1++]);\n        } else {\n            vec.add(v2[p2++]);\n\
    \        }\n    }\n    while (p1 < n1) vec.add(v1[p1++]);\n    while (p2 < n2)\
    \ vec.add(v2[p2++]);\n}\n```"
  - '[PAGE 299]


    # The Complexity of Merge Sort


    Sorting 8 items


    requires


    Two sorts of 4 items


    which requires


    Four sorts of 2 items


    which requires


    Eight sorts of 1 item


    The work done at each level (i.e., the sum of the work done by all the calls at
    that level) is proportional to the size of the vector. The running time is therefore
    proportional to N times the number of levels.'
  - "[PAGE 300]\n\n# # How Many Levels Are There?\n\n+   - The number of levels in\
    \ the merge sort decomposition is equal to the number of times you can divide\
    \ the original vector in half until there is only one element remaining. In other\
    \ words, what you need to find is the value of $k$ that satisfies the following\
    \ equation:\n+   \n+     $$1 = N / 2 / 2 / 2 / 2 / \\cdots / 2$$\n+   \n+    \
    \ *(2 is divided $k$ times.)*\n\n+   - You can simplify this formula using basic\
    \ mathematics:\n+   \n+     $$1 = N / 2^k$$\n+     $$2^k = N$$\n+     $$k = \\\
    log_2 N$$\n\n+   - The complexity of merge sort is therefore $O(N \\log N)$."
