  - "[PAGE 4]\n\n# Implicit definitions (Exercise)\n\n```\n// 1. copy constructor\n\
    person(const person& that) : name(that.name), age(that.age)\n{\n}\n\n// 2. copy\
    \ assignment operator\nperson& operator=(const person& that)\n{\n    name = that.name;\n\
    \    age = that.age;\n    return *this;\n}\n\n// 3. destructor\n~person()\n{\n\
    }\n```"
  - '[PAGE 5]


    # Managing resources


    +   - So when should we declare those special member functions explicitly?

    +     - When our class *manages a resource*, that is, when an object of the class
    is *responsible* for that resource.

    +     - That usually means the resource is *acquired* in the constructor (or passed
    into the constructor) and *released* in the destructor.'
  - "[PAGE 6]\n\n# Pre-standard C++\n\n```\nclass person\n{\n    char* name;\n   \
    \ int age;\npublic:\n\n    // the constructor acquires a resource:\n    // in\
    \ this case, dynamic memory obtained via new[]\n    person(const char* the_name,\
    \ int the_age)\n    {\n        name = new char[strlen(the_name) + 1];\n      \
    \  strcpy(name, the_name);\n        age = the_age;\n    }\n    // the destructor\
    \ must release this resource via delete[]\n    ~person()\n    {\n        delete[]\
    \ name;\n    }\n};\n```"
  - '[PAGE 7]


    # Problems


    +   - Changes via a can be observed via b.

    +   - Once b is destroyed, a.name is a dangling pointer.

    +   - If a is destroyed, deleting the dangling pointer yields undefined behavior.

    +   - Since the assignment does not take into account what name pointed to before
    the assignment, sooner or later you will get memory leaks all over the place.'
  - "[PAGE 8]\n\n# Explicit definitions (Challenge)\n\n```\n```cpp\n// 1. copy constructor\n\
    person(const person& that)\n{\n    name = new char[strlen(that.name) + 1];\n \
    \   strcpy(name, that.name);\n    age = that.age;\n}\n// 2. copy assignment operator\n\
    person& operator=(const person& that)\n{\n    if (this != &that)\n    {\n    \
    \    delete[] name;\n        // This is a dangerous point in the flow of execution!\n\
    \        // We have temporarily invalidated the class invariants,\n        //\
    \ and the next statement might throw an exception,\n        // leaving the object\
    \ in an invalid state :(\n        name = new char[strlen(that.name) + 1];\n  \
    \      strcpy(name, that.name);\n        age = that.age;\n    }\n    return *this;\n\
    }\n```\n```"
  - "[PAGE 9]\n\n# Optimization\n\n```\n// 2. copy assignment operator\nperson& operator=(const\
    \ person& that)\n{\n    char* local_name = new char[strlen(that.name) + 1];\n\
    \    // If the above statement throws,\n    // the object is still in the same\
    \ state as before.\n    // None of the following statements will throw an exception\n\
    \    :)\n    strcpy(local_name, that.name);\n    delete[] name;\n    name = local_name;\n\
    \    age = that.age;\n    return *this;\n}\n```"
  - '[PAGE 10]


    # Noncopyable resources


    +   - private:

    +     person(const person& that);

    +     person& operator=(const person& that);

    +   - in C++ 2011

    +     person(const person& that) = delete;

    +     person& operator=(const person& that) =delete;'
  - '[PAGE 11]


    # The rule of three


    +   - If you need to explicitly declare either the destructor, copy constructor
    or copy assignment operator yourself, you probably need to explicitly declare
    all three of them.


    http://stackoverflow.com/questions/4172722/what-is-the-rule-of-three'
  md: "\n## Introduction to Data Structures\naka.\nComputer Programming II\n\nZhengwei\
    \ QI, Jingyu Zhou\n\nhttp://tcloud.sjtu.edu.cn/courses/se106/\n\n## News\n\n-\
    \ 阿里集团2014校园招聘要招1000多人，同时正在推进一项A-star(阿里星)人才计划，面向应届毕业生吸纳技术培训生。“年薪60万上不封顶、解决北京户口”\n\
    - “光大自己开发了订单生成系统存在严重的程序设计错误，错误地将“买入个股函数”写成“买入ETF一篮子股票函数”，错误地将市价委托订单的股票买入价格默认为“0”。”\n\
    - 光大证券程序员对交易系统、尤其是其自行设计的订单系统进行了修改。而其意图或是想把相关责任都推到铭创软件公司身上？\n\n## value semantics\n\
    \n- C++ treats variables of user-defined types with *value semantics*.\n- objects\
    \ are **implicitly** copied in various contexts\n\n```\nclass person\n{\n    std::string\
    \ name;\n    int age;\n\n    public:\n\n        person(const std::string& name,\
    \ int age) : name(name), age(age)\n        {\n        }\n};\nint main()\n{\n \
    \   person a(\"Bjarne Stroustrup\", 60);\n    person b(a);  // What happens here?\n\
    \        copy constructor for a fresh object\n    b = a;      // And here?\n \
    \       copy assignment operator for an existing object\n}\n```\n\n## Implicit\
    \ definitions (Exercise)\n\n```\n// 1. copy constructor\nperson(const person&\
    \ that) : name(that.name), age(that.age)\n{\n}\n\n// 2. copy assignment operator\n\
    person& operator=(const person& that)\n{\n    name = that.name;\n    age = that.age;\n\
    \    return *this;\n}\n\n// 3. destructor\n~person()\n{\n}\n```\n\n## Managing\
    \ resources\n\n- So when should we declare those special member functions explicitly?\n\
    \  - When our class *manages a resource*, that is, when an object of the class\
    \ is *responsible* for that resource.\n  - That usually means the resource is\
    \ *acquired* in the constructor (or passed into the constructor) and *released*\
    \ in the destructor.\n\n## Pre-standard C++\n\n```\nclass person\n{\n    char*\
    \ name;\n    int age;\npublic:\n\n    // the constructor acquires a resource:\n\
    \    // in this case, dynamic memory obtained via new[]\n    person(const char*\
    \ the_name, int the_age)\n    {\n        name = new char[strlen(the_name) + 1];\n\
    \        strcpy(name, the_name);\n        age = the_age;\n    }\n    // the destructor\
    \ must release this resource via delete[]\n    ~person()\n    {\n        delete[]\
    \ name;\n    }\n};\n```\n\n## Problems\n\n- Changes via a can be observed via\
    \ b.\n- Once b is destroyed, a.name is a dangling pointer.\n- If a is destroyed,\
    \ deleting the dangling pointer yields undefined behavior.\n- Since the assignment\
    \ does not take into account what name pointed to before the assignment, sooner\
    \ or later you will get memory leaks all over the place.\n\n## Explicit definitions\
    \ (Challenge)\n\n```cpp\n// 1. copy constructor\nperson(const person& that)\n\
    {\n    name = new char[strlen(that.name) + 1];\n    strcpy(name, that.name);\n\
    \    age = that.age;\n}\n// 2. copy assignment operator\nperson& operator=(const\
    \ person& that)\n{\n    if (this != &that)\n    {\n        delete[] name;\n  \
    \      // This is a dangerous point in the flow of execution!\n        // We have\
    \ temporarily invalidated the class invariants,\n        // and the next statement\
    \ might throw an exception,\n        // leaving the object in an invalid state\
    \ :(\n        name = new char[strlen(that.name) + 1];\n        strcpy(name, that.name);\n\
    \        age = that.age;\n    }\n    return *this;\n}\n```\n\n## Optimization\n\
    \n```\n// 2. copy assignment operator\nperson& operator=(const person& that)\n\
    {\n    char* local_name = new char[strlen(that.name) + 1];\n    // If the above\
    \ statement throws,\n    // the object is still in the same state as before.\n\
    \    // None of the following statements will throw an exception\n    :)\n   \
    \ strcpy(local_name, that.name);\n    delete[] name;\n    name = local_name;\n\
    \    age = that.age;\n    return *this;\n}\n```\n\n## Noncopyable resources\n\n\
    - private:\n  person(const person& that);\n  person& operator=(const person& that);\n\
    - in C++ 2011\n  person(const person& that) = delete;\n  person& operator=(const\
    \ person& that) =delete;\n\n## The rule of three\n\n- If you need to explicitly\
    \ declare either the destructor, copy constructor or copy assignment operator\
    \ yourself, you probably need to explicitly declare all three of them.\n\nhttp://stackoverflow.com/questions/4172722/what-is-the-rule-of-three\n"
  mdcn: "\n\n## 数据结构导论\naka.\n计算机程序设计 II\n\nZhengwei QI, Jingyu Zhou\n\nhttp://tcloud.sjtu.edu.cn/courses/se106/\n\
    \n## 新闻\n\n- 阿里集团2014校园招聘要招1000多人，同时正在推进一项A-star(阿里星)人才计划，面向应届毕业生吸纳技术培训生。“年薪60万上不封顶、解决北京户口”\n\
    - “光大自己开发了订单生成系统存在严重的程序设计错误，错误地将“买入个股函数”写成“买入ETF一篮子股票函数”，错误地将市价委托订单的股票买入价格默认为“0”。”\n\
    - 光大证券程序员对交易系统、尤其是其自行设计的订单系统进行了修改。而其意图或是想把相关责任都推到铭创软件公司身上？\n\n## 值语义\n\n- C++\
    \ 以 *值语义* 处理用户定义类型变量。\n- 对象在各种上下文中会被 **隐式** 复制\n\n```\nclass person\n{\n    std::string\
    \ name;\n    int age;\n\n    public:\n\n        person(const std::string& name,\
    \ int age) : name(name), age(age)\n        {\n        }\n};\nint main()\n{\n \
    \   person a(\"Bjarne Stroustrup\", 60);\n    person b(a);  // What happens here?\n\
    \        copy constructor for a fresh object\n    b = a;      // And here?\n \
    \       copy assignment operator for an existing object\n}\n```\n\n## 隐式定义（练习）\n\
    \n```\n// 1. copy constructor\nperson(const person& that) : name(that.name), age(that.age)\n\
    {\n}\n\n// 2. copy assignment operator\nperson& operator=(const person& that)\n\
    {\n    name = that.name;\n    age = that.age;\n    return *this;\n}\n\n// 3. destructor\n\
    ~person()\n{\n}\n```\n\n## 管理资源\n\n- 那么在什么情况下我们应该显式声明这些特殊成员函数？\n  - 当我们的类 *管理一个资源*\
    \ 时，即当类的对象对该资源 *负责* 时。\n  - 这通常意味着资源在构造函数中 *获取*（或传入构造函数），并在析构函数中 *释放*。\n\n## 预标准\
    \ C++\n\n```\nclass person\n{\n    char* name;\n    int age;\npublic:\n\n    //\
    \ the constructor acquires a resource:\n    // in this case, dynamic memory obtained\
    \ via new[]\n    person(const char* the_name, int the_age)\n    {\n        name\
    \ = new char[strlen(the_name) + 1];\n        strcpy(name, the_name);\n       \
    \ age = the_age;\n    }\n    // the destructor must release this resource via\
    \ delete[]\n    ~person()\n    {\n        delete[] name;\n    }\n};\n```\n\n##\
    \ 问题\n\n- 通过 a 所做的更改可通过 b 观察到。\n- 一旦 b 被销毁，a.name 就是一个悬空指针。\n- 如果 a 被销毁，删除该悬空指针会导致未定义行为。\n\
    - 由于赋值操作没有考虑到赋值前 name 指向的内容，迟早你会在各处遇到内存泄漏。\n\n## 显式定义（挑战）\n\n```cpp\n// 1. copy\
    \ constructor\nperson(const person& that)\n{\n    name = new char[strlen(that.name)\
    \ + 1];\n    strcpy(name, that.name);\n    age = that.age;\n}\n// 2. copy assignment\
    \ operator\nperson& operator=(const person& that)\n{\n    if (this != &that)\n\
    \    {\n        delete[] name;\n        // This is a dangerous point in the flow\
    \ of execution!\n        // We have temporarily invalidated the class invariants,\n\
    \        // and the next statement might throw an exception,\n        // leaving\
    \ the object in an invalid state :(\n        name = new char[strlen(that.name)\
    \ + 1];\n        strcpy(name, that.name);\n        age = that.age;\n    }\n  \
    \  return *this;\n}\n```\n\n## 优化\n\n```\n// 2. copy assignment operator\nperson&\
    \ operator=(const person& that)\n{\n    char* local_name = new char[strlen(that.name)\
    \ + 1];\n    // If the above statement throws,\n    // the object is still in\
    \ the same state as before.\n    // None of the following statements will throw\
    \ an exception\n    :)\n    strcpy(local_name, that.name);\n    delete[] name;\n\
    \    name = local_name;\n    age = that.age;\n    return *this;\n}\n```\n\n##\
    \ 不可复制资源\n\n- private:\n  person(const person& that);\n  person& operator=(const\
    \ person& that);\n- in C++ 2011\n  person(const person& that) = delete;\n  person&\
    \ operator=(const person& that) =delete;\n\n## 三法则\n\n- 如果你需要自己显式声明析构函数、拷贝构造函数或拷贝赋值运算符中的任何一个，那么你很可能需要显式声明全部三个。\n\
    \nhttp://stackoverflow.com/questions/4172722/what-is-the-rule-of-three\n\n"
