    # 迭代器的区间


    +   - 两个迭代器表示一个区间：[p1, p2)

    +   - **STL** 算法常以迭代器的区间作为输入，传递输入数据

    +   - 合法的区间

    +     - p1经过n次(n > 0)自增(++)操作后满足p1 == p2

    +   - 区间包含p1，但不包含p2'
