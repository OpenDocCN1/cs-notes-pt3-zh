    \n## 对哈希函数的生日攻击\n\n- 利用生日悖论寻找哈希函数的碰撞。\n  1. 随机选择 k 条消息 x₁, x₂, ..., xₖ\n  2. 检查是否存在一对消息，比如\
    \ xᵢ 和 xⱼ，使得 h(xᵢ) = h(xⱼ)。若存在，则找到了一个碰撞。\n- 这种生日攻击对消息摘要的长度施加了下限。\n- 例如，40 位的消息摘要将非常不安全，因为在略多于\
    \ 2²⁰（约一百万）次随机哈希后，找到碰撞的概率至少为 ½。\n\n## 消息摘要 / 哈希值的大小\n\n- h : {0,1}\\* → {0,1}^n\n\
    \  - 如果 n = 64，在尝试略多于 2^32 次随机哈希后，找到碰撞的概率将高于一半。\n  - 如果有一台机器每秒能执行 100,000 次哈希，那么以高于一半的概率找到第一个碰撞需要\
    \ 12 小时。\n- 推荐的消息摘要长度（以位为单位）：128（MD5）、160（SHA-1）、256（SHA-256）或 512（SHA-512）\n\
    - 对于这些推荐长度，由于可能的哈希数量非常庞大，偶然找到碰撞的概率小到可以忽略不计（对于 SHA-1，为 2^80 分之一）。\n\n## 示例：MD5\
    \ 和 SHA-1\n\n### MD5\n\n- MD——消息摘要，由 Ron Rivest 于 1992 年设计。\n- 可在 [http://www.ietf.org/rfc/rfc1321](http://www.ietf.org/rfc/rfc1321)\
    \ 获取\n- 输出长度：128 位\n- 生日攻击可通过 2⁶⁴ 次尝试发起。\n\n### SHA-1\n\n- 由 NIST 于 1995 年基于 MD4（MD5\
    \ 的前身）开发\n- 可在 [http://www.itl.nist.gov/fipspubs/fip180-1.htm](http://www.itl.nist.gov/fipspubs/fip180-1.htm)\
    \ 获取\n- 输出长度：160 位\n- 发起生日攻击更困难：需要 2⁸⁰ 次尝试。\n\n### SHA-2（SHA 256/384/512）\n\n\
    - 基于 SHA-1，但具有更长的哈希值\n\n## 关于寻找 SHA-1 碰撞的一些细节\n\n问：*找到 SHA-1 碰撞有多难？*\n\n答：已报道的攻击估计需要约\
    \ 2^69（约 5.9 × 10^20）次哈希计算的工作量。尽管这远远超出了普通计算机当前可行的范围，但对于拥有专用硬件的攻击者来说，可能可行。例如，如果有\
    \ 10,000 个定制 ASIC，每个每秒可执行 20 亿次哈希运算，攻击大约需要一年时间。摩尔定律预测的计算性能提升将随时间推移使这种攻击变得更加可行，例如，一种广泛传播的互联网病毒也可能利用被攻陷的计算机来发起此类攻击。一旦找到一个碰撞，只需将数据拼接到匹配的消息上，就能轻而易举地找到其他碰撞。\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_420_0.png)\n\n## 计算机程序设计艺术（第三卷）\n\n\
    插入\n\n搜索\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_420_1.png)\n\n## 结束\n\n##\
