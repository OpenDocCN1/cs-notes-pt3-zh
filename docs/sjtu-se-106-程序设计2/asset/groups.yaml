    \n- 基本概念\n  - 树：n > 0 个结点的集合，根、其余结点分为 m >= 0 个集合，每一个集合本身又是一棵树（子树）\n  - 度、叶子、父结点、儿子结点、祖先结点、层次、高度(从根或子树的根向下看)\n\
