    # Recursion and Games


    +   - In 1950, Claude Shannon wrote an article for *Scientific American* in which
    he described how to write a chess-playing computer program.

    +   - Shannon’s strategy was to have the computer try every possible move for
    white, followed by all of black’s responses, and then all of white’s responses
    to those moves, and so on.

    +   - Even with modern computers, it is impossible to use this strategy for an
    entire game, because there are too many possibilities.


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_239_0.png)


    *Positions evaluated: ~10^53*


    ... millions of years later ...'
