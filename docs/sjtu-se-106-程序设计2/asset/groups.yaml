  md: "\n## Exercise: Minimum Spanning Tree\n\nApply Kruskal’s algorithm to find a\
    \ minimum spanning tree:\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_714_0.png)\n\
    \n+   1: HOB → SOU\n+   5: LOR → RAU\n+   10: BRE → HOB\n+   10: EDO → LOR\n+\
