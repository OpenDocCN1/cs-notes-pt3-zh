  mdcn: "\n\n## 智能指针示例\n\n以下是说明 **悬空指针** 情况的代码示例…\n\n```\nMyClass* p(new MyClass);\
    \  \nMyClass* q = p;  \ndelete p;  \np->DoSomething();  // Watch out! p is now\
    \ dangling!  \np = NULL;           // p is no longer dangling  \nq->DoSomething();\
    \  // Ouch! q is still dangling!\n```\n\n对于 auto_ptr，其指针在被复制时会被设为 NULL 来解决这个问题：\n\
    \n```\ntemplate <class T>\nauto_ptr<T>& auto_ptr<T>::operator=(auto_ptr<T>& rhs)\n\
    {\n    if (this != &rhs)\n    {\n        delete ptr;\n        ptr = rhs.ptr;\n\
    \        rhs.ptr = NULL;\n    }\n    return *this;\n}\n```\n\n## 智能指针的优点\n\n正如前面所述，使用智能指针的主要、显而易见的优点是相比普通指针，内存管理的效率更高。\n\
    \n这种效率体现在智能指针的三个主要能力上，即自动化初始化、悬空指针的处理以及自动清理。\n\n自动化初始化消除了将智能指针设为 NULL 的需求，因此也无需编写该代码，这在某种程度上与自动清理的好处类似。\n\
    \n自动清理功能意味着智能指针会自动清理，减少需要编写的代码量，进而降低出现 bug 的可能性。\n\n智能指针的主要优点是其对悬空指针的处理。这些所谓的悬空指针是一个非常常见的问题，是由指针指向已被删除的对象引起的。\n\
    \n软件程序员面临的另一个问题是程序中可能出现异常错误。\n\n如果指针内部发生异常，则其后的剩余代码将不会被执行，进而指针不会被删除，可能导致内存泄漏。\n\
    \n然而使用智能指针将消除这一威胁，因为指针会自动清理，指针会在超出作用域时被清理，无论是在正常执行路径中还是在异常期间。\n\n这种解决方案也可以为普通指针编写；然而使用智能指针实现要简单得多\n\
    \n## 结论\n\n如前所述，智能指针非常适合\n高效的内存管理。\n\n它们可用于更高效地利用\n可用内存，缩短分配和\n释放时间，并防止由\n标准指针引起的\
    \ bug。\n\nAuto_ptr：最简单的智能指针使用方法。适用于\n没有特殊要求的情况。\n\n## 第二部分：C++ 11 智能指针\n\n## C++\
    \ 内存管理惯用法\n\n- 惯用法是语言中的可重用设计技术\n- 我们将在 C++ 中查看 4 个重要的惯用法\n\n- 用于赋值的拷贝构造函数技巧\n\
    - 确保释放现有资源和获取新资源要么同时成功，要么同时失败\n\n- RAII（又名 Guard）\n- 将动态资源绑定到其他（尤其是自动）作用域\n\n\
    - 引用计数\n- 将动态生命周期绑定到一组引用\n\n- 写时复制\n- 允许更高效地管理多个别名\n\n## 用于赋值的拷贝构造函数技巧\n\n- 清理/赋值要么同时成功，要么同时失败\n\
    \n```\nclass Array {\npublic:\n  Array(unsigned int) ;\n  Array(const Array &);\
    \ // assume copy constructor makes a deep copy\n  ~Array();\n  Array & operator=(const\
    \ Array &a);\nprivate:\n  int * ints_;\n  size_t size_;\n};\n\nArray & Array::operator=(const\
    \ Array &a) {\n  if (&a != this) {\n    Array temp(a);\n    std::swap(temp.ints_,\
    \ ints_);\n    std::swap(temp.size_, size_);\n  }\n  return *this;\n}\n```\n\n\
    ## C++11 智能指针\n\n- C++11 弃用了一个旧的智能指针模板\n- **auto_ptr**：可以保护动态分配的内存并在周围传递所有权，但不能与\
    \ STL 容器一起使用并且有其他限制\n- C++11 改为提供了 3 个新的智能指针模板\n- **shared_ptr**：一种通用用途的引用计数动态内存保护器（我们将在本课程中主要使用它）\n\
    - **weak_ptr**：在不增加引用计数的情况下访问由 shared_ptr 保护的资源（可用于防止因循环引用导致的内存泄漏）\n- **unique_ptr**：一种更复杂但可能非常高效的安全转移动态内存所有权的方式（实现了\
    \ C++11“移动语义”）\n\n"
