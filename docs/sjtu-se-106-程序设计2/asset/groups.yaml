    \ clear, pop_front（只对list和deque），pop_back\n  - 其他顺序容器访问函数\n    - front, back\n\
    \  - 改变大小\n    - resize\n\n## 例10-4\n\n```cpp\n//包含的头文件略去……\ntemplate <class T>\n\
    void printContainer(const char* msg, const T& s) {\n    cout << msg << \": \"\
    ;\n    copy(s.begin(), s.end(), ostream_iterator<int>(cout, \" \"));\n    cout\
    \ << endl;\n}\nint main() {\n    deque<int> s;\n    for (int i = 0; i < 10; i++)\
    \ {\n        int x;\n        cin >> x;\n        s.push_front(x);\n    }\n}\n```\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_196_0.png)\n\n```\nprintContainer(\"\
