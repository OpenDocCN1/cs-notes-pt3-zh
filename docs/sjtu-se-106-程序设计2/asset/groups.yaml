    \ 成为新的根结点。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_646_0.png)\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_646_1.png)\n\
    \n注意：结点P如果是结点G的右儿子，调整方法类似。\n\n"
