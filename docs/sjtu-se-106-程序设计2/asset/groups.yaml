  - '[PAGE 193]


    # 容器的通用功能


    +   - 容器的通用功能

    +     - 用默认构造函数构造空容器

    +     - 支持关系运算符：==、!=、<、<=、>、>=

    +     - begin()、end(): 获得容器首、尾迭代器

    +     - clear(): 将容器清空

    +     - empty(): 判断容器是否为空

    +     - size(): 得到容器元素个数

