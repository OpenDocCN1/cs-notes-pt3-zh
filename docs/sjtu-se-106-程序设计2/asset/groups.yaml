  mdcn: "\n## 资源获取即初始化（RAII）\n\n- 也称为“守护惯用法”\n- 然而，“RAII”这一术语在 C++ 中更为常用\n- 依赖于这样一个事实：在\
    \ C++ 中，当栈帧弹出时，栈对象的析构函数会被调用\n- 思想：我们可以使用栈对象来持有堆对象或任何其他需要显式清理的资源的所有权\n  - 在资源分配时初始化栈对象\n\
    \  - 在栈对象的析构函数中释放资源\n\n## RAII 示例：守护新分配的对象\n\n```\nshared_ptr<Foo> createAndInit()\
    \ {\n  Foo *f = new Foo;\n  shared_ptr<Foo> p(f);\n  init(f); // may throw exception\n\
    \  return p;\n}\n\nint run () {\n  try {\n    shared_ptr<Foo> spf =\n        createAndInit();\n\
    \    cout << \"*spf is \" << *spf;\n  } catch (...) {\n    return -1\n  }\n  return\
    \ 0;\n}\n```\n\n- 通过 **shared_ptr** 类模板展示的 RAII 惯用法示例\n  - `#include <memory>`\n\
    \  - `using namespace std;`\n- **shared_ptr<X>** 假定并维护对别名 **X** 的所有权\n- 可以通过它（`*spf`）访问别名\
    \ **X**\n- 当安全时（依据接下来讨论的引用计数惯用法），**shared_ptr** 析构函数会对所拥有的 **X** 的指针调用 `delete`\n\
    - 与其他内存惯用法结合得很好\n\n## 引用计数简介\n\n- 基本问题\n  - 资源共享通常比复制更高效\n  - 但很难判断所有使用者何时用完某个资源\n\
    \  - 必须避免过早删除\n  - 必须避免泄漏\n- 解决方法\n  - 共享资源的同时也共享一个计数器\n  - 每个新引用都会使计数器递增\n  -\
    \ 当一个引用用完时，计数器递减\n  - 当计数降至零时，删除资源和计数器\n  - “最后离开的人关灯”\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_135_0.png)\n\
    \n## 写时复制简介\n\n- 基本问题\n  - 引用计数实现了安全高效的共享\n  - 但如果对资源进行了修改怎么办？\n  - 可能希望拥有逻辑上独立的资源副本\n\
    - 解决方法\n  - 从引用计数开始\n  - 写入者检查计数是否大于 1\n    - 复制引用和计数器\n    - 更新两个计数器\n    - 执行写入\n\
    \  - 所有读取者共享一个副本，每个写入者可以拥有自己的副本\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_137_0.png)\n\
    \n## 总结：内存管理技巧\n\n- 了解内存中什么内容放在哪里\n- 理解栈和堆分配的机制\n- 注意简单（和复杂）的生命周期错误\n- 考虑浅拷贝与深拷贝（问题和性能权衡）\n\
    - 掌握 C++ 内存管理的有用惯用法\n  - 学习它们的工作原理\n  - 理解何时应用它们\n  - 在实验课及其他地方寻找应用它们的方法\n  -\
    \ C++11 智能指针（尤其是 shared_ptr）非常有用\n\n## 结束\n\n## STL\n\n## 第一部分：STL\n（容器、迭代器和算法）\n\
    \nBjarne Stroustrup\nwww.stroustrup.com/Programming\n\n## 摘要\n\n- 本讲及下一讲介绍 STL——C++\
    \ 标准库中的容器和算法部分\n- STL 是一个可扩展的框架，用于处理 C++ 程序中的数据。\n- 首先，我将介绍总体理念，然后是基本概念，最后是容器和算法的示例。\n\
    - 还将介绍用于将数据与算法（用于通用处理）联系起来的*序列*和*迭代器*这两个关键概念。\n\n## 概述\n\n- 常见任务与理念\n- 泛型编程\n\
    - 容器、算法和迭代器\n- 最简单的算法：find()\n- 算法的参数化\n  - find_if() 与函数对象\n- 序列容器\n  - vector\
    \ 和 list\n\n## 常见任务\n\n- 将数据收集到容器中\n- 组织数据\n  - 用于打印\n  - 用于快速访问\n- 检索数据项\n  -\
