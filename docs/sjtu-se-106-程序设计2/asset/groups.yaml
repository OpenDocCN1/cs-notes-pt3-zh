    - 访问节点 MOR\n\n## Dijkstra 算法\n\n- 用于计算图中最短路径的最有用算法之一是由 Edsger W. Dijkstra 于 1959\
    \ 年开发的。\n- 该策略与你在作业中用于实现单词梯程序的广度优先搜索算法相似。主要区别在于：\n  - 用于保存路径的队列以总成本递增的顺序交付项目，而不是传统的先进先出顺序。这类队列称为\
