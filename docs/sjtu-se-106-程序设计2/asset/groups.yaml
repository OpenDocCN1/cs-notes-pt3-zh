    # The Definition of a Graph


    +   - A *graph* consists of a set of *nodes* together with a set of *arcs*. The
    nodes correspond to the dots or circles in a graph diagram (which might be cities,
    words, neurons, or who knows what) and the arcs correspond to the links that connect
    two nodes.

    +   - In some graphs, arcs are shown with an arrow that indicates the direction
    in which two nodes are linked. Such graphs are called *directed graphs*.

    +   - Other graphs, arcs are simple connections indicating that one can move in
    either direction between the two nodes. These graphs are *undirected graphs*.

    +   - Question: Which of these two structures is more general?'
