  md: "\n## Parsing Strategies\n\n## Zhengwei QI\n\nMost slides from Eric Roberts,\
    \ CS 106B, Stanford\n\n## Updated Slide on Job Outlook\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_452_0.png)\n\
    \n> We are very happy with the students that we get from this university. . .\
    \ . We just wish we could hire two to three times as many of them.\n> — Bill Gates\
    \ at Stanford, February 19, 2008\n\n## Outline for Today\n\n- 1. Review the expression\
    \ hierarchy\n- 2. Walk through a simple evaluation\n- 3. Explore the relationship\
    \ between parsing and grammars\n- 4. Look at the final version of `parser.cpp`\n\
    - 5. Walk through an example of the parser in action\n- 6. Review the structure\
    \ of the Basic assignment\n\n## The Expression Hierarchy\n\n- On last course,\
    \ I defined an abstract `Expression` class with three concrete subclasses, one\
    \ for each of the expression types:\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_455_0.png)\n\
    \n## Code for the eval Method\n\n```\nint ConstantExp::eval(EvalState & state)\
    \ {\n    return value;\n}\n\nint IdentifierExp::eval(EvalState & state) {\n  \
    \  if (!state.isDefined(name)) error(name + \" is undefined\");\n    return state.getValue(name);\n\
    }\n\nint CompoundExp::eval(EvalState & state) {\n    if (op == \"=\") {\n    \
    \    if (lhs->getType() != IDENTIFIER) error(\"Illegal lhs in assignment\");\n\
    \        int val = rhs->eval(state);\n        state.setValue(((IdentifierExp *)\
    \ lhs)->getName(), val);\n        return val;\n    }\n    int left = lhs->eval(state);\n\
    \    int right = rhs->eval(state);\n    if (op == \"+\") return left + right;\n\
    \    if (op == \"-\") return left - right;\n    if (op == \"*\") return left *\
    \ right;\n    if (op == \"/\") return left / right;\n    if (op == \"%\") return\
    \ left % right;\n    error(\"Illegal operator in expression\");\n    return 0;\n\
    }\n```\n\n## Exercise: Evaluating an Expression\n\n- Assuming **x** is bound to\
    \ 3, trace through the steps in evaluating\n\ny = ( 9 - x ) * 7\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_457_0.png)\n\
    \n## The Problem of Parsing\n\n- On last course, I noted that the rules for forming\
    \ an expression can be expressed in the form of a **grammar**, as follows:\n\n\
    E → constant\nE → identifier\nE → E op E\nE → ( E )\n\n- The process of translating\
    \ an expression from a string to its internal form is called **parsing**.\n\n\
    ## A Two-Level Grammar\n\n- The problem of parsing an expression can be simplified\
    \ by changing the grammar to one that has two levels:\n  - An *expression* is\
    \ either a *term* or two expressions joined by an operator.\n  - A *term* is either\
    \ a constant, an identifier, or an expression enclosed in parentheses.\n\n- This\
    \ design is reflected in the following revised grammar.\n\n```\nE → T\nE → E op\
    \ E\n\nT → constant\nT → identifier\nT → ( E )\n```\n\n## Ambiguity in Parse Structures\n\
    \n- Although the two-level grammar from the preceding slide can recognize any\
    \ expression, it is *ambiguous* because the same input string can generate more\
    \ than one parse tree.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_0.png)\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_1.png)\n\n- Ambiguity in grammars\
    \ is typically resolved by providing the parser with information about the *precedence*\
    \ of the operators. The text describes two strategies: *Iversonian precedence*,\
    \ in which the operators all group to the right, and *operator precedence*, in\
    \ which each operator is associated with an integer that defines its place in\
    \ the precedence hierarchy.\n\n## Exercise: Parsing an Expression\n\n- Diagram\
    \ the expression tree that results from the input string\n\nodd = 2 * n + 1\n\n\
    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_461_0.png)\n\n## The parser.cpp Implementation\n\
    \n```\n/*\n * Implementation notes: readE\n * Usage: exp = readE(scanner, prec);\n\
    \ * --------------------------------\n * This function reads the next expression\
    \ from the scanner by\n * matching the input to the following ambiguous grammar:\n\
    \ *\n *     E -> T\n *     E -> E op E\n *\n * This version of the method uses\
    \ precedence to resolve ambiguity.\n */\n\nExpression *readE(TokenScanner & scanner,\
    \ int prec) {\n    Expression *exp = readT(scanner);\n    string token;\n    while\
    \ (true) {\n        token = scanner.nextToken();\n        int newPrec = precedence(token);\n\
    \        if (newPrec <= prec) break;\n        Expression *rhs = readE(scanner,\
    \ newPrec);\n        exp = new CompoundExp(token, exp, rhs);\n    }\n    scanner.saveToken(token);\n\
    \    return exp;\n}\n```\n"
  mdcn: "\n\n## 解析策略\n\n## 郑伟 齐\n\n大部分幻灯片来自 Eric Roberts，CS 106B，斯坦福大学\n\n## 更新后的就业前景幻灯片\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_452_0.png)\n\n> 我们对来自这所大学的学生非常满意……我们只是希望能雇佣到两到三倍于他们的数量。\n\
    > ——比尔·盖茨在斯坦福大学，2008年2月19日\n\n## 今日大纲\n\n- 1. 回顾表达式层次结构\n- 2. 逐步演示一个简单的求值过程\n\
    - 3. 探索解析与文法之间的关系\n- 4. 查看 `parser.cpp` 的最终版本\n- 5. 逐步演示解析器运行的示例\n- 6. 回顾 Basic\
    \ 作业的结构\n\n## 表达式层次结构\n\n- 在上一门课程中，我定义了一个抽象的 `Expression` 类，包含三个具体的子类，每个对应一种表达式类型：\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_455_0.png)\n\n## eval 方法的代码\n\n```\n\
    int ConstantExp::eval(EvalState & state) {\n    return value;\n}\n\nint IdentifierExp::eval(EvalState\
    \ & state) {\n    if (!state.isDefined(name)) error(name + \" is undefined\");\n\
    \    return state.getValue(name);\n}\n\nint CompoundExp::eval(EvalState & state)\
    \ {\n    if (op == \"=\") {\n        if (lhs->getType() != IDENTIFIER) error(\"\
    Illegal lhs in assignment\");\n        int val = rhs->eval(state);\n        state.setValue(((IdentifierExp\
    \ *) lhs)->getName(), val);\n        return val;\n    }\n    int left = lhs->eval(state);\n\
    \    int right = rhs->eval(state);\n    if (op == \"+\") return left + right;\n\
    \    if (op == \"-\") return left - right;\n    if (op == \"*\") return left *\
    \ right;\n    if (op == \"/\") return left / right;\n    if (op == \"%\") return\
    \ left % right;\n    error(\"Illegal operator in expression\");\n    return 0;\n\
    }\n```\n\n## 练习：求值表达式\n\n- 假设 **x** 绑定为 3，追踪求值步骤\n\ny = ( 9 - x ) * 7\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_457_0.png)\n\
    \n## 解析问题\n\n- 在上一门课程中，我指出形成表达式的规则可以用 **文法** 的形式表达，如下所示：\n\nE → constant\nE →\
    \ identifier\nE → E op E\nE → ( E )\n\n- 将表达式从字符串翻译为其内部形式的过程称为 **解析**。\n\n## 两级文法\n\
    \n- 通过将文法改为具有两级的文法，可以简化解析表达式的问题：\n  - 一个 *表达式* 要么是一个 *项*，要么是由运算符连接的两个表达式。\n  -\
    \ 一个 *项* 要么是常量，要么是标识符，要么是用括号括起来的表达式。\n\n- 这种设计反映在以下修订后的文法中。\n\n```\nE → T\nE →\
    \ E op E\n\nT → constant\nT → identifier\nT → ( E )\n```\n\n## 解析结构中的歧义\n\n- 尽管上一张幻灯片中的两级文法可以识别任何表达式，但它是\
    \ *歧义* 的，因为同一个输入字符串可以生成多个解析树。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_0.png)\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_1.png)\n\n- 文法中的歧义通常通过为解析器提供有关运算符\
    \ *优先级* 的信息来解决。文本描述了两种策略：*Iversonian precedence*，其中运算符全部向右结合，以及 *operator precedence*，其中每个运算符都关联一个整数，定义其在优先级层次结构中的位置。\n\
    \n## 练习：解析表达式\n\n- 绘制输入字符串生成的表达式树\n\nodd = 2 * n + 1\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_461_0.png)\n\
    \n## parser.cpp 实现\n\n```\n/*\n * Implementation notes: readE\n * Usage: exp =\
    \ readE(scanner, prec);\n * --------------------------------\n * This function\
    \ reads the next expression from the scanner by\n * matching the input to the\
    \ following ambiguous grammar:\n *\n *     E -> T\n *     E -> E op E\n *\n *\
    \ This version of the method uses precedence to resolve ambiguity.\n */\n\nExpression\
    \ *readE(TokenScanner & scanner, int prec) {\n    Expression *exp = readT(scanner);\n\
    \    string token;\n    while (true) {\n        token = scanner.nextToken();\n\
    \        int newPrec = precedence(token);\n        if (newPrec <= prec) break;\n\
    \        Expression *rhs = readE(scanner, newPrec);\n        exp = new CompoundExp(token,\
    \ exp, rhs);\n    }\n    scanner.saveToken(token);\n    return exp;\n}\n```\n\n"
