    # A Simpler Game


    +   - Chess is far too complex a game to serve as a useful example. The text uses
    a much simpler game called *Nim*, which is representative of a large class of
    two-player games.

    +   - In Nim, the game begins with a pile of coins between two players. The starting
    number of coins can vary and should therefore be easy to change in the program.

    +   - In alternating turns, each player takes one, two, or three coins from the
    pile in the center.

    +   - The player who takes the last coin loses.'
