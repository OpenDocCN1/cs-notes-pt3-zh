    # 容器


    +   - 容器类是容纳、包含一组元素或元素集合的对象。

    +   - 七种基本容器：

    +     - 向量（vector）、双端队列（deque）、列表（list）、集合（set）、多重集合（multiset）、映射（map）和多重映射（multimap）'
