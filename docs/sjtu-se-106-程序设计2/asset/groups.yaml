    # Sorting


    +   - Of all the algorithmic problems that computer scientists have studied, the
    one with the broadest practical impact is certainly the *sorting problem*, which
    is the problem of arranging the elements of an array or a vector in order.

    +   - The sorting problem comes up, for example, in alphabetizing a telephone
    directory, arranging library records by catalogue number, and organizing a bulk
    mailing by ZIP code.

    +   - There are many algorithms that one can use to sort an array. Because these
    algorithms vary enormously in their efficiency, it is critical to choose a good
    algorithm, particularly if the application needs to work with large arrays.'
  - '[PAGE 281]


    # 概述


    +   - 排序：内部排序：全部记录都可以同时调入内存进行的排序。

    +     外部排序：文件中的记录太大，无法全部将其同时调入内存进行的排序。


    +   - 定义：设有记录序列：{ R₁、R₂ ........ Rₙ } 其相应的关键字序列为：

    +     { K₁、K₂ ........ Kₙ }；若存在一种确定的关系： Kₓ <= Kᵧ <= ... <= K_z

    +     则将记录序列 { R₁、R₂ ........ Rₙ } 排成按该关键字有序的序列：

    +     { Rₓ、Rᵧ ........ R_z } 的操作，称之为排序。

    +     关系是任意的，如通常经常使用的小于、大于等关系或任意的关系。


    +   - 稳定与不稳定：若记录序列中的任意两个记录 Rₓ、Rᵧ 的关键字 Kₓ = Kᵧ ；如果在排序之前和排序之后，它们的相对位置保持不变，则这种排序方法是稳定的，否则是不稳定的。'
