    \n## Map\n\n- 一个非常有用的抽象\n  - 任何类型的字典、查找表、索引、数据库等。\n- 存储键值对\n  - 通过键快速访问\n  - 需要优化的操作：put,\
    \ get\n\n## Basic Idea\n\n- 使用 *hash function* 将键映射到 *hash table* 中的位置\n- 如果元素\
    \ *e* 的键为 *k* 且 *h* 为哈希函数，则 *e* 存储在表的位置 *h(k)*\n- 要搜索 *e*，计算 *h(k)* 以定位位置。如果没有元素，则字典不包含\
    \ *e*。\n\n理想情况下\n\n## Example\n\n- 字典 学生记录\n  - 键为学号（951000 - 952000），不超过 100\
    \ 名学生\n  - 哈希函数：h(k) = k-951000 将 ID 映射到不同的表位置 0-1000\n  - `array table[1001]`\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_390_0.png)\n\n## Analysis (Ideal Case)\n\
    \n- 初始化哈希表需要 O(b) 时间（b 为哈希表中位置或桶的数量）\n- 执行 *insert*、*remove*、*search* 需要 O(1)\
    \ 时间\n\n## Ideal Case is Unrealistic\n\n- 可用于实现字典，但许多应用的键范围太大，无法在桶和键之间建立 1-1 映射！\n\
    \n示例：\n\n- 假设键的取值范围为 0 .. 65,535（2 字节无符号整数）\n- 预计任何时候约有 1,000 条记录\n- 使用 65,536\
    \ 个槽的哈希表不切实际！\n\n## Hash Functions\n\n- 如果键范围太大，使用更少的桶的哈希表，并使用哈希函数将多个键映射到同一桶：\n\
    \  h(k₁) = β = h(k₂)：k₁ 和 k₂ 在槽 β 处发生 **collision**\n- 流行的哈希函数：除法哈希\n  h(k) =\
