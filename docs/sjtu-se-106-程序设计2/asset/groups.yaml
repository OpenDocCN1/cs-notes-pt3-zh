    # 5、中序线索树


    中序线索树


    +   - 在中序线索树上进行中序遍历、不用堆栈的算法及程序要点：

    +     1、最先输出最左的左后代结点

    +     2、结点无右后件，则该结点的中序的后继结点，由右儿子的指针场给出。但要注意以下情况：


    +   3、结点有右儿子，则该结点的中序的后继结点，是它的右子树中的最左的左后代结点。

    +   4、最先输出的结点无前驱结点，最后输出的结点无后继结点。


