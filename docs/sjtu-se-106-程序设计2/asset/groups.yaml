    \ they must all be from the same row.\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_247_0.png)\n\
    \n## Recursive backtracking\n\n- Cast problem in terms of decision points\n  -\
    \ Identify what decisions need to be made\n  - Identify what options are available\
    \ for each decision\n  - A recursive call make one decision, and recurs on remaining\
    \ decisions\n- Backtracking approach\n  - Design recursion function to return\
    \ success/failure\n  - At each call, choose one option and go with it\n  - Recursively\
    \ proceed and see what happens\n  - If it works out, great, otherwise unmake choice\
    \ and retry\n  - If no option worked, return failure which triggers backtracking\n\
    - Heuristics may help efficiency\n  - Eliminate dead ends early by pruning\n \
    \ - Pursue most likely choice(s) first\n\n## Backtracking pseudocode\n\n```\n\
    bool Solve(configuration conf)\n{\n    if (no more choices) // BASE CASE\n   \
    \     return (conf is goal state);\n\n    for (all available choices) {\n    \
    \    try one choice c;\n        // solve from here, if works out, you're done\n\
    \        if (Solve(conf with choice c made)) return true;\n        unmake choice\
    \ c;\n    }\n\n    return false; // tried all choices, no solution found\n}\n\
    ```\n\n## Part IV: Recursion VS Iteration\n\nJingyu Zhou\n\n## Recursion vs Iteration\n\
    \n- Iteration:\n  - Break problem into *sequence* of typical case\n  - Identify\
    \ the typical case (body)\n  - Identify the *incremental* step to the next case\n\
    \  - Identify the keep-going or stopping *condition*\n  - Identify the *initialization*\n\
    \n- Recursion: (simple)\n  - Break problem into *first* and *rest*\n  - Identify\
    \ the first case\n  - Identify the recursive call for the rest\n  - Identify when\
    \ you should do the recursive call.\n    - Make sure there is a stopping case\
    \ (*base case*)\n  - May need a wrapper method to *initialize*\n\n## Recursion\
    \ Example: Powers\n\n- Recall predefined function pow():\n  result = pow(2.0,3.0);\n\
    \  - Returns 2 raised to power 3 (8.0)\n  - Takes two double arguments\n  - Returns\
    \ double value\n- Let’s write recursively\n  - For simple example\n\n## Function\
    \ Definition for power()\n\n```\nint power(int x, int n)\n{\n    if (n<0)\n  \
    \  {\n        cout << \"Illegal argument\";\n        exit(1);\n    }\n    if (n>0)\n\
    \        return power(x, n-1)*x;\n    else\n        return 1;\n}\n```\n\n## Calling\
    \ Function power()\n\n- Larger example:\n  power(2,3);\n  → power(2,2)*2\n  →\
    \ power(2,1)*2\n  → power(2,0)*2\n  → 1\n\n- Reaches base case\n\n- Recursion\
    \ stops\n\n- Values \"returned back\" up stack\n\n## Thinking Recursively\n\n\
    - Ignore details\n  - Forget how stack works\n  - Forget the suspended computations\n\
    \  - Yes, this is an \"abstraction\" principle!\n  - And encapsulation principle!\n\
    - Let computer do \"bookkeeping\"\n  - Programmer just think \"big picture\"\n\
    \n## Thinking Recursively: power\n\n- Consider power() again\n- Recursive definition\
    \ of power:\n\n`power(x, n)`\n\nreturns:\n\n`power(x, n - 1) * x`\n\n- Just ensure\
    \ \"formula\" correct\n- And ensure base case will be met\n\n## Recursive Design\
    \ Techniques\n\n- Don't trace entire recursive sequence!\n- Just check 3 properties:\n\
    \  - No infinite recursion\n  - Stopping cases return correct values\n  - Recursive\
    \ cases return correct values\n\n## Recursive Design Check: power()\n\nCheck power()\
    \ against 3 properties:\n\n- 1. No infinite recursion:\n  - 2nd argument decreases\
