  mdcn: "\n\n## 原地快速排序（续）\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_313_0.png)\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_313_1.png)\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_313_2.png)\n\
    \n一次最终的与枢轴的交换完成了划分步骤\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_313_3.png)\n\n\
    ## 运行时间分析\n\n- 平均情况分析\n- 最坏情况分析\n- 快速排序的最坏情况是什么？\n- 运行时间？\n\n## 快速排序运行时间\n\n-\
    \ 最坏情况：当枢轴没有将序列分成两部分时\n  - 在每一步，序列的长度仅减少 1\n  - 总运行时间\n  - $$\\sum_{i=n}^{1} length(S_i)\
    \ = O(n^2)$$\n- 一般情况：\n  - 树中第 i 层的花费时间为 O(n)\n  - 运行时间：O(n) * O(height)\n- 平均情况：\n\
    \  - O(n log n)\n\n## 该怎么办？\n\n- 选择不同的枢轴\n  - 计算实际中位数\n    - 存在 O(N) 算法保证 50/50\
    \ 分割\n  - “三数取中”\n    - 用第一个、最后一个、中间的近似中位数\n  - 随机\n    - 最坏情况可能发生，但不太可能\n\n##\
    \ 更多排序算法\n\n- 桶排序\n- 基数排序\n- 稳定排序\n  - 一种排序算法，其中具有相同键的元素在最终序列中的顺序不会改变\n  - 冒泡排序稳定吗？\n\
    \  - 归并排序稳定吗？\n\n## 桶排序\n\n- **桶排序**\n  - 假设：键在范围 [0, N) 内\n  - 基本思想：\n    1.\
    \ 创建 N 个链表（桶）将区间 [0,N) 分成大小为 1 的子区间\n    2. 将每个输入元素添加到适当的桶中\n    3. 连接桶\n  - 预期总时间为\
    \ O(n + N)，其中 n = 原始序列的大小\n    - 如果 N 是 O(n) → O(n) 的排序算法！\n\n## 桶排序\n\n数组的每个元素被放入\
    \ N 个“桶”之一\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_319_0.png)\n\n现在每个元素都在正确的桶中：\n\
    \n## 桶排序\n\n现在，从桶中取出元素放入数组\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_320_0.png)\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_320_1.png)\n\n最后，排序好的数组\n（以稳定方式排序）：\n\
    \n![](img/af430dff16b82a0fe61ce7dee05dcf9c_320_2.png)\n\n## 它适用于实数吗？\n\n- 如果键不是整数怎么办？\n\
    \  - 假设：输入是 [0, 1) 中的 n 个实数\n  - 基本思想：\n    - 创建 N 个链表（桶）将区间 [0,1) 分成大小为 1/N 的子区间\n\
    \    - 将每个输入元素添加到适当的桶中并用插入排序对桶进行排序\n  - 均匀输入分布 → O(1) 桶大小\n    - 因此预期总时间为 O(n)\n\
    \  - 键在桶中的分布与 .... 类似？\n\n## 基数排序\n\n- 直观上，你可能会按最高有效位排序，然后是第二位，等等。\n- 问题：需要跟踪大量中间的卡片堆\n\
    - 关键思想：先排序*最低*有效位\n\n```\nRadixSort(A, d)\n    for i=1 to d\n        StableSort(A)\
    \ on digit i\n```\n\n## 1、基数排序：\n\ne.g: B = 5、2、9、7、18、17、52 用基数排序法进行排序。\n\nB\
