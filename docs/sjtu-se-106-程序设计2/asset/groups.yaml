    \  // a vector iterator could be a pointer to an element\n\n    typedef ??? const_iterator;\n\
    \n    iterator begin();                // points to first element\n    const_iterator\
    \ begin() const;\n    iterator end();                  // points one beyond the\
    \ last element\n    const_iterator end() const;\n\n    iterator erase(iterator\
    \ p);      // remove element pointed to by p\n    iterator insert(iterator p,\
    \ const T& v); // insert a new element v before p\n};\n```\n\n## 从 vector 中 erase()\n\
    \n```\np = v.erase(p); // leaves p pointing at the element after the erased one\n\
    ```\n\n- 当你 insert() 或 erase() 时，vector 的元素会移动\n- 指向 vector 的迭代器会因 insert() 和\
    \ erase() 而失效\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_173_0.png)\n\n"
