    ## 平衡二叉排序树（AVL树）


    - 平衡二叉排序树

    - 平衡因子（平衡度）：节点的平衡度是节点的左子树的高度 - 右子树的高度。

    - 平衡二叉树：每个节点的平衡因子都为 +1、-1、0 的二叉树。或者说每个节点的左右子树的高度最多差一的二叉树。

    - 注意：满树必为平衡树，平衡树不一定是满树。


