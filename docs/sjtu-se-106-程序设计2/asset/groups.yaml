  mdcn: "\n\n## 冲突解决策略\n\n- 两个类别：\n  1. 开放哈希，又称分离链接\n  2. 闭合哈希，又称开放寻址\n- 区别在于冲突是存储在*表外*（开放哈希）还是冲突导致记录存储在表的*另一个槽位*中（闭合哈希）\n\
    \n## 闭合哈希\n\n- 与闭合哈希相关的是*再哈希策略*：\n  “如果我们尝试将 x 放入桶 h(x) 中并发现已被占用，则寻找替代位置 h₁(x)、h₂(x)\
    \ 等。按顺序尝试每个位置，如果都无空闲则表已满，” \n- h(x) 称为*主桶*\n- 最简单的再哈希策略称为*线性哈希*\n  hᵢ(x) = (h(x)\
    \ + i) % D\n- 一般来说，冲突解决策略是生成可容纳记录的哈希表槽序列（探测序列）；测试每个槽直到找到空槽（探测）\n\n## 示例线性（闭合）哈希\n\
    \n- D=8，键 a,b,c,d 的哈希值为 h(a)=3, h(b)=0, h(c)=4, h(d)=3\n  - 我们把 d 插入哪里？3 已被填满\n\
    \  - 使用线性哈希的探测序列：\n    - h1(d) = (h(d)+1)%8 = 4%8 = 4\n    - h2(d) = (h(d)+2)%8\
    \ = 5%8 = 5*\n    - h3(d) = (h(d)+3)%8 = 6%8 = 6\n    - 等等。\n    - 7, 0, 1, 2\n\
    \  - 在表的开头处回绕！\n\n| Index | Value |\n|---:|:---:|\n| 0 | b |\n| 1 |  |\n| 2 |\
    \  |\n| 3 | a |\n| 4 | c |\n| 5 | d |\n| 6 |  |\n| 7 |  |\n\n## 使用线性哈希的操作\n\n\
    - 成员资格测试：*findItem*\n  - 检查 h(k)、h₁(k)、h₂(k)、…，直到找到 k 或空桶或主桶\n- 如果不允许删除，该策略有效！\n\
    - 如果允许删除怎么办？\n  - 如果到达空桶，就不能确定 k 是否在别处，而空桶在 k 插入时曾被占用\n  - 需要特殊占位符 *deleted*，以区分从未使用过的桶和曾经存放过值的桶\n\
    \  - 删除过多后可能需要重新组织表\n\n## 性能分析 - 最坏情况\n\n- 初始化：O(b)，b 为桶的数量\n- 插入和搜索：O(n)，n 为表中的元素数量；所有\
    \ n 个键值具有相同的主桶\n- 对于维护字典，不比线性列表更好！\n\n## 性能分析 - 平均情况\n\n- 区分成功和不成功的搜索\n  - 删除\
    \ = 成功搜索待删除的记录\n  - 插入 = 沿其探测序列的不成功搜索\n- 哈希的期望成本是表填充程度的函数：负载因子 α = n/b\n- 已证明线性哈希（探测）下的平均成本为：\n\
    \  - 插入：1/2(1 + 1/(1 - α)²)\n  - 删除：1/2(1 + 1/(1 - α))\n\n## 改进的冲突解决\n\n- 线性探测：hᵢ(x)\
    \ = (h(x) + i) % D\n  - 在探测序列返回主位置之前，表中的所有桶都将成为插入新记录的候选\n  - 记录聚集，导致探测序列变长\n-\
    \ 跳跃线性探测：hᵢ(x) = (h(x) + i c) % D\n  - c 为 1 以外的常数\n  - 主桶相邻的记录不会遵循相同的探测序列\n-\
    \ （伪）随机探测：hᵢ(x) = (h(x) + rᵢ) % D\n  - rᵢ 是从 1 到 D-1 的数字随机排列中的第 i 个值\n  - 插入和搜索使用相同的“随机”数字序列\n\
    \n## 示例\n\n**I**\n\n| Bucket | Record |\n|---:|---:|\n| 0 | 1001 |\n| 1 | 9537\
    \ |\n| 2 | 3016 |\n| 3 |  |\n| 4 |  |\n| 5 |  |\n| 6 |  |\n| 7 | 9874 |\n| 8 |\
    \ 2009 |\n| 9 | 9875 |\n| 10 |  |\n\n- 1. 如果下一个元素的主桶为 0 怎么办？\n  → 转到桶 3\n  主桶为\
    \ 1 或 2 的元素也一样！\n  只有主位置为 3 的记录才会保留。\n  ⇒ p = 4/11 下一个记录会进入桶 3\n- 2. 同理，哈希到 7、8、9\
