    # 6、最优二叉树及其应用


    # 1、最优二叉树（赫夫曼树）


    +   - 路径长度：结点之间的树枝的总数

    +   - 树的路径长度：从根到每一结点的路径长度之和

    +   - 树的带权路径长度：叶子结点的带权路径长度之和。设有 n 片叶子，它们的权值分别为 $w_1、w_2、……w_n$，相应的路径长度分别为 $L_1、L_2、……L_n$。


    则树的带权路径长度可记为：


    $$WPL=\sum_{k=1}^{n}w_kL_k$$


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_603_0.png)


    • 最优二叉树或赫夫曼树：树的带权路径长度 WPL 最小的二叉树。'
