  - "[PAGE 76]\n\n# Templates in Functions\n\n+   - Templates can be used before a\
    \ function definition to create a generic collection of functions that can be\
    \ applied to values of various types.\n+   - The following code, for example,\
    \ creates a template for invoking selection sort on arrays of any element type:\n\
    \n```\ntemplate <typename ElemType>\nvoid Sort(ElemType array[], int n) {\n  \
    \  for (int i = 0; i < n; i++) {\n        int minIndex = i;\n        for (int\
    \ j = i + 1; j < n; j++) {\n            if (array[j] < array[minIndex]) minIndex\
    \ = j;\n        }\n        ElemType temp = array[i];\n        array[i] = array[minIndex];\n\
    \        array[minIndex] = temp;\n    }\n}\n```"
  - '[PAGE 77]


    # Templates in Class Definitions


    +   - Templates are more commonly used to define generic classes. When they are
    used in this way, the `template` keyword must appear before the class definition
    and before each of the implementations of the member functions.

    +   - The most inconvenient aspect of using templates to create generic classes
    is that the compiler cannot process them correctly unless it has access to both
    the interface and the implementation at the same time.

    +   - To emphasize the conceptual separation between the interface and the associated
    implementation, it is useful to use the `#include` keyword to include the code
    for the implementation without having that code actually appear in the interface
    file, where it is likely to confuse the casual reader.'
