- pgno: 458
  md: "# The Problem of Parsing\n\n+   - On last course, I noted that the rules for\
    \ forming an expression can be expressed in the form of a **grammar**, as follows:\n\
    +   \n+     E → constant\n+     E → identifier\n+     E → E op E\n+     E → (\
    \ E )\n+   - The process of translating an expression from a string to its internal\
    \ form is called **parsing**."
  merge: -1
  img_proc: true
- pgno: 459
  md: '# A Two-Level Grammar


    +   - The problem of parsing an expression can be simplified by changing the grammar
    to one that has two levels:

    +     - An *expression* is either a *term* or two expressions joined by an operator.

    +     - A *term* is either a constant, an identifier, or an expression enclosed
    in parentheses.


    +   - This design is reflected in the following revised grammar.


    ```

    E → T

    E → E op E


    T → constant

    T → identifier

    T → ( E )

    ```'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# Ambiguity in Parse Structures


    +   - Although the two-level grammar from the preceding slide can recognize any
    expression, it is *ambiguous* because the same input string can generate more
    than one parse tree.


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_0.png)


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_460_1.png)


    +   - Ambiguity in grammars is typically resolved by providing the parser with
    information about the *precedence* of the operators. The text describes two strategies:
    *Iversonian precedence*, in which the operators all group to the right, and *operator
    precedence*, in which each operator is associated with an integer that defines
    its place in the precedence hierarchy.'
  merge: -1
  img_proc: true
