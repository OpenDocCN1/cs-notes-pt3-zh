- pgno: 366
  md: '# A Simplified Version of the Map Class


    | Method | Description |

    |---|---|

    | `map.size()` | Returns the number of key/value pairs in the map. |

    | `map.isEmpty()` | Returns **true** if the map is empty. |

    | `map.clear()` | Removes all key/value pairs from the map. |

