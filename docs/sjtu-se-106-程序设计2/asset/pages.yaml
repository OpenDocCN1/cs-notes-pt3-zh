  md: '# 4、二叉树遍历的迭代器类


    +   • 遍历二叉树：设根节点初始时非空

    +   • 后序算法：1、节点（初始时为根）进栈（标志0），沿左指针查找左儿子（标志1）

    +   2、左儿子非空，返回1。

    +   3、退栈。若为标志1转4，否则标志2，转5。

    +   4、进栈转向右子树（标志2），如有右儿子非空，则转向1；空转向3。

