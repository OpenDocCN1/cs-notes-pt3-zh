- pgno: 131
  md: "# Copy Constructor Trick for Assignment\n\n+   - Cleanup/assignment succeed\
    \ or fail together\n\n```\nclass Array {\npublic:\n  Array(unsigned int) ;\n \
    \ Array(const Array &); // assume copy constructor makes a deep copy\n  ~Array();\n\
    \  Array & operator=(const Array &a);\nprivate:\n  int * ints_;\n  size_t size_;\n\
    };\n\nArray & Array::operator=(const Array &a) {\n  if (&a != this) {\n    Array\
    \ temp(a);\n    std::swap(temp.ints_, ints_);\n    std::swap(temp.size_, size_);\n\
    \  }\n  return *this;\n}\n```"
