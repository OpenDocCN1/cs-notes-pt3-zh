    +   - The difference between *O(N²)* and *O(N log N)* is enormous for large values
    of *N*, as shown in this table:


    | *N* | *N*² | *N* log₂ *N* |

    |---:|---:|---:|

    | 10 | 100 | 33 |

    | 100 | 10,000 | 664 |

