- pgno: 300
  md: "# # How Many Levels Are There?\n\n+   - The number of levels in the merge sort\
    \ decomposition is equal to the number of times you can divide the original vector\
    \ in half until there is only one element remaining. In other words, what you\
    \ need to find is the value of $k$ that satisfies the following equation:\n+ \
    \  \n+     $$1 = N / 2 / 2 / 2 / 2 / \\cdots / 2$$\n+   \n+     *(2 is divided\
    \ $k$ times.)*\n\n+   - You can simplify this formula using basic mathematics:\n\
    +   \n+     $$1 = N / 2^k$$\n+     $$2^k = N$$\n+     $$k = \\log_2 N$$\n\n+ \
    \  - The complexity of merge sort is therefore $O(N \\log N)$."
  merge: -1
  img_proc: true
