- pgno: 413
  md: '# Hash Functions


    +   - A hash function is denoted by

    +     h: {0, 1}* → {0, 1}^n

    +     where n is a security parameter, say 128, 160, 256 or 512.

    +   - In English:

    +     - A function which is applicable to data of any size.

    +     - Its produces a fixed length output, usually short.

    +   - 3 Types of Security Requirements:

    +     - One-way: given an output z, it is difficult to find x such that z = h(x).

    +     - Weak collision-resistant: given x, it is difficult to find y ≠ x such
    that h(y) = h(x).

    +     - Strong collision-resistant: it is difficult to find any pair (x, y) such
    that h(x) = h(y).

    +   - Note: Strong collision-resistant ⇒ Weak collision-resistant ⇒ One-way

    +   - Let m be some message. h(x) is called the message digest.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# Birthday Attack


    +   - **Birthday Paradox:**

    +     - If there are 23 people in a room, the probability that at least two people
    have the same birthday is slightly more than 50%. If there are 30, the probability
    is around 70%.

    +   - This process is analogous to throwing k balls randomly into n bins and checking
    to see if some bin contains at least two balls.

    +   - For having more than half chance of finding at least two balls in one bin,

    +     k ≈ 1.17 n^{1/2}

    +     - E.g. n = 365 ⇒ k ≈ 23


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_414_0.png)'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# Birthday Attack Against a Hash Function


    +   - Finding collisions of a hash function using Birthday Paradox.

    +     1. randomly chooses k messages, x₁, x₂, ..., xₖ

    +     2. search if there is a pair of messages, say xᵢ and xⱼ such that h(xᵢ)
    = h(xⱼ). If so, one collision is found.


    +   - This birthday attack imposes a lower bound on the size of message digests.


    +   - e.g. 40-bit message digest would be very insecure, since a collision could
    be found with probability at least ½ after doing slight over 2²⁰ (about a million)
    random hashes.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# Size of a Message Digest / Hash Value


    +   - h : {0,1}* → {0,1}^n

    +     - If n = 64, the probability of finding one collision will be higher than
    half after slightly more than 2^32 random hashes being tried.

    +     - If there exists a machine which can carry out 100,000 hashes per second,
    it takes 12 hours for finding the first collision with probability higher than
    half.


    +   - Recommended message digest lengths (in bits): 128 (MD5), 160 (SHA-1), 256
    (SHA-256) or 512 (SHA-512)


    +   - For those recommended lengths, because the number of possible hashes is
    so large, the odds of finding one by chance is negligibly small (one in 2^80 for
    SHA-1).'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Examples: MD5 and SHA-1


    # MD5


    +   - MD – Message Digest, designed by Ron Rivest in 1992.

    +   - Available at [http://www.ietf.org/rfc/rfc1321](http://www.ietf.org/rfc/rfc1321)

    +   - Output length: 128 bits

    +   - A Birthday Attack can be launched using 2⁶⁴ trials.


    # SHA-1


    +   - Developed by NIST based on MD4, a precursor to MD5, in 1995

    +   - Available at [http://www.itl.nist.gov/fipspubs/fip180-1.htm](http://www.itl.nist.gov/fipspubs/fip180-1.htm)

    +   - Output length: 160 bits

    +   - More difficult to launch a birthday attack: needs 2⁸⁰ trials.


    # SHA-2 (SHA 256/384/512)


    +   - Based on SHA-1 with a longer hash value'
