- pgno: 177
  md: "# Ways of traversing a vector\n\n```\n```cpp\nfor(int i = 0; i<v.size(); ++i)\
    \              // why int?\n    ...  // do something with v[i]\n\nfor(vector<int>::size_type\
    \ i = 0; i<v.size(); ++i)    // longer but always correct\n    ...  // do something\
    \ with v[i]\n\nfor(vector<int>::iterator p = v.begin(); p!=v.end(); ++p)\n   \
    \ ...  // do something with *p\n```\n```\n\n+   - know both ways (iterator and\
    \ subscript)\n+     - The subscript style is used in essentially every language\n\
    +     - The iterator style is used in C (pointers only) and C++\n+     - The iterator\
    \ style is used for standard library algorithms\n+     - The subscript style doesn’t\
    \ work for lists (in C++ and in most languages)\n+   - use either way for vectors\n\
    +     - There are no fundamental advantage of one style over the other\n+    \
    \ - But the iterator style works for all sequences\n+     - Prefer `size_type`\
    \ over plain `int`\n+       - pedantic, but quiets compiler and prevents rare\
    \ errors"
  merge: -1
