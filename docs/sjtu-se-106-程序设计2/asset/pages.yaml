- pgno: 686
  md: '# Three Strategies


    +   1. *Use low-level structures.* This design uses the structure types `Node`
    and `Arc` to represent the components of a graph. This model gives clients complete
    freedom to extend these structures but offers no support for graph operations.

    +   2. *Define classes for each of the component types.* This design uses the
    `Node` and `Arc` classes to define the structure. In this model, clients define
    subclasses of the supplied types to particularize the graph data structure to
    their own application.

    +   3. *Adopt a hybrid strategy.* This design defines a `Graph` class but parameterizes
    that class so that it can use any structures or objects as the node and arc types.
    This strategy retains the flexibility of the low-level model and avoids the complexity
    associated with the class-based approach.'
  merge: -1
  img_proc: true
