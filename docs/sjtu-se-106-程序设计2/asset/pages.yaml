  md: '# 8、树的计数


    # 1、二叉树的确定


    +   - 前序（后序）+中序唯一确定一棵二叉树


    e.g: 前序：A、B、D、E、F、C

    中序：D、B、E、F、A、C


    确定过程：1、定根A


    2、在中序序列中找到A


    3、中序序列中的A的左部为A的左子树上的所有结点，A的右部为A的右子树中的所有结点。


    4、根据A的左子树的所有节点的前序序列确定A的左子树的根节点，它是A的左儿子。


    5、根据A的右子树的所有节点的前序序列确定A的右子树的根节点，它是A的右儿子。


    6、在左、右子树中反复以上过程。至所有节点处理完毕。结束


    前序：A、B、D、E、F、C

    中序：D、B、E、F、A、C


    前序：A、B、D、E、F、C

    中序：D、B、E、F、A、C


    前序：B、D、E、F

    中序：D、B、E、F


    前序：E、F

    中序：E、F


