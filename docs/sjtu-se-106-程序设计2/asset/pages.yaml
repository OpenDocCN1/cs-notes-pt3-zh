- pgno: 503
  md: '# Binary Search Trees


    +   - The structure that ends up solving this problem is called a *binary search
    tree* (or *BST* for short). Each node in a BST has exactly two subtrees: a *left
    subtree* that contains all the nodes that come before the current node and a *right
    subtree* that contains all the nodes that come after it. Either or both of these
    subtrees may be `NULL`.

    +   - The classic example of a binary search tree uses the names from Walt Disney’s
    *Snow White and the Seven Dwarves*:


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_503_0.png)'
  merge: -1
  img_proc: true
- pgno: 504
  md: "# A Simple BST Implementation\n\n+   - To get a sense of how binary search\
    \ trees work, it is useful to start with a simple design in which keys are always\
    \ strings.\n+   - Each node in the tree is then a structure containing a key and\
    \ two subtrees, each of which is either **NULL** or a pointer to some other node.\
    \ This design suggests the following definition:\n+   - The code for finding a\
    \ node in a tree begins by comparing the desired key with the key in the root\
    \ node. If the strings match, you’ve found the correct node; if not, you simply\
    \ call yourself recursively on the left or right subtree depending on whether\
    \ the key you want comes before or after the current one.\n\n```\nstruct Node\
    \ {\n    string key;\n    Node *left, *right;\n};\n```"
  merge: -1
  img_proc: true
- pgno: 505
  md: "# A Simple BST Implementation\n\n```\n/*\n * Function: findNode\n * Usage:\
    \ Node *node = findNode(t, key);\n * ----------------------------------------\n\
    \ * Finds a node with the specified key in the binary search tree rooted\n * at\
    \ t. If a node matching key appears in the tree, findNode returns\n * a pointer\
    \ to that node. If the key does not appear, findNode\n * returns NULL.\n */\n\n\
    Node *findNode(Node *t, string key) {\n    if (t == NULL) return NULL;\n    if\
    \ (key == t->key) return t;\n    if (key < t->key) {\n        return findNode(t->left,\
    \ key);\n    } else {\n        return findNode(t->right, key);\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 506
  md: "# A Simple BST Implementation\n\n```\n/*\n * Function: insertNode\n * Usage:\
    \ insertNode(t, key);\n * -----------------------------\n * Inserts the specified\
    \ key at the appropriate location in the\n * binary search tree rooted at t. \
    \ Note that t must be passed\n * by reference, since it is possible to change\
    \ the root.\n */\n\nvoid insertNode(Node * & t, string key) {\n    if (t == NULL)\
    \ {\n        t = new Node;\n        t->key = key;\n        t->left = t->right\
    \ = NULL;\n        return;\n    }\n    if (key == t->key) return;\n    if (key\
    \ < t->key) {\n        insertNode(t->left, key);\n    } else {\n        insertNode(t->right,\
    \ key);\n    }\n}\n```"
  merge: -1
  img_proc: true
