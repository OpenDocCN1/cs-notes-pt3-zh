  md: '# 4、二叉树遍历的迭代器类


    遍历二叉树：


    中序的程序实现：注意当标志变为 2 即可访问，而后序要等到 标志变为 3 才可。因此，可以利用这一点，使中序遍历的程序得到简化。


    +   1、节点（初始时是根节点）进栈，沿左指针查找左孩子。

    +   2、若有左孩子，返回第一步。

    +   3、若无左孩子，判栈空？空则结束。非空，栈顶节点出栈访问。转向右子树，返回1。


