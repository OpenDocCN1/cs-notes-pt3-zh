- pgno: 132
  md: '# C++11 Smart Pointers


    +   - C++11 deprecates an older smart pointer template

    +     - **auto_ptr** : can guard dynamically allocated memory and pass ownership
    around, but doesn’t work with the STL containers and has other limitations

    +   - C++11 provides 3 new smart pointer templates instead

    +     - **shared_ptr** : a general purpose reference counted guard for dynamic
    memory (we’ll mostly use this one in this course)

    +     - **weak_ptr** : gives access to a resource that is guarded by a shared_ptr
    without increasing reference count (can be used to prevent memory leaks due to
    circular references)

    +     - **unique_ptr** : a more complex but potentially very efficient way to
    transfer ownership of dynamic memory safely (implements C++11 “move semantics”)'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Resource Acquisition Is Initialization (RAII)


    +   - Also referred to as the “Guard Idiom”

    +     - However, the term “RAII” is more widely used in C++

    +   - Relies on the fact that in C++ a stack object’s destructor is called when
    stack frame pops

    +   - Idea: we can use a stack object to hold the ownership of a heap object,
    or any other resource that requires explicit clean up

    +     - Initialize stack object when the resource is allocated

    +     - De-allocate resource in the stack object’s destructor'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# RAII Example: Guarding Newly Allocated Object\n\n```\nshared_ptr<Foo> createAndInit()\
    \ {\n  Foo *f = new Foo;\n  shared_ptr<Foo> p(f);\n  init(f); // may throw exception\n\
    \  return p;\n}\n\nint run () {\n  try {\n    shared_ptr<Foo> spf =\n        createAndInit();\n\
    \    cout << “*spf is ” << *spf;\n  } catch (...) {\n    return -1\n  }\n  return\
    \ 0;\n}\n```\n\n+   - RAII idiom example via **shared_ptr** class template\n+\
    \     - `#include <memory>`\n+     - `using namespace std;`\n+   - **shared_ptr<X>**\
    \ assumes and maintains ownership of aliased **X**\n+   - Can access the aliased\
    \ **X** through it (`*spf`)\n+   - **shared_ptr** destructor calls `delete` on\
    \ the pointer to the owned **X** when it’s safe to do so (per reference counting\
    \ idiom discussed next)\n+   - Combines well with other memory idioms"
  merge: -1
