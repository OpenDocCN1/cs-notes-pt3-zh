- pgno: 318
  md: '# Bucket Sort


    +   - **Bucket sort**

    +     - Assumption: the keys are in the range [0, N)

    +     - Basic idea:

    +       1. Create N linked lists (buckets) to divide interval [0,N) into subintervals
    of size 1

    +       2. Add each input element to appropriate bucket

    +       3. Concatenate the buckets

    +     - Expected total time is O(n + N), with n = size of original sequence

    +       - if N is O(n) → sorting algorithm in O(n) !'
  merge: -1
