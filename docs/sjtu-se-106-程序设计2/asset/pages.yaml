  md: '# Assignment and Copy Constructors


    +   - There is one remaining issue about creating new abstract classes that is
    extremely important in practice, which is how such objects behave if you copy
    them using assignment or by passing them by value to parameters in methods.

    +   - The current version of the text does not discuss these issues, although
    the new text does. Given how often these concepts come up in C++ class design,
    it seems appropriate to cover them here.

    +   - The crux of the problem is that copying an abstract data object typically
    needs to copy the underlying data and not just the fields directly accessible
    in the object. Unfortunately, the default interpretation in C++ is to copy only
    the top-level fields, which can lead to serious errors.'
