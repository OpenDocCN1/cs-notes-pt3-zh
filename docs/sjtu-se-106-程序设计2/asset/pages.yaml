- pgno: 709
  md: '# Dijkstra’s Algorithm


    +   - One of the most useful algorithms for computing the shortest paths in a
    graph was developed by Edsger W. Dijkstra in 1959.

    +   - The strategy is similar to the breadth-first search algorithm you used to
    implement the word-ladder program in Assignment. The major difference are:

    +     - The queue used to hold the paths delivers items in increasing order of
    total cost rather than in the traditional first-in/first-out order. Such queues
    are called *priority queues*.

    +     - The algorithm keeps track of all nodes to which the total distance has
    already been fixed. Distances are fixed whenever you dequeue a path from the priority
    queue.'
