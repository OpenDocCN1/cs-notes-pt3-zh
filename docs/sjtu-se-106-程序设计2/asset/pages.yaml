  md: "# Converting Tail Recursive to Iterative\n\n```\nint fib_aux (int n , int next,\
    \ int result)\n{\n    if (n == 0) return result;\n    return fib_aux(n - 1, next\
    \ + result,next);\n}\n```\n\n```\nF(x) {\n    if (P(x)) return G(x);\n    return\
    \ F(H(x));\n}\n```\n\nthe function F is fib_aux\n\nx is composed of the three\
    \ parameters, n, next, and result\n\nthe value of P(n, next, result) is the value\
    \ of (n == 0)\n\nthe value of G(n, next, result) is result\n\nthe value of H(n,\
    \ next, result) is (n -1, next+result, next)\n\n```\nint fib_iter(int n)\n{\n\
    \    int temp_next, temp_result;\n    int next = 1, result = 0;\n    while (n\
    \ != 1) {\n        temp_next = next;\n        temp_result = result;\n        n--;\n\
    \        result = temp_next;\n        next = temp_next + temp_result;\n    }\n\
    \    return result;\n}\n```\n\n```\nF(x)\n{\n    int temp_x = x;\n    while (P(x)\
    \ is not true)\n    {\n        temp_x = x;\n        x = H(temp_x);\n    }\n  \
    \  return G(x);\n}\n```"
