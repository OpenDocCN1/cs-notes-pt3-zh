  md: '# 7、树和森林


    # 1、树的存储结构


    +   - 标准形式：树中的每个结点除有数据场之外，还有 K 个指针场；其中 K 为树的度数。


    | 数据场 | 第一个孩子结点的地址 | 第二个孩子结点的地址 | 第 K 个孩子结点的地址 | 父亲结点的地址 |

    |---|---|---|---|---|


