  md: "# Searching in a Branching Structure\n\n+   - The recursive structure for finding\
    \ the solution path in a maze comes up in a wide variety of applications, characterized\
    \ by the need to explore a range of possibilities at each of a series of choice\
    \ points.\n+   \n+   - The primary advantage of using recursion in these problems\
    \ is that doing so dramatically simplifies the bookkeeping. Each level of the\
    \ recursive algorithm considers one choice point. The historical knowledge of\
    \ what choices have already been tested and which ones remain for further exploration\
    \ is maintained automatically in the execution stack.\n+   \n+   - Many such applications\
    \ are like the maze-solving algorithm in which the process *searches* a branching\
    \ structure to find a particular solution. Others, however, use the same basic\
    \ strategy to explore *every* path in a branching structure in some systematic\
    \ way."
