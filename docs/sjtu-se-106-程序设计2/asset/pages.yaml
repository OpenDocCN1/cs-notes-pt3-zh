- pgno: 712
  md: '# Kruskal’s Algorithm


    +   - In many cases, finding the shortest path is not as important as as minimizing
    the cost of a network as a whole. A set of arcs that connects every node in a
    graph at the smallest possible cost is called a *minimum spanning tree*.

    +   - The following algorithm for finding a minimum spanning tree was developed
    by Joseph Kruskal in 1956:

    +     - Start with a new empty graph with the same nodes as the original one but
    an empty set of arcs.

    +     - Sort all the arcs in the graph in order of increasing cost.

    +     - Go through the arcs in order and add each one to the new graph if the
    endpoints of that arc are not already connected by a path.

    +   - This process can be made more efficient by maintaining sets of nodes in
    the new graph, as described on the next slide.'
  merge: -1
  img_proc: true
- pgno: 713
  md: "# Combining Sets in Kruskal’s Algorithm\n\n+   - Implementing the Pathfinder\
    \ version of Kruskal’s algorithm requires you need to build a new graph containing\
    \ the spanning tree. As you do, you will generate sets of disconnected graphs.\n\
    +   \n+   - When you choose a new arc, there are four possibilities for the sets\
    \ formed by the nodes at the endpoints:\n+     1. *Neither node is yet in a set.*\
    \ In this case, create a new set and add both nodes to it.\n+     2. *One node\
    \ is in a set and the other isn’t.* In this case, add the new node to the same\
    \ set.\n+     3. *The endpoints are in different existing sets.* In this case,\
    \ you need to merge the two sets to create a new one containing the union of the\
    \ existing ones.\n+     4. *The endpoints are in the same set.* In this case,\
    \ there is already a path between these two nodes, so you don’t need this arc."
  merge: -1
  img_proc: true
