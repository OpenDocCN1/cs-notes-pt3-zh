- pgno: 743
  md: '# Solutions:


    +   - **Double word compare and set.**

    +     - One 32 bit word for the address

    +     - One 32 bit word for the update count which is incremented every time a
    node is updated

    +     - Compare and Set iff both of the above match

    +     - Java provides **AtomicStampedReference**

    +   - **Use the lower address bits of the pointer (if the memory is 4/8 byte Aligned)
    to keep a counter to update**

    +     - But the probability of a false positive is still greater than doubleword
    compareandset because instead of 2^32 choices for the counter you have 2^2 or
    2^3 choices for the counter'
