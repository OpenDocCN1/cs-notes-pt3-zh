- pgno: 364
  md: '# An Illustrative Mapping Application


    +   - Suppose that you want to write a program that displays the name of a state
    given its two-letter postal abbreviation.

    +   - This program is an ideal application for the Map class because what you
    need is a map between two-letter codes and state names. Each two-letter code uniquely
    identifies a particular state and therefore serves as a key for a Map; the state
    names are the corresponding values.

    +   - To implement this program in C++, you need to perform the following steps,
    which are illustrated on the following slide:

    +     1. Create a Map<string, string> containing the key/value pairs.

    +     2. Read in the two-letter abbreviation to translate.

    +     3. Call get on the Map to find the state name.

    +     4. Print out the name of the state.'
  merge: -1
  img_proc: true
- pgno: 365
  md: "# The PostalLookup Program\n\n```\nint main() {\n    Map<string,string> stateMap;\n\
    \    initStateMap(stateMap);\n    while (true) {\n        cout << \"Enter two-letter\
    \ state abbreviation: \";\n        string code = getLine();\n        if (code\
    \ == \"\") break;\n        if (stateMap.containsKey(code)) {\n            cout\
    \ << code << \" = \" << stateMap.get(code) << endl;\n        } else {\n      \
    \      cout << code << \" = ???\" << endl;\n        }\n    }\n}\n```\n\nPostalLookup\n\
    Enter two-letter state abbreviation: HI\nHI = Hawaii\nEnter two-letter state abbreviation:\
    \ WI\nWI = Wisconsin\nEnter two-letter state abbreviation: VE\nVE = ???\nEnter\
    \ two-letter state abbreviation:\n\n+   AL=Alabama\n+   AK=Alaska\n+   AZ=Arizona\n\
    +   ...\n+   FL=Florida\n+   GA=Georgia\n+   HI=Hawaii\n+   ...\n+   WI=Wisconsin\n\
    +   WY=Wyoming"
  merge: -1
