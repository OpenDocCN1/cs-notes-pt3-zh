  md: "# Depth-First Search\n\n+   - The traversal strategy of *depth-first search*\
    \ (or *DFS* for short) recursively processes the graph, following each branch,\
    \ visiting nodes as it goes, until every node is visited.\n+   - The depth-first\
    \ search algorithm requires some structure to keep track of nodes that have already\
    \ been visited. Common strategies are to include a `visited` flag in each node\
    \ or to pass a set of visited nodes, as shown in the following code:\n\n```\n\
    void depthFirstSearch(Node *start) {\n    Set<Node *> visited;\n    visitUsingDFS(start,\
    \ visited);\n}\n\nvoid visitUsingDFS(Node *start, Set<Node *> & visited) {\n \
    \   if (visited.contains(start)) return;\n    visit(start);\n    visited.add(start);\n\
