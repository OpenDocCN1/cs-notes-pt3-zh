- pgno: 748
  md: '# Read-Copy Update


    +   - *Read-copy update (RCU):* another synchronization technique designed to
    protect data structures that are mostly accessed for reading by several CPUs

    +     - RCU allows many readers and many writers to proceed concurrently

    +     - RCU is lock-free

    +   - Key ideas

    +     - Only data structures that are **dynamically** allocated and referenced
    via pointers can be protected by RCU

    +     - No kernel control path can sleep inside a critical section protected by
    RCU'
