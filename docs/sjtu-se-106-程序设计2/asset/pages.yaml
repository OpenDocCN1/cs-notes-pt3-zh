  md: '# 6、最优二叉树及其应用


    # 2、赫夫曼编码


    +   - 赫夫曼算法用于通信中的字符的编码。将权值当着使用概率。赫夫曼树的左分支 标记为 1，而右分支标记为0；这从根到每一个叶子节点（字符）的路径上标记的字符组成的字符
    串，即为该字符的赫夫曼编码。


    e.g: 权值（此处为使用概率）分别为 {2, 7, 4, 5} 的节点集合 F= { C, A, S, T } 已知。请利用赫夫曼算法产生最优二叉树。


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_607_0.png)


    # 赫夫曼编码：


    +   A: 0

    +   T: 10

    +   C: 110

    +   S: 111


    # 赫夫曼编码优点：


    +   占用二进制位数少

    +   e.g: 左图发送长度为 n 的字符串，等长表示需 2n 个比特。因共有四个字符，表示每个字符需二个比特。

    +   采用赫夫曼编码后，总的比特数 35n/18，因：

    +   A: 1*7n/18

    +   T: 2*5n/18

    +   S: 3*4n/18

    +   C: 3*2n/18'
