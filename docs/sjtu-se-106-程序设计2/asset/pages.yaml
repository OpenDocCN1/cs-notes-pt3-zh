- pgno: 87
  md: "# Code to Implement Deep Copying\n\n```\n/* Code to support deep copying for\
    \ the Vector class */\n\ntemplate <typename ElemType>\nconst Vector<ElemType>\
    \ & Vector<ElemType>::operator=(const Vector & rhs) {\n    if (this != &rhs) {\n\
    \        clear();\n        copyInternalData(rhs);\n    }\n    return *this;\n\
    }\n\ntemplate <typename ElemType>\nVector<ElemType>::Vector(const Vector & rhs)\
    \ {\n    copyInternalData(rhs);\n}\n\ntemplate <typename ElemType>\nvoid Vector<ElemType>::copyInternalData(const\
    \ Vector & other) {\n    elements = new ElemType[other.count];\n    for (int i\
    \ = 0; i < other.count; i++) {\n        elements[i] = other.elements[i];\n   \
    \ }\n    count = other.count;\n    capacity = other.count;\n}\n```"
