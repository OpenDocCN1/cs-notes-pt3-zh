- pgno: 531
  md: '# Tree-Balancing Algorithms


    The AVL algorithm was the first tree-balancing strategy and has been superseded
    by newer algorithms that are more effective in practice. These algorithms include:


    +   - Red-black trees

    +   - 2-3 trees

    +   - AA trees

    +   - Fibonacci trees

    +   - Splay trees


    In this course, the important thing to know is that it is possible to keep a binary
    tree balanced as you insert nodes, thereby ensuring that lookup operations run
    in O(log N) time. If you get really excited about this kind of algorithm, you’ll
    have the opportunity to study them in more detail in the later course.'
  merge: -1
