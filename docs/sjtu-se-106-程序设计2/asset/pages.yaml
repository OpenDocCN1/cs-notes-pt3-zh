  md: "# The Selection Sort Algorithm\n\n+   - Of the many sorting algorithms, the\
    \ easiest one to describe is *selection sort*, which appears in the text like\
    \ this:\n\n```\nvoid sort(Vector<int> & vec) {\n    int n = vec.size();\n    for\
    \ (int lh = 0; lh < n; lh++) {\n        int rh = lh;\n        for (int i = lh\
    \ + 1; i < n; i++) {\n            if (vec[i] < vec[rh]) rh = i;\n        }\n \
    \       int temp = vec[lh];\n        vec[lh] = vec[rh];\n        vec[rh] = temp;\n\
    \    }\n}\n```\n\n+   - Coding this algorithm as a single function makes sense\
    \ for efficiency but complicates the analysis. The next two slides decompose selection\
    \ sort into a set of functions that make the operation easier to follow."
  merge: -1
  img_proc: true
- pgno: 283
  md: "# Decomposition of the sort Function\n\n```\n/*\n * Function: sort\n * -------------\n\
    \ * Sorts a Vector<int> into increasing order.  This implementation\n * uses an\
    \ algorithm called selection sort, which can be described\n * in English as follows.\
    \  With your left hand (lh), point at each\n * element in the vector in turn,\
    \ starting at index 0.  At each\n * step in the cycle:\n *\n * 1. Find the smallest\
    \ element in the range between your left\n *    hand and the end of the vector,\
    \ and point at that element\n *    with your right hand (rh).\n *\n * 2. Move\
    \ that element into its correct position by swapping\n *    the elements indicated\
    \ by your left and right hands.\n */\n\nvoid sort(Vector<int> & vec) {\n    for\
    \ ( int lh = 0 ; lh < vec.size() ; lh++ ) {\n        int rh = findSmallest(vec,\
    \ lh, vec.size() - 1);\n        swap(vec[lh], vec[rh]);\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Decomposition of the sort Function\n\n```\n/*\n * Function: findSmallest\n\
    \ * ----------------------\n * Returns the index of the smallest value in the\
    \ vector between\n * index positions p1 and p2, inclusive.\n */\nint findSmallest(Vector<int>\
    \ & vec, int p1, int p2) {\n    int smallestIndex = p1;\n    for ( int i = p1\
    \ + 1 ; i <= p2 ; i++ ) {\n        if (vec[i] < vec[smallestIndex]) smallestIndex\
    \ = i;\n    }\n    return smallestIndex;\n}\n\n/*\n * Function: swap\n * -------------\n\
    \ * Exchanges two integer values passed by reference.\n */\nvoid swap(int & x,\
    \ int & y) {\n    int temp = x;\n    x = y;\n    y = temp;\n}\n```"
  merge: -1
  img_proc: true
