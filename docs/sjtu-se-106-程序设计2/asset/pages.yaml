- pgno: 309
  md: '# Quick-Sort


    +   Another divide-and-conquer sorting algorihm


    +   Idea:


    +   1) **Divide** : If the sequence S has 2 or more elements, select an element
    x from S to be your **pivot** (e.g., the last), and divide them into 3 sequences:

    +   L, holds S’s elements less than x

    +   E, holds S’s elements equal to x

    +   G, holds S’s elements greater than x


    +   2) **Recurse**: Recursively sort L and G


    +   3) **Conquer**: Finally, to put elements back into S in order, first inserts
    the elements of L, then those of E, and those of G.'
  merge: -1
  img_proc: true
