  md: '# Good Moves and Bad Positions


    +   - The essential insight behind the Nim program is bound up in the following
    mutually recursive definitions:

    +     - A *good move* is one that leaves your opponent in a bad position.

    +     - A *bad position* is one that offers no good moves.

    +   - The implementation of the Nim game is really nothing more than a translation
    of these definitions into code.'
