  md: "# Lifting example (concerte algorithms)\n\n```\ndouble sum(double array[],\
    \ int n)    // one concrete algorithm (doubles in array)\n{\n    double s = 0;\n\
    \    for (int i = 0; i < n; ++i) s = s + array[i];\n    return s;\n}\n```\n\n\
    ```\nstruct Node { Node* next; int data; };\n```\n\n```\nint sum(Node* first)\
    \    // another concrete algorithm (ints in list)\n{\n    int s = 0;\n    while\
    \ (first) {\n        s += first->data;\n        first = first->next;\n    }\n\
    \    return s;\n}\n```"
