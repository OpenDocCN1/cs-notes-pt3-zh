- pgno: 537
  md: '# 平衡二叉排序树（AVL树）


    +   - 平衡二叉排序树

    +   - 平衡树的 Adelson 算法的本质特点：

    +   - 以插入为例：


    在左图所示的平衡树中插入数据场为 2 的结点。

    插入之后仍应保持平衡分类二叉树的性质不变。


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_537_0.png)


    如何用最简单、最有效的办法保持平衡分类二叉树的性质不变？


    解决方案：


    +   - 不涉及到危机结点的父亲结点，即以危机结点为根的子树的高度应保持不变（左图为 3）。

    +   - 新结点插入后，找到第一个平衡度不为 0 的结点（如左图结点 9）即可。新插入的结点和第一个平衡度不为 0 的结点（也可能是危机结点）之间的结点，其平衡度皆为
    0

    +   - 在调整中，仅调整那些在平衡度变化的路径上的结点（如：3 5 9），其它结点不予调整。

    +   - 仍应保持分类二叉树的性质不变。'
  merge: -1
  img_proc: true
