  md: '# C++ Memory Management Idioms


    +   - Idioms are reusable design techniques in a language

    +     - We’ll look at 4 important ones in C++


    +   - Copy constructor trick for assignment

    +     - Ensures release of existing resource and acquisition of the new resource
    both succeed or fail together


    +   - RAII (a.k.a. Guard)

    +     - ties dynamic resources to other (esp. automatic) scopes


    +   - Reference counting

    +     - ties dynamic lifetime to a group of references


    +   - Copy-on-write

    +     - allows more efficient management of multiple aliasing'
