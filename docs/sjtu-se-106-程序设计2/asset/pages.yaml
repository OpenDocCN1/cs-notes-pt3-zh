- pgno: 619
  md: '# 时间复杂性的分析：


    +   - 时间耗费的代价：建堆的时间耗费 + 排序的时间耗费

    +   - 建堆的时间耗费：设树根处于第1层，该堆共有 h 层。建堆从第 h-1 层开始进行。只要知道了每一层的结点数（建的小堆的个数），和建每一个小堆所需的比较次数，就以求得建堆的时间耗费。

    +   - 建的小堆的性质：第 i 层上小堆的个数 = 第 i 层上结点的个数 = 最多 2^(i-1)

    +     第 i 层上小堆的高度 = h-i+1

    +     建第 i 层上每个小堆最多所需的比较次数 = 2 × (h-i) 次

    +   - 建堆的时间耗费：


    T(n) <= Σ (i=h-1 to 1) 2^(i-1) × (h-i) × 2 = Σ (i=h-1 to 1) 2^(i-1) × (h-i) =
    Σ (j=1 to h-1) 2^(h-j) × j = 2^h Σ (j=1 to h-1) j/2^j


    注意：即使是高度为 h 的完全的二叉树，满足以下式子：


    2^(h-1) <= n <= 2^h -1 故：2^h <= 2n


    又： Σ (j=1 to ∞) j/2^j < 2


    所以：建堆的时间复杂性为 4n=O(n) 级'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# 时间复杂性的分析：


    +   - 时间复杂性的分析：建堆的时间耗费 + 排序的时间耗费

    +   - 排序的时间耗费：


    | 节点个数 | 高度 | 比较次数最多 |

    |---|---|---|

    | j=2 | ⌊log2⌋ + 1 | <= 2×⌊log2⌋ |

    | j=3 | ⌊log3⌋ + 1 | <= 2×⌊log3⌋ |

    | j=4 | ⌊log4⌋ + 1 | <= 2×⌊log4⌋ |

    | ... | ... | ... |

    | j=n | ⌊logn⌋ + 1 | <= 2×⌊logn⌋ |


    所以： T(n) <= 2( log2 + log3 + ...... + logn ) = 2log(n!)


    T(n) = O ( nlogn )'
  merge: -1
  img_proc: true
