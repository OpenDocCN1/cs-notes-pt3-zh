    +   2、p无右子树，如p是父结点的左儿子，则q=该父结点。


    +   3、p无右子树，如p是父结点的右儿子 则以p的父结点为根的子树访问完毕。如该子树为其祖先结点的左子树，那么q=其根。否则，继续寻找，找不到结束。'
