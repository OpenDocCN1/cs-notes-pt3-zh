- pgno: 125
  md: '# Benefits of Smart Pointers


    Automated initialisation removes the need for setting the smart pointer to NULL,
    which therefore removes the need for that code to be written, which is similar
    to the benefits of automatic clean up in a way.


    The automatic clean up feature means that smart pointers automatically clean up,
    reduces the amount of code needed to be written, and in turn reducing the possibility
    of bugs.'
