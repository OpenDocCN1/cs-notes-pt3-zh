- pgno: 601
  md: "# 5、中序穿线树\n\n```\ntemplate <class Type>\nIstream & operator >> (istream & in,\
    \ InorderThreadTree<Type> & x) {\nint size, j, k = 2;Type ele;\ncout << \"Enter\
    \ size of your InorderThreadTree array! \" << endl;\nin >> size; if (size > x.MaxSize\
    \ ) { cout << \"Error: out of spaces!\"; return in; }\ncout << \" Enter data of\
    \ every element one by one!\" << endl;\nin >> ele;\nif (ele == x.flag) { cout\
    \ << \"Input data end!\" << endl; return in; }\nx.arr[1].setdata (ele); x.root\
    \ = 1; // 根节点单独生成。\nwhile ( in >> ele, ele != x.flag) {\n    j = x.root; x.arr[k].setdata\
    \ (ele);\n    while(1) { if ( x.arr[k].data < x.arr[j].data )\n        if ( x.arr[j].left\
    \ > 0) j = x.arr[j].left;\n        else { x.arr[k].left = x.arr[j].left; x.arr[k].right\
    \ = -j;\n            x.arr[j].left = k; break;\n        } // 新节点 k 插入后为结点 j 的左孩子，是叶子。\n\
    \    else\n        if ( x.arr[j].right > 0) j = x.arr[j].right;\n        else\
    \ { x.arr[k].right = x.arr[j].right; x.arr[k].left = -j;\n            x.arr[j].right\
    \ = k; break;\n        } // 新节点 k 插入后为结点 j 的右孩子，是叶子。\n    }\n    k++;\n}\nreturn\
    \ in;\n}\n```"
