  md: '# 5、中序穿线树


    +   - 中序穿线树

    +   - 为什么采用中序穿线树：二叉树中的空指针场多达 n + 1 个。

    +   - 简单证明：设二叉树中结点的总数为 n，度为 2 的结点总数为 n2。空指针场用 方框代表。增加了方框结点的二叉树称之为扩展二叉树。在该二叉树之中，原来的
    n 个结点全部成为度为 2 的结点，方框结点成为叶子。根据二叉树的性质 3，原命题得证。


    e.g.: n = 8 的二叉树


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_594_0.png)


    怎样利用这 n + 1 个空指针场？

    - 中序穿线树

    - 后序穿线树'
