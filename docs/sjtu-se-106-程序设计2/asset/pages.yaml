  md: '# The Problem of Finding the Middle


    +   - When we worked with the editor buffer, we solved the insertion problem by
    using a linked list instead of an array.

    +   - Unfortunately, turning a sorted array into a linked list makes it impossible
    to apply binary search because there is no way to find the middle element.

    +   - But what if you could point to the middle element in a linked list? That
    idea seems unlikely, but it is the key to finding a data structure that offers
    O(log N) performance for both the lookup and add operations.'
