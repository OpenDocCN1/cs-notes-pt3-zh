  md: '# Managing resources


    +   - So when should we declare those special member functions explicitly?

    +     - When our class *manages a resource*, that is, when an object of the class
    is *responsible* for that resource.

    +     - That usually means the resource is *acquired* in the constructor (or passed
    into the constructor) and *released* in the destructor.'
  merge: -1
  img_proc: true
- pgno: 6
  md: "# Pre-standard C++\n\n```\nclass person\n{\n    char* name;\n    int age;\n\
    public:\n\n    // the constructor acquires a resource:\n    // in this case, dynamic\
    \ memory obtained via new[]\n    person(const char* the_name, int the_age)\n \
    \   {\n        name = new char[strlen(the_name) + 1];\n        strcpy(name, the_name);\n\
    \        age = the_age;\n    }\n    // the destructor must release this resource\
    \ via delete[]\n    ~person()\n    {\n        delete[] name;\n    }\n};\n```"
