- pgno: 244
  md: "# Coding the Nim Strategy\n\n```\n/*\n * Looks for a winning move, given the\
    \ specified number of coins.\n * If there is a winning move in that position,\
    \ findGoodMove returns\n * that value; if not, the method returns the constant\
    \ NO_GOOD_MOVE.\n * This implementation depends on the recursive insight that\
    \ a good move\n * is one that leaves your opponent in a bad position and a bad\
    \ position\n * is one that offers no good moves.\n */\n\nint findGoodMove(int\
    \ nCoins) {\n    int limit = (nCoins < MAX_MOVE) ? nCoins : MAX_MOVE;\n    for\
    \ (int nTaken = 1; nTaken <= limit; nTaken++) {\n        if (isBadPosition(nCoins\
    \ - nTaken)) return nTaken;\n    }\n    return NO_GOOD_MOVE;\n}\n\n/*\n * Returns\
    \ true if nCoins is a bad position.  Being left with a single\n * coin is clearly\
    \ a bad position and represents the simple case.\n */\n\nbool isBadPosition(int\
    \ nCoins) {\n    if (nCoins == 1) return true;\n    return findGoodMove(nCoins)\
    \ == NO_GOOD_MOVE;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 245
  md: '# The Minimax Algorithm


    +   - Games like Nim are simple enough that it is possible to solve them completely
    in a relatively small amount of time.

    +   - For more complex games, it is necessary to cut off the analysis at some
    point and then evaluate the position, presumably using some function that looks
    at a position and returns a *rating* for that position. Positive ratings are good
    for the player to move; negative ones are bad.

    +   - When your game player searches the tree for best move, it can’t simply choose
    the one with the highest rating because you control only half the play.

    +   - What you want instead is to choose the move that minimizes the maximum rating
    available to your opponent. This strategy is called the *minimax* algorithm.'
  merge: -1
  img_proc: true
