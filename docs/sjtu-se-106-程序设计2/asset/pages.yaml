- pgno: 370
  md: '# The Idea of Hashing


    +   - The third strategy on the preceding slide shows that one can make the `get`
    and `put` operations run very quickly, even to the point that the cost of finding
    a key is independent of the number of keys in the table. This $O(1)$ performance
    is possible only if you know where to look for a particular key.

    +   - To get a sense of how you might achieve this goal in practice, it helps
    to think about how you find a word in a dictionary. Most dictionaries have thumb
    tabs that indicate where each letter appear. Words starting with $A$ are in the
    $A$ section, and so on.

    +   - The most common implementations of maps use a strategy called *hashing*,
    which is conceptually similar to the thumb tabs in a dictionary. The critical
    idea is that you can improve performance enormously if you use the key to figure
    out where to look.'
