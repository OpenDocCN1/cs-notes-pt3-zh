- pgno: 372
  md: "# The hashCode Function for Strings\n\n```\nconst int HASH_SEED = 5381;   \
    \   /* Starting point for first cycle    */\nconst int HASH_MULTIPLIER = 33; \
    \ /* Multiplier for each cycle          */\nconst int HASH_MASK = unsigned(-1)\
    \ >> 1; /* All bits except the sign */\n\n/*\n * Function: hashCode\n * Usage:\
    \ int code = hashCode(key);\n * --------------------------------\n * This function\
    \ takes a string key and uses it to derive a hash code,\n * which is nonnegative\
    \ integer related to the key by a deterministic\n * function that distributes\
    \ keys well across the space of integers.\n * The general method is called linear\
    \ congruence, which is also used\n * in random-number generators.  The specific\
    \ algorithm used here is\n * called djb2 after the initials of its inventor, Daniel\
    \ J. Bernstein,\n * Professor of Mathematics at the University of Illinois at\
    \ Chicago.\n */\n\nint hashCode(string str) {\n    unsigned hash = HASH_SEED;\n\
    \    int nchars = str.length();\n    for (int i = 0; i < nchars; i++) {\n    \
    \    hash = HASH_MULTIPLIER * hash + str[i];\n    }\n    return (hash & HASH_MASK);\n\
    }\n```"
