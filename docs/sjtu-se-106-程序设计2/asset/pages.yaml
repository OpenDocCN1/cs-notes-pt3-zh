- pgno: 302
  md: '# Standard Complexity Classes


    +   - The complexity of a particular algorithm tends to fall into one of a small
    number of standard complexity classes:


    | constant | O(1) | Finding first element in a vector |

    | logarithmic | O(log N) | Binary search in a sorted vector |

    | linear | O(N) | Summing a vector; linear search |

    | N log N | O(N log N) | Merge sort |

    | quadratic | O(N²) | Selection sort |

    | cubic | O(N³) | Obvious algorithms for matrix multiplication |

    | exponential | O(2^N) | Tower of Hanoi solution |


    +   - In general, theoretical computer scientists regard any problem whose complexity
    cannot be expressed as a polynomial as *intractable*.'
  merge: -1
  img_proc: true
