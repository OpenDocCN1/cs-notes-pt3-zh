- pgno: 375
  md: '# Achieving O(1) Performance


    +   - The simulation on the previous side uses only seven buckets to emphasize
    what happens when collisions occur: the smaller the number of buckets, the more
    likely collisions become.

    +   - In practice, the implementation of `HashMap` uses a much larger value for
    `nBuckets` to minimize the opportunity for collisions. If the number of buckets
    is considerably larger than the number of keys, most of the bucket chains will
    either be empty or contain exactly one key/value pair.

    +   - The ratio of the number of keys to the number of buckets is called the *load
    factor* of the map. Because a map achieves O(1) performance only if the load factor
    is small, the library implementation of `HashMap` increases the number of buckets
    when the table becomes too full. This process is called *rehashing*.'
