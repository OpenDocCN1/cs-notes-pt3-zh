- pgno: 371
  md: '# Hash Codes


    +   - The rest of today’s lecture focuses on the implementation of the `HashMap`
    class in the Stanford libraries, which uses the hashing strategy.

    +   - The `HashMap` class requires the existence of a free function called `hashCode`
    that transforms a key into a nonnegative integer. The hash code tells the implementation
    where it should look for a particular key, thereby reducing the search time dramatically.

    +   - For today, I’ll focus on the case when the keys are strings. The important
    things to remember about hash codes are:

    +     1. Every string has a hash code, even if you don’t know what it is.

    +     2. The hash code for any particular string is always the same.

    +     3. If two strings are equal (*i.e.*, they contain the same characters),
    they have the same hash code.'
