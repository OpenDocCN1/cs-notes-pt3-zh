    | 100,000 | 10,000,000,000 | 1,660,964 |

    | 1,000,000 | 1,000,000,000,000 | 19,931,569 |


    +   - Based on these numbers, the theoretical advantage of using merge sort over
    selection sort on a vector of 1,000,000 values would be a factor of more than
    50,000.'
