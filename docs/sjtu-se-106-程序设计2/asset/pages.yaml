- pgno: 499
  md: '# Limitations of Hash Tables


    +   - The hash table strategy we introduced ago is by far the most common implementation
    of maps in practice.

    +   - Despite its many advantages—most notably its extraordinary efficiency—the
    hash table implementation is not necessarily the best strategy for all applications.

    +   - The hash table strategy has the following limitations:

    +     - Hash tables depend on being able to compute a hash function on some key.
    Expanding the hash-function idea so that it applies to types other than strings
    can be subtle.

    +     - Using `foreach` on hash tables does not deliver the keys in any sensible
    order. Even when the keys have a natural order (such as the character-code order
    used with strings), the hash table implementation of `foreach` cannot take advantage
    of that fact.'
  merge: -1
  img_proc: true
