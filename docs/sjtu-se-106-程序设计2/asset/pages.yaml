- pgno: 123
  md: "# An Example of Smart Pointers\n\nFor auto_ptr, this is solved by setting its\
    \ pointer to NULL when it is copied:\n\n```\ntemplate <class T>\nauto_ptr<T>&\
    \ auto_ptr<T>::operator=(auto_ptr<T>& rhs)\n{\n    if (this != &rhs)\n    {\n\
    \        delete ptr;\n        ptr = rhs.ptr;\n        rhs.ptr = NULL;\n    }\n\
    \    return *this;\n}\n```"
