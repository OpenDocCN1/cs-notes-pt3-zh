    \ slide uses a new feature of C++ called *return by reference*, which indicates\
    \ that the return value is shared with the caller rather than copied.\n+   - The\
    \ syntax for return by reference is similar to that used for call by reference\
    \ and involves adding an & token between the return type and the method name,\
    \ as in the prototype\n+   \n+   ```\n+   ElemType & Vector<ElemType>::operator[]\
    \ (int index);\n+   ```\n+   - Returning a value by reference means that the result\
    \ into an *lvalue*, which is an expression that can be used on the left side of\
    \ an assignment. This interpretation makes it possible to assign new values to\
