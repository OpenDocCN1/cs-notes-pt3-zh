  md: "# 5、中序穿线树\n\n中序穿线树遍历的实现算法。\n\n```\ntemplate <class Type>\nint InorderThreadTree<Type>\
    \ :: First ( ) {\ncurrent = root; if ( !current ) return current;//为0是中序穿线二叉树空的标志。\n\
    while( arr[current].left >0 ) current = arr[current].left;\nreturn current; //\
    \ 在中序次序下第一个被访问的结点的下标地址。\n}\n```\n\n```\ntemplate <class Type>\nint InorderThreadTree<Type>\
    \ :: Next ( ) {\naftcurrent = arr[current].right;\nif ( aftcurrent <= 0 ) { current\
    \ = - aftcurrent; return current; }\n// 为0是中序遍历结束的标志，否则是中序次序下的下一个结点的地址。\nwhile(\
    \ arr[aftcurrent].left > 0 ) aftcurrent = arr[aftcurrent].left;\ncurrent = aftcurrent;\
    \ return current; //在中序次序下的下一个被访问的结点的地址。\n}\n```\n\n```\ntemplate <class Type>\n\
    void InorderThreadTree<Type> :: Inorder ( ) { \nint p = First();\nwhile( p !=\
    \ 0 ) { cout << arr[p].data << endl; p = Next(); } return;\n}\n```\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_599_0.png)"
