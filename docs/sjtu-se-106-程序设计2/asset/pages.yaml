- pgno: 419
  md: '# Some Details about Finding Collisions in SHA-1


    Q: *How hard would it be to find collisions in SHA-1?*


    A: The reported attacks require an estimated work factor of 2^69 (approximately
    590 billion billion) hash computations. While this is well beyond what is currently
    feasible using a normal computer, this is potentially feasible for attackers who
    have specialized hardware. For example, with 10,000 custom ASICs that can each
    perform 2 billion hash operations per second, the attack would take about one
    year. Computing improvements predicted by Moore ''s Law will make the attack more
    practical over time, e.g. making it possible for a wide-spread Internet virus
    to use compromised computers to mount such attacks as well. Once a collision has
    been found, additional collisions can be found trivially by concatenating data
    to the matching messages.'
