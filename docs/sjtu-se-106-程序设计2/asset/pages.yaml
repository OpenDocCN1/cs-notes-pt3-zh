  md: "# The parser.cpp Implementation\n\n```\n/*\n * Function: precedence\n * Usage:\
    \ prec = precedence(token);\n * --------------------------------\n * This function\
    \ returns the precedence of the specified operator\n * token.  If the token is\
    \ not an operator, precedence returns 0.\n */\n\nint precedence(string token)\
    \ {\n    if (token == \"=\") return 1;\n    if (token == \"+\" || token == \"\
    -\") return 2;\n    if (token == \"*\" || token == \"/\") return 3;\n    return\
    \ 0;\n}\n```"
