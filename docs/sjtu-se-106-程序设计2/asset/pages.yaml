  md: "# Lifting example (abstract the data structure)\n\n// pseudo-code for a more\
    \ general version of both algorithms\n\n```\nint sum(data)      // somehow parameterize\
    \ with the data structure\n{\n    int s = 0;               // initialize\n   \
    \ while (not at end) {     // loop through all elements\n        s = s + get value;\
    \   // compute sum\n        get next data element;\n    }\n    return s;     \
    \           // return result\n}\n```\n\n+   We need three operations (on the data\
    \ structure):\n+   - not at end\n+   - get value\n+   - get next data element"
