  md: '# Hash Function – Strings of Characters


    +   - Folding Method:

    +     ```

    +     int h(String x, int D) {

    +     int i, sum;

    +     for (sum=0, i=0; i<x.length(); i++)

    +         sum+= (int)x.charAt(i);

    +     return (sum%D);

    +     }

    +     ```

    +     - Sums the ASCII values of the letters in the string

