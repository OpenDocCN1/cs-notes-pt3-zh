- pgno: 656
  md: '# 5、B树和B+树


    3、B树的查找代价分析：


    +   - 查找过程，类似于二叉树的查找。如查找关键字为 KEY 的记录。

    +     从根开始查找，如果 Ki = KEY 则查找成功，Ri 为关键字为 KEY 的记录的地址。

    +     若 Ki < KEY < Ki+1; 查找 Ai 指向的结点

    +     若 KEY < K1; 查找 A0 指向的结点

    +     若 KEY > Kn; 查找 An 指向的结点

    +     若找到叶子，则查找失败。

    +     注意：每次查找将去掉（s-1）/s 个分支，比仅丢掉一半分支还要快。


    +   - 设关键字的总数为 N，求 m 阶 B 树的最大层次 L。


    | 层次 | 节点数（最少） | 关键字的个数（最少） |

    | --- | --- | --- |

    | 1 | 1 | 1 |

    | 2 | 2 | 2（⌈m/2⌉-1） |

    | 3 | 2（⌈m/2⌉） | 2（⌈m/2⌉）（⌈m/2⌉-1） |

    | 4 | 2（⌈m/2⌉）² | 2（⌈m/2⌉）²（⌈m/2⌉-1） |

    | L | 2（⌈m/2⌉）^(L-2) | 2（⌈m/2⌉）^(L-2)（⌈m/2⌉-1） |

    | L+1 | 2（⌈m/2⌉）^(L-1) |  |


    所以，N=1+2（⌈m/2⌉-1）+……+2（⌈m/2⌉）^(L-2)（⌈m/2⌉-1）=2⌈m/2⌉^(L-1)-1


    故：L=log⌈m/2⌉（N+1）/2）+1'
  merge: -1
  img_proc: true
- pgno: 657
  md: "# 5、B树和B+树\n\n· B树和B+树\n\n# 3、B树的查找代价分析：\n\n+   • 设关键字的总数为 N，求 m 阶 B 树的最大层次\
    \ L。\n+   \n+   故：L=⌈log_{m/2}((N+1)/2)⌉+1\n+   \n+   设 N=1000，且 m=256，则 L<=3；最多3次访问外存可找到所有的记录。\n\
    \n# 4、B树的插入操作\n\n+   1、确定插入位置，将结点插入到第 L 层（注意：第 L+1 层为叶子结点）\n+   \n+   2、找到插入位置，将关键字和其它信息按序插入。\n\
    +   \n+   3、若被插入结点的关键字个数 >m-1，则该结点溢满。必须分裂成两个结点。否则不满结束。\n\n如结点原为：\n\n(m-1，A₀，(K₁,A₁)，(K₂,A₂)，……，(Kₘ₋₁,Aₘ₋₁))\n\
    \n插入一个关键字之后变为：\n\n(m，A₀，(K₁,A₁)，(K₂,A₂)，……，(Kₘ,Aₘ))\n\n该结点将进行分裂：\n\n……………… (K_{m/2}，p′)\
    \ ………………\n\np\n\n(m/2-1，A₀，(K₁,A₁)，……，(K_{m/2-1},A_{m/2-1}))\n\np′\n\n(m-m/2，A_{m/2}，……，(Kₘ,Aₘ))\n\
    \n生成新结点 p′，将原结点的后半部分复制过去。若分裂一直进行到根结点，树可能长高一层。\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_657_0.png)"
