- pgno: 360
  md: '# Sorting Algorithms:

    In-Place Sorting


    +   - A sorting algorithm is said to be *in-place* if

    +     - it uses no auxiliary data structures (however, O(1) auxiliary variables
    are allowed)

    +     - it updates the input sequence only by means of operations replaceElement
    and swapElements

    +   - Which sorting algorithms seen so far can be made to work in place?

    +     - Bubble, Insertion, Selection, Merge, Quick, Bucket, Radix'
