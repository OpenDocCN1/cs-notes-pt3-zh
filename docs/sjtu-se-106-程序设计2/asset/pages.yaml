- pgno: 369
  md: '# Implementation Strategies for Maps


    There are several strategies you might choose to implement the map operations
    `get` and `put`. Those strategies include:


    +   1. *Linear search*. Keep track of all the name/value pairs in an array. In
    this model, both the `get` and `put` operations run in O(N) time.

    +   2. *Binary search*. If you keep the array sorted by the two-character code,
    you can use binary search to find the key. Using this strategy improves the performance
    of `get` to O(log N).

    +   3. *Table lookup in a grid*. In this specific example, you can store the state
    names in a 26×26 `Grid<string>` in which the first and second indices correspond
    to the two letters in the code. Because you can now find any code in a single
    step, this strategy is O(1), although this performance comes at a cost in memory
    space.'
