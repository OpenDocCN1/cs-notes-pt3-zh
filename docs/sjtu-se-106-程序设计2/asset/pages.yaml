- pgno: 393
  md: '# # Hash Functions


    +   - If key range too large, use hash table with fewer buckets and a hash function
    which maps multiple keys to same bucket:

    +     h(k₁) = β = h(k₂): k₁ and k₂ have **collision** at slot β

    +   - Popular hash functions: hashing by division

    +     h(k) = k%D, where D number of buckets in hash table

    +   - Example: hash table with 11 buckets

    +     h(k) = k%11

    +     80 → 3 (80%11 = 3), 40 → 7, 65 → 10

    +     58 → 3 collision!'
