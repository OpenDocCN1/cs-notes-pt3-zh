- pgno: 81
  md: "# Redefining operator []\n\n```\n/*\n * Implementation notes: Vector selection\n\
    \ * ----------------------------------------\n * The following code implements\
    \ traditional array selection using\n * square brackets for the index.  The name\
    \ of the method is\n * indicated by specifying the C++ keyword \"operator\" followed\
    \ by\n * the operator symbol.  To ensure that this operator returns an\n * assignable\
    \ value, this method uses an & to return the result\n * by reference.\n */\n\n\
    template <typename ElemType>\nElemType & Vector<ElemType>::operator[](int index)\
    \ {\n    if (index < 0 || index >= count) {\n        Error(\"Vector selection\
    \ index out of range\");\n    }\n    return elements[index];\n}\n```"
