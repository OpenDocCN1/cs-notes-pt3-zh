- pgno: 825
  md: '# 3. Given a stack ADT, explain how can use it to implement a queue ADT.


    +   - Use two stack instance to implement queue.

    +   - When enque, always push to first stack.

    +   - When deque, if the second stack is empty, pop all element from first stack
    and push them into the second stack. When the second stack is not empty, pop one
    element from second stack and return.'
  merge: -1
  img_proc: true
- pgno: 826
  md: "+   - 4. An array of size N contains number 0, 1, 2, ..., N-1 in a random order.\
    \ When sorting, you are only allowed to swap number 0 with other elements. Describe\
    \ your algorithm to sort the array.\n\n```\np = find(0)\nfor i = 1 to N-1:\n \
    \   swap a[p], a[i]\n    p = find(i)\n    swap a[p], a[i]\n```\n\n```\nswap 0\
    \ to a[0]\nsort a[1..N-1] using swap(p, q):\n    swap number p with 0\n    swap\
    \ number q with 0\n    swap number p with 0\n```"
  merge: -1
  img_proc: true
- pgno: 827
  md: "+   - 5. Please write a function which can test balance but will traverse every\
    \ node only one time.\n\n```\n```cpp\nbool isBalanced(Node* root, int& depth)\
    \ {\n    int left = 0, right = 0;\n    if (!root) return true;\n    if (!isBalanced(root->left,\
    \ left)) return false;\n    if (!isBalanced(root->right, right)) return false;\n\
    \    depth = max(left, right) + 1;\n    return abs(left - right) <= 1;\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
