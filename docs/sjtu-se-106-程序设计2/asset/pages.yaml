- pgno: 675
  md: '# The Definition of a Graph


    +   - A *graph* consists of a set of *nodes* together with a set of *arcs*. The
    nodes correspond to the dots or circles in a graph diagram (which might be cities,
    words, neurons, or who knows what) and the arcs correspond to the links that connect
    two nodes.

    +   - In some graphs, arcs are shown with an arrow that indicates the direction
    in which two nodes are linked. Such graphs are called *directed graphs*.

    +   - Other graphs, arcs are simple connections indicating that one can move in
    either direction between the two nodes. These graphs are *undirected graphs*.

    +   - Question: Which of these two structures is more general?'
  merge: -1
  img_proc: true
- pgno: 676
  md: '# Graph Terminology


    +   - Mathematicians often use the words *vertex* and *edge* for the structures
    that computer scientists call *node* and *arc*. We’ll stick with the computer
    science names, but you might see their mathematical counterparts in algorithmic
    descriptions.

    +   - The nodes to which a particular node is connected are called its *neighbors*.

    +   - In an undirected graph, the number of connections from a node is called
    its *degree*. In a directed graph, the number of arcs leading outward is called
    the *out-degree*, and the number of arcs leading inward is called the *in-degree*.

    +   - A series of arcs that connect two nodes is called a *path*. A path that
    returns to its starting point is called a *cycle*.

    +   - A graph in which there is a path between every pair of nodes is said to
    be *connected*.'
  merge: -1
  img_proc: true
