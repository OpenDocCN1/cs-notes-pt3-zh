    +   2、p的后序的直接后继q：1、p是父节点的右儿子，则q=该父节点。2、p是父节点的左儿子，如果有右子树，则q=该右子树中最左的叶子。如果，无右子树，q=父节点。

    +   3、p无父节点，那么q == NULL。'
