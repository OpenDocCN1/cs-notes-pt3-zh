  md: "# Converting Tail Recursive to Iterative\n\n```\nF(x)\n{\n    if (P(x))\n \
    \       return G(x);\n    return F(H(x));\n}\n```\n\nP(x) is true, the value of\
    \ F(x) is the value of some other function G(x). Otherwise, the value of F(x)\
    \ is the value of the function F on some other value, H(x)\n\n```\nF(x) {\n  \
    \  int temp_x = x;\n    while (P(x) is not true) {\n        temp_x = x;\n    \
    \    x = H(temp_x);\n    }\n    return G(x);\n}\n```"
