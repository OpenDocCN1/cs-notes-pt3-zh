- pgno: 83
  md: '# Cautionary Notes


    +   - The return by reference feature of C++ is fraught with problems that can
    snare the unwary programmer.

    +   - The most important caution is that you must *never* use return by reference
    with a value that lives in the stack frame of the current method. If you do, C++
    will return the address of that value to the caller, but the object to which that
    address refers has by that time disappeared, along with the stack frame in which
    it was created.

    +   - As a general rule, it is probably best to limit your use of return by reference
    to situations that are essentially analogous to the selection brackets for vectors:
    cases in which you want to select a field from an abstract structure supplied
    by the caller.'
  merge: -1
  img_proc: true
