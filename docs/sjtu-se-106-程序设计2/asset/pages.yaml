    \ invoking selection sort on arrays of any element type:\n\n```\ntemplate <typename\
    \ ElemType>\nvoid Sort(ElemType array[], int n) {\n    for (int i = 0; i < n;\
    \ i++) {\n        int minIndex = i;\n        for (int j = i + 1; j < n; j++) {\n\
    \            if (array[j] < array[minIndex]) minIndex = j;\n        }\n      \
