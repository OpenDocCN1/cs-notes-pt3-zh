    +   - 广义标准形式：在标准形式的基础上，再增加指向父亲结点的指针场。


    E.g: 度数 K = 3 的树


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_624_1.png)


    用数组表示左图的树


    |  | A | 1 | 2 | 3 | -1 |

    |---|---|---|---|---|---|

    | 0 | A | 1 | 2 | 3 | -1 |

    | 1 | B | 9 | 4 | -1 | 0 |

    | 2 | C | 5 | -1 | -1 | 0 |

    | 3 | D | 6 | 7 | -1 | 0 |

    | 4 | E | -1 | -1 | -1 | 1 |

    | 5 | F | -1 | -1 | -1 | 2 |

    | 6 | G | 8 | -1 | -1 | 3 |

    | 7 | H | -1 | -1 | -1 | 3 |

    | 8 | I | -1 | -1 | -1 | 6 |

    | 9 | P | -1 | -1 | -1 | -1 |


    -1 表示空

    缺点：空指针场太多，多达 (K-1)×n +1 个。

