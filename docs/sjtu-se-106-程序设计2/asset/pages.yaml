- pgno: 512
  md: '# A Question of Balance


    +   - Ideally, a binary search tree containing the names of Disney’s seven dwarves
    would look like this:

    +   - If, however, you happened to enter the names in alphabetical order, this
    tree would end up being a simple linked list in which all the left subtrees were
    NULL and the right links formed a simple chain. Algorithms on that tree would
    run in O(N) time instead of O(log N) time.

    +   - A binary search tree is *balanced* if the height of its left and right subtrees
    differ by at most one and if both of those subtrees are themselves balanced.


    ![](img/af430dff16b82a0fe61ce7dee05dcf9c_512_0.png)'
