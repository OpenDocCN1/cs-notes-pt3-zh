- pgno: 153
  md: "# Lifting example (STL version)\n\n// Concrete STL-style code for a more general\
    \ version of both algorithms\n\n```\ntemplate<class Iter, class T>    // Iter\
    \ should be an Input_iterator\n// T should be something we can + and =\nT sum(Iter\
    \ first, Iter last, T s)    // T is the \"accumulator type\"\n{\n    while (first!=last)\
    \ {\n        s = s + *first;\n        ++first;\n    }\n    return s;\n}\n```\n\
    \nLet the user initialize the accumulator\n\n```\nfloat a[] = { 1,2,3,4,5,6,7,8\
    \ };\ndouble d = 0;\nd = sum(a,a+sizeof(a)/sizeof(*a),d);\n```"
