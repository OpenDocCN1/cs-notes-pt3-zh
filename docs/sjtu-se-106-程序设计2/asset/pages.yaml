  md: "# 4、红黑树\n\n· 红黑树\n\n• 删除：若自上而下删除的是红结点，将使算法得到简化。\n\n+   • 删除要点：\n+   \n+   1、采用自顶向下的方式进行，在二叉排序树中删除一个结点都可以归纳为删除一个儿子为空的结点的情况进行处理。若被删结点是红色的，删除操作结束，因为并未引起红黑树性质的改变。但是，若被删结点是黑色的，那末将会引起黑结点数量的减少，如果我们能够保证被删结点是红色的，就可以简化删除操作。\n\
    +   \n+   2、自根出发进行自上而下的“寻找”。设结点X是所遇到的当前结点，T是它的兄弟结点，而结点P是它们的父结点。我们可以从第一个着色为红色的“哨兵”结点开始，向下搜索。在搜索时，保证当前结点X是红色的。这样，当搜索到一个新结点时，可以确信其父结点P是红色的，而结点X和T是黑色的。\n\
    +   \n+   分以下几种情况，进行讨论：\n\n![](img/af430dff16b82a0fe61ce7dee05dcf9c_650_0.png)"
