  md: "# 抽象\n\nAbstract：计算科学的重要思想\n那为什么不用基于多态的面向对象抽象呢？\n\n+   - 比如STL的std::for_each，用Java的多态机制也可以解决：\n\
    \n```\ninterface IUnaryFun\n{\n    void invoke(Object o);  // 对应伪函数\n}\n```\n\n\
    ```\ninterface IInputIter    // 对应迭代器\n{\n    InputIter preIncrement();\n    boolean\
    \ equals(IInputIter otherIter);\n    ... // other methods\n}\n```\n\n```\nIUnaryFun\
    \ for_each(IInputIter first, IInputIter last, IUnaryFun func)\n{\n    for(!first.equals(last);\
    \ first.preIncrement())    // 对应遍历\n        func.invoke(*first);    // 对应调用\n\
    \    return func;\n}\n```"
