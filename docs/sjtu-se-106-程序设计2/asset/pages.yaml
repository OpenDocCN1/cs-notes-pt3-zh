- pgno: 288
  md: '# Selection Sort Running Times


    +   - Many algorithms that operate on vectors have running times that are proportional
    to the size of the array. If you multiply the number of values by ten, you would
    expect those algorithms to take ten times as long.

    +   - As the running times on the preceding slide make clear, the situation for
    selection sort is very different. The table on the right shows the average running
    time when selection sort is applied to 10, 100, 1000, and 10000 values.

    +   - As a rough approximation—particularly as you work with larger values of
    N—it appears that every ten-fold increase in the size of the array means that
    selection sort takes about 100 times as long.


    | N | time |

    |---|------|

    | 10 | .0024 |

    | 100 | 0.162 |

    | 1000 | 14.32 |

    | 10000 | 1332. |'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Counting Operations


    +   - Another way to estimate the running time is to count how many operations
    are required to sort an array of size N.

    +   - In the selection sort implementation, the section of code that is executed
    most frequently (and therefore contributes the most to the running time) is the
    body of the `findSmallest` method. The number of operations involved in each call
    to `findSmallest` changes as the algorithm proceeds:

    +     - N values are considered on the first call to `findSmallest`.

    +     - N − 1 values are considered on the second call.

    +     - N − 2 values are considered on the third call, and so on.

    +   - In mathematical notation, the number of values considered in `findSmallest`
    can be expressed as a summation, which can then be transformed into a simple formula:

    +     1 + 2 + 3 + ⋯ + (N − 1) + N = ∑_{i=1}^{N} i = (N × (N + 1)) / 2'
  merge: -1
  img_proc: true
