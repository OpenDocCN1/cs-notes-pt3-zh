  mdcn: "\n# 数理逻辑\n（Mathematical Logic）\n\n上海交通大学软件学院\n\n吴刚\n\n2013年春\n\n## 离散数学简介\n\
    \n- 离散数学(Discrete Mathematics)\n  - 是数学的几个分支的总称，以研究离散量的结构和相互间的关系为主要目标，其研究对象一般是有限个或可数无穷个元素；因此它充分描述了计算机科学离散性的特点。\n\
    \n## 离散数学简介\n\n- 研究对象\n  - 离散个体及其结构\n- 研究思想\n  - 以集合和映射为工具、体现公理化和结构的思想\n- 研究内容：包含不同的数学分支\n\
    \  - 集合论：离散结构的表示、描述工具\n  - 数理逻辑：符号化的推理和证明\n  - 代数结构：离散结构的代数模型\n  - 图论：离散结构的关系模型\n\
    \  - 组合数学：离散结构的存在性、计数、枚举、优化、设计\n  - 计算建模：有限状态机、图灵机\n  - 离散概率：二项分布、泊松分布、超几何分布\n\
    \n## 学习数理逻辑的方法\n\n- 了解问题背景\n  ↓\n- 弄清基本概念\n  ↓\n- 掌握基本方法\n\n- 把握四个环节：\n  \n  -\
    \ 课前（浏览预习，只求了解）\n  - 课堂（认真听讲，当场消化）\n  - 课后（立即复习，融会贯通）\n  - 课余（多做习题，举一反三）\n\n勤动脑、勤动手\n\
    \n## 数理逻辑\n\n- 什么是逻辑\n- 什么是数理逻辑\n- 一个推理示例\n  - 如果你好好弹琴，爸爸下午带你去科技馆\n  - \"如果我不好好弹琴，爸爸就不带我去了\"\
    \n- Paradox（悖论）\n  - 理发师只帮那些不为自己理发的人理发\n\n## 课程内容\n\n- 朴素集合论\n- 命题逻辑\n- 谓词逻辑\n\
    - 逻辑理论\n\n## 课程安排\n\n- **教材：**\n  - 离散数学及其应用（英文精编版·第6版）\n    - 《离散数学及其应用》第6版\n\
    \    - 离散数学及其应用\n      - Kenneth H. Rosen\n    - 机械工业出版社（影印版）\n  - 《面向计算机科学的数理逻辑》第二版，陆钟万，科学出版社，2002\n\
    \n## 课程安排\n\n- 成绩构成\n  - 平时成绩40%：课堂、作业、课堂小测验\n  - 期末考试60%\n\n- 享受课程吧！\n\n## Logic\
    \ & Proof (1)\n\n吴刚\n上海交通大学软件学院\n\n## Logic\n\n- 逻辑为数学陈述赋予精确含义，并允许一致的数学推理\n  -\
    \ 在计算机科学中有许多应用，如构造和验证计算机程序、电路设计等\n- 内容\n  - 命题\n  - 命题等价\n  - 谓词和量词\n  - 嵌套量词\n\
    \n## Propositions\n\n- **定义**\n  - 一个陈述句，要么为真（T），要么为假（F），通常用 *p,q,r* 表示命题\n- **示例**\n\
    \  - 1+1=2\n  - 1+1=3\n  - 2014世博会将在上海举行\n  - 你叫什么名字？\n  - 安静\n  - 1+X =5\n\n\
    ## Compound Propositions\n\n- **定义**\n  - 由现有命题和逻辑运算符形成的新命题\n\n- **逻辑运算符**\n \
    \ - ¬ — 非\n  - ∧ — 且\n  - ∨ — 或\n  - ⊕ — 异或\n  - → — 蕴含\n  - ↔ — 双条件\n  - *(否定/合取/析取/异或/蕴含/双条件蕴含)*\n\
    \n## True Table\n\n设“p,q”为命题\n\n| P | ¬P |\n|---|---|\n| T | F |\n| F | T |\n\n\
    | P | Q | P ∧ Q | P ∨ Q | P ⊕ Q |\n|---|---|---|---|---|\n| T | T | T | T | F\
    \ |\n| T | F | F | T | T |\n| F | T | F | T | T |\n| F | F | F | F | F |\n\n##\
    \ OR and XOR\n\n- **示例**\n  1. 汤或沙拉与主菜一起提供\n  2. 我们想要一个会弹钢琴或小提琴的学生\n  3. 我明天将去月球或火星\n\
    \n- **如何表达它们**\n  - OR，包容或：2\n  - XOR，排他或：1, 3\n\n## Implications\n\n- 蕴含：P →\
    \ Q ，P 蕴含 Q。\n  - P 是假设，Q 是结论。\n  - 有些说法：若 P 则 Q，P 时 Q，Q 由 P 推出，仅当 Q 时 P，Q 是 P\
    \ 的必要条件\n  - 示例：如果您不犯错，那么您将得到 A。\n- 双向蕴含：P ↔ Q ，\n  - P 当且仅当（iff）Q\n  - （P→Q 且\
    \ Q→P）\n- 蕴含在数学证明中经常使用\n\n## Implications\n\n| P | Q | P → Q | P ↔ Q |\n|---|---|---|---|\n\
    | T | T | T | T |\n| T | F | F | F |\n| F | T | T | F |\n| F | F | T | T |\n\n\
    奇怪？\n\n考虑：P → Q。\n\n- 1. 逆命题：Q → P。\n- 2. 逆否命题：(非 Q) → (非 P)（等价）\n- 3. 逆命题：(非\
    \ P) → (非 Q)。\n\n## Precedence of logical operators\n\n- 运算符优先级顺序：非、与、或、异或、→、↔\n\
    - 示例：P→Q AND NOT R = P→ (Q AND (NOT R))。\n- 我们通常使用括号使命题更清晰\n\n## Other logical\
    \ operators\n\n- ↑、↓、↛：非与、非或、非蕴含\n- 我们可以有多少个运算符\n- 有多少个运算符足够？\n\n| P | Q | Operator\
    \ |\n|---|---|---|\n| T | T | U1 |\n| T | F | U2 |\n| F | T | U3 |\n| F | F |\
    \ U4 |\n\n- T、F、P、Q;\n- ¬、→、↔：每个覆盖 2 个结果\n- ∧、∨、⊕、↔、↑、↓\n\n"
