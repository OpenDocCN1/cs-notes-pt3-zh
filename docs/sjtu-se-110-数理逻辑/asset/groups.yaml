    \  - \\((\\mathbb{Z}^+, |)\\)\n  - \\((P(S), \\subseteq)\\)，其中 \\(S\\) 是集合\n \
    \ - \\((S, \\subseteq)\\)，\\(S = \\{\\varnothing, \\{1\\}, \\{2\\}, \\{3\\}, \\\
