    \n## 命题等价\n\n- **重言式：** *总是为真的命题。* 例如：P OR (NOT P)。\n- **矛盾式：** *总是为假的命题。* 例如：P\
    \ AND (NOT P)。\n- 其他：*或然命题。*\n\n## 逻辑等价\n\n- 两个命题是 *逻辑等价* 的，如果 P ↔ Q 总是为真（重言式）。\n\
    - 这表示为 P ≡ Q。\n- 示例：德摩根定律\n\n$\\neg(P \\lor Q) \\equiv \\neg P \\land \\neg Q$\n\
    \n| $P$ | $Q$ | $\\neg(P \\lor Q)$ | $\\neg P \\land \\neg Q$ |\n|---|---|---|---|\n\
    | T | T | F | F |\n| T | F | F | F |\n| F | T | F | F |\n| F | F | T | T |\n\n\
    - 恒等律：p ∧ T ≡ p, p ∨ F ≡ p\n- 支配律：p ∧ F ≡ F, p ∨ T ≡ T\n- 幂等律：p ∧ p ≡ p, p ∨ p\
    \ ≡ p\n- 双重否定律：¬(¬p) ≡ p\n- 交换律：p ∨ q ≡ q ∨ p\n- 结合律：(p ∨ q) ∨ r ≡ p ∨ (q ∨ r)\n\
    - 分配律：p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r)\n- 德摩根律：¬(p ∨ q) ≡ ¬p ∧ ¬q\n- 吸收律：p ∨ (p\
