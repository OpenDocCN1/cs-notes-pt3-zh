  mdcn: "\n\n## 演绎推理规则\n\n- 重言式：((p ∨ q) ∧ (¬p ∨ r)) → (q ∨ r)\n- 对基于逻辑规则的编程语言很重要，如\
    \ Prolog\n- *子句*：变量或其否定词的析取\n- 示例：证明 (p ∧ q) ∨ r，r → s 蕴含 p ∨ s\n  - (p ∨ r) ∧\
    \ (q ∨ r) ∧ (¬r ∨ s)\n\n## 谬误\n\n- 不基于重言式\n- 形式谬误\n  - 否定前件谬误\n  - 肯定后件谬误\n\n\
    ```\np → q\np\n____\n∴ q\n正确\n\np → q\n¬p\n____\n∴ ¬q\n错误\n\np → q\nq\n____\n\
    ∴ p\n错误\n```\n\n## 量化语句的推理\n\n- ∀x P(x)  \n  ∴ P(c) 对任意 c  \n  全称实例化\n\n- P(c)\
    \ 对任意 c  \n  ∴ ∀x P(x)  \n  全称概括\n\n- ∃x P(x)  \n  ∴ P(c) 对某个元素 c  \n  存在实例化\n\
    \n- P(c) 对某个元素 c  \n  ∴ ∃x P(x)  \n  存在概括\n\n## 示例 1\n\n- 证明：\n  - 这个数学班里的每个人都上过\
    \ CS 课程；Marla 在这个数学班里；因此 Marla 上过 CS 课程\n- 设：\n  - D(x) = x 在这个数学班里\n  - C(x)\
    \ = x 上过 CS 课程\n  - 前提：∀x (D(x)→C(x))；D(Marla)\n  - 结论：C(Marla)\n- 证明：\n  1. ∀x(D(x)\
    \ → C(x))    前提\n  2. D(Marla) → C(Marla)    全称实例化 (1)\n  3. D(Marla)    前提\n\
    \  4. C(Marla)    假言推理 (2)(3)\n\n## 示例 2\n\n- 证明：\n  - “这个班里有一个学生没有读过这本书”并且“这个班里的每个人都通过了测验”蕴含“有一个通过测验的人没有读过这本书”\n\
    - 设：\n  - C(x) = x 在这个班里；\n  - B(x) = x 读过这本书；\n  - P(x) = x 通过了测验；\n  - 前提：∃x(C(x)\
    \ ∧ ¬B(x))；∀x(C(x)→P(x))\n  - 结论：∃x(P(x) ∧ ¬B(x))；\n- 证明：\n  1. ∃x(C(x) ∧ ¬B(x))\
    \    前提\n  2. C(a) ∧ ¬B(a)    存在实例化 (1)\n  3. ∀x(C(x)→P(x))    前提\n  4. C(a)→P(a)\
    \    全称实例化 (3)\n  5. C(a)    从 (2) 简化\n  6. P(a)    假言推理 (4)(5)\n  7. ¬B(a)  \
    \  简化 (2)\n  8. P(a) ∧ ¬B(a)    合取 (6)(7)\n  9. ∃x(P(x) ∧ ¬B(x))    存在概括 (8)\n\
    \n## 证明定理的方法\n\n- 要证明蕴含式 p → q：\n  - **直接证明**：假设 p 为真并使用推理规则证明 q 必须为真。\n  - **间接证明**：¬q\
    \ → ¬p ≡ p → q，反证法\n  - **空真证明**：证明 p 恒为假\n  - **平凡证明**：证明 q 恒为真\n- 反证法：\n  -\
    \ 如果能证明 ¬p → F，则 p 为真\n- 分情况证明：\n  - (p₁∨p₂∨...∨pₙ) → q ≡ (p₁→q) ∧ (p₂→q) ∧ ...\
    \ ∧ (pₙ→q)\n- 等价性证明：\n  - p↔q ≡ (p→q) ∧ (q→p)\n- 存在性证明：\n  - 构造性\n  - 非构造性\n-\
    \ 唯一性证明：\n  - 存在性与唯一性\n- 反例：\n  - 用来证明 ∀x P(x) 为假\n\n## 证明策略\n\n- 包括：\n  - 前向和后向推理\n\
    \  - 利用分情况证明\n  - 借鉴已有证明\n  - 猜想 / 证明 / 反例\n- 自己阅读！\n\n## 作业\n\n1. 第 58 页，第 3\
