    # deductive reasoning


    +   - 命题逻辑

    +     - 命题： P、 Q、 R

    +     - 逻辑连接词： ¬、 ∧、 ∨、 →、 ...

    +   - 谓词逻辑

    +     - 谓词： S(t)， t是项（term）

    +     - 量词： ∀x、 ∃x

    +     - 个体： a、 b、 c（常量）、 ...u、 v（变元）

    +     - 个体函数： f、 g...

    +     - 构造规则： 项的构造、 公式构造'
  - '[PAGE 231]


    # 形式语言


    +   - 语法和语义

    +     - 语法只涉及符号和表达式的形式结构

    +     - 而给符号赋予某种解释时，就有语义了

    +   - 谓词逻辑公式的解释（赋值）

    +     - 论域

    +     - 谓词函数

    +     - 个体函数

    +     - 命题真值'
  - '[PAGE 232]


    # 命题逻辑与谓词逻辑的性质


    +   - the **soundness** property（可靠性）

    +     - 语法的推演反映出的关系在语义上是成立的

    +     - 形式推演对于语义的推理是可靠的

    +     - 形式推演的可靠性

    +   - The **completeness** property（完备性）

    +     - 凡是语义推理成立的关系，语法的推演都是可以反映的

    +     - 形式推演的完备性'
  - '[PAGE 233]


    # 可满足性与有效性


    +   - 语义概念

    +   - 可满足的：一个公式或者公式集合是可满足的，当且仅当有一个赋值（论域不为空）使得公式（或集合中每一个公式）为T。一般用Σ表示公式集合，大写字母A、B、P、Q标识公式

    +   - 有效的：公式A是有效的，当且仅当任何赋值都使之为T（论域不为空）'
  - '[PAGE 234]


    # 可满足性与有效性


    +   - 在论域D上是可满足的：当且仅当在论域D上有一个赋值使之为T

    +   - 在论域D上是有效的：当且仅当在论域D上的任何赋值都使之为T


    +   - Σ在论域D上是可满足的，则Σ是可满足的；

    +   - A是有效的，则A在论域D上是有效的'
  - '[PAGE 235]


    # 可满足性与有效性


    +   - **定理**

    +     - A是可满足的，当且仅当¬A不是有效的

    +     - A是有效的，当且仅当¬A是不可满足的

    +     - A(u₁,u₂,...,uₙ)是可满足的，当且仅当 ∃x₁...∃xₙ A(x₁,...,xₙ)是可满足的

    +     - A(u₁,u₂,...,uₙ)是有效的，当且仅当 ∀x₁...∀xₙ A(x₁,...,xₙ)是有效的'
