    +     - 设 Σ ⊢ A，如果 A ∉ Σ，由 Σ 是极大协调的可知 Σ ∪ {A} 是不协调的。因此 Σ ⊢ ¬A，导出 Σ 不协调，矛盾！因此，A
    ∉ Σ。

    +     - 设 A ∈ Σ，则由推理规则可到 Σ ⊢ A

    +   - 极大协调集 Σ 是封闭于形式可推演的


    ## 极大协调性


    +   - 推论：设Σ是极大协调集，则对于任何A ， Σ ⊢¬A 当且仅当 Σ ⊢A

    +   - Σ ⊢¬A，若 Σ ⊢A，Σ不协调，矛盾！

    +   - Σ ⊢A，则 A ∉ Σ，则 ¬A ∈ Σ，则 Σ ⊢¬A


    ## 极大协调集


    +   定理（Lindenbaum）：任何协调的公式集Σ能够扩充为极大协调集。记为Σ*


    +   设Form(L)是可数无限集，令A₀, A₁, A₂,…是其一个排列。定义Σₙ (n≥0)如下：

    +   Σ₀=Σ， Σₙ₊₁=Σₙ∪{Aₙ} (若Σₙ∪{Aₙ}协调)，

    +   否则Σₙ₊₁=Σₙ


    +   则有Σₙ⊆Σₙ₊₁，且Σₙ是协调的。


    +   Σ* = ∪ₙ∈N Σₙ 先证Σ*是协调的；

    +   再证Σ*是极大的


    ## 极大协调集


    +   - 定理（Lindenbaum）：任何协调的公式集 Σ 能够扩充为极大协调集。记为 Σ*


    +     - 注明：一阶语言不可数时，Form(L) 是不可数无限集。这种情况不做要求。


    ## 命题逻辑的完备性


    +   - 完备性证明有多种不同的方法


    +   - 方法一的引理

    +     设A ∈ Form(L^p)含不同的原子公式p₁， p₂， ... ， pₙ， v是真假赋值。对于i=1,2,..., n, 令若pᵢ^v=1，则Aᵢ=pᵢ；否则，Aᵢ=¬pᵢ。则有


    +   - 若A^v=1，则A₁，A₂，...，Aₙ ⊢ A。


    +   - 若A^v=0，则A₁，A₂，...，Aₙ ⊢ ¬A


    ## 命题逻辑的完备性


    +   - **方法一的定理**：设 $A\in\mathrm{Form}(L^p)$，$\Sigma\subseteq\mathrm{Form}(L^p)$，且
    $\Sigma$ 是有限集，则

    +     - 若 $\Phi\nvdash A$，则 $\Phi\nvdash A$（$A$ 是重言式的话，则 $A$ 是形式上可证明的）

    +     - 若 $\Sigma\nvdash A$，则 $\Sigma\nvdash A$


    ## 命题逻辑的完备性


    证明若 Φ ⊨ A，则 Φ ⊢ A：


    设 A 含不同的原子公式 p₁,p₂,…,pₙ。令 v1，v2 是真假赋值，且 p₁ᵛ¹=1，p₁ᵛ²=0，p₂ᵛ¹= p₂ᵛ²=1，pᵢᵛ¹= pᵢᵛ²
    (i=3, …, n)。由引理，由于 Aᵛ¹=1，所以 p₁，p₂，…，Aₙ ⊢ A。由于 Aᵛ²=1，所以 ¬p₁，p₂，…，Aₙ ⊢ A。可得，p₁ ∨
    ¬p₁，p₂，…，Aₙ ⊢ A，p₂，…，Aₙ ⊢ (p₁ ∨ ¬p₁) → A，又因为 Φ ⊢ p₁ ∨ ¬p₁，所以 p₂，…，Aₙ ⊢ p₁ ∨ ¬p₁。可得，p₂，…，Aₙ
    ⊢ A。


    再令 u1，u2 是真假赋值，且 p₁ᵘ¹=1，p₁ᵘ²=0，p₂ᵘ¹= p₂ᵘ²=0，pᵢᵘ¹= pᵢᵘ²，i=3, …, n。同理可得，¬p₂，…，Aₙ
    ⊢ A。


    可得，A₃，…，Aₙ ⊢ A。进一步指定真假赋值，可得 Φ ⊢ A。


    ## 命题逻辑的完备性


    +   方法二的引理：

    +     Σ* ⊆ Form(Lρ) 是极大协调集，构造真假赋值 v 使得对任何原子公式 p，p^v = 1 当且仅当 p ∈ Σ*，于是对于任何的 A
    ∈ Form(Lρ)，A^v = 1 当且仅当 A ∈ Σ*


    ## 命题逻辑的完备性


    +   - 方法二的定理1：设 Σ⊆Form(Lᵖ)，A∈Form(Lᵖ)，则有

    +     - 如果 Σ 是协调的，则 Σ 是可满足的；

    +     - 如果 A 是协调的，则 A 是可满足的；


    证明：Σ 是协调的，任取 B∈Σ，把 Σ 扩为极大协调集 Σ*，使用引理中的真假赋值 v，就有 Bᵛ=1。因此，v 满足 Σ。


    ## 命题逻辑的完备性


    +   - 方法二的定理2：设 $\Sigma \subseteq \mathrm{Form}(L^p)$，$A \in \mathrm{Form}(L^p)$，则

    +     - 若 $\Sigma \models A$，则 $\Sigma \vdash A$

    +     - 若 $\Phi \models A$，则 $\Phi \vdash A$（$A$ 是重言式的话，则 $A$ 是形式上可证明的）


    证明：$\Sigma \not\vdash A$，则 $\Sigma \cup \{\neg A\}$ 是不可满足的。又定理1可知 $\Sigma \cup
    \{\neg A\}$ 是不协调的。因此 $\Sigma \vdash A$


    ## 一阶逻辑的完备性


    +   - 经典一阶逻辑就是指谓词逻辑

    +   - 我们只需要大家了解结论，不需要大家掌握证明。


    ## 一阶逻辑的完备性


    +   - 一阶完备性定理1：设Σ ⊆ Form(L)，A ∈ Form(L)，则有

    +     - 如果Σ是协调的，则Σ是可满足的；

    +     - 如果A是协调的，则A是可满足的；


