  - '[PAGE 13]


    # Logic


    +   - Logic gives precise meaning to mathematical statements, and allows consistent
    math reasoning

    +     - Many applications in CS, construction and verification computer programs,
    circuit design, etc

    +   - Contents

    +     - Propositions

    +     - Propositional Equivalence

    +     - Predicates and Quantifiers

    +     - Nested Quantifiers'
  - '[PAGE 14]


    # Propositions


    +   - **Definition**

    +     - A declarative statement that is either true (T) or false (F), use *p,q,r*
    to denote proposition usually

    +   - **Examples**

    +     - 1+1=2

    +     - 1+1=3

    +     - Expo2014 will be held in Shanghai

    +     - What is your name?

    +     - Be quiet

    +     - 1+X =5'
  - '[PAGE 15]


    # Compound Propositions


    +   - **Definition**

    +     - New propositions formed by existing propositions and logical operators


    +   - **Logical Operators**

    +     - ¬ — not

    +     - ∧ — and

    +     - ∨ — or

    +     - ⊕ — xor

    +     - → — implies

    +     - ↔ — biconditional

    +     - *(negation/conjunction/disjunction/exclusive or/implication/biconditional
    implication)*'
  - '[PAGE 16]


    # True Table


    +   Let "p,q" be propositions


    | P | ¬P |

    |---|---|

    | T | F |

    | F | T |


    | P | Q | P ∧ Q | P ∨ Q | P ⊕ Q |

    |---|---|---|---|---|

    | T | T | T | T | F |

    | T | F | F | T | T |

    | F | T | F | T | T |

    | F | F | F | F | F |'
  - '[PAGE 17]


    # OR and XOR


    +   - **Examples**

    +     1. Soup or salad comes with an entrée

    +     2. We want a student who can play piano or violin

    +     3. I will go to the moon or the mars tomorrow


    +   - **How to express them**

    +     - OR, inclusive or: 2

    +     - XOR, exclusive or: 1, 3'
  - '[PAGE 18]


    # Implications


    +   - Implication: P → Q , P IMPLIES Q.

    +     - P is hypothesis, Q is consequence.

    +     - Some ways: if P then Q, Q when P, Q follows from P, P only if Q, Q is
    the necessary for P

    +     - example: If you make no mistakes, then you’ll get an A.

    +   - Bidirectional implication: P ↔ Q ,

    +     - P if and only if (iff) Q

    +     - (P→Q and Q→P)

    +   - Implications are often used in mathematical proofs'
  - '[PAGE 19]


    # Implications


    | P | Q | P → Q | P ↔ Q |

    |---|---|---|---|

    | T | T | T | T |

    | T | F | F | F |

    | F | T | T | F |

    | F | F | T | T |


    weird?


    Consider: P → Q.


    +   1. converse: Q → P.

    +   2. contra-positive: (NOT Q) → (NOT P) (equiv.)

    +   3. inverse: (NOT P) → (NOT Q).'
  - '[PAGE 20]


    # Precedence of logical operators


    +   - Order of precedence: NOT, AND, OR, XOR, →, ↔

    +   - example: P→Q AND NOT R = P→ (Q AND (NOT R)).

    +   - We usually use parentheses to make the proposition clear'
  - '[PAGE 21]


    # Other logical operators


    +   - ↑、↓、↛: not and、 not or、 not implies

    +   - How many operators we could have

    +   - How many operators are enough?


    | P | Q | Operator |

    |---|---|---|

    | T | T | U1 |

    | T | F | U2 |

    | F | T | U3 |

    | F | F | U4 |


    +   - T、F、P、Q;

    +   - ¬、→、↔: each one covers 2 results

    +   - ∧、∨、⊕、↔、↑、↓'
