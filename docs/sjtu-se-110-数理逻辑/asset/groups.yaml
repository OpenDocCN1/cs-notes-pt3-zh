    # Power set


    Definition


    +   - Given a set S, the power set of S is a set of all subsets of S, denoted
    by P(S)

    +   - S={1,2} then P(S)={∅ , {1}, {2}, {1,2}}

    +   - S= ∅  then P(S)={ ∅ }

    +   - S={∅ } then P(S)={∅ , {∅ }}

    +   - If S has n elements, then P(S) has 2ⁿ elements'
