    \n**化简**\n\np ∧ q → p\n\n```\np ∧ q\n────\n∴ p\n```\n\n**否定后件**\n\n[¬q ∧ (p →\
    \ q)] → ¬p\n\n```\n¬q\np → q\n────\n∴ ¬p\n```\n\n**假言三段论**\n\n[(p → q) ∧ (q →\
    \ r)] → (p → r)\n\n```\np → q\nq → r\n────\n∴ p → r\n```\n\n**析取三段论**\n\n[(p ∨\
    \ q) ∧ ¬p] → q\n\n```\np ∨ q\n¬p\n────────\n∴ q\n```\n\n**归结**\n\n[(p ∨ q) ∧ (¬p\
    \ ∨ r)] → (q ∨ r)\n\n```\np ∨ q\n¬p ∨ r\n────────────\n∴ q ∨ r\n```\n\n## 有效论证\n\
    \n- 若所有前提都为真，则结论也为真的论证形式称为有效。\n  - 证明 q 由假设 p₁, p₂, ..., pₙ 推出，等价于证明蕴涵式 (p₁ ∧\
    \ p₂ ∧ ... ∧ pₙ) → q 为真。\n\n*要使一个论证为真，所有前提都必须为真；*\n*需要使用若干推理规则。*\n\n## 有效论证 (示例)\n\
    \n- 假设\n  - 如果你爱我，那么你就会跟我走。\n  - 如果你不爱我，那么你就会跟他走。\n  - 如果你跟他走，那么我会哭。\n- 结论\n \
    \ - 如果你没有跟我走，那么我会哭。\n\n## 有效论证 (示例)\n\n- p: 你爱我\n- q: 你会跟我走\n- r: 你会跟他走\n- s:\
    \ 我会哭\n- 假设：p→q, ¬p→r, r→s\n- 结论：¬q→s\n\n## 有效论证 (示例)\n\n- 假设：p→q, ¬p→r, r→s\n\
    - 结论：¬q→s\n\n| 步骤 | 陈述 | 原因 |\n|---|---|---|\n| 1 | p→q | 假设 |\n| 2 | ¬q→¬p |\
    \ 第 1 步的逆否命题 |\n| 3 | ¬p→r | 假设 |\n| 4 | ¬q→r | 假言三段论 (2, 3) |\n| 5 | r→s | 假设\
    \ |\n| 6 | ¬q→s | 假言三段论 (4, 5) |\n\n"
