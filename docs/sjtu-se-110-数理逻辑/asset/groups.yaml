  mdcn: "\n\n## 函数与关系\n\n![](img/596a7ad0af4b255f7c4ff59547a2dbb3_137_0.png)\n\n这是一个关系，而不是函数\n\
    \n## 集合上的关系\n\n- 集合 A 上的关系是从 A 到 A 的关系\n- 示例\n  - A={1,2,3,4}，给出集合 A 上的关系 R\n\
    \    R={(a,b)|a 整除 b}\n    R={(1,1), (1,2), (1,3), (1,4), (2,2), (2,4), (3,3),\
    \ (4,4)}\n  - 一个有 n 个元素的集合上有多少个关系？\n\n## 集合上关系的性质\n\n集合 A 上的关系 R\n\n- 自反的\n  -\
    \ ∀ a ((a,a) ∈ R), a ∈ A\n- 反自反的\n  - ∀ a ((a,a) ∉ R), a ∈ A\n- 对称的\n  - ∀ a ∀\
    \ b ((a,b) ∈ R → (b,a) ∈ R)  a,b ∈ A\n- 反对称的\n  - ∀ a ∀ b ((a,b) ∈ R ∧ (b,a) ∈\
    \ R → (a=b))  a,b ∈ A\n\n## 集合上关系的性质\n\n集合 A 上的关系 R\n\n- 传递的\n  - ∀a∀b∀c ((a,b)∈R\
    \ ∧ (b,c)∈R → (a,c)∈R)\n    a,b,c∈A\n\n## 集合上关系的性质\n\n- 示例\n  - **N** 上的关系“=”、“>”、“≥”\n\
    \  - ∅ 上的关系\n\n![](img/596a7ad0af4b255f7c4ff59547a2dbb3_141_0.png)\n\n## 关系的组合\n\
    \n- R1 和 R2 是从 A 到 B 的关系\n  - R1 ∪ R2\n  - R1 ∩ R2\n  - R1-R2\n  - R2-R1\n\n##\
    \ 关系的组合\n\n- R 是从 A 到 B 的关系，S 是从 B 到 C 的关系，则\n  - R 和 S 的复合是从 A 到 C 的关系，记为 S∘R，对于每个\
    \ (a,c) ∈ S∘R，存在一个元素 b ∈ B，使得 (a,b) ∈ R, (b,c) ∈ S\n\n## n 元关系\n\n- 哪些列车在晚上9点后从上海开往北京？\n\
    - 你班上谁上个学期获得了超过2个A？\n- n 元关系与计算机数据库\n\n## n 元关系\n\n- **定义**\n  - 设 A1, A2, …,\
    \ An 是集合，这些集合上的 n 元关系是 A1×A2×…×An 的一个子集，A1, A2, …, An 称为关系的域，n 称为它的度\n- **示例**\n\
    \  - (D, 305, 上海, 北京, 晚上9:00)\n  - (张三, G10101, 英语, A, 2009, 秋季)\n\n## n 元关系上的运算\n\
    \n- 选择运算符 sC\n  - 将 n 元关系 R 映射为由 R 中所有满足条件 C 的 n 元组构成的 n 元关系\n- 投影运算符 P_i1,i2,...,im\n\
    \  - 将 n 元组 (a1,a2,...an) 映射为 m 元组 (a_i1,a_i2,...,a_im)，其中 m≤n\n\n## n 元关系上的运算\n\
    \n### 连接运算符 $J_p(R,S)$\n\n设 $R$ 是一个度为 $m$ 的关系，$S$ 是一个度为 $n$ 的关系，$p\\le m,p\\le\
    \ n$。$J_p(R,S)$ 是一个度为 $m+n-p$ 的关系，由所有 $(m+n-p)$ 元组 $(a_1,a_2,\\ldots a_{m-p},c_1,c_2,\\\
    ldots c_p,b_1,b_2,\\ldots b_{n-p})$ 组成，其中 $(a_1,a_2,\\ldots a_{m-p},c_1,c_2,\\\
    ldots c_p)$ 属于 $R$，且 $(c_1,c_2,\\ldots c_p,b_1,b_2,\\ldots b_{n-p})$ 属于 $S$\n\n\
    ## 作业\n\n- 第253页 11\n\n*第528页 25 第6版*\n设 R 是正整数集上的关系 R={(q,b)|a 整除 b}。求 a) R⁻¹\
    \    b) R̄\n\n## 作业\n\n- 第253页 14\n\n第528页 31 第6版\n\n设 R 是人的集合上的关系，由二元组 (a,b)\
    \ 组成，其中 a 是 b 的父母。设 S 是人的集合上的关系，由二元组 (a,b) 组成，其中 a 和 b 是兄弟姐妹（兄弟或姐妹）。S∘R 和 R∘S\
    \ 是什么？\n\n## 作业\n\n- 第253页 23\n  *第528页 49 第6版*\n  证明集合 A 上的关系 R 是对称的当且仅当 R=R⁻¹，其中\
    \ R⁻¹ 是逆关系\n\n## 作业\n\n- 第253页 26\n  *第528页 55 第6版*\n  设 R 是集合 A 上的自反关系，证明对所有正整数\
    \ n，Rⁿ 都是自反的。\n\n## 关系（2）\n\n吴刚\n\n上海交通大学软件学院\n\n![](img/596a7ad0af4b255f7c4ff59547a2dbb3_154_0.png)\n\
    \n## 关系的表示\n\n- 表示有限集合之间的关系\n  - 列出其有序对\n  - 使用 0-1 矩阵（用于计算机程序）\n  - 有向图（帮助人们更好地理解关系）\n\
    \n## 使用矩阵\n\n- 假设 R 是从 A={a₁,a₂,…,aₘ} 到 B={b₁,b₂,…,bₙ} 的关系。\n  - 元素按任意顺序列出（如果\
    \ A=B，则顺序相同）。\n  - 使用矩阵 M_R=[mᵢⱼ] 表示 R\n\n$$M_{ij}=\\begin{cases}1\\ldots\\text{如果\
    \ }(a_i,b_j)\\in R\\\\0\\ldots\\text{如果 }(a_i,b_j)\\notin R\\end{cases}$$\n\n"
