    related to an element a of A is called the equivalence class of a. denoted by
    [a]_R

    +   - [a]_R = {s | (a,s) ∈ R}

    +   - If there is only one relation under consideration, it can be denoted by
    [a]


    ## Equivalence classes


    +   - Examples

    +     - [zhangsan] for relation “Lao xiang”

    +     - [0], [1], [5] for congruence modulo 4

    +       - [0]={...-8,-4,0,4,8...}

    +       - [1]={...-7,-3,1,5,9...}

    +       - [5]=?

    +     - Congruence classes modulo m, denoted by [a]ₘ, like [5]₄ and [1]₃


    ## Equivalence classes and partitions


    +   Theorem1

    +     Let R be an equivalence relation on set A, these statements are equivalent

    +     (1) aRb;  (2) [a]=[b];  (3)[a]∩[b]≠∅


    ## Partial orderings


    ## Definition


    +   - A relation R on a set S is called partial order if it is reflexive, antisymmetric
    and transitive.

    +   - A set S together with a partial order R is called a *partially ordered set*
    or *poset*, denoted by (S,R)


    ## Partial orderings


    +   - Examples

    +     - (Z, ≥)

    +     - Inclusion relation on the power set of set S, (P(S), ⊆)

    +   - (S,R)

    +     - It is not necessary that either aRb or bRa for every a and b in the set
    S


    ## Partial orderings


    +   - The elements a and b of a poset (S, ≤) are called Comparable if either a
    ≤ b or b ≤ a, otherwise, incomparable

    +   - Total ordering

    +     - If (S, ≤) is a poset, and every two elements of S are comparable, S is
    called totally ordered set or linearly ordered set

    +     - (P(S), ⊆) Total ordering?


    ## Partial orderings


    +   Lexicographic ordering


    +   ≤ on Cartesian product of N posets

    +   (A₁, ≤₁) (A₂, ≤₂)... (Aₙ, ≤ₙ)


    +   (a₁,a₂,...aₙ)<(b₁,b₂...bₙ) if a₁<₁b₁ or there is an integer i>0 such that
    a₁=b₁ a₂=b₂ ... aᵢ=bᵢ, and aᵢ₊₁<ᵢ₊₁bᵢ₊₁)


    +   (a₁,a₂,...aₙ)=(b₁,b₂...bₙ) if aᵢ=bᵢ i=1,2,...n


    +   How to compare 8-bit binary number?


