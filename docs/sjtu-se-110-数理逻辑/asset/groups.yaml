    ![](img/596a7ad0af4b255f7c4ff59547a2dbb3_29_0.png)'
  - '[PAGE 30]


    # Propositional Equivalence


    +   - **Tautology:** *Proposition that is always true.* for example: P OR (NOT
    P).

    +   - **Contradiction:** *Proposition that is always false.* for example: P AND
    (NOT P).

    +   - Others: *Contingencies.*'
  - '[PAGE 31]


    # # Logical equivalences


    +   - Two propositions are *logically equivalent* if P ↔ Q is always true (tautology).

    +   - This is denoted by P ≡ Q'
  - '[PAGE 32]


    # Logical equivalences


    +   - Example: De Morgan’s Law


    $(P \lor Q) \equiv \neg P \land \neg Q$


    | $P$ | $Q$ | $\neg(P \lor Q)$ | $\neg P \land \neg Q$ |

    |---|---|---|---|

    | T | T | F | F |

    | T | F | F | F |

    | F | T | F | F |

    | F | F | T | T |'
  - '[PAGE 33]


    <!-- no content -->'
  - '[PAGE 34]


    # Logical equivalences


    +   - Identity laws: p∧T ≡ p, p∨F ≡ p

    +   - Domination laws: p∧F ≡ F, p∨T ≡ T

    +   - Idempotent laws: p∧p ≡ p, p∨p ≡ p

    +   - Double negation law: ¬(¬ p)≡ p

    +   - Commutative laws: p∨q ≡ q∨p

    +   - Associative laws: (p∨q)∨r ≡ p∨(q∨r)

    +   - Distributive laws: p∨(q∧ r)≡ (p∨q)∧(p∨r)

    +   - De Morgen’s laws: ¬(p∨q) ≡ ¬p ∧ ¬ q

    +   - Absorption laws: p∨(p ∧ q) ≡ p

    +   - Negation laws: p ∨ ¬p ≡ T'
  - '[PAGE 35]


    # Logical equivalences


    +   - The Dual of a compound prop. that contains only ¬, ∧, ∨ is the prop. obtained
    by replacing each ∧ by ∨, each ∨ by ∧, each T by F, each F by T, denoted by $p^*$

    +   - If $p \equiv q$ then $p^* \equiv q^*$'
  - '[PAGE 36]


    # Logical equivalences


    +   - p → q ≡ ¬p ∨ q

    +   - p ↔ q ≡ (p → q) ∧ (q → p)

    +   - p ∨ q ≡ ¬p → q

    +   - p ∧ q ≡ ¬ (p → ¬q)

    +   - (p → q) ∧ (p → r) ≡ p → (q ∧ r)

    +   - (p → r) ∨ (q → r) ≡ (p ∧ q) → r'
  - '[PAGE 37]


    # Normal Form


    +   - Disjunctive Normal Form

    +     - p ∨ (¬p ∧ q) ∨ (p ∧ q ∧ ¬r)

    +   - Full disjunctive normal form

    +     - (p ∧ q ∧ r) ∨ (¬p ∧ q ∧ r) ∨ (¬p ∧ q ∧ ¬r)

    +   - Conjunctive Normal Form'
  - '[PAGE 38]


    # Predicates


    +   - consider statements with *variables*: x > 3

    +     - x is the subject.

    +     - >3 is the *predicate* or property of the subject.

    +   - We introduce a *propositional function* P(x), that denotes >3.

    +   - If x is a specific number, the function becomes a proposition (T or F).
    For example: P(2) = F, P(4) = T.

    +   - P is called a *predicate*'
  - '[PAGE 39]


    # Predicates


    +   - More generally, we can have “functions” of more than one variable.

    +   - For each input value it assigns either T or F.

    +   - example: Q(x,y) = (x=y+3).

    +     Q(1,2) = (1=2+3) = F

    +     Q(3,0) = (3=0+3)=T'
  - '[PAGE 40]


    # # Quantifiers


    +   - We do not always have to insert specific values. We can make propositions
    for general values in a *domain* (or *universe of discourse*):

    +   - This is called: *quantification.*


    +   - **_Universal Quantification:_** P(x) is true for all values of x in the
    domain: ∀x P(x)


    +   - **_Existential Quantification:_** There exists an element x in the domain
    such that P(x) is true: ∃x P(x)'
