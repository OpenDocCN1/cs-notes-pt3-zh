    ## examples


    +   - Let R be the relation on the set of all subway stops in shanghai that contains
    (a,b) if it is possible to travel from a to b without changing trains.

    +   - What is Rⁿ? What is R*?

    +   - (Dongchuan Road, Jianchuan Road) ∈ R⁵?

    +   - (Dongchuan Road, Jianchuan Road) ∈ R⁴?


    ## Transitive closures


    +   - Theorem

    +     - The transitive closure of a relation R equals the connectivity relation
    R*

    +       - R* contains R

    +       - R* is transitive

    +       - If there is a S, which is transitive and contains R, then S contains
    R*


    ## Transitive closures


    +   R* = R ∪ R² ∪ R³ ∪ ... ∪ Rⁿ


    M_{R*} = M_R ∨ M_R^{[2]} ∨ M_R^{[3]} ... ∨ M_R^{[n]}


