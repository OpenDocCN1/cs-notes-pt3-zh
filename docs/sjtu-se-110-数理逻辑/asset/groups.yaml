    \ T 替换为 F，每个 F 替换为 T 得到命题，记为 $p^*$。\n- 如果 $p \\equiv q$ 则 $p^* \\equiv q^*$。\n\
    - p → q ≡ ¬p ∨ q\n- p ↔ q ≡ (p → q) ∧ (q → p)\n- p ∨ q ≡ ¬p → q\n- p ∧ q ≡ ¬(p\
    \ → ¬q)\n- (p → q) ∧ (p → r) ≡ p → (q ∧ r)\n- (p → r) ∨ (q → r) ≡ (p ∧ q) → r\n\
    \n## 范式\n\n- 析取范式\n    - p ∨ (¬p ∧ q) ∨ (p ∧ q ∧ ¬r)\n- 全析取范式\n    - (p ∧ q ∧\
    \ r) ∨ (¬p ∧ q ∧ r) ∨ (¬p ∧ q ∧ ¬r)\n- 合取范式\n\n## 谓词\n\n- 考虑包含 *变量* 的陈述：x > 3\n\
    \    - x 是主语。\n    - > 3 是主语的 *谓词* 或属性。\n- 我们引入一个 *命题函数* P(x) 表示 x > 3。\n- 如果\
    \ x 是一个特定数字，函数就变成一个命题（T 或 F）。例如：P(2) = F, P(4) = T。\n- P 被称为 *谓词*。\n- 更一般地，我们可以有多个变量的“函数”。\n\
    - 对于每个输入值，它赋值为 T 或 F。\n- 示例：Q(x, y) = (x = y + 3)。\n    - Q(1, 2) = (1 = 2 + 3)\
    \ = F\n    - Q(3, 0) = (3 = 0 + 3) = T\n\n## 量词\n\n- 我们不总是必须插入特定值。我们可以在一个 *域*（或\
    \ *论域*）中对一般值做出命题：\n- 这称为：*量化。*\n- **全称量化：** P(x) 对域中 x 的所有值都为真：∀x P(x)\n- **存在量化：**\
    \ 域中存在一个元素 x 使得 P(x) 为真：∃x P(x)\n\n"
