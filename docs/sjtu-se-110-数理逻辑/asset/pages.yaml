  md: '# Properties of relations on a set


    relation R on the set A


    +   - Reflexive

    +     - ∀ a ((a,a) ∈ R), a ∈ A

    +   - Irreflexive

    +     - ∀ a ((a,a) ∉ R), a ∈ A

    +   - Symmetric

    +     - ∀ a ∀ b ((a,b) ∈ R → (b,a) ∈ R)  a,b ∈ A

    +   - Antisymmetric

    +     - ∀ a ∀ b ((a,b) ∈ R ∧ (b,a) ∈ R → (a=b))  a,b ∈ A'
