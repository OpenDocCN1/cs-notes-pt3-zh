- pgno: 52
  md: '# Nested Quantifiers


    +   - **Nested Quantifier:** *Quantifier that appears within the scope of another
    quantifier*

    +   - Examples: x,y,z are real numbers

    +     - ∀ x ∃ y (x+y=0)

    +     - ∀ x ∀ y ∀ z (x+(y+z) = (x+y)+z)

    +     - ∀ x ∀ y (x>0) ∧ (y<0) → (xy<0)

    +       - For all x and for all y if x is positive and y is negative then their
    product must be negative.

    +       - The product of a positive and a negative real number is negative.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Using nested quantifiers


    +   - Translate this sentence into a logical expressions.

    +     - "If a person is female and is a parent, then she is someone’s mother."

    +   - F(x) is "x is female", P(x) is "x is someone’s parent", M(x,y), "x is the
    mother of y"

    +     - ∀x ∃y (F(x) ∧ P(x)) → M(x,y)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Negating nested quntifiers


    +   - ∀x∃y (x+y=0)

    +   - ¬∀x∃y (x+y=0)

    +     ≡ ∃x ¬∃y (x+y=0)

    +     ≡ ∃x∀y ¬(x+y=0)

    +     ≡ ∃x∀y (x+y≠0)'
