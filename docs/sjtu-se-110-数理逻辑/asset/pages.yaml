- pgno: 241
  md: '# 可靠性（谓词逻辑、命题逻辑）


    +   - 定理：设 Σ ⊆ Form(L)，A ∈ Form(L)。

    +     - 若 Σ ⊢ A，则 Σ ⊨ A。

    +     - 若 Φ ⊢ A，则 Φ ⊨ A。

    +     - 即：所有形式可证明的公式都是有效的。

    +     - 一阶逻辑有17条推理规则，要证明每一条规则都满足可靠性'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 17条推理规则


    +   - A ⊢ A  (Ref)

    +   - if Σ ⊢ A, then Σ, Σ′ ⊢ A  (+)

    +   - if Σ, ¬A ⊢ B and Σ, ¬A ⊢ ¬B, then Σ ⊢ A  (¬ ¬)

    +   - if Σ ⊢ A→B, Σ ⊢ A, then Σ ⊢ B (→ ¬)

    +   - if Σ, A ⊢ B, then Σ ⊢ A→B  (→ +)

    +   - if Σ ⊢ A∧B, then Σ ⊢ A and Σ ⊢ B (∧¬)

    +   - if Σ ⊢ A and Σ ⊢ B, then Σ ⊢ A∧B (∧+)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 17条推理规则


    +   - if  Σ,A ⊢C and  Σ,B ⊢C, then  Σ,A∨B ⊢C  (∨−)

    +   - if  Σ ⊢A, then Σ ⊢A∨B,  Σ ⊢B∨A  (∨+)

    +   - if  Σ ⊢A↔B,  Σ ⊢A, then  Σ ⊢B  (↔−)

    +   - if  Σ,A ⊢B,  Σ,B ⊢A, then  Σ ⊢A↔B  (↔+)

    +   - if  Σ ⊢∀xA(x), then  Σ ⊢A(t)  (∀−)

    +   - if  Σ ⊢A(u), u不在Σ中出现

    +     then  Σ ⊢∀xA(x)  (∀+)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 17条推理规则


    +   - if Σ, A(u) ⊢ B, u不在Σ或B中出现

    +     then Σ, ∃xA(x) ⊢ B

    +     (∃−) 代入

    +   - if Σ ⊢ A(t) then Σ ⊢ ∃xA(x) (∃+)

    +     x替换t（可以只替换部分）

    +   - if Σ ⊢ A(t₁), Σ ⊢ t₁≡t₂ then Σ ⊢ A(t₂)

    +     t₂替换t₁（可以只替换部分） (≡−)

    +   - Φ ⊢ u≡u (≡+)'
