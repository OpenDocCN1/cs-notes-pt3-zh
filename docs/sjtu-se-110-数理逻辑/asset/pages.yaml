- pgno: 149
  md: '# Operations on N-ary relations


    # Join operator $J_p(R,S)$


    Let $R$ be a relation of degree $m$, $S$ a relation of degree $n$, $p\le m,p\le
    n$. $J_p(R,S)$ is a relation of degree $m+n-p$ that consists of all $(m+n-p)$-tuples
    $(a_1,a_2,\ldots a_{m-p},c_1,c_2,\ldots c_p,b_1,b_2,\ldots b_{n-p})$, where $(a_1,a_2,\ldots
    a_{m-p},c_1,c_2,\ldots c_p)$ belongs to $R$ and $(c_1,c_2,\ldots c_p,b_1,b_2,\ldots
    b_{n-p})$ belongs to $S$'
  merge: -1
  img_proc: true
