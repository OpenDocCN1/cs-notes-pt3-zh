- pgno: 14
  md: '# Propositions


    +   - **Definition**

    +     - A declarative statement that is either true (T) or false (F), use *p,q,r*
    to denote proposition usually

    +   - **Examples**

    +     - 1+1=2

    +     - 1+1=3

    +     - Expo2014 will be held in Shanghai

    +     - What is your name?

    +     - Be quiet

    +     - 1+X =5'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Compound Propositions


    +   - **Definition**

    +     - New propositions formed by existing propositions and logical operators


    +   - **Logical Operators**

    +     - ¬ — not

    +     - ∧ — and

    +     - ∨ — or

    +     - ⊕ — xor

    +     - → — implies

    +     - ↔ — biconditional

    +     - *(negation/conjunction/disjunction/exclusive or/implication/biconditional
    implication)*'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# True Table


    +   Let "p,q" be propositions


    | P | ¬P |

    |---|---|

    | T | F |

    | F | T |


    | P | Q | P ∧ Q | P ∨ Q | P ⊕ Q |

    |---|---|---|---|---|

    | T | T | T | T | F |

    | T | F | F | T | T |

    | F | T | F | T | T |

    | F | F | F | F | F |'
  merge: -1
