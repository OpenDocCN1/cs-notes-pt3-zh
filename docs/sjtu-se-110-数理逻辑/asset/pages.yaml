    p

    q

    ────

    ∴ p ∧ q


    conjunction


    p ∧ q → p


    p ∧ q

    ────

    ∴ p


    simplification


    [¬q ∧ (p → q)] → ¬p


    ¬q

    p → q

    ────

    ∴ ¬p


    modus tollens


    [(p → q) ∧ (q → r)] → (p → r)


    p → q

    q → r

    ────

    ∴ p → r


    hypothetical syllogism


    [(p ∨ q) ∧ ¬p] → q


    p ∨ q

    ¬p

    ────────

    ∴ q


    disjunctive syllogism


    [(p ∨ q) ∧ (¬p ∨ r)] → (q ∨ r)


    p ∨ q

    ¬p ∨ r

    ────────────

    ∴ q ∨ r


    resolution'
