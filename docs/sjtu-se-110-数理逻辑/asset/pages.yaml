- pgno: 44
  md: '# Negation of a quantified Prop.


    +   - We can also negate propositions with quantifiers.

    +   - Two important equivalences:

    +     - ¬∀x P(x) ≡ ∃x ¬P(x), It is not the case that for all x P(x) is true ≡
    there must be an x for which P(x) is not true

    +     - ¬∃x P(x) ≡ ∀x ¬P(x), It is not true that there exists an x for which P(x)
    is true ≡ P(x) must be false for all x'
  merge: -1
  img_proc: true
