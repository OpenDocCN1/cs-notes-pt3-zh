- pgno: 260
  md: '# 命题逻辑的完备性


    +   - 完备性证明有多种不同的方法


    +   - 方法一的引理

    +     设A ∈ Form(L^p)含不同的原子公式p₁， p₂， ... ， pₙ， v是真假赋值。对于i=1,2,..., n, 令若pᵢ^v=1，则Aᵢ=pᵢ；否则，Aᵢ=¬pᵢ。则有


    +   - 若A^v=1，则A₁，A₂，...，Aₙ ⊢ A。


    +   - 若A^v=0，则A₁，A₂，...，Aₙ ⊢ ¬A'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 命题逻辑的完备性


    +   - **方法一的定理**：设 $A\in\mathrm{Form}(L^p)$，$\Sigma\subseteq\mathrm{Form}(L^p)$，且
    $\Sigma$ 是有限集，则

    +     - 若 $\Phi\nvdash A$，则 $\Phi\nvdash A$（$A$ 是重言式的话，则 $A$ 是形式上可证明的）

    +     - 若 $\Sigma\nvdash A$，则 $\Sigma\nvdash A$'
