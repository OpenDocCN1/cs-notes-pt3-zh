- pgno: 255
  md: '# 极大协调性


    +   - 定理1：设Σ是极大协调集，那么对于任何A，Σ ⊢ A 当且仅当 A ∈ Σ

    +     - 设 Σ ⊢ A，如果 A ∉ Σ，由 Σ 是极大协调的可知 Σ ∪ {A} 是不协调的。因此 Σ ⊢ ¬A，导出 Σ 不协调，矛盾！因此，A
    ∉ Σ。

    +     - 设 A ∈ Σ，则由推理规则可到 Σ ⊢ A

    +   - 极大协调集 Σ 是封闭于形式可推演的'
