  md: '# Distributive Lattice


    +   - Give a lattice (S, ≤), ∀ a,b,c ∈ S,

    +     - a ∨ (b ∧ c) ≤ (a ∨ b) ∧ (a ∨ c)

    +     - (a ∧ b) ∨ (a ∧ c) ≤ a ∧ (b ∨ c)

    +   - if

    +     - a ∨ (b ∧ c) = (a ∨ b) ∧ (a ∨ c)

    +     - (a ∧ b) ∨ (a ∧ c) = a ∧ (b ∨ c)

