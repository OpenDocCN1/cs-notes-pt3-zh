    # Progress graphs


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_861_0.png)


    A *progress graph* depicts the discrete *execution state space* of concurrent
    threads.


    Each axis corresponds to the sequential order of instructions in a thread.


    Each point corresponds to a possible *execution state* `(Inst₁, Inst₂)`.


    E.g., `(L₁, S₂)` denotes state where thread 1 has completed L₁ and thread 2 has
    completed S₂.'
