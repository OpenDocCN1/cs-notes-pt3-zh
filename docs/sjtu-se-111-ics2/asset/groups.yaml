    \  - high-level instructions were very difficult to generate with a compiler and\
    \ were seldom used\n\n## JOHN COCKE\n\nUnited States – 1987\n\n## CITATION\n\n\
    For significant contributions in the design and theory of compilers, the architecture\
    \ of large systems and the development of reduced instruction set computers (RISC);\
    \ for discovering and systematizing many fundamental transformations now used\
    \ in optimizing compilers including reduction of operator strength, elimination\
    \ of common subexpressions, register allocation, constant propagation, and dead\
    \ code elimination.\n\n## 约翰·科克\n\n约翰·科克，又译为约翰·考克、约翰·寇克，生于美国北卡罗来纳州夏洛特，计算机科学家，在电脑架构及编译器最优化技术方面有重大贡献，因此获得图灵奖。曾提出CYK算法。在他主导的IBM\
    \ 801计划中，首次采用RISC架构，因此被称为RISC架构之父。荣誉颇多。\n\n生于：1925 年 5 月 30 日，美国北卡罗来纳州夏洛特 (北卡罗来纳州)\n\
    \n逝于：2002 年 7 月 16 日，美国纽约州瓦尔哈拉\n\n教育背景：杜克大学 (1953 年)，杜克大学 (1946 年)\n\n所获奖项：图灵奖，约翰·冯诺依曼奖\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1093_0.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1093_1.png)\n\
    \n## CISC vs. RISC\n\n## CISC\n\n## RISC\n\nMultiple formats for specifying operands.\n\
    e.g., a memory operand specifier can have many different combinations of displacement,\
