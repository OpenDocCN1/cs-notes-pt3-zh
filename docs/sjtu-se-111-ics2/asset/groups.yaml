    \nL1 miss\n\nCT | CI | CO\n\n20 | 7 | 5\n\n## P6 页表\n\n- 页目录\n  - 1024 个 4 字节的页目录项（PDEs），指向页表\n\
    \  - 每个进程一个页目录。\n  - 其进程运行时页目录必须在内存中\n  - 始终由 PDBR 指向\n- 页表：\n  - 1024 个 4 字节的页表项（PTEs），指向页。\n\
    \  - 页表可以分页进出。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_998_0.png)\n\n## P6\
