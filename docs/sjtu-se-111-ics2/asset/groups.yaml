  mdcn: "\n\n## 同步异常\n\n- 故障\n  - 非故意但可能可恢复\n  - 要么重新执行出错的（“当前”）指令，要么中止。\n  - 示例：页故障（可恢复）、保护故障（不可恢复）\n\
    - 中止\n  - 非故意且不可恢复\n  - 中止当前程序\n  - 示例：奇偶校验错误、机器检查\n\n## 同步异常\n\n- IA32 系统中的异常\n\
    \n| 异常编号 | 描述 | 异常类别 |\n|---|---|---|\n| 0 | 除法错误 | 故障 |\n| 13 | 常规保护故障 | 故障 |\n\
    | 14 | 页故障 | 故障 |\n| 18 | 机器检查 | 中止 |\n| 32–127 | 操作系统定义的异常 | 中断或陷阱 |\n| 128 (0x80)\
    \ | 系统调用 | 陷阱 |\n| 129–255 | 操作系统定义的异常 | 中断或陷阱 |\n\n## 故障示例 #1\n\n- 内存引用\n  -\
    \ 用户写入内存位置\n  - 用户内存的该部分（页）当前在磁盘上\n\n```c\nint a[1000];\nmain ()\n{\n    a[500]\
    \ = 13;\n}\n```\n\n```\n80483b7: c7 05 10 9d 04 08 0d  movl  $0xd,0x8049d10\n\
    ```\n\n- 内存引用\n  - 页故障处理程序必须将页加载到物理内存中\n  - 返回到出错指令\n  - 第二次尝试成功\n\n```c\nint\
