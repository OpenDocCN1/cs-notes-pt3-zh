  mdcn: "\n\n## 并发方法\n\n- **进程**\n  - 难以共享资源：易于避免非预期共享\n  - 增加/移除客户端开销高\n- **线程**\n\
    \  - 易于共享资源：也许太容易了\n  - 中等开销\n  - 对调度策略控制不多\n  - 调试困难：事件顺序不可重复\n- **I/O 多路复用**\n\
    \  - 繁琐且底层\n  - 对调度完全控制\n  - 开销非常低\n  - 无法创建更细粒度的并发级别\n  - 不能利用多核\n\n## 进程的传统视图\n\
    \n- 进程 = 进程上下文 + 代码、数据和栈\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_838_0.png)\n\
    \n## 进程的替代视图\n\n- 进程 = 线程 + 代码、数据和内核上下文\n\nThread (main thread)\n\nCode and Data\n\
    \nstack\n\nSP\n\nbrk\n\nPC\n\n0\n\nshared libraries\n\nrun-time heap\n\nread/write\
    \ data\n\nread-only code/data\n\nThread context:\nData registers\nCondition codes\n\
    Stack pointer (SP)\nProgram counter (PC)\n\nKernel context:\nVM structures\nDescriptor\
    \ table\nbrk pointer\n\n## 具有多个线程的进程\n\n- 可以将多个线程与一个进程关联\n  - 每个线程都有自己的逻辑控制流（PC\
    \ 值序列）\n  - 每个线程共享相同的 **代码**、**数据** 和 **内核上下文**\n  - 每个线程有自己的 **线程 id**（TID）\n\
    \n## 线程的逻辑视图\n\n- 与进程关联的线程形成一组对等体\n  - 不同于形成树层次结构的进程\n\nThreads associated with\
    \ process foo\n\nProcess hierarchy\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_842_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_842_1.png)\n\n## 基于线程设计的优缺点\n\n- +\
    \ 线程间易于 **共享** 数据结构\n  - 例如，日志信息、文件缓存。\n- + 线程比进程更 **高效**\n- - **非预期共享** 可能引入难以重现的微妙错误！\n\
    \  - 数据易于共享既是线程的最大优势，也是最大弱点\n  - 难以知道哪些数据被共享以及哪些是私有的\n\n## 线程化 C 程序中的共享变量\n\n\
    - C 程序中哪些变量是共享的或不共享的？\n  - 线程的内存模型是什么？\n  - 变量的实例如何映射到内存？\n  - 有多少线程引用这些实例中的每一个？\n\
    \n## 线程内存模型\n\n- 概念模型：\n  - 每个线程在进程的上下文中运行。\n  - 每个线程有自己独立的线程上下文\n    - 线程 ID、栈、栈指针、程序计数器、条件码和通用寄存器\n\
    \  - 所有线程共享剩余的进程上下文\n    - 进程虚拟地址空间的代码、数据、堆和共享库段\n    - 打开的文件和已安装的处理程序\n\n## 共享变量分析\n\
    \n```c\n#include \"csapp.h\"\n#define N 2\nvoid *thread(void *vargp);\n\nchar\
    \ **pptr; /* global variable */\n```\n\n## 共享变量分析\n\n```c\n#include \"csapp.h\"\
    \n#define N 2\nvoid *thread(void *vargp);\n\nchar **ptr;\n/* global variable */\n\
    \nint main()\n{\n    int i;\n    pthread_t tid;\n    char *msgs[N] = {\n     \
    \   \"Hello from foo\",\n        \"Hello from bar\"\n    };\n\n    ptr = msgs;\n\
    \    for (i = 0; i < N; i++)\n        Pthread_create(&tid, NULL, thread, (void\
    \ *)i);\n    Pthread_exit(NULL);\n}\n```\n\n## 共享变量分析\n\n```\n21 void *thread(void\
    \ *var gp)\n22 {\n23     int myid = (int)var gp;\n24     static int cnt = 0;\n\
    25\n26     printf(\"[ %d]:%s(cnt=%d)\\n\", myid, ptr[myid], ++cnt);\n}\n```\n\n\
    ## 变量实例到内存的映射\n\n- 全局变量\n  - 定义：函数外部声明的变量\n  - 虚拟内存包含任何全局变量的确切一个实例\n- 局部变量\n \
    \ - 定义：函数内部声明且不带 static 属性的变量\n  - 每个线程栈包含每个局部变量的一个实例\n- 局部静态变量\n  - 定义：函数内部声明并带\
    \ static 属性的变量\n  - 虚拟内存包含任何局部静态变量的确切一个实例。\n\n"
