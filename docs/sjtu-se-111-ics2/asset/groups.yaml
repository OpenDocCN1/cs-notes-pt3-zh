    \ and Robust I/O\n\n- Standard I/O and RIO are implemented using low-level Unix\
    \ I/O\n- Which ones should you use in your programs?\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_654_0.png)\n\
    \n## Pros and Cons of Unix I/O\n\n- **Pros**\n  - Unix I/O is the most general\
    \ and lowest overhead form of I/O.\n    - All other I/O packages are implemented\
    \ using Unix I/O functions.\n  - Unix I/O provides functions for accessing file\
    \ metadata.\n  - Unix I/O functions are async-signal-safe and can be used safely\
    \ in signal handlers.\n\n## Pros and Cons of Unix I/O\n\n- **Cons**\n  - Dealing\
    \ with short counts is tricky and error prone.\n  - Efficient reading of text\
    \ lines requires some form of buffering, also tricky and error prone.\n  - Both\
    \ of these issues are addressed by the standard I/O and RIO packages.\n\n## Pros\
    \ and Cons of Standard I/O\n\n- Pros:\n  - Buffering increases efficiency by decreasing\
    \ the number of `read` and `write` system calls\n  - Short counts are handled\
    \ automatically\n\n## Pros and Cons of Standard I/O\n\n- Cons:\n  - Provides no\
    \ function for accessing file metadata\n  - Standard I/O functions are not async-signal-safe,\
    \ and not appropriate for signal handlers.\n  - Standard I/O is not appropriate\
    \ for input and output on network sockets\n    - There are poorly documented restrictions\
    \ on streams that interact badly with restrictions on sockets\n\n## Choosing I/O\
    \ Functions\n\n- General rule: use the highest-level I/O functions you can\n \
    \ - Many C programmers are able to do all of their work using the standard I/O\
    \ functions\n\n## Choosing I/O Functions\n\n- When to use standard I/O\n  - When\
    \ working with disk or terminal files\n- When to use raw Unix I/O\n  - Inside\
    \ signal handlers, because Unix I/O is async-signal-safe.\n  - In rare cases when\
    \ you need absolute highest performance.\n- When to use RIO\n  - When you are\
    \ reading and writing network sockets.\n  - Avoid using standard I/O on sockets.\n\
    \n## Networking Programming\n\n## Outline\n\n- Client-Server Programming Model\n\
