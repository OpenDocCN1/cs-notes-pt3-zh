  mdcn: "\n\n## 异常处理的其余部分\n- 调用异常处理程序\n  - 将 PC 压入栈\n    - 要么是出错指令的 PC，要么是下一条指令的 PC\n\
    \    - 通常与异常状态一起通过流水线传递\n  - 跳转到处理程序地址\n    - 通常是固定地址\n    - 定义为 ISA 的一部分\n- 实现\n\
    \  - 还没尝试过！\n\n## 处理器总结\n- **设计技术**\n  - 为所有指令创建统一框架\n    - 希望在指令之间共享硬件\n  - 用控制逻辑的位连接标准逻辑块\n\
    - **操作**\n  - 状态保存在存储器和时钟寄存器中\n  - 计算由组合逻辑完成\n  - 对寄存器/存储器的时钟控制足以控制整体行为\n- **提高性能**\n\
    \  - 流水线提高吞吐量并改善资源利用率\n  - 必须确保保持 ISA 行为\n\n## 大纲\n- 性能分析\n- 建议阅读 4.5.12\n\n##\
    \ 性能指标\n- 时钟频率\n  - 以吉赫兹为单位测量\n  - 是阶段划分和电路设计的功能\n    - 保持每个阶段的工作量小\n- 指令执行的速率\n\
    \  - CPI：每条指令的周期数\n  - 平均而言，每条指令需要多少个时钟周期？\n  - 是流水线设计和基准程序的功能\n    - 例如，分支预测错误发生的频率如何？\n\
    \n## CPI for PIPE (Cont.)\n• LP：由于 load/use 冒险停顿造成的惩罚\n– 是负载指令的指令比例  \n  0.25\n\
    – 需要停顿的负载指令比例  \n  0.20\n– 每次注入的气泡数  \n  1\n⇒ LP = 0.25 × 0.20 × 1 = **0.05**\n\
    • MP：由于分支预测错误造成的惩罚\n– 是条件跳转的指令比例  \n  0.20\n– 条件跳转预测错误的比例  \n  0.40\n– 每次注入的气泡数\
    \  \n  2\n⇒ MP = 0.20 × 0.40 × 2 = **0.16**\n\n## 现代处理器\n\n## 大纲\n- 理解现代处理器\n\
    \  - 超标量\n  - 乱序执行\n- 建议阅读\n  - 5.7\n\n## 回顾\n- 与机器无关的优化\n  - 消除循环低效\n  - 减少过程调用\n\
    \  - 消除不必要的内存引用\n\n## 回顾\n```\nvoid combine1(vec_ptr v, data_t *dest)\n{\n   \
    \ long int i;\n    *dest = IDENT;\n\n    for (i = 0; i < vec_length(v); i++) {\n\
    \        data_t val;\n        get_vec_element(v, i, &val);\n        *dest = *dest\
    \ OP val;\n    }\n}\n```\n```\nvoid combine4(vec_ptr v, data_t *dest)\n{\n   \
    \ long int i;\n    long int length = vec_length(v);\n    data_t *data = get_vec_start(v);\n\
    \    data_t x = IDENT;\n\n    for (i = 0; i < length; i++)\n        x = x OP data[i];\n\
    \    *dest = x;\n}\n```\n\n| 函数 | 整数 |  | 浮点 |  |  |\n| | + | * | + | F* | D*\
    \ |\n| combine1 | 12 | 12 | 12 | 12 | 13 |\n| combine4 | 2 | 3 | 3 | 4 | 5 |\n\
    \n## 现代处理器\n- 超标量\n  - 每个时钟周期执行多个操作\n  - 指令级并行\n- 乱序执行\n  - 指令执行的顺序不必对应于它们在汇编程序中的顺序\n\
    \n## 指令控制\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_302_0.png)\n\n## 执行\n\n##\
    \ 现代处理器\n- 两个主要部分\n  - 指令控制单元 (ICU)\n    - 负责从内存读取一系列指令\n    - 从上述指令生成一组要在程序数据上执行的基本操作\n\
    \  - 执行单元 (EU)\n    - 执行这些操作\n\n## 指令控制单元\n- 指令缓存\n  - 一个特殊的高速存储器，包含最近访问的指令。\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_304_0.png)\n\n"
