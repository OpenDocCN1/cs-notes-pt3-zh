    # Shared Object


    +   - Shared Object

    +     - An object which is mapped into an area of virtual memory of a process

    +     - Any writes that the process makes to that area are visible to any other
    processes that have also mapped the shared object into their virtual memory

    +     - The changes are also reflected in the original object on disk

    +   - Shared Area

    +     - A virtual memory area that a shared object is mapped'
