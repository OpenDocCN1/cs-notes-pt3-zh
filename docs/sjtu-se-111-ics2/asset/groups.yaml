  mdcn: "\n\n# 进程\n\n- 定义：*进程* 是正在运行的程序的一个实例。\n- 进程是计算机科学中最深刻的概念之一。\n- 系统中的每个程序都在某个进程的上下文中运行\n\
    \n# 何时创建新进程\n\n- 每次用户运行一个程序时\n  - 通过在 shell 中输入可执行对象文件的名称，\n- shell 会创建一个新进程\n\
    - 然后在该新进程的上下文中运行可执行对象文件\n\n# 何时创建新进程\n\n- 应用程序也可以\n  - 创建新进程\n  - 并在\n    - 其自身\n\
    \    - 或其他应用程序\n  - 的新进程上下文中运行\n\n# 进程\n\n- 进程为每个程序提供两个关键抽象：\n  - 逻辑控制流\n    -\
    \ 让每个程序产生它独占使用 CPU 的错觉。\n  - 私有地址空间\n    - 让每个程序产生它独占使用主内存的错觉\n\n# 进程\n\n- 这种错觉是如何维持的？\n\
    \  - 进程执行被交错进行（多任务处理）\n  - 地址空间由虚拟内存系统管理\n\n# 进程\n\n- 并发\n  - 多个进程可以并发运行\n  -\
    \ 一个进程的指令与另一个进程的指令交错进行\n\n# 逻辑控制流\n\n- 每个进程都有自己的逻辑控制流\n  - 不会影响任何其他进程的状态\n- 被抢占\n\
    - 时间片\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_395_0.png)\n\n# 并发进程\n\n- 两个进程并发运行\n\
    \  - 如果它们的时间流在时间上重叠，则为并发。\n- 否则，它们是顺序的。\n- 示例：\n  - 并发：A & B，A&C\n  - 顺序：B & C\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_396_0.png)\n\n# 并发进程的用户视图\n\n- 并发进程的控制流在物理上在时间上是分离的。\n\
    - 然而，我们可以认为并发进程彼此并行运行。\n- 多任务处理或时间片\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_397_0.png)\n\
    \n# 进程的上下文\n\n- 上下文由程序正确运行所需的全部状态组成\n- 该状态包括\n  - 程序的代码和数据存储在内存中\n  - 它的栈\n  -\
    \ 它的通用寄存器的内容\n  - 它的程序计数器\n  - 环境变量\n  - 以及打开的文件描述符集合\n\n# 操作系统提供的抽象\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_399_0.png)\n\
    \n# 私有地址空间\n\n- 每个进程都有自己的私有地址空间\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_400_0.png)\n\
    \n# 虚拟内存\n\n- 一个抽象\n  - 每个进程似乎独占使用主内存\n  - 虚拟地址空间\n    - 程序代码和数据（全局变量）\n    -\
    \ 堆\n    - 共享库（标准库和数学库）\n    - 栈（函数调用）\n    - 内核（操作系统）\n  - 硬件支持虚拟地址的转换\n\n# 操作系统提供的抽象\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_402_0.png)\n\n# 文件\n\n- 一系列字节\n- 每个\
    \ I/O 设备都被建模为一个文件\n- Unix I/O\n  - 使用一组小的系统调用读写文件\n  - 系统中的所有输入输出都通过 Unix I/O\
    \ 执行\n\n# 大纲\n\n- 异常\n- 建议阅读 8.1\n\n# 控制流\n\n- 从启动到关闭，CPU 只是简单地读取并执行（解释）一系列指令，一次一条。\n\
    - 这个序列是系统的物理控制流（或控制流）。\n\n时间\n物理控制流\n<startup>\ninst₁\ninst₂\ninst₃\n...\ninstₙ\n\
    <shutdown>\n\n# 修改控制流\n\n- 我们讨论了两种改变控制流的机制：\n  - 跳转和分支\n  - 使用栈规则的调用和返回。\n  -\
    \ 两者都对程序状态的变化做出反应。\n- 我们如何改变进程之间的控制流（多任务处理）？\n\n"
