  mdcn: "\n\n## 重新讨论共享：共享对象\n\n进程 1  \n虚拟内存\n\n物理  \n内存\n\n进程 2  \n虚拟内存\n\n共享  \n\
    对象\n\n- 进程 1 映射共享对象\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1046_0.png)\n\n\
    ## 重新讨论共享：共享对象\n\n进程 1  \n虚拟内存\n\n物理  \n内存\n\n进程 2  \n虚拟内存\n\n共享  \n对象\n\n- 进程\
    \ 2 映射共享对象\n- 注意，虚拟地址可以不同\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1047_0.png)\n\
    \n## 写时复制\n\n- 私有对象以与共享对象完全相同的方式开始生命周期：物理内存中只存储一份私有对象副本。\n\n## 重新讨论 Fork()\n\n\
    - 使用 fork 创建新进程\n  - 写时复制\n  - 将可写区域的页面设置为只读\n  - 将这些区域的 vm_area_struct 标记为私有的“写时复制”。\n\
    \  - 任一进程对这些页面执行写操作都会导致缺页异常\n    - 缺页异常处理程序识别出写时复制，创建页面副本，并恢复写权限。\n\n## 写时复制\n\
    \n- 对于映射私有对象的每个进程\n  - 相应私有区域的页表项被标记为只读\n  - 区域结构被标记为私有写时复制\n  - 只要两个进程都不尝试写入各自的私有区域，它们就会继续共享物理内存中的同一份对象副本。\n\
    \n## 写时复制\n\n- 对于映射私有对象的每个进程\n  - 缺页异常处理程序\n    - 在物理内存中创建页面的新副本\n    - 更新页表项，使其指向新副本\n\
    \    - 恢复页面的写权限\n\n## 重新讨论共享：私有 COW 对象\n\n进程 1  \n虚拟内存\n\n物理  \n内存\n\n进程 2  \n\
    虚拟内存\n\n写时复制\n\n写入私有写时复制页面\n\n私有  \n写时复制对象\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1054_0.png)\n\
    \n## 重新讨论 Fork()\n\n- 使用 fork 创建新进程：\n  - 最终结果：\n    - 只有在绝对必要时才延迟复制，也就是说，直到其中一个进程尝试修改共享页面时才进行复制。\n\
    \n## 虚拟内存\n\n## 情况 1\n\n- 在 32 位机器中，我们将虚拟地址划分为以下 4 个部分：\n- 我们使用三级页表，其中前 7 位用于第一级，依此类推。\n\
    - 物理地址为 44 位，并且每页有 4 个保护位。（字节对齐）\n\n| 8 位 | 4 位 | 8 位 | 12 位 |\n\n## 情况 1\n\n\
    - 这种系统中的页面大小是多少？\n  - 4K（2¹²）\n- 对于一个从地址 0 开始、拥有 128K 内存的进程，页表消耗多少内存，内部碎片浪费多少内存？\n\
    \  - #L3-entry：2⁸ = 256，条目大小：5 字节（44-12+4 位）\n  - #L2-entry：2⁴ = 16，条目大小：5 字节（44-8+4\
    \ 位）\n  - #L1-entry：2⁸ = 256，条目大小：6 字节（44-4+4 位）\n\n## 情况 1\n\n- 对于一个从地址 0 开始、拥有\
    \ 128K 内存的进程，页表消耗多少内存，内部碎片浪费多少内存？\n  - 128K = 4K * 32 → 1 个 L1 + 1 个 L2 + 1 个\
    \ L3\n  - L3：256 * 5 = 1280 字节\n  - L2：16 * 5 = 80 字节\n  - L1：256 * 6 = 1536 字节\n\
    \  - 内存：1280 + 80 + 1536 = 2896 字节\n  - 内部碎片：1*(5*8-36) + 1*(5*8-40) + 32*(6*8-44)\
    \ = 132 位\n\n## 情况 2\n\n图 1\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1061_0.png)\n\
    \n## 进程 A\n\n## 物理内存\n\n读/写\n\nvm_end  \nvm_start  \n[]  \nvm_next\n\n栈\n\n共享库数据\n\
    \n共享库代码\n\n堆\n\nBSS\n\n数据  \n(.data)\n\n代码  \n(.text, .rodata)\n\n63  \n47  \n\
