    # Instruction Set Architecture #2


    +   - Assembly Language View

    +     - Processor state

    +       - Registers, memory, ...

    +     - Instructions

    +       - `addl, movl, leal, ...`

    +       - How instructions are encoded as bytes

    +   - Layer of Abstraction

    +     - Above: how to program machine

    +       - Processor executes instructions in a sequence

