    \ (`pending & ~blocked`)\n  - If this set is empty (the usual case)\n    - then\
    \ the kernel passes control to the next instruction (Iₙₑₓₜ) in the logical control\
    \ flow of p.\n  - However, if the set is nonempty\n    - then the kernel chooses\
    \ some signal k in the set (typically the smallest k)\n    - and forces p to receive\
    \ signal k.\n\n## Receiving a Signal\n\n- The receipt of the signal triggers some\
    \ action by the process.\n- Once the process completes the action, then control\
    \ passes back to the next instruction (Iₙₑₓₜ) in the logical control flow of p.\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_558_0.png)\n\n## Receiving a Signal\n\
    \n- Each signal type has a predefined default action, which is one of the following:\n\
    \  - The process terminates.\n  - The process terminates and dumps core.\n  -\
    \ The process stops until restarted by a SIGCONT signal.\n  - The process ignores\
    \ the signal.\n\n## Receiving a Signal\n\n- SIGKILL\n  - The default action is\
    \ to terminate the receiving process\n- SIGCHLD\n  - The default action is to\
    \ ignore the signal.\n\n## Receiving a Signal\n\n- A process can modify the default\
    \ action associated with a signal\n  - by using the `signal` function\n  - The\
    \ only exceptions are SIGSTOP and SIGKILL, whose default actions cannot be changed.\n\
    \n## Signal Function\n\n```\n#include <signal.h>\ntypedef void handler_t(int)\n\
    handler_t *signal(int signum, handler_t *handler)\nreturns: ptr to previous handler\
    \ if OK, SIG_ERR on error (does not set errno)\n```\n\n- Three ways to change\
    \ default actions:\n  - If handler is SIG_IGN, then signals of type signum are\
    \ ignored.\n  - If handler is SIG_DFL, then the action for signals of type signum\
    \ reverts to the default action.\n  - Otherwise, change action to handler (called\
    \ signal handler)\n\n## Signal Function\n\n- Installing the handler\n  - Changing\
