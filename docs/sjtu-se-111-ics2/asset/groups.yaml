  md: "\n- Thus 2N^3/B + N^2 words accessed in main memory.\n- Larger B, Larger performance\
    \ gain?\n  - Choose an appropriate Blocking factor, so that cache is fully occupied\
    \ by data to be reused\n- Yes, but not always.\n- As to fully associative cache\
    \ with LRU policy, it’s right.\n  - Cache fully used.\n- In practice, caches are\
    \ direct mapped or have at most a small degree of set associativity.\n  - Map\
    \ multiple rows of a matrix to the same cache line, making it infeasible to try\
    \ to fully use cache.\n- Moreover, varies drastically with matrix size\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1152_0.png)\n\
    \n## Some facts\n\n- Indeed, all these optimization jobs can be done by Compiler.\
