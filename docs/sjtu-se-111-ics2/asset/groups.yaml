    \ by peer thread-1? |\n|---|---|---|---|\n| ptr | yes | yes | yes |\n| cnt | no\
    \ | yes | yes |\n| i.m | yes | no | no |\n| msgs.m | yes | yes | yes |\n| myid.p0\
    \ | no | yes | no |\n| myid.p1 | no | no | yes |\n\n## Shared variable analysis\n\
    \n- Answer: A variable x is shared iff multiple threads reference at least one\
    \ instance of x\n- Thus:\n  - ptr, cnt, and msgs are shared.\n  - i and myid are\
    \ NOT shared.\n\n## Shared variable analysis\n\n```\n#include \"csapp.h\"\n#define\
    \ NITERS 100000000\nvoid *count(void *arg);\n/* shared variable */\nunsigned int\
    \ cnt = 0;\n\nint main()\n{\n    pthread_t tid1, tid2;\n\n    Pthread_create(&tid1,\
    \ NULL, count, NULL);\n    Pthread_create(&tid2, NULL, count, NULL);\n    Pthread_join(tid1,\
    \ NULL);\n    Pthread_join(tid2, NULL);\n\n    if (cnt != (unsigned)NITERS*2)\n\
    \        printf(\"BOOM! cnt=%d\\n\", cnt);\n    else\n        printf(\"OK cnt=%d\\\
    n\", cnt);\n    exit(0);\n}\n```\n\n## Shared variable analysis\n\n```c\n/* thread\
    \ routine */\nvoid *count(void *arg)\n{\n    int i;\n    for (i=0; i<NITERS; i++)\n\
    \        cnt++;\n    return NULL;\n}\n```\n\n## Shared variable analysis\n\n```\n\
    linux> badcnt\nBOOM! cnt=198841183\n\nlinux> badcnt\nBOOM! cnt=198261801\n\nlinux>\
    \ badcnt\nBOOM! cnt=198269672\n```\n\n- cnt should be equal to 200,000,000.\n\
    - What went wrong?!\n\n## Assembly code for counter loop\n\nC code for thread\
    \ i\n\n```\nfor (i=0; i<NITERS; i++)\ncnt++;\n```\n\n## Assembly code for counter\
    \ loop\n\n### Asm code for thread i\n\nHead (Hᵢ)\n\nLoad cnt (Lᵢ)\nUpdate cnt\
    \ (Uᵢ)\nStore cnt (Sᵢ)\n\nTail (Tᵢ)\n\n```\n.L9:\n    movl -4(%ebp),%eax #i:-4(%ebp)\n\
    \    cmpl $99999999,%eax\n    jle .L12\n    jmp .L10\n.L12:\n    movl cnt,%eax\
    \     # Load\n    leal 1(%eax),%edx # Update\n    movl %edx,cnt     # Store\n\
    .L11:\n    movl -4(%ebp),%eax\n    leal 1(%eax),%edx\n    movl %edx,-4(%ebp)\n\
    \    jmp .L9\n.L10:\n```\n\n## Concurrent execution\n\n| i(thread) | instr_i |\
    \ %eax_1 | %eax_2 | cnt |\n|---|---|---|---|---|\n| 1 | H₁ | - | - | 0 |\n| 1\
    \ | L₁ | 0 | - | 0 |\n| 1 | U₁ | 1 | - | 0 |\n| 1 | S₁ | 1 | - | 1 |\n| 2 | H₂\
    \ | - | - | 1 |\n| 2 | L₂ | - | 1 | 1 |\n| 2 | U₂ | - | 2 | 1 |\n| 2 | S₂ | -\
    \ | 2 | 2 |\n| 2 | T₂ | - | 2 | 2 |\n| 1 | T₁ | 1 | - | 2 |\n\nOK\n\n## Concurrent\
    \ execution (cont)\n\n- Incorrect ordering: two threads increment the counter,\
    \ but the result is 1 instead of 2.\n\n| i (thread) | instr_i | %eax_1 | %eax_2\
    \ | cnt |\n|---|---|---|---|---|\n| 1 | H₁ | - | - | 0 |\n| 1 | L₁ | 0 | - | 0\
    \ |\n| 1 | U₁ | 1 | - | 0 |\n| 2 | H₂ | - | - | 0 |\n| 2 | L₂ | - | 0 | 0 |\n\
    | 1 | S₁ | 1 | - | 1 |\n| 1 | T₁ | 1 | - | 1 |\n| 2 | U₂ | - | 1 | 1 |\n| 2 |\
    \ S₂ | - | 1 | 1 |\n| 2 | T₂ | - | 1 | 1 |\n\n## Progress graphs\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_861_0.png)\n\
    \nA *progress graph* depicts the discrete *execution state space* of concurrent\
    \ threads.\n\nEach axis corresponds to the sequential order of instructions in\
    \ a thread.\n\nEach point corresponds to a possible *execution state* `(Inst₁,\
    \ Inst₂)`.\n\nE.g., `(L₁, S₂)` denotes state where thread 1 has completed L₁ and\
    \ thread 2 has completed S₂.\n\n## Trajectories in progress graphs\n\nThread 2\n\
    \nT₂\n\nS₂\n\nU₂\n\nL₂\n\nH₂\n\nH₁ L₁ U₁ S₁ T₁ Thread 1\n\nA *trajectory* is a\
    \ sequence of legal state transitions that describes one possible concurrent execution\
    \ of the threads.\n\nExample:\n\nH1, L1, U1, H2, L2, S1, T1, U2, S2, T2\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_862_0.png)\n\
    \n## Critical sections and unsafe regions\n\nThread 2\n\nThread 1\n\nT₂\n\nS₂\n\
    \nU₂\n\nL₂\n\nH₂\n\nH₁\n\nL₁\n\nU₁\n\nS₁\n\nT₁\n\ncritical section wrt cnt\n\n\
