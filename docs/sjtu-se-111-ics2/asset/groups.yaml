  mdcn: "\n\n## 从键盘发送信号\n\n- 输入 `ctrl-z`\n  - 向 shell 发送一个 SIGTSTP 信号\n  - shell 捕获该信号\n\
    \  - 向前台进程组中的每个进程发送 SIGTSTP 信号\n  - 结果是停止（挂起）前台作业（默认）\n\n## 使用 kill 函数发送信号\n\n\
    ```\n#include <sys/types.h>\n#include <signal.h>\nint kill(pid_t pid, int sig);\n\
    returns: 0 if OK, -1 on error\n```\n\n- 如果 pid 大于零，\n  - 则 kill 函数向进程 pid 发送信号号\
    \ sig\n- 如果 pid 小于零\n  - 则 kill 向进程组 abs(pid) 中的每个进程发送信号 sig\n\n## 接收信号\n\n- 前提条件\n\
    \  - 当内核从异常处理程序返回时\n  - 并且准备好将控制权传递给进程 p\n\n## 接收信号\n\n- 操作\n  - 内核检查未被阻塞的待处理信号集合（`pending\
    \ & ~blocked`）\n  - 如果该集合为空（通常情况）\n    - 则内核将控制权传递给 p 的逻辑控制流中的下一条指令（Iₙₑₓₜ）。\n\
    \  - 然而，如果该集合非空\n    - 则内核在该集合中选择某个信号 k（通常是最小的 k）\n    - 并强制 p 接收信号 k。\n\n## 接收信号\n\
    \n- 信号的接收会触发进程的某种操作。\n- 一旦进程完成该操作，则控制权返回到 p 的逻辑控制流中的下一条指令（Iₙₑₓₜ）。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_558_0.png)\n\
    \n## 接收信号\n\n- 每种信号类型都有一个预定义的默认动作，其为以下之一：\n  - 进程终止。\n  - 进程终止并转储核心。\n  - 进程停止，直到被\
    \ SIGCONT 信号重启。\n  - 进程忽略该信号。\n\n## 接收信号\n\n- SIGKILL\n  - 默认动作是终止接收进程\n- SIGCHLD\n\
    \  - 默认动作是忽略该信号。\n\n## 接收信号\n\n- 进程可以通过以下方式修改与信号关联的默认动作\n  - 使用 `signal` 函数\n\
    \  - 唯一例外是 SIGSTOP 和 SIGKILL，其默认动作不可更改。\n\n## Signal 函数\n\n```\n#include <signal.h>\n\
    typedef void handler_t(int)\nhandler_t *signal(int signum, handler_t *handler)\n\
    returns: ptr to previous handler if OK, SIG_ERR on error (does not set errno)\n\
    ```\n\n- 更改默认动作的三种方式：\n  - 如果 handler 是 SIG_IGN，则类型为 signum 的信号将被忽略。\n  - 如果 handler\
    \ 是 SIG_DFL，则类型为 signum 的信号的动作恢复为默认动作。\n  - 否则，将动作更改为 handler（称为信号处理程序）\n\n##\
    \ Signal 函数\n\n- 安装处理程序\n  - 通过向 `signal` 函数传递处理程序的地址来更改默认动作\n- 捕获信号\n  - 处理程序的调用\n\
    - 处理信号\n  - 处理程序的执行\n\n```c\n#include \"csapp.h\"\n\nvoid handler(int sig) /*\
    \ SIGINT handler */\n{\n    printf(\"Caught SIGINT\\n\");\n    exit(0);\n}\n\n\
    int main()\n{\n    /* Install the SIGINT handler */\n    if (signal(SIGINT, handler)\
    \ == SIG_ERR)\n        unix_error(\"signal error\");\n\n    pause(); /* wait for\
    \ the receipt of a signal */\n\n    exit(0);\n}\n```\n\n## Signal 函数\n\n- 处理信号\n\
    \  - 当进程捕获类型为 k 的信号时，\n  - 为信号 k 安装的处理程序会被调用\n    - 带有单个整数参数，设置为 k。\n  - 当处理程序执行其\
    \ **return** 语句时，\n    - 控制权（通常）返回到进程控制流中\n      - 被信号接收中断的那条指令。\n      - 在某些系统中，被中断的系统调用会立即返回错误。\n\
    \n## Signal 函数\n\n- 同一个处理程序函数可用于捕获不同类型的信号\n  - 通过将不同的信号号设置为信号处理程序的参数\n\n"
