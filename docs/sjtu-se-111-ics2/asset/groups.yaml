    \    sizeof(clientaddr.sin_addr.s_addr), AF_INET);\nhaddrp = inet_ntoa(clientaddr.sin_addr);\n\
    printf(\"server connected to %s (%s)\\n\",\n    hp->h_name, haddrp);\n```\n\n\
    ## Echo server: echo ()\n\n- The server uses Unix I/O to read and echo text lines\
    \ until EOF (end-of-file) is encountered.\n- EOF notification caused by client\
    \ calling `close(clientfd)`.\n- NOTE: EOF is a condition, not a data byte.\n\n\
    ## Echo server: echo()\n\n```\nvoid echo(int connfd)\n{\n    size_t n;\n    char\
