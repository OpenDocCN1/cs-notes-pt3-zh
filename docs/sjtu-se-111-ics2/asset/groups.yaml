  md: "\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_128_0.png)\n\n## SEQ CPU Implementation\n\
    \n## Outline\n\n- SEQ Implementation\n- Suggested Reading 4.3.2, 4.3.4\n\n## What\
    \ we will discuss today?\n\n- The implementation of a sequential CPU (SEQ)\n \
    \ - Every instruction is finished in one cycle.\n  - Instructions execute sequentially.\n\
    \  - No two instructions execute in parallel or overlap.\n\n## SEQ Hardware Structure\n\
    \n- Stages\n  - **Fetch**: Read instruction from memory\n  - **Decode**: Read\
    \ program registers\n  - **Execute**: Compute value or address\n  - **Memory**:\
    \ Read or write data\n  - **Write Back**: Write program registers\n  - **PC**:\
    \ Update program counter\n\nPC\n\nWrite Back\n\nMemory\n\nExecute\n\nDecode\n\n\
    Fetch\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_133_0.png)\n\nvalM\n\nData memory\n\
    \naddrs, data\n\na\n\nvalE\n\nCC\n\nALU\n\naluA, aluB\n\nvalA, valB\n\nsrcA, srcB\n\
    \ndstE, dstM\n\nA B F  \nRegister File\n\nvalE, valM\n\nicode:ifun,  \nrA:rB\n\
    \nInstruction memory\n\nPC increment\n\nPC\n\nnewPC\n\n## Difference between semantics\
    \ and implementation\n\n- ISA\n  - Every stage may update some state; these updates\
    \ occur sequentially.\n- SEQ\n  - All state update operations occur simultaneously\
    \ at the clock rising edge.\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_135_0.png)\n\
    \n## SEQ Hardware\n\n- Blue boxes: □ redesigned hardware blocks\n  - e.g., memories,\
    \ ALU\n- Gray boxes: ▭ control logic\n  - Described in HCL\n- White ovals: ○ labels\
    \ for signals\n- Thick lines: → 32-bit word values\n- Thin lines: → 4–8-bit values\n\
    - Dotted lines: .......→ 1-bit values\n\n## Fetch Logic\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_137_0.png)\n\
    \n## Fetch Logic\n\n- Predefined Blocks\n  - PC: Register containing PC\n  - Instruction\
    \ memory: Read 6 bytes (PC to PC+5)\n  - Split: Divide instruction byte into icode\
    \ and ifun\n  - Align: Get fields for rA, rB, and valC\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_138_0.png)\n\
    \n## Fetch Logic\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_139_0.png)\n\n- **Control\
    \ Blocks**\n  - **Instr. Valid:** Is this instruction valid?\n  - **Need regids:**\
    \ Does this instruction have a register byte?\n  - **Need valC:** Does this instruction\
    \ have a constant word?\n  - **icode|ifun:** Set to “nop” if `imem_error`\n\n\
    ## Some Macros\n\n| Name | Value | Meaning |\n|---|---|---|\n| RESP | 6 | Register\
    \ ID for `%esp` |\n| RNONE | F | Indicates no register file access |\n| ALUADD\
    \ | 0 | Function for addition operation |\n| SAOK | 1 | Status code for normal\
    \ operations |\n| SADR | 2 | Status code for address exception |\n| SINS | 3 |\
    \ Status code for illegal instruction exception |\n| SHLT | 4 | Status code for\
    \ `halt` |\n\n| Instruction | Byte Encoding | Operands |\n|---|---|---|\n| `nop`\
    \ | `0 0` | |\n| `halt` | `1 0` | |\n| `rrmovl rA, rB` | `2 0` | `rA rB` |\n|\
    \ `irmovl V, rB` | `3 0 8 rB V` | |\n| `rmmovl rA, D(rB)` | `4 0 rA rB D` | |\n\
    | `mrmovl D(rB), rA` | `5 0 rA rB D` | |\n| `OP1 rA, rB` | `6 fn rA rB` | |\n\
    | `jXX Dest` | `7 fn Dest` | |\n| `call Dest` | `8 0 Dest` | |\n| `ret` | `9 0`\
    \ | |\n| `pushl rA` | `A 0 rA 8` | |\n| `popl rA` | `B 0 rA 8` | |\n\n`need_regids`\n\
    \n## Fetch Control Logic\n\n```c\nbool need_regids = icode in\n{ IRRMOVL, IIRMOVL,\
    \ IRMMOVL,\nIMRMOVL, IOPL, IPUSHL, IPOPL };\n\nbool instr_valid = icode in\n{\
    \ INOP, IHALT, IRRMOVL, IIRMOVL,\nIRMMOVL, IMRMOVL, IOPL, IJXX,\nICALL, IRET,\
    \ IPUSHL, IPOPL };\n```\n\n## Decode & Write-Back Logic\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_144_0.png)\n\
    \n## Decode & Write-Back Logic\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_145_0.png)\n\
    \n- Predefined Blocks\n  - Register File\n    - Read ports A, B & write ports\
    \ E, M\n    - Addresses are register IDs or F (no access)\n\n## Decode & Write-Back\
    \ Logic\n\n- Control Logic\n  - srcA: read port address for valA `{rA, %esp}`\n\
    \  - srcB: read port address for valB `{rB, %esp}`\n  - dstE: write port address\
    \ for valE `{rB, %esp}`\n  - dstM: write port address for valM `{rA}`\n  - Cnd:\
    \ used to decide whether to set valE (cmovXX)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_146_0.png)\n"
  mdcn: "\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_128_0.png)\n\n## SEQ CPU 实现\n\n\
    ## 大纲\n\n- SEQ 实现\n- 推荐阅读 4.3.2, 4.3.4\n\n## 我们今天要讨论什么？\n\n- 顺序 CPU（SEQ）的实现\n\
    \  - 每条指令在一个周期内完成。\n  - 指令顺序执行。\n  - 没有两条指令并行或重叠执行。\n\n## SEQ 硬件结构\n\n- 阶段\n \
    \ - **取指**：从内存读取指令\n  - **译码**：读取程序寄存器\n  - **执行**：计算值或地址\n  - **访存**：读取或写入数据\n\
    \  - **写回**：写入程序寄存器\n  - **PC**：更新程序计数器\n\nPC\n\n写回\n\n访存\n\n执行\n\n译码\n\n取指\n\n\
    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_133_0.png)\n\nvalM\n\n数据存储器\n\naddrs,\
    \ data\n\na\n\nvalE\n\nCC\n\nALU\n\naluA, aluB\n\nvalA, valB\n\nsrcA, srcB\n\n\
    dstE, dstM\n\nA B F  \n寄存器文件\n\nvalE, valM\n\nicode:ifun,  \nrA:rB\n\n指令存储器\n\n\
    PC 增量\n\nPC\n\nnewPC\n\n## 语义与实现之间的区别\n\n- ISA\n  - 每个阶段都可能更新一些状态；这些更新按顺序发生。\n\
    - SEQ\n  - 所有状态更新操作在时钟上升沿同时发生。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_135_0.png)\n\
    \n## SEQ 硬件\n\n- 蓝色方框：□ 重新设计的硬件模块\n  - 例如，存储器、ALU\n- 灰色方框：▭ 控制逻辑\n  - 用 HCL 描述\n\
    - 白色椭圆：○ 信号标签\n- 粗线：→ 32 位字值\n- 细线：→ 4–8 位值\n- 点线：.......→ 1 位值\n\n## 取指逻辑\n\n\
    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_137_0.png)\n\n## 取指逻辑\n\n- 预定义模块\n  -\
    \ PC：包含 PC 的寄存器\n  - 指令存储器：读取 6 个字节（PC 到 PC+5）\n  - 拆分：将指令字节划分为 icode 和 ifun\n\
    \  - 对齐：获取 rA、rB 和 valC 字段\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_138_0.png)\n\
    \n## 取指逻辑\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_139_0.png)\n\n- **控制模块**\n\
    \  - **指令有效：** 这条指令是否有效？\n  - **需要 regids：** 这条指令是否有寄存器字节？\n  - **需要 valC：** 这条指令是否有一个常数字？\n\
    \  - **icode|ifun：** 如果 `imem_error`，则设为 “nop”\n\n## 一些宏\n\n| 名称 | 值 | 含义 |\n\
    |---|---|---|\n| RESP | 6 | `%esp` 的寄存器 ID |\n| RNONE | F | 表示不访问寄存器文件 |\n| ALUADD\
    \ | 0 | 加法操作的函数 |\n| SAOK | 1 | 正常操作的状态码 |\n| SADR | 2 | 地址异常的状态码 |\n| SINS |\
    \ 3 | 非法指令异常的状态码 |\n| SHLT | 4 | `halt` 的状态码 |\n\n| 指令 | 字节编码 | 操作数 |\n|---|---|---|\n\
    | `nop` | `0 0` | |\n| `halt` | `1 0` | |\n| `rrmovl rA, rB` | `2 0` | `rA rB`\
    \ |\n| `irmovl V, rB` | `3 0 8 rB V` | |\n| `rmmovl rA, D(rB)` | `4 0 rA rB D`\
    \ | |\n| `mrmovl D(rB), rA` | `5 0 rA rB D` | |\n| `OP1 rA, rB` | `6 fn rA rB`\
    \ | |\n| `jXX Dest` | `7 fn Dest` | |\n| `call Dest` | `8 0 Dest` | |\n| `ret`\
    \ | `9 0` | |\n| `pushl rA` | `A 0 rA 8` | |\n| `popl rA` | `B 0 rA 8` | |\n\n\
    `need_regids`\n\n## 取指控制逻辑\n\n```c\nbool need_regids = icode in\n{ IRRMOVL, IIRMOVL,\
    \ IRMMOVL,\nIMRMOVL, IOPL, IPUSHL, IPOPL };\n\nbool instr_valid = icode in\n{\
    \ INOP, IHALT, IRRMOVL, IIRMOVL,\nIRMMOVL, IMRMOVL, IOPL, IJXX,\nICALL, IRET,\
    \ IPUSHL, IPOPL };\n```\n\n## 译码与写回逻辑\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_144_0.png)\n\
    \n## 译码与写回逻辑\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_145_0.png)\n\n- 预定义模块\n\
    \  - 寄存器文件\n    - 读端口 A、B 和写端口 E、M\n    - 地址是寄存器 ID 或 F（无访问）\n\n## 译码与写回逻辑\n\n\
    - 控制逻辑\n  - srcA：valA 的读端口地址 `{rA, %esp}`\n  - srcB：valB 的读端口地址 `{rB, %esp}`\n\
    \  - dstE：valE 的写端口地址 `{rB, %esp}`\n  - dstM：valM 的写端口地址 `{rA}`\n  - Cnd：用于决定是否设置\
    \ valE（cmovXX）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_146_0.png)\n\n"
