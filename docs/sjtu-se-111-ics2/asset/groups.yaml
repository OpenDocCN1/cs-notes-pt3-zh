    8     pid = Fork();\n9     if (pid == 0) { /* child */\n10        printf(\"child\
    \ : x=%d\\n\", ++x);\n11        exit(0);\n12    }\n13 \n14    /* parent */\n15\
    \    printf(\"parent: x=%d\\n\", --x);\n16    exit(0);\n17 }\n```\n\n- **Duplicate\
