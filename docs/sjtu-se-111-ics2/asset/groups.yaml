  md: "\n## Lowest level: Ethernet segment\n\n- Ethernet segment consists of a collection\
    \ of hosts connected by wires (twisted pairs) to a hub\n- Spans room or floor\
    \ in a building.\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_668_0.png)\n\n- Operation\n\
    \  - Each Ethernet adapter has a unique 48-bit address\n    - E.g. 00:16:ea:e3:54:e6\n\
    \  - Hosts send bits to any other host in chunks called frames.\n  - Hub slavishly\
    \ copies each bit from each port to every other port\n    - Every host sees every\
    \ bit\n    - NOTE: Hubs are on their way out\n\n## Next level: Bridged Ethernet\
    \ segment\n\n- Spans building or campus\n- Bridges cleverly learn which hosts\
    \ are reachable from which ports and then selectively copy frames from port to\
    \ port\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_671_0.png)\n\n## Conceptual\
    \ view of LANs\n\nFor simplicity, hubs, bridges, and wires are often shown as\
    \ a collection of hosts attached to a single wire:\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_672_0.png)\n\
    \n## Next level: internets\n\n- Multiple incompatible LANs can be physically connected\
    \ by specialized computers called routers\n- The connected networks are called\
    \ an internet\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_673_0.png)\n\nLAN 1\
    \ and LAN 2 might be completely different, totally incompatible LANs (e.g. Ethernet,\
    \ Wifi, DSL)\n\n## Logical Structure of an internet\n\n- Ad hoc interconnection\
    \ of networks\n  - No particular topology\n  - Vastly different router & link\
    \ capacities\n- Send packets from source to destination by hopping through networks\n\
    \  - Router forms bridge from one network to another\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_674_0.png)\n\
    \n## The notion of an internet protocol\n\n- How is it possible to send bits across\
    \ incompatible LANs and WANs?\n- Solution:\n  - protocol software running on each\
    \ host and router smoothens out the differences between the different networks\n\
    - Implements an **internet protocol** (i.e., set of rules)\n  - governs how hosts\
    \ and routers should cooperate when they transfer data from network to network\n\
    \  - TCP/IP is the protocol for the global IP Internet.\n\n## What does an internet\
    \ protocol do?\n\n- Provides a naming scheme\n  - The internet protocol defines\
    \ a uniform format for host addresses\n  - Each host (and router) is assigned\
    \ at least one of these internet addresses that uniquely identifies it.\n- Provide\
    \ a delivery mechanism\n  - The internet protocol defines a standard transfer\
    \ unit (packet)\n  - Packet consists of header and payload\n    - header: contains\
    \ info such as packet size, source and destination addresses.\n    - payload:\
    \ contains data bits sent from source host.\n\n## Transferring data over an internet\n\
    \n```\nLAN1\nHost A\nclient\nprotocol software\nLAN1 adapter\nHost B\nserver\n\
    protocol software\nLAN2 adapter\nLAN2\nRouter\nLAN1 adapter\nLAN2 adapter\nprotocol\
    \ software\ninternet packet\nLAN1 frame\nLAN2 frame\nPH: Internet packet header\n\
    FH: LAN frame header\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_679_0.png)\n\
    \n## Other issues\n\n- We are glossing over a number of important questions:\n\
    \  - What if different networks have different maximum frame sizes? (segmentation)\n\
    \  - How do routers know where to forward frames?\n  - How are routers informed\
    \ when the network topology changes?\n  - What if packets get lost?\n- These questions\
    \ form the heart of the area of computer systems known as **computer networking**\n\
    \n## Global IP Internet\n\n- Most famous example of an internet.\n- Based on the\
    \ TCP/IP protocol family.\n  - IP (Internet protocol):\n    - provides basic naming\
    \ scheme and unreliable delivery capability of packets (datagrams) from host-to-host.\n"
  mdcn: "\n\n## 最低层级：以太网段\n\n- 以太网段由一组通过线缆（双绞线）连接到集线器的主机组成\n- 跨越建筑物中的房间或楼层。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_668_0.png)\n\
    \n- 操作\n  - 每个以太网适配器都有一个唯一的 48 位地址\n    - 例如 00:16:ea:e3:54:e6\n  - 主机将位以帧的形式发送给同一段中的任何其他主机。\n\
    \  - 集线器忠实地将每个端口的每一位复制到每个其他端口\n    - 每个主机都能看到每一位\n    - 注：集线器正在被淘汰\n\n## 下一级：桥接以太网段\n\
    \n- 跨越建筑物或校园\n- 网桥巧妙地学习哪些主机可通过哪些端口到达，然后选择性地将帧从一个端口复制到另一个端口\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_671_0.png)\n\
    \n## LAN 的概念视图\n\n为简化起见，集线器、网桥和线缆通常显示为一组主机连接到一根单线上：\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_672_0.png)\n\
    \n## 下一级：互联网\n\n- 多个不兼容的局域网可以通过称为路由器的专用计算机物理连接\n- 连接的网络称为互联网\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_673_0.png)\n\
    \nLAN 1 和 LAN 2 可能是完全不同、完全不兼容的局域网（例如以太网、Wifi、DSL）\n\n## 互联网的逻辑结构\n\n- 网络的临时互联\n\
    \  - 没有特定的拓扑结构\n  - 路由器和链路容量差异巨大\n- 通过网络跳跃将数据包从源发送到目的地\n  - 路由器在网络之间形成桥梁\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_674_0.png)\n\
    \n## 互联网协议的概念\n\n- 如何在不兼容的局域网和广域网之间发送位？\n- 解决方案：\n  - 在每个主机和路由器上运行的协议软件平滑了不同网络之间的差异\n\
    - 实现一个**互联网协议**（即规则集）\n  - 规定主机和路由器在网络间传输数据时应如何协作\n  - TCP/IP 是全球 IP 互联网的协议。\n\
    \n## 互联网协议做什么？\n\n- 提供命名方案\n  - 互联网协议定义了主机地址的统一格式\n  - 每个主机（和路由器）至少被分配一个唯一的互联网地址来标识它。\n\
    - 提供传输机制\n  - 互联网协议定义了标准传输单元（数据包）\n  - 数据包由头部和负载组成\n    - 头部：包含诸如数据包大小、源地址和目的地址等信息。\n\
    \    - 负载：包含从源主机发送的数据位。\n\n## 在互联网上传输数据\n\n```\nLAN1\nHost A\nclient\nprotocol\
    \ software\nLAN1 adapter\nHost B\nserver\nprotocol software\nLAN2 adapter\nLAN2\n\
    Router\nLAN1 adapter\nLAN2 adapter\nprotocol software\ninternet packet\nLAN1 frame\n\
    LAN2 frame\nPH: Internet packet header\nFH: LAN frame header\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_679_0.png)\n\
    \n## 其他问题\n\n- 我们忽略了一些重要问题：\n  - 如果不同网络的最大帧大小不同怎么办？（分段）\n  - 路由器如何知道将帧转发到哪里？\n\
    \  - 当网络拓扑发生变化时，路由器如何被告知？\n  - 如果数据包丢失怎么办？\n- 这些问题构成了计算机系统领域的核心，即**计算机网络**\n\n\
    ## 全球 IP 互联网\n\n- 互联网最著名的例子。\n- 基于 TCP/IP 协议族。\n  - IP（互联网协议）：\n    - 提供基本命名方案和主机到主机数据包（数据报）不可靠的传输能力。\n\
    \n"
