    \ Resource Identifier)\n    - See http://www.ietf.org/rfc/rfc2396.txt\n  - <method>\
    \ is either GET, POST, OPTIONS, HEAD, PUT, DELETE, or TRACE.\n\n## HTTP Requests\
    \ (cont)\n\n- HTTP methods:\n  - GET: Retrieve static or dynamic content\n   \
    \ - Arguments for dynamic content are in URI\n    - Workhorse method (99% of requests)\n\
    \  - POST: Retrieve dynamic content\n    - Arguments for dynamic content are in\
    \ the request body\n  - OPTIONS, HEAD, PUT, DELETE, TRACE\n- Request headers:\
    \ <header name>: <header data>\n  - Provide additional information to the server\n\
    \  - e.g. host: ipads.se.sjtu.edu.cn\n\n## HTTP Responses\n\n- HTTP response is\
    \ a response line followed by zero or more response headers.\n\n- Response line:\
    \ `<version> <status code> <status msg>`\n  - `<version>` is HTTP version of the\
    \ response.\n  - `<status code>` is numeric status.\n  - `<status msg>` is corresponding\
    \ English text.\n\n200 OK        Request was handled without error\n301 Moved\
    \      Provide alternate URL\n403 Forbidden  Server lacks permission to access\
    \ file\n404 Not found  Server couldn’t find the file.\n\n- Response headers: `<header\
    \ name>`: `<header data>`\n  - Provide additional information about response\n\
    \  - Content-Type: MIME type of content in response body\n  - Content-Length:\
    \ Length of content in response body\n\n## Serving dynamic content\n\n- Client\
    \ sends request to server\n- If request URI contains the string \"/cgi-bin\",\
    \ then the server assumes that the request is for dynamic content.\n\n```\nGET\
    \ /cgi-bin/env.pl HTTP/1.1\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_756_0.png)\n"
  mdcn: "\n\n## URLs\n\n- 动态内容的 URL：\n  - 标识了一个名为 adder 的可执行文件，由位于 www.cs.cmu.edu\
