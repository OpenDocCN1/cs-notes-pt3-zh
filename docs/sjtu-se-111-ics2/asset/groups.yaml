  md: "\n## Global IP Internet\n\n- Based on the TCP/IP protocol family.\n  - UDP\
    \ (Unreliable Datagram Protocol)\n    - Uses IP to provide unreliable datagram\
    \ delivery from process to process.\n  - TCP (Transmission Control Protocol)\n\
    \    - Uses IP to provide reliable byte streams, such as files, from process to\
    \ process.\n- Accessed via a mix of Unix file I/O and functions from the Berkeley\
    \ sockets interface.\n\n## Hardware and software organization of an Internet application\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_684_0.png)\n\n## Programmer’s view\
    \ of the Internet\n\n- Hosts are mapped to a set of 32-bit **IP addresses**.\n\
    \  - `202.120.40.188` (ICS server)\n- The set of IP addresses is mapped to a set\
    \ of identifiers called Internet **domain names**.\n  - `202.120.40.188` is mapped\
    \ to `ipads.se.sjtu.edu.cn`.\n- A process on one host communicates with a process\
    \ on another host over a **connection**.\n\n## Dotted decimal notation\n\n- By\
    \ convention, each byte in a 32-bit IP address is represented by its decimal value\
    \ and separated by a period.\n  - IP address `0xca7828bc` = `202.120.40.188`.\n\
    \n## Dotted decimal notation\n\n- Functions for converting between binary IP addresses\
    \ and dotted decimal strings:\n  - **inet_aton**: Converts a dotted decimal string\
    \ to an IP address in network byte order.\n  - **inet_ntoa**: Converts an IP address\
    \ in network byte order to its corresponding dotted decimal string.\n  - “n” denotes\
    \ network representation. “a” denotes application representation.\n\n## IP Addresses\n\
    \n- 32-bit IP addresses are stored in an IP address struct.\n  - IP addresses\
    \ are always stored in memory in network byte order (big-endian byte order).\n\
    \n```c\n/* Internet address structure */\nstruct in_addr {\n    unsigned int s_addr;\
    \ /* network byte order (big-endian) */\n};\n```\n\n## Useful network byte-order\
    \ conversion functions\n\n- **htonl**: Convert `uint32_t` from host to network\
    \ byte order.\n- **htons**: Convert `uint16_t` from host to network byte order.\n\
    - **ntohl**: Convert `uint32_t` from network to host byte order.\n- **ntohs**:\
    \ Convert `uint16_t` from network to host byte order.\n\n## Internet Domain Names\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_689_0.png)\n\n## Domain Naming System\
    \ (DNS)\n\n- The Internet maintains a mapping between IP addresses and domain\
    \ names in a huge distributed database called DNS.\n- Conceptually, we can think\
    \ of the DNS database as millions of host entry structures.\n\n## Domain Naming\
    \ System (DNS)\n\n```c\n/* DNS host entry structure */\nstruct hostent {\n   \
    \ /* official domain name of host */\n    char  *h_name;\n    /* null-terminated\
    \ array of domain names */\n    char  **h_aliases;\n    /* host address type (AF_INET)\
    \ */\n    int   h_addrtype;\n    /* length of an address, in bytes */\n    int\
    \   h_length;\n    /* null-terminated array of in_addr structs */\n    char  **h_addr_list;\n\
    };\n```\n\n## Properties of DNS host entries\n\n- Each host entry is an equivalence\
    \ class of domain names and IP addresses.\n- Each host has a locally defined domain\
    \ name `localhost` which always maps to the loopback address `127.0.0.1`.\n\n\
    ## Properties of DNS host entries\n\n- Different kinds of mappings are possible:\n\
    \  - **1-1**: Mapping between a domain name and an IP address:\n    - `ipads.se.sjtu.edu.cn`\
    \ maps to `202.120.40.188`.\n  - **M-1**: Multiple domain names mapped to the\
    \ same IP address:\n    - `google.com.cn` and `google.cn` both map to `74.125.128.160`.\n\
    \n## Properties of DNS host entries\n\n- Different kinds of mappings are possible:\n\
    \  - **M-N**: Multiple domain names mapped to multiple IP addresses:\n    - `baidu.com`\
    \ and `baidu.com.cn` map to three different IP addresses.\n  - **1-?**: Some valid\
    \ domain names do not map to any IP address:\n    - `ics.se.sjtu.edu.cn`.\n\n\
    ## Domain Naming System (DNS)\n\n- Functions for retrieving host entries from\
    \ DNS:\n  - **gethostbyname**: Query key is a DNS domain name.\n  - **gethostbyaddr**:\
    \ Query key is an IP address.\n"
  mdcn: "\n\n## 全球 IP 互联网\n\n- 基于 TCP/IP 协议族。\n  - UDP（不可靠数据报协议）\n    - 使用 IP 为进程间提供不可靠的数据报传输。\n\
    \  - TCP（传输控制协议）\n    - 使用 IP 为进程间提供可靠的字节流，例如文件。\n- 通过 Unix 文件 I/O 和 Berkeley\
    \ sockets 接口的函数混合访问。\n\n## 互联网应用的硬件和软件组织\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_684_0.png)\n\
    \n## 程序员视角的互联网\n\n- 主机被映射到一组 32 位 **IP 地址**。\n  - `202.120.40.188`（ICS 服务器）\n\
    - IP 地址集合被映射到一组称为互联网 **域名** 的标识符。\n  - `202.120.40.188` 被映射到 `ipads.se.sjtu.edu.cn`。\n\
    - 一个主机上的进程通过 **连接** 与另一个主机上的进程通信。\n\n## 点分十进制表示法\n\n- 按惯例，32 位 IP 地址中的每个字节都由其十进制值表示并用句点分隔。\n\
    \  - IP 地址 `0xca7828bc` = `202.120.40.188`。\n\n## 点分十进制表示法\n\n- 用于在二进制 IP 地址和点分十进制字符串之间转换的函数：\n\
    \  - **inet_aton**：将点分十进制字符串转换为网络字节序的 IP 地址。\n  - **inet_ntoa**：将网络字节序的 IP 地址转换为对应的点分十进制字符串。\n\
    \  - “n” 表示网络表示。“a” 表示应用表示。\n\n## IP 地址\n\n- 32 位 IP 地址存储在 IP 地址结构体中。\n  - IP\
    \ 地址始终以网络字节序（大端字节序）存储在内存中。\n\n```c\n/* Internet address structure */\nstruct in_addr\
    \ {\n    unsigned int s_addr; /* network byte order (big-endian) */\n};\n```\n\
    \n## 有用的网络字节序转换函数\n\n- **htonl**：将 `uint32_t` 从主机字节序转换为网络字节序。\n- **htons**：将 `uint16_t`\
    \ 从主机字节序转换为网络字节序。\n- **ntohl**：将 `uint32_t` 从网络字节序转换为主机字节序。\n- **ntohs**：将 `uint16_t`\
    \ 从网络字节序转换为主机字节序。\n\n## 互联网域名\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_689_0.png)\n\
    \n## 域名系统（DNS）\n\n- 互联网在名为 DNS 的庞大分布式数据库中维护 IP 地址和域名之间的映射。\n- 概念上，我们可以将 DNS 数据库视为数百万个主机条目结构。\n\
    \n## 域名系统（DNS）\n\n```c\n/* DNS host entry structure */\nstruct hostent {\n   \
    \ /* official domain name of host */\n    char  *h_name;\n    /* null-terminated\
    \ array of domain names */\n    char  **h_aliases;\n    /* host address type (AF_INET)\
    \ */\n    int   h_addrtype;\n    /* length of an address, in bytes */\n    int\
    \   h_length;\n    /* null-terminated array of in_addr structs */\n    char  **h_addr_list;\n\
    };\n```\n\n## DNS 主机条目的属性\n\n- 每个主机条目都是域名和 IP 地址的等价类。\n- 每个主机都有一个本地定义的域名 `localhost`，它始终映射到回环地址\
    \ `127.0.0.1`。\n\n## DNS 主机条目的属性\n\n- 可能存在不同种类的映射：\n  - **1-1**：域名与 IP 地址之间的映射：\n\
    \    - `ipads.se.sjtu.edu.cn` 映射到 `202.120.40.188`。\n  - **M-1**：多个域名映射到同一个 IP\
    \ 地址：\n    - `google.com.cn` 和 `google.cn` 都映射到 `74.125.128.160`。\n\n## DNS 主机条目的属性\n\
    \n- 可能存在不同种类的映射：\n  - **M-N**：多个域名映射到多个 IP 地址：\n    - `baidu.com` 和 `baidu.com.cn`\
    \ 映射到三个不同的 IP 地址。\n  - **1-?**：某些有效域名不映射到任何 IP 地址：\n    - `ics.se.sjtu.edu.cn`。\n\
    \n## 域名系统（DNS）\n\n- 用于从 DNS 检索主机条目的函数：\n  - **gethostbyname**：查询键为 DNS 域名。\n \
    \ - **gethostbyaddr**：查询键为 IP 地址。\n\n"
