    \    - 禁用执行阶段的条件码（CC）设置\n- 实现\n  - 硬连线到 PIPE 模拟器的设计中\n  - 你无法控制此项\n\n## 避免副作用\n\
    \n- 异常的存在应禁用状态更新\n  - 无效指令被转换为流水线气泡\n    - 除 `stat` 指示异常状态的指令外\n  - 数据存储器不会写入无效地址\n\
    \  - 防止条件码的无效更新\n    - 在存储器阶段检测异常\n    - 禁用执行阶段的条件码设置\n    - 必须在同一时钟周期内发生\n\n\
    ## 避免副作用\n\n- 异常的存在应禁用状态更新\n  - 在最后阶段处理异常\n    - 当在存储器阶段检测到异常时\n      - 从下一周期开始向存储器阶段注入气泡\n\
    \    - 当在写回阶段检测到异常时\n      - 停滞异常指令\n  - 包含在 HCL 代码中\n\n## 状态更改的控制逻辑\n\n## 设置条件码\n\
    \n```c\n// Should the condition codes be updated?\nbool set_cc = (E_icode == IOPL)\n\
    \             // State changes only during normal operation\n             && !m_stat\
    \ in { SADR, SINS, SHLT }\n             && !W_stat in { SADR, SINS, SHLT };\n\
    ```\n\n## 阶段控制\n\n- 也控制内存的更新\n\n```c\n// Start injecting bubbles as soon as exception\
    \ passes\n// through memory stage\nbool M_bubble = m_stat in { SADR, SINS, SHLT\
    \ }\n              || W_stat in { SADR, SINS, SHLT };\n\n// Stall pipeline register\
    \ W when exception encountered\nbool W_stall = W_stat in { SADR, SINS, SHLT };\n\
    ```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_287_0.png)\n\n"
