    \  - Server activated by request from client\n\n## A client-server transaction\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_664_0.png)\n\nNote: clients and servers\
    \ are processes running on hosts (can be the same or different hosts).\n\n## Hardware\
    \ organization of a network host\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_665_0.png)\n\
