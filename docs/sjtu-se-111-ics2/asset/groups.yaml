    31 12 11 9 8 7 6 5 4 3 2 1 0\n\n页表物理基地址：物理页表地址的 20 个最高有效位（强制页表为 4KB 对齐）\n\nAvail：供系统程序员使用\n\
    \nG：全局页（任务切换时不从 TLB 中逐出）\n\nPS：页大小 4K（0）或 4M（1）\n\nA：已访问（由 MMU 在读写时设置，由软件清除）\n\
    \nCD：缓存禁用（1）或启用（0）\n\nWT：此页表的写直通或写回缓存策略\n\nU/S：用户或监督模式访问\n\nR/W：只读或读写访问\n\nP：页表在内存中存在（1）或不存在（0）\n\
    Available for OS (page table location in secondary storage) P=0\n31 1 0\n\n##\
    \ P6 页表项（PTE）\n\nPage physical base address | Avail | G | O | D | A | CD | WT\
    \ | U/S | R/W | P=1\n31 12 11 9 8 7 6 5 4 3 2 1 0\n\n页基地址：物理页地址的 20 个最高有效位（强制页为\
    \ 4 KB 对齐）\n\nAvail：供系统程序员使用\n\nG：全局页（任务切换时不从 TLB 中逐出）\n\nD：已修改（由 MMU 在写入时设置）\n\
    \nA：已访问（由 MMU 在读写时设置）\n\nCD：缓存禁用或启用\n\nWT：此页的写直通或写回缓存策略\n\nU/S：用户/监督\n\nR/W：读/写\n\
    \nP：页在物理内存中存在（1）或不存在（0）\n\n31 1 0\nAvailable for OS (page location in secondary\
    \ storage) | P=0\n\n## 页表转换\n\n10 VPN1 10 VPN2 12 VPO Virtual address\nword offset\
    \ into page directory\nword offset into page table\nword offset into physical\
    \ and virtual page\npage directory\nPDE\nPDBR physical address of page directory\n\
    page table\nPTE\nphysical address of page base (if P=1)\nphysical address of page\
    \ table base (if P=1)\n20 PPN 12 PPO Physical address\n\n## P6 TLB 转换\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1002_0.png)\n\
    \n## P6 TLB\n\n- TLB 条目（未全部记录，因此这是推测性的）：\n  \n  32      16   1 1\n  PDE/PTE  Tag\
    \  PD V\n  \n  - V：表示 TLB 条目有效（1）或无效（0）\n  - PD：此条目是 PDE（1）还是 PTE（0）？\n  - tag：区分缓存在同一集合中的条目\n\
    \  - PDE/PTE：页目录或页表项\n\n- 数据 TLB 的结构：\n  - 16 个集合，4 条目/集合\n\n| entry | entry |\
    \ entry | entry | set 0 |\n| entry | entry | entry | entry | set 1 |\n| entry\
    \ | entry | entry | entry | set 2 |\n| ... | ... | ... | ... | ... |\n| entry\
    \ | entry | entry | entry | set 15 |\n\n## 使用 P6 TLB 进行转换\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1004_0.png)\n\
    \n- 1. 将 VPN 分区为 TLBT 和 TLBI。\n- 2. VPN 的 PTE 是否缓存在集合 TLBI 中？\n- 3. 是：然后构建物理地址。\n\
    - 4. 否：然后从内存中读取 PTE（如果未缓存则读取 PDE）并构建物理地址。\n\n"
