    \            int t = a[i];\n            a[i] = b[i];\n            b[i] = t;\n\
    \        }\n    }\n}\n```\n\n```c\nvoid minmax2(int a[],\n             int b[],\
    \ int n)\n{\n    int i;\n    for (i = 0; i < n; i++) {\n        int min = a[i]\
