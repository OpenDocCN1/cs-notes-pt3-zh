    \ rA\n- PC Update\n  - Increment PC by 2\n\n## 阶段计算：popl\n\n|  | popl rA |  |\n\
    |---|---|---|\n| Fetch | icode:ifun ← M₁[PC]\nrA:rB ← M₁[PC+1]\nvalP ← PC+2 |\
    \ Read instruction byte\nRead register byte\nCompute next PC |\n| Decode | valA\
    \ ← R[%esp]\nvalB ← R[%esp] | Read stack pointer\nRead stack pointer |\n| Execute\
    \ | valE ← valB + 4 | Increment stack pointer |\n| Memory | valM ← M₄[valA] |\
    \ Read from stack |\n| Write back | R[%esp] ← valE\nR[rA] ← valM | Update stack\
    \ pointer\nWrite back result |\n| PC update | PC ← valP | Update PC |\n\n- Use\
    \ ALU to increment stack pointer\n\nupdate two registers (special: rA=%esp)\n\n\
    ## 执行跳转\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_104_0.png)\n\n## 阶段计算：跳转\n\
    \n|  | jXX Dest |\n|---|---|\n| Fetch | icode:ifun ← M₁[PC]\nvalC ← M₄[PC+1]\n\
    valP ← PC+5 |\n| Decode |  |\n| Execute | Cnd ← Cond(CC,ifun) |\n| Memory |  |\n\
    | Write back |  |\n| PC update | PC ← Cnd ? valC : valP |\n\nRead instruction\
    \ byte\n\nRead destination address\nFall through address\n\nCompute both addresses\n\
    \nTake branch?\n\nUpdate PC\n\nChose based on CC and ifun\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_107_0.png)\n\
    \n## 执行 call\n\n- Fetch\n  - Read 5 bytes\n  - Increment PC by 5\n- Decode\n \
    \ - Read stack pointer\n- Execute\n  - Decrement stack pointer by 4\n- Memory\n\
    \  - Write incremented PC to new value of stack pointer\n- Write back\n  - Update\
    \ stack pointer\n- PC Update\n  - Set PC to Dest\n\n## 阶段计算：call\n\n|  | call\
    \ Dest |  |\n|---|---|---|\n| Fetch | icode:ifun ← M₁[PC]\nvalC ← M₄[PC+1]\nvalP\
    \ ← PC+5 | Read instruction byte\nRead destination address\nCompute return point\
    \ |\n| Decode | valB ← R[%esp] | Read stack pointer |\n| Execute | valE ← valB\
    \ + -4 | Decrement stack pointer |\n| Memory | M₄[valE] ← valP | Write return\
    \ value on stack |\n| Write back | R[%esp] ← valE | Update stack pointer\nStore\
    \ incremental PC |\n| PC update | PC ← valC | Set PC to destination |\n\n- Use\
    \ ALU to decrement stack pointer\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_111_0.png)\n\
    \n## 执行 ret\n\n- Fetch\n  - Read 1 byte\n- Decode\n  - Read stack pointer\n- Execute\n\
    \  - Increment stack pointer by 4\n- Memory\n  - Read return address from old\
    \ stack pointer\n- Write back\n  - Update stack pointer\n- PC Update\n  - Set\
    \ PC to return address\n\n## 阶段计算：ret\n\n|  | ret |  |\n|---|---|---|\n| Fetch\
    \ | icode:ifun ← M₁[PC] | Read instruction byte |\n| Decode | valA ← R[%esp]\n\
    valB ← R[%esp] | Read operand stack\nReinterpret operand stack pointer |\n| Execute\
    \ | valE ← valB + 4 | increment stack pointer |\n| Memory | valM ← M₄[valA] |\
    \ Read return address |\n| Write back | R[%esp] ← valE | Update stack pointer\
    \ |\n| PC update | PC ← valM | Set PC to return address |\n\n- Use ALU to increment\
    \ stack pointer\n\n"
