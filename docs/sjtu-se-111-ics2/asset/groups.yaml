  md: "\n## Branch Behavior in Programs\n\nWhy are branches (especially backward branches)\
    \ more likely to be taken than not taken?\n\n## Dealing with Branch Stalls\n\n\
    - Approach 1: Stall until branch direction is clear\n  - Simple\n- Approach 2:\
    \ Predict Branch **Not Taken**\n  - Execute successor instructions in sequence\n\
    \    - more efficient than Taken in deep pipeline\n  - PC+4 already calculated\n\
    \  - **33%** branches not taken on average\n\n## Dealing with Branch Stalls\n\n\
    - Approach 3: Predict Branch **Taken**\n  - **67%** branches taken on average\n\
    \  - But haven’t yet calculated target address in deep pipeline\n    - still incur\
    \ a 1-cycle latency\n  - Makes sense on machines where branch target is known\
    \ before outcome (e.g., Y86)\n\n## Dealing with Branch Stalls\n\n- Approach 4:\
    \ **Delayed** Branch\n  - Define branch to take place AFTER *n* following instructions\n\
    \  - **Branch Delay Slots**\n    - Instructions in the branch delay slot(s) get\
    \ executed whether or not branch is taken\n    - Heavily used in early RISC machines\
    \ (e.g., MIPS)\n    - Machines with deep pipelines require additional delay slots\
    \ to avoid branch penalties\n\n## Scheduling the Branch Delay Slot\n\n- Where\
    \ does the instruction for the delay slot come from?\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1120_0.png)\n\
    \nNullifying or cancelling branches\n\n– Converts delay slot instruction into\
    \ a nop\n\n## Importance of Avoiding Branch Stalls\n\n- Crucial in modern microprocessors,\
    \ which issue and execute multiple instructions every cycle\n  - Need to have\
    \ a steady stream of instructions to keep the hardware busy\n  - Stalls due to\
    \ control hazards dominate\n- So far, we have looked at static schemes for reducing\
    \ branch penalties\n\n## Static vs. Dynamic\n\n- **Static** schemes: same scheme\
    \ applies to every branch instruction\n  \n- **Dynamic** schemes: choose most\
    \ appropriate scheme separately for each instruction\n  - e.g., branches to top\
    \ of loop // **Taken**\n    ```c\n    if (x == 0) return; // Not Taken\n    ```\n\
    \  - Can **learn** appropriate scheme based on observed behavior\n\n## Branch\
    \ Predictor\n\n- Two parts\n  - Target Buffer: maps PC to taken target\n  - Direction\
    \ predictor: maps PC to taken/not taken\n- What does it mean to \"map PC\"?\n\
    \  - Use some PC bits as index into an array of data items\n\n## Mapping PCs\n\
    \n- If array of data has N entries\n  - Need log(N) bits to index it\n- Which\
    \ log(N) bits to choose?\n  - Least significant log(N) after the least significant\
    \ 2\n  - Least significant change most often\n\n## Mapping PCs\n\n- What if two\
    \ PCs have same pattern in that subset of bits (**aliasing**)\n  - We get a nonsense\
    \ target (intended for another PC)\n  - That’s OK, it’s just a guess anyway, we\
    \ can recover if it’s wrong\n\n## Branch Prediction (History) Buffer\n\n- Small\
    \ memory indexed by the low-order bits of the branch instruction\n  - Stores **a\
    \ single bit** of information: T or NT\n  - Starts off as T, flips whenever a\
    \ branch behaves opposite to prediction\n  - Maintained by the **Fetch** stage\n\
    \  - A correct prediction implies **no branch penalty**\n\n## Branch Prediction\
    \ (History) Buffer\n\n- Problems with this simple scheme\n  - Does not do a good\
    \ job of predicting “mostly-taken branches”\n    - `e.g., for (i=0; i<10; i++)\
    \ { ... }`\n    - Repeated exec of the loop will result in **2 mispredictions**\n\
    \      - Last iteration flips T to NT\n      - First iteration flips NT to T\n\
    \    - Prediction accuracy of **80%**\n\n## 2-bit Prediction Schemes\n\n- Store\
    \ 2 bits of info in branch history buffer\n  - 1 misprediction per iteration if\
    \ we start off in the (11) state\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1128_0.png)\n\
    \n## Correlating Branch Predictors\n\n```\nif (aa == 2)\n    aa = 0;\nif (bb ==\
    \ 2)\n    bb = 0;\nif (aa != bb)\n    { ... }\n\nDSUBUI R3, R1, #2\nBNEZ  R3,\
    \ L1      ; branch b1\nDADD  R1, R0, R0\nL1: DSUBUI R3, R2, #2\nBNEZ  R3, L2 \
    \     ; branch b2\nDADD  R2, R0, R0\nL2: DSUBU  R3, R1, R2\nBEQZ  R3, L3     \
    \ ; branch b3\n```\n\n- Behavior of b3 is correlated with that of b1 and b2\n\
    \  - if both b1 and b2 are NT, b3 will be T\n- Can (how do) we predict such branches?\n"
  mdcn: "\n\n## 程序中的分支行为\n\n为什么分支（尤其是向后分支）更可能被执行而不是不被执行？\n\n## 处理分支停顿\n\n- 方法 1：停顿直到分支方向明确\n\
    \  - 简单\n- 方法 2：预测分支 **未被执行**\n  - 按顺序执行后续指令\n    - 在深流水线中比 Taken 更高效\n  - PC+4\
    \ 已计算好\n  - 平均 **33%** 的分支未被执行\n\n## 处理分支停顿\n\n- 方法 3：预测分支 **被执行**\n  - 平均 **67%**\
    \ 的分支被执行\n  - 但在深流水线中目标地址尚未计算\n    - 仍会产生 1 个周期的延迟\n  - 在分支目标在结果之前已知的机器上是有意义的（例如\
    \ Y86）\n\n## 处理分支停顿\n\n- 方法 4：**延迟**分支\n  - 定义分支在之后 *n* 条指令执行后才发生\n  - **分支延迟槽**\n\
    \    - 分支延迟槽中的指令无论分支是否被执行都会被执行\n    - 在早期的 RISC 机器中大量使用（例如 MIPS）\n    - 具有深流水线的机器需要额外的延迟槽来避免分支惩罚\n\
    \n## 调度分支延迟槽\n\n- 延迟槽的指令从哪里来？\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1120_0.png)\n\
    \n使分支无效或取消分支\n\n– 将延迟槽指令转换为 nop\n\n## 避免分支停顿的重要性\n\n- 对现代微处理器至关重要，其每周期发出并执行多条指令\n\
    \  - 需要持续的指令流来保持硬件忙碌\n  - 控制冒险导致的停顿占主导\n- 到目前为止，我们研究的是减少分支惩罚的静态方案\n\n## 静态与动态\n\
    \n- **静态**方案：同一方案适用于每条分支指令\n  \n- **动态**方案：为每条指令单独选择最合适的方案\n  - 例如，分支到循环顶部 //\
    \ **Taken**\n    ```c\n    if (x == 0) return; // Not Taken\n    ```\n  - 可以根据观察到的行为**学习**合适的方案\n\
    \n## 分支预测器\n\n- 两个部分\n  - 目标缓冲：映射 PC 到被执行的目标\n  - 方向预测器：映射 PC 到被执行/未被执行\n- “映射\
    \ PC”是什么意思？\n  - 使用某些 PC 位作为索引进入数据项数组\n\n## 映射 PC\n\n- 如果数据数组有 N 个条目\n  - 需要 log(N)\
    \ 位来索引它\n- 选择哪 log(N) 位？\n  - 去掉最低的 2 位之后的最低 log(N) 位\n  - 最低有效位变化最频繁\n\n## 映射\
    \ PC\n\n- 如果两个 PC 在该子集位上具有相同模式（**别名**）\n  - 我们得到一个无意义的目标（ intended for another\
    \ PC）\n  - 没关系，这本来就是一个猜测，如果错误可以恢复\n\n## 分支预测（历史）缓冲\n\n- 小内存，由分支指令的低位索引\n  - 存储\
    \ **单个位** 的信息：T 或 NT\n  - 起始为 T，每当分支行为与预测相反时翻转\n  - 由 **取指** 阶段维护\n  - 正确预测意味着\
    \ **无分支惩罚**\n\n## 分支预测（历史）缓冲\n\n- 该简单方案的问题\n  - 对“大多数情况下被执行的分支”预测效果不佳\n    - `e.g.,\
    \ for (i=0; i<10; i++) { ... }`\n    - 循环重复执行会导致 **2 次误预测**\n      - 最后一次迭代将 T\
    \ 翻转为 NT\n      - 第一次迭代将 NT 翻转为 T\n    - 预测准确率为 **80%**\n\n## 2 位预测方案\n\n- 在分支历史缓冲中存储\
    \ 2 位信息\n  - 如果我们从 (11) 状态开始，每次迭代会产生 1 次误预测\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1128_0.png)\n\
    \n## 相关分支预测器\n\n```\nif (aa == 2)\n    aa = 0;\nif (bb == 2)\n    bb = 0;\nif\
    \ (aa != bb)\n    { ... }\n\nDSUBUI R3, R1, #2\nBNEZ  R3, L1      ; branch b1\n\
    DADD  R1, R0, R0\nL1: DSUBUI R3, R2, #2\nBNEZ  R3, L2      ; branch b2\nDADD \
    \ R2, R0, R0\nL2: DSUBU  R3, R1, R2\nBEQZ  R3, L3      ; branch b3\n```\n\n- b3\
    \ 的行为与 b1 和 b2 相关\n  - 如果 b1 和 b2 均为 NT，b3 将为 T\n- 我们能否（如何）预测此类分支？\n\n"
