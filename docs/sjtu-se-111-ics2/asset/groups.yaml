    # Nonlocal Jumps


    +   - Nonlocal jumps are provided by

    +     - the `setjmp` function

    +       - Saves the current stack context in the `env` buffer, for later use by
    `longjmp`, returns 0

    +     - the `longjmp` function

    +       - restores the stack context from the `env` buffer

    +       - triggers a return from the most recent `setjmp` call that initialized
    `env`

    +       - The `setjmp` then returns with the nonzero return value `retval`.'
