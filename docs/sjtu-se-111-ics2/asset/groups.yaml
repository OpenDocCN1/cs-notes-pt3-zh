  mdcn: "\n\n## Wait_pid Function\n\n```\npid_t waitpid(pid_t pid, int *status, int\
    \ options);\n```\n\n- options\n  - WNOHANG: 如果等待集合中没有任何子进程尚未终止，则立即返回（返回值为 0）\n\
    \  - WUNTRACED: 挂起调用进程的执行，直到有进程终止或停止的子进程导致返回\n  - WUNTRACED | WNOHANG: 挂起调用进程的执行，直到有进程终止或停止的子进程导致返回。同时，如果等待集合中没有任何子进程被终止或停止，则立即返回（返回值为\
    \ 0）\n\n- 检查被回收子进程的退出状态\n  - status 参数为非 NULL\n  - `waitpid` 将导致返回的子进程的状态信息编码到\
    \ `status` 参数中\n  - `wait.h` 头文件定义了多个宏\n    - 用于解释 `status` 参数\n\n- **WIFEXITED(status)**\n\
    \  - 如果子进程通过调用 exit 或 return 正常终止，则返回 true\n\n- **WEXITSTATUS(status)**\n  - 返回正常终止的子进程的退出状态。\n\
    \  - 此状态仅在 WIFEXITED 返回 true 时才定义。\n\n- **WIFSIGNALED(status)**\n  - 如果子进程因未被捕获的信号而终止，则返回\
    \ true\n- **WTERMSIG(status)**\n  - 返回导致子进程终止的信号编号。\n  - 此状态仅在 **WIFSIGNALED**\
    \ 返回 true 时才定义。\n\n- **WIFSTOPPED(status)**\n  - 如果导致返回的子进程当前处于停止状态，则返回 true\n\
    - **WSTOPSIG(status)**\n  - 返回导致子进程停止的信号编号。\n  - 此状态仅在 **WIFSTOPPED** 返回 true\
    \ 时才定义。\n\n```\n1 #include \"csapp.h\"\n2 #define N 2\n3 \n4 int main()\n5 {\n\
    6     int status, i;\n7     pid_t pid;\n8 \n9     /* Parent creates N children\
