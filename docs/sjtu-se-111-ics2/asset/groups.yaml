  mdcn: "\n\n## 迭代服务器\n\n- 迭代服务器一次处理一个请求\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_797_0.png)\n\
    \n## 迭代服务器的基本流程\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_798_0.png)\n\n- 解决方案：改用\
    \ **并发** 服务器\n- 并发服务器使用多个并发流程同时为多个客户端提供服务\n\n## 使用进程进行并发编程\n\nlistenfd\n\n1. 服务器在\
    \ accept 上阻塞，等待在监听描述符 listenfd 上的连接请求\n\nclientfd\n\nConnection request\n\nlistenfd\n\
    \n2. 客户端通过调用 connect 并阻塞来发起连接请求\n\nclientfd\n\nlistenfd\n\n3. 服务器从 accept 返回 connfd。派生子进程处理客户端。客户端从\
    \ connect 返回。连接现在在 clientfd 和 connfd 之间建立\n\nclientfd\n\nconnfd\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_800_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_801_0.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_803_0.png)\n\
    \n## 基于进程的并发服务器\n\n```\nint main(int argc, char **argv)\n{\n    int listenfd,\
    \ connfd, port = atoi(argv[1]);\n    struct sockaddr_in clientaddr;\n    int clientlen\
    \ = sizeof(clientaddr);\n\n    Signal(SIGCHLD, sigchld_handler);\n    listenfd\
    \ = Open_listenfd(port);\n    while (1) {\n        connfd = Accept(listenfd, (SA\
    \ *) &clientaddr, &clientlen);\n        if (Fork() == 0) {\n            Close(listenfd);\
    \ /* Child closes its listening socket */\n            echo(connfd);    /* Child\
    \ services client */\n            Close(connfd);   /* Child closes connection\
    \ with client */\n            exit(0);         /* Child exits */\n        }\n\
    \        Close(connfd); /* Parent closes connected socket (important!) */\n  \
    \  }\n}\n```\n\n- 为每个客户端派生单独的进程\n- 不允许不同客户端处理器之间进行任何通信\n\n## 使用进程进行并发编程\n\n- 内核提供具有独立地址空间的多个控制流。\n\
    - 标准 Unix 进程控制和信号。\n- 显式的进程间通信机制\n\n## 进程的实现问题\n\n- 如果 accept 调用被转移控制到 SIGCHLD\
    \ 处理程序中断，服务器应重新启动 accept 调用\n- 服务器必须回收僵尸子进程\n  - 以避免致命的内存泄漏\n\n```\nvoid sigchld_handler(int\
    \ sig)\n{\n    while (waitpid(-1, 0, WNOHANG) > 0)\n        ;\n    return;\n}\n\
    ```\n\n## 进程的实现问题\n\n- 服务器必须关闭其 connfd 的副本。\n  - 内核为每个套接字保留引用。\n  - fork 后，refcnt(connfd)\
    \ = 2。\n  - 直到 refcnt(connfd)=0，连接才会被关闭。\n\n## 进程的优缺点\n\n- 进程控制的额外开销。\n- 在进程之间共享数据并不简单。\n\
    \  - 需要 IPC（进程间通信）机制\n    - FIFO（命名管道）、System V 共享内存和信号量\n\n## 进程的传统视图\n\n- 进程\
    \ = 进程上下文 + 代码、数据和栈\n\nProcess context\n\nCode, data, and stack\n\nProgram context:\n\
    Data registers\nCondition codes\nStack pointer (SP)\nProgram counter (PC)\nKernel\
    \ context:\nVM structures\nDescriptor table\nbrk pointer\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_810_0.png)\n\
    \n## 进程的另一种视图\n\n- 进程 = 线程 + 代码、数据和内核上下文\n\nThread (main thread)\n\nCode and Data\n\
    \nstack\n\nSP\n\nbrk\n\nPC\n\n0\n\nshared libraries\n\nrun-time heap\n\nread/write\
    \ data\n\nread-only code/data\n\nThread context:\nData registers\nCondition codes\n\
    Stack pointer (SP)\nProgram counter (PC)\n\nKernel context:\nVM structures\nDescriptor\
    \ table\nbrk pointer\n\n## 具有多个线程的进程\n\n- 可以将多个线程与一个进程关联\n- 每个线程都有自己的逻辑控制流（PC\
    \ 值序列）\n- 每个线程共享相同的代码、数据和内核上下文\n- 每个线程都有自己的线程 ID（TID）\n\n"
