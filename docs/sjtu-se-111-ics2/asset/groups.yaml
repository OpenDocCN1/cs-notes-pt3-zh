    \    - 一个进程可以向自身发送信号。\n\n## 待处理信号\n- 待处理信号\n  - 已发送但尚未接收的信号\n- 只有一个\n  - 在任何时刻，\n\
    \  - 特定类型的待处理信号最多只能有一个\n- 不排队\n  - 如果一个进程已有类型为 k 的待处理信号\n  - 那么随后发送给该进程的任何类型为\
    \ k 的信号都不会排队\n  - 它们将被直接丢弃。\n- 一个待处理信号最多只会被接收一次。\n\n## 阻塞信号\n- 一个进程可以有选择地 **阻塞**\
    \ 某些信号的接收。\n- 当一个信号被阻塞时\n  - 它可以被传递\n  - 但由此产生的待处理信号将不会被接收\n  - 直到进程解除对该信号的阻塞\n\
    \n## 内部数据结构\n- 对于每个进程，内核维护\n  - 待处理信号的集合在 **pending 位向量** 中\n  - 被阻塞信号的集合在 **blocked\
    \ 位向量** 中\n- 内核设置 **pending** 中的位 k\n  - 每当类型为 k 的信号被传递时\n- 内核清除 **pending** 中的位\
    \ k\n  - 每当类型为 k 的信号被接收时。\n\n## 进程组\n```\n#include <unistd.h>\npid_t getpgrp(void);\n\
    \    returns: process group ID of calling process\n#include <unistd.h>\npid_t\
    \ setpgid(pid_t pid, pid_t pgid);\n    returns: 0 on success, -1 on error\n```\n\
    - 将进程 pid 的进程组更改为 pgid\n- 如果 pid 为零，则使用当前进程的 PID\n- 如果 pgid 为零，则使用由 pid 指定的进程的\
    \ PID 作为进程组 ID\n\n## setgpid 函数\ne.g. `setpgid(0, 0);`\n- 假设进程 15213 是调用进程，\n\
