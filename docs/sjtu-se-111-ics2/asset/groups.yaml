  md: "\n## CISC vs. RISC\n\n### CISC\n\nImplementation artifacts *hidden* from machine-level\
    \ programs. The ISA provides a *clean* abstraction between programs and how they\
    \ get executed.\n\n### RISC\n\nImplementation artifacts *exposed* to machine-level\
    \ programs.  \n(e.g., Some RISC machines prohibit particular instruction sequences\
    \ and have jumps that do not take effect until the following instruction is executed.\
    \ The compiler is given the task of optimizing performance within these constraints.)\n\
    \n## Review Y86\n\n- Y86 ISA studies both CISC and RISC\n  - CISC: condition codes,\
    \ variable-length instructions, and stack-intensive procedure linkages\n  - RISC:\
    \ load-store architecture and a regular encoding\n\n## Controversy and Fusion\n\
    \n- Original Debate\n  - Strong opinions!\n  - _CISC proponents_: easy for compiler,\
    \ fewer code bytes\n  - _RISC proponents_: better for optimizing compilers, can\
    \ make run fast with simple chip design\n\nNeither RISC nor CISC in their purest\
    \ forms were better than designs that incorporated the best ideas of both.\n\n\
    - RISC ← CISC\n  - More instructions (multiple cycles to execute)\n  - Implementation\
    \ artifacts exposed to machine level programs\n- CISC ← RISC\n  - Dynamically\
    \ translate CISC instruction into a sequence of simpler, RISC-like operations\n\
    \  - X86-64: more registers, closer to register-intensive procedure linkage, ...\n\
    \n## At a Glance of MIPS\n\n- MIPS emphasizes\n  - A simple load-store instruction\
    \ set\n  - Design for pipelining efficiency, including a fixed instruction set\
    \ encoding\n  - Efficiency as a compiler target\n- Registers\n  - 32 64-bit general-purpose\
    \ registers\n  - 32 floating-point registers\n  - The value of R0 is always 0\n\
    - Data Type\n  - 8-, 16-, 32- and 64-bit integer data\n  - 32- and 64-bit floating\
    \ point data\n- Addressing Modes\n  - immediate and displacement (offset)\n  -\
    \ 16-bit fields\n- Instruction Format\n  - 32-bit fixed instruction\n  - 6-bit\
    \ primary opcode\n  - I-type, R-type and J-type\n\n### I-type\n\n| Opcode | rs\
    \ | rt | imm |\n|---|---|---|---|\n\nEncodes: Loads and stores of bytes, half\
    \ words, words, double words. All immediates (rt ← rs op immediate)\n\nConditional\
    \ branch instructions (rs is register, rd unused)  \nJump register, jump and link\
    \ register  \n(rd = 0, rs = destination, immediate = 0)\n\n### J-type\n\n| Opcode\
    \ | Offset added to PC |\n|---|---|\n\nJump and jump and link  \nTrap and return\
    \ from exception\n\n### R-type\n\n| Opcode | rs | rt | rd | shamt | funct |\n\
    |---|---|---|---|---|---|\n\nRegister-register ALU operations: rd ← rs funct rt\
    \  \nFunction encodes the data path operation: Add, Sub, . . .  \nRead/write special\
    \ registers and moves\n\n- Operations\n  - Arithmetic/logical instructions R-type\n\
    \n    ```\n    DADDU R1, R2, R3\n        Regs[R1] ← Regs[R2] + Regs[R3]\n    ```\n\
    \n    ```\n    DADDIU R1, R2, #3\n        Regs[R1] ← Regs[R2] + 3\n    ```\n\n\
    \    ```\n    DSLL R1, R2, #5\n        Regs[R1] ← Regs[R2] << 5\n    ```\n\n \
    \   ```\n    SLT R1, R2, R3\n        Regs[R1] ← (Regs[R2]<Regs[R3]) ? 1 : 0\n\
    \    ```\n\n  - Control Flow\n\n    | Type | Instruction | Semantics |\n    |------|-------------|-----------|\n\
    \    | J-type | `J name` | `PC₃₆..₆₃ ← name` |\n    | J-type | `JAL name` | `Regs[R31]\
    \ ← PC+8; PC₃₆..₆₃ ← name` |\n    | | | `((PC+4)−2²⁷) <= name <= ((PC+4)+ 2²⁷)`\
    \ |\n    | R-type | `JR R3` | `PC ← Regs[R3]` |\n    | R-type | `JALR R2` | `Regs[R31]\
    \ ← PC+8; PC ← Regs[R2]` |\n    | I-type | `BEQZ R4, name` | `if (Regs[R4]==0)\
    \ PC ← name` |\n    | | | `((PC+4)−2¹⁷) <= name <= ((PC+4)+ 2¹⁷)` |\n    | R-type\
    \ | `MOVZ R1,R2,R3` | `if (Regs[R3]==0) Regs[R1] ← Regs[R2]` |\n\n## Thanks\n\n\
    ## Branch Prediction on Pipeline\n\n## Branch Behavior in Programs\n\n- Based\
    \ on SPEC benchmarks\n  - Branches occur with a frequency of 14% to 16% in INT\
    \ programs and 3% to 12% in FP programs.\n  - About 75% of the branches are forward\
    \ branches\n  - 60% of forward branches are taken\n  - 80% of backward branches\
    \ are taken\n  - 67% of all branches are taken\n"
  mdcn: "\n\n## CISC 与 RISC\n\n### CISC\n\n实现细节对机器级程序*隐藏*。ISA 在程序与执行方式之间提供了一个*干净*的抽象。\n\
    \n### RISC\n\n实现细节对机器级程序*暴露*。  \n（例如，某些 RISC 机器禁止特定的指令序列，并且跳转不会在下一条指令执行前生效。编译器被赋予在这些约束下优化性能的任务。）\n\
    \n## 回顾 Y86\n\n- Y86 ISA 同时研究 CISC 和 RISC\n  - CISC：条件码、可变长度指令和基于栈的过程链接\n  - RISC：load-store\
    \ 架构和规则的编码\n\n## 争议与融合\n\n- 早期争论\n  - 观点强烈！\n  - _CISC 支持者_：对编译器友好，代码字节更少\n  -\
    \ _RISC 支持者_：更适合优化编译器，能用简单芯片设计实现快速运行\n\n纯粹形式的 RISC 或 CISC 都不如融合两者最佳思想的设计。\n\n\
    - RISC ← CISC\n  - 更多指令（执行需要多个周期）\n  - 实现细节暴露给机器级程序\n- CISC ← RISC\n  - 动态将 CISC\
    \ 指令翻译成一系列更简单、类似 RISC 的操作\n  - X86-64：更多寄存器，更接近寄存器密集型过程链接，...\n\n## MIPS 一览\n\n\
    - MIPS 强调\n  - 简单的 load-store 指令集\n  - 为流水线效率而设计，包括固定的指令集编码\n  - 作为编译器目标的高效性\n\
    - 寄存器\n  - 32 个 64 位通用寄存器\n  - 32 个浮点寄存器\n  - R0 的值始终为 0\n- 数据类型\n  - 8、16、32\
    \ 和 64 位整数数据\n  - 32 和 64 位浮点数据\n- 定址方式\n  - 立即数和位移（偏移）\n  - 16 位字段\n- 指令格式\n\
    \  - 32 位固定指令\n  - 6 位主操作码\n  - I-type、R-type 和 J-type\n\n### I-type\n\n| Opcode\
    \ | rs | rt | imm |\n|---|---|---|---|\n\n编码：字节、半字、字、双字的加载和存储。所有立即数（rt ← rs op\
    \ immediate）\n\n条件分支指令（rs 为寄存器，rd 未使用）  \n跳转寄存器、跳转并链接寄存器  \n（rd = 0，rs = 目标，immediate\
    \ = 0）\n\n### J-type\n\n| Opcode | Offset added to PC |\n|---|---|\n\n跳转和跳转并链接\
    \  \n陷阱和异常返回\n\n### R-type\n\n| Opcode | rs | rt | rd | shamt | funct |\n|---|---|---|---|---|---|\n\
    \n寄存器-寄存器 ALU 操作：rd ← rs funct rt  \n功能编码数据通路操作：Add、Sub、...  \n读写特殊寄存器和移位\n\n\
    - 操作\n  - 算术/逻辑指令 R-type\n\n    ```\n    DADDU R1, R2, R3\n        Regs[R1] ←\
    \ Regs[R2] + Regs[R3]\n    ```\n\n    ```\n    DADDIU R1, R2, #3\n        Regs[R1]\
    \ ← Regs[R2] + 3\n    ```\n\n    ```\n    DSLL R1, R2, #5\n        Regs[R1] ←\
    \ Regs[R2] << 5\n    ```\n\n    ```\n    SLT R1, R2, R3\n        Regs[R1] ← (Regs[R2]<Regs[R3])\
    \ ? 1 : 0\n    ```\n\n  - 控制流\n\n    | Type | Instruction | Semantics |\n    |------|-------------|-----------|\n\
    \    | J-type | `J name` | `PC₃₆..₆₃ ← name` |\n    | J-type | `JAL name` | `Regs[R31]\
    \ ← PC+8; PC₃₆..₆₃ ← name` |\n    | | | `((PC+4)−2²⁷) <= name <= ((PC+4)+ 2²⁷)`\
    \ |\n    | R-type | `JR R3` | `PC ← Regs[R3]` |\n    | R-type | `JALR R2` | `Regs[R31]\
    \ ← PC+8; PC ← Regs[R2]` |\n    | I-type | `BEQZ R4, name` | `if (Regs[R4]==0)\
    \ PC ← name` |\n    | | | `((PC+4)−2¹⁷) <= name <= ((PC+4)+ 2¹⁷)` |\n    | R-type\
    \ | `MOVZ R1,R2,R3` | `if (Regs[R3]==0) Regs[R1] ← Regs[R2]` |\n\n## 感谢\n\n##\
    \ 流水线上的分支预测\n\n## 程序中的分支行为\n\n- 基于 SPEC 基准测试\n  - 分支在 INT 程序中出现的频率为 14% 到 16%，在\
    \ FP 程序中为 3% 到 12%。\n  - 约 75% 的分支是前向分支\n  - 60% 的前向分支被采用\n  - 80% 的后向分支被采用\n\
    \  - 67% 的所有分支都被采用\n\n"
