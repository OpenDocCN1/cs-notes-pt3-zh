    \ ;\n}\n```\n\n## 问题：死锁\n\n```c\nint main()\n{\n    pthread_t tid[2];\n    Sem_init(&mutex[0],\
    \ 0, 1);  /* mutex[0] = 1 */\n    Sem_init(&mutex[1], 0, 1);  /* mutex[1] = 1\
    \ */\n    Pthread_create(&tid[0], NULL, count, (void*)0);\n    Pthread_create(&tid[1],\
    \ NULL, count, (void*)1);\n    Pthread_join(tid[0], NULL);\n    Pthread_join(tid[1],\
    \ NULL);\n    printf(\"cnt=%d\\n\", cnt);\n    exit(0);\n}\n```\n\n```\nvoid *count(void\
    \ *var_gp)\n{\n    int i;\n    int id = (int) var_gp;\n    for (i = 0; i < NITERS;\
    \ i++) {\n        P(&mutex[id]); P(&mutex[1-id]);\n        cnt++;\n        V(&mutex[id]);\
    \ V(&mutex[1-id]);\n    }\n    return NULL;\n}\n```\n\nThread0\nTid[0]:\nP(s₀);\n\
    P(s₁);\ncnt++;\nV(s₀);\nV(s₁);\n\nThread1\nTid[1]:\nP(s₁);\nP(s₀);\ncnt++;\nV(s₁);\n\
    V(s₀);\n\n加锁引入了死锁的可能性：等待一个永远不会为真的条件。\n\n任何进入死锁区域的轨迹最终都会到达死锁状态，等待 s 或 t 变为非零。\n\
    \n其他轨迹则幸运地避开了死锁区域。\n\n初始时，s=t=1\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_910_0.png)\n\
    \n## 线程总结\n\n- 线程为编写并发程序提供了另一种机制\n- 线程越来越受欢迎\n  - 比进程成本稍低\n  - 线程间共享数据很容易\n- 然而，共享的便利性是有代价的：\n\
    \  - 很容易引入微妙的同步错误\n  - 使用线程时要谨慎！\n- 了解更多信息：\n  - D. Butenhof, \"Programming with\
    \ Posix Threads\", Addison-Wesley, 1997\n\n## 虚拟内存 (I)\n\n## 大纲\n\n- 物理寻址和虚拟寻址\n\
    - 地址空间\n- VM 作为缓存的工具\n- VM 作为内存管理的工具\n- VM 作为内存保护的工具\n- 建议阅读：9.1~9.5\n\n## 物理寻址\n\
    \n- **主存储器的属性**\n  - 组织为 M 个连续字节大小单元的数组\n  - 每个字节都有唯一的 **物理地址** (PA)，从 0 开始\n\
    - **物理寻址**\n  - CPU 使用物理地址访问内存\n- **示例**\n  - 早期 PC、DSP、嵌入式微控制器和 Cray 超级计算机\n\n\
    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_915_0.png)\n\n- 用于“简单”系统，如汽车、电梯和数码相框中的嵌入式微控制器\n\
    \n## 虚拟寻址\n\n- 虚拟寻址\n  - CPU 通过 **虚拟地址** (VA) 访问主存储器\n    - 虚拟地址会被转换为适当的物理地址\n\
    \n"
