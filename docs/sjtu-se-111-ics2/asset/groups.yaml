    \n## Instruction Control Unit\n\n- Register File\n  - Integer, floating-point\
    \ and other registers\n  - Controlled by Retirement Unit\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_315_0.png)\n\
    \n## Execution Unit\n\n- Operation Results\n  - Functional units can send results\
    \ directly to each other\n  - A elaborate form of data forwarding techniques\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_317_0.png)\n\n## Execution Unit\n\n\
    - Register Renaming\n  - Values passed directly from producer to consumers\n \
    \ - A tag † is generated to the result of the operation\n    - E.g. %ecx.0, %ecx.1\n\
    \  - Renaming table\n    - Maintain the association between program register r\
    \ and tag † for an operation that will update this register\n\n## Understanding\
    \ Translation Example\n\n| mulss (%rax,%rdx,4),%xmm0 | load (%rax,%rdx.0,4) ➔\
    \ t.1\nmulq t.1, %xmm0.0 ➔ %xmm0.1 |\n\n- Split into two operations\n  - Load\
    \ reads from memory to generate temporary result t.1\n  - Multiply operation just\
    \ operates on registers\n\n## Understanding Translation Example\n\n| mulss (%rax,%rdx,4),%xmm0\
    \ | load (%rax,%rdx.0,4) ➔ t.1\nmulq t.1, %xmm0.0  ➔ %xmm0.1 |\n\n- Operands\n\
    \  - Registers %rax does not change in loop\n  - Values will be retrieved from\
    \ register file during decoding\n"
  mdcn: "\n\n## 指令控制单元\n\n- 取指控制\n  - 预取当前正在访问的指令\n    - 足够的时间来解码指令并将解码后的操作发送到执行单元\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_305_0.png)\n\n### 取指控制\n\n- 分支预测\n\
    \  - 分支被取或顺序执行\n  - 猜测分支是否被取\n- 推测执行\n  - 仅根据分支预测进行取指、解码和执行\n  - 在分支预测是否确定之前\n\
    \n## 指令控制单元\n\n- 指令解码逻辑\n  - 获取实际的程序指令\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_307_0.png)\n\
    \n## 指令控制单元\n\n- 指令解码逻辑\n  - 获取实际的程序指令\n  - 将它们转换为一组基本操作\n    - 一条指令可以被解码为可变数量的操作\n\
    \  - 每个基本操作执行某个简单任务\n    - 简单算术、Load、Store\n  - 寄存器重命名\n\n```\naddl %eax, 4(%edx)\n\
    ```\n\n```\nload 4(%edx) → t1\naddl %eax, t1 → t2\nstore t2, 4(%edx)\n```\n\n\
    ## 执行单元\n\n- 多功能单元\n  - 从 ICU 接收操作\n  - 在每个时钟周期执行多个操作\n  - 处理特定类型的操作\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_309_0.png)\n\
    \n### 多功能单元\n\n- 多条指令可以并行执行\n  - Nehalem CPU（Core i7）\n    - 1 次加载，带地址计算\n   \
    \ - 1 次存储，带地址计算\n    - 2 个简单整数（其中一个可能是分支）\n    - 1 个复杂整数（乘法/除法）\n    - 1 个 FP\
    \ 乘法\n    - 1 个 FP 加法\n\n### 多功能单元\n\n- 有些指令需要 > 1 个周期，但可以流水线化\n\nNehalem（Core\
    \ i7）\n\n| Instruction | Latency | Cycles/Issue |\n|---|---|---|\n| Integer Add\
    \ | 1 | 0.33 |\n| Integer Multiply | 3 | 1 |\n| Integer/Long Divide | 11--21 |\
    \ 5--13 |\n| Single/Double FP Add | 3 | 1 |\n| Single/Double FP Multiply | 4/5\
    \ | 1 |\n| Single/Double FP Divide | 10--23 | 6--19 |\n\n## 执行单元\n\n- 操作被分派到多功能单元之一，只要\n\
    \  - 操作的所有操作数都已准备好\n  - 有合适的功能单元可用\n- 执行结果在功能单元之间传递\n\n## 指令控制单元\n\n- 退休单元\n \
    \ - 跟踪正在进行的处理\n  - 遵守机器级程序的顺序语义（误预测与异常）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_314_0.png)\n\
    \n## 指令控制单元\n\n- 寄存器文件\n  - 整数、浮点和其他寄存器\n  - 由退休单元控制\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_315_0.png)\n\
    \n## 执行单元\n\n- 操作结果\n  - 功能单元可以直接将结果发送给彼此\n  - 一种复杂的数据转发技术形式\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_317_0.png)\n\
    \n## 执行单元\n\n- 寄存器重命名\n  - 值直接从生产者传递给消费者\n  - 为操作的结果生成一个标签 †\n    - 例如 %ecx.0,\
    \ %ecx.1\n  - 重命名表\n    - 维护程序寄存器 r 与将更新此寄存器的操作的标签 † 之间的关联\n\n## 理解翻译示例\n\n| mulss\
    \ (%rax,%rdx,4),%xmm0 | load (%rax,%rdx.0,4) ➔ t.1\nmulq t.1, %xmm0.0 ➔ %xmm0.1\
    \ |\n\n- 分成两个操作\n  - Load 从内存读取以生成临时结果 t.1\n  - 乘法操作仅在寄存器上操作\n\n## 理解翻译示例\n\n\
    | mulss (%rax,%rdx,4),%xmm0 | load (%rax,%rdx.0,4) ➔ t.1\nmulq t.1, %xmm0.0  ➔\
    \ %xmm0.1 |\n\n- 操作数\n  - 寄存器 %rax 在循环中不改变\n  - 值将在解码期间从寄存器文件检索\n\n"
