  - '[PAGE 1142]


    # Example


    +   - Now We take Matrix multiplication as an example.

    +   - You met it in Lecture “Cache Friendly Code” Last Semester

    +   - This time, more specific.'
  - "[PAGE 1143]\n\n+   - Two Matrix X * Y = Z  each Matrix is N x N\n+   - Look at\
    \ the innermost loop. (Besides why register allocated first ? )\n\n```\nfor(i\
    \ = 0; i < N; i++)\n    for(k = 0; k < N; k++)\n        r = X(i,k); /*register\
    \ allocated*/\n        for(j = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n\
    ```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1143_0.png)"
  - '[PAGE 1144]


    +   - If Cache is large enough ... everything will be fine!

    +     - Thanks to Prefetching, All Z and Y items will be reused.

    +   - What if Cache can’t hold one N x N matrix?

    +     - Data Y would be replaced before reused

    +   - What if Cache can’t hold even a row in Z?

    +     - Z data in the cache can’t be reused'
  - "[PAGE 1145]\n\n+   - What is the worst case ?\n+   - 2N^3 + N^2 words of data\
    \ need to be read from memory in N^3 iterations\n\n```\nfor(i = 0; i < N; i++)\n\
    \    for(k = 0; k < N; k++)\n        r = X(i,k); /*register allocated*/\n    \
    \    for(j = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```"
  - '[PAGE 1146]


    +   - Try blocking the matrix into small chunk, thus cache can hold that small
    chunk. Then loop locality will be back.'
  - "[PAGE 1147]\n\n# Blocking code\n\n```\n```c\nfor(i = 0; i < N; i++)\n    for(k\
    \ = 0; k < N; k++)\n        r = X(i,k); /* register allocated */\n        for(j\
    \ = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```\n```\n\n```\n```c\nfor(kk\
    \ = 0; kk < N; kk+B)\n    for(jj = 0; jj < N; jj+B)\n        for(i = 0; i < N;\
    \ i++)\n            for(k = kk; k < min(kk+B-1,N); k++)\n                r = X(i,k);\n\
    \                for(j = jj; j < min(jj+B-1,N); j++)\n                    Z(i,j)\
    \ += r*Y(k,j);\n```\n```"
  - "[PAGE 1148]\n\n```\n```cpp\nfor(kk = 0; kk < N; kk+=B)\n    for(jj = 0; jj <\
    \ N; jj+=B)\n        for(i = 0; i < N; i++)\n            for(k = kk; k < min(kk+B-1,N);\
    \ k++)\n                r = X(i,k);\n                for(j = jj; j < min(jj+B-1,N);\
    \ j++)\n                    Z(i,j) += r*Y(k,j);\n```\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1148_0.png)"
  - "[PAGE 1149]\n\n+   - B <<< N (less than)\n+   - B is called blocking factor\n\
    +   - B x B submatrix of Y and a row of length B of Z can fit in cache. Thus called\
    \ B x B Blocking\n\n```\nfor (kk = 0; kk < N; kk+B)\n    for (jj = 0; jj < N;\
    \ jj+B)\n        for (i = 0; i < N; i++)\n            for (k = kk; k < min(kk+B-1,N);\
    \ k++)\n                r = X(i,k);\n                for (j = jj; j < min(jj+B-1,N);\
    \ j++)\n                    Z(i,j) += r*Y(k,j);\n```"
  md: "\n## (1,1) Correlating Predictor\n\n```\nif (d == 0)\n    d = 1;\nif (d ==\
    \ 1)\n{ ... }\n\nBNEZ  R1, L1      ; branch b1\nDADDUI R1, R0, #1\nL1: DADDUI\
    \ R3, R1, #-1\nBNEZ  R3, L2      ; branch b2\n...\nL2:\n```\n\n|  | b1 | b2 |\n\
    |---|---|---|\n| 0 | NT | NT |\n| 1 | T | NT |\n| 2 | T | T |\n\n- Extension:\
    \ (m,n) Correlating Predictor\n- Use behavior of the last m branches to choose\
    \ from among 2m n-bit predictors\n\n## Loop Optimization\n\nOct. 2013\n\n## Outline\n\
    \n- Why loop optimization\n- Common techniques\n- Blocking vs. Unrolling\n- Blocking\
    \ Example\n\n## Why\n\n- Loop: main bottleneck especially in Scientific Program(like\
    \ image processing).\n- Repeated execution: improve a little then Speedup a lot\n\
    \n## Definition\n\n- Loop optimization can be viewed as the application of a sequence\
    \ of specific loop transformations to the source code or intermediate representation\n\
    - Legality: result of the program should be preserved.\n\n## Loop Unrolling\n\n\
    - Mentioned a lot in class, which is also known as loop unwinding\n- The overhead\
    \ try to eliminate:\n  - Pointer arithmetic\n  - End of loop test\n\n## Simple\
    \ example\n\n| Normal loop | After loop unrolling |\n|---|---|\n| ```\nint x;\n\
    for (x = 0; x < 100; x++)\n{\n    delete(x);\n}\n``` | ```\nint x;\nfor (x = 0;\
    \ x < 100; x+=5)\n{\n    delete(x);\n    delete(x+1);\n    delete(x+2);\n    delete(x+3);\n\
    \    delete(x+4);\n}\n``` |\n\n## Cache Brief Review\n\n- Cache miss\n- One Cache\
    \ line each time\n- Additionally: TLB miss\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1141_0.png)\n\
    \n## Example\n\n- Now We take Matrix multiplication as an example.\n- You met\
    \ it in Lecture “Cache Friendly Code” Last Semester\n- This time, more specific.\n\
    \n- Two Matrix X * Y = Z  each Matrix is N x N\n- Look at the innermost loop.\
    \ (Besides why register allocated first ? )\n\n```\nfor(i = 0; i < N; i++)\n \
    \   for(k = 0; k < N; k++)\n        r = X(i,k); /*register allocated*/\n     \
    \   for(j = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1143_0.png)\n\
    \n- If Cache is large enough ... everything will be fine!\n  - Thanks to Prefetching,\
    \ All Z and Y items will be reused.\n- What if Cache can’t hold one N x N matrix?\n\
    \  - Data Y would be replaced before reused\n- What if Cache can’t hold even a\
    \ row in Z?\n  - Z data in the cache can’t be reused\n\n- What is the worst case\
    \ ?\n- 2N^3 + N^2 words of data need to be read from memory in N^3 iterations\n\
    \n```\nfor(i = 0; i < N; i++)\n    for(k = 0; k < N; k++)\n        r = X(i,k);\
    \ /*register allocated*/\n        for(j = 0; j < N; j++)\n            Z(i,j) +=\
    \ r*Y(k,j);\n```\n\n- Try blocking the matrix into small chunk, thus cache can\
    \ hold that small chunk. Then loop locality will be back.\n\n## Blocking code\n\
    \n```c\nfor(i = 0; i < N; i++)\n    for(k = 0; k < N; k++)\n        r = X(i,k);\
    \ /* register allocated */\n        for(j = 0; j < N; j++)\n            Z(i,j)\
    \ += r*Y(k,j);\n```\n\n```c\nfor(kk = 0; kk < N; kk+B)\n    for(jj = 0; jj < N;\
    \ jj+B)\n        for(i = 0; i < N; i++)\n            for(k = kk; k < min(kk+B-1,N);\
    \ k++)\n                r = X(i,k);\n                for(j = jj; j < min(jj+B-1,N);\
    \ j++)\n                    Z(i,j) += r*Y(k,j);\n```\n\n```cpp\nfor(kk = 0; kk\
    \ < N; kk+=B)\n    for(jj = 0; jj < N; jj+=B)\n        for(i = 0; i < N; i++)\n\
    \            for(k = kk; k < min(kk+B-1,N); k++)\n                r = X(i,k);\n\
    \                for(j = jj; j < min(jj+B-1,N); j++)\n                    Z(i,j)\
    \ += r*Y(k,j);\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1148_0.png)\n\n\
    - B <<< N (less than)\n- B is called blocking factor\n- B x B submatrix of Y and\
    \ a row of length B of Z can fit in cache. Thus called B x B Blocking\n\n```\n\
    for (kk = 0; kk < N; kk+B)\n    for (jj = 0; jj < N; jj+B)\n        for (i = 0;\
    \ i < N; i++)\n            for (k = kk; k < min(kk+B-1,N); k++)\n            \
    \    r = X(i,k);\n                for (j = jj; j < min(jj+B-1,N); j++)\n     \
    \               Z(i,j) += r*Y(k,j);\n```\n"
  mdcn: "\n\n## (1,1) 相关预测器\n\n```\nif (d == 0)\n    d = 1;\nif (d == 1)\n{ ... }\n\
    \nBNEZ  R1, L1      ; branch b1\nDADDUI R1, R0, #1\nL1: DADDUI R3, R1, #-1\nBNEZ\
    \  R3, L2      ; branch b2\n...\nL2:\n```\n\n|  | b1 | b2 |\n|---|---|---|\n|\
    \ 0 | NT | NT |\n| 1 | T | NT |\n| 2 | T | T |\n\n- 扩展：(m,n) 相关预测器\n- 使用最近 m 个分支的行为从\
    \ 2^m 个 n 位预测器中选择\n\n## 循环优化\n\nOct. 2013\n\n## 大纲\n\n- 为什么进行循环优化\n- 常见技术\n- 分块\
    \ vs. 展开\n- 分块示例\n\n## 为什么\n\n- 循环：尤其是科学程序（如图像处理）中的主要瓶颈。\n- 重复执行：稍微改进一下就能大幅提速\n\
    \n## 定义\n\n- 循环优化可以被视为将一系列特定的循环变换应用于源代码或中间表示\n- 合法性：程序的结果应保持不变。\n\n## 循环展开\n\n\
    - 在课堂上多次提到，也称为循环解绕\n- 试图消除的开销：\n  - 指针运算\n  - 循环结束测试\n\n## 简单示例\n\n| 普通循环 | 循环展开后\
    \ |\n|---|---|\n| ```\nint x;\nfor (x = 0; x < 100; x++)\n{\n    delete(x);\n\
    }\n``` | ```\nint x;\nfor (x = 0; x < 100; x+=5)\n{\n    delete(x);\n    delete(x+1);\n\
    \    delete(x+2);\n    delete(x+3);\n    delete(x+4);\n}\n``` |\n\n## 缓存简要回顾\n\
    \n- 缓存未命中\n- 每次一条缓存行\n- 另外：TLB 未命中\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1141_0.png)\n\
    \n## 示例\n\n- 现在我们以矩阵乘法为例。\n- 你在上学期“缓存友好代码”讲座中遇到过它\n- 这次，更具体一些。\n\n- 两个矩阵 X * Y\
    \ = Z 每个矩阵都是 N x N\n- 看看最内层循环。 （另外为什么先分配寄存器？）\n\n```\nfor(i = 0; i < N; i++)\n\
    \    for(k = 0; k < N; k++)\n        r = X(i,k); /*register allocated*/\n    \
    \    for(j = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1143_0.png)\n\
    \n- 如果缓存足够大……一切都会很顺利！\n  - 多亏了预取，所有 Z 和 Y 项都会被重用。\n- 如果缓存容不下一个 N x N 矩阵怎么办？\n\
    \  - 数据 Y 会在被重用前被替换\n- 如果缓存甚至容不下 Z 中的一行怎么办？\n  - 缓存中的 Z 数据无法被重用\n\n- 最坏情况是什么？\n\
    - 在 N^3 次迭代中，需要从内存读取 2N^3 + N^2 个字的数据\n\n```\nfor(i = 0; i < N; i++)\n    for(k\
    \ = 0; k < N; k++)\n        r = X(i,k); /*register allocated*/\n        for(j\
    \ = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```\n\n- 尝试将矩阵分块成小块，这样缓存可以容纳该小块。然后循环局部性就会恢复。\n\
    \n## 分块代码\n\n```c\nfor(i = 0; i < N; i++)\n    for(k = 0; k < N; k++)\n      \
    \  r = X(i,k); /* register allocated */\n        for(j = 0; j < N; j++)\n    \
    \        Z(i,j) += r*Y(k,j);\n```\n\n```c\nfor(kk = 0; kk < N; kk+B)\n    for(jj\
    \ = 0; jj < N; jj+B)\n        for(i = 0; i < N; i++)\n            for(k = kk;\
    \ k < min(kk+B-1,N); k++)\n                r = X(i,k);\n                for(j\
    \ = jj; j < min(jj+B-1,N); j++)\n                    Z(i,j) += r*Y(k,j);\n```\n\
    \n```cpp\nfor(kk = 0; kk < N; kk+=B)\n    for(jj = 0; jj < N; jj+=B)\n       \
    \ for(i = 0; i < N; i++)\n            for(k = kk; k < min(kk+B-1,N); k++)\n  \
    \              r = X(i,k);\n                for(j = jj; j < min(jj+B-1,N); j++)\n\
    \                    Z(i,j) += r*Y(k,j);\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1148_0.png)\n\
    \n- B <<< N（小于）\n- B 称为分块因子\n- Y 的 B x B 子矩阵和 Z 的长度为 B 的一行可以放入缓存。因此称为 B x B 分块\n\
    \n```\nfor (kk = 0; kk < N; kk+B)\n    for (jj = 0; jj < N; jj+B)\n        for\
    \ (i = 0; i < N; i++)\n            for (k = kk; k < min(kk+B-1,N); k++)\n    \
    \            r = X(i,k);\n                for (j = jj; j < min(jj+B-1,N); j++)\n\
    \                    Z(i,j) += r*Y(k,j);\n```\n\n"
