    \ |\n\n## Web content\n\n- Web servers return **content** to clients\n  - content:\
    \ a sequence of bytes with an associated MIME (Multipurpose Internet Mail Extensions)\
    \ type\n\n- Example MIME types\n  - `text/html` — HTML page\n  - `text/plain`\
    \ — Unformatted text\n  - `application/postscript` — Postscript document\n  -\
    \ `image/gif` — Binary image encoded in GIF format\n  - `image/jpg` — Binary image\
