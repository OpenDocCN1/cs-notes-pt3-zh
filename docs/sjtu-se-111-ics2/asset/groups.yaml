  - '[PAGE 388]


    # Process: phenomenon


    +   - The program appears to have exclusive use of all the processor, main memory,
    and I/O devices

    +   - The program appears to execute the instructions in the program, one after
    the other, without interruption

    +   - The code and data of the program appear to the only objects in the system’s
    memory'
