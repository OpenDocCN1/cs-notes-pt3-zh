  md: "\n## Echo client: open_clientfd() (connect)\n\n- The client creates a connection\
    \ with the server\n  - The client process suspends (blocks) until the connection\
    \ is created with the server.\n  - At this point the client is ready to begin\
    \ exchanging messages with the server via Unix I/O calls on the descriptor clientfd.\n\
    \n```\nint clientfd;                 /* socket descriptor */\nstruct sockaddr_in\
    \ serveraddr;  /* server address */\n\n/* establish a connection with the server\
    \ */\nConnect(clientfd, (SA*)&serveraddr, sizeof(serveraddr));\n```\n\n## Overview\
    \ of the Sockets Interface\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_723_0.png)\n\
    \n## Echo server\n\n```\nint main(int argc, char **argv) {\n    int listenfd,\
    \ connfd, port, clientlen;\n    struct sockaddr_in clientaddr;\n    struct hostent\
    \ *hp;\n    char *haddrp;\n\n    port = atoi(argv[1]); /* the server listens on\n\
    \        a port passed on the command line */\n    listenfd = open_listenfd(port);\n\
    ```\n\n## Echo server\n\n```c\nwhile (1) {\n    clientlen = sizeof(clientaddr);\n\
    \    connfd = Accept(listenfd,\n            (SA *)&clientaddr, &clientlen);\n\
    \    hp = Gethostbyaddr((const char *)\n            &clientaddr.sin_addr.s_addr,\n\
    \            sizeof(struct in_addr), AF_INET);\n    haddrp = inet_ntoa(clientaddr.sin_addr);\n\
    \    printf(\"server connected to %s (%s)\\n\",\n            hp->h_name, haddrp);\n\
    \    echo(connfd);\n    Close(connfd);\n}\n}\n```\n\n## Echo server: open_listenfd()\n\
    \n```\nint open_listenfd(int port)\n{\n    int listenfd;\n    int optval;\n  \
    \  struct sockaddr_in serveraddr;\n\n    /* create a socket descriptor */\n  \
    \  listenfd = Socket(AF_INET, SOCK_STREAM, 0);\n\n    /* eliminates \"Address\
    \ already in use\"\n       error from bind. */\n    optval = 1;\n    Setsockopt(listenfd,\
    \ SOL_SOCKET, SO_REUSEADDR,\n        (const void *)&optval , sizeof(int));\n```\n\
    \n## Echo server: open_listenfd() (cont)\n\n```\n/* listenfd will be an endpoint\
    \ for all requests to port on any IP address for this host */\nbzero((char *)\
    \ &serveraddr, sizeof(serveraddr));\nserveraddr.sin_family = AF_INET;\nserveraddr.sin_addr.s_addr\
    \ = htonl(INADDR_ANY);\nserveraddr.sin_port =\n    htons((unsigned short)port);\n\
    Bind(listenfd,\n    (SA *)&serveraddr, sizeof(serveraddr));\n/* make it a listening\
    \ socket ready to accept connection requests */\nListen(listenfd, LISTENQ);\n\
    return listenfd;\n}\n```\n\n## Echo server: `open_listenfd()` (setsockopt)\n\n\
    - The socket can be given some attributes.\n\n```\n/* eliminates \"Address already\
    \ in use\" error\n   from bind. */\noptval = 1;\nSetsockopt(listenfd, SOL_SOCKET,\
    \ SO_REUSEADDR,\n           (const void *)&optval, sizeof(int));\n```\n\n## Echo\
    \ server: `open_listenfd()` (setsockopt)\n\n- Handy trick that allows us to rerun\
    \ the server immediately after we kill it.\n  - Otherwise we would have to wait\
    \ about 15 secs.\n  - Eliminates “Address already in use” error from `bind()`.\n\
    \  - Strongly suggest you do this for all your servers to simplify debugging.\n\
    \n## Echo server: `open_listenfd()`\n\n- Next, we initialize the socket with the\
