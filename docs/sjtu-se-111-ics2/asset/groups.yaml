    \ m，则会触发一种称为文件结束（EOF）的条件\n    - 可以由应用程序检测到\n    - 文件末尾没有显式的“EOF 字符”\n\n## 读写文件\n\
    \n```\n#include <unistd.h>\n\nssize_t read(int fd, void *buf, size_t count);\n\
