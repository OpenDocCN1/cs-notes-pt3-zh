    - 考试（60%）\n  - 期中考试（20%）\n  - 期末考试（40%）\n  - 所有考试均为开卷/开笔记。\n- 实验（35%）\n  - 4 次实验（每次占\
    \ 7–10%）\n- 作业（5%）\n\n## 处理器架构\n\n## 主题\n- 回顾 y86 指令集架构\n- 逻辑设计\n- 硬件控制语言 HCL\n\
    - 建议阅读：4.1, 4.2\n\n## 目标\n- 理解计算机的基本组成\n  - 指令集架构\n- 深入探索 CPU 工作机制\n  - 指令是如何执行的\n\
    - 帮助你编程\n  - 充分理解计算机的组织和工作方式将帮助你编写更稳定、更高效的代码\n\n## 指令集架构 #1\n- 它是什么？\n  - 汇编语言抽象\n\
    \  - 机器语言抽象\n\n指令集架构（ISA）\n- 它提供了什么？\n  - 真实计算机的一种抽象，隐藏实现细节\n    - 计算机指令的语法\n\
    \    - 指令的语义\n    - 执行模型\n    - 程序员可见的计算机状态\n\n## 指令集架构 #2\n- 汇编语言视角\n  - 处理器状态\n\
    \    - 寄存器、内存等\n  - 指令\n    - `addl, movl, leal, ...`\n    - 指令如何编码为字节\n- 抽象层\n\
    \  - 上层：如何编程机器\n    - 处理器按顺序执行指令\n  - 下层：需要构建什么\n    - 使用技巧使其运行更快\n    - 例如，同时执行多条指令\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_10_0.png)\n\n## 指令集架构 #3\n- ISA 定义处理器家族\n\
    \  - 两大类：RISC 和 CISC\n    - RISC: SPARC, MIPS, PowerPC, ARM\n    - CISC: X86（或称为\
    \ IA32）\n- 在相同的 ISA 下，有许多不同的处理器\n  - 来自不同的制造商\n    - X86 来自 Intel、AMD 和 VIA\n\
    \  - 不同的型号\n    - 8086, 80386, Pentium, Pentium 4\n\n## Y86 处理器状态\n- 程序寄存器\n \
    \ - 与 IA32 相同的 8 个寄存器，每个 32 位\n- 条件码\n  - 由算术或逻辑指令设置的单比特标志\n    - OF：溢出  ZF：零\
    \  SF：负数\n- 程序计数器\n  - 指示指令的地址\n- 内存\n  - 字节可寻址的存储数组\n  - 字以小端字节序存储\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_12_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_12_1.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_12_2.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_12_3.png)\n\n## Y86 指令\n- 格式（P259）\n\
    \  - 从内存读取 1--6 字节的信息\n    - 可以从第 1 个字节确定指令长度\n    - 指令类型不如 IA32 多，编码也比 IA32 简单\n\
    \  - 每条指令都会访问和修改程序状态的某些部分\n\n| 长度 |  | 字节0 | 字节1 | 字节2 | 字节3 | 字节4 | 字节5 |\n|---|---|---|---|---|---|---|---|\n\
    | 1 | nop | 0 | 0 |  |  |  |  |\n| 1 | halt | 1 | 0 |  |  |  |  |\n| 2 | rrmovl\
    \ rA,rB | 2 | 0 | rA rB |  |  |  |\n| 6 | irmovl V,rB | 3 | 0 | rA rB | V |  |\
    \  |\n| 6 | rmmovl rA,D(rB) | 4 | 0 | rA rB | Dest |  |  |\n| 6 | mrmovl D(rB),rA\
    \ | 5 | 0 | rA rB | Dest |  |  |\n| 2 | opl rA,rB | 6 | fn | rA rB |  |  |  |\n\
    | 2 | addl rA,rB | 6 | 0 | rA rB |  |  |  |\n| 2 | subl rA,rB | 6 | 1 | rA rB\
    \ |  |  |  |\n| 2 | andl rA,rB | 6 | 2 | rA rB |  |  |  |\n| 2 | xorl rA,rB |\
    \ 6 | 3 | rA rB |  |  |  |\n| 5 | jxx Dest | 7 | fn | Dest |  |  |  |\n| 5 | jmp\
    \ Dest | 7 | 0 | Dest |  |  |  |\n| 5 | jle Dest | 7 | 1 | Dest |  |  |  |\n|\
    \ 5 | jl Dest | 7 | 2 | Dest |  |  |  |\n| 5 | je Dest | 7 | 3 | Dest |  |  |\
    \  |\n| 5 | jne Dest | 7 | 4 | Dest |  |  |  |\n| 5 | jge Dest | 7 | 5 | Dest\
    \ |  |  |  |\n| 5 | jg Dest | 7 | 6 | Dest |  |  |  |\n| 5 | call Dest | 8 | 0\
    \ | Dest |  |  |  |\n| 1 | ret | 9 | 0 |  |  |  |  |\n| 2 | pushl rA | A | 0 |\
    \ rA 8 |  |  |  |\n| 2 | popl rA | B | 0 | rA 8 |  |  |  |\n\n## Y86 指令集\n\n"
