  mdcn: "\n\n## 循环展开\n\n```\nvoid combine5(vec_ptr v, int *dest)\n{\n    int i;\n\
    \    int length = vec_length(v);\n    int limit = length - 2;\n    int *data =\
    \ get_vec_start(v);\n    int x = IDENT;\n\n    /* combine 3 elements at a time\
    \ */\n    for (i = 0; i < limit; i+=3)\n        x = x OPER data[i] OPER data[i+1]\
    \ OPER data[i+2];\n\n    /* finish any remaining elements */\n    for (; i < length;\
    \ i++)\n        x = x OPER data[i];\n\n    *dest = x;\n}\n```\n\n## 翻译\n\n- 加载可以流水线，因为没有依赖关系\n\
    - 只有一组循环控制操作\n\n```\nload (%rax,%rdx.0,4) ➔ t.1a\naddq t.1a, %rcx.0c ➔ %rcx.1a\n\
    load 4(%rax,%rdx.0,4) ➔ t.1b\naddq t.1b, %rcx.1a ➔ %rcx.1b\nload 8(%rax,%rdx.0,4)\
    \ ➔ t.1c\naddq t.1c, %rcx.1b ➔ %rcx.1c\naddq $3,%rdx.0 ➔ %rdx.1\ncmpq %rdx.1,\
    \ %rbp ➔ cc.1\njg-taken cc.1\n```\n\n## 循环展开\n\n- 提高性能\n  - 减少操作次数（例如循环索引和条件分支）\n\
    \  - 转换代码以减少关键路径中的操作次数\n- 两种整数操作的 CPE 均有所改善\n- 但两种浮点操作均未改善\n\n## 展开的影响\n\n- 关键路径\n\
    \  - 整数加法的延迟为 1\n  - FP 多路复用的延迟为 4\n\n## 展开的影响\n\n- 仅对我们的示例中的整数求和有帮助\n  - 其他情况受功能单元延迟的限制\n\
    - 展开程度的影响是非线性的\n  - 许多微妙的影响决定了操作的精确调度\n\n## 增强并行性\n\n- 多个累加器\n  - 在两个不同的和中累加\n\
    \    - 可以同时执行\n  - 最后合并\n\n## 翻译\n\n- 循环内的两个乘法不再具有数据依赖性\n- 允许它们流水线\n\n```\nload\
    \ (%rax,%rdx.0,4) ➔ t.1a\nmulq t.1a, %xmm0.0 ➔ %xmm0.1\nload 4(%rax,%rdx.0,4)\
    \ ➔ t.1b\nmulq t.1b, %xmm1.0 ➔ %xmm1.1\naddq $2,%rdx.0 ➔ %rdx.1\ncmpq %rdx.1,\
    \ %rbp ➔ cc.1\njg-taken cc.1\n```\n\n## 图形表示\n\n```\nmulss (%rax,%rdx,4), %xmm0\n\
    mulss 4(%rax,%rdx,4), %xmm1\naddq $2,%rdx\ncmpq %rdx,%rbp\njg loop\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_351_0.png)\n\
