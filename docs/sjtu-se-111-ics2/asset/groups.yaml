    \  - 返回 -1\n    - 将 errno 设置为 EINTR\n\n```\n`pid_t waitpid(pid_t pid, int *status,\
    \ int options);`\n```\n\n- `options = 0`\n  - waitpid 会挂起调用进程的执行，直到其等待集合中的某个子进程终止\n\
    \  - 如果调用时等待集合中已有进程终止，则 waitpid 立即返回\n  - waitpid 返回导致 waitpid 返回的那个已终止子进程的 PID\n\
    \  - 该已终止子进程会从系统中移除\n\n"
