  md: "\n## Serving dynamic content\n\n- The server creates a child process and runs\
    \ the program identified by the URI in that process\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_757_0.png)\n\
    \n- The child runs and generates the dynamic content.\n- The server captures the\
    \ content of the child and forwards it without modification to the client\n\n\
    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_758_0.png)\n\n- 1. How does the client\
    \ pass program arguments to the server?\n- 2. How does the server pass these arguments\
    \ to the child?\n- 3. How does the server pass other info relevant to the request\
    \ to the child?\n\n- 4. How does the server capture the content produced by the\
    \ child?\n\n- These issues are addressed by the Common Gateway Interface (CGI)\
    \ specification.\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_761_0.png)\n\n- **Question:**\n\
    \  - How does the client pass arguments to the server?\n- **Answer:**\n  - The\
    \ arguments are appended to the URI\n    - `http://add.com/cgi-bin/adder?1&2`\n\
    \    - `adder` is the CGI program on the server that will do the addition.\n \
    \   - argument list starts with `\"?\"`\n    - arguments separated by `\"&\"`\n\
    \    - spaces represented by `\"%20\"`\n\n- **Question:**\n  - How does the server\
    \ pass these arguments to the child?\n\n- **Answer:**\n  - In environment variable\
    \ `QUERY_STRING`\n    - a single string containing everything after the “?”\n\
    \    - for add.com: `QUERY_STRING = \"1&2\"`\n\n```c\nif ((buf = getenv(\"QUERY_STRING\"\
    )) != NULL) {\n    p = strchr(buf, '/&');\n    *p = '\\0';\n    strcpy(arg1, buf);\n\
    \    strcpy(arg2, p+1);\n    n1 = atoi(arg1);\n    n2 = atoi(arg2);\n}\n```\n\n\
    - **Question:**\n  - How does the server pass other info relevant to the request\
    \ to the child?\n- **Answer:**\n  - in a collection of environment variables defined\
    \ by the CGI spec.\n\n## Some CGI environment variables\n\n- Request-specific\n\
    \  - QUERY_STRING (contains GET args)\n  - SERVER_PORT\n  - REQUEST_METHOD (GET,\
    \ POST, etc)\n  - REMOTE_HOST (domain name of client)\n  - REMOTE_ADDR (IP address\
    \ of client)\n  - CONTENT_TYPE (for POST, MIME type of the request body)\n  -\
    \ CONTENT_LENGTH (for POST, length in bytes)\n\n## Tiny Web Server\n\n- Tiny Web\
    \ server described in text\n  - Tiny is a sequential Web server.\n  - Serves static\
    \ and dynamic content to real browsers.\n    - text files, HTML files, GIF and\
    \ JPEG images.\n  - 226 lines of commented C code.\n  - Not as complete or robust\
    \ as a real web server\n\n```\n/* Domain Name Service (DNS) host entry */\nstruct\
    \ hostent {\n    char     *h_name;        /* official name of host */\n    char\
    \     **h_aliases;        /* alias list */\n    int      h_addrtype;        /*\
    \ host address type */\n    int      h_length;          /* length of address */\n\
    \    char     **h_addr_list;     /* list of addresses */\n}\n\n/* Internet address\
    \ */\nstruct in_addr {\n    unsigned int s_addr;        /* 32-bit IP address */\n\
    };\n\n/* Generic socket address structure\n(for connect, bind, and accept) */\n\
    struct sockaddr {\n    unsigned short sa_family;   /* protocol family */\n   \
    \ char sa_data[14];           /* address data */\n}\n```\n\n```\n/* Internet style\
    \ socket address */\nstruct sockaddr_in {\n    /* Address family (AF_INET) */\n\
    \    unsigned short sin_family;\n    unsigned short sin_port;    /* Port number\
    \ */\n    struct in_addr sin_addr;    /* IP address */\n    /* Pad to sizeof \"\
    struct sockaddr\" */\n    unsigned char  sin_zero[8];\n};\n```\n\n## Overview\
    \ of the Sockets Interface\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_772_0.png)\n\
    \n```\nstruct hostent *genhostbyname(const char *name);  \nstruct hostent *genhostbyaddr(\
    \  \n    const char *addr, int len, 0);  \n\n/* client-side socket interface */\
    \  \nint socket(int domain, int type, int protocol);  \nint connect(int sockfd,\
    \  \n            struct sockaddr *serv_addr,  \n            int addr_len);  \n\
    \n/* server-side socket interface */  \nint bind(int sockfd,  \n         struct\
    \ sockaddr *my_addr,  \n         int addrlen);  \nint listen(int sockfd, int backlog);\
    \  \nint accept(int listenfd,  \n           struct sockaddr *addr,  \n       \
    \    int addrlen);\n```\n"
  mdcn: "\n\n## 提供动态内容\n\n- 服务器创建一个子进程并在该进程中运行由 URI 标识的程序\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_757_0.png)\n\
    \n- 子进程运行并生成动态内容。\n- 服务器捕获子进程的内容并未经修改地转发给客户端\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_758_0.png)\n\
    \n- 1. 客户端如何向服务器传递程序参数？\n- 2. 服务器如何将这些参数传递给子进程？\n- 3. 服务器如何将与请求相关的其他信息传递给子进程？\n\
    \n- 4. 服务器如何捕获子进程生成的内容？\n\n- 这些问题由通用网关接口 Common Gateway Interface (CGI) 规范解决。\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_761_0.png)\n\n- **问题：**\n  - 客户端如何向服务器传递参数？\n\
    - **答案：**\n  - 参数附加到 URI 后面\n    - `http://add.com/cgi-bin/adder?1&2`\n    - `adder`\
    \ 是服务器上将执行加法的 CGI 程序。\n    - 参数列表以 `\"?\"` 开始\n    - 参数之间用 `\"&\"` 分隔\n    - 空格用\
    \ `\"%20\"` 表示\n\n- **问题：**\n  - 服务器如何将这些参数传递给子进程？\n\n- **答案：**\n  - 在环境变量 `QUERY_STRING`\
    \ 中\n    - 一个包含问号之后所有内容的字符串\n    - 对于 add.com：`QUERY_STRING = \"1&2\"`\n\n```c\n\
    if ((buf = getenv(\"QUERY_STRING\")) != NULL) {\n    p = strchr(buf, '/&');\n\
    \    *p = '\\0';\n    strcpy(arg1, buf);\n    strcpy(arg2, p+1);\n    n1 = atoi(arg1);\n\
    \    n2 = atoi(arg2);\n}\n```\n\n- **问题：**\n  - 服务器如何将与请求相关的其他信息传递给子进程？\n- **答案：**\n\
    \  - 在 CGI 规范定义的一组环境变量中。\n\n## 一些 CGI 环境变量\n\n- 请求特定\n  - QUERY_STRING （包含 GET\
    \ 参数）\n  - SERVER_PORT\n  - REQUEST_METHOD （GET, POST 等）\n  - REMOTE_HOST （客户端域名）\n\
    \  - REMOTE_ADDR （客户端 IP 地址）\n  - CONTENT_TYPE （对于 POST，请求体的 MIME 类型）\n  - CONTENT_LENGTH\
    \ （对于 POST，字节长度）\n\n## Tiny Web Server\n\n- 文本中描述的 Tiny Web 服务器\n  - Tiny 是一个顺序\
    \ Web 服务器。\n  - 为真实浏览器提供静态和动态内容。\n    - 文本文件、HTML 文件、GIF 和 JPEG 图像。\n  - 226 行带注释的\
    \ C 代码。\n  - 不如真正的 Web 服务器完整或健壮\n\n```\n/* Domain Name Service (DNS) host entry\
    \ */\nstruct hostent {\n    char     *h_name;        /* official name of host\
    \ */\n    char     **h_aliases;        /* alias list */\n    int      h_addrtype;\
    \        /* host address type */\n    int      h_length;          /* length of\
    \ address */\n    char     **h_addr_list;     /* list of addresses */\n}\n\n/*\
    \ Internet address */\nstruct in_addr {\n    unsigned int s_addr;        /* 32-bit\
    \ IP address */\n};\n\n/* Generic socket address structure\n(for connect, bind,\
    \ and accept) */\nstruct sockaddr {\n    unsigned short sa_family;   /* protocol\
    \ family */\n    char sa_data[14];           /* address data */\n}\n```\n\n```\n\
    /* Internet style socket address */\nstruct sockaddr_in {\n    /* Address family\
    \ (AF_INET) */\n    unsigned short sin_family;\n    unsigned short sin_port; \
    \   /* Port number */\n    struct in_addr sin_addr;    /* IP address */\n    /*\
    \ Pad to sizeof \"struct sockaddr\" */\n    unsigned char  sin_zero[8];\n};\n\
    ```\n\n## Sockets 接口概述\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_772_0.png)\n\
    \n```\nstruct hostent *genhostbyname(const char *name);  \nstruct hostent *genhostbyaddr(\
    \  \n    const char *addr, int len, 0);  \n\n/* client-side socket interface */\
    \  \nint socket(int domain, int type, int protocol);  \nint connect(int sockfd,\
    \  \n            struct sockaddr *serv_addr,  \n            int addr_len);  \n\
    \n/* server-side socket interface */  \nint bind(int sockfd,  \n         struct\
    \ sockaddr *my_addr,  \n         int addrlen);  \nint listen(int sockfd, int backlog);\
    \  \nint accept(int listenfd,  \n           struct sockaddr *addr,  \n       \
    \    int addrlen);\n```\n"
