  md: "\n## Exceptions for Y86(review)\n- Conditions under which pipeline cannot continue\
    \ normal operation\n- Causes\n  - Halt instruction (Current)\n  - Bad address\
    \ for instruction or data (Previous)\n  - Invalid instruction (Previous)\n  -\
    \ Pipeline control error (Previous)\n\n## Exceptions for Y86(review)\n- Desired\
    \ Action\n  - Complete some instructions\n    - Either current or previous (depends\
    \ on exception type)\n  - Discard others\n  - Call exception handler\n    - Like\
    \ an unexpected procedure call\n\n## Exceptional control flow\n- Mechanisms for\
    \ exceptional control flow exists at all levels of a computer system.\n- Low level\
    \ mechanism:\n  - exceptions\n    - change in control flow in response to a system\
    \ event (i.e., change in system state)\n    - Implemented as a combination of\
    \ both hardware and OS software\n\n## Exceptional control flow\n- Higher level\
    \ mechanisms:\n  - process context switch (OS level)\n  - signals\n  - nonlocal\
    \ jumps (setjmp/longjmp)\n  - Implemented by either:\n    - OS software (context\
    \ switch and signals).\n    - C language runtime library: nonlocal jumps.\n\n\
    ## Event\n- Significant changes in the processor 's state\n- Encoded in various\
    \ bits and signals inside the processor\n- It may be related to the execution\
    \ of the current instruction\n  - Page fault, arithmetic overflow\n- It may be\
    \ unrelated to the execution of the current instruction\n  - A system timer goes\
    \ off,\n  - An I/O request completes\n\n## Exceptions\n- When the exception handler\
    \ finishes processing:\n  1. The handler returns control to the current instruction\
    \ Ic​urr\n  2. The handler returns control to the next instruction Inext\n  3.\
    \ The handler aborts the interrupted program\n\n## Exception Table\n- 1. Each\
    \ type of event has a unique exception number k\n- 2. Exception table entry k\
    \ points to a function (exception handler).\n- 3. Handler k is called each time\
    \ exception k occurs.\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_415_0.png)\n\
    \n## Exception Table\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_416_0.png)\n\n\
    ## Exception Handler\n- The processor pushes a return address on the stack the\
    \ return address is\n  - either the current instruction\n  - or the next instruction\n\
    - The processor also pushes some additional processor state onto the stack\n \
    \ - will be necessary to restart the interrupted program when the handler returns\n\
    \    - e.g. the current condition codes\n\n## Exception Handler\n- All of these\
    \ items are pushed onto the kernel's stack\n  - rather than onto the user's stack\n\
    \  - If control is being transferred from a user program to the kernel\n- Exception\
    \ handlers run in kernel mode\n  - means they have complete access to all system\
    \ resources\n\n## Exceptional Control Flow II\n\n## Outline\n- Classes of Exceptions\n\
    - Kernel Mode and User Mode\n- Context Switch\n- System Calls and Error Handling\n\
    - Process Control\n- Suggested reading 8.1.4, 8.2, 8.3, 8.4\n\n## Asynchronous\
    \ exceptions (interrupts)\n- Caused by events (changes in state) external to the\
    \ processor\n  - Indicated by setting the processor's interrupt pin\n  - handler\
    \ returns to \"next\" instruction.\n\n## Asynchronous exceptions (interrupts)\n\
    - Examples:\n  - I/O interrupts\n    - hitting ctl-c at the keyboard\n    - arrival\
    \ of a packet from a network\n    - arrival of a data sector from a disk\n  -\
    \ Hard reset interrupt\n    - hitting the reset button\n  - Soft reset interrupt\n\
    \    - hitting ctl-alt-delete on a PC\n\n## System context for exceptions\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_423_0.png)\n\
    \n## Synchronous exceptions\n- Caused by events that occur as a result of executing\
    \ an instruction\n  - e.g. faulty instruction\n- Traps\n  - Intentional\n  - returns\
    \ control to \"next\" instruction\n  - Examples: system calls, breakpoint traps\n"
  mdcn: "\n\n## Y86 的异常（复习）\n- 管道无法继续正常操作的条件\n- 原因\n  - 停机指令（当前）\n  - 指令或数据的地址错误（前一）\n\
    \  - 无效指令（前一）\n  - 管道控制错误（前一）\n\n## Y86 的异常（复习）\n- 期望的操作\n  - 完成部分指令\n    - 取决于异常类型，为当前或前一指令\n\
    \  - 丢弃其他指令\n  - 调用异常处理程序\n    - 如一次意外的过程调用\n\n## 异常控制流\n- 异常控制流的机制存在于计算机系统的所有层级。\n\
    - 低级机制：\n  - 异常\n    - 对系统事件（即系统状态变化）的控制流改变\n    - 由硬件和操作系统软件组合实现\n\n## 异常控制流\n\
    - 高级机制：\n  - 进程上下文切换（操作系统层）\n  - 信号\n  - 非局部跳转（setjmp/longjmp）\n  - 由以下实现：\n \
    \   - 操作系统软件（上下文切换和信号）。\n    - C 语言运行时库：非局部跳转。\n\n## 事件\n- 处理器状态的显著变化\n- 编码在处理器内部的各种位和信号中\n\
    - 它可能与当前指令的执行相关\n  - 页故障，算术溢出\n- 它可能与当前指令的执行无关\n  - 系统计时器响起，\n  - I/O 请求完成\n\n\
    ## 异常\n- 当异常处理程序完成处理时：\n  1. 处理程序将控制返回给当前指令 Ic​urr\n  2. 处理程序将控制返回给下一指令 Inext\n\
    \  3. 处理程序中止被中断的程序\n\n## 异常表\n- 1. 每种类型的事件都有一个唯一的异常号 k\n- 2. 异常表项 k 指向一个函数（异常处理程序）。\n\
    - 3. 每次发生异常 k 时都会调用处理程序 k。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_415_0.png)\n\
    \n## 异常表\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_416_0.png)\n\n## 异常处理程序\n-\
    \ 处理器将返回地址压入栈，返回地址为\n  - 当前指令\n  - 或下一指令\n- 处理器还将一些额外的处理器状态压入栈\n  - 当处理程序返回时将需要重启被中断的程序\n\
    \    - 例如当前的条件码\n\n## 异常处理程序\n- 所有这些项目都压入内核的栈中\n  - 而不是压入用户的栈\n  - 如果控制正在从用户程序转移到内核\n\
    - 异常处理程序在内核模式下运行\n  - 意味着它们可以完全访问所有系统资源\n\n## 异常控制流 II\n\n## 大纲\n- 异常的类别\n- 内核模式和用户模式\n\
    - 上下文切换\n- 系统调用和错误处理\n- 进程控制\n- 建议阅读 8.1.4, 8.2, 8.3, 8.4\n\n## 异步异常（中断）\n- 由处理器外部的事件（状态变化）引起\n\
    \  - 通过设置处理器的中断引脚来指示\n  - 处理程序返回到“下一”指令。\n\n## 异步异常（中断）\n- 示例：\n  - I/O 中断\n \
    \   - 在键盘上按下 ctl-c\n    - 网络到达数据包\n    - 磁盘到达数据扇区\n  - 硬复位中断\n    - 按下复位按钮\n \
    \ - 软复位中断\n    - 在 PC 上按下 ctl-alt-delete\n\n## 异常的系统上下文\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_423_0.png)\n\
    \n## 同步异常\n- 由执行指令的结果而发生的事件引起\n  - 例如有缺陷的指令\n- 陷阱\n  - 故意触发\n  - 返回控制到“下一”指令\n\
    \  - 示例：系统调用，断点陷阱\n\n"
