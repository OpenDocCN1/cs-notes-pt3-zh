    \ Implementation\n\n- Layered on Unix file:\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_643_0.png)\n\
    \n## Robust I/O\n\n- Buffered Input and Output\n  - Efficiently read text lines\
    \ and binary data from a file whose contents are cached in an application-level\
    \ buffer\n\n```\n#include \"csapp.h\"\nvoid rio_readinitb(rio_t *rp, int fd) ;\n\
    ssize_t rio_readlineb(rio_t *rp,\n    void *usrbuf, size_t maxlen);\nssize_t rio_readnb(rio_t\
    \ *rp,\n    void *usrbuf, size_t maxlen);\nreturns: number of bytes read (0 if\
    \ EOF), -1 on error\n```\n\n## Robust I/O\n\n```\n#define RIO_BUFSIZE 8192\ntypedef\
    \ struct {\n    int rio_fd;\n    int rio_cnt;\n    char *rio_bufptr;\n    char\
    \ rio_buf[RIO_BUFSIZE];\n} rio_t ;\n\nvoid rio_readinitb(rio_t *rp, int fd)\n\
    {\n    rp->rio_fd = fd ;\n    rp->rio_cnt = 0 ;\n    rp->rio_bufptr = rp->rio_buf\
    \ ;\n}\n```\n\n## Robust I/O\n\n```\n#include \"csapp.h\"\n\nint main(int argc,\
    \ char **argv)\n{\n    int n;\n    rio_t rio;\n    char buf[MAXLINE];\n\n    Rio_readinitb(&rio,\
    \ STDIN_FILENO);\n    while ((n = Rio_readlineb(\n            &rio, buf, MAXLINE))\
    \ != 0)\n        Rio_writen(STDOUT_FILENO, buf, n);\n}\n```\n\n```\nstatic ssize_t\
    \ rio_read(rio_t *rp, char *usrbuf, size_t n)\n{\n    int cnt = 0;\n\n    while\
    \ (rp->rio_cnt <= 0) { /* refill if buf is empty */\n        rp->rio_cnt = read(rp->rio_fd,\
    \ rp->rio_buf,\n                           sizeof(rp->rio_buf));\n        if (rp->rio_cnt\
    \ < 0) {\n            if (errno != EINTR)\n                return -1;\n      \
    \  }\n        else if (rp->rio_cnt == 0) /* EOF */\n            return 0;\n  \
    \      else\n            rp->rio_bufptr = rp->rio_buf; /* reset buffer ptr */\n\
    \    }\n}\n```\n\n```\n/* Copy min(n, rp->rio_cnt) bytes\n    from internal buf\
    \ to user buf */\ncnt = n ;\nif ( rp->rio_cnt < n)\n    cnt = rp->rio_cnt ;\n\
    memcpy(usrbuf, rp->rio_bufptr, cnt) ;\nrp->rio_bufptr += cnt ;\nrp->rio_cnt -=\
    \ cnt ;\nreturn cnt ;\n}\n```\n\n```\nssize_t rio_readnb(rio_t *rp, void *usrbuf,\
    \ size_t n)\n{\n    size_t nleft = n;  ssize_t nread ;\n    char *bufp = usrbuf;\n\
    \    while (nleft > 0) {\n        if ((nread = rio_read(rp, bufp, nleft)) < 0)\
    \ {\n            if ( errno != EINTR)\n                /* interrupted by sig handler\
    \ return */\n            nread = 0;\n        else\n            return -1;\n  \
    \      }\n        else if (nread == 0)\n            break;\n        nleft -= nread;\n\
    \        bufp += nread;\n    }\n    return (n - nleft);\n}\n```\n\n```\nssize_t\
    \ rio_readlineb (rio_t *rp,\n    void *usrbuf, size_t maxlen)\n{\n    int n, rc;\n\
    \    char c, *bufp = usrbuf;\n    for (n=1; n < maxlen; n++) {\n        if ((rc\
    \ = rio_read(rp, &c, 1)) == 1) {\n            *bufp++ = c;\n            if (c\
    \ == '\\n')\n                break;\n        } else if (rc == 0) {\n         \
    \   if (n== 1)\n                return 0; /* EOF, no data read */\n          \
    \  else\n                break;\n        } else\n            return -1; /* error\
    \ */\n    }\n    *bufp = 0 ;\n    return n ;\n}\n```\n\n## Standard I/O\n\n- The\
    \ C standard library (`libc.so`) contains a collection of higher-level standard\
    \ I/O functions\n- Examples of standard I/O functions:\n  - Opening and closing\
    \ files (`fopen` and `fclose`)\n  - Reading and writing bytes (`fread` and `fwrite`)\n\
    \  - Reading and writing text lines (`fgets` and `fputs`)\n  - Formatted reading\
    \ and writing (`fscanf` and `fprintf`)\n"
