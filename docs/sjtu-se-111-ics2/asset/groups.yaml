  mdcn: "\n\n## Fork 函数\n\n- **复制但独立**的地址空间\n  - 在 `fork` 函数于每个进程中返回后，每个进程的地址空间是相同的。\n\
    \    - 当 `fork` 函数在第 8 行返回时，局部变量 x 在父进程和子进程中的值都为 1。\n\n```\n1 #include \"csapp.h\"\
    \n2 \n3 int main()\n4 {\n5     pid_t pid;\n6     int x = 1;\n7 \n8     pid = Fork();\n\
    9     if (pid == 0) { /* child */\n10        printf(\"child : x=%d\\n\", ++x);\n\
    11        exit(0);\n12    }\n13 \n14    /* parent */\n15    printf(\"parent: x=%d\\\
    n\", --x);\n16    exit(0);\n17 }\n```\n\n- **复制但独立**的地址空间。\n  - 父进程和子进程是独立的进程\n\
    \    - 它们各自拥有自己的**私有**地址空间。\n    - 父进程或子进程之后对 x 所做的任何更改\n      - 是私有的\n      -\
    \ 不会反映在另一个进程的内存中。\n\n- 复制但独立的地址空间\n  - 当父进程和子进程调用各自的 printf 语句时，变量 x 在两者中的值不同。\n\
    - 共享文件\n  - 如 stdout\n  - 子进程与父进程之间的通信\n\n```\n1 #include \"csapp.h\"\n2\n3 int\
    \ main()\n4 {\n5     Fork();\n6     printf(\"hello!\\n\");\n7     exit(0);\n8\
    \ }\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_491_0.png)\n\n(a) 调用 fork\
    \ 一次。\n\n(b) 打印两行输出。\n\n```\n1 #include \"csapp.h\"\n2\n3 int main()\n4 {\n5 \
    \    Fork();\n6     Fork();\n7     printf(\"hello!\\n\");\n8     exit(0);\n9 }\n\
    ```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_492_0.png)\n\n(c) 调用 fork 两次。\
    \    (d) 打印四行输出。\n\n```\n1 #include \"csapp.h\"\n2\n3 int main()\n4 {\n5     Fork();\n\
    6     Fork();\n7     Fork();\n8     printf(\"hello!\\n\");\n9     exit(0);\n10\
    \ }\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_493_0.png)\n\n(e) 调用 fork\
    \ 三次。 (f) 打印八行输出。\n\n## 僵尸进程\n\n- 进程终止后，内核不会立即将其从系统中移除\n- 该进程会以终止状态保留，直到其父进程将其回收。\n\
    \n- 当父进程回收已终止的子进程时\n  - 内核会将子进程的退出状态传递给父进程，\n  - 然后丢弃该终止进程，此时它不再存在。\n- 尚未被回收的终止进程称为**僵尸进程**。\n\
    \n- 如果父进程\n  - 在未回收其僵尸子进程的情况下终止，\n  - 内核会安排 `init` 进程来回收它们。\n- `init` 进程\n  -\
