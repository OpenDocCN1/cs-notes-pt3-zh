    \ = Rio_readlineb(&rio, buf, MAXLINE)) !=0) {\n        printf(\"server received\
    \ %d bytes\\n\", n);\n        Rio_writen(connfd, buf, n);\n    }\n}\n```\n\n##\
    \ Networking Programming\n\n## Outline\n\n- Web servers\n  - HTTP Protocol\n \
