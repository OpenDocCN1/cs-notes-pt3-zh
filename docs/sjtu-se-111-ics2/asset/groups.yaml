    \ PID\n  - 这会导致信号被发送到进程组 PID 中的每个进程\n- e.g. unix> kill -9 -15213\n  - 向进程组 15213\
    \ 中的每个进程发送 SIGKILL 信号。\n\n## 从键盘发送信号\n- **作业**\n  - Unix shell 使用的抽象\n  - 表示作为评估单个命令行结果而创建的进程\n\
    \  - 在任何时候，最多有一个前台作业和零个或多个后台作业\n  - **例如** `unix> ls | sort`\n    - 由两个通过管道连接的进程组成的前台作业\n\
