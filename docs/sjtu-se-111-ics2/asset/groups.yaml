  md: "\n## What is a socket?\n\n- A socket is a descriptor that lets an application\
    \ read/write from/to the network.\n  - Key idea: Unix uses the same abstraction\
    \ for both file I/O and network I/O.\n- Clients and servers communicate with each\
    \ other by reading from and writing to **socket descriptors**.\n  - Using regular\
    \ Unix **read** and **write** I/O functions.\n- The main difference between file\
    \ I/O and socket I/O is how the application “opens” the socket descriptors.\n\n\
    ## Key data structures\n\n- Internet-style sockets are characterized by:\n  -\
    \ A 32-bit IP address and a port.\n- Defined in `/usr/include/netinet/in.h`.\n\
    \n```c\n/* Internet address */\nstruct in_addr {\n    unsigned int s_addr; /*\
    \ 32-bit IP address */\n};\n```\n\n```c\n/* Internet style socket address */\n\
    struct sockaddr_in {\n    unsigned short int sin_family;          /* Address family\
    \ (AF_INET) */\n    unsigned short int sin_port;            /* Port number */\n\
    \    struct in_addr sin_addr;                /* IP address */\n    unsigned char\
    \ sin_zero[8];              /* Pad to “sockaddr” */\n};\n```\n\n```c\n/* Generic\
    \ socket address structure */\nstruct sockaddr {\n    unsigned short int sin_family;\
    \          /* Protocol family (AF_INET) */\n    char sa_data[14];            \
    \           /* Address data */\n};\n```\n\n- Defined in `/usr/include/netdb.h`.\n\
    \n```c\n/* Domain Name Service (DNS) host entry */\nstruct hostent {\n    char\
    \    *h_name;       /* official name of host */\n    char    **h_aliases;   /*\
    \ alias list */\n    int     h_addrtype;    /* host address type */\n    int \
    \    h_length;      /* length of address */\n    char    **h_addr_list;  /* list\
    \ of addresses */\n};\n```\n\n## Overview of the Sockets Interface\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_716_0.png)\n\
    \n## accept() illustrated\n\n1. Server blocks in `accept`, waiting for connection\
    \ request on listening descriptor `listenfd`.\n2. Client makes connection request\
    \ by calling and blocking in `connect`.\n3. Server returns `connfd` from `accept`.\
    \ Client returns from `connect`. Connection is now established between `clientfd`\
    \ and `connfd`.\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_717_0.png)\n\n## Echo\
    \ client\n\n```c\nint main(int argc, char **argv)\n{\n    int clientfd, port;\n\
    \    char *host, buf[MAXLINE];\n    rio_t rio;\n\n    if (argc != 3) {\n     \
    \   fprintf(stderr, \"usage:%s <host> <port>\\n\", argv[0]);\n        exit(0);\n\
    \    }\n    host = argv[1]; port = atoi(argv[2]);\n    clientfd = open_clientfd(host,\
    \ port);\n    Rio_readinitb(&rio, clientfd);\n\n    while (Fgets(buf, MAXLINE,\
    \ stdin) != NULL) {\n        Rio_writen(clientfd, buf, strlen(buf));\n       \
    \ Rio_readline(&rio, buf, MAXLINE);\n        Fputs(buf, stdout);\n    }\n    Close(clientfd);\n\
    }\n```\n\n## Echo client: `open_clientfd()`\n\n```c\nint open_clientfd(char *hostname,\
    \ int port)\n{\n    int clientfd;\n    struct hostent *hp;\n    struct sockaddr_in\
    \ serveraddr;\n\n    clientfd = Socket(AF_INET, SOCK_STREAM, 0);\n\n    /* fill\
    \ in the server's IP address and port */\n    hp = Gethostbyname(hostname);\n\
    \    bzero((char *) &serveraddr, sizeof(serveraddr));\n    serveraddr.sin_family\
    \ = AF_INET;\n    bcopy((char *)hp->h_addr,\n          (char *)&serveraddr.sin_addr.s_addr,\
    \ hp->h_length);\n    serveraddr.sin_port = htons(port);\n\n    /* establish a\
    \ connection with the server */\n    Connect(clientfd, (SA *) &serveraddr, sizeof(serveraddr));\n\
    \n    return clientfd;\n}\n```\n\n## Echo client: `open_clientfd()` (socket)\n\
    \n- The client creates a socket that will serve as the endpoint of an Internet\
    \ (AF_INET) connection (SOCK_STREAM).\n  - `socket()` returns an integer socket\
    \ descriptor.\n\n```c\nint clientfd;  /* socket descriptor */\nclientfd = Socket(AF_INET,\
    \ SOCK_STREAM, 0);\n```\n\n## Echo client: `open_clientfd()`\n\n- The client builds\
    \ the server's Internet address.\n\n```c\nstruct hostent *hp;             /* DNS\
    \ host entry */\nstruct sockaddr_in serveraddr;  /* server's IP address */\n\n\
    /* fill in the server's IP address and port */\nhp = Gethostbyname(hostname);\n\
    bzero((char *) &serveraddr, sizeof(serveraddr));\nserveraddr.sin_family = AF_INET;\n\
    bcopy((char *)hp->h_addr,\n      (char *)&serveraddr.sin_addr.s_addr, hp->h_length);\n\
    serveraddr.sin_port = htons(port);\n```\n"
  mdcn: "\n\n## 什么是 socket？\n\n- socket 是一个描述符，允许应用程序从网络读取/写入到网络。\n  - 关键思想：Unix 对文件\
    \ I/O 和网络 I/O 使用相同的抽象。\n- 客户端和服务器通过读取和写入 **socket 描述符** 互相通信。\n  - 使用常规的 Unix\
    \ **read** 和 **write** I/O 函数。\n- 文件 I/O 和 socket I/O 的主要区别在于应用程序“打开” socket 描述符的方式。\n\
    \n## 关键数据结构\n\n- Internet 风格的 socket 由以下特征定义：\n  - 32 位 IP 地址和一个端口。\n- 定义在 `/usr/include/netinet/in.h`。\n\
    \n```c\n/* Internet address */\nstruct in_addr {\n    unsigned int s_addr; /*\
    \ 32-bit IP address */\n};\n```\n\n```c\n/* Internet style socket address */\n\
    struct sockaddr_in {\n    unsigned short int sin_family;          /* Address family\
    \ (AF_INET) */\n    unsigned short int sin_port;            /* Port number */\n\
    \    struct in_addr sin_addr;                /* IP address */\n    unsigned char\
    \ sin_zero[8];              /* Pad to “sockaddr” */\n};\n```\n\n```c\n/* Generic\
    \ socket address structure */\nstruct sockaddr {\n    unsigned short int sin_family;\
    \          /* Protocol family (AF_INET) */\n    char sa_data[14];            \
    \           /* Address data */\n};\n```\n\n- 定义在 `/usr/include/netdb.h`。\n\n```c\n\
    /* Domain Name Service (DNS) host entry */\nstruct hostent {\n    char    *h_name;\
    \       /* official name of host */\n    char    **h_aliases;   /* alias list\
    \ */\n    int     h_addrtype;    /* host address type */\n    int     h_length;\
    \      /* length of address */\n    char    **h_addr_list;  /* list of addresses\
    \ */\n};\n```\n\n## Sockets 接口概述\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_716_0.png)\n\
    \n## accept() 举例说明\n\n1. 服务器在 `accept` 中阻塞，等待在监听描述符 `listenfd` 上的连接请求。\n2. 客户端通过调用并在\
    \ `connect` 中阻塞来发起连接请求。\n3. 服务器从 `accept` 返回 `connfd`。客户端从 `connect` 返回。连接现在在\
    \ `clientfd` 和 `connfd` 之间建立。\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_717_0.png)\n\
    \n## Echo 客户端\n\n```c\nint main(int argc, char **argv)\n{\n    int clientfd, port;\n\
    \    char *host, buf[MAXLINE];\n    rio_t rio;\n\n    if (argc != 3) {\n     \
    \   fprintf(stderr, \"usage:%s <host> <port>\\n\", argv[0]);\n        exit(0);\n\
