    \ stdin) != NULL) {\n        Rio_writen(clientfd, buf, strlen(buf));\n       \
    \ Rio_readline(&rio, buf, MAXLINE);\n        Fputs(buf, stdout);\n    }\n    Close(clientfd);\n\
    }\n```\n\n## Echo 客户端：`open_clientfd()`\n\n```c\nint open_clientfd(char *hostname,\
    \ int port)\n{\n    int clientfd;\n    struct hostent *hp;\n    struct sockaddr_in\
    \ serveraddr;\n\n    clientfd = Socket(AF_INET, SOCK_STREAM, 0);\n\n    /* fill\
    \ in the server's IP address and port */\n    hp = Gethostbyname(hostname);\n\
