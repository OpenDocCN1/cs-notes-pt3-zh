    \ /* global variable */\n```\n\n## Shared variable analysis\n\n```c\n#include\
    \ \"csapp.h\"\n#define N 2\nvoid *thread(void *vargp);\n\nchar **ptr;\n/* global\
    \ variable */\n\nint main()\n{\n    int i;\n    pthread_t tid;\n    char *msgs[N]\
