    \n## Locality to the Rescue Again!\n\n- Virtual memory works because of locality\n\
    - At any point in time, programs tend to access a set of active virtual pages\
    \ called the working set\n  - Programs with better temporal locality will have\
    \ smaller working sets\n\n## Locality to the Rescue Again!\n\n- If (working set\
    \ size < main memory size)\n  - Good performance for one process after compulsory\
    \ misses\n- If ( SUM(working set sizes) > main memory size )\n  - Thrashing: Performance\
    \ meltdown where pages are swapped (copied) in and out continuously\n\n## Why\
    \ Virtual Memory (VM)?\n\n- Uses main memory efficiently\n  - Use DRAM as a cache\
    \ for the parts of a virtual address space\n- Simplifies memory management\n \
    \ - Each process gets the same uniform linear address space\n- Isolates address\
    \ spaces\n  - One process can't interfere with another's memory\n  - User program\
    \ cannot access privileged kernel information\n\n## VM as a Tool for Memory Management\n\
    \n- Key idea: each process has its own virtual address space\n  - It can view\
    \ memory as a simple linear array\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_942_0.png)\n\
    \n## VM as a Tool for Memory Management\n\n- Memory **allocation**\n  - Each virtual\
    \ page can be mapped to any physical page\n  - A virtual page can be stored in\
    \ different physical pages at different times\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_943_0.png)\n\
    \n## VM as a Tool for Memory Management\n\n- Sharing code and data among processes\n\
    \  - Map virtual pages to the same physical page (e.g. PP 6)\n\nVirtual Address\
    \ Space for Process 1:\n\nVirtual Address Space for Process 2:\n\nPhysical Address\
    \ Space (DRAM)\n\nAddress translation\n\n(e.g., read-only library code)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_944_0.png)\n\
    \n## Simplifying Linking and Loading\n\n- Linking\n  - Each program has similar\
    \ virtual address space\n  - Code, stack, and shared libraries always start at\
    \ the same address\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_945_0.png)\n\n\
    ## Simplifying Linking and Loading\n\n- Loading\n  - execve() allocates virtual\
    \ pages for .text and .data sections\n  = creates PTEs marked as invalid\n  -\
    \ The .text and .data sections are copied, page by page, on demand by the virtual\
    \ memory system\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_946_0.png)\n\n## Why\
    \ Virtual Memory (VM)?\n\n- Uses main memory efficiently\n  - Use DRAM as a cache\
    \ for the parts of a virtual address space\n- Simplifies memory management\n \
    \ - Each process gets the same uniform linear address space\n- Isolates address\
    \ spaces\n  - One process can't interfere with another's memory\n  - User program\
    \ cannot access privileged kernel information\n"
  mdcn: "\n\n## 页表\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_931_0.png)\n\n## 页表\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_932_0.png)\n\n## 页命中\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_933_0.png)\n\
    \n地址转换：硬件通过由操作系统管理的查找表（页表）将虚拟地址转换为物理地址\n\n## 页错误\n\n- 页表项指示虚拟地址不在内存中\n- 调用操作系统异常处理程序将数据从磁盘移入内存\n\
    \  - 当前进程挂起，其他进程可以恢复\n  - 操作系统完全控制放置等。\n\n## 页错误\n\n- 交换或分页\n- 已交换出或分页出\n- 请求分页\n\
    \n发生故障前\n\n发生故障后\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_935_0.png)\n\n##\
    \ 处理页错误\n\n- 处理器向控制器发出信号\n  - 从磁盘地址 X 开始读取长度为 P 的块并存储到内存地址 Y 开始\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_936_0.png)\n\
    \n## 处理页错误\n\n- 读取发生\n  - 直接内存访问（DMA）\n  - 在 I/O 控制器控制下\n\n(2) DMA 传输\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_937_0.png)\n\
    \n## 处理页错误\n\n- I / O 控制器发出完成信号\n  - 中断处理器\n  - 操作系统恢复已挂起的进程\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_938_0.png)\n\
    \n## 局部性再次拯救！\n\n- 虚拟内存之所以有效是因为局部性\n- 在任何时间点，程序倾向于访问一组活动虚拟页，称为工作集\n  - 具有更好时间局部性的程序将具有更小的工作集\n\
    \n## 局部性再次拯救！\n\n- 如果（工作集大小 < 主内存大小）\n  - 在强制性未命中之后，单个进程的性能良好\n- 如果（ SUM(工作集大小)\
    \ > 主内存大小 ）\n  - 抖动：性能崩溃，页面被连续不断地交换（复制）进出\n\n## 为什么使用虚拟内存（VM）？\n\n- 高效使用主内存\n\
    \  - 将 DRAM 用作虚拟地址空间部分的缓存\n- 简化内存管理\n  - 每个进程获得相同的统一线性地址空间\n- 隔离地址空间\n  - 一个进程无法干扰另一个进程的内存\n\
    \  - 用户程序无法访问特权内核信息\n\n## VM 作为内存管理工具\n\n- 关键思想：每个进程都有自己的虚拟地址空间\n  - 它可以将内存视为简单的线性数组\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_942_0.png)\n\n## VM 作为内存管理工具\n\n- 内存\
    \ **分配**\n  - 每个虚拟页可以映射到任何物理页\n  - 虚拟页在不同时间可以存储在不同的物理页中\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_943_0.png)\n\
    \n## VM 作为内存管理工具\n\n- 在进程之间共享代码和数据\n  - 将虚拟页映射到同一物理页（例如 PP 6）\n\n进程 1 的虚拟地址空间：\n\
    \n进程 2 的虚拟地址空间：\n\n物理地址空间（DRAM）\n\n地址转换\n\n（例如，只读库代码）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_944_0.png)\n\
    \n## 简化链接和加载\n\n- 链接\n  - 每个程序具有相似的虚拟地址空间\n  - 代码、栈和共享库始终从同一地址开始\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_945_0.png)\n\
    \n## 简化链接和加载\n\n- 加载\n  - execve() 为 .text 和 .data 部分分配虚拟页\n  = 创建标记为无效的 PTE\n\
    \  - .text 和 .data 部分由虚拟内存系统按需逐页复制\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_946_0.png)\n\
    \n## 为什么使用虚拟内存（VM）？\n\n- 高效使用主内存\n  - 将 DRAM 用作虚拟地址空间部分的缓存\n- 简化内存管理\n  - 每个进程获得相同的统一线性地址空间\n\
    - 隔离地址空间\n  - 一个进程无法干扰另一个进程的内存\n  - 用户程序无法访问特权内核信息\n\n"
