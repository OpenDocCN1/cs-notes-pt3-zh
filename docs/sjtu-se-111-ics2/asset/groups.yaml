    \ */\nstruct sockaddr_in serveraddr;\n\n/* listenfd will be an endpoint for all\
    \ requests\n   to port on any IP address for this host */\nbzero((char *) &serveraddr,\
    \ sizeof(serveraddr));\nserveraddr.sin_family = AF_INET;\nserveraddr.sin_addr.s_addr\
    \ = htonl(INADDR_ANY);\nserveraddr.sin_port = htons((unsigned short)port);\n```\n\
    \n## Echo server: open_listenfd() (initialize)\n\n- IP addr and port stored in\
    \ network (big-endian) byte order\n  - `htonl()` converts longs from host byte\
    \ order to network byte order.\n  - `htons()` convers shorts from host byte order\
    \ to network byte order.\n\n## Echo server: open_listenfd() (bind)\n\n- **bind()**\
    \ associates the socket with the socket address we just created.\n\n```\nint listenfd;\
    \                     /* listening socket */\nstruct sockaddr_in serveraddr; /*server’s\
