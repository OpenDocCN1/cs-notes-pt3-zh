    ```\n\n## 线程安全函数\n- 从线程中调用的函数必须是线程安全的\n- 定义：函数是线程安全的当且仅当它在被多个并发线程重复调用时始终能产生正确的结果。\n\
    \n## 线程安全函数\n- 我们识别出四类（非不相交的）线程不安全函数：\n  - 类 1：未能保护共享变量。\n  - 类 2：依赖于跨调用的持久状态。\n\
