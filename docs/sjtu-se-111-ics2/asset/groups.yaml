    ```\n"
  mdcn: "\n\n## Echo server: open_listenfd (listen)\n\n- listen() 表示该套接字将接受来自客户端的连接（connect）请求。\n\
    \n```\nint listenfd;                 /* listening socket */\n\n/* make listenfd\
    \ a server-side listening socket\nready to accept connection requests from clients\
    \ */\nListen(listenfd, LISTENQ);\n```\n\n- 我们终于准备好进入主服务器循环，以接受并处理客户端连接请求。\n\n\
    ## Echo server: main loop\n\n- 服务器无限循环，等待连接请求，然后从客户端读取输入，并将输入回显给客户端。\n\n```\n\
    main() {\n    /* create and configure the listening socket */\n\n    while(1)\
    \ {\n        /* Accept(): wait for a connection request */\n        /* echo():\
    \ read/echo input line from client */\n        /* Close(): close the connection\
    \ */\n    }\n}\n```\n\n## Echo server: accept()\n\n- **accept()** 返回一个已连接的套接字描述符（`connfd`），其属性与监听描述符（`listenfd`）相同\n\
    \  - 在客户端与服务器连接完成后返回。\n  - 所有与客户端的 I/O 均通过已连接套接字进行。\n- **accept()** 还会填充客户端的地址。\n\
    \n## Echo server: identifying the client\n\n- 服务器可以确定客户端的域名和 IP 地址。\n\n```\nstruct\
    \ hostent *hp; /* pointer to DNS host entry */\nchar *haddrp; /* pointer to dotted\
    \ decimal string */\n\nhp = Gethostbyaddr((const char *)\n    &clientaddr.sin_addr.s_addr,\n\
    \    sizeof(clientaddr.sin_addr.s_addr), AF_INET);\nhaddrp = inet_ntoa(clientaddr.sin_addr);\n\
    printf(\"server connected to %s (%s)\\n\",\n    hp->h_name, haddrp);\n```\n\n\
    ## Echo server: echo ()\n\n- 服务器使用 Unix I/O 读取并回显文本行，直到遇到 EOF（文件结束）。\n- EOF 通知由客户端调用\
    \ `close(clientfd)` 引起。\n- 注意：EOF 是一个条件，而不是数据字节。\n\n## Echo server: echo()\n\n\
    ```\nvoid echo(int connfd)\n{\n    size_t n;\n    char buf[MAXLINE];\n    rio_t\
    \ rio;\n\n    Rio_readinitb(&rio, connfd);\n    while((n = Rio_readlineb(&rio,\
    \ buf, MAXLINE)) !=0) {\n        printf(\"server received %d bytes\\n\", n);\n\
    \        Rio_writen(connfd, buf, n);\n    }\n}\n```\n\n## Networking Programming\n\
    \n## Outline\n\n- Web servers\n  - HTTP Protocol\n  - Web Content\n  - CGI\n-\
    \ The Tiny Web Server\n- Suggested Reading:\n  - 11.5~11.6\n\n## Web servers\n\
    \n- 客户端和服务器使用超文本传输协议（HTTP）进行通信\n  - 客户端和服务器建立 TCP 连接\n  - 客户端请求内容\n  - 服务器响应请求的\
    \ content\n  - 客户端和服务器关闭连接（通常）\n- 当前版本为 HTTP/1.1\n  - RFC 2616, 1999 年 6 月。\n\n\
    ## Web servers\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_743_0.png)\n\n|  |\
    \  |\n|---|---|\n| HTTP | Web content |\n| TCP | Streams |\n| IP | Datagrams |\n\
    \n## Web content\n\n- Web 服务器向客户端返回 **content**\n  - content：具有关联 MIME（多用途互联网邮件扩展）类型的字节序列\n\
    \n- 示例 MIME 类型\n  - `text/html` — HTML 页面\n  - `text/plain` — 未格式化的文本\n  - `application/postscript`\
    \ — Postscript 文档\n  - `image/gif` — 以 GIF 格式编码的二进制图像\n  - `image/jpg` — 以 JPG\
    \ 格式编码的二进制图像\n\n## Static and dynamic content\n\n- HTTP 响应中返回的内容可以是静态的或动态的\n \
    \ - 静态内容：\n    - 存储在文件中并响应 HTTP 请求检索的内容\n    - 示例：HTML 文件、图像、音频剪辑。\n  - 动态内容：\n\
    \    - 响应 HTTP 请求即时生成的内容\n    - 示例：服务器代表客户端执行程序生成的内容。\n\n## URLs\n\n- 服务器管理的每个文件都有一个唯一名称，称为\
    \ **URL**（通用资源定位符）\n\n- 静态内容的 URL：\n  - 标识由监听端口 80 的 `ipads.se.sjtu.edu.cn` 上的\
    \ Web 服务器管理的名为 `index.html` 的文件。\n\n```\nhttp://ipads.se.sjtu.edu.cn:80/courses/ics/index.html\n\
    http://ipads.se.sjtu.edu.cn:/courses/ics/index.html\nhttp://ipads.se.sjtu.edu.cn/courses/ics/\n\
    ```\n\n"
