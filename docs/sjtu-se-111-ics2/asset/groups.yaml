    T₂


    S₂


    U₂


    L₂


    H₂


    H₁ L₁ U₁ S₁ T₁ Thread 1


    A *trajectory* is a sequence of legal state transitions that describes one possible
    concurrent execution of the threads.


    Example:


    H1, L1, U1, H2, L2, S1, T1, U2, S2, T2


