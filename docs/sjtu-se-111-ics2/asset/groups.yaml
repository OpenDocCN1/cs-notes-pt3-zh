    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_1.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_2.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_3.png)\n\n## Kernel and User Mode\n\
    \n## User and Kernel Modes\n\n- Processes are managed by a shared chunk of OS\
    \ code called the kernel\n  - Important: the kernel is not a separate process,\
    \ but rather runs as part of some user process\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_441_0.png)\n\
    \n## Protection\n\n- Restricts an application\n  - to execute some instructions\
    \ (privileged instruction)\n  - to access some portions of the address space\n\
    - In some control registers there typically is a mode bit\n  - Kernel (supervisor)\
    \ mode if the bit is set\n  - User mode if the bit is clear\n\n## User and Kernel\
    \ Modes\n\n- Process running in kernel mode can\n  - execute any instructions\
    \ in the instruction set\n  - can access any memory locations in the system\n\
    - Process running in user mode can\n  - neither execute privileged instructions\n\
    \  - nor directly reference code or data in the kernel area of the address space\n\
    \  - only do above indirectly via system call interface\n\n## User and Kernel\
    \ Modes\n\n- A process running application code\n  - initially in user mode\n\
    \  - changes the user mode to kernel mode\n    - When the exception occurs and\
    \ control passes to the exception handler\n  - changes the kernel mode to user\
    \ mode\n    - When control returns to the application code\n- The only way for\
    \ the process to change from user mode to kernel mode is via exception\n\n## Implementing\
    \ the Process Abstraction\n\n- Requires close cooperation between both\n  - the\
    \ low-level hardware and\n  - the operating system software\n\n## Context Switches\n\
    \n## Context switching\n\n- The kernel maintains a context for each process\n\
    - The context is the state that the kernel needs to restart a preempted process\n\
    - Context contains\n  - Value of PC, register file, status registers, user's stack,\
    \ kernel's stack\n  - Kernel data structures\n    - Process table, page table,\
    \ file table\n\n## Context switching\n\n- The scheduler (a chunk of kernel code)\
    \ does scheduling as following\n  - Decides whether to preempt the current process\
    \ during the execution of a process\n  - Selects a previously preempted process\
    \ (scheduled process) to restart\n  - Preempts the current process\n    - Saves\
    \ the context of the current process\n  - Restarts the scheduled process\n   \
    \ - Restores the saved context of the scheduled process\n    - Passes the control\
    \ to this newly restored process\n\n## Three states of a process\n\n- Running\n\
    \  - The process is either executing on the CPU\n  - or is waiting to be executed\n\
    \  - and will eventually be scheduled.\n- Stopped\n  - The execution of the process\
    \ is suspended\n  - and will not be scheduled.\n- Terminated\n  - The process\
    \ is stopped permanently.\n\n## Three states of a process\n\n- A running process\
    \ becomes stop\n  - By receiving a signal such as\n    - SIGSTOP, SIGTSTP, SIGTTIN,\
    \ or SIGTTOU\n- A stopped process becomes running\n  - By receiving a SIGCONT\
    \ signal\n  (a signal is a form of software interrupt)\n"
  mdcn: "\n\n## 陷阱示例\n\n- 写入文件\n  - 操作系统必须找到文件，向其中写入字符串\n  - 返回一个整数，表示操作是否成功\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_438_0.png)\n\
    \n## 异常\n\n| 类别 | 原因 | 异步/同步 | 返回行为 |\n|---|---|---|---|\n| 中断 | 来自 I/O 设备的信号\
    \ | 异步 | 总是返回到下一条指令 |\n| 陷阱 | 有意的异常 | 同步 | 总是返回到下一条指令 |\n| 故障 | 可能可恢复的错误 | 同步\
    \ | 可能返回到当前指令 |\n| 中止 | 不可恢复的错误 | 同步 | 从不返回 |\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_1.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_2.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_439_3.png)\n\n## 内核与用户模式\n\n## 用户模式与内核模式\n\
    \n- 进程由称为内核的共享操作系统代码块管理\n  - 重要提示：内核不是一个独立的进程，而是作为某个用户进程的一部分运行\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_441_0.png)\n\
    \n## 保护\n\n- 限制应用程序\n  - 执行某些指令（特权指令）\n  - 访问地址空间的某些部分\n- 在某些控制寄存器中通常有一个模式位\n\
    \  - 如果该位被设置，则为内核（监管）模式\n  - 如果该位被清除，则为用户模式\n\n## 用户模式与内核模式\n\n- 在内核模式下运行的进程可以\n\
    \  - 执行指令集中的任何指令\n  - 访问系统中的任何内存位置\n- 在用户模式下运行的进程可以\n  - 既不能执行特权指令\n  - 也不能直接引用地址空间中内核区域的代码或数据\n\
    \  - 只能通过系统调用接口间接地完成上述操作\n\n## 用户模式与内核模式\n\n- 运行应用程序代码的进程\n  - 最初处于用户模式\n  - 将用户模式切换为内核模式\n\
    \    - 当异常发生且控制权传递给异常处理程序时\n  - 将内核模式切换回用户模式\n    - 当控制权返回到应用程序代码时\n- 进程从用户模式切换到内核模式的唯一途径是通过异常\n\
    \n## 实现进程抽象\n\n- 需要以下两者之间的紧密合作\n  - 底层硬件和\n  - 操作系统软件\n\n## 上下文切换\n\n## 上下文切换\n\
    \n- 内核为每个进程维护一个上下文\n- 上下文是内核重新启动被抢占进程所需的状态\n- 上下文包含\n  - PC 值、寄存器文件、状态寄存器、用户栈、内核栈\n\
    \  - 内核数据结构\n    - 进程表、页表、文件表\n\n## 上下文切换\n\n- 调度器（一段内核代码）按如下方式进行调度\n  - 在进程执行期间决定是否抢占当前进程\n\
    \  - 选择一个先前被抢占的进程（被调度的进程）来重新启动\n  - 抢占当前进程\n    - 保存当前进程的上下文\n  - 重新启动被调度的进程\n\
    \    - 恢复被调度进程已保存的上下文\n    - 将控制权传递给这个新恢复的进程\n\n## 进程的三种状态\n\n- 运行\n  - 进程要么在\
    \ CPU 上执行\n  - 要么等待被执行\n  - 并且最终会被调度。\n- 停止\n  - 进程的执行被暂停\n  - 并且不会被调度。\n- 终止\n\
    \  - 进程被永久停止。\n\n## 进程的三种状态\n\n- 运行中的进程变为停止\n  - 通过接收信号，例如\n    - SIGSTOP、SIGTSTP、SIGTTIN\
    \ 或 SIGTTOU\n- 停止中的进程变为运行\n  - 通过接收 SIGCONT 信号\n  （信号是软件中断的一种形式）\n\n"
