    \n## 线程 vs. 进程\n\n- 线程和进程的相似之处\n  - 各自拥有自己的逻辑控制流\n  - 各自可以与其他线程并发运行（可能在不同核心上）\n\
    \  - 各自会被上下文切换\n\n## 线程 vs. 进程\n\n- 线程和进程的**不同之处**\n  - 线程共享代码和部分数据\n    - 进程（通常）不共享\n\
    \  - 线程的开销比进程**小一些**\n    - 进程控制（创建和回收）的开销是线程控制的两倍\n    - Linux 数据：\n      - 创建和回收一个进程约需\
    \ ~20K cycles\n      - 创建和回收一个线程约需 ~10K cycles（或更少）\n\n## Posix 线程（Pthreads）接口\n\
    \n- Pthreads：约 60 个函数的标准接口\n  - 从 C 程序操作线程\n  - 创建和回收线程\n    - pthread_create\n\
    \    - pthread_join\n  - 确定你的线程 ID\n    - pthread_self\n  - 终止线程\n    - pthread_cancel\n\
    \    - pthread_exit\n    - exit [终止所有线程]\n    - return [终止当前线程]\n\n## Pthreads\
    \ 的 \"hello, world\" 程序\n\n```\n/* hello.c - Pthreads \"hello, world\" program\
    \ */\n#include \"csapp.h\"\n\n/* thread routine */\nvoid *thread(void *varp) {\n\
    \    printf(\"Hello, world!\\n\");\n    return NULL;\n}\n\nint main() {\n    pthread_t\
    \ tid;\n    Pthread_create(&tid, NULL, thread, NULL);\n    Pthread_join(tid, NULL);\n\
    \    exit(0);\n}\n```\n\nThread attributes (usually NULL)\n\nreturn value (void\
    \ **p)\n\nThread arguments (void *p)\n\n## 线程化 \"hello, world\" 的执行\n\nmain thread\n\
    \ncall pthread_create()\nPthread_create() returns\ncall pthread_join()\n\nmain\
    \ thread waits for peer thread to terminate\n\nPthread_join() returns\nexit()\n\
    terminates\nmain thread and\nany peer threads\n\npeer thread\n\nprintf()\nreturn\
    \ NULL;\n(peer thread terminates)\n\n## 基于线程的并发服务器（续）\n\n```\nint main(int argc,\
    \ char **argv){\n    int listenfd, *connfdp, port, clientlen;\n    struct sockaddr_in\
    \ clientaddr;\n    pthread_t tid;\n\n    if (argc != 2) {\n        fprintf(stderr,\
    \ \"usage: %s <port>\\n\", argv[0]);\n        exit(0);\n    }\n    listenfd =\
    \ open_listenfd(port);\n    while (1) {\n        clientlen = sizeof(clientaddr);\n\
    \        connfdp = Malloc(sizeof(int));\n        *connfdp = Accept(listenfd,\n\
    \            (SA *)&clientaddr, &clientlen);\n        Pthread_create(&tid, NULL,\
    \ thread, connfdp);\n    }\n}\n```\n\n## 基于线程的并发服务器（续）\n\n```\n/* thread routine\
    \ */\nvoid *thread(void *vargp)\n{\n    int connfd = *((int *)vargp);\n\n    Pthread_detach(pthread_self());\n\
    \    Free(vargp);\n\n    echo_r(connfd); /* reentrant version of echo() */\n \
    \   Close(connfd);\n    return NULL;\n}\n```\n\n## 基于线程的服务器的问题\n\n- 必须以 \"detached\"\
    \ 方式运行以避免内存泄漏。\n  - 在任意时刻，一个线程要么是可连接的要么是分离的\n  - 可连接线程可以被其他线程回收和杀死。\n    - 必须被回收（使用\
    \ pthread_join）以释放内存资源。\n\n## 基于线程的服务器的问题\n\n- 必须以 “detached” 方式运行以避免内存泄漏。\n \
    \ - 分离线程不能被其他线程回收或杀死。\n    - 资源在终止时**自动回收。**\n  - 默认状态是可连接的。\n    - 使用 `pthread_detach(pthread_self())`\
    \ 使其分离。\n\n"
