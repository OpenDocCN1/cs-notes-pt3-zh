  mdcn: "\n\n## 页错误\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_966_0.png)\n\n- 1)\
    \ 处理器向 MMU 发送虚拟地址\n- 2-3) MMU 从内存中的页表中获取 PTE\n- 4) 有效位为零，因此 MMU 触发页错误异常\n- 5)\
    \ 处理程序识别出受害页（如果脏，则将其写回磁盘）\n- 6) 处理程序调入新页并在内存中更新 PTE\n- 7) 处理程序返回到原始进程，重新开始出错指令\n\
    \n## 集成缓存和虚拟内存\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_967_0.png)\n\n- 大多数缓存“物理寻址”\n\
    \  - 通过物理地址访问\n  - 允许多个进程同时在缓存中拥有块\n  - 允许多个进程共享页\n  - 缓存无需关心保护问题\n    - 访问权限作为地址转换的一部分进行检查\n\
    \n- 在缓存查找之前执行地址转换\n  - 但这本身可能涉及一次内存访问（访问 PTE）\n  - 当然，页表项也可以被缓存\n\n## 使用 TLB 加速转换\n\
    \n- “旁路转换缓冲器”（TLB）\n  - MMU 中的小型硬件缓存\n  - 将虚拟页号映射到物理页号\n\n## TLB 命中\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_972_0.png)\n\
    \nTLB 命中消除了一次内存访问\n\n## TLB 未命中\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_973_0.png)\n\
    \nTLB 未命中会带来额外的内存访问（PTE）\n\n幸运的是，TLB 未命中很少发生。为什么？\n\n## 使用 TLB 加速转换\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_974_0.png)\n\
    \n## 地址转换\n\n- 虚拟地址（VA）的组成部分\n  - VPO：虚拟页偏移\n  - VPN：虚拟页号\n  - TLBI：TLB 索引\n \
    \ - TLBT：TLB 标签\n- 物理地址（PA）的组成部分\n  - PPO：物理页偏移（与 VPO 相同）\n  - PPN：物理页号\n  - CO：缓存行内的字节偏移\n\
    \  - CI：缓存索引\n  - CT：缓存标签\n\n## 使用 TLB 加速转换\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_977_0.png)\n\
    \n## 简单内存系统 TLB\n\n- **TLB**\n  - 16 个条目\n  - 4 路组相联（2 位）\n\n- **寻址**\n  - 14\
    \ 位虚拟地址\n  - 12 位物理地址\n  - 页大小 = 64 位（6 位）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_978_0.png)\n\
    \n| Set | Tag | PPN | Valid | Tag | PPN | Valid | Tag | PPN | Valid | Tag | PPN\
    \ | Valid |\n|---:|---:|:---:|---:|---:|:---:|---:|---:|:---:|---:|---:|:---:|---:|\n\
    | 0 | 03 | - | 0 | 09 | 0D | 1 | 00 | - | 0 | 07 | 02 | 1 |\n| 1 | 03 | 2D | 1\
    \ | 02 | - | 0 | 04 | - | 0 | 0A | - | 0 |\n| 2 | 02 | - | 0 | 08 | - | 0 | 06\
    \ | - | 0 | 03 | - | 0 |\n| 3 | 07 | - | 0 | 03 | 0D | 1 | 0A | 34 | 1 | 02 |\
    \ - | 0 |\n\n## 地址转换示例\n\nVirtual Address 0x03D4\n\nVPN\nVPO\n\nVPN: 0x0f TLBI:\
    \ 0x03 TLBT: 0x03 TLB Hit? Page Fault? __\n\nPPN\nPPO\n\nPPN: PPO: ______ PA:\n\
    \n## 简单内存系统 TLB\n\n- TLB\n  - 16 个条目\n  - 4 路组相联（2 位）\n\n- 寻址\n  - 14 位虚拟地址\n\
    \  - 12 位物理地址\n  - 页大小 = 64 位（6 位）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_980_0.png)\n\
    \n| Set | Tag | PPN | Valid | Tag | PPN | Valid | Tag | PPN | Valid | Tag | PPN\
    \ | Valid |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 0 | 03 |\
    \ - | 0 | 09 | 0D | 1 | 00 | - | 0 | 07 | 02 | 1 |\n| 1 | 03 | 2D | 1 | 02 | -\
    \ | 0 | 04 | - | 0 | 0A | - | 0 |\n| 2 | 02 | - | 0 | 08 | - | 0 | 06 | - | 0\
    \ | 03 | - | 0 |\n| 3 | 07 | - | 0 | 03 | 0D | 1 | 0A | 34 | 1 | 02 | - | 0 |\n\
    \n## 地址转换示例\n\nVirtual Address 0x03D4\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_981_0.png)\n\
    \nVPN: 0x0f TLBI: 0x03 TLBT: 0x03 TLB Hit? Yes Page Fault? No\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_981_1.png)\n\
    \nPPN: 0x0D PPO: 0x14 PA: 0x354\n\n"
