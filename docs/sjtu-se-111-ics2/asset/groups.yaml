  md: "\n## A process with multiple threads\n\nThread 1 (main thread)\n\nShared code\
    \ and data\n\nThread 2 (peer thread)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_813_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_813_1.png)\n\n| Shared memory |\n|---|\n\
    | shared libraries |\n| run-time heap |\n| read/write data |\n| read-only code/data\
    \ |\n\n- **Thread 1 context:**\n  - Data registers\n  - Condition codes\n  - SP1\n\
    \  - PC1\n\n- **Thread 2 context:**\n  - Data registers\n  - Condition codes\n\
    \  - SP2\n  - PC2\n\n- **Kernel context:**\n  - VM structures\n  - Descriptor\
    \ table\n  - brk pointer\n\n## Logical View of Threads\n\n- Threads associated\
    \ with process form a pool of peers\n  - Unlike processes which form a tree hierarchy\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_814_0.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_814_1.png)\n\
    \n## Threads vs. Processes\n\n- How threads and processes are similar\n  - Each\
    \ has its own logical control flow\n  - Each can run concurrently with others\
    \ (possibly on different cores)\n  - Each is context switched\n\n## Threads vs.\
    \ Processes\n\n- How threads and processes are **different**\n  - Threads share\
    \ code and some data\n    - Processes (typically) do not\n  - Threads are somewhat\
    \ **less expensive** than processes\n    - Process control (creating and reaping)\
    \ is twice as expensive as thread control\n    - Linux numbers:\n      - ~20K\
    \ cycles to create and reap a process\n      - ~10K cycles (or less) to create\
    \ and reap a thread\n\n## Posix threads (Pthreads) interface\n\n- Pthreads: Standard\
    \ interface for ~60 functions\n  - Manipulate threads from C programs\n  - Creating\
    \ and reaping threads\n    - pthread_create\n    - pthread_join\n  - Determining\
    \ your thread ID\n    - pthread_self\n  - Terminating threads\n    - pthread_cancel\n\
    \    - pthread_exit\n    - exit [terminates all threads]\n    - return [terminates\
    \ current thread]\n\n## The Pthreads \"hello, world\" Program\n\n```\n/* hello.c\
    \ - Pthreads \"hello, world\" program */\n#include \"csapp.h\"\n\n/* thread routine\
    \ */\nvoid *thread(void *varp) {\n    printf(\"Hello, world!\\n\");\n    return\
    \ NULL;\n}\n\nint main() {\n    pthread_t tid;\n    Pthread_create(&tid, NULL,\
    \ thread, NULL);\n    Pthread_join(tid, NULL);\n    exit(0);\n}\n```\n\nThread\
    \ attributes (usually NULL)\n\nreturn value (void **p)\n\nThread arguments (void\
    \ *p)\n\n## Execution of Threaded\"hello, world\"\n\nmain thread\n\ncall pthread_create()\n\
    Pthread_create() returns\ncall pthread_join()\n\nmain thread waits for peer thread\
    \ to terminate\n\nPthread_join() returns\nexit()\nterminates\nmain thread and\n\
    any peer threads\n\npeer thread\n\nprintf()\nreturn NULL;\n(peer thread terminates)\n\
    \n## Thread-based concurrent server (cont)\n\n```\nint main(int argc, char **argv){\n\
    \    int listenfd, *connfdp, port, clientlen;\n    struct sockaddr_in clientaddr;\n\
    \    pthread_t tid;\n\n    if (argc != 2) {\n        fprintf(stderr, \"usage:\
    \ %s <port>\\n\", argv[0]);\n        exit(0);\n    }\n    listenfd = open_listenfd(port);\n\
    \    while (1) {\n        clientlen = sizeof(clientaddr);\n        connfdp = Malloc(sizeof(int));\n\
    \        *connfdp = Accept(listenfd,\n            (SA *)&clientaddr, &clientlen);\n\
    \        Pthread_create(&tid, NULL, thread, connfdp);\n    }\n}\n```\n\n## Thread-based\
    \ concurrent server (cont)\n\n```\n/* thread routine */\nvoid *thread(void *vargp)\n\
    {\n    int connfd = *((int *)vargp);\n\n    Pthread_detach(pthread_self());\n\
    \    Free(vargp);\n\n    echo_r(connfd); /* reentrant version of echo() */\n \
    \   Close(connfd);\n    return NULL;\n}\n```\n\n## Issues with thread-based servers\n\
    \n- Must run \"detached\" to avoid memory leak.\n  - At any point in time, a thread\
    \ is either joinable or detached\n  - joinable thread can be reaped and killed\
    \ by other threads.\n    - must be reaped (with pthread_join) to free memory resources.\n\
    \n## Issues with thread-based servers\n\n- Must run “detached” to avoid memory\
    \ leak.\n  - Detached thread cannot be reaped or killed by other threads.\n  \
    \  - resources are **automatically reaped on termination.**\n  - Default state\
    \ is joinable.\n    - use `pthread_detach(pthread_self())` to make detached.\n"
  mdcn: "\n\n## 多线程进程\n\nThread 1 (主线程)\n\n共享代码和数据\n\nThread 2 (对等线程)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_813_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_813_1.png)\n\n| Shared memory |\n|---|\n\
