  mdcn: "\n\n## 线程设计设计的优缺点\n\n- 线程间易于共享数据结构\n  - 例如，日志信息、文件缓存。\n- 线程比进程更高效\n- 非预期的共享可能引入难以重现的微妙错误！\n\
    \  - 数据易于共享既是线程的最大优点，也是最大的弱点\n  - 难以知道哪些数据被共享以及私有\n\n## I/O 多路复用：select() 函数\n\
    \n```c\n#include <sys/select.h>\n\nint select (int maxfd, fd_set *readset,\n \
