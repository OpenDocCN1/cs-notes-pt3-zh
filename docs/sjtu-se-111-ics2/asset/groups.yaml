    80488b9:    jl      80488b1\n80488be:    movl    (%ecx,%edx,4),%eax\n```\n\nAssume\
    \ vector length = 100\n\ni = 98\n\n> Predict Taken (OK)\n\ni = 99\n\n> Definitely\
    \ not taken\n\n## Branch Misprediction Recovery\n\n- Performance Cost\n  - Misprediction\
