  mdcn: "\n\n## 虚拟内存作为内存保护的工具\n\n- 用权限位扩展页表项（PTE）\n  - 同一物理页对不同进程具有不同的权限\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_948_0.png)\n\
    \n## 虚拟内存作为内存保护的工具\n\n- 缺页处理程序在重新映射之前检查这些权限\n  - 如果违反，向进程发送 SIGSEGV（段错误）\n\n进程\
    \ i:\n\n|  | SUP | 读 | 写 | 地址 |\n|---|---|---|---|---|\n| VP 0: | 否 | 是 | 否 |\
    \ PP 6 |\n| VP 1: | 否 | 是 | 是 | PP 4 |\n| VP 2: | 是 | 是 | 是 | PP 2 |\n\n物理地址空间\n\
    \n进程 j:\n\n|  | SUP | 读 | 写 | 地址 |\n|---|---|---|---|---|\n| VP 0: | 否 | 是 | 否\
    \ | PP 9 |\n| VP 1: | 是 | 是 | 是 | PP 6 |\n| VP 2: | 否 | 是 | 是 | PP 11 |\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_949_0.png)\n\
    \n## 虚拟内存\n\n## 大纲\n\n- 地址转换\n- 加速转换\n  - 使用 TLB\n  - 多级页表\n- 建议阅读：10.6\n\n##\
    \ 地址转换\n\n- V = {0, 1, ..., N-1} 虚拟地址空间\n- P = {0, 1, ..., M-1} 物理地址空间\n- N >\
    \ M\n- 地址转换\n- MAP：V → P ∪ {∅} 地址映射函数\n- MAP(a) = a' 表示虚拟地址 a 处的数据存在于物理地址 a'（在\
    \ P 中）\n  = ∅ 表示虚拟地址 a 处的数据不存在于 P 中（无效或位于磁盘上）\n\n## 地址转换\n\n处理器\n\n硬件地址转换机制\n\n\
    a\n\n虚拟地址\n\nm\n\n片上内存管理单元（MMU）的一部分\n\nØ\n\n缺页\n\n缺页处理程序\n\na'\n\n物理地址\n\n主存\n\
    \n辅助存储器\n\n操作系统执行此传输（仅在未命中时）\n\n## 地址转换\n\n- 基本参数\n  - N = 2^n = 虚拟地址限制\n  - M\
    \ = 2^m = 物理地址限制\n  - P = 2^p = 页面大小（字节）。\n\n## 地址转换\n\n- 基本参数\n  - N = 2ⁿ = 虚拟地址限制\n\
    \  - M = 2ᵐ = 物理地址限制\n  - P = 2ᵖ = 页面大小（字节）。\n- 虚拟地址（VA）的组成部分\n  - VPO：虚拟页偏移量\n\
    \  - VPN：虚拟页号\n- 物理地址（PA）的组成部分\n  - PPO：物理页偏移量（与 VPO 相同）\n  - PPN：物理页号\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_957_0.png)\n\
    \n## 简单内存系统示例\n\n- **寻址**\n  - 14 位虚拟地址\n  - 12 位物理地址\n  - 页面大小 = 64 字节（6 位）\n\
