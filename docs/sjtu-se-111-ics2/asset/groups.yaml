    \ with respect to the shared variable cnt.\n\nInstructions in critical sections\
    \ (write to some shared variable) should not be interleaved.\n\nSets of states\
    \ where such interleaving occurs form unsafe regions.\n\n## Safe and unsafe trajectories\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_864_0.png)\n\n**Def:** A trajectory\
    \ is *safe* iff it doesn’t touch any part of an unsafe region.\n\n**Claim:** A\
    \ trajectory is *correct* (write cnt) iff it is safe.\n"
