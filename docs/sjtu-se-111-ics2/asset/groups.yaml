    \ 7 |\n| %esp | 4 |\n| %ebp | 5 |\n\n- Register ID \"F\" indicates \"no register\"\
    \n  - Will use this in our hardware design in multiple places\n\n## Logical Design\
    \ & HCL\n\n## Logic Design\n\n- Digital circuit\n  - What is digital circuit?\n\
    \  - Know what a CPU will base on?\n- Hardware Control Language (HCL)\n  - A simple\
    \ and functional language to describe our CPU implementation\n  - Syntax like\
    \ C\n\n## Category of Circuit\n\n- Analog Circuit\n  - Use all the range of Signal\n\
    \  - Most part is amplifier\n  - Hard to model and automatic design\n  - Use transistor\
    \ and capacitance as basis\n  - We will not discuss it here\n\n## Category of\
    \ Circuit\n\n- Digital Circuit\n  - Has only two values, 0 and 1\n  - Easy to\
    \ model and design\n  - Use truth table and other tools to analyze\n  - Use gate\
    \ as the basis\n  - The voltage of 1 is differ in different kind circuit.\n  \
    \  - E.g. TTL circuit using 5 voltage as 1\n\n## Digital Signals\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_19_0.png)\n\
    \n- Use voltage thresholds to extract discrete values from continuous signal\n\
    - Simplest version: 1-bit signal\n  - Either high range (1) or low range (0)\n\
    \  - With guard range between them\n- Not strongly affected by noise or low quality\
    \ circuit elements\n  - Can make circuits simple, small, and fast\n\n## Overview\
    \ of Logic Design\n\n- Fundamental Hardware Requirements\n  - Communication\n\
    \    - How to get values from one place to another\n  - Computation\n  - Storage\
    \ (Memory)\n  - Clock Signal\n\n## Overview of Logic Design\n\n- Bits are Our\
    \ Friends\n  - Everything expressed in terms of values 0 and 1\n  - Communication\n\
    \    - Low or high voltage on wire\n  - Computation\n    - Compute Boolean functions\n\
    \  - Storage\n  - Clock Signal\n\n## Category of Digital Circuit\n\n- Combinational\
    \ Circuit\n  - Without memory. So the circuit can't have state. Any same input\
    \ will get the same output at any time.\n  - Needn't clock signal\n  - Typical\
    \ application: ALU\n\n## Category of Digital Circuit\n\n- Sequential Circuit\n\
    \  - = Combinational circuit + memory and clock signal\n  - Have state. Two same\
    \ inputs may not generate the same output.\n  - Use clock signal to control the\
    \ run of circuit.\n  - Typical application: CPU\n\n## Computing with Logic Gates\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_0.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_1.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_2.png)\n\n- Outputs are Boolean\
    \ functions of inputs\n- Not an assignment operation, just give the circuit a\
    \ name\n- Respond continuously to changes in inputs\n  - With some, small delay\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_3.png)\n\n## Bit Equality\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_26_0.png)\n\
    \nHCL Expression\n\n```\nbool eq = (a&&b) || (!a&&!b)\n```\n\n- Generate 1 if\
    \ a and b are equal\n- Hardware Control Language (HCL)\n  - Very simple hardware\
    \ description language\n    - Boolean operations have syntax similar to C logical\
    \ operations\n  - We'll use it to describe control logic for processors\n\n##\
    \ Word Equality\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_27_0.png)\n\n### Word-Level\
    \ Representation\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_27_1.png)\n\n###\
    \ HCL Representation\n\n```\nbool Eq = (A == B)\n```\n\n- 32-bit word size\n-\
    \ HCL representation\n  - Equality operation\n  - Generates Boolean value\n\n\
    ## Bit-Level Multiplexor\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_28_0.png)\n\
    \n### HCL Expression\n\n```\nbool out = (s&&a) || (!s&&b)\n```\n\n- Control signal\
    \ s\n- Data signals a and b\n- Output a when s=1, b when s=0\n- Its name: MUX\n\
    - Usage: Select one signal from a couple of signals\n"
  mdcn: "\n\n## 编码寄存器\n\n- 每个寄存器有 4 位 ID\n  - 与 IA32 中的编码相同，但 IA32 仅使用 3 位 ID\n\n\
    | 寄存器 | ID |\n|---|---|\n| %eax | 0 |\n| %ecx | 1 |\n| %edx | 2 |\n| %ebx | 3\
    \ |\n| %esi | 6 |\n| %edi | 7 |\n| %esp | 4 |\n| %ebp | 5 |\n\n- 寄存器 ID “F” 表示“无寄存器”\n\
    \  - 我们将在硬件设计的多个地方用到它\n\n## 逻辑设计与 HCL\n\n## 逻辑设计\n\n- 数字电路\n  - 什么是数字电路？\n  -\
    \ 了解 CPU 将基于什么？\n- 硬件控制语言（HCL）\n  - 一种简单且功能性的语言，用于描述我们的 CPU 实现\n  - 语法类似 C\n\n\
    ## 电路类别\n\n- 模拟电路\n  - 使用信号的全范围\n  - 大部分是放大器\n  - 难以建模和自动设计\n  - 以晶体管和电容为基础\n\
    \  - 此处不讨论\n\n## 电路类别\n\n- 数字电路\n  - 只有两个值：0 和 1\n  - 易于建模和设计\n  - 使用真值表等工具进行分析\n\
    \  - 以门电路为基础\n  - 不同电路中的 1 电压不同\n    - 例如，TTL 电路以 5 伏电压作为 1\n\n## 数字信号\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_19_0.png)\n\
    \n- 使用电压阈值从连续信号中提取离散值\n- 最简单的形式：1 位信号\n  - 要么是高范围（1），要么是低范围（0）\n  - 两者之间有保护范围\n\
    - 不易受噪声或低质量电路元件的影响\n  - 可以使电路简单、小巧且快速\n\n## 逻辑设计概述\n\n- 基本硬件需求\n  - 通信\n    -\
    \ 如何将值从一个地方传输到另一个地方\n  - 计算\n  - 存储（内存）\n  - 时钟信号\n\n## 逻辑设计概述\n\n- 位是我们的朋友\n\
    \  - 一切都用值 0 和 1 表示\n  - 通信\n    - 电线上的低或高电压\n  - 计算\n    - 计算布尔函数\n  - 存储\n \
    \ - 时钟信号\n\n## 数字电路类别\n\n- 组合电路\n  - 无内存，因此电路不能有状态。任何相同输入在任何时候都会得到相同输出。\n  - 不需要时钟信号\n\
    \  - 典型应用：ALU\n\n## 数字电路类别\n\n- 时序电路\n  - = 组合电路 + 内存和时钟信号\n  - 有状态。两个相同输入可能不会产生相同输出。\n\
    \  - 使用时钟信号控制电路运行。\n  - 典型应用：CPU\n\n## 用逻辑门进行计算\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_1.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_2.png)\n\
    \n- 输出是输入的布尔函数\n- 不是赋值操作，只是给电路一个名称\n- 持续响应输入的变化\n  - 带有一些微小的延迟\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_24_3.png)\n\
    \n## 位相等\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_26_0.png)\n\nHCL 表达式\n\n\
    ```\nbool eq = (a&&b) || (!a&&!b)\n```\n\n- 如果 a 和 b 相等则生成 1\n- 硬件控制语言（HCL）\n\
    \  - 非常简单的硬件描述语言\n    - 布尔运算的语法类似于 C 语言中的逻辑运算\n  - 我们将用它来描述处理器的控制逻辑\n\n## 字相等\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_27_0.png)\n\n### 字级表示\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_27_1.png)\n\
    \n### HCL 表示\n\n```\nbool Eq = (A == B)\n```\n\n- 32 位字长\n- HCL 表示\n  - 相等运算\n\
    \  - 生成布尔值\n\n## 位级多路选择器\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_28_0.png)\n\
    \n### HCL 表达式\n\n```\nbool out = (s&&a) || (!s&&b)\n```\n\n- 控制信号 s\n- 数据信号 a\
    \ 和 b\n- 当 s=1 时输出 a，当 s=0 时输出 b\n- 名称：MUX\n- 用途：从多个信号中选择一个信号\n\n"
