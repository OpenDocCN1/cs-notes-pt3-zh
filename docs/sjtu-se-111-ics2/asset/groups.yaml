    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_227_0.png)\n\n# 定价与分销策略\n\n我们的定价模型旨在最大限度地提高采用率，同时确保可持续的收入增长。我们采用分层订阅方式，为个人用户提供免费层，并为企业提供高级企业方案。\n\
