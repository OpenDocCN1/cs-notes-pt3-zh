    \ information\n"
  mdcn: "\n\n## 虚拟寻址\n\n- 地址转换\n  - 将虚拟地址转换为物理地址\n  - 需要 CPU 硬件和操作系统之间紧密协作\n    -\
    \ HW：内存管理单元（MMU）\n      - CPU 芯片上用于实时转换虚拟地址的专用硬件\n    - SW：查找表\n      - 存储在主内存中\n\
    \      - 内容由操作系统管理\n\n## 使用虚拟寻址的系统\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_918_0.png)\n\
    \n- 用于所有现代服务器、台式机和笔记本电脑\n- 计算机科学中的伟大思想之一\n\n## 地址空间\n\n- 地址空间\n  - 有序的非负整数地址集合\n\
    - 线性空间\n  - 地址空间中的整数是连续的\n- N 位地址空间\n\n## 地址空间\n\n线性地址空间：有序的连续非负整数地址集合：\n{0, 1,\
    \ 2, 3 ... }\n\n虚拟地址空间：N = 2ⁿ 个虚拟地址的集合\n{0, 1, 2, 3, ..., N-1}\n\n物理地址空间：M = 2ᵐ\
    \ 个物理地址的集合\n{0, 1, 2, 3, ..., M-1}\n\n- 数据（字节）与其属性（地址）之间清晰区分\n- 每个对象现在可以拥有多个地址\n\
    - 主内存中的每个字节：\n  一个物理地址，一个或多个虚拟地址\n\n## 地址空间\n\n- K=2¹⁰(千), M=2²⁰(兆), G=2³⁰(吉),\
    \ T=2⁴⁰(太), P=2⁵⁰(拍), E=2⁶⁰(艾)\n\n| #虚拟地址位 (n) | #虚拟地址 (N) | 最大可能虚拟地址 |\n|---|---|---|\n\
    | 8 | 256 | 255 |\n| 16 | 64K | 64K-1 |\n| 32 | 4G | 4G-1 |\n| 48 | 256T | 256T-1\
    \ |\n| 64 | 16E | 16E-1 |\n\n## 为什么使用虚拟内存（VM）？\n\n- 高效使用主内存\n  - 将 DRAM 用作虚拟地址空间部分的缓存\n\
    - 简化内存管理\n  - 每个进程获得相同的统一线性地址空间\n- 隔离地址空间\n  - 一个进程无法干扰另一个进程的内存\n  - 用户程序无法访问特权内核信息\n\
    \n## 将主内存用作缓存\n\n- DRAM 与磁盘之间的差异比 SRAM 与 DRAM 更极端\n  - 访问延迟：\n    - DRAM 比 SRAM\
    \ 慢 ~10 倍\n    - 磁盘比 DRAM 慢 ~100,000 倍\n  - 结论：\n    - 为 DRAM 缓存做出的设计决策由缺失的巨大成本驱动\n\
    \n## 设计考虑\n\n- 行大小？（大 vs 小）\n  - **大**，因为磁盘更擅长传输大块数据\n- 相联度？（全相联 vs 直接映射）\n  -\
    \ **全相联**，以最小化未命中率\n- 写穿还是写回？（WB vs WT）\n  - **写回**，因为无法承受对磁盘执行小写操作\n\n## 页\n\n\
    - 虚拟内存\n  - 概念上组织为存储在磁盘上的连续字节大小单元的数组。\n  - 每个字节都有唯一的虚拟地址，可作为数组的索引\n  - 磁盘上数组的内容缓存在主内存中\n\
    \n## 页\n\n- 磁盘上的数据被划分为 **块**\n  - 作为磁盘与主内存之间传输单元\n  - 虚拟 *页*（VPs）\n  - 物理 *页*（PPs）\n\
    \    - 或页帧\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_927_0.png)\n\n## 页属性\n\n\
    - 未分配：\n  - VM 系统尚未分配（或创建）的页\n  - 没有任何关联数据\n  - 不占用磁盘上的任何空间。\n\n## 页属性\n\n- 已缓存：\n\
    \  - 已分配且当前缓存在物理内存中的页。\n- 未缓存：\n  - 已分配但未缓存在物理内存中的页。\n\n## 页表\n\n- 每个已分配的虚拟内存页在页表中都有条目\n\
    - 虚拟页到物理页的映射\n  - 从未缓存形式到已缓存形式\n- 即使页不在内存中也有页表项\n  - 指定磁盘地址\n- OS 检索信息\n\n"
