  md: "\n## Optimization Limiting Factors\n\n- Register spilling\n  - Only 6 registers\
    \ available (IA32)\n  - Using stack(memory) as storage\n\n| Machine | 1 | 2 |\
    \ 3 | 4 | 5 | 6 |\n|---|---|---:|---:|---:|---:|---:|\n| IA32 | 2.12 | 1.76 |\
    \ 1.45 | 1.39 | 1.90 | 1.99 |\n| X86-64 | 2.00 | 1.50 | 1.00 | 1.00 | 1.01 | 1.00\
    \ |\n\n## Example\n\n```\nIA32 code. Unroll x5, accumulate x5\ndata_t = int, OP\
    \ = +, i in %edx, data in %eax, limit at %ebp-20\n```\n\n```asm\n.L291:\n    imull\
    \  (%eax,%edx,4), %ecx\n    movl   -16(%ebp), %ebx\n    imull  4(%eax,%edx,4),\
    \ %ebx\n    movl   %ebx, -16(%ebp)\n    imull  8(%eax,%edx,4), %edi\n    imull\
    \  12(%eax,%edx,4), %esi\n    movl   -28(%ebp), %ebx\n    imull  16(%eax,%edx,4),\
    \ %ebx\n    movl   %ebx, -28(%ebp)\n    addl   $5, %edx\n    cmpl   %edx, -20(%ebp)\n\
    \    jg     loop\n\nloop:\n    x0 = x0 * data[i]\n    Get x1\n    x1 = x1 * data[i+1]\n\
    \    Store x1\n    x2 = x2 * data[i+2]\n    x3 = x3 * data[i+3]\n    Get x4\n\
    \    x4 = x4 * data[i+4]\n    Store x4\n    i += 5\n    Compare limit:i\n    If\
    \ >, goto loop\n```\n\n## Optimization Limiting Factors\n\n- Register Spilling\n\
    \  - Only 6 registers available (IA32)\n  - Using stack(memory) as storage\n-\
    \ Branch Prediction\n  - Speculative Execution\n  - Misprediction Penalties\n\n\
    ## Branch Prediction\n\n- Challenges\n  - Instruction Control Unit must work well\
    \ ahead of Exec. Unit\n  - To generate enough operations to keep EU busy\n- Speculative\
    \ Execution\n  - Guess which way branch will go\n  - Begin executing instructions\
    \ at predicted position\n    - But don’t actually modify register or memory data\n\
    \n## Example: Loop\n\n```\n80488b1: movl (%ecx,%edx,4),%eax\n80488b4: addl %eax,(%edi)\n\
    80488b6: incl %edx\n80488b7: cmpl %esi,%edx\n80488b9: jl 80488b1\n80488be: movl\
    \ (%ecx,%edx,4),%eax\n```\n\nBranch Not-Taken\n\nBranch Taken\n\n```\n80488b1:\
    \ movl (%ecx,%edx,4),%eax\n80488b4: addl %eax,(%edi)\n80488b6: incl %edx\n80488b7:\
    \ cmpl %esi,%edx\n80488b9: jl 80488b1\n```\n\n## Branch Prediction Through Loop\n\
    \n```\n80488b1:    movl    (%ecx,%edx,4),%eax\n80488b4:    addl    %eax, (%edi)\n\
    80488b6:    incl    %edx\n80488b7:    cmpl    %esi,%edx\n80488b9:    jl      80488b1\n\
    ```\n\n```\n80488b1:    movl    (%ecx,%edx,4),%eax\n80488b4:    addl    %eax,\
    \ (%edi)\n80488b6:    incl    %edx\n80488b7:    cmpl    %esi,%edx\n80488b9:  \
    \  jl      80488b1\n```\n\n```\n80488b1:    movl    (%ecx,%edx,4),%eax\n80488b4:\
    \    addl    %eax, (%edi)\n80488b6:    incl    %edx\n80488b7:    cmpl    %esi,%edx\n\
    80488b9:    jl      80488b1\n```\n\n```\n80488b1:    movl    (%ecx,%edx,4),%eax\n\
    80488b4:    addl    %eax, (%edi)\n80488b6:    incl    %edx\n80488b7:    cmpl \
