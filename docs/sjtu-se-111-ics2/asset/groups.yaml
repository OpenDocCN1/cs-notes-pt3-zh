    \n## Address Space\n\n- Address Space\n  - An ordered set of nonnegative integer\
    \ addresses\n- Linear Space\n  - The integers in the address space are consecutive\n\
    - N-bit address space\n\n## Address Spaces\n\nLinear address space: Ordered set\
    \ of contiguous non-negative integer addresses:\n{0, 1, 2, 3 ... }\n\nVirtual\
    \ address space: Set of N = 2ⁿ virtual addresses\n{0, 1, 2, 3, ..., N-1}\n\nPhysical\
    \ address space: Set of M = 2ᵐ physical addresses\n{0, 1, 2, 3, ..., M-1}\n\n\
    - Clean distinction between data (bytes) and their attributes (addresses)\n- Each\
    \ object can now have multiple addresses\n- Every byte in main memory:\n  one\
    \ physical address, one (or more) virtual addresses\n\n## Address Space\n\n- K=2¹⁰(Kilo),\
    \ M=2²⁰(Mega), G=2³⁰(Giga), T=2⁴⁰(Tera), P=2⁵⁰(Peta), E=2⁶⁰(Exa)\n\n| #virtual\
    \ address bits (n) | #virtual address (N) | Largest possible virtual address |\n\
    |---|---|---|\n| 8 | 256 | 255 |\n| 16 | 64K | 64K-1 |\n| 32 | 4G | 4G-1 |\n|\
    \ 48 | 256T | 256T-1 |\n| 64 | 16E | 16E-1 |\n\n## Why Virtual Memory (VM)?\n\n\
    - Uses main memory efficiently\n  - Use DRAM as a cache for the parts of a virtual\
    \ address space\n- Simplifies memory management\n  - Each process gets the same\
    \ uniform linear address space\n- Isolates address spaces\n  - One process can’t\
    \ interfere with another’s memory\n  - User program cannot access privileged kernel\
    \ information\n\n## Using Main Memory as a Cache\n\n- DRAM vs. disk is more extreme\
    \ than SRAM vs. DRAM\n  - Access latencies:\n    - DRAM ~10× slower than SRAM\n\
    \    - Disk ~100,000× slower than DRAM\n  - Bottom line:\n    - Design decisions\
    \ made for DRAM caches driven by enormous cost of misses\n\n## Design Considerations\n\
    \n- Line size? (Large vs. Small)\n  - **Large**, since disk better at transferring\
    \ large blocks\n- Associativity? (Full vs. Direct)\n  - **Full**, to minimize\
    \ miss rate\n- Write through or write back? (WB vs. WT)\n  - **Write back**, since\
    \ can't afford to perform small writes to disk\n\n## Page\n\n- Virtual memory\n\
    \  - Organized as an array of contiguous byte-sized cells stored on disk conceptually.\n\
    \  - Each byte has a unique virtual address that serves as an index into the array\n\
    \  - The contents of the array on disk are cached in main memory\n\n## Page\n\n\
    - The data on disk is partitioned into **blocks**\n  - Serve as the transfer units\
    \ between the disk and the main memory\n  - virtual *pages* (VPs)\n  - physical\
