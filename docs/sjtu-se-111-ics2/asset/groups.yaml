  mdcn: "\n\n## 限制：寄存器开销\n\n- 随着尝试加深流水线，加载寄存器的开销变得更加显著\n- 花在加载寄存器上的时钟周期百分比：\n  - 1级流水线：6.25%\n\
    \  - 3级流水线：16.67%\n  - 6级流水线：28.57%\n- 现代处理器设计通过非常深的流水线获得高速\n\n## 数据依赖\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_182_0.png)\n\
    \n- 系统\n  - 每个操作都依赖于前一个操作的结果\n\n## 数据冒险\n\nComb. logic A\n\nReg\n\nComb. logic\
    \ B\n\nReg\n\nComb. logic C\n\nReg\n\nClock\n\nOP1\n\nOP2\n\nOP3\n\nOP4\n\nTime\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_183_0.png)\n\n## 数据冒险\n\n- 结果没有及时反馈以供下一个操作使用\n\
    - 流水线改变了系统的行为\n\n```\n1  irmovl $50, %eax\n2  addl %eax, %ebx\n3  mrmovl 100(%ebx),\
    \ %edx\n```\n\n## SEQ+ CPU 实现\n\n## 概要\n\n- SEQ+ 实现\n- 建议阅读 4.5.1\n\n## SEQ 硬件\
    \ vs. SEQ+ 硬件\n\n- SEQ 硬件\n  - 阶段按顺序发生\n  - 一次只有一个操作在进行\n- SEQ+ 硬件\n  - 仍是顺序实现\n\
    \  - 将 PC 阶段重新排序至开头\n\n## SEQ+ 硬件\n\n- **PC 阶段**\n  - 任务是为当前指令选择 PC\n  - 基于前一条指令计算的结果\n\
    - **处理器状态**\n  - PC 不再存储在寄存器中\n  - 但可以根据其他存储的信息确定 PC\n\n## PC 计算\n\n```\nint pc=\
    \ [\n    picode == ICALL : pValC;\n    picode == IJXX && pBch : pValC;\n    Picode\
    \ == IRET : pValM;\n    1 : pValP;\n];\n```\n\n## 朴素流水线实现\n\n## 概要\n\n- 朴素 PIPE\
    \ 实现\n- 流水线冒险\n- 建议阅读 4.5.2 ~ 4.5.5\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_193_0.png)\n\
    \n## 流水线阶段\n\n- Fetch\n  - 选择当前 PC\n  - 读取指令\n  - 计算递增的 PC\n- Decode\n  - 读取程序寄存器\n\
    - Execute\n  - 操作 ALU\n- Memory\n  - 读或写数据内存\n- Write Back\n  - 更新寄存器文件\n\n##\
    \ PIPE- 硬件\n\n- 流水线寄存器保存指令执行的中间值\n- 正向（向上）路径\n  - 值从一个阶段传递到下一个阶段\n  - 不能跳过阶段\n\
    \    - 例如，valC 经过解码\n\n## 反馈路径\n\n- 预测 PC\n  - 猜测下一个 PC 的值\n  - 分支信息\n    - 跳转已取/未取\n\
    \    - 穿透或目标地址\n  - 返回点\n    - 从内存读取\n- 寄存器更新\n  - 到寄存器文件写端口\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_0.png)\n\
    \n## Write back\n\n## Memory\n\n## Execute\n\n## Decode\n\n## Fetch\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_1.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_2.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_3.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_4.png)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_198_5.png)\n\
    \n| 阶段 | 流水线寄存器字段 |\n|---|---|\n| W | stat, icode, valE, valM, dstE, dstM |\n\
    | M | stat, icode, Cnd, valE, valA, dstE, dstM |\n| E | stat, icode, ifun, valC,\
    \ valA, valB, dstE, dstM, srcA, srcB |\n| D | stat, icode, ifun, rA, rB, valC,\
    \ valP |\n| F | predPC |\n\n## 预测 PC\n\n- 在当前指令完成取指阶段后开始获取新指令\n  - 没有足够的时间可靠地确定下一条指令\n\
    - 猜测将跟随的指令\n  - 如果预测错误则恢复\n\n## 我们的预测策略\n\n- 不转移控制的指令\n  - 预测下一个 PC 为 valP\n \
    \ - 总是可靠的\n- 调用和无条件跳转\n  - 预测下一个 PC 为 valC（目标）\n  - 总是可靠的\n\n"
