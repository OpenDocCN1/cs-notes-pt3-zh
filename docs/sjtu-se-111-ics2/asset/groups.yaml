    \  - 返回就绪描述符的数量并设置 readset 的每一位以指示其对应描述符的就绪状态\n\n## I/O 多路复用：select() 函数\n\n-\
    \ readset\n  - 位向量（最多 FD_SETSIZE 位）指示描述符集合的成员资格\n  - 如果位 k 为 1，则描述符 k 是描述符集合的成员\n\
    - maxfd\n  - readset 的基数\n  - 测试描述符 0, 1, 2, ..., maxfd-1 的集合成员资格\n\n## 操作集合描述符的宏\n\
    \n```\n/* clear all bits in fdset. */\nvoid FD_ZERO(fd_set *fdset);\n\n/* clear\
