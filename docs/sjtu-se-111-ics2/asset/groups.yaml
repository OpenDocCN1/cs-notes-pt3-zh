    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_1085_0.png)\n\n## CISC 与 RISC\n\n## Y86\n\
    \n+   - Y86 指令集体系结构\n+     - 与 IA32 具有相似的状态和指令\n+     - 编码更简单\n+     - 介于 CISC\
    \ 和 RISC 之间\n\n## CISC\n\n+   - 算术指令可以访问内存\n+     - addl %eax, 12(%ebx,%ecx,4)\n\
    +     - 需要进行内存读写\n+     - 复杂的地址计算\n+   - 条件码\n+     - 作为算术和逻辑指令的副作用被设置\n\n+  \
    \ - 设计理念\n+     - 增加用于执行“典型”编程任务的指令\n\n## RISC\n\n+   - RISC（发音为“risk”）\n+   -\
    \ 设计理念\n+     - 针对更简单的指令集形式生成高效代码\n+   - 为什么不采用 CISC？\n+     - 高级指令很难由编译器生成，而且很少被使用\n\
    \n## 约翰·科克\n\n美国 – 1987 年\n\n## 获奖理由\n\n因其在编译器的设计与理论、大型系统的体系结构以及精简指令集计算机（RISC）的开发方面作出的重大贡献；因发现并系统化了许多如今用于优化编译器的基本转换，包括运算强度削弱、公共子表达式消除、寄存器分配、常量传播和死代码消除。\n\
    \n## 约翰·科克\n\n约翰·科克，又译为约翰·考克、约翰·寇克，生于美国北卡罗来纳州夏洛特，计算机科学家，在电脑架构及编译器最优化技术方面有重大贡献，因此获得图灵奖。曾提出\
    \ CYK 算法。在他主导的 IBM 801 计划中，首次采用 RISC 架构，因此被称为 RISC 架构之父。荣誉颇多。\n\n生于：1925 年 5 月\
    \ 30 日，美国北卡罗来纳州夏洛特（北卡罗来纳州）\n\n逝于：2002 年 7 月 16 日，美国纽约州瓦尔哈拉\n\n教育背景：杜克大学（1953 年），杜克大学（1946\
    \ 年）\n\n所获奖项：图灵奖，约翰·冯·诺伊曼奖\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1093_0.png)\n\
    \n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1093_1.png)\n\n## CISC 与 RISC\n\n##\
    \ CISC\n\n## RISC\n\n用于指定操作数的多种格式。\n例如，内存操作数说明符可以由位移量、基址寄存器、变址寄存器和比例因子的多种不同组合构成。\n\
    \n简单的寻址格式。\n通常只使用基址加位移量的寻址方式。\n\n"
