  md: "\n## Translating with the P6 page tables (case 1/1)\n\n- Case 1/1: page table\
    \ and page present.\n- MMU Action:\n  - MMU build physical address and fetch data\
    \ word.\n- OS Action:\n  - none\n\nMem\n\nDisk\n\nPage directory\n\nPage table\n\
    \nData page\n\n## Translating with the P6 page tables (case 1/0, cont)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1008_0.png)\n\
    \n- OS Action:\n  - Check for a legal virtual address.\n  - Read PTE through PDE.\n\
    \  - Find free physical page (swapping out current page if necessary)\n  - Read\
    \ virtual page from disk and copy to physical page\n  - Restart faulting instruction\
    \ by returning from exception handler.\n\nMem\n\nDisk\n\n## Translating with the\
    \ P6 page tables (case 0/1)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1009_0.png)\n\
    \nMem\n\nDisk\n\n- Case 0/1: page table missing but page present.\n- Introduces\
    \ consistency issue.\n- Potentially every page out requires update of disk page\
    \ table.\n- Linux disallows this.\n- If a page table is swapped out, then swap\
    \ out its data pages too.\n\n## Translating with the P6 page tables (case 0/0)\n\
    \n- Case 0/0: page table and page missing.\n- MMU Action:\n  - Page fault exception\n\
    \n```\nMem\n\nDisk\n\nVPN VPO\n20 12\nVPN1 VPN2\nPDE p=0\nPDBR\nPage directory\n\
    PTE p=0\nPage table\ndata\nData page\n```\n\n## Translating with the P6 page tables\
    \ (case 0/0, cont)\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1011_0.png)\n\n\
    - OS Action:\n  - Swap in page table.\n  - Restart faulting instruction by returning\
    \ from handler.\n\nLike case 1/0 from here on.\n\n## P6 L1 Cache Access\n\n```\n\
    CPU\nvirtual address (VA)\nVPN 20 VPO 12\nTLBT 16 TLBI 4\nTLB miss\nTLB hit\n\
    TLB (16 sets, 4 entries/set)\nVPN1 10 VPN2 10\nPDE\nPTE\nPage tables\nPDBR\nPPN\
    \ 20 PPO 12\nphysical address (PA)\nCT 20 CI 7 CO 5\nL1 (128 sets, 4 lines/set)\n\
    L1 hit\nL1 miss\n32 result\nL2 and DRAM\n```\n\n## L1 cache access\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1013_0.png)\n\
    \n- Partition physical address into CO, CI, and CT.\n- Use CT to determine if\
    \ line containing word at address PA is cached in set CI.\n- If no: check L2.\n\
    - If yes: extract word at byte offset CO and return to processor.\n\n## Core i7\
    \ Summary\n\n- Core i7\n  - The 64-bit Nehalem microarchitecture\n  - Currently\
    \ supports 48-bit (256 TB) virtual address space and 52-bit (4 PB) physical address\
    \ space\n  - Compatibility mode supports 32-bit (4 GB) virtual and physical address\
    \ spaces\n\n## Core i7 Memory System\n\n```\nProcessor package\n\nCore x 4\n\n\
    Registers\n\nInstruction fetch\n\nMMU (addr translation)\n\nL1 d-cache 32 KB,\
    \ 8-way\n\nL1 i-cache 32 KB, 8-way\n\nL1 d-TLB 64 entries, 4-way\n\nL1 i-TLB 64\
    \ entries, 4-way\n\nL2 unified cache 256 KB, 8-way\n\nL2 unified TLB 512 entries,\
    \ 4-way\n\nQuickPath interconnect 4 links @ 25.6 GB/s 102.4 GB/s total\n\nTo other\
    \ cores\n\nTo I/O bridge\n\nL3 unified cache 8 MB, 16-way (shared by all cores)\n\
    \nDDR3 memory controller 3 x 64-bit @ 10.66 GB/s 32 GB/s total (shared by all\
    \ cores)\n\nMain memory\n```\n\n## Core i7 Address Translation\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1016_0.png)\n\
    \n## Level 1, Level 2 and Level 3 Page Table Entry\n\n| Bits | Field |\n| ---\
    \ | --- |\n| 63 | XD |\n| 62-52 | Unused |\n| 51-12 | Page table physical base\
    \ addr |\n| 11-9 | Unused |\n| 8 | G |\n| 7 | PS |\n| 6 |  |\n| 5 | A |\n| 4 |\
    \ CD |\n| 3 | WT |\n| 2 | U/S |\n| 1 | R/W |\n| 0 | P=1 |\n\nP=0: Available for\
    \ OS (page table location in secondary storage).\n\n- XD: Disable or enable instruction\
    \ fetches\n- Base addr: 40 most significant bits of base address of child page\
    \ table (forces page tables to be 4KB aligned)\n- G: global page (don’t evict\
    \ from TLB on task switch)\n- PS: Page size either 4K(0) or 2M(1) (defined for\
    \ Level 1 PTEs only)\n- A: Reference bit (set by MMU on reads and writes, cleared\
    \ by software)\n- CD: Cache disabled(1) or enabled(0) for child page table\n-\
    \ WT: Write-through or write-back cache policy\n- U/S: User or supervisor(kernel)\
    \ mode access permission\n- R/W: Read-only or read-write access permission\n-\
    \ P: Child page table present in memory(1) or not(0)\n"
  mdcn: "\n\n## 使用 P6 页表进行转换（情况 1/1）\n\n- 情况 1/1：页表存在且页存在。\n- MMU 操作：\n  - MMU 构建物理地址并获取数据字。\n\
    - OS 操作：\n  - 无\n\nMem\n\nDisk\n\nPage directory\n\nPage table\n\nData page\n\n\
    ## 使用 P6 页表进行转换（情况 1/0，续）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1008_0.png)\n\
    \n- OS 操作：\n  - 检查虚拟地址是否合法。\n  - 通过 PDE 读取 PTE。\n  - 找到空闲物理页（必要时换出当前页）\n  - 从磁盘读取虚拟页并复制到物理页\n\
    \  - 通过返回异常处理程序重新启动故障指令。\n\nMem\n\nDisk\n\n## 使用 P6 页表进行转换（情况 0/1）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1009_0.png)\n\
    \nMem\n\nDisk\n\n- 情况 0/1：页表缺失但页存在。\n- 引入一致性问题。\n- 潜在地每次页外都需要更新磁盘页表。\n- Linux\
    \ 禁止这种情况。\n- 如果页表被换出，则同时换出其数据页。\n\n## 使用 P6 页表进行转换（情况 0/0）\n\n- 情况 0/0：页表和页均缺失。\n\
    - MMU 操作：\n  - 页故障异常\n\n```\nMem\n\nDisk\n\nVPN VPO\n20 12\nVPN1 VPN2\nPDE p=0\n\
    PDBR\nPage directory\nPTE p=0\nPage table\ndata\nData page\n```\n\n## 使用 P6 页表进行转换（情况\
    \ 0/0，续）\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1011_0.png)\n\n- OS 操作：\n\
    \  - 换入页表。\n  - 通过返回处理程序重新启动故障指令。\n\n从这里开始与情况 1/0 相同。\n\n## P6 L1 缓存访问\n\n```\n\
    CPU\nvirtual address (VA)\nVPN 20 VPO 12\nTLBT 16 TLBI 4\nTLB miss\nTLB hit\n\
    TLB (16 sets, 4 entries/set)\nVPN1 10 VPN2 10\nPDE\nPTE\nPage tables\nPDBR\nPPN\
    \ 20 PPO 12\nphysical address (PA)\nCT 20 CI 7 CO 5\nL1 (128 sets, 4 lines/set)\n\
    L1 hit\nL1 miss\n32 result\nL2 and DRAM\n```\n\n## L1 缓存访问\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1013_0.png)\n\
    \n- 将物理地址划分为 CO、CI 和 CT。\n- 使用 CT 确定包含地址 PA 处字的行是否缓存在集合 CI 中。\n- 如果否：检查 L2。\n\
    - 如果是：提取字节偏移 CO 处的字并返回处理器。\n\n## Core i7 总结\n\n- Core i7\n  - 64 位 Nehalem 微架构\n\
    \  - 目前支持 48 位（256 TB）虚拟地址空间和 52 位（4 PB）物理地址空间\n  - 兼容模式支持 32 位（4 GB）虚拟和物理地址空间\n\
    \n## Core i7 内存系统\n\n```\nProcessor package\n\nCore x 4\n\nRegisters\n\nInstruction\
    \ fetch\n\nMMU (addr translation)\n\nL1 d-cache 32 KB, 8-way\n\nL1 i-cache 32\
    \ KB, 8-way\n\nL1 d-TLB 64 entries, 4-way\n\nL1 i-TLB 64 entries, 4-way\n\nL2\
    \ unified cache 256 KB, 8-way\n\nL2 unified TLB 512 entries, 4-way\n\nQuickPath\
    \ interconnect 4 links @ 25.6 GB/s 102.4 GB/s total\n\nTo other cores\n\nTo I/O\
    \ bridge\n\nL3 unified cache 8 MB, 16-way (shared by all cores)\n\nDDR3 memory\
    \ controller 3 x 64-bit @ 10.66 GB/s 32 GB/s total (shared by all cores)\n\nMain\
    \ memory\n```\n\n## Core i7 地址转换\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1016_0.png)\n\
    \n## 一级、二级和三级页表项\n\n| Bits | Field |\n| --- | --- |\n| 63 | XD |\n| 62-52 | Unused\
    \ |\n| 51-12 | Page table physical base addr |\n| 11-9 | Unused |\n| 8 | G |\n\
    | 7 | PS |\n| 6 |  |\n| 5 | A |\n| 4 | CD |\n| 3 | WT |\n| 2 | U/S |\n| 1 | R/W\
    \ |\n| 0 | P=1 |\n\nP=0: Available for OS (page table location in secondary storage).\n\
    \n- XD: Disable or enable instruction fetches\n- Base addr: 40 most significant\
    \ bits of base address of child page table (forces page tables to be 4KB aligned)\n\
    - G: global page (don’t evict from TLB on task switch)\n- PS: Page size either\
    \ 4K(0) or 2M(1) (defined for Level 1 PTEs only)\n- A: Reference bit (set by MMU\
    \ on reads and writes, cleared by software)\n- CD: Cache disabled(1) or enabled(0)\
    \ for child page table\n- WT: Write-through or write-back cache policy\n- U/S:\
    \ User or supervisor(kernel) mode access permission\n- R/W: Read-only or read-write\
    \ access permission\n- P: Child page table present in memory(1) or not(0)\n\n"
