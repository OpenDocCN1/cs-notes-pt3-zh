    ```\n# demo-h0.ys\n0x000: irmovl $10,%edx\n0x006: irmovl $3,%eax\n0x00c: addl\
    \ %edx,%eax\n0x00e: halt\n```\n\n- 寄存器 %edx\n- 由上一周期 ALU 生成\n- 从 M 阶段转发作为 valA\n\
    - 寄存器 %eax\n- 值刚由 ALU 生成\n- 从 E 阶段转发作为 valB\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_233_0.png)\n\
    \n## 实现转发\n\n```\n## A 值应该是什么？\nint new_E_valA = [\n    # 使用递增的 PC\n    D_icode\
    \ in { ICALL, IJXX } : D_valP;\n    # 从执行转发 valE\n    d_srcA == E_dstE : e_valE;\n\
    \    # 从记忆转发 valM\n    d_srcA == M_dstM : m_valM;\n    # 从记忆转发 valE\n    d_srcA\
    \ == M_dstE : M_valE;\n    # 从写回转发 valM\n    d_srcA == W_dstM : W_valM;\n    #\
    \ 从写回转发 valE\n    d_srcA == W_dstE : W_valE;\n    # 使用从寄存器文件读取的值\n    1 : d_rvalA;\n\
    ];\n```\n\n## 转发的局限性\n\n```\n#demo-luh.ys\n0x000: irmovl $128, %edx\n0x006: irmovl\
    \ $3, %ecx\n0x00c: rmmovl %ecx, 0(%edx)\n0x012: irmovl $10, %ebx\n#Load %eax\n\
    0x018: mrmovl 0(%edx), %eax\n#Use %eax\n0x10e: addl %ebx, %eax\n0x020: halt\n\
    ```\n\n- Load-use 相关\n- 值在第 7 周期 D 阶段结束时需要\n- 值在第 8 周期 M 阶段从内存读取\n\n| Cycle 7\
    \ | Cycle 8 |\n|---|---|\n| Memory | Memory |\n| M_dstE=%ebx<br>M_valE=10 | M_dstM=%eax<br>m_valM\
    \ <- M[128]=3 |\n| : | |\n| Decode | |\n| valB<-M_valE=10<br>valA<-R[%eax]=0 |\
    \ |\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_237_0.png)\n\n## 避免 Load/Use 冒险\n\
    \n```\n#demo-luh.ys\n0x000: irmovl $128, %edx\n0x006: irmovl $3, %ecx\n0x00c:\
    \ rmmovl %ecx, 0(%edx)\n0x012: irmovl $10, %ebx\n#Load %eax\n0x018: mrmovl 0(%edx),\
    \ %eax\n#Use %eax\n0x10e: addl %ebx, %eax\n0x020: halt\n```\n\n- 使用一条指令停顿一个周期\n\
    - 然后可以通过从内存转发获取加载的值\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_238_0.png)\n\n\
    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_238_1.png)\n\n## Load/Use 冒险的控制\n\n```\n\
    #demo-luh.ys\n\n0x000: irmovl $128, %edx\n0x006: irmovl $3, %ecx\n0x00c: rmmovl\
    \ %ecx, 0(%edx)\n0x012: irmovl $10, %ebx\n#Load %eax\n0x018: mrmovl 0(%edx), %eax\n\
    #Use %eax\n0x10e: addl %ebx, %eax\n0x020: halt\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_240_0.png)\n\
    \n- 停顿取指和解码阶段的指令\n- 在执行阶段注入气泡\n\n| Condition | F | D | E | M | W |\n|---|---|---|---|---|---|\n\
    | Load/Use Hazard | stall | stall | bubble | normal | normal |\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_241_0.png)\n\
    \n## 流水线实现\n\n## 概要\n\n- 处理控制冒险\n- 特殊情况\n- 建议阅读 4.5\n\n## 控制相关\n\n- 示例：\n- loop:\n\
