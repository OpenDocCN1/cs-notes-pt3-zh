- pgno: 610
  md: '# File table


    +   - The set of open files is represented by a file table

    +   - File table is shared by all processes

    +   - Each file table entry consists

    +     - the current file position

    +     - a reference count of the number of descriptor entries that currently point
    to it

    +     - a pointer to an entry in the v-node table

    +     - the kernel deletes a file table entry when its reference count becomes
    zero'
