  md: '# Level 1, Level 2 and Level 3 Page Table Entry


    | 63 62 | 52 51 | 12 11 | 9 8 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|

    | XD | Unused | Page table physical base addr | Unused | G | PS |  | A | CD |
    WT | U/S | R/W | P=1 |

    |  |  |  |  |  |  |  |  |  |  |  |  | Available for OS (page table location in
    secondary storage) | P=0 |


    XD Disable or enable instruction fetches


    Base addr 40 most significant bits of base address of child page table (forces
    page tables to be 4KB aligned)


    G global page (don’t evict from TLB on task switch)


    PS Page size either 4K(0) or 2M(1) (defined for Level 1 PTEs only)


    A Reference bit (set by MMU on reads and writes, cleared by software)


    CD Cache disabled(1) or enabled(0) for child page table


    WT Write-through or write-back cache policy


    U/S User or supervisor(kernel) mode access permission


    R/W Read-only or read-write access permissiom


    P Child page table present in memory(1) or not(0)'
