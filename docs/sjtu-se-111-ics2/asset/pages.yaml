    \ state across invocations\n\n```\nunsigned int next = 1;\n/* rand - return pseudo-random\
    \ int on 0..32767 */\nint rand(void)\n{\n    next = next * 110351524 + 12345 ;\n\
    \    return (unsigned int)((next/65536) % 32768);\n}\n/* srand - set seed for\
    \ rand() */\nvoid srand(unsigned int seed)\n{\n    next = seed;\n}\n```"
