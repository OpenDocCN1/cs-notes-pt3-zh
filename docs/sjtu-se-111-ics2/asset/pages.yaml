- pgno: 49
  md: '# Memory


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_49_0.png)


    +   - Memory

    +     - Holds program data and instructions

    +   - Ports

    +     - A single address input

    +     - A data input for writing, and a data output for reading

    +     - Error signal means invalid address'
  merge: -1
