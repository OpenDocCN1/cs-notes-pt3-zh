  md: '# Reading and Writing Files


    +   - A read operation

    +     - Copies m > 0 bytes from the file to memory

    +       - starting at the current file position k

    +       - incrementing k by m

    +     - If the total bytes from k to the end of file is less than m, it triggers
    a condition known as end-of-file (EOF)

    +       - Can be detected by the application

    +       - There is no explicit "EOF character" at the end of a file'
