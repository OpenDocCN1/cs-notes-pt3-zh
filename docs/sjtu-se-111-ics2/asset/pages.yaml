- pgno: 1142
  md: '# Example


    +   - Now We take Matrix multiplication as an example.

    +   - You met it in Lecture “Cache Friendly Code” Last Semester

    +   - This time, more specific.'
  merge: -1
  img_proc: true
- pgno: 1143
  md: "+   - Two Matrix X * Y = Z  each Matrix is N x N\n+   - Look at the innermost\
    \ loop. (Besides why register allocated first ? )\n\n```\nfor(i = 0; i < N; i++)\n\
    \    for(k = 0; k < N; k++)\n        r = X(i,k); /*register allocated*/\n    \
    \    for(j = 0; j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1143_0.png)"
  merge: -1
  img_proc: true
- pgno: 1144
  md: '+   - If Cache is large enough ... everything will be fine!

    +     - Thanks to Prefetching, All Z and Y items will be reused.

    +   - What if Cache can’t hold one N x N matrix?

    +     - Data Y would be replaced before reused

    +   - What if Cache can’t hold even a row in Z?

    +     - Z data in the cache can’t be reused'
  merge: -1
  img_proc: true
- pgno: 1145
  md: "+   - What is the worst case ?\n+   - 2N^3 + N^2 words of data need to be read\
    \ from memory in N^3 iterations\n\n```\nfor(i = 0; i < N; i++)\n    for(k = 0;\
    \ k < N; k++)\n        r = X(i,k); /*register allocated*/\n        for(j = 0;\
    \ j < N; j++)\n            Z(i,j) += r*Y(k,j);\n```"
  merge: -1
  img_proc: true
- pgno: 1146
  md: +   - Try blocking the matrix into small chunk, thus cache can hold that small
    chunk. Then loop locality will be back.
  merge: -1
  img_proc: true
- pgno: 1147
  md: "# Blocking code\n\n```\n```c\nfor(i = 0; i < N; i++)\n    for(k = 0; k < N;\
    \ k++)\n        r = X(i,k); /* register allocated */\n        for(j = 0; j < N;\
    \ j++)\n            Z(i,j) += r*Y(k,j);\n```\n```\n\n```\n```c\nfor(kk = 0; kk\
    \ < N; kk+B)\n    for(jj = 0; jj < N; jj+B)\n        for(i = 0; i < N; i++)\n\
    \            for(k = kk; k < min(kk+B-1,N); k++)\n                r = X(i,k);\n\
    \                for(j = jj; j < min(jj+B-1,N); j++)\n                    Z(i,j)\
    \ += r*Y(k,j);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 1148
  md: "```\n```cpp\nfor(kk = 0; kk < N; kk+=B)\n    for(jj = 0; jj < N; jj+=B)\n \
    \       for(i = 0; i < N; i++)\n            for(k = kk; k < min(kk+B-1,N); k++)\n\
    \                r = X(i,k);\n                for(j = jj; j < min(jj+B-1,N); j++)\n\
    \                    Z(i,j) += r*Y(k,j);\n```\n```\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_1148_0.png)"
  merge: -1
  img_proc: true
- pgno: 1149
  md: "+   - B <<< N (less than)\n+   - B is called blocking factor\n+   - B x B submatrix\
    \ of Y and a row of length B of Z can fit in cache. Thus called B x B Blocking\n\
    \n```\nfor (kk = 0; kk < N; kk+B)\n    for (jj = 0; jj < N; jj+B)\n        for\
    \ (i = 0; i < N; i++)\n            for (k = kk; k < min(kk+B-1,N); k++)\n    \
    \            r = X(i,k);\n                for (j = jj; j < min(jj+B-1,N); j++)\n\
    \                    Z(i,j) += r*Y(k,j);\n```"
  merge: -1
  img_proc: true
- pgno: 1150
  md: '+   - Thus 2N^3 /B + N^2 words accessed in main memory.

    +   - Larger B, Larger performance gain?

    +     - Choose an appropriate Blocking factor, so that cache is fully occupied
    by data to be reused'
  merge: -1
  img_proc: true
- pgno: 1151
  md: '+   - Yes, but not always.

    +   - As to fully associative cache with LRU policy, it’s right.

    +     - Cache fully used.

    +   - In practice, caches are direct mapped or have at most a small degree of
    set associativity.

    +     - Map multiple rows of a matrix to the same cache line, making it infeasible
    to try to fully use cache.'
  merge: -1
  img_proc: true
