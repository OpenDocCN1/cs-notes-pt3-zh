- pgno: 1111
  md: "# At glance of MIPS\n\n+   - Operations\n\n+   - Arithmetic/logical instructions\
    \ R-type\n\n```\nDADDU R1, R2, R3\n    Regs[R1] ← Regs[R2] + Regs[R3]\n```\n\n\
    ```\nDADDIU R1, R2, #3\n    Regs[R1] ← Regs[R2] + 3\n```\n\n```\nDSLL R1, R2,\
    \ #5\n    Regs[R1] ← Regs[R2] << 5\n```\n\n```\nSLT R1, R2, R3\n    Regs[R1] ←\
    \ (Regs[R2]<Regs[R3]) ? 1 : 0\n```"
  merge: -1
