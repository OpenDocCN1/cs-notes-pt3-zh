    | Decode | valA ← R[rA]

    valB ← R[rB] | valA ← R[%edx] = 9

    valB ← R[%ebx] = 21 |

    | Execute | valE ← valB ifun

    Set CC | valE ← 21 - 9 = 12

    ZF ← 0, SF ← 0, OF ← 0 |

    | Memory |  |  |

    | Write back | R[rB] ← valE | R[%ebx] ← valE = 12 |

    | PC update | PC ← valP | PC ← valP = 0x00E |'
