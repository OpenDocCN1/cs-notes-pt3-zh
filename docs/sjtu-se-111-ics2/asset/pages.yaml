- pgno: 1058
  md: '# Case 1


    +   - What is the page size in such system?

    +     - 4K (2¹²)

    +   - How much memory is consumed by the page table and wasted by internal fragmentation
    for a process that has 128K of memory starting at address 0?

    +     - #L3-entry: 2⁸ = 256, entry size: 5byte (44-12+4bits)

    +     - #L2-entry: 2⁴ = 16, entry size: 5byte (44-8+4bits)

    +     - #L1-entry: 2⁸ = 256 , entry size: 6byte (44-4+4bits)'
  merge: -1
  img_proc: true
- pgno: 1059
  md: '# Case 1


    +   - How much memory is consumed by the page table and wasted by internal fragmentation
    for a process that has 128K of memory starting at address 0?

    +     - 128K = 4K * 32 → 1*L1 + 1*L2 + 1*L3

    +     - L3: 256 * 5 = 1280 Bytes

    +     - L2: 16 * 5 = 80 Bytes

    +     - L1: 256 * 6 = 1536 Bytes

    +     - Memory: 1280 + 80 + 1536 = 2896 Bytes

    +     - Internal: 1*(5*8-36) + 1*(5*8-40) + 32*(6*8-44) = 132bits'
  merge: -1
  img_proc: true
