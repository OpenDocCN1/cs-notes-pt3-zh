- pgno: 655
  md: '# Pros and Cons of Unix I/O


    +   - **Pros**

    +     - Unix I/O is the most general and lowest overhead form of I/O.

    +       - All other I/O packages are implemented using Unix I/O functions.

    +     - Unix I/O provides functions for accessing file metadata.

    +     - Unix I/O functions are async-signal-safe and can be used safely in signal
    handlers.'
  merge: -1
  img_proc: true
- pgno: 656
  md: '# Pros and Cons of Unix I/O


    +   - **Cons**

    +     - Dealing with short counts is tricky and error prone.

    +     - Efficient reading of text lines requires some form of buffering, also
    tricky and error prone.

    +     - Both of these issues are addressed by the standard I/O and RIO packages.'
  merge: -1
  img_proc: true
- pgno: 657
  md: '# Pros and Cons of Standard I/O


    +   - Pros:

    +     - Buffering increases efficiency by decreasing the number of `read` and
    `write` system calls

    +     - Short counts are handled automatically'
  merge: -1
  img_proc: true
- pgno: 658
  md: '# Pros and Cons of Standard I/O


    +   - Cons:

    +     - Provides no function for accessing file metadata

    +     - Standard I/O functions are not async-signal-safe, and not appropriate
    for signal handlers.

    +     - Standard I/O is not appropriate for input and output on network sockets

    +       - There are poorly documented restrictions on streams that interact badly
    with restrictions on sockets'
