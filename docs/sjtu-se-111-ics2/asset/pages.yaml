  md: '# Readers-Writers Problem


    +   - *Generalization of the mutual exclusion problem*

    +   - Problem statement:

    +     - Reader threads only read the object

    +     - Writer threads modify the object

    +     - Writers must have exclusive access to the object

    +     - Unlimited number of readers can access the object'
  merge: -1
  img_proc: true
- pgno: 884
  md: '# Readers-Writers Problem


    +   - Occurs frequently in real systems, e.g.,

    +     - Online airline reservation system

    +     - Multithreaded caching Web proxy'
  merge: -1
  img_proc: true
- pgno: 885
  md: '# Variants of Readers-Writers


    +   - First readers-writers problem (favors readers)

    +     - No reader should be kept waiting unless a writer has already been granted
    permission to use the object.

    +     - A reader that arrives after a waiting writer gets priority over the writer.'
  merge: -1
  img_proc: true
- pgno: 886
  md: '# Variants of Readers-Writers


    +   - Second readers-writers problem (favors writers)

    +     - Once a writer is ready to write, it performs its write as soon as possible

    +     - A reader that arrives after a writer must wait, even if the writer is
    also waiting.

    +   - Starvation (where a thread waits indefinitely) is possible in both cases.'
  merge: -1
  img_proc: true
- pgno: 887
  md: "# Solution to First Readers-Writers Problem\n\nReaders:\n\n```\nint readcnt;\
    \    /* Initially 0 */\nsem_t mutex, w; /* Both initially 1 */\n\nvoid reader(void)\
    \ {\n    while (1) {\n        P(&mutex);\n        readcnt++;\n        if (readcnt\
    \ == 1) /* First in */\n            P(&w);\n        V(&mutex);\n        /* Reading\
    \ happens here */\n        P(&mutex);\n        readcnt--;\n        if (readcnt\
    \ == 0) /* Last out */\n            V(&w);\n        V(&mutex);\n    }\n}\n```\n\
    \nWriters:\n\n```\nvoid writer(void)\n{\n    while (1) {\n        P(&w);\n   \
    \     /* Writing here */\n        V(&w);\n    }\n}\n```"
