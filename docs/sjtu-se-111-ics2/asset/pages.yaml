- pgno: 464
  md: '# Fork Function


    +   - The child

    +     - gets an identical (but separate) copy of the parent''s user-level virtual
    address space

    +       - including the text, data, and bss segments, heap, and user stack.

    +     - also gets identical copies of any of the parent''s open file descriptors

    +       - Which means the child can read and write any files that were open in
    the parent when it called fork.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# Fork Function


    +   - Called once

    +     - In the parent process

    +   - Returns twice:

    +     - In the parent process

    +       - Return the PID of the child

    +     - In the newly created child process.

    +       - Return 0'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# Fork Function


    +   - The return value provides an unambiguous way

    +     - whether the program is executing in the parent or the child.'
  merge: -1
  img_proc: true
