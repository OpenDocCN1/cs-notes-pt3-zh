- pgno: 557
  md: '# Receiving a Signal


    +   - Actions

    +     - kernel checks the set of unblocked pending signals (`pending & ~blocked`)

    +     - If this set is empty (the usual case)

    +       - then the kernel passes control to the next instruction (Iₙₑₓₜ) in the
    logical control flow of p.

    +     - However, if the set is nonempty

    +       - then the kernel chooses some signal k in the set (typically the smallest
    k)

    +       - and forces p to receive signal k.'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# Receiving a Signal


    +   - The receipt of the signal triggers some action by the process.

    +   - Once the process completes the action, then control passes back to the next
    instruction (Iₙₑₓₜ) in the logical control flow of p.


