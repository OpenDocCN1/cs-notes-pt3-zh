  md: '# Maintaining Exception Ordering


    | W | stat | icode | valE | valM | dstE | dstM |

    |---|---|---|---|---|---|---|

    | M | stat | icode | Cnd | valE | valA | dstE | dstM |

    | E | stat | icode | ifun | valC | valA | valB | dstE | dstM | srcA | srcB |

    | D | stat | icode | ifun | rA | rB | valC | valP |

    | F | predPC |


    +   - Add exception status field to pipeline registers

    +   - Fetch stage sets to either “AOK”, “ADR” (when bad fetch address), “HTL”
    (halt instruction) or “INS” (illegal instruction)

