- pgno: 46
  md: '# Storage


    +   - Random-access memories

    +     - e.g. Register File, Memory

    +     - Hold multiple words

    +       - Address input specifies which word to read or write

    +     - Possible multiple read or write ports

    +     - Read word when address input changes

    +     - Write word as clock rises'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Register File


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_47_0.png)


    +   - Register file

    +     - Holds values of program registers

    +     - %eax, %esp, etc.

    +     - Register identifier serves as address

    +       - ID "F" implies no read or write performed

    +   - Multiple Ports

    +     - Can read and/or write multiple words in one cycle

    +       - Each has separate address and data input/output'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Register File Timing


    +   - Reading

    +     - Like combinational logic

    +     - Output data generated based on input address (After some delay)

    +   - Writing

    +     - Like register

    +     - Update only as clock rises


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_48_0.png)


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_48_1.png)'
