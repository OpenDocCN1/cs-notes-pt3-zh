  md: "# sbuf Package - Implementation\n\n```\nvoid sbuf_insert(sbuf_t *sp, int item)\n\
    {\n    /* Wait for available slot */\n    P(&sp->slots);\n    /*Lock the buffer\
    \ */\n    P(&sp->mutex);\n    /*Insert the item */\n    sp->buf[(++sp->rear) %\
    \ (sp->n)] = item;\n    /* Unlock the buffer */\n    V(&sp->mutex);\n    /* Announce\
    \ available items*/\n    V(&sp->items);\n}\n```"
