    +   - **Question:**

    +     - How does the client pass arguments to the server?

    +   - **Answer:**

    +     - The arguments are appended to the URI

    +       - `http://add.com/cgi-bin/adder?1&2`

    +       - `adder` is the CGI program on the server that will do the addition.

