  md: '# CISC vs. RISC


    # CISC


    # RISC


    Implementation artifacts

    *hidden* from machine-level programs. The ISA provides a

    *clean* abstraction between programs and how they get executed.


    Implementation artifacts

    *exposed* to machine-level programs.

    (e.g., Some RISC machines prohibit particular instruction sequences and have jumps
    that do not take effect until the following instruction is executed. The compiler
    is given the task of optimizing performance within these constraints.)'
