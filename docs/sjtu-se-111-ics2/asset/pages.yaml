- pgno: 744
  md: '# Web content


    +   - Web servers return **content** to clients

    +     - content: a sequence of bytes with an associated MIME (Multipurpose Internet
    Mail Extensions) type


    +   - Example MIME types

    +     - `text/html` — HTML page

    +     - `text/plain` — Unformatted text

    +     - `application/postscript` — Postscript document

    +     - `image/gif` — Binary image encoded in GIF format

    +     - `image/jpg` — Binary image encoded in JPG format'
  merge: -1
  img_proc: true
- pgno: 745
  md: '# Static and dynamic content


    +   - The content returned in HTTP responses can be either static or dynamic

    +     - Static content:

    +       - Content stored in files and retrieved in response to an HTTP request

    +       - Examples: HTML files, images, audio clips.

    +     - Dynamic content:

    +       - Content produced on-the-fly in response to an HTTP request

    +       - Example: content produced by a program executed by the server on behalf
    of the client.'
  merge: -1
  img_proc: true
