- pgno: 65
  md: '# Process Instruction on SEQ


    +   - SEQ

    +     - Process a complete instruction in each cycle

    +     - A single clock controls all state

    +       - Load *CC* and new *PC*

    +       - Write register file and memory


    > > The processor never needs to read back the state updated by an instruction
    in order to complete the processing of this instruction.'
  merge: -1
  img_proc: true
