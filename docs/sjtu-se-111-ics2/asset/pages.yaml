- pgno: 1041
  md: "# mmap() example: fast file copy\n\n```\n/*\n * mmapcopy - uses mmap to copy\
    \ file fd to stdout\n */\nvoid mmapcopy(int fd, int size)\n{\n    char *bufp;\n\
    \    /* map the file to a new VM area */\n    bufp = mmap(0, size, PROT_READ,\n\
    \                MAP_PRIVATE, fd, 0);\n    /* write the VM area to stdout */\n\
    \    write(1, bufp, size);\n    return ;\n}\n```"
  merge: -1
  img_proc: true
