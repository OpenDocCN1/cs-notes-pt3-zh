- pgno: 910
  md: '# Issues: Deadlock


    Locking introduces the potential for deadlock: waiting for a condition that will
    never be true.


    Any trajectory that enters the deadlock region will eventually reach the deadlock
    state, waiting for either s or t to become nonzero.


    Other trajectories luck out and skirt the deadlock region.


    Initially, s=t=1


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_910_0.png)'
  merge: -1
  img_proc: true
