- pgno: 879
  md: "# sbuf Package - Declarations\n\n```\nstruct {\n    int *buf;      /* Buffer\
    \ array */\n    int n;         /* Maximum number of slots */\n    int front; \
    \    /* buf[(front+1)%n] is first item */\n    int rear;      /* buf[rear%n] is\
    \ last item */\n    sem_t mutex;   /* protects accesses to buf */\n    sem_t slots;\
    \   /* Counts available slots */\n    sem_t items;   /* Counts available items\
    \ */\n} sbuf_;\n```"
  merge: -1
  img_proc: true
- pgno: 880
  md: "# sbuf Package - Implementation\n\n```\nvoid sbuf_init(sbuf_t *sp, int n)\n\
    {\n    sp->buf = Calloc(n, sizeof(int));\n    /* Buffer holds max of n items */\n\
    \    sp->n = n;\n    /* Empty buffer iff front == rear */\n    sp->front = sp->rear\
    \ = 0;\n    /* Binary semaphore for locking */\n    Sem_init(&sp->mutex, 0, 1);\n\
    \    /* Initially, buf has n empty slots */\n    Sem_init(&sp->slots, 0, n);\n\
    \    /* Initially, buf has zero data items */\n    Sem_init(&sp->items, 0, 0);\n\
    }\n```"
  merge: -1
