- pgno: 28
  md: '# Bit-Level Multiplexor


    ![](img/9bd5f6161cb6607b56d2fb964d1b8794_28_0.png)


    # HCL Expression


    ```

    bool out = (s&&a) || (!s&&b)

    ```


    +   - Control signal s

    +   - Data signals a and b

    +   - Output a when s=1, b when s=0

    +   - Its name: MUX

    +   - Usage: Select one signal from a couple of signals'
  merge: -1
  img_proc: true
