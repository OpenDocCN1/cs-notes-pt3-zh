- pgno: 1130
  md: "# Correlating Branch Predictors\n\n```\nif (aa == 2)\n    aa = 0;\nif (bb ==\
    \ 2)\n    bb = 0;\nif (aa != bb)\n    { ... }\n\nDSUBUI R3, R1, #2\nBNEZ  R3,\
    \ L1      ; branch b1\nDADD  R1, R0, R0\nL1: DSUBUI R3, R2, #2\nBNEZ  R3, L2 \
    \     ; branch b2\nDADD  R2, R0, R0\nL2: DSUBU  R3, R1, R2\nBEQZ  R3, L3     \
    \ ; branch b3\n```\n\n+   - Behavior of b3 is correlated with that of b1 and b2\n\
    +     - if both b1 and b2 are NT, b3 will be T\n+   - Can (how do) we predict\
    \ such branches?"
  merge: -1
  img_proc: true
- pgno: 1131
  md: "# (1,1) Correlating Predictor\n\n```\nif (d == 0)\n    d = 1;\nif (d == 1)\n\
    { ... }\n\nBNEZ  R1, L1      ; branch b1\nDADDUI R1, R0, #1\nL1: DADDUI R3, R1,\
    \ #-1\nBNEZ  R3, L2      ; branch b2\n...\nL2:\n```\n\n|  | b1 | b2 |\n|---|---|---|\n\
    | 0 | NT | NT |\n| 1 | T | NT |\n| 2 | T | T |\n\n+   - Extension: (m,n) Correlating\
    \ Predictor\n+     - Use behavior of the last m branches to choose from among\
    \ 2m n-bit predictors"
  merge: -1
