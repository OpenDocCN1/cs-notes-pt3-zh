    \ (nleft > 0) {\n        if ((nwritten = write(fd, ptr, nleft)) <= 0) {\n    \
    \        if (errno == EINTR)\n                nwritten = 0; /* and call write()\
    \ again */\n            else\n                return -1; /* errorno set by write()\
