  md: '# Fork Function


    +   - Concurrent execution

    +     - The parent and the child are separate processes that run concurrently.

    +     - The instructions in their logical control flows can be interleaved by
    the kernel in an arbitrary way.

    +     - We can never make assumptions about the interleaving of the instructions
    in different processes.'
