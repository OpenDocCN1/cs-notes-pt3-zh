- pgno: 30
  md: "# Word Multiplexor\n\n+   - HCL Representation\n+     - Select input word A\
    \ or B depending on control signal s\n+     - HCL representation\n+       - Case\
    \ expression\n+       - Series of test : value pairs (Don't require mutually)\n\
    +   - Output value for first successful test\n\n```\nint Out = [\n  s : A;\n \
    \ 1 : B;\n];\ndefault case\n```"
  merge: -1
  img_proc: true
- pgno: 31
  md: "# HCL Word-Level Examples\n\n# Minimum of 3 Words\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_31_0.png)\n\
    \n# HCL Representation\n\n```\nint Min3 = [\n  A < B && A < C : A;\n  B < A &&\
    \ B < C : B;\n  1               : C;\n];\n```\n\n+   - Find minimum of three input\
    \ words\n+   - HCL case expression\n+   - Final case guarantees match"
  merge: -1
  img_proc: true
- pgno: 32
  md: "# HCL Word-Level Examples\n\n# 4-Way Multiplexor\n\n![](img/9bd5f6161cb6607b56d2fb964d1b8794_32_0.png)\n\
    \n# HCL Representation\n\n```\nint Out4 = [\n  !s1&&!s0: D0;\n  !s1      : D1;\n\
    \  !s0      : D2;\n  1        : D3;\n];\n```\n\n+   - Select one of 4 inputs based\
    \ on two control bits\n+   - HCL case expression\n+   - Simplify tests by assuming\
    \ sequential matching"
  merge: -1
  img_proc: true
