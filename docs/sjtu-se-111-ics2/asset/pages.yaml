    +   - Dijkstra''s P and V operations on semaphores

    +     - semaphore: non-negative integer synchronization variable.

    +     - P(s): [ while (s == 0) wait(); s--; ]

    +       - Dutch for "Proberen" (test)

    +     - V(s): [ s++; ]

    +       - Dutch for "Verhogen" (increment)'
