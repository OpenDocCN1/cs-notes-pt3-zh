- pgno: 638
  md: "```\n```c\nssize_t rio_readn(int fd, void *buf, size_t count)\n{\n    size_t\
    \ nleft = count;\n    ssize_t nread;\n    char *ptr = buf;\n\n    while (nleft\
    \ > 0) {\n        if ((nread = read(fd, ptr, nleft)) < 0) {\n            if (errno\
    \ == EINTR)\n                nread = 0; /* and call read() again */\n        \
    \    else\n                return -1; /* errno set by read() */\n        } else\
    \ if (nread == 0)\n            break; /* EOF */\n        nleft -= nread;\n   \
    \     ptr += nread;\n    }\n    return (count - nleft); /* return >= 0 */\n}\n\
    ```\n```"
