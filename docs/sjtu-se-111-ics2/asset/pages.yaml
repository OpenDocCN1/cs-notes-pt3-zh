- pgno: 669
  md: '# Lowest level: Ethernet segment


    +   - Operation

    +     - Each Ethernet adapter has a unique 48-bit address

    +       - E.g. 00:16:ea:e3:54:e6

    +     - Hosts send bits to any other host in chunks called frames.

    +     - Hub slavishly copies each bit from each port to every other port

    +       - Every host sees every bit

    +       - NOTE: Hubs are on their way out'
  merge: -1
  img_proc: true
- pgno: 670
  md: '# Next level: Bridged Ethernet segment


    +   - Spans building or campus

    +   - Bridges cleverly learn which hosts are reachable from which ports and then
    selectively copy frames from port to port'
