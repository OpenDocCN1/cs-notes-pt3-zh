  - '[PAGE 307]


    # Magnetic Disks (Cont.)


    +   - Earlier generation disks were susceptible to head-crashes

    +     - Surface of earlier generation disks had metal-oxide coatings which would
    disintegrate on head crash and damage all data on disk

    +     - Current generation disks are less susceptible to such disastrous failures,
    although individual sectors may get corrupted'
  - '[PAGE 308]


    # Magnetic Disks (Cont.)


    +   - Disk controller – interfaces between the computer system and the disk drive
    hardware.

    +     - accepts high-level commands to read or write a sector

    +     - initiates actions such as moving the disk arm to the right track and actually
    reading or writing the data

    +     - Computes and attaches checksums to each sector to verify that data is
    read back correctly

    +       - If data is corrupted, with very high probability stored checksum won’t
    match recomputed checksum

    +     - Ensures successful writing by reading back sector after writing it

    +     - Performs remapping of bad sectors'
  - '[PAGE 309]


    # Disk Subsystem


    ![](img/5285b20d8f5a79969a3f150d38beebfc_309_0.png)


    +   - Multiple disks connected to a computer system through a controller

    +     - Controllers functionality (checksum, bad sector remapping) often carried
    out by individual disks; reduces load on controller

    +   - Disk interface standards families

    +     - ATA (AT adaptor) range of standards

    +     - SATA (Serial ATA)

    +     - SCSI (Small Computer System Interconnect) range of standards

    +     - SAS (Serial Attached SCSI)

    +     - Several variants of each standard (different speeds and capabilities)'
  - '[PAGE 310]


    # Disk Subsystem


    +   - Disks usually connected directly to computer system

    +   - In Storage Area Networks (SAN), a large number of disks are connected by
    a high-speed network to a number of servers

    +   - In Network Attached Storage (NAS) networked storage provides a file system
    interface using networked file system protocol, instead of providing a disk system
    interface'
  - '[PAGE 311]


    <!-- no content -->'
  - '[PAGE 312]


    # Performance Measures (Cont.)


    +   - Mean time to failure (MTTF) - the average time the disk is expected to run
    continuously without any failure.

    +     - Typically 3 to 5 years

    +     - Probability of failure of new disks is quite low, corresponding to a "theoretical
    MTTF" of 500,000 to 1,200,000 hours for a new disk

    +       - E.g., an MTTF of 1,200,000 hours for a new disk means that given 1000
    relatively new disks, on an average one will fail every 1200 hours

    +     - MTTF decreases as disk ages'
  - '[PAGE 313]


    # Optimization of Disk-Block Access


    +   - **Block – a contiguous sequence of sectors from a single track**

    +     - data is transferred between disk and main memory in blocks

    +     - **sizes range from 512 bytes to several kilobytes**

    +       - Smaller blocks: more transfers from disk

    +       - Larger blocks: more space wasted due to partially filled blocks

    +       - Typical block sizes today range from 4 to 16 kilobytes

    +   - Disk-arm-scheduling algorithms order pending accesses to tracks so that
    disk arm movement is minimized'
  - '[PAGE 314]


    # Optimization of Disk Block Access(Cont.)


    +   - File organization - optimize block access time by organizing the blocks
    to correspond to how data will be accessed

    +     - E.g. Store related information on the same or nearby cylinders.

    +     - Files may get fragmented over time

    +       - E.g. if data is inserted to/deleted from the file

    +       - Or free blocks on disk are scattered, and newly created file has its
    blocks scattered over the disk

    +       - Sequential access to a fragmented file results in increased disk arm
    movement

    +     - Some systems have utilities to defragment the file system, in order to
    speed up file access'
  - '[PAGE 315]


    # Optimization of Disk Block Access(Cont.)


    +   - Nonvolatile write buffers speed up disk writes by writing blocks to a non-volatile
    RAM buffer immediately

    +     - Non-volatile RAM: battery backed up RAM or flash memory

    +       - Even if power fails, the data is safe and will be written to disk when
    power returns

    +     - Controller then writes to disk whenever the disk has no other requests
    or request has been pending for some time

    +     - Database operations that require data to be safely stored before continuing
    can continue without waiting for data to be written to disk

    +     - Writes can be reordered to minimize disk arm movement'
  md: "\n## Magnetic Disks (Cont.)\n\n- Earlier generation disks were susceptible\
