    \  - 工资（salary）\n- 学生由个人唯一的标识号（ID）来标识\n  - 每位学生有姓名（name）\n  - 主修的系（dept name）\n\
    \  - 已修学分数（tot_cred）\n\n## Example: University\n\n- 大学维护一个教室列表\n  - 楼名（building）\n\
    \  - 房间号（room_number）\n  - 容量（capacity）。\n- 大学维护开设的所有课程（开课）的列表\n  - 每次开课由课程号（course\
