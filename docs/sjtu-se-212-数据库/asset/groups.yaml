  mdcn: "\n\n## 映射基数约束\n\n- 表示通过一个关系集，一个实体可与多少个另一实体相关联。\n- 在描述二元关系集时最为有用。\n- 对于二元关系集，映射基数必须是以下类型之一：\n\
    \  - 一对一\n  - 一对多\n  - 多对一\n  - 多对多\n\n## 映射基数\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_148_0.png)\n\
