    ## 复合属性和多值属性


    - 实体 E 的多值属性 M 由单独的模式 EM 表示。

    - 模式 EM 有对应于 E 的主键的属性，以及对应于多值属性 M 的一个属性。

    - 示例：instructor 的多值属性 phone_number 由模式 inst_phone = ( ID, phone_number) 表示。

