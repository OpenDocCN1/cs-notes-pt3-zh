  md: "\n## Cascading Actions in Referential Integrity\n\n```sql\ncreate table course\
    \ (\n    course_id   char(5) primary key,\n    title        varchar(20),\n   \
    \ dept_name    varchar(20) references department\n)\n```\n\n```sql\ncreate table\
    \ course (\n    ...\n    dept_name varchar(20),\n    foreign key (dept_name) references\
    \ department\n                         on delete cascade\n                   \
    \      on update cascade,\n    ...\n)\n```\n\nAlternative actions to cascade:\
    \ set null, set default\n\n## Complex Check Clauses\n\n- check (time_slot_id in\
    \ (select time_slot_id from time_slot))\n  - Why not use a foreign key here?\n\
    - Every section has at least one instructor teaching the section.\n  - How to\
    \ write this?\n- Unfortunately: subquery in check clause not supported by pretty\
    \ much any database\n  - Alternative: triggers (later)\n- `create assertion <assertion-name>\
    \ check <predicate>;`\n  - Also not supported by anyone\n\n## 参照完整性中的违例及处理方式\n\
    \n## Trigger\n\n- \"Event-Condition-Action Rules\"\n  - When event occurs\n  -\
    \ Check condition; if true, do action\n\n```text\nCreate Trigger name\nBefore|After|Instead\
    \ Of events\n[ referencing-variables ]\n[ For Each Row ]\nWhen ( condition )\n\
    action\n```\n\nUse triggers on section and time_slot to enforce integrity constraints\n\
    \n```sql\nCreate Trigger timeslot_check1 after insert on section\nreferencing\
    \ new row as nrow\nfor each row\nwhen (nrow.time_slot_id not in (select time_slot_id\
    \ from time_slot))\nbegin\n    rollback\nend;\n```\n\n```sql\ncreate trigger timeslot_check2\
    \ after delete on time_slot\nreferencing old row as orow\nfor each row\nwhen (orow.time_slot_id\
    \ not in (\n                         select time_slot_id\n                   \
    \      from time_slot)\n     and orow.time_slot_id in (\n                    \
    \     select time_slot_id\n                         from section))\nbegin\n  \
    \  rollback\nend;\n```\n\n```sql\ncreate trigger credits_earned after update of\
    \ grade on takes\nreferencing new row as nrow\nreferencing old row as orow\nfor\
    \ each row\nwhen nrow.grade <> 'F' and nrow.grade is not null\n    and (orow.grade\
