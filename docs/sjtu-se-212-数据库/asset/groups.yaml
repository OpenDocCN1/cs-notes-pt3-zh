    \ Basic\n  - 其他 API 如 ADO.NET 构建在 ODBC 之上\n- JDBC（Java 数据库连接）适用于 Java\n\n## ODBC\n\
    - Open DataBase Connectivity(ODBC) 标准\n- 应用程序程序与数据库服务器通信的标准。\n- 应用程序程序接口 (API)\
