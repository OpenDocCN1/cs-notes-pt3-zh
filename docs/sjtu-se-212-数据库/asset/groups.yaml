    FROM    student s1,student s2\nWHERE   s1.sno = '95001' and\n        s1.age =\
    \ s2.age\n```\n\n?\n\n元组变量：s1,s2\n\n## DML：查询\n- join-expression :\n  table-expr.\
    \ join-operator table-expr. [ ON join-condition ]\n\n- join-operator :\n  [ KEY\
    \ | NATURAL ] [ join-type ] JOIN | CROSS JOIN\n\n- join-type :\n  INNER\n  | LEFT\
    \ [ OUTER ]\n  | RIGHT [ OUTER ]\n  | FULL [ OUTER ]\n\n## DML：查询，聚合\n统计软件学院男女生平均年龄及人数\n\
    \n```sql\nSELECT gende, AVG(age), COUNT(*)\nFROM student\nWHERE dept = 'SE'\n\
    GROUP BY dept, gende\n```\n\n## DML：查询，聚合\n- 容易混淆的问题\n  - Where? Having?\n  -\
