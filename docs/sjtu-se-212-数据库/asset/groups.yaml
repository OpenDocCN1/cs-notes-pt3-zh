    - File organization - optimize block access time by organizing the blocks to correspond\
    \ to how data will be accessed\n  - E.g. Store related information on the same\
    \ or nearby cylinders.\n  - Files may get fragmented over time\n    - E.g. if\
    \ data is inserted to/deleted from the file\n    - Or free blocks on disk are\
