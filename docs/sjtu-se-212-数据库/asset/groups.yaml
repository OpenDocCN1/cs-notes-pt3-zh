  - '[PAGE 281]


    # Lock & Transaction


    +   - A transaction may be granted a lock on an item if the requested lock is
    compatible with locks already held on the item by other transactions.

    +   - Any number of transactions can hold shared locks on an item,

    +     - but if any transaction holds an exclusive on the item no other transaction
    may hold any lock on the item.

    +   - If a lock cannot be granted, the requesting transaction is made to wait
    till all incompatible locks held by other transactions have been released. The
    lock is then granted.'
  - '[PAGE 282]


    # Lock


    | T₃ | T₄ |

    |---|---|

    | lock-x (B)

    read (B)

    B := B - 50

    write (B) | |

    | | lock-s (A)

    read (A)

    lock-s (B) |

    | lock-x (A) | |


    +   - Neither T₃ nor T₄ can make progress — executing lock-S(B) causes T₄ to wait
    for T₃ to release its lock on B, while executing lock-X(A) causes T₃ to wait for
    T₄ to release its lock on A.

    +   - Such a situation is called a deadlock.

    +     - To handle a deadlock one of T₃ or T₄ must be rolled back and its locks
    released.'
