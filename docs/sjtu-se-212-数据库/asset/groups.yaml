    ## 转换为关系模式


    - 实体集和联系集可以统一表示为关系模式，这些关系模式表示数据库的内容。

    - 符合 E-R 图的数据库可以由一组模式来表示。

    - 每个实体集和联系集都有一个唯一的模式，其名称被指定为相应实体集或联系集的名称。

    - 每个模式都有若干列（通常对应属性），这些列具有唯一的名称。


    ## 表示具有简单属性的实体集


    - 强实体集转换为具有相同属性的模式。

