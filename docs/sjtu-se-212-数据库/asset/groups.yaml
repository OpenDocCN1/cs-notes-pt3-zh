    ## Disk Subsystem\n\n- Disks usually connected directly to computer system\n-\
    \ In Storage Area Networks (SAN), a large number of disks are connected by a high-speed\
    \ network to a number of servers\n- In Network Attached Storage (NAS) networked\
    \ storage provides a file system interface using networked file system protocol,\
    \ instead of providing a disk system interface\n\n## Performance Measures (Cont.)\n\
    \n- Mean time to failure (MTTF) - the average time the disk is expected to run\
    \ continuously without any failure.\n  - Typically 3 to 5 years\n  - Probability\
    \ of failure of new disks is quite low, corresponding to a \"theoretical MTTF\"\
    \ of 500,000 to 1,200,000 hours for a new disk\n    - E.g., an MTTF of 1,200,000\
    \ hours for a new disk means that given 1000 relatively new disks, on an average\
    \ one will fail every 1200 hours\n  - MTTF decreases as disk ages\n\n## Optimization\
    \ of Disk-Block Access\n\n- **Block – a contiguous sequence of sectors from a\
    \ single track**\n  - data is transferred between disk and main memory in blocks\n\
    \  - **sizes range from 512 bytes to several kilobytes**\n    - Smaller blocks:\
    \ more transfers from disk\n    - Larger blocks: more space wasted due to partially\
    \ filled blocks\n    - Typical block sizes today range from 4 to 16 kilobytes\n\
    - Disk-arm-scheduling algorithms order pending accesses to tracks so that disk\
