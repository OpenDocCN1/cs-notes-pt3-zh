    \ lock on B, while executing lock-X(A) causes T₃ to wait for T₄ to release its\
    \ lock on A.\n- Such a situation is called a deadlock.\n  - To handle a deadlock\
    \ one of T₃ or T₄ must be rolled back and its locks released.\n\n# Isolation level\n\
    \n# 0 - Read uncommitted\n\n- Read permitted on row with or without write lock\n\
    - No read locks are applied\n- No guarantee that concurrent transaction will not\
    \ modify row or roll back changes to row\n- Corresponds to table hints NOLOCK\
    \ and READUNCOMMITTED\n- Allow dirty reads, non-repeatable reads, and phantom\
    \ rows\n\n# 1 - Read committed\n\n- Read only permitted on row with no write lock\n\
    - **Read lock acquired and held for read on current row only, but released when\
    \ cursor moves off the row**\n- No guarantee that data will not change during\
    \ transaction\n- Corresponds to table hint READCOMMITTED\n- Prevent dirty reads\n\
    - Allow non-repeatable reads and phantom rows\n\n# 2 - Repeatable\n\n- Read only\
    \ permitted on row with no write lock\n- Read lock acquired as each row in the\
    \ result set is read, and held until transaction ends\n- Corresponds to table\
    \ hint REPEATABLEREAD\n- Prevent dirty reads and non-repeatable reads\n- Allow\
    \ phantom rows\n\n# 3 - serializable\n\n- Read only permitted on rows in result\
    \ without write lock\n- Read locks acquired when cursor is opened and held until\
    \ transaction ends\n- Corresponds to table hints HOLDLOCK and SERIALIZABLE\n-\
    \ Prevent dirty reads, non-repeatable reads, and phantom rows\n\n# Isolation Level\n\
    \nConsistency\nLow                                                           \
    \      High\n\nIsolation Level 0\n\nIsolation Level 1\n\nIsolation Level 2\n\n\
    Isolation Level 3\n\nConcurrency\nHigh                                       \
    \                          Low\n\n# Recovery System\n\n# Failure Classification\n\
    \n- **Transaction failure:**\n  - Logical errors: transaction cannot complete\
    \ due to some *internal error* condition\n  - System errors: the database system\
    \ must terminate an active transaction due to an error condition (e.g., deadlock)\n\
    - **System crash:** a power failure or other hardware or software failure causes\
    \ the system to crash.\n- **Disk failure:** a head crash or similar disk failure\
    \ destroys all or part of disk storage\n\n# 恢复策略\n\n- 即使发生故障，仍需保持数据库的基本特性ACID\n\
    - 在正常事务处理时采取措施，保障有足够的信息可用于故障恢复；\n- 故障发生后，使数据库恢复到某一保证ACID的状态。\n\n# Classification\
    \ of Physical Storage Media\n\n- Speed with which data can be accessed\n- Cost\
    \ per unit of data\n- Reliability\n  - data loss on power failure or system crash\n\
    \  - physical failure of the storage device\n- Can differentiate storage into:\n\
    \  - volatile storage:\n    - loses contents when power is switched off\n  - non-volatile\
    \ storage:\n    - Contents persist even when power is switched off.\n    - Includes\
    \ secondary and tertiary storage, as well as batter-backed up main-memory.\n"
  mdcn: "\n\n# Schedule 4\n\n| T₁ | T₂ |\n|---|---|\n| read (A) <br> A := A - 50 <br>\
    \ <br> write (A) <br> read (B) <br> B := B + 50 <br> write (B) <br> commit | read\
    \ (A) <br> temp := A * 0.1 <br> A := A - temp <br> write (A) <br> read (B) <br>\
    \ <br> B := B + temp <br> write (B) <br> commit |\n\n此并发调度未保持 (A + B) 的值。\n\n\
    # Lock\n\n# 锁的机制\n\n- 共享锁（Shared）、排它锁（exclusive）\n\n|   | S | X |\n|---|---|---|\n\
    | S | true | false |\n| X | false | false |\n\n# Lock & Transaction\n\n- 如果请求的锁与其它事务已在该项目上持有的锁兼容，则可以向一个事务授予对该项目的锁。\n\
    - 任意数量的事务可以对一个项目持有共享锁，\n  - 但是如果有任何事务对该项目持有排他锁，则其它事务不得持有该项目上的任何锁。\n- 如果无法授予锁，则请求事务将被置于等待状态，直到其它事务持有的所有不兼容锁都被释放。随后授予该锁。\n\
    \n# Lock\n\n| T₃ | T₄ |\n|---|---|\n| lock-x (B) <br> read (B) <br> B := B - 50\
    \ <br> write (B) |  |\n|  | lock-s (A) <br> read (A) <br> lock-s (B) |\n| lock-x\
    \ (A) |  |\n\n- T₃ 和 T₄ 都无法取得进展——执行 lock-S(B) 会导致 T₄ 等待 T₃ 释放其对 B 的锁，而执行 lock-X(A)\
    \ 会导致 T₃ 等待 T₄ 释放其对 A 的锁。\n- 这种情况称为死锁。\n  - 为处理死锁，必须回滚 T₃ 或 T₄ 其中之一并释放其锁。\n\n\
    # Isolation level\n\n# 0 - Read uncommitted\n\n- 允许读取带有或不带写锁的行\n- 不应用读取锁\n- 不能保证并发事务不会修改行或回滚对行的更改\n\
    - 对应表提示 NOLOCK 和 READUNCOMMITTED\n- 允许脏读、不可重复读和幻行\n\n# 1 - Read committed\n\n\
    - 仅允许在没有写锁的行上读取\n- **读取锁在当前行读取时获取并持有，但在光标移离该行时释放**\n- 不能保证数据在事务期间不会发生变化\n- 对应表提示\
    \ READCOMMITTED\n- 防止脏读\n- 允许不可重复读和幻行\n\n# 2 - Repeatable\n\n- 仅允许在没有写锁的行上读取\n\
    - 读取锁在结果集中每读取一行时获取，并在事务结束前一直持有\n- 对应表提示 REPEATABLEREAD\n- 防止脏读和不可重复读\n- 允许幻行\n\
    \n# 3 - serializable\n\n- 仅允许在结果中没有写锁的行上读取\n- 读取锁在光标打开时获取，并在事务结束前一直持有\n- 对应表提示\
    \ HOLDLOCK 和 SERIALIZABLE\n- 防止脏读、不可重复读和幻行\n\n# Isolation Level\n\n一致性\n低    \
    \                                                             高\n\n隔离级别 0\n\n\
    隔离级别 1\n\n隔离级别 2\n\n隔离级别 3\n\n并发性\n高                                         \
    \                        低\n\n# Recovery System\n\n# Failure Classification\n\n\
    - **事务失败：**\n  - 逻辑错误：事务由于某些 *内部错误* 条件无法完成\n  - 系统错误：数据库系统必须由于错误条件终止活动事务（例如，死锁）\n\
    - **系统崩溃：** 断电或其他硬件或软件故障导致系统崩溃。\n- **磁盘故障：** 磁头崩溃或类似磁盘故障破坏全部或部分磁盘存储\n\n# 恢复策略\n\
    \n- 即使发生故障，仍需保持数据库的基本特性ACID\n- 在正常事务处理时采取措施，保障有足够的信息可用于故障恢复；\n- 故障发生后，使数据库恢复到某一保证ACID的状态。\n\
    \n# Classification of Physical Storage Media\n\n- 数据可访问的速度\n- 每单位数据的成本\n- 可靠性\n\
    \  - 断电或系统崩溃时的数据丢失\n  - 存储设备的物理故障\n- 可将存储区分成：\n  - 易失性存储：\n    - 断电时丢失内容\n  -\
    \ 非易失性存储：\n    - 即使断电内容仍然持久。\n    - 包括二级和三级存储，以及带电池备份的主存储。\n\n"
