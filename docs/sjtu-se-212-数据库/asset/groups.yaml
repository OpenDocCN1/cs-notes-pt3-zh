    - Reduction to Relation Schemas\n- Database Design\n- UML\n\n## Modeling\n\n-\
    \ A *database* can be modeled as:\n  - a collection of entities,\n  - relationship\
    \ among entities.\n- An *entity* is an object that exists and is distinguishable\
    \ from other objects.\n  - Example: specific person, company, event, plant\n-\
    \ Entities have *attributes*\n  - Example: people have names and addresses\n-\
    \ An *entity set* is a set of entities of the same type that share the same properties.\n\
    \  - Example: set of all persons, companies, trees, holidays\n\n## Entity Sets\
    \ instructor and student\n\n| instructor_ID | instructor_name |\n|---|---|\n|\
    \ 76766 | Crick |\n| 45565 | Katz |\n| 10101 | Srinivasan |\n| 98345 | Kim |\n\
    | 76543 | Singh |\n| 22222 | Einstein |\n\ninstructor\n\n| student-ID | student_name\
    \ |\n|---|---|\n| 98988 | Tanaka |\n| 12345 | Shankar |\n| 00128 | Zhang |\n|\
    \ 76543 | Brown |\n| 76653 | Aoi |\n| 23121 | Chavez |\n| 44553 | Peltier |\n\n\
    student\n\n## Relationship Set advisor\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_142_0.png)\n\
    \ninstructor\n\nstudent\n\n## Relationship Sets (Cont.)\n\n- An *attribute* can\
    \ also be property of a relationship set.\n- For instance, the *advisor* relationship\
    \ set between entity sets *instructor* and *student* may have the attribute *date*\
    \ which tracks when the student started being associated with the advisor\n\n\
    ![](img/5285b20d8f5a79969a3f150d38beebfc_143_0.png)\n\n## Degree of a Relationship\
    \ Set\n\n- **binary relationship**\n  - involve two entity sets (or degree two).\n\
    \  - most relationship sets in a database system are binary.\n- Relationships\
    \ between more than two entity sets are rare. Most relationships are binary. (More\
    \ on this later.)\n  - Example: students work on research projects under the guidance\
    \ of an instructor.\n  - relationship proj_guide is a ternary relationship between\
    \ instructor, student, and project\n\n## Attributes\n\n- An entity is represented\
    \ by a set of attributes, that is descriptive properties possessed by all members\
    \ of an entity set.\n- Example:\n  - instructor = (ID, name, street, city, salary)\n\
    \  - course = (course_id, title, credits)\n\nDomain – the set of permitted values\
    \ for each attribute\n\nAttribute types:\n\nSimple and composite attributes.\n\
    \nSingle-valued and multivalued attributes\n\nExample: multivalued attribute:\
    \ phone_numbers\n\nDerived attributes\n\nCan be computed from other attributes\n\
    \nExample: age, given date_of_birth\n"
  mdcn: "\n\n## JDBC\n\n- JDBC 是用于与支持 SQL 的数据库系统通信的 Java API。\n- JDBC 支持多种用于查询和更新数据以及检索查询结果的功能。\n\
    - JDBC 还支持元数据检索，例如查询数据库中存在的关系以及关系属性的名称和类型。\n- 与数据库通信的模型：\n  - 打开连接\n  - 创建一个“statement”对象\n\
    \  - 使用 Statement 对象执行查询以发送查询并获取结果\n  - 异常机制用于处理错误\n\n## SQLCA\n\n## SQL 通信区\n\
    \n- 是内存中的一个区域，用于在每次数据库请求时在应用程序与数据库服务器之间以及返回应用程序时传递统计信息和错误。\n- SQLCA 用作应用程序到数据库通信链路的句柄。它被传递给所有需要与数据库服务器通信的数据库库函数。它在所有嵌入式\
    \ SQL 语句上隐式传递。\n\n## SQLCA 字段\n\n- **sqlcode** 一个 32 位整数，用于在数据库在请求上检测到错误时指定错误代码。\n\
    - 错误代码的定义可以在头文件 `sqlerr.h` 中找到。\n  - 错误代码为 0 表示操作成功\n  - 100 表示未找到行\n  - 正数为警告\n\
    \  - 负数为错误。\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_137_0.png)\n\n## 第 7 章：实体-关系模型\n\
    \n## 第 7 章：实体关系模型\n\n- 设计过程\n- 建模\n- 约束\n- E-R 图\n- 设计问题\n- 弱实体集\n- 扩展 E-R 特性\n\
    - 银行数据库设计\n- 归约为关系模式\n- 数据库设计\n- UML\n\n## 建模\n\n- *数据库* 可以建模为：\n  - 一组实体，\n \
    \ - 实体之间的关系。\n- *实体* 是存在且可与其他对象区分的对象。\n  - 示例：特定的人、公司、事件、工厂\n- 实体具有 *属性*\n  -\
    \ 示例：人们拥有姓名和地址\n- *实体集* 是具有相同属性的同类型实体的集合。\n  - 示例：所有人、公司、树、假期的集合\n\n## 实体集 instructor\
    \ 和 student\n\n| instructor_ID | instructor_name |\n|---|---|\n| 76766 | Crick\
    \ |\n| 45565 | Katz |\n| 10101 | Srinivasan |\n| 98345 | Kim |\n| 76543 | Singh\
    \ |\n| 22222 | Einstein |\n\ninstructor\n\n| student-ID | student_name |\n|---|---|\n\
    | 98988 | Tanaka |\n| 12345 | Shankar |\n| 00128 | Zhang |\n| 76543 | Brown |\n\
    | 76653 | Aoi |\n| 23121 | Chavez |\n| 44553 | Peltier |\n\nstudent\n\n## 关系集\
    \ advisor\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_142_0.png)\n\ninstructor\n\
    \nstudent\n\n## 关系集（续）\n\n- 一个 *属性* 也可以是关系集的属性。\n- 例如，实体集 *instructor* 和 *student*\
    \ 之间的 *advisor* 关系集可能具有属性 *date*，用于跟踪学生何时开始与导师关联\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_143_0.png)\n\
    \n## 关系集的度数\n\n- **二元关系**\n  - 涉及两个实体集（或度为二）。\n  - 大多数数据库系统中的关系集是二元的。\n- 两个以上实体集之间的关系很少见。大多数关系是二元的。（稍后会详细介绍。）\n\
    \  - 示例：学生在讲师的指导下从事研究项目。\n  - 关系 proj_guide 是 instructor、student 和 project 之间的三元关系\n\
    \n## 属性\n\n- 实体由一组属性表示，即实体集中所有成员所具有的描述性属性。\n- 示例：\n  - instructor = (ID, name,\
    \ street, city, salary)\n  - course = (course_id, title, credits)\n\n域 – 每个属性的允许值集合\n\
    \n属性类型：\n\n简单和复合属性。\n\n单值和多值属性\n\n示例：多值属性：phone_numbers\n\n派生属性\n\n可以从其他属性计算得出\n\
    \n示例：age，由 date_of_birth 给出\n\n"
