    \   - Sequential access to a fragmented file results in increased disk arm movement\n\
    \  - Some systems have utilities to defragment the file system, in order to speed\
    \ up file access\n\n## Optimization of Disk Block Access(Cont.)\n\n- Nonvolatile\
    \ write buffers speed up disk writes by writing blocks to a non-volatile RAM buffer\
    \ immediately\n  - Non-volatile RAM: battery backed up RAM or flash memory\n \
    \   - Even if power fails, the data is safe and will be written to disk when power\
    \ returns\n  - Controller then writes to disk whenever the disk has no other requests\
    \ or request has been pending for some time\n  - Database operations that require\
    \ data to be safely stored before continuing can continue without waiting for\
    \ data to be written to disk\n  - Writes can be reordered to minimize disk arm\
    \ movement\n"
  mdcn: "\n\n## 磁盘（续）\n\n- 早期世代的磁盘容易发生磁头碰撞\n  - 早期世代磁盘的表面具有金属氧化物涂层，磁头碰撞时会分解并损坏磁盘上的所有数据\n\
    \  - 当前世代的磁盘不易发生此类灾难性故障，尽管单个扇区可能会损坏\n\n## 磁盘（续）\n\n- 磁盘控制器 – 在计算机系统与磁盘驱动硬件之间进行接口。\n\
    \  - 接受读取或写入扇区的[content]\n\n## 磁盘（续）\n\n- 早期世代的磁盘容易发生磁头碰撞\n  - 早期世代磁盘的表面具有金属氧化物涂层，磁头碰撞时会分解并损坏磁盘上的所有数据\n\
    \  - 当前世代的磁盘不易发生此类灾难性故障，尽管单个扇区可能会损坏\n\n## 磁盘（续）\n\n- 磁盘控制器 – 在计算机系统与磁盘驱动硬件之间进行接口。\n\
    \  - 接受读取或写入扇区的高级命令\n  - 启动诸如将磁盘臂移动到正确磁道以及实际读取或写入数据的操作\n  - 为每个扇区计算并附加校验和以验证数据是否正确读回\n\
    \    - 如果数据损坏，则存储的校验和与重新计算的校验和不匹配的概率非常高\n  - 通过在写入后重新读取扇区来确保写入成功\n  - 执行坏扇区的重映射\n\
    \n## 磁盘子系统\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_309_0.png)\n\n- 多个磁盘通过控制器连接到计算机系统\n\
    \  - 控制器功能（校验和、坏扇区重映射）通常由单个磁盘执行；减轻控制器负载\n- 磁盘接口标准系列\n  - ATA（AT 适配器）标准范围\n  -\
    \ SATA（串行 ATA）\n  - SCSI（小型计算机系统接口）标准范围\n  - SAS（串行连接 SCSI）\n  - 每种标准的多个变体（不同的速度和功能）\n\
    \n## 磁盘子系统\n\n- 磁盘通常直接连接到计算机系统\n- 在存储区域网络（SAN）中，大量磁盘通过高速网络连接到多个服务器\n- 在网络附加存储（NAS）中，网络存储使用网络文件系统协议提供文件系统接口，而不是提供磁盘系统接口\n\
    \n## 性能指标（续）\n\n- 平均故障间隔时间（MTTF）- 磁盘预计连续运行而不发生任何故障的平均时间。\n  - 通常为 3 至 5 年\n  -\
    \ 新磁盘的故障概率相当低，对应于新磁盘的“理论 MTTF”为 500,000 至 1,200,000 小时\n    - 例如，新磁盘的 MTTF 为 1,200,000\
    \ 小时意味着在 1000 个相对较新的磁盘中，平均每 1200 小时就会有一个发生故障\n  - 随着磁盘老化，MTTF 会下降\n\n## 磁盘块访问优化\n\
    \n- **块 – 来自单个磁道的连续扇区序列**\n  - 数据以块的形式在磁盘和主内存之间传输\n  - **大小范围从 512 字节到数千字节**\n\
    \    - 块越小：从磁盘传输次数越多\n    - 块越大：由于部分填充的块而浪费的空间越多\n    - 当今典型的块大小范围从 4 到 16 千字节\n\
    - 磁盘臂调度算法对挂起的磁道访问进行排序，以使磁盘臂移动最小化\n\n## 磁盘块访问优化（续）\n\n- 文件组织 - 通过组织块以对应于数据将被访问的方式来优化块访问时间\n\
    \  - 例如。将相关信息存储在同一或相邻的柱面上。\n  - 文件可能会随着时间的推移而碎片化\n    - 例如。如果向文件插入/从文件中删除数据\n\
    \    - 或磁盘上的空闲块分散，新创建的文件其块分散在磁盘上\n    - 对碎片化文件的顺序访问会导致磁盘臂移动增加\n  - 一些系统具有用于整理文件系统的实用程序，以加快文件访问速度\n\
    \n## 磁盘块访问优化（续）\n\n- 非易失性写缓冲区通过立即将块写入非易失性 RAM 缓冲区来加快磁盘写入速度\n  - 非易失性 RAM：带电池备份的\
    \ RAM 或闪存\n    - 即使断电，数据也是安全的，并在电源恢复时写入磁盘\n  - 控制器然后在磁盘没有其他请求或请求已挂起一段时间时写入磁盘\n\
    \  - 需要在继续之前安全存储数据的数据库操作可以继续，而无需等待数据写入磁盘\n  - 可以重新排序写入以最小化磁盘臂移动\n\n"
