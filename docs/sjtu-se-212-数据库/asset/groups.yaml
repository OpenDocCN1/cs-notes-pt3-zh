- raw:
  - '[PAGE 316]


    # Optimization of Disk Block Access(Cont.)


    +   - Log disk – a disk devoted to writing a sequential log of block updates

    +     - Used exactly like nonvolatile RAM

    +       - Write to log disk is very fast since no seeks are required

    +       - No need for special hardware (NV-RAM)

    +   - File systems typically reorder writes to disk to improve performance

    +     - Journaling file systems write data in safe order to NV-RAM or log disk

    +     - Reordering without journaling: risk of corruption of file system data'
  - '[PAGE 317]


    # Flash Storage


    +   - NOR flash vs NAND flash

    +   - NAND flash

    +     - used widely for storage, since it is much cheaper than NOR flash

    +     - requires page-at-a-time read (page: 512 bytes to 4 KB)

    +     - transfer rate around 20 MB/sec

    +     - solid state disks: use multiple flash storage devices to provide higher
    transfer rate of 100 to 200 MB/sec'
  - '[PAGE 318]


    # Flash Storage


    +   - NOR flash vs NAND flash

    +   - NAND flash

    +     - erase is very slow (1 to 2 millisecs)

    +       - erase block contains multiple pages

    +       - remapping of logical page addresses to physical page addresses avoids
    waiting for erase

    +         - translation table tracks mapping

    +           - also stored in a label field of flash page

    +         - remapping carried out by flash translation layer

    +       - after 100,000 to 1,000,000 erases, erase block becomes unreliable and
    cannot be used

    +         - wear leveling'
  - '[PAGE 319]


    # Example of Data Access


    ![](img/5285b20d8f5a79969a3f150d38beebfc_319_0.png)'
  - '[PAGE 320]


    # Data Access


    +   - **Physical blocks** are those blocks residing on the disk.

    +   - **Buffer blocks** are the blocks residing temporarily in main memory.

    +   - Block movements between disk and main memory are initiated through the following
    two operations:

    +     - **input(B)** transfers the physical block B to main memory.

    +     - **output(B)** transfers the buffer block B to the disk, and replaces the
    appropriate physical block there.'
  - '[PAGE 321]


    # # Data Access


    +   - Each transaction Ti has its private work-area in which local copies of all
    data items accessed and updated by it are kept.

    +     - Ti''s local copy of a data item X is called xi.

    +   - We assume, for simplicity, that each data item fits in, and is stored inside,
    a single block.'
  - '[PAGE 322]


    # Data Access (Cont.)


    +   - Transaction transfers data items between system buffer blocks and its private
    work-area using the following operations:

    +     - read(X) assigns the value of data item X to the local variable xi.

    +     - write(X) assigns the value of local variable xi to data item {X} in the
    buffer block.

    +     - Both these commands may necessitate the issue of an input(BX) instruction
    before the assignment, if the block BX in which X resides is not already in memory.'
  - '[PAGE 323]


    # Data Access (Cont.)


    +   - Transactions

    +     - Perform read(X) while accessing X for the first time;

    +     - All subsequent accesses are to the local copy.

    +     - After last access, transaction executes write(X).

    +   - output(BX) need not immediately follow write(X). System can perform the
    output operation when it deems fit.'
  - '[PAGE 324]


    # 基于Log的备份


    +   - To ensure atomicity despite failures, we first output information describing
    the modifications to stable storage without modifying the database itself.

    +   - log-based recovery'
  - '[PAGE 325]


    # 基于Log的恢复


    +   - A **log** is kept on stable storage.

    +     - The log is a sequence of **log records**, and maintains a record of update
    activities on the database

    +   - Two approaches using logs

    +     - Deferred database modification

    +     - Immediate database modification'
