    \n## FD\n\nLet R be a relation schema\nα ⊆ R and β ⊆ R\n\nThe functional dependency\
    \ α → β holds on R if and only if for any legal relations r(R), whenever any two\
    \ tuples t₁ and t₂ of r agree on the attributes α, they also agree on the attributes\
    \ β.\n\nThat is,\n\nt₁[α] = t₂ [α]\nt₁[β] = t₂ [β]\n\n## FD, Example\n\n- Consider\
    \ r ( A, B ) with the following instance of r.\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_243_0.png)\n\
    \n- On this instance, A → B does NOT hold, but B → A does hold\n\n- FD实质是约束，描述属性间的约束\n\
    \n## FD, Example\n\n- Stu(sno,sname,age,gende,ID,dept,cno,cname,grade)\n\n## Key\n\
    \n- K ⊆ R\n\n- K is a superkey for relation schema R if and only if K → R\n\n\
    - K is a candidate key for R if and only if\n  - K → R, and\n  - for no K' ⊂ K,\
    \ K' → R\n\n## Trivial(平凡) FD\n\n- A functional dependency is **trivial** if it\
    \ is satisfied by all instances of a relation\n\n- Example:\n\nID, name → ID\n\
    \n- In general, α → β is trivial if β ⊆ α\n\n## Armstrong's Axioms\n\n- if β ⊆\
    \ α, then α → β （自反律）\n- if α → β, then γα → γβ （增补律）\n- if α → β, and β → γ,\
    \ then α → γ （传递律）\n\n- Additional rules:\n  - If α → β and α → γ, then α → βγ\
    \ （合并律）\n  - If α → βγ, then α → β and α → γ （分解律）\n  - If α → β and γβ → δ, then\
    \ αγ → δ （伪传递律）\n\n## Closure(闭包)\n\n- 根据相关定理，找出已知的FD所蕴涵的函数依赖\n  - 函数依赖集的闭包\n\
    \  - 属性的闭包\n\n## Normal Form\n\n- 1NF\n- 2NF\n- 3NF\n- BCNF\n\n## NF的分解\n\n- 分解的要求\n\
    \  - Lossless-join decomposition\n    $R_1 \\cap R_2 \\rightarrow R_1$\n    $R_1\
    \ \\cap R_2 \\rightarrow R_2$\n  - Dependency preserving\n    $(F_1 \\cup F_2\
    \ \\cup \\cdots \\cup F_n)^+ = F^+$\n  - NF要求\n\n## Canonincal Cover(正则覆盖)\n\n\
    - a canonical cover of F is a **“minimal”** set of functional dependencies equivalent\
    \ to F, having no redundant dependencies or redundant parts of dependencies\n\
    - Canonical Cover的特征\n  - 左边是唯一的，右边多属性合并\n  - 两边均不含无关属性(extraneous)\n- 用于校验依赖保持\n\
    \n## 无关属性的判断\n\n- For\n- To test if attribute A is extraneous in α → β\n  1. compute\
    \ (α - A)+ using the dependencies in F\n  2. check that (α - A)+ contains β; if\
    \ it does, A is extraneous in α\n- To test if attribute A is extraneous in α →\
    \ β\n  1. compute β+ using only the dependencies in F' = (F - {α → β}) ∪ {(α -\
    \ A) → β}.\n  2. check that β+ contains A; if it does, A is extraneous in β\n\n\
    ## Canonical Cover(正则覆盖)\n\n- R = (A, B, C)\n  F = {A → BC, B → C, A → B, AB →\
    \ C}\n- F = {A → BC, B → C, AB → C}\n- F = {A → BC, B → C}\n- F = {A → B, B →\
    \ C}\n\n## 范式分解\n\n1) For R，求Key，找出违反范式要求的FD，A → B;\n2) 求A⁺\n3) R1 = {A⁺} √\n\
    \   R2 = {A ∪ ( R - A⁺ )}\n4) 对R2重复1-3，直至均满足范式要求\n\n- R1 ∩ R2 ⊆ R1, 无损连接\n- 验证\
    \ (F₁ F₂ ... Fₙ)⁺ = F⁺\n- 亦可验证Fc\n\n## 范式分解\n\nR = (A, B, C)\nF = {A→B, B→C}\n\
    \nCan be decomposed in two different ways\n\n- R1 = (A, B),    R2 = (B, C)\n\n\
    Lossless-join decomposition:\n\nR1 ∩ R2 = {B} and B→BC\n\nDependency preserving\n\
    \n- R1 = (A, B),    R2 = (A, C)\n\nLossless-join decomposition:\n\nR1 ∩ R2 = {A}\
    \ and A→AB\n\nNot dependency preserving\n(cannot check B→C without computing R1\
    \ ⋈ R2)\n"
  mdcn: "\n\n## 图 7.26\n## ER 图表示法\n## 在 UML 中的等价表示\n\nE 具有属性的实体（简单、复合、多值、派生）\n\n\
    E 具有简单属性和方法 的类（属性前缀：+ = 公有，– = 私有，# = 保护） –A1 +M10\n\nE1 role1 R role2 E2 二元关系\n\
    \nE1 role1 R role2 E2\n\nA1 关系属性\n\nR A1\n\nE1 role1 role2 E2\n\nE1 role1 role2\
    \ E2\n\nE1 0..* R 0..1 E2 基数约束\n\nE1 0..1 R 0..* E2\n\nE1 R E2 E3 n 元关系\n\nE1\
    \ R E2 E3\n\nE1 E2 E3 重叠的概括\n\nE1 E2 E3 重叠\n\nE1 E2 E3 不相交的概括\n\nE1 E2 E3 不相交\n\
    \n## 图 7.27\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_236_0.png)\n\n(a)\n\n\
    ![](img/5285b20d8f5a79969a3f150d38beebfc_236_1.png)\n\n(b)\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_236_2.png)\n\
    \n(c)\n\n## 图 7.29\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_238_0.png)\n\n\
    ## 关系数据库设计\n\n## 不良设计\n\n- 设计“异常”\n  - 例如. student-course\n  - 冗余\n  - 更新异常\n\
    \  - 删除异常\n\n## FD\n\n设 R 为关系模式\nα ⊆ R 且 β ⊆ R\n\n函数依赖 α → β 在 R 上成立当且仅当对于 R 的任意合法关系\
    \ r(R)，每当 r 的任意两个元组 t₁ 和 t₂ 在属性 α 上一致时，它们也在属性 β 上一致。\n\n即，\n\nt₁[α] = t₂ [α]\n\
    t₁[β] = t₂ [β]\n\n## FD，示例\n\n- 考虑 r ( A, B ) 具有 r 的以下实例。\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_243_0.png)\n\
    \n- 在此实例上，A → B 不成立，但 B → A 成立\n\n- FD 本质是约束，描述属性间的约束\n\n## FD，示例\n\n- Stu(sno,sname,age,gende,ID,dept,cno,cname,grade)\n\
    \n## 键\n\n- K ⊆ R\n\n- K 是关系模式 R 的超键当且仅当 K → R\n\n- K 是 R 的候选键当且仅当\n  - K → R,\
    \ 且\n  - 对于任意 K' ⊂ K，K' → R 不成立\n\n## 平凡 FD\n\n- 函数依赖如果对关系的任意实例都成立，则为 **平凡** 的\n\
    \n- 示例：\n\nID, name → ID\n\n- 一般地，α → β 如果 β ⊆ α 则为平凡\n\n## Armstrong 公理\n\n-\
    \ 若 β ⊆ α，则 α → β （自反律）\n- 若 α → β，则 γα → γβ （增补律）\n- 若 α → β，且 β → γ，则 α → γ\
    \ （传递律）\n\n- 附加规则：\n  - 若 α → β 且 α → γ，则 α → βγ （合并律）\n  - 若 α → βγ，则 α → β 且\
    \ α → γ （分解律）\n  - 若 α → β 且 γβ → δ，则 αγ → δ （伪传递律）\n\n## 闭包\n\n- 根据相关定理，找出已知的\
    \ FD 所蕴含的函数依赖\n  - 函数依赖集的闭包\n  - 属性的闭包\n\n## 范式\n\n- 1NF\n- 2NF\n- 3NF\n- BCNF\n\
    \n## NF 的分解\n\n- 分解的要求\n  - 无损连接分解\n    $R_1 \\cap R_2 \\rightarrow R_1$\n   \
    \ $R_1 \\cap R_2 \\rightarrow R_2$\n  - 依赖保持\n    $(F_1 \\cup F_2 \\cup \\cdots\
    \ \\cup F_n)^+ = F^+$\n  - NF 要求\n\n## 正则覆盖\n\n- F 的一个正则覆盖是与 F 等价的 **“最小”** 函数依赖集合，没有冗余的依赖或依赖的冗余部分\n\
    - 正则覆盖的特征\n  - 左边是唯一的，右边多属性合并\n  - 两边均不含无关属性(extraneous)\n- 用于校验依赖保持\n\n## 无关属性的判断\n\
    \n- For\n- 测试属性 A 在 α → β 中是否无关\n  1. 使用 F 中的依赖计算 (α - A)+\n  2. 检查 (α - A)+ 是否包含\
    \ β；如果包含，则 A 在 α 中无关\n- 测试属性 A 在 α → β 中是否无关\n  1. 使用仅 F' = (F - {α → β}) ∪ {(α\
    \ - A) → β} 中的依赖计算 β+\n  2. 检查 β+ 是否包含 A；如果包含，则 A 在 β 中无关\n\n## 正则覆盖\n\n- R =\
    \ (A, B, C)\n  F = {A → BC, B → C, A → B, AB → C}\n- F = {A → BC, B → C, AB →\
    \ C}\n- F = {A → BC, B → C}\n- F = {A → B, B → C}\n\n## 范式分解\n\n1) 对 R，求 Key，找出违反范式要求的\
    \ FD，A → B;\n2) 求 A⁺\n3) R1 = {A⁺} √\n   R2 = {A ∪ ( R - A⁺ )}\n4) 对 R2 重复 1-3，直至均满足范式要求\n\
    \n- R1 ∩ R2 ⊆ R1, 无损连接\n- 验证 (F₁ F₂ ... Fₙ)⁺ = F⁺\n- 亦可验证 Fc\n\n## 范式分解\n\nR =\
    \ (A, B, C)\nF = {A→B, B→C}\n\n可以分解为两种不同方式\n\n- R1 = (A, B),    R2 = (B, C)\n\n\
    无损连接分解：\n\nR1 ∩ R2 = {B} 且 B→BC\n\n依赖保持\n\n- R1 = (A, B),    R2 = (A, C)\n\n无损连接分解：\n\
    \nR1 ∩ R2 = {A} 且 A→AB\n\n不依赖保持\n（无法在不计算 R1 ⋈ R2 的情况下检查 B→C）\n\n"
