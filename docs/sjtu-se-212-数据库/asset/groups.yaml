  mdcn: "\n\n## 磁盘块访问的优化（续）\n\n- 日志磁盘——专门用于按顺序写入块更新日志的磁盘\n  - 其用途与非易失性RAM完全相同\n  \
    \  - 由于无需寻道，写入日志磁盘的速度非常快\n    - 无需特殊硬件（NV-RAM）\n- 文件系统通常会重新排序对磁盘的写入以提高性能\n  -\
    \ 日志文件系统将数据按安全顺序写入NV-RAM或日志磁盘\n  - 无日志情况下的重排序：可能导致文件系统数据损坏\n\n## 闪存存储\n\n- NOR闪存\
    \ 与 NAND闪存 的对比\n- NAND闪存\n  - 广泛用于存储，因为它比NOR闪存便宜得多\n  - 需要按页读取（页大小：512字节到4 KB）\n\
    \  - 传输速率约为20 MB/秒\n  - 固态硬盘：使用多个闪存存储设备以提供100到200 MB/秒的更高传输速率\n  - 擦除操作非常慢（1到2毫秒）\n\
    \    - 擦除块包含多个页\n      - 将逻辑页地址重映射到物理页地址可避免等待擦除\n        - 转换表跟踪映射关系\n       \
    \   - 同时也存储在闪存页的标签字段中\n        - 重映射由闪存转换层执行\n      - 经过10万到100万次擦除后，擦除块将变得不可靠且无法使用\n\
    \        - 磨损均衡\n\n## 数据访问示例\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_319_0.png)\n\
    \n## 数据访问\n\n- **物理块**是驻留在磁盘上的块。\n- **缓冲块**是暂时驻留在主内存中的块。\n- 磁盘与主内存之间的块移动通过以下两个操作发起：\n\
    \  - **input(B)** 将物理块B传输到主内存。\n  - **output(B)** 将缓冲块B传输到磁盘，并替换那里的相应物理块。\n- 每个事务Ti都有其私有工作区，其中保存了它所访问和更新的所有数据项的本地副本。\n\
    \  - Ti对数据项X的本地副本称为xi。\n- 为简单起见，我们假设每个数据项都适合存储在一个单独的块中。\n\n## 数据访问（续）\n\n- 事务使用以下操作在系统缓冲块与其私有工作区之间传输数据项：\n\
    \  - read(X) 将数据项X的值赋给局部变量xi。\n  - write(X) 将局部变量xi的值赋给缓冲块中的数据项X。\n  - 如果X所在的块BX尚未在内存中，这两个命令都可能在赋值之前需要发出input(BX)指令。\n\
    - 事务\n  - 在首次访问X时执行read(X)；\n  - 所有后续访问均针对本地副本。\n  - 在最后一次访问之后，事务执行write(X)。\n\
    - output(BX) 不必紧跟在write(X)之后。系统可以在其认为合适的时候执行输出操作。\n\n## 基于日志的备份\n\n- 为了在发生故障时确保原子性，我们首先将描述修改的信息输出到稳定存储器，而不修改数据库本身。\n\
    - 基于日志的恢复\n\n## 基于日志的恢复\n\n- **日志**保存在稳定存储器上。\n  - 日志是一系列**日志记录**，维护数据库上的更新活动记录。\n\
    - 使用日志的两种方法\n  - 延迟数据库修改\n  - 立即数据库修改\n\n### 延迟数据库修改\n\n(a)\n\n```txt\n<T0 start>\n\
    <T0, A, 950>\n<T0, B, 2050>\n```\n\n(b)\n\n```txt\n<T0 start>\n<T0, A, 950>\n\
    <T0, B, 2050>\n<T0 commit>\n<T1 start>\n<T1, C, 600>\n```\n\n(c)\n\n```txt\n<T0\
    \ start>\n<T0, A, 950>\n<T0, B, 2050>\n<T0 commit>\n<T1 start>\n<T1, C, 600>\n\
    <T1 commit>\n```\n\n### 立即数据库修改\n\n(a)\n\n```txt\n⟨T₀ start⟩\n⟨T₀, A, 1000, 950⟩\n\
    ⟨T₀, B, 2000, 2050⟩\n```\n\n(b)\n\n```txt\n⟨T₀ start⟩\n⟨T₀, A, 1000, 950⟩\n⟨T₀,\
    \ B, 2000, 2050⟩\n⟨T₀ commit⟩\n⟨T₁ start⟩\n⟨T₁, C, 700, 600⟩\n```\n\n(c)\n\n```txt\n\
    ⟨T₀ start⟩\n⟨T₀, A, 1000, 950⟩\n⟨T₀, B, 2000, 2050⟩\n⟨T₀ commit⟩\n⟨T₁ start⟩\n\
    ⟨T₁, C, 700, 600⟩\n⟨T₁ commit⟩\n```\n\n"
