    \ and generalization are simple inversions of each other; they are represented\
    \ in an E-R diagram in the same way.\n- The terms specialization and generalization\
    \ are used interchangeably.\n\n## Specialization and Generalization (Cont.)\n\n\
    - Can have multiple specializations of an entity set based on different features.\n\
    - E.g., `permanent_employee` vs. `temporary_employee`, in addition to `instructor`\
    \ vs. `secretary`\n- Each particular employee would be\n  - a member of one of\
    \ `permanent_employee` or `temporary_employee`,\n  - and also a member of one\
    \ of `instructor`, `secretary`\n- The ISA relationship also referred to as **superclass\
    \ – subclass** relationship\n\n## Design Constraints on a Specialization/Generalization\n\
    \n- Constraint on which entities can be members of a given lower-level entity\
    \ set.\n  - condition-defined\n    - Example: all customers over 65 years are\
    \ members of senior-citizen entity set; senior-citizen ISA person.\n  - user-defined\n\
    - Constraint on whether or not entities may belong to more than one lower-level\
    \ entity set within a single generalization.\n  - Disjoint\n    - an entity can\
    \ belong to only one lower-level entity set\n    - Noted in E-R diagram by having\
    \ multiple lower-level entity sets link to the same triangle\n  - Overlapping\n\
    \    - an entity can belong to more than one lower-level entity set\n\n## Design\
    \ Constraints on a Specialization/Generalization (Cont.)\n\n- **Completeness constraint**\
    \ -- specifies whether or not an entity in the higher-level entity set must belong\
    \ to at least one of the lower-level entity sets within a generalization.\n  -\
    \ **total**: an entity must belong to one of the lower-level entity sets\n  -\
    \ **partial**: an entity need not belong to one of the lower-level entity sets\n\
    \n## Aggregation\n\n- Consider the ternary relationship proj_guide, which we saw\
    \ earlier\n- Suppose we want to record evaluations of a student by a guide on\
    \ a project\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_193_0.png)\n\n## Aggregation\
    \ (Cont.)\n\n- Relationship sets eval_for and proj_guide represent overlapping\
    \ information\n  - Every eval_for relationship corresponds to a proj_guide relationship\n\
    \  - However, some proj_guide relationships may not correspond to any eval_for\
    \ relationships\n    - So we can't discard the proj_guide relationship\n- Eliminate\
    \ this redundancy via aggregation\n  - Treat relationship as an abstract entity\n\
    \  - Allows relationships between relationships\n  - Abstraction of relationship\
    \ into new entity\n\n## Aggregation (Cont.)\n\nWithout introducing redundancy,\
    \ the following diagram represents:\n\n- A student is guided by a particular instructor\
    \ on a particular project\n- A student, associated e\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_195_0.png)\n\
    \n## Representing Specialization via Schemas\n\n- Method 1:\n  - Form a schema\
    \ for the higher-level entity\n  - Form a schema for each lower-level entity set,\
    \ include primary key of higher-level entity set and local attributes\n  - Drawback:\
    \ getting information about, an employee requires accessing two relations, the\
    \ one corresponding to the low-level schema and the one corresponding to the high-level\
    \ schema\n\n| schema | attributes |\n|---|---|\n| person | ID, name, street, city\
    \ |\n| student | ID, tot_cred |\n| employee | ID, salary |\n\n## Representing\
    \ Specialization as Schemas (Cont.)\n\n- **Method 2:**\n  - Form a schema for\
    \ each entity set with all local and inherited attributes\n\n| schema | attributes\
    \ |\n|---|---|\n| person | ID, name, street, city |\n| student | ID, name, street,\
    \ city, tot_cred |\n| employee | ID, name, street, city, salary |\n\n- If specialization\
    \ is total, the schema for the generalized entity set (person) not required to\
    \ store information\n- Can be defined as a “view” relation containing union of\
    \ specialization relations\n- But explicit schema may still be needed for foreign\
    \ key constraints\n- Drawback: *name*, *street* and *city* may be stored redundantly\
    \ for people who are both students and employees\n\n| schema | attributes |\n\
    |---|---|\n| person | ID, name, street, city |\n| student | ID, name, street,\
    \ city, tot_cred |\n| employee | ID, name, street, city, salary |\n"
  mdcn: "\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_189_0.png)\n\n## 扩展ER特性：泛化\n\
    \n- **自底向上的设计过程** – 将多个具有相同特征的实体集组合成一个更高层的实体集。\n- 特化和泛化互为简单的逆过程；它们在E-R图中以相同方式表示。\n\
    - 特化和泛化这两个术语可以互换使用。\n\n## 特化与泛化（续）\n\n- 可以基于不同特征对一个实体集进行多种特化。\n- 例如：除 `instructor`\
    \ 与 `secretary` 之外，还有 `permanent_employee` 与 `temporary_employee`。\n- 每个特定的雇员将是\n\
    \  - `permanent_employee` 或 `temporary_employee` 之一的成员，\n  - 同时也是 `instructor`、`secretary`\
    \ 之一的成员。\n- ISA关系也称为**超类–子类**关系。\n\n## 特化/泛化的设计约束\n\n- 关于哪些实体可以成为给定低层实体集成员的约束。\n\
    \  - 条件定义\n    - 示例：所有超过65岁的客户都是老年公民实体集的成员；老年公民 ISA person。\n  - 用户定义\n- 关于在一个泛化中实体是否可以属于多个低层实体集的约束。\n\
    \  - 不相交\n    - 一个实体只能属于一个低层实体集\n    - 在E-R图中通过多个低层实体集连接到同一个三角形来表示\n  - 重叠\n \
    \   - 一个实体可以属于多个低层实体集\n\n## 特化/泛化的设计约束（续）\n\n- **完整性约束** —— 指定在泛化中，高层实体集中的实体是否必须至少属于该泛化中的某个低层实体集。\n\
    \  - **total（完全）**：实体必须属于某个低层实体集\n  - **partial（部分）**：实体不必属于某个低层实体集\n\n## 聚合\n\
    \n- 考虑之前看到的三元关系 proj_guide\n- 假设我们想要记录一个指导教师（guide）对一个学生在某个项目上的评价\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_193_0.png)\n\
    \n## 聚合（续）\n\n- 关系集 eval_for 和 proj_guide 表示重叠的信息\n  - 每个 eval_for 关系都对应一个 proj_guide\
    \ 关系\n  - 然而，某些 proj_guide 关系可能不对应任何 eval_for 关系\n    - 因此我们不能丢弃 proj_guide 关系\n\
    - 通过聚合消除这种冗余\n  - 将关系视为抽象实体\n  - 允许关系之间建立关系\n  - 将关系抽象为新的实体\n\n## 聚合（续）\n\n在不引入冗余的情况下，下图表示：\n\
    \n- 一个学生在某个特定项目上由一位特定教师指导\n- 一个学生，关联 e\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_195_0.png)\n\
    \n## 通过模式表示特化\n\n- 方法1：\n  - 为高层实体创建一个模式\n  - 为每个低层实体集创建一个模式，包含高层实体集的主键和局部属性\n\
    \  - 缺点：要获取一个雇员的信息，需要访问两个关系，一个对应于低层模式，另一个对应于高层模式\n\n| 模式 | 属性 |\n|---|---|\n|\
    \ person | ID, name, street, city |\n| student | ID, tot_cred |\n| employee |\
    \ ID, salary |\n\n## 将特化表示为模式（续）\n\n- **方法2：**\n  - 为每个实体集创建一个包含所有局部属性和继承属性的模式\n\
    \n| 模式 | 属性 |\n|---|---|\n| person | ID, name, street, city |\n| student | ID,\
    \ name, street, city, tot_cred |\n| employee | ID, name, street, city, salary\
    \ |\n\n- 如果特化是完全的，则泛化实体集（person）的模式不需要存储信息\n- 可以定义为一个“视图”关系，包含各特化关系的并集\n- 但显式模式可能仍为外键约束所需\n\
    - 缺点：对于既是学生又是雇员的人，*姓名（name）*、*街道（street）* 和 *城市（city）* 可能被冗余存储\n\n| 模式 | 属性 |\n\
    |---|---|\n| person | ID, name, street, city |\n| student | ID, name, street,\
    \ city, tot_cred |\n| employee | ID, name, street, city, salary |\n\n"
