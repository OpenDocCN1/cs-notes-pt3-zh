  md: "\n## JDBC\n\n- JDBC is a Java API for communicating with database systems supporting\
    \ SQL.\n- JDBC supports a variety of features for querying and updating data,\
    \ and for retrieving query results.\n- JDBC also supports metadata retrieval,\
    \ such as querying about relations present in the database and the names and types\
    \ of relation attributes.\n- Model for communicating with the database:\n  - Open\
    \ a connection\n  - Create a “statement” object\n  - Execute queries using the\
    \ Statement object to send queries and fetch results\n  - Exception mechanism\
    \ to handle errors\n\n## SQLCA\n\n## SQL Communication Area\n\n- is an area of\
    \ memory that is used on every database request for communicating statistics and\
    \ errors from the application to the database server and back to the application.\n\
    - The SQLCA is used as a handle for the application-to-database communication\
    \ link. It is passed in to all database library functions that need to communicate\
    \ with the database server. It is implicitly passed on all embedded SQL statements.\n\
    \n## SQLCA Fields\n\n- **sqlcode** A 32-bit integer that specifies the error code\
    \ when the database detects an error on a request.\n- Definitions for the error\
    \ codes can be found in the header file `sqlerr.h`.\n  - The error code is 0 (zero)\
    \ for a successful operation\n  - 100 for row not found\n  - Positive for a warning\n\
    \  - Negative for an error.\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_137_0.png)\n\
