    \n# 查询成本度量\n\n- 成本通常以回答查询的总耗时来衡量\n  - 许多因素都会影响时间成本\n    - 磁盘访问、CPU，甚至网络通信\n- 通常磁盘访问是主要成本，也相对容易估计。通过考虑以下因素来衡量\n\
