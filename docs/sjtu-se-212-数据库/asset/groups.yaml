    | &nbsp;&nbsp;&nbsp;&nbsp;*zip* |\n| {*phone_number*} |\n| *date_of_birth* |\n\
    | *age( )* |\n\n## 具有属性的关系集\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_155_0.png)\n\
    \n## 角色\n\n- 一个关系中的实体集不必互不相同。\n  - 实体集的每次出现都在关系中扮演一个“角色”。\n- 标签 “course_id” 和\
