    \n- Where\n- From\n\nFind the average instructors' salaries of those departments\
    \ where the average salary is greater than $42,000.\n\n```\nselect dept_name,\
    \ avg_salary from\n(select dept_name, avg(salary) as avg_salary\nfrom instructor\n\
    group by dept_name\n) as dept_avg (dept_name, avg_salary)\nwhere avg_salary >\
    \ 42000;\n```\n\n## DML: Modification\n\n## DML: Modification\n\n- INSERT\n  -\
    \ 单行整行\n  - 单行部分属性\n  - 多行\n\n## DML: Modification\n\n```\nINSERT INTO student\
    \ Values\n('98001','张三',21,'M','SE')\n```\n\n```\nINSERT INTO student (sno,sname)\n\
    Values('99001','李四')\n```\n\n```\nINSERT INTO SC\nSELECT sno,cno\nFROM student\
    \ as s,course as c\nWHERE c.dept = 'SE'\n```\n\n## DML: Modification\n\nDELETE\
    \ 整元组删除\n\n```\nDELETE\nFROM student\nWHERE dept = 'SE'\n```\n\n```\nDELETE\n\
    FROM   student\nFROM   SC\nWHERE  student.sno = SC.sno and\n       grade < 60\n\
    ```\n\n## DML: Modification\n\nUPDATE\n\n修改相关元组中的指定属性\n\n```\nUPDATE student\n\
    \  SET age = age+1,\n      dept = 'SE'\nWHERE dept = 'MA'\n```\n\n## Authorization\n\
    \n## Authorization\n\n- DCL\n- Grant授权\n- Revoke回收\n\ngrant select on instructor\
    \ to U₁, U₂, U₃\nrevoke select on branch from U₁, U₂, U₃\n\n## Authorization\n\
    \n```\ngrant select on department to Amit\nwith grant option;\nrevoke select on\
    \ department from Amit, Satoshi cascade;\nrevoke select on department from Amit,\
    \ Satoshi restrict;\n```\n\n## View\n\n## View\n\n- Create a view of department\
    \ salary totals\n\n```\ncreate view departments_total_salary(dept_name, total_salary)\
    \ as\nselect dept_name, sum (salary)\nfrom instructor\ngroup by dept_name;\n```\n\
    \n## View的存在形式及操作\n\n- Virtual Table　　 Base Table\n- View的定义被存储在Meta Data中\n-\
    \ 操作时，被转换成对BASE TABLE的处理\n\n## View的使用\n\n```\ncreate view departments_total_salary(dept_name,\
    \ total_salary) as\nselect dept_name, sum (salary)\nfrom instructor\ngroup by\
    \ dept_name;\n```\n\n```\nSELECT    dept_name, total_salary\nFROM      departments_total_salary\n\
    WHERE     total_salary > 2,000,000\n```\n\n查询：如同BaseTable，转换成对BaseTable的查询\n\n\
    ## View的使用\n\n```\nUPDATE departments_total_salary\nSET total_salary = total_salary*1.5\n\
    WHERE total_salary < 2,000,000\n```\n\n能成功转换成对BaseTable的运算吗？\n\n对View的更新操作，必须慎重！\n\
    \n## View的使用\n\n- Most SQL implementations allow updates only on **simple views**\n\
    \  - The FROM clause has only one database relation.\n  - The SELECT clause contains\
    \ only attribute names of the relation, and does not have any expressions, aggregates,\
    \ or DISTINCT specification.\n  - Any attribute not listed in the SELECT clause\
    \ can be set to NULL\n  - The query does not have a GROUP BY or HAVING clause.\n\
    \n## Integrity Constraints\n\n## Integrity Constraints\n\n- Integrity constraints\
    \ guard against accidental damage to the database, by ensuring that authorized\
    \ changes to the database do not result in a loss of data consistency.\n  - A\
    \ checking account must have a balance greater than $10,000.00.\n  - A salary\
    \ of a bank employee must be at least $4.00 an hour.\n  - A customer must have\
    \ a (non-null) phone number\n\n## Constraints on a Single Relation\n\n- not null\n\
    - primary key\n- unique\n- check (P)\n\n- **unique (A1, A2, ..., Am)**\n  - The\
    \ unique specification states that the attributes A1, A2, ... Am form a candidate\
    \ key.\n  - Candidate keys are permitted to be null (in contrast to primary keys).\n\
    \n## Referential Integrity\n\n- Ensures that a value that appears in one relation\
    \ for a given set of attributes also appears for a certain set of attributes in\
    \ another relation.\n"
