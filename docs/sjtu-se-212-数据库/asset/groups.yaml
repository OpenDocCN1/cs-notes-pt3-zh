    \ = tot_cred +\n    (select credits\n        from course\n        where course.course_id\
    \ = nrow.course_id)\n    where student.id = nrow.id;\nend;\n```\n\n## Function\
    \ & Stored procedure\n\n### Procedure\n\n- SQL provides a module language\n  -\
    \ Permits definition of procedures in SQL, with if-then-else statements, for and\
