    \ (**primary index, equality on key**). Retrieve a single record that satisfies\
    \ the corresponding equality condition\n  - *Cost* = ($h_i$ + 1) * ($t_T$ + $t_S$)\n\
    - **A3** (**primary index, equality on nonkey**) Retrieve multiple records.\n\
    \  - Records will be on consecutive blocks\n  - Let b = number of blocks containing\
    \ matching records\n  - *Cost* = $h_i$ * ($t_T$ + $t_S$) + $t_S$ + $t_T$ * b\n\
    \n- A4 (secondary index, equality on nonkey).\n  - Retrieve a single record if\
    \ the search-key is a candidate key\n    - Cost = (hᵢ + 1) * (tₜ + tₛ)\n  - Retrieve\
    \ multiple records if search-key is not a candidate key\n    - each of n matching\
    \ records may be on a different block\n    - Cost = (hᵢ + n) * (tₜ + tₛ)\n   \
    \ - Can be very expensive!\n\n## Selections Involving Comparisons\n\n- Can implement\
    \ selections of the form $A \\vee (r)$ or $A \\wedge (r)$ by using:\n  - a linear\
    \ file scan,\n  - or by using indices in the following ways:\n\n- **A5** *(primary\
    \ index, comparison)*. (**Relation is sorted on $A$**)\n  - For $A \\vee (r)$\
    \ use index to find first tuple $\\geq v$ and scan relation sequentially from\
    \ there.\n  - For $A \\wedge (r)$ just scan relation sequentially till first tuple\
    \ $> v$; do not use index.\n\n- A6 (secondary index, comparison).\n  - For A v(r)\
    \ use index to find first index entry v and scan index sequentially from there,\
    \ to find pointers to records.\n  - For A v(r) just scan leaf pages of index finding\
    \ pointers to records, till first entry > v\n  - In either case, retrieve records\
    \ that are pointed to\n    - requires an I/O for each record\n    - Linear file\
    \ scan may be cheaper\n\n## Implementation of Complex Selections\n\n- Conjunction:\
    \ σ₁ σ₂ ... σₙ(r)\n- A7 (conjunctive selection using one index).\n  - Select a\
    \ combination of σᵢ and algorithms A1 through A7 that results in the least cost\
