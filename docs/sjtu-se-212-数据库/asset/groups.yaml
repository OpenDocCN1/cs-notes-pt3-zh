  md: "\n## Immediate database modification\n\n| Log | Write | Output |\n|-----|-------|--------|\n\
    | `<T₀ start>` | | |\n| `<T₀, A, 1000, 950>` | A = 950 | |\n| `<T₀, B, 2000, 2050>`\
    \ | B = 2050 | |\n| `<T₀ commit>` | | |\n| `<T₁ start>` | | |\n| `<T₁, C, 700,\
    \ 600>` | C = 600 | |\n| `<T₁ commit>` | | |\n| | | B_B, B_C<br>B_A |\n\n- Note:\
    \ `B_X` denotes block containing `X`.\n\n## Checkpoint\n\n- Problems in recovery\
    \ procedure\n  1. Searching the entire log is time-consuming\n  2. We might unnecessarily\
    \ redo transactions which have already output their updates to the database.\n\
    - Streamline recovery procedure by periodically performing checkpointing\n  1.\
    \ Output all log records currently residing in main memory onto stable storage.\n\
    \  2. Output all modified buffer blocks to the disk.\n  3. Write a log record\
    \ `<checkpoint>` onto stable storage.\n\n## 日常备份策略\n\n- Dump Database\n- Dump\
    \ Log\n- Recovery Database\n- Recovery Log\n\n## Query Processing & Performance\
    \ Tuning\n\n## INDEX\n\n- Primary mechanism to get improved performance on a database\n\
    - Indexing mechanisms used to speed up access to desired data\n\n| search-key\
    \ | pointer |\n|------------|--------|\n\n- **Search Key** - attribute or set\
    \ of attributes used to look up records in a file.\n- Two basic kinds of indices:\n\
    \  - Ordered indices\n    - search keys are stored in sorted order\n    - Balanced\
    \ trees\n  - Hash indices\n    - search keys are distributed uniformly across\
    \ \"buckets\" using a \"hash function\"\n    - Hash tables\n\n## INDEX - Query\n\
    \n![](img/5285b20d8f5a79969a3f150d38beebfc_337_0.png)\n\n- No index: read every\
    \ row (table scan)\n- Read index: go directly to row in table\n\n## INDEX - Modification\n\
    \n- No index: insert, update, delete row only\n- Index: insert, update, delete\
    \ row and index\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_338_0.png)\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_338_1.png)\n\
    \n## Ordered Indices\n\n- In an **ordered index**, index entries are stored sorted\
    \ on the search key value.\n- **Primary index**: in a sequentially ordered file,\
    \ the index whose search key specifies the sequential order of the file.\n  -\
    \ Also called **clustering index**\n  - The search key of a primary index is usually\
    \ but not necessarily the primary key.\n- **Secondary index**: an index whose\
    \ search key specifies an order different from the sequential order of the file.\
    \ Also called **non-clustering index**.\n- **Index-sequential file**: ordered\
    \ sequential file with a primary index.\n\n## Dense Index Files\n\n- Dense index\
    \ — Index record appears for every search-key value in the file.\n- E.g. index\
    \ on ID attribute of instructor relation\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_341_0.png)\n\
    \n## Sparse Index Files\n\n- **Sparse Index**: contains index records for only\
    \ some search-key values.\n  - Applicable when records are sequentially ordered\
    \ on search-key\n- **To locate a record with search-key value K we:**\n  - Find\
    \ index record with largest search-key value <= K\n  - Search file sequentially\
    \ starting at the record to which the index record points\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_343_0.png)\n\
    \n## Multilevel Index\n\n- If primary index does not fit in memory, access becomes\
    \ expensive.\n- **Solution:** treat primary index kept on disk as a sequential\
    \ file and construct a sparse index on it.\n  - outer index – a sparse index of\
    \ primary index\n  - inner index – the primary index file\n- If even outer index\
    \ is too large to fit in main memory, yet another level of index can be created,\
    \ and so on.\n- Indices at all levels must be updated on insertion or deletion\
    \ from the file.\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_345_0.png)\n\n###\
    \ Multilevel Index (primary index)\n\nNumbers indicate successive 2K I/Os\n\n\
    ![](img/5285b20d8f5a79969a3f150d38beebfc_346_0.png)\n\nRoot\n\nData page\n\nIndex\
    \ pages\n"
  mdcn: "\n\n## 立即数据库修改\n\n| 日志 | 写入 | 输出 |\n|-----|-------|--------|\n| `<T₀ start>`\
    \ | | |\n| `<T₀, A, 1000, 950>` | A = 950 | |\n| `<T₀, B, 2000, 2050>` | B = 2050\
    \ | |\n| `<T₀ commit>` | | |\n| `<T₁ start>` | | |\n| `<T₁, C, 700, 600>` | C\
    \ = 600 | |\n| `<T₁ commit>` | | |\n| | | B_B, B_C<br>B_A |\n\n- 注意：`B_X` 表示包含\
    \ `X` 的块。\n\n## 检查点\n\n- 恢复过程中的问题\n  1. 搜索整个日志非常耗时\n  2. 我们可能会不必要地重做那些已经将其更新输出到数据库的事务。\n\
    - 通过定期执行检查点来简化恢复过程\n  1. 将当前位于主内存中的所有日志记录输出到稳定存储。\n  2. 将所有修改过的缓冲块输出到磁盘。\n  3.\
    \ 将一条 `<checkpoint>` 日志记录写入稳定存储。\n\n## 日常备份策略\n\n- 转储数据库\n- 转储日志\n- 恢复数据库\n- 恢复日志\n\
    \n## 查询处理与性能调优\n\n## 索引\n\n- 在数据库上获得提升性能的主要机制\n- 用于加速访问所需数据的索引机制\n\n| 搜索键 | 指针\
    \ |\n|------------|--------|\n\n- **搜索键** - 用于在文件中查找记录的属性或属性集。\n- 两种基本的索引类型：\n\
    \  - 有序索引\n    - 搜索键按排序顺序存储\n    - 平衡树\n  - 哈希索引\n    - 使用“哈希函数”将搜索键均匀分布到“桶”中\n\
    \    - 哈希表\n\n## 索引 - 查询\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_337_0.png)\n\
    \n- 无索引：读取每一行（表扫描）\n- 有索引：直接转到表中的行\n\n## 索引 - 修改\n\n- 无索引：仅插入、更新、删除行\n- 有索引：插入、更新、删除行和索引\n\
    \n![](img/5285b20d8f5a79969a3f150d38beebfc_338_0.png)\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_338_1.png)\n\
    \n## 有序索引\n\n- 在**有序索引**中，索引条目按搜索键值排序存储。\n- **主索引**：在顺序排序的文件中，其搜索键指定文件顺序次序的索引。\n\
    \  - 也称为**聚簇索引**\n  - 主索引的搜索键通常（但未必）是主键。\n- **辅助索引**：其搜索键指定的顺序不同于文件顺序次序的索引。也称为**非聚簇索引**。\n\
    - **索引顺序文件**：带有主索引的有序顺序文件。\n\n## 稠密索引文件\n\n- 稠密索引——文件中每个搜索键值都出现一条索引记录。\n- 例如，在\
    \ instructor 关系的 ID 属性上建立的索引\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_341_0.png)\n\
    \n## 稀疏索引文件\n\n- **稀疏索引**：仅包含部分搜索键值的索引记录。\n  - 适用于记录按搜索键顺序排序的情况\n- **要定位搜索键值为\
    \ K 的记录，我们：**\n  - 找到搜索键值 <= K 的最大索引记录\n  - 从索引记录指向的记录开始顺序搜索文件\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_343_0.png)\n\
    \n## 多级索引\n\n- 如果主索引无法装入内存，访问将变得昂贵。\n- **解决方案：** 将磁盘上的主索引视为顺序文件，并为其构建稀疏索引。\n \
    \ - 外层索引——主索引的稀疏索引\n  - 内层索引——主索引文件\n- 即使外层索引也太大而无法装入主内存，还可以再创建一级索引，依此类推。\n- 从文件中插入或删除时，必须更新所有级别的索引。\n\
    \n![](img/5285b20d8f5a79969a3f150d38beebfc_345_0.png)\n\n### 多级索引（主索引）\n\n数字表示连续的\
    \ 2K 次 I/O\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_346_0.png)\n\n根\n\n数据页\n\
    \n索引页\n\n"
