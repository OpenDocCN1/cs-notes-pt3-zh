  mdcn: "\n\n## 01 概述\n介绍\n\n## 数据库\n\n- Database\n- 长期储存在计算机内的、有组织的、可共享的、互相关联的数据的集合\n\
    - 是一个持久数据的集合\n- 一个非常庞大、集成的 数据集合。\n\n## 数据库管理系统\n\n- DataBase Management System(DBMS)\n\
    - 用于存储和管理数据库的软件包。\n- 提供高效、可靠、方便、安全的 多用户存储和访问海量持久数据。\n\n## DBMS\n\n- 庞大\n- 持久\n\
    - 安全\n- 多用户\n- 方便\n- 高效\n- 可靠\n\n## Key concepts\n\n- 数据模型\n  - 描述数据的概念集合\n  -\
    \ 一般而言，对数据结构的一种描述。\n- 模式与数据\n  - 使用给定的数据模型对特定数据集合的描述\n  - 模式建立了数据库的结构。\n- 数据定义语言\
    \ (DDL)\n- 数据操纵或查询语言 (DML)\n\n![](img/5285b20d8f5a79969a3f150d38beebfc_7_0.png)\n\
    \n## 数据库应用\n\nWhether you know it or not,\nyou're using a database every day\n\
