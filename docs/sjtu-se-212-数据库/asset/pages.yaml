- pgno: 242
  md: '# FD


    Let R be a relation schema

    α ⊆ R and β ⊆ R


    The functional dependency α → β holds on R if and only if for any legal relations
    r(R), whenever any two tuples t₁ and t₂ of r agree on the attributes α, they also
    agree on the attributes β.


    That is,


    t₁[α] = t₂ [α]

    t₁[β] = t₂ [β]'
  merge: -1
  img_proc: true
