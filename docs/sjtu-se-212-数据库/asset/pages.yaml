- pgno: 189
  md: '![](img/5285b20d8f5a79969a3f150d38beebfc_189_0.png)


    # # Extended ER Features: Generalization


    +   - **A bottom-up design process** – combine a number of entity sets that share
    the same features into a higher-level entity set.

    +   - Specialization and generalization are simple inversions of each other; they
    are represented in an E-R diagram in the same way.

    +   - The terms specialization and generalization are used interchangeably.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Specialization and Generalization (Cont.)


    +   - Can have multiple specializations of an entity set based on different features.

    +   - E.g., `permanent_employee` vs. `temporary_employee`, in addition to `instructor`
    vs. `secretary`

    +   - Each particular employee would be

    +     - a member of one of `permanent_employee` or `temporary_employee`,

    +     - and also a member of one of `instructor`, `secretary`

    +   - The ISA relationship also referred to as **superclass – subclass** relationship'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Design Constraints on a Specialization/Generalization


    +   - Constraint on which entities can be members of a given lower-level entity
    set.

    +     - condition-defined

    +       - Example: all customers over 65 years are members of senior-citizen entity
    set; senior-citizen ISA person.

    +     - user-defined

    +   - Constraint on whether or not entities may belong to more than one lower-level
    entity set within a single generalization.

    +     - Disjoint

    +       - an entity can belong to only one lower-level entity set

    +       - Noted in E-R diagram by having multiple lower-level entity sets link
    to the same triangle

    +     - Overlapping

    +       - an entity can belong to more than one lower-level entity set'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Design Constraints on a Specialization/Generalization (Cont.)


    +   - **Completeness constraint** -- specifies whether or not an entity in the
    higher-level entity set must belong to at least one of the lower-level entity
    sets within a generalization.

    +     - **total**: an entity must belong to one of the lower-level entity sets

    +     - **partial**: an entity need not belong to one of the lower-level entity
    sets'
  merge: -1
  img_proc: true
