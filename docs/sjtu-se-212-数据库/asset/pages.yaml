- pgno: 183
  md: '# Binary Vs. Non-Binary Relationships


    +   - Some relationships that appear to be non-binary may be better represented
    using binary relationships

    +     - E.g., A ternary relationship *parents*, relating a child to his/her father
    and mother, is best replaced by two binary relationships, *father* and *mother*

    +       - Using two binary relationships allows partial information (e.g., only
    mother being know)

    +     - But there are some relationships that are naturally non-binary

    +       - Example: *proj_guide*'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Converting Non-Binary Relationships to Binary Form


    In general, any non-binary relationship can be represented using binary relationships
    by creating an artificial entity set.


    +   - Replace R between entity sets A, B and C by an entity set E, and three relationship
    sets:

    +     1. R_A relating E and A

    +     2. R_B relating E and B

    +     3. R_C relating E and C


    +   - Create a special identifying attribute for E


    +   - Add any attributes of R to E


    +   - For each relationship (a_i, b_i, c_i) in R, create

    +     1. a new entity e_i in the entity set E

    +     2. add (e_i, a_i) to R_A

    +     3. add (e_i, b_i) to R_B

    +     4. add (e_i, c_i) to R_C


    ![](img/5285b20d8f5a79969a3f150d38beebfc_184_0.png)


    ![](img/5285b20d8f5a79969a3f150d38beebfc_184_1.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Converting Non-Binary Relationships (Cont.)


    +   - Also need to translate constraints

    +     - Translating all constraints may not be possible

    +     - There may be instances in the translated schema that cannot correspond
    to any instance of R

    +       - Exercise: add constraints to the relationships R_A, R_B and R_C to ensure
    that a newly created entity corresponds to exactly one entity in each of entity
    sets A, B and C

    +     - We can avoid creating an identifying attribute by making E a weak entity
    set (described shortly) identified by the three relationship sets'
  merge: -1
