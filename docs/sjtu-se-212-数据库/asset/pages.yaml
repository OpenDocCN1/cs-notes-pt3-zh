- pgno: 57
  md: '# DDL: data type


    +   - **char(n)**

    +     - Fixed length character string, with user-specified length n.

    +   - **varchar(n)**

    +     - Variable length character strings, with user-specified maximum length
    n.

    +   - **Int**

    +     - Integer (a finite subset of the integers that is machine-dependent).

    +   - **Smallint**

    +     - Small integer (a machine-dependent subset of the integer domain type).'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# DDL: data type


    +   - **numeric(p,d)**

    +     - Fixed point number, with user-specified precision of p digits, with d
    digits to the right of decimal point.

    +     - Eg. numeric(3,1), 44.5

    +   - **real, double precision**

    +     - Floating point and double-precision floating point numbers, with machine-dependent
    precision.

    +   - **float(n)**

    +     - Floating point number, with user-specified precision of at least n digits.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# DDL: data type


    +   - **Date**

    +     - Dates, containing a (4 digit) year, month and date

    +     - Example: date ''2005-7-27''

    +   - **Time**

    +     - Time of day, in hours, minutes and seconds.

    +     - Example: time ''09:00:30'' time ''09:00:30.75''

    +   - **Timestamp**

    +     - Date plus time of day

    +     - Example: timestamp ''2005-7-27 09:00:30.75'''
  merge: -1
  img_proc: true
- pgno: 60
  md: '# DDL: data type


    +   - **Interval**

    +     - Period of time

    +     - Example: interval ''1'' day

    +     - Subtracting a date/time/timestamp value from another gives an interval
    value

    +     - Interval values can be added to date/time/timestamp values'
