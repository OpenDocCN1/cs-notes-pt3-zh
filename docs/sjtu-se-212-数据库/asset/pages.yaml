  md: "# Cursor\n\n```\nCREATE PROCEDURE get_table_name(\nIN id_value INT, OUT tabname\
    \ CHAR(128))\nBEGIN\n    DECLARE qry LONG VARCHAR;\n    SET qry = 'SELECT table_name\
    \  FROM SYS.SYSTAB ' || 'WHERE table_id=' || string(id_value);\n    BEGIN\n  \
    \      DECLARE crsr CURSOR USING qry;\n        OPEN crsr;\n        FETCH crsr\
    \ INTO tabname;\n        CLOSE crsr;\n    END\nEND;\n```"
