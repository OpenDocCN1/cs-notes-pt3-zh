- pgno: 165
  md: '# Cardinality Constraints on Ternary Relationship


    +   - We allow at most one arrow out of a ternary (or greater degree) relationship
    to indicate a cardinality constraint

    +   - E.g., an arrow from proj_guide to instructor indicates each student has
    at most one guide for a project

    +   - If there is more than one arrow, there are two ways of defining the meaning.

    +     - E.g., a ternary relationship R between A, B and C with arrows to B and
    C could mean

    +       1. each A entity is associated with a unique entity from B and C or

    +       2. each pair of entities from (A, B) is associated with a unique C entity,
    and each pair (A, C) is associated with a unique B

    +     - Each alternative has been used in different formalisms

    +     - To avoid confusion we outlaw more than one arrow'
  merge: -1
  img_proc: true
