- pgno: 268
  md: '# Example of transaction


    E.g. transaction to transfer $50 from account A to account B:


    +   1. read(A)

    +   2. A := A - 50

    +   3. write(A)

    +   4. read(B)

    +   5. B := B + 50

    +   6. write(B)'
