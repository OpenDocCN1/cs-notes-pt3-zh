- pgno: 250
  md: '# NF的分解


    +   - 分解的要求

    +     - Lossless-join decomposition

    +       $R_1 \cap R_2 \rightarrow R_1$

    +       $R_1 \cap R_2 \rightarrow R_2$

    +     - Dependency preserving

    +       $(F_1 \cup F_2 \cup \cdots \cup F_n)^+ = F^+$

    +     - NF要求'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Canonincal Cover(正则覆盖)


    +   - a canonical cover of F is a **“minimal”** set of functional dependencies
    equivalent to F, having no redundant dependencies or redundant parts of dependencies

    +   - Canonical Cover的特征

    +     - 左边是唯一的，右边多属性合并

    +     - 两边均不含无关属性(extraneous)

    +   - 用于校验依赖保持'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 无关属性的判断


    +   - For

    +   - To test if attribute A is extraneous in

    +     1. compute ({ } - A)+ using the dependencies in F

    +     2. check that ({ } - A)+ contains ; if it does, A is extraneous in

    +   - To test if attribute A is extraneous in

    +     1. compute + using only the dependencies in F'' = (F - { }) { ( - A)}.

    +     2. check that + contains A; if it does, A is extraneous in'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Canonical Cover(正则覆盖)


    +   - R = (A, B, C)

    +     F = {A BC, B C, A B, AB C}

    +   - F = {A BC, B C, AB C}

    +   - F = {A BC, B C}

    +   - F = {A B, B C}'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 范式分解


    +   1) For R，求Key，找出违反范式要求的FD，A B;

    +   2) 求A⁺

    +   3) R1 = {A⁺} √

    +      R2 = {A ∪ ( R-A⁺ )}

    +   4) 对R2重复1-3，直至均满足范式要求


    +   • R1 ∩ R2 ⊆ R1, 无损连接

    +   • 验证 (F₁ F₂ ... Fₙ)⁺ = F⁺

    +   • 亦可验证Fc'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 范式分解


    R = (A, B, C)

    F = {A→B, B→C}


    Can be decomposed in two different ways


    – R1 = (A, B),    R2 = (B, C)


    Lossless-join decomposition:


    R1 ∩ R2 = {B} and B→BC


    Dependency preserving


    – R1 = (A, B),    R2 = (A, C)


    Lossless-join decomposition:


    R1 ∩ R2 = {A} and A→AB


    Not dependency preserving

    (cannot check B→C without computing R1 ⋈ R2)'
  merge: -1
