- pgno: 335
  md: '# # INDEX


    +   - Primary mechanism to get improved performance on a database

    +   - Indexing mechanisms used to speed up access to desired data


    | search-key | pointer |

    |---|---|


    — **Search Key** - attribute or set of attributes used to look up records in a
    file.'
