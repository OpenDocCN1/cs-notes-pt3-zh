- pgno: 355
  md: '# Measures of Query Cost


    +   - Cost is generally measured as total elapsed time for answering query

    +     - Many factors contribute to time cost

    +       - disk accesses, CPU, or even network communication

    +   - Typically disk access is the predominant cost, and is also relatively easy
    to estimate. Measured by taking into account

    +     - Number of seeks * average-seek-cost

    +     - Number of blocks read * average-block-read-cost

    +     - Number of blocks written * average-block-write-cost

    +       - Cost to write a block is greater than cost to read a block

    +         - data is read back after being written to ensure that the write was
    successful'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Measures of Query Cost (Cont.)


    +   - For simplicity we just use the number of block transfers from disk and the
    number of seeks as the cost measures

    +     - t_T - time to transfer one block

    +     - t_S - time for one seek

    +     - Cost for b block transfers plus S seeks

    +       b * t_T + S * t_S

    +   - We ignore CPU costs for simplicity

    +     - Real systems do take CPU cost into account

    +   - We do not include cost to writing output to disk in our cost formulae'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Measures of Query Cost (Cont.)


    +   - Several algorithms can reduce disk IO by using extra buffer space

    +     - Amount of real memory available to buffer depends on other concurrent
    queries and OS processes, known only during execution

    +     - We often use worst case estimates, assuming only the minimum amount of
    memory needed for the operation is available

    +   - Required data may be buffer resident already, avoiding disk I/O

    +     - But hard to take into account for cost estimation'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Selection Operation'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# File scan


    +   - **Algorithm A1 (linear search).** Scan each file block and test all records
    to see whether they satisfy the selection condition.

    +     - Cost estimate = $b_r$ block transfers + 1 seek

    +       - $b_r$ denotes number of blocks containing records from relation $r$

    +     - If selection is on a key attribute, can stop on finding record

    +       - cost = $(b_r / 2)$ block transfers + 1 seek'
  merge: -1
  img_proc: true
- pgno: 360
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 361
  md: '# Selections Using Indices


    +   - **Index scan** - search algorithms that use an index

    +     - selection condition must be on search-key of index.

    +   - **A2** (**primary index, equality on key**). Retrieve a single record that
    satisfies the corresponding equality condition

    +     - *Cost* = ($h_i$ + 1) * ($t_T$ + $t_S$)

    +   - **A3** (**primary index, equality on nonkey**) Retrieve multiple records.

    +     - Records will be on consecutive blocks

    +     - Let b = number of blocks containing matching records

    +     - *Cost* = $h_i$ * ($t_T$ + $t_S$) + $t_S$ + $t_T$ * b'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Selections Using Indices


    +   - A4 (secondary index, equality on nonkey).

    +     - Retrieve a single record if the search-key is a candidate key

    +       - Cost = (hᵢ + 1) * (tₜ + tₛ)

    +     - Retrieve multiple records if search-key is not a candidate key

    +       - each of n matching records may be on a different block

    +       - Cost = (hᵢ + n) * (tₜ + tₛ)

    +       - Can be very expensive!'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Selections Involving Comparisons


    +   - Can implement selections of the form $A \vee (r)$ or $A \wedge (r)$ by using:

    +     - a linear file scan,

    +     - or by using indices in the following ways:


    +   - **A5** *(primary index, comparison)*. (**Relation is sorted on $A$**)

    +     - For $A \vee (r)$ use index to find first tuple $\geq v$ and scan relation
    sequentially from there.

    +     - For $A \wedge (r)$ just scan relation sequentially till first tuple $>
    v$; do not use index.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Selections Involving Comparisons


    +   - A6 (secondary index, comparison).

    +     - For A v(r) use index to find first index entry v and scan index sequentially
    from there, to find pointers to records.

    +     - For A v(r) just scan leaf pages of index finding pointers to records,
    till first entry > v

    +     - In either case, retrieve records that are pointed to

    +       - requires an I/O for each record

    +       - Linear file scan may be cheaper'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# Implementation of Complex Selections


    +   - Conjunction: σ₁ σ₂ ... σₙ(r)

    +   - A7 (conjunctive selection using one index).

    +     - Select a combination of σᵢ and algorithms A1 through A7 that results in
    the least cost for σᵢ(r).

    +     - Test other conditions on tuple after fetching it into memory buffer.

    +   - A8 (conjunctive selection using composite index).

    +     - Use appropriate composite (multiple-key) index if available.'
  merge: -1
  img_proc: true
- pgno: 366
  md: "# Implementation of Complex Selections\n\n+   - **Conjunction:**\n+     \n\
    +     `1      2   ...   n(r)`\n\n+   - **A9** *(conjunctive selection by intersection\
    \ of identifiers)*\n+     - Requires indices with record pointers.\n+     - Use\
    \ corresponding index for each condition, and take intersection of all the obtained\
    \ sets of record pointers.\n+     - Then fetch records from file.\n+     - If\
    \ some conditions do not have appropriate indices, apply test in memory."
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Algorithms for Complex Selections


    +   - **Disjunction:** $1, 2, \ldots, n(r)$.

    +   - **A10** *(disjunctive selection by union of identifiers)*

    +     - Applicable if *all* conditions have available indices.

    +       - Otherwise use linear scan.

    +     - Use corresponding index for each condition, and take union of all the
    obtained sets of record pointers.

    +     - Then fetch records from file'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Algorithms for Complex Selections


    +   - Negation: (r)

    +     - Use linear scan on file

    +     - If very few records satisfy , and an index is applicable to

    +       - Find satisfying records using index and fetch from file'
  merge: -1
  img_proc: true
