- pgno: 150
  md: '# Keys


    +   - A **super key** of an entity set is a set of one or more attributes whose
    values uniquely determine each entity.

    +   - A **candidate key** of an entity set is a minimal super key

    +     - *ID* is candidate key of instructor

    +     - *course_id* is candidate key of course

    +   - Although several candidate keys may exist, one of the candidate keys is
    selected to be the **primary key**.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Keys for Relationship Sets


    +   - The combination of primary keys of the participating entity sets forms a
    super key of a relationship set.

    +     - `(s_id, i_id)` is the super key of `advisor`

    +     - **NOTE:** this means a *pair of entity sets can have at most one relationship
    in a particular relationship set.*

    +       - Example: if we wish to track multiple meeting dates between a student
    and her advisor, we cannot assume a relationship for each meeting. We can use
    a multivalued attribute though

    +   - Must consider the mapping cardinality of the relationship set when deciding
    what are the candidate keys

    +   - Need to consider semantics of relationship set in selecting the primary
    key in case of more than one candidate key'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Redundant Attributes


    +   - Suppose we have entity sets

    +     - *instructor*, with attributes including *dept_name*

    +     - *department*

    +     and a relationship

    +     - *inst_dept* relating *instructor* and *department*

    +   - Attribute *dept_name* in entity *instructor* is redundant since there is
    an explicit relationship *inst_dept* which relates instructors to departments

    +     - The attribute replicates information present in the relationship, and
    should be removed from *instructor*

    +     - BUT: when converting back to tables, in some cases the attribute gets
    reintroduced, as we will see.'
  merge: -1
