  md: '# SQL Communication Area


    +   - is an area of memory that is used on every database request for communicating
    statistics and errors from the application to the database server and back to
    the application.

    +   - The SQLCA is used as a handle for the application-to-database communication
    link. It is passed in to all database library functions that need to communicate
    with the database server. It is implicitly passed on all embedded SQL statements.'
