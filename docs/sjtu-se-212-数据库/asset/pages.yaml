- pgno: 207
  md: '# ER vs. UML Class Diagrams


    # ER Diagram Notation


    # Equivalent in UML


    | ER Diagram Notation | Equivalent in UML |

    |---|---|

    | **E** — entity with attributes (simple, composite, multivalued, derived) | **E**
    — class with simple attributes and methods (attribute prefixes: `+` = public,
    `−` = private, `#` = protected) |

    | **E1** — `role1` — **R** — `role2` — **E2** — binary relationship | **E1** —
    `role1` **R** `role2` — **E2** |

    | **E1** — `role1` — **R** — `role2` — **E2**, with **A1** as relationship attribute
    | **E1** — `role1` **R** `role2` — **E2**, with **R** containing **A1** |

    | **E1** — `0..*` — **R** — `0..1` — **E2** — cardinality constraints | **E1**
    — `0..1` — **R** — `0..*` — **E2** |


    > *Note reversal of position in cardinality constraint depiction*'
  merge: -1
  img_proc: true
