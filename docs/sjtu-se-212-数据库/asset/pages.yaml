- pgno: 245
  md: '# # Key


    +   - K ⊆ R


    +   - K is a superkey for relation schema R if and only if K → R


    +   - K is a candidate key for R if and only if

    +     - K → R, and

    +     - for no K'' ⊂ K, K'' → R'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Trivial(平凡) FD


    +   - A functional dependency is **trivial** if it is satisfied by all instances
    of a relation


    +   - Example:


    ID, name → ID


    +   - In general, α → β is trivial if β ⊆ α'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Armstrong''s Axioms


    +   - if β ⊆  , then α → β （自反律）

    +   - if α → β, then γα → γβ （增补律）

    +   - if α → β, and β → γ, then α → γ （传递律）


    +   - Additional rules:

    +   - If  and  , then  （合并律）

    +   - If  , then  and  （分解律）

    +   - If  and  , then  （伪传递律）'
  merge: -1
