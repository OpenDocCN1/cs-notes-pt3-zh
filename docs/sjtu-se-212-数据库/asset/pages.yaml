- pgno: 178
  md: '# Composite and Multivalued Attributes


    +   - A multivalued attribute M of an entity E is represented by a separate schema
    EM

    +     - Schema EM has attributes corresponding to the primary key of E and an
    attribute corresponding to multivalued attribute M

    +     - Example: Multivalued attribute phone_number of instructor is represented
    by a schema: inst_phone = ( ID, phone_number)

    +     - Each value of the multivalued attribute maps to a separate tuple of the
    relation on schema EM

    +       - For example, an instructor entity with primary key 22222 and phone numbers
    456-7890 and 123-4567 maps to two tuples: (22222, 456-7890) and (22222, 123-4567)'
  merge: -1
  img_proc: true
