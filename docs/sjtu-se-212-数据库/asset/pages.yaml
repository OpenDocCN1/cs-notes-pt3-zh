- pgno: 336
  md: '# INDEX


    +   - Two basic kinds of indices:

    +     - Ordered indices

    +       - search keys are stored in sorted order

    +       - Balanced trees

    +     - Hash indices

    +       - search keys are distributed uniformly across "buckets" using a "hash
    function"

    +       - Hash tables'
  merge: -1
  img_proc: true
