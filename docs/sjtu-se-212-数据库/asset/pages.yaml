- pgno: 320
  md: '# Data Access


    +   - **Physical blocks** are those blocks residing on the disk.

    +   - **Buffer blocks** are the blocks residing temporarily in main memory.

    +   - Block movements between disk and main memory are initiated through the following
    two operations:

    +     - **input(B)** transfers the physical block B to main memory.

    +     - **output(B)** transfers the buffer block B to the disk, and replaces the
    appropriate physical block there.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# # Data Access


    +   - Each transaction Ti has its private work-area in which local copies of all
    data items accessed and updated by it are kept.

    +     - Ti''s local copy of a data item X is called xi.

    +   - We assume, for simplicity, that each data item fits in, and is stored inside,
    a single block.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Data Access (Cont.)


    +   - Transaction transfers data items between system buffer blocks and its private
    work-area using the following operations:

    +     - read(X) assigns the value of data item X to the local variable xi.

    +     - write(X) assigns the value of local variable xi to data item {X} in the
    buffer block.

    +     - Both these commands may necessitate the issue of an input(BX) instruction
    before the assignment, if the block BX in which X resides is not already in memory.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Data Access (Cont.)


    +   - Transactions

    +     - Perform read(X) while accessing X for the first time;

    +     - All subsequent accesses are to the local copy.

    +     - After last access, transaction executes write(X).

    +   - output(BX) need not immediately follow write(X). System can perform the
    output operation when it deems fit.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 基于Log的备份


    +   - To ensure atomicity despite failures, we first output information describing
    the modifications to stable storage without modifying the database itself.

    +   - log-based recovery'
