- pgno: 370
  md: '# Join Operation


    +   - Several different algorithms to implement joins

    +     - Nested-loop join

    +     - Block nested-loop join

    +     - Indexed nested-loop join

    +     - Merge-join

    +     - Hash-join

    +   - Choice based on cost estimate

    +   - Examples use the following information

    +     - Number of **records** of *student*: 5,000

    +       *takes*: 10,000

    +     - Number of **blocks** of *student*: 100

    +       *takes*: 400'
  merge: -1
  img_proc: true
- pgno: 371
  md: "# Nested-Loop Join\n\n•To compute the theta join r ⋈ s\nfor each tuple t_r\
    \ in r do begin\n  for each tuple t_s in s do begin\n    test pair(t_r, t_s) to\
    \ see if they satisfy the join condition\n    if they do, add t_r · t_s to the\
    \ result.\n  end\nend\nr is called the outer relation and s the inner relation\
    \ of the join.\nRequires no indices and can be used with any kind of join condition.\n\
    Expensive since it examines every pair of tuples in the two relations."
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Nested-Loop Join (Cont.)


    +   - In the worst case, if there is enough memory only to hold one block of each
    relation, the estimated cost is

    +     $n_r \cdot b_s + b_r$ block transfers, plus

    +     $n_r + b_r$ seeks

    +   - If the smaller relation fits entirely in memory, use that as the inner relation.

    +     - Reduces cost to $b_r + b_s$ block transfers and 2 seeks

    +   - Assuming worst case memory availability cost estimate is

    +     - with student as outer relation:

    +       - 5000 × 400 + 100 = 2,000,100 block transfers,

    +       - 5000 + 100 = 5100 seeks

    +     - with takes as the outer relation

    +       - 10000 × 100 + 400 = 1,000,400 block transfers and 10,400 seeks

    +   - If smaller relation (student) fits entirely in memory, the cost estimate
    will be 500 block transfers.

    +   - Block nested-loops algorithm (next slide) is preferable.'
  merge: -1
  img_proc: true
- pgno: 373
  md: "# Block Nested-Loop Join\n\n+   - Variant of nested-loop join in which every\
    \ block of inner relation is paired with every block of outer relation.\n\n```\n\
    for each block B_r of r do begin\n  for each block B_s of s do begin\n    for\
    \ each tuple t_r in B_r do begin\n      for each tuple t_s in B_s do begin\n \
    \       Check if (t_r, t_s) satisfy the join condition\n        if they do, add\
    \ t_r · t_s to the result.\n      end\n    end\n  end\nend\n```"
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Block Nested-Loop Join (Cont.)


    +   - Worst case estimate: $b_r * b_s + b_r$ block transfers + $2 * b_r$ seeks

    +     - Each block in the inner relation $s$ is read once for each block in the
    outer relation

    +   - Best case: $b_r + b_s$ block transfers + 2 seeks.

    +   - Improvements to nested loop and block nested loop algorithms:

    +     - In block nested-loop, use $M - 2$ disk blocks as blocking unit for outer
    relations, where $M =$ memory size in blocks; use remaining two blocks to buffer
    inner relation and output

    +       - Cost = $\lceil b_r / (M-2) \rceil * b_s + b_r$ block transfers + $2
    \lceil b_r / (M-2) \rceil$ seeks

    +     - If equi-join attribute forms a key or inner relation, stop inner loop
    on first match

    +     - Scan inner loop forward and backward alternately, to make use of the blocks
    remaining in buffer (with LRU replacement)

    +     - Use index on inner relation if available (next slide)'
  merge: -1
  img_proc: true
