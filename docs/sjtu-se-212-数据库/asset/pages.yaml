- pgno: 126
  md: "# Cursor\n\n```\nCREATE FUNCTION GetRowCount( IN qry LONG VARCHAR )\n    RETURNS\
    \ INT\nBEGIN\n    DECLARE crsr CURSOR USING qry;\n    DECLARE rowcnt INT;\n  \
    \  SET rowcnt = 0;\n    OPEN crsr;\n    lp: LOOP\n        FETCH crsr;\n      \
    \  IF SQLCODE <> 0 THEN LEAVE lp END IF;\n        SET rowcnt = rowcnt + 1;\n \
    \   END LOOP;\n    CLOSE crsr;\n    RETURN rowcnt;\nEND;\n```"
