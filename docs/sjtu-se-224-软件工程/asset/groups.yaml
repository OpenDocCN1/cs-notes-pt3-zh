    # 成果：软件需求规范约


    软件需求规范约（SRS）定义了系统的外在行为和属性。


    # 细化需求


    +   - 细化功能需求

    +   - 引入分析模型

    +   - 细化非功能需求

    +   - 细化约束条件


    概要功能需求

    Feat 63 - the defect tracking system will provide trending information to help
    the project manager assess project status


    详细功能需求

    Trending information will be charted with a line graph showing time on the x axis,
    and number of defects found on the y axis.


    # 设计用户界面和接口


    +   - 如果和外界的软系统或硬件进行交互，则需定义通信协议

    +   - 如果采用现有的协议，在功能说明中描述

    +   - 如果采用新的协议，在设计时进行完整描述

    +   - 如果和用户交互，则简略要设计用户界面

    +   - 图表（在纸上）

    +   - 位图（采用绘图工具），或

    +   - 可执行代码（交互式的电子界面原型）


    # 如何描述用户界面


    +   - 可在功能说明中纳入屏幕截图，也可以是一个独立的用户界面原型

    +   - 注意不要关注太多的界面设计细节


    # SRS模板（采用传统技术）


    +   1. 简介

    +   2. 整体说明

    +   3. 具体需求

    +      3.1 功能

    +      3.2 性能

    +      3.3 可靠性

    +      3.4 兼容性

    +      3.5 安装

    +      3.6 设计约束

    +      3.7 软件界面和硬件接口需求

    +      3.8 通信接口需求

    +      3.9 授权

    +      3.10 许可权及其它说明

    +      3.11 维护

    +      3.12 适用的标准

    +   4. 支持信息

    +      表意、术语表等


    # SRS模板（采用Use-Case技术）


    +   1. 引言

    +      1.1 Purpose

    +      1.2 Scope

    +      1.3 Definitions, Acronyms, and Abbreviations

    +      1.4 References

    +      1.5 Overview

    +   2. 概述

    +      2.1 Use-Case Model Survey

    +      2.2 Assumptions and Dependencies

    +   3. 具体需求

    +      3.1 Use-Case 描述

    +         3.1.1 Use Case i:

    +         3.1.2 ...

    +      3.2 补充需求

    +         3.2.1 用例相关表

    +         3.2.2 ...

    +   4. 支持信息

    +      表意、术语、用户/操作指南等'
