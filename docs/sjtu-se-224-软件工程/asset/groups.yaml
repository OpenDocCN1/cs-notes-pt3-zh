    \ | U ○× b → |\n\n## 定义：转换\n\n- 转换是**两个状态**之间的关系，表示当事件发生时，对象从先前状态移动到后续状态\n\n###\
    \ 转换种类\n\n| 转换种类 | 描述 | 语法 |\n|---|---|---|\n| 入口转换 | 当进入状态时执行的**入口活动**的规范 | `entry/\
