    # 软件的故障率曲线(实际情况)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_3_2.png)


    # 软件面临的新挑战


    +   - 软件复杂性的增加

    +   - 软件规模的不断扩大

    +   - 软件运行环境的变化

    +   - 遗留系统（Legacy System）的集成和复用

    +   - 软件开发的高质量和敏捷性要求

    +   - 分散的开发团队的协同


    大型软件的典型事故案例：2000年1月，如同预言产生的一个人一夜之间老去，等等不一。2000年1月1日，2000年问题导致全球历史上最大的计算机事故，估计损失超过3,5354亿美元，合计同时使用计算机无先例。


    +   - 网络应用

    +   - 多种硬件、操作系统

    +   - 多种编程语言

    +   - 旧出不穷的新技术


    # 本节内容


    +   - 什么是软件

    +   - 软件的作用、发展、定义和特性

    +   - 软件危机和问题

    +   - 什么是工程

    +   - 什么是软件工程

    +   - 软件工程的属性和知识域

    +   - 软件工程的黄金三角

    +   - 控制软件开发的复杂性

    +   - 软件建模及方法


    # 软件危机的主要表现


    +   - 对软件开发成本和进度的估计常常不准确，开发成本超出预算，实际进度比计划设计一再推迟的现象并不罕见。

    +   - 用户对“已完成”系统不满意的现象经常发生。

    +   - 软件产品的质量往往靠不住，Bug一大堆，Patch一个接着一个。

    +   - 软件的可维护程度非常之低。

    +   - 软件通常没有适当的文档资料。

    +   - 软件的成本不断提高。

    +   - 软件开发生产率的提高赶不上硬件的发展和人们需求的增长。'
  - '[PAGE 4]


    # 软件项目成功率调查


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_4_0.png)


    # 当前软件实践的问题


    +   - 软件直到测试阶段仅仅是忽略质量的现代技术。典型地说，软件工程师

    +     - 没有计划他们的工作

    +     - 匆匆地走过需求和设计

    +     - 在编码时再进行设计

    +   - 这些实践引入了大量的缺陷

    +     - 有经验的工程师每7-10行代码就引入一个缺陷

    +     - 平均中等规模的系统存在着上千个缺陷

    +     - 这些缺陷的大多数会累积到发现

    +     - 通常需要花去一倍以上的开发时间

    +   - 目前大多数的工作方式还像30年前一样——“code-fix”


    # 软件事故


    +   - 1981年，由计算机程序变更而导致1/67的时间停运，使航天飞机STS-5的计算机不能同步运行。这个错误导致了航天飞机发射失败。

    +   - 1986年，1台Therac25机器错误致命剂量的辐射，致使两名医院病人死亡。原因是一个软件出现了问题，导致设备机器错误。

    +   - 化学银行一个晚上从10多万撤离客户上，错误地扣除了大约1500万美元的存款。原因是一个软件的闰使ATM的每一笔业务重复记两次。

    +   - 小事故：计算机一个月停机几次，不得不随时进行数据备份；定期重装机器；病毒四溢。


    软件工程师是希望改变？


    # 中国的软件产业现状


    +   - 软件作坊 vs. 软件工厂

    +   - 缺少系统化和规范化的管理

    +   - 规模小，大多数在50人以下

    +   - 生产率低

    +   - 质量差


    和美国、印度等存在较大的差距。


    # 软件危机和问题的原因


    +   - 一方面是与软件本身的特点有关

    +   - 另一方面是由软件开发和维护的方法、过程、管理、规范和工具不正确有关


    # 本节内容


    +   - 什么是软件

    +     - 软件的作用、发展、定义和特性

    +     - 软件危机和问题

    +   - 什么是工程

    +   - 什么是软件工程

    +     - 软件工程的概念和知识域

    +     - 软件工程的三个角

    +     - 控制软件开发的复杂性

    +     - 软件规模及方法'
