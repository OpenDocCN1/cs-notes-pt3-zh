    \ Dependencies Principle\n  - SAP: The Stable Abstractions Principle\n\n## REP:\
    \ The Release-Reuse Equivalency Principle\n\n- The Release-Reuse Equivalency Principle\n\
    - The **granule of reuse** is the **granule of release**\n  - The granularity\
    \ of reuse is the granularity of release\n  - packages are usually the **basic\
    \ unit** of development work and of release\n  - In order to provide the guarantees\
    \ that reusers need, authors must organize their software into **reusable packages**\
    \ and then **track those packages with release numbers**\n  - the granule of reuse\
    \ (i.e., a package) can be **no smaller than** the granule of release.\n    -\
    \ Anything that we reuse must also be released and tracked.\n  - **Either** all\
    \ of the classes in a package are reusable **or** none of them are.\n    - If\
    \ a package contains software that should be reused, then it should not also contain\
    \ software that is not designed for reuse.\n\n## CRP: The Common Reuse Principle\n\
    \n- The Common Reuse Principle\n  - The classes in a package are reused together.\n\
    \    - If you reuse one of the classes in a package, you reuse them all.\n- CRP\
    \ helps us to decide which classes should be placed into a package\n  - classes\
    \ that tend to be reused together belong in the same package.\n- CRP tells us\
