  - '[PAGE 215]


    # Part and Property


    +   - two possible views of the Car class

    +     - Car is shown as having a composition association with role name rear to
    a class Wheel and an association with role name e to a class Engine

    +     - it is specified that rear and e belong to the internal structure of the
    class Car. This allows specification of detail that holds only for instances of
    the Wheel and Engine classes within the context of the class Car, but which will
    not hold for wheels and engines in general.


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_215_0.png)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_215_1.png)'
  - '[PAGE 216]


    # UML Composite Structure Diagram


    +   - **Port**

    +     - a point for **conducting interactions** between the internals of the classifier
    and its environment.


    +   - **Delegate**

    +     - A delegate connector is used for defining the internal workings of a component''s
    external ports and interfaces.

    +     - It connects **an external contract** of a component as shown by its ports
    to the **internal realization** of the behavior of the component''s part.


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_216_0.png)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_216_1.png)'
  - '[PAGE 217]


    # Composite Structure Diagram - Collaboration


    +   - defines a set of co-operating roles used collectively to illustrate a specific
    functionality.

    +   - Collaborations have two aspects:

    +     - a **structural aspect**

    +       - **specifies the classes, interfaces, and other elements that work together
    to carry out the named collaboration;**

    +     - a **behavioral aspect**

    +       - **specifies the dynamics of how those elements interact.**


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_217_0.png)'
  - '[PAGE 218]


    # Composite Structure Diagram - Collaboration


    +   - Role Binding

    +     - A role binding connector is drawn from a collaboration to the classifier
    that fulfills the role.

    +   - Represents

