  mdcn: "\n\n## 依赖关系 vs. 关联关系\n\n- 关联关系是结构性关系\n- 依赖关系是非结构性关系\n- 为了让对象“相互了解”，它们必须可见\n\
    \n- 局部变量引用\n- 参数引用\n- 全局引用\n- 字段引用\n\nDependency\n\nAssociation\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_252_0.png)\n\
    \n## 协作中的关联关系 vs. 依赖关系\n\n- 关联关系的一个实例是链接\n  - 除非它们具有全局、局部或参数可见性，否则所有链接都成为**关联关系**\n\
    \  - 上下文相关的关系\n- 依赖关系是**瞬态**链接\n  - 持续时间有限\n  - 上下文无关的关系\n  - 概要关系\n\n## 识别依赖关系：注意事项\n\
    \n- **永久**关系 - **关联关系**（字段可见性）\n- **瞬态**关系 - **依赖关系**\n  - **多个对象共享同一个实例**\n \
    \   - 将实例作为参数传递（参数可见性）\n    - 将实例作为托管全局变量（全局可见性）\n  - **多个对象不共享同一个实例**（局部可见性）\n\
    - 创建/销毁需要多长时间？\n  - **昂贵？** 使用字段、参数或全局可见性\n  - 追求尽可能轻量的关系\n\n## 示例：定义依赖关系（之前）\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_255_0.png)\n\n## 示例：定义依赖关系（之后）\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_256_0.png)\n\nGlobal visibility\n\nField\
    \ visibility\n\n## 定义关联关系\n\n- 目的\n  - 细化剩余的关联关系\n- 需要查找的内容：\n  - 关联关系 vs. 聚合\n\
    \  - 聚合 vs. 组合\n  - 属性 vs. 关联关系\n  - 可导航性\n  - 关联类设计\n  - 多重性设计\n\n## 什么是组合？\n\
    \n- 具有强所有权和生命周期一致的聚合形式\n  - 部分**不能**在整体/聚合之外存活\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_258_0.png)\n\
    \n## 聚合：共享 vs. 非共享\n\n### ◆ 共享聚合\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_1.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_2.png)\n\
    \n根据定义，组合是非共享聚合\n\n## 示例：组合\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_261_0.png)\n\
    \n## 属性 vs 组合\n\n- 使用组合的情况\n  - 属性需要独立的身份\n  - 多个类具有相同的属性\n  - 属性具有复杂结构且有自己的属性\n\
    \  - 属性具有自己的复杂行为\n  - 属性具有自己的关系\n- 否则使用属性\n\n## 示例：属性 vs 组合\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_263_0.png)\n\
    \nStudent\n\n- name\n- address\n- <<classifier scope>> - nextAvailID : int\n-\
    \ StudentID : int\n- dateofBirth : Date\n\n- + addSchedule()\n- + getSchedule()\n\
    - + delete schedule()\n- + hasPrerequisites()\n- # passed()\n\nSchedule\n\n- Semester\n\
    \n- + submit()\n- + // save()\n- # any conflicts?()\n- + // create with offerings()\n\
    - + new()\n- + passed()\n\nAttributes\n\nComposition of separate class\n\n## 可导航性：真正需要的方向有哪些？\n\
    \n- 探索交互图\n- 即使两个方向似乎都需要，其中一个也可能可行\n  - 单向可导航性不频繁\n  - 其中一个类的实例数量很少\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_264_0.png)\n\
    \n## 关联类\n\n- “附加”到关联关系上的一个类\n- 包含关系属性\n- 每个链接一个实例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_265_0.png)\n\
    \n## 示例：关联类设计\n\nDesign Decisions\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_266_0.png)\n\
    \n"
