    \n### 编码和版本管理\n\n- 程序设计语言\n- 编码准则和规范\n- 软件版本管理\n- 软件持续集成\n\n### 软件配置项\n\n- 软件版本管理的基本实体是软件配置项\
    \ (Software Configuration Item, SCI)。\n- 一个软件配置项是在软件生存周期所产生或使用的一个工作产品或一组相关的工作产品，包括代码、文档、模型、数据等。\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_320_1.png)\n\n### 版本 version\n\n- 配置项在软件开发过程中会不断变更，形成多个版本(Version)。\n\
