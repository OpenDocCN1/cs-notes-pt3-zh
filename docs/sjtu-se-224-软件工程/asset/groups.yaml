    \ : double\nclass MathPack {\npublic:\nstatic double sin(double angle);\nstatic\
    \ double cos(double angle);\nstatic double random();\nprivate:\nstatic long randomSeed\
    \ = 0;\nstatic double pi = 3.14159265358979;\n};\nvoid main(void)\n{...}\nmyCos\
