    represents the data, the **controller** handles user input'
  - '[PAGE 162]


    # Model-View-Controller Architecture


    ◆ The *model-view-controller* architecture (MVC) separates application data (contained
    in the *model*) from graphical presentation components (the *view*) and input-processing
    logic (the *controller*).


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_162_0.png)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_162_1.png)'
  - '[PAGE 163]


    # Examples of Architectural Patterns - Blackboard


    +   - **Pattern Name**

    +     - Blackboard

    +   - **Context**

    +     - A domain in which **no closed (algorithmic) approach** to solving a problem
    is known or feasible. Examples are AI systems, voice recognition, and surveillance
    systems.

    +   - **Problem**

    +     - **Multiple problem-solving agents** (knowledge agents) must **cooperate**
    to solve a problem that **cannot be solved by any of the individual agents**.
    The results of the work of the individual agents must be accessible to all the
    other agents so they can evaluate whether they can contribute to finding a solution
    and post results of their work.'
