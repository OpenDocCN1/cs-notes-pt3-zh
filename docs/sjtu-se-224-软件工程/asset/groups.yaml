    \n### 基线 baseline\n\n- 基线是项目存储库中每个配置项版本在特定时期的一个“快照”，它提供一个正式标准，随后的工作基于此继续，并只有经过授权后才变更为新标准。\n\
    - 通常将交付给客户的基础版本称作一个“发行”(Release)，为内部开发用的基线则称为一个“构造”(Build)。\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_320_3.png)\n\
