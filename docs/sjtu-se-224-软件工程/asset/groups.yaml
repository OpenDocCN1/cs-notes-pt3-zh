    \n## 分解 decomposition\n\nC(P1+P2) > C(P1)+C(P2)\nE(P1+P2) > E(P1)+E(P2)\n\n- C为问题的复杂度，E为解决需要的工作量\n\
    - 思考：\n- 如果我们无限制地切分软件，开发它所需的工作量会变得小到可以忽略？！\n- 事实上，影响软件开发工作量的因素还有很多，例如模块接口费用等等\n\
    - 上述不等式只能说明，当模块的总数量增加时，单独开发各个子模块的工作量之和会有所减少\n\n## 模块化的成本\n\n- 如果模块是相互独立的，当模块变得越小，每个模块花费的工作量越低；\n\
