    # 9）定义质量范围


    举例：选课系统的质量范围@Vision文档


    +   - **Availability:**

    +     - The System shall be available 24 hours a day, 7 days a week.

    +   - **Usability:**

    +     - The System shall be easy-to-use and shall be appropriate for the target
    market of computer-literate students and professors.

    +     - The System shall include online help for the user. Student and Professor
    users should not require the use of a hardcopy Manual to use the System.

    +   - **Maintainability:**

    +     - The System shall be designed for ease of maintenance. All college-specific
    data should be table-driven and modifiable without recompilation of the system.

    +   - **Performance Requirements:**

    +     - The system shall support up to 200 simultaneous users against the central
    database at any given time, and up to 500 simultaneous users against the local
    servers at any one time.

    +     - The system shall provide access to the legacy Course Catalog Database
    with no more than a 10 second latency.

    +     - The system shall complete 80% of all transactions within 2 minutes.


