    \n## 维护类型\n\n- 纠错性维护（Corrective maintenance）\n  - 由于软件中的缺陷引起的修改\n- 完善性维护（Perfective\
    \ maintenance）\n  - 根据用户在使用过程中提出的一些建设性意见而进行的维护活动\n- 适应性维护（Adaptive maintenance）\n\
    \  - 为适应环境的变化而修改软件的活动\n- 预防性维护（Preventive maintenance）\n  - 为了进一步改善软件系统的可维护性和可靠性，并为以后的改进奠定基础\n\
    \n## 软件工程的发展\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_9_0.png)\n\n## 本节内容\n\
    \n- 什么是软件\n  - 软件的作用、发展、定义和特性\n  - 软件危机和问题\n- 什么是工程\n- 什么是软件工程\n  - 软件工程的概念和知识域\n\
    \  - 软件工程的金三角\n  - 控制软件开发的复杂性\n  - 软件建模方法\n\n## 控制软件开发的复杂性\n\n- 软件开发常常是相复杂、不可预测、难以计划的。\n\
    - 软件开发的复杂性主要来源于：\n  - 技术的发展\n  - 不断发展\n  - 使用多项技术\n  - 需求的复杂性\n  - 规模\n  - 不断变化\n\
    \  - 人的复杂性\n- 如何控制复杂性？\n  - 抽象\n  - 分解\n  - 迭代\n\n## 本节内容\n\n- 什么是软件\n  - 软件的作用、发展、定义和特性\n\
