    +   - 丈夫和妻子是关联、聚合、还是组合？


    # Relationships: Generalization


    +   - A relationship among classes where one class shares the structure and/or
    behavior of one or more classes.

    +   - Defines a hierarchy of abstractions where a subclass inherits from one or
    more superclasses.

    +     - Single inheritance

    +     - Multiple inheritance

    +   - Is an "is a kind of" relationship.


    # Example: Single Inheritance


    +   - One class inherits from another.


    # Example: Multiple Inheritance


    +   - A class can inherit from several other classes.


    Use multiple inheritance only when needed and always with caution!


    # What Is Inherited?


    +   - A subclass inherits its parent''s attributes, operations, and relationships.

    +   - A subclass may:

    +     - Add additional attributes, operations, relationships.

    +     - Redefine inherited operations. (Use caution!)

    +   - Common attributes, operations, and/or relationships are shown at the highest
    applicable level in the hierarchy.


    Inheritance leverages the similarities among classes.'
