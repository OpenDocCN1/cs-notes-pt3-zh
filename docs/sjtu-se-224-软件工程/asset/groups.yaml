    # 结构化语言书写工规约注意事项


    +   - 语句力求简练

    +   - 语句必须简洁、易理解、无二义

    +   - 主要使用祈使句，祈使句中的动词要明确表达该要执行的操作

    +   - 所有名字必须是数据字典中有定义的名词

    +   - 不使用形容词、副词等修饰语

    +   - 不使用含义相同的词，如“修改”、“修正”等

    +   - 可以使用常用的逻辑和关系运算符号

