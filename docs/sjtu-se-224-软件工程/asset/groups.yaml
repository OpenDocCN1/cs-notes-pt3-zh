  md: "\n## 编码和版本管理\n\n- 程序设计语言\n- 编码准则和规范\n- 软件版本管理\n- 软件持续集成\n\n## 持续集成概念\n\n- 持续集成是一种软件开发实践，即团队开发成员经常集成它们的工作，通常每个成员每天至少集成一次，也就意味着每天可能会发生多次集成。\n\
    - 每次集成都通过自动化的构建（包括编译，发布，自动化测试）来验证，从而尽快地发现错误。\n\n## 持续集成流程\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_322_0.png)\n\
    \n## 持续集成示例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_322_1.png)\n\n## Software\
    \ Engineering\n\n## 软件测试\n\n## 测试组的组成\n\n- 测试经理/测试组长\n- 测试工程师\n  - 测试开发工程师\n \
    \ - 测试工程师\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_324_0.png)\n\n测试工程师和开发工程师的能力要求和工作习惯是不同的\n\
    \n## 本节内容\n\n- 测试概述\n- 测试技术\n- 测试策略\n- 测试过程\n- 自动化测试\n\n| 软件测试 |\n|---|\n| 基于知识和经验：白盒测试、黑盒测试、灰盒测试等\
    \ |\n| 基于代码：静态测试、动态测试等 |\n| 基于行为：功能测试、性能测试等 |\n| 基于时间：回归测试、维护测试等 |\n| 基于程度：单元测试、集成测试、系统测试、验收测试等\
    \ |\n| 专用测试技术：可靠性测试、兼容性测试、可用性测试等 |\n\n## 白盒测试\n\n- 白盒测试把被测软件看作一个透明的白盒子，测试人员可以完全了解软件的设计或代码，按照软件内部逻辑进行测试。\n\
    - 白盒测试又称玻璃盒测试。\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_324_1.png)\n\n## 控制流测试（属白盒测试）\n\
    \n- 1）语句覆盖法\n- 2）判定覆盖（分支）\n- 3）条件覆盖\n- 4）判定/条件覆盖\n- 5）条件组合覆盖\n- 6）路径覆盖\n\n## 1）语句覆盖法\n\
    \n- 使得程序中的每一个语句至少被遍历一次\n- 举例：对下列子程序进行测试\n\n```\nprocedure example(y,z:real;var\
    \ x:real);\nbegin\n    if (y>1) and (z=0) then x:=x/y;\n    if (y=2) or (x>1)\
    \ then x:=x+1;\nend;\n```\n\n## Software Engineering\n\n## 程序流程图\n\n- 测试用例：\n\
    \  - A=2, B=0, X=3\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_0.png)\n\n\
    ## 软件测试\n\n## 2）判定覆盖（分支）\n\n- 使得程序中每一个分支至少被遍历一次\n- 测试用例\n  - 1. A=2, B=0, X=1\n\
    \    （沿路径 ace）\n  - 2. A=1, B=0, X=0\n    （沿路径 abd）\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_1.png)\n\
    \n## 3）条件覆盖\n\n- 使得每个判定的条件取值各种可能的结果\n- 在a点 A1, A≤1, B=0, B≠0\n  在b点 A=2, A≠2,\
    \ X>1, X≤1\n- 测试用例\n  - 1. A=2, B=0, X=4\n    （沿路径 ace）\n  - 2. A=1, B=1, X=1\n\
    \    （沿路径 abd）\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_2.png)\n\n## 4）判定/条件覆盖\n\
    \n- 使得判定中的条件取得各种可能的值，并使得每个判定取得各种可能的结果\n- 测试用例\n  - 1. A=2, B=0, X=4\n    （沿路径\
    \ ace）\n  - 2. A=1, B=1, X=1\n    （沿路径 abd）\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_3.png)\n\
    \n## 5）条件组合覆盖\n\n- 使得每个判定条件的各种可能组合都至少出现一次\n- 要求\n  - 1. A1, B=0  5. A=2, X>1\n\
    \  - 2. A1, B≠0  6. A=2, X≤1\n  - 3. A≤1, B=0  7. A≠2, X>1\n  - 4. A≤1, B≠0  8.\
    \ A≠2, X≤1\n- 测试用例\n  - 1. A=2, B=0, X=4\n  - 2. A=2, B=1, X=1\n  - 3. A=1, B=0,\
    \ X=2\n  - 4. A1, B=1, X=1\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_4.png)\n\
    \n## 6）路径覆盖\n\n- 覆盖程序中所有可能的路径\n- 如果程序中包含循环，则要求每条循环至少经过一次\n\n- 测试用例：\n\n| A B X\
    \ | 覆盖路径 | L_i |\n| 2 0 3 | a c e | L1 |\n| 1 0 1 | a b d | L2 |\n| 2 1 1 | a\
    \ b c | L3 |\n| 3 0 1 | a c d | L4 |\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_5.png)\n\
