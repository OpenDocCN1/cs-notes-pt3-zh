    \n```\nif (A < B) goto 120;\nif (B < C) goto 110;\n100 write (C);\ngoto 140;\n\
    110 write (B);\ngoto 140;\n120 if (A < C) goto 130;\ngoto 100;\n130 write (A);\n\
    140 end\n```\n\n### 程序2\n\n```\nif (A < B) and (A < C) then\n    write (A)\nelse\n\
    \    if (A ≥ B) and (B < C) then\n        write (B)\n    else\n        write (C)\n\
    \    endif\nendif\n```\n\n### 源程序的文档化（code documentation）\n\n- 有意义的变量名称\n- 适当的注释\n\
