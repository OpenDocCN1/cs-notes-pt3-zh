  mdcn: "\n\n## UML 组件图 - 端口\n- **Port**\n  - 一个封装组件的特定 **窗口**，**接受与组件符合指定接口的消息**\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_206_0.png)\n\n## 依赖关系\n- 组件可以通过 **使用**\
