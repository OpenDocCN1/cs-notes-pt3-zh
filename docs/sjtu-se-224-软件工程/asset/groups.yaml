    # Sample Structure of a SAD


    +   - Architectural Representation

    +     - **Summary** of how the architecture will be described in this document,
    such as using by technical memos and the architectural views. This is useful for
    someone unfamiliar with the idea of technical memos or views. Note that not all
    views are necessary.

    +   - Architectural Factors and Decisions

    +     - **Reference** to the Supplementary Specification to view the Factor Table.
    Also, the set of technical memos the summarize the decisions.

    +   - Logical View

    +     - UML package diagrams, and class diagrams of major elements. Commentary
    on the large scale structure and functionality of major components.

    +   - Process View

    +     - UML class and interaction diagrams illustrating the processes and threads
    of the system. Group this by threads and processes that interact. Comment on how
    the interprocess communication works'
  - '[PAGE 173]


    # Sample Structure of a SAD


    +   - Use-Case View

    +     - Brief summary of the most architecturally significant use cases. UML interaction
    diagrams for some architectural significant use-case realizations, or scenarios,
    with commentary on the diagrams explaining how they illustrate the major architectural
    elements.

    +   - Deployment View

    +     - UML deployment diagrams showing the nodes and allocation of processes
    and components. Commentary on the networking.

    +   - Data View

    +     - Overview of the persistent data schema, the schema mapping from objects
    to persistent data (usually in a relational database), the mechanism of mapping
    from objects to a database, database stored procedures and triggers.

    +     - A view onto the UP Data Model, visualized with UML class diagrams used
    to describe a data model.'
  - '[PAGE 174]


