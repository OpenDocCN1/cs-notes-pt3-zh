  - '[PAGE 175]


    # Identify Design Elements


    +   - In design, **analysis classes evolve into a number of different kinds of
    design elements**

    +     - analysis classes represent conceptual things which can perform behavior

    +     - *classes*

    +       - to represent a set of rather fine-grained responsibilities;

    +     - *subsystems*

    +       - to represent a set of coarse-grained responsibilities, perhaps composed
    of a further set of subsystems, but ultimately a set of classes;

    +     - *active classes*

    +       - to represent threads of control in the system;

    +     - *interfaces*

    +       - to represent abstract declarations of responsibilities provided by a
    class or subsystem.'
  - '[PAGE 176]


    # Identify Design Elements


    +   - In addition, in design we shall also identify

    +     - *events*

    +       - which are specifications of **interesting occurrences in time and space**
    that usually (if they are noteworthy) **require some response from the system**;
    and

