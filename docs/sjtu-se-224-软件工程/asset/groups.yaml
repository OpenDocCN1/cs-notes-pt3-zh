  md: "\n# Composite Structure Diagram - Collaboration\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_1.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_2.png)\n\
    \n软件工程概论\nIntroduction to Software Engineering\n\n## CLASS DESIGN AND UML STATE\
    \ MACHINE DIAGRAM\n\n## Class Design and UML State Machine Diagram\n\n- Class\
    \ Design\n  - Create Initial Design Classes\n  - Define Operations\n  - Define\
    \ Methods\n  - Define States\n  - Define Attributes\n  - Define Dependencies\n\
    \  - Define Associations\n- UML State Machine Diagram\n\n## Class Design Considerations\n\
    \n- Class stereotype\n  - Boundary\n  - Entity\n  - Control\n- Applicable design\
    \ patterns\n- Architectural mechanisms\n  - Persistence\n  - Distribution\n  -\
    \ etc.\n\n## How Many Classes Are Needed?\n\n- **Many, simple classes** means\
    \ that each class\n  - Encapsulates **less** of the overall system intelligence\n\
    \  - Is **more** reusable\n  - Is **easier** to implement\n- **A few, complex\
    \ classes** means that each class\n  - Encapsulates a **large** portion of the\
    \ overall system intelligence\n  - Is **less** likely to be reusable\n  - Is **more\
    \ difficult** to implement\n\nA class should have a single well focused purpose.\
    \ A class should do one thing and do it well!\n\n## Strategies for Designing Entity\
    \ Classes\n\n- Entity objects are often passive and persistent\n- Performance\
    \ requirements may force some refactoring\n- See Identify Persistent Classes step\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_225_0.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_225_1.png)\n\
    \n## Strategies for Designing Control Classes\n\n- What happens to Control Classes?\n\
    \  - Are they really needed?\n  - Should they be split?\n- How do you decide?\n\
    \  - Complexity\n  - Change probability\n  - Distribution and performance\n  -\
    \ Transaction management\n\n## Operations: Where Do You Find Them?\n\n- Messages\
    \ displayed in interaction diagrams\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_227_0.png)\n\
    \n- Other implementation dependent functionality\n  - Manager functions\n  - Need\
    \ for class copies\n  - Need to test for equality\n\n## Name and Describe the\
    \ Operations\n\n- Appropriate operation names\n  - Indicate the outcome\n  - Use\
    \ client perspective\n  - Consistent across classes\n- Define operation signatures\n\
    \  - `operationName(parameter : class,...) : returnType`\n- Provide short description,\
    \ including meaning of all parameters\n\n## Guidelines: Designing Operation Signatures\n\
    \n- When designing operation signatures, consider if parameters are:\n  - Passed\
    \ by-value or by-reference?\n  - Changed by the operation?\n  - Optional?\n  -\
    \ Set to default values?\n  - In valid parameter ranges?\n- The fewer the parameters,\
    \ the better\n- Pass objects instead of “data bits”\n\n## Operation Visibility\n\
    \n- Visibility is used to enforce encapsulation\n- May be public, protected, or\
    \ private\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_230_0.png)\n\n## How Is\
    \ Visibility Noted?\n\nThe following symbols are used to specify export control:\n\
    \n- **+ Public access**\n- **# Protected access**\n- **- Private access**\n\n\
    | Class |\n|---|\n| - privateAttribute |\n| # protectedAttribute |\n| +publicOp()\
    \ |\n| # protectedOp() |\n| - privateOp() |\n\n## Scope\n\n- Determines number\
    \ of instances of the attribute/operation\n  - Instance: one instance for each\
    \ class instance\n  - Classifier: one instance for all class instances\n- Classifier\
    \ scope is denoted by underlining the attribute/operation name\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_232_0.png)\n\
    \n## Example: Scope\n\n<<entity>>\nStudent\n- name\n- address\n- studentID\n-\
    \ nextAvailID : int\n+ addSchedule(theSchedule : Schedule, forSemester : Semester)\n\
    + getSchedule(forSemester : Semester) : Schedule\n+ hasPrerequisites(forCourseOffering\
    \ : CourseOffering) : boolean\n# passed(theCourseOffering : CourseOffering) :\
    \ boolean\n+ getNextAvailID() : int\n"
  mdcn: "\n\n# 复合结构图 - 协作\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_1.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_219_2.png)\n\
    \n软件工程概论\nIntroduction to Software Engineering\n\n## CLASS DESIGN AND UML STATE\
    \ MACHINE DIAGRAM\n\n## 类设计与 UML 状态机图\n\n- Class Design\n  - Create Initial Design\
    \ Classes\n  - Define Operations\n  - Define Methods\n  - Define States\n  - Define\
    \ Attributes\n  - Define Dependencies\n  - Define Associations\n- UML State Machine\
    \ Diagram\n\n## 类设计考虑因素\n\n- Class stereotype\n  - Boundary\n  - Entity\n  - Control\n\
    - Applicable design patterns\n- Architectural mechanisms\n  - Persistence\n  -\
    \ Distribution\n  - etc.\n\n## 需要多少个类？\n\n- **许多简单类**意味着每个类\n  - 封装了**更少**的整体系统智能\n\
    \  - **更**可重用\n  - **更容易**实现\n- **少数复杂类**意味着每个类\n  - 封装了整体系统智能的**较大**部分\n  - **不太**可能被重用\n\
    \  - **更难**实现\n\n一个类应该有一个单一且聚焦的目的。一个类应该只做一件事并且做好！\n\n## 设计实体类的策略\n\n- 实体对象通常是被动且持久的\n\
    - 性能要求可能迫使进行一些重构\n- 参见 Identify Persistent Classes 步骤\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_225_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_225_1.png)\n\n## 设计控制类的策略\n\n- 控制类会发生什么？\n\
    \  - 它们真的需要吗？\n  - 应该拆分吗？\n- 如何决定？\n  - 复杂度\n  - 变更概率\n  - 分布和性能\n  - 事务管理\n\n\
    ## 操作：你在哪里找到它们？\n\n- 交互图中所显示的消息\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_227_0.png)\n\
    \n- 其他实现相关的功能\n  - 管理函数\n  - 需要类副本\n  - 需要测试相等性\n\n## 命名和描述操作\n\n- 适当的操作名称\n \
    \ - 表明结果\n  - 使用客户端视角\n  - 在类之间保持一致\n- 定义操作签名\n  - `operationName(parameter :\
    \ class,...) : returnType`\n- 提供简短描述，包括所有参数的含义\n\n## 指南：设计操作签名\n\n- 设计操作签名时，考虑参数是否：\n\
    \  - 按值传递还是按引用传递？\n  - 被操作更改？\n  - 可选？\n  - 设置为默认值？\n  - 在有效参数范围内？\n- 参数越少越好\n\
    - 传递对象而不是“数据位”\n\n## 操作可见性\n\n- 可见性用于强制封装\n- 可能是 public、protected 或 private\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_230_0.png)\n\n## 如何表示可见性？\n\n以下符号用于指定导出控制：\n\
    \n- **+ Public access**\n- **# Protected access**\n- **- Private access**\n\n\
    | Class |\n|---|\n| - privateAttribute |\n| # protectedAttribute |\n| +publicOp()\
    \ |\n| # protectedOp() |\n| - privateOp() |\n\n## 作用域\n\n- 确定属性/操作的实例数量\n  - Instance:\
    \ 每个类实例一个实例\n  - Classifier: 所有类实例共用一个实例\n- 分类器作用域用下划线属性/操作名称表示\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_232_0.png)\n\
    \n## 示例：作用域\n\n<<entity>>\nStudent\n- name\n- address\n- studentID\n- nextAvailID\
    \ : int\n+ addSchedule(theSchedule : Schedule, forSemester : Semester)\n+ getSchedule(forSemester\
    \ : Semester) : Schedule\n+ hasPrerequisites(forCourseOffering : CourseOffering)\
    \ : boolean\n# passed(theCourseOffering : CourseOffering) : boolean\n+ getNextAvailID()\
    \ : int\n\n"
