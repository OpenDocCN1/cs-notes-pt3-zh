  - '[PAGE 125]


    # REP: The Release-Reuse Equivalency Principle


    +   - The Release-Reuse Equivalency Principle

    +   - The **granule of reuse** is the **granule of release**

    +     - The granularity of reuse is the granularity of release

    +     - packages are usually the **basic unit** of development work and of release

    +     - In order to provide the guarantees that reusers need, authors must organize
    their software into **reusable packages** and then **track those packages with
    release numbers**

    +     - the granule of reuse (i.e., a package) can be **no smaller than** granule
    of release.

    +       - Anything that we reuse must also be released and tracked.

    +     - **Either** all of the classes in a package are reusable **or** none of
    them are.

    +       - If a package contains software that should be reused, then it should
    not also contain software that is not designed for reuse.'
  - '[PAGE 126]


    # CRP: The Common Reuse Principle


    +   - The Common Reuse Principle

    +     - The classes in a package are reused together.

    +       - If you reuse one of the classes in a package, you reuse them all.

    +   - CRP helps us to decide which classes should be placed into a package

    +     - classes that tend to be reused together belong in the same package.

    +   - CRP tell us more about what classes shouldn''t be together.

    +     - classes which are not tightly bound to each other with class relationships
    should not be in the same package.'
  - '[PAGE 127]


    # CRP: The Common Reuse Principle


    +   - **Guideline:** Factor out Independent Types


    +     - Organize types that can be used independently or in different contexts
    into separate packages.


    +   - **Example**


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_127_0.png)'
  - '[PAGE 128]


    # CCP: The Common Closure Principle


    +   - The Common Closure Principle

    +     - The classes in a package should be closed together **against the same
    kinds of changes**.

    +       - A change that affects a package affects all the classes in that package
    and no other package

    +     - maintainability is more important

    +   - Guideline: Package by Work and by Clusters of Unstable Classes

    +     - Reduce widespread dependency on unstable packages

    +     - Example:

    +       - 1) there is an existing large package **P1** with thirty classes, and

    +       - 2) there is a work trend that a particular subset of ten classes is
    regularly modified and re-released.

    +         - refactor P1 into **P1-a** and **P1-b**, where P1-b contains the ten
    frequently worked on classes.'
  - '[PAGE 129]


    # ADP: The Acyclic Dependencies Principle


    +   - The Acyclic Dependencies Principle

    +     - Allow **no cycles** in the package-dependency graph.

    +   - There are two solutions:

    +     - Factor out the types participating in the cycle into **a new smaller package**.

    +     - Break the cycle with **an interface**.


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_129_0.png)'
