    \n## Aggregation: Shared Vs. Non-shared\n\n### ◆ Shared Aggregation\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_1.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_259_2.png)\n\
