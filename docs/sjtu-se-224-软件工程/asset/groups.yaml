    # 控制软件开发的复杂性


    +   - 软件开发常常是相复杂、不可预测、难以计划的。

    +   - 软件开发的复杂性主要来源于：

    +     - 技术的发展

    +     - 不断发展

    +     - 使用多项技术

    +     - 需求的复杂性

