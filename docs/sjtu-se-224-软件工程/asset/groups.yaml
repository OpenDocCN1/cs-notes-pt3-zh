  md: "\n## N-S图示例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_91_0.png)\n\n## 问题分析图(PAD)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_91_1.png)\n\n## PAD示例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_91_2.png)\n\
    \n## PDL (Program Design Language)\n\n- PDL是一种用于描述功能模块的算法设计和加工细节的语言。称为设计程序语言。它是一种伪码。\n\
    - 伪码的语法规则分为“外语法”和“内语法”。\n- PDL具有严格的关键字外语法，用于定义控制结构和数据结构，同时它的表示实际操作和条件的内语法可使用自然语言的词汇。\n\
    \n## 示例: 拼写检查程序\n\n```\nPROCEDURE spellcheck IS\nBEGIN\nsplit document into single\
    \ words\nlook up words in dictionary\ndisplay words which are not in dictionary\n\
    create a new dictionary\nEND spellcheck\n```\n\n## 软件工程\n\n## Module: 面向对象设计\n\
    \n上海交通大学软件工程中心\n\n## Agenda\n\n- OO Design Overview\n- The Principles of Object-Oriented\
    \ Design\n- Architectural Design\n- Component Design\n- Class Design\n- From Design\
    \ to Implementation\n\n## 软件工程概论\n\nIntroduction to Software Engineering\n\n##\
    \ OO DESIGN OVERVIEW\n\n## Understanding Design\n\n- A process that uses the products\
    \ of analysis to produce a specification for implementing a system.\n- A logical\
    \ description of how a system will work.\n- Emphasizes a conceptual solution (in\
    \ software and hardware) that fulfills the requirements, rather than its implementation.\n\
    - “do the right thing (analysis), and do the thing right (design)”\n\n## Analysis\
    \ Versus Design\n\n### Analysis\n\n- Focus on understanding the problem\n- Idealized\
    \ design\n- Behavior\n- System structure\n- Functional requirements\n- A small\
    \ model\n\n### Design\n\n- Focus on understanding the solution\n- Operations and\
    \ attributes\n- Performance\n- Close to real code\n- Object lifecycles\n- Nonfunctional\
    \ requirements\n- A large model\n\n## Object Oriented Design\n\n- The specification\
    \ of a logical software solution in terms of software objects,\n  - such as their\
    \ classes, attributes, methods, and collaborations.\n- During object-oriented\
    \ design (or simply, object design) there is an emphasis on defining software\
    \ objects and how they collaborate to fulfill the requirements.\n\n## 软件工程概论\n\
    \nIntroduction to Software Engineering\n\n## THE PRINCIPLES OF OBJECT-ORIENTED\
    \ DESIGN\n\n## SRP: The Single – Responsibility Principle\n\n### Separating Coupled\
    \ Responsibilities\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_101_0.png)\n\n\
    ## SRP: The Single – Responsibility Principle\n\n### Separating Coupled Responsibilities\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_102_0.png)\n\n## LSP: The Liskov Substitution\
    \ Principle\n\n### The Liskov Substitution Principle\n\n- subtypes must be substitutable\
    \ for their base types\n  - SubClass can be used instead of parent Class\n- If\
    \ for each object o1 of type S there is an object o2 of type T such that for all\
    \ programs P defined in terms of T, the behavior of P is unchanged when o1 is\
    \ substituted for o2 then S is a subtype of T [Liskov88].\n  - If using implementation\
    \ of T or subclass of T to be used instead of T, Software P which is associated\
    \ with type T(interface or abstract class) can work well.\n- Essential: the objects\
    \ which is in the same inherit architecture should have behavior features.\n\n\
    ### Example:\n\n- In real world, penguin and bird is a “is-a” relationship. If\
    \ we design penguin is a subclass of bird class, we violate LSP principle. because\
    \ bird can fly() while penguin can not fly. So how to change this design?\n\n\
    ## LSP: The Liskov Substitution Principle\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_104_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_104_1.png)\n\n## DIP: The Dependency\
    \ Inversion Principle\n\n- The Dependency Inversion Principle\n  - High-level\
    \ modules should **not** depend on low-level modules.\n    - Both should depend\
    \ on abstractions\n  - Abstraction should **not** depend on details\n    - Details\
    \ should depend on abstractions\n- Example\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_105_0.png)\n\
    \n## DIP: The Dependency Inversion Principle\n\n- Depend on Abstractions\n- Naive\
    \ model of a Button and a Lamp\n- Dependency inversion applied to the Lamp\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_106_0.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_106_1.png)\n"
