  md: "\n## Architectural Information in the UP Artifacts\n\n- The architectural decisions\
    \ are recorded in the SAD (Software Architecture Document).\n  - This includes\
    \ the technical memos and descriptions of the architectural views.\n\n## Sample\
    \ Structure of a SAD\n\n- Architectural Representation\n  - **Summary** of how\
    \ the architecture will be described in this document, such as using the technical\
    \ memos and the architectural views. This is useful for someone unfamiliar with\
    \ the idea of technical memos or views. Note that not all views are necessary.\n\
    - Architectural Factors and Decisions\n  - **Reference** to the Supplementary\
    \ Specification to view the Factor Table. Also, the set of technical memos that\
    \ summarize the decisions.\n- Logical View\n  - UML package diagrams, and class\
    \ diagrams of major elements. Commentary on the large scale structure and functionality\
    \ of major components.\n- Process View\n  - UML class and interaction diagrams\
    \ illustrating the processes and threads of the system. Group this by threads\
    \ and processes that interact. Comment on how the interprocess communication works.\n\
    - Use-Case View\n  - Brief summary of the most architecturally significant use\
    \ cases. UML interaction diagrams for some architecturally significant use-case\
    \ realizations, or scenarios, with commentary on the diagrams explaining how they\
    \ illustrate the major architectural elements.\n- Deployment View\n  - UML deployment\
    \ diagrams showing the nodes and allocation of processes and components. Commentary\
    \ on the networking.\n- Data View\n  - Overview of the persistent data schema,\
    \ the schema mapping from objects to persistent data (usually in a relational\
    \ database), the mechanism of mapping from objects to a database, database stored\
    \ procedures and triggers.\n  - A view onto the UP Data Model, visualized with\
    \ UML class diagrams used to describe a data model.\n\n## Identify Design Elements\n\
    \n- **Purpose:**\n  - To analyze interactions of analysis classes to identify\
    \ design model elements.\n- Identify **Classes**, **Active Classes** and **Subsystems**\n\
    - Identify **Subsystem Interfaces**\n- Identify and Specify **Events**\n- Identify\
    \ and Specify **Signals**\n- In design, **analysis classes evolve into a number\
    \ of different kinds of design elements**\n  - analysis classes represent conceptual\
    \ things which can perform behavior\n  - *classes*\n    - to represent a set of\
    \ rather fine-grained responsibilities;\n  - *subsystems*\n    - to represent\
    \ a set of coarse-grained responsibilities, perhaps composed of a further set\
    \ of subsystems, but ultimately a set of classes;\n  - *active classes*\n    -\
    \ to represent threads of control in the system;\n  - *interfaces*\n    - to represent\
    \ abstract declarations of responsibilities provided by a class or subsystem.\n\
    - In addition, in design we shall also identify\n  - *events*\n    - which are\
    \ specifications of **interesting occurrences in time and space** that usually\
    \ (if they are noteworthy) **require some response from the system**; and\n  -\
    \ *signals*\n    - to represent **asynchronous mechanisms** used to communicate\
    \ certain types of events within the system.\n- Events and the Signals that are\
    \ used to communicate them, allow us to describe the asynchronous triggers of\
    \ behavior to which the system must respond.\n\n## 软件工程概论\nIntroduction to Software\
    \ Engineering\n\n## SUBSYSTEM DESIGN\n\n## Subsystem Design Overview\n\nDesign\
    \ Subsystems and Interfaces  \nUse-Case Realization  \nDesign Guidelines  \nSubsystem\
    \ Design  \nDesign Subsystems and Interfaces (updated)  \nUse-Case Realization\
    \ (updated)  \nDesign Classes\n\n## Subsystem Design - Purpose\n\n- To define\
    \ the behaviors specified in the subsystem's interfaces in terms of collaborations\
    \ of contained classes\n- To document the internal structure of the subsystem\n\
    - To define realizations between the subsystem's interfaces and contained classes\n\
    - To determine the dependencies upon other subsystems\n"
  mdcn: "\n\n## UP 工件中的架构信息\n\n- 架构决策记录在 SAD（软件架构文档）中。\n  - 这包括技术备忘录和架构视图的描述。\n\n\
    ## SAD 的示例结构\n\n- 架构表示\n  - **摘要** 说明本文件将如何描述架构，例如使用技术备忘录和架构视图。这对于不熟悉技术备忘录或视图概念的人很有用。请注意，并非所有视图都是必要的。\n\
    - 架构因素和决策\n  - **参考** 补充规范以查看因素表。此外，总结决策的一组技术备忘录。\n- 逻辑视图\n  - UML 包图，以及主要元素的类图。对主要组件的大规模结构和功能进行评述。\n\
    - 流程视图\n  - 说明系统进程和线程的 UML 类图和交互图。按交互的线程和进程分组。评述进程间通信的工作方式。\n- 用例视图\n  - 对最具架构意义的用例进行简要总结。某些具有架构意义的用例实现或场景的\
    \ UML 交互图，并附带对图表的评述，解释它们如何说明主要的架构元素。\n- 部署视图\n  - 显示节点以及进程和组件分配的 UML 部署图。对网络进行评述。\n\
    - 数据视图\n  - 持久数据模式的概述，从对象到持久数据（通常在关系数据库中）的模式映射，从对象到数据库的映射机制，数据库存储过程和触发器。\n  -\
    \ 对 UP 数据模型的视图，使用 UML 类图可视化以描述数据模型。\n\n## 识别设计元素\n\n- **目的：**\n  - 分析分析类的交互以识别设计模型元素。\n\
    - 识别 **类**、**活动类** 和 **子系统**\n- 识别 **子系统接口**\n- 识别并指定 **事件**\n- 识别并指定 **信号**\n\
    - 在设计中，**分析类演化为多种不同的设计元素**\n  - 分析类代表可以执行行为的概念事物\n  - *类*\n    - 表示一组相对细粒度的职责；\n\
    \  - *子系统*\n    - 表示一组粗粒度的职责，可能由进一步的子系统集合组成，但最终是一组类；\n  - *活动类*\n    - 表示系统中的控制线程；\n\
    \  - *接口*\n    - 表示由类或子系统提供的职责的抽象声明。\n- 此外，在设计中我们还将识别\n  - *事件*\n    - 其是 **在时间和空间上发生的有趣事件**\
    \ 的规范，通常（如果值得注意）**需要系统做出响应**；以及\n  - *信号*\n    - 用于表示 **用于在系统内部通信某些类型事件的异步机制**。\n\
    - 事件以及用于通信它们的信号，使我们能够描述系统必须响应的行为的异步触发。\n\n## 软件工程概论\nIntroduction to Software\
    \ Engineering\n\n## 子系统设计\n\n## 子系统设计概述\n\n设计子系统和接口  \n用例实现  \n设计指南  \n子系统设计 \
    \ \n设计子系统和接口（更新）  \n用例实现（更新）  \n设计类\n\n## 子系统设计 - 目的\n\n- 以包含类的协作形式定义子系统接口中指定的行为\n\
    - 记录子系统的内部结构\n- 定义子系统接口与包含类之间的实现关系\n- 确定对其他子系统的依赖关系\n\n"
