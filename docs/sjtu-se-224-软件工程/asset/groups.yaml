    # 判定表


    +   - 判定表的组成元素

    +     - 条件桩(Condition Stub)：列出与条件有关的项目，如发货金额、截止天数等，每行对应一个条件

    +     - 条件项(Condition entry)：列出各条件桩的取值。条件条目的取值通常只有两个可能值

    +     - 动作桩(action stub)：列出所有可能采取的动作，如发出发货单等

    +     - 动作项(action entry)：列出各条件组合下应采取的动作


