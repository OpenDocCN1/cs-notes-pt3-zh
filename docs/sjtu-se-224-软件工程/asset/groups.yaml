    \  - UI objects in the **higher** Presentation layer implement an interface such\
    \ as **PropertyListener** or **AlarmListener**, and are subscribers or listeners\
    \ to events (such as property or alarm events) coming from objects in the lower\
    \ layers.\n  - The **lower** layer objects are directly sending messages to the\
    \ upper layer UI objects, but the coupling is only to the objects viewed as things\
    \ that implement an interface such as **PropertyListener**, **not** viewed as\
    \ specific **GUI windows**.\n\n## N-Tier (C/S)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_158_0.png)\n\
