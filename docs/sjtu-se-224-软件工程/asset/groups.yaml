    # 常见的架构风格


    +   - From Mud to Structure: Organize components.

    +     - Layers: Organize components into layers where layer''s services are only
    used by layer i+1.

    +     - Pipes and Filters: Divide the task into several sequential processing
    steps – the output of task i is the input of task i+1.

    +     - Blackboard: Several independent programs work cooperatively on a common
    data structure.

    +   - Distributed Systems :Handle distributed computation.

    +     - Broker: Introduce a broker component to achieve better decoupling of clients
    and servers – brokers accept requests from clients and forward the requests to
    servers, then return the results back to the clients.

    +     - Client/Server

    +     - 3 Tiers


    # 常见的架构风格（续）


    +   - Interactive Systems: Keep a program''s functional core independent of the
    user interface

    +     - Model - View - Controller: Divides the application into processing, output,
    and input. View and controller parts are usually observers of the model via the
    observer pattern

    +     - Presentation - Abstract - Control: Divides the application up to hierarchies
    of MVC-like components. Each component is dependent upon and provides functionality
    for a higher-level component. There is only one top-level component

    +   - Adaptable Systems : Design for change

    +     - Microkernel Encapsulate the fundamental services of the application

    +     - Reflection Divide the application into a meta-level and a base level to
    make the application "self-aware". The meta level encapsulates knowledge of the
    system, while the base level encapsulates knowledge about the problem domain

    +   - Others


    # MVC


    模型Model：管理系统中存储的数据和业务规则，并执行相应的功能

    视图View：相对于模型生成供用户使用的交互界面。不同的视图可以对相同的数据产生不同的表现

    控制器Control：接收用户输入，通过调用模型来响应，并通知视图进行用户界面更新


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_78_1.png)


    # 管道和过滤器（Pipes and Filters）风格


    +   - In this style, each component has a set of inputs and a set of outputs.

    +   - A component reads streams of data on its inputs and produces streams of
    data on its output.


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_78_2.png)


    # 管道和过滤器架构举例


    +   - Linux的Shell程序可以看做是典型的管道过滤器架构的例子

    +   - 如下面的Shell例子：

    +     - $cat TestResults | sort | grep Good

    +     - 会将TestResults文件的内容读入运行，然后找出其中包含单词Good的行，并按照在整行上，Shell首先cat、sort和grep依次执行，就构成了一个管道过滤器架构。


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_78_3.png)'
