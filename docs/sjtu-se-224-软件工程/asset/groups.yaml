  - '[PAGE 199]


    # Components in UML


    +   - One of the most important amendments in UML is to enhance the support of
    CBSD

    +     - In UML

    +       - components can used for the entire life-cycle modeling, and finally
    **optimized** in the deployment or run-time environment.

    +     - The **internal structures** of component can be described using composite
    structure diagram.

