    - 不是具体的表现形式，表示某事物的理想本质。\n\n### Example: Abstraction\n\n### What Is Encapsulation?\n\
    \n- 将实现细节隐藏于客户端之外。\n- 客户端依赖于接口。\n\nImproves Resiliency\n\n### Encapsulation Illustrated\n\
    \n- Professor Clark needs to be able to teach four classes in the next semester.\n\
    \n## Software Engineering\n\n### What Is a Package?\n\n- 用于将元素组织成组的通用机制。\n- 可以包含其他模型元素的模型元素。\n\
    - 包可以用于：\n  - 组织正在开发的模型。\n  - 作为配置管理的单元。\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_50_0.png)\n\
    \n## 面向对象分析\n\n### Package 示例\n\nThe package, University Artifacts, contains one\
    \ package and five classes.\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_50_1.png)\n\
    \n## 面向对象分析\n\n- 面向对象方法概述\n- 面向对象的基本概念\n- 用例建模\n- 建立概念模型\n- 用例分析\n\n### 面向对象分析的步骤\n\
    \n1. 用例建模\n2. 建立概念模型\n3. 用例分析\n\n### 面向对象分析的步骤\n\n1. 用例建模\n   1.1 识别actor和use\
    \ case，画Use-Case图\n   1.2 编写Use-Case Spec.\n   1.3 优化Use-Case图的结构\n2. 建立概念模型\n\
    3. 用例分析\n\n### Use Case技术\n\n- 提供涉众的观点\n- 定义功能需求\n- 促进理解和讨论\n  - 为什么需要系统？\n  -\
    \ 谁和系统交互 (actors)?\n  - 用户希望如何使用系统 (use cases)?\n  - 系统应该有什么接口？\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_50_2.png)\n\
    \n### Use-Case 模型的组成\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_51_0.png)\n\n\
    ### 面向对象分析的步骤\n\n1. 用例建模\n   1.1 识别actor和use case，画Use-Case图\n   1.2 编写Use-Case\
    \ Spec.\n   1.3 优化Use-Case图的结构\n2. 建立概念模型\n3. 用例分析\n\n### Actor 和 Use Case\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_51_1.png)\n\n**Actor**\n\n和系统交互的系统外的某些人或某些系统：\n\
    \n- 终端用户\n- 外界软硬件系统\n- 外部硬件设备\n\n**Use case**\n\nActor 想要用系统去做的事\n\n### 如何识别Actor\n\
    \n- 需要在系统的帮助下完成自己的任务？\n- 需要谁去执行系统的核心功能？\n- 需要谁去完成系统的管理和维护？\n- 系统是否需要和外界的硬件或软件系统进行交互？\n\
    \n### 如何识别Use Case\n\n- 每个actor的目标和需求是什么？\n- actor希望系统提供什么功能？\n- actor 将创建、存储、修改和删除数据吗？\n\
    - actor 是否告知系统外界的事件？\n- actor 需要被告知系统中发生的事件吗？\n\n### 避免功能分解\n\n**现象**\n\n- use\
    \ case 太小\n- use cases 太多\n- Use case 没有信息回报\n- 命名以频繁的动作\n  - \"Operation\" +\
    \ \"object\"\n  - \"Function\" + \"data\"\n  - Example: \"Insert Card\"\n- 很难理解整个模型\n\
    \n**纠正措施**\n\n- 寻找更大的上下文\n- \"为什么你要做本系统呢？\"\n- 注意自己在用户的角度 \"用户想要得到什么\"\n- \"这个\
    \ use case 能满足谁的需求？\"\n- \"这个 use case 能够值什么？\"\n- \"这个 use case 还有其它故事？\"\n\n\
    一个用例定义了和actor之间的一次完整对话。\n\n"
