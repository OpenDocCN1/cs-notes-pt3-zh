    \ Java EE vs .NET\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_196_0.png)\n\n##\
    \ Java EE vs .NET\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_197_0.png)\n\n##\
    \ Components in UML\n\n- Modular unit with well-defined interfaces that is replaceable\
    \ within its environment\n- Autonomous unit within a system\n  - Has one or more\
    \ provided and required interfaces\n  - Its internals are hidden and inaccessible\n\
    \  - A component is encapsulated\n  - Its dependencies are designed such that\
    \ it can be treated as independently as possible\n\n## Components in UML\n\n-\
    \ One of the most important amendments in UML is to enhance the support of CBSD\n\
    \  - In UML\n    - components can used for the entire life-cycle modeling, and\
    \ finally **optimized** in the deployment or run-time environment.\n  - The **internal\
    \ structures** of component can be described using composite structure diagram.\n\
    \  - component conforms to and provides the realization of a set of interfaces,\n\
    \    - as a **replaceable part of a system**, component encapsulates the behavior\
    \ and states of its internal elements\n  - Components can be **assembled**\n \
    \   - and connected the interfaces between collaborating components to provide\
    \ system functionality\n\n## UML Component Diagram\n\n- shows an encapsulated\
    \ class and its interfaces, ports, and internal structure consisting of nested\
    \ components and connectors.\n- address the static design implementation view\
    \ of a system.\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_200_0.png)\n\n## UML\
    \ Component Notation\n\n- A component is shown as a rectangle with\n  - A keyword\
    \ <<component>>\n  - Optionally, in the right hand corner a component icon can\
    \ be displayed\n    - A component icon is a rectangle with two smaller rectangles\
    \ jutting out from the left-hand side\n    - This symbol is a visual stereotype\n\
    \  - The component name\n\n- Components can be labeled with a stereotype there\
    \ are a number of standard stereotypes\n  - ex: <<entity>>, <<subsystem>>\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_201_0.png)\n\n## UML Component Diagram\
    \ - Component\n\n## Component\n\n- a replaceable part of a system that conforms\
    \ to and provides the realization of a set of interfaces\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_0.png)\n\
    \n## Component and Interface\n\n- Component uses Interface\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_1.png)\n\
    \n- Component implements Interface\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_2.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_3.png)\n\n## External view of a\
    \ component\n\n- A component have an **external view** and an **internal view**\n\
    \  - An **external view** (or black box view) shows publicly visible properties\
    \ and operations\n  - An external view of a component is by means of interface\
    \ symbols sticking out of the component box\n  - The interface can be listed in\
    \ the **compartment** of a component box\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_203_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_203_1.png)\n\n## Internal view of a\
    \ component\n\n- An **internal**, or **white box view** of a component is where\
    \ the realizing classes/components are **nested** within the component shape.\n\
    - Realization is a relationship between two set of model elements\n  - One represents\
    \ a specification\n  - The other represent an implementation of the latter\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_204_0.png)\n\n## UML Component Diagram\
    \ - Interface\n\n- a collection of operations that specify a service that is provided\
    \ by or requested from a class or component\n- provided interface\n  - Characterize\
    \ services that the component offers to its environment\n- required interface\n\
    \  - Characterize services that the component expects from its environment\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_205_0.png)\n"
  mdcn: "\n\n## Sun Java EE\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_193_0.png)\n\
    \n## Microsoft .NET\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_194_0.png)\n\n\
    ## Java EE 与 .NET 的对比\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_195_0.png)\n\
    \n## Java EE 与 .NET 的对比\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_196_0.png)\n\
    \n## Java EE 与 .NET 的对比\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_197_0.png)\n\
    \n## UML 中的组件\n\n- 模块化单元，具有定义良好的接口，在其环境中可替换\n- 系统内的自治单元\n  - 拥有一个或多个提供接口和需求接口\n\
    \  - 其内部是隐藏且不可访问的\n  - 组件是封装的\n  - 其依赖关系经过设计，使其能够尽可能独立地被对待\n\n## UML 中的组件\n\n\
    - UML 中最重要的修订之一是对 CBSD（基于组件的软件开发）支持的增强\n  - 在 UML 中\n    - 组件可用于整个生命周期的建模，并最终在部署或运行时环境中进行**优化**。\n\
    \  - 组件的**内部结构**可以使用组合结构图来描述。\n  - 组件遵循并实现一组接口，\n    - 作为系统的**可替换部分**，组件封装了其内部元素的行为和状态\n\
    \  - 组件可以被**组装**\n    - 并连接协作组件之间的接口，以提供系统功能\n\n## UML 组件图\n\n- 展示一个封装类及其接口、端口，以及由嵌套组件和连接器组成的内部结构。\n\
    - 描述系统的静态设计实现视图。\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_200_0.png)\n\n##\
    \ UML 组件表示法\n\n- 组件显示为一个矩形，带有\n  - 关键字 <<component>>\n  - 可选地，在右侧角落可以显示一个组件图标\n\
    \    - 组件图标是一个矩形，从左侧突出两个较小的矩形\n    - 该符号是一种可视化的构造型\n  - 组件名称\n\n- 组件可以用构造型进行标记，有若干标准构造型\n\
    \  - 例如：<<entity>>、<<subsystem>>\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_201_0.png)\n\
    \n## UML 组件图 - 组件\n\n## 组件\n\n- 系统中可替换的部分，它遵循并提供一组接口的实现\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_0.png)\n\
    \n## 组件与接口\n\n- 组件使用接口\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_1.png)\n\
    \n- 组件实现接口\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_2.png)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_202_3.png)\n\
    \n## 组件的外部视图\n\n- 组件具有**外部视图**和**内部视图**\n  - **外部视图**（或黑盒视图）显示公开可见的属性和操作\n  -\
    \ 组件的外部视图通过从组件框伸出的接口符号来表示\n  - 接口可以列在组件框的**分隔栏**中\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_203_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_203_1.png)\n\n## 组件的内部视图\n\n- 组件的**内部视图**（或白盒视图）是指实现类/组件**嵌套**在组件形状内部。\n\
    - 实现是两组模型元素之间的关系\n  - 一组表示规范\n  - 另一组表示对后者的实现\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_204_0.png)\n\
    \n## UML 组件图 - 接口\n\n- 一组操作的集合，这些操作指定了由类或组件提供或请求的服务\n- 提供接口\n  - 描述组件向其环境提供的服务\n\
    - 需求接口\n  - 描述组件期望从环境获得的服务\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_205_0.png)\n\
    \n"
