  - "[PAGE 2]\n\n# Software Engineering\n\n# 软件工程引论\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_2_0.png)\n\
    \n# 本节内容\n\n+   - 什么是软件\n+     - 软件的作用、发展、定义和特性\n+     - 软件危机和问题\n+   - 什么是工程\n\
    +   - 什么是软件工程\n+     - 软件工程的概念和误读\n+     - 软件工程的三个角\n+     - 控制软件开发的复杂性\n+   \
    \  - 软件建模及方法\n\n# 计算机软件已经成为一种驱动力\n\n+   - 进行商业活动的引擎；\n+   - 现代科学研究和工程问题解决的基础；\n\
    +   - 区分现代产品和服务的关键因素；\n+   - 现代社会中不可缺少的。\n+   \n+   应用于：\n+   交通、医疗、通讯、军事、娱乐、办公、社交、学习……\n\
    +   \n+   举例：Dell, Amazon, 淘宝, Ctrip等成功案例\n+   \n+   “智能地球”\n\n# 软件的定义\n\n**软件是**\n\
    \n- 能够完成预定功能和性能的可执行的指令（计算机程序）；\n- 使得程序能够适当地操作信息的数据结构；\n- 描述程序的操作和使用的文档。\n\n现在，被普遍接受的软件的定义是：\n\
    \n软件（software）是计算机系统中与硬件（hardware）相互依存的另一部分，它包括程序（program）、相关数据（data）及说明文档（document）。\n\
    \n# 软件特征\n\n+   - 软件开发不同于硬件设计\n+     - 与硬件设计相比，软件更依赖于开发人员的业务素养、智力，以及人的组织、合作和管理。同时软硬件同样有设计成本，但软件在产品成本中的一小部分，而软件开发占整个产品成本的大部分。\n\
    +   - 软件生产不同于硬件制造\n+     - 硬件设计完成后就投入批量制造，制造也是一个复杂的过程，其间可能犯下质量问题；而软件成为产品之后，其制造只是简单的拷贝而已，软件的制造和运输也非常简单。\n\
    +   - 软件维护不同于硬件维修\n+     - 软件在运行的初期有较高的故障率，在错误修正后的一段时间中，故障率会降到一个较低且稳定的水平。随着时间的迁移，故障率将再次升高，这是因为硬件不会受到摩损等因素，而软件是发生在程序逻辑中，软件是能够不断的更换和升级的，但不会损耗使用过之后软件的缺陷可能会变得比以前更严重。如果软件内部的逻辑关系比较复杂，在维护过程中还可能产生新的错误。\n\
    \n# 软件是被设计的\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_2_1.png)"
