  md: "\n## 软件是一门什么学科？\n\n- 软件开发\n  - 是一门艺术？\n  - 是一门科学？\n  - 是一门工程？\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_5_0.png)\n\
    \n## 什么是工程？\n\n- 工程是对技术（或社会）实体的分析、设计、建造、验证和管理。\n- 工程是一种组织良好、管理严密、各类人员协同配合、共同完成工作的学科。\n\
    - 它具有以下特性：\n  - 以价值为目标\n  - 高度的组织管理性\n  - 多种学科的综合\n  - 高度的实践性\n\n## 如何做工程？\n\n\
    - 一个工程实践包括以下四个核心步骤：\n  - 理解问题。在软件工程领域，就是需求分析；\n  - 规划方案。在软件工程领域，就是设计；\n  - 实施计划。在软件工程领域，就是编码；\n\
    \  - 验证结果的准确性。在软件工程领域，就是测试和质量保证。\n\n## 本节内容\n\n- 什么是软件\n  - 软件的作用、发展、定义和特性\n \
    \ - 软件危机和问题\n- 什么是工程\n- 什么是软件工程\n  - 软件工程的概念和知识域\n  - 软件工程的金三角\n  - 控制软件开发的复杂性\n\
    \  - 软件建模及方法\n\n## 软件工程的经典定义\n\n> “The establishment and use of sound engineering\
    \ principles in order to obtain economically software that is reliable and works\
    \ on real machines.” [Fritz Bauer]\n\n> 软件工程就是为了经济地获得可靠的且能在实际机器上高效运行的软件而建立和使用的工程原理。\n\
    \n## 软件工程的经典定义(Cont.)\n\n> “The application of a systematic, disciplined, quantifiable\
    \ approach to the development, operation, and maintenance of software” [IEEE 1990]\n\
    \n> 软件工程是将系统的、规范的、可量化的方法应用于软件的开发、运行和维护，即将工程化应用于软件。\n\n## 软件工程的经典定义(Cont.)\n\n\
    - “Software engineering is that form of engineering that applies the principles\
    \ of computer science and mathematics to achieving cost-effective solutions to\
    \ software problems.” [CMU/SEI-90-TR-003]\n- 软件工程就是应用计算机科学和数学的原理来经济有效地解决软件问题的一种工程。\n\
    \n## 软件工程是一个国家的战略性学科\n\n- 软件工程的发展受到了美国DOD的极大推动\n- CMU SEI\n- 如果一个国家的软件工程不强，那么这个国家就不会强大\n\
    - 软件工程要做强，关键在于创新，在于规范化的软件开发\n- 本课程是软件学院的最核心课程，区别于计算机科学系。\n\n## 软件工程知识体系SWEBOK\n\
    \n- 软件工程知识体系(Software Engineering Body of Knowledge) 简称SWEBOK\n- 由IEEE国际组织推出\n\
    - 版本：当前版本 V3(2014)\n- 网址：http://www.swebok.org\n- 国际软件工程师证书：\n  - CSDA，针对大学应届毕业生\n\
    \  - CSDP，针对有经验的工程师\n\n## SWEBOK V3的15个知识域\n\n- 软件工程实践类知识域\n- 软件需求、软件设计、软件构造、软件测试、软件维护、软件配置管理、软件工程管理、软件过程管理、软件工程方法、软件质量、软件工程职业实践\n\
    - 软件工程教育要求类知识域\n- 工程经济基础、计算基础、数学基础、工程基础\n\n## 本节内容\n\n- 什么是软件\n  - 软件的作用、发展、定义和特性\n\
    \  - 软件危机和问题\n- 什么是工程\n- 什么是软件工程\n  - 软件工程的概貌和知识域\n  - 软件工程的黄金三角\n  - 控制软件开发的复杂性\n\
    \  - 软件建模及方法\n\n## 软件工程的黄金三角\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_6_0.png)\n\
    \n## 软件工程技术\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_7_0.png)\n\n## 系统工程 (System\
    \ Engineering)\n\n- 在软件开发之前，必须了解该软件所外的外部“系统”\n- 计算系统包括计算机硬件、软件、人员、数据库、文档、规程等系统元素。\n\
    - 系统工程的任务：\n  - 系统建模 —— 系统模型\n  - 系统仿真\n- 系统工程的表现形式\n  - 信息系统、关注企业、业务流程图——业务模型\n\
    \  - 联合式系统、关注产品、产品结构——产品模型\n  - 多媒体系统、关注内容、内容工程——脚本\n\n## 需求 (Requirement)\n\n\
    - 目的：澄清用户的需求。\n- 描述：软件人员和用户沟通，充分理解和获取用户的需求，并进行分析，形成《软件需求规格》文档和分析模型。\n- 任务：\n \
    \ - 需求获取\n  - 需求分析和建模\n  - 需求定义\n  - 需求确认\n  - 需求管理\n\n重点在What\n\n## 需求与设计\n\n\
    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_7_1.png)\n\n## 设计 (Design)\n\n- 目的：建立软件的设计蓝图，是需求到代码的桥梁。\n\
    - 任务：软件人员依据软件需求，进行设计，形成《软件架构》文档和设计模型。\n- 内容\n  - 架构设计\n  - 详细设计\n\n重点在How\n\n\
    ## 编码 (Coding)\n\n- 任务:依据设计说明书为每个模块编写程序\n- 交付程序\n  - 程序内部含有必要的注释\n  - 不含有语法错误\n\
    - 交付这样的程序就是编码阶段完成的里程碑\n\n## 编程的误区\n\n- 软件人员应该制衡大于编程的欲望\n- 先经过分析阶段确定用户要求。\n- 再经过设计阶段为需求制订蓝图。\n\
    - 甚至编程的条件才具备，可进入编码阶段\n- 不要让compiler代替你检查代码的错误\n- 那样会让语言bug隐藏得更深\n- 先要自查代码的错误，再编译\n\
    \n## 测试 (Testing)\n\n- 任务：发现并排除软件中的缺陷\n- 不同层次的测试：\n  - 单元测试 (Unit testing)\n \
    \ - 集成测试 (Integration testing)\n  - 系统测试 (System testing)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_8_0.png)\n\
    \n## 部署 (Deployment)\n\n- 任务：交付、支持和反馈\n- 部署原则：\n  - Manage customer expectations\
    \ for each increment\n  - A complete delivery package should be assembled and\
    \ tested\n  - A support regime should be established\n  - Instructional materials\
    \ must be provided to end-users\n  - Buggy software should be fixed first, delivered\
    \ later\n\n## 软件开发工作量分配比例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_8_1.png)\n\
    \n## 运行和维护 (Operation and Maintenance)\n\n- 所谓维护，是指软件系统交付使用以后，为了改正错误或满足新的需要而修改软件的过程。\n\
    - 举例：一个中等规模的软件，如果开发过程要一年，投入使用后，其运行时间可能持续五年，这段时期是维护阶段。\n- 与开发相比，维护阶段的工作量和成本要大得多。\n\
    - 人们对软件维护的认识还不够软件开发，因为开发具有主动性和创造性，易被人们所重视。\n\n## 费用分配比例\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_8_2.png)\n\
    \n## 维护类型\n\n- 纠错性维护（Corrective maintenance）\n  - 由于软件中的缺陷引起的修改\n- 完善性维护（Perfective\
    \ maintenance）\n  - 根据用户在使用过程中提出的一些建设性意见而进行的维护活动\n- 适应性维护（Adaptive maintenance）\n\
    \  - 为适应环境的变化而修改软件的活动\n- 预防性维护（Preventive maintenance）\n  - 为了进一步改善软件系统的可维护性和可靠性，并为以后的改进奠定基础\n\
    \n## 软件工程的发展\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_9_0.png)\n\n## 本节内容\n\
