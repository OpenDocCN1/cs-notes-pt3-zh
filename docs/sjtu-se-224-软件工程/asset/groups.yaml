    \ (ex. ORB, MQS,...) | Infrastructure |\n\n## Modeling Architectural Layers\n\n\
    - Architectural layers can be modeled using **stereotyped packages**\n- `<<layer>>`\
    \ stereotype\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_148_0.png)\n\n## Layer\
    \ – Reuse driving\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_149_0.png)\n\n##\
    \ Example\n\n### Application Layer\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_150_0.png)\n\
    \n### Business Specific Layer\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_150_1.png)\n\
    \n## Key Layers\n\n| Layer Name | Responsibilities | Implementation Technology\
    \ |\n|---|---|---|\n| Presentation | User Interface | JSP/HTML/JavaScript, java.awt.Component\
    \ subclasses |\n| Application | Use-case UI workflow, syntactic validation, interaction\
