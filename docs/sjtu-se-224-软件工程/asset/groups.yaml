    # Software Engineering


    # Use a conceptual class category list


    | Category | Conceptual Classes |

    |---|---|

    | physical or tangible objects | Student

    Professor

    FulltimeStudent

    ParttimeStudent |

    | form or abstract noun concepts | Course

    Course Offering

    Schedule |

    | organizations | Dept |


    # 面向对象分析


    # Finding conceptual classes with Noun Phrase


    +   - Use use-case flow of events as input

    +   - Underline noun clauses in the use-case flow of events

    +   - Remove redundant candidates

    +   - Remove vague candidates

    +   - Remove actors (out of scope)

    +   - Remove implementation constructs

    +   - Remove attributes (save for later)

    +   - Remove operations


    # Example: Candidate Conceptual Classes


    +   - Register for Courses (Create Schedule)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_58_0.png)


    # A Common Mistake in Identifying Conceptual Classes


    +   - Perhaps the most common mistake when creating a domain model is to represent
    something as an attribute when it should have been a concept.

    +   - A rule of thumb to help prevent this mistake:

    +     - If we do not think of some conceptual class X as a number or text in the
    real world, X is probably a conceptual class, not an attribute.

    +   - Example

    +     - Should store be an attribute of Sale, or a separate conceptual class Store?

    +     - In the real world, a store is not considered a number or text - the term
    suggests a legal entity, an organization, and something occupies space.

    +     - Therefore, Store should be a concept.


    # 面向对象分析的步骤


    +   1. 用例建模

    +   2. 建立概念模型

    +      2.1 识别Conceptual Class

    +      2.2 建立Conceptual Class之间的关系

    +      2.3 增加Conceptual Class的属性

    +   3. 用例分析


    # Class relationships


    +   - Association

    +     - Aggregation

    +     - Composition

    +   - Generalization

    +   - Dependency'
