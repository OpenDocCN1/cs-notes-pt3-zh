    \n# 多重性设计选项\n\n- 容器类的显式建模\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_268_0.png)\n\
    \n- 注记\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_268_1.png)\n\n# 什么是参数化类（模板）？\n\
    \n- 一种定义其他类的类定义\n- 常用于容器类\n  - 一些常见的容器类：\n    - 集合、列表、字典、栈、队列、...\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_269_0.png)\n\
    \n# 实例化参数化类\n\n显式绑定\n\n隐式绑定\n\n形式参数\n\n参数化类\n\n<<bind>> <实际参数>\n\n实例化类\n\n实例化类\
