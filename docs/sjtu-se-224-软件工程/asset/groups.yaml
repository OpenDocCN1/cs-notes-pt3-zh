    # 持续集成概念


    +   - 持续集成是一种软件开发实践，即团队开发成员经常集成它们的工作，通常每个成员每天至少集成一次，也就意味着每天可能会发生多次集成。

    +   - 每次集成都通过自动化的构建（包括编译，发布，自动化测试）来验证，从而尽快地发现错误。


