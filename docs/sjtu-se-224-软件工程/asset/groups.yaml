  - '[PAGE 17]


    # 增量型（Incremental）


    +   - 构造一系列可执行的中間版本(Version by Version)


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_17_0.png)


    # 增量型需考虑的风险


    +   - 需求未被很好地理解

    +   - 一次要求所有功能

    +   - 需求迅速发生变化

    +   - 事先打算采用的技术迅速发生变化

    +   - 长期内仅有有限的资源（人员/资金）


    # 增量型适用时机


    +   - 需要早期获得功能；

    +   - 中间产品可以提供使用；

    +   - 系统被自然地分割成增量；

    +   - 工作人员/资金可以逐步增加。


    # 演化型(Evolutionary)


    +   - 表现：

    +     需求常常在软件开发过程中发生改变，想要一次迭代开发交付的最终产品是不可能的

    +   - 解决办法：演化模型

    +     解决办法的原则是使软件可以分若干次交付一个完整的软件产品

    +   - 特点：

    +     软件的开发方法，渐进式开发可多次迭代。逐步完善软件产品，每个版本都开发、开发过程中活动和任务都集中或与重量平衡进行开发

    +     与增量模型的区别是：需要在开发早期不能确定了所有的需求在开发的每个阶段又开发被重新了，潜在每个增量的版本中都确定


    # 演化模型举例


    基于风险、顺序执行的演化模型


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_17_1.png)


    +   - 首先执行风险最大的任务

    +   - 并行开发

    +   - 每次迭代都有迭代的原型

    +   - 可以在细化所有需求之前启动开发工作


    # 演化型价值：降低风险


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_17_2.png)


    演化模型是自有采用风险控制的模型'
  - '[PAGE 18]


    # 演化模型已成为主流


    +   - 现代软件过程都采用演化模型

    +   - 统一软件过程 RUP

    +   - 敏捷过程（SCRUM, XP 等）

    +   - 净室（Cleanroom）软件过程

    +   - 演化模型的“子类”

    +     - 原型 Prototyping

    +     - 螺旋模型 Spiral Model


    # 快速原型模型 Rapid Prototyping Model


    一种迭代次数为2的演化模型


    # 快速原型模型的特点


    +   - 特点

    +   - 快速开发工具

    +   - 循环

    +   - 低成本

    +   - 种类

    +   - 渐进型

    +   - 抛弃型


    # 螺旋模型 Spiral Model


    一种基于风险的演化模型


    # 螺旋模型的特点


    +   - B.Boehm于1988年提出

    +   - 演化模型+快速原型+风险分析

    +   - 螺旋模型沿着螺旋线旋转，在四个象限上分别表示四个方面的活动，即：

    +   - 制定计划：确定任务目标，选择实施方案，弄清项目开发的限制条件

    +   - 风险分析：评价所选方案，识别风险，消除风险

    +   - 工程实施：实施软件开发，验证工作产品

    +   - 客户评价：评价开发工作，提出修正建议


    # 软件过程


    +   - 软件过程概述

    +   - 软件生命周期模型

    +   - 统一软件过程 RUP

    +   - 敏捷过程'
  - '[PAGE 19]


    # 统一软件过程 RUP


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_19_0.png)


    RUP是一个过程框架，基于UML和软件架构的演化开发过程。


    # RUP的四个阶段


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_19_1.png)


    +   - Inception · Define the scope of project

    +   - Elaboration · Plan project, specify features, baseline architecture

    +   - Construction · Build the product

    +   - Transition · Transition the product into end user community


    每个阶段结束是一个大里程碑


    # 阶段和迭代


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_19_2.png)


    An iteration is a distinct sequence of activities with an established plan and
    evaluation criteria, resulting in an executable release (internal or external)


    # 一个迭代周期：一个小的瀑布模型


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_19_3.png)


    # 软件过程


    +   - 软件过程概述

    +   - 软件生命周期模型

    +   - 统一软件过程 RUP

    +   - 敏捷过程


    # 敏捷过程


    +   - 敏捷过程很容易适应变化并迅速做出调整，在保证质量的前提下，实现企业效益的最大化。

    +   - 敏捷过程在保证软件开发成功产出的前提下，尽量减少开发过程中的活动和制品，Just enough

    +   - 2001年2月，新方法的一些创始人集聚在美国犹他州成立Agile 联盟 (www.agilealliance.org)


    XP SCRUM Crystal ASD dx MSF FDD DSDM Lean Development'
  - '[PAGE 20]


    # 敏捷宣言


    +   - 较之于过程和工具，更注重人及其相互作用的价值

    +   - 较之于无所不及的各类文档，更注重可运行的软件的价值

    +   - 较之于合同谈判，更注重与客户合作的价值

    +   - 较之于按计划行驶，更注重响应需求变化的价值


    # 敏捷过程的适用范围


    Martin Fowler认为：新方法不到处可适用的

    适合采用敏捷过程的情况：


    +   - 需求不确定、易挥发

    +   - 有责任感和积极向上的开发人员

    +   - 用户容易沟通并能参与

    +   - 小于10个人的项目团队


    # Scrum — 敏捷的软件项目管理


    +   - 1994年由Ken Schwaber和Jeff Sutherland 提出

    +   - Scrum一词来源于橄榄球运动，意为两队非竞争球

    +   - Scrum的特征为：

    +     - 一个自组织的小团队，集体负责且责任面向冲

    +     - 团队成员紧密互助，集中地在短暂性的环境下工作


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_20_0.png)


    # Scrum的核心准则


    +   - Iterative Development 迭代开发

    +     The project deliverables are built over several iterative development cycles,
    each adding additional features, and each resulting in demonstrable results: working
    code, written documentation, viewable designs, etc.

    +   - Team Empowerment 自我管理

    +     The project team is divided into self-managing multi-function units called
    Sprint Teams consisting of up to six or seven people. The team is empowered to
    use whatever development methods or tools they think best to prepare their deliverables


    # Scrum过程框架


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_20_1.png)


    Sprint

    周期为30天的迭代

    Backlog

    待办事项表

    (功能和非功能需求清单)

    Daily Scrum

    每日15分钟

    例会


    # Scrum Players


    +   - Scrum 项目组

    +     - Product Owner

    +       Adds items to product backlog list

    +       Set priorities

    +     - Team

    +       Determines sprint list (determine what can be done )

    +       Develops software

    +     - ScrumMaster (和主持项目的经理角色)

    +       Responsible for Scrum process

    +       Removes impediments

    +   - Other interested parties

    +     - Stakeholder

    +       Funded project, will use it, affected by it

    +       Requests enhancements

    +     - IT Management

    +       Manpower allocation

    +       Budgets & Billing

    +     - Senior Business Management

    +       Best use of corporate resources'
