    \ | `e(a:T)[guard]/activity` |\n| 内部转换 | 对事件的响应导致效果的执行，但不导致状态改变或出口或入口活动的执行 | `e(a:T)[guard]/activity`\
    \ |\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_280_0.png)\n\n## 转换动作和守卫\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_281_0.png)\n\
