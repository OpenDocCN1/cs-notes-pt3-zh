    \ relationships - **Association** (field visibility)\n- **Transient** relationships\
    \ - **Dependency**\n  - **Multiple objects share the same instance**\n    - Pass\
    \ instance as a parameter (parameter visibility)\n    - Make instance a managed\
    \ global (global visibility)\n  - **Multiple objects don’t share the same instance**\
    \ (local visibility)\n- How long does it take to create/destroy?\n  - **Expensive?**\
    \ Use field, parameter, or global visibility\n  - Strive for the lightest relationships\
    \ possible\n\n## Example: Define Dependencies (before)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_255_0.png)\n\
    \n## Example: Define Dependencies (after)\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_256_0.png)\n\
    \nGlobal visibility\n\nField visibility\n\n## Define Associations\n\n- Purpose\n\
