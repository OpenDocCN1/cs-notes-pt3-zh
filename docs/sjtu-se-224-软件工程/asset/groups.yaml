    \ Server | EJB, CORBA, COM+ |\n| Database Server | |\n| Legacy System | Native\
    \ languages |\n\n## Architectural Pattern - MVC\n\n- **Name**\n  - MVC (Model-View-Controller)\n\
    - **Context and forces**\n  - We have a **data model** and **several representations\
    \ of the data**\n    - We want to modularize the system\n    - Data representation\
    \ must be kept up to date\n- **Problem**\n  - How to modularize the system\n-\
    \ **Solution**\n  - The **model** holds the data (and does data modification),\
    \ the **view** represents the data, the **controller** handles user input\n\n\
    ## Model-View-Controller Architecture\n\nThe *model-view-controller* architecture\
    \ (MVC) separates application data (contained in the *model*) from graphical presentation\
    \ components (the *view*) and input-processing logic (the *controller*).\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_162_0.png)\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_162_1.png)\n\n## Examples of Architectural\
    \ Patterns - Blackboard\n\n- **Pattern Name**\n  - Blackboard\n- **Context**\n\
    \  - A domain in which **no closed (algorithmic) approach** to solving a problem\
    \ is known or feasible. Examples are AI systems, voice recognition, and surveillance\
    \ systems.\n- **Problem**\n  - **Multiple problem-solving agents** (knowledge\
    \ agents) must **cooperate** to solve a problem that **cannot be solved by any\
    \ of the individual agents**. The results of the work of the individual agents\
    \ must be accessible to all the other agents so they can evaluate whether they\
    \ can contribute to finding a solution and post results of their work.\n"
  mdcn: "\n\n## 建筑模式示例 - 层\n\n| 级别 | 层 | 组 |\n|---|---|---|\n| 5 | 设备和客户特定代码 | 应用\
