    \ what happens in response to the receipt of an event\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_241_0.png)\n\
    \n## Add Activities and Actions\n\n### Activities\n\n- Associated with a state\n\
    - Start when the state is enter\n- Take time to complete\n- Interruptible\n\n\
    ### Actions\n\n- Associated with a transition\n- Take an insignificant amount\
    \ of time to complete\n- Non-interruptible\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_242_0.png)\n\
    \n## Example: Statechart\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_243_0.png)\n\
    \n## Example: Statechart With Nested States and History\n\n## Which Objects Have\
    \ Significant State?\n\n- Objects whose role is clarified by state transitions\n\
    - Complex use cases that are **state-controlled**\n- It is **not** necessary to\
    \ model all objects\n  - Objects with straightforward mapping to implementation\n\
    \  - Objects that are not state-controlled\n  - Objects with **only one** computational\
    \ state\n\n## How Do Statecharts Map to the Rest of the Model?\n\n- Events may\
    \ map to operations\n- Methods should be updated with state specific information\n\
    - States are often represented using attributes\n  - This serves as input into\
    \ the “Define Attributes” step\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_246_0.png)\n\
    \n## Attributes: How Do You Find Them?\n\n- Examine method descriptions\n- Examine\
    \ states\n- Any information the class itself needs to maintain\n\n## Attribute\
    \ Representations\n\n- Specify name, type, and optional default value\n  - **attributeName\
    \ : Type = Default**\n- Follow naming conventions of implementation language and\
    \ project\n- Type should be an elementary data type in implementation language\n\
    \  - Built-in data type, user-defined data type, or user-defined class\n- Specify\
    \ visibility\n  - Public: ‘+’\n  - Private: ‘-’\n  - Protected: ‘#’\n\n## Derived\
    \ Attributes\n\n- What is a derived attribute?\n  - An attribute whose value may\
    \ be calculated based on the value of other attribute(s)\n- When do you use them?\n\
    \  - When there is not enough time to re-calculate the value every time it is\
    \ needed\n  - Trade-off runtime performance vs. memory required\n\n## Example:\
    \ Define Attributes\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_250_0.png)\n\n\
    ## Define Dependency\n\n- What Is a Dependency?\n  - A relationship between two\
    \ objects\n- Purpose\n  - Determine where structural relationships are NOT required\n\
    - Things to look for :\n  - What causes the supplier to be visible to the client\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_251_0.png)\n"
  mdcn: "\n\n## 定义方法\n\n- 什么是方法？\n  - 描述 **操作实现**\n- 目的\n  - 定义操作实现中的特殊方面\n- 需要考虑的事项：\n\
    \  - 特殊的 **算法**\n  - 要使用的其他对象和操作\n  - 属性和参数如何实现和使用\n  - 关系如何实现和使用\n\n## 什么是状态图？\n\
    \n- ♦ 状态的有向图（节点）通过转换（有向弧）连接\n- ♦ 描述反应式对象的生命周期\n\nState\nState Name\nstateVar :\
    \ type = value\nentry/ entry action\ndo/ activity\nexit/ exit action\nActivity\n\
    Event\nevent(args)\n[guard condition]\n/ operation(args)\n^target.sendEvent(args)\n\
    Action\nTransition\n\n## 识别并定义状态\n\n- 重要的、动态的属性\n\n*每门课程开设的最大学生人数为 10*\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_239_0.png)\n\
    \n- 某些链接的存在与不存在\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_239_1.png)\n\n## 识别转换\n\
    \n- 对于每个状态，确定什么事件导致转换到什么状态，包括在需要时使用守卫条件\n- 转换描述了对事件接收的响应会发生什么\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_241_0.png)\n\
    \n## 添加活动和动作\n\n### Activities\n\n- 与状态相关联\n- 在进入状态时开始\n- 需要时间完成\n- 可中断\n\n###\
    \ Actions\n\n- 与转换相关联\n- 完成所需时间可忽略不计\n- 不可中断\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_242_0.png)\n\
    \n## 示例：状态图\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_243_0.png)\n\n## 示例：带嵌套状态和历史的状态图\n\
    \n## 哪些对象具有显著的状态？\n\n- 其角色通过状态转换得以明确的对象\n- 复杂的使用案例，其为 **状态控制**\n- 并 **不是** 需要建模所有对象\n\
    \  - 与实现有直接映射的对象\n  - 不是状态控制的对象\n  - 只有 **一个** 计算状态的对象\n\n## 状态图如何映射到模型的其余部分？\n\
    \n- 事件可能映射到操作\n- 方法应使用特定状态的信息进行更新\n- 状态通常使用属性表示\n  - 这作为输入到“定义属性”步骤\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_246_0.png)\n\
    \n## 属性：你如何找到它们？\n\n- 检查方法描述\n- 检查状态\n- 类本身需要维护的任何信息\n\n## 属性表示\n\n- 指定名称、类型和可选的默认值\n\
    \  - **attributeName : Type = Default**\n- 遵循实现语言和项目的命名约定\n- 类型应为实现语言中的基本数据类型\n\
    \  - 内置数据类型、用户定义数据类型或用户定义类\n- 指定可见性\n  - 公共：‘+’\n  - 私有：‘-’\n  - 受保护：‘#’\n\n##\
    \ 派生属性\n\n- 什么是派生属性？\n  - 其值可基于其他属性的值计算得出的属性\n- 何时使用它们？\n  - 当每次需要时重新计算值的时间不足时\n\
    \  - 在运行时性能与所需内存之间进行权衡\n\n## 示例：定义属性\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_250_0.png)\n\
    \n## 定义依赖\n\n- 什么是依赖？\n  - 两个对象之间的关系\n- 目的\n  - 确定何处不需要结构关系\n- 需要查找的内容：\n  - 什么导致供应商对客户端可见\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_251_0.png)\n\n"
