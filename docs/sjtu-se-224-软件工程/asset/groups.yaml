    \n- 对考生送来的报名单进行检查\n- 对合格的报名单编好准考证号后将准考证送给考生，并将汇总后的考生名单送给阅卷站\n- 对阅卷站送来的成绩清单进行检查，并根据考试中心制订的合格标准审查合格者\n\
