  - "[PAGE 30]\n\n# Software Engineering\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_30_0.png)\n\
    \n# 需求工程\n\n# 分析建模准则\n\n+   - Represent the information domain\n+   - Represent\
    \ software functions\n+   - Represent software behavior\n+   - Partition these\
    \ representations\n+   - Move from essence toward implementation\n\n# 分析模型\n\n\
    对需求进行分析，并进行图形建模，形成分析模型（平台无关模型 PIM）。\n\n+   ◆ 结构化分析模型\n+     - 数据流图（DFD）\n+   \
    \  - 控制流图（CFD）\n+     - 数据字典（DD）\n+     - 实体—关系图（ERD）\n+     - 状态变迁图（STD）\n+ \
    \    - 加工说明（PSPEC）\n+     - 控制说明（CSPEC）\n+   \n+   ◆ 面向对象分析模型\n+     - 用例图\n+\
    \     - 活动图\n+     - 类图\n+     - 时序图\n+     - 通信图\n+     - 状态机图\n\n# 需求工程\n\n\
    +   - 软件需求概念\n+   - 需求获取\n+   - 需求分析和建模\n+   - 需求定义和验证\n+   - 需求管理\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_30_1.png)\n\
    \n# 需求工程\n\n# 需求定义的任务\n\n定义详细需求 - SRS\n\n+   - 细化功能需求\n+   - 细化非功能需求\n+   - 细化约束条件\n\
    +   - 设计用户界面和接口"
