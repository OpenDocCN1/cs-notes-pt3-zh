    \   M₅、M₆、M₇、M₈、M₂、M₃、M₄、M₁\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_332_1.png)\n\
    \n# 集成测试——何时测试和由谁测？\n\n+   - When\n+     根据集成测试策略，和单元测试并行或之后进行。\n+   - Who\n+\
    \     一般由项目经理组织软件测试工程师或由独立的测试部门进行。\n+     程序员也可测试。"
