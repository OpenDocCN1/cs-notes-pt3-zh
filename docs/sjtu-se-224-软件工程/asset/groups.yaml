    # 层次架构（layered architecture）风格


    Specific functionality


    General functionality


    Application Subsystems

    Distinct application subsystems that make up the information system for the organization.
    Developed by adding software developed by the organization.


    Business-Specific

    Business specific — contains a number of business subsystems specific to the type
    of business.


    Middleware

    Middleware — offers subsystems for utility services and platform independent services
    for distributed object computing in heterogeneous environments and so on.


    System Software

    System software — contains the software that manages the system, interfaces to
    specific hardware systems, interfaces to specific devices, device drivers, and
    so on.


