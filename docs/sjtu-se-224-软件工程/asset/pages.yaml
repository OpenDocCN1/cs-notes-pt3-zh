    # 用户界面设计


    +   - 界面设计原则

    +   - 人机交互方式

    +   - 界面设计的过程

    +   - 界面设计的问题


    # 1）系统响应时间（Response time）


    +   - 系统响应时间是指从用户执行某个控制动作（如按回车键或点鼠标）到软件作出响应（期望的输出或动作）的时长。

    +   - 时间长度：系统响应时间过长会使用户感到不安和担忧，人的一般容忍度为15秒。

    +   - 可变性：稳定的响应时间（如1秒）比不稳定的响应时间（如0.1秒到2.5秒）要好。用户往往比较敏感，总是有关心界面背后是否发生了异常。


    # 及时反馈操作信息


    +   - 当用户进行某项操作后，如果没有一会儿（几分钟）用户马上知道反馈信息，这就使用户感到迷惑和不安，因为他不知道自己是否操作了该操作成功了。

    +   - 及反馈信息很重要，至少要使用户放心心安。如通过该任务处理是否完毕，有什么结果。

    +   - 例如下载一个文件，屏幕上就显示“百分比”或相关数字来表示下载的进度。若用户认为进度要变得多非常慢，如某类任务处理不能进行时等，就要至少要给出提示信息“正在处理...等待...”，就最好提供给用户的动作，让用户明白系统正在干着，没有死机。


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_312_0.png)


    # 示例


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_312_1.png)


    专业软件一般都具有反馈操作结果的窗口区域。


    # 2）帮助设施（Help facilities）


    +   - 关于帮助设施，在设计时须考虑以下问题：

    +   - 在系统交互时，是否能提供各种系统功能的操作？是否能提供功能的帮助？

    +   - 用户应怎样寻求帮助？使用帮助菜单、滚动功能键还是HELP命令。

    +   - 帮助显示如何？在另一个窗口中，指出某个某类个材料（不是理想的方式）还是在屏幕特定位置的简单提示。

    +   - 用户怎样得到常规的或非正常方式？可以提供帮助，屏幕上是否显示？功能或操作？

    +   - 怎样构造帮助信息？是平面式的，所有信息均通过关键字来访问），分离式（用户可以进一步查询得到更详细的信 息）还是超文本式。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Software Engineering


    # 用户界面设计


    # 3）出错处理（Error handling）


    +   - 交互系统给出的出错消息和警告应具备以下特征：

    +     - 消息以用户可以理解的术语描述问题。

    +     - 消息提供相应的解决和恢复的建议。

    +     - 消息应指出错误可能导致哪些不良后果。

    +     - 消息应是“非判评性的”（nonjudgmental），即不能指责用户。


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_313_0.png)


    # 防错处理


    +   - 在设计界面时必须考虑防错处理，目的是让用户不必避免犯错误而提高信心、小心翼翼地操作。

    +   - 常见的防错处理措施有：

    +     - 对输入数据进行校验。如用户输入错误的数据，软件应当识别错误并提示用户改正数据。

    +     - 对于某些情况下不应该使用的菜单项和命令按钮，应当将其“失效”（变成灰色，可见但不可操作）或者“隐藏”。

    +     - 执行破坏性的操作之前，应当获得用户的确认。

    +     - 尽量提供Undo功能，用户可以撤销刚才的操作。


    # 4）菜单和命令交互（Menu and command Interaction）


    +   - 在提供命令或菜单交互方式时，必须考虑以下设计问题：

    +     - 是否每个菜单选项都有对应的命令？

    +     - 采用何种命令形式？有3种选择：控制序列（例如，Ctrl+P）、功能键和输入命令。

    +     - 学习和记忆命令的难度有多大？忘记了命令怎么办？

    +     - 用户是否可以定制或编写命令？

    +     - 在界面环境中菜单标签是否自解释的？

    +     - 子菜单是否与主菜单项所指功能相一致？


    # 5）可访问性 6）国际化


    +   - 应用系统的可访问性

    +     - 确保系统界面能让那些身体上面临挑战的用户也易于访问，例如为视力、听觉、运动性、语言和学习等方面有障碍的用户提供系统的访问机制。

    +   - 国际化

    +     - 软件工程师和他们的经理往往会低估建立一个适应不同国家和不同语言需要的用户界面所付出的努力和技能。

    +     - 用户界面应该被设计成能够容易变更对所有软件用户的核心功能，同时能够针对特定的市场进行界面的定制以及基本本地化特征。

    +     - 文字——Unicode

    +     - 颜色

    +     - 阅读次序

    +     - 货币单位

    +     - 风俗习惯


    # 7）合理的布局和合理的色彩


    +   - 合理的布局

    +     - 界面的总体布局应当有一定的逻辑性，最好能够与工作流程相吻合。界面设计人员只有理解抽象的软件功能，才能获取对界面布局有价值的信息。

    +     - 窗口（或页面）上的界面元素的布局应当整齐清爽，界面元素应当在水平或者垂直方向对齐，行、列的间距保持一致。

    +     - 窗体的尺寸要合适，界面元素应当放在合适的位置，边界处需要有一定的空间，也不可过于宽松，显得零乱。

    +     - 界面元素需要一致的对齐方式，以避免多余不齐的视觉效果。同类的界面元素尽量保持大小一致，起码要保证高度或宽度的一致，例如命令按钮、选择框相关的元素应该放置于同一水平线上。

    +     - 要善于利用窗体和界面元素的空白，以及分割用的线条。


    # 合理的色彩


    +   - 相比于布局，设计合理的色彩就难多了，因为色彩的组合千变万化，并且人们对颜色的喜好也极不相同。

    +     - 例如，人们对黑色的理解差异很大。

    +   - 一般规律：

    +     - 如果不是为了显示真实感的图形和图像，那么应当限制一帧屏幕的色彩数目，因为人们在观察屏幕的时候很难同时记住许多种色彩。

    +     - 应当根据对象的重要性来选择颜色，重要的对象应当用醒目的色彩表示。

    +     - 使用颜色的时候应当保持一致性，例如错误提示信息用红色表示，正常信息用绿色表示，那么切勿乱用红色和绿色。

    +     - 在表达信息时，不要过分依赖颜色，因为有些用户可能患有色觉问题。'
  merge: -1
  img_proc: true
