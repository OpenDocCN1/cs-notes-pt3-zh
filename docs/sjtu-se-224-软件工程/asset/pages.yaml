  md: "# GOTO语句是有害的\n\n+   - 尽可能避免使用GOTO语句。\n+   - 使用语言中的顺序、选择、重复等有限的基本控制结构表示程序逻辑。\n\
    \n例：打印A, B, C三数中最小者排序\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_319_0.png)\n\
    \n# 程序1\n\n```\nif (A < B) goto 120;\nif (B < C) goto 110;\n100 write (C);\ngoto\
    \ 140;\n110 write (B);\ngoto 140;\n120 if (A < C) goto 130;\ngoto 100;\n130 write\
    \ (A);\n140 end\n```\n\n# 程序2\n\n```\nif (A < B) and (A < C) then\n    write (A)\n\
    else\n    if (A ≥ B) and (B < C) then\n        write (B)\n    else\n        write\
    \ (C)\n    endif\nendif\n```\n\n# 源程序的文档化（code documentation）\n\n+   - 有意义的变量名称\n\
    +   - 适当的注释\n+   - 标准的书写格式\n\n+   - 用分层缩进的写法显示嵌套结构的层次；\n+   - 在注释段与程序段、以及不同程序段之间插入空行；\n\
    +   - 每一行只写一条语句；\n+   - 字符表达式时，适当用空格或圆括号等隔离符号；\n\n好的源程序本身就是详细设计文档！\n\n# 编码规范\n\
    \n浏览C++/Java 的编码规范\n\n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_319_1.png)\n\n\
