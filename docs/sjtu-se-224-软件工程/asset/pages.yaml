    \ Spec.\n+   1.3 优化Use-Case图的结\n+   2. 建立概念模型\n+   3. 用例分析\n\n# Actor 和 Use Case\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_51_1.png)\n\nActor\n和系统交互的系统外的某些人或某些系统：\n\
    • 终端用户\n• 外界软硬件系统\n• 外部硬件设备\n\nUse case\nActor 想要用系统去做的事\n\n# 如何识别Actor\n\n+ \
    \  • 需要要在系统的帮助下完成自己的任务？\n+   • 需要谁去执行系统的核心功能？\n+   • 需要谁去完成系统的管理和维护？\n+   • 系统是否需要和外界的硬件或软件系统进行交互？\n\
    \n# 如何识别Use Case\n\n+   • 每个actor的目标和需求是什么？\n+   • actor希望系统提供什么功能？\n+   • actor\
    \ 将创建、存储、修改和删除数据吗？\n+   • actor 是否告知系统外界的事件？\n+   • actor 需要被告知系统中发生的事件吗？\n\n\
    # 避免功能分解\n\n现象\n• use case 太小\n• use cases 太多\n• Uses case 没有信息回报\n• 命名以频繁的动作\n\
    \  • \"Operation\" + \"object\"\n  • \"Function\" + \"data\"\n  • Example: \"\
