- pgno: 192
  md: '# Component


    # Definition of a (Software) Component


    +   - A **non-trivial**, **nearly independent**, and **replaceable part** of a
    system that fulfills a clear function in the context of a well-defined architecture.

    +   - A component conforms to and provides the **physical realization** of a set
    of interfaces.

    +   - A **physical, replaceable part** of a system that packages implementation
    and conforms to and provides the realization of a set of interfaces.

    +   - A component represents **a physical piece of implementation of a system**,
    including software code (source, binary or executable) or equivalents such as
    scripts or command files.'
  merge: -1
  img_proc: true
