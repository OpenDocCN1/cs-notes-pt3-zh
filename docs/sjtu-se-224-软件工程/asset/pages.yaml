  md: '# 软件工程的经典定义(Cont.)


    +   - “Software engineering is that form of engineering that applies the principles
    of computer science and mathematics to achieving cost-effective solutions to software
    problems.” [CMU/SEI-90-TR-003]

    +   - 软件工程就是应用计算机科学和数学的原理来经济有效地解决软件问题的一种工程。


    # 软件工程是一个国家的战略性学科


    +   - 软件工程的发展受到了美国DOD的极大推动

    +   - CMU SEI

    +   - 如果一个国家的软件工程不强，那么这个国家就不会强大

    +   - 软件工程要做强，关键在于创新，在于规范化的软件开发

    +   - 本课程是软件学院的最核心课程，区别于计算机科学系。


    # 软件工程知识体系SWEBOK


    +   - 软件工程知识体系(Software Engineering Body of Knowledge) 简称SWEBOK

    +   - 由IEEE国际组织推出

    +   - 版本：当前版本 V3(2014)

    +   - 网址：http://www.swebok.org

    +   - 国际软件工程师证书：

    +     - CSDA，针对大学应届毕业生

    +     - CSDP，针对有经验的工程师


    # SWEBOK V3的15个知识域


    +   - 软件工程实践类知识域

    +   - 软件需求、软件设计、软件构造、软件测试、软件维护、软件配置管理、软件工程管理、软件过程管理、软件工程方法、软件质量、软件工程职业实践

    +   - 软件工程教育要求类知识域

    +   - 工程经济基础、计算基础、数学基础、工程基础


