- pgno: 125
  md: '# REP: The Release-Reuse Equivalency Principle


    +   - The Release-Reuse Equivalency Principle

    +   - The **granule of reuse** is the **granule of release**

    +     - The granularity of reuse is the granularity of release

    +     - packages are usually the **basic unit** of development work and of release

    +     - In order to provide the guarantees that reusers need, authors must organize
    their software into **reusable packages** and then **track those packages with
    release numbers**

    +     - the granule of reuse (i.e., a package) can be **no smaller than** granule
    of release.

    +       - Anything that we reuse must also be released and tracked.

    +     - **Either** all of the classes in a package are reusable **or** none of
    them are.

    +       - If a package contains software that should be reused, then it should
    not also contain software that is not designed for reuse.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# CRP: The Common Reuse Principle


    +   - The Common Reuse Principle

    +     - The classes in a package are reused together.

    +       - If you reuse one of the classes in a package, you reuse them all.

    +   - CRP helps us to decide which classes should be placed into a package

    +     - classes that tend to be reused together belong in the same package.

    +   - CRP tell us more about what classes shouldn''t be together.

    +     - classes which are not tightly bound to each other with class relationships
    should not be in the same package.'
  merge: -1
  img_proc: true
