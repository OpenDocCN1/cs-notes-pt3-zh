  md: "# Relationships: Association\n\n+   - The semantic relationship between two\
    \ or more classifiers that specifies connections among their instances.\n+   -\
    \ A structural relationship specifying that objects of one thing are connected\
    \ to objects of another thing.\n\n# What Is Multiplicity?\n\n+   - Multiplicity\
    \ is the number of instances one class relates to ONE instance of another class.\n\
    +   - For each association, there are two multiplicity decisions to make, one\
    \ for each end of the association.\n+     - For each instance of Professor, many\
    \ Course Offerings may be taught.\n+     - For each instance of Course Offering,\
    \ there may be either one or zero Professor as the instructor.\n\n# Multiplicity\
    \ Indicators\n\n| | |\n|---|---| \n| Unspecified |  |\n| Exactly One | 1 |\n|\
    \ Zero or More | 0..* |\n| Zero or More | * |\n| One or More | 1..* |\n| Zero\
    \ or One (optional value) | 0..1 |\n| Specified Range | 2..4 |\n| Multiple, Disjoint\
    \ Ranges | 2, 4, 6 |\n\n# Example: Multiplicity\n\n# What Are Roles?\n\n+   -\
    \ The \"face\" that a class plays in the association"
  merge: -1
