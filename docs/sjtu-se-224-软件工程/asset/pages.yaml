    # 什么是模式(Pattern)


    +   - Christopher Alexander 说过：“每一个模式描述了一个在我们周围不断重复发生的间题，以及该问题的解决方法方案的核心。这样，你就能一次又一次地使用该方案而不必做重复劳动”，1977年。

    +   - 定义：“在一个上下文中对一种问题的解决方案”。


    # 软件模式分类


    An architectural pattern (architectural style) expresses a fundamental structural
    organization schema for software systems. It provides a set of predefined subsystems,
    specifies their responsibilities, and includes rules and guidelines for organizing
    the relationships between them.

    A design pattern provides a scheme for refining the subsystems or components of
    a software system, or the relationships between them. It describes a commonly-recurring
    structure of communicating components that solves a general design problem within
    a particular context.

    An idiom is a low-level pattern specific to a programming language. An idiom describes
    how to implement particular aspects of components or the relationships between
    them using the features of the given language.


