  md: "# 软件是一门什么学科？\n\n+   - 软件开发\n+     - 是一门艺术？\n+     - 是一门科学？\n+     - 是一门工程？\n\
    \n![](img/bd1e40ee9d51e0bf88db831d8e65a09d_5_0.png)\n\n# 什么是工程？\n\n+   - 工程是对技术（或社会）实体的分析、设计、建造、验证和管理。\n\
    +   - 工程是一种组织良好、管理严密、各类人员协同配合、共同完成工作的学科。\n+   - 它具有以下特性：\n+     - 以价值为目标\n+  \
    \   - 高度的组织管理性\n+     - 多种学科的综合\n+     - 高度的实践性\n\n# 如何做工程？\n\n+   - 一个工程实践包括以下四个核心步骤：\n\
    +     - 理解问题。在软件工程领域，就是需求分析；\n+     - 规划方案。在软件工程领域，就是设计；\n+     - 实施计划。在软件工程领域，就是编码；\n\
    +     - 验证结果的准确性。在软件工程领域，就是测试和质量保证。\n\n# 本节内容\n\n+   - 什么是软件\n+     - 软件的作用、发展、定义和特性\n\
    +     - 软件危机和问题\n+   - 什么是工程\n+   - 什么是软件工程\n+     - 软件工程的概念和知识域\n+     - 软件工程的金三角\n\
    +     - 控制软件开发的复杂性\n+     - 软件建模及方法\n\n# 软件工程的经典定义\n\n> > “The establishment and\
    \ use of sound engineering principles in order to obtain economically software\
    \ that is reliable and works on real machines.” [Fritz Bauer]\n> \n> > 软件工程就是为了经济地获得可靠的且能在实际机器上高效运行的软件而建立和使用的工程原理。\n\
    \n# 软件工程的经典定义(Cont.)\n\n> > “The application of a systematic, disciplined, quantifiable\
    \ approach to the development, operation, and maintenance of software” [IEEE 1990]\n\
    > \n> > 软件工程是将系统的、规范的、可量化的方法应用于软件的开发、运行和维护，即将工程化应用于软件。"
