    \n+   - 基本概念\n+     试图所有输入数据是不可能的\n+     等价类划分方法是把程序的输入域划分成若干部分，然后从每个部分中选取少数代表性数据作为测试用例\n\
    +     输入的数据划分为合理等价类和不合理等价类\n+   - 例子:\n+     输入数据，每个学生可以选修最多3门课程则\n+     合理等价类:\
    \ 选择1至3门课程\n+     不合理等价类: 没选修课程以及超过3门课程\n\n# 确定等价类原则\n\n(1) 如果输入条件规定了取值范围或值的个数，则可确定一个有效等价类和两个无效等价类。\n\
