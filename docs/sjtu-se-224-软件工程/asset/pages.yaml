    # 3）条件覆盖


    +   - 使得每个判定的条件取值各种可能的结果

    +   - 在a点 A1, A≤1, B=0, B≠0

    +     在b点 A=2, A≠2, X>1, X≤1

    +   - 测试用例

    +     1. A=2, B=0, X=4

    +        （沿路径 ace）

    +     2. A=1, B=1, X=1

    +        （沿路径 abd）


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_2.png)


    # 4）判定/条件覆盖


    +   - 使得判定中的条件取得各种可能的值，并使得每个判定取得各种可能的结果

    +   - 测试用例

    +     1. A=2, B=0, X=4

    +        （沿路径 ace）

    +     2. A=1, B=1, X=1

    +        （沿路径 abd）


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_3.png)


    # 5）条件组合覆盖


    +   - 使得每个判定条件的各种可能组合都至少出现一次

    +   - 要求

    +     1. A1, B=0  5. A=2, X>1

    +     2. A1, B≠0  6. A=2, X≤1

    +     3. A≤1, B=0  7. A≠2, X>1

    +     4. A≤1, B≠0  8. A≠2, X≤1

    +   - 测试用例

    +     1. A=2, B=0, X=4

    +     2. A=2, B=1, X=1

    +     3. A=1, B=0, X=2

    +     4. A1, B=1, X=1


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_4.png)


    # 6）路径覆盖


    +   - 覆盖程序中所有可能的路径

    +   - 如果程序中包含循环，则要求每条循环至少经过一次


