- pgno: 305
  md: '# Refactoring


    +   - Refactoring is a structured, disciplined method to rewrite or restructure
    existing code without changing its external behavior,

    +     - applying small transformation steps combined with re-executing tests each
    step.


    +   - Continuously refactoring code is another XP practice and applicable to all
    iterative methods


    +   - Code that''s been well-refactored is short, tight, clear, and without duplication
    it looks like the work of a master programmer.

    +     - Code that doesn''t have these qualities smells bad or has code smells.'
