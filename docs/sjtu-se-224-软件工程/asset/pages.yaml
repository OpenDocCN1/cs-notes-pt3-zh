- pgno: 169
  md: '# Technical Memo


    +   - All architectural methods recommend keeping a record of alternative solutions,
    decisions, influential factors, and motivations for the noteworthy issues and
    decisions.

    +   - Such records have been called technical memos, issue cards, and architectural
    approach documents, with varying degrees of formality and sophistication.

    +     - In some methods, these memos are the basis for yet another step of review
    and refinement.

    +   - In the UP, the memos should be recorded in the SAD.

    +   - An important aspect of the technical memo is the motivation or rationale.

    +   - Explaining the rationale of rejecting the alternatives is important.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Example of Technical Memo


    # Technical Memo Issue:


    # Reliability—Recovery from Remote Service Failure


    Solution Summary: Location transparency using service lookup, failover from remote
    to local, and local service partial replication.


    # Factors


    +   - Robust recovery from remote service failure (e.g., tax calculator, inventory)

    +   - Robust recovery from remote product (e.g., descriptions and prices) database
    failure


    # Solution


    Achieve protected variation with respect to location of services using an Adapter
    created in a Services-Factory. Where possible, offer local implementations of
    remote services, usually with simplified or constrained behavior. For example,
    the local tax calculator will use constant tax rates. The local product information
    database will be a small cache of the most common products. Inventory updates
    will be stored and forwarded at reconnection.


    See also the Adaptability—Third-Party Services technical memo for the adaptability
    aspects of this solutions, because remote service implementations will vary at
    each installation.


    To satisfy the quality scenarios of reconnection with the remote services ASAP,
    use smart Proxy objects for the services, that on each service call test for remote
    service reactivation, and redirect to them when possible.


    # Motivation


    Retailers really don''t want to stop making sales! Therefore, if the NextGen POS
    offers this level of reliability and recovery, it will be a very attractive product,
    as none of our competitors provide this capability. The small product cache is
    motivated by very limited client-side resources. The real third-party tax calculator
    is not replicated on the client primarily because of the higher licensing costs,
    and configuration efforts (as each calculator installation requires almost weekly
    adjustments). This design also supports the evolution point of future customers
    willing and able to permanently replicate services such as the tax calculator
    to each client terminal.


    # Unresolved Issues


    none


    # Alternatives Considered


    A "gold level" quality of service agreement with remote credit authorization services
    to improve reliability. It was available, but much too expensive.'
  merge: -1
  img_proc: true
