- pgno: 145
  md: '# Examples of Architectural Patterns - Layers


    +   - Pattern Name

    +     - **Layers**

    +   - Context

    +     - A large system that requires **decomposition**.

    +   - Problem

    +     - A system which must handle issues at **different levels of abstraction**.

    +     - For example: hardware control issues, common services issues and domain-specific
    issues. It would be **extremely undesirable** to write **vertical components that
    handle issues at all levels**. The same issue would have to be handled (possibly
    inconsistently) multiple times in different components.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Examples of Architectural Patterns - Layers


    +   - Forces

    +     - Parts of the system should be **replaceable**

    +     - Changes in components should **not ripple**

    +     - Similar responsibilities should be **grouped together**

    +     - Size of components – complex components may have to be **decomposed**


    +   - Solution

    +     - Structure the systems into groups of components that form **layers on
    top of each other**.

    +     - Make upper layers use services of the layers below **only** (never above).

    +     - Try **not** to use services **other than those of the layer directly below**
    (don’t skip layers unless intermediate layers would only add pass through components).'
  merge: -1
  img_proc: true
