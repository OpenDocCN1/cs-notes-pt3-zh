    \  \"用户想要到什么\"\n• \"这个 use case 能满足\n  谁的需求？\"\n• \"这个 use case 能够值\n  什么？\"\n\
    • \"这个 use case 还有\n  其它故事？\"\n\n一个用例定义了和actor之间的一次完整对话。"
