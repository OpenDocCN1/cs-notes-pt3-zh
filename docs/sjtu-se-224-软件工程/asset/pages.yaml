- pgno: 121
  md: '# Packaging Tips: Functionally Related Classes


    +   - Criteria for determining if classes are functionally related

    +     - **Changes** in one class'' behavior and/or structure necessitate changes
    in another class

    +     - **Removal** of one class impacts the other class

    +     - **Two objects interact with** a large number of messages or have a complex
    intercommunication

    +     - A boundary class can be functionally related to a particular entity class
    if the function of the boundary class is to **present** the entity class

    +     - Two classes interact with, or are affected **by changes in the same actor**

    +     - Two classes have **relationships** between each other

    +     - One class **creates** instances of another class'
