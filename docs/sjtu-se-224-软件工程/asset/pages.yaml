- pgno: 20
  md: '# 敏捷宣言


    +   - 较之于过程和工具，更注重人及其相互作用的价值

    +   - 较之于无所不及的各类文档，更注重可运行的软件的价值

    +   - 较之于合同谈判，更注重与客户合作的价值

    +   - 较之于按计划行驶，更注重响应需求变化的价值


    # 敏捷过程的适用范围


    Martin Fowler认为：新方法不到处可适用的

    适合采用敏捷过程的情况：


    +   - 需求不确定、易挥发

    +   - 有责任感和积极向上的开发人员

    +   - 用户容易沟通并能参与

    +   - 小于10个人的项目团队


    # Scrum — 敏捷的软件项目管理


    +   - 1994年由Ken Schwaber和Jeff Sutherland 提出

    +   - Scrum一词来源于橄榄球运动，意为两队非竞争球

    +   - Scrum的特征为：

    +     - 一个自组织的小团队，集体负责且责任面向冲

    +     - 团队成员紧密互助，集中地在短暂性的环境下工作


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_20_0.png)


    # Scrum的核心准则


    +   - Iterative Development 迭代开发

    +     The project deliverables are built over several iterative development cycles,
    each adding additional features, and each resulting in demonstrable results: working
    code, written documentation, viewable designs, etc.

    +   - Team Empowerment 自我管理

    +     The project team is divided into self-managing multi-function units called
    Sprint Teams consisting of up to six or seven people. The team is empowered to
    use whatever development methods or tools they think best to prepare their deliverables


    # Scrum过程框架


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_20_1.png)


    Sprint

    周期为30天的迭代

    Backlog

    待办事项表

    (功能和非功能需求清单)

    Daily Scrum

    每日15分钟

    例会


    # Scrum Players


    +   - Scrum 项目组

    +     - Product Owner

    +       Adds items to product backlog list

    +       Set priorities

    +     - Team

    +       Determines sprint list (determine what can be done )

    +       Develops software

    +     - ScrumMaster (和主持项目的经理角色)

    +       Responsible for Scrum process

    +       Removes impediments

    +   - Other interested parties

    +     - Stakeholder

    +       Funded project, will use it, affected by it

    +       Requests enhancements

    +     - IT Management

    +       Manpower allocation

    +       Budgets & Billing

    +     - Senior Business Management

    +       Best use of corporate resources'
