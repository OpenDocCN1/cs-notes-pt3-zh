  md: '# Test-Driven Development


    +   - An excellent practice promoted by the iterative and agile XP method, and
    applicable to the UP, is test-driven development (TDD).

    +     - It is also known as test-first development

    +   - In OO unit testing TDD-style, test code is written before the class to be
    tested and the developer writes unit testing code for nearly all production code.

    +   - Unit testing framework

    +     - The most popular unit testing framework is the xUnit family (for many
    languages)

