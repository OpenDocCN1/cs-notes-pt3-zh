    # 需求工程


    # 问题


    +   - 用户提出不由需求

    +   - I''m not sure, but I''ll know it when I see it

    +   - 需求经常变化，项目没有时间

    +   - 开发人员不断地大量超时工作，因为误解或二义性

    +   - 的需求直到开发后期才发现

    +   - 系统测试白费了，因为测试者并未明白产品要做什 么

    +   - 功能都实现了，但由于产品的低性能、使用方便 或其它因素用户不满意

    +   - 维护费用相当高，因为客户的许多增加要求未在需 求获取阶段提出


