  md: '# 定义 Functionality 需求


    概要功能需求

    Feat 63 - the defect tracking system will provide trending information to help
    the project manager assess project status


    详细功能需求

    Trending information will be charted with a line graph showing time on the x axis,
    and number of defects found on the y axis.


    # 定义 Reliability 需求


    +   - “reliability”可靠性

    +     - The ability for the software to behave consistently in a user-acceptable
    manner

    +   - 可靠性需求

    +     - Availability (xx.xx%)

    +     - Accuracy

    +     - Mean time between failures (xx hrs)

    +     - Max. bugs per/KLOC (0-x)

    +     - Bugs by class - critical, significant, minor


    # 定义 Supportability 需求


    +   - “supportability”支持性

    +     - The ability of the software to be easily modified to accommodate enhancements
    and repairs

    +   - 支持性需求

    +     - Languages, DBMSs, tools, etc.

    +     - Programming standards

    +     - Error handling and reporting standards

    +   - 常常难以定义

    +     - If it not measurable or observable, it is not a requirement

    +     - Is it a design constraint?

    +     - Is it an intent or goal?


    # 定义 Performance 需求


    +   - “performance”性能

    +     - A measure of speed or efficiency of the running system

    +   - 性能需求

    +     - Capacity

    +     - Throughput

    +     - Response time

    +     - Memory

    +     - Degradation modes

    +     - Efficient use of scarce resources

    +       - Processor, memory, disk, network bandwidth


    # 定义 Usability 需求


    +   - “usability”可用性

    +     - The ease with which software can be learned and operated by the intended
    users

    +   - 可用性需求

    +     - Training time requirements, measurable task times

    +     - User abilities (beginner/advanced)

    +     - Comparison to other systems that users know and like

    +     - Online help systems, tool tips, documentation needs

    +     - Conformity with standards

    +       - Examples: Windows, style guides, GUI Standards


    # FURPS +


    +   - 设计约束（design constraints）：规定或约束了系统设计的需要：

    +   - 实现需求（implementation requirements）：规定或要求了系统的编码或构造，如所需要标准、编程语言、数据库完整性策略、容错限制和操作环境。

    +   - 接口需求（interface requirements）：规定了系统必须与之交互的外围软硬件，以及对这种交互作用所使用的格式、时间或其他因素的约束。

    +   - 物理需求（physical requirements）：规定了系统必须具备的物理特征，可用来代表硬件要求，如物理网络配置需求。'
  merge: -1
  img_proc: true
