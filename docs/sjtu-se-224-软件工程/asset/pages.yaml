    # 软件面临的新挑战


    +   - 软件复杂性的增加

    +   - 软件规模的不断扩大

    +   - 软件运行环境的变化

    +   - 遗留系统（Legacy System）的集成和复用

    +   - 软件开发的高质量和敏捷性要求

    +   - 分散的开发团队的协同


    大型软件的典型事故案例：2000年1月，如同预言产生的一个人一夜之间老去，等等不一。2000年1月1日，2000年问题导致全球历史上最大的计算机事故，估计损失超过3,5354亿美元，合计同时使用计算机无先例。


    +   - 网络应用

    +   - 多种硬件、操作系统

    +   - 多种编程语言

    +   - 旧出不穷的新技术


