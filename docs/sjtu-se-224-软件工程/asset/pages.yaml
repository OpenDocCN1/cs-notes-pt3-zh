- pgno: 276
  md: '# Definitions: Events


    +   - An event is a significant or noteworthy occurrence

    +   - Kinds of Events


    | Event Type | Description | Syntax |

    |---|---|---|

    | call event | Receipt of an explicit synchronous call request by an object |
    op (a:T) |

    | change event | A change in value of a Boolean expression | when (exp) |

    | signal event | Receipt of an explicit, named, asynchronous communication among
    objects | sname (a:T) |

    | time event | The arrival of an absolute time or the passage of a relative amount
    of time | after (time) |'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Definitions: States


    +   - A state is the condition of an object at a moment between events

    +   - Kinds of States


    | State Kind | Description | Notation |

    |---|---|---|

    | **simple state** | A state with no substructure | `S` |

    | **orthogonal state** | A state that is divided into two or more regions. One
    direct substate from each region is concurrently active when the composite state
    is active. | Orthogonal state diagram |

    | **nonorthogonal state** | A composite state that contains one or more direct
    substates, exactly one of which is active at one time when the composite state
    is active | Nonorthogonal state diagram |'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Kinds of States


    | initial state | A pseudostate that indicates the starting state when the enclosing
    state is invoked | ● |

    | final state | A special state whose activation indicates the enclosing state
    has completed activity | ◎ |

    | terminate | A special state whose activation terminates execution of the object
    owning the state machine | × |

    | junction | A pseudostate that chains transition segments into a single run-to-completion
    transition | ● |

    | choice | A pseudostate that performs a dynamic branch within a single run-to-completion
    transition | ◇ |

    | history state | A pseudostate whose activation restores the previously active
    state within a composite state | H |'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Kinds of States


    | State Kind | Description | Notation |

    |---|---|---|

    | submachine state | A state that references a state machine definition, which
    conceptually replaces the submachine state | s: M |

    | entry point | A externally visible pseudostate within a state machine that identifies
    an internal state as a target | a → ○ T |

    | exit point | A externally visible pseudostate within a state machine that identifies
    an internal state as a source | U ○× b → |'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# # Definitions: Transitions


    +   - A transition is a relationship between **two states** that indicates that
    when an event occurs, the object moves from the prior state to the subsequent
    state


    +   - ## Kinds of Transitions


    | Transition Kind | Description | Syntax |

    |---|---|---|

    | entry transition | The specification of an **entry activity** that is executed
    when a state is entered | `entry/ activity` |

    | exit transition | The specification of an **exit activity** that is executed
    when a state is exited | `exit/ activity` |

    | external transition | A response to an event that causes a change of state or
    a self-transition, together with a specified effect. It may also cause the execution
    of exit and/or entry activities for states that are exited or entered. | `e(a:T)[guard]/activity`
    |

    | internal transition | A response to an event that causes the execution of an
    effect but does not cause a change of state or execution of exit or entry activities
    | `e(a:T)[guard]/activity` |


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_280_0.png)'
  merge: -1
  img_proc: true
