- pgno: 164
  md: '# Examples of Architectural Patterns - Blackboard


    # Forces


    +   - **Sequence** in which knowledge agents can contribute to solving the problem
    is **not deterministic** and may depend on problem solving strategies.

    +   - Input from **different** agents (results or partial solutions) may have
    **different** representations.

    +   - Agents do **not** know of each other''s existence directly but can evaluate
    each other''s posted contributions'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Examples of Architectural Patterns - Blackboard


    # Solution


    +   - A number of Knowledge Agents have access to a shared data store called the
    Blackboard.

    +   - The blackboard provides an interface to inspect and update its content.

    +   - The Control module/object activates the agents following some strategy.

    +   - Upon activation an agent inspects that blackboard to see if it can contribute
    to solving the problem.

    +   - If the agent determines that it can contribute, the control object can allow
    the agents to put its partial (or final) solution on the board.'
  merge: -1
