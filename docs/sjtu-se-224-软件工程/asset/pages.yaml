- pgno: 128
  md: '# CCP: The Common Closure Principle


    +   - The Common Closure Principle

    +     - The classes in a package should be closed together **against the same
    kinds of changes**.

    +       - A change that affects a package affects all the classes in that package
    and no other package

    +     - maintainability is more important

    +   - Guideline: Package by Work and by Clusters of Unstable Classes

    +     - Reduce widespread dependency on unstable packages

    +     - Example:

    +       - 1) there is an existing large package **P1** with thirty classes, and

    +       - 2) there is a work trend that a particular subset of ten classes is
    regularly modified and re-released.

    +         - refactor P1 into **P1-a** and **P1-b**, where P1-b contains the ten
    frequently worked on classes.'
  merge: -1
  img_proc: true
