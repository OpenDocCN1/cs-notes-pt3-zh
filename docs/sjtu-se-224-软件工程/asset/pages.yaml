  md: '# 系统测试


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_333_0.png)


    # 软件测试


    # 系统测试


    +   - When

    +   软件集成及集成测试完成时，对整个计算机系统进行一系列测试，称为系统测试（system testing）。

    +   - Why

    +   系统测试的目的是为了验证系统是否满足需求规格。

    +   - What

    +   系统测试的对象是待测试软件和运行环境，其中待测试软件常是被测试的软件、被测试的软件、性能测试、易用性测试、可移植性测试、可维护性测试等。

    +   - Who

    +   系统测试一般由开发人员直接负责执行的独立负责，测试人员由软件开发工程师、测试工程师、第三方测试机构、客户等自行组织。


    # 软件质量属性的测试


    +   - 功能性测试

    +   - 可靠性测试

    +   - 性能测试

    +   - 易用性测试

    +   - 可移植性测试

    +   - 可维护性测试


    # 功能性测试


    +   - 功能性测试（functionality testing），又称为正确性测试或一致性测试，其目的是确认软件在正常条件下使用时，软件产品满足明确说明和隐含的期望的功能。

    +   - 适合性测试，测试是否能为指定任务和用户目标提供一套适当的功能的能力。

    +   - 准确性测试，测试软件提供其所承诺度的正确或相符的输出或结果的能力。

    +   - 互操作性测试，测试软件与一个或多个的系统或系统进行交互的能力。

    +   - 安全性测试，测试软件保护数据和信息的能力，以便不被授权的人员或系统不能对数据或信息进行访问和修改，而不被授权人员或系统对数据或信息的访问能力。

    +   - 功能完整性测试，测试软件中所有的功能都已实现，而且是正确和完整的。


    +   - 例如，4S系统的系统测试时

    +   - 按照用户例模型进行功能从性能测试，覆盖每个用例的各个基本流和备选流；

    +   - 在系统安全性能测试时，测试者扮演一个试图攻击系统角色的角色，采取各种方式攻击系统；

    +   - 载入或降低系统的用户名和密码，借助于某种软件攻击系统；

    +   - “劫持”4S系统，使得别人无法访问，致使引发系统错误，期望在错误恢复过程中引入新系统；

    +   - 通过观察非常罕见的数据，从中我找到进入4S系统的弱点等等。


    # 可靠性测试


    +   - 软件可靠性测试（reliability testing）用以测试在故障发生时，软件产品维持特定的效能级别的能力。

    +   - 成熟性测试，测试软件为避免软件中缺陷而导致失败的能力。

    +   - 容错性测试，测试在出现错误或故障时反应的接口或软件下，软件软件在失效或性能降低的可能性。

    +   - 易恢复测试，测试在失效的情况下，软件重建规定性能或服务并恢复受影响的数据的能力。

    +   - 可靠性的依从性测试，测试软件遵循与可靠性相关的规范、标准或法规的能力。'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 性能测试


    +   - 性能测试（performance testing）用来测试软件在规定条件下，相对于所用资源的数目，可视该当性能的能力。

    +   - 时间响应测试。测试在规定条件下，软件执行其功能时，提供响应的时间和处理时间以及其它条件下的性能。

    +   - 资源利用率测试。测试在规定条件下，软件执行其功能时，使用各种资源和类别的资源的能力。这些资源包括CPU、内存等。

    +   - 性能从属性测试。测试软件连续性能相关的属性、标准或方法。

    +   - 压力测试（stress testing），又称负载测试，是一种将配置功能从正常测试，允许某些部件失效、硬软件资源耗尽等情况下执行系统，以测试系统在非正常情况下的性能。如大量数据的输入、处理和输出，大并发用户等）等手受影响。

    +   - 自动化的性能/压力测试。HP的Loadrunner、开源的Jmeter等。


    +   - 例如，4S系统的系统测试时，

    +   - 连续运行4S系统100小时，计算系统正常运行时间总占时间总数的比例，以及故障恢复的平均用时；

    +   - 通过强制系统重启、按网络等各种手段，让4S系统发生故障，观察恢复系统是否能降级运行，是各能及时地恢复运行，数据库中的数据是否因此留下了“脏”数据等。


    # 易用性测试


    +   - 易用性测试（usability testing）用来评价用户学习和使软件工作的（包括用户文档）的难易程度，支持用户任务的有效程度，以及用户的错误中恢复的能力。

    +   - 易理解性测试，测试软件使用界面是否合适以及是否能帮助用户使用软件的功能。

    +   - 易学性测试，测试软件使用者的学习能力。

    +   - 易操作性测试，测试软件使用界面操控的能力。

    +   - 易容错性测试，测试软件帮助用户纠正错误的能力。

    +   - 易记住性测试，测试软件易用性相关的属性、标准或方法。

    +   - 易用性测试可以采用模拟用户的方式进行，也可以通过观察用户的操作行为来执行。


    +   - 例如，4S系统的系统测试时，

    +   - 采用Loadrunner进行自动化性能测试，模拟不同数量的并发用户，在不同的数据量情况下，观察系统的响应时间和资源使用情况。


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_334_0.png)


    # 可移植性测试


    +   - 可移植性测试（portability testing）用来测试软件从一种环境迁移到另一环境的能力。

    +   - 适应性测试。测试软件所需采用额外的动作或手段是否不同环境下的能力。

    +   - 易安装测试。测试软件在指定环境中安装的能力。

    +   - 共存性测试。测试软件在公共环境中与其它分享公共资源的其他软件或系统的能力。

    +   - 易替换性测试。测试软件在同环境下，替代另一个相同用途的指定软件产品的能力。

    +   - 可移植性的从属性测试。测试软件遵循可移植性相关的协议、标准或方法的能力。


    +   - 例如，4S系统的易用性测试时，

    +   - 测量用户所需培训时间

    +   - 观察销售人员在指定下订单的任务平均需要多少步骤

    +   - 测试各界面风格是否一致

    +   - 信息显示和反馈是否准确

    +   - 是否提供在线的支持帮助等等。'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   - 例如，4S系统的可移植性测试时，

    +   - 在支持的MS Window和Linux两种操作系统场景的稳定版本上，可以方便地进行4S系统的安装。

    +   - 用IE、Firefox等多个版本的浏览器都能正常访问。

    +   - 能和已安装的MS Office等软件共存。

    +   - 同时检查4S系统提供的安装文档和初始化数据。


    # 可维护性测试


    +   - 可维护性测试（maintainability testing）用以测试软件可被修改的能力，包括纠正、修改或软件对环境、需求变化的适应。

    +   - 易分析测试，测试软件诊断缺陷或失效原因或识别修改所需分析的能力。

    +   - 易修改测试，测试软件使指定的修改可以实现的能力。

    +   - 易复查测试，测试软件避免由于软件修改而造成非预期结果的能力。

    +   - 易测试测试，测试软件已修改性能被验证的能力。

    +   - 维护性迁移测试，测试软件适应可靠性和相关的约束、标准或规定的能力。


    +   - 一般，软件可维护性更多的是通过度量来进行评估。

    +   - 常用可维护性度量，软件的复杂性、规模、可重用性、耦合度与内聚度、注释代码率、缺陷的平均修复成本、变更的平均实现成本等。

    +   - 软件越复杂、规模越大、可重用性越低、耦合度越高、内聚度越小、注释代码率有数据占比越小、缺陷的平均修复成本和变更的平均实现成本越高，则软件可维护性越差。


    # 其他测试策略


    +   - 验收测试

    +   - α测试和β测试

    +   - 安装测试

    +   - 回归测试


    # 验收测试


    +   - 针对应交付软件

    +   - 验收测试（acceptance testing），是确定一个开发完成的软件系统是否符合其被批准、使用者/客户或其他授权实体所确定是否其接受该系统的正式测试。

    +   - 验收测试是由用户为主的测试。验收测试原则上在用户所处环境进行，但经常用户同意也可以在开发机构内部根据用户环境下进行。

    +   - 项目经理负责组织项目最终验收测试。验收组应由用户代表、相关专家、项目组成员等组成。验收根据合同、《需求规格》或《验收测试计划》对软件作成品进行验收测试。


    # α测试和β测试


    +   - 针对通用产品

    +   - α测试是邀请小规模的、有代表性的潜在用户，在开发环境中，由开发人员“指导”下进行的测试（试用），并发现和记录使用过程中出现的各种软件缺陷，因此α测试是在一个受控的环境中进行的。

    +   - β测试是由用户在一个或多个用户环境下进行的测试，产品正式发布前的系统测试形式。一组有代表性的用户和消费者作为在常规条件下使用该软件的测试员，由用户记录测试中发现的问题或任何期望改进的建议，报告给开发。

    +   - β测试与α测试不同的是，β测试时开发通常不在测试现场，由用户去使用，软件在一个开发不能控制的环境中的“活的”试用。'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Software Engineering


    # 软件测试


    # 安装测试


    +   - 安装测试（installation testing）用以确认该软件在各种支持的平台下、各种允许的安装情况下，都能成功安装。

    +   - 首次安装、升级、完整的或自定义的安装等

    +   - 除了安装软件，通常还需要安装用户文档以及初始化数据，这些同样需要进行检查。


    # 回归测试（regression testing）


    +   - 为了保证软件返工时没有引入新的错误，要全部或部分地重复以前做过的测试。

    +   - 在集成测试、缺陷纠正后的重新测试、迭代开发的后继代码测试中常常回到回归测试。

    +   - 回归测试可以手工执行，也可以使使用自动化的回归测试工具（又称功能测试工具）。回归测试工具使软件工程师能够监测测试工具、然后进行测试，然后进行回归比较。

    +   - 影响测试或重新执行所有已进行的测试，或对受到影响的软件部分进行局部回归测试。仅针对修改的软件部分进行重新测试常常不够的。


    # 自动化的回归测试


    +   - HP的QTP

    +   - 开源的selenium


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_336_0.png)


    # 本节内容


    +   - 测试概述

    +   - 测试技术

    +   - 测试策略

    +   - 测试过程

    +   - 自动化测试


    # 测试过程


    测试计划 测试条件、资源、进度

    测试设计 设计测试用例（确定主功能测试）

    测试开发（设计脚本、根据模型构造环境）

    测试执行 构建测试环境、运行被测对象、执行测试

    测试评估 对测试结果进行总结和评估

    • 测试计划、测试设计和测试开发必须在软件开发完成前进行

    • 测试执行需要软件开发完成才能进行


    # 1）测试计划


    +   - 测试目的

    +   - 测试对象

    +   - 测试范围

    +   - 文档的检验

    +   - 测试策略和测试技术

    +   - 测试过程

    +   - 进度安排

    +   - 资源

    +   - 测试开始、结束标准

    +   - 测试文档和测试记录'
