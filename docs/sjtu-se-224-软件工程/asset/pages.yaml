    未移民, 使用标准的抗击骚扰的开销(由移民提供), 人数, 使用材料的方法进行登记。

    +   - 建议, 产生一个关于个人使用抗击骚扰的损失信息, 并包括移民的姓名, 地址, 电话号码, 可能发生和损失情况。

