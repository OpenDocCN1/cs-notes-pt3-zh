- pgno: 95
  md: '# Understanding Design


    +   - A process that uses the products of analysis to produce a specification
    for implementing a system.

    +   - A logical description of how a system will work.

    +   - Emphasizes a conceptual solution (in software and hardware) that fulfills
    the requirements, rather than its implementation.

