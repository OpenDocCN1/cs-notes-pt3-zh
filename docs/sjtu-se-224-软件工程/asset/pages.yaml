- pgno: 275
  md: '# Protocol state machine


    +   - protocol state machines are a **specialization** of behavioral state machines

    +     - **protocol state machines are not tied to an implementation and have restrictions
    on their transitions**

    +     - **Protocol state machines capture the behavior of a protocol**, such as
    HTTP or a challenge-response speakeasy door.

    +       - They **aren''t tied to a particular implementation of a protocol**;
    rather, they specify the state changes and events associated with a protocol-based
    communication.


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_275_0.png)'
