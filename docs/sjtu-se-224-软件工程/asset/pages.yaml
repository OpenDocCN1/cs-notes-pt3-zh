  md: '# Software Engineering


    # 程序流程图


    +   - 测试用例：

    +     A=2, B=0, X=3


    ![](img/bd1e40ee9d51e0bf88db831d8e65a09d_325_0.png)


    # 软件测试


    # 2）判定覆盖（分支）


    +   - 使得程序中每一个分支至少被遍历一次

    +   - 测试用例

    +     1. A=2, B=0, X=1

