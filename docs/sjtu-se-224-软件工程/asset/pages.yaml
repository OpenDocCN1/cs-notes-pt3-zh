    # 快速原型模型 Rapid Prototyping Model


    一种迭代次数为2的演化模型


    # 快速原型模型的特点


    +   - 特点

    +   - 快速开发工具

    +   - 循环

    +   - 低成本

    +   - 种类

    +   - 渐进型

    +   - 抛弃型


    # 螺旋模型 Spiral Model


    一种基于风险的演化模型


    # 螺旋模型的特点


    +   - B.Boehm于1988年提出

    +   - 演化模型+快速原型+风险分析

    +   - 螺旋模型沿着螺旋线旋转，在四个象限上分别表示四个方面的活动，即：

    +   - 制定计划：确定任务目标，选择实施方案，弄清项目开发的限制条件

    +   - 风险分析：评价所选方案，识别风险，消除风险

    +   - 工程实施：实施软件开发，验证工作产品

    +   - 客户评价：评价开发工作，提出修正建议


