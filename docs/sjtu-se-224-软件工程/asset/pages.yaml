- pgno: 103
  md: '# LSP: The Liskov Substitution Principle


    # The Liskov Substitution Principle


    +   - subtypes must be substitutable for their base types

    +     - SubClass can instead of parent Class

    +   - If for each object o1 of type S there is an object o2 of type T such that
    for all programs P defined in terms of T, the behavior of P is unchanged when
    o1 is substituted for o2 then S is a subtype of T [Liskov88].

    +     - If using implementation of T or subclass of T to instead of T, Software
    P which is associated with type T(interface or abstract class) can work well.

    +   - Essential : the objects which is in the same inherit architecture should
    have behavior features.


    # Example:


    +   - In real world , penguin and bird is a “is-a” relationship. If we design
    penguin is a subclass of bird class ,we violate LSP principle .because bird can
    fly( ) while penguin can not fly. So how to change this design?'
  merge: -1
  img_proc: true
