- pgno: 152
  md: '# Upward Collaboration with Observer


    +   - When the lower Application or Domain layer needs to **communicate upward**
    with the Presentation layer, it is usually via the **Observer** pattern.

    +     - UI objects in the **higher** Presentation layer implement an interface
    such as **PropertyListener** or **AlarmListener**, and are subscribers or listeners
    to events (such as property or alarm events) coming from objects in the lower
    layers.

    +     - The **lower** layer objects are directly sending messages to the upper
    layer UI objects, but the coupling is only to the objects viewed as things that
    implement an interface such as **PropertyListener**, **not** viewed as specific
    **GUI windows**.'
  merge: -1
