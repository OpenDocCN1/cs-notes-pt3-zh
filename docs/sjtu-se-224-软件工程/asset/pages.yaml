    # 软件危机的主要表现


    +   - 对软件开发成本和进度的估计常常不准确，开发成本超出预算，实际进度比计划设计一再推迟的现象并不罕见。

    +   - 用户对“已完成”系统不满意的现象经常发生。

    +   - 软件产品的质量往往靠不住，Bug一大堆，Patch一个接着一个。

    +   - 软件的可维护程度非常之低。

    +   - 软件通常没有适当的文档资料。

    +   - 软件的成本不断提高。

    +   - 软件开发生产率的提高赶不上硬件的发展和人们需求的增长。'
