    \ (11) is equal to assertion (7). That by assumption, holds at point D.\nNow we\
    \ have proved that 0≤k≤ n, the invariant (4) is true .\nLast prove is the terminates\
    \ of the loop. Since the initial k is 0, and each iteration the loop increases\
    \ the k by 1, surely k will reaches n, k=n. Then by assertion (8), got the output\
    \ specification (3).\n\nFrom the example, we could know, that only a 5 lines simple\
    \ codes, the correctness proofs need 5 pages!\nSo for a more large program code,\
    \ it is impossible to use correctness proofs for all codes. Even it is the most\
    \ reliable method.\n\n## 3.4 Other methods\n\n- Def-use test\n- Mutation test\n\
    - Regression Test\n- Fault Statistics and Reliability Analysis\n- Clean room\n\
    \n### 3.4.1 Def-use test\n\n## Data-flow based adequacy criteria\n\n- All definitions\
    \ criterion\n  - *Each definition to some reachable use*\n- All uses criterion\n\
    \  - *Definition to each reachable use*\n- All def-use criterion\n  - *Each definition\
    \ to each reachable use*\n\n### 3.4.3 Regression Testing\n\n- Developed first\
    \ version of software\n- Adequately tested the first version\n- Modified the software;\
    \ Version 2 now needs to be tested\n- How to test version 2?\n\n- Approaches\n\
    \  - Retest entire software from scratch\n  - Only test the changed parts, ignoring\
    \ unchanged parts since they have already been tested\n  - Could modifications\
    \ have adversely affected unchanged parts of the software?\n\n## Regression Testing\n\
    \n> “Software maintenance task performed on a modified program to instill confidence\
    \ that changes are correct and have not adversely affected unchanged portions\
    \ of the program.”\n\n### 3.4.4 Fault Statistics\n\n- Fault statistics **provide\
    \ a useful metric for determining whether to continue testing a module of product\
    \ or whether to recode it.**\n- The number of faults detected via execution- and\
    \ non-execution-based techniques must be recorded.\n- Data on different types\
    \ of faults found via code inspections (faults such as misunderstanding the design,\
    \ initializing improperly, and using variables inconsistently) can be incorporated\
    \ into checklists for use during later reviews of the same product and future\
    \ products.\n\n## Fishing Creel Counts and Fault Insertion\n\nFor example, that\
    \ the Rogue River is stocked with 1000 marked trout(鳟鱼); and that during the fishing\
    \ season, the creel report totals are 500 fish caught, of which 300 are marked\
    \ trout.\n\nThe stream management team would conclude that 60% of the trout in\
    \ the Rogue River are hatchery (planted) fish. The total populations could also\
    \ be estimated; in this case, the 500 fish caught represent 30% of the total population.\
    \ Total fish population is 1667.\n\nThe same idea can be applied to estimate the\
    \ success of test cases and the number of remaining faults not caught by an existing\
    \ set of test cases.\n\nThe Cleanroom technique has had considerable success in\
    \ finding and weeding out faults before execution-based testing.\n\nIn one case,\
    \ all faults were found via correctness-proving techniques, using largely informal\
    \ proofs, but with a few formal proofs as well. The resulting code was found to\
    \ be free of errors both at compilation and at execution time.\n\nIn a study of\
    \ 17 other Cleanroom software products, the products did not perform quite as\
    \ faultlessly, but they still achieved remarkably low fault rates, an average\
    \ of 2.3 faults per KLOC.\n\nBut average there are 25 faults per KLOC!\n"
