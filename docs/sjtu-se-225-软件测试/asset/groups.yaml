  - '[PAGE 47]


    # 1.2.1 Goals of testing


    +   - Testing is a process of executing a program with the intent of finding an
    error.

    +   - A good test is one that has a high probability of finding an as yet undiscovered
    error.

    +   - A successful test is one that uncovers an as yet undiscovered error.

    +   - The objective is to design tests that systematically uncover different classes
    of errors and do so with a minimum amount of time and effort.'
