    \ | 国外软件 | 6.18 |\n| 申请一定量的内存 | Men | 自产 | 1.0 |\n\n## 五、测试策略\n\n### 5.1 功能测试\n\
    \n由于对测试对象的功能测试应侧重于所有可直接追踪到用例、业务功能和业务规则的测试。这种测试的目标是核实数据的接受、计算、处理和输出是否正确，以及业务规则的实施是否恰当，因此此次功能测试全部为符合性测试，测试的主要目的是检测以下错误：\n\
    \n- 1) 是否存在不正确或遗漏的功能？\n- 2) 在接口上，输入是否能够被正确接受？能否输出正确的结果？\n- 3) 是否存在数据错误或外部信息（例如数据文件）访问错误？\n\
