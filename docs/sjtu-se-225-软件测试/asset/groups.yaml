  - '[PAGE 15]


    # London Ambulance Service


    +   - London Ambulance Service Computer Aided Dispatch (LASCAD)

    +   - Purpose: automate many of the human-intensive processes of manual dispatch
    systems associated with ambulance services in the UK

    +     - functions: Call taking

    +   - Failure of the London Ambulance Service on 26 and 27 November 1992


    ![](img/8454895dcf92bedbe5b40d0487077d64_15_0.png)'
  - '[PAGE 16]


    # "Nice of You to Turn Up"


    +   - **Load increased**

    +   - **Emergencies accumulated**

    +   - **System made incorrect allocations**

    +     - more than one ambulance being sent to the same incident

    +     - the closest vehicle was not chosen for the emergency

    +   - **At 23:00 on October 28 the LAS eventually instigated a backup procedure,
    after the death of at least 20 patients**'
  - '[PAGE 17]


    # More...


    "Software and its Impact: A Quantitative Assessment," by B.W. Boehm, Datamation,
    19(5), 48-59 (1973)


    +   - Errors in medical software have caused deaths'
  - '[PAGE 18]


    # More...


    +   - "The development of software for ballistic-missile defense," by H. Lin,
    *Scientific American*, vol. 253, no. 6 (Dec. 1985), p. 48

    +   - *An Air New Zealand airliner crashed into an Antarctic mountain*

    +   - *North American Aerospace Defense Command reported that the U.S. was under
    missile attack; traced to faulty computer software - generated incorrect signals*

    +   - *Manned space capsule Gemini V missed its landing point by 100 miles; software
    ignored the motion of the earth around the sun*


    ![](img/8454895dcf92bedbe5b40d0487077d64_18_0.png)


    ![](img/8454895dcf92bedbe5b40d0487077d64_18_1.png)'
  - '[PAGE 19]


    # More...


    +   - "Ghost in the Machine," Time Magazine, Jan. 29, 1990. p. 58

    +     - Dallas/Fort Worth air-traffic system began spitting out gibberish in the
    Fall of 1989 and controllers had to track planes on paper'
  - '[PAGE 20]


    # More...


    +   - Software Reliability: Principles & Practice, p. 25, by G. J. Myers

    +     - Apollo 8 spacecraft erased part of the computer''s memory

    +     - Eighteen errors were detected during the 10-day flight of Apollo 14

    +     - An error in a single FORTRAN statement resulted in the loss of the first
    American probe to Venus(金星)'
  - "[PAGE 21]\n\n# More...\n\n+   - ACM SIGSOFT Software Engineering Notes,  \n+\
    \     vol. 6, no. 2\n+     - *F-18 fighter plane crashed due to a missing exception\
    \ condition*\n\n+   - ACM SIGSOFT Software Engineering Notes,  \n+     vol. 9,\
    \ no. 5\n+     - *F-14 fighter plane was lost to uncontrollable spin, traced to\
    \ tactical(战术) software*"
  - '[PAGE 22]


    # 1999年千年虫Bug 5000亿


    为了节省计算机的存储空间，软件经常将存储日期用两位阿拉伯数字表示，即用“99”来表示“1999”，还用“00”来代替“1900”而不是2000，所以到2000年的时候，软件漏洞就表现出来了。'
  - '[PAGE 23]


    # More ...


    +   - 2011年7月23日晚，在温州发生动车追尾脱轨坠落事故，40人死亡。

    +   - 原因：列车控制中心设备存在严重设计缺陷、上道使用审查把关不严、雷击导致设备故障。

    +   - 2012年1月，中国返乡旅客导致铁路网上售票系统瘫痪

    +   - 原因：春运时，数以百万、千万乃至亿计的旅客需求，使意在方便旅客购票的铁路网络售票系统无法正常工作'
  - '[PAGE 24]


    • and many many more ....


    ![](img/8454895dcf92bedbe5b40d0487077d64_24_0.png)


    # What’s your experience?'
  - '[PAGE 25]


    # Economic Impact


    +   - NIST study

    +   - On CNN.com - April 27, 2003


    Last year, a study commissioned by the National Institute of Standards and Technology
    found that software errors cost the U.S. economy about $59.5 billion annually,
    or about 0.6 percent of the gross domestic product. More than half the costs are
    borne by software users, the rest by developers and vendors.'
  - '[PAGE 26]


    # Expectation


    +   - Can''t we expect software to execute correctly?

    +   - Carefully made programs

    +     - *5 faults/1000 LOC*

    +     - *1M LOC will have 5000 faults*

    +   - Windows XP has 45M LOC

    +     - *How many faults?*

    +     - *45 × 5000 = 225,000*

    +   - Win 8 : 25G~30G

    +   - Why not remove the faults?'
