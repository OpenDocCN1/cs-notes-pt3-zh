  md: "\n- **Statement coverage**: amounts to running tests in which every statement\
    \ in the code is executed at least once.\n- **Branch coverage**: makes sure that\
    \ each branching point is tested at least once.\n- **Path coverage**: makes sure\
    \ that every different path is tested at least once.\n\n## Example: black-box\
    \ testing\n\n- Discussion: MAC/ATM machine\n  - Specs\n    - Cannot withdraw more\
    \ than $300\n    - Cannot withdraw more than your account balance\n\n![](img/8454895dcf92bedbe5b40d0487077d64_121_0.png)\n\
    \n## Test case?\n\n**X**\n\n1. >300\n2. 0~300\n3. <0\n\n**Balance**\n\n1. ≥300\n\
    2. 0~300\n\n## White-box Testing\n\n- Example: `x: 1..1000;`\n\n```\n1 INPUT-FROM-USER(x);\n\
    if (x <= 300) {\n2   INPUT-FROM-FILE(BALANCE);\n    if (x <= BALANCE)\n3     \
    \  GiveMoney x;\n4   else Print \"You don’t have $x in your account!!\"\n}\nelse\n\
    5   Print \"You cannot withdraw more than $300\";\n6 Eject Card;\n```\n\n![](img/8454895dcf92bedbe5b40d0487077d64_124_0.png)\n\
    \n```\nstart\nInput x\nX ≤ 300?\nPrint \"You cannot withdraw more than $300!!\"\
    \nX ≤ balance?\nGive X $\nPrint \"You don’t have $x in your account!!\"\nend\n\
    ```\n\n## Test case?\n\nHow about example 2?\n\n![](img/8454895dcf92bedbe5b40d0487077d64_125_0.png)\n\
    \nFor example 2, branch coverage is: point A should have A > 1, A ≤ 1, B = 0,\
    \ B ≠ 0; point B should have A = 2, A ≠ 2, X > 1, X ≤ 1. So `{2, 0 | 2, 5}` and\
    \ `{0, 1 | 0, 0}` are enough.\n\nHow about path coverage?\n\n4 predicates. Test\
    \ cases are: 2 × 2 × 2 × 2 = 16.\n\n- How about loop?\n- Branch coverage is two,\n\
    - but path coverage is N+1!\n\n*Does coverage guarantee absence of faults?*\n\n\
    - Can we always get 100% coverage?\n\n![](img/8454895dcf92bedbe5b40d0487077d64_127_0.png)\n\
    \n## Surprise Quiz\n\n- Determine test cases so that each print statement is executed\
    \ at least once\n\n```\ninput(x);\nif (x < 100)\n    print \"Line 1\";\nelse {\n\
    \    if (x < 50) print \"Line 2\";\n    else print \"Line 3\";\n}\n```\n\n![](img/8454895dcf92bedbe5b40d0487077d64_128_0.png)\n\
    \n## Question\n\n- What are the weaknesses of black-box testing?\n- What is the\
    \ weakness of white-box testing?\n\n![](img/8454895dcf92bedbe5b40d0487077d64_129_0.png)\n\
    \n![](img/8454895dcf92bedbe5b40d0487077d64_129_1.png)\n\n## 3.3 Formal verification\n\
    \n### Correctness proofs\n\nIt is a mathematical technique for showing that a\
    \ product is correct, in other words, that it satisfies its specifications.\n\n\
    To see how correctness is proven, consider the fragment (next slide).\n\nWe now\
    \ show that the code fragment is correct: after execution, the variable `s` will\
    \ contain the sum of the `n` elements of array `y`.\n\n```\nint k, s;\nint y[n];\n\
    \nk = 0;\ns = 0;\nwhile (k < n)\n{\n    s = s + y[k];\n    k = k + 1;\n}\n```\n\
    \n*Code fragment*\n\n![](img/8454895dcf92bedbe5b40d0487077d64_131_0.png)\n\n*Flowchart*\n\
    \n### An assertion is placed before and after each statement, at the place labeled\
    \ with the letters A through H\n\n```\nn ∈ {1, 2, 3, …} (input specification)\n\
    \nk ← 0\n\nk = 0\n\ns ← 0\n\nk = 0 and s = 0\n\nk ≤ n and s = y[0] + y[1] + ...\
    \ + y[k-1] (loop invariant)\n\nIs k ≥ n?\n\nYes\nk = n and s = y[0] + y[1] + ...\
    \ + y[n-1] (output specification)\n\nNo\nk < n and s = y[0] + y[1] + ... + y[k-1]\n\
    \ns ← s + y[k]\n\nk < n and s = y[0] + y[1] + ... + y[k]\n\nk ← k + 1\n\nk ≤ n\
    \ and s = y[0] + y[1] + ... + y[k-1]\n```\n\nInput specification: n is a positive\
    \ integer.\n\n**A:** n ∈ {1, 2, 3, …}\n\nOutput specification is that if control\
    \ reaches point **H**, the value of **s** contains the sum of **n** values stored\
    \ in array **y**:\n\n**H:** s = y[0] + y[1] + … + y[n-1]\n\nA stronger output\
    \ specification is:\n\n**H:** k = n and s = y[0] + y[1] + … + y[n-1]\n\nHow is\
    \ it proven from **A** to **H**? The key is proving the invariant of the loop,\
    \ that is,\n\n**D:** k ≤ n and s = y[0] + y[1] + … + y[k-1]\n\n### First\n\n**B:**\
    \ k = 0\n\nThis is easy to prove, because assignment statement `k ← 0` is executed.\n\
    \nAt point C, the second assignment statement `s ← 0` is executed, and the following\
    \ assertion is true:\n\n`k = 0 and s = 0` (6)\n\nNow the loop is entered. Before\
    \ the loop executes, assertion (6) holds k = 0 and s = 0. By assertion (1), n\
    \ ≥ 1, so it follows that k ≤ n is required. Because k = 0, it follows that k\
    \ − 1 = −1, so the sum in (4) is empty, s = 0. Therefore loop invariant (4) is\
    \ true just before the first loop is entered.\n\nNow, assume that, at some stage\
    \ during the execution of the code fragment, the loop invariant holds. That is,\
    \ k has some value k₀, 0 ≤ k₀ ≤ n:\n\n**D:** k₀ ≤ n and s = y[0] + y[1] + ...\
    \ + y[k₀−1] (7)\n\nWe should prove that after executing the code fragment, the\
    \ loop invariant is still true or we get the output specification.\n"
  mdcn: "\n\n- **语句覆盖**：相当于运行测试，其中代码中的每个语句至少执行一次。\n- **分支覆盖**：确保每个分支点至少被测试一次。\n- **路径覆盖**：确保每条不同的路径至少被测试一次。\n\
    \n## 示例：黑盒测试\n\n- 讨论：MAC/ATM 机器\n  - 规格\n    - 不能提取超过 $300\n    - 不能提取超过你的账户余额\n\
    \n![](img/8454895dcf92bedbe5b40d0487077d64_121_0.png)\n\n## 测试用例？\n\n**X**\n\n\
    1. >300\n2. 0~300\n3. <0\n\n**余额**\n\n1. ≥300\n2. 0~300\n\n## 白盒测试\n\n- 示例：`x:\
    \ 1..1000;`\n\n```\n1 INPUT-FROM-USER(x);\nif (x <= 300) {\n2   INPUT-FROM-FILE(BALANCE);\n\
    \    if (x <= BALANCE)\n3       GiveMoney x;\n4   else Print \"You don’t have\
    \ $x in your account!!\"\n}\nelse\n5   Print \"You cannot withdraw more than $300\"\
    ;\n6 Eject Card;\n```\n\n![](img/8454895dcf92bedbe5b40d0487077d64_124_0.png)\n\
    \n```\nstart\nInput x\nX ≤ 300?\nPrint \"You cannot withdraw more than $300!!\"\
    \nX ≤ balance?\nGive X $\nPrint \"You don’t have $x in your account!!\"\nend\n\
    ```\n\n## 测试用例？\n\n示例 2 怎么样？\n\n![](img/8454895dcf92bedbe5b40d0487077d64_125_0.png)\n\
    \n对于示例 2，分支覆盖为：点 A 应该有 A > 1，A ≤ 1，B = 0，B ≠ 0；点 B 应该有 A = 2，A ≠ 2，X > 1，X ≤ 1。所以\
    \ `{2, 0 | 2, 5}` 和 `{0, 1 | 0, 0}` 就足够了。\n\n路径覆盖怎么样？\n\n4 个谓词。测试用例为：2 × 2 × 2\
    \ × 2 = 16。\n\n- 循环怎么办？\n- 分支覆盖为两个，\n- 但路径覆盖为 N+1！\n\n*覆盖能保证没有缺陷吗？*\n\n- 我们总能得到\
    \ 100% 覆盖吗？\n\n![](img/8454895dcf92bedbe5b40d0487077d64_127_0.png)\n\n## 惊喜测验\n\
    \n- 确定测试用例，使得每个打印语句至少执行一次\n\n```\ninput(x);\nif (x < 100)\n    print \"Line 1\"\
    ;\nelse {\n    if (x < 50) print \"Line 2\";\n    else print \"Line 3\";\n}\n\
    ```\n\n![](img/8454895dcf92bedbe5b40d0487077d64_128_0.png)\n\n## 问题\n\n- 黑盒测试的弱点是什么？\n\
    - 白盒测试的弱点是什么？\n\n![](img/8454895dcf92bedbe5b40d0487077d64_129_0.png)\n\n![](img/8454895dcf92bedbe5b40d0487077d64_129_1.png)\n\
    \n## 3.3 形式化验证\n\n### 正确性证明\n\n这是一种数学技术，用于证明产品是正确的，换句话说，它满足其规格。\n\n要了解正确性是如何证明的，请考虑片段（下一张幻灯片）。\n\
    \n我们现在证明代码片段是正确的：执行后，变量 `s` 将包含数组 `y` 的 `n` 个元素的总和。\n\n```\nint k, s;\nint y[n];\n\
    \nk = 0;\ns = 0;\nwhile (k < n)\n{\n    s = s + y[k];\n    k = k + 1;\n}\n```\n\
    \n*代码片段*\n\n![](img/8454895dcf92bedbe5b40d0487077d64_131_0.png)\n\n*流程图*\n\n###\
    \ 在每个语句之前和之后放置断言，位置标记为 A 到 H\n\n```\nn ∈ {1, 2, 3, …} （输入规格）\n\nk ← 0\n\nk = 0\n\
    \ns ← 0\n\nk = 0 and s = 0\n\nk ≤ n and s = y[0] + y[1] + ... + y[k-1] （循环不变式）\n\
    \nIs k ≥ n?\n\nYes\nk = n and s = y[0] + y[1] + ... + y[n-1] （输出规格）\n\nNo\nk <\
    \ n and s = y[0] + y[1] + ... + y[k-1]\n\ns ← s + y[k]\n\nk < n and s = y[0] +\
    \ y[1] + ... + y[k]\n\nk ← k + 1\n\nk ≤ n and s = y[0] + y[1] + ... + y[k-1]\n\
    ```\n\n输入规格：n 是正整数。\n\n**A:** n ∈ {1, 2, 3, …}\n\n输出规格是如果控制到达点 **H**，**s** 的值包含存储在数组\
    \ **y** 中的 **n** 个值的总和：\n\n**H:** s = y[0] + y[1] + … + y[n-1]\n\n更强的输出规格是：\n\n\
    **H:** k = n and s = y[0] + y[1] + … + y[n-1]\n\n如何从 **A** 证明到 **H**？关键是证明循环的不变式，即\n\
    \n**D:** k ≤ n and s = y[0] + y[1] + … + y[k-1]\n\n### 首先\n\n**B:** k = 0\n\n\
    这很容易证明，因为赋值语句 `k ← 0` 被执行。\n\n在点 C，第二个赋值语句 `s ← 0` 被执行，并且以下断言为真：\n\n`k = 0 and\
    \ s = 0` (6)\n\n现在进入循环。在循环执行之前，断言 (6) 成立 k = 0 and s = 0。根据断言 (1)，n ≥ 1，因此可得出\
    \ k ≤ n 是必需的。因为 k = 0，所以 k − 1 = −1，因此 (4) 中的和为空，s = 0。因此循环不变式 (4) 在进入第一次循环之前为真。\n\
    \n现在，假设在代码片段执行期间的某个阶段，循环不变式成立。也就是说，k 有某个值 k₀，0 ≤ k₀ ≤ n：\n\n**D:** k₀ ≤ n and\
    \ s = y[0] + y[1] + ... + y[k₀−1] (7)\n\n我们应该证明在执行代码片段后，循环不变式仍然为真，或者我们得到输出规格。\n\
    \n"
