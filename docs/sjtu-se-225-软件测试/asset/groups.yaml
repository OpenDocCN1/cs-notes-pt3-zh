    直接运行 Run->Run As->JUnit Test，就可以看到JUnit测试结果；绿色表示测试通过，只要有1个测试未通过，就会显示红色并列出未通过测试的方法。可以试图改变
    abs() 的代码，故意返回错误的结果（比如 return n+1;），然后再运行JUnit就会报告错误。


