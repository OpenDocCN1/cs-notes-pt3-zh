    # 6.1 软件工程标准化


    # 6.1.1 件工程标准化定义


    1983年我国 布的国家标准(GB3935.1-83)中对“标准”的定义是：“标准是对 复性事物和概念所做的统一规定。它以科学、技术、实践经和综合成果为基础，经有关方
    协商一致，由主管机构批准，以特定形式发布，作为共同 守的准则和依据。”


    1983年国 标准化组织发布的ISO第二号指南(第四版)对“标准”的 新定义是：“由有关各方根据科学技术成就与先 经，共同合作起草，一致或基本上同意的技术规范或其他公开文件，其目的在于促
    最佳的公众利益，并由标准化团体批准。”'
  - '[PAGE 256]


    在2000年发布的GB/T1.1-2000“标准化工作导则”中，将标准定义为：“为在一定的范围内获得最佳秩序，对活动或其结果规定共同的和复使用的规则、导则或特性文件。该文件经协商一致制定，并经一个公认机构的批准。标准应以科学、技术和经济的综合成果为基础，以促进最佳社会效益为目的。”


    +   - 统一性

    +   - 科学性

    +   - 权威性'
  - '[PAGE 257]


    # 6.1.2 软件工程标准的范围


    整个 件生存期: 从？到？


    跨越 件生存期各个 段的技术管理工作：？


    如： 程管理、 置管理、产品管理等


    如：产品分析、测试、评审和审计等


    +   - 所有 些方 建立的标准或规范，即是 件工程标准化。'
  - '[PAGE 258]


    # 6.1.3 软件工程标准化的作用


    +   (1)可提高软件的可读性、可维护性和可移植性，从而提高软件产品的质量；

    +   (2)可提高软件人员的技水平和软件的生产率；

    +   (3)可提高软件人员之间的信息效率，减少差异和误解；

    +   (4)为科学地进行软件管理奠定了基础；

    +   (5)有利于降低软件产品的成本和运行维护成本；

    +   (6)有利于缩短软件开发周期；

    +   (7)标准化是软件研究、生产、使用三者之间的桥梁。'
