    BS7799标准的第二部分经多次讨论修订, 也于2005年成为正式的ISO标准, 即ISO/IEC 27001:2005。


    是建立信息安全管理体系（ISMS）的一套规范（Specification for Information Security Management Systems），其中详细说明了建立、实施和维护信息安全管理体系的要求，指出实施机构应该遵循的评估标准。


    是信息与企业最重要的资质之一


    ?


