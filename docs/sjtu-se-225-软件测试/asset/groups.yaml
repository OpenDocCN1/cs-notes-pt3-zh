    # Contents of the course


    +   1. The purpose of Software testing

    +   2. Theory and methods of software test

    +      white-box test, black-box test, walk through, formal verification, clean
    room, fault level;

    +   3. Tools and environment of software test

    +      Eclipse, JUnit and EMMA

    +   4. Functional test

    +      Boundary testing, Equivalence partitioning, Decision table testing, testing
    efficiency'
