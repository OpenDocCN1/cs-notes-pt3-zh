  - '[PAGE 12]


    # Mars Climate Orbiter


    +   - Purpose: to relay signals from the Mars Polar Lander once it reached the
    surface of the planet

    +   - Disaster: smashed into the planet instead of reaching a safe orbit

    +   - Why: Software bug - failure to convert English measures to metric values

    +   - $165M

    +   - 1mile = 1609M


    ![](img/8454895dcf92bedbe5b40d0487077d64_12_0.png)


    ![](img/8454895dcf92bedbe5b40d0487077d64_12_1.png)'
  - '[PAGE 13]


    # Shooting Down of Airbus 300


    +   - 1988

    +   - US Vicennes shot down Airbus 300

    +   - Mistook airbus 300 for a F-14

    +   - 290 people dead

    +   - Why: Software bug - cryptic and misleading output displayed by the tracking
    software


    ![](img/8454895dcf92bedbe5b40d0487077d64_13_0.png)'
  - '[PAGE 14]


    # THERAC-25 Radiation Therapy


    +   - THERAC-25, a computer controlled radiation-therapy machine

    +   - 1986: two cancer patients at the East Texas Cancer Center in Tyler received
    fatal radiation overdoses

    +   - Why: Software bug - mishandled race condition (i.e., miscoordination between
    concurrent tasks)


