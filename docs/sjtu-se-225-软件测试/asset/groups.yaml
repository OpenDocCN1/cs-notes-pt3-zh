  md: "\n- `setUp()`是建立测试环境，创建一个Hello类的实例；`tearDown()`用于清理资源，如打开的文件等等。以`test`开头的方法被认为是测试方法，JUnit会依次执行`testXxx()`方法。在`testAbs()`方法中，我们对`abs()`的测试分别择正数，负数和0，如果方法返回值与期待结果相同，则`assertEquals`不会产生异常。\n\
