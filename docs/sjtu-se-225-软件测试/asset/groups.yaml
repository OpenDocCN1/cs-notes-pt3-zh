    \ 韩柯李娜等译, 机械工业出版社 2009年\n\nThe grade of the course will be determined as follows:\n\
    \nProjects 1~4: 40%,\nUsual test : 10%\nFinal exam: 50%\n\n## Contents of the\
    \ course\n\n- 1. The purpose of Software testing\n- 2. Theory and methods of software\
    \ test\n  white-box test, black-box test, walk through, formal verification, clean\
    \ room, fault level;\n- 3. Tools and environment of software test\n  Eclipse,\
    \ JUnit and EMMA\n- 4. Functional test\n  Boundary testing, Equivalence partitioning,\
    \ Decision table testing, testing efficiency\n\n![](img/8454895dcf92bedbe5b40d0487077d64_4_0.png)\n\
    \n## 5. Standards of software quality and software documentation\n\nISO9000, IEEE,\
    \ Chinese national standards\n\n## 6. Structure test\n\nControl-flow testing,\
    \ data-flow testing\n\n## 7. Web test and selenium\n\n## 8. Software Test in software\
    \ development process\n\nIntegrate test、 system test 、 accept test、\nInternationalization\
    \ test\n\n## 9. Interactive Testing（Correlation Test）\n\n## 10. Performance test\
    \ and LoadRunner\n\n## 11. Regression Test\n\nconcept and seminar\n\n## 12. Object-Oriented\
    \ Test\n\nbasic concept and methods\n\n## 13. Mutation test\n\nbasic concept and\
    \ methods\n\n## 14. Test Adequacy Measurement and Enhancement Control\n\n- Class\
    \ Prerequisites : Java, Software Engineering\n- Project requirement: **4 students\
