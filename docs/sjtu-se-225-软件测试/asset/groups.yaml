  mdcn: "\n\n# 软件测试\n\nHufei\n\n2015-09\n\n## 课程信息\n\n- 学分：3\n- 2~4 classes /week,\
    \ 16 weeks\n- 教材：\n  《SoftwareTesting》, A Craftsman’s Approach, Fourth Edition,\
    \ Paul C. Jorgensen, 2014\n  《软件测试:第3版》, 人民邮电出版社, 2011\n  《软件测试: 第2版》, 机械工业出版社,\
    \ 2002\n- 参考书：\n  ① “Foundation of software testing”, Aditya P. Mathur, 机械工业出版社,\
    \ 2011年\n  ② 《软件测试 原理与实践》, srinivasan Desikan 韩柯李娜等译, 机械工业出版社 2009年\n\n课程成绩将按以下方式确定：\n\
    \nProjects 1~4: 40%,\nUsual test : 10%\nFinal exam: 50%\n\n## 课程内容\n\n- 1. 软件测试的目的\n\
    - 2. 软件测试的理论与方法\n  white-box test, black-box test, walk through, formal verification,\
    \ clean room, fault level;\n- 3. 软件测试的工具与环境\n  Eclipse, JUnit and EMMA\n- 4. 功能测试\n\
    \  Boundary testing, Equivalence partitioning, Decision table testing, testing\
    \ efficiency\n\n![](img/8454895dcf92bedbe5b40d0487077d64_4_0.png)\n\n## 5. 软件质量标准与软件文档\n\
    \nISO9000, IEEE, Chinese national standards\n\n## 6. 结构测试\n\nControl-flow testing,\
    \ data-flow testing\n\n## 7. Web 测试与 selenium\n\n## 8. 软件开发过程中的软件测试\n\nIntegrate\
    \ test、 system test 、 accept test、\nInternationalization test\n\n## 9. 交互测试（相关性测试）\n\
    \n## 10. 性能测试与 LoadRunner\n\n## 11. 回归测试\n\nconcept and seminar\n\n## 12. 面向对象测试\n\
    \nbasic concept and methods\n\n## 13. 变异测试\n\nbasic concept and methods\n\n##\
    \ 14. 测试充分性度量与增强控制\n\n- 先修课程 : Java, Software Engineering\n- 项目要求：**4名学生组成一个测试小组，应完成以下4个项目**；\n\
    - 项目1：**黑盒测试用例生成** - 第3~6周；选取带需求文档的主题应用；创建黑盒测试用例；执行测试；在缺陷跟踪工具中报告缺陷。\n\nProject\
    \ 2: White-box test-case generation and coverage - during week 7~10; use instrument;\
    \ evaluate coverage; create additional white-box test cases to satisfy some coverage\
    \ criteria.\n\nProject 3: GUI test :during week 11~14; Select a software GUI with\
    \ at least 2 level , Use selenium, to complete GUI test.\n\nProject 4: Performance\
    \ test: during week 15~17; select a software of web server, use-LoadRunner, to\
    \ complete performance test.\n\n## 教师信息：\n\n胡飞: 软件大楼 1310 室\n电子邮箱: [hufei@sjtu.edu.cn](mailto:hufei@sjtu.edu.cn)\n\
    \nCo-Teacher: 姚建国，软件大楼 1110室\n电子邮箱：[jianguo.yao@sjtu.edu.cn](mailto:jianguo.yao@sjtu.edu.cn)\n\
    \nTA: 舒映、王臻\n软件大楼 1411室\n电子邮箱:\n\nOffice time: Wednesday afternoon 14:00~16:30\n\
    \n## Chapter 1\n\n## 软件测试简介\n\n### 1.1 软件测试的重要性\n\n### 1.2 概念与术语\n\n1.2.1 测试目标\n\
    \n1.2.2 关于测试的事实\n\n1.2.3 Glossary(术语)\n\n1.2.4 软件测试的基本概念\n\n1.2.5 缺陷分类\n\n## 1.1\
    \ 软件测试的重要性\n\n## 火星气候轨道器\n\n- 目的：to relay signals from the Mars Polar Lander once\
    \ it reached the surface of the planet\n- 灾难：smashed into the planet instead of\
    \ reaching a safe orbit\n- 原因：Software bug - failure to convert English measures\
    \ to metric values\n- $165M\n- 1mile = 1609M\n\n![](img/8454895dcf92bedbe5b40d0487077d64_12_0.png)\n\
    \n![](img/8454895dcf92bedbe5b40d0487077d64_12_1.png)\n\n## 空中客车300被击落\n\n- 1988\n\
    - US Vicennes shot down Airbus 300\n- Mistook airbus 300 for a F-14\n- 290 people\
    \ dead\n- 原因：Software bug - cryptic and misleading output displayed by the tracking\
    \ software\n\n![](img/8454895dcf92bedbe5b40d0487077d64_13_0.png)\n\n## THERAC-25\
    \ 放射治疗\n\n- THERAC-25, a computer controlled radiation-therapy machine\n- 1986:\
    \ two cancer patients at the East Texas Cancer Center in Tyler received fatal\
    \ radiation overdoses\n- 原因：Software bug - mishandled race condition (i.e., miscoordination\
    \ between concurrent tasks)\n\n![](img/8454895dcf92bedbe5b40d0487077d64_14_0.png)\n\
    \n"
