    ## 2.9 状态图


    StateChart 记法：设计一种视觉记法，结合了 Venn 图表达层次结构的能力和有向图表达连通性的能力（Harel, 1988）。


    如果一个状态包含子状态，如状态 A 所示，则边“引用”所有子状态。


    因此，从 A 到 D 的边意味着转换可以从状态 B 或从状态 C 发生。


