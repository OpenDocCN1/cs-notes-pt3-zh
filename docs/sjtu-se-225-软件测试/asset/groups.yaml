    \ an Antarctic mountain*\n- *North American Aerospace Defense Command reported\
    \ that the U.S. was under missile attack; traced to faulty computer software -\
    \ generated incorrect signals*\n- *Manned space capsule Gemini V missed its landing\
    \ point by 100 miles; software ignored the motion of the earth around the sun*\n\
    \n![](img/8454895dcf92bedbe5b40d0487077d64_18_0.png)\n\n![](img/8454895dcf92bedbe5b40d0487077d64_18_1.png)\n\
    \n## More...\n\n- \"Ghost in the Machine,\" Time Magazine, Jan. 29, 1990. p. 58\n\
    \  - Dallas/Fort Worth air-traffic system began spitting out gibberish in the\
    \ Fall of 1989 and controllers had to track planes on paper\n\n## More...\n\n\
    - Software Reliability: Principles & Practice, p. 25, by G. J. Myers\n  - Apollo\
    \ 8 spacecraft erased part of the computer's memory\n  - Eighteen errors were\
    \ detected during the 10-day flight of Apollo 14\n  - An error in a single FORTRAN\
    \ statement resulted in the loss of the first American probe to Venus(金星)\n\n\
    ## More...\n\n- ACM SIGSOFT Software Engineering Notes,  \n  vol. 6, no. 2\n \
    \ - *F-18 fighter plane crashed due to a missing exception condition*\n\n- ACM\
    \ SIGSOFT Software Engineering Notes,  \n  vol. 9, no. 5\n  - *F-14 fighter plane\
    \ was lost to uncontrollable spin, traced to tactical(战术) software*\n\n## 1999年千年虫Bug\
    \ 5000亿\n\n为了节省计算机的存储空间，软件经常将存储日期用两位阿拉伯数字表示，即用“99”来表示“1999”，还用“00”来代替“1900”而不是2000，所以到2000年的时候，软件漏洞就表现出来了。\n\
    \n## More ...\n\n- 2011年7月23日晚，在温州发生动车追尾脱轨坠落事故，40人死亡。\n- 原因：列车控制中心设备存在严重设计缺陷、上道使用审查把关不严、雷击导致设备故障。\n\
    - 2012年1月，中国返乡旅客导致铁路网上售票系统瘫痪\n- 原因：春运时，数以百万、千万乃至亿计的旅客需求，使意在方便旅客购票的铁路网络售票系统无法正常工作\n\
    \n• and many many more ....\n\n![](img/8454895dcf92bedbe5b40d0487077d64_24_0.png)\n\
    \n## What’s your experience?\n\n## Economic Impact\n\n- NIST study\n- On CNN.com\
    \ - April 27, 2003\n\nLast year, a study commissioned by the National Institute\
    \ of Standards and Technology found that software errors cost the U.S. economy\
    \ about $59.5 billion annually, or about 0.6 percent of the gross domestic product.\
    \ More than half the costs are borne by software users, the rest by developers\
    \ and vendors.\n\n## Expectation\n\n- Can't we expect software to execute correctly?\n\
    - Carefully made programs\n  - *5 faults/1000 LOC*\n  - *1M LOC will have 5000\
    \ faults*\n- Windows XP has 45M LOC\n  - *How many faults?*\n  - *45 × 5000 =\
    \ 225,000*\n- Win 8 : 25G~30G\n- Why not remove the faults?\n\n*** STOP: 0x0000000A\
