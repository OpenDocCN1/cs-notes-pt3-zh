  md: "\n## 如何寻找McCabe路径？\n\n### 图的搜索与遍历算法！\n\n- 深度优先算法\n- 广度优先算法\n\n![](img/8454895dcf92bedbe5b40d0487077d64_320_0.png)\n\
    \n## Essential Complexity\n\nIn general, when a program is well structured (i.e.,\
    \ is composed solely of the structured programming constructs), it can always\
    \ be reduced to a graph with one path.\n\n![](img/8454895dcf92bedbe5b40d0487077d64_321_0.png)\n\
    \n## 7.1.4 Insights from a Venn Diagram\n\n基于路径的测试，从另一个角度去考虑程序测试的完备性，但是没有考虑数据功能，即使满足DD-路径覆盖，和考虑圈复杂度指标，也仅是测试的下限指标。\n\
    \n如左图：\n\n- S：已说明行为的路径集合；\n- P：已编程实现的路径集合；\n- T：拓扑可达的路径集合；\n\n区域：\n\n- 1：测试的重点，可测；\n\
    - 2、6：已实现的，就应该是拓扑可行的，\n- 3：已实现和可达的，应该是有用的！\n- 4：已描述的，拓扑可达，却没有实现的；要增加，可测；\n- 5：没有实现的已说明路径，不可测，\n\
    - 7：未说明，未实现，拓扑可达，测试无意义！\n\n![](img/8454895dcf92bedbe5b40d0487077d64_322_0.png)\n\
    \n可行的和在拓扑结构上可能的路径\n\n## 7.2 Data Flow Testing\n\nData flow testing refers to forms\
    \ of structural testing that focus on the points at which variables receive values\
    \ and the points at which these values are used.\n\n### 7.2.1 Define/Use Testing\n\
    \n1. The program graph G(P) is constructed as in Chapter 4, with statement fragments\
    \ as nodes and edges that represent node sequences.\n\n2. Node n ∈ G(P) is a defining\
    \ node of the variable v ∈ V, written as DEF(v, n), if and only if the value of\
    \ variable v is defined as the statement fragment corresponding to node n.\n\n\
    3. Node n ∈ G(P) is a usage node of the variable v ∈ V, written as USE(v, n),\
    \ if and only if the value of the variable v is used as the statement fragment\
    \ corresponding to node n.\n\n4. A usage node USE(v, n) is a predicate use (denoted\
    \ as P-use) if and only if the statement n is a predicate statement; otherwise,\
    \ USE(v, n) is a computation use (denoted C-use).\n\n5. A definition/use path\
    \ with respect to a variable v (denoted du-path) is a path in PATHS(P) such that,\
    \ for some v ∈ V, there are define and usage nodes DEF(v, m) and USE(v, n) such\
    \ that m and n are the initial and final nodes of the path.\n\n6. A definition-clear\
    \ path with respect to a variable v (denoted dc-path) is a definition/use path\
    \ in PATHS(P) with initial and final nodes DEF(v, m) and USE(v, n) such that no\
    \ other node in the path is a defining node of v.\n\n### Example: the commission\
    \ problem\n\n（P162 Figure 9.1，8分钟阅读）\n\n```\n7.  lockPrice=45.0\n8.  stockPrice=30.0\n\
    9.  barrelPrice=25.0\n10. totalLocks=0\n11. totalStocks=0\n12. totalBarrels=0\n\
    \n13. Input(locks)\n14. While NOT(locks==-1)\n15. Input(stocks,barrels)\n16. totalLocks=totalLocks+locks\n\
    17. totalStocks=totalStocks+stocks\n18. totalBarrels=totalBarrels+barrels\n19.\
    \ Input(locks)\n20. ENDWhile\n```\n\np5=<16,17,18,19,20,21>\np6=<16,17,18,19,20,21,22,23,24>\n\
    \nBoth have the loop iteration problem, so both are not definition-clear.\n\n\
    Other variables’ analyses are read by the students themselves.\n\n## Define/Use\
    \ Test Coverage Metrics\n\n- All-Defs criterion: for the program P if and only\
    \ if for every variable v ∈ V, T contains definition-clear paths from every defining\
    \ node of v to a use of v.\n\n- All-Uses criterion: for the program P if and only\
    \ if for every variable v ∈ V, T contains definition-clear paths from some defining\
    \ node of v to every use of v, and to the successor node of each USE(v, n).\n\n\
    - All-P-Uses/Some C-Uses criterion: for the program P if and only if for every\
    \ variable v ∈ V, T contains definition-clear paths from every defining node of\
    \ v to every predicate use of v; and if a definition of v has no P-uses, a definition-clear\
    \ path leads to at least one computation use.\n\n- All-C-Uses/Some P-Uses criterion:\
    \ for the program P if and only if for every variable v ∈ V, T contains definition-clear\
    \ paths from every defining node of v to every computation use of v; and if a\
    \ definition of v has no C-uses, a definition-clear path leads to at least one\
    \ predicate use.\n\n### Example\n\n- ⊙ Variable locks have 2 use nodes (14, 16)\
    \ and 2 defining nodes (13, 19), then:\n\n  ```\n  S1: S(locks,13) = {13}\n  S2:\
    \ S(locks,14) = {13,14,19,20}\n  S3: S(locks,16) = {13,14,16,19,20}\n  S4: S(locks,19)\
    \ = {19}\n  ```\n\n- ⊙ stocks and barrels variables are to be influenced by the\
    \ loop variable locks, so\n\n  ```\n  S5: S(stocks,15) = {15}?\n  S5: S(stocks,15)\
    \ = {13,14,15,19,20}\n  S6: S(stocks,17) = {13,14,15,17,19,20}\n  S7: S(barrels,15)\
    \ = {13,14,15,19,20}\n  S8: S(barrels,18) = {13,14,15,18,19,20}\n  ```\n"
  mdcn: "\n\n## 如何寻找McCabe路径？\n\n### 图的搜索与遍历算法！\n\n- 深度优先算法\n- 广度优先算法\n\n![](img/8454895dcf92bedbe5b40d0487077d64_320_0.png)\n\
    \n## Essential Complexity\n\n一般而言，当程序结构良好时，即仅由结构化编程构造组成，它始终可以简化为具有一条路径的图。\n\n\
    ![](img/8454895dcf92bedbe5b40d0487077d64_321_0.png)\n\n## 7.1.4 Insights from\
    \ a Venn Diagram\n\n基于路径的测试，从另一个角度去考虑程序测试的完备性，但是没有考虑数据功能，即使满足DD-路径覆盖，和考虑圈复杂度指标，也仅是测试的下限指标。\n\
    \n如左图：\n\n- S：已说明行为的路径集合；\n- P：已编程实现的路径集合；\n- T：拓扑可达的路径集合；\n\n区域：\n\n- 1：测试的重点，可测；\n\
    - 2、6：已实现的，就应该是拓扑可行的，\n- 3：已实现和可达的，应该是有用的！\n- 4：已描述的，拓扑可达，却没有实现的；要增加，可测；\n- 5：没有实现的已说明路径，不可测，\n\
    - 7：未说明，未实现，拓扑可达，测试无意义！\n\n![](img/8454895dcf92bedbe5b40d0487077d64_322_0.png)\n\
    \n可行的和在拓扑结构上可能的路径\n\n## 7.2 Data Flow Testing\n\n数据流测试是指关注变量接收值的位置以及这些值被使用的位置的结构化测试形式。\n\
    \n### 7.2.1 Define/Use Testing\n\n1. 程序图 G(P) 如第 4 章所述构造，以语句片段作为节点，以表示节点序列的边。\n\
    \n2. 节点 n ∈ G(P) 是变量 v ∈ V 的定义节点，记为 DEF(v, n)，当且仅当变量 v 的值由对应于节点 n 的语句片段定义。\n\n\
    3. 节点 n ∈ G(P) 是变量 v ∈ V 的使用节点，记为 USE(v, n)，当且仅当变量 v 的值在对应于节点 n 的语句片段中被使用。\n\n\
    4. 使用节点 USE(v, n) 是谓词使用，记为 P-use，当且仅当语句 n 是谓词语句；否则，USE(v, n) 是计算使用，记为 C-use。\n\
    \n5. 关于变量 v 的定义/使用路径，记为 du-path，是 PATHS(P) 中的一条路径，使得对于某个 v ∈ V，存在定义节点和用法节点 DEF(v,\
    \ m) 和 USE(v, n)，使得 m 和 n 是该路径的初始节点和最终节点。\n\n6. 关于变量 v 的定义清晰路径，记为 dc-path，是 PATHS(P)\
    \ 中的一条定义/使用路径，其初始节点和最终节点为 DEF(v, m) 和 USE(v, n)，使得路径中没有其他节点是 v 的定义节点。\n\n### Example:\
    \ the commission problem\n\n（P162 Figure 9.1，8分钟阅读）\n\n```\n7.  lockPrice=45.0\n\
    8.  stockPrice=30.0\n9.  barrelPrice=25.0\n10. totalLocks=0\n11. totalStocks=0\n\
    12. totalBarrels=0\n\n13. Input(locks)\n14. While NOT(locks==-1)\n15. Input(stocks,barrels)\n\
    16. totalLocks=totalLocks+locks\n17. totalStocks=totalStocks+stocks\n18. totalBarrels=totalBarrels+barrels\n\
    19. Input(locks)\n20. ENDWhile\n```\n\np5=<16,17,18,19,20,21>\np6=<16,17,18,19,20,21,22,23,24>\n\
    \n两者都存在循环迭代问题，因此两者都不是定义清晰的。\n\n其他变量的分析由学生自行阅读。\n\n## Define/Use Test Coverage\
    \ Metrics\n\n- All-Defs criterion: 对于程序 P，当且仅当对于每个变量 v ∈ V，T 包含从 v 的每个定义节点到 v\
    \ 的使用的定义清晰路径。\n\n- All-Uses criterion: 对于程序 P，当且仅当对于每个变量 v ∈ V，T 包含从 v 的某个定义节点到\
    \ v 的每个使用的定义清晰路径，以及到每个 USE(v, n) 的后继节点。\n\n- All-P-Uses/Some C-Uses criterion:\
    \ 对于程序 P，当且仅当对于每个变量 v ∈ V，T 包含从 v 的每个定义节点到 v 的每个谓词使用的定义清晰路径；并且如果 v 的一个定义没有 P-use，则定义清晰路径通向至少一个计算使用。\n\
    \n- All-C-Uses/Some P-Uses criterion: 对于程序 P，当且仅当对于每个变量 v ∈ V，T 包含从 v 的每个定义节点到\
    \ v 的每个计算使用的定义清晰路径；并且如果 v 的一个定义没有 C-use，则定义清晰路径通向至少一个谓词使用。\n\n### Example\n\n\
    - ⊙ Variable locks have 2 use nodes (14, 16) and 2 defining nodes (13, 19), then:\n\
    \n  ```\n  S1: S(locks,13) = {13}\n  S2: S(locks,14) = {13,14,19,20}\n  S3: S(locks,16)\
    \ = {13,14,16,19,20}\n  S4: S(locks,19) = {19}\n  ```\n\n- ⊙ stocks and barrels\
    \ variables are to be influenced by the loop variable locks, so\n\n  ```\n  S5:\
    \ S(stocks,15) = {15}?\n  S5: S(stocks,15) = {13,14,15,19,20}\n  S6: S(stocks,17)\
    \ = {13,14,15,17,19,20}\n  S7: S(barrels,15) = {13,14,15,19,20}\n  S8: S(barrels,18)\
    \ = {13,14,15,18,19,20}\n  ```\n\n"
