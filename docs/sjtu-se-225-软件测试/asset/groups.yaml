    \ 姚建国，软件大楼 1110室\n电子邮箱：[jianguo.yao@sjtu.edu.cn](mailto:jianguo.yao@sjtu.edu.cn)\n\
    \nTA: 舒映、王臻\n软件大楼 1411室\n电子邮箱:\n\nOffice time: Wednesday afternoon 14:00~16:30\n\
    \n## Chapter 1\n\n## Introduction of software testing\n\n### 1.1 Importance of\
    \ software testing\n\n### 1.2 Concepts and Glossary\n\n1.2.1 Goals of testing\n\
    \n1.2.2 Facts About Testing\n\n1.2.3 Glossary(术语)\n\n1.2.4 The basic concepts\
    \ of software test\n\n1.2.5 Fault Taxonomies\n\n## 1.1 Importance of software\
    \ testing\n\n## Mars Climate Orbiter\n\n- Purpose: to relay signals from the Mars\
