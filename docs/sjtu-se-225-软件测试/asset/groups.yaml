    \ x ∉ A};\n  - A − B = {x: x ∈ A ∧ x ∉ B};\n  - A ⊕ B = (A ∪ B) − (A ∩ B);\n \
    \ - A × B = {<x, y>: x ∈ A ∧ y ∈ B}\n\n### 2.2 函数\n\n**定义**\n\n给定集合 A 和 B，函数 f\
