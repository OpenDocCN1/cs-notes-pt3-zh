- pgno: 212
  md: '# Normal Boundary Value Testing


    refers to these values as min, min+, nom, max−, and max.


    **“single fault” assumption:** failures are only rarely the result of the simultaneous
    occurrence of two (or more) faults.


    ![](img/8454895dcf92bedbe5b40d0487077d64_212_0.png)


    if we have a function of n variables, boundary value analysis yields **4n + 1**
    unique test cases.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Limitations of Boundary Value Analysis


    +   - Boundary value analysis works well when the program to be tested is a function
    of several independent variables that represent bounded physical quantities.

    +   - Why?

    +   1. the variables need to be described by a true ordering relation.

    +   2. value analysis presumes the variables to be truly independent.

    +   3. no consideration of the nature of the function, nor of the semantic meaning
    of the variables.'
  merge: -1
  img_proc: true
