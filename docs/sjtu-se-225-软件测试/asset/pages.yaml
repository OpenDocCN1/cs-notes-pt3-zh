- pgno: 56
  md: '# 1.2.3 Glossary(术语)


    +   - **Error (ISO)(错误)**

    +     - *A good synonym is mistake. Errors tend to propagate;*

    +   - **Fault(故障)**

    +     - *A fault is the result of an error. Defect (see the ISTQB Glossary) is
    a good synonym for fault.*

    +   - **Failure (IEEE)(失效)**

    +     - *The inability of a system or component to perform its required functions
    within specified performance requirements.*

    +   - **Incident(事件)**

    +     - *When a failure occurs, it may or may not be readily apparent to the user
    (or customer or tester). An incident is the symptom associated with a failure
    that alerts the user to the occurrence of a failure.*'
  merge: -1
  img_proc: true
