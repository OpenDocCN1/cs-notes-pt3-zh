- pgno: 98
  md: '由上面的说明，我们可以将有穷状态机表示为一个5元组（J, K, T, S, F），其中：


    +   - J 是一个有穷的非空状态集；

    +   - K 是一个有穷的非空输入集；

    +   - T 是一个从（J-F）×K到J的转换函数；

    +   - S ∈ J，是唯一的初始态；

    +   - F J，是若干个终止态。


    有穷状态机在计算机系统中应用的十分广泛。如操作系统中的作业调度与管理，GUI图形用户界面的驱动等。'
