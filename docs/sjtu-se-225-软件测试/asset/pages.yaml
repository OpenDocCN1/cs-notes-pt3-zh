- pgno: 292
  md: '第一级（初始 ）：无序


    第二级（可 复级）： 件 目的策划和跟踪是稳定的，提供 了可 复以前成功实践的 目环境。


    第三级（已定义级）：定义了完整的 件 程( 程模型)，并在 件 程工程活动和 件 目工程活动中，实现了标准化和文档化。


    第四级（已管理级）：建立了定 的质 目标，所有 目的要 程活动 是可度 的。


    第五级（优化级）： 件机构能够 中精力 行不断的 程改 。'
