- pgno: 143
  md: '# 3.4.4 Fault Statistics


    +   - Fault statistics **provide a useful metric for determining whether to continue
    testing a module of product or whether to recode it.**

    +   - The number of faults detected via execution- and non-execution-based techniques
    must be recorded.

    +   - Data on different types of faults found via code inspections (faults such
    as misunderstanding the design, initializing improperly, and using variables inconsistently)
    can be incorporated into checklists for use during later reviews of the same product
    and future products.'
  merge: -1
  img_proc: true
