  md: '# 3.1.2 Inspection


    +   - An inspection is a far more formal activity than a code walkthrough.

    +   - It is conducted by a team of three to six people


    a moderator


    a representative of next step


    one or more representative of implementation


    a recorder'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The review process consists of five formal steps:


    +   - In the **overview** step, the author of the module gives a presentation
    to the team.

    +   - In the **preparation** step, the participants try to understand the code
    in detail and compile lists of issues, ranked in order of severity(严重性). They
    are aided in this process by a checklist of potential faults for which to be on
    the lookout.

    +   - In the **inspection** step, a thorough walkthrough of the code is performed,
    aiming for fault detection through complete coverage of the code. Within a day
    of the inspection, the moderator produces a meticulous（小心翼翼）written report.

    +   - In the **rework** step, the individual responsible for the code resolves
    all faults and issues noted in the written report. （Individual Reviewer Issues
    Spreadsheet）

    +   - In the **follow-up** step, the moderator must make sure that each issue
    has been resolved by either fixing the code or clarifying confusing points. （Review
    Report Spreadsheet）'
  merge: -1
  img_proc: true
