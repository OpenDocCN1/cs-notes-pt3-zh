- pgno: 310
  md: "# DD-Path Definition\n\nA DD-path is a sequence of nodes in a program graph\
    \ such that\n\n+   Case 1: It consists of a single node with indeg = 0.\n+   \n\
    +   Case 2: It consists of a single node with outdeg = 0.\n+   \n+   Case 3: It\
    \ consists of a single node with indeg ≥ 2 or outdeg ≥ 2.\n+   \n+   Case 4: It\
    \ consists of a single node with indeg = 1 and outdeg = 1.\n+   \n+   Case 5:\
    \ It is a maximal chain of length ≥ 1."
  merge: -1
