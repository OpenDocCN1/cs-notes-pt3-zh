    +   3：已实现和可达的，应该是 有用的！

    +   4：已描述的，拓扑可达，却没有实现的；要增加，可测；

    +   5：没有实现的已说明路径，不可测，

    +   7：未说明，未实现，拓扑可达，测试无意义！


