- pgno: 306
  md: '分支覆盖(branch coverage): ?


    路径覆盖(path coverage): ?


    +   - 分支覆盖又称为判定覆盖，它要求设计足够的测试用例，使得程序中每个判定至少有一次为真值，有一次为假值，即：程序中的每个分支至少执行一次。

    +   - 路径覆盖,它要求设计足够的测试用例，使得程序中所有可能的执行路径都被执行一次。'
  merge: -1
  img_proc: true
