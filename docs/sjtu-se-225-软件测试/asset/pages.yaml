- pgno: 47
  md: '# 1.2.1 Goals of testing


    +   - Testing is a process of executing a program with the intent of finding an
    error.

    +   - A good test is one that has a high probability of finding an as yet undiscovered
    error.

    +   - A successful test is one that uncovers an as yet undiscovered error.

    +   - The objective is to design tests that systematically uncover different classes
    of errors and do so with a minimum amount of time and effort.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - Demonstrate that software functions appear to be working according to
    specification.

    +   - That performance requirements appear to have been met.

    +   - Data collected during testing provides a good indication of software reliability
    and some indication of software quality.


    Testing cannot show the absence of defects, it can only show that software defects
    are present.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 1.2.2 Facts About Testing


    +   - Question “does program P obey specification S” is undecidable!

    +   - Every testing technique embodies some compromise between accuracy and computational
    cost

    +   - Facts

    +     - Inaccuracy is not a limitation of the technique, It is theoretically impossible
    to devise a completely accurate technique

    +     - Every practical technique must sacrifice accuracy in some way'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Why?


    The current development methods of

    software are:


    +   - Depend on people’s intelligence

    +   - Specification is informal or even chaos

    +   - Software development tools are not self-contained

    +   - Software development process is elective and

    +     without standards on detail


    在当前的软件开发方法学指导下开发软件，软件测试仍是保证

    软件质量和可靠性的重要手段。'
