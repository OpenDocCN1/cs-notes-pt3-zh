  md: '# 7.1.3 McCabe’s Basis Path Method


    # 基路径的概念与方法


    “基”：向量空间的概念，向量空间的基是相互独立的一组向量，基“覆盖”整个向量空间。使得该空间中的任何其它向量都可以用基向量表示。


    基路径：程序图中相互独立的一组路径，使得该程序中的所有路径都可以用基路径表示。


    Cyclomatic number (圈数) of a strongly connected graph is the number of linearly
    independent circuits in the graph.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# McCabe圈数V（G）计算方法：


    V（G）=e-n+2p


    e： 边数；


    n： 节点数


    p： 连接区域数


    对于右图： V（G）=10-7+2p=5


    为避免混乱，不再说明强连接有向图的计算公式

    (不满足单入口、单出口条件)。


    ![](img/8454895dcf92bedbe5b40d0487077d64_318_0.png)'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 5 independent paths:


    +   P1: A, B, C, G;

    +   P2: A, B, C, B, C, G;

    +   P3: A, B, E, F, G;

    +   P4: A, D, E, F, G;

    +   P5: A, D, F, G。


    Any path could be a combination of 5 independent paths.


    Example : A、B、C、B、E、F、G = P2+P3-P1


    其中，加法是一条路径后接一条路径；乘法是路径的重复，而减法则只有数学上去除边的含义，而缺少实际意义。


    =A, B, C, B, C, G+ A, B, E, F, G- A, B, C, G ;

    AB+BC+CB+BC+CG+AB+BE+EF+FG-AB-BC-CG

    = A、B、C、B、E、F、G


