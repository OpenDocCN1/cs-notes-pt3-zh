- pgno: 198
  md: '# 1.3测试范围


    本次系统测试将 用开发相关测试 件和利用成熟的测试工具相结合的 方式，现场对系统 行测试。按照系统 求任务书的要求，分别 行系统的功能测试、性能测试、故 测试以及安全性测试等相关内
