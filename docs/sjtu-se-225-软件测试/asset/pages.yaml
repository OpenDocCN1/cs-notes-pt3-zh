- pgno: 147
  md: 'The Cleanroom technique has had considerable success in finding and weeding
    out faults before execution-based testing.


    In one case, all faults were found via correctness-proving techniques, using largely
    informal proofs, but with a few formal proofs as well. The resulting code was
    found to be free of errors both at compilation and at execution time.


    In a study of 17 other Cleanroom software products, the products did not perform
    quite as faultlessly, but they still achieved remarkably low fault rates, an average
    of 2.3 faults per KLOC.


    But average there are 25 faults per KLOC!'
  merge: -1
