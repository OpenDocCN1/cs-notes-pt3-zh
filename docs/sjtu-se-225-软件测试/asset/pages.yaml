- pgno: 115
  md: '# 3.2 Execution-based Verification


    Use test cases to execute the program, get all results from the execution.


    There are two basic approaches to testing modules, each with its own weaknesses.


    +   - Testing to Specifications, also known as black-box test.

    +   - Testing to Code, also called glass-box, white-box test.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 3.2.1 Black-box test


    ![](img/8454895dcf92bedbe5b40d0487077d64_116_0.png)


    +   - Seeks to verify that the module conforms to the specified input and output
    while ignoring the actual code

    +   - It is rarely possible to test all modules for all possible input cases,
    which may be a huge number of modules'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   - Equivalence testing is a technique based on the idea that the input specifications
    give ranges of values for which the software product should work the same way.

    +   - Boundary value analysis seeks to test the product with input values that
    lie on and just to the side of boundaries between equivalence classes.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'For example the input is (a,b), there are at least 5 equivalence classes:


    ![](img/8454895dcf92bedbe5b40d0487077d64_118_0.png)


    **functional testing**, the tester identifies each item of functionality or each
    function implemented in the module and uses data to test each function.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 3.2.2 White-box test


    ![](img/8454895dcf92bedbe5b40d0487077d64_119_0.png)


    +   Also called logic-driven, or path-oriented testing.


    +   testing each path through the code is generally not feasible, even for simple
    flowcharts.


    +   Moreover, it is possible to test every path without finding existing faults,
    because, for example, the fault lies in the decision criterion for selecting between
    paths.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   - **statement coverage** and amounts to running tests in which every statement
    in the code is executed at least once.

    +   - **branch coverage**, makes sure that each branching point is tested at least
    once.

    +   - **path coverage**, make sure that every different path is tested at least
    once.'
  merge: -1
  img_proc: true
