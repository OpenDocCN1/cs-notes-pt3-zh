  md: 从第一次的256个测试规则到现在的13个测试规则，测试等价类的完备性是一样的。换言之，从决策表测试方法，我们可以充分地认识到，测试用例越多，并不能增加测试的完备性。而通过分析与合并，使用尽可能少的测试用例来达到测试完备性要求，正是测试技术研究的核心内容和目标。
