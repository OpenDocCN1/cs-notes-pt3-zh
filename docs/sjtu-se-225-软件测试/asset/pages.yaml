- pgno: 133
  md: 'Input specification, n is a positive integer,


    **A:**  n∈{1,2,3……}


    Output specification is that if control reaches point **H**, the value of **s**
    contains the sum of **n** values stored in array **y**,


    **H:**  s = y[0]+y[1]+…+y[n-1]


    A stronger output specification is,


    **H:**  k=n and s = y[0]+y[1]+…+y[n-1]


    How proven from **A** to **H**? key is proven the invariant of the loop, that
    is,


    **D:**  k≤n and s=y[0]+y[1]+…+y[k-1]


    # First


    **B:**  k=0


    This is easy to prove, because of assignment statement


    k ← 0 is executed.'
  merge: -1
