  md: '从上面的例子我们可以看到，一个有穷状态机包括以下5个部分：状态集J、输入（动作）集K、状态转换函数（转换表）T、初始态S和终止态F。对于上面的例子有穷状态机的各个部分如下：


    +   ◆ 状态集J：{准备状态，启动状态，前进状态，后退状态};

    +   ◆ 输入集K：{打火，熄火，挂前进档，挂后退档，挂启动档};

    +   ◆ 转换函数T：如表13-1所示;

    +   ◆ 初始态S：{准备状态};

    +   ◆ 终止态F：{准备状态};'
