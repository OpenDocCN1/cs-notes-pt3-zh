- pgno: 274
  md: '# 文档实例1：软件项目开发计划

    （学生自学用）


    # 1) 引言


    **编写目的：**　明确编写件计划的目的，指出读者对象。


    **背景：**　包括　目委托单位、开发单位和主管　；该系统与其他系统的关系。


    **定义：**　列出本文档中用到的专　术语的定义和缩略词的原文。


    **参考资料：** 包括　目经核准的计划任务书、合同或上级机关的批文；文档所引用的资料、规范等；列出资料的作者、标　、编号、发布日期、出版单位或资料来源。


    # 2) 目标


    **摘要说明**　目的各　主要工作，介绍所开发　件的功能性能等。


    **条件与限制：**　明确完成　目应具备的条件；开发单位已具备的条件以及尚　创　的条件。必要时，应说明用户及分合商承担的工作、完成期　及其他条件与　制。'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# （学生自学用）


    # 产品：


    +   (1)程序：列出应交付的程序名称使用的语言及存储形式。


    +   (2)文档：列出应交付的文档。


    +   (3) 行环境：应包括硬件环境和 件环境。


    +   (4)服务： 明开发单位可向用户提供的服务，如人员培训、安装、维护和其他 行支持。


    +   (5) 收标准。


    # 3) 实施计划


    任务分解：任务的划分及各 任务的负责人。


    度：按 段完成的 目，用图表说明开始时 完成时 。


    算：描 本 目的总费用概算。


    关 ：说明可能影响 目的关 ，如设备条件技


    术 点或其他 因素，并说明对策。


    人员组织及分工。


    # 4) 交付期'
