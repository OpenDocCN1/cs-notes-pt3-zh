    **(input specification)**


    k = 0


    k=0 and s=0


    k<n and s=y[0]+y[1]+...+y[k-1]


    **(loop invariant)**


    Yes


    k=n and s=y[0]+y[1]+...+y[n-1]


    **(output specification)**


    No


    k<n and s=y[0]+y[1]+...+y[k-1]


