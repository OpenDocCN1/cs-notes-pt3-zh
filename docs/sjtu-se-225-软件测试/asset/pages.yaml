- pgno: 186
  md: '# 4.4 EMMA


    +   - 测试覆盖率（Code Coverage）

    +   - 测试覆盖率，简单的说，就是评价测试活动覆盖产品代码的指标。测试的目的，是确认产品代码按照期一样工作，也可以看作是产品代码工作方式的说明文档。一步考虑，测试覆盖率可以看作是产品代码质的
    接指标——之所以说是 接指标，因为测试覆盖率评价的是测试代码的质 ，并不是产品代码的质 。

    +   - 代码覆盖率是一种白盒测试，因为测试覆盖率是评价产品代码类内的指标，而不是评价系统接口或规约。测试覆盖率尤其用于评价测试代码是否已经覆盖了产品代码所有的路径。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# EMMA


    +   - EMMA 是一种用来衡 java 件覆盖率的 件。它对于不可 代码的检测，以及 证测试 和交互式测试对程序的覆盖情况是很必要的。

    +   - EMMA的设计目标有以下几个，

    +   - 1. 在不增加创建或执行开 的情况下，提供丰富的覆盖分析数据；

    +   - 2. 促 困 开发展效率，同时，也能加快单元开发—测试周期；

    +   - 3. 促 小型java 件的开发效率，同时，提 包含大 类的大型企业 件的开发。

    +   - EMMA与其他覆盖测试工具的区别在于它 向极 编程，目的是促使循环的开发—测试 件开发模型。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - 衡量测试覆盖率的指标很多，常用的指标有：

    +   - **Statement coverage**，也称作Line coverage，用于评价测试的代码语句覆盖率。

    +   - **Basic block coverage**，是Statement coverage的一个变种，它把没有一个分支的代码区域作为一个计算单位，而不是简单的代码行，用于一个if-else分支代码行数大于另一个的情况，在这种情况下，statement
    coverage指标并不适用。

    +   - **Decision coverage**（也称作Branch coverage），用于评价代码分支地测试覆盖率。

    +   - **Path coverage**，和Decision coverage相似，用于评价代码从开始到结束所有路径的测试覆盖率。

    +   - **Function coverage**，用于评价代码方法的测试覆盖率。

    +   - **EMMA目前支持四种Coverage类型：**

    +     - class、method、line和basic block。'
  merge: -1
  img_proc: true
