  md: '# Fishing Creel Counts and Fault Insertion


    For example, that the Rogue River is stocked with 1000 marked trout(鳟鱼); and that
    during the fishing season, the creel report totals are 500 fish caught, of which
    300 are marked trout.


    The stream management team would conclude that 60% of the trout in the Rogue River
    are hatchery (planted) fish. The total populations could also be estimated; in
    this case, the 500 fish caught represent 30% of the total population. Total fish
    population is 1667.


    The same idea can be applied to estimate the success of test cases and the number
    of remaining faults not caught by an existing set of test cases.'
