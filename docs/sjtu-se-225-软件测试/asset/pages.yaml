- pgno: 323
  md: "# 7.2 Data Flow Testing\n\nData flow testing refers to forms of structural\
    \ testing that focus on the points at which variables receive values and the points\
    \ at which these values are used.\n\n# 7.2.1 Define/Use Testing\n\n+   1. The\
    \ program graph G(P) is constructed as in Chapter 4, with statement fragments\
    \ as nodes and edges that represent node sequences.\n+   \n+   2. Node n ∈ G(P)\
    \ is a defining node of the variable v ∈ V, written as DEF(v, n), if and only\
    \ if the value of variable v is defined as the statement fragment corresponding\
    \ to node n."
  merge: -1
  img_proc: true
- pgno: 324
  md: '+   3. Node n ∈ G(P) is a usage node of the variable v ∈ V, written as USE(v,
    n), if and only if the value of the variable v is used as the statement fragment
    corresponding to node n.

    +   4. A usage node USE(v, n) is a predicate use (denoted as P-use) if and only
    if the statement n is a predicate statement; otherwise, USE(v, n) is a computation
    use (denoted C-use).

    +   5. A definition/use path with respect to a variable v (denoted du-path) is
    a path in PATHS(P) such that, for some v ∈ V, there are define and usage nodes
    DEF(v, m) and USE(v, n) such that m and n are the initial and final nodes of the
    path.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 6. A definition-clear path with respect to a variable v (denoted dc-path) is
    a definition/use path in PATHS(P) with initial and final nodes DEF(v, m) and USE(v,
    n) such that no other node in the path is a defining node of v.
  merge: -1
  img_proc: true
