- pgno: 258
  md: '# 6.1.3 软件工程标准化的作用


    +   (1)可提高软件的可读性、可维护性和可移植性，从而提高软件产品的质量；

    +   (2)可提高软件人员的技水平和软件的生产率；

    +   (3)可提高软件人员之间的信息效率，减少差异和误解；

    +   (4)为科学地进行软件管理奠定了基础；

    +   (5)有利于降低软件产品的成本和运行维护成本；

    +   (6)有利于缩短软件开发周期；

    +   (7)标准化是软件研究、生产、使用三者之间的桥梁。'
  merge: -1
  img_proc: true
