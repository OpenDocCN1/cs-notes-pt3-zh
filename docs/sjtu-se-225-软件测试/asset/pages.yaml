- pgno: 205
  md: '# 五、测试策略


    # 5.1 功能测试


    由于对测试对象的功能测试应侧重于所有可直接追踪到用例或业务功能和业务规则的测试。种测试的目标是核实数据的接受、计算、处理和输出是否正确，以及业务规则的实施是否恰当，所以此次的功能测试全为符合测试，测试的主要目的是检测以下错误：


    +   1) 是否有不正确或遗漏的功能？

    +   2) 在接口上，输入是否能正确的接受？能否输出正确的结果？

    +   3) 是否有数据错误或外部信息（例如数据文件）访问错误？

    +   4) 是否有初始化或终止性错误？'
  merge: -1
