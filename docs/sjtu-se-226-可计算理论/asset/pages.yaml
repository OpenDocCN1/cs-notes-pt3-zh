    States: A state q is turned into states q, ⟨q, σ₁¹, …, σ₁ᵏ⟩ where |σ₁¹| = … =
    |σ₁ᵏ| = 1, …, ⟨q, σ_{log|Γ|}¹, …, σ_{log|Γ|}ᵏ⟩ where |σ_{log|Γ|}¹| = … = |σ_{log|Γ|}ᵏ|
    = log |Γ|.


    A computation step of M is simulated in M̃ by log |Γ| steps to read, log |Γ| steps
    to write, and log |Γ| steps to relocate the heads.'
