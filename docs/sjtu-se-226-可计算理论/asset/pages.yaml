  md: '# Complementation Theorem


    **Complementation Theorem.** $A$ is recursive iff $A$ and $\bar{A}$ are r.e.


    *Proof.* Suppose $A$ and $\bar{A}$ are r.e. Then some primitive recursive predicates
    $R(x,y), S(x,y)$ exist such that


    $x \in A \iff \exists yR(x,y),$


    $x \in \bar{A} \iff \exists yS(x,y).$


    Now let $f(x)$ be $\mu y(R(x,y) \lor S(x,y))$.


    Then $f(x)$ is total and computable, and


    $x \in A \iff R(x,f(x))$'
