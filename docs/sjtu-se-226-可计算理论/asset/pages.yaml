- pgno: 663
  md: '# Closure Property


    # Proposition


    The following statements are valid:


    +   - If $R(\tilde{x})$ is a primitive recursive predicate, then so is $\neg R(\tilde{x})$.

    +   - If $R(\tilde{x}), S(\tilde{x})$ are primitive recursive predicates, then
    the following predicates are primitive recursive:

    +     - $R(\tilde{x}) \land S(\tilde{x})$.

    +     - $R(\tilde{x}) \lor S(\tilde{x})$.

    +   - If $R(\tilde{x}, y)$ is a primitive recursive predicate, then the following
    predicates are primitive recursive:

    +     - $\forall z < y, R(\tilde{x}, z)$.

    +     - $\exists z < y, R(\tilde{x}, z)$.


    # Proof


    For example $c_{\forall z<y, R(\tilde{x},z)}(\tilde{x}, y) = \prod_{z<y} c_R(\tilde{x},
    z)$.'
