  md: '# Productive Set


    Suppose A = {x | φ_x(x) ≠ ∅}.


    By S-m-n Theorem one gets a primitive recursive function p(x) such that φ_{p(x)}(y)
    = 0 if and only if φ_x(y) is defined. Then


    p(x) ∈ W_x ⇔ φ_x(x) ∉ A.


    So if W_x ⊆ A we must have p(x) ∈ A \ W_x.


    Thus p is a productive function for A.'
