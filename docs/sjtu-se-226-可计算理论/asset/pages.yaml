- pgno: 701
  md: '# Ackermann Function is Recursive


    A finite set S of triples is said to be suitable if the followings hold:


    +   (i) if (0,y,z) ∈ S then z = y + 1;

    +   (ii) if (x + 1, 0, z) ∈ S then (x, 1, z) ∈ S;

    +   (iii) if (x + 1, y + 1, z) ∈ S then ∃u.((x + 1, y, u) ∈ S ∧ (x, u, z) ∈ S).


    A triple (x,y,z) can be coded up by 2^x 3^y 5^z.


    A set {u1, ..., uk} can be coded up by p_u1 ... p_uk.


    Let R(x,y,v) be "v is a legal code and ∃z < v.(x,y,z) ∈ S_v".


    The Ackermann function ψ(x,y) ≃ μz((x,y,z) ∈ S_{μv R(x,y,v)}).'
