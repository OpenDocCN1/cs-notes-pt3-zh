  md: '# Productive Function Made Injective


    Proposition. A productive set has an injective productive function.


    Proof. Suppose p is a productive function of A. Let


    W_{h(x)} = W_x ∪ {p(x)}


    Clearly


    W_x ⊆ A ⇒ W_{h(x)} ⊆ A


    Define q(0) = p(0).


    If there is a least y ∈ {p(x+1), p h(x+1), p h²(x+1),...} such that y ∉ {q(0),...,q(x)},
    let q(x+1) be y:


    otherwise let q(x+1) be μy. y ∉ {q(0),...,q(x)}.


    It is easily seen that q is an injective production function for A.'
