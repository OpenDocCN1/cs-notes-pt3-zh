    σₙ(e, x̃, 0) = π(2¹ 3¹ 2 ... pₙ^{aₙ}, 1),

    σₙ(e, x̃, t + 1) = π(config(e, σₙ(e, x̃, t)), next(e, σₙ(e, x̃, t)),)


    where config(e, π(c, j)) is the new configuration, and next(e, π(c, j)) is the
    number of the next instruction, after the j-th instruction has been executed upon
    c.'
  merge: -1
  img_proc: false
- pgno: 767
  md: '# Proof in Detail


    ln(e) = the number of instructions in Pₑ;


    gn(e,j) = { the code of Iⱼ in Pₑ, if 1 ≤ j ≤ ln(e); 0, otherwise. }


    ch(c,z) = the resulting configuration when the configuration c is operated on
    by the instruction with code number z.


    v(c,j,z) = { the number j'' of the next instruction when the configuration c is
    operated on by the jth instruction with code z if j > 0, 0, if j = 0. }'
  merge: -1
  img_proc: false
- pgno: 768
  md: '# Proof in Detail


    config(e,σ) = { ch(π₁(σ), gn(e,π₂(σ))), if 1 ≤ π₂(σ) ≤ ln(e), π₁(σ), otherwise.
    }


    next(e,σ) = { v(π₁(σ),π₂(σ)), gn(e,π₂(σ))), if 1 ≤ π₂(σ) ≤ ln(e), 0, otherwise.
    }'
  merge: -1
  img_proc: false
- pgno: 769
  md: '# Proof in Detail (ln, gn)


    ln(e) = the number of instructions in Pₑ;


    gn(e, j) = { the code of Iⱼ in Pₑ, if 1 ≤ j ≤ ln(e), otherwise. 0, }


    Both functions are primitive recursive since


    ln(e) = ℓ(e + 1),


    gn(e, j) = a(j, e + 1).'
  merge: -1
  img_proc: false
- pgno: 770
  md: '# Proof in Detail (ch)


    The following function


    ch(c, z) = the resulting configuration when the configuration c is operated on
    by the instruction with code number z.


    is primitive recursive if


    ch(c, z) = { zero(c, u₂(z)), if rm(4, z) = 0, succ(c, u₂(z)), if rm(4, z) = 1,
    tran(c, u₁(z), u₂(z)), if rm(4, z) = 2, c, if rm(4, z) = 3 }'
  merge: -1
  img_proc: false
- pgno: 771
  md: "# Proof in Detail (ch)\n\nu(z) = m whenever z = β(Z(m)) or z = β(S(m)):\n\n\
    \    u(z) = qt(4, z) + 1.\n\nu₁(z) = m₁ and u₂(z) = m₂ whenever z = β(T(m₁, m₂)):\n\
    \n    u₁(z) = π₁(qt(4, z)) + 1,\n    u₂(z) = π₂(qt(4, z)) + 1."
  merge: -1
  img_proc: false
- pgno: 772
  md: '# Proof in Detail (ch)


    The change in the configuration c effected by instruction Z(m):


    zero(c, m) = qt(p_m^{(c)}, c).


    The change in the configuration c effected by instruction S(m):


    succ(c, m) = p_m c.


    The change in the configuration c effected by instruction T(m, n):


    tran(c, m, n) = qt(p_m^{(c)}, p_n^{(c)} c).'
  merge: -1
  img_proc: false
- pgno: 773
  md: '# Proof in Detail (V)


    The following function


    v(c,j,z) = { the number j'' of the next instruction when the configuration c is
    operated on by the jth instruction with code z, 0, if j > 0, if j = 0 }


    is primitive recursive if


    v(c,j,z) = { j + 1, if rm(4,z) ≠ 3, j + 1, if rm(4,z) = 3 ∧ (c)_{v1(z)} ≠ (c)_{v2(z)},
    v3(z), if rm(4,z) = 3 ∧ (c)_{v1(z)} = (c)_{v2(z)} }'
  merge: -1
  img_proc: false
- pgno: 774
  md: "# Proof in Detail (V)\n\nv₁(z) = m₁ and v₂(z) = m₂ and v₃(z) = q if z = β(J(m₁,\
    \ m₂, q))\n\nv₁(z) = π₁(π₁(qt(4, z))) + 1,\n v₂(z) = π₂(π₁(qt(4, z))) + 1,\n v₃(z)\
    \ = π₂(qt(4, z)) + 1."
  merge: -1
  img_proc: false
- pgno: 775
  md: '# Proof in Detail


    We can now define the function config(_,_) by


    config(e, σ) = { ch(π₁(σ), gn(e, π₂(σ))), if 1 ≤ π₂(σ) ≤ ln(e), π₁(σ), otherwise.
    }


    and the function next(_,_) by


    next(e, σ) = { v(π₁(σ), π₂(σ)), gn(e, π₂(σ))), if 1 ≤ π₂(σ) ≤ ln(e), 0, otherwise.
    }'
  merge: -1
  img_proc: false
- pgno: 776
  md: '# Proof in Detail


    We conclude that the functions Cₙ, Iₙ, σₙ are primitive recursive.'
  merge: -1
  img_proc: false
- pgno: 777
  md: '# Computability Theory VII


    S-M-N Theorem


    Guoqiang Li


    Shanghai Jiao Tong University


    Nov. 14, 2014'
  merge: -1
  img_proc: false
