- pgno: 75
  md: '# Problem IV


    Consider the function h defined as follows:


    h(n) = { 1, if n is the machine code of a C program that terminates in all inputs,
    0, otherwise. }


    This is the Halting Problem, a well known undecidable problem. In other words
    there does not exist any C program calculating h.


    The only general approach to check if a function is defined on all numbers is
    to calculate it on all inputs.'
  merge: -1
