    x - 1.

    +   - The head positions are stored in R_{m+1}, R_{m+2}, R_{m+3}.

    +   - The three binary strings in the tapes are stored respectively in R_{m+4},
    R_{m+7}, R_{m+10}, ...,

    +     R_{m+5}, R_{m+8}, R_{m+11}, ...,

    +     R_{m+6}, R_{m+9}, R_{m+12}, ...

    +   - The states of M are encoded by the states of the URM.

    +   - The transition function of M can be easily simulated by the program of the
    URM.'
