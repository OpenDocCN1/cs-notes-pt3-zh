    The Ackermann function [1928] is defined as follows:


    ψ(0, y) ≃ y + 1,

    ψ(x + 1, 0) ≃ ψ(x, 1),

    ψ(x + 1, y + 1) ≃ ψ(x, ψ(x + 1, y)).


    The equations clearly define a total function.'
