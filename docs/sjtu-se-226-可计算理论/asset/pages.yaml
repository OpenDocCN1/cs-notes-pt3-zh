- pgno: 588
  md: '# Decision Problem


    A problem $f : \mathbb{N} \to \mathbb{N}$ is a decision problem if the range $ran(f)$
    of $f$ is $\{0, 1\}$, where $1$ denotes a ''yes'' answer and $0$ a ''no'' answer.


    A decision problem $g$ can be identified with the set $\{n \mid g(n) = 1\}.


    Conversely a subset $A$ of $\mathbb{N}$ can be seen as a decision problem via
    the characteristic function of $A$:


    ```

    $c_A(n) = \begin{cases} 1, & \text{if } x \in A, \ 0, & \text{otherwise.} \end{cases}$

    ```'
  merge: -1
  img_proc: false
- pgno: 589
  md: '# Decision Problem as Predicate


    A decision problem can be stated as a predicate P(x) on number.


    It relates to the problem-as-function viewpoint by the following characteristic
    function of P(x):


    c_P(n) = { 1, if P(n) is valid, 0, otherwise. }'
