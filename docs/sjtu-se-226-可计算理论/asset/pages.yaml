- pgno: 763
  md: '# Proof in Detail


    The states of the computation of the program $P_e(\tilde{x})$ can be described
    by a configuration and an instruction number.


    A state can be coded up by the number


    $\sigma = \pi(c,j).$


    where $c$ is the configuration that codes up the current values in the registers


    $c = 2^{r_1}3^{r_2}\ldots = \prod_{i\ge1}p_i^{r_i},$


    and $j$ is the next instruction number.'
  merge: -1
  img_proc: false
- pgno: 764
  md: '# Proof in Detail


    To describe the changes of the states of $P_e(\tilde{x})$, we introduce three
    $(n + 2)$-ary functions:


    +   - $c_n(e, \tilde{x}, t) \;=\; \text{the configuration after $t$ steps of $P_e(\tilde{x})$,}$

    +   - $j_n(e, \tilde{x}, t) \;=\; \text{the number of the next instruction after
    $t$ steps of $P_e(\tilde{x})$ (it is 0 if $P_e(\tilde{x})$ stops in $t$ or less
    steps),}$

    +   - $\sigma_n(e, \tilde{x}, t) \;=\; \pi(c_n(e, \tilde{x}, t), j_n(e, \tilde{x},
    t)).$


    If $\sigma_n$ is primitive recursive, then $c_n, j_n$ are primitive recursive!'
