- pgno: 414
  md: '# Recursion Theorem


    # Recursion Theorem


    Let f be a total unary computable function. Then there is a number n such that
    φ_f(n) = φ_n.


    # Proof


    By S-m-n Theorem there is an injective primitive recursive function s(x) such
    that for all x


    φ_{s(x)}(y) ≃ { φ_{s(x)}(y), if φ_x(x)↓; ↑, otherwise. }


    Let y be such that φ_y = s ∘ f. Obviously φ_y is total and φ_y(v)↓.


    φ_y(v) = φ_{s(f(v))} = φ_f(s(v))


    We are done by letting n be s(v).'
  merge: -1
