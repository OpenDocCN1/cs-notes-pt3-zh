  md: '# Recursion


    Suppose that $f(\tilde{x})$ is an $n$-ary function and $g(\tilde{x}, y, z)$ is
    an $(n+2)$-ary function.


    The recursion function $h(\tilde{x}, y)$ is defined by


    $h(\tilde{x}, 0) \ = \ f(\tilde{x}), \qquad (1)$

    $h(\tilde{x}, y + 1) \ = \ g(\tilde{x}, y, h(\tilde{x}, y)). \qquad (2)$


    Clearly there is a unique function that satisfies (1) and (2).'
