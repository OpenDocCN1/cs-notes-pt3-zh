- pgno: 130
  md: '# Register


    An Unlimited Register Machine (URM) has an infinite number of register labeled
    R1, R2, R3, ...


    | r1 | r2 | r3 | r4 | r5 | r6 | r7 | ... |

    | R1 | R2 | R3 | R4 | R5 | R6 | R7 | ... |


    Every register can hold a natural number at any moment.


    The registers can be equivalently written as for example


    ```

    [r1, r2, r3]³[r4]⁴[r5, r6, r7]⁷[0, 0, 0, ...]∞₈

    ```


    or simply


    ```

    [r1, r2, r3]³[r4]⁴[r5, r6, r7]⁷.

    ```'
