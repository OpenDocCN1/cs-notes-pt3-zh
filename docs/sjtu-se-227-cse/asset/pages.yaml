  md: '# M.A.L.H


    +   - **Modularity**

    +     - Split up system

    +     - Consider separately

    +   - **Layering**

    +     - Gradually build up capabilities


    +   - **Abstraction**

    +     - Interface/Hiding

    +     - Avoid propagation of effects

    +   - **Hierarchy**

    +     - Reduce connections

    +     - Divide-and-conquer'
  merge: -1
