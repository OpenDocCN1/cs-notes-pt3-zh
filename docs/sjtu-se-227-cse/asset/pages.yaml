- pgno: 553
  md: '# The Ideal Scheduler


    +   - Mini latency: How long a service takes? E.g., Move mouse, cursor moves

    +   - Max throughput: Max jobs / time. E.g., Web server pages/second

    +   - Low overheads: Scheduler doesn’t use any resources

    +   - Fairness: everyone gets to make progress, no one starves

    +   - Scales linearly up to capacity: Graceful handling of overload

    +   - System-level goal may conflict with the needs of individual threads

    +     - System: minimal preemption

    +     - Apps: finish ASAP'
  merge: -1
  img_proc: false
- pgno: 554
  md: '# Measuring the Request’s Response


    +   - Turn-around time: - The length of time from when a request arrives at a
    service until it completes

    +   - Response time: The length of time from when a request arrives at a service
    until it starts producing output

    +   - Waiting time: The length of time from when a request arrives at a service
    until the service starts processing the request'
  merge: -1
