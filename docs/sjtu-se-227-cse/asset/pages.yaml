- pgno: 391
  md: "# Yield in a Nutshell\n\n```\nyield():\n    acquire(t_lock)\n    id = cpus[CPU].thread\n\
    \    threads[id].state = RUNNABLE\n    threads[id].sp = SP\n\n    do:\n      \
    \  id = (id + 1) mod N\n    while threads[id].state ≠ RUNNABLE\n\n    threads[id].state\
    \ = RUNNING\n    SP = threads[id].sp\n    cpus[CPU].thread = id\n    release(t_lock)\n\
    \n{suspend current thread}\n{choose new thread}\n{resume new thread}\n```"
