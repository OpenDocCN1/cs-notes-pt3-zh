- pgno: 377
  md: '# Deadlock Theory


    Four necessary and sufficient conditions for deadlock


    +   1. Limited access

    +      - Resource can only be shared with finite users.

    +   2. No preemption

    +      - Once resource granted, cannot be taken away.

    +   3. Multiple independent requests (hold and wait)

