- pgno: 206
  md: '# Another Optimization for Interrupt


    +   - A device which needs to raise an interrupt first *waits for a bit* before
    delivering the interrupt to the CPU

    +   - While waiting, other requests may soon complete, and thus multiple interrupts
    can be **coalesced** into a single interrupt delivery, thus lowering the overhead
    of interrupt processing

    +   - Note: waiting too long will increase the latency of a request, a common
    trade-off in systems'
