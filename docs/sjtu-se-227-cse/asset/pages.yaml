- pgno: 413
  md: '# Problem: Before-or-after Again


    +   - Interrupt Handler Calls Exception Handler

    +     - Interrupt handler

    +       - Trigger: clock interrupt

    +       - Context: Processor

    +     - Exception handler

    +       - Trigger: YIELD(), EXIT_THREAD()

    +       - Context: Thread

    +     - Problem

    +       - The contexts are different, e.g., the double-acquire lock problem

    +       - Should also ensures before-or-after

    +       - *Solution: disable interrupt when acquire thread_table_lock, and enable
    interrupt when release the lock*'
