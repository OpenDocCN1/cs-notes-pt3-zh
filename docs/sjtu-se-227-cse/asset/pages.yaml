- pgno: 387
  md: "# YIELD()\n\n+   - **SEND & RECEIVE**\n+     - Using spin loop\n+     - Waist\
    \ processor\n+   - **Using YIELD**\n+     - When a thread calls YIELD(), gives\
    \ up the CPU\n+     - The state changes from RUNNING to RUNNABLE\n+     - When\
    \ YIELD() returns, the thread gets another CPU\n\n```\nprocedure SEND (buffer\
    \ reference p, message)\n    ACQUIRE (p.buffer_lock)\n    while p.in − p.out =\
    \ N do\n        RELEASE (p.buffer_lock)\n        YIELD ()\n        ACQUIRE (p.buffer_lock)\n\
    \n    p.message[p.in modulo N] ← msg\n    p.in ← p.in + 1\n    RELEASE (p.buffer_lock)\n\
    ```\n\n```\nprocedure RECEIVE (buffer reference p)\n    ACQUIRE (p.buffer_lock)\n\
    \    while p.in = p.out do\n        RELEASE (p.buffer_lock)\n        YIELD ()\n\
    \        ACQUIRE (p.buffer_lock)\n\n    msg ← p.message[p.out modulo N]\n    p.out\
    \ ← p.out + 1\n    RELEASE (p.buffer_lock)\n    return msg\n```"
