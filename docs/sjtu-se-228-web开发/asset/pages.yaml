  md: '+   - On a typical web site, a visitor might visit several pages and perform
    several interactions.

    +     - If you are programming the site, it is very helpful to be able to associate
    some data with each visitor.

    +     - For this purpose, "session"s can be used in JSP.

    +   - A session is an object associated with a visitor.

    +     - Data can be put in the session and retrieved from it, much like a Hashtable.

    +     - A different set of data is kept for each visitor to the site.'
