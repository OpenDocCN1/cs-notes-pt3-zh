- pgno: 83
  md: '# Concepts


    +   - **Name**

    +     - A people-friendly identifier for identifying an object or a reference
    to an object.

    +   - **Binding**

    +     - The association of an atomic name with an object.

    +   - **Context**

    +     - An object whose state is a set of bindings that have distinct atomic names.

    +   - **InitialContext**

    +     - The starting point for resolution of names for naming and directory operations.

    +   - **ContextFactory**

    +     - A specialization of an object factory. It accepts information about how
    to create a context, such as a reference, and returns an instance of the context.'
  merge: -1
  img_proc: false
