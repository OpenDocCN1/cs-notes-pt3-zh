  md: '+   - ODBC is a specification for a database API.

    +     - This API is independent of any one DBMS or operating system; although
    this manual uses C, the ODBC API is language-independent.

    +   - The functions in the ODBC API are implemented by developers of DBMS-specific
    drivers.

    +     - Applications call the functions in these drivers to access data in a DBMS-independent
    manner.

    +     - A Driver Manager manages communication between applications and drivers.

    +   - It is important to understand that ODBC is designed to expose database capabilities,
    not supplement them.'
  merge: -1
  img_proc: false
- pgno: 121
  md: '+   - The ODBC architecture has four components:

    +     - **Application** Performs processing and calls ODBC functions to submit
    SQL statements and retrieve results.

    +     - **Driver Manager** Loads and unloads drivers on behalf of an application.
    Processes ODBC function calls or passes them to a driver.

    +     - **Driver** Processes ODBC function calls, submits SQL requests to a specific
    data source, and returns results to the application. If necessary, the driver
    modifies an application''s request so that the request conforms to syntax supported
    by the associated DBMS.

    +     - **Data Source** Consists of the data the user wants to access and its
    associated operating system, DBMS, and network platform (if any) used to access
    the DBMS.'
  merge: -1
  img_proc: false
