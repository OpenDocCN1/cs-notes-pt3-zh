- pgno: 45
  md: '+   - Get connection:

    +     $dbhost = ''localhost''; //the ip of RDBMS server

    +     $dbuser = ''root''; //username

    +     $dbpassword= ''12345678''; //password

    +     $connect = mysql_connect($dbhost,$dbuser,$dbpassword);

    +   - Select a database:

    +     $dbname = ''sample_one''; //the name of DB

    +     $db = mysql_select_db($dbname);

    +   - Execute SQL statement:

    +     $mysql_command = <statement>;

    +     $result = mysql_query($mysql_command);

    +   - Create a database:

    +     $mysql_command = "create database testDB";

    +   - Drop a database:

    +     $mysql_command = "drop database if exists testDB";'
  merge: -1
  img_proc: false
- pgno: 46
  md: '+   - Create a table:

    +     `$mysql_command = "create table testOne (

    +         id int not null primary key auto_increment,

    +         column1 varchar(128))";`

    +   - Drop a table:

    +     `$mysql_command = "drop table testOne";`

    +   - Get server information:

    +     `echo mysql_get_server_info();`

    +   - Close connection:

    +     `mysql_close($connect);`

    +   - die() and mysql_error():

    +     `$result = mysql_query($mysql_command)

    +         or die(mysql_error());`

    +   - Client encoding:

    +     `mysql_client_encoding();`'
  merge: -1
  img_proc: false
- pgno: 47
  md: '+   - Create records:

    +     ```php

    +     $count = 10;

    +     while($count >= 1){

    +         $mysql_command = "insert into `testOne` values

    +             ($count, ''Zhang San{$count}'')";

    +         $result = mysql_query($mysql_command);

    +         $count --;

    +     }

    +     ```

    +   - Retrieve records:

    +     ```php

    +     $mysql_command = "select * from testOne";

    +     $result = mysql_query($mysql_command);

    +     while($row = mysql_fetch_object($result)){

    +         echo json_encode($row);

    +         echo ''<br>'';

    +     }

    +     ```'
  merge: -1
  img_proc: false
