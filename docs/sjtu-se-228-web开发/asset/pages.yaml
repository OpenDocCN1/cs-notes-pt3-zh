- pgno: 14
  md: '# Containers


    +   - are the interface between a component and the low-level platform-specific
    functionality that supports the component.

    +   - Before it can be executed, a web, enterprise bean, or application client
    component must be assembled into a Java EE module and deployed into its container.

    +   - Container settings customize the underlying support provided by the Java
    EE server, including such services as

    +     - Security

    +     - Transaction management

    +     - Java Naming and Directory Interface (JNDI) API lookups,

    +     - and remote connectivity.'
