  md: '# Handling Servlet Lifecycle Events


    | Object | Event | Listener Interface and Event |

    |---|---|---|

    | Web context | Initialization and destruction | javax.servlet.ServletContextListener
    and ServletContextEvent |

    | Web context | Attribute added, removed, or replaced | javax.servlet.ServletContextAttributeListener
    and ServletContextAttributeEvent |

    | Session | Creation, invalidation, activation, passivation, and timeout | javax.servlet.http.HttpSessionListener,
    javax.servlet.http.HttpSessionActivationListener, and HttpSessionEvent |

    | Session | Attribute added, removed, or replaced | javax.servlet.http.HttpSessionAttributeListener
    and HttpSessionBindingEvent |

    | Request | A servlet request has started being processed by web components |
    javax.servlet.ServletRequestListener and ServletRequestEvent |

    | Request | Attribute added, removed, or replaced | javax.servlet.ServletRequestAttributeListener
    and ServletRequestAttributeEvent |'
