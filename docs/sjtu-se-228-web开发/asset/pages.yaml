    \ html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n\n<sql:query var=\"rs\" dataSource=\"jdbc/sample\">\n    select id, username,\
    \ password, email from tbl_user\n</sql:query>\n<head>\n    <title>DB Test</title>\n\
    </head>\n<body>\n    <h2>Results</h2>\n    <c:forEach var=\"row\" items=\"${rs.rows}\"\
    >\n        ID ${row.id}<br/>\n        Name ${row.username}<br/>\n        Password\
    \ ${row.password}<br/>\n        email ${row.email}<br/>\n    </c:forEach>\n</body>\n\
