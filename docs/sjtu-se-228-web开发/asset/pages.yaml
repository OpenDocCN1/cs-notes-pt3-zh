- pgno: 79
  md: "# DataSource\n\nA logical name is mapped to a DataSource object via a naming\
    \ service that uses the Java Naming and Directory Interface™ (JNDI).\n\n```\n\
    package sample;\nimport java.sql.SQLException;\nimport javax.naming.Context;\n\
    import javax.naming.InitialContext;\nimport javax.naming.NamingException;\nimport\
    \ com.mysql.jdbc.jdbc2.optional.MysqlDataSource;\npublic class Server {\n    public\
    \ static void main(String[] args) throws ClassNotFoundException,\n        SQLException,\
    \ NamingException\n    {\n        MysqlDataSource ds = new MysqlDataSource();\n\
    \        ds.setServerName(\"localhost\");\n        ds.setPortNumber(3306);\n \
    \       ds.setUser(\"root\");\n        ds.setPassword(\"12345678\");\n\n     \
    \   Context namingContext = new InitialContext();\n        namingContext.bind(\"\
    rmi://localhost:1099/datasource\", ds);\n    }\n}\n```"
  merge: -1
  img_proc: false
- pgno: 80
  md: "+   - **DataSource**\n+     - A logical name is mapped to a DataSource object\
    \ via a naming service that uses the Java Naming and Directory Interface™ (JNDI).\n\
    \n```\npackage sample;\nimport java.rmi.RemoteException;\nimport java.sql.Connection;\n\
    import java.sql.SQLException;\nimport javax.naming.Context;\nimport javax.naming.InitialContext;\n\
    import javax.naming.NamingException;\nimport com.mysql.jdbc.jdbc2.optional.MysqlDataSource;\n\
    \npublic class Client {\n    public static void main(String[] args) throws\n \
    \       NamingException, RemoteException, SQLException\n    {\n        Context\
    \ namingContext = new InitialContext();\n        String url = \"rmi://localhost:1099/datasource\"\
    ;\n        MysqlDataSource ds = (MysqlDataSource) namingContext.lookup(url);\n\
    \        Connection con = ds.getConnection(\"root\",\"12345678\");\n        System.out.println(con.getTransactionIsolation());\n\
    \    }\n}\n```"
