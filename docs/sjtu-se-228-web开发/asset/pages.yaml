  md: '# First JSP


    +   - JSP simply puts Java inside HTML pages.

    +     - You can take any existing HTML page and change its extension to ".jsp"
    instead of ".html".

    +     - In fact, this is the perfect exercise for your first JSP.

    +     - Take the following HTML file. Change its extension from ".html" to ".jsp".

    +     - Now load the new file, with the ".jsp" extension, in your browser.


