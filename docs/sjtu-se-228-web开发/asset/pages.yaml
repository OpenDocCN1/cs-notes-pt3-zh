- pgno: 9
  md: '# What is web application ?


    # Company Network


    Router


    Firewall


    Switch


    Wireless Access Point


    # Web Servers


    Web Application Server


    # Database Servers


    Database


    User Submits Shopping Cart Order on Website


    Internet


    # Flow


    +   1. User submits shopping cart order on Website via port 80/443.

    +   2. Web Server receives shopping cart data from User and sends it to the Web
    Application Server.

    +   3. Web Application Server receives data from Web Server and sends it to the
    Database Server. Database is also updated.

    +   4. Web Application Server dynamically generates a web page and sends it to
    the Web Server.

    +   5. Web Server sends the generated page to the User informing him of his successful
    transaction.


    # Legend


    Data exchanged between User and Web Server via port 80/443.


    Data exchanged between Web Server, Web Application Server, Database Server and
    Database.


    Two-Way traffic between User and Web Server.


    User does not have access to any network asset beyond the Web Server.'
  merge: -1
  img_proc: false
- pgno: 10
  md: '# Web 1.0


    +   - Traditional web client server interaction model

    +     - User enters interacts with a web page

    +     - Browser sends data to web server

    +     - Server sends data back to browser

    +     - Browser receives the data and updates the page

    +     - Page refresh may be intrusive and irritating'
  merge: -1
  img_proc: false
- pgno: 11
  md: '+   - JavaScript is used extensively in the browser

    +   - Single web-page applications are possible

    +     - Entire page need not be refreshed

    +     - Browser interacts with server by sending and receiving small chunks of
    data

    +     - These update individual components or data items on a page

    +     - This is also known as AJAX (misleading but widely used term) (Asynchronous
    JavaScript and XML)

    +   - Two advantages

    +     - Speed: fewer data items are exchanged

    +       - Faster network transfer, less work for server and browser

    +     - Smoother experience for user – less clunky'
  merge: -1
  img_proc: false
