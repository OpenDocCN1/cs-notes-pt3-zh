- pgno: 161
  md: '# Maintaining Client State


    +   - Many applications require that a series of requests from a client be associated
    with one another.

    +     - For example, a web application can save the state of a user''s shopping
    cart across requests.

    +     - Web-based applications are responsible for maintaining such state, called
    a **session**, because **HTTP is stateless**.

    +     - To support applications that need to maintain state, Java Servlet technology
    provides an API for managing sessions and allows several mechanisms for implementing
    sessions.'
  merge: -1
  img_proc: false
- pgno: 162
  md: '+   - Sessions are represented by an HttpSession object.

    +     - You access a session by calling the getSession method of a request object.

    +     - This method returns the current session associated with this request;
    or, if the request does not have a session, this method creates one.


