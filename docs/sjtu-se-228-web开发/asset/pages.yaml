- pgno: 165
  md: '+   - Supporting file uploads is a very basic and common requirement for many
    web applications.

    +   - `javax.servlet.annotation.MultipartConfig` is used to indicate that the
    servlet on which it is declared expects requests to made using the `multipart/form-data`
    MIME type.

    +     - Servlets that are annotated with `@MultipartConfig` can retrieve the Part
    components of a given multipart/form-data request by calling the `request.getPart(String
    name)` or `request.getParts()` method.

    +   - `multipart/form-data` MIME type

    +     - A method for uploading files with forms in Browser

    +     - Scenario: the attachment of an email is attached with form, that is, the
    attachment is uploaded to server in multipart/form-data MIME type'
  merge: -1
  img_proc: false
- pgno: 166
  md: '+   - The @MultipartConfig annotation supports the following optional attributes:

    +     - location:

    +       - An absolute path to a directory on the file system.

    +       - The default location is "".

    +     - fileSizeThreshold:

    +       - The file size in bytes after which the file will be temporarily stored
    on disk.

    +       - The default size is 0 bytes.

    +     - MaxFileSize:

    +       - The maximum size allowed for uploaded files, in bytes.

    +       - If the size of any uploaded file is greater than this size, the web
    container will throw an exception (IllegalStateException).

    +       - The default size is unlimited.

    +     - maxRequestSize:

    +       - The maximum size allowed for a multipart/form-data request, in bytes.

    +       - The web container will throw an exception if the overall size of all
    uploaded files exceeds this threshold.

    +       - The default size is unlimited.'
  merge: -1
  img_proc: false
- pgno: 167
  md: '+   - For, example, the @MultipartConfig annotation could be constructed as
    follows:

    +   ```

    +   @MultipartConfig(location="/tmp",

    +     fileSizeThreshold=1024*1024,

    +     maxFileSize=1024*1024*5,

    +     maxRequestSize=1024*1024*5*5)

    +   ```

    +   - Instead of using the @MultipartConfig annotation to hard-code these attributes
    in your file upload servlet, you could add the following as a child element of
    the servlet configuration element in the web.xml file.

    +   ```

    +   <multipart-config>

    +     <location>/tmp</location>

    +     <max-file-size>20848820</max-file-size>

    +     <max-request-size>418018841</max-request-size>

    +     <file-size-threshold>1048576</file-size-threshold>

    +   </multipart-config>

    +   ```'
  merge: -1
  img_proc: false
- pgno: 168
  md: '+   - The Servlet specification supports two additional HttpServletRequest
    methods:

    +     ```

    +     Collection<Part> getParts()

    +     Part getPart(String name)

    +     ```

    +   - The javax.servlet.http.Part interface is a simple one, providing methods
    that allow introspection of each Part. The methods do the following:

    +     - Retrieve the name, size, and content-type of the Part

    +     - Query the headers submitted with a Part

    +     - Delete a Part

    +     - Write a Part out to disk'
