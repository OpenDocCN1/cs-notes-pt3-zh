- pgno: 186
  md: '+   - You will see the same output, but it will take longer! But only the first
    time.

    +     - If you reload it again, it will load normally.

    +   - What is happening behind the scenes is that

    +     - your JSP is being turned into a Java file, compiled and loaded.

    +     - This compilation only happens once, so after the first load, the file
    doesn''t take long to load anymore.

    +     - (But everytime you change the JSP file, it will be re-compiled again.)'
