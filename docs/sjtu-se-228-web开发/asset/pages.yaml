  md: "# Bind parameters\n\n```\n//named parameter (preferred)\nQuery q = sess.createQuery(\"\
    from DomesticCat cat\n    where cat.name = :name\");\nq.setString(\"name\", \"\
    Fritz\");\nIterator cats = q.iterate();\n\n//positional parameter\nQuery q = sess.createQuery(\"\
    from DomesticCat cat\n    where cat.name = ?\");\nq.setString(0, \"Izi\");\nIterator\
    \ cats = q.iterate();\n\n//named parameter list\nList names = new ArrayList();\n\
    names.add(\"Izi\");\nnames.add(\"Fritz\");\nQuery q = sess.createQuery(\"from\
    \ DomesticCat cat\n    where cat.name in (:namesList)\");\nq.setParameterList(\"\
    namesList\", names);\nList cats = q.list();\n```"
