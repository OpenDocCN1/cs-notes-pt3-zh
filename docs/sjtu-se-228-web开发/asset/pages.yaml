- pgno: 187
  md: '+   - Put the following text in a file with .jsp, place it in your JSP directory,
    and view it in a browser.

    +   ```

    +   <HTML>

    +     <BODY>

    +       Hello!  The time is now <%= new java.util.Date() %>

    +     </BODY>

    +   </HTML>

    +   ```

    +   - Notice that each time you reload the page in the browser, it comes up with
    the current time.

    +   - The character sequences <%= and %> enclose Java expressions, which are evaluated
    at run time.'
  merge: -1
  img_proc: false
- pgno: 188
  md: '+   - JSP also allows you to write blocks of Java code inside the JSP.

    +     - You do this by placing your Java code between `<%` and `%>` characters

    +     - just like expressions, but without the `=` sign at the start of the sequence.

    +     - This block of code is known as a "scriptlet".

    +     - A scriptlet contains Java code that is executed every time the JSP is
    invoked.


    ```

    <HTML>

    <BODY>

    <%

    System.out.println( "Evaluating date now" );

    java.util.Date date = new java.util.Date();

    %>

    Hello!  The time is now <%= date %>

    </BODY>

    </HTML>

    ```'
  merge: -1
  img_proc: false
- pgno: 189
  md: "+   - By itself a scriptlet does not generate HTML.\n+     - If a scriptlet\
    \ wants to generate HTML, it can use a variable called \"out\".\n+     - This\
    \ variable does not need to be declared.\n+     - It is already predefined for\
    \ scriptlets, along with some other variables.\n\n```\n<HTML>\n<BODY>\n<%\n  \
    \  System.out.println( \"Evaluating date now\" );\n    java.util.Date date = new\
    \ java.util.Date();\n%>\nHello!  The time is now\n<%\n    out.println( String.valueOf(\
    \ date ));\n%>\n</BODY>\n</HTML>\n```"
  merge: -1
  img_proc: false
- pgno: 190
  md: "+   - Another very very useful pre-defined variable is \"request\".\n+    \
    \ - The JSP \"request\" variable is used to obtain information from the request\
    \ as sent by the browser.\n\n```\n<HTML>\n  <BODY>\n    <%\n    // This scriptlet\
    \ declares and initializes \"date\"\n    System.out.println( \"Evaluating date\
    \ now\" );\n    java.util.Date date = new java.util.Date();\n    %>\n    Hello!\
    \  The time is now\n    <%\n    out.println( date );\n    out.println( \"<BR>Your\
    \ machine's address is \" );\n    out.println( request.getRemoteHost());\n   \
    \ %>\n  </BODY>\n</HTML>\n```"
