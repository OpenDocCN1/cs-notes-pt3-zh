- pgno: 1186
  md: '# Huffman表


    +   - DHT（Define Huffman Table）

    +   - 标记代码： 2bytes      0xFFC4

    +   - 数据长度： 2bytes

    +   - 哈夫曼表： 数据长度 -2bytes

    +     - 表ID&类型： 1bytes

    +       - 0x00表示DC直流0号表；

    +       - 0x01表示DC直流1号表；

    +       - 0x10表示AC交流0号表；

    +       - 0x11表示AC交流1号表。

    +   - 不同位数的码字数量 16bytes

    +   - 编码内容      码字数量之和bytes'
  merge: -1
  img_proc: true
- pgno: 1187
  md: '# 哈夫曼表的解析


    +   - 在读出哈夫曼表的数据后，建立哈夫曼树：

    +     - 第一个码字位数为n，则它的码字为n个0

    +     - 第k+1个码字位数如果和第k个码字位数相同，则它的码字为第k个的码字+1，如果位数不相同则在+1后补足位数


    ```

    11 00 02 02 00 05 01 06 01 00 00 00 00 00 00 00 00

    00 01 11 02 21 03 31 41 12 51 61 71 81 91 22 13 32

    ```'
  merge: -1
  img_proc: true
