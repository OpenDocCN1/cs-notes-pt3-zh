- pgno: 1096
  md: "# Huffman编码\n\n四、解码：利用哈夫曼树进行解码，编码串左到右依次逐位判断，从根节点开始根据每一位是0还是1，确定是左分支还是右分支，直到到叶子节点为止，从编码表中找到对应字符并输出\n\
    \n```\nvoid Huffman::Decode(char*s,char*d,int n)//s 为编码串\n{\n    while(*s!='0')\n\
    \    {\n        int parent=2*n-1-1;//根节点在 HTree 中的下标\n        while(HTree[parent].LChild!=-1)\n\
    \        {\n            if(*s=='0')\n                parent=HTree[parent].LChild;\n\
    \            else\n                parent=HTree[parent].RChild;\n            s++;\n\
    \        }\n        *d=HCodeTable[parent].data;\n        cout<<*d;\n        d++;\n\
    \    }\n}\n```\n\n![](img/a8f1b433a70f1e5c410c8b43e41b650e_1096_0.png)"
  merge: -1
  img_proc: true
- pgno: 1097
  md: '# Huffman编码特点


    +   - 霍夫曼编码对不同的信源的编码效率是不同的。

    +     当信源概率是 2 的负幂时，霍夫曼码的编码效率达到 100%；当信源概率相等时，其编码效率最低。

    +     只有在概率分布很不均匀时，霍夫曼编码才会收到显著的效果。


    +   - 解码时，必须参照这一霍夫曼编码表才能正确译码。

    +     在信源的存储与传输过程中必须首先存储或传输这一霍夫曼编码表。在实际计算压缩效果时，必须考虑霍夫曼编码表占有的比特数。'
  merge: -1
  img_proc: true
