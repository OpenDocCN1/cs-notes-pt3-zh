- pgno: 1198
  md: "# 帧内预测 (Cont.)\n\n# Cost计算\n\n+   - **SAD（Sum of Absolute Difference）** 也可以称为SAE（Sum\
    \ of Absolute Error），即绝对误差和。它的计算方法就是求出两个像素块对应像素点的差值，将这些差值分别求绝对值之后再进行累加。\n+   \n\
    +   - **SATD（Sum of Absolute Transformed Difference）** 即Hadamard变换后再绝对值求和。它和SAD的区别在于多了一个“变换”。\n\
    +   \n+   - **SSD（Sum of Squared Difference）** 也可以称为SSE（Sum of Squared Error），即差值的平方。它和SAD的区别在于多了一个“平方”。"
  merge: -1
  img_proc: true
