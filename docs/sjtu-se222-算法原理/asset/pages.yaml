- pgno: 238
  md: '# How to make a heap


    ```

    Algorithm 3.6 MakeHeap

    Input: An array A[1..n] of n elements.

    Output: A[1..n] is transformed into a heap.

    1. for i ← ⌊n/2⌋ downto 1

    2. SiftDown(A, i)

    3. end for

    ```'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Heap sort


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_239_0.png)


    Algorithm 3.7 Heapsort

    Input: An array A[1..n] of n elements.

    Output: Array A[1..n] sorted in nondecreasing order.


    +   1. MakeHeap(A)

    +   2. for j ← n downto 2

    +   3. interchange A[1] and A[j]

    +   4. SiftDown(A[1..j − 1],1)

    +   5. end for'
  merge: -1
  img_proc: true
