- pgno: 844
  md: "# Flow in residual graph\n\n![](img/a8f1b433a70f1e5c410c8b43e41b650e_844_0.png)\n\
    \n> **Lemma**  \n> Let *f* be a flow in *G* and *f′* the flow in the residual\
    \ graph *R* for *f*.  \n> Then the function *f + f′* is a flow in *G* of value\
    \  \n> \\[|f+f′|=|f|+|f′|>|f|.\\]"
  merge: -1
  img_proc: true
- pgno: 845
  md: '# Augmenting path


    Definition: AugmentingPath

    Given a flow in G, an augmenting path p is a directed path from s to t in the
    residual graph R.

    The bottleneck capacity of p is the minimum residual capacity along p. The number
    of edges in p will be denoted by |p|.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_845_0.png)


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_845_1.png)'
  merge: -1
  img_proc: true
- pgno: 846
  md: "# Basic Ford-Fulkerson\n\n```\n**Algorithm 16.1** Ford-Fulkerson  \n**Input:**\
    \ A network \\((G, s, t, c)\\).  \n**Output:** A flow \\(f\\) in \\(G\\).  \n\n\
    1. Initialize the residual graph by setting \\(R = G\\).  \n2. for each edge \\\
    ((u, v) \\in E\\) do \\(f(u, v) \\leftarrow 0\\)  \n3. while there is an augmenting\
    \ path \\(p = s, \\ldots, t\\) in \\(R\\) do  \n   4. Let \\(\\Delta\\) be the\
    \ bottleneck capacity of \\(p\\)  \n   5. for each edge \\((u, v)\\) in \\(p\\\
    ) do \\(f(u, v) \\leftarrow f(u, v) + \\Delta\\)  \n   6. Update the residual\
    \ graph \\(R\\)  \n   7. end while\n```"
  merge: -1
  img_proc: true
