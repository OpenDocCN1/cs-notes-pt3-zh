- pgno: 849
  md: '# Max-flow-Min-cut theorem


    # Max-flow-Min-cut theorem


    Let *(G,s,t,c)* be a network and *f* a flow in G. The following three statements
    are equivalent:


    +   1. *f* is a maximum flow in G.

    +   2. There is no augmenting path.

    +   3. There is a cut *{S,T}* with *c(S,T)=|f|*.'
  merge: -1
  img_proc: true
