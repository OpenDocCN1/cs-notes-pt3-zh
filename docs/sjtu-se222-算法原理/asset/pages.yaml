- pgno: 40
  md: '# # Complexity


    **Proposition.** Starting from an empty data structure, any sequence of $M$ union-find
    operations on $N$ objects makes at most proportional to $N + M\log^* N$ array
    accesses.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_40_0.png)


    | $N$ | $\log^* N$ |

    |---:|---:|

    | 1 | 0 |

    | 2 | 1 |

    | 4 | 2 |

    | 16 | 3 |

    | 65536 | 4 |

    | $2^{65536}$ | 5 |


    Proofs are refer to [textbook] 4.3 and [DPV]5.1.4.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Complexity


    Proposition. Starting from an empty data structure, any sequence of M union-find
    operations on N objects makes at most proportional to N + M log* N array accesses.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_41_0.png)


    Bob Tarjan

    (Turing Award ''86)


    | N | log* N |

    |---|--------|

    | 1 | 0 |

    | 2 | 1 |

    | 4 | 2 |

    | 16 | 3 |

    | 65536 | 4 |

    | 2^65536 | 5 |


    Can we do better?


    Amazing fact. No linear-time algorithm exists.'
  merge: -1
  img_proc: true
