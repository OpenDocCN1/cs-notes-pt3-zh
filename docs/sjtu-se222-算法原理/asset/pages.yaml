- pgno: 143
  md: "# Partition #2\n- by Sedgewick\n\n```\nprivate static int partition(Comparable[]\
    \ a, int lo, int hi)\n{\n    int i = lo, j = hi+1;\n    while (true)\n    {\n\
    \        while (less(a[++i], a[lo]))\n            if (i == hi) break;\n\n    \
    \    while (less(a[lo], a[--j]))\n            if (j == lo) break;\n\n        if\
    \ (i >= j) break;\n        exch(a, i, j);\n    }\n\n    exch(a, lo, j);\n    return\
    \ j;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Complexity


    Best case: array always split into two equal-sized subarrays.

    similar to mergesort, O(NlogN)


    Worst case: array always split into a 0-sized and an N-1-sized subarrays

    similar to selection sort, O(N²)


    Average case:


    C_N = (N+1) + (C_0 + C_{N-1})/N + (C_1 + C_{N-2})/N + ... + (C_{N-1} + C_0)/N


    C_N ~ 2(N+1) ln N ≈ 1.39 N lg N'
