  md: '# Intersections of line segments


    ```

    **Algorithm 18.2** INTERSECTIONS\\

    **Input:** A set \(L = \{l_1, \ldots, l_n\}\) of \(n\) line segments in the plane.\\

    **Output:** The intersection points of the line segments in \(L\).\\


    1. Sort the endpoints in nondecreasing order of their \(x\)-coordinates and insert
    them into a heap \(E\) (the event point schedule). Let \(S\) be the empty heap.

    2. while \(E\) is not empty

    3. &nbsp;&nbsp;&nbsp;&nbsp;\(p \leftarrow \operatorname{deletemin}(E)\)

    4. &nbsp;&nbsp;&nbsp;&nbsp;if \(p\) is a left endpoint then

    5. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;let \(l\) be the line segment
    whose left endpoint is \(p\)

    6. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\(\operatorname{insert}(l,
    S)\)

    7. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\(l_1 \leftarrow \operatorname{above}(l,
    S)\)

    8. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\(l_2 \leftarrow \operatorname{below}(l,
    S)\)

    9. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if \(l\) intersects \(l_1\)
    at point \(q_1\), then \(\operatorname{process}(q_1)\)

    10. &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if \(l\) intersects \(l_2\)
    at point \(q_2\), then \(\operatorname{process}(q_2)\)

    ```'
