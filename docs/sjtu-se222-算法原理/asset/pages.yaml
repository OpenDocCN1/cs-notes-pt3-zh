- pgno: 939
  md: '# Greedy for Knapsack


    ```

    **Algorithm 15.3 KNAPSACKGREEDY**


    **Input:** `2n + 1` positive integers corresponding to item sizes `(s₁, s₂, …,
    sₙ)`, item values `(v₁, v₂, …, vₙ)` and the knapsack capacity `C`.


    **Output:** A subset `Z` of the items whose total size is at most `C`.


    1. Renumber the items so that `v₁/s₁ ≥ v₂/s₂ ≥ ⋯ ≥ vₙ/sₙ`.

    2. `j ← 0; K ← 0; V ← 0; J ← ∅`

    3. **while** `j < n` and `K < C`

    4. `j ← j + 1`

    5. **if** `sⱼ ≤ C − K` **then**

    6. `Z ← Z ∪ {j}; K ← K + sⱼ; V ← V + vⱼ`

    7. **end if**

    8. **end while**

    ```


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_939_0.png)'
  merge: -1
  img_proc: true
- pgno: 940
  md: '# R <= 2


    Let X = {u1, u2, ..., um} be the set of items of an optimal solution, assuming


    v_j / s_j ≥ v_{j+1} / s_{j+1}.


    If |X| ≤ 1 then the solution of the algorithm is optimal. So suppose |X| > 1.
    Let u_m be the first item of X not included into the knapsack by the algorithm.
    If no such items exists then the output of the algorithm is optimal. So assume
    that u_m exists.


    The optimal solution can be rewritten as


    OPT(I) = Σ_{j=1}^{m-1} v_j + Σ_{j=m}^{z} v_j


    Let W denote the set of items packed by the algorithm before u_m but not in {u1,
    u2, ..., u_{m-1}}. In other words, u_j ∈ W iff u_j ∉ {u1, u2, ..., u_{m-1}} and


    v_j / s_j ≥ v_m / s_m


    Now A(I) can be written as


    A(I) ≥ Σ_{j=1}^{m-1} v_j + Σ_{j∈W} v_j


    Let


    C'' = C - Σ_{j=1}^{m-1} s_j


    and


    C'''' = C'' - Σ_{u_j ∈ W} s_j


    By the definition of u_m, we have


    C'''' < s_m'
  merge: -1
  img_proc: true
