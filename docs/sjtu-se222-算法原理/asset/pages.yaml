- pgno: 1143
  md: '# LZ系列算法


    +   - 《A Universal Algorithm for Sequential Data Compression》

    +     By Jacob Ziv & Abraham Lempel 1977

    +     他们提出的算法称为LZ77，之后又提出很多变种算法，基本都以LZ开头，包括gif使用的LZW。

    +     LZ及以后的改进算法，将变长的符号串映射为定长的编码。'
  merge: -1
  img_proc: true
- pgno: 1144
  md: '# LZ77


    +   - LZ77算法使用 “滑动窗口压缩”

    +   - 将部分字符串用类似指针的结构所替代'
  merge: -1
  img_proc: true
- pgno: 1145
  md: '# LZ77


    +   - 1、从当前压缩位置开始，考察未编码的数据，并试图在滑动窗口中找出最长的匹配字符串，如果找到，则进行步骤 2，否则进行步骤 3。

    +   - 2、输出三元符号组（ off,len,c ）。其中 off 为窗口中匹配字符串相对窗口边界的偏移， len为可匹配的长度，c 为下一个字符，即不匹配的第一个字符。然后将窗口向后滑动
    len+1 个字符，继续步骤 1。

    +   - 3、输出三元符号组（ 0,0,c ）。其中 c 为下一个字符。然后将窗口向后滑动一个字符，继续步骤 1。'
  merge: -1
  img_proc: true
