  md: '# Brute Suffix Match


    ```

    Algorithm: Brute-Suffix-Match(T, P)


    1    j = 0;

    2    while (j <= strlen(T) - strlen(P)) {

    3        for (i = strlen(P) - 1; i >= 0 && P[i] == T[i + j]; --i)

    4            if (i < 0)

    5                match;

    6            else

    7                ++j;

    8    }

    ```'
