- pgno: 613
  md: '# Relaxing


    The process of *relaxing* an edge $(u,v)$ consists of testing whether we can improve
    the shortest path to $v$ found so far by going through $u$.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_613_0.png)


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_613_1.png)'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Shortest-path properties


    Notation: We fix the source to be s.


    λ[v]: the length of path computed by our algorithms from s to v.


    δ[v]: the length of the shortest path from s to v.


    Triangle property

    δ[v] <= δ[u] + w(u,v) for any edge (u,v).


    Upper-bound property

    δ[v] <= λ[v] for any vertex v.


    Convergence property

    If s⇒ u→v is a shortest path, and if λ[u] = δ[u], then after relax(u,v), we have
    λ[v] = δ[v].'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# Bellman-Ford algorithm


    E = {(t,x),(t,y),(t,z),(x,t),(y,x),(y,z),(z,x),(z,s),(s,t),(s,y)}


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_615_0.png)


    ```

    BELLMAN-FORD(G, w, s)

    1 INITIALIZE-SINGLE-SOURCE(G, s)

    2 for i = 1 to |G.V| − 1

    3   for each edge (u, v) ∈ G.E

    4     RELAX(u, v, w)

    5 for each edge (u, v) ∈ G.E

    6   if v.d > u.d + w(u, v)

    7     return FALSE

    8 return

    ```


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_615_1.png)


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_615_2.png)'
  merge: -1
  img_proc: true
