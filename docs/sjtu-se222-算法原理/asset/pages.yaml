  md: "# # Huffman编码\n\n```\n1、根据权值初始化哈夫曼树\nfor(int i=0;i<n;i++)\n{\n    HTree[i].weight=a[i];\n\
    \    HTree[i].LChild=-1;\n    HTree[i].RChild=-1;\n    HTree[i].parent=-1;\n}\n\
