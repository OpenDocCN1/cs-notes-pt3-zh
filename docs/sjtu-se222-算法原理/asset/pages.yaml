- pgno: 337
  md: '# Multiplication


    Problem: Multiplication

    Input: two n-bits binary integers x and y

    Output: x □ y


    x = 2^{n/2} w + u


    y = 2^{n/2} z + v


    xy = (2^{n/2} w + u)(2^{n/2} z + v)

    = 2^{n} w z + 2^{n/2} (u z + w v) + u v


    T(n) = 4 T(n/2) + Θ(n) = Θ(n²)'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Multiplication


    Problem: Multiplication

    Input: two n-bits binary integers x and y

    Output: x □ y


    xy = (2^{n/2} w + u)(2^{n/2} z + v)

    = 2^{n} wz + 2^{n/2} (uz + wv) + uv


    (w + u)(z + v) = wz + uz + wv + uv

    uz + wv = (w + u)(z + v) − uv − wz


    T(n) = 3T(n/2) + Θ(n) = Θ(n^{log 3})'
  merge: -1
  img_proc: true
