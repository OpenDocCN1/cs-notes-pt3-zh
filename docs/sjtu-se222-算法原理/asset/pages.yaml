- pgno: 884
  md: '# Class P


    # Definition: ClassP


    A problem π is in class P if and only if there exists a deterministic Turing machine
    M, such that


    +   - M runs in polynomial time on all inputs

    +   - For all instance with Yes answer, M terminates with accept state

    +   - For all instance with No answer, M terminates with reject state'
  merge: -1
  img_proc: true
- pgno: 885
  md: '# Class NP


    Definition: ClassNP

    A problem π is in class NP if and only if there exists a nondeterministic Turing
    machine M, such that


    +   - M runs in polynomial time on all inputs

    +   - For all instance with Yes answer, there exists a path of M that terminates
    with accept state

    +   - For all instance with No answer, all paths terminates with reject state


    Guess a witness --> verify the witness is valid'
  merge: -1
  img_proc: true
