- pgno: 813
  md: '# MCM


    # Algorithm 7.2 MatChain


    +   1. for i ← 1 to n

    +   2. C[i,i] ← 0

    +   3. end for

    +   4. for d ← 1 to n − 1

    +   5. for i ← 1 to n − d

    +   6. j ← i + d

    +   7. C[i,j] ← ∞

    +   8. for k ← i + 1 to j

    +   9. C[i,j] ← min{C[i,j], C[i,k−1] + C[k,j] + r[i]r[k]r[j+1]}

    +   10. end for

    +   11. end for

    +   12. end for

    +   13. return C[1,n]


    ∑_{d=1}^{n−1} ∑_{i=1}^{n−d} ∑_{k=1}^{d} c = (c n³ − c n)/6 = Θ(n³)'
  merge: -1
