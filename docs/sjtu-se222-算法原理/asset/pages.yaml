- pgno: 407
  md: '# Kosaraju-Sharir algorithm


    +   1. Run DFS on Gᴿ.

    +   2. Run the undirected connected components algorithm on G, and during the
    DFS, process the vertices in *decreasing order* of their post numbers from step
    1.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_407_0.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Tarjan


    +   - try all vertex u, if u hasn’t been visited, DFS(u)

    +   - DFS(u), add u to stack, initiate num[u] and low[u]

    +   - try all neighbor v of u

    +   - if v is free, DFS(v)

    +   - update low[u]

    +   - if low[u]==num[u]

    +   - pop from stack until we get u;'
  merge: -1
  img_proc: true
