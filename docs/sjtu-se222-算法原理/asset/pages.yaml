- pgno: 1200
  md: '# 运动估计 (Cont.)


    以搜索起点为中心，采用下图所示的小菱形模板（模板半径为1）搜索。计算各点的匹配误差，得到MBD（最小误差）点。如果MBD点在模板中心，则搜索结束，此时MBD点就是最优匹配点，对应的像素块就是最佳匹配块；如果MBD点不在模板中心位置，则以现在MBD点为中心点，继续进行小菱形搜索，直至MBD点落在中心点为止。


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_1200_0.png)'
