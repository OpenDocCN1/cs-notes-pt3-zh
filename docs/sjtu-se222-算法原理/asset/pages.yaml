    \ x,y;\nfor (int i=n;i<2*n-1;i++) {\n    selectMin(x,y,0,i);//从1到i选择两个权值最小的\n\
    \    HTree[x].parent=HTree[y].parent=i;\n    HTree[i].weight=HTree[x].weight+HTree[y].weight;\n\
