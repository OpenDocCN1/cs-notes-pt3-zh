    There exists an iteration such that:


    +   1. Choose and put {u₁,…,uₖ} into the knapsack


    +   2. Run greedy algorithm and uₘ is the first item of Z that is not chosen by
    the greedy algorithm.


    +   3. W={uⱼ | uⱼ selected by A, and uⱼ ∉ {u₁,…,uₘ} but vⱼ/sⱼ >= vₘ/sₘ }


