  md: '# Algorithm 9.1 DFS


    Input: A directed or undirected graph G = (V, E).


    Output: Preordering and postordering of the vertices in the corresponding depth
    first tree.


    +   1. predfn ← 0; postdfn ← 0

    +   2. for each vertex v ∈ V

    +   3. mark v unvisited

    +   4. end for

    +   5. for each vertex v ∈ V

    +   6. if v is marked unvisited then dfs(v)

    +   7. end for


    # Procedure dfs(v)


    +   1. mark v visited

    +   2. predfn ← predfn + 1

    +   3. for each edge (v, w) ∈ E

    +   4. if w is marked unvisited then dfs(w)

    +   5. end for

    +   6. postdfn ← postdfn + 1'
