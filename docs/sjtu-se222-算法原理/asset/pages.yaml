- pgno: 631
  md: '# All-pairs shortest path


    Define dᵏᵢ,ⱼ to be the length of a shortest path from i to j that does not pass
    any vertex in {k+1, k+2, ..., n}. Clearly


    dᵏᵢⱼ = { l[i, j] if k = 0

    min{ dᵏ⁻¹ᵢ,ⱼ , dᵏ⁻¹ᵢ,ₖ + dᵏ⁻¹ₖ,ⱼ } if 1 ≤ k ≤ n }


    all intermediate vertices in {1,2,...,k-1}    all intermediate vertices in {1,2,...,k-1}


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_631_0.png)


    p: all intermediate vertices in {1,2,...,k}'
