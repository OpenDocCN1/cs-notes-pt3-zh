- pgno: 625
  md: '# Correctness


    # Theorem (CorrectnessOfDijkstraAlgorithm)


    In Algorithm Dijkstra, when a vertex u is chosen in Step 7, if its label λ[u]
    is finite then λ[u] = δ[u].


    Assume u is chosen in Step 7, and


    +   1. λ[u] > δ[u]

    +   2. s ⇒ x → y ⇒ u is the shortest path


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_625_0.png)


    δ[u] = δ[x] + w(x,y) + w(p2)

    = λ[x] + w(x,y) + w(p2)

    ≥ λ[x] + w(x,y)

    ≥ λ[y] ≥ λ[u]'
  merge: -1
  img_proc: true
