  md: "# Strassen’s algorithm\n\nD₁ = (A₁₁ + A₂₂)(B₁₁ + B₂₂)\nD₂ = (A₂₁ + A₂₂)B₁₁\n\
    D₃ = A₁₁(B₁₂ − B₂₂)\nD₄ = A₂₂(B₂₁ − B₁₁)\nD₅ = (A₁₁ + A₂₂)B₂₂\nD₆ = (A₂₁ − A₁₁)(B₁₁\
    \ + B₁₂)\nD₇ = (A₁₂ − A₂₂)(B₂₁ + B₂₂)\n\n⎛ C₁₁ C₁₂ ⎞   ⎛ D₁ + D₄ − D₅ + D₇   D₃\
    \ + D₅ ⎞\n⎝ C₂₁ C₂₂ ⎠ = ⎝ D₂ + D₄           D₁ + D₃ − D₂ + D₆ ⎠\n\nT(n) = { m\
    \                     if n = 1\n        7T(n/2) + 18(n/2)² a   if n ≥ 2 }\n\n\
