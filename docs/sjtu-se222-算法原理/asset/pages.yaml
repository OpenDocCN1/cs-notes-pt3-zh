- pgno: 1179
  md: '+   - 顺序式编码（Sequential Encoding）： encodes coefficients of a single block at
    a time (in a zigzag manner).

    +   - 递增式编码（Progressive Encoding）： encodes similar-positioned coefficients of
    all blocks in one go, followed by the next positioned coefficients of all blocks,
    and so on. It should be noted here that once all similar-positioned coefficients
    have been encoded, the next position to be encoded is the one occurring next in
    the zigzag traversal as indicated in the figure above.'
