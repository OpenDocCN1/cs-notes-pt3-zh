  md: '# LSD string sort: correctness proof


    Proposition. LSD sorts fixed-length strings in ascending order.


    Pf. [ by induction on i ]


    After pass i, strings are sorted by last i characters.


    +   - If two strings differ on sort key, key-indexed sort puts them in proper
    relative order.

    +   - If two strings agree on sort key, stability keeps them in proper relative
    order.


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_1024_0.png)


    Proposition. LSD sort is stable.


    Pf. Key-indexed counting is stable.'
