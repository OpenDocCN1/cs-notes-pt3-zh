- pgno: 990
  md: '# Algorithm 18.4 DIAMETER


    Input: A set of n points in the plane.


    Output: Diam(S), the diameter of S.


    +   1. {p₁, p₂, …, pₘ} ← CH(S)

    +   2. A ← {}

    +   3. k ← 2

    +   4. while dist(pₘ, p₁, pₖ₊₁) > dist(pₘ, p₁, pₖ)

    +   5. k ← k + 1

    +   6. end while

    +   7. i ← 1; j ← k


    +   8. while i ≤ k and j ≤ m

    +   9. A ← A ∪ {(pᵢ, pⱼ)}

    +   10. while dist(pᵢ, pᵢ₊₁, pⱼ₊₁) > dist(pᵢ, pᵢ₊₁, pⱼ) and j < m

    +   11. A ← A ∪ {(pᵢ, pⱼ)}

    +   12. j ← j + 1

    +   13. end while

    +   14. i ← i + 1

    +   15. end while

    +   16. Scan A to obtain an antipodal pair (pᵣ, pₛ) with maximum separation

    +   17. return the distance between pᵣ and pₛ


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_990_0.png)'
