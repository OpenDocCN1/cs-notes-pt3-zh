    我们先看这个例子，假设区间是[0.011,0.101)，那么图来看的话区间就是处于[3/8,6/8]之间，我们将原先区间的[2/8,6/8]放大一倍，那么此时原先的子区间就变成了[2/8,1)，可以参见右图。我们注意到放大后，如果编码下一个字符的时候，子区间存在于上半部分，也就是上图右边[4/8,1)之间，那么也就是上图左边[4/8,6/8]的位置，这个部分的编码为10，所以输出10。


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_1139_1.png)'
