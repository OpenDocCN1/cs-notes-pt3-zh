- pgno: 234
  md: '# Delete-maximum: SiftDown


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_234_0.png)


    O(2 log n)


    ```

    SiftDown(H,i)

    1. done ← false

    2. if 2i > n then exit

    3. repeat

    4.   i ← 2i

    5.   if i + 1 ≤ n and key(H[i + 1]) > key(H[i])

    6.   then i ← i + 1

    7.   if key(H[⌊i/2⌋]) < key(H[i])

    8.   then interchange H[i] and H[⌊i/2⌋]

    9.   else done ← true

    10. until 2i > n or done

    ```'
  merge: -1
  img_proc: true
