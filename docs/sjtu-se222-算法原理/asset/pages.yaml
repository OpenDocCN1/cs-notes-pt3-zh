  md: '# 算术编码自适应模型


    存储空间问题


    采用数组结构存储所有可能出现的上下文。


    采用树结构存储所有出现过的上下文。


    +   - 将 0 阶上下文表存储在数组中，每个数组元素包含了指向相应的 1 阶上下文表的指针，1 阶上下文表中又包含了指向 2 阶上下文表的指针……

    +   - 只有出现过的上下文才拥有已分配的节点，没有出现过的上下文不必占用内存空间。'
