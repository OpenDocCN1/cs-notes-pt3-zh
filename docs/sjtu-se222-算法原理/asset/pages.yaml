  md: "# Key-indexed counting demo\n\nGoal. Sort an array a[] of N integers between\
    \ 0 and R - 1.\n\n+   - Count frequencies of each letter using key as index.\n\
    +   - Compute frequency cumulates which specify destinations.\n+   - Access cumulates\
    \ using key as index to move items.\n+   - Copy back into original array.\n\n\
    ```\nint N = a.length;\nint[] count = new int[R+1];\n\nfor (int i = 0; i < N;\
    \ i++)\n    count[a[i]+1]++;\n\nfor (int r = 0; r < R; r++)\n    count[r+1] +=\
    \ count[r];\n\nfor (int i = 0; i < N; i++)\n    aux[count[a[i]]++] = a[i];\n\n\
    for (int i = 0; i < N; i++)\n    a[i] = aux[i];\n```\n\n![](img/a8f1b433a70f1e5c410c8b43e41b650e_1016_0.png)"
