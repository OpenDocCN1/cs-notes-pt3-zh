- pgno: 1133
  md: '# 算术编码评价


    +   1. 概率大的符号对应的区间大，描述所需的空间小。

    +   2. 随着输入序列长度增加，平均编码所用空间趋向于信源熵。'
  merge: -1
  img_proc: true
- pgno: 1134
  md: '# 算术编码的局限性


    +   1. 算术编码过程中的移位和输出不均匀，需要缓冲存储器。因此只适用于分段信息。

    +   2. 算术编码每次递推都要做乘法，并且必须在一个信源符号的处理周期内完成，有时难以实时。

    +   3. 算术编码是一种对错误敏感的编码方法，如有一位出错，就会导致整个消息译错。要求高质量的信道，或采取检错反馈方式。

    +   3. 相比huffman实现更复杂，特别是硬件实现。'
  merge: -1
  img_proc: true
- pgno: 1135
  md: '# 算术编码的压缩效率


    我们知道，表示一个 [0,1) 的小数，至少需要 $-\log_2\varepsilon$ 二进制位。假设 $\lambda$ 为我们最终得到的子区间长度，那么我们所需的那个数就可以用
    $-\log_2\lambda$ 个二进制位表示，为什么呢？假设最终的区间为 [0.101100，0.101101)，那么区间长度为 0.000001。我们至少需要
    $-\log_2\lambda$ 个二进制位表示，而我们最终需要的 0.10110 位数比 0.00000 少，故而可以用 $-\log_2\lambda$
    个二进制位表示。


    $$L_N=\prod_{i=1}^{N}p(s_i)$$


    其中 $p(s_i)$ 表示我们编码的第 $i$ 个字符的频率。


    故而我们每个字符平均需要的位数 $B_s=\frac{-\log_2\lambda+\sigma}{N}$，其中 $\sigma$ 是个常数因为你编码中必须得存一下字符频率等相关信息，这些信息也是占用空间的。'
  merge: -1
  img_proc: true
- pgno: 1136
  md: "# 算术编码的压缩效率\n\nand thus\n\n$$B_S \\le \\frac{\\sigma - \\sum_{k=1}^{N} \\log_2\
    \ p(s_k)}{N}\\quad \\text{bits/symbol.}\\tag{1.23}$$ \n\nDefining $E\\{\\cdot\\\
    }$ as the expected value operator, the expected number of bits per symbol is\n\
    \n$$\\bar{B}=E\\{B_S\\}\\le \\frac{\\sigma - \\sum_{k=1}^{N}E\\{\\log_2 p(s_k)\\\
    }}{N}=\\frac{\\sigma - \\sum_{k=1}^{N}\\sum_{m=0}^{M-1}p(m)\\log_2 p(m)}{N}\\\
    tag{1.24}$$ \n$$\\le H(\\Omega)+\\frac{\\sigma}{N}$$ \n\nSince the average number\
    \ of bits per symbol cannot be smaller than the entropy, we have\n\n$$H(\\Omega)\\\
    le \\bar{B}\\le H(\\Omega)+\\frac{\\sigma}{N},\\tag{1.25}$$ \n\nand it follows\
    \ that\n\n$$\\lim_{N\\to\\infty}\\{\\bar{B}\\}=H(\\Omega),\\tag{1.26}$$"
  merge: -1
  img_proc: true
- pgno: 1137
  md: '# 算术编码评价


    s表示待编码的符号串，b表示编码s所需要的位数。当s变长，其概率P(s)就变小，b就变长。因此b的增长速度将与−log₂P(s)的缩小速度相同。因此两者的积应为常数或接近一个常数。信息论已经证明了下面的不等式


    $$2 \le 2bP(s) < 4$$


    同时去对数得


    $$1-\log_2P(s) \le b < 2-\log_2P(s)$$


    随着s变长，其概率P(s)就缩小，−log₂P(s)也就变成了一个大数，所以b的极限就是−log₂P(s)。


    而−log₂P(s)是整个字符串的熵，所以算术编码理论上讲能把符号串压缩到其理论极限。'
  merge: -1
  img_proc: true
- pgno: 1138
  md: '# 算术编码 扩位


    由于实际的计算机的精度不可能无限长，运算中出现溢出是一个明显的问题。


    解决：


    +   1. 多数机器都有16位、32位或者64位的精度，因此这个问题可使用比例缩放方法解决。


    +   2. 我们注意到，要是区间的上下界中前面几个字符是一样的，那么以后编码的时候它们还是不一样变的。举个例子，要是编码区间为[0.1101,0.1111)，那么后来再怎么编码，得到的区间还是[0.11~,0.11~)前面几个字符是一样的。那么我们是不是可以进行输出了呢，这样就可以避免溢出啦！'
  merge: -1
  img_proc: true
