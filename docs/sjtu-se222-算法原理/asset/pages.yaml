- pgno: 1119
  md: '# 算术编码的自适应模型


    在现实生活中，实现知道精确信源概率很难且不切实际的。静态模型需要在压缩前对信息内字符的分布进行统计，这一统计过程将消耗大量的时间，使得本来就比较慢的算术编码压缩更加缓慢


    必须再消耗**一定的空间**保存静态模型统计出的概率分布，保存模型所用的空间将使我们重新远离熵值。


    因此最有效的方法是**在编码过程中估算概率**。'
  merge: -1
  img_proc: true
