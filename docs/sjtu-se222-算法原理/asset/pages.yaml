  md: '# Activity-selection


    ```

    GREEDY-ACTIVITY-SELECTOR(s, f)

    1  n = s.length

    2  A = {a₁}

    3  k = 1

    4  for m = 2 to n

    5    if s[m] ≥ f[k]

    6      A = A ∪ {aₘ}

    7      k = m

    8  return A

    ```


    # Theorem


    Consider any nonempty subproblem Sₖ, and let aₘ be an activity in Sₖ with the
    earliest finish time. Then aₘ is included in some maximum-size subset of mutually
    compatible activities of Sₖ.'
