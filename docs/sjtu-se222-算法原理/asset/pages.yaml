- pgno: 1215
  md: "# Master theorem\n\n# Simplified Master Theorem\n\nLet $a \\ge 1$, $b > 1$\
    \ and $c,d,w \\ge 0$ be constants, and let $T(n)$ be defined on the nonnegative\
    \ integers by the recurrence\n\n```\nf(n) = { w               if n = 1\n     \
    \     a f(n/b) + c n^d   if n > 1 }\n```\n\nThen\n\n```\nf(n) = { Θ(n^d)     \
    \       if a < b^d\n          Θ(n^d log n)      if a = b^d\n          Θ(n^{log_b\
    \ a})    if a > b^d }\n```"
  merge: -1
  img_proc: true
