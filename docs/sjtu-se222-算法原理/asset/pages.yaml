  md: '# Residual graph


    The residual graph for the flow f is the directed graph R = (V, E_f), with capacities
    defined by r and

    E_f = {(u,v) | r(u,v) > 0} where r(u,v)=c(u,v)-f(u,v)


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_843_0.png)


