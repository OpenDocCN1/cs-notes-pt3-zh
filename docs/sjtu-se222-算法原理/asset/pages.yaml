- pgno: 405
  md: '# Some properties


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_405_0.png)


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_405_1.png)


    # Property 1


    If dfs is started at node u, then it will terminate precisely when all nodes reachable
    from u have been visited.


    # Property 2


    The node that receives the highest post number in DFS must lie in a source strongly
    connected component.


    # Property 3


    If C and C'' are scc, and there is an edge from a node in C to a node in C'',
    then the highest post number in C is bigger than the highest post number in C''.'
  merge: -1
