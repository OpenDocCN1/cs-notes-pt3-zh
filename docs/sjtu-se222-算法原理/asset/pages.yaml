  md: '# Proof


    +   1. Let U = {u₁, u₂, . . . , uₙ} and C being the knapsack capacity.

    +   2. Let X be the set of items of an optimal solution. If |X| ≤ k then the solution
    of the algorithm is optimal. So suppose |X| > k.

    +   3. Let Y = {u₁,u₂,...,uₖ} be the set of k largest valued items in X.

    +   4. Let Z = {uₖ₊₁,uₖ₊₂,...,uᵣ} be the set of remaining items in X, assuming
    vₖ₊₁/sₖ₊₁ ≥ vₖ₊₂/sₖ₊₂ ≥ . . . ≥ vᵣ /sᵣ.


