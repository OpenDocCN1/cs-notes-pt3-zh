  md: '# Horner’s rule


    ```

    **Algorithm 5.6** Horner


    **Input:** A sequence of \(n+2\) real numbers \(a_0, a_1, \ldots, a_n\) and \(x\).


    **Output:** \(P_n(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_1x+a_0\).


