- pgno: 778
  md: '# Huffman code


    Algorithm 8.6 Huffman


    Input: A set C = {c₁, c₂, …, cₙ} of n characters and their frequencies {f(c₁),
    f(c₂), …, f(cₙ)}.


    Output: A Huffman tree (V, T) for C.


    +   1. Insert all characters into a min-heap H according to their frequencies.

    +   2. V ← C; T ← ∅

    +   3. for j ← 1 to n − 1

    +   4. c ← DeleteMin(H)

    +   5. c′ ← DeleteMin(H)

    +   6. f(v) ← f(c) + f(c′)

    +   7. Insert(H, v)

    +   8. V ← V ∪ {v}

    +   9. T ← T ∪ {(v, c), (v, c′)}

    +   10. end for'
  merge: -1
  img_proc: true
- pgno: 779
  md: '# Correctness


    Lemma

    Let *x* and *y* be two characters in *C* having the lowest frequencies.

    Then there exists an optimal prefix code for *C* in which *x* and *y* have the
    same length and differ only in the last bit.


    Lemma

    Let *x* and *y* be two characters in *C* having the lowest frequencies.

    *C''* = *C* - {*x*,*y*} + {*z*}, *f_z* = *f_x* + *f_y*.

    If *T''* is an optimal prefix code for *C''*, then *T* = *T''* + {(*z*,*x*), (*z*,*y*)}
    is an optimal prefix code for *C*.


    Theorem

    Procedure HUFFMAN produces an optimal prefix code.'
  merge: -1
  img_proc: true
