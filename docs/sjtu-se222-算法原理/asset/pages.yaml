- pgno: 1074
  md: "# Pseudo\n\n```\nRABIN-KARP-MATCHER(T, P, d, q)\nn = T.length\nm = P.length\n\
    h = d^(m-1) mod q\np = 0\nt[0] = 0\nfor i = 1 to m\n    p = (d*p + P[i]) mod q\n\
    \    t[0] = (d*t[0]+T[i]) mod q\nfor s = 0 to n-m\n    if p == t[s]\n        if\
    \ P[1..m] == T[s+1..s+m]\n            print (\"Find P with shift: \"+s)\n    if\
    \ s < n-m\n        t[s+1] = (d*(t[s]-T[s+1]*h) + T[s+m+1]) mod q\n```\n\nSpace\
    \ Complexity:\nO(n-m)\n\nTime Complexity:\nO(m*(n-m))"
  merge: -1
