- pgno: 618
  md: '# Correctness


    Correctness of Bellman-Ford

    If G contains no negative-weight cycles reachable from s, then the algorithm returns
    TRUE, and for all v, λ[v] = δ[v], otherwise the algorithm returns FALSE.


    Proof.


    No negative cycle. By the fact that the length of simple paths is bounded by |V|
    - 1.

    After i-th iteration of relax, λ[vi] = δ[vi].


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_618_0.png)


    Negative cycle. After i-th iteration of relax,

    λ[vi] + w(vi,vj) < λ[vj].

    The length of negative cycle is at most |V|.'
  merge: -1
  img_proc: true
