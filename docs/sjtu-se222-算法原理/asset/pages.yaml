- pgno: 1149
  md: '# LZW


    +   - 从原始文件中提取出一些字符，并用这些字符创建一个编码表。

    +   - 编码表一般每项为12个bit，这样编码表一共有4096项。0~255一般是固定的，为ASCII码值。256通常表示新的编码表的开始，257表示压缩结束，写在压缩文件尾。从258开始，每个值都代表一个字符串（长度大于等于2）'
  merge: -1
  img_proc: true
- pgno: 1150
  md: "# LZW\n\n编码表每一项的结构\n\n```\nstruct\n{\n    bool used; //该项是否被编码。\n    int prev;\
    \ //前缀编码索引(0~4095)。\n    char c; //本项对应字符。\n}\n```\n\n在一开始初始化编码表0~255项，设置prev为null，c为对应的字符"
  merge: -1
  img_proc: true
- pgno: 1151
  md: '# LZW


    +   步骤1： 开始时的词典包含所有可能的根(Root)，设置他们的前缀P为空；

    +   步骤2： 读取第一个字符C，并当做下一个字符的前缀；

    +   步骤3： 判断前缀+字符P+C是否在词典中

    +     (1) 如果“是”： P := P+C // (将两者合并，称为下一个字符的前缀)；

    +     (2) 如果“否”

    +       ① 把代表当前前缀P的码字输出到码字流；

    +       ② 把P+C添加到词典；

    +       ③ 令P= C；'
  merge: -1
  img_proc: true
