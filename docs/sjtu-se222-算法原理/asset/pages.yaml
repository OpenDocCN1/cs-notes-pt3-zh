  md: '# 离散余弦变换（Discrete Cosine Transform）


    +   - 类似离散傅立叶变换，但是只使用实数

    +   - 能量集中特性，大多数的自然信号(包括声音和图像)的能量都集中在离散余弦变换后的低频部分，人眼对高频部分不敏感（只涉及细节部分），因此将这些高频部分抛弃

    +   - 图像数据转换为DCT频率系数'
  merge: -1
