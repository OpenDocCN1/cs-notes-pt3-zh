  md: "# Boyer-Moore Algorithm\n\n```\nvoid preBmBc(char *x, int m, int bmBc[]) {\n\
    \    int i;\n    for (i = 0; i < ASIZE; ++i)\n        bmBc[i] = m;\n    for (i\
    \ = 0; i < m - 1; ++i)\n        bmBc[x[i]] = m - i - 1;\n}\n\nsuffix[m-1]=m;\n\
    for (i=m-2; i >=0; --i){\n    q=i;\n    while(q>=0 && P[q]==P[m-1-i+q])\n    \
    \    --q;\n    suffix[i]=i-q;\n}\n```\n\n```\nvoid preBmGs(char *x, int m, int\
    \ bmGs[]) {\n    int i, j, suff[XSIZE];\n    suffixes(x, m, suff);\n    for (i\
    \ = 0; i < m; ++i)\n        bmGs[i] = m;\n    j = 0;\n    for (i = m - 1; i >=\
    \ 0; --i)\n        if (suff[i] == i + 1)\n            for (; j < m - 1 - i; ++j)\n\
    \                if (bmGs[j] == m)\n                    bmGs[j] = m - 1 - i;\n\
    \    for (i = 0; i <= m - 2; ++i)\n        bmGs[m - 1 - suff[i]] = m - 1 - i;\n\
    }\n```"
