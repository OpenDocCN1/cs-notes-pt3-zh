- pgno: 1225
  md: '# NP-theory


    +   - **P:** deterministic TM, Polynomial time

    +   - **NP:** Nondeterministic TM, Polynomial time

    +   - **A ∝ₚ B:** Use B to solve A, A is less harder than B.

    +   - **NPC:** the hardest problems in NP.

    +     3-SAT, 3-coloring, Hamiltonian, Vertex Cover, TSP......

    +   - **Test:** *Show clique is NPC given vertex cover is NPC.*


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_1225_0.png)'
  merge: -1
  img_proc: true
- pgno: 1226
  md: '# Backtracking


    +   - **What:** A kind of intelligent exhaustive search

    +   - **When:** partial solution can be quickly checked

    +   - **Examples:** 3-coloring, 8-queen.....'
  merge: -1
  img_proc: true
- pgno: 1227
  md: '# Lower bounds


    +   - **What:** A problem has lower bounds Ω(f(n)) if all algorithms for it are
    Ω(f(n)).

    +   - Optimal algorithms

    +   - In decision tree model, *Sorting*, *Element uniqueness*, *Closest pair*,
    *Convex hull*, and *Euclidean MST* have lower bound Ω(nlogn).'
  merge: -1
  img_proc: true
- pgno: 1228
  md: '# # Randomized algorithm


    +   - **What:** algorithms that play dice.

    +   - **Types:** Monte Carlo and Las Vegas

    +   - **Examples:** Randomized Quicksort, String equivalence check, Primality
    check......

    +   - *Test:* *Tell the difference between Monte Carlo and Las Vegas algorithm.*'
  merge: -1
  img_proc: true
- pgno: 1229
  md: '# Approximation algorithm


    +   - **What:** a trade-off between precision and time.(polynomial time algorithm)

    +   - **When:** optimization problems

    +   - Approximation ratio, hardness result

    +   - **Examples:** Vertex cover, Knapsack, TSP.....

    +   - **Test:** *Show there is no constant ratio approximation algorithms for
    TSP unless P=NP.*'
  merge: -1
  img_proc: true
- pgno: 1230
  md: '# Computational geometry


    +   - **What:** algorithms which can be stated in terms of geometry

    +   - Geometric sweeping

    +   - **Examples:** Maximal points, Convex hull, Diameter......'
  merge: -1
  img_proc: true
