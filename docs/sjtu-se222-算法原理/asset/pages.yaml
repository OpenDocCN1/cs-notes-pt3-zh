- pgno: 334
  md: '# MinMax: Which one is better?


    Problem: MinMax

    Input: a sequence of integers A[1...n]

    Output: the maximum element and the minimum element in A[1...n]


    ```

    1. x ← A[1]; y ← A[1]

    2. for i ← 2 to n

    3.   if A[i] < x then x ← A[i]

    4.   if A[i] > y then y ← A[i]

    5. end for

    6. return (x, y)

    ```


    ```

    Procedure minimax(low, high)

    1. if high − low = 1 then

    2.   if A[low] < A[high] then return (A[low], A[high])

    3.   else return (A[high], A[low])

    4. end if

    5. else

    6.   mid ← ⌊(low + high)/2⌋

    7.   (x1, y1) ← minimax(low, mid)

    8.   (x2, y2) ← minimax(mid + 1, high)

    9.   x ← min{x1, x2}

    10.  y ← max{y1, y2}

    11.  return (x, y)

    12. end if

    ```'
  merge: -1
  img_proc: true
- pgno: 335
  md: "# MinMax: Which one is better?\n\n**Problem:** MinMax  \n**Input:** a sequence\
    \ of integers $A[1...n]$, $n = 2^k$  \n**Output:** the maximum element and the\
    \ minimum element in $A[1...n]$\n\n```\n1. x ← A[1], y ← A[1]\n2. for i ← 2 to\
    \ n\n3.     if A[i] < x then x ← A[i]\n4.     if A[i] > y then y ← A[i]\n5. end\
    \ for\n6. return (x, y)\n```\n\n```\n**Procedure** `minmax(low, high)`\n\n1. if\
    \ high − low = 1 then\n2.     if A[low] < A[high] then return (A[low], A[high])\n\
    3.     else return (A[high], A[low])\n4.     end if\n5. else\n6.     mid ← (low\
    \ + high) / 2\n7.     (x₁, y₁) ← minmax(low, mid)\n8.     (x₂, y₂) ← minmax(mid\
    \ + 1, high)\n9.     x ← min(x₁, x₂)\n10.    y ← max(y₁, y₂)\n11.    return (x,\
    \ y)\n12. end if\n```\n\n$#comp = 2n - 2$\n\n$#comp = 3n/2 - 2$  \nCost more spaces"
