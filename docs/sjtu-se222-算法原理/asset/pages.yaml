- pgno: 1218
  md: '# Sorting


    | | Average | Worst |

    |---|---|---|

    | Insertion | O(n²) | O(n²) |

    | Selection | O(n²) | O(n²) |

    | Bubble | O(n²) | O(n²) |

    | Quick | O(nlogn) | O(n²) |

    | Bottom-up merge | O(nlogn) | O(nlogn) |

    | Merge | O(nlogn) | O(nlogn) |

    | Heap | O(nlogn) | O(nlogn) |

    | Radix | O(kn) | O(kn) |

    | Bucket | O(n) | O(n²) |


    Test: Give an optimal algorithm for sorting'
  merge: -1
  img_proc: true
