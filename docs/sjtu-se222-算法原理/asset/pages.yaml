- pgno: 870
  md: '# Turing machine


    Definition: TuringMachine

    A (one-tape) Turing machine is a 6-tuple <Q, Γ, b, δ, q0, F> where


    +   - Q: is a finite, non-empty set of states

    +   - Γ: is a finite, non-empty set of the tape alphabet/symbols

    +   - b: is the blank symbol

    +   - q0: is the initial state

    +   - F: is the set of final or accepting states.

    +   - δ: is the transition function Q\F × Γ → Q × Γ × {L,R}


    ![](img/a8f1b433a70f1e5c410c8b43e41b650e_870_0.png)'
