  md: '# Matrix multiplication


    where


    \begin{pmatrix} a_{11} \dots a_{1n} \\ \vdots \\ a_{n1} \dots a_{nn} \end{pmatrix}
    \begin{pmatrix} b_{11} \dots b_{1n} \\ \vdots \\ b_{n1} \dots b_{nn} \end{pmatrix}
    = \begin{pmatrix} c_{11} \dots c_{1n} \\ \vdots \\ c_{n1} \dots c_{nn} \end{pmatrix}


    c_{ij} = \sum_{k=1}^{n} a_{ik} b_{kj}


    T(n) = \Theta(n^3)'
