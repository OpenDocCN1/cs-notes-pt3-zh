- pgno: 111
  md: "```\nvoid\nreadsect(void *dst, uint offset)\n{\n    // Issue command.\n   \
    \ waitdisk();\n    outb(0x1F2, 1);    // count = 1\n    outb(0x1F3, offset);\n\
    \    outb(0x1F4, offset >> 8);\n    outb(0x1F5, offset >> 16);\n    outb(0x1F6,\
    \ (offset >> 24) | 0xE0);\n    outb(0x1F7, 0x20);  // cmd 0x20 - read sectors\n\
    \n    // Read data.\n    waitdisk();\n    insl(0x1F0, dst, SECTSIZE/4);\n}\n\n\
    // Read 'count' bytes at 'offset' from kernel into physical address 'pa'.\n//\
    \ Might copy more than asked.\nvoid\nreadseg(uchar* pa, uint count, uint offset)\n\
    {\n    uchar* epa;\n\n    epa = pa + count;\n\n    // Round down to sector boundary.\n\
    \    pa -= offset % SECTSIZE;\n\n    // Translate from bytes to sectors; kernel\
    \ starts at sector 1.\n    offset = (offset / SECTSIZE) + 1;\n\n    // If this\
    \ is too slow, we could read lots of sectors at a time.\n    // We'd write more\
    \ to memory than asked, but it doesn't matter --\n    // we load in increasing\
    \ order.\n    for(; pa < epa; pa += SECTSIZE, offset++)\n        readsect(pa,\
    \ offset);\n}\n```"
