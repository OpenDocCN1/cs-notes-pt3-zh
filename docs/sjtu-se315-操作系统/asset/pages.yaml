- pgno: 956
  md: "# Unlockset analysis\n\n+   - At statement S remove any lock L from lockset\
    \ if there exists no successor statement S’ reachable from S that contains an\
    \ unlock of L.\n\n```\n1: if(x)          {}\n2:     lock(a);    {a}\n3: if(x)\
    \           {a}\n4:     unlock(a); \n5: lock(b);        {a} → {}\n```\n\n+   -\
    \ Key: lockset holds exactly those locks the analysis can handle. Scales with\
    \ analysis sophistication."
  merge: -1
  img_proc: true
- pgno: 957
  md: '# Unlockset implementation sketch


    +   - Essentially compute reaching definitions

    +     - Run lockset analysis in reverse from leaves to roots

    +     - Unlockset holds all locks that will be released


    ```

    initial        ➔ unlockset = {}

    lock(l)        ➔ unlockset = unlockset - {l}

    unlock(l)      ➔ unlockset = unlockset ∪ {l}

    s.unlockset = s.unlockset ∪ unlockset

    ```


    +   - During lockset analysis:


    ```

    lockset = intersect(s.unlockset, lockset);

    ```


    +   - Main complication: function calls.

    +     - Different locks released after different callsites. Don’t want to mix
    these up (context sensitivity)'
  merge: -1
  img_proc: true
