  md: '# Happens-before Relation


    The happens-before relation is a means of ordering events based on the causal
    relationship of pairs of events in a concurrent system


    +   - denoted: →

    +   - Formulated by Leslie Lamport

    +   - strict partial order on events

    +   - without using physical clocks


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_911_0.png)'
  merge: -1
  img_proc: true
- pgno: 912
  md: '# Rules in HB Relation


    For the events A and B,


    **HB1**: On the same sequential thread,

    A→B if A executes before B.


    **HB2**: On the different threads,

    A→B if there is a synchronization that dictates A precedes B.


    **HB3**: If A→B and B→C then A→C


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_912_0.png)'
