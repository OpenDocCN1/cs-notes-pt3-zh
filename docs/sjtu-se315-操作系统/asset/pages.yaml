- pgno: 1065
  md: '# Review: Shadow Pages


    +   - Shadow Paging

    +     - VMM intercepts guest OS setting the virtual PTP register

    +     - VMM iterates over the guest page table, constructs a corresponding shadow
    PT

    +     - In shadow PT, every guest physical address is translated into host physical
    address

    +     - Finally, VMM loads the host physical address of the shadow PT

    +     - Shadow PT is per process'
  merge: -1
  img_proc: true
