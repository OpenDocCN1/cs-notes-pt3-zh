  md: "```\n```c\n// Atomically release lock and sleep on chan.\n// Requires lock\
    \ when awakened.\nvoid\nsleep(void *chan, struct spinlock *lk)\n{\n  if(proc ==\
    \ 0)\n    panic(\"sleep\");\n\n  if(lk == 0)\n    panic(\"sleep without lk\");\n\
    \n  // Must acquire ptable.lock in order to\n  // change p->state and then call\
    \ sched.\n  // Once we hold ptable.lock, we can be\n  // guaranteed that we won't\
    \ miss any wakeup\n  // (wakeup runs with ptable.lock locked),\n  // so it's okay\
    \ to release lk.\n  if(lk != &ptable.lock){  //DOC: sleeplock0\n    acquire(&ptable.lock);\
    \  //DOC: sleeplock1\n    release(lk);\n  }\n\n  // Go to sleep.\n  proc->chan\
    \ = chan;\n  proc->state = SLEEPING;\n  sched();\n\n  // Tidy up.\n  proc->chan\
    \ = 0;\n\n  // Reacquire original lock.\n  if(lk != &ptable.lock){  //DOC: sleeplock2\n\
    \    release(&ptable.lock);\n    acquire(lk);\n  }\n}\n```\n\n```c\n// Wake up\
    \ all processes sleeping on chan.\n// The ptable lock must be held.\nstatic void\n\
    wakeup1(void *chan)\n{\n  struct proc *p;\n\n  for(p = ptable.proc; p < &ptable.proc[NPROC];\
    \ p++)\n    if(p->state == SLEEPING && p->chan == chan)\n      p->state = RUNNABLE;\n\
    }\n\n// Wake up all processes sleeping on chan.\nvoid\nwakeup(void *chan)\n{\n\
    \  acquire(&ptable.lock);\n  wakeup1(chan);\n  release(&ptable.lock);\n}\n```\n\
    \n```\n\n# Sleep and Wakeup Mechanism in xv6"
