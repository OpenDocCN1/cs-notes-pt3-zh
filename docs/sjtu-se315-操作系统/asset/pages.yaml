- pgno: 483
  md: '# How Does User Deal with Timing?


    +   - **Blocking I/O:** “Wait”

    +     - When request data (e.g. read() system call), put process in waiting state
    until data is ready

    +     - When write data (e.g. write() system call), put process in waiting state
    until device is ready for data

    +   - **Non-blocking I/O:** “Don’t Wait”

    +     - Returns immediately from read or write request with count of bytes successfully
    transferred

    +     - Read may return nothing, write may write nothing

    +   - **Asynchronous I/O:** “Tell Me Later”

    +     - When request data, take pointer to user’s buffer, return immediately;
    later kernel fills buffer and notifies user

    +     - When send data, take pointer to user’s buffer, return immediately; later
    kernel takes data and notifies user'
  merge: -1
  img_proc: true
