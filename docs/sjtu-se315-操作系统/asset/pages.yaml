    \ = false;\n */\nvoid ticket_spin_lock_wait(arch_spinlock_t *lock, struct __raw_tickets\
    \ inc)\n{\n+    __ticket_t head = inc.head, ticket = inc.tail;\n+    __ticket_t\
    \ waiters_ahead;\n+    unsigned loops;\n+\n     for (;;) {\n-        cpu_relax();\n\
    -        inc.head = ACCESS_ONCE(lock->tickets.head);\n+        waiters_ahead =\
