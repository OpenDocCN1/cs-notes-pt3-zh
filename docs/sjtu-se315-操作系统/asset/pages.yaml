- pgno: 259
  md: '# Explanation


    +   - Intel’s manual 9.9.1

    +     - The JMP or CALL instruction immediately after the MOV CR0 instruction
    changes the flow of execution and serializes the processor.

    +   - Xv6-book-rev7

    +     - Enabling protected mode does not immediately change how the processor
    translates logical to physical addresses; it is only when one loads a new value
    into a segment register that the processor reads the GDT and changes its internal
    segmentation settings. One cannot directly modify %cs, so instead the code executes
    an ljmp (far jump) instruction (8453), which allows a code segment selector to
    be specified. The jump continues execution at the next line (8456) but in doing
    so sets %cs to refer to the code descriptor entry in gdt. That descriptor describes
    a 32-bit code segment, so the processor switches into 32-bit mode.'
