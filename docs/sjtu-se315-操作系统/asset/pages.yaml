- pgno: 949
  md: '# Lockset analysis


    +   - Lockset: set of locks currently held [Eraser]

    +     - For each root, do a flow-sensitive, inter-procedural DFS traversal computing
    lockset at each statement

    +       - initial ⇒ lockset = {}

    +       - lock(l) ⇒ lockset = lockset ∪ { l }

    +       - unlock(l) ⇒ lockset = lockset - { l }

    +     - Speed: If stmt s was visited before with lockset ls, stop.

    +   - Inter-procedural:

    +     - Routine can exit with multiple locksets: resume DFS w/ each after callsite.

    +     - Record <in-ls, {out-ls}> in fn summary. If ls in summary, grab cached
    out-ls’ s and skip fn body.'
  merge: -1
  img_proc: true
