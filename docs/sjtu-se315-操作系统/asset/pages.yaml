- pgno: 1107
  md: '# Device multiplexing:

    Single Root I/O Virtualization


    +   - Single Root I/O Virtualization (SR-IOV) is a Peripheral Component Interconnect
    Special Interest Group (PCI-SIG) specification.

    +   - SR-IOV provides a standard mechanism for devices to advertise their ability
    to be simultaneously shared among multiple virtual machines.

    +   - SR-IOV allows for the partitioning of a PCI function into many virtual interfaces
    for the purpose of sharing the resources of a PCI Express* (PCIe) device in a
    virtual environment.

    +   - With SR-IOV:

    +     - SI''s will get direct access to PCIe device functions

    +     - No more need for hypervisor (VI) to manage all system resources

    +   - PCIe devices will have multiple virtual functions (VF''s)

    +     - utilizable by multiple SI''s

    +     - a single SI may also use multiple virtual functions

    +   - Security of I/O Streams ensured by

    +     - Independency of control structures between VF''s within one PCIe device

    +     - I/O address translation services'
  merge: -1
  img_proc: true
