  md: "```\n```c\nvoid\nbootmain(void)\n{\n    struct elfhdr *elf;\n    struct proghdr\
    \ *ph, *eph;\n    void (*entry)(void);\n    uchar* pa;\n\n    elf = (struct elfhdr*)0x10000;\
    \  // scratch space\n\n    // Read 1st page off disk\n    readseg((uchar*)elf,\
    \ 4096, 0);\n\n    // Is this an ELF executable?\n    if(elf->magic != ELF_MAGIC)\n\
    \        return;  // let bootasm.S handle error\n\n    // Load each program segment\
    \ (ignores ph flags).\n    ph = (struct proghdr*)((uchar*)elf + elf->phoff);\n\
    \    eph = ph + elf->phnum;\n    for(; ph < eph; ph++){\n        pa = (uchar*)ph->paddr;\n\
