    51 // Allocate a zeroed disk block.

    52 static uint

    53 balloc(uint dev)

    54 {

    55     int b, bi, m;

    56     struct buf *bp;

    57     struct superblock sb;

    58

    59     bp = 0;

    60     readsbs(dev, &sb);

    61     for(b = 0; b < sb.size; b += BPB){

    62         bp = bread(dev, BBLOCK(b, sb.ninodes));

    63         for(bi = 0; bi < BPB && b + bi < sb.size; bi++){

    64             m = 1 << (bi % 8);

