- pgno: 647
  md: "# How to get better performance?\n\n# Reality\n\nRAM is cheap\n\ndisk sequential\
    \ throughput is high, 50 MB/sec (maybe someday solid state disks will change the\
    \ landscape)\n\n# Why not use a big write-back disk cache?\n\n+   *no* sync meta-data\
    \ update operations\n+   \n+   *only* modify in-memory disk cache (no disk write)\n\
    \n+   - so creat(), unlink(), write() &c return almost immediately\n+     bufs\
    \ written to disk later\n+   - if cache is full, write LRU dirty block\n+   -\
    \ write all dirty blocks every 30 seconds, to limit loss if crash\n+   - this\
    \ is how old Linux EXT2 file system worked"
  merge: -1
