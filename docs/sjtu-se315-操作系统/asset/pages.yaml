- pgno: 1050
  md: '# Virtualizing the CR3/Page Tables


    +   - Terminology: 3 types of address now

    +     - GVA->GPA->HPA (Guest virtual. Guest physical. Host physical)

    +     - Guest VM''s page table contains guest physical address

    +     - Hardware page table must point to host physical address

    +   - Setting CR3 to point to guest page table would not work

    +     - Processes in guest VM might access host physical address 0~1GB

    +     - But those HPA might not belong to that guest VM'
  merge: -1
  img_proc: true
- pgno: 1051
  md: '# One Solution: Shadow Pages


    +   1. VMM intercepts guest OS setting the virtual CR3

    +   2. VMM iterates over the guest page table, constructs a corresponding shadow
    PT

    +   3. In shadow PT, every guest physical address is translated into host physical
    address

    +   4. Finally, VMM loads the host physical address of the shadow PT

    +   (Shadow PT is per process)'
  merge: -1
  img_proc: true
- pgno: 1052
  md: "# Shadow Page Table\n\n| 31 | 12 | 11 | 9 | 8 | 7 | 6 | 5 | 4 | 3 | 2 | 1 |\
    \ 0 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| Physical-Page\
    \ Base Address | AVL | G | A | D | P | A | C | PWT | U/S | R/W | P | |\n\n```\n\
    set_ptp(guest_pt):\n    for gva in 0 .. 2^20:\n        if guest_pt[gva] & PTE_P:\n\
    \            gpa = guest_pt[gva] >> 12\n            hpa = host_pt[gpa] >> 12\n\
    \            shadow_pt[gva] = (hpa << 12) | PTE_P\n        else:\n           \
    \ shadow_pt[gva] = 0\n    PTP = shadow_pt\n```"
  merge: -1
  img_proc: true
