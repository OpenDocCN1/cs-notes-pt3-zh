- pgno: 761
  md: "# Xv6 locking\n\n```\n// Acquire the lock.\n// Loops (spins) until the lock\
    \ is acquired.\n// Holding a lock for a long time may cause\n// other CPUs to\
    \ waste time spinning to acquire it.\nvoid\nacquire(struct spinlock *lk)\n{\n\
    \  pushcli(); // disable interrupts to avoid deadlock.\n  if(holding(lk))\n  \
    \  panic(\"acquire\");\n\n  // The xchg is atomic.\n  // It also serializes, so\
    \ that reads after acquire are not\n  // reordered before it.\n  while(xchg(&lk->locked,\
    \ 1) != 0)\n    ;\n\n  // Record info about lock acquisition for debugging.\n\
    \  lk->cpu = cpu;\n  getcallerpcs(&lk, lk->pcs);\n}\n\n// Release the lock.\n\
    void\nrelease(struct spinlock *lk)\n{\n  if(!holding(lk))\n    panic(\"release\"\
    );\n\n  lk->pcs[0] = 0;\n  lk->cpu = 0;\n\n  // The xchg serializes, so that reads\
    \ before release are\n  // not reordered after it. The 1996 PentiumPro manual\
    \ (Volume 3,\n  // 7.2) says reads can be carried out speculatively and in\n \
    \ // any order, which implies we need to serialize here.\n  // But the 2007 Intel\
    \ 64 Architecture Memory Ordering White\n  // Paper says that Intel 64 and IA-32\
    \ will not move a load\n  // after a store. So lock->locked = 0 would work here.\n\
    \  // The xchg being asm volatile ensures gcc emits it after\n  // the above assignments\
    \ (and after the critical section).\n  xchg(&lk->locked, 0);\n\n  popcli();\n\
    }\n```"
  merge: -1
  img_proc: true
