  md: '# The RacerX experience


    +   - How to use:

    +     - List locking functions & entry points. Small:

    +       - Linux: 18 + 31, FreeBSD: 30 + 36, System X: 50 + 52

    +     - Emit trees from source code (2x cost of compile)

