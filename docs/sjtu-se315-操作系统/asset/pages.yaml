- pgno: 921
  md: '# Lockset


    # Locking Discipline


    +   - A programming policy that ensures the absence of data races

    +     - e.g. “every variable shared between threads is protected by a mutual exclusion
    lock”


    # Principle


    +   - Check all shared memory accesses follow a consistent lock discipline

    +     - monitors all reads and writes, and infer the protection relation from
    the execution history'
  merge: -1
  img_proc: true
- pgno: 922
  md: '# Algorithm of Lockset


    The summary:


    +   1. Let locks_held(t) be the set of locks held by thread t

    +   2. For each v, initialize C(v) to the set of all locks

    +   3. On each access to v by thread t, set C(v) := C(v) ∩ locks_held(t) if C(v)={
    }, then issue a warning'
  merge: -1
  img_proc: true
- pgno: 923
  md: '# Example


    | Programs | locks_held(t) | C(v) |

    |---|---|---|

    | lock(mu1); | { } | {mu1, mu2} |

    | lock(mu2); | {mu1} | |

    | v = v + 1; | {mu1, mu2} | {mu1, mu2} |

    | unlock(mu2); | | |

    | v = v + 2; | {mu1} | {mu1} |

    | unlock(mu1); | | |

    | lock(mu2); | { } | |

    | v = v + 1; | {mu2} | { } Warning!! |

    | unlock(mu2); | | |'
  merge: -1
  img_proc: true
