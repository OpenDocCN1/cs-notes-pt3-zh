- pgno: 432
  md: '# Three crucial data-structures


    +   - The Global Descriptor Table (GDT)

    +     defines the system’s memory-segments and their access-privileges, which
    the CPU has the duty to enforce

    +   - The Interrupt Descriptor Table (IDT)

    +     defines entry-points for the various code-routines that will handle all
    ‘interrupts’ and ‘exceptions’

    +   - The Task-State Segment (TSS)

    +     holds the values for registers SS and ESP that will get loaded by the CPU
    upon entering kernel-mode'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# How does CPU find GDT/IDT?


    +   - Two dedicated registers: GDTR and IDTR

    +   - Both have identical 48-bit formats:


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_433_0.png)


    Kernel must setup these registers during system startup (set-and-forget)


    Privileged instructions: LGDT and LIDT used to set these register-values

    Unprivileged instructions: SGDT and SIDT used for reading register-values'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# How does CPU find the TSS?


    +   - Dedicated system segment-register TR holds a descriptor’s offset into the
    GDT


    The kernel must set up the GDT and TSS structures and must load the GDTR and the
    TR registers


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_434_0.png)


    The CPU knows the layout of fields in the Task-State Segment'
  merge: -1
