- pgno: 436
  md: '# Summary: Interrupts vs Exceptions


    +   - Varying terminology but for Intel:

    +     - **Interrupt** (asynchronous, device generated)

    +       - Maskable: device-generated, associated with IRQs (interrupt request
    lines); may be temporarily disabled (still pending)

    +       - Nonmaskable: some critical hardware failures

    +     - **Exceptions** (synchronous, from software)

    +       - Processor-detected

    +         - Faults – correctable (restartable); e.g. page fault

    +         - Traps – no reexecution needed; e.g. breakpoint

    +         - Aborts – severe error; process usually terminated (by signal)

    +       - Programmed exceptions (**software interrupts**)

    +         - int (system call), int3 (breakpoint)

    +         - into (overflow), bounds (address check)'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Interrupt Handling Philosophy


    +   - Do as little as possible in the interrupt handler

    +   - Defer non-critical actions till later

    +   - Structure: top and bottom halves

    +     - Top-half: do minimum work and return (ISR)

    +     - Bottom-half: deferred processing (softirqs, tasklets, workqueues, kernel
    threads)


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_437_0.png)'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Top Half: Do it Now!


    +   - Technically *is* the interrupt handler

    +   - Perform minimal, common functions: save registers, unmask *other* interrupts.
    Eventually, undoes that: restores registers, returns to previous context.

    +     - Often written in assembler

    +   - IRQ is typically masked for duration of top half

    +   - Most important: call proper interrupt handler provided in device drivers
    (C program)

    +   - Don’t want to do too much here

    +     - IRQs are masked for part of the time

    +     - Don''t want stack to get too big

    +   - Typically queue the request and set a flag for deferred processing in a
    bottom half'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# Top Half: Find the Handler


    +   - On modern hardware, multiple I/O devices can share a single IRQ and hence
    interrupt vector

    +   - First differentiator is the interrupt *vector*

    +   - Multiple *interrupt service routines* (ISR) can be associated with a vector

    +   - Each device’s ISR for that IRQ is called

    +   - Device determines whether IRQ is for it'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Bottom Half: Do it Later!


    +   - Mechanisms to defer work to later:

    +     - *softirqs*

    +     - *tasklets* (built on top of softirqs)

    +     - *work queues*

    +     - *kernel threads*

    +   - All can be interrupted


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_440_0.png)'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# Warning: No Process Context


    +   - Interrupts (as opposed to exceptions) are not associated with particular
    instructions

    +   - They’re also not associated with a given process (user program)

    +   - The currently-running process, at the time of the interrupt, as no relationship
    whatsoever to that interrupt

    +   - Interrupt handlers cannot sleep!'
  merge: -1
  img_proc: true
