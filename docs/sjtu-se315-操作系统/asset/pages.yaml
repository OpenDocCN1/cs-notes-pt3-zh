    +   - Two writes succeed and the last one fails:

    +   - 1. The inode (I[v2]) and bitmap (B[v2]) are written to disk, but not data
    (Db)

    +   - 2. The inode (I[v2]) and the data block (Db) are written, but not the bitmap
    (B[v2])

    +   - 3. The bitmap (B[v2]) and data block (Db) are written, but not the inode
    (I[v2])'
