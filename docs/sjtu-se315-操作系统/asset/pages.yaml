- pgno: 925
  md: '# Solution to #1 and #2


    Delay the refinement until the shared variable has been initialized


    +   - No easy way to know when initialization is done

    +   - Heuristic way: the first time to be accessed by the 2nd thread'
  merge: -1
  img_proc: true
- pgno: 926
  md: '# Solution to #1 and #2


    1.

    Virgin


    read or write by 1st thread


    1.

    the variable is NEW and has not yet been referenced by any thread.


    2.

    Exclusive


    2.

    the variable has been accessed by ONE thread only. Not update C(v)


    read by new thread


    3.

    C(v) is updated, but data races are NOT reported even if C(v) is empty.


    3.

    Shared


    read


    write


    write by new thread


    4.

    Shared-Modified


    read or write


    4.

    C(v) is updated, and data races are reported if C(v) is empty.'
  merge: -1
  img_proc: true
- pgno: 927
  md: '# Solution to #3


    # Modify the algorithm:


    +   1. Let locks_held(t) and write_locks_held(t) be the set of locks held in any
    mode and write mode by thread t


    +   2. For each v, initialize Cr(v) and Cw(v) to the set of all locks


    +   3. On each read to v by thread t, set Cr(v) := Cr(v) ∩ locks_held(t) if Cr(v)={
    }, then issue a warning


    +   4. On each write to v by thread t, set Cw(v) := Cw(v) ∩ write_locks_held(t)
    if Cw(v)={ }, then issue a warning'
  merge: -1
  img_proc: true
