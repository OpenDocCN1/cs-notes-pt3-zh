- pgno: 901
  md: '# Data Race


    An undesirable situation that occurs when a device or system attempts to perform
    two or more operations at the same time, but the operations must be done in the
    proper sequence in order to be done correctly


    +   - multithread

    +   - distributed Programs


    # Key reason


    +   - separate processes or threads of execution depends on same shared state'
