- pgno: 1076
  md: '# VT-x extension: Extended Page Table (EPT)


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_1076_0.png)


    All guest-physical addresses go through extended page tables


    Includes address in CR3, address in PDE, address in PTE, etc.


    Reduces the frequency of VM exits to VMM.


    The net effect of both implementations (EPT or NPT) is to allow the guest OS to
    own and manage its own page table, and not force the host to get involved.'
