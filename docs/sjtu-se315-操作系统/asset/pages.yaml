- pgno: 1025
  md: '# x86 virtualization challenge


    +   - The IA-32 instruction set contains 17 sensitive, unprivileged instructions:

    +     - Sensitive register instructions: read or change sensitive registers and/or
    memory locations such as a clock register or interrupt registers:

    +       - SGDT, SIDT, SLDT, SMSW, PUSHF, POPF

    +     - Protection system instructions: reference the storage protection system,
    memory or address relocation system:

