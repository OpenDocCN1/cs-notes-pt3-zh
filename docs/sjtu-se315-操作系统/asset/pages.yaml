- pgno: 591
  md: '# Metadata Files in MFT


    | System File | Name | Rec | Purpose of File |

    |---|---|---|---|

    | Master File Table | $Mft | 0 | Contains file record for each file and folder
    on a NTFS volume. |

    | Master File Table Mirror | $MftMirr | 1 | Duplicate image of the first four
    records of MFT |

    | Log File | $LogFile | 2 | Restores metadata for fast recovery |

    | Volume File | $Volume | 3 | Contains information about the volume |

    | Attribute Definitions | $AttrDef | 4 | Lists attribute names, numbers, and descriptions
    |

    | Root File Name Index | . | 5 | The root file |

    | Cluster Bitmap | $Bitmap | 6 | Represents the volume by showing free and unused
    clusters. |'
  merge: -1
  img_proc: true
