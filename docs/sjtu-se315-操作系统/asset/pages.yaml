- pgno: 403
  md: '# System Call


    +   1. Fetch the *n*''th descriptor from the IDT, where *n* is the argument of
    int.

    +   2. Check that CPL in %cs is <= DPL, where DPL is the privilege level in the
    descriptor.

    +   3. Save %esp and %ss in a CPU-internal registers, but only if the target segment
    selector’s PL < CPL.

    +   4. Load %ss and %esp from a task segment descriptor.

    +   5. Push %ss, %esp, %eflags, %cs, %eip,

    +   6. Clear some bits of %eflags

    +   7. Set %cs and %eip to the values in the descriptor'
