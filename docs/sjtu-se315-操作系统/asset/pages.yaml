  md: "# ELF Header :\n\nELF header resides at the beginning and holds a road map\
    \ describing the files organization\n\n```\n#define EI_NIDENT 16\ntypedef struct\
    \ {\n    unsigned char e_ident [EI_NIDENT];\n    Elf32_Half e_type;\n    Elf32_Half\
    \ e_machine ;\n    Elf32_Word e_version ;\n    Elf32_Addr e_entry ;\n    Elf32_Off\
    \ e_phoff;\n    Elf32_Off e_shoff;\n    Elf32_Word e_flags ;\n    Elf32_Half e_ehsize\
    \ ;\n    Elf32_Half e_phentsize ;\n    Elf32_Half e_phnum ;\n    Elf32_Half e_shentsize\
    \ ;\n    Elf32_Half e_shnum ;\n    Elf32_Half e_shstrndx ;\n}Elf32_Ehdr ;\n```\n\
    \ne_machine : specifies the required architecture :0 = No machine ... 3 = Intel\
    \ 80386 4 = Motorola 68000 ...8 = MIPS RS3000\n\ne_entry : the virtual address\
    \ to which the system first transfers control, when starting the process. If the\
    \ file has no associated entry point, this member holds zero.\n\ne_shoff : holds\
    \ the section header table’s file offset in bytes. If the file has no section\
    \ header table, this member holds zero.\n\n| Name | Size | Alignment | Purpose\
    \ |\n|---|---|---|---|\n| Elf32_Addr | 4 | 4 | Unsigned program address |\n| Elf32_Half\
    \ | 2 | 2 | Unsigned medium integer |\n| Elf32_Off | 4 | 4 | Unsigned file offset\
    \ |\n| Elf32_Sword | 4 | 4 | Signed large integer |\n| Elf32_Word | 4 | 4 | Unsigned\
