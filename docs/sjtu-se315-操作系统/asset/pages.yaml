- pgno: 424
  md: '# Maximizing Parallelism


    +   - You want to keep all I/O devices as busy as possible

    +   - In general, an I/O interrupt represents the end of an operation; another
    request should be issued as soon as possible

    +   - Most devices don’t interfere with each others’ data structures; there’s
    no reason to block out other devices'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# Handling Nested Interrupts


    +   - As soon as possible, unmask the global interrupt

    +   - As soon as reasonable, re-enable interrupts from that IRQ

    +   - But that isn’t always a great idea, since it could cause re-entry to the
    same handler

    +   - IRQ-specific mask is not enabled during interrupt-handling'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# Nested Execution


    +   - Interrupts can be interrupted

    +     - By different interrupts; handlers need not be reentrant

    +     - Small portions execute with interrupts disabled

    +     - Interrupts remain pending until acked by CPU

    +   - Exceptions can be interrupted

    +     - By interrupts (devices needing service)

    +   - Exceptions can nest two levels deep

    +     - Exceptions indicate coding error

    +     - Exception code (kernel code) shouldn’t have bugs

    +     - Page fault is possible (trying to touch user data)'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# Interrupt Masking


    +   - Two different types: global and per-IRQ

    +     - Global — delays all interrupts

    +     - Selective — individual IRQs can be masked selectively

    +     - Selective masking is usually what’s needed — interference most common
    from two interrupts of the same type

    +   - NMI (Non-Maskable Interrupt)'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Triple Fault


    +   - Things never to do in an OS #1: Swap out the page swapping code (triple-fault
    here we come) —Kemp

    +   - When a fault occurs, the CPU invokes an exception handler.

    +   - If a fault occurs while trying to invoke the exception handler, that''s
    called a double fault, which the CPU tries to handle with yet another exception
    handler.

    +   - If that invocation results in a fault too, the system reboots with a triple
    fault.'
  merge: -1
  img_proc: true
