- pgno: 933
  md: '# Four requirements for Deadlock


    # Mutual exclusion


    Only one thread at a time can use a resource.


    # Hold and wait


    Thread holding at least one resource is waiting to acquire additional resources
    held by other threads


    # No preemption


    Resources are released only voluntarily by the thread holding the resource, after
    thread is finished with it


    # Circular wait


    There exists a set {T1, ..., Tn} of waiting threads


    +   - T1 is waiting for a resource that is held by T2

    +   - T2 is waiting for a resource that is held by T3

    +   - ...

    +   - Tn is waiting for a resource that is held by T1'
  merge: -1
  img_proc: true
- pgno: 934
  md: '# A Graph Theoretic Model of Deadlock


    Basic components of any resource allocation problem


    Processes and resources


    Model the state of a computer system as a directed graph (called resource allocation
    graph, or RAG)


    G = (V, E)


    V = the set of vertices = {P₁, ..., Pₙ} ∪ {R₁, ..., Rₘ}


    E = the set of edges = {edges from a resource to a process} ∪ {edges from a process
    to a resource}


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_934_0.png)


    ![](img/53ee1e3b0eba43505c7d530851f32f6f_934_1.png)'
