- pgno: 952
  md: '# Big picture: Deadlock detection


    +   - Pass 1: constraint extraction

    +     - emit 1-level locking dependencies during lockset analysis

    +       `lock(a); lock(b);` → “a→b”   `lock(b); lock(a);` → “b→a”

    +   - Pass 2: constraint solving

    +     - Compute transitive closure & flag cycles.

    +     - “a→b→a” : T1 acquires a, T2 acquires b, boom.

    +   - Ranking:

    +     - Global locks over local

    +     - Depth of callchain & number of conditionals (less better)

    +     - Number of threads involved (fewer MUCH better)'
  merge: -1
  img_proc: true
- pgno: 953
  md: "# Simplest deadlock example\n\n```\n// 2.5.62/drivers/char/rtc.c\nint rtc_register(rtc_task_t\
    \ **task) {\n  spin_lock_irq(&rtc_lock);\n  //...\n  spin_lock(&rtc_task_lock);\n\
    \  if (rtc_callback) {\n    spin_unlock(&rtc_task_lock);\n    spin_unlock_irq(&rtc_lock);\n\
    \  }\n}\n```\n\n```\n//2.5.62/drivers/char/rtc.c\nrtc_unregister(rtc_task_t **task)\n\
    {\n  spin_lock_irq(&rtc_task_lock);\n  //...\n  spin_lock(&rtc_lock);\n}\n```\n\
    \n+   - Constraint extraction emits “rtc_lock→rtc_task_lock” and “rtc_task_lock→rtc_lock”\n\
    +   - Constraint solving flags cycle: T1 acquires rtc_lock, T2 acquires rtc_task_lock.\
    \ Boom.\n+   - Ranked high: only two threads, global locks, local error."
  merge: -1
  img_proc: true
- pgno: 954
  md: '# False positive trouble


    +   - Most FPs from bogus locks in lockset

    +     - Typically caused by mishandled data dependencies

    +   - Oversimplified typical example

    +     - Naïve analysis will think four paths rather than two, including false
    one that holds lock a at line 5.

    +     - Inter-procedural analysis makes this much worse.

    +     - Could add path-sensitivity, but undecidable in general


    ```

    1: if(x)       {}

    2:   lock(a);   {a}

    3: if(x)        {a}

    4:   unlock(a);

    5: lock(b);     {a}  “a→b”

    ```'
  merge: -1
  img_proc: true
