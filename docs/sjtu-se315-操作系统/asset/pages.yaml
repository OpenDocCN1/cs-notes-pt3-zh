- pgno: 1074
  md: '# Virtual Machine Control Structure (VMCS)


    Data structure that manages VM entries and VM exits.


    VMCS is logically divided into:


    +   - Guest-state area

    +   - Host-state area.

    +   - VM-execution control fields

    +   - VM-exit control fields

    +   - VM-entry control fields

    +   - VM-exit information fields


    VM entries load processor state from the guest-state area.


    VM exits save processor state to the guest-state area and the exit reason, and
    then load processor state from the host-state area.'
  merge: -1
  img_proc: true
