- pgno: 1020
  md: '# Virtualizing the System ISA


    +   - Hardware needed by monitor

    +     - Ex: monitor must control real hardware interrupts

    +   - Access to hardware would allow VM to compromise isolation boundaries

    +     - Ex: access to MMU would allow VM to write any page

    +   - So...

    +     - All access to the virtual System ISA by the guest must be emulated by
    the monitor in software.

    +     - System state kept in memory.

    +     - System instructions are implemented as functions in the monitor.'
  merge: -1
  img_proc: true
- pgno: 1021
  md: "# Example: CPUState\n\n```\nstatic struct {\n    uint32 GPR[16];\n    uint32\
    \ LR;\n    uint32 PC;\n    int    IE;\n    int    IRQ;\n} CPUState;\n\nvoid CPU_CLI(void)\n\
    {\n    CPUState.IE = 0;\n}\n\nvoid CPU_STI(void)\n{\n    CPUState.IE = 1;\n}\n\
    ```\n\n+   - Goal for CPU virtualization techniques\n+     - Process normal instructions\
    \ as fast as possible\n+     - Forward privileged instructions to emulation routines"
