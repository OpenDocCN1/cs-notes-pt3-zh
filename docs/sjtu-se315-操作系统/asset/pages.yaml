- pgno: 62
  md: '# Why distributed systems?

    for ease-of-use


    Handle geographic separation


    Provide users (or applications) with location transparency:


    +   Web: access information with a few “clicks”

    +   Network file system: access files on remote servers as if they are on a local
    disk, share files among multiple computers'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Why distributed systems?

    for availability


    Build a reliable system out of unreliable parts


    +   - Hardware can fail: power outage, disk failures, memory corruption, network
    switch failures...

    +   - Software can fail: bugs, mis-configuration, upgrade ...

    +   - To achieve 99.999% availability, replicate data/computation on many hosts
    with automatic failover'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Why distributed systems?

    for scalable capacity


    Aggregate resources of many computers


    +   - CPU: Dryad, MapReduce, Grid computing

    +   - Bandwidth: Akamai CDN, BitTorrent

    +   - Disk: Frangipani, Google file system'
  merge: -1
  img_proc: true
