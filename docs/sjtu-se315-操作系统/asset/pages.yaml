    12

    13 # Save old callee-save registers

    14 pushl %ebp

    15 pushl %ebx

    16 pushl %esi

    17 pushl %edi

    18

    19 # Switch stacks

    20 movl %esp, (%eax)

    21 movl %edx, %esp

    22

    23 # Load new callee-save registers

    24 popl %edi

    25 popl %esi

    26 popl %ebx

    27 popl %ebp

    28 ret

