- pgno: 610
  md: '# Virtual File System Interface


    +   - Problem: the OS may mount several partitions containing different underlying
    file systems

    +     - It would be bad if processes had to use different APIs for different file
    systems

    +   - Linux uses a Virtual File System interface (VFS)

    +     - Exposes POSIX APIs to processes

