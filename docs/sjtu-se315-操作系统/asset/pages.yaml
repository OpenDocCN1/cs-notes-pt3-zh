- pgno: 163
  md: '# Motivation


    # Exokernel’s Motivation


    In traditional operating systems, *only* <u>privileged servers</u> and <u>the
    kernel</u> can manage system resources


    Un-trusted applications are required to interact with the hardware via some <u>abstraction
    model</u>


    *File systems* for disk storage, *virtual address spaces* for memory, etc.


    # Application demands vary widely!!


    An interface designed to accommodate every application must anticipate **all possible
    needs**'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Exokernel’s Idea


    Give un-trusted applications as **much control** over physical resources as possible


    To force as **few abstraction** as possible on developers, enabling them to make
    as **many decisions** as possible about hardware abstractions.


    +   - Let *the kernel* allocate the basic physical resources of the machine

    +   - Let *each program* decide what to do with these resources


    Exokernel separate *protection* from *management*


    +   - They **protect** resources but delegate **management** to application'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Library Operating System


    Most programs to be linked with *libraries* instead of communicating with the
    exokernel directly


    The libraries hide low-level resources


    An applications can choose the library which best suits its needs, or even build
    its own


    The kernel only ensures that the requested resource is free, and the application
