  md: '# Motivation


    # Exokernel’s Motivation


    In traditional operating systems, *only* **privileged servers** and **the kernel**
    can manage system resources


    Un-trusted applications are required to interact with the hardware via some **abstraction
    model**


    *File systems* for disk storage, *virtual address spaces* for memory, etc.


    Application demands vary widely!!


    An interface designed to accommodate every application must anticipate **all possible
    needs**'
