  md: '# Data Race


    ```

    v = 0

    ```


    ```

    [thread-1]

    %reg = v;

    %reg++;

    v = %reg;

    ```


    ```

    [thread-2]

    %reg = v;

    %reg++;

    v = %reg;

    ```


    ```

    v = ?

    ```


    v = 0 (memory)


    ```

    T1 reads 0 to %reg

    T1 increments %reg to 1

    T1 stores %reg to v (v = 1)

    T2 reads 1 to %reg

    T2 increments %reg to 2

    T2 stores %reg to v (v = 2)

    ```


    v = 2; (memory)'
