- pgno: 407
  md: '# Intel-Reserved ID-Numbers


    +   - Of the 256 possible interrupt ID numbers, Intel reserves the first 32 for
    ‘exceptions’

    +   - OS’s such as Linux are free to use the remaining 224 available interrupt
    ID numbers for their own purposes (e.g., for service-requests from external devices,
    or for other purposes such as system-calls)

    +   - Examples:

    +     - 0: divide-overflow fault

    +     - 6: Undefined Opcode

    +     - 7: Coprocessor Not Available

    +     - 11: Segment-Not-Present fault

    +     - 12: Stack fault

    +     - 13: General Protection Exception

    +     - 14: Page-Fault Exception'
