- pgno: 107
  md: "```\n```asm\n# Start the first CPU: switch to 32-bit protected mode, jump into\
    \ C.\n# The BIOS loads this code from the first sector of the hard disk into\n\
    # memory at physical address 0x7c00 and starts executing in real mode\n# with\
    \ %cs=0 %ip=7c00.\n\n.code16                              # Assemble for 16-bit\
    \ mode\n.globl start\nstart:\n    cli                              # BIOS enabled\
    \ interrupts; disable\n\n    # Zero data segment registers DS, ES, and SS.\n \
    \   xorw    %ax,%ax                  # Set %ax to zero\n    movw    %ax,%ds  \
    \                # -> Data Segment\n    movw    %ax,%es                  # ->\
    \ Extra Segment\n    movw    %ax,%ss                  # -> Stack Segment\n\n \
    \   # Physical address line A20 is tied to zero so that the first PCs\n    # with\
    \ 2 MB would run software that assumed 1 MB. Undo that.\nseta20.1:\n    inb  \
    \   $0x64,%al                # Wait for not busy\n    testb   $0x2,%al\n    jnz\
    \     seta20.1\n\n    movb    $0xd1,%al                # 0xd1 -> port 0x64\n \
    \   outb    %al,$0x64\n\nseta20.2:\n    inb     $0x64,%al                # Wait\
    \ for not busy\n    testb   $0x2,%al\n    jnz     seta20.2\n\n    movb    $0xdf,%al\
    \                # 0xdf -> port 0x60\n    outb    %al,$0x60\n```\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: '```

    # Switch from real to protected mode. Use a bootstrap GDT that makes

    # virtual addresses map directly to physical addresses so that the

    # effective memory map doesn''t change during the transition.

    lgdt gdt desc

    movl %cr0, %eax

    orl $CR0_PE, %eax

    movl %eax, %cr0


    //PAGEBREAK!

    # Complete transition to 32-bit protected mode by using long jmp

    # to reload %cs and %eip. The segment descriptors are set up with no

    # translation, so that the mapping is still the identity mapping.

    ljmp $(SEG_KCODE<<3), $start32


    .code32 # Tell assembler to generate 32-bit code now.

    start32:

    # Set up the protected-mode data segment registers

    movw $(SEG_KDATA<<3), %ax # Our data segment selector

    movw %ax, %ds # -> DS: Data Segment

    movw %ax, %es # -> ES: Extra Segment

    movw %ax, %ss # -> SS: Stack Segment

    movw $0, %ax # Zero segments not ready for use

    movw %ax, %fs # -> FS

    movw %ax, %gs # -> GS


    # Set up the stack pointer and call into C.

    movl $start, %esp

    call bootmain

    ```'
