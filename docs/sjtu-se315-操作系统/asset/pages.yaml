- pgno: 128
  md: "```\n# Start the first CPU: switch to 32-bit protected mode, jump into C.\n\
    # The BIOS loads this code from the first sector of the hard disk into\n# memory\
    \ at physical address 0x7c00 and starts executing in real mode\n# with %cs=0 %ip=7c00.\n\
    \n.code16              # Assemble for 16-bit mode\n.globl start\nstart:\n    cli\
    \                 # BIOS enabled interrupts; disable\n\n    # Zero data segment\
    \ registers DS, ES, and SS.\n    xorw    %ax,%ax        # Set %ax to zero\n  \
    \  movw    %ax,%ds        # -> Data Segment\n    movw    %ax,%es        # -> Extra\
    \ Segment\n    movw    %ax,%ss        # -> Stack Segment\n\n    # Physical address\
    \ line A20 is tied to zero so that the first PCs\n    # with 2 MB would run software\
    \ that assumed 1 MB. Undo that.\nseta20.1:\n    inb    $0x64,%al       # Wait\
    \ for not busy\n    testb  $0x2,%al\n    jnz    seta20.1\n\n    movb   $0xd1,%al\
    \       # 0xd1 -> port 0x64\n    outb   %al,$0x64\n\nseta20.2:\n    inb    $0x64,%al\
    \       # Wait for not busy\n    testb  $0x2,%al\n    jnz    seta20.2\n\n    movb\
    \   $0xdf,%al       # 0xdf -> port 0x60\n    outb   %al,$0x60\n```"
  merge: -1
