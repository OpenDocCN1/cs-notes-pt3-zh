    # 职业兴趣报告


    六边形代表的六种兴趣类型的含义是：


    # 根据你最强的兴趣，可见你的特点是：


    # 根据你最弱的兴趣，提醒你要避免自己不怎么感兴趣的事：


    你对经济性事务不感兴趣，不好说服、影响和领导他人，因此，在职业生涯规划过程中，你可能要避免一些对领导力要求较高的发展方向，如经营管理、政府官员、外事外交等。


    也许通过以上的描述，你对自己的兴趣仍然不强，那么你还可以通过分析日常生活中的表现来进一步理解或者发掘自己的兴趣倾向，这里推荐一些小方法给你：


    +   - 分析你平时关注和喜欢的书籍、网页、读物的内容，探寻最本质主题。

    +   - 反思你平时喜欢的活动，你所看重的它的原因究竟是什么。

    +   - 询问或收集你身边的人，比如朋友、老师、家长等对你的兴趣爱好的评价。

    +   - 扪心自问：如果你的无法获得胜利的成就感，在空闲的时间里，你也愿意一再投入自己的精力，反复为之不厌其烦的事是什么？


    探究自己兴趣爱好的方法还有很多，你可以不断挖掘。但要提醒你的，是：职业兴趣类型没有好坏之分，不需要故意地形成好恶。每种兴趣都有适合的工作环境，也都有自己的特点和不足。每个人都可能将他的兴趣和工作结合起来发挥自身的价值，你能做到的是：了解自己的兴趣特点，将其发挥到极致！'
