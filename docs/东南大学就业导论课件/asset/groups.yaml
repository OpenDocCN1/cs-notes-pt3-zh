    ## 第七讲 决策


    ## 系统的职业规划方法


    ![](img/c049f03a753af28f4965561c0dbd43b8_244_0.png)


    ## 教学目标


    ## 技能目标：


    - ➢ 明确自己在职业规划过程中可能出现的障碍并掌握两种常用的压力应对方法

    - ➢ 能够辨认自己在重大问题上常用的决策风格，掌握计划型的决策方法

    - ➢ 掌握正确的目标设立方法，能够为自己的生涯发展设立长远和近期目标并做出相应的行动计划


    ## 目录


    - - 决策的定义

    - - 影响职业决策的因素

    - - 理性决策的方法

    - - 分享与练习


    ## 什么是决策？


    决策是根据所获信息做出选择的过程，任何决策都是承前启后的。

    ——《咨询词典》


    生涯决策就是个人在多项选择之间权衡利弊，以达成最大价值的历程。

    ——《生涯心理辅导》


    ## 目录


    - > 决策的定义

    - > 影响职业决策的因素

    - > 理性决策的方法

    - > 分享与练习


    ## 职业阻碍


    ➤ **职业阻碍**就是任何使人难以实现某一职业目标的障碍或挑战，它又分为内部阻碍和外部阻碍。


    —[内部阻碍](#)就是那些存在于我们自身的障碍，通常我们对之有较大的控制力，比如，焦虑、犹豫等。


    —[外部阻碍](#)则来自于外界，往往是我们难以控制的，但我们往往把外部阻碍想象得过多过大（这是我们的内部阻碍）。


    ## 生涯决策中的不合理信念


    - > 一旦下了决定就不能再改变

    - > 每个人终身只能有一个适合的职业

    - > 不能做出决定，说明自己不够成熟

    - > 我会按照家人或者老师的期待去做出决策

    - > 只要有兴趣，我就一定能成功

    - > 我的决策必须是十全十美的

    - > 世界变化太快，“计划未来”没有意义

    - > 工作是实现自我的唯一途径

    - > 身为男人/女人，我应该做……


    ![](img/c049f03a753af28f4965561c0dbd43b8_251_0.png)


    ## 目录


    - ➢ 决策的定义

    - ➢ 影响职业决策的因素

    - ➢ 理性决策的方法

    - ➢ 分享与练习


    ![](img/c049f03a753af28f4965561c0dbd43b8_252_0.png)


    ## 个人的决策回忆


    请回想迄今为止在你人生中的三次重大决定，并挑选其中一件按以下提纲予以描述：


    - 1. 目标或当时的情境

    - 2. 你所有的选择

    - 3. 你的决策方式

    - 4. 你作出的选择

    - 5. 对结果的评估


    ![](img/c049f03a753af28f4965561c0dbd43b8_253_0.png)


    总结一下自己在做决策时有什么特点。


    ## 影评


    开场的几个桥段（包括出糗的场景）发生在两位主角相互较劲之时。在科技逐渐主宰人际关系的近未来背景下，影片以讽刺而轻松的手法探讨了数字时代中的友谊、爱情与孤独。


    导演成功地在纯粹的喜剧片段与更具反思性的段落之间取得平衡，这得益于默契十足的演员阵容，以及巧妙配合情节发展的配乐。剧本虽然在中段有些节奏上的松弛，但贡献了不少精彩的对话和可信的情境。


    出人意料又令人动容的结局留给观众许多思考空间，也证实了这部作品是该类型中最成功的作品之一。推荐给那些寻求有内涵、能在不流于俗套的情况下打动人心的娱乐作品的人。


