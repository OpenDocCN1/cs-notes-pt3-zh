    # 成功故事范例


    这学期，作为师范生的必要培训内容之一，教学技能培训课要求我们自选题目并用PPT进行一次演示讲解。


    在此之前，我没有学过如何制作PPT。


    我请同宿舍的一位同学用了一大约二十分钟的时间教我PowerPoint软件的基本使用方法，我又自己在学校的电脑机房琢磨了一下，并向机房的管理人员请教了几个不明白的问题。选定了我要讲的题目以后，我上网搜索了相关的资料和图片，然后制作了十分钟课程的辅助教学PPT。


    在课堂讲解演示中，由于我制作的PPT图片精美、文字与内容搭配得宜，获得了95分的高分，得到了老师和同学的称赞。'
