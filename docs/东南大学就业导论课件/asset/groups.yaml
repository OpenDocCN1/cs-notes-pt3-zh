    +   > 通过简单的5个步骤来找到适合自己性格的职业。\n\n![](img/c049f03a753af28f4965561c0dbd43b8_188_0.png)\n\
    \n## For Talent Forward\n\n## Beisen 北森\n人为本 才善用\n\n![](img/c049f03a753af28f4965561c0dbd43b8_190_0.png)\n\
    \n## 第六讲 探索工作世界\n\n## 活动一下\n\n![](img/c049f03a753af28f4965561c0dbd43b8_192_0.png)\n\
    \n双关图\n\n## 温故知新：自我探索\n\n![](img/c049f03a753af28f4965561c0dbd43b8_193_0.png)\n\
    \n+   > 兴趣-快乐/... 平衡\n+   > 价值观-满足/纠结-取舍\n+   > 技能-成功/...力-实践\n+   > 性格-.../人际-完善\n\
    \n## 温故知新：自我探索\n\n![](img/c049f03a753af28f4965561c0dbd43b8_194_0.png)\n\n+   >\
