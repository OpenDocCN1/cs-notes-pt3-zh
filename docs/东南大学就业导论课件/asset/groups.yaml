    \n## 现实的考虑\n\n- 兴趣可以划分为职业兴趣和非职业兴趣，但几乎每一种兴趣都可以与某种职业联系起来。\n- 并不是所有的兴趣都应该在自己的职业中体现。\n\
    - 关键在于在工作和生活之间协调与平衡，以及在工作与个人爱好之间适度统一。\n- 也就是我们常常需要思考：“我为自己的兴趣做什么了？”\n\n## 兴趣与能力\n\
    \n- 兴趣虽然与能力有密切关系，但是兴趣测试的分数并不代表能力的高低。\n- 兴趣并不是能力，也不代表成就，而是无论遇到什么，都会产生动力的源泉。\n-\
