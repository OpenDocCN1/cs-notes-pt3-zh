    - 冒险性

    - 多样性和变化性

    - 能发挥自己的才能

    - 有学习/成长的机会

    - ……


    ## 价值观市场：准备


    - 参照以上列表，挑选出对你来说5条最重要的价值观分别写在5张小纸条上。

    - 对你挑选的重要价值观进行描述，即要达到什么样的程度你才能满意。


    ## 价值观市场：交换


    - 现在，如果你不得不放弃其中的一条，你会放弃哪一条？将你准备放弃的这一条X掉。

    - 如果你不得不再次放弃剩下四条中的一条，你会放弃哪一条？请再次X掉。

    - 继续下去，直到剩下最后一条。这是否是你无论如何也不愿放弃的？


    ## 价值观市场：讨论


    - 通过这个活动，你对于自己的价值观有什么样的了解？

    - 你的价值观会对你的职业选择和人生产生什么样的影响？

    - 影响你价值观形成的因素有哪些？


    ![](img/c049f03a753af28f4965561c0dbd43b8_97_0.png)


    ## 真实价值观的澄清


    - 选择：自主，对比，深思熟虑

    - 珍视：欣赏，珍惜，公开的宣称

    - 行动：奉行，重复


    真正“拥有”自己的价值观


    > ——美国教育家，路易斯·拉斯（Louis Raths）


    ## 探索价值观的其它方法


    - 未完成的价值观句子

    - 价值观拍卖活动

    - 模拟/幻想活动

    - 价值观清单（分类卡）

    - 价值观量表


    ![](img/c049f03a753af28f4965561c0dbd43b8_99_0.png)


    ## 职业价值观报告


    ### 推荐职业


    当前位置：首页 > 职业探索 > 推荐职业


