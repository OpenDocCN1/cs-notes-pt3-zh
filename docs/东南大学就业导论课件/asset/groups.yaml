    ## 职涯规划课程小结


    ![](img/c049f03a753af28f4965561c0dbd43b8_302_0.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_302_1.png)


    | 主题 | 章节 | 课时 | 重点 | 活动举例 |

    |---|---|---|---|---|

    | 觉知与承诺 | （1）认识职业生涯规划 | 1学时 | 课程介绍及定义 | 团队建设 |

    |  | （2）规划意义及步骤 | 1学时 | 规划意义及方法 | 案例+视频 |

    | 认识自我 | （3）职业兴趣 | 3学时 | 探索自我职业兴趣 | 兴趣岛 |

    |  | （4）性格 | 2学时 | 分析自我性格特点 | 自我分析 |

    |  | （5）技能 | 2学时 | 合理描述自我技能 | 成就故事 |

    |  | （6）价值观 | 1学时 | 认识价值观 | 价值市场 |

    | 认识外部世界 | （7）职场信息 | 2学时 | 外部世界的信息分享 | 头脑风暴 |

    |  | （8）探索方法 | 2学时 | 获得策略 | 生涯人物访谈 |

    | 决策 | （9）决策 | 2学时 | 理性决策及行动计划 | 平衡单<br>生涯游戏 |

