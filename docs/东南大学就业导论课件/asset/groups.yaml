    # 教学目标


    认知目标：


    +   > 兴趣是人们获得工作满意度、职业稳定性和职业成就感的重要影响因素，愿意将兴趣作为职业选择时的考虑因素。

    +   > 兴趣虽然是我们动力和快乐的来源，但是工作并不是体现兴趣的唯一途径。


    # 教学目标


    # 技能目标：


    +   - 能够借助兴趣探索练习和标准化测试，使用霍兰德模型来对自己的兴趣进行分类组织，确认自己的兴趣类型代码。

    +   - 学会使用《霍兰德职业索引》来找出与自己的霍兰德代码一致的职业。


    # 目录


    ![](img/c049f03a753af28f4965561c0dbd43b8_42_0.png)


    +   - 兴趣的定义

    +   - 自我兴趣探索

