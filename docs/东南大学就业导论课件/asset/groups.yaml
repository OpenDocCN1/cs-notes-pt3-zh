    ## 职业生涯概念澄清


    工作 < 职业 < 生涯 < 生命


    | 工作 | 职业 | 生涯 | 生命 |

    | --- | --- | --- | --- |

    | (work, job) | (occupation) | (career) | (life) |

    | 营生与生计 | 职业或职位 | 一生的事业或志向 | 追求终生意义 |

    | 安全需求 | 社会认可需求 | 自尊需求 | 自我实现需求 |


    ## 职业生涯规划


    > 职业生涯指一个人依据心中的长期目标所形成的一系列工作选择，包括其相关的教育或培训活动（提升和完善自己以适应职业的要求），是有计划的职业发展历程。

    > ——麦克丹纳·德


    > 职业生涯是生活中各种事件的演进方向和历程，它统合了人一生中的各种职业和生活角色，由此表现出个人独特的自我发展形态。

    > ——舒伯


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_0.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_1.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_2.png)


    ## 职业生涯规划


    - 知己知彼，决策行动，变化发展，动态平衡

    - 依据生涯发展的长远目标，有效整合个人资源与能量，力求实现自身价值与社会价值的最大化。


    ![](img/c049f03a753af28f4965561c0dbd43b8_11_0.png)


