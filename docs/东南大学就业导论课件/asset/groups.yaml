    +   - 兴趣与职业生涯发展

    +   - 分享与练习


    > 如果你锻炼身体的话，身体就会变得更健康、更强壮、更受你的控制；同样的道理也适用于心。讽刺的是，世界上充满了健身中心，而我们真正需要的却是心的健美。心的训练很必要，因为心是“自我”的基础，没有受过训练的心，会让你陷入各种紊乱中，因为这样的心容易被激怒、容易起伏、容易受外境影响。


    ——宗萨钦哲仁波切


    # 兴趣的定义


    +   > 兴趣是我们内心动力和快乐的最终来源。

    +   > 兴趣指的是：无论我们能力高低，也无论外界评价如何，我们依然乐此不疲的事情。


    ![](img/c049f03a753af28f4965561c0dbd43b8_44_0.png)


    # # 兴趣的区别


    +   - “我想睡觉”

    +   - “我身体不好，所以想学医”

