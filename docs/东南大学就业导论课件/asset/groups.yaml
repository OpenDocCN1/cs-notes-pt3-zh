    ## 目标是什么？


    > 在这个阶段，你已觉悟到生涯规划的重要性，并愿意花时间来规划自己的生涯。

    > 但也要了解：有时我们所播下的种子，未必能马上发芽。


    **觉知与承诺**


    ## 探索什么？


    系统化职业规划是一个“从内而外”的过程，因此在职业规划时，要先认识自己。


    - 我的兴趣是什么？

    - 我的性格有哪些特点？

    - 我愿意在工作中使用哪些技能？

    - 我最渴望从工作中获得什么？

    - 几个方面是如何有效整合的？


    ![](img/c049f03a753af28f4965561c0dbd43b8_21_0.png)


    ## 探索什么？


    - 职业的分类和内容；

    - 具体职业对工作人员的要求；

    - 教育方面的选择；

    - 获取以上信息的方法有哪些。


    ![](img/c049f03a753af28f4965561c0dbd43b8_22_0.png)


    ## 怎样更有效？


    - 选择与决定；

    - 综合与评估；

    - 目标设立与计划；

    - 处理决定过程中的各种问题。


    ![](img/c049f03a753af28f4965561c0dbd43b8_23_0.png)


    ## 做了什么？还能做什么？


    - 求职准备；

    - 信息获取；

    - 简历、面试技巧；

    - 积极的心态。


    ![](img/c049f03a753af28f4965561c0dbd43b8_24_0.png)


    ## 成长与发展


    - 理解动态平衡的意义；

    - 为生涯变化做准备；

    - 学习管理职业生涯；

    - 保持发展的观念。


    ![](img/c049f03a753af28f4965561c0dbd43b8_25_0.png)


