    \ \n+   - 一旦全... 你和... 事务, 你\n\n+   生活中的你:\n+   - 信任“理想至上”\n+   - 穿衣风... 么穿戴\n\
    +   - 你喜欢... 己尊敬\n+   - 你有自... 的领域\n\n## 岗位特质:\n\n+   - 你需要在一个注重合作、没有压力和人际关系安定的环境中,与其他富有创造性和情感的同事一起工作\n\
    +   - 工作能够符合你的价值观,能够帮助他人成长和克服,挖掘他们的潜力\n+   - 你需要在一个没有太多限制、灵活的机构中工作,有足够的私人的空间和时间\n\
    +   - 工作允许你深入地与他人沟通和合作,理解、帮助、激励他人,并有机会接触到你尊敬的人\n\n## 优势:\n\n+   - 你能够... \n+ \
    \  - 你考虑... \n+   - 你会... 有余 \n+   - 你天生... 的谊义 \n+   - 你有声\n\n+   - 你需要可以发挥创造力的工作条件,并能够得到鼓励和奖励,不断提升自己的能力\n\
    +   - 工作时间上要留给你足够的时间来消化你的想法,并为实现它而稳定地工作\n\n## 不足与改善:\n\n+   - 过于追求完美,会花费长时间酝酿自己的想法,常常忽略现实和具体现实,行动力较弱,有时做事会无序,很难把事情的优先识别。因此,你要留意练习主观力去关注重要的细节,遵守必要的秩序,重视资源条件、现实资源和逻辑推理,增强办事的计划性和条理性,以及保持推动工作的物性。\n\
    +   - 你比较固执,经常局限在自己的想法里,沉浸于梦想,对外界的需要具体事物没有兴趣,当意识到自己理想与现实之间的差距时,你就容易灰心丧气。你要避免感情用事,恰当地理解梦想和现实的关系,尝试新方法时考虑方法的现实性和可行性,避免过于理想化。\n\
    \n## 图书推荐\n\n《就业宝典》\n中信出版社\n\n+   > 揭开性格类型的奥秘\n+   适合，喜欢，有效\n+   > 获得职业满足的公式\n\
    +   内在，等级，运用，发展\n+   > 16种性格类型在职业中的表现\n+   > 典型代表，经验教训与忠告\n\n![](img/c049f03a753af28f4965561c0dbd43b8_186_0.png)\n\
    \n## 图书推荐\n\n《不必火星撞地球》\n机械工业出版社\n\n+   了解自己的性格，才能真正扬长避短\n+   了解他人的性格，才能顺利达成一致\n\
    +   性格类型在职场人际关系中的应用\n\n![](img/c049f03a753af28f4965561c0dbd43b8_187_0.png)\n\n\
