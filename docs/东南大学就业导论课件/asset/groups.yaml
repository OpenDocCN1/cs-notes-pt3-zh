    ## 目录


    - 价值观的定义

    - 探索个人价值观

    - 价值观与职业

    - 分享与练习


    ## 工作价值观的实现


    - 很少有工作能完全满足一个人所有的重要价值观，生活中亦是如此。因此，我们总是要不断地做出取舍，它们是不可避免也是必要的。

    - 我不觉得人的心智成熟是越来越宽容涵盖，什么都可以接受。相反，我觉得那应该是逐渐剔除的过程，知道自己最重要的是什么，知道不重要的东西是什么。而后，做一个简单的人。——By
    阿甘


    ![](img/c049f03a753af28f4965561c0dbd43b8_102_0.png)


    ## 为什么要考虑价值观


    - 价值观在人们的职业生涯发展中起到极其重要的、决定方向性的作用，甚至往往超过了兴趣和性格对我们的影响。

    - 当我们有矛盾冲突，或妥协与放弃时，常常也是出于对价值观的考虑。


    ![](img/c049f03a753af28f4965561c0dbd43b8_103_0.png)


    ## 价值观的变化


    - 你生命的前半辈子或许属于别人，活在别人的认为里。那把后半辈子还给你自己，去追随你内在的声音。——荣格

    - 个人由于所处的生涯发展阶段、社会环境的不同，他的需求会发生改变，从而可能导致价值观的变化。


    因此，价值观需要不断地审视和澄清。


    ![](img/c049f03a753af28f4965561c0dbd43b8_104_0.png)


    ## 目录


    - 价值观的定义

    - 探索个人价值观

    - 价值观与职业

    - 分享与练习


