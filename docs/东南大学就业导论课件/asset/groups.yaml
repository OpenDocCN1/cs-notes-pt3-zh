    \n## 自我探索的应用\n\n![](img/c049f03a753af28f4965561c0dbd43b8_195_0.png)\n\n技能性格\n\
    我能做什么？\n\n我想要什么？\n兴趣 价值观\n\n市场上有什么职位提供？\n市场需求\n\n## 生涯规划的两条动脉\n\n技能(含性格)\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_0.png)\n\
    \n+\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_1.png)\n\n兴趣+价值观\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_2.png)\n\
    \n成功线索\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_3.png)\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_4.png)\n\
    \n+\n\n![](img/c049f03a753af28f4965561c0dbd43b8_197_5.png)\n\n幸福线索\n\n## 教学目标\n\
    \n认知目标：\n\n+   > 认识到探索工作世界的重要性。\n+   > 以积极的心态面对工作世界，消除对工作世界的刻板印象。\n+   > 开阔思维，多角度，多途径获取工作信息。\n\
    \n## 教学目标\n\n技能目标：\n\n+   了解目前工作世界的大趋势\n\n+   掌握多种获取和研究职业信息的方法\n\n+   能够使用多种方法与策略获取职业信息\n\
    \n+   学会有效管理职业信息\n\n## 目录\n\n![](img/c049f03a753af28f4965561c0dbd43b8_200_0.png)\n\
    \n+   - 我们的困惑\n+   - 工作世界的宏观现状\n+   - 有关职业的微观事实\n+   - 探索工作世界的方法\n+   - 分享与练习\n\
    \n## # 我们的困惑\n\n+   ➢ 有些专科生能做的工作要本科生来做，有些本科生能做的工作要研究生来做，是否早一年毕业就会好？而且用人单位对学历的要求会越来越高？\n\
    \n+   ➢ 我所学习的专业是XXX。我不知道我的这个专业在中国是否有前途。如果还说的过去的话，我不知道我今后是应从事这方面的理论研究工作，还是应该从事其他相关的职业。\n\
    \n## 我们的困惑\n\n+   > 以前在一个学校工作，感觉也不错。现在上了研究生，发现毕业时，都不可能找回那样的单位了。不知道，我是否必须而再考个博士。\n\
    +   > 我不知道我应该基于工作世界的要求来进行自我塑造，还是基于我的特征，去寻找适合我的工作世界？\n\n## 目录\n\n+   > 我们的困惑\n\
    +   > 工作世界的宏观现状\n+   > 有关职业的微观事实\n+   > 探索工作世界的方法\n+   > 分享与练习\n\n## 课堂活动\n\n\
    请画一张图来表示：\n\n你眼中的工作世界是什么样子？\n\n![](img/c049f03a753af28f4965561c0dbd43b8_204_0.png)\n\
    \n![](img/c049f03a753af28f4965561c0dbd43b8_204_1.png)\n\n## # 工作世界的宏观现状\n\n![](img/c049f03a753af28f4965561c0dbd43b8_205_0.png)\n\
    \n## 结构性失业问题突出\n\n+   > 毕业生 “宁要北京一张床，不要西部一套房”\n+   > 考研热：07年128.2万，08年120.0万，09年124.6万，10年140.6万，11年151.1万，12年165.6万\n\
    +   > 考公务员热\n+   > 基层就业冷，自主创业少\n\n![](img/c049f03a753af28f4965561c0dbd43b8_207_0.png)\n\
    \n## 没有技术意味着没有工作\n\n+   > 科技化与自动化，导致工作内涵变化，需要从业人员具备技术基础与广博知识。\n+   > 研究与发展的工作将日趋重要。\n\
    \n## 培训和再教育成为常事\n\n+   > 知识与信息的保质期越来越短\n+   > 知识、信息的瀑涨，使得即时更新成为生存的必要技能\n+   >\
    \ “在信息社会中，唯一不变的就是‘变’，我们不能只期望单一的教育形态来帮助我们渡过一生，没有任何一种教育和技能，可以在未来的社会中一成不变，这是二十一世纪的人必须具有的信念。”\n\
    \n## # 京东管培生培训方式\n\n> > “每年7月1日入职；\n> > 军训+团队熔炼一个月；\n> > 5个月轮岗，可以了解京东所有内部流程；\n\
    > > 第二年1月1日第一次选择岗位；\n> > 之后半年定岗培训。\n> > 第二年7月1日正式结业！\n> > 可以第二次选择岗位。\n> > 期间向CEO提交周工作报告+旁听半年管理层晨会！\n\
    > > 可以随时向CEO汇报工作或者找我交流！\n> > 介绍完毕！”\n\n"
