    | 特质-因素论 | 匹配 |

    | 工作适应论 | 适应 |

    | 生涯发展论 | 平衡 |

    | 信息加工理论 | 认知 |


    ## 何谓职业生涯规划


    职业生涯规划是一个人自青春期到退休，对一生的理念、工作、生活、家庭以及社会等目标所做的妥善安排与计划，用来追求理想人生的方法。


