    ## 教学目标


    ### 认知目标


    - 认识到职业生涯规划课程的作用，调整自己对课程的预期；

    - 认识到在课程中自己应负的责任和如何投入；

    - 认识到职业生涯规划与自身职业发展的关系，产生投入课程的兴趣。


    ![](img/c049f03a753af28f4965561c0dbd43b8_5_0.png)


