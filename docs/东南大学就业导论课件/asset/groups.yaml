    ## 第一讲 认识职业生涯规划


    ## 教学目标


    ### 认知目标


    - 认识到职业生涯规划课程的作用，调整自己对课程的预期；

    - 认识到在课程中自己应负的责任和如何投入；

    - 认识到职业生涯规划与自身职业发展的关系，产生投入课程的兴趣。


    ![](img/c049f03a753af28f4965561c0dbd43b8_5_0.png)


    ### 技能目标


    - 了解整体课程目的；

    - 掌握职业生涯规划的定义；

    - 掌握系统职业生涯规划的具体内容；


    ## 目录


    ![](img/c049f03a753af28f4965561c0dbd43b8_7_0.png)


    - 什么是职业生涯规划

    - 职业生涯规划的意义

    - 系统职业生涯规划具体方法

    - 分享与练习


    ## 职业生涯概念澄清


    工作 < 职业 < 生涯 < 生命


    | 工作 | 职业 | 生涯 | 生命 |

    | --- | --- | --- | --- |

    | (work, job) | (occupation) | (career) | (life) |

    | 营生与生计 | 职业或职位 | 一生的事业或志向 | 追求终生意义 |

    | 安全需求 | 社会认可需求 | 自尊需求 | 自我实现需求 |


    ## 职业生涯规划


    > 职业生涯指一个人依据心中的长期目标所形成的一系列工作选择，包括其相关的教育或培训活动（提升和完善自己以适应职业的要求），是有计划的职业发展历程。

    > ——麦克丹纳·德


    > 职业生涯是生活中各种事件的演进方向和历程，它统合了人一生中的各种职业和生活角色，由此表现出个人独特的自我发展形态。

    > ——舒伯


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_0.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_1.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_10_2.png)


    ## 职业生涯规划


    - 知己知彼，决策行动，变化发展，动态平衡

    - 依据生涯发展的长远目标，有效整合个人资源与能量，力求实现自身价值与社会价值的最大化。


    ![](img/c049f03a753af28f4965561c0dbd43b8_11_0.png)


    ## 回顾：多元的生涯理论


    | 生涯理论 | 关键词 |

    | --- | --- |

    | 特质-因素论 | 匹配 |

    | 工作适应论 | 适应 |

    | 生涯发展论 | 平衡 |

    | 信息加工理论 | 认知 |


    ## 何谓职业生涯规划


    职业生涯规划是一个人自青春期到退休，对一生的理念、工作、生活、家庭以及社会等目标所做的妥善安排与计划，用来追求理想人生的方法。


    ## 目录


    - 什么是职业生涯规划

    - 职业生涯规划的意义

    - 系统职业生涯规划具体方法

    - 分享与练习


    ![](img/c049f03a753af28f4965561c0dbd43b8_14_0.png)


    ## 职业生涯规划的意义


    - Michelozzi（1998）指出：职业生涯规划有突破障碍、开发潜能和自我实现等三个积极目的。


    ![](img/c049f03a753af28f4965561c0dbd43b8_15_0.png)


    ## 职业生涯规划的意义


    ![](img/c049f03a753af28f4965561c0dbd43b8_16_0.png)


    ### 突破障碍


    **内在障碍**


    - 恐惧不安

    - 缺乏信心

    - 缺少自觉

    - 自视甚低

    - 态度消极

    - 缺少技能


    **外在障碍**


    - 政局不安

    - 市场趋势不明

    - 经济衰退

    - 社会紊乱

    - 刻板印象

    - 体能要求


    ### 自我实现


    - 以己为荣

    - 圆融

    - 丰足

    - 喜知

    - 创造力


    ### 开发潜能


    - 自我觉知

    - 积极进取

    - 建立自信

    - 培养实力

    - 增强勇气

    - 沟通技巧


    > Michelozzi（1998）


    ## 目录


    - 什么是职业生涯规划

    - 职业生涯规划的意义

    - 系统职业生涯规划具体方法

    - 分享与练习


    ## 系统的职业生涯规划法


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_0.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_1.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_2.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_3.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_4.png)


    ![](img/c049f03a753af28f4965561c0dbd43b8_19_5.png)


    ## 目标是什么？


    > 在这个阶段，你已觉悟到生涯规划的重要性，并愿意花时间来规划自己的生涯。

    > 但也要了解：有时我们所播下的种子，未必能马上发芽。


    **觉知与承诺**


    ## 探索什么？


    系统化职业规划是一个“从内而外”的过程，因此在职业规划时，要先认识自己。


    - 我的兴趣是什么？

    - 我的性格有哪些特点？

    - 我愿意在工作中使用哪些技能？

    - 我最渴望从工作中获得什么？

    - 几个方面是如何有效整合的？


    ![](img/c049f03a753af28f4965561c0dbd43b8_21_0.png)


    ## 探索什么？


    - 职业的分类和内容；

    - 具体职业对工作人员的要求；

    - 教育方面的选择；

    - 获取以上信息的方法有哪些。


    ![](img/c049f03a753af28f4965561c0dbd43b8_22_0.png)


    ## 怎样更有效？


    - 选择与决定；

    - 综合与评估；

    - 目标设立与计划；

    - 处理决定过程中的各种问题。


    ![](img/c049f03a753af28f4965561c0dbd43b8_23_0.png)


    ## 做了什么？还能做什么？


    - 求职准备；

    - 信息获取；

    - 简历、面试技巧；

    - 积极的心态。


    ![](img/c049f03a753af28f4965561c0dbd43b8_24_0.png)


    ## 成长与发展


    - 理解动态平衡的意义；

    - 为生涯变化做准备；

    - 学习管理职业生涯；

    - 保持发展的观念。


    ![](img/c049f03a753af28f4965561c0dbd43b8_25_0.png)


