    ## 什么是工作价值观？


    - 工作价值观，是指无论你从事什么工作，都会努力在工作中追求的东西。

    - 从另一个角度来讲，工作价值观就是你最期待从工作中获得的东西。


    ![](img/c049f03a753af28f4965561c0dbd43b8_88_0.png)


    ## 马斯洛的需求层次理论


    - 马斯洛提出人有五个层次的需求：生理需求、安全需求、归属需求、尊重需求，以及自我实现的需求。

    - 只有当低层次的需求满足以后，个人才能够更好地满足更高层的需要。

    - 这些需求体现在我们的生活中，就成为我们的价值观，它们具有强大的驱动力。


    ## 需求理论


    | 需要层级 | 需要 | 具体体现 |

    |---|---|---|

    | 高级需要 | 自我实现 | 成就感，价值感 |

    | 次级需要 | 尊重 | 认可，肯定 |

    | 次级需要 | 归属和爱 | 支持，关注 |

    | 基本需要 | 安全 | 环境，制度 |

    | 基本需要 | 生理 | 报酬，福利 |


