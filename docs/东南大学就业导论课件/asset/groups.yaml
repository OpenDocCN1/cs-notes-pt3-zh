    ## 目录


    ![](img/c049f03a753af28f4965561c0dbd43b8_313_0.png)


    - 走进职场

    - 管理你的职业生涯

    - 分享与练习


    ![](img/c049f03a753af28f4965561c0dbd43b8_313_1.png)


    ## 走进职场前的准备


    - 你要带着一个什么样的你去工作？

    - 你在工作中可能遇到哪些问题？你打算如何解决？

    - 你工作的核心目标是什么？

    - 如何让你的行动力与目标保持一致？

    - 你的支持系统在哪里？

    - 暂时还是永远？

    - 自卑是值得的，重要的是你如何理解和应对自卑。


    | 大学文化 | 工作文化 |

    |---|---|

    | ➢ 弹性的时间安排；<br>➢ 你可以选课；<br>➢ 更有规律、更及时的反馈；<br>➢ 长假和自由的节假休息；<br>➢ 对问题有正确答案；<br>➢
    教学大纲提供清晰的任务；<br>➢ 分数上的个人竞争；<br>➢ 工作循环周期较短；<br>➢ 奖励以客观性标准和优点为基础。 | ➢ 更固定的时间安排；<br>➢
    你不能缺工；<br>➢ 无规律和不经常的反馈；<br>➢ 没有暑假，节假休息很少；<br>➢ 很少有问题的正确答案；<br>➢ 任务模糊、不清晰；<br>➢
    按团队业绩进行评估；<br>➢ 持续数月或数年的更长时间的工作循环；<br>➢ 奖励更多是以主观性标准和个人判断为基础。 |


    | 你的教授 | 你的老板 |

    |---|---|

    | ➢ 鼓励讨论；<br>➢ 规定完成任务的交付时间；<br>➢ 期待公平；<br>➢ 知识导向。 | ➢ 通常对讨论不感兴趣；<br>➢ 分派紧急的工作，交付周期很短；<br>➢
    有时很独断，并不总是公平；<br>➢ 结果（利益）导向。 |


    | 大学的学习过程 | 工作的学习过程 |

    |---|---|

    | ➤ 抽象性、理论性的原则；<br>➤ 正规的、结构性的和象征性的学习；<br>➤ 个人化的学习。 | ➤ 具体的问题解决和决策制定；<br>➤ 以工作中发生的临时性事件和具体真实的生活为基础；<br>➤
    社会性、分享性的学习。 |


