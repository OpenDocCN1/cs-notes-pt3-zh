    ## pthread_create\n\n```\nint pthread_create(tid, attr, function, arg);\n```\n\
    \n- `pthread_t *tid`\n  - handle of created thread\n- `const pthread_attr_t *attr`\n\
    \  - attributes of thread to be created\n- `void *(*function) (void*)`\n  - function\
    \ to be mapped to thread\n- `void *arg`\n  - single argument to function\n\n##\
    \ pthread_create explained\n\n- spawn a thread running the function\n- thread\
    \ handle returned via pthread_t structure\n- specify *NULL* to use default attributes\n\
    - single argument sent to function\n  - If no argument to function, specify *NULL*\n\
    - check error codes (returned value)!\n\n> **EAGAIN** – insufficient resources\
    \ to create thread  \n> **EINVAL** – invalid attribute\n\n## Threads states\n\n\
    - pthread threads have two states\n  - joinable and detached\n- threads are joinable\
    \ by default\n  - Resources are kept until *pthread_join*\n  - can be reset with\
    \ attribute or API call\n- detached thread can not be joined\n  - resources can\
    \ be reclaimed at termination\n  - cannot reset to be *joinable*\n\n## Waiting\
    \ for a thread\n\n```\nint pthread_join(tid, val_ptr);\n```\n\n- pthread_t *tid\n\
    \  - handle of joinable thread\n- void **val_ptr\n  - exit value returned by joined\
    \ thread\n\n## pthread_join explained\n\n- calling thread waits for the thread\
    \ with handle tid to terminate\n- only one thread can be joined\n- thread must\
    \ be joinable\n  - exit value is returned from joined thread\n  - type returned\
    \ is (void *)\n  - use NULL if no return value expected\n\nESRCH – thread not\
    \ found\nEINVAL – thread not joinable\n\n## Example: Multiple threads\n\n```\n\
    #include <stdio.h>\n#include <pthread.h>\nconst int numThreads = 4;\n\nvoid *helloFunc(void\
    \ * pArg)\n{ printf(\"Hello Thread\\n\"); }\n\nmain()\n{ pthread_t hThread[numThreads];\n\
    for (int i = 0; i < numThreads; i++)\n    pthread_create(&hThread[i], NULL, helloFunc,\
    \ NULL);\nfor (int i = 0; i < numThreads; i++)\n    pthread_join(hThread[i], NULL);\n\
    return 0;\n}\n```\n\n## Thread Cancellation\n\n- int pthread_setcancelstate(int\
    \ state, int *oldstate);\n  - PTHREAD_CANCEL_ENABLE\n  - PTHREAD_CANCEL_DISABLE\n\
    - int pthread_setcanceltype(int type, int *oldtype);\n  - PTHREAD_CANCEL_ASYNCHRONOUS\n\
    \  - PTHREAD_CANCEL_DEFERRED\n- void pthread_testcancel(void);\n\n## Windows Thread\
    \ APIs\n\n- CreateThread\n- GetCurrentThreadId - returns global ID\n- GetCurrentThread\
    \ - returns handle\n- SuspendThread/ResumeThread\n- ExitThread\n- TerminateThread\n\
    - GetExitCodeThread\n- GetThreadTimes\n\n## Suspending and Resuming Threads\n\n\
    - Each thread has suspend count\n- Can only execute if suspend count == 0\n- Thread\
    \ can be created in suspended state\n\n```\nDWORD ResumeThread (HANDLE hThread)\n\
    DWORD SuspendThread(HANDLE hThread)\n```\n\nBoth functions return suspend count\
    \ or 0xFFFFFFFF on failure\n\n## Example: Thread Creation\n\n```\n#include <stdio.h>\n\
    #include <windows.h>\n\nDWORD WINAPI helloFunc(LPVOID arg ) {\n    printf(\"Hello\
    \ Thread\\n\");\n    return 0;\n}\n\nmain() {\n    HANDLE hThread =\n        CreateThread(NULL,\
    \ 0, helloFunc,\n            NULL, 0, NULL );\n}\n```\n\nWhat’s Wrong?\n\n## Example\
    \ Explained\n\n- Main thread is process\n- When process goes, all threads go\n\
    - Need some methods of waiting for a thread to finish\n\n## Waiting for Windows\
    \ Thread\n\n```\n#include <stdio.h>\n#include <windows.h>\nBOOL thrdDone = FALSE;\n\
    DWORD WINAPI helloFunc(LPVOID arg ) {\n    printf(\"Hello Thread\\n\");\n    return\
    \ 0;\n}\nmain() {\n    HANDLE hTh\n    CreateThread(NULL, 0, helloFunc,\n    NULL,\
    \ 0, NULL );\n}\n```\n\nthrdDone = TRUE;\n\nNot a good idea!\n\nwhile (!thrdDone);\n"
  mdcn: "\n\n## Pthreads\n\n- POSIX 标准（IEEE 1003.1c）用于线程创建和同步的 API。\n- API 指定线程库的行为，实现由库的开发决定。\n\
    - 在 UNIX 操作系统中很常见。\n\n## pthread_create\n\n```\nint pthread_create(tid, attr,\
    \ function, arg);\n```\n\n- `pthread_t *tid`\n  - 创建的线程句柄\n- `const pthread_attr_t\
    \ *attr`\n  - 待创建线程的属性\n- `void *(*function) (void*)`\n  - 映射到线程的函数\n- `void *arg`\n\
    \  - 传递给函数的单个参数\n\n## pthread_create 解释\n\n- 启动一个运行指定函数的线程\n- 线程句柄通过 pthread_t\
    \ 结构返回\n- 指定 *NULL* 以使用默认属性\n- 向函数发送单个参数\n  - 如果函数不需要参数，指定 *NULL*\n- 检查错误代码（返回值）！\n\
    \n> **EAGAIN** – 资源不足无法创建线程  \n> **EINVAL** – 属性无效\n\n## 线程状态\n\n- pthread 线程有两种状态\n\
    \  - 可连接和分离\n- 线程默认是可连接的\n  - 资源在 *pthread_join* 之前一直保留\n  - 可通过属性或 API 调用重置\n\
    - 分离线程无法被连接\n  - 资源可在终止时回收\n  - 不能重置为 *可连接*\n\n## 等待线程\n\n```\nint pthread_join(tid,\
    \ val_ptr);\n```\n\n- pthread_t *tid\n  - 可连接线程的句柄\n- void **val_ptr\n  - 被连接线程返回的退出值\n\
    \n## pthread_join 解释\n\n- 调用线程等待句柄为 tid 的线程终止\n- 只能连接一个线程\n- 线程必须是可连接的\n  - 退出值从被连接线程返回\n\
    \  - 返回类型为 (void *)\n  - 如果不期望返回值，使用 NULL\n\nESRCH – 未找到线程\nEINVAL – 线程不可连接\n\n\
    ## 示例：多个线程\n\n```\n#include <stdio.h>\n#include <pthread.h>\nconst int numThreads\
    \ = 4;\n\nvoid *helloFunc(void * pArg)\n{ printf(\"Hello Thread\\n\"); }\n\nmain()\n\
    { pthread_t hThread[numThreads];\nfor (int i = 0; i < numThreads; i++)\n    pthread_create(&hThread[i],\
    \ NULL, helloFunc, NULL);\nfor (int i = 0; i < numThreads; i++)\n    pthread_join(hThread[i],\
    \ NULL);\nreturn 0;\n}\n```\n\n## 线程取消\n\n- int pthread_setcancelstate(int state,\
    \ int *oldstate);\n  - PTHREAD_CANCEL_ENABLE\n  - PTHREAD_CANCEL_DISABLE\n- int\
    \ pthread_setcanceltype(int type, int *oldtype);\n  - PTHREAD_CANCEL_ASYNCHRONOUS\n\
    \  - PTHREAD_CANCEL_DEFERRED\n- void pthread_testcancel(void);\n\n## Windows 线程\
    \ API\n\n- CreateThread\n- GetCurrentThreadId - 返回全局 ID\n- GetCurrentThread -\
    \ 返回句柄\n- SuspendThread/ResumeThread\n- ExitThread\n- TerminateThread\n- GetExitCodeThread\n\
    - GetThreadTimes\n\n## 挂起和恢复线程\n\n- 每个线程都有挂起计数\n- 只有当挂起计数 == 0 时才能执行\n- 线程可以以挂起状态创建\n\
    \n```\nDWORD ResumeThread (HANDLE hThread)\nDWORD SuspendThread(HANDLE hThread)\n\
    ```\n\n两个函数都返回挂起计数或在失败时返回 0xFFFFFFFF\n\n## 示例：线程创建\n\n```\n#include <stdio.h>\n\
    #include <windows.h>\n\nDWORD WINAPI helloFunc(LPVOID arg ) {\n    printf(\"Hello\
    \ Thread\\n\");\n    return 0;\n}\n\nmain() {\n    HANDLE hThread =\n        CreateThread(NULL,\
    \ 0, helloFunc,\n            NULL, 0, NULL );\n}\n```\n\n有什么问题？\n\n## 示例解释\n\n\
    - 主线程是进程\n- 当进程结束时，所有线程都结束\n- 需要一些等待线程完成的方法\n\n## 等待 Windows 线程\n\n```\n#include\
    \ <stdio.h>\n#include <windows.h>\nBOOL thrdDone = FALSE;\nDWORD WINAPI helloFunc(LPVOID\
    \ arg ) {\n    printf(\"Hello Thread\\n\");\n    return 0;\n}\nmain() {\n    HANDLE\
    \ hTh\n    CreateThread(NULL, 0, helloFunc,\n    NULL, 0, NULL );\n}\n```\n\n\
    thrdDone = TRUE;\n\n不是一个好主意！\n\nwhile (!thrdDone);\n\n"
