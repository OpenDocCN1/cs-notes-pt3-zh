    \  - create and delete communication connection\n  - send and receive message\n\
    \  - transfer status information\n  - attach or detach remote devices\n\n### 通信模型\n\
    \n- 通信可以使用 **消息传递** 或 **共享内存** 进行。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_103_0.png)\n\
    \n### 大纲\n\n- 操作系统功能\n- 操作系统服务\n- 操作系统接口\n- 操作系统结构\n- 操作系统设计与实现\n\n### 操作系统结构\n\
    \n- 简单结构\n- 分层结构\n  - 虚拟机\n- 微内核结构\n- 模块\n\n### 简单结构\n\n- **MS-DOS**\n  - 编写时旨在在最小空间内提供最多的功能\n\
    \  - 未划分为模块\n  - 尽管 MS-DOS 有一些结构，但其接口和功能级别没有很好地分离\n\n- **原始 UNIX**\n  - 两个可分离的部分\n\
    \    - 系统程序\n    - **内核**：由系统调用接口以下和物理硬件以上的一切组成，为一个层级提供大量功能\n\n### UNIX 系统结构\n\
    \n```\n(the users)\n\nshells and commands\ncompilers and interpreters\nsystem\
