  mdcn: "\n\n## 多级反馈队列\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_324_0.png)\n\n\
    ## 就绪队列\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_325_0.png)\n\n- 队列 *i* 中的进程具有时间片\
    \ `2^i`\n- 当进程的行为发生变化时，它可能会被放置到不同的队列中，即 **提升** 或 **降级**。\n- 因此，当一个 CPU 密集型进程开始使用更多\
    \ CPU 时，它可能会被降级到更低的队列\n\n## 多级反馈队列\n\n- **多级反馈队列调度器由以下参数定义：**\n  - 队列的数量\n  -\
    \ 每个队列的调度算法\n  - 用于确定何时提升进程的方法\n  - 用于确定何时降级进程的方法\n  - 用于确定进程需要服务时将进入哪个队列的方法\n\
    \n## 大纲\n\n- 基本概念\n- 调度准则\n- 调度算法\n- **多处理器调度**\n- 实时调度\n- 线程调度\n- 算法评估\n- 操作系统示例\n\
    \n## 多处理器调度\n\n- 当有多个 CPU 可用时，CPU 调度变得更加复杂。\n- 多处理器中的 *同构处理器*。\n- *负载均衡* — 使工作负载在所有处理器之间均匀分布。\n\
    \  - 推迁移\n  - 拉迁移\n\n## 多处理器调度\n\n## 处理器亲和性\n\n- 大多数 SMP 系统试图避免进程从一个处理器迁移到另一个处理器。\n\
    - 软亲和性 & 硬亲和性\n\n## 实时调度\n\n- **硬实时系统** – 必须在保证的时间内完成关键任务。\n  - 调度器 **要么接收** 一个进程并保证该进程会按时完成，**要么拒绝**\
    \ 该请求（*资源预留*）。\n  - 如果系统具有辅助存储和虚拟内存，则几乎不可能实现这一点，因为这些子系统会造成不可避免的延迟。\n  - 硬实时系统通常在专用硬件上运行专用软件。\n\
    \n## 实时调度\n\n- *软实时系统* – 要求关键进程优先于较不幸的进程。\n  - 在通用系统中很容易实现。\n  - 它可能导致不公平的资源分配和非关键任务的更长延迟（*饥饿*）。\n\
    \  - CPU 调度器必须 *防止老化* 发生。否则，关键任务可能会具有较低的优先级。\n  - 调度延迟必须很小。\n\n## 优先级反转\n\n- 如果一个\
    \ **高优先级进程** 需要访问当前正被低优先级进程访问的数据会怎样？\n- 高优先级进程被低优先级进程阻塞。\n- 这就是 *优先级反转*。\n\n##\
    \ 优先级反转\n\n- 这可以通过 *优先级继承协议* 来解决。\n  - 所有进程，包括正在访问数据的进程，**继承高优先级**，直到它们完成对资源的使用。\n\
    \  - 完成后，它们的优先级值 **恢复** 为原始值。\n\n## 大纲\n\n- 基本概念\n- 调度准则\n- 调度算法\n- 多处理器调度\n-\
    \ 实时调度\n- 线程调度\n- 算法评估\n- 操作系统示例\n\n## 线程调度\n\n- **用户级线程**\n  - 由线程库管理\n- **内核级线程**\n\
    \  - 由操作系统调度\n- 要在 CPU 上运行，用户级线程最终必须映射到关联的内核级线程。\n\n## 线程调度\n\n- **本地调度** – **用户级线程**\n\
    \  - 线程库决定将哪个线程放到可用的 LWP 上\n  - **进程竞争范围 PCS**\n\n- **全局调度** – **内核级线程**\n  -\
    \ 内核决定下一个运行哪个内核线程\n  - **系统竞争范围 SCS**\n\n"
