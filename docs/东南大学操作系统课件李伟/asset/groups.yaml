    # Resource Preemption


    +   - **Selecting a victim** – minimize cost.

    +   - **Rollback** – return to some safe state, restart process for that state.

    +   - **Starvation** – same process may always be picked as victim. The most common
    solution is to include the number of rollback in the cost factor.'
