  mdcn: "\n\n## 基本事实\n- 如果图不包含环 ⇒ 不会发生死锁。\n- 如果图包含一个环 ⇒\n  - 如果每种资源类型只有一个实例，则发生死锁。\n\
    \  - 如果每种资源类型有多个实例，则可能发生死锁。\n\n## 大纲\n- 系统模型\n- 死锁特征\n- 处理死锁的方法\n- 死锁预防\n- 死锁避免\n\
    - 死锁检测\n- 死锁恢复\n\n## 处理死锁的方法\n- 确保系统永远不会进入死锁状态。\n  - **预防：** 确保四个条件之一不成立。\n  -\
    \ **避免：** 操作系统需要更多信息以便确定当前请求是否可以满足或延迟。\n- 允许系统进入死锁状态，检测它并进行恢复。\n- 忽略问题并假装系统从未发生死锁\n\
    \n## 大纲\n- 系统模型\n- 死锁特征\n- 处理死锁的方法\n- **死锁预防**\n- 死锁避免\n- 死锁检测\n- 死锁恢复\n\n## 死锁预防：互斥\n\
    - 通过确保四个条件之一不成立，我们可以防止死锁的发生。\n- **互斥**：某些不可共享的资源必须被独占访问（例如打印机），这意味着我们无法否定互斥条件。\n\
    \n## 死锁预防：占有并等待\n- 任何进程都不能持有某些资源然后再请求其他资源。\n- 可能的两种策略：\n  - 进程必须在运行前获取*所有*资源。\n\
    \  - 当进程请求资源时，它必须不持有任何资源（即在请求更多资源前先归还资源）。\n- 资源利用率可能很低，因为许多资源会被长时间持有而未使用。\n- 可能发生饥饿。一个需要某些热门资源的进程可能需要无限期等待。\n\
    \n## 死锁预防：不可剥夺\n- 如果持有某些资源的进程请求另一个无法立即分配给它的资源，则当前持有的所有资源将被剥夺。\n- 如果请求的资源不可用：\n\
    \  - 如果它们被正在等待额外资源的进程持有，则这些资源将被剥夺并给予请求进程。（抢别人）\n  - 否则，请求进程等待直到请求的资源可用。在等待期间，其资源可能被剥夺。（被抢）\n\
    \n## 死锁预防：循环等待\n- 为打破循环等待条件，我们可以对所有资源类型进行排序（*例如*，磁带、打印机）。\n- 进程只能请求比其已持有资源类型更高的资源。\n\
    - 进程必须释放某些更高顺序的资源才能请求更低顺序的资源。\n- 假设磁带、磁盘和打印机的顺序为 1、4 和 8。如果一个进程持有磁盘（4），它只能请求打印机（8）而不能请求磁带（1）。要获取磁带（1），进程必须释放其磁盘（4）。\n\
    - 这样，就不可能发生死锁。为什么？\n\n## 大纲\n- 系统模型\n- 死锁特征\n- 处理死锁的方法\n- 死锁预防\n- **死锁避免**\n-\
    \ 死锁检测\n- 死锁恢复\n\n## 安全状态\n- 当进程请求可用资源时，系统必须决定是否立即分配会使系统处于*安全状态*。\n- 系统处于安全状态如果存在所有进程的一个安全序列。\n\
    - **序列 <P₁, P₂, …, Pₙ> 是安全的** 如果对于每个 Pᵢ，Pᵢ 仍可能请求的资源可以由当前可用资源 *加上* 所有 Pⱼ 持有的资源满足，其中\
    \ j<i。\n\n## 基本事实\n- 如果系统处于安全状态 ⇒ 不会发生死锁。\n- 如果系统处于不安全状态 ⇒ 可能发生死锁。\n- 避免 ⇒ 确保系统永远不会进入不安全状态。\n\
    \n"
