  md: "\n## Example P1 Request (1,0,2)\n\n- Executing safety algorithm shows that\
    \ sequence *<P₁, P₃, P₄, P₀, P₂>* satisfies safety requirement.\n- Can request\
    \ for (3,3,0) by *P₄* be granted?\n- Can request for (0,2,0) by *P₀* be granted?\n\
    \n## Outline\n\n- System Model\n- Deadlock Characterization\n- Methods for Handling\
    \ Deadlocks\n- Deadlock Prevention\n- Deadlock Avoidance\n- Deadlock Detection\n\
    - Recovery from Deadlock\n\n## Deadlock Detection\n\n- Allow system to enter deadlock\
    \ state\n- Detection algorithm\n- Recovery scheme\n\n## Single Instance of Each\
    \ Resource Type\n\n- **Maintain** *wait-for graph*\n  - Nodes are processes.\n\
    \  - $P_i \\rightarrow P_j$ if $P_i$ is waiting for $P_j$.\n- Periodically invoke\
    \ an algorithm that searches for a cycle in the graph.\n- An algorithm to detect\
    \ a cycle in a graph requires an order of $n^2$ operations, where $n$ is the number\
    \ of vertices in the graph.\n\n## Resource-Allocation Graph and Wait-for Graph\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_479_0.png)\n\nResource-Allocation Graph\n\
    \nCorresponding wait-for graph\n\n## Several Instances of a Resource Type\n\n\
    - **Available:** A vector of length *m* indicates the number of available resources\
    \ of each type.\n- **Allocation:** An *n* x *m* matrix defines the number of resources\
    \ of each type currently allocated to each process.\n- **Request:** An *n* x *m*\
    \ matrix indicates the current request of each process. If *Request* [*i,j*] =\
    \ *k*, then process *P_i* is requesting *k* more instances of resource type *R_j*.\n\
    \n### Detection Algorithm\n\n1. Let *Work* and *Finish* be vectors of length *m*\
    \ and *n*, respectively. Initialize:\n   (a) *Work* = *Available*\n   (b) For\
    \ *i* = 1, 2, ..., *n*, if *Allocationᵢ* ≠ 0, then *Finish[i]* = false; otherwise,\
    \ *Finish[i]* = true.\n\n2. Find an index *i* such that both:\n   (a) *Finish[i]*\
    \ == false\n   (b) *Requestᵢ* ≤ *Work*\n   \n   If no such *i* exists, go to step\
    \ 4.\n\n3. *Work* = *Work* + *Allocation*ᵢ  \n   *Finish*[i] = true  \n   go to\
    \ step 2.\n\n4. If *Finish*[i] == false, for some i, 1 ≤ i ≤ n,  \n   then the\
    \ system is in deadlock state.  \n   Moreover, if *Finish*[i] == false, then Pᵢ\
    \ is  \n   deadlocked.\n\n## Example of Detection Algorithm\n\n- Five processes\
    \ *P*₀ through *P*₄; three resource types A (7 instances), B (2 instances), and\
    \ C (6 instances).\n\n- Snapshot at time *T*₀:\n\n| Process | Allocation A B C\
    \ | Request A B C | Available A B C |\n|---|---|---|---|\n| *P*₀ | 0 1 0 | 0 0\
    \ 0 | 0 0 0 |\n| *P*₁ | 2 0 0 | 2 0 2 | |\n| *P*₂ | 3 0 3 | 0 0 0 | |\n| *P*₃\
    \ | 2 1 1 | 1 0 0 | |\n| *P*₄ | 0 0 2 | 0 0 2 | |\n\n- Sequence ⟨*P*₀, *P*₂, *P*₃,\
    \ *P*₁, *P*₄⟩ will result in *Finish*[*i*] = true for all *i*.\n\n- *P₂* requests\
    \ an additional instance of type *C*.\n\n*Request*\n\n|   | A | B | C |\n|---|---|---|---|\n\
    | *P₀* | 0 | 0 | 0 |\n| *P₁* | 2 | 0 | 2 |\n| *P₂* | 0 | 0 | 1 |\n| *P₃* | 1 |\
    \ 0 | 0 |\n| *P₄* | 0 | 0 | 2 |\n\n- State of system?\n\n## Detection-Algorithm\
    \ Usage\n\n- When, and how often, to invoke depends on:\n  - How often a deadlock\
    \ is likely to occur?\n  - How many processes will be affected by deadlock when\
    \ it happens?\n- If detection algorithm is invoked arbitrarily, there may be many\
    \ cycles in the resource graph and so we would not be able to tell which of the\
    \ many deadlocked processes “caused” the deadlock.\n\n## Outline\n\n- System Model\n\
    - Deadlock Characterization\n- Methods for Handling Deadlocks\n- Deadlock Prevention\n\
    - Deadlock Avoidance\n- Deadlock Detection\n- Recovery from Deadlock\n\n### Recovery\
    \ from Deadlock\n\n- Process Termination\n- Resource Preemption\n\n## Process\
    \ Termination\n\n- Abort all deadlocked processes.\n- Abort one process at a time\
    \ until the deadlock cycle is eliminated.\n- In which order should we choose to\
    \ abort?\n  - Priority of the process.\n  - How long process has computed, and\
    \ how much longer to completion.\n  - Resources the process has used.\n  - Resources\
    \ process needs to complete.\n  - How many processes will need to be terminated.\n\
    \  - Is process interactive or batch?\n"
  mdcn: "\n\n## 示例 P1 请求 (1,0,2)\n\n- 执行安全算法显示序列 *<P₁, P₃, P₄, P₀, P₂>* 满足安全要求。\n\
    - *P₄* 请求的 (3,3,0) 能否被授予？\n- *P₀* 请求的 (0,2,0) 能否被授予？\n\n## 大纲\n\n- 系统模型\n- 死锁特征\n\
    - 处理死锁的方法\n- 死锁预防\n- 死锁避免\n- 死锁检测\n- 死锁恢复\n\n## 死锁检测\n\n- 允许系统进入死锁状态\n- 检测算法\n\
    - 恢复方案\n\n## 每种资源类型仅有一个实例\n\n- **维护** *等待图*\n  - 节点是进程。\n  - $P_i \\rightarrow\
    \ P_j$ 如果 $P_i$ 正在等待 $P_j$。\n- 定期调用一个算法搜索图中的环。\n- 一个检测图中环的算法需要 $n^2$ 量级的运算，其中\
    \ $n$ 是图中的顶点数。\n\n## 资源分配图和等待图\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_479_0.png)\n\
    \n资源分配图\n\n对应的等待图\n\n## 资源类型的多个实例\n\n- **可用:** 长度为 *m* 的向量表示每种类型的可用资源数量。\n- **分配:**\
    \ 一个 *n* x *m* 矩阵定义当前分配给每个进程的每种类型资源的数量。\n- **请求:** 一个 *n* x *m* 矩阵表示每个进程的当前请求。如果\
    \ *Request* [*i,j*] = *k*，则进程 *P_i* 请求资源类型 *R_j* 的另外 *k* 个实例。\n\n### 检测算法\n\n\
    1. 设 *Work* 和 *Finish* 分别为长度为 *m* 和 *n* 的向量。初始化：\n   (a) *Work* = *Available*\n\
    \   (b) 对于 *i* = 1, 2, ..., *n*，如果 *Allocationᵢ* ≠ 0，则 *Finish[i]* = false；否则，*Finish[i]*\
    \ = true。\n\n2. 找到一个索引 *i* 使得同时满足：\n   (a) *Finish[i]* == false\n   (b) *Requestᵢ*\
    \ ≤ *Work*\n   \n   如果不存在这样的 *i*，则转到步骤 4。\n\n3. *Work* = *Work* + *Allocation*ᵢ\
    \  \n   *Finish*[i] = true  \n   转到步骤 2。\n\n4. 如果 *Finish*[i] == false，对某个 i，1\
    \ ≤ i ≤ n，  \n   则系统处于死锁状态。  \n   而且，如果 *Finish*[i] == false，则 Pᵢ  \n   处于死锁。\n\
    \n## 检测算法示例\n\n- 五个进程 *P*₀ 到 *P*₄；三种资源类型 A（7 个实例）、B（2 个实例）和 C（6 个实例）。\n\n- 时间\
    \ *T*₀ 的快照：\n\n| 进程 | 分配 A B C | 请求 A B C | 可用 A B C |\n|---|---|---|---|\n| *P*₀\
    \ | 0 1 0 | 0 0 0 | 0 0 0 |\n| *P*₁ | 2 0 0 | 2 0 2 | |\n| *P*₂ | 3 0 3 | 0 0\
    \ 0 | |\n| *P*₃ | 2 1 1 | 1 0 0 | |\n| *P*₄ | 0 0 2 | 0 0 2 | |\n\n- 序列 ⟨*P*₀,\
    \ *P*₂, *P*₃, *P*₁, *P*₄⟩ 将导致 *Finish*[*i*] = true 对所有 *i*。\n\n- *P₂* 请求类型 *C*\
    \ 的额外一个实例。\n\n*Request*\n\n|   | A | B | C |\n|---|---|---|---|\n| *P₀* | 0 |\
    \ 0 | 0 |\n| *P₁* | 2 | 0 | 2 |\n| *P₂* | 0 | 0 | 1 |\n| *P₃* | 1 | 0 | 0 |\n\
    | *P₄* | 0 | 0 | 2 |\n\n- 系统状态？\n\n## 检测算法使用\n\n- 何时以及多久调用一次取决于：\n  - 死锁发生的可能性有多大？\n\
    \  - 发生时会有多少进程受死锁影响？\n- 如果检测算法被任意调用，资源图中可能存在多个环，因此我们无法判断众多死锁进程中哪个“导致”了死锁。\n\n\
    ## 大纲\n\n- 系统模型\n- 死锁特征\n- 处理死锁的方法\n- 死锁预防\n- 死锁避免\n- 死锁检测\n- 死锁恢复\n\n### 死锁恢复\n\
    \n- 进程终止\n- 资源抢占\n\n## 进程终止\n\n- 终止所有死锁进程。\n- 一次终止一个进程，直到死锁环被消除。\n- 我们应该按什么顺序选择终止？\n\
    \  - 进程的优先级。\n  - 进程已计算的时间，以及完成还需要多长时间。\n  - 进程已使用的资源。\n  - 进程完成所需的资源。\n  - 需要终止多少个进程。\n\
    \  - 进程是交互式还是批处理？\n\n"
