  mdcn: "\n\n## FCFS 调度\n\n- 假设进程按顺序 P₂、P₃、P₁ 到达。\n- 该调度的甘特图如下：\n\n  ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_297_0.png)\n\
    \n- P₁ 的等待时间 = 6；P₂ = 0；P₃ = 3。\n- 平均等待时间：(6 + 0 + 3)/3 = 3。\n- 比之前的情况好得多。\n\n\
    ## FCFS 的问题\n\n- 很容易出现*护航效应*：所有进程都在等待一个大进程释放 CPU。**CPU 和设备利用率可能会很低。** *为什么？*\n\
    - 它有利于长进程，而对短进程可能不公平。如果你那只需要 1 分钟的作业排在一个需要 10 小时的作业后面，会怎样？\n- 对于*分时系统*而言，它很麻烦，因为分时系统中每个用户都需要定期获得\
    \ CPU 的一部分时间。\n\n## 最短作业优先（SJF）调度\n\n- 将每个进程与其**下一次CPU突发的长度**关联起来。\n- 当必须从就绪队列中选择一个进程时，选择下一次CPU突发最短的进程。\n\
    - 因此，就绪队列中的进程按下一次CPU突发的长度排序。\n- SJF 可以是不可抢占的或可抢占的。\n  - 不可抢占：一旦 CPU 分配给进程，在其完成本次\
    \ CPU 突发之前不能被抢占。\n  - 可抢占：如果有新进程到达，其 CPU 突发长度小于当前执行进程的剩余时间，则进行抢占。这种方案称为最短剩余时间优先。\n\
    - SJF 是最优的——对于给定的一组进程，它能获得最小的平均等待时间。\n\n## SJF 可证明是最优的\n\n- 每次我们把短作业放在长作业之前，都会减少平均等待时间。\n\
    - 我们可以调换乱序的作业，直到所有作业都有序。\n- 如果作业已经有序，则作业调换不可能发生。\n\n```\nA waits 0\nB waits a\n\
    a\nA\nB\naverage = a/2\n\nB waits 0\nA waits b\nb\na\nB\nA\naverage = b/2\n```\n\
    \n## 可抢占 SJF 示例\n\n| 进程 | 到达时间 | 突发时间 |\n|---|---|---|\n| P₁ | 0 | 7 |\n| P₂ |\
    \ 2 | 4 |\n| P₃ | 4 | 1 |\n| P₄ | 5 | 4 |\n\n- SJF（可抢占）\n\n  ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_303_0.png)\n\
    \n- 平均等待时间 = (9 + 1 + 0 + 2)/4 = 3\n\n## 我们如何知道下一次 CPU 突发？\n\n- 如果这个问题得不到很好的回答，SJF\
    \ 就无法用于 CPU 调度。\n- 我们尝试预测下一次 CPU 突发！\n- 可以通过使用前几次 CPU 突发的长度来完成——指数平均 (指数平均)。\n\
    \n## 下一次 CPU 突发长度的预测\n\nα = 1/2  \nτ₀ = 10\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_306_0.png)\n\
    \n| 序列 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | ... |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | CPU突发 (tᵢ) | 6 | 4 | 6 | 4 | 13 | 13 | 13 | 13 | ... |\n| 预测 (τᵢ) | 10 | 8 |\
    \ 6 | 6 | 5 | 9 | 11 | 12 | ... |\n\n## 指数平均示例\n\n- 如果我们展开公式，就得到：\n\n  τₙ₊₁ =\
    \ α tₙ + (1 - α) α tₙ₋₁ + … + (1 - α)ʲ α tₙ₋ⱼ + … + (1 - α)ⁿ⁺¹ τ₀\n\n- 由于 α 和\
    \ (1 - α) 都小于或等于 1，所以每一项的权重都比前一项小。\n\n## SJF 的问题\n\n- 准确估计下一次突发时间值很困难。\n- SJF\
    \ 有利于短作业。因此，一些长作业可能根本没有机会运行。这就是*饥饿*。\n\n## 优先级调度\n\n- 优先级通常由**某一固定范围的数字**表示，例如\
    \ 0~7。\n- 在本文中，我们假设数字越小代表优先级越高。\n- 调度器总是从就绪队列中选择**优先级最高**的进程来运行。\n- FCFS 和 SJF\
    \ 是否属于优先级调度的**特例**？（**为什么？**）\n- 优先级调度可以是**不可抢占**的或**可抢占**的。\n- 在可抢占的优先级调度中，如果新到达的进程优先级高于正在运行的进程，则后者被抢占。\n\
    - 可能会出现**无限阻塞**（或**饥饿**）：低优先级进程可能永远没有机会运行。\n\n"
