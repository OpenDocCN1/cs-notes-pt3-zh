    江苏省网络与信息安全重点实验室\n\n## 第6章 进程同步\n\n### 大纲\n\n- 背景\n- 临界区问题\n- 同步硬件\n- 信号量\n- 经典同步问题\n\
    - 管程\n- 同步示例\n\n### 背景\n\n- 并发访问共享数据可能导致数据不一致。\n- 保持数据一致性需要相应的机制，以确保协作进程的有序执行。\n\
    - 针对**有界缓冲区问题**（第3章）的共享内存解决方案允许缓冲区中同时最多容纳 *n* − 1 个条目。\n- 假设我们要提供一个解决方案，来解决生产者-消费者问题，并填满**所有**缓冲区。\n\
    \  - 为此，可以使用一个整型变量 **count** 来记录已满缓冲区的数量。\n\n### 有界缓冲区\n\n- 共享数据\n\n```\n#define\
    \ BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\nint counter = 0;\n```\n\n- 生产者进程\n\n```\nitem nextProduced;\n\
    while (1) {\n    while (counter == BUFFER_SIZE);\n        /* do nothing */\n \
    \   buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n    counter++;\n\
    }\n```\n\n- **消费者进程**\n\n```\nitem nextConsumed;\nwhile (1) {\n    while (counter\
    \ == 0);\n        /* do nothing */\n    nextConsumed = buffer[out];\n    out =\
    \ (out + 1) % BUFFER_SIZE;\n    counter--;\n}\n```\n\n"
