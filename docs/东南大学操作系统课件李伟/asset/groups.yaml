    # Single and Multithreaded Processes


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_204_0.png)'
  md: "\n## Buffering\n\n- Queue of messages attached to the link implemented in one\
    \ of three ways.\n  - **Zero capacity** – 0 messages\n    Sender must wait for\
    \ receiver.\n  - **Bounded capacity** – finite length of *n* messages\n    Sender\
    \ must wait if link full.\n  - **Unbounded capacity** – infinite length\n    Sender\
    \ never blocks.\n\n## Client-Server Communication\n\n- Sockets\n- Remote Procedure\
    \ Calls\n- Remote Method Invocation (Java)\n\n### Sockets\n\n- A socket is defined\
    \ as an *endpoint for communication*.\n- Concatenation of IP address and port\n\
    - The socket 161.25.19.8:1625 refers to port 1625 on host 161.25.19.8\n- Communication\
    \ exists between a pair of sockets.\n\n### Socket Communication\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_189_0.png)\n\
    \nhost X\n(146.86.5.20)\n\nsocket\n(146.86.5.20:1625)\n\nweb server\n(161.25.19.8)\n\
    \nsocket\n(161.25.19.8:80)\n\n- All connections must be unique.\n- Common and\
    \ Efficient\n- A low-level form of communication between distributed processes\n\
    - Sockets allow only an unstructured stream of bytes to be exchanged between the\
    \ communicating processes.\n\n### Remote Procedure Calls\n\n- Remote procedure\
    \ call (RPC) **abstracts procedure calls between processes on networked systems.**\n\
    - Messages exchanged in RPC communication are **well structured.**\n- Each message\
    \ contains **an identifier of the function** and **the parameters** to pass to\
    \ it.\n- The function is executed and any output is sent back to the requester\
    \ in a separate message.\n- RPC allows a client to invoke a procedure on a remote\
    \ host as it would invoke a procedure locally.\n- **Stubs** – client-side proxy\
    \ for the actual procedure on the server.\n- **The client-side stub** locates\
    \ the port on the server and *marshals* the parameters.\n- **The server-side stub**\
    \ receives this message, unpacks the marshaled parameters, and performs the procedure\
    \ on the server.\n- Some Issues\n  - The differences in data representation on\
    \ the client and server machines.\n    - External Data Representation (XDR)\n\
    \  - The semantics of a call\n    - At most once: attaching a timestamp to each\
    \ message.\n    - Exactly once: ACK Messages\n\n### Execution of RPC\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_194_0.png)\n\
    \n### Remote Method Invocation\n\n- **Remote Method Invocation (RMI) is a Java\
    \ mechanism similar to RPCs.**\n- **RMI allows a Java program on one machine to\
    \ invoke a method on a remote object.**\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_195_0.png)\n\
    \n- RMI implements the remote object using **stubs** and **skeletons**.\n- Stub\
    \ is a proxy for the remote object and resides with the client.\n- Skeleton resides\
    \ with the server, receives the messages from stub and invokes the desired method\
    \ on the server.\n\n### Marshalling Parameters\n\nclient\n\n```text\nval = server.someMethod(A,B)\n\
    ```\n\nstub\n\nremote object\n\n```text\nboolean someMethod (Object x, Object\
    \ y)\n{\n  implementation of someMethod\n  ...\n}\n```\n\nskeleton\n\nA, B, someMethod\n\
    \nboolean return value\n\n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\
    \n江苏省网络与信息安全重点实验室\n\n### Outline\n\n- Overview\n- Multithreading Models\n- Thread\
    \ Libraries\n- Threading Issues\n- Operating System Examples\n\n### What is a\
    \ thread? (1/2)\n\n- A thread is a flow of control within a process.\n- A thread,\
    \ also known as a lightweight process (LWP), is a basic unit of CPU execution.\n\
    - A traditional process, or heavyweight process, has a single thread of control.\n\
    - A multithreaded process contains several different flows of control within the\
    \ same address space.\n\n### Single and Multithreaded Processes\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_204_0.png)\n"
  mdcn: "\n\n## 缓冲\n\n- 附加到链路上的消息队列，以三种方式之一实现。\n  - **零容量** – 0 条消息\n    发送者必须等待接收者。\n\
    \  - **有界容量** – 有限长度，*n* 条消息\n    如果链路已满，发送者必须等待。\n  - **无界容量** – 无限长度\n    发送者从不阻塞。\n\
    \n## 客户端-服务器通信\n\n- 套接字\n- 远程过程调用\n- 远程方法调用（Java）\n\n### 套接字\n\n- 套接字被定义为*通信的端点*。\n\
    - IP 地址和端口的连接\n- 套接字 161.25.19.8:1625 指的是主机 161.25.19.8 上的端口 1625\n- 通信存在于一对套接字之间。\n\
    \n### 套接字通信\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_189_0.png)\n\n主机 X\n(146.86.5.20)\n\
    \n套接字\n(146.86.5.20:1625)\n\nWeb 服务器\n(161.25.19.8)\n\n套接字\n(161.25.19.8:80)\n\
    \n- 所有连接必须是唯一的。\n- 常见且高效\n- 分布式进程之间的一种低级通信形式\n- 套接字仅允许在通信进程之间交换非结构化字节流。\n\n###\
    \ 远程过程调用\n\n- 远程过程调用（RPC）**抽象了网络系统上进程之间的过程调用。**\n- RPC 通信中交换的消息是**结构良好的。**\n-\
    \ 每条消息包含**函数标识符**和**要传递的参数**。\n- 函数被执行，任何输出都会在单独的消息中发送回请求者。\n- RPC 允许客户端像在本地调用过程一样在远程主机上调用过程。\n\
    - **存根（Stubs）** – 服务器上实际过程的客户端代理。\n- **客户端存根**定位服务器上的端口，并*编组（marshal）*参数。\n- **服务器端存根**接收此消息，解包已编组的参数，并在服务器上执行该过程。\n\
    - 一些问题\n  - 客户端和服务器机器上数据表示的差异。\n    - 外部数据表示（XDR）\n  - 调用的语义\n    - 至多一次：为每条消息附加时间戳。\n\
    \    - 恰好一次：ACK 消息\n\n### RPC 的执行\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_194_0.png)\n\
    \n### 远程方法调用\n\n- **远程方法调用（RMI）是一种类似于 RPC 的 Java 机制。**\n- **RMI 允许一台机器上的 Java\
    \ 程序调用远程对象上的方法。**\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_195_0.png)\n\n-\
    \ RMI 使用**存根（stubs）**和**骨架（skeletons）**实现远程对象。\n- 存根是远程对象的代理，驻留在客户端。\n- 骨架驻留在服务器端，接收来自存根的消息，并在服务器上调用所需的方法。\n\
    \n### 编组参数\n\n客户端\n\n```text\nval = server.someMethod(A,B)\n```\n\n存根\n\n远程对象\n\
    \n```text\nboolean someMethod (Object x, Object y)\n{\n  implementation of someMethod\n\
    \  ...\n}\n```\n\n骨架\n\nA、B、someMethod\n\n布尔返回值\n\n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\
    \n计算机科学与工程学院、软件学院\n\n江苏省网络与信息安全重点实验室\n\n### 大纲\n\n- 概述\n- 多线程模型\n- 线程库\n- 线程问题\n\
    - 操作系统示例\n\n### 什么是线程？(1/2)\n\n- 线程是进程内的控制流。\n- 线程，也称为轻量级进程（LWP），是 CPU 执行的基本单元。\n\
    - 传统进程，或称为重量级进程，具有单一的控制线程。\n- 多线程进程在同一地址空间内包含多个不同的控制流。\n\n### 单线程和多线程进程\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_204_0.png)\n\
    \n"
