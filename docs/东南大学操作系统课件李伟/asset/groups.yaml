    # Thread Cancellation


    +   - With asynchronous cancellation, if the target thread owns some system-wide
    resources, the system may not be able to reclaim all recourses.

    +   - With deferred cancellation, the target thread determines the time to terminate
    itself. Reclaiming resources is not a problem.

    +   - Most systems implement asynchronous cancellation for processes (e.g., use
    the kill system call) and threads.

    +   - Pthread supports deferred cancellation.'
