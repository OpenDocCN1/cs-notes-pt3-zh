  md: "\n## Aging\n\n- Aging is a technique to overcome the starvation problem.\n\
    - *Aging*: gradually increases the priority of processes that wait in the system\
    \ for a long time.\n- Example:\n  - If 0 is the highest (*resp.*, lowest) priority,\
    \ then we could decrease (*resp.*, increase) the value of the priority of a waiting\
    \ process by 1 every fixed period (*e.g.*, every minute).\n\n## Round Robin (RR)\n\
    \n- RR is designed especially for **time-sharing systems**.\n- RR is similar to\
    \ FCFS, except that each process is assigned a **time quantum/slice**.\n- All\
    \ processes in the ready queue are in a **FIFO** list. When the CPU is free, the\
    \ scheduler picks the **first** and lets it run for **one time quantum**.\n- If\
    \ the process uses CPU for less than one time quantum, it will release the CPU\
    \ voluntarily.\n- Otherwise, when one time quantum is up, that process is preempted\
    \ by the scheduler and moved to the tail of the list.\n\n### Example of RR with\
    \ Time Quantum = 20\n\n| Process | Burst Time |\n|---|---:|\n| P₁ | 53 |\n| P₂\
    \ | 17 |\n| P₃ | 68 |\n| P₄ | 24 |\n\nThe Gantt chart is:\n\n|   | P₁ | P₂ | P₃\
    \ | P₄ | P₁ | P₃ | P₄ | P₁ | P₃ | P₃ |\n|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n\
    | 0 | 20 | 37 | 57 | 77 | 97 | 117 | 121 | 134 | 154 | 162 |\n\nTypically, higher\
    \ average turnaround time than SJF, but better response time.\n\n### RR Scheduling\
    \ Issues\n\n- If time quantum is too large, RR reduces to FCFS.\n- If time quantum\
    \ is too small, RR becomes processor sharing.\n- Context switching may affect\
    \ RR’s performance.\n  - Shorter time quantum means more context switches.\n-\
    \ Turnaround time also depends on the size of time quantum.\n- In general, 80%\
    \ of the CPU bursts should be shorter than the time quantum.\n\n### Time Quantum\
    \ and Context Switch Time\n\n| process time | time quantum | context switches\
    \ |\n|---:|---:|---:|\n| 10 | 12 | 0 |\n| 10 | 6 | 1 |\n| 10 | 1 | 9 |\n\n###\
    \ Turnaround Time Varies With the Time Quantum\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_318_0.png)\n\
    \n| process | time |\n|---|---:|\n| P₁ | 6 |\n| P₂ | 3 |\n| P₃ | 1 |\n| P₄ | 7\
    \ |\n\n## Multilevel Queue\n\n- Ready queue is partitioned into separate queues.\n\
    \  - foreground (interactive)\n  - background (batch)\n- Each process is assigned\
    \ permanently to one queue based on some properties of the process (e.g., memory\
    \ usage, priority, process type).\n- Each queue has its own scheduling algorithm.\n\
    \  - foreground – RR\n  - background – FCFS\n\n### Ready Queue\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_320_0.png)\n\
    \n- A process P can run only if all queues above the queue that contains P are\
    \ empty.\n- When a process is running and a process in a higher priority queue\
    \ comes in, the running process is preempted.\n\n- Scheduling must be done between\
    \ the queues.\n- Fixed priority scheduling; (i.e., serve all from foreground then\
    \ from background). Possibility of starvation.\n- Time slice – each queue gets\
    \ a certain amount of CPU time which it can schedule amongst its processes; i.e.,\
    \ 80% to foreground in RR, 20% to background in FCFS.\n\n## Multilevel Feedback\
    \ Queue\n\n- *Multilevel queue with feedback scheduling* is similar to multilevel\
    \ queue; however, it allows processes to move between queues.\n  - aging can be\
    \ implemented this way.\n- If a process uses more (*resp.*, less) CPU time, it\
    \ is moved to a queue of lower (*resp.*, higher) priority.\n- As a result, I/O-bound\
    \ (*resp.*, CPU-bound) processes will be in higher (*resp.*, lower) priority queues.\n\
    \n### Example of Multilevel Feedback Queue\n\n- Three queues:\n  - Q₀ – time quantum\
    \ 8 milliseconds\n  - Q₁ – time quantum 16 milliseconds\n  - Q₂ – FCFS\n- Scheduling:\n\
    \  - A new job enters Q₀, which is served by RR. When it gains CPU, the job runs\
    \ for 8 milliseconds. If it does not finish in 8 milliseconds, the job is moved\
    \ to Q₁.\n  - At Q₁, the job is again served by RR and runs for 16 additional\
    \ milliseconds. If it still does not complete, it is preempted and moved to queue\
    \ Q₂.\n"
  mdcn: "\n\n## Aging\n\n- Aging 是一种克服饥饿问题的技术。\n- *Aging*：逐渐提高在系统中长时间等待的进程的优先级。\n\
    - Example:\n  - 如果 0 是最高（*resp.*，最低）优先级，则我们可以每隔固定周期（*e.g.*，每分钟）将等待进程的优先级值减少（*resp.*，增加）1。\n\
    \n## Round Robin (RR)\n\n- RR 专门为 **分时系统** 设计。\n- RR 与 FCFS 相似，只是每个进程被分配一个 **时间片/量子**。\n\
    - 就绪队列中的所有进程都在一个 **FIFO** 列表中。当 CPU 空闲时，调度程序选择 **第一个** 并让它运行 **一个时间量子**。\n- 如果进程使用的\
    \ CPU 时间少于一个时间量子，它会自愿释放 CPU。\n- 否则，当一个时间量子用完时，该进程会被调度程序抢占并移动到列表的尾部。\n\n### Example\
    \ of RR with Time Quantum = 20\n\n| Process | Burst Time |\n|---|---:|\n| P₁ |\
    \ 53 |\n| P₂ | 17 |\n| P₃ | 68 |\n| P₄ | 24 |\n\nThe Gantt chart is:\n\n|   |\
    \ P₁ | P₂ | P₃ | P₄ | P₁ | P₃ | P₄ | P₁ | P₃ | P₃ |\n|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n\
    | 0 | 20 | 37 | 57 | 77 | 97 | 117 | 121 | 134 | 154 | 162 |\n\nTypically, higher\
    \ average turnaround time than SJF, but better response time.\n\n### RR Scheduling\
    \ Issues\n\n- 如果时间量子过大，RR 会退化为 FCFS。\n- 如果时间量子过小，RR 变成处理器共享。\n- 上下文切换可能会影响 RR\
    \ 的性能。\n  - 时间量子越短，上下文切换越多。\n- 周转时间也取决于时间量子大小。\n- 通常，80% 的 CPU 突发时间应短于时间量子。\n\n\
    ### Time Quantum and Context Switch Time\n\n| process time | time quantum | context\
    \ switches |\n|---:|---:|---:|\n| 10 | 12 | 0 |\n| 10 | 6 | 1 |\n| 10 | 1 | 9\
    \ |\n\n### Turnaround Time Varies With the Time Quantum\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_318_0.png)\n\
    \n| process | time |\n|---|---:|\n| P₁ | 6 |\n| P₂ | 3 |\n| P₃ | 1 |\n| P₄ | 7\
    \ |\n\n## Multilevel Queue\n\n- 就绪队列被划分为独立的队列。\n  - foreground (interactive)\n\
    \  - background (batch)\n- 每个进程根据进程的某些属性（例如，内存使用量、优先级、进程类型）永久分配到一个队列。\n- 每个队列都有自己的调度算法。\n\
    \  - foreground – RR\n  - background – FCFS\n\n### Ready Queue\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_320_0.png)\n\
    \n- 进程 P 只有在包含 P 的队列之上的所有队列都为空时才能运行。\n- 当一个进程正在运行时，如果有更高优先级队列中的进程到来，则正在运行的进程会被抢占。\n\
    \n- 必须在队列之间进行调度。\n- 固定优先级调度；即，先服务 foreground 中的所有进程，然后再服务 background。可能导致饥饿。\n\
    - 时间片 – 每个队列获得一定的 CPU 时间，可在其进程中进行调度；即，80% 分配给 foreground 的 RR，20% 分配给 background\
    \ 的 FCFS。\n\n## Multilevel Feedback Queue\n\n- *Multilevel queue with feedback\
    \ scheduling* 与多级队列类似；然而，它允许进程在队列之间移动。\n  - aging 可以通过这种方式实现。\n- 如果一个进程使用更多（*resp.*，更少）CPU\
    \ 时间，它会被移动到较低（*resp.*，较高）优先级的队列。\n- 结果是，I/O-bound（*resp.*，CPU-bound）进程将位于较高（*resp.*，较低）优先级的队列中。\n\
    \n### Example of Multilevel Feedback Queue\n\n- 三个队列：\n  - Q₀ – time quantum 8\
    \ milliseconds\n  - Q₁ – time quantum 16 milliseconds\n  - Q₂ – FCFS\n- Scheduling:\n\
    \  - 一个新作业进入 Q₀，由 RR 服务。当它获得 CPU 时，作业运行 8 毫秒。如果它在 8 毫秒内未完成，作业将被移动到 Q₁。\n  - 在\
    \ Q₁ 中，作业再次由 RR 服务并运行额外的 16 毫秒。如果它仍然未完成，则会被抢占并移动到队列 Q₂。\n\n"
