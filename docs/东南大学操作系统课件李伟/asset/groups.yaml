    \n# 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\n江苏省网络与信息安全重点实验室\n\
    \n# 第1章 引言\n\n## 大纲\n\n- 什么是操作系统？\n- 操作系统相关的硬件\n- 操作系统的发展\n\n## 计算机系统组成\n\n- **硬件**\
    \ – 提供基本的计算资源（CPU、内存、I/O设备等）。\n- **操作系统** – 控制并协调各用户的各种程序对硬件的使用。\n- **程序** – （编译器、数据库、视频、游戏、邮件系统、QQ等）用于解决用户问题。\n\
    - **用户**（人、机器、其他计算机）。\n\n## 计算机系统组件的抽象视图\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_13_0.png)\n\
    \n## 用户视角\n\n- **PC用户**：操作系统是**一个程序**，为使用硬件提供易于使用的界面。\n- **大型机/小型机用户**：操作系统是**一个程序**，有助于最大化系统资源利用率。\n\
    - **工作站用户**：操作系统是**一个程序**，旨在兼顾个人可用性与资源利用率。\n\n## 系统视角\n\n- *资源分配器*：操作系统将系统硬件资源分配给用户程序，并从用户程序处回收资源。\n\
    - *控制程序*：操作系统控制用户程序的执行，以防止错误和不当使用计算机。\n\n## 什么是操作系统？（1/3）\n\n- 对于什么是操作系统，*没有*普遍的定义。\n\
    - 一个常见的定义是，操作系统是计算机上始终运行的*内核程序*。所有其他程序都是系统/应用程序。\n\n## 什么是操作系统？（2/3）\n\n- 操作系统是一组程序，充当计算机用户与计算机硬件之间的中介。\n\
    \  - 使计算机系统便于使用。\n  - 执行用户程序，使解决用户问题更加容易。\n  - 管理计算机硬件。\n\n## 什么是操作系统？（3/3）\n\n\
    - 总体视图\n  - 资源分配器、控制程序、内核程序\n- 操作系统的目标\n  - 主要目标：计算机系统的高效运行。\n\n操作系统的构成问题已变得越来越重要。\n\
    \n## 大纲\n\n- 什么是操作系统？\n- 操作系统相关的硬件\n- 操作系统的发展\n\n## 计算机系统体系结构\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_20_0.png)\n\
    \n- 操作系统是如何进入系统的？\n- 我们如何请求服务？\n- 操作系统如何得知发生了某件事？\n\n"
