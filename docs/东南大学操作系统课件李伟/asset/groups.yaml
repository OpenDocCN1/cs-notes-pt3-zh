    \n- Waiting time for P₁ = 6; P₂ = 0; P₃ = 3.\n- Average waiting time: (6 + 0 +\
    \ 3)/3 = 3.\n- Much better than previous case.\n\n## FCFS Problems\n\n- It is\
    \ easy to have the *convoy effect*: all the processes wait for the one big process\
    \ to get off the CPU. **The utilization of CPU and Device may be low.** *Why?*\n\
    - It is in favor of long processes and may not be fair to those short ones. What\
    \ if your 1-minute job is behind a 10-hour job?\n- It is troublesome for *time-sharing\
    \ systems*, where each user needs to get a share of the CPU at regular intervals.\n\
    \n## Shortest-Job-First (SJF) Scheduling\n\n- Associate each process with **the\
    \ length of its next CPU burst**.\n- When a process must be selected from the\
    \ ready queue, the process with the smallest next CPU burst is selected.\n- Thus,\
    \ the processes in the ready queue are sorted by next CPU burst length.\n- SJF\
    \ can be nonpreemptive or preemptive.\n  - Nonpreemptive – once CPU is given to\
    \ the process, it cannot be preempted until it completes its CPU burst.\n  - Preemptive\
    \ – if a new process arrives with a CPU burst length less than the remaining time\
    \ of the current executing process, preempt. This scheme is known as the Shortest-Remaining-Time-First.\n\
    - SJF is optimal – gets minimum average waiting time for a given set of processes.\n\
    \n## SJF is provably optimal\n\n- Every time we make a short job before a long\
    \ job, we reduce average waiting time.\n- We may switch out of order jobs until\
    \ all jobs are in order.\n- If the jobs are sorted, job switching is impossible.\n\
    \n```\nA waits 0\nB waits a\na\nA\nB\naverage = a/2\n\nB waits 0\nA waits b\n\
    b\na\nB\nA\naverage = b/2\n```\n\n## Example of Preemptive SJF\n\n| Process |\
    \ Arrival Time | Burst Time |\n|---|---|---|\n| P₁ | 0 | 7 |\n| P₂ | 2 | 4 |\n\
    | P₃ | 4 | 1 |\n| P₄ | 5 | 4 |\n\n- SJF (preemptive)\n\n  ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_303_0.png)\n\
    \n- Average waiting time = (9 + 1 + 0 + 2)/4 = 3\n\n## How do we know the Next\
