  - '[PAGE 416]


    # Monitors: Mutual Exclusion


    +   - *No more than one* *process* can be executing *within* a monitor. Thus,
    *mutual exclusion* is guaranteed within a monitor.

    +   - When a process calls a monitor procedure and enters the monitor successfully,
    it is the *only* process executing in the monitor.

    +   - When a process calls a monitor procedure and the monitor has a process running,
    the caller will be *blocked* *outside of the monitor*.'
