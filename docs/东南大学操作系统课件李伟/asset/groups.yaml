    # # Main-Memory Management


    +   - Memory is **a large array** of words or bytes, each with its own address.

    +   - It is generally the **only large storage device** that the CPU is able to
    address and access directly.

    +   - Main memory is **a volatile storage device**.

    +   - Activities for main-memory management

    +     - Record the usage of Main-memory

    +     - Allocate and deallocate memory space as needed'
  - '[PAGE 78]


    # File Management (1/2)


    +   - There are different types of physical media to store information. Each of
    them has its own characteristics and physical organization.

    +     - Access speed

    +     - Data-transfer rate

    +     - Access method (sequential or random)

    +   - Operating System provides a uniform logical view of information storage,
    i.e., file.'
  - '[PAGE 79]


    # File Management (2/2)


    +   - A file is **a collection of related information** (programs and data) defined
    by its creator.

    +   - Activities for file management

    +     - File creation and deletion

    +     - Directory creation and deletion

    +     - Support of primitives for manipulating files and directories

    +     - Mapping files onto secondary storage

    +     - File backup on stable (nonvolatile) storage media'
  - '[PAGE 80]


    # # Secondary-Storage Management


    +   - Since main memory (*primary storage*) is **volatile** and too small to accommodate
    all data and programs permanently, the computer system must provide **secondary
    storage** to back up main memory.

    +   - Most modern computer systems use **disks** as the principle on-line storage
    medium, for both programs and data.'
  md: "\n## Clustered Systems\n\n- A clustered system has two or more individual systems\
    \ **shared storage** and **closely linked** via LAN networking.\n- The key of\
    \ clustered system is **high availability**.\n- **Asymmetric Clustering**\n  -\
    \ One machine is in **hot-standby** mode while others are running applications.\n\
    \  - The hot-standby machine (*i.e.*, does nothing but) monitors other machines\
    \ and becomes active if one server fails.\n- **Symmetric Clustering**\n  - Two\
    \ or more hosts are running applications and monitor each other.\n  - This is\
    \ more efficient as it uses all available hardware\n\n## Real-Time Systems\n\n\
    - Often used as a control device in a dedicated application such as controlling\
    \ scientific experiments, medical imaging systems, industrial control systems,\
    \ and some display systems.\n- A real-time operating system has well-defined,\
    \ **fixed time constraints**.\n- Processing *must* be done within the defined\
    \ constraints, or the system will fail.\n- **Embedded systems** almost always\
    \ run real-time operating systems\n- Real-Time systems may be either *hard* or\
    \ *soft* real-time.\n  - *Hard Real-Time Systems* guarantee that critical tasks\
    \ be completed on time.\n  - *Soft Real-Time Systems* prioritize critical tasks.\
    \ That is, a critical task get priority over other tasks, and retains that priority\
    \ until it completes.\n\n## Handheld Systems\n\n- Personal Digital Assistants\
    \ (PDAs)\n- Pocket-PC\n- Cellular telephones\n- Advantages\n  - Convenience and\
    \ Portability\n- Issues\n  - Limited memory\n  - Slow processors\n  - Small display\
    \ screens\n\n操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\n江苏省网络与信息安全重点实验室\n\
    \n## Chapter 2 Operating-System Structures\n\n## Outline\n\n- Operating System\
    \ Functions\n- Operating System Services\n- Operating System Interfaces\n- Operating\
    \ System Structure\n- Operating System Design and Implementation\n\n## Common\
    \ Functions of OS\n\n- Process Management\n- Main Memory Management\n- File Management\n\
    - Secondary-Storage Management\n- I/O System Management\n\n## Process Management\n\
    \n- A *process* is a program in execution\n- System Processes and User Processes\n\
    - Activities for process management\n  - Process creation and deletion\n  - process\
    \ suspension and resumption\n  - Provision of mechanisms for\n    - process synchronization\n\
    \    - process communication\n    - Deadlock handling\n\n## Main-Memory Management\n\
    \n- Memory is **a large array** of words or bytes, each with its own address.\n\
    - It is generally the **only large storage device** that the CPU is able to address\
    \ and access directly.\n- Main memory is **a volatile storage device**.\n- Activities\
    \ for main-memory management\n  - Record the usage of Main-memory\n  - Allocate\
    \ and deallocate memory space as needed\n\n## File Management\n\n- There are different\
    \ types of physical media to store information. Each of them has its own characteristics\
    \ and physical organization.\n  - Access speed\n  - Data-transfer rate\n  - Access\
    \ method (sequential or random)\n- Operating System provides a uniform logical\
    \ view of information storage, i.e., file.\n- A file is **a collection of related\
    \ information** (programs and data) defined by its creator.\n- Activities for\
    \ file management\n  - File creation and deletion\n  - Directory creation and\
    \ deletion\n  - Support of primitives for manipulating files and directories\n\
    \  - Mapping files onto secondary storage\n  - File backup on stable (nonvolatile)\
    \ storage media\n\n## Secondary-Storage Management\n\n- Since main memory (*primary\
    \ storage*) is **volatile** and too small to accommodate all data and programs\
    \ permanently, the computer system must provide **secondary storage** to back\
    \ up main memory.\n- Most modern computer systems use **disks** as the principal\
    \ on-line storage medium, for both programs and data.\n"
  mdcn: "\n\n## 集群系统\n\n- 集群系统由两个或多个独立系统通过局域网连接并**共享存储**且**紧密关联**组成。\n- 集群系统的关键是**高可用性**。\n\
    - **非对称集群**\n  - 一台机器处于**热备份**模式，而其他机器正在运行应用程序。\n  - 热备份机器（*即*，除了监视其他机器外什么都不做）在某台服务器故障时变为活动状态。\n\
    - **对称集群**\n  - 两台或多台主机正在运行应用程序并相互监视。\n  - 这更高效，因为它利用了所有可用硬件\n\n## 实时系统\n\n- 通常用作专用应用中的控制设备，例如控制科学实验、医学成像系统、工业控制系统以及某些显示系统。\n\
    - 实时操作系统具有明确定义的、**固定的时间约束**。\n- 处理*必须*在定义的时间约束内完成，否则系统将失败。\n- **嵌入式系统**几乎总是运行实时操作系统\n\
    - 实时系统可能是*硬*实时或*软*实时。\n  - *硬实时系统*保证关键任务按时完成。\n  - *软实时系统*优先处理关键任务。即关键任务优先于其他任务，并在完成前保持该优先级。\n\
    \n## 手持系统\n\n- 个人数字助理（PDA）\n- Pocket-PC\n- 移动电话\n- 优点\n  - 便利性和便携性\n- 问题\n  -\
    \ 内存有限\n  - 处理器缓慢\n  - 显示屏小\n\n操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\
    \n江苏省网络与信息安全重点实验室\n\n## Chapter 2 Operating-System Structures\n\n## Outline\n\n\
    - Operating System Functions\n- Operating System Services\n- Operating System\
    \ Interfaces\n- Operating System Structure\n- Operating System Design and Implementation\n\
    \n## Common Functions of OS\n\n- Process Management\n- Main Memory Management\n\
    - File Management\n- Secondary-Storage Management\n- I/O System Management\n\n\
    ## Process Management\n\n- A *process* is a program in execution\n- System Processes\
    \ and User Processes\n- Activities for process management\n  - Process creation\
    \ and deletion\n  - process suspension and resumption\n  - Provision of mechanisms\
    \ for\n    - process synchronization\n    - process communication\n    - Deadlock\
    \ handling\n\n## Main-Memory Management\n\n- Memory is **a large array** of words\
    \ or bytes, each with its own address.\n- It is generally the **only large storage\
    \ device** that the CPU is able to address and access directly.\n- Main memory\
    \ is **a volatile storage device**.\n- Activities for main-memory management\n\
    \  - Record the usage of Main-memory\n  - Allocate and deallocate memory space\
    \ as needed\n\n## File Management\n\n- There are different types of physical media\
    \ to store information. Each of them has its own characteristics and physical\
    \ organization.\n  - Access speed\n  - Data-transfer rate\n  - Access method (sequential\
    \ or random)\n- Operating System provides a uniform logical view of information\
    \ storage, i.e., file.\n- A file is **a collection of related information** (programs\
    \ and data) defined by its creator.\n- Activities for file management\n  - File\
    \ creation and deletion\n  - Directory creation and deletion\n  - Support of primitives\
    \ for manipulating files and directories\n  - Mapping files onto secondary storage\n\
    \  - File backup on stable (nonvolatile) storage media\n\n## Secondary-Storage\
    \ Management\n\n- Since main memory (*primary storage*) is **volatile** and too\
    \ small to accommodate all data and programs permanently, the computer system\
    \ must provide **secondary storage** to back up main memory.\n- Most modern computer\
    \ systems use **disks** as the principal on-line storage medium, for both programs\
    \ and data.\n\n"
