    \    - establish a *communication link* between them\n    - exchange messages\
    \ via send/receive\n\n- **Implementation of communication link**\n    - physical\
    \ (e.g., shared memory, hardware bus)\n    - logical (e.g., logical properties)\n\
    \n## Implementation Questions\n\n- How are links established?\n- Can a link be\
    \ associated with more than two processes?\n- How many links can there be between\
    \ every pair of communicating processes?\n- What is the capacity of a link?\n\
    - Is the size of a message that the link can accommodate fixed or variable?\n\
    - Is a link unidirectional or bi-directional?\n\n## Indirect Communication\n\n\
    - **Operations**\n    - create a new mailbox\n    - send and receive messages\
    \ through mailbox\n    - destroy a mailbox\n- **Primitives are defined as:**\n\
    \    - send(*A, message*) – send a message to mailbox A\n    - receive(*A, message*)\
    \ – receive a message from mailbox A\n\n## Indirect Communication\n\n- **Mailbox\
    \ sharing**\n    - *P₁, P₂, and P₃* share mailbox A.\n    - *P₁* sends; *P₂* and\
    \ *P₃* receive.\n    - Who gets the message?\n\n- **Solutions**\n    - Allow a\
    \ link to be associated with at most two processes.\n    - Allow only one process\
