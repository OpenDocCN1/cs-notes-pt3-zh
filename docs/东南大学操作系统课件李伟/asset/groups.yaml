  - '[PAGE 361]


    # Race Condition


    +   - **Race condition** occurs, if:

    +     - two or more processes/threads access and manipulate the same data concurrently

    +     - the outcome of the execution depends on the particular order in which
    the access takes place.

    +   - To prevent race conditions, concurrent processes must be synchronized.'
  - '[PAGE 362]


    # Outline


    +   - Background

    +   - The Critical-Section Problem

    +   - Synchronization Hardware

    +   - Semaphores

    +   - Classical Problems of Synchronization

    +   - Monitors

    +   - Synchronization Examples'
  - '[PAGE 363]


    # # The Critical-Section Problem


    +   - *n* processes all competing to use some shared data

    +   - Each process has a **code segment**, called *critical section*, in which
    the shared data is changed.

    +   - **Problem** – ensure that when one process is executing in its critical
    section, no other process is allowed to execute in its critical section.'
  - '[PAGE 364]


    # # The Critical-Section Problem


    +   - Thus, the execution of critical sections must be **_mutually exclusive_**
    (e.g., at most one process can be in its critical section at any time).

    +   - The _**critical-section problem**_ is to design a protocol that processes
    can use to cooperate.'
  - "[PAGE 365]\n\n# The Critical Section Protocol\n\n```\ndo {\n  entry section\n\
    \  critical section\n  exit section\n  remainder section\n} while (1);\n```\n\n\
    +   - A critical section protocol consists of two parts: an *entry section* and\
    \ an *exit section*.\n\n+   - Between them is the critical section that must run\
    \ in a mutually exclusive way."
  - '[PAGE 366]


    # Solution to Critical-Section Problem


    +   - Any solution to the critical section problem must satisfy the following
    three conditions:

    +     - Mutual Exclusion (互斥)

    +     - Progress (空闲让进)

    +     - Bounded Waiting (有限等待)


    +   - Moreover, the solution cannot depend on relative speed of processes and
    scheduling policy.'
  - '[PAGE 367]


    # Mutual Exclusion


    +   - If a process **P** is executing in its critical section, then *no* other
    processes can be executing in their critical sections.

    +   - The **critical section protocol** should be capable of blocking processes
    that wish to enter but cannot.

    +   - Moreover, when the process that is executing in its critical section exits,
    the **critical section protocol** must be able to know this fact and allows a
    waiting process to enter.'
  - '[PAGE 368]


    # Progress


    +   - If **no** process is executing in its critical section and some processes
    wish to enter their critical sections, then

    +     - Only those processes that are waiting to enter can participate in the
    competition (to enter their critical sections).

    +     - No other process can influence this decision.

    +     - This decision cannot be postponed indefinitely.'
  - '[PAGE 369]


    # Bounded Waiting


    +   - After a process made a request to enter its critical section and before
    it is granted the permission to enter, there exists a bound on the number of times
    that other processes are allowed to enter.

    +   - Hence, even though a process may be blocked by other waiting processes,
    it will not be waiting forever.

    +   - Assume that each process executes at a nonzero speed

    +   - No assumption concerning relative speed of the n processes'
  md: "\n## Bounded-Buffer\n\n- **The statements**\n  - `counter++;`\n  - `counter--;`\n\
    \  - must be performed *atomically*.\n- Atomic operation means an operation that\
    \ completes in its entirety without interruption.\n\n- The statement `counter++`\
    \ may be implemented in machine language as:\n  - `register1 = counter`\n  - `register1\
    \ = register1 + 1`\n  - `counter = register1`\n- The statement `counter--` may\
    \ be implemented as:\n  - `register2 = counter`\n  - `register2 = register2 -\
    \ 1`\n  - `counter = register2`\n\n- If **both the producer and consumer attempt\
    \ to update the buffer concurrently**, the assembly language statements may get\
    \ interleaved.\n- Interleaving depends upon how the producer and consumer processes\
    \ are scheduled.\n\n- Assume counter is initially 5, what is it finally?\n\n###\
    \ Producer\n\n```\nregister1 = counter\nregister1 = register1 + 1\ncounter = register1\n\
    ```\n\n### Consumer\n\n```\nregister2 = counter\nregister2 = register2 - 1\ncounter\
    \ = register2\n```\n\n## Race Condition\n\n- **Race condition** occurs if:\n \
    \ - two or more processes/threads access and manipulate the same data concurrently\n\
    \  - the outcome of the execution depends on the particular order in which the\
    \ access takes place.\n- To prevent race conditions, concurrent processes must\
    \ be synchronized.\n\n## Outline\n\n- Background\n- The Critical-Section Problem\n\
    - Synchronization Hardware\n- Semaphores\n- Classical Problems of Synchronization\n\
    - Monitors\n- Synchronization Examples\n\n## The Critical-Section Problem\n\n\
    - *n* processes all competing to use some shared data\n- Each process has a **code\
    \ segment**, called *critical section*, in which the shared data is changed.\n\
    - **Problem** – ensure that when one process is executing in its critical section,\
    \ no other process is allowed to execute in its critical section.\n- Thus, the\
    \ execution of critical sections must be **_mutually exclusive_** (e.g., at most\
    \ one process can be in its critical section at any time).\n- The **_critical-section\
    \ problem_** is to design a protocol that processes can use to cooperate.\n\n\
    ### The Critical Section Protocol\n\n```\ndo {\n  entry section\n  critical section\n\
    \  exit section\n  remainder section\n} while (1);\n```\n\n- A critical section\
    \ protocol consists of two parts: an *entry section* and an *exit section*.\n\
    - Between them is the critical section that must run in a mutually exclusive way.\n\
    \n### Solution to Critical-Section Problem\n\n- Any solution to the critical section\
    \ problem must satisfy the following three conditions:\n  - Mutual Exclusion (互斥)\n\
    \  - Progress (空闲让进)\n  - Bounded Waiting (有限等待)\n- Moreover, the solution cannot\
    \ depend on relative speed of processes and scheduling policy.\n\n### Mutual Exclusion\n\
    \n- If a process **P** is executing in its critical section, then *no* other processes\
    \ can be executing in their critical sections.\n- The **critical section protocol**\
    \ should be capable of blocking processes that wish to enter but cannot.\n- Moreover,\
    \ when the process that is executing in its critical section exits, the **critical\
    \ section protocol** must be able to know this fact and allows a waiting process\
    \ to enter.\n\n### Progress\n\n- If **no** process is executing in its critical\
    \ section and some processes wish to enter their critical sections, then\n  -\
    \ Only those processes that are waiting to enter can participate in the competition\
    \ (to enter their critical sections).\n  - No other process can influence this\
    \ decision.\n  - This decision cannot be postponed indefinitely.\n\n### Bounded\
    \ Waiting\n\n- After a process made a request to enter its critical section and\
    \ before it is granted the permission to enter, there exists a bound on the number\
    \ of times that other processes are allowed to enter.\n- Hence, even though a\
    \ process may be blocked by other waiting processes, it will not be waiting forever.\n\
    - Assume that each process executes at a nonzero speed.\n- No assumption concerning\
    \ relative speed of the n processes.\n"
  mdcn: "\n\n## 有界缓冲区\n\n- **这些语句**\n  - `counter++;`\n  - `counter--;`\n  - 必须*原子地*执行。\n\
    - 原子操作是指一个完整执行且不被中断的操作。\n\n- 语句 `counter++` 在机器语言中可能实现为：\n  - `register1 = counter`\n\
    \  - `register1 = register1 + 1`\n  - `counter = register1`\n- 语句 `counter--`\
    \ 可能实现为：\n  - `register2 = counter`\n  - `register2 = register2 - 1`\n  - `counter\
    \ = register2`\n\n- 如果**生产者与消费者同时尝试更新缓冲区**，汇编语言语句可能会交错执行。\n- 交错取决于生产者和消费者进程是如何被调度的。\n\
    \n- 假设 counter 初始值为 5，它最终是多少？\n\n### 生产者\n\n```\nregister1 = counter\nregister1\
    \ = register1 + 1\ncounter = register1\n```\n\n### 消费者\n\n```\nregister2 = counter\n\
    register2 = register2 - 1\ncounter = register2\n```\n\n## 竞态条件\n\n- **竞态条件**发生在以下情况：\n\
    \  - 两个或多个进程/线程并发地访问和操作同一数据\n  - 执行的结果取决于访问发生的特定顺序。\n- 为了防止竞态条件，并发进程必须被同步。\n\n\
    ## 大纲\n\n- 背景\n- 临界区问题\n- 同步硬件\n- 信号量\n- 经典的同步问题\n- 管程\n- 同步示例\n\n## 临界区问题\n\n\
    - 所有 *n* 个进程都在竞争使用某些共享数据\n- 每个进程都有一段**代码段**，称为*临界区*，在其中修改共享数据。\n- **问题** – 确保当一个进程在其临界区中执行时，不允许其他进程执行其临界区。\n\
    - 因此，临界区的执行必须**_互斥_**（例如，任何时刻最多只有一个进程能处于其临界区）。\n- **_临界区问题_** 是设计一个供进程合作使用的协议。\n\
    \n### 临界区协议\n\n```\ndo {\n  entry section\n  critical section\n  exit section\n\
    \  remainder section\n} while (1);\n```\n\n- 临界区协议由两部分组成：一个*进入区*和一个*退出区*。\n- 它们之间是必须以互斥方式运行的临界区。\n\
    \n### 临界区问题的解决方案\n\n- 临界区问题的任何解决方案都必须满足以下三个条件：\n  - 互斥（Mutual Exclusion）\n  -\
    \ 空闲让进（Progress）\n  - 有限等待（Bounded Waiting）\n- 此外，解决方案不能依赖于进程的相对速度和调度策略。\n\n###\
    \ 互斥\n\n- 如果一个进程 **P** 正在其临界区中执行，那么*没有*其他进程可以在它们的临界区中执行。\n- **临界区协议**应该能够阻塞那些希望进入但不能进入的进程。\n\
    - 此外，当正在其临界区中执行的进程退出时，**临界区协议**必须能够知晓这一事实，并允许一个等待进程进入。\n\n### 空闲让进\n\n- 如果**没有**进程在其临界区中执行，并且有些进程希望进入其临界区，那么\n\
    \  - 只有那些等待进入的进程可以参与竞争（进入其临界区）。\n  - 没有其他进程可以影响这一决定。\n  - 这一决定不能被无限期推迟。\n\n###\
    \ 有限等待\n\n- 在一个进程请求进入其临界区之后、在它获得进入许可之前，其他进程被允许进入的次数存在一个上限。\n- 因此，即使一个进程可能被其他等待进程阻塞，它也不会永远等待。\n\
    - 假设每个进程以非零速度执行。\n- 对 n 个进程的相对速度不做任何假设。\n\n"
