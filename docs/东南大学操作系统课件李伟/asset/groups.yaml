    \ schemes are required for concurrent execution.\n- To obtain a reasonable response\
    \ time, a job needs to be swapped in and out of memory to the disk (*virtual memory*).\n\
    - Disk management must be provided.\n- Job synchronization mechanisms are needed.\n\
    - It may ensure that jobs do not get stuck in a deadlock.\n\n## 作业1\n\n从技术发展的角度，简要介绍批处理系统、多道程序系统和分时系统各自的技术特性。（在该技术出现以前系统存在哪些问题，该技术是如何解决这些问题的）\n\
    \n## Desktop Systems\n\n- Personal Computers – computer system dedicated to a\
    \ single user.\n- I/O devices – keyboards, mouse, display screens, small printers.\n\
    - User convenience and responsiveness.\n- Can adopt technology developed for larger\
    \ operating systems.\n\n## Single-Processor Systems\n\nThere is one main CPU capable\
    \ of executing a general-purpose instruction set.\n\n## Parallel Systems\n\n-\
    \ **Multiprocessor systems** with more than one CPU in close communication.\n\
    - *Tightly coupled system* – processors share the computer bus, memory and a clock;\
    \ communication usually takes place through the shared memory.\n\n### Advantages\
    \ of parallel system\n\n- **Increased throughput:** Gets more jobs done.\n- **Economy\
    \ of scale:** Because of resource sharing, multiprocessor systems is cheaper than\
    \ multiple single processor systems.\n- **Increased reliability:** the failure\
    \ of one processor will not halt the whole system.\n\n### Types of Parallel Systems\n\
    \n- **Asymmetric multiprocessing**\n  - Each processor is assigned a specific\
    \ task.\n  - A master processor controls the system. The other processors either\
    \ look to the master for instructions or have predefined tasks.\n  - Thus, this\
    \ defines a master-slave relationship.\n  - Master processor schedules and allocates\
    \ work to slave processors.\n  - More common in extremely large systems.\n- **Symmetric\
    \ multiprocessing (SMP)**\n  - Each processor runs an identical copy of the operating\
    \ system.\n  - Many processes can run at once without performance deterioration.\n\
    \  - Must carefully control I/O to ensure that the data reach the appropriate\
    \ processor.\n  - May result in inefficiencies.\n  - Most modern operating systems\
    \ support SMP.\n\n## Distributed Systems\n\n- Distribute the computation among\
    \ several physical processors.\n- *Loosely coupled system* – each processor has\
    \ its own local memory; processors communicate with one another through various\
    \ communications lines, such as high-speed buses or telephone lines.\n- A distributed\
    \ system is a collection of physically *separate*, possibly *heterogeneous* computer\
    \ systems that are *networked* to provide the users with access to the various\
    \ resources that the system maintains.\n- Advantages of distributed systems:\n\
    \  - Resources Sharing\n  - Computation speed up – load sharing\n  - Reliability\n\
    \  - Communications\n- Requires networking infrastructure.\n- Local area networks\
    \ (LAN) or Wide area networks (WAN).\n- May be either **client-server** or **peer-to-peer**\
    \ systems.\n"
  mdcn: "\n\n## 例子\n\n有两道程序A、B，按下图以多道程序方式运行，要求在右图画出它们的运行轨迹，并计算在60min内CPU的利用率，假设起始时首先运行B，I/O_A和I/O_B不相同，并允许忽略监督程序切换A、B的时间。\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_51_0.png)\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_52_0.png)\n\
    \nP_CPU = [60 - (45 - 35)] / 60 × 100% = 50 / 60 × 100% = 83.3%\n\n若在单道程序系统中，CPU的利用率是多少？\n\
    \n## Advantages and disadvantages of multiprogramming\n\n提高CPU的利用率，充分发挥并行性，这包括：程序之间、设备之间、设备与CPU之间均并行工作。\n\
    \n用户独占资源，无交互性，延迟大。\n\n## Time-Sharing Systems–Interactive Computing\n\n- Time-sharing\
    \ operating system allows many users to share the computer simultaneously.\n分时操作系统允许许多用户同时共享计算机。\n\
    - Switches rapidly from one user to the next.\n快速地从一个用户切换到下一个用户。\n- Gives users\
    \ the impression: the entire computer system is dedicated for his use.\n给用户一种印象：整个计算机系统是为他专用的。\n\
    - The CPU is multiplexed among several jobs that are kept in memory and on disk.\n\
    CPU在多个保存在内存和磁盘上的作业之间复用。\n- Sophisticated CPU-scheduling schemes are required for\
    \ concurrent execution.\n并发执行需要复杂的CPU调度方案。\n- To obtain a reasonable response\
    \ time, a job needs to be swapped in and out of memory to the disk (*virtual memory*).\n\
    为了获得合理的响应时间，作业需要在内存和磁盘之间进行交换（*虚拟内存*）。\n- Disk management must be provided.\n必须提供磁盘管理。\n\
    - Job synchronization mechanisms are needed.\n需要作业同步机制。\n- It may ensure that\
    \ jobs do not get stuck in a deadlock.\n它可以确保作业不会陷入死锁。\n\n## 作业1\n\n从技术发展的角度，简要介绍批处理系统、多道程序系统和分时系统各自的技术特性。（在该技术出现以前系统存在哪些问题，该技术是如何解决这些问题的）\n\
    \n## Desktop Systems\n\n- Personal Computers – computer system dedicated to a\
    \ single user.\n个人计算机 – 专用于单个用户的计算机系统。\n- I/O devices – keyboards, mouse, display\
    \ screens, small printers.\nI/O设备 – 键盘、鼠标、显示屏、小型打印机。\n- User convenience and responsiveness.\n\
    用户便利性和响应性。\n- Can adopt technology developed for larger operating systems.\n可以采用为大型操作系统开发的技术。\n\
    \n## Single-Processor Systems\n\nThere is one main CPU capable of executing a\
    \ general-purpose instruction set.\n有一个主CPU，能够执行通用指令集。\n\n## Parallel Systems\n\
    \n- **Multiprocessor systems** with more than one CPU in close communication.\n\
    具有多个CPU紧密通信的**多处理器系统**。\n- *Tightly coupled system* – processors share the computer\
    \ bus, memory and a clock; communication usually takes place through the shared\
    \ memory.\n*紧密耦合系统* – 处理器共享计算机总线、内存和时钟；通信通常通过共享内存进行。\n\n### Advantages of parallel\
    \ system\n\n- **Increased throughput:** Gets more jobs done.\n**吞吐量提高：** 完成更多作业。\n\
    - **Economy of scale:** Because of resource sharing, multiprocessor systems is\
    \ cheaper than multiple single processor systems.\n**规模经济：** 由于资源共享，多处理器系统比多个单处理器系统更便宜。\n\
    - **Increased reliability:** the failure of one processor will not halt the whole\
    \ system.\n**可靠性提高：** 一个处理器的故障不会导致整个系统停机。\n\n### Types of Parallel Systems\n\n\
    - **Asymmetric multiprocessing**\n  - Each processor is assigned a specific task.\n\
    \  每个处理器被分配特定的任务。\n  - A master processor controls the system. The other processors\
    \ either look to the master for instructions or have predefined tasks.\n  主处理器控制系统。其他处理器要么向主处理器寻求指令，要么具有预定义任务。\n\
    \  - Thus, this defines a master-slave relationship.\n  因此，这定义了主从关系。\n  - Master\
    \ processor schedules and allocates work to slave processors.\n  主处理器调度并分配工作给从处理器。\n\
    \  - More common in extremely large systems.\n  在极大型系统中更常见。\n- **Symmetric multiprocessing\
    \ (SMP)**\n  - Each processor runs an identical copy of the operating system.\n\
    \  每个处理器运行操作系统的相同副本。\n  - Many processes can run at once without performance deterioration.\n\
    \  许多进程可以同时运行而不会降低性能。\n  - Must carefully control I/O to ensure that the data\
    \ reach the appropriate processor.\n  必须仔细控制I/O以确保数据到达适当的处理器。\n  - May result\
    \ in inefficiencies.\n  可能导致效率低下。\n  - Most modern operating systems support SMP.\n\
    \  大多数现代操作系统支持SMP。\n\n## Distributed Systems\n\n- Distribute the computation among\
    \ several physical processors.\n将计算分布在多个物理处理器之间。\n- *Loosely coupled system* –\
    \ each processor has its own local memory; processors communicate with one another\
    \ through various communications lines, such as high-speed buses or telephone\
    \ lines.\n*松散耦合系统* – 每个处理器都有自己的本地内存；处理器通过各种通信线路相互通信，例如高速总线或电话线。\n- A distributed\
    \ system is a collection of physically *separate*, possibly *heterogeneous* computer\
    \ systems that are *networked* to provide the users with access to the various\
    \ resources that the system maintains.\n分布式系统是一组物理上*分离*、可能*异构*的计算机系统集合，它们通过网络连接为用户提供访问系统维护的各种资源的途径。\n\
    - Advantages of distributed systems:\n分布式系统的优点：\n  - Resources Sharing\n资源共享\n\
    \  - Computation speed up – load sharing\n计算加速 – 负载共享\n  - Reliability\n可靠性\n\
    \  - Communications\n通信\n- Requires networking infrastructure.\n需要网络基础设施。\n- Local\
    \ area networks (LAN) or Wide area networks (WAN).\n局域网（LAN）或广域网（WAN）。\n- May\
    \ be either **client-server** or **peer-to-peer** systems.\n可以是**客户端-服务器**或**点对点**系统。\n\
    \n"
