  mdcn: "\n\n## NFS 挂载协议\n- 服务器根据符合其导出列表的挂载请求，返回一个文件句柄——用于后续访问的密钥\n- 文件句柄——一个文件系统标识符，以及一个\
    \ inode 编号，用于标识导出文件系统中被挂载的目录\n- 挂载操作只改变用户的视图，不影响服务器端\n\n## NFS 协议\n- 提供一组远程过程调用以支持远程文件操作\n\
    - 这些过程支持以下操作\n  - 在目录中搜索文件\n  - 读取一组目录条目\n  - 操作链接和目录\n  - 访问文件属性\n  - 读写文件\n\n\
    ## NFS 协议\n- NFS 服务器是**无状态**的；每个请求必须提供完整的一组参数\n  - （NFS V4 刚刚推出——差异很大，是有状态的）\n\
    - 修改后的数据必须先提交到服务器磁盘，然后再将结果返回给客户端（失去了缓存的优势）\n- NFS 协议不提供并发控制机制\n\n## NFS 架构的三个主要层次\n\
    - UNIX 文件系统接口（基于 open、read、write、close 调用以及文件描述符）\n- *虚拟文件系统*（VFS）层——区分本地文件和远程文件，并根据文件系统类型进一步区分本地文件\n\
    \  - VFS 根据本地请求的文件系统类型，激活特定于文件系统的操作来处理请求\n  - 对远程请求调用 NFS 协议过程\n- NFS 服务层——底层\n\
    \  - 实现 NFS 协议\n\n## NFS 路径名转换\n- 通过将路径分解为各个组件名，并对每个组件名与目录 vnode 的组合执行单独的 NFS\
    \ 查找调用来实现\n- 为了加快查找速度，客户端上的目录名查找缓存保存了远程目录名的 vnode\n\n## NFS 远程操作\n- 常规 UNIX 系统调用与\
    \ NFS 协议 RPC 之间几乎一一对应（打开和关闭文件除外）\n- NFS 遵循远程服务范式，但出于性能考虑采用了缓冲和缓存技术\n\n## NFS 远程操作\n\
    - **文件块缓存**——当文件被打开时，内核与远程服务器检查是否获取或重新验证缓存的属性\n  - 仅当相应的缓存属性为最新时，才使用缓存的文件块\n-\
    \ **文件属性缓存**——每当服务器传入新属性时，属性缓存就会更新\n- 在服务器确认数据已写入磁盘之前，客户端不会释放延迟写块\n\n## 操作系统原理及应用\n\
    \n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n江苏省网络与信息安全重点实验室\n\n## 第12章 大容量存储结构\n\
    \n## 大纲\n- 磁盘结构\n- 磁盘连接\n- 磁盘调度\n- 磁盘管理\n- 交换空间管理\n- RAID 结构\n- 稳定存储实现\n- 三级存储设备\n\
    \n## 磁盘结构\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_750_0.png)\n\n## 磁盘结构\n\
    - 磁盘提供了现代计算机的大容量辅助存储\n  - 传输速率是数据在驱动器与计算机之间流动的速率\n  - 定位时间（随机访问时间）是将磁盘臂移动到目标柱面的时间（寻道时间）加上目标扇区旋转到磁盘头下方的时间（旋转延迟）\n\
    \  - 磁头碰撞是指磁盘头与磁盘表面接触导致的结果\n\n| 参数 | IBM 360-KB 软盘 | WD 18300 硬盘 |\n|---|---|---|\n\
    | 柱面数 | 40 | 10601 |\n| 每柱面磁道数 | 2 | 12 |\n| 每磁道扇区数 | 9 | 281（平均） |\n| 每磁盘扇区数\
    \ | 720 | 35742000 |\n| 每扇区字节数 | 512 | 512 |\n| 磁盘容量 | 360 KB | 18.3 GB |\n| 寻道时间（相邻柱面）\
    \ | 6 毫秒 | 0.8 毫秒 |\n| 寻道时间（平均情况） | 77 毫秒 | 6.9 毫秒 |\n| 旋转时间 | 200 毫秒 | 8.33 毫秒\
    \ |\n| 电机停止/启动时间 | 250 毫秒 | 20 秒 |\n| 传输 1 个扇区的时间 | 22 毫秒 | 17 微秒 |\n\n"
