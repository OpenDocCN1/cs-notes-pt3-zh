  md: "\n## Outline\n- Background\n- The Critical-Section Problem\n- Synchronization\
    \ Hardware\n- Semaphores\n- Classical Problems of Synchronization\n- Monitors\n\
    - Synchronization Examples\n\n## Solaris Synchronization\n- Implements a variety\
    \ of locks to support multitasking, multithreading (including real-time threads),\
    \ and multiprocessing.\n- Uses *adaptive mutex* for efficiency when protecting\
    \ data from short code segments.\n- Uses *condition variables*, *semaphore*, and\
    \ *readers-writers locks* when longer sections of code need access to data.\n\
    - Uses *turnstiles* to order the list of threads waiting to acquire either an\
    \ adaptive mutex or reader-writer lock.\n\n## Windows XP Synchronization\n- Uses\
    \ **interrupt masks** (中断屏蔽) to protect access to global resources on uniprocessor\
    \ systems.\n- Uses *spinlocks* on multiprocessor systems.\n- Also provides *dispatcher\
    \ objects* which may act as mutex and semaphores.\n- Dispatcher objects may also\
    \ provide *events*. An event acts much like a condition variable.\n\n## Linux\
    \ Synchronization\n- **Linux**\n  - disables interrupts to implement short critical\
    \ sections\n- **Linux provides**\n  - semaphores\n  - spinlocks\n\n## Pthreads\
    \ Synchronization\n- Pthreads API is OS-independent\n- It provides\n  - mutex\
    \ locks\n  - condition variables\n- Non-portable extensions include\n  - read-write\
    \ locks\n  - spinlocks\n\n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\
    \n江苏省网络与信息安全重点实验室\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_437_0.png)\n\n##\
    \ Chapter 7 Deadlocks\n\n## Outline\n- System Model\n- Deadlock Characterization\n\
    - Methods for Handling Deadlocks\n- Deadlock Prevention\n- Deadlock Avoidance\n\
    - Deadlock Detection\n- Recovery from Deadlock\n\n## The Deadlock Problem\n\n\
    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_440_0.png)\n\n## System Model\n- **Request**\n\
    \  - If a process makes a request to use a system resource which cannot be granted\
    \ immediately, then the requesting process is blocked until it can acquire the\
    \ resource.\n- **Use**\n  - The process can operate on the resource.\n- **Release**\n\
    \  - The process releases the resource.\n\n## System Model\n- **Deadlock**\n \
    \ - A set of process is in a deadlock state when every process in the set is waiting\
    \ for an event that can only be caused by another process in the set.\n\n## Outline\n\
    - System Model\n- **Deadlock Characterization**\n- Methods for Handling Deadlocks\n\
    - Deadlock Prevention\n- Deadlock Avoidance\n- Deadlock Detection\n- Recovery\
    \ from Deadlock\n\n## Deadlock Characterization\n- For a deadlock to occur, each\
    \ of the following four conditions must hold.\n  - **Mutual exclusion:** only\
    \ one process at a time can use a resource.\n  - **Hold and wait (request and\
    \ hold):** A process must be holding a resource and waiting for another.\n  -\
    \ **No preemption:** a resource can be released only voluntarily by the process\
    \ holding it, after that process has completed its task.\n  - **Circular wait:**\
    \ A waits for B, B waits for C, C waits for A.\n\n## Resource-Allocation Graph\n\
    \nA set of vertices $V$ and a set of edges $E$.\n\n- $V$ is partitioned into two\
    \ types:\n  - $P = \\{P_1, P_2, \\ldots, P_n\\}$, the set consisting of all the\
    \ processes in the system.\n  - $R = \\{R_1, R_2, \\ldots, R_m\\}$, the set consisting\
    \ of all resource types in the system.\n- **request edge** – directed edge $P_i\
    \ \\rightarrow R_j$\n- **assignment edge** – directed edge $R_j \\rightarrow P_i$\n\
    \n## Resource-Allocation Graph\n- Process\n- Resource Type with 4 instances\n\
    - *Pᵢ* requests instance of *Rⱼ*\n- *Pᵢ* is holding an instance of *Rⱼ*\n\n##\
    \ Example of a Resource Allocation Graph\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_448_0.png)\n\
    \n## Resource Allocation Graph\nWith a Cycle but No Deadlock\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_449_0.png)\n"
  mdcn: "\n\n## 大纲\n- 背景\n- 临界区问题\n- 同步硬件\n- 信号量\n- 同步的经典问题\n- 管程\n- 同步示例\n\n## Solaris\
    \ 同步\n- 实现了多种锁，以支持多任务、多线程（包括实时线程）和多处理。\n- 在保护短代码段的数据时，使用*自适应互斥锁*以提高效率。\n- 当较长的代码段需要访问数据时，使用*条件变量*、*信号量*和*读者-写者锁*。\n\
    - 使用*旋转门*来对等待获取自适应互斥锁或读者-写者锁的线程列表进行排序。\n\n## Windows XP 同步\n- 在单处理器系统上，使用**中断屏蔽**来保护对全局资源的访问。\n\
    - 在多处理器系统上使用*自旋锁*。\n- 还提供*调度器对象*，它们可以充当互斥锁和信号量。\n- 调度器对象还可以提供*事件*。事件的作用非常类似于条件变量。\n\
    \n## Linux 同步\n- **Linux**\n  - 通过禁用中断来实现短临界区\n- **Linux 提供**\n  - 信号量\n  - 自旋锁\n\
    \n## Pthreads 同步\n- Pthreads API 与操作系统无关\n- 它提供\n  - 互斥锁\n  - 条件变量\n- 不可移植的扩展包括\n\
    \  - 读写锁\n  - 自旋锁\n\n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\
    \n江苏省网络与信息安全重点实验室\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_437_0.png)\n\n##\
    \ 第 7 章 死锁\n\n## 大纲\n- 系统模型\n- 死锁特征\n- 死锁处理方法\n- 死锁预防\n- 死锁避免\n- 死锁检测\n- 死锁恢复\n\
    \n## 死锁问题\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_440_0.png)\n\n## 系统模型\n\
    - **请求**\n  - 如果进程请求使用某个系统资源，而该请求无法立即得到满足，那么请求进程将被阻塞，直到它能够获得该资源。\n- **使用**\n \
    \ - 进程可以对资源进行操作。\n- **释放**\n  - 进程释放该资源。\n\n## 系统模型\n- **死锁**\n  - 当集合中的每个进程都在等待一个只能由该集合中另一个进程触发的事件时，该进程集合就处于死锁状态。\n\
    \n## 大纲\n- 系统模型\n- **死锁特征**\n- 死锁处理方法\n- 死锁预防\n- 死锁避免\n- 死锁检测\n- 死锁恢复\n\n## 死锁特征\n\
    - 要发生死锁，必须同时满足以下四个条件。\n  - **互斥：** 任一时刻只允许一个进程使用资源。\n  - **持有并等待（请求并持有）：** 进程必须持有至少一个资源，并等待获取另一个资源。\n\
    \  - **不可抢占：** 资源只能被持有它的进程在完成任务后自愿释放。\n  - **循环等待：** A 等待 B，B 等待 C，C 等待 A。\n\n\
    ## 资源分配图\n\n一组顶点 $V$ 和一组边 $E$。\n\n- $V$ 分为两种类型：\n  - $P = \\{P_1, P_2, \\ldots,\
    \ P_n\\}$，即系统中所有进程的集合。\n  - $R = \\{R_1, R_2, \\ldots, R_m\\}$，即系统中所有资源类型的集合。\n\
    - **请求边** – 有向边 $P_i \\rightarrow R_j$\n- **分配边** – 有向边 $R_j \\rightarrow P_i$\n\
    \n## 资源分配图\n- 进程\n- 具有 4 个实例的资源类型\n- *Pᵢ* 请求 *Rⱼ* 的一个实例\n- *Pᵢ* 持有 *Rⱼ* 的一个实例\n\
    \n## 资源分配图示例\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_448_0.png)\n\n## 资源分配图\n\
    有环但无死锁\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_449_0.png)\n\n"
