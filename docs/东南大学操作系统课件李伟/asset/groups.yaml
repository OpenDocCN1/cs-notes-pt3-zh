  mdcn: "\n\n## 线程使用情况 (1/2)\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_205_0.png)\n\
    \n键盘\n\n内核\n\n磁盘\n\n一个具有三个线程的字处理器\n\n## 线程使用情况 (2/2)\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_206_0.png)\n\
    \nWeb 服务器进程\n\n调度线程\n\n工作线程\n\n网页缓存\n\n用户空间\n\n内核\n\n内核空间\n\n网络连接\n\n一个多线程的 Web\
    \ 服务器\n\n## 优点\n\n- 响应性\n  - 例如，多线程 Web 浏览器\n- 资源共享\n  - 线程共享它们所属进程的内存和资源\n- 经济性\n\
    \  - 创建和上下文切换线程\n- 多处理器架构的利用\n\n## 用户线程\n\n- 线程管理由用户级线程库完成\n- 示例\n  - POSIX Pthreads\n\
    \  - Mach C-threads\n  - Solaris UI-threads\n\n## Windows OS\n\n| 内核版本 | 发行版 |\n\
    |---|---|\n| NT 3.51 | Windows NT 3.51 |\n| NT 4.0 | Windows NT 4.0 |\n| NT 5.0\
    \ | Windows 2000 |\n| NT 5.1 | Windows XP |\n| NT 5.2 | Windows Server 2003 |\n\
    | NT 6.0 | Windows Vista<br>Windows Server 2008 |\n| NT 6.1 | Windows 7<br>Windows\
    \ Server 2008 R2 |\n| NT 6.2 | Windows 8 |\n| NT 6.3 | Windows 8.1 |\n\n## 用户线程\n\
    \n- 用户线程在内核之上得到支持。内核**不知道**用户线程的存在。\n- 一个库提供了线程创建、终止、连接和调度的所有支持。\n- 没有内核干预，因此用户线程通常**更高效**。\n\
    - 不幸的是，由于内核只识别包含线程的进程，*如果一个线程被阻塞，同一进程中的所有其他线程也会被阻塞*，因为包含进程被阻塞了。\n\n## 在用户空间实现线程\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_211_0.png)\n\n一个用户级线程包\n\n## 内核线程\n\
    \n- 由内核支持和管理\n- 示例\n  - Windows\n  - Solaris\n  - Mac OS X\n  - Linux\n\n## 在内核中实现线程\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_214_0.png)\n\n由内核管理的线程包\n\n## 作业1\n\
    \n1. 请阐述进程和线程之间的区别和联系。\n2. 用户级线程和内核级线程有何区别？\n\n## 大纲\n\n- 概述\n- 多线程模型\n- 线程库\n\
