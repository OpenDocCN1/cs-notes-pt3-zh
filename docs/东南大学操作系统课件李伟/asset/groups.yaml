  - '[PAGE 110]


    # Layered Structure


    +   - The operating system is divided into a number of layers (levels), each built
    on top of lower layers. The bottom layer (layer 0), is the hardware; the highest
    (layer N) is the user interface.

    +   - With modularity, layers are selected such that each uses functions (operations)
    and services of only lower-level layers'
  - '[PAGE 111]


    # Layered Operating System


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_111_0.png)'
  - '[PAGE 112]


    # OS/2 Layer Structure


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_112_0.png)'
  - '[PAGE 113]


    # # Microkernel Structure


    +   - Moves as much from the kernel into *“user” space*

    +   - Typically, microkernels provide **minimal process management, memory management**
    and **communication facility**

    +   - Communication takes place between user modules using message passing'
  - '[PAGE 114]


    # # Microkernel Structure


    +   - **Benefits**

    +     - Easier to extend a operating system

    +     - Easier to port the operating system to new architectures

    +     - More reliable (less code is running in kernel mode)

    +     - More secure

    +   - **Lacks**

    +     - Performance overhead of user space to kernel space communication'
  - '[PAGE 115]


    # Modules


    +   - Most modern operating systems implement kernel modules

    +     - Uses object-oriented approach

    +     - Each core component is separate

    +     - Each talks to the others over known interfaces

    +     - Each is loadable as needed within the kernel

    +   - Overall, similar to layers but with more flexible'
  - '[PAGE 116]


    # Solaris Modular Approach


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_116_0.png)'
  - '[PAGE 117]


    # 作业1


    设计操作系统时采用的模块化内核方法和分层方法在哪些方面类似？\n哪些方面不同？'
  - '[PAGE 118]


    # Virtual Machines


    +   - A *virtual machine* takes the layered approach to its logical conclusion.
    It treats hardware and the operating system kernel as though they were all hardware

    +   - A virtual machine provides an *interface identical* to the underlying bare
    hardware

    +   - The operating system creates the “*illusion*” of multiple processes, each
    executing on its own processor with its own (virtual) memory'
  - '[PAGE 119]


    # Virtual Machines


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_119_0.png)'
  - '[PAGE 120]


    # Virtual Machines


    +   - The resources of the physical computer are shared to create the virtual
    machines

    +   - CPU scheduling can create the appearance that users have their own processor

    +   - Spooling and a file system can provide virtual card readers and virtual
    line printers

    +   - A normal user time-sharing terminal serves as the virtual machine operator’s
    console'
  - '[PAGE 121]


    # Virtual Machines


    +   - **Advantages**

    +     - **Providing complete protection of system resources**

    +       - Each virtual machine is isolated from all other virtual machines. This
    isolation, however, permits no direct sharing of resources.

    +     - **Being able to share the same hardware yet run different operating systems
    concurrently**

    +     - **A perfect vehicle for operating-systems research and development**

    +       - System development is done on the virtual machine, so does not disrupt
    normal system operation.'
  - '[PAGE 122]


