    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_750_0.png)\n\n## Disk Structure\n-\
    \ Magnetic disks provide bulk of secondary storage of modern computers\n  - Transfer\
    \ rate is rate at which data flow between drive and computer\n  - Positioning\
    \ time (random-access time) is time to move disk arm to desired cylinder (seek\
