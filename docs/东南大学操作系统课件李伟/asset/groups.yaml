    \ 三级存储设备\n\n## 交换空间管理\n- Swap-space — 虚拟内存使用磁盘空间作为主内存的扩展。\n- Swap-space 可以从普通文件系统中划分出来，或者更常见的是位于单独的磁盘分区中。\n\
