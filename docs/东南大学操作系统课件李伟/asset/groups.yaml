  md: "\n# Shared Library Using Virtual Memory\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_581_0.png)\n\
    \n## Copy-on-Write\n\n- Process Creation\n- Copy-on-Write (COW) allows both parent\
    \ and child processes to **initially share** the same pages in memory.\n- If either\
    \ process modifies a shared page, then only the page is copied.\n- COW allows\
    \ more efficient process creation as only modified pages are copied.\n- Free pages\
    \ are allocated from **a pool of zeroed-filled pages**.\n\n## Outline\n\n- Background\n\
    - Demand Paging\n- Page Replacement\n- Allocation of Frames\n- Thrashing\n- Memory-Mapped\
    \ Files\n- Allocating Kernel Memory\n- Other Considerations\n- Operating-System\
    \ Examples\n\n## Demand Paging\n\n- Bring a page into memory only when it is needed.\n\
    \  - Less I/O needed\n  - Less memory needed\n  - Faster response\n  - More users\n\
    - Page is needed ⇒ reference to it\n  - invalid reference ⇒ abort\n  - not-in-memory\
    \ ⇒ bring to memory\n- **Lazy Swapper (Pager)** – never swaps a page into memory\
    \ unless page will be needed\n\n## Valid-Invalid Bit\n\n- A valid–invalid bit\
    \ is associated with each page table entry\n  - 1 ⇒ valid and in-memory\n  - 0\
    \ ⇒ invalid or not-in-memory\n- Initially valid–invalid bit is set to 0 on all\
    \ entries.\n- During address translation, if valid–invalid bit in page table entry\
    \ is 0 ⇒ **page fault.**\n\n## Page Table When Some Pages Are Not in Main Memory\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_586_0.png)\n\n## Steps in Handling\
    \ a Page Fault\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_588_0.png)\n\n## Performance\
    \ of Demand Paging\n\n- **Page Fault Rate** 0 ≤ p ≤ 1\n  - if p = 0 no page faults\n\
    \  - if p = 1, every reference is a fault\n\n- **Effective Access Time (EAT)**\n\
    \  EAT = (1 − p) x memory access time\n  + p (page fault overhead)\n  page fault\
    \ overhead = service the page-fault interrupt\n  + [swap page out]\n  + swap page\
    \ in\n  + restart overhead\n\n## Outline\n\n- Background\n- Demand Paging\n- **Page\
    \ Replacement**\n- Allocation of Frames\n- Thrashing\n- Memory-Mapped Files\n\
    - Allocating Kernel Memory\n- Other Considerations\n- Operating-System Examples\n\
    \n## What happens if there is no free frame?\n\n- Page replacement – find some\
    \ page in memory, but not really in use, swap it out\n  - algorithm\n\n- Same\
    \ page may be brought into memory several times\n  - performance – want an algorithm\
    \ which will result in minimum number of page faults\n\n## Page Replacement\n\n\
    - Prevent over-allocation of memory by modifying page-fault service routine to\
    \ include page replacement.\n- Page replacement completes separation between logical\
    \ memory and physical memory – large virtual memory can be provided on a smaller\
    \ physical memory.\n\n## Need For Page Replacement\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_593_0.png)\n\
    \n## Basic Page Replacement\n\n- Find the location of the desired page on disk.\n\
    - Find a free frame\n  - If there is a free frame, use it.\n  - If there is no\
    \ free frame, use a page replacement algorithm to select a victim frame.\n  -\
    \ Write the victim frame to the disk and change the page and frame tables.\n-\
    \ Read the desired page into the free frame. Update the page and frame tables.\n\
    - Restart the process.\n\n## Basic Page Replacement\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_595_0.png)\n\
    \nUse *modify (dirty) bit* to reduce overhead of page transfers – only modified\
    \ pages are written to disk.\n\n## Page Replacement Algorithms\n\n- Want **lowest\
    \ page-fault rate**.\n- Evaluate algorithm by running it on a particular string\
    \ of memory references (**reference string**) and computing the number of page\
    \ faults on that string.\n\n## Graph of Page Faults Versus\nThe Number of Frames\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_597_0.png)\n"
  mdcn: "\n\n# 使用虚拟内存的共享库\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_581_0.png)\n\
    \n## 写时复制\n\n- 进程创建\n- 写时复制（COW）允许父进程和子进程**最初共享**内存中的相同页面。\n- 如果任一进程修改了共享页面，则仅复制该页面。\n\
    - COW 允许更高效的进程创建，因为只有被修改的页面才会被复制。\n- 空闲页面从**零填充页面池**中分配。\n\n## 大纲\n\n- 背景\n- 按需分页\n\
    - 页面置换\n- 帧分配\n- 抖动\n- 内存映射文件\n- 分配内核内存\n- 其他考虑\n- 操作系统示例\n\n## 按需分页\n\n- 仅在需要时才将页面调入内存。\n\
    \  - 所需 I/O 更少\n  - 所需内存更少\n  - 响应更快\n  - 用户更多\n- 需要页面 ⇒ 对其引用\n  - 无效引用 ⇒ 终止\n\
    \  - 不在内存中 ⇒ 调入内存\n- **惰性交换器（分页器）** – 除非页面将被需要，否则永不将其交换到内存中\n\n## 有效-无效位\n\n-\
    \ 每个页表项都关联一个有效-无效位\n  - 1 ⇒ 有效且在内存中\n  - 0 ⇒ 无效或不在内存中\n- 最初，所有条目的有效-无效位都设置为 0。\n\
    - 在地址转换期间，如果页表项中的有效-无效位为 0 ⇒ **缺页。**\n\n## 当某些页面不在主内存中的页表\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_586_0.png)\n\
    \n## 处理缺页的步骤\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_588_0.png)\n\n## 按需分页的性能\n\
    \n- **缺页率** 0 ≤ p ≤ 1\n  - 如果 p = 0 则无缺页\n  - 如果 p = 1，则每次引用都是缺页\n\n- **有效访问时间（EAT）**\n\
    \  EAT = (1 − p) x 内存访问时间\n  + p （缺页开销）\n  缺页开销 = 服务缺页中断\n  + [换出页面]\n  + 换入页面\n\
    \  + 重启开销\n\n## 大纲\n\n- 背景\n- 按需分页\n- **页面置换**\n- 帧分配\n- 抖动\n- 内存映射文件\n- 分配内核内存\n\
    - 其他考虑\n- 操作系统示例\n\n## 如果没有空闲帧会怎样？\n\n- 页面置换 – 找到内存中某个页面，但实际上未使用，将其换出\n  - 算法\n\
    \n- 同一页面可能被多次调入内存\n  - 性能 – 希望算法能使缺页次数最少\n\n## 页面置换\n\n- 通过修改缺页服务例程以包含页面置换来防止内存过度分配。\n\
    - 页面置换完成了逻辑内存与物理内存之间的分离 – 可以在较小的物理内存上提供较大的虚拟内存。\n\n## 页面置换的需求\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_593_0.png)\n\
    \n## 基本页面置换\n\n- 找到磁盘上所需页面的位置。\n- 找到一个空闲帧\n  - 如果有空闲帧，则使用它。\n  - 如果没有空闲帧，则使用页面置换算法选择一个受害者帧。\n\
    \  - 将受害者帧写入磁盘并更改页面和帧表。\n- 将所需页面读入空闲帧。更新页面和帧表。\n- 重新启动进程。\n\n## 基本页面置换\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_595_0.png)\n\
    \n使用 *修改（脏）位* 以减少页面传输的开销 – 只有被修改的页面才写入磁盘。\n\n## 页面置换算法\n\n- 希望**缺页率最低**。\n- 通过在特定的内存引用字符串（**引用字符串**）上运行算法并计算该字符串上的缺页次数来评估算法。\n\
    \n## 缺页数与\n帧数关系的图\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_597_0.png)\n\n"
