    \ – 只需起始地址和结束地址\n- 空闲空间管理系统 – 不浪费空间\n- 文件可以增长\n- 不支持随机访问\n- 每个块包含一个指针，浪费空间\n-\
    \ 块散布各处，可能需要大量磁盘寻道\n- 可靠性：如果指针丢失或损坏怎么办？\n\n## 链接分配\n\n目录\n\n| file | start | end\
