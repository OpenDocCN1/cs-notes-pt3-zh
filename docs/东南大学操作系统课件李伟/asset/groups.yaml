    \ until load time if memory location is not known at compile time.\n- **Execution\
    \ time:** Binding delayed until run time if the process can be moved during its\
    \ execution from one memory segment to another. Need hardware support for address\
    \ maps\n\n## Logical vs. Physical Address Space\n\n- The concept of a *logical\
    \ address space* that is bound to a separate *physical address space* is central\
    \ to proper memory management.\n  - *Logical address* – generated by the CPU;\
    \ also referred to as *virtual address*.\n  - *Physical address* – address seen\
    \ by the memory unit.\n- Logical and physical addresses are *the same* in compile-time\
    \ and load-time address-binding schemes\n- logical and physical addresses *differ*\
    \ in execution-time address-binding scheme.\n\n## Memory-Management Unit (MMU)\n\
    \n- Hardware device that maps virtual to physical address.\n- In MMU scheme, the\
    \ value in the **relocation (base) register** is added to every address generated\
    \ by a user process at the time it is sent to memory.\n- The user program deals\
    \ with *logical* addresses; it never sees the *real physical* addresses.\n\n##\
    \ Dynamic Loading\n\n- The size of a process is limited to the size of physical\
    \ memory.\n- Routine is not loaded until it is called\n- To use dynamic loading,\
    \ all routines must be in a relocatable format.\n- The main program is loaded\
    \ and executes.\n- When a routine A calls B, A checks to see if B is loaded. If\
    \ B is not loaded, the relocatable linking loader is called to load B and updates\
    \ the address table. Then, control is passed to B.\n"
  mdcn: "\n\n## 资源抢占\n\n- **选择受害者** – 最小化成本。\n- **回滚** – 返回到某个安全状态，为该状态重新启动进程。\n-\
    \ **饥饿** – 相同的进程可能总是被选为受害者。最常见的解决方案是在成本因子中包含回滚次数。\n\n## 作业\n\n- 第七章课后习题7.11。（P270）\n\
    \n## Part 2 小结（1/2）\n\n- 进程的概念、组成、特征（4个）、状态（转换）、PCB\n- 进程调度：调度队列（3种），调度程序（3种），上下文切换\n\
