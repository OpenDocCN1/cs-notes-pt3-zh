  md: "\n## Dual-Mode Operation\n\n- *Mode bit* added to computer hardware to indicate\
    \ the current mode: kernel (0) or user (1).\n- When an interrupt or fault occurs,\
    \ hardware switches from user mode to kernel mode.\n- The dual mode of operation\
    \ provides us with the means for protecting the operating system from errant user\
    \ programs.\n\n*Privileged Instruction* —— Some of the machine instructions that\
    \ may *cause harm* and can be executed only in *kernel mode*.\n\n## CPU Protection\n\
    \n- **Timer** – interrupts computer after specified period to ensure operating\
    \ system maintains control.\n    - Timer is decremented every clock tick.\n  \
    \  - When timer reaches the value 0, an interrupt occurs.\n- Timer commonly used\
    \ to implement time sharing.\n- Timer also used to compute the current time.\n\
    - Load-timer is a **privileged instruction**.\n\n## Memory Protection\n\n- Must\
    \ provide memory protection at least for the interrupt vector and the interrupt\
    \ service routines.\n- In order to have memory protection, add two registers that\
    \ determine the range of legal addresses a program may access\n    - Base register（基址寄存器）\
    \ – holds the smallest legal physical memory address.\n    - Limit register（界限寄存器）\
    \ – contains the size of the range\n- Memory outside the defined range is protected.\n\
    \n## Use of a Base and Limit Register\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_39_0.png)\n\
    \n## Memory Address Protection\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_40_0.png)\n\
    \n## Memory Protection\n\n- When executing in kernel mode, the operating system\
    \ has unrestricted access to both kernel and user’s memory.\n- The load instructions\
    \ for the *base* and *limit* registers are privileged instructions.\n\n## I/O\
    \ Protection\n\n- All I/O instructions are privileged instructions.\n- Must ensure\
    \ that a user program could never gain control of the computer in kernel mode\
    \ (i.e., a user program that, as part of its execution, stores a new address in\
    \ the interrupt vector).\n\n## Outline\n\n- What is Operating System?\n- OS-related\
    \ Hardwares\n- Development of Operating System\n\n## Development of OS\n\n- Mainframe\
    \ Systems\n- Desktop Systems\n- Multiprocessor Systems\n- Distributed Systems\n\
    - Clustered Systems\n- Real-Time Systems\n- Handheld Systems\n\n## Mainframe Systems\n\
    \nNo OS→Batch Systems→Multiprogramming Systems→Time Sharing Systems\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_45_0.png)\n\
    \n- 用户独占全机资源\n- 程序运行前准备时间过长\n- 人机速度不匹配\n\n## Batch Systems (1/2)\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_46_0.png)\n\
    \n- bring cards to IBM 1401\n- IBM 1401 read cards to tape\n- put tape on IBM\
    \ 7094 which does computing\n- put tape on IBM 1401 which prints output\n\n##\
    \ Batch Systems (2/2)\n\n- Reduce setup time by batching similar jobs\n- Automatic\
    \ job sequencing – automatically transfers control from one job to another.\n\
    - Resident monitor\n    - initial control in monitor\n    - control transfers\
    \ to job\n    - when job completes control transfers back to monitor\n\nFirst\
