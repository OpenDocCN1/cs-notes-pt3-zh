    - 多线程模型（多对一、一对一、多对多、二级模型）\n- 线程库：pthread_create()、pthread_join()、pthread_exit()、pthread_cancel()、pthread_kill()、CreateThread()\n\
    - 多线程问题：线程取消（异步取消、延迟取消），信号机制（和中断机制的区别）\n\n## Part 2 小结（2/2）\n\n- CPU调度：调度的可行性、发生调度的时机、抢占式调度与非抢占式调度、调度器与分派器、调度准则（5个）\n\
    - 调度算法：FCFS、SJF（指数平均）、优先级调度（Aging）、轮转法调度、多级队列调度、多级反馈队列调度\n- 多处理器调度（负载均衡、处理器亲和性）、实时调度、线程调度\n\
    - 进程同步：竞争条件、临界区问题（4个部分、3个条件）、硬件同步机制（中断管理、特殊指令），软件同步机制（信号量、管程（条件变量））\n- Peterson算法和Bakery算法、三大经典同步问题的解决方案\n\
    - 死锁的概念（资源分配图）、特征（4个）、处理方法（3种）\n- 死锁预防（破坏三个条件之一）、死锁避免（安全状态、资源分配图算法、银行家算法）\n- 死锁发现（单资源实例、多资源实例），死锁恢复（进程终止、资源抢占）\n\
    \n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n江苏省网络与信息安全重点实验室\n\
    \n## Chapter 8 Memory Management\n\n## 第8章 内存管理\n\n## Outline\n\n## 大纲\n\n- Background\n\
    - Contiguous Allocation\n- Paging\n- Structure of Page Table\n- Segmentation\n\
    \n- 背景\n- 连续分配\n- 分页\n- 页表的结构\n- 分段\n\n## Background\n\n## 背景\n\n- Program must\
    \ be brought into memory and placed within a process for it to be run.\n- Main\
    \ memory and registers are only storage CPU can access directly\n  - Register\
    \ access in one CPU clock (or less)\n  - Main memory can take many cycles\n- Cache\
    \ sits between main memory and CPU registers\n- Protection of memory required\
    \ to ensure correct operation\n\n- 程序必须被调入内存并放置在进程中才能运行。\n- 主内存和寄存器是 CPU 唯一可以直接访问的存储器\n\
    \  - 寄存器访问在一个 CPU 时钟周期内完成（或更少）\n  - 主内存可能需要多个周期\n- 缓存位于主内存和 CPU 寄存器之间\n- 需要内存保护以确保正确操作\n\
    \n## Base and Limit Registers\n\n## 基址和界限寄存器\n\n- A pair of **base** and **limit**\
    \ registers define the legal address space\n\n- 一对 **基址** 和 **界限** 寄存器定义了合法的地址空间\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_497_0.png)\n\n## Hardware Address Protection\n\
    \n## 硬件地址保护\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_498_0.png)\n\ntrap to\
    \ operating system monitor—addressing error\n\n转到操作系统监视器——寻址错误\n\n## Multistep\
    \ Processing of a User Program\n\n## 用户程序的多步处理\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_499_0.png)\n\
    \n## Representation of Addresses\n\n## 地址的表示\n\n- Symbolic address (Source Program)\n\
    - Relocatable address (Object Program)\n- Absolute address\n\n- 符号地址（源程序）\n- 可重定位地址（目标程序）\n\
    - 绝对地址\n\n## Binding of Instructions and Data to Memory Addresses\n\n## 指令和数据到内存地址的绑定\n\
    \n- **Compile time:** If memory location known a priori, *absolute code* can be\
    \ generated; code must be recompiled if starting location changes.\n- **Load time:**\
    \ Must generate *relocatable code* and binding delayed until load time if memory\
    \ location is not known at compile time.\n- **Execution time:** Binding delayed\
    \ until run time if the process can be moved during its execution from one memory\
    \ segment to another. Need hardware support for address maps\n\n- **编译时：** 如果内存位置事先已知，则可以生成\
    \ *绝对代码*；如果起始位置改变，代码必须重新编译。\n- **装入时：** 如果编译时不知道内存位置，则必须生成 *可重定位代码* 并将绑定推迟到装入时。\n\
    - **执行时：** 如果进程在执行期间可以从一个内存段移动到另一个内存段，则绑定推迟到运行时。需要硬件支持地址映射\n\n## Logical vs. Physical\
    \ Address Space\n\n## 逻辑地址空间与物理地址空间\n\n- The concept of a *logical address space*\
    \ that is bound to a separate *physical address space* is central to proper memory\
    \ management.\n  - *Logical address* – generated by the CPU; also referred to\
    \ as *virtual address*.\n  - *Physical address* – address seen by the memory unit.\n\
    - Logical and physical addresses are *the same* in compile-time and load-time\
    \ address-binding schemes\n- logical and physical addresses *differ* in execution-time\
    \ address-binding scheme.\n\n- *逻辑地址空间* 绑定到独立的 *物理地址空间* 的概念是正确内存管理的核心。\n  - *逻辑地址*\
    \ – 由 CPU 生成；也称为 *虚拟地址*。\n  - *物理地址* – 内存单元看到的地址。\n- 在编译时和装入时地址绑定方案中，逻辑地址和物理地址是\
    \ *相同的*\n- 在执行时地址绑定方案中，逻辑地址和物理地址 *不同*。\n\n## Memory-Management Unit (MMU)\n\n\
    ## 内存管理单元（MMU）\n\n- Hardware device that maps virtual to physical address.\n-\
    \ In MMU scheme, the value in the **relocation (base) register** is added to every\
    \ address generated by a user process at the time it is sent to memory.\n- The\
    \ user program deals with *logical* addresses; it never sees the *real physical*\
    \ addresses.\n\n- 将虚拟地址映射到物理地址的硬件设备。\n- 在 MMU 方案中，**重定位（基址）寄存器** 中的值会在用户进程生成的每个地址发送到内存时被加上。\n\
    - 用户程序处理的是 *逻辑* 地址；它永远看不到 *真实物理* 地址。\n\n## Dynamic Loading\n\n## 动态装载\n\n- The\
    \ size of a process is limited to the size of physical memory.\n- Routine is not\
    \ loaded until it is called\n- To use dynamic loading, all routines must be in\
    \ a relocatable format.\n- The main program is loaded and executes.\n- When a\
    \ routine A calls B, A checks to see if B is loaded. If B is not loaded, the relocatable\
    \ linking loader is called to load B and updates the address table. Then, control\
    \ is passed to B.\n\n- 进程的大小受物理内存大小的限制。\n- 例程在被调用前不被装入\n- 要使用动态装载，所有例程必须以可重定位格式存在。\n\
    - 主程序被装入并执行。\n- 当例程 A 调用 B 时，A 检查 B 是否已装入。如果 B 未装入，则调用可重定位链接装载程序装入 B 并更新地址表。然后，控制权传递给\
    \ B。\n\n"
