    - Process Scheduling\n- Operations on Processes\n- **Interprocess Communication**\n\
    - Communication in Client-Server Systems\n\n## Interprocess Communication (IPC)\n\
    \n- Communication may take place using either **message passing** or **shared\
    \ memory**.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_171_0.png)\n\n## Shared-Memory\
    \ Systems\n\n- Requiring communicating processes to establish a region of shared\
    \ memory.\n- A shared-memory region resides in the address space of the process\
    \ creating the shared-memory segment.\n- The processes are responsible for ensuring\
    \ that they are not writing to the same location simultaneously.\n\n## Producer-Consumer\
    \ Problem\n\n- Paradigm for cooperating processes, **_producer_** process produces\
    \ information that is consumed by a **_consumer_** process.\n    - **_unbounded-buffer_**\
    \ places no practical limit on the size of the buffer.\n    - **_bounded-buffer_**\
    \ assumes that there is a fixed buffer size.\n\n## Bounded-Buffer – Shared-Memory\
    \ Solution\n\n- Shared data\n\n```c\n#define BUFFER_SIZE 10\ntypedef struct {\n\
    \    ...\n} item;\nitem buffer[BUFFER_SIZE];\nint in = 0;\nint out = 0;\n```\n\
    \n## Bounded-Buffer – Producer Process\n\n```\nitem nextProduced;\n\nwhile (1)\
    \ {\n    while (((in + 1) % BUFFER_SIZE) == out)\n        ; /* do nothing */\n\
    \    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n}\n```\n\n\
    ## Bounded-Buffer – Consumer Process\n\n```\nitem nextConsumed;\n\nwhile (1) {\n\
    \    while (in == out)\n        ;/* do nothing */\n    nextConsumed = buffer[out];\n\
    \    out = (out + 1) % BUFFER_SIZE;\n}\n```\n\n## Discussion\n\n- Solution is\
    \ correct, but can only use BUFFER_SIZE-1 elements\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_177_0.png)\n\
    \n- 如何实现可使用缓冲的最大空间数为 BUFFER_SIZE？\n\n## Message-Passing Systems\n\n- **MPS facility\
