  mdcn: "\n\n## 信号处理\n\n在多线程程序中，信号应该发送到哪里？\n\n- 将信号发送给该信号适用的线程\n- 将信号发送给进程中的每个线程\n\
    - 将信号发送给进程中的某些线程\n- 指定一个特定线程接收进程的所有信号\n\n## 作业2\n\n试比较信号机制与中断机制的异同。\n\n## 线程池\n\
    \n- 创建一定数量的线程放入池中等待工作\n\n**优点：**\n\n- 通常使用现有线程处理请求比创建新线程稍快\n- 允许应用程序中的线程数量限制在池的大小之内\n\
    \n## 线程特定数据\n\n- 属于一个进程的线程共享该进程的数据。\n- 允许每个线程拥有自己数据的副本\n- 使用线程池时，每个线程可以被分配一个唯一标识符\n\
    \n## 大纲\n\n- 概述\n- 多线程模型\n- 线程库\n- 线程问题\n- 操作系统示例\n\n## Windows XP 线程\n\n- 实现一对一映射。\n\
    - 每个线程包含\n  - 一个线程 id\n  - 寄存器集\n  - 分开的用户栈和内核栈\n  - 私有数据存储区\n\n## 操作系统原理及应用\n\
    \n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n江苏省网络与信息安全重点实验室\n\n## Chapter 5\
    \ CPU Scheduling\n\n## CPU-I/O 突发周期\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_274_0.png)\n\
    \n- 进程执行重复 CPU 突发和 I/O 突发周期。\n- 当一个进程开始一个 I/O 突发时，另一个进程可以使用 CPU 进行其 CPU 突发。\n\n\
    ## CPU 密集型和 I/O 密集型\n\n- 如果一个进程很少产生 I/O 请求，使用更多时间进行计算，则该进程是 CPU 密集型的。\n- 如果一个进程花费更多时间进行\
    \ I/O 而不是计算，则该进程是 I/O 密集型的。\n- CPU 密集型进程可能有几个非常长的 CPU 突发。\n- I/O 密集型进程通常有许多短的\
    \ CPU 突发。\n\n## CPU 调度程序\n\n- 当 CPU 空闲时，操作系统必须选择另一个进程运行。\n- 此选择过程由 *短期调度程序*（或\
    \ *CPU 调度程序*）执行。\n- CPU 调度程序从就绪队列中选择一个进程，并将 CPU 分配给它。\n- 就绪队列有许多组织方式（例如 FIFO）。\n\
    \n## 调度可能发生的情况\n\n- 一个进程从 **运行** 状态切换到 **终止** 状态。\n- 一个进程从 **运行** 状态切换到 **等待**\
    \ 状态（*例如*，进行 I/O）。\n- 一个进程从 **运行** 状态切换到 **就绪** 状态（*例如*，发生 **中断**）。\n- 一个进程从 **等待**\
    \ 状态切换到 **就绪** 状态（*例如*，I/O 完成）。\n\n## CPU 调度发生\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_280_0.png)\n\
    \nconverting to process\n\nadmitted\n\nwaiting for CPU\n\nI/O or event completion\n\
    \nscheduler dispatch\n\ninterrupt\n\nwaiting for I/O or event\n\nreclaim resource\n\
    \ndestroy process\n\nI/O or event wait\n\nexit\n\n##抢占式与非抢占式\n\n**抢占式调度**\n\n\
    - 调度发生在情况 3 和情况 4。\n- 伴随访问共享数据相关的成本。\n- 如果内核在其关键区修改某些重要数据会发生什么？\n- 内核必须特别注意这种情况，因此更复杂。\n\
    \n## 抢占式与非抢占式\n\n- **非抢占式调度**\n  - 调度发生在进程自愿终止（情况 1）或进入等待状态（情况 2）时。\n  - 一旦 CPU\
