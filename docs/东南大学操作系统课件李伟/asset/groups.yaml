    - Layered Structure\n  - Virtual Machines\n- Microkernel Structure\n- Modules\n\
    \n### Simple Structure\n\n- **MS-DOS**\n  - Written to provide the most functionality\
    \ in the least space\n  - Not divided into modules\n  - Although MS-DOS has some\
    \ structure, its interfaces and levels of functionality are not well separated\n\
    \n- **Original UNIX**\n  - Two separable parts\n    - Systems programs\n    -\
    \ **The kernel**: Consists of everything below the system-call interface and above\
    \ the physical hardware, provides a large number of functions for one level\n\n\
    ### UNIX System Structure\n\n```\n(the users)\n\nshells and commands\ncompilers\
    \ and interpreters\nsystem libraries\n\nsystem-call interface to the kernel\n\n\
    Kernel\n\nsignals terminal handling\ncharacter I/O system\nterminal drivers\n\n\
    file system\nswapping block I/O system\ndisk and tape drivers\n\nCPU scheduling\n\
    page replacement\ndemand paging\nvirtual memory\n\nkernel interface to the hardware\n\
    \nterminal controllers\nterminals\n\ndevice controllers\ndisks and tapes\n\nmemory\
    \ controllers\nphysical memory\n```\n"
  mdcn: "\n\n## 系统调用实现\n\n### 应用程序编程接口 (API)\n\n- API 函数代表应用程序程序员调用实际的系统调用\n- 只需遵守\
    \ API 并理解操作系统调用后会做什么，API 将操作系统的接口细节隐藏在程序员之外\n- API 由 **运行时支持库** 管理（编译器附带的库中内置的一组函数）\n\
    \n- 讨论：为什么用户使用 API 而不是系统调用？\n\n- **三种最常见的 API**\n  - **Win32 API** 用于 Windows\n\
    \  - **POSIX API** 用于基于 POSIX 的系统（包括几乎所有版本的 UNIX、Linux 和 Mac OS X）\n  - **Java\
    \ API** 用于 Java 虚拟机 (JVM)\n\n### API、SCI、OS 之间的关系\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_95_0.png)\n\
    \n### 标准 C 库示例\n\nC 程序调用 printf() 库调用，该调用调用 write() 系统调用\n\n```c\n#include <stdio.h>\n\
    int main ()\n{\n...\nprintf(\"Greetings\");\n...\nreturn 0;\n}\n```\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_96_0.png)\n\
    \n### 系统调用参数传递\n\n- 通常，需要的信息不仅仅是所需系统调用的标识\n- 向操作系统传递参数的三种通用方法\n  - 最简单：通过 *寄存器*\
    \ 传递参数\n  - 参数存储在 *块* 或 *表* 中，位于 *内存* 中，并将块的 *地址* 作为参数传递给 *寄存器*\n  - 参数由 *程序*\
    \ 放置或 *压入* *堆栈*，并由操作系统 *弹出* 堆栈\n\n**通过表进行参数传递**\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_98_0.png)\n\
    \n### 系统调用的类型\n\n- 进程控制\n- 文件管理\n- 设备管理\n- 信息维护\n- 通信\n\n- **进程控制**\n  - end,\
