  mdcn: "\n\n## 作业1\n\n- 说明抢占式调度与非抢占式调度的区别。对于计算中心，上述两种调度方式哪一种比较适合？\n\n## 分派程序\n\n\
    - **分派程序模块**将 CPU 的控制权交给由短期调度程序选中的进程。\n- 它的功能包括：\n  - 切换上下文\n  - 切换到用户模式\n  -\
    \ 跳转到用户程序中的适当位置以重新启动该程序\n- **分派延迟**——分派程序停止一个进程并启动另一个进程运行所需的时间。\n\n**分派程序应尽可能快。**\n\
    \n## 调度准则\n\n- 比较不同调度算法时有许多准则。\n- 以下是五个常见的准则：\n  - CPU 利用率\n  - 吞吐量\n  - 周转时间\n\
    \  - 等待时间\n  - 响应时间\n\n## CPU 利用率\n\n- 我们希望让 CPU 尽可能保持忙碌。\n- CPU 利用率的范围从 0 到 100%。\n\
    - 通常，40% 或以下为轻负载，90% 或以上为重负载。\n\n## 吞吐量\n\n- 每个时间单位内完成的进程数称为**_吞吐量_**。\n- 更高的吞吐量意味着完成更多作业。\n\
    - 然而，对于长时间运行的进程，该速率可能是一个小时一个作业；而对于短作业，该速率可能是每分钟 10 个。\n\n## 周转时间\n\n- 从作业提交到完成的时间段称为**周转时间**。\n\
    - 从用户的角度来看，周转时间比 CPU 利用率和吞吐量更重要。\n- 周转时间是以下各项之和：\n  - 进入系统之前的等待时间\n  - 在就绪队列中的等待时间\n\
    \  - 在所有其他事件（如 I/O）上的等待时间\n  - 进程实际在 CPU 上运行的时间\n\n## 等待时间\n\n- **等待时间**是进程在**就绪队列**中等待的时间段之和。\n\
    - **为什么只考虑就绪队列？**\n  - CPU 调度算法不影响进程执行或进行 I/O 的时间。\n  - 但是，CPU 调度算法确实会影响进程在就绪队列中停留的时间。\n\
    \n## 响应时间\n\n- （在交互式系统中）从提交请求到产生首次响应的时间称为**响应时间**。它**不包括**输出响应所需的时间。\n- 例如，在你的工作站前，你也许更关心按下**回车**键到获得第一个输出之间的时间，而不是按下**回车**键到程序完成的时间（如周转时间）。\n\
    \n## 优化准则\n\n- 最大化 CPU 利用率\n- 最大化吞吐量\n- 最小化周转时间\n- 最小化等待时间\n- 最小化响应时间\n\n在大多数情况下，我们优化平均值。\n\
    然而，在某些情况下，需要优化最小值或最大值而非平均值。\n\n## 大纲\n\n- 基本概念\n- 调度准则\n- **调度算法**\n- 多处理器调度\n\
    - 实时调度\n- 线程调度\n- 算法评估\n- 操作系统示例\n\n## 调度算法\n\n- 先来先服务调度（FCFS）\n- 最短作业优先调度（SJF）\n\
    - 优先级调度\n- 时间片轮转调度\n- 多级队列调度\n- 多级反馈队列调度\n\n## 先来先服务（FCFS）调度\n\n- 首先请求 CPU 的进程最先获得\
    \ CPU。\n- 这可以很容易地使用队列实现。\n- **FCFS 是不可抢占的。**一旦进程获得 CPU，它将占用 CPU，直到进程完成或自愿进入等待状态。\n\
    \n## FCFS 调度\n\n| 进程 | CPU 突发时间 |\n|---|---|\n| P₁ | 24 |\n| P₂ | 3 |\n| P₃ |\
    \ 3 |\n\n假设进程按 P₁、P₂、P₃ 的顺序到达，该调度的甘特图如下：\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_296_0.png)\n\
    \n平均等待时间？\n\n每个进程的等待时间？\n\n"
