  md: "\n## Dynamic Loading\n\n- Better memory-space utilization; unused routine is\
    \ never loaded.\n- Useful when large amounts of code are needed to handle infrequently\
    \ occurring cases.\n\n## Dynamic Linking\n\n- Both Linking and loading postponed\
    \ until execution time.\n- A *stub* is added to each reference of library routine.\
    \ A stub is a small piece of code that indicates how to locate and load the routine\
    \ if it is not loaded.\n- When a routine is called, its stub is executed. The\
    \ routine is loaded, the address of that routine replaces the stub, and executes\
    \ the routine.\n\n### Swapping\n\n- A process can be *swapped* temporarily out\
    \ of memory to a **backing store**, and then brought back into memory for continued\
    \ execution.\n- **Backing store** – fast disk large enough to accommodate copies\
    \ of all memory images for all users; must provide direct access to these memory\
    \ images.\n\n### Swapping\n\n- **Ready queue** is consisting of all processes\
    \ **on the backing store or in memory** and are ready to run\n- Major part of\
    \ swap time is transfer time; total transfer time is directly proportional to\
    \ the *amount* of memory swapped.\n\n## Schematic View of Swapping\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_509_0.png)\n\
    \noperating system\n\nuser space\n\nmain memory\n\n1. swap out\n\n2. swap in\n\
    \nprocess P₁\n\nprocess P₂\n\nbacking store\n\n## Contiguous Allocation\n\n- The\
    \ main memory is usually divided into two partitions\n  - One for the resident\
    \ operating system, usually held in low memory with interrupt vector.\n  - One\
    \ for user processes then held in high memory.\n- Relocation register scheme used\
    \ to protect user processes from each other, and from changing operating-system\
    \ code and data.\n\n## Hardware Support for Relocation and Limit Registers\n\n\
    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_512_0.png)\n\n## Contiguous Allocation\n\
    \n- Fixed partitions\n- Variable partitions\n\n### Fixed partitions\n\n- Memory\
    \ is divided into *n* partitions at the startup time and altered later on.\n-\
    \ Each partition may contain exactly one process.\n- Each partition may have a\
    \ job queue. Or, all partitions share the same job queue.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_514_0.png)\n\
    \n## Variable Partitions\n\n- *Hole (H)* – block of available memory; holes of\
    \ various size are scattered throughout memory.\n- When a process arrives, it\
    \ is allocated memory from a hole large enough to accommodate it.\n- Thus, partition\
    \ sizes are not fixed, The number of partitions also varies.\n- Operating system\
    \ maintains information about\n  - allocated partitions\n  - free partitions (hole)\n\
    \n### Variable Partitions\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_516_0.png)\n\
    \n### Variable Partitions\n\n- If the hole is larger than the requested size,\
    \ it is cut into two. The one of the requested size is given to the process, the\
    \ remaining one becomes a *new* hole.\n- When a process returns a memory block,\
    \ it becomes a hole and must be combined with its neighbors.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_517_0.png)\n\
    \n## Solutions to Dynamic Storage-Allocation Problem\n\n- **First-fit(首次适配):**\
    \ Allocate the *first* hole that is big enough.\n- **Best-fit(最佳适配):** Allocate\
    \ the *smallest* hole that is big enough; must search entire list, unless ordered\
    \ by size. Produces the smallest leftover hole.\n- **Worst-fit(最差适配):** Allocate\
    \ the *largest* hole; must also search entire list. Produces the largest leftover\
    \ hole.\n\n## Solutions to Dynamic Storage-Allocation Problem\n\n- Simulations\
    \ have shown that\n  - both first fit and best fit are better than worst fit in\
    \ terms of decreasing time and storage utilization\n  - Neither first fit nor\
    \ best fit is clearly better than the other in terms of storage utilization, but\
    \ first fit is generally faster.\n\n## Exercise1\n\n- 某基于动态分区存储管理的计算机，其主存容量为55MB（初始为空闲），采用最佳适配算法，分配和释放的顺序为分配15MB、分配30MB、释放15MB、分配8MB、分配6MB，此时主存中最大空闲分区大小是多少？\n"
  mdcn: "\n\n## 动态加载\n\n- 更好的内存空间利用率；未使用的例程永远不会被加载。\n- 当需要大量代码来处理不经常出现的情况时很有用。\n\n\
    ## 动态链接\n\n- 链接和加载都推迟到执行时。\n- 每个库例程的引用中都添加了一个 *stub*。Stub 是一小段代码，用于指示如何定位和加载该例程（如果尚未加载）。\n\
    - 当例程被调用时，其 stub 会被执行。该例程被加载，该例程的地址替换 stub，并执行该例程。\n\n### 交换\n\n- 进程可以暂时被 *swapped*\
    \ 到 **后备存储** 中，然后再被带回内存继续执行。\n- **后备存储** – 足够容纳所有用户所有内存映像副本的快速磁盘；必须提供对这些内存映像的直接访问。\n\
    \n### 交换\n\n- **就绪队列** 由所有位于 **后备存储或内存中** 且准备运行的进程组成\n- 交换时间的主要部分是传输时间；总传输时间与交换的\
    \ *amount* 内存成正比。\n\n## 交换的示意视图\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_509_0.png)\n\
    \noperating system\n\nuser space\n\nmain memory\n\n1. swap out\n\n2. swap in\n\
    \nprocess P₁\n\nprocess P₂\n\nbacking store\n\n## 连续分配\n\n- 主内存通常分为两个分区\n  - 一个用于常驻操作系统，通常保留在低内存中并带有中断向量。\n\
    \  - 一个用于用户进程，然后保留在高内存中。\n- 使用重定位寄存器方案来保护用户进程彼此之间，以及防止更改操作系统代码和数据。\n\n## 重定位和限制寄存器的硬件支持\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_512_0.png)\n\n## 连续分配\n\n- 固定分区\n-\
    \ 可变分区\n\n### 固定分区\n\n- 内存是在启动时划分为 *n* 个分区，并且之后不再更改。\n- 每个分区可能包含恰好一个进程。\n- 每个分区可能有一个作业队列。或者，所有分区共享同一个作业队列。\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_514_0.png)\n\n## 可变分区\n\n- *Hole (H)*\
    \ – 可用内存块；不同大小的空洞散布在整个内存中。\n- 当进程到达时，从足够容纳它的空洞中分配内存。\n- 因此，分区大小不是固定的，分区的数量也各不相同。\n\
    - 操作系统维护有关以下信息\n  - 已分配分区\n  - 空闲分区（空洞）\n\n### 可变分区\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_516_0.png)\n\
    \n### 可变分区\n\n- 如果空洞大于请求的大小，则将其切分为两部分。其中一个按请求大小分配给进程，剩余部分成为 *new* 空洞。\n- 当进程归还内存块时，它会成为一个空洞，并且必须与其邻居合并。\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_517_0.png)\n\n## 动态存储分配问题的解决方案\n\n\
    - **First-fit(首次适配):** 分配第一个足够大的空洞。\n- **Best-fit(最佳适配):** 分配足够大的 *smallest* 空洞；必须搜索整个列表，除非按大小排序。产生最小的剩余空洞。\n\
    - **Worst-fit(最差适配):** 分配 *largest* 空洞；也必须搜索整个列表。产生最大的剩余空洞。\n\n## 动态存储分配问题的解决方案\n\
    \n- 模拟表明\n  - 就减少时间和存储利用率而言，首次适配和最佳适配都优于最差适配\n  - 就存储利用率而言，首次适配和最佳适配之间没有明显优劣，但首次适配通常更快。\n\
    \n## Exercise1\n\n- 某基于动态分区存储管理的计算机，其主存容量为55MB（初始为空闲），采用最佳适配算法，分配和释放的顺序为分配15MB、分配30MB、释放15MB、分配8MB、分配6MB，此时主存中最大空闲分区大小是多少？\n\
    \n"
