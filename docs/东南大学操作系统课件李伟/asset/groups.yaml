    \nP_CPU = [60 - (45 - 35)] / 60 × 100% = 50 / 60 × 100% = 83.3%\n\n若在单道程序系统中，CPU的利用率是多少？\n\
    \n## Advantages and disadvantages of multiprogramming\n\n提高CPU的利用率，充分发挥并行性，这包括：程序之间、设备之间、设备与CPU之间均并行工作。\n\
    \n用户独占资源，无交互性，延迟大。\n\n## Time-Sharing Systems–Interactive Computing\n\n- Time-sharing\
    \ operating system allows many users to share the computer simultaneously.\n-\
    \ Switches rapidly from one user to the next.\n- Gives users the impression: the\
    \ entire computer system is dedicated for his use.\n- The CPU is multiplexed among\
