  md: "\n## Page Cache\n\n- A page cache caches pages rather than disk blocks using\
    \ virtual memory techniques\n- Memory-mapped I/O uses a page cache\n- Routine\
    \ I/O through the file system uses the buffer (disk) cache\n- This leads to the\
    \ following figure\n\n## I/O Without a Unified Buffer Cache\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_724_0.png)\n\
    \n## Unified Buffer Cache\n\nA unified buffer cache uses the same page cache to\
    \ cache both memory-mapped pages and ordinary file system I/O\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_725_0.png)\n\
    \n## Outline\n\n- File-System Structure\n- File-System Implementation\n- Directory\
    \ Implementation\n- Allocation Methods\n- Free-Space Management\n- Efficiency\
    \ and Performance\n- Recovery\n- Log-Structured File Systems\n- NFS\n\n## Recovery\n\
    \n- **Consistency checking** – compares data in directory structure with data\
    \ blocks on disk, and tries to fix inconsistencies\n- Use system programs to **back\
    \ up** data from disk to another storage device (floppy disk, magnetic tape, other\
    \ magnetic disk, optical)\n- **Recover** lost file or disk by restoring data from\
    \ backup\n\n## Log Structured File Systems\n\n- **Log structured** (or **journaling**)\
    \ file systems record each update to the file system as a **transaction**\n- All\
    \ transactions are written to a **log**\n  - A transaction is considered **committed**\
    \ once it is written to the log\n  - However, the file system may not yet be updated\n\
    \n## Log Structured File Systems\n\n- The transactions in the log are asynchronously\
    \ written to the file system\n  - When the file system is modified, the transaction\
    \ is removed from the log\n- If the file system crashes, all remaining transactions\
    \ in the log must still be performed\n\n## Outline\n\n- File-System Structure\n\
    - File-System Implementation\n- Directory Implementation\n- Allocation Methods\n\
    - Free-Space Management\n- Efficiency and Performance\n- Recovery\n- Log-Structured\
    \ File Systems\n- NFS\n\n## The Sun Network File System (NFS)\n\n- An implementation\
    \ and a specification of a software system for accessing remote files across LANs\
    \ (or WANs)\n- The implementation is part of the Solaris and SunOS operating systems\
    \ running on Sun workstations using an unreliable datagram protocol (UDP/IP protocol\
    \ and Ethernet)\n\n## NFS\n\n- Interconnected workstations viewed as a set of\
    \ independent machines with independent file systems, which allows sharing among\
    \ these file systems in a transparent manner\n  - A remote directory is mounted\
    \ over a local file system directory\n    - The mounted directory looks like an\
    \ integral subtree of the local file system, replacing the subtree descending\
    \ from the local directory\n\n## NFS\n\n- NFS is designed to operate in a heterogeneous\
    \ environment of different machines, operating systems, and network architectures;\
    \ the NFS specifications independent of these media\n- This independence is achieved\
    \ through the use of RPC primitives built on top of an External Data Representation\
    \ (XDR) protocol used between two implementation-independent interfaces\n- The\
    \ NFS specification distinguishes between the services provided by a mount mechanism\
    \ and the actual remote-file-access services\n\n## Three Independent File Systems\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_736_0.png)\n\n## Mounting in NFS\n\n\
    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_737_0.png)\n\nMounts\n\nCascading mounts\n\
    \n## NFS Mount Protocol\n\n- Establishes initial logical connection between server\
    \ and client\n- Mount operation includes name of remote directory to be mounted\
    \ and name of server machine storing it\n- Mount request is mapped to corresponding\
    \ RPC and forwarded to mount server running on server machine\n- Export list –\
    \ specifies local file systems that server exports for mounting, along with names\
    \ of machines that are permitted to mount them\n"
  mdcn: "\n\n## 页面缓存\n\n- 页面缓存使用虚拟内存技术缓存页面而不是磁盘块\n- 内存映射 I/O 使用页面缓存\n- 通过文件系统的常规 I/O\
    \ 使用缓冲（磁盘）缓存\n- 这导致了以下图示\n\n## 无统一缓冲缓存的 I/O\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_724_0.png)\n\
    \n## 统一缓冲缓存\n\n统一缓冲缓存使用相同的页面缓存来缓存内存映射页面和普通文件系统 I/O\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_725_0.png)\n\
    \n## 大纲\n\n- 文件系统结构\n- 文件系统实现\n- 目录实现\n- 分配方法\n- 空闲空间管理\n- 效率和性能\n- 恢复\n- 日志结构文件系统\n\
    - NFS\n\n## 恢复\n\n- **一致性检查** – 将目录结构中的数据与磁盘上的数据块进行比较，并尝试修复不一致\n- 使用系统程序将数据从磁盘备份到另一存储设备（软盘、磁带、其他磁盘、光盘）\n\
    - 通过从备份中恢复数据来**恢复**丢失的文件或磁盘\n\n## 日志结构文件系统\n\n- **日志结构**（或**日志式**）文件系统将对文件系统的每次更新记录为**事务**\n\
    - 所有事务都写入**日志**\n  - 一旦事务写入日志，即被视为**已提交**\n  - 然而，文件系统可能尚未更新\n\n## 日志结构文件系统\n\n\
    - 日志中的事务会异步写入文件系统\n  - 当文件系统被修改时，事务会从日志中移除\n- 如果文件系统崩溃，日志中剩余的所有事务仍必须执行\n\n## 大纲\n\
    \n- 文件系统结构\n- 文件系统实现\n- 目录实现\n- 分配方法\n- 空闲空间管理\n- 效率和性能\n- 恢复\n- 日志结构文件系统\n- NFS\n\
    \n## Sun 网络文件系统（NFS）\n\n- 一种用于在局域网（或广域网）上访问远程文件的软件系统的实现和规范\n- 该实现是 Solaris 和 SunOS\
    \ 操作系统的一部分，运行在 Sun 工作站上，使用不可靠的数据报协议（UDP/IP 协议和以太网）\n\n## NFS\n\n- 相互连接的工作站被视为一组具有独立文件系统的独立机器，这允许以透明的方式在这些文件系统之间共享\n\
    \  - 远程目录挂载在本地文件系统目录之上\n    - 挂载的目录看起来像是本地文件系统的一个整体子树，替换了从本地目录开始的子树\n\n## NFS\n\
    \n- NFS 设计用于在不同机器、操作系统和网络架构的异构环境中运行；NFS 规范独立于这些媒介\n- 这种独立性是通过在两个实现无关接口之间使用基于外部数据表示（XDR）协议的\
    \ RPC 原语来实现的\n- NFS 规范区分了挂载机制提供的服务和实际的远程文件访问服务\n\n## 三个独立的文件系统\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_736_0.png)\n\
    \n## NFS 中的挂载\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_737_0.png)\n\n挂载\n\n\
    级联挂载\n\n## NFS 挂载协议\n\n- 在服务器和客户端之间建立初始逻辑连接\n- 挂载操作包括要挂载的远程目录名称和存储它的服务器机器名称\n\
    - 挂载请求被映射为相应的 RPC 并转发到在服务器机器上运行的挂载服务器\n- 导出列表 – 指定服务器导出的本地文件系统以供挂载，以及允许挂载它们的机器名称\n\
    \n"
