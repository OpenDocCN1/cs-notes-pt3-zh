  mdcn: "\n## 先进先出（FIFO）算法\n\n- **引用串**\n  - 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n\
    - **3个帧（每个进程一次最多可以在内存中保存3个页面）**\n\n| 1 | 4 | 5 |\n|---|---|---|\n| 2 | 1 | 3 |\n\
    | 3 | 2 | 4 |\n\n**9次缺页错误**\n\n## 先进先出（FIFO）算法\n\n- 4个帧\n\n| 帧 | 页 |\n|---|---|\n\
    | 1 | 5  4 |\n| 2 | 1  5 |\n| 3 | 2 |\n| 4 | 3 |\n\n10次缺页错误\n\n- FIFO替换 – **Belady异常**\n\
    \  - 越多帧 ⇒ 越多缺页错误\n\n## FIFO图示Belady异常\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_600_0.png)\n\
    \n## 最优算法\n\n- 替换将来最长时间不会被使用的页面。\n- 4个帧示例 — 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\
    - 你怎么知道这一点？\n- 用于衡量你的算法表现如何。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_601_0.png)\n\
    \n## 使用栈记录最近引用的页面\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_604_0.png)\n\n引用串\n\
    \n4 7 0 7 1 0 1 2 1 2 7 1 2\n\na之前的栈：2, 1, 0, 7, 4\n\nb之后的栈：7, 2, 1, 0, 4\n\n\
    a\n\nb\n\n## LRU近似\n算法\n\n## 引用位\n\n- 页表中的每个条目关联一个位，初始为0。\n- 当页面被引用时，该位将被置1。\n\
    - 替换位为0的页面（如果存在）。我们不知道使用的顺序，但可以确定哪些页面已被使用，哪些未被使用。\n\n## LRU近似算法\n\n- **附加引用位算法**\n\
    \  - 为每个页面保留一个8位字节\n  - 定期将位右移1位，将引用位移入最高位\n  - 将这些8位字节解释为无符号整数，数字最小的页面是LRU页面\n\
    \n## LRU近似\n算法\n\n## ■ 第二次机会算法\n\n- 需要引用位。\n- 时钟替换（FIFO）。\n- 如果要替换的页面（按时钟顺序）的引用位为1，则：\n\
    \  - 将引用位设为0。\n  - 将该页面保留在内存中。\n  - 替换下一个页面（按时钟顺序），遵循相同规则。\n\n## 第二次机会页面置换算法\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_608_0.png)\n\n## 计数算法\n\n- 为每个页面记录一个被引用的次数计数器。\n\
    - **LFU算法：** 替换计数最小的页面。\n- **MFU算法：** 基于以下论点：计数最小的页面可能是刚调入且尚未被使用的。\n\n## 大纲\n\n\
    - 背景\n- 请求分页\n- 页面置换\n- **帧分配**\n- 抖动\n- 内存映射文件\n- 分配内核内存\n- 其他考虑\n- 操作系统示例\n\n\
    ## 固定分配\n\n- **平均分配** – 例如，如果有100个帧和5个进程，则每个进程分配20个页面。\n- **比例分配** – 根据进程的大小进行分配。\n\
    \ns_i = 进程 p_i 的大小\nS = Σ s_i\nm = 总帧数\na_i = 为 p_i 分配的帧数 = s_i / S × m\n\n##\
    \ 优先级分配\n\n- 使用基于优先级而不是大小的比例分配方案。\n- 如果进程 *Pᵢ* 产生缺页错误，\n  - 选择替换它自己的一个帧。\n  -\
    \ 选择替换来自优先级较低的进程的一个帧。\n\n## 全局与局部分配\n\n- **全局替换** – 进程从所有帧的集合中选择一个替换帧；一个进程可以从另一个进程中获取一个帧。\n\
    \n- **局部替换** – 每个进程仅从自己分配的帧集合中选择。\n\n## 大纲\n\n- 背景\n- 请求分页\n- 页面置换\n- 帧分配\n- 抖动\n\
    - 内存映射文件\n- 分配内核内存\n- 其他考虑\n- 操作系统示例\n\n"
