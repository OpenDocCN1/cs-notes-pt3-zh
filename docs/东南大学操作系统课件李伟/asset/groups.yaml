    \ systems).\n- Each process keeps a separate copy of the private code and data\n\
    \n## Outline\n\n- Background\n- Contiguous Allocation\n- Paging\n- Structure of\
    \ Page Table\n- Segmentation\n\n## Structure of Page Table\n\n- Hierarchical Paging\n\
    - Hashed Page Tables\n- Inverted Page Tables\n\n## Hierarchical Paging\n\n- Break\
    \ up the logical address space into multiple page tables.\n- A simple technique\
    \ is a two-level page table.\n\n## Two-Level Paging Example\n\n- A logical address\
    \ (on 32-bit machine with 4K page size) is divided into:\n  - a page number consisting\
    \ of 20 bits.\n  - a page offset consisting of 12 bits.\n- Since the page table\
    \ is paged, the page number is further divided into:\n  - a 10-bit page number.\n\
    \  - a 10-bit page offset.\n\n## Two-Level Paging Example\n\nThus, a logical address\
    \ is as follows:\n\n| page number | page offset |\n|---|---|\n| p₁ | p₂ | d |\n\
    \n10 10 12\n\nwhere p₁ is an index into the outer page table, and p₂ is the displacement\
    \ within the page of the outer page table.\n\n## Two-Level Page-Table Scheme\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_553_0.png)\n\n## Three-level Paging\
    \ Scheme\n\n| outer page | inner page | offset |\n|---|---|---|\n| $p_1$ | $p_2$\
    \ | $d$ |\n| 42 | 10 | 12 |\n\n| 2nd outer page | outer page | inner page | offset\
    \ |\n|---|---|---|---|\n| $p_1$ | $p_2$ | $p_3$ | $d$ |\n| 32 | 10 | 10 | 12 |\n\
    \n## Exercise4\n\n- 某计算机采用二级页表的分页存储管理方式，按字节编址，页大小为 $2^{10}$B，页表项大小为2B，逻辑地址结构为（页目录号，页号，页内偏移量），逻辑地址空间大小为\
    \ $2^{16}$ 页，则表示整个逻辑地址空间的页目录表中包含表项的个数至少是多少？\n\n## Hashed Page Tables\n\n- Common\
    \ in address spaces > 32 bits.\n- The virtual page number is hashed into a page\
    \ table. Each entry in this page table contains a chain of elements hashing to\
    \ the same location.\n- Virtual page numbers are compared in this chain searching\
    \ for a match. If a match is found, the corresponding physical frame is extracted.\n"
  mdcn: "\n## 带TLB的分页硬件\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_539_0.png)\n\n\
    ## 页表的实现\n\n- 有些TLB在每个TLB条目中存储**地址空间标识符（ASID）**——唯一标识每个进程，为该进程提供地址空间保护。\n- ASID允许TLB同时包含多个不同进程的条目。否则，每次上下文切换时都需要刷新TLB。\n\
    \n## 有效访问时间\n\n- **命中率（Hit ratio）**——在TLB中找到页号的次数百分比。\n- 命中率 = α\n- TLB查找 = ε\
    \ 时间单位\n- 假设内存周期时间为1微秒\n- 有效访问时间（EAT）\n\nEAT = (1 + ε) α + (2 + ε)(1 − α)\n\n\
    = 2 + ε − α\n\n## 练习3\n\n考虑一个分页系统，其页表存放在内存：\n\n- （1）如果内存读写周期为2μ s，则CPU从内存取一条指令或一个操作数需要时间为多少？\n\
    \n- （2）如果设立一个可存放8个页表项的TLB，70%的地址变换可通过TLB完成，内存平均存取时间为多少？（假设TLB的访问时间可以忽略不计）\n\n\
    ## 内存保护\n\n- 在分页环境中，通过将保护位与每个帧相关联来实现内存保护。\n- *有效-无效位*附加到页表的每个条目：\n  - “有效”表示关联的页位于进程的逻辑地址空间中，因此是合法页。\n\
    \  - “无效”表示该页不在进程的逻辑地址空间中。\n\n## 页表中的有效（v）或无效（i）位\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_544_0.png)\n\
    \n| 页表项 | 帧号 | 有效-无效位 |\n|---:|---:|:---:|\n| 0 | 2 | v |\n| 1 | 3 | v |\n| 2\
    \ | 4 | v |\n| 3 | 7 | v |\n| 4 | 8 | v |\n| 5 | 9 | v |\n| 6 | 0 | i |\n| 7 |\
    \ 0 | i |\n\n## 内存保护\n\n- 可以使用*页表长度寄存器*（*PTLR*）来存储进程页表的长度。这样，进程无法访问超出其区域的存储空间。\n\
    - 还可以在页表中添加只读、读写或执行位，以强制实施 r-w-e 权限。\n\n## 共享页\n\n- 共享代码：**只读（可重入）**代码的单个副本在进程间共享（例如，文本编辑器、编译器、窗口系统）。\n\
    - 每个进程保留私有代码和数据的单独副本。\n\n## 大纲\n\n- 背景\n- 连续分配\n- 分页\n- 页表的结构\n- 分段\n\n## 页表的结构\n\
    \n- 分层分页\n- 哈希页表\n- 反向页表\n\n## 分层分页\n\n- 将逻辑地址空间分解为多个页表。\n- 一种简单的技术是两级页表。\n\n\
    ## 两级分页示例\n\n- 逻辑地址（在32位机器上，页大小为4K）被划分为：\n  - 由20位组成的页号。\n  - 由12位组成的页偏移量。\n-\
    \ 由于页表本身也是分页的，页号进一步划分为：\n  - 10位页号。\n  - 10位页偏移量。\n\n## 两级分页示例\n\n因此，逻辑地址如下：\n\
    \n| 页号 | 页偏移量 |\n|---|---|\n| p₁ | p₂ | d |\n\n10 10 12\n\n其中p₁是外部页表的索引，p₂是外部页表所在页内的位移。\n\
    \n## 两级页表方案\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_553_0.png)\n\n## 三级分页方案\n\
    \n| 外部页 | 内部页 | 偏移量 |\n|---|---|---|\n| $p_1$ | $p_2$ | $d$ |\n| 42 | 10 | 12\
    \ |\n\n| 第二级外部页 | 外部页 | 内部页 | 偏移量 |\n|---|---|---|---|\n| $p_1$ | $p_2$ | $p_3$\
    \ | $d$ |\n| 32 | 10 | 10 | 12 |\n\n## 练习4\n\n- 某计算机采用二级页表的分页存储管理方式，按字节编址，页大小为\
    \ $2^{10}$B，页表项大小为2B，逻辑地址结构为（页目录号，页号，页内偏移量），逻辑地址空间大小为 $2^{16}$ 页，则表示整个逻辑地址空间的页目录表中包含表项的个数至少是多少？\n\
    \n## 哈希页表\n\n- 常见于地址空间大于32位的情况。\n- 虚拟页号被哈希到页表中。该页表中的每个条目包含一个哈希到同一位置的元素链。\n- 在此链中比较虚拟页号以查找匹配项。如果找到匹配项，则提取相应的物理帧。\n\
    \n"
