  md: "\n## NFS Mount Protocol\n- Following a mount request that conforms to its export\
    \ list, the server returns a file handle—a key for further accesses\n- File handle\
    \ – a file-system identifier, and an inode number to identify the mounted directory\
    \ within the exported file system\n- The mount operation changes only the user’s\
    \ view and does not affect the server side\n\n## NFS Protocol\n- Provides a set\
    \ of remote procedure calls for remote file operations.\n- The procedures support\
    \ the following operations\n  - searching for a file within a directory\n  - reading\
    \ a set of directory entries\n  - manipulating links and directories\n  - accessing\
    \ file attributes\n  - reading and writing files\n\n## NFS Protocol\n- NFS servers\
    \ are **stateless**; each request has to provide a full set of arguments\n  -\
    \ (NFS V4 is just coming available – very different, stateful)\n- Modified data\
    \ must be committed to the server’s disk before results are returned to the client\
    \ (lose advantages of caching)\n- The NFS protocol does not provide concurrency-control\
    \ mechanisms\n\n## Three Major Layers of NFS Architecture\n- UNIX file-system\
    \ interface (based on the open, read, write, and close calls, and file descriptors)\n\
    - *Virtual File System* (VFS) layer – distinguishes local files from remote ones,\
    \ and local files are further distinguished according to their file-system types\n\
    \  - The VFS activates file-system-specific operations to handle local requests\
    \ according to their file-system types\n  - Calls the NFS protocol procedures\
    \ for remote requests\n- NFS service layer – bottom layer\n  - Implements the\
    \ NFS protocol\n\n## NFS Path-Name Translation\n- Performed by breaking the path\
    \ into component names and performing a separate NFS lookup call for every pair\
    \ of component name and directory vnode\n- To make lookup faster, a directory\
    \ name lookup cache on the client’s side holds the vnodes for remote directory\
    \ names\n\n## NFS Remote Operations\n- Nearly one-to-one correspondence between\
    \ regular UNIX system calls and the NFS protocol RPCs (except opening and closing\
    \ files)\n- NFS adheres to the remote-service paradigm, but employs buffering\
    \ and caching techniques for the sake of performance\n\n## NFS Remote Operations\n\
    - **File-blocks cache** – when a file is opened, the kernel checks with the remote\
    \ server whether to fetch or revalidate the cached attributes\n  - Cached file\
    \ blocks are used only if the corresponding cached attributes are up to date\n\
    - **File-attribute cache** – the attribute cache is updated whenever new attributes\
    \ arrive from the server\n- Clients do not free delayed-write blocks until the\
    \ server confirms that the data have been written to disk\n\n## 操作系统原理及应用\n\n\
    李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n江苏省网络与信息安全重点实验室\n\n## Chapter 12 Mass\
