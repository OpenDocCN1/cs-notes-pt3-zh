  - '[PAGE 539]


    # Paging Hardware With TLB


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_539_0.png)'
  - '[PAGE 540]


    # Implementation of Page Table


    +   - Some TLBs store **address-space identifiers (ASIDs)** in each TLB entry
    – uniquely identifies each process to provide address-space protection for that
    process.

    +   - ASID allows the TLB to contain entries for several different processes simultaneously.
    Otherwise it need to be flushed at every context switch.'
  - '[PAGE 541]


    # Effective Access Time


    +   - **Hit ratio (命中率)** – percentage of times that a page number is found in
    TLB.

    +   - Hit ratio = α

    +   - TLB Lookup = ε time unit

    +   - Assume memory cycle time is 1 microsecond

    +   - Effective Access Time (EAT)


    EAT = (1 + ε) α + (2 + ε)(1 − α)


    = 2 + ε − α'
  - '[PAGE 542]


    # Exercise3


    考虑一个分页系统，其页表存放在内存：


    +   （1）如果内存读写周期为2μ s，则CPU从内存取一条指令或一个操作数需要时间为多少？


    +   （2）如果设立一个可存放8个页表项的TLB，70%的地址变换可通过TLB完成，内存平均存取时间为多少？（假设TLB的访问时间可以忽略不计）'
  - '[PAGE 543]


    # Memory Protection


    +   - Memory protection implemented by associating protection bit with each frame
    in a paged environment.

    +   - *Valid-invalid bit* attached to each entry in the page table:

    +     - “valid” indicates that the associated page is in the process’s logical
    address space, and is thus a legal page.

    +     - “invalid” indicates that the page is not in the process’s logical address
    space.'
  - '[PAGE 544]


    # Valid (v) or Invalid (i) Bit In A Page Table


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_544_0.png)


    | Page table entry | Frame number | Valid-invalid bit |

    |---:|---:|:---:|

    | 0 | 2 | v |

    | 1 | 3 | v |

    | 2 | 4 | v |

    | 3 | 7 | v |

    | 4 | 8 | v |

    | 5 | 9 | v |

    | 6 | 0 | i |

    | 7 | 0 | i |'
  - '[PAGE 545]


    # Memory Protection


    +   - we can use a *page table length register* *(PTLR)* that stores the length
    of a process’s page table. In this way, a process cannot access the memory beyond
    its region.

    +   - We can also add read-only, read-write, or execute bits in page table to
    enforce r-w-e permission.'
  - '[PAGE 546]


    # # Shared Pages


    +   - Shared code: One copy of **read-only (reentrant)** code shared among processes
    (i.e., text editors, compilers, window systems).

    +   - Each process keeps a separate copy of the private code and data'
  - '[PAGE 547]


