  md: "\n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n\n江苏省网络与信息安全重点实验室\n\
    \n## Chapter 10 File System Interface\n\n## Outline\n\n- **File Concept**\n- Access\
    \ Methods\n- Directory Structure\n- File System Mounting\n- File Sharing\n- Protection\n\
    \n## File Concept\n\n- A file is a **named collection** of related information\
    \ that is recorded on secondary storage.\n- Contiguous logical address space\n\
    - Types\n  - Data: numeric, character, binary\n  - Program\n\n## File Structure\n\
    \n- None - sequence of words, bytes\n- Simple record structure\n  - Lines\n  -\
    \ Fixed length\n  - Variable length\n- Complex Structures\n  - Formatted document\n\
    \  - Relocatable load file\n\n## File Attributes\n\n- **Name** – only information\
    \ kept in human-readable form.\n- **Identifier** – the non-human-readable name\
    \ for the file.\n- **Type** – needed for systems that support different types.\n\
    - **Location** – pointer to file location on device.\n- **Size** – current file\
    \ size.\n\n## File Attributes\n\n- **Protection** – controls who can do reading,\
    \ writing, executing.\n- **Time, date, and user identification** – data for protection,\
    \ security, and usage monitoring.\n- Information about files are kept in the directory\
    \ structure, which is maintained on the disk.\n\n## File Operations\n\n- Create\n\
    - Write\n- Read\n- Reposition within file – file seek\n- Delete\n- Truncate（截短）—\
    \ erase the contents of a file but keep its attributes.\n\n## File Operations\
    \ (Cont.)\n\n- Open($F_i$) – search the directory structure on disk for entry\
    \ $F_i$ and move the content of entry to memory.\n- Close ($F_i$) – move the content\
    \ of entry $F_i$ in memory to directory structure on disk.\n- Two levels of internal\
    \ tables\n  - A per-process table\n  - A system-wide table\n\n## File Types\n\n\
    | file type | usual extension | function |\n|---|---|---|\n| executable | exe,\
    \ com, bin or none | ready-to-run machine-language program |\n| object | obj,\
    \ o | compiled, machine language, not linked |\n| source code | c, cc, java, pas,\
    \ asm, a | source code in various languages |\n| batch | bat, sh | commands to\
    \ the command interpreter |\n| text | txt, doc | textual data, documents |\n|\
    \ word processor | wp, tex, rtf, doc | various word-processor formats |\n| library\
    \ | lib, a, so, dll | libraries of routines for programmers |\n| print or view\
    \ | ps, pdf, jpg | ASCII or binary file in a format for printing or viewing |\n\
    | archive | arc, zip, tar | related files grouped into one file, sometimes compressed,\
    \ for archiving or storage |\n| multimedia | mpeg, mov, rm, mp3, avi | binary\
    \ file containing audio or A/V information |\n\n## Outline\n\n- File Concept\n\
    - **Access Methods**\n- Directory Structure\n- File System Mounting\n- File Sharing\n\
    - Protection\n\n## Access Methods\n\n- Sequential Access\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_660_0.png)\n\
    \n- Direct Access\n\n## Simulation of Sequential Access on a Direct-access File\n\
    \n| sequential access | implementation for direct access |\n|---|---|\n| *reset*\
    \ | *cp* = 0; |\n| *read next* | *read cp*;<br>*cp* = *cp* + 1; |\n| *write next*\
    \ | *write cp*;<br>*cp* = *cp* + 1; |\n\n## Example of Index and Relative Files\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_662_0.png)\n\n## Outline\n\n- File\
    \ Concept\n- Access Methods\n- **Directory Structure**\n- File System Mounting\n\
    - File Sharing\n- Protection\n\n## Directory Structure\n\n- Disks are split into\
    \ one or more partitions.\n- Each partition contains information about files within\
    \ it.\n- The information is kept in entries in a device directory or volume table\
    \ of contents\n\n## A Typical File-system Organization\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_665_0.png)\n\
    \n## Operations Performed on Directory\n\n- Search for a file\n- Create a file\n\
    - Delete a file\n- List a directory\n- Rename a file\n- Traverse the file system\n"
