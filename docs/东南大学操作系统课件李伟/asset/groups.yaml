    \ the TLB\n  - Otherwise there is a high degree of page faults\n- Increase the\
    \ Page Size\n- Provide Multiple Page Sizes\n  - This allows applications that\
    \ require larger page sizes the opportunity to use them without an increase in\
    \ fragmentation\n\n## Other Issues – Program Structure\n\n- Program structure\n\
    \  - `int A[][] = new int[1024][1024];`\n  - Each row is stored in one page\n\
    \  - Program 1\n    ```\n    for (j = 0; j < A.length; j++)\n        for (i =\
    \ 0; i < A.length; i++)\n            A[i][j] = 0;\n    ```\n    1024 × 1024 page\
    \ faults\n  - Program 2\n    ```\n    for (i = 0; i < A.length; i++)\n       \
    \ for (j = 0; j < A.length; j++)\n            A[i][j] = 0;\n    ```\n    1024\
    \ page faults\n\n## Other Issues – I/O Interlock\n\n- I/O Interlock – Pages must\
    \ sometimes be locked into memory\n- Consider I/O – Pages that are used for copying\
    \ a file from a device must be locked from being selected for eviction by a page\
    \ replacement algorithm\n\n## Reason Why Frames Used for I/O Must Be in Memory\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_640_0.png)\n\n## Outline\n\n- Background\n\
    - Demand Paging\n- Page Replacement\n- Allocation of Frames\n- Thrashing\n- Memory-Mapped\
    \ Files\n- Allocating Kernel Memory\n- Other Considerations\n- Operating-System\
    \ Examples\n\n## Windows XP\n\n- Uses demand paging with clustering. Clustering\
    \ brings in pages surrounding the faulting page.\n- Processes are assigned working\
    \ set minimum and working set maximum\n- Working set minimum is the minimum number\
    \ of pages the process is guaranteed to have in memory\n- A process may be assigned\
    \ as many pages up to its working set maximum\n- When the amount of free memory\
    \ in the system falls below a threshold, automatic working set trimming is performed\
    \ to restore the amount of free memory\n- Working set trimming removes pages from\
    \ processes that have pages in excess of their working set minimum\n\n## Solaris\n\
    \n- Maintains a list of free pages to assign faulting processes\n- *Lotsfree*\
    \ – **threshold parameter (amount of free memory) to begin paging**\n- *Desfree*\
    \ – **threshold parameter to increase paging**\n- *Minfree* – **threshold parameter\
    \ to begin swapping**\n- Paging is performed by *pageout process*\n- Pageout scans\
    \ pages using modified clock algorithm\n- *Scanrate* is the rate at which pages\
    \ are scanned. This ranges from *slowscan* to *fastscan*\n- Pageout is called\
    \ more frequently depending upon the amount of free memory available\n\n## Solaris\
    \ 2 Page Scanner\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_647_0.png)\n\n- 8192\
    \ `fastscan`\n- scan rate\n- 100 `slowscan`\n- `minfree`, `desfree`, `lotsfree`\n\
    - amount of free memory\n\n## Part 3 小结\n\n- 基本概念：内存保护（基址寄存器 + 界限地址寄存器）、地址绑定、逻辑地址空间与物理地址空间、动态加载、动态链接、交换\n\
    - 连续分配：固定分区、可变分区（动态分配问题，3种方法）、碎片（内、外）\n- 分页：页、帧、页表、逻辑地址结构、页表实现（寄存器、PTBR、TLB）、Hit\
    \ Ratio（命中率）、内存保护、共享页、页表结构（层次、哈希、反向）、分段\n- 按需调页（有效访问时间）、写时复制、页置换算法（FIFO（Belady\
    \ 异常）、最优、LRU、近似 LRU、计数）\n- 帧分配（平均、按比例）、系统颠簸（含义、原因、解决方法）、内存映射文件、内核内存分配\n"
  mdcn: "\n\n## 大纲\n\n- 背景\n- 按需调页\n- 页置换\n- 帧分配\n- 系统颠簸\n- 内存映射文件\n- 分配内核内存\n- 其他考虑因素\n\
    - 操作系统示例\n\n## 其他问题 – 预调页\n\n- 预调页\n  - 用于减少进程启动时出现的大量缺页错误\n  - 在页面被引用之前预先调入进程所需的全部或部分页面\n\
    \  - 但如果预调的页面未被使用，则浪费了I/O和内存\n  - 假设预调了s个页面，其中α比例的页面被使用\n    - 节省的s × α次缺页错误的代价是大于还是小于预调s\
    \ × (1 − α)个不必要页面的代价？\n    - α趋近于零 ⇒ 预调页反而损失更大\n\n## 其他问题 – 页大小\n\n- 页大小的选择必须考虑\n\
    \  - 碎片化\n  - 页表大小\n  - I/O开销\n  - 局部性\n\n## 其他问题 – TLB连接范围\n\n- TLB连接范围 – 可从TLB访问的内存量\n\
    - TLB连接范围 = (TLB大小) × (页大小)\n- 理想情况下，每个进程的工作集都存储在TLB中\n  - 否则会导致大量缺页错误\n- 增加页大小\n\
    - 提供多种页大小\n  - 这使得需要更大页大小的应用程序有机会使用更大的页面，而不会增加碎片化\n\n## 其他问题 – 程序结构\n\n- 程序结构\n\
    \  - `int A[][] = new int[1024][1024];`\n  - 每一行存储在一个页面中\n  - 程序1\n    ```\n \
    \   for (j = 0; j < A.length; j++)\n        for (i = 0; i < A.length; i++)\n \
    \           A[i][j] = 0;\n    ```\n    1024 × 1024次缺页错误\n  - 程序2\n    ```\n  \
    \  for (i = 0; i < A.length; i++)\n        for (j = 0; j < A.length; j++)\n  \
    \          A[i][j] = 0;\n    ```\n    1024次缺页错误\n\n## 其他问题 – I/O互锁\n\n- I/O互锁\
    \ – 页面有时必须被锁定在内存中\n- 考虑I/O – 用于从设备复制文件的页面必须被锁定，以防止被页置换算法选中为淘汰对象\n\n## I/O使用的帧必须驻留在内存中的原因\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_640_0.png)\n\n## 大纲\n\n- 背景\n- 按需调页\n\
    - 页置换\n- 帧分配\n- 系统颠簸\n- 内存映射文件\n- 分配内核内存\n- 其他考虑因素\n- 操作系统示例\n\n## Windows XP\n\
    \n- 使用带聚簇的按需调页。聚簇会将缺页页面周围的页面一并调入内存。\n- 进程被分配工作集最小值和最大值\n- 工作集最小值是进程在内存中保证拥有的最小页数\n\
    - 进程最多可被分配达到其工作集最大值的页面数\n- 当系统中可用内存量低于阈值时，会执行自动工作集修剪以恢复可用内存量\n- 工作集修剪会从页面数超过其工作集最小值的进程中移除页面\n\
    \n## Solaris\n\n- 维护一个空闲页面列表以分配给缺页进程\n- *Lotsfree* – **开始分页的阈值参数（可用内存量）**\n- *Desfree*\
    \ – **增加分页的阈值参数**\n- *Minfree* – **开始交换的阈值参数**\n- 分页由*pageout进程*执行\n- Pageout使用改进的时钟算法扫描页面\n\
    - *Scanrate*是页面扫描的速率。其范围从*slowscan*到*fastscan*\n- Pageout被调用的频率取决于可用的内存量\n\n##\
    \ Solaris 2 页面扫描器\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_647_0.png)\n\n-\
    \ 8192 `fastscan`\n- 扫描速率\n- 100 `slowscan`\n- `minfree`、`desfree`、`lotsfree`\n\
    - 可用内存量\n\n## 第3部分 小结\n\n- 基本概念：内存保护（基址寄存器 + 界限地址寄存器）、地址绑定、逻辑地址空间与物理地址空间、动态加载、动态链接、交换\n\
    - 连续分配：固定分区、可变分区（动态分配问题，3种方法）、碎片（内、外）\n- 分页：页、帧、页表、逻辑地址结构、页表实现（寄存器、PTBR、TLB）、命中率、内存保护、共享页、页表结构（层次、哈希、反向）、分段\n\
    - 按需调页（有效访问时间）、写时复制、页置换算法（FIFO（Belady 异常）、最优、LRU、近似 LRU、计数）\n- 帧分配（平均、按比例）、系统颠簸（含义、原因、解决方法）、内存映射文件、内核内存分配\n\
    \n"
