  md: "\n## Organize the Directory (Logically) to Obtain\n\n- **Efficiency** – locating\
    \ a file quickly.\n- **Naming** – convenient to users.\n  - Two users can have\
    \ same name for different files.\n  - The same file can have several different\
    \ names.\n- **Grouping** – logical grouping of files by properties,  \n  (e.g.,\
    \ all Java programs, all games, …)\n\n### Single-Level Directory\n\n- A single\
    \ directory for all users\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_668_0.png)\n\
    \nNaming problem\n\nGrouping problem\n\n### Two-Level Directory\n\n- Separate\
    \ directory for each user\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_669_0.png)\n\
    \n- Path name\n- Can have the same file name for different user\n- Efficient searching\n\
    - No grouping capability\n\n### Tree-Structured Directories\n\n- Efficient searching\n\
    - Grouping Capability\n- Current directory (working directory)\n  - `cd /spell/mail/prog`\n\
    - Absolute or relative path name\n- Creating a new file is done in current directory\n\
    - Delete a file\n  - `rm <file-name>`\n- Creating a new subdirectory is done in\
    \ current directory.\n\n```\nmkdir <dir-name>\n```\n\nExample: if in current directory\
    \  /mail\n\n```\nmkdir count\n```\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_672_0.png)\n\
    \nDeleting “mail” ⇒ deleting the entire subtree rooted by “mail”.\n\n### Acyclic-Graph\
    \ Directories\n\n- Have shared subdirectories and files.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_673_0.png)\n\
    \n- Two different names (aliasing)\n- If *dict* deletes *count* ⇒ dangling pointer.\n\
    - Solutions:\n  - Backpointers, so we can delete all pointers.\n  - Entry-hold-count\
    \ solution.\n\n### General Graph Directory\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_675_0.png)\n\
    \n- **How do we guarantee no cycles?**\n  - Allow only links to file not subdirectories.\n\
    \  - Garbage collection.\n  - Every time a new link is added use a cycle detection\
    \ algorithm to determine whether it is OK.\n\n## Outline\n\n- File Concept\n-\
    \ Access Methods\n- Directory Structure\n- File System Mounting\n- File Sharing\n\
    - Protection\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_679_0.png)\n\n(a) Existing\n\
    \n(b) Unmounted Partition\n\n### Mount Point\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_680_0.png)\n\
    \n## Outline\n\n- File Concept\n- Access Methods\n- Directory Structure\n- File\
    \ System Mounting\n- File Sharing\n- Protection\n\n### File Sharing\n\n- Sharing\
    \ of files on multi-user systems is desirable.\n- Sharing may be done through\
    \ a *protection* scheme.\n- On distributed systems, files may be shared across\
    \ a network.\n- Network File System (NFS) is a common distributed file-sharing\
    \ method.\n\n## Outline\n\n- File Concept\n- Access Methods\n- Directory Structure\n\
    - File System Mounting\n- File Sharing\n- Protection\n\n### Protection\n\n- File\
    \ owner/creator should be able to control:\n  - what can be done by whom\n- Types\
    \ of access\n  - Read\n  - Write\n  - Execute\n  - Append\n  - Delete\n  - List\n\
    \n### Access Lists and Groups\n\n- Mode of access: read, write, execute\n- Three\
    \ classes of users RWX\n  - a) owner access 7 ⇒ 1 1 1\n  - b) group access 6 ⇒\
    \ 1 1 0\n  - c) public access 1 ⇒ 0 0 1\n- Ask manager to create a group (unique\
    \ name), say G, and add some users to the group.\n- For a particular file (say\
    \ *game*) or subdirectory, define an appropriate access.\n\n### Windows XP Access-control\
    \ List Management\n\n10 tex Properties\n\n- General\n- Security\n- Summary\n\n\
    Group or user names:\n\n- Administrators (PBG-LAPTOP\\Administrators)\n- Guest\
    \ (PBG-LAPTOP\\Guest)\n- pbg (CT\\pbg)\n- SYSTEM\n- Users (PBG-LAPTOP\\Users)\n\
    \nAdd...\n\nRemove\n\nPermissions for Guest\n\n|  | Allow | Deny |\n|---|---|---|\n\
    | Full Control |  | ☑ |\n| Modify |  | ☑ |\n| Read & Execute |  | ☑ |\n| Read\
    \ |  | ☑ |\n| Write |  | ☑ |\n| Special Permissions |  |  |\n\nFor special permissions\
    \ or for advanced settings, click Advanced.\n\nAdvanced\n\nOK\n\nCancel\n\nApply\n"
  mdcn: "\n## 从逻辑上组织目录，可以获得\n\n- **效率**——快速定位文件。\n- **命名**——方便用户使用。\n  - 两个用户可以为不同的文件使用相同的名称。\n\
    \  - 同一个文件可以有多个不同的名称。\n- **分组**——按属性对文件进行逻辑分组，  \n  （例如，所有 Java 程序、所有游戏……）\n\n\
    ### 单级目录\n\n- 所有用户共用一个目录\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_668_0.png)\n\
    \n命名问题\n\n分组问题\n\n### 二级目录\n\n- 每个用户有独立的目录\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_669_0.png)\n\
    \n- 路径名\n- 不同用户可以使用相同的文件名\n- 高效搜索\n- 没有分组能力\n\n### 树形结构目录\n\n- 高效搜索\n- 分组能力\n\
    - 当前目录（工作目录）\n  - `cd /spell/mail/prog`\n- 绝对路径名或相对路径名\n- 新文件在当前目录中创建\n- 删除文件\n\
    \  - `rm <file-name>`\n- 新子目录在当前目录中创建。\n\n```\nmkdir <dir-name>\n```\n\n示例：如果当前目录为\
    \ /mail\n\n```\nmkdir count\n```\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_672_0.png)\n\
    \n删除“mail” ⇒ 会删除以“mail”为根的整个子树。\n\n### 无环图目录\n\n- 拥有共享的子目录和文件。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_673_0.png)\n\
    \n- 两个不同的名称（别名）\n- 如果 *dict* 删除了 *count* ⇒ 悬空指针。\n- 解决方案：\n  - 反向指针，这样我们可以删除所有指针。\n\
    \  - 目录项保持计数方案。\n\n### 通用图目录\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_675_0.png)\n\
    \n- **如何保证没有环？**\n  - 只允许链接到文件，不允许链接到子目录。\n  - 垃圾回收。\n  - 每次添加新链接时，使用环检测算法来确定是否可行。\n\
    \n## 大纲\n\n- 文件概念\n- 访问方法\n- 目录结构\n- 文件系统挂载\n- 文件共享\n- 保护\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_679_0.png)\n\
    \n（a）已存在\n\n（b）未挂载的分区\n\n### 挂载点\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_680_0.png)\n\
    \n## 大纲\n\n- 文件概念\n- 访问方法\n- 目录结构\n- 文件系统挂载\n- 文件共享\n- 保护\n\n### 文件共享\n\n- 多用户系统上的文件共享是可取的。\n\
    - 共享可以通过*保护*方案来实现。\n- 在分布式系统中，文件可以通过网络共享。\n- 网络文件系统（NFS）是一种常见的分布式文件共享方法。\n\n##\
    \ 大纲\n\n- 文件概念\n- 访问方法\n- 目录结构\n- 文件系统挂载\n- 文件共享\n- 保护\n\n### 保护\n\n- 文件的所有者/创建者应能够控制：\n\
    \  - 谁可以执行哪些操作\n- 访问类型\n  - 读\n  - 写\n  - 执行\n  - 追加\n  - 删除\n  - 列出\n\n### 访问列表和组\n\
    \n- 访问模式：读、写、执行\n- 三类用户 RWX\n  - a) 所有者访问权 7 ⇒ 1 1 1\n  - b) 组访问权 6 ⇒ 1 1 0\n\
    \  - c) 公共访问权 1 ⇒ 0 0 1\n- 请管理员创建一个组（唯一名称），例如 G，并向该组添加一些用户。\n- 对于特定文件（例如 *game*）或子目录，定义适当的访问权限。\n\
    \n### Windows XP 访问控制列表管理\n\n10 tex 属性\n\n- 常规\n- 安全\n- 摘要\n\n组或用户名称：\n\n- Administrators\
    \ (PBG-LAPTOP\\Administrators)\n- Guest (PBG-LAPTOP\\Guest)\n- pbg (CT\\pbg)\n\
    - SYSTEM\n- Users (PBG-LAPTOP\\Users)\n\n添加...\n\n删除\n\nGuest 的权限\n\n|  | 允许 |\
    \ 拒绝 |\n|---|---|---|\n| 完全控制 |  | ☑ |\n| 修改 |  | ☑ |\n| 读取和执行 |  | ☑ |\n| 读取\
    \ |  | ☑ |\n| 写入 |  | ☑ |\n| 特殊权限 |  |  |\n\n有关特殊权限或高级设置，请单击“高级”。\n\n高级\n\n确定\n\
    \n取消\n\n应用\n\n"
