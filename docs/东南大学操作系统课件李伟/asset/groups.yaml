  mdcn: "\n\n## 基于区段的系统\n\n- 许多较新的文件系统（例如，Veritas 文件系统）使用修改后的连续分配方案。\n- 基于区段的文件系统以区段为单位分配磁盘块。\n\
    - 区段是一组连续的块。\n  - 区段用于文件分配。\n  - 一个文件由一个或多个区段组成。\n\n## 链接分配\n\n- 每个文件都是磁盘块的链表。\n\
