  - '[PAGE 10]


    # Chapter 1 Introduction'
  - '[PAGE 11]


    # Outline


    +   - What is Operating System?

    +   - OS-related Hardwares

    +   - Development of Operating System'
  - '[PAGE 12]


    # Computer System Components


    +   - **Hardware** – provides basic computing resources (CPU, memory, I/O devices,
    etc).

    +   - **Operating system** – controls and coordinates the use of the hardware
    among the various programs for the various users.

    +   - **Programs** – (compilers, database, video, games, email systems, QQ, etc)
    are used to solve user problems.

    +   - **Users** (people, machines, other computers).'
  - '[PAGE 13]


    # Abstract View of Computer System Components


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_13_0.png)'
  - '[PAGE 14]


    # User View


    +   - **PC Users**: an operating system is **a program** that provides an easy-to-use
    interface for using the hardware

    +   - **Mainframe/Minicomputer Users**: an operating system is **a program** that
    helps maximize the system resource utilization

    +   - **Workstation Users**: an operating system is **a program** designed to
    compromise between individual usability and resource utilization'
  - '[PAGE 15]


    # System View


    +   - A *Resource Allocator*: the operating system allocates and reclaims the
    system hardware resources to and from user programs

    +   - A *Control Program*: the operating system controls the execution of user
    programs to prevent errors and improper use of the computer'
  - '[PAGE 16]


    # What is an Operating System?(1/3)


    +   - There is *no* universal definition of what is an operating system.

    +   - A common definition is that the operating system is the one *kernel program*
    running at all times on the computer. All other programs are systems/application
    programs.'
  - '[PAGE 17]


    # What is an Operating System?(2/3)


    +   - An operating system is a set of programs that acts as an intermediary between
    the user of a computer and the computer hardware.

    +     - Make the computer system convenient to use.

    +     - Execute user programs and make solving user problems easier.

    +     - Manage the computer hardware.'
  - '[PAGE 18]


    # What is an Operating System?(3/3)


    +   - General View

    +     - A resource allocator, a control program, a kernel program

    +   - The Goals of Operating System

    +     - Primary Goal: efficient operation of the computer system.


    The matter of what constitutes an operating system has become increasingly important.'
  - '[PAGE 19]


    # Outline


    +   - What is Operating System?

    +   - OS-related Hardwares

    +   - Development of Operating System'
