  - '[PAGE 496]


    # Background


    +   - Program must be brought into memory and placed within a process for it to
    be run.

    +   - Main memory and registers are only storage CPU can access directly

    +     - Register access in one CPU clock (or less)

    +     - Main memory can take many cycles

    +   - Cache sits between main memory and CPU registers

    +   - Protection of memory required to ensure correct operation'
  - '[PAGE 497]


    # Base and Limit Registers


    +   - A pair of **base** and **limit** registers define the legal address space


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_497_0.png)'
  - '[PAGE 498]


    # Hardware Address Protection


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_498_0.png)


    trap to operating system monitor—addressing error'
  - '[PAGE 499]


    # Multistep Processing of a User Program


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_499_0.png)


    # Representation of Addresses


    +   - Symbolic address (Source Program)

    +   - Relocatable address (Object Program)

    +   - Absolute address'
  - '[PAGE 500]


    # Binding of Instructions and

    Data to Memory Addresses


    +   - **Compile time:** If memory location known a priori, *absolute code* can
    be generated; code must be recompiled if starting location changes.

    +   - **Load time:** Must generate *relocatable code* and binding delayed until
    load time if memory location is not known at compile time.

    +   - **Execution time:** Binding delayed until run time if the process can be
    moved during its execution from one memory segment to another. Need hardware support
    for address maps'
  - '[PAGE 501]


    # Logical vs. Physical Address Space


    +   - The concept of a *logical address space* that is bound to a separate *physical
    address space* is central to proper memory management.

    +     - *Logical address* – generated by the CPU; also referred to as *virtual
    address*.

    +     - *Physical address* – address seen by the memory unit.

    +   - Logical and physical addresses are *the same* in compile-time and load-time
    address-binding schemes

    +   - logical and physical addresses *differ* in execution-time address-binding
    scheme.'
  - '[PAGE 502]


    # # Memory-Management Unit (MMU)


    +   - Hardware device that maps virtual to physical address.

    +   - In MMU scheme, the value in the **relocation (base) register** is added
    to every address generated by a user process at the time it is sent to memory.

    +   - The user program deals with *logical* addresses; it never sees the *real
    physical* addresses.'
  - '[PAGE 503]


    <!-- no content -->'
  - '[PAGE 504]


    # Dynamic Loading


    +   - The size of a process is limited to the size of physical memory.

    +   - Routine is not loaded until it is called

    +   - To use dynamic loading, all routines must be in a relocatable format.

    +   - The main program is loaded and executes.

    +   - When a routine A calls B, A checks to see if B is loaded. If B is not loaded,
    the relocatable linking loader is called to load B and updates the address table.
    Then, control is passed to B.'
