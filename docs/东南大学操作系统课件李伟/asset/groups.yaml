- raw:
  - '[PAGE 21]


    # Computer Startup


    +   - **Bootstrap Program (引导程序)**

    +     - Loaded at power-up or reboot

    +     - Typically stored in ROM (Read-Only Memory) or EPROM (Erasable Programmable
    ROM), generally known as firmware (固件)

    +     - Initializates all aspects of system

    +     - Loads the operating system kernel into memory, which starts executing
    “init” and waits for some event to occur'
  - '[PAGE 22]


    # Interrupt


    +   - An event that requires the attention of the OS is an *interrupt*. These
    events include the completion of an I/O, a keypress, a request for service, a
    division by zero and so on.

    +   - Interrupts may be generated by hardware or software. A *trap* is a software-generated
    interrupt caused either by an error or a user request.

    +   - Modern operating systems are *interrupt driven*, meaning the OS is in action
    only if an interrupt occurs.'
  - '[PAGE 23]


    <!-- no content -->'
  - '[PAGE 24]


    # Interrupt Time Line For a Single Process Doing Output


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_24_0.png)'
  - '[PAGE 25]


    # Common Functions of Interrupts


    +   - Interrupt transfers control to the interrupt service routine generally,
    through the interrupt vector, which contains the addresses of all the service
    routines.

    +   - Interrupt architecture must save the address of the interrupted instruction.

    +   - Incoming interrupts are disabled while another interrupt is being processed
    to prevent a lost interrupt.'
  - '[PAGE 26]


    # Interrupt Handling


    +   - The operating system preserves the state of the CPU by storing registers
    and the program counter.

    +   - Determines which type of interrupt has occurred:

    +     - *polling*

    +     - *vectored* interrupt system

    +   - Separate segments of code determine what action should be taken for each
    type of interrupt'
  - '[PAGE 27]


    # Storage Structure


    +   - Computer programs must be in main memory to be executed.

    +   - **Main memory** – only large storage media that the CPU can access directly.

    +     - too small to store all needed programs and data permanently

    +     - a volatile storage device

    +   - **Secondary storage** – extension of main memory that provides large nonvolatile
    storage capacity.'
  - '[PAGE 28]


    # Storage Hierarchy


    Storage systems organized in hierarchy.


    +   - Speed

    +   - Cost

    +   - Volatility


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_28_0.png)'
  - '[PAGE 29]


    # Caching


    +   - Use of high-speed memory to hold recently-accessed data.

    +   - Requires a *cache management* policy.

    +   - *Cache Coherency* —— this requires data that is simultaneously stored in
    more than one level to be *consistent*.'
  - '[PAGE 30]


    # I/O Structure


    +   - I/O devices and the CPU can execute concurrently.

    +   - Each device controller is in charge of a particular device type and has
    a local buffer.

    +   - Device controller informs CPU that it has finished its operation by causing
    an *interrupt*.


    *This form of interrupt-driven I/O is fine for moving small amounts of data but
    can produce high overhead when used for bulk data movement such as disk I/O.*'
  - '[PAGE 31]


    # Direct Memory Access (DMA)


    +   - Device controller directly transfers blocks of data between buffer storage
    and main memory **without CPU intervention**.

    +   - Only one interrupt is generated per block, rather than the one interrupt
    per byte.

    +   - Used for high-speed I/O devices able to transmit information at close to
    memory speeds.'
