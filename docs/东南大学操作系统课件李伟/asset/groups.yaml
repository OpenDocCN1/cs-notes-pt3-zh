    \n```\n#define BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\nint counter = 0;\n```\n\n- Producer process\n\n```\n\
    item nextProduced;\nwhile (1) {\n    while (counter == BUFFER_SIZE);\n       \
    \ /* do nothing */\n    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n\
    \    counter++;\n}\n```\n\n- **Consumer process**\n\n```\nitem nextConsumed;\n\
    while (1) {\n    while (counter == 0);\n        /* do nothing */\n    nextConsumed\
    \ = buffer[out];\n    out = (out + 1) % BUFFER_SIZE;\n    counter--;\n}\n```\n"
