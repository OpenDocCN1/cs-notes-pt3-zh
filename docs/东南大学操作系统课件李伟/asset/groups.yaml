  mdcn: "\n\n## 使用 TestAndSet 满足三个条件\n\n初始 Boolean waiting[i] = false; lock=false\n\
    \n### 进入临界区\n\n```\nwaiting[i] = true;\nkey = true;\nwhile (waiting[i] && key)\n\
    \    key = TestAndSet(lock);\nwaiting[i] = false;\n```\n\n如果删除该语句，会产生什么后果？\n\n\
    ### 离开临界区\n\n```\nj = (i+1)%n;\nwhile ((j != i) && !waiting[j])\n    j = (j+1)%n;\n\
    if (j == i)\n    lock = false;\nelse\n    waiting[j] = false;\n```\n\n## 信号量\n\
    \n- 同步工具\n- 信号量 S – 整数变量\n- 只能通过两种标准的原子操作访问\n  - *wait(S): P()*\n    - `while\
    \ S ≤ 0;`\n    - `S--;`\n  - *signal(S): V()*\n    - `S++;`\n\n### 两种类型的信号量\n\n\
    - **计数信号量** – 整数值可以在无限制的域中取值。\n- **二进制信号量** – 整数值只能在 0 和 1 之间取值；也称为 **互斥锁**。\n\
    - 可以将计数信号量 *S* 实现为二进制信号量。\n\n### n 个进程的临界区\n\n- **共享数据：**\n  - semaphore mutex;\
    \ //initially *mutex* = 1\n- **进程 P_i:**\n  ```\n  do {\n      wait(mutex);\n\
    \          critical section\n      signal(mutex);\n          remainder section\n\
    \  } while (1);\n  ```\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_389_0.png)\n\
    \n### 信号量作为通用同步工具\n\n- 仅在 *P_i* 中执行 *A* 之后，才在 *P_j* 中执行 *B*\n- 使用初始化为 0 的信号量 *flag*\n\
    - 代码：\n\n```\nPᵢ                         Pⱼ\n⋮                          ⋮\nA \
    \                   wait(flag)\n\nsignal(flag)               B\n```\n\n### 信号量实现\n\
    \n- 上述经典信号量定义的缺点是需要 **忙等待**。 *(当一个进程在其临界区内时，任何试图进入其临界区的其他进程都必须在入口代码中不断循环)*\n-\
    \ 这种类型的信号量也称为 **自旋锁** 因为进程在等待锁时会自旋。\n- 为了克服忙等待的需要，进程可以 **阻塞自身** 而不是进行忙等待。\n\n\
    - 将信号量定义为记录\n\n  ```\n  typedef struct {\n    int value;\n    struct process *L;\
    \ // waiting queue\n  } semaphore;\n  ```\n\n- 假设有两个简单操作：\n  - block() 挂起调用它的进程。\n\
    \  - wakeup(P) 恢复被阻塞进程 P 的执行。\n\n### 实现\n\n信号量操作现在定义为\n\n```\nwait(S):\n    S.value--;\n\
    \    if (S.value < 0) {\n        add this process to S.L;\n        block();\n\
    \    }\n\nsignal(S):\n    S.value++;\n    if (S.value <= 0) {\n        remove\
    \ a process P from S.L;\n        wakeup(P);\n    }\n```\n\n- 如果信号量的值是负数，其绝对值就是等待该信号量的进程数。\n\
    - 信号量的关键方面是它们必须被 **原子地** 执行。 (*临界区问题*)\n- 忙等待 **并未** 完全消除。\n  - 忙等待已从应用程序的临界区入口部分移除。\n\
    \  - 此外，我们已将忙等待限制在 `wait()` 和 `signal()` 操作的临界区内。\n\n## 练习\n\n- 5个进程共享某一临界资源，则互斥信号量的取值范围是多少？\n\
    - 有4个进程共享一程序段，而每次最多允许2个进程进入该程序段，则信号量的初值是多少？\n\n## 死锁和饥饿\n\n- **死锁 – 两个或多个进程**\
    \ 无限期地等待 **一个事件**，该事件只能由等待进程中的一个引起。\n- 设 S 和 Q 为两个初始化为 1 的信号量\n\n```\nP₀     \
    \                    P₁\nwait(S);                    wait(Q);\nwait(Q);      \
    \              wait(S);\n⋮                           ⋮\nsignal(S);           \
    \       signal(Q);\nsignal(Q);                  signal(S);\n```\n\n- **饥饿** –\
    \ 无限期阻塞。 **一个进程** 可能永远不会从其被挂起的信号量队列中移除。\n\n"
