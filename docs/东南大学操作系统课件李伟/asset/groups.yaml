    \n把分散在各进程中的临界区集中起来管理\n\n## 管程\n\n- **高级同步构造**，允许并发进程之间安全共享抽象数据类型。\n\n```\nmonitor\
    \ monitor-name\n{\n  shared variable declarations\n  procedure body P1(...) {\n\
    \    ...\n  }\n  procedure body P2(...) {\n    ...\n  }\n  procedure body Pn(...)\
    \ {\n    ...\n  }\n  { initialization code}\n}\n```\n\n### 管程：互斥\n\n- *最多一个进程*可以在管程*内部*执行。因此，管程内保证了*互斥*。\n\
