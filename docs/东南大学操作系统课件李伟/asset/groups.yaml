  - '[PAGE 719]


    # Grouping


    +   - The first free block contains the addresses of *n* other free blocks.


    +   - For each group, the first *n-1* blocks are actually free and the last (i.e.,
    *n-th*) block contains the addresses of the next group.


    +   - In this way, we can quickly locate free blocks.


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_719_0.png)'
