  mdcn: "\n\n## 抖动\n\n- 如果进程没有“足够”的页，缺页率会非常高。\n  - CPU 利用率低。\n  - 操作系统认为需要提高多道程序度。\n\
    \  - 于是向系统中添加另一个进程。\n- **抖动** — 进程忙于在页与页之间换入换出。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_617_0.png)\n\
    \n- 为什么分页有效？\n  - 局部性模型\n    - 局部性是一组被一起活跃使用的页面。\n    - 进程从一个局部性迁移到另一个局部性。\n \
    \   - 局部性可能重叠。\n- 为什么抖动会发生？\n  - 局部性大小 > 分配的内存大小\n\n### 工作集模型\n\n- Δ ≡ 工作集窗口 ≡\
    \ 固定数量的页引用\n- 示例：10,000 条指令\n- WSSᵢ（进程 Pᵢ 的工作集）= 最近 Δ 次引用中引用的页面总数（随时间变化）\n- 如果\
    \ Δ 太小，则无法涵盖整个局部性。\n- 如果 Δ 太大，则会涵盖多个局部性。\n- 如果 Δ = ∞ ⇒ 将涵盖整个程序。\n- 工作集是程序局部性的一种近似。\n\
    - $D = \\sum WSS_i \\equiv$ 总需求帧数\n- 如果 $D > m \\Rightarrow$ 抖动 $\\Rightarrow$\
    \ 挂起其中一个进程\n\n页引用表\n\n... 2 6 1 5 7 7 7 7 5 1 6 2 3 4 1 2 3 4 4 4 3 4 3 4 4 4\
    \ 1 3 2 3 4 4 4 3 4 4 ...\n\nWS(t₁) = {1,2,5,6,7}\n\nWS(t₂) = {3,4}\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_621_0.png)\n\
    \n### 缺页频率\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_622_0.png)\n\n- 建立“可接受的”缺页率。\n\
    \  - 如果实际缺页率过低，进程将失去帧。\n  - 如果实际缺页率过高，进程将获得帧。\n\n## 大纲\n\n- 背景\n- 按需分页\n- 页面置换\n\
    - 帧的分配\n- 抖动\n- 内存映射文件\n- 分配内核内存\n- 其他考虑因素\n- 操作系统示例\n\n## 内存映射文件\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_625_0.png)\n\
    \n### Windows 中的内存映射共享内存\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_626_0.png)\n\
    \n进程₁  \n共享内存  \n内存映射文件  \n共享内存  \n进程₂  \n共享内存\n\n## 大纲\n\n- 背景\n- 按需分页\n- 页面置换\n\
    - 帧的分配\n- 抖动\n- 内存映射文件\n- 分配内核内存\n- 其他考虑因素\n- 操作系统示例\n\n## 分配内核内存\n\n- 与用户内存的处理方式不同\n\
    - 通常从空闲内存池中分配\n  - 内核为不同大小的结构请求内存\n  - 某些内核内存需要连续\n\n### 伙伴系统\n\n- 从由物理上连续的页面组成的固定大小段中分配内存\n\
    - 使用 2 的幂次分配器分配内存\n  - 以 2 的幂次大小的单位满足请求\n  - 请求向上取整到下一个最高的 2 的幂次\n  - 当需要的分配比可用的更小时，当前块被拆分为两个下一级\
    \ 2 的幂次的伙伴块\n    - 继续拆分，直到获得合适大小的块\n\n### 伙伴系统分配器\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_630_0.png)\n\
    \n### 板坯分配器\n\n- 创建缓存时，用标记为空闲的对象填充\n- 存储结构时，对象被标记为已使用\n- 如果板坯充满已使用的对象，则从空板坯中分配下一个对象\n\
    \  - 如果没有空板坯，则分配新的板坯\n- 优点包括无碎片、快速满足内存请求\n\n### 板坯分配\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_633_0.png)\n\
    \n"
