  md: "\n## Layered Structure\n\n- The operating system is divided into a number of\
    \ layers (levels), each built on top of lower layers. The bottom layer (layer\
    \ 0) is the hardware; the highest (layer N) is the user interface.\n- With modularity,\
    \ layers are selected such that each uses functions (operations) and services\
    \ of only lower-level layers\n\n## Layered Operating System\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_111_0.png)\n\
    \n## OS/2 Layer Structure\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_112_0.png)\n\
    \n### Microkernel Structure\n\n- Moves as much from the kernel into *“user” space*\n\
    - Typically, microkernels provide **minimal process management, memory management**\
    \ and **communication facility**\n- Communication takes place between user modules\
    \ using message passing\n\n- **Benefits**\n  - Easier to extend an operating system\n\
    \  - Easier to port the operating system to new architectures\n  - More reliable\
    \ (less code is running in kernel mode)\n  - More secure\n- **Lacks**\n  - Performance\
    \ overhead of user space to kernel space communication\n\n## Modules\n\n- Most\
    \ modern operating systems implement kernel modules\n  - Uses object-oriented\
    \ approach\n  - Each core component is separate\n  - Each talks to the others\
    \ over known interfaces\n  - Each is loadable as needed within the kernel\n- Overall,\
    \ similar to layers but with more flexible\n\n## Solaris Modular Approach\n\n\
    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_116_0.png)\n\n## 作业1\n\n设计操作系统时采用的模块化内核方法和分层方法在哪些方面类似？\n\
    哪些方面不同？\n\n## Virtual Machines\n\n- A *virtual machine* takes the layered approach\
    \ to its logical conclusion. It treats hardware and the operating system kernel\
    \ as though they were all hardware\n- A virtual machine provides an *interface\
    \ identical* to the underlying bare hardware\n- The operating system creates the\
    \ “*illusion*” of multiple processes, each executing on its own processor with\
    \ its own (virtual) memory\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_119_0.png)\n\
    \n- The resources of the physical computer are shared to create the virtual machines\n\
    - CPU scheduling can create the appearance that users have their own processor\n\
    - Spooling and a file system can provide virtual card readers and virtual line\
    \ printers\n- A normal user time-sharing terminal serves as the virtual machine\
    \ operator’s console\n\n- **Advantages**\n  - **Providing complete protection\
    \ of system resources**\n    - Each virtual machine is isolated from all other\
    \ virtual machines. This isolation, however, permits no direct sharing of resources.\n\
    \  - **Being able to share the same hardware yet run different operating systems\
    \ concurrently**\n  - **A perfect vehicle for operating-systems research and development**\n\
    \    - System development is done on the virtual machine, so does not disrupt\
    \ normal system operation.\n\n### VMware Architecture\n\n| application | application\
    \ | application | application |\n|---|---|---|---|\n|  | guest operating system\
    \ (FreeBSD)<br>virtual CPU<br>virtual memory<br>virtual devices | guest operating\
    \ system (Windows NT)<br>virtual CPU<br>virtual memory<br>virtual devices | guest\
    \ operating system (Windows XP)<br>virtual CPU<br>virtual memory<br>virtual devices\
    \ |\n|  | virtualization layer | virtualization layer | virtualization layer |\n\
    |  | host operating system (Linux) | host operating system (Linux) | host operating\
    \ system (Linux) |\n|  | hardware<br>CPU<br>memory<br>I/O devices | hardware<br>CPU<br>memory<br>I/O\
    \ devices | hardware<br>CPU<br>memory<br>I/O devices |\n\n### Java Virtual Machine\n\
    \n- Compiled Java programs are platform-neutral **bytecodes** executed by a Java\
    \ Virtual Machine (JVM).\n\n- JVM consists of\n  - class loader\n  - class verifier\n\
    \  - runtime interpreter\n\n- **Just-In-Time (JIT)** compilers increase performance\n"
  mdcn: "\n\n## 分层结构\n\n- 操作系统被划分为若干层（级别），每一层都建立在较低层之上。最底层（第 0 层）是硬件；最高层（第 N 层）是用户界面。\n\
    - 借助模块化，各层被选择为每一层仅使用较低层的功能（操作）和服务\n\n## 分层操作系统\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_111_0.png)\n\
    \n## OS/2 层结构\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_112_0.png)\n\n### 微内核结构\n\
    \n- 将尽可能多的内容从内核移至 *“用户”* 空间\n- 通常，微内核提供 **最小的进程管理、内存管理** 和 **通信设施**\n- 通信通过消息传递在用户模块之间进行\n\
    \n- **优点**\n  - 更容易扩展操作系统\n  - 更容易将操作系统移植到新架构\n  - 更可靠（内核模式下运行的代码更少）\n  - 更安全\n\
    - **缺点**\n  - 用户空间到内核空间通信的性能开销\n\n## 模块\n\n- 大多数现代操作系统实现内核模块\n  - 采用面向对象的方法\n\
    \  - 每个核心组件都是独立的\n  - 每个组件通过已知接口相互通信\n  - 每个组件可根据需要在内核中按需加载\n- 总体而言，与分层类似，但更灵活\n\
    \n## Solaris 模块化方法\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_116_0.png)\n\n\
    ## 作业1\n\n设计操作系统时采用的模块化内核方法和分层方法在哪些方面类似？\n哪些方面不同？\n\n## 虚拟机\n\n- *虚拟机* 将分层方法推向了逻辑的极致。它将硬件和操作系统内核视为纯粹的硬件\n\
    - 虚拟机提供与底层裸硬件 *完全相同* 的接口\n- 操作系统创建“*幻觉*”，即多个进程各自在自己的处理器上执行，并拥有自己的（虚拟）内存\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_119_0.png)\n\
    \n- 物理计算机的资源被共享以创建虚拟机\n- CPU 调度可以制造出用户拥有自己的处理器的假象\n-  spooling 和文件系统可以提供虚拟卡片阅读器和虚拟行式打印机\n\
    - 普通用户分时终端充当虚拟机操作员的控制台\n\n- **优点**\n  - **提供系统资源的完全保护**\n    - 每个虚拟机都与其他所有虚拟机隔离。这种隔离\
    \ however 不允许直接共享资源。\n  - **能够共享同一硬件同时并发运行不同的操作系统**\n  - **是操作系统研究和开发的完美载体**\n\
    \    - 系统开发在虚拟机上进行，因此不会干扰正常系统操作。\n\n### VMware 架构\n\n| application | application\
    \ | application | application |\n|---|---|---|\n|  | guest operating system (FreeBSD)<br>virtual\
    \ CPU<br>virtual memory<br>virtual devices | guest operating system (Windows NT)<br>virtual\
    \ CPU<br>virtual memory<br>virtual devices | guest operating system (Windows XP)<br>virtual\
    \ CPU<br>virtual memory<br>virtual devices |\n|  | virtualization layer | virtualization\
    \ layer | virtualization layer |\n|  | host operating system (Linux) | host operating\
    \ system (Linux) | host operating system (Linux) |\n|  | hardware<br>CPU<br>memory<br>I/O\
    \ devices | hardware<br>CPU<br>memory<br>I/O devices | hardware<br>CPU<br>memory<br>I/O\
    \ devices |\n\n### Java 虚拟机\n\n- 编译后的 Java 程序是平台中立的 **字节码**，由 Java 虚拟机（JVM）执行。\n\
    \n- JVM 由以下部分组成\n  - class loader\n  - class verifier\n  - runtime interpreter\n\
    \n- **即时编译（JIT）** 编译器可提高性能\n\n"
