  - '[PAGE 357]


    # Bounded-Buffer


    +   - **The statements**

    +     - `counter++;`

    +     - `counter--;`

    +     - must be performed *atomically*.


    +   - Atomic operation means an operation that completes in its entirety without
    interruption.'
  - '[PAGE 358]


    # # Bounded-Buffer


    +   - The statement “**count++**” may be implemented in machine language as:

    +     - **register₁ = counter**

    +     - **register₁ = register₁ + 1**

    +     - **counter = register₁**

    +   - The statement “**count--**” may be implemented as:

    +     - **register₂ = counter**

    +     - **register₂ = register₂ − 1**

    +     - **counter = register₂**'
  - '[PAGE 359]


    # # Bounded-Buffer


    +   - If **both the producer and consumer attempt to update the buffer concurrently**,
    the assembly language statements may get interleaved.

    +   - Interleaving depends upon how the producer and consumer processes are scheduled.'
  - '[PAGE 360]


