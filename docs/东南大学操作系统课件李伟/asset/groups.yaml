  md: "\n## Safe, Unsafe , Deadlock State\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_462_0.png)\n\
    \n## Avoidance algorithms\n\n- Single instance of a resource type\n  - Use a resource-allocation-graph\
    \ algorithm\n- Multiple instances of a resource type\n  - Use the banker’s algorithm\n\
    \n## Resource-Allocation-Graph Algorithm\n\n- *Claim edge* $P_i \\rightarrow R_j$\
    \ indicated that process $P_i$ may request resource $R_j$; represented by a dashed\
    \ line.\n- **Claim edge converts to request edge** when a process requests a resource.\n\
    - When a resource is released by a process, **assignment edge reconverts to a\
    \ claim edge.**\n- Resources must be claimed a priori in the system.\n\n## Resource-Allocation\
    \ Graph\nFor Deadlock Avoidance\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_465_0.png)\n\
    \n## Unsafe State In Resource-Allocation Graph\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_466_0.png)\n\
    \n## Banker’s Algorithm\n\n- Multiple instances.\n- Each process must a priori\
    \ claim maximum use.\n- When a process requests a resource it may have to wait.\n\
    - When a process gets all its resources it must return them in a finite amount\
    \ of time.\n\n## Data Structures for the Banker’s Algorithm\n\nLet n = number\
    \ of processes, and m = number of resources types.\n\n- **Available**: Vector\
    \ of length m. If available [j] = k, there are k instances of resource type Rj\
    \ available.\n- **Max**: n x m matrix. If Max [i,j] = k, then process Pi may request\
    \ at most k instances of resource type Rj.\n- **Allocation**: n x m matrix. If\
    \ Allocation[i,j] = k then Pi is currently allocated k instances of Rj.\n- **Need**:\
    \ n x m matrix. If Need[i,j] = k, then Pi may need k more instances of Rj to complete\
    \ its task.\n\n## Safety Algorithm\n\n1. Let *Work* and *Finish* be vectors of\
    \ length *m* and *n*, respectively. Initialize:\n   \n   *Work* = Available; \
    \ *Finish* [i] = false for i = 0, 1, ..., n.\n\n2. Find an *i* such that both:\n\
    \   \n   (a) *Finish* [i] = *false*\n   \n   (b) *Needᵢ* ≤ *Work*\n   \n   If\
    \ no such *i* exists, go to step 4.\n\n3. *Work* = *Work* + *Allocationᵢ*\n  \
    \ \n   *Finish* [i] = *true*\n   \n   go to step 2.\n\n4. If *Finish* [i] == true\
    \ for all *i*, then **the system is in a safe state.**\n\n## Resource-Request\
    \ Algorithm for Process Pi\n\nLet *Request*ᵢ be the request vector for process\
    \ *P*ᵢ. If *Request*ᵢ[*j*] = *k* then process *P*ᵢ wants *k* instances of resource\
    \ type *R*ⱼ.\n\n1. If *Request*ᵢ ≤ *Need*ᵢ go to step 2. Otherwise, raise error\
    \ condition, since process has exceeded its maximum claim.\n2. If *Request*ᵢ ≤\
    \ *Available*, go to step 3. Otherwise *P*ᵢ must wait, since resources are not\
    \ available.\n\n## Resource-Request Algorithm for Process $P_i$\n\n3. Pretend\
    \ to allocate requested resources to $P_i$ by modifying the state as follows:\n\
    \n$$Available = Available - Request_i;$$\n\n$$Allocation_i = Allocation_i + Request_i;$$\n\
    \n$$Need_i = Need_i - Request_i;$$\n\n- **If safe** ⇒ the resources are allocated\
    \ to $P_i$.\n- **If unsafe** ⇒ $P_i$ must wait, and the old resource-allocation\
    \ state is restored.\n\n## Example of Banker’s Algorithm\n\n- 5 processes $P_0$\
    \ through $P_4$; 3 resource types $A$ (10 instances), $B$ (5 instances), and $C$\
    \ (7 instances).\n- Snapshot at time $T_0$:\n\n| Allocation | Max | Available\
    \ |\n|---|---|---|\n| A B C | A B C | A B C |\n| $P_0$ 0 1 0 | 7 5 3 | 3 3 2 |\n\
    | $P_1$ 2 0 0 | 3 2 2 |  |\n| $P_2$ 3 0 2 | 9 0 2 |  |\n| $P_3$ 2 1 1 | 2 2 2\
    \ |  |\n| $P_4$ 0 0 2 | 4 3 3 |  |\n\n## Example of Banker’s Algorithm\n\nThe\
    \ content of the matrix. Need is defined to be Max − Allocation.\n\n**Need**\n\
    \n|  | A | B | C |\n|---|---:|---:|---:|\n| P₀ | 7 | 4 | 3 |\n| P₁ | 1 | 2 | 2\
    \ |\n| P₂ | 6 | 0 | 0 |\n| P₃ | 0 | 1 | 1 |\n| P₄ | 4 | 3 | 1 |\n\nThe system\
    \ is in a safe state since the sequence < P₁, P₃, P₄, P₂, P₀ > satisfies safety\
    \ criteria.\n\n## Example P1 Request (1,0,2)\n\n▪ Check that Request ≤ Available\
    \ (that is, (1,0,2) ≤ (3,3,2) ⇒ **true**.)\n\n|  | **Allocation** | **Need** |\
    \ **Available** |\n|---|---|---|---|\n|  | A B C | A B C | A B C |\n| $P_0$ |\
    \ 0 1 0 | 7 4 3 | 2 3 0 |\n| $P_1$ | 3 0 2 | 0 2 0 |  |\n| $P_2$ | 3 0 1 | 6 0\
    \ 0 |  |\n| $P_3$ | 2 1 1 | 0 1 1 |  |\n| $P_4$ | 0 0 2 | 4 3 1 |  |\n"
  mdcn: "\n\n## 安全状态、不安全状态、死锁状态\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_462_0.png)\n\
    \n## 避免算法\n\n- 单个资源类型的单个实例\n  - 使用资源分配图算法\n- 多个资源类型的多个实例\n  - 使用银行家算法\n\n## 资源分配图算法\n\
    \n- *声明边* $P_i \\rightarrow R_j$ 表示进程 $P_i$ 可能请求资源 $R_j$；用虚线表示。\n- **声明边转换为请求边**\
    \ 当进程请求资源时。\n- 当进程释放资源时，**分配边重新转换为声明边。**\n- 资源必须在系统中预先声明。\n\n## 资源分配图\n用于死锁避免\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_465_0.png)\n\n## 资源分配图中的不安全状态\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_466_0.png)\n\
    \n## 银行家算法\n\n- 多个实例。\n- 每个进程必须预先声明最大使用量。\n- 当进程请求资源时可能需要等待。\n- 当进程获得所有资源后必须在有限时间内归还它们。\n\
    \n## 银行家算法的数据结构\n\n设 n = 进程数，m = 资源类型数。\n\n- **Available**: 长度为 m 的向量。若 available\
    \ [j] = k，则资源类型 Rj 可用 k 个实例。\n- **Max**: n x m 矩阵。若 Max [i,j] = k，则进程 Pi 最多可请求资源类型\
    \ Rj 的 k 个实例。\n- **Allocation**: n x m 矩阵。若 Allocation[i,j] = k 则 Pi 当前被分配了 Rj\
    \ 的 k 个实例。\n- **Need**: n x m 矩阵。若 Need[i,j] = k，则 Pi 为完成任务可能还需要 Rj 的 k 个实例。\n\
    \n## 安全算法\n\n1. 设 *Work* 和 *Finish* 分别为长度为 *m* 和 *n* 的向量。初始化：\n   \n   *Work*\
    \ = Available;  *Finish* [i] = false 对于 i = 0, 1, ..., n。\n\n2. 找到一个 *i* 满足以下条件：\n\
    \   \n   (a) *Finish* [i] = *false*\n   \n   (b) *Needᵢ* ≤ *Work*\n   \n   如果不存在这样的\
    \ *i*，则转到步骤 4。\n\n3. *Work* = *Work* + *Allocationᵢ*\n   \n   *Finish* [i] = *true*\n\
    \   \n   转到步骤 2。\n\n4. 如果 *Finish* [i] == true 对于所有 *i*，则 **系统处于安全状态。**\n\n##\
    \ 进程 Pi 的资源请求算法\n\n设 *Request*ᵢ 为进程 *P*ᵢ 的请求向量。若 *Request*ᵢ[*j*] = *k* 则进程 *P*ᵢ\
    \ 想要资源类型 *R*ⱼ 的 *k* 个实例。\n\n1. 如果 *Request*ᵢ ≤ *Need*ᵢ 则转到步骤 2。否则，引发错误条件，因为进程已超出其最大声明。\n\
    2. 如果 *Request*ᵢ ≤ *Available*，则转到步骤 3。否则 *P*ᵢ 必须等待，因为资源不可用。\n\n## 进程 $P_i$ 的资源请求算法\n\
    \n3. 假装将请求的资源分配给 $P_i$，修改状态如下：\n\n$$Available = Available - Request_i;$$\n\n$$Allocation_i\
    \ = Allocation_i + Request_i;$$\n\n$$Need_i = Need_i - Request_i;$$\n\n- **If\
    \ safe** ⇒ 资源被分配给 $P_i$。\n- **If unsafe** ⇒ $P_i$ 必须等待，并且旧的资源分配状态将被恢复。\n\n## 银行家算法示例\n\
    \n- 5 个进程 $P_0$ 到 $P_4$；3 种资源类型 $A$（10 个实例）、$B$（5 个实例）和 $C$（7 个实例）。\n- 时间 $T_0$\
    \ 的快照：\n\n| Allocation | Max | Available |\n|---|---|---|\n| A B C | A B C | A\
    \ B C |\n| $P_0$ 0 1 0 | 7 5 3 | 3 3 2 |\n| $P_1$ 2 0 0 | 3 2 2 |  |\n| $P_2$\
    \ 3 0 2 | 9 0 2 |  |\n| $P_3$ 2 1 1 | 2 2 2 |  |\n| $P_4$ 0 0 2 | 4 3 3 |  |\n\
    \n## 银行家算法示例\n\n矩阵的内容。Need 定义为 Max − Allocation。\n\n**Need**\n\n|  | A | B | C\
    \ |\n|---|---:|---:|---:|\n| P₀ | 7 | 4 | 3 |\n| P₁ | 1 | 2 | 2 |\n| P₂ | 6 |\
    \ 0 | 0 |\n| P₃ | 0 | 1 | 1 |\n| P₄ | 4 | 3 | 1 |\n\n系统处于安全状态，因为序列 < P₁, P₃, P₄,\
    \ P₂, P₀ > 满足安全条件。\n\n## 示例 P1 请求 (1,0,2)\n\n▪ 检查 Request ≤ Available（即 (1,0,2)\
    \ ≤ (3,3,2) ⇒ **true**。）\n\n|  | **Allocation** | **Need** | **Available** |\n\
    |---|---|---|---|\n|  | A B C | A B C | A B C |\n| $P_0$ | 0 1 0 | 7 4 3 | 2 3\
    \ 0 |\n| $P_1$ | 3 0 2 | 0 2 0 |  |\n| $P_2$ | 3 0 1 | 6 0 0 |  |\n| $P_3$ | 2\
    \ 1 1 | 0 1 1 |  |\n| $P_4$ | 0 0 2 | 4 3 1 |  |\n\n"
