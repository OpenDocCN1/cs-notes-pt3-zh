  mdcn: "\n\n## 二级存储管理\n\n- **磁盘管理活动**\n  - 空闲空间管理\n  - 存储分配\n  - 磁盘调度\n\n## I/O 系统管理\n\
    \n- 隐藏特定硬件设备的特殊性以免用户感知\n- I/O 子系统包括\n  - 包含缓冲、缓存、 spooling 的内存管理组件\n  - 通用的设备驱动程序接口\n\
    \  - 特定硬件设备的驱动程序\n\n## 大纲\n\n- 操作系统功能\n- 操作系统服务\n- 操作系统接口\n- 操作系统结构\n- 操作系统设计与实现\n\
    \n## 操作系统服务(1/2)\n\n### 为用户提供帮助的服务\n\n- **程序执行** – 系统能够将程序加载到内存并运行的能力。\n- **I/O\
    \ 操作** – 由于用户程序不能直接执行 I/O 操作，操作系统必须提供某种手段来执行 I/O。\n- **文件系统操作** – 程序能够读取、写入、创建和删除文件。\n\
    - **通信** – 进程之间交换信息（*共享内存* 或 *消息传递*）\n- **错误检测** – 通过检测硬件或用户程序中的错误来确保正确计算。\n\n\
    ## 操作系统服务(2/2)\n\n- **确保系统运行的服务**\n  - **资源分配** – 将资源分配给多个用户或同时运行的多个作业。\n  - **记账**\
    \ – 跟踪哪些用户使用了多少以及何种类型的计算机资源。\n  - **保护** – 确保对系统资源的所有访问都受控制并记录所有连接以便检测入侵。\n\n\
    ## 大纲\n\n- 操作系统功能\n- 操作系统服务\n- **操作系统接口**\n- 操作系统结构\n- 操作系统设计与实现\n\n## 操作系统接口(1/3)\n\
    \n- **用户接口**\n  - **命令行接口** – 文本命令\n  - **批处理接口** – 包含一些命令的文件\n  - **图形用户界面**\
    \ – 窗口系统\n    - 基于鼠标的窗口和菜单\n  - 许多系统现在同时包含 CLI 和 GUI 接口\n    - **Microsoft Windows**\
    \ 是带 CLI “command” shell 的 GUI\n    - **Apple Mac OS X** 作为 “Aqua” GUI 接口，底层为\
    \ UNIX 内核并提供 shell\n    - **Linux** 是 CLI，可选 GUI 接口（Java Desktop、KDE）\n\n## 操作系统接口(2/3)\n\
    \n- 命令行解释器（Shell）\n  - 读取并解释控制语句的程序\n  - DOS OS：command.com\n- 实现命令的两种方式\n  -\
    \ 内部命令：命令解释器本身包含执行命令的代码。（dir, copy）\n  - 外部命令：系统程序实现大多数命令。（fdisk, format）\n\n\
    ## 操作系统接口(3/3)\n\n- 程序接口\n  - 系统调用\n    - 通常用汇编语言指令或高级语言（C 或 C++）编写\n    - 大多数情况下程序通过高级应用程序编程接口（API）访问，而不是直接使用系统调用\n\
    \n## 系统调用示例\n\n将一个文件的内容复制到另一个文件的系统调用序列\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_90_0.png)\n\
    \n- 示例系统调用序列\n- 获取输入文件名\n- 向屏幕写入提示\n- 接受输入\n- 获取输出文件名\n- 向屏幕写入提示\n- 接受输入\n- 打开输入文件\n\
    - 如果文件不存在，则中止\n- 创建输出文件\n- 如果文件存在，则中止\n- 循环\n- 从输入文件读取\n- 写入输出文件\n- 直到读取失败\n-\
    \ 关闭输出文件\n- 向屏幕写入完成消息\n- 正常终止\n\n## 系统调用实现\n\n- **系统调用接口 (SCI)**\n  - 通常，每个系统调用关联一个编号\n\
    \  - 系统调用接口维护一个按这些编号索引的表\n  - 系统调用接口在 OS 内核中调用预期的系统调用并返回系统调用的状态和任何返回值\n\n"
