  mdcn: "\n\n## 错误处理\n- 一个磁盘磁道上有坏扇区\n- 用备用扇区替换坏扇区\n- 移动所有扇区以绕过坏扇区\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_771_0.png)\n\
