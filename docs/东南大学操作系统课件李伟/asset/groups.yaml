  mdcn: "\n\n## 进程终止\n\n- 父进程可以终止子进程的执行（abort）。\n    - 子进程已超出分配的资源。\n    - 分配给子进程的任务不再需要。\n\
    \    - 父进程正在退出。（并非所有OS都如此， UNIX）\n        - 操作系统不允许子进程在其父进程终止后继续运行。\n        -\
    \ 级联终止 (级联终止).\n\n## 大纲\n\n- 进程概念\n- 进程调度\n- 进程操作\n- **进程间通信**\n- 客户端-服务器系统中的通信\n\
    \n## 进程间通信 (IPC)\n\n- 通信可以使用 **消息传递** 或 **共享内存** 进行。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_171_0.png)\n\
    \n## 共享内存系统\n\n- 要求通信进程建立一个共享内存区域。\n- 共享内存区域驻留在创建共享内存段的进程的地址空间中。\n- 进程有责任确保它们不会同时写入同一位置。\n\
    \n## 生产者-消费者问题\n\n- 协作进程的范式，**_生产者_** 进程产生的信息被 **_消费者_** 进程消费。\n    - **_无界缓冲区_**\
    \ 对缓冲区的大小没有实际限制。\n    - **_有界缓冲区_** 假设缓冲区大小是固定的。\n\n## 有界缓冲区 – 共享内存解决方案\n\n- 共享数据\n\
    \n```c\n#define BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\n```\n\n## 有界缓冲区 – 生产者进程\n\n```\nitem nextProduced;\n\
    \nwhile (1) {\n    while (((in + 1) % BUFFER_SIZE) == out)\n        ; /* do nothing\
    \ */\n    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n}\n```\n\
    \n## 有界缓冲区 – 消费者进程\n\n```\nitem nextConsumed;\n\nwhile (1) {\n    while (in ==\
    \ out)\n        ;/* do nothing */\n    nextConsumed = buffer[out];\n    out =\
    \ (out + 1) % BUFFER_SIZE;\n}\n```\n\n## 讨论\n\n- 该解决方案是正确的，但只能使用 BUFFER_SIZE-1\
    \ 个元素\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_177_0.png)\n\n- 如何实现可使用缓冲的最大空间数为\
    \ BUFFER_SIZE？\n\n## 消息传递系统\n\n- **MPS 设施提供两个操作：**\n    - *send(message)* – 消息大小固定或可变\n\
    \    - *receive(message)*\n\n- **如果 P 和 Q 希望通信，它们需要：**\n    - 在它们之间建立一个 *通信链路*\n\
    \    - 通过 send/receive 交换消息\n\n- **通信链路的实现**\n    - 物理的（例如，共享内存，硬件总线）\n    - 逻辑的（例如，逻辑属性）\n\
    \n## 实现问题\n\n- 链路是如何建立的？\n- 一个链路能否关联到两个以上的进程？\n- 通信进程的每对之间可以有多少条链路？\n- 链路的容量是多少？\n\
    - 链路可以容纳的消息大小是固定的还是可变的？\n- 链路是单向的还是双向的？\n\n## 间接通信\n\n- **操作**\n    - 创建一个新的邮箱\n\
    \    - 通过邮箱发送和接收消息\n    - 销毁一个邮箱\n- **原语定义为：**\n    - send(*A, message*) – 向邮箱\
    \ A 发送消息\n    - receive(*A, message*) – 从邮箱 A 接收消息\n\n## 间接通信\n\n- **邮箱共享**\n\
    \    - *P₁, P₂, 和 P₃* 共享邮箱 A。\n    - *P₁* 发送；*P₂* 和 *P₃* 接收。\n    - 谁获得消息？\n\n\
    - **解决方案**\n    - 允许一个链路最多关联两个进程。\n    - 允许一次只有一个进程执行接收操作。\n    - 允许系统任意选择接收者。发送者会被通知接收者是谁。\n\
    \n## 同步\n\n- 消息传递可以是阻塞的或非阻塞的。\n- **阻塞** 被认为是同步的\n- **非阻塞** 被认为是异步的\n- send 和 receive\
    \ 原语可以是阻塞的或非阻塞的。\n\n"
