  md: "\n## Computer Startup\n\n- **Bootstrap Program (引导程序)**\n  - Loaded at power-up\
    \ or reboot\n  - Typically stored in ROM (Read-Only Memory) or EPROM (Erasable\
    \ Programmable ROM), generally known as firmware (固件)\n  - Initializes all aspects\
    \ of system\n  - Loads the operating system kernel into memory, which starts executing\
    \ “init” and waits for some event to occur\n\n## Interrupt\n\n- An event that\
    \ requires the attention of the OS is an *interrupt*. These events include the\
    \ completion of an I/O, a keypress, a request for service, a division by zero\
    \ and so on.\n- Interrupts may be generated by hardware or software. A *trap*\
    \ is a software-generated interrupt caused either by an error or a user request.\n\
    - Modern operating systems are *interrupt driven*, meaning the OS is in action\
    \ only if an interrupt occurs.\n\n## Interrupt Time Line For a Single Process\
    \ Doing Output\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_24_0.png)\n\n## Common\
    \ Functions of Interrupts\n\n- Interrupt transfers control to the interrupt service\
    \ routine generally, through the interrupt vector, which contains the addresses\
    \ of all the service routines.\n- Interrupt architecture must save the address\
    \ of the interrupted instruction.\n- Incoming interrupts are disabled while another\
    \ interrupt is being processed to prevent a lost interrupt.\n\n## Interrupt Handling\n\
    \n- The operating system preserves the state of the CPU by storing registers and\
    \ the program counter.\n- Determines which type of interrupt has occurred:\n \
    \ - *polling*\n  - *vectored* interrupt system\n- Separate segments of code determine\
    \ what action should be taken for each type of interrupt\n\n## Storage Structure\n\
    \n- Computer programs must be in main memory to be executed.\n- **Main memory**\
    \ – only large storage media that the CPU can access directly.\n  - too small\
    \ to store all needed programs and data permanently\n  - a volatile storage device\n\
    - **Secondary storage** – extension of main memory that provides large nonvolatile\
    \ storage capacity.\n\n## Storage Hierarchy\n\nStorage systems organized in hierarchy.\n\
    \n- Speed\n- Cost\n- Volatility\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_28_0.png)\n\
    \n## Caching\n\n- Use of high-speed memory to hold recently-accessed data.\n-\
    \ Requires a *cache management* policy.\n- *Cache Coherency* —— this requires\
    \ data that is simultaneously stored in more than one level to be *consistent*.\n\
    \n## I/O Structure\n\n- I/O devices and the CPU can execute concurrently.\n- Each\
    \ device controller is in charge of a particular device type and has a local buffer.\n\
    - Device controller informs CPU that it has finished its operation by causing\
    \ an *interrupt*.\n\n*This form of interrupt-driven I/O is fine for moving small\
    \ amounts of data but can produce high overhead when used for bulk data movement\
    \ such as disk I/O.*\n\n## Direct Memory Access (DMA)\n\n- Device controller directly\
    \ transfers blocks of data between buffer storage and main memory **without CPU\
    \ intervention**.\n- Only one interrupt is generated per block, rather than the\
    \ one interrupt per byte.\n- Used for high-speed I/O devices able to transmit\
    \ information at close to memory speeds.\n\n## Direct Memory Access (DMA)\n\n\
    The CPU gives the controller (1) disk address, (2) memory address for storing\
    \ the block, and (3) a byte count. Then, the CPU goes back to work.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_32_0.png)\n\
    \n## Hardware Protection\n\n- Dual-Mode Operation\n- CPU Protection\n- Memory\
    \ Protection\n- I/O Protection\n\n## Dual-Mode Operation\n\n- Sharing system resources\
    \ requires operating system to ensure that an incorrect program cannot cause other\
    \ programs to execute incorrectly.\n- Provide hardware support to differentiate\
    \ between at least two modes of operations.\n  - *User mode* – execution done\
    \ on behalf of a user.(用户态或目态)\n  - *Monitor mode* (also *kernel mode* or *system\
    \ mode*) – execution done on behalf of operating system. (核心态或管态)\n"
  mdcn: "\n\n## 计算机启动\n\n- **引导程序（Bootstrap Program）**\n  - 在加电或重启时加载\n  - 通常存储在 ROM（只读存储器）或\
    \ EPROM（可擦除可编程 ROM）中，通常称为固件（firmware）\n  - 初始化系统的所有方面\n  - 将操作系统内核加载到内存中，内核开始执行“init”并等待某些事件发生\n\
    \n## 中断\n\n- 需要操作系统关注的事件是*中断*。这些事件包括 I/O 完成、按键、服务请求、除以零等。\n- 中断可由硬件或软件生成。*陷阱*是由错误或用户请求引起的软件生成中断。\n\
    - 现代操作系统是*中断驱动*的，这意味着操作系统只有在发生中断时才会起作用。\n\n## 单个进程执行输出时的中断时间线\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_24_0.png)\n\
    \n## 中断的常见功能\n\n- 中断通常通过中断向量将控制转移到中断服务例程，中断向量包含所有服务例程的地址。\n- 中断体系结构必须保存被中断指令的地址。\n\
    - 在处理另一个中断时，传入的中断会被禁用，以防止中断丢失。\n\n## 中断处理\n\n- 操作系统通过存储寄存器和程序计数器来保存 CPU 的状态。\n\
    - 确定发生了哪种类型的中断：\n  - *轮询*\n  - *向量*中断系统\n- 单独的代码段确定每种类型的中断应采取什么操作。\n\n## 存储结构\n\
    \n- 计算机程序必须位于主内存中才能执行。\n- **主内存** —— CPU 可以直接访问的唯一大型存储介质。\n  - 太小，无法永久存储所有需要的程序和数据\n\
    \  - 是一种易失性存储设备\n- **辅助存储** —— 主内存的扩展，提供大容量非易失性存储能力。\n\n## 存储层次结构\n\n存储系统按层次结构组织。\n\
    \n- 速度\n- 成本\n- 易失性\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_28_0.png)\n\n\
    ## 缓存\n\n- 使用高速内存来保存最近访问的数据。\n- 需要*缓存管理*策略。\n- *缓存一致性* —— 这要求同时存储在多个层级中的数据保持*一致*。\n\
    \n## I/O 结构\n\n- I/O 设备和 CPU 可以并发执行。\n- 每个设备控制器负责一种特定类型的设备，并有一个本地缓冲区。\n- 设备控制器通过产生*中断*来通知\
    \ CPU 它已完成操作。\n\n*这种形式的中断驱动 I/O 适用于移动少量数据，但在用于批量数据移动（如磁盘 I/O）时可能会产生较高的开销。*\n\n\
    ## 直接内存访问（DMA）\n\n- 设备控制器在缓冲存储器和主内存之间直接传输数据块，**无需 CPU 干预**。\n- 每个块只产生一次中断，而不是每字节产生一次中断。\n\
    - 用于能够以接近内存速度传输信息的高速 I/O 设备。\n\n## 直接内存访问（DMA）\n\nCPU 向控制器提供（1）磁盘地址、（2）用于存储数据块的内存地址，以及（3）字节数。然后，CPU\
    \ 继续回去工作。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_32_0.png)\n\n## 硬件保护\n\n\
    - 双模式操作\n- CPU 保护\n- 内存保护\n- I/O 保护\n\n## 双模式操作\n\n- 共享系统资源要求操作系统确保错误的程序不能导致其他程序错误执行。\n\
    - 提供硬件支持以区分至少两种操作模式。\n  - *用户态* —— 代表用户执行。（用户态或目态）\n  - *监控模式*（也称为*内核模式*或*系统模式*）——\
    \ 代表操作系统执行。（核心态或管态）\n\n"
