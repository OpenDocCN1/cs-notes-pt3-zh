  md: "\n## Disk Structure\n\n- Disks can be removable\n- Drive attached to computer\
    \ via I/O bus\n  - Vary Busses, including EIDE, ATA, SATA, USB, Fiber Channel,\
    \ SCSI\n  - Host controller in computer uses bus to talk to disk controller built\
    \ into drive or storage array\n\n## Disk Structure\n\n- Disk drives are addressed\
    \ as large 1-dimensional arrays of *logical blocks*, where the logical block is\
    \ the smallest unit of transfer.\n- The 1-dimensional array of logical blocks\
    \ is mapped into the sectors of the disk sequentially.\n  - **Sector 0** is the\
    \ first sector of the first track on the outermost cylinder.\n  - Mapping proceeds\
    \ in order through that track, then the rest of the tracks in that cylinder, and\
    \ then through the rest of the cylinders from **outermost to innermost**.\n\n\
    ## Disk Attachment\n\n- Disks may be attached one of two ways\n  - **Host attached**\
    \ via an I/O port\n  - **Network attached** via a network connection\n\n## Storage-Area\
    \ Network\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_758_0.png)\n\n## Disk Scheduling\n\
    \n- **Access time** has two major components\n  - *Seek time* is the time for\
    \ the disk are to move the heads to the cylinder containing the desired sector.\n\
    \  - *Rotational latency* is the additional time waiting for the disk to rotate\
    \ the desired sector to the disk head.\n\n- **Disk bandwidth**\n  - the total\
    \ number of bytes transferred, divided by the total time between the first request\
    \ for service and the completion of the last transfer.\n\n## FCFS\n\nqueue = 98,\
    \ 183, 37, 122, 14, 124, 65, 67\nhead starts at 53\n\n0 14 37 53 65 67 98 122\
    \ 124 183 199\n\nSeek Distance: total head movement of 640 cylinders\n\n## SSTF\
    \ (Shortest Seek Time First)\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67\n\n\
    head starts at 53\n\n0 14 37 53 65 67 98 122 124 183 199\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_762_0.png)\n\
    \n- may cause starvation of some requests.\n\n- total head movement of 236 cylinders\n\
    \n## SCAN — elevator algorithm\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67\n\
    head starts at 53\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_763_0.png)\n\ntotal\
    \ head movement of 208 cylinders\n\n## C-SCAN\n\nqueue = 98, 183, 37, 122, 14,\
    \ 124, 65, 67\nhead starts at 53\n\n0 14 37 53 65 67 98 122 124 183 199\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_764_0.png)\n\
    \nProvides a more uniform wait time than SCAN.\n\n## C-LOOK\n\nqueue 98, 183,\
    \ 37, 122, 14, 124, 65, 67\n\nhead starts at 53\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_765_0.png)\n\
    \n## Selecting a Disk-Scheduling Algorithm\n\n- **SSTF** is common and has a natural\
    \ appeal\n- **SCAN and C-SCAN** perform better for systems that place a heavy\
    \ load on the disk.\n- Either **SSTF or LOOK** is a reasonable choice for the\
    \ default algorithm.\n- Performance depends on the number and types of requests.\n\
    - Requests for disk service can be influenced by the file-allocation method.\n\
    \n## Outline\n\n- Disk Structure\n- Disk Attachment\n- Disk Scheduling\n- Disk\
    \ Management\n- Swap-Space Management\n- RAID Structure\n- Stable-Storage Implementation\n\
    - Tertiary Storage Devices\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_767_0.png)\n\
    \n## Disk Formatting\n\n- *Low-level formatting, or physical formatting* — Dividing\
    \ a disk into sectors that the disk controller can read and write.\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_768_0.png)\n\
    \n## Disk Formatting\n\n- To use a disk to hold files, the operating system still\
    \ needs to record its own data structures on the disk.\n- *Partition* the disk\
