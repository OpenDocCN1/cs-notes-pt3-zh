  md: "\n## Fragmentation(碎片)\n\n- Processes are loaded and removed from memory, eventually\
    \ the memory will be cut into small holes that are not large enough to run any\
    \ incoming process.\n- Free memory holes between allocated ones are called **_external\
    \ fragmentation_**.\n- It is unwise to allocate exactly the requested amount of\
    \ memory to a process, **because of the minimum requirement for memory management**.\n\
    - Thus, memory that is allocated to a partition, but is not used, are called **_internal\
    \ fragmentation_**.\n\n## Fragmentation\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_522_0.png)\n\
    \nexternal fragmentation\n\nallocated partition\n\ninternal fragmentation\n\n\
    ## External Fragmentation Problem\n\n- **External fragmentation problem** exists\
    \ when there is enough total free memory space to satisfy a request, but the available\
    \ spaces are not contiguous.\n- **Solutions**\n  - Compaction\n  - Permitting\
    \ the physical address space of the processes to **be noncontiguous** —— Paging\
    \ and Segmentation\n\n## Compaction for External Fragmentation\n\n- Shuffle memory\
    \ contents to place all free memory together in one large block.\n- Compaction\
    \ is possible **only if** relocation is dynamic, and is done at execution time.\n\
    - compaction scheme can be expensive\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_524_0.png)\n\
    \n## Outline\n\n- Background\n- Contiguous Allocation\n- Paging\n- Structure of\
    \ Page Table\n- Segmentation\n\n## Paging\n\n- Physical address space of a process\
    \ can be **noncontiguous**; process is allocated physical memory whenever the\
    \ latter is available.\n- Divide physical memory into fixed-sized blocks called\
    \ **frames(帧)** (size is power of 2, between 512 bytes and 16M bytes).\n- Divide\
    \ logical memory into blocks of same size called **pages(页)**.\n\n## Paging\n\n\
    - Keep track of all free frames.\n- To run a program of size *n* pages, need to\
    \ find *n* free frames and load program.\n- Set up a page table to translate logical\
    \ to physical addresses.\n- Still have Internal Fragmentation.\n\n## Address Translation\
    \ Scheme\n\n- **Address generated by CPU is divided into:**\n  - *Page number\
    \ (p)* – used as an index into a *page table* which contains base address of each\
    \ page in physical memory.\n  - *Page offset (d)* – combined with base address\
    \ to define the physical memory address that is sent to the memory unit.\n\n##\
    \ Address Translation Scheme\n\n- For given logical address space $2^m$ and page\
    \ size $2^n$\n\n| page number | page offset |\n|:---:|:---:|\n| $p$ | $d$ |\n\
    | $m-n$ | $n$ |\n\n## Paging Hardware Support\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_531_0.png)\n\
    \n## Paging Example\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_532_0.png)\n\n\
    ## Free Frames\n\nBefore allocation\n\nAfter allocation\n\n(a)\n\n(b)\n\n## Address\
    \ Translation Example\n\n32-byte memory and 4-byte pages\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_534_0.png)\n\
    \n## Exercise2\n\n- 如果帧大小为4KB，那么具有4B大小页表条目的系统可以访问的最大物理内存空间为多少？\n\n如果固定页表大小为一页呢？\n\
    \n## Implementation of Page Table\n\n- Most allocate a page table for each process.\n\
    - In the simplest case, the page table is implemented as a set of dedicated registers.\n\
    - The use of registers is fit for the small page tables (for example, 256 entries)\
    \ and not is fit for the large page tables (for example, 1 million entries).\n\
    \n## Implementation of Page Table\n\n- Page table is kept in main memory.\n- *Page-table\
    \ base register (PTBR)* points to the page table.\n- In this scheme every data/instruction\
    \ access requires *two memory accesses*. One for the page table and one for the\
    \ data/instruction. Memory access is slowed by a factor of 2.\n\n## Implementation\
    \ of Page Table\n\n- The two memory access problem can be solved by the use of\
    \ a special fast-lookup hardware cache called *associative memory* or *translation\
    \ look-aside buffer (TLB)*\n\n| Page # | Frame # |\n|---|---|\n|  |  |\n|  | \
    \ |\n|  |  |\n|  |  |\n\nIf page # is in associative register, get frame # out.\
    \ Otherwise get frame # from page table in memory\n"
  mdcn: "\n\n## 碎片化\n\n- 进程被加载到内存中并从内存中移除，最终内存会被切割成小的空洞，这些空洞不足以运行任何传入的进程。\n- 分配区域之间空闲的内存空洞称为\
    \ **_外部碎片_**。\n- 由于内存管理的最低要求，不明智的做法是对进程分配恰好请求的内存量。\n- 因此，分配给分区但未使用的内存称为 **_内部碎片_**。\n\
    \n## 碎片化\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_522_0.png)\n\nexternal fragmentation\n\
    \nallocated partition\n\ninternal fragmentation\n\n## 外部碎片问题\n\n- 当有足够的总空闲内存空间来满足请求，但可用空间不连续时，就会存在\
    \ **外部碎片问题**。\n- **解决方案**\n  - 压缩\n  - 允许进程的物理地址空间 **不连续** —— 分页和分段\n\n## 外部碎片的压缩\n\
    \n- 调整内存内容，将所有空闲内存集中到一个大块中。\n- 压缩只有在 **仅当** 重定位是动态的，并在执行时完成时才可能。\n- 压缩方案可能代价昂贵\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_524_0.png)\n\n## 大纲\n\n- 背景\n- 连续分配\n\
    - 分页\n- 页表的结构\n- 分段\n\n## 分页\n\n- 进程的物理地址空间可以 **不连续**；只要物理内存可用，就会为进程分配物理内存。\n\
    - 将物理内存划分为固定大小的块，称为 **帧(帧)**（大小为2的幂，在512字节到16M字节之间）。\n- 将逻辑内存划分为相同大小的块，称为 **页(页)**。\n\
    \n## 分页\n\n- 跟踪所有空闲帧。\n- 要运行大小为 *n* 页的程序，需要找到 *n* 个空闲帧并加载程序。\n- 设置页表以将逻辑地址翻译为物理地址。\n\
    - 仍然存在内部碎片。\n\n## 地址转换方案\n\n- **CPU生成的地址被分为：**\n  - *页号 (p)* – 用作页表的索引，页表中包含每个页在物理内存中的基地址。\n\
    \  - *页内偏移量 (d)* – 与基地址组合以定义发送到内存单元的物理内存地址。\n\n## 地址转换方案\n\n- 对于给定的逻辑地址空间 $2^m$\
    \ 和页大小 $2^n$\n\n| page number | page offset |\n|:---:|:---:|\n| $p$ | $d$ |\n\
    | $m-n$ | $n$ |\n\n## 分页硬件支持\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_531_0.png)\n\
    \n## 分页示例\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_532_0.png)\n\n## 空闲帧\n\n\
    分配前\n\n分配后\n\n(a)\n\n(b)\n\n## 地址转换示例\n\n32字节内存和4字节页\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_534_0.png)\n\
    \n## Exercise2\n\n- 如果帧大小为4KB，那么具有4B大小页表条目的系统可以访问的最大物理内存空间为多少？\n\n如果固定页表大小为一页呢？\n\
    \n## 页表的实现\n\n- 大多数为每个进程分配一个页表。\n- 在最简单情况下，页表被实现为一组专用寄存器。\n- 使用寄存器适合于小的页表（例如，256个条目），而不适合于大的页表（例如，100万个条目）。\n\
    \n## 页表的实现\n\n- 页表保存在主内存中。\n- *页表基址寄存器 (PTBR)* 指向页表。\n- 在此方案中，每次数据/指令访问都需要 *两次内存访问*。一次用于页表，一次用于数据/指令。内存访问速度降低了2倍。\n\
    \n## 页表的实现\n\n- 双重内存访问问题可以通过使用一种特殊的快速查找硬件缓存来解决，该缓存称为 *关联存储器* 或 *转换后备缓冲器 (TLB)*\n\
    \n| Page # | Frame # |\n|---|---|\n|  |  |\n|  |  |\n|  |  |\n|  |  |\n\nIf page\
    \ # is in associative register, get frame # out. Otherwise get frame # from page\
    \ table in memory\n\n"
