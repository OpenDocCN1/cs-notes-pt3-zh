  md: "\n## 作业1\n\n- 说明抢占式调度与非抢占式调度的区别。对于计算中心，上述两种调度方式哪一种比较适合？\n\n## Dispatcher\n\n\
    - **Dispatcher module** gives control of the CPU to the process selected by the\
    \ short-term scheduler.\n- Its functions involve:\n  - switching context\n  -\
    \ switching to user mode\n  - jumping to the proper location in the user program\
    \ to restart that program\n- **Dispatch latency** – time it takes for the dispatcher\
    \ to stop one process and start another running.\n\n**The dispatcher should be\
    \ as fast as possible.**\n\n## Scheduling Criteria\n\n- There are many criteria\
    \ for comparing different scheduling algorithms.\n- Here are five common ones:\n\
    \  - CPU utilization (CPU利用率)\n  - Throughput (吞吐量)\n  - Turnaround time (周转时间)\n\
    \  - Waiting time (等待时间)\n  - Response time (响应时间)\n\n## CPU Utilization\n\n-\
    \ We want to keep the CPU as busy as possible.\n- CPU utilization ranges from\
    \ 0 to 100 percent.\n- Normally 40% or lower is lightly loaded and 90% or higher\
    \ is heavily loaded.\n\n## Throughput\n\n- The number of processes completed per\
    \ time unit is called **_throughput_**.\n- Higher throughput means more jobs get\
    \ done.\n- However, for long processes, this rate may be one job per hour, and,\
    \ for short jobs, this rate may be 10 per minute.\n\n## Turnaround Time\n\n- The\
    \ time period from job submission to completion is the **turnaround time**.\n\
    - From a user’s point of view, turnaround time is more important than CPU utilization\
    \ and throughput.\n- Turnaround time is the sum of\n  - waiting time before entering\
    \ the system\n  - waiting time in the ready queue\n  - waiting time in all other\
    \ events (e.g., I/O)\n  - time the process actually running on the CPU\n\n## Waiting\
    \ Time\n\n- **Waiting time** is the sum of the periods that a process spends waiting\
    \ in the **ready queue**.\n- **Why only ready queue?**\n  - CPU scheduling algorithms\
    \ do not affect the amount of time during which a process executes or does I/O.\n\
    \  - However, CPU scheduling algorithms do affect the time that a process stays\
    \ in the ready queue\n\n## Response Time\n\n- The time from the submission of\
    \ a request (in an interactive system) to the first response is called **response\
    \ time**. It **does not** include the time that it takes to output the response.\n\
    - For example, in front of your workstation, you perhaps care more about the time\
    \ between hitting the **Return** key and getting your first output than the time\
    \ from hitting the **Return** key to the completion of your program (e.g., turnaround\
    \ time).\n\n## Optimization Criteria\n\n- Max CPU utilization\n- Max throughput\n\
