  mdcn: "\n\n## 双模操作\n\n- *模式位*添加到计算机硬件中，用于指示当前模式：内核态（0）或用户态（1）。\n- 当中断或故障发生时，硬件从用户态切换到内核态。\n\
    - 双模运行为我们提供了保护操作系统免受错误用户程序干扰的手段。\n\n*特权指令* —— 某些可能*造成危害*且只能在*内核态*下执行的机器指令。\n\n\
    ## CPU 保护\n\n- **定时器** – 在指定时间段后中断计算机，以确保操作系统保持控制权。\n    - 定时器在每个时钟滴答时递减。\n  \
    \  - 当定时器达到0时，发生中断。\n- 定时器常用于实现分时。\n- 定时器还用于计算当前时间。\n- 加载定时器是一条**特权指令**。\n\n##\
    \ 内存保护\n\n- 必须至少为中断向量和中断服务例程提供内存保护。\n- 为了实现内存保护，需要添加两个寄存器来确定程序可访问的合法地址范围\n   \
    \ - 基址寄存器 – 保存最小的合法物理内存地址。\n    - 界限寄存器 – 包含范围的大小\n- 定义范围之外的内存受到保护。\n\n## 基址寄存器和界限寄存器的使用\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_39_0.png)\n\n## 内存地址保护\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_40_0.png)\n\
    \n## 内存保护\n\n- 在内核态执行时，操作系统可以无限制地访问内核内存和用户内存。\n- 加载*基址*和*界限*寄存器的指令是特权指令。\n\n##\
    \ I/O 保护\n\n- 所有I/O指令都是特权指令。\n- 必须确保用户程序永远无法在内核态下获得计算机的控制权（即，用户程序在执行过程中将新地址存储到中断向量中）。\n\
    \n## 概述\n\n- 什么是操作系统？\n- 操作系统相关硬件\n- 操作系统的发展\n\n## 操作系统的发展\n\n- 大型机系统\n- 桌面系统\n\
    - 多处理器系统\n- 分布式系统\n- 集群系统\n- 实时系统\n- 手持系统\n\n## 大型机系统\n\n无操作系统→批处理系统→多道程序系统→分时系统\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_45_0.png)\n\n- 用户独占全机资源\n- 程序运行前准备时间过长\n\
    - 人机速度不匹配\n\n## 批处理系统 (1/2)\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_46_0.png)\n\
    \n- 将卡片带到IBM 1401\n- IBM 1401将卡片读入磁带\n- 将磁带放入IBM 7094进行计算\n- 将磁带放入IBM 1401以打印输出\n\
    \n## 批处理系统 (2/2)\n\n- 通过批处理相似作业来减少设置时间\n- 自动作业排序 – 自动将控制权从一个作业转移到另一个作业。\n- 常驻监控程序\n\
    \    - 初始控制权在监控程序中\n    - 控制权转移到作业\n    - 当作业完成时，控制权转移回监控程序\n\n第一个初级的操作系统\n\n\
    ## 简单批处理系统的内存布局\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_48_0.png)\n\n## 多道程序批处理系统\n\
    \n多个作业同时保存在主内存中，CPU在它们之间多路复用。\n\n- 同时在内存中保留多个作业\n- 选择一个并开始执行\n- 如果该作业需要等待，CPU切换到另一个作业\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_49_0.png)\n\n这是操作系统首次必须为用户做出决策的情况。\n\
    \n## 多道程序所需的操作系统功能\n\n- **内存管理** – 系统必须将内存分配给多个作业。\n- **CPU调度** – 系统必须从多个就绪作业中选择一个来运行。\n\
    - **作业调度** – 系统必须从就绪作业中选择要调入内存的作业。\n- 设备分配和I/O例程由系统提供。\n\n"
