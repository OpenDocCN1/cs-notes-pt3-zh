  mdcn: "\n\n## 哈希页表\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_558_0.png)\n\n##\
    \ 倒置页表\n\n- 内存中的每个物理页框对应一个条目。\n- 条目由存储在该物理内存位置中的页的虚拟地址以及拥有该页的进程信息组成。\n- 减少了存储每个页表所需的内存，但增加了发生页引用时搜索表所需的时间。\n\
    - 使用哈希表将搜索限制在一个或至多几个页表条目内。\n\n## 倒置页表架构\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_560_0.png)\n\
    \n## 大纲\n\n- 背景\n- 连续分配\n- 分页\n- 页表结构\n- 分段\n\n## 分段\n\n- 支持用户视角的内存管理方案。\n- 程序是段的集合。段是一个逻辑单元，例如：\n\
    \  - 主程序、过程、函数、方法、\n  - 对象、局部变量、全局变量、\n  - 公共块、栈、符号表、数组\n\n## 分段的逻辑视图\n\n用户空间\n\
    \n物理内存空间\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_564_0.png)\n\n## 分段架构\n\n\
    - 逻辑地址由一个二元组组成：\n  - `<segment-number, offset>`\n\n- *段表*——将二维逻辑地址映射到物理地址；每个表条目包含：\n\
    \  - *基址*——包含段在内存中驻留的起始物理地址。\n  - *限长*——指定段的长度。\n\n## 分段硬件\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_566_0.png)\n\
    \nCPU\n\ns d\n\n段表\n\n限长 基址\n\n陷阱：寻址错误\n\n物理内存\n\n## 分段架构\n\n- **保护：** 与段表中的每个条目关联：\n\
    \  - 有效位 = 0 ⇒ 非法段\n  - 读/写/执行权限\n- 保护位与段关联；代码共享发生在段级别。\n- 由于段长度可变，内存分配是一个*动态存储分配问题*。\n\
    - 下面的示意图展示了一个分段示例。\n\n## 分段示例\n\n逻辑地址空间\n\n物理内存\n\n|  | 限长 | 基址 |\n|---|---|---|\n\
    | 0 | 1000 | 1400 |\n| 1 | 400 | 6300 |\n| 2 | 400 | 4300 |\n| 3 | 1100 | 3200\
    \ |\n| 4 | 1000 | 4700 |\n\n段表\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_568_0.png)\n\
    \n## 示例：Intel Pentium\n\n- 同时支持分段以及分段加分页\n- CPU 生成逻辑地址\n  - 交给分段单元\n    - 生成线性地址\n\
    \  - 线性地址交给分页单元\n    - 生成主内存中的物理地址\n    - 分页单元相当于 MMU\n\n## Intel Pentium 分段\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_571_0.png)\n\n## Linux 中的三级分页\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_574_0.png)\n\
    \n## 操作系统原理及应用\n\n李 伟\n\nxchlw@seu.edu.cn\n\n计算机科学与工程学院、软件学院\n江苏省网络与信息安全重点实验室\n\
    \n## 第9章 虚拟内存\n\n## 大纲\n\n- 背景\n- 请求分页\n- 页面置换\n- 页框分配\n- 抖动\n- 内存映射文件\n- 内核内存分配\n\
    - 其他考虑\n- 操作系统示例\n\n## 背景\n\n- 虚拟内存——将用户逻辑内存与物理内存分离。\n  - 程序只需部分驻留内存即可执行。\n  -\
    \ 因此逻辑地址空间可以远大于物理地址空间。\n  - 更多程序可以同时运行。\n  - 加载或交换所需的 I/O 更少。\n\n## 虚拟内存大于物理内存\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_579_0.png)\n\n## 虚拟地址空间\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_580_0.png)\n\
    \n"
