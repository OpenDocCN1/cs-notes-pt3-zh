  mdcn: "\n\n## 磁盘结构\n\n- 磁盘可以是可移动的\n- 驱动器通过 I/O 总线连接到计算机\n  - 总线种类繁多，包括 EIDE、ATA、SATA、USB、光纤通道、SCSI\n\
    \  - 计算机中的主机控制器使用总线与驱动器或存储阵列中内置的磁盘控制器通信\n\n## 磁盘结构\n\n- 磁盘驱动器被寻址为大型一维*逻辑块*数组，逻辑块是传输的最小单位。\n\
    - 逻辑块的一维数组按顺序映射到磁盘的扇区。\n  - **扇区 0** 是最外层柱面上第一个磁道的第一个扇区。\n  - 映射按顺序进行：先映射该磁道，然后是该柱面上的其余磁道，最后是从**最外层到最内层**的其余柱面。\n\
    \n## 磁盘连接\n\n- 磁盘可以通过以下两种方式之一连接\n  - 通过 I/O 端口**主机连接**\n  - 通过网络连接**网络连接**\n\n\
    ## 存储区域网络\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_758_0.png)\n\n## 磁盘调度\n\n\
    - **访问时间**有两个主要组成部分\n  - *寻道时间*是磁盘臂将磁头移动到包含目标扇区的柱面所需的时间。\n  - *旋转延迟*是等待磁盘将目标扇区旋转到磁头下方的额外时间。\n\
    \n- **磁盘带宽**\n  - 传输的总字节数除以从首次请求服务到最后一次传输完成之间的总时间。\n\n## FCFS（先来先服务）\n\n队列 = 98,\
    \ 183, 37, 122, 14, 124, 65, 67\n磁头起始于 53\n\n0 14 37 53 65 67 98 122 124 183 199\n\
    \n寻道距离：总磁头移动量为 640 个柱面\n\n## SSTF（最短寻道时间优先）\n\n队列 = 98, 183, 37, 122, 14, 124,\
    \ 65, 67\n\n磁头起始于 53\n\n0 14 37 53 65 67 98 122 124 183 199\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_762_0.png)\n\
    \n- 可能导致某些请求的饥饿。\n\n- 总磁头移动量为 236 个柱面\n\n## SCAN — 电梯算法\n\n队列 = 98, 183, 37, 122,\
    \ 14, 124, 65, 67\n磁头起始于 53\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_763_0.png)\n\
    \n总磁头移动量为 208 个柱面\n\n## C-SCAN（循环扫描）\n\n队列 = 98, 183, 37, 122, 14, 124, 65, 67\n\
    磁头起始于 53\n\n0 14 37 53 65 67 98 122 124 183 199\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_764_0.png)\n\
    \n提供比 SCAN 更均匀的等待时间。\n\n## C-LOOK（循环查找）\n\n队列 = 98, 183, 37, 122, 14, 124, 65,\
    \ 67\n\n磁头起始于 53\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_765_0.png)\n\n##\
    \ 选择磁盘调度算法\n\n- **SSTF** 很常见且具有天然的吸引力\n- **SCAN 和 C-SCAN** 在磁盘负载较重的系统中表现更好。\n\
    - **SSTF 或 LOOK** 中的任意一个都是默认算法的合理选择。\n- 性能取决于请求的数量和类型。\n- 磁盘服务请求可能受到文件分配方法的影响。\n\
    \n## 大纲\n\n- 磁盘结构\n- 磁盘连接\n- 磁盘调度\n- 磁盘管理\n- 交换空间管理\n- RAID 结构\n- 稳定存储实现\n- 三级存储设备\n\
    \n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_767_0.png)\n\n## 磁盘格式化\n\n- *低级格式化，或物理格式化*\
    \ — 将磁盘划分为磁盘控制器能够读写扇区的过程。\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_768_0.png)\n\
    \n## 磁盘格式化\n\n- 要使用磁盘保存文件，操作系统仍然需要在磁盘上记录自己的数据结构。\n- 将磁盘*分区*为一个或多个柱面组。\n- *逻辑格式化*或“创建文件系统”。\n\
    \n## 引导块\n\n- 引导块初始化系统\n  - 引导程序存储在 **ROM** 中。\n  - *引导*加载程序。\n- 在 Windows 2000\
    \ 中从磁盘引导\n\n![](img/0f9477f9dd9e571abf0b2ce4550a9e88_770_0.png)\n\n"
