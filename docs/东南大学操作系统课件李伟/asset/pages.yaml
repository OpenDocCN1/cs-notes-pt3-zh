- pgno: 320
  md: '# Ready Queue


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_320_0.png)


    +   - A process P can run only if all queues above the queue that contains P are
    empty.

    +   - When a process is running and a process in a higher priority queue comes
    in, the running process is preempted.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Multilevel Queue


    +   - Scheduling must be done between the queues.

    +   - Fixed priority scheduling; (i.e., serve all from foreground then from background).
    Possibility of starvation.

    +   - Time slice – each queue gets a certain amount of CPU time which it can schedule
    amongst its processes; i.e., 80% to foreground in RR, 20% to background in FCFS'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Multilevel Feedback Queue


    +   - *Multilevel queue with feedback scheduling* is similar to multilevel queue;
    however, it allows processes to move between queues.

    +     - aging can be implemented this way

    +   - If a process uses more (*resp.*, less) CPU time, it is moved to a queue
    of lower (*resp.*, higher) priority.

    +   - As a result, I/O-bound (*resp.*, CPU-bound) processes will be in higher
    (*resp.*, lower) priority queues.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Example of Multilevel Feedback Queue


    +   - Three queues:

    +     - Q₀ – time quantum 8 milliseconds

    +     - Q₁ – time quantum 16 milliseconds

    +     - Q₂ – FCFS

    +   - Scheduling

    +     - A new job enters Q₀ which is served RR. When it gains CPU, job runs for
    8 milliseconds. If it does not finish in 8 milliseconds, job is moved to Q₁.

    +     - At Q₁ job is again served RR and runs for 16 additional milliseconds.
    If it still does not complete, it is preempted and moved to queue Q₂.'
  merge: -1
  img_proc: true
