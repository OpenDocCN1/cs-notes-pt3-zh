- pgno: 59
  md: '# Parallel Systems(1/2)


    +   - **Multiprocessor systems** with more than one CPU in close communication.

    +   - *Tightly coupled system* – processors share the computer bus, memory and
    a clock; communication usually takes place through the shared memory.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Parallel Systems (2/2)


    # Advantages of parallel system


    +   - **Increased throughput:** Gets more jobs done

    +   - **Economy of scale:** Because of resource sharing, multiprocessor systems
    is cheaper than multiple single processor systems

    +   - **Increased reliability:** the failure of one processor will not halt the
    whole system'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Types of Parallel Systems


    +   - **Asymmetric multiprocessing**

    +     - Each processor is assigned a specific task.

    +     - A master processor controls the system. The other processors either look
    to the master for instructions or have predefined tasks.

    +     - Thus, this defines a master-slave relationship

    +     - Master processor schedules and allocated work to slave processors.

    +     - More common in extremely large systems'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Types of Parallel Systems


    +   - **Symmetric multiprocessing (SMP)**

    +     - Each processor runs an identical copy of the operating system.

    +     - Many processes can run at once without performance deterioration.

    +     - Must carefully control I/O to ensure that the data reach the appropriate
    processor

    +     - May result in inefficiencies

    +     - Most modern operating systems support SMP'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Distributed Systems (1/3)


    +   - Distribute the computation among several physical processors.

    +   - *Loosely coupled system* – each processor has its own local memory; processors
    communicate with one another through various communications lines, such as high-speed
    buses or telephone lines.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Distributed Systems (2/3)


    +   - A distributed system is a collection of physically *separate*, possible
    *heterogeneous* computer systems that are *networked* to provide the users with
    access to the various resources that the system maintains


    +   - Advantages of distributed systems.

    +     - Resources Sharing

    +     - Computation speed up – load sharing

    +     - Reliability

    +     - Communications'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Distributed Systems (3/3)


    +   - Requires networking infrastructure.

    +   - Local area networks (LAN) or Wide area networks (WAN).

    +   - May be either **client-server** or **peer-to-peer** systems.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Clustered Systems (1/2)


    +   - A clustered system has two or more individual systems **shared storage**
    and **closely linked** via LAN networking.

    +   - The key of clustered system is **high availability**.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Clustered Systems (2/2)


    +   - **Asymmetric Clustering**

    +     - One machine is in **hot-standby** mode while others are running applications.

    +     - The hot-standby machine (*i.e.*, does nothing but) monitors other machines
    and becomes active if one server fails.

    +   - **Symmetric Clustering**

    +     - Two or more hosts are running applications and monitor each other.

    +     - This is more efficient as it uses all available hardware'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Real-Time Systems (1/3)


    +   - Often used as a control device in a dedicated application such as controlling
    scientific experiments, medical imaging systems, industrial control systems, and
    some display systems.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Real-Time Systems (2/3)


    +   - A real-time operating system has well-defined, **fixed time constraints**.

    +   - Processing *must* be done within the defined constraints, or the system
    will fail.

    +   - **Embedded systems** almost always run real-time operating systems'
  merge: -1
