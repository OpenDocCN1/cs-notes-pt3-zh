  md: '# Multilevel Queue


    +   - Ready queue is partitioned into separate queues

    +     - foreground (interactive)

    +     - background (batch)

    +   - Each process is assigned permanently to one queue based on some properties
    of the process (e.g., memory usage, priority, process type)

    +   - Each queue has its own scheduling algorithm

    +     - foreground – RR

    +     - background – FCFS'
