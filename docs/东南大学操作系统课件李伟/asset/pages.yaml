- pgno: 557
  md: '# # Hashed Page Tables


    +   - Common in address spaces > 32 bits.

    +   - The virtual page number is hashed into a page table. Each entry in this
    page table contains a chain of elements hashing to the same location.

    +   - Virtual page numbers are compared in this chain searching for a match. If
    a match is found, the corresponding physical frame is extracted.'
  merge: -1
  img_proc: true
