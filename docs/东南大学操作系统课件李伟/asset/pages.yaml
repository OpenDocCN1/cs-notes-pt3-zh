    (*Critical-section Problem*)


    +   - Busy waiting has **not been completely eliminated**.


    +     - Busy waiting has been removed from the entry section to the critical sections
    of application programs.

    +     - Furthermore, we have limited busy waiting to the critical sections of
    the `wait()` and `signal()` operations.'
