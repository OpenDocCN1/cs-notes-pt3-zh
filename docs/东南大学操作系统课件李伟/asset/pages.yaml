- pgno: 612
  md: '# Fixed Allocation


    +   - **Equal allocation** – e.g., if 100 frames and 5 processes, give each 20
    pages.

    +   - **Proportional allocation** – Allocate according to the size of process.


    s_i = size of process p_i

    S = Σ s_i

    m = total number of frames

    a_i = allocation for p_i = s_i / S × m'
  merge: -1
  img_proc: true
- pgno: 613
  md: '# # Priority Allocation


    +   - Use a proportional allocation scheme using priorities rather than size.

    +   - If process *Pᵢ* generates a page fault,

    +     - select for replacement one of its frames.

    +     - select for replacement a frame from a process with lower priority number.'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Global vs. Local Allocation


    +   - **Global replacement** – process selects a replacement frame from the set
    of all frames; one process can take a frame from another.


    +   - **Local replacement** – each process selects from only its own set of allocated
    frames.'
  merge: -1
  img_proc: true
