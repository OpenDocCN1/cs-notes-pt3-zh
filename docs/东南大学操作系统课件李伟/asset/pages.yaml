  md: '# Free-Space Management


    +   - How do we keep track free blocks on a disk?

    +   - A free-space list is maintained. When a new block is requested, we search
    this list to find one.

    +   - The following are commonly used techniques

    +     - Bit Vector

    +     - Linked List

    +     - Linked List + Grouping

    +     - Linked List+Address+Count'
  merge: -1
  img_proc: true
