- pgno: 644
  md: '# Windows XP


    +   - A process may be assigned as many pages up to its working set maximum

    +   - When the amount of free memory in the system falls below a threshold, automatic
    working set trimming is performed to restore the amount of free memory

    +   - Working set trimming removes pages from processes that have pages in excess
    of their working set minimum'
  merge: -1
  img_proc: true
- pgno: 645
  md: '# Solaris


    +   - Maintains a list of free pages to assign faulting processes

    +   - *Lotsfree* – **threshold parameter (amount of free memory) to begin paging**

    +   - *Desfree* – **threshold parameter to increasing paging**

    +   - *Minfree* – **threshold parameter to being swapping**'
  merge: -1
