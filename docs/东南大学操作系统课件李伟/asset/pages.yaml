- pgno: 433
  md: '# Solaris Synchronization


    +   - Implements a variety of locks to support multitasking, multithreading (including
    real-time threads), and multiprocessing.

    +   - Uses *adaptive mutex* for efficiency when protecting data from short code
    segments.

    +   - Uses *condition variables*, *semaphore*, and *readers-writers locks* when
    longer sections of code need access to data.

    +   - Uses *turnstiles* to order the list of threads waiting to acquire either
    an adaptive mutex or reader-writer lock.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Windows XP Synchronization


    +   - Uses **interrupt masks** (中断屏蔽) to protect access to global resources on
    uniprocessor systems.

    +   - Uses *spinlocks* on multiprocessor systems.

    +   - Also provides *dispatcher objects* which may act as mutex and semaphores.

    +   - Dispatcher objects may also provide *events*. An event acts much like a
    condition variable.'
  merge: -1
  img_proc: true
