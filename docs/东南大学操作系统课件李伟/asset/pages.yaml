- pgno: 120
  md: '# Virtual Machines


    +   - The resources of the physical computer are shared to create the virtual
    machines

    +   - CPU scheduling can create the appearance that users have their own processor

    +   - Spooling and a file system can provide virtual card readers and virtual
    line printers

    +   - A normal user time-sharing terminal serves as the virtual machine operator’s
    console'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Virtual Machines


    +   - **Advantages**

    +     - **Providing complete protection of system resources**

    +       - Each virtual machine is isolated from all other virtual machines. This
    isolation, however, permits no direct sharing of resources.

    +     - **Being able to share the same hardware yet run different operating systems
    concurrently**

    +     - **A perfect vehicle for operating-systems research and development**

    +       - System development is done on the virtual machine, so does not disrupt
    normal system operation.'
  merge: -1
  img_proc: true
