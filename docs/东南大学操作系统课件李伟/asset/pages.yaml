- pgno: 460
  md: '# Safe State


    +   - When a process requests an available resource, system must decide if immediate
    allocation leaves the system in a *safe state*.


    +   - System is in safe state if there exists a safe sequence of all processes.


    +   - **Sequence <P₁, P₂, …, Pₙ> is safe** if for each Pᵢ, the resources that
    Pᵢ can still request can be satisfied by currently available resources *plus*
    resources held by all the Pⱼ, with j<i.'
  merge: -1
  img_proc: true
