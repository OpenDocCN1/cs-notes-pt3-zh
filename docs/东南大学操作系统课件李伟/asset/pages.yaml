- pgno: 310
  md: '# Priority Scheduling


    +   - Priorities are generally indicated by **some fixed range of number**, such
    as 0~7.

    +   - In this text, we assume that low numbers represent high priority.

    +   - The scheduler always picks the process (in ready queue) with the **highest
    priority** to run.

    +   - Are FCFS and SJF the **special cases** of priority scheduling? (**Why?**)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Priority Scheduling


    +   - Priority scheduling can be **nonpreemptive** or **preemptive**.

    +   - With preemptive priority scheduling, if the newly arrived process has a
    higher priority than the running one, the latter is preempted.

    +   - **Indefinite block** (or **starvation**) may occur: a low priority process
    may never have a chance to run'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Aging


    +   - Aging is a technique to overcome the starvation problem.

    +   - *Aging*: gradually increases the priority of processes that wait in the
    system for a long time.

    +   - Example:

    +     - If 0 is the highest (*resp.*, lowest) priority, then we could decrease
    (*resp.*, increase) the value of the priority of a waiting process by 1 every
    fixed period (*e.g.*, every minute).'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# # Round Robin (RR)


    +   - RR is designed especially for **time-sharing systems**.

    +   - RR is similar to FCFS, except that each process is assigned a **time quantum/slice**.

    +   - All processes in the ready queue is a **FIFO** list. When the CPU is free,
    the scheduler picks the **first** and lets it run for **one time quantum**.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Round Robin (RR)


    +   - If the process uses CPU for less than one time quantum, it will release
    the CPU voluntarily.

    +   - Otherwise, when one time quantum is up, that process is preempted by the
    scheduler and moved to the tail of the list.'
  merge: -1
  img_proc: true
