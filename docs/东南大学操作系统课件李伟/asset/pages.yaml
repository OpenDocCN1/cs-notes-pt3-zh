- pgno: 332
  md: '# # Real-Time Scheduling


    +   - **Hard real-time systems** – required to complete a critical task within
    a guaranteed amount of time.

    +     - The scheduler **either admits** a process and guarantees that the process
    will complete on-time, **or reject** the request (*resource reservation*).

    +     - This is almost impossible if the system has secondary storage and virtual
    memory because these subsystems can cause unavoidable delay.

    +     - Hard real-time systems usually have special software running on special
    hardware.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Real-Time Scheduling


    +   - *Soft real-time systems* – requires that critical processes receive priority
    over less fortunate ones.

    +     - It is easily doable within a general system.

    +     - It could cause an unfair resource allocation and longer delay (*starvation*)
    for noncritical tasks.

    +     - The CPU scheduler must *prevent aging* to occur. Otherwise, critical tasks
    may have lower priority.

    +     - The dispatch latency must be small.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Priority Inversion


    +   - What if a **high-priority process** needs to access the data that is currently
    being accessed by a low-priority process?

    +   - The high-priority process is blocked by the low-priority process.

    +   - This is *priority inversion*.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Priority Inversion


    +   - This can be solved with *priority-inheritance protocol*.

    +     - All processes, including the one that is accessing the data, **inherit
    the high priority** until they are done with the resource.

    +     - When they finish, their priority values **revert** back to the original
    values.'
  merge: -1
  img_proc: true
