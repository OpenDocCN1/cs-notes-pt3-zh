- pgno: 605
  md: '# LRU Approximation

    Algorithms


    # Reference bit


    +   - With each entry in the page table associate a bit, initially = 0

    +   - When page is referenced, the bit will be set to 1.

    +   - Replace the one which bit is 0 (if one exists). We do not know the order
    of use, however we can determine which pages have been used and which have not
    been used.'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# LRU Approximation Algorithms


    +   - **Additional-Reference-Bits Algorithm**

    +     - Keep an 8-bit bytes for each page

    +     - At regular intervals shifts the bits right 1 bit, shift the reference
    bit into the high-order bit

    +     - Interpret these 8-bit bytes as unsigned integers, the page with lowest
    number is the LRU page'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# LRU Approximation

    Algorithms


    # ■ Second-Chance Algorithm


    +   - Need reference bit.

    +   - Clock replacement (FIFO).

    +   - If page to be replaced (in clock order) has reference bit = 1, then:

    +     - set reference bit 0.

    +     - leave page in memory.

    +     - replace next page (in clock order), subject to same rules.'
  merge: -1
  img_proc: true
