  md: "# Bakery Algorithm\n\n```\ndo {\n    choosing[ i ] = true;\n    number[ i ]\
    \ = max(number[0], number[1], ..., number [n − 1])+1;\n    choosing[ i ] = false;\n\
    \    for (j = 0; j < n; j++) {\n        while (choosing[ j ]);\n        while\
    \ ((number[ j ] != 0) && ((number[ j ],j) < (number[ i ],i)));\n    }\n    critical\
    \ section\n    number[ i ] = 0;\n    remainder section\n} while (1);\n```\n\n\
