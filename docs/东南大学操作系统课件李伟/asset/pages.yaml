- pgno: 84
  md: '# Operating System Services(1/2)


    # Services for helping Users


    +   - **Program execution** – system capability to load a program into memory
    and to run it.

    +   - **I/O operations** – since user programs cannot execute I/O operations directly,
    the operating system must provide some means to perform I/O.

    +   - **File-system manipulation** – program capability to read, write, create,
    and delete files.

    +   - **Communications** – exchange of information between processes (*shared
    memory* or *message passing*)

    +   - **Error detection** – ensure correct computing by detecting errors in hardwares
    or in user programs.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Operating System Services(2/2)


    +   - **Services for ensuring system operations**

    +     - **Resource allocation** – allocating resources to multiple users or multiple
    jobs running at the same time.

    +     - **Accounting** – keep track of which users use how much and what kinds
    of computer resources.

    +     - **Protection** – ensuring that all access to system resources is controlled
    and recording all the connections for detection of break-ins.'
  merge: -1
