- pgno: 514
  md: '# # Fixed partitions


    +   - Memory is divided into *n* partitions at the startup time and altered later
    on.

    +   - Each partition may contain exactly one process.

    +   - Each partition may have a job queue. Or, all partitions share the same job
    queue.


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_514_0.png)'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# Variable Partitions


    +   - *Hole (H)* – block of available memory; holes of various size are scattered
    throughout memory.

    +   - When a process arrives, it is allocated memory from a hole large enough
    to accommodate it.

    +   - Thus, partition sizes are not fixed, The number of partitions also varies.

    +   - Operating system maintains information about

    +     - allocated partitions

    +     - free partitions (hole)'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# # Variable Partitions


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_516_0.png)'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# # Variable Partitions


    +   - If the hole is larger than the requested size, it is cut into two. The one
    of the requested size is given to the process, the remaining one becomes a *new*
    hole.

    +   - When a process returns a memory block, it becomes a hole and must be combined
    with its neighbors.


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_517_0.png)'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# # Solutions to Dynamic

    # Storage-Allocation Problem


    +   - **First-fit(首次适配):** Allocate the *first* hole that is big enough.

    +   - **Best-fit(最佳适配):** Allocate the *smallest* hole that is big enough; must
    search entire list, unless ordered by size. Produces the smallest leftover hole.

    +   - **Worst-fit(最差适配):** Allocate the *largest* hole; must also search entire
    list. Produces the largest leftover hole.'
  merge: -1
  img_proc: true
- pgno: 519
  md: '# Solutions to Dynamic Storage-Allocation Problem


    +   - Simulations have shown that

    +     - both first fit and best fit are better than worst fit in terms of decreasing
    time and storage utilization

    +     - Neither first fit nor best fit is clearly better than the other in terms
    of storage utilization, but first fit is generally faster.'
  merge: -1
  img_proc: true
