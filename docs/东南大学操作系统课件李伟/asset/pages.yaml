- pgno: 738
  md: '# NFS Mount Protocol


    +   - Establishes initial logical connection between server and client

    +   - Mount operation includes name of remote directory to be mounted and name
    of server machine storing it

    +   - Mount request is mapped to corresponding RPC and forwarded to mount server
    running on server machine

    +   - Export list – specifies local file systems that server exports for mounting,
    along with names of machines that are permitted to mount them'
  merge: -1
  img_proc: true
- pgno: 739
  md: '# NFS Mount Protocol


    +   - Following a mount request that conforms to its export list, the server returns
    a file handle—a key for further accesses

    +   - File handle – a file-system identifier, and an inode number to identify
    the mounted directory within the exported file system

    +   - The mount operation changes only the user’s view and does not affect the
    server side'
  merge: -1
  img_proc: true
- pgno: 740
  md: '# NFS Protocol


    +   - Provides a set of remote procedure calls for remote file operations.

    +   - The procedures support the following operations

    +     - searching for a file within a directory

    +     - reading a set of directory entries

    +     - manipulating links and directories

    +     - accessing file attributes

    +     - reading and writing files'
  merge: -1
  img_proc: true
- pgno: 741
  md: '# # NFS Protocol


    +   - NFS servers are **stateless**; each request has to provide a full set of
    arguments

    +     - (NFS V4 is just coming available – very different, stateful)

    +   - Modified data must be committed to the server’s disk before results are
    returned to the client (lose advantages of caching)

    +   - The NFS protocol does not provide concurrency-control mechanisms'
  merge: -1
  img_proc: true
- pgno: 742
  md: '# Three Major Layers of NFS Architecture


    +   - UNIX file-system interface (based on the open, read, write, and close calls,
    and file descriptors)

    +   - *Virtual File System* (VFS) layer – distinguishes local files from remote
    ones, and local files are further distinguished according to their file-system
    types

    +     - The VFS activates file-system-specific operations to handle local requests
    according to their file-system types

    +     - Calls the NFS protocol procedures for remote requests

    +   - NFS service layer – bottom layer

    +     - Implements the NFS protocol'
  merge: -1
  img_proc: true
- pgno: 743
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 744
  md: '# NFS Path-Name Translation


    +   - Performed by breaking the path into component names and performing a separate
    NFS lookup call for every pair of component name and directory vnode

    +   - To make lookup faster, a directory name lookup cache on the client’s side
    holds the vnodes for remote directory names'
  merge: -1
  img_proc: true
- pgno: 745
  md: '# NFS Remote Operations


    +   - Nearly one-to-one correspondence between regular UNIX system calls and the
    NFS protocol RPCs (except opening and closing files)

    +   - NFS adheres to the remote-service paradigm, but employs buffering and caching
    techniques for the sake of performance'
  merge: -1
  img_proc: true
- pgno: 746
  md: '# NFS Remote Operations


    +   - **File-blocks cache** – when a file is opened, the kernel checks with the
    remote server whether to fetch or revalidate the cached attributes

    +     - Cached file blocks are used only if the corresponding cached attributes
    are up to date

    +   - **File-attribute cache** – the attribute cache is updated whenever new attributes
    arrive from the server

    +   - Clients do not free delayed-write blocks until the server confirms that
    the data have been written to disk'
  merge: -1
  img_proc: true
