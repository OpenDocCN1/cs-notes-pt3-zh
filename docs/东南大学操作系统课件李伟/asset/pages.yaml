- pgno: 616
  md: '# # Thrashing


    +   - If a process does not have “enough” pages, the page-fault rate is very high.

    +     - low CPU utilization.

    +     - operating system thinks that it needs to increase the degree of multiprogramming.

    +     - another process is added to the system.


    +   - **Thrashing** — a process is busy swapping pages in and out.'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# Thrashing


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_617_0.png)'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# Thrashing


    +   - Why does paging work?

    +     Locality model

    +     - A locality is a set of pages that are actively used together.

    +     - Process migrates from one locality to another.

    +     - Localities may overlap.

    +   - Why does thrashing occur?

    +     size of locality > allocated memory size'
  merge: -1
  img_proc: true
- pgno: 619
  md: '# Working-Set Model


    +   Δ ≡ working-set window ≡ a fixed number of page references

    +   Example: 10,000 instruction


    +   WSSᵢ (working set of Process Pᵢ) = total number of pages referenced in the
    most recent Δ (varies in time)


    +   if Δ too small will not encompass entire locality.


    +   if Δ too large will encompass several localities.


    +   if Δ = ∞ ⇒ will encompass entire program.'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# Working-Set Model


    +   - The working set is an approximation of the program’s locality.

    +   - $D = \sum WSS_i \equiv$ total demand frames

    +   - if $D > m \Rightarrow$ Thrashing $\Rightarrow$ Suspend one of the processes


    The working set is an approximation of the program’s locality.


