- pgno: 584
  md: '# Demand Paging


    +   - Bring a page into memory only when it is needed.

    +     - Less I/O needed

    +     - Less memory needed

    +     - Faster response

    +     - More users

    +   - Page is needed ⇒ reference to it

    +     - invalid reference ⇒ abort

    +     - not-in-memory ⇒ bring to memory

    +   - **Lazy Swapper (Pager)** – never swaps a page into memory unless page will
    be needed'
  merge: -1
  img_proc: true
- pgno: 585
  md: '# Valid-Invalid Bit


    +   - A valid–invalid bit is associated with each page table entry

    +     - 1 ⇒ valid and in-memory

    +     - 0 ⇒ invalid or not-in-memory

    +   - Initially valid–invalid bit is set to 0 on all entries.

    +   - During address translation, if valid–invalid bit in page table entry is
    0 ⇒ **page fault.**'
  merge: -1
  img_proc: true
