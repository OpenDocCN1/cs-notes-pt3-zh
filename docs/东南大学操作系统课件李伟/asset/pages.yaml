- pgno: 536
  md: '# Implementation of Page Table


    +   - Most allocate a page table for each process.

    +   - In the simplest case, the page table is implemented as a set of dedicated
    registers.

    +   - The use of registers is fit for the small page tables (for example, 256
    entries) and not is fit for the large page tables (for example, 1 million entries).'
  merge: -1
  img_proc: true
- pgno: 537
  md: '# Implementation of Page Table


    +   - Page table is kept in main memory.

    +   - *Page-table base register (PTBR)* points to the page table.

    +   - In this scheme every data/instruction access requires *two memory accesses*.
    One for the page table and one for the data/instruction. Memory access is slowed
    by a factor of 2.'
  merge: -1
  img_proc: true
- pgno: 538
  md: '# Implementation of Page Table


    +   - The two memory access problem can be solved by the use of a special fast-lookup
    hardware cache called *associative memory* or *translation look-aside buffer (TLB)*


    | Page # | Frame # |

    |---|---|

    |  |  |

    |  |  |

    |  |  |

    |  |  |


    If page # is in associative register, get frame # out. Otherwise get frame # from
    page table in memory'
  merge: -1
  img_proc: true
- pgno: 539
  md: '# Paging Hardware With TLB


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_539_0.png)'
