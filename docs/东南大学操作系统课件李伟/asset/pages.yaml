- pgno: 467
  md: '# Banker’s Algorithm


    +   - Multiple instances.

    +   - Each process must a priori claim maximum use.

    +   - When a process requests a resource it may have to wait.

    +   - When a process gets all its resources it must return them in a finite amount
    of time.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# Data Structures for the Banker’s Algorithm


    Let n = number of processes, and m = number of resources types.


    +   - **Available**: Vector of length m. If available [j] = k, there are k instances
    of resource type Rj available.


    +   - **Max**: n x m matrix. If Max [i,j] = k, then process Pi may request at
    most k instances of resource type Rj.


    +   - **Allocation**: n x m matrix. If Allocation[i,j] = k then Pi is currently
    allocated k instances of Rj.


    +   - **Need**: n x m matrix. If Need[i,j] = k, then Pi may need k more instances
    of Rj to complete its task.'
  merge: -1
  img_proc: true
- pgno: 469
  md: "# # Safety Algorithm\n\n+   1. Let *Work* and *Finish* be vectors of length\
    \ *m* and *n*, respectively. Initialize:\n+   \n+      *Work* = Available;  *Finish*\
    \ [i] = false for i = 0, 1, ..., n.\n\n+   2. Find an *i* such that both:\n+ \
    \  \n+      (a) *Finish* [i] = *false*\n+   \n+      (b) *Needᵢ* ≤ *Work*\n+ \
    \  \n+      If no such *i* exists, go to step 4.\n\n+   3. *Work* = *Work* + *Allocationᵢ*\n\
    +   \n+      *Finish* [i] = *true*\n+   \n+      go to step 2.\n\n+   4. If *Finish*\
    \ [i] == true for all *i*, then **the system is in a safe state.**"
  merge: -1
  img_proc: true
- pgno: 470
  md: '# Resource-Request Algorithm for Process Pi


    Let *Request*ᵢ be the request vector for process *P*ᵢ. If *Request*ᵢ[*j*] = *k*
    then process *P*ᵢ wants *k* instances of resource type *R*ⱼ.


    +   1. If *Request*ᵢ ≤ *Need*ᵢ go to step 2. Otherwise, raise error condition,
    since process has exceeded its maximum claim.

    +   2. If *Request*ᵢ ≤ *Available*, go to step 3. Otherwise *P*ᵢ must wait, since
    resources are not available.'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# Resource-Request Algorithm for Process $P_i$


    3. Pretend to allocate requested resources to $P_i$ by modifying the state as
    follows:


    $$Available = Available - Request_i;$$


    $$Allocation_i = Allocation_i + Request_i;$$


    $$Need_i = Need_i - Request_i;$$


    +   - **If safe** ⇒ the resources are allocated to $P_i$.

    +   - **If unsafe** ⇒ $P_i$ must wait, and the old resource-allocation state is
    restored.'
  merge: -1
  img_proc: true
