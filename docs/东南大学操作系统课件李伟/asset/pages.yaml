- pgno: 454
  md: "# Deadlock Prevention:  \nMutual Exclusion\n\n+   - By ensuring that at least\
    \ one of the four conditions cannot hold, we can prevent the occurrence of a deadlock.\n\
    +   - **Mutual Exclusion**: Some nonsharable resources must be accessed exclusively\
    \ (e.g., printer), which means we cannot deny the mutual exclusion condition."
  merge: -1
  img_proc: true
- pgno: 455
  md: '# Deadlock Prevention:

    Hold and Wait


    +   - No process can hold some resources and then request for other resources.

    +   - Two strategies are possible:

    +     - A process must acquire *all* resources before it runs.

    +     - When a process requests for resources, it must hold none (i.e., returning
    resources before requesting for more).

    +   - Resource utilization may be low, since many resources will be held and unused
    for a long time.

    +   - Starvation is possible. A process that needs some popular resources may
    have to wait indefinitely.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Deadlock Prevention:

    No Preemption


    +   - If a process that is holding some resources requests another resource that
    cannot be immediately allocated to it, then all resources currently being held
    are preempted.


    +   - If the requested resources are not available:

    +     - If they are being held by processes that are waiting for additional resources,
    these resources are preempted and given to the requesting process. (抢别人)

    +     - Otherwise, the requesting process waits until the requested resources
    become available. While it is waiting, its resources may be preempted. (被抢)'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# Deadlock Prevention:

    Circular Wait


    +   - To break the circular waiting condition, we can order all resource types
    (*e.g.*, tapes, printers).

    +   - A process can only request resources higher than the resource types it holds.

    +   - A process must release some higher order resources to request a lower order
    resource.

    +   - Suppose the ordering of tapes, disks, and printers are 1, 4, and 8. If a
    process holds a disk (4), it can only ask a printer (8) and cannot request a tape
    (1). To get tapes (1), a process must release its disk (4).

    +   - In this way, no deadlock is possible. Why?'
  merge: -1
  img_proc: true
