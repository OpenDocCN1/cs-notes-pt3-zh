- pgno: 191
  md: '# # Remote Procedure Calls


    +   - Remote procedure call (RPC) **abstracts procedure calls between processes
    on networked systems.**

    +   - Messages exchanged in RPC communication are **well structured.**

    +   - Each message contains **an identifier of the function** and **the parameters**
    to pass to it.

    +   - The function is executed and any output is send back to the requester in
    a separate message.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# # Remote Procedure Calls


    +   - RPC allow a client to invoke a procedure on a remote host as it would invoke
    a procedure locally.

    +   - **Stubs** – client-side proxy for the actual procedure on the server.

    +   - **The client-side stub** locates the port on the server and *marshals* the
    parameters.

    +   - **The server-side stub** receives this message, unpacks the marshaled parameters,
    and performs the procedure on the server.'
  merge: -1
  img_proc: true
