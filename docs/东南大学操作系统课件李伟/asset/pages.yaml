- pgno: 54
  md: '# Time-Sharing Systems–Interactive Computing (1/2)


    +   - Time-sharing operating system allows many users to share the computer simulataneously

    +   - Switches rapidly from one user to the next

    +   - Gives users the impression: the entire computer system is dedicated for
    his use.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Time-Sharing Systems–Interactive Computing （2/2）


    +   - The CPU is multiplexed among several jobs that are kept in memory and on
    disk

    +   - Sophisticated CPU-scheduling schemes are required for concurrent execution

    +   - To obtain a reasonable response time, a job needs to be swapped in and out
    of memory to the disk (*virtual memory*).

    +   - Disk management must be provided

    +   - Job synchronization mechanisms are needed

    +   - It may ensure that jobs do not get stuck in a deadlock'
  merge: -1
  img_proc: true
