- pgno: 34
  md: '# Dual-Mode Operation


    +   - Sharing system resources requires operating system to ensure that an incorrect
    program cannot cause other programs to execute incorrectly.

    +   - Provide hardware support to differentiate between at least two modes of
    operations.

    +     - *User mode* – execution done on behalf of a user.(用户态或目态)

    +     - *Monitor mode* (also *kernel mode* or *system mode*) – execution done
    on behalf of operating system. (核心态或管态)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Dual-Mode Operation


    +   - *Mode bit* added to computer hardware to indicate the current mode: kernel
    (0) or user (1).

    +   - When an interrupt or fault occurs, hardware switches from user mode to kernel
    mode.

    +   - The dual mode of operation provides us with the means for protecting the
    operating system from errant user programs.


    *Privileged Instruction* —— Some of the machine instructions that may *cause harm*
    and can be executed only in *kernel mode*.'
  merge: -1
  img_proc: true
- pgno: 36
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # CPU Protection


    +   - **Timer** – interrupts computer after specified period to ensure operating
    system maintains control.

    +     - Timer is decremented every clock tick.

    +     - When timer reaches the value 0, an interrupt occurs.

    +   - Timer commonly used to implement time sharing.

    +   - Timer also used to compute the current time.

    +   - Load-timer is a **privileged instruction**.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Memory Protection


    +   - Must provide memory protection at least for the interrupt vector and the
    interrupt service routines.

    +   - In order to have memory protection, add two registers that determine the
    range of legal addresses a program may access

    +     - Base register（基址寄存器） – holds the smallest legal physical memory address.

    +     - Limit register（界限寄存器） – contains the size of the range

    +   - Memory outside the defined range is protected.'
  merge: -1
  img_proc: true
