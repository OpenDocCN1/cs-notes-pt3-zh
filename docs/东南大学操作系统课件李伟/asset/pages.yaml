    in the system.

    +     - $R = \{R_1, R_2, \ldots, R_m\}$, the set consisting of all resource types
    in the system.

    +   - **request edge** – directed edge $P_i \rightarrow R_j$

    +   - **assignment edge** – directed edge $R_j \rightarrow P_i$'
