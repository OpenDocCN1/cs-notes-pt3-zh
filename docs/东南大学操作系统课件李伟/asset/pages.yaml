- pgno: 391
  md: '# # Semaphore Implementation


    +   - The main disadvantage of the above classical semaphore definition is that
    it requires **busy waiting**. *(while a process is in its critical section, any
    other process that tries to enter its critical section must loop continuously
    in the entry code)*

    +   - This type of semaphore is also called a **spinlock (自旋锁)** because the process
    spins while waiting for the lock.

    +   - To overcome the need for busy waiting, the process can **block itself**
    rather than engaging in busy waiting.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Semaphore Implementation


    +   - Define a semaphore as a record

    +     ```

    +     typedef struct {

    +       int value;

    +       struct process *L; // waiting queue

    +     } semaphore;

    +     ```


    +   - Assume two simple operations:

    +     - block() suspends the process that invokes it.

    +     - wakeup(P) resumes the execution of a blocked process P.'
  merge: -1
  img_proc: true
- pgno: 393
  md: "# # Implementation\n\nSemaphore operations now defined as\n\n```\nwait(S):\n\
    \    S.value--;\n    if (S.value < 0) {\n        add this process to S.L;\n  \
    \      block();\n    }\n\nsignal(S):\n    S.value++;\n    if (S.value <= 0) {\n\
    \        remove a process P from S.L;\n        wakeup(P);\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 394
  md: '# Implementation


    +   - If the semaphore value is negative, its magnitude is the number of processes
    waiting on that semaphore.


