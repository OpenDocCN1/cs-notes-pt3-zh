- pgno: 41
  md: '# Memory Protection


    +   - When executing in kernel mode, the operating system has unrestricted access
    to both kernel and user’s memory.

    +   - The load instructions for the *base* and *limit* registers are privileged
    instructions.'
  merge: -1
