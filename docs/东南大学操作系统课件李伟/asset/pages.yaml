- pgno: 594
  md: '# Basic Page Replacement


    +   - Find the location of the desired page on disk.

    +   - Find a free frame

    +     - If there is a free frame, use it.

    +     - If there is no free frame, use a page replacement algorithm to select
    a victim frame.

    +     - Write the victim frame to the disk and change the page and frame tables.

    +   - Read the desired page into the free frame. Update the page and frame tables.

    +   - Restart the process.'
  merge: -1
  img_proc: true
