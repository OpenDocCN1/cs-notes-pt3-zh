- pgno: 445
  md: '# Deadlock Characterization


    +   - For a deadlock to occur, each of the following four conditions must hold.

    +     - **Mutual exclusion:** only one process at a time can use a resource.

    +     - **Hold and wait (request and hold):** A process must be holding a resource
    and waiting for another.

    +     - **No preemption:** a resource can be released only voluntarily by the
    process holding it, after that process has completed its task.

    +     - **Circular wait:** A waits for B, B waits for C, C waits for A.'
  merge: -1
  img_proc: true
