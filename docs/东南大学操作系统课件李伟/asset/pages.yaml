- pgno: 732
  md: '# The Sun Network File System (NFS)


    +   - An implementation and a specification of a software system for accessing
    remote files across LANs (or WANs)

    +   - The implementation is part of the Solaris and SunOS operating systems running
    on Sun workstations using an unreliable datagram protocol (UDP/IP protocol and
    Ethernet'
  merge: -1
  img_proc: true
- pgno: 733
  md: '# NFS


    +   - Interconnected workstations viewed as a set of independent machines with
    independent file systems, which allows sharing among these file systems in a transparent
    manner

    +     - A remote directory is mounted over a local file system directory

    +       - The mounted directory looks like an integral subtree of the local file
    system, replacing the subtree descending from the local directory'
  merge: -1
  img_proc: true
- pgno: 734
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 735
  md: '# NFS


    +   - NFS is designed to operate in a heterogeneous environment of different machines,
    operating systems, and network architectures; the NFS specifications independent
    of these media

    +   - This independence is achieved through the use of RPC primitives built on
    top of an External Data Representation (XDR) protocol used between two implementation-independent
    interfaces

    +   - The NFS specification distinguishes between the services provided by a mount
    mechanism and the actual remote-file-access services'
  merge: -1
  img_proc: true
