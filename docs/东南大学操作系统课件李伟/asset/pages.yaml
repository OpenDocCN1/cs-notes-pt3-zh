- pgno: 760
  md: '# Disk Scheduling


    +   - **Access time** has two major components

    +     - *Seek time* is the time for the disk are to move the heads to the cylinder
    containing the desired sector.

    +     - *Rotational latency* is the additional time waiting for the disk to rotate
    the desired sector to the disk head.


    +   - **Disk bandwidth**

    +     - the total number of bytes transferred, divided by the total time between
    the first request for service and the completion of the last transfer.'
  merge: -1
  img_proc: true
