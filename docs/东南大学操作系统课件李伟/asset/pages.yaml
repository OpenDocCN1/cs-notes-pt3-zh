- pgno: 504
  md: '# Dynamic Loading


    +   - The size of a process is limited to the size of physical memory.

    +   - Routine is not loaded until it is called

    +   - To use dynamic loading, all routines must be in a relocatable format.

    +   - The main program is loaded and executes.

    +   - When a routine A calls B, A checks to see if B is loaded. If B is not loaded,
    the relocatable linking loader is called to load B and updates the address table.
    Then, control is passed to B.'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# Dynamic Loading


    +   - Better memory-space utilization; unused routine is never loaded.

    +   - Useful when large amounts of code are needed to handle infrequently occurring
    cases.'
  merge: -1
  img_proc: true
- pgno: 506
  md: '# Dynamic Linking


    +   - Both Linking and loading postponed until execution time.

    +   - A *stub* is added to each reference of library routine. A stub is a small
    piece of code that indicates how to locate and load the routine if it is not loaded.

    +   - When a routine is called, its stub is executed. The routine is loaded, the
    address of that routine replaces the stub, and executes the routine.'
  merge: -1
  img_proc: true
- pgno: 507
  md: '# # Swapping


    +   - A process can be *swapped* temporarily out of memory to a **backing store**,
    and then brought back into memory for continued execution.

    +   - **Backing store** – fast disk large enough to accommodate copies of all
    memory images for all users; must provide direct access to these memory images.'
  merge: -1
  img_proc: true
- pgno: 508
  md: '# # Swapping


    +   - **Ready queue** is consisting of all processes **on the backing store or
    in memory** and are ready to run

    +   - Major part of swap time is transfer time; total transfer time is directly
    proportional to the *amount* of memory swapped.'
  merge: -1
