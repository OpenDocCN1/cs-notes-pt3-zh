- pgno: 277
  md: '# CPU Scheduler


    +   - When the CPU is idle, the OS must select another process to run.

    +   - This selection process is carried out by the *short-term scheduler* (or
    *CPU scheduler*).

    +   - The CPU scheduler selects a process from the ready queue, and allocates
    the CPU to it.

    +   - There are many ways to organize the ready queue (e.g. FIFO).'
  merge: -1
  img_proc: true
