- pgno: 442
  md: '# System Model


    +   - **Request**

    +     - If a process makes a request to use a system resource which cannot be
    granted immediately, then the requesting process is blocked until it can acquire
    the resource.

    +   - **Use**

    +     - The process can operate on the resource.

    +   - **Release**

    +     - The process releases the resource.'
  merge: -1
