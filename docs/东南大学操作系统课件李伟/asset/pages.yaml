- pgno: 175
  md: "# Bounded-Buffer – Producer Process\n\n```\nitem nextProduced;\n\nwhile (1)\
    \ {\n    while (((in + 1) % BUFFER_SIZE) == out)\n        ; /* do nothing */\n\
    \    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "# Bounded-Buffer – Consumer Process\n\n```\nitem nextConsumed;\n\nwhile (1)\
    \ {\n    while (in == out)\n        ;/* do nothing */\n    nextConsumed = buffer[out];\n\
    \    out = (out + 1) % BUFFER_SIZE;\n}\n```"
  merge: -1
