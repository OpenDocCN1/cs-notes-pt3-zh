- pgno: 523
  md: '# External Fragmentation Problem


    +   - **External fragmentation problem** exists when there is enough total free
    memory space to satisfy a request, but the available spaces are not contiguous.

    +   - **Solutions**

    +     - Compaction

    +     - Permitting the physical address space of the processes to **be noncontiguous**
    —— Paging and Segmentation'
