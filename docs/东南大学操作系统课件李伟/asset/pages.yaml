  md: '# # Methods for Handling Deadlocks


    +   - Ensure that the system will *never* enter a deadlock state.

    +     - **Prevention:** Ensure one of the four conditions fails.

    +     - **Avoidance:** The OS needs more information so that it can determine
    if the current request can be satisfied or delayed.


    +   - Allow the system to enter a deadlock state, detect it, and recover.


    +   - Ignore the problem and pretend that deadlocks never occur in the system'
