- pgno: 49
  md: '# Multiprogramming Batch Systems


    Several jobs are kept in main memory at the same time, and the CPU is multiplexed
    among them.


    +   - Keeps serval jobs in memory simultaneously

    +   - Picks and begins to execute one

    +   - If that job needs to wait, CPU is switched to another one


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_49_0.png)


    It’s the first instance where the operating system must make decisions for the
    users'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# OS Features Needed for Multiprogramming


    +   - **Memory management** – the system must allocate the memory to several jobs.

    +   - **CPU scheduling** – the system must choose among several ready jobs to
    run.

    +   - **Job scheduling** – the system must choose among ready jobs to be brought
    into memory.

    +   - Allocation of devices and I/O routine supplied by the system.'
  merge: -1
  img_proc: true
