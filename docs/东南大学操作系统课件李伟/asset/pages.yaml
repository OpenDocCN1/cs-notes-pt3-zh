- pgno: 286
  md: '# Scheduling Criteria


    +   - There are many criteria for comparing different scheduling algorithms.

    +   - Here are five common ones:

    +     - CPU utilization (CPU利用率)

    +     - Throughput (吞吐量)

    +     - Turnaround time (周转时间)

    +     - Waiting time (等待时间)

    +     - Response time (响应时间)'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# CPU Utilization


    +   - We want to keep the CPU as busy as possible.


    +   - CPU utilization ranges from 0 to 100 percent.


    +   - Normally 40% or lower is lightly loaded and 90% or higher is heavily loaded.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Throughput


    +   - The number of processes completed per time unit is called **_throughput_**.

    +   - Higher throughput means more jobs get done.

    +   - However, for long processes, this rate may be one job per hour, and, for
    short jobs, this rate may be 10 per minute.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# # Turnaround Time


    +   - The time period from job submission to completion is the **turnaround time**.

    +   - From a user’s point of view, turnaround time is more important than CPU
    utilization and throughput.

    +   - Turnaround time is the sum of

    +     - waiting time before entering the system

    +     - waiting time in the ready queue

    +     - waiting time in all other events (e.g., I/O)

    +     - time the process actually running on the CPU'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# # Waiting Time


    +   - **Waiting time** is the sum of the periods that a process spends waiting
    in the **ready queue**.

    +   - **Why only ready queue?**

    +     - CPU scheduling algorithms do not affect the amount of time during which
    a process executes or does I/O.

    +     - However, CPU scheduling algorithms do affect the time that a process stays
    in the ready queue'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# # Response Time


    +   - The time from the submission of a request (in an interactive system) to
    the first response is called **response time**. It **does not** include the time
    that it takes to output the response.

    +   - For example, in front of your workstation, you perhaps care more about the
    time between hitting the **Return** key and getting your first output than the
    time from hitting the **Return** key to the completion of your program (e.g.,
    turnaround time).'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Optimization Criteria


    +   - Max CPU utilization

    +   - Max throughput

    +   - Min turnaround time

    +   - Min waiting time

    +   - Min response time


    In most cases, we optimize the average value.

    However, under some cases, it is desirable to optimize the minimum or maximum
    values rather than the average.'
  merge: -1
