- pgno: 635
  md: '# Other Issues -- Prepaging


    +   - Prepaging

    +     - To reduce the large number of page faults that occurs at process startup

    +     - Prepaging all or some of the pages a process will need, before they are
    referenced

    +     - But if prepaged pages are unused, I/O and memory was wasted

    +     - Assume s pages are prepaged and α of the pages is used

    +       - Is cost of s * α save pages faults > or < the cost of prepaging s *
    (1- α) unnecessary pages?

    +       - α near zero ⇒ prepaging loses'
  merge: -1
  img_proc: true
- pgno: 636
  md: '# Other Issues – Page Size


    +   - Page size selection must take into consideration

    +     - fragmentation

    +     - table size

    +     - I/O overhead

    +     - locality'
  merge: -1
  img_proc: true
- pgno: 637
  md: '# Other Issues – TLB Reach


    +   - TLB Reach - The amount of memory accessible from the TLB

    +   - TLB Reach = (TLB Size) X (Page Size)

    +   - Ideally, the working set of each process is stored in the TLB

    +     - Otherwise there is a high degree of page faults

    +   - Increase the Page Size

    +   - Provide Multiple Page Sizes

    +     - This allows applications that require larger page sizes the opportunity
    to use them without an increase in fragmentation'
  merge: -1
  img_proc: true
- pgno: 638
  md: '# Other Issues – Program Structure


    +   - Program structure

    +     - int A[][] = new int[1024][1024];

    +     - Each row is stored in one page

    +     - Program 1

    +       for (j = 0; j < A.length; j++)

    +       for (i = 0; i < A.length; i++)

    +       A[i,j] = 0;

    +       1024 x 1024 page faults

    +     - Program 2

    +       for (i = 0; i < A.length; i++)

    +       for (j = 0; j < A.length; j++)

    +       A[i,j] = 0;

    +     - 1024 page faults'
  merge: -1
  img_proc: true
- pgno: 639
  md: '# Other Issues – I/O interlock


    +   - I/O Interlock – Pages must sometimes be locked into memory

    +   - Consider I/O - Pages that are used for copying a file from a device must
    be locked from being selected for eviction by a page replacement algorithm'
  merge: -1
  img_proc: true
