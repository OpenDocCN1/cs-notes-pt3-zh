- pgno: 526
  md: '# Paging


    +   - Physical address space of a process can be **noncontiguous**; process is
    allocated physical memory whenever the latter is available.

    +   - Divide physical memory into fixed-sized blocks called **frames(帧)** (size
    is power of 2, between 512 bytes and 16M bytes).

    +   - Divide logical memory into blocks of same size called **pages(页)**.'
  merge: -1
  img_proc: true
- pgno: 527
  md: '# Paging


    +   - Keep track of all free frames.

    +   - To run a program of size *n* pages, need to find *n* free frames and load
    program.

    +   - Set up a page table to translate logical to physical addresses.

    +   - Still have Internal Fragmentation.'
  merge: -1
  img_proc: true
- pgno: 528
  md: '# Address Translation Scheme


    +   - **Address generated by CPU is divided into:**

    +     - *Page number (p)* – used as an index into a *page table* which contains
    base address of each page in physical memory.

    +     - *Page offset (d)* – combined with base address to define the physical
    memory address that is sent to the memory unit.'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# # Address Translation Scheme


    +   - For given logical address space $2^m$ and page size $2^n$


    | page number | page offset |

    |:---:|:---:|

    | $p$ | $d$ |

    | $m-n$ | $n$ |'
