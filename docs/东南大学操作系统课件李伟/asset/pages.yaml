- pgno: 298
  md: '# # FCFS Problems


    +   - It is easy to have the *convoy effect*: all the processes wait for the one
    big process to get off the CPU. **The utilization of CPU and Device may be low.**
    *Why?*


    +   - It is in favor of long processes and may not be fair to those short ones.
    What if your 1-minute job is behind a 10-hour job?


    +   - It is troublesome for *time-sharing systems*, where each user needs to get
    a share of the CPU at regular intervals.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Shortest-Job-First (SJF) Scheduling


    +   - Associate each process with **the length of its next CPU burst**.


    +   - When a process must be selected from the ready queue, the process with the
    smallest next CPU burst is selected.


    +   - Thus, the processes in the ready queue are sorted in next CPU burst length.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Shortest-Job-First (SJF) Scheduling


    +   - SJF can be nonpreemptive or preemptive.

    +     - nonpreemptive – once CPU given to the process it cannot be preempted until
    completes its CPU burst.

    +     - preemptive – if a new process arrives with CPU burst length less than
    remaining time of current executing process, preempt. This scheme is know as the
    Shortest-Remaining-Time-First.

    +   - SJF is optimal – gets minimum average waiting time for a given set of processes.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# SJF is provably optimal


    +   - Every time we make a short job before a long job, we reduce average waiting
    time.

    +   - We may switch out of order jobs until all jobs are in order.

    +   - If the jobs are sorted, job switching is impossible.


    A waits 0

    B waits a

    a

    A

    B

    average = a/2


    B waits 0

    A waits b

    b

    a

    B

    A

    average = b/2'
