- pgno: 482
  md: "# Detection Algorithm\n\n3. *Work* = *Work* + *Allocation*ᵢ  \n   *Finish*[i]\
    \ = true  \n   go to step 2.\n\n4. If *Finish*[i] == false, for some i, 1 ≤ i\
    \ ≤ n,  \n   then the system is in deadlock state.  \n   Moreover, if *Finish*[i]\
    \ == false, then Pᵢ is  \n   deadlocked."
