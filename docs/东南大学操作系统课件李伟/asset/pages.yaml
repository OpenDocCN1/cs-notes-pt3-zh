- pgno: 704
  md: '# Extent-Based Systems


    +   - Many newer file systems (I.e. Veritas File System) use a modified contiguous
    allocation scheme.

    +   - Extent-based file systems allocate disk blocks in extents.

    +   - An extent is a contiguous block of disks.

    +     - Extents are allocated for file allocation.

    +     - A file consists of one or more extents.'
  merge: -1
  img_proc: true
- pgno: 705
  md: '# Linked Allocation


    +   - Each file is a linked list of disk blocks

    +   - Blocks may be scattered anywhere on the disk.


    ![](img/0f9477f9dd9e571abf0b2ce4550a9e88_705_0.png)'
  merge: -1
  img_proc: true
- pgno: 706
  md: '# Linked Allocation


    +   - Simple – need only starting address and end address

    +   - Free-space management system – no waste of space

    +   - Files can grow

    +   - No random access

    +   - Each block contains a pointer, wasting space

    +   - Blocks scatter everywhere and a large number of disk seeks may be necessary

    +   - Reliability: what if a pointer is lost or damaged?'
  merge: -1
  img_proc: true
