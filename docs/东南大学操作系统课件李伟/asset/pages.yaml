- pgno: 354
  md: "# Bounded-Buffer\n\n+   - Shared data\n\n```\n#define BUFFER_SIZE 10\ntypedef\
    \ struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\nint in = 0;\nint out\
    \ = 0;\nint counter = 0;\n```"
  merge: -1
  img_proc: true
- pgno: 355
  md: "# Bounded-Buffer\n\n+   - Producer process\n\n```\nitem nextProduced;\nwhile\
    \ (1) {\n    while (counter == BUFFER_SIZE);\n        /* do nothing */\n    buffer[in]\
    \ = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n    counter++;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 356
  md: "# # Bounded-Buffer\n\n+   - **Consumer process**\n\n```\nitem nextConsumed;\n\
    while (1) {\n    while (counter == 0);\n        /* do nothing */\n    nextConsumed\
    \ = buffer[out];\n    out = (out + 1) % BUFFER_SIZE;\n    counter--;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Bounded-Buffer


    +   - **The statements**

    +     - `counter++;`

    +     - `counter--;`

    +     - must be performed *atomically*.


    +   - Atomic operation means an operation that completes in its entirety without
    interruption.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# # Bounded-Buffer


    +   - The statement “**count++**” may be implemented in machine language as:

    +     - **register₁ = counter**

    +     - **register₁ = register₁ + 1**

    +     - **counter = register₁**

    +   - The statement “**count--**” may be implemented as:

    +     - **register₂ = counter**

    +     - **register₂ = register₂ − 1**

    +     - **counter = register₂**'
  merge: -1
  img_proc: true
