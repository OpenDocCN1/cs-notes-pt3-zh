- pgno: 279
  md: '# Circumstances that scheduling may take place


    +   - A process switches from the **running** state to the **terminated** state.

    +   - A process switches from the **running** state to the **wait** state (*e.g.*,
    doing for I/O).

    +   - A process switches from the **running** state to the **ready** state (*e.g.*,
    an **interrupt** occurs).

    +   - A process switches from the **wait** state to the **ready** state (*e.g.*,
    I/O completion).'
  merge: -1
  img_proc: true
