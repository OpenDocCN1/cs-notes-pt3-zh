- pgno: 151
  md: '# # Schedulers


    +   - **Long-term scheduler** (or job scheduler) – selects which processes should
    be loaded into memory for execution.

    +   - **Short-term scheduler** (or CPU scheduler) – selects which process should
    be executed next and allocates CPU.

    +   - **Medium-term scheduler** – remove processes from memory and reintroduce
    them into memory later (**swapping**).'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Schedulers


    +   - Short-term scheduler is invoked very frequently (milliseconds) ⇒ (must be
    fast).

    +   - Long-term scheduler is invoked very infrequently (seconds, minutes) ⇒ (may
    be slow).

    +   - The long-term scheduler controls the *degree of multiprogramming* (the number
    of processes in memory).'
