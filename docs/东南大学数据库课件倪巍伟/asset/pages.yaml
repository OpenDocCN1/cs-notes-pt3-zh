- pgno: 392
  md: '关键在于建立一个供连接用的散列文件。


    建立散列文件需要对R、S各扫描一次，且关系R和S一般不会对连接属性进行簇集。故而，每向散列文件加入一个元组，都需要一次I/O操作。


    如何减少I/O次数？


    可以在桶（散列文件）中不填入R、S的实际元组，而是代之以元组的tid，从而大大的缩小散列文件，使其有可能在内存中建立，而仅需对R、S各扫描一次。'
  merge: -1
  img_proc: true
