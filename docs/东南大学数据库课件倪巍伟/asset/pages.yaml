- pgno: 270
  md: '# 4.1 DBMS结构简介


    数据库管理系统（DBMS）是数据库系统的核心，它对数据库系统的功能和性能有决定性影响。DBMS最基本的功能是正确、安全、可靠地执行数据库语言语句。图4-1表示一个解释执行的DBMS的结构，可以从中了解DBMS的一般工作原理和主要组成部分。与高级程序设计语言一样，DBMS有两种实现方法——编译和解释。'
  merge: -1
