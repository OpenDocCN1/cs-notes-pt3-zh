- pgno: 310
  md: '# 5.2.3 物理块在磁盘上的分配


    早期的DBMS中，通常由操作系统分配数据库所需的物理块，逻辑上相邻的数据可能被分散到磁盘的不同区域。使得访问数据时，性能下降。


    现代DBMS中，都改由DBMS初始化时向操作系统一次性的申请所需的存储空间。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 1、连续分配法（contiguous allocation）


    将一个文件的块分配在磁盘的连续空间上，块的次序就是其存储的次序，有利于顺序存取多块文件，不利于文件的扩充。


    # 2、链接分配法（linked allocation）


    物理块未必分配在磁盘的连续存储空间上，各物理块用指针链接，有利于文件的扩展，但效率较差。'
  merge: -1
  img_proc: true
- pgno: 312
  md: '3、簇集分配法（clustered allocation）

    上述两种方法的结合。


    4、索引分配法（indexed allocation）

    每个文件有一个逻辑块号与其物理块地址对照的索引。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 数据压缩技术


