- pgno: 558
  md: '比起BCNF的定义，3NF放松了一个限制，即如果A是主属性，则允许其决定子不含键。因此，一个关系属于BCNF，一定属于3NF，BCNF是3NF的特例。


    从3NF的定义可知，X→A违反3NF的定义可分为下面两种情况：


