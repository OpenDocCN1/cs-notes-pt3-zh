- pgno: 537
  md: 关系分解还带来保持依赖的问题。不满足保持依赖条件，并不意味着某些函数依赖真正丢失了，而是某些函数依赖的有关属性分散在不同的关系中，不能被F的所有投影所蕴涵。不同关系的属性间的函数依赖关系并不是不可能存在的，问题在于这种函数依赖所代表的语义约束不如在一个关系中容易检查，一般须在检查前对有关的关系统一次连接运算。此外，不保持依赖还会引起一些更新异常，这可以通过下面的例子说明。
