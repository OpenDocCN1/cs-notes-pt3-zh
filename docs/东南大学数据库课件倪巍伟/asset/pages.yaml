  md: '+   - 适于访问全部或相当多的记录，对于其它类访问效率较低。（设文件记录数为N，查找某一记录的平均访问次数为N+1/2）

    +   - 若堆文件的记录按检索属性排序，可用二分查找法。（但要以排序为代价）'
