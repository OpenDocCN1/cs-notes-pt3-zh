- pgno: 395
  md: '# 连接方法的启发式规则


    +   1）两个关系都已按连接属性排序，则优先用排序归并法；两个关系中已有 一个关系按连接属性排序，另一个关系较小，也可先对未排序关系按连接属性排序，再用排序归并法。


    +   2）两个关系中有一个关系在连接属性上有索引（特别是簇集索引）或散列，可以另一关系为外关系，顺序扫描，并利用内关系上的索引或散列寻找其匹配元组，以代替多遍扫描。


    +   3）不具备上述条件且关系较小，可用嵌套循环法。


    +   4）不具备1，2，3规则，可用散列连接法。'
  merge: -1
