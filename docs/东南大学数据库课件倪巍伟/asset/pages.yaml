  md: '# 有三种外连接：


    +   - 左外连接，连接结果中，只保留左关系的所有元组；

    +   - 右外连接，连接结果中，只保留右关系的所有元组；

    +   - 全外连接，连接结果中，保留左右关系的所有元组；'
  merge: -1
