- pgno: 549
  md: '下面介绍保持依赖的检验方法。


    # 算法10-3 检验一个分解是否保持依赖。


    输入：分解 ρ = {R₁, R₂, ⋯, Rₖ} 和函数依赖集F。


    输出：ρ 是否保持F。


    方法：令G = ∪ ΠUi（F）。


    为了检验G是否覆盖F，可对F中的每一函数依赖 X→Y 进行下列检查。


    计算X关于G的闭包X⁺，并且检查Y是否包含在X⁺中。为了计算X⁺，不必求出G，可以分别地、反复地计算ΠUi（F）对X所增加的属性。'
  merge: -1
  img_proc: true
- pgno: 550
  md: "这可以用下面的算法：\n\n```\nZ := X\nWHILE Z 有改变 DO\n    FOR i = 1 to k do\n        Z\
    \ := Z ∪ ((Z ∩ Uᵢ)⁺ ∩ Uᵢ)\n```\n\nZ ∩ Uᵢ 是 Z 中与 Rᵢ 有关的属性。（Z ∩ Uᵢ）⁺ 是 Z ∩ Uᵢ 关于\
    \ F 的闭包。（Z ∩ Uᵢ）⁺ ∩ Uᵢ 是 Πᵤᵢ(F) 对 X⁺ 所增加的属性。经反复计算，直至 Z 不变为止。最终的 Z 就是 X 关于 G 的闭包\
    \ X⁺。如果 Y 是 X⁺ 子集，则 X → Y ∈ G⁺。\n\n如果对 F 中的所有函数依赖经检查都属于 G⁺，则 ρ 保持依赖，否则 ρ 不保持依赖。"
  merge: -1
  img_proc: true
