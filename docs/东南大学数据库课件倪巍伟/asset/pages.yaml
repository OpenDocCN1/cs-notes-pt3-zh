- pgno: 79
  md: '# 约束


    +   (1) 一个记录型不能兼任同一系的首记录和属记录；

    +   (2) 一个记录不能出现在同一系型的多个系值中；

    +   (3) 插入一个新记录时，若它的记录型是某个系的属记录，必须考虑系籍问题（两种系籍约束）：


    +   AUTOMATIC(自动的)： 新的属记录插入时自动加入相应的系值；

    +   MANUAL(人工的)： 新的属记录插入时不自动加入相应的系值；'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# （4）对已插入的属记录的系籍问题；


    # 网状数据模型提供三种留置系籍约束：


    +   - OPTIMAL(随意的)：对属记录的系籍处理比较随意，属记录可以脱离某个系值独立存在，例如，“系——学生”系；

    +   - MANDATORY(强制的)：属记录不能游离于系值之外，但可以转系值。例如，“部门——职工”系；

    +   - FIXED(固定的)：不能游离，不能转系值，例如，“职工——家属”系。


    上述系籍约束都是语义约束。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '（5）删除记录时，删除首记录，没有系籍问题；删除属记录要按照（4）进行处理。


    +   - **OPTIMAL**\n  首记录可以删除，其属记录与系值脱离，仍保留在数据库中；\n- **MANDATORY**\n  首记录不能删除，因为其属记录不能游离于系值之外；\n-
    **FIXED**\n  可将首记录连同属记录一起删除。'
  merge: -1
  img_proc: true
