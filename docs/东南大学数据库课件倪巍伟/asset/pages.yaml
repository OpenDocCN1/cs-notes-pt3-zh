- pgno: 263
  md: '# WITH RECURSIVE PATH(x, y) AS


    ```

    /*通过递归定义临时视图PATH(x, y)*/

    ((SELECT * FROM ARC)

    UNION

    (SELECT PATH. x, ARC. y FROM PATH, ARC

    WHERE PATH. y=ARC. x))

    ```


    PATH出现在PATH定义中，属于递归定义


    PATH初始为空，递归到PATH无变化为止'
