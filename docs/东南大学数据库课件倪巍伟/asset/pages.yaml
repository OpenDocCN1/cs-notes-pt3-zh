- pgno: 140
  md: '# （5）连接（实际指自然连接）


    设有两个关系模式 R(ABC) 和 S(CDE)，r、s 分别为其值：


    ```

    R∞S = {t (ABCDE) | t[ABC]∈R and t[CDE]∈S}

    ```


    注意：谓词中两个 t[C] 同值，隐含等连接。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '用谓词演算表示关系操作时，只有结果是有限集才有意义。

    一个表达式的结果如果是有限的，称此表达式是安全的，否则是不安全的。

    否定常常会导致不安全的表达式，例如

    {t | ¬(t∈STUDENT)}是不安全的。'
  merge: -1
  img_proc: true
- pgno: 142
  md: '若限制取值的域，使 $t\in DOM(P)$，可将上式改写成

    \[

    \{t\mid t\in DOM(P)\text{ and }\neg(t\in STUDENT)\}=DOM(P)-STUDENT，

    \]

    成为安全表达式。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 2.3.5 域关系演算


    域关系演算是以域为变量，一般形式为：

    { <X₁, X₂, ......Xₙ> | P(X₁, X₂, ......Xₙ, Xₙ₊₁, ......, Xₙ₊ₘ) }


    其中：X₁, X₂, ......Xₙ, Xₙ₊₁, ......, Xₙ₊ₘ为域变量。且X₁, X₂, ......Xₙ出现在结果中，其它m个域变量不出现在结果中，但出现在谓词P中。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '对关系GRADE（学号，课程号，成绩），如果要查询须补考的学生的学号和补考的课程号，此时查询表达式：


    ```

    {<x, y> | (∃z) (GRADE(x, y, z) AND z<60)}

    ```


    GRADE(x, y, z)是一个谓词，如果 <x, y, z> 是GRADE中的一个元组，则该谓词为真。


    与元组变量不同的是域变量的变化范围是某个值域而不是一个关系。'
