- pgno: 526
  md: '定义10-8 函数依赖集F如果满足下列条件，则称为极小函数依赖集或最小覆盖。

    (1)F中每个函数依赖的右部为单属性。

    (2)F中不存在这样的函数依赖X→A，使得F−{X→A}与F等价。

    (3)在F中也不存在这样的X→A，使得F−{X→A}∪{Z→A}与F等价，式中，Z为X的子集。

