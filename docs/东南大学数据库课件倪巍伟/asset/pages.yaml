- pgno: 190
  md: '# 4. 撤销主键定义


    一般情况下，一个基表如果已定义了主键，则系统会在主键上自动建立索引。当插入新行时，系统会进行主键唯一性检查，这样，当进行大量的插入操作时，势必影响系统效率。


    下面命令暂时撤销主键。


    ```

    ALTER TABLE ＜表名＞

    DROP PRIMARY KEY ;

    ```'
  merge: -1
  img_proc: true
- pgno: 191
  md: "# 5. 补充定义外键\n\n```\nALTER TABLE ＜表名-1＞\n  ADD FOREIGN KEY [＜外键名＞] (＜列名表＞)\n\
    \    REFERENCES  ＜表名-2＞\n    [ON DELETE { RESTRICT | CASCADE\n    | SET NULL }];\n\
    ```\n\n花括号表示三项中任选一项。有横线表示缺省项。"
  merge: -1
  img_proc: true
- pgno: 192
  md: "# 6. 撤消外键定义\n\n由于定义外键后，须作引用完整性检查，这会影响系统性能，因此，SQL提供了撤消外键的命令，必要时可暂时撤消。\n\n```\n\
    ALTER TABLE <表名>\n    DROP <外键名>;\n```"
  merge: -1
