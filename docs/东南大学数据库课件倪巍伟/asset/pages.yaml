- pgno: 332
  md: '# 非稠密索引与稠密索引


    +   1. 不为每个键值设立索引项的索引——非稠密索引

    +   2. 可以节省索引的存储空间，代价是文件要按索引键排序

    +   3. 对一个文件，只能为一个索引键（一般为主键）建立非稠密索引（为什么？）'
  merge: -1
  img_proc: true
- pgno: 333
  md: '+   4. 非稠密索引中，若干个记录组成一个单元存储区，单元存储区中的记录按索引键排序。


    +   5. 单元存储区装满后，可向溢出区溢出（用指针指向溢出区），但溢出太多时，指针链接次数增加，将导致数据库性能下降。


    +   6. 可以建立多级非稠密索引（通常最高一级索引应尽量保证可以常驻内存）。'
  merge: -1
  img_proc: true
