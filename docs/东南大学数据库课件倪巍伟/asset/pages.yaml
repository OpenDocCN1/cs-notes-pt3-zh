- pgno: 134
  md: '# 2.3.4 关系演算（relational calculus）


    +   - 用关系代数表示的操作，需标明关系操作的序列，因而以关系代数为基础的DB语言是过程性语言（procedural language）。

    +   - 用谓词演算来表达关系的操作称为关系演算。用关系演算表示关系的操作，只要说明所要得到的结果，而不必标明操作的过程，因而以关系演算为基础的数据库语言是说明性语言（declarative
    language）。

    +   - 目前，面向用户的关系数据库语言基本上都以关系演算为基础。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '关系代数表示关系的操作，用户必须指出运算方法步骤，而关系演算用谓词公式表示查询条件，指出“做什么”，而“怎么做”则由系统去完成。


    以关系代数为基础的数据库语言是过程性语言，以关系演算为基础的数据库语言是说明性语言。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '根据所用变量不同，关系演算分为：


    +   - 元组关系演算

    +   - 域关系演算'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 1. 元组关系演算


    以元组为变量。一般形式为：


    \{t[〈属性表〉]|P(t)\}


    其中：t是元组变量，既可以用整个t作为查询对象，也可查询t中的某些属性。如查询整个t，则可省去〈属性表〉。P(t)是t应满足的谓词。


    利用元组关系演算，可以表示关系代数操作，因此，元组演算与关系代数具有同等表达能力，是关系完备的。'
  merge: -1
  img_proc: true
