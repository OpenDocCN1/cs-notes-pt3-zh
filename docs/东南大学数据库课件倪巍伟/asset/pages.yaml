- pgno: 104
  md: '由于仓库号是仓库关系的关键字，同时是职工关系的外关系的外关键字。在定义职工关系的仓库号字段时，只要说明外部关键字约束：


    ```

    仓库号 CHAR (4) NOT NULL REFERENCES 仓库 (仓库号)

    ```


    有了以上的约束，系统就会自动检查相应的父记录是否存在，从而保证数据的引用完整性。'
