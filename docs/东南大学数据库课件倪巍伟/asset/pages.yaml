- pgno: 125
  md: '# 除操作


    双目运算（二元），用“÷”表示。

    设有关系 R（X，Y）和 S（Y），X、Y为属性组，S（Y）≠Φ，则


    $$R-S=\Pi_X(R)-\Pi_X((\Pi_X(R)\times S)-R)$$


    +   - 可能有R不含空组

    +   - R中相应值集合不能包含S(Y)的X值集合

    +   - R中相应Y值集合能包含S(Y)的Y值集合


    R−(R÷S)×S可以看成“余数”。'
  merge: -1
  img_proc: true
