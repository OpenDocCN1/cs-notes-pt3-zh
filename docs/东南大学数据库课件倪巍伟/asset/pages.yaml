- pgno: 525
  md: '定义10-7　设F，G为两个函数依赖集，如果F⁺=G⁺，则称F和G是等价的，也可称F覆盖（cover）G，或G覆盖F；也可说F和G互相覆盖。


    引理10-4　F=G的充分必要条件是F⊆G⁺且G⊆F⁺。


    引理10-5　任一函数依赖集F总可以为一右部恰为单属性的函数依赖集所覆盖。'
