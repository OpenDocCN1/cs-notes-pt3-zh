- pgno: 250
  md: '# 视图的内容是静态的，还是动态的？


    注意：视图对应的内容总是实时、最新的内容，并不是视图定义时对应内容。这是由于基表随着更新操作其内容在不断变化，所以视图对应的内容也在不断变化。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '视图的查询可像基表一样参与数据库操作，但视图的更新则最终落实到有关基表的更新。


    通常情况下，由连接定义的视图是不可更新的。但如果连接定义的视图所涉及到的几个基表的主键都在视图中时，还是可以更新的。（见例3-18）'
  merge: -1
  img_proc: true
- pgno: 252
  md: '此外，视图更新还会存在一些语义上的问题。


    例如：由基表COURSE定义一个春季所开课程的视图SPRING如下：


    ```

    CREATE VIEW SPRING

    AS SELECT CNO, LHOUR, CREDIT

    FROM COURSE

    WHERE SEMESTER= ‘春’ ;

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: '该视图的元组虽与基表COURSE的元组存在一一对应关系，但若在视图中删除一个元组，如：


    ```

    DELETE FROM SPRING WHERE CNO= ‘CS-20’ ;

    ```'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 这里存在一个语义问题：


    是CS-20课程从春季开出改为秋季开出？还是CS-20课程要撤消？


    若为前者，应修改基表的SEMESTER列，而不是删除‘CNO=CS-20’的元组；


    若为后者，才必须删除‘CNO=CS-20’的元组。'
  merge: -1
  img_proc: true
- pgno: 255
  md: '因此，视图更新是一个较复杂的问题。通常都可以限制：


    +   - 由一个基表定义的视图，只有含有基表的主键或候补键，并且视图中没有用表达式或函数定义的属性，才允许更新。

    +   - 由多表连接所定义的视图不允许更新。

    +   - 定义中用到GROUP BY子句或聚集函数的视图不允许更新。'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 视图的优点：


    （1）视图提供了逻辑数据独立性。


    在数据的整体结构或存储结构发生改变，并且这些改变与用户无关，那么原有的应用程序不必修改；当这些改变与用户有关时，也只要修改视图，至于应用程序仍可不改动或只需做少量改动。'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# （2）简化了用户观点。


    数据库的全部结构是复杂的、并有多种联系。一般用户只要用到数据库中一部分数据，而视图机制正好适应了用户的需要。视图是一个SELECT语句定义的，用户只需关心视图的内容，而不必关心构成视图的若干关系的联接、投影操作。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# （3）数据的安全保护功能。


