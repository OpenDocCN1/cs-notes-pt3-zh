- pgno: 10
  md: '# DBMS的主要功能


    +   - 提供高级的用户接口

    +   - 查询处理和优化

    +   - 数据目录管理

    +   - 并发控制

    +   - 恢复功能

    +   - 完整性约束检查

    +   - 访问控制'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 1. 硬件平台及数据库


    由于数据库系统数据量都很大，加之DBMS丰富的功 能使得自身的规模也很大，因此，整个数据库系统对硬件资源提出了较高的要求，这些要求是：


    +   (1) 要有足够大的内存，存放操作系统、DBMS的核心模块、数据缓冲区和应用程序。


    +   (2) 有足够大的磁盘等直接存取设备存放数据库和备份数据。


    +   (3) 要求系统有较高的通道能力，以提高数据传送率。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 2、软件


    数据库系统的软件主要包括：


    +   (1) DBMS。DBMS是为数据库的建立、使用和维护配置的软件。\n(2) 支持DBMS运行的操作系统。\n(3) 具有数据库接口的高级语言及其编译系统，便于开发应用程序。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '（4）以DBMS为核心的**应用开发工具**。应用开发工具是系统为应用开发人员和最终用户提供的高效率、多功能的应用生成器、第四代语言等各种软件工具。它们为数据库系统的开发和应用提供了良好的环境。


    （5）为特定应用环境开发的**数据库应用系统**。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 3. 人员


    开发、管理和使用数据库系统的人员主要是：数据库管理员、系统分析员和数据库设计人员、应用程序员和最终用户。不同的人员涉及不同的数据抽象级别，具有不同的数据视图，有各自的职责。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '（1）数据库管理员（DataBase Administrator，DBA）


    具体职责包括：


    +   1. 决定数据库中的信息内容和结构

    +   2. 决定数据库的存储结构和存取策略

    +   3. 定义数据的安全性要求和完整性约束条件

    +   4. 监控数据库的使用和运行'
  merge: -1
  img_proc: true
- pgno: 16
  md: '另外，在数据运行过程中，大量数据不断插入、删除、修改，时间一长，会影响系统的性能。因此，DBA要定期对数据库进行重组织，以提高系统的性能。


    当用户的需求增加或者改变时，DBA还要对数据库进行较大的改造，包括修改部分设计，即数据库的重构造。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# (2)系统分析员和数据库设计人员


    系统分析员负责应用系统的需求分析和规范说明，要和用户及DBA相结合，确定系统的软硬件配置，并参与数据库系统的概要设计。


    数据库设计人员负责数据库中数据的确定、数据库各级模式的设计。数据库设计人员必须参加用户需求调查和系统分析，然后进行数据库设计。在很多情况下，数据库设计人员就由数据库管理员担任。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# (3) 应用程序员


    应用程序员负责设计和编写应用系统的程序模块，并进行调试和安装。


    # (4) 用户


    这里用户是指最终用户 (EndUser)。最终用户通过应用系统的用户接口使用数据库。常用的接口方式有浏览器、菜单驱动、表格操作、图形显示、报表书写等。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.3 数据、数据模型和数据模式


    对事物描述的符号记录称为数据。


    数据是信息存在的一种形式，只有通过解释或处理才能成为有用的信息。


    模型，特别是具体的实物模型，人们并不陌生。例如，一张地图，一组建筑设计沙盘，一架精致的航模飞机，都是具体的模型。一眼望去，就会使人联想到真实生活中的事物。模型是现实世界特征的模拟和抽象。数据模型(DataModel)也是一种模型，它是现实世界数据特征的抽象。'
  merge: -1
  img_proc: true
- pgno: 20
  md: 数据库是某个企业、组织或部门所涉及的数据的综合，它不仅要反映数据本身的内容，而且要反映数据之间的联系。由于计算机不可能直接处理现实世界中的具体事物，所以人们必须事先把具体事物转换成计算机能够处理的数据。在数据库中用数据模型这个工具来抽象、表示和处理现实世界中的数据和信息。通常地讲数据模型就是现实世界的模拟。
  merge: -1
  img_proc: true
- pgno: 21
  md: '现有的数据库系统均是基于某种数据模型的。因此，了解数据模型的基本概念是学习数据库的基础。


    # 数据模型应满足三方面要求：


    +   一是能比较真实地模拟现实世界；

    +   二是容易为人所理解；

    +   三是便于在计算机上实现。


    一种数据模型要很好地满足这三方面的要求在目前还很困难。在数据库系统中针对不同的使用对象和应用目的，采用不同的数据模型。'
  merge: -1
  img_proc: true
- pgno: 22
  md: 不同的数据模型实际上是提供给我们模型化数据和信息的不同工具。
  merge: -1
  img_proc: true
- pgno: 23
  md: '数据模型是数据库系统的核心和基础。各种机器上实现的DBMS软件都是基于某种数据模型的。


    为了把现实世界中的具体事物抽象、组织为某一DBMS支持的数据模型，人们常常首先将现实世界抽象为信息世界，然后将信息世界转换为机器世界。'
  merge: -1
  img_proc: true
- pgno: 24
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 数据模型的组成要素


    一般地讲，数据模型是严格定义的一组概念的集合。这些概念精确地描述了系统的静态特性、动态特性和完整性约束条件。因此数据模型通常由数据结构、数据操作和完整性约束三部分组成。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1. 数据结构


    数据结构是所研究的对象类型的集合。这些对象是数据库的组成成分，它们包括两类：


    一类是与数据类型、内容、性质有关的对象，例如网状模型中的数据项、记录，关系模型中的域、属性、关系等；


    一类是与数据之间联系有关的对象，例如网状模型中的系型(Set type)。'
  merge: -1
  img_proc: true
- pgno: 27
  md: 数据结构是刻画一个数据模型性质最重要的方面，是对系统静态特性的描述。因此，在数据库系统中，通常按照其数据结构的类型来命名数据模型。例如层次结构、网状结构和关系结构的数据模型分别命名为层次模型、网状模型和关系模型。
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 2. 数据操作


    数据操作是指对数据库中各种对象(型)的实例(值)允许执行的操作的集合，包括操作及有关的操作规则。


    数据库主要有检索和更新(包括插入、删除、修改)两大类操作。数据模型必须定义这些操作的确切含义、操作符号、操作规则(如优先级)以及实现操作的语言。


    数据操作是对系统动态特性的描述。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 3. 数据的约束条件


    数据的约束条件是一组完整性规则的集合。完整性规则是给定的数据模型中数据及其联系所具有的制约和依存规则，用以限定符合数据模型的数据库状态以及状态的变化，以保证数据的正确、有效、相容。'
  merge: -1
  img_proc: true
- pgno: 30
  md: 数据模型是用来描述现实世界的，因此，\n越自然越好（易于理解）。
  merge: -1
  img_proc: true
- pgno: 31
  md: "在数据库中，针对不同的使用对象和应用目的，采用多级数据模型，一般可分为三级：\n\n+   1. **概念数据模型（与DBMS无关）**\n+   \n\
    +   主要用来描述一个单位的概念化结构，面向用户、面向现实世界，是一种语义模型，常用E-R图表示，接近人的思维，容易理解。\n+   \n+   2. **逻辑数据模型（与DBMS有关）**\n\
    +   \n+   用概念数据模型表示的数据必须转化为逻辑数据模型表示的数据，才能在DBMS中实现，因此，逻辑模型既要面向用户，也要面向实现。"
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 3. 物理数据模型（与DBMS、OS硬件有关）


    它反映数据的存储结构，如物理块、指针、索引等。物理数据模型不仅与DBMS有关，还与OS和硬件有关。'
  merge: -1
  img_proc: true
- pgno: 33
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 数据模型和数据模式区别：


    数据模型是描述现实世界数据的手段、工具。


    数据模式是利用这个手段和工具对具体对象相互间的关系所进行的描述。是关于型的描述。它与DBMS和OS硬件无关。


    例： C语言和用C语言编写的程序的区别。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 数据模式通常分为三级：


    +   1. 概念模式


    是用逻辑数据模型对一个单位的数据的描述。是 一个单位的全局模式，是整个数据库的逻辑结构。


    +   2. 外模式


    是用逻辑数据模型，对用户所用到的那部分数据的描述。它是概念模式的一部分或由前者推导而来的。（这是每一个用户看到的模式。每一个用户的外模式不一定相同，外模式是一种局部模式）'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 3. 内模式


    是用物理数据模型对数据的描述。表示数据库存储结构，即物理结构。


    概念模式、外模式和内模式都存于数据目录中，是数据目录的最基本内容。DBMS通过数据目录,管理和访问数据模式。'
  merge: -1
  img_proc: true
