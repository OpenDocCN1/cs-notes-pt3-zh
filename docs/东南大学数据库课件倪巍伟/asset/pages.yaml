- pgno: 164
  md: '# 范式概念


    +   构造数据库必须遵循一定的规则。在关系数据库中，这种规则就是范式。范式是符合某一种级别的关系模式的集合。


    +   第一范式（1NF）：在关系模式R中的每一个具体关系r中，如果每个属性值都是不可再分的最小数据单位，则称R是第一范式的关系。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '例如：职工号，姓名，电话号码组成一个表（一个人可能有一个办公室电话 和一个家里电话号码） 规范成为1NF有三种方法：

    （1） 重复存储职工号和姓名。关键字只能是电话号码。

    （2） 职工号为关键字， 电话号码分为单位电话和住宅电话两个属性。

    （3） 职工号为关键字，但强制每条记录只能有一个电话号码。


    以上三个方法，第一种方法最不可取，按实际情况选取后两种情况。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 第二范式（2NF）：如果关系模式R中的所有非主属性都完全依赖于任意一个候选关键字，则称关系R是属于第二范式的。


    例：选课关系 SCI（SNO，CNO，GRADE，CREDIT）其中SNO为学号，CNO为课程号，GRADE为成绩，CREDIT为学分。由以上条件，关键字为组合关键字（SNO，CNO）。


    在应用中使用以上关系模式存在什么问题？'
  merge: -1
  img_proc: true
- pgno: 167
  md: "# 在应用中使用以上关系模式有以下问题：\n\n+   a. **数据冗余**\n+   \n+      假设同一门课由40个学生选修，学分就重复40次。\n\
    +   \n+   b. **更新异常**\n+   \n+      若调整了某课程的学分，相应的元组CREDIT值都要更新，有可能会出现同一门课学分不同。\n\
    +   \n+   c. **插入异常**\n+   \n+      如果计划开新课，由于没有人选修，没有学号关键字，只能等有人选修才能把课程和学分存入。"
  merge: -1
  img_proc: true
- pgno: 168
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 169
  md: '第三范式（3NF）：如果关系模式R中的所有非主属性对任何候选关键字都不存在传递依赖，则称关系R是属于第三范式的。


    例如：S1（SNO，SNAME，DNO，DNAME，LOCATION）各属性分别代表学号，姓名，所在系，系名称，系地址。


    关键词SNO决定各个属性。由于是单个关键字，没有部分依赖的问题，肯定是2NF。但这关系肯定有大量的冗余，有关学生所在系的几个属性DNO，DNAME，LOCATION将重复存储，插入、删除和修改时也将产生类似以上例的情况。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '原因：关系中存在传递依赖造成的。即SNO -> DNO，DNO -> LOCATION，因此关键字 SNO 对 LOCATION 函数决定是通过传递依赖
    DNO -> LOCATION 实现的。也就是说，SNO不直接决定非主属性LOCATION，每个关系模式中不能留有传递依赖。


    解决方法：分为两个关系S（SNO, SNAME, DNO），D（DNO, DNAME, LOCATION）。


    注意：关系S中不能没有外关键字DNO。否则两个关系之间失去联系。'
  merge: -1
  img_proc: true
