- pgno: 291
  md: '# 3. 物理上分布、逻辑上集中的分布式数据库结构


    数据共享和数据集中管理是数据库的主要特征。随着单位规模的扩大和地理上的分散，集中式数据库系统有如下缺点：


    +   - 通信开销大

    +   - 性能差，瓶颈

    +   - 可用性差

    +   - 可扩充性差

    +   - 难以管理


    由于存在这些缺点，从20世纪70年代后期，开始了分布式数据库系统的研究。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '物理上分布、逻辑上集中的分布式数据库结构的思想是：把全局数据模式按数据的来源和用途，合理分布在系统的多个节点上，使大部分的数据可以就近存取。


    逻辑上，用户看到的是一个数据模式为全局数据模式的集中式数据库。


    缺点：全局数据模式很难设计、管理、扩充和修改（类似高度集中的计划经济难以管理）。'
  merge: -1
  img_proc: true
- pgno: 293
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 294
  md: '没有全局数据模式，节点数据模式的修改甚至节点的加入、撤离，仅仅影响有关的节点。

    这种分布式数据库系统又称为“联邦式数据库系统”（federated distributed database system）。'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 4.5 数据目录


    +   - 数据目录（catalog）存放一组关于数据的数据（描述数据模式的数据），也叫元数据（meta-data）。

    +   - DBMS的任务是管理大量的、共享的、持久的数据，有关这些数据的描述需长期保存，一般把这些元数据组成若干表，即数据目录。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - 数据目录既是数据，又不同于一般数据，数据目录也是表，可供查询，主要为DBMS服务，数据目录本身的定义和描述也包含在数据目录中。数据目录只能由系统定义，为系统所有。在初始化时，由系统自动生成（递归初始化，类比编译的符号表）


    数据目录中一般包含下列表：

    SYSTAB、SYSCOL、SYSIDX、SYSVIEW、SYSVWATR'
  merge: -1
  img_proc: true
- pgno: 297
  md: '元数据可以分为2类：


    +   （1）相对稳定：基表、视图和索引的定义；

    +   （2）经常变化：数据库状态的统计，例如，元组个数、现有不同属性值的个数等——主要用于查询优化，不必太准，可以定期更新。


    数据目录是影响系统全局的以读为主的数据，对系统的效率影响很大。'
  merge: -1
  img_proc: true
- pgno: 298
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 5.1 数据库存储介质的特点


    数据库是大量、持久数据的集合，在现阶段用内存作为数据库的存储介质是不合适的。


    +   - 采用多级存储器，用的最多的辅存是磁盘。\n- 光盘由于速度和价格上的原因，近期无法取代硬盘。\n- 磁带是顺序存取存储器，通常用作后备存储器。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   活动头磁盘的存取时间由三部分组成：寻道时间、等待时间以及传输时间。


    +   磁盘上的数据划分为大小相等的物理块。磁盘与内存间的数据交换以物理块为单位。


    以物理块为交换单位的优点：


    +   1). 减少I/O的次数，从而减少寻道和等待的时间。


    +   2). 减少间隙的数目，提高磁盘空间利用率。


    物理块的大小由OS决定。'
  merge: -1
  img_proc: true
- pgno: 301
  md: '+   一般，在磁盘和内存之间设立缓冲区以解决二者的速度不匹配问题。


    由于有多个缓冲块可供申请使用，磁盘的读写操作和读写数据的处理可以重叠进行。


    读出：

    i块→缓冲块A

    i+1块→缓冲块B

    i+2块→缓冲块A

    处理：

    处理A中i块

    处理B中i+1块'
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   - OS与DBMS都有各自的缓冲区。

    +   - 不少DBMS采用延迟写与提前读技术，减少 I/O，改善性能。'
  merge: -1
  img_proc: true
