- pgno: 554
  md: '# 10.6 关系模式的规范化


    在10.1节中，我们讨论了关系数据库设计中的一些数据语义问题。数据依赖是数据语义的很小、但是很基本的一部分。数据依赖引起的主要问题是更新异常，解决的办法是进行关系模式的合理分解，也就是进行关系模式规范化。


    在传统的关系数据模型中，曾限制关系的属性必须是原子的。此限制条件被称为第一范式（1NF）。1NF既非数据语义上的限制，也非关系模型本身所固有的特性，而仅仅是语法上的一个规定，其目的在于简化数据模型及其实现。'
  merge: -1
  img_proc: true
- pgno: 555
  md: 这在当时的技术条件下是合理的，事实上也满足了当时的主要应用的需要。随着技术的发展和应用的需求，关系模型进行了面向对象的扩充。在关系的框架下，允许用户自定义数据模型，关系属性中数据类型可以是组合数据、多媒体数据以及各行各业所需的特殊数据，从而突破了1NF的约束。
  merge: -1
  img_proc: true
- pgno: 556
  md: '关系仅仅满足第一范式的条件是不够的，尤其在增、删、改时，往往会出现更新异常。为了消除这些异常，人们采用分解的方法，力求使关系的语义单纯化，这就是所谓的关系规范化。由于关系规范化的要求不同，出现了不同的范式，从1NF，2NF，3NF，BCNF，4NF，直至5NF。其规范化的条件按上述次序越来越强，后面的范式可以看成前面范式的特例。


    当然，从关系规范化的发展来看，有这样一些范式；在规范化时，不必按此次序一步步地去做。对于数据库设计者来说，1NF和2NF本身并不重要，最重要的是3NF和BCNF两种范式。'
  merge: -1
  img_proc: true
- pgno: 557
  md: '定义10-14 在一个关系模式的所有非平凡函数依赖中，如果所有决定子都含有键（即决定子是超键），则此关系属于BCNF（Boyce-Codd Normal
    Form）。


    定义10-15 在一个关系模式 R 中，对任一非平凡函数依赖 X→A，如果满足下列两条件之一：


    +   （1）X 是超键；

    +   （2）A 是主属性；则此关系 R 属于 3NF。'
