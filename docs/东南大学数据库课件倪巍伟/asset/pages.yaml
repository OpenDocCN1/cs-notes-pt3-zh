- pgno: 317
  md: '# 5.3 文件结构和存取路径


    # 5.3.1 访问文件的方式


    传统的数据模型都以记录为基础，记录的集合构成文件。文件须按一定的结构组织和存储记录，按一定的存取路径访问有关记录。


    对数据库的操作最终要落实到对文件的操作。


    文件结构及其所提供的存储路径直接影响数据访问的速度，通常针对不同的数据访问采用不同的文件结构。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 文件访问方式按设计文件结构的观点分5类


    +   1. 查询文件的全部或相当多的记录（≥15%）

    +   2. 查询某一特定记录

    +   3. 查询某些记录

    +   4. 范围查询

    +   5. 记录的更新'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 5.3.2 数据库对文件的要求


    一些DBMS就以OS的文件管理系统作为其物理层的基础，更多的DBMS不用OS的文件管理系统，而是独立设计其存储结构。原因如下：


    +   - 传统文件系统不能提供实现DBMS功能所需的附加信息。DBMS为了实现其功能，须在文件目录、文件描述块、物理块等部分附加一些信息。

    +   - 传统文件系统主要面向批处理，数据库系统要求即时访问、动态修改。这就要求文件的结构能适应数据的动态变化，提供快速访问路径。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '+   - 传统文件系统服务对象特殊，用途单一，共享度低；数据库中的文件供所有用户共享，有些用途甚至是不可知的。


    +   - 减少DBMS对OS的依赖，提高DBMS的可移植性。


    +   - 传统文件系统一旦建立以后，数据量比较稳定；数据库中文件的数据量变化较大。'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 5.3.3 文件的基本类型


    不同类型的访问各有其使用的文件结构和存取路径。DBMS通常提供多种文件结构，供数据库设计者选用。


    +   1. 堆文件（heap file）

    +   2. 直接文件（direct file）

    +   3. 索引文件（indexed file）'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 1. 堆文件


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_322_0.png)


    +   - 最简单、最早使用的文件结构。记录按其插入的先后次序存放（所有记录在物理上不一定相邻）

    +   - 堆文件插入容易、查找不方便（所提供的唯一存取路径就是顺序搜索）'
  merge: -1
