- pgno: 336
  md: '# 稠密索引（dense index）


    +   - 每个键值对应一个索引项——稠密索引。

    +   - 稠密索引的预查找功能（用记录的地址代替记录参与集合运算，减少I/O次数）。

    +   - 索引溢出的问题


    稠密索引中，每增加一个键值，就要增加一个索引项。索引也会有溢出的可能。


    解决方法：1. 在每个索引块中预留发展的空间

    2. 建立索引溢出区'
  merge: -1
  img_proc: true
- pgno: 337
  md: '1. 稠密索引中，若键值不唯一，则在最低级索引中，每个键值对应的可能是 一个地址集（对应多个记录）。如果这些记录分散在不同的物理块内，稠密索引的优点并不能体现出来（并不一定能减少
    I/O）。

    例如：某个键值对应100个记录，且这100个记录分散在100个物理块中，虽然通过稠密索引可以一次获得这100个地址，但仍然要访问100个物理块。'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 2. 解决方法——簇集索引（clustering index）


    采用簇集索引：把键值相同的记录在物理地址上集中存放。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_338_0.png)'
  merge: -1
