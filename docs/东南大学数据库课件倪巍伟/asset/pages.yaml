- pgno: 187
  md: "# 3.3.3 基表模式的修改\n\nSQL提供7种修改基表模式的命令：\n\n+   1. 增加列\n\n```\nALTER TABLE [<表的创建者名>.]<表名>\n\
    \             ADD <列名><类型>;\n```\n\n**注：**[ ]内为任选项。如果用户本身就是被修改的表的创建者，则可略去表的创建者名，否则不可略去。"
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 2. 删除基表


    ```

    DROP TABLE <表名>;

    ```


    **注：** SQL未提供删除列的命令。（为什么？）


    若要删除列，只有另定义一个新表，并将原来表中要保留的列的内容复制到新表中，然后删除原表。最后还得用重命名命令把新表改为原表名。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 3. 补充定义主键


    如果原表以前未定义主键，需要时可利用此命令补充定义主键。


    ```

    ALTER TABLE <表名>

    ADD PRIMARY KEY (.<列名表>)

    ```'
  merge: -1
