- pgno: 399
  md: '# 6.3.4 集合操作


    常用集合操作：笛卡尔乘积、并、交、差等。


    笛卡尔乘积将两个关系的元组无条件地互相拼接，一般用嵌套循环法实现，做起来很费时，结果要比参与运算的关系大的多。应尽量少用！


    设关系R、S并兼容，对R、S进行并（交、差）操作，可以先将R和S按同一属性（通常选用主键）排序，然后扫描两个关系，选出所需的元组。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# 散列是上述并交差操作的另一种求解方法：


    将关系R散列到一个散列文件中，再将S散列到同一文件中。同时检查桶中有无重复元组。对于并，不再插入重复元组；对于交，选取重复元组；对于差，从桶中取消与S重复的元组。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# 6.3.5 组合操作


    有时，多个操作组合起来同时进行，如投影和选择操作组合起来执行（消除重复元组另外单独进行），可提高效率。


    还可以在更大范围内，将多个操作组合起来执行。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_401_0.png)'
  merge: -1
  img_proc: true
- pgno: 402
  md: 假设连接用嵌套循环法，R为外关系，S为内关系，R的选择、投影可在扫描R时执行，S的选择、投影可在首次扫描S时执行，并将选择、投影的结果存入临时文件，之后各轮只需扫描临时文件即可。最后一个投影操作，可在生成连接结果的同时进行。
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 6.5 结束语


    在执行前进行优化称为静态优化，只能利用统计数据，有时不一定准。


    在查询执行时进行优化称为动态优化，用实际执行结果估算代价，比较符合实际，但每次执行都要优化，不适于编译实现，也增加了执行时间。只能利用统计数据，有时不一定准。另外，优化时，要等待中间结果，增加了等待时间和数据的相关性，不利于并行性。'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# 第7章 事务管理


    事务管理（transaction management）：


    +   - 恢复——保证事务在并发执行时满足ACID准则的技术。

    +   - 并发控制——保证事务在并发执行时满足ACID准则的技术。'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# 7.1 恢复引论


    故障的可能性总是存在的。解决故障的措施有二：一是尽可能提高可靠性；二是恢复。


    这里主要讨论发生故障后，恢复数据库至一致状态的技术，即恢复技术。


    系统发生故障时，可能会导致数据的丢失(loss)，要恢复丢失的数据，必须有后备副本。


    对于恢复，数据冗余是必需的！'
  merge: -1
  img_proc: true
- pgno: 406
  md: '恢复技术大致可以分为下列三种


    +   1. 单纯以后备副本为基础的恢复技术

    +   2. 以后备副本和运行记录为基础的恢复

    +   3. 基于多副本的恢复技术'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 1. 单纯以后备副本为基础的恢复技术


    +   从文件系统继承而来，周期性的把磁盘上的数据库转储（dump）到脱机存放的磁带上。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_407_0.png)


    +   增量转储（ID）


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_407_1.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '单纯以后备副本为基础的恢复技术：

    优点：实现简单，不增加数据库正常运行时的开销。

    缺点：不能恢复到数据库的最近一致的状态。

    多用于文件系统以及小型的不重要的数据库系统。'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 2. 以后备份和运行记录为基础的恢复


    运行记录（log或journal）由系统维护，一般包括下列内容：


    +   (1) 前像（Before Image, BI）

    +   当数据库被一个事务更新时，所涉及的物理块更新前的映像（image）称为该事务的前像（BI），前像以物理块为单位；有了前像可以使数据库恢复到更新前状态，对应操作undo（撤销）。'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# （2）后像(After Image, AI)


    当数据库被一个事务更新时，所涉及的物理块更新后的映像（image）称为该事务的后像（AI），后像也以物理块为单位；有了后像，即便更新的数据丢失了，仍然可以使数据库恢复到更新后的状态，相当于重做一次更新，对应操作redo(重做)。'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# 问题：前像(BI)、后像(AI)和事务操作的关系？


    +   - 修改——有前像 有后像

    +   - 插入——没前像 有后像

    +   - 删除——有前像 没后像'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# （3）事务状态


    记录每个事务的状态，以便在恢复时作不同的处理（COMMIT和NOT COMMIT）。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_412_0.png)'
  merge: -1
  img_proc: true
- pgno: 413
  md: '提交(Commit)——成功执行(do all)。

    回卷(Rollback或Abort)——消除事务对数据库的影响(do nothing)。

    对恢复而言，至少要区分一个事务是否提交！'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# 实现方法


    最近后备副本

    运行记录

    失效


    基于后备副本与运行记录的恢复如上图所示，当数据库失效时，取出最近后备副本，然后根据运行记录，对未提交的事务用前像卷回——向后恢复(backward recovery)；对已提交的事务，必要时用后像重做——向前恢复(forward
    recovery)。'
  merge: -1
  img_proc: true
- pgno: 415
  md: 这种恢复技术，需保持运行记录，这将会影响数据库的正常工作速度，但可以使数据库恢复到最近一致状态。大多数商品化DBMS采用这种恢复技术。
  merge: -1
  img_proc: true
- pgno: 416
  md: '# 3. 基于多副本的恢复技术


    如果系统中有多个DB副本，且这些副本具有独立的失效模式(independent failure mode)，则可利用这些副本互为备份，用于恢复。

    此技术在分布式数据库系统中应用的较多。

    近年来，由于硬件价格的下降，也采用镜像磁盘(mirrored disks)技术。'
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_417_0.png)


    写数据时，两个磁盘都写入同样的内容。

    当一个磁盘的数据丢失时，可以用另一个磁盘的数据来恢复。（两盘同时故障的概率可以假设为零！）

    下面主要讨论第二种恢复技术。'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 7.2 运行记录的结构


    运行记录的存储要避免与数据库“全军覆没”。

    运行记录(log)一般不能和数据库放在同一磁盘上，以免两者皆失。（假设log和DBMS同时失效的概率为零；一般假设log不会损坏，若运行中DBMS测得log损坏，则采取强制措施，例如拒绝新事务，完成已提交事务，停止运行，修复log）。'
  merge: -1
  img_proc: true
- pgno: 419
  md: '+   - 运行记录的结构因DBMS而异

    +   - Log基本内容

    +     1. 活动事务表（active transaction list---ATL）

    +        记录所有正在执行，尚未提交的事务的标识符（transaction identifier---TID）。

    +     2. 提交事务表（committed transaction list---CTL）

    +        记录所有已提交事务的标识符。'
  merge: -1
  img_proc: true
- pgno: 420
  md: '问题：某事务需要提交时，该按照什么顺序对ATL和CTL进行更新？

    注意：提交时，先将要提交事务的TID加入CTL，再从ATL中删除相应的TID。否则，一旦发生故障，该事务的状态将丢失！'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 3. 前像文件


    可以看成一个堆文件。每个物理块有个块标识符 BID（block identifier）。BID由TID、关系名和逻辑块号组成。逻辑块号在关系中是唯一的。如果一个事务需要卷回，可以在前像文件中找出该事务的所有前像块，按照逻辑块号写入到关系的对应块，从而消除该事务对数据库的影响。


    undo满足幂等性：

    undo (undo (undo...undo (x))) = undo (x)


    因此，undo失败可以再undo！


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_421_0.png)'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 4. 后像文件


    结构与前像文件相仿，不过记的是后像。在恢复时，可按提交事务表中的事务次序，按逻辑块号，写入其后像。这相当于按提交的次序重做各个事务。


    redo满足幂等性：


    redo(redo(redo...redo(x)))=redo(x)


    问题： undo操作需要按照事务的次序吗？为什么？'
  merge: -1
  img_proc: true
- pgno: 423
  md: '取后备复本后，之前的运行记录就失去了价值，对恢复来说，只要保留最近后备复本以后的运行记录。但运行记录仍可能很大。可采用下列措施减小运行记录规模。


    +   1. 不保留已提交事务的前像

    +   2. 有选择性的保留后像

    +   3. 合并后像（对给定逻辑块号的物理块，如多次更新，可只保留最近的后像）


    如何判断该做undo还是redo呢？下一节，将解决这个问题。'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# 7.3 更新事务的执行与恢复


    更新事务执行时，应遵守下两条规则：


    +   1 提交规则（Commit Rule）

    +   后像必须在事务提交前，写入非易失性存储器（DB 或 log）。

    +   即后像不能仅留在内存中！


    +   2 先记后写规则（Log Ahead Rule）

    +   如果后像在事务提交前写入数据库，则必须把前像先写入 log。

    +   在执行一个更新事务时，按后像写入 DB 的时间，有三种可能的方案。'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# 三种更新策略


    +   a) 后像在事务提交前完全写入DB

    +   TID →active list

    +   B.I →Log    （按Log Ahead Rule）

    +   A.I →DB

    +   :

    +   TID →commit list

    +   delete TID from active list'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# 在这种情况下，如果出现故障，如何恢复？


    Restart时，对每个TID，查两个list:


    | Commit list | Active list |  |

    |---|---|---|

    |  | ✓ | undo |

    | ✓ | ✓ | delete TID from active list |

    | ✓ |  | nothing to do |'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'b) 后像在事务提交后写入数据库

    TID →active list

    A.I →Log（按commit rule）

    |

    TID →commit list

    A.I →DB

    delete TID from active list'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# 在这种情况下，如果出现故障，如何恢复


    Restart时，对每个TID，查两个list:


    | Commit list | Active list |  |

    |---|---|---|

    |  | ✓ | delete TID from active list |

    | ✓ | ✓ | redo, delete TID from active list |

    | ✓ |  | nothing to do |'
  merge: -1
  img_proc: true
- pgno: 429
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 430
  md: '# 在这种情况下，如果出现故障，如何恢复？


    Restart时，对每个TID，查两个list：


    | Commit list | Active list |  |

    |---|---|---|

    |  | ✓ | undo |

    | ✓ | ✓ | redo, delete TID from active list |

    | ✓ |  | nothing to do |


    思考：方案3均匀的将写入DB的I/O操作分散在事务提交前后，有什么优点？ 有利于磁盘均衡负载'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 7.5 消息的处理


    一个事务常常要给用户发送有影响的消息(message)，不是指需要用户输入的指示消息。


    例如：“付款2000元”以及“立即执行下一步处理”等。发送消息也是事务执行结果的一部分，应该遵循“要么不做，要么全做”的原则。但是，消息往往难以用“undo”操作来消除其影响。


    因此，在事务结束前，消息不能发出，只有等事务结束后才能发出。带来什么问题？'
  merge: -1
  img_proc: true
- pgno: 432
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 433
  md: 'MM对事务委托发送的消息，在事务正常结束前，允许事务增加和删除；一旦事务结束，MM就把消息存于不易失存储器中。

    当事务正常结束时（包括提交和回卷），事务通知MM发送消息；当事务因故障被撤销时，MM将把该事务的消息丢弃。

    为了保证消息能可靠的发送给有关用户，MM采用“发送-确认”方式传递。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_433_0.png)'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# 7.6 失效的类型及恢复的对策


    一种恢复方法通常只对某些类型的失效有用。


    通常的失效可以分为以下三类：


    +   1. 事务失效 (transaction failure)


    事务应不可预知的原因而夭折。


    例如：数据库中没有要访问的数据、输入数据类型不对、除数为零等。


    事务失效时DB未被破坏，系统控制在手。且事务失效一定发生在事务提交前。'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 恢复措施：


    +   - MM丢弃该事务的消息队列；

    +   - 如果需要，进行undo操作；

    +   - 从ATL删除该事务的TID，释放该事务所占资源。


    # 2. 系统失效(system failure)


    系统(包括OS和DBMS)崩溃，需要重新启动(restart)，DB未被破坏，但系统失去控制。


    例如：掉电、除数据库存储介质以外的软、硬件故障等。'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# 恢复措施：


    +   - 重新启动OS和DBMS；

    +   - 恢复DB致一致状态（对未提交的事务进行undo操作 对已提交的事务进行redo操作）。


    只有当数据库恢复到一致状态后，才允许用户访问数据库。


    系统中，活动事务表(ATL)的长度是有限的；由于累积效应，提交事务表（CTL）可能很长。


    由于事务可以在提交前和提交后将数据的后像分别写入数据库，因而对CTL中的事务只能全部做redo，很费时（可能CTL中的很多事务已经完成将后像写入数据库，但鉴别代价很大）。'
  merge: -1
  img_proc: true
- pgno: 437
  md: '为了减少恢复时大量redo操作的工作量，在运行过程中，DBMS每隔一定时间在运行记录中设置一个检查点（checkpoint—CP），在检查点，DBMS强制写入所有已提交事务的后像。


    运行记录

    最近后备副本


    失效


    运行记录

    最近后备副本

    CP CP CP CP CP


    失效


    显然，在最近检查点以前提交的事务，恢复时，不用redo。'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# 取CP过程一般如下：


    +   - 暂停事务的执行；

    +   - 写入上一个CP以后所提交事务的后像；

    +   - 在log的CTL中记下检查点；

    +   - 恢复事务的执行。


    取CP很影响系统的正常运行，而只有在发生系统失效时，才有其减少redo工作量的效益。'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# 3. 介质失效 (media failure)


    磁盘发生故障，DB被破坏。


    恢复措施：


    +   - 修复系统，必要时更新磁盘；

    +   - 如果系统（OS和DBMS）崩溃，重新启动系统；

    +   - 加载最近后备副本；

    +   - 用log中的后像重做最近后备副本后提交的所有事务。'
  merge: -1
  img_proc: true
- pgno: 440
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 441
  md: '# 7.7 并发控制


    # 7.7.1 数据库系统中的并发


    +   1. 串行访问(serial access)——事务顺序执行。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_441_0.png)'
  merge: -1
  img_proc: true
- pgno: 442
  md: '2. 并发访问(concurrent access)——DBMS可同时接纳多个事务，事务可在时间上重叠执行。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_442_0.png)'
  merge: -1
  img_proc: true
- pgno: 443
  md: '交叉并发（interleaved concurrency）——单CPU系统，各事务交叉使用CPU。


    同时并发（simultaneous concurrency）——多CPU系统，多个事务在CPU中同时运行。


    # 7.7.2 并发的目的


    +   1. 提高系统资源利用率；

    +   2. 改善短事务响应时间。


    例如，两个事务T₁和T₂， T₁长，先交付； T₂短，稍后交付，如果串行执行，则T₂必须等T₁，响应时间很长。'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# 7.7.3 并发引起的问题


    事务若不加控制的并发执行，会产生什么问题？


    +   1. 丢失更新（lost update）


    | T₁ | T₂ |

    | --- | --- |

    | Read(x) | Read(x) |

    | x:=x+1 | x:=2*x |

    | Write(x) | Write(x) |


    时间

    | T₁ | T₂ |

    | Read(x) |  |

    | 丢失 | Read(x) |

    | x:=x+1 |  |

    | Write(x) | x:=2*x |

    |  | Write(x) |


    问题：为什么会发生丢失更新？


    由两个事务对同一数据并发写入引起，称为“写-写冲突”（write-write conflict）'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# 2. 读脏数据 (dirty read)


    | T₁ | T₂ |

    | --- | --- |

    | write(t) | read(t[x]) |

    | rollback | read(t[y]) |


    时间


    | T₁ | T₂ |

    | --- | --- |

    |  | read(t[x]) |

    | write(t) | 脏数据 |

    | rollback | read(t[y]) |


    问题：为什么会发生读脏数据？


    由于一个事务读取另一个更新事务尚未提交的数据引起，称为“读-写冲突”(read-write conflict)'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# 3. 读值不可复现（unrepeatable read）


    | T₁ | T₂ |

    | --- | --- |

    | read(x) | Write(x) |

    | read(x) |  |


    时间


    | T₁ | T₂ |

    | --- | --- |

    | Read(x) |  |

    |  | Write(x) |

    | Read(x) |  |

    | X已改变 |  |


    问题：为什么会发生读值不可重现？


    由两个事务对同一数据并发读写引起，问题出在“写”操作上'
  merge: -1
  img_proc: true
- pgno: 447
  md: '事务并发执行时可能会有两种冲突：

    写一写、读一写；

    写一写冲突在任何情况下都应避免，读一写冲突一般情况下应避免，但某些应用场合可以容忍。'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# 7.7.4 并发控制的正确性准则


    思考：多个事务并发执行，结果怎么估计？


    假设数据库系统中，某一时刻并发执行的事务集为 {T₁, T₂, ...Tₙ}，调度(Schedule)S是对n个事务所有操作的顺序的一个安排。


    在S中，不同事务的操作可以交叉，但必须保持各个事务的操作的原有次序。（注意：操作是调度的基本单位！）


    设Write简写为W，Read为R，R和W用其所属事务号为下标，上图的调度可表示为：

    S=...R₁(x)...W2(x)...R₁(x)...'
  merge: -1
  img_proc: true
- pgno: 449
  md: '对同一事务集，可能有许多种调度。


    如果其中两个调度S1和S2，在数据库的任何初始状态下，所有读出的数据都一样，留给数据库的最终状态也一样，则称S1和S2是等价的，又称为目标等价(view equivalence)。——偏重语义，难以判断！


    还有一种更实用的等价定义，称为冲突等价(conflict equivalence)。——容易实现！


    冲突操作有读-写冲突和写-写冲突两种，可表示为：


    +   Rᵢ(x)和Wⱼ(x)


    +   Wᵢ(x)和Wⱼ(x)  (i≠j)'
  merge: -1
  img_proc: true
- pgno: 450
  md: '冲突操作的执行次序会影响执行结果，不冲突操作的次序可以互换，不致影响执行结果。

    凡是通过调换S中不冲突操作得到的新的调度，称为S的冲突等价调度。

    如果两个调度是冲突等价的，一定是目标等价的；

    反之未必！'
  merge: -1
  img_proc: true
- pgno: 451
  md: '若调度S在数据库中产生的效果，与这组事务的某个串行执行序列的结果相同，则称这个调度S是可串行化的（serializable）。


    例如，对事务集{T₁,T₂,T₃}的一个调度：


    S = R₂(x) W₃(x) R₁(y) W₂(y)


    S'' = R₁(y) R₂(x) W₂(y) W₃(x)


    S’是串行调度，故S是冲突可串行化的，也是目标可串行化的！'
  merge: -1
  img_proc: true
- pgno: 452
  md: '冲突可串行化的调度一定是目标可串行化的吗？


    目标可串行化的调度一定是冲突可串行化的吗？


    目标可串行化的调度未必是冲突可串行化！


    例如，调度S=R₁(x)W₂(x)W₁(x)W₃(x)


    无冲突等价调度，但却可以找到一个调度S''：


    S''=R₁(x)W₁(x)W₂(x)W₃(x)与S目标等价。'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_453_0.png)


    多个事务串行执行后，DB仍保持一致状态。可串行化调度与事务的某个串行执行等价。当然也保持数据库的一致状态，因此，在一般的DBMS中，都是以**可串行化作为并发控制的正确性准则！**'
  merge: -1
  img_proc: true
