- pgno: 227
  md: "```\n语句：\nSELECT CNO, MAX (GRADE), MIN (GRADE), AVG(GRADE)\nFROM   SC\nWHERE\
    \  CNO Like ‘CS*’   /*选择计算机系所开的课程*/\nGROUP BY CNO            /*按CNO 分组*/\nHAVING\
    \ CNO NOT IN (SELECT CNO /*删去成绩不全的组*/\n                  FROM SC\n           \
    \       WHERE GRADE IS NULL)\nORDER BY CNO;  /*按CNO升序排序*/\n```"
