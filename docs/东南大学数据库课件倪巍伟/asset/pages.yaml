- pgno: 5
  md: '# 数据管理


    # 文件系统的缺点


    +   1. 编写应用程序不方便；

    +   2. 数据冗余；

    +   3. 文件结构的每一修改将导致应用程序的修改，应用程序维护工作量大；

    +   4. 文件系统不支持对文件的并发访问；

    +   5. 数据的规范化与标准化较难达到。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_5_0.png)'
