- pgno: 61
  md: '# 层次数据的线性表示


    由于存储器是线性的，层次数据必须变换成线性形式才能存储，层次数据模式的实例对应一棵层次树（或森林），对层次树（或森林）按先序遍历生成的序列称为层次序列（hierarchical
    sequence），规定以此作为存储次序。


    | 计算机系 | 901班 | 王一 | … | 张三 | 911班 | … | 931班 | … | 吴坚 | 硬件教研组 | 郑山 | … | 洪流 |
    软件教研组 | … | 丁伟 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   ■ 层次数据模型的约束

    +   (1) 除了根记录外，任何其它记录不能离开其双亲记录而孤立存在；

    +   (2) 任何记录，不管虚实，只允许有一个双亲记录（保证层次数据模式及其实例是树形）；

    +   (3) 虚拟记录的指针必须指向一个实际存在的记录，有虚拟记录指向的记录不得删除；

    +   (4) 虚拟记录不得为根记录。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '**特点：** 层次结构是树结构，树的结点是记录类型，非根结点有且只有一个父结点。上一层记录类型和下一层记录类型是 **1:N 联系**。（因此不能表示
    M:N）'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 层次模型的优点：


    记录之间的联系通过指针来实现，查询效率较高（针对层次结构）。


    # 层次模型的缺点：


    +   1、只能表示1∶N联系，虽然可以采用虚拟记录描述非层次数据关系，但较复杂，用户不易掌握，并且非层次结构的查询效率比较低；

    +   2、由于层次顺序的严格和复杂，引起数据的查询和更新很复杂，因此应用程序的编写也比较复杂；

    +   3、模式描述语言较复杂，数据独立性差。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 2.2 网状数据模型


    用有向图（网络结构）表示实体及实体之间联系的数据模型称为**网状数据模型（network data model）**。有向图中的结点是记录类型，箭头表示从箭尾的记录类型到箭头的记录类型间联系。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 基本概念和结构


