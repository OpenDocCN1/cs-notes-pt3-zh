- pgno: 2
  md: '# # 第1章 引论


    # ## 1.1 数据管理的发展


    （1）数据库技术是应数据管理的任务的需要而产生的。数据管理是指如何对数据进行分类、组织、编码、存储、检索和维护，它是数据处理的中心问题。


    （2）数据管理经历了三个阶段


    +   - 人工管理

    +   - 文件系统

    +   - 数据库系统'
  merge: -1
  img_proc: true
- pgno: 3
  md: '|  | 人工管理 | 文件系统 | 数据库系统 |

    |---|---|---|---|

    | 背景

    应用背景 | 科学计算 | 科学计算、管理 | 大规模管理 |

    | 硬件背景 | 无直接存取存储设备 | 磁盘、磁鼓 | 大容量磁盘 |

    | 软件背景 | 没有操作系统 | 有文件系统 | 有数据库管理系统 |

    | 处理方式 | 批处理 | 联机实时处理 批处理 | 联机实时处理, 分布式处理批处理 |

    |  |  |  |  |

    | 特点

    数据的管理者 | 人 | 文件系统 | 数据库管理系统 |

    | 数据面向的对象 | 某一应用程序 | 某一应用程序 | 整个应用系统 |

    | 数据的共享程度 | 无共享, 冗余度极大 | 共享性差, 冗余度大 | 共享性高, 冗余度小 |

    | 数据的独立性 | 不独立, 完全依赖于程序 | 独立性差 | 具有高度的物理独立性和逻辑独立性 |

    | 数据的结构化 | 无结构 | 记录内有结构, 整体无结构 | 整体结构化, 用数据模型描述 |

    | 数据控制能力 | 应用程序自己控制 | 应用程序自己控制 | 由数据库管理系统提供数据安全性、完整性、并发控制和恢复能力 |'
  merge: -1
  img_proc: true
