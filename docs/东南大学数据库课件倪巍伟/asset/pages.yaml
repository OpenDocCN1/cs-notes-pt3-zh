- pgno: 386
  md: '# 2）. 利用索引或散列寻找匹配元组法


    在嵌套循环法中，内关系上要做多次顺序扫描，若内关系上有合适的存取路径（连接属性上的索引散列等），可以避免内关系上的顺序扫描，以减少 I/O 次数。


    **问题：**若在内关系的连接属性上建有索引？是否一定能够提高内关系和外关系的匹配效率？


    当每次循环所选的匹配元组数在内关系中占有较大比例（例如超过15%）时，用无序索引甚至还不如用顺序扫描的方法。内关系的连接属性上有簇集索引时，索引对减少连接所需
    I/O 次数的作用最明显。'
  merge: -1
  img_proc: true
