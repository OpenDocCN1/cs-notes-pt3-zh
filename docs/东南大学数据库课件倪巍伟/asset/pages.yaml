  md: "由前述公理，还可以推导出下列 4 个多值依赖推理规则。\n\n+   （1）多值依赖合并规则\n+   \n+   如果 X →→ Y，X →→ Z，则\
    \ X →→ YZ。\n+   \n+   （2）多值依赖伪传递规则\n+   \n+   如果 X →→ Y，WY →→ Z，则 WX →→（Z−W）。\n\
