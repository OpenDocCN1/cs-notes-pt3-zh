- pgno: 173
  md: '# 3.1 数据库的用户接口


    DBMS提供操作命令和语言，使用户能够对数据库进行各式各样的操作，例如查询、增、删、改数据，定义、修改数据模式等 —— 这就构成了用户和数据库的接口。


    DBMS所提供的语言一般局限于对数据库的操作，有别于计算完备的程序设计语言，称为数据库语言（database language）。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '过程性语言——以关系代数为基础设计出

    的数据库语言。即用户不但要说明需要什么

    数据，而且还要说明获得这些数据的过程。


    非过程性语言——用户只要说明需要的数据，而如何获得这些数据则不必由用户说明，而由系统来实现。'
  merge: -1
  img_proc: true
- pgno: 175
  md: '层次和网状数据库的语言一般都是过程性的，而关系数据模型的抽象级别较高，比较简单，且有明确的数学定义。用户只须了解逻辑模式，不必关心物理存储的细节，这就为设计非过程关系数据库语言提供了良好的基础。


    SQL语言是非过程关系数据库语言。


    它将描述操作过程的麻烦由用户转嫁给了系统！'
  merge: -1
  img_proc: true
- pgno: 176
  md: '数据库语言本身不是计算完备的语言，不能用来独立编制应用程序。目前常用方法是将数据库语言嵌入到一种高级程序设计语言中（如C）。这种高级程序设计语言称为数据库语言的宿主语言。


    # 数据库语言与宿主语言的区别：


    +   数据库语言是非过程性语言，是面向集合的语言，主要用于访问数据库；

    +   宿主语言是过程性语言，主要用于处理数据。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 3.2 SQL (Structured Query Language)

    语言概况


    SQL按其功能可分为4大部分：


    +   1. 数据定义语言（DDL）

    +      用于定义、撤消和修改数据模式,如表、视图、索引；

    +   2. 查询语言（QL） 用于查询数据；

    +   3. 数据操作纵语言（DML） 用于增、删、改数据；

    +   4. 数据控制语言（DCL） 用于数据访问权限的控制。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 3.3 SQL数据定义语言


    关系称为表，是关系数据库的基本组成单位。在 SQL中，表分为两种：


    +   ◆ 基表(base table)--数据显式地存储在数据库中。

    +   ◆ 视图(view)


    视图是个虚表。仅有逻辑定义，可根据其定义由其它表（视图）导出，但不作为一个表显式地存储在数据库中。视图可像基表一样，参与各种数据库操作。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# （1）普通视图


    # （2）临时视图


    对于较复杂的查询，可将查询中相对独立部分作为查询的中间结果，定义为临时视图。临时视图在功能上与普通视图一样，但仅用于附在临时视图定义后的查询语句中。该查询语句结束后，临时视图随之自行消失。'
  merge: -1
