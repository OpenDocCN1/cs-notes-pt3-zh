- pgno: 115
  md: '# 集合操作


    在关系数据模型中，用得最多的集合操作是并、交、差，设A、B为两个集合。


    A∪B 并（union）：由属于A或属于B的所有元组组成的集合。


    A∩B 交（intersection）：由同时属于A和B的元组组成的集合。


    A−B 差（difference）：由属于R而不属于S的所有元组组成的集合。


    不过，交可用差表示。设A、B为两个集合，则A和B的交可表示为：A∩B≡A−（A−B）'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 注：


    +   ○ 参与并、差操作的两个关系的元组必须限制为同类型的，即具有相同的目，且对应的属性的域相同——并兼容（union compatibility）；

    +   ○ 关系专用操作优先级高于集合操作；

    +   ○ 一元操作（单目）优先级高于二元操作。'
  merge: -1
  img_proc: true
