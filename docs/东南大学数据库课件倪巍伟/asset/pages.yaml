- pgno: 225
  md: '# 3.4.3 GROUP BY和 ORDER BY 子句的应用


    GROUP BY子句按列值分组。列值相同的分为一组。当其后有多个列名时，则先按第一列名分组，再按第二列名在组中分组，直到GROUP子句指名的列都具有相同值的基本组，HAVING后的条件是选择基本组的条件。


    ORDER BY子句对查询结果按指定列值排序。ASC表示升序，DESC表示降序，缺省时为升序。当有多个列名时，先按第一列名排序，再按第二列名排序，…。'
  merge: -1
  img_proc: true
