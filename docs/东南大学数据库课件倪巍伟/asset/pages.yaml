- pgno: 43
  md: '# 数据模型可分为两类：


    +   1. 独立于计算机系统的数据模型，它完全不涉及信息在计算机系统中的表示，只是用来描述某个特定组织所关心的信息结构，这类模型称为“概念数据模型”。


    概念模型用于建立信息世界的数据模型，强调其语义表达能力，概念应该简单、清晰、易于用户理解，它是现实世界的第一层抽象，是用户和数据库人员之间进行交流的工具。最著名的是“实体联系模型”。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '2. 直接面向数据库的逻辑结构的数据模型, 它是现实世界的第二层抽象。这类模型涉及到计算机系统和数据库管理系统, 又称为 “基本数据模型” 或 “结构数据模型”。


    例如, 层次、网状、关系、面向对象数据模型”。这类模型有严格的形式化定义, 以便在计算机系统中实现。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 2.1 层次数据模型


    用树型（层次）结构表示实体类型及实体间联系的数据模型称为层次数据模型（hierarchical data model）。'
