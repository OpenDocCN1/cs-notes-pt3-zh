- pgno: 534
  md: '# 10.5 关系模式的分解及其问题


    在10.1节中讨论过由函数依赖所引起的更新异常问题。同样，多值依赖和连接依赖也会引起类似的问题。解决这些问题的途径，就是按照前面曾提到过的“一地一事”原则，对关系模式进行分解，使其语义单纯化。


    定义10-11　设有一关系模式R(U)，若用一关系模式的集合 {R₁(U₁)，R₂(U₂)，…，Rₖ(Uₖ)} 来取代，其中，U=⋃Uᵢ，则称此关系模式的集合为R的一个分解，用
    ρ={R₁，R₂，…，Rₖ} 表示。'
  merge: -1
  img_proc: true
- pgno: 535
  md: '定义10-12　F在属性集$U_i$（为$U$的真子集）上的投影定义为$\Pi_{U_i}(F)=\{X\to Y\mid X\to Y\in F^+\land
    XY为U_i的子集\}$


    定义10-13　设$\rho=\{R_1, R_2,\ldots,R_n\}$是$R$的一个分解，$r$是$R$的任一个值，如果满足条件$r=\Pi_{U_1}(r)\infty\Pi_{U_2}(r)\infty\cdots\Pi_{U_k}(r)$，则称$\rho$是无损连接分解或简称无损分解。


    定义10-14　设$\rho=\{R_1, R_2,\ldots,R_n\}$是$R$的一个分解，如$\bigcup\Pi_{U_i}(F)=F$，则称分解$\rho$保持函数依赖，或简称保持依赖。'
