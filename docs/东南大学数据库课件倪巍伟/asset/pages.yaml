- pgno: 340
  md: '# 常用索引总结


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 5.4 动态索引


    从数据结构角度看：静态索引是个多分树；动态索引是一种平衡多分树（即B-树），常用B+树。


    # B+树的限制和规定：


    +   每个节点最多有2k个键值，k称为B+树的秩(Order);


    +   根节点至少有一个键值，其它节点至少有k个键值，节点内，键值有序存放;


    +   除叶节点无子女外，其它节点若有J个键值，则有J+1个子女;


    +   所有叶节点都处于树的同一层，即树始终保持平衡。'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 插入算法：


    从根向叶搜索，直至相应叶节点，若该叶节点不满，则将键值插入叶节点中；如叶节点已满（即已经有2K个键值），则将此叶节点分裂为二，叶节点分裂后，其双亲节点也必须增加一个键值，若双亲节点不满，插入过程结束；否则双亲节点继续分裂为两个节点，如此继续直到插入过程中止。


    (K=1): 10，15，20，25，30，35，40，50


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_342_0.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 删除算法：


    先从根节点出发，找到待删除键值所在叶节点；若删除该键值后，叶节点中键值数减为K-1个，则向其左右兄弟叶节点借一个键值，以保持每个叶节点存放键值不少于K个；若其左右叶节点都只有K个键值，则可将该叶节点与其左（或右）叶节点合并成包含2K-1个键值的叶节点，合并后，其双亲节点要减少一个键值，有可能导致双亲节点的合并。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_343_0.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 345
  md: '# B⁺树实现的主索引包含如下2部分：索引集和顺序集。


    | 节点类型 | 块中索引键数 | P₀ | K₀ | P₁ | K₁ | … | Kₙ₋₁ | Pₙ |


    索引集节点


    | 节点类型 | 块中索引键数 | 前向指针 | 后向指针 | K₀ | tid₀ | K₁ | tid₁ | … | Kₙ | tidₙ |


    顺序集节点


    注：


    +   1. 节点一般是一个物理块。

    +   2. 元组标识符tid, 实际上是记录的地址, 由块号和记录在块中的指针号组成（使用记录在块中的指针号表示记录在块中的位置, 好于直接用记录在块中的地址,
    方便记录在块内移动）。'
  merge: -1
  img_proc: true
- pgno: 346
  md: '+   要找键值Kx所对应的记录时，从索引树的根开始，按下面的规则自上而下地搜索：

    +   1. 若Kx < K0，则沿P0所指的节点向下搜索；

    +   2. 若Kx > Kn-1，则沿Pn所指的节点向下搜索；

    +   3. 若Ki-1 < Kx ≤ Ki，则沿Pi所指的节点向下搜索。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_346_0.png)'
  merge: -1
  img_proc: true
- pgno: 347
  md: '问题：若在某个索引集结点中找到了待查找记录相应的索引键值，是否还要继续遍历B+树，为什么？


    注意：索引集节点中的键值不一定是文件中当前存在的键值（仅起“导航路标”的作用）。在搜索过程中，即使发现索引集节点中的键值等于要找的键值，查找仍要按上述规则进行下去。'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# 索引集与顺序集的关系


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_348_0.png)


    顺序集节点中的键值要满足如下关系：


    +   1. 如果 $P_i=P_0$，则 $K_{s_0}<K_{s_1}<\cdots<K_{s_{(n-1)}}\leq K_i$；

    +   2. 如果 $P_i=P_n$，则 $K_{s_{(n-1)}}>\cdots>K_{s_1}>K_{s_0}>K_{n-1}$；

    +   3. 否则：$K_{i-1}<K_{s_0}<K_{s_1}<\cdots<K_{s_{(n-1)}}\leq K_i$。'
  merge: -1
  img_proc: true
- pgno: 349
  md: '+   - B⁺树实现的主索引稍加修改后也可用于次索引（把顺序集结点的tid换成指针，因为一个键值可能对应多个tid）。

    +   - B⁺树实现的各种索引都是稠密索引（非稠密索引的概念源于静态索引），提供了顺序搜索的功能，这是它的优点。'
  merge: -1
  img_proc: true
- pgno: 350
  md: '搜索B+树所需的I/O次数决定于其级数。


    设索引属性不同键值的数目为N，若索引键不是候选键，则记录数通常大于N。


    *B+树的级数决定于N，而不是记录数！*


    假设B+树索引部分共有L级，其秩为k，则各级的最小结点数依次为：


    1， 2， 2(k+1)， ...， 2(k+1)^{L-2}'
  merge: -1
  img_proc: true
- pgno: 351
  md: '顺序集至少有 $2(k+1)^{L-2}$ 个结点。


    得出：

    $N\geq 2(k+1)^{L-2}\times k$

    $L\leq 2+\log_{(k+1)}(N/2k)\approx 1+\log_{(k+1)}(N/2)$


    > $L$ 决定了找到所需顺序集结点所需的 I/O 次数（访问数据还要额外的 I/O），例如 $k=99$，$N=2,000,000$，有 $L<5$，即至多经过
    4 次 I/O 就可以找到相应的顺序集结点。'
  merge: -1
  img_proc: true
- pgno: 352
  md: '+   - B+树提供3种存取路径：

    +     1. 通过索引集进行树形搜索

    +     2. 通过顺序集进行顺序搜索

    +     3. 先通过索引找到入口，再沿顺序集顺序搜索'
  merge: -1
  img_proc: true
