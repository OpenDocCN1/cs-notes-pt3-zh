  md: '# 外连接 (outer join)


    对连接操作的扩展。

    与连接的区别：连接操作时，只有符合连接条件的匹配元组才能保留在结果中。外连接操作时，同时也保留不匹配的那些元组，空缺部分填NULL。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_130_0.png)'
  merge: -1
