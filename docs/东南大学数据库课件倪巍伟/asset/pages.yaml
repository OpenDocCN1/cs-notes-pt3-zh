- pgno: 529
  md: 'A6：传递律（多值依赖）

    如果 X →→ Y，且 Y →→ Z，则 X →→（Z − Y）。

    下面两个公理与函数依赖和多值依赖都有关系。

    A7：如果 X → Y，则 X →→ Y，即函数依赖是多值依赖的特例。

    A8：如果 X →→ Y，Z ⊆ Y，而且对某个与 Y 不相交的 W，有 W → Z，则 X → Z。'
