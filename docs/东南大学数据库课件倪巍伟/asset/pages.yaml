- pgno: 244
  md: '# 3.6 SQL中的视图


    # 3.6.1 普通视图


    视图：是由其它视图或基表导出的虚表。它不是一个存在数据库中的表，而是在数据目录中保留其逻辑定义。


    当视图参与数据库操作时，可通过修改查询条件，把对视图的查询转换为对基表的查询。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 视图的定义：


    +   1、用户经常要用到一些数据；

    +   2、用户经常要查询的内容；


    # 视图的撤销：


    视图不再需要时，可以从系统中撤销。


    视图的定义和撤销语句的格式如图3-8(a)、(b)所示。'
