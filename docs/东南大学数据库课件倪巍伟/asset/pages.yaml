- pgno: 247
  md: '例3-18 试定义视图ENROL-SPRING,作为学生春季选课一览表，其中含有SNO, SNAME, CNO, CREIT等属性。


    语句：


    ```

    CREATE VIEW ENROL-SPRING

    AS SELECT SNO, SNAME, CNO, CREDIT

    FROM STUDENT, COURSE, SC

