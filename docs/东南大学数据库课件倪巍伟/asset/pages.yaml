- pgno: 504
  md: '# 10.1 关系模式设计中的一些数据语义问题


    数据的语义不但表现为完整性约束，对数据库的状态或状态的转换施加一定的限制，而且对关系模式的设计也提出一定的要求。


    属性间往往存在一定的依赖关系，而最基本的依赖关系是函数依赖。所谓函数依赖是指一个或一组属性的值可以决定其他属性的值。'
  merge: -1
  img_proc: true
- pgno: 505
  md: '一般地讲，设X，Y是关系的两个不同的属性组，如果Y函数依赖于X，或X函数决定Y，则其依赖关系可表示为X→Y。


    设有一关系R，具有下列属性：学号（S#）、课程号（C#）、成绩（G）、任课教师姓名（TN）、教师所在系名（D）。这些数据具有下列语义：'
  merge: -1
  img_proc: true
- pgno: 506
  md: '+   （1）学号是一个学生的标识，课程号是一门课程的标识，这些标识与其代表的学生和课程分别一一对应；

    +   （2）一位学生所修的每门课程都有一个成绩；

    +   （3）每门课程（注意：不是每种课程！同一种课，如数学课，可以开好多门，每门课有一个课程号）只有一位任课教师，但一位教师可以教多门课；

    +   （4）教师中没有重名，每位教师只属于一个系。'
  merge: -1
  img_proc: true
- pgno: 507
  md: '根据上述语义，可以确认下面函数依赖的集合：

    F = { { S #, C # } → G, C # → TN, TN → D }

    从图 1 0 - 1 可以看出，属性集 { S #, C # } 可以决定其他所有属性的值，而 { S #, C # } 的任何子集则不能，故 { S #,
    C # } 是这个关系的主键。这样的关系用来查询是很方便的。'
  merge: -1
  img_proc: true
- pgno: 508
  md: '计算机系通知教师准备给学生补考，可以“查询图10-1函数依赖计算机系所开课程的不及格学生的学号、不及格课程号以及任课教师的姓名”。查询仅涉及 R 一个关系，是一元查询，不须做连接运算，可以用下面的SQL语句来表达：


    ```

    ```sql

    SELECT S#, C#, TN FROM R

    WHERE D = CS’ AND G = F’;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 509
  md: '但是这样的关系也有问题，首先数据冗余太多，如一门课程的教师名须对选这门课的所有学生重复一次；一个系名须对选该系所开课程的所有学生重复一次。除此之外，在进行增、删、改操作时，还会发生所谓更新异常现象：


    +   （1）由于冗余，在修改时往往会导致数据的不一致。例如，改变一门课程的任课教师，或一门课改由另一个系开出，则需要修改多个元组。如果部分修改，部分不修改，则会导致数据的不一致。这叫修改异常。'
  merge: -1
  img_proc: true
- pgno: 510
  md: '（2）由于主属性不能为空值，如某系有位教师不教课，则这位教师的姓名及所属的系名就不能插入；同样，如果一位教师所开的课暂时无人选，或是列入计划而目前不开，则也无法插入。这叫插入异常。


    （3）如果所有学生都退选一门课，则有关这门课的其他数据（任课教师名及所属系名）也将被删除。如果一位教师因病暂时停开他所开的课，则有关这位教师的其他信息（所属系、可开课程）都将被删去。这叫删除异常。'
  merge: -1
  img_proc: true
- pgno: 511
  md: '在上例的关系中，包含了三方面的信息：学生各门课程的成绩，各门课程开课的教师以及各个教师所属的系。

    上例中，所有这三方面的数据都集中在一个关系中，此关系的主键为属性集 {S#, C#}。

    （C#，TN）和（TN，D）本来可以作为独立的关系而存在，而今却不得不依附于其他关系。这就是说，必须对应一个主键 {S#, C#} 的值，才能插入或存在一个（C#，TN）或（TN，D）的值。这是关系结构带来的限制，不是现实世界的真实反映。'
  merge: -1
  img_proc: true
- pgno: 512
  md: '解决这个问题途径是把关系分解，也就是进行所谓关系规范化。例如，把上例的关系分解为下列三个关系：

    SCG（S#，C#，G）

    CTN（C#，TN）

    TND（TN，D）'
  merge: -1
  img_proc: true
- pgno: 513
  md: '这样的分解使关系的语义单纯化，使之符合“一地一事”的原则。但是分解以后，对某些查询必须进行开销很大的连接操作，影响数据库的性能。


    关系的规范化主要是对关系进行必要的分解，但如何分解，分解后是否有损于原来的信息，回答这些问题需要理论的指导，下面将讨论这些问题。'
  merge: -1
  img_proc: true
- pgno: 514
  md: '+   - R 表示一个关系的模式，U={A1,A2,...,An} 是 R 的所有属性的集合，F 是 R 中函数依赖的集合，r 是 R 所取的值，即
    R 实有元组的集合。

    +   - 定义10-1 设有一关系模式 R(A1,A2,...,An), X 和 Y 为其属性的子集。设 t1,t2 是关系 R 中的任意两个元组，如果
    t1[X]=t2[X], 则 t1[Y]=t2[Y]。这时我们称 Y 函数依赖于 X，或 X 函数决定 Y，X 称为决定子（determinant）。'
  merge: -1
  img_proc: true
- pgno: 515
  md: '一个函数依赖要能成立，不但要求关系的当前值都能满足函数依赖条件，而且还要求关系的任一可能值都能满足函数依赖条件。确认一个函数依赖，需要弄清数据的语义，而语义是现实世界的反映，不是主观的臆断。


    如果 Y 为 X 的子集，显然 X→Y 成立，这称为平凡函数依赖（trivial functional dependency）。平凡函数依赖必然成立，它不反映新的语义。我们平常所指的函数依赖一般都指非平凡函数依赖（nontrivial
    functional dependency）。'
  merge: -1
  img_proc: true
- pgno: 516
  md: '如果 Y 不函数依赖于 X，则记做 X → Y。


    如果 X → Y 且 Y → X，则 X 与 Y 一一对应，可记做 X ↔ Y。


    定义10-2 设X,Y是某关系的不同属性集，如X→Y，且不存在X′为X的子集，使X′→Y，则称Y完全函数依赖（full functional dependency）于X，记做X
    →ᶠ Y；否则称Y部分函数依赖（partial functional dependency）于X，记做X → Y。'
  merge: -1
  img_proc: true
- pgno: 517
  md: '在10.1节的例子中，{S#, C#} 是主键，故 {S#, C#}→TN, 但C#→TN, 故 {S#, p f C#}→TN, 而 {S#, C#}
    →G。


    定义10-3 设X, Y, Z是某关系的不同的属性集，如果 X→Y, Y⊀X, Y→Z, 则称Z传递函数依赖（transitive functional dependency）于X。'
  merge: -1
  img_proc: true
- pgno: 518
  md: '+   - 定义10-4 设F是R的函数依赖集合，X→Y是R的一个函数依赖。如果一个关系模式满足F，则必然满足X→Y，就称F逻辑蕴涵X→Y，或表示为F
    |= X→Y。

    +   - 定义10-5 函数依赖集合F所逻辑蕴涵的函数依赖的全体称为F的闭包（closure），记为F+，即F+ = {X→Y | F |= X→Y}。'
  merge: -1
  img_proc: true
- pgno: 519
  md: '为了从已知的函数依赖推导出其他函数依赖，Armstrong提出了一套推理规则，我们常称为Armstrong公理（Armstrong saxions）。其推理规则可归结为如下三条：

    A1: 自反律（reflexivity）

    如果 Y ⊆ X ⊆ U，则 X → Y 成立。这是一个平凡函数依赖。

    A2: 扩展律（augumentation）

    如果 X → Y 成立，且 Z ⊆ U，则 X Z → Y Z 成立。式中，X Z 和 Y Z 是 X ∪ Z 和 Y ∪ Z 的简写，以后将沿用此表示法。

    A3: 传递律（transitivity）

    如果 X → Y，Y → Z 成立，则 X → Z 成立。'
  merge: -1
  img_proc: true
- pgno: 520
  md: '引理10-1 Armstrong公理是正确的（sound），即如果F成立，则由F根据Armstrong公理所推导的函数依赖总是成立的。

    引理10-2 下列三条推理规则是正确的。

    (1)合并规则（the union rule）

    { X→Y， X→Z } |= X→Y Z。

    (2)伪传递规则（the pseudo transitivity rule）：

    { X→Y， W Y→Z } |= X W→Z。

    (3)分解规则（the decomposition rule）：如果 X→Y 且 Z 为 Y 的子集，则 X→Z 成立。'
  merge: -1
  img_proc: true
- pgno: 521
  md: '定义10-6 设X为U的子集，则属性集X关于函数依赖集F的闭包X⁺定义为X⁺= { A | A∈U且X→A可由Armstrong公理导出}。


    引理10-3 X→Y能由Armstrong公理导出的充分必要条件是Y⊆X⁺。


    定理10-1 Armstrong公理是正确的、完备的

    (complete)'
  merge: -1
