- pgno: 466
  md: '# 7.9 死锁的检测处理和防止


    死锁：循环等待，谁也无法得到全部资源。

    活锁：虽然其它事务都在有限长的时间内释放了资源，但某事务就是无法得到想要的资源。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_466_0.png)


    +   - 活锁较简单，只需稍加修改调度策略，如FIFO

    +   - 死锁：(1)防（不允许发生）；(2)治（允许，能消除）'
  merge: -1
  img_proc: true
- pgno: 467
  md: "# 死锁的检测\n\n+   1. **超时法**：某事务等待时间超过某个定值，便认为发生了死锁，该事务被终止。\n\n+   2. **等待图法**\
    \ G=<V, E>\n+   \n+   V — 事务集 `{Tᵢ | Tᵢ is a transaction in DBS (i=1, 2, ...n)}`\n\
    +   \n+   E — `{<Tᵢ, Tⱼ> | Tᵢ waits for Tⱼ (i ≠ j)}`\n\n+   - 若图中有环路则说明已经发生死锁。\n\
    +   - 何时检测？\n\n+   1. 一旦某个事务等待。\n+   2. 周期性进行"
  merge: -1
  img_proc: true
- pgno: 468
  md: '# 死锁的处理


    +   - 如何处理死锁？

    +     1. 选出牺牲事务（最年轻、卷回代价最小…）

    +     2. 终止牺牲事务释放它所有的锁及资源

    +     3. 该事务等待一段时间

    +     4. 重新启动该事务（系统进行 or 用户进行）'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# 死锁的防止


    +   - 一次性申请所有锁

    +   - 将数据对象编号，按序号加锁

    +   - 一旦冲突，便终止相关事务

    +   - 卷回重执'
  merge: -1
  img_proc: true
- pgno: 470
  md: '每个事务有唯一的时标. 若在Tₐ在某个已被Tᵦ加锁的数据对象上申请锁，采用以下的一种策略：


    +   a) 等待-死亡（Wait-die）：若Tₐ比Tᵦ老，Tₐ等待，否则Tₐ“死亡”， i.e. 隔一段时间，Tₐ将重运行（仍用原时间标记）

    +   b) 击伤-等待（Wound-wait）：若Tₐ比Tᵦ年轻，Tₐ等待，否则，Tₐ“击伤”Tᵦ， i.e. Tᵦ被终止，隔一段时间，将重运行（仍用原时间标记）


    上述方法中，都只有一个方向的等待，年老→年轻或年轻→年老，所以不会出现循环等待，从而避免了死锁的发生。'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# 7.10 多粒度锁 Lock Granularities


    多级锁：从减少lock开销来讲，锁定单位越大越好；从提高事务运行并发度来讲，粒度越小越好。


    所以大数据库中锁定单位分几级：


    DB—File—Record—Field


    In this situation, if a transaction acquires a lock on a node then it acquires
    implicitly the same lock on each descendant of that node.'
  merge: -1
  img_proc: true
