- pgno: 455
  md: '# 关于目标等价与冲突等价


    +   - **调度**：是系统对 n 个并发事务的所有操作的顺序的一个安排。

    +   - **目标等价**：两个调度 s₁ 和 s₂，如果在同样的初始条件下执行，对数据库产生的效果完全相同，则称 s₁ 和 s₂ 是目标等价的。

    +   - **冲突操作**：R-W、W-W。冲突操作的执行顺序会影响执行效果。

    +   - **不冲突操作**：① R-R ②虽有写操作，但作用对象不同，如 Rᵢ(x) 和 Wⱼ(y)。

    +   - **冲突等价**：凡是通过调换 s 中的不冲突操作所得的新调度，称为 s 的冲突等价调度。'
  merge: -1
  img_proc: true
- pgno: 456
  md: '性质：如两调度是冲突等价的，则一定是目标等价的；反之未必正确。


    串行化也分为目标可串行化和冲突可串行化。


    例1：对事务集{T₁, T₂, T₃}的一个调度s

    s=R₂(x)W₃(x)R₁(y)W₂(y)→R₁(y)R₂(x)W₂(y)W₃(x)=s’

    因为s’是串行调度，所以s是冲突可串行化的。


    例2：s=R₁(x)W₂(x)W₁(x)W₃(x) 无冲突等价调度，但却可以找到一个调度s’

    s’=R₁(x)W₁(x)W₂(x)W₃(x)

    与s目标等价。'
  merge: -1
  img_proc: true
- pgno: 457
  md: '目标可串行化的测试算法是NP难度的，冲突可串行化覆盖了绝大部分可串行化的调度实例，所以今后如无特别说明，可串行化均指冲突可串行化。


    # 前趋图


    有向图G=<V，E>


    V——顶点的集合，包含所有参与调度的事务。


    E——边的集合，通过分析冲突操作来决定。如果下列条件之一成立，可在E中加边T_i→T_j：


    +   - R_i(x)在W_j(x)之前

    +   - W_i(x)在R_j(x)之前

    +   - W_i(x)在W_j(x)之前


    最后，看构造好的前趋图中是否有环路，如果有，则该调度不可串行化；否则，可串行化。'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 可串行化时，决定等价串行调度序列的算法：


    +   1. 由于无环路，必有入度为0的顶点。将它们及其有关的边从图中移去并将这些顶点存入一个队列。


    +   2. 对剩下的图作同样处理，不过移出的顶点要从队列中已有顶点之后。


    +   3. 重复1、2直至所有顶点移入队列为止。


    例对 {T₁, T₂, T₃, T₄} 的一个调度 s


    s = W₃(y) R₁(x) R₂(y) W₃(x) W₂(x) W₃(z) R₄(z) W₄(x)


    它是否可串行化？如可串行化找出其等价的串行执行序列。'
  merge: -1
