- pgno: 83
  md: '# 2.3 关系数据模型


    层次、网状模型都基于某种记录结构（PCR, SET），关系模型跳出这一限制，定义清晰，结构简单，操作方便。

    关系模型是以集合论中的关系概念为基础发展起来的数据模型。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '关系模型（relaction data model）的主要特征是用表格结构表达实体集，用外键表示实体间联系。与层次模型和网状模型相比，关系模型比较简单，容易为初学者接受。


    关系模型是由若干个关系模式组成的集合。每个关系实际上是一张表格，记录之间联系是通过各个关系模式的键体现的。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 关系模型的例子


    PART模式 （P#， PNAME， COLOR， WEIGHT）


    PROJECT模式 （J#， JNAME， DATE）


    SUPPLIER模式 （S#， SNAME， SADDR）


    P_P模式 （J#， P#， TATOL）


    P_S模式 （P#， S#， QUANTITY）


    关系模型的层次、网状模型的最大差别是用键而不是用指针导航数据，其表格简单，用户易懂，用户只需用简单的查询语句就可以对数据库进行操作，并不涉及存储结构、访问技术等细节。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 2.3.1 基本概念及定义


    +   1. 属性和域


    属性------用来描述事物特征。


    例如：学生的姓名、学号、性别、出生年月等。


    属性的域------属性的取值范围。


    例如：姓名的取值范围是合法姓名的集合。


    学号的域是若干位数字组成的字符串的集合。


    性别的域是 {男}，{女}，……'
  merge: -1
  img_proc: true
- pgno: 87
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 2. 关系和元组


    设有一关系R，R上有属性：


    A₁, A₂, …… , Aₙ


    其对应域分别为：


    D₁, D₂, …… , Dₙ


    则关系R可表示为：


    R = (A₁/D₁, A₂/D₂, …… , Aₙ/Dₙ)


    其中：n为关系R的属性个数，也称为关系的目。


    同一关系中，不允许有同名属性，但不同属性可有相同的域。'
  merge: -1
  img_proc: true
- pgno: 89
  md: "关系R的值可表示r或r(R)：\n r = {t₁, t₂, ......tₘ}\n每个元组t可表示为：\n t = <v₁, v₂, ......vₙ>,\
    \ vᵢ ∈ Dᵢ , 1≤ i ≤ n\n    即 tᵢ∈D₁ * D₂ * ... * Dₙ, 1≤i≤n\n\n例如：关于大学生的关系模式：\nSTUDENT（学号，姓名，性别，出生年月，系别，入学年份）\n\
    而其中某一个学生\n<9098138, 李彤, 女, 1980, 计算机系, 1998>\n就是关系R的一个元组。所有学生的值构成了R的元组的集合。\n因此，R的模式相对稳定。R的值相对变化。"
  merge: -1
  img_proc: true
- pgno: 90
  md: '属性


    元组


    | 学号 | 姓名 | 年龄 | 性别 | 系别 | 专业 |

    |---|---|---|---|---|---|

    |  |  |  |  |  |  |

    |  |  |  |  |  |  |


    另外，在关系R中，元组的次序无关，但不能允许有相同的二个元组；属性的次序无关。


    一个关系可视为一个二维表。组成表的所有数据项都应是不可再分的最小数据项。


    关系对应表，属性对应列，元组对应行。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 3. 键


    键（或候选键）——如果关系的某一个属性或属性组的值唯一地决定其它所有属性的值。而其任何真子集无此性质，则这个属性或属性组称为该关系的键。


    例：学生关系中，学号就是关键字。'
  merge: -1
  img_proc: true
- pgno: 92
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 93
  md: '**主属性**——能作为候选键的属性，称为主属性。


    **非主属性**——不包含在候选键的属性，称为非主属性。


    **外键**——引用其它关系的Key或本关系的Key，称为外键。


    如果一个关系中的属性或属性组并非该关系的关键字，但它们是另外一个关系的关键字，则称其为该关系的外关键字。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '例：①COURSE（**课程号**，课程名，学分，开课时间，先修课程号）

    ②GRADE（**学号**，**课程号**，成绩）


    其中：

    ①的主键是课程号。

    ②的主键是学号+课程号。


    ①中先修课程号是引用本关系的键，故称为外键。

    ②中学号、课程号是引用STUDENT关系和COURSE中的键。'
  merge: -1
  img_proc: true
- pgno: 95
  md: 关系数据模型是用关系描述事物间联系的，且这种联系通常都隐含在它们的公共属性中，尤其是外键中。因此，关系数据模型不能显式地表示这种事物间的联系，这是它的一个缺点。
  merge: -1
  img_proc: true
- pgno: 96
  md: "# 2.3.2 约束\n\n关系模式 R =（A₁/D₁，A₂/D₂，……，Aₙ/Dₙ）中，R 的任何一个元组 t 应满足条件：\n\nt ∈ D₁\
    \ * D₂ … * Dₙ\n\n虽然满足上述条件的元组是合乎语法的，但是，并不是每个合乎语法的元组都能成为 R 的元组，它还要受到语义上的限制（完整性约束）。\n\
    \n> r ⊆ r′ ⊆ D₁ × D₂ × … × Dₙ，\n> \n> 其中，r 为某关系 R 在给定时间的元组的集合，即 R 的值，r′ 为所有满足完整性约束的元组的集合。"
  merge: -1
  img_proc: true
- pgno: 97
  md: '例如，一个大学生的年龄在5岁~100岁之间。身高<3米……，这就是语义上的限制。数据的语义不但限制属性的值，而且还会制约属性间的关系。


    **例：** 在一个R中，作为主键的属性或属性组，其值不为空或不重复出现等等。这些都是语义施加在属性间的限制。称为**完整性约束**。


    目前，大多数DBMS都提供了完整性约束检查。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 关系数据模型的完整性约束共分为4类：


    1. 域完整性约束

    域完整性约束是最简单、最基本的约束。

    属性值应是域中的值，属性的值能否为空，这是由问题的语义决定的。


    例：考试分数（成绩）的取值范围是0~100。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 2. 实体完整性约束


    每一个关系都应有一个主键，用来唯一识别一个元组。它的值不能为空，否则无法区分和识别元组，这就是实体完整性约束。


    目前，大多数DBMS都支持这项检查，但也不是强制和彻底的。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 3. 引用完整性约束


    这是指不同关系之间或同一关系的不同元组间的约束。设关系R有一外键FK，则其某一元组t的外键值为[FK]。


    设FK引用关系R′的主键Pk，R′可以是R，也可以不是R。引用完整性约束要求t[FK]遵守下面的约束：


    ```

    $$t[FK]=\begin{cases}t''[FK] & (t''为R''中某一元组)\\ NULL & \end{cases}$$

    ```


    即外键要么是空缺，要么是引用实际存在的主键值。'
  merge: -1
  img_proc: true
- pgno: 101
  md: 引用完整性约束与表之间的关联有关，它是关系数据库管理系统的 一个很重要的功能。用好这 项功能，可以减少由于客户端用户程序的疏忽而 可能给数据库带来的错误。
  merge: -1
  img_proc: true
