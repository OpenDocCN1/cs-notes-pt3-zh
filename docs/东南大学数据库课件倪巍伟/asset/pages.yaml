    问题：似乎多此一举！匹配元组的tid一定在同一桶中！为什么还要按Πₐ(R)=Πᵦ(S)找出匹配元组？这么做有必要么？

    注意：A=B ⇒ h(A)=h(B)，但不一定有：

    h(A)=h(B) ⇒ A=B'
