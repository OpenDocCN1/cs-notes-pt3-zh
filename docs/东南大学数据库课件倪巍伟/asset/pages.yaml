  md: 该元组插入到职工关系中是没有任何问题的，但是，在仓库关系中根本就没有仓库号为WH7的仓库。没有“WH7”仓库，就没有在“WH7”工作的职工。所以插入到职工的元组是有问题的。利用引用完整性约束就可以解决这类问题。
