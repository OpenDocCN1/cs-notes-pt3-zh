- pgno: 327
  md: '# 直接文件存在的问题：


    +   - 键所映射的地址范围固定（地址范围设的太大或太小都不好，为什么？）。

    +   - 地址重叠问题（处理地址重叠增加了开销）。

    +   - 直接文件只对散列键的访问有效。

    +   - 不便于处理变长记录。

    +   - 对于通用的DBMS很难找到通用的散列函数。


    上述原因导致直接文件目前在数据库系统中使用不多。'
