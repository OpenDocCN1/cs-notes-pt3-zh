- pgno: 391
  md: '# 4). 散列连接法


    连接属性R. A和S. B应具有相同的值域，用相同的散列函数，把R和S散列到同一散列文件中。符合连接条件的元组必然在同一桶中（注意：同一桶中的元组未必都满足连接条件）。只需把桶中的匹配元组取出即可获得连接结果。'
  merge: -1
