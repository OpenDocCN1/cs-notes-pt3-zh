- pgno: 375
  md: '# 6.3 依赖于存取路径的规则优化


    代数优化不涉及存取路径，对各种操作的执行策略无从选择。只能在操作的次序和组合上做一些变换和调整。


    单靠代数优化比较粗糙，优化效果有限，合理选择存取路径，往往能收到显著的效果。


    本节结合存取路径的分析，讨论各种基本操作执行的策略及其选择原则。'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 6.3.1 选择操作的实现和优化


    选择操作的执行策略与选择条件、可用的存取路径以及选取的元组数在整个关系中所占的比例有关。


    +   选择条件：

    +   - 等值 =

    +   - 范围 >，<

    +   - 集合 IN, EXISTS, NOT EXISTS

    +   - 复合 AND, OR'
  merge: -1
  img_proc: true
- pgno: 377
  md: '实现方法：顺序扫描、尽量利用散列索引等方法。

    选择操作选择存取路径的启发式规则：

    （1） 对于小关系，顺序扫描。

    （2） 若无索引、散列等存取路径可用，或估计选取的元组数占关系的比例较大（大于20%）且有关属性上无簇集索引，顺序扫描。

    （3） 对于主键的等值选择，优先选用主键的索引或散列。

    （4） 对于非主键的等值选择，若选取的元组数占关系的比例较小（小于20%），可以用无序索引；否则只能用簇集索引或顺序扫描。（为什么？）'
  merge: -1
  img_proc: true
- pgno: 378
  md: '（5）. 对于范围条件，先通过索引找到范围的边界，再通过索引的顺序集沿相应方向搜索，如中选的元组数在关系中所占比例较大，宜采用簇集索引或顺序扫描。


    （6）对于用AND连接的合取选择条件：


    +   - 优先选用多属性索引


    +   - 若有多个可用的次索引，可用预查找处理，最后做其余条件检查


    +   - 个别条件可用（3）（4）（5）之一，求得相应组，再将这些元组用其它条件筛选


    +   - 顺序扫描'
  merge: -1
  img_proc: true
- pgno: 379
  md: '（7）用OR连接的析取选择条件，尚无好的方法。

    只能按其中各个条件分别选出一个元组集，再求这些元组集的并。


    在OR连接的诸条件中，只要有一个条件无合适的存取路径，就只能用顺序扫描！'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 6.3.2 连接操作的实现和优化


    连接开销较大，为查询优化的重点，这里主要讨论二元连接（Two Way Join）。


    实现方法


    +   1. 嵌套循环法（nested loop）

    +   2. 利用索引或散列寻找匹配元组法

    +   3. 排序归并

    +   4. 散列连接法'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 1). 嵌套循环


    关系R与S进行连接操作，最原始的办法是取R的一个元组，与S的所有元组比较，凡是满足连接条件的元组就进行连接并且作为结果输出。然后再取R的下一个元组，和S的所有元组比较，直到R的所有元组比较完为止。


    R ⋈_{R.A=S.B} S

    R (n个)          S (m个)'
  merge: -1
  img_proc: true
- pgno: 382
  md: "# 嵌套循环算法\n\n```\n/*设R有n个元组，S有m个元组*/\ni := 1, j := 1;\nwhile (i ≤ n)\ndo {\n\
    \    while (j ≤ m)\n    do {\n        if R(i)[A] = S(j)[B]\n        then 输出<R(i),\
    \ S(j)>至T;\n        j := j + 1\n    }\n    j := 1, i := i + 1\n}\n```\n\n![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_382_0.png)"
  merge: -1
  img_proc: true
- pgno: 383
  md: 'R为外关系（outer relation），

    S为内关系（inner relation）。

    事实上，关系是以物理块为单位取到内存，设R和S各有一缓冲块，P_R为R的块因子（每块中所含的元组数）。则R每次I/O取P_R个元组，可改进上述算法，使S扫描一次可以与R的P_R个元组比较，那么S的扫描次数为b_R=[n/P_R]。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_383_0.png)'
  merge: -1
  img_proc: true
- pgno: 384
  md: '假设，b_R 和 b_S 分别为关系 R 和关系 S 占用物理块的数目 (b_R=[n/P_R])，n_B 为可供连接使用的缓冲块数。若将其中的 n_B-1
    块作为外关系缓冲块，1 块作为内关系缓冲块。

    则以 R 为外关系、S 为内关系，用嵌套循环法进行连接所需访问的物理块数为 b_R + [b_R / (n_B -1)] * b_S，对应最小 I/O 值。

    问题：增加外关系 R 的缓冲块（每次多取几块 R 的数据）或增加内关系 S 的缓冲块都能减少 I/O 次数。为什么将 n_B-1 块作为外关系缓冲块，1 块作为内关系缓冲块，是最优分配策略？'
  merge: -1
  img_proc: true
- pgno: 385
  md: '问题：嵌套循环法进行连接操作，以R为外关系、S为内关系；还是以S为外关系、R为内关系所需I/O次数更少？作为外层循环的关系，有什么要求？


    应将占用物理块少的关系，作为外关系！'
  merge: -1
