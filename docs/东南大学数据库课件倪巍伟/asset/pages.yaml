- pgno: 217
  md: '# 集合成员资格比较：


    （集合1）IN（集合2）

    （集合1）NOT IN（集合2）


    集合1与集合2可以是一个SELECT子查询，或是值的集合，但它们的结构相同。


    **IN操作表示**：如果集合1中每个元素都在集合2内，那么其逻辑值为true，否则为false；


    **NOT IN 操作表示**：如果集合1中某个元素不在集合2内，那么其逻辑值为true，否则为false；'
  merge: -1
  img_proc: true
