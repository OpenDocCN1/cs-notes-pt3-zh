- pgno: 306
  md: '# 5.2.2 记录在物理块上的分配


    +   磁盘上，记录必须分配到物理块中。


    +   记录跨块存储（spanned）


    +   记录不跨块存储（unspanned）


    设B为物理块的有效空间大小，R为固定长记录的大小，若B > R，则每个物理块可容纳的记录数为：


    ```

    p=[B/R]

    ```


    p称为块因子（Blocking Factor）。'
  merge: -1
  img_proc: true
- pgno: 307
  md: '记录一般不会刚好填满物理块，会留下不用的零头空间：


    B—p×R<R


    | 记录1 | 记录2 | 记录3 | 记录4 |  |

    |---|---|---|---|---|


    为了利用这部分空间，可以利用记录的跨块存储组织(spanned organization)。'
  merge: -1
  img_proc: true
