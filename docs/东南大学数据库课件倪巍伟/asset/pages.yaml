- pgno: 370
  md: '# 代数优化的基本步骤：


    +   1. 以SELECT子句对应投影操作，以FROM字句对应迪卡尔乘积，以WHERE子句对应选择操作，生成原始查询树。

    +   2. 应用变换规则2)、6)、7)、9)、10)，尽可能将选择条件移向树叶方向。

    +   3. 应用连接、迪卡尔乘积的结合律，按照小关系优先做的原则，重新安排连接（笛卡尔乘积）的顺序。

    +   4. 如果笛卡尔乘积后还须按连接条件进行选择操作可将两者组合成连接操作。

    +   5. 对每个叶节点加必要的投影操作，以消除对查询无用的属性。'
  merge: -1
