- pgno: 274
  md: '# 4. 作用的持久性（Durability）


    一个成功执行的事务对DB的影响应是持久的，即使DB因故障受到破坏，也应能恢复。


    这四个性质称为事务的ACID准则。


    下面是一个事务的例子，它将款项由A账户拨给B账户。'
  merge: -1
  img_proc: true
- pgno: 275
  md: "# 示例\n\n```\nBEGIN TRAN\nread A\nA←A−S\nif A < 0 then    /* A款不足 */\n    begin\n\
    \        display “A款不足”\n        ROLLBACK  /*出口1*/\n    end\nelse\n    begin\n\
    \        B←B+S\n        display \"拨款完成\"\n        COMMIT    /*出口2*/\n    end\n\
    ```\n\nROLLBACK 撤销事务的影响，相当于 “do nothing”\n\nCOMMIT 提交，相当于 “do all”。只有在COMMIT之后，事务对数据库产生的变化才对其它事务开放。\n\
    （为什么？）"
  merge: -1
  img_proc: true
- pgno: 276
  md: '+   - 事务的出口：commit 或rollback

    +   - 只有在执行commit之后，事务对数据库所产生的变化才对其他事务开放。

    +   - 执行commit命令时，要封闭中断，以防处理中断时发生故障


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_276_0.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 4. 3 DBMS的进程结构


    +   - DBMS进程结构的划分主要着眼于结构合理和性能提高。

    +   - 应用进程，系统进程（可重入）


    不划分：


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_277_0.png)'
  merge: -1
  img_proc: true
- pgno: 278
  md: '目前，多数DBMS把主要功能组成一个DBMS 核心进程，也有些DBMS除了核心进程外，还把一些可以“缓办”的公共操作组成几个后台服务进程。


    例如预读取可能用到的物理块，延迟写入缓存中的内容，网络服务管理，撤销事务，清除异常结束的DBMS进程等。这些进程在DBMS启动时就建立，为各个事务服务。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 下面主要考虑DBMS核心进程的结构方案：


    +   1. 一个应用进程对应一个DBMS核心进程

    +      优点： 实现容易

    +      缺点：

    +      (1). 进程的创建、撤销、通信和切换的开销大。

    +      (2). 并发事务的增加，进程数激增，内存空间有限，性能下降。

    +      (3). 不利于事务共享内存空间。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 2. 单进程多线程DBMS进程结构


    线程是现代OS引入的概念。


    +   - 以线程为程序并发执行的单位；

    +   - 一个进程中可创建多个可以相互切换的线程；

    +   - 这些线程中至少有一个处于就绪状态，进程才处于就绪状态；

    +   - 进程运行时，其中必有一个线程运行；

    +   - 同一进程所属的线程共享进程占用的资源，属于线程本身的专用资源很少，描述线程的状态也比进程要少，因此，线程所需资源比进程少；

    +   - 线程的切换开销和线程间的通信开销小。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '在多处理机系统中，引入线程，增强了进程的可并发程度。


    单进程多线程的DBMS中，系统只创建一个DBMS进程（用户接口仍然是进程）。该进程中有常驻的公共服务线程和应用户要求而创建的用户线程。


    ——DBMS的并发执行从进程级改为线程级。'
  merge: -1
  img_proc: true
- pgno: 282
  md: "尽管很多现代OS的核心具有线程管理的功能，但对DBMS来说，还是在DBMS进程（相对于OS，是用户进程）中实现线程为宜。理由如下：\n\n+   （1）可以按照DBMS的需要确定线程调度策略；\n\
    +   \n+   （2）线程的切换在用户态，不必转入操作系统的核心态，切换开销小；\n+   \n+   （3）可以在不支持线程的操作系统上运行，减少对操作系统的依赖，有利于提高操作系统的可移植性。"
  merge: -1
  img_proc: true
- pgno: 283
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 4.4 DBMS的系统结构


    +   1. 分时系统环境下的集中式数据库系统结构


    应用的要求以及软硬件条件决定了数据库系统以集中为宜，数据库建立在本单位的主要计算机上，用户通过终端或远距离终端分时访问。


    数据及其管理都是集中的，数据库系统的所有功能，从用户接口到DBMS核心都集中在DBMS所在的计算机上。'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 2. 网络环境下的客户/服务器结构


    20世纪70年代：微机的出现和迅速发展；计算机网络的发展和广泛应用，改变了计算机应用系统的格局。


    客户机/服务器是一种特殊的分布式处理系统。其中，有一至多台称为客户机的计算机和一至多台称为服务器的计算机通过网络联接。


    可以将DBMS的核心部分放在服务器中，而客户机处理数据库的接口部分。客户机也可以有自己的局部DBMS。'
  merge: -1
  img_proc: true
- pgno: 286
  md: <!-- no content -->
  merge: -1
  img_proc: true
