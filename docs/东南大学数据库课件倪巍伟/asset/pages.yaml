- pgno: 328
  md: '# 3. 索引文件


    索引相当于一个映射机构，把关系中相应记录的某个（些）属性的键值转换为该记录的存储地址（或地址集）。


    ![](img/d60e7a4ddfb3f937df5e8fe8b1dff3bd_328_0.png)


    | SNO | Address |

    | --- | --- |

    | 900412 | @addr2 |

    | 900417 | @addr1 |

    | 900418 | @addr3 |

    | ... | ... |


    学生表的索引文件'
  merge: -1
  img_proc: true
- pgno: 329
  md: '+   - 索引与散列的区别——索引文件有记录才占用存储空间，使用散列空文件也占用全部文件空间。

    +   - 索引本身占用空间，但索引一般较记录少得多


    针对非散列键和非索引属性的访问，都不能有效发挥直接文件或索引文件的优势。散列或索引失效时，两者谁的访问代价更大？'
  merge: -1
  img_proc: true
- pgno: 330
  md: '+   1. 主索引——以主键为索引键（primary index）。

    +   2. 次索引——以非主键为索引键（secondary index），建立次索引可以提高查询的效率，但增加了索引维护的开销。

    +   3. 倒排文件——主索引+次索引的极端情况（文件的所有属性上都建立索引），有利于多属性值的查找，但数据更新时开销很大。'
  merge: -1
  img_proc: true
- pgno: 331
  md: '为了便于检索，索引项总是按索引键排序。


    文件中的记录按索引键排序吗？


    注意：索引项记录，并不是文件中的记录


    按索引键排序


    受按门牌号找住户的启示（住户在“物理”上按门牌号码排序），提出非稠密索引。'
  merge: -1
