- pgno: 119
  md: '设有两个关系 R 和 S，它们的目分别为 n_r 和 n_s；它们的元组数分别为 |R| 和 |S|，则 R 和 S 的笛卡尔积为：


    R × S={⟨t,g⟩|t ∈ R and g ∈ S}


    ⟨t, g⟩为 t 和 g 的拼接，即 R × S 仍为一个关系，它的目为 n_r+n_s，元组数为 |R|×|S|。


    若 R 和 S 中有相同的属性名，在这些属性名前加上关系名作为限定词，进行区别。'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 连接操作


    连接操作是双目（二元操作）操作。


    按给定条件，把满足条件的两个关系所有元组，按一切可能的拼接后形成的新关系，记为R∞S。


    即 R∞<连接条件>S = σ<连接条件>(R × S)


    连接条件为两关系中对应属性的比较，对应属性不一定同名，但要有相同的域。其普遍表示形式为：

    <条件1>and<条件2>and...and<条件k>


    每个条件的普遍形式为：Aᵢ θ Bⱼ

    Aᵢ为R的一个属性，Bⱼ为S中与Aᵢ对应的属性。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '连接条件 θ 为：=，<，≤，>，≥，≠


    当所有连接条件中的 θ 都为“=”时，称为**等连接**，在等连接结果中，对应属性的值是相同的，不用重复。


    消除冗余属性的等连接称为**自然连接**，它是“连接”操作的一个重要特例，实用价值很大，它要求**被连接的关系有相同的两个属性名**。


    **注：自然连接完成三件事：**


    +   1. `E R × S`：（笛卡儿积）

    +   2. `&` 在 `R × S` 上选择同时满足 `R.A_i = S.A_i` 的所有元组。

    +   3. ● 去掉重复属性；'
  merge: -1
  img_proc: true
