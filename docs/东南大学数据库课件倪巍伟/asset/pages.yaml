- pgno: 531
  md: '# 10.4 连接依赖


    前面所讲的函数依赖和多值依赖都是数据语义对数据所施加的某种限制。这些依赖关系可以统称为数据依赖（Data Dependency, DD）。数据依赖不仅包含函数依赖和多值依赖，还有其他一些依赖。


    函数依赖实际表现为对属性值的约束，例如，王平是计算机系的教师，若有函数依赖TN→D（参见图10-1），则在TN为王平的元组中，其对应的D必为计算机系，不能为其他值。'
