  md: 【例10-3】 取图10-1的一部分组成关系模式R（C#，TN，D），其函数依赖关系见图10-6，即F= {C#→TN，TN→D}。C#→D为F所逻辑蕴涵，如图10-6中虚线所示。如果R分解为两个关系R1（C#，TN），R2（C#，D），则由于C#是R的主键，故R1和R2中都含有C#。如前所述，这样的分解是无损分解。但函数依赖TN→D不能被{C#→TN，C#→D}所逻辑蕴涵，故分解ρ={R1，R2}不保持依赖。TN和D分属于R1和R2。R2中某门课的系名D应是R1中教该门课的教师所在系。如果R1中的教师所在的系变了，则需要修改R2中相应的属性D的值。更有甚者，如果一位教师不教课，则无法表示这位教师所在系的信息。
