- pgno: 561
  md: '# 算法10-4 求分解关系模式为BCNF的一个无损分解。


    输入：关系模式R及其函数依赖集F。


    输出：分解R为BCNF的一个无损分解。


    方法：初始化 ρ = {R} 。


    如果 S 为 ρ 中的一个非BCNF关系模式，则 S 中必有非平凡函数依赖 X→A，其中 X 不是 S 的超键。将 S 分解为 S₁(XA) 和 S₂(Uₛ−A)，式中
    Uₛ 为 S 的属性集。由于 (XA) ∩ (Uₛ−A) = X，(XA) − (Uₛ−A) = A，而 X→A 成立，则有 (XA) ∩ (Uₛ−A) →
    (XA) − (Uₛ−A)，故 S 可以无损地分解为 S₁ 和 S₂，可用 S₁, S₂ 取代 ρ 中的 S。如此反复进行下去，直至 ρ 中所有关系模式都是BCNF为止。因为
    ρ 开始是无损分解（仅有 R），且以后每次分解都是无损分解，所以根据引理10-7，ρ 始终都是无损分解。'
  merge: -1
  img_proc: true
