  md: '例 3-19 试定义一视图GRADE-AVG，表示学生的平均成绩，其中包括SNAME和AVG GRADE（平均成绩）两个属性。


    语句：


    ```

    CREATE VIEW GRADE-AVG(SNAME, AVG GRADE)

    AS SELECT SNAME, AVG(GRADE)

    FROM STUDENT, SC

    WHERE STUDENT. SNO=SC. SNO

    GROUP BY SNAME;

    ```


    可见，视图实际上是一个SELECT语句。'
