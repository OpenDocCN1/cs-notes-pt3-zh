- pgno: 522
  md: '# 算法10-1 计算属性集 X 关于 F 的闭包 X⁺。


    输入：属性集 X 为 U 的子集，函数依赖集 F。


    输出：X⁺。


    方法：按下列方法计算属性集序列 X⁽⁰⁾, X⁽¹⁾, …, X⁽ⁱ⁾…


    +   (1) 初始化 X⁽⁰⁾ = X，i = 0。

    +   (2) 求属性集 B = { A | ( ∀ V ) ( ∀ W ) ( V → W ∈ F ∧ ∀ X⁽ⁱ⁾ ∧ A ∈ W ) }。

    +   (3) X⁽ⁱ⁺¹⁾ = B ∪ X⁽ⁱ⁾。

    +   (4) 判别 X⁽ⁱ⁺¹⁾ = X⁽ⁱ⁾。

    +   (5) 若不等，i = i + 1，返回 (2)；若相等，X⁺ = X⁽ⁱ⁾，结束。'
  merge: -1
  img_proc: true
- pgno: 523
  md: '【例10-1】设 F = {AB→C，D→EG，C→A，BE→C，BC→D，CG→BD，ACD→B，CE→AG}，试用算法10-1计算 (BD)⁺。


    解：令 X⁽⁰⁾ = BD。


    找左部为BD的子集的函数依赖，只有D→EG。X⁽¹⁾ = BD ∪ EG = BDEG，找左部为BDEG的子集的函数依赖，有D→EG，BE→C。X⁽²⁾ =
    BDEG ∪ EGC = BCDEG


    找左部为BCDEG的子集的函数依赖，有D→EG，C→A，BE→C，BC→D，CG→BD，CE→AG。X⁽³⁾ = BCDEG ∪ ABCDEG = ABCDEG'
  merge: -1
  img_proc: true
