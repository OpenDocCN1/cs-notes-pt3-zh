- pgno: 527
  md: '# 10.3 多值依赖


    除了函数依赖外，关系的属性间还有其他一些依赖关系，多值依赖（MultiValued Dependency, MVD）是其中之一。


    在多值依赖（表示为X→→Y，读做X多值决定Y，或Y多值依赖于X）中，对于给定的X值，其对应的是Y的一组数值（其个数可以从零到多个），而且这种对应关系，对于给定的X值所对应的（U−X−Y）每个值都能成立。'
  merge: -1
  img_proc: true
- pgno: 528
  md: '定义10-9 设X，Y是关系模式R的属性集，如果对于R的任何值 r，都有如下的性质：


    则称R满足X→→Y。


    与函数依赖一样，多值依赖也有 一组公理：


    A 4：互补律

    如果X→→Y，则X→→（U−X−Y）。


    如果需要，可用X→⊆Y |（U−X−Y）表示多值依赖，以强调其互补关系。


    A 5：扩展律（多值依赖）

    如果X→→Y，而V W，则WX→→V Y。'
  merge: -1
