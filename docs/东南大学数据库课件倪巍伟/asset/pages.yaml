- pgno: 259
  md: '# 3.6.2 临时视图和递归查询


    在复杂查询中，将查询中相对独立部分作为查询的中间结果，定义临时视图。


    # 临时视图与普通视图的区别：


    +   ① 功能相同，但临时视图仅用于附在临时定义后的查询语句中；

    +   ② 查询语句结束，临时视图便不在存在，不需用 `DROP VIEW` 去撤消。

    +   ■ 创建临时视图只需将 `CREATE VIEW` 改为 `WITH`。'
  merge: -1
  img_proc: true
