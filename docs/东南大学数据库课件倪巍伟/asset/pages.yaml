  md: '# 6.3.3 投影操作的实现


    一般与选择、连接同时进行，无需附加的 I/O开销。


    若投影属性集中不包含主键，则投影结果中可能出现重复元组。


    消除重复元组可以用排序或散列等方法。


    散列法：将投影结果按某一属性或多个属性散列成一个文件，当一个元组被散列到一个桶中时，可检查是否与桶中已有元组重复。'
