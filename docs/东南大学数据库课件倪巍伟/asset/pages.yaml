- pgno: 145
  md: '# 2.4 对传统数据模型的评价


    传统数据模型有层次数据模型、网状数据模型、关系数据模型。


    # 特点：


    +   ● 都继承了文件中的记录、字段等概念。

    +   ● 物理级也借鉴了文件的索引、散列等存取方法。

    +   ● 向用户提供了统一的数据模型和相应的数据库语言。

    +   ● 都在记录的基础上定义了数据的基本结构、约束和操作。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 传统数据模型的不足：


    +   - 以记录为基础，不能很好地面向用户和应用。\n- 记录和实体不一定相对应。\n- 不能以自然的方式表示实体间联系。\n- 语义贫乏。\n- 数据类型少，难以满足应用需要。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 2.5 E-R 数据模型


    +   - 1976年由P. Chen提出：

    +     - 建立一种统一的数据模型，来概括层次、网状和关系三种传统数据模型；

    +     - 作为3种数据模型间相互转换的中间模型；

    +     - 作为超脱DBMS的一种概念数据模型，用比较自然的方式模拟现实世界。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   - E-R数据模型用的最成功和最广泛的是作为数据库概念设计的数据模型。

    +   - E-R数据模型不是面向实现，而是面向现实世界。其设计的出发点是有效自然的模拟现实世界，而不是首先考虑它在机器中的实现问题。

    +   - E-R数据模型是一种有代表性的非传统数据模型。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 2.5.1 基本概念


    E-R（实体联系数据模型）与传统数据模型的区别在于：E-R不是面向实现，而是面向现实世界的，因此，它能比较自然地描述现实世界。


    E-R中有三个重要的抽象概念：


    实体：可以相互区别，且可被人们识别的事、物、概念等系统抽象为实体。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '例如，学生的全体，就是一个实体集。其中的每一个学生是实体集的一个实例或值。因此，**实体集通常作为型来定义**（E-R中有型与值之分）。


    如：Es＝{e | e是学生}


    其中：Es是学生实体集，e是学生实体。


    **注：** E-R中，大写字母表示实体集，小写字母表示实体。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '**属性：**反映实体特征的称之为实体的属性，每个属性都有其取值的范围，称值集。

    同一实体集中，每个实体的属性及其域是相同的，但值可不同，属性可以是单域的简单属性，也可以是多域的组合属性（如通信地址是个组合属性，由省、市、区、街道等组成）。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '**实体键：** 能唯一识别实体的属性或属性组。一个实体的键可能有多个，选定一个作为实体的键。


    与传统数据模型比，E-R对属性的限制较少，故有利于自然地模拟现实世界。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '联系：表示实体与实体之间的关系。参与联系的实体数=2，称为二元联系。参与联系的实体数>2，称为多元联系。


    在E-R模型中，联系的类型有三种：


    +   (1) 1:1（一对一联系）

    +   (2) 1:n（一对多联系）

    +   (3) m:n（多对多联系）'
  merge: -1
  img_proc: true
- pgno: 154
  md: '**实体参与度：**表示实体参与联系的最小次数和最大次数，通常用（m:n）表示。

    例如，规定每个学生最少应选三门课，最多可选六门课。则学生在选课联系中的参与度可表示为（3:6）。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '注：m=0，表示非强制性，即实体不一定参与联系。


    如果一门课可以无人选，但最多只能允许100人选则课程在选课联系中的参与度为（0, 100）。


    m>0，表示强制性的，即实体一定要参与联系。在E-R模型中，实体和联系均可有属性，如选课联系的属性可有成绩、选课时间等。'
  merge: -1
  img_proc: true
- pgno: 156
  md: 现实世界中还有一种特殊的实体，称为弱实体，这种实体不能单独存在，总是依附某个实体，如亲戚是依赖于职工这个实体，家属是依赖于某一职工。这一类实体通常取其所依附的实体的Key作为本身的Key的一部分。
