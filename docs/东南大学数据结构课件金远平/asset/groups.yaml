  - "[PAGE 608]\n\n```\ntemplate <class T>\nvoid QuickSort (T *a, const int left,\
    \ const int right)\n{ // Sort a[left:right] into non-decreasing order. a[left]\
    \ is\n// arbitrarily chosen as the pivot. Assume a[left]≤a[right+1].\n    if (left\
    \ < right) {\n        int i=left, j=right+1, pivot=a[left];\n        do {\n  \
    \          do i++; while (a[i]<pivot);\n            do j --; while (a[j]>pivot);\n\
    \            if (i<j) swap(a[i], a[j]);\n        } while (i<j);\n        swap(a[left],\
    \ a[j]);\n        QuickSort(a, left, j-1);\n        QuickSort(a, j+1, right);\n\
    \    }\n}\n```"
