    \ i.\n  while (parent[i]>=0) i=parent[i];\n  return i;\n}\n```\n\n# SimpleUnion\
    \ 和 SimpleFind 的分析：\n\n给定 $S=\\{i\\}$，$0 \\le i < n$，执行\n\nUnion(0,1), Union(1,2),\
    \ ..., Union(n-2,n-1), Find(0), Find(1), ..., Find(n-1)    得到\n\n$n-1$ 次合并需要 $O(n)$\n\
    \n$n$ 次查找需要 $O\\left(\\sum_{i=1}^{n} i\\right)=O(n^2)$。\n\n性能不太好：\n为了避免生成退化树而进行改进。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_405_0.png)\n\n**定义 [Union(i,j) 的加权规则]：**\
    \ 如果根为 i 的树中的节点数少于根为 j 的树中的节点数，则令 j 成为 i 的父结点；否则令 i 成为 j 的父结点。\n\n例如：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_406_0.png)\n\
    \n初始\n\nUnion(0,1)\n\nUnion(0,2)\n\n我们需要一个计数字段来知道每棵树中有多少节点，它可以作为根节点父字段中的负数来维护。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_407_0.png)\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_407_1.png)\n\
    \n```\nvoid Sets::WeightedUnion (int i, int j)\n{ // Union sets with roots i and\
    \ j, i≠j, using the weighting rule\n// parent[i] = - count[i] and parent[j] =\
    \ - count[j]\nint temp = parent[i] + parent[j];\nif (parent[i] > parent[j]) {\
    \  // i has fewer nodes\nparent[i] = j;\nparent[j] = temp;\n}\nelse {  // j has\
    \ fewer nodes or\n// i and j have the same number of nodes\nparent[j] = i;\nparent[i]\
    \ = temp;\n}\n}\n```\n\n"
