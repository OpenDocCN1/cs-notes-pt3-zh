    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_713_1.png)\n\n# 8.2.2.4 数字分析\n\n在静态文件的情况下很有用。\n\
    \n- 将每个 k 解释为使用某进制 r 的数字。\n- 检查每个 k 的数字，删除分布最偏斜的数字——直到剩余的位数足够小以给出地址。\n\n例如，考虑学生学号：\n\
    \n| 7 | 1 | 1 | 1 | 4 | 1 | 0 | 1 |\n|---|---|---|---|---|---|---|---|\n| 7 |\
    \ 1 | 1 | 1 | 4 | 1 | 0 | 2 |\n| 7 | 1 | 1 | 1 | 4 | 1 | 0 | 3 |\n|   |   |  \
