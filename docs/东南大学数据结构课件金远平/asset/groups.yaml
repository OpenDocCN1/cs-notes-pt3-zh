  md: "\nTo construct minimum-cost spanning tree, we use a least-cost criterion and\
    \ the constraints are:\n\n+   1. must use only edges within G.\n+   2. must use\
    \ exactly n-1 edges.\n+   3. may not use edges that produce a cycle.\n\n## 6.3.1\
    \ Kruskal Algorithm\n\n+   - The minimum-cost spanning tree T is built by adding\
    \ edges to T one at a time.\n+   - Edges are selected for inclusion in T in non-decreasing\
    \ order of their cost.\n+   - An edge is added to T if it does not form a cycle\
    \ with the edges already in T.\n+   - Exactly n-1 edges will be selected into\
    \ T.\n\n### Example 6.4:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_520_0.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_520_1.png)\n\n(a) G\n\n(b)\n\n### The\
    \ cost of remaining edges: 10, 12, 14, 16, 18, 22, 24, 25, 28\n\n(c)\n\n(d)\n\n\
    Remaining edges: 18—(3,6), 22, 24—(4,6), 25, 28\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_523_0.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_523_1.png)\n\n(g) (3,6) discarded\n\
    \n(h) (4, 6) discarded\n\n## Given G = (V, E), we have the algorithm:\n\n```\n\
    1 T = ∅;\n2 while ((T contains less than n-1 edges) && (E not Empty)) {\n3   choose\
    \ an edge (v, w) from E of lowest cost;\n4   delete (v, w) from E;\n5   if ((v,\
    \ w) does not create a cycle in T) add (v, w) to T;\n6   else discard (v, w);\n\
    7 }\n8 if (T contains fewer than n-1 edges)\n    cout<<\"no spanning tree\"<<endl;\n\
    ```\n\n## Analysis:\n\n+   - To perform lines 3 and 4, E can be organized as a\
    \ min heap, so the next edge can be chosen and deleted in O(log e). Initialization\
    \ of the heap takes O(e) (ref. 7.6).\n+   - To perform line 5, vertices in T can\
    \ be placed into a set using Union-Find. The total cost is O(e·α(e)).\n\nThe total\
    \ cost: O(e log e).\n\n## Correctness:\n\n**Theorem 6.1:** Let G be any undirected,\
    \ connected graph, Kruskal’s algorithm generates a minimum-cost spanning tree.\n\
    \nThe proof is left as a self-study exercise.\n\n**Exercises:** P359-1\n\n## 6.4\
    \ Shortest Paths\n\n## 6.4.1 Single Source/All Destinations: Nonnegative Edge\
    \ Cost\n\nProblem: given a digraph G=(V, E), a length function length(i, j)≥0\
    \ for <i, j>∈E(G), and a source vertex v, to determine the shortest path from\
    \ v to all remaining vertices of G.\n\n### Example:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_528_0.png)\n\
    \n(a) G\n\n| path | Length |\n|------|--------|\n| 1) 0, 3 | 10 |\n| 2) 0, 3,\
    \ 4 | 25 |\n| 3) 0, 3, 4, 1 | 45 |\n| 4) 0, 2 | 45 |\n\n(b) Shortest paths from\
    \ 0\n\nAssume paths are generated in non-decreasing order of length, observe:\n\
    \n(1) If the next shortest path is to u, then it begins at v, ends at u, and goes\
    \ through only vertices in S. To prove, assume w on this path is not in S, then\
    \ the v to u path contains a path from v to w as shown below:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_530_0.png)\n\
    \n(3) Having selected a vertex u as in (2), u becomes a member of S. Now dist[w],\
    \ w ∉S, may change. If it does, it must be due to a shorter path from v to u and\
    \ then to w.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_532_0.png)\n\nThe v to\
    \ u path must be the shortest v to u path, and the u to w path is just the edge\
    \ <u, w>. So if dist[w] is to decrease, it is because the current dist[w]>dist[u]+length(u,\
    \ w).\n\nNote the u to w path with any intermediate vertex x∈S cannot affect dist[w].\
    \ Because:\n① length(v-u-x)>dist[x]\n② length(v-u-x-w)>length(v-x-w)≥dist[w]\n\
    As shown below:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_533_0.png)\n\n## Assume:\n\
    \n+   - n vertices numbered 0, 1, ..., n-1.\n+   - s[i]=false if i ∉S, s[i]=true\
    \ if i ∈S.\n+   - length[i][j]. If <i, j> ∉E(G) and i≠j, set length[i][j] to some\
    \ large number.\n\n```\nclass MatrixWDigraph {\nprivate:\n    double length[NMAX][NMAX];\
    \ // NMAX is a constant\n    double *dist;\n    bool *s;\npublic:\n    void ShortestPath(const\
