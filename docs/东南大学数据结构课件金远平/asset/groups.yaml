    \ (2), actions ①,②,③ are the same, ④ is special for (2).\n\n```\n```cpp\ntemplate\
    \ <class T>\nvoid ThreadedTree<T>::InsertRight(ThreadedNode<T>* s,\n         \
    \                         ThreadedNode<T>* r)\n{ // insert r as the right child\
    \ of s\n    r→rightChild=s→rightChild;        // ①\n    r→rightThread=s→rightThread;\
    \      // ① note s!=t.root,\n    r→leftChild=s;                    // ②\n    r→leftThread=true;\
    \                // ②\n    s→rightChild=r;                   // ③\n    s→rightThread=false;\
    \              // ③\n    if (! r→rightThread) {    // case (2)\n        ThreadedNode<T>*\
    \ temp=InorderSucc(r); // ④\n        temp→leftChild=r;                      //\
    \ ④\n    }\n}\n```\n```\n\n## Exercises: P277-1, P278-4\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_353_0.png)\n\
    \nFig. 5.24 Max heaps\n\nSince max heap is a complete binary tree, we use array\
