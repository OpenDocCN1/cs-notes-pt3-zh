  - '[PAGE 752]


    +   - rᵢᵢ=0, wᵢᵢ=qᵢ, 0≤i≤n.


    +   - The optimal b.s.t. for a₁,......, aₙ is T₀ₙ. Its cost is c₀ₙ, root r₀ₙ.


    If Tᵢⱼ is an optimal b.s.t. for aᵢ₊₁,......, aⱼ and rᵢⱼ=k, i<k ≤j, then Tᵢⱼ has
    2 subtrees L and R.


    L contains the identifiers aᵢ₊₁,......, aₖ₋₁.


    R contains the identifiers aₖ₊₁,......, aⱼ.'
  - '[PAGE 753]


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_753_0.png)


    The cost c_ij of T_ij is

    c_ij = p_k + cost(L) + cost(R) + w_{i,k-1} + w_{k j}    (10.2)'
  - '[PAGE 754]


    From (10.2), if c_ij is to be minimal, then cost(L)=c_{i,k-1} and cost(R)=c_{kj},
    as otherwise we could replace either L or R by a subtree with a lower cost, thus
    generating a b.s.t. for a_{i+1},......, a_j with a lower cost than c_ij. This
    violates the assumption that T_ij is optimal.


    Hence, E.q.(10.2) becomes


    c_ij = p_k + w_{i,k-1} + w_{kj} + c_{i,k-1} + c_{kj}

    = w_{ij} + c_{i,k-1} + c_{kj}      (10.3)'
  - '[PAGE 755]


    Since $T_{ij}$ is optimal, from (10.3) we know $r_{ij}=k$ is such that


    $w_{ij}+c_{i,k-1}+c_{kj}=\min_{i<l\le j}\{w_{ij}+c_{i,l-1}+c_{lj}\}$


    or


    $c_{i,k-1}+c_{kj}=\min_{i<l\le j}\{c_{i,l-1}+c_{lj}\}$ (10.4)


    # Note also


    $w_{ij}=w_{i,j-1}+p_j+c_j$.


    (10.4) gives us a means of obtaining $r_{0n}$, $T_{0n}$ and $c_{0n}$, starting
    from $r_{ii}=0$, $T_{ii}=\varnothing$ and $c_{ii}=0$.'
  - '[PAGE 756]


    # Example 10.2:


    Let n=4, (a₁, a₂, a₃, a₄)=(do, if, return,while).


    Let (p₁, p₂, p₃, p₄)=(3,3,1,1)


    and (q₀, q₁, q₂, q₃, q₄)=(2,3,1,1,1).


    The p’s and q’s are as integer for convenience.


    Initially, wᵢᵢ = qᵢ, rᵢᵢ=0, cᵢᵢ=0, 0≤i≤4.


    Using (10.3) and (10.4), we get


    w₀₁ = p₁+ w₀₀+ w₁₁ = p₁+ q₁+ w₀₀ = 8


    c₀₁ = w₀₁+ min {c₀₀+ c₁₁} = 8


    r₀₁ = 1'
  - '[PAGE 757]


    w₁₂ = p₂ + w₁₁ + w₂₂ = p₂ + q₂ + w₁₁ = 7


    c₁₂ = w₁₂ + min {c₁₁ + c₂₂} = 7


    r₁₂ = 2


    w₂₃ = p₃ + w₂₂ + w₃₃ = p₃ + q₃ + w₂₂ = 3


    c₂₃ = w₂₃ + min {c₂₂ + c₃₃} = 3


    r₂₃ = 3


    w₃₄ = p₄ + w₃₃ + w₄₄ = p₄ + q₄ + w₃₃ = 3


    c₃₄ = w₃₄ + min {c₃₃ + c₄₄} = 3


    r₃₄ = 4'
