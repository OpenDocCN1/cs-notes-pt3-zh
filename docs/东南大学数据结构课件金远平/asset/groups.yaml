  - '[PAGE 771]


    With equal search probabilities for keys, both the maximum and average search
    time will be minimized if the binary search tree is maintained as a complete binary
    tree at all times.


    However, since the dynamic situation, it is difficult to achieve this without
    making the time required to insert a key very high.


    It is, however, possible to keep the tree balanced to ensure both average and
    worst-case retrieval time of O(log n) for a tree with n nodes.'
  - '[PAGE 772]


    AVL tree (introduced by Adelson-Velskii and Landis) is a binary search tree that
    is balanced with respect to the heights of subtrees.


    Definition: an empty tree is height-balanced. If T is a nonempty binary tree with
    T_L and T_R as its left and right subtrees respectively, then T is height-balanced
    iff


    +   (1) T_L and T_R are height-balanced and


    +   (2) | h_L - h_R | ≤ 1 where h_L and h_R are the heights of T_L and T_R respectively.'
