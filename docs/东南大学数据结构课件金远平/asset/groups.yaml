    \ $T_{0n}$。其代价为 $c_{0n}$，根为 $r_{0n}$。\n\n如果 $T_{ij}$ 是 $a_{i+1}, \\ldots, a_j$\
    \ 的最优二叉搜索树，且 $r_{ij}=k$，$i < k \\le j$，那么 $T_{ij}$ 有 2 棵子树 L 和 R。\n\n- L 包含标识符\
    \ $a_{i+1}, \\ldots, a_{k-1}$。\n- R 包含标识符 $a_{k+1}, \\ldots, a_j$。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_753_0.png)\n\
    \n$T_{ij}$ 的代价 $c_{ij}$ 为\n\n$$c_{ij} = p_k + \\operatorname{cost}(L) + \\operatorname{cost}(R)\
    \ + w_{i,k-1} + w_{kj} \\quad (10.2)$$\n\n由 (10.2) 可知，若要使 $c_{ij}$ 最小，则须有 $\\\
    operatorname{cost}(L)=c_{i,k-1}$ 且 $\\operatorname{cost}(R)=c_{kj}$，否则我们可以用代价更小的子树替换\
    \ L 或 R，从而为 $a_{i+1}, \\ldots, a_j$ 生成一棵代价低于 $c_{ij}$ 的二叉搜索树。这就违反了 $T_{ij}$ 是最优的假设。\n\
    \n因此，式 (10.2) 变为\n\n$$c_{ij} = p_k + w_{i,k-1} + w_{kj} + c_{i,k-1} + c_{kj} =\
    \ w_{ij} + c_{i,k-1} + c_{kj} \\quad (10.3)$$\n\n由于 $T_{ij}$ 是最优的，由 (10.3) 可知\
    \ $r_{ij}=k$ 满足\n\n$$w_{ij}+c_{i,k-1}+c_{kj}=\\min_{i<l\\le j}\\{w_{ij}+c_{i,l-1}+c_{lj}\\\
    }$$\n\n或\n\n$$c_{i,k-1}+c_{kj}=\\min_{i<l\\le j}\\{c_{i,l-1}+c_{lj}\\} \\quad\
    \ (10.4)$$\n\n### 另请注意\n\n$$w_{ij}=w_{i,j-1}+p_j+q_j.$$\n\n(10.4) 为我们提供了一种从 $r_{ii}=0$、$T_{ii}=\\\
    varnothing$ 和 $c_{ii}=0$ 出发，求得 $r_{0n}$、$T_{0n}$ 和 $c_{0n}$ 的方法。\n\n## 示例 10.2\n\
    \n设 $n=4$，$(a_1, a_2, a_3, a_4)=(do, if, return, while)$。\n\n设 $(p_1, p_2, p_3,\
    \ p_4)=(3,3,1,1)$，$(q_0, q_1, q_2, q_3, q_4)=(2,3,1,1,1)$。\n\n为方便起见，p 和 q 均取整数。\n\
    \n初始时，$w_{ii}=q_i$，$r_{ii}=0$，$c_{ii}=0$，$0 \\le i \\le 4$。\n\n利用 (10.3) 和 (10.4)，我们得到\n\
    \n$$w_{01}=p_1+w_{00}+w_{11}=p_1+q_1+w_{00}=8$$\n\n$$c_{01}=w_{01}+\\min\\{c_{00}+c_{11}\\\
    }=8$$\n\n$$r_{01}=1$$\n\n$$w_{12}=p_2+w_{11}+w_{22}=p_2+q_2+w_{11}=7$$\n\n$$c_{12}=w_{12}+\\\
    min\\{c_{11}+c_{22}\\}=7$$\n\n$$r_{12}=2$$\n\n$$w_{23}=p_3+w_{22}+w_{33}=p_3+q_3+w_{22}=3$$\n\
    \n$$c_{23}=w_{23}+\\min\\{c_{22}+c_{33}\\}=3$$\n\n$$r_{23}=3$$\n\n$$w_{34}=p_4+w_{33}+w_{44}=p_4+q_4+w_{33}=3$$\n\
    \n$$c_{34}=w_{34}+\\min\\{c_{33}+c_{44}\\}=3$$\n\n$$r_{34}=4$$\n\n| i \\ j-i |\
    \ 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|---|\n| 0 | w₀₀=2<br>c₀₀=0<br>r₀₀=0\
    \ | w₁₁=3<br>c₁₁=0<br>r₁₁=0 | w₂₂=1<br>c₂₂=0<br>r₂₂=0 | w₃₃=1<br>c₃₃=0<br>r₃₃=0\
    \ | w₄₄=1<br>c₄₄=0<br>r₄₄=0 |\n| 1 | w₀₁=8<br>c₀₁=8<br>r₀₁=1 | w₁₂=7<br>c₁₂=7<br>r₁₂=2\
    \ | w₂₃=3<br>c₂₃=3<br>r₂₃=3 | w₃₄=3<br>c₃₄=3<br>r₃₄=4 | |\n| 2 | w₀₂=12<br>c₀₂=19<br>r₀₂=1\
    \ | w₁₃=9<br>c₁₃=12<br>r₁₃=2 | w₂₄=5<br>c₂₄=8<br>r₂₄=3 | | |\n| 3 | w₀₃=14<br>c₀₃=25<br>r₀₃=2\
