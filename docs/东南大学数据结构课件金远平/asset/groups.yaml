    # Fig. 6.36


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_551_0.png)


    Definition: Vertex i in an AOV network G is a predecessor of j iff there is a
    directed path from i to j. If <i, j> is an edge in G then i is an immediate predecessor
    of j and j immediate successor of i.


    Definition: A precedence relation that is both transitive and irreflexive is a
    partial order.


    A directed graph with no cycle is an acyclic graph.


    Given a AOV network G, we are concerned with determining whether or not it is
    irreflexive, i.e., acyclic.


    And we need to generate the topological order of vertices in G.


    ## Definition: A topological order is a linear ordering of vertices of a graph
    such that, for any two vertices i and j, if i is a predecessor of j in the network,
    then i precedes j in the linear ordering.


    Two possible topological orders of Fig. 6.36 are:


    - 1. C1,C2,C4,C5,C3,C6,C8,C7,C10,C13,C12,C14,C15,C11,C9

    - 2. C4,C5,C2,C1,C6,C3,C8,C15,C7,C9,C10,C11,C12,C13,C14


    # Topological sorting algorithm


    Idea: list a vertex with no predecessor, then delete this vertex together with
    all edges leading out of it from the network. Repeat the above until all vertices
    have been listed or all remaining vertices have predecessors.


    # Formally,


    ```

    1 Input the AOV network, let n be the number of vertices;

    2 for (int i=0; i<n; i++) // output the vertices

    3 {

    4   if (every vertex has a predecessor) return;

    5   // network has a cycle and is infeasible.

    6   pick a vertex v that has no predecessors;

    7   cout << v;

    8   delete v and all edges leading out of v from the network;

    9 }

    ```


    # Example:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_557_0.png)


    Fig. 6.37

    (a) Initial


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_558_0.png)


    (b) Vertex 0 deleted


    (c) Vertex 3 deleted


    Topological order generated: 0, 3,


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_559_0.png)


    (d) Vertex 2 deleted


    (e) Vertex 5 deleted


    (f) Vertex 1 deleted


    Topological order generated: 0, 3, 2, 5, 1, 4


    # The data representation depends on:


    - (1) Whether a vertex has a predecessor?--- maintain a count of the number of
    immediate predecessors of each vertex.

    - (2) How to delete a vertex together with all its incident edges?--- adjacency
    lists, and decrease the count of all vertices on its adjacency list.


    Whenever the count of a vertex drops to 0, that vertex can be placed onto a list
    of vertices with 0 count.


    Hence, we use adjacency lists representation, and assume:


    - **int *count** is defined as a data member, and its space is allocated in the
    constructor.

    - count[i], 0≤i<n, has been initialized to the in-degree of vertex i. When <i,
    j> is input, the count of j is increased by 1.

    - the list of vertices with 0 count is maintained as a custom stack linked through
    the **count** field since it is of no use after the count has become 0.


    ```

    1 void LinkedGraph::TopologicalOrder()

    2 { //The n vertices of a network are listed in topological order

    3   int top = -1, pos = 0;

    4   for (int i=0; i<n; i++) //create a linked stack of vertices with

    5     if (count[i]==0) { count[i]=top;  top=i;} //no predecessors

    6   for (i=0; i<n; i++)

    7     if (top==-1) throw "network has a cycle.";

    8     int j=top;  top=count[top]; //unstack a vertex

    9     t[pos++] = j;  // store vertex j in topological order

    10    Chain<int>::ChainIterator ji=adjLists[j].begin();

    11    while (ji != adjLists[j].end()) { // decrease the count of

    12      count[*ji]--;

    13      // the successor vertices of j

    14      if (count[*ji]==0) {count[*ji]=top; top=*ji;} //add to stack

    15      ji++; // next successor

    16    }

    17 }

    ```


    # Analysis of TopologicalOrder:


    Very efficient because of a judicious choice of data structure.


    - Lines 4-5 loop: O(n)

    - Lines 6-10 totally O(n)

    - The while loop of 11-15 takes O(dᵢ) for each vertex i, where dᵢ is the out-degree
    of i. The total time for this part is O((∑ᵢ₌₀ⁿ⁻¹ dᵢ)+n)=O(e+n).


    The total time: O(e+n).

    '
