    \        bPos++;\n        }\nelse {\n    c.NewTerm (termArray[aPos].coef, termArray[aPos].exp);\n\
    \    aPos++;\n}\n// add in the remaining terms of *this\nfor (; aPos < terms;\
    \ aPos++)\n    c.NewTerm(termArray[aPos].coef, termArray[aPos].exp);\n// add in\
    \ the remaining terms of b\nfor (; bPos < b.terms; bPos++)\n    c.NewTerm(b.termArray[bPos].coef,\
    \ b.termArray[bPos].exp);\nreturn c;\n}\n```\n\n```cpp\nvoid Polynomial::NewTerm(const\
    \ float theCoeff, const int theExp)\n{ // add a new term to the end of termArray.\n\
