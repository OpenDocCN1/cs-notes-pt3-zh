  mdcn: "\n\n## WeightedUnion 和 SimpleFind 的分析：\n\nWeightedUnion 的时间是 O(1)\n\n执行 find\
    \ 的最大时间由以下决定：\n\n> 引理 5.5：假设我们从单节点树的森林开始。设 T 是一个由加权合并序列创建的具有 m 个节点的树。T 的高度不超过\
    \ ⌊log₂ m⌋ + 1。\n\n## 归纳证明：\n\nm = 1，成立。\n\n假设它对所有具有 i ≤ m-1 个节点的树都成立。\n\n对于 i\
    \ = m，设 T 是一个由 WeightedUnion 创建的具有 m 个节点的树。\n\n考虑最后一次执行的合并，Union(k, j)。\n\n设 j\
    \ 树的节点数为 a，k 树的节点数为 m-a。 不失一般性，假设 1 ≤ a ≤ m/2。 那么 T 的高度要么与 k 相同，要么是 j 的 1 + 高度。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_411_0.png)\n\n如果是前一种情况，T 的高度 ≤ ⌈log₂(m-a)⌉+1\
    \ ≤ ⌈log₂ m⌉+1。\n\n如果是后一种情况，T 的高度 ≤ ⌈log₂ a⌉+2 ≤ ⌈log₂ m/2⌉+2 ≤ ⌈log₂ m⌉+1。\n\n\
    ![](img/15e8d7d94d8ddf02cb6839870195a31e_413_0.png)\n\nroot(i)\n\ni₁\n\ni₂\n\n\
    i\n\nroot(i)\n\ni₁\n\ni₂\n\ni\n\nj = i, ..., i₂, i₁\n\n```\n```cpp\nint Sets::CollapsingFind\
    \ (int i )\n{ // Find the root of tree containing element i. Use the\n  // collapsing\
    \ rule to collapse all nodes from i to the root.\n  for (int r = i; parent[r]\
    \ >= 0; r = parent[r]); // find the root\n  while ( i != r) {\n      int s = parent[i];\n\
    \      parent[i] = r;\n      i = s;\n  }\n  return r;\n}\n```\n```\n\n使用 WeightedUnion\
    \ 和 CollapsingFind 处理合并和查找序列的最坏情况复杂度在引理5.6中陈述。\n\n## 首先，一个增长非常缓慢的函数\n\n$\\alpha(p,q)=\\\
    min\\{z\\ge 1\\mid A(z,\\lfloor p/q\\rfloor)>\\log_2 q\\},\\ p\\ge q\\ge 1$\n\n\
    而阿克曼函数 $A(i,j)$ 定义为：\n\n+   $A(1,j)=2^j$          for $j\\ge1$  \n+   $A(i,1)=A(i-1,2)$\
    \          for $i\\ge2$  \n+   $A(i,j)=A(i-1,A(i,j-1))$          for $i,j\\ge2$\n\
    \nA(1, 2) = 2²\n\nA(3,1) = A(2, 2) = A(1, A(2, 1)) = A(1, A(1, 2))\n    = 2²²\
    \ = 16\n\nA(4,1) = A(3, 2) = A(2, A(3, 1)) = A(2, 16)\n    = A(1, A(2, 15)) =\
    \ 2^{A(2, 15)}\n    = 2^{2^{A(2, 14)}} = ... = 2^{2^{...^{2}}} 16   (very big\
    \ !)\n\n因此对于任何实际的 p 和 q，α(p,q) ≤ 4。\n\n## 引理 5.6 [Tarjan and Van Leeuwen]：假设我们从每棵树只有一个节点的森林开始。设\
    \ T(f, u) 为处理任意交错的 f 次查找和 u 次合并序列所需的最大时间。假设 u ≥ n/2，则\n\n$$k_1(n+f\\,\\alpha(f+n,n))\
    \ \\le T(f,u) \\le k_2(n+f\\,\\alpha(f+n,n))$$\n\n对于某些正常数 $k_1$ 和 $k_2$。\n\n注意\
    \ T(f, u) 即使 $\\alpha(f+n,n)$ 增长非常缓慢也不是线性的。\n\n空间需求是每个元素一个节点。\n\n## 5.10.3 应用于等价类\n\
    \n等价类 ⇔ 不相交集合\n\n初始时，parent[i] = -1, 0 ≤ i ≤ n-1。\n\n处理 i ≡ j，\n\n令 x = find(i),\
    \ y = find(j) --- 2 次查找\n\n如果 x ≠ y 则 union(x, y) --- 最多 1 次合并\n\n因此如果我们有 n 个元素和\
    \ m 个等价对，我们需要 2m 次查找和 min {n-1, m} 次合并。总时间为 O(n+2m α(n+2m,n))。\n\n## 示例：\n\nn\
    \ = 12，处理等价对：\n0 ≡ 4, 3 ≡ 1, 6 ≡ 10, 8 ≡ 9, 7 ≡ 4, 6 ≡ 8, 3 ≡ 5, 2 ≡ 11,\n11 ≡\
    \ 0\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_420_0.png)\n\n(a) 初始树\n\n(b) 处理\
    \ 0 ≡ 4, 3 ≡ 1, 6 ≡10, 和 8 ≡ 9 之后\n\n(c) 处理 7 ≡ 4, 6 ≡ 8, 3 ≡ 5, 和 2 ≡ 11 之后\n\
    \n[-5]\n\n[-3]\n\n[-4]\n\n(d) 处理 11 ≡ 0 之后\n\n# 练习：P316-3\n\n## 5.12 计数二叉树\n\n\
    如果 n=0 或 1，只有 一棵二叉树。\n如果 n=2，有两棵：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_424_0.png)\n\
    \n和\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_424_1.png)\n\n## 如果 n=3，有五棵：\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_425_0.png)\n\n有多少棵具有 n 个节点的不同的二叉树？在推导出解之前，让我们先研究另一个等价问题。\n\
    \n"
