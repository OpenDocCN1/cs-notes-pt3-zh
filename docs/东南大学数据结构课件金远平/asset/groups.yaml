  md: "\n# 10.2 AVL Trees\n\n**Dynamic** collections of elements may also be maintained\
    \ as binary search trees.\nFig. 10.8 shows the binary search tree obtained by\
    \ entering the months JAN to DEC into an initially empty binary search tree by\
    \ using function **Insert** (Program 5.21).\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_766_0.png)\n\
    \n**Comparisons:**  \n**Maximum:** 6  \n**Average:** 3.5\n\nFig. 10.8\n\nFig.\
    \ 10.9 shows the binary search tree obtained by entering JULY, FEB, MAY, AUG,\
    \ DEC, MAR, OCT, APR, JAN, JUNE, SEPT, NOV into an initially empty binary search\
    \ tree.\n\nComparisons:\nMaximum: 4\nAverage: 3.1\nBalanced\n\nFig. 10.9\n\nFig.\
    \ 10.10 shows the binary search tree obtained\nby entering the months in lexicographic\
    \ order into\nan initially empty binary search tree.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_770_0.png)\n\
    \nComparisons:\nMaximum: 12\nAverage: 6.5\n\n# Fig. 10.10\n\nWith equal search\
    \ probabilities for keys, both the maximum and average search time will be minimized\
    \ if the binary search tree is maintained as a complete binary tree at all times.\n\
    \nHowever, since the dynamic situation, it is difficult to achieve this without\
    \ making the time required to insert a key very high.\n\nIt is, however, possible\
    \ to keep the tree balanced to ensure both average and worst-case retrieval time\
    \ of O(log n) for a tree with n nodes.\n\nAVL tree (introduced by Adelson-Velskii\
    \ and Landis) is a binary search tree that is balanced with respect to the heights\
    \ of subtrees.\n\nDefinition: an empty tree is height-balanced. If T is a nonempty\
    \ binary tree with T_L and T_R as its left and right subtrees respectively, then\
    \ T is height-balanced iff\n\n+   (1) T_L and T_R are height-balanced and\n\n\
    +   (2) | h_L - h_R | ≤ 1 where h_L and h_R are the heights of T_L and T_R respectively.\n\
    \nFig. 10.8 is not height-balanced.\n\nFig. 10.9 is height-balanced.\n\nFig. 10.10\
    \ is not height-balanced.\n\n**Definition**: The balance factor, BF(T), of a node\
    \ T in a binary tree is defined to be h_L - h_R . For any node T in an AVL tree\
    \ BF(T)=-1, 0, or 1.\n\nTo illustrate the processes involved in maintaining an\
    \ AVL tree, let’s insert MAR, MAY, NOV, AUG, APR, JAN, DEC, JULY and FEB into\
    \ an empty tree.\n\nThe following show the tree as it grows and restructuring\
    \ involved in keeping it balanced. The numbers above each node represent the balance\
    \ factor of that node.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_775_0.png)\n\
    \n(a) Insert MAR\n\n(b) Insert MAY\n\nRR →\n\n(c) Insert NOV\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_777_0.png)\n\
    \n(d) Insert AUG\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_0.png)\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_1.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_2.png)\n\n(e) Insert APR\n\n(f)\
    \ Insert JAN\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_780_0.png)\n\n(g) Insert\
    \ DEC\n\n(h) Insert JULY\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_782_0.png)\n\
    \n(i) Insert FEB\n\nIn the proceeding example we saw that the addition of a node\
    \ to a balanced binary search tree could unbalance it.\n\nThe rebalancing uses\
    \ essentially 4 kinds of rotations:\n\nLL, RR, LR, and RL.\n\nLL and RR are symmetric,\
    \ as are LR and RL.\n\nThe rotations are characterized by the nearest ancestor,\
    \ A, whose BF becomes ± 2, of the inserted node Y.\n\nLL: Y is inserted in the\
    \ left subtree of the left subtree of A.\n\nLR: Y is inserted in the right subtree\
    \ of the left subtree of A.\n\nRR: Y is inserted in the right subtree of the right\
    \ subtree of A.\n\nRL: Y is inserted in the left subtree of the right subtree\
    \ of A.\n\nAs shown in the following:\n\n# Unbalanced following insertion\n\n\
    # rotation type\n\n# Rebalanced\n\nLL\n\nBFs need to be modified\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_785_0.png)\n\
