    \        Visit(*p);\n}\n```\n\nSince each node is visited at most 2 times, the\
    \ computing time is readily seen to be O(n) for n nodes tree, and the traversal\
    \ has been done without using a stack.\n\n## 5.5.3 Inserting a Node into a Threaded\
    \ Binary Tree\n\nInsertion into a threaded tree provides the function for growing\
