  - '[PAGE 629]


    To create and recreate a heap efficiently, we need a function **Adjust**, which
    starts with a binary tree whose left and right subtrees are max heaps and adjusts
    the entire binary tree into a max heap.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_629_0.png)


    `j/2` is always ready for storing record'
  - "[PAGE 630]\n\n```\n```cpp\ntemplate <class T>\nvoid adjust (T *a, const int root,\
    \ const int n)\n{ // No node index is > n\n    T e=a[root];\n    // find proper\
    \ place for e\n    for (int j=2*root; j<=n; j*=2) {\n        if (j<n && a[j]<a[j+1])\
    \ j++;  // j is the lager child of its parent\n        if (e>=a[j]) break;\n \
    \       a[j/2]=a[j];  //move jth record up the tree\n    }\n    a[j/2]=e;\n}\n\
    ```\n```"
  - '[PAGE 631]


    # Analysis of adjust:


    If the depth of tree is d, the for loop is executed at most d times. Hence, the
    computing time is O(d).


    # To sort the list


    +   (1) Create a max heap by using Adjust.

    +   (2) Make n-1 passes, in each pass, swap the first and last records in the
    heap, and decrement the heap size and readjust it.'
