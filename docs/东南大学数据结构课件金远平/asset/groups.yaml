  mdcn: "\n\n构造最小代价生成树时，我们使用最小代价准则，约束条件为：\n\n+   1. 必须只使用 G 内的边。\n+   2. 必须恰好使用 n-1\
    \ 条边。\n+   3. 不能使用会产生环的边。\n\n## 6.3.1 Kruskal 算法\n\n+   - 最小代价生成树 T 是通过一次添加一条边的方式构建的。\n\
    +   - 边是按其代价非递减的顺序被选入 T 的。\n+   - 如果一条边不会与 T 中已有的边形成环，则将其加入 T。\n+   - 恰好会有 n-1\
    \ 条边被选入 T。\n\n### Example 6.4:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_520_0.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_520_1.png)\n\n(a) G\n\n(b)\n\n### The\
    \ cost of remaining edges: 10, 12, 14, 16, 18, 22, 24, 25, 28\n\n(c)\n\n(d)\n\n\
    Remaining edges: 18—(3,6), 22, 24—(4,6), 25, 28\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_523_0.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_523_1.png)\n\n(g) (3,6) discarded\n\
    \n(h) (4, 6) discarded\n\n## Given G = (V, E), we have the algorithm:\n\n```\n\
    1 T = ∅;\n2 while ((T contains less than n-1 edges) && (E not Empty)) {\n3   choose\
    \ an edge (v, w) from E of lowest cost;\n4   delete (v, w) from E;\n5   if ((v,\
    \ w) does not create a cycle in T) add (v, w) to T;\n6   else discard (v, w);\n\
    7 }\n8 if (T contains fewer than n-1 edges)\n    cout<<\"no spanning tree\"<<endl;\n\
    ```\n\n## Analysis:\n\n+   - 执行第 3 行和第 4 行时，E 可以组织为一个最小堆，因此下一步的边可以以 O(log e) 的时间被选择和删除。堆的初始化需要\
    \ O(e) 时间（ref. 7.6）。\n+   - 执行第 5 行时，T 中的顶点可以使用 Union-Find 放置到一个集合中。总成本为 O(e·α(e))。\n\
    \n总成本：O(e log e)。\n\n## Correctness:\n\n**Theorem 6.1:** Let G be any undirected,\
    \ connected graph, Kruskal’s algorithm generates a minimum-cost spanning tree.\n\
    \n证明留作自学练习。\n\n**Exercises:** P359-1\n\n## 6.4 Shortest Paths\n\n## 6.4.1 Single\
    \ Source/All Destinations: Nonnegative Edge Cost\n\n问题：给定有向图 G=(V, E)，长度函数 length(i,\
    \ j)≥0 对于 <i, j>∈E(G)，以及源顶点 v，求从 v 到 G 中其余所有顶点的最短路径。\n\n### Example:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_528_0.png)\n\
    \n(a) G\n\n| path | Length |\n|------|--------|\n| 1) 0, 3 | 10 |\n| 2) 0, 3,\
    \ 4 | 25 |\n| 3) 0, 3, 4, 1 | 45 |\n| 4) 0, 2 | 45 |\n\n(b) Shortest paths from\
    \ 0\n\n假设路径按长度非递减的顺序生成，观察：\n\n(1) 如果下一个最短路径是到 u，则它始于 v，终于 u，并且只经过 S 中的顶点。证明如下，假设该路径上的\
    \ w 不在 S 中，则 v 到 u 的路径包含如下所示的 v 到 w 的路径：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_530_0.png)\n\
    \n(3) 在 (2) 中选定顶点 u 后，u 成为 S 的成员。现在 dist[w]，w ∉S，可能发生变化。如果发生变化，必须是由于从 v 到 u 再到\
    \ w 的更短路径。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_532_0.png)\n\nv 到 u 的路径必须是\
    \ v 到 u 的最短路径，且 u 到 w 的路径只是边 <u, w>。因此如果 dist[w] 要减小，则是因为当前 dist[w]>dist[u]+length(u,\
    \ w)。\n\n注意带有中间顶点 x∈S 的 u 到 w 路径不会影响 dist[w]。因为：\n① length(v-u-x)>dist[x]\n② length(v-u-x-w)>length(v-x-w)≥dist[w]\n\
    如下图所示：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_533_0.png)\n\n## Assume:\n\n\
