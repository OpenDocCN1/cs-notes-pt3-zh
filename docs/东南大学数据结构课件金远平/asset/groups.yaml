    \ |\n\n根据表中的数据，可以按下图构造出 $T_{04}$：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_760_0.png)\n\
    \n示例 10.2 的最优二叉搜索树\n\n一般地，我们需要对所有 $j-i=1,2,\\ldots,n$ 计算 $c_{ij}$。\n\n对于每个 $j-i=m$，需要计算\
