  - '[PAGE 436]


    Assume for k<n, it is also true.


    For k=n, let a₁, a₂, ..., aᵣ, aᵣ₊₁, ..., aₙ be the inorder permutation, and aᵣ
    be the root of the tree, i.e.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_436_0.png)


    let b₁, ..., bᵣ₋₁ be the preorder permutation of subtree (a₁, ..., aᵣ₋₁) and c₁,
    ..., cₙ₋ᵣ be the preorder permutation of subtree (aᵣ₊₁, ..., aₙ).'
  - '[PAGE 437]


    Then


    $a_r=i,\ (1\le r\le n)$


    $b_1,\ldots,b_{r-1}=i+1,\ i+2,\ldots,\ i+r-1,$


    $c_1,\ldots,c_{n-r}=i+r,\ i+r+1,\ldots,j.$


    Now with $i,i+1,\ldots,j$, we can get the inorder permutation through a stack.


    First, put $a_r=i$ into the stack, then by induction hypothesis, with $b_1,\ldots,b_{r-1}=i+1,\
    i+2,\ldots,i+r-1$, we can get $a_1,a_2,\ldots,a_{r-1}$. Pop $i$, we get $a_1,a_2,\ldots,a_{r-1},a_r$.
    Finally, with $c_1,\ldots,c_{n-r}=i+r,\ i+r+1,\ldots,j$, we can get $a_{r+1},\ldots,a_n$,
    following $a_1,a_2,\ldots,a_{r-1},a_r$, we get


    $a_1,a_2,\ldots,a_r,a_{r+1},\ldots,a_n$'
  - '[PAGE 438]


    Similarly, we can prove that given a stack permutation, we can get a equivalent
    inorder permutation.


    Now let bₙ be the number of distinct binary trees with n nodes, then bₙ is the
    sum of all the possible binary trees formed in the following way:


    A root and two subtrees with i nodes and n-i-1 nodes, for 0 ≤ i ≤ n-1.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_438_0.png)'
  - '[PAGE 439]


    For each \(i\), we have \(b_i b_{n-i-1}\) distinct trees, so


