    \ | 2 | 9 |\n\n设 b=1000，我们使用最后 3 位数字。\n\n# 8.2.4 溢出处理\n\n# 8.2.4.1 开放定址\n\n**假设：**\n\
    \n- 哈希表 ht 是一个数组，并存储指向字典对的指针。\n- 为简单起见，s=1。\n\n以下是类定义：\n\n```\n```cpp\ntemplate<class\
