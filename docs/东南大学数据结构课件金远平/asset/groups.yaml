    # 7.10 External Sorting


    # 7.10.1 introduction


    +   - the lists are too large to be entirely contained in the internal memory,
    making an internal sort impossible.

    +   - the lists to be sorted resides on a disk.

    +   - block: the unit of data that is read from or written to a disk at one time.

    +   - disk --- provide direct access to block, its I/O time is determined by:'
  - '[PAGE 664]


    +   (1) seek time

    +   (2) latency time

    +   (3) transmission time


    Note I/O rate << CPU rate.'
  - '[PAGE 665]


    # The most popular method for external sorting is merge sort, which consists of
    2 phases:


    (1) Segments of the input list are sorted in internal memory, these sorted segments,
    known as runs, are written onto disk as they are generated.


    unsorted => Internal memory => sorted runs


    (2) The runs are merged together until only one run left.'
  md: "\nIn general, for a Radix-ℛ sort, r bins are needed.\n\n# Assume:\n\n+   (1)\
    \ records R₁, R₂, …, Rₙ and their keys are decomposed using a radix of r, each\
    \ key have d digits in the range of [0, r-1].\n+   \n+   (2) records have a link\
    \ field.\n+   \n+   (3) for each bin i, 0≤ i <r\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_649_0.png)\n\
    \n```\ntemplate <class T>\nint RadixSort(T*a, int*link, const int d, const int\
    \ r, const int n)\n{ // Sort a[1:n] using a d-digit radix-r sort. digit(e, i,\
    \ r) returns\n// the ith radix-r digit (from the left, the first is the 0th digit)\n\
    // of e’s key. Each digit is in the range of [0, r).\n    int e[r], f[r]; // queue\
    \ end and front pointers\n\n// create initial chain of records starting at first\n\
    if (n==0) return 0; int first=1;\nfor (int i=1; i<n; i++) link[i]=i+1; // linked\
    \ into a chain\nlink[n]=0;\n\nfor (i=d-1; i>=0; i--)\n{ // sort on digit i\n \
    \   fill(f, f+r, 0); // initialize bins to empty queues\n    for (int current=first;\
    \ current; current=link[current])\n    { // put records into queues\n```\n\n```\n\
    int k=digit(a[current], i, r);\nif (f[k]==0) f[k]=current;\nelse link[e[k]]=current;\n\
    e[k]=current;\n}\nfor (int j=0; !f[j] ; j++); // find first nonempty queue\nfirst=f[j];\
    \ int last=e[j];\nfor (int k=j+1; k<r; k++) // concatenate remaining queues\n\
    \    if (f[k]) {\n        link[last]=f[k]; last=e[k];\n    }\n    link[last]=0;\n\
    }\nreturn first;\n}\n```\n\n# Analysis of RadixSort:\n\nd passes over the data,\
    \ each taking O(n+r). Hence the total time is O(d(n+r)).\n\nd will depend on r\
    \ and the largest key.\n\n# Example 7.8: sort 10 numbers in the range [0,999],\n\
    \nr=10, hence d=3.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_652_0.png)\n\n\
    (a) Initial input\n\n# (b) First pass\n\ne[0] e[1] e[2] e[3] e[4] e[5] e[6] e[7]\
    \ e[8] e[9]\n\nf[0] f[1] f[2] f[3] f[4] f[5] f[6] f[7] f[8] f[9]\n\n271 93 33\
    \ 984 55 306 208 179 859 9\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_655_0.png)\n\
    \n# (d) third pass\n\n# Exercises: P422-1, 3, 5\n\n# 7.9 Summary of Internal Sorting\n\
    \nThe behavior of Radix Sort depends on the size of keys and the choice of r.\n\
    \nThe following summarizes the other 4 methods we have studied:\n\n| Method |\
    \ Worst | Average | Working Storage |\n|---|---|---|---|\n| Insertion Sort | n²\
    \ | n² | O(1) |\n| Heap Sort | n log n | n log n | O(1) |\n| Merge Sort | n log\
    \ n | n log n | O(n) |\n| Quick Sort | n² | n log n | O(n) or O(log n) |\n\nThe\
    \ next slide gives the average runtimes for the 4 methods on a 1.7G Intel Pentium\
    \ 4 PC with 512M RAM and Microsoft Visual.NET2003.\n\nFor each n at lest 100 randomly\
    \ generated integer instances were run.\n\n# The following is a plot of average\
    \ times (milliseconds) for sort methods:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_660_0.png)\n\
    \n# For average behavior, we can see:\n\n+   - Quick Sort outperforms the other\
    \ sort methods for suitably large n.\n+   - the break-even point between Insertion\
    \ and Quick Sort is near 100, let it be nBreak.\n+   - when n < nBreak, Insert\
    \ Sort is the best, and when n > nBreak, Quick Sort is the best.\n+   - improve\
    \ Quick Sort by sorting sublists of less than nBreak records using Insertion Sort.\n\
    \n# Experiments: P435-4\n\n# 7.10 External Sorting\n\n# 7.10.1 introduction\n\n\
    +   - the lists are too large to be entirely contained in the internal memory,\
    \ making an internal sort impossible.\n+   - the lists to be sorted resides on\
    \ a disk.\n+   - block: the unit of data that is read from or written to a disk\
    \ at one time.\n+   - disk --- provide direct access to block, its I/O time is\
    \ determined by:\n\n+   (1) seek time\n+   (2) latency time\n+   (3) transmission\
    \ time\n\nNote I/O rate << CPU rate.\n\n# The most popular method for external\
    \ sorting is merge sort, which consists of 2 phases:\n\n(1) Segments of the input\
    \ list are sorted in internal memory, these sorted segments, known as runs, are\
    \ written onto disk as they are generated.\n\nunsorted => Internal memory => sorted\
    \ runs\n\n(2) The runs are merged together until only one run left.\n"
  mdcn: "\n\n一般来说，对于 Radix-ℛ 排序，需要 r 个箱子。\n\n# 假设：\n\n+   (1) 记录 R₁, R₂, …, Rₙ 及其键使用基数\
    \ r 进行分解，每个键在 [0, r-1] 范围内有 d 位。\n+   \n+   (2) 记录有一个链接字段。\n+   \n+   (3) 对于每个箱子\
    \ i，0≤ i <r\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_649_0.png)\n\n```\ntemplate\
    \ <class T>\nint RadixSort(T*a, int*link, const int d, const int r, const int\
    \ n)\n{ // Sort a[1:n] using a d-digit radix-r sort. digit(e, i, r) returns\n\
    // the ith radix-r digit (from the left, the first is the 0th digit)\n// of e’s\
    \ key. Each digit is in the range of [0, r).\n    int e[r], f[r]; // queue end\
    \ and front pointers\n\n// create initial chain of records starting at first\n\
    if (n==0) return 0; int first=1;\nfor (int i=1; i<n; i++) link[i]=i+1; // linked\
    \ into a chain\nlink[n]=0;\n\nfor (i=d-1; i>=0; i--)\n{ // sort on digit i\n \
    \   fill(f, f+r, 0); // initialize bins to empty queues\n    for (int current=first;\
    \ current; current=link[current])\n    { // put records into queues\n```\n\n```\n\
    int k=digit(a[current], i, r);\nif (f[k]==0) f[k]=current;\nelse link[e[k]]=current;\n\
    e[k]=current;\n}\nfor (int j=0; !f[j] ; j++); // find first nonempty queue\nfirst=f[j];\
    \ int last=e[j];\nfor (int k=j+1; k<r; k++) // concatenate remaining queues\n\
    \    if (f[k]) {\n        link[last]=f[k]; last=e[k];\n    }\n    link[last]=0;\n\
    }\nreturn first;\n}\n```\n\n# RadixSort 分析：\n\nd 次遍历数据，每次耗时 O(n+r)。因此总时间为 O(d(n+r))。\n\
    \nd 将取决于 r 和最大的键。\n\n# 示例 7.8：对 [0,999] 范围内的 10 个数进行排序，\n\nr=10，因此 d=3。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_652_0.png)\n\
    \n(a) 初始输入\n\n# (b) 第一次遍历\n\ne[0] e[1] e[2] e[3] e[4] e[5] e[6] e[7] e[8] e[9]\n\
    \nf[0] f[1] f[2] f[3] f[4] f[5] f[6] f[7] f[8] f[9]\n\n271 93 33 984 55 306 208\
    \ 179 859 9\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_655_0.png)\n\n# (d) 第三次遍历\n\
    \n# 练习：P422-1, 3, 5\n\n# 7.9 内部排序总结\n\nRadix Sort 的行为取决于键的大小和 r 的选择。\n\n下表总结了我们研究的另外\
    \ 4 种方法：\n\n| 方法 | 最坏 | 平均 | 工作存储 |\n|---|---|---|---|\n| 插入排序 | n² | n² | O(1)\
    \ |\n| 堆排序 | n log n | n log n | O(1) |\n| 归并排序 | n log n | n log n | O(n) |\n\
    | 快速排序 | n² | n log n | O(n) 或 O(log n) |\n\n下一张幻灯片给出了在配备 512M RAM 的 1.7G Intel\
    \ Pentium 4 PC 上使用 Microsoft Visual.NET2003 运行的 4 种方法的平均运行时间。\n\n对于每个 n，至少运行了\
    \ 100 个随机生成的整数实例。\n\n# 下图为排序方法的平均时间（毫秒）：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_660_0.png)\n\
    \n# 对于平均行为，我们可以看到：\n\n+   - 快速排序在 n 足够大时优于其他排序方法。\n+   - 插入排序与快速排序的平衡点接近 100，设其为\
    \ nBreak。\n+   - 当 n < nBreak 时，插入排序最好；当 n > nBreak 时，快速排序最好。\n+   - 通过使用插入排序对少于\
    \ nBreak 条记录的子列表进行排序来改进快速排序。\n\n# 实验：P435-4\n\n# 7.10 外部排序\n\n# 7.10.1 引言\n\n\
    +   - 列表太大，无法完全容纳在内部内存中，使得内部排序不可能。\n+   - 待排序的列表驻留在磁盘上。\n+   - 块：一次从磁盘读取或写入的数据单元。\n\
    +   - 磁盘 --- 提供对块的直接访问，其 I/O 时间由以下决定：\n\n+   (1) 寻道时间\n+   (2) 延迟时间\n+   (3) 传输时间\n\
    \n注意 I/O 速率 << CPU 速率。\n\n# 外部排序最流行的方法是归并排序，它包含 2 个阶段：\n\n(1) 输入列表的段在内部内存中排序，这些已排序的段称为\
    \ run，会在生成时写入磁盘。\n\n未排序 => 内部内存 => 已排序的 run\n\n(2) 将 run 合并在一起，直到只剩下一个 run。\n\n"
