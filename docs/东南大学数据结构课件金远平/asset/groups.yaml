    \n下面是算法 obst。\n\n```cpp\ntemplate <class KeyType>\nvoid BST<KeyType>::obst(int\
    \ *p, int *q, Element<KeyType> *a, int n)\n// given a1 < a2 < ... < an, and pj,\
    \ 1 <= j <= n, and qi, 0 <= i <= n, compute cij\n// for Tij for a_{i+1}, ...,\
    \ aj. Also compute rij and wij.\n{\n    for (int i = 0; i < n; i++) {\n      \
    \  w[i][i] = q[i]; r[i][i] = c[i][i] = 0;    // initialize\n        w[i][i+1]\
    \ = q[i] + q[i+1] + p[i+1]; // optimal trees with one node\n        r[i][i+1]\
    \ = i + 1;\n        c[i][i+1] = w[i][i+1];\n    }\n    w[n][n] = q[n]; r[n][n]\
    \ = c[n][n] = 0;\n\n    for (int m = 2; m <= n; m++) // find optimal b.s.t. with\
    \ m nodes\n        for (int i = 0; i <= n - m; i++) {\n            int j = i +\
    \ m;\n            w[i][j] = w[i][j-1] + p[j] + q[j];\n            int k = KnuthMin(i,\
    \ j);\n            // KnuthMin returns k in the range [r[i][j-1], r[i+1][j]]\n\
    \            // minimizing c[i][k-1] + c[k][j]\n            c[i][j] = w[i][j]\
    \ + c[i][k-1] + c[k][j]; // Eq. (10.3)\n            r[i][j] = k;\n        }\n\
    } // end of obst\n```\n\n实际的 $T_{0n}$ 可以由 $r_{ij}$ 在 $O(n)$ 时间内构造出来。\n\n习题：P562-3\n\
    \n"
