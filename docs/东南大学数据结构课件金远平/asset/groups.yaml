    \n### Combining nodes for adjacency lists and inverse adjacency lists together\
    \ forms an orthogonal list node:\n\n| tail | head | column link | row link |\n\
    |---|---|---|---|\n\nHere is the orthogonal representation for G₃:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_471_0.png)\n\
    \n### 6.1.3.3 Adjacency Multilists\n\nIn the adjacency lists of an undirected\
