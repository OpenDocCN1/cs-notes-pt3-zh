  mdcn: "\n\n# 10.2 AVL 树\n\n**动态** 元素集合也可以维护为二叉搜索树。\n图 10.8 显示了通过使用函数 **Insert**（程序\
    \ 5.21）将月份 JAN 到 DEC 依次插入初始为空的二叉搜索树后得到的二叉搜索树。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_766_0.png)\n\
    \n**比较次数：**  \n**最大：** 6  \n**平均：** 3.5\n\n图 10.8\n\n图 10.9 显示了将 JULY、FEB、MAY、AUG、DEC、MAR、OCT、APR、JAN、JUNE、SEPT、NOV\
    \ 依次插入初始为空的二叉搜索树后得到的二叉搜索树。\n\n比较次数：\n最大：4\n平均：3.1\n平衡\n\n图 10.9\n\n图 10.10 显示了将月份按字典顺序插入初始为空的二叉搜索树后得到的二叉搜索树。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_770_0.png)\n\n比较次数：\n最大：12\n平均：6.5\n\
    \n# 图 10.10\n\n当键的搜索概率相等时，只要二叉搜索树始终保持为完全二叉树，最大和平均搜索时间都将被最小化。\n\n然而，由于动态情况，在不使插入键所需时间变得非常高的情况下实现这一点是困难的。\n\
    \n然而，可以保持树平衡，以确保具有 n 个节点的树的平均和最坏情况下检索时间为 O(log n)。\n\nAVL 树（由 Adelson-Velskii\
    \ 和 Landis 引入）是一种二叉搜索树，其平衡性是相对于子树高度而言的。\n\n定义：空树是高度平衡的。如果 T 是一个非空二叉树，其左子树和右子树分别为\
    \ T_L 和 T_R，则 T 是高度平衡的当且仅当\n\n+   （1）T_L 和 T_R 都是高度平衡的，并且\n\n+   （2）| h_L - h_R\
    \ | ≤ 1，其中 h_L 和 h_R 分别是 T_L 和 T_R 的高度。\n\n图 10.8 不是高度平衡的。\n\n图 10.9 是高度平衡的。\n\
    \n图 10.10 不是高度平衡的。\n\n**定义**：二叉树中节点 T 的平衡因子 BF(T) 定义为 h_L - h_R 。对于 AVL 树中的任意节点\
    \ T，BF(T)=-1、0 或 1。\n\n为了说明维护 AVL 树所涉及的过程，让我们将 MAR、MAY、NOV、AUG、APR、JAN、DEC、JULY\
    \ 和 FEB 插入空树中。\n\n以下显示了树随其增长而变化以及保持其平衡所涉及的重构。每个节点上方的数字表示该节点的平衡因子。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_775_0.png)\n\
    \n(a) 插入 MAR\n\n(b) 插入 MAY\n\nRR →\n\n(c) 插入 NOV\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_777_0.png)\n\
    \n(d) 插入 AUG\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_0.png)\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_1.png)\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_778_2.png)\n\n(e) 插入 APR\n\n(f) 插入\
    \ JAN\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_780_0.png)\n\n(g) 插入 DEC\n\n\
    (h) 插入 JULY\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_782_0.png)\n\n(i) 插入 FEB\n\
    \n在前面的示例中，我们看到将节点添加到平衡二叉搜索树可能会使其失衡。\n\n重新平衡主要使用 4 种旋转：\n\nLL、RR、LR 和 RL。\n\nLL\
    \ 和 RR 是对称的，LR 和 RL 也是对称的。\n\n旋转的特征是插入节点 Y 的最近祖先 A，其 BF 变为 ± 2。\n\nLL：Y 插入到 A\
    \ 的左子树的左子树中。\n\nLR：Y 插入到 A 的左子树的右子树中。\n\nRR：Y 插入到 A 的右子树的右子树中。\n\nRL：Y 插入到 A 的右子树的左子树中。\n\
    \n如以下所示：\n\n# 插入后失衡\n\n# 旋转类型\n\n# 重新平衡\n\nLL\n\nBFs 需要修改\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_785_0.png)\n\
    \n# 插入后失衡\n\n# 旋转类型\n\n# 重新平衡\n\nRR\n\nh+2\n\n-2\nA\n\n-1\nB\n\nA_L\n\nB_L\n\n\
    B_R\n\n0\nB\n\n0\nA\n\nA_L\n\nB_L\n\nB_R\n\n# 插入后失衡\n\n# 旋转类型\n\n# 重新平衡\n\nLR(a)\n\
