    \ 在排序列表中先于 R_j。\n\n生成排列 σₛ 的排序方法是稳定的。\n\nSorting\n  internal\n    insert\n   \
    \ quick\n    merge\n    heap\n    radix\n  external\n    m-way merge\n    run\
    \ generation\n\n在整个过程中，我们假设关系运算符已被重载，以便记录比较是通过比较它们的键来完成的。\n\n## 7.2 插入排序\n\n基本步骤：将\
    \ e 插入到 i 条记录的有序序列中，使得 resulting 序列大小为 i+1 并且仍然有序。\n\n使用 a[0] 来简化 while 循环测试。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_596_0.png)\n\n```\ntemplate<class T>\n\
