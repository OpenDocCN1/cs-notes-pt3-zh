    # 6.2.3 Connected Components


    To obtain all the connected components of a undirected graph, we can make repeated
    calls to either DFS(v) or BFS(v) for unvisited v.


    This leads to function Components.


    Function OutputNewComponent output all vertices visited in the most recent invocation
    of DFS, together with all edges incident on them.'
  - "[PAGE 488]\n\n```\nvirtual void Graph::Components()\n{ // Determine the connected\
    \ components of the graph.\n    visited = new bool[n];\n    fill(visited, visited+n,\
    \ false);\n    for (int i=0; i<n; i++)\n        if (!visited[i]) {\n         \
    \   DFS (i); // find a component\n            OutputNewComponent();\n        }\n\
    \    delete [] visited;\n}\n```"
