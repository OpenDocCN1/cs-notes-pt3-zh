    定义：如果 T₁,..., Tₙ 是树的森林，则其对应的二叉树，记为 B(T₁,..., Tₙ)，


    - (1) 如果 n=0 则为空

    - (2) 其根等于 root(T₁)；其左子树等于 B(T₁₁,..., T₁ₘ)，其中 T₁₁,..., T₁ₘ 是 root(T₁) 的子树；其右子树为
    B(T₂,..., Tₙ)。


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_393_0.png)


    Fig. 5.35: Binary tree representation of forest of Fig.5.34


    ### 5.9.2 森林遍历


    设 T 为森林 F 的对应二叉树。


    按森林先序访问 F 的节点定义为：


    - (1) 如果 F 为空则返回。

    - (2) 访问 F 的第一棵树的根。

    - (3) 按森林先序遍历第一棵树的子树。

    - (4) 按森林先序遍历 F 的剩余树。


