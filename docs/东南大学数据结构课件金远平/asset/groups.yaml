    \nIn a tree of degree m and height h, the maximum number of nodes is\n\n∑₀≤i≤h−1\
    \ mⁱ = (mʰ − 1)/(m − 1)\n\nEach node has at most m-1 keys, the maximum number\
    \ of keys is mʰ-1.\n\n- for a binary tree with h=3, it is 7.\n- for a 200-way\
    \ tree with h=3, it is 8*10⁶-1.\n\nTo achieve a performance close to that of the\
