    \ the new p is written to the disk and the insertion is complete.\n\nTo split\
    \ the node, assume that following the insertion, p has the format\n\n$m, A_0,\
    \ (E_1, A_1), \\ldots, (E_m, A_m)$ and $E_i \\leq E_{i+1},\\ K$, $1 \\leq i \\\
    leq m$.\n\nThe node is split into 2 nodes, p and q, with the following formats:\n\
    \nnode p: $\\lceil m/2 \\rceil - 1,\\ A_0, (E_1, A_1), \\ldots, (E_{\\lceil m/2\
    \ \\rceil - 1}, A_{\\lceil m/2 \\rceil - 1})$  (11.5)\n\nnode q: $m - \\lceil\
    \ m/2 \\rceil,\\ A_{\\lceil m/2 \\rceil}, (E_{\\lceil m/2 \\rceil + 1}, A_{\\\
    lceil m/2 \\rceil + 1}), \\ldots, (E_m, A_m)$\n\nAnd the tuple $(E_{\\lceil m/2\
    \ \\rceil}, q)$ is to be inserted into the parent of p.\n\nInserting into the\
    \ parent may require us to split the parent, and the splitting process can propagate\
    \ all the way up to the root.\n\nWhen the root split, a new root with a single\
    \ key is created, and the height of the B-tree increases by one.\n\nNote that\
    \ when m=2, ⌈m/2⌉-1=0, this means the above method does not work for m=2.\n\n\
    The next slide gives a high-level description of the insertion algorithm for a\
    \ disk resident B-tree.\n\n```\n// Insert element x into a disk resident B-tree.\n\
    Search the B-tree for an element E with key x.K;\nif such an E is found, replace\
    \ E with x and return;\nelse let p be the leaf into which x is to be inserted;\n\
    q = NULL;\nfor (e=x; p; p=p→parent())  // the parent of root is NULL\n{ // (e,\
    \ q) is to be inserted into p\n    Insert (e, q) into appropriate position in\
    \ node p;\n    Let the resulting node have the form:\n                    n, A₀,\
    \ (E₁, A₁), ..., (Eₙ, Aₙ);\n    if (n<=m-1) {  // the resulting node is not too\
    \ big\n        write node p to disk; return;\n    }\n}\n```\n\n```\n//node p has\
    \ to be split\nLet node p and q be defined as in (11.5);\ne=E⌊m/2⌋;\nwrite nodes\
    \ p and q to the disk;\n}\n// a new root is to be created\nCreate a new node r\
    \ with format: 1, root, (e, q);\n// when the tree is empty, root=p=0\nroot=r;\n\
    write root to disk;\n```\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_832_0.png)\n\
    \n# 70 inserted\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_833_0.png)\n\n30 inserted\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_834_0.png)\n\n60 inserted\n\n## Analysis\
    \ of B-tree Insertion:\n\nLet h be the height of the B-tree, then h disk accesses\
    \ for the top-down search.\n\nIn the worst, all h of the accessed nodes may split\
    \ during the bottom-up splitting pass. When a non-root node split, 2 nodes are\
    \ written out. When the root split, 3 nodes are written out.\n\nAssume that the\
    \ h nodes read in during the top-down pass can be saved in memory so that they\
    \ are not to be retrieved from disk during the bottom-up pass.\n"
  mdcn: "\n\n## 11.2.2 B-树中元素的个数\n\n设 t 为阶为 m 的 B-树，其中所有外部节点都在层 l+1，且 N 为 t 中键的个数。则\n\
    \n- (1) N ≤ m^l-1 （上界）。\n- (2) N ≥ 2⌈m/2⌉^l-1 -1 （下界）。\n\n为证明此点，注意到：\n\n如果 l>1，层\
    \ 2 至少有 2 个节点，层 3 至少有 2 ⌈m/2⌉ 个节点，...\n\n层 l 至少有 2 ⌈m/2⌉^{l-2} 个节点。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_821_0.png)\n\
    \nLevel 1\n\n2\n\n3\n\n⌈m/2⌉\n\n如果树中键值为 K₁, K₂, ..., K_N, K_i < K_{i+1}, 1 ≤ i\
    \ < N，则外部节点的个数为 N+1，因为在 K_i < x < K_{i+1} 时会发生失败，0 ≤ i ≤ N，\n\n其中 K₀ = -∞ 且 K_{N+1}\
    \ = +∞。\n\n因此，\n\nN+1 = t 中失败节点的个数\n= 层 l+1 的节点数\n≥ 2⌈m/2⌉^{l-1}\n\nN ≥ 2⌈m/2⌉^{l-1}\
    \ − 1.\n\nl ≤ log_{⌈m/2⌉}((N+1)/2) + 1.\n\n在最坏情况下搜索 B-树需要 I 次访问。\n\n假设 m=200，且注意\
    \ I 为整数：\n\n- (1) 对于 N ≤ 2*10^6-2，  \n  I ≤ ⌊log₁₀₀(10^6-1/2)⌋+1=3.\n\n- (2) 对于\
    \ N ≤ 2*10^8-2，  \n  I ≤ ⌊log₁₀₀(10^8-1/2)⌋+1=4.\n\n## 11.2.3 向 B-树中插入\n\n注意我们不能在外部节点的位置插入新节点，因为：\n\
    \n- 1. 一个键可能太少；\n- 2. 外部节点必须在同一层。\n\n如下一张幻灯片所示。\n\n### 阶为 m 的 B-树插入算法的基本思想：\n\n\
    - 1. 执行搜索以确定要插入新键的叶节点 p。\n- 2. 如果插入导致 p 有 m 个键，则节点 p 被分裂。否则，将新的 p 写入磁盘，插入完成。\n\
    \n为了分裂节点，假设在插入后，p 的格式为\n\n$m, A_0, (E_1, A_1), \\ldots, (E_m, A_m)$ 且 $E_i \\\
    leq E_{i+1},\\ K$, $1 \\leq i \\leq m$。\n\n节点被分裂为 2 个节点 p 和 q，其格式如下：\n\n节点 p:\
    \ $\\lceil m/2 \\rceil - 1,\\ A_0, (E_1, A_1), \\ldots, (E_{\\lceil m/2 \\rceil\
    \ - 1}, A_{\\lceil m/2 \\rceil - 1})$  (11.5)\n\n节点 q: $m - \\lceil m/2 \\rceil,\\\
    \ A_{\\lceil m/2 \\rceil}, (E_{\\lceil m/2 \\rceil + 1}, A_{\\lceil m/2 \\rceil\
    \ + 1}), \\ldots, (E_m, A_m)$\n\n并且元组 $(E_{\\lceil m/2 \\rceil}, q)$ 要插入到 p 的父节点中。\n\
    \n向父节点插入可能需要我们分裂父节点，分裂过程可以一直传播到根。\n\n当根分裂时，会创建一个具有单个键的新根，B-树的高度增加一。\n\n注意当 m=2\
    \ 时，⌈m/2⌉-1=0，这意味着上述方法对 m=2 不适用。\n\n下一张幻灯片给出了磁盘驻留 B-树插入算法的高层描述。\n\n```\n// Insert\
    \ element x into a disk resident B-tree.\nSearch the B-tree for an element E with\
    \ key x.K;\nif such an E is found, replace E with x and return;\nelse let p be\
    \ the leaf into which x is to be inserted;\nq = NULL;\nfor (e=x; p; p=p→parent())\
    \  // the parent of root is NULL\n{ // (e, q) is to be inserted into p\n    Insert\
    \ (e, q) into appropriate position in node p;\n    Let the resulting node have\
    \ the form:\n                    n, A₀, (E₁, A₁), ..., (Eₙ, Aₙ);\n    if (n<=m-1)\
    \ {  // the resulting node is not too big\n        write node p to disk; return;\n\
    \    }\n}\n```\n\n```\n//node p has to be split\nLet node p and q be defined as\
    \ in (11.5);\ne=E⌊m/2⌋;\nwrite nodes p and q to the disk;\n}\n// a new root is\
    \ to be created\nCreate a new node r with format: 1, root, (e, q);\n// when the\
    \ tree is empty, root=p=0\nroot=r;\nwrite root to disk;\n```\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_832_0.png)\n\
    \n# 70 inserted\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_833_0.png)\n\n30 inserted\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_834_0.png)\n\n60 inserted\n\n## B-树插入的分析：\n\
    \n设 h 为 B-树的高度，则自顶向下搜索需要 h 次磁盘访问。\n\n在最坏情况下，在自底向上的分裂过程中，访问的 h 个节点都可能分裂。当非根节点分裂时，写出\
    \ 2 个节点。当根分裂时，写出 3 个节点。\n\n假设在自顶向下过程中读取的 h 个节点可以保存在内存中，因此在自底向上过程中无需从磁盘中检索。\n\n"
