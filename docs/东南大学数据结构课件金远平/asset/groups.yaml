  md: "\nBecause **Merge** requires only the leading records of runs being merged\
    \ to be present in memory at one time, it is possible to merge large runs together.\n\
    \n## Example 7.12:\n\n- a list of 4500 records to be sorted\n- the internal memory\
    \ is capable of sorting at most 750 records\n\n• block length --- 250 records.\n\
    \nNow we can sort the list as the following:\n\n- (1) Internally sort 3 blocks\
    \ at a time to obtain 6 runs R₁ to R₆.\n\nrun1\n1-\n750\n\nrun2\n751-\n1500\n\n\
    run3\n1501-\n2250\n\nrun4\n2251-\n3000\n\nrun5\n3001-\n3750\n\nrun6\n3751-\n4500\n\
    \n## (2) Merge the 6 runs.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_668_0.png)\n\
    \n## Let\n\ntₛ = maximum seek time\n\ntₗ = maximum latency time\n\nt_rw = time\
    \ to read or write one block of 250 records\n\nt_IO = tₛ + tₗ + t_rw\n\nt_IS =\
    \ time to internally sort 750 records\n\nn tₘ = time to merge n records from input\
    \ buffers to output buffer\n\nThe computing times are as:\n\n| operation | time\
    \ |\n|---|---|\n| (1) read 18 blocks, internally sort, write 18 blocks | 36 t_IO\
    \ + 6 t_IS |\n| (2) merge runs 1 to 6 in pairs | 36 t_IO + 4500 t_m |\n| (3) merge\
    \ 2 runs of 1500 records each | 24 t_IO + 3000 t_m |\n| (4) merge 1 run of 3000\
    \ records with 1 run of 1500 | 36 t_IO + 4500 t_m |\n| total time | 132 t_IO +\
    \ 12000 t_m + 6 t_IS |\n\nThe computing time depends chiefly on the number of\
    \ passes over the data.\n\nWe are mainly concerned with:\n\n- (1) Reduction of\
    \ the number of passes by using a high-order merge.\n- (2) An appropriate buffer-handling\
    \ scheme to provide for parallel input, output and merging.\n- (3) Generating\
    \ fewer runs (or equivalently longer) under the memory limitation.\n\n## 7.10.2\
    \ k-way Merging\n\nFor 2-way merge with m runs, a total of ⌈log₂m⌉ passes ( excluding\
    \ the one for generating the runs) are needed.\n\nIn general, a k-way merge on\
    \ m runs requires at most ⌈logₖm⌉ passes over the data. Thus, I/O time may be\
    \ reduced. As shown in the following tree:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_673_0.png)\n\
    \nFor large k (say, k ≥ 6), to select the smallest from the k possibilities, we\
    \ can use a loser tree with k leaves.\n\nThe total time needed per level of the\
    \ merge tree is O(n log₂k).\n\nThe merge tree has O(logₖm) levels, the total internal\
    \ merge time is\n\nO(n log₂k logₖm) = O(n log₂m)\n\nwhich is independent of k!\n\
    \n## Comments on high order merge:\n\n- 1. save I/O\n- 2. no big loss of internal\
    \ processing speed.\n- 3. the decrease in I/O < indicated by reduction to logₖm\
    \ passes, because:\n\n- to do k-way merge we need at least k input buffers and\
    \ 1 output buffer (or the best totally 2k+2).\n\n- given fixed internal memory,\n\
    \  k increases => smaller buffer size => more blocks\n  => increased seek and\
    \ latency time.\n\n- hence, beyond a certain k, I/O time increases despite the\
    \ decrease in the number of passes.\n\n## 7.10.4 Run Generation\n\nUsing a tree\
    \ of loser, we can generate runs that are, on average, twice as long as obtainable\
    \ by conventional internal sorting methods.\n\n**Background:** given k record\
    \ buffers\n\n• conventional method --- static\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_677_0.png)\n\
    \nafter finishing sorting on (R₀,..., Rₖ₋₁), generate k record long runs.\n\n\
    ## • tree of loser method --- dynamic\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_678_0.png)\n\
    \nAfter one winner is selected, output it, and get a new record from the input\
    \ list into the winner’s buffer → longer runs, on average, 2k long.\n\n## Ideas:\n\
    \n- • k record buffers r[i], 0≤i<k, as leaf nodes, node number=k+i\n- \n- • k-1\
    \ non-leaf nodes numbered 1 to k-1, each non-leaf node i has only one field I[i],\
    \ 1≤i<k, represents the loser of the tournament. I[i] contains the index of the\
    \ loser’s buffer.\n\n- • each r[i] has a run number field rn[i] associated with\
    \ it to determine whether or not r[i] can be output as part of the run currently\
    \ generated.\n- \n- • rmax --- the max of the run number of the real records currently\
    \ in memory.\n- \n- • if input is empty, create a virtual record with rn=rmax+1,\
    \ to push real records output before it.\n\n## Variable specification:\n\n- •\
    \ r[i], 0≤i<k --- the k records in the tree of loser\n"
  mdcn: "\n\n因为 **Merge** 只需要在一次合并时将待合并的各个 run 的前导记录保存在内存中，因此可以合并大型的 run。\n\n## 示例\
    \ 7.12：\n\n- 一个包含 4500 条记录的待排序列表\n- 内部内存最多只能排序 750 条记录\n\n• 块长度 --- 250 条记录。\n\
    \n现在我们可以按如下方式对列表进行排序：\n\n- (1) 每次内部排序 3 个块以获得 6 个 run R₁ 至 R₆。\n\nrun1\n1-\n750\n\
    \nrun2\n751-\n1500\n\nrun3\n1501-\n2250\n\nrun4\n2251-\n3000\n\nrun5\n3001-\n\
    3750\n\nrun6\n3751-\n4500\n\n## (2) 合并这 6 个 run。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_668_0.png)\n\
    \n## 设\n\ntₛ = 最大寻道时间\n\ntₗ = 最大等待时间\n\nt_rw = 读写一个包含 250 条记录的块所需的时间\n\nt_IO =\
    \ tₛ + tₗ + t_rw\n\nt_IS = 内部排序 750 条记录所需的时间\n\nn tₘ = 从输入缓冲区合并 n 条记录到输出缓冲区所需的时间\n\
    \n计算时间如下：\n\n| 操作 | 时间 |\n|---|---|\n| (1) 读入 18 个块，内部排序，写出 18 个块 | 36 t_IO +\
    \ 6 t_IS |\n| (2) 将 run 1 至 6 两两合并 | 36 t_IO + 4500 t_m |\n| (3) 合并 2 个各 1500\
    \ 条记录的 run | 24 t_IO + 3000 t_m |\n| (4) 将 1 个 3000 条记录的 run 与 1 个 1500 条记录的 run\
    \ 合并 | 36 t_IO + 4500 t_m |\n| 总时间 | 132 t_IO + 12000 t_m + 6 t_IS |\n\n计算时间主要取决于对数据的遍历次数。\n\
    \n我们主要关注：\n\n- (1) 使用高阶合并来减少遍历次数。\n- (2) 适当的缓冲区处理方案以实现并行的输入、输出和合并。\n- (3) 在内存限制下生成更少的\
    \ run（或等价地更长的 run）。\n\n## 7.10.2 k-路合并\n\n对于具有 m 个 run 的 2-路合并，总共需要 ⌈log₂m⌉ 次遍历（不包括生成\
    \ run 的那一次）。\n\n一般来说，对 m 个 run 进行 k-路合并最多需要 ⌈logₖm⌉ 次数据遍历。因此，I/O 时间可以减少。如以下树所示：\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_673_0.png)\n\n对于较大的 k（例如，k ≥ 6），为了从\
    \ k 个可能性中选出最小值，我们可以使用具有 k 个叶子的败者树。\n\n合并树每层的所需总时间为 O(n log₂k)。\n\n合并树有 O(logₖm)\
    \ 层，内部合并总时间为\n\nO(n log₂k logₖm) = O(n log₂m)\n\n与 k 无关！\n\n## 关于高阶合并的评论：\n\n\
    - 1. 节省 I/O\n- 2. 内部处理速度没有大的损失。\n- 3. I/O 的减少 < 由遍历次数减少到 logₖm 所指示的减少，因为：\n\n\
    - 要进行 k-路合并，我们至少需要 k 个输入缓冲区和 1 个输出缓冲区（或最好总共 2k+2）。\n\n- 在内部内存固定的情况下，\n  k 增加 =>\
    \ 缓冲区大小变小 => 块数增多\n  => 寻道和等待时间增加。\n\n- 因此，超过某个 k 后，尽管遍历次数减少，I/O 时间仍会增加。\n\n##\
    \ 7.10.4 Run 生成\n\n使用败者树，我们可以生成平均长度是常规内部排序方法可获得的两倍的 run。\n\n**背景：** 给定 k 个记录缓冲区\n\
