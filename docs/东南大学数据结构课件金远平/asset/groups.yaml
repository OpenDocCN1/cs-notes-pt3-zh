  md: "\n## 2.4.3 Transposing a Matrix\n\n### Transpose:\n\nIf an element is at position\
    \ [ i ][ j ] in the original matrix, then it is at position [ j ][ i ] in the\
    \ transposed matrix.\n\nFig.2.3(b) shows the transpose of Fig2.3(a).\n\n| smArray\
    \ | row | col | value |\n|---|---|---:|---:|---:|\n| smArray[0] | 0 | 0 | 15 |\n\
    | [1] | 0 | 4 | 91 |\n| [2] | 1 | 1 | 11 |\n| [3] | 2 | 1 | 3 |\n| [4] | 2 | 5\
    \ | 28 |\n| [5] | 3 | 0 | 22 |\n| [6] | 3 | 2 | -6 |\n| [7] | 5 | 0 | -15 |\n\n\
    ![](img/15e8d7d94d8ddf02cb6839870195a31e_80_0.png)\n\n# Fig 2.3 (b)\n\n### First\
    \ try:\n\nFor (each row i)\n\ttake element (i, j, value) and\n\tstore it in (j,\
    \ i, value) of the transpose;\n\n**Difficulty:** not knowing where to put (j,\
    \ i, value)\nuntil all other elements preceding it have been\nprocessed.\n\n###\
    \ Improvement:\n\nFor (all elements in column j)\nstore (i, j, value) of the original\
    \ matrix as\n(j, i, value) of the transpose;\n\nSince the rows are in order, we\
    \ will locate elements in the correct column order.\n\n```\n1 SparseMatrix SparseMatrix::Transpose\
    \ ()\n2 { // return the transpose of *this\n3   SparseMatrix b(cols, rows, terms);\n\
    4   if (terms > 0)\n5   {  //nonzero matrix\n6   int currentB = 0;\n7    for (\
    \ int c=0; c<cols; c++ ) // transpose by columns\n8      for ( int i=0; i<terms;\
    \ i++ )\n9      // find and move terms in column c\n10     if ( smArray[i].col\
    \ == c )\n11     {\n12       b.smArray[CurrentB].row = c;\n13       b.smArray[CurrentB].col\
    \ = smArray[i].row;\n14       b.smArray[CurrentB++].value= smArray[i].value;\n\
    15     }\n16   } // end of if (terms > 0)\n17   return b;\n18 }\n```\n\nwe can\
    \ get an easy O(cols* rows ) algorithm as:\n\n```\nfor (int j=0;j < columns;j++)\n\
    \    for (int i=0; i < rows; i++) B[j][i] = A[i][j];\n```\n\n### Further improvement:\n\
    \nIf we use some more space to store some knowledge about the matrix, we can do\
    \ much better: doing it in O(cols + terms).\n\n- get the number of elements in\
    \ each column of *this = the number of elements in each row of b;\n- obtain the\
    \ starting point in b of each of its rows;\n- move the elements of *this one by\
    \ one into their right position in b.\n\nNow the algorithm FastTranspose.\n\n\
    ```\n1 SparseMatrix SparseMatrix::FastTranspose ()\n2 { // return the transpose\
    \ of *this in O(terms+cols) time.\n3   SparseMatrix b(cols, rows, terms);\n4 \
    \  if (terms > 0)\n5   { // nonzero matrix\n6     int *rowSize = new int[cols];\n\
    7     int *rowStart = new int[cols];\n8     // compute rowSize[i] = number of\
    \ terms in row i of b\n9     fill(rowSize, rowSize + cols, 0); // initialze\n\
    10   for (i=0; i<terms; i++ ) rowSize[smArray[i].col]++;\n22    delete [ ] rowSize;\n\
    23    delete [ ] rowStart;\n24 } // end of if\n25 return b;\n26 }\n```\n\nFor\
    \ Fig.2.3(a), after line 13, we get :\n\n|  | [0] | [1] | [2] | [3] | [4] | [5]\
    \ |\n|---|---:|---:|---:|---:|---:|---:|\n| RowSize= | 2 | 1 | 2 | 2 | 0 | 1 |\n\
    | RowStart= | 0 | 2 | 3 | 5 | 7 | 7 |\n\nNote the error in P101 of the text book!\n\
    \n## 2.6 The String Abstract data Type\n\nA string  S = s₀, s₁, ..., sₙ₋₁\\nwhere\
    \  sᵢ ∈ char, 0 ≤ i < n, n is the length.\n\n### ADT 2.5 String\n\n```\nclass\
    \ String\n{\n    // a finite set of zero or more characters;\npublic:\n    String\
    \ (char *init, int m);\n    // initialize *this to string init of length m\n```\n\
