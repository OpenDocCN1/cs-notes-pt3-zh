    ![](img/15e8d7d94d8ddf02cb6839870195a31e_427_0.png)


    The subtrees, say the right, now has its:


    preorder: D E F G H I


    inorder: E D G H F I


    Using the above observation recursively, we have:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_428_0.png)


    Continuing in this way, we finally get:


    Note the if condition is essential, as otherwise, a binary tree may have many
    preorder/inorder sequences, as:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_431_0.png)


    => A B C / B A C


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_431_1.png)


    => B C A / C B A


    To be convenient, let the nodes of an n nodes binary tree be numbered 1,2,...,n.


    The inorder permutation defined by such a binary tree is the order in which its
    nodes are visited during an inorder traversal.


    A preorder permutation is similarly defined.


    For example, for the binary tree in the next slide,


    Its preorder permutation: 1 2 3 4 5 6 7 8 9


    Its inorder permutation: 2 3 1 5 4 7 8 6 9


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_433_0.png)


    If the nodes of a binary tree are numbered such that its preorder permutation
    is 1,2,...,n, then distinct binary trees define distinct inorder permutations.


    The number of distinct binary trees = the number of distinct inorder permutations
    obtainable from binary trees having preorder permutation 1,2,...,n.


    Assume for k<n, it is also true.


    For k=n, let a₁, a₂, ..., aᵣ, aᵣ₊₁, ..., aₙ be the inorder permutation, and aᵣ
    be the root of the tree, i.e.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_436_0.png)


    let b₁, ..., bᵣ₋₁ be the preorder permutation of subtree (a₁, ..., aᵣ₋₁) and c₁,
    ..., cₙ₋ᵣ be the preorder permutation of subtree (aᵣ₊₁, ..., aₙ).


    Then


    $a_r=i,\ (1\le r\le n)$


    $b_1,\ldots,b_{r-1}=i+1,\ i+2,\ldots,\ i+r-1,$


    $c_1,\ldots,c_{n-r}=i+r,\ i+r+1,\ldots,j.$


    Now with $i,i+1,\ldots,j$, we can get the inorder permutation through a stack.


    First, put $a_r=i$ into the stack, then by induction hypothesis, with $b_1,\ldots,b_{r-1}=i+1,\
    i+2,\ldots,i+r-1$, we can get $a_1,a_2,\ldots,a_{r-1}$. Pop $i$, we get $a_1,a_2,\ldots,a_{r-1},a_r$.
    Finally, with $c_1,\ldots,c_{n-r}=i+r,\ i+r+1,\ldots,j$, we can get $a_{r+1},\ldots,a_n$,
    following $a_1,a_2,\ldots,a_{r-1},a_r$, we get


    $a_1,a_2,\ldots,a_r,a_{r+1},\ldots,a_n$


    Similarly, we can prove that given a stack permutation, we can get a equivalent
    inorder permutation.


    Now let bₙ be the number of distinct binary trees with n nodes, then bₙ is the
    sum of all the possible binary trees formed in the following way:


    A root and two subtrees with i nodes and n-i-1 nodes, for 0 ≤ i ≤ n-1.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_438_0.png)


    For each \(i\), we have \(b_i b_{n-i-1}\) distinct trees, so


    \[b_n=\sum_{i=0}^{n-1} b_i b_{n-i-1},\quad n\ge 1,\quad \text{and } b_0=1 \tag{5.3}\]


    To obtain \(b_n\) in term of \(n\), we must solve the recurrence of Eq. (5.3).


    Let \[B(x)=\sum_{i\ge 0} b_i x^i\tag{5.4}\]


    Which is the generating function for the number of binary trees.


    ## Since


    B(x)=1+∑_{i≥1} b_i x^i

    =1+∑_{i≥1}∑_{j=0}^{i-1} b_j b_{i-j-1} x^i

    =1+x[∑_{i≥1}∑_{j=0}^{i-1} b_j b_{i-j-1} x^{i-1}]

    =1+x[∑_{i≥0}∑_{j=0}^{i} b_j b_{i-j} x^{i}]

    =1+x[∑_{k,l≥0} b_k b_l x^{k+l}]

    =1+x B^2(x)


    xB²(x)= B(x)-1


    To solve this quadratic and note B(0)= b₀=1, we get


    B(x)= (1−√1−4x)/(2x)


    Using binomial theorem to expand (1-4x)^{1/2} to obtain


    B(x)= 1/(2x) (1− Σ_{n≥0} (1/2 choose n) (−4x)^n )


    = 1/(2x) (1− (1/2 choose 0) (−4x)^0 − Σ_{n≥1} (1/2 choose n) (−4x)^n )


    ## Let n=m+1, we have


    B(x)= \frac{1}{2x} \left( - \sum_{m\ge0} \binom{1/2}{m+1} (-1)^{m+1} (2^2)^{m+1}
    x^{m+1} \right)


    = \frac{1}{2x} \left( \sum_{m\ge0} \binom{1/2}{m+1} (-1)^{m} 2^{2m+2} x^{m+1}
    \right)


    = \sum_{m\ge0} \binom{1/2}{m+1} (-1)^{m} 2^{2m+1} x^{m} \quad (5.5)


    Comparing Eqs.(5.4) and (5.5), we see that bₙ, which is the coefficient of xⁿ
    in B(x), is


    bₙ = \binom{1/2}{n+1} (-1)ⁿ 2^{2n+1}


    = \frac{\frac{1}{2}(\frac{1}{2}-1)...(\frac{1}{2}-n)}{(n+1)!} (-1)ⁿ 2^{2n+1}


    = \frac{\frac{1}{2}·\frac{1}{2}·\frac{3}{2}...\frac{2n-1}{2}·2^{n+1}}{(n+1)!}
    2ⁿ


    = \frac{1·3·5...(2n-3)(2n-1)·2ⁿ}{(n+1)!}·\frac{n!}{n!}

