    +   - If (u, v) ∈ E(G), we say u and v are adjacent and edge (u, v) is incident
    on vertices u and v. If <u, v> is a directed edge, then vertex u is adjacent to
    v, and v is adjacent from u, <u, v> is incident to u and v.

    +   - A subgraph of G is a graph G` such that V(G`) ⊆ V(G) and E(G`) ⊆ E(G).

    +   - A path from u to v in G is a sequence of vertices u, i₁, i₂, ..., iₖ, v
    such that (u, i₁), (i₁, i₂), ..., (iₖ, v) are edges in E(G). If G` is directed,
