    }\na[i+1]=e;\n}\n```\n\n## 插入排序：\n\n从有序序列 a[1] 开始，然后依次将 a[2], a[3], ..., a[n]\
    \ 插入到序列中。\n\n```\ntemplate<class T>\nvoid InsertionSort (Element *a, const int\
