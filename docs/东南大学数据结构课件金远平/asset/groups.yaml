    Fig. 6.20 (b) its biconnected components'
  - '[PAGE 501]


    Of the same graph G:


    Two biconnected components can have at most one vertex in common.


    No edge can be in two or more biconnected components, hence the biconnected components
    partition E(G).


    To find the biconnected components of G, we can use any depth-first tree of it.
    For the graph of Fig. 6.20(a), a depth-first tree with root 0 is shown in Fig.
    6.21 with the nontree edges shown by broken lines.'
  - '[PAGE 502]


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_502_0.png)


    **Fig. 6.21  A depth-first spanning tree of Fig. 6.19(a)**'
  - '[PAGE 503]


    The numbers outside the vertices gives the sequence in which the vertices are
    visited during the depth-first search.


    The number is called the depth-first number, dfn, of the vertex. For example,
    dfn(1)=2, dnf(7)=4, dfn(6)=8.


    Note that if u is an ancestor of v in the depth-first tree, then dfn(u)<dfn(v).


    A nontree edge (u, v) is a back edge with respect to a spanning tree T iff either
    u is an ancestor of v or v is an ancestor of u. (1, 4) and (6, 7) are back edges.'
  - '[PAGE 504]


    A nontree edge that is not a back edge is called a **cross edge**. No graph can
    have cross edges with respect to any its depth-first spanning trees.


    So the root of the depth-first spanning tree is an articulation point iff it has
    at least two children.


    Further, any vertex u is an articulation point iff it has at least one child,
    w, such that it is not possible to reach an ancestor of u using a path composed
    solely of w, descendants of w, and a single back edge.'
  md: "\n## 6.2.3 Connected Components\n\nTo obtain all the connected components of\
