    # 1.7 Performance Analysis and

    Measurement


    **Definition:** the **Space complexity** of a program is the amount of memory
    it needs to run to completion. The **Time complexity** of a program is the amount
    of computer time it needs to run to completion.


    +   1. Priori estimates --- Performance analysis

    +   2. Posteriori testing--- Performance measurement'
  - "[PAGE 26]\n\n# 1.7.1 Performance Analysis\n\n# 1.7.1.1 Space complexity\n\nThe\
    \ space requirement of program P:\nS(P)=c+Sₚ(instance characteristics)\nWe concentrate\
    \ solely on Sₚ.\n\n# Example 1.10\n\n```\nfloat Rsum (float *a, const int n) //compute\
    \ ∑_{i=0}^{n-1} a[i] recursively\n{\n    if (n <=0) return 0;\n    else return\
    \ (Rsum(a,n-1)+a[n-1]);\n}\n```"
  - '[PAGE 27]


    The instances are characterized by n, each call requires 4 words (n, a, return
    value, return address), the depth of recursion is n+1, so


    $S_{rsum}(n)=4(n+1)$'
  - "[PAGE 28]\n\n# 1.7.1.2 Time complexity\n\nRun time of a program P:\n tₚ(instance\
    \ characteristics)\n\nA program step is loosely defined as a syntactically or\
    \ semantically meaningful segment of a program that has an execution time that\
    \ is independent of instance characteristics.\n\nIn P41-43 of the textbook, there\
    \ is an detailed assignment of step counts to statements in C++."
  - '[PAGE 29]


    Our main concern is on how many steps are needed by a program to solve a particular
    problem instance?


    2 ways:


    +   (1) count

    +   (2) table'
  - "[PAGE 30]\n\n# Example 1.12\n\n```\ncount=0;\nfloat Rsum (float *a, const int\
    \ n)\n{\n    count++; // for if\n    if (n <=0) {\n        count++; // for return\n\
    \        return 0;\n    }\n    else {\n        count++; // for return\n      \
    \  return (Rsum(a,n-1)+a[n-1]);\n    }\n}\n```"
