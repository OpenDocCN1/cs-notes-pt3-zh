    \ derives from MaxPQ<T>, as in the next slide:\n\n```\ntemplate <class T>\nMaxHeap<T>::MaxHeap\
    \ (int theCapacity=10)\n{ //constructor\n    if (theCapacity < 1) throw \"Capacity\
    \ must be >= 1\";\n    capacity = theCapacity;\n    heapSize = 0;\n    heap =\
    \ new T[capacity+1]; //heap[0] not used\n}\n```\n\n```\ntemplate <class T>\nInline\
    \ T& MaxHeap<T>::Top()\n{\n    if (IsEmpty()) throw \"The heap is empty\";\n \
    \   return heap[1];\n}\n```\n\n## Analysis of Push:\n\nA complete binary tree\
