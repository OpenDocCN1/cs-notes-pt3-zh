    \ operator==, operator>>, operator<<, etc.\n\nA chain class should provide functions\
    \ to insert and delete elements.\n\nAnother useful function is reverse that does\
    \ an “in-place’ reversal of the elements in a chain.\n\nTo be efficient, we add\
    \ a private member **last** to `Chain<T>`, which points to the last node in the\
    \ chain.\n\n## InsertBack\n\n```\ntemplate <class T>\nvoid Chain<T>::InsertBack(const\
    \ T& e)\n{\n    if (first) { // nonempty chain\n        last->link = new ChainNode<T>(e);\n\
    \        last = last->link;\n    }\n    else first = last = new ChainNode<T>(e);\n\
    }\n```\n\nThe complexity: O(1).\n\n## Concatenate\n\n```\ntemplate <class T>\n\
    void Chain<T>::Concatenate(Chain<T>& b)\n{ // b is concatenete to the end of *this\n\
    \    if (first) { last->link = b.first; last = b.last;}\n    else { first = b.first;\
    \ last = b.last; }\n    b.first = b.last = 0;\n}\n```\n\nThe complexity: O(1).\n\
    \n## Reverse\n\n```\ntemplate <class T>\nvoid Chain<T>::Reverse()\n{\n    // make\
