  - '[PAGE 761]


    In general, we need to compute \(c_{ij}\) for j-i=1,2,...,n.


    And for each j-i=m,


    there are n-m+1 \(c_{ij}\)''s (\(c_{0m},...,c_{n-m,n}\)) to compute.


    The computation of each \(c_{ij}\) need to find the minimum from m quantities
    (10.4)---need O(m).


    The total time for all \(c_{ij}\)''s with j-i=m is O((n-m)m).


    The total time is


    \[\sum_{1\le m\le n} ((n-m)m)=O(n^3)\]'
  - '[PAGE 762]


    In fact, Knuth proved that the optimal l in (10.4) may be found by limiting the
    search to the range \(r_{i,j-1} \le l \le r_{i+1,j}\). In this case, the computing
    time becomes \(O(n^2)\). Algorithm obst uses this result.


    Class BST of Chapter 5 is augmented to include obst as a private member function
    and to have the private data members r, c, and w.


    Now the algorithm obst.'
  - "[PAGE 763]\n\n```\ntemplate <class KeyType>\nBST<KeyType>::Obst(int *p,int *q,Element<KeyType>*a,int\
    \ n)\n//given a₁< a₂<... <aₙ, and pⱼ, 1≤j≤n, and qᵢ, 0≤i≤n, compute cᵢⱼ\n//for\
    \ Tᵢⱼ for aᵢ₊₁,..., aⱼ. Also compute rᵢⱼ and wᵢⱼ.\n{\n    for (int i=0; i<n; i++)\
    \ {\n        w[i][i]=q[i]; r[i][i]=c[i][i]=0;    //initialize\n        w[i][i+1]=q[i]+q[i+1]+p[i+1];\
    \ //optimal trees with one node\n        r[i][i+1]=i+1;\n        c[i][i+1]=w[i][i+1];\n\
    \    }\n    w[n][n]=q[n]; r[n][n]=c[n][n]=0;\n```"
  - "[PAGE 764]\n\n```\nfor (int m=2; m<=n; m++) //find optimal b.s.t. with m nodes\n\
    \    for (i=0; i<=n-m; i++) {\n        int j=i+m;\n        w[i][j]=w[i][j-1]+p[j]+q[j];\n\
    \        int k=KnuthMin(i,j);\n        //KnuthMin return k in the range [r[i,j-1],\
    \ r[i+1, j]]\n        //minimizing c[i,k-1]+c[k,j]\n        c[i][j]=w[i][j]+c[i][k-1]+c[k][j];\
    \ //Eq. (10.3)\n        r[i][j]=k;\n    }\n} // end of Obst\n```\n\nThe actual\
    \ T₀ₙ may be constructed from rᵢⱼ in O(n).\n\nExercises: P562-3"
  md: "\n- $r_{ii}=0$, $w_{ii}=q_i$, $0 \\le i \\le n$.\n- The optimal b.s.t. for\
    \ $a_1, \\ldots, a_n$ is $T_{0n}$. Its cost is $c_{0n}$, root $r_{0n}$.\n\nIf\
    \ $T_{ij}$ is an optimal b.s.t. for $a_{i+1}, \\ldots, a_j$ and $r_{ij}=k$, $i\
    \ < k \\le j$, then $T_{ij}$ has 2 subtrees L and R.\n\n- L contains the identifiers\
    \ $a_{i+1}, \\ldots, a_{k-1}$.\n- R contains the identifiers $a_{k+1}, \\ldots,\
    \ a_j$.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_753_0.png)\n\nThe cost $c_{ij}$\
    \ of $T_{ij}$ is\n\n$$c_{ij} = p_k + \\operatorname{cost}(L) + \\operatorname{cost}(R)\
    \ + w_{i,k-1} + w_{kj} \\quad (10.2)$$\n\nFrom (10.2), if $c_{ij}$ is to be minimal,\
    \ then $\\operatorname{cost}(L)=c_{i,k-1}$ and $\\operatorname{cost}(R)=c_{kj}$,\
    \ as otherwise we could replace either L or R by a subtree with a lower cost,\
    \ thus generating a b.s.t. for $a_{i+1}, \\ldots, a_j$ with a lower cost than\
    \ $c_{ij}$. This violates the assumption that $T_{ij}$ is optimal.\n\nHence, Eq.\
    \ (10.2) becomes\n\n$$c_{ij} = p_k + w_{i,k-1} + w_{kj} + c_{i,k-1} + c_{kj} =\
    \ w_{ij} + c_{i,k-1} + c_{kj} \\quad (10.3)$$\n\nSince $T_{ij}$ is optimal, from\
    \ (10.3) we know $r_{ij}=k$ is such that\n\n$$w_{ij}+c_{i,k-1}+c_{kj}=\\min_{i<l\\\
    le j}\\{w_{ij}+c_{i,l-1}+c_{lj}\\}$$\n\nor\n\n$$c_{i,k-1}+c_{kj}=\\min_{i<l\\\
    le j}\\{c_{i,l-1}+c_{lj}\\} \\quad (10.4)$$\n\n### Note also\n\n$$w_{ij}=w_{i,j-1}+p_j+q_j.$$\n\
    \n(10.4) gives us a means of obtaining $r_{0n}$, $T_{0n}$ and $c_{0n}$, starting\
    \ from $r_{ii}=0$, $T_{ii}=\\varnothing$ and $c_{ii}=0$.\n\n## Example 10.2\n\n\
    Let $n=4$, $(a_1, a_2, a_3, a_4)=(do, if, return, while)$.\n\nLet $(p_1, p_2,\
    \ p_3, p_4)=(3,3,1,1)$ and $(q_0, q_1, q_2, q_3, q_4)=(2,3,1,1,1)$.\n\nThe p’s\
    \ and q’s are integers for convenience.\n\nInitially, $w_{ii}=q_i$, $r_{ii}=0$,\
    \ $c_{ii}=0$, $0 \\le i \\le 4$.\n\nUsing (10.3) and (10.4), we get\n\n$$w_{01}=p_1+w_{00}+w_{11}=p_1+q_1+w_{00}=8$$\n\
    \n$$c_{01}=w_{01}+\\min\\{c_{00}+c_{11}\\}=8$$\n\n$$r_{01}=1$$\n\n$$w_{12}=p_2+w_{11}+w_{22}=p_2+q_2+w_{11}=7$$\n\
    \n$$c_{12}=w_{12}+\\min\\{c_{11}+c_{22}\\}=7$$\n\n$$r_{12}=2$$\n\n$$w_{23}=p_3+w_{22}+w_{33}=p_3+q_3+w_{22}=3$$\n\
    \n$$c_{23}=w_{23}+\\min\\{c_{22}+c_{33}\\}=3$$\n\n$$r_{23}=3$$\n\n$$w_{34}=p_4+w_{33}+w_{44}=p_4+q_4+w_{33}=3$$\n\
    \n$$c_{34}=w_{34}+\\min\\{c_{33}+c_{44}\\}=3$$\n\n$$r_{34}=4$$\n\n| i \\ j-i |\
    \ 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|---|\n| 0 | w₀₀=2<br>c₀₀=0<br>r₀₀=0\
    \ | w₁₁=3<br>c₁₁=0<br>r₁₁=0 | w₂₂=1<br>c₂₂=0<br>r₂₂=0 | w₃₃=1<br>c₃₃=0<br>r₃₃=0\
    \ | w₄₄=1<br>c₄₄=0<br>r₄₄=0 |\n| 1 | w₀₁=8<br>c₀₁=8<br>r₀₁=1 | w₁₂=7<br>c₁₂=7<br>r₁₂=2\
    \ | w₂₃=3<br>c₂₃=3<br>r₂₃=3 | w₃₄=3<br>c₃₄=3<br>r₃₄=4 | |\n| 2 | w₀₂=12<br>c₀₂=19<br>r₀₂=1\
    \ | w₁₃=9<br>c₁₃=12<br>r₁₃=2 | w₂₄=5<br>c₂₄=8<br>r₂₄=3 | | |\n| 3 | w₀₃=14<br>c₀₃=25<br>r₀₃=2\
    \ | w₁₄=11<br>c₁₄=19<br>r₁₄=2 | | | |\n| 4 | w₀₄=16<br>c₀₄=32<br>r₀₄=2 | | | |\
    \ |\n\nWith the data in the table, it is possible to construct $T_{04}$ as shown\
    \ below:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_760_0.png)\n\nOptimal b.s.t.\
    \ for Example 10.2\n\nIn general, we need to compute $c_{ij}$ for $j-i=1,2,\\\
    ldots,n$.\n\nAnd for each $j-i=m$, there are $n-m+1$ $c_{ij}$'s ($c_{0m},\\ldots,c_{n-m,n}$)\
    \ to compute.\n\nThe computation of each $c_{ij}$ needs to find the minimum from\
    \ $m$ quantities (10.4) — needs $O(m)$.\n\nThe total time for all $c_{ij}$'s with\
    \ $j-i=m$ is $O((n-m)m)$.\n\nThe total time is\n\n$$\\sum_{1\\le m\\le n} (n-m)m\
    \ = O(n^3)$$\n\nIn fact, Knuth proved that the optimal $l$ in (10.4) may be found\
    \ by limiting the search to the range $r_{i,j-1} \\le l \\le r_{i+1,j}$. In this\
    \ case, the computing time becomes $O(n^2)$. Algorithm obst uses this result.\n\
    \nClass BST of Chapter 5 is augmented to include obst as a private member function\
    \ and to have the private data members $r$, $c$, and $w$.\n\nNow the algorithm\
    \ obst.\n\n```cpp\ntemplate <class KeyType>\nvoid BST<KeyType>::obst(int *p, int\
    \ *q, Element<KeyType> *a, int n)\n// given a1 < a2 < ... < an, and pj, 1 <= j\
    \ <= n, and qi, 0 <= i <= n, compute cij\n// for Tij for a_{i+1}, ..., aj. Also\
    \ compute rij and wij.\n{\n    for (int i = 0; i < n; i++) {\n        w[i][i]\
    \ = q[i]; r[i][i] = c[i][i] = 0;    // initialize\n        w[i][i+1] = q[i] +\
    \ q[i+1] + p[i+1]; // optimal trees with one node\n        r[i][i+1] = i + 1;\n\
    \        c[i][i+1] = w[i][i+1];\n    }\n    w[n][n] = q[n]; r[n][n] = c[n][n]\
    \ = 0;\n\n    for (int m = 2; m <= n; m++) // find optimal b.s.t. with m nodes\n\
    \        for (int i = 0; i <= n - m; i++) {\n            int j = i + m;\n    \
    \        w[i][j] = w[i][j-1] + p[j] + q[j];\n            int k = KnuthMin(i, j);\n\
    \            // KnuthMin returns k in the range [r[i][j-1], r[i+1][j]]\n     \
    \       // minimizing c[i][k-1] + c[k][j]\n            c[i][j] = w[i][j] + c[i][k-1]\
    \ + c[k][j]; // Eq. (10.3)\n            r[i][j] = k;\n        }\n} // end of obst\n\
    ```\n\nThe actual $T_{0n}$ may be constructed from $r_{ij}$ in $O(n)$.\n\nExercises:\
    \ P562-3\n"
