    \ A Simple Algorithm\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_95_0.png)\n\n\
    The idea is showed in the function Find .\n"
  mdcn: "\n\n## 2.4.3 转置矩阵\n\n### 转置：\n\n如果一个元素在原矩阵中的位置是 [ i ][ j ]，那么它在转置矩阵中的位置是\
    \ [ j ][ i ]。\n\n图2.3(b) 显示了图2.3(a) 的转置。\n\n| smArray | row | col | value |\n\
    |---|---|---:|---:|---:|\n| smArray[0] | 0 | 0 | 15 |\n| [1] | 0 | 4 | 91 |\n\
    | [2] | 1 | 1 | 11 |\n| [3] | 2 | 1 | 3 |\n| [4] | 2 | 5 | 28 |\n| [5] | 3 | 0\
    \ | 22 |\n| [6] | 3 | 2 | -6 |\n| [7] | 5 | 0 | -15 |\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_80_0.png)\n\
    \n# 图 2.3 (b)\n\n### 第一次尝试：\n\nFor (each row i)\n\ttake element (i, j, value)\
    \ and\n\tstore it in (j, i, value) of the transpose;\n\n**难度：** 在所有前面的元素都被处理之前，不知道将\
    \ (j, i, value) 放在哪里。\n\n### 改进：\n\nFor (all elements in column j)\nstore (i,\
    \ j, value) of the original matrix as\n(j, i, value) of the transpose;\n\n由于行是有序的，我们将按正确的列顺序定位元素。\n\
    \n```\n1 SparseMatrix SparseMatrix::Transpose ()\n2 { // return the transpose\
    \ of *this\n3   SparseMatrix b(cols, rows, terms);\n4   if (terms > 0)\n5   {\
    \  //nonzero matrix\n6   int currentB = 0;\n7    for ( int c=0; c<cols; c++ )\
    \ // transpose by columns\n8      for ( int i=0; i<terms; i++ )\n9      // find\
    \ and move terms in column c\n10     if ( smArray[i].col == c )\n11     {\n12\
    \       b.smArray[CurrentB].row = c;\n13       b.smArray[CurrentB].col = smArray[i].row;\n\
    14       b.smArray[CurrentB++].value= smArray[i].value;\n15     }\n16   } // end\
    \ of if (terms > 0)\n17   return b;\n18 }\n```\n\n我们可以用一个简单的 O(cols* rows ) 算法得到：\n\
    \n```\nfor (int j=0;j < columns;j++)\n    for (int i=0; i < rows; i++) B[j][i]\
    \ = A[i][j];\n```\n\n### 进一步改进：\n\n如果我们使用一些额外的空间来存储有关矩阵的一些知识，我们可以做得更好：在 O(cols\
    \ + terms) 时间内完成。\n\n- get the number of elements in each column of *this = the\
    \ number of elements in each row of b;\n- obtain the starting point in b of each\
    \ of its rows;\n- move the elements of *this one by one into their right position\
    \ in b.\n\n现在是算法 FastTranspose。\n\n```\n1 SparseMatrix SparseMatrix::FastTranspose\
    \ ()\n2 { // return the transpose of *this in O(terms+cols) time.\n3   SparseMatrix\
    \ b(cols, rows, terms);\n4   if (terms > 0)\n5   { // nonzero matrix\n6     int\
    \ *rowSize = new int[cols];\n7     int *rowStart = new int[cols];\n8     // compute\
    \ rowSize[i] = number of terms in row i of b\n9     fill(rowSize, rowSize + cols,\
