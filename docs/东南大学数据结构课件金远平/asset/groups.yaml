    \ undirected G is **connected** iff for every pair of distinct u and v in V(G),\
    \ there is a path from u to v.\n\n• A connected component is a maximal connected\
    \ subgraph.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_453_0.png)\n\nG₄ A graph\
    \ with two connected components\n\n- A **tree** is a connected acyclic graph.\n\
    - A directed G is **strongly connected** iff for every pair of distinct u and\
    \ v in V(G), there is a directed path from u to v and also from v to u.\n- A **strongly\
    \ connected component** is a maximal subgraph that is strongly connected.\n- The\
    \ **degree** of a vertex is the number of edges incident to it.\n\n## ADT 6.1\
    \ Graph\n\n```\nclass Graph\n{ // A non empty set of vertices and a set of undirected\n\
    // edges, where each edge is a pair of vertices.\npublic:\n    virtual ~Graph(){\
    \ };\n    // virtual destructor\n    bool IsEmpty() const {return n==0;};\n  \
    \  // return true iff graph has no vertices\n    int NumberOfVertices() const\
    \ {return n;};\n    // return the number of vertices in the graph\n    int NumberofEdges()\
    \ const {return e;};\n    // return number of edges in the graph\n    virtual\
    \ int Degree(int u) const =0;\n    // return number of edges incident to vertex\
    \ u\n```\n\n```\n```cpp\nvirtual bool ExistsEdge(int u, int v) const =0;\n// return\
    \ true iff graph has edge (u, v)\nvirtual void InsertVertex (int v) =0;\n// insert\
    \ vertex v into graph, v has no incident edges\nvirtual void InsertEdge (int u,\
    \ int v) =0;\n// insert edge (u, v) into graph\nvirtual void DeleteVertex (int\
    \ v);\n// delete v and all edges incident to it\nvirtual void DeleteEdge (int\
    \ u, int v) =0;\n// delete edge (u, v) from the graph\nprivate:\n    int n;  \
    \  // number of vertices\n    int e;    // number of edges\n};\n```\n```\n"
  mdcn: "\n\n= \\frac{1.3.5...(2n-3)(2n-1).2.4.6...(2n-2)(2n)}{(n+1)!\\,n!}\n\n= \\\
    frac{(2n)!}{(2n-n)!\\,n!} \\cdot \\frac{1}{n+1}\n\n= \\frac{1}{n+1} \\binom{2n}{n}\n\
    \n= O(4^n / n^{3/2})\n\n## 练习 P323-4,5\n\n## 第 6 章\n图\n\n## 6.1 图抽象数据类型\n\n###\
    \ 6.1.1 引言\n\n图已被广泛应用于：\n- 电路分析\n- 寻找最短路径\n- 项目规划\n- 化学化合物识别\n- 统计力学\n- 遗传学\n\
    - 控制论\n- 语言学\n- 社会科学\n- ...\n\n### 6.1.2 定义\n\n- 图 G = (V, E)\n- 顶点 V(G) ≠ ∅\n\
    - 边 E(G)\n- 无向图：(u, v) = (v, u)\n- 有向图：<u, v>, u---尾, v---头, <u,v> ≠ <v,u>\n\n\
    三个图：\n\nG₁：\n\nV(G₁)={0,1,2,3}\n\nE(G₁)={(0,1),(0,2),(0,3),(1,2),(1,3),(2,3)}\n\
    \nG₂：\n\nV(G₂)={0,1,2,3,4,5,6}\n\nE(G₂)={(0,1),(0,2),,,(1,3),(1,4),(2,5),(2,6)}\n\
    \nG₃：\n\nV(G₃) = {0,1,2}\n\nE(G₃) = {<0,1>,<1,0>,<1,2>}  (有向)\n\n(a) G₁\n\n(b)\
    \ G₂\n\n(c) G₃\n\n限制：\n1. $(v, v)$ 或 $\\langle v, v\\rangle$ 是非法的，这样的边称为自环。\n\
    2. 不允许同一边的多次出现。如果允许，则得到一个多重图。\n\n- 任意 n 个顶点的无向图的最大边数为 $n(n-1)/2$，有向图为 $n(n-1)$。\n\
    - 具有 $n(n-1)/2$ 条边的 n 个顶点的无向图称为完全图。\n\n- 如果 (u, v) ∈ E(G)，我们说 u 和 v 相邻且边 (u, v)\
    \ 与顶点 u 和 v 相关联。如果 <u, v> 是有向边，则顶点 u 与 v 相邻，v 从 u 相邻，<u, v> 与 u 和 v 相关联。\n- G\
    \ 的子图是图 G` 使得 V(G`) ⊆ V(G) 且 E(G`) ⊆ E(G)。\n- G 中从 u 到 v 的路径是顶点序列 u, i₁, i₂, ...,\
    \ iₖ, v 使得 (u, i₁), (i₁, i₂), ..., (iₖ, v) 都是 E(G) 中的边。如果 G` 是有向的，则 <u, i₁>, <i₁,\
    \ i₂>, ..., <iₖ, v> 都是 E(G`) 中的边。\n- 路径的长度是其上的边数。\n\n- **简单路径**是指除可能的首尾顶点外所有顶点都不同的路径。\n\
    - **环**是指首尾顶点相同的简单路径。\n- 对于有向图，我们有有向路径和有向环。\n- 在无向图 G 中，u 和 v **连通** 当且仅当 G 中存在从\
    \ u 到 v 的路径（也从 v 到 u）。\n- 无向图 G **连通** 当且仅当 V(G) 中每对不同的 u 和 v 之间存在从 u 到 v 的路径。\n\
    \n• 连通分量是最大连通子图。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_453_0.png)\n\nG₄\
    \ 一个具有两个连通分量的图\n\n- **树**是连通无环图。\n- 有向图 G **强连通** 当且仅当 V(G) 中每对不同的 u 和 v 之间存在从\
    \ u 到 v 的有向路径且从 v 到 u 的有向路径。\n- **强连通分量**是最大强连通子图。\n- 顶点的**度**是与之关联的边的数量。\n\n\
    ## ADT 6.1 图\n\n```\nclass Graph\n{ // 一个非空的顶点集合和一个无向边集合，\n// 其中每条边都是一个顶点对。\n\
    public:\n    virtual ~Graph(){ };\n    // 虚析构函数\n    bool IsEmpty() const {return\
    \ n==0;};\n    // 当且仅当图没有顶点时返回 true\n    int NumberOfVertices() const {return\
    \ n;};\n    // 返回图中的顶点数\n    int NumberofEdges() const {return e;};\n    // 返回图中的边数\n\
    \    virtual int Degree(int u) const =0;\n    // 返回与顶点 u 相关联的边数\n```\n\n```\n\
    ```cpp\nvirtual bool ExistsEdge(int u, int v) const =0;\n// 当且仅当图具有边 (u, v) 时返回\
    \ true\nvirtual void InsertVertex (int v) =0;\n// 将顶点 v 插入图，v 没有关联边\nvirtual void\
    \ InsertEdge (int u, int v) =0;\n// 将边 (u, v) 插入图\nvirtual void DeleteVertex (int\
    \ v);\n// 删除 v 及其所有关联边\nvirtual void DeleteEdge (int u, int v) =0;\n// 从图中删除边\
    \ (u, v)\nprivate:\n    int n;    // 顶点数\n    int e;    // 边数\n};\n```\n```\n"
