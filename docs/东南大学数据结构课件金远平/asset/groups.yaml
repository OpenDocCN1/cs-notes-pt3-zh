    \n总时间为\n\n$$\\sum_{1\\le m\\le n} (n-m)m = O(n^3)$$\n\n事实上，Knuth 证明了 (10.4) 中的最优\
    \ $l$ 可以通过将搜索范围限制在 $r_{i,j-1} \\le l \\le r_{i+1,j}$ 来找到。此时计算时间变为 $O(n^2)$。算法\
