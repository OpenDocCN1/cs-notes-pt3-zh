  - "[PAGE 850]\n\n```\nDelete (E_i, A_i) from p; n--;\n**while** (n<⌈m/2⌉-1) && (p!=root)\n\
    \    **if** (p has a nearest right sibling q) {\n        Let q: n_q, A^q_0, (E^q_1\
    \ A^q_1), ..., (E^q_{n_q} A^q_{n_q});\n        Let r: n_r, A^r_0, (E^r_1 A^r_1),\
    \ ..., (E^r_{n_r} A^r_{n_r}) be parent of p and q;\n        Let A^r_j=q and A^r_{j-1}=p;\n\
    \        **if** (n_q >= ⌈m/2⌉) { // rotation\n            (E_{n+1}, A_{n+1})=(E^r_j,\
    \ A^q_0); n=n+1;   // update p\n            E^r_j=E^q_1;                     \
    \            // update r\n            (n_q,A^q_0,(E^q_1 A^q_1),...)=(n_q-1,A^q_1,(E^q_2\
    \ A^q_2),...); // update q\n            **write** p, q, r to disk; **return**;\n\
    \        }\n        // combine nodes p, E^r_j, and q\n        s=2*⌈m/2⌉-2;\n```"
  md: "\nThe total disk accesses is at most\nh+2(h-1)+3=3h+1\n\nThe average number\
    \ of disk accesses is, however, approximately h+1 for larger m.\n\nTo show this,\
    \ suppose we start with an empty B-tree and insert N elements into it.\n\nLet\
    \ p be the number of internal nodes in the final B-tree with N elements, then\
    \ the total number of nodes split is at most p-2. Because\n- Each time a node\
    \ splits, at least one additional node is created.\n- The splitting of the root\
    \ node create two additional nodes and the root is the first to split.\n- The\
    \ first node created from no splitting.\n\n## As shown in the following:\n\n(a)\
    \ p=1,s=0\n\n(b) p=3,s=1\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_839_0.png)\n\
    \n(c) p=4, s=2\n\nA B-tree of order m with p nodes has at least\n\n$1 + (\\lceil\
    \ m/2 \\rceil - 1)(p-1)$ elements.\n\n*(root)* *(other nodes)*\n\nThe average\
    \ number of splitting s_avg\n\n$s_{avg} = (\\text{total number of splits})/N$\n\
    \n$\\le (p-2)/\\{1 + (\\lceil m/2 \\rceil - 1)(p-1)\\}$\n\n$< 1/(\\lceil m/2 \\\
    rceil - 1)$\n\nFor m=200, $s_{avg} < 1/99$.\n\nThe number of disk accesses in\
    \ an insertion is h+2s+1, where s is the number of nodes split.\n\nSo the average\
    \ disk accesses is\n\nh+2 s_avg +1 < h+2/99+1≈h+1.\n\n## 11.2.4 Deletion from\
    \ a B-Tree\n\nSuppose the key of the element to be deleted is x.\n\nFirst, search\
    \ for x. If x is in a nonleaf node z and x = Eᵢ.K, then the corresponding element\
    \ may be replaced by either the element with smallest key in the subtree Aᵢ or\
    \ the element with largest key in the subtree Aᵢ₋₁. Both are in leaf nodes.\n\n\
    The deletion from a nonleaf node is thus transformed into a deletion from a leaf,\
    \ as shown in the next slide.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_843_0.png)\n\
    \n### 4 cases of deleting from a leaf node p:\n\n(1) p is the root, if p is left\
    \ with at least 1 key, p is written to disk, done. Otherwise the B-tree is empty\
    \ following the deletion.\n\nIn the remaining cases, p is not the root.\n\n(2)\
    \ Following the deletion, p has at least ⌈m/2⌉-1 keys. The modified p is written\
    \ to disk, done.\n\n(3) p has ⌈m/2⌉-2 keys, and its nearest sibling, q, has at\
    \ least ⌈m/2⌉ keys. A rotation is performed as shown in the next slide (suppose\
    \ q be the nearest right sibling of p, r be parent of p and q).\n\nthe changed\
    \ p, q and r are written to disk, done.\n\n(4) p has ⌈m/2⌉-2 keys, and q has ⌈m/2⌉-1\
    \ keys. A combination is performed as shown below:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_846_0.png)\n\
    \nNow p has (⌈m/2⌉-2)+(⌈m/2⌉-1)+1=2⌈m/2⌉-2 ≤ m-1 keys. p is written to disk.\n\
    \nThe number of keys in the parent, r, has been reduced by 1.\n\nIf r does not\
    \ become deficient (i.e., it has at least 1 element if it is the root and ⌈m/2⌉-1\
    \ elements if it is not the root), the changed r is written to disk, done.\n\n\
    When r becomes deficient, if it is the root, it is discarded. Otherwise r has\
    \ ⌈m/2⌉-2 keys, we can first attempt a rotation with one of its\n\nnearest siblings.\
    \ If this is not possible, a combine is done. This process of combining can continue\
    \ up the B-tree until the children of the root are combined.\n\nA high-level description\
    \ of the deletion algorithm is given in the next slide:\n\n```\n// Delete element\
    \ with key x from a B-tree of order m\nSearch the B-tree for node p containing\
    \ the element with key x;\nif (there is no such node p) return;  // no element\
    \ to delete\nLet p be of the form: n, A₀, (E₁, A₁), …, (Eₙ, Aₙ) and Eᵢ.K=x;\n\
    if (p is not a leaf) {\n    Replace Eᵢ with the smallest key element in subtree\
    \ Aᵢ;\n    write the altered p to disk;\n    Let p be the leaf of Aᵢ from which\
    \ the smallest was taken;\n    Let p be of the form: n, A₀, (E₁, A₁), …, (Eₙ,\
    \ Aₙ);\n    i = 1;\n}\n\n// the following deletes Eᵢ from leaf node p\n```\n\n\
    ```\nDelete (E_i, A_i) from p; n--;\n**while** (n<⌈m/2⌉-1) && (p!=root)\n    **if**\
    \ (p has a nearest right sibling q) {\n        Let q: n_q, A^q_0, (E^q_1 A^q_1),\
    \ ..., (E^q_{n_q} A^q_{n_q});\n        Let r: n_r, A^r_0, (E^r_1 A^r_1), ...,\
    \ (E^r_{n_r} A^r_{n_r}) be parent of p and q;\n        Let A^r_j=q and A^r_{j-1}=p;\n\
    \        **if** (n_q >= ⌈m/2⌉) { // rotation\n            (E_{n+1}, A_{n+1})=(E^r_j,\
    \ A^q_0); n=n+1;   // update p\n            E^r_j=E^q_1;                     \
    \            // update r\n            (n_q,A^q_0,(E^q_1 A^q_1),...)=(n_q-1,A^q_1,(E^q_2\
    \ A^q_2),...); // update q\n            **write** p, q, r to disk; **return**;\n\
    \        }\n        // combine nodes p, E^r_j, and q\n        s=2*⌈m/2⌉-2;\n```\n"
  mdcn: "\n\n总的磁盘访问次数最多为\nh+2(h-1)+3=3h+1\n\n然而，平均磁盘访问次数对于较大的 m 来说大约为 h+1。\n\n为证明这一点，假设我们从一棵空的\
    \ B 树开始并向其中插入 N 个元素。\n\n设 p 为最终包含 N 个元素的 B 树中的内部节点数，则节点分裂的总次数最多为 p-2。因为\n- 每次节点分裂，至少会创建一个额外节点。\n\
    - 根节点分裂会创建两个额外节点，且根是第一个分裂的节点。\n- 第一个节点是在没有分裂的情况下创建的。\n\n## 如以下所示：\n\n(a) p=1,s=0\n\
    \n(b) p=3,s=1\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_839_0.png)\n\n(c) p=4,\
    \ s=2\n\n阶为 m 的 B 树有 p 个节点，至少有\n\n$1 + (\\lceil m/2 \\rceil - 1)(p-1)$ 个元素。\n\n\
    *(root)* *(other nodes)*\n\n平均分裂次数 s_avg\n\n$s_{avg} = (\\text{total number of\
    \ splits})/N$\n\n$\\le (p-2)/\\{1 + (\\lceil m/2 \\rceil - 1)(p-1)\\}$\n\n$< 1/(\\\
    lceil m/2 \\rceil - 1)$\n\n对于 m=200，$s_{avg} < 1/99$。\n\n插入操作的磁盘访问次数为 h+2s+1，其中\
    \ s 为分裂的节点数。\n\n因此平均磁盘访问次数为\n\nh+2 s_avg +1 < h+2/99+1≈h+1。\n\n## 11.2.4 从 B 树中删除\n\
    \n假设待删除元素的键为 x。\n\n首先，搜索 x。如果 x 在非叶节点 z 中且 x = Eᵢ.K，则对应的元素可以被子树 Aᵢ 中键最小的元素或子树\
    \ Aᵢ₋₁ 中键最大的元素替换。两者都在叶节点中。\n\n因此，从非叶节点的删除被转化为从叶节点的删除，如下一张幻灯片所示。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_843_0.png)\n\
    \n### 从叶节点 p 删除的 4 种情况：\n\n(1) p 是根，如果 p 至少还剩 1 个键，则将 p 写回磁盘，完成。否则删除后 B 树为空。\n\
    \n在剩余情况下，p 不是根。\n\n(2) 删除后，p 至少有 ⌈m/2⌉-1 个键。将修改后的 p 写回磁盘，完成。\n\n(3) p 有 ⌈m/2⌉-2\
    \ 个键，且其最近的兄弟节点 q 至少有 ⌈m/2⌉ 个键。执行如下一张幻灯片所示的旋转（假设 q 为 p 的最近右兄弟，r 为 p 和 q 的父节点）。\n\
    \n将更改后的 p、q 和 r 写回磁盘，完成。\n\n(4) p 有 ⌈m/2⌉-2 个键，且 q 有 ⌈m/2⌉-1 个键。执行如下所示的合并：\n\n\
    ![](img/15e8d7d94d8ddf02cb6839870195a31e_846_0.png)\n\n现在 p 有 (⌈m/2⌉-2)+(⌈m/2⌉-1)+1=2⌈m/2⌉-2\
    \ ≤ m-1 个键。p 被写回磁盘。\n\n父节点 r 中的键数减少了 1。\n\n如果 r 未变得不足（即如果它是根，则至少有 1 个元素；如果不是根，则有\
    \ ⌈m/2⌉-1 个元素），则将更改后的 r 写回磁盘，完成。\n\n当 r 变得不足时，如果它是根，则丢弃它。否则 r 有 ⌈m/2⌉-2 个键，我们可以先尝试与其最近兄弟之一进行旋转。如果这不可行，则进行合并。此合并过程可以一直向上进行到\
    \ B 树，直到根的子节点被合并。\n\n删除算法的高层描述在下一张幻灯片给出：\n\n```\n// Delete element with key x\
    \ from a B-tree of order m\nSearch the B-tree for node p containing the element\
    \ with key x;\nif (there is no such node p) return;  // no element to delete\n\
    Let p be of the form: n, A₀, (E₁, A₁), …, (Eₙ, Aₙ) and Eᵢ.K=x;\nif (p is not a\
    \ leaf) {\n    Replace Eᵢ with the smallest key element in subtree Aᵢ;\n    write\
    \ the altered p to disk;\n    Let p be the leaf of Aᵢ from which the smallest\
    \ was taken;\n    Let p be of the form: n, A₀, (E₁, A₁), …, (Eₙ, Aₙ);\n    i =\
    \ 1;\n}\n\n// the following deletes Eᵢ from leaf node p\n```\n\n```\nDelete (E_i,\
    \ A_i) from p; n--;\n**while** (n<⌈m/2⌉-1) && (p!=root)\n    **if** (p has a nearest\
    \ right sibling q) {\n        Let q: n_q, A^q_0, (E^q_1 A^q_1), ..., (E^q_{n_q}\
    \ A^q_{n_q});\n        Let r: n_r, A^r_0, (E^r_1 A^r_1), ..., (E^r_{n_r} A^r_{n_r})\
    \ be parent of p and q;\n        Let A^r_j=q and A^r_{j-1}=p;\n        **if**\
    \ (n_q >= ⌈m/2⌉) { // rotation\n            (E_{n+1}, A_{n+1})=(E^r_j, A^q_0);\
    \ n=n+1;   // update p\n            E^r_j=E^q_1;                             \
    \    // update r\n            (n_q,A^q_0,(E^q_1 A^q_1),...)=(n_q-1,A^q_1,(E^q_2\
    \ A^q_2),...); // update q\n            **write** p, q, r to disk; **return**;\n\
    \        }\n        // combine nodes p, E^r_j, and q\n        s=2*⌈m/2⌉-2;\n```\n\
    \n"
