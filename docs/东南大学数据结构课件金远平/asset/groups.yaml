    To reflect the cost of unsuccessful search, it is useful to add a special “square”
    node at every null link.


    Doing this to the trees of Fig. 10.2 yields the trees of Fig. 10.3.


    Binary tree with n nodes has n+1 null links and therefore will have n+1 square
    nodes.'
