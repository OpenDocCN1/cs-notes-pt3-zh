    Fig. 10.3 Extended binary trees corresponding to search trees of Fig. 10.2'
  - '[PAGE 740]


    +   - external (failure) nodes---square nodes.

    +   - internal nodes---original nodes.

    +   - extended binary tree---a binary tree with external nodes added.

    +   - external path length, E, of a binary tree---the sum over all external nodes
    of the lengths of the paths from the root to those nodes.

    +   - internal path length, I, of a binary tree---the sum over all internal nodes
    of the lengths of the paths from the root to those nodes.'
  - '[PAGE 741]


    # For Fig. 10.3(a):


    I=0+1+1+2+3=7,      E=2+2+4+4+3+2=17


    In general, E=I+2n.


    Hence, binary trees with the maximum E also have maximum I.


    Over all binary trees with n internal nodes:


    +   - worst case: when the tree has a depth of n.


    I = Σ_{i=0}^{n-1} i = n(n−1)/2


    this is the maximum I.'
  - '[PAGE 742]


    • optimal case: as many internal nodes as close to the root as possible---complete
    binary tree.

    I=0+2*1+4*2+8*3+......

    If we number the nodes in a complete binary tree as before, the distance of node
    i from the root is ⌊log₂i⌋

    so

    I = Σ₁≤i≤n ⌊log₂i⌋ = O(n log₂n)'
  - '[PAGE 743]


    Now return to the problem of finding an optimal binary search tree for a set of
    identifiers to be searched with different probabilities.


    If the binary search tree contains the identifiers $a_1, a_2, \ldots, a_n$ with
    $a_1 < a_2 < \cdots < a_n$, and the probability of searching for each $a_i$ is
    $p_i$, then the total cost of any binary search tree is


    $$\sum_{1 \le i \le n} p_i \cdot \operatorname{level}(a_i)$$


    when only successful searches are made.'
  - '[PAGE 744]


    The cost of **unsuccessful** searches should also be included.


    Unsuccessful searches terminate with algorithm *search* return a 0 pointer. Every
    node with a null subtree defines a point at which such a termination can take
    place. Replace every null subtree by a failure node.


    Identifiers not in the binary search tree may be partitioned into n+1 classes,
    Eᵢ, 0≤i≤n.


    E₀={x| x<a₁}

    Eᵢ={x| aᵢ<x<aᵢ₊₁}, 1≤i<n.

    Eₙ={x| x>aₙ}'
  - '[PAGE 745]


    For all x in Eᵢ, 0≤i≤n, the search terminates at the same failure node i, and
    it terminates at different failure nodes for x in different classes.


    If qᵢ is the probability for Eᵢ, the cost of the failure nodes is


    ∑₀≤ᵢ≤ₙ qᵢ·(level(failure node i)-1)


    Therefore the total cost is


    ∑₁≤ᵢ≤ₙ pᵢ·level(aᵢ) + ∑₀≤ᵢ≤ₙ qᵢ·(level(failure node i)-1)  (10.1)'
  - '[PAGE 746]


