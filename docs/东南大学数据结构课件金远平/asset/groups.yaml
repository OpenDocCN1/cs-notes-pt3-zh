    ## 7.10.5 Optimal Merging of Runs


    When runs are of different size, the merging strategy of making complete passes
    over all runs does not yield minimum run times.


    For example, suppose we have 4 runs of length 2, 4, 5, and 15, respectively.


    ## 2 merge trees for merging the 4 runs:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_687_0.png)


    (a)


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_687_1.png)


    (b)


    - internal nodes --- the circular nodes.

    - external nodes --- the square nodes.


    Given n runs, there are n external nodes in the merge tree. Let the external nodes
    numbered 1 to n, qᵢ be the size of the run node i represents, dᵢ be the distance
    from the root to the external node i, 1≤i≤n. Then the total merge time is


    $$E_w = \sum_{1\le i\le n} q_i d_i$$


    The E_w is called the weighted external path length.


    ## The E<sub>w</sub>


    - of (a) is  2*3 + 4*3 + 5*2 + 15*1 = 43

    - of (b) is  2*2 + 4*2 + 5*2 + 15*2 = 52


    The cost of a k-way merge n runs of length q<sub>i</sub>, 1≤i≤n, is minimized
    by using a merge tree of degree k that has minimum E<sub>w</sub>.


    We shall consider k=2 only. The result is easily generalized to the case k>2.


    Another application for binary tree with minimum Ew is to obtain an optimal set
    of codes for messages M₁,...,Mₙ₊₁.


    Each code is a binary string that will be used for transmission of the corresponding
    message.


    These codes are called Huffman codes.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_691_0.png)


    $q_i$--- relative frequency for $M_i$.


    $d_i$--- distance from the root to the external node for $M_i$.


    The cost of decoding is


    $\displaystyle \sum_{1\le i\le n+1} q_i d_i$


    ## Basic ideas of Huffman’s solution :


    - begin with a min heap of n single-node trees, which is an external node with
    the weight being one of the qᵢ’s.

    - repeatedly extract 2 minimum-weight a and b from the min heap, combine them
    into a single binary tree c, and insert c into the min heap.

    - after n-1 rounds, the min heap will be left with a single binary tree, which
    is the wanted.


    ## Assume:


    - the function **Huffman** is a friend of TreeNode.

    - use the **data** field of a TreeNode to store the weight of the **binary** tree
    rooted at that node.

