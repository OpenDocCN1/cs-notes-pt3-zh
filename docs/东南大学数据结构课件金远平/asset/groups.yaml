  mdcn: "\n# 计算时间：\n\n如果 h 是插入前树的高度，则插入一个新键的时间为 O(h)。\n\n对于AVL树，h 最多为 O(log n)，因此插入时间为\
    \ O(log n)。\n\n为了证明 h=O(log n)，设 Nₕ 是高度为 h 的AVL树中的最小节点数，其子树的高度分别为 h-1 和 h-2，且二者都是AVL树。因此\n\
    \nNₕ = Nₕ₋₁ + Nₕ₋₂ +1（根节点）    并且\nN₀ =0, N₁ =1, N₂ =2.\n\n通过对 h 进行归纳，我们可以证明\n\
    N_h = F_{h+2} - 1（对于 h ≥ 0）。\n由于斐波那契数\nF_{h+2} ≥ φ^h，其中 φ = (1 + √5)/2\n\n如果树中有\
    \ n 个节点，则其高度 h 至多为\nlog_φ (n+1) = O(log n)\n\n练习表明，可以在 O(log n) 时间内从 AVL 树中查找和删除键为\
    \ *k* 的节点。\n\n**练习：** P578-3, 5, 9\n\n下一张幻灯片比较了有序顺序表、有序链表和 AVL 树上某些操作的最坏情况时间。\n\
    \n## 第11章\n多路搜索树\n\n## 11.1 m路搜索树\n\n### 11.1.1 m路搜索树的定义\n\n如果使用 AVL 树来表示非常大的元素集合，它将存储在磁盘上。要在\
    \ n 个键中搜索，最坏情况下需要 h=1.44 log₂ (n+1) 次磁盘访问。\n\n如果 n=10⁶，则 1.44log₂ (n+1)≈28 ——\
    \ 太糟糕了！\n\n回想一下，一次磁盘访问（I/O）的块远大于二叉树的一个节点。如果我们使用 AVL 树作为索引，访问一个节点实际上是在访问一个块，而块的大部分内容是无用的，如下图所示：\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_809_0.png)\n\n磁盘块中的 AVL 节点\n\n为了打破因使用二叉搜索树而产生的树高\
    \ log₂(n+1) 障碍，我们必须使用度大于2的搜索树。\n\n在实践中，我们使用最大的度，使得树节点能够放入一个块中。\n\n## 定义：一棵 m 路搜索树，要么为空，要么满足以下性质：\n\
    \n- (1) 根节点最多有 m 棵子树，并具有以下结构：\n  \n  n, A₀, (E₁, A₁), (E₂, A₂), ..., (Eₙ, Aₙ)\n\
    \  \n  其中 Aᵢ（0≤i≤n<m）是指向子树的指针，Eᵢ（1≤i≤n<m）是元素。每个 Eᵢ 都有一个键 Eᵢ.K。\n\n- (2) 对于 1≤i<n，Eᵢ.K\
    \ < Eᵢ₊₁.K。\n\n- (3) 设 E₀.K = -∞，Eₙ₊₁.K = ∞。子树 Aᵢ 中的所有键值都小于 Eᵢ₊₁.K 且大于 Eᵢ.K，其中\
    \ 0≤i≤n。\n\n- (4) 子树 Aᵢ（0≤i≤n）也是 m 路搜索树。\n\n下面是一棵 3 路搜索树：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_812_0.png)\n\
    \n在一棵度为 m、高度为 h 的树中，最大节点数为\n\n∑₀≤i≤h−1 mⁱ = (mʰ − 1)/(m − 1)\n\n每个节点最多有 m-1 个键，因此最大的键数为\
    \ mʰ-1。\n\n- 对于 h=3 的二叉树，该值为 7。\n- 对于 h=3 的 200 路树，该值为 8*10⁶-1。\n\n为了使性能接近给定元素数量\
    \ n 下最佳 m 路搜索树的性能，搜索树必须是平衡的。\n\n## 11.1.2 搜索 m 路搜索树\n\n搜索很简单，下一张幻灯片给出了搜索 m 路搜索树算法的高级描述。\n\
    \n// Search an m-way search tree for an element with key x.\n// Return the element\
    \ if found, else return NULL.\nE0.K = -MAXKEY;\nfor ( *p=root; p; p= Aᵢ)\n{\n\
    \    Let node p have the format n, A₀, (E₁, A₁), ..., (Eₙ, Aₙ);\n    Eₙ₊₁.K =\
    \ MAXKEY;\n    Determine i such that Eᵢ.K <= x < Eᵢ₊₁.K;\n    if (x==Eᵢ.K) return\
    \ Eᵢ;\n}\n// x is not in the tree\nreturn NULL;\n\n# 练习：P609-3\n\n## 11.2 B树\n\
    \n### 11.2.1 定义与性质\n\n一种特殊的平衡 m 路搜索树就是 B 树。\n\n为了定义它，在我们原本有空指针的地方添加一个外部（或失败）节点。\n\
