  - '[PAGE 499]


    **Definition:** A biconnected graph is a connected graph that has no articulation
    points.

    The graph of Fig. 6.20(a) is not biconnected.

    Articulation points are undesirable in communication network.


    **Definition:** A biconnected component of a connected graph G is a maximal biconnected
    subgraph H of G.

    The graph of Fig. 6.20(a) contains three biconnected components, as shown in Fig.
    6.20(b).'
  - '[PAGE 500]


