    \    LinearProbing (int size) {\n        if (size < 3) throw “the size must be\
    \ >= 3.”;\n        b=size;\n        ht=new pairPtr[b];\n        fill(ht, ht+b,0);\
    \  // initialize the hash table to empty.\n    };\nprivate:\n    int b;\n    pairPtr\
    \ *ht;\n};\n```\n```\n\n当溢出发生时，我们需要为新标识符找到另一个桶，最简单的解决方案是找到最近的桶。\n\n这称为 **线性探测**\
    \ 或 **线性开放定址**。\n\n# 示例 8.6：\n\n- b=26，ht 循环使用。\n- 键：GA, D, A, G, L, A2, A1, A3,\
    \ A4, Z, ZA, E。\n- h(x)=x 的第一个字符，例如，h(GA)=6。\n- 初始时，ht 中的所有条目均为 null。\n\n|   |\
    \   |\n|---|---|\n| 0 | A |\n| 1 | A2 |\n| 2 | A1 |\n| 3 | D |\n| 4 | A3 |\n|\
    \ 5 | A4 |\n| 6 | GA |\n| 7 | G |\n| 8 | ZA |\n| 9 | E |\n| 10 |   |\n| 11 | L\
    \ |\n| . | . |\n| . | . |\n| 24 |   |\n| 25 | Z |\n\n在输入\nGA, D, A, G, L, A2,\
    \ A1, A3, A4, Z, ZA, E,\n之后，我们得到左侧所示的表。\n\n当使用线性开放定址处理溢出时，哈希表中查找键 k 的过程如下：\n\n\
    - 1. 计算 h(k)\n- 2. 检查 ht[h(k)], ht[(h(k)+1)%b], …, ht[(h(k)+j)%b] 直到发生以下情况之一：\n\
    \  - (a) ht[(h(k)+j)%b] 具有键为 k 的对——找到。\n  - (b) ht[h(x)+j%b] 为空——不在其中。\n  - (c)\
    \ 返回到起始位置 h(k)——表已满且 k 不在其中。\n\n```\n```cpp\ntemplate <class K, class E>\npair<K,\
    \ E>* LinearProbing<K, E>::Get(const K& k)\n{ // search the linear probing hash\
    \ table ht (s=1) for k.\n  // If found return a pointer to the pair, else return\
    \ 0.\n  int i=h(k); // home bucket\n  int j;\n  for (j=i; ht[j] && ht[j]->first\
    \ != k;) {\n    j = (j+1) % b;    // treat the table as circular\n    if (j ==\
    \ i) return 0;  // back to the start point\n  }\n  if (ht[j]->first==k) return\
    \ ht[j];\n  return 0;\n}\n```\n\n分析表明，查找一个键的期望平均键比较次数约为\n\n$$(2-\\alpha)/(2-2\\\
    alpha)$$\n\n其中 $\\alpha$ 是装载密度。\n\n在示例 8.6 中，$\\alpha = 12 / 26 = 0.47$ 且平均键比较次数为\
    \ 1.5。\n\n尽管平均比较次数很小，但最坏情况可能相当大。\n\n"
