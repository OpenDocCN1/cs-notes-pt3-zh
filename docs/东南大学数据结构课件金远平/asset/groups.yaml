  mdcn: "\n\n# 8.2.2 哈希函数\n\n哈希函数将键映射到哈希表中的桶地址。\n\n它应易于计算并最小化冲突的数量。\n\n如果 k 是从键空间中随机选择的键，那么我们希望\
