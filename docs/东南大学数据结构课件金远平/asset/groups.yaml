    \n在实践中，选择 D 使其没有小于 20 的素数因子就已足够。\n\n# 8.2.2.2 中间平方法\n\nh(k) 是通过使用 k² 中间部分的适当数量的位来获得桶地址计算的。\n\
    \n如果使用 r 位，则 b = 2ʳ。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_711_0.png)\n\n\
