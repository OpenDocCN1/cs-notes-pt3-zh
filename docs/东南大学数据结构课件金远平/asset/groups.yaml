  md: "\n![](img/15e8d7d94d8ddf02cb6839870195a31e_567_0.png)\n\nFig. 6.39\n\n- **e(i)**\
    \ --- the earliest start time for activity aᵢ.\n- **l(i)** --- the latest start\
    \ time for activity aᵢ without increasing the project duration.\n- If e(i) = l(i),\
    \ aᵢ is called a **critical activity**. l(i) - e(i) is a measure of the criticality\
    \ of aᵢ.\n\n- Speed up a critical activity will not necessarily result in a reduced\
    \ project length unless it is on all critical paths. e.g., speed up a₁₁ will not\
    \ reduce the project length, but a₁ will.\n- Once we get e(i) and l(i), critical\
    \ activities can be easily identified.\n\n## 6.5.2.1 Calculation of Early Activity\
    \ Times\n\nHow to obtain e(i) and l(i)? It is easy to first get:\n\nee[j] ---\
    \ the earliest time for event j.\n\nle[j] --- the latest time for event j.\n\n\
    If a_i is edge <k, l>, then\n\ne(i) = ee[k]      and\n\nl(i) = le[l] – duration\
    \ of activity a_i } (6.1)\n\nee[j] and le[j] are computed in 2 stages: a forward\
    \ stage and a backward stage.\n\n### The forward stage:\n\nee[0]=0      (suppose\
    \ 0 is the start)\nee[j]= max {ee[i]+duration of <i, j>}\n      i ∈ P(j) }   \
    \   (6.2)\n\nwhere P(j) is the set of all vertices adjacent to j.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_572_0.png)\n\
    \nTo carry the information of **duration**, we use the structure:\n\n```\nstruct\
    \ Pair\n{\n    int vertex;\n    int dur;      //activity duration\n};\n\nclass\
    \ LlinkedGraph {\nprivate:\n    Chain<Pair> *adjLists;\n    int *count, *t, *ee,\
    \ *le;\n    int n;\n```\n\n```\npublic:\nLinkedGraph (const int vertices) : {\n\
    \    if (vertices < 1) throw \"Number of vertices must be > 0\";\n    n = vertices;\n\
    \    adjLists = new Chain<Pair>[n];\n    count = new int[n]; t = new int[n];\n\
    \    ee = new int[n]; le = new int[n];\n};\nvoid TopologicalOrder();\nvoid EarliestEventTime();\n\
    void LatestEventTime();\nvoid CriticalActivities();\n};\n```\n\nIf we initialize\
    \ array ee to 0, and compute in topological order, then the early start times\
    \ of all predecessors of j would have been computed prior to the computation of\
    \ ee[i].\n\nThus we have:\n\n```\nvoid LinkedGraph::EarliestEventTime()\n{ //\
    \ assume a topological order has already been in t,\n// compute ee[j] according\
    \ to t\nfill(ee, ee+n, 0);  // initialize ee\nfor (i=0; i<n-1; i++) {\n    int\
    \ j=t[i];\n    Chain<Pair>::ChainIterator ji=adjLists[j].begin();\n    while (ji!=adjLists[j].end())\
    \ {\n        int k=ji->vertex; //k is successor of j\n        if (ee[k]<ee[j]+ji->dur)\
    \ ee[k]=ee[j]+ji->dur;\n        ji++;\n    }\n}\n```\n\nTo illustrate, let’s try\
    \ it out on the network of Fig. 6.39.\n\n### count first vertex dur link\n\n###\
    \ Adjacency Lists for Fig. 6.39\n\n| ee | [0] | [1] | [2] | [3] | [4] | [5] |\
    \ [6] | [7] | [8] |\n|---|---|---|---|---|---|---|---|---|---|\n| initial | 0\
    \ | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| do 0 | 0 | 6 | 4 | 5 | 0 | 0 | 0 | 0 |\
    \ 0 |\n| do 3 | 0 | 6 | 4 | 5 | 0 | 7 | 0 | 0 | 0 |\n| do 5 | 0 | 6 | 4 | 5 |\
    \ 0 | 7 | 0 | 11 | 0 |\n| do 2 | 0 | 6 | 4 | 5 | 5 | 7 | 0 | 11 | 0 |\n| do 1\
    \ | 0 | 6 | 4 | 5 | 7 | 7 | 0 | 11 | 0 |\n| do 4 | 0 | 6 | 4 | 5 | 7 | 7 | 16\
    \ | 14 | 0 |\n| do 7 | 0 | 6 | 4 | 5 | 7 | 7 | 16 | 14 | 18 |\n| do 6 | 0 | 6\
    \ | 4 | 5 | 7 | 7 | 16 | 14 | 18 |\n\nFig. 6.40\n\nThe computing time is obviously\
    \ O(n+e).\n\n## 6.5.2.2 Calculation of Late Activity Times\n\nThe backward stage:\n\
    le[n-1]=ee[n-1]    (suppose n-1 is the finish)\nle[j]= min {le[i]-duration of\
    \ <j, i>}\n       i ∈S(j)\nwhere S(j) is the set of all vertices adjacent from\
    \ j.\n(6.3)\n\n### Example:\n\ngiven the topological order of Fig. 6.39:\n\n0,\
    \ 3, 5, 2, 1, 4, 7, 6, 8\n\nwe may compute le[i] for i=8, 6, 7, 4, 1, 2, 5, 3,\
    \ 0.\n\nle[8] = ee[8] = 18\nle[6] = min {le[8] − 2} = 16\nle[7] = min {le[8] −\
    \ 4} = 14\nle[4] = min {le[6] − 9, le[7] − 7} = 7\nle[1] = min {le[4] − 1} = 6\n\
    le[2] = min {le[4] − 1} = 6\nle[5] = min {le[7] − 4} = 10\nle[3] = min {le[5]\
    \ − 2} = 8\nle[0] = min {le[1]−6, le[2]−4, le[3]−6} = 0\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_584_0.png)\n"
  mdcn: "\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_567_0.png)\n\nFig. 6.39\n\n\
    - **e(i)** --- 活动 aᵢ 的最早开始时间。\n- **l(i)** --- 不增加项目工期的情况下活动 aᵢ 的最晚开始时间。\n- 若 e(i)\
    \ = l(i)，则 aᵢ 称为 **关键活动**。l(i) - e(i) 是 aᵢ 关键性的度量。\n\n- 加快关键活动不一定会缩短项目工期，除非它位于所有关键路径上。例如，加快\
    \ a₁₁ 不会缩短项目工期，但 a₁ 会。\n- 一旦我们得到 e(i) 和 l(i)，关键活动就可以很容易地识别出来。\n\n## 6.5.2.1 早期活动时间的计算\n\
    \n如何获得 e(i) 和 l(i)？首先很容易得到：\n\nee[j] --- 事件 j 的最早时间。\n\nle[j] --- 事件 j 的最晚时间。\n\
    \n若 a_i 是边 <k, l>，则\n\ne(i) = ee[k]      且\n\nl(i) = le[l] – 活动 a_i 的持续时间 } (6.1)\n\
    \nee[j] 和 le[j] 分为 2 个阶段计算：正向阶段和反向阶段。\n\n### 正向阶段：\n\nee[0]=0      （假设 0 为开始）\n\
    ee[j]= max {ee[i]+<i, j> 的持续时间}\n      i ∈ P(j) }      (6.2)\n\n其中 P(j) 是与 j 相邻的所有顶点的集合。\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_572_0.png)\n\n为了携带 **持续时间** 的信息，我们使用以下结构：\n\
    \n```\nstruct Pair\n{\n    int vertex;\n    int dur;      //activity duration\n\
    };\n\nclass LlinkedGraph {\nprivate:\n    Chain<Pair> *adjLists;\n    int *count,\
    \ *t, *ee, *le;\n    int n;\n```\n\n```\npublic:\nLinkedGraph (const int vertices)\
    \ : {\n    if (vertices < 1) throw \"Number of vertices must be > 0\";\n    n\
    \ = vertices;\n    adjLists = new Chain<Pair>[n];\n    count = new int[n]; t =\
    \ new int[n];\n    ee = new int[n]; le = new int[n];\n};\nvoid TopologicalOrder();\n\
    void EarliestEventTime();\nvoid LatestEventTime();\nvoid CriticalActivities();\n\
    };\n```\n\n如果我们将数组 ee 初始化为 0，并在拓扑顺序中计算，那么在计算 ee[i] 之前，j 的所有前驱的早期开始时间都将被计算。\n\n\
    因此我们有：\n\n```\nvoid LinkedGraph::EarliestEventTime()\n{ // assume a topological\
    \ order has already been in t,\n// compute ee[j] according to t\nfill(ee, ee+n,\
    \ 0);  // initialize ee\nfor (i=0; i<n-1; i++) {\n    int j=t[i];\n    Chain<Pair>::ChainIterator\
    \ ji=adjLists[j].begin();\n    while (ji!=adjLists[j].end()) {\n        int k=ji->vertex;\
    \ //k is successor of j\n        if (ee[k]<ee[j]+ji->dur) ee[k]=ee[j]+ji->dur;\n\
    \        ji++;\n    }\n}\n```\n\n为了说明，让我们在图 6.39 的网络上试一下。\n\n### count first vertex\
    \ dur link\n\n### Fig. 6.39 的邻接表\n\n| ee | [0] | [1] | [2] | [3] | [4] | [5] |\
    \ [6] | [7] | [8] |\n|---|---|---|---|---|---|---|---|---|---|\n| initial | 0\
    \ | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| do 0 | 0 | 6 | 4 | 5 | 0 | 0 | 0 | 0 |\
    \ 0 |\n| do 3 | 0 | 6 | 4 | 5 | 0 | 7 | 0 | 0 | 0 |\n| do 5 | 0 | 6 | 4 | 5 |\
    \ 0 | 7 | 0 | 11 | 0 |\n| do 2 | 0 | 6 | 4 | 5 | 5 | 7 | 0 | 11 | 0 |\n| do 1\
    \ | 0 | 6 | 4 | 5 | 7 | 7 | 0 | 11 | 0 |\n| do 4 | 0 | 6 | 4 | 5 | 7 | 7 | 16\
    \ | 14 | 0 |\n| do 7 | 0 | 6 | 4 | 5 | 7 | 7 | 16 | 14 | 18 |\n| do 6 | 0 | 6\
    \ | 4 | 5 | 7 | 7 | 16 | 14 | 18 |\n\nFig. 6.40\n\n计算时间显然为 O(n+e)。\n\n## 6.5.2.2\
    \ 晚期活动时间的计算\n\n反向阶段：\nle[n-1]=ee[n-1]    （假设 n-1 为结束）\nle[j]= min {le[i]-<j, i>\
    \ 的持续时间}\n       i ∈S(j)\n其中 S(j) 是从 j 出发相邻的所有顶点的集合。\n(6.3)\n\n### 示例：\n\n给定图\
    \ 6.39 的拓扑顺序：\n\n0, 3, 5, 2, 1, 4, 7, 6, 8\n\n我们可以计算 le[i]，i=8, 6, 7, 4, 1, 2,\
    \ 5, 3, 0。\n\nle[8] = ee[8] = 18\nle[6] = min {le[8] − 2} = 16\nle[7] = min {le[8]\
    \ − 4} = 14\nle[4] = min {le[6] − 9, le[7] − 7} = 7\nle[1] = min {le[4] − 1} =\
    \ 6\nle[2] = min {le[4] − 1} = 6\nle[5] = min {le[7] − 4} = 10\nle[3] = min {le[5]\
    \ − 2} = 8\nle[0] = min {le[1]−6, le[2]−4, le[3]−6} = 0\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_584_0.png)\n\
    \n"
