  - '[PAGE 700]


    +   - The 3 basic operations on Dictionary are **Get, Insert and Delete**.


    +   - In key comparison based search tree methods, these operations take O(h)
    time, where h is the height of the tree.


    +   - If we directly use the key as an address, then we can perform these operations
    in O(1).


    +   - However, the space for key definition is too big, we need to map the big
    space to a space of practical size.'
  - '[PAGE 701]


    This leads to the technique of hashing, in which a hash function is used to map
    a big space to a small one:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_701_0.png)'
  - '[PAGE 702]


    # 8.2 Static Hashing


    # 8.2.1 Hash Tables


    In static hashing the dictionary pairs are stored in a table, ht, called hash
    table.


    +   - ht is partitioned into b buckets: ht[0:b-1], and maintained in sequential
    memory.


    +   - each bucket holds s slots, each slot holds one pair, usually, s = 1.


    +   - the address of a pair with key k is determined by a hash function h, h(k)
    is the hash or home address of k, h(k)∈{0, 1,...,b-1}.'
  - '[PAGE 703]


    T --- the total number of possible keys.


    n --- the number of pairs in the hash table.


    # Definition:


    The key density of a hash table is the ratio n/T.


    The loading density (or factor) of a hash table is α=n/(sb).


    Usually, n<<T, and b<<T.'
  - '[PAGE 704]


    +   - 2 keys \(k_1\) and \(k_2\) are said to be synonyms with respect to \(h\)
    if \(h(k_1)=h(k_2)\).

    +   - a collision occurs when the home bucket for the new pair is not empty.

    +   - an overflow occurs when a new pair is hashed into a full bucket.

    +   - when \(s=1\), collisions and overflows occur simultaneously.'
