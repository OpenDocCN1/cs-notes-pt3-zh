    \n## Analysis of huffman:\n\n- the main loop --- n-1 times\n- each call to Top\
    \ is O(1), to Pop and Push is O(log n)\n\nThe total time: O(n log n).\n\n## Exercises:\
    \ P457-2\n\n## Chapter 8\nHashing\n\n### 8.1 Introduction\n\nLet look back to\
    \ the ADT Dictionary, which is used in many applications:\n\nspelling checker,\
    \ the thesaurus, the index for a database, the symbol tables generated by loaders,\
    \ assemblers, and compilers, ...\n\n```\nADT 5.3\ntemplate <class K, class E>\n\
    class Dictionary {\npublic:\n    virtual bool IsEmpty () const = 0;\n    // return\
    \ true iff the dictionary is empty\n    virtual pair<K,E>* Get(const K&) const\
    \ = 0;\n    // return pointer to the pair with specified key;\n    // return 0\
    \ if no such pair\n    virtual void Insert(const pair<K,E>&) = 0;\n    // insert\
    \ the given pair; if key is a duplicate\n    // update associated element\n  \
    \  virtual void Delete(const K&) = 0;\n    // delete pair with specified key\n\
    };\n```\n\n- The 3 basic operations on Dictionary are **Get, Insert and Delete**.\n\
    - In key comparison based search tree methods, these operations take O(h) time,\
    \ where h is the height of the tree.\n- If we directly use the key as an address,\
    \ then we can perform these operations in O(1).\n- However, the space for key\
    \ definition is too big, we need to map the big space to a space of practical\
    \ size.\n\nThis leads to the technique of hashing, in which a hash function is\
    \ used to map a big space to a small one:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_701_0.png)\n\
    \n### 8.2 Static Hashing\n\n#### 8.2.1 Hash Tables\n\nIn static hashing the dictionary\
    \ pairs are stored in a table, ht, called hash table.\n\n- ht is partitioned into\
    \ b buckets: ht[0:b-1], and maintained in sequential memory.\n- each bucket holds\
    \ s slots, each slot holds one pair, usually, s = 1.\n- the address of a pair\
    \ with key k is determined by a hash function h, h(k) is the hash or home address\
    \ of k, h(k)∈{0, 1,...,b-1}.\n\nT --- the total number of possible keys.\n\nn\
    \ --- the number of pairs in the hash table.\n\n# Definition:\n\nThe key density\
    \ of a hash table is the ratio n/T.\n\nThe loading density (or factor) of a hash\
    \ table is α=n/(sb).\n\nUsually, n<<T, and b<<T.\n\n- 2 keys \\(k_1\\) and \\\
    (k_2\\) are said to be synonyms with respect to \\(h\\) if \\(h(k_1)=h(k_2)\\\
    ).\n- a collision occurs when the home bucket for the new pair is not empty.\n\
    - an overflow occurs when a new pair is hashed into a full bucket.\n- when \\\
    (s=1\\), collisions and overflows occur simultaneously.\n\n## Example 8.1:\n\n\
    Let b=26, s=2, n=10, hence α = 10/52 = 0.19\n\nAssume the internal representation\
    \ for A to Z corresponds to 0 to 25, then\n\nh(k) = the first character of k\n\
    \nKeys: GA, D, A, G, L, A2, A1, A3, A4, and E.\n\n# The following shows the keys\
    \ GA, D, A, G, L and A2 entered into the hash table.\n\n| ht | Slot 1 | Slot 2\
    \ |\n| --- | --- | --- |\n| 0 | A | A2 |\n| 1 |  |  |\n| 2 |  |  |\n| 3 | D |\
    \  |\n| 4 |  |  |\n| 5 |  |  |\n| 6 | GA | G |\n| . | . | . |\n| . | . | . |\n\
    | 25 |  |  |\n\nNext, A1 hashes into ht[0] --- overflow.\n\nIf no overflow, the\
    \ time required to insert, delete or search using hash depends only on the time\
    \ for computing the hash function and searching one bucket .\n\n--- independent\
    \ of n.\n\nSince T>>b, it is impossible to avoid overflow, a mechanism to handle\
    \ overflows is necessary.\n"
