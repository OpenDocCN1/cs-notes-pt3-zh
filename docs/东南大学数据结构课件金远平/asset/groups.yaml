  - "[PAGE 591]\n\n# Two important uses of sorting:\n\n+   (1) Binary search a sorted\
    \ list with n records in O(log n), much better than sequential search an unsorted\
    \ list in O(n).\n+   \n+   (2) Comparing two lists of n and m records containing\
    \ data that are essentially the same but from different sources. If sorted we\
    \ can do it in O(n+m), otherwise we need O(nm) time."
  - '[PAGE 592]


    Actually there are much more applications of sorting, e.g., query optimization,
    job scheduling, etc..


    Consequently, sorting problem has been extensively studied, and there are many
    methods proposed.


    We shall study several typical methods, indicating when one is superior to others.


    Now let us formally state the sorting problem.'
  - '[PAGE 593]


    +   - a list of records (R₁, R₂, ..., Rₙ)

    +   - each Rᵢ has key value Kᵢ

    +   - assume an ordering relation (<) on the keys, so that for any 2 key values
    x and y, x=y or x<y or x>y. < is transitive.


    The **sorting problem** is that of finding a permutation, σ, such that K₍σ(i)₎
    ≤ K₍σ(i+1)₎ , 1≤i≤n-1. The desired ordering is (R₍σ(1)₎, R₍σ(2)₎, ..., R₍σ(n)₎).'
  - '[PAGE 594]


    Let σₛ be the permutation with the following properties:


    +   (1) K_{σs(i)} ≤ K_{σs(i+1)}, 1≤i≤n-1.


    +   (2) If i<j and K_i = K_j in the input list, then R_i precedes R_j in the sorted
    list.


    A sorting method that generates the permutation σₛ is stable.'
  - "[PAGE 595]\n\nSorting\n  internal\n    insert\n    quick\n    merge\n    heap\n\
    \    radix\n  external\n    m-way merge\n    run generation\n\nThroughout, we\
    \ assume that relational operators have been overloaded so that record comparison\
    \ is done by comparing their keys."
  - '[PAGE 596]


    # 7.2 Insert Sort


    Basic step: insert e into a sorted sequence of i records in such a way that the
    resulting sequence of size i+1 is also ordered.


    Uses a[0] to simplify the while loop test.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_596_0.png)'
  - "[PAGE 597]\n\n```\ntemplate<class T>\nvoid Insert(const T& e, T *a, int i)\n\
    { //insert e into the ordered sequence a[1:i] such that the\n// resulting sequence\
    \ a[1:i+1] is also ordered. The array a\n// must have space for at least i+2 elements.\n\
    a[0]=e;\nwhile (e < a[i])  //stable\n{\n    a[i+1]=a[i];\n    i--;  // a[i+1]\
    \ is always ready for storing element\n}\na[i+1]=e;\n}\n```"
  - "[PAGE 598]\n\n# Insertion sort:\n\nBegin with the ordered sequence a[1], then\
    \ successively insert a[2], a[3], ..., a[n] into the sequence.\n\n```\ntemplate<class\
    \ T>\nvoid InsertionSort (Element *a, const int n)\n{ //sort a[1:n] into nondescreasing\
    \ order.\n    for (int j=2; j<=n; j++) {\n        T temp = a[j]; // necessary,\
    \ because a[j] may change in\n        // Insertion\n        Insert (temp, a, j-1);\n\
    \    }\n}\n```"
