    \ A to the parent of the new node will change to ±1.\n\n## AVL::Insert gives the\
    \ details:\n\n```\ntemplate <class K, class E> class AVL;\n\ntemplate <class K,\
    \ class E>\nclass AvlNode {\nfriend class AVL<K, E>;\npublic:\n    AvlNode(const\
    \ K& k, const E& e)\n    {key=k; element=e; bf=0; leftChild=rightChild=0;}\nprivate:\n\
    \    K key;\n    E element;\n    int bf;\n    AvlNode<K, E> *leftChild, *rightChild;\n\
    };\n```\n\n```\n```cpp\ntemplate <class K, class E>\nclass AVL {\npublic:\n  \
    \  AVL(): root(0) { };\n    E& Search(const K&) const;\n    void Insert(const\
    \ K&, const E&);\n    void Delete(const K&);\nprivate:\n    AvlNode<K, E> *root;\n\
    };\n```\n```\n\n```\ntemplate <class K, class E>\nvoid AVL<K, E>::Insert(const\
    \ K& k, const E& e)\n{\n    if (!root) {  // empty tree\n        root=new AvlNode<K,\
    \ E>(k, e);\n        return;\n    }\n    // phase 1: Locate insertion point for\
