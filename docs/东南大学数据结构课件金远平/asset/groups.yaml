    \ operators in a stack until just the right time.\n\ne.g.\n\nA\\*(B+C)\\*D → ABC+\\\
    *D\\*\n\nThe algorithm behaves as:\n\n| Next token | stack | output |\n|---|---|---|\n\
    | A | empty | A |\n| \\* | empty | A |\n| ( | \\*( | A |\n| B | \\*( | AB |\n\
    | + | \\*(+ | AB |\n| C | \\*(+ | ABC |\n| ) | \\* | ABC+ |\n| \\* | \\* | ABC+\\\
    * |\n| D | \\* | ABC+\\*D |\n| done | empty | ABC+\\*D\\* |\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_169_0.png)\n\
    \nFrom the example, we can see the left parenthesis behaves as an operator with\
    \ high priority when it is not in the stack, whereas once it gets in, it behaves\
    \ as one with low priority.\n\n- isp (in-stack priority)\n- icp (in-coming priority)\n\
    - The isp and icp of all operators in Fig. 3.15 remain unchanged.\n- isp('(')\
    \ = 8, icp('(') = 0, isp('#') = 8\n\n**Hence the rule:**\n\nOperators are taken\
    \ out of stack as long as their isp is numerically less than or equal to the icp\
    \ of the new operator.\n\n```text\nvoid Postfix(Expression e)\n{ // output the\
    \ postfix of the infix expression e. It is assumed\n  // that the last token in\
    \ e is '#'. Also, '#' is used at the bottom\n  // of the stack.\n  Stack<Token>\
    \ stack; //initialize stack\n  stack.Push('#');\n\n  for (Token x = NextToken(e);\
    \ x != '#'; x = NextToken(e))\n      if (x is an operand) cout << x;\n      else\
    \ if (x == ')')\n      { // unstack until '('\n          for (; stack.Top() !=\
    \ '('; stack.Pop())\n              cout << stack.Top();\n          stack.Pop();\
    \ // unstack '('\n      }\n      else { // x is an operator\n          for (;\
    \ isp(stack.Top()) <= icp(x); stack.Pop())\n              cout << stack.Top();\n\
    \          stack.Push(x);\n      }\n  // end of expression, empty the stack\n\
    \  for (; !stack.IsEmpty(); cout << stack.Top(), stack.Pop());\n  cout << endl;\n\
    }\n```\n\n## Chapter 4 Linked Lists\n\n### 4.1 Singly Linked Lists or Chains\n\
    \nThe representation of a simple data structure using an array and a sequential\
    \ mapping has the property:\n\nSuccessive nodes of the data object are stored\
    \ at fixed distance apart.\n\nThis makes it easy to access an arbitrary node in\
    \ O(1).\n\n### Disadvantage of sequential mapping:\n\nInsertion and deletion are\
    \ expensive, e.g.:\n\nInsert \"GAT\" into or delete \"LAT\" from\n\n(BAT, CAT,\
    \ EAT, FAT, HAT, JAT, LAT, MAT, OAT, PAT, RAT, SAT, TAT, VAT, WAT)\n\n— need data\
    \ movement.\n\n### Solution — linked representation:\n\n- Items of a list may\
    \ be placed anywhere in the memory.\n- Associated with each item is a pointer\
    \ (link) to the next item.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_177_0.png)\n\
    \nIn a linked list, insertion (deletion) of arbitrary elements is much easier:\n\
    \nThe above structures are called singly linked lists or chains, in which each\
    \ node has exactly one pointer field.\n"
