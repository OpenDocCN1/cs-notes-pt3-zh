  - '[PAGE 518]


    To construct minimum-cost spanning tree, we use a least-cost criterion and the
    constraints are:


    +   1. must use only edges within G.

    +   2. must use exactly n-1 edges.

    +   3. may not use edges that produce a cycle.'
  - '[PAGE 519]


    # 6.3.1 Kruskal Algorithm


    +   - The minimum-cost spanning tree T is built by adding edges to T one at a
    time.

    +   - Edges are selected for inclusion in T in non-decreasing order of their cost.

    +   - An edge is added to T if it does not form a cycle with the edges already
    in T.

    +   - Exactly n-1 edges will be selected into T.


