    \ ①、②、③ 相同，④ 仅用于 (2)。\n\n```\n```cpp\ntemplate <class T>\nvoid ThreadedTree<T>::InsertRight(ThreadedNode<T>*\
    \ s,\n                                  ThreadedNode<T>* r)\n{ // insert r as\
    \ the right child of s\n    r→rightChild=s→rightChild;        // ①\n    r→rightThread=s→rightThread;\
