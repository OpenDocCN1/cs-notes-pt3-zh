  md: "\nTo reflect the cost of unsuccessful search, it is useful to add a special\
    \ “square” node at every null link.\n\nDoing this to the trees of Fig. 10.2 yields\
    \ the trees of Fig. 10.3.\n\nBinary tree with n nodes has n+1 null links and therefore\
    \ will have n+1 square nodes.\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_739_0.png)\n\
    \n(a)\n\n(b)\n\nFig. 10.3 Extended binary trees corresponding to search trees\
    \ of Fig. 10.2\n\n- external (failure) nodes---square nodes.\n- internal nodes---original\
    \ nodes.\n- extended binary tree---a binary tree with external nodes added.\n\
    - external path length, E, of a binary tree---the sum over all external nodes\
    \ of the lengths of the paths from the root to those nodes.\n- internal path length,\
    \ I, of a binary tree---the sum over all internal nodes of the lengths of the\
    \ paths from the root to those nodes.\n\n## For Fig. 10.3(a):\n\nI=0+1+1+2+3=7,\
    \      E=2+2+4+4+3+2=17\n\nIn general, E=I+2n.\n\nHence, binary trees with the\
    \ maximum E also have maximum I.\n\nOver all binary trees with n internal nodes:\n\
    \n- worst case: when the tree has a depth of n.\n\nI = Σ_{i=0}^{n-1} i = n(n−1)/2\n\
    \nthis is the maximum I.\n\n- optimal case: as many internal nodes as close to\
    \ the root as possible---complete binary tree.\nI=0+2*1+4*2+8*3+......\nIf we\
    \ number the nodes in a complete binary tree as before, the distance of node i\
    \ from the root is ⌊log₂i⌋\nso\nI = Σ₁≤i≤n ⌊log₂i⌋ = O(n log₂n)\n\nNow return\
    \ to the problem of finding an optimal binary search tree for a set of identifiers\
    \ to be searched with different probabilities.\n\nIf the binary search tree contains\
    \ the identifiers $a_1, a_2, \\ldots, a_n$ with $a_1 < a_2 < \\cdots < a_n$, and\
    \ the probability of searching for each $a_i$ is $p_i$, then the total cost of\
    \ any binary search tree is\n\n$$\\sum_{1 \\le i \\le n} p_i \\cdot \\operatorname{level}(a_i)$$\n\
    \nwhen only successful searches are made.\n\nThe cost of **unsuccessful** searches\
    \ should also be included.\n\nUnsuccessful searches terminate with algorithm *search*\
    \ return a 0 pointer. Every node with a null subtree defines a point at which\
    \ such a termination can take place. Replace every null subtree by a failure node.\n\
    \nIdentifiers not in the binary search tree may be partitioned into n+1 classes,\
    \ Eᵢ, 0≤i≤n.\n\nE₀={x| x<a₁}\nEᵢ={x| aᵢ<x<aᵢ₊₁}, 1≤i<n.\nEₙ={x| x>aₙ}\n\nFor all\
    \ x in Eᵢ, 0≤i≤n, the search terminates at the same failure node i, and it terminates\
    \ at different failure nodes for x in different classes.\n\nIf qᵢ is the probability\
    \ for Eᵢ, the cost of the failure nodes is\n\n∑₀≤ᵢ≤ₙ qᵢ·(level(failure node i)-1)\n\
    \nTherefore the total cost is\n\n∑₁≤ᵢ≤ₙ pᵢ·level(aᵢ) + ∑₀≤ᵢ≤ₙ qᵢ·(level(failure\
    \ node i)-1)  (10.1)\n\nAn optimal binary search tree for the identifier set a₁,\
    \ a₂, ……., aₙ is the one that minimizes Eq. (10.1) over all possible binary search\
    \ trees for this identifier set.\n\n## Note\n\n$$\\sum_{1\\le i\\le n} p_i + \\\
    sum_{0\\le i\\le n} q_i = 1$$\n\n## Example 10.1:\n\n$(a_1, a_2, a_3)=(do, if,\
    \ while)$. The possible binary search tree for it are as follows:\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_748_0.png)\n\
    \n- with equal probabilities, p_i=q_j for all i and j.\n  cost(tree a )=15/7;\
    \  cost(tree b)=13/7\n  cost(tree c )=15/7;  cost(tree d)=15/7\n  cost(tree e\
    \ )=15/7\n  As expected, tree b is optimal.\n\n- with p₁=0.5, p₂=0.1, p₃=0.05,\
    \ q₀=0.15, q₁=0.1, q₂=0.05, q₃=0.05\n  cost(tree a )=2.65;  cost(tree b)=1.9\n\
    \  cost(tree c )=1.5;  cost(tree d)=2.15\n  cost(tree e )=1.6\n\nFor instance,\n\
    \ncost(tree d) = 0.05+2*0.5+3*0.1\n+2*0.15+3*0.1+3*0.05+0.05\n=2.15   (note the\
    \ error in P557)\n\ntree c is optimal.\n\n## How to determine the optimal tree?\n\
    \nOne way: explicitly generate all possible binary search trees, compute the cost\
    \ of each tree in O(n), then determine the optimal---need\n\n$O\\left(\\frac{n}{n+1}C_n^{2n}\\\
    right)=O\\left(C_n^{2n}\\right)$ --- no good.\n\nInstead, we can get an efficient\
    \ algorithm by making use of the properties of optimal binary search trees(b.s.t.).\n\
    \nLet a₁<a₂<......,<aₙ be n identifiers in a b.s.t., denote:\n\n- • Tᵢⱼ---an optimal\
    \ b.s.t. for aᵢ₊₁,......, aⱼ, i<j . Tᵢᵢ is an empty tree, 0≤i≤n. Tᵢⱼ (i>j) is\
    \ not defined.\n- • cᵢⱼ---the cost of Tᵢⱼ. cᵢᵢ=0.\n- • rᵢⱼ---the root of Tᵢⱼ.\n\
    - • wᵢⱼ---the weight of Tᵢⱼ. wᵢⱼ= qᵢ+ Σₖ₌ᵢ₊₁ʲ (qₖ+ pₖ).\n"
  mdcn: "\n\n为了反映不成功搜索的代价，在每个空链接处添加一个特殊的“方块”节点是有用的。\n\n对图 10.2 中的树进行此操作可得到图 10.3 中的树。\n\
    \n具有 n 个节点的二叉树有 n+1 个空链接，因此将有 n+1 个方块节点。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_739_0.png)\n\
    \n(a)\n\n(b)\n\n图 10.3 对应于图 10.2 的搜索树的扩展二叉树\n\n- 外部（失败）节点---方块节点。\n- 内部节点---原始节点。\n\
    - 扩展二叉树---添加了外部节点的二叉树。\n- 二叉树的外部路径长度，E，是所有外部节点从根到这些节点的路径长度之和。\n- 二叉树的内部路径长度，I，是所有内部节点从根到这些节点的路径长度之和。\n\
    \n## 对于图 10.3(a)：\n\nI=0+1+1+2+3=7,      E=2+2+4+4+3+2=17\n\n一般来说，E=I+2n。\n\n\
    因此，具有最大 E 的二叉树也具有最大 I。\n\n对于所有具有 n 个内部节点的二叉树：\n\n- 最坏情况：当树的深度为 n 时。\n\nI = Σ_{i=0}^{n-1}\
    \ i = n(n−1)/2\n\n这是最大 I。\n\n- 最优情况：尽可能多地将内部节点靠近根---完全二叉树。\nI=0+2*1+4*2+8*3+......\n\
    如果我们像以前一样对完全二叉树中的节点进行编号，则节点 i 与根的距离为 ⌊log₂i⌋\n所以\nI = Σ₁≤i≤n ⌊log₂i⌋ = O(n log₂n)\n\
    \n现在回到为一组具有不同概率的标识符寻找最优二叉搜索树的问题。\n\n如果二叉搜索树包含标识符 $a_1, a_2, \\ldots, a_n$ 且 $a_1\
    \ < a_2 < \\cdots < a_n$，并且搜索每个 $a_i$ 的概率为 $p_i$，则任意二叉搜索树的总代价为\n\n$$\\sum_{1 \\\
    le i \\le n} p_i \\cdot \\operatorname{level}(a_i)$$\n\n当仅进行成功搜索时。\n\n**不成功**搜索的代价也应包含在内。\n\
    \n不成功搜索以算法 *search* 返回一个 0 指针而终止。每个具有空子树的节点都定义了可以发生此类终止的点。用失败节点替换每个空子树。\n\n不在二叉搜索树中的标识符可以划分为\
    \ n+1 个类，Eᵢ，0≤i≤n。\n\nE₀={x| x<a₁}\nEᵢ={x| aᵢ<x<aᵢ₊₁}, 1≤i<n.\nEₙ={x| x>aₙ}\n\n\
    对于所有 x∈Eᵢ，0≤i≤n，搜索在同一个失败节点 i 处终止，并且对于不同类中的 x，搜索在不同的失败节点处终止。\n\n如果 qᵢ 是 Eᵢ 的概率，则失败节点的代价为\n\
    \n∑₀≤ᵢ≤ₙ qᵢ·(level(failure node i)-1)\n\n因此总代价为\n\n∑₁≤ᵢ≤ₙ pᵢ·level(aᵢ) + ∑₀≤ᵢ≤ₙ\
    \ qᵢ·(level(failure node i)-1)  (10.1)\n\n对于标识符集 a₁, a₂, ……., aₙ 的最优二叉搜索树是使式 (10.1)\
    \ 在该标识符集的所有可能二叉搜索树上最小化的树。\n\n## 注\n\n$$\\sum_{1\\le i\\le n} p_i + \\sum_{0\\\
    le i\\le n} q_i = 1$$\n\n## 例 10.1：\n\n$(a_1, a_2, a_3)=(do, if, while)$。其可能的二叉搜索树如下：\n\
    \n![](img/15e8d7d94d8ddf02cb6839870195a31e_748_0.png)\n\n- 概率相等，p_i=q_j 对所有 i\
    \ 和 j 成立。\n  cost(tree a )=15/7;  cost(tree b)=13/7\n  cost(tree c )=15/7;  cost(tree\
    \ d)=15/7\n  cost(tree e )=15/7\n  如预期，树 b 是最优的。\n\n- 当 p₁=0.5, p₂=0.1, p₃=0.05,\
    \ q₀=0.15, q₁=0.1, q₂=0.05, q₃=0.05\n  cost(tree a )=2.65;  cost(tree b)=1.9\n\
    \  cost(tree c )=1.5;  cost(tree d)=2.15\n  cost(tree e )=1.6\n\n例如，\n\ncost(tree\
    \ d) = 0.05+2*0.5+3*0.1\n+2*0.15+3*0.1+3*0.05+0.05\n=2.15   (注意 P557 中的错误)\n\n\
    树 c 是最优的。\n\n## 如何确定最优树？\n\n一种方法：显式生成所有可能的二叉搜索树，以 O(n) 计算每棵树的代价，然后确定最优树---需要\n\
    \n$O\\left(\\frac{n}{n+1}C_n^{2n}\\right)=O\\left(C_n^{2n}\\right)$ --- 不好。\n\n\
    相反，我们可以通过利用最优二叉搜索树(b.s.t.)的性质来获得高效算法。\n\n设 a₁<a₂<......,<aₙ 为 b.s.t. 中的 n 个标识符，记：\n\
    \n- • Tᵢⱼ---aᵢ₊₁,......, aⱼ 的最优 b.s.t.，i<j 。Tᵢᵢ 是空树，0≤i≤n。Tᵢⱼ (i>j) 未定义。\n- •\
    \ cᵢⱼ---Tᵢⱼ 的代价。cᵢᵢ=0。\n- • rᵢⱼ---Tᵢⱼ 的根。\n- • wᵢⱼ---Tᵢⱼ 的权重。wᵢⱼ= qᵢ+ Σₖ₌ᵢ₊₁ʲ\
    \ (qₖ+ pₖ)。\n\n"
