    \ n 个结点的完全二叉树的高度为 ⌈log₂(n+1)⌉。\n\n## 5.2.3 二叉树的表示\n\n### 5.2.3.1 数组表示\n\n结点可以存储在一维数组\
    \ tree 中，顺序编号为 i 的结点存储在 tree[i] 中。\n\n引理 5.4：若一棵具有 n 个结点的完全二叉树采用顺序表示，则对于任意下标为\
    \ i（1 ≤ i ≤ n）的结点，有\n\n(1) 若 i≠1，则 parent(i) 位于 ⌊i/2⌋ 处；若 i=1，则 i 是根结点，没有父结点。\n\
    \n(2) 若 2i ≤ n，则 LeftChild(i) 位于 2i 处；若 2i>n，则 i 没有左孩子。\n\n(3) 若 2i+1 ≤ n，则 RightChild(i)\
    \ 位于 2i+1 处；若 2i+1>n，则 i 没有右孩子。\n\n证明：先证 (2)。(3) 由 (2) 以及结点从左到右编号得出；(1) 由 (2)\
    \ 和 (3) 得出。\n\n对 i 进行归纳。\n\n当 i=1 时，显然左孩子位于 2 处，除非 2>n，此时 i 没有左孩子。\n\n假设对所有满足\
    \ 1 ≤ j ≤ i 的 j，LeftChild(j) 均位于 2j 处。\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_306_0.png)\n\
    \n紧接在 LeftChild(i+1) 之前的两个结点分别是 i 的右孩子和左孩子，因此 LeftChild(i+1) 位于 2i+2=2(i+1) 处，除非\
    \ 2(i+1)>n，此时 i+1 没有左孩子。\n\n数组表示可用于所有二叉树。\n\n-   对于完全二叉树——不会浪费空间。\n-   对于深度为 k\
    \ 的斜树，最坏情况下需要 2^k-1 个空间，其中只有 k 个会被使用，如下所示：\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_307_0.png)\n\
    \n| 下标 | [0] | [1] | [2] | [3] | [4] | [5] | [6] | [7] |\n|---|---|---|---|---|---|---|---|---|\n\
    | tree | --- | A | --- | C | --- | --- | --- | G |\n\n### 5.2.3.2 链式表示\n\n顺序表示的普遍问题：插入和删除会引起数据移动。\n\
    \n通过链式表示可以轻松解决这个问题。\n\n```cpp\ntemplate <class T> class Tree;\nclass TreeNode\
