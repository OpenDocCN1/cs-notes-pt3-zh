  - "[PAGE 70]\n\n# Analysis of doubling capacity:\n\n+   - the time for doubling\
    \ is linear in the size of new array\n+   - initially, c.capacity is 1\n+   -\
    \ suppose when Add terminates, c.capacity is 2^k\n+   - the total time spent over\
    \ all array doubling is\n+   \n+     `O(∑_{i=1}^{k} 2^i) = O(2^{k+1}) = O(2^k)`\n\
    +   \n+   - since c.terms > 2^{k-1} and m + n ≥ c.terms, the total time for array\
    \ doubling is\n+   \n+     `O(c.terms) = O(m + n)`"
