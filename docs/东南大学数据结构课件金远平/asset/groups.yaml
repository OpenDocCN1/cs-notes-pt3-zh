    \ = 0;\n    while (current) {\n        ChainNode<T> *r = previous; // r trails\
    \ previous\n        previous = current;\n        current = current->link;\n  \
    \      previous->link = r;  //          r       previous  current\n    }\n   \
    \ first = previous;\n}\n```\n\n![](img/15e8d7d94d8ddf02cb6839870195a31e_202_0.png)\n\
    \nFor a chain with m ≥ 1 nodes, the computing time of Reverse is O(m).\n\nExercises:\
    \ P184-6\n\n## 4.4 Circular Lists\n\nA circular list can be obtained by making\
