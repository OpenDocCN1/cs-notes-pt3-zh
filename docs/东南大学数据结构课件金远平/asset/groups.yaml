    \ { return current->data; }\n    T* operator ->() const { return &current->data;\
    \ }\n\n// increment\nChainIterator& operator ++() // preincrement\n{current =\
    \ current->link; return *this;}\nChainIterator& operator ++(int) // postincrement\n\
    {\n    ChainIterator old = *this;\n    current = current->link;\n    return old;\n\
    }\n\n```cpp\n// equality testing\nbool operator !=(const ChainIterator right)\
    \ const\n    { return current != right.current; }\nbool operator == (const ChainIterator\
    \ right) const\n    { return current == right.current; }\n\nprivate:\n    ChainNode<T>*\
    \ current;\n};\n```\n\n## Additionally, we add the following public member functions\
    \ to Chain:\n\nChainIterator begin() { **return** ChainIterator(first);}\n\nChainIterator\
