    \    if (current->data.first==k) return &current->data;\n  return 0;\n}\n```\n\
    ```\n\n成功搜索的期望平均键比较次数为\n≈ 1+ α/ 2\n其中 α 是装载密度。\n\n下一张幻灯片中的表格给出了经验研究的結果。每一列中的值给出平均键比较次数。\n\
