  md: "# 6.2.2 Breadth-First Search\n\nIn a breadth-first search, we begin from the\
    \ start vertex v. Next, all unvisited vertices adjacent to v are visited. Unvisited\
    \ vertices adjacent to these newly visited vertices are then visited, and so on.\n\
    \n```\nvirtual void Graph::BFS (int v)\n{ // breadth-first search: begin at v,\
    \ use a queue.\n    visited = new bool[n];\n    fill(visited, visited + n, false);\n\
    \    visited[v] = true;\n    Queue<int> q;\n    q.Push(v);\n```"
  merge: -1
