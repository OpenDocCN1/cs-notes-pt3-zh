- pgno: 805
  md: 'By induction on h, we can show

    N_h = F_{h+2} - 1 for h ≥ 0.

    As the Fibonacci number

    F_{h+2} ≥ φ^h,      φ = (1 + √5)/2


    If n nodes in the tree, its height h is at most

    log_φ (n+1) = O(log n)'
