- pgno: 630
  md: "```\n```cpp\ntemplate <class T>\nvoid adjust (T *a, const int root, const int\
    \ n)\n{ // No node index is > n\n    T e=a[root];\n    // find proper place for\
    \ e\n    for (int j=2*root; j<=n; j*=2) {\n        if (j<n && a[j]<a[j+1]) j++;\
    \  // j is the lager child of its parent\n        if (e>=a[j]) break;\n      \
    \  a[j/2]=a[j];  //move jth record up the tree\n    }\n    a[j/2]=e;\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
