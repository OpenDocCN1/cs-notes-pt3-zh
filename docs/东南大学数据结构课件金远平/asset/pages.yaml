- pgno: 597
  md: "```\ntemplate<class T>\nvoid Insert(const T& e, T *a, int i)\n{ //insert e\
    \ into the ordered sequence a[1:i] such that the\n// resulting sequence a[1:i+1]\
    \ is also ordered. The array a\n// must have space for at least i+2 elements.\n\
    a[0]=e;\nwhile (e < a[i])  //stable\n{\n    a[i+1]=a[i];\n    i--;  // a[i+1]\
    \ is always ready for storing element\n}\na[i+1]=e;\n}\n```"
