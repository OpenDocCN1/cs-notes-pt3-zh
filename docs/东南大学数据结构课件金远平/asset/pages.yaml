    # Analysis of BFS:


    Each visited vertex enters the queue exactly once, the while loop is iterated
    at most n times.


    If adjacency matrix is used, the loop takes O(n) for each node visited, the total
    time is O(n²).


    If adjacency lists are used, the loop has a total cost of d₀ + ··· + dₙ₋₁ = O(e),
    the total time is O(n+e).'
