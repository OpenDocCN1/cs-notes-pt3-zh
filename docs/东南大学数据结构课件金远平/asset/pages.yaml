- pgno: 38
  md: 'Note g(n) is an upper bound.


    n=O(n²), n= O(2ⁿ), ..., for f(n)=O(g(n)) to be informative, g(n) should be as
    small as possible.


    In practice, the coefficient of g(n) should be 1. We never say O(3n).


    O(1) --- constant    O(log₂n) --- logarithm


    O(n) --- linear      O(2ⁿ) --- exponential


    O(n²) --- quadratic


    O(n³) --- cubic'
