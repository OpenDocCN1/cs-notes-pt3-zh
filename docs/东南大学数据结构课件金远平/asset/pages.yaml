  md: '# 4.5 Available Space lists


    +   - the time of destructors for chains and circular lists is linear in the length
    of the chain or list.

    +   - it may be reduced to O(1) if we maintain our own chain of free nodes.

    +   - the available space list is pointed by `av`.

    +   - `av` be a static class member of `CircularList<T>` of type `ChainNode<T>*`,
