- pgno: 418
  md: '# Lemma 5.6 [Tarjan and Van Leeuwen]: Assume we start with a forest of trees,
    each having one node. Let T(f, u) be the maximum time required to process any
    intermixed sequence of f finds and u unions. Assume u ≥ n/2, then


    $$k_1(n+f\,\alpha(f+n,n)) \le T(f,u) \le k_2(n+f\,\alpha(f+n,n))$$


    For some positive constants $k_1$ and $k_2$.


    Note T(f, u) is not linear even though $\alpha(f+n,n)$ grows very slow.


    The space requirements are one node for each element.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 5.10.3 Application to Equivalent Classes


    equivalence classes ⇔ disjoint sets


    Initially, parent[i] = -1, 0 ≤ i ≤ n-1.


    To process i ≡ j,


    Let x = find(i), y = find(j) --- 2 finds


    If x ≠ y then union(x, y) --- at most 1 union


    Thus if we have n elements and m equivalence pairs, we needs 2m finds and min
    {n-1, m} unions. The total time is O(n+2m α(n+2m,n)).'
  merge: -1
