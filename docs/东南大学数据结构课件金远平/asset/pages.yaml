    Because of the inexactness of what a step stands for, we are mainly concerned
    with the magnitude of the number of steps.


    Definition [O]: f(n)=O(g(n)) iff there exist positive constants c and n₀ such
    that f(n) ≤ c g(n) for all n, n>n₀.


    Example 1.13: 3n+2=O(n), 6*2ⁿ+n²=O(2ⁿ),...'
