- pgno: 835
  md: '# Analysis of B-tree Insertion:


    Let h be the height of the B-tree, then h disk accesses for the top-down search.


    In the worst, all h of the accessed nodes may split during the bottom-up splitting
    pass. When a non-root node split, 2 nodes are written out. When the root split,
    3 nodes are written out.


    Assume that the h nodes read in during the top-down pass can be saved in memory
    so that they are not to be retrieved from disk during the bottom-up pass.'
  merge: -1
  img_proc: true
- pgno: 836
  md: 'The total disk accesses is at most

    h+2(h-1)+3=3h+1


    The average number of disk accesses is, however, approximately h+1 for lager m.


    To show this, suppose we start with an empty B-tree and insert N elements into
    it.'
  merge: -1
  img_proc: true
- pgno: 837
  md: 'Let p be the number of internal nodes in the final B-tree with N elements,
    then the total number of nodes split is at most p-2. Because


    +   - Each time a node splits, at least one additional node is created.

    +   - The splitting of the root node create two additional nodes and the root
    is the first to split.

    +   - The first node created from no splitting.'
  merge: -1
  img_proc: true
- pgno: 838
  md: '# As shown in the following:


    (a) p=1,s=0


    (b) p=3,s=1'
  merge: -1
