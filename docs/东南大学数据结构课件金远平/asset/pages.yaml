  md: '# 4.8 Equivalence Classes


    Definition: A relation ≡ over a set S is an equivalence relation over S iff it
    is symmetric, reflexive, and transitive over S.


    ≡ partitions the set S into equivalence classes. For example, let S={0,1,...,10,11}
    and


    0≡4, 3≡1, 6≡10, 8≡9, 7≡4, 6≡8, 3≡5, 2≡11, 11≡0


    S is partitioned into 3 equivalence classes:

    {0,2,4,7,11}; {1,3,5}; {6,8,9,10}'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'To determine equivalence classes, begin at 0 and find all pairs of (0, j).
    0 and j are in the same class. By transitivity, all (j, k) imply k is in the same
    class. Continue this way until the entire class containing 0 has been found, marked.
    Then go on for another class...


    Major difficulty: find the implied k. Use a strategy similar in the maze problem.


    Representation:

    m---the number of related pairs.

    n---the number of objects.'
