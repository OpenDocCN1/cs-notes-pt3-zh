- pgno: 552
  md: 'Definition: Vertex i in an AOV network G is a predecessor of j iff there is
    a directed path from i to j. If <i, j> is an edge in G then i is an immediate
    predecessor of j and j immediate successor of i.


    Definition: A precedence relation that is both transitive and irreflexive is a
    partial order.


    A directed graph with no cycle is an acyclic graph.'
  merge: -1
  img_proc: true
- pgno: 553
  md: 'Given a AOV network G, we are concerned with determining whether or not it
    is irreflexive, i.e., acyclic.


    And we need to generate the topological order of vertices in G.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '**Definition:** A topological order is a linear ordering of vertices of a graph
    such that, for any two vertices i and j, if i is a predecessor of j in the network,
    then i precedes j in the linear ordering.


    Two possible topological orders of Fig. 6.36 are:


    +   1. C1,C2,C4,C5,C3,C6,C8,C7,C10,C13,C12,C14,C15,C11,C9

    +   2. C4,C5,C2,C1,C6,C3,C8,C15,C7,C9,C10,C11,C12,C13,C14'
  merge: -1
  img_proc: true
