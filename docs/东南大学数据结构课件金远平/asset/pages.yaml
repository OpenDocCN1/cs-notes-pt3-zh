    \  for (all vertices w adjacent to v)  // actual code uses an\n              \
    \                           // iterator\n        if (!visited[w]) {\n        \
    \    q.Push(w);\n            visited[w] = true;\n        }\n    }   // end of\
    \ while\ndelete [] visited;\n}\n```\n```"
