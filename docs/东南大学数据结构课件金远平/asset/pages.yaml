  md: '# Restrictions:


    +   1. $(v, v)$ or $\langle v, v\rangle$ is not legal, such edges are known as
    self edges.

    +   2. Multiple occurrences of the same edges are not allowed. If allowed, we
    get a multigraph.


    +   - The maximum number of edges in any $n$-vertex, undirected graph is $n(n-1)/2$,
    and in directed graph is $n(n-1)$.

    +   - An $n$-vertex undirected graph with $n(n-1)/2$ edges is said to be complete.'
