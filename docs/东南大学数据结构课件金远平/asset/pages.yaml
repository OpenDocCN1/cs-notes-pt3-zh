- pgno: 370
  md: "```\ntemplate <class K, class E> // Driver\npair<K,E>* BST<K,E>::Get(const\
    \ K& k)\n{ // Search *this for a pair with key k.\n    return Get(root, k);\n\
    }\n\ntemplate <class K, class E> // Workhorse\npair<K,E>* BST<K,E>::Get(treeNode<pair<K,E>>*\
    \ p, const K& k)\n{\n    if (!p) return 0;\n    if (k < p->data.first) return\
    \ Get(p->leftChild, k);\n    if (k > p->data.first) return Get(p->rightChild,\
    \ k);\n    return &p->data;\n}\n```"
