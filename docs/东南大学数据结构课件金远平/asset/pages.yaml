- pgno: 451
  md: '+   - If (u, v) ∈ E(G), we say u and v are adjacent and edge (u, v) is incident
    on vertices u and v. If <u, v> is a directed edge, then vertex u is adjacent to
    v, and v is adjacent from u, <u, v> is incident to u and v.

    +   - A subgraph of G is a graph G` such that V(G`) ⊆ V(G) and E(G`) ⊆ E(G).

    +   - A path from u to v in G is a sequence of vertices u, i₁, i₂, ..., iₖ, v
    such that (u, i₁), (i₁, i₂), ..., (iₖ, v) are edges in E(G). If G` is directed,
    then <u, i₁>, <i₁, i₂>, ..., <iₖ, v> are edges in E(G`).

    +   - The length of a path is the number of edges on it.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '+   - A **simple path** is a path in which all vertices except possibly the
    first and last are distinct.

    +   - A **cycle** is a simple path in which the first and last vertices are the
    same.

    +   - For directed graph, we have directed paths and cycles.

    +   - In an undirected G, u and v are **connected** iff there is a path in G from
    u to v (also from v to u).

    +   - An undirected G is **connected** iff for every pair of distinct u and v
    in V(G), there is a path from u to v.'
  merge: -1
