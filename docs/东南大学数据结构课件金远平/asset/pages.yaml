- pgno: 620
  md: "```\ntemplate <class T>\nvoid Merge (T *initList, T *mergedList,\n        \
    \    const int l, const int m, const int n)\n{ // two sorted lists initList[l:m]\
    \ and initList[m+1:n] are\n// merged to obtain the sorted list mergedList[l:n].\n\
    \    for (int i1=l, iResult=l, i2=m+1; i1<=m && i2<=n; iResult++)\n        if\
    \ (initList[i1] <= initList[i2])\n            mergedList[iResult]=initList[i1++];\
    \ //stable\n        else\n            mergedList[iResult]=initList[i2++];\n  \
    \  // copy remaining records , if any, of the first list\n    copy(initList+i1,\
    \ initList+m+1, mergedList+iResult);\n    // copy remaining records , if any,\
    \ of the second list\n    copy(initList+i2, initList+n+1, mergedList+iResult);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 621
  md: '# Analysis of Merge:


    At each iteration of the for loop, either i1++ or i2++, the for loop is iterated
    at most n-l+1 times.


    At most n-l+1 records are copied.


    The total time: O(n-l+1).


    If each record has a size s, then the total time is O(s(n-l+1)).


    When s>1, use linked lists, only need n-l+1 links, the merge time becomes O(n-l+1)
    and is independent of s.'
