  md: '# 5.2.3 Binary Trees Representations


    # 5.2.3.1 Array Representation


    The nodes may be stored in a one dimensional array tree, with the node sequentially
    numbered i being stored in tree[i].


    Lemma 5.4: if a complete binary tree with n nodes is represented sequentially,
    then for any nodes with index i, 1 ≤ i ≤ n, we have


    (1) parent(i) is at ⌊i/2⌋ if i≠1. If i=1, i is the root and has no parent.'
