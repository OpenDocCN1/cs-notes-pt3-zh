- pgno: 439
  md: 'For each \(i\), we have \(b_i b_{n-i-1}\) distinct trees, so


    \[b_n=\sum_{i=0}^{n-1} b_i b_{n-i-1},\quad n\ge 1,\quad \text{and } b_0=1 \tag{5.3}\]


    To obtain \(b_n\) in term of \(n\), we must solve the recurrence of Eq. (5.3).


    Let \[B(x)=\sum_{i\ge 0} b_i x^i\tag{5.4}\]


    Which is the generating function for the number of binary trees.'
