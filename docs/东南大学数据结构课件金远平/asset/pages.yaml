  md: "```\n//Workhorse– assume to be a friend of GenListNode\ntemplate <class T>\n\
    bool Equal(GenListNode<T>* s, GenListNode<T>* t)\n{\n    if ((!s) && (!t)) return\
    \ true;\n    if ( s && t && (s->tag == t->tag) )\n        if (s->tag)\n      \
    \      return Equal(s->down, t->down)\n                && Equal(s->next, t->next);\n\
