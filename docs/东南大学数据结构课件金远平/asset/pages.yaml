- pgno: 839
  md: '![](img/15e8d7d94d8ddf02cb6839870195a31e_839_0.png)


    (c) p=4, s=2'
  merge: -1
  img_proc: true
- pgno: 840
  md: 'A B-tree of order m with p nodes has at least


    $1 + (\lceil m/2 \rceil - 1)(p-1)$ elements.


    *(root)*             *(other nodes)*


    The average number of splitting s_avg


    $s_{avg} = (\text{total number of splits})/N$


    $\le (p-2)/\{1 + (\lceil m/2 \rceil - 1)(p-1)\}$


    $< 1/(\lceil m/2 \rceil - 1)$


    For m=200, $s_{avg} < 1/99$.'
  merge: -1
  img_proc: true
- pgno: 841
  md: 'The number of disk accesses in an insertion is h+2s+1, where s is the number
    of nodes split.


    So the average disk accesses is


    h+2 s_avg +1 < h+2/99+1≈h+1.'
  merge: -1
  img_proc: true
- pgno: 842
  md: '# 11.2.4 Deletion from a B-Tree


    Suppose the key of the element to be deleted is x.


    First, search for x. If x is in a nonleaf node z and x = Eᵢ.K, then the corresponding
    element may be replaced by either the element with smallest key in the subtree
    Aᵢ or the element with largest key in the subtree Aᵢ₋₁. Both are in leaf nodes.


    The deletion from a nonleaf node is thus transformed into a deletion from a leaf,
    as shown in the next slide.'
  merge: -1
  img_proc: true
- pgno: 843
  md: '![](img/15e8d7d94d8ddf02cb6839870195a31e_843_0.png)'
  merge: -1
  img_proc: true
- pgno: 844
  md: '# 4 cases of deleting from a leaf node p:


    (1) p is the root, if p is left with at least 1 key, p is written to disk, done.
    Otherwise the B-tree is empty following the deletion.


    In the remaining cases, p is not the root.


    (2) Following the deletion, p has at least ⌈m/2⌉-1 keys. The modified p is written
    to disk, done.


    (3) p has ⌈m/2⌉-2 keys, and its nearest sibling, q, has at least ⌈m/2⌉ keys. A
    rotation is performed as shown in the next slide (suppose q be the nearest right
    sibling of p, r be parent of p and q).'
  merge: -1
  img_proc: true
- pgno: 845
  md: the changed p, q and r are written to disk, done.
  merge: -1
  img_proc: true
- pgno: 846
  md: '(4) p has ⌈m/2⌉-2 keys, and q has ⌈m/2⌉-1 keys. A combination is performed
    as shown below:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_846_0.png)'
  merge: -1
  img_proc: true
- pgno: 847
  md: 'Now p has (⌈m/2⌉-2)+(⌈m/2⌉-1)+1=2⌈m/2⌉-2 ≤ m-1 keys. p is written to disk.


    The number of keys in the parent, r, has been reduced by 1.


    If r does not become deficient (i.e., it has at least 1 element if it is the root
    and ⌈m/2⌉-1 elements if it is not the root), the changed r is written to disk,
    done.


    When r becomes deficient, if it is the root, it is discarded. Otherwise r has
    ⌈m/2⌉-2 keys, we can first attempt a rotation with one of its'
  merge: -1
  img_proc: true
- pgno: 848
  md: 'nearest siblings. If this is not possible, a combine is done. This process
    of combining can continue up the B-tree until the children of the root are combined.


    A high-level description of the deletion algorithm is given in the next slide:'
  merge: -1
  img_proc: true
- pgno: 849
  md: "```\n// Delete element with key x from a B-tree of order m\nSearch the B-tree\
    \ for node p containing the element with key x;\nif (there is no such node p)\
    \ return;  // no element to delete\nLet p be of the form: n, A₀, (E₁, A₁), …,\
    \ (Eₙ, Aₙ) and Eᵢ.K=x;\nif (p is not a leaf) {\n    Replace Eᵢ with the smallest\
    \ key element in subtree Aᵢ;\n    write the altered p to disk;\n    Let p be the\
    \ leaf of Aᵢ from which the smallest was taken;\n    Let p be of the form: n,\
    \ A₀, (E₁, A₁), …, (Eₙ, Aₙ);\n    i = 1;\n}\n\n// the following deletes Eᵢ from\
    \ leaf node p\n```"
  merge: -1
  img_proc: true
- pgno: 850
  md: "```\nDelete (E_i, A_i) from p; n--;\n**while** (n<⌈m/2⌉-1) && (p!=root)\n \
    \   **if** (p has a nearest right sibling q) {\n        Let q: n_q, A^q_0, (E^q_1\
    \ A^q_1), ..., (E^q_{n_q} A^q_{n_q});\n        Let r: n_r, A^r_0, (E^r_1 A^r_1),\
    \ ..., (E^r_{n_r} A^r_{n_r}) be parent of p and q;\n        Let A^r_j=q and A^r_{j-1}=p;\n\
    \        **if** (n_q >= ⌈m/2⌉) { // rotation\n            (E_{n+1}, A_{n+1})=(E^r_j,\
    \ A^q_0); n=n+1;   // update p\n            E^r_j=E^q_1;                     \
    \            // update r\n            (n_q,A^q_0,(E^q_1 A^q_1),...)=(n_q-1,A^q_1,(E^q_2\
    \ A^q_2),...); // update q\n            **write** p, q, r to disk; **return**;\n\
    \        }\n        // combine nodes p, E^r_j, and q\n        s=2*⌈m/2⌉-2;\n```"
  merge: -1
  img_proc: true
- pgno: 851
  md: "```\nwrite s, A₀, (E₁ A₁),…, (Eₙ Aₙ), (Eʳ A₀ʳ), (Eᑫ₁ Aᑫ₁),\n    …,(Eⁿᑫ Aⁿᑫ)\
    \ to disk as node p;\n\n// update for next iteration\nfree(q);\n(n, A₀,…)=(nᵣ₋₁,\
    \ A₀ʳ,…,(Eʳⱼ₋₁ Aʳⱼ₋₁), (Eʳⱼ₊₁ Aʳⱼ₊₁)…);\np=r;\n} // end of if p has a nearest\
    \ right sibling\nelse { // p must have a left sibling, this is symmetric to the\n\
    \        // case where p has a right sibling\n} // end of if-else and while\n\
    if (n) write p: (n, A₀, (E₁, A₁), …, (Eₙ, Aₙ));\nelse { root=A₀; free(p);} //\
    \ change root, always combine to left\n```"
  merge: -1
  img_proc: true
