  md: 'Given n identifiers, we can construct a binary search tree equivalent to a
    complete binary search tree for them. Using the function search (Program 5.21),
    the worst search time is log₂n. If the identifiers are to be searched with equal
    probability, it is optimal.


    For instance, the complete binary search tree for the file (do, if, while) is:


