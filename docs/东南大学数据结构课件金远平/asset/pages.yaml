- pgno: 665
  md: '# The most popular method for external sorting is merge sort, which consists
    of 2 phases:


    (1) Segments of the input list are sorted in internal memory, these sorted segments,
    known as runs, are written onto disk as they are generated.


    unsorted => Internal memory => sorted runs


    (2) The runs are merged together until only one run left.'
