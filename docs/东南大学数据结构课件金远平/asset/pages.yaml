  md: "# First, a very slow growing function\n\n$\\alpha(p,q)=\\min\\{z\\ge 1\\mid\
    \ A(z,\\lfloor p/q\\rfloor)>\\log_2 q\\},\\ p\\ge q\\ge 1$\n\nAnd Ackermann’s\
    \ function $A(i,j)$ is defined as:\n\n+   $A(1,j)=2^j$ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\
    \ for $j\\ge1$  \n+   $A(i,1)=A(i-1,2)$ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\
    \ for $i\\ge2$  \n+   $A(i,j)=A(i-1,A(i,j-1))$ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\
    \ for $i,j\\ge2$"
