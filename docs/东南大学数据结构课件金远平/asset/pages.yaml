    \ >> s.value; //matrix dimensions\n    int p=max(s.row, s.col);\n\n    // set\
    \ up head node for the head nodes list\n    matrix.headnode=new MatrixNode ( false,\
    \ &s );\n    if ( p==0 ) {\n        matrix.headnode->right = matrix.headnode;\n\
    \        return is;\n    } // there is always the head of head nodes list\n  \
