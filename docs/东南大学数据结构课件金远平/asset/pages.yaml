  md: '# 6.1.3.3 Adjacency Multilists


    In the adjacency lists of an undirected graph, each (u, v) is represented by 2
    entries.


    In some situations, it is necessary to be able to determine the second entry for
    a particular edge and mark that edge as used.


    So we need multilists: for each edge there is exactly one node, but it is in two
    lists.


