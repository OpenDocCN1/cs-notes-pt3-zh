- pgno: 803
  md: '# Computing time:


    If h is the height of the tree before insertion, the time to insert a new key
    is O(h).


    In case of AVL tree, h can be at most O(log n), so the insertion time is O(log
    n).'
  merge: -1
  img_proc: true
- pgno: 804
  md: 'To prove h=O(log n), let Nₕ be the minimum number of nodes in an AVL tree of
    height h, the heights of its subtrees are h-1 and h-2, and both are AVL trees.
    Hence


    Nₕ = Nₕ₋₁ + Nₕ₋₂ +1 (the root)    and

    N₀ =0, N₁ =1, N₂ =2.'
  merge: -1
