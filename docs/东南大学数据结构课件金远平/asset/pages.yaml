  md: "# Example 1.4 Recursive binary search\n\n```\nint BinarySearch (int *a, const\
    \ int x, const int left, const int right)\n// search the sorted array a[left:right]\
    \ for x\n{\n    if (left <= right) {\n        int middle = (left + right) / 2;\n\
    \        if (x < a[middle]) return BinarySearch(a, x, left, middle - 1);\n   \
    \     else if (x > a[middle])\n            return BinarySearch(a, x, middle +\
