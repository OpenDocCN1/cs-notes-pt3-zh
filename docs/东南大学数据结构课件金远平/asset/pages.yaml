- pgno: 167
  md: "```\nvoid Eval(Expression e)\n{\n    // evaluate the postfix expression e.\
    \ It is assumed that the\n    // last token in e is '#'. A function NextToken\
    \ is used to get\n    // the next token from e. Use stack.\n    Stack<Token> stack;\
    \  //initialize stack\n    for (Token x = NextToken(e); x!='#'; x=NextToken(e))\n\
    \        if (x is an operand) stack.Push(x);\n        else {  // operator\n  \
    \          remove the correct number of operands for operator x\n            from\
    \ stack; perform the operation x and store the result\n            (if any) onto\
    \ the stack;\n        }\n}\n```"
