- pgno: 593
  md: '+   - a list of records (R₁, R₂, ..., Rₙ)

    +   - each Rᵢ has key value Kᵢ

    +   - assume an ordering relation (<) on the keys, so that for any 2 key values
    x and y, x=y or x<y or x>y. < is transitive.


    The **sorting problem** is that of finding a permutation, σ, such that K₍σ(i)₎
    ≤ K₍σ(i+1)₎ , 1≤i≤n-1. The desired ordering is (R₍σ(1)₎, R₍σ(2)₎, ..., R₍σ(n)₎).'
  merge: -1
  img_proc: true
- pgno: 594
  md: 'Let σₛ be the permutation with the following properties:


    +   (1) K_{σs(i)} ≤ K_{σs(i+1)}, 1≤i≤n-1.


    +   (2) If i<j and K_i = K_j in the input list, then R_i precedes R_j in the sorted
    list.


    A sorting method that generates the permutation σₛ is stable.'
  merge: -1
