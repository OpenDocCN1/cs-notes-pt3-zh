- pgno: 808
  md: '# Chapter 11

    Multiway Search Trees


    # 11.1 m-Way Search trees


    # 11.1.1 Definition of m-Way Search Trees


    If AVL tree were used to represent a very large collection of elements, it would
    be on disk. To search among n keys requires h=1.44 log₂ (n+1) disk accesses in
    the worst case.


    If n=10⁶, 1.44log₂ (n+1)≈28 --- too bad!'
  merge: -1
  img_proc: true
- pgno: 809
  md: 'Recall that the block of a disk access (I/O) is much larger than the node of
    a binary tree. If we use AVL tree for index, accessing a node is actually accessing
    a block of which most part are useless, as shown below:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_809_0.png)


    an AVL node in a disk block'
  merge: -1
  img_proc: true
- pgno: 810
  md: 'To break the log₂(n+1) barrier on tree height resulting from the use of binary
    search trees, we must use search trees whose degree is more than 2.


    In practice, we use the largest degree for which the tree node fits into a block.'
  merge: -1
  img_proc: true
- pgno: 811
  md: "# Definition: An m-way search tree, either is empty or satisfies the following\
    \ properties:\n\n+   (1) The root has at most m subtrees and has the following\
    \ structure:\n+   \n+   n, A₀, (E₁, A₁), (E₂, A₂), ..., (Eₙ, Aₙ)\n+   \n+   where\
    \ the Aᵢ, 0≤i≤n<m, are pointers to subtrees, and Eᵢ, 1≤i≤n<m, are elements. Each\
    \ Eᵢ has a key Eᵢ.K.\n\n+   (2) Eᵢ.K < Eᵢ₊₁.K, 1≤i<n.\n\n+   (3) Let E₀.K = -∞\
    \ and Eₙ₊₁.K = ∞. All key values in subtree Aᵢ are less than Eᵢ₊₁.K and greater\
    \ than Eᵢ.K, 0≤i≤n.\n\n+   (4) The subtrees Aᵢ, 0≤i≤n, are also m-way search trees."
  merge: -1
  img_proc: true
- pgno: 812
  md: '# The following is a 3-way search tree:


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_812_0.png)'
  merge: -1
  img_proc: true
- pgno: 813
  md: 'In a tree of degree m and height h, the maximum number of nodes is


    ∑₀≤i≤h−1 mⁱ = (mʰ − 1)/(m − 1)


    Each node has at most m-1 keys, the maximum number of keys is mʰ-1.


    +   - for a binary tree with h=3, it is 7.

    +   - for a 200-way tree with h=3, it is 8*10⁶-1.


    To achieve a performance close to that of the best m-way search tree for a given
    number of elements n, the search tree must be balanced.'
  merge: -1
  img_proc: true
- pgno: 814
  md: '# 11.1.2 Searching an m-way Search Tree


    The searching is easy, and the next slide gives a high level description of the
    algorithm to search an m-way search tree.'
  merge: -1
  img_proc: true
- pgno: 815
  md: "```\n// Search an m-way search tree for an element with key x.\n// Return the\
    \ element if found, else return NULL.\nE0.K = -MAXKEY;\nfor ( *p=root; p; p= Aᵢ)\n\
    {\n    Let node p have the format n, A₀, (E₁, A₁), ..., (Eₙ, Aₙ);\n    Eₙ₊₁.K\
    \ = MAXKEY;\n    Determine i such that Eᵢ.K <= x < Eᵢ₊₁.K;\n    if (x==Eᵢ.K) return\
    \ Eᵢ;\n}\n// x is not in the tree\nreturn NULL;\n```\n\n# Exercises: P609-3"
  merge: -1
  img_proc: true
- pgno: 816
  md: '# 11.2 B-Trees


    # 11.2.1 Definition and Properties


    A particular balanced m-way search tree is B-tree.


    To define it, an external (or failure) node is added wherever we otherwise have
    a NULL pointer.


    An external node represents a node that can be reached during a search only if
    the element being searched for is not in the tree.'
  merge: -1
  img_proc: true
