    (K¹ is the most significant key and Kᵈ the least).


    A list of records R₁, R₂, ..., Rₙ is sorted with respect to the keys K¹, K², ...,
    Kᵈ iff


    For every pair of i and j, i<j and


    (Kᵢ¹,...,Kᵢᵈ) ≤ (Kⱼ¹,...,Kⱼᵈ)'
