    tree c is optimal.


    # How to determine the optimal tree?


    One way: explicitly generate all possible binary search trees, compute the cost
    of each tree in O(n), then determine the optimal---need


    $O\left(\frac{n}{n+1}C_n^{2n}\right)=O\left(C_n^{2n}\right)$ --- no good.'
  merge: -1
  img_proc: true
- pgno: 751
  md: 'Instead, we can get an efficient algorithm by making use of the properties
    of optimal binary search trees(b.s.t.).


    Let a₁<a₂<......,<aₙ be n identifiers in a b.s.t., denote:


    +   • Tᵢⱼ---an optimal b.s.t. for aᵢ₊₁,......, aⱼ, i<j . Tᵢᵢ is an empty tree,
    0≤i≤n. Tᵢⱼ (i>j) is not defined.


    +   • cᵢⱼ---the cost of Tᵢⱼ. cᵢᵢ=0.


    +   • rᵢⱼ---the root of Tᵢⱼ.


    +   • wᵢⱼ---the weight of Tᵢⱼ. wᵢⱼ= qᵢ+ Σₖ₌ᵢ₊₁ʲ (qₖ+ pₖ).'
  merge: -1
  img_proc: true
- pgno: 752
  md: '+   - rᵢᵢ=0, wᵢᵢ=qᵢ, 0≤i≤n.


    +   - The optimal b.s.t. for a₁,......, aₙ is T₀ₙ. Its cost is c₀ₙ, root r₀ₙ.


    If Tᵢⱼ is an optimal b.s.t. for aᵢ₊₁,......, aⱼ and rᵢⱼ=k, i<k ≤j, then Tᵢⱼ has
    2 subtrees L and R.


    L contains the identifiers aᵢ₊₁,......, aₖ₋₁.


    R contains the identifiers aₖ₊₁,......, aⱼ.'
  merge: -1
  img_proc: true
- pgno: 753
  md: '![](img/15e8d7d94d8ddf02cb6839870195a31e_753_0.png)


    The cost c_ij of T_ij is

    c_ij = p_k + cost(L) + cost(R) + w_{i,k-1} + w_{k j}    (10.2)'
  merge: -1
  img_proc: true
- pgno: 754
  md: 'From (10.2), if c_ij is to be minimal, then cost(L)=c_{i,k-1} and cost(R)=c_{kj},
    as otherwise we could replace either L or R by a subtree with a lower cost, thus
    generating a b.s.t. for a_{i+1},......, a_j with a lower cost than c_ij. This
    violates the assumption that T_ij is optimal.


    Hence, E.q.(10.2) becomes


    c_ij = p_k + w_{i,k-1} + w_{kj} + c_{i,k-1} + c_{kj}

    = w_{ij} + c_{i,k-1} + c_{kj}      (10.3)'
  merge: -1
  img_proc: true
- pgno: 755
  md: 'Since $T_{ij}$ is optimal, from (10.3) we know $r_{ij}=k$ is such that


    $w_{ij}+c_{i,k-1}+c_{kj}=\min_{i<l\le j}\{w_{ij}+c_{i,l-1}+c_{lj}\}$


    or


    $c_{i,k-1}+c_{kj}=\min_{i<l\le j}\{c_{i,l-1}+c_{lj}\}$ (10.4)


    # Note also


    $w_{ij}=w_{i,j-1}+p_j+c_j$.


    (10.4) gives us a means of obtaining $r_{0n}$, $T_{0n}$ and $c_{0n}$, starting
    from $r_{ii}=0$, $T_{ii}=\varnothing$ and $c_{ii}=0$.'
  merge: -1
  img_proc: true
