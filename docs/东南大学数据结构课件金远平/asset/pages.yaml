  md: '# 6.3 Minimum-Cost Spanning Trees


    The cost of a spanning tree of a weighted, undirected graph is the sum of the
    costs (weights) of the edges in the spanning tree.


    A minimum-cost spanning tree is a spanning tree of least cost.'
  merge: -1
  img_proc: true
- pgno: 516
  md: 'A design strategy called greedy method can be used to obtain a minimum-cost
    spanning tree.


    In the greedy method,


    +   - construct an optimal solution in stages;

    +   - at each stage, make a decision (using some criterion) that appears to be
    the best (local optimum);

    +   - since the decision can’t be changed later, make sure it will result in a
    feasible solution, i.e., satisfying the constraints.'
  merge: -1
  img_proc: true
- pgno: 517
  md: 'At the end, if the local optimum is equal to the global optimum, then the algorithm
    is correct; otherwise, it has produced a **suboptimal solution**.


    Fortunately, in the case of constructing minimum-cost spanning tree, the method
    is correct.'
  merge: -1
  img_proc: true
- pgno: 518
  md: 'To construct minimum-cost spanning tree, we use a least-cost criterion and
    the constraints are:


    +   1. must use only edges within G.

    +   2. must use exactly n-1 edges.

    +   3. may not use edges that produce a cycle.'
  merge: -1
  img_proc: true
