- pgno: 561
  md: 'Hence, we use adjacency lists representation, and assume:


    +   - **int *count** is defined as a data member, and its space is allocated in
    the constructor.

    +   - count[i], 0≤i<n, has been initialized to the in-degree of vertex i. When
    <i, j> is input, the count of j is increased by 1.

    +   - the list of vertices with 0 count is maintained as a custom stack linked
    through the **count** field since it is of no use after the count has become 0.'
