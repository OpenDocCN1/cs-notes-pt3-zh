- pgno: 634
  md: "```\ntemplate <class T>\nvoid HeapSort (T *a, const int n)\n{ // Sort a[1:n]\
    \ into nondeceasing order.\n    for (int i=n/2; i>=1; i--)  // convert list into\
    \ a heap\n        Adjust(a, i, n);\n    for (i=n-1; i>=1; i--)      // sort\n\
    \    {\n        swap(a[1], a[i+1]);  // swap first and last of current heap\n\
    \        Adjust(a, 1, i);     // recreate heap\n    }\n}\n```"
