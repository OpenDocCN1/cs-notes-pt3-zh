- pgno: 479
  md: '# Idea:


    Visit the start v first, next an unvisited w adjacent to v is selected and a depth-first
    search from w initiated. When u is reached such that all its adjacent vertices
    has been visited, we back up to the last vertex visited that has an unvisited
    vertex w adjacent to it and initiate a depth-first search from w. The search terminates
    when no unvisited vertex can be reached from any of the visited vertices.'
