- pgno: 790
  md: 'LL, RR, LR, and RL are the only 4 cases possible for rebalancing.


    LL and RR --- single rotations,


    LR and RL --- double rotations.


    For example, LR can be viewed as an RR followed by an LL rotation.'
  merge: -1
  img_proc: true
- pgno: 791
  md: 'Note that the **height** of the subtree involved in the rotation is the **same**
    after rebalancing as it was before the insertion.


    This means that once the rebalancing has been done on the subtree in question,
    examining the remaining tree is unnecessary.


    The only nodes whose BF can change are those in the subtree that is rotated.'
  merge: -1
  img_proc: true
- pgno: 792
  md: 'To locate A, note it is the nearest ancestor of Y, whose BF becomes ±2, and
    it is also the nearest ancestor with BF= ±1 before the insertion.


    Therefore, before the insertion, the BF’s of all nodes on the path from A to the
    new insertion point must have been 0.


    Thus, A is the nearest ancestor of the new node having a BF=±1 before insertion.


    To complete the rotation, the parent of A, F is also needed.'
  merge: -1
  img_proc: true
