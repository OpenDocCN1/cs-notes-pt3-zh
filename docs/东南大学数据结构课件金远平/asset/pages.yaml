  md: '# 5.2.2 Properties of Binary Trees


    **Lemma 5.2 [Maximum number of nodes]:**


    +   1. The maximum number of nodes on level $i$ of a binary tree is $2^{i-1}$,
    $i\ge1$.

    +   2. The maximum number of nodes in a binary tree of depth $k$ is $2^k-1$, $k\ge1$.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Proof:


    Let Mᵢ be the maximum number of nodes on level i


    (1) Induction on level i.


    i=1, only the root, Mᵢ = 2¹⁻¹ = 2⁰ = 1.


    Assume Mᵢ₋₁ = 2⁽ⁱ⁻¹⁾⁻¹ for i>1.


    Since each node has a maximum degree of 2, Mᵢ = 2* Mᵢ₋₁ = 2*2ⁱ⁻² = 2ⁱ⁻¹.


    (2) The maximum number of nodes in a binary tree of depth k is


    ∑ᵢ₌₁ᵏ Mᵢ = ∑ᵢ₌₁ᵏ 2ⁱ⁻¹ = 2ᵏ - 1.'
  merge: -1
  img_proc: true
