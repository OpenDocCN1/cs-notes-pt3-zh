- pgno: 761
  md: 'In general, we need to compute \(c_{ij}\) for j-i=1,2,...,n.


    And for each j-i=m,


    there are n-m+1 \(c_{ij}\)''s (\(c_{0m},...,c_{n-m,n}\)) to compute.


    The computation of each \(c_{ij}\) need to find the minimum from m quantities
    (10.4)---need O(m).


    The total time for all \(c_{ij}\)''s with j-i=m is O((n-m)m).


    The total time is


    \[\sum_{1\le m\le n} ((n-m)m)=O(n^3)\]'
  merge: -1
  img_proc: true
- pgno: 762
  md: 'In fact, Knuth proved that the optimal l in (10.4) may be found by limiting
    the search to the range \(r_{i,j-1} \le l \le r_{i+1,j}\). In this case, the computing
    time becomes \(O(n^2)\). Algorithm obst uses this result.


    Class BST of Chapter 5 is augmented to include obst as a private member function
    and to have the private data members r, c, and w.


    Now the algorithm obst.'
  merge: -1
  img_proc: true
- pgno: 763
  md: "```\ntemplate <class KeyType>\nBST<KeyType>::Obst(int *p,int *q,Element<KeyType>*a,int\
    \ n)\n//given a₁< a₂<... <aₙ, and pⱼ, 1≤j≤n, and qᵢ, 0≤i≤n, compute cᵢⱼ\n//for\
    \ Tᵢⱼ for aᵢ₊₁,..., aⱼ. Also compute rᵢⱼ and wᵢⱼ.\n{\n    for (int i=0; i<n; i++)\
    \ {\n        w[i][i]=q[i]; r[i][i]=c[i][i]=0;    //initialize\n        w[i][i+1]=q[i]+q[i+1]+p[i+1];\
    \ //optimal trees with one node\n        r[i][i+1]=i+1;\n        c[i][i+1]=w[i][i+1];\n\
    \    }\n    w[n][n]=q[n]; r[n][n]=c[n][n]=0;\n```"
  merge: -1
  img_proc: true
- pgno: 764
  md: "```\nfor (int m=2; m<=n; m++) //find optimal b.s.t. with m nodes\n    for (i=0;\
    \ i<=n-m; i++) {\n        int j=i+m;\n        w[i][j]=w[i][j-1]+p[j]+q[j];\n \
    \       int k=KnuthMin(i,j);\n        //KnuthMin return k in the range [r[i,j-1],\
    \ r[i+1, j]]\n        //minimizing c[i,k-1]+c[k,j]\n        c[i][j]=w[i][j]+c[i][k-1]+c[k][j];\
    \ //Eq. (10.3)\n        r[i][j]=k;\n    }\n} // end of Obst\n```\n\nThe actual\
    \ T₀ₙ may be constructed from rᵢⱼ in O(n).\n\nExercises: P562-3"
  merge: -1
  img_proc: true
