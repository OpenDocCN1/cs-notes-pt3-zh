- pgno: 737
  md: '+   - worst case: tree(a) requires 4 comparisons, tree(b) requires 3 comparisons,
    (b) is better.

    +   - average case:

    +     - Tree(a): 1 comparison---for, 2---do, 2---while, 3---return, 4---if. With
    equal probability, the average number of comparisons for a successful search is
    (1+2+2+3+4)/5=2.4 .

    +     - Tree(b): (1+2+2+3+3)/5=2.2

    +   (b) is better too.'
