- pgno: 721
  md: 'When linear open addressing is used to handle overflows, a hash table search
    for key k proceeds as follows:


    +   1. Compute h(k)

    +   2. Examine ht[h(k)], ht[(h(k)+1)%b], …, ht[(h(k)+j)%b] until one of the following
    happens:

    +      (a) ht[(h(k)+j)%b] has a pair whose key is k---found.

    +      (b) ht[h(x)+j%b] is empty---not in.

    +      (c) return to the starting position h(k)---the table is full and k is not
    in.'
  merge: -1
  img_proc: true
- pgno: 722
  md: "```\n```cpp\ntemplate <class K, class E>\npair<K, E>* LinearProbing<K, E>::Get(const\
    \ K& k)\n{ // search the linear probing hash table ht (s=1) for k.\n  // If found\
    \ return a pointer to the pair, else return 0.\n  int i=h(k); // home bucket\n\
    \  int j;\n  for (j=i; ht[j] && ht[j]->first != k;) {\n    j = (j+1) % b;    //\
    \ treat the table as circular\n    if (j == i) return 0;  // back to the start\
    \ point\n  }\n  if (ht[j]->first==k) return ht[j];\n  return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
