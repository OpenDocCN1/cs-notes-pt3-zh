- pgno: 190
  md: 'These operations have to be implemented as member functions of C to access
    its private data members.


    Consider the container class Chain<T>, there are, however, some drawbacks to this:


    +   (1) All operations of Chain<T> should preferably be independent of the type
    of object to which T is initialized. However, operations that make sense for one
    instantiation of T may not for another instantiation.


    +   (2) The number of operations of Chain<T> can become too large.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '(3) Even if it is acceptable to add member functions, the user would have to
    learn how to sequence through the container class.


    These suggest that container class be equipped with iterators that provide systematic
    access to the elements of the object.


    User can employ these iterators to implement their own functions depending upon
    the particular application.


    Typically, an iterator is implemented as a nested class of the container class.'
