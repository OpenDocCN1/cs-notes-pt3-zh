- pgno: 626
  md: "# Now the sort can be done by repeatedly invoking MergePass.\n\n```\ntemplate\
    \ <class T>\nvoid MergeSort (T *a, const int n)\n{ // Sort a[1:n] into nondereasing\
    \ order.\n    T *tempList=new T[n+1];\n    //l is the length of the sublist currently\
    \ being merged\n    for (int l=1; l<n; l*=2) {\n        MergePass(a, tempList,\
    \ n, l);\n        l*=2;\n        MergePass ( tempList, a, n, l);// last pass may\
    \ just copy\n    }\n    delete [] tempList;\n}\n```"
