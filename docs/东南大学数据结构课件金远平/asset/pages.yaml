- pgno: 820
  md: '# 11.2.2 Number of Elements in a B-tree


    Let t be a B-tree of order m in which all external nodes are at level l+1, and
    let N the number of keys in t. Then


    +   (1) N ≤ m^l-1 (upper bound).

    +   (2) N ≥ 2⌈m/2⌉^l-1 -1 (lower bound).


    To show this, observe:


    If l>1, there are at least 2 nodes at level 2, there are at least 2 ⌈m/2⌉ nodes
    at level 3, ...'
  merge: -1
  img_proc: true
- pgno: 821
  md: '# there are at least 2 ⌈m/2⌉^{l-2} nodes at level l.


    ![](img/15e8d7d94d8ddf02cb6839870195a31e_821_0.png)


    Level 1


    2


    3


    ⌈m/2⌉


    If the key values in the tree are K₁, K₂, ..., K_N, K_i < K_{i+1}, 1 ≤ i < N,
    then the number of external nodes is N+1 because failures occur for K_i < x <
    K_{i+1}, 0 ≤ i ≤ N,'
  merge: -1
  img_proc: true
- pgno: 822
  md: 'where K₀ = -∞ and K_{N+1} = +∞.


    Therefore,


    N+1 = number of failure nodes in t

    = number of nodes at level l+1

    ≥ 2⌈m/2⌉^{l-1}


    N ≥ 2⌈m/2⌉^{l-1} − 1.


    l ≤ log_{⌈m/2⌉}((N+1)/2) + 1.'
  merge: -1
  img_proc: true
- pgno: 823
  md: "In worst case to search the B-tree need I accesses.\n\nAssume m=200, and note\
    \ I is integer:\n\n+   (1) For N ≤ 2*10^6-2,  \n+   I ≤ ⌊log₁₀₀(10^6-1/2)⌋+1=3.\n\
    \n+   (2) For N ≤ 2*10^8-2,  \n+   I ≤ ⌊log₁₀₀(10^8-1/2)⌋+1=4."
  merge: -1
  img_proc: true
- pgno: 824
  md: '# 11.2.3 Insertion into a B-Tree


    Note that we can’t insert a new node in the position of an external node because:


    +   1. One key might be too few;

    +   2. External nodes must be at the same level.


    As shown in the next slide.'
  merge: -1
  img_proc: true
- pgno: 825
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 826
  md: '# Basic ideas of the insertion algorithm for B-tree of order m:


    +   1. Perform a search to determine the leaf node, p, into which the new key
    is to be inserted.

    +   2. If the insertion results in p having m keys, the node p is split. Otherwise,
    the new p is written to the disk and the insertion is complete.'
  merge: -1
  img_proc: true
- pgno: 827
  md: 'To split the node, assume that following the insertion, p has the format


    $m, A_0, (E_1, A_1), \ldots, (E_m, A_m)$ and $E_i \leq E_{i+1},\ K$, $1 \leq i
    \leq m$.


    The node is split into 2 nodes, p and q, with the following formats:


    node p: $\lceil m/2 \rceil - 1,\ A_0, (E_1, A_1), \ldots, (E_{\lceil m/2 \rceil
    - 1}, A_{\lceil m/2 \rceil - 1})$ \hfill (11.5)


    node q: $m - \lceil m/2 \rceil,\ A_{\lceil m/2 \rceil}, (E_{\lceil m/2 \rceil
    + 1}, A_{\lceil m/2 \rceil + 1}), \ldots, (E_m, A_m)$


    And the tuple $(E_{\lceil m/2 \rceil}, q)$ is to be inserted into the parent of
    p.'
  merge: -1
  img_proc: true
- pgno: 828
  md: 'Inserting into the parent may require us to split the parent, and the splitting
    process can propagate all the way up to the root.


    When the root split, a new root with a single key is created, and the height of
    the B-tree increases by one.


    Note that when m=2, ⌈m/2⌉-1=0, this means the above method does not work for m=2.


    The next slide gives a high-level description of the insertion algorithm for a
    disk resident B-tree.'
  merge: -1
  img_proc: true
- pgno: 829
  md: "```\n// Insert element x into a disk resident B-tree.\nSearch the B-tree for\
    \ an element E with key x.K;\nif such an E is found, replace E with x and return;\n\
    else let p be the leaf into which x is to be inserted;\nq = NULL;\nfor (e=x; p;\
    \ p=p→parent())  // the parent of root is NULL\n{ // (e, q) is to be inserted\
    \ into p\n    Insert (e, q) into appropriate position in node p;\n    Let the\
    \ resulting node have the form:\n                    n, A₀, (E₁, A₁), ..., (Eₙ,\
    \ Aₙ);\n    if (n<=m-1) {  // the resulting node is not too big\n        write\
    \ node p to disk; return;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 830
  md: '```

    //node p has to be split

    Let node p and q be defined as in (11.5);

    e=E⌊m/2⌋;

    write nodes p and q to the disk;

    }

    // a new root is to be created

    Create a new node r with format: 1, root, (e, q);

    // when the tree is empty, root=p=0

    root=r;

    write root to disk;

    ```'
  merge: -1
