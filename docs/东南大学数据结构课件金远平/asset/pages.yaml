  md: '# 6.2 Elementary Graph Operations


    Given G = (V, E), and v in V(G), we wish to visit all vertices in G that are reachable
    from v.


    In the following methods, we assume the graphs are undirected, although they work
    on the directed as well.


    # 6.2.1 Depth-First Search'
