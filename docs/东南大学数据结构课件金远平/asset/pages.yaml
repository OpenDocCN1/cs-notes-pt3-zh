- pgno: 692
  md: '# Basic ideas of Huffman’s solution :


    +   - begin with a min heap of n single-node trees, which is an external node
    with the weight being one of the qᵢ’s.


    +   - repeatedly extract 2 minimum-weight a and b from the min heap, combine them
    into a single binary tree c, and insert c into the min heap.


    +   - after n-1 rounds, the min heap will be left with a single binary tree, which
    is the wanted.'
  merge: -1
  img_proc: true
- pgno: 693
  md: '# Assume:


    +   - the function **Huffman** is a friend of TreeNode.

    +   - use the **data** field of a TreeNode to store the weight of the **binary**
    tree rooted at that node.'
  merge: -1
  img_proc: true
- pgno: 694
  md: "```\ntemplate <class T>\nvoid Huffman(MinHeap<TreeNode<T> *> heap, int n)\n\
    { // heap is initially a min heap of n single-node binary trees.\n    for (int\
    \ i=0; i<n-1; i++) {//loop n-1 times to combine n nodes\n        TreeNode<T> *a=heap.Top();\n\
    \        heap.Pop();\n        TreeNode<T> *b=heap.Top();\n        heap.Pop();\n\
    \        TreeNode<T> *c=new TreeNode(a->data+b->data, a, b); // refer section\
    \ 5.2.3.2\n        heap.Push(c);\n    }\n}\n```"
  merge: -1
  img_proc: true
