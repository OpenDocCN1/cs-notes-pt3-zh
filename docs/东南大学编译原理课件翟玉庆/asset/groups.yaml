    \ (3) 访问链\n\n- P₀\n- P₂\n- P₁\n- 调用 P₂\n- 调用 P₁\n\n![](img/353f619caa6c5715591f2105bdfa2865_455_0.png)\n\
    \n##### (4) 显示表\n\n- 与访问链接相比，使用一个指向活动记录的指针数组 d（称为显示表）可以更快地访问全局变量。\n\n- 假设控制权位于嵌套深度为\
    \ j 的过程 pj 的一次活动中，则 pj 活动的显示表为：\n\n|  |  |\n|---|---|\n| j | pj 的 Sp |\n| j−1\
    \ | pj-1 的 Sp |\n|  | ...... |\n| 0 | p0 的 Sp |\n|  | d[j+1] |\n\n- 当为嵌套深度为 i\
    \ 的过程建立一个新的活动记录时，我们需要\n- A) 将 d[i] 的值保存在新的活动记录中；\n- B) 设置 d[i] 指向新的活动记录。\n\n#####\
    \ (5) 非显示表\n\n当前过程的非显示表 = 调用者的非显示表 + 当前局部活动记录的起始地址\n\n![](img/353f619caa6c5715591f2105bdfa2865_460_0.png)\n\
