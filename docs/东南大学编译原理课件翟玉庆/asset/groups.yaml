    ## 第2章 语言与语法描述

    ### 第3节 语法构造与简化

    ### 1、从语言构造语法


    例4：设 L₄={ω | ω ∈(0,1)* 且 ω 中出现 1 的个数为偶数}


    尝试从 L₄ 构造语法 G₄


    ```

    S → ε

    ```


    ```

    S →0S,  S → 1A

    ```


    ```

    A →0A , A →1S

    ```


    ### 2、语法简化


    a、由于一种语言可以用不同的语法来描述，确实应该选择产生式最少且最适合该语言属性的语法。


    b、在一个语法中，可能存在一些对推导无用的冗余产生式。我们应该删除这些产生式。


    - 形式为 P→P 的产生式

    - 永远无法推导出终结符串的产生式

    - 其左侧非终结符不出现在任何产生式右侧的产生式


    ### 2、语法简化


    c、简化步骤：


    - 查找形式为 P→P 的产生式，并删除它们；

    - 如果一个产生式永远无法在推导中使用，删除它；

    - 如果一个产生式无法推导出终结符串，删除它；

    - 安排剩余的产生式。


    ### 2、语法简化


    **示例：** 简化以下语法


    ```

    (0)S → Be    (1)S → Ec    (2)A → Ae    (3)A → e

    (4)A → A     (5)B → Ce    (6)B → Af    (7)C → Cf

    (8)D → f

    ```


    **结果：**


    ```

    (0) S → Be       (1)A → Ae       (2)A →e

    (3)B → Af

    ```


    ### 3、构造不含 ε-产生式的上下文无关文法


    a、一个不含 ε-产生式的上下文无关文法应满足以下条件


    - 如果 P 中存在形式为 S → ε 的产生式，S 不应出现在任何产生式的右侧，其中 S 是文法的开始符号；

    - P 中没有其他 ε-产生式。


    b、构造不含 ε-产生式的上下文无关文法的算法：


    - G=(V_N,V_T,P,S) ⇒ G''=(V''_N,V''_T,P'',S'')


    (1) 找出经过若干步后能推导出 ε 的所有非终结符，并将它们放入集合 V_0；


    b、 构造不含 ε-产生式的上下文无关文法的算法：


    (2) 按以下步骤构造 G'' 的产生式集合 P''：


    - (A)如果 V₀ 中的符号出现在产生式的右侧，则将该产生式改为两个产生式：分别用 ε 和其本身替换该符号中的符号；将新的产生式放入 P''

    - ( B)否则，将与该符号相关的产生式放入 P''，但排除与该符号相关的 ε-产生式

    - ( C)如果 P 中存在形式为 S→ ε 的产生式，则将该产生式改为 S''→ ε | S 并将其放入 P''，令 S'' 为 G'' 的开始符号，令
    V''ₙ=Vₙ∪{S''}，


    示例：设 G₁=({S},{a,b},P,S)，其中


    P: (0) S → ε   (1) S → aSbS   (2) S → bSaS


    (1) V₀={S}


    (2) P′


    (1) S → abS|aSbS|aSb|ab


    (2) S → baS|bSaS|bSa|ba


    (0) S′ → ε | S


    所以：G₁=({S′,S},{a,b},P′,S′)，其中


    P′:


    (0) S′ → ε | S


    (1) S → abS|aSbS|aSb|ab


    (2) S → baS|bSaS|bSa|ba


    ## 第2章 语言与语法描述

    ### 第4节 文法的语法树与二义性

    ### 1、语法树

    ### a、定义


    - 用于表达语言中一个句子结构的树


    ### b、功能


    - 直观直接地呈现语法分析过程

    - 易于判断文法的二义性


    语法树的示例


    ![](img/353f619caa6c5715591f2105bdfa2865_66_0.png)


    ### 1、语法树

    ### c、语法树中的基本术语


    - (1) 子树


    由语法树中一个节点（除叶子外）及其所有后代节点组成的一棵树


    - (2) 修剪子树


    剪掉子树的根的所有子节点


    - (3) 句型


    语法树生长过程中的一个快照中出现的所有叶子的序列


    '
