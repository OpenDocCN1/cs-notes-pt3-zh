  md: "\n## Chapter 5 Syntax-Directed Translation\n\n### Section 1 Syntax-Directed\
    \ Definitions\n\n#### 1. Definitions\n\n4. **Dependency graph**  \n   A graph\
    \ that represents dependencies between attributes set up by the semantic rules.\n\
    \n   **Notes:**\n   1. From the dependency graph, we can derive an evaluation\
    \ order for the semantic rules.\n   2. Evaluation of the semantic rules defines\
    \ the values of the attributes at the nodes in the parse tree.\n   3. Semantic\
    \ rules may have side effects, e.g., printing a value.\n\n5. **Annotated parse\
    \ tree**  \n   A parse tree showing the values of attributes at each node.\n\n\
    \   **Notes:** The process of computing the attribute values at the nodes is called\
    \ annotating or decorating the parse tree.\n\n#### 2. Form of a Syntax-Directed\
    \ Definition\n\nEach grammar production A → α has associated with it a set of\
    \ semantic rules of the form b = f(c1, c2, …, ck), where f is a function.\n\n\
    1. b is a synthesized attribute of A; c1, c2, …, ck are attributes belonging to\
    \ the grammar symbols of the production.\n2. b is an inherited attribute of one\
    \ of the grammar symbols on the right side of the production; c1, c2, …, ck are\
    \ attributes belonging to the grammar symbols of the production.\n\n**Notes:**\
    \ In either case, we say that attribute b depends on attributes c1, c2, …, ck.\n\
    \n#### 3. Attribute Grammar\n\nA syntax-directed definition in which the functions\
    \ in semantic rules cannot have side effects.\n\n**Notes:**\n1. Functions in semantic\
    \ rules will often be written as expressions.\n2. Occasionally, semantic rules\
    \ are written as procedure calls or program fragments (in this case, we name the\
    \ attribute of the non-terminal as a dummy attribute).\n3. Values for attributes\
    \ of terminals are usually supplied by the lexical analyzer.\n\n**E.g.**\n\n|\
    \ Production | Semantic rules |\n| --- | --- |\n| A → E **n** (**n** for new-line)\
    \ | Print(E.val) (A has a dummy attribute) |\n| E → E^(1) * E^(2) | E.val = E^(1).val\
    \ * E^(2).val |\n| E → E^(1) + E^(2) | E.val = E^(1).val + E^(2).val |\n| E →\
    \ (E^(1)) | E.val = E^(1).val |\n| E → digit | E.val = digit.lexval |\n\n####\
    \ 4. Synthesized Attributes\n\n2. Annotation for a parse tree for an S-attributed\
    \ definition: By evaluating the semantic rules for the attributes at each node\
    \ *bottom up*, *from the leaves to the root*.\n\n**E.g. Annotated parse tree for\
    \ `3 * 5 + 4 n`**\n\n![](img/353f619caa6c5715591f2105bdfa2865_375_0.png)\n![](img/353f619caa6c5715591f2105bdfa2865_376_0.png)\n\
    ![](img/353f619caa6c5715591f2105bdfa2865_377_0.png)\n\n#### 5. Inherited Attributes\n\
    \nAlthough it is always possible to rewrite a syntax-directed definition to use\
    \ only synthesized attributes, it is often natural to use a syntax-directed definition\
    \ with inherited attributes.\n\n**E.g. Syntax-directed definition with inherited\
    \ attribute L.in**\n\n| Production | Semantic rules |\n| --- | --- |\n| D → T\
    \ L | L.in = T.type |\n| T → int | T.type = integer |\n| T → real | T.type = real\
    \ |\n| L → L^(1), id | L^(1).in = L.in<br>addtype(id.entry, L.in) |\n| L → id\
    \ | addtype(id.entry, L.in) |\n\n**E.g. Parse tree with inherited attribute `in`\
    \ at each node labeled L. (`real id1, id2, id3`)**\n\n![](img/353f619caa6c5715591f2105bdfa2865_380_0.png)\n\
    ![](img/353f619caa6c5715591f2105bdfa2865_381_0.png)\n\n#### 6. Dependency Graphs\n\
    \n1. **Definition**  \n   A directed graph that describes the inter-dependencies\
    \ among the inherited and synthesized attributes at the nodes in a parse tree.\n\
    \n2. **Constructing a dependency graph for a given parse tree**\n"
  mdcn: "\n\n## 第5章 语法制导翻译\n\n### 第1节 语法制导定义\n\n#### 1. 定义\n\n4. **依赖图**  \n   一种表示语义规则所设立的属性之间依赖关系的图。\n\
    \n   **注：**\n   1. 从依赖图中，我们可以推导出语义规则的一个求值顺序。\n   2. 语义规则的求值定义了语法分析树中各节点处的属性值。\n\
    \   3. 语义规则可能产生副作用，例如打印一个值。\n\n5. **带注释的语法分析树**  \n   一种在每个节点上显示属性值的语法分析树。\n\n\
    \   **注：** 计算各节点属性值的过程称为对语法分析树进行注释（annotating）或修饰（decorating）。\n\n#### 2. 语法制导定义的形式\n\
    \n每个文法产生式 A → α 都关联一组形如 b = f(c1, c2, …, ck) 的语义规则，其中 f 是一个函数。\n\n1. b 是 A 的一个综合属性；c1,\
    \ c2, …, ck 是产生式文法符号所具有的属性。\n2. b 是产生式右侧某个文法符号的一个继承属性；c1, c2, …, ck 是产生式文法符号所具有的属性。\n\
    \n**注：** 无论哪种情况，我们都说属性 b 依赖于属性 c1, c2, …, ck。\n\n#### 3. 属性文法\n\n一种语义规则中的函数不能有副作用的语法制导定义。\n\
    \n**注：**\n1. 语义规则中的函数通常写成表达式的形式。\n2. 偶尔，语义规则也会写成过程调用或程序片段的形式（在这种情况下，我们将非终结符的属性命名为一个哑属性）。\n\
    3. 终结符的属性值通常由词法分析器提供。\n\n**例如：**\n\n| 产生式 | 语义规则 |\n| --- | --- |\n| A → E **n**（**n**\
    \ 表示换行） | Print(E.val)（A 有一个哑属性） |\n| E → E^(1) * E^(2) | E.val = E^(1).val *\
    \ E^(2).val |\n| E → E^(1) + E^(2) | E.val = E^(1).val + E^(2).val |\n| E → (E^(1))\
    \ | E.val = E^(1).val |\n| E → digit | E.val = digit.lexval |\n\n#### 4. 综合属性\n\
    \n2. 对于 S属性定义，其语法分析树的注释方法：通过对每个节点处的属性执行语义规则来求值，顺序为*自底向上*、*从叶到根*。\n\n**例如：`3 *\
    \ 5 + 4 n` 的带注释的语法分析树**\n\n![](img/353f619caa6c5715591f2105bdfa2865_375_0.png)\n\
    ![](img/353f619caa6c5715591f2105bdfa2865_376_0.png)\n![](img/353f619caa6c5715591f2105bdfa2865_377_0.png)\n\
    \n#### 5. 继承属性\n\n虽然我们总是可以将语法制导定义改写为只使用综合属性，但使用带有继承属性的语法制导定义往往更自然。\n\n**例如：带有继承属性\
    \ L.in 的语法制导定义**\n\n| 产生式 | 语义规则 |\n| --- | --- |\n| D → T L | L.in = T.type |\n\
    | T → int | T.type = integer |\n| T → real | T.type = real |\n| L → L^(1), id\
    \ | L^(1).in = L.in<br>addtype(id.entry, L.in) |\n| L → id | addtype(id.entry,\
    \ L.in) |\n\n**例如：每个标记为 L 的节点处具有继承属性 `in` 的语法分析树（`real id1, id2, id3`）**\n\n![](img/353f619caa6c5715591f2105bdfa2865_380_0.png)\n\
    ![](img/353f619caa6c5715591f2105bdfa2865_381_0.png)\n\n#### 6. 依赖图\n\n1. **定义**\
    \  \n   一种有向图，描述语法分析树中各节点处继承属性和综合属性之间的相互依赖关系。\n\n2. **为给定的语法分析树构造依赖图**\n\n"
