    \ for a given parse tree**\n\n```pseudo\nfor each node n in the parse tree do\n\
    \    for each attribute a of the grammar symbol at n do\n        construct a node\
    \ in the dependency graph for a;\nfor each node n in the parse tree do\n    for\
    \ each semantic rule b = f(c1, c2, ..., ck)\n        associated with the production\
    \ used at n do\n        for i = 1 to k do\n            construct an edge from\
    \ the node for ci to the node for b;\n```\n\n- E.g. when the following production\
    \ is used in a parse tree, construct the dependency graph.\n\n| Production | Semantic\
    \ rules |\n|---|---|\n| E → E^(1) + E^(2) | E.val = E^(1).val + E^(2).val |\n\n\
    ![](img/353f619caa6c5715591f2105bdfa2865_386_0.png)\n\n#### 7、Evaluation order\n\
    \n**1) Basic idea**\n\nIn the topological sort of a DAG\n\n**2) Topological sort\
    \ of a DAG**\n\nAny ordering m1, m2, ..., mk of the nodes of the graph such that\
    \ edges go from nodes earlier in the ordering to later nodes.\n\nNotes: From a\
    \ topological sort of a dependency graph, we obtain an evaluation order for the\
    \ semantic rules.\n\n**3) An example**\n\nFrom this topological sort, we obtain\
    \ the following program. (ai for the attribute associated with the node numbered\
    \ i in the dependency graph.)\n\n- a4 = real;\n- a5 = a4;\n- addtype(id3.entry,\
    \ a5);\n- a7 = a5;\n- addtype(id2.entry, a7);\n- a9 = a7;\n- addtype(id1.entry,\
    \ a9);\n\n**4) Methods for evaluating semantic rules**\n\nParse-tree methods\n\
    \nObtain an evaluation order from a topological sort of the dependency graph constructed\
    \ from the parse tree for each input.\n\nNotes: It will fail if the dependency\
    \ graph for the particular parse tree has a cycle.\n\n(2) Rule-based methods\n\
    \nAt compiler-construction time, the semantic rules associated with productions\
    \ are analyzed.\n\nNotes: For each production, the order is predetermined.\n\n\
    (3) Oblivious methods\n\nAn evaluation order is chosen without considering the\
    \ semantic rules.\n\nNote: Its order restricts the class of syntax-directed definitions\
    \ that can be implemented.\n\nNotes: Rule-based and oblivious methods need not\
    \ explicitly construct the dependency graph at compiler time, so they can be more\
    \ efficient in their use of compiler time and space.\n\n#### 8、How to use syntax-directed\
    \ definitions to specify translations\n\n- Bottom-up evaluation of the S-attributed\
    \ definitions\n- Top-down translation of L-attributed definitions\n\n#### 10、L-attributed\
    \ Definition\n\nA syntax-directed definition is L-attributed if each inherited\
    \ attribute of Xj, 1 ≤ j ≤ n, on the right side of A → X1X2...Xn, depends only\
    \ on\n\n1. The attributes of the symbols X1, X2, ..., Xj-1 to the left of Xj in\
    \ the production, and\n\n2. The inherited attributes of A.\n\n- L-attributes can\
    \ always be evaluated in depth-first order.\n- “L” means “left”, because L-attribute\
    \ information appears to flow from left to right.\n- Every S-attributed definition\
    \ is L-attributed, because the restrictions in the definition apply only to inherited\
    \ attributes.\n"
  mdcn: "\n\n## 第5章 语法制导翻译\n\n### 第1节 语法制导定义\n\n#### 6、依赖图\n\n**2) 为给定的语法树构造依赖图**\n\
    \n```pseudo\nfor each node n in the parse tree do\n    for each attribute a of\
    \ the grammar symbol at n do\n        construct a node in the dependency graph\
    \ for a;\nfor each node n in the parse tree do\n    for each semantic rule b =\
    \ f(c1, c2, ..., ck)\n        associated with the production used at n do\n  \
    \      for i = 1 to k do\n            construct an edge from the node for ci to\
    \ the node for b;\n```\n\n- 例如，当以下产生式在语法树中使用时，构造依赖图。\n\n| 产生式 | 语义规则 |\n|---|---|\n\
    | E → E^(1) + E^(2) | E.val = E^(1).val + E^(2).val |\n\n![](img/353f619caa6c5715591f2105bdfa2865_386_0.png)\n\
    \n#### 7、求值顺序\n\n**1) 基本思想**\n\n在 DAG 的拓扑排序中\n\n**2) DAG 的拓扑排序**\n\n节点 m1, m2,\
    \ ..., mk 的任意一种排序，使得边从排序中靠前的节点指向靠后的节点。\n\n说明：从依赖图的拓扑排序中，我们得到语义规则的求值顺序。\n\n**3)\
    \ 一个例子**\n\n从此拓扑排序，我们得到以下程序。 （ai 为依赖图中编号为 i 的节点所关联的属性。）\n\n- a4 = real;\n- a5\
    \ = a4;\n- addtype(id3.entry, a5);\n- a7 = a5;\n- addtype(id2.entry, a7);\n- a9\
    \ = a7;\n- addtype(id1.entry, a9);\n\n**4) 求值语义规则的方法**\n\n语法树方法\n\n为每个输入的语法树构造的依赖图进行拓扑排序，从而得到求值顺序。\n\
    \n说明：如果特定语法树的依赖图存在环，则会失败。\n\n(2) 基于规则的方法\n\n在编译器构造时，与产生式关联的语义规则会被分析。\n\n说明：对于每个产生式，其顺序是预先确定的。\n\
    \n(3) 无视方法\n\n在不考虑语义规则的情况下选择求值顺序。\n\n说明：其顺序限制了可以实现语法制导定义的类别。\n\n说明：基于规则的方法和无视方法无需在编译时显式构造依赖图，因此在编译时间和空间的使用上可以更高效。\n\
    \n#### 8、如何使用语法制导定义来指定翻译\n\n- S-属性定义的自底向上求值\n- L-属性定义自顶向下翻译\n\n#### 10、L-属性定义\n\
    \n如果语法制导定义是 L-属性的，则在 A → X1X2...Xn 右侧的 Xj 的每个继承属性，1 ≤ j ≤ n，仅依赖于\n\n1. 产生式中位于\
    \ Xj 左侧的符号 X1, X2, ..., Xj-1 的属性，以及\n\n2. A 的继承属性。\n\n- L-属性总能按深度优先顺序求值。\n- “L”\
    \ 表示“left”，因为 L-属性信息似乎从左到右流动。\n- 每个 S-属性定义都是 L-属性的，因为定义中的限制仅适用于继承属性。\n\n"
