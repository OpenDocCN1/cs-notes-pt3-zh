    \nNotes: Here we use “\\*” to indicate states on which input retraction must take\
    \ place.\n\n**4、Implementing a Transition Diagram**\n\n- Each state gets a segment\
    \ of code\n- If there are edges leaving a state, then its code reads a character\
    \ and selects an edge to follow, if possible\n- Use `nextchar()` to read next\
    \ character from the input buffer\n\n```\nwhile (1) {\n    switch (state) {\n\
    \        case 0:\n            c = nextchar();\n            if (c == blank || c\
    \ == tab || c == newline) {\n                state = 0;\n                lexeme_beginning++;\n\
    \            }\n            else if (c == '<') state = 1;\n            else if\
    \ (c == '=') state = 5;\n            else if (c == '>') state = 6;\n         \
    \   else state = fail();\n            break;\n        case 9:\n            c =\
    \ nextchar();\n            if (isletter(c)) state = 10;\n            else state\
    \ = fail();\n            break;\n        ...\n    }\n}\n```\n\n**5、A generalized\
    \ transition diagram: Finite Automata**\n\n- Deterministic or non-deterministic\
    \ FA\n- Non-deterministic means that more than one transition out of a state may\
    \ be possible on the same input symbol\n\n**6、The model of recognition of tokens**\n\
    \n![](img/353f619caa6c5715591f2105bdfa2865_98_0.png)\n\ne.g. The FA simulator\
    \ for Identifiers is:\n\n![](img/353f619caa6c5715591f2105bdfa2865_99_0.png)\n\n\
    Which represents the rule:\n\n`identifier = letter(letter|digit)*`\n\n### Section\
    \ 4 Finite automata\n\n**1、Usage of FA**\n\n- Precisely recognize the regular\
    \ sets\n- A regular set is a set of sentences relating to the regular expression\n\
    \n**2、Sorts of FA**\n\n- Deterministic FA\n- Non-deterministic FA\n\n**3、Deterministic\
    \ FA (DFA)**\n\nDFA is a quintuple, M = (S, Σ, move, s₀, F).\n\n- S: a set of\
    \ *states*\n- Σ: the input symbol alphabet\n- move: a transition function, mapping\
    \ from S × Σ to S, *move(s, a) = s′*\n- s₀: the *start* state, s₀ ∈ S\n- F: a\
    \ set of states F distinguished as *accepting* states, F ⊆ S\n\n1. In a DFA, no\
    \ state has an ε-transition;\n2. In a DFA, for each state *s* and input symbol\
    \ *a*, there is at most one edge labeled *a* leaving *s*\n3. To describe a FA,\
    \ we use the transition graph or transition table\n4. A DFA accepts an input string\
    \ x if and only if there is some path in the transition graph from start state\
    \ to some accepting state\n\ne.g. DFA M = ({0,1,2,3}, {a,b}, move, 0, {3})\n\n\
    Move:\n\n```\nmove(0,a)=1   move(0,b)=2   move(1,a)=3   move(1,b)=2\nmove(2,a)=1\
    \   move(2,b)=3   move(3,a)=3   move(3,b)=3\n```\n\n**Transition table**\n\n|\
