    \ defined by the NFA is\n\n$0^*10^*|0^*10^*((1|0)0^*10^*)^*$\n\n### 5、 Conversion\
    \ of an NFA into a DFA\n\n- a) Reasons to conversion: Avoiding ambiguity\n- b)\
    \ The algorithm idea: Subset construction: The following state set of a state\
    \ in a NFA is thought of as a following STATE of the state in the converted DFA\n\
    \n**c) The pre-process -- ε-closure(T)**\n\nObtain ε-closure(T) for T ⊆ S\n\n\
    (1) ε-closure(T) definition: A set of NFA states reachable from NFA state s in\
    \ T on ε-transitions alone\n\n(2) ε-closure(T) algorithm\n\n```\npush all states\
    \ in T onto stack;\ninitialize ε-closure(T) to T;\nwhile stack is not empty do\
    \ {\n    pop the top element of the stack into t;\n    for each state u with an\
    \ edge from t to u labeled ε do {\n        if u is not in ε-closure(T) {\n   \
    \         add u to ε-closure(T)\n            push u into stack} } }\n```\n\n**d)\
    \ Subset Construction algorithm**\n\n- Input. An NFA N=(S, Σ, move, S₀, Z)\n-\
