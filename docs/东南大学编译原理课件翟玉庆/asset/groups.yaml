    \n如果文法中的某个句子具有两棵或两棵以上相关的语法树，则该句子是二义性的。\n\n**b、文法的二义性**\n\n如果文法所对应的语言中存在二义性句子，则该文法是二义性的。\n\
    \n![](img/353f619caa6c5715591f2105bdfa2865_73_0.png)\n\n**注：**\n\n- 二义性会给语法分析带来不确定性\n\
    - 文法的二义性是不可判定的，也就是说，不存在这样的算法，能在有限步骤内判定一个文法是否为二义性文法\n- 如果要证明一个文法是二义性的，只需给出一个反例\n\
    - 如果我们能控制文法的二义性，即使用附加条件，那么二义性的存在并非那么糟糕\n\n## 第3章 词法分析\n\n### 第0节 实现词法分析器的方法\n\n\
    **1、简单方法**\n\n- 构造一个描述源语言记号结构的图，然后手动将该图转换为用于查找记号的程序\n\n注：以这种方式可以生成高效的词法分析器\n\n\
    **2、模式驱动编程方法**\n\n- 模式匹配技术\n- 指定并设计程序，使其执行由字符串中的模式触发的动作\n- 引入一种称为 Lex 的模式-动作语言，用于指定词法分析器\n\
    \    - 模式由正则表达式指定\n    - Lex 的编译器可以为正则表达式生成高效的有穷自动机识别器\n\n### 第1节 词法分析器的作用\n\n\
    编译器的第一个阶段。\n\n**1、主要任务**\n\n- 读取输入字符\n- 产生供语法分析器进行语法分析所用的记号序列\n- 作为语法分析器的辅助者\n\
    \n**2、词法分析器与语法分析器的交互**\n\n![](img/353f619caa6c5715591f2105bdfa2865_78_0.png)\n\
    \n**3、词法分析器中的处理过程**\n\n- 扫描\n    - 预处理\n        - 剔除注释和空白\n        - 宏功能\n   \
    \ - 将编译器的错误信息与源程序相关联\n        - 错误信息可以与行号关联\n    - 词法分析\n\n**4、词法分析器的术语**\n\n\
    - 记号（Token）\n    - 源程序中单词的类型\n    - 关键字、运算符、标识符、常量、字符串字面量、标点符号（如逗号、分号）\n- 词素（Lexeme）\n\
