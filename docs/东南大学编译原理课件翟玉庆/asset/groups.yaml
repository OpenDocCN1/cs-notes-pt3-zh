  md: "\n## CHAPTER 4 Syntax ANALYSIS\n### Section 0 Approaches to implement a Syntax\
    \ analyzer\n\n2、 Why a grammar is usually used to describe the syntax of a programming\
    \ language?\n- A properly designed grammar imparts a structure to a programming\
    \ language that is useful for the translation of source programs into correct\
    \ object code and for the detection of errors\n- The evolved constructs can be\
    \ added to a language more easily\n\n3、 Approaches to implement a syntax analyzer\n\
    - Manual construction\n- Construction by tools\n\n### Section 1 The Role of the\
    \ Parser\n#### 1、 Main task\n- Obtain a string of tokens from the lexical analyzer\n\
    - Verify that the string can be generated by the grammar of related programming\
    \ language\n- Report any syntax errors in an intelligible fashion\n- Recover from\
    \ commonly occurring errors so that it can continue processing the remainder of\
    \ its input\n\n#### 2. Position of parser in compiler model\n\nNotes: Parser is\
    \ the core of the compiler\n\n![](img/353f619caa6c5715591f2105bdfa2865_168_0.png)\n\
    \n#### 3、Parsing methods\n- Universal parsing method\n  - Too inefficient to use\
    \ in production compilers\n- TOP-DOWN method\n  - Build parse trees from the top(root)\
    \ to the bottom(leaves)\n  - The input is scanned from left to right\n  - LL(1)\
    \ grammars (often implemented by hand)\n- BOTTOM-UP method\n  - Start from the\
    \ leaves and work up to the root\n  - The input is scanned from left to right\n\
    \  - LR grammars(often constructed by automated tools)\n\n#### 4、 Syntax Error\
    \ handling\n##### 1) Error levels\n- Lexical, such as misspelling an identifier,\
    \ keyword, or operator\n- Syntactic, such as an arithmetic expression with unbalanced\
    \ parentheses\n- Semantic, such as an operator applied to an incompatible operand\n\
    - Logical, such as an infinitely recursive call\n\n##### 2) Simple-to-state goals\
    \ of the error handler\n- It should report the presence of errors clearly and\
    \ accurately\n- It should recover from each error quickly enough to be able to\
    \ detect subsequent errors\n- It should not significantly slow down the processing\
    \ of correct programs\n\n##### 3) Error-recovery strategies\n- Error productions\n\
    \  - Augment the grammar for the language at hand with productions that generate\
    \ the erroneous constructs\n- Global correction\n\n### Section 2 TOP-DOWN PARSING\n\
    #### 1、Ideas of top-down parsing\n- Find a leftmost derivation for an input string\n\
    - Construct a parse tree for the input starting from the root and creating the\
    \ nodes of the parse tree in preorder.\n\n#### 2、 Main methods\n- Predictive parsing\
    \ (no backtracking)\n- Recursive descent (involve backtracking)\n\nNotes: Backtracking\
    \ is rarely needed to parse programming language constructs because backtracking\
    \ is still not very efficient, and tabular methods are preferred\n\n#### 3、Recursive\
    \ descent\n- A deducing procedure, which construct a parse tree for the string\
    \ top-down from S. When there is any mismatch, the program go back to the nearest\
    \ non-terminal, select another production to construct the parse tree\n- If you\
    \ produce a parse tree at last, then the parsing is success, otherwise, fail.\n\
    \nE.g. Consider the grammar\n\n```\nS → cAd\nA → ab | a\n```\n\nConstruct a parse\
    \ tree for the string “*cad*”\n"
  mdcn: "\n\n## CHAPTER 4 语法分析\n### Section 0 实现语法分析器的途径\n\n2、 为什么通常使用文法来描述编程语言的语法？\n\
    - 一个设计良好的文法为编程语言赋予了结构，这对于将源程序翻译成正确的目标代码以及检测错误非常有用\n- 进化的构造可以更容易地添加到语言中\n\n3、 实现语法分析器的途径\n\
    - 手工构造\n- 由工具构造\n\n### Section 1 分析器的作用\n#### 1、 主要任务\n- 从词法分析器获取一组标记\n- 验证该字符串能否由相关编程语言的文法生成\n\
    - 以易于理解的方式报告任何语法错误\n- 从常见错误中恢复，以便继续处理其余输入\n\n#### 2. 分析器在编译器模型中的位置\n\nNotes: 分析器是编译器的核心\n\
    \n![](img/353f619caa6c5715591f2105bdfa2865_168_0.png)\n\n#### 3、 解析方法\n- 通用解析方法\n\
    \  - 在生产编译器中使用效率太低\n- 自顶向下方法\n  - 从顶部（根）到底部（叶子）构建分析树\n  - 输入从左到右扫描\n  - LL(1)\
    \ 文法（通常手工实现）\n- 自底向上方法\n  - 从叶子开始向上工作到根\n  - 输入从左到右扫描\n  - LR 文法（通常由自动化工具构造）\n\
    \n#### 4、 语法错误处理\n##### 1) 错误级别\n- 词法，例如拼写错误标识符、关键字或运算符\n- 语法，例如算术表达式中括号不平衡\n\
    - 语义，例如运算符应用于不兼容的操作数\n- 逻辑，例如无限递归调用\n\n##### 2) 错误处理器的简单陈述目标\n- 它应清晰准确地报告错误的出现\n\
    - 它应足够快速地从每个错误中恢复，以便能够检测后续错误\n- 它不应显著减慢正确程序的处理速度\n\n##### 3) 错误恢复策略\n- 错误产生式\n\
    \  - 用产生式扩充所处理语言的文法，这些产生式生成错误的构造\n- 全局校正\n\n### Section 2 自顶向下解析\n#### 1、 自顶向下解析的思路\n\
    - 为输入字符串找到一个最左推导\n- 从根开始为输入构造分析树，并以先序方式创建分析树的节点。\n\n#### 2、 主要方法\n- 预测解析（无回溯）\n\
    - 递归下降（涉及回溯）\n\nNotes: 回溯很少需要来解析编程语言构造，因为回溯仍然效率不高，且表驱动方法更受青睐\n\n#### 3、 递归下降\n\
    - 一个推导过程，从 S 顶向下构造字符串的分析树。当出现不匹配时，程序返回到最近的非终结符，选择另一个产生式来构造分析树\n- 如果最后产生了一个分析树，则解析成功，否则失败。\n\
    \nE.g. Consider the grammar\n\n```\nS → cAd\nA → ab | a\n```\n\nConstruct a parse\
    \ tree for the string “*cad*”\n\n"
