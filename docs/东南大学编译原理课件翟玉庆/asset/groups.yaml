  md: "\n## Chapter 9 Code optimization\n\n### Section 0 Overview\n\n**1. Position\
    \ of code optimizer**\n\n![](img/353f619caa6c5715591f2105bdfa2865_549_0.png)\n\
    \n**2. Purpose of code optimizer**\n\n- to get better efficiency\n  - Run faster\n\
    \  - Take less space\n\n**3. Places for potential improvements by the user and\
    \ the compiler**\n\n- Source code\n  - User can profile program, change algorithm\
    \ or transform loops.\n- Intermediate code\n  - Compiler can improve loops, procedure\
    \ calls or address calculations.\n- Target code\n  - Compiler can use registers,\
    \ select instructions or do peephole transformations.\n\n**4. An organization\
    \ for an optimizing compiler**\n\n- 1) We assume that the intermediate code consists\
    \ of three-address statements.\n- 2) Organization of the code optimizer:\n\n![](img/353f619caa6c5715591f2105bdfa2865_551_0.png)\n\
    \n**5. Control-flow analysis**\n\n- Identify blocks and loops in the flow graph\
    \ of a program.\n\n**6. Data-flow analysis**\n\n- Collect information about the\
    \ program as a whole and to distribute this information to each block in the flow\
    \ graph.\n\n### Section 1 Basic Blocks and flow graphs\n\n**1. Flow graph**\n\n\
    - A directed graph that is composed of the set of basic blocks making up a program.\n\
    \n**2. Basic blocks**\n\n- A sequence of consecutive statements in which flow\
    \ of control enters at the beginning and leaves at the end without halt or possibility\
    \ of branching except at the end.\n\nE.g., this is a basic block:\n\n```\nT1=a*a\n\
    T2=a*b\nT3=2*T2\nT4=T1+T3\nT5=b*b\nT6=T4+T5\n```\n\n**Notes:** A name in a basic\
    \ block is said to be live at a given point if its value is used after that point\
    \ in the program, perhaps in another basic block.\n\n**3. Partition into basic\
    \ blocks**\n\n- **Input.** A sequence of three-address statements.\n- **Output.**\
    \ A list of basic blocks with each three-address statement in exactly one block.\n\
    - **Method.**\n\n- 1) We first determine the set of leaders, the first statements\
    \ of basic blocks. The rules we use are the following:\n  - (1) The first statement\
    \ is a leader.\n  - (2) Any statement that is the target of a conditional or unconditional\
    \ goto is a leader.\n  - (3) Any statement that immediately follows a goto or\
    \ conditional goto statement is a leader.\n- 2) For each leader, its basic block\
    \ consists of the leader and all statements up to but not including the next leader\
    \ or the end of the program.\n\nExample:\n\n```\nbegin\n    read X;\n    read\
    \ Y;\n    while (X mod Y <> 0)\n    do\n        begin\n            T:=X mod Y;\n\
    \            X:=Y;\n            Y:=T\n        end;\n    write Y\nend\n```\n\n\
    - (1) Read X\n- (2) Read Y\n- (3) T1:=X mod Y\n- (4) If T1<>0 goto (6)\n- (5)\
    \ goto (10)\n- (6) T:=X mod Y\n- (7) X:=Y\n- (8) Y:=T\n- (9) goto (3)\n- (10)\
    \ write Y\n- (11) halt\n\n![](img/353f619caa6c5715591f2105bdfa2865_560_0.png)\n\
    \n### Section 2 Optimization of basic blocks\n\n**1. Function-preserving transformations**\n\
    \n**1) Methods**\n\n- Constant folding\n  - The evaluation at compile-time of\
    \ expressions whose operands are known to be constant.\n- Common sub-expression\
    \ elimination\n- Copy propagation\n- Dead-code elimination\n\n**2) Constant folding\
    \ & Common sub-expression elimination**\n\n- An expression E is called a common\
    \ sub-expression if an expression E was previously computed, and the values of\
    \ variables in E have not changed since the previous computation.\n\n**Notes:**\
    \ We can avoid re-computing the expression if we can use the previously computed\
    \ value.\n"
  mdcn: "\n\n## 第9章 代码优化\n\n### 第0节 概述\n\n**1. 代码优化器的位置**\n\n![](img/353f619caa6c5715591f2105bdfa2865_549_0.png)\n\
    \n**2. 代码优化器的目的**\n\n- 获得更高的效率\n  - 运行更快\n  - 占用更少空间\n\n**3. 用户和编译器可进行潜在改进的位置**\n\
    \n- 源代码\n  - 用户可以对程序进行性能分析、更改算法或转换循环。\n- 中间代码\n  - 编译器可以改进循环、过程调用或地址计算。\n- 目标代码\n\
    \  - 编译器可以使用寄存器、选择指令或进行窥孔变换。\n\n**4. 优化编译器的组织结构**\n\n- 1) 我们假设中间代码由三地址语句组成。\n\
    - 2) 代码优化器的组织结构：\n\n![](img/353f619caa6c5715591f2105bdfa2865_551_0.png)\n\n**5.\
    \ 控制流分析**\n\n- 识别程序流程图中的基本块和循环。\n\n**6. 数据流分析**\n\n- 收集关于整个程序的信息，并将这些信息分发到流程图中的每个基本块。\n\
    \n### 第1节 基本块与流程图\n\n**1. 流程图**\n\n- 一种有向图，由构成程序的各个基本块集合组成。\n\n**2. 基本块**\n\n\
    - 一段连续语句序列，控制流在其开头进入，并在其结尾离开，除结尾外不会停止或产生分支。\n\n例如，以下是一个基本块：\n\n```\nT1=a*a\nT2=a*b\n\
    T3=2*T2\nT4=T1+T3\nT5=b*b\nT6=T4+T5\n```\n\n**注意：** 如果基本块中某个名字的值在程序中的该点之后（可能是在另一个基本块中）被使用，则称该名字在该点处是活跃的。\n\
    \n**3. 划分基本块**\n\n- **输入**：三地址语句序列。\n- **输出**：一系列基本块，每条三地址语句恰好位于一个基本块中。\n- **方法**。\n\
    \n- 1) 我们首先确定首语句（leaders）的集合，即基本块的第一条语句。我们使用的规则如下：\n  - (1) 第一条语句是首语句。\n  - (2)\
    \ 任何作为条件或无条件 goto 跳转目标的语句是首语句。\n  - (3) 任何紧跟在 goto 或条件 goto 语句之后的语句是首语句。\n- 2)\
    \ 对于每个首语句，其基本块由该首语句以及直到（但不包括）下一个首语句或程序结束之前的所有语句组成。\n\n示例：\n\n```\nbegin\n    read\
    \ X;\n    read Y;\n    while (X mod Y <> 0)\n    do\n        begin\n         \
    \   T:=X mod Y;\n            X:=Y;\n            Y:=T\n        end;\n    write\
    \ Y\nend\n```\n\n- (1) Read X\n- (2) Read Y\n- (3) T1:=X mod Y\n- (4) If T1<>0\
    \ goto (6)\n- (5) goto (10)\n- (6) T:=X mod Y\n- (7) X:=Y\n- (8) Y:=T\n- (9) goto\
    \ (3)\n- (10) write Y\n- (11) halt\n\n![](img/353f619caa6c5715591f2105bdfa2865_560_0.png)\n\
    \n### 第2节 基本块的优化\n\n**1. 保持功能的变换**\n\n**1) 方法**\n\n- 常量折叠\n  - 在编译时对操作数已知为常量的表达式进行求值。\n\
    - 公共子表达式消除\n- 复制传播\n- 死代码消除\n\n**2) 常量折叠与公共子表达式消除**\n\n- 如果表达式 E 之前已经被计算过，并且 E\
    \ 中变量的值自上次计算以来没有改变，则称表达式 E 为公共子表达式。\n\n**注意：** 如果我们能使用之前计算得到的值，就可以避免重新计算该表达式。\n\
    \n"
