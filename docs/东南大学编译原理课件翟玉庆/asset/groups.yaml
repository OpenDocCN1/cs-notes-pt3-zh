    ### Section 0 Overview

    ### 1.Position of Intermediate code generator

    ![](img/353f619caa6c5715591f2105bdfa2865_470_0.png)


    ### 2.Benefits for using a machine-independent intermediate form

    - Retargeting is facilitated

    - A machine-independent code optimizer can be applied to the intermediate representation.


    ### 3.Implementation of Intermediate code generator

    - Syntax-directed translation, folded into parsing

    - Top-down parsing

    - Bottom-up parsing


    ## Chapter 8 Intermediate code generation

    ### Section 1 Intermediate languages

    ### 1.Intermediate representations

    - Syntax tree (Graphical representation of statements)

    - Abstract Syntax Tree

    - Parsing Tree

    - Directed acyclic graph(DAG)

    - Postfix notation

    - Three-address code

    - Quadruple


    ### 2. Three-address code(TAC)

    A sequence of statements of the general form x= y op z

    - Notes: 1) Here, x,y,z are names, constants, or compiler-generated temporaries;
    op stands for any operator

    - 2) There is only one operator on the right side of a statement

    - 3) Three address code is a linearized representation of a syntax tree or a DAG
    in which explicit names correspond to the interior nodes of the graph

    - 4) Each three-address code statement contains three addresses, two for the operands
    and one for the result


    ### 3. Types of TAC

    - X=y op z

    - X=op y

    - X=y

    - goto L

    - If x relop y goto L

