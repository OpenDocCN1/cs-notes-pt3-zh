    \ then return(N)\n    else return (N*F(N-1));\nbegin\n    read(A);      /*Let\
    \ A=5*/\n    B:=F(A);\n    write (B);\nend.\n```\n\n```\n(1) Program sort(input,output);\n\
    (2)   Var a:array[0..10] of integer;\n(3)     x:integer;\n(4) Procedure readarray;\n\
