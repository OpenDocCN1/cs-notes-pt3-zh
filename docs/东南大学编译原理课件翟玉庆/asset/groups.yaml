  mdcn: "\n\n## 第9章 代码优化\n\n### 第4节 数据流分析\n\n```\nfor each block B do {\n    IN[B]\
    \ = ∅;\n    OUT[B] = GEN[B];\n}\nchange = true;\nwhile change do {\n    change\
    \ = false;\n    for each block B do {\n        IN[B] = ⋃_{P ∈ pred(B)} OUT[P];\n\
    \        oldout = OUT[B];\n        OUT[B] = IN[B] - KILL[B] ∪ GEN[B];\n      \
    \  if OUT[B] != oldout\n            change = true;\n    }\n}\n```\n\n### 5. 活跃变量分析\n\
    \n- 在活跃变量分析中，我们希望知道对于变量 x 和点 p，x 在 p 处的值是否会沿着从 p 开始的流图中的某条路径被使用。\n- 如果是，则称 x 在\
    \ p 处活跃；否则称 x 在 p 处死亡。\n\nL.IN[B] = (L.OUT[B] - L.DEF[B]) ∪ L.USE[B]\n\nL.OUT[B]\
    \ = ⋃_{S ∈ succ(B)} L.IN[S]\n\nsucc(B) 是 B 的后继基本块的集合。\n\n### 6. 活跃变量算法\n\n- 输入。一个流图，其中每个基本块的\
    \ L.DEF 和 L.USE 均已计算。\n- 输出。L.OUT[B]，即流图中每个基本块 B 出口处活跃的变量集合。\n- 方法。\n\n```\nfor\
    \ each block B do {\n    L.OUT[B] = ∅;\n    L.IN[B] = L.USE[B];\n}\nchange = true;\n\
    while change do {\n    change = false;\n    for each block B do {\n        L.OUT[B]\
    \ = ⋃_{S ∈ succ(B)} L.IN[S];\n        oldin = L.IN[B];\n        L.IN[B] = (L.OUT[B]\
    \ - L.DEF[B]) ∪ L.USE[B];\n        if L.IN[B] != oldin\n            change = true;\n\
    \    }\n}\n```\n\n### 7. 定义-使用链\n\n- 如果在语句 s 处可能需要变量的右值，则称该变量在 s 处被使用。\n- du-链问题是要计算在点\
    \ p 处某个变量（例如 x）的使用点 s 的集合，使得从 p 到 s 存在一条不重新定义 x 的路径。\n\n## 实验说明\n\n### 任务\n\n\
    Lab1: 词法分析器编程\nLab2: 语法分析器编程\n\n注意事项:\n1. 编程语言不限（最好是 C 或 Java）。\n2. 你可以采用建议的可选方法中的任意一种来完成实验。\n\
    3. 词法和语法定义的复杂度由你自己决定。\n\n### Lab1 要求\n\n1. 输入\n   - 字符流\n   - REs（数量由你自己决定）\n\
    2. 输出\n   - 记号序列\n3. 单词类别由你自己定义\n4. 可包含错误处理\n\n### Lab1 可选实现方法\n\n1. 模拟 2.6.5\
    \ 节中的程序\n2. 基于 FA 编程\n   - a. 自己定义一些 REs\n   - b. 将 REs 转换为 NFAs\n   - c. 将这些\
    \ NFAs 合并为单个 NFA\n   - d. 将 NFA 转换为具有最少状态的 DFA\n   - e. 基于 DFA 编程\n3. 基于你自己的 Lex\
    \ 生成程序\n   - a. 设计你自己的 Lex\n      - i. 定义 .l 文件\n      - ii. 编程实现你自己的 Lex\n  \
    \ - b. 基于你自己的 Lex 生成程序\n\n### Lab2 要求\n\n1. 输入\n   - 字符流\n   - CFG（某些句子类别的 CFG\
    \ 的组合）\n2. 输出\n   - 若使用自顶向下的语法分析方法，则为推导序列。\n   - 若使用自底向上的语法分析方法，则为归约序列。\n3. 句子类别由你自己定义\n\
    4. 可包含错误处理\n\n### Lab2 可选实现方法\n\n1. 递归下降分析\n   - 非终结符与一个函数/子程序相对应\n2. LL(1)\n\
    \   - a. 基于 CFG 构造 LL(1) 分析表\n   - b. 使用 LL(1) 分析表设计程序\n3. LR(1)\n   - a. 基于 CFG\
    \ 构造 LR(1) 分析表\n   - b. 使用 LR(1) 分析表设计程序\n\n## 实验文档要求\n\n1. 实验报告\n   - a. 动机/目标\n\
