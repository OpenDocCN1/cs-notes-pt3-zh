    ## 第7章 运行时环境

    ### 第3节 参数传递

    ### 1.参数传递方法

    - 传值调用

    - 传引用调用

    - 拷贝-恢复

    - 传名调用


    ### 2.传值调用

    1) 在 C 和 Pascal 中

    2)实现

    - 形式参数被当作局部名字处理，因此形式参数的存储位于被调用过程的激活记录中。

    - 调用者计算实际参数并将其 r 值放入形式参数的存储中。


    ### 3.传引用调用

    - 1) 又称传地址调用或传位置调用。

    - 2) 实现

    - 如果实际参数是一个名字或具有 l 值的表达式，则该 l 值本身被传递。

    - 如果实际参数是一个没有 l 值的表达式，则该表达式在新位置求值，并传递该位置的地址。


    ### 5.传名调用

    传统上由 Algol 的拷贝规则定义


    它就像宏展开或内联展开一样


    ## 第7章 运行时环境

    ### 第4节 符号表

    ### 1.符号表的功能

    - 跟踪名字的作用域和绑定信息

    - 允许我们高效地添加新条目并查找现有条目


    Notes: 1)如果发现新名字或现有名字的新的信息，表就会发生变化

    - 2)表可以是线性列表或哈希表

    - 3)对于编译器来说，能够在编译时根据需要动态增长符号表是有用的


    ### 2. 符号表条目

    - 符号表中的每个条目都是对一个名字的声明

    - 每个条目可以实现为由连续的内存字组成的记录


    Notes:

    1) 信息可能在不同时间进入符号表

    2) 名字的属性是响应声明而输入的


    ## 第8章 中间代码生成

    ### 第0节 概述

    ### 1.中间代码生成器的位置

    ![](img/353f619caa6c5715591f2105bdfa2865_470_0.png)


    ### 2.使用机器无关中间形式的益处

    - 便于重新定位

    - 机器无关的代码优化器可以应用于中间表示。


    ### 3.中间代码生成器的实现

    - 语法制导翻译，折入解析

    - 自顶向下解析

    - 自底向上解析


    ## 第8章 中间代码生成

    ### 第1节 中间语言

    ### 1.中间表示

    - 语法树（语句的图形表示）

    - 抽象语法树

    - 解析树

    - 有向无环图(DAG)

    - 后缀记法

    - 三地址码

    - 四元式


    ### 2. 三地址码(TAC)

    一般形式为 x= y op z 的语句序列

    - Notes: 1) 这里，x,y,z 是名字、常量或编译器生成的临时变量；op 代表任意操作符

    - 2) 语句右边只有一个操作符

    - 3) 三地址码是语法树或 DAG 的线性化表示，其中显式名字对应于图的内部节点

    - 4) 每个三地址码语句包含三个地址，两个用于操作数，一个用于结果


    ### 3. TAC 的类型

    - X=y op z

    - X=op y

    - X=y

    - goto L

    - If x relop y goto L

    - param x

    call p,n

    return y


