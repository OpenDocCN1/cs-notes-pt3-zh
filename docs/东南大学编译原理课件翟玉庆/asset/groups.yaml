    \n### 第6节 FA 到正则表达式\n\n**1. 基本思想**\n\n通过合并状态来减少状态数。\n\n**2. 算法**\n\n- 输入：一个 FA\
    \ *M*。\n- 输出：字母表 Σ 上的正则表达式 *r*，它识别与 FA *M* 相同的语言。\n\n**方法**\n\n- 扩展 FA 的概念，并让箭头被正则表达式标记。\n\
    - 向 FA *M* 添加两个节点 x, y，并得到识别相同正则语言的 *M′*。\n\n![](img/353f619caa6c5715591f2105bdfa2865_139_0.png)\n\
    \n- 使用以下规则归纳地组合 FA 中的正则表达式，并得到 FA 的整个表达式。\n\n![](img/353f619caa6c5715591f2105bdfa2865_140_0.png)\n\
    \n![](img/353f619caa6c5715591f2105bdfa2865_142_0.png)\n\n### 第7节 正则文法到 NFA\n\n\
    **1. 基本性质**\n\n- 对于每个正则文法 G=(V_N, V_T, P, S)，存在一个 FA M=(Q, Σ, f, q₀, Z)，且 L(G)=L(M)。\n\
    - 对于每个 FA M，存在一个右线性文法和一个左线性文法来识别相同的语言。L(M)=L(G_R)=L(G_L)。\n\n**2. 右线性文法到 FA**\n\
    \n- 输入：G=(V_N, V_T, P, S)。\n- 输出：FA M=(Q, Σ, move, q₀, Z)。\n- 方法：\n  - 将 G 中的每个非终结符视为一个状态，并添加一个新状态\
    \ T 作为接受状态。\n  - 令 Q=V_N ∪ {T}, Σ=V_T, q₀=S；如果存在产生式 S→ε，则 Z={S,T}，否则 Z={T}。\n\
    \  - 对于每个产生式，构造函数 move。\n    - a) 对于类似 A₁ → aA₂ 的产生式，构造 move(A₁, a)=A₂。\n    -\
    \ b) 对于类似 A₁ → a 的产生式，构造 move(A₁, a)=T。\n    - c) 对于 Σ 中的每个 a，move(T, a)=∅；这意味着接受状态不识别任何终结符。\n\
    \n**例如。** 一个正则文法 G=({S,A,B},{a,b,c},P,S)\n\n```\nP: S → aS | aB\n   B → bB | bA\n\
    \   A → cA | c\n```\n\n为文法 G 构造一个 FA。\n\n**答案：** 令 M=(Q, Σ, f, q₀, Z)。\n\n1. 添加一个状态\
    \ T，所以 Q={S,B,A,T}；Σ={a,b,c}；q₀=S；Z={T}。\n2. f：\n\n|  |  |\n|---|---|\n| f(S,a)=S\
    \ | f(S,a)=B |\n| f(B,b)=B | f(B,b)=A |\n| f(A,c)=A | f(A,c)=T |\n\n![](img/353f619caa6c5715591f2105bdfa2865_147_0.png)\n\
    \n**3. FA 到右线性文法**\n\n- 输入：M=(S, Σ, f, s₀, Z)。\n- 输出：RG=(V_N, V_T, P, s₀)。\n-\
    \ 方法：\n  - 如果 s₀ ∉ Z，则产生式为：\n    - a) 对于 M 中映射 f(Aᵢ, a)=Aⱼ，存在产生式 Aᵢ → aAⱼ。\n \
    \   - b) 如果 Aⱼ ∈ Z，则添加一个新的产生式 Aᵢ → a；然后我们得到 Aᵢ → a | aAⱼ。\n  - 如果 s₀ ∈ Z，则除了基于前一条规则得到的产生式外，我们还会得到以下产生式：\n\
    \    - 对于映射 f(s₀, ε)=s₀，构造新的产生式，s₀′ → ε | s₀，且 s₀′ 是新的起始状态。\n\n"
