  md: "\n## Chapter 9 Code optimization\n\n### Section 2 Optimization of basic blocks\n\
    \n#### 1. Function-preserving transformations\n\ne.g. A source code\n\n```text\n\
    Pi:=3.14\nA:=2*Pi*(R+r);\nB:=A;\nB:=2*Pi*(R+r)*(R-r)\n```\n\n```text\n(1) Pi:=3.14\n\
    (2) T1:=2*Pi\n(3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=2*Pi\n(7) T4:=R+r\n\
    (8) T5:=T3*T4\n(9) T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n\
    (3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=6.28\n(7) T4:=R+r\n(8) T5:=T3*T4\n\
    (9) T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n\
    (4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T3*T4\n(9) T6:=R-r\n(10)\
    \ B:=T5*T6\n```\n\n##### 3) Copy Propagation\n\n- One concerns assignments of\
    \ the form `f:=g` called copy statements.\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n\
    (3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T3*T4\n(9)\
    \ T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n\
    (4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T1*T2\n(9) T6:=R-r\n(10)\
    \ B:=T5*T6\n```\n\n##### 4) Dead-code elimination\n\n- A variable is live at a\
    \ point in a program if its value can be used subsequently; otherwise it is dead\
    \ at that point.\n\nNotes: A related idea is dead or useless code, statements\
    \ that compute values that never get used.\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n\
    (3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T1*T2\n(9)\
    \ T6:=R-r\n(10) B:=T5*T6\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_568_0.png)\n\
    \n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n(4) A:=T1*T2\n(8) T5:=T1*T2\n\
    (9) T6:=R-r\n(10) B:=T5*T6\n```\n\n#### 2. DAG\n\n- There is a node in the DAG\
    \ for each of the initial values of the variables appearing in the basic block.\n\
    - There is a node n associated with each statement s within the block.\n- The\
    \ children of n are those nodes corresponding to statements that are the last\
    \ definitions prior to s of the operands used by s.\n- Node n is labeled by the\
    \ operator applied at s, and also attached to n is the list of variables for which\
    \ it is the last definition within the block.\n\n![](img/353f619caa6c5715591f2105bdfa2865_571_0.png)\n\
    \ne.g.\n\n```text\nA:=B+C\nB:=2*A\nD:=A\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_572_0.png)\n\
    \ne.g.\n\n```text\n(1) T0:=3.14    (2) T1:=2*T0    (3) T2:=R+r\n(4) A:=T1*T2 \
    \   (5) B:=A        (6) T3:=2*T0\n(7) T4:=R+r     (8) T5:=T3*T4   (9) T6:=R-r\n\
    (10) B:=T5*T6\n```\n\n#### 3. Generating code from DAGs\n\n- Rearranging the order\
    \ (Heuristic Order)\n\n![](img/353f619caa6c5715591f2105bdfa2865_575_0.png)\n\n\
    ```text\nT1=a+b\nT2=c+d\nT3=e-T2\nT4=T1-T3\n```\n\n```text\nT2=c+d\nT3=e-T2\n\
    T1=a+b\nT4=T1-T3\n```\n\n- Heuristic Order\n\n```text\nwhile (unlisted interior\
    \ nodes remain) {\n    select an unlisted node n, all of whose parents\n    have\
    \ been listed;\n    list n;\n\n    while (the leftmost child m of n has no\n \
    \         unlisted parents and is not a leaf) {\n        list m; n=m\n    }\n\
    }\n```\n\n### Peephole Optimization\n\n- Peephole optimization examines a short\
    \ sequence of instructions, the peephole, replacing those by more efficient ones,\
    \ possibly enabling further optimization.\n\n- Some compilers generate code without\
    \ algebraic simplification and then offer (optional) peephole optimization.\n\n\
    - Peephole optimization can remove some redundant loads and stores:\n\n  ```text\n\
    \  x := e;              STW Rₑ,x,0       (* assuming e is in Rₑ *)\n  y := x +\
    \ 2           LDW Rₓ,x,0       (* x is now in Rₓ *)\n  ```\n\n- Peephole optimization\
    \ can also be used to eliminate jumps to jumps:\n\n  ```text\n  IF a THEN\n  \
    \    IF b THEN S ELSE T END\n  ELSE U\n  END\n  ```\n"
  mdcn: "\n\n## 第9章 代码优化\n\n### 第2节 基本块的优化\n\n#### 1. 保持函数的变换\n\ne.g. 源代码\n\n```text\n\
    Pi:=3.14\nA:=2*Pi*(R+r);\nB:=A;\nB:=2*Pi*(R+r)*(R-r)\n```\n\n```text\n(1) Pi:=3.14\n\
    (2) T1:=2*Pi\n(3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=2*Pi\n(7) T4:=R+r\n\
    (8) T5:=T3*T4\n(9) T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n\
    (3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=6.28\n(7) T4:=R+r\n(8) T5:=T3*T4\n\
    (9) T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n\
    (4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T3*T4\n(9) T6:=R-r\n(10)\
    \ B:=T5*T6\n```\n\n##### 3) 复制传播\n\n- 我们关注形如 `f:=g` 的赋值，称为复制语句。\n\n```text\n(1)\
    \ Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7)\
    \ T4:=T2\n(8) T5:=T3*T4\n(9) T6:=R-r\n(10) B:=T5*T6\n```\n\n```text\n(1) Pi:=3.14\n\
    (2) T1:=6.28\n(3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8)\
    \ T5:=T1*T2\n(9) T6:=R-r\n(10) B:=T5*T6\n```\n\n##### 4) 死代码消除\n\n- 如果一个变量的值在程序的某一点之后可能被使用，则称该变量在该点是活跃的；否则它在该点是死的。\n\
    \nNotes: 一个相关的概念是死代码或无用代码，即计算从未被使用的值的语句。\n\n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n\
    (3) T2:=R+r\n(4) A:=T1*T2\n(5) B:=A\n(6) T3:=T1\n(7) T4:=T2\n(8) T5:=T1*T2\n(9)\
    \ T6:=R-r\n(10) B:=T5*T6\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_568_0.png)\n\
    \n```text\n(1) Pi:=3.14\n(2) T1:=6.28\n(3) T2:=R+r\n(4) A:=T1*T2\n(8) T5:=T1*T2\n\
    (9) T6:=R-r\n(10) B:=T5*T6\n```\n\n#### 2. DAG\n\n- DAG 中为基本块中出现的每个变量的初始值都有一个节点。\n\
    - 块内每个语句 s 都有一个关联的节点 n。\n- n 的子节点是那些对应于 s 使用的操作数在 s 之前最后一次定义的语句的节点。\n- 节点 n 由\
    \ s 处应用的操作符标记，并且还附带了在块内它是最后一次定义的变量的列表。\n\n![](img/353f619caa6c5715591f2105bdfa2865_571_0.png)\n\
    \ne.g.\n\n```text\nA:=B+C\nB:=2*A\nD:=A\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_572_0.png)\n\
    \ne.g.\n\n```text\n(1) T0:=3.14    (2) T1:=2*T0    (3) T2:=R+r\n(4) A:=T1*T2 \
    \   (5) B:=A        (6) T3:=2*T0\n(7) T4:=R+r     (8) T5:=T3*T4   (9) T6:=R-r\n\
    (10) B:=T5*T6\n```\n\n#### 3. 从 DAG 生成代码\n\n- 重新排列顺序（启发式顺序）\n\n![](img/353f619caa6c5715591f2105bdfa2865_575_0.png)\n\
    \n```text\nT1=a+b\nT2=c+d\nT3=e-T2\nT4=T1-T3\n```\n\n```text\nT2=c+d\nT3=e-T2\n\
    T1=a+b\nT4=T1-T3\n```\n\n- 启发式顺序\n\n```text\nwhile (unlisted interior nodes remain)\
    \ {\n    select an unlisted node n, all of whose parents\n    have been listed;\n\
    \    list n;\n\n    while (the leftmost child m of n has no\n          unlisted\
    \ parents and is not a leaf) {\n        list m; n=m\n    }\n}\n```\n\n### 窥孔优化\n\
    \n- 窥孔优化检查一条短的指令序列，即窥孔，用更高效的指令替换它们，可能使进一步的优化成为可能。\n\n- 一些编译器生成代码而不进行代数化简，然后提供（可选的）窥孔优化。\n\
    \n- 窥孔优化可以删除一些冗余的加载和存储：\n\n  ```text\n  x := e;              STW Rₑ,x,0      \
    \ (* assuming e is in Rₑ *)\n  y := x + 2           LDW Rₓ,x,0       (* x is now\
    \ in Rₓ *)\n  ```\n\n- 窥孔优化也可以用来消除跳转到跳转：\n\n  ```text\n  IF a THEN\n      IF b\
    \ THEN S ELSE T END\n  ELSE U\n  END\n  ```\n\n"
