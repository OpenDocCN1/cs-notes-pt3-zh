    \n![](img/353f619caa6c5715591f2105bdfa2865_142_0.png)\n\n### Section 7 Regular\
    \ Grammar to an NFA\n\n**1. Basic Properties**\n\n- For each regular grammar G=(V_N,\
    \ V_T, P, S), there is an FA M=(Q, Σ, f, q₀, Z), and L(G)=L(M).\n- For each FA\
    \ M, there is a right-linear grammar and a left-linear grammar that recognize\
    \ the same language. L(M)=L(G_R)=L(G_L).\n\n**2. Right-Linear Grammar to an FA**\n\
    \n- Input: G=(V_N, V_T, P, S).\n- Output: FA M=(Q, Σ, move, q₀, Z).\n- Method:\n\
    \  - Consider each non-terminal symbol in G as a state, and add a new state T\
    \ as an accepting state.\n  - Let Q=V_N ∪ {T}, Σ=V_T, q₀=S; if there is the production\
    \ S→ε, then Z={S,T}, else Z={T}.\n  - For each production, construct the function\
    \ move.\n    - a) For productions similar to A₁ → aA₂, construct move(A₁, a)=A₂.\n\
    \    - b) For productions similar to A₁ → a, construct move(A₁, a)=T.\n    - c)\
    \ For each a in Σ, move(T, a)=∅; that means the accepting states do not recognize\
    \ any terminal symbol.\n\n**E.g.** A regular grammar G=({S,A,B},{a,b,c},P,S)\n\
    \n```\nP: S → aS | aB\n   B → bB | bA\n   A → cA | c\n```\n\nConstruct an FA for\
    \ the grammar G.\n\n**Answer:** Let M=(Q, Σ, f, q₀, Z).\n\n1. Add a state T, so\
    \ Q={S,B,A,T}; Σ={a,b,c}; q₀=S; Z={T}.\n2. f:\n\n|  |  |\n|---|---|\n| f(S,a)=S\
    \ | f(S,a)=B |\n| f(B,b)=B | f(B,b)=A |\n| f(A,c)=A | f(A,c)=T |\n\n![](img/353f619caa6c5715591f2105bdfa2865_147_0.png)\n\
    \n**3. FA to Right-Linear Grammar**\n\n- Input: M=(S, Σ, f, s₀, Z).\n- Output:\
    \ RG=(V_N, V_T, P, s₀).\n- Method:\n  - If s₀ ∉ Z, then the productions are:\n\
    \    - a) For the mapping f(Aᵢ, a)=Aⱼ in M, there is a production Aᵢ → aAⱼ.\n\
    \    - b) If Aⱼ ∈ Z, then add a new production Aᵢ → a; then we get Aᵢ → a | aAⱼ.\n\
    \  - If s₀ ∈ Z, then we will get the following productions besides the productions\
    \ we have gotten based on the former rule:\n    - For the mapping f(s₀, ε)=s₀,\
    \ construct new productions, s₀′ → ε | s₀, and s₀′ is the new starting state.\n"
  mdcn: "\n\n## 第三章 词法分析\n\n### 第5节 正则表达式到 NFA\n\n**2. 从正则表达式构造 NFA**\n\n**a) 算法**\n\
