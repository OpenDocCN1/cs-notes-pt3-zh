  mdcn: "\n\n## 第7章 运行时环境\n### 第0节 概述\n\n+ 2. 数据对象的分配与释放\n  - 由运行时支持包管理\n  - 数据对象的分配只是为与该过程中的名称相关的数据对象分配存储空间\n\
    \nNotes: 数据对象在运行时的表示由其类型决定。\n\n### 3. 激活树\n\n一棵用于描绘控制流进入和离开过程激活的树\n\n![](img/353f619caa6c5715591f2105bdfa2865_425_0.png)\n\
    \nEnter f(4)\nEnter f(3)\nEnter f(2)\nEnter f(1)\nLeave f(1)\nEnter f(0)\nLeave\
    \ f(0)\nLeave f(2)\nEnter f(1)\nLeave f(1)\nLeave f(3)\n\nEnter f(2)\nEnter f(1)\n\
    Leave f(1)\nEnter f(0)\nLeave f(0)\nLeave f(2)\nLeave f(4)\n\n### 4. 控制栈\n\n一个用于跟踪活动过程激活的栈\n\
    \n### 5. 名称的绑定\n\n当一个环境将存储位置 s 与名称 x 关联时，我们说 x 被绑定到 s；这种关联本身被称为 x 的绑定。\n\nNotes:\
    \ 1) 即使每个名称在程序中只声明一次，同一个名称在运行时也可能表示不同的对象\n2) “数据对象”对应于可以保存值的存储位置\n\nNotes: 3)\
    \ 在编程语言语义中，术语“环境”指的是将名称映射到存储位置的函数，而术语“状态”指的是将存储位置映射到其所保存的值的函数。\n\n![](img/353f619caa6c5715591f2105bdfa2865_428_0.png)\n\
    \n+ 4) 环境和状态是不同的；赋值会改变状态，但不会改变环境\n\n+ 5) 如果 x 不是基本类型，则 x 的存储 s 可能是一组内存字\n\n+ 6)\
    \ 绑定是声明的动态对应物\n\n## 第7章 运行时环境\n### 第1节 存储组织\n#### 2. 激活记录/帧\n\n+ 1) 定义\n\n存储单个过程执行所需信息的连续存储块\n\
    \n#### 2) 一个通用的激活记录\n\n| 返回值 |\n| 实际参数 |\n| 可选控制链接 |\n| 可选访问链接 |\n| 保存的机器状态 |\n\
    | 局部数据 |\n| 临时变量 |\n\n在一个栈帧（激活记录）中我们保存以下信息：\n\n+ 1) 动态链接：指向前一个栈帧的指针值，以便我们在退出该例程时重置栈顶。\n\
    + 2) 静态链接：在允许嵌套例程声明的语言中（如 Pascal 但不包括 C），则一个例程可能能够访问声明它的例程的变量。在静态链接中，我们保存当前指针被声明的栈帧的指针值。\n\
    + 3) 返回地址：执行完当前例程后返回的代码位置。\n+ 4) 传递给例程的参数值以及在例程中声明的局部变量。\n\n调用例程时发生以下情况：\n\n+\
    \ 1) 在栈顶设置新的栈帧\n+ 2) 将参数复制到新的栈帧\n+ 3) 将现有的栈指针保存在新帧的动态链接中\n+ 4) 根据需要设置静态链接\n+ 5)\
    \ 在新帧中保存返回地址\n+ 6) 将栈指针设置为新栈帧的基址（这允许访问栈帧中的所有变量）\n+ 7) 跳转到例程的代码\n\n返回时我们做相反的操作：\n\
    \n+ 1) 从栈帧中检索返回地址\n+ 2) 从动态链接恢复栈指针\n+ 3) 将例程的结果保存在恢复的栈帧中\n+ 4) 跳转到返回地址\n\n"
