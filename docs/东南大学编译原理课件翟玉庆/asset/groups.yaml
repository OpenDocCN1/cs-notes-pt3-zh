    \ for the language being parsed and the operator-precedence parser itself is tenuous,\
    \ one cannot always be sure the parser accepts exactly the desired language.\n\
    - Only a small class of grammars can be parsed using operator-precedence techniques.\n\
    \n### Section 5 LR parsers\n\n1、LR parser\n\n- An efficient, bottom-up syntax\
    \ analysis technique that can be used to parse a large class of context-free grammars\n\
    - LR(k)\n  - L: left-to-right scan\n  - R: construct a rightmost derivation in\
    \ reverse\n  - k: the number of input symbols of look ahead\n\n2、Advantages of\
    \ LR parser\n\n- It can recognize virtually all programming language constructs\
    \ for which context-free grammars can be written\n- It is the most general non\
    \ backtracking shift-reduce parsing method\n- It can parse more grammars than\
    \ predictive parsers can\n- It can detect a syntactic error as soon as it is possible\
    \ to do so on a left-to-right scan of the input\n\n4、 Three techniques for constructing\
    \ an LR parsing\n\n- SLR: simple LR\n- LR(1): canonical LR\n- LALR: look ahead\
    \ LR\n"
