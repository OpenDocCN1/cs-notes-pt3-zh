  md: "\n## CHAPTER 4 SYNTAX ANALYSIS\n\n### Section 5 LR parsers\n\n#### 5. The LR\
    \ Parsing Model\n\n**Note:**\n\n1. The driver program is the same for all LR parsers;\
    \ only the parsing table changes from one parser to another.\n2. The parsing program\
    \ reads characters from an input buffer one at a time.\n3. $S_i$ is a state; each\
    \ state symbol summarizes the information contained in the stack below it.\n4.\
    \ Each state symbol summarizes the information contained in the stack.\n5. The\
    \ current input symbol is used to index the parsing table and determine the shift-reduce\
    \ parsing decision.\n6. In an implementation, the grammar symbols need not appear\
    \ on the stack.\n\n#### 6. The Parsing Table\n\n- **Action**: a parsing action\
    \ function.\n  - $Action[S,a]$: S represents the state currently on top of the\
    \ stack, and a represents the current input symbol. So $Action[S,a]$ means the\
    \ parsing action for S and a.\n- **Shift**:\n  - The next input symbol is shifted\
    \ onto the top of the stack.\n  - Shift S, where S is a state.\n- **Reduce**:\n\
    \  - The parser knows the right end of the handle is at the top of the stack,\
    \ locates the left end of the handle within the stack, and decides what non-terminal\
    \ to replace the handle. Reduce by a grammar production $A \\to \\alpha$.\n- **Accept**:\n\
    \  - The parser announces successful completion of parsing.\n- **Error**:\n  -\
    \ The parser discovers that a syntax error has occurred and calls an error recovery\
    \ routine.\n- **Action conflict**:\n  - **Shift/reduce conflict**\n    - Cannot\
    \ decide whether to shift or to reduce.\n  - **Reduce/reduce conflict**\n    -\
    \ Cannot decide which of several reductions to make.\n\n**Note:** An ambiguous\
    \ grammar can cause conflicts and can never be LR, e.g., `If_stmt` syntax (`if\
    \ expr then stmt [else stmt]`).\n\n#### 7. The Algorithm\n\n- The next move of\
    \ the parser is determined by reading the current input symbol $a$ and the state\
    \ $S$ on top of the stack, and then consulting the parsing action table entry\
    \ $action[S,a]$.\n- If $action[S_m,a_i]=shift\\ S'$, the parser executes a shift\
    \ move, enters $S'$ into the stack, and the next input symbol $a_{i+1}$ becomes\
    \ the current symbol.\n- If $action[S_m,a_i]=reduce\\ A\\to\\alpha$, then the\
    \ parser executes a reduce move. If the length of $\\alpha$ is $\\gamma$, then\
    \ delete $\\gamma$ states from the stack, so that the state at the top of the\
    \ stack is $S_{m-\\gamma}$. Push the state $S'=GOTO[S_{m-\\gamma},A]$ and non-terminal\
    \ A into the stack. The input symbol does not change.\n- If $action[S_m,a_i]=accept$,\
    \ parsing is completed.\n- If $action[S_m,a_i]=error$, the parser has discovered\
    \ an error and calls an error recovery routine.\n\nE.g. the parsing action and\
    \ goto functions of an LR parsing table for the following grammar:\n\n$E \\to\
    \ E + T$  \n$E \\to T$  \n$T \\to T * F$  \n$T \\to F$  \n$F \\to (E)$  \n$F \\\
    to i$\n\n| state | i | + | * | ( | ) | $ | E | T | F |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 0 | S₅ |  |  | S₄ |  |  | 1 | 2 | 3 |\n| 1 |  | S₆ |  |  |  | accept |  |  |\
    \  |\n| 2 |  | r₂ | S₇ |  | r₂ | r₂ |  |  |  |\n| 3 |  | r₄ | r₄ |  | r₄ | r₄\
    \ |  |  |  |\n| 4 | S₅ |  |  | S₄ |  |  | 8 | 2 | 3 |\n| 5 |  | r₆ | r₆ |  | r₆\
    \ | r₆ |  |  |  |\n| 6 | S₅ |  |  | S₄ |  |  |  | 9 | 3 |\n| 7 | S₅ |  |  | S₄\
    \ |  |  |  |  | 10 |\n| 8 |  | S₆ |  |  | S₁₁ |  |  |  |  |\n| 9 |  | r₁ | S₇\
    \ |  | r₁ | r₁ |  |  |  |\n| 10 |  | r₃ | r₃ |  | r₃ | r₃ |  |  |  |\n| 11 | \
    \ | r₅ | r₅ |  | r₅ | r₅ |  |  |  |\n"
  mdcn: "\n\n## 第4章 语法分析\n\n### 第5节 LR 解析器\n\n#### 5. LR 解析模型\n\n**注意：**\n\n1. 所有\
    \ LR 解析器的驱动程序都相同；只有解析表会因解析器不同而变化。\n2. 解析程序一次从输入缓冲区读取一个字符。\n3. $S_i$ 是一个状态；每个状态符号概括了其下方栈中包含的信息。\n\
    4. 每个状态符号概括了栈中包含的信息。\n5. 当前输入符号用于索引解析表并确定移进-归约解析决策。\n6. 在实现中，文法符号不必出现在栈上。\n\n\
    #### 6. 解析表\n\n- **Action**: 一个解析动作函数。\n  - $Action[S,a]$: S 表示当前栈顶的状态，a 表示当前输入符号。所以\
    \ $Action[S,a]$ 表示 S 和 a 的解析动作。\n- **Shift**：\n  - 下一个输入符号被移进栈顶。\n  - 移进 S，其中\
    \ S 是一个状态。\n- **Reduce**：\n  - 解析器知道句柄的右端在栈顶，定位句柄在栈内的左端，并决定用哪个非终结符替换句柄。按文法产生式\
    \ $A \\to \\alpha$ 归约。\n- **Accept**：\n  - 解析器宣布解析成功完成。\n- **Error**：\n  - 解析器发现发生了语法错误并调用错误恢复例程。\n\
    - **Action conflict**：\n  - **Shift/reduce conflict**\n    - 无法决定是移进还是归约。\n  -\
    \ **Reduce/reduce conflict**\n    - 无法决定执行多个归约中的哪一个。\n\n**注意：** 一个二义性文法可能导致冲突并且永远不可能为\
    \ LR，例如 `If_stmt` 语法（`if expr then stmt [else stmt]`）。\n\n#### 7. 算法\n\n- 解析器的下一步移动由读取当前输入符号\
    \ $a$ 和栈顶的状态 $S$，然后查阅解析动作表项 $action[S,a]$ 来确定。\n- 如果 $action[S_m,a_i]=shift\\\
    \ S'$，解析器执行移进动作，将 $S'$ 压入栈中，下一个输入符号 $a_{i+1}$ 成为当前符号。\n- 如果 $action[S_m,a_i]=reduce\\\
    \ A\\to\\alpha$，则解析器执行归约动作。如果 $\\alpha$ 的长度为 $\\gamma$，则从栈中删除 $\\gamma$ 个状态，使得栈顶的状态为\
    \ $S_{m-\\gamma}$。将状态 $S'=GOTO[S_{m-\\gamma},A]$ 和非终结符 A 压入栈中。输入符号不变。\n- 如果 $action[S_m,a_i]=accept$，解析完成。\n\
    - 如果 $action[S_m,a_i]=error$，解析器发现了错误并调用错误恢复例程。\n\n例如，以下文法的 LR 解析表的解析动作和 goto\
    \ 函数：\n\n$E \\to E + T$  \n$E \\to T$  \n$T \\to T * F$  \n$T \\to F$  \n$F \\\
    to (E)$  \n$F \\to i$\n\n| state | i | + | * | ( | ) | $ | E | T | F |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 0 | S₅ |  |  | S₄ |  |  | 1 | 2 | 3 |\n| 1 |  | S₆ |  |  |  | accept |  |  |\
    \  |\n| 2 |  | r₂ | S₇ |  | r₂ | r₂ |  |  |  |\n| 3 |  | r₄ | r₄ |  | r₄ | r₄\
    \ |  |  |  |\n| 4 | S₅ |  |  | S₄ |  |  | 8 | 2 | 3 |\n| 5 |  | r₆ | r₆ |  | r₆\
    \ | r₆ |  |  |  |\n| 6 | S₅ |  |  | S₄ |  |  |  | 9 | 3 |\n| 7 | S₅ |  |  | S₄\
    \ |  |  |  |  | 10 |\n| 8 |  | S₆ |  |  | S₁₁ |  |  |  |  |\n| 9 |  | r₁ | S₇\
    \ |  | r₁ | r₁ |  |  |  |\n| 10 |  | r₃ | r₃ |  | r₃ | r₃ |  |  |  |\n| 11 | \
    \ | r₅ | r₅ |  | r₅ | r₅ |  |  |  |\n\n"
