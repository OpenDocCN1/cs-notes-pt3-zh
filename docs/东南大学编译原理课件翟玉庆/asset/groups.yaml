    ## Chapter 7 Runtime Environments

    ### Section 3 Parameter passing

    ### 1.Parameter-passing methods

    - Call-by-value

    - Call-by-reference

    - Copy-restore

    - Call-by-name


    ### 2.Call-by-value

    1) in C and Pascal

    2)implementation

    - A formal parameter is treated just like a local name, so the storage for the
    formals is in the activation record of the called procedure.

    - The caller evaluates the actual parameters and places their r-values in the
    storage for the formals.


    ### 3.Call-by-Reference

    - 1) also known as call-by-address or call-by-location.

    - 2) implementation

    - If an actual parameter is a name or an expression having an l-value, then that
    l-value itself is passed.

    - If the actual parameter is an expression that has no l-value, then the expression
    is evaluated in a new location, and the address of that location is passed.


    ### 5.Call-by-Name

    Traditionally defined by the copy-rule of Algol


    It is just as macro-expansion or in-line expansion


    ## Chapter 7 Runtime Environments

    ### Section 4 Symbol Tables

    ### 1.Functions of symbol tables

    - Keep track of scope and binding information about names

    - Allow us to add new entries and find existing entries efficiently


    Notes: 1)Changes to the table occur if a new name or new information about an
    existing name is discovered

    - 2)The table may be a linear list or a hash table

    - 3)It is useful for a compiler to be able to grow the symbol table dynamically,
    if necessary, at compile time


    ### 2. Symbol-table entries

    - Each entry in the symbol table is for the declaration of a name

    - Each entry can be implemented as a record consisting of a sequence of consecutive
    words of memory


    Notes:

    1) Information may be entered into the symbol table at various times

    2) Attributes of a name are entered in response to declarations


