  mdcn: "\n\n## 第2章 语言与语法描述\n\n### 第4节 语法树与文法的二义性\n\n**1、语法树**\n\n**c、语法树中的基本术语**\n\
    \n**（4）短语**\n\n子树中从左到右的终结符序列串称为与该子树根相关的短语。\n\n- **简单短语（直接短语）：** 如果一个短语是由子树的根经过1步推导得到的，则称该短语为与该子树根相关的简单短语。\n\
    - **句型中的短语：** 与句型相关的某棵子树所对应的短语\n\n**（5）句柄**\n\n句型中最左边的简单短语。\n\n注：在规范归约（最左归约）过程中，核心工作就是寻找句柄。\n\
