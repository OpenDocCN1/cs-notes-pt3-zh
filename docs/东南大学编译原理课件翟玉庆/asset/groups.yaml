  md: "\n## Chapter 7 Runtime Environments\n### Section 2 Storage allocation strategies\n\
    \n#### 1. Storage allocation strategies\n- Static allocation\n  - Lays out storage\
    \ for all data objects at compile time.\n- Stack allocation\n  - Manages the run-time\
    \ storage as a stack.\n- Heap allocation\n  - Allocates and de-allocates storage\
    \ as needed at run time from a heap.\n\n#### 2. Static allocation\n- The size\
    \ of a data object and constraints on its position in memory must be known at\
    \ compile time.\n- Recursive procedures are restricted.\n- Data structures cannot\
    \ be created dynamically.\n- Fortran permits static storage allocation\n\n####\
    \ 3. Heap allocation\n- A separate area of run-time memory, called a heap.\n-\
    \ Heap allocation parcels out pieces of contiguous storage, as needed for activation\
    \ records or other objects. Pieces may be de-allocated in any order.\n\n#### 4.\
    \ Stack allocation\n\n##### 1) Main idea\n- Based on the idea of a control stack;\
    \ storage is organized as a stack, and *activation records* are pushed and popped\
    \ as activations begin and end, respectively.\n- Storage for the locals in each\
    \ call of a procedure is contained in the activation record for that call.\n-\
    \ Locals are bound to fresh storage in each activation\n\n##### 2) Calling sequences\n\
    - A call sequence allocates an activation record and enters information into its\
    \ fields\n- A return sequence restores the state of the machine so the calling\
    \ procedure can continue execution.\n\ne.g. the calling sequence is like the following:\n\
    \n```\nmain()\n{.....\n    q();\n}\np()\n{.....}\nq()\n{\n.....\np();\n.....\n\
    }\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_442_0.png)\n\nSteps: (1) The\
    \ caller evaluates actual parameters.\n- (2) The caller stores a return address\
    \ and the old value of top-sp into the callee’s activation record.\n- (3) The\
    \ callee saves register values and other status information\n- (4) the callee\
    \ initializes its local data and begins execution.\n\nA possible return sequence\
    \ :\n- (1) The callee places a return value next to the activation record of the\
    \ caller\n- (2) Using the information in the status field, the callee restores\
    \ top-sp and other registers and branches to a return address in the caller’s\
    \ code.\n- (3) Although top-sp has been decremented, the caller can copy the returned\
    \ value into its own activation record and use it to evaluate an expression.\n\
    \n##### 3) Stack allocation for non-nested procedure\n- Stack allocation for C\n\
    - When entering a procedure, the activation record of the procedure is set up\
    \ on the top of the stack\n- Initially, put the global(static) variables and the\
    \ activation record of the Main function\n\n![](img/353f619caa6c5715591f2105bdfa2865_446_0.png)\n\
    \n| Stack allocation frame |\n|---|\n| Caller’s SP |\n| Calling Return address\
    \ |\n| Amount of parameters |\n| Formal parameters |\n| Local data |\n| Array\
    \ data |\n| Temporaries |\n| Returned value |\n\n```c\n#include <stdio.h>\nint\
    \ x,y;\n\nint main()\n{\n    x=5;\n    y=f(x);\n}\n```\n"
  mdcn: "\n\n## 第7章 运行时环境\n### 第2节 存储分配策略\n\n#### 1. 存储分配策略\n- 静态分配\n  - 在编译时为所有数据对象布局存储。\n\
    - 栈分配\n  - 将运行时存储作为栈来管理。\n- 堆分配\n  - 在运行时根据需要从堆中分配和释放存储。\n\n#### 2. 静态分配\n- 数据对象的大小及其在内存中的位置约束必须在编译时已知。\n\
    - 递归过程受到限制。\n- 不能动态创建数据结构。\n- Fortran允许静态存储分配。\n\n#### 3. 堆分配\n- 运行时内存中有一个单独的区域，称为堆。\n\
    - 堆分配根据需要为活动记录或其他对象分配连续的存储块。这些块可以按任意顺序释放。\n\n#### 4. 栈分配\n\n##### 1) 主要思想\n- 基于控制栈的思想；存储组织为栈，*活动记录*在活动开始和结束时分别压栈和弹出。\n\
    - 每次过程调用的局部变量存储在对应调用的活动记录中。\n- 局部变量在每次活动中绑定到新的存储。\n\n##### 2) 调用序列\n- 调用序列分配活动记录并将信息填入其字段。\n\
    - 返回序列恢复机器状态，使调用过程可以继续执行。\n\n例如，调用序列如下：\n\n```\nmain()\n{.....\n    q();\n}\n\
    p()\n{.....}\nq()\n{\n.....\np();\n.....\n}\n```\n\n![](img/353f619caa6c5715591f2105bdfa2865_442_0.png)\n\
    \n步骤：(1) 调用者计算实际参数。\n- (2) 调用者将返回地址和top-sp的旧值存储到被调用者的活动记录中。\n- (3) 被调用者保存寄存器值和其他状态信息。\n\
    - (4) 被调用者初始化其局部数据并开始执行。\n\n一种可能的返回序列：\n- (1) 被调用者将返回值放在调用者活动记录的旁边。\n- (2) 被调用者利用状态字段中的信息恢复top-sp和其他寄存器，并跳转到调用者代码中的返回地址。\n\
    - (3) 虽然top-sp已递减，但调用者可以将返回的值复制到自己的活动记录中，并用它来计算表达式。\n\n##### 3) 非嵌套过程的栈分配\n- C语言的栈分配\n\
    - 进入过程时，该过程的活动记录被设置在栈顶。\n- 初始时，放置全局（静态）变量和Main函数的激活记录。\n\n![](img/353f619caa6c5715591f2105bdfa2865_446_0.png)\n\
    \n| 栈分配帧 |\n|---|\n| 调用者的SP |\n| 调用返回地址 |\n| 参数数量 |\n| 形式参数 |\n| 局部数据 |\n| 数组数据\
    \ |\n| 临时量 |\n| 返回值 |\n\n```c\n#include <stdio.h>\nint x,y;\n\nint main()\n{\n\
    \    x=5;\n    y=f(x);\n}\n```\n\n"
