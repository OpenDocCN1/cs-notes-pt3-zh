  mdcn: "\n\n## 第7章 运行时环境\n### 第2节 存储分配策略\n#### 4. 栈分配\n##### 3) 非嵌套过程的栈分配\n\n```\n\
    int f(int n)\n{\n    if (n<=1) return 1;\nelse {\n    int t1,t2,t;\n    t1=f(n-1);\n\
    \    t2=f(n-2);\n    t=t1+t2;\n    return t} }\n```\n\n## C语言的存储组织\n\n| 存储区域 |\n\
    |---|\n| ···· |\n| 主函数调用的函数的活动记录 |\n| 主函数的活动记录 |\n| 全局变量数据区 |\n\n## C语言中任意函数的活动记录形式\n\
    \n|  | 标签 |\n|---|---|\n| 函数的返回值单元 | TOP |\n| 内部临时工作单元 |  |\n| 局部变量数据存储单元 |  |\n\
    | 形参存储单元 |  |\n| 形参个数 |  |\n| 返回地址 |  |\n| 调用者的SP（调用者活动记录的起始地址） | SP |\n\n## 第7章\
    \ 运行时环境\n### 第2节 存储分配策略\n#### 4. 栈分配\n##### 4) 嵌套过程的栈分配\n###### (1) Pascal程序中过程定义的嵌套\n\
