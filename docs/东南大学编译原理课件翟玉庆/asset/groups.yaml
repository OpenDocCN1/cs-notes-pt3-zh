    # CHAPTER 4 Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    10、 Construction of a predictive parser


    1) FIRST & FOLLOW


    FOLLOW:


    +   - For non-terminal A, to be the set of terminals a that can appear immediately
