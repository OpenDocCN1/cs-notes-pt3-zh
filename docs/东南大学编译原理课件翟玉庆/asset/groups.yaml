    ## Chapter 2 Language & Syntax Description

    ### Section 3 Grammar construction and simplification

    ### 1、 Constructing a grammar from a language


    Example 4: Let L₄={ω | ω ∈(0,1)* and the number of 1 appeared in ω is even}


    Try to construct the grammar G₄ from L₄


    ```

    S → ε

    ```


    ```

    S →0S,  S → 1A

    ```


    ```

    A →0A , A →1S

    ```


    ### 2、 Grammar Simplification


    a、 Because a language can be described in different grammars, it is true that
    should select the grammar which has least productions and is the most suitable
    to the properties of the language.


    b、 In a grammar, there may be some redundant productions that are useless to derivation.
    We should delete these productions.


    - The production which is of the form P→P

    - The production which can not derive a terminal string forever

    - The production whose left-side non-terminal symbol does not appear in the right-side
    of any production


    ### 2、 Grammar Simplification


    c、 Steps of simplification:


    - Look for the productions of the form P→P, and delete them;

    - If a production can not be used in the derivations forever, delete it;

    - If a production can not derive a terminal string, delete it;

    - Arrange the remained productions.


    ### 2、Grammar Simplification


    **Example:** Simplify the following grammar


    ```

    (0)S → Be    (1)S → Ec    (2)A → Ae    (3)A → e

    (4)A → A     (5)B → Ce    (6)B → Af    (7)C → Cf

    (8)D → f

    ```


    **Result:**


    ```

    (0) S → Be       (1)A → Ae       (2)A →e

    (3)B → Af

    ```


    ### 3、Construct a context-free grammar without ε-production


    a、A context-free grammar without ε-production should satisfy the conditions as
    followings


    - If there is the production S → ε of the form in P, S should not appear in right-side
    of any production, where S is the Start Symbol of the grammar;

    - There are no other ε-productions in P.


    b、The algorithm to construct a context-free grammar without ε-production:


    - G=(V_N,V_T,P,S) ⇒ G''=(V''_N,V''_T,P'',S'')


    (1) Find out all non-terminal symbols that can derive ε after some steps, and
    put them into the set V_0;


    b、 The algorithm to construct a context-free grammar without ε-production:


    (2)Construct the P’ set of productions of G’ as following steps:


    - (A)If an symbol in V₀ appears in the right-side of a production, change the
    production into two productions: substitute the symbol in ε and itself in the
    production respectively; put the new productions into P’

    - ( B)Otherwise, put the productions relating to the symbol into P’ except for
    ε-production relating to the symbol

    - ( C)If there exists the production of the form S→ ε in P, change the production
    into S’→ ε | S and put them into P’,let S’ be the Start Symbol of G’, let V’ₙ=Vₙ∪{S’},


    Example: Let G₁=({S},{a,b},P,S), where


    P: (0) S → ε   (1) S → aSbS   (2) S → bSaS


    (1) V₀={S}


    (2) P′


    (1) S → abS|aSbS|aSb|ab


    (2) S → baS|bSaS|bSa|ba


    (0) S′ → ε | S


    So: G₁=({S′,S},{a,b},P′,S′), where


    P′:


    (0) S′ → ε | S


    (1) S → abS|aSbS|aSb|ab


    (2) S → baS|bSaS|bSa|ba


    ## Chapter 2  Language & Syntax Description

    ### Section 4  Syntax tree and ambiguity of a grammar

    ### 1、Syntax tree

    ### a、Definition


    - A tree used to express the structure of a sentence in a language


    ### b、Function


    - Present the syntax analysis process visually and directly

    - Used to decide the ambiguity of a grammar easily


