- pgno: 46
  md: '# Chapter 2 Language & Syntax Description


    # Section 2 Grammar & Language


    # 2、Formal definition


    # b、Catalog of grammars


    +   (1) 0-type grammar (Phrase grammar or grammar without limitation)


    – To any production α→β in P where α∈V⁺ and β∈V*, there is at least a non-terminal
    symbol in α.


    # Notes:


    +   ① The automation that can recognizes a 0-type language is called as Turing
    Machine;


    +   ② 0-type grammar is a grammar that has least limitation on its productions;


    +   ③ We can get other types of grammar by limiting the form of productions in
    a 0-type grammar.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Chapter 2 Language & Syntax Description


    # Section 2 Grammar & Language


    # 2、Formal definition


    # 6、Catalog of grammars


    # (2) 1-type grammar(context-sensitive grammar or length-added grammar)


    +   - To any production α→β in P, there is the limitation of |β|>=|α| except for
    S → ε. If S → ε, S can not appear in the right side of any production.


    +   - Or, any production α→β in P has the form of αAβ→αγβ(where α, β∈V*, A∈V_N,
    γ∈V_T+) except for S → ε.


    Notes: ①The automation that can recognizes a 1-type language is called as Linear
    Bound (LBA)；②In a 1-type grammar, we should consider the context of a non-terminal
    symbol when we replace the non-terminal symbol. And a non-terminal symbol can
    not be replaced by ε except that the Start Symbol can produce ε'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Chapter 2 Language & Syntax Description


    # Section 2 Grammar & Language


    # 2、 Formal definition


    # b、 Catalog of grammars


    # (3) 2-type grammar(Context-free grammar)


    +   - Every production in P is of the form A→β where A∈V_N , β∈V*.


    Notes: ①The left side of each production should be a non-terminal symbol, the
    right side of each production may be V_N, V_T or ε.②The automation that recognizes
    a 2-type language is called as Push-Down Automation(PDA)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Chapter 2 Language & Syntax Description


    # Section 2 Grammar & Language


    # 2、 Formal definition


    # b、 Catalog of grammars


    # (4)3-type grammar(Regular grammar, right-linear grammar or left-linear grammar)


    +   - Every production in P is of the form A→ α B, A→ α, or A→ Bα, A→ α, where
    A, B∈V_N, α∈V_T*。


    Notes: ① The productions in 3-type grammar are right-linear productions or else
    left-linear productions. There cannot be either left-linear productions or right-linear
    productions. If all the productions in a 3-type grammar are left-linear productions,
    we call name grammar as left-linear grammar. If all the productions in a 3-type
    grammar are right-linear productions, we name the grammar as right-linear grammar.'
  merge: -1
  img_proc: true
