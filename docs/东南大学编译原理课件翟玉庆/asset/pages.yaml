- pgno: 15
  md: '# Chapter 1 Introduction to Compiling


    # 1、 What is a compiler?


    **very general definition:** It is a piece of software that translates a program
    in one (artificial) language, Lang1, to a program in another (artificial) language,
    Lang2.


    **narrower definition:** Our primarily focus is the case where Lang1 is a programming
    language that humans like to program in, and Lang2 is (or is "closer to") a machine
    language, that a computer "understands" and can execute.


    **extra stipulation:** The compiler should say something even if the input is
    not a valid program of Lang1. Namely, it should give an error message explaining
    why the input is not a valid program.'
  merge: -1
  img_proc: true
