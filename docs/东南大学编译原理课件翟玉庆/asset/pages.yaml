- pgno: 245
  md: '# Two Conditions for Top-Down Parsing ...


    +   - Two conditions are required to ensure that a deterministic, one symbol lookahead
    top-down parser can be constructed.


    +   - Condition 1: If A is defined by the rule

    +     A → χ₁ | χ₂ | ... | χₙ

    +     then the initial symbols of all sentences that can be derived from all χᵢ
    must be distinct, i.e.:

    +     first(χᵢ) ∩ first(χⱼ) = ∅  for all i ≠ j'
  merge: -1
  img_proc: true
- pgno: 246
  md: "# **Two Conditions for Top-Down Parsing**\n\n+   - Consider the grammar:\n\
    +   \n+     `S → A x.`  \n+     `A → [x].`\n+   \n+     When parsing the sentence\
    \ x, we may proceed into a \"dead alley\":\n+   \n+     ```text\n+     stack \
