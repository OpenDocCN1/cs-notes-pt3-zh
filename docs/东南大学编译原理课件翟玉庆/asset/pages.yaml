- pgno: 39
  md: '# Chapter 2 Language & Syntax Description


    # Section 2 Grammar & Language


    # 1、 Basic concepts


    # f、 Derivation


    +   - The process that starts from the Start Symbol, and derives a sentence by
    replacing the left-side with right side in a production rule.

    +   - Leftmost (Rightmost) Derivation: Only use a production rule every time and
    replace the leftmost (Rightmost) Terminal Symbol with the right side


    Notes: Leftmost (Rightmost) Derivation are called canonical derivation.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Chapter 2  Language & Syntax Description


    # Section 2  Grammar & Language


    # 1、Basic concepts


    # g、Reduction


    — Reduction is the inverse process of derivation,that is, starting from a given
    sentence of a language, arriving at the Start Symbol by replacing the right-side
    with left-side of the production rules finally.


    — Leftmost(Rightmost) Reduction is the inverse process of Rightmost(Leftmost)
    derivation.


    Notes:  Leftmost and Rightmost Reduction are called canonical reduction.'
  merge: -1
  img_proc: true
