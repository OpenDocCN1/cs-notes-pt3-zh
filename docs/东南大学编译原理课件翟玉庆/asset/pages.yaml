- pgno: 111
  md: "# CHAPTER 3  LEXICAL ANALYSIS\n\n# Section 4 Finite automata\n\n# 5、Conversion\
    \ of an NFA into a DFA\n\n# c)The pre-process--- ε-closure(T)\n\n# (2)ε-closure(T)\
    \ algorithm\n\n```\npush all states in T onto stack;\ninitialize ε-closure(T)\
    \ to T;\nwhile stack is not empty do {\n    pop the top element of the stack into\
    \ t;\n    for each state u with an edge from t to u labeled ε do {\n        if\
    \ u is not in ε-closure(T) {\n            add u to ε-closure(T)\n            push\
    \ u into stack} } }\n```"
  merge: -1
  img_proc: true
