- pgno: 62
  md: '# Chapter 2 Language & Syntax Description


    # Section 3 Grammar construction and simplification


    3、Construct a context-free grammar without ε-production


    a、A context-free grammar without ε-production should satisfy the conditions as
    followings


    +   - If there is the production S → ε of the form in P, S should not appear in
    right-side of any production, where S is the Start Symbol of the grammar;


    +   - There are no other ε-productions in P.


    b、The algorithm to construct a context-free grammar without ε-production:


    +   - G=(V_N,V_T,P,S) ⇒ G''=(V''_N,V''_T,P'',S'')


    (1) Find out all non-terminal symbols that can derive ε after some steps, and
    put them into the set V_0;'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 2 Language & Syntax Description


    # Section 3 Grammar construction and simplification


    3、Construct a context-free grammar without ε-production


    b、 The algorithm to construct a context-free grammar without ε-production:


    (2)Construct the P’ set of productions of G’ as following steps:


    +   (A)If an symbol in V₀ appears in the right-side of a production, change the
    production into two productions: substitute the symbol in ε and itself in the
    production respectively; put the new productions into P’


    +   ( B)Otherwise, put the productions relating to the symbol into P’ except for
    ε-production relating to the symbol


    +   ( C)If there exists the production of the form S→ ε in P, change the production
    into S’→ ε | S and put them into P’,let S’ be the Start Symbol of G’, let V’ₙ=Vₙ∪{S’},'
  merge: -1
  img_proc: true
