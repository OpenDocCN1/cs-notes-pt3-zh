- pgno: 101
  md: '# CHAPTER 3  LEXICAL ANALYSIS


    # Section 4 Finite automata


    # 3、 Deterministic FA (DFA)


    DFA is a quintuple, M(S,Σ,move,s₀,F)


    +   - S: a set of *states*

    +   - Σ: the input symbol alphabet

    +   - move: a transition function, mapping from S×Σ to S, *move(s,a)=s′*

    +   - s₀: the *start* state, s₀ ∈ S

    +   - F: a set of states F distinguished as *accepting* states, F⊆S'
  merge: -1
  img_proc: true
- pgno: 102
  md: "# CHAPTER 3  LEXICAL ANALYSIS\n\n# Section 4 Finite automata\n\n# 3、 Deterministic\
    \ FA (DFA)\n\n+   1) In a DFA, no state has an ε-transition;\n+   \n+   2) In\
    \ a DFA, for each state *s* and input symbol *a*, there is at most one edge labeled\
    \ *a* leaving *s*\n+   \n+   3) To describe a FA, we use the transition graph\
    \ or transition table\n+   \n+   4) A DFA accepts an input string x if and only\
    \ if there is some path in the transition graph from start state to some accepting\
    \ state"
  merge: -1
  img_proc: true
