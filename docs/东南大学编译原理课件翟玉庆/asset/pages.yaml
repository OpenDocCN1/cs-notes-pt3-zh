- pgno: 59
  md: '# Chapter 2 Language & Syntax Description


    # Section 3 Grammar construction and simplification


    # 2、 Grammar Simplification


    a、 Because a language can be described in different grammars, it is true that
    should select the grammar which has least productions and is the most suitable
    to the properties of the language.


    b、 In a grammar, there may be some redundant productions that are useless to derivation.
    We should delete these productions.


    +   - The production which is of the form P→P

    +   - The production which can not derive a terminal string forever

    +   - The production whose left-side non-terminal symbol does not appear in the
    right-side of any production'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Chapter 2 Language & Syntax Description


    # Section 3 Grammar construction and simplification


    # 2、 Grammar Simplification


    # c、 Steps of simplification:


    +   - Look for the productions of the form P→P, and delete them;

    +   - If a production can not be used in the derivations forever, delete it;

    +   - If a production can not derive a terminal string, delete it;

    +   - Arrange the remained productions.'
  merge: -1
  img_proc: true
