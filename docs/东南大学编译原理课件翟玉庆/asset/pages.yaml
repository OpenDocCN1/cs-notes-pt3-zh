  md: '# CHAPTER 4 Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    # 10、 Construction of a predictive parser


    # 1) FIRST & FOLLOW


    # FIRST:


    +   - If α is any string of grammar symbols, let FIRST(α) be the set of terminals
    that begin the string derived from α.

    +   - If α ⟹* ε, then ε is also in FIRST(α)

    +   - That is :

    +     α ∈ V*, First(α) = {a | α → a......, a ∈ V_T }'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# CHAPTER 4 Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    10、 Construction of a predictive parser


    1) FIRST & FOLLOW


    FOLLOW:


    +   - For non-terminal A, to be the set of terminals a that can appear immediately
    to the right of A in some sentential form.


    +   - That is: Follow(A) = {a|S → ...Aa..., a ∈ V_T}

    +   If S→...A, then $ ∈ FOLLOW(A)。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# CHAPTER 4 Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    10、 Construction of a predictive parser


    2) Computing FIRST(α)


    (1)to compute FIRST(X) for all grammar symbols X


    +   - If X is terminal, then FIRST(X) is {X}.


    +   - If X→ ε is a production, then add ε to FIRST(X).


    +   - If X is non-terminal, and X → Y₁Y₂...Yₖ, Yⱼ∈(Vₙ∪Vₜ),1≤j≤k, then'
  merge: -1
  img_proc: true
