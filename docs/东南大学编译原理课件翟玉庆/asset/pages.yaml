- pgno: 144
  md: '# CHAPTER 3 LEXICAL ANALYSIS


    # Section 7 Regular Grammar to an NFA


    2、 Right-linear grammar to FA


    +   - Input : G=(V_N, V_T, P, S)


    +   - Output : FA M=(Q, Σ, move, q₀, Z)


    +   - Method :


    +   - Consider each non-terminal symbol in G as a state, and add a new state T
    as an accepting state.


    +   - Let Q=V_N ∪ {T} , Σ = V_T , q₀ =S; if there is the production S→ ε , then
    Z={S,T}, else Z={T} ;'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# CHAPTER 3 LEXICAL ANALYSIS


    # Section 7 Regular Grammar to an NFA


    2、 Right-linear grammar to FA


    +   - Method :

    +     - For each production, construct the function move.


    a) For the productions similar as A₁ → aA₂, construct move(A₁,a)= A₂.


    b) For the productions similar as A₁ → a, construct move(A₁,a)= T.


    c) For each a in Σ, move(T,a)=Φ, that means the accepting states do not recognize
    any terminal symbol.'
