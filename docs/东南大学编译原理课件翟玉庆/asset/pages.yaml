- pgno: 206
  md: '# CHAPTER 4  Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    # 3、Recursive descent


    +   - Backtracking parsers are not seen frequently, because:

    +     - Backtracking is not very efficient.


    +   - Why backtracking occurred?

    +     - A *left-recursive grammar* can cause a recursive-descent parser to go
    into an infinite loop.

    +     - An ambiguity grammar can cause backtracking

    +     - Left factor can also cause a backtracking'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# CHAPTER 4 Syntax ANALYSIS

    Section 2 TOP-DOWN PARSING


    # 4、 Elimination of Left Recursion


    # 1)Basic form of left recursion


    Left recursion is the grammar contains the following kind of productions.


    +   - P → Pα | β   Immediate recursion


    or


    +   - P → Aa , A→Pb Indirect recursion'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# CHAPTER 4  Syntax ANALYSIS


    # Section 2 TOP-DOWN PARSING


    # 4、Elimination of Left Recursion


    # 2)Strategy for elimination of Left Recursion


    Convert left recursion into the equivalent

    right recursion


    $P \to P\alpha \mid \beta$


    $\Rightarrow P \to \beta\alpha^*$


    $\Rightarrow P \to \beta P''$,  $P'' \to \alpha P'' \mid \varepsilon$'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# CHAPTER 4  Syntax ANALYSIS


    # Section 2 TOP-DOWN PARSING


    # 4、 Elimination of Left Recursion


    # 3)Algorithm


    # (1) Elimination of immediate left recursion


    ```

    P → Pα|β

    ⇒ P -> βα*

    ⇒ P → βP′  P′ → αP′|ε

    ```


    # (2) Elimination of indirect left recursion


    Convert it into immediate left recursion first

    according to specific order, then eliminate the

    related immediate left recursion'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Algorithm:


    +   - (1) Arrange the non-terminals in G in some order as P₁, P₂, ..., Pₙ, do
    step 2 for each of them.

    +   - (2) for (i=1,i<=n,i++)

    +     {for (k=1,k<=i-1,k++)

    +       {replace each production of the form Pᵢ → Pₖγ

    +        by Pᵢ → δ₁γ | δ₂γ | ...... | δₙγ;

    +        where Pₖ → δ₁ | δ₂ | ...... | δₙ are all the current Pₖ-productions

    +       }

    +       change Pᵢ → Pᵢα₁ | Pᵢα₂ | .... | Pᵢαₘ | β₁ | β₂ | .... | βₙ

    +       into Pᵢ → β₁ Pᵢ'' | β₂ Pᵢ'' | ...... | βₙ Pᵢ''

    +              Pᵢ'' → α₁ Pᵢ'' | α₂ Pᵢ'' | ...... | αₘ Pᵢ'' | ε}

    +       /*eliminate the immediate left recursion*/

    +   - (3) Simplify the grammar.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'E.g. Eliminating all left recursion in the following grammar:

    (1) S → Qc|c  (2)Q → Rb|b   (3) R → Sa|a

    Answer: 1)Arrange the non-terminals in the order:R,Q,S

    2) for R: no actions.

    for Q:Q → Rb|b ⇒ Q → Sab|ab|b

    for S: S → Qc|c ⇒ S → Sabc|abc|bc|c;

    then get S → (abc|bc|c)S`

    S` → abcS`| ε

    3) Because R,Q is not reachable, so delete them

    so, the grammar is :

    S → (abc|bc|c)S`

    S` → abcS`| ε'
  merge: -1
  img_proc: true
