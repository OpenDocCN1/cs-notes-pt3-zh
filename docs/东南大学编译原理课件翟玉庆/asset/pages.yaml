    Find all groups of states that can be distinguished by some input string. At beginning
    of the process, we assume two distinguished groups of states: the group of non-accepting
    states and the group of accepting states. Then we use the method of partition
    of equivalent class on input string to partition the existed groups into smaller
    groups.'
