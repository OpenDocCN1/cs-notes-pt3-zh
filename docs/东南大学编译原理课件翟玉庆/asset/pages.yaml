- pgno: 434
  md: 'In a stack frame (activation record) we hold the following information:


    +   1) dynamic link: pointer value of the previous stack frame so we can reset
    the top of stack when we exit this routine.

    +   2) static link: in languages (like Pascal but not C) that allow nested routine
    declarations, then a routine may be able to access the variables of the routine(s)
    within which it is declared. In the static link, we hold the pointer value of
    the stack frame in which the current pointer was declared.

    +   3) return address: point in the code to which we return at the end of execution
    of the current routine.

    +   4) values of arguments passed to the routine and locals declared in the routine.'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'Here is what happens when we call a routine:


    +   1) set up new stack frame at top of the stack

    +   2) copy arguments across to new stack frame

    +   3) save existing stack pointer in dynamic link of new frame

    +   4) set up static link if appropriate

    +   5) save return address in new frame

    +   6) set stack pointer to base of new stack frame (this allows access to all
    variables in the stack frame)

    +   7) jump to the code for the routine


    On return we do the reverse:


    +   1) retrieve return address from the stack frame

    +   2) restore stack pointer from dynamic link

    +   3) save result of routine in restored stack frame

    +   4) jump to the return address'
  merge: -1
  img_proc: true
