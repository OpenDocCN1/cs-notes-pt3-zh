- pgno: 107
  md: '# CHAPTER 3 LEXICAL ANALYSIS


    # Section 4 Finite automata


    # 4、 Non-deterministic FA (NFA)


    +   Note:1) In a NFA,the same character can label two or more transitions out
    of one state;

    +   2) In a NFA,ε is a legal input symbol.

    +   3) A DFA is a special case of a NFA

    +   4)A NFA accepts an input string x if and only if there is some path in the
    transition graph from start state to some accepting state. A path can be represented
    by a sequence of state transitions called moves.

    +   5)The language defined by a NFA is the set of input strings it accepts'
  merge: -1
  img_proc: true
