  md: '# CHAPTER 4 SYNTAX ANALYSIS


    # Section 5 LR parsers


    # 17、 LALR(lookahead-LR)


    +   1) Basic idea


    Merge the set of LR(1) states having the same core


    Notes: (1) When merging, the GOTO sub-table can be merged without any conflict,
    because GOTO function just relies on the core


    (2) When merging, the ACTION sub-table can also be merged without any conflicts,
    but it may occur the case of merging of error and shift/reduce actions. We assume
    non-error actions'
