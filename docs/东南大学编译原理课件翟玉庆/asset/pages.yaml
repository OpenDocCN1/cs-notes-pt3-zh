- pgno: 493
  md: '# Chapter 8 Intermediate code generation

    Section 2 Backpatching


    # 1. Why and what is backpatching?


    +   - When generating code for boolean expressions and flow-of-control statements,
    we may **not know the labels that control must go to**.


    +   - We can get around this problem by generating a series of branching statement
    with the targets of the jumps temporarily left unspecified.


    +   - Each such statement will be put on a list of goto statements whose labels
    will be **filled in when the proper label can be determined**.


    +   - This subsequent filling in of labels is called backpatching.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# Chapter 8 Intermediate code generation

    Section 2 Backpatching


    2.Functions to manipulate lists of labels related to backpatching


    +   - Makelist(i)

    +     - Creates a new list containing only i, an index into the array of TAC instructions;
    makelist returns a pointer to the list it has made.

    +   - Merge(p1,p2)

    +     - Concatenates the lists pointed to by p1 and p2, and returns a pointer
    to the concatenated list.

    +   - Backpatch(p,i)

    +     - Inserts i as the target label for each of the statements on the list pointed
    to by p.'
  merge: -1
  img_proc: true
