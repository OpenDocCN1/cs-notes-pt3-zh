    # 7、 The algorithm


    +   - The next move of the parser is determined by reading the current input symbol
    $a$, and the state $S$ on top of the stack, and then consulting the parsing action
    table entry $action[S,a]$.


    +   - If $action[S_m,a_i]=shift\ S''$, the parser executes a shift move, enter
    the $S''$ into the stack, and the next input symbol $a_{i+1}$ become the current
    symbol.'
