    (4) Choose one state in each group of the partition Π_{final} as the representative
    for that group. The representatives will be the states of the reduced DFA M’.
    Let s and t be representative states for s’s and t’s group respectively, and suppose
    on input a there is a transition of M from s to t. Then M’ has a transition from
    s to t on a.'
