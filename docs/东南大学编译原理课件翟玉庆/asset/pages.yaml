- pgno: 577
  md: "# Peephole Optimization\n\n+   - Peephole optimization examines a short sequence\
    \ of instructions, the peephole, replacing those by more efficient ones, possibly\
    \ enabling further optimization.\n+   \n+   - Some compilers generate code without\
    \ algebraic simplification and then offer (optional) peephole optimization.\n\
    +   \n+   - Peephole optimization can remove some redundant loads and stores:\n\
    +   \n+     ```\n+     x := e;              STW Rₑ,x,0       (* assuming e is\
    \ in Rₑ *)\n+     y := x + 2           LDW Rₓ,x,0       (* x is now in Rₓ *)\n\
    +     ```\n+   \n+   - Peephole optimization can also be used to eliminate jumps\
    \ to jumps:\n+   \n+     ```\n+     IF a THEN\n+         IF b THEN S ELSE T END\n\
    +     ELSE U\n+     END\n+     ```"
  merge: -1
  img_proc: true
