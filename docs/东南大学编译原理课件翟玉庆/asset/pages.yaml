- pgno: 474
  md: '# Chapter 8 Intermediate code generation

    Section 1 Intermediate languages


    # 2. Three-address code(TAC)


    A sequence of statements of the general form x= y op z


    +   Notes: 1) Here, x,y,z are names, constants, or compiler-generated temporaries;
    op stands for any operator


    +   2) There is only one operator on the right side of a statement


    +   3) Three address code is a linearized representation of a syntax tree or a
    DAG in which explicit names correspond to the interior nodes of the graph


    +   4) Each three-address code statement contains three addresses, two for the
    operands and one for the result'
  merge: -1
