    Q: What command do the last statements in above two programs send?\n\n## 4.3 Interrupt\
    \ in x86 System\n\n### Interrupt and Exception Classification\n\n### Non-Maskable\
    \ Interrupt (NMI)\n\n- Hardware, non-maskable, and Vector interrupt\n- Interrupt\
    \ request signal sent to the NMI pin.\n- interrupt vector number: 2\n- No need\
    \ interrupt recognition.\n- When NMI signal transition from 0 to 1, then maintain\
    \ high level at least four processor clock cycles, an NMI interrupt will be recognized.\n\
    - NMI transition from 1 to 0 and maintain low level at least four processor clock\
    \ cycles, a new NMI interrupt can be identified.\n\n### Software-Generated Interrupts\n\
    \n- Software, non-maskable, and Vector interrupt\n- The INT n instruction permits\
    \ interrupts to be generated from within software by supplying an interrupt vector\
    \ number as an operand.\n- interrupt vector number: Operand in INT n\n- No need\
    \ interrupt recognition.\n- BIOS interrupt\n  - INT 10H, INT 13H, INT 16H, ...\n\
    - DOS interrupt\n  - INT 20H, INT 21H, INT 24H,...\n\n### Interrupt instruction\n\
