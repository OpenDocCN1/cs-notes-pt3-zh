  - '[PAGE 14]


    # 1.2 Intel X86 CPU


    # 8088/8086 Block Diagram


    ![](img/d7c975450dfbe59120092c2721be78c6_14_0.png)'
  - '[PAGE 15]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    # Real-address mode


    +   - In 8086/8088, this is the only mode.

    +   - In 80286 or above, this mode implements the programming environment of the
    Intel 8086 processor with extensions (such as the ability to switch to protected
    or system management mode).

    +   - The processor is placed in real-address mode following power-up or a reset.

    +   - Allow microprocessor to address only the first 1M byte of memory space'
  - '[PAGE 16]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    # Protected mode (80286 or above)


    +   - This mode is the native state of the processor.

    +   - Support multi-tasking operations, and to protect the data and procedures
    for each task

    +   - This mode allows applications to access physical memory greater than 4 GByte
    using PAE (Physical Address Extensions, 80386 or above).

    +   - Virtual address space=64TB (2^46)

    +   - Protected mode is where Windows operates.'
  - '[PAGE 17]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    # Virtual-8086 mode (IA-32 or above)


    +   Among the capabilities of protected mode is the ability to directly execute
    “real-address mode” 8086 software in a protected, multi-tasking environment.


    +   This feature is called virtual-8086 mode, although it is not actually a processor
    mode. Virtual-8086 mode is actually a protected mode attribute that can be enabled
    for any task.'
  - '[PAGE 18]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    # System management mode (SMM) (IA-32 or above)


    +   - This mode provides an operating system or executive with a transparent mechanism
    for implementing platform specific functions such as power management and system
    security.

    +   - In SMM, the processor switches to a separate address space while saving
    the basic context of the currently running program or task. SMM-specific code
    may then be executed transparently.

    +   - Upon returning from SMM, the processor is placed back into its state prior
    to the system management interrupt.'
  - '[PAGE 19]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    # IA-32e mode (Intel64 or above)


    # Compatibility mode (sub-mode of IA-32e mode)


    +   - Compatibility mode permits most legacy 16-bit and 32-bit applications to
    run without re-compilation under a 64-bit operating system.

    +   - Legacy applications that run in Virtual 8086 mode or use hardware task management
    will not work in this mode.

    +   - Applications access only the first 4 GByte of linear-address space. Compatibility
    mode uses 16-bit and 32-bit address and operand sizes.'
  - '[PAGE 20]


    # 1.2 Intel X86 CPU


    # Mode of Operation


    +   IA-32e mode (Intel64 or above)


    +   64-bit mode (sub-mode of IA-32e mode)


    +   - This mode enables a 64-bit operating system to run applications written
    to access 64-bit linear address space.

    +   - 64-bit mode extends the number of general purpose registers and SIMD extension
    registers from 8 to 16.

    +   - General purpose registers are widened to 64 bits. The mode also introduces
    a new opcode prefix (REX) to access the register extensions.'
  - '[PAGE 21]


    # 1.3 Real-address mode memory model


    # Fundamental


    +   - The memory cell is addressing by byte.

    +   - A multi-byte object is stored as a contiguous sequence of bytes, with the
    address of the object given by the smallest address of the bytes used.

    +   - For ordering the bytes representing an object, there are two common conventions.

    +     - little endian: where the least significant byte comes first, it store
    at the smallest address.

    +     - Big endian: where the most significant byte comes first, it store at the
    smallest address.

    +   - X86 CPU use little endian.'
  - '[PAGE 22]


    # 1.3 Real-address mode memory model


    By little endian:


    |  |  |  |

    |---|---|---|

    | 12H | 0000H | At address 0000H: |

    | 34H | 0001H | a Byte is |

    | 56H | 0002H | 12H |

    | 78H | 0003H | a Word is |

    | 9AH | 0004H | 3412H |

    | BCH | 0005H | a Doubleword is |

    | DEH | 0006H | 78563412H |

    | FFH | 0007H | a Quadword is |

    |  |  | FFDEBC9A78563412H |'
  md: "\n## 1.2 Intel X86 CPU\n### 8088/8086 Block Diagram\n\n![](img/d7c975450dfbe59120092c2721be78c6_14_0.png)\n\
    \n### Mode of Operation\n#### Real-address mode\n- In 8086/8088, this is the only\
    \ mode.\n- In 80286 or above, this mode implements the programming environment\
    \ of the Intel 8086 processor with extensions (such as the ability to switch to\
    \ protected or system management mode).\n- The processor is placed in real-address\
    \ mode following power-up or a reset.\n- Allow microprocessor to address only\
    \ the first 1M byte of memory space\n\n#### Protected mode (80286 or above)\n\
    - This mode is the native state of the processor.\n- Support multi-tasking operations,\
    \ and to protect the data and procedures for each task\n- This mode allows applications\
    \ to access physical memory greater than 4 GByte using PAE (Physical Address Extensions,\
    \ 80386 or above).\n- Virtual address space=64TB (2^46)\n- Protected mode is where\
    \ Windows operates.\n\n#### Virtual-8086 mode (IA-32 or above)\nAmong the capabilities\
    \ of protected mode is the ability to directly execute “real-address mode” 8086\
    \ software in a protected, multi-tasking environment.\n\nThis feature is called\
    \ virtual-8086 mode, although it is not actually a processor mode. Virtual-8086\
    \ mode is actually a protected mode attribute that can be enabled for any task.\n\
    \n#### System management mode (SMM) (IA-32 or above)\n- This mode provides an\
    \ operating system or executive with a transparent mechanism for implementing\
    \ platform specific functions such as power management and system security.\n\
    - In SMM, the processor switches to a separate address space while saving the\
    \ basic context of the currently running program or task. SMM-specific code may\
    \ then be executed transparently.\n- Upon returning from SMM, the processor is\
    \ placed back into its state prior to the system management interrupt.\n\n####\
    \ IA-32e mode (Intel64 or above)\n##### Compatibility mode (sub-mode of IA-32e\
    \ mode)\n- Compatibility mode permits most legacy 16-bit and 32-bit applications\
    \ to run without re-compilation under a 64-bit operating system.\n- Legacy applications\
    \ that run in Virtual 8086 mode or use hardware task management will not work\
    \ in this mode.\n- Applications access only the first 4 GByte of linear-address\
    \ space. Compatibility mode uses 16-bit and 32-bit address and operand sizes.\n\
    \n##### 64-bit mode (sub-mode of IA-32e mode)\n- This mode enables a 64-bit operating\
    \ system to run applications written to access 64-bit linear address space.\n\
    - 64-bit mode extends the number of general purpose registers and SIMD extension\
    \ registers from 8 to 16.\n- General purpose registers are widened to 64 bits.\
    \ The mode also introduces a new opcode prefix (REX) to access the register extensions.\n\
    \n## 1.3 Real-address mode memory model\n### Fundamental\n- The memory cell is\
    \ addressed by byte.\n- A multi-byte object is stored as a contiguous sequence\
    \ of bytes, with the address of the object given by the smallest address of the\
    \ bytes used.\n- For ordering the bytes representing an object, there are two\
    \ common conventions.\n  - little endian: where the least significant byte comes\
    \ first, it stores at the smallest address.\n  - Big endian: where the most significant\
    \ byte comes first, it stores at the smallest address.\n- X86 CPU use little endian.\n\
    \n### By little endian\n\n|  |  |  |\n|---|---|---|\n| 12H | 0000H | At address\
    \ 0000H: |\n| 34H | 0001H | a Byte is |\n| 56H | 0002H | 12H |\n| 78H | 0003H\
    \ | a Word is |\n| 9AH | 0004H | 3412H |\n| BCH | 0005H | a Doubleword is |\n\
    | DEH | 0006H | 78563412H |\n| FFH | 0007H | a Quadword is |\n|  |  | FFDEBC9A78563412H\
    \ |\n"
  mdcn: "\n\n## 1.2 Intel X86 CPU\n### 8088/8086 框图\n\n![](img/d7c975450dfbe59120092c2721be78c6_14_0.png)\n\
    \n### 工作模式\n#### 实地址模式\n- 在 8086/8088 中，这是唯一模式。\n- 在 80286 或更高版本中，此模式实现了 Intel\
    \ 8086 处理器的编程环境，并具有扩展功能（如能够切换到保护模式或系统管理模式）。\n- 处理器在加电或复位后进入实地址模式。\n- 允许微处理器仅寻址内存空间的前\
    \ 1M 字节\n\n#### 保护模式（80286 或以上）\n- 这是处理器的原生状态。\n- 支持多任务操作，并保护每个任务的数据和程序\n- 此模式允许应用程序使用\
    \ PAE（物理地址扩展，80386 或以上）访问大于 4 GByte 的物理内存。\n- 虚拟地址空间=64TB（2^46）\n- Windows 在保护模式下运行。\n\
    \n#### 虚拟-8086 模式（IA-32 或以上）\n保护模式的能力之一是可以直接在受保护的多任务环境中执行“实地址模式”8086 软件。\n\n此功能称为虚拟-8086\
    \ 模式，尽管它实际上不是处理器模式。虚拟-8086 模式实际上是可以为任何任务启用的保护模式属性。\n\n#### 系统管理模式（SMM）（IA-32 或以上）\n\
    - 此模式为操作系统或执行程序提供一种透明机制，用于实现平台特定功能，例如电源管理和系统安全。\n- 在 SMM 中，处理器切换到单独的地址空间，同时保存当前正在运行的程序或任务的基本上下文。然后可以透明地执行\
    \ SMM 特定代码。\n- 从 SMM 返回后，处理器将被置于系统管理中断之前的状态。\n\n#### IA-32e 模式（Intel64 或以上）\n\
    ##### 兼容模式（IA-32e 模式的子模式）\n- 兼容模式允许大多数传统 16 位和 32 位应用程序在 64 位操作系统下无需重新编译即可运行。\n\
    - 在虚拟 8086 模式下运行或使用硬件任务管理的传统应用程序在此模式下将无法工作。\n- 应用程序只能访问前 4 GByte 的线性地址空间。兼容模式使用\
    \ 16 位和 32 位地址和操作数大小。\n\n##### 64 位模式（IA-32e 模式的子模式）\n- 此模式使 64 位操作系统能够运行编写为访问\
    \ 64 位线性地址空间的应用程序。\n- 64 位模式将通用寄存器和 SIMD 扩展寄存器的数量从 8 扩展到 16。\n- 通用寄存器扩展到 64 位。该模式还引入了新的操作码前缀（REX）以访问寄存器扩展。\n\
    \n## 1.3 实地址模式内存模型\n### 基础\n- 内存单元按字节寻址。\n- 多字节对象存储为连续的字节序列，对象的地址由所用字节的最小地址给出。\n\
    - 对于表示对象的字节排序，存在两种常见约定。\n  - little endian：最低有效字节在前，存储在最小地址。\n  - Big endian：最高有效字节在前，存储在最小地址。\n\
    - X86 CPU 使用 little endian。\n\n### 按小端模式\n\n|  |  |  |\n|---|---|---|\n| 12H |\
    \ 0000H | 地址 0000H 处： |\n| 34H | 0001H | 一个字节是 |\n| 56H | 0002H | 12H |\n| 78H\
    \ | 0003H | 一个字是 |\n| 9AH | 0004H | 3412H |\n| BCH | 0005H | 一个双字是 |\n| DEH |\
    \ 0006H | 78563412H |\n| FFH | 0007H | 一个四字是 |\n|  |  | FFDEBC9A78563412H |\n\n"
