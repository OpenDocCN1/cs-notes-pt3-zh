    | I | - | - | - | - | W2 | W1 | W0 |\n\n- **W2 – W0**: Binary code of the highest\
    \ priority level requesting service.\n- **I**: Equal to \"1\" if there is an interrupt.\n\
    \n### SMM operation\n\n| A0 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 0 | × | ESMM | SMM | 0 | 1 | P | RR | RIS |\n\n| ESMM | SMM | Function |\n|---|---|---|\n\
    | 0 | × | No Action |\n| 1 | 0 | Reset special mask |\n| 1 | 1 | Set special mask\
    \ |\n\n### Initial the 8259A\n\n```\nINTM00    EQU  020H  ;8259A port 0\nINTM01\
