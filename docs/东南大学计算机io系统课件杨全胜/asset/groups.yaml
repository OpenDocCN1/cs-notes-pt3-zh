  mdcn: "\n\n## 2.6.6 字符串指令\n\n### 字符串比较指令\n\nSCAS 示例：\n\n在字符串 \"That is CAI\" 中搜索\
    \ 'a'，如果找到，则跳转到 FOUND\n\n```\nString BYTE \"That is CAI\"\n......\nCLD\nLEA EDI,\
    \ String\nMOV AL, 'a'\nMOV CX, 11\nREPNZ SCASB\nJZ FOUND\n......\nFOUND:\n```\n\
    \n### 字符串比较指令\n\n### CMPS 指令\n\n- 比较数据段中由 (E)SI 寻址的位置与附加段中由 (E)DI 寻址的位置的字节、字或双字。\n\
    - 也可以使用 REPZ/REPE 或 REPNZ/REPNE 前缀。\n\n| 汇编语言 | 操作 |\n|---|---|\n| CMPSB | DS:[SI]-ES:[DI];\
    \ if (DF=0) DI=DI+1 else DI=DI-1 |\n| CMPSW | DS:[SI]-ES:[DI]; if (DF=0) DI=DI+2\
    \ else DI=DI-2 |\n| CMPSD | DS:[SI]-ES:[DI]; if (DF=0) DI=DI+4 else DI=DI-4 |\n\
    \n### 字符串比较指令\n\n> **CMPS 示例**  \n> 比较 string1 和 string2，如果相同，则跳转到 NEXT\n\n```\n\
    String1  DB 'HELP'\nString2  DB 'HEPP'\n\n.....\nCLD\nLEA  SI, String1\nLEA  DI,\
    \ String2\nMOV  CX, 4\nREPZ CMPSB\nJZ   NEXT\n\n.....\nNEXT:\n```\n\n### 字符串比较指令\n\
    \n示例：\n\n比较 SOURCE 和 DESTIN，如果不同，则将 SOURCE 中第一个不匹配的字符加载到 AL 寄存器中\n\n```\n...\n\
    LEA SI, SOURCE\nLEA DI, DESTIN\nCLD\nMOV CX,100\nREPZ CMPSB\nJCXZ MATCH\nDEC SI\
    \ ; When terminal the loop, (E)SI and\n; (E)DI point to the next position\nLODSB\n\
    ...\n```\n\nMATCH:\n\n## 2.6.7 过程指令\n\n- 过程基础\n- 过程指令\n- 过程定义\n- 参数传递\n\n### 过程基础\n\
    \n- 过程是一组通常执行一个任务的指令。\n- 过程是软件中可重用的部分，只存储在内存中一次，但可根据需要多次使用。\n- 过程可以被其他程序调用。\n\
    - CALL 指令链接到过程，RET 指令从过程返回。\n  - 链接和返回会占用计算机少量时间。\n  - 栈存储返回地址。\n\n### 过程指令\n\n\
    - **CALL**\n  - 将程序的流程转移到过程。\n  - CALL 与 JMP 的不同之处在于 CALL 将返回地址压入栈。\n- **RET**\n\
    \  - 从栈中弹出返回地址并将控制返回到该位置（程序中 CALL 之后的指令）。\n\n![](img/d7c975450dfbe59120092c2721be78c6_271_0.png)\n\
    \n### 过程指令\n\n远调用到不同段（8086 的 .model small）\n\n```\nCALL FAR PTR procname\n```\n\
    \n直接调用\n\n- 1. SP<--(SP)-2\n- 2. ((SP)+1,(SP))<--(CS)\n- 3. SP<--(SP)-2\n- 4.\
    \ ((SP)+1,(SP))<--(IP)\n- 5. IP<-- offset of procname\n- 6. CS<-- seg of procname\n\
    \n### 过程指令\n\n远调用到不同段（8086 的 .model small）\n\n```\nCALL DWORD PTR mem32/48\n```\n\
    \n间接调用\n\n- 1. (E)SP<--((E)SP)-2\n- 2. (((E)SP)+1,((E)SP))<--(CS)\n- 3. SP<--(SP)-2/4\n\
    - 4. (((E)SP)+1/3,((E)SP))<--((E)IP)\n- 5. (E)IP<--(EA)\n- 6. CS<--(EA+2/4)\n\n\
    ### 过程指令\n\n◆ call（80386 或以上 .model flat）\n\n```\nCALL  procname\n```\n\n☞ 直接调用\n\
    \n- 1. ESP←(ESP)-4\n- 2. ((ESP)+3,(ESP)+2,(ESP)+1,(ESP))←(EIP)\n- 3. EIP←(EIP)+disp32\n\
    \n```\nCALL  reg/mem32\n```\n\n☞ 间接调用\n\n- 1. ESP←(ESP)-4\n- 2. ((ESP)+3,(ESP)+2,(ESP)+1,(ESP))←(EIP)\n\
    - 3. EIP←reg32 or EIP←mem32\n\n### 过程指令\n\n- 从过程返回\n\n```\nRET [exp]\n```\n\n\
    | 汇编 | 功能 | 操作 |\n|---|---|---|\n| RET | 在当前段返回 | IP<--((SP)+1,(SP)) SP<--(SP)+2\
    \ |\n| RET | 从不同段返回 | IP<--((SP)+1,(SP)) SP<--(SP)+2 CS<--((SP)+1,(SP)) SP<--(SP)+2\
    \ |\n| RET EXP | 带有数据的返回 | 除以上外，还执行 SP<--(SP)+EXP |\n\n"
