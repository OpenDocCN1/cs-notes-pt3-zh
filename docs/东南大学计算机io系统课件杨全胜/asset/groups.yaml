    ,13,10,'$'\nbuff2  BYTE 20 DUP('$')\n.code\nstart:\n    mov ax,@data\n    mov\
    \ ds,ax\n    mov es,ax\n\n    mov si,offset buff1\n    mov di,offset buff2\n \
    \   mov cx,14\n    cld\n    rep movsb\n    mov dx,offset buff2\n    mov ah,9\n\
    \    int 21h   ; print string\n    mov ax,4c00h\n    int 21h   ; exit\nend start\n\
    ```\n\n#### INS Instruction\n\n- Transfers a byte, word, or doubleword of data\
