    \ 4), 1476H\n```\n\n```\nVAR2 BYTE 2 DUP(? , 2 DUP('A', 'B'))\n```\n\n| VAR1 |\n\
    |------|\n| 02H |\n| 00H |\n| 04H |\n| 00H |\n| 02H |\n| 00H |\n| 04H |\n| 00H\
    \ |\n| 76H |\n| 14H |\n\n| VAR2 |\n|------|\n| ? |\n| 'A' |\n| 'B' |\n| 'A' |\n\
    | 'B' |\n| ? |\n| 'A' |\n| 'B' |\n| 'A' |\n| 'B' |\n\n### 数据定义\n### 声明和引用数组\n\
    ### 数组的 LENGTHOF、SIZEOF 和 TYPE\n\n```\narray WORD 40 DUP (5)\nlarray EQU LENGTHOF\
    \ array ; 40 elements\nsarray EQU SIZEOF array      ; 80 bytes\ntarray EQU TYPE\
    \ array        ; 2 bytes per element\nnum DWORD 4, 5, 6, 7, 8, 9, 10, 11\nlnum\
    \ EQU LENGTHOF num        ; 8 elements\nsnum EQU SIZEOF num          ; 32 bytes\n\
    t num EQU TYPE num           ; 4 bytes per element\nwarray WORD 40 DUP (40 DUP\
    \ (5))\nlen EQU LENGTHOF warray      ; 1600 elements\nsiz EQU SIZEOF warray  \
