    \ keyboard | 17H | LPT |\n| 20H | Return to DOS | 21H | DOS system calls |\n|\
    \ 23H | Ctrl+Break | 24H | DOS serious error |\n| 33H | Mouse | 2FH | DOS Protected\
    \ mode interface |\n|  |  | 31H |  |\n\n## Exception\n\n### Software-Generated\
    \ Exceptions\n\n- The INTO, INT 3, and BOUND instructions permit exceptions to\
    \ be generated in software.\n\n### Machine-Check Exceptions\n\n- The P6 family\
    \ and Pentium processors provide both internal and external machine-check mechanisms\
    \ for checking the operation of the internal chip hardware and bus transactions.\n\
    \n- These mechanisms are implementation dependent.\n\n- When a machine-check error\
    \ is detected, the processor signals a machine-check exception (vector 18) and\
    \ returns an error code.\n\n## 8259A in PCH\n\nTwo cascaded 8259A with 15 interrupts\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_387_0.png)\n\n- Two cascaded 8259A\
    \ with 15 interrupts\n\n- Initial the master controller\n\n```\nINTM00    EQU\
    \    020H    ; Master 8259A port 0\nINTM01    EQU    021H    ; Master 8259A port\
    \ 1\n......\nMOV AL, 00010001B ; ICW1: edge trigger, ICW4 needed, cascaded, need\
    \ ICW3\nOUT INTM00, AL\nJMP SHORT $+2    ; delay\nMOV AL, 00001000B ; ICW2: interrupt\
    \ vector number of IR0 is 08H\nOUT INTM01, AL\nJMP SHORT $+2\nMOV AL, 00000100B\
    \ ; ICW3: INT signal of slave connect on IR2 pin in master\nOUT INTM01, AL\nJMP\
    \ SHORT $+2\nMOV AL, 00010001B ; ICW4: Non buffered, special full nested, EOI\n\
    OUT INTM01, AL\nJMP SHORT $+2\n```\n\n- Two cascaded 8259A with 15 interrupts\n\
    \nInitial the slave controller\n\n```\nINTS00      EQU    0A0H    ; Slave 8259A\
    \ port 0\nINTS01      EQU    0A1H    ; Slave 8259A port 1\n......\nMOV AL, 00010001B\
    \ ;ICW1:edge trigger, ICW4 needed, cascaded, need ICW3\nOUT INTS00, AL\nJMP SHORT\
    \ $+2\nMOV AL, 01110000B ;ICW2: interrupt vector number of IR0 is 70H\nOUT INTS01,\
    \ AL\nJMP SHORT $+2\nMOV AL, 00000010B ;ICW3: INT signal of slave connect on IR2\
