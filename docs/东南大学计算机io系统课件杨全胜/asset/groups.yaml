    standards for serial binary single-ended data and control signals connecting between
    a DTE and a DCE. It is commonly used in computer serial ports.

    +     - DTE-Data Terminal Equipment

    +     - DCE- Data Communication Equipment

    +     - Some RS-232 devices are still found especially in industrial machines
