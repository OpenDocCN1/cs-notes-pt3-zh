  mdcn: "\n\n## 2.6.2 算术指令\n## 乘法和除法\n\n- 无符号乘法\n  - `MUL SRC`\n- 有符号乘法\n  - `IMUL\
    \ SRC`\n\n| 符号 | 操作 |\n|---|---|\n| `MUL/IMUL reg/mem8` | `AX ← AL * reg/mem8`\
    \ |\n| `MUL/IMUL reg/mem16` | `DX:AX ← AX * reg/mem16` |\n| `MUL/IMUL reg/mem32`\
    \ | `EDX:EAX ← EAX * reg/mem32` |\n\n### 无符号乘法\n\n```\nMUL SRC\n```\n\n### 有符号乘法\n\
    \n```\nIMUL SRC\n```\n\n乘法后的乘积始终是双倍宽度的乘积。\n\n该指令会影响 CF 和 OF\n\n- CF=OF=1：表示乘积的高位半部分不为零\n\
    - CF=OF=0：表示乘积的高位半部分为零\n- 对其他标志的改变无意义\n\n## MUL, IMUL 示例\n\n### MUL BL\n\n(AL)=0B4H=180\n\
    (BL)=11H=17\n\n1011 0100\n× 0001 0001\n1011 0100\n1011 0100\n1011 1111 0100\n\n\
    (AX)=0BF4H=3060\n\n### IMUL BL\n\n(AL)=0B4H= -76,\n(BL)=11H=17\n-76补=4CH\n\n0100\
    \ 1100\n× 0001 0001\n0100 1100\n0100 1100\n0101 0000 1100\n\n(AX)=(-050C)补\n=FAF4H=\
    \ -1292\n\n## 乘法和除法\n\n### 一种特殊的带符号乘法\n\n```\nIMUL REG, SRC\nIMUL REG, SRC, IMM\n\
    ```\n\n乘积、REG 和 SRC 尺寸相同，为 16 位或 32 位\n\n| 符号 | 操作 |\n|---|---|\n| IMUL *reg16/32,\
    \ reg/mem16/32* | Reg16/32=reg16/32*reg/mem16/32 |\n| IMUL *reg16/32, reg/mem16/32,\
    \ imm8* | Reg16/32=reg/mem16/32*sign-extended imm8 |\n| IMUL *reg16, reg/mem16,\
    \ imm16* | Reg16=reg/mem16*sign-extended imm16 |\n| IMUL *reg32, reg/mem32, imm32*\
    \ | Reg32=reg/mem32*sign-extended imm32 |\n\n- 无符号除法\n  - DIV SRC\n- 有符号除法\n \
    \ - IDIV SRC\n\n| 符号 | 操作 |\n|---|---|\n| DIV/IDIV reg/mem8 | AX 除以 reg/mem8<br>AL←商,\
    \ AH←余数 |\n| DIV/IDIV reg/mem16 | DX:AX 除以 reg/mem16<br>AX←商, DX←余数 |\n| DIV/IDIV\
    \ reg/mem32 | EDX:EAX 除以 reg/mem32<br>EAX←商, EDX←余数 |\n\n### 无符号除法\n`DIV SRC`\n\
    \n### 有符号除法\n`IDIV SRC`\n\n### 除法过程中发生的错误\n\n- 尝试除以零；\n- 商过大，无法放入单长度的目的地\n  -\
    \ 2468AH ÷ 2 = 12345H\n  - 0FFFFFFFH ÷ 1 = 0FFFFFFFFH\n\n除法指令可能会破坏先前设置的 AF、CF、OF、PF、SF\
    \ 和 ZF 的值，但未定义。\n\n### 乘法和除法\n\n- 无符号除法\n\n```\nDIV SRC\n```\n\n- 有符号除法\n\n```\n\
    IDIV SRC\n```\n\n- 商的符号由被除数和除数的符号按照普通的符号规则确定；\n- 余数的符号始终与被除数的符号相同\n\n### ■ 乘法和除法\n\
    \n- ◆ 无符号除法\n  `DIV SRC`\n- ◆ 有符号除法\n  `IDIV SRC`\n\n被除数始终是双倍宽度的被除数\n除以操作数。\n\n\
    - • 对于无符号除法，\n  - 在高位扩展零\n- • 对于有符号除法，\n  - 将符号位扩展到高位\n\n### 符号扩展指令\n\n|  |  |\n\
    |---|---|\n| CBW | : AL 到 AX |\n| CWD | : AX 到 DX:AX |\n| CWDE | : AX 到 EAX |\n\
    | CDQ | : EAX 到 EDX:EAX |\n\n```\nRESILT DB ?\n.....\nMOV AL, -127    ; Dividend(81H)\n\
    CBW             ; Byte extend to word\nMOV BL, 15      ; Divisor\nIDIV BL    \
    \     ; -127/15\nMOV RESULT, AL  ; Quotient\n```\n\n```\nN1  WORD  ?\nN2  WORD\
    \  ?\n\n......\nMOV  AX, 2012      ; Dividend=2012\nMOV  DX, 0         ; Zero\
    \ Extend to DX:AX\nMOV  BX, 1000      ; Divisor = 1000\nDIV  BX            ; 10000H/100H\n\
    MOV  N1, AX        ; Quotient\nMOV  N2, DX        ; Remainder\n```\n\n假设 X、Y、Z、V\
    \ 为 16 位有符号数，计算 (V-(X*Y+Z))/X。商在 AX，余数在 DX\n\n```\nMOV  AX, X\nIMUL Y        \
    \         ; X*Y\nMOV  CX, AX\nMOV  BX, DX            ; store in BX: CX\nMOV  AX,\
    \ Z\nCWD                    ; signed extend the Z\nADD  CX, AX            ; X*Y+Z\n\
    ADC  BX, DX\nMOV  AX, V\nCWD                    ; signed extend the V\nSUB  AX,\
    \ CX            ; -\nSBB  DX, BX\nIDIV X                 ; Divided by X\n```\n"
