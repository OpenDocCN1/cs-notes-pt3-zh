  - '[PAGE 356]


    # 4.2 8259A PIC


    # General Description of the 8259A


    # Response of the interrupt in 8259A


    +   - When 8259 sent INT signal to processor, it will wait two INTA# pulse from
    processor for acknowledge.

    +   - The PIC uses the first INTA# pulse to freeze the state of the interrupts
    for priority resolution. Additionally, the ISR for the interrupt is set, the IRR
    for the interrupt is cleared.

    +   - On the second INTA# pulse, the PIC sends the interrupt vector number to
    the processor. The ISR bit be cleared when:

    +     - if in AEOI mode, on the trailing edge of the second INTA#;

    +     - if in Normally mode, the processor issues an EOI command immediately before
    returning from the service routine.'
  - '[PAGE 357]


    # 4.2 8259A PIC


    # Modes of Operation


    # Edge and Level Triggered Mode


    # Edge Triggered mode


    +   - An interrupt request will be recognized by a low-to-high transition on the
    corresponding IRQ input.


    # Level Triggered mode


    +   - An interrupt request will be recognized by a high level on the corresponding
    IRQ input and there is no need for an edge detection.


    In both the edge and level triggered modes, the IRQ inputs must remain active
    until after the falling edge of the first internal INTA#. If the IRQ input goes
    inactive before this time, a default IRQ7 vector number is returned.'
  - '[PAGE 358]


    # 4.2 8259A PIC


    # Modes of Operation


    # ◆ Poll Mode


    In this mode, the INT output function as it normally does, but the microprocessor
    should ignore this output. Service to devices is achieved by software using a
    Poll command.


    # ◆ Nested Mode


    # Full nested mode


    +   • While the ISR bit is set, all further interrupts of the same or lower priority
    are inhibited.


    # Special Fully-Nested Mode


    +   • While the ISR bit is set, all further interrupts of the lower priority are
    inhibited.'
  - '[PAGE 359]


    # 4.2 8259A PIC


    # Modes of Operation


    # Buffered Mode


    +   - When the 8259A is used in a large system where bus driving buffers are required
    on the data bus, it will structure the 8259A to send an enable signal on SP#/EN#
    to enable the buffers.

    +   - This modification forces the use of software programming to determine whether
    the 8259A is a master or a slave.


    # Non-buffered Mode


    +   - SP#/EN# = 1; 8259A is the master controller

    +   - SP#/EN# = 0; 8259A is the slave controller'
  - '[PAGE 360]


    # 4.2 8259A PIC


    # Modes of Operation


    # Mask Mode


    # Normal Mask Mode


    +   - Each bit in the IMR masks one interrupt channel if it is set (1). Bit 0
    masks IR0, Bit 1 masks IR1 and so forth.


    # Special Mask Mode


    +   - When a mask bit is set in OCW1, it inhibits further interrupts at that level
    and enables interrupts from all other levels (lower as well as higher) that are
    not masked.'
  - '[PAGE 361]


    # 4.2 8259A PIC


    # Modes of Operation


    # Priority Mode


    # Fixed Priority


    +   - The interrupt requests are ordered in priority from 0 through 7 (0 highest).


    # Rotation Priority


    (The IR0 ~ IR7 priority as a circular queue.)


    +   - Automatic Rotation

    +     - In this mode a device, after being serviced, receives the lowest priority.


    +   - Specific Rotation

    +     - The programmer can change priorities by programming the bottom priority
    and thus fixing all other priorities; i.e., if IR4 is programmed as the bottom
    priority device, then IR5 will have the highest'
  - '[PAGE 362]


    # 4.2 8259A PIC


    # Modes of Operation


    # End of Interrupt


    # Normally Mode


    +   - The ISR bit can be reset by an EOI command that must be issued to the 8259A
    before returning from a service routine.

    +     - When a **Non-Specific EOI command** is issued the 8259A will automatically
    reset the highest IS bit of those that are set.

    +     - **Specific EOI command** includes the IS level to be reset as part of
    the command.


    # Automatic End of Interrupt (AEOI) Mode


    +   - The 8259A will automatically perform a non-specific EOI operation at the
    trailing edge of the last INTA#'
  md: "\n## 4.2 8259A PIC\n\n## General Description of the 8259A\n\nPIC: Programmable\
    \ Interrupt controller\n\n## Function\n\n- Accept extern interrupt request;\n\
    - Manage the interrupt request (queued, priority, mask, nested);\n- Sends the\
    \ interrupt request signal(INTR) and interrupt vector number to the microprocessor;\n\
    - Processes the end of interrupt;\n- Accept the command come from the processor\
    \ and return the status.\n\n## 4.2 8259A PIC\n\n## General Description of the\
    \ 8259A\n\n### 8259A Internal structure\n\n![](img/d7c975450dfbe59120092c2721be78c6_354_0.png)\n\
    \n## 4.2 8259A PIC\n\n## General Description of the 8259A\n\n## Response of the\
    \ interrupt in 8259A\n\n- When 8259 sent INT signal to processor, it will wait\
    \ two INTA# pulse from processor for acknowledge.\n- The PIC uses the first INTA#\
    \ pulse to freeze the state of the interrupts for priority resolution. Additionally,\
    \ the ISR for the interrupt is set, the IRR for the interrupt is cleared.\n- On\
    \ the second INTA# pulse, the PIC sends the interrupt vector number to the processor.\
    \ The ISR bit be cleared when:\n  - if in AEOI mode, on the trailing edge of the\
    \ second INTA#;\n  - if in Normally mode, the processor issues an EOI command\
    \ immediately before returning from the service routine.\n\n## 4.2 8259A PIC\n\
    \n## Modes of Operation\n\n## Edge and Level Triggered Mode\n\n### Edge Triggered\
    \ mode\n\n- An interrupt request will be recognized by a low-to-high transition\
    \ on the corresponding IRQ input.\n\n### Level Triggered mode\n\n- An interrupt\
    \ request will be recognized by a high level on the corresponding IRQ input and\
    \ there is no need for an edge detection.\n\nIn both the edge and level triggered\
    \ modes, the IRQ inputs must remain active until after the falling edge of the\
    \ first internal INTA#. If the IRQ input goes inactive before this time, a default\
    \ IRQ7 vector number is returned.\n\n## 4.2 8259A PIC\n\n## Modes of Operation\n\
    \n### Poll Mode\n\nIn this mode, the INT output function as it normally does,\
    \ but the microprocessor should ignore this output. Service to devices is achieved\
    \ by software using a Poll command.\n\n### Nested Mode\n\n#### Full nested mode\n\
    \n- While the ISR bit is set, all further interrupts of the same or lower priority\
    \ are inhibited.\n\n#### Special Fully-Nested Mode\n\n- While the ISR bit is set,\
    \ all further interrupts of the lower priority are inhibited.\n\n## 4.2 8259A\
    \ PIC\n\n## Modes of Operation\n\n### Buffered Mode\n\n- When the 8259A is used\
    \ in a large system where bus driving buffers are required on the data bus, it\
    \ will structure the 8259A to send an enable signal on SP#/EN# to enable the buffers.\n\
    - This modification forces the use of software programming to determine whether\
    \ the 8259A is a master or a slave.\n\n### Non-buffered Mode\n\n- SP#/EN# = 1;\
    \ 8259A is the master controller\n- SP#/EN# = 0; 8259A is the slave controller\n\
    \n## 4.2 8259A PIC\n\n## Modes of Operation\n\n### Mask Mode\n\n#### Normal Mask\
    \ Mode\n\n- Each bit in the IMR masks one interrupt channel if it is set (1).\
    \ Bit 0 masks IR0, Bit 1 masks IR1 and so forth.\n\n#### Special Mask Mode\n\n\
    - When a mask bit is set in OCW1, it inhibits further interrupts at that level\
    \ and enables interrupts from all other levels (lower as well as higher) that\
    \ are not masked.\n\n## 4.2 8259A PIC\n\n## Modes of Operation\n\n### Priority\
    \ Mode\n\n#### Fixed Priority\n\n- The interrupt requests are ordered in priority\
    \ from 0 through 7 (0 highest).\n\n#### Rotation Priority\n\n(The IR0 ~ IR7 priority\
    \ as a circular queue.)\n\n- Automatic Rotation\n  - In this mode a device, after\
    \ being serviced, receives the lowest priority.\n\n- Specific Rotation\n  - The\
    \ programmer can change priorities by programming the bottom priority and thus\
    \ fixing all other priorities; i.e., if IR4 is programmed as the bottom priority\
    \ device, then IR5 will have the highest\n\n## 4.2 8259A PIC\n\n## Modes of Operation\n\
    \n### End of Interrupt\n\n#### Normally Mode\n\n- The ISR bit can be reset by\
    \ an EOI command that must be issued to the 8259A before returning from a service\
    \ routine.\n  - When a Non-Specific EOI command is issued the 8259A will automatically\
    \ reset the highest IS bit of those that are set.\n  - Specific EOI command includes\
    \ the IS level to be reset as part of the command.\n\n#### Automatic End of Interrupt\
    \ (AEOI) Mode\n\n- The 8259A will automatically perform a non-specific EOI operation\
    \ at the trailing edge of the last INTA#\n"
  mdcn: "\n\n## 4.2 8259A PIC\n\n## 8259A 的总体描述\n\nPIC: 可编程中断控制器\n\n## 功能\n\n- 接受外部中断请求；\n\
    - 管理中断请求（排队、优先级、屏蔽、嵌套）；\n- 向微处理器发送中断请求信号(INTR) 和中断向量号；\n- 处理中断结束；\n- 接受来自处理器的命令并返回状态。\n\
    \n## 4.2 8259A PIC\n\n## 8259A 的总体描述\n\n### 8259A 内部结构\n\n![](img/d7c975450dfbe59120092c2721be78c6_354_0.png)\n\
    \n## 4.2 8259A PIC\n\n## 8259A 的总体描述\n\n## 8259A 中断响应\n\n- 当 8259 向处理器发送 INT 信号时，它会等待处理器发出的两个\
    \ INTA# 脉冲以进行应答。\n- PIC 使用第一个 INTA# 脉冲来冻结中断状态以进行优先级解析。此外，该中断的 ISR 被置位，该中断的 IRR\
    \ 被清除。\n- 在第二个 INTA# 脉冲时，PIC 向处理器发送中断向量号。ISR 位将在以下情况下被清除：\n  - 如果处于 AEOI 模式，则在第二个\
    \ INTA# 的下降沿；\n  - 如果处于正常模式，则在返回服务程序之前处理器发出 EOI 命令。\n\n## 4.2 8259A PIC\n\n##\
    \ 工作模式\n\n## 边沿触发和电平触发模式\n\n### 边沿触发模式\n\n- 中断请求将通过对应 IRQ 输入上的低到高跳变来识别。\n\n###\
    \ 电平触发模式\n\n- 中断请求将通过对应 IRQ 输入上的高电平来识别，无需边沿检测。\n\n在边沿触发和电平触发模式下，IRQ 输入必须保持有效直到第一个内部\
    \ INTA# 的下降沿之后。如果在此之前 IRQ 输入变为无效，则返回默认的 IRQ7 向量号。\n\n## 4.2 8259A PIC\n\n## 工作模式\n\
    \n### 轮询模式\n\n在此模式下，INT 输出功能与正常时相同，但微处理器应忽略此输出。通过使用轮询命令，通过软件实现对设备的服务。\n\n### 嵌套模式\n\
    \n#### 完全嵌套模式\n\n- 当 ISR 位被置位时，所有相同或更低优先级的进一步中断将被禁止。\n\n#### 特殊完全嵌套模式\n\n- 当 ISR\
    \ 位被置位时，所有更低优先级的进一步中断将被禁止。\n\n## 4.2 8259A PIC\n\n## 工作模式\n\n### 缓冲模式\n\n- 当 8259A\
    \ 在需要数据总线上使用总线驱动缓冲器的较大系统中时，将配置 8259A 在 SP#/EN# 上发送使能信号以使能缓冲器。\n- 此修改强制使用软件编程来确定\
    \ 8259A 是主设备还是从设备。\n\n### 非缓冲模式\n\n- SP#/EN# = 1；8259A 是主控制器\n- SP#/EN# = 0；8259A\
    \ 是从控制器\n\n## 4.2 8259A PIC\n\n## 工作模式\n\n### 屏蔽模式\n\n#### 正常屏蔽模式\n\n- IMR 中的每个位如果被置位（1）则屏蔽一个中断通道。位\
    \ 0 屏蔽 IR0，位 1 屏蔽 IR1，以此类推。\n\n#### 特殊屏蔽模式\n\n- 当 OCW1 中的屏蔽位被置位时，它会禁止该级别的进一步中断，并使能所有其他未被屏蔽的级别（较低和较高）的中断。\n\
    \n## 4.2 8259A PIC\n\n## 工作模式\n\n### 优先级模式\n\n#### 固定优先级\n\n- 中断请求按 0 到 7 的顺序排列优先级（0\
    \ 为最高）。\n\n#### 轮转优先级\n（IR0 ~ IR7 优先级作为循环队列。）\n\n- 自动轮转\n  - 在此模式下，设备在被服务后获得最低优先级。\n\
    \n- 特定轮转\n  - 程序员可以通过编程底部优先级来更改优先级，从而固定所有其他优先级；即，如果 IR4 被编程为底部优先级设备，则 IR5 将具有最高\n\
    \n## 4.2 8259A PIC\n\n## 工作模式\n\n### 中断结束\n\n#### 正常模式\n\n- ISR 位可以通过 EOI 命令重置，该命令必须在从服务程序返回之前发出给\
    \ 8259A。\n  - 当发出非特定 EOI 命令时，8259A 将自动重置已置位的最高 IS 位。\n  - 特定 EOI 命令包含要重置的 IS 级别作为命令的一部分。\n\
    \n#### 自动中断结束（AEOI）模式\n\n- 8259A 将在最后一个 INTA# 的下降沿自动执行非特定 EOI 操作\n\n"
