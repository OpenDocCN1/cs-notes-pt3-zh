    \ |\n| doublewords | 32 | 0~2³²-1 (4G-1) | -2³¹~+2³¹-1 |\n| quadwords | 64 | 0~2⁶⁴-1\
    \ (16T-1) | -2⁶³~+2⁶³-1 |\n\n### Numeric Data Types\n\n### Integer\n\n### Unsigned\
    \ Integers\n\n- Unsigned integers are unsigned binary numbers contained in a byte,\
    \ word, doubleword, and quadword.\n- Unsigned integers are sometimes referred\
    \ to as ordinals.\n\n### Signed Integers\n\n- Signed integers are signed binary\
    \ numbers held in a byte, word, doubleword, or quadword.\n- All operations on\
    \ signed integers assume a two's complement representation.\n\n- The sign bit\
    \ is located in most significant bit(MSb).\n\n| Class | Two's Complement Encoding\
    \ |  |\n| --- | --- | --- |\n|  | Sign |  |\n| Positive | Largest | 0 | 11...11\
    \ |\n|  | ... | ... | ... |\n|  | Smallest | 0 | 00...01 |\n| Zero |  | 0 | 00...00\
    \ |\n| Negative | Largest | 1 | 11...11 |\n|  | ... | ... | ... |\n|  | Smallest\
    \ | 1 | 00...00 |\n\n### Floating-Point Data Types\n\nThe IA-32 architecture defines\
    \ and operates on three floating-point data types:\n\n- single-precision floating-point\n\
    - double-precision floating-point\n- double-extended precision floating-point\n\
    \nThe data formats for these data types correspond directly to formats specified\
