  - '[PAGE 85]


    # 1.6.3 Stack Memory Addressing Modes


    +   - What is stack?

    +     - Stack holds data temporarily stores the return address used by procedures.

    +     - The stack memory is a LIFO(last-in, first-out) memory.


    +   - Stack memory addressing Modes

    +     - It is contained in a segment and identified by the segment selector in
    the SS register.

    +     - The SP register always point to an area of memory located within the stack
    segment.

    +     - Items are placed on the stack using the PUSH instruction and removed from
    the stack using the POP instruction.'
  - '[PAGE 86]


    # 1.6.3 Stack Memory Addressing Modes


    # PUSH operation


    +   - Whenever a word of data is pushed onto the stack, the high-order 8 bit are
    placed in the location addressed by SP-1; The low-order 8 bit are placed in the
    location addressed by SP-2.


    +   - The SP is then decremented by 2 so that the next word of data is stored
    in the next available stack memory location.


    # POP operation


    +   - Whenever a word of data is popped from the stack, the low-order 8 bit are
    removed from the location addressed by SP. The high-order 8 bit are removed from
    the location addressed by SP+1.


    +   - The SP is then incremented by 2.'
  - '[PAGE 87]


    # 1.6.3 Stack Memory Addressing Modes


    # Note


    +   - The PUSH and POP store or retrieve words of data—never byte—in the 8086
    through the 80286 microprocessor. 80386 and above allow words or doublewords.

    +   - Data may be popped off the stack into any register or any segment register
    except CS.

    +   - The SP register add to SS × 10H to form the stack memory address in the
    real mode.


    ```

    Example:

    PUSH  AX

    POP   DS

    ```'
