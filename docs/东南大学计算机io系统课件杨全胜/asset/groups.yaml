    | STOSB | ES:[DI]=AL; if (DF=0) DI=DI+1 else DI=DI-1 |\n| STOSW | ES:[DI]=AX;\
    \ if (DF=0) DI=DI+2 else DI=DI-2 |\n| STOSD | ES:[DI]=EAX; if (DF=0) DI=DI+4 else\
    \ DI=DI-4 |\n\n#### STOS with a REP prefix\n\n- The REP prefix causes (E)CX to\
    \ be decremented by 1 each time the string instruction executes. Then the string\
    \ instruction repeats. If (E)CX reaches a value of 0, the instruction terminates\
    \ and the program continues with the next sequential instruction.\n\n#### STOS\
    \ Instruction example\n\nClear the buffer\n\n```asm\n.DATA\nBUFF DB 1000 DUP(?)\
    \  ; define the buffer\n.CODE\n        ......\nCLD                    ; DF=0\n\
    LEA  DI, BUFF          ; address of buff-->DI\nMOV  CX, 1000          ; the number\
    \ of repetitions\nMOV  AL, 0             ; 0-->AL\nREP  STOSB             ; store\
    \ 0 to clear\n```\n\n#### MOVS Instruction\n\n- Transfers a byte, word, or doubleword\
    \ from the data segment location addressed by (E)SI to the extra segment location\
    \ addressed by (E)DI.\n- MOVS can also be used with a REP prefix.\n\n| Assembly\
    \ Language | Operation |\n|---|---|\n| MOVSB | ES:[DI]=DS:[SI]; if (DF=0) {SI=SI+1;\
    \ DI=DI+1} else {SI=SI-1; DI=DI-1} |\n| MOVSW | ES:[DI]=DS:[SI]; if (DF=0) {SI=SI+2;\
    \ DI=DI+2} else {SI=SI-2; DI=DI-2} |\n| MOVSD | ES:[DI]=DS:[SI]; if (DF=0) {SI=SI+4;\
    \ DI=DI+4} else {SI=SI-4; DI=DI-4} |\n\n#### MOVS Instruction example for 16-bit\
    \ program\n\n```asm\n.8086                ; create 16 bit code\n.model small \
