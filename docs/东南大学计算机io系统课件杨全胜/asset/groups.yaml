    ### 引脚排列和引脚功能\n### 最小模式\n\n- 是运行 8086/8088 的最经济方式\n- 内存或 I/O 的所有控制信号均由 CPU 生成。\n\
    - 该模式运行是通过将模式选择引脚 MN/MX 连接到 +5V 获得的。\n- 我们所有的实验都基于最小模式。\n\n![](img/d7c975450dfbe59120092c2721be78c6_311_0.png)\n\
    \n## 3.4 8086/8088 硬件\n### 引脚排列和引脚功能\n### 我们将使用的 8086 引脚\n\n- CLK : I, 时钟引脚为微处理器提供基本时序信号。\n\
    - AD0~15 : O/IO, 地址/数据总线。当 ALE 为 1 时，传输内存地址或 I/O 端口号的最右 16 位；当 ALE=0 时，传输数据。在\
    \ 8088 中为 AD0~7 和 A8~15\n- A16~19 : O, 当 ALE 为 1 时，传输内存地址最左的 4 位。\n- M/IO* : O,\
    \ 当该信号为逻辑 1 时，表示地址总线包含内存地址，否则包含 I/O 端口号。\n\n* A 或 A# 表示信号 A 在值为 0 时有效。\n\n## 3.4\
    \ 8086/8088 硬件\n### 引脚排列和引脚功能\n### 我们将使用的 8086 引脚\n\n- RD̅ : O, 当读信号为逻辑 0 时，数据总线接收来自内存或\
