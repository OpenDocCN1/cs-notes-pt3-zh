  md: "\n## 4.4 Interrupt process in Modern PC\n\n### Interrupt response\n\nWhen the\
    \ processor finishes execution of the current instruction, CPU response the interrupt,\
    \ (maskable interrupt response according to whether the IF in EFLAGS is 1).\n\n\
    Step of the respond\n\n- 1. Save the return address\n  - Clear the IF and TF in\
    \ EFLAGS\n  - Push EFLAGS, CS and EIP in stack.\n- 2. Obtain the interrupt vector\
    \ number\n  - For the external hardware interrupt, the number obtain from 8259A\
    \ in PCH in the second INTA#.\n  - Other kind of interrupt do not need this step\n\
    - 3. **Obtain the entry location of interrupt-handling program**\n  - Query the\
    \ Interrupt Vector Table or Interrupt Descriptor Table with the vector number\
    \ to get the address via the vector number.\n- 4. **The processor now transfer\
    \ control to the interrupt routine.**\n  - loads the program counter with the\
    \ entry location of interrupt-handling program\n  - processes the interrupt\n\
    - 5. **Return to the breakpoint**\n  - Pop EIP, CS, EFLAGS\n\n### Hardware/Software\
    \ Interrupt Sequence\n\n![](img/d7c975450dfbe59120092c2721be78c6_395_0.png)\n\n\
    - 4. Upon observing its own interrupt acknowledge cycle on PCI, the PCH converts\
    \ it into the two cycles that the internal 8259 pair can respond to. Each cycle\
    \ appears as an interrupt acknowledge pulse on the internal INTA# pin of the cascaded\
    \ interrupt controllers.\n- 5. Upon receiving the first internally generated INTA#\
    \ pulse, the highest priority ISR bit is set and the corresponding IRR bit is\
    \ reset. On the trailing edge of the first pulse, a slave identification code\
    \ is broadcast by the master to the slave on a private, internal three bit wide\
    \ bus. The slave controller uses these bits to determine if it must respond with\
    \ an interrupt vector number during the second INTA# pulse.\n- 6. Upon receiving\
    \ the second internally generated INTA# pulse, the PIC returns the interrupt vector\
    \ number. If no interrupt request is present because the request was too short\
    \ in duration, the PIC returns vector number 7 from the master controller.\n-\
    \ 7. This completes the interrupt cycle. In AEOI mode the ISR bit is reset at\
    \ the end of the second INTA# pulse. Otherwise, the ISR bit remains set until\
    \ an appropriate EOI command is issued at the end of the interrupt subroutine.\n\
    \n### Interrupt Vector Table(IVT) in real mode\n\n- **Interrupt vector(IV)**\n\
    \  - The address of interrupt-handling program corresponding to the vector number.\n\
    \  - Four bytes for each interrupt vector.\n- **Interrupt Vector Table(IVT)**\n\
    \  - The storage area which store the interrupt vector in order of the interrupt\
    \ vector number.\n  - Beginning from the address 0000: 0000,1KB range.\n- **Interrupt\
    \ Vector Pointer(IVP)**\n  - IVP = Vector × 4\n\n00000\nIP\nCS\n00004\nIP\nCS\n\
    4*N\nIP\nCS\nIV for vector 0\nIV for vector 1\nIV for vector N\n\n### Interrupt-handling\
    \ routine programming\n\n- 1) Write the IVT directly.\n\n```\nCLI            \
    \         ; disable the maskable interrupt\nMOV AX, 0\nMOV ES, AX            \
    \  ; ES= 0000H(segment address of IVT)\nMOV SI, 0CH*4           ; 4 bytes for\
    \ each interrupt vector\nMOV AX, OFFSET SERVICE  ; EA of routine\nMOV ES:[SI],\
    \ AX\nMOV AX, SEG SERVICE     ; segment address of routine\nMOV ES:[SI+2], AX\n\
    STI                     ; enable the interrupt\n......\n; interrupt-handling routine\n\
    SERVICE PROC FAR\n......\n```\n\n- 2) use DOS system calls\n\n```\nMOV AX, SEG\
    \ SERVICE\nMOV DS, AX\nMOV DX, OFFSET SERVICE\nMOV AX, 250CH\nINT 21H\n```\n"
  mdcn: "\n\n## 4.4 现代 PC 中的中断过程\n\n### 中断响应\n\n当处理器执行完当前指令后，CPU 响应中断，（根据 EFLAGS 中的\
    \ IF 是否为 1 来响应可屏蔽中断）。\n\n响应的步骤\n\n- 1. 保存返回地址\n  - 清除 EFLAGS 中的 IF 和 TF\n  - 将\
    \ EFLAGS、CS 和 EIP 压入栈中。\n- 2. 获取中断向量号\n  - 对于外部硬件中断，编号在 PCH 中 8259A 的第二次 INTA#\
    \ 中获得。\n  - 其他类型中断不需要此步骤\n- 3. **获取中断处理程序的入口位置**\n  - 使用向量号查询中断向量表或中断描述符表，通过向量号获取地址。\n\
    - 4. **处理器现在将控制权转移到中断例程。**\n  - 用中断处理程序的入口位置加载程序计数器\n  - 处理中断\n- 5. **返回断点**\n\
    \  - 弹出 EIP、CS、EFLAGS\n\n### 硬件/软件中断序列\n\n![](img/d7c975450dfbe59120092c2721be78c6_395_0.png)\n\
    \n- 4. PCH 在 PCI 上观察到自己的中断应答周期时，将其转换为内部 8259 对可以响应的两个周期。每个周期都表现为级联中断控制器内部 INTA#\
    \ 引脚上的中断应答脉冲。\n- 5. 在接收到第一个内部生成的 INTA# 脉冲后，最高优先级 ISR 位被置位，对应的 IRR 位被复位。在第一个脉冲的下降沿，主控制器通过专用内部三位宽总线向从控制器广播从机识别码。从控制器使用这些位来确定是否必须在第二个\
    \ INTA# 脉冲期间返回中断向量号。\n- 6. 在接收到第二个内部生成的 INTA# 脉冲后，PIC 返回中断向量号。如果由于请求持续时间太短而没有中断请求，则\
    \ PIC 从主控制器返回向量号 7。\n- 7. 这完成了中断周期。在 AEOI 模式下，ISR 位在第二个 INTA# 脉冲结束时被复位。否则，ISR\
    \ 位保持置位，直到在中断子程序结束时发出适当的 EOI 命令。\n\n### 实模式下的中断向量表(IVT)\n\n- **中断向量(IV)**\n  -\
    \ 与向量号对应的中断处理程序的地址。\n  - 每个中断向量占四个字节。\n- **中断向量表(IVT)**\n  - 按中断向量号顺序存储中断向量的存储区域。\n\
    \  - 从地址 0000:0000 开始，1KB 范围。\n- **中断向量指针(IVP)**\n  - IVP = 向量 × 4\n\n00000\n\
    IP\nCS\n00004\nIP\nCS\n4*N\nIP\nCS\nIV for vector 0\nIV for vector 1\nIV for vector\
    \ N\n\n### 中断处理例程编程\n\n- 1) 直接写入 IVT。\n\n```\nCLI                     ; disable\
    \ the maskable interrupt\nMOV AX, 0\nMOV ES, AX              ; ES= 0000H(segment\
    \ address of IVT)\nMOV SI, 0CH*4           ; 4 bytes for each interrupt vector\n\
    MOV AX, OFFSET SERVICE  ; EA of routine\nMOV ES:[SI], AX\nMOV AX, SEG SERVICE\
    \     ; segment address of routine\nMOV ES:[SI+2], AX\nSTI                   \
    \  ; enable the interrupt\n......\n; interrupt-handling routine\nSERVICE PROC\
    \ FAR\n......\n```\n\n- 2) 使用 DOS 系统调用\n\n```\nMOV AX, SEG SERVICE\nMOV DS, AX\n\
    MOV DX, OFFSET SERVICE\nMOV AX, 250CH\nINT 21H\n```\n\n"
