    \ Arithmetic Instructions\n\n- Addition, Subtraction, and Comparison\n- Multiplication\
    \ and Division\n- BCD and ASCII Arithmetic\n\n### Addition, Subtraction, and Comparison\n\
    ### Addition instruction\n\n```\nADD DST, SRC\n```\n\n- DST←(DST)+(SRC)\n- This\
    \ instruction have an affect on CF, SF, OF, PF, ZF and AF\n\n| Symbolic | Example\
    \ |\n|---|---|\n| ADD reg8/16/32, imm8/16/32 | ADD AX,837FH |\n| ADD reg8/16/32,\
