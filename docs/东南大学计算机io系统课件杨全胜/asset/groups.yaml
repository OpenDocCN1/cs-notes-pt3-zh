    ### Instruction Pointer Register


    + The instruction pointer ((E)IP) register contains the offset in the current
    code segment for the next instruction to be executed.


    | Higher 16-bits | 16-bits IP |

    |---|---|


    32-bits EIP


    + The EIP register cannot be accessed directly by software; it is controlled implicitly
    by control-transfer instructions (such as JMP, Jcc, CALL, and RET), interrupts,
    and exceptions.


    ### EFLAG Register


    + - The 32-bit (E)FLAGS register contains a group of status flags, a control flag,
    and a group of system flags.

    + - Some of the flags in the EFLAGS register can be modified directly, using special
    purpose instructions.

    + - There are no instructions that allow the whole register to be examined or
    modified directly.


    ![](img/d7c975450dfbe59120092c2721be78c6_44_0.png)


    ## 1.5 Basic Program Execution


    ### The low 12 bits of EFLAG


    | Flag | Name | Description |

    |---|---|---|

    | CF | Carry flag | Set if an arithmetic operation generates a carry or a borrow
    out of the most-significant bit of the result; cleared otherwise. |

    | PF | Parity flag | Set if the least-significant byte of the result contains
    an even number of 1 bits; cleared otherwise. |

    | AF | Adjust flag | Set if an arithmetic operation generates a carry or a borrow
    out of bit 3 of the result; cleared otherwise. |

    | ZF | Zero flag | Set if the result is zero; cleared otherwise. |


    | b15 |  |  |  | OF | DF | IF | TF | SF | ZF |  | AF |  | PF |  | CF | b0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | SF | Sign flag | Set equal to the most-significant bit of the result, which
    is the sign bit of a signed integer. |

    | TF | Trap flag | Set to enable single-step mode for debugging; clear to disable
    single-step mode. |

    | IF | Interrupt enable flag | Set to respond to maskable interrupts; cleared
    to inhibit maskable interrupts. |


    ![](img/d7c975450dfbe59120092c2721be78c6_47_0.png)


    | Flag | Name | Description |

    |---|---|---|

    | DF | direction flag | Setting the DF flag causes the string instructions to
    auto-decrement. Clearing the DF flag causes the string instructions to auto-increment.
    |

    | OF | Overflow flag | Set if the integer result is too large a positive number
    or too small a negative number (excluding the sign-bit) to fit in the destination
    operand; cleared otherwise. |


    | | 8000H + 8000H

    0000H | C000H + C000H

    8000H | 4008H + 4008H

    8010H | 0808H + C000H

    C808H |

