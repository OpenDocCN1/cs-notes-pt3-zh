    # 1.6 Addressing Modes


    # Operand Addressing


    +   - IA-32 machine-instructions act on zero or more operands. Some operands are
    specified explicitly and others are implicit.


    +   - The data for a source operand can be located in:

    +     - the instruction itself (an immediate operand)

    +     - a register

    +     - a memory location

    +     - an I/O port


    +   - for a destination operand, it can be returned to:

    +     - a register

    +     - a memory location

    +     - an I/O port'
  - '[PAGE 53]


    # 1.6.1 Operand Addressing Modes


    +   Immediate Addressing


    Some instructions use data encoded in the instruction itself as a source operand.


