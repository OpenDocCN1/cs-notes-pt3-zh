    \ |\n\nM — 模式：\n\n| M2 | M1 | M0 |  |\n| 0 | 0 | 0 | 模式 0 |\n| 0 | 0 | 1 | 模式\
    \ 1 |\n| X | 1 | 0 | 模式 2 |\n| X | 1 | 1 | 模式 3 |\n| 1 | 0 | 0 | 模式 4 |\n| 1 |\
    \ 0 | 1 | 模式 5 |\n\nBCD：\n\n|  |  |\n| 0 | 二进制计数器 16 位 |\n| 1 | 二进制编码十进制（BCD）计数器（4\
    \ 位十进制） |\n\n```\ne.g.: MOV AL, 01110100B ; T/C1, least significant byte first\n\
    OUT 43H, AL ; mode 2, Binary\n```\n\n### 初始计数值\n\n不同计数器的初始计数值必须写入不同的地址。\n\n| A1A0\
    \ | 定时器/计数器 |\n| 0 0 | T/C0 |\n| 0 1 | T/C1 |\n| 1 0 | T/C2 |\n\n- 每次写入一个字节\n\n\
    - 初始计数值的范围是：\n\n- 二进制：65536(0000H)、65535(FFFFH)~1(0001H)。\n\n- BCD：10000(0000H)、9999(9999H)~1(0001H)。\n\
    \n### 初始化定时器/计数器\n\n- 1) 对于每个计数器，在写入初始计数值之前必须先写入控制字。\n\n- 2) 初始计数值必须遵循控制字中指定的计数格式\n\
    \n```\ne.g. MOV AL, 01110101B; T/C1, least significant byte first, mode 2, BCD\n\
    OUT 43H, AL\nMOV AX, 2000H ; initial count = 2000\nOUT 41H, AL ;\nMOV AL, AH\n\
    OUT 41H, AL ;\nMOV AL, 00010110B; T/C0, least significant byte only, mode3, Binary\n\
    OUT 43H, AL\nMOV AL, 50H ; ; initial count = 50H (80)\nOUT 40H, AL\n```\n\n###\
    \ 从 T/C 读数据的方法\n\n计数器锁存命令（A1A0=11）\n\n- CHB: D7D6=00~01, D5D4=00\n\ne.g.:\n\n\
    ```\nMOV   AL, 01000101B  ; T/C1, latch, least significant\n                 \
    \        ; byte first, mode2, BCD\nOUT   43H, AL\nIN    AL, 41H\nMOV   AH, AL\n\
    IN    AL, 41H\nXCHG  AH, AL  ; AX is initial count for T/C1\n```\n\n- 从 T/C 读数据的方法\n\
    \n- 通过读回命令（A1A0=11）读取当前数据\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n\
    | 1 | 1 | COUNT | STATUS | CNT 2 | CNT 1 | CNT 0 | 0 |\n\nD5: 0 = 锁存所选计数器(s)的计数值\n\
    \nD4: 0 = 锁存所选计数器(s)的状态\n\nD3: 1 = 选择计数器 2\n\nD2: 1 = 选择计数器 1\n\nD1: 1 = 选择计数器\
    \ 0\n\nD0: 保留供将来扩展；必须为 0\n\n- 计数锁存命令只能锁存一个计数器\n\n- 读回命令可以同时锁存多个计数器\n\n```\ne.g.:\
    \ MOV AL, 11010100B    ; T/C1\nOUT 43H, AL\nIN  AL, 41H;\nMOV AH, AL\nIN  AL,\
    \ 41H\nXCHG AH, AL            ; AX is current count of CT1\nMOV AL, 11011010B\
    \       ; T/C0 and T/C2\nOUT 43H, AL\nIN  AL, 40H;\nMOV AH, AL\nIN  AL, 40H\n\
    XCHG AH, AL            ; AX is current count of CT0\nMOV BX, AX             ;\n\
    IN  AL, 42H;\nMOV AH, AL\nIN  AL, 42H\nXCHG AH, AL            ; AX is current\
    \ count of CT2\n```\n\n- 从 T/C 读数据的方法\n\n- 通过读回命令(A1A0=11)读取状态\n\n- 状态字\n\n| D7\
    \ | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| OUTPUT\
    \ | NULL COUNT | RW1 | RW0 | M2 | M1 | M0 | BCD |\n\nD7 1 = 输出引脚为 1\n0 = 输出引脚为\
    \ 0\nD6 1 = 空计数\n0 = 计数值可供读取\nD5-D0 计数器编程模式\n\n```\nMOV AL, 11100100B ; T/C1,\
    \ latch the state\nOUT 43H, AL\n```\n\n```\nIN AL, 41H ; Suppose AL=00110101,\
    \ means T/C1 in mode 2 ; BCD, least significant byte first, out pin = 0\n```\n\
    \n```\nMOV AL, 11100010B ; T/C0, latch the state\nOUT 43H, AL\n```\n\n```\nIN\
    \ AL, 40 ; if AL=00010110, means T/C0 in mode 3, Binary ; least significant byte\
    \ only, out pin = 0\n```\n\n"
