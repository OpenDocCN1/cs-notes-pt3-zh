    \ SP←(SP)-2<br>((SP)+1,(SP))←(FLAGS)<br>SP←(SP)-2<br>((SP)+1,(SP))←(CS)<br>SP←(SP)-2<br>((SP)+1,(SP))←(IP)<br>IP←(0000:OA)\
