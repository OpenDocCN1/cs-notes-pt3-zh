    # 7.1 Serial Communication


    # Serial versus parallel


    Serial links can be clocked considerably faster than parallel links in order to
    achieve a higher data rate, because:


    +   - Clock skew between different channels is not an issue.

    +   - A serial connection requires fewer interconnecting cables and hence occupies
    less space. The extra space allows for better isolation of the channel from its
    surroundings.

    +   - Crosstalk is less of an issue, because there are fewer conductors in proximity.


    Serial is cheaper to implement.'
  md: "\n## 6.5 Application\n\ne.g. An application use 82C55 to collect the status\
    \ of a switch S7~S0, then display the status of switches through a set of light-emitting\
    \ diodes(LED7~LED0) ( when Si closed, the IEDi bright). Look the circuit below,\
    \ suppose that both Group in 8255 are in mode 0.\n\n- 1) What is the port address\
    \ of 82C55?\n- 2) What is the control word?\n- 3) Programming the 82C55\n\n- 1)\
    \ The Port address of this 82C55 is:\n320H、321H、322H和323H。\n\n- 2) Port A – mode\
    \ 0, output, Port B – mode 0, input, so Control Word is 10000010b=82H\n\n- 3)\
    \ MOV AL, 82H ;write control word\nMOV DX, 323H ;\nOUT DX, AL\nL1: MOV DX, 321H\
    \ ;\nIN AL, DX ;input switches state\nNOT AL ;\nMOV DX, 320H ;\nOUT DX, AL ;output\n\
    JMP L1\n\n**Thinking that:**\n\nIf the requirements of the previous question is\
    \ modified as: not use query, but an interrupt comes every 50ms, in the interrupt\
    \ handler, read port B and write port A.\n\nHow to modify the circuit and program?\n\
    \nSuppose that the system provides a 2KHz pulse, 8254 and 8259 address are the\
    \ same as PC.\n\ne.g. Now connect the printer with 82C55 port A in mode 0. Programming\
    \ to print the char in BUFF\n\nWhen STB# is valid, the printer receive the data,\
    \ when BUSY is valid, means the printer is busy now, can’t receive the data.\n\
    \n## Computer I/O System\n\n![](img/d7c975450dfbe59120092c2721be78c6_472_0.png)\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_473_0.png)\n\n```asm\n.DATA\nBUFF \
    \   BYTE 'HELLO,WORLD!', 13, 10, '$'\nPORTA   EQU 60H\nPORTB   EQU 61H\nPORTC\
    \   EQU 62H\nPORTCN  EQU 63H\n\n.CODE\nSTART:  MOV     AX, @DATA\n        MOV\
    \     DS, AX\n        MOV     SI, OFFSET BUFF\n```\n\n; initial 8255, Port A mode\
    \ 0, output, Port C upper is input, lower is output\n\n```\nMOV AL, 88H\nOUT PORTCN,\
    \ AL\nMOV AL, 01H      ; set PC0, STB invalid\nOUT PORTCN, AL\nWAIT: IN AL, PORTC\
    \ ; read status of printer\nTEST AL, 80H      ; if \"busy\", wait\nJNZ WAIT\n\
    MOV AL, [SI]\nCMP AL, '$'\nJZ PRINT_OVER\n```\n\n```\nOUT PORTA, AL ; sent the\
    \ data\nMOV AL, 00H\n; generate the STB#\nOUT PORTCN, AL\nMOV AL, 01H\nOUT PORTCN,\
    \ AL\nINC SI\nJMP WAIT\n```\n\n```\nPRINT_OVER: MOV AH,4CH\n             INT 21H\n\
    \nEND START\n```\n\n## Computer Input/output System\n\n2015\n\nInstructors: Yang\
    \ Quansheng\n\nSchool of Computer Science and Engineering\nCollege of Software\
    \ Engineering\nSoutheast University\n\n## Chapter 6:\n\n## 16550 Programmable\n\
    Communications Interface\n\n## Outline\n\n- Serial Communication\n- Asynchronous\
    \ Serial Communication\n- RS-232 Standard\n- 16550 UART\n- COM in IA-32\n\n##\
    \ 7.1 Serial Communication\n\n## ■ Serial Communication\n\n- Serial communication\
    \ is the process of sending data one bit at a time, sequentially, over a communication\
    \ channel or computer bus.\n- Needs serializer and deserializer, or SerDes\n-\
    \ Serial communication is used for all long-haul communication and most computer\
    \ networks, where the cost of cable and synchronization difficulties make parallel\
    \ communication impractical.\n\n## Serial Communication\n\nSerial computer buses\
    \ are becoming more common even at shorter distances, as improved signal integrity\
    \ and transmission speeds in newer serial technologies have begun to outweigh\
    \ the parallel bus's advantage of simplicity (no need for serializer and deserializer,\
    \ or SerDes) and to outstrip its disadvantages (clock skew, interconnect density).\n\
    \n## Serial versus parallel\n\nSerial links can be clocked considerably faster\
    \ than parallel links in order to achieve a higher data rate, because:\n\n- Clock\
    \ skew between different channels is not an issue.\n- A serial connection requires\
    \ fewer interconnecting cables and hence occupies less space. The extra space\
    \ allows for better isolation of the channel from its surroundings.\n- Crosstalk\
    \ is less of an issue, because there are fewer conductors in proximity.\n\nSerial\
    \ is cheaper to implement.\n"
