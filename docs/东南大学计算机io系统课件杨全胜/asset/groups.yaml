    \ |\n| CMP mem8/16/32, reg8/16/32 | CMP BYTE PTR[DI],DL |\n| CMP mem8/16/32, imm8/16/32\
    \ | CMP BYTE PTR[DI], 23 |\n\n### 加法、减法和比较\n### 比较指令 (CMP)\n\nCMP 通常后跟条件跳转指令，该指令测试标志位的状态。\n\
    \n- 对于无符号比较\n  - if ZF=1, then DST = SRC\n  - if CF=0, then DST ≥ SRC\n  - if\
    \ CF=1, then DST < SRC\n\n- 对于有符号比较\n  - if ZF=1, then DST = SRC\n  - if SF=OF,\
    \ then DST ≥ SRC\n  - if SF<>OF, then DST < SRC\n\n### CMP 示例1\n\nCMP AL, BL\n\
    \n(AL)=-64    (BL)=10\n\n- 64\n- 10\n------\n- 74\n\nOF=0  SF=1\n\n结果： (DST)<(SRC)\n\
    \n### CMP 示例2\n\nCMP CL, [100H]\n\n(CL)=-100    (DS:100)=-110\n\n-100\n- (-110)\n\
    ------\n10\n\nOF=0  SF=0\n\n结果： (DST)>(SRC)\n\n"
