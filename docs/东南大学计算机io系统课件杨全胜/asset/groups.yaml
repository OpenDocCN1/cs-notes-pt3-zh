    \ OBF# will be set by the rising edge of the WR# input and reset by ACK# input\
    \ being low.\n\n- ACK#. A \"low\" on this input informs the 8255A that the data\
    \ from port A or port B has been accepted. In essence, a response from the peripheral\
    \ device indicating that it has received the data output by the CPU.\n\n- INTR.\
    \ A \"high\" on this output can be used to interrupt the CPU when an output device\
    \ has accepted data transmitted by the CPU. INTR is set when ACK# is a \"one\"\
    , OBF# is a \"one\" and INTE is a \"one\". It is reset by the falling edge of\
