  md: "\n## 4.4 Interrupt process in Modern PC\n## Interrupt-handling routine programming\n\
    \n- Save the context\n  - The register will be used in interrupt-handling routine\
    \ must be push in stack.\n\n- Avoid DOS reentrant in the interrupt handler for\
    \ non-software interrupt\n  - You can not use DOS system calls(int 21h) in the\
    \ interrupt handler. But BIOS calls can be used.\n\n- The interrupt handler must\
    \ small and execute quickly.\n  - The execute time of interrupt handler must less\
    \ than the minimum time interval of interrupts.\n  - You can't use long loop and\
    \ the human-computer interaction in interrupt handler.\n\n## 4.4 Interrupt process\
    \ in Modern PC\n## Interrupt-handling routine programming\n\n- **Set or clear\
    \ the IF**\n  - The IF was cleared when the interrupt be responded.\n  - You can\
    \ set IF to allow the interrupt nested, but remember to clear the IF before return\
    \ from interrupt handler.\n\n- **Process the EOI, and return**\n  - If the interrupt\
    \ is from 8259, and 8259 run in EOI mode, you must sent EOI command.\n  ```asm\n\
    \  MOV  AL, 20H\n  OUT  20H, AL    ; sent EOI to master 8259\n  OUT  0A0H, AL\
    \   ; sent EOI to slave 8259\n  ```\n\n- Resume the register saved before.\n-\
    \ Execute the IRET instruction to return.\n\n## 4.4 Interrupt process in Modern\
    \ PC\n## Interrupt-handling routine programming\n### ◆ Template of interrupt handler\n\
    \n(suppose the vector number is 0CH)\n\n```asm\n; main procedure\nOLDDOC    DWORD\
    \     ?\n......\nCODE      SEGMENT\n\n    ......\n    MOV     AX, 350CH      \
    \ ; Save the original 0CH interrupt vector\n    INT     21H\n    MOV     WORD\
    \ PTR OLDDOC, BX\n    MOV     WORD PTR OLDDOC+2, ES\n    MOV     AX, SEG SERVICE\
    \  ; set new 0CH interrupt vector\n    MOV     DS, AX\n    MOV     DX, OFFSET\
    \ SERVICE\n    MOV     AX, 250CH\n    INT     21H\n    ......                \
    \    ; others\n```\n\n## 4.4 Interrupt process in Modern PC\n## Interrupt-handling\
    \ routine programming\n### Template of interrupt handler\n\n(suppose the vector\
    \ number is 0CH)\n\n```asm\n; interrupt handler\nSERVICE PROC FAR\n    PUSHA \
    \     ; push register\n    PUSH DS\n    STI        ; set IF\n    .....      ;\
    \ main function in handler\n    CLI        ; clear IF\n    MOV AL, 20H\n    OUT\
    \ 20H, AL ; sent EOI\n    POP DS      ; resume\n    POPA\n    IRET\nSERVICE ENDP\n\
    ```\n\n## Computer Input/output System\n\n2015\n\nInstructors: Yang Quansheng\n\
    \nSchool of Computer Science and Engineering\nCollege of Software Engineering\n\
    Southeast University\n\n## Chapter 5:\n## 8254 Programmable Interval Timer\n\n\
    ## Outline\n\n- Basic of 8253/8254\n- Structure and pins of 8254\n- Applications\n\
    - 8254 in PCH\n\n## 5.2 Structure and pins of 8254\n### 82C54 Pinout\n\n![](img/d7c975450dfbe59120092c2721be78c6_411_0.png)\n\
    \n**(1) Decoding:** CS# and A₁A₀;\n\n**(2) read/write:** RD#, WR#;\n\n## 5.2 Structure\
    \ and pins of 8254\n### 82C54 Block Diagram\n\n![](img/d7c975450dfbe59120092c2721be78c6_412_0.png)\n\
    \n## 5.2 Structure and pins of 8254\n### Internal Block Diagram of a Counter\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_413_0.png)\n\nCR_M and CR_L are two\
    \ 8-bit registers. Both are normally referred to as one unit and called just CR\
    \ (Count Register).\n\nThe actual counter is labeled CE (Counting Element). It\
    \ is a 16-bit presettable synchronous down\n\nOL_M and OL_L are two 8-bit latches.\
    \ Both are normally referred to as one unit called just OL (\" Output Latch\"\
    ).\n\n## 5.2 Structure and pins of 8254\n### Operation and Command\n\nI/O port\
    \ address: four port (address use A1A0);\n\nCommand: initial—set mode, write initial\
    \ count operation—rewrite initial count, command to read status\n\nStatus: current\
    \ count, mode and current state\n\nInitial count N = f_CLKi / f_OUTi\n\n## 8254\
    \ command\n\n| CS# | RD# | WR# | A1 | A0 | operation | CHB D₇D₆ | 时序 |\n|---|---|---|---|---|---|---|---|\n\
    | 0 | 1 | 0 | 0 | 0 | initial count → CNT0 | ** | 无 |\n| 0 | 1 | 0 | 0 | 1 | initial\
    \ count → CNT1 | ** | 无 |\n| 0 | 1 | 0 | 1 | 0 | initial count → CNT2 | ** | 无\
    \ |\n| 0 | 1 | 0 | 1 | 1 | Write control word | 00~10 | 无 |\n|  |  |  |  |  |\
    \ Write “read back” command | 11 | 无 |\n| 0 | 0 | 1 | 0 | 0 | Read CNT0 current\
    \ count | - | See the explanation behind |\n|  |  |  |  |  | Read status of CNT0\
    \ | - |  |\n| 0 | 0 | 1 | 0 | 1 | Read CNT1 current count | - |  |\n|  |  |  |\
    \  |  | Read status of CNT1 | - |  |\n| 0 | 0 | 1 | 1 | 0 | Read CNT1 current\
    \ count | - |  |\n|  |  |  |  |  | Read status of CNT1 | - |  |\n| 0 | 0 | 1 |\
    \ 1 | 1 | - |  |  |\n| 1 | * | * | * | * | Prohibit access |  |  |\n| 0 | 1 |\
    \ 1 | * | * | - |  |  |\n"
  mdcn: "\n\n## 4.4 现代 PC 中的中断过程\n## 中断处理程序编程\n\n- 保存上下文\n  - 中断处理程序中会用到的寄存器必须压入栈中。\n\
    \n- 避免在非软件中断的中断处理程序中出现 DOS 重入\n  - 你不能在中断处理程序中使用 DOS 系统调用(int 21h)。但可以使用 BIOS\
    \ 调用。\n\n- 中断处理程序必须小且执行迅速。\n  - 中断处理程序的执行时间必须小于中断的最小时间间隔。\n  - 你不能在中断处理程序中使用长循环和人机交互。\n\
    \n## 4.4 现代 PC 中的中断过程\n## 中断处理程序编程\n\n- **设置或清除 IF**\n  - 中断被响应时 IF 被清除。\n  -\
    \ 你可以设置 IF 以允许中断嵌套，但请记住在从中断处理程序返回前清除 IF。\n\n- **处理 EOI，并返回**\n  - 如果中断来自 8259，且\
    \ 8259 运行在 EOI 模式下，你必须发送 EOI 命令。\n  ```asm\n  MOV  AL, 20H\n  OUT  20H, AL   \
    \ ; sent EOI to master 8259\n  OUT  0A0H, AL   ; sent EOI to slave 8259\n  ```\n\
    \n- 恢复之前保存的寄存器。\n- 执行 IRET 指令返回。\n\n## 4.4 现代 PC 中的中断过程\n## 中断处理程序编程\n### ◆ 中断处理程序模板\n\
    \n（假设向量号为 0CH）\n\n```asm\n; main procedure\nOLDDOC    DWORD     ?\n......\nCODE\
    \      SEGMENT\n\n    ......\n    MOV     AX, 350CH       ; Save the original\
    \ 0CH interrupt vector\n    INT     21H\n    MOV     WORD PTR OLDDOC, BX\n   \
    \ MOV     WORD PTR OLDDOC+2, ES\n    MOV     AX, SEG SERVICE  ; set new 0CH interrupt\
    \ vector\n    MOV     DS, AX\n    MOV     DX, OFFSET SERVICE\n    MOV     AX,\
    \ 250CH\n    INT     21H\n    ......                    ; others\n```\n\n## 4.4\
    \ 现代 PC 中的中断过程\n## 中断处理程序编程\n### 中断处理程序模板\n\n（假设向量号为 0CH）\n\n```asm\n; interrupt\
    \ handler\nSERVICE PROC FAR\n    PUSHA      ; push register\n    PUSH DS\n   \
    \ STI        ; set IF\n    .....      ; main function in handler\n    CLI    \
    \    ; clear IF\n    MOV AL, 20H\n    OUT 20H, AL ; sent EOI\n    POP DS     \
    \ ; resume\n    POPA\n    IRET\nSERVICE ENDP\n```\n\n## 计算机输入/输出系统\n\n2015\n\n\
    讲师：杨全胜\n\n计算机科学与工程学院\n软件工程学院\n东南大学\n\n## 第 5 章：\n## 8254 可编程间隔定时器\n\n## 大纲\n\n\
    - 8253/8254 基础\n- 8254 的结构和引脚\n- 应用\n- PCH 中的 8254\n\n## 5.2 8254 的结构和引脚\n###\
    \ 82C54 引脚图\n\n![](img/d7c975450dfbe59120092c2721be78c6_411_0.png)\n\n**(1) 解码：**\
    \ CS# 和 A₁A₀；\n\n**(2) 读/写：** RD#, WR#；\n\n## 5.2 8254 的结构和引脚\n### 82C54 框图\n\n\
