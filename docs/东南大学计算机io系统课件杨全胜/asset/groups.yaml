    ### 如何使用 INT 指令\n\n- 将功能号放入 AH 寄存器\n- 根据要求设置所有入口参数\n- 使用 INT n 指令\n\n例如：\n\n设置屏幕为\
    \ 640×480 16 色图形模式\n\n```\nMOV AH, 0      ; function number\nMOV AL, 12H     ;\
