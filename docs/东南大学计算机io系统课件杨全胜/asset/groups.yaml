    # 7.2 Asynchronous serial communication


    # Asynchronous serial communication


    +   - Asynchronous serial communication describes an asynchronous, serial transmission
    protocol in which a start signal is sent prior to each byte, character or code
    word and a stop signal is sent after each code word.

    +   - Data transmitted and received without a clock or timing signal.'
