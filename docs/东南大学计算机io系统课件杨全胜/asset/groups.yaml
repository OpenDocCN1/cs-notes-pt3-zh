    \ of RD#. This procedure allows an input device to request service from the CPU\
    \ by simply strobing its data into the port.\n- INTE A. Controlled by bit set/reset\
    \ of PC4.\n- INTE B. Controlled by bit set/reset of PC2.\n\n![](img/d7c975450dfbe59120092c2721be78c6_458_0.png)\n\
    \n### ■ Mode 1 — Strobed Input/Output\n\n![](img/d7c975450dfbe59120092c2721be78c6_459_0.png)\n\
