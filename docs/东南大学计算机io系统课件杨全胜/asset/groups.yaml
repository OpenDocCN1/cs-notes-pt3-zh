    - OUTS can also be used with a REP prefix.\n\n| Assembly Language | Operation\
    \ |\n|---|---|\n| OUTSB | [DX] = DS:[SI]; if (DF=0) SI=SI+1 else SI=SI-1 |\n|\
    \ OUTSW | [DX] = DS:[SI]; if (DF=0) SI=SI+2 else SI=SI-2 |\n| OUTSD | [DX] = DS:[SI];\
    \ if (DF=0) SI=SI+4 else SI=SI-4 |\n\n### String Comparison Instructions\n\n####\
    \ SCAS Instruction\n\nCompare a byte, word, or double word from the data segment\
