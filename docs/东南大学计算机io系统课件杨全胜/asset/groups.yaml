    # 5.4 8254 in PCH


    # Counter 0, System Timer


    +   - Frequency of CLK0 is 1.1931816MHz; Initial count is 65536


    +   - This counter functions as the system timer by controlling the state of IRQ0
    and is typically programmed for Mode 3 operation.


    +   - OUT0 generate the square wave which frequency is 18.2Hz to IRQ0 in Master
    8259A.


    +   - The counter asserts IRQ0 when the count value reaches 0, reloads the initial
    count value, and repeats the cycle, alternately asserting and negating IRQ0.'
  - '[PAGE 440]


    # 5.4 8254 in PCH


    # Counter 1, Refresh Request Signal


    +   - Frequency of CLK1 is 1.1931816MHz; initial count is 18.

    +   - This counter provides the refresh request signal and is typically programmed
    for Mode 2 operation and only impacts the period of the REF_TOGGLE bit in Port
    61.

    +   - OUT1 connect DREQ0 in 8237, every 15.08µs have a width of 838ns pulse for
    RAM refresh.'
