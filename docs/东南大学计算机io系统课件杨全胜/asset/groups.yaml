    # 1.4 Data Type


    # BCD and Packed BCD Integers


    +   Binary-coded decimal integers (BCD integers) are unsigned 4-bit integers with
    valid values ranging from 0 to 9.


    +   When operating on BCD integers in general-purpose registers, the BCD values
    can be unpacked (one BCD digit per byte) or packed (two BCD digits per byte).


    Unpacked BCD


    | 0000 | BCD |

    | 7    | 4 3 0 |


    Packed BCD


    | BCD | BCD |

    | 7   | 4 3 0 |


    > e.g. Convert decimal integer 21 to BCD is 0000001000000001, packed BCD is 00100001'
