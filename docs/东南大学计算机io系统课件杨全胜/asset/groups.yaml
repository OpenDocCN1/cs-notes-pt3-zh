    \ 向屏幕输出一个字符\n\n- 将 DL 中的字符打印到屏幕\n\n```\nMOV DL, 'A'     ; char want to print\n\
    MOV AH, 02H\nINT  21H\n```\n\n- 如何输入一个字符并输出它？\n\n```\nMOV AH, 01H\nINT  21H\n\
    MOV DL, AL\nMOV AH, 02H\nINT  21H\n```\n\n## 2.5 用户界面编程\n\n### 向屏幕输出字符串\n\n```\n\
    ```asm\n.DATA\n    MSG BYTE \"Hello world!\",0Ah,0Dh,'$'\n.CODE\nSTART:\n    MOV\
