    \ jump\n  - A two-byte displacement is used in near jump or call\n- Relative JMP\
    \ and CALL instructions contain either an 8-bit or a16-bit signed displacement\
    \ that allows a forward memory reference or a reverse memory reference.\n\n- All\
    \ assemblers automatically calculate the distance for the displacement and select\
    \ the proper one- or two-byte form.\n  - An 8-bit displacement has a jump range\
    \ of between +127 and -128 bytes from the next instruction; a 16-bit displacement\
    \ has a range of ± 32K bytes.\n\n| offset | Machine code | program |\n|---|---|---|\n\
    | 0000 | 0405 | ST: ADD AL,05H |\n| 0002 | 90 | NOP |\n| 0003 | EBFB | JMP SHORT\
    \ ST |\n| 0005 | 90 | NOP |\n\n### Indirect Programming Memory Addressing Modes\n\
    \n- Far Indirect\n\nFar indirect jump instruction can use any relative register;\
    \ and any relative register with a displacement to be the address of next instruction.\n\
    \nIf (DS)=2500H, (SI)=1300H, (26300H)=4500H, (26302H)=32F0H, the after execute:\n\
    \n```\nJMP DWORD PTR [SI]: CS=32F0H, IP=4500H\n```\n\n## 1.6.3 Stack Memory Addressing\
