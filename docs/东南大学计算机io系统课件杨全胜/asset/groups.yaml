    # 2.4 Assembly Language Source Code


    # Using Simplified Segment Directives


    # ♦ .MODEL


    ```

    `.MODEL memorymodel [[, langtype]] [[, stackoption]]`

    ```


    +   - The *langtype* can be **C, BASIC, FORTRAN, PASCAL, SYSCALL**, or **STDCALL**.
    Instructs the assembler to follow the naming, calling, and return conventions
    for the indicated language.

    +   - The *stackoption* can be **NEARSTACK** (if SS equals DS) or **FARSTACK**
    (if SS is not equal to DS). **NEARSTACK** is the default.'
