    \n```\nOP DST, CNT; OP is SHL, SAL, SHR, SAR\n```\n\nSHL/SAL\nlogically/arithmetically\n\
    shift left\n\n![](img/d7c975450dfbe59120092c2721be78c6_211_0.png)\n\nSHR\nLogically\
    \ shift right\n\n![](img/d7c975450dfbe59120092c2721be78c6_211_1.png)\n\nSAR\n\
    Arithmetically shift right\n\n![](img/d7c975450dfbe59120092c2721be78c6_211_2.png)\n\
    \n## 2.6.3 Logic Instructions\n### Shift and Rotate Instruction\n### ◆ Shift Instructions\n\
    \nSuppose (AL)=0B4H, (CF)=1, analyze the result after execution\n\n| Instruction\
    \ | CF | AL |\n|---|---:|---|\n| Before execution | 1 | 10110100 |\n| (1) SAL\
    \ AL, 1 | 1 | 01101000 |\n| (2) SHL AL, 1 | 1 | 01101000 |\n| (3) SAR AL, 1 |\
    \ 0 | 11011010 |\n| (4) SHR AL, 1 | 0 | 01011010 |\n\nBoth of the result of the\
    \ shift left are the same.\nTwo kind of Arithmetically shift right get the different\
    \ result.\n\n## 2.6.3 Logic Instructions\n### ■ Shift and Rotate Instruction\n\
    ### ◆ Shift Instructions\n\nY is a number of byte, how to calculate (Y)*10?\n\
    We know: (Y)*10=(Y)*(8+2)=(Y)*2+(Y)*8 (Why do this?)\n\n```\nMOV AL, Y     ; AL<--(Y)\n\
    MOV AH, 0\nSHL AX, 1      ; (Y)*2\nMOV BX, AX\nSHL AX, 1      ; (Y)*4\nSHL AX,\
    \ 1      ; (Y)*8\nADD AX, BX     ; (Y)*10\n```\n\nHow to calculate DX=3×AX+7×BX\
    \ by using shift instruction?\n\n## 2.6.3 Logic Instructions\n### Shift and Rotate\
    \ Instruction\n\n- Shift instructions will change flags:\n  - CF: change by shifted\
    \ bit\n  - OF:\n    - Multiple-bit shift: undefined\n    - Single-bit shift\n\
    \      - 0: if the sign bit of the result is the same as the sign bit of the original\
    \ operand value.\n      - 1: they are different\n  - ZF, PF: assigned according\
    \ to result\n  - AF: undesigned\n"
  mdcn: "\n\n## 2.6.3 逻辑指令\n### AND 示例\n\n```\nMOV AL, 32H\nAND AL, 0FH        ; clear\
    \ the high 4 bits in AL\n```\n\n|        | AL       |\n|--------|----------|\n\
    | 执行前 | 00110010 |\n| 执行后  | 00000010 |\n\n### OR 示例\n\n```\nMOV AL, 02H\nOR \
    \ AL, 0F0H       ; set the high 4 bits in AL\n```\n\n|        | AL       |\n|--------|----------|\n\
    | 执行前 | 00000010 |\n| 执行后  | 11110010 |\n\n### XOR 示例\n\n| 指令 | 值      |\n|-------------|------------|\n\
    | MOV AL, 0B6H | 1011 0110 |\n| XOR AL, 0FH  | 0000 1111 |\n| 结果       | 1011\
    \ 1001 |\n\n无变化    取反\n\n## 2.6.3 逻辑指令\n### 基本逻辑指令\n\n```\nTEST OPR1, OPR2 ; (OPR1)\
    \ & (OPR2)\n```\n\n- 与 AND 指令相同但不改变目的操作数\n- AND、OR、XOR、TEST 会影响标志寄存器。\n  - CF=0\n\
    \  - OF=0\n  - AF: 未定义\n  - PF、SF、ZF: 由结果的值设置。\n\n> **下面指令是什么意思？**\n> \n> **AND\
    \ AX,AX;** 清除标志寄存器中的 CF 和 OF\n> \n> **XOR AX,AX;** AX=0, CF=0 且 OF=0\n\n## 2.6.3\
    \ 逻辑指令\n### TEST 示例\n\n判断 (AL) 是否为奇数，如果为真则跳转\n\n```\nTEST AL, 01H\nJNZ NEXT  \
    \      ; ZF=0, jump\n```\n\n### TEST 示例2\n\n判断 (AX) 是否为正数，如果为真则跳转\n\n```\nTEST\
    \ AX, 8000H\nJZ THERE        ; ZF=1转\n```\n\n## 2.6.3 逻辑指令\n### 基本逻辑指令\n\nNOT\
    \ DST : 非操作\n\n- 求补，逻辑反转。\n- 真值表\n- NOT r/m8/16/32\n- 不影响标志寄存器\n\n| A | T |\n\
    |---|---|\n| 0 | 1 |\n| 1 | 0 |\n\n### NOT 示例1\n\n```\nMOV AL, 52H\nNOT AL\nbefore\
    \  AL  01010010\nafter   AL  10101101\n```\n\n### NOT 示例2\n\n```\nMOV AL, 1 ;\
    \ 1-->AL\nNOT AL ; 求反\nINC AL ;\n```\n\n## 2.6.3 逻辑指令\n### 移位和循环指令\n\n- 移位和循环指令在二进制位级别上操作二进制数，与\
    \ AND、OR、异或和 NOT 指令相同。\n- 移位和循环在用于控制 I/O 设备的底层软件中最常见。\n- 微处理器包含一套完整的移位和循环指令，用于移位或循环任何内存数据或寄存器。\n\
    \n## 2.6.3 逻辑指令\n### 移位和循环指令\n### 移位指令\n\n```\nOP DST, CNT; OP is SHL, SAL, SHR,\
    \ SAR\n```\n\nSHL/SAL\n逻辑/算术\n左移\n\n![](img/d7c975450dfbe59120092c2721be78c6_211_0.png)\n\
    \nSHR\n逻辑右移\n\n![](img/d7c975450dfbe59120092c2721be78c6_211_1.png)\n\nSAR\n算术右移\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_211_2.png)\n\n## 2.6.3 逻辑指令\n### 移位和循环指令\n\
    ### ◆ 移位指令\n\n假设 (AL)=0B4H, (CF)=1，分析执行后的结果\n\n| 指令 | CF | AL |\n|---|---:|---|\n\
    | 执行前 | 1 | 10110100 |\n| (1) SAL AL, 1 | 1 | 01101000 |\n| (2) SHL AL, 1 | 1\
    \ | 01101000 |\n| (3) SAR AL, 1 | 0 | 11011010 |\n| (4) SHR AL, 1 | 0 | 01011010\
    \ |\n\n左移的结果都相同。\n两种算术右移得到不同的结果。\n\n## 2.6.3 逻辑指令\n### ■ 移位和循环指令\n### ◆ 移位指令\n\
    \nY 是一个字节数，如何计算 (Y)*10？\n我们知道：(Y)*10=(Y)*(8+2)=(Y)*2+(Y)*8 （为什么这样做？）\n\n```\n\
    MOV AL, Y     ; AL<--(Y)\nMOV AH, 0\nSHL AX, 1      ; (Y)*2\nMOV BX, AX\nSHL AX,\
    \ 1      ; (Y)*4\nSHL AX, 1      ; (Y)*8\nADD AX, BX     ; (Y)*10\n```\n\n如何使用移位指令计算\
    \ DX=3×AX+7×BX？\n\n## 2.6.3 逻辑指令\n### 移位和循环指令\n\n- 移位指令会改变标志：\n  - CF: 由移出的位改变\n\
    \  - OF:\n    - 多位移位：未定义\n    - 单位移位\n      - 0: 如果结果的符号位与原始操作数字符号位相同。\n     \
    \ - 1: 它们不同\n  - ZF、PF: 根据结果赋值\n  - AF: 未设计\n\n"
