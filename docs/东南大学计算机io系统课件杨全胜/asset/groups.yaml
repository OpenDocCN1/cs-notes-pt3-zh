  mdcn: "\n\n## 2.6.6 字符串指令\n\n### 字符串数据传输指令\n\n#### STOS 指令\n\n将 AL、AX 或 EAX 存储到由\
    \ (E)DI 寄存器寻址的额外段内存位置。\n\n| 汇编语言 | 操作 |\n|---|---|\n| STOSB | ES:[DI]=AL; if (DF=0)\
    \ DI=DI+1 else DI=DI-1 |\n| STOSW | ES:[DI]=AX; if (DF=0) DI=DI+2 else DI=DI-2\
    \ |\n| STOSD | ES:[DI]=EAX; if (DF=0) DI=DI+4 else DI=DI-4 |\n\n#### 带 REP 前缀的\
    \ STOS\n\n- REP 前缀会导致每次执行字符串指令时 (E)CX 递减 1。然后字符串指令重复。如果 (E)CX 达到 0，则指令终止，程序继续执行下一条顺序指令。\n\
    \n#### STOS 指令示例\n\n清除缓冲区\n\n```asm\n.DATA\nBUFF DB 1000 DUP(?)  ; define the\
    \ buffer\n.CODE\n        ......\nCLD                    ; DF=0\nLEA  DI, BUFF\
    \          ; address of buff-->DI\nMOV  CX, 1000          ; the number of repetitions\n\
    MOV  AL, 0             ; 0-->AL\nREP  STOSB             ; store 0 to clear\n```\n\
    \n#### MOVS 指令\n\n- 从由 (E)SI 寻址的数据段位置传输字节、字或双字到由 (E)DI 寻址的额外段位置。\n- MOVS 也可以与\
    \ REP 前缀一起使用。\n\n| 汇编语言 | 操作 |\n|---|---|\n| MOVSB | ES:[DI]=DS:[SI]; if (DF=0)\
    \ {SI=SI+1; DI=DI+1} else {SI=SI-1; DI=DI-1} |\n| MOVSW | ES:[DI]=DS:[SI]; if\
    \ (DF=0) {SI=SI+2; DI=DI+2} else {SI=SI-2; DI=DI-2} |\n| MOVSD | ES:[DI]=DS:[SI];\
    \ if (DF=0) {SI=SI+4; DI=DI+4} else {SI=SI-4; DI=DI-4} |\n\n#### 16 位程序的 MOVS\
    \ 指令示例\n\n```asm\n.8086                ; create 16 bit code\n.model small    \
    \     ; 16 bit memory model\n.data\nlpstring DWORD ?\nbuff1  BYTE \"HELLO,WORLD!\"\
    ,13,10,'$'\nbuff2  BYTE 20 DUP('$')\n.code\nstart:\n    mov ax,@data\n    mov\
    \ ds,ax\n    mov es,ax\n\n    mov si,offset buff1\n    mov di,offset buff2\n \
    \   mov cx,14\n    cld\n    rep movsb\n    mov dx,offset buff2\n    mov ah,9\n\
    \    int 21h   ; print string\n    mov ax,4c00h\n    int 21h   ; exit\nend start\n\
    ```\n\n#### INS 指令\n\n- 从 I/O 设备传输字节、字或双字数据到由 (E)DI 寄存器寻址的额外段位置。\n- I/O 地址在 DX\
    \ 寄存器中。\n- INS 也可以与 REP 前缀一起使用。\n\n| 汇编语言 | 操作 |\n|---|---|\n| INSB | ES:[DI]=[DX];\
    \ if (DF=0) DI=DI+1 else DI=DI-1 |\n| INSW | ES:[DI]=[DX]; if (DF=0) DI=DI+2 else\
    \ DI=DI-2 |\n| INSD | ES:[DI]=[DX]; if (DF=0) DI=DI+4 else DI=DI-4 |\n\n#### OUTS\
    \ 指令\n\n- 从由 (E)SI 寄存器寻址的 DATA 段位置传输字节、字或双字数据到 I/O 设备。\n- I/O 地址在 DX 寄存器中。\n-\
    \ OUTS 也可以与 REP 前缀一起使用。\n\n| 汇编语言 | 操作 |\n|---|---|\n| OUTSB | [DX] = DS:[SI];\
    \ if (DF=0) SI=SI+1 else SI=SI-1 |\n| OUTSW | [DX] = DS:[SI]; if (DF=0) SI=SI+2\
    \ else SI=SI-2 |\n| OUTSD | [DX] = DS:[SI]; if (DF=0) SI=SI+4 else SI=SI-4 |\n\
    \n### 字符串比较指令\n\n#### SCAS 指令\n\n将由 (E)DI 寻址的数据段位置的字节、字或双字与 AL、AX 或 EAX 进行比较。\n\
    \n| 汇编语言 | 操作 |\n|---|---|\n| SCASB | ES:[DI]-AL; if (DF=0) DI=DI+1 else DI=DI-1\
    \ |\n| SCASW | ES:[DI]-AX; if (DF=0) DI=DI+2 else DI=DI-2 |\n| SCASD | ES:[DI]-EAX;\
    \ if (DF=0) DI=DI+4 else DI=DI-4 |\n\n#### 带 REPNZ/REPNE 前缀的 SCAS\n\n- REPNZ/REPNE\
    \ 前缀会导致 SCAS 指令重复，直到 CX 每次递减 1 后达到 0，或者直到 SCAS 指令比较的结果存在相等条件。\n\n#### 带 REPZ/REPE\
    \ 前缀的 SCAS\n\n- REPZ/REPE 前缀会导致 SCAS 指令重复，直到 CX 每次递减 1 后达到 0，或者直到 SCAS 指令比较的结果不存在相等条件。\n\
    \n使用任一重复前缀时，CX 的内容会被递减，但不会影响标志位。\n\n"
