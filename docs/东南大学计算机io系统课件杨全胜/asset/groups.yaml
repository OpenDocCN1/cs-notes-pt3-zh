    \ AL\nJMP  SHORT $+2\nMOV  AL, 00000001B        ;ICW4: Non buffered, full nested,\
    \ EOI\nOUT  INTM01, AL\nJMP  SHORT $+2\n......\n```\n\n```\nMOV AL, 12H\nOUT 20H,\
    \ AL\nMOV AL, 08H\nOUT 21H, AL\nMOV AL, 02H\nOUT 21H, AL\n```\n\n```\nMOV AL,\
