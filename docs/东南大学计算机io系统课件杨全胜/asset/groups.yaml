  - '[PAGE 403]


    # 4.4 Interrupt process in Modern PC


    # Interrupt-handling routine programming


    +   - Save the context

    +     - The register will be used in interrupt-handling routine must be push in
    stack.


    +   - Avoid DOS reentrant in the interrupt handler for non-software interrupt

    +     - You can not use DOS system calls(int 21h) in the interrupt handler. But
    BIOS calls can be used.


    +   - The interrupt handler must small and execute quickly.

    +     - The execute time of interrupt handler must less than the minimum time
    interval of interrupts.

    +     - You can''t use long loop and the human-computer interaction in interrupt
    handler.'
  - '[PAGE 404]


    # 4.4 Interrupt process in Modern PC


    # Interrupt-handling routine programming


    +   - **Set or clear the IF**

    +     - The IF was cleared when the interrupt be responded.

    +     - You can set IF to allow the interrupt nested, but remember to clear the
    IF before return from interrupt handler.


    +   - **Process the EOI, and return**

    +     - If the interrupt is from 8259, and 8259 run in EOI mode, you must sent
    EOI command.

    +     - ```asm

    +       MOV  AL, 20H

    +       OUT  20H, AL    ; sent EOI to master 8259

    +       OUT  0A0H, AL   ; sent EOI to slave 8259

    +       ```


    +   - Resume the register saved before.

    +   - Execute the IRET instruction to return.'
