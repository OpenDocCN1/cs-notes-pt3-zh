    \ |\n"
  mdcn: "\n\n## 4.2 8259A PIC\n\n### 操作和命令\n\n### 操作控制字 2 (OCW2)\n\n| R | SL | EOI\
    \ | 0 | 0 | L2 | L1 | L0 | 功能 |\n|---|---|---|---|---|---|---|---|---|\n| 0 |\
    \ 0 | 0 | 0 | 0 | 0 | 0 | 0 | AEOI; 固定优先级命令 |\n| 0 | 0 | 1 | 0 | 0 | 0 | 0 | 0\
    \ | 非特定 EOI; 固定优先级命令 |\n| 0 | 1 | 1 | 0 | 0 | L2 | L1 | L0 | 特定 EOI; 固定优先级命令 |\n\
    | 1 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | AEOI; 自动轮转优先级命令 |\n| 1 | 0 | 1 | 0 | 0 | 0 |\
    \ 0 | 0 | 非特定 EOI; 自动轮转优先级命令 |\n| 1 | 1 | 1 | 0 | 0 | L2 | L1 | L0 | 特定 EOI; 特定轮转优先级命令\
    \ |\n| 1 | 1 | 0 | 0 | 0 | L2 | L1 | L0 | AEOI; 特定轮转优先级命令 |\n\ne.g. MOV AL, 20H\n\
    OUT 20H, AL ; in X86, What’s mean?\n\n### 操作控制字 3 (OCW3)\n\n| A0 | D7 | D6 | D5\
    \ | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n| 0 | × |\
    \ ESMM | SMM | 0 | 1 | P | RR | RIS |\n\nOCW3: D4 D3=01\n\n| P | RR | RIS | 下一次\
    \ RD# 脉冲中的操作 | 用法 |\n|---|---|---|---|---|\n| 1 | × | × | 读取查询字 | MOV AL, 0CH<br>OUT\
    \ 20H, AL<br>IN AL, 20H |\n| 0 | 1 | 0 | 读取 IRR | MOV AL, 0AH<br>OUT 20H, AL<br>IN\
    \ AL, 20H |\n| 0 | 1 | 1 | 读取 ISR | MOV AL, 0BH<br>OUT 20H, AL<br>IN AL, 20H |\n\
    | 0 | 0 | × | - |  |\n\n### 查询字\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n\
    |---|---|---|---|---|---|---|---|\n| I | - | - | - | - | W2 | W1 | W0 |\n\n- **W2\
    \ – W0**: 请求服务的最高优先级级的二进制编码。\n- **I**: 若有中断则等于 \"1\"。\n\n### SMM 操作\n\n| A0 |\
    \ D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 0 | × | ESMM | SMM | 0 | 1 | P | RR | RIS |\n\n| ESMM | SMM | 功能 |\n|---|---|---|\n\
    | 0 | × | 无操作 |\n| 1 | 0 | 复位特殊屏蔽 |\n| 1 | 1 | 置位特殊屏蔽 |\n\n### 初始化 8259A\n\n```\n\
    INTM00    EQU  020H  ;8259A port 0\nINTM01    EQU  021H  ;8259A port 1\n......\n\
    MOV  AL, 00010011B        ;ICW1: edge trigger,  ICW4 needed\n                \
    \         ; single mode,  not need ICW3.\nOUT  INTM00, AL\nJMP  SHORT $+2    \
    \       ; delay\nMOV  AL, 00001000B        ;ICW2: interrupt vector number of IR0\n\
    \                         ; is 08H\nOUT  INTM01, AL\nJMP  SHORT $+2\nMOV  AL,\
    \ 00000001B        ;ICW4: Non buffered, full nested, EOI\nOUT  INTM01, AL\nJMP\
    \  SHORT $+2\n......\n```\n\n```\nMOV AL, 12H\nOUT 20H, AL\nMOV AL, 08H\nOUT 21H,\
    \ AL\nMOV AL, 02H\nOUT 21H, AL\n```\n\n```\nMOV AL, 13H\nOUT 20H, AL\nMOV AL,\
    \ 08H\nOUT 21H, AL\nMOV AL, 02H\nOUT 21H, AL\n```\n\nQ: What command do the last\
    \ statements in above two programs send?\n\n## 4.3 x86 系统中的中断\n\n### 中断和异常分类\n\
    \n### 不可屏蔽中断 (NMI)\n\n- 硬件、不可屏蔽、向量中断\n- 中断请求信号发送到 NMI 引脚。\n- 中断向量号: 2\n- 无需中断识别。\n\
    - 当 NMI 信号从 0 跳变为 1，然后保持高电平至少四个处理器时钟周期，将识别一个 NMI 中断。\n- NMI 从 1 跳变为 0 并保持低电平至少四个处理器时钟周期，可以识别新的\
    \ NMI 中断。\n\n### 软件产生中断\n\n- 软件、不可屏蔽、向量中断\n- INT n 指令允许从软件内部通过提供操作数作为中断向量号来产生中断。\n\
    - 中断向量号: INT n 中的操作数\n- 无需中断识别。\n- BIOS 中断\n  - INT 10H, INT 13H, INT 16H, ...\n\
    - DOS 中断\n  - INT 20H, INT 21H, INT 24H,...\n\n### 中断指令\n\n| 功能 | 指令 | 操作 |\n\
    |---|---|---|\n| 中断 | INT N | SP←(SP)-2<br>((SP)+1,(SP))←(FLAGS)<br>SP←(SP)-2<br>((SP)+1,(SP))←(CS)<br>SP←(SP)-2<br>((SP)+1,(SP))←(IP)<br>IP←(0000:OA)\
    \ ; OA=4*N<br>CS←(0000:OA+2) |\n| 从中断返回 | IRET | IP←((SP)+1,(SP))<br>SP←(SP)+2<br>CS←((SP)+1,(SP))<br>SP←(SP)+2<br>FLAGS←((SP)+1,(SP))<br>SP←(SP)+2\
    \ |\n\n"
