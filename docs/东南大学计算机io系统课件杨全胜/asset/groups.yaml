  - '[PAGE 517]


    # 7.5 COM in IA-32


    # What is COM in communication?


    +   - COM is the original, yet still common, name of the serial port interface
    on IBM PC-compatible computers.

    +   - It might not only refer to physical ports, but also to virtual ports, such
    as ports created by bluetooth or USB-to-Serial adapters.

    +   - COM in IA-32

    +     - COM1: I/O port 0x3F8, IRQ 4

    +     - COM2: I/O port 0x2F8, IRQ 3

    +     - COM3: I/O port 0x3E8, IRQ 4

    +     - COM4: I/O port 0x2E8, IRQ 3'
  - '[PAGE 518]


    # 7.5 COM in IA-32


    # 16550 initialize


    +   1. Write the divisor latch DL(port 0 and 1) to set baud rate.

    +   2. Write the line control register LCR(port 3) to set the format of the asynchronous
    data communications exchange.

    +   3. Write the MODEM control register MCR( port 4) to set the MODEM control
    word.

    +   4. Write Interrupt enable register IER(port 1) to set the interrupt enable
    word.'
  md: "\n## 7.4 16550 UART\n\nComputer I/O System\n\n- Receiver Buffer (RBR); Transmitter\
    \ Holding Register (THR) DLAB=0, A2A1A0=000\n\nSender\n\nReceiver\n\nD7 D0\nTSR\n\
    THR\nShift out to SOUT pin, LSB first\n8-bit data from CPU into THR in parallel\n\
    \nD7 D0\nRSR\nRBR\nShift from SIN pin, LSB first\n8-bit data to CPU in parallel\n\
    \n## 7.4 16550 UART\n\n### Divisor Latch (DL)\n\nDLAB=1, A2A1A0=001(MSB) or 000(LSB)\n\
    \nThe UART contains a programmable Baud Generator that is capable of taking any\
    \ clock input from DC to 24 MHz and dividing it by any divisor\n\nValue_Divisor\
    \ Latch = (frequency_XOUT) ÷ (baud rate × 16)\n\n16550 use 18.432MHz crystal as\
    \ a timing source in PC. if 240 is programmed into the Baud rate divisor. The\
    \ Baud rate is (18.432MHz ÷16) ×240 = 4800 Baud\n\nTransmit 7-bit ASCII code with\
    \ 1 bit parity and 1 bit stop by using 16550, if the data transfer rate of 960\
    \ characters per sec, what is the value of divisor latch?\n\n## 7.4 16550 UART\n\
    \n### Interrupt Identification Register (IIR)\n\nA2A1A0=010 (Read)\n\n| D7 | D6\
    \ | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n|  |  |\
    \ 0 | 0 | ID2 | ID1 | ID0 | IP |\n\n01-Enable FIFO but no use\n11-Enable FIFO\n\
    \nIdentify the highest priority interrupt pending. ID2 used in FIFO mode only\n\
    \n0-an interrupt is pending\n1- no interrupt is pending\n\n## 7.4 16550 UART\n\
    \n### Interrupt Identification Register(IIR)\n\n| ID2 | ID1 | ID0 | Interrupt\
    \ source | Priority |\n|---|---|---|---|---|\n| 0 | 1 | 1 | Receiver Line Status:\
    \ Overrun Error or Parity Error or Framing Error or Break Interrupt | highest\
    \ |\n| 0 | 1 | 0 | Receiver Data Available or Trigger Level Reached | second |\n\
    | 1 | 1 | 0 | No Characters Have Been Removed From or Input to the RCVR FIFO During\
    \ the Last 4 Char Times and There Is at Least 1 Char in It During This Time. |\
    \ second |\n| 0 | 0 | 1 | Transmitter Holding Register Empty | third |\n| 0 |\
    \ 0 | 0 | MODEM Status (CTS、DSR、RI和RLSD) changed | fourth |\n\n## 7.4 16550 UART\n\
    \n### Interrupt Enable Register(IER)\n\nDLAB=0, A2A1A0=001\n\n| D7 | D6 | D5 |\
    \ D4 | D3 | D2 | D1 | D0 |\n| 0 | 0 |  |  | I0E | I3E | I1E | I2E |\n\n1=enables\
    \ the MODEM Status Interrupt\n\n1=enables the THR Empty Interrupt\n\n1=enables\
    \ the Receiver Line Status Interrupt\n\n1=enables the Received Data Available\
    \ Interrupt\n\n## 7.4 16550 UART\n\n### Modem Control Register(MCR)\n\nA2A1A0=100\n\
    \n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n| 0 | 0 | 0 | LOOP | OUT2 | OUT1\
    \ | RTS | DTR |\n\nprovides a local loopback feature for diagnostic testing of\
    \ the UART\n\ncontrol the out1# signal\n\ncontrol the DTR# output\n\ncontrol the\
    \ out1# signal\n\ncontrol the RTS# output\n\n## 7.4 16550 UART\n\n### Modem Status\
    \ Register(MSR)\n\nA2A1A0=110\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n\
    | DCD | RI | DSR | CTS | ΔDCD | TERI | ΔDSR | ΔCTS |\n\nGet DCD#\n\nGet the Ring\n\
    \nGet DSR#\n\nget CTS#\n\nDCD# changed\n\nTrailing Edge of Ring come\n\nDSR# changed\n\
    \nCTS# changed\n\n## 7.4 16550 UART\n\n### FIFO Control Register(FCR)\n\nA2A1A0=010（写）\n\
    \nD7 D6 D5 D4 D3 D2 D1 D0\n\nset the trigger level (MSb)\n\nreserve\n\nclears\
    \ all bytes in the sender FIFO\n\nenable the FIFOs\n\nset the trigger level (LSb)\n\
    \nDMA mode select\n\nclears all bytes in the receiver FIFO\n\n## 7.4 16550 UART\n\
    \n### FIFO Control Register(FCR)\n\nThe trigger level is indicative the number\
    \ of bytes the buffer received before the UART sent.\n\n| D7 D6 | RCVR FIFO Trigger\
    \ Level (Bytes) |\n| --- | --- |\n| 0 0 | 1 |\n| 0 1 | 4 |\n| 1 0 | 8 |\n| 1 1\
    \ | 14 |\n\n## 7.5 COM in IA-32\n\n### What is COM in communication?\n\n- COM\
    \ is the original, yet still common, name of the serial port interface on IBM\
    \ PC-compatible computers.\n- It might not only refer to physical ports, but also\
    \ to virtual ports, such as ports created by bluetooth or USB-to-Serial adapters.\n\
    - COM in IA-32\n  - COM1: I/O port 0x3F8, IRQ 4\n  - COM2: I/O port 0x2F8, IRQ\
    \ 3\n  - COM3: I/O port 0x3E8, IRQ 4\n  - COM4: I/O port 0x2E8, IRQ 3\n\n## 7.5\
    \ COM in IA-32\n\n### 16550 initialize\n\n- 1. Write the divisor latch DL(port\
    \ 0 and 1) to set baud rate.\n- 2. Write the line control register LCR(port 3)\
    \ to set the format of the asynchronous data communications exchange.\n- 3. Write\
    \ the MODEM control register MCR( port 4) to set the MODEM control word.\n- 4.\
    \ Write Interrupt enable register IER(port 1) to set the interrupt enable word.\n"
  mdcn: "\n\n## 7.4 16550 UART\n\n计算机 I/O 系统\n\n- 接收缓冲器 (RBR)；发送保持寄存器 (THR) DLAB=0,\
    \ A2A1A0=000\n\n发送方\n\n接收方\n\nD7 D0\nTSR\nTHR\n向 SOUT 引脚移位输出，LSB 在前\n8 位数据并行写入\
    \ THR\n\nD7 D0\nRSR\nRBR\n从 SIN 引脚移位输入，LSB 在前\n8 位数据并行输出到 CPU\n\n## 7.4 16550\
    \ UART\n\n### 除数锁存器 (DL)\n\nDLAB=1, A2A1A0=001(MSB) 或 000(LSB)\n\nUART 包含一个可编程波特率发生器，能够接收从\
    \ DC 到 24 MHz 的任意时钟输入并将其除以任意除数\n\nValue_Divisor Latch = (frequency_XOUT) ÷ (baud\
    \ rate × 16)\n\n16550 在 PC 中使用 18.432MHz 晶体作为定时源。如果将 240 编程到波特率除数中。波特率为 (18.432MHz\
    \ ÷16) ×240 = 4800 波特\n\n使用 16550 以 7 位 ASCII 码、1 位奇偶校验和 1 位停止位发送，如果数据传输率为每秒 960\
    \ 个字符，除数锁存器的值是多少？\n\n## 7.4 16550 UART\n\n### 中断识别寄存器 (IIR)\n\nA2A1A0=010 (读)\n\
    \n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n\
    |  |  | 0 | 0 | ID2 | ID1 | ID0 | IP |\n\n01-启用 FIFO 但未使用\n11-启用 FIFO\n\n识别最高优先级挂起中断。ID2\
    \ 仅在 FIFO 模式下使用\n\n0-有一个中断挂起\n1-没有中断挂起\n\n## 7.4 16550 UART\n\n### 中断识别寄存器(IIR)\n\
    \n| ID2 | ID1 | ID0 | 中断源 | 优先级 |\n|---|---|---|---|---|\n| 0 | 1 | 1 | 接收线路状态：溢出错误或奇偶校验错误或帧错误或中断中断\
    \ | 最高 |\n| 0 | 1 | 0 | 接收数据可用或触发电平达到 | 第二 |\n| 1 | 1 | 0 | 在最后 4 个字符时间内没有从 RCVR\
    \ FIFO 中移除或输入字符，并且在此期间至少有 1 个字符。 | 第二 |\n| 0 | 0 | 1 | 发送保持寄存器空 | 第三 |\n| 0 |\
    \ 0 | 0 | MODEM 状态 (CTS、DSR、RI 和 RLSD) 改变 | 第四 |\n\n## 7.4 16550 UART\n\n### 中断使能寄存器(IER)\n\
    \nDLAB=0, A2A1A0=001\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n| 0 | 0 | \
    \ |  | I0E | I3E | I1E | I2E |\n\n1=使能 MODEM 状态中断\n\n1=使能 THR 空中断\n\n1=使能接收线路状态中断\n\
    \n1=使能接收数据可用中断\n\n## 7.4 16550 UART\n\n### 调制解调器控制寄存器(MCR)\n\nA2A1A0=100\n\n|\
    \ D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n| 0 | 0 | 0 | LOOP | OUT2 | OUT1 |\
    \ RTS | DTR |\n\n为 UART 诊断测试提供本地回环功能\n\n控制 out1# 信号\n\n控制 DTR# 输出\n\n控制 out1#\
    \ 信号\n\n控制 RTS# 输出\n\n## 7.4 16550 UART\n\n### 调制解调器状态寄存器(MSR)\n\nA2A1A0=110\n\
    \n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n\
    | DCD | RI | DSR | CTS | ΔDCD | TERI | ΔDSR | ΔCTS |\n\n获取 DCD#\n\n获取振铃\n\n获取\
    \ DSR#\n\n获取 CTS#\n\nDCD# 改变\n\n振铃的下降沿到来\n\nDSR# 改变\n\nCTS# 改变\n\n## 7.4 16550\
    \ UART\n\n### FIFO 控制寄存器(FCR)\n\nA2A1A0=010（写）\n\nD7 D6 D5 D4 D3 D2 D1 D0\n\n\
    设置触发电平 (MSb)\n\n保留\n\n清除发送方 FIFO 中的所有字节\n\n使能 FIFO\n\n设置触发电平 (LSb)\n\nDMA 模式选择\n\
    \n清除接收方 FIFO 中的所有字节\n\n## 7.4 16550 UART\n\n### FIFO 控制寄存器(FCR)\n\n触发电平表示在 UART\
    \ 发送之前缓冲区接收的字节数。\n\n| D7 D6 | RCVR FIFO 触发电平 (字节) |\n| --- | --- |\n| 0 0 | 1\
    \ |\n| 0 1 | 4 |\n| 1 0 | 8 |\n| 1 1 | 14 |\n\n## 7.5 COM in IA-32\n\n### 什么是通信中的\
    \ COM？\n\n- COM 是 IBM PC 兼容计算机上串行端口接口的原始名称，至今仍很常见。\n- 它可能不仅指物理端口，还可能指虚拟端口，例如由蓝牙或\
    \ USB 转串行适配器创建的端口。\n- COM in IA-32\n  - COM1: I/O 端口 0x3F8, IRQ 4\n  - COM2: I/O\
    \ 端口 0x2F8, IRQ 3\n  - COM3: I/O 端口 0x3E8, IRQ 4\n  - COM4: I/O 端口 0x2E8, IRQ\
    \ 3\n\n## 7.5 COM in IA-32\n\n### 16550 初始化\n\n- 1. 写入除数锁存器 DL(端口 0 和 1) 以设置波特率。\n\
    - 2. 写入线路控制寄存器 LCR(端口 3) 以设置异步数据通信交换的格式。\n- 3. 写入 MODEM 控制寄存器 MCR(端口 4) 以设置 MODEM\
    \ 控制字。\n- 4. 写入中断使能寄存器 IER(端口 1) 以设置中断使能字。\n\n"
