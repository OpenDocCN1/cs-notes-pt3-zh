  - "[PAGE 279]\n\n# 2.6.7 Procedure Instructions\n\n# ■ Procedure Define\n\n**Define\
    \ a procedure to output CRLF to screen. (16bit program use)**\n\n```\nCRLF  PROC\
    \ NEAR    ; output Carriage Return and Line Feed\n      PUSH AX\n      PUSH DX\n\
    \      MOV  DL, 0DH    ; Carriage Return\n      MOV  AH, 2\n      INT  21H   \
    \    ; output char in DL\n      MOV  DL, 0AH    ; Line Feed\n      MOV  AH, 2\n\
    \      INT  21H       ; output char in DL\n      POP  DX\n      POP  AX\n    \
    \  RET\nCRLF  ENDP\n```"
