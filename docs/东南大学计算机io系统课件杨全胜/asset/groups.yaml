  mdcn: "\n\n## 计算机输入/输出系统\n\n2015\n\n讲师：杨泉生\n\n计算机科学与工程学院\n软件工程学院\n东南大学\n\n## 第3章：\n\
    \n## I/O 基础\n\n## 大纲\n\n- I/O 模块\n- 主要 I/O 技术\n- I/O 地址空间的类型。\n- 8086/8088 硬件\n\
    - 个人计算机 I/O 映射\n- I/O 端口地址译码\n\n### 3.1 I/O 模块\n\n#### 什么是 I/O 模块\n\n- 计算机的 I/O\
    \ 模块是其与外部世界的接口。\n- 每个模块与系统总线或中央交换机接口并控制一个或多个外围设备。\n- I/O 模块包含执行外围设备与总线之间通信功能的逻辑。\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_290_0.png)\n\n### 3.1 I/O 模块\n\n▪ 为什么不将外围设备直接连接到系统总线？（为什么需要\
    \ I/O 模块？）\n\n- 存在各种各样的外围设备，具有各种操作方式。\n- 外围设备的数据传输速率通常远低于内存或处理器的速率。\n- 另一方面，某些外围设备的数据传输速率比内存或处理器的速率更快。\n\
    - 外围设备通常使用与所连接计算机不同的数据格式和字长。\n\n### 3.1 I/O 模块\n\n#### I/O 模块功能\n\n- **控制和时序**\n\
    \  - 在系统总线与外围设备之间协调数据流。\n- **处理器通信**\n  - **命令译码。** 在控制总线上接收来自处理器的命令并对其进行译码。\n\
    \  - **数据传输。** 在处理器与 I/O 模块之间交换数据。\n  - **状态报告。** 将 I/O 模块和外围设备的状态传输到系统总线。\n \
    \ - **地址识别。** I/O 模块必须为其控制的每个外围设备识别一个唯一地址。\n\n### 3.1 I/O 模块\n\n#### I/O 模块功能\n\
    \n- 设备通信\n\n- 控制信号。确定设备将执行的功能，例如：\n\n  - 向外围设备发送数据。(OUTPUT)\n  - 从外围设备接收数据。(INPUT)\n\
    \  - 设备报告状态，或 I/O 模块执行特定于设备的某些控制功能。\n\n- 数据传输。以一组要发送或从外围设备接收的位的形式。\n\n- 状态信号。指示设备状态。\n\
    \n- 数据缓冲\n\n  - 数据在 I/O 模块中被缓冲（由锁存器）然后以其速率发送到设备。\n\n- 错误检测并向处理器报告错误\n\n### 3.1\
    \ I/O 模块\n\n#### I/O 模块结构\n\n![](img/d7c975450dfbe59120092c2721be78c6_294_0.png)\n\
    \n### 3.1 I/O 模块\n\n#### 常见接口槽 1\n\nPS2 mouse\n\nPS2 keyboard\n\n10/100M NIC\n\
    \nGigabit Ethernet\n\nParallel Port\n\nSerial Port\n\nUSB\n\n1394\n\n1394a\n\n\
    VGA Interface\n\nMIDI/Game Port\n\nSpeaker /Line in /MIC Interface\n\n![](img/d7c975450dfbe59120092c2721be78c6_295_0.png)\n\
    \n### 3.1 I/O 模块\n\n#### 常见接口槽 2\n\nUSB 3.0接口\n\n1394接口\n\nUSB接口\n\nUSB PLUS接口\n\
    \n键鼠通用的PS2接口\n\nVGA接口\n\nDVI接口\n\nHDMI接口\n\n光纤音频接口\n\n网络接口\n\ne-SATA接口\n\n多声道音频接口\n\
    \nCenter and Subwoofer\n\nInput channel\n\nRear speaker output\n\nFront speaker\
    \ output\n\nSide speaker output\n\nMIC input\n\n### 3.2 主要 I/O 技术\n\n- 程序化 I/O\n\
    - 中断驱动 I/O\n- 直接内存访问\n- I/O 通道和处理器\n\n### 3.2 主要 I/O 技术\n\n- 程序化 I/O\n  1. 当处理器执行程序并遇到与\
    \ I/O 相关的指令时，它通过向适当的 I/O 模块发出命令来执行该指令。\n  2. 使用程序化 I/O，I/O 模块将执行请求的操作。\n  3. 然后有\
    \ 2 种不同方式：\n     - 无条件传输\n       - 我们假设设备始终准备就绪。\n       - 处理器不关心 I/O 模块的状态\n\
