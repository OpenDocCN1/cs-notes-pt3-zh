  md: "\n## 2.6.2 Arithmetic Instructions\n\n### BCD and ASCII Arithmetic\n\n- Decimal\
    \ BCD arithmetic adjust instruction\n- **Why must adjust?**\n  - 1010B~1111B in\
    \ BCD is meaningless\n\n![](img/d7c975450dfbe59120092c2721be78c6_190_0.png)\n\n\
    ### ASCII Adjust After Addition (AAA)\n\n- Adjusts the sum of two unpacked BCD\
    \ values to create an unpacked BCD result.\n\n```\nif (AL&0FH)>9 or (AF)=1\nthen\
    \ (AL)+6-->AL\n(AH)+1-->AH\n1-->AF, AF-->CF\n(AL)&0FH-->AL\nelse (AL)&0FH-->AL\n\
    0-->AF, (AF)-->CF\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_191_0.png)\n\
    \n**e.g.**\n\nCalculate the decimal number 9 + 4\n\n```\nMOV AL, 9H\nMOV BL, 4H\n\
    ADD AL, BL\nAAA\n```\n\n```\n09H\n+ 04H\n──────\n0DH    ; >9\n+ 06H  ; adjust\n\
    ──────\n13H\n& 0FH\n──────\n03H\n```\n\n(AH) + 1 --> AH\n\n**result:**\n\n(AH)=01H\
    \  (AL)=03H  CF=AF=1\n\n**e.g.**\n\nCalculate the decimal number 9 + 9\n\n```\n\
    MOV AL, 9H\nMOV BL, 9H\nADD AL, BL\nAAA\n```\n\n```\n09H\n+ 09H\n──────\n12H \
    \    ; AF=1\n+ 06H   ; adjust\n──────\n18H\n& 0FH\n──────\n08H\n```\n\n(AH)+1-->AH\n\
    \n**result:**\n\n(AH)=01H  (AL)=08H  CF=AF=1\n\n### ASCII Adjust AL After Subtraction\
    \ (AAS)\n\n- Adjusts the result of the subtraction of two unpacked BCD values\
    \ to create an unpacked BCD result.\n\n```\nif (AL&0FH)>9 or (AF)=1\nthen (AL)-6\
    \ -->AL\n    (AH)-1-->AH\n    (AL)&0FH-->AL\n    1-->AF, AF-->CF\nelse (AL)&0FH-->AL\n\
    \    0-->AF, (AF)-->CF\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_194_0.png)\n\
    \nvalid bits of the result\n\n**e.g.**\n\nCalculate the decimal number 16 - 7\n\
    \n```\nMOV AX, 0106H\nMOV BL, 7H\nSUB AL, BL\nAAS\n```\n\n```\n06H\n- 07H\n----\n\
    FFH    ; (AL)&0FH>9\n- 06H  ; adjust\n----\nF9H\n& 0FH\n----\n09H\n```\n\n(AH)-1-->AH\n\
    \n**result:**\n\n(AH)=00H  (AL)=09H  CF=AF=1\n\n### ASCII Adjust AX After Multiply\
    \ (AAM)\n\nAdjusts the result of the multiplication of two unpacked BCD values\
    \ to create a pair of unpacked (base 10) BCD values.\n\n```\ntempAL ← AL;\nAH\
    \ ← tempAL / 10;\nAL ← tempAL MOD 10;\n```\n\n```\nMOV AL, 07H\nMOV CL, 09H\n\
    MUL CL\nAAM                  ; adjust\n```\n\n```\n      0111\n×     1001\n──────────\n\
    \      0111\n      0000\n      0000\n      0111\n──────────\n   00111111\n```\n\
    \n调整后，(AH)=6，(AL)=3\n\n### Decimal Adjust AL after Addition (DAA)\n\nAdjusts the\
    \ sum of two packed BCD values to create a packed BCD result.\n\n```\nif (AL &\
