    \ 54H\nMOV BL, 63H\nADD AL, BL\nDAA\n```\n\n```\n54H\n+ 63H\n-----\nB7H   ; >9F\n\
    + 60H ; adjust\n-----\n1 17H\n```\n\n### Decimal Adjust AL after Subtraction (DAS)\n\
    \nAdjusts the result of the subtraction of two packed BCD values to create a packed\
