  - '[PAGE 524]


    # 7.5 COM in IA-32


    # Programming Communication with interrupt


    # Interrupt handler


    +   - **At first, read IIR**, judge the interrupt source, then jump to the routine.
    Judge the interrupt source should be in accordance with the order of interrupt
    priority levels.

    +   - When D2D1 in IIR=11, means **receive error**, need to **read LSR** to know
    what’s wrong, and process it.

    +   - Maybe more than one interrupt are come. **So, when a interrupt handler is
    complete, the IIR must be read again** to check whether the D0 is “0”, when D0=0,
    you must to judge the interrupt source and process again.

    +   - **The conditions for return from the interrupt routine is D0 of IIR is 1.**'
  md: "\n## 7.5 COM in IA-32\n### 16550 initialize\n\n```\nmov     dx,3fbh    ; LCR\n\
    mov     al,80h\nout     dx,al       ; DLAB=1\n\nmov     dx,3f8h    ; Divisor latch\
    \ Lsb\nmov     al,78h     ; 9600 Baud rate\nout     dx,al\nmov     al,00     \
    \ ; Divisor latch MSb\ninc     dx\nout     dx,al\n```\n\n```\nmov     al,00011011b\
    \ ; even parity,\n                ; 1 stop, 8-bit data\nmov     dx,3fbh   ; LCR\n\
    out     dx,al\nmov     al,03h    ; DTR, RTS\nmov     dx,3fch   ; MCR\nout    \
    \ dx,al\nmov     al,0      ; Disable interrupt\nmov     dx,3f9h   ; IER\nout \
    \    dx,al\n```\n\n- Sending Serial Data without interrupt\n\n![](img/d7c975450dfbe59120092c2721be78c6_521_0.png)\n\
    \nReceiving Serial Data without interrupt\n\nInitial 16550\n\nRead LSR\n\nError\
    \ ?\n\nD0=1 ?\n\nReceive a char.\n\nFinish ?\n\nEnd\n\nError Handing\n\n### Programming\
    \ Communication with interrupt\n\nInitialization\n\n- Modify the interrupt vector,\
    \ According to COM1 or COM2, set the correct interrupt vector.\n- Determine the\
    \ operation mode of 16550, set the IER and enable the interrupt ( set D3 in MCR\
    \ = 1 at the same time).\n- Set the baud rate and format of data (DL and LCR).\n\
    - Enable the interrupt, Set the OCW1 of 8259A, enable IRQ4 or IRQ3. Set IF =1\
    \ in EFLAGS\n\n### Interrupt handler\n\n- **At first, read IIR**, judge the interrupt\
    \ source, then jump to the routine. Judge the interrupt source should be in accordance\
    \ with the order of interrupt priority levels.\n- When D2D1 in IIR=11, means **receive\
    \ error**, need to **read LSR** to know what’s wrong, and process it.\n- Maybe\
    \ more than one interrupt are come. **So, when a interrupt handler is complete,\
    \ the IIR must be read again** to check whether the D0 is “0”, when D0=0, you\
    \ must to judge the interrupt source and process again.\n- **The conditions for\
    \ return from the interrupt routine is D0 of IIR is 1.**\n"
  mdcn: "\n\n## 7.5 IA-32 中的 COM\n### 16550 初始化\n\n```\nmov     dx,3fbh    ; LCR\n\
    mov     al,80h\nout     dx,al       ; DLAB=1\n\nmov     dx,3f8h    ; Divisor latch\
    \ Lsb\nmov     al,78h     ; 9600 Baud rate\nout     dx,al\nmov     al,00     \
    \ ; Divisor latch MSb\ninc     dx\nout     dx,al\n```\n\n```\nmov     al,00011011b\
    \ ; even parity,\n                ; 1 stop, 8-bit data\nmov     dx,3fbh   ; LCR\n\
    out     dx,al\nmov     al,03h    ; DTR, RTS\nmov     dx,3fch   ; MCR\nout    \
    \ dx,al\nmov     al,0      ; Disable interrupt\nmov     dx,3f9h   ; IER\nout \
    \    dx,al\n```\n\n-   不使用中断发送串行数据\n\n![](img/d7c975450dfbe59120092c2721be78c6_521_0.png)\n\
    \n不使用中断接收串行数据\n\n初始化 16550\n\n读取 LSR\n\n出错？\n\nD0=1？\n\n接收一个字符。\n\n完成？\n\n结束\n\
    \n错误处理\n\n### 使用中断的通信编程\n\n初始化\n\n-   修改中断向量，根据 COM1 或 COM2 设置正确的中断向量。\n-   确定\
    \ 16550 的工作模式，设置 IER 并使能中断（同时将 MCR 中的 D3 置 1）。\n-   设置波特率和数据格式（DL 和 LCR）。\n- \
    \  使能中断，设置 8259A 的 OCW1，使能 IRQ4 或 IRQ3。在 EFLAGS 中设置 IF =1\n\n### 中断处理程序\n\n- \
    \  **首先读取 IIR**，判断中断源，然后跳转到相应例程。判断中断源应按照中断优先级的顺序进行。\n-   当 IIR 中的 D2D1=11 时，表示**接收错误**，需要**读取\
    \ LSR** 以了解错误原因并进行处理。\n-   可能有多个中断同时到达。**因此，当一个中断处理程序完成后，必须再次读取 IIR**，以检查 D0 是否为“0”，当\
    \ D0=0 时，必须再次判断中断源并处理。\n-   **从中断例程返回的条件是 IIR 的 D0 为 1。**\n\n"
