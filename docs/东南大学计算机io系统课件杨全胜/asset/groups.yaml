  mdcn: "\n\n## 2.3 指令\n### 数据定义\n### 语法\n\n```\n[name] type initializer [, initializer]...\n\
    ```\n\n- **名称：** 分配给变量的符号名。如果未分配名称，则分配内存空间，但变量的起始地址没有符号名。\n- **初始值：** 表 11 中所示的类型、常量整数表达式、`?`\
