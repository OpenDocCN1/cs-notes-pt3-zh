    \ by BX.\n\n```\nDECIBIN PROC NEAR\n    PUSH  AX\n    PUSH  CX\n    MOV   BX,\
    \ 0 ; initial\nNEWCHAR:MOV AH, 1\n    INT   21H ; ASCII in AL\n    SUB   AL, 30H\n\
    \    JL    EXIT   ; < 0\n    CMP   AL, 9\n    JG    EXIT   ; > 9\n    CBW\n```\n\
    \n```\nXCHG  AX, BX\nMOV   CX, 10\nMUL   CX   ; old value *10\nXCHG  AX, BX\n\
    ADD   BX, AX ;add new value\nJMP   NEWCHAR\nEXIT: POP   CX\n      POP   AX\n \
    \     RET\nDECIBIN ENDP\n```"
  - "[PAGE 282]\n\n# 2.6.7 Procedure Instructions\n\n# Passing Parameters\n\n+   -\
    \ Passing Parameters in 16-bit program\n+     - by stack\n\n**Define a procedure\
    \ “PROSUM” to calculate the sum of WORD array. The number of element in COUNT,\
    \ the result will in SUM.**\n\n```\n```asm\n.DATA\n    ARRAY  WORD 10 DUP(?)\n\
    \    COUNT  WORD 10\n    SUM    WORD ?\n```\n```"
