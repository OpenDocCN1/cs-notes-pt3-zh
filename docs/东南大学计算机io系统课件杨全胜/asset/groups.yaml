    # 2.6.6 String Instructions


    # ■ The basic of string Instruction


    +   - The follow instructions allow data process either a single byte, word or
    double word, or if repeated, a block of bytes, words or double words.

    +     - LODS, STOS, MOVS, INS, OUTS, SCAS, CMPS


    +   - All the instruction has 3 styles with suffix B, W or D for byte, word or
    double word operation.

    +     - LODSB, LODSW, LODSD

    +     - STOSB, STOSW, STOSD

    +     - MOVSB, MOVSW, MOVSD

    +     - INSB, INSW, INSD

    +     - OUTSB, OUTSW, OUTSD

    +     - SCASB, SCASW, SCASD

    +     - CMPSB, CMPSW, CMPSD'
