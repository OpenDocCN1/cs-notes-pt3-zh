  md: "\n## 4.1 Basic Interrupt System\n\n### Interrupt Source\n\nInterrupts occur\
    \ at random times during the execution of a program, in response to signals from\
    \ hardware.\n\nSystem hardware uses interrupts to handle events external to the\
    \ processor, such as requests to service peripheral devices.\n\nSoftware can also\
    \ generate interrupts by executing the INT n instruction.\n\n### Interrupt processing\n\
    \n- 1. The device issues an interrupt signal to the processor.\n- 2. The processor\
    \ finishes execution of the current instruction, then tests for an interrupt,\
    \ determines that there is one, and sends an acknowledgment signal to the device\
    \ that issued the interrupt.\n- 3. The acknowledgment allows the device to remove\
    \ its interrupt signal.\n\n- 4. The processor now needs to prepare to transfer\
    \ control to the interrupt routine. To begin, save information needed to resume\
    \ the current program at the point of interrupt (Done automatically by the hardware).\n\
    \n  ① The status of the processor, which is contained in a register called the\
    \ program status word (PSW).\n\n  ② The location of the next instruction to be\
    \ executed, which is contained in the program counter (PC or IP).\n\n- 5. The\
    \ processor now loads the program counter with the entry location of the interrupt-handling\
    \ program that will respond to this interrupt.\n\n### Interrupt Lines to Processor\n\
    \n- **Single interrupt line**\n  - Only one interrupt line between the processor\
    \ and the I/O modules.\n- **Multiple interrupt lines**\n  - Provide multiple interrupt\
    \ lines between the processor and the I/O modules.\n  - It is impractical to dedicate\
    \ more than a few bus lines or processor pins to interrupt lines.\n\n### Design\
    \ Issues\n\n- Two design issues in implementing interrupt I/O\n  - There are multiple\
    \ I/O modules, how does the processor determine which device issued the interrupt?\n\
    \  - If multiple interrupts have occurred, how does the processor decide which\
    \ one to process?\n\n- Three general categories of techniques are in common use:\n\
    \  - Software poll\n  - Daisy chain (hardware poll, vectored)\n  - Bus arbitration\
    \ (vectored)\n\n### Software Poll\n\n- In interrupt-handle program, poll each\
    \ I/O module to determine which module caused the interrupt.\n- The disadvantage\
    \ of the software poll is that it is time consuming.\n- The order in which modules\
    \ are polled determines their priority.\n\n![](img/d7c975450dfbe59120092c2721be78c6_346_0.png)\n\
    \n◆ Software Poll\n\n![](img/d7c975450dfbe59120092c2721be78c6_347_0.png)\n\n###\
    \ Daisy chain (hardware poll, vectored)\n\n- All I/O modules share a common interrupt\
    \ request line.\n- The interrupt acknowledge line is daisy chained through the\
    \ module.\n- The acknowledge signal from CPU propagate through a series of I/O\
    \ module until it gets to a requesting module.\n- The requesting module typically\
    \ responds by placing a word on the data line. The word is referred to as a *vector\
    \ number* that is:\n  - The address of I/O module.\n  - Some other unique identifier.\n\
    - The processor uses the vector as a pointer to the appropriate device-service\
    \ routine.\n- This technique is called a *vectored interrupt*.\n\nThe order of\
    \ modules on a daisy chain determine their priority.\n\n![](img/d7c975450dfbe59120092c2721be78c6_349_0.png)\n\
    \n### Bus arbitration (vectored)\n\n- Needs an interrupt arbitration or interrupt\
    \ controller\n- Only one module can raise the line at a time.\n- When the processor\
    \ detects the interrupt, it responds on the interrupt acknowledge line.\n- The\
    \ requesting module then places its vector number on the data lines.\n- Bus arbitration\
    \ can employ a priority scheme.\n\n![](img/d7c975450dfbe59120092c2721be78c6_350_0.png)\n"
  mdcn: "\n\n## 4.1 基本中断系统\n\n### 中断源\n\n中断在程序执行期间的随机时间发生，以响应来自硬件的信号。\n\n系统硬件使用中断来处理处理器外部的事件，例如对服务外围设备的请求。\n\
    \n软件也可以通过执行 INT n 指令来产生中断。\n\n### 中断处理\n\n- 1. 设备向处理器发出中断信号。\n- 2. 处理器完成当前指令的执行，然后检测中断，确定存在中断，并向发出中断的设备发送应答信号。\n\
    - 3. 应答允许设备移除其中断信号。\n\n- 4. 处理器现在需要准备好将控制转移到中断例程。为此，首先保存中断点处恢复当前程序所需的信息（由硬件自动完成）。\n\
    \n  ① 处理器的状态，包含在称为程序状态字（PSW）的寄存器中。\n\n  ② 下一条要执行的指令的位置，包含在程序计数器（PC 或 IP）中。\n\n\
    - 5. 处理器现在将程序计数器加载为将响应此中断的中断处理程序的入口位置。\n\n### 到处理器的中断线\n\n- **单中断线**\n  - 处理器与\
    \ I/O 模块之间只有一条中断线。\n- **多中断线**\n  - 在处理器与 I/O 模块之间提供多条中断线。\n  - 将多于少数几条总线线或处理器引脚专用于中断线是不切实际的。\n\
    \n### 设计问题\n\n- 实现中断 I/O 中的两个设计问题\n  - 有多个 I/O 模块，处理器如何确定哪个设备发出了中断？\n  - 如果发生了多个中断，处理器如何决定处理哪一个？\n\
    \n- 三种通用类别的技术被广泛使用：\n  - 软件轮询\n  - 串联菊花链（硬件轮询，向量式）\n  - 总线仲裁（向量式）\n\n### 软件轮询\n\
    \n- 在中断处理程序中，轮询每个 I/O 模块以确定哪个模块导致了中断。\n- 软件轮询的缺点是耗时。\n- 轮询模块的顺序决定了它们的优先级。\n\n\
    ![](img/d7c975450dfbe59120092c2721be78c6_346_0.png)\n\n◆ 软件轮询\n\n![](img/d7c975450dfbe59120092c2721be78c6_347_0.png)\n\
    \n### Daisy chain (hardware poll, vectored)\n\n- 所有 I/O 模块共享一条公共中断请求线。\n- 中断应答线通过模块串联菊花链连接。\n\
    - 来自 CPU 的应答信号通过一系列 I/O 模块传播，直到到达请求模块。\n- 请求模块通常通过在数据线上放置一个字来响应。该字被称为 *向量号*，其为：\n\
    \  - I/O 模块的地址。\n  - 其他唯一标识符。\n- 处理器使用该向量作为指向适当设备服务例程的指针。\n- 这种技术称为 *向量中断*。\n\n\
    模块在串联菊花链上的顺序决定了它们的优先级。\n\n![](img/d7c975450dfbe59120092c2721be78c6_349_0.png)\n\
    \n### Bus arbitration (vectored)\n\n- 需要中断仲裁或中断控制器\n- 同时只能有一个模块拉高该线。\n- 当处理器检测到中断时，它会在中断应答线上响应。\n\
    - 请求模块随后将其向量号放在数据线上。\n- 总线仲裁可以采用优先级方案。\n\n![](img/d7c975450dfbe59120092c2721be78c6_350_0.png)\n\
    \n"
