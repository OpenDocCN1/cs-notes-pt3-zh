    \ 是两个 8 位寄存器。两者通常被视为一个单元并称为 CR（计数寄存器）。\n\n实际计数器标记为 CE（计数元件）。它是一个 16 位可预置的同步下\n\
    \nOL_M 和 OL_L 是两个 8 位锁存器。两者通常被视为一个单元称为 OL（“输出锁存器”）。\n\n## 5.2 8254 的结构和引脚\n###\
