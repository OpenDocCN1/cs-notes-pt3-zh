    # 2.6.6 String Instructions


    # The basic of string Instruction


    # Automatically change (E)SI & (E)DI


    Although each string instruction operates on only one string element at a time,
    it always gets ready to operate on the next element. This is done by changing
    the register (E)SI & (E)DI.


    DF (located in flag register) determine the direction


    +   - **DF=0** (CLD instruction clear it)

    +     - (E)DI&(E)SI will be incremented by 1(byte), 2(word), 4(double word)


    +   - **DF=1** (STD instruction set it)

    +     - (E)DI&(E)SI will be decremented by 1(byte), 2(word), 4(double word)'
  - '[PAGE 256]


    # 2.6.6 String Instructions


    # String Data Transfer Instructions


    # LODS Instruction


    Loads AL, AX or EAX with data stored at the data segment offset address indexed
    by the (E)SI register.


    | Assemble Language | Operation |

    | LODSB | AL=DS:[SI]; if (DF=0) SI=SI+1 else SI=SI-1 |

    | LODSW | AX=DS:[SI]; if (DF=0) SI=SI+2 else SI=SI-2 |

    | LODSD | EAX=DS:[SI]; if (DF=0) SI=SI+4 else SI=SI-4 |'
  md: "\n## 2.6.5 Loop Instructions\n\n- Loop Instructions\n\n```\nLOOP       LABEL\
    \     : LOOP\nLOOPZ/LOOPE LABEL     : Condition LOOP\nLOOPNZ/LOOPNE LABEL    :\
    \ Condition LOOP\n```\n\n| Assembly | Operation | function |\n|---|---|---|\n\
    | **LOOP** | (E)CX <-- (E)CX - 1<br>if ((E)CX) <> 0, then loop | loop until (E)CX=0\
    \ |\n| **LOOPZ**<br>**LOOPE** | (E)CX <-- (E)CX - 1<br>if ((E)CX) <> 0 and ZF=1,\
    \ then loop | loop until (E)CX=0<br>or not equal |\n| **LOOPNZ**<br>**LOOPNE**\
    \ | (E)CX <-- (E)CX - 1<br>if ((E)CX) <> 0 and ZF=0, then loop | loop until (E)CX=0<br>or\
    \ equal |\n\n### Loop Instructions\n\n**Example1:**\nCalculate the sum of all\
    \ elements in byte array which has 10 elements, save the result into TOTAL\n\n\
    ```\nLEA SI, ARRAY       ; base address of array → SI\nMOV CX, 10          ; Length\
    \ of array → CX\nMOV AX, 0\nAGAIN: ADD AL, [SI] ; calculate sum\n      ADC AH,\
    \ 0\n      INC SI         ; modify the pointer\n      LOOP AGAIN\n      MOV TOTAL,\
    \ AX   ; save the result\n```\n\n### Loop Instructions\n\nExample2\n\nFind the\
    \ first none-zero byte in a byte string\n\nSuppose the fist address of string\
    \ in DI, and the last one in BX\n\n```\nSUB BX, DI          ; length of string\
    \ →BX\nINC BX\nMOV CX, BX          ; length of string →CX\nDEC DI\nAGAIN: INC\
    \ DI       ; modify pointer\nCMP BYTE PTR [DI], 0 ; =0?\nLOOPZ AGAIN         ;\
    \ loop until found or to the\n                    ; end of string\nJNZ FOUND \
    \          ; found\n......\nFOUND:\n```\n\n- Loop structure Programming\n\n- Loop\
    \ like \"for(i=1 ;i<n; i++)\"\n\nCalculate: S=1+2+3+…+50; save result in AX register\n\
    \n```\nNUM      DW 1  ;\n......\nMOV      CX,0   ; 初始化\nMOV      AX,0\nROTATE:\n\
    ADD      AX, NUM  ; 累加\nINC      WORD PTR[NUM]\nINC      CX\nCMP      CX,50\n\
    JNZ      ROTATE\nMOV      S,AX\n......\n```\n\n- Loop structure Programming\n\
    - Conditional loop\n\nSTRN is a ‘$’ terminal string which is less than 100 length.\
    \ Please get the length of the string, save it in LENG.\n\n```\n.DATA\nSTRN  BYTE\
    \ ‘XCVFATTDEQJHI…’,‘$’\nLENG  BYTE 0\n```\n\n### Loop structure Programming\n\n\
    - Conditional loop\n\n```\n......\nMOV AX, 0\nMOV DL, AL      ; clear DL(length)\n\
    LEA DI, STRN    ; offset of string in DI\nMOV CX, 100      ; why?\nMOV AL, '$'\n\
    LP:\nCMP AL, [DI]\nJE  DONE         ; Condition\nINC DX           ; length+1\n\
    INC DI           ; modify pointer\nLOOP LP          ; loop why?\nDONE:\nMOV LENG,\
    \ DL     ; save the length\n......\n```\n\n## 2.6.6 String Instructions\n\n- The\
    \ basic of string Instruction\n- String Data Transfer Instructions\n- String Comparisons\
    \ Instruction\n\n### The basic of string Instruction\n\n- The follow instructions\
    \ allow data process either a single byte, word or double word, or if repeated,\
    \ a block of bytes, words or double words.\n- LODS, STOS, MOVS, INS, OUTS, SCAS,\
    \ CMPS\n\n- All the instruction has 3 styles with suffix B, W or D for byte, word\
    \ or double word operation.\n- LODSB, LODSW, LODSD\n- STOSB, STOSW, STOSD\n- MOVSB,\
    \ MOVSW, MOVSD\n- INSB, INSW, INSD\n- OUTSB, OUTSW, OUTSD\n- SCASB, SCASW, SCASD\n\
    - CMPSB, CMPSW, CMPSD\n\n### The basic of string Instruction\n\nAutomatically\
    \ change (E)SI & (E)DI\n\nAlthough each string instruction operates on only one\
    \ string element at a time, it always gets ready to operate on the next element.\
    \ This is done by changing the register (E)SI & (E)DI.\n\nDF (located in flag\
    \ register) determine the direction\n\n- **DF=0** (CLD instruction clear it)\n\
    \  - (E)DI&(E)SI will be incremented by 1(byte), 2(word), 4(double word)\n\n-\
    \ **DF=1** (STD instruction set it)\n  - (E)DI&(E)SI will be decremented by 1(byte),\
    \ 2(word), 4(double word)\n\n### String Data Transfer Instructions\n\n### LODS\
    \ Instruction\n\nLoads AL, AX or EAX with data stored at the data segment offset\
    \ address indexed by the (E)SI register.\n\n| Assemble Language | Operation |\n\
    | LODSB | AL=DS:[SI]; if (DF=0) SI=SI+1 else SI=SI-1 |\n| LODSW | AX=DS:[SI];\
    \ if (DF=0) SI=SI+2 else SI=SI-2 |\n| LODSD | EAX=DS:[SI]; if (DF=0) SI=SI+4 else\
    \ SI=SI-4 |\n"
  mdcn: "\n\n## 2.6.5 循环指令\n\n- 循环指令\n\n```\nLOOP       LABEL     : LOOP\nLOOPZ/LOOPE\
