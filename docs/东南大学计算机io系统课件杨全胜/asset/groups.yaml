  md: "\n## 2.6.7 Procedure Instructions\n\n### Procedure Define\n\n```\nLABEL PROC\
    \ [attributes]\n...; procedure body\nRET\n...; procedure body\nLABEL ENDP\n```\n\
    \n- Procedure body always follows a .CODE directive.\n- Procedure body is bracketed\
    \ by two directives, PROC and ENDP\n- Label gives the name of the procedure.\n\
    - Attributes: near or far\n- At least has one RET instruction\n\n### Procedure\
    \ Define\n\n**Define a procedure to output CRLF to screen. (16bit program use)**\n\
    \n```\nCRLF  PROC NEAR    ; output Carriage Return and Line Feed\n      PUSH AX\n\
    \      PUSH DX\n      MOV  DL, 0DH    ; Carriage Return\n      MOV  AH, 2\n  \
    \    INT  21H       ; output char in DL\n      MOV  DL, 0AH    ; Line Feed\n \
    \     MOV  AH, 2\n      INT  21H       ; output char in DL\n      POP  DX\n  \
    \    POP  AX\n      RET\nCRLF  ENDP\n```\n\n### Passing Parameters\n\n### Passing\
    \ Parameters in 16-bit program\n\nby register\n\nDefine a procedure “PINT” to\
    \ output a decimal number in AX, the offset of convert buffer in DI.\n\n```\n\
    PINT    PROC    NEAR\n    PUSH    DX\n    PUSH    DI\n    PUSH    CX\n    MOV\
    \     CX, 5\nCLEAR_BUF:MOV BYTE PTR[DI], ' '\n    INC     DI\n    LOOP    CLEAR_BUF\n\
    \    MOV     BYTE PTR[DI], '$'\n    DEC     DI\n    MOV     CX, 10\nCHANGE: MOV\
    \ DX, 0\n    DIV     CX\n```\n\n```\nADD     DL, 30H\nMOV     BYTE PTR[DI], DL\n\
    DEC     DI\nCMP     AX, 0\nJNZ     CHANGE\nINC     DI\nMOV     DX, DI\nMOV   \
    \  AH, 9\nINT     21H\nPOP     CX\nPOP     DI\nPOP     DX\nRET\nPINT    ENDP\n\
    ```\n\n- Passing Parameters\n  - Passing Parameters in 16-bit program\n    - by\
    \ register\n\nDefine a procedure “DECIBIN” to input a decimal number from keyboard,\
    \ the number return by BX.\n\n```\nDECIBIN PROC NEAR\n    PUSH  AX\n    PUSH \
    \ CX\n    MOV   BX, 0 ; initial\nNEWCHAR:MOV AH, 1\n    INT   21H ; ASCII in AL\n\
    \    SUB   AL, 30H\n    JL    EXIT   ; < 0\n    CMP   AL, 9\n    JG    EXIT  \
    \ ; > 9\n    CBW\n```\n\n```\nXCHG  AX, BX\nMOV   CX, 10\nMUL   CX   ; old value\
    \ *10\nXCHG  AX, BX\nADD   BX, AX ;add new value\nJMP   NEWCHAR\nEXIT: POP   CX\n\
    \      POP   AX\n      RET\nDECIBIN ENDP\n```\n\n### Passing Parameters\n\n- Passing\
    \ Parameters in 16-bit program\n  - by stack\n\n**Define a procedure “PROSUM”\
    \ to calculate the sum of WORD array. The number of element in COUNT, the result\
    \ will in SUM.**\n\n```asm\n.DATA\n    ARRAY  WORD 10 DUP(?)\n    COUNT  WORD\
    \ 10\n    SUM    WORD ?\n```\n**Main program:**\n\n```\nLEA BX,ARRAY    ; parameter\
    \ in stack\nPUSH BX\nLEA BX,COUNT\nPUSH BX\nLEA BX,SUM\nPUSH BX\nCALL PROSUM\n\
    ......\n\nPROSUM PROC NEAR\n    PUSH BP\n    MOV BP,SP\n    PUSH AX\n    PUSH\
    \ CX\n    PUSH SI\n    PUSH DI\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_283_0.png)\n\
    \n3 parameters push in stack, each use two bytes\n\n```\nMOV SI, [BP+8] ; get\
    \ parameter\nMOV DI, [BP+6]\nMOV CX, [DI]\nMOV DI, [BP+4]\nMOV AX, 0\nADDT: ADD\
    \ AX, [SI]\n      ADD SI, 2\n      LOOP ADDT\nMOV [DI], AX ; save sum\nPOP DI\n\
    POP SI\nPOP CX\nPOP AX\nPOP BP\nRET 6 ; adjust stack\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_284_0.png)\n\
    \n### Passing Parameters\n\n### Passing Parameters in 16-bit program\n\n### Example\n\
    \n**Input** 10 numbers in an array, then calculate the sum of is elements.\n\n\
    ```asm\n.8086\n.MODEL SMALL\n.DATA\n    ARRAY  WORD 10 DUP(?)\n    COUNT  WORD\
    \ 10\n    SUM    WORD ?\n    STRING BYTE 6 DUP(?)\n.STACK 1024\n```\n\n```\n.8086\n\
    .MODEL SMALL\n.DATA\n    ARRAY  WORD 10 DUP(?)\n    COUNT  WORD 10\n    SUM  \
    \  WORD ?\n    STRING BYTE 6 DUP(?)\n.STACK 1024\n.CODE\nSTART:\n    MOV   AX,@DATA\n\
    \    MOV   DS,AX\n    LEA   DI,ARRAY\n    MOV   CX,10\nLP: CALL  DECIBIN\n   \
    \ CALL  CRLF\n    MOV   [DI],BX\n```\n\n```\nADD   DI,2\nLOOP  LP ;input 10 numbers\n\
    LEA   BX,ARRAY\nPUSH  BX\nLEA   BX,COUNT\nPUSH  BX\nLEA   BX,SUM\nPUSH  BX\nCALL\
    \  PROSUM\nMOV   AX,SUM\nLEA   DI,STRING\nCALL  PINT\nCALL  CRLF\nMOV   AX,4C00H\n\
    INT   21H\n......   ; subroutine\nEND START\n```\n"
  mdcn: "\n\n## 2.6.7 程序指令\n\n### 程序定义\n\n```\nLABEL PROC [attributes]\n...; procedure\
    \ body\nRET\n...; procedure body\nLABEL ENDP\n```\n\n- 程序体始终跟随一个 .CODE 指令。\n-\
    \ 程序体由两个指令 PROC 和 ENDP 括起来\n- 标签给出程序的名称。\n- 属性：near 或 far\n- 至少有一个 RET 指令\n\n\
    ### 程序定义\n\n**定义一个程序向屏幕输出 CRLF。（16 位程序使用）**\n\n```\nCRLF  PROC NEAR    ; output\
    \ Carriage Return and Line Feed\n      PUSH AX\n      PUSH DX\n      MOV  DL,\
    \ 0DH    ; Carriage Return\n      MOV  AH, 2\n      INT  21H       ; output char\
    \ in DL\n      MOV  DL, 0AH    ; Line Feed\n      MOV  AH, 2\n      INT  21H \
    \      ; output char in DL\n      POP  DX\n      POP  AX\n      RET\nCRLF  ENDP\n\
    ```\n\n### 参数传递\n\n### 16 位程序中的参数传递\n\n通过寄存器\n\n定义一个过程 “PINT” 输出 AX 中的十进制数，转换缓冲区的偏移量在\
    \ DI 中。\n\n```\nPINT    PROC    NEAR\n    PUSH    DX\n    PUSH    DI\n    PUSH\
    \    CX\n    MOV     CX, 5\nCLEAR_BUF:MOV BYTE PTR[DI], ' '\n    INC     DI\n\
    \    LOOP    CLEAR_BUF\n    MOV     BYTE PTR[DI], '$'\n    DEC     DI\n    MOV\
    \     CX, 10\nCHANGE: MOV DX, 0\n    DIV     CX\n```\n\n```\nADD     DL, 30H\n\
    MOV     BYTE PTR[DI], DL\nDEC     DI\nCMP     AX, 0\nJNZ     CHANGE\nINC     DI\n\
    MOV     DX, DI\nMOV     AH, 9\nINT     21H\nPOP     CX\nPOP     DI\nPOP     DX\n\
    RET\nPINT    ENDP\n```\n\n- 参数传递\n  - 16 位程序中的参数传递\n    - 通过寄存器\n\n定义一个过程 “DECIBIN”\
    \ 从键盘输入一个十进制数，数字通过 BX 返回。\n\n```\nDECIBIN PROC NEAR\n    PUSH  AX\n    PUSH  CX\n\
    \    MOV   BX, 0 ; initial\nNEWCHAR:MOV AH, 1\n    INT   21H ; ASCII in AL\n \
    \   SUB   AL, 30H\n    JL    EXIT   ; < 0\n    CMP   AL, 9\n    JG    EXIT   ;\
    \ > 9\n    CBW\n```\n\n```\nXCHG  AX, BX\nMOV   CX, 10\nMUL   CX   ; old value\
    \ *10\nXCHG  AX, BX\nADD   BX, AX ;add new value\nJMP   NEWCHAR\nEXIT: POP   CX\n\
    \      POP   AX\n      RET\nDECIBIN ENDP\n```\n\n### 参数传递\n\n- 16 位程序中的参数传递\n\
    \  - 通过堆栈\n\n**定义一个过程 “PROSUM” 计算 WORD 数组的和。元素数量在 COUNT 中，结果将放在 SUM 中。**\n\n```asm\n\
    .DATA\n    ARRAY  WORD 10 DUP(?)\n    COUNT  WORD 10\n    SUM    WORD ?\n```\n\
    **主程序：**\n\n```\nLEA BX,ARRAY    ; parameter in stack\nPUSH BX\nLEA BX,COUNT\n\
    PUSH BX\nLEA BX,SUM\nPUSH BX\nCALL PROSUM\n......\n\nPROSUM PROC NEAR\n    PUSH\
    \ BP\n    MOV BP,SP\n    PUSH AX\n    PUSH CX\n    PUSH SI\n    PUSH DI\n```\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_283_0.png)\n\n3 个参数压入堆栈，每个使用两个字节\n\n\
    ```\nMOV SI, [BP+8] ; get parameter\nMOV DI, [BP+6]\nMOV CX, [DI]\nMOV DI, [BP+4]\n\
    MOV AX, 0\nADDT: ADD AX, [SI]\n      ADD SI, 2\n      LOOP ADDT\nMOV [DI], AX\
    \ ; save sum\nPOP DI\nPOP SI\nPOP CX\nPOP AX\nPOP BP\nRET 6 ; adjust stack\n```\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_284_0.png)\n\n### 参数传递\n\n### 16 位程序中的参数传递\n\
    \n### 示例\n\n**输入** 数组中的 10 个数字，然后计算其元素的和。\n\n```asm\n.8086\n.MODEL SMALL\n.DATA\n\
    \    ARRAY  WORD 10 DUP(?)\n    COUNT  WORD 10\n    SUM    WORD ?\n    STRING\
    \ BYTE 6 DUP(?)\n.STACK 1024\n```\n\n```\n.8086\n.MODEL SMALL\n.DATA\n    ARRAY\
    \  WORD 10 DUP(?)\n    COUNT  WORD 10\n    SUM    WORD ?\n    STRING BYTE 6 DUP(?)\n\
    .STACK 1024\n.CODE\nSTART:\n    MOV   AX,@DATA\n    MOV   DS,AX\n    LEA   DI,ARRAY\n\
    \    MOV   CX,10\nLP: CALL  DECIBIN\n    CALL  CRLF\n    MOV   [DI],BX\n```\n\n\
    ```\nADD   DI,2\nLOOP  LP ;input 10 numbers\nLEA   BX,ARRAY\nPUSH  BX\nLEA   BX,COUNT\n\
    PUSH  BX\nLEA   BX,SUM\nPUSH  BX\nCALL  PROSUM\nMOV   AX,SUM\nLEA   DI,STRING\n\
    CALL  PINT\nCALL  CRLF\nMOV   AX,4C00H\nINT   21H\n......   ; subroutine\nEND\
    \ START\n```\n\n"
