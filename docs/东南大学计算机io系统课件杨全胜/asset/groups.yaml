  mdcn: "\n\n## 6.3 8255 工作模式\n### Mode 1 – Strobed Input/Output\n\n- STB#。该输入为“低”时将数据锁存到输入锁存器中。\n\
    - IBF。 该输出为“高”时表示数据已加载到输入锁存器中；本质上是一种应答。IBF 由 STB# 输入为低电平置位，并在 RD# 输入的上升沿复位。\n\
    - INTR。 该输出为“高”时可用于在输入设备请求服务时中断 CPU。INTR 由 STB# 为“1”、IBF 为“1”且 INTE 为“1”时置位。它由\
    \ RD# 的下降沿复位。此过程允许输入设备通过简单地将数据锁存到端口来请求 CPU 服务。\n- INTE A。由 PC4 的位置位/复位控制。\n- INTE\
    \ B。由 PC2 的位置位/复位控制。\n\n![](img/d7c975450dfbe59120092c2721be78c6_458_0.png)\n\n\
    ### ■ Mode 1 — Strobed Input/Output\n\n![](img/d7c975450dfbe59120092c2721be78c6_459_0.png)\n\
    \nGroup A Mode 1 output\n\nGroup B Mode 1 output\n\n- OBF#。OBF# 输出将变为“低”以指示 CPU\
    \ 已向指定端口写出数据。OBF# 由 WR# 输入的上升沿置位，并由 ACK# 输入为低电平复位。\n\n- ACK#。该输入为“低”时通知 8255A，来自端口\
    \ A 或端口 B 的数据已被接受。本质上是外围设备的响应，指示其已接收到 CPU 输出的数据。\n\n- INTR。 该输出为“高”时可用于在输出设备已接受\
    \ CPU 传输的数据时中断 CPU。INTR 在 ACK# 为“1”、OBF# 为“1”且 INTE 为“1”时置位。它由 wWR# 的下降沿复位。\n\n\
    - INTE A。由 PC6 的位置位/复位控制。\n\n- INTE B。由 PC2 的位置位/复位控制\n\n![](img/d7c975450dfbe59120092c2721be78c6_461_0.png)\n\
    \n### Mode 2 – Strobed Bidirectional Bus I/O\n\n- 仅用于 Group A。\n- 一个 8 位双向总线端口（端口\
    \ A）和一个 5 位控制端口（端口 C）。\n- 输入和输出均被锁存。\n- 5 位控制端口（端口 C）用于 8 位双向总线端口（端口 A）的控制和状态。\n\
    \n### Mode 2 – Strobed Bidirectional Bus I/O\n\n- INTR。 该输出为“高”时可用于在输入或输出操作时中断\
    \ CPU。\n\n#### Output Operations\n\n- OBF#。OBF# 输出将变为“低”以指示 CPU 已向端口 A 写出数据。\n\
    \n- ACK#。该输入为“低”时使能端口 A 的三态输出缓冲器以发送数据。否则，输出缓冲器将处于高阻抗状态。\n\n- INTE 2。由 PC6 的位置位/复位控制\n\
    \n#### Input Operations\n\n- STB#。该输入为“低”时将数据锁存到输入锁存器中。\n\n- IBF。 该输出为“高”时表示数据已加载到输入锁存器中。\n\
    \n## 6.4 Programming the 8255\n### Control Word\n\n- 仅写操作（A1A0=11）\n\n| D7 | D6\
    \ | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| FLAG =1\
    \ | Group A Mode<br>00=Mode 0<br>01=Mode 1<br>1X=Mode 2 | Port A<br>0=output<br>1=input\
    \ | Port C Upper<br>0=output<br>1=input | Group B Mode<br>0=Mode 0<br>1=Mode 1\
    \ | Port B<br>0=output<br>1=input | Port C Lower<br>0=output<br>1=input |\n\n\
    e.g. In one system, the Address of 8255 is 60H~63H, Port A in mode 1, input, Port\
    \ B in mode 0, output, Port C upper part as input, lower as output, please write\
    \ the Control word.\n\n```\nMOV AL, 0B8H ; 10111000B\nOUT 63H, AL\n```\n\n###\
    \ Programming the 8255\n\n- Bit set/reset\n  - 仅端口 C（A1A0=11）\n\n| D7 | D6 | D5\
    \ | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n| FLAG=0 | Don’t\
    \ care |  |  | Port C Bit select<br>000=bit 0<br>001=bit 1<br>…<br>111=bit 7 |\
    \  |  | 1 = set<br>0 = reset |\n\ne.g. In the example above, how to enable the\
    \ interrupt for Port A? (Set PC4 = 1)\n\n```\nMOV  AL, 00001001B\nOUT  63H, AL\n\
    ```\n\n"
