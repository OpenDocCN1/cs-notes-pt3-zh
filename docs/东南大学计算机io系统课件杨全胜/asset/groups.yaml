    \ also closes the last segment in the source file.\n\n## 2.4 Assembly Language\
    \ Source Code\n### Simplified Segment\n### Exit the Program\n\n```\nMOV AH, 4CH\n\
    MOV AL, RETURN_VALUE\nINT 21H\n```\n\nINT 20H\n\n```\n.MODEL SMALL\n.STACK 100H\n\
    .DATA\n......\n.CODE\nSTART:\n    MOV AX, @DATA\n    MOV DS, AX\n......\n    MOV\
    \ AH, 4CH\n    INT  21H\nEND START\n```\n"
  mdcn: "\n\n## 2.4 汇编语言源代码\n### 使用简化的段指令\n\n- MASM 程序由段组成的模块构成。\n- 仅用 MASM 编写的每个程序都有一个主模块，程序执行从此处开始。\n\
    - 主模块可以使用所有简化的段指令定义代码、数据或堆栈段。\n  - `.MODEL`、`.CODE`、`.CONST`、`.DATA`、`.DATA?`、`.FARDATA`、`.FARDATA?`、`.STACK`、`.STARTUP`\
    \ 和 `.EXIT`。\n\n### 使用简化的段指令\n### .MODEL\n\n```\n`.MODEL memorymodel [[, langtype]]\
    \ [[, stackoption]]`\n```\n\n- 初始化程序内存模型。\n- 你必须在源文件中任何其他简化段指令之前放置 `.MODEL`。\n\
    - *memorymodel* 可以是 **TINY、SMALL、COMPACT、MEDIUM、LARGE、HUGE** 或 **FLAT**。如果你为高级语言编写汇编例程，此选项应与编译器或解释器使用的内存模型相匹配。\n\
    \n### 使用简化的段指令\n### .MODEL\n\n```\n`.MODEL memorymodel [[, langtype]] [[, stackoption]]`\n\
    ```\n\n| 内存模式 | 段最大大小 | 文件类型 | 操作系统 | 代码段 | 数据段 |\n|---|---|---|---|---|---|\n\
    | Tiny | 64KB | .com | DOS | 一个段 | |\n| Small | 64KB | .exe | DOS | 1 | 1 |\n\
    | Medium | 64KB | .exe | DOS | 多个 | 1 |\n| Compact | 64KB | .exe | DOS | 1 | 多个\
    \ |\n| Large | 64KB | .exe | DOS | 多个 | 多个 |\n| Huge | >64KB | .exe | DOS | 多个\
    \ | 多个 |\n| flat | 4GB | .exe(PE) | Windows | 同一段 | |\n\n### 使用简化的段指令\n### .MODEL\n\
    \n```\n`.MODEL memorymodel [[, langtype]] [[, stackoption]]`\n```\n\n- *langtype*\
    \ 可以是 **C、BASIC、FORTRAN、PASCAL、SYSCALL** 或 **STDCALL**。指示汇编器遵循所指示语言的命名、调用和返回约定。\n\
    - *stackoption* 可以是 **NEARSTACK**（如果 SS 等于 DS）或 **FARSTACK**（如果 SS 不等于 DS）。**NEARSTACK**\
    \ 为默认值。\n\n### 使用简化的段指令\n### 创建数据段\n\n```\n.DATA\n```\n\n`.DATA` 指令创建一个近初始化数据段（段名为\
    \ _DATA）并结束之前的段（如果有）。`.DATA` 段应包含所有具有初始值的全局数据。\n\n`.DATA` 段在 MS-DOS 中最多可占用 64K，在\
    \ Windows 的 flat 模型下可达 512 兆字节。\n\n你可以使用 @data 来确定数据段的组。\n\n### 使用简化的段指令\n###\
    \ 创建数据段\n\n```\n.CONST\n```\n\n开始一个常量数据段并结束之前的段（如果有）。该段应包含所有字符串、实数以及高级语言访问的其他常量数据。它具有\
    \ READONLY 属性。\n\n```\n.DATA?\n```\n\n`.DATA?` 指令开始未初始化数据段（段名为 _BSS）并结束之前的段（如果有）。将所有未初始化数据放在\
    \ `.DATA?` 段中。\n\n### 使用简化的段指令\n### 创建数据段\n\n```\n.STACK [SIZE]\n```\n\n定义一个堆栈段（段名为\
    \ STACK）。可选的 size 指定堆栈的字节数（默认 1,024）。\n\n## 2.4 汇编语言源代码\n### 简化段\n### 结束源文件\n\n\
    ```\nEND [ADDRESS]\n```\n\n标记源文件的结束，并可选择指示程序加载地址。可选的 <address> 是一个标签或表达式，标识程序执行开始的位置。\n\
    \nEND 也会关闭源文件中的最后一个段。\n\n## 2.4 汇编语言源代码\n### 简化段\n### 退出程序\n\n```\nMOV AH, 4CH\n\
    MOV AL, RETURN_VALUE\nINT 21H\n```\n\nINT 20H\n\n```\n.MODEL SMALL\n.STACK 100H\n\
    .DATA\n......\n.CODE\nSTART:\n    MOV AX, @DATA\n    MOV DS, AX\n......\n    MOV\
    \ AH, 4CH\n    INT  21H\nEND START\n```\n\n"
