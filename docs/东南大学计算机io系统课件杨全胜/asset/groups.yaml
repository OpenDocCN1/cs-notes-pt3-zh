    \ and IA-32 Architectures Software Developer Manual*, Intel Corporation Press,\
    \ 2012\n- Intel Corporation, *Intel® 6 Series Chipset and Intel® C200 Series Chipset\
    \ Datasheet*, Intel Corporation Press, 2011\n- Intel Corporation, *Intel® 7 Series\
    \ / C216 Chipset Family Platform Controller Hub (PCH)*, Intel Corporation Press,\
    \ 2012\n\n![](img/d7c975450dfbe59120092c2721be78c6_3_0.png)\n\n![](img/d7c975450dfbe59120092c2721be78c6_3_1.png)\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_4_0.png)\n\n## Computer Input/output\
    \ System\n\n2015\n\nInstructors: Yang Quansheng\n\nSchool of Computer Science\
    \ and Engineering  \nCollege of Software Engineering  \nSoutheast University\n\
    \n## Chapter 1: The IA-32 Microprocessor\n\n### Outline\n\n- Computer Components\n\
    - Intel X86 CPU\n- Real-address mode memory model\n- Data Type\n- Basic Program\
    \ Execution Registers\n- Addressing Modes\n\n### 1.1 Computer Components\n\nAt\
    \ a top level, a computer consists of CPU, memory and I/O components, with one\
    \ or more modules of each type.\n\n![](img/d7c975450dfbe59120092c2721be78c6_9_0.png)\n\
    \nSuch a design is referred to as the *von Neumann architecture* and is based\
    \ on three key concepts:\n\n- Data and instruction are stored in a single read-write\
    \ memory.\n- The contents of this memory are addressable by location, without\
    \ regard to the type of data contained there.\n- Execution occurs in a sequential\
    \ fashion (unless explicitly modified) from one instruction to the next.\n\n![](img/d7c975450dfbe59120092c2721be78c6_10_0.png)\n\
    \n#### Microcomputer with Intel 7 Series Chipset\n\nCPU  \nMemory  \nI/O  \n\n\
    Platform Controller Hub(PCH)\n\n![](img/d7c975450dfbe59120092c2721be78c6_11_0.png)\n\
    \n### 1.2 Intel X86 CPU\n\n- x86 CPU\n  - IA-16: 8086、8088、80286\n  - IA-32\n\
    \    - Before Pentium: 80386、80486\n    - Pentium\n      - P5: Pentium、Pentium\
    \ MMX\n      - P6: Pentium Pro、Pentium II、Pentium III、Pentium M\n      - NetBurst:\
    \ Pentium 4\n      - Core Duo\n    - Core\n      - Pentium NetBurst: Pentium D、Pentium\
    \ Extreme Edition\n  - Intel 64\n    - Core\n      - Core 2 Duo、Core 2 Quad、Core\
    \ 2 Extreme\n    - Core i Series\n      - Nehalem: Core i7、Core i5、Core i3\n \
    \     - Sandy Bridge: Core i7/i5/i3 (2nd Generation)\n      - Ivy Bridge: Core\
    \ i7/i5/i3 (3rd Generation)\n      - Haswell: Core i7/i5/i3 (4th Generation)\n\
    \n| Part Number | Bits | Address Bus Width | Data Bus Width |\n|---|---|---|---|\n\
    | 8086/8088* | 16 | 20 | 16/8 |\n| 80286 | 16 | 24 | 16 |\n| 80386 | 32 | 32 |\
    \ 32 |\n| 80486 | 32 | 32 | 32 |\n| Pentium | 32 | 32 | 64 |\n| Pentium III |\
    \ 32 | 36 | 64 |\n| Pentium 4 | 32 | 36 | 64 |\n| Pentium D | 64 | 36/40 | 64\
    \ |\n| Core 2 Duo | 64 | 36/40 | 64 |\n| Core 2 Quad | 64 | 36/40 | 64 |\n| Nehalem\
    \ | 64 | 36/40 | 64 |\n| Sandy Bridge | 64 | 36/40 | 64 |\n"
  mdcn: "\n\n## 计算机输入/输出系统\n\n2015\n\n授课教师：杨全胜\n\n计算机科学与工程学院  \n软件学院  \n东南大学\n\n###\
    \ 0.1 课程目的\n\n-   学习如何通过 80x86 汇编语言直接控制硬件。\n-   学习如何分析计算机 I/O 系统。\n-   学习如何设计计算机\
    \ I/O 接口。\n\n### 0.2 课程内容\n\n-   80x86 汇编语言与程序设计\n-   I/O 系统基础\n-   中断系统\n-  \
    \ PC 中的基本接口\n    -   8254 可编程间隔定时器\n    -   82C55 可编程外设接口\n    -   16550 可编程通信接口\n\
    \n### 0.3 参考资料\n\n-   Barry B. Brey，《Intel 微处理器——8086/8088、80186/80188、80286、80386、80486、Pentium、Pentium\
    \ Pro Processor、Pentium II、Pentium III、Pentium 4 体系结构与接口》，第7版，机械工业出版社，2006.\n\
    -   Stallings W.，《计算机组织与体系结构：面向性能的设计》，第7版，高等教育出版社，2009.\n-   杨全胜 等，*现代微机原理与接口技术*，第3版，电子工业出版社，2012.\n\
    -   英特尔公司，*Intel 64 和 IA-32 架构软件开发人员手册*，英特尔公司出版社，2012.\n-   英特尔公司，*Intel® 6 系列芯片组和\
    \ Intel® C200 系列芯片组数据手册*，英特尔公司出版社，2011.\n-   英特尔公司，*Intel® 7 系列 / C216 芯片组家族平台控制器中枢（PCH）*，英特尔公司出版社，2012.\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_3_0.png)\n\n![](img/d7c975450dfbe59120092c2721be78c6_3_1.png)\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_4_0.png)\n\n## 计算机输入/输出系统\n\n2015\n\
    \n授课教师：杨全胜\n\n计算机科学与工程学院  \n软件学院  \n东南大学\n\n## 第 1 章：IA-32 微处理器\n\n### 大纲\n\n\
    -   计算机组成部件\n-   Intel X86 CPU\n-   实地址模式内存模型\n-   数据类型\n-   基本程序执行寄存器\n-   寻址方式\n\
    \n### 1.1 计算机组成部件\n\n从顶层看，计算机由 CPU、存储器和 I/O 部件组成，每种类型可以有一个或多个模块。\n\n![](img/d7c975450dfbe59120092c2721be78c6_9_0.png)\n\
    \n这种设计被称为*冯·诺依曼体系结构*，它基于三个关键概念：\n\n-   数据和指令存储在同一个读写存储器中。\n-   该存储器的内容按位置寻址，与其中所包含的数据类型无关。\n\
    -   执行按顺序方式逐条指令进行（除非被显式修改）。\n\n![](img/d7c975450dfbe59120092c2721be78c6_10_0.png)\n\
    \n#### 采用 Intel 7 系列芯片组的微型计算机\n\nCPU  \n存储器  \nI/O  \n\n平台控制器中枢（PCH）\n\n![](img/d7c975450dfbe59120092c2721be78c6_11_0.png)\n\
    \n### 1.2 Intel X86 CPU\n\n-   x86 CPU\n    -   IA-16：8086、8088、80286\n    - \
    \  IA-32\n        -   Pentium 之前：80386、80486\n        -   Pentium\n          \
    \  -   P5：Pentium、Pentium MMX\n            -   P6：Pentium Pro、Pentium II、Pentium\
    \ III、Pentium M\n            -   NetBurst：Pentium 4\n            -   Core Duo\n\
    \        -   Core\n            -   Pentium NetBurst：Pentium D、Pentium Extreme\
    \ Edition\n    -   Intel 64\n        -   Core\n            -   Core 2 Duo、Core\
    \ 2 Quad、Core 2 Extreme\n        -   Core i 系列\n            -   Nehalem：Core i7、Core\
    \ i5、Core i3\n            -   Sandy Bridge：Core i7/i5/i3（第二代）\n            - \
    \  Ivy Bridge：Core i7/i5/i3（第三代）\n            -   Haswell：Core i7/i5/i3（第四代）\n\
    \n| 部件型号 | 位数 | 地址总线宽度 | 数据总线宽度 |\n|---|---|---|---|\n| 8086/8088* | 16 | 20 |\
    \ 16/8 |\n| 80286 | 16 | 24 | 16 |\n| 80386 | 32 | 32 | 32 |\n| 80486 | 32 | 32\
    \ | 32 |\n| Pentium | 32 | 32 | 64 |\n| Pentium III | 32 | 36 | 64 |\n| Pentium\
    \ 4 | 32 | 36 | 64 |\n| Pentium D | 64 | 36/40 | 64 |\n| Core 2 Duo | 64 | 36/40\
    \ | 64 |\n| Core 2 Quad | 64 | 36/40 | 64 |\n| Nehalem | 64 | 36/40 | 64 |\n|\
    \ Sandy Bridge | 64 | 36/40 | 64 |\n\n"
