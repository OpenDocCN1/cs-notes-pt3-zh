  md: "\n## 7.3 RS-232 Standard\n\n### Interface Mechanical Characteristics\n\n###\
    \ Connectors\n\nWhile the RS-232 standard originally specified a 25-pin D-type\
    \ connector, many designers of personal computers chose to implement only a subset\
    \ of the full standard, which is DE-9 Connector.\n\nTerminals and computers have\
    \ male connectors with DTE pin functions, and modems have female connectors with\
    \ DCE pin functions.\n\n![](img/d7c975450dfbe59120092c2721be78c6_496_0.png)\n\n\
    ![](img/d7c975450dfbe59120092c2721be78c6_496_1.png)\n\n## 7.4 16550 UART\n\n-\
    \ The 16550 UART (universal asynchronous receiver/transmitter) is an integrated\
    \ circuit designed for implementing the interface for serial communications.\n\
    - It is frequently used to implement the serial port for IBM PC compatible personal\
    \ computers.\n- It is often connected to an RS-232 interface for modems, serial\
    \ mice, printers, and similar peripherals.\n\n### Main features of the 16550\n\
    \n- The ability to convert data from serial to parallel, and from parallel to\
    \ serial, using shift registers.\n- An on-chip bit rate (baud rate) generator\
    \ to control transmit and receive data rate.\n- Handshake lines for control of\
    \ an external modem, controllable by software.\n- An interrupt function to the\
    \ host microprocessor.\n- An on-chip 16-byte FIFO buffer for both incoming and\
    \ outgoing data; this gives the host system more time to respond to an interrupt\
    \ generated by the UART, without loss of data.\n\n### 16550 UART Pins\n\n![](img/d7c975450dfbe59120092c2721be78c6_499_0.png)\n\
    \n### Parallel data I/O and Control signal\n\n- A0, A1, A2: Register Select\n\
    - CS0, CS1, CS2#: Chip Select\n- D7~D0: Data Bus\n- ADS#: Address Strobe\n  -\
    \ Latches the Register Select and Chip Select\n- DDIS: Driver Disable\n  - Disable\
    \ or control the direction of a data bus transceiver between the CPU and the UART.\n\
    - RD, RD#: Read\n- WR, WR#: Write\n- TXRDY RXRDY: Transmitter and Receiver ...\n\
    \n### Serial data I/O\n\n- SIN: Serial Input\n- SOUT: Serial Output\n- XIN: External\
    \ Crystal Input\n- XOUT: External Crystal Output\n- RCLK: Receiver Clock\n- BAUDOUT#:\
    \ Baud Out\n  - $f_{Baud Out}=f_{XOUT} \\div Divisor\\ latch = Baud\\ rate \\\
    times 16$\n  - The BAUDOUT may also be used for the receiver section by tying\
    \ this output to the RCLK input of the chip.\n\n### Handshake with MODEM\n\n-\
    \ CTS#: Clear to Send, in\n- DCD#: Data Carrier Detect, in\n- DSR#: Data Set Ready,\
    \ in\n- RI#: Ring Indicator, in\n- DTR#: Data Terminal Ready, out\n- RTS#: Request\
    \ to Send, out\n\n### Other\n\n- INTR: Interrupt\n- MR, Master Reset\n- OUT1#,\
    \ OUT2#: User defined output pins\n\n### Basic Configuration\n\n![](img/d7c975450dfbe59120092c2721be78c6_503_0.png)\n\
    \n### Block Diagram\n\n![](img/d7c975450dfbe59120092c2721be78c6_504_0.png)\n\n\
    ### Registers\n\n| DLAB | A₂A₁A₀ | Registers |\n|---|---|---|\n| 0 | 000 | Receiver\
    \ Buffer (R); Transmitter Holding Register (W) |\n| 0 | 001 | Interrupt Enable\
    \ Register |\n| 1 | 000 | Divisor Latch (least significant byte) |\n| 1 | 001\
    \ | Divisor Latch (most significant byte) |\n| X | 010 | Interrupt Identification\
    \ Register (R); FIFO Control (W) |\n| X | 011 | Line Control Register |\n| X |\
    \ 100 | MODEM Control Register |\n| X | 101 | Line Status Register |\n| X | 110\
    \ | MODEM Status Register |\n| X | 111 | Scratch Register |\n\n### Line Status\
    \ Register (LSR)\n\nA2A1A0 = 101\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n\
    |---|---|---|---|---|---|---|---|\n|  | TSRE | THRE | BI | FE | PE | OE | DR |\n\
    \n- D7: Data in FIFO error\n- D6: Transmitter Shift Register Empty indicator\n\
    - D5: Transmitter Holding Register Empty indicator\n- D4: Break Interrupt indicator\n\
    - D3: Received character has no valid Stop bit\n- D2: Receiver Parity Error\n\
    - D1: Overrun Error\n- D0: Receiver Data Ready\n"
  mdcn: "\n\n## 7.3 RS-232 标准\n\n### 接口机械特性\n\n### 连接器\n\nRS-232 标准最初规定使用 25 针 D 型连接器，但许多个人电脑设计人员选择仅实现完整标准的子集，即\
    \ DE-9 连接器。\n\n终端和计算机具有带有 DTE 引脚功能的公连接器，而调制解调器具有带有 DCE 引脚功能的母连接器。\n\n![](img/d7c975450dfbe59120092c2721be78c6_496_0.png)\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_496_1.png)\n\n## 7.4 16550 UART\n\n\
    - 16550 UART（通用异步接收器/发送器）是一种集成电路，专为实现串行通信接口而设计。\n- 它经常用于实现 IBM PC 兼容个人计算机的串行端口。\n\
    - 它通常连接到 RS-232 接口，用于调制解调器、串行鼠标、打印机和类似外设。\n\n### 16550 的主要特性\n\n- 能够使用移位寄存器将数据从串行转换为并行，以及从并行转换为串行。\n\
    - 片上波特率发生器，用于控制发送和接收数据速率。\n- 用于控制外部调制解调器的握手线，可由软件控制。\n- 向主机微处理器的中断功能。\n- 片上 16\
    \ 字节 FIFO 缓冲区，用于接收和发送数据；这为主机系统提供了更多时间来响应 UART 产生的中断，而不会丢失数据。\n\n### 16550 UART\
    \ 引脚\n\n![](img/d7c975450dfbe59120092c2721be78c6_499_0.png)\n\n### 并行数据 I/O 和控制信号\n\
    \n- A0, A1, A2: 寄存器选择\n- CS0, CS1, CS2#: 片选\n- D7~D0: 数据总线\n- ADS#: 地址选通\n  -\
    \ 锁存寄存器选择和片选\n- DDIS: 驱动器禁用\n  - 禁用或控制 CPU 与 UART 之间数据总线收发器的方向。\n- RD, RD#: 读\n\
    - WR, WR#: 写\n- TXRDY RXRDY: 发送器和接收器 ...\n\n### 串行数据 I/O\n\n- SIN: 串行输入\n- SOUT:\
    \ 串行输出\n- XIN: 外部晶振输入\n- XOUT: 外部晶振输出\n- RCLK: 接收时钟\n- BAUDOUT#: 波特率输出\n  - $f_{Baud\
    \ Out}=f_{XOUT} \\div Divisor\\ latch = Baud\\ rate \\times 16$\n  - BAUDOUT 也可通过将该输出连接到芯片的\
    \ RCLK 输入来用于接收器部分。\n\n### 与 MODEM 握手\n\n- CTS#: 清除发送，输入\n- DCD#: 数据载波检测，输入\n-\
    \ DSR#: 数据设备就绪，输入\n- RI#: 振铃指示，输入\n- DTR#: 数据终端就绪，输出\n- RTS#: 请求发送，输出\n\n### 其他\n\
    \n- INTR: 中断\n- MR, 主复位\n- OUT1#, OUT2#: 用户定义输出引脚\n\n### 基本配置\n\n![](img/d7c975450dfbe59120092c2721be78c6_503_0.png)\n\
    \n### 框图\n\n![](img/d7c975450dfbe59120092c2721be78c6_504_0.png)\n\n### 寄存器\n\n\
    | DLAB | A₂A₁A₀ | 寄存器 |\n|---|---|---|\n| 0 | 000 | 接收缓冲器（R）；发送保持寄存器（W） |\n| 0\
    \ | 001 | 中断使能寄存器 |\n| 1 | 000 | 除数锁存器（最低有效字节） |\n| 1 | 001 | 除数锁存器（最高有效字节） |\n\
    | X | 010 | 中断识别寄存器（R）；FIFO 控制（W） |\n| X | 011 | 串行线路控制寄存器 |\n| X | 100 | MODEM\
    \ 控制寄存器 |\n| X | 101 | 串行线路状态寄存器 |\n| X | 110 | MODEM 状态寄存器 |\n| X | 111 | 暂存寄存器\
    \ |\n\n### 串行线路状态寄存器（LSR）\n\nA2A1A0 = 101\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1\
    \ | D0 |\n|---|---|---|---|---|---|---|---|\n|  | TSRE | THRE | BI | FE | PE |\
    \ OE | DR |\n\n- D7: FIFO 中数据错误\n- D6: 发送移位寄存器空指示\n- D5: 发送保持寄存器空指示\n- D4: 断开中断指示\n\
    - D3: 接收字符无有效停止位\n- D2: 接收奇偶校验错误\n- D1: 溢出错误\n- D0: 接收数据就绪\n\n"
