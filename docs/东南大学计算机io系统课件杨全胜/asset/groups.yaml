    ## 1.6 Addressing Modes


    + Components of statement in assembly language


    ```

    [name:] mnemonic [[dest][,src]][;comment]

    [ ] = optional;

    dest and src are Operand

    ```


    + Addressing Mode is the way to find the operand in each instruction:


    ## Operand Addressing Modes


    We use MOV instruction introduce addressing mode.


    ```

    MOV dest , src ; src → dest

    ```


    ## Programming Memory Addressing Modes


    ## Stack Memory Addressing Modes


    ## Operand Addressing


    + - IA-32 machine-instructions act on zero or more operands. Some operands are
    specified explicitly and others are implicit.


    + - The data for a source operand can be located in:

    + - the instruction itself (an immediate operand)

    + - a register

    + - a memory location

    + - an I/O port


    + - for a destination operand, it can be returned to:

    + - a register

    + - a memory location

    + - an I/O port


    ### 1.6.1 Operand Addressing Modes


    ### Immediate Addressing


    Some instructions use data encoded in the instruction itself as a source operand.


    Examples:


    MOV AH, -40    ;    -40→AH

    MOV AX, 34D8H   ;   34H→AH, 0D8H→AL

    MOV AX, -40     ;   0FFD8H(-40)→AX

    MOV EAX, 12345678H ; 12345678H→EAX


    ### Register Addressing


    Source and destination operands in a register, the register ID encoded in the
    instruction


    ![](img/d7c975450dfbe59120092c2721be78c6_54_0.png)


    Examples:


    + - MOV AH, BL    ; (BL)->AH

    + - MOV DS, AX    ; (AX)->DS

    + - MOV SI, AX    ; (AX)->SI

    + - MOV ECX, EDX  ; (EDX)->ECX


    ### Memory Operands Addressing


    Source and destination operands in memory are referenced by means of a segment
    address and an offset.


    ### Memory Operands


    + - Direct Data Addressing

    + - Register Indirect Addressing

    + - Register Relative Addressing

    + - Base-Plus-Displacement Addressing

    + - Index-Plus-Displacement Addressing

    + - Base-Plus-Index Addressing

    + - Base Relative-Plus Index Addressing

    + - Scaled-Index Addressing


    ### Specifying a Segment


    + - The segment selector can be specified either implicitly or explicitly.

    + - The most common method of specifying a segment selector is to load it in a
    segment register and then allow the processor to select the register implicitly,
    depending on the type of operation being performed.


    The processor automatically chooses a segment


    | Reference Type | Register Used | Segment Used | Default Selection Rule |

    |---|---|---|---|

    | Instructions | CS | Code Segment | All instruction fetches. |

    | Stack | SS | Stack Segment | All stack pushes and pops. Any memory reference
    which uses the ESP or EBP register as a base register. |

    | Local Data | DS | Data Segment | All data references, except when relative to
    stack or string destination. |

    | Destination Strings | ES | Data Segment pointed to with the ES register | Destination
    of string instructions. |


    ### Segment Override


    When storing data in memory or loading data from memory, the DS segment default
    can be overridden to allow other segments to be accessed. Within an assembler,
    the segment override is generally handled with a colon “:” operator.


    ### Example:


    ```

    MOV AX, [10H]    ; Data in DS Segment

    MOV AX, ES:[10H] ; Data in ES Segment

    ```


    + - The following default segment selections cannot be overridden:

    + - Instruction fetches must be made from the code segment.

    + - Destination strings in string instructions must be stored in the data segment
    pointed to by the ES register.

    + - Push and pop operations must always reference the SS segment.


    ### Specifying an Offset


    The offset part of a memory address can be specified directly as a static value
    (called a displacement) or through an address computation made up of one or more
    of the following components:


    + - Displacement — An 8-, 16-, or 32-bit value.

    + - Base — The value in a general-purpose register.

    + - Index — The value in a general-purpose register.

    + - Scale factor — A value of 2, 4, or 8 that is multiplied by the index value.(80386
    or above)

    '
