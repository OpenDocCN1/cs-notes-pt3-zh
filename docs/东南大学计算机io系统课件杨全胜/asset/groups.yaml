  mdcn: "\n\n## 2.6.3 逻辑指令\n\n### 移位和旋转指令\n\n◆ 旋转指令\n\n```\nOP DST, CNT: OP is ROL,\
    \ RCL, ROR, RCR\n```\n\n- **OP is**\n  - `ROL` - DST 左旋转 CNT 次\n  - `RCL` - DST\
    \ 通过 CF 左旋转 CNT 次\n  - `ROR` - DST 右旋转 CNT 次\n  - `RCR` - DST 通过 CF 右旋转 CNT 次\n\
    \n- **DST is** 一个寄存器或内存中的数据\n\n- **CNT is**\n  - `1`\n  - `CL`\n  - `Imm8 (80386\
    \ 或以上仅限)`\n\nROL\nCF\nRCL\nCF\nROR\nCF\nRCR\nCF\n\n### 移位和旋转指令\n\n### 旋转指令\n\n\
    将 AL 的 LSb 发送到 BL 的 LSb，保持 AL 不变。\n\n```\nror bl,1\nror al,1\nrcl bl,1\nrol al,1\n\
    ```\n\n### 仅影响 OF 和 CF\n\n- 移出的最后一位进入 CF\n- OF 标志仅对 1 位旋转有定义；如果符号改变，则 OF=1\n\n\
    ### 移位和旋转指令\n\n### 示例\n\n将 ASCII 字符串 ‘96’ 转换为压缩 BCD 96H\n\nASC\n‘9’\n‘6’ → BCD\n\
    96H\n\n```\nMOV AL, ASC        ; AL<--39H (‘9’)\nMOV CL, 4\nSHL AL, CL       \
    \  ; 39H->90H\nMOV BL, AL         ; BL<--90H\nMOV AL, ASC+1      ; AL<--36H (‘6’)\n\
    AND AL, 0FH        ; AL<--06H\nOR  BL, AL         ; BL<--96H\nMOV BCD, BL\n```\n\
    \n### 移位和旋转指令\n\n◆ 示例\n\n**将 AL 中的压缩 BCD 转换为 ASCII 码，保存到由 BX寻址的内存中**\n\n```\n\
    MOV  DL, AL\nMOV  CL, 4\nSHR  AL, CL\nOR   AL, 30H\nMOV  [BX], AL\nINC  BX\nMOV\
    \  AL, DL\nAND  AL, 0FH\nOR   AL, 30H\nMOV  [BX], AL\n```\n\n### 移位和旋转指令\n\n+\
    \ 示例\n\n分析以下程序的功能\n\n```\nMOV CL, 4\nSHL DX, CL\nMOV BL, AH\nSHL AX, CL\nSHR BL,\
    \ CL\nOR DL, BL\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_222_0.png)\n\n\
    DX:AX 左移 4 位\n\n## 计算机输入/输出系统\n\n2015\n\n讲师：杨全胜\n\n计算机科学与工程学院\n软件工程学院\n东南大学\n\n\
    ## 第 2 章：\n\n## IA-32 汇编语言与编程(3)\n\n## 2.6.4 跳转指令\n\n- 无条件跳转\n- 条件跳转\n- 分支结构编程\n\
    - 机器控制指令\n\n### 无条件跳转 (JMP)\n\n### 短跳转\n\n```\nJMP SHORT OPR\n```\n\n- 当前段内的相对短跳转\n\
    - 新地址为\n  - (E)IP=(E)IP+8 位位移\n    - 位移是一个一字节有符号数，其值范围在 +127~-128 之间\n- 我们可以使用标签（内存地址的符号名）与短跳转指令一起使用\n\
    \n### 无条件跳转 (JMP)\n\n### 近跳转\n\n```\nJMP OPR\n```\n\n- 当前段内的相对近跳转\n- 在实模式下\n \
    \ - (E)IP=(E)IP+16 位位移\n    - 位移是一个 2 字节有符号数，其值范围在 +32767~-32768 之间\n- 在 80386\
    \ 或以上处理器的保护模式下\n  - EIP=EIP+32 位位移\n    - 位移是一个 4 字节有符号数，其值范围在 +2G~-2G 之间\n- 我们也可以使用标签。\n\
    \n### 无条件跳转 (JMP)\n\n◆ 远跳转\n\n```\nJMP FAR PTR OPR\n```\n\n- 获取新的段和偏移地址以完成跳转\n\
