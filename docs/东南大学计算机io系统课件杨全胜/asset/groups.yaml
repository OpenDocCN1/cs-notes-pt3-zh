    # 7.4 16550 UART


    # Divisor Latch (DL)


    DLAB=1, A2A1A0=001(MSB) or 000(LSB)


    The UART contains a programmable Baud Generator that is capable of taking any
    clock input from DC to 24 MHz and dividing it by any divisor


    Value_Divisor Latch = (frequency_XOUT) ÷ (baud rate × 16)


    16550 use 18.432MHz crystal as a timing source in PC. if 240 is programmed into
    the Baud rate divisor. The Baud rate is (18.432MHz ÷16) ×240 = 4800 Baud


    Transmit 7-bit ASCII code with 1 bit parity and 1 bit stop by using 16550, if
    the data transfer rate of 960 characters per sec, what is the value of divisor
    latch?'
