  mdcn: "\n\n## 1.6.1 操作数寻址方式\n\n### I/O 端口寻址\n\n### I/O 端口直接寻址\n\n8 位 I/O 端口地址（地址在\
    \ 00 到 0FFH 之间）必须使用立即操作数寻址。\n\n- IN AL, 20H ; 从端口 20h 输入一个字节到 AL\n- OUT 63H, AL\
    \ ; 从 AL 输出一个字节到端口 63h\n\n### I/O 端口间接寻址\n\n16 位 I/O 端口地址（地址高于 0FFH）必须使用 DX 寄存器中的值寻址。\n\
    \n- MOV DX,3F8H\n- IN AL, DX ; 从端口 3f8h 输入一个字节到 AL\n\n## 1.6.2 程序存储器寻址方式\n\n-\
    \ 与 JMP 和 CALL 指令一起使用的程序存储器寻址方式\n- 包含三种不同的形式：\n  - 直接程序存储器寻址\n  - 相对程序存储器寻址\n\
    \  - 间接程序存储器寻址\n\n### 相对程序存储器寻址方式\n\n- 术语 relative 指“相对于 IP”\n- JMP 指令是一个字节的指令，带有一个字节或两个字节的位移，该位移加到\
    \ IP 上。两种类型都可以跳转到当前代码段内的任何位置\n  - 一个字节的位移用于短跳转\n  - 两个字节的位移用于近跳转或调用\n- 相对 JMP\
    \ 和 CALL 指令包含 8 位或 16 位有符号位移，允许向前内存引用或向后内存引用。\n\n- 所有汇编器都会自动计算位移的距离并选择合适的一个字节或两个字节形式。\n\
    \  - 8 位位移的跳转范围为从下一条指令起 +127 到 -128 字节；16 位位移的范围为 ± 32K 字节。\n\n| offset | Machine\
    \ code | program |\n|---|---|---|\n| 0000 | 0405 | ST: ADD AL,05H |\n| 0002 |\
    \ 90 | NOP |\n| 0003 | EBFB | JMP SHORT ST |\n| 0005 | 90 | NOP |\n\n### 间接程序存储器寻址方式\n\
    \n- 远间接\n\n远间接跳转指令可以使用任何相对寄存器；以及带位移的任何相对寄存器作为下一条指令的地址。\n\n如果 (DS)=2500H, (SI)=1300H,\
    \ (26300H)=4500H, (26302H)=32F0H，执行后：\n\n```\nJMP DWORD PTR [SI]: CS=32F0H, IP=4500H\n\
    ```\n\n## 1.6.3 堆栈存储器寻址方式\n\n- 什么是堆栈？\n  - 堆栈临时保存数据，用于存储过程使用的返回地址。\n  - 堆栈存储器是一种\
    \ LIFO（后进先出）存储器。\n\n- 堆栈存储器寻址方式\n  - 它包含在一个段中，并由 SS 寄存器中的段选择符标识。\n  - SP 寄存器始终指向堆栈段内的一个内存区域。\n\
    \  - 项目使用 PUSH 指令压入堆栈，使用 POP 指令从堆栈中取出。\n\n### PUSH 操作\n\n- 每当一个字数据被压入堆栈时，高 8 位被放置在\
    \ SP-1 地址的存储位置；低 8 位被放置在 SP-2 地址的存储位置。\n\n- 然后 SP 递减 2，以便下一个字数据存储在下一个可用的堆栈内存位置。\n\
    \n### POP 操作\n\n- 每当一个字数据从堆栈弹出时，低 8 位从 SP 地址的存储位置移除。高 8 位从 SP+1 地址的存储位置移除。\n\n\
    - 然后 SP 增加 2。\n\n### 注意\n\n- 在 8086 到 80286 微处理器中，PUSH 和 POP 存储或检索字数据——从不为字节——80386\
    \ 及以上允许字或双字。\n- 数据可以从堆栈弹出到任何寄存器或任何段寄存器中，除了 CS。\n- SP 寄存器加上 SS × 10H 形成实模式下的堆栈内存地址。\n\
    \n```\nExample:\nPUSH  AX\nPOP   DS\n```\n\n"
