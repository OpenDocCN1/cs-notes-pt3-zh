    STRN 是一个以 ‘$’ 结尾的字符串，长度小于 100。请获取字符串的长度，将其保存到 LENG。\n\n```\n.DATA\nSTRN  BYTE\
    \ ‘XCVFATTDEQJHI…’,‘$’\nLENG  BYTE 0\n```\n\n### 循环结构编程\n\n- 条件循环\n\n```\n......\n\
    MOV AX, 0\nMOV DL, AL      ; clear DL(length)\nLEA DI, STRN    ; offset of string\
    \ in DI\nMOV CX, 100      ; why?\nMOV AL, '$'\nLP:\nCMP AL, [DI]\nJE  DONE   \
    \      ; Condition\nINC DX           ; length+1\nINC DI           ; modify pointer\n\
    LOOP LP          ; loop why?\nDONE:\nMOV LENG, DL     ; save the length\n......\n\
    ```\n\n## 2.6.6 字符串指令\n\n- 字符串指令的基础\n- 字符串数据传输指令\n- 字符串比较指令\n\n### 字符串指令的基础\n\n\
    - 以下指令允许对单个字节、字或双字进行数据处理，或在重复时对字节、字或双字的块进行处理。\n- LODS, STOS, MOVS, INS, OUTS,\
    \ SCAS, CMPS\n\n- 所有指令都有 3 种带后缀 B、W 或 D 的样式，分别用于字节、字或双字操作。\n- LODSB, LODSW, LODSD\n\
    - STOSB, STOSW, STOSD\n- MOVSB, MOVSW, MOVSD\n- INSB, INSW, INSD\n- OUTSB, OUTSW,\
    \ OUTSD\n- SCASB, SCASW, SCASD\n- CMPSB, CMPSW, CMPSD\n\n### 字符串指令的基础\n\n自动更改\
    \ (E)SI & (E)DI\n\n尽管每个字符串指令每次只对一个字符串元素进行操作，但它总是准备好对下一个元素进行操作。这是通过更改寄存器 (E)SI\
    \ & (E)DI 来完成的。\n\nDF（位于标志寄存器中）决定方向\n\n- **DF=0** （CLD 指令清除它）\n  - (E)DI&(E)SI\
    \ 将按 1（字节）、2（字）、4（双字）递增\n\n- **DF=1** （STD 指令设置它）\n  - (E)DI&(E)SI 将按 1（字节）、2（字）、4（双字）递减\n\
    \n### 字符串数据传输指令\n\n### LODS 指令\n\n将 AL、AX 或 EAX 加载为存储在由 (E)SI 寄存器索引的数据段偏移地址的数据。\n\
    \n| Assemble Language | Operation |\n| LODSB | AL=DS:[SI]; if (DF=0) SI=SI+1 else\
    \ SI=SI-1 |\n| LODSW | AX=DS:[SI]; if (DF=0) SI=SI+2 else SI=SI-2 |\n| LODSD |\
    \ EAX=DS:[SI]; if (DF=0) SI=SI+4 else SI=SI-4 |\n\n"
