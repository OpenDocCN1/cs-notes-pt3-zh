  mdcn: "\n\n## 4.2 8259A PIC\n### 操作和命令\n\n- **端口地址**\n  - 只有两个端口地址。\n- **命令**\n\
    \  - 初始化命令字\n    - ICW1, ICW2, ICW3 和 ICW4\n  - 操作命令字\n    - OCW1, OCW2, OCW3\n\
    - **可读取的状态**\n  - IRR, ISR, IMR, 状态字\n- **用少量地址读写更多命令和状态的方式**\n  - 数据有空闲位：特征位(CHB)\n\
    \  - 数据无空闲位：时序(TS); R/W\n\n| x86 中的 PIC1 | x86 中的 PIC2 | R/W | 内容 | CHB D4 D3\
    \ D2 | 时序 |\n|---|---|---|---|---|---|\n| 20H | 0A0H | 写 | ICW1 | 1 × × | - |\n\
    |  |  |  | OCW2 | 00 × |  |\n|  |  |  | OCW3 | 01 × |  |\n| 21H | 0A1H | 写 | ICW2~ICW4\
    \ | 无 | ICW1 之后，ICW2→ICW4 |\n|  |  |  | OCW1 |  | 在正常状态下 |\n| 20H | 0A0H | 读 |\
    \ IRR, ISR 状态字 | 无 | 由 OCW3 决定 |\n| 21H | 0A1H | 读 | IMR | - | - |\n\n注：ICW x\
    \ 仅在初始化期间使用。\n\n### 初始化命令字 1(ICW1)\n\n| A0 | D7 | D6 | D5 | D4 | D3 | D2 | D1\
    \ | D0 |\n|---|---|---|---|---|---|---|---|---|\n| 0 | 0 | 0 | 0 | 1 | LTIM |\
    \ ADI | SNGL | IC4 |\n\n无效：D7 D6 D5\nCHB：D4\n无效：D2\nIC4：=0：不需要 ICW4\n=1：需要 ICW4\n\
    SNGL：=0：级联模式\n=1：单片\nLTIM：=0：边沿触发模式\n=1：电平触发模式\n\n如果 SNGL = 1，则不会发出 ICW3。\n\n\
    ### 初始化命令字 2(ICW2)\n\n| A0 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 1 | T7 | T6 | T5 | T4 | T3 | 0 | 0 | 0 |\n\n中断向量号的左起 5 位    无效\n\n序列：ICW1 →\
    \ ICW2 → [ICW3] → [ICW4]\n\nIRi 的中断向量号 = ICW2 的 [7:3] + i\n\n例如，如果 ICW2 = 08H\
    \ 则\nIR3 的中断向量号 = 08H + 03H = 0BH\n\n如果中断向量号为 16H，ICW2 的值是多少？该中断请求线连接到哪个 IR 引脚？\n\
    \n### 初始化命令字 3(ICW3)\n\n| A0 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 1 | S7 | S6 | S5 | S4 | S3 | S2 | S1 | S0 |\n\n主控制器的 ICW3\n\n| A0 | D7 | D6\
    \ | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n| 1\
    \ | × | × | × | × | × | ID2 | ID1 | ID0 |\n\n从控制器的 ICW3\n\n对于主控制器，ICW3 用于指示哪个\
    \ IRQ 输入线用于级联从控制器。ICW3 中对应的位被置为 1。\n\n对于从控制器，ICW3 是在中断应答周期中使用的从设备识别码。\n\n### 初始化命令字\
    \ 3(ICW3)\n\n![](img/d7c975450dfbe59120092c2721be78c6_368_0.png)\n\n主控制器的 ICW3\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_368_1.png)\n\n从控制器的 ICW3\n\n```\nMaster:\
    \ MOV AL, 14H\n        OUT 21H, AL\nSlave A: MOV AL, 04H\n         OUT 0A1H, AL\n\
    Slave B: MOV AL, 02H\n         OUT 0C1H, AL\n```\n\n![](img/d7c975450dfbe59120092c2721be78c6_368_2.png)\n\
    \n### 初始化命令字 4(ICW4)\n\n| A0 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 1 | 0 | 0 | 0 | SFNM | BUF | M/S# | AEOI | µPM |\n\n- D0：1 = 8086/8088 模式；0\
    \ = MCS-8080 模式\n- D1：1 = 自动 EOI 模式；0 = 正常 EOI\n- D3D2：0X = 非缓冲模式；10 = 缓冲模式/从设备；11\
    \ = 缓冲模式/主设备\n- D4：1 = 特殊全嵌套模式；0 = 全嵌套模式\n\n### 操作控制字 1 (OCW1)\n\n| A0 | D7 |\
    \ D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|---|\n\
    | 1 | M7 | M6 | M5 | M4 | M3 | M2 | M1 | M0 |\n\n1=屏蔽 0=使能\n\nOCW1 设置和清除中断屏蔽寄存器\
    \ (IMR) 中的屏蔽位。\n\nM7~M0 表示八个屏蔽位。\n\n- M = 1 表示该通道被屏蔽（禁止），\n- M = 0 表示该通道被使能。\n\
    \n"
