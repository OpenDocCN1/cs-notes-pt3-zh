    \ MASM 5.0 一样）。\n\n字符串初始化，可用于 BYTE 指令，为字符串的每个字符分配一个字节。字符以最左边的字符存储在最低的内存位置中\n\n\
    ### 数据定义\n### 声明整数变量\n\n为整数变量分配内存并初始化\n\n```\nX1    BYTE    16          ; Initialize\
    \ byte to 16\nS2    SBYTE   -16         ; Initialize signed byte to -16\nX3  \
    \  WORD    4*3         ; Initialize word to 12\nS4    SWORD   4*5         ; Initialize\
    \ signed word to 20\nX5    DWORD   ?           ; Allocate uninitialized int\n\
    LT    DWORD   4294967295  ; Initialize double word (int) to\n                \
    \         ; 4,294,967,295\nQX    QWORD   ?           ; Allocate uninitialized\
    \ long\n         BYTE 1, 2, 3, 4, 5, 6 ; Initialize 6 unnamed bytes\nX7    TBYTE\
    \ (120+50)/10   ; Initialize 10-byte binary\n                         ; number\
    \ 17\n```\n\n### 数据定义\n### 声明和引用数组\n\n- 数组元素在内存中连续占用，因此程序相对于数组的开始引用每个元素。\n- 要声明一个数组，请提供标签名、元素类型以及一系列初始化值或\
    \ `?` 占位符。\n\n```\nwarray WORD 1, 2, 3, 4\nxarray DWORD 0FFFFFFFFh, 789ABCDEh\n\
    var1 BYTE 10, 20, 30\n    BYTE 40, 50, 60\n    BYTE 70, 80, 90\nsarray WORD ?,\
    \ 40, ?\n```\n\n### 数据定义\n### 声明和引用数组\n### DUP 运算符\n\n```\ncount DUP (initializer\
    \ [, initializer]...)\n```\n\n- 您也可以使用 DUP 运算符声明数组。\n- **count** 值设置在括号内所有值的重复次数。\n\
