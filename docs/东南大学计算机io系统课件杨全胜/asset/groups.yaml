  md: "\n## 3.2 Principal I/O techniques\n### Programmed I/O\n\nI/O command that an\
    \ I/O module may receive when it is addressed by a processor\n\n- Control: Used\
    \ to activate a peripheral and tell it what to do.\n- Test: Used to test various\
    \ status conditions associated with an I/O module and its peripherals.\n- Read:\
    \ Cause the I/O module to obtain an item of data from the peripheral and place\
    \ it in an internal buffer. The processor can then obtain the data item by requesting\
    \ that the I/O module place it on the data bus.\n- Write: Cause the I/O module\
    \ to take an item of data from the data bus and subsequently transmit that data\
    \ item to the peripheral.\n\nThe problem with programmed I/O is:\n\n- That the\
    \ processor has to wait a long time for the I/O module of concern to be ready\
    \ for either reception or transmission of data.\n- The processor, while waiting,\
    \ must repeatedly interrogate the status of the I/O module.\n- As a result, the\
    \ level of the performance of the entire system is severely degraded.\n\n### Interrupt-Driven\
    \ I/O\n\n- Processor issue an I/O command to a module and then go on to do some\
    \ other useful work.\n- The I/O module will then interrupt the processor to request\
    \ service when it is ready to exchange data with the processor.\n- The processor\
    \ then executes the data transfer, as before, and then resumes its former processing.\n\
    \n#### How Interrupt-Driven I/O do for input, for example\n\n1. The processor\
    \ issues a READ command to I/O module, then goes off and does something else.\n\
    2. The I/O module get the data from the device and latch them in buff, then interrupt\
    \ the processor to require service.\n3. The processor saves the context of the\
    \ current program and process the interrupt to read the word of data from the\
    \ I/O module and stores it in memory or register.\n4. The processor restores the\
    \ context of the program it was working on and resumes execution.\n\n### Direct\
    \ Memory Access\n\n- When a processor wishes to read or write a block of data,\
    \ it issues a command to the DMA module. Then the processor continues with other\
    \ work.\n- The DMA do the I/O operation to transfer the entire block of data directly\
    \ to or from memory, without going through the processor.\n- When the transfer\
    \ is complete the DMA module send an interrupt to the processor.\n- Thus, the\
    \ processor is involved only at the beginning and end of the transfer or when\
    \ the transfer has problem.\n\n![](img/d7c975450dfbe59120092c2721be78c6_305_0.png)\n\
    \n**(a) Programmed I/O**\n\n**(b) Interrupt-Driven I/O**\n\n**(c) Direct Memory\
    \ Access**\n\nFigure 7.4  Three Techniques for Input of a Block of Data\n\n###\
    \ I/O Channels\n\n- The I/O module is enhanced to become an processor in its own\
    \ right, with a specialized instruction set tailored for I/O. This I/O module\
    \ is often referred to as an I/O channel.\n- The I/O channel has the ability to\
    \ execution the I/O instructions, which gives it complete control over I/O operations.\n\
    - The CPU dose not execute I/O instructions, such instructions are stored in the\
    \ main memory to be executed by a special-purpose processor in the I/O channel\
    \ itself.\n\n### I/O Processor\n\n- The I/O module has a local memory of its own\
    \ and is, in fact, a computer in its own right.\n- With this architecture, a large\
    \ set of I/O devices can be controlled, with minimal CPU involvement.\n- A common\
    \ use for such an architecture has been to control communication with interactive\
    \ terminals.\n- The I/O processor takes care of most of the tasks involved in\
    \ controlling the terminals.\n\n## 3.3 The type of the I/O address space\n###\
    \ Isolated I/O\n\n- The address for isolated I/O device, called ports address,\
    \ is separate from the memory address space.\n- The user can expand the memory\
    \ to its full size without using any of memory space for I/O device.\n- Disadvantage:\n\
    \  - Data transfer between I/O and CPU must be accessed by the specialized I/O\
    \ instructions.\n  - Need specialized the control signal(M/IO,WR,RD)\n- X86-based\
    \ system used.\n\n![](img/d7c975450dfbe59120092c2721be78c6_308_0.png)\n"
  mdcn: "\n\n## 3.2 主要 I/O 技术\n### 程序化 I/O\n\n处理器寻址时 I/O 模块可能接收到的 I/O 命令\n\n- Control:\
    \ 用于激活外设并告诉它做什么。\n- Test: 用于测试与 I/O 模块及其外设相关的各种状态条件。\n- Read: 使 I/O 模块从外设获取一个数据项并将其放入内部缓冲区。处理器随后可以通过请求\
    \ I/O 模块将其置于数据总线上来获取该数据项。\n- Write: 使 I/O 模块从数据总线取出一个数据项，随后将该数据项传输到外设。\n\n程序化\
    \ I/O 的问题是：\n\n- 处理器必须长时间等待相关 I/O 模块准备好接收或传输数据。\n- 处理器在等待期间，必须反复询问 I/O 模块的状态。\n\
    - 结果，整个系统的性能水平严重下降。\n\n### 中断驱动 I/O\n\n- 处理器向模块发出 I/O 命令，然后继续进行其他有用工作。\n- I/O\
    \ 模块在准备好与处理器交换数据时，会中断处理器以请求服务。\n- 处理器随后执行数据传输，如前所述，然后恢复其先前的处理。\n\n#### 中断驱动 I/O\
    \ 如何进行输入，例如\n\n1. 处理器向 I/O 模块发出 READ 命令，然后去做其他事情。\n2. I/O 模块从设备获取数据并将其锁存在 buff\
    \ 中，然后中断处理器以要求服务。\n3. 处理器保存当前程序的上下文并处理中断，以从 I/O 模块读取数据字并将其存储在内存或寄存器中。\n4. 处理器恢复其正在处理的程序的上下文并恢复执行。\n\
    \n### 直接存储器访问\n\n- 当处理器希望读取或写入一块数据时，它向 DMA 模块发出命令。然后处理器继续进行其他工作。\n- DMA 执行 I/O\
    \ 操作，将整个数据块直接传输到内存或从内存传输，而无需经过处理器。\n- 传输完成后，DMA 模块向处理器发送中断。\n- 因此，处理器仅在传输开始和结束时或传输出现问题时才参与。\n\
    \n![](img/d7c975450dfbe59120092c2721be78c6_305_0.png)\n\n**(a) Programmed I/O**\n\
    \n**(b) Interrupt-Driven I/O**\n\n**(c) Direct Memory Access**\n\nFigure 7.4 \
    \ Three Techniques for Input of a Block of Data\n\n### I/O 通道\n\n- I/O 模块得到增强，成为其自身的一个处理器，具有专门为\
    \ I/O 定制的指令集。这种 I/O 模块通常被称为 I/O 通道。\n- I/O 通道具有执行 I/O 指令的能力，这使其完全控制 I/O 操作。\n\
    - CPU 不执行 I/O 指令，这类指令存储在主内存中，由 I/O 通道本身中的专用处理器执行。\n\n### I/O 处理器\n\n- I/O 模块拥有自己的本地内存，事实上是一个独立的计算机。\n\
    - 采用这种架构，可以控制大量 I/O 设备，同时 CPU 参与最少。\n- 这种架构的常见用途是控制与交互式终端的通信。\n- I/O 处理器负责控制终端所涉及的大多数任务。\n\
    \n## 3.3 I/O 地址空间的类型\n### 隔离 I/O\n\n- 隔离 I/O 设备的地址，称为端口地址，与内存地址空间分开。\n- 用户可以将内存扩展到其最大容量，而无需使用任何内存空间用于\
    \ I/O 设备。\n- 缺点：\n  - I/O 与 CPU 之间的数据传输必须通过专用 I/O 指令访问。\n  - 需要专用控制信号(M/IO,WR,RD)\n\
    - X86-based system used.\n\n![](img/d7c975450dfbe59120092c2721be78c6_308_0.png)\n\
    \n"
