  mdcn: "\n\n## 2.6.1 数据传输指令\n### 杂项数据传输指令\n\n- LAHF 指令\n  - 将标志寄存器的最右八位传输到 AH 寄存器。\n\
    - SAHF 指令\n  - 将 AH 寄存器传输到标志寄存器的最右八位。\n\n### XLAT 指令\n\n- 将 AL 寄存器的内容转换为内存表中存储的数字。\n\
    - 表的偏移量必须在 (E)BX 寄存器中。\n- 表的类型为字节。\n\n**示例：**\n\n```asm\nMOV BX, OFFSET TABLE\n\
    \     ; EA of table to BX\nMOV AL, 4\n     ; index in AL\nXLAT\n```\n\n| TABLE\
    \ | Value |\n|---|---|\n| +0 | 30H |\n| +1 | 31H |\n| +2 | 32H |\n| +3 | 33H |\n\
    | +4 | 34H |\n| +5 | 35H |\n| +6 | 36H |\n| +7 | 37H |\n\n![](img/d7c975450dfbe59120092c2721be78c6_160_0.png)\n\
    \n### IN 和 OUT 指令\n\n- IN 指令将数据从外部 I/O 设备传输到 AL、AX 或 EAX。\n- OUT 指令将数据从 AL、AX\
    \ 或 EAX 传输到外部 I/O 设备。\n- 存在两种形式的 I/O 设备（端口）寻址\n- 固定端口寻址允许使用 8 位 I/O 端口地址的立即寻址（直接寻址）在\
    \ AL、AX、EAX 之间进行数据传输。\n- 可变端口寻址允许使用 16 位 I/O 端口地址在 AL、AX、EAX 之间进行数据传输。I/O 端口号存储在\
    \ DX 寄存器中。\n\n| Symbol | Example |\n|---|---|\n| IN AL/AX/EAX, p8 | IN AX, 52H;\
    \ input a word from 52H port |\n| IN AL/AX/EAX, DX | IN AL, DX; input a byte from\
    \ (DX) port |\n| OUT p8, AL/AX/EAX | OUT 40H, AL; output a byte to 40H port |\n\
    | OUT DX, AL/AX/EAX | OUT DX, AX; output a word to (DX) port |\n\n```\n**IN Example**\n\
    ```asm\nIN   AL, 20H\nIN   AX, 48H\nMOV  DX, 3FCH\nIN   AX, DX\n```\n```\n\n```\n\
    **OUT Example**\n```asm\nOUT  32H, AX\nMOV  DX, 400H\nMOV  AL, 86H\nOUT  DX, AL\n\
    ```\n```\n\n### MOVSX 和 MOVZX 指令\n\n- 两者都存在于 80386-Core 指令集中。\n- 这些指令移动数据，同时进行符号扩展（MOVSX）或零扩展（MOVZX）。\n\
    \n| Symbolic | Example |\n|---|---|\n| MOVSX reg16/32, reg8/16 | MOVSX CX, BL\
    \ |\n| MOVSX reg16/32,mem8/16 | MOVSX ECX, [EDI] |\n| MOVZX reg16/32, reg8/16\
    \ | MOVZX EAX, BX |\n| MOVZX reg16/32,mem8/16 | MOVZX CX, BYTE PTR[DI] |\n\n示例：\n\
    if (CL)=0ABH,\nMOVSX AX, CL\n    after execution (AX)=0FFABH   ; Sign-extend\n\
    MOVZX AX, CL\n    after execution (AX)=00ABH    ; Zero-extend\nif (DATA) = 78ADH\n\
    MOVSX EAX, DATA\n    after execution (AX)=000078ADH ; Sign-extend\nMOVZX EAX,\
    \ DATA\n    after execution (AX)=000087ADH ; Zero-extend\n\n## 2.6.2 算术指令\n\n\
    - 加法、减法和比较\n- 乘法和除法\n- BCD 和 ASCII 算术\n\n### 加法、减法和比较\n### 加法指令\n\n```\nADD DST,\
    \ SRC\n```\n\n- DST←(DST)+(SRC)\n- 该指令会影响 CF、SF、OF、PF、ZF 和 AF\n\n| Symbolic |\
    \ Example |\n|---|---|\n| ADD reg8/16/32, imm8/16/32 | ADD AX,837FH |\n| ADD reg8/16/32,\
    \ reg8/16/32 | ADD EAX, EBX |\n| ADD reg8/16/32, mem8/16/32 | ADD CX, WORD PTR[SI]\
    \ |\n| ADD mem8/16/32, reg8/16/32 | ADD BYTE PTR[DI],DL |\n| ADD mem8/16/32, imm8/16/32\
    \ | ADD BYTE PTR[DI], 23 |\n\n### ADD 示例\n\n**ADD DX, BX**\n\nif (DX)=4652H, (BX)=0F0F0H\n\
    \n```text\n        0100 0110 0101 0010          4652H\n      + 1111 0000 1111\
    \ 0000        + F0F0H\n      --------------------------------------\n      1 0011\
    \ 0111 0100 0010          1 3742H\n                    ↑ Carry              ↑\
    \ Carry\n```\n\n执行后\n(DX)=3742H\n\nZF=0\nSF=0\nCF=1\nOF=0\n\n"
