    \nLSB\n\nMSB\n\nStart\n\n5~8 bits Data\nLeast Significant\nBit first\n\nParity\
    \ bit\n\nOptional\n\nStop\n(1, 1.5 or 2 Bit)\n\nIdle\n\nIn order to ensure the\
    \ transmission of asynchronous serial communication is correct:\n\n- 1) Opposite\
    \ polarity of the start bit and stop bit / idle bit to provide an accurate time\
    \ base\n- 2) Receiver using a higher frequency than the baud rate clock to control\
    \ the sampling time to improve the sampling resolution and anti-jamming capability.\n\
    - 3) Receiver sample in the center of each bit to get the maximum of the transmit\
    \ / receive clock frequency\n\n![](img/d7c975450dfbe59120092c2721be78c6_488_0.png)\n\
    \n## 7.2 Asynchronous serial communication\n\n### Exercise\n\nAsynchronous serial\
