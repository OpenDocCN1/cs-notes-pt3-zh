    \     CX, 5\nCLEAR_BUF:MOV BYTE PTR[DI], ' '\n    INC     DI\n    LOOP    CLEAR_BUF\n\
    \    MOV     BYTE PTR[DI], '$'\n    DEC     DI\n    MOV     CX, 10\nCHANGE: MOV\
    \ DX, 0\n    DIV     CX\n```\n\n```\nADD     DL, 30H\nMOV     BYTE PTR[DI], DL\n\
    DEC     DI\nCMP     AX, 0\nJNZ     CHANGE\nINC     DI\nMOV     DX, DI\nMOV   \
    \  AH, 9\nINT     21H\nPOP     CX\nPOP     DI\nPOP     DX\nRET\nPINT    ENDP\n\
    ```"
  - "[PAGE 281]\n\n# 2.6.7 Procedure Instructions\n\n+   - Passing Parameters\n+ \
