    \    MOV AH, 4CH\n    INT 21H\nEND START\n```\n```\n\n> **提示:**  \n> 为了输出回车换行（C\
    \ 语言中的 `\\r\\n`），你可以按如下方式定义一个字符串：  \n> `CR DB 0AH,0DH,'$'`\n\n## 2.5 用户界面编程\n\n\
