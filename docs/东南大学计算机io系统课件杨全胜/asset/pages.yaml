- pgno: 42
  md: '# 1.5 Basic Program Execution Registers


    # Instruction Pointer Register


    +   The instruction pointer ((E)IP) register contains the offset in the current
    code segment for the next instruction to be executed.


    | Higher 16-bits | 16-bits IP |

    |---|---|


    32-bits EIP


    +   The EIP register cannot be accessed directly by software; it is controlled
    implicitly by control-transfer instructions (such as JMP, Jcc, CALL, and RET),
    interrupts, and exceptions.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 1.5 Basic Program Execution Registers


    # EFLAG Register


    +   - The 32-bit (E)FLAGS register contains a group of status flags, a control
    flag, and a group of system flags.

    +   - Some of the flags in the EFLAGS register can be modified directly, using
    special purpose instructions.

    +   - There are no instructions that allow the whole register to be examined or
    modified directly.'
  merge: -1
