- pgno: 306
  md: '# 3.2 Principal I/O techniques


    # I/O Channels


    +   - The I/O module is enhanced to become an processor in its own right, with
    a specialized instruction set tailored for I/O. This I/O module is often referred
    to as an I/O channel.

    +   - The I/O channel has the ability to execution the I/O instructions, which
    gives it complete control over I/O operations.

    +   - The CPU dose not execute I/O instructions, such instructions are stored
    in the main memory to be executed by a special-purpose processor in the I/O channel
    itself.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 3.2 Principal I/O techniques


    # I/O Processor


    +   - The I/O module has a local memory of its own and is, in fact, a computer
    in its own right.

    +   - With this architecture, a large set of I/O devices can be controlled, with
    minimal CPU involvement.

    +   - A common use for such an architecture has been to control communication
    with interactive terminals.

    +   - The I/O processor takes care of most of the tasks involved in controlling
    the terminals.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 3.3 The type of the I/O address space


    # Isolated I/O


    +   - The address for isolated I/O device, called ports address, is separate from
    the memory address space.

    +   - The user can expand the memory to its full size without using any of memory
    space for I/O device.

    +   - Disadvantage:

    +     - Data transfer between I/O and CPU must be accessed by the specialized
    I/O instructions.

    +     - Need specialized the control signal(M/IO,WR,RD)

    +   - X86-based system used.


