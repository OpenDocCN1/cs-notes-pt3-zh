- pgno: 261
  md: '# 2.6.6 String Instructions


    # String Data Transfer Instructions


    # INS Instruction


    +   - Transfers a byte, word, or doubleword of data from an I/O device into the
    extra segment location addressed by the (E)DI register.

    +   - I/O address in the DX register.

    +   - INS can also with a REP prefix.


    | Assemble Language | Operation |

    |---|---|

    | INSB | ES:[DI]=[DX]; if (DF=0) DI=DI+1 else DI=DI-1 |

    | INSW | ES:[DI]=[DX]; if (DF=0) DI=DI+2 else DI=DI-2 |

    | INSD | ES:[DI]=[DX]; if (DF=0) DI=DI+4 else DI=DI-4 |'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 2.6.6 String Instructions


    # String Data Transfer Instructions


    # OUTS Instruction


    +   - Transfers a byte, word, or doubleword of data from the DATA segment location
    addressed by the (E)SI register to an I/O device.

    +   - I/O address in the DX register.

    +   - OUTS can also with a REP prefix.


    | Assemble Language | Operation |

    |---|---|

    | OUTSB | [DX] = DS:[SI]; if (DF=0) SI=SI+1 else SI=SI-1 |

    | OUTSW | [DX] = DS:[SI]; if (DF=0) SI=SI+2 else SI=SI-2 |

    | OUTSD | [DX] = DS:[SI]; if (DF=0) SI=SI+4 else SI=SI-4 |'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 2.6.6 String Instructions


    # String Comparisons Instruction


    # SCAS Instruction


    Compare a byte, word, or double word from the data segment location addressed
    by (E)DI with AL, AX, or EAX.


    | Assemble Language | Operation |

    |---|---|

    | SCASB | ES:[DI]-AL; if (DF=0) DI=DI+1 else DI=DI-1 |

    | SCASW | ES:[DI]-AX; if (DF=0) DI=DI+2 else DI=DI-2 |

    | SCASD | ES:[DI]-EAX; if (DF=0) DI=DI+4 else DI=DI-4 |'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 2.6.6 String Instructions


    # String Comparisons Instruction


    # SCAS Instruction


    SCAS with a REPNZ/REPNE prefix


    +   REPNZ/REPNE prefix cause the SCAS instruction to repeat until either CX decrement
    1 each time to reach 0, or until an equal condition exist as the outcome of the
    SCAS instruction’s comparison.


    SCAS with a REPZ/REPE prefix


    +   REPZ/REPE prefix cause the SCAS instruction to repeat until either CX decrement
    1 each time to reach 0, or until an equal condition NOT exist as the outcome of
    the SCAS instruction’s comparison.


    With either repeat prefix, the content of CX decrement without affecting the flag
    bits.'
  merge: -1
  img_proc: true
