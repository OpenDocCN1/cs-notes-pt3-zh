- pgno: 60
  md: '# 1.6.1 Operand Addressing Modes


    # Memory Operands Addressing


    # Specifying an Offset


    The offset part of a memory address can be specified directly as a static value
    (called a displacement) or through an address computation made up of one or more
    of the following components:


    +   - Displacement — An 8-, 16-, or 32-bit value.

    +   - Base — The value in a general-purpose register.

    +   - Index — The value in a general-purpose register.

    +   - Scale factor — A value of 2, 4, or 8 that is multiplied by the index value.(80386
    or above)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 1.6.1 Operand Addressing Modes


    # Memory Operands Addressing


    +   Specifying an Offset


    The offset which results from adding displacement, base, index and scale factor
    is called an effective address(EA).


    ```

    EA=Base + ( Index*Scale factor ) + Displacement

    ```


    | components | 16-bit offset | 32-bit offset |

    |---|---|---|

    | displacement | 0,8,16-bit | 0, 8, 32-bit |

    | Base Register | BX, BP | Any 32-bit general purpose registers |

    | Index Register | SI, DI | 32-bit general purpose registers except ESP |

    | Scale factor | Not used | 1, 2, 4, 8 |'
  merge: -1
  img_proc: true
