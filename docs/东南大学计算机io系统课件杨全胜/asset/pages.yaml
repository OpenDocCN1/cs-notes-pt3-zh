  md: '# 2.4 Assembly Language Source Code


    # Using Simplified Segment Directives


    # Create Data Segment


    ```

    .DATA

    ```


    +   The .DATA directive creates a near the initialized data segment (with segment
    name _DATA) and ends the previous segment, if any. The .DATA segment should contain
    all global data that have initial values.


    +   The .DATA segment can occupy up to 64K in MS-DOS or 512 megabytes under flat
    model in Windows.


    +   You can use @data to determine the group of the data segment.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 2.4 Assembly Language Source Code


    # Using Simplified Segment Directives


    # Create Data Segment


    ```

    .CONST

    ```


    Starts a constant data segment and ends the previous segment, if any. This segment
    should contain all strings, real numbers, and other constant data accessed by
    a high-level language. It has the READONLY attribute.


    ```

    .DATA?

    ```


    The .DATA? directive starts the uninitialized data segment (with segment name
    _BSS) and ends the previous segment, if any. Place all uninitialized data in the
    .DATA? segment.'
