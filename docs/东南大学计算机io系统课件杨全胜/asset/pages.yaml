- pgno: 32
  md: '# 1.4 Data Type


    # Pointer Data Types


    +   - Pointers are addresses of locations in memory

    +   - In non-64-bit modes, the architecture defines two types of pointers: a near
    pointer and a far pointer.

    +   - In 16-bit mode

    +     - A near pointer is a 16-bit offset (also called an effective address) within
    a segment.

    +     - A far pointer is a logical address, consisting of a 16-bit segment base
    address and a 16-bit offset.

    +   - In 32-bit mode

    +     - A near pointer is a 32-bit offset (also called an effective address) within
    a segment.

    +     - A far pointer is a logical address, consisting of a 16-bit segment selector
    and a 32-bit offset.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.4 Data Type


    # Bit Field Data Type


    +   - is a contiguous sequence of bits.

    +   - It can begin at any bit position of any byte in memory and can contain up
    to 32 bits.


    # String Data Types


    +   - Strings are continuous sequences of bits, bytes, words, or doublewords.

    +   - A bit string can begin at any bit position of any byte and can contain up
    to 2³²-1 bits.

    +   - A byte string can contain bytes, words, or doublewords and can range from
    zero to 2³² -1 bytes (4 GBytes).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.4 Data Type


    # BCD and Packed BCD Integers


    +   Binary-coded decimal integers (BCD integers) are unsigned 4-bit integers with
    valid values ranging from 0 to 9.


    +   When operating on BCD integers in general-purpose registers, the BCD values
    can be unpacked (one BCD digit per byte) or packed (two BCD digits per byte).


    Unpacked BCD


    | 0000 | BCD |

    | 7    | 4 3 0 |


    Packed BCD


    | BCD | BCD |

    | 7   | 4 3 0 |


    > e.g. Convert decimal integer 21 to BCD is 0000001000000001, packed BCD is 00100001'
  merge: -1
  img_proc: true
