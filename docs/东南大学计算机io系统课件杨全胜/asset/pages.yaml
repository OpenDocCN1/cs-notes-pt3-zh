- pgno: 348
  md: '# 4.1 Basic Interrupt System


    # ■ Design Issues


    +   - **Daisy chain (hardware poll, vectored)**

    +     - All I/O modules share a common interrupt request line.

    +     - The interrupt acknowledge line is daisy chained through the module.

    +     - The acknowledge signal from CPU propagate through a series of I/O module
    until it gets to a requesting module.

    +     - The requesting module typically responds by placing a word on the data
    line. The word is referred to as a *vector number* that is:

    +       - The address of I/O module.

    +       - Some other unique identifier.

    +     - The processor uses the vector as a pointer to the appropriate device-service
    routine.

    +     - This technique is called a *vectored interrupt*.'
  merge: -1
  img_proc: true
