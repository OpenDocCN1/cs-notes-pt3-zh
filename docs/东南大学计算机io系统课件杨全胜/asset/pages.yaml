- pgno: 298
  md: '# 3.2 Principal I/O techniques


    +   - Programmed I/O

    +     1. When the processor is executing a program and encounters an instruction
    relating to I/O, it executes that instruction by issuing a command to the appropriate
    I/O module.

    +     2. With programmed I/O, the I/O module will perform the requested action.

    +     3. Then there are 2 different ways:

    +        - Unconditional transfer

    +          - we suppose the device is always ready.

    +          - Processor do not care the status of I/O module

    +        - Conditional transfer

    +          - After perform the action, I/O module set the appropriate bits in
    the I/O status register.

    +          - Processor periodically to check the status in I/O module until finds
    that the operation is complete'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 3.2 Principal I/O techniques


    # Programmed I/O


    I/O command that an I/O module may receive when it is addressed by a processor


    +   - Control: Used to active a peripheral and tell it what to do.


    +   - Test: Used to test various status conditions associated with an I/O module
    and its peripherals.


    +   - Read: Cause the I/O module to obtain an item of data from the peripheral
    and place it in an internal buffer. The processor can then obtain the data item
    by requesting that the I/O module place it on the data bus.


    +   - Write: Cause the I/O module to take an item of data from the data bus and
    subsequently transmit that data item to the peripheral.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 3.2 Principal I/O techniques


    # Programmed I/O


    The problem with programmed I/O is:


    +   - That the processor has to wait a long time for the I/O module of concern
    to be ready for either reception or transmission of data.

    +   - The processor, while waiting, must repeatedly interrogate the status of
    the I/O module.

    +   - As a result, the level of the performance of the entire system is severely
    degraded.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 3.2 Principal I/O techniques


    # Interrupt-Driven I/O


    +   - Processor issue an I/O command to a module and then go on to do some other
    useful work.

    +   - The I/O module will then interrupt the processor to request service when
    it is ready to exchange data with the processor.

    +   - The processor then executes the data transfer, as before, and then resumes
    its former processing.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 3.2 Principal I/O techniques


    # Interrupt-Driven I/O


    # How Interrupt-Driven I/O do for input, for example


    +   1. The processor issues a READ command to I/O module, then goes off and does
    something else.

    +   2. The I/O module get the data from the device and latch them in buff, then
    interrupt the processor to require service.

    +   3. The processor saves the context of the current program and process the
    interrupt to read the word of data from the I/O module and stores it in memory
    or register.

    +   4. The processor restores the context of the program it was working on and
    resumes execution.'
  merge: -1
  img_proc: true
