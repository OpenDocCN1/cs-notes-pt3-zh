- pgno: 497
  md: '# 7.4 16550 UART


    # 16550 UART


    +   - The 16550 UART (universal asynchronous receiver/transmitter) is an integrated
    circuit designed for implementing the interface for serial communications.

    +   - It is frequently used to implement the serial port for IBM PC compatible
    personal computers.

    +   - It is often connected to an RS-232 interface for modems, serial mice, printers,
    and similar peripherals.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 7.4 16550 UART


    # Main features of the 16550


    +   - The ability to convert data from serial to parallel, and from parallel to
    serial, using shift registers.

    +   - An on-chip bit rate (baud rate) generator to control transmit and receive
    data rate.

    +   - Handshake lines for control of an external modem, controllable by software.

    +   - An interrupt function to the host microprocessor.

    +   - An on-chip 16 byte FIFO buffer for both incoming and outgoing data; this
    gives the host system more time to respond to an interrupt generated by the UART,
    without loss of data.'
  merge: -1
  img_proc: true
