  md: '# 5.2 Structure and pins of 8254


    # ■ Mode Definitions


    # ◆ Mode 0: Interrupt on terminal count


    ![](img/d7c975450dfbe59120092c2721be78c6_424_0.png)


    +   - **characteristic:** count only once;

    +   - **GATE = 1** enables counting; **GATE = 0** disables counting. GATE has
    no effect on OUT.

    +   - If a new count is written to the Counter, it will be loaded on the next
    CLK pulse and counting will continue from the new count.

    +   - After the Control Word is written, OUT is initially low, and will remain
    low until the Counter reaches zero. OUT then goes high and remains high until
    a new count or a new Mode 0 Control Word is written into the Counter'
  merge: -1
