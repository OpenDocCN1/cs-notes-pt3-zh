- pgno: 270
  md: '# 2.6.7 Procedure Instructions


    # ▪ Basic of Procedure


    +   - A procedure is a group of instruction that usually perform one task.

    +   - A procedure is a reusable section of the software that is stored in memory
    once, but use as often as necessary.

    +   - Procedure can be called by other program.

    +   - The CALL instruction link to the procedure and the RET instruction return
    from the procedure.

    +     - Link and return take the computer a small amount of time.

    +     - The stack stores the return address.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 2.6.7 Procedure Instructions


    # Procedure Instructions


    +   - **CALL**

    +     - Transfers the flow of the program to the procedure.

    +     - CALL differs from the JMP because a CALL pushes the return address onto
    the stack.

    +   - **RET**

    +     - Pops the return address off the stack and returns control to that location
    (the instruction that follow the CALL in the program).


    ![](img/d7c975450dfbe59120092c2721be78c6_271_0.png)'
