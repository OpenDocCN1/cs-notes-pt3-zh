- pgno: 431
  md: '# 5.2 Structure and pins of 8254


    # Mode Definitions


    | | 方式0 | 方式1 | 方式2 | 方式3 | 方式4 | 方式5 |

    |---|---|---|---|---|---|---|

    | OUT输出状态 | 写入控制字后变0，计数结束变1，并维持至重写控制字或计数初值 | 写入控制字后变1，GATE上升沿触发变0，开始计数，计数结束变1
    | 写入控制字后变1，计数到1变0，维持一个Tclk变1 | 写入控制字后变1，装入初值且GATE=1则OUT变1，计数到0变0，重装初值继续计数，计数到则反向
    | 写入控制字后变1，计数结束变0，维持一个Tclk变1 | 写入控制字后变1，GATE上升沿触发开始计数，计数结束输出一个CLK的负脉冲 |

    | 初值自动重装 | 无 | 无 | 计数到0重装 | 根据初值奇偶分别重装； | 无 | 无 |

