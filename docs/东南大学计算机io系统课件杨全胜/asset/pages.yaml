  md: '# 4.1 Basic Interrupt System


    # Interrupt Lines to Processor


    +   - **Single interrupt line**

    +     - Only one interrupt line between the processor and the I/O modules.

    +   - **Multiple interrupt lines**

    +     - Provide multiple interrupt lines between the processor and the I/O modules.

    +     - It is impractical to dedicate more than a few bus lines or processor pins
    to interrupt lines.'
