  md: '# 6.1 Basic of 82C55


    +   - Compatible with all Intel and most other microprocessors

    +   - Completely TTL Compatible

    +   - Three 8-bit Ports

    +     - Port A: One 8-bit output latch/buffer and/or one 8-bit data input latch

    +     - Port B: One 8-bit output latch/buffer or one 8-bit data input latch

    +     - Port C: One 8-bit output latch/buffer or one 8-bit data input buffer (no
    latch for input). This port can be divided into two 4-bits ports under the mode
    control. Each 4-bit port contains a 4-bit latch and it can be used for the control
    signal outputs and status signal inputs in conjunction with A and B'
  merge: -1
  img_proc: true
