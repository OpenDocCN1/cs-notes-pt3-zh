- pgno: 339
  md: '# 4.1 Basic Interrupt System


    # What is interrupt


    +   - Interrupts are events that indicate that a condition exists somewhere in
    the system, the processor, or within the currently executing program that requires
    the attention of a processor.

    +   - Interrupts typically result in a forced transfer of execution from the currently
    running program to a special software routine called an interrupt handler.

    +   - The action taken by a processor in response to an interrupt is referred
    to as servicing or handling the interrupt.

    +   - When execution of the handler is complete, the processor resumes execution
    of the interrupted procedure or task.


    ![](img/d7c975450dfbe59120092c2721be78c6_339_0.png)'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 4.1 Basic Interrupt System


    # Interrupt Source


    Interrupts occur at random times during the execution of a program, in response
    to signals from hardware.


    System hardware uses interrupts to handle events external to the processor, such
    as requests to service peripheral devices.


    Software can also generate interrupts by executing the INT n instruction.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 4.1 Basic Interrupt System


    # Interrupt processing


    +   1. The device issues an interrupt signal to the processor.

    +   2. The processor finishes execution of the current instruction, then tests
    for an interrupt, determines that there is one, and sends an acknowledgment signal
    to the device that issued the interrupt.

    +   3. The acknowledgment allow the device to remove its interrupt signal.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 4.1 Basic Interrupt System


    # Interrupt processing


    +   4. The processor now needs to prepare to transfer control to the interrupt
    routine. To begin, save information needed to resume the current program at the
    point of interrupt(Done automatically by the hardware).


    +   ① The status of the processor, which is contained in a register called the
    program status word(PWS).


    +   ② The location of the next instruction to be executed, which is contained
    in the program counter(PC or IP).


    +   5. The processor now loads the program counter with the entry location of
    the interrupt-handling program that will respond to this interrupt.'
  merge: -1
  img_proc: true
