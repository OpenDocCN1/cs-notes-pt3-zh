- pgno: 196
  md: "# 2.6.2 Arithmetic Instructions\n\n# BCD and ASCII Arithmetic\n\n# ASCII Adjust\
    \ AX After Multiply\n\n# AAM\n\nAdjusts the result of the multiplication of two\
    \ unpacked BCD values to create a pair of unpacked (base 10) BCD values.\n\n```\n\
    tempAL ← AL;\nAH ← tempAL / 10;\nAL ← tempAL MOD 10;\n```\n\n```\nMOV AL, 07H\n\
    MOV CL, 09H\nMUL CL\nAAM                  ; adjust\n```\n\n```text\n      0111\n\
    ×     1001\n──────────\n      0111\n      0000\n      0000\n      0111\n──────────\n\
    \   0011111\n```\n\n调整后，(AH)=6，(AL)=3"
