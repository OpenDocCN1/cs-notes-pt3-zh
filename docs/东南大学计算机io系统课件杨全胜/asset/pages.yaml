    # Shift and Rotate Instruction


    +   - Shift instructions will change flags:

    +     - CF: change by shifted bit

    +     - OF:

    +       - Multiple-bit shift: undefined

    +       - Single-bit shift

    +         - 0: if the sign bit of the result is the same as the sign bit of the
