  md: '# 2.3 Directives


    # Data Define


    # Syntax


    ```

    [name] type initializer [, initializer]...

    ```


    +   These directives allocate and optionally initialize one or more bytes of global
    data.


    +   The abbreviations (such as DB, DW, DD) are limited forms of the data-declaration
    directives; they cannot be used as types. They are included for compatibility
    with previous versions of the assembler (just like MASM 5.0).


    +   String initializes, available with the BYTE directive, allocate a byte for
    each character of the string. The characters are stored with the leftmost character
    in the lowest memory location'
