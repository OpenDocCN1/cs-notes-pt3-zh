- pgno: 397
  md: '# 4.4 Interrupt process in Modern PC


    # Hardware/Software Interrupt Sequence


    +   4. Upon observing its own interrupt acknowledge cycle on PCI, the PCH converts
    it into the two cycles that the internal 8259 pair can respond to. Each cycle
    appears as an interrupt acknowledge pulse on the internal INTA# pin of the cascaded
    interrupt controllers.


    +   5. Upon receiving the first internally generated INTA# pulse, the highest
    priority ISR bit is set and the corresponding IRR bit is reset. On the trailing
    edge of the first pulse, a slave identification code is broadcast by the master
    to the slave on a private, internal three bit wide bus. The slave controller uses
    these bits to determine if it must respond with an interrupt vector number during
    the second INTA# pulse.'
  merge: -1
  img_proc: true
- pgno: 398
  md: "# 4.4 Interrupt process in Modern PC\n\n# Hardware/Software Interrupt Sequence\n\
    \n+   6. Upon receiving the second internally generated INTA# pulse, the PIC returns\
    \ the interrupt vector number. If no interrupt request is present because the\
    \ request was too short in duration, the PIC returns vector number 7 from the\
    \ master controller.\n+   \n+   7. This completes the interrupt cycle. In AEOI\
    \ mode the ISR bit is reset at the end of the second INTA# pulse. Otherwise, the\
    \ ISR bit remains set until an appropriate EOI command is issued at the end of\
    \ the interrupt subroutine."
  merge: -1
  img_proc: true
