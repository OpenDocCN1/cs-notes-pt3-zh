- pgno: 488
  md: 'In order to ensure the transmission of asynchronous serial communication is
    correct:


    +   1) Opposite polarity of the start bit and stop bit / idle bit to provide an
    accurate time base


    +   2) Receiver using a higher frequency than the baud rate clock to control the
    sampling time to improve the sampling resolution and anti-jamming capability.


    +   3) Receiver sample in the center of each bit to get the maximum of the transmit
    / receive clock frequency


    ![](img/d7c975450dfbe59120092c2721be78c6_488_0.png)'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# 7.2 Asynchronous serial communication


    # Exercise


    Asynchronous serial data is 7-bit ASCII code, If you need a data transfer rate
    of 240 characters per sec, 1 bit parity and 1 bit stop is used, then:


    +   1) What is baud rate?

    +   2) How many data bits are valid in one second?

    +   3) How about the transmit efficiency?


    +   1) Baud rate is

    +   (7-bit data+1 bit start+1 bit parity+1 bit stop)×240

    +   =2400b/s


    +   2) Valid data bits in one second is 7×240=1680 bits


    +   3) Transmit efficiency is 1680/2400=70%'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# 7.3 RS-232 Standard


    +   - RS-232 (Recommended Standard 232)

    +     - In telecommunications, RS-232 is the traditional name for a series of
    standards for serial binary single-ended data and control signals connecting between
    a DTE and a DCE. It is commonly used in computer serial ports.

    +     - DTE-Data Terminal Equipment

    +     - DCE- Data Communication Equipment

    +     - Some RS-232 devices are still found especially in industrial machines
    or scientific instruments.

    +     - Many modern personal computers have no RS-232 ports and must use an external
    converter to connect to older peripherals.'
