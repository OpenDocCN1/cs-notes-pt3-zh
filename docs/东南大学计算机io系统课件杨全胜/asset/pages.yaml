  md: '# 6.3 82C55 Operation Mode


    # Mode 2 – Strobed Bidirectional Bus I/O


    +   - Used in Group A only.

    +   - One 8-bit, bi-directional bus Port (Port A) and a 5-bit control Port (Port
    C).

    +   - Both inputs and outputs are latched.

    +   - The 5-bit control port (Port C) is used for control and status for the 8-bit,
    bi-directional bus port (Port A).'
