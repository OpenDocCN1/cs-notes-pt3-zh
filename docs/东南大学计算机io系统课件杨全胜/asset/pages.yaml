- pgno: 517
  md: '# 7.5 COM in IA-32


    # What is COM in communication?


    +   - COM is the original, yet still common, name of the serial port interface
    on IBM PC-compatible computers.

    +   - It might not only refer to physical ports, but also to virtual ports, such
    as ports created by bluetooth or USB-to-Serial adapters.

    +   - COM in IA-32

    +     - COM1: I/O port 0x3F8, IRQ 4

    +     - COM2: I/O port 0x2F8, IRQ 3

    +     - COM3: I/O port 0x3E8, IRQ 4

    +     - COM4: I/O port 0x2E8, IRQ 3'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# 7.5 COM in IA-32


    # 16550 initialize


    +   1. Write the divisor latch DL(port 0 and 1) to set baud rate.

    +   2. Write the line control register LCR(port 3) to set the format of the asynchronous
    data communications exchange.

    +   3. Write the MODEM control register MCR( port 4) to set the MODEM control
    word.

    +   4. Write Interrupt enable register IER(port 1) to set the interrupt enable
    word.'
  merge: -1
