  md: '# 2.3 Directives


    # SHORT Operator


    ```

    SHORT label

    ```


    +   - Sets the type of *label* to short. All jumps to *short label* must be a
    short jump (within the range −128 to +127 bytes from the jump instruction to *label*).


    # EQU and = Operator


    ```

    name EQU expression

    name = expression

    ```


    +   - EQU and = evaluates the numeric value of <expression> and assigns the resulting
    constant value to <name>.

    +   - Unlike =, EQU does not allow numeric equates to be redefined.

    +   - If <expression> cannot be evaluated, EQU treats <expression> as text.'
