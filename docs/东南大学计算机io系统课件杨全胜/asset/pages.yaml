- pgno: 428
  md: '# 5.2 Structure and pins of 8254


    # ■ Mode Definitions


    # ◆ Mode 3: Square Wave Mode


    ![](img/d7c975450dfbe59120092c2721be78c6_428_0.png)


    **characteristic:** periodic;


    +   - **Odd counts:** OUT is initially high. The initial count minus one (an even
    number) is loaded on one CLK pulse and then is decremented by two on succeeding
    CLK pulses. One CLK pulse after the count expires, OUT goes low and the Counter
    is reloaded with the initial count minus one. Succeeding CLK pulses decrement
    the count by two. When the count expires, OUT goes high again and the Counter
    is reloaded with the initial count minus one. The above process is repeated indefinitely.
    So for odd counts, OUT will be high for (N + 1)/2 counts and low for (N - 1)/2
    counts.'
  merge: -1
  img_proc: true
