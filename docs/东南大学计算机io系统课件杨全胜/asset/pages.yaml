- pgno: 23
  md: '# 1.3 Real-address mode memory model


    # Alignment of Words, Doublewords, and Quadwords


    +   - The natural boundaries for words, double words, and quadwords are even-numbered
    addresses, addresses evenly divisible by four, and addresses evenly divisible
    by eight, respectively.

    +   - To improve the performance of programs, data structures (especially stacks)
    should be aligned on natural boundaries whenever possible.

    +   - The reason for this is that the processor requires two memory accesses to
    make an unaligned memory access; aligned accesses require only one memory access.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.3 Real-address mode memory model


    # Real mode memory addressing


    +   - All real mode physical memory address are 20 bits wide.

    +   - All real mode logical memory addresses must consist of a segment address
    plus an offset address.


    +   - **Segment address (16 bits):** located within one of segment register, defines
    the beginning address of any 64K-byte memory segment.

    +   - **Offset address (16 bits):** selects any location within the 64K-byte memory
    segment.

    +   - Writing as **Segment address : Offset address**'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1.3 Real-address mode memory model


    +   - physical address and Logic address


    physical address = segment address ×10H + offset address


    16bits segment address : 16bits offset address


    (4-bits shift left) 16bits segment address 0000


    + 16bits offset address


    = 20bits physical address


    6417H: 0100H


    6417H×10H + 0100H = 64170H + 0100H = 64270H'
  merge: -1
