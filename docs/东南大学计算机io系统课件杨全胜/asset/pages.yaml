- pgno: 161
  md: '# 2.6.1 Data Movement Instructions


    # Miscellaneous data transfer instructions


    # IN and OUT Instruction


    +   IN instruction transfers data from an external I/O device into AL, AX, or
    EAX.


    +   OUT instruction transfers data from AL, AX, or EAX to an external I/O device.


    +   Two forms of I/O device (port) addressing exist


    +   Fixed-port addressing allows data transfer between AL, AX, EAX using 8-bit
    I/O port address with immediate addressing(direct addressing).


    +   Variable-port addressing allows data transfer between AL, AX, EAX using 16-bit
    I/O port address. The I/O port number is stored in register DX.'
  merge: -1
  img_proc: true
