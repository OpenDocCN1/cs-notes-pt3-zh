    ```\n```asm\n; main procedure\nOLDDOC    DWORD     ?\n......\nCODE      SEGMENT\n\
    \n    ......\n    MOV     AX, 350CH       ; Save the original 0CH interrupt vector\n\
    \    INT     21H\n    MOV     WORD PTR OLDDOC, BX\n    MOV     WORD PTR OLDDOC+2,\
    \ ES\n    MOV     AX, SEG SERVICE  ; set new 0CH interrupt vector\n    MOV   \
    \  DS, AX\n    MOV     DX, OFFSET SERVICE\n    MOV     AX, 250CH\n    INT    \
    \ 21H\n    ......                    ; others\n```\n```"
