- pgno: 393
  md: '# 4.4 Interrupt process in Modern PC


    # Interrupt response


    When the processor finishes execution of the current instruction, CPU response
    the interrupt, (maskable interrupt response according to whether the IF in EFLAGS
    is 1).


    Step of the respond


    +   1. Save the return address

    +      - Clear the IF and TF in EFLAGS

    +      - Push EFLAGS, CS and EIP in stack.

    +   2. Obtain the interrupt vector number

    +      - For the external hardware interrupt, the number obtain from 8259A in
    PCH in the second INTA#.

    +      - Other kind of interrupt do not need this step'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# 4.4 Interrupt process in Modern PC


    # Interrupt response


    # ◆ Step of the respond


    +   3. **Obtain the entry location of interrupt-handling program**

    +      - Query the Interrupt Vector Table or Interrupt Descriptor Table with the
    vector number to get the address via the vector number.


    +   4. **The processor now transfer control to the interrupt routine.**

    +      - loads the program counter with the entry location of interrupt-handling
    program

    +      - processes the interrupt


    +   5. **Return to the breakpoint**

    +      - Pop EIP, CS, EFLAGS'
  merge: -1
