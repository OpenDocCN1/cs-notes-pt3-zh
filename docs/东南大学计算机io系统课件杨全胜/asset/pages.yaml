    # ◆ Bus arbitration (vectored)


    +   - Needs an interrupt arbitration or interrupt controller

    +   - Only one module can raise the line at a time.

    +   - When the processor detects the interrupt, it responds on the interrupt acknowledge
    line.

    +   - The requesting module then places its vector number on the data lines.

    +   - Bus arbitration can employ a priority scheme.


