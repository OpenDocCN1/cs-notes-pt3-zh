  md: '# 1.6.1 Operand Addressing Modes


    # I/O Port Addressing


    # I/O Port Direct Addressing


    An 8-bit I/O port address(Address between 00 and 0FFH) must be addressed with
    an immediate operand.


    +   - IN AL, 20H ; input a byte from port 20h to AL

    +   - OUT 63H, AL ; output a byte from AL to port 63h


    # I/O Port Indirect Addressing


    A 16-bit I/O port address(Address above 0FFH) must be addressed with a value in
    the DX register.


    +   - MOV DX,3F8H

    +     IN AL, DX ; input a byte from port 3f8h to AL'
