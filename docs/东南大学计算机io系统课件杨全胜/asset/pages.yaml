- pgno: 460
  md: '# 6.3 82C55 Operation Mode


    # Mode 1 – Strobed Input/Output


    +   OBF#. The OBF# output will go "low" to indicate that the CPU has written data
    out to the specified port. OBF# will be set by the rising edge of the WR# input
    and reset by ACK# input being low.


    +   AKC#. A "low" on this input informs the 8255A that the data from port A or
    port B has been accepted. In essence, a response from the peripheral device indicating
    that it has received the data output by the CPU.


    +   INTR. A "high" on this output can be used to interrupt the CPU when an output
    device has accepted data transmitted by the CPU. INTR is set when ACK# is a "one",
    OBF# is a "one" and INTE is a "one". It is reset by the falling edge of wWR#.


    +   INTE A. Controlled by bit set/reset of PC6.


    +   INTE B. Controlled by bit set/reset of PC2'
