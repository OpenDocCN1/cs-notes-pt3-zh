    ; interrupt handler\nSERVICE PROC FAR\n    PUSHA      ; push register\n    PUSH\
    \ DS\n    STI        ; set IF\n    .....      ; main function in handler\n   \
    \ CLI        ; clear IF\n    MOV AL, 20H\n    OUT 20H, AL ; sent EOI\n    POP\
    \ DS      ; resume\n    POPA\n    IRET\nSERVICE ENDP\n```"
