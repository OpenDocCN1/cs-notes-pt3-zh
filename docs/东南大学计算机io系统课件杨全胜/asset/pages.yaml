- pgno: 304
  md: '# 3.2 Principal I/O techniques


    # Direct Memory Access


    +   When a processor wishes to read or write a block of data, it issues a command
    to the DMA module. Then the processor continues with other work.


    +   The DMA do the I/O operation to transfer the entire block of data directly
    to or from memory, without going through the processor.


    +   When the transfer is complete the DMA module send an interrupt to the processor.


    +   Thus, the processor is involved only at the beginning and end of the transfer
    or when the transfer has problem.'
  merge: -1
  img_proc: true
