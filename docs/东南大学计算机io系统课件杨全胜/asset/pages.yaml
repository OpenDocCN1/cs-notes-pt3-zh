- pgno: 57
  md: '# 1.6.1 Operand Addressing Modes


    # Memory Operands Addressing


    +   Specifying a Segment


    The processor automatically chooses a segment


    | Reference Type | Register Used | Segment Used | Default Selection Rule |

    |---|---|---|---|

    | Instructions | CS | Code Segment | All instruction fetches. |

    | Stack | SS | Stack Segment | All stack pushes and pops.

    Any memory reference which uses the ESP or EBP register as a base register. |

    | Local Data | DS | Data Segment | All data references, except when relative to
    stack or string destination. |

    | Destination Strings | ES | Data Segment pointed to with the ES register | Destination
    of string instructions. |'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 1.6.1 Operand Addressing Modes


    # Memory Operands Addressing


    # Specifying a Segment


    # Segment Override


    When storing data in memory or loading data from memory, the DS segment default
    can be overridden to allow other segments to be accessed. Within an assembler,
    the segment override is generally handled with a colon “:” operator.


    # Example:


    ```

    MOV AX, [10H]    ; Data in DS Segment

    MOV AX, ES:[10H] ; Data in ES Segment

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 1.6.1 Operand Addressing Modes


    # Memory Operands Addressing


    # Specifying a Segment


    # Segment Override


    +   - The following default segment selections cannot be overridden:

    +     - Instruction fetches must be made from the code segment.

    +     - Destination strings in string instructions must be stored in the data
    segment pointed to by the ES register.

    +     - Push and pop operations must always reference the SS segment.'
  merge: -1
