- pgno: 425
  md: '# 5.2 Structure and pins of 8254


    # Mode Definitions


    # Mode 1: Hardware retriggerable one-shot


    ![](img/d7c975450dfbe59120092c2721be78c6_425_0.png)


    characteristic : count only once ;


    +   - GATE = 1 and 0 are no affect. Rising edge of GATE will retrigger the counter
    and load the initial count. GATE has no effect on OUT.


    +   - If a new count is written to the Counter during a one-shot pulse, the current
    one-shot is not affected unless the Counter is retriggered by GATE.


    +   - OUT will be initially high. OUT will go low on the CLK pulse following a
    trigger to begin the one-shot pulse, and will remain low until the Counter reaches
    zero. OUT will then go high and remain high until the CLK pulse after the next
    trigger.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# 5.2 Structure and pins of 8254


    # Mode Definitions


    # Mode 2: Rate Generator


    ![](img/d7c975450dfbe59120092c2721be78c6_426_0.png)


    # characteristic : periodic ;


    +   - GATE = 1 enables counting; GATE = 0 disables counting. Rising edge of GATE
    will retrigger the counter and load the initial count.

    +   - Writing a new count while counting does not affect the current counting
    sequence. The new count will be loaded at the end of the current counting cycle
    or the next CLK pulse when receive the rising edge of GATE.

    +   - OUT will initially be high. When the initial count has decremented to 1,
    OUT goes low for one CLK pulse. OUT then goes high again, the Counter reloads
    the initial count and the process is repeated.'
  merge: -1
  img_proc: true
