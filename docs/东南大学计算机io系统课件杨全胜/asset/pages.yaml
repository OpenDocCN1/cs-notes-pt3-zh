- pgno: 38
  md: '# 1.5 Basic Program Execution Registers


    +   - **EAX** — Accumulator for operands and results data

    +   - **EBX** — Pointer to data in the DS segment (**Base Register**)

    +   - **ECX** — Counter for string and loop operations

    +   - **EDX** — I/O pointer


    +   - The lower 16 bits of these 4 registers map directly to the register set
    and can be referenced with the names AX, BX, CX, and DX.

    +   - Each of the lower two bytes of these 4 registers can be referenced by the
    names AH, BH, CH, and DH (high bytes) and AL, BL, CL, and DL (low bytes).'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 1.5 Basic Program Execution Registers


    ESI — Pointer to data in the segment pointed to by the DS register; source pointer
    for string operations (Index Register)


    EDI — Pointer to data (or destination) in the segment pointed to by the ES register;
    destination pointer for string operations (Index Register)


    ESP — Stack pointer (in the SS segment)


    EBP — Pointer to data on the stack (in the SS segment) (Base Register)


    +   - The lower 16 bits of these 4 registers map directly to the register set
    and can be referenced with the names SI, DI, SP, and BP.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 1.5 Basic Program Execution Registers


    # Segment Registers


    The segment registers hold 16-bit segment selectors. A segment selector is a special
    pointer that identifies a segment in memory.


    +   - CS - point to the code segment

    +   - SS - point to the stack segment

    +   - DS - point to the data segment

    +   - ES - point to the data segment

    +   - FS, GS - point to the data segment

    +     - FS and GS not uses in 16 bits assembler


    |  |

    |---|---|

    | Stack Segment |  |

    | Data segment |  |

    | Data segment |  |

    | Code segment |  |

    | ...... |  |'
  merge: -1
  img_proc: true
