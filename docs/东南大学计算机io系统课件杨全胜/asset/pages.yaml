- pgno: 81
  md: '# 1.6.2 Programming Memory Addressing Modes


    # Relative Programming Memory Addressing Modes


    +   - The term relative means “relative to IP”

    +   - The JMP instruction is a one-byte instruction, with a one-byte or a two-byte
    displacement that add to the IP. Both types can jump anywhere within the current
    code segment

    +     - A one-byte displacement is used in short jump

    +     - A two-byte displacement is used in near jump or call

    +   - Relative JMP and CALL instructions contain either an 8-bit or a16-bit signed
    displacement that allows a forward memory reference or a reverse memory reference.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 1.6.2 Programming Memory Addressing Modes


    # Relative Programming Memory Addressing Modes


    +   - All assemblers automatically calculate the distance for the displacement
    and select the proper one- or two-byte form.

    +     - An 8-bit displacement has a jump range of between +127 and -128 bytes
    from the next instruction; a 16-bit displacement has a range of ± 32K bytes.


    | offset | Machine code | program |

    |---|---|---|

    | 0000 | 0405 | ST: ADD AL,05H |

    | 0002 | 90 | NOP |

    | 0003 | EBFB | JMP SHORT ST |

    | 0005 | 90 | NOP |'
  merge: -1
  img_proc: true
