- pgno: 457
  md: '# 6.3 82C55 Operation Mode


    # Mode 1 – Strobed Input/Output


    +   - STB#. A “low” on this input loads data into the input latch.

    +   - IBF. A “high” on this output indicates that data has been loaded into the
    input latch; in essence, an acknowledgement. IBF is set by STB# input being low
    and is reset by the rising edge of the RD# input.

    +   - INTR. A “high” on this output can be used to interrupt the CPU when an input
    device is requesting service. INTR is set by the STB# is a “one”, IBF is a “one”
    and INTE is a “one”. It is reset by the falling edge of RD#. This procedure allows
    an input device to request service from the CPU by simply strobing its data into
    the port.

    +   - INTE A. Controlled by bit set/reset of PC4.

    +   - INTE B. Controlled by bit set/reset of PC2.'
  merge: -1
  img_proc: true
