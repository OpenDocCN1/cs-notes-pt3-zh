- pgno: 480
  md: '# 7.1 Serial Communication


    # ■ Serial Communication


    +   - Serial communication is the process of sending data one bit at a time, sequentially,
    over a communication channel or computer bus.

    +   - Needs serializer and deserializer, or SerDes

    +   - Serial communication is used for all long-haul communication and most computer
    networks, where the cost of cable and synchronization difficulties make parallel
    communication impractical.'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# 7.1 Serial Communication


    # Serial Communication


    Serial computer buses are becoming more common even at shorter distances, as improved
    signal integrity and transmission speeds in newer serial technologies have begun
    to outweigh the parallel bus''s advantage of simplicity (no need for serializer
    and deserializer, or SerDes) and to outstrip its disadvantages (clock skew, interconnect
    density).'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 7.1 Serial Communication


    # Serial versus parallel


    Serial links can be clocked considerably faster than parallel links in order to
    achieve a higher data rate, because:


    +   - Clock skew between different channels is not an issue.

    +   - A serial connection requires fewer interconnecting cables and hence occupies
    less space. The extra space allows for better isolation of the channel from its
    surroundings.

    +   - Crosstalk is less of an issue, because there are fewer conductors in proximity.


    Serial is cheaper to implement.'
  merge: -1
  img_proc: true
- pgno: 483
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 484
  md: '# 7.1 Serial Communication


    # Baud Rate


    The number of information bits that can be transmitted in one second (bit/s or
    bps), also known as the data bit rate. It is an important indicator to measure
    the rate of serial communication.


    # Receiver/sender clock


    +   - Directly determine the rate of data transmission on line.

    +   - It is usually the 1, 16, 32 or 64 times baud rate.

    +   - For asynchronous communication, it is 16 times baud rate'
