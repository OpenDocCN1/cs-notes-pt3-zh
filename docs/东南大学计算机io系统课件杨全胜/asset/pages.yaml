  md: '# 4.3 Interrupt in x86 System


    # Interrupt and Exception Classification


    # ◆ Non-Maskable Interrupt(NMI)


    +   - Hardware, non-maskable, and Vector interrupt

    +   - Interrupt request signal sent to the NMI pin.

    +   - interrupt vector number: 2

    +   - No need interrupt recognition.


    +   - When NMI signal transition from 0 to 1, then maintain high level at least
    four processor clock cycles, an NMI interrupt will be recognized.

    +   - NMI transition from 1 to 0 and maintain low level at least four processor
    clock cycles，a new NMI interrupt can be identified.'
