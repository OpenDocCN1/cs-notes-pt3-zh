- pgno: 439
  md: '# 5.4 8254 in PCH


    # Counter 0, System Timer


    +   - Frequency of CLK0 is 1.1931816MHz; Initial count is 65536


    +   - This counter functions as the system timer by controlling the state of IRQ0
    and is typically programmed for Mode 3 operation.


    +   - OUT0 generate the square wave which frequency is 18.2Hz to IRQ0 in Master
    8259A.


    +   - The counter asserts IRQ0 when the count value reaches 0, reloads the initial
    count value, and repeats the cycle, alternately asserting and negating IRQ0.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# 5.4 8254 in PCH


    # Counter 1, Refresh Request Signal


    +   - Frequency of CLK1 is 1.1931816MHz; initial count is 18.

    +   - This counter provides the refresh request signal and is typically programmed
    for Mode 2 operation and only impacts the period of the REF_TOGGLE bit in Port
    61.

    +   - OUT1 connect DREQ0 in 8237, every 15.08µs have a width of 838ns pulse for
    RAM refresh.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# 5.4 8254 in PCH


    # Counter 2, Speaker Tone


    +   - Frequency of CLK1 is 1.1931816MHz; initial count is sent in software.


    +   - This counter provides the speaker tone and is typically programmed for Mode
    3 operation


    +   - The counter provides a speaker frequency equal to the counter clock frequency
    (1.193 MHz) divided by the initial count value.


    +     - Initial count = frequency of CLK2 / frequency of sound


    +   - The speaker must be enabled by a write to port 61h'
  merge: -1
  img_proc: true
- pgno: 442
  md: "# Counter 2, Speaker Tone\n\n; function: issued 896Hz sound\n\n; parameter:\
    \ CX= time interval\n\n; return: none\n\n```\nBEEP PROC FAR\n    IN      AL, 61H;\
    \  read 8255 PB port\n    MOV     AH, AL\n    PUSH    AX\n    MOV     AL, 10110110B\n\
    \    OUT     43H, AL\n    MOV     AX, 0533H;  =1.1931816MHz/896Hz\n    OUT   \
    \  42H, AL\n    MOV     AL, AH\n    OUT     42H, AL\n    POP     AX\n```"
  merge: -1
