- pgno: 1018
  md: '# 快恢复算法


    +   (1) 当发送端收到连续三个重复的确认时，就执行“乘法减小”算法，把慢开始门限 ssthresh 减半。但接下来不执行慢开始算法。


    +   (2) 由于发送方现在认为网络很可能没有发生拥塞，因此现在不执行慢开始算法，即拥塞窗口 cwnd 现在不设置为 1，而是设置为慢开始门限 ssthresh
    减半后的数值，然后开始执行拥塞避免算法（“加法增大”），使拥塞窗口缓慢地线性增大。'
  merge: -1
  img_proc: true
- pgno: 1019
  md: '# 从连续收到三个重复的确认

    转入拥塞避免


    ![](img/0761188ee01704e55ea71e6a97539d38_1019_0.png)'
  merge: -1
