  md: '# 加密算法的混合使用


    为提高加密的效率，混合使用秘密密钥加密体系和公开密钥加密体系的算法。


    接收方的公开密钥


    ![](img/0761188ee01704e55ea71e6a97539d38_1156_0.png)


    +   （1）发送方使用密钥生成算法生成对称密钥，并用该密钥和DES加密算法一起对明文进行加密，生成密文；

    +   （2）使用接收方的公开密钥对生成的对称密钥进行加密，形成加密的密钥，该密钥连通密文一起传输给接收方。'
