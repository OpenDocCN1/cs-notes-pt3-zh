- pgno: 1148
  md: '# 数据加密算法：秘密密钥加密体系


    解密密钥与加密密钥相同，或者可以由加密密钥导出。\n即通信双方共享一个密钥（K=P），M=D_K(E_K(M))。


    # 典型算法：DES算法


    # 基本思想：


    +   1. 首先将整个明文分块：每64位（8个字节）一块；

    +   2. 然后用64位的密钥对每个64位的明文块进行加密，形成若干个64位的密文块；

    +   3. 最后串接所有的密文块形成整个密文。'
  merge: -1
  img_proc: true
- pgno: 1149
  md: '# 数据加密算法：秘密密钥加密体系


    # DES算法加密过程：


    由16个独立的加密循环所组成，每个循环均使用一个密钥和一种加密算法（包括移位和置换）;


    每一循环使用的密钥是对上一循环所用密钥（包括用户输入的最初密钥，称为主密钥）进行处理得到的结果。


    每个循环产生的密文（中间密文）均作为下一循环的输入而进行进一步的加密。'
  merge: -1
  img_proc: true
- pgno: 1150
  md: '# 数据加密算法：秘密密钥加密体系


    # DES加密算法原理：


    通过64位的密钥将64位的明文（密文）加密（解密）为密文（明文）；64位密钥对应8字节，实际使用56位（8位校验），

    因此，密钥空间2^56；循环迭代使用移位、置换（换序）、选择（64b→56b→48b→32b）、扩展（32b → 48b）和模2加操作来获得结果。


    ![](img/0761188ee01704e55ea71e6a97539d38_1150_0.png)'
