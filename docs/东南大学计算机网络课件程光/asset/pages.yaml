- pgno: 435
  md: '# 移动自组网络（自组网络 ad hoc network）


    +   - 自组网络是没有固定基础设施（即没有 AP）的无线局域网。这种网络由一些处于平等状态的移动站之间相互通信组成的临时网络。


    ![](img/0761188ee01704e55ea71e6a97539d38_435_0.png)'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# 移动自组网络的应用


    +   - 在**军事领域**中，可利用临时建立的移动自组网络进行通信。

    +   - 可应用到作战的地面车辆群和坦克群，以及海上的舰艇群、空中的机群。

    +   - 当**出现自然灾害**时，利用移动自组网络进行及时的通信，抢险救灾。


    移动自主网络包括：


    +   - 无线传感器网络 **WSN** (Wireless Sensor Network)

    +   - 无线个人区域网 **WPAN** (Wireless Personal Area Network)'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# 无线传感器网络（WSN）


    由大量传感器结点通过无线通信技术构成的自组网络。


    # 无线传感器网络的特点：


    +   - 应用是进行各种数据的采集、处理和传输，

    +   - 一般并不需要很高的带宽，但是在大部分时间必须保持低功耗，以节省电池的消耗。

    +   - 无线传感结点的存储容量受限，对协议栈的大小有严格的限制。

    +   - 对网络安全性、结点自动配置、网络动态重组等方面有一定的要求。'
  merge: -1
  img_proc: true
