- pgno: 726
  md: '# 因特网地址之一：域名地址（Domian Name）


    **IP地址的问题：** 标识网络中的每台主机用数字表示，缺乏规律，难以记忆；

    改善的方法：选用有助记忆的符号名——**域名地址**；


    **域名：** 表示某个范围，采用层次命名结构：

    格式：子域(.父域(.父域)) ——体现一种隶属关系

    例：`edu.cn`　　中国.教育科研网

    　　`seu.edu.cn`　　中国.教育科研网.东南大学


    **主机名 + 域名 = 域名地址**

    唯一标识因特网中的一台设备

    例：`www.seu.edu.cn`


    域名地址的维护：**域名系统（DNS）**；

    实现域名地址与IP地址的**映射**；

    保证域名地址在因特网中唯一性。


    | /etc/hosts文件（Unix 系统） |  |

