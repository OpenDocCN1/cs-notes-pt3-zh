- pgno: 79
  md: '# 编码/解码 (C0ding and DECoding)


    # 脉码调制技术 (PCM)


    取样： 通过某种频率的取样脉冲将模拟信息的值取出，变连续的模拟信息为离散信号。


    量化： 量化的目的是确定取样出的模拟信号的数值。

    通过规定一定的量化级，对取样的离散值进行“取整”量化，得到离散信号的具体数值。


    编码： 将量化后的值编码成一定位数的二进制值。


    依据一奈奎斯特采样定理： 最大频率为 F 的模拟信号被不失真还原的前提条件是取样频率不低于 2F。'
  merge: -1
