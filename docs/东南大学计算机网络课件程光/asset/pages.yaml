- pgno: 696
  md: '# 无分类编址 CIDR


    # 1. 网络前缀


    划分子网在一定程度上缓解了因特网在发展中遇到的困难。然而在 1992 年因特网仍然面临三个必须尽早解决的问题，这就是：


    +   - B 类地址在 1992 年已分配了近一半，眼看就要在 1994 年 3 月全部分配完毕！

    +   - 因特网主干网上的路由表中的项目数急剧增长（从几千个增长到几万个）。

    +   - 整个 IPv4 的地址空间最终将全部耗尽。'
  merge: -1
  img_proc: true
- pgno: 697
  md: '# 子网掩码地址的扩展使用—无类域间选路（超网）


    目的：扩大C类网的地址空间（RFC1519）。


    原因：B类网个数偏少，C类网偏多，子网间转发需要路由器的支持；能否减少路由器的个数，或者提高路由效率？


    方法：将若干连续的C类网地址聚集使用，将C类网的Netid的一部分作为Hostid的延伸（有时称为“聚合路由”）；路由聚合技术。'
  merge: -1
  img_proc: true
- pgno: 698
  md: '# IP 编址问题的演进


    +   - 1987 年，RFC 1009 就指明了在一个划分子网的网络中可同时使用几个不同的子网掩码。使用变长子网掩码 VLSM (Variable Length
    Subnet Mask)可进一步提高 IP 地址资源的利用率。

    +   - 在 VLSM 的基础上又进一步研究出无分类编址方法，它的正式名字是无分类域间路由选择 CIDR (Classless Inter-Domain
    Routing)。'
  merge: -1
  img_proc: true
- pgno: 699
  md: '# CIDR 最主要的特点


    +   - CIDR 消除 了传统的 A 类、B 类和 C 类地址以及划分子网的概念，因而可以更加有效地分配 IPv4 的地址空间。

    +   - CIDR 使用各种长度的“网络前缀”(network-prefix)来代替分类地址中的网络号和子网号。

    +   - IP 地址从三级编址（使用子网掩码）又回到了二级编址。'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# 无分类的两级编址


    +   - 无分类的两级编址的记法是：


    > IP地址 ::= {<网络前缀>，<主机号>}　　(4-3)


    +   - CIDR 还使用“斜线记法”（slash notation），它又称为 CIDR记法，即在 IP 地址面加上一个斜线“/”，然后写上网络前缀所占的位数（这个数值对应于三级编址中子网掩码中
    1 的个数）。


    +   - CIDR 把网络前缀都相同的连续的 IP 地址组成“CIDR 地址块”。'
  merge: -1
  img_proc: true
- pgno: 701
  md: '# CIDR 地址块


    +   - 128.14.32.0/20 表示的地址块共有 2¹² 个地址（因为斜线后面的 20 是网络前缀的位数，所以这个地址的主机号是 12 位）。

    +   - 这个地址块的起始地址是 128.14.32.0。

    +   - 在不需要指出地址块的起始地址时，也可将这样的地址块简称为 “/20 地址块”。

    +   - 128.14.32.0/20 地址块的最小地址： 128.14.32.0

    +   - 128.14.32.0/20 地址块的最大地址： 128.14.47.255

    +   - 全 0 和全 1 的主机号地址一般不使用。'
  merge: -1
  img_proc: true
