- pgno: 1186
  md: '# ☆ 简单网络管理协议（SNMPv1—RFC1157）


    SNMP位于应用层，利用UDP的两个端口（161和162）实现管理员和代理之间的管理信息交换。UDP端口161用于数据收发，UDP端口162用于代理报警；


    管理员/代理之间交换五种类型的PDU：


    | 名称 | 编码 | 功能说明 |

    |---|---:|---|

    | GetRequest | 0 | 管理员至代理，查询指定变量的值； |

    | GetNextRequest | 1 | 管理员至代理，查询下一变量的值； |

    | GetResponse | 2 | 代理至管理员，回送执行结果（正确/差错）； |

    | SetRequest | 3 | 管理员至代理，设置代理维护的某个变量的值； |

    | Trap | 4 | 代理至管理员，主动传递报警信息。 |'
  merge: -1
  img_proc: true
