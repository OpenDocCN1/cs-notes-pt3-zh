- pgno: 128
  md: '# 面向比特型的传输控制规程—HDLC


    +   数据传输模式


    # 正常响应模式(NRM):


    主站具有选择、轮询次站的能力，并可向次站发送命令或数据；

    次站只有在主站询问时才能作为响应传输数据；


    # 异步响应模式(ARM):


    主站具有初始链路，差错校正和逻辑拆链功能；

    次站可以主动传输数据；


    # 异步平衡模式(ABM):


    任一组合站均可控制链路，主动传送数据。


