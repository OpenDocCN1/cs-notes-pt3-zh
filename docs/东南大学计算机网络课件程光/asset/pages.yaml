- pgno: 220
  md: '# OSI的数据类型


    数据单元（DU）： OSI环境中交换的数据。


    服务数据单元（SDU）： 相邻层间交换的数据单元，SDU为服务原语的表现形式。


    接口数据单元（IDU）： 相邻层界面上体现的数据单元


    IDU=SDU+ 接口控制信息。


    协议数据单元（PDU）：对等层间交换的数据单元，


    PDU的内容和格式由协议精确地定义。


    （N）PDU作为（N−1）SDU的一部分，传递给下层，直至对等层实体。'
