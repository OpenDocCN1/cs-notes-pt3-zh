- pgno: 796
  md: '# 这里要指出两点


    +   - 因特网的早期 RFC 文档中未使用 “路由器” 而是使用 “网关” 这一名词。但是在新的 RFC 文档中又使用了 “路由器” 这一名词。应当把这两个属于当作同义词。

    +   - IGP 和 EGP 是协议类别的名称。但 RFC 在使用 EGP 这个名词时出现了一点混乱，因为最早的一个外部网关协议的协议名字正好也是 EGP。因此在遇到名词
    EGP 时，应弄清它是指旧的协议 EGP 还是指外部网关协议 EGP 这个类别。'
  merge: -1
  img_proc: true
- pgno: 797
  md: '# 因特网的路由选择协议


    +   - 内部网关协议 IGP：具体的协议有多种，如 RIP 和 OSPF 等。

    +   - 外部网关协议 EGP：目前使用的协议就是 BGP。'
  merge: -1
  img_proc: true
- pgno: 798
  md: '# 4.5.2 内部网关协议 RIP

    (Routing Information Protocol)


    # 1. 工作原理


    +   - 路由信息协议 RIP 是内部网关协议 IGP 中最先得到广泛使用的协议。


    +   - RIP 是一种分布式的基于距离向量的路由选择协议。


    +   - RIP 协议要求网络中的每一个路由器都要维护从它自己到其他每一个目的网络的距离记录。'
  merge: -1
  img_proc: true
- pgno: 799
  md: '# “距离”的定义


    +   - 从一路由器到**直接连接**的网络的距离定义为 1。

    +   - 从一个路由器到非直接连接的网络的距离定义为所经过的路由器数加 1。

    +   - RIP 协议中的“距离”也称为“跳数”（hop count），因为每经过一个路由器，跳数就加 1。

    +   - 这里的“距离”实际上指的是“最短距离”。'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# “距离” 的定义


    +   - RIP 认为一个好的路由就是它通过的路由器的数目少，即 “距离短”。

    +   - RIP 允许一条路径最多只能包含 15 个路由器。

    +   - “距离” 的最大值为 16 时即相当于不可达。可见 RIP 只适用于小型互联网络。

    +   - RIP 不能在两个网络之间同时使用多条路由。RIP 选择一个具有最少路由器的路由（即最短路由），哪怕还存在另一条高速(低时延)但路由器较多的路由。'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# RIP 协议的三个要点


    +   - 仅和**相邻路由器**交换信息。

    +   - 交换的信息是当前本路由器所知道的**全部信息**，即自己的路由表。

    +   - 按固定的时间间隔**交换路由信息**，例如，每隔 30 秒。'
  merge: -1
  img_proc: true
- pgno: 802
  md: '# 路由表的建立


    +   - 路由器在刚刚开始工作时，只知道到直接连接的网络的距离（此距离定义为1）。

    +   - 以后，每一个路由器也只和数目非常有限的相邻路由器交换并更新路由信息。

    +   - 经过若干次更新后，所有的路由器最终都会知道到达本自治系统中任何一个网络的最短距离和下一跳路由器的地址。

    +   - RIP 协议的**收敛**（convergence）过程较快，即在自治系统中所有的结点都得到正确的路由选择信息的过程。'
  merge: -1
  img_proc: true
