- pgno: 1243
  md: '# 信道与信息类型匹配问题：


    ![](img/0761188ee01704e55ea71e6a97539d38_1243_0.png)


    # 奈奎斯特（Nyquist）定理：


    无噪声下的 B（信道容量或码元速率）与 H（信道带宽）关系：


    **B = 2·H（波特）**；


    无噪声下的 C（信道速率）与 B 的关系：**C = B·log₂N（bps）**


    其中：N 为一个码元可取的离散值个数。


    # 香农（Shannon）定理：


    有热噪声时 C、H 和噪声的关系：**C = H·log₂(1+S/N)（bps）**


    比特速率 = 码元速率 * log₂N　　/*N：码元蕴含的信息量

    （比特率）　　（波特率）


    使得低带宽线路支持较高速比特流传输。


    编码/解码(Codec)的方法：采样、量化、编码；


    若语音频率<4Khz，采样频率8Khz，256量化级，8位编码，则不失真速率64Kbps；


    结论：计算机发送端口发出的数字信号最终可传递到接收端口。'
  merge: -1
  img_proc: true
