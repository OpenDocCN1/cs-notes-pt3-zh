- pgno: 1051
  md: '# 万维网必须解决的问题


    (2) 用何协议实现万维网上各种超链的链接？


    +   - 在万维网客户端程序与万维网服务器程序之间进行交互所使用的协议，是超文本传送协议 HTTP (HyperText Transfer Protocol)。

    +   - HTTP 是一个应用层协议，它使用 TCP 连接进行可靠的传送。'
  merge: -1
