- pgno: 936
  md: '# 应用进程之间的通信


    +   - 两个主机进行通信实际上就是两个主机中的应用进程互相通信。

    +   - 应用进程之间的通信又称为端到端的通信。

    +   - 传输层的一个很重要的功能就是复用和分用。应用层不同进程的报文通过不同的端口向下交给运输层，再往下就共用网络层提供的服务。

    +   - “传输层提供应用进程间的逻辑通信”。“逻辑通信”的意思是：传输层之间的通信好像是沿水平方向传送数据。但事实上这两个运输层之间并没有一条水平方向的物理连接。'
  merge: -1
  img_proc: true
