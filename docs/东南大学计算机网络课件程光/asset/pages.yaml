- pgno: 490
  md: '# 数字数据网（DDN）


    DDN是电信部门向用户提供的一种高速通信业务，利用数字通道提供半永久性的连接电路，提供中高速、高质量的点一点、点一多点的数字专用电路。


    # 特点：


    +   - 将多路复用技术应用于数字传输信道，来支持多个用户“共享”通信资源

    +   - DDN是面向用户的数字传输技术，速度较SDH低。

    +   - DDN采用时分多路复用技术将支持数字信息高速传输的光纤通道划分为一系列的子信道（例如：2.048Mbps的光纤信道划分为32路64Kbps的子信道，可以分配给32个用户使用）'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# 数字数据网（DDN）


    # 特点（续）：


    +   - DDN仅是一条支持用户数据点到点高速传输的通道

    +   - 用户可以向电信部门定时的租用子信道（独占）

    +   - DDN的基本速率为64Kbps，用户租用的信道速率应为64Kbps的整数倍。

    +   - DDN本身并不提供任何通信协议的支持，在DDN信道上使用何种通信协议由用户自行决定

    +   - DDN信道的最大不足是DDN仅提供点到点通信的专用信道（也称专线），因此当一个用户希望和多个其它的用户使用DDN通信时，必须租用多个DDN端口

    +   - 速率高、物理时延小，最高速率为150Mbps'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# 数字数据网（DDN）


    # 特点（续）：


    +   - 支持数据、图像、声音等多种业务。


    +   - 网络运行管理简便，没有任何检错、纠错功能


    +   - DDN适用于传输数据量大的业务。 CHINADDDN（公用数字数据网）94年10月开通，覆盖全国21个省会城市，并通过省内DDN网络延伸到地市县。


    +   - 传输速率2.048Mb/s。已达2300多个城市，用户12.2万以上。'
