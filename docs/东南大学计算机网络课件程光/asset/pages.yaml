- pgno: 424
  md: '# 无线局域网—扩频通信


    # 直接序列扩频（直序扩频： DSSS）：


    收方：根据自己掌握的发方编码对收到的码片集进行解码计算。当结果的绝对值等于频段个数时，才表示收到了该发方发来的信息。


    例：用户A与用户C通信，用6个频段发送，C收到A发来的码片集（D），用A的码片集（Ca）进行解码计算：


    ```

    Sa = Σ Cai* Di

    ```


    结果： = 6，表示收到的是 “1”

    = -6， 收到的是 “0”'
  merge: -1
  img_proc: true
