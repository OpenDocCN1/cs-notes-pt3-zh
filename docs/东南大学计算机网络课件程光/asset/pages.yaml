- pgno: 263
  md: '# 应用层


    # （1） 应用层目的


    应用层是网络可向最终用户提供应用服务的唯一窗口，其目的是支持用户联网的应用要求。在OSI/RM中，这些应用服务被称为应用服务元素（包括电子邮件、文件传输、虚拟终端、电子数据交换等）。


    # （2） 应用服务分类


    不同的应用服务元素具有共性和特性，可分为两类：


    +   ★ 公共应用服务元素（CASE）：提供与特定应用服务无关的公共服务；

    +   ★ 特定应用服务元素（SASE）：提供面向特定应用的服务，如 FTAM, MHS, EDI等。


    ![](img/0761188ee01704e55ea71e6a97539d38_263_0.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# OSI/RM的物理映射


    OSI/RM从理论上规范了计算机网络实现的方法。


    具体实现： 3/1/3（低3层/第4层/高3层）结构


    OSI/RM的低3层： 主要提供信息传输服务，保证一个站点发出的信息可以通过一系列中间结点的合作传输到另一个站点。


    实现时一般加载到一个独立的硬件设备（结点机、路由器等）（通信子网）


    OSI/RM的高3层： 主要面向用户，协助用户合理和高效的利用各种用户资源（包括软件、硬件和信息资源）。高3层的实体在计算机设备上实现：


    OSI/RM中的第4层： 作为整个OSI参考模式中的中间层次，起着至关重要的上连下达的作用，屏蔽通信子网的性能和用户对网络性能要求之间的差异。 一般可在计算机上实现'
  merge: -1
  img_proc: true
