- pgno: 261
  md: '# 表示层


    基于会话层的问题：


    不同的计算机系统可能采用不同的信息编码，具有不同的信息描述和表示方法，而不同的信息描述（表示）将导致计算机系统无法识别信息的含义。


    表示层功能：


    表示层功能包括传送语法的协商，以及抽象语法和传送语法之间的转换。通过这种转换来统一表示被传送的用户数据，使得通信双方使用的计算机都可以识别。


    协商：采用什么数据编码进行传输，传输过程中数据是否要压缩，采用什么压缩算法等。'
  merge: -1
  img_proc: true
