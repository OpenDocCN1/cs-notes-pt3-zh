- pgno: 519
  md: '# ATM交换机内部交换结构


    +   • 时分交换结构：


    交换机内部可被理解为一个可为各个端口共享的高速时间片环，交换机端口类似于环上的结点，环路的吞吐量大于或者等于所有各个端口的传输能力总和，从而保证交换的及时性。


    缺点：


    交换机的吞吐量上限由环路的吞吐量所决定，不随端口的增加或者减少而变化。随着端口的增加，对共享环路资源的需求也增加，最终可能会影响交换机的性能。


    ![](img/0761188ee01704e55ea71e6a97539d38_519_0.png)


    +   8个155Mbps端口

    +   >1.2Gbps的环路吞吐量

    +   交换机背板速率'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# # ATM交换机内部交换结构


    +   - **空分交换结构**：（多级矩阵交换结构），端口之间利用**矩阵电路**形成一条或者多条“通路”，支持信元的交换；

    +   - **增加端口**意味着增加电路，有利于提高交换机的吞吐率；

    +   - 选择端口：交换机内部的**路由选择**；

    +   - 选择相同端口：信元碰撞，**内部缓存**解决碰撞问题。


