  md: '# HDLC窗口机制——提高效率的保障


    # 1、传输窗口：


    通信双方同意在同一条链路上连续使用的信息帧序号。


    窗口尺寸：通信双方协商同意的在同一条链路上可连续发送且未被认可的信息帧个数；


    HDLC窗口尺寸：2³−1=7，


    即任一方可以最多连续发送7帧而无需对方的确认，帧序号循环使用（模8：Mod 8）。


    在信息帧中用 Nr、Ns 来表示当前窗口的情况；


    | 帧类型 | 位7 | 位6 | 位5~3 | 位2 | 位1~0 |

    |---|---:|---:|---|---|---|

    | 信息帧（I） | 0 |  | Ns | P/F | Nr |

    | 监控帧（S） | 1 | 0 | Type | P/F | Nr |

    | 无编号帧（U） | 1 | 1 | M1 | P/F | M2 |'
