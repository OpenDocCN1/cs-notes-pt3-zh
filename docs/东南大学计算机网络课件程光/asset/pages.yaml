- pgno: 1129
  md: '# 防火墙说明


    防火墙仅用于隔绝内部网和外部网的直接连通，无法防御内部网自身的侵袭，例如内部网用户的越权访问；因此，内部网的资源仍需设置必要的访问控制（主要是访问权限设置）；


    防火墙仅是一种被动的防御设施，且建立在已有知识的基础上，因此，难以防范可能出现的新攻击（类似防病毒设施）；


    网络协议本身的漏洞是目前黑客攻击的主要对象，因此，网络协议本身也被列为安全考察的目标。'
  merge: -1
  img_proc: true
- pgno: 1130
  md: '# 访问控制技术：


    访问控制：对系统中资源的访问动作进行安全控制的安全服务和安全机制；


    # 访问控制的基本要素：


    主体（Subject）：提出请求或实施访问操作的实体——可以是用户或其它任何代理用户行为的实体（例如进程、作业和程序）


    客体（Object）：接受其他实体访问的被动实体——凡是可以被操作的信息、资源、对象都可以认为是客体。


    控制策略：主体对客体的操作行为集和约束条件集


    ——控制策略是主体对客体的访问规则集，这个规则集直接定义了主体对客体可以的作用行为和客体对主体的条件约束。


    ——访问策略体现了一种授权行为，也就是客体对主体的权限允许，这种允许不超越规则集。'
  merge: -1
  img_proc: true
