- pgno: 497
  md: '# 帧中继网络（Frame Relay）


    （1） 帧中继的提出


    依据：高质量传输媒体应用，传输差错率下降，简化差错处理；


    LAN应用促使LAN-WAN-LAN连通，帧通过WAN进行中继。


    ![](img/0761188ee01704e55ea71e6a97539d38_497_0.png)'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 帧中继网络（FrameRelay）


    帧中继网络与X25网络相似，简化X25协议，不提供差错处理的过程，提供交换功能。速率可达2～155Mb/s。


    # FR的特点：


    +   - FR支持OSI下二层服务并提供部分的网络层功能；

    +   - FR采用光纤作为传输介质，传输误码率低；

    +   - 将分组重发、流量控制、纠正错误、防止拥塞（正向拥塞通知，反向拥塞通知，丢失指示等）等处理过程由端系统去实现；简化了结点的处理过程，缩短了处理时间，降低了网络时延；'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# 帧中继网络（FrameRelay）


    FR 特点（续）：


    +   - 具有灵活可靠的组网方式，可采用永久虚电路（或交换虚电路）的方式，一条物理连接能够提供多个逻辑连接，用户所需的进网端口数减少；

    +   - FR具有按需分配带宽的特点，用户支付了一定的费用购买“承诺信息速率”，当突发性数据发生时，在网络允许的范围内，可以使用更高的速率

    +   - 使用FR，用户接入费用相应减少。'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# 帧中继网络（FrameRelay）


    # FR和DDN的比较：


    DDN：采用复用技术的逻辑数字专线，多端口接入；

    FR：具有路由交换功能的数字网络，单端口接入。


    帧中继一般在DDN网上配置端口实现，方便用户接入，并降低端口数，减少成本（租金约为DDN线路的1/4）。


    如果大多数业务在2Mbps之内，是FR业务的最经济有效的范畴。


    # 现状：用于企业广域互连；

    专网备份线路。'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# ISDN（综合业务数据网络）


    # （1） ISDN的目标


    集电话、电报、传真、数据通信为一体，以数字化技术统一处理各种公用网的业务，为用户提供“一线通”服务；


    用户线保持双绞线，数字化客户端，使用T或者E载波系统；


    ![](img/0761188ee01704e55ea71e6a97539d38_501_0.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_501_1.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_501_2.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_501_3.png)'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# ISDN的组成


    在ISDN中，用户和综合业务数字网之间的连线相当于一个数字比特管道，管道中的比特流可以来自数字电话机，数字传真机或其它终端。


    ![](img/0761188ee01704e55ea71e6a97539d38_502_0.png)


    # ISDN的用户类型：


    +   - 一个家庭或小单位：在用户家中或办公室中安装一个用户端接设备（NT1），用户的电话、传真、计算机等等通过NT1与ISDN交换局相连，用户设备可多达8个。只需要一根线。


    （一线通）'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# ISDN的组成


    +   一个较大单位：拥有较多的电话和终端，用户设施较多，需要较大的接入带宽。NT1不够用，需要一个 ISDN的专用小交换局（PBX），称为第二类网络端接设备（NT2）。类似于电话交换机。


    ![](img/0761188ee01704e55ea71e6a97539d38_503_0.png)'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# ISDN网络的接入速率


    +   - 基本速率接口（BRI）：


    两个B通路和一个D通路（2B+D），通常速率为144 Kbps。


    两条64 Kbps 的B通路，支持话音和数据传输，一条D通道，用于传输控制信号和数据，16Kbps全双工数据通道。


    适用于家庭或小单位，可以通过BRI接口传送语音、数据、传真及一般质量的图像，可传输可视电话、电视会议。至少可使三个一般的终端同时在2B+D的信道上传输数据。'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# ISDN网络的接入速率


    # •一次群速率接口（PRI）：


    **T1系统（1.544Mbps）：** 美国、日本等国采用23个64 Kbps的B通路和1个64 Kbps的D通路的速率接口（23B+D）。


    **E1系统（2.048Mbps）：** 欧洲国家采用的是30个64 Kbps的B通路和1个64 Kbps的D通路的速率接口（30B+D）。


    **B通道：** 透明地传输用户信息（数字化语音和数据），用户可以采用任意的通信协议；


    **D通道：** 主要用于用户和网络之间的**控制信息交换**，包括建立和拆除连接等，也可支持较低速率要求的数据传输；


    *较大单位可使用租用T1线路。*'
  merge: -1
  img_proc: true
- pgno: 506
  md: '# ISDN基本速率接口BRI分析


    ISDN采用时分多路复用技术，支持用户设备接入ISDN网络。


    # 基本速率接口（BRI），ISDN的帧结构：


    48位      1 1 8   1 1 1 1 1   8   1 1 1   8   1 1 1   8   1 1 1 (位)

    NT到TE  F L  B1  E D A F F  B2  E D S  B1  E D S  B2  E D S

    网络到终端，


    1 1 8   1 1 1 1 1   8   1 1 1   8   1 1 1   8   1 1 1 (位)

    TE到NT  F L  B1  L D L F L  B2  L D L  B1  L D L  B2  L D L

    终端到网络


    BRI帧的发送频度为每秒4000帧，

    每帧中的B1（16位）、B2（16位）和D（4位）字段，

    B和D的速率分别为64Kbps和16Kbps（4位/帧×4000帧/秒）'
