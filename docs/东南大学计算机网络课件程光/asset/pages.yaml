- pgno: 1169
  md: '# 网络管理


    必要性：


    网络规模扩展、网络设备的分布性、基于网络的应用越来越多、对网络的性能提出更高的要求，需要对网络的流量、设备的运行状况进行分析；等等，需要相应的工具协助管理员来网络管理—网络管理软件。


    +   ☆ 用户视角：价廉物美地使用网络，快捷可靠传输信息，丰富资源；

    +   ☆ 运营商视角：资源（带宽和设备缓存等）充分利用；

    +   ☆ 企业组网者：满足应用需求，成本（资源利用率）；'
  merge: -1
  img_proc: true
- pgno: 1170
  md: '# 网络管理


    实质：对各种网络资源状态及其使用进行监测、控制和记录，并在网络出现故障时，及时报告和处理，向管理员报警，以便尽快维护。


    关键：获取网络设备的工作状态；


    问题：设备依赖于厂商，不同厂商具有不同的数据采集方法；


    解决方法—标准化：网络普及和多厂商设备（异构性）融合，导致标准化的需求；


    标准化的目标：统一管理的对象，定义为支持管理而需要交换的数据单元的格式和交换时序。'
  merge: -1
  img_proc: true
- pgno: 1171
  md: '# 网络管理的职能


    网络管理主要管什么？（网管的五大功能）


    +   - 故障管理

    +   - 配置管理

    +   - 计费管理

    +   - 性能管理

    +   - 安全管理


    网络管理标准：


    网络设备的异构性导致标准化的需求。


    ISO/OSI网络管理标准—公共管理信息协议（CMIP）；


    因特网网络管理标准—简单网络管理协议（SNMP）。'
  merge: -1
  img_proc: true
- pgno: 1172
  md: '# 网络管理的功能


    # 1、故障管理：


    网络管理最基本的功能，系统出现异常情况下的管理操作，简单地说，就是找出故障的位置并进行恢复。其目标是自动监测、记录网络故障并通知用户，以便网络有效地运行。


    网络故障管理包括：


    +   - 检测故障、判断故障症状：依赖于对网络设备的状态监测；


    +   - 隔离故障：通过诊断、测试辨别故障根源，对根源故障进行隔离；


    +   - 故障修复：不严重的简单故障通常由网络设备通过本身具有的故障检测、诊断和恢复措施予以解决；


    +   - 记录故障的监测及其结果'
  merge: -1
  img_proc: true
- pgno: 1173
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1174
  md: '# 网络管理的功能


    3、计费管理：记录网络资源的使用情况和使用这些资源的代价。主要包括：


    +   - 统计已被使用的网络资源和估算用户应付的费用；

    +   - 设置网络资源的使用计费限制，控制用户占用和使用过多的网络资源；

    +   - 对为了实现某个特定通信目的所引用的多个网络资源进行联合收费的能力。'
  merge: -1
  img_proc: true
- pgno: 1175
  md: '# 网络管理的功能


    计费管理的目标：


    衡量网络的利用率，


    用户可以按规则利用网络资源，


    使网络资源可以根据其能力的大小而合理地分配，


    这样的规则可使网络故障降低到最小，也可使所有用户对网络的访问更加公平。


    为了实现合理的计费，计费管理必须和性能管理相结合。'
  merge: -1
  img_proc: true
- pgno: 1176
  md: '# # 网络管理的功能


    # ## 4、性能管理：


    **收集和统计网络系统的数据**（如网络的吞吐量、用户响应时间和网络资源的利用率等），以便根据统计信息来评价网络资源的使用等系统性能，分析系统资源的使用趋势，或者平衡系统资源的负载。


    # 性能管理主要包括：


    +   - 收集网络管理者感兴趣的那些变量的性能参数；

    +   - 分析这些统计数据，以判断是否处于正常水平；

    +   - 为每个重要的变量决定一个**适合的性能门槛值**，超过该阈值就意味着网络的故障。


    **性能分析的结果**：可能会触发某个诊断测试过程，或者引起网络重新配置以维持网络预定的性能。'
  merge: -1
  img_proc: true
- pgno: 1177
  md: '# 网络管理的功能


    5、安全管理：


    按照本地的指导来控制对网络资源的访问，以保证网络不被侵害（有意识的或无意识的），并保证重要信息不被未授权的用户访问。


    网络安全问题：网络数据的私有性、授权控制、访问控制


    # 网络安全管理主要包括：


    +   （1）授权管理：分配权限给所请求的实体。


    +   （2）访问控制管理：分配口令、进入或修改访问控制表和能力表。


    +   （3）安全检查跟踪和事件处理


    +   （4）密钥管理：进行密钥分配


    # 网络安全管理的操作：


    +   • 标识重要的网络资源：确定网络资源和用户集的映射关系，


    +   • 监视对重要网络资源的访问等。'
  merge: -1
  img_proc: true
- pgno: 1178
  md: '# # 网络管理的体系结构


    系统管理应用进程（SMAP）：负责管理整个系统的资源，并提供控制和监测的能力。


    **两类实体：**

    - **管理员：**负责对整个网络的资源进行管理。

    - **代理：**则驻留在被管对象上，响应管理员的指令。

    管理员和代理之间遵循公共管理信息协议（CMIP）。


