- pgno: 210
  md: '# OSI基本术语


    “层”：开放系统的逻辑划分，代表功能上相对独立的一个子系统。


    +   - （N）层表示OSI层次结构中的任一层，

    +   - （N+1）层表示指定层次的上邻层

    +   - （N−1）层表示指定层次的下邻层。


    N层服务


    ![](img/0761188ee01704e55ea71e6a97539d38_210_0.png)'
  merge: -1
