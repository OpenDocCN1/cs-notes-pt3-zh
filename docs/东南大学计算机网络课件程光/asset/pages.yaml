- pgno: 719
  md: '# IP地址——专用IP地址


    TCP/IP协议需要IP地址支持，IP地址资源具有告急的趋势，使用IP地址的组织未必要接入因特网。


    **解决方案：** 用于专用网的地址分配方案（RFC1918）


    原理：定义两类IP地址，


    +   - 全局IP地址用于因特网——公共主机；

    +   - 专用IP地址仅用于组织的专用网内部——本地主机。


    ![](img/0761188ee01704e55ea71e6a97539d38_719_0.png)'
  merge: -1
  img_proc: true
- pgno: 720
  md: '# IP地址——专用IP地址


    全局IP地址用于因特网——公共主机；

    专用IP地址仅用于组织的专用网内部——本地主机。


    公共主机和本地主机可以共存于同一网络和进行互访；

    本地主机必须经网络地址迁移服务器（NAT）或代理服务器（Proxy）才能访问因特网。


    ![](img/0761188ee01704e55ea71e6a97539d38_720_0.png)'
