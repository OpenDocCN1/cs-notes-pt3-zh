- pgno: 61
  md: '# 信道的极限容量


    +   - 任何实际的信道都不是理想的，在传输信号时会产生各种失真以及带来多种干扰。

    +   - 码元传输的速率越高，或信号传输的距离越远，在信道的输出端的波形的失真就越严重。


    ![](img/0761188ee01704e55ea71e6a97539d38_61_0.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_61_1.png)'
  merge: -1
