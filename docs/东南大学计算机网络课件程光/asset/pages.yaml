- pgno: 994
  md: '# TCP 的流量控制


    # 利用滑动窗口实现流量控制


    +   - 一般说来，我们总是希望数据传输得更快一些。但如果发送方把数据发送得过快，接收方就可能来不及接收，这就会造成数据的丢失。

    +   - 流量控制(flow control)就是让发送方的发送速率不要太快，既要让接收方来得及接收，也不要使网络发生拥塞。

    +   - 利用滑动窗口机制可以很方便地在 TCP 连接上实现流量控制。'
  merge: -1
  img_proc: true
- pgno: 995
  md: '# 流量控制举例


    A 向 B 发送数据。在连接建立时，

    B 告诉 A: “我的接收窗口 rwnd = 400（字节）”。


    seq = 1, DATA


    A 发送了序号 1 至 100，还能发送 300 字节


    seq = 101, DATA


    A 发送了序号 101 至 200，还能发送 200 字节


    seq = 201, DATA


    丢失！


    ACK = 1, ack = 201, rwnd = 300


    允许 A 发送序号 201 至 500 共 300 字节


    seq = 301, DATA


    A 发送了序号 301 至 400，还能再发送 100 字节新数据


    seq = 401, DATA


    A 发送了序号 401 至 500，不能再发送新数据了


    seq = 201, DATA


    A 超时重传旧的数据，但不能发送新的数据


    ACK = 1, ack = 501, rwnd = 100


    允许 A 发送序号 501 至 600 共 100 字节


    seq = 501, DATA


    A 发送了序号 501 至 600，不能再发送了


    ACK = 1, ack = 601, rwnd = 0


    不允许 A 再发送（到序号 600 为止的数据都收到了）'
  merge: -1
  img_proc: true
- pgno: 996
  md: '# 持续计时器

    (persistence timer)。


    +   - TCP 为每一个连接设有一个持续计时器。

    +   - 只要 TCP 连接的一方收到对方的零窗口通知，就启动持续计时器。

    +   - 若持续计时器设置的时间到期，就发送一个零窗口探测报文段（仅携带 1 字节的数据），而对方就在确认这个探测报文段时给出了现在的窗口值。

    +   - 若窗口仍然是零，则收到这个报文段的一方就重新设置持续计时器。

    +   - 若窗口不是零，则死锁的僵局就可以打破了。'
  merge: -1
  img_proc: true
- pgno: 997
  md: '# 几种拥塞控制方法


    # 1. 慢开始和拥塞避免


    +   - 发送方维持一个叫做拥塞窗口 cwnd (congestion window)的状态变量。拥塞窗口的大小取决于网络的拥塞程度，并且动态地在变化。发送方让自己的发送窗口等于拥塞窗口。如再考虑到接收方的接收能力，则发送窗口还可能小于拥塞窗口。

    +   - 发送方控制拥塞窗口的原则是：只要网络没有出现拥塞，拥塞窗口就再增大一些，以便把更多的分组发送出去。但只要网络出现拥塞，拥塞窗口就减小一些，以减少注入到网络中的分组数。'
  merge: -1
  img_proc: true
- pgno: 998
  md: '# 慢开始算法的原理


    +   - 在主机刚刚开始发送报文段时可先设置拥塞窗口 cwnd = 1，即设置为一个最大报文段 MSS 的数值。

    +   - 在每收到一个对新的报文段的确认后，将拥塞窗口加 1，即增加一个 MSS 的数值。

    +   - 用这样的方法逐步增大发送端的拥塞窗口 cwnd，可以使分组注入到网络的速率更加合理。'
  merge: -1
  img_proc: true
- pgno: 999
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1000
  md: '# 传输轮次

    (transmission round)


    +   - 使用慢开始算法后，每经过一个**传输轮次**，拥塞窗口 cwnd 就加倍。

    +   - 一个传输轮次所经历的时间其实就是往返时间 RTT。

    +   - “**传输轮次**”更加强调：把拥塞窗口 cwnd 所允许发送的报文段都连续发送出去，并收到了对已发送的最后一个字节的确认。

    +   - 例如，拥塞窗口 cwnd = 4，这时的往返时间 RTT 就是发送方连续发送 4 个报文段，并收到这 4 个报文段的确认，总共经历的时间。


    ![](img/0761188ee01704e55ea71e6a97539d38_1000_0.png)'
  merge: -1
  img_proc: true
- pgno: 1001
  md: '# 设置慢开始门限状态变量

    ssthresh


    +   - 慢开始门限 ssthresh 的用法如下：

    +   - 当 cwnd < ssthresh 时，使用慢开始算法。

    +   - 当 cwnd > ssthresh 时，停止使用慢开始算法而改用拥塞避免算法。

    +   - 当 cwnd = ssthresh 时，既可使用慢开始算法，也可使用拥塞避免算法。

    +   - 拥塞避免算法的思路是让拥塞窗口 cwnd 缓慢地增大，即每经过一个往返时间 RTT 就把发送方的拥塞窗口 cwnd 加 1，而不是加倍，使拥塞窗口
    cwnd 按线性规律缓慢增长。'
  merge: -1
  img_proc: true
