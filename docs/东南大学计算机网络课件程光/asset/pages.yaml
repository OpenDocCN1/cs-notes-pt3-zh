- pgno: 828
  md: '# OSPF 的其他特点


    +   - OSPF 还规定每隔一段时间，如 30 分钟，要刷新一次数据库中的链路状态。

    +   - 由于一个路由器的链路状态只涉及到与相邻路由器的连通状态，因而与整个互联网的规模并无直接关系。因此当互联网规模很大时，OSPF 协议要比距离向量协议
    RIP 好得多。

    +   - OSPF 没有 “坏消息传播得慢” 的问题，据统计，其响应网络变化的时间小于 100 ms。'
  merge: -1
  img_proc: true
- pgno: 829
  md: '# 指定的路由器

    (designated router)


    +   - 多点接入的局域网采用了指定的路由器的方法，使广播的信息量大大减少。

    +   - 指定的路由器代表该局域网上所有的链路向连接到该网络上的各路由器发送状态信息。


    ![](img/0761188ee01704e55ea71e6a97539d38_829_0.png)'
  merge: -1
  img_proc: true
- pgno: 830
  md: '# 外部网关协议 BGP


    +   - BGP 是不同自治系统的路由器之间交换路由信息的协议。

    +   - BGP 较新版本是 2006 年 1 月发表的 BGP-4（BGP 第 4 个版本），即 RFC 4271～4278。

    +   - 可以将 BGP-4 简写为 BGP。'
  merge: -1
  img_proc: true
- pgno: 831
  md: '# BGP 使用的环境却不一


    +   - 因特网的规模太大，使得自治系统之间路由选择非常困难。对于自治系统之间的路由选择，要寻找最佳路由是很不现实的。

    +   - 当一条路径通过几个不同 AS 时，要想对这样的路径计算出有意义的代价是不太可能的。

    +   - 比较合理的做法是在 AS 之间交换“可达性”信息。

    +   - 自治系统之间的路由选择必须考虑有关策略。

    +   - 因此，边界网关协议 BGP 只能是力求寻找一条能够到达目的网络且比较好的路由（不能兜圈子），而并非要寻找一条最佳路由。'
  merge: -1
  img_proc: true
- pgno: 832
  md: '# BGP 发言人

    (BGP speaker)


    +   - 每一个自治系统的管理员要选择至少一个路由器作为该自治系统的“BGP 发言人”。


    +   - 一般说来，两个 BGP 发言人都是通过一个共享网络连接在一起的，而 BGP 发言人往往就是 BGP 边界路由器，但也可以不是 BGP 边界路由器。'
  merge: -1
  img_proc: true
- pgno: 833
  md: '# BGP 交换路由信息


    +   - 一个 BGP 发言人与其它自治系统中的 BGP 发言人要交换路由信息，就要先建立 TCP 连接，然后在此连接上交换 BGP 报文以建立 BGP
    会话(session)，利用 BGP 会话交换路由信息。

    +   - 使用 TCP 连接能提供可靠的服务，也简化了路由选择协议。

    +   - 使用 TCP 连接交换路由信息的两个 BGP 发言人，彼此成为对方的邻站或对等站。'
  merge: -1
