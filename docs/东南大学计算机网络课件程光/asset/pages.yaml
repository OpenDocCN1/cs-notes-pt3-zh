- pgno: 1165
  md: '# 数据源鉴别


    （2）数据源鉴别—鉴别数据真实性（防冒充、伪造）


    确实来自期望的发送方。利用数字签名技术支持数据源的鉴别。


    ![](img/0761188ee01704e55ea71e6a97539d38_1165_0.png)


    # 收方（逆过程）：


    +   1、 用自己的秘密密钥解密获得发方的签名；

    +   2、 用发方的公开密钥解密，获得原始MIC值；

    +   3、 利用MD5对报文求MIC值；

    +   4、 比较如果所求的新MIC值和收到的原始MIC值，一致，可认为报文确实来自于期望的发送方，且在传输过程中内容未被篡改。'
