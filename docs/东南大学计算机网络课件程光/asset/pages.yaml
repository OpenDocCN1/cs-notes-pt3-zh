- pgno: 426
  md: '# 无线局域网 基本服务集 BSS


    包括一个基站和若干个移动站，所有的站在本 BSS 以内都可以直接通信，但在和本 BSS 以外的站通信时，都要通过本 BSS 的基站。


    ![](img/0761188ee01704e55ea71e6a97539d38_426_0.png)'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# 接入点 AP (Access Point)


    基本服务集内的基站（AP），其作用和网桥相似。

    当网络管理员安装 AP 时，必须为该 AP 分配一个不超过 32 字节的服务集标识符 SSID 和一个信道。


    ![](img/0761188ee01704e55ea71e6a97539d38_427_0.png)'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# 扩展的服务集ESS (Extended Service Set)。


    基本服务集可以通过接入点 AP连接到一个主干分配系统 DS（Distribution System），然后再接入到另一个基本服务集，构成扩展的服务集。


    ![](img/0761188ee01704e55ea71e6a97539d38_428_0.png)'
  merge: -1
  img_proc: true
- pgno: 429
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 430
  md: '# 移动站漫游


    移动站 A 从某一个基本服务集漫游到另一个基本服务集（到 A'' 的位置），仍可保持与另一个移动站 B 进行通信。


    ![](img/0761188ee01704e55ea71e6a97539d38_430_0.png)'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 与接入点 AP建立关联(association)


    +   - 一个移动站若要加入到一个基本服务集 BSS，就必须先选择一个接入点 AP，并与此接入点建立关联。

    +   - 建立关联就表示这个移动站加入了选定的 AP 所属的子网，并和这个 AP 之间创建了一个虚拟线路。

    +   - 只有关联的 AP 才向该移动站发送数据帧，而该移动站也只有通过关联的 AP 才能向其他站点发送数据帧。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# 移动站与 AP 建立关联的方法


    +   - **被动扫描**，即移动站等候接收接入站周期性发出的**信标帧**（beacon frame）。信标帧中包含有若干系统参数（如服务集标识符 SSID
    以及支持的速率等）。

    +   - **主动扫描**，即移动站主动发出**探测请求帧**（probe request frame），然后等待从 AP 发回的**探测响应帧**（probe
    response frame）。'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# 热点(hot spot)


    +   - 现在许多地方，如办公室、机场、快餐店、旅馆、购物中心等都能够向公众提供有偿或无偿接入 Wi-Fi 的服务。这样的地点就叫做热点。

    +   - 由许多热点和 AP 连接起来的区域叫做热区(hot zone)。热点也就是公众无线入网点。

    +   - 无线因特网服务提供者 WISP (Wireless Internet Service Provider)。用户可以通过无线信道接入到 WISP，然后再经过无线信道接入到因特网。'
  merge: -1
