- pgno: 305
  md: '# 总线局域网


    # 总线网结构


    所有的结点通过专门的网卡附接到一条总线上；


    所有结点的信息都发送到同一条总线上（冲突）；


    所有结点都从同一媒体上收取信息（广播）；


    为了防止信号反射，总线的两端采用终接器，吸收信号；


    采用分布式方式进行工作，结点之间不存在控制的关系。


    ![](img/0761188ee01704e55ea71e6a97539d38_305_0.png)


    竞争总线工作方式；


    结果：冲突难以避免；


    解决方案：载波侦听多路访问/冲突检测（CSMA/CD）'
  merge: -1
  img_proc: true
