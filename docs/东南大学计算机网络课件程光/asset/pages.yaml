- pgno: 397
  md: '# # 令牌环的MAC帧格式说明


    | SD | AC | FC | DA | SA | DATA | FCS | ED | FS |

    |---|---|---|---|---|---|---|---|---|

    | 1 | 1 | 1 | 2 | 2 | 0–N | 4 | 1 | 1 |


    # • 帧开始/结束标志（SD/ED）：


    帧的开始： JK0JK000 和结束： JK1JK11E


    # E位（差错标志）：


    由RPU置位，RPU在转发每个帧的同时，也执行差错校验动作，并利用RPU具有的一位延迟来置位差错标志。


    ![](img/0761188ee01704e55ea71e6a97539d38_397_0.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# 令牌环的MAC帧格式说明


    | 1 | 1 | 1 | 2 | 2 | 0−N | 4 | 1 | 1 |

    |---|---|---|---|---|---|---|---|---|

    | SD | **AC** | *FC* | DA | SA | DATA | FCS | ED | *FS* |


    AC字段分解：


    | Pr | T | M | Rr |

    |---|---|---|---|


    +   - **访问控制字段（AC）：**

    +     - **Pr/Rr：** 本帧优先级和预定优先级。

    +     - **T：** 令牌标识，`T=0`时，令牌帧；`T=1`时，信息帧。

    +     - **M：** 监视位，由环路中的监视器填写。

    +       - 发送结点发送该帧（或令牌）时，M置为0；

    +       - 当该帧经过监视器时，监视器将该位置为1；

    +       - 如果监视器发现监视位已经被置为1，则认为发送结点出了故障，未能按规定撤出该帧，此时监视器负责撤出该帧，并发出令牌帧。'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 令牌环的MAC帧格式说明


    | 1 | 1 | 1 | 2 | 2 | 0-N | 4 | 1 | 1 |

    |---|---|---|---|---|---|---|---|---|

    | SD | AC | FC | DA | SA | DATA | FCS | ED | FS |


    +   - 帧控制字段（FC）：格式为“FFzzzzzz”，

    +     FF：帧的种类，FF=00，MAC控制帧；

    +     FF=10，管理帧。

    +     FF=01，数据帧，


    +   - 帧状态标志（FS），格式为“ACxxACxx”，

    +     由发送方复位和接收方置位，表示帧的收取状况，

    +     A：地址确认位，由接收方置位，表示帧中的宿地址正确；

    +     C：信息复制位，由接收方置位，表示此帧已被接收方正确复制。

    +     Xx：保留未用。'
