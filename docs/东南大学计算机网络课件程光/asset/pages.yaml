  md: '# 6.5 网络互连部件—路由器


    # （1）原理


    网桥的限制：仅适合低二层有差异的网络互连；


    目的：互连两个或多个独立的同构或异构的网络，

    如局域网/广域网、局域网/局域网的互连；


    过程：分组的封装和转发，屏蔽3层以下的差异，

    OSI网络层的主要功能：路由选择—路由器；


    # 路由器的体系结构：


    ![](img/0761188ee01704e55ea71e6a97539d38_595_0.png)'
  merge: -1
  img_proc: true
- pgno: 596
  md: "# （2）路由器的主要功能\n\n+   ★ **寻址**：全网地址格式统一，如IP地址；\n+   \n+   ★ **路由选择**：了解互连的子网工作状态，旁路故障和防止拥塞；\n\
    +   \n+   ★ **分组分段/合段**：根据子网的分组长度要求，进行分组的分段和合段；\n+   \n+   ★ **格式封装**：构建适合子网传输和处理的分组；\n\
    +   \n+   ★ **存储—转发（分组过滤）**：分组校验（丢弃出错的分组）、存储和转发。\n\n路由器功能主要由软件完成，效率较低，高性能的路由器具有高的价格。"
  merge: -1
  img_proc: true
