  md: '# 信道与信息类型匹配问题：


    ![](img/0761188ee01704e55ea71e6a97539d38_1241_0.png)


    调制/解调(Modem)的方法：调幅、调频、调相，以及组合调制；


    比特速率 = 码元速率 * log₂N    /*N：码元蕴含的信息量


    （比特率）       （波特率）


    使得低带宽线路支持较高速比特流传输。


    编码/解码(Codec)的方法：采样、量化、编码；


    若语音频率<4KHz，采样频率8KHz，256量化级，8位编码，则不失真速率64Kbps；


    结论：计算机发送端口发出的数字信号最终可传递到接收端口。'
  merge: -1
