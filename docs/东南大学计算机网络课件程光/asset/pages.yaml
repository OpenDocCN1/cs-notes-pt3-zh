- pgno: 789
  md: '# 因特网的路由选择协议

    有关路由选择协议的几个基本概念


    # 1. 理想的路由算法


    +   - 算法必须正确的和完整的。

    +   - 算法在计算上应简单。

    +   - 算法应能适应通信量和网络拓扑的变化，这就是说，要有自适应性。

    +   - 算法应具有稳定性。

    +   - 算法应是公平的。

    +   - 算法应是最佳的。'
  merge: -1
  img_proc: true
- pgno: 790
  md: '# 关于“最佳路由”


    +   - 不存在一种绝对的最佳路由算法。

    +   - 所谓“最佳”只能是相对于某一种特定要求下得出的较为合理的选择而已。

    +   - 实际的路由选择算法，应尽可能接近于理想的算法。

    +   - 路由选择是个非常复杂的问题

    +     - 它是网络中的所有结点共同协调工作的结果。

    +     - 路由选择的环境往往是不断变化的，而这种变化有时无法事先知道。'
  merge: -1
  img_proc: true
- pgno: 791
  md: '# 从路由算法的自适应性考虑


    +   - 静态路由选择策略——即非自适应路由选择，其特点是简单和开销较小，但不能及时适应网络状态的变化。

    +   - 动态路由选择策略——即自适应路由选择，其特点是能较好地适应网络状态的变化，但实现起来较为复杂，开销也比较大。'
  merge: -1
  img_proc: true
- pgno: 792
  md: '# 2. 分层次的路由选择协议


    +   - 因特网采用分层次的路由选择协议。

    +   - 因特网的规模非常大。如果让所有的路由器知道所有的网络应怎样到达，则这种路由表将非常大，处理起来也太花时间。而所有这些路由器之间交换路由信息所需的带宽就会使因特网的通信链路饱和。

    +   - 许多单位不愿外界了解自己单位网络的布局细节和本部门所采用的路由选择协议（这属于本部门内部的事情），但同时还希望连接到因特网上。'
  merge: -1
  img_proc: true
- pgno: 793
  md: '# 自治系统 AS

    (Autonomous System)


    +   - 自治系统 AS 的定义：在单一的技术管理下的一组路由器，而这些路由器使用一种 AS 内部的路由选择协议和共同的度量以确定分组在该 AS 内的路由，同时还使用一种
    AS 之间的路由选择协议用以确定分组在 AS 之间的路由。

    +   - 现在对自治系统 AS 的定义是强调下面的事实：尽管一个 AS 使用了多种内部路由选择协议和度量，但重要的是一个 AS 对其他 AS 表现出的是一个**单一的**和**一致的**路由选择策略。'
  merge: -1
  img_proc: true
- pgno: 794
  md: '# 因特网有两大类路由选择协议


    +   - 内部网关协议 IGP (Interior Gateway Protocol) 即在一个自治系统内部使用的路由选择协议。目前这类路由选择协议使用得最多，如
    RIP 和 OSPF 协议。


    +   - 外部网关协议 EGP (External Gateway Protocol) 若源站和目的站处在不同的自治系统中，当数据报传到一个自治系统的边界时，就需要使用一种协议将路由选择信息传递到另一个自治系统中。这样的协议就是外部网关协议
    EGP。在外部网关协议中目前使用最多的是 BGP-4。'
  merge: -1
  img_proc: true
