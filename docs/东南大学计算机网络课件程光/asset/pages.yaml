  md: '# 通信协议的基本概念


    # ☆进程间通信


    各进程间相互制约的**等待**或**互通消息**


    # **同一系统**：


    共享内存、共享缓冲区、共享文件

    等待方式、并行方式


    ![](img/0761188ee01704e55ea71e6a97539d38_36_0.png)


    # **不同系统之间**：


    两台计算机之间的进程通信

    通过网络，越过通信链路


    ![](img/0761188ee01704e55ea71e6a97539d38_36_1.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 通信协议的基本概念


    # 网络通信的基本结构：


    通信接口程序


    负责将计算机信息传输到线路上；从线路上接收信息并传送给计算机。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 通信协议的基本概念


    # 网络通信的基本结构：


    ![](img/0761188ee01704e55ea71e6a97539d38_38_0.png)


    # 网络控制程序（NCP）：


    +   - 负责控制和监视进程使用网络资源的情况

    +   - 具有建立通信链路、分配存储器、控制计算机与网络之间信息流的功能。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 通信协议的基本概念


    通信接口：


    为两个系统的设备和部件之间连接服务的，


    包括四个方面：


    +   - 物理方面（接口有多少个插脚）


    +   - 电气方面（电路信号的电压大小、以及与时间的关系）


    +   - 逻辑方面（语法上）：说明数据流如何通过接口“流”到线路上，如何控制等。


    +   - 过程方面：说明数据流穿入接口时的命令、顺序、控制信息的内容等。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 通信协议的基本概念


    # 网络通信协议：

    一组约定和规则的集合


    通信的两个实体在通信内容、通信方式、以及通信时序等方面，要遵从相互可以接收的协议（相同或兼容的协议）。


