- pgno: 1158
  md: '# 加密算法的混合使用


    特点：


    （1）秘密密钥加密体制和公开密钥加密体制的结合使用，简化了秘密密钥加密体制中的密钥管理；密钥和密文一同传输，以便对方可以解密。


    （2）能够做到对应每个明文使用一个不同的密钥（即一次一钥）；由于每个密钥仅仅使用一次，即使在某一次传输中密钥不慎泄露，它也只影响本次交换的信息。


    （3）使用DES算法和一次密钥对明文加密，提高效率；


    （4）使用RSA算法对密钥加密，保护密钥的秘密性；


    加密技术可用于提供网络安全中的内容保密服务。'
