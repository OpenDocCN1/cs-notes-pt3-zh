- pgno: 1140
  md: '# 数据加密、解密技术


    # 传统加密算法：


    仅采用代换和置换（包括多重使用）的加密技术。


    代换：用一组(个)符号(字符)替换另一(组)个符号(字符)，改变明文内容的表示形式，但内容元素之间的相对位置保持不变。


    置换：依据某种规则变换明文信息的顺序，改变明文内容元素的相对位置，但保持内容的表现形式不变。


    例： AB （01000001 01000010）

    循环右移4位（或左右4位交换） ↓

    （控制字符） $ （00010100 00100100）'
