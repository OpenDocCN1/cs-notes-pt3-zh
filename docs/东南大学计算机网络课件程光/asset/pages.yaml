- pgno: 1246
  md: '# 噪声对传输的影响及其解决方法：


    ![](img/0761188ee01704e55ea71e6a97539d38_1246_0.png)


    噪声（包括信道本身的衰减）可能导致数据传输出错；


    解决方法：发方发送具有特定编码规则的差错校验码，收方根据规则检验接受数据的正确性。


    常用算法：反馈重传法（停等协议、滑动窗口协议）。


    差错校验码（检错码）= 信息字段 + 校验字段；


    水平奇/偶校验码、垂直奇/偶校验码、

    水平垂直奇/偶校验码、循环校验码（CRC，位数/形成原理）。


    > g(x) 决定校验字段的长度。


    ![](img/0761188ee01704e55ea71e6a97539d38_1246_1.png)'
  merge: -1
  img_proc: true
- pgno: 1247
  md: '# 媒体利用率：


    ![](img/0761188ee01704e55ea71e6a97539d38_1247_0.png)


    为了提升媒体的利用率，当媒体的传输能力超过用户要求的传输率时，可以使用**多路复用**技术，支持多路信号共用信道。


    +   - 基于模拟信道的**频分**多路复用（不同频段对应不同路信号）；

    +   - 基于数字信道的**时分**多路复用（不同时间片对应不同路信号）；

    +   - 基于光纤信道的**波分**多路复用（不同波长对应不同路信号）；

    +   - 多路复用均采用静态分配信道的方法，要求双方严格同步。

    +   - 多路复用的实例为 **T1（24路*64Kb）** 和 **E1（32路*64Kb）**；


    **集中传输**（按需分配子信道）：将上述的频段/时间片/波长动态分配给需要的用户对，进一步提升信道利用率；


    +   - 要求附加信息以便区分不同路的信号；

    +   - 要求缓存能力以防多用户数据超载时的数据丢失；'
  merge: -1
  img_proc: true
- pgno: 1248
  md: '# 信息在计算机之间的交换——受控于协议（传输控制规程）


    ![](img/0761188ee01704e55ea71e6a97539d38_1248_0.png)


    **字符型**传输控制规程：支持任意字符数据的传输；

    利用控制字符（组）体现数据的逻辑性，控制双方的数据交换；

    假“控制字符”的处理（转义）：DLE字符填充；

    **停等**协议支持数据的交换。


    **比特型**传输控制规程（HDLC）：支持任意比特数据的传输；

    通过交换不同类型的帧来控制双方的数据交换；

    假“帧限定符（01111110）”的处理：**0比特插入**；

    **窗口**机制（**Ns和Nr**）和**捎带应答**的应用提升数据交换的效率。


    +   - 发方可以连续发送若干数据帧（Ns区分不同帧）；

    +   - 收方可以一次性确认若干帧（Nr标识其前的所有帧被收妥）；

    +   - 收方可在数据帧中借助于Nr对接受的帧进行确认（捎带应答）；

    +   - 可**连续发送（无需确认）**的帧数取决于Ns和Nr的可取值数 $2^n-1$。'
  merge: -1
  img_proc: true
- pgno: 1249
  md: '# 数据交换方式：


    限于媒体的长度和成本限制，为容纳更多的用户，实际通信采用多点接续方式，中间节点执行数据交换的过程。


    线路交换：建立线路、占用线路并传输数据、释放线路；

    特点：独占线路，线路的利用率较低；实时性好，传输延迟小；

    不提供缓存，数据透明传输；双方自行解决速率匹配。


    报文交换：存储一排队一转发报文；

    特点：结点具有缓存能力，暂存用户报文等待线路空闲；

    无线路建立过程，改善线路利用率；结点可执行数据格式转换和差错检测，方便接收站点的收取。

    报文体积可变，磁盘读取影响速度。


    分组交换：类同固定长度的报文交换；

    特点：除报文交换的优点外，更可因分组体积固定而利用高速缓存。


    分组流交换方式：数据报（面向无连接）、虚电路（面向连接）。


    ![](img/0761188ee01704e55ea71e6a97539d38_1249_0.png)'
  merge: -1
  img_proc: true
- pgno: 1250
  md: '# 针对多厂商/多用户的趋势—标准化—OSI/RM:


    采用层次化的思想构建计算机网络体系,以标准化来支持其开放；从问题分解的角度，提出7层模型（功能及其支撑技术）：


    +   物理层，确定物理设备接口，提供点—点比特流传输物理链路；

    +   数据链路层，利用差错处理技术，提供高可靠传输的数据链路；

    +   网络层，利用路由技术，实现用户数据的端—端传输；

    +   运输层，屏蔽通信子网差异，及用户要求和网络服务之间差异；

    +   会话层，提供控制会话和数据传输的手段；

    +   表示层，解决异种系统间的信息表示问题，屏蔽数据表示差异；

    +   应用层，利用下层服务，支持各种应用要求（如FTAM等）。


    分层导致了层间通信的问题：


    +   对等层间通信、相邻层间通信，两者间的关系（目的和手段）；

    +   只有执行相同协议的对等层实体之间才能进行有意义的通信；

    +   数据单元的形成，层层封装，通信的有效率下降；


    OSI实现的基本原理/方法：设计虚拟模型（如：协议），实现虚/实映射（如：数据/协议负载）。'
  merge: -1
  img_proc: true
