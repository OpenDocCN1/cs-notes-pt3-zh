  md: '# ★ 工作过程（接收）


    （类似802.3标准）


    **差异：**

    增加了**确认帧**（ACK帧）和等待ACK帧（9.6us），超时重发；


    利用**ACK帧**来保证传输的有效性。


    定义了**帧间间隔**（不能连续发数据，需等待一个时间间隔，保证ACK帧传输）。


    ![](img/0761188ee01704e55ea71e6a97539d38_326_0.png)'
  merge: -1
