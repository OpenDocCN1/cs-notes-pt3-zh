- pgno: 673
  md: '# 子网掩码(subnet mask)


    +   - 子网掩码是一个网络或一个子网的重要属性。

    +   - 路由器在和相邻路由器交换路由信息时，必须把自己所在网络（或子网）的子网掩码告诉相邻路由器。

    +   - 路由器的路由表中的每一个项目，除了要给出目的网络地址外，还必须同时给出该网络的子网掩码。

    +   - 若一个路由器连接在两个子网上就拥有两个网络地址和两个子网掩码。'
  merge: -1
  img_proc: true
