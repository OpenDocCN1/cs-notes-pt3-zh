- pgno: 110
  md: '# 常用检错码


    检错码是差错检测的**核心**。


    检错码＝信息字段＋校验字段（冗余字段）


    校验字段和信息字段之间存在相关性、**联动性**；校验字段越长，编码检错能力越强，编/解码设施越复杂；


    附加的冗余信息在整个编码中所占的比例越大，传输的有效成分越低。


    **传输顺序**：信息字段在前，校验字段在后。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 奇/偶校验码


    奇/偶校验码的校验字段仅占1个比特（1位，校验位）。


    # (1) 水平奇/偶校验码 （可发现奇位错）


    校验位的取值应使整个码字(包括校验位)中为“1”的比特个数为奇(偶)数。


    例: 传输信息段的校验码加在信息字段之后传输


    ```

    0110001   01100010   01100011

    ```


    编码效率: Q/(Q+1) （信息字段占Q个比特）


    异步传输方式中采用偶校验，

    同步传输方式中采用奇校验。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 奇/偶校验码


    # (2) 垂直奇/偶校验码 （可发现有限位错）


    将被传输的信息进行分组，


    每个分组（字符）的相同位进行奇/偶校验


    如：4行7列信息组的垂直奇/偶校验码。


    信息组： 0111001

    0010101

    0101011

    1010101


    垂直奇校验字符 0101101


