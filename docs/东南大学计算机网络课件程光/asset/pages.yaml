- pgno: 1256
  md: '# 网络安全—数据传输过程中的安全技术：


    支撑技术：


    +   > 数据加密（算法公开，密钥保密）—M = Dₚ（Eₖ（M））；

    +   > 秘密密钥加密体系（P=K）：加密速度快，维护密钥多；

    +   > 公开密钥加密体系（P≠K）：加密速度慢，维护密钥少；


    +   > 摘录（散列）技术：形成与被保护数据密切相关的摘录值；


    可能的攻击及防范措施：利用加密和摘录完成保护。


    | 攻击 | 攻击防范措施 | 附件 |

    |---|---|---|

    | 窃取 | 加密 | 一次一密（随机会话密钥，公钥保护/KDC） |

    | 篡改 | 完整性检查 | 摘录技术（数字签名） |

    | 重播 | 完整性检查 | 序号+摘录（数字签名） |

    | 伪造 | 数据源鉴别 | 摘录+秘密密钥加密（数字签名） |

    | 假冒 | 实体身份鉴别 | 随机数+摘录（防认证信息窃取） |

    | 否认 | C A | 防发方否认（数字签名），收方否认（第三方） |


    其它防范：


    +   防火墙—阻止非法入侵；

    +   位置：本地网对外的接口处；

    +   技术：分组过滤、代理服务、地址迁移（NAT）。


    访问控制—基于角色的访问控制（用户—角色—权限）。（完）'
  merge: -1
  img_proc: true
