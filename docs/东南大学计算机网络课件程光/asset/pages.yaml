- pgno: 562
  md: '# 第六章　网络互连


    # （1）网络互连的目的


    将两个或者两个以上具有独立自治能力的计算机网络连接起来，实现数据流通，扩大资源共享范围，或者容纳更多用户。


    网络互连包括同构网络、异构网络的互连，局域网与局域网（LAN/LAN）的互连、局域网与广域网（LAN/WAN）、局域网经广域网的互连。'
  merge: -1
  img_proc: true
- pgno: 563
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 564
  md: '# （3）网络互连通信的可能问题


    互连的网络要能够进行通信，须解决网络之间的差异：


    +   - 不同的寻址方案

    +   - 不同的最大分组长度

    +   - 不同的超时控制

    +   - 不同的差错恢复方法

    +   - 不同的状态报告方法

    +   - 不同的服务（面向连接服务和无连接服务）

    +   - 不同的管理与控制方式，等等'
  merge: -1
  img_proc: true
