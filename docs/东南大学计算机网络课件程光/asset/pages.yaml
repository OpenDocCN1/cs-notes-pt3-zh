- pgno: 1159
  md: '# 摘要技术—也称散列技术


    原理：对报文进行某种运算，形成与报文密切相关、且长度有限的摘要值，有时也称为报文的指纹（Fingerprint）;


    要求：不同内容的报文形成相同摘要值的概率几乎为零；

    根据摘要值无法还原原报文；


    典型的摘要算法：


    CRC校验算法—利用该算法可检测传输过程中产生的差错；

    采用不同的产生式可以形成特定长度的校验和；


    +   报文摘要算法（MD2）—RFC1319，产生128位的摘要值；

    +   报文摘要算法（MD4）—RFC1320，产生128位的摘要值；

    +   报文摘要算法（MD5）—RFC1321，产生128位的摘要值；

    +   完全散列算法（SHA-1）—RFC2202

    +   产生160位的摘要值，1997年9月。


    摘要技术可用于提供网络安全中的内容完整性服务。'
  merge: -1
  img_proc: true
- pgno: 1160
  md: "# ② 摘录技术—**MD5**（Message Digest v5）算法，**RFC1321**\n\n作者：**MIT的R. Rivest**；思路：摘录值应与每个比特相关；\n\
    \n# 基本算法：\n\n+   ➢ 信息摘录长度为128比特（4个字），记为d0、d1、d2、d3；\n+   \n+   ➢ 报文填充，使得是报文长度为512b的整数倍；（要增加64b，指出原始信息长度）\n\
    +   \n+   ➢ 分块（512b = 16个字），记为m0、m1、...、m15；\n+   \n+   ➢ 每块处理含四遍扫描，每遍对d0,d1,d2,d3使用不同的扰乱函数和移位操作进行计算；\n\
    +   \n+   ➢ 处理前（包括初值）/后的信息摘录的相加成为下一块处理时信息摘录的当前值；最后一块信息处理之后的信息摘录当前值即为最终的信息摘录值（结果）。"
  merge: -1
  img_proc: true
- pgno: 1161
  md: "# MD5算法：\n\n```\nMD5（M，MIC）\n\n报文补充长度字段，分块，不足部分填充；\n// 确保待处理报文长度为512b的整数倍；\n\
    赋摘要初值： d0 = 01234567 h，d1 = 89abcdef h，\n              d2 = fedcba98 h，d3 = 76543210\
    \ h；\nWhile 报文未处理完 do {\n    取数据块（512b），填入m0...m15；\n    第一遍扰乱和移位；\n    第二遍扰乱和移位；\n\
    \    第三遍扰乱和移位；\n    第四遍扰乱和移位；  }\n\nMIC ←d0, d1, d2, d3;\n//输出结果。\n```"
  merge: -1
  img_proc: true
- pgno: 1162
  md: '# 内容完整性检查


    内容完整性—直接采用摘录技术对报文处理。


    工作过程：


    +   1、发送方利用摘录算法（如MD5）形成摘录值(MIC)


    +   2、报文连同MIC值一起传递给接收方；


    +   3、接收方分离报文和MIC值；


    +   4、对报文执行相同的摘录算法，形成新的MIC值；


    +   5、新MIC值和原MIC值比较，判断报文在传输的过程中是否被修改。


    ![](img/0761188ee01704e55ea71e6a97539d38_1162_0.png)'
  merge: -1
  img_proc: true
- pgno: 1163
  md: '# 身份鉴别


    序列完整性—在报文中增加序号和时标；


    实体鉴别：含身份鉴别和数据源鉴别。


    （1）身份鉴别—鉴别对等实体的身份。


    进入系统时传递用户标识和口令字，和系统内保留的用户标识和口令字进行比较，验证用户的合法性。


    问题：传递过程中，用户标识和口令字被窃取；用户标识和口令字加密传输？仍然存在冒用的可能！


    解决方法：口令字不在线路上传输（两次握手）。


    用户

    系统

    用户标识 → 随机数

    ←

    MD5（随机数+口令字） → 比较判断？


    结果：随机数可以蕴含时间信息；口令字始终不在线路上传输；摘要值随随机数和口令字而变，仅一次有效。'
  merge: -1
  img_proc: true
