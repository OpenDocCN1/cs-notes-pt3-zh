- pgno: 150
  md: '# 时分多路复用


    **典型应用：** 使用时分多路复用技术来支持语音信号的传输


    **T1系统（北美）：** 24路/帧、8bit/路、帧/125微秒，\n帧长度：24×8=192bit＋1（同步位），\n传输速率：193/125微秒=1.544Mbps（1.536Mbps）


