- pgno: 182
  md: '# 基于路径的路由选择算法


    核心算法—Dijkstra最短路径优先算法：

    对于给定结点和边权（距离）的图，一定可以找出两个结点之间的最短路径。


    | | A | D=2 | C=7 | B=8 | F=10 | E=5 |

    |---|---|---|---|---|---|---|

    | A | 0 | 0 | 0 | 0 | 0 | 0 |

    | B | 6 | 4 | 4 | 4 | 4 | 4 |

    | C | 3 | 3 | 3 | 3 | 3 | 3 |

    | D | 2 | 2 | 2 | 2 | 2 | 2 |

    | E | ∞ | ∞ | ∞ | 12 | 12 | 12 |

    | F | ∞ | ∞ | 10 | 10 | 10 | 10 |

    | G | ∞ | 22 | 22 | 22 | 20 | 17 |


    ![](img/0761188ee01704e55ea71e6a97539d38_182_0.png)


