  md: '# ★ 子网掩码地址（subnet mask address）


    目的：缩小子网的地址分配空间，减少地址浪费。


    方法：将Hostid的一部分作为网络Netid的延伸；


    掩码地址的格式：前N位1+后M位0；（N+M=32）


    掩码地址“与”IP 地址 = 对应子网的“实际网络地址”。


