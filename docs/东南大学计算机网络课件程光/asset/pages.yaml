- pgno: 1099
  md: '# 2. 动态万维网文档


    +   - 静态文档是指该文档创作完毕后就存放在万维网服务器中，在被用户浏览的过程中，内容不会改变。

    +   - 动态文档是指文档的内容是在浏览器访问万维网服务器时才由应用程序动态创建。

    +   - 动态文档和静态文档之间的主要差别体现在服务器一端。这主要是文档内容的生成方法不同。而从浏览器的角度看，这两种文档并没有区别。'
  merge: -1
  img_proc: true
