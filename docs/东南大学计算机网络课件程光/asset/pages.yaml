- pgno: 469
  md: '# 三代数字传送网


    # 第一代：T1/E1系统


    +   - 设计目标：支持话音业务，非按需带宽分配（BOD），静态分配

    +   - 复用交换：TDM/E/E/E，（接收电信号（E）/处理电信号（E）/发送电信号（E））

    +   - 传输媒体：铜缆（20世纪60年代）

    +   - 传输容量：Mbit/s

    +   - 载荷特征：固定长度

    +   - 网络协议：无'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# 三代数字传送网


    # 第二代： SONET/SDH（同步光纤网络/同步数字系列）


    +   - 设计目标：支持语音业务，非按需带宽分配（BOD），静态分配

    +   - 复用交换：TDM/O/E/O（接收光信号（O）/将光信号变成电信号以便处理（E）/将电信号变成光信号发送出去（O））

    +   - 传输媒体：铜缆、光纤（20世纪80年代）

    +   - 传输容量：Gbit/s

    +   - 载荷特征：固定长度

    +   - 网络协议：部分协议，如PPP， IP， ATM'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# 三代数字传送网


    # 第三代：OTN（光传送网）


    +   - 设计目标：支持语音、图像和数据业务、支持可剪裁的 QOS、按需带宽分配（BOD），动态分配

    +   - 复用交换：WDM/O/O/O，

    +     （全光通信方式，无需进行光电转换）

    +   - 传输媒体：光纤（20世纪90年代末—本世纪初）

    +   - 传输容量：Tbit/s

    +   - 载荷特征：固定和可变长度

    +   - 网络协议：众多协议，如PPP，IP，ATM，MPLS（多协议标签交换），等'
  merge: -1
  img_proc: true
