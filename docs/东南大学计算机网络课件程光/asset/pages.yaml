- pgno: 156
  md: '# 集中传输


    对多路复用技术的进一步提高和改进


    *多路复用的特点：


    各个子信道（频分复用：子频段，时分复用：时间片，波分复用：波长）被静态地分配给多路信号传输，接收方可以直接通过识别固定子频段、时间片或者波长来完成。


    *不足之处：


    信道的利用率不够高，因为信号的传输往往是间断的，在某个时刻，子信道会出现空闲状态（无数据）'
  merge: -1
