- pgno: 332
  md: '# ★以太网的变迁（二）—交换以太网


    集线器的应用使网络性能改进可集中于“一点”；

    80年代末，系列智能型多端口集线器问世；

    90年，Kalpana公司推出EtherSwitch产品；

    共享式集线器向独享端口的交换器发展。将一个端口的输入交换到指定的另一端口，独享端口的带宽。


    ![](img/0761188ee01704e55ea71e6a97539d38_332_0.png)


    # 1、直通（cut-through）


    # 工作原理：


    前14个字节收到后，得知目的地址，直接送往目的端口，


    +   - **优点：** 延迟小（14个字节），交换速度快。

    +   - **缺点：** 无法检测出冲突帧（14字节）和出错帧。


    ![](img/0761188ee01704e55ea71e6a97539d38_332_1.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 3、自适应（直通/存储转发）


    工作原理：


    交换机根据网络的状况自动更换数据交换方式。


    +   * 当网络性能好时，单位时间内出错的帧的概率 ＜ 某个阈值，采用“直通”的交换方式;


    +   * 当网络性能差时，单位时间内出错的帧的概率 ＞ 某个阈值，采用“存储转发”的交换方式;


    +   * 特点：

    +     可以提高交换机的數據交换速率。'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# ★以太网的变迁（三）—全双工以太网


    一般情况下，交换机端口和网卡都是以半双工的工作方式，数据MAC帧的发送和接收不是同时进行的。


    93年，Kalpana公司再次率先推出改进产品—全双工交换器。


    # 全双工方式：


    交换器的端口和网卡都可以同时进行MAC帧的发送和接收


    交换器的端口可以由用户自己设置，10Mbps的端口如果设置成全双工的方式，理论上可达20Mbps的端口速率。


    要求：交换器/网卡，交换器/交换器都必须支持全双工工作。


    ![](img/0761188ee01704e55ea71e6a97539d38_335_0.png)'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# ★以太网的变迁（四）—快速以太网（100Mbps）


    92年起，开始研究更高速的以太网，Grand、Intel、 Cabletron等成立“快速以太网联盟（FEA）”，促进标准：802.3u。


    100 Base-TX：传输编码为4b/5b，2对5类双绞线，100米


    100 Base-FX：传输编码为4b/5b，光纤，10/2公里（单模/多模）


    100 Base-T4：3电平编码，4对3类双绞线，3对线同时传输。


    原理：3电平3对线可有27个状态，表示4位数据（类似4b/5b）；3类线具有25MHz的性能；可使总传输速率达100Mbps。'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# ★以太网的变迁（四）——快速以太网（续）


    # 10/100Mbps自适应——增加自动速度感应功能


    结点要求10/100Mbps自适应网卡支持。


    原理：交换器发送高速链路脉冲（FLP），结点检测FLP，协商和确定可支持的最高交换速度，并进行模式调整：


    支持100Base-T，或者仍以10Base-T模式工作。


    实践表明：使用10/100Mbps自适应，其性能并未有大的改善，


    原因：交换器/结点不停地检测和模式改变，反而影响速度。


    ![](img/0761188ee01704e55ea71e6a97539d38_337_0.png)'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# ★以太网的变迁（五）—千兆位以太网


    95年末，开始研究Gbps以太网，

    标准： 803.3z


    重点： 如何体现冲突检测特性；

    方案： 帧结联、载波扩展，

    增加最短帧的长度。


    传输距离：

    1000Base-Cx，铜线，25英尺

    1000Base-Sx，多模光纤，

    短波（850nm），<300m

    1000Base-Lx，多模光纤，

    长波（1300nm），<550m

    1000Base-T，双绞线，


    应用： 主干网和服务器


    例如： 交换机—交换机， 交换机—服务器（需要1000Mbps网卡）


    ![](img/0761188ee01704e55ea71e6a97539d38_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# ★千兆以太网传输媒介规范


    (1) 1000Base -LX: （长波）


    基于长波（1300nm）的单模光缆标准时，使用8B/10B编码解码方式，最大传输距离为5000米。


    基于长波（1300nm）的多模光纤时，传输距离可达550米；


    (2) 1000Base -SX: 基于短波（780nm）的多模光纤时，使用8B/10B编码解码方式，使用50微米或62.5微米多模光缆，最大传输距离为300米到500米。


    (3) 1000Base -CX: 基于平衡、屏蔽的铜缆（150欧姆），使用8B/10B编码解码方式，最大传输距离为25米，它可以用于机房的互连。'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# ★千兆以太网传输媒介规范


    # (4) 1000Base -T:


    +   - 基于非屏蔽双绞线传输介质，

    +   - 采用一种4B/5B编码，

    +   - 使用1000BASE-T 铜物理层（Copper PHY）编码解码方式，

    +   - 传输距离为100米。


    1000Base-T是专门为在五类双绞线上传送数据而设计的。


    1Gbps的传送速率可以等效地看作在四对双绞线上，每对的传送速率为250Mbps（250Mbps×4=1Gbps）。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# ★千兆以太网的优势


    1000Base-T标准允许将千兆位以太网在5类、超5类、6类UTP双绞线上的传输距离扩展到100米，从而使建筑楼宇内布线的 大部分采用5类UTP双绞线，保障了用户先前对以太网、快速以太网的投资。


    对于网络管理人员来说，也不需要再接受新的培训，凭借已经掌握的以太网网络知识，完全可以对千兆以太网进行管理维护。'
  merge: -1
  img_proc: true
