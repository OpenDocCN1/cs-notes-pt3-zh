- pgno: 99
  md: '# 传输方式


    并行传输： 字符编码的各个比特同时传输


    特点： 一个比特时间内可传输一个字符，传输速度快，每个比特传输要求一个单独的信道支持，通信成本高，远距离传输时，线间干扰导致可靠性下降。


    串行传输 将组成字符的各个比特串行地发往线路


    特点：传输速度低，一次一个比特；通信成本较低，只需一个信道。


    ![](img/0761188ee01704e55ea71e6a97539d38_99_0.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_99_1.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# ★ 传输方式


    ➢ **同步传输**：以多个字符或者多个比特组合成的数据块为单位进行传输，利用独特的**同步模式**来限定数据块，达到同步接收的目的。


    `SYN, SYN, G, H, …, B, A, SYN, D, E, SYN, SYN` → 传输方向


    +   - **发送**：同步符号（起始字符）+ 数据块 + 同步符号（结束字符）

    +   - **接收**：遇到同步符号，开始接收数据，直到结束符号为止。

    +   - **同步符号**：标识数据块的开始和结束

    +   - **可能问题**：假同步现象——数据块中含有与同步符号相同的内容

    +   - **解决方法**：增加匹配同步符号的难度'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# ★传输方式


    # 异步传输


    特点： 字符内部的各个比特采用固定的时间模式，

    每个字符独立传输， 字符之间间隔任意；


    用独特的起始位/终止位来限定每个字符，并同步双方的动作。 传输效率较低。


    ![](img/0761188ee01704e55ea71e6a97539d38_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# ★同步技术


    目的：保证接收方在时间上与发送方取得同步，以便能够正确地识别和接收发送方发来的数据。


    位同步：使接收方可以正确地接收各个比特。


    自同步法：接收方直接从数据波中获取同步信号（曼码）。


    外同步法：发送方在发数据前，先向接收方发一串同步时钟序列，接收方根据这一同步时锁定接收频率。（异步传输的起始/终止位）


    字符同步：使接收方可以正确地识别数据群。


    利用同步传输时的同步字符（SYN），接收方在识别到独特的同步字符或同步模式后，才开始真正的数据接收。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 传输形式


    单工传输：任意时刻只允许向一个方向进行信息传输；


    半双工传输：可以交替改变方向的信息传输，但在任一特定时刻，信息只能向一个方向传输；


    全双工传输：任意时刻信息都可进行双向的信息传输。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 传输差错处理


    目的：保证信息传输的正确性；


    噪声导致差错，无差错处理能力的系统是不可用系统。


    # 方法1：反馈重传法（ARQ）


    +   1. 发送方发送具有检测错误能力的代码（检错码）；

    +   2. 接收方根据代码的编码规则，验证接收到的数据代码，并将结果反馈给发送方（正确接收/接收有错）；

    +   3. 发送方根据反馈的结果决定是否执行重传动作，如果接收方未正确接收，则重传；

    +   4. 在规定的时间内，若未能收到反馈结果（称为超时），则发送方可以认为传输出现差错，进而执行重传动作。（超时重传）'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 停一等协议


    发送一块数据，计时。


    等待接收方的反馈结果，


    如果接到否定确认，


    重新传输本数据块；


    如果收到接收确认，


    继续发送后继块数据；


    如果计时器超时，


    重新传输本数据块。


