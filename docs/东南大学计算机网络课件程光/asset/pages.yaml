- pgno: 1166
  md: '# 抗否认、防抵赖服务


    抗否认服务——抵御通信的一方对所作的操作进行否认（抵赖）。外来攻击或内部攻击；


    理想的解决方案：第三方的参与和仲裁。


    措施：至少维护一个认证中心（CA），合法用户需在中心注册，获得自己的密钥对；CA以安全的方式转发通信双方的报文，并予以记录，作为产生异议时的仲裁依据。


    ![](img/0761188ee01704e55ea71e6a97539d38_1166_0.png)'
  merge: -1
  img_proc: true
- pgno: 1167
  md: '# 抗否认、防抵赖服务


    过程：


    +   1、A以CA的公钥和A的私钥向CA认证自身，并获得B的公钥；

    +   2、A以B的公钥形成密文（容许含随机密钥的秘密加密），并提交CA；

    +   3、CA记录全部或者部分（如MIC值）信息后，转发密文至B；

    +   4、B收取报文后，应向CA返回确认信息。


    ![](img/0761188ee01704e55ea71e6a97539d38_1167_0.png)'
