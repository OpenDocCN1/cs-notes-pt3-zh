- pgno: 1020
  md: '# 发送窗口的上限值


    +   发送方的发送窗口的上限值应当取为接收方窗口 rwnd 和拥塞窗口 cwnd 这两个变量中较小的一个，即应按以下公式确定：


    发送窗口的上限值 = Min [rwnd, cwnd]


    +   当 rwnd < cwnd 时，是接收方的接收能力限制发送窗口的最大值。


    +   当 cwnd < rwnd 时，则是网络的拥塞限制发送窗口的最大值。'
  merge: -1
  img_proc: true
