- pgno: 170
  md: '# 数据报（Datagram）


    分组交换采用了两种不同方法来管理被传输的分组流，数据报，虚电路。


    **数据报：**面向无连接的数据传输，

    **借鉴报文交换的思想，**采用数据报方式传输时，被传输的分组称为数据报


    数据报的前部增加地址信息的字段，网络中的各结点，根据地址信息和一定的路由规则，选择输出端口，暂存和排队数据报，并在传输媒体空闲时，发往相邻结点，直至最终站点。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 虚电路（Virtual Circuit）


    虚电路又被称为面向连接的数据传输，工作过程类似于线路交换，但电路是“虚拟”的。


    物理媒体被理解为由多个子信道（称之为逻辑信道LC）组成，子信道的串接形成虚电路（VC），利用不同的虚电路来支持不同的用户数据的传输


    ![](img/0761188ee01704e55ea71e6a97539d38_171_0.png)


    +   A1——B1虚电路： VC1=LC1（3）+LC2（2）+LC3（1）

    +   A2——C1虚电路： VC2=LC1（2）+LC2（1）+LC4（3）

    +   A3——D1虚电路： VC3=LC1（1）+LC5（4）'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 虚电路（Virtual Circuit）


    虚电路进行数据传输的过程：


    +   - **虚电路建立：** 发送方发送含有地址信息的特定的控制信息块（如：呼叫分组），该信息块途经的每个中间结点根据当前的逻辑信道（LC）使用状况，分配LC，并建立输入和输出LC映射表，所有中间结点分配的LC的串接形成虚电路（VC）。


    ![](img/0761188ee01704e55ea71e6a97539d38_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 虚电路（Virtual Circuit）


    数据传输：


    站点发送的所有分组均沿着相同的VC传输，分组的发收顺序完全相同；分组中只带逻辑信道号，而不带地址。


    ![](img/0761188ee01704e55ea71e6a97539d38_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 虚电路（Virtual Circuit）


    虚电路的建立和释放需要占用一定的时间，不适合站点之间具有频繁的、短小数据交换的场合。


    永久虚电路PVC和呼叫虚电路SVC。


    永久虚电路: 两站点间事先建立固定的链接，占用固定的逻辑信道，任何时候，站点之间都可以通信。


    呼叫虚电路则根据需要，动态建立和释放虚电路。


    ![](img/0761188ee01704e55ea71e6a97539d38_174_0.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 数据报和虚电路的比较


    虚电路：


    +   1. 传输需连接建立和释放的过程；

    +   2. 数据块中仅含少量的地址信息（LC号），用户的连续数据块沿着相同的路径，按序到达目的地；接受站点处理方便。

    +   3. 如果虚电路中的某个结点或者线路出现故障，将导致虚电路传输失效。

    +   4. 虚电路方式较适合站点之间大批量的数据传输。


    TCP数据传输'
  merge: -1
