  md: '# 万维网 WWW


    # 1 万维网概述


    +   - 万维网 WWW（World Wide Web）并非某种特殊的计算机网络。

    +   - 万维网是一个大规模的、联机式的信息储藏所。

    +   - 万维网用链接的方法能非常方便地从因特网上的一个站点访问另一个站点，从而主动地按需获取丰富的信息。

    +   - 这种访问方式称为“链接”。'
  merge: -1
