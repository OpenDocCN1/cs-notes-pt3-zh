  md: '# 数字数据网（DDN）


    +   - DDN是一条支持用户数据点到点高速传输的通道


    +   - DDN的基本速率为64Kbps，用户租用的信道速率应为64Kbps的整数倍。


    +   - DDN本身并不提供任何通信协议的支持，在DDN信道上使用何种通信协议由用户自行决定


