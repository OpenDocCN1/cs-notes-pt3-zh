- pgno: 857
  md: '# 网际组管理协议 IGMP 和多播路由选择协议


    # 1. IP多播需要两种协议


    +   - 为了使路由器知道多播组成员的信息，需要利用网际组管理协议 IGMP (Internet Group Management Protocol)。

    +   - 连接在局域网上的多播路由器还必须和因特网上的其他多播路由器协同工作，以便把多播数据报用最小代价传送给所有的组成员。这就需要使用多播路由选择协议。'
  merge: -1
