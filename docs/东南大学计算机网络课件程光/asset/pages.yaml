  md: '# 数据加密、解密技术


    # 加密解密模型


    ![](img/0761188ee01704e55ea71e6a97539d38_1142_0.png)


    # 习惯记法：


    明文M、密文X、加密密钥K和解密密钥P，有：


    $E_K（M）$ ——用密钥K对明文M进行加密，形成密文；


    $D_P（X）$ ——用密钥P对密文X进行解密，还原明文；


    针对上面的模型有：$M = D_P（E_K（M））$'
