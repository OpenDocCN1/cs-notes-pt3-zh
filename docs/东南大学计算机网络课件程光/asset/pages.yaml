  md: '# 发送和接收的协调：


    ![](img/0761188ee01704e55ea71e6a97539d38_1245_0.png)


    目的：保证接收方能够正确识别和接收发送方的数据；


    方法：收方及时调整接收取样脉冲；


    位同步：使接收方可以正确地接收各个比特


    自同步法：收方直接从数据波中获取同步信号（曼码）。


    外同步法：收方根据特定信号锁定接收脉冲和频率。（异步传输的起始/终止位）


    字符同步：使接收方可以正确地识别数据群


    收方在识别到独特的同步字符或同步模式后，才开始真正的数据接收。'
  merge: -1
