- pgno: 390
  md: '# 总线型局域网小结


    特点：所有节点附接一根总线，通过总线收发帧；对应共享总线可能冲突，采用了各种总线访问方式。


    竞争方式：

    CSMA/CD—以太网；

    特点：节点抢占总线；

    发送前侦听，

    发送时检测，

    冲突退避；

    结论：重载时性能不好，

    难以确定帧的发送时间。


    按序方式：

    TokenBus—ARCnet；

    特点：令牌传递总线访问权；

    发送前等待令牌，

    发送后传递令牌，

    监控令牌唯一性；

    结论：具有帧最小发送延迟，

    可预测最大发送延迟。'
