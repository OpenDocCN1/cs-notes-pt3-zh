- pgno: 813
  md: '这就是**好消息传播得快，而坏消息传播得慢**。网络出故障的传播时间往往需要较长的时间(例如数分钟)。这是 RIP 的一个主要缺点。


    ![](img/0761188ee01704e55ea71e6a97539d38_813_0.png)


