- pgno: 712
  md: "# 最长前缀匹配\n\n$D$ AND (11111111 11111111 11111100 00000000)  \n= 206.0.68.0/22　　匹配\n\
    \n$D$ AND (11111111 11111111 11111111 10000000)  \n= 206.0.71.128/25　　匹配\n\n+\
    \   - 选择两个匹配的地址中更具体的一个，即选择最长前缀的地址。"
