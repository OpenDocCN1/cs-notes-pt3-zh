    +   - IPv6 数据报的有效载荷长度为 3000 字节。下层的以太网的最大传输单元 MTU 是 1500 字节。

    +   - 分成三个数据报片，两个 1400 字节长，最后一个是 200 字节长。


    扩展首部

    IPv6 基本首部 分片首部 1 第一个分片 1400 字节

    IPv6 基本首部 分片首部 2 第二个分片 1400 字节

    IPv6 基本首部 分片首部 3 第三个分片 200 字节'
  merge: -1
