- pgno: 860
  md: '# 2. 网际组管理协议 IGMP


    +   - 1989 年公布的 RFC 1112（IGMPv1）早已成为了因特网的标准协议。

    +   - 1997 年公布的 RFC 2236（IGMPv2，建议标准）对 IGMPv1 进行了更新。

    +   - 2002 年 10 月公布了 RFC 3376（IGMPv3，建议标准），宣布 RFC 2236（IGMPv2）是陈旧的。'
  merge: -1
  img_proc: true
- pgno: 861
  md: '# IGMP 是整个网际协议 IP 的一个组成部分


    +   - 和 ICMP 相似，IGMP 使用 IP 数据报传递其报文（即 IGMP 报文加上 IP 首部构成 IP 数据报），但它也向 IP 提供服务。

    +   - 因此，我们不把 IGMP 看成是一个单独的协议，而是属于整个网际协议 IP 的一个组成部分。'
  merge: -1
  img_proc: true
- pgno: 862
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 863
  md: '# IGMP 可分为两个阶段


    +   - 第二阶段：因为组成员关系是动态的，因此本地多播路由器要周期性地探询本地局域网上的主机，以便知道这些主机是否还继续是组的成员。

    +   - 只要对某个组有一个主机响应，那么多播路由器就认为这个组是活跃的。

    +   - 但一个组在经过几次的探询后仍然没有一个主机响应，则不再将该组的成员关系转发给其他的多播路由器。'
  merge: -1
  img_proc: true
- pgno: 864
  md: '# IGMP 采用的一些具体措施


    +   - 在主机和多播路由器之间的所有通信都是使用 IP 多播。

    +   - 多播路由器在探查询组成员关系时，只需要对所有的组发送一个请求信息的询问报文，而不需要对每一个组发送一个询问报文。默认的询问速率是每 125 秒发送一次。

    +   - 当同一个网络上连接有几个多播路由器时，它们能够迅速和有效地选择其中的一个来探查询主机的成员关系。'
  merge: -1
  img_proc: true
- pgno: 865
  md: '# 转发多播数据报使用的方法

    洪泛与剪除


    +   - 这种方法适合于较小的多播组，而所有的组成员接入的局域网也是相邻接的。

    +   - 一开始，路由器转发多播数据报洪泛的方法（这就是广播）。为了避免兜圈子，采用了叫做**反向路径广播 RPB**（Reverse Path Broadcasting）的策略。


    ![](img/0761188ee01704e55ea71e6a97539d38_865_0.png)'
  merge: -1
  img_proc: true
- pgno: 866
  md: '# RPB 的要点


    +   - 路由器收到多播数据报时，先检查是否从源点经最短路径传送来的。

    +   - 若是，就向所有其他方向转发刚才收到的多播数据报（但进入的方向除外），否则就丢弃而不转发。

    +   - 如果存在几条同样长度的最短路径，那么只能选择一条最短路径，选择的准则就是看这几条最短路径中的相邻路由器谁的 IP 地址最小。'
  merge: -1
  img_proc: true
