- pgno: 30
  md: '# ★ 根据管理性质分类


    **公用网**：资源可供任何人使用


    电话网、公共数据网、DDN等


    **专用网**：资源仅供有限对象使用


    国家安全网、军事网、气象网、电力网等


    利用公用网组建专用网——虚拟专用网（VPN）


    金融网，教育网，政府网等


    +   互联网（Internet—因特网）

    +   内联网（Intranet，如企业网）

    +   外联网（Extranet，如企业之间网络）'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ★ 根据交换方式分类


    （信息在网络设备（交换机）中的转移方式）


    # ☆ 电路交换网


    交换机采用程控跳线接续工作方式（类似电话），无存储能力。具有建立链路、数据传输和释放链路三个阶段；通信过程中，自始自终占用该条线路，且不允许其它用户共享其信道容量。


    ![](img/0761188ee01704e55ea71e6a97539d38_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ☆报文交换网


    交换机采用具有“存储-转发”能力的计算机，

    用户数据可以暂时保存于交换机内，

    等待线路空闲时，再进行用户数据的一次性传输，

    多个用户的数据可以经过一条链路传输。


    ![](img/0761188ee01704e55ea71e6a97539d38_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 分组交换网


    类同报文交换技术，规定了交换机处理和传输的数据长度（称之为分组）


    不同用户的数据分组可以交织地在网络中的物理链路上传输


    ![](img/0761188ee01704e55ea71e6a97539d38_33_0.png)


    目前，大多数计算机网络（包括广域网和局域网）都采用了分组交换技术，只是分组的大小有所不同'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ★按功能分类


    通信子网： 网络中面向数据传输或者数据通信的部分资源集合，主要支持用户数据的传输；该子网包括传输线路、交换机和网络控制中心等硬件软件设施。


    资源子网： 网络中面向数据处理的资源集合、主要支持用户的应用；该子网由用户的主机资源组成，包括接入网络的用户主机，以及面向应用的外设（例如：终端）、软件和可共享的数据（例如：公共数据库）等。'
  merge: -1
  img_proc: true
