- pgno: 19
  md: '# 网络的发展—研究角度


    70年代，网络协议，（异构）计算机之间通信和互联，追求网络的（地域）覆盖面；

    90年代，网络应用，满足各类应用需求，追求网络的（行业）覆盖面，无所不在；

    本世纪，网络服务，向用户提供满意的、高质量的服务，以人为本，享受网络。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 计算机网络的定义


    计算机网络是以共享资源（硬件、软件和数据等）为目的而连接起来的、在协议控制下，由一台或多台计算机、若干台终端设备、数据传输设备等组成的系统之集合。


    这些计算机系统应当具有独立自治的能力。

    是可以独立运行的系统。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 网络的功能


    计算机联网的主要目的——跨越时空：


    # 资源共享


    +   - **硬件共享**：大型计算机的处理能力，昂贵的外设；

    +   - **软件共享**：应用软件，系统软件等；

    +   - **数据共享**：用户数据（市场信息）等。


    # 数据传输


    支持用户之间的数据传输（如电子邮件、文件传输、IP电话等），计算机网络可以使得分布于全球的计算机协作起来。形成一个巨大的、虚拟的计算机。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 计算机网络和信息社会


    信息社会的特征：信息具有价值；


    信息的特点：时效性；


    计算机：信息处理的最佳工具；


    计算机网络：具有高速的信息传输能力，充分发挥计算机处理的效率，是信息社会得以快速发展的支撑技术；


    90年代，美国提出建立信息高速公路（国家信息基础设施—NII），构建贯通全美各大学、研究机构、企业及家庭的全国性网络。全球响应—GII，我国倡导的各项上网工程，网络渗透各行各业，生活中密不可分的一部分。'
  merge: -1
  img_proc: true
