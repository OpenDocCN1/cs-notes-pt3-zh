- pgno: 481
  md: '# 同步数字体系（SDH）


    # SDH的原理


    SDH是一个基于时分多路复用技术的数字传输网络，由多路复用器和中继器组成，并通过光纤进行连接。


    多路复用器：将多个较低级别的信道复用为一个较高级别的信道，


    中继器：实现更长距离传输时的信号再生和转发


    ![](img/0761188ee01704e55ea71e6a97539d38_481_0.png)'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 同步数字体系（SDH）


    ![](img/0761188ee01704e55ea71e6a97539d38_482_0.png)


    段：设备之间的连接


    线：复用器之间（可能经过一个或者多个中继器）的连接


    路径：源和宿之间的连接。


    双环结构：支持双向的数据传输，提高网络的效率，


    提高网络的可靠性，无论是线路或者设备的故障，


    双环仍然可以通过旁路故障设备或者线路来保证数据的传输。


    SDH双环自愈合网络'
  merge: -1
  img_proc: true
