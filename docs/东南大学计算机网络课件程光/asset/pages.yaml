- pgno: 1193
  md: "# ★ 简单网络管理协议（SNMPv3—RFC2273）\n\n为解决SNMPv2的遗留问题，1997年4月，IETF成立了SNMPv3工作组。**SNMPv3的重点是安全、可管理的体系结构和远程配置。**\n\
    \n针对可能的威胁：未授权的修改信息、操作指令、报文流的修改、拒绝服务、流量分析等；\n\n工作成果：2002年公布SNMPv3。\n\n+   - **RFC3412**，Message\
    \ Processing and Dispatching for the Simple Network Management Protocol (SNMP);\
    \  \n+   - **RFC3413**，Simple Network Management Protocol (SNMP) Applications;\
    \  \n+   - **RFC3414**，User-based Security Model (USM) for version 3 of the Simple\
    \ Network Management Protocol (SNMPv3);"
  merge: -1
  img_proc: true
- pgno: 1194
  md: '# ☆ 简单网络管理协议（SNMPv3—RFC2273）


    在SNMPv2的基础上，扩充相关安全功能；


    身份鉴别：实体鉴别，确保收到的指令或者数据来自于真实的实体；


    数据保密：MIB信息存储保密和PDU传输保密，确保指令或者数据不被截取、伪造、篡改和重放；


    访问控制：实体授权和访问控制，禁止越权或者非授权操作。


    ![](img/0761188ee01704e55ea71e6a97539d38_1194_0.png)


    现状：目前实用的大部分管理系统仍然基于SNMPv2；'
  merge: -1
  img_proc: true
