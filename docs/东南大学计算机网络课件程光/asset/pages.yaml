  md: '# 因特网：


    组成及结构：路由器互连子网及用户主机；


    ![](img/0761188ee01704e55ea71e6a97539d38_1254_0.png)


    用户接入因特网的必备条件：接入网络的接口（转发服务）、统一的软件（TCP/IP协议集）、全网唯一标识（IP 地址）；


    因特网地址：物理地址、IP 地址、域名地址间关系及映射方法；


    IP地址空间紧张的原因及其解决方案：


    +   IPv6、子网掩码（子网地址）、动态分配、专用地址—NAT；


    IP协议的特点：无连接、不可靠、尽力投递（路由和分段）；


    +   路由选择：路由表构造（距离-向量DV，链路状态LS）；


    ICMP的作用：设备和结点的控制及差错报告报文传递；


    TCP原理及特点：连接/可靠/字节流、流控/拥塞处理、C/S模式；


    T U端口号的作用：标识特定的应用进程；


    因特网的基本应用服务：Email（SMTP/POP/IMAP）、DNS、WWW；'
  merge: -1
