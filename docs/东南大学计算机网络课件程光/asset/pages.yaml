- pgno: 298
  md: '# 传输技术


    (1) 基带传输： 保持数据波的原样进行传输。

    数据波信号的传输会随着距离的增加而衰减，随着频率的增加而容易发生畸变，因此，基带传输不适合高速和远距离的传输。


    基带传输的传输方向： 基带信号可以同时向两个方向扩散，直至被终端适配器吸收。


    ![](img/0761188ee01704e55ea71e6a97539d38_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 传输技术


    # (2) 宽带传输：


    采用调制的方法，以连续不间断的电磁波信号来传输信号。常可采用频分多路复用的技术，支持多路信号的传输。


    与基带传输相比较，宽带传输可以提供较高的传输速率和抗干扰的能力。


    宽带传输的传输方向：信号仅向单个方向传输。


    ![](img/0761188ee01704e55ea71e6a97539d38_299_0.png)


    c) 双缆宽带


    ![](img/0761188ee01704e55ea71e6a97539d38_299_1.png)


    b) 中分宽带'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 距离问题


    节点之间的实际距离：表示连接两个节点的导线长度，


    节点之间的传播距离：表示信号从一个节点传播到另一个节点（或者被另一个节点所感知）的距离，


    实际距离和传播距离之间并不总是存在正比的关系。


    基带传输：信号同时向两个方向扩散，传播时间与实际距离成正比，实际距离最远的两个节点之间的信号传播距离也最远。


    ![](img/0761188ee01704e55ea71e6a97539d38_300_0.png)'
