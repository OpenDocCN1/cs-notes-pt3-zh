- pgno: 202
  md: '# OSI/RM的设计原理


    # 1、分解


    分解： 将整个系统划分为若干易于实现和控制的子模块，并通过对各子模块的功能、交换的数据结构和时序进行约定，协调模块之间的动作，保证系统设计的合理性和互操作性。


    可以根据各子模块的依赖关系，使用结构化的设计和实现方法，采用具有层次结构的模型与之对应。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# OSI/RM的设计原理


    # 2、 抽象


    标准的提出应当独立于实现的具体环境，

    OSI/RM的确立采用了三级抽象技术。


    # 第一级抽象： 提出OSI/RM，


    建立计算机网络在概念和功能上的框架，包括确定OSI的层次模型，以及公共术语、属性和子模块的功能等；


    # 第二级抽象： 提出OSI服务定义，


    在OSI/RM的基础上，定义各个子模块可提供的服务（即确定各个子模块的外观特性）。


    # 第三级抽象： 定义OSI协议规范，


    定义一组为确保子模块服务的提供而应遵循的规则（协议）'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 模块划分的原则


    +   - **独立性：** 减少模块间交互的信息，降低依赖性；

    +   - **单向性：** 模块间的引用坚持单向性，降低实现难度；

    +     该原则导致系统本身体现层次性（层次结构）；

    +   - **增值性：** 各模块在使用下层服务的基础上，完成特定的通信功能，提供增值服务；

    +   - **同构性：** 互连的系统应当具有相同的层次结构；

    +   - **适用性：** 同构系统的相同层次之间才能进行有意义的通信，并借助于下层服务予以实现。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# OSI/RM的设计原理


    # OSI的最大优势：


    引入层的概念，在定义接口的基础上，各层可以独立设计、更新，甚至替换。


    # OSI特点：


    +   （1）互连的系统必须具有相同的层次结构；

    +   （2）只有相同层次的实体（功能的实施者）才能进行有意义的通信，并且只能借助于其下层的服务来实现。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# OSI的层次


    七层体系结构：


    +   (1) 物理层（PH），确定物理设备接口，提供点一点的比特流传输的物理链路；


    +   (2) 数据链路层（DL），利用差错处理技术，提供高可靠传输的数据链路；


    +   (3) 网络层（N），利用路由技术，实现用户数据的端一端传输；'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# OSI的层次


    # 七层体系结构：


    +   (4) 运输层（T），屏蔽子网差异，以及用户要求和网络服务之间的差异；

    +   (5) 会话层（S），提供控制会话和数据传输的手段；

    +   (6) 表示层（P），解决异种系统之间的信息表示问题，屏蔽不同系统在数据表示方面的差异；

    +   (7) 应用层（A），利用下层的服务，满足具体的应用要求。'
