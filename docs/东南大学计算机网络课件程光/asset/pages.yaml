- pgno: 484
  md: '# 同步数字体系（SDH）


    # SONET 标准定义了四个光接口层


    +   - 光子层(Photonic Layer)

    +     - 处理跨越光缆的比特传送。

    +   - 段层(Section Layer)

    +     - 在光缆上传送 STS-N 帧。

    +   - 线路层(Line Layer)

    +     - 负责路径层的同步和复用。

    +   - 路径层(Path Layer)

    +     - 处理路径端接设备 PTE (Path Terminating Element)之间的业务的传输。'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# SDH帧结构


    采用同步多路复用技术，被复用的信号组成一个数据块（称为帧）进行传输。


    STM-1帧（155M）结构：2430个字节（每个字节占8位），排列为9行270列


    前9行9列用于存放控制信息：包括段首SH、线首LH和路径首部PH以及段、线和路径设施处理的各种控制信息，如同步信息、时钟信息、校验信息等。


    ![](img/0761188ee01704e55ea71e6a97539d38_485_0.png)'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# SDH帧结构


    +   - 后9行261列用于存放被传输的信息

    +   - 传输是按行按字节进行的。

    +   - 第1行第1列的字节最先上线路，

    +   - 第2行第1列的字节紧随着第1行第270列的字节之后。


