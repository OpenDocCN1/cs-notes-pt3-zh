- pgno: 1144
  md: "# ★ 数据加密算法——密码系统的计算安全性\n\n+   ➢ 若能从密文X推出明文M或密钥K，或从明文M和密文X推出密钥K，则称对应的密码算法是**可破译的**。\n\
    +   \n+   ➢ 若无论有多少密文X都不能推出明文M，则称对应的密码算法是**理论不可破译的**。\n+   \n+   ➢ 若密码系统原则上可破译，但无法在希望的时间内或允许的经济条件下实现破译，则它是**实际不可破译的**。\n\
    \n# 加密算法安全性评估：\n\n+   ➢ 加密算法的安全性基于计算可行性\n+   　— **破译的代价**是否大于可能获得的结果\n+   　— **破译的时间**是否大于结果的有效期\n\
    +   　— **能否产生足够多的数据**供破译使用"
  merge: -1
