  md: '# ★ 数据加密算法 —算法分类：


    # 2、按密钥体制分类：


    依据： 加密密钥和解密密钥之间的关系；


    M = D_P ( E_K ( M ) )


    +   — 对称密钥加密体系（秘密密钥 / 单密钥加密体系），加密密钥与解密密钥相同，或者一个可以从另一个导出；


    +   — 非对称密钥加密体系（公开密钥 / 双密钥加密体系），从一个密钥去推导另一个密钥是计算不可行的。'
