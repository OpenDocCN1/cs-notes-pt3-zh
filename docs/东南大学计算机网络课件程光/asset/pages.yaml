- pgno: 891
  md: '# 3 IPv6 的扩展首部


    # 1. 扩展首部及下一个首部字段


    +   - IPv6 把原来 IPv4 首部中选项的功能都放在扩展首部中，并将扩展首部留给路径两端的源站和目的站的主机来处理。

    +   - 数据报途中所经过的路由器都不处理这些扩展首部（只有一个首部例外，即逐跳选项扩展首部）。

    +   - 这样就大大提高了路由器的处理效率。'
  merge: -1
  img_proc: true
- pgno: 892
  md: '# 六种扩展首部


    在 RFC 2460 中定义了六种扩展首部：


    +   - 逐跳选项

    +   - 路由选择

    +   - 分片

    +   - 鉴别

    +   - 封装安全有效载荷

    +   - 目的站选项'
  merge: -1
  img_proc: true
