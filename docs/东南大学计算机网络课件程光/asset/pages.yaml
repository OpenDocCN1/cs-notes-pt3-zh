- pgno: 814
  md: '# 内部网关协议 OSPF

    (Open Shortest Path First)


    +   1. OSPF 协议的基本特点

    +   - “开放” 表明 OSPF 协议不是受某一家厂商控制，而是公开发表的。

    +   - “最短路径优先” 是因为使用了 Dijkstra 提出的最短路径算法SPF

    +   - OSPF 只是一个协议的名字，它并不表示其它的路由选择协议不是 “最短路径优先”。

    +   - 是分布式的链路状态协议。'
  merge: -1
  img_proc: true
- pgno: 815
  md: '# 三个要点


    +   - 向本自治系统中所有路由器发送信息，这里使用的方法是洪泛法。

    +   - 发送的信息就是与本路由器**相邻**的所有路由器的链路状态，但这只是路由器所知道的**部分信息**。

    +     - “链路状态”就是说本路由器都和哪些路由器相邻，以及该链路的“**度量**”（metric）。

    +   - 只有当链路状态**发生变化**时，路由器才用洪泛法向所有路由器发送这些信息。'
  merge: -1
  img_proc: true
- pgno: 816
  md: '# 链路状态数据库

    (link-state database)


    +   - 由于各路由器之间频繁地交换链路状态信息，因此所有的路由器最终都能建立一个链路状态数据库。

    +   - 这个数据库实际上就是全网的拓扑结构图，它在全网范围内是一致的（这称为链路状态数据库的同步）。

    +   - OSPF 的链路状态数据库能较快地进行更新，使各个路由器能及时更新其路由表。OSPF 的更新过程收敛得快是其重要优点。'
  merge: -1
  img_proc: true
- pgno: 817
  md: '# OSPF 的区域(area)


    +   - 为了使 OSPF 能够用于规模很大的网络，OSPF 将一个自治系统再划分为若干个更小的范围，叫作区域。

    +   - 每一个区域都有一个 32 位的区域标识符（用点分十进制表示）。

    +   - 区域也不能太大，在一个区域内的路由器最好不超过 200 个。'
  merge: -1
  img_proc: true
- pgno: 818
  md: '# OSPF 划分为两种不同的区域


    ![](img/0761188ee01704e55ea71e6a97539d38_818_0.png)


