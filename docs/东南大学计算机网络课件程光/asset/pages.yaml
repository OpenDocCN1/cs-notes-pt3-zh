- pgno: 118
  md: '# ★ 循环校验码(CRC)


    信息字段为K位，校验字段为R位，则码字长度为N=K+R；任一合法码字都可由一个R次多项式g(x)产生。


    合法码字 V(x) = x^R m(x)+r(x) = A(x) g(x)


    m(x) — K次信息多项式，信息字段，


    r(x) — R-1次校验多项式，校验字段，


    g(x) — R次生成多项式


    g(x)=g₀ + g₁x + g₂x² + … + g₍R-1₎x^(R-1) + g_R x^R。


    其中： gᵢ = 0 或 1， 0<i<R；


    g₀ = g_R =1，'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 循环校验码(CRC)


    原理：当确定字段长度后，任意一个二进制位串（字段）都可以和一个系数仅为0和1取值的多项式一一对应。


    例： 1010111： x⁶+x⁴+x²+x+1

    x⁵+x³+x²+x+1： 101111


    若信息字段为K位，校验字段为R位，


    则码字长度为： N=K+R；


    任一合法码字都可由一个R次多项式g(x)产生。'
  merge: -1
  img_proc: true
