  md: '# 划分子网


    # 1. 从两级 IP 地址到三级 IP 地址


    +   - **两级的 IP 地址（网络号+主机号）。不够灵活**


    +   - 从 1985 年起在 IP 地址中又增加了一个“子网号字段”，使两级的 IP 地址变成为**三级的 IP 地址**。


    +   - **划分子网**（subnetting）。划分子网已成为因特网的正式标准协议。


    ```

    IP地址 ::= {<网络号>, <子网号>, <主机号>}

    ```'
