  md: '# （2）CSMA/CD 帧的一般格式


    | 7 | 1 | 6 | 6 | 2 | 0-1500 | 0-46 | 4 |

    |---|---|---|---|---|---|---|---|

    | F | SFD | DA | SA | L | DATA | PAD | FCS |

    帧头部

    尾部


    前导码（F） 10101010101010……10101010


    帧开始标志（SFD） 10101011


    信宿地址（DA）：


