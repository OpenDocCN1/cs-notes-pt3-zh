- pgno: 840
  md: '# BGP-4 共使用四种报文


    +   (1) 打开(OPEN)报文，用来与相邻的另一个BGP 发言人建立关系。


    +   (2) 更新(UPDATE)报文，用来发送某一路由的信息，以及列出要撤销的多条路由。


    +   (3) 保活(KEEPALIVE)报文，用来确认打开报文和周期性地证实邻站关系。


    +   (4) 通知(NOTIFICATION)报文，用来发送检测到的差错。


    +   在 RFC 2918 中增加了 ROUTE-REFRESH 报文，用来请求对等端重新通告。'
