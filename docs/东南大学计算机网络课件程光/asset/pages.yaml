- pgno: 685
  md: '# 子网掩码的用处之一：


    便于网络设备尽快地区分本网段地址和非本网段的地址。


    例：主机A与主机B交互信息。

    主机A: IP地址：202.183.58.11

    子网掩码：255.255.255.0

    路由地址：202.183.58.1

    主机B: IP地址：202.183.56.5

    子网掩码：255.255.255.0

    路由地址：202.183.56.1


    ![](img/0761188ee01704e55ea71e6a97539d38_685_0.png)


    步骤：（1）用端口地址与子网掩码地址进行“逻辑与”，得到本端口网段地址：202.183.58.0；

    （2）将目的地址与子网掩码地址进行“逻辑与”，得目的网段地址 202.183.56.0；

    （3）将目的网段地址与端口网段地址比较，相同，则认为是本网段的，不予转发。不同，则将该IP报文转发到端口所对应的目的网段。'
  merge: -1
  img_proc: true
- pgno: 686
