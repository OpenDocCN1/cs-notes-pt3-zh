- pgno: 1184
  md: '# # 简单网络管理协议（SNMP）


    IETF成立两个工作组，从两个方面定义因特网管理的标准。以支持管理员和代理之间的管理信息的交换，


    管理信息库（MIB）工作组负责定义MIB内的元素及结构；网络管理协议（SNMP）工作组定义不同厂商的设备之间交换的协议；


    +   1990年，SNMPv1（RFC1157）和MIBv1（RFC1156）；

    +   1996年，SNMPv2（RFC1905）和MIBv2（RFC1904）

    +   —目前大部分网络设备均支持该版本；

    +   1998年，SNMPv3（RFC2273）和MIBv3（RFC2272）。'
  merge: -1
  img_proc: true
- pgno: 1185
  md: '# ☆ 简单网络管理协议（SNMPv1—RFC1157）


    SNMPv1（RFC1157）采用**集中管理模式**，一个管理员管理多个代理；管理员监控网络元素的状态，代理借助管理代理软件（Agent）执行网络管理的指令。


