  md: '# 信息字段、校验字段


    | 8 | n×8 | 8 | 0~N | 16 | 8(位) |

    |---|---|---|---|---|---|

    | F | A | C | I | FCS | F |

    | 起始标志 | 地址字段 | 控制字段 | 信息 | 校验码 | 结束标志 |


    Info(信息字段)：用于携带用户数据；

    仅在I帧中出现，任意位串（已实施‘0’比特插入）。


    FCS(校验字段)：对A、C和Info字段进行循环校验；

    g(x) = x16 + x12 + x5 + 1 （CCITT和ISO制定）

    g(x) = x16 + x15 + x2 + 1 （IBM公司制定—源于SDLC）


    因为HDLC的帧中至少包含A、C、FCS字段，因此帧长应大于等于32位。'
