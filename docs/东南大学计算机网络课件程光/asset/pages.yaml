- pgno: 703
  md: '# 路由聚合(route aggregation)


    +   - 一个 CIDR 地址块可以表示很多地址，这种地址的聚合常称为路由聚合，它使得路由表中的一个项目可以表示很多个（例如上千个）原来传统分类地址的路由。

    +   - 路由聚合也称为构成超网(supernetting)。

    +   - CIDR 虽然不使用子网了，但仍然使用“掩码”这一名词（但不叫子网掩码）。

    +   - 对于 /20 地址块，它的掩码是 20 个连续的 1。斜线记法中的数字就是掩码中1的个数。'
  merge: -1
  img_proc: true
- pgno: 704
  md: '# CIDR 记法的其他形式


    +   - 10.0.0.0/10 可简写为 10/10，也就是把点分十进制中低位连续的 0 省略。

    +   - 10.0.0.0/10 隐含地指出 IP 地址 10.0.0.0 的掩码是 255.192.0.0。此掩码可表示为


    11111111 11000000 00000000 00000000

    255    192      0       0


    掩码中有 10 个连续的 1'
  merge: -1
  img_proc: true
- pgno: 705
  md: '# CIDR 记法的其他形式


    +   - 10.0.0.0/10 可简写为 10/10，也就是将点分十进制中低位连续的 0 省略。

    +   - 10.0.0.0/10 相当于指出 IP 地址 10.0.0.0 的掩码是 255.192.0.0，即

    +     11111111 11000000 00000000 00000000

    +   - 网络前缀的后面加一个星号 * 的表示方法

    +     如 00001010 00*，在星号 * 之前是网络前缀，而星号 * 表示 IP 地址中的主机号，可以是任意值。'
  merge: -1
  img_proc: true
- pgno: 706
  md: '# 构成超网


    +   - 前缀长度不超过 23 位的 CIDR 地址块都包含了多个 C 类地址。

    +   - 这些 C 类地址合起来就构成了超网。

    +   - CIDR 地址块中的地址数一定是 2 的整数次幂。

    +   - 网络前缀越短，其地址块所包含的地址数就越多。而在三级结构的 IP 地址中，划分子网是使网络前缀变长。'
  merge: -1
  img_proc: true
