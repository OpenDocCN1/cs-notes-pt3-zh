- pgno: 1119
  md: '# 分组过滤式防火墙


    原理：


    +   1、 有选择地允许数据分组穿过防火墙，实现内部和外部主机之间的数据交换；

    +   2、 作用在网络层和传输层；

    +   3、 根据分组的源地址、目的地址、端口号、协议类型等标志确定是否允许数据包通过。满足过滤逻辑的数据包才被转发，否则丢弃。


    ![](img/0761188ee01704e55ea71e6a97539d38_1119_0.png)'
  merge: -1
  img_proc: true
- pgno: 1120
  md: '# 分组过滤式防火墙


    +   1、分组过滤软件通常集成到路由器上，允许用户根据某种安全策略进行设置，允许特定的分组穿越防火墙。


    +   2、路由器对每个分组进行分析，并为分组选择一条最佳的路径。普通路由器只执行两种操作：如果它知道分组的目的地址的路由，就转发该分组；否则丢弃或者退回分组。增加了分组过滤功能的路由器则检查更多的内容。'
  merge: -1
  img_proc: true
- pgno: 1121
  md: '# 分组过滤式防火墙


    3、通过分析IP地址和端口号来决定是否转发一个分组。


    如:建立一个对应端口号为23的防火墙过滤器来阻止向内部计算机上发送远程登录分组；建立一个对应端口号为21的防火墙过滤器来阻止外部用户向内部计算机发送文件传输分组（FTP）等。


    4、基于分组过滤的防火墙的安全性依赖于用户制定的安全策略。系统对用户设置的理解，为两类："不允许的就是禁止"和"不禁止的就是允许"。'
  merge: -1
  img_proc: true
- pgno: 1122
  md: '# 代理服务式防火墙


    代理服务：代理外部（或内部）用户访问内部（或外部）网络，杜绝内部和外部的直接访问。“中介作用”


    代理服务器与路由器的合作：


    路由器实现内部和外部网络交互时的信息流导向，将所有的相关应用服务请求传递给代理服务器。


    代理服务作用在应用层，其特点是完全"阻隔"了网络通信流，通过对每种应用服务编制专门的代理程序，实现监视和控制应用层通信流的作用。


    ![](img/0761188ee01704e55ea71e6a97539d38_1122_0.png)'
  merge: -1
  img_proc: true
- pgno: 1123
  md: '# 代理服务式防火墙


    代理服务器分析客户的请求，根据制定的策略决定允许或者拒绝某个特定的请求；当一个请求被允许时，代理服务器就“代表”该客户执行访问操作，并将结果返回客户。


    代理服务→应用服务，不同的应用服务可以设置不同的代理服务器，如FTP代理服务器、TELNET代理服务器等。


    ![](img/0761188ee01704e55ea71e6a97539d38_1123_0.png)


    目前，很多内部网络都同时使用分组过滤路由器和代理服务器来保证内部网络的安全性，并且取得了较好的效果。'
  merge: -1
  img_proc: true
- pgno: 1124
  md: '# 地址迁移式防火墙（NAT—

    Network Address Translation）


    企业分配若干个全局IP地址，企业网内部使用自定义的IP地址（称为本地IP地址或者虚拟IP地址）。当内外用户希望相互访问时，专门的路由器（地址迁移路由器，或者NAT路由器）负责全局/本地IP地址的映射。


    NAT路由器位于不同地址域的边界处，通过保留部分全局IP地址的分配权来支持IP数据报的跨网传输。


    ![](img/0761188ee01704e55ea71e6a97539d38_1124_0.png)'
  merge: -1
  img_proc: true
- pgno: 1125
  md: '# 地址迁移式防火墙（NAT）


    # NAT地址分配政策：


    +   （1）静态地址分配：支持内部地址和外部地址之间进行一对一的映射，这种映射的有效期可以是长久的（例如NAT启动时进行分配），也可以是划分时间区域的（某段时间内，分配给特定的结点）


    +   （2）动态地址分配：以会话为单位，按需进行地址分配，用完后即予以归还。


    # NAT工作原理：


    +   （1）地址绑定（静态或动态地建立本地/全局地址的映射关系）


    +   （2）地址查找和转换（对数据报中的相关地址信息进行修改）


    +   （3）地址解绑定（释放全局地址）


    ![](img/0761188ee01704e55ea71e6a97539d38_1125_0.png)'
  merge: -1
  img_proc: true
- pgno: 1126
  md: '# 地址迁移式防火墙（NAT）


    # NAT的优点：


    +   1. 融合了分组过滤和应用代理的设计思想，可以根据应用的需求限定允许内外网访问的结点；

    +   2. 可以屏蔽内网的地址，保证内网的安全性。

    +   3. 数据报分析是NAT路由器必须做的工作（例如，修改IP数据报携带的高层协议数据单元中的地址信息），可以有选择地提供/拒绝部分跨网的应用服务。


    ![](img/0761188ee01704e55ea71e6a97539d38_1126_0.png)'
  merge: -1
  img_proc: true
- pgno: 1127
  md: '# 防火墙的位置


    内部网常采用局域网技术，外部网常为广域网，路由器作为互连设备，路由器所在的位置也应是防火墙的位置；有时，路由器中也集成了防火墙的功能。


    防火墙设施通常具有2个或者1个端口；

    双端口时，分别接外部网和内部网；


    单端口时，则需交换设备的端口绑定。


