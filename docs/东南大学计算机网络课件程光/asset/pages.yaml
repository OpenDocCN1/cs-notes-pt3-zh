- pgno: 441
  md: '# (1) 蓝牙系统(Bluetooth)


    +   - 最早使用的 WPAN 是 1994 年爱立信公司推出的蓝牙系统，其标准是 IEEE 802.15.1。

    +   - 蓝牙的数据率为 720 kb/s，通信范围在 10 米左右。

    +   - 蓝牙使用 TDM 方式和扩频跳频 FHSS 技术组成不用基站的皮可网(piconet)。'
  merge: -1
  img_proc: true
- pgno: 442
  md: '# 皮可网(piconet)


    +   - Piconet 直译：“微微网”，覆盖面积非常小。

    +   - 每一个皮可网有一个主设备(Master)和最多7个工作的从设备(Slave)。


    ![](img/0761188ee01704e55ea71e6a97539d38_442_0.png)


    M —— 主设备    S —— 从设备'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# 蓝牙系统中的皮可网和扩散网


    +   - 通过共享主设备或从设备，可以把多个皮可网链接起来，形成一个范围更大的扩散网(scatternet)。

    +   - 主从工作方式的个人区域网实现起来价格比较便宜。


    ![](img/0761188ee01704e55ea71e6a97539d38_443_0.png)'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# （2）低速 WPAN


    +   - 主要用于工业监控组网、办公自动化与控制等领域，其速率是 2 ~ 250 kb/s。

    +   - 标准： IEEE 802.15.4。新修订的标准是 IEEE 802.15.4-2006。

    +   - 典型的低速 WPAN： ZigBee。

    +   - ZigBee 技术主要用于各种电子设备（固定的、便携的或移动的）之间的无线通信，其主要特点是通信距离短（10 ~ 80 m），传输数据速率低，并且成本低廉。'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# ZigBee 的特点


    （1）功耗非常低，省电。


    工作时：信号的收发时间很短；


    非工作时：ZigBee 节点处于休眠状态，非常省电。对于某些工作时间和总时间之比小于 1% 的情况，电池的寿命甚至可以超过10 年。


    （2）网络容量大。一个 ZigBee 的网络最多包括有255 个节点，其中一个是主设备，其余则是从设备。若是通过网络协调器，整个网络最多可以支持超过 64000
    个节点。'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# ZigBee 的标准


    +   - 在 IEEE 802.15.4 标准基础上发展而来的。ZigBee 产品也是 802.15.4 产品。

    +   - IEEE 802.15.4 只是定义了 ZigBee 协议栈的最低的两层（物理层和 MAC 层），而上面的两层（网络层和应用层）则是由 ZigBee
    联盟定义的。


    ![](img/0761188ee01704e55ea71e6a97539d38_446_0.png)'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# # ZigBee 的组网方式


    一个全功能设备 FFD（Full Function Device）充当网络的协调器。允许多多精简功能设备 RFD（Reduced Function Device）结点。ZigBee
    网络中的端设备


    ![](img/0761188ee01704e55ea71e6a97539d38_447_0.png)


    端设备 RFD


    路由器


    协调器


    星形

    网状拓扑

    或两者的组合'
  merge: -1
