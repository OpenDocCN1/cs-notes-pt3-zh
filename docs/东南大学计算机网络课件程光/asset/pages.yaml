  md: '# 方法2：前向纠错法（FEC）


    发送方发送具有纠错能力的编码；

    接收方根据编码规则纠正传输中的差错。


    ![](img/0761188ee01704e55ea71e6a97539d38_109_0.png)


    特点：无需反馈信道；


    编码复杂（纠错能力有限）。


    差错处理的核心：检错码/纠错码的构造。'
