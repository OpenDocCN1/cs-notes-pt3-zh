- pgno: 651
  md: '# （6）因特网的结构—发展阶段2


    # ★ 层次结构：逐级覆盖和管理（1985年起）


    **主干网：** 由代表国家或者行业的有限个中心结点通过专线连接形成；覆盖到国家一级；连接各个国家的因特网互连中心，如中国互联网信息中心（CNNIC）


    **次级网（区域网）：** 若干个作为中心结点代理的次中心结点组成，容许级内分级，如 CERNET，华东（北）片，…；


    **园区网（校园网、企业网）：** 直接面向用户的网络。


