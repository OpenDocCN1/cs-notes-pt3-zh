- pgno: 724
  md: '# IPv4地址的扩展—IPv6地址


    IPv6地址占128位(16字节)，记为：X:X:X:X:X:X:X:X:X；


    其中：X表示4个16进制数:xxxx，每个x取值 0—F；


    例如：CDCD:910A:2222:5498:8475:1111:3900:2020，2000:0123:00FA:CDCD:0000:0000:0000:0001
    均为合法的IPv6地址；


    为简化表示，起始的0可以省略，若干个0可以用空隙代替，


    如： 2000:0123:00FA:CDCD:0000:0000:0000:0001 可表示为：2000:123:FA:CDCD::1；


    0000:0000:0000:0000:0000:0000:ABCD:1234 可以简化为： ::ABCD:1234；


    注：连续两个冒号“::”在一个地址中只能出现一次；


    为了与IPv4兼容，X:X:X:X:X:X:d.d.d.d为合法地址；


    IPv4地址的IPv6表示： ::d.d.d.d，如 ::202.119.11.1'
  merge: -1
  img_proc: true
