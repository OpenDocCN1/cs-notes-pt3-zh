- pgno: 158
  md: '# 集中传输：**动态按需分配子信道**


    **问题1：** 如何区分各子信道的数据？


    解决方法：在数据块前**增加标识**；


    结果：子信道可动态分配给不同用户，系统可以容纳更多用户；


    **问题2：** 瞬时输入可能大于总的输出，产生信息丢失；


    改进：集中传输设备**具有缓冲存储的能力**，临时保存输入的信息，并等待空闲的信道。


    称为：**异步**多路复用 或者 **统计**多路复用技术；'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 数据交换


    利用中间结点将通信双方连接起来。


    **中间结点**（交换设备）：不关心被传输的数据内容，只执行交换的动作，起数据交换的功能，将数据从一个端口交换到另一端口，继而传输到另一台中间结点，直至目的地。


    +   - **结点**：用于数据交换的中间设备。

    +   - **站点**：发送和接收数据的终端设备。


    数据交换方式：线路交换


    报文交换


    分组交换。


    ![](img/0761188ee01704e55ea71e6a97539d38_159_0.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 线路交换（电路交换）


    工作过程类似于电话系统，需要在通信的设备之间建立物理连接。


    电路交换的过程包括三个阶段：


    ![](img/0761188ee01704e55ea71e6a97539d38_160_0.png)


    **建立线路：** 发方站点向接收方站点发请求，该请求通过中间结点传输至终点；中间结点分配线路。线路一旦被分配，在未释放前，将不能被其它站点所使用，即使线路上并没有数据传输。


    **数据传输：** 物理线路建立后，站点之间进行数据传输。


    **释放线路：** 站点之间的数据传输完毕，执行释放线路的动作。线路被释放之后，进入空闲状态，可由其它站点通信所用。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 线路交换（电路交换）


    # 线路交换的特点：


    +   - 独占性，线路的利用率较低，也容易引起建链时的拥塞。

    +   - 实时性好，数据传输的延迟小（一旦建链，占整个线路）

    +   - 线路交换不提供任何缓冲装置，数据透明传输，

    +   - 收发双方自动进行速率匹配。（交换机设备比较简单）


    ![](img/0761188ee01704e55ea71e6a97539d38_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 报文交换


    中间节点由具有存储能力的计算机承担，用户信息可以暂时保存在中间节点上，报文交换无需同时占用整个物理线路。


    将目的地地址附加在报文上，然后将整个报文传递给中间节点，该节点暂存报文，根据地址确定输出端口和线路，排队等待线路空闲时再转发给下一结点，直至终点。


    存储一转发'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 报文交换


    特点：“存储一转发”。


    +   - 不独占线路，

    +   - 多个用户的数据可以通过存储和排队共享一条线路，

    +   - 无线路建立的过程，提高了线路的利用率；

    +   - 可以支持多点传输（一个报文传输给多个用户）；（报文中增加“地址字段”，中间结点根据地址字段进行复制和转发，）

    +   - 中间结点可进行数据格式的转换，方便接收站点的收取，增加差错检测功能，避免出错数据的无谓传输等'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 报文交换


    # 不足之处：


    +   1. 由于“存储—转发”和排队，增加了数据传输的延迟；

    +   2. 报文长度未作规定，报文只能暂存在磁盘上，磁盘读取占用了额外的时间；

    +   3. 任何报文都必须排队等待：不同长度的报文要求不同长度的处理和传输时间，即使非常短小的报文（例如：交互式通信中的会话信息）；

    +   4. 报文交换难以支持实时通信和交互式通信的要求。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 分组交换


    结合线路交换和报文交换两者的优点，使其性能达到最优


    类似报文交换，只是它规定了交换设备处理和传输的数据长度（称之为分组），将长报文分成若干个小分组进行传输。不同站点的数据分组可以交织在同一线路上传输。提高了线路的利用率


    可以固定分组的长度，系统可以采用高速缓存技术来暂存分组，提高了转发的速度；'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 分组交换


    分组交换实现的关键： 分组长度的选择，


    分组越小，冗余量（分组中的控制信息等）在整个分组中所占的比例越大，最终将影响用户数据传输的效率；


    分组越大，数据传输出错的概率也越大，增加重传的次数，也影响用户数据传输的效率。


    X. 25分组交换网： 131字节， （128字节的用户数据、3字节的控制信息）


    以太网中： 1500字节。


    ATM网中： 53个字节'
  merge: -1
  img_proc: true
