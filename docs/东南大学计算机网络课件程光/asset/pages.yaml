- pgno: 907
  md: '# 5 从 IPv4 向 IPv6 过渡


    +   - 向 IPv6 过渡只能采用逐步演进的办法，同时，还必须使新安装的 IPv6 系统能够向后兼容。

    +   - IPv6 系统必须能够接收和转发 IPv4 分组，并且能够为 IPv4 分组选择路由。

    +   - 双协议栈(dual stack)是指在完全过渡到 IPv6 之前，使一部分主机（或路由器）装有两个协议栈，一个 IPv4 和一个 IPv6。'
  merge: -1
