- pgno: 551
  md: '# 广域网（WAN）


    网络覆盖范围大，节点距离远，光纤应用促使协议改善/简化；


    # 传输系统（数字信道） — 基于时分+波分复用的光纤信道：


    PDH（T/E载波系列） — SDH（高端光纤复用标准化）；


    # 广域网络（通信系统）： 解决远程通信的诸多问题；


    X.25网 — FR— ATM；


    +   网络： 尽快完成源/宿间信息传输；

    +   传输延时 = 节点处理时间 + 媒体传输时间；

    +   低速/低质媒体： 节点处理差错，保证传输正确性；

    +   高速/高质媒体： 源宿端主机来保证传输正确性。


    # 接入方式—辅助用户接入广域网；


    xDSL（利用电话线的高频资源） — 调制 + 复用；


    以太网 —宽带接入'
  merge: -1
  img_proc: true
- pgno: 552
  md: '# 现有基础网络的局限性


    # 1、“电子瓶颈”效应


    提高传输速率和吞吐能力，向高速和超高速网络发展，一直是技术和市场追求的目标。


    现有传统的时分复用光纤通信系统，传输速率每提高4倍，每比特传输的成本下降约30%--40%，光纤通信系统的速率已从45Mbit/s →10Gbit/s ,速率增加了2000倍。'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# 现有基础网络的局限性


    # 1、“电子瓶颈”效应


    现有的光纤通信系统，仅将光纤当作“导线”。

    并未发挥光纤的巨大带宽等优越性。


    由于中继放大、变换、复用等过程中所有的电子器件的数据处理速率的固有限制。制约了光纤通信系统和网络对信息传输、交换等数据速率的进一步提高，成为一个“瓶颈”'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# 现有基础网络的局限性


    # 1、“电子瓶颈”效应


    由于激光器的一些限制（电学参量及载流子渡域时间等），激光器的调制速率很难高于几十 Gbit/s；另外，高于10Gbit/s的信号长途传输时容易引起信号的严重失真。要实现高速率、大容量传输，不能只依靠提高激光器的调制速率。


    解决“电子效应”的有效途径是：采用全光通信和网络，在光域上实现传输和交换，使信息成为无阻塞的、透明的网络。'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# 现有基础网络的局限性


    # 2、难于适应互联网业务的发展


    目前，电信网的网络层协议（IP）业务基于 SDH/SONET 和面向语音业务的线路交换技术，难于适应不同于语音业务特性的互联网业务（IP 数据包交换）和不断增加的新IP业务。


    基于WEB的各种多媒体通信等对网络的时延和服务质量（QoS）等指标有较高的要求。


    以SDH/SONET为基础的传统光网络来承载IP业务，要IP业务通过多层协议堆栈映射至SDH帧中，在进行传输时会产生一些问题'
  merge: -1
  img_proc: true
- pgno: 556
  md: '# 现有基础网络的局限性


    # 2、难以适应互联网业务的发展


    在进行传输时会产生一些问题：


    +   (1) 很难区分不同种类的IP业务；

    +   (2) 多层协议堆栈增加了信头开销，降低网络速度(IP/ATM/SDH的信头开销高达22%)；

    +   (3) 多层协议造成各层的功能重复，使网络设备成本增高；'
  merge: -1
  img_proc: true
