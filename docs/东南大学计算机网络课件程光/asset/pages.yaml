  md: '# 网络的发展


    覆盖网：面向应用的网络（在支撑网络的基础上增添组件，使其满足各类应用需求）— 21世纪初期


    典型系统：以信息资源共享为目的的网格；

    以闲散资源共享为目标的对等网（P2P网）


    ![](img/0761188ee01704e55ea71e6a97539d38_18_0.png)'
