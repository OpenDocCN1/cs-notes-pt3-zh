- pgno: 180
  md: '# 路由技术简介


    中间结点的目的：对应输入的分组，寻找合适的出口路径予以转发，使该分组可以“尽快”离开结点，到达接收站点。


    寻找出口的过程称之为路由选择，对应算法为路由选择算法。


    结点处理的一般方法：对应端口，设置缓存区（队列），根据不同的算法，将分组输出到不同的端口，排队等待输出。


