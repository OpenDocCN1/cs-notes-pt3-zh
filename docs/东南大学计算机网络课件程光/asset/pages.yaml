- pgno: 709
  md: '# 2. 最长前缀匹配


    +   - 使用 CIDR 时，路由表中的每个项目由“网络前缀”和“下一跳地址”组成。在查找路由表时可能会得到不止一个匹配结果。

    +   - 应当从匹配结果中选择具有最长网络前缀的路由：最长前缀匹配 (longest-prefix matching)。

    +   - 网络前缀越长，其地址块就越小，因而路由就越具体 (more specific)。

    +   - 最长前缀匹配又称为最长匹配或最佳匹配。'
  merge: -1
  img_proc: true
- pgno: 710
  md: "# 最长前缀匹配举例\n\n收到的分组的目的地址 D = 206.0.71.128\n\n路由表中的项目：206.0.68.0/22 （ISP）\n\
    206.0.71.128/25 （四系）\n\n查找路由表中的第 1 个项目\n\n第 1 个项目 206.0.68.0/22 的掩码 M 有 22 个连续的\
    \ 1。\n\nM = 11111111 11111111 11111100 00000000\n\n因此只需把 D 的第 3 个字节转换成二进制。\n\n\
    M = 11111111 11111111 11111100 00000000\nAND   D = 206. 0. 01000100. 0\n     \
    \ 206. 0. 01000100. 0\n\n与 206.0.68.0/22 匹配"
  merge: -1
  img_proc: true
- pgno: 711
  md: "# 最长前缀匹配举例\n\n收到的分组的目的地址 D = 206.0.71.128\n\n路由表中的项目：206.0.68.0/22 （ISP）\n\
    206.0.71.128/25 （四系）\n\n再查找路由表中的第 2 个项目\n\n第 2 个项目 206.0.71.128/25 的掩码 M 有 25\
