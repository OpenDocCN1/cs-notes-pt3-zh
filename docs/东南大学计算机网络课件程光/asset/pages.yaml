- pgno: 365
  md: '# 令牌总线


    +   - 逻辑闭合环路的形成：

    +   - 每个节点都动态地维护着一个连接表，

    +   - 【前继地址、后继地址、本节点的地址】

    +   - 每个节点根据后继地址确定下一占有令牌的节点。


    ![](img/0761188ee01704e55ea71e6a97539d38_365_0.png)'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# 令牌总线帧的一般格式


    | ≥1 | 1 | 1 | 2/6 | 2/6 | ≥0 | 4 | 1 (字节) |

    |---|---|---|---|---|---|---|---|

    | P | SD | FC | DA | SA | DATA | FCS | ED |


    前导码（P），用于收发同步，


    +   - 帧开始标志（SD），标识帧的开始，使用了曼彻斯特编码中的非数据位，取值为LH0LH000；。


    +   - 宿/源地址（DA/SA）


    +   - 帧控制字段（FC），用于区分帧的类型，包括MAC控制帧（如令牌08H、设置后继等）、LLC数据帧、站点管理数据帧等。'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# 令牌总线帧的一般格式


    | ≥ 1 | 1 | 1 | 2/6 | 2/6 | ≥ 0 | 4 | 1 |（字节）|

    |---|---|---|---|---|---|---|---|---|

    | P | SD | FC | DA | SA | DATA | FCS | ED | |


    +   - **数据字段（DATA）**，根据帧控制字段（FC）的取值，数据字段可以包含LLC协议数据单元、MAC管理数据、和MAC控制帧的数据；

    +   - **帧校验序列（FCS）**：对SD和ED之间的所有字段进行循环冗余校验；'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# 令牌总线帧的一般格式


    | ≥1 | 1 | 1 | 2/6 | 2/6 | ≥0 | 4 | 1 (字节) |

    |---|---|---|---|---|---|---|---|

    | P | SD | FC | DA | SA | DATA | FCS | ED |


    +   - 帧结束标志（ED），标识帧的结束，同时也标识了帧中FCS的位置，使用了曼彻斯特编码中的非数据位，取值为LH1LH1IE；

    +   - LH1LH1IE：令牌总线网允许一个结点连续发送多个MAC帧，

    +     I： 1 —— 紧随其后的为一个新的帧，

    +     0 —— 后续无帧；

    +     E： 1 —— 帧出错，该位由转发帧的转发器设置。'
  merge: -1
  img_proc: true
