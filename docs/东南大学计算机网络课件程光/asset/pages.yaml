- pgno: 894
  md: '# 2. 扩展首部举例


    +   - IPv6 把分片限制为由源站来完成。源站可以采用保证的最小 MTU（1280字节），或者在发送数据前完成路径最大传送单元发现(Path MTU
    Discovery)，以确定沿着该路径到目的站的最小 MTU。


    +   - 分片扩展首部的格式如下：


    | 位 | 0 | 8 | 16 | 29 | 31 |

    |---|---|---|---|---|---|

    |  | 下一个首部 | 保留 | 片偏移 | 保留 | M |

    |  |  | 标识符 |  |  |  |'
  merge: -1
