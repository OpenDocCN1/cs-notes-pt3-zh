- pgno: 289
  md: '# 局域网(LAN)


    +   - 局域网的基本概念： 局域网是将分散在有限地理范围内（如一栋大楼，一个部门）的多台计算机通过传输媒体连接起来的通信网络，通过功能完善的网络软件，实现计算机之间的相互通信和共享资源。


    +   - 美国电气和电子工程师协会局域网标准化(IEEE 802)委员会负责局域网标准化工作，包括LAN的定义。（IEEE 802委员会）'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 局域网(LAN)


    +   - LAN定义（IEEE 802.1-2001）: 局域网通常是由单个组织拥有、使用和运维的，允许中等地域内站点以中高速率直接互连通信的对等通信网络。

    +   - *LAN的特性*

    +   - (1) 传输媒体：双绞线、同轴电缆和光纤（光缆），在特殊的情况下，也可以考虑使用微波、红外线和激光等无线传输媒体；

    +   - (2) 传输技术 使用传输媒体进行通信的技术，常用的有基带传输和宽带传输；'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 局域网(LAN)


    # LAN的特性


    (3) 网络拓扑 指组网时的电缆铺设形式，常用的有总线形、环形和星形，局域网的网络拓扑描述对应网络中数据收发的方式。


    (4) 访问控制方法 网络设备访问传输媒体的控制方法，常用的有竞争、令牌传递和令牌环等。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 局域网特点


    +   (1) 网络覆盖范围小（25公里以内）

    +   (2) 选用较高特性的传输媒体：高的传输速率和低的传输误码率

    +   (3) 硬软件设施及协议方面有所简化

    +   (4) 媒体访问控制方法相对简单

    +   (5) 广播方式传输数据信号，不考虑路由选择和忽略OSI网络层。'
  merge: -1
