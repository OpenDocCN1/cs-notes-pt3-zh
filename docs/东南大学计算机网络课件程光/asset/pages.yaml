- pgno: 1152
  md: '# 数据加密算法：秘密密钥加密体系


    # DES算法特点：


    +   （1）通信双方维护相同的密钥；因此如何保证密钥的一致性，以及如何维护密钥的安全性成为确保DES算法有效的关键技术，而这一点通常由用户自行决定。


    +   （2）对应N个通信伙伴应维护N个密钥，用户工作量大；


    +   （3）无法用于群组内的安全通信；


    +   （4）算法主要执行置换、代换和位操作，比较简单，加密/解密速度快。


    实用场合：常用于批量数据的加密。'
