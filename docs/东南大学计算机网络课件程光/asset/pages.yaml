- pgno: 147
  md: '# 多路复用与集中传输


    # 多路复用


    **目的：**使得多路信号可以共用一个信道，将多路信号组合在一条物理信道上传输，以充分利用信道容量。


    **原理：**当物理信道的可用带宽超过单个原始信号的带宽时，将物理信道的总带宽分割成若干个和被传输的单个信号带宽相同或者略为宽一点的子信道，并利用每个子信道传输一路信号，达到多路信号共用一个信道的目的，节省线路资源。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 频分多路复用


    对整个物理信道的可用带宽进行分割，

    并利用载波调制技术，实现原始信号的频谱迁移，

    使得多路信号在整个物理信道带宽允许的范围内，

    实现频谱上的不重叠，从而共用一个信道。


    ![](img/0761188ee01704e55ea71e6a97539d38_148_0.png)


    频分多路复用主要用于模拟信道的复用（铜线、微波线路）'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 时分多路复用（TDM）


    主要用于数字信道的复用。

    原理：当物理信道可支持的比特传输速率超过单个原始信号要求的数据传输速率时，可以将该物理信道划分成若干时间片，并将各个时间片轮流地分配给多路信号，使得它们在时间上不重叠。


    ![](img/0761188ee01704e55ea71e6a97539d38_149_0.png)'
