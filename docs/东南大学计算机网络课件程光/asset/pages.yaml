- pgno: 604
  md: '# 远程访问（PPP 协议）


    PPP—(Point—Point Protocol) 协议：

    支持主机通过串行方式进入Internet。

    用户到 ISP 的链路使用 PPP 协议


    ![](img/0761188ee01704e55ea71e6a97539d38_604_0.png)'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 远程访问（PPP协议）


    # PPP的组成：


    PPP提供了一个在串行点—点链路上传输数据报的方法。


    +   1. 一种在串行链路上将数据报打包的方法。

    +      （类似于HDLC）

    +   2. 一个可扩充的链路控制协议（LCP），用于建立、配置和测试数据链路的连接。

    +   3. 一系列的网络控制协议（NCP），用于建立和配置不同的网络层协议。'
  merge: -1
  img_proc: true
- pgno: 606
  md: "# 远程访问（PPP协议）\n\n# PPP的工作过程：\n\n+   1、PC机通过Modem拨号呼叫ISP路由器，路由器modem应答，建立了物理连接。\n\
    +   \n+   2、PC向路由器发一串LCP包，与路由器协商使用的PPP参数，包括用户认证等（用户名，口令）。\n+   \n+   3、协商完，PC机发一串NCP包，配置网络层。例如：要运行TCP/IP协议，需要分配一个IP地址，（动态分配）"
  merge: -1
  img_proc: true
- pgno: 607
  md: '# 虚拟网络


    传统的局域网： 以物理网段为基本网络用户单位，如果一个节点接到一个网络设备（HUB、中继器、网桥或交换机）上，那么，它就与其他接在同一设备上的节点属于同一个局域网，可以互发广播报文。


    不同网段上的用户不能处于同一局域网中。


    ![](img/0761188ee01704e55ea71e6a97539d38_607_0.png)'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# 虚拟网络（VLAN）


    跨接不同物理LAN网段的节点形成逻辑LAN网段，使得在不同物理网段的用户处于同一局域网中（虚拟局域网），形成逻辑的工作组。在同一逻辑工作组中的节点可以互发广播报文。


    ![](img/0761188ee01704e55ea71e6a97539d38_608_0.png)


    虚拟网络：在逻辑上可以通过网络管理来划分逻辑工作组的物理网络。用户可以根据自己的需求，而不是根据用户在网络中的物理位置来划分网络。'
  merge: -1
  img_proc: true
- pgno: 609
  md: '# 虚拟网络


    # 在实际联网中为什么会使用VLAN？


    +   1、减少因网络成员的变化所带来的开销

    +   减少因用户的增加、删除、移动等工作产生的隐含开销。


    +   2、虚拟工作组

    +   某一部门或分支机构的成员可以在虚拟工作组模式下共享同一个“局域网”，把绝大多数的网络流量限制在VLAN广播域内部。'
  merge: -1
  img_proc: true
- pgno: 610
  md: '# 虚拟网络


    # 3、减少了路由器的使用


    支持虚拟网的交换机可以在没有路由器的情况下很好的控制广播流量。


    在VLAN中，从服务器到客户端的广播信息只会在连接本虚拟网客户机的交换机端口上被复制，而在其他端口上广播信息被终止。


    只有那些需要跨越虚拟网的数据包才会穿过路由器。在这种方式下交换机扮演了路由器的角色。


    # 4、局域网的安全性'
  merge: -1
  img_proc: true
- pgno: 611
  md: "# # 虚拟网络的划分\n\n划分VLAN的方法主要有两种：静态和动态。\n\n**静态：** VLAN由交换机本身的特征信息定义，通常包括插槽、端口或端口组等。\n\
    \n**动态：** VLAN通常由节点的某些特征信息定义，可以是节点的MAC地址、正在使用的协议、甚至是某些认证信息（如名字与口令等）。\n\n+   三种常用的划分方法：\n\
    +   \n+   1. 根据端口划分VLAN（配置交换）\n+   2. 根据MAC地址划分VLAN（帧交换）\n+   3. 根据网络层定义划分VLAN"
  merge: -1
  img_proc: true
- pgno: 612
  md: '# 根据端口划分VLAN（配置交换）


    利用交换机的端口划分VLAN成员，在一个交换机上进行虚网划分。


    例：1、3、6、7端口:VLAN1，4端口：VLAN3，

    2、5、8 端口：VLAN4。若100M交换机的上行端口为A，则在该交换机中的配置为：


    ```

    set trunk A

    set vlan 1 1,3,6,7

    set vlan 3 4

    set vlan 4 2,5,8

    ```


    ![](img/0761188ee01704e55ea71e6a97539d38_612_0.png)'
  merge: -1
  img_proc: true
- pgno: 613
  md: '# 根据端口划分VLAN（配置交换）


    允许跨越多个交换机的多个不同端口划分VLAN，

    不同交换机上的若干个端口可组成同一个虚拟网。


    +   特点：

    +   （1）配置过程简单。

    +   （2）跨交换机的虚网交互通过路由器或三层交换机进行。

    +   （3）用户从一个端口的虚网移到另一端口所在的虚网，需要进行重新设置


    ![](img/0761188ee01704e55ea71e6a97539d38_613_0.png)'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# 根据MAC地址划分VLAN（帧交换）


    交换机根据节点的MAC地址，决定将其放置于哪个VLAN中。


    MAC地址是捆绑在网络接口卡上的，这种VLAN的划分方法与连接到交换机上的设备有关，可以允许网络用户从一个物理位置移动到另一个物理位置上，并且自动保留其所属虚拟网段的成员身份。


    该VLAN的划分方法独立于网络的高层协议（如TCP/IP、IP、IPX等）。


    # 缺点：


    所有的用户必须被明确的分配到一个VLAN中，网卡换了，必须修改虚网配置。


    ![](img/0761188ee01704e55ea71e6a97539d38_614_0.png)'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# 根据网络层定义划分VLAN


    交换机还可以根据使用的协议或网络层地址(如 TCP/IP中的子网段地址)来确定网络成员(VLAN)的划分。


    财务系统服务器、一卡通系统服务器


    九龙湖校区财务办公室


    四牌楼校区财务处


    校园网主干


    丁家桥校区财务办公室


    202.119.2.0'
  merge: -1
  img_proc: true
- pgno: 616
  md: '# 根据网络层定义划分VLAN


    优点：


    +   (1) 可以按传输协议划分网段；

    +   (2) 用户可以在子网内部自由移动而不用重新配置自己的工作站；

    +   (3) 可以减少由于协议转换而造成的网络延迟。


    缺点：


    基于网络层的虚拟网需要分析协议的地址格式并进行相应的转换，影响交换机的速度。'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# VLAN之间的互连


    VLAN与VLAN之间的互连需要通过路由器进行，或者具有三层交换功能（路由）的交换机进行。


    +   交换机：

    +   普通交换机

    +   带虚网划分功能的交换机

    +   带三层交换功能的交换机


    +   网络互连设备：

    +   转发器（集线器）

    +   网桥（二层交换机）

    +   路由器（三层交换）

    +   网关（Gateway）'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# 网关（Gateway）


    执行互连OSI运输层及其以上的各层协议的转换，或者实现不同体系结构的网络协议转换的互连设备。


    ![](img/0761188ee01704e55ea71e6a97539d38_618_0.png)'
  merge: -1
  img_proc: true
- pgno: 619
  md: '# 网关的应用


    凡是在应用层协议不相同的两个网络系统的互连都需要使用网关。


    +   - FTAM —— FTP

    +   - MHS —— SMTP

    +   - TCP/IP —— SPX/IPX

    +   - WAP —— TCP/IP

    +   - 银行的支付网关（跨行支付） 銀聯'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# 一般的企业网络


    企业网通常采用层次结构，由主干网和分支网组成。


    +   - 主干网辐射到各个部门，分支网连接部门内的各台计算机。\n- 主干网通常采用高速以太网；分支网通常采用以太网等；\n- 主要网络设备：\n  网络适配器、共享式集线器（HUB）、交换器（Switch）、路由器（Router）'
  merge: -1
  img_proc: true
- pgno: 621
  md: '# 企业组网的一般方式


    小规模企业（几十台计算机）

    可直接使用交换机连接，形成局域网。


    +   - 中等规模企业（几百台计算机）

    +     交换器，形成局域网。


    +   - 稍大规模企业（近千台计算机）

    +     主交换机＋交换器；形成园区网


    +   - 大规模企业 主交换机构成主干网，通过交换器辐射园区网


    +   - 与外部连接： 增加路由器。接入广域网'
  merge: -1
  img_proc: true
