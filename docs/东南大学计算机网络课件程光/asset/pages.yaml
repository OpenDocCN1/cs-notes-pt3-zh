- pgno: 466
  md: '# 局域网特点


    +   - 采用广播技术，一个结点发送的信息可以被另本网内的所有结点所感知，并且只有接收结点才真正接收。

    +   - 媒体访问控制简单。

    +   - 统一的LLC层对高层服务。使得高层（网络层）无需考虑对应的是什么类型的局域网。

    +   - 不同类型的局域网之间需要有专门的设备互连才能通信。


    ![](img/0761188ee01704e55ea71e6a97539d38_466_0.png)'
