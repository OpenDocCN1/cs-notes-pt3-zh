- pgno: 89
  md: '# （3）曼彻斯特编码


    一个比特时间一分为二


    比特时间内 发生低电平到高电平的变化表示“1”，高电平到低电平的变化表示“0”


    ![](img/0761188ee01704e55ea71e6a97539d38_89_0.png)


    # （4）差分曼彻斯特编码


    编码特征：一个比特时间一分为二，比特时间的中部发生电平变化，表示的值依赖于前一比特的最终电平状态


    当前比特的前半部分电平不同于前一比特的最终电平状态（即位间电平发生变化），表示“0”


    当前比特的前半部分电平相同于前一比特的最终电平状态（即位间电平不发生变化），表示“1”'
