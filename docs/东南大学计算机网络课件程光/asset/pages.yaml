- pgno: 493
  md: '# 分组交换数据网络（X. 25网络）


    CHINAPAC（国家公共数据网）1989年开通，94年二期工程，覆盖全国各省会城市和直辖市，通过省网辐射全国，主干网速率可达2Mb/s。


    # X. 25网络组成


    +   - X. 25网络采用分布式的网状拓扑结构。网状结构的网络具有如下特点：


    +   1) 网络扩充和主机入网比较简单，可以很方便地增加结点，或者接纳主机入网；


    +   2) 网络完整性和可靠性较高，任何一对结点之间都可以具有一条以上的路径，不会因为某些链路或者结点的故障造成全网的瘫痪。'
