- pgno: 24
  md: '# # 网络的类型


    +   - 根据网络覆盖范围分类


    +   - **广域网**（Wide Area Network--WAN）

    +   - **局域网**（Local Area Network--LAN）

    +   - **城域网**（Metropolitan Area Network--MAN）

    +   - **园区网**（Campus Network/Enterprise Network）


    覆盖整个企业，淡化覆盖范围的概念。


    不同覆盖范围的网络采用了不同的技术，应用的普及导致范围的淡化，目前习惯用技术来分析网络类型。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# ★按网络拓扑结构分类


    # （1）星形网络：


    以一台中心处理机为主而构成的网络，其它入网机器仅与该中心处理机之间有直接的物理链路，所有网上传输的信息均需通过该处理机转发。


    ![](img/0761188ee01704e55ea71e6a97539d38_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# ★ 按网络拓扑结构分类


    # （2）总线网络：


    所有入网机器共用一条物理传输信道。


    ![](img/0761188ee01704e55ea71e6a97539d38_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ★ 按网络拓扑结构分类


    # （3）环形网络：


    入网设备通过**转发器**接入网络，每个转发器仅与两个相邻转发器有直接的物理线路，所有转发器构成了环形网络。


    ![](img/0761188ee01704e55ea71e6a97539d38_27_0.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ★按网络拓扑结构分类


    # （4）网状网络：


    利用专门负责数据通信和传输的结点机构成

    入网设备直接接入结点机进行通信。

    两个结点之间的连接不唯一，完整性、可靠性高


    主要用于地理范围大、

    入网主机多（机型多）的环境，

    常用于构造广域网络


    ![](img/0761188ee01704e55ea71e6a97539d38_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# ★ 按网络拓扑结构分类


    # （5）树状拓扑结构：


    # 星型网络的扩展


    ![](img/0761188ee01704e55ea71e6a97539d38_29_0.png)


    主机


    # 逻辑上／物理上'
