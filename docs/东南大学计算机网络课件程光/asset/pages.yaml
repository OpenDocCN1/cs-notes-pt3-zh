- pgno: 1041
  md: '# 提高域名服务器的可靠性


    +   - DNS 域名服务器都把数据复制到几个域名服务器来保存，其中的一个是主域名服务器，其他的是辅助域名服务器。

    +   - 当主域名服务器出故障时，辅助域名服务器可以保证 DNS 的查询工作不会中断。

    +   - 主域名服务器定期把数据复制到辅助域名服务器中，而更改数据只能在主域名服务器中进行。这样就保证了数据的一致性。'
  merge: -1
  img_proc: true
- pgno: 1042
  md: '# 域名的解析过程


    +   - 主机向本地域名服务器的查询一般都是采用**递归查询**。如果主机所询问的本地域名服务器不知道被查询域名的 IP 地址，那么本地域名服务器就以 DNS
    客户的身份，向其他根域名服务器继续发出查询请求报文。

    +   - 本地域名服务器向根域名服务器的查询通常是采用**迭代查询**。当根域名服务器收到本地域名服务器的迭代查询请求报文时，要么给出所要查询的 IP 地址，要么告诉本地域名服务器：“你下一步应当向哪一个域名服务器进行查询”。然后让本地域名服务器进行后续的查询。


    ![](img/0761188ee01704e55ea71e6a97539d38_1042_0.png)'
  merge: -1
  img_proc: true
