  md: '# 路由器在网际互连中的作用


    # 1. 路由器的结构


    +   - 路由器是一种具有多个输入端口和多个输出端口的专用计算机，其任务是转发分组。也就是说，将路由器某个输入端口收到的分组，按照分组要去的目的地（即目的网络），把该分组从路由器的某个合适的输出端口转发给下一跳路由器。

    +   - 下一跳路由器也按照这种方法处理分组，直到该分组到达终点为止。'
