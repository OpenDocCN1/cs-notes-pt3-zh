- pgno: 914
  md: '# 2 MPLS 的工作原理


    # 1．基本工作过程


    +   - MPLS 对打上固定长度“标记”的分组用硬件进行转发，使分组转发过程中省去了每到达一个结点都要查找路由表的过程，因而分组转发的速率大大加快。

    +   - 采用硬件技术对打上标记的分组进行转发称为标记交换。“交换”也表示在转发分组时不再上升到第三层用软件分析 IP 首部和查找转发表，而是根据第二层的标记用硬件进行转发。'
  merge: -1
  img_proc: true
