- pgno: 254
  md: '# 会话层


    # 基于运输层的问题


    运输层可以保证用户数据按照要求从网络的一端传输到另一端，用户如何控制信息的交互。网络应当提供什么样的功能来协助用户管理和控制用户之间的信息交换。


    ![](img/0761188ee01704e55ea71e6a97539d38_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 会话与活动的概念


    会话：用户（表示层实体）之间的信息交换过程；


    会话连接：用户之间为完成信息交换而按一定规则而在会话层实体之间建立起来的一种暂时的联系；


    会话单元：逻辑概念，一组意义上相对完整的数据块传输；


    活动：会话用户之间合作的逻辑工作段；活动的内容具有相对的独立性和完整性；


    ![](img/0761188ee01704e55ea71e6a97539d38_255_0.png)'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 会话层的同步技术


    同步：对会话层实体的一种控制方法，保证会话交互的时序性


    同步技术：对用户数据进行语义上的分段，便于接收方可对所接收的信息进行验证。


    引入活动和同步的目的：使用户可以了解会话的进程，便于控制和管理；如果出现传输故障，可以从指定的同步点处进行恢复，重新同步，减少差错重传的数据量；


    ![](img/0761188ee01704e55ea71e6a97539d38_256_0.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 会话层功能


    会话层的目的：


    向用户提供组织和控制信息交换的手段。


    会话层的功能：


    +   （1）利用令牌技术来保证数据交换、会话同步的有序性；拥有令牌的一方可以发送数据，或者执行其它动作；令牌可以被申请和转让；


    +   （2）利用活动和同步技术来保证用户数据的完整性；并让用户知道整个交换的过程；


    +   （3）利用分段和拼接技术来提高数据交换的效率；多块用户数据可以合并在一起进行传输；


    +   （4）利用重新同步技术来实现用户会话的延续性；支持传输过程中的故障恢复。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 会话协议控制下的用户数据交换过程


    | 用户端1 | 方向 | 用户端2 | 说 明 |

    |---|---|---|---|

    | S-CON. req | —→ | S-CON. ind; | 会话连接（包括选择功能 |

    | S-CON. cnf | ←— | S-CON. rsp; | 单元和分配令牌） |

    | S-ACT_START. req | —→ | S-ACT_START. ind ; | 活动开始 |

    | S-DATA. req | —> | S-DATA. ind | ；传输一块数据 |

    | S-SYNC-MINOR. req | —→ | S-SYNC-MINOR. ind; | 检验数据完整性 |

    | S-SYNC-MINOR. cnf | ←— | S-SYNC-MINOR. rsp | （同步点） |

    | S-DATA. req | —→ | S-DATA. ind | ；传输一块数据 |

    | S-SYNC-MINOR. req | —→ | S-SYNC-MINOR. ind; | 检验数据完整性 |

    | S-SYNC-MINOR. cnf | ←— | S-SYNC-MINOR. rsp |  |'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 会话协议控制下的用户数据交换过程


    （续）


    S-DATA. req  ⟶  S-DATA. ind  ；传输一块数据

    ......  ......  ，继续传输动作等

    S-DATA. req  ⟶  S-DATA. ind  ；传输一块数据

    S-TOKEN-PLEASE. ind ←— S-TOKEN-PLEASE. req；用户2请求数据令牌

    ......  ......  ；用户1继续保留令牌

    S-ACT-END. req  ⟶  S-ACT-END. ind  ；用户1数据传输完毕,

    S-ACT-END. cnf ←— S-ACT-END. rsp  ；活动结束

    S-TOKEN-GIVE. req  ⟶  S-TOKEN-GIVE. ind；用户1 释放数据令牌；

    S-ACT_START. ind  ←— S-ACT_START. req；用户2开始传输

    S-DATA.ind  ←— S-DATA.req

    ......  ......'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 会话协议控制下的用户数据交换过程


    （续）


    | 用户侧指示 | 方向 | 网络侧请求/确认 | 说明 |

    |---|---|---|---|

    | `S-DATA.ind` | ← | `S-DATA.req` | |

    | `S-SYNC-MINOR.ind` | ← | `S-SYNC-MINOR.req` | |

    | `S-SYNC-MINOR.rsp` | → | `S-SYNC-MINOR.cnf` | |

    | `S-DATA.req` |  |  | 低层故障，用户1未收到数据 |

    | `S-P-EXECP.ind` | → | `S-P-EXECP.ind` | 低层故障报告 |

    | `S-CON.ind` | ← | `S-CON.req` | 重新连接 |

    | `S-CON.rsp` | → | `S-CON.cnf` | |

    | `S-ACT-RESUME.ind` | ← | `S-ACT-RESUME.req` | 恢复活动和同步点 |

    | `S-DATA.ind` | ← | `S-DATA.req` | 用户2继续数据传输 |'
  merge: -1
