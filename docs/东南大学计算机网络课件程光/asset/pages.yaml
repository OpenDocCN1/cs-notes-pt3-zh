- pgno: 529
  md: "# ATM 层\n\n定义信元头的结构，以及使用物理链路的方法。\n\n+   - ATM层的功能\n+   \n+     （1）**信元的汇集和分捡**：负责将多个输入端口的信元分捡到不同的输出端口；当多个输入端口的信元选择了相同的输出端口时，对信元进行必要的队列处理（**汇集**）；\n\
    +   \n+     （2）**VPI/VCI的管理**：经过不同的交换机，信元头要有变化，需要重填写。\n+   \n+     （3）**信元头的增删**：发送方增加信元头，接收方删除。\n\
    +   \n+     （4）**信元速率调整**：不同的链路需要不同的信元速率，\n\n![](img/0761188ee01704e55ea71e6a97539d38_529_0.png)"
  merge: -1
  img_proc: true
