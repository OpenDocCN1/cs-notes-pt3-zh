  md: '# （2）中国因特网記事（续）


    ★ 1995年4月，中科院启动“百所联网”工程；1995年12月开通"中国科技网"（CSTNET）；1996年9月6日，中国金桥信息网（CHINAGBN）开通；


    ★ 1997年，公用网（CHINANET）、科技网（CSTNET）、教育网（CERNET）、金桥网（CHINAGBN）四大网络互连互通；


    ★ 1997年6月3日，国务院信息化工作领导小组办公室宣布，在中科院计算机网络信息中心组建中国互联网络信息中心（CNNIC），行使国家互联网络信息中心的职责，发布中国因特网的统计信息。


