  md: '# 数据加密、解密技术


    原理：利用某种变换技术，将原文（明文）变换为一般用户无法识别的密文，数据以密文的形式在网络上传输；


    加密：明文到密文的过程,对应的算法称加密算法；


    解密：密文还原为明文的过程；对应的算法称解密算法；


    密钥：一串参与加密的字符串，算法在密钥的控制下进行操作，对应不同的密钥，相同的算法和相同的明文可以产生完全不同的密文。密钥是加密/解码的核心。'
  merge: -1
