- pgno: 943
  md: '# TCP 与 UDP


    +   - UDP 在传送数据之前不需要先建立连接。对方的运输层在收到 UDP 报文后，不需要给出任何确认。虽然 UDP 不提供可靠交付，但在某些情况下 UDP
    是一种最有效的工作方式。

    +   - TCP 则提供面向连接的服务。TCP 不提供广播或多播服务。由于 TCP 要提供可靠的、面向连接的运输服务，因此不可避免地增加了许多的开销。这不仅使协议数据单元的首部增大很多，还要占用许多的处理机资源。'
  merge: -1
  img_proc: true
- pgno: 944
  md: '# 运输层的端口


    +   运行在计算机中的进程是用进程标识符来标志的。


    +   运行在应用层的各种应用进程却不应当让计算机操作系统指派它的进程标识符。这是由于在因特网上使用的计算机的操作系统种类很多，而不同的操作系统又使用不同格式的进程标识符。


    +   为了使运行不同操作系统的计算机的应用进程能够互相通信，就必须用统一的方法对 TCP/IP 体系的应用进程进行标志。'
  merge: -1
  img_proc: true
- pgno: 945
  md: '# 端口号(protocol port number)

    简称为端口(port)


    +   解决这个问题的方法就是在运输层使用协议端口号(protocol port number)，或通常简称为端口(port)。


    +   虽然通信的终点是应用进程，但我们可以把端口想象是通信的终点，因为我们只要把要传送的报文交到目的主机的某一个合适的目的端口，剩下工作（即最后交付目的进程）就由
    TCP 来完成。'
