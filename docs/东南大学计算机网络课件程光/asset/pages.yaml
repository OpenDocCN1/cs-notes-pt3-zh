  md: '# 同步光纤网（SONET）


    # • 光纤传输网的标准


    同步光纤网（SONET）标准：（美国88年制定）


    +   - 以51.84Mbps为基准进行递增

    +   - 可支持铜缆和光纤

    +   - 基于铜缆的电信号传输称为第一级同步传送信号（STS-1）

    +   - 基于光纤的光信号传输称为第一级光载波（OC-1）'
