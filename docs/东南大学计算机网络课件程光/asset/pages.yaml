- pgno: 577
  md: '# （3）网桥的功能及特点


    +   - **地址过滤。** 具有统一的数据链路层的编址格式，网桥能够识别各种地址，并**根据数据帧的宿地址，有选择地让数据帧穿越网桥。**


    +   - **帧限割。** 网桥**不对帧进行分段，只进行必要的帧格式转换，**以适应不同子网。超长帧被丢弃（上层实体协商帧长度）。各子网相对独立，控制帧不能穿越网桥。'
  merge: -1
  img_proc: true
- pgno: 578
  md: '# （3） 网桥的功能及特点


    +   ★ 监控功能 作为单个子网的一部分，参与对子网的监控和对信息帧的校验。具有“存储-转发”的能力，接收帧、检查帧和转发帧。


    +   ★ 缓存能力 适应不同子网对媒体访问的控制方式。


    +   ★ 透明性。 不应影响原有子网的通信能力。'
  merge: -1
  img_proc: true
- pgno: 579
  md: '# （4）网桥的路径选择—避免广播风暴


    问题：多个子网互连时，如何找到分属不同子网的结点？


    基本方法：网桥对信息帧宿地址的处理：如果该地址不属于原子网，则向所有的端口转发（广播）。


    结果：大量的“无用帧”扩散到网上—广播风暴。可能导致帧在网络上的无限制的转发。


    ![](img/0761188ee01704e55ea71e6a97539d38_579_0.png)'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# （4）网桥的路径选择—避免广播风暴


    解决方法：设置地址映射表—有选择地转发；设置计数器—丢弃转发过的帧。


    # 地址映射表的结构：


    ![](img/0761188ee01704e55ea71e6a97539d38_580_0.png)


    | 结点地址 | 网桥端口编号 |

    |---|---:|

    | 0A074B128236 | 2 |

    | 0A77810E52FA | 4 |


    # 地址映射表的使用：


    分析途经网桥的每个帧，如果宿地址出现在映射表中，封装/转发该帧至对应网段（端口），否则广播。'
  merge: -1
  img_proc: true
