- pgno: 62
  md: '# 信道能够通过的频率范围


    +   - 1924 年，奈奎斯特(Nyquist)就推导出了著名的奈氏准则。给出了在假定的理想条件下，为了避免码间串扰，码元的传输速率的上限值。

    +   - 在任何信道中，码元传输的速率是有上限的，否则就会出现码间串扰的问题，使接收端对码元的判决（即识别）成为不可能。

    +   - 如果信道的频带越宽，能够通过的信号高频分量越多，那么就可以用更高的速率传送码元而不出现码间串扰。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 信道带宽、信道容量、信道速率的关系


    # 奈奎斯特（Nyquist）定理


    无噪声下的信道容量（B）与信道带宽（H）的关系：


    ```

    B = 2*H（波特）

    ```


    无噪声下的数据传输速率（C）与信道带宽（H）的关系：


    ```

    C=2*H*log₂N (bps)

    ```


    其中：N为一个码元可取的离散值个数'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 信道带宽、信道容量、信道速率的关系


    例： 普通电话线路带宽约3kHz，对应的信道容量为：

    B = 2*H = 2*3k = 6k （Baud）


    若每个码元可取 16 个不同值，对应信道数据速率为：

    C = 2*3k*log₂16 = 24kbps。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 香农定理


    +   - 香农(Shannon)用信息论的理论推导出了带宽受限且有噪声干扰的信道的极限、无差错的信息传输速率。

    +   - 信道的数据传输速率（C）和信道带宽（H）之间的关系为： $C = H\log_2(1+S/N)$ b/s


    +   - $H$ 为信道的带宽（以 Hz 为单位）；

    +   - $S$ 为信道内所传信号的平均功率；

    +   - $N$ 为信道内部的高斯噪声功率。


    *S/N*: 信噪比


    通常把信噪比表示成 10*lg(S/N) 分贝(dB)。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 香农定理


    +   - 例：已知信噪比为30dB，带宽为3kHz，求信道的最大数据传输速率。

    +     ∵ 10lg(S/N)=30 → lg(S/N)=3 →

    +     S/N=10³=1000

    +     ∴ C = 3k*log₂(1+1000) ≈ 30k bps


    +   - 信道的带宽或信道中的信噪比越大，则信息的极限传输速率就越高。


    +   - 对于带宽已确定的信道，如果信噪比不能再提高了，并且码元传输速率也达到了上限值！


    +   - 如何提高信息的传输速率，可以用编码的方法让每一个码元携带更多比特的信息量。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 信道的差错率/误码率


    由于噪声的影响和信道带宽的限制，信号在传输过程中可能发生失真


    # 差错率/误码率：


    传输比特总数与其中出错比特数的比值；

    Pe = 出错比特数传输/比特总数

    例： 传输10000比特，有2比特出错，

    Pe = 2/10000


    差错率越高表示信道的质量越差


    # 信道的差错率与信号的传输速率


    和传输距离成正比


