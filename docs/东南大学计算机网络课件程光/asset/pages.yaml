- pgno: 458
  md: '# LLC/网络层接口服务规范


    # LLC子层提供的服务和服务原语


    （1）类型1（Type1）：基本的面向无连接的服务。


    +   - 数据传输之前，无需进行对等实体之间的连接；

    +   - 数据传输时，不提供差错恢复、流量控制和排序功能；

    +   - 数据传输可以是点到点、一點到多点，或广播方式进行；


    提供数据报服务，适用于对数据传输可靠性要求不高，或者可由高层采取措施保证数据传输可靠性的环境。


    ![](img/0761188ee01704e55ea71e6a97539d38_458_0.png)'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# LLC/网络层接口服务规范


    面向无连接的数据传输服务原语：


    +   - L-DATA. req (LA, RA, LS, SC)，

    +   - L-DATA. ind (LA, RA, LS, SC)，


    LA/RA：本地和远程的结点地址，

    LS：被传输的LSDU，

    SC：有关的传输控制信息（例如：优先级）。


    ![](img/0761188ee01704e55ea71e6a97539d38_459_0.png)'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# LLC：基本的面向连接的服务。


    +   - 数据传输之前，需建立对等实体之间的连接；

    +   - 数据传输在点到点之间发生，提供DL的差错恢复、流量控制和排序等功能。

    +   - 每次通信都要经历连接建立、数据传输和释放连接的过程。可以进一步地提高数据传输的可靠性。


    ![](img/0761188ee01704e55ea71e6a97539d38_460_0.png)'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# LLC：基本的面向连接的服务。


    # 面向连接的数据传输服务原语


    +   • 建立连接


    L-CONNECT. req (LA, RA, SC),


    L-CONNECT. ind (LA, RA, S, SC),


    L-CONNECT. cnf (LA, RA, S, SC),


    +   • 连接复位


    L-RESET. req (LA, RA),


    L-RESET. ind (LA, RA, R),


    L-RESET. cnf (LA, RA, S),


    # 数据传输


    L-DATA. req (LA, RA, LS),


    L-DATA. ind (LA, RA, LS),


    L-DATA. cnf (LA, RA, S),


    ![](img/0761188ee01704e55ea71e6a97539d38_461_0.png)'
  merge: -1
  img_proc: true
- pgno: 462
  md: '# 面向连接的数据传输服务原语


    +   - 连接释放：

    +     L-DISCONNECT.req(LA, RA)，

    +     L-DISCONNECT.ind(LA, RA, R)，

    +     L-DISCONNECT.cnf(LA, RA, S)，

    +   - 流量控制：

    +     L-CONNECT-FLOWCONTROL.req(LA, RA, A)，高层实体向LLC实体请求控制来自LLC子层的数据流量；

    +     L-CONNECT-FLOWCONTROL.ind(LA, RA, A)，LLC实体向高层实体指示控制来自网络层的数据流量。

    +     A：允许通过的数据流量信息。 R：释放原因，S：成功程度。'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# LLC/LLC对等协议规程


    +   - 定义LLC实体之间交换的帧（LLC PDU）的格式，以及双方交换帧的时序。


    ![](img/0761188ee01704e55ea71e6a97539d38_463_0.png)


    +   - LLC PDU格式


    | DSAP | SSAP | AC | DATA |



    DSAP: 信宿地址

    SSAP：源地址


    AC:访问控制字段(类似于HDLC)

    DATA: 上层数据


    LLC协议完全是参照HDLC的异步平衡模式制定的。'
  merge: -1
  img_proc: true
