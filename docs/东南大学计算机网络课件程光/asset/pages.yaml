  md: "# ★ 千兆以太网的优势\n\n千兆以太网的优势表现在：\n\n+   (1) 低价位的高带宽，可与以太网、快速以太网平滑互联；\n+   \n+ \
    \  (2) 利用以太网知识即可管理、监视和维护千兆以太网；\n+   \n+   (3) 千兆以太网是组建核心骨干网的技术。\n\n千兆以太网的应用越来越广，千兆以太网交换机作为企业网/校园网的主干设备。\n\
    \n向城域网（MAN）扩展，在广域网（WAN）上将散布在整个城市的大楼或校园连接在一起。"
