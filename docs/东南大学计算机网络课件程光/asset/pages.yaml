  md: '# 第2章 数据通信原理


    +   - 通信系统

    +   - 信道（有线信道、无线信道）

    +   - 信道带宽（H）、信道容量（B）、数据传输速率（C）之间的关系

    +   - 奈奎斯特（Nyquist）定理

    +     无噪声： B = 2*H（波特） C= B*log2N （bps）

    +   - 香农(Shannon)定理

    +     有噪声： C = Hlog2(1+S/N) b/s 信噪比=10*lg(S/N)（db）


