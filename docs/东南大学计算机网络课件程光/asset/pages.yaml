- pgno: 874
  md: '# 远程接入VPN

    (remote access VPN)


    +   - 有的公司可能没有分布在不同场所的部门，但有很多流动员工在外地工作。公司需要和他们保持联系，远程接入 VPN 可满足这种需求。

    +   - 在外地工作的员工拨号接入因特网，而驻留在员工 PC 机中的 VPN 软件可在员工的 PC 机和公司的主机之间建立 VPN 隧道，因而外地员工与公司通信的内容是保密的，员工们感到好像就是使用公司内部的本地网络。'
  merge: -1
  img_proc: true
- pgno: 875
  md: '# 2 网络地址转换 NAT

    (Network Address Translation)


    +   - 网络地址转换 NAT 方法于1994年提出。

    +   - 需要在专用网连接到因特网的路由器上安装 NAT 软件。装有 NAT 软件的路由器叫做 NAT 路由器，它至少有一个有效的外部全球地址 IP_G。

    +   - 所有使用本地地址的主机在和外界通信时都要在 NAT 路由器上将其本地地址转换成 IP_G 才能和因特网连接。'
  merge: -1
  img_proc: true
- pgno: 876
  md: '# 网络地址转换的过程


    +   - 内部主机 X 用本地地址 IPₓ 和因特网上主机 Y 通信所发送的数据报必须经过 NAT 路由器。

    +   - NAT 路由器将数据报的源地址 IPₓ 转换成全球地址 IPᴳ，但目的地址 IPᵧ 保持不变，然后发送到因特网。

    +   - NAT 路由器收到主机 Y 发回的数据报时，知道数据报中的源地址是 IPᵧ 而目的地址是 IPᴳ。

    +   - 根据 NAT 转换表，NAT 路由器将目的地址 IPᴳ 转换为 IPₓ，转发给最终的内部主机 X。'
  merge: -1
  img_proc: true
- pgno: 877
  md: '# 下一代的网际协议 IPv6 (IPng)

    1 解决 IP 地址耗尽的措施


    +   - 从计算机本身发展以及从因特网规模和网络传输速率来看，现在 IPv4 已很不适用。

    +   - 最主要的问题就是 32 位的 IP 地址不够用。

    +   - 要解决 IP 地址耗尽的问题的措施：

    +     - 采用无类别编址 CIDR，使 IP 地址的分配更加合理。

    +     - 采用网络地址转换 NAT 方法以节省全球 IP 地址。

    +     - 采用具有更大地址空间的新版本的 IP 协议 IPv6。'
  merge: -1
  img_proc: true
- pgno: 878
  md: '# 2 IPv6 的基本首部


    +   - IPv6 仍支持无连接的传送所引进的主要变化如下

    +   - 更大的地址空间。IPv6 将地址从 IPv4 的 32 位增大到了 128 位。

    +   - 扩展的地址层次结构。

    +   - 灵活的首部格式。

    +   - 改进的选项。

    +   - 允许协议继续扩充。

    +   - 支持即插即用（即自动配置）

    +   - 支持资源的预分配。'
  merge: -1
  img_proc: true
- pgno: 879
  md: '# IPv6 数据报的首部


    +   - IPv6 将首部长度变为固定的 40 字节，称为基本首部(base header)。

    +   - 将不必要的功能取消了，首部的字段数减少到只有 8 个。

    +   - 取消了首部的检验和字段，加快了路由器处理数据报的速度。

    +   - 在基本首部的后面允许有零个或多个扩展首部。

    +   - 所有的扩展首部和数据合起来叫做数据报的有效载荷(payload)或净负荷。'
  merge: -1
  img_proc: true
