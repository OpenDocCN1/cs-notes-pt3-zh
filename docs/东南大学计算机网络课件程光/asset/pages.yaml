- pgno: 632
  md: '# （1）因特网的提出


    1957年，苏联发射了人类第一颗人造地球卫星“Sputnik”。作为响应，美国国防部(DoD)组建了高级研究计划局(ARPA)，开始将科学技术应用于军事领域。


    1961年7月，MIT的Leonard Kleinrock发表相关分组交换的论文："Information Flow in Large Communication
    Nets"。


    1967年，MIT的Lawrence G. Roberts发表第一篇关于ARPANET设计的论文"Multiple Computer Networks and
    Intercomputer Communication"。


    1968年，DARPA资助BBN开发ARPANet，要求具有抗毁性；'
  merge: -1
  img_proc: true
- pgno: 633
  md: '# （1）因特网的提出


    1969年，使用BBN的IMP和AT&T的50kpbs的通信线路，构建了4个节点的ARPANET（加州大学洛杉矶分校、斯坦福研究院、加州大学圣巴巴拉分校和犹他州大学）。


    1971年，ARPANET上连接了15个节点(23台主机)：UCLA、SRI、UCSB、Univ of Utah、BBN、MIT、RAND、SDC、Harvard、Lincoln
    Lab、Stanford、UIU(C)、CWRU、CMU、NASA/Ames。


    1973年，ARPANET首次进行国际联网：伦敦大学(英国)和NORSAR(挪威)。其它厂商也在致力联网技术的研究和应用。


    1974年，Vinton Cerf和Bob Kahn发表相关TCP协议设计的论文：A Protocol for Packet Network Interconnection；（TCP雏形）


    1978年，TCP分解成TCP和IP两个协议。'
  merge: -1
  img_proc: true
- pgno: 634
  md: '# （1）因特网的提出


    80年代初，DARPA启动 “The Interneting Project”；采用TCP/IP协议集；


    1982年，“Internet” 定义为通过TCP/IP协议连接起来的“internet”。DoD宣布将TCP/IP协议作为DoD标准网络协议；资助BBN+Berkley公司将该TCP/IP嵌入UNIX。。


    1983年1月1日，ARPANET从NCP协议切换为TCP/IP协议，入网主机必须执行TCP/IP协议集（83年）；


    90年代初，MCI、IBM和MERIT公司联合组建“高级网络服务公司ANS”，对因特网实现商业化管理（91年容许商用）；


    政府资助+商业支持+缺乏更多的选择余地等，促进了TCP/IP技术和因特网的普及，渗透全球和各行各业。'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# （2）中国的因特网记事


    ★ 1986年，国家“七五”项目：OSI标准的制定和验证；

    软件所、15所、清华、复旦、上海交大、南京工学院等9所高校、科研院所，遵循OSI标准，实现上海和北京的机器互连通信，服务：MHS、FTAM和VT；


    ★ 1988年，中国科研网（CRN）启动；1989年5月，CRN通过德国研究网（DFN）的网关与Internet沟通，开通电子邮件和文件传输服务，成员单位包括：电科院、15所、清华大学、30所、54所、复旦大学和上海交大、东南大学等单位。


    ★ 1990年10月，中国注册登记顶级域名CN；因中国尚未正式接入因特网，德国卡尔斯鲁厄大学运行CN域名服务器。


    ★ 1993年12月，中关村地区教育/科研示范网络（NCFC）完工；1989年9月启动，覆盖北大、清华和中科院，高速互联和超级计算中心。'
  merge: -1
  img_proc: true
- pgno: 636
  md: '# （2）中国的因特网記事（续）


    ★ 1994年4月，中国正式接入因特网；通过美国Sprint公司连入因特网的64K国际专线开通，实现了与因特网的全功能连接，中国成为开通因特网的国家。


    ★ 1994年5月21日，中国科学院计算机网络信息中心接管中国国家顶级域名(CN)。


    ★ 1994年9月，电信启动中国公用计算机互联网络(Chinanet)；通过美国Sprint公司，开通2条64K专线：北京和上海，95年1月社会服务。


    ★ 1994年10月，启动中国教育和科研计算机网（CERNET）连接全国大部分高校和中学，推动我国教育和科研事业的发展。（东南大学：CERNET主结点）'
  merge: -1
  img_proc: true
