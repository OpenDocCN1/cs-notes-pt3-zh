    | IP地址 | 主机名 |

    | 127.0.0.1 | Localhost |

    | 202.119.83.1 | route1 |

    | 202.119.83.5 | wwwserver |

    | 202.119.83.29 | ftpserver |

    | 202.119.83.135 | mailserver |

    | …… |  |


    ![](img/0761188ee01704e55ea71e6a97539d38_726_0.png)'
