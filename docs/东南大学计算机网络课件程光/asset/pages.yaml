- pgno: 370
  md: '# 令牌总线的令牌维护


    问题：令牌的丢失，出现多个令牌。需要维护。


    # 令牌传递


    +   1. 有令牌的结点在发送完信息，执行环路维护工作，将令牌传递给后继结点；

    +   2. 监听媒体。监听到合法帧的传递，后继结点已获得令牌，并正常工作；

    +      如果在规定时间内未监听到信息在媒体上的传输，执行一次令牌重传。


