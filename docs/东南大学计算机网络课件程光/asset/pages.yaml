  md: '# ★以太网的变迁（六）——万兆位以太网


    1999年3月，开始讨论10G（万兆）以太网；


    2000年1月，802.3ae分委会开始工作，计划02年春出标准；


    2000年7月，3Com、Cisco、Extreme、Intel等10公司成立10G以太网联盟(10GEA)，研究10G以太网产品。


    2002年7月公布IEEE 802.3ae。


    特点：保留以太网帧格式，以及帧长度规定，可和现有系统过渡。'
