- pgno: 965
  md: '# TCP 可靠通信的具体实现


    +   - TCP 连接的每一端都必须设有两个窗口——一个**发送窗口**和一个**接收窗口**。

    +   - TCP 的可靠传输机制用**字节的序号**进行控制。TCP 所有的确认都是**基于序号**而不是基于报文段。

    +   - TCP 两端的四个窗口经常处于**动态变化**之中。

    +   - TCP 连接的往返时间 RTT 也**不是固定不变的**。需要使用特定的算法估算较为合理的重传时间。'
  merge: -1
  img_proc: true
