  md: '# 滑动窗口协议—停等协议的改进


    (1) 发方可以连续发送多块数据（块数限于窗口尺寸）;


    (2) 收方对每块数据进行差错分析，如果发现错误，立即反馈发送方;


    (3) 收方可对收到的多个正确的数据块进行一次性确认;


    (4) 发方根据反馈的结果，重发指定的数据块（SB），或重发指定数据块及其之后的所有数据块（GBN），或者直接发送后续数据块。


