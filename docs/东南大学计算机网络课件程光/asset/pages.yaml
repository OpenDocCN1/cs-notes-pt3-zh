  md: '# MPLS 标记


    +   - MPLS 标记一旦产生就压入到标记栈中，而整个标记栈放在数据链路层首部和IP首部之间。

    +   - 栈是一种后进先出的数据结构。MPLS 协议规定，标记栈的栈顶（最后进入栈的标记）最靠近数据链路层首部，而栈底最靠近 IP 首部。

