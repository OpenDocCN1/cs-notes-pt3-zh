  md: '# 7.2 因特网地址


    网络地址：标识和识别网络设备的唯一手段；


    +   (1) 因特网地址之一：IP地址


    IP地址唯一地标识因特网上的一个设备


    上网的每个设备应至少获得一个IP地址


    * IP地址格式（IPv4）：32位（4个字节）


    一般格式：


    类别 + Netid（网络标识）+ Hostid（主机标识）


    “点分”十进制表示法：X1. X2. X3. X4


    例：202.119.11.1'
