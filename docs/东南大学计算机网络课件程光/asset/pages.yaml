- pgno: 737
  md: '# （2）IP地址向物理地址的映射——ARP


    # 封装ARP报文的以太网帧结构（RFC894）：


    宿地址 源地址 0806 ARP报文 PAD CRC （字节） 6 6 2 28 18 4


    物理网络类型 协议类型 物理网络地址长度 协议地址长度 ARP请求/应答 源硬件地址 源协议地址 宿硬件地址 宿协议地址 （B） 2 2 1 1 2 6 4
    6 4


    0x0001 0x0800 06 04 1/2 Es Is Ed Id


    ![](img/0761188ee01704e55ea71e6a97539d38_737_0.png)


    # 基本思路：


    一具有广播能力的网络（如，各种类型的局域网）


    +   ① A广播发送ARP请求帧（带收方IP地址、本机IP地址和物理地址）;


    +   ② B收到A发来的ARP请求，用ARP响应帧予以响应，返回自己的物理地址;


    +   ③ 双方用物理地址在物理网中进行数据通信。'
  merge: -1
  img_proc: true
- pgno: 738
  md: '# （2）IP地址向物理地址的映射——ARP（续）


    # 封装ARP报文的以太网帧结构（RFC894）：


    宿地址 6 源地址 6 0806 ARP报文 28 PAD 18 CRC 4 （字节）


    物理网类型 2 协议类型 2 物理地址长度 1 协议地址长度 1 ARP请求/应答 2 源硬件地址 6 源协议地址 4 宿硬件地址 6 宿协议地址 4 （B）


    0x0001 0x0800 06 04 1/2 Es Is Ed Id


    00aa0062c609 202.119.11.25 A 00aa00c62362 202.119.11.35 B R


    A广播发送封装ARP请求的以太网帧：


    ```

    ffffffffffff 00aa0062c609 0806 0001 0800 06 04 01 00aa0062c609 ca770b19 000000000000
    ca770b23 ...

    ```


    其中：宿地址为ffffffffffff为以太网的广播帧


    0xca770b19=202.119.11.25； 0xca770b23=202.119.11.35；'
  merge: -1
  img_proc: true
