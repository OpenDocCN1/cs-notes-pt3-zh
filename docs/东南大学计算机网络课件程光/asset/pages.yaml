- pgno: 402
  md: '# 时间片环（802.7）


    # 基本原理：


    时间片环的依据：


    环路的数据传输和转发器的处理延时，


    整个环路可以被视为等效的循环移位寄存器。


    循环移位寄存器的位数 = （电信号传播延迟（5us/km）× 传输媒体长度＋转发器延时）× 数据传输速率。


    ![](img/0761188ee01704e55ea71e6a97539d38_402_0.png)'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 时间片环（802.7）


    例：100个节点组成的环路，节点间距为100米，

    假设每个转发器的处理延时为2us，

    网络传输速率为10Mbps（等价于10b/us），

    则整个环路等价于2500位的循环移位寄存器，

    100个转发器总延时：                100×2us=200us；

    100段线路传输总延时：

    100米×100段=10000米（延时50us）；

    环路等价的循环移位寄存器：

    （200+50）us×10b/us=2500b


    ![](img/0761188ee01704e55ea71e6a97539d38_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# 时间片环（802.7）


    +   - 时间片划分（槽）：将整个循环移位寄存器视作一列首尾衔接的列车，槽（时间片）对应了列车的车厢，用于传输数据。


    +   - 数据帧的装拆工作：将数据帧拆卸为适合槽传输的数据块（逻辑小分组）


    +   - 时间片环同一时刻可能有多个结点发送数据，网上有多个逻辑小分组在传输。


    +   - 整个环路对应的循环移位寄存器应该是时间片的整数倍。每个结点都可以插入一定量的移位寄存器，并由环路中的监控器负责整数倍的工作。


    ![](img/0761188ee01704e55ea71e6a97539d38_404_0.png)'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # 时间片环数据帧格式


    ### 帧格式


    | P | L | DA | SA | DATA | PAD | FCS |

    |---|---|----|----|------|-----|-----|

    | 2 | 2 | 2/6 | 2/6 | 1–65535 | 0/1 | 2 |


    单位：字节


    ### 逻辑小分组


    | S | F/E | M | da | sa | DATA | T | R | P |

    |---|-----|---|----|----|------|---|---|---|

    | 1 | 1 | 1 | 8 | 8 | (2, 4, 6, 8)×8 | 2 | 2 | 1 |


    单位：位


    +   - **帧开始标志（P）**：标识帧的开始，同时指出地址的类型。

    +   - **填充字段（PAD）**：目的是保证DATA和PAD两字段之和为偶数个字节。

    +   - **引导比特（S）**：为“1”，表示逻辑小分组（或者时间片）的开始。

    +   - **槽满/空标识（F/E）**：表示当前槽是否已存放数据，满为1，空为0。

    +   - **监控位（M）**：监控槽的运行状态，结点发送时，置0，监控器置1。'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # 时间片环数据帧格式


    ![](img/0761188ee01704e55ea71e6a97539d38_406_0.png)


    **宿/源地址（da/sa）**：收发逻辑小分组的终点地址（255表示广播小分组，0：本地址）。


    +   - **结点类型（T）**：结点是否为基本型或增强型。

    +   - **应答位（R）**：宿结点填写，表示逻辑小分组的接收情况（01为正确接收，

    +   - **校验位（P）**：采用偶校验。'
