- pgno: 1113
  md: '# 网络安全


    信息需要保密 信息需要共享


    # 网络安全的要考虑的几个方面


    +   (1) 网络系统的安全：网络操作系统的安全性；来自外部的安全威胁；来自内部用户的安全威胁；通信协议软件本身缺乏安全性；病毒感染；应用服务的安全等。

    +   (2) 局域网安全：广播方式

    +   (3) Internet互连安全：非授权访问、冒充合法用户、破坏数据完整性、干扰系统正常运行、利用网络传播病毒等。

    +   (4) 数据安全：本地数据安全：本地数据被人删除、篡改，外人非法进入系统。网络数据安全：数据在传输过程中被人窃听、篡改。如数据在通信线路上传输时被人搭线窃取，数据在中继结点机上被人篡改、伪造、删除等。'
  merge: -1
  img_proc: true
- pgno: 1114
  md: '# 网络安全


    ![](img/0761188ee01704e55ea71e6a97539d38_1114_0.png)


    +   - 截取（窃取）：非法截取网络信息，窃取其中的机密；

    +   - 篡改：对截取的数据进行部分/全部篡改，再送到目的地；

    +   - 冒充：冒充合法用户进行网络操作，嫁祸于人；

    +   - 重播/插播：干扰用户的正常操作；

    +   - 发方否认：否认已向接受者发送过数据；

    +   - 收方否认：否认已收取过发送方发送的数据。'
  merge: -1
  img_proc: true
- pgno: 1115
  md: '# ③ 抵御攻击的安全服务


    | 网络安全服务 | 功能描述 |

    |---|---|

    | 内容保密 | 防止报文内容被未授权地阅读，防窃取； |

    | 内容完整性 | 保证被交换的报文未被篡改，防篡改； |

    | 序列完整性 | 防止数据的重播和丢失，防重播和插播； |

    | 实体鉴别 | 鉴别数据的来源和通信实体的身份，防伪造/冒充； |

    | 抗发方否认 | 防御发送方否认曾经发送过报文；防否认 |

    | 抗收方否认 | 防御接收方否认曾经收取过报文。 |



    注：所有的服务只能保证出现的攻击可以被识别，并不能防止攻击的发生。


    上述安全服务的基础：密码学——数据加密技术'
  merge: -1
  img_proc: true
- pgno: 1116
  md: '# 网络安全的措施


    # 局域网安全措施：


    进行局域网网络分段，将非法用户与网络资源相互隔离，从而达到限制用户非法访问的目的。


    将整个网络分成若干个虚拟网段（IP子网），各子网之间无法直接通信，必须通过路由器、路由交换机、网关等设备进行连接，可利用这些中间设备的安全机制来控制各子网间的访问。


    # Internet互连安全措施：


    在Internet网络与内部网之间设置一道屏障，防止黑客进入内部网。由用户制定安全访问策略，抵御黑客的侵袭，主要方法有：IP地址过滤，服务代理等。


    ![](img/0761188ee01704e55ea71e6a97539d38_1116_0.png)'
  merge: -1
  img_proc: true
- pgno: 1117
  md: '# 网络安全的措施


    # 数据安全措施


    加密/解密技术：为提高信息系统及数据的安全性和保密性，使得数据以密文的方式进行传输和存储，防止数据在传输过程中被别人窃听、篡改。数据加密是所有数据安全技术的核心。


    密钥管理：在加密过程中，加密算法和密钥是两个关键的部分，但现在倾向于把算法公开，让所有的秘密包含在密钥中，密钥管理涉及密钥的整个生存周期，包括密钥的生成、验证、传递、保管、使用、销毁。


    数字签名：数字签名与传统的签名具有类似的功能，可以防止伪造与抵赖。数据完整性技术主要是用来保证数据在传输过程中不被篡改。


    认证技术：认证是用来防止入侵者进行假冒、篡改等。通常人们利用认证技术作为保护网络安全的第一道防线。'
  merge: -1
  img_proc: true
