- pgno: 407
  md: '# 时间片环工作过程


    +   • 有数据帧待发的结点，分段数据帧，组成逻辑小分组，并等待时间片的到来；


    +   • 一旦识别到空的时间片（ F/E=0），结点将逻辑小分组填入时间片（槽），置时间片满（ F/E=1），发送到传输媒体上；


    +   • 匹配宿地址的接收结点复制逻辑小分组（组装成帧）；并且根据小分组的接收情况，置起应答位（R），同时转发时间片；


    +   • 环中时间片个数固定的，发送结点可以根据时间片计数或者源地址判断发送的逻辑小分组的返回；


    +   • 发送结点撤消小分组，释放空时间片；并且根据返回的应答信号，确定在获得新的空时间片后是否进行继续发送或者重传；


    +   • 规定：任一时刻，每个结点 只能有一个逻辑小分组在环中流动


    ![](img/0761188ee01704e55ea71e6a97539d38_407_0.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 时间片环的特点


    +   - 环路中可以同时存在多个时间片，允许多个结点同时访问媒体，传输数据；

    +   - 被传输的逻辑小分组长度固定；

    +   - 时间片中有效数据成分少，并且，如果某一时刻只有少数结点要求发送数据，则多个时间片无法被利用，因此线路利用率较低。


    ![](img/0761188ee01704e55ea71e6a97539d38_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 光纤分布数字接口(FDDI)


    对应的国际标准号为： ISO 9314。

    FDDI采用了IEEE 802.5令牌环技术。


    FDDI的拓扑结构： 环形结构

    传输媒体： 光纤。


    双环结构（分别称为主/副环）， 提高可靠性，


    主环： 支持正常时的数据传输工作，


    副环： 作为一种冗余设施，保证在主环故障或者结点故障时环路仍然可以正常地工作。


    ![](img/0761188ee01704e55ea71e6a97539d38_409_0.png)'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# # 光纤分布数字接口(FDDI)


    # ## FDDI的特点：


    +   1. FDDI双环的拓扑


    +   2. 多帧传输：获得令牌的结点，在发完数据帧之后，立即释放令牌，任一时刻，环中允许有多个数据帧被传输。多帧传输，可以提高网络带宽的利用率。


    +   3. 传输编码：FDDI采用4b/5b编码和不归0交替编码，可以以125MHz的时钟频率获得100Mbps的数据带宽，既降低成本，又提高速率。


    +   4. 长距离通信：主要传输媒体为光纤，多模光纤可达2km，单模光纤可达100km


    +   5. 高可靠性：FDDI除采用双环结构外，还采用双归宿冗余设计（即每个设备可以挂接到两个环路结点上），提高网络的可靠性；'
  merge: -1
  img_proc: true
