- pgno: 784
  md: '# 不应发送 ICMP 差错报告报文的几种情况


    +   - 对 ICMP 差错报告报文不再发送 ICMP 差错报告报文。


    +   - 对第一个分片的数据报片的所有后续数据报片都不发送 ICMP 差错报告报文。


    +   - 对具有多播地址的数据报都不发送 ICMP 差错报告报文。


    +   - 对具有特殊地址（如127.0.0.0 或 0.0.0.0）的数据报不发送 ICMP 差错报告报文。'
