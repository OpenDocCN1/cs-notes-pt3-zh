    信息字段代码为： 1011001 对应 m(x)=x⁶+x⁴+x³+1


    生成多项式： g(x)=x⁴+x³+1 对应代码： 11001


    则 x⁴ m(x)=x¹⁰+x⁸+x⁷+x⁴ 对应代码： 10110010000


    除法： 1101010

    11001 √10110010000

    11001

