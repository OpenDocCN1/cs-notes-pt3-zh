  merge: -1
  img_proc: true
- pgno: 819
  md: '# 划分区域


    +   - 划分区域的好处就是将利用泛洪法交换链路状态信息的范围局限于每一个区域而不是整个的自治系统，这就减少了整个网络上的通信量。

    +   - 在一个区域内部的路由器只知道本区域的完整网络拓扑，而不知道其他区域的网络拓扑的情况。

    +   - OSPF 使用层次结构的区域划分。在上层的区域叫作**主干区域**（backbone area）。主干区域的标识符规定为 0.0.0.0。主干区域的作用是用来连通其他在下层的区域。'
  merge: -1
  img_proc: true
