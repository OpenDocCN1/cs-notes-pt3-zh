- pgno: 713
  md: '# 3. 使用二叉线索查找路由表


    +   - 当路由表的项目数很大时，怎样设法减小路由表的查找时间就成为一个非常重要的问题。

    +   - 为了进行更加有效的查找，通常是将无分类编址的路由表存放在一种层次的数据结构中，然后自上而下地按层次进行查找。这里最常用的就是二叉线索 (binary
    trie)。

    +   - IP 地址中从左到右的比特值决定了从根结点逐层向下层延伸的路径，而二叉线索中的各个路径就代表路由表中存放的各个地址。

    +   - 为了提高二叉线索的查找速度，广泛使用了各种压缩技术。'
  merge: -1
  img_proc: true
