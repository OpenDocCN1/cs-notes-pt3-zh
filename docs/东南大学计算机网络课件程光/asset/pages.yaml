    +   理由：用户可能习惯连续地访问相同的系统。


    +   • 补充说明

    +   ☆ 一台计算机可以有多个域名；

    +   ☆ 按名访问，无需知道该计算机的物理位置；

    +   ☆ 主机IP地址改变，不会影响对该主机的访问；

    +   ☆ 主机IP地址改变，需要在本地DNS服务器上进行维护。（修改DNS数据库）'
  merge: -1
  img_proc: true
