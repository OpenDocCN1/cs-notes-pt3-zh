- pgno: 589
  md: '# 透明网桥（Transparent Bridge）


    透明网桥由各个网桥自己来决定路由选择，局域网上的各结点不负责路由选择，网桥对于互连局域网的各结点来说是“透明”的。


    透明网桥的标准： IEEE 802.1d或ISO 8802.1d。


    透明网桥一般用在两个使用同样的MAC层协议的网段之间的互连。如两个Ethernet网。


    ![](img/0761188ee01704e55ea71e6a97539d38_589_0.png)'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# 源路选网桥（Source Routing Bridge）


    源路选网桥由发送帧的源结点负责路由选择。


    假定每个结点在发送帧时，都已经清楚地发往各个目的结点的路由，在发送帧时将详细的路由信息放在帧的首部中。


    标准： IEEE 802.5， IBM令牌环


    如何发现适合的路由？


    ![](img/0761188ee01704e55ea71e6a97539d38_590_0.png)'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# 源路选网桥（Source Routing Bridge）


    如何发现适合的路由？


    源结点以广播方式向目的结点发送一个用于探测的发现帧（discovery frame），发现帧将整个通过网桥互连的局域网中沿着所有可能的路由传送。


    在传送过程中，每个发现帧都记录所经过的路由。当这些发现帧到达目的结点时，就选择出一个最佳路由。（跳步数最少的路径）。


    ![](img/0761188ee01704e55ea71e6a97539d38_591_0.png)'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# 网桥实例—以太网交换器（交换式集线器）


    简化的网桥，用于以太网的互连。由于网络的网络具有相同的协议，交换机无需进行协议转换，延迟小，交换速度快。


    +   **特点：**

    +   1. 支持少量的存储能力（缓冲）、

    +   2. 少量的地址表（提高查表速度）

    +   3. 处理相同的帧格式（相同类型的网络互连）。

    +   4. 具有分割子网的功能，

    +   5. 每个端口独享指定的带宽。

    +   6. 支持多个独立的数据流，具有较多的吞吐量

    +   7. 硬件交换，交换速度快。


    一般的网桥：同一时刻只有一对端口通信

    　　　　　　　通过软件实现协议转换

    交换器：同一时刻可有多对端口在通信


    ![](img/0761188ee01704e55ea71e6a97539d38_592_0.png)'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# 以太网交换器


    # 交换器的缓冲：


    如何设置缓冲，使得数据帧在交换器中延迟最小？


    **在每对端口之间都建立一对独立的缓冲器，

    每个缓冲器仅存储从一个固定的端口发来的并在传送

    到另一固定端口去的帧。


    # 地址解析：


    如何以最快的速度对以太网的MAC地址进行解码，

    并确定目的端口，完成地址匹配？


    **有效地管理站点的“老化”和“认识”：


    +   - “老化”：长时间未有数据帧传送的站点

    +   - “认识”：新的结点


    **周期地唤醒“不活动”时间超过预定时间限制的结点，

    将帧正确地广播到所有未知地址的端口。


    ![](img/0761188ee01704e55ea71e6a97539d38_593_0.png)'
  merge: -1
  img_proc: true
