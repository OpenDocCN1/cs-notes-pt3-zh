- pgno: 844
  md: '# “转发”和“路由选择”的区别


    +   - “转发”（forwarding）就是路由器根据转发表将用户的 IP 数据报从合适的端口转发出去。

    +   - “路由选择”（routing）则是按照分布式算法，根据从各相邻路由器得到的关于网络拓扑的变化情况，动态地改变所选择的路由。

    +   - 路由表是根据路由选择算法得出的。而转发表是从路由表得出的。

    +   - 在讨论路由选择的原理时，往往不去区分转发表和路由表的区别，'
  merge: -1
  img_proc: true
