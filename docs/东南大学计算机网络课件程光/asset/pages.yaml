- pgno: 327
  md: "# ★ 工作过程（发送）\n\n```\n高层有数据发送（LLC）\n↓\n封装MAC帧\n↓\n侦听媒体\n↓\n媒体上有无数据在传输？\n├─ 有\
    \ → 按策略退避 → 退避时间是否到？\n│       ├─ 未到 → 继续等待\n│       └─ 已到 → 退避次数是否超过？\n│     \
    \            ├─ 未超过 → 继续侦听媒体\n│                 └─ 已超过 → 通知LLC网络太忙\n└─ 无 → 等待9.6us仍空闲？\n\
    \        ├─ 否 → 继续侦听媒体\n        └─ 是 → 发送数据\n                ↓\n             发送数据是否冲突？\n\
    \             ├─ 冲突 → 强化冲突 → 返回侦听媒体\n             └─ 无冲突 → 等待Ack\n           \
    \              ├─ 超时 → 超时2次？\n                         │         ├─ 否 → 重新发送数据\n\
    \                         │         └─ 是 → 发送失败\n                         └─ 收到Ack\
    \ → 发送成功\n```\n\n![](img/0761188ee01704e55ea71e6a97539d38_327_0.png)"
  merge: -1
  img_proc: true
