  md: '# （4）因特网的管理－标准化：


    任何人都可以提出值得研究的问题，


    当足够多的人对该问题表示兴趣时，形成工作小组（WG）或者研究组（RG），向IETF或者IRTF提交研究报告（草案→建议标准→草案标准），或者报IAB，形成因特网标准（正式标准）


    所有文档或者标准均以IETF文档形式（RFC xxxx）上网公布。


