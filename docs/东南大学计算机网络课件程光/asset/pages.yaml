  md: '# 局域网(LAN)


    ★ 上节课回顾


    * 总线局域网（CSMA/CD 802.3）


    # CSMA/CD的特点：


    +   (1) 竞争，各节点强占对共享媒体的访问权

    +   (2) 轻负载时，效率较高

    +   (3) 重负载时，冲突概率加大，效率低

    +   (4) 所有节点共享媒体，任何时刻只有一个节点在发信息

    +   (5) 不适合实时传输'
