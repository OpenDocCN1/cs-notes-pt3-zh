- pgno: 911
  md: '# 2 多协议标记交换 MPLS

    (MultiProtocol Label Switching)


    # 1 MPLS 的产生背景


    +   - 在 20 世纪 80 年代，出现了一种思路：用面向连接的方式取代 IP 的无连接分组交换方式，这样就可以利用更快捷的查找算法，而不必使用最长前缀匹配的方法来查找路由表。

    +   - 这种基本概念就叫做**交换**(switching)。

    +   - 人们经常把这种交换概念与**异步传递方式** ATM (Asynchronous Transfer Mode)联系起来，

    +   - 在传统的路由器上也可以实现这种交换'
  merge: -1
  img_proc: true
