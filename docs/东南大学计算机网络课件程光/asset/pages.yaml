- pgno: 938
  md: '# 运输层的主要功能


    +   - 运输层为**应用进程之间**提供端到端的逻辑通信（但网络层是为**主机之间**提供逻辑通信）。

    +   - 运输层还要对收到的报文进行差错检测。

    +   - 运输层需要有两种不同的运输协议，即面向连接的 TCP 和无连接的 UDP。'
  merge: -1
  img_proc: true
- pgno: 939
  md: '# 两种不同的运输协议


    +   - 运输层向高层用户**屏蔽**了下面网络核心的细节（如网络拓扑、所采用的路由选择协议等），它使应用进程看见的就是好像在两个运输层实体之间有一条端到端的逻辑通信信道。

    +   - 当运输层采用面向连接的 TCP 协议时，尽管下面的网络是不可靠的（只提供尽最大努力服务），但这种逻辑通信信道就相当于一条全双工的**可靠信道**。

    +   - 当运输层采用无连接的 UDP 协议时，这种逻辑通信信道是一条**不可靠信道**。'
  merge: -1
  img_proc: true
- pgno: 940
  md: '# 运输层的两个主要协议


    TCP/IP 的运输层有两个不同的协议：


    +   1. 用户数据报协议 UDP

    +      (User Datagram Protocol)

    +   2. 传输控制协议 TCP

    +      (Transmission Control Protocol)'
  merge: -1
  img_proc: true
