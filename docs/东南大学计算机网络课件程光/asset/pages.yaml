  md: '# ★以太网的变迁（六）—万兆位以太网


    万兆以太网光纤解决方案不论从网络设备成本、安装成本还是维护成本各个方面都远远高于采用双绞线传输万兆的解决方案。


    2006 年6月IEEE批准公布了802.3an-2006标准(10GBase-T)。该标准文件描述了利用铜双绞线物理层（PHY）传输的10Gbps以太网设备，支持万兆以太网在双绞线上传输。'
