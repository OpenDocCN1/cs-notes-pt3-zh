  md: '# 基于路径的路由选择算法


    如何收集整个网络的拓扑信息？


    方法1：结点静态维护路由表，指出到其它结点的距离（跳数）;


    方法2：相邻结点定时交换路由表，并根据邻居结点的路由表修正自己的路由表（修改出口和距离）。


