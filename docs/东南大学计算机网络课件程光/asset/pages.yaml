- pgno: 13
  md: '# # 第一章 计算机网络概述


    # ## 一、网络的发展


    计算机网络：计算机的网络（组成）


    计算机网络：用于计算机之间通信的网络（应用）


    计算机网络 = 计算机技术和通信技术相互渗透和发展的结晶，并在用户需求刺激下发展起来的技术。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # 第一章 计算机网络概述


    # ## 计算机网络发展过程：


    1946年，第1台计算机：ENICA诞生


    +   **硬件发展：** 电子管→晶体管→\

    +   中小规模集成电路→\

    +   大规模/超大规模集成电路→


    +   **软件发展：** 单用户OS→\

    +   分时多用户OS→\

    +   网络OS→\

    +   分布式OS→'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 第一章 计算机网络概述


    计算机网络发展过程：


    单机：单个用户独占系统资源（主机）(46年)


    分时系统： 分时多用户系统（大型机）(50年代末期)


    多个用户利用多台终端共享单台计算机的资源


