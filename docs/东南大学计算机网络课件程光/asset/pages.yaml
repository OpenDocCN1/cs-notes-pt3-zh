- pgno: 1031
  md: '# 3 域名服务器


    +   - 一个服务器所负责管辖的（或有权限的）范围叫做区(zone)。

    +   - 各单位根据具体情况来划分自己管辖范围的区。但在一个区中的所有节点必须是能够连通的。

    +   - 每一个区设置相应的权限域名服务器，用来保存该区中的所有主机的域名到IP地址的映射。

    +   - DNS 服务器的管辖范围不是以“域”为单位，而是以“区”为单位。'
