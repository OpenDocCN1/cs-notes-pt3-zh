- pgno: 734
  md: '# 关于地址映射（IP地址→物理地址）


    # 地址解析协议 ARP


    +   - 不管网络层使用的是什么协议，在实际网络的链路上发送数据帧时，最终还是必须使用硬件地址。


    +   - 每一个主机都设有一个 ARP 高速缓存(ARP cache)，里面有所在的局域网上的各主机和路由器的 IP 地址到硬件地址的映射表。


    +   - 当主机 A --〉 主机 B 发送 IP 数据报，先查看有无主机 B 的 IP 地址。


    +   - 如有，就可查出其对应的硬件地址，再将此硬件地址写入 MAC 帧，然后通过局域网将该 MAC 帧发往此硬件地址。'
  merge: -1
  img_proc: true
- pgno: 735
  md: "# 关于地址映射（IP地址→物理地址）\n\n# 1、具有广播能力的网络（局域网）\n\n主机A与主机B进行数据通信：\n\n+   （1）A发ARP请求广播帧（带接收方IP地址、本机IP地址和物理地址）；\n\
    +   \n+   （2）B收到A发来的ARP请求，给予响应，发ARP响应帧，返回自己的物理地址\n+   \n+   （3）双方用物理地址在物理网中进行数据通信。\n\
    \n![](img/0761188ee01704e55ea71e6a97539d38_735_0.png)"
