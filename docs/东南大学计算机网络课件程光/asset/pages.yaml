- pgno: 69
  md: '# 调制/解调与编码/解码


    调制/解调：利用模拟信道支持数据信息传输的技术


    调制：将数据信息变换成适合于模拟信道上传输的电磁波（载波）信号/码元，（数字-->模拟）


    解调：将从模拟信道上收取的载波信号还原成数据信息。（模拟-->数字）


    调制解调器（Modulator- Demodulator）：具有调制/解调功能的通信设备。


    ![](img/0761188ee01704e55ea71e6a97539d38_69_0.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# ★调制方法—调制依据


    +   1、任何周期为T的函数g(t)都可以展开为Fourier级数（n次谐波叠加），即模拟信号可由三角函数表示


    ```

    g(t)=1/2 c + Σ_{n=1}^{∞} a_n sin(2π n f t) + Σ_{n=1}^{∞} b_n cos(2π n f t)

    ```


    +   2、模拟信号可由三个要素（幅度、频率和相位）予以定义


    ![](img/0761188ee01704e55ea71e6a97539d38_70_0.png)


    调制：三个要素的调制。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# ★ 调制方法：


    # 1、调幅：（幅度调制或移幅键控法ASK）：


    将不同的数据信息（0和1）调制成不同幅度但相同频率的载波信号；


    `g(x) = n*sin(x)`，不同 n 产生不同幅度的载波信号。


    ![](img/0761188ee01704e55ea71e6a97539d38_71_0.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 调制方法


    # 2、调频：（频率调制或移频键控法FSK）：


    将不同的数据信息（0和1）调制为相同幅度，但不同频率的载波信号；


    g(x) = sin(n*x) 不同n产生不同频率的载波信号


    ![](img/0761188ee01704e55ea71e6a97539d38_72_0.png)


    本例仅采用两种不同的频率。


    g=sin x


    g=sin 2x'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 调制方法


    # 3、调相：（相位调制或移相键控法PSK）：


    利用相邻载波信号的相位变化值来表示相邻信号是否具有相同的数据信息值，此时的幅度和频率均不发生变化；


    例如：0—相位变化180度，1—相位不变化；

    或者：00—不变化，01—90度，10—180度，11—270度；


    g(x) = sin(n+x) 不同n产生相位变化不同的载波信号


    相位变化： π 0 π π/2 3π/2 π


    ![](img/0761188ee01704e55ea71e6a97539d38_73_0.png)


    位串1000100 111110对应的载波信号'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 调制/解调的结果


    主机→数字信号→模拟信号 → 模拟信号→数字信号→主机

    数据传输速率

    波特率


    调制设备负责将主机端的数字信号调制成可在模拟信道上传输的模拟信号（符号/码元）。


    调制设备的性能影响信号调制的速率，数据传输速率。


    调制速率（信道速率，或者波特率）：调制设备每秒可调制的符号/码元个数，即信道上每秒传输的符号个数。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 波特率和数据传输速率之间的关系


    如果调制设备的调制速率（波特率）为 M，调制出的每个码元具有 N 种取值（线路的状态数），则有：


    数据传输速率 C = M × log₂N = 波特率 × log₂N


    假设调制设备采用调幅调制技术，每秒调制出一个码元，该码元可取四种幅度之一：


    ![](img/0761188ee01704e55ea71e6a97539d38_75_0.png)


    波特率：1码元/秒；


    数据传输速率：2位/秒'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # 组合调制——提高数据传输速率


    **幅度+频率**


    （2倍速）


    数据信息


