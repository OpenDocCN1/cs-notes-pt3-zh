- pgno: 415
  md: '# 无线局域网


    # 适用场合：


    通过网线连接是不可能的或者非常困难；

    设备放置的位置是不固定的，需要移动的。


    # 无线局域网的特点：


    +   - 用户不必因使用有线传输介质而破坏原有的工作环境

    +   - 可根据需要调整工作站的位置

    +   - 使便携式计算机更容易接入局域网

    +   - 扩大了计算机网络的应用能力及领域'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# 无线局域网


    # 工作方式：


    每台PC机上有一个无线收发机（无线网卡），它能够向网络上的其他PC机发送和接收无线电信号。


    与有线以太网相似，无线局域网也是打包方式发送数据的。每块网卡都有一个永久的、唯一的ID号（地址），而数据包里包含：所要发送的数据，发送和接收地址等信息。


    在向网络中发送数据包之前先检查网络的状态。当它检测到空闲时，就发送数据包；如果检测到此无线电频率上有其他数据的话，就先等待一段时间，然后再试。'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# 无线局域网—802.11


    节点共享特定频率无线信道，使用天线（无线网卡）收发数据；


    潜在问题1：功率决定信号覆盖范围，使用同一频率会造成相互干扰。


    潜在问题2：隐藏终端（对应A的D），当A向C发数据时，B等待，C接收，但D也可能也会发送数据，结果导致C无法正确收取。


    ![](img/0761188ee01704e55ea71e6a97539d38_417_0.png)'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 无线局域网—802.11


    解决方案：CSMA/CA（载波侦听多路访问/冲突避免）（发前侦听，空闲发送，协商频段，避免冲突）;


    协商频段：增加RTS（发送请求）/CTS（发送响应）协议;


    发方A发送RTS，告知C拟发送的数据长度和频段选择；收方C响应CTS，准备收取，同时告知C覆盖范围内的某频段将被占用;


    收方对收取的数据予以确认（ACK），释放占用的频段。


    ![](img/0761188ee01704e55ea71e6a97539d38_418_0.png)'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 无线局域网—冲突避免和避让


    由于RTS（发送请求）使用相同的信道，如果发生冲突，则执行退避算法：


    +   - **退避时间：** 随机数*时间片（8us）；

    +   - **随机数取值：** 0～2^(重发次数+3)-1；

    +   - 重发次数≤7，第5次以后，随机数均取值255；


    # 可用频率：


    +   - 2.4—2.4835Ghz，可分79个频带，北美和欧洲；

    +   - 2.471—2.497Ghz，可分23个频带，日本；

    +   - 2.4465—2.4835Ghz，可分35个频带，法国；


    传输速率：1—4.5M（间隔0.5M）、11Mbps；'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# 无线局域网—扩频通信


    无线局域网物理层的信号传输技术：


    +   跳频扩频（FHSS）

    +   直序扩频技术（DSSS）。


    # 跳频扩频（FHSS—Frequency hopping spread spectrum）：


    +   1、发方：信号按固定的时间间隔从一个频段跳到另一频段。

    +   2、收方：与发方频段相同的顺序序列同步地跳动接收。


    伪随机码：1342


    ![](img/0761188ee01704e55ea71e6a97539d38_420_0.png)'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 无线局域网—扩频通信


    跳频扩频（FHSS—Frequency Hopping Spread Spectrum）：


    3、发送频率变换的顺序有一个伪随机码决定，发送器和接收器使用相同的顺序序列。


    4、发送器和接收器通过公共频段协商伪随机码，后续通信在若干频段传输；


    伪随机码：1342


    ![](img/0761188ee01704e55ea71e6a97539d38_421_0.png)'
