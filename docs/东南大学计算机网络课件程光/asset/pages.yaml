  md: '# # 网络安全技术


    **局域网安全：** 网段划分、虚拟网络


    **Internet互连安全：** 防火墙：


    分组过滤式防火墙；代理服务式防火墙；

    地址迁移式防火墙


    **网络数据安全：**


    **防截取（窃取）：** 数据加密、解密技术：秘密密钥加密体系

    （DES加密算法）、公开密钥加密体系（RSA加密算法）


    **防篡改：** 摘录技术（内容完整性服务）


    **防冒充：** 身份鉴别（用户名、口令）、数据源鉴别（伪造数据、冒充别人）——数字签名技术


    **防重播/插播：** 序列完整性——在报文中增加序号和时标；


    **防否认、抵赖：** 认证技术——认证中心'
