- pgno: 1035
  md: '# 根域名服务器


    # ——最高层次的域名服务器——


    +   - 根域名服务器是最重要的域名服务器。所有的根域名服务器都知道所有的顶级域名服务器的域名和 IP 地址。

    +   - 不管是哪一个本地域名服务器，若要对因特网上任何一个域名进行解析，只要自己无法解析，就首先求助于根域名服务器。

    +   - 在因特网上共有13 个不同 IP 地址的根域名服务器，它们的名称是用一个英文字母命名，从 a 一直到 m（前13 个字母）。'
  merge: -1
  img_proc: true
- pgno: 1036
  md: '# 根域名服务器共有 13 套装置

    （不是 13 个机器）


    +   - 这些根域名服务器相应的域名分别是

    +   a.rootservers.net

    +   b.rootservers.net

    +   ...

    +   m.rootservers.net


    +   - 到 2006 年底全世界已经安装了一百多个根域名服务器机器，分布在世界各地。


    +   - 这样做目的是为了方便用户，使世界上大部分 DNS 域名服务器都能就近找到一个根域名服务器。'
  merge: -1
  img_proc: true
