- pgno: 495
  md: '# X. 25 网络


    X.25规程


    ![](img/0761188ee01704e55ea71e6a97539d38_495_0.png)


    # （1）特点


    +   ★ 遵循OSI下三层标准，提供永久/交换虚电路（PVC/SVC）；

    +   ★ 结点具有存储—转发功能，不同速率的终端可以相互通信；

    +   ★ 采用动态复用技术，提高信道利用率，简化物理接口；

    +   ★ 采用虚电路或数据报的方式进行分组传输。支持多用户。


    缺点：模拟信道，端口速率低（<=64Kbps），规程复杂，差错处理，数据传输时延较大。现在逐渐被替代，有时被推荐为应用系统的备用方案。'
