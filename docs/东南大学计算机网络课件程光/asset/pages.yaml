- pgno: 211
  md: '# OSI基本术语


    “层功能”：本层具有的通信能力（内在的通信能力，由标准指定）。


    “层服务”：本层向上邻层提供的通信能力。根据OSI增值服务的原则，本层的服务应是下邻层服务与本层功能的之和。即：


    (N) 服务 = (N) 功能 + (N−1) 服务


    ![](img/0761188ee01704e55ea71e6a97539d38_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# OSI基本术语


    “层协议”：为保证层功能的实现和层服务的提供而定义的一组有关通信方面的、在语义、语法和时序方面的约定。有时，同一层次中可能定义多个协议，只有执行相同协议的系统之间才能进行通信。


    “层实体”：层功能实现的真正承担者（相应的硬件）。


    “层用户”：层服务的使用者（上邻层实体）。


    ![](img/0761188ee01704e55ea71e6a97539d38_212_0.png)'
