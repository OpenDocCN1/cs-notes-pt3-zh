- pgno: 990
  md: '# 发送缓存与接收缓存的作用


    +   发送缓存用来暂时存放：

    +   - 发送应用程序传送给发送方 TCP 准备发送的数据；

    +   - TCP 已发送出但尚未收到确认的数据。


    +   接收缓存用来暂时存放：

    +   - 按序到达的、但尚未被接收应用程序读取的数据；

    +   - 不按序到达的数据。'
  merge: -1
  img_proc: true
- pgno: 991
  md: '# 需要强调三点


    +   - A 的发送窗口并不总是和 B 的接收窗口一样大（因为有一定的时间滞后）。

    +   - TCP 标准没有规定对不按序到达的数据应如何处理。通常是先临时存在接收窗口中，等到字节流中所缺少的字节收到后，再按序交付上层的应用进程。

    +   - TCP 要求接收方必须有累积确认的功能，这样可以减小传输开销。'
  merge: -1
  img_proc: true
- pgno: 992
  md: '# 超时重传时间的选择


    +   - 重传机制是 TCP 中最重要和最复杂的问题之一。

    +   - TCP 每发送一个报文段，就对这个报文段设置一次计时器。只要计时器设置的重传时间到但还没有收到确认，就要重传这一报文段。'
  merge: -1
  img_proc: true
- pgno: 993
  md: '# 往返时延的方差很大


    +   - 由于 TCP 的下层是一个互联网环境，IP 数据报所选择的路由变化很大。因此运输层的往返时间的方差也很大。


    ![](img/0761188ee01704e55ea71e6a97539d38_993_0.png)'
