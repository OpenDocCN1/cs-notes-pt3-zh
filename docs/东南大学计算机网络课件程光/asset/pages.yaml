- pgno: 235
  md: '# 数据链路层（D L）


    （1）基于物理层的问题：


    物理连接两端的用户通话是时断时续的，并且也不需特别长的时间。


    +   - 物理连接是有差错和不可靠的。

    +   - 物理设备之间可能存在传输速度不匹配的问题。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 数据链路层（DL）


    （2）数据链路层功能：


    +   - **流量控制技术**（等一停协议、窗口机制等），解决速度不匹配的问题。


    +   - **差错处理技术**，变不可靠的物理连接为可靠的数据链路，从而保证点一点的数据传输正确性。


    +   - **数据链路是指活动着的物理连接**，通信之前，收/发双方互相联系而建立；传输完毕，双方协商而释放。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 数据链路层服务


    标识和维护数据链路（建立和释放，以及选择服务质量，差错处理机制等）。


    +   - 传输DL SDU（服务数据单元），

    +   - 实行流量控制，

    +   - 进行差错通知（无法处理的差错情况，告知上层用户）。


    ![](img/0761188ee01704e55ea71e6a97539d38_237_0.png)'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 数据链路层协议


    用来约定数据链路层实体之间的控制信息和时序，保证DL服务的提供。


    局域网（802.3—CSMA/CD，802.4—令牌总线、802.5—令牌环）


    面向字符型的数据链路控制规程——二进制同步控制规程（BSC）；


    面向比特型的数据链路控制规程——高级数据链路控制规程（HDLC）；'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 网络层


    （1） 基于DL层的问题


    +   - 数据链路层仅提供点对点的数据链路，不能直接提供用户数据的端到端（即DTE和DTE）之间的传输，（其中可能经过多个DCE的合作和转发）；

    +   - 当用户设备连入网络时，希望可以和任一其他用户通信；多个用户可能同时希望传输信息

    +   - 数据链路的利用率较低：用户之间的通信往往是断断续续的。


    ![](img/0761188ee01704e55ea71e6a97539d38_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# （2） 网络层功能


    ★ 提供编址和路由技术，确保用户数据可以端一端传输。


    网络地址：唯一标识网络中设备。


    广域网网络地址：指向交换设备（结点机）的输出端口；

    局域网网络地址：直接对应到网卡（网卡地址等）


    ![](img/0761188ee01704e55ea71e6a97539d38_240_0.png)


    ![](img/0761188ee01704e55ea71e6a97539d38_240_1.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# （2） 网络层功能


    # 路由选择：


    中间结点根据分组中的的地址和依据某种策略或路由选择算法作出决策，以使分组尽快通过网络送往目的地。


    （为减少分组的丢失，网络本身具有吞吐量的限制）


    ![](img/0761188ee01704e55ea71e6a97539d38_241_0.png)'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   ★ 利用复用/解复用技术，将一条DL划分为若干条逻辑电路（称为逻辑信道LC，或虚电路），并且，采用LC号来区分不同用户的数据，实现多对用户的数据可以交织在同一条数据链路上传输；


    +   ★ 提供分组/组装功能，实现用户数据的分组和组装（分组交换），提高链路利用率。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# （3） 网络层服务


    确定网络地址、标识网络连接、传输数据、分组装拆、排序（按提交顺序投递给用户）、流量控制（限制用户一次性提交给网络的分组个数）等。


    # （4） 网络层协议


    +   - CCITT X. 25建议（X. 25分组交换网）

    +   - 局域网：IP协议、IPX协议

    +   - Internet：IP协议'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 运输层


    基于网络层的问题：


    网络的性能不同，用户的要求不同，网络的性能和用户的要求之间也许存在某种差异。


    +   (1) 用户要求高速传输：网络的吞吐量、速率和传输延迟等性能能否满足；


    +   (2) 用户要求较低的传输费用，对于传输延时要求不高：网络的吞吐量、速率和传输延迟很好，费用太高，不能满足。


    +   (3) 网络的传输差错率不能满足用户的要求；


    +   (4) 网络层的分组长度；


    +   (5) 网络的数据流量；


    ![](img/0761188ee01704e55ea71e6a97539d38_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 运输层功能


    运输层目的：采用一些技术来屏蔽不同网络的性能差异，使得用户完全无需了解网络传输的细节。


    +   ★ 网络类型：

    +   A型网络服务具有小的残留差错率和小的可通告差错率；

    +   B型网络服务具有小的残留差错率和大的可通告差错率；

    +   C型网络服务具有大的残留差错率。


    +   ★ 网络的残留差错率：

    +   在网络连接上传输出错的网络服务数据单元（NSDU）在所有传输的NSDU中所占的比例；


    +   ★ 网络的可通告的出错率：

    +   网络中存在的不可恢复的差错与所有可检测的差错中所占的比例。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 运输层采用的技术


    ★分流/合流技术：使得具有低吞吐量、低速率和高传输延迟的网络可以支持用户高速传输数据的要求；

    利用多条网络连接来支持一条运输连接上的数据传输。


    ![](img/0761188ee01704e55ea71e6a97539d38_246_0.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 运输层采用的技术


    ★复用/解复用技术：将多条运输连接上的数据汇集到一条网络连接上传输，


    ![](img/0761188ee01704e55ea71e6a97539d38_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 运输层采用的技术


    ★拼接/分割技术：将一条运输连接上的多个 T-SDU拼接成一个TPDU，并在一条网络连接上传输。


    使得具有高吞吐量、高速率和低传输延迟、且高费用的网络可以支持用户的低传输成本的要求；


    ![](img/0761188ee01704e55ea71e6a97539d38_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 运输层采用的技术


    ★分段/合段技术：


    使得传输有限长度用户数据（分组）的网络可以支持用户的无限长数据的传输


    ![](img/0761188ee01704e55ea71e6a97539d38_249_0.png)


    ★差错检测和恢复技术，使得差错率较高的网络可以支持用户高可靠数据传输的要求；


    进行流量控制，避免网络拥塞：通过对连续传输的TPDU个数施行限制。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 运输层服务


    # （1）标识和维护运输连接


    （建立和释放连接，以及选择服务质量），提供流量控制和常规数据/加速数据的传输。


    # （2）服务质量：


    用户对传输延迟、吞吐量等方面的要求，运输层实体可以根据用户对服务质量的要求决定是否采用分流、复用等技术。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 运输层协议


    定义运输层的PDU格式、交换时序。以及其它实施差错校验、分段/合段、分流/合流、复用/解复用、窗口和流量控制等的方法。


    运输层协议共分为五类，不同的运输协议用于不同的环境，网络服务越差，要求运输协议越复杂。


    TP0（简单类）：提供最简单的数据传输能力，仅支持分段/合段功能，它要求网络本身可提供较高质量的数据传输服务，适用于A型网络。


    TP1（基本差错恢复类）：在TP0的基础上，增加拼接/分割、差错恢复的能力，可对网络检测出来的差错进行恢复，满足用户可靠传输的要求；适用于B型网络。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 运输层协议


    TP2（复用类）：在TP0的基础上，增加复用/解复用、拼接/分割的能力，通常在用户使用高质量的网络，并要求低通信费用时选用，适用于A型网络；


    TP3（差错恢复和复用类）：结合TP1和TP2的能力，满足用户低成本、高可靠性的要求，适用于B型网络；


    TP4（差错检测和恢复类）：在TP3的基础上，增加差错检测和分流/合流能力，通常在服务质量较差的网络上选用，保证数据传输的可靠性；适用于C型网络。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 运输层协议


    运输连接建立时，双方协商使用的运输协议类别；


    +   - 选用不同类别的运输实体之间不能进行通信；


    ![](img/0761188ee01704e55ea71e6a97539d38_253_0.png)'
  merge: -1
