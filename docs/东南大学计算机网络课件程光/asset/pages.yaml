- pgno: 1068
  md: '# 持续连接

    (persistent connection)


    +   - HTTP/1.1 协议使用持续连接。

    +   - 万维网服务器在发送响应后仍然在一段时间内保持这条连接，使同一个客户（浏览器）和该服务器可以继续在这条连接上传送后续的 HTTP 请求报文和响应报文。

    +   - 这并不局限于传送同一个页面上链接的文档，而是只要这些文档都在同一个服务器上就行。

    +   - 目前一些流行的浏览器（例如，IE 6.0）的默认设置就是使用 HTTP/1.1。'
  merge: -1
  img_proc: true
- pgno: 1069
  md: '# 持续连接的两种工作方式


    +   - 非流水线方式：客户在收到前一个响应后才能发出下一个请求。这比非持续连接的两倍 RTT 的开销节省了建立 TCP 连接所需的一个 RTT 时间。但服务器在发送完一个对象后，其
    TCP 连接就处于空闲状态，浪费了服务器资源。

    +   - 流水线方式：客户在收到 HTTP 的响应报文之前就能够接着发送新的请求报文。一个接一个的请求报文到达服务器后，服务器就可连续发回响应报文。使用流水线方式时，客户访问所有的对象只需花费一个
    RTT时间，使 TCP 连接中的空闲时间减少，提高了下载文档效率。'
  merge: -1
  img_proc: true
- pgno: 1070
  md: '# 代理服务器

    (proxy server)


    +   - 代理服务器(proxy server)又称为万维网高速缓存(Web cache)，它代表浏览器发出 HTTP 请求。

    +   - 万维网高速缓存把最近的一些请求和响应暂存在本地磁盘中。

    +   - 当与暂时存放的请求相同的新请求到达时，万维网高速缓存就把暂存的响应发送出去，而不需要按 URL 的地址再去因特网访问该资源。'
  merge: -1
  img_proc: true
