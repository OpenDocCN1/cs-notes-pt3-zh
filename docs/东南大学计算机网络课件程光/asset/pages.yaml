- pgno: 758
  md: '区分服务——占 8 位，用来获得更好的服务

    在旧标准中叫做服务类型，但实际上一直未被使用过。

    1998 年这个字段改名为区分服务。

    只有在使用区分服务（DiffServ）时，这个字段才起作用。

    在一般的情况下都不使用这个字段


    ![](img/0761188ee01704e55ea71e6a97539d38_758_0.png)'
