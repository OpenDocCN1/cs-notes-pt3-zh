  mdcn: "\n\n## 部署图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_145_0.png)\n\nCLSS:\
    \ 传送带分类系统\n\n每个三维方盒描述了一个属于系统物理架构的硬件要素。\n\n## 活动图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_146_0.png)\n\
    \n活动图表示系统实现各种功能时的具体步骤，圆角矩形表示特定的系统功能，箭头表示系统的流程，菱形表示分支（从菱形出发的箭头都需要标注），水平实线表示并发事件。\n\
    \n## 类图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_147_0.png)\n\n类是从问题描述中提取的。对CLSS来说，候选的类可能是：箱子、传送带、条形码阅读器、分流控制器、操作者请求、报告、产品以及其它。\n\
    \n## 第7章\n需求工程\n\n《软件工程：实践者的研究方法》第6版\nRoger S. Pressman 著\n\n## 概述\n\n- 需求工程帮助软件工程师更好地理解他们将要解决的问题。\n\
    - 具体步骤：首先定义将要解决的问题范围和性质；然后是引导、帮助客户定义需要什么；接下来是精炼需求，精确定义和修改基本需求。\n- “构建一个软件系统最困难的部分是确定构建什么。其它部分工作不会像这部分工作一样，在出错之后会如此严重地影响随后实现的系统，并且在以后修补竟会如此的困难。”\n\
    \  ——Fred Brooks\n\n## 需求工程任务\n\n- **启动**——建立对问题及解决方案性质的基本理解。\n- **引导**——从利益相关者那里获取需求。\n\
    - **细化**——创建分析模型，以表示需求的信息、功能和行为方面。\n- **协商**——就开发者与客户均可实现的交付系统达成一致。\n- **规格说明**——正式或非正式地描述需求。\n\
    - **验证**——审查需求规格说明，检查错误、歧义、遗漏和冲突。\n- **需求管理**——管理不断变化的需求。\n\n## 1 启动\n\n- 提出“与上下文无关”的问题\n\
    \  - 这项工作的请求背后是谁？\n  - 谁将使用该解决方案（产品/系统）？\n  - 经济效益是什么？\n  - 你如何描述系统“良好”的输出？\n\
    \  - 该解决方案解决了哪些问题？\n  - 产品将在什么环境中使用？\n  - 你是回答这些问题的合适人选吗？\n  - 这些问题相关吗？\n  - 还有其他人能提供更多信息吗？\n\
    \  - 我还应该问你什么？\n  - ……\n\n## 2.1 CRG会议[协同的需求收集会议]\n\n- 所有感兴趣的利益相关者参加会议。\n- 为准备和参与制定规则。\n\
    - 议程应足够正式以涵盖所有要点，但又应足够非正式以鼓励思想的自由交流。\n- 由一名推动者[引导者，发起人]控制会议。\n- 使用定义机制（黑板、活动挂图等）。\n\
    - 会议期间：\n  - 明确问题。\n  - 提出解决方案的要素。\n  - 协商不同的方法。\n  - 获得初步的解决方案需求集。\n  - 氛围是协作式的，不具有胁迫性。\n\
    \n## 2.2 QFD：质量功能展开\n\n- 将客户需求转化为技术需求。QFD的目的是最大限度地让客户从软件工程过程中感到满意。为此，QFD强调理解“什么是对客户有价值的”。\n\
    \  - 功能展开确定系统所需每个功能（对客户）的“价值”。\n  - 信息展开识别数据对象和事件。\n  - 任务展开检查系统的行为。\n  - 价值分析确定需求的优先级。\n\
    \n## 2.3 引导工作产品\n\n- 必要性和可行性陈述。\n- 系统或产品的范围说明。\n- 参与需求引导的客户、用户和其它共同利益者的列表。\n-\
    \ 系统技术环境的说明。\n- 需求列表，以及每个需求适用的领域限制。\n- 一系列使用场景。\n- 任何能够更好地定义需求的原型。\n\n## 3 开发用例\n\
    \n- 用例场景是一个关于软件外部某人或某物（称为参与者）如何与系统交互的故事。\n- 每个场景回答以下问题：\n  - 谁是主要参与者，谁是次要参与者？\n\
    \  - 参与者的目标是什么？\n  - 故事开始前应存在哪些前置条件？\n  - 参与者执行哪些主要任务或功能？\n  - 在描述故事时可能考虑哪些异常情况？\n\
    \  - 参与者的交互可能存在哪些变化？\n  - 参与者将获取、产生或更改哪些系统信息？\n  - 参与者是否需要告知系统外部环境的变化？\n  - 参与者期望从系统中获得哪些信息？\n\
    \  - 参与者是否希望被告知意外的变化？\n\n"
