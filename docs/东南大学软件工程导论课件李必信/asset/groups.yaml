  - '[PAGE 88]


    # Evolutionary Models: The Spiral


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_88_0.png)


    The spiral model was defined by Barry Boehm in his article “A Spiral Model of
    Software Development and Enhancement” from 1986. This model was not the first
    model to discuss iteration, but it was the first model to explain why the iteration
    matters. As originally envisioned, the iterations were typically 6 months to 2
    years long. The spiral model (Boehm, 1988) aims at risk reduction by any means
    in any phase. The spiral model is often referred to as a risk-driven model.


    Definition: The spiral model, also known as the spiral lifecycle model, is a systems
    development lifecycle (SDLC) model used in information technology (IT). This model
    of development combines the features of the prototyping model and the waterfall
    model. The spiral model is favored for large, expensive, and complicated projects.'
  - '[PAGE 89]


    # The steps in the spiral model


    +   1. The new system requirements are defined in as much detail as possible.
    This usually involves interviewing a number of users representing all the external
    or internal users and other aspects of the existing system.

    +   2. A preliminary design is created for the new system.

    +   3. A first prototype of the new system is constructed from the preliminary
    design. This is usually a scaled-down system, and represents an approximation
    of the characteristics of the final product.

    +   4. A second prototype is evolved by a fourfold procedure:

    +      (1) evaluating the first prototype in terms of its strengths, weaknesses,
    and risks;

    +      (2) defining the requirements of the second prototype;

    +      (3) planning and designing the second prototype;

    +      (4) constructing and testing the second prototype.'
  - '[PAGE 90]


    # The steps in the spiral model...


    +   5. At the customer’s option, the entire **project can be aborted** (流产) if
    the risk is deemed (认为) too great. Risk factors might involve development cost
    overruns (超出限度), operating-cost miscalculation (误算), or any other factor that
    could, in the customer''s judgment, result in a less-than-satisfactory final product.

    +   6. The existing prototype is evaluated in the same manner as was the previous
    prototype, and, if necessary, **another prototype** is developed from it according
    to the fourfold procedure outlined above.

    +   7. The preceding steps are iterated **until** the customer is satisfied that
    the refined prototype represents the final product desired.

    +   8. The final system is constructed, based on the **refined prototype**.

    +   9. The **final system** is thoroughly evaluated and tested. Routine maintenance
    is carried out on a continuing basis to prevent large-scale failures and to minimize
    downtime'
