  - '[PAGE 206]


    # Analysis Classes


    +   - **External entities** (e.g., other systems, devices, people) that produce
    or consume information to be used by a computer-based system.

    +   - **Things** (e.g, reports, displays, letters, signals) that are part of the
    information domain for the problem.

    +   - **Occurrences or events** (e.g., a property transfer or the completion of
    a series of robot movements) that occur within the context of system operation.

    +   - **Roles** (e.g., manager, engineer, salesperson) played by people who interact
    with the system.

    +   - **Organizational units** (e.g., division, group, team) that are relevant
    to an application.

    +   - **Places** (e.g., manufacturing floor or loading dock) that establish the
    context of the problem and the overall function of the system.

    +   - **Structures** (e.g., sensors, four-wheeled vehicles, or computers) that
    define a class of objects or related classes of objects.'
  md: "\n## Use-Case Diagram\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_188_0.png)\n\
    \n## Activity Diagram\n\nSupplements the use-case by providing a diagrammatic\
    \ representation of procedural flow\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_189_0.png)\n\
    \n## Swimlane Diagrams\n\nAllows the modeler to represent the flow of activities\
    \ described by the use-case and at the same time indicate which actor (if there\
    \ are multiple actors involved in a specific use-case) or analysis class has responsibility\
    \ for the action described by an activity rectangle\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_190_0.png)\n\
    \n## 8.6 Flow-Oriented Modeling\n\nRepresents how data objects are transformed\
    \ as they move through the system\n\nA data flow diagram (DFD) is the diagrammatic\
    \ form that is used\n\nConsidered by many to be an ‘old school’ approach, flow-oriented\
    \ modeling continues to provide a view of the system that is unique—it should\
    \ be used to supplement other analysis model elements\n\n## The Flow Model\n\n\
    Every computer-based system is an information transform ....\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_192_0.png)\n\
    \n## Flow Modeling Notation\n\n- external entity\n- process\n- data flow\n- data\
    \ store\n\n## External Entity\n\nA producer or consumer of data\n\nExamples: a\
    \ person, a device, a sensor\n\nAnother example: computer-based system\n\n*Data\
    \ must always originate somewhere and must always be sent to something*\n\n##\
    \ Process\n\nA data transformer (changes input to output)\n\nExamples: compute\
    \ taxes, determine area, format report, display graph\n\n> *Data must always be\
    \ processed in some way to achieve system function*\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_195_0.png)\n\
    \n## Data Stores\n\nData is often stored for later use.\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_197_0.png)\n\
    \n## Data Flow Diagramming: Guidelines\n\n- all icons must be labeled with meaningful\
    \ names\n- the DFD evolves through a number of *levels of detail*\n- always begin\
    \ with a *context level diagram* (also called level 0)\n- always show external\
    \ entities at level 0\n- always label data flow arrows\n- do not represent procedural\
    \ logic\n\n## Constructing a DFD\n\n- review the data model to isolate data objects\
    \ and use a grammatical parse to determine “operations”\n- determine external\
    \ entities (producers and consumers of data)\n- create a level 0 DFD\n\n## Level\
    \ 0 DFD Example\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_200_0.png)\n\n## Constructing\
    \ a DFD…\n\n- write a narrative describing the transform\n- parse to determine\
    \ next level transforms\n- “balance” the flow to maintain data flow continuity\n\
    - develop a level 1 DFD\n- use a 1:5 (approx.) expansion ratio\n\n## DFDs: A Look\
    \ Ahead\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_202_0.png)\n\nanalysis model\n\
    \nMaps into\n\ndesign model\n\n## Control Flow Diagrams\n\n- Represents “events”\
    \ and the processes that manage events\n- An “event” is a Boolean condition that\
    \ can be ascertained by:\n  - listing all sensors that are \"read\" by the software.\n\
    \  - listing all interrupt conditions.\n  - listing all \"switches\" that are\
    \ actuated by an operator.\n  - listing all data conditions.\n  - recalling the\
    \ noun/verb parse that was applied to the processing narrative, review all \"\
    control items\" as possible CSPEC inputs/outputs.\n\n## 8.7 Class-Based Modeling\n\
    \n- Identify analysis classes by examining the problem statement\n- Use a “grammatical\
