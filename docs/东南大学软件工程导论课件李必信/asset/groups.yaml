    ### 3.2 将过程视为“白盒”\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_63_0.png)\n\n- 非正式需求\n\
    - 过程\n- 产品\n- 反馈\n\n### 优势\n\n- 通过提高可见性来降低风险\n- 允许项目在推进过程中发生变化\n  - 基于客户的反馈\n\n\
