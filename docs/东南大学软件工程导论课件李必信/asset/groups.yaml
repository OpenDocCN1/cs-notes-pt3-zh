  mdcn: "\n\n## 团队协调与沟通\n\n- **正式、非人际化方法**包括软件工程文档和工作产品（包括源代码）、技术备忘录、项目里程碑、进度表和项目控制工具（第23章）、变更请求及相关文档、错误跟踪报告以及仓库数据（参见第26章）。\n\
    - **正式、人际化程序**侧重于应用于软件工程工作产品的质量保证活动（第25章）。这些包括状态评审会议以及设计和代码检查。\n- **非正式、人际化程序**包括用于信息传播和问题解决的团队会议以及“需求与开发人员的共址”。\n\
    - **电子通信**涵盖电子邮件、电子公告板，并由此延伸至基于视频的会议系统。\n- **人际网络**包括与团队成员以及项目外部可能拥有可协助团队成员的经验或见解的人员进行的非正式讨论。\n\
    \n## 产品\n\n- 软件范围\n- 问题分解\n\n### 软件范围\n\n- **软件项目范围：**\n  - **上下文。** 待构建的软件如何融入更大的系统、产品或业务环境，以及由于该环境而施加了哪些约束？\n\
    \  - **信息目标。** 作为软件输出的客户可见数据对象（第8章）是什么？所需输入的数据对象是什么？\n  - **功能和性能。** 软件执行什么功能来将输入数据转换为输出？是否需要解决任何特殊性能特征？\n\
    \n软件项目范围必须在管理层和技术层面上都无歧义且可理解。\n\n### 问题分解\n\n- 有时称为**划分**或**问题阐述**\n- 一旦范围被定义\
    \ …\n  - 它被分解为构成性功能\n  - 它被分解为用户可见的数据对象\n  - **或**\n  - 它被分解为一组问题类\n- **分解过程持续进行，直到**所有功能或问题类都被定义\n\
    \n## 3 过程\n\n- 一旦建立了过程框架\n  - 考虑项目特征\n  - 确定所需的严谨程度\n  - 为每个软件工程活动定义任务集\n    -\
    \ 任务集 =\n      - 软件工程任务\n      - 工作产品\n      - 质量保证点\n      - 里程碑[重要事件]\n\n##\
    \ 第22章 过程与项目度量\n\n软件工程：实践者的途径，第六版 Roger S. Pressman 著\n\n### 本章要点\n\n- 过程度量\n\
    - 项目度量\n\n### 一个优秀的管理者会进行度量\n\nprocess  \nproduct  \nmeasurement  \nprocess metrics\
    \  \nproject metrics  \nproduct metrics  \n\n我们以什么作为基础？\n\n- size?\n- function?\n\
    \n### 过程度量\n\n- 我们间接衡量软件过程的功效[功效]。也就是说，我们基于可从过程中得出的结果导出一组度量。结果包括\n  1. 软件发布前发现的错误度量\n\
    \  2. 交付给最终用户并由其报告的缺陷\n  3. 交付的工作产品（生产率）\n  4. 耗费的人力\n  5. 耗费的日历时间\n  6. 进度符合度\n\
    \  7. 其他度量。\n- 我们还通过衡量特定软件工程任务的特征来导出过程度量。\n\n### 软件过程改进\n\nProcess model  \nImprovement\
    \ goals  \nProcess metrics  \nSPI  \nProcess improvement recommendations  \n\n\
    ### 项目度量\n\n- 用于通过做出必要的调整来最小化开发进度，以避免延误并缓解潜在问题和风险\n- 用于持续评估产品质量，并在必要时修改技术方法以提高质量。\n\
    - 每个项目都应衡量：\n  - **输入**——衡量完成工作所需资源（例如人员、工具）的度量。\n  - **输出**——衡量在软件工程过程中创建的交付物或工作产品的度量。\n\
    \  - **结果**——衡量交付物有效性的度量。\n\n"
