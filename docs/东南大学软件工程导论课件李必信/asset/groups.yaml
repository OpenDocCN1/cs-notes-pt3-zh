    # Role of the SQA Group


    +   - **Prepares an SQA plan for a project.**

    +     - The plan identifies

    +       - evaluations to be performed

    +       - audits and reviews to be performed

    +       - standards that are applicable to the project

    +       - procedures for error reporting and tracking

    +       - documents to be produced by the SQA group

    +       - amount of feedback provided to the software project team


    +   - **Participates in the development of the project’s software process description.**

    +     - The SQA group reviews the process description for compliance with【符合】
    organizational policy, internal software standards, externally imposed standards
    (e.g., ISO-9001), and other parts of the software project plan.'
  - '[PAGE 410]


    # Role of the SQA Group...


    +   - **Reviews software engineering activities to verify compliance with the
    defined software process.**

    +     - identifies, documents, and tracks deviation[偏差] from the process and verifies
    that corrections have been made.

    +   - **Audits designated software work products to verify compliance with those
    defined as part of the software process.**

    +     - reviews selected work products; identifies, documents, and tracks deviations;
    verifies that corrections have been made

    +     - periodically reports the results of its work to the project manager.

    +   - **Ensures that deviations in software work and work products are documented
    and handled according to a documented procedure.**

    +   - **Records any noncompliance[违规] and reports to senior management.**

    +     - Noncompliance items are tracked until they are resolved.'
