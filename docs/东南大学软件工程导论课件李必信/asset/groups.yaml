  - '[PAGE 385]


    # Chapter 25

    Risk Management


    **Software Engineering: A Practitioner’s Approach, 6th edition**

    *by Roger S. Pressman*'
  - '[PAGE 386]


    # Project Risks


    +   - What can go wrong?

    +   - What is the likelihood?

    +   - What will the damage be?

    +   - What can we do about it?


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_386_0.png)'
  - '[PAGE 387]


    # Reactive Risk Management


    +   - project team reacts to risks when they occur

    +   - mitigation—plan for additional resources in anticipation of fire fighting

    +   - fix on failure—resource are found and applied when the risk strikes

    +   - crisis management—failure does not respond to applied resources and project
    is in jeopardy[危险]'
  - '[PAGE 388]


    # Proactive Risk Management


    +   - formal risk analysis is performed

    +   - organization corrects the root causes of risk

    +     1. TQM concepts and statistical SQA

    +     2. examining risk sources that lie beyond the bounds of the software

    +     3. developing the skill to manage change'
  - '[PAGE 389]


    # Risk Management Paradigm


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_389_0.png)'
  - '[PAGE 390]


    # Risk Identification


    +   - **Product size**—risks associated with the overall size of the software
    to be built or modified.

    +   - **Business impact**—risks associated with constraints imposed by management
    or the marketplace.

    +   - **Customer characteristics**—risks associated with the sophistication of
    the customer and the developer''s ability to communicate with the customer in
    a timely manner.

    +   - **Process definition**—risks associated with the degree to which the software
    process has been defined and is followed by the development organization.

    +   - **Development environment**—risks associated with the availability and quality
    of the tools to be used to build the product.

    +   - **Technology to be built**—risks associated with the complexity of the system
    to be built and the "newness" of the technology that is packaged by the system.

    +   - **Staff size and experience**—risks associated with the overall technical
    and project experience of the software engineers who will do the work.'
  - '[PAGE 391]


    # Assessing Project Risk


    +   - Have top software and customer managers formally committed to support the
    project?

    +   - Are end-users enthusiastically committed to the project and the system/product
    to be built?

    +   - Are requirements fully understood by the software engineering team and their
    customers?

    +   - Have customers been involved fully in the definition of requirements?

    +   - Do end-users have realistic expectations?'
  - '[PAGE 392]


    # Assessing Project Risk···


    +   - Is project scope stable?

    +   - Does the software engineering team have the right mix of skills?

    +   - Are project requirements stable?

    +   - Does the project team have experience with the technology to be implemented?

    +   - Is the number of people on the project team adequate to do the job?

    +   - Do all customer/user constituencies agree on the importance of the project
    and on the requirements for the system/product to be built?'
  - '[PAGE 393]


    # Risk Components


    +   - performance risk—the degree of uncertainty that the product will meet its
    requirements and be fit for its intended use.

    +   - cost risk—the degree of uncertainty that the project budget will be maintained.

    +   - support risk—the degree of uncertainty that the resultant software will
    be easy to correct, adapt, and enhance.

    +   - schedule risk—the degree of uncertainty that the project schedule will be
    maintained and that the product will be delivered on time.'
  - '[PAGE 394]


    # Risk Mitigation, Monitoring, and Management


    +   - mitigation—how can we avoid the risk?

    +   - monitoring—what factors can we track that will enable us to determine if
    the risk is becoming more or less likely?

    +   - management—what contingency plans do we have if the risk becomes a reality?'
  - '[PAGE 395]


    # Risk Due to Product Size


    # Attributes that affect risk:


    +   - estimated size of the product in LOC or FP?

    +   - estimated size of product in number of programs, files, transactions?

    +   - percentage deviation in size of product from average for previous products?

    +   - size of database created or used by the product?

    +   - number of users of the product?

    +   - number of projected changes to the requirements for the product? before
    delivery? after delivery?

    +   - amount of reused software?'
