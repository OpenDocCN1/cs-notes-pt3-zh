    \n## Phases\n\n- 1 应用需求确定\n- 2 软件需求规格说明\n- 3 体系结构设计\n- 4 详细设计\n- 5 实现\n- 6 集成\n\
    - 7 维护\n\n## W - Whole Life Cycle\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_582_0.png)\n\
    \n## Characteristics and Problems of the Process\n\n- 线性、顺序阶段\n- 阶段之间无重叠\n- 所有需求\
