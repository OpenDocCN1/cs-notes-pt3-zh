    # Extreme Programming (XP)


    +   - The most widely used agile process, originally proposed by Kent Beck [1999]

    +   - XP Planning

    +     - Begins with the creation of **user stories**

    +     - Agile team assesses each story and assigns a **cost**

    +     - Stories are grouped to for a **deliverable increment**

    +     - A **commitment[承担义务]** is made on delivery date[交货日期]

    +     - After the first increment, **project velocity** is used to help define
    subsequent delivery dates for other increments'
