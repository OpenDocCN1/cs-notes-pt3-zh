    \  - writing data to screens and printers,\n  - starting tapes,\n  - refreshing\
    \ memory,\n  - scheduling specific tasks\n  - etcetera.\n\n## Interpreters and\
    \ Compilers\n\n- An **interpreter** is a computer language that execute instructions\
    \ that are written in the form of a program. The trick of an interpreter is that\
    \ it loads the source code and translates the instruction into executable machine\
    \ language **line by line**. And it does it over and over again any time that\
    \ program is run.\n- In short a **COMPILER** is: the translator of the source\
    \ code into computer language.\n\n## Enter \"OOP\"\n\n- This is about rewriting\
    \ routines and programming functionality over and over again for each different\
    \ part of a program and for each new program again and again.\n- There was a need\
    \ for **common shared parts** that acted on instructions like a black box. So\
