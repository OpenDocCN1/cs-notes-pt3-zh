  - '[PAGE 33]


    # Hardware vs. Software


    # Hardware


    +   - Manufactured

    +   - Wears out [磨损]

    +   - Built using components

    +   - Relatively simple


    # Software


    +   - Developed/engineered

    +   - Deteriorates [恶化]

    +   - Custom built [根据需求定制的]

    +   - Complex'
  - '[PAGE 34]


    # Manufacturing vs. Development


    +   - Once a hardware product has been manufactured, it is difficult or impossible
    to modify. In contrast, software products are routinely modified and upgraded.

    +   - In hardware, hiring more people allows you to accomplish more work, but
    the same does not necessarily hold true in software engineering.

    +   - Unlike hardware, software costs are concentrated in design rather than production.'
