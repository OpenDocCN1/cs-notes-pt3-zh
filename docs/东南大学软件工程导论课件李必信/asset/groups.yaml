  md: '

    - This meant a breakthrough for mathematics. Boole was the first to prove that
    logic is part of mathematics and not of philosophy. A big step in thinking too.

    - But it will take **one hundred years** before this algebra of logic is put to
    work for computing.

    - It took Claude Shannon (1916-2001) who wrote a thesis (A Mathematical Theory
    of Communication in the Bell System Technical Journal -1948) on how binary logic
    could be used in computing to complete the **software concept of modern computing**.


    ## Also the hardware needed to make jumps ahead


    - 1935-1938: It took Konrad Zuse (1910-1995) to create the first binary programmable
    computer, **Z1** (world''s first program-controlled computer.).

    - 1938: The **Bomba**, originally built by Polish engineers to crack the **Enigma**
    code (German cipher machine), pushed the envelop again.


    - 1937-1942: Atanasov and Berry designed the **ABC computer**, a binary computer,
    as Zuse''s was, but now 100% electronic.

    - 1944: The **colossus** (巨人) built by people from Bletchley Park (near London,
    UK). The Worlds First _Electronic Computer_

    - In 1946, John Mauchly and J Presper Eckert developed the **ENIAC I** (Electrical
    **N**umerical **I**ntegrator **A**nd **C**alculator). --- **Invention of the Modern
    Computer**


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_540_0.png)


    - Two women wiring the right side of the ENIAC with a new program (US Army photo,
    from archives of the ARL Technical library, courtesy of Mike Muuss)

    - Programming like this was nothing else but rewiring these huge machines in order
    to use all the options, possibilities and calculations. **Reprogramming always
    meant rewiring.**


    ## 1.2.2 Enter the Information Age


    ## Machine Language


    - First programming was done by typing in 1''s or 0''s that were stored on different
    information carriers.

    - By storing these 0''s and 1''s on a carrier (first used by [Karl Suze''s X1](#)
    in [1938](#)) it was possible to have the computer read the data on any later
    time. But mistyping a single zero or one meant a disaster because all coding (instructions)
    should absolutely be on the right place and in the right order in memory. This
    technology was called [absolute addressing](#).

    - An example: 1010010101110101011


    - In the early 50''s programmers started to let the machines do a part of the
    job. This was called **_automatic coding_** and made live a lot easier for the
    early programmers.

    - Soon the next step was to have the program to select the proper memory address
    instead of using absolute addressing.

    - The next development was to **_combine groups of instruction into so called
    words and abbreviations_** were thought up called: **opcodes** (Hopper 1948)


    ## Assembly language


    - Opcode works like a shorthand and represents as said a group of machine instructions.
    The opcode is translated by another program into zero''s and one''s, something
    a machine could translate into instructions.


    - But the relation is still one to one: one code to one single instruction. However
    very basically this is already a programming language. It was called: assembly
    language.


    ```

    A:=B+C

    movl B, d0;  move long-word B into register d0

    addl C, d0;  add

    movl d0, A;  and store

    ```


    ## ■ **Subroutines**


    - Soon after developing machine languages and the first crude（粗糙的）programming
    languages began to appear, the danger of inextricable（无法解脱的）and thus unreadable
    coding became apparent. Later this messy（凌乱的）programming was called: “spaghetti（意大利面条式的）code”.


    - One important step in unraveling or preventing spaghetti code was **the development
    of subroutines**.


    - And it needed Maurice Wilkes, when realizing that "a good part of the remainder
    of his life was going to be spent in finding errors in ... programs", to develop
    the concept of subroutines in programs to create reusable modules. Together with
    Stanley Gill and David Wheeler he produced the first textbook on "The Preparation
    of Programs for an Electronic Digital Computer".


    - **The formalized concept of software development** (not named so for another
    decade) **had its beginning in 1951.**


    - Below is an example of how subroutines would work

    '
  mdcn: '


    - 这意味着数学的突破。布尔是第一个证明逻辑是数学的一部分而不是哲学的人。也是思维的一大进步。

    - 但要等到 **一百多年** 后，这种逻辑代数才被用于计算。

    - 这需要克劳德·香农（1916-2001）完成，他写了论文《贝尔系统技术期刊中的通信的数学理论 -1948》，论述了二进制逻辑如何用于计算，从而完成了现代计算的
    **软件概念**。


    ## 也需要硬件来推动进步


    - 1935-1938年：需要康拉德·楚泽（1910-1995）来创建第一台二进制可编程计算机，**Z1**（世界上第一台程序控制计算机。）。

    - 1938年：**波姆巴**，最初由波兰工程师建造用于破解 **恩尼格玛** 代码（德国密码机），再次推动了边界。


    - 1937-1942年：阿塔纳索夫和贝里设计了 **ABC 计算机**，一台二进制计算机，与楚泽的类似，但现在是 100% 电子的。

    - 1944年：由布莱切利公园（英国伦敦附近）的人们建造的 **巨人 colossus**（巨人）。世界上第一台 _电子计算机_

    - 1946年，约翰·莫奇利和 J·普雷斯珀·埃克特开发了 **ENIAC I**（电气 **N**umerical **I**ntegrator **A**nd
    **C**alculator）。--- **现代计算机的发明**


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_540_0.png)


    - 两名女性正在为 ENIAC 接线右侧以安装新程序（美国陆军照片，来自 ARL 技术图书馆档案，由 Mike Muuss 提供）

    - 这种编程无非就是重新布线这些庞大机器以使用所有选项、可能性和计算。 **重新编程始终意味着重新布线。**


    ## 1.2.2 进入信息时代


    ## 机器语言


    - 最初的编程是通过在不同的信息载体上输入 1 或 0 来完成的。

    - 通过将这些 0 和 1 存储在载体上（最早由 [Karl Suze''s X1](#) 于 [1938](#) 使用），计算机可以在任何以后的时间读取数据。但输入一个零或一的错误意味着灾难，因为所有编码（指令）必须绝对在内存中正确的位置和正确的顺序。这种技术被称为
    [绝对寻址](#)。

    - 一个例子：1010010101110101011


    - 在 50 年代初期，程序员开始让机器做一部分工作。这被称为 **_自动编码_**，使早期程序员的生活变得轻松许多。

    - 很快下一步就是让程序选择适当的内存地址，而不是使用绝对寻址。

    - 下一个发展是 **_将一组指令组合成所谓的词，并想出了缩写_** 称为： **opcodes**（Hopper 1948）


    ## 汇编语言


    - Opcode 像速记一样工作，代表如上所述一组机器指令。opcode 由另一个程序翻译成零和一，机器可以将其翻译成指令。


    - 但关系仍然是一对一：一个代码对应一个单一指令。然而非常基础地，这已经是一种编程语言。它被称为：汇编语言。


    ```

    A:=B+C

    movl B, d0;  move long-word B into register d0

    addl C, d0;  add

    movl d0, A;  and store

    ```


    ## ■ **子程序**


    - 在开发机器语言并出现第一种粗糙（粗糙的）编程语言后不久，无法解脱（无法解脱的）从而不可读的代码的危险变得明显。后来这种混乱（凌乱的）编程被称为：“意大利面条式（意大利面条式的）代码”。


    - 解决或防止意大利面条式代码的一个重要步骤是 **子程序的开发**。


    - 而且需要莫里斯·威尔克斯，当他意识到“他余生的很大一部分将花费在寻找……程序中的错误”时，才发展出在程序中创建可重用模块的子程序概念。与斯坦利·吉尔和大卫·惠勒一起，他出版了第一本关于“为电子数字计算机准备程序”的教科书。


    - **软件开发的正式化概念**（再过十年才命名） **始于 1951 年。**


    - 下面是子程序如何工作的示例


    '
