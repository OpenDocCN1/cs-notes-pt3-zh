    \ are **detected last**\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_83_0.png)\n\
    \n## Incremental Models: Incremental\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_84_0.png)\n\
    \n## Incremental Models: RAD Model\n\n- Requires sufficient human resources\n\
    - Modularization is prerequisite\n- Global tuning is not possible\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_85_0.png)\n\
    \n## Evolutionary Models: Prototyping\n\n- A prototyping paradigm is the best-fit\
    \ for the following situations.\n  - A customer does not identify detailed requirements\
    \ for SW.\n  - SW engineers are not sure of the efficiency of an algorithm, usability\
    \ of SW, and so on.\n\n- In other words, prototyping paradigm helps SW engineers\
    \ and the customers to understand what is to be built.\n\n- The quick design and\
    \ implementation focuses on a representation of those aspects of the SW that will\
    \ be visible to the customer.\n  - Ideally, the prototype serves as a mechanism\
    \ for identifying SW requirements.\n\n## Evolutionary Models: Prototyping...\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_87_0.png)\n\nSome problems in prototyping\
    \ paradigm\n\n- SW engineers try to modify the prototype to use as a working version\n\
    - Once the customer see the working prototype, he/she expects to get working product\
    \ soon\n\n## Evolutionary Models: The Spiral\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_88_0.png)\n\
    \nThe spiral model was defined by Barry Boehm in his article “A Spiral Model of\
    \ Software Development and Enhancement” from 1986. This model was not the first\
    \ model to discuss iteration, but it was the first model to explain why the iteration\
    \ matters. As originally envisioned, the iterations were typically 6 months to\
    \ 2 years long. The spiral model (Boehm, 1988) aims at risk reduction by any means\
    \ in any phase. The spiral model is often referred to as a risk-driven model.\n\
    \nDefinition: The spiral model, also known as the spiral lifecycle model, is a\
    \ systems development lifecycle (SDLC) model used in information technology (IT).\
    \ This model of development combines the features of the prototyping model and\
    \ the waterfall model. The spiral model is favored for large, expensive, and complicated\
    \ projects.\n\n## The steps in the spiral model\n\n1. The new system requirements\
    \ are defined in as much detail as possible. This usually involves interviewing\
    \ a number of users representing all the external or internal users and other\
    \ aspects of the existing system.\n2. A preliminary design is created for the\
    \ new system.\n3. A first prototype of the new system is constructed from the\
    \ preliminary design. This is usually a scaled-down system, and represents an\
    \ approximation of the characteristics of the final product.\n4. A second prototype\
    \ is evolved by a fourfold procedure:\n   (1) evaluating the first prototype in\
    \ terms of its strengths, weaknesses, and risks;\n   (2) defining the requirements\
    \ of the second prototype;\n   (3) planning and designing the second prototype;\n\
    \   (4) constructing and testing the second prototype.\n\n## The steps in the\
    \ spiral model...\n\n5. At the customer’s option, the entire **project can be\
    \ aborted** (流产) if the risk is deemed (认为) too great. Risk factors might involve\
    \ development cost overruns (超出限度), operating-cost miscalculation (误算), or any\
    \ other factor that could, in the customer's judgment, result in a less-than-satisfactory\
    \ final product.\n6. The existing prototype is evaluated in the same manner as\
    \ was the previous prototype, and, if necessary, **another prototype** is developed\
    \ from it according to the fourfold procedure outlined above.\n7. The preceding\
    \ steps are iterated **until** the customer is satisfied that the refined prototype\
    \ represents the final product desired.\n8. The final system is constructed, based\
    \ on the **refined prototype**.\n9. The **final system** is thoroughly evaluated\
    \ and tested. Routine maintenance is carried out on a continuing basis to prevent\
    \ large-scale failures and to minimize downtime\n"
  mdcn: "\n\n## V 模型\n\n> 如果我们仅依赖测试，**首先创建**的缺陷会**最后被检测**出来\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_83_0.png)\n\
    \n## 增量模型：增量\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_84_0.png)\n\n## 增量模型：RAD\
    \ 模型\n\n- 需要充足的人力资源\n- 模块化是前提条件\n- 无法进行全局调优\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_85_0.png)\n\
    \n## 进化模型：原型法\n\n- 原型法最适合以下情况。\n  - 客户无法明确软件的详细需求。\n  - 软件工程师不确定算法的效率、软件的可用性等。\n\
    \n- 换句话说，原型法有助于软件工程师和客户理解要构建的内容。\n\n- 快速设计和实现专注于软件中对客户可见方面的表示。\n  - 理想情况下，原型可作为识别软件需求的机制。\n\
    \n## 进化模型：原型法...\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_87_0.png)\n\n原型法中的一些问题\n\
    \n- 软件工程师试图修改原型以用作工作版本\n- 一旦客户看到可工作的原型，他/她就会期望很快获得可工作的产品\n\n## 进化模型：螺旋模型\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_88_0.png)\n\
    \n螺旋模型由 Barry Boehm 在其 1986 年的文章“A Spiral Model of Software Development and Enhancement”中定义。该模型并非第一个讨论迭代的模型，但它是第一个解释迭代为何重要的模型。最初设想时，迭代通常持续\
    \ 6 个月到 2 年。螺旋模型（Boehm, 1988）旨在通过在任何阶段采取任何手段来降低风险。螺旋模型通常被称为风险驱动模型。\n\n定义：螺旋模型，也称为螺旋生命周期模型，是一种用于信息技术（IT）中的系统开发生命周期（SDLC）模型。该开发模型结合了原型模型和瀑布模型的特点。螺旋模型适用于大型、昂贵且复杂的项目。\n\
    \n## 螺旋模型中的步骤\n\n1. 新系统的需求尽可能详细地定义。这通常涉及访谈代表所有外部或内部用户以及现有系统的其他方面的多名用户。\n2. 为新系统创建初步设计。\n\
    3. 根据初步设计构建新系统的第一个原型。这通常是一个规模较小的系统，代表了最终产品特征的近似。\n4. 第二个原型通过四步程序演进：\n   (1) 从其优势、劣势和风险方面评估第一个原型；\n\
    \   (2) 定义第二个原型的需求；\n   (3) 规划和设计第二个原型；\n   (4) 构建和测试第二个原型。\n\n## 螺旋模型中的步骤...\n\
    \n5. 根据客户的选择，如果风险被认为过大，整个**项目可以被中止**（流产）。风险因素可能涉及开发成本超支（超出限度）、运营成本误算（误算），或客户判断可能导致最终产品不令人满意的任何其他因素。\n\
    6. 现有原型以与之前原型相同的方式进行评估，如果必要，根据上面概述的四步程序从中开发**另一个原型**。\n7. 前述步骤迭代进行**直到**客户满意精炼后的原型代表了期望的最终产品。\n\
    8. 最终系统基于**精炼后的原型**构建。\n9. 对**最终系统**进行彻底评估和测试。常规维护持续进行，以防止大规模故障并最大限度地减少停机时间\n\n"
