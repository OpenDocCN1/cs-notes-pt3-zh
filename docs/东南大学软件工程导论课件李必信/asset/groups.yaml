  - '[PAGE 80]


    # The Waterfall Model


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_80_0.png)


    Bradac found that the linear nature of the waterfall model leads to “blocking
    states”.


    Where some members must wait for other members of the team to complete dependent
    tasks.


    Especially, at the beginning of the project.


    Still, however, the waterfall model serve as a useful process model where requirements
    are fixed and work is to proceed to completion in a linear manner.'
  - '[PAGE 81]


    # Waterfall Model Assumptions


    +   1. The requirements are **knowable** in advance of implementation.

    +   2. The requirements have **no unresolved, high-risk implications**.

    +      - e.g., risks due to COTS choices, cost, schedule, performance, safety,
