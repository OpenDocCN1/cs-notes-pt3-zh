  mdcn: "\n\n## 仓库内容\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_432_0.png)\n\n##\
    \ 仓库特性\n\n- **版本控制**：保存所有这些版本以实现产品发布的有效管理，并允许开发人员返回到以前的版本\n- **依赖跟踪和变更管理**：仓库管理存储在其中的数据元素之间各种各样的关系。\n\
    - **需求追溯**：提供跟踪由特定需求规范产生的所有设计和构建组件以及交付物的能力\n- **配置管理**：跟踪代表特定项目里程碑或生产发布的配置系列。版本管理提供所需的版本，链接管理跟踪相互依赖关系。\n\
    - **审计跟踪**[査勘索引]：建立关于何时、为何以及由谁进行更改的额外信息。\n\n## SCM 元素\n\n- **组件元素**——一组工具与文件管理系统耦合在一起（例如，数据库），能够访问和管理每个软件配置项。\n\
    - **流程元素**——一组定义了对所有参与计算机软件的管理、工程和使用的人员进行变更管理（以及相关活动）的有效方法的程序和任务。\n- **构建元素**——一组工具，通过确保已组装了经过验证的组件的正确集合（即正确的版本）来自动化软件的构建。\n\
    - **人员元素**——为了实施有效的 SCM，软件团队使用一组工具和流程特性（涵盖其他 CM 元素）\n\n## SCM 流程\n*解决以下问题 ...*\n\
    \n- 软件团队如何识别软件配置的离散元素？\n- 一个组织如何在能够高效[有效容纳]变更的方式下管理程序（及其文档）的许多现有版本？\n- 一个组织如何在软件发布给客户之前和之后控制变更？\n\
    - 谁对批准和排序变更负责？\n- 我们如何确保变更已正确完成？\n- 使用什么机制来通知[评价]他人所做的变更？\n\n## SCM 流程\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_436_0.png)\n\
    \n## 版本控制\n\n- 版本控制结合了程序和工具来管理在软件过程中创建的配置对象的不同版本\n- 版本控制系统实现或直接集成四项主要功能：\n  -\
    \ 一个项目数据库（仓库），存储所有相关的配置对象\n  - 一个版本管理功能，存储配置对象的所有版本（或使用与过去版本的差异构建任何版本）；\n  - 一个\
    \ make 设施，使软件工程师能够收集所有相关的配置对象并构建软件的特定版本。\n  - 一个问题跟踪（也称为错误跟踪）功能，使团队能够记录和跟踪与每个配置对象相关的所有未解决问题状态。\n\
    \n## 变更控制流程—I\n\n需要变更被识别\n\n来自用户的变更请求\n\n开发人员评估\n\n生成变更报告\n\n变更控制机构决定\n\n请求排队等待处理\n\
    \n变更请求被拒绝\n用户被告知\n\n变更控制流程—II\n\n## 变更控制流程–II\n\n指派人员负责 SCIs\n\n签出 SCIs\n\n进行变更\n\
    \n审查/审计变更\n\n为测试建立“基线”\n\n变更控制流程—III\n\n## 软件工程导论复习\n\nLiao Li\n\nlliao@seu.edu.cn\n\
