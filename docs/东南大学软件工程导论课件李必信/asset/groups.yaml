    \n## 面向对象架构\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_264_0.png)\n\n## 分层架构\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_265_0.png)\n\n## 架构模式\n\n- **并发**\n\
    \  - 操作系统进程管理\n  - 任务调度器\n- **持久化**\n  - 数据库管理系统\n  - 应用级持久化\n- **分布**\n  - 代理\n\
    \n## 架构设计\n\n- **架构上下文图** 模型化软件如何与外部实体交互\n- **原型** 是代表对系统至关重要的抽象的类或模式\n- **架构组件**\
    \ 源自应用领域、基础设施和接口。\n\n## 架构上下文图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_268_0.png)\n\
    \n## SafeHome ACD\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_269_0.png)\n\n##\
    \ SafeHome 原型\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_270_0.png)\n\n## 组件结构\n\
