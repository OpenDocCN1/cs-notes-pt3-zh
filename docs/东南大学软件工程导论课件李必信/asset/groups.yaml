  - '[PAGE 39]


    # Legacy Software


    # Why must it change?


    # Changeability


    +   - It must be fixed to eliminate errors.

    +   - It must be enhanced to implement new functional and non-functional requirements

    +   - Software must be adapted to meet the needs of new computing environments
    or technology.

    +   - Software must be enhanced to implement new business requirements.

    +   - Software must be extended to make it interoperable with other more modern
    systems or databases.

    +   - Software must be re-architected to make it viable within a network environment.'
  - '[PAGE 40]


    # E-Type Systems


    +   - **E-Type Systems:**

    +     Software that has been implemented in a real-world computing context and
    will therefore evolve over time'
  - '[PAGE 41]


    # Software Evolution[Lehman定律]


    +   - **The Law of Continuing Change [持续变化规律] (1974)**: E-type systems must be
    continually adapted else they become progressively less satisfactory.

    +   - **The Law of Increasing Complexity [复杂性增长规律] (1974)**: As an E-type system
    evolves its complexity increases unless work is done to maintain or reduce it.

    +   - **The Law of Self Regulation [自我调控规律] (1974)**: The E-type system evolution
    process is self-regulating with distribution of product and process measures close
    to normal.'
  - '[PAGE 42]


    # Software Evolution…


    +   - **The Law of Conservation of Organizational Stability [组织稳定性守恒规律] (1980)**:
    The average effective global activity rate in an evolving E-type system is invariant
    over product lifetime.

    +   - **The Law of Conservation of Familiarity [保证通晓性规律] (1980)**: As an E-type
    system evolves all associated with it, developers, sales personnel, users, for
    example, must maintain mastery of its content and behavior to achieve satisfactory
    evolution.

    +   - **The Law of Continuing Growth [持续增长规律] (1980)**: The functional content
    of E-type systems must be continually increased to maintain user satisfaction
    over their lifetime.'
  - '[PAGE 43]


    # Software Evolution…


    +   - **The Law of Declining Quality [质量衰减规律] (1996)**: The quality of E-type
    systems will appear to be declining unless they are rigorously maintained and
    adapted to operational environment changes.

    +   - **The Feedback System Law [反馈系统规律] (1996)**: E-type evolution processes
    constitute multi-level, multi-loop, multi-agent feedback systems and must be treated
    as such to achieve significant improvement over any reasonable base.


    Source: Lehman, M., et al, “Metrics and Laws of Software Evolution—The Nineties
    View,” Proceedings of the 4th International Software Metrics Symposium (METRICS
    ’97), IEEE, 1997, can be downloaded from http://www.ece.utexas.edu/~perry/work/papers/feast1.pdf'
  - '[PAGE 44]


    # Software Myths[谬论]


    +   - Affect managers, customers (and other non-technical stakeholders) and practitioners

    +   - Are believable because they often have elements of truth,

    +   *but ...*

    +   - Invariably lead to bad decisions,

    +   *therefore ...*

    +   - Insist on reality as you navigate your way through software engineering'
  - '[PAGE 45]


    # Software Myths


    +   - If we get behind schedule, we can **add more programmers** and catch up.

    +   - **A general statement about objectives** is sufficient to begin building
    programs.

    +   - Change in project requirements can be **easily accommodated** because software
    is flexible.'
  - '[PAGE 46]


    <!-- no content -->'
  - '[PAGE 47]


    # Management Myths


    +   - “We already have a book of standards and procedures for building software.
    It does provide my people **with everything they need** to know …”

    +   - “If my project is behind the schedule, I always can add more programmers
    to it and catch up …”

    +     - (a.k.a. “**The Mongolian Horde concept—蒙古部落的概念**”)

    +   - “If I decide to **outsource** the software project to a third party, I can
    just relax: Let them build it, and I will just pocket my profits …”'
  - '[PAGE 48]


    # Customer Myths


    +   - “A general statement of objectives is sufficient to begin writing programs
    - we can fill in the details later …”

    +   - “Project requirements continually change but this change can easily be accommodated
    because software is flexible …”'
