  mdcn: "\n\n## 遗留软件\n\n## 为什么必须改变？\n\n## 可变性\n\n- 必须修复以消除错误。\n- 必须增强以实现新的功能和非功能需求\n\
    - 软件必须适应以满足新计算环境或技术的需求。\n- 软件必须增强以实现新的业务需求。\n- 软件必须扩展以使其能够与其他更现代的系统或数据库互操作。\n\
    - 软件必须重新架构以使其在网络环境中可行。\n\n## E 型系统\n\n- **E 型系统：**\n  已在真实计算环境中实现的软件，因此会随着时间推移而演进\n\
    \n## 软件演化[Lehman定律]\n\n- **持续变化规律 [The Law of Continuing Change] (1974)**: E 型系统必须不断适应，否则会逐渐变得不令人满意。\n\
    - **复杂性增长规律 [The Law of Increasing Complexity] (1974)**: 随着 E 型系统的演进，其复杂性会增加，除非进行工作以维持或降低它。\n\
    - **自我调控规律 [The Law of Self Regulation] (1974)**: E 型系统演化过程是自我调节的，产品和过程度量的分布接近正态。\n\
    \n## 软件演化…\n\n- **组织稳定性守恒规律 [The Law of Conservation of Organizational Stability]\
    \ (1980)**: 演进中的 E 型系统中平均有效全局活动率在其产品生命周期内保持不变。\n- **保证通晓性规律 [The Law of Conservation\
    \ of Familiarity] (1980)**: 随着 E 型系统的演进，与之相关的人员，例如开发人员、销售人员、用户，必须掌握其内容和行为，以实现令人满意的演进。\n\
    - **持续增长规律 [The Law of Continuing Growth] (1980)**: E 型系统的功能内容必须不断增加，以在其生命周期内保持用户满意度。\n\
    \n## 软件演化…\n\n- **质量衰减规律 [The Law of Declining Quality] (1996)**: 除非严格维护并适应运行环境变化，否则\
    \ E 型系统的质量似乎会下降。\n- **反馈系统规律 [The Feedback System Law] (1996)**: E 型演化过程构成多级、多环、多代理反馈系统，必须如此对待才能在任何合理基准上实现显著改进。\n\
    \n来源：Lehman, M., et al, “Metrics and Laws of Software Evolution—The Nineties View,”\
    \ Proceedings of the 4th International Software Metrics Symposium (METRICS ’97),\
    \ IEEE, 1997, 可从 http://www.ece.utexas.edu/~perry/work/papers/feast1.pdf 下载\n\n\
    ## 软件谬论[谬论]\n\n- 影响管理人员、客户（以及其他非技术利益相关者）和从业人员\n- 因为它们通常包含部分真实，所以是可信的，\n  *但 ...*\n\
    - 无一例外会导致糟糕的决策，\n  *因此 ...*\n- 在软件工程中导航时坚持现实\n\n## 软件谬论\n\n- 如果我们落后于进度，我们可以**增加更多程序员**并赶上进度。\n\
    - **关于目标的一般性陈述**足以开始构建程序。\n- 项目需求的变化可以**轻松适应**，因为软件具有灵活性。\n\n## 管理谬论\n\n- “我们已经有一本构建软件的标准和程序手册。它为我的员工提供了**他们所需了解的一切**…”\n\
    - “如果我的项目落后于进度，我总是可以增加更多程序员来赶上进度…”\n  - （又名“**蒙古部落的概念—The Mongolian Horde concept**”）\n\
    - “如果我决定将软件项目**外包**给第三方，我就可以放松：让他们构建，我只需坐收利润…”\n\n## 客户谬论\n\n- “关于目标的一般性陈述足以开始编写程序——我们可以稍后填补细节…”\n\
    - “项目需求不断变化，但这种变化可以轻松适应，因为软件具有灵活性…”\n\n"
