    \ that is associated with enter\n\n过程抽象是指具有明确和有限功能的指令序列。\n\n例如，“开”隐含了一长串的过程性步骤：走到门前、伸手并抓住把手、转动把手并拉门、推开打开的门等\n\
    \n### 3.2 Architecture\n\n- “The overall structure of the software and the ways\
    \ in which that structure provides conceptual integrity for a system.” [软件的整体结构和这种结构为系统提供概念上完整性的方式][SHA95a]\n\
    - 简而言之，体系结构是程序构件（模块）的结构或组织、这些构件交互的形式、以及构件所用的数据的结构。\n\n### Architecture...\n\n\
    - **Structural properties.** This aspect of the architectural design representation\
    \ defines the **components of a system (e.g., modules, objects, filters)** and\
    \ **the manner** in which those components are packaged and interact with one\
    \ another. For example, objects are packaged to encapsulate both data and the\
    \ processing that manipulates the data and interact via the invocation of methods.\n\
    - **Extra-functional properties.** The architectural design description should\
    \ address **how the design architecture achieves requirements for performance,\
    \ capacity, reliability, security, adaptability, and other system characteristics.**\n\
    - **Families of related systems.** The architectural design should draw upon repeatable\
    \ patterns that are commonly encountered in **the design of families of similar\
    \ systems.** In essence, the design should have the ability to reuse architectural\
    \ building blocks.\n\n### 3.3 Patterns\n\n- A pattern for software architecture\
    \ describes a particular recurring design problem [某个再现的特定设计问题] that arises in\
    \ specific design contexts, and presents a well-proven generic scheme for its\
    \ solution. The solution scheme is specified by describing its constituent components,\
    \ their responsibilities and relationships, and the ways in which they collaborate.\n\
    \n### Some Kinds of Patterns\n\n- An **architectural pattern** expresses **a fundamental\
    \ structural organization schema for software systems**. It provides a set of\
    \ predefined subsystems, specifies their responsibilities, and includes rules\
    \ and guidelines for organizing the relationships between them.\n- A **design\
    \ pattern** provides **a scheme for refining the subsystems** or components of\
    \ a software system, or the relationships between them. It describes a commonly-recurring\
    \ structure of communicating components that solves a general design problem within\
    \ a particular context.\n- An **idiom** is a low-level pattern **specific to a\
    \ programming language**. An idiom describes how to implement particular aspects\
    \ of components or the relationships between them using the features of the given\
    \ language.\n"
  mdcn: "\n\n## Analysis → Design\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_225_0.png)\n\
    \n## 2 设计过程和设计质量\n\n- 软件设计是一个迭代的过程，通过设计过程，需求被变换为用于构建软件的“蓝图”【体系结构设计/概要设计、接口设计】。\n\
    - 随着设计迭代的推进，后续的精化导致更低抽象层次的设计表示【构件级设计/详细设计、接口设计】。\n- 正式的技术评审（technical review）和设计走查（walkthrough）可用于评估设计演化的质量。\n\
    \n## 3 Design Concepts\n\n- **abstraction** — 数据，过程\n- **architecture** — 软件的整体结构\n\
    - **patterns** — “传达”一种经过验证的设计解决方案的“精髓”\n- **modularity** — 数据和功能的分区 [数据和功能划分]\n\
    - **information hiding** — 受控的接口\n- **functional independence** — 高内聚和低耦合\n- **refinement**\
    \ — 对所有抽象进行细节的阐述\n- **refactoring** — 在不影响行为的情况下改进设计\n\n### 3.1 Abstraction et\
    \ al.\n\n- Abstraction\n  - process – 提取本质细节的过程\n  - entity – 模型或聚焦的表示\n- Information\
    \ hiding\n  - 无关信息的抑制\n- Encapsulation\n  - process – 将项目封闭在容器中的过程\n  - entity\
    \ – 容纳项目的封闭物\n\n### Data Abstraction\n\n- 实数\n- 对象\n- 类\n- 构件\n- ……\n\n数据抽象是描述数据对象的命名数据集合。\n\
    \n例如，“门”的数据抽象将包含一组描述门的属性：门的类型/转动方向/开门机构、重量和尺寸等\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_229_0.png)\n\
    \n| door |\n| --- |\n| manufacturer |\n| model number |\n| type |\n| swing direction\
    \ |\n| inserts |\n| lights |\n| &nbsp;&nbsp;type |\n| &nbsp;&nbsp;number |\n|\
    \ weight |\n| opening mechanism |\n\nimplemented as a data structure\n\n### Procedural\
    \ Abstraction\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_230_0.png)\n\nopen\n\
    \ndetails of enter algorithm\n\nimplemented with a \"knowledge\" of the object\
    \ that is associated with enter\n\n过程抽象是指具有明确和有限功能的指令序列。\n\n例如，“开”隐含了一长串的过程性步骤：走到门前、伸手并抓住把手、转动把手并拉门、推开打开的门等\n\
    \n### 3.2 Architecture\n\n- “软件的整体结构和这种结构为系统提供概念上完整性的方式。” [软件的整体结构和这种结构为系统提供概念上完整性的方式][SHA95a]\n\
    - 简而言之，体系结构是程序构件（模块）的结构或组织、这些构件交互的形式、以及构件所用的数据的结构。\n\n### Architecture...\n\n\
    - **Structural properties.** 体系结构设计表示的这一方面定义了**系统的组件（例如，模块、对象、过滤器）**以及**这些组件的打包方式**和**彼此交互的方式**。例如，对象被打包以封装数据和处理该数据的处理，并通过方法调用进行交互。\n\
    - **Extra-functional properties.** 体系结构设计描述应解决**设计体系结构如何实现性能、容量、可靠性、安全、适应性以及其他系统特性方面的需求**。\n\
    - **Families of related systems.** 体系结构设计应利用在**类似系统族的设计中**常见可重复的模式。实质上，设计应具有重用体系结构构建模块的能力。\n\
    \n### 3.3 Patterns\n\n- 软件体系结构的模式描述了在特定设计上下文中出现的某个再现的特定设计问题 [某个再现的特定设计问题]，并提出了一种经过充分验证的通用方案来解决它。解决方案方案通过描述其构成组件、它们的职责和关系以及它们协作的方式来指定。\n\
    \n### Some Kinds of Patterns\n\n- **architectural pattern** 表达了**软件系统的基本结构组织模式**。它提供了一组预定义的子系统，指定了它们的职责，并包括组织它们之间关系的规则和指导方针。\n\
    - **design pattern** 为**细化软件系统的子系统或组件，或它们之间的关系**提供了一种方案。它描述了在特定上下文中解决通用设计问题的通信组件的常见重复结构。\n\
    - **idiom** 是一种特定于编程语言的低级模式**。**idiom** 描述了如何使用给定语言的特性来实现组件的特定方面或它们之间的关系。\n\n"
