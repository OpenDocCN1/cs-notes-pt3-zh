    # Procedural Abstraction


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_230_0.png)


    open


    details of enter algorithm


    implemented with a "knowledge" of the object that is associated with enter


    过程抽象是指具有明确和有限功能的指令序列。


    例如，“开”隐含了一长串的过程性步骤：走到门前、伸手并抓住把手、转动把手并拉门、窗开打开的门等'
  - '[PAGE 231]


    # 3.2 Architecture


    +   ◆ “The overall structure of the software and the ways in which that structure
    provides conceptual integrity for a system.”[软件的整体结构和这种结构为系统提供概念上完整性的方式][SHA95a]

    +   ◆ 简而言之, 体系结构是程序构件（模块）的结构或组织、这些构件交互的形式、以及构件所用的数据的结构。'
  - '[PAGE 232]


    # Architecture...


    +   - **Structural properties.** This aspect of the architectural design representation
    defines the **components of a system (e.g., modules, objects, filters)** and **the
    manner** in which those components are packaged and interact with one another.
    For example, objects are packaged to encapsulate both data and the processing
    that manipulates the data and interact via the invocation of methods.

    +   - **Extra-functional properties.** The architectural design description should
    address **how the design architecture achieves requirements for performance, capacity,
    reliability, security, adaptability, and other system characteristics.**

    +   - **Families of related systems.** The architectural design should draw upon
    repeatable patterns that are commonly encountered in **the design of families
    of similar systems.** In essence, the design should have the ability to reuse
    architectural building blocks.'
  - '[PAGE 233]


    # 3.3 Patterns


    ◆ A pattern for software architecture describes a particular recurring design
    problem [某个再现的特定设计问题] that arises in specific design contexts, and presents a
    well-proven generic scheme for its solution. The solution scheme is specified
    by describing its constituent components, their responsibilities and relationships,
    and the ways in which they collaborate.'
  - '[PAGE 234]


    # Some Kinds of Patterns


    +   ◆ An **architectural pattern** expresses **a fundamental structural organization
    schema for software systems**. It provides a set of predefined subsystems, specifies
    their responsibilities, and includes rules and guidelines for organizing the relationships
    between them.


    +   ◆ A **design pattern** provides **a scheme for refining the subsystems** or
    components of a software system, or the relationships between them. It describes
    a commonly-recurring structure of communicating components that solves a general
    design problem within a particular context.


    +   ◆ An **idiom** is a low-level pattern **specific to a programming language**.
    An idiom describes how to implement particular aspects of components or the relationships
    between them using the features of the given language.'
