    - 7. ……\n\n### 软件工程管理\n- 1. 风险管理（risk）\n- 2. 人员管理（people）\n- 3. 项目管理（project）\n\
    - 4. 过程管理（process）\n- 5. 产品管理（product）\n- 6. 质量管理与控制\n- 7. ……\n\n## （B）第二次软件危机（1968\
    \ to 2001）\n\n## （B.1）危机表现\n- The project will produce the wrong product[有错的产品].\n\
    - The project will produce a product of inferior quality[低质量的产品].\n- The project\
    \ will be late[延迟].\n- We’ll have to work 80 hour weeks[每周工作80小时].\n- We’ll have\
    \ to break commitments[违约].\n- We won’t be having fun[没有休闲时间].\n\n## （B.2）危机根源\n\
    - The assumption is that requirements can be fully understood prior to development\n\
    - Interaction with the customer occurs only at the beginning (requirements) and\
    \ end (after delivery)\n- Unfortunately the assumption almost never holds\n\n\
    ![](img/fcdc64f47992afbcce2e20fafbbb0375_12_0.png)\n\n## （B.3）软件工程理论体系完善\n- Reduce\
    \ risks by improving visibility—**white-box**\n- Allow project **changes** as\
    \ the project progresses\n  - based on feedback from the customer\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_13_0.png)\n\
    \nNo silver bullet\n\n## （C）第三次软件危机（2001 to present）\n- （C.1）危机表现\n  - 变更/演化/重用（质量、效率、成本）\n\
    \  - 知识产权问题、安全问题\n- （C.2）危机根源\n  - 大量遗产系统的挖掘和重用\n  - 大量开源软件/代码的使用\n  - 普遍存在的动态/不确定需求\n\
