  - '[PAGE 171]


    # Domain Analysis


    Software domain analysis is the identification, analysis, and specification of
    common requirements from a specific application domain, typically for reuse on
    multiple projects within that application domain . . .


    [Object-oriented domain analysis is] the identification, analysis, and specification
    of common, reusable capabilities within a specific application domain, in terms
    of common objects, classes, subassemblies, and frameworks . . .


    Donald Firesmith'
  - '[PAGE 172]


    # Domain Analysis


    +   - Define the domain to be investigated.

    +   - Collect a **representative sample** of applications in the domain.

    +   - Analyze each application in the sample.

    +   - Develop an analysis model for the objects.'
  - '[PAGE 173]


    # 8.2 Data Modeling


    +   - examines data objects independently of processing

    +   - focuses attention on the data domain

    +   - creates a model at the customer’s level of abstraction

    +   - indicates how data objects relate to one another'
  - '[PAGE 174]


    # What is a Data Object?


    *Object* — something that is described by a set of attributes (data items) and
    that will be manipulated within the software (system)


    +   - each instance of an object (e.g., a book) can be identified uniquely (e.g.,
    ISBN #)

    +   - each plays a necessary role in the system i.e., the system could not function
    without access to instances of the object

    +   - each is described by attributes that are themselves data items'
  - '[PAGE 175]


    # Typical Objects


    +   - *external entities* (printer, user, sensor)

    +   - *things* (e.g., reports, displays, signals)

    +   - *occurrences or events* (e.g., interrupt, alarm)

    +   - *roles* (e.g., manager, engineer, salesperson)

    +   - *organizational units* (e.g., division, team)

    +   - *places* (e.g., manufacturing floor)

    +   - *structures* (e.g., employee record)'
