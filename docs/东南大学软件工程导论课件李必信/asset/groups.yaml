    # Software Scope


    +   - **Software Project Scope:**

    +     - **Context.** How does the software to be built fit into a larger system,
    product, or business context and what constraints are imposed as a result of the
    context?

    +     - **Information objectives.** What customer-visible data objects (Chapter
    8) are produced as output from the software? What data objects are required for
    input?

    +     - **Function and performance.** What function does the software perform
    to transform input data into output? Are any special performance characteristics
    to be addressed?


