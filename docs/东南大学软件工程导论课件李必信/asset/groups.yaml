  md: "\n## Interface Elements\n\n软件的接口设计相当于一组房屋的门、窗和外部设施的详细绘图。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_248_0.png)\n\
    \n## Component Elements\n\n软件的构件级设计完全类似于某个房屋中每个房间的一组详细绘图。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_249_0.png)\n\
    \n## Deployment Diagram\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_250_0.png)\n\
    \n部署级设计元素指明软件功能和子系统将如何在支持软件的物理计算环境内分布。\n\nSafeHome  \n控制面板\n\n基于住宅的PC\n\nCPI公司的服务器\n\
    \n## 5 Design Principles\n\n- ① The design process **should not suffer from**\
    \ ‘tunnel vision[视野狭隘].’\n- ② The design **should be traceable to** the analysis\
    \ model.\n- ③ The design **should not reinvent** the wheel.\n- ④ The design **should\
    \ “minimize the intellectual distance[理解差异]”** between the software and the problem\
    \ as it exists in the real world.\n- ⑤ The design **should exhibit** uniformity\
    \ and integration.\n- ⑥ The design **should be structured to** accommodate change.\n\
    - ⑦ The design **should be structured to** degrade gently, even when aberrant\
    \ data, events, or operating conditions are encountered.\n- ⑧ **Design is not\
    \ coding, coding is not design.**\n- ⑨ The design **should be assessed** for quality\
    \ as it is being created, not after the fact.\n- ⑩ The design **should be reviewed\
    \ to** minimize conceptual (semantic) errors.\n\n## 6 Design and Quality\n\n-\
    \ The design must implement all of the explicit requirements contained in the\
    \ analysis model, and it must accommodate all of the implicit requirements desired\
    \ by the customer.\n- The design must be a readable, understandable guide for\
    \ those who generate code and for those who test and subsequently support the\
    \ software.\n- The design should provide a complete picture of the software, addressing\
    \ the data, functional, and behavioral domains from an implementation perspective.\n\
    \n## Quality Guidelines\n\n- A design **should exhibit** an architecture that\
    \ (1) has been created using recognizable architectural styles or patterns, (2)\
    \ is composed of components that exhibit good design characteristics and (3) can\
    \ be implemented in an evolutionary fashion\n  - For smaller systems, design can\
    \ sometimes be developed linearly.\n- A design **should be** modular; that is,\
    \ the software should be logically partitioned into elements or subsystems\n-\
    \ A design **should contain** distinct representations of data, architecture,\
    \ interfaces, and components.\n- A design **should lead to** data structures that\
    \ are appropriate for the classes to be implemented and are drawn from recognizable\
    \ data patterns.\n- A design **should lead to** components that exhibit independent\
    \ functional characteristics.\n- A design **should lead to** interfaces that reduce\
    \ the complexity of connections between components and with the external environment.\n\
    - A design **should be** derived using a repeatable method that is driven by information\
    \ obtained during software requirements analysis.\n- A design **should be** represented\
    \ using a notation that effectively communicates its meaning.\n\n## Chapter 10:\
    \ Architectural Design\n\n**Software Engineering: A Practitioner’s Approach, 6th\
    \ edition**\n*by Roger S. Pressman*\n\n### 概述\n\n人们不能在没有图纸的情况下建房子，同样也不能通过勾画出房子的管道布局而开始绘制房子的蓝图。在开始考虑细节之前，需要关注整体视图——房子本身。这就是体系结构设计需要做的事情——它为你提供整体的视图并保证得到正确的理解。\n\
    \n### Software Architecture\n\n- The software architecture of a program or computing\
    \ system **is the structure or structures of the system**, which comprise the\
    \ software components, the externally visible properties of those components,\
    \ and the relationships among them.\n\n> — Bass et al.\n\n### Data Design\n\n\
    - Architectural level → Database design\n  - data mining\n  - data warehousing\n\
    - Component level → Data structure design\n\n### Architectural Styles\n\n- Each\
    \ style describes a system category that encompasses:\n  - **a set of components**\
    \ (e.g., a database, computational modules) that perform a function required by\
    \ a system,\n  - **a set of connectors** that enable “communication, coordination,\
    \ and cooperation” among components,\n  - **constraints** that define how components\
    \ can be integrated to form the system, and\n  - **semantic models** that enable\
    \ a designer to understand the overall properties of a system.\n"
  mdcn: "\n\n## Interface Elements\n\n软件的接口设计相当于一组房屋的门、窗和外部设施的详细绘图。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_248_0.png)\n\
    \n## Component Elements\n\n软件的构件级设计完全类似于某个房屋中每个房间的一组详细绘图。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_249_0.png)\n\
    \n## Deployment Diagram\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_250_0.png)\n\
    \n部署级设计元素指明软件功能和子系统将如何在支持软件的物理计算环境内分布。\n\nSafeHome  \n控制面板\n\n基于住宅的PC\n\nCPI公司的服务器\n\
    \n## 5 Design Principles\n\n- ① 设计过程**不应遭受**‘tunnel vision[视野狭隘].’\n- ② 设计**应可追溯到**分析模型。\n\
    - ③ 设计**不应重新发明**轮子。\n- ④ 设计**应“最小化智力距离[理解差异]”**在软件与现实世界中存在的问题之间。\n- ⑤ 设计**应表现出**统一性和集成性。\n\
    - ⑥ 设计**应结构化以**适应变化。\n- ⑦ 设计**应结构化以**即使遇到异常数据、事件或操作条件也能温和降级。\n- ⑧ **设计不是编码，编码不是设计。**\n\
    - ⑨ 设计**应在创建过程中**进行质量评估，而不是事后。\n- ⑩ 设计**应被审查以**最小化概念（语义）错误。\n\n## 6 Design and\
    \ Quality\n\n- 设计必须实现分析模型中包含的所有明确需求，并且必须满足客户期望的所有隐含需求。\n- 设计必须是可读、易懂的指南，供生成代码的人员以及测试和随后支持软件的人员使用。\n\
    - 设计应提供软件的完整图景，从实现角度解决数据、功能和行为域。\n\n## Quality Guidelines\n\n- 设计**应表现出**一种架构，该架构（1）使用可识别的架构风格或模式创建，（2）由表现出良好设计特征的组件组成，并且（3）可以以演进的方式实现\n\
    \  - 对于较小的系统，设计有时可以线性开发。\n- 设计**应为**模块化的；也就是说，软件应逻辑地划分为元素或子系统\n- 设计**应包含**数据的、架构的、接口的和组件的明确表示。\n\
    - 设计**应导致**适合要实现类的适当数据结构，并且源自可识别的数据模式。\n- 设计**应导致**表现出独立功能特征的组件。\n- 设计**应导致**减少组件之间以及与外部环境连接复杂性的接口。\n\
    - 设计**应使用**在软件需求分析期间获得的信息驱动的可重复方法进行派生。\n- 设计**应使用**能有效传达其含义的记法表示。\n\n## Chapter\
    \ 10: Architectural Design\n\n**Software Engineering: A Practitioner’s Approach,\
    \ 6th edition**\n*by Roger S. Pressman*\n\n### 概述\n\n人们不能在没有图纸的情况下建房子，同样也不能通过勾画出房子的管道布局而开始绘制房子的蓝图。在开始考虑细节之前，需要关注整体视图——房子本身。这就是体系结构设计需要做的事情——它为你提供整体的视图并保证得到正确的理解。\n\
    \n### Software Architecture\n\n- 程序或计算系统的软件架构**是系统的结构或结构**，其包括软件组件、这些组件的外部可见属性以及它们之间的关系。\n\
    \n> — Bass et al.\n\n### Data Design\n\n- 架构级 → 数据库设计\n  - 数据挖掘\n  - 数据仓库\n- 组件级\
    \ → 数据结构设计\n\n### Architectural Styles\n\n- 每种风格描述一个系统类别，该类别涵盖：\n  - **一组组件**（例如，数据库、计算模块）执行系统所需的功能，\n\
    \  - **一组连接器**使组件之间能够“通信、协调和合作”，\n  - **约束**定义组件如何集成形成系统，以及\n  - **语义模型**使设计师能够理解系统的整体属性。\n\
    \n"
