  mdcn: "\n## 用例图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_188_0.png)\n\n## 活动图\n\
    \n通过提供过程流程的图示化表示来补充用例。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_189_0.png)\n\
    \n## 泳道图\n\n允许建模者表示用例所描述的活动流程，同时指明哪个参与者（如果特定用例涉及多个参与者）或分析类负责活动矩形所描述的动作。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_190_0.png)\n\
    \n## 8.6 面向流的建模\n\n表示数据对象在系统中移动时如何被变换。\n\n数据流图（DFD）是所使用的图示化形式。\n\n尽管许多人认为这是一种“老派”方法，面向流的建模仍然提供了一种独特的系统视图——它应当用于补充其他分析模型元素。\n\
    \n## 流模型\n\n每个基于计算机的系统都是一个信息变换……\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_192_0.png)\n\
    \n## 流建模符号\n\n- 外部实体\n- 处理\n- 数据流\n- 数据存储\n\n## 外部实体\n\n数据的生产者或消费者\n\n示例：一个人、一个设备、一个传感器\n\
    \n另一个示例：基于计算机的系统\n\n*数据必须始终来源于某处，并且必须始终发送到某处*\n\n## 处理\n\n数据变换器（将输入变为输出）\n\n示例：计算税费、确定面积、格式化报表、显示图形\n\
    \n> *数据必须始终以某种方式被处理，以实现系统功能*\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_195_0.png)\n\
    \n## 数据存储\n\n数据通常被存储起来以备后用。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_197_0.png)\n\
    \n## 数据流图绘制指南\n\n- 所有图标都必须使用有意义的名称进行标注\n- DFD 通过多个*详细级别*逐步演化\n- 始终从*上下文级图*（也称为\
    \ 0 层）开始\n- 始终在 0 层显示外部实体\n- 始终为数据流箭头添加标签\n- 不要表示过程逻辑\n\n## 构建 DFD\n\n- 检查数据模型以分离数据对象，并使用语法解析来确定“操作”\n\
    - 确定外部实体（数据生产者与消费者）\n- 创建 0 层 DFD\n\n## 0 层 DFD 示例\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_200_0.png)\n\
    \n## 构建 DFD……\n\n- 编写描述变换的叙述\n- 进行解析以确定下一级变换\n- “平衡”数据流以保持数据流连续性\n- 开发 1 层 DFD\n\
    - 使用约 1:5 的扩展比例\n\n## DFD：前瞻\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_202_0.png)\n\
    \n分析模型\n\n映射到\n\n设计模型\n\n## 控制流图\n\n- 表示“事件”以及管理事件的处理\n- “事件”是一种布尔条件，可以通过以下方式确定：\n\
    \  - 列出软件“读取”的所有传感器。\n  - 列出所有中断条件。\n  - 列出操作员触发的所有“开关”。\n  - 列出所有数据条件。\n  - 回顾应用于处理叙述的名词/动词解析，将所有“控制项”视为可能的\
    \ CSPEC 输入/输出。\n\n## 8.7 基于类的建模\n\n- 通过检查问题陈述来识别分析类\n- 使用“语法解析”来分离潜在的类\n- 识别每个类的属性\n\
    - 识别操作这些属性的操作\n\n## 分析类\n\n- **外部实体**（例如其他系统、设备、人员）产生或消费由基于计算机的系统使用的信息。\n- **事物**（例如报表、显示、信件、信号）是问题信息域的一部分。\n\
    - **发生或事件**（例如财产转移或一系列机器人动作的完成）发生在系统运行的上下文范围内。\n- **角色**（例如经理、工程师、销售人员）由与系统交互的人员扮演。\n\
    - **组织单位**（例如部门、小组、团队）与应用相关。\n- **场所**（例如制造车间或装卸码头）确立了问题的上下文和系统的整体功能。\n- **结构**（例如传感器、四轮车辆或计算机）定义了一类对象或相关的对象类。\n\
    \n"
