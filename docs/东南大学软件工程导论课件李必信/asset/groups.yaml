    \n## 8.1 Requirements Analysis\n\n- Requirements analysis\n  - specifies software’s\
    \ operational characteristics\n  - indicates software's interface with other system\
    \ elements\n  - establishes constraints that software must meet\n- Requirements\
    \ analysis allows the software engineer (called an analyst or modeler in this\
    \ role) to:\n  - elaborate on basic requirements established during earlier requirement\
    \ engineering tasks\n  - build models that depict user scenarios, functional activities,\
    \ problem classes and their relationships, system and class behavior, and the\
    \ flow of data as it is transformed.\n\n## A Bridge\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_169_0.png)\n\
    \n## Rules of Thumb [经验原则]\n\n- The model should focus on requirements that are\
    \ visible within the problem or business domain. The level of abstraction should\
    \ be relatively high.\n- Each element of the analysis model should add to an overall\
    \ understanding of software requirements and provide insight into the information\
    \ domain, function and behavior of the system.\n- Delay consideration of infrastructure\
    \ and other non-functional models until design.\n- Minimize coupling throughout\
    \ the system.\n- Be certain that the analysis model provides value to all stakeholders.\n\
    - Keep the model as simple as it can be.\n"
  mdcn: "\n## 4 构建分析模型\n\n### 4.1 分析模型的元素\n\n- 基于场景的元素\n  - 用例—外部参与者如何与系统交互（用例图；详细模板）\n\
    \  - 功能—软件功能在系统中如何处理（流程图；活动图）\n- 基于类的元素\n  - 各种系统对象（从场景中获得）包括其属性和功能（类图）\n- 行为元素\n\
    \  - 系统如何响应不同事件（状态图）\n- 面向流的元素\n  - 信息如何在系统中流动时被转换（数据流图）\n\n## 用例图\n\n## SafeHome住宅安全功能的用例图\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_159_0.png)\n\n## RE 的活动图\n\n导出需求描绘了一个UML活动图,显示了三层细节内容.\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_160_0.png)\n\n## 类图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_161_0.png)\n\
    \n描绘SafeHome安全功能传感器类的类图。\n\n## 状态图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_162_0.png)\n\
    \n状态名：如读指令。\n\n状态变量：指出状态如何向外界显示自己。\n\n状态活动：指出如何进入状态(entry/)，以及当处在该状态时可以调动的动作(do:)。\n\
    \n## 5 协商需求\n\n- 要让客户以成本和产品投放市场的时间为背景,平衡功能、性能和其它的产品或系统特性。协调过程的目的是保证所开发的项目计划，在满足客户需求的同时反映软件团队所处的真实世界限制（如时间、人员、预算等）\n\
    \  - 确定关键利益相关者\n    - 他们是参与谈判的人\n  - 确定每个利益相关者的“获胜条件”\n    - 获胜条件并不总是显而易见\n  -\
    \ 谈判\n    - 努力达成一套导致“双赢”的需求\n\n## 6 验证需求\n\n- 每个需求是否与系统目标一致？\n- 所有需求是否都已在适当的抽象级别上指定？\n\
    - 该需求真的有必要吗？\n- 每个需求是否都有界限且无歧义？\n- 每个需求是否有归属[归属]？\n- 是否有任何需求与其它需求冲突？\n- 每个需求在系统的技术环境中是否可实现？\n\
    - 每个需求在实现后是否可测试？\n- 模型是否反映了系统的信息、功能和行为？\n- 模型是否已得到适当的“划分”？\n- 是否使用了适当的模式需求？\n\n\
    ## 第8章\n## 分析建模\n\n## 本章要点\n\n- 领域分析\n- 数据建模\n- OO概念\n- 分析建模\n  - 基于场景的建模\n  -\
    \ 面向流的建模\n  - 基于类的建模\n  - 行为建模\n\n## 概述\n\n- 使用很多不同格式的图表为信息、功能和行为需求建模。\n- 基于场景的建模从用户的角度表现系统；\n\
    - 面向流的建模在说明数据对象如何通过处理函数进行转换方面提供了指示；\n- 基于类的建模定义了对象、属性和关系；行为建模描述了系统状态、类和事件在这些类上的影响。\n\
    - 一旦创建了模型的雏型，就将不断改进，并分析评估清晰性、完整性和一致性。最终的分析模型将由所有的共同利益者确认。\n\n## 8.1 需求分析\n\n-\
    \ 需求分析\n  - 指定软件的运行特性\n  - 指出软件与其他系统元素的接口\n  - 建立软件必须满足的约束\n- 需求分析使软件工程师（在此角色中称为分析师或建模者）能够：\n\
    \  - 在早期需求工程任务中建立的基本需求上进行详细说明\n  - 构建描绘用户场景、功能活动、问题类及其关系、系统和类行为、以及数据流的模型，因为它被转换。\n\
    \n## 一座桥\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_169_0.png)\n\n## 经验法则 [经验原则]\n\
    \n- 模型应关注问题或业务域中可见的需求。抽象级别应相对较高。\n- 分析模型的每个元素都应增加对软件需求的整体理解，并提供对系统信息域、功能和行为的洞察。\n\
    - 将基础设施和其他非功能模型的考虑推迟到设计阶段。\n- 在整个系统中最小化耦合。\n- 确保分析模型为所有利益相关者提供价值。\n- 保持模型尽可能简单。\n"
