    \n### Chapter 1 软件工程介绍：\n\n- 软件，软件特性，软件退化，软件危机等概念\n\n### Chapter 2 过程综述：\n\n-\
    \ 概念：\n  - 软件工程\n  - 软件过程\n\n- 软件过程模型\n  - 框架活动Framework activities\n  - Umbrella\
