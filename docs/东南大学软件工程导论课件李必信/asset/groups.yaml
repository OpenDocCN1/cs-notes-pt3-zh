  - '[PAGE 242]


    # 3.7 Functional Independence


    COHESION - the degree to which a module performs one and only one function.


    COUPLING - the degree to which a module is "connected" to other modules in the
    system.'
  - '[PAGE 243]


    # 3.8 Refactoring


    Fowler [FOW99] defines refactoring in the following manner:


    > "Refactoring is the process of changing a software system in such a way that
    it does not alter the external behavior of the code [design] yet improves its
    internal structure."


    When software is refactored, the existing design is examined for


    +   - redundancy

    +   - unused design elements

    +   - inefficient or unnecessary algorithms

    +   - poorly constructed or inappropriate data structures or any other design
    failure that can be corrected to yield a better design.'
  - '[PAGE 244]


    # 3.9 Design Classes


    +   - User interface classes – define abstractions necessary for HCI.

    +   - Business domain classes – refinements of analysis classes.

    +   - Process classes – lower-level business abstractions that manage business
    domain classes.

    +   - Persistent classes – data stores (databases) that persist beyond execution
    of the software.

    +   - System classes – management and control functions that enable the system
    to operate and communicate within its computing environment and with the outside
    world.'
  - '[PAGE 245]


    # Well-formed Design Class


    +   - **Complete and sufficient** – class should be a complete and sufficient
    encapsulation of reasonable attributes and methods.

    +   - **Primitiveness[原始性]** – each method should be focused on one thing.

    +   - **High cohesion** – class should be focused on one kind of thing.

    +   - **Low coupling** – collaboration should be kept to an acceptable minimum.'
