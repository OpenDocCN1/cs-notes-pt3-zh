    \ set of tools coupled within a file management system (e.g., a database) that\
    \ enables access to and management of each software configuration item.\n- **Process\
    \ elements**—a collection of procedures and tasks that define an effective approach\
    \ to change management (and related activities) for all constituencies involved\
    \ in the management, engineering and use of computer software.\n- **Construction\
    \ elements**—a set of tools that automate the construction of software by ensuring\
    \ that the proper set of validated components (i.e., the correct version) have\
    \ been assembled.\n- **Human elements**—to implement effective SCM, the software\
    \ team uses a set of tools and process features (encompassing other CM elements)\n\
    \n## The SCM Process\n*Addresses the following questions ...*\n\n- How does a\
    \ software team identify the discrete elements of a software configuration?\n\
    - How does an organization manage the many existing versions of a program (and\
    \ its documentation) in a manner that will enable change to be accommodated efficiently[有效容纳]?\n\
    - How does an organization control changes before and after software is released\
    \ to a customer?\n- Who has responsibility for approving and ranking changes?\n\
    - How can we ensure that changes have been made properly?\n- What mechanism is\
    \ used to appraise[评价] others of changes that are made?\n\n## The SCM Process\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_436_0.png)\n\n## Version Control\n\n\
    - Version control combines procedures and tools to manage different versions of\
    \ configuration objects that are created during the software process\n- A version\
    \ control system implements or is directly integrated with four major capabilities:\n\
    \  - a project database (repository) that stores all relevant configuration objects\n\
    \  - a version management capability that stores all versions of a configuration\
    \ object (or enables any version to be constructed using differences from past\
    \ versions);\n  - a make facility that enables the software engineer to collect\
    \ all relevant configuration objects and construct a specific version of the software.\n\
