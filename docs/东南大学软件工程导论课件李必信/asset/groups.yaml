    ## 1.4 边值分析


    - 在软件设计和程序编写中，常常对于规格说明中的输入域边界或输出域边界不够注意，以致形成一些差错。


    - 实践证明，在设计测试用例时，对边界附近的处理必须给予足够的重视，为检验边界附近的处理专门设计测试用例，常常取得良好的测试效果。


    ## 遵循以下几条原则


    ②针对规格说明的每个输出条件使用前面的第①条原则。


    例如，某程序的规格说明要求计算出“每月保险金扣除额为0至1165.25元”，其测试用例可取0.00及1165.2、还可取−0.01及1165.26等。如果另一程序属于情报检索系统，要求每次“最多显示1-4条情报摘要”，这时我们应考虑的测试用例包括1和4，还应包括0和5等。


    ## 遵循以下几条原则


    ③如果程序规格说明中提到的输入或输出域是个有序的集合（如顺序文件、表格等），就应注意选取有序集的第一个和最后一个元素作为测试用例。


    ④分析规格说明，找出其它的可能边界条件。


    ## 例子


    某个“为学生考试试卷评分和成绩统计”的程序，其规格说明指出了对程序的要求：程序的输入文件由80个字符的一些记录组成，这些记录分为三组：


    ① 标题


    这一组只有一个记录，其内容为输出报告的名字。


    ② 试卷各题标准答案记录


    每个记录均在第80个字符处标以数字“2”。该组的第一個记录的第1至第3个字符为题目编号（取值为1—999）。第10至第59个字符给出第1至第50题的答案（每个合法字符表示一个答案）。该组的第2，第3个记录相应为第51至第100，第101至第150，...题的答案。


    ## 例子


    ③每个学生的答卷描述


    该组中每个记录的第80个字符均为数字“3”。每个学生的答卷在若干个记录中给出。如甲的首记录第1至第9字符给出学生姓名及学号，第10至第59字符列出的是甲所做的第1至第50题的答案。若试题数超过50，则第2，第3纪录分别给出他的第51至第100，第101至第150……题的解答。然后是学生乙的答卷记录。


    若学生最多为200人，输入数据的形式如图4.15所示。


    ## 例子


    学生考卷评分和成绩统计程序输入数据的形


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_494_0.png)


    图4.15 学生考卷评分和成绩统计程序输入数据格式


    ## 例 子


    该程序应给出4个输出报告，即：


    ① 按学生学号排序，每个学生的成绩（答对的百分比）和等级报告。

    ② 按学生得分排序，每个学生的成绩。

    ③ 平均分数，以及最高与最低分之差。

    ④ 按题号排序，每题学生答对的百分比


    ## 例子


    | 输入条件 | 测试用例 |

    | --- | --- |

    | 输入文件 | 空输入文件 |

    | 标题 | 无标题记录<br>只有1个字符的标题<br>具有80个字符的标题 |

    | 出题个数 | 出了1个题<br>出了50个题<br>出了51个题<br>出了100个题<br>除了999个题<br>没有出题 |

    | 答案记录 | 题目记录后没有标准答案记录<br>标准答案记录多一个<br>标准答案记录少一个 |

    | 学生人数 | 学生人数为0<br>学生人数为1<br>学生人数为200<br>学生人数为201 |

    | 学生答题 | 某学生只有1个答卷记录，但有两个标准答案记录<br>该学生是文件中的第一个学生<br>该学生是文件中的最后一个学生 |

    | 学生答题 | 某学生有2个答卷记录，但只有一个标准答案记录<br>该学生是文件中的第个学生 |


    | 输出条件 | 测试用例 |

    | --- | --- |

    | 学生得分 | 所有学生得分相同<br>所有学生得分不同<br>一些学生（不是全部）得分相同（用以计算等级）<br>1个学生得0分<br>1个学生得100分
    |

    | 输出报告(1),(2) | 1个学生编号最小（检查排序）<br>1个学生编号最大<br>学生数好使报告刚满一页（检查分页）<br>学生数使报告1页打印不够，恰好多1人
    |

    | 输出报告(3) | 平均值取最大值（所有学生都得满分）<br>平均值为0（所有学生都得0分）<br>标准偏差取最大值（1学生得0分，1学生得100分）<br>标准偏差相同（所有学生得分相同）
    |

    | 输出报告(4) | 所有学生都答对第1题<br>所有学生都答错第1题<br>所有学生都答对最后1题<br>所有学生都答错最后1题<br>题目恰好使报告打印在1页上
    |


    ## 讨论


    - 边值分析是最常用的测试用例设计方法。

    - 软件开发人员如何有把握地说，“我的软件好像没问题了”。（猜测各种可能出现的情况）


    ## 讨 论


    - 工程设计或者事务处理项目中经常使用判定表。

    - 判定表在软件开发和测试中的作用。


    ## 讨论


    - 测试用例设计方法（逻辑驱动，等价类划分，因果图分析，边值分析，判定表驱动）：对需求进行分析，找到尽可能多的有代表性的测试用例；

    - 不局限于一种方法，可以组合使用多种方法；

    - 还可以采用其他有效的方法；


    ## 2 白盒测试方法


    - 程序结构分析

    - 逻辑覆盖

    - 程序插装


    ## 2.1 程序结构分析


    - 控制流分析

    - 数据流分析

    - 信息流分析


    ## 2.2 逻辑覆盖


    - 语句覆盖

    - 判定覆盖

    - 条件覆盖

    - 判定/条件覆盖

    - 条件组合覆盖

    - 路径覆盖


    ## 逻辑覆盖


    人员使用逻辑驱动测试方法，主要想对程序模块进行如下的检查：

    - 对程序模块的所有独立的执行路径至少测试一次；

    - 对所有的逻辑判定，取“真”与取“假”的两种情况都至少测试一次；

    - 在循环的边界和运行界限内执行循环体；

    - 测试内部数据结构的有效性，等。


    ## 被测程序段流程图


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_504_0.png)


    ## 2.2.1 语句覆盖


    程序中每一可执行语句至少执行一次


    ```

    A=2

    B=0

    X=3


    a c e

    ```


    此例仅用一个测试用例，通常需要多个


    ## 语句覆盖的缺陷


    - 从程序中每个语句都得到执行这一点来看，语句覆盖的方法似乎能够比较全面地检验每一个语句。

    - 判定条件错误检查不到

    - “语句覆盖”是很不充分的一种标准,仍然很弱。


    ## 2.2.2 判定覆盖


    程序中每个判定的取真分支和取假分支至少执行一次（也称分支覆盖）


    A=2，B=0，X=3 时，a、c、e 及 A=1，B=0，X=1 时，a、b、d


    或


    A=3，B=0，X=3 时，a、c、d 及 A=2，B=1，X=1 时，a、b、e


    ## 2.2.3 条件覆盖


    使程序的判定中每个条件的真假取值至少满足一次


    例中设条件

    A>1

    B=0

    A=2

    X>1

    取真表为

    T₁

    T₂

    T₃

    T₄

    取假表为

    ⊥₁

    ⊥₂

    ⊥₃

    ⊥₄


    | A B X | 经历 | 覆盖分支 | 覆盖条件 |

    | 2 0 3 | a c e | c e | T₁ T₂ T₃ T₄ |

    | 1 0 1 | a b d | b d | ⊥₁ T₂ ⊥₃ ⊥₄ |

    | 2 1 1 | a b e | b e | T₁ ⊥₂ T₃ ⊥₄ |

    |  |  | 4分支 | 4条件8取值 |


    ## 条件覆盖


    另一例：


    | ABX | 经历 | 覆盖分支 | 覆盖条件 |

    | --- | --- | --- | --- |

    | 1 0 3 | a b e | b e | T₁ T₂ T₃ T₄ |

    | 2 1 1 | a b e | b e | T₁ T₂ T₃ T₄ |


    2分支

    4条件8取值


    覆盖了条件的测试用例不一定覆盖分支。事实上，它只覆盖了4个分支中的两个（b和e）。为解决这一矛盾，需要兼顾条件和分支。


    ## 2.2.4 判定/条件覆盖


    判定 / 条件覆盖要求设计足够的测试用例，使得判定中每个条件的所有可能（真 / 假）至少出现一次，并且每个判定本身的判定结果（真 / 假）也至少出现一次。


    | A B X | 覆盖组号 | 经历 | 覆盖条件 |

    | --- | --- | --- | --- |

    | 2 0 3 | ① ⑤ | a c e | T₁ T₂ T₃ T₄ |

    | 2 1 1 | ② ⑥ | a b e | T₁ ¬T₂ T₃ ¬T₄ |

    | 1 0 2 | ③ ⑦ | a b e | ¬T₁ T₂ ¬T₃ T₄ |

    | 1 1 1 | ④ ⑧ | a b d | ¬T₁ ¬T₂ ¬T₃ ¬T₄ |


    ## 条件组合覆盖


    满足“条件组合覆盖”的测试用例是一定满足“判定覆盖”、“条件覆盖”和“判定/条件覆盖”的。

    这一程序段共有四条路径。以上4个测试用例固然覆盖了条件组合，同时也覆盖了4个分支，但仅覆盖了3条路径，却漏掉了路径acd。

    前面讨论的多种覆盖准则，有的虽提到了所走路径问题，但尚未涉及到路径的覆盖，而路径能否全面覆盖在软件测试中是个重要问题，因为程序要取得正确的结果，就必须消除遇到的各种障碍，沿着特定的路径顺利执行。

    如果程序中的每一条路径都得到考验，才能说程序受到了全面检验。

