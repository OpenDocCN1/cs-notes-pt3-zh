    # 12 Principles of Agility——敏捷联盟[2003]


    +   1. Our **highest priority** is to satisfy the customer through early and continuous
    delivery of valuable software.\n   [我们最先要做的是通过尽早、持续交付有价值的软件来使客户满意]


    +   2. Welcome **changing requirements**, even late in development. Agile processes
    harness change for the customer’s competitive advantage.\n   [即使在开发的后期，也欢迎需求变更。敏捷过程利用变更为客户创造竞争优势]


    +   3. **Deliver working software frequently**, from a couple of weeks to a couple
    of months, with a preference to the shorter time scale.\n   [经常交付可工作软件，交付的时间间隔可以从几个星期到几个月，交付的时间间隔越短越好]


    +   4. Business people and developers must **work together** daily throughout
    the project.\n   [在整个项目开发期间，业务人员和开发人员必须天天都在一起工作]'
