    \n## （2）什么软件工程核心关注点\n\n| 关注点 | 问题 | 手段 |\n|---|---|---|\n| 质量<br>效率<br>成本<br>变更<br>……\
    \ | 如何提高产品质量 | 软件质量保障技术 |\n|  | 如何提高管理效率，降低成本，缩短上市时间 | 软件工程过程模型 |\n|  | 如何提高开发效率，解决维护难的问题\
    \ | 软件开发方法/语言/工具 |\n|  | 如何适应用户需求变更 | 演化维护技术 |\n\n持续关注点：（质量、效率、成本）变更\n\n## IEEE\
    \ Standard 610.12-1990\n\n## Software Engineering\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_16_0.png)\n\
