    \ where\n\n可靠性的一种简单度量是 *平均故障间隔时间*（MTBF），其中\n\n  **MTBF = MTTF + MTTR**\n\n- The\
    \ acronyms MTTF and MTTR are *mean-time-to-failure* and *mean-time-to-repair*,\
    \ respectively.\n\n缩写 MTTF 和 MTTR 分别指 *平均故障时间* 和 *平均修复时间*。\n\n- *Software availability*\
    \ is the probability that a program is operating according to requirements at\
    \ a given point in time and is defined as\n\n*软件可用性* 是程序在给定时间点按要求运行的概率，定义为\n\n\
    \  **Availability = [MTTF/(MTTF + MTTR)] x 100%**\n\n## Software Safety\n\n软件安全性\n\
    \n- **Software safety** is a software quality assurance activity that focuses\
    \ on the **identification and assessment** of potential **hazards** that may affect\
    \ software negatively and cause an entire system to fail.\n- **软件安全性** 是一种软件质量保证活动，专注于潜在\
    \ **危害** 的 **识别和评估**，这些危害可能对软件产生负面影响并导致整个系统失效。\n- If hazards can be identified\
    \ early in the software process, software design features can be specified that\
    \ will either eliminate or control potential hazards.\n\n如果能在软件过程中早期识别出危害，就可以指定软件设计特性来消除或控制潜在危害。\n\
    \n## ISO 9001:2000 Standard\n\nISO 9001:2000 标准\n\n- ISO 9001:2000 is the **quality\
    \ assurance standard** that applies to software engineering.\n- ISO 9001:2000\
    \ 是适用于软件工程的 **质量保证标准**。\n- The standard contains **20 requirements** that must\
    \ be present for an effective quality assurance system.\n- 该标准包含 **20 项要求**，有效质量保证系统必须具备这些要求。\n\
    - The requirements delineated by ISO 9001:2000 address topics such as\n- ISO 9001:2000\
    \ 规定的要求涉及以下主题，例如\n  - management responsibility, **quality system**, contract\
    \ review, **design control**, document and data control, **product identification\
    \ and traceability**, process control, **inspection and testing**, corrective\
    \ and preventive action, **control of quality records**, internal quality audits,\
    \ **training**, servicing, and **statistical techniques**.\n  - 管理职责、**质量体系**、合同评审、**设计控制**、文件和数据控制、**产品识别和可追溯性**、过程控制、**检验和测试**、纠正和预防措施、**质量记录控制**、内部质量审核、**培训**、服务和\
    \ **统计技术**。\n\n## Chapter 27: Change Management\n\n第27章：变更管理\n\nSoftware Engineering:\
    \ A Practitioner's Approach, 6th edition  \n软件工程：实践者的视角，第6版  \nby Roger S. Pressman\n\
    \n作者 Roger S. Pressman\n\n## 本章要点\n\n- 软件配置管理\n- 版本控制\n- 变更控制\n\n## The \"First\
    \ Law\"\n\n> No matter where you are in the system life cycle, the system will\
    \ change, and the desire to change it will persist throughout the life cycle.\n\
    >\n> 无论你在系统生命周期中的哪个阶段，系统都会发生变化，并且改变它的愿望将贯穿整个生命周期。\n>\n> Bersoff, et al, 1980\n\
    \n## The Software Configuration\n\n软件配置\n\nThe pieces\n\n组成部分\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_427_0.png)\n\
    \n## Baselines\n\n基线\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_428_0.png)\n\n\
    - The IEEE (IEEE Std. No. 610.12-1990) defines a **baseline** as:\n  - IEEE（IEEE\
    \ Std. No. 610.12-1990）将 **基线** 定义为：\n  - **A specification or product** that\
    \ has been formally reviewed and agreed upon, that thereafter serves as the basis\
    \ for further development, and that can be changed only through formal change\
    \ control procedures.\n  - **一份规范或产品**，经过正式评审并达成一致，此后作为进一步开发的基础，并且只能通过正式的变更控制程序进行更改。\n\
    - A baseline is a milestone in the development of software that is marked by the\
    \ delivery of one or more **software configuration items (SCIs)** and the approval\
    \ of these SCIs that is obtained through a formal technical review\n\n基线是软件开发中的一个里程碑，以交付一个或多个\
    \ **软件配置项（SCIs）** 并通过正式技术评审获得这些 SCIs 的批准为标志\n\n## Baselines…\n\n基线…\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_429_0.png)\n\
    \n## Software Configuration Objects\n\n软件配置对象\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_430_0.png)\n\
    \n## SCM Repository\n\nSCM 仓库\n\n- The **SCM repository** [知识库] is the set of\
    \ **mechanisms** and **data structures** that allow a software team to manage\
    \ change in an effective manner\n- **SCM 仓库** [知识库] 是允许软件团队以有效方式管理变更的 **机制** 和\
    \ **数据结构** 的集合\n- The repository performs or precipitates [沉淀] the following functions\
    \ [FOR89]:\n- 仓库执行或促成 [沉淀] 以下功能 [FOR89]：\n  - Data integrity\n  - 数据完整性\n  - Information\
    \ sharing\n  - 信息共享\n  - Tool integration\n  - 工具集成\n  - Data integration\n  -\
    \ 数据集成\n  - Methodology enforcement\n  - 方法论执行\n  - Document standardization\n\
    \  - 文档标准化\n\n"
