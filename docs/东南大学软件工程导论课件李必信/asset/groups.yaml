    # Project Metrics


    +   - used to minimize the development schedule by making the adjustments necessary
    to avoid delays and mitigate potential problems and risks

    +   - used to assess product quality on an ongoing basis and, when necessary,
    modify the technical approach to improve quality.

    +   - every project should measure:

    +     - **inputs**—measures of the resources (e.g., people, tools) required to
    do the work.

    +     - **outputs**—measures of the deliverables or work products created during
    the software engineering process.

    +     - **results**—measures that indicate the effectiveness of the deliverables.'
