  - '[PAGE 314]


    # 度量属性的有效性


    +   - **简单的和可计算的**. It should be relatively easy to learn how to derive the metric,
    and its computation should not demand inordinate effort or time

    +   - **在经验上和直观上有说服力**. The metric should satisfy the engineer’s intuitive notions
    about the product attribute under consideration

    +   - **一致的和客观的**. The metric should always yield results that are unambiguous.

    +   - **单位和量纲的使用是一致的**. The mathematical computation of the metric should use
    measures that do not lead to bizarre combinations of unit.

    +   - **编程语言的独立性**. Metrics should be based on the analysis model, the design
    model, or the structure of the program itself.

    +   - **高质量反馈的有效机制**. That is, the metric should provide a software engineer with
    information that can lead to a higher quality end product'
