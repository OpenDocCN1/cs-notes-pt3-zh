    # 基于统计的软件质量保证


    基于统计的质量保证反映了一种在产业界不断增长的趋势：质量的量化。对于软件而言，基于统计的质量保证包含以下步骤：


    +   1、收集和分类软件缺陷信息。

    +   2、追溯每个缺陷的形成原因。

    +   3、使用Pareto法则，将20%的原分离出来。

    +   4、一旦找出这些重要的少数原因，就 可以开始纠正引起缺陷的问题。


