    # 1.2.1 How It All Started


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_535_0.png)


    +   - The earliest **practical form** of programming was probably done by **Jacquard
    (1804, France)**. He designed a loom that performed predefined tasks through feeding
    **punched cards** (穿孔卡) into a reading contraption(装置). This new technology allowed
    carpets (地毯) and tissues (纺织品) to be manufactured with lower skills and even with
    fewer people. The little kid sitting under the loom changing rods (杆) and other
    things vanished. One single person could now handle a loom.'
  - '[PAGE 536]


    +   - First there was **Ada Lovelace**, writing a rudimentary program (1843) for
    the Analytical Machine, designed by Charles Babbage in 1827, but the machine never
    came into operation.

    +   - Then there was **George Boole** (1815-1864), a British mathematician, who
    proved the relation between mathematics and logic with his algebra of logic (BOOLEAN
    algebra or binary logic) in 1847.'
