  md: "\n## 4.2 普适性活动[Umbrella Activities]\n\n- Software project management\n- Formal\
    \ technical reviews\n- Software quality assurance\n- Software configuration management\n\
    - Work product preparation and production\n- Reusability management\n- Measurement\n\
    - Risk management\n\n## 通用框架的适用性(Adaptability)\n\n- The framework activities will\
    \ always be applied on every project ... BUT\n- The tasks (and degree of rigor)\
    \ for each activity will vary based on:\n  - the type of project\n  - characteristics\
    \ of the project\n  - common sense[常识] judgment; concurrence of the project team\n\
    \n## 5 能力成熟度模型集成(CMMI)\n\n这部分自学\n\n## CMMI简介\n\n- CMMI全称是Capability Maturity Model\
    \ Integration，即软件能力成熟度模型集成，是由美国国防部与卡内基-梅隆大学和美国国防工业协会共同开发和研制的，其目的是帮助软件企业对软件工程过程进行管理和改进，增强开发与改进能力，从而能按时地、不超预算地开发出高质量的软件。\n\
    - 其所依据的想法是：只要集中精力持续努力去建立有效的软件工程过程的基础结构，不断进行管理的实践和过程的改进，就可以克服软件开发中的困难。\n- CMMI为改进一个组织的各种过程提供了一个单一的集成化框架，新的集成模型框架消除了各个模型的不一致性，减少了模型间的重复，增加透明度和理解，建立了一个自动的、可扩展的框架。因此能够从总体上改进组织的质量和效率。CMMI主要关注点就是成本效益、明确重点、过程集中和灵活性四个方面。\n\
    \n## The CMMI\n\n- The CMMI defines each process area in terms of “specific goals”\
    \ and the “specific practices” required to achieve these goals.\n- **Specific\
    \ goals** establish the characteristics that must exist if the activities implied\
    \ by a process area are to be effective.\n- **Specific practices** refine a goal\
    \ into a set of process-related activities.\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_72_0.png)\n\
    \n## 6 过程评估\n\n评估软件过程以确认满足了成功软件工程所需的基本过程标准（BASIC PROCESS CRITERIA）要求。\n\n## Process\
    \ Assessment\n\n- The process should be assessed to ensure that it meets a set\
    \ of basic process criteria that have been shown to be essential for a successful\
    \ software engineering.\n- Many different assessment options are available:\n\
    \  - SCAMPI: Standard CMMI Assessment Method for Process Improvement\n  - CBA\
    \ IPI: CMM-Based Appraisal for Internal Process Improvement\n  - SPICE: ISO/IEC\
    \ 15504 Standard\n  - ISO 9001:2000 Standard\n\n## The Primary Goal of Any Software\
    \ Process: *High Quality*\n\nRemember:\n\nHigh quality ⇒ project timeliness [项目的时效性]\n\
    \nWhy?\n\nLess rework!\n\n## Chapter 3\nProcess Models\n\nSoftware Engineering:\
    \ A Practitioner's Approach, 6th edition\nby Roger S. Pressman\n\n## 本章要点\n\n\
    - 惯例模型\n  - 瀑布模型\n  - V模型\n  - 增量模型\n  - 演化模型\n  - UP模型\n  - 线性模型\n  - 非线性模型\n\
    \n## Prescriptive Models [惯例模型]\n\nPrescriptive process models **advocate an orderly\
    \ approach** to software engineering\n\n*That leads to a few questions …*\n\n\
    - If prescriptive process models strive for **structure and order**, are they\
    \ **inappropriate** for a software world that **thrives on change**?\n- Yet, if\
    \ we reject traditional process models (and the order they imply) and replace\
    \ them with something less structured, do we **make it impossible** to achieve\
    \ **coordination and coherence** in software work?\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_79_0.png)\n\
    \n## The Waterfall Model\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_80_0.png)\n\
    \nBradac found that the linear nature of the waterfall model leads to “blocking\
    \ states”.\n\nWhere some members must wait for other members of the team to complete\
    \ dependent tasks.\n\nEspecially, at the beginning of the project.\n\nStill, however,\
    \ the waterfall model serve as a useful process model where requirements are fixed\
    \ and work is to proceed to completion in a linear manner.\n\n## Waterfall Model\
    \ Assumptions\n\n- 1. The requirements are **knowable** in advance of implementation.\n\
    - 2. The requirements have **no unresolved, high-risk implications**.\n  - e.g.,\
    \ risks due to COTS choices, cost, schedule, performance, safety, security, user\
    \ interfaces, organizational impacts.\n- 3. The nature of the requirements will\
    \ **not change very much**.\n  - During development; during evolution.\n\n## Waterfall\
    \ Model Assumptions...\n\n- 4. The requirements are **compatible with** all the\
    \ key system stakeholders’ expectations.\n  - e.g., users, customer, developers,\
    \ maintainers, investors.\n- 5. The **right architecture** for implementing the\
    \ requirements is well understood.\n- 6. There is **enough calendar time** to\
    \ proceed sequentially.\n"
