    \n## Cohesion\n- The “single-mindedness” of a module\n- cohesion implies that\
    \ a single component or class encapsulates only attributes and operations that\
    \ are closely related to one another and to the class or component itself.\n-\
    \ Examples of cohesion\n  - Functional\n  - Layer\n  - Communicational\n\n## Functional\
    \ Cohesion\n- Typically applies to operations. Occurs when a module performs one\
    \ and only one computation and then returns a result.\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_285_0.png)\n\
    \n## Layer Cohesion\n- Applies to packages, components, and classes. Occurs when\
    \ a higher layer can access a lower layer, but lower layers do not access higher\
    \ layers.\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_286_0.png)\n\n## Coupling\n\
    - A qualitative measure of the degree to which classes or components are connected\
    \ to each other.\n- **Avoid**\n  - Content coupling\n- **Use caution**\n  - Common\
    \ coupling\n- **Be aware**\n  - Routine call coupling\n  - Type use coupling\n\
    \  - Inclusion or import coupling\n\n## Content Coupling\n- Occurs when one component\
    \ “surreptitiously modifies data that is internal to another component”\n- Violates\
    \ information hiding\n- What’s wrong here? →\n\n```\npublic class StudentRecord\
    \ {\n    private String name;\n    private int[] quizScores;\n\n    public String\
    \ getName() {\n        return name;\n    }\n    public int getQuizScore(int n)\
    \ {\n        return quizScores[n];\n    }\n    public int[] getAllQuizScores()\
    \ {\n        return quizScores;\n    }\n    ....\n```\n\n## Common Coupling\n\
    - Occurs when a number of components all make use of a global variable.\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_290_0.png)\n\
    \n## Routine Coupling\n- Certain types of coupling occur routinely in object-oriented\
    \ programming.\n\n```\npackage myPackage;\nimport java.util.Collection.*;\n\n\
    public class MyClass {\n    private Stack s;\n    public void doSomething() {\n\
    \        s.push(x);\n        // do something\n    }\n    ...\n```\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_291_0.png)\n\
    \n## Component-Level Design\n- 1. Identify design classes in problem domain\n\
    - 2. Identify infrastructure design classes\n- 3. Elaborate design classes\n-\
    \ 4. Describe persistent data sources\n- 5. Elaborate behavioral representations\n\
    - 6. Elaborate deployment diagrams\n- 7. Refactor design and consider alternatives\n\
    \n## Steps 1 & 2 – Identify Classes\n- 1. Most classes from the problem domain\
    \ are analysis classes created as part of the analysis model\n- 2. The infrastructure\
    \ design classes are introduced as components during architectural design\n\n\
    ## Step 3 – Class Elaboration\n- a) Specify message details when classes or components\
    \ collaborate\n- b) Identify appropriate interfaces for each component\n- c) Elaborate\
