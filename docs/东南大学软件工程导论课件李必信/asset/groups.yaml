    \ can we do about it?\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_386_0.png)\n\
    \n## Reactive Risk Management\n\n- project team reacts to risks when they occur\n\
    - mitigation—plan for additional resources in anticipation of fire fighting\n\
    - fix on failure—resource are found and applied when the risk strikes\n- crisis\
    \ management—failure does not respond to applied resources and project is in jeopardy[危险]\n\
    \n## Proactive Risk Management\n\n- formal risk analysis is performed\n- organization\
    \ corrects the root causes of risk\n  1. TQM concepts and statistical SQA\n  2.\
    \ examining risk sources that lie beyond the bounds of the software\n  3. developing\
    \ the skill to manage change\n\n## Risk Management Paradigm\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_389_0.png)\n\
    \n## Risk Identification\n\n- **Product size**—risks associated with the overall\
    \ size of the software to be built or modified.\n- **Business impact**—risks associated\
    \ with constraints imposed by management or the marketplace.\n- **Customer characteristics**—risks\
    \ associated with the sophistication of the customer and the developer's ability\
    \ to communicate with the customer in a timely manner.\n- **Process definition**—risks\
    \ associated with the degree to which the software process has been defined and\
    \ is followed by the development organization.\n- **Development environment**—risks\
    \ associated with the availability and quality of the tools to be used to build\
    \ the product.\n- **Technology to be built**—risks associated with the complexity\
    \ of the system to be built and the \"newness\" of the technology that is packaged\
    \ by the system.\n- **Staff size and experience**—risks associated with the overall\
    \ technical and project experience of the software engineers who will do the work.\n\
    \n## Assessing Project Risk\n\n- Have top software and customer managers formally\
    \ committed to support the project?\n- Are end-users enthusiastically committed\
    \ to the project and the system/product to be built?\n- Are requirements fully\
    \ understood by the software engineering team and their customers?\n- Have customers\
    \ been involved fully in the definition of requirements?\n- Do end-users have\
    \ realistic expectations?\n\n## Assessing Project Risk···\n\n- Is project scope\
    \ stable?\n- Does the software engineering team have the right mix of skills?\n\
    - Are project requirements stable?\n- Does the project team have experience with\
    \ the technology to be implemented?\n- Is the number of people on the project\
    \ team adequate to do the job?\n- Do all customer/user constituencies agree on\
    \ the importance of the project and on the requirements for the system/product\
    \ to be built?\n\n## Risk Components\n\n- performance risk—the degree of uncertainty\
    \ that the product will meet its requirements and be fit for its intended use.\n\
    - cost risk—the degree of uncertainty that the project budget will be maintained.\n\
    - support risk—the degree of uncertainty that the resultant software will be easy\
    \ to correct, adapt, and enhance.\n- schedule risk—the degree of uncertainty that\
    \ the project schedule will be maintained and that the product will be delivered\
    \ on time.\n\n## Risk Mitigation, Monitoring, and Management\n\n- mitigation—how\
    \ can we avoid the risk?\n- monitoring—what factors can we track that will enable\
    \ us to determine if the risk is becoming more or less likely?\n- management—what\
    \ contingency plans do we have if the risk becomes a reality?\n\n## Risk Due to\
    \ Product Size\n\n### Attributes that affect risk:\n\n- estimated size of the\
    \ product in LOC or FP?\n- estimated size of product in number of programs, files,\
    \ transactions?\n- percentage deviation in size of product from average for previous\
    \ products?\n- size of database created or used by the product?\n- number of users\
    \ of the product?\n- number of projected changes to the requirements for the product?\
    \ before delivery? after delivery?\n- amount of reused software?\n"
  mdcn: "\n\n## 第25章\n风险管理\n\n**软件工程：实践者的研究方法，第6版**\n*罗杰·S. 普莱斯曼 著*\n\n## 项目风险\n\n\
    - 什么可能出错？\n- 可能性有多大？\n- 损失会是什么？\n- 我们能对此采取什么措施？\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_386_0.png)\n\
    \n## 被动风险管理\n\n- 项目团队在风险发生时对其作出反应\n- 缓解——预期到问题而预先规划额外资源\n- 故障修复——当风险来袭时寻找并应用资源\n\
    - 危机管理——故障对投入的资源没有响应，项目处于危险之中\n\n## 主动风险管理\n\n- 执行正式的风险分析\n- 组织纠正风险的根源\n  1. TQM\
    \ 概念和统计 SQA\n  2. 检查超出软件范围之外的风险源\n  3. 培养管理变更的技能\n\n## 风险管理范式\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_389_0.png)\n\
    \n## 风险识别\n\n- **产品规模**——与待构建或修改的软件整体规模相关的风险。\n- **业务影响**——与管理层或市场施加的约束相关的风险。\n\
    - **客户特征**——与客户的成熟度以及开发人员及时与客户沟通的能力相关的风险。\n- **过程定义**——与软件过程被定义的程度以及开发组织遵循该过程的程度相关的风险。\n\
    - **开发环境**——与用于构建产品的工具的可用性和质量相关的风险。\n- **待构建的技术**——与待构建系统的复杂性以及系统所封装技术的“新颖性”相关的风险。\n\
    - **人员规模与经验**——与将要从事工作的软件工程师的整体技术和项目经验相关的风险。\n\n## 评估项目风险\n\n- 高层软件和客户管理人员是否已正式承诺支持该项目？\n\
    - 最终用户是否热情地致力于该项目以及待构建的系统/产品？\n- 软件工程团队及其客户是否完全理解需求？\n- 客户是否充分参与了需求的定义？\n- 最终用户是否抱有现实的期望？\n\
    \n## 评估项目风险···\n\n- 项目范围是否稳定？\n- 软件工程团队是否具备合理的技能组合？\n- 项目需求是否稳定？\n- 项目团队是否具备实施该技术的经验？\n\
    - 项目团队的人数是否足以完成工作？\n- 所有客户/用户群体是否就项目的重要性以及待构建系统/产品的需求达成一致？\n\n## 风险组成\n\n- 性能风险——产品能否满足其需求并适合其预期用途的不确定程度。\n\
    - 成本风险——项目预算能否保持的不确定程度。\n- 支持风险——最终软件是否易于修正、适配和增强的不确定程度。\n- 进度风险——项目进度能否维持以及产品能否按时交付的不确定程度。\n\
    \n## 风险缓解、监控与管理\n\n- 缓解——我们如何避免风险？\n- 监控——我们可以跟踪哪些因素来确定风险的可能性是增大还是减小？\n- 管理——如果风险变为现实，我们有什么应急计划？\n\
    \n## 产品规模带来的风险\n\n### 影响风险的属性：\n\n- 以 LOC 或 FP 估算的产品规模？\n- 以程序、文件、事务数量估算的产品规模？\n\
    - 产品规模与以往产品平均值的偏差百分比？\n- 产品创建或使用的数据库的大小？\n- 产品的用户数量？\n- 对产品需求的预期变更数量？交付前？交付后？\n\
    - 复用软件的数量？\n\n"
