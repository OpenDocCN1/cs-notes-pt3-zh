    - **设定度量目标**：在开始收集数据之前，应确定测量的目标；\n- **定义要明确**：每个技术度量都应以明确无误的方式定义；\n- **有效理论支持**：度量应基于对应用领域有效的理论推导而来（例如，设计度量应借鉴[利用]基本的设计概念和原理，并试图表明存在某种被认为理想的属性）；\n\
    - **度量指标的选择要是最合适的**：度量应针对特定的产品和过程进行定制，以最佳地适应它们。\n\n### 典型度量过程\n\n- **Formulation【公式化】**.\
