    \ is *mean-time-between-failure* (MTBF), where\n+     \n+     **MTBF = MTTF +\
    \ MTTR**\n+   \n+   - The acronyms MTTF and MTTR are *mean-time-to-failure* and\
    \ *mean-time-to-repair*, respectively.\n+   \n+   - *Software availability* is\
    \ the probability that a program is operating according to requirements at a given\
    \ point in time and is defined as\n+     \n+     **Availability = [MTTF/(MTTF\
    \ + MTTR)] x 100%**"
