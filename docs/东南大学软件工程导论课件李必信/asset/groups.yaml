- raw:
  - '[PAGE 559]


    # Standardization


    +   - A common question is: Is there a standard version of any higher level programming
    language? The answer is NO

    +   - However, an important problem with higher programming languages is that
    they are seldom portable. This means that a program written in FORTRAN or BASIC
    for a specific computer will not always run on another type of computer from a
    different brand. Even within a certain brand this could be a problem.

    +   - The cause of all this is because most manufacturers are creating their own
    standards in programming languages.'
  - '[PAGE 560]


    # 2. 软件开发的基本内容


    +   - 2.0 基本术语回顾

    +   - 2.1 认识软件、软件开发、软件工程

    +   - 2.2 软件开发的文档（规约、代码）

    +   - 2.3 软件开发的语言（程序设计语言）

    +   - 2.4 软件开发的基本方法

    +   - 2.5 软件开发的生命周期模型（过程模型）

    +   - 2.6 软件开发的支撑环境和工具

    +   - 2.7 软件开发的其他技术'
  - '[PAGE 561]


    # 2.0 基本术语回顾


    +   - 计算：解决问题的手段

    +   - 算法：解决问题的步骤

    +   - 指令：表示算法的符号

    +   - 程序：程序＝算法＋数据结构

    +   - 软件：软件＝程序＋文档

    +   - 软件开发：构造软件的过程

    +   - 软件工程：用工程方法构造软件'
  - '[PAGE 562]


    # 2.1 认识软件、软件开发、软件工程


    +   - **A program** is a sequence of instructions that can be executed by a computer
    (CPU) that performs a certain task intentioned by the programmer.

    +   - **Software** is the set of directions that enables computer hardware to
    perform useful work.


    +   - 计算观—计算的实质就是寻找一种可机械执行的算法。例如，著名的计算模型：图灵机（被公认为现代计算机的祖先）。

    +   - 组成观—软件可以用两个简单的算式来概括：

    +     - （1）软件=程序+文档

    +     - （2）程序=算法+数据结构'
  - '[PAGE 563]


    +   - 工具观—软件是一种代替、强化和延伸人类思维能力的工具。

    +   - 逻辑观—计算机的思考方式是形式逻辑、形式逻辑通过建立一种可机械实现的符号演算机制，模拟了人类思维中的一类精确推理过程（如形式化语言、有限状态自动机理论）。

    +   - 模型观—从模型论的角度看，整个软件系统是客户业务实现的一个模型，特别是软件的研制过程就是一个建模和模型间的演绎过程。

    +   - 工程观—软件工程原理

    +   - 对象观—OOA&D理论认为，现实世界是由对象构成的，对象是具有特殊属性和行为的实体，对象间具有共性、层次性、继承性和关联性，反应了客观世界从普遍到一般、从个性到共性及相互制约的运动规律。从这个角度，软件的开发可视为“类”的抽象及其关联的建模过程，软件的运行是对象的实例化及其状态的演变过程。'
  - '[PAGE 564]


    +   - 生存期—根据ISO/IEC12207软件生命周期标准，一个通用的软件生命周期模型：（1）定义阶段（计划、需求分析）；（2）开发阶段（概要设计、详细设计、编码、集成测试、试运行和验收）；（3）运行维护

    +   - 质量观—一种三维软件质量衡量：（1）软件运行（正确性、可用性、强壮性、安全性、性能）；（2）软件维护（可理解性、可扩展性、易维护性、灵活性）；（3）软件移植（可移植性、可复用性、互操作性）。

    +   - 人机工程观—好的系统应该易于学习、理解和掌握；界面应该简洁。

    +   - 集成观—各种软件、硬件资源的集成

    +   - 结构观—


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_564_0.png)'
  - '[PAGE 565]


    +   - **The software essence**

    +     - Complexity

    +     - Conformity[conformance to]

    +     - Changeability[software evolution]

    +     - Invisibility

    +   - **The software accidents**

    +     - Stakeholders

    +     - Process

    +     - Modeling language and tools'
  - '[PAGE 566]


    # ▪ Software Life Cycle


    +   ▪ **Coarse granularity**

    +     - 1 Analysis

    +     - 2 Design

    +     - 3 Implementation

    +     - 4 Maintenance


    +   ▪ **Refined granularity**

    +     - 1 Application Requirements determination

    +     - 2 Software Requirements specification

    +     - 3 Architectural design

    +     - 4 Detailed design

    +     - 5 Implementation

    +     - 6 Integration

    +     - 7 Maintenance'
  - '[PAGE 567]


