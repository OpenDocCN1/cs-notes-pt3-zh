  mdcn: "\n\n## 选择类——标准\n\n- 保留信息\n- 所需服务\n- 多重属性\n- 公共属性\n- 公共操作\n- 基本需求\n\n## 类图\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_209_0.png)\n\n## CRC建模\n\n| 类：FloorPlan\
    \ |\n|---|---|\n| 描述： | |\n| 职责： | 协作者： |\n| 定义平面图的名称/类型 | |\n| 管理平面图的定位 | |\n\
    | 缩放平面图以供显示 | |\n| 缩放平面图以供显示 | |\n| 包含墙壁、门窗 | Wall |\n| 显示摄像机的位置 | Camera |\n\
    |  | |\n|  | |\n\n## 关联与依赖\n\n- 两个分析类通常以某种方式相互关联\n  - 在UML中，这些关系称为*关联*\n  - 关联可以通过指示*多重性*来细化\n\
    \  - 在许多情况下，两个分析类之间存在*客户端-服务器关系*。在这种情况下，客户端类以某种方式依赖于服务器类，从而建立了*依赖关系*\n\n## 多重性\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_213_0.png)\n\n## 依赖\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_214_0.png)\n\
    \n## 分析包\n\n- 分析模型的各种元素（例如，用例、分析类）以一种将它们分组打包的方式进行归类。\n- 每个包中分析类名称前的**加号（+）**表示这些类具有**公共可见性**，因此可被其他包访问。\n\
    - 其他符号可以位于包内元素之前。**减号**表示元素对所有其他包隐藏，而**#符号**表示元素仅对给定包所包含的包可见。\n\n## 分析包\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_216_0.png)\n\
    \n## 8.8 行为建模\n\n- 行为模型表明**软件将如何响应外部事件或刺激**。为了创建该模型，分析人员必须执行以下步骤：\n  - 评估所有用例，以**充分理解系统内的交互序列**。\n\
    \  - 识别**驱动交互序列**的事件，并**理解这些事件如何与特定对象相关**。\n  - 为每个用例创建**序列图**。\n  - 为系统构建**状态图**。\n\
    \  - 审查行为模型**以验证准确性和一致性**。\n\n## 状态表示\n\n- 在行为建模的上下文中，必须考虑两种不同的状态表征：\n  - 系统执行其功能时每个类的状态；以及\n\
    \  - 从外部观察系统执行其功能时系统的状态\n- 类的状态同时具有被动和主动特征[CHA93]。\n  - 被动状态[纯态]只是对象所有属性的当前状态。\n\
    \  - 对象的主动状态[活跃态]表示对象在进行持续变换或处理时的当前状态。\n\n## 序列图\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_221_0.png)\n\
    \n图8.27 SafeHome安全功能的序列图（部分）\n\n## 编写软件规格说明\n\n> 在有人把它写下来之前，每个人都确切地知道该做什么！\n\n\
    ## 第9章\n设计工程\n\n软件工程：实践者的研究方法（第6版）\n作者：Roger S. Pressman\n\n## 1 概述\n\n- 与分析模型不同：设计模型提供了软件的**数据结构（data\
    \ structure）**、**体系结构（architecture）**、**接口（interface）**和**构件（component）**的细节，而这些都是实现系统所必须的。\n\
