  mdcn: "\n## 设计模式\n\n### 设计模式模板\n\n- **模式名称** — 用简短但富有表现力的名称描述模式的本质\n- **意图** — 描述模式及其作用\n\
    - **别名** — 列出模式的所有同义词\n- **动机** — 提供一个问题的示例\n- **适用性** — 指出模式适用的特定设计情境\n- **结构**\
    \ — 描述实现模式所需的类\n- **参与者** — 描述实现模式所需类的职责\n- **协作** — 描述参与者如何协作以履行其职责\n- **结果**\
    \ — 描述影响模式的“设计力量”以及实现模式时必须考虑的潜在权衡\n- **相关模式** — 交叉引用相关的设计模式\n\n## 3.4 模块化设计\n\n\
    *更易于构建，更易于修改，更易于修复……*\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_237_0.png)\n\
    \n### 模块化：权衡\n\n对于特定的软件设计，多少模块才是“合适”的数量？\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_238_0.png)\n\
    \n## 3.5 信息隐藏\n\n- 模块\n- 受控接口\n- 客户端\n- “秘密”——一个特定的设计决策\n  - 算法\n  - 数据结构\n  -\
    \ 外部接口的细节\n  - 资源分配策略\n\n### 为什么信息隐藏？\n\n- 降低“副作用”的可能性\n- 限制局部设计决策的全局影响\n- 强调通过受控接口进行通信\n\
    - 不鼓励使用全局数据\n- 导致封装——高质量设计的一个属性\n- 带来更高质量的软件\n\n## 3.6 逐步求精\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_241_0.png)\n\
    \n## 3.7 功能独立\n\n内聚性——模块执行且仅执行一个功能的程度。\n\n耦合性——模块与系统中其他模块“连接”的程度。\n\n## 3.8 重构\n\
    \nFowler [FOW99] 以如下方式定义重构：\n\n> “重构是这样一种过程：以一种不改变代码[设计]外部行为、同时改进其内部结构的方式更改软件系统。”\n\
    \n当软件被重构时，现有设计会被检查以下方面：\n\n- 冗余\n- 未使用的设计元素\n- 低效或不必要的算法\n- 构造不良或不合适的数据结构，或任何其他可以通过修正以获得更好设计的设计缺陷。\n\
    \n## 3.9 设计类\n\n- 用户界面类——定义人机交互（HCI）所需的抽象。\n- 业务领域类——分析类的细化。\n- 过程类——管理业务领域类的较低层业务抽象。\n\
    - 持久类——在软件执行之后仍然存在的数据存储（数据库）。\n- 系统类——使系统能够在计算环境内以及与外部世界进行操作和通信的管理和控制功能。\n\n###\
    \ 良构设计类\n\n- **完整且充分**——类应该是合理属性和方法的完整且充分的封装。\n- **原始性[原始性]**——每个方法应专注于一件事。\n\
    - **高内聚性**——类应专注于一种类型的事物。\n- **低耦合性**——协作应保持在可接受的最低限度。\n\n## 4 设计模型\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_246_0.png)\n\
    \n过程维度表示设计模型的演化，设计工作作为软件过程的一部分被执行。\n\n抽象维度表示过程的详细级别，分析模型的每个元素转化为一个等价的设计，然后迭代精化。\n\
    \n- 过程维度\n- 抽象维度\n- 高\n- 低\n- 分析模型\n- 设计模型\n- 架构元素\n- 接口元素\n- 组件级元素\n- 部署级元素\n\
    \n### 设计模型元素\n\n- 数据元素\n  - 架构层 → 数据库和文件\n  - 组件层 → 数据结构\n- 架构元素\n  - 架构模型来源于：\n\
    \    1. 应用领域[应用领域信息]\n    2. 分析模型[特定分析模型元素]\n    3. 可用风格和模式[体系结构风格和模式]\n- 接口元素\n\
    \  - 接口设计元素有三个部分：\n    1. 用户界面（UI）\n    2. 与外部系统的接口\n    3. 与应用程序内部组件的接口\n- 组件元素\n\
    - 部署元素\n\n"
