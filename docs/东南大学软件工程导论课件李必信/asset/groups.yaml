  - "[PAGE 187]\n\n# Use Case UC1: Process Sale\n\n**Primary Actor:** Cashier\n\n\
    **Stakeholders and Interests:**\n- Cashier: Wants accurate, fast entry, and no\
    \ payment errors, as cash drawer shortages are deducted from his/her salary.\n\
    - Salesperson: Wants sales commissions updated.\n- Customer: Wants purchase and\
    \ fast service with minimal effort. Wants proof of purchase to support returns.\n\
    - Company: Wants to accurately record transactions and satisfy customer interests.\
    \ Wants to ensure that Payment Authorization Service payment receivables are recorded.\
    \ Wants some fault tolerance to allow sales capture even if server components\
    \ (e.g., remote credit validation) are unavailable. Wants automatic and fast update\
    \ of accounting and inventory.\n- Government Tax Agencies: Want to collect tax\
    \ from every sale. May be multiple agencies, such as national, state, and county.\n\
    - Payment Authorization Service: Wants to receive digital authorization requests\
    \ in the correct format and protocol. Wants to accurately account for their payables\
    \ to the store.\n\n**Preconditions:** Cashier is identified and authenticated.\n\
    \n**Success Guarantee (Postconditions):** Sale is saved. Tax is correctly calculated.\
    \ Accounting and Inventory are updated. Commissions recorded. Receipt is generated.\
    \ Payment authorizations are recorded.\n\n# Main Success Scenario (or Basic Flow):\n\
    \n+   1. Customer arrives at POS checkout with goods and/or services to purchase.\n\
    +   2. Cashier starts a new sale.\n+   3. Cashier enters item identifier.\n+ \
    \  4. System records sale item and presents item description, price, and running\
    \ total. Price calculated from a set of price rules.\n+      *Cashier repeats\
    \ steps 3–4 until initiated done.*\n+   5. System presents total with taxes calculated.\n\
    +   6. Cashier tells Customer the total, and asks for payment.\n+   7. Customer\
    \ pays and System handles payment.\n+   8. System logs completed sale and sends\
    \ sale and payment information to the external Accounting system (for accounting\
    \ and commissions) and Inventory system (to update inventory).\n+   9. System\
    \ presents receipt.\n+   10. Customer leaves with receipt and goods (if any).\n\
    \n# Extensions (or Alternative Flows):\n\n+   *a. At any time, System fails:*\n\
    +      To support recovery and correct accounting, ensure all transaction sensitive\
    \ state and events can be recovered from any step of the scenario.\n+      1.\
    \ Cashier restarts System, logs in, and requests recovery of prior state.\n+ \
    \     2. System reconstructs prior state.\n+         2a. System detects anomalies\
    \ preventing recovery.\n+            1. System signals error to the Cashier, records\
    \ the error, and enters a clean state.\n+            2. Cashier starts a new sale.\n\
    +   \n+   *3a. Invalid identifier:*\n+      1. System signals error and rejects\
    \ entry.\n+   \n+   *3b. There are multiple of same item category and tracking\
    \ unique item identity not important (e.g., 5 packages of veggie-burgers):*\n\
    +      1. Cashier can enter item category identifier and the quantity.\n+   \n\
    +   *3-6a. Customer asks Cashier to remove an item from the purchase:*\n+    \
    \  1. Cashier enters item identifier for removal from sale.\n+      2. System\
    \ displays updated running total.\n+   \n+   *3-6b. Customer tells Cashier to\
    \ cancel sale:*\n+      1. Cashier cancels sale on System.\n+   \n+   *3-6c. Cashier\
    \ suspends the sale:*\n+      1. System records sale so that it is available for\
    \ retrieval on any POS terminal.\n+   \n+   *4a. The system generated item price\
    \ is not as wanted (e.g., Customer complained about something and is offered a\
    \ lower price):*\n+      1. Cashier enters override price.\n+      2. System presents\
    \ new price.\n+   \n+   *5a. System detects failure to communicate with external\
    \ tax calculation system service:*\n+      1. System restarts the service on the\
    \ POS node, and continues.\n+         1a. System detects that the service does\
    \ not restart.\n+            1. System signals error.\n+            2. Cashier\
    \ may manually calculate and enter the tax, or cancel the sale.\n+   \n+   *5b.\
    \ Customer says they are eligible for a discount (e.g., employee, preferred customer):*\n\
    +      1. Cashier signals discount request.\n+      2. Cashier enters Customer\
    \ identification.\n+      3. System presents discount total, based on discount\
    \ rules.\n+   \n+   *5c. Customer says they have credit in their account, to apply\
    \ to the sale:*\n+      1. Cashier signals credit request.\n+      2. Cashier\
    \ enters Customer identification.\n+      3. Systems applies credit up to price=0,\
    \ and reduces remaining credit.\n+   \n+   *6a. Customer says they intended to\
    \ pay by cash but don't have enough cash:*\n+      1a. Customer uses an alternate\
    \ payment method.\n+      1b. Customer tells Cashier to cancel sale. Cashier cancels\
    \ sale on System."
