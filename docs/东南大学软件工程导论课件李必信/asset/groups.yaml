  mdcn: "\n\n## 度量属性的有效性\n\n- **简单的和可计算的**：学习推导该度量应当相对容易，并且其计算不应耗费过多的精力或时间。\n- **在经验上和直观上有说服力**：该度量应满足工程师对所考察产品属性的直觉认知。\n\
    - **一致的和客观的**：该度量应始终产生无歧义的结果。\n- **单位和量纲的使用是一致的**：度量的数学计算应使用不会导致奇怪单位组合的度量单位。\n\
    - **编程语言的独立性**：度量应基于分析模型、设计模型或程序本身的结构。\n- **高质量反馈的有效机制**：也就是说，该度量应向软件工程师提供能够导向更高质量最终产品的信息。\n\
    \n## 软件产品度量全景\n\n- 分析度量\n- 设计度量\n- 代码度量\n- 测试度量\n\n## 15.3 分析度量\n\n- **基于功能的度量**：使用功能点作为规范化因子或作为规格说明“大小”的度量。\n\
    - **规格说明度量**：通过度量若干特征（如无歧义性、完整性、正确性、可理解性等）的数量，作为分析模型和需求规格说明质量的指示。\n\n## 基于功能的度量\n\
    \n- **功能点度量（FP）**：最早由 Albrecht [ALB79] 提出，可以被有效地用作度量系统所交付功能的手段。\n- **功能点** 是基于软件信息域的可计数（直接）度量和软件复杂度评估的经验关系推导得出的。\n\
    - **信息域值** 按以下方式定义：\n  - 外部输入数（EIs）\n  - 外部输出数（EOs）\n  - 外部查询数（EQs）\n  - 内部逻辑文件数（ILFs）\n\
    \  - 外部接口文件数（EIFs）\n\n## 15.4 设计度量\n\n- 体系结构设计度量\n- OO 设计度量\n- 面向类的度量\n- 构件级设计度量\n\
    - 面向操作度量\n- 用户界面设计度量\n\n## 体系结构设计度量\n\n- 体系结构设计度量\n  - 结构复杂度 = g(扇出)\n  - 数据复杂度\
    \ = f(输入和输出变量, 扇出)\n  - 系统复杂度 = h(结构复杂度与数据复杂度)\n- HK 度量：体系结构复杂度是扇入和扇出的函数\n- 形态度量[形态度量学]：是模块数量与模块间接口数量的函数\n\
    \n## 面向对象设计的度量（一）\n\n- Whitmire [WHI97] 描述了面向对象设计的九个不同且可度量的特征：\n  - **规模**\n \
    \   - 规模从四个视角定义：数量、体积、长度和功能性\n  - **复杂度**\n    - 面向对象设计中的类如何相互关联\n  - **耦合**\n\
    \    - 面向对象设计各元素之间的物理连接\n  - **充分性**\n    - “从当前应用的角度来看，抽象拥有其所需特征的程度，或设计构件在其抽象中拥有特征的程度。”\n\
    \  - **完备性**\n    - 对抽象或设计构件可复用程度的一种间接暗示\n\n## 面向对象设计的度量（二）\n\n- **内聚性**\n  -\
    \ 所有操作协同工作以实现单一且明确定义目标的程度\n- **原始性**\n  - 同时应用于操作和类，指操作是原子的程度\n- **相似性**\n  -\
    \ 两个或多个类在结构、功能、行为或目的上的相似程度\n- **易变性**\n  - 度量发生变更的可能性\n\n## 面向类的度量（1）\n\n- 每个类的加权方法数（WMC）\n\
    - 继承树的深度（DIT）\n- 子类数量（NOC）\n- 对象类之间的耦合（CBO）\n- 类的响应集（RFC）\n- 方法内聚缺乏度（LCOM）\n\n\
    由 Chidamber 和 Kemerer 提出。\n\n"
