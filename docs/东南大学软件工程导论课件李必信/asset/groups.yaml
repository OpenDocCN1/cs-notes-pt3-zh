    - 客户是否理解软件工程过程？\n\n## 因过程成熟度而产生的风险\n\n必须回答的问题：\n- 你是否建立了统一的过程框架？\n- 项目团队是否遵循？\n\
    - 你是否得到软件工程的管理支持\n- 你是否对 SQA 采取主动的方法？\n- 你是否进行正式的技术评审？\n- 是否使用 CASE 工具进行分析和设计以及测试？\n\
