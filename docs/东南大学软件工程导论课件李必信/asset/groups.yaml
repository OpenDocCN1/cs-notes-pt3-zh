  mdcn: "\n\n## 领域分析\n\n软件领域分析是对特定应用领域中的公共需求进行识别、分析和规格说明，通常是为了在该应用领域的多个项目中复用……\n\n\
    [面向对象的领域分析是] 以公共对象、类、组件和框架的形式，对特定应用领域内公共的、可复用的能力进行识别、分析和规格说明……\n\nDonald Firesmith\n\
    \n## 领域分析\n\n- 定义要研究的领域。\n- 收集该领域中应用程序的**代表性样本**。\n- 分析样本中的每个应用程序。\n- 为对象开发分析模型。\n\
    \n## 8.2 数据建模\n\n- 独立于处理过程来考察数据对象\n- 将注意力集中在数据领域\n- 在客户的抽象层次上创建模型\n- 表示数据对象之间如何相互关联\n\
    \n## 什么是数据对象？\n\n*对象* —— 由一组属性（数据项）描述，并将在软件（系统）中被操纵的事物\n\n- 对象的每个实例（例如一本书）都可以被唯一标识（例如\
    \ ISBN #）\n- 每个实例都在系统中扮演必要的角色，即，如果没有对对象实例的访问，系统将无法运行\n- 每个实例都由属性描述，而属性本身也是数据项\n\
    \n## 典型对象\n\n- *外部实体*（打印机、用户、传感器）\n- *事物*（例如报表、显示器、信号）\n- *事件*（例如中断、报警）\n- *角色*（例如经理、工程师、销售人员）\n\
    - *组织单元*（例如部门、团队）\n- *地点*（例如生产现场）\n- *结构*（例如员工记录）\n\n## 数据对象与属性\n\n数据对象包含一组属性，这些属性充当对象的方面、质量、特征或描述符\n\
    \n| 对象：汽车 |\n| 属性： |\n| 品牌 |\n| 型号 |\n| 车身类型 |\n| 价格 |\n| 选装代码 |\n\n## 什么是关系？\n\
    \n*关系* —— 表示“连接性”；是系统必须“记住”的一个“事实”\n\n- 一个关系可以存在多个实例\n- 对象可以通过多种不同的方式相互关联\n\n\
    ## 类\n\n- 面向对象思维始于类的定义，类通常被定义为：\n  - 模板\n  - 广义描述\n  - “蓝图”……描述一组相似项的集合\n- 元类（也称为超类）建立类的层次结构\n\
    - 一旦定义了某个项的类，就可以识别该类的特定实例\n\n## 构建类\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_180_0.png)\n\
    \n## 什么是类？\n\n事件\n事物\n外部实体\n角色\n组织单元\n地点\n结构\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_181_0.png)\n\
    \n## 封装/隐藏\n\n对象既封装了**数据**，也封装了操作数据所需的**逻辑过程**\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_182_0.png)\n\
    \n## 类层次结构\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_183_0.png)\n\n## 方法\n（又称操作、服务）\n\
    \n一种可执行过程，封装在类中，旨在对作为类的一部分定义的一个或多个数据属性进行操作。\n方法通过消息传递来调用。\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_184_0.png)\n\
    \n## 8.4 分析模型\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_185_0.png)\n\n分析模型的要素\n\
    \n## 用例 UC1：处理销售\n\n**主要参与者：** 收银员\n\n**利益相关者与利益：**\n- 收银员：希望准确、快速地录入，且没有付款错误，因为现金抽屉的短款会从其工资中扣除。\n\
    - 销售人员：希望销售佣金得到更新。\n- 客户：希望以最少的努力完成购买和获得快速服务。希望有购买凭证以支持退货。\n- 公司：希望准确记录交易并满足客户利益。希望确保支付授权服务的应收款项被记录。希望具有一定的容错能力，以便即使服务器组件（例如远程信用验证）不可用，也能进行销售记录。希望自动且快速地更新会计和库存。\n\
    - 政府税务机构：希望对每笔销售征税。可能有多个机构，例如国家级、州级和县级。\n- 支付授权服务：希望以正确的格式和协议接收数字授权请求。希望准确核算应付给商店的款项。\n\
    \n**前置条件：** 收银员已通过身份识别和认证。\n\n**成功保证（后置条件）：** 销售已保存。税款已正确计算。会计和库存已更新。佣金已记录。已生成收据。支付授权已记录。\n\
    \n# 主成功场景（或基本流程）：\n\n- 1. 客户带着要购买的商品和/或服务到达 POS 结账处。\n- 2. 收银员开始一笔新的销售。\n- 3.\
    \ 收银员输入商品标识符。\n- 4. 系统记录销售商品，并显示商品描述、价格和累计总额。价格根据一组定价规则计算。\n  *收银员重复步骤 3–4，直到所有商品录入完成。*\n\
    - 5. 系统显示包含已计算税款的总额。\n- 6. 收银员告诉客户总额，并请求付款。\n- 7. 客户付款，系统处理付款。\n- 8. 系统记录已完成的销售，并将销售和付款信息发送到外部会计系统（用于会计和佣金）和库存系统（用于更新库存）。\n\
    - 9. 系统出示收据。\n- 10. 客户带着收据和商品（如有）离开。\n\n# 扩展（或备选流程）：\n\n- *a. 任何时候，系统发生故障：*\n\
    \  为支持恢复和正确核算，确保可以从场景的任何步骤恢复所有交易敏感状态和事件。\n  1. 收银员重启系统，登录，并请求恢复先前状态。\n  2. 系统重建先前状态。\n\
    \     2a. 系统检测到阻止恢复的异常。\n        1. 系统向收银员发出错误信号，记录错误，并进入干净状态。\n        2. 收银员开始一笔新的销售。\n\
    \  \n- *3a. 无效标识符：*\n  1. 系统发出错误信号并拒绝录入。\n  \n- *3b. 同一商品类别有多个，且跟踪唯一商品身份并不重要（例如\
    \ 5 包素汉堡）：*\n  1. 收银员可以输入商品类别标识符和数量。\n  \n- *3-6a. 客户要求收银员从购买中移除一件商品：*\n  1. 收银员输入要从销售中移除的商品标识符。\n\
    \  2. 系统显示更新后的累计总额。\n  \n- *3-6b. 客户告诉收银员取消销售：*\n  1. 收银员在系统上取消销售。\n  \n- *3-6c.\
    \ 收银员暂停销售：*\n  1. 系统记录销售，以便可以在任何 POS 终端上检索。\n  \n- *4a. 系统生成的商品价格不符合要求（例如，客户对某事投诉并被提供了更低的价格）：*\n\
    \  1. 收银员输入覆盖价格。\n  2. 系统显示新价格。\n  \n- *5a. 系统检测到与外部税款计算系统服务的通信失败：*\n  1. 系统在\
    \ POS 节点上重启该服务，并继续。\n     1a. 系统检测到该服务未重启。\n        1. 系统发出错误信号。\n        2. 收银员可以手动计算并输入税款，或取消销售。\n\
    \  \n- *5b. 客户表示他们符合折扣条件（例如员工、优选客户）：*\n  1. 收银员发出折扣请求。\n  2. 收银员输入客户标识。\n  3.\
    \ 系统根据折扣规则显示折扣后总额。\n  \n- *5c. 客户表示其账户中有信用额度，可用于本次销售：*\n  1. 收银员发出信用请求。\n  2.\
    \ 收银员输入客户标识。\n  3. 系统应用信用额度，直至价格=0，并减少剩余信用。\n  \n- *6a. 客户表示他们打算用现金付款，但现金不够：*\n\
    \  1a. 客户使用替代付款方式。\n  1b. 客户告诉收银员取消销售。收银员在系统上取消销售。\n\n"
