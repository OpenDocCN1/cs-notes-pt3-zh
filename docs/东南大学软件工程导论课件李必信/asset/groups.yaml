    \ 对象观—OOA&D理论认为，现实世界是由对象构成的，对象是具有特殊属性和行为的实体，对象间具有共性、层次性、继承性和关联性，反应了客观世界从普遍到一般、从个性到共性及相互制约的运动规律。从这个角度，软件的开发可视为“类”的抽象及其关联的建模过程，软件的运行是对象的实例化及其状态的演变过程。\n\
    - 生存期—根据ISO/IEC 12207软件生命周期标准，一个通用的软件生命周期模型：（1）定义阶段（计划、需求分析）；（2）开发阶段（概要设计、详细设计、编码、集成测试、试运行和验收）；（3）运行维护\n\
    - 质量观—一种三维软件质量衡量：（1）软件运行（正确性、可用性、强壮性、安全性、性能）；（2）软件维护（可理解性、可扩展性、易维护性、灵活性）；（3）软件移植（可移植性、可复用性、互操作性）。\n\
    - 人机工程观—好的系统应该易于学习、理解和掌握；界面应该简洁。\n- 集成观—各种软件、硬件资源的集成\n- 结构观—\n  ![](img/fcdc64f47992afbcce2e20fafbbb0375_564_0.png)\n\
    - **The software essence**\n  - Complexity\n  - Conformity[conformance to]\n \
    \ - Changeability[software evolution]\n  - Invisibility\n- **The software accidents**\n\
    \  - Stakeholders\n  - Process\n  - Modeling language and tools\n\n### Software\
    \ Life Cycle\n\n- **Coarse granularity**\n  - 1 Analysis\n  - 2 Design\n  - 3\
    \ Implementation\n  - 4 Maintenance\n- **Refined granularity**\n  - 1 Application\
    \ Requirements determination\n  - 2 Software Requirements specification\n  - 3\
    \ Architectural design\n  - 4 Detailed design\n  - 5 Implementation\n  - 6 Integration\n\
    \  - 7 Maintenance\n\n- **Software engineering** is the profession that creates\
    \ and maintains software applications by applying technologies and practices from\
    \ computer science, project management, engineering, application domains, and\
    \ other fields.\n- The term software engineering first was used in the late <u>1950s</u>\
    \ and early <u>1960s</u>. Programmers have always known about civil, electrical,\
    \ and computer engineering and debated what engineering might mean for software.\n\
    \nThe **NATO Science Committee** sponsored two **conferences** on software engineering\
    \ in **1968** (Garmisch, Germany) and **1969**, which gave the field its initial\
    \ boost. Many believe these conferences marked the **official start of the profession**.\n\
    \n### History of Software Engineering\n\n- 1945 to 1965: The origins\n- 1965 to\
    \ 1985: The software crisis\n- 1985 to present: No silver bullet\n\n### 2.2 软件开发的文档（规约、代码）\n\
    \n- 调查报告（可行性分析）\n- 应用需求分析文档（SDL document）\n- 软件需求规约（use case, domain model）\n\
    - 软件设计规约（UML Interaction diagrams）\n- 源程序代码（Java code etc）\n- 测试计划、测试数据和测试报告等\n\
    \nModeling techniques\n\n- Script programming language （Perl）\n- Literate Programming\
    \ language （WEB, CWEB, FWEB, MLWEB）\n- Object oriented programming language （Smalltalk,\
    \ C++, Java）\n- Aspect oriented programming language （AspectJ）\n- Concurrent programming\
    \ language （Occam, Ada, CSP, CCS）\n- Component-oriented programming language （ADL,\
    \ CDL, IDL）\n- Interactive programming language （Basic, Python, B）\n\n"
