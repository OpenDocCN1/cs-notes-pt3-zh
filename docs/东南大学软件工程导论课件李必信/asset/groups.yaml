    +     DIMENSION语句可以用来规定数组的维数，其形式为：

    +     DIMENSION ad[,ad]...

    +   - 其中ad 为数组描述符，形式为n(d[,d]...)

    +     其中n为数组名，由1个到6个字母或数字组成，为首的必须是字母；d是维数说明符，数组维数最大为7最小为1，形式为：[lb:]ub, lb和ub分别表示数字下标的下界和上界，均为-65534
    - 65535之间的整数，也可以是整型变量名(但不可以是数组元素名)。若未规定lb，则其值认为为1，且 ub>=lb。若已规定lb，则它可以为负数、零、正数。

    +   - DIMENSION语句可写多行。'
