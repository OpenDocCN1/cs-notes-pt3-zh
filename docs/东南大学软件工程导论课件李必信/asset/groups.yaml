    # Team Coordination & Communication


    +   - **Formal, impersonal approaches** include software engineering documents
    and work products (including source code), technical memos, project milestones,
    schedules, and project control tools (Chapter 23), change requests and related
    documentation, error tracking reports, and repository data (see Chapter 26).

    +   - **Formal, interpersonal procedures** focus on quality assurance activities
    (Chapter 25) applied to software engineering work products. These include status
    review meetings and design and code inspections.

    +   - **Informal, interpersonal procedures** include group meetings for information
    dissemination and problem solving and “collocation of requirements and development
    staff.”

    +   - **Electronic communication** encompasses electronic mail, electronic bulletin
    boards, and by extension, video-based conferencing systems.

    +   - **Interpersonal networking** includes informal discussions with team members
    and those outside the project who may have experience or insight that can assist
    team members.'
