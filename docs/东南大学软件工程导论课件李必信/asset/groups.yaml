    # Version Control


    +   - Version control combines procedures and tools to manage different versions
    of configuration objects that are created during the software process

    +   - A version control system implements or is directly integrated with four
    major capabilities:

    +     - a project database (repository) that stores all relevant configuration
    objects

    +     - a version management capability that stores all versions of a configuration
    object (or enables any version to be constructed using differences from past versions);

    +     - a make facility that enables the software engineer to collect all relevant
    configuration objects and construct a specific version of the software.

    +     - an issues tracking (also called bug tracking) capability that enables
    the team to record and track the status of all outstanding issues associated with
    each configuration object.'
