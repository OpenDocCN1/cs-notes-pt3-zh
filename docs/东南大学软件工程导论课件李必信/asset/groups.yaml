    ## 第2章 过程：通用视图（过程综述）\n\n*软件工程：实践者的方法，第6版*  \n*作者：罗杰·S. 普莱斯曼*\n\n## 再看软件工程\n\n\
    ## 软件工程：IEEE 定义\n\n软件工程：(1) 将系统的、规范的、可量化的[系统的、规范的、可量化的]方法应用于软件的开发、运行和维护；也就是说，将工程学应用于软件。(2)\
    \ 对(1)中所述方法的研究。\n\n- IEEE标准 610.12-1990\n\n## 软件工程：分层技术\n\n软件工程\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_54_0.png)\n\
    \n- SE工具：(半)自动化支持(CASE)\n- SE方法：如何做；基本原则\n- SE基础：过程\n- SE根基：质量关注点\n\n软件工程基础是过程(process)！！！\n\
    \n## 2.1 软件过程模型\n\n- 试图通过以下方式组织软件生命周期：\n  - 定义软件生产[软件生产]所涉及的活动\n  - 定义活动的顺序及其关系\n\
    - 软件过程的目标\n  - 标准化、可预测性、生产率、高质量产品、能够规划时间和预算需求\n\n## 早期做法：编码与修复\n\n最早的方法\n\n- 编写代码\n\
    - 修复它(修复)以消除已检测到的任何错误，增强现有功能，或添加新特性\n- 困难和缺陷的来源\n  - 无法预测\n  - 无法管理\n- 不足的症状：软件危机\n\
    \  - 计划时间和成本超支\n  - 未达到用户期望\n  - 质量差\n- 软件应用的大小和经济价值需要适当的“过程模型”\n\n## 2.2 过程模型目标(B.\
    \ Boehm 1988)\n\n确定软件开发和演化所涉及阶段的顺序，并建立从一个阶段进入下一个阶段的**过渡标准**。这些标准包括当前阶段的**完成标准**，以及下一阶段的**选择标准**和**进入标准**。因此，过程模型要解决以下软件项目问题：\n\
    \n- 我们接下来该做什么？\n- 我们应该继续做多久？\n\n## 3 怎么看软件过程？\n\n- 3.1 黑盒观点\n- 3.2 白盒观点\n\n###\
