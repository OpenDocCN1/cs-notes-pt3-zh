    由ISEU开发的用于软件演化度量和评估的原型系统。该系统目前具有软件架构演化度量和评估、源代码演化度量和评估两大功能。具体包括：架构演化度量设计、构件演化度量分析、引起度量结果差异的原因分析和定位；软件演化对代码复杂度、复杂度变化和复杂度变化率的影响分析；对软件可靠性、可维护性、可兼容性的影响，演化成本预测等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_3.png)\n\n**4. 软件架构协同度、评估与验证系统 v2.0**\n\
    由ISEU开发用于软件架构构件、评估和验证的原型系统，按照自定向方式对基于UML设计模型的软件架构构件和文档进行协同、评估和验证。为架构设计提供直观可靠的评价结果，指导架构设计与演化。具体包括：架构融合性检验、架构易维护性、架构协同性、架构验证、架构可理解性、知识库构建和整合评价等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_4.png)\n\n谢谢大家！\n\n## Chapter 1\n\
    \n## Software and Software Engineering\n\n**Software Engineering: A Practitioner’s\
    \ Approach, 6th edition**  \n*by Roger S. Pressman*\n\n## Software’s Dual Role\n\
    \n- **Software is a product**\n  - *Transforms* information - produces, manages,\
    \ acquires, modifies, displays, or transmits information;\n  - Delivers computing\
    \ potential of hardware and networks\n- **Software is a vehicle for delivering\
    \ a product**\n  - Controls other programs (operating system);\n  - Effects(实现)\
    \ communications (networking software);\n  - Helps build other software (software\
    \ tools & environments)\n\n## Software Applications\n\n- system software\n- application\
    \ software\n- engineering/scientific software[CAD etc.]\n- embedded software\n\
    - product-line software\n- web applications\n- AI software\n\n## Hardware vs.\
    \ Software\n\n## Hardware\n\n- Manufactured\n- Wears out [磨损]\n- Built using components\n\
    - Relatively simple\n\n## Software\n\n- Developed/engineered\n- Deteriorates [恶化]\n\
    - Custom built [根据需求定制的]\n- Complex\n\n## Manufacturing vs. Development\n\n- Once\
    \ a hardware product has been manufactured, it is difficult or impossible to modify.\
    \ In contrast, software products are routinely modified and upgraded.\n- In hardware,\
    \ hiring more people allows you to accomplish more work, but the same does not\
    \ necessarily hold true in software engineering.\n- Unlike hardware, software\
    \ costs are concentrated in design rather than production.\n\n## Wear vs. Deterioration\n\
    \n## Software deteriorates over time\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_36_0.png)\n\
    \n## Component Based vs. Custom Built\n\n- Hardware products typically employ\
    \ many standardized design components.\n- Most software continues to be custom\
    \ built.\n- The software industry does seem to be moving (slowly) toward component-based\
    \ construction.\n\n## Software Complexity\n\nI believe the hard part of building\
    \ software to be the specification, design, and testing of this conceptual construct,\
    \ not the labor of representing it and testing the fidelity of the representation.\n\
    \nIf this is true, building software will always be hard. There is inherently\
    \ no silver bullet.\n\n> - Fred Brooks, “No Silver Bullet”\n\nhttp://www.computer.org/computer/homepage/misc/Brooks/\n\
    \nNo Silver Bullet: 没有仙丹 只没有一下子就能解决问题的方法\n"
  mdcn: "\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_27_0.png)\n\n## （2）关注点驱动的项目申报\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_0.png)\n\n东南大学软件工程研究所（ISEU，Institute\
    \ of Software Engineering, Southeast University）是一个专注于软件工程理论和实践的学术机构，由中泰信息教授于2012年1月8日发起成立。ISEU是在软件工程理论与实践研究室的基础上，融合软件分析与测试和面向服务的软件工程等研究室共同建立起来的，现有教师10名、博士后2名、博士生10名、硕士生30名，外国留学生6名。\n\
    \n## 研究所的任务\n\n全面开展软件工程及其相关领域的学术研究，出高水平的研究成果；全面开展软件工程实践探索，使之直接服务于社会，造福于人民；培养软件工程领域的高级研究人才和工程技术人才，为我国软件技术研究和软件产业发展做出我们的贡献。\n\
    \n东南大学软件工程研究所近年来承担着20多项国家级和省部级的科研项目（包括国家863高技术计划项目、国家自然科学基金项目、江苏省自然科学基金项目、教育部博士点基金项目等），同时也承担了10多项横向合作项目的研究与开发工作。研究所近年来取得了一系列令人满意的成果：出版高水平学术专著（译）著5部，发表论文160余篇，被SCI/EI检索超过150篇次，授权发明专利30项，软件著作权登记14项；为社会输送博士毕业生10人，硕士毕业生80余人。\n\
    \n研究所承担了计算机科学与技术学科、软件工程学科大量的基础课和专业课的教学工作，通过教学与科研的紧密结合，促进教学质量不断提高。ISEU希望和世界范围内软件工程领域的研究者和实践者建立广泛的交流与合作。\n\
    \n## 主要研究方向\n\n- （1）软件工程的基础理论和实践；（2）软件分析、测试和验证；（3）软件演化、维护和变更影响分析；（4）软件设计模式和架构模式识别；（5）软件架构演化、评估和重构；（6）软件安全性和可靠性，等等。\n\
    \n## 代表性原型工具简介\n\n**1. 软件架构可演进性评估系统 v1.0**\n由ISEU开发的软件架构可演进性评估原型系统，用于辅助分析当前架构的演进能力，对软件架构整体指标和组件指标进行评估。系统多层次地分析和识别软件架构，指出软件架构构成的演进能力和演进效果。具体功能：面向架构的逆向工程、从四个维度度量架构的演进能力、架构演进性度量、架构演进性度量模型、架构动态映射、架构可演进性分析、架构演进性评估、质量驱动的架构模式决策等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_1.png)\n\n**2. 切片工具 MyJavaSlicer\
    \ v1.0**\n由ISEU开发的一款自动化Java程序切片工具，能够对JDK 7开发的面向对象程序进行静态和动态切片，支持多种切片标准。工具具备语句切片、有关条件切片、后向切片等功能，并支持Java故障定位、语句覆盖分析，可复用功能提供双向及API度量等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_2.png)\n\n**3. 软件演化度量评估系统 v1.0**\n\
    由ISEU开发的用于软件演化度量和评估的原型系统。该系统目前具有软件架构演化度量和评估、源代码演化度量和评估两大功能。具体包括：架构演化度量设计、构件演化度量分析、引起度量结果差异的原因分析和定位；软件演化对代码复杂度、复杂度变化和复杂度变化率的影响分析；对软件可靠性、可维护性、可兼容性的影响，演化成本预测等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_3.png)\n\n**4. 软件架构协同度、评估与验证系统 v2.0**\n\
    由ISEU开发用于软件架构构件、评估和验证的原型系统，按照自定向方式对基于UML设计模型的软件架构构件和文档进行协同、评估和验证。为架构设计提供直观可靠的评价结果，指导架构设计与演化。具体包括：架构融合性检验、架构易维护性、架构协同性、架构验证、架构可理解性、知识库构建和整合评价等。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_28_4.png)\n\n谢谢大家！\n\n## 第一章\n\n##\
    \ 软件与软件工程\n\n**《软件工程：实践者的研究方法》第6版**  \n*作者 Roger S. Pressman*\n\n## 软件的双重角色\n\n\
    - **软件是一种产品**\n  - *转换*信息 - 生产、管理、获取、修改、显示或传输信息；\n  - 提供硬件和网络的计算潜力\n- **软件是交付产品的载体**\n\
    \  - 控制其他程序（操作系统）；\n  - 实现通信（网络软件）；\n  - 帮助构建其他软件（软件工具和环境）\n\n## 软件应用\n\n- 系统软件\n\
    - 应用软件\n- 工程/科学软件[CAD等]\n- 嵌入式软件\n- 产品线软件\n- Web应用\n- AI软件\n\n## 硬件 vs. 软件\n\n\
    ## 硬件\n\n- 制造而成\n- 会磨损 [磨损]\n- 由组件构建\n- 相对简单\n\n## 软件\n\n- 开发/工程化\n- 会恶化 [恶化]\n\
    - 定制构建 [根据需求定制的]\n- 复杂\n\n## 制造 vs. 开发\n\n- 一旦硬件产品制造完成，就很难或不可能修改。相比之下，软件产品会常规地被修改和升级。\n\
    - 在硬件中，雇佣更多人可以完成更多工作，但在软件工程中则不一定如此。\n- 与硬件不同，软件成本集中在设计而非生产上。\n\n## 磨损 vs. 退化\n\
    \n## 软件会随时间推移而退化\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_36_0.png)\n\n## 基于组件\
    \ vs. 定制构建\n\n- 硬件产品通常采用许多标准化的设计组件。\n- 大多数软件仍然是定制构建的。\n- 软件行业似乎正在缓慢地向基于组件的构建方式转变。\n\
    \n## 软件复杂性\n\n我认为构建软件的困难之处在于对这一概念构造的规范、设计和测试，而不是表示它并测试其保真度的劳动。\n\n如果这是真的，构建软件将永远是困难的。本质上不存在银弹。\n\
    \n> - Fred Brooks，《没有银弹》\n\nhttp://www.computer.org/computer/homepage/misc/Brooks/\n\
    \nNo Silver Bullet: 没有仙丹 只没有一下子就能解决问题的方法\n\n"
