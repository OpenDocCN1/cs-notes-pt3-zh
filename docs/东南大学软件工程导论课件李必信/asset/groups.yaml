    \ for Software Projects\n\nSoftware Engineering: A Practitioner’s Approach, 6th\
    \ edition\n\nby Roger S. Pressman\n\n## 本章要点\n\n- 项目估算\n\n## 项目的哪些属性可以进行估算\n\n\
    软件项目的属性有很多，建议至少以下属性要在项目计划时对其进行估算：\n\n- 1、项目规模\n- 2、项目工作量\n- 3、项目所需资源\n- 4、项目各阶段工作量\n\
    - 5、项目成本\n\n## Software Project Planning\n\nThe overall goal of project planning\
    \ is to establish a **pragmatic strategy**[务实的策略] for controlling, tracking, and\
    \ monitoring a complex technical project.\n\nWhy?\n\nSo the end result gets done\
    \ on time, with quality!\n\n## Project Planning Task Set-I\n\n- Establish project\
    \ scope\n- Determine feasibility\n- Analyze risks\n- Define required resources\n\
    \  - Determine require human resources\n  - Define reusable software resources\n\
    \  - Identify environmental resources\n\n## Project Estimation Basis\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_362_0.png)\n\
    \n- Project scope must be understood\n- Elaboration (decomposition) is necessary\n\
    - Historical metrics are very helpful\n- At least two different techniques should\
    \ be used\n- Uncertainty is inherent in the process\n\n## Estimation Techniques\n\
    \n- **主观和客观方法**\n- Past (similar) project experience\n- Conventional estimation\
    \ techniques\n  - task breakdown and effort estimates\n  - size (e.g., FP) estimates\n\
    - Empirical models\n- Automated tools\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_363_0.png)\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_363_1.png)\n\n## Empirical Estimation\
    \ Models\n\nGeneral form:\n\n```\neffort = tuning coefficient * size^exponent\n\
    ```\n\nusually derived as person-months of effort required\n\neither a constant\
    \ or a number derived based on complexity of project\n\nusually LOC but may also\
    \ be function point\n\nexponent\nempirically derived\n\n## COCOMO-II\n\nCOCOMO，英文全称为constructive\
    \ cost model，中文为构造性成本模型。它是一种精确、易于使用的、基于模型的成本估算方法，最早由勃姆（Boehm）于1981年提出。从本质上说是一种参数化的项目估算方法，参数建模是把项目的某些特征作为参数，通过建立一个数字模型预测项目成本（类似于居住面积作为参数计算的整体的住房成本）。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_365_0.png)\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_365_1.png)\n\
    \n## The Software Equation\n\nA dynamic multivariable model\n\n**E = [LOC × B^0.333/P]^3\
    \ × (1/t^4)**\n\nwhere\n\n- **E = effort in person-months or person-years**\n\
    - t = project duration in months or years\n- B = “special skills factor”\n- P\
    \ = “productivity parameter”\n\n## Estimation for OO Projects\n\n- Develop estimates\
    \ using effort decomposition, FP analysis, and any other method that is applicable\
    \ for conventional applications.\n- Using object-oriented analysis modeling (Chapter\
    \ 8), develop use-cases and determine a count.\n- From the analysis model, determine\
    \ the number of key classes (called analysis classes in Chapter 8).\n- Categorize\
    \ the type of interface for the application and develop a multiplier for support\
    \ classes:\n  - Interface type\n  - No GUI\n  - Text-based user interface\n  -\
    \ GUI\n  - Complex GUI\n\n| Interface type | Multiplier |\n|---|---|\n| No GUI\
    \ | 2.0 |\n| Text-based user interface | 2.25 |\n| GUI | 2.5 |\n| Complex GUI\
    \ | 3.0 |\n\n## Estimation for Agile Projects\n\n- Each user scenario (a mini-use-case)\
    \ is considered separately for estimation purposes.\n- The scenario is decomposed\
    \ into the set of software engineering tasks that will be required to develop\
    \ it.\n- Each task is estimated separately. Note: estimation can be based on historical\
    \ data, an empirical model, or “experience.”\n  - Alternatively, the ‘volume’\
    \ of the scenario can be estimated in LOC, FP or some other volume-oriented measure\
    \ (e.g., use-case count).\n- Estimates for each task are summed to create an estimate\
    \ for the scenario.\n  - Alternatively, the volume estimate for the scenario is\
    \ translated into effort using historical data.\n- The effort estimates for all\
    \ scenarios that are to be implemented for a given software increment are summed\
    \ to develop the effort estimate for the increment.\n"
  mdcn: "\n\n## 典型项目指标\n\n- **工作量/时间** 每个软件工程任务\n- **错误发现数** 每个评审小时\n- 计划与实际的 **里程碑日期**\n\
    - **变更**（数量）及其 **特征**\n- 软件工程任务上的 **工作量分布**\n\n## 第23章\n\n## 软件项目的估算\n\nSoftware\
    \ Engineering: A Practitioner’s Approach, 6th edition\n\nby Roger S. Pressman\n\
    \n## 本章要点\n\n- 项目估算\n\n## 项目的哪些属性可以进行估算\n\n软件项目的属性有很多，建议至少以下属性要在项目计划时对其进行估算：\n\
    \n- 1、项目规模\n- 2、项目工作量\n- 3、项目所需资源\n- 4、项目各阶段工作量\n- 5、项目成本\n\n## 软件项目规划\n\n项目规划的总体目标是为控制、跟踪和监控一个复杂的工程项目建立一个**务实的策略**[务实的策略]。\n\
    \n为什么？\n\n这样最终结果就能按时、保质完成！\n\n## 项目规划任务集-I\n\n- 确定项目范围\n- 确定可行性\n- 分析风险\n- 定义所需资源\n\
    \  - 确定所需人力资源\n  - 定义可重用的软件资源\n  - 识别环境资源\n\n## 估算基础\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_362_0.png)\n\
    \n- 必须理解项目范围\n- 需要细化（分解）\n- 历史指标非常有帮助\n- 至少应使用两种不同技术\n- 不确定性是该过程固有的\n\n## 估算技术\n\
    \n- **主观和客观方法**\n- 过去（类似）项目经验\n- 常规估算技术\n  - 任务分解和工作量估算\n  - 规模（例如，FP）估算\n- 经验模型\n\
    - 自动化工具\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_363_0.png)\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_363_1.png)\n\
    \n## 经验估算模型\n\n一般形式：\n\n```\neffort = tuning coefficient * size^exponent\n```\n\
    \n通常推导为所需工作量的人月\n\n要么是一个常数，要么是一个基于项目复杂性推导出的数字\n\n通常为 LOC，但也可能是功能点\n\nexponent\n\
    经验推导\n\n## COCOMO-II\n\nCOCOMO，英文全称为constructive cost model，中文为构造性成本模型。它是一种精确、易于使用的、基于模型的成本估算方法，最早由勃姆（Boehm）于1981年提出。从本质上说是一种参数化的项目估算方法，参数建模是把项目的某些特征作为参数，通过建立一个数字模型预测项目成本（类似于居住面积作为参数计算的整体的住房成本）。\n\
    \n![](img/fcdc64f47992afbcce2e20fafbbb0375_365_0.png)\n\n![](img/fcdc64f47992afbcce2e20fafbbb0375_365_1.png)\n\
    \n## 软件方程\n\n一个动态多变量模型\n\n**E = [LOC × B^0.333/P]^3 × (1/t^4)**\n\n其中\n\n- **E\
    \ = 以人月或人年计的工作量**\n- t = 以月或年计的项目持续时间\n- B = “特殊技能因子”\n- P = “生产率参数”\n\n## 面向对象项目的估算\n\
    \n- 使用工作量分解、FP 分析以及适用于常规应用的任何其他方法进行估算。\n- 使用面向对象分析建模（第 8 章），开发用例并确定计数。\n- 从分析模型中，确定关键类的数量（第\
    \ 8 章中称为分析类）。\n- 对应用的接口类型进行分类并为支持类开发乘数：\n  - 接口类型\n  - 无 GUI\n  - 基于文本的用户界面\n\
    \  - GUI\n  - 复杂 GUI\n\n| 接口类型 | 乘数 |\n|---|---|\n| 无 GUI | 2.0 |\n| 基于文本的用户界面\
    \ | 2.25 |\n| GUI | 2.5 |\n| 复杂 GUI | 3.0 |\n\n## 敏捷项目的估算\n\n- 每个用户场景（一个迷你用例）都被单独考虑用于估算目的。\n\
    - 该场景被分解为开发它所需的一组软件工程任务。\n- 每个任务单独估算。注意：估算可以基于历史数据、经验模型或“经验”。\n  - 或者，可以以 LOC、FP\
    \ 或其他面向量的度量（例如，用例计数）估算场景的“量”。\n- 每个任务的估算值相加以创建场景的估算值。\n  - 或者，使用历史数据将场景的量估算转换为工作量。\n\
    - 将要为给定软件增量实现的全部场景的工作量估算值相加，以得出该增量的工作量估算。\n\n"
