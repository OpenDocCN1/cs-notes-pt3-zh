    # ■ **Fortran**


    +   - The next big step in programming began when an IBM team under *John W. Backus*
    created FORTRAN - FORmula TRANslator **1952**.

    +   - It could only be used on their own machine, the: IBM 704. But later versions
    for other machines, and platforms were sold soon after.'
  - '[PAGE 548]


    # Programming language


    +   - **FORTRAN** soon became called a programming language.

    +   - So why calling a set of some predefined instructions a programming language?

    +   - Because some characteristics of a language are met:

    +     - It must have a vocabulary - list of words

    +     - It must have a grammar - or syntax

    +     - It must be unique, both in words and in context'
  - '[PAGE 549]


    # Cobol


    +   - And by the time when **Cobol**, Common Business Oriented Language, was published
    in **1960** by the CODASYL (Conference on Data System Languages) committee, (Hopper
    was a member) the term Computer Language was a fact.


    # Enter "C"


    +   - C came into being in the years **1969-1973** and was developed by Dennis
    Richey and David Kerningham both working at the Bell laboratories. And the magic
    word was **portability**'
  - "[PAGE 550]\n\n# A C example program\n\n```\n#include <stdio.h>\n\nint main()\n\
    {\n    printf( \"Hello world!\\n\" );\n}\n```"
  - '[PAGE 551]


    # Operating Systems (OS)


    Parallel at the development of computer languages, Operating Systems (OS) were
    developed. These were needed because to create programs and having to write all
    machine specific instructions over and over again was a "waste of time" job.'
  - '[PAGE 552]


    +   - So by introducing the OS ''principle'' almost all input and output tasks
    were taken over by the OS. Such as:

    +     - writing data to and from memory,

    +     - saving data on disks,

    +     - writing data to screens and printers,

    +     - starting tapes,

    +     - refreshing memory,

    +     - scheduling specific tasks

    +     - etcetera.'
  - '[PAGE 553]


    # Interpreters and Compilers


    +   - An **interpreter** is a computer language that execute instructions that
    are written in the form of a program. The trick of an interpreter is that it loads
    the source code and translates the instruction into executable machine language
    **line by line**. And it does it over and over again any time that program is
    run.

    +   - In short a **COMPILER** is: the translator of the source code into computer
    language.'
