  - '[PAGE 297]


    # 3c. Elaborate Attributes


    +   - Analysis classes will typically only list names of general attributes (ex.
    paperType).

    +   - List all attributes during component design.

    +   - UML syntax:

    +     - `name : type-expression = initial-value { property string }`

    +   - For example, paperType can be broken into weight, size, and color. The weight
    attribute would be:

    +     - `paperType-weight: string = "A" { contains 1 of 4 values – A, B, C, or
    D }`'
