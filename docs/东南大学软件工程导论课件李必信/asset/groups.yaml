    \ 软件科学：** 一套全面的度量集合，全部基于组件或程序内**操作符**和**操作数**的数量（计数和出现次数）\n  - “**操作符**”是语言中的固定符号或保留字，而“**操作数**”是其他一切：变量名、函数名、数字常量等。注释不计入。\n\
