    - OOA/OOD/OOP (1986)\n- 基于组件的软件开发 (1990)\n- 极限编程 (1999)\n\n- Problems\n  - 顺序的和转换的\n\
    \  - 不灵活的解决方案\n  - 无复用\n\n- 面向对象方法：The focus is on:\n  - 责任和角色\n  - 对象之间的合作与协作\n\
    \n- Modeling Techniques\n  - OOD G. Booch(1991)\n  - HOOD HOOD Technical Group(1993)\n\
    \  - OOA S. Shlaer and S. Mellor(1988, 1992)\n  - OOA/OOD T. Coad and Y. Yourdan(1991)\n\
    \  - OMT J. Rumbaugh, M. Blaha, …(1991)\n  - OOSE I. Jacobson, …(1992)\n  - FUSION\
    \ D. Coleman, …(1994)\n  - UML1.0-1.5: Booch, Rumbaugh, Jacobson(1998-2003)\n\n\
    - 在结构化方法中，系统分解（分而治之）主要按功能或过程进行，导致过程的层次化分解，由子过程组成。这是一种面向解决方案的方法。\n- 在面向对象方法中，问题空间按对象进行分解。这是一种面向问题域的方法。\n\
    \n## The Library\n信息系统\n\n面向对象的分析/设计\n按对象或概念分解\n\n结构化分析/设计\n按功能或过程分解\n\n- 目录\n\
    - 图书管理员\n- 书籍\n- 图书馆\n\n- 系统\n  - 记录借阅\n  - 增加资源\n  - 报告罚款\n\n## 2.5 软件开发的过程模型\n\
    \n- 自顶向下模型\n- 自底向上\n- **瀑布模型**\n- **V模型**\n- **螺旋模型**\n- 混沌模型\n- **原型化**\n- 进化式原型\n\
    - **迭代和增量开发**\n- **极限编程**\n- **理性统一过程**\n\n## Process model\n\n- 线性\n  - 瀑布\n\
