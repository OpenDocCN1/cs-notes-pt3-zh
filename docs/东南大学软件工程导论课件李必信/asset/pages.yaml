- pgno: 433
  md: '# Repository Features


    +   - **Versioning**: saves all of these versions to enable effective management
    of product releases and to permit developers to go back to previous versions

    +   - **Dependency tracking and change management**: The repository manages a
    wide variety of relationships among the data elements stored in it.

    +   - **Requirements tracing**: Provides the ability to track all the design and
    construction components and deliverables that result from a specific requirement
    specification

    +   - **Configuration management**: Keeps track of a series of configurations
    representing specific project milestones or production releases. Version management
    provides the needed versions, and link management keeps track of interdependencies.

    +   - **Audit trails**[査勘索引]: establishes additional information about when, why,
    and by whom changes are made.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# SCM Elements


    +   - **Component elements**—a set of tools coupled within a file management system
    (e.g., a database) that enables access to and management of each software configuration
    item.

    +   - **Process elements**—a collection of procedures and tasks that define an
    effective approach to change management (and related activities) for all constituencies
    involved in the management, engineering and use of computer software.

    +   - **Construction elements**—a set of tools that automate the construction
    of software by ensuring that the proper set of validated components (i.e., the
    correct version) have been assembled.

    +   - **Human elements**—to implement effective SCM, the software team uses a
    set of tools and process features (encompassing other CM elements)'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# The SCM Process

    *Addresses the following questions ...*


    +   - How does a software team identify the discrete elements of a software configuration?

    +   - How does an organization manage the many existing versions of a program
    (and its documentation) in a manner that will enable change to be accommodated
    efficiently[有效容纳]?

    +   - How does an organization control changes before and after software is released
    to a customer?

    +   - Who has responsibility for approving and ranking changes?

    +   - How can we ensure that changes have been made properly?

    +   - What mechanism is used to appraise[评价] others of changes that are made?'
  merge: -1
