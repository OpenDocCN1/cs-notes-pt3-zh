- pgno: 509
  md: '# 2.2.3 条件覆盖


    使程序的判定中每个条件的真假取值至少满足一次


    例中设条件

    A>1

    B=0

    A=2

    X>1

    取真表为

    T₁

    T₂

    T₃

    T₄

    取假表为

    ⊥₁

    ⊥₂

    ⊥₃

    ⊥₄


    | A B X | 经历 | 覆盖分支 | 覆盖条件 |

    | 2 0 3 | a c e | c e | T₁ T₂ T₃ T₄ |

    | 1 0 1 | a b d | b d | ⊥₁ T₂ ⊥₃ ⊥₄ |

    | 2 1 1 | a b e | b e | T₁ ⊥₂ T₃ ⊥₄ |

    |  |  | 4分支 | 4条件8取值 |'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# 条件覆盖


    另一例：


    | ABX | 经历 | 覆盖分支 | 覆盖条件 |

    | --- | --- | --- | --- |

    | 1 0 3 | a b e | b e | T₁ T₂ T₃ T₄ |

    | 2 1 1 | a b e | b e | T₁ T₂ T₃ T₄ |


    2分支

    4条件8取值


    覆盖了条件的测试用例不一定覆盖分支。事实上，它只覆盖了4个分支中的两个（b和e）。为解决这一矛盾，需要兼顾条件和分支。'
  merge: -1
  img_proc: true
