- pgno: 419
  md: '# Statistical SQA


    # Product

    & Process


    Collect information on all defects

    Find the causes of the defects

    Move to provide fixes for the process


    measurement


    ... an understanding of how to improve quality ...


    # 基于统计的软件质量保证


    基于统计的质量保证反映了一种在产业界不断增长的趋势：质量的量化。对于软件而言，基于统计的质量保证包含以下步骤：


    +   1、收集和分类软件缺陷信息。

    +   2、追溯每个缺陷的形成原因。

    +   3、使用Pareto法则，将20%的原分离出来。

    +   4、一旦找出这些重要的少数原因，就 可以开始纠正引起缺陷的问题。


    ![](img/fcdc64f47992afbcce2e20fafbbb0375_419_0.png)'
  merge: -1
  img_proc: true
- pgno: 420
  md: "# Software Reliability\n\n+   - A simple measure of reliability is *mean-time-between-failure*\
    \ (MTBF), where\n+     \n+     **MTBF = MTTF + MTTR**\n+   \n+   - The acronyms\
    \ MTTF and MTTR are *mean-time-to-failure* and *mean-time-to-repair*, respectively.\n\
    +   \n+   - *Software availability* is the probability that a program is operating\
    \ according to requirements at a given point in time and is defined as\n+    \
    \ \n+     **Availability = [MTTF/(MTTF + MTTR)] x 100%**"
  merge: -1
  img_proc: true
- pgno: 421
  md: '# Software Safety


    +   - **Software safety** is a software quality assurance activity that focuses
    on the **identification and assessment** of potential **hazards** that may affect
    software negatively and cause an entire system to fail.

    +   - If hazards can be identified early in the software process, software design
    features can be specified that will either eliminate or control potential hazards.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# ISO 9001:2000 Standard


    +   - ISO 9001:2000 is the **quality assurance standard** that applies to software
    engineering.

    +   - The standard contains **20 requirements** that must be present for an effective
    quality assurance system.

    +   - The requirements delineated by ISO 9001:2000 address topics such as

    +     - management responsibility, **quality system**, contract review, **design
    control**, document and data control, **product identification and traceability**,
    process control, **inspection and testing**, corrective and preventive action,
    **control of quality records**, internal quality audits, **training**, servicing,
    and **statistical techniques**.'
  merge: -1
