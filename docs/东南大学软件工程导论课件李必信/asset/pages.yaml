- pgno: 140
  md: '# System Modeling


    +   - define the processes that serve the needs of the view under consideration.
    [定义在所考虑视图中满足需要的过程]

    +   - represent the behavior of the processes and the assumptions on which the
    behavior is based. [描述过程行为和该行为所依据的假设]

    +   - explicitly define both exogenous and endogenous input to the model. [明确定义模型的外在和内在输入]

    +     - exogenous inputs link one constituent(要素) of a given view with other constituents
    at the same level or other levels; endogenous input links individual components
    of a constituent at a particular view.

    +   - represent all linkages (including output) that will enable the engineer
    to better understand the view. [描述有助于工程师理解视图的全部联系(包括输出)]'
