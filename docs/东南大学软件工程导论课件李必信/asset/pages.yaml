  md: '+   - This meant a breakthrough for mathematics. Boole was the first to prove
    that logic is part of mathematics and not of philosophy. A big step in thinking
    too.

    +   - But it will take **one hundred years** before this algebra of logic is put
    to work for computing.

    +   - It took Claude Shannon (1916-2001) who wrote a thesis (A Mathematical Theory
    of Communication in the Bell System Technical Journal -1948) on how binary logic
    could be used in computing to complete the **software concept of modern computing**.'
  merge: -1
  img_proc: true
