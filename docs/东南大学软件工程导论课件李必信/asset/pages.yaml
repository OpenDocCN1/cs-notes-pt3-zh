- pgno: 477
  md: '# 因果图介绍


    恒等

    c₁ ── e₁

    c₁=1 ⇒ e₁=1

    c₁=0 ⇒ e₁=0


    非

    c₁ ── e₁

    c₁=1 ⇒ e₁=0

    c₁=0 ⇒ e₁=1


    或

    c₁

    c₂

    c₃ ∨ e₁

    c₁=1 或 c₂=1 或 c₃=1 ⇒ e₁=1

    否则 ⇒ e₁=0


    c₁

    c₂ ∧ e₁

    c₁=1 且 c₂=1 ⇒ e₁=1

    否则 ⇒ e₁=0'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# 输入条件的约束


    E约束（异）：a,b中至多有一个可能为1

    即a和b不能同时为1


    I约束（或）：a,b和c中至少有一个必须是1,即a、b和c不能同时为0


    O约束（唯一）：a和b中必须有一个且仅有一个为1'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# 输入条件的约束...


