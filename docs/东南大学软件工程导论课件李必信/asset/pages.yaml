  md: '# SCM Repository


    +   - The **SCM repository** [知识库] is the set of **mechanisms** and **data structures**
    that allow a software team to manage change in an effective manner

    +   - The repository performs or precipitates[沉淀] the following functions [FOR89]:

    +     - Data integrity

    +     - Information sharing

    +     - Tool integration

    +     - Data integration

    +     - Methodology enforcement

    +     - Document standardization'
