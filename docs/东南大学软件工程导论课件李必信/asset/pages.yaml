- pgno: 318
  md: '# Function-Based Metrics


    +   - **The function point metric (FP)**, first proposed by Albrecht [ALB79],
    can be used effectively as a means for measuring the functionality delivered by
    a system.

    +   - **Function points** are derived using an empirical relationship based on
    countable (direct) measures of software''s information domain and assessments
    of software complexity

    +   - **Information domain values** are defined in the following manner:

    +     - number of external inputs (EIs)

    +     - number of external outputs (EOs)

    +     - number of external inquiries (EQs)

    +     - number of internal logical files (ILFs)

    +     - Number of external interface files (EIFs)'
  merge: -1
