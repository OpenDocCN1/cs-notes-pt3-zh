- pgno: 322
  md: '# Metrics for OO Design-I


    +   - Whitmire [WHI97] describes nine distinct and measurable characteristics
    of an OO design:

    +     - **Size**

    +       - Size is defined in terms of four views: population, volume, length,
    and functionality

    +     - **Complexity**

    +       - How classes of an OO design are interrelated to one another

    +     - **Coupling**

    +       - The physical connections between elements of the OO design

    +     - **Sufficiency**

    +       - "the degree to which an abstraction possesses the features required
    of it, or the degree to which a design component possesses features in its abstraction,
    from the point of view of the current application."

    +     - **Completeness**

    +       - An indirect implication about the degree to which the abstraction or
    design component can be reused'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Metrics for OO Design-II


    +   - **Cohesion**

    +     - The degree to which all operations working together to achieve a single,
    well-defined purpose

    +   - **Primitiveness**

    +     - Applied to both operations and classes, the degree to which an operation
    is atomic

    +   - **Similarity**

    +     - The degree to which two or more classes are similar in terms of their
    structure, function, behavior, or purpose

    +   - **Volatility**

    +     - Measures the likelihood that a change will occur'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Class-Oriented Metrics (1)


    +   - weighted methods per class (WMC)

    +   - depth of the inheritance tree (DIT)

    +   - number of children (NOC)

    +   - coupling between object classes (CBO)

