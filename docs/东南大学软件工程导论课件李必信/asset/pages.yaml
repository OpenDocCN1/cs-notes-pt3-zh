  md: '# 2 设计过程和设计质量


    +   ◆ 软件设计是一个迭代的过程，通过设计过程，需求被变换为用于构建软件的“蓝图”【体系结构设计/概要设计、接口设计】。

    +   ◆ 随着设计迭代的推进，后续的精化导致更低抽象层次的设计表示【构件级设计/详细设计、接口设计】。

    +   ◆ 正式的技术评审（technical review）和设计走查（walkthrough）可用于评估设计演化的质量。'
  merge: -1
