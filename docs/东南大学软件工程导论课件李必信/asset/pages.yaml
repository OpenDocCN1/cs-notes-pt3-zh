- pgno: 217
  md: '# 8.8 Behavioral Modeling


    +   - The behavioral model indicates **how software will respond to external events
    or stimuli**. To create the model, the analyst must perform the following steps:

    +     - Evaluate all use-cases to **fully understand the sequence of interaction**
    within the system.

    +     - Identify events that **drive the interaction sequence** and **understand
    how these events relate to specific objects**.

    +     - Create a **sequence diagram** for each use-case.

    +     - Build a **state diagram** for the system.

    +     - Review the behavioral model **to verify accuracy and consistency**.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# State Representations


    +   - In the context of behavioral modeling, two different characterizations of
    states must be considered:

    +     - the state of each class when the system performs its function and

    +     - the state of the system when observed from the outside as the system performs
    its function

    +   - The state of a class takes on both passive and active characteristics [CHA93].

    +     - A passive state[纯态] is simply the current status of all of an object''s
    attributes.

    +     - The active state[活跃态] of an object indicates the current status of the
    object as it undergoes a continuing transformation or processing.'
  merge: -1
