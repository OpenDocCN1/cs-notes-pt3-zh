- pgno: 381
  md: '# Earned Value Analysis (EVA)


    +   - **Earned value**

    +     - is a measure of progress

    +     - enables us to assess the “percent of completeness” of a project using
    quantitative analysis rather than rely on a gut feeling

    +     - “provides accurate and reliable readings of performance from as early
    as 15 percent into the project.” [FLE98]'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Computing Earned Value


    +   - The *budgeted cost of work scheduled* (BCWS) is determined for each work
    task represented in the schedule.

    +     - BCWSᵢ is the effort planned for work task *i*.

    +     - To determine progress at a given point along the project schedule, the
    value of BCWS is the sum of the BCWSᵢ values for all work tasks that should have
    been completed by that point in time on the project schedule.

    +   - The BCWS values for all work tasks are summed to derive the *budget at completion*,
    BAC. Hence,

    +     - BAC = Σ (BCWSₖ) for all tasks *k*'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# Computing Earned Value...


    +   - Next, the value for *budgeted cost of work performed* (BCWP) is computed.

    +     - The value for BCWP is the sum of the BCWS values for all work tasks that
    have actually been completed by a point in time on the project schedule.

    +   - “the distinction between the BCWS and the BCWP is that the former represents
    the budget of the activities that were planned to be completed and the latter
    represents the budget of the activities that actually were completed.” [WIL99]

    +   - Given values for BCWS, BAC, and BCWP, important progress indicators can
    be computed:

    +     - Schedule performance index, SPI = BCWP/BCWS

    +     - Schedule variance, SV = BCWP − BCWS

    +     - SPI is an indication of the efficiency with which the project is utilizing
    scheduled resources.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Computing Earned Value...


    +   - Percent scheduled for completion = BCWS/BAC

    +     - provides an indication of the percentage of work that should have been
    completed by time t.

    +   - Percent complete = BCWP/BAC

    +     - provides a quantitative indication of the percent of completeness of the
    project at a given point in time, t.

    +   - Actual cost of work performed, ACWP, is the sum of the effort actually expended
    on work tasks that have been completed by a point in time on the project schedule.
    It is then possible to compute

    +     - Cost performance index, CPI = BCWP/ACWP

    +     - Cost variance, CV = BCWP – ACWP'
  merge: -1
