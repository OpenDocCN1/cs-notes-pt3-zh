- pgno: 170
  md: '# Rules of Thumb [经验原则]


    +   - The model should focus on requirements that are visible within the problem
    or business domain. The level of abstraction should be relatively high.

    +   - Each element of the analysis model should add to an overall understanding
    of software requirements and provide insight into the information domain, function
    and behavior of the system.

    +   - Delay consideration of infrastructure and other non-functional models until
    design.

    +   - Minimize coupling throughout the system.

    +   - Be certain that the analysis model provides value to all stakeholders.

    +   - Keep the model as simple as it can be.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Domain Analysis


    Software domain analysis is the identification, analysis, and specification of
    common requirements from a specific application domain, typically for reuse on
    multiple projects within that application domain . . .


    [Object-oriented domain analysis is] the identification, analysis, and specification
    of common, reusable capabilities within a specific application domain, in terms
    of common objects, classes, subassemblies, and frameworks . . .


    Donald Firesmith'
