- pgno: 224
  md: '# 1 概述


    +   - 与分析模型不同：设计模型提供了软件的**数据结构（data structure）**、**体系结构（architecture）**、**接口（interface）**和**构件（component）**的细节，而这些都是实现系统所必须的。

    +   - 设计可以采用很多不同的方法描绘软件。**首先**，设计必须体现系统或产品的体系结构；**其次**，为各类接口建模；**最后**，设计用于构建系统的软件构件。

    +   - 软件设计是**建模活动**的最后一个软件工程活动，接着便要进入构造阶段（生成代码和测试）。'
  merge: -1
  img_proc: true
