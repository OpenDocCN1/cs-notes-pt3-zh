- pgno: 41
  md: '# Software Evolution[Lehman定律]


    +   - **The Law of Continuing Change [持续变化规律] (1974)**: E-type systems must be
    continually adapted else they become progressively less satisfactory.

    +   - **The Law of Increasing Complexity [复杂性增长规律] (1974)**: As an E-type system
    evolves its complexity increases unless work is done to maintain or reduce it.

    +   - **The Law of Self Regulation [自我调控规律] (1974)**: The E-type system evolution
    process is self-regulating with distribution of product and process measures close
    to normal.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Software Evolution…


    +   - **The Law of Conservation of Organizational Stability [组织稳定性守恒规律] (1980)**:
    The average effective global activity rate in an evolving E-type system is invariant
    over product lifetime.

    +   - **The Law of Conservation of Familiarity [保证通晓性规律] (1980)**: As an E-type
    system evolves all associated with it, developers, sales personnel, users, for
    example, must maintain mastery of its content and behavior to achieve satisfactory
    evolution.

    +   - **The Law of Continuing Growth [持续增长规律] (1980)**: The functional content
    of E-type systems must be continually increased to maintain user satisfaction
    over their lifetime.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Software Evolution…


    +   - **The Law of Declining Quality [质量衰减规律] (1996)**: The quality of E-type
    systems will appear to be declining unless they are rigorously maintained and
    adapted to operational environment changes.

    +   - **The Feedback System Law [反馈系统规律] (1996)**: E-type evolution processes
    constitute multi-level, multi-loop, multi-agent feedback systems and must be treated
    as such to achieve significant improvement over any reasonable base.


    Source: Lehman, M., et al, “Metrics and Laws of Software Evolution—The Nineties
    View,” Proceedings of the 4th International Software Metrics Symposium (METRICS
    ’97), IEEE, 1997, can be downloaded from http://www.ece.utexas.edu/~perry/work/papers/feast1.pdf'
  merge: -1
  img_proc: true
