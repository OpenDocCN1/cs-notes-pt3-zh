- pgno: 481
  md: "# 步骤\n\n+   ① 分析程序规格说明的描述中，哪些是原因，哪些是结果。原因常常是输入条件或是输入条件的等价类。而结果是输出条件。\n+   \n\
    +   ② 分析程序规格说明的描述中语义的内容，并将其表示成连接各个原因与各个结果的“因果图”。"
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 步骤...


    +   ③由于语法或环境的限制，有些原因和结果的组合情况是不可能出现的。为表明这些特定的情况，在因果图上使用若干个特殊的符号标明约束条件。


    +   ④把因果图转换成判定表。


    +   ⑤把判定表中每一列表示的情况写成测试用例。'
  merge: -1
  img_proc: true
