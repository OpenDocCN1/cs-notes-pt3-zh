  md: '# 4.2 软件生产


    +   - 软件生产(大系统)

    +     - 标准化：建模（UML）、语言（Java）、过程（RUP）、方法（OOA/OOD, AOP）

    +     - 智能化、自动化：形式化方法（Z， Refinement Calculus）

    +     - 规模化、批量化：软件重用技术、构件构架技术、SPL（Software Product Line）技术

    +   - 软件生产(小系统)

    +     - 快捷化：敏捷开发（XP）'
