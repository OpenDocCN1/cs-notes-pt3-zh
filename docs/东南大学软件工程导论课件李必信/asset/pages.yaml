- pgno: 551
  md: '# Operating Systems (OS)


    Parallel at the development of computer languages, Operating Systems (OS) were
    developed. These were needed because to create programs and having to write all
    machine specific instructions over and over again was a "waste of time" job.'
  merge: -1
  img_proc: true
- pgno: 552
  md: '+   - So by introducing the OS ''principle'' almost all input and output tasks
    were taken over by the OS. Such as:

    +     - writing data to and from memory,

    +     - saving data on disks,

    +     - writing data to screens and printers,

    +     - starting tapes,

    +     - refreshing memory,

    +     - scheduling specific tasks

    +     - etcetera.'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# Interpreters and Compilers


    +   - An **interpreter** is a computer language that execute instructions that
    are written in the form of a program. The trick of an interpreter is that it loads
    the source code and translates the instruction into executable machine language
    **line by line**. And it does it over and over again any time that program is
    run.

    +   - In short a **COMPILER** is: the translator of the source code into computer
    language.'
  merge: -1
  img_proc: true
