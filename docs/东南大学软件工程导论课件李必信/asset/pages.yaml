- pgno: 541
  md: '# 1.2.2 Enter the Information Age


    # Machine Language


    +   - First programming was done by typing in 1''s or 0''s that were stored on
    different information carriers.

    +   - By storing these 0''s and 1''s on a carrier (first used by [Karl Suze''s
    X1](#) in [1938](#)) it was possible to have the computer read the data on any
    later time. But mistyping a single zero or one meant a disaster because all coding
    (instructions) should absolutely be on the right place and in the right order
    in memory. This technology was called [absolute addressing](#).

    +   - An example: 1010010101110101011'
  merge: -1
  img_proc: true
- pgno: 542
  md: '+   - In the early 50''s programmers started to let the machines do a part
    of the job. This was called **_automatic coding_** and made live a lot easier
    for the early programmers.

    +   - Soon the next step was to have the program to select the proper memory address
    instead of using absolute addressing.

    +   - The next development was to **_combine groups of instruction into so called
    words and abbreviations_** were thought up called: **opcodes** (Hopper 1948)'
  merge: -1
  img_proc: true
- pgno: 543
  md: '# Assembly language


    +   Opcode works like a shorthand and represents as said a group of machine instructions.
    The opcode is translated by another program into zero''s and one''s, something
    a machine could translate into instructions.


    +   But the relation is still one to one: one code to one single instruction.
    However very basically this is already a programming language. It was called:
    assembly language.


    ```

    A:=B+C

    movl B, d0;  move long-word B into register d0

    addl C, d0;  add

    movl d0, A;  and store

    ```'
  merge: -1
  img_proc: true
- pgno: 544
  md: '# ■ **Subroutines**


    +   - Soon after developing machine languages and the first crude（粗糙的）programming
    languages began to appear, the danger of inextricable（无法解脱的）and thus unreadable
    coding became apparent. Later this messy（凌乱的）programming was called: “spaghetti（意大利面条式的）code”.


    +   - One important step in unraveling or preventing spaghetti code was **the
    development of subroutines**.'
  merge: -1
  img_proc: true
- pgno: 545
  md: '+   ▪ And it needed Maurice Wilkes, when realizing that "a good part of the
    remainder of his life was going to be spent in finding errors in ... programs",
    to develop the concept of subroutines in programs to create reusable modules.
    Together with Stanley Gill and David Wheeler he produced the first textbook on
    "The Preparation of Programs for an Electronic Digital Computer".


    +   ▪ **The formalized concept of software development** (not named so for another
    decade) **had its beginning in 1951.**


    +   ▪ Below is an example of how subroutines would work'
