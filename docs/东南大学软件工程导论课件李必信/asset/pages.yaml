- pgno: 251
  md: '# 5 Design Principles


    +   ① The design process **should not suffer from** ‘tunnel vision[视野狭隘].’

    +   ② The design **should be traceable to** the analysis model.

    +   ③ The design **should not reinvent** the wheel.

    +   ④ The design **should “minimize the intellectual distance[理解差异]”** between
    the software and the problem as it exists in the real world.

    +   ⑤ The design **should exhibit** uniformity and integration.

    +   ⑥ The design **should be structured to** accommodate change.

    +   ⑦ The design **should be structured to** degrade gently, even when aberrant
    data, events, or operating conditions are encountered.

    +   ⑧ **Design is not coding, coding is not design.**

    +   ⑨ The design **should be assessed** for quality as it is being created, not
    after the fact.

    +   ⑩ The design **should be reviewed to** minimize conceptual (semantic) errors.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 6 Design and Quality


    +   - the design must implement all of the explicit requirements contained in
    the analysis model, and it must accommodate all of the implicit requirements desired
    by the customer.

    +   - the design must be a readable, understandable guide for those who generate
    code and for those who test and subsequently support the software.

    +   - the design should provide a complete picture of the software, addressing
    the data, functional, and behavioral domains from an implementation perspective.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Quality Guidelines


    +   - A design **should exhibit** an architecture that (1) has been created using
    recognizable architectural styles or patterns, (2) is composed of components that
    exhibit good design characteristics and (3) can be implemented in an evolutionary
    fashion

    +     - For smaller systems, design can sometimes be developed linearly.

    +   - A design **should be** modular; that is, the software should be logically
    partitioned into elements or subsystems

    +   - A design **should contain** distinct representations of data, architecture,
    interfaces, and components.

    +   - A design **should lead to** data structures that are appropriate for the
    classes to be implemented and are drawn from recognizable data patterns.

    +   - A design **should lead to** components that exhibit independent functional
    characteristics.

    +   - A design **should lead to** interfaces that reduce the complexity of connections
    between components and with the external environment.

    +   - A design **should be** derived using a repeatable method that is driven
    by information obtained during software requirements analysis.

    +   - A design **should be** represented using a notation that effectively communicates
    its meaning.'
  merge: -1
  img_proc: true
