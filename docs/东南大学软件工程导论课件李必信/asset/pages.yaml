- pgno: 342
  md: '# Organizational Paradigms


    +   - **Closed paradigm**—structures a team along a traditional hierarchy of authority

    +   - **Random paradigm**—structures a team loosely and depends on individual
    initiative [主动性] of the team members

    +   - **Open paradigm**—attempts to structure a team in a manner that achieves
    some of the controls associated with the closed paradigm but also much of the
    innovation that occurs when using the random paradigm

    +   - **Synchronous paradigm**—relies on the natural compartmentalization of a
    problem and organizes team members to work on pieces of the problem with little
    active communication among themselves


    suggested by Constantine [CON93]'
