  md: '# Evolutionary Models: Prototyping


    +   - A prototyping paradigm is the best-fit for the following situations.

    +     - A customer does not identify detailed requirements for SW.

    +     - SW engineers are not sure of the efficiency of an algorithm, usability
    of SW, and so on.


    +   - In other words, prototyping paradigm helps SW engineers and the customers
    to understand what is to be built.


    +   - The quick design and implementation focuses on a representation of those
    aspects of the SW that will be visible to the customer.

    +     - Ideally, the prototype serves as a mechanism for identifying SW requirements.'
