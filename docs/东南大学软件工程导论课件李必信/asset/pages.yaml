- pgno: 507
  md: '# 2.2.2 判定覆盖


    +   程序中每个判定的取真分支和取假分支至少执行一次（也称分支覆盖）


    A=2，B=0，X=3 时，a、c、e 及 A=1，B=0，X=1 时，a、b、d


    或


    A=3，B=0，X=3 时，a、c、d 及 A=2，B=1，X=1 时，a、b、e'
