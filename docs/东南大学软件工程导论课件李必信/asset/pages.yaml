- pgno: 462
  md: '# 有效等价类和无效等价类


    +   - 在考虑等价类时，应该注意区别两种不同的情况：

    +   - **有效等价类**：有效等价类指的是对程序的规格说明是有意义的、合理的输入数据所构成的集合。在具体问题中，有效等价类可以有一个，也可以是多个。

    +   - **无效等价类**：无效等价类指对程序的规格说明是不合理的或无意义的输入数据所构成的集合。对于具体的问题，无效等价类至少应有一个，也可能有多个。'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# 确定等价类原则


    1．如果输入条件规定了取值范围或值的个数，则可确定一个有效等价类和两个无效等价类。


    +   - 输入条件：…项数可以从1到999…

    +     - 有效等价类为 “1 ≤ 项数 ≤ 999”

    +     - 无效等价类为 “项数<1” 及 “项数>999”

    +   - 值的个数 “学生选课允许2门至4门”

    +     - 有效等价类：选课2至4门

    +     - 无效等价类：只选一门课或未选课

    +     - 选课超过4门'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# 确定等价类原则


    2．输入条件规定了输入值的集合，或是规定了“必须如何”的条件，则可确定一个有效等价类和一个无效等价类。


    例：


    | 条件 | 有效等价类 | 无效等价类 |

    |---|---|---|

    | “必须如何” |  |  |

    | “标识符以字母开头” | 以字母开头的字符串 | 以非字母开头的字符串 |


    3．如果确知，已划分的等价类中各元素在程序中的处理方式是不同的，则应将此等价类进一步划小。'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# 确定测试用例（原则）


    +   1. 设计一个测试用例，使其尽可能多地覆盖有效等价类，重复这一步，最终使得所有有效等价类均被覆盖。

    +   2. 设计一个测试用例，使其只覆盖一个无效等价类，重复这一步，最终使得所有无效等价类均被覆盖。'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# 一个例子


    +   - FORTRAN编译系统的DIMENSION语句的语法规则：

    +     DIMENSION语句可以用来规定数组的维数，其形式为：

    +     DIMENSION ad[,ad]...

    +   - 其中ad 为数组描述符，形式为n(d[,d]...)

    +     其中n为数组名，由1个到6个字母或数字组成，为首的必须是字母；d是维数说明符，数组维数最大为7最小为1，形式为：[lb:]ub, lb和ub分别表示数字下标的下界和上界，均为-65534
    - 65535之间的整数，也可以是整型变量名(但不可以是数组元素名)。若未规定lb，则其值认为为1，且 ub>=lb。若已规定lb，则它可以为负数、零、正数。

    +   - DIMENSION语句可写多行。'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# FORTRAN语言的DIMENSION语句


