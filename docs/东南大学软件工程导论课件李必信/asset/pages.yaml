  md: '# Design by Contract


    +   - The relationship between a class and its clients can be viewed as a formal
    agreement, expressing each party’s rights and obligations.

    +   - Consider the following list operation:


    +   - `public Item remove(int index)`

    +     - `requires` the specified index is in range ( `0 ≤ index < size()` )

    +     - `ensures` the element at the specified position in this list is removed,
