- pgno: 555
  md: '# Enter "OOP"


    +   - This is about rewriting routines and programming functionality over and
    over again for each different part of a program and for each new program again
    and again.

    +   - There was a need for **common shared parts** that acted on instructions
    like a black box. So after some years formal development of software was on its
    way, it was strongly felt that **portability was one thing but reusability was
    another.**

    +   - And history repeats itself: what was written about the subroutines above
    is also true for this idea of black boxes.'
