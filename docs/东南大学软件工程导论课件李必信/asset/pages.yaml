- pgno: 368
  md: '# Estimation for Agile Projects


    +   - Each user scenario (a mini-use-case) is considered separately for estimation
    purposes.

    +   - The scenario is decomposed into the set of software engineering tasks that
    will be required to develop it.

    +   - Each task is estimated separately. Note: estimation can be based on historical
    data, an empirical model, or “experience.”

    +     - Alternatively, the ‘volume’ of the scenario can be estimated in LOC, FP
    or some other volume-oriented measure (e.g., use-case count).

    +   - Estimates for each task are summed to create an estimate for the scenario.

    +     - Alternatively, the volume estimate for the scenario is translated into
    effort using historical data.

    +   - The effort estimates for all scenarios that are to be implemented for a
    given software increment are summed to develop the effort estimate for the increment.'
  merge: -1
  img_proc: true
