    # 决策表方法原理


    对功率大于100马力的机器、维修记录不全或已运行10年以上的机器，应给予优先的维修处理。


    - 条件1：机器功率大小

    - 条件2：维修记录

    - 条件3：运行时间


    动作1：机器能否得到优先维修


    # 黑盒测试方法——决策表


    # 决策表组成


    4种成分


    - 条件桩：列出所有可能问题（条件）

    - 条件项：列出条件所有可能取值

    - 动作桩：列出可能采取的操作

    - 动作项：指出在条件项的各种取值情况下应采取的动作


    决策规则：贯穿条件项和动作项的一列


    # 黑盒测试方法——决策表


    # 决策表构造


    - Step1: 列出所有的条件桩和动作桩

    - Step2: 填入条件项

    - Step3: 填入动作项，得到初始决策表

    - Step4：简化决策表，合并相似规则


    规则可能总数：2ⁿ


