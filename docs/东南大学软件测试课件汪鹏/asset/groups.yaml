    \ into Action：默认或“New...”新建Action\n\n注：不同的协议类型此窗口不同\n\n## Vuser Script录制流程\n\n\
    - 创建脚本\n- 选择协议\n- 设置录制选项\n- 开始录制\n- 插入命令\n- 停止录制\n\n### 脚本组成：\n\n1. vuser_init:\n\
    Vuser启动时执行一次（例：登录服务器）\n\n2. Action:\n可反复迭代执行多次；可以创建多个Action\n\n3. vuser_end:\n\
    Vuser退出时执行一次（例：记录注销）\n\n### 脚本语法：C语言\n\n## Vuser Script录制流程\n\n- 创建脚本\n- 选择协议\n\
