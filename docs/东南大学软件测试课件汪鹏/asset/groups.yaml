    \n## Vuser Script录制流程\n\n### HTML-based script:\n\n每次用户请求生成单独的函数\n\n特点：直观、易于理解和维护\n\
    \n```\nweb_url(\"MercuryWebTours\",\n    \"URL=http://localhost/MercuryWebTours/\"\
    ,\n    \"Resource=0\",\n    \"RecContentType=text/html\",\n    \"Referer=\",\n\
    \    \"Snapshot=t1.inf\",\n    \"Mode=HTML\",\n    LAST);\n\nlr_think_time(90000);\n\
    web_submit_form(\"login.pl\",\n    \"Snapshot=t2.inf\",\n    ITEMDATA,\n    \"\
    Name=username\", \"Value=test\", ENDITEM,\n    \"Name=password\", \"Value=test\"\
    , ENDITEM,\n    \"Name=login.x\", \"Value=54\", ENDITEM,\n    \"Name=login.y\"\
    , \"Value=9\", ENDITEM,\n    LAST);\n```\n\n## ■ Vuser Script录制流程\n\n### URL-based\
    \ script:\n\n捕获所有由用户产生的HTTP请求\n\n特点：详细、伸缩性强\n\n```\nweb_url(\"MercuryWebTours\"\
    ,\n        \"URL=http://localhost/MercuryWebTours/\",\n        \"Resource=0\"\
    ,\n        \"RecContentType=text/html\",\n        \"Referer=\",\n        \"Snapshot=t1.inf\"\
    ,\n        \"Mode=HTTP\",\n        LAST);\n\nweb_concurrent_start(NULL);\n\nweb_url(\"\
    header.html\",\n        \"URL=http://localhost/MercuryWebTours/header.html\",\n\
    \        \"Resource=0\",\n        \"RecContentType=text/html\",\n        \"Referer=http://localhost/MercuryWebTours/\"\
    ,\n        \"Snapshot=t2.inf\",\n        \"Mode=HTTP\",\n        LAST);\n```\n\
    \n## Vuser Script录制流程\n\n- 创建脚本\n- 选择协议\n- 设置录制选项\n- 开始录制\n- 插入命令\n- 停止录制\n\n\
    ![](img/88f667f5480db09ef600e4e177b09268_568_0.png)\n![](img/88f667f5480db09ef600e4e177b09268_568_1.png)\n\
