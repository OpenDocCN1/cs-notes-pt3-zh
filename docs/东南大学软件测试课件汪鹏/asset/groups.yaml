    ### 软件测试工程师一天的生活！


    ![](img/88f667f5480db09ef600e4e177b09268_92_0.png)


    ### 软件测试环境


    测试环境 = 软件 + 硬件 + 网络


    **测试环境要点：**


    - 1. 真实

    - 2. 干净

    - 3. 无毒

    - 4. 独立


    **测试环境分类：**


    - 1. 软件开发环境：包括开发工具和平台

    - 2. 软件运行环境：最终用户使用的环境


    ### 软件测试的类型


    **视角1：测试技术（代码是否可见的通用划分）**


    - 1. 白盒测试

    - 2. 黑盒测试

    - 3. 灰盒测试


    白盒测试：基于软件代码的内部逻辑来设计测试用例。测试退出条件是代码覆盖率。一般由开发人员完成。


    黑盒测试：基于需求和功能性，不需要了解内部的设计和代码，通过软件外部表现来发现缺陷和错误。


    灰盒测试：介于白盒测试与黑盒测试之间的技术，既关注软件外部表现，又注意程序内部逻辑结构。


    ![](img/88f667f5480db09ef600e4e177b09268_96_0.png)


    - Tests based on spec

    - Test covers as much specified behavior as possible

    - Tests based on code

    - Test covers as much implemented behavior as possible


    **视角2：开发阶段/Test Level**


    - 1. 单元测试

    - 2. 集成测试

    - 3. 系统测试

    - 4. 性能测试

    - 5. 确认测试

    - 6. 验收测试

    - 7. 回归测试


    系统测试：测试整个系统的行为和错误属性。


    性能测试：评价系统响应时间、吞吐率等系统属性，并与不同版本或竞争产品进行比较。


    确认测试：验证软件是否可以按照用户合理的期望方式工作。


    验收测试：保证客户对所有的需求都满意（α测试和β测试）。


    回归测试：保证增强型或改正型修改使软件正常运行，不影响已有功能。


    **视角3：执行状态**


    - 1. 静态测试

    - 2. 动态测试


    静态测试：不运行程序，而通过人工对程序和文档进行分析与检查。


    动态测试：通过人工或利用工具运行程序进行检查，分析程序执行状态和外部表现。


    **视角4：执行主体**


    - 1. 开发方测试

    - 2. 用户测试

    - 3. 第三方测试


    开发方测试：开发方通过检测和提供证据，证实软件是否满足规定的需求。验证测试或α测试。


    用户测试：用户通过运行和使用软件，检测与核实软件实现是否符合自己预期要求。β测试。


    第三方测试：介于软件开发方和用户之间的测试组织进行的测试活动。


    **视角5：特殊测试/Objectives of Testing**


    - 1. 国际化测试

    - 2. 即兴测试

    - 3. 兼容性测试

    - 4. 安全性测试

    - 5. 可用性与易获得性测试

    - 6. 面向对象系统测试

    - 7. Web测试


    国际化测试：保证全球化软件产品符合不同国家的语言和使用习惯。


    即兴测试、随机测试、探索式测试：通过直觉和经验，不采用任何形式化的测试。


    针对有经验的工程师。


