  md: "\n## 黑盒测试方法——正交数组测试\n\n### 正交数组测试原理\n\n| A | B | C |\n|---|---|---|\n| A₁ |\
    \ B₁ | C₁ |\n| A₁ | B₂ | C₂ |\n| A₁ | B₃ | C₃ |\n| A₂ | B₁ | C₂ |\n| A₂ | B₃ |\
    \ C₁ |\n| A₂ | B₂ | C₃ |\n| A₃ | B₁ | C₃ |\n| A₃ | B₂ | C₁ |\n| A₃ | B₃ | C₂ |\n\
    \n- A₁ 取值出现次数：3\n- A₂ 取值出现次数：3\n- A₃ 取值出现次数：3\n\n- B₁ 取值出现次数：3\n- B₂ 取值出现次数：3\n\
    - B₃ 取值出现次数：3\n\n- C₁ 取值出现次数：3\n- C₂ 取值出现次数：3\n- C₃ 取值出现次数：3\n\n特点2：所有可能取值出现次数都相同，保证样本选择公正\n\
    \n### 正交表\n\n#### 一、正交表构成\n\n- 因子：影响结果的条件因素（输入参数）\n- 因子数（Factors）：正交表中的列数，即要测试的功能点数\n\
    - 水平：因子的取值（输入取值）\n- 水平数（Levels）：单个因子的取值个数\n- 行数（Runs）：正交表行数，即测试用例个数\n\n#### 二、正交表的形式和记法\n\
    \n记法：L行数（水平数^因子数）\n\n![](img/88f667f5480db09ef600e4e177b09268_312_0.png)\n\n####\
    \ 三、正交表的获取\n\n**获取途径：**\n\n- 查表\n- 软件辅助构造\n\nhttp://www.york.ac.uk/depts/maths/tables/orthogonal.htm\n\
    \nhttp://support.sas.com/techsup/technote/ts723_Designs.txt\n\nTaguchi Designs\
    \ 正交表，包含行因子编号与列因子编号的设计矩阵。\n\n![](img/88f667f5480db09ef600e4e177b09268_314_0.png)\n\
    \n#### 四、正交表的正交性\n\n**整齐可比性：** 在同一张正交表中，每个因子的每个水平出现的次数是完全相同的。每个因子的每个水平与其它因子的每个水平参与试验的机率是完全相同的，这就保证在各个水平中最大程度排除了其它因子水平的干扰。\n\
    \n| A | B | C |\n|---|---|---|\n| A₁ | B₁ | C₁ |\n| A₁ | B₂ | C₂ |\n| A₁ | B₃\
    \ | C₃ |\n| A₂ | B₁ | C₂ |\n| A₂ | B₃ | C₁ |\n| A₂ | B₂ | C₃ |\n| A₃ | B₁ | C₃\
    \ |\n| A₃ | B₂ | C₁ |\n| A₃ | B₃ | C₂ |\n\n- A₁ 取值出现次数：3\n- A₂ 取值出现次数：3\n- A₃\
    \ 取值出现次数：3\n\n- B₁ 取值出现次数：3\n- B₂ 取值出现次数：3\n- B₃ 取值出现次数：3\n\n- C₁ 取值出现次数：3\n-\
    \ C₂ 取值出现次数：3\n- C₃ 取值出现次数：3\n\n**均衡分散性：** 在同一张正交表中，任意两列（两个因子）的水平搭配（横向形成的数字对）是完全相同的。这样就保证了试验条件均衡地分散在因子水平的完全组合之中，因而具有很强的代表性，容易得到好的试验条件。\n\
    \n**A和B的取值组合**\n\n| A | B | C |\n|---|---|---|\n| A₁ | B₁ | C₁ |\n| A₁ | B₂ |\
    \ C₂ |\n| A₁ | B₃ | C₃ |\n| A₂ | B₁ | C₂ |\n| A₂ | B₃ | C₁ |\n| A₂ | B₂ | C₃ |\n\
    | A₃ | B₁ | C₃ |\n| A₃ | B₂ | C₁ |\n| A₃ | B₃ | C₂ |\n\n**A和C的取值组合**\n\n| A |\
    \ B | C |\n|---|---|---|\n| A₁ | B₁ | C₁ |\n| A₁ | B₂ | C₂ |\n| A₁ | B₃ | C₃ |\n\
    | A₂ | B₁ | C₂ |\n| A₂ | B₃ | C₁ |\n| A₂ | B₂ | C₃ |\n| A₃ | B₁ | C₃ |\n| A₃ |\
    \ B₂ | C₁ |\n| A₃ | B₃ | C₂ |\n\n**B和C的取值组合**\n\n| A | B | C |\n|---|---|---|\n\
    | A₁ | B₁ | C₁ |\n| A₁ | B₂ | C₂ |\n| A₁ | B₃ | C₃ |\n| A₂ | B₁ | C₂ |\n| A₂ |\
    \ B₃ | C₁ |\n| A₂ | B₂ | C₃ |\n| A₃ | B₁ | C₃ |\n| A₃ | B₂ | C₁ |\n| A₃ | B₃ |\
    \ C₂ |\n\n### 正交数组测试步骤\n\n#### Step1：确定因子和水平\n\n有哪些因子？\n\n因子数是多少？\n\n每个因子有哪些取值？\n\
    \n其水平数是多少？\n\n#### Step2：判断是否能使用正交数组\n\n- 因子的个数少，如只有2个（不使用）\n- 因子的个数较多（不使用）\n\n\
    #### Step3：选择合适的正交表\n\n根据因子数和水平数，选择测试次数最少的正交表。\n\n#### Step4：把变量值映射到表中\n\n填入输入变量的取值。\n\
    \n#### Step5：正交测试用例构造\n\n每一行对应一个测试用例。\n\n#### Step6：补充测试用例\n\n根据需求规则说明书，增加一些正交表没有覆盖但需要测试的用例。\n\
    \n### 正交表选择原则\n\n- 正交表因子数 >= 实际因子数\n- 正交表每个水平数 >= 实际每个水平数\n- 如果出现 2 个或 2 个以上正交表符合以上条件，则选择行数最少的正交表\n\
    \n选取了正交表后，删除正交表中多余的因子列，原则是删除靠后的列。\n\n**因子的水平数不同？**\n\n采用包含和组合的方法选择合适正交表：取水平数大于最大水平数、因子数大于因子总数的正交表。\n\
    \n例：在 4 个因子中：1 个因子 4 水平，3 个因子 3 水平，选 L₁₆(4⁵)\n\n### 正交数组测试练习1——查询功能\n\n某软件查询功能的界面如下。\n\
    \n查询时可根据**姓名**、**身份证**和**手机号码**。\n\n![](img/88f667f5480db09ef600e4e177b09268_324_0.png)\n\
    \n#### 1. 确定因子和水平\n\n**因子数和水平数：**\n\n三个因子：\n\n- 姓名\n- 身份证号\n- 手机号码\n\n每个因子都有两个水平：\n\
    \n- 姓名：填、不填\n- 身份证号：填、不填\n- 手机号码：填、不填\n\n#### 2. 选择正交表\n\n- 因子数 >= 3\n- 因子的水平数\
    \ >= 2\n- 行数取最小的正交表\n\n结果：L₄(2³)\n\n#### 3. 变量值映射\n\n| 行号 | 列号1 | 列号2 | 列号3 |\n\
    |---|---|---|---|\n| 1 | 0 | 0 | 0 |\n| 2 | 0 | 1 | 1 |\n| 3 | 1 | 0 | 1 |\n|\
    \ 4 | 1 | 1 | 0 |\n\n| 行号 | 姓名 | 身份证号 | 手机号码 |\n|---|---|---|---|\n| 1 | 填 | 填\
    \ | 填 |\n| 2 | 填 | 不填 | 不填 |\n| 3 | 不填 | 填 | 不填 |\n| 4 | 不填 | 不填 | 填 |\n\n####\
    \ 4. 正交测试用例构造和补充\n\n**测试用例**\n\n1. 填姓名　填身份证号　填手机号\n2. 填姓名　不填身份证号　不填手机号\n3. 不填姓名　填身份证号　不填手机号\n\
    4. 不填姓名　不填身份证号　填手机号\n\n**增补测试用例**\n\n5. 不填姓名　不填身份证号　不填手机号\n\n测试用例从 8 降为 5。\n\n\
