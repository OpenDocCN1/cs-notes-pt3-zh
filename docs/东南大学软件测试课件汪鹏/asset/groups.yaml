    通过测试找到系统各项资源的最优分配原则。\n——强调资源优化配置\n\n## 性能测试基础——概念\n\n### 性能测试概念\n\n可靠性测试：\n\n\
    在给系统加载一定压力的情况下，使系统运行一段时间，以此检验系统是否稳定。\n\n——强调系统稳定性\n\n## 性能测试基础——应用领域\n\n### 性能测试应用\n\
    \n- 1. 系统性能瓶颈定位\n  最常见的应用\n\n- 2. 系统参数配置\n  寻找让系统表现最优的软、硬件配置参数\n\n- 3. 发现算法性能缺陷\n\
    \  针对多线程、同步并发算法\n\n## 性能测试基础——应用领域\n\n### 性能测试应用\n\n- 4. 系统验收测试\n  验证预期性能指标\n\n\
    - 5. 系统容量规划\n  测试不同硬件环境下的性能表现\n\n- 6. 产品评估/选型\n  全面评估产品，选择适合自己的产品类型\n\n## 性能测试基础——指标\n\
    \n### 性能指标\n\n- 1. 并发用户数量\n\n狭义并发: 所有用户在同一时刻做同样的操作\n\n广义并发: 多个用户同时进行操作，但这些操作可以相同，也可以不同\n\
    \n虚拟用户(Vuser): 模拟真实用户操作来使用软件\n\n## 性能测试基础——指标\n\n### 性能指标\n\n- 2. 响应时间\n\n场景(Scenario)：在一个性能测试期间依次发生并实现特定业务流程的事件总和\n\
    \n事务(Transaction)：用户业务流程\n\n思考时间(Think Time)：用户操作过程中两个请求的间隔时间\n\n- 3. 吞吐量\n\n\
    一次测试过程中网络上传输的数据总和\n\n吞吐率=吞吐量/传输时间\n\n## 性能测试基础——指标\n\n### 性能指标\n\n- 5. **TPS (Transaction\
    \ Per Second)**\n  每秒处理事务数\n\n- 6. **点击率 (Hit Per Second)**\n  每秒用户提交的 HTTP 请求数\n\
    \n- 7. **资源利用率**\n  CPU、磁盘、网络、数据库利用率\n\n## 性能测试基础——模型\n\n### 性能测试模型/策略\n\n- 1.\
    \ 预期指标性能测试：\n  针对需求和设计阶段提出的性能指标而进行的测试。\n  （性能测试基本要求）\n\n- 2. 独立业务性能测试：\n  核心业务模块是性能测试重点\n\
    \n- 3. 组合业务性能测试：\n  模拟多个用户，对多项业务进行组合性能测试（接近用户使用系统的真实情形）\n\n## 性能测试基础——模型\n\n###\
    \ 性能测试模型/策略\n\n- 4. 疲劳强度性能测试：\n  以一定负载长时间运行系统，测试系统长时间处理大量业务的能力和稳定性\n\n- 5. 大数据量性能测试：\n\
    \  测试运行时数据量较大或历史数据量较大时的性能情况\n\n- 6. 网络性能测试：\n  确认带宽、延迟、负载和端口变化对用户响应时间影响\n\n- 7.\
    \ 服务器性能测试：\n  确认数据库、Web服务器等瓶颈\n\n## 性能测试基础——原则\n\n### 性能测试原则\n\n成本最优原则：\n投入的测试成本能否使系统满足预先确定的性能目标\n\
    \n策略为中心原则：\n测试策略决定测试用例设计和测试实施\n\n适当裁剪原则：\n对测试用例包含的内容进行合理裁剪，既满足测试需求，也节约测试成本\n\n\
    模型完善原则：\n具体测试中对模型不断调整、补充、完善，使之满足测试目的\n\n## 性能测试——模型实例\n\n### Web MSN服务器端性能测试模型\n\
    \n在下列条件下，每台服务器内存消耗不超过20%，CPU平均值不超过30%：\n\n- 1. 10万用户在线；\n- 2. 10万用户中有1万在对话；\n\
    - 3. 10万用户中还有5千在改变状态或姓名\n- 4. 10万用户中还有5千在添加联系人\n\n## 性能测试——模型实例\n\n### Web MSN客户端性能测试模型\n\
    \n在下列条件下，客户机内存消耗不超过10%，CPU平均值不超过5%：\n\n- 1. 用户8小时在线；\n- 2. 用户每半小时对话1次；\n- 3. 用户每10分钟收到1个通知；\n\
    - 4. 用户每2小时改变1次状态；\n- 5. 用户每4小时添加1个联系人\n\n## 性能测试——工具\n\n### ■ 主要性能测试工具\n\n####\
    \ 商业：\n\n- **Loadrunner**　Rational Performance Tester\n- WebLoad\n\n#### 免费：\n\
    \n- Web Application Stress Tool\n- Application Center Test\n\n#### 开源：\n\n- OpenSTA　　**JMeter**\n\
    - Grinder\n\n自行开发（针对某一个具体的软件的一部分进行测试）\n\n## 性能测试——测试自动化\n\n### ## 自动化测试优点\n\n\
    - 1. 测试速度快\n- 2. 测试结果准确\n- 3. 高复用性\n- 4. 永不疲劳\n- 5. 可靠：\n  计算机不会弄虚作假\n- 6. 能力：\n\
    \  有些手工测试做不到的地方，自动化测试可以做到。例如，在性能测试中模拟1000个用户同时访问网站\n\n## 性能测试——测试自动化\n\n### 正确认识自动化测试\n\
    \n- 自动化测试有助于**提高软件开发效率、缩短开发周期、节省人力资源**等\n- 机器执行测试用例按部就班，**没有变通和创造力**\n- 人具有创造力，可以举一反三，从一个测试想到其它测试情景。\n\
    - 资料显示，**良好的自动化测试只能发现30%的问题，70%的问题还是由手工发现。**\n- 对于复杂的逻辑判断、界面是否友好手工测试具有优势\n- 自动化测试更适合于负载测试、性能测试和回归测试\n\
    \n## 性能测试——测试自动化\n\n### ■ 不同测试阶段中的自动化测试\n\n| 测试类型 | 自动化测试应用特点 |\n|---|---|\n|\
    \ 单元测试 | 静态测试和动态测试均可借助工具实现一定程度的自动化 |\n| 冒烟测试 | 自动化实现每日集成每日构建后的测试 |\n| 功能测试 | 基本操作和数据验证可以实现自动化测试\
    \ |\n| 负载测试<br>性能测试 | 一般只能由自动化测试工具完成 |\n| 回归测试 | 自动化测试最能发挥作用的地方，应尽量实现自动化 |\n|\
    \ 验收测试<br>确认测试 | 自动化测试和手工测试协同完成 |\n\n## 性能测试——测试自动化\n\n### 自动化测试原理\n\n![](img/88f667f5480db09ef600e4e177b09268_541_0.png)\n\
    \n## 性能测试——测试自动化\n\n### 自动化测试原理\n\n#### GUI对象识别：\n\n获得用户界面上对象的类别、名称、属性值\n\n常见GUI对象有：窗口、按钮、菜单、列表、编辑区域等\n\
    \n## 性能测试——测试自动化\n\nWindows对象识别：\n利用Windows API: FindWindow, GetWindowRect等\n\n\
    ![](img/88f667f5480db09ef600e4e177b09268_543_0.png)\n\n## 性能测试——测试自动化\n\n### 自动化测试原理\n\
    \nDOM对象识别：\n\nDOM (Document Object Model) 文档对象模型\n\n可以捕获Web页面上的各种对象\n\n其它对象技术：\n\
    \nC#/Java语言中的反射机制\n"
