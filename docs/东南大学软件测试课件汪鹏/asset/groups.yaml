  md: "\n## 回归测试基础\n\n## 回归测试概念\n\n## 回归测试过程\n\n- 1. 提出软件修改需求\n- 2. 进行软件修改\n- 3. 选择测试用例\n\
    \  获取正确的测试用例集\n- 4. 执行测试\n  通常以自动化方式执行大量测试用例\n\n## 回归测试基础\n\n## 回归测试概念\n\n回归测试过程\n\
    \n5.识别失败结果\n\n失败原因：测试用例错误？代码错误？\n\n6.识别错误\n\n精确定位哪些组件和哪些修改导致测试失败\n\n7.排除错误\n\n\
    错误的处理：修改、移除、忽略\n\n## 回归测试基础\n\n## 识别错误——组测试技术\n\n原理：一个模块可能单独工作正常，多个模块集成工作时却出现错误；组测试(Group\
    \ Testing)是寻找此类错误的有效方法；\n\n|   |   |   |   |   | 描述 |\n|---|---|---|---|---|---|\n\
    | A | B | C | D | E | 原先版本：所有测试用例全部通过 |\n| A₁ | B₁ | C₁ | D | E | 新版本：有几个测试用例失败\
    \ |\n| A₁ | B | C | D | E | 运行失败测试用例，只有A是新组件 |\n| A | B₁ | C | D | E | 运行失败测试用例，只有B是新组件\
    \ |\n| A | B | C₁ | D | E | 运行失败测试用例，只有B是新组件 |\n\n## 回归测试策略\n\n策略1：全部重新测试：重新执行之前所有测试用例\n\
    \n优点：不用进行测试用例选择\n\n缺点：不灵活（对系统微小改动就要全部重新测试）\n\n策略2：有选择地重新测试：选择和使用现有测试用例子集\n\n优点：灵活、实用与测试用例较多的情形\n\
    \n缺点：需要耗费精力选择测试用例\n\n## 回归测试中的波及效应\n\n波及效应是为了发现所有受影响部分和发现潜在的受影响部分，以保证软件发生改变后仍然保持一致性与完整性。\n\
    \n四种波及效应：\n\n- 1. 需求的波及效应\n- 2. 设计的波及效应\n- 3. 代码的波及效应\n- 4. 测试用例的波及效应\n\n## 回归测试中的波及效应\n\
    \n## 波及效应分析步骤：\n\n![](img/88f667f5480db09ef600e4e177b09268_502_0.png)\n\n## 回归测试中的波及效应\n\
    \n两种识别技术：\n- 1. 字符串匹配或交叉引用\n- 2. 程序切片(Program Slice)\n\n## 回归测试工具\n\n## QTP与回归测试\n\
    \nQuickTest Professional是著名的自动化测试工具，被广泛应用于软件功能测试和回归测试中\n\nQTP是早期WinRunner的替代品\n\
    \n## QTP9.2基础知识\n\n## QTP 9.2 安装\n\n- QTP 9.2支持的环境\n  - 操作系统： windows 2000, windows\
    \ XP, windows server 2003, windows Vista\n  - 浏览器： IE6, IE7, FireFox1.5/2.0, Netscape\
    \ 8.1.2\n  - Web页面\n  - 标准windows应用程序\n\n## QTP9.2基础知识\n\n## QTP 的运行原理\n\n- 通过查找应用程序界面中的各个控件的属性来判断是否与测试对象匹配，还可以根据控件的类型，把其拥有的可操作方法列举出来。\n\
    \n## QTP9.2基础知识\n\n## QTP的使用\n\n- 测试脚本录制和编辑\n- 测试脚本调试和运行\n- 分析测试结果\n\n## QTP9.2基础知识\n\
    \n- QTP的常用概念\n- 关键字视图/专家视图\n- 检查点\n- 参数化\n- 对象识别(Object Spy)\n- 关键字驱动/数据驱动\n\n\
    ## 参考文献\n\n- 1. Srinivasan Desikan, Gopalaswamy Ramesh, (韩柯, 李娜 译), 软件测试: 原理与实践,\
    \ p80-p104, 机械工业出版社\n- 2. 宫云战, 软件测试教程, p155-p206, 机械工业出版社\n- 3. Srinivasan Desikan,\
    \ Gopalaswamy Ramesh, (韩柯, 李娜 译), 软件测试: 原理与实践, p120-p130, 机械工业出版社\n- 4. 郁莲, 软件测试方法与实践,\
