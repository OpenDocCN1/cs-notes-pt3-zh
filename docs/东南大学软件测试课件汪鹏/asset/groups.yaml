    # 回归测试基础


    # 回归测试概念


    回归测试(Regression Testing)：


    定义1：回归测试是对之前已测试过、经过修改的程序进行的重新测试，以保证该修改没有引入新的错误或者由于更改而发现之前未发现的错误。


    定义2：回归测试要保证增强型或改正型修改使软件正常进行并且不影响已有的功能。'
  - '[PAGE 492]


