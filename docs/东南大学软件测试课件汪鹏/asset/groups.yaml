  mdcn: "\n\n## LoadRunner——基础知识\n\n- LoadRunner的概念解析\n- LoadRunner的工作原理\n- LoadRunner的使用\n\
    \  - 脚本录制与开发\n  - 场景创建与执行\n  - 测试结果分析\n\n## LoadRunner——支持协议\n### LoadRunner支持的协议\n\
    \n- **客户端/服务器：** MS SQL, ODBC, Oracle, DB2, Sybase, Sockets…\n- **自定义：** C, Visual\
    \ Basic, Java…\n- **分布式组件：** COM/DCOM, CORBA, RMI\n- **电子商务：** FTP, Palm, SOAP,\
    \ Web…\n- **ERP/CRM：** SAP, Oracle, PeopleSoft, Siebel…\n- **邮件服务：** IMAP, MS\
    \ Exchange, POP3, SMTP\n- **无线：** WAP, VoiceXML…\n\n![](img/88f667f5480db09ef600e4e177b09268_549_0.png)\n\
    \n## LoadRunner——架构\n### LoadRunner架构\n\n四个组成部分：\n\n- 1. **虚拟用户发生器（Vuser Generator，VuGen）**：捕获业务流程和创建自动化测试脚本，即自动生成大部分测试脚本。\n\
    - 2. **压力调度和监控中心（Controller）**：运行和监视测试脚本\n- 3. **压力产生器（Load Generator）**：产生虚拟客户端的请求，用来在服务器上创建负载。\n\
    - 4. **压力结果分析工具（Analysis）**：集成数据统计分析功能，自动生成测试报告文档\n\n## LoadRunner——工作原理\n###\
    \ LoadRunner 工作原理\n### LoadRunner 如何工作\n\n- 1. Controller 是一个中央控制台，用于管理和监控负载测试。\n\
    - 2. 成千上万的虚拟用户在系统上执行真实的事务，以模拟生产流量。\n- 3. 实时监视器捕获跨所有层级、服务器和网络资源的性能数据，并在 Controller\
    \ 上显示信息。\n- 4. 结果存储在数据库仓库中，使用户能够生成报告并进行分析。\n\n![](img/88f667f5480db09ef600e4e177b09268_552_0.png)\n\
    \n被测应用\n\nLoadRunner 控制器\n\n### LoadRunner内部结构\n\nLoadRunner 测试工作流程 1-22\n\n详见\
    \ LoadRunner 自带说明文档\n\n## LoadRunner——测试步骤\n### LoadRunner测试步骤\n\n![](img/88f667f5480db09ef600e4e177b09268_555_0.png)\n\
    \n- 1. 制定性能测试计划\n- 2. 录制并修改Vuser脚本（事务、参数化、关联）\n- 3. 方案场景描述测试活动中发生的各种事件（集合点）\n\
    - 4. 运行场景并实时监测\n- 5. 分析数据，生成性能评估报告\n\n## LoadRunner——部署和安装\n\n注意事项：\n\n- 1. LoadRunner对浏览器的支持：\n\
    \  - 8.x支持IE6，支持IE更高版本需要安装补丁FP4；\n  - 9.x支持IE7-8、Firefox，但不稳定\n- 2. 安装过程漫长，约20分钟\n\
    - 3. 练习中需要安装Samples\n- 4. 安装目录不支持中文\n\n![](img/88f667f5480db09ef600e4e177b09268_556_0.png)\n\
    \nMercury LoadRunner 8.0\n\nMercury LoadRunner\n\n更新 许可证 关于 支持 帮助 退出\n\n负载测试 诊断\
    \ 调优 新增功能\n\n- 创建/编辑脚本\n- 运行负载测试\n- 分析负载测试\n\n负载测试通过在新系统或升级部署之前检测瓶颈，避免生产环境中代价高昂且令人头疼的性能问题。通过在\
    \ QA 或预发布环境的 IT 系统上创建生产工作负载，您可以测量负载下关键业务流程的性能，并定位瓶颈以快速解决。Mercury Interactive 的\
    \ LoadRunner® 为最常见的协议和技术提供全面支持，包括 ERP/CRM、Web、J2EE、XML、.NET、无线和流媒体，使 IT 团队能够使用单一产品对所有企业应用进行负载和性能测试。使用\
    \ Mercury Interactive 的 LoadRunner® 实施有效的负载测试流程，有助于确保新应用或升级后的应用满足服务水平目标，并在部署到生产环境时不出现性能意外。\n\
    \n了解有关负载测试的更多信息\n\n```c\nvuser_init()\n{\n    lr_start_transaction(\"login\");\n\
    \    web_url(\"MercuryWebTours\",\n        \"URL=http://localhost/MercuryWebTours/\"\
    ,\n        \"Resource=0\",\n        \"RecContentType=text/html\",\n        \"\
    Referer=\",\n        \"Snapshot=t6.inf\",\n        \"Mode=HTML\",\n        LAST);\n\
    }\n```\n\nVuser 已终止。\n\n## LoadRunner——脚本录制与开发\n\n- Virtual User Generator简介\n\
    - VuGen录制功能\n- 修改Vuser脚本\n  - 参数化\n  - 集合点\n  - 检查点\n  - 关联\n- 配置Vuser脚本\n\n###\
    \ Virtual User Generator简介\n\n### VuGen录制原理\n\n录制过程\n\n![](img/88f667f5480db09ef600e4e177b09268_560_0.png)\n\
    \n运行过程\n\n![](img/88f667f5480db09ef600e4e177b09268_560_1.png)\n\n"
