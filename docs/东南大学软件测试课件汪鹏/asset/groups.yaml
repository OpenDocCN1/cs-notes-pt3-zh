    \n### Micro Focus (buy Compuware and Borland)\n\n- 测试管理：Test Manager, QADirector\n\
    - 性能测试：QALoad, SilkPerformer\n- 白盒测试：DevPartner\n- 功能测试：SilkTest, TestPartner\n\
    \nCompuware是一流的软件测试工具厂商。代表产品：QARun, QALoad, QADirector, DevPartner。2009年，Compuware的测试业务被Micro\
    \ Focus收购。\n\nSegue是专注于软件测试产品的一线公司：SilkTest, SilkPerformer。Segue 2006年被Borland收购，Borland公司于2009年被Micro\
    \ Focus收购。\n\n### IBM (buy Rational)\n\n- 功能测试：Rational Robot，Rational Functional\
    \ Tester (已逐渐取代Robot)\n\n2002年IBM收购Rational（DB2, WebSphere，Lotus等）。\n\n### Parasoft\n\
    \n- 主攻白盒测试：C++ Test, DotTest, JTest, SOATest, ...\n- 回归测试：WebKing\n\n### Oracle\
    \ (buy Empirix)\n\n- E-Test Suite：E-Test, E-Load, E-Monitor\n\n### RadView\n\n\
    - 专注Web性能测试：WebLoad\n\n### Microsoft\n\n- Visual Studio Test Edition：白盒测试、功能测试、性能测试(ACT)\n\
    - WAS：Web Application Stress Tool（早期小型性能测试工具）\n\n## 国内测试工具相关机构\n\n- 泽众软件\n  -\
