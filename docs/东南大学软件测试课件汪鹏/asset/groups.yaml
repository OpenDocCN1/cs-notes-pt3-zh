    \n## 等价类划分指南\n\n+   2. 取值范围\n\n数据类型：连续取值范围（通常是线性）\n\n划分方法：\n\n+   1 个有效等价类\n+\
    \   2 个无效等价类\n\n例：输入的考试成绩在0-100之间\n\n有效等价类是：0 ≤ 成绩 ≤ 100\n无效等价类是：成绩<0 和 成绩>100\n\
    \n# Word打印范围控制\n\n![](img/88f667f5480db09ef600e4e177b09268_184_0.png)\n\n## 等价类划分指南\n\
    \n+   3. 数据个数\n\n数据类型：输入有个数约束\n\n划分方法：\n\n+   1个有效等价类\n+   2个无效等价类\n\n例：构成三角形的3条边\n\
    \n有效等价类：输入边数 = 3\n\n无效等价类：输入边数 < 3 和 输入边数 > 3\n\n# 国际机票预定\n\n![](img/88f667f5480db09ef600e4e177b09268_186_0.png)\n\
    \n## 等价类划分指南\n\n+   4. 集合\n\n数据类型：符合特定规则的子集\n\n划分方法：\n\n1个有效等价类\n\n至少1个无效等价类\n\
    \n例：邮编由6位数字构成\n\n有效等价类：所有6位数字\n\n无效等价类：>6位数字 <6位数字\n\n>6位字母 6位字母 <6位字母\n\n# 淘宝用户注册的会员名\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_188_0.png)\n\n## 等价类划分指南\n\n+   5.\
    \ 需分别处理的数据\n\n数据类型：一组列表\n\n划分方法：\n\nN个有效等价类\n\n1个无效等价类\n\n例：中国的直辖市\n\n有效等价类：北京、上海、天津、重庆\n\
    \n无效等价类：非直辖市\n\n# Acrobat打印页面缩放\n\n![](img/88f667f5480db09ef600e4e177b09268_190_0.png)\n\
    \n## 等价类划分指南\n\n+   6. 符合规则的数据\n\n数据类型：规则\n\n划分方法：\n\nN个有效等价类\n\nM个无效等价类\n\n例：正确的电子邮件：含有@\
    \ 后跟x.y 不含#&\n\n有效等价类：字母+@x.y 数字+@x.y\n\n无效等价类：不含@ @后不是x.y 含#\n\n# 淘宝用户注册的登录密码\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_192_0.png)\n\n| 输入数据类型 | 划分等价类规则 |\n\
    |---|---|\n| 布尔值 | 1个有效等价类： TRUE | 1个无效等价类： FALSE |\n| 连续取值范围 | 1个有效等价类： 正确取值范围\
    \ | 2个无效等价类： 大于和小于取值范围 |\n| 数据个数 | 1个有效等价类： 正确数据个数 | 2个无效等价类： 大于和小于数据个数 |\n| 集合\
    \ | 1个有效等价类： 正确的集合取值 | 1个或多个无效等价类 |\n| 需分别处理的输入数据 | 多个有效等价类： 每个输入数据为1个等价类 | 1个无效等价类\
    \ |\n| 符合某些规则的输入 | 多个有效等价类： 符合某个规则的输入数据为1个等价类 | 若干个无效等价类 |\n\n## 等价类划分测试步骤\n\n\
    +   1. **Step1:** 选择划分准则（范围、取值、布尔…）\n+   2. **Step2:** 根据准则确定有效和无效等价类\n+   3.\
    \ **Step3:** 从等价类中选取样本数据\n+   4. **Step4:** 根据需求写预期结果\n+   5. **Step5:** 加入特殊值\n\
    +   6. **Step6:** 执行测试\n\n## 等价划分测试练习——保险费率\n\n### 人寿保险费率（基本保险费0.50）\n\n| 年龄段\
    \ | 额外保险费 |\n|---|---:|\n| 35岁以下 | 1.65 |\n| 35-59 | 2.87 |\n| 60岁以上 | 6.00 |\n\
    \n划分准则：范围+分别处理数据\n\n### 人寿保险费率对应等价类\n\n| 序号 | 等价类 | 输入类型 | 测试数据 | 预期结果 |\n| ---\
    \ | --- | --- | --- | --- |\n| 1 | 低于35岁 | 有效 | 26 , 12 | 月保险费=2.15 |\n| 2 | 35-59岁\
    \ | 有效 | 37 | 月保险费=3.37 |\n| 3 | 大于60岁 | 有效 | 65 , 90 | 月保险费=6.50 |\n| 4 | 负年龄\
    \ | 无效 | -23 | 警告信息 |\n| 5 | 0岁 | 无效 | 0 | 警告信息 |\n\n全字母\n\n字母+数字\n\n不超过6个字符数\n\
    \n有效等价类\n\n有效等价类\n\n无效等价类\n\n# 2个有效等价类\n\n+   （1）用户名：{0<全字母<=6}\n+   \n+   John,\
    \ Jerry, Kenedy\n\n+   （2）用户名：{0<字母开头+数字<=6}\n+   \n+   u001, user01\n\n# >4个无效等价类\n\
    \n+   （1）数字开头的字符串集合\n+   \n+   `101，71108`\n\n+   （2）字母开头，并含有特殊字符\n+   \n+   `user@$，user_01`\n\
    \n+   （3）字母开头，且长度超过6\n+   \n+   `user0001`\n\n+   （4）空字符串\n\n...\n\n## 等价划分测试练习——电话号码\n\
    \n### 我国电话号码一般由两部分构成：\n\n地区码：\n以0开头的3位或4位数字\n\n电话号码：\n以非0、非1开头的7位或8位数字\n\n划分准则：规则+集合+数据个数\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_202_0.png)\n\n![](img/88f667f5480db09ef600e4e177b09268_202_1.png)\n\
    \n| 输入数据 | 有效等价类 | 无效等价类 |\n|---|---|---|\n| 地区码 | 1. 以0开头的3位区码\n2. 以0开头的4位区码\
    \ | 3. 以0开头的小于3位的数字串\n4. 以0开头的大于4位的数字串\n5. 以非0开头的数字串\n6. 以0开头含有非数字的字符串 |\n\n![](img/88f667f5480db09ef600e4e177b09268_203_0.png)\n\
    \n# 8位数\n\n# 非0开头的数\n\n# 非1开头的数\n\n# 7位数\n\n| 输入数据 | 有效等价类 | 无效等价类 |\n|---|---|---|\n\
    | 电话号码 | 7. 以非0、非1开始的7位号码\n\n8. 以非0、非1开始的8位号码 | 9. 以0开头的数字串\n\n10. 以1开头的数字串\n\n\
    11. 以非0、非1开始的小于7位数字串\n\n12. 以非0、非1开始的大于8位数字串\n\n13. 以非0、非1开始的含有非法字符7或者8位字符串 |\n\
    \n| 输入数据测试用例 | 有效等价类 | 无效等价类 |\n|---|---|---|\n| 测试用例 | 010 6123456<br>覆盖1，7<br><br>025\
    \ 81234567<br>覆盖1，8<br>0551 7123456<br>覆盖2，7<br>0571 92345678<br>覆盖2，8 | 01 81234567　覆盖3<br>05511\
    \ 6123456　覆盖4<br>10 81234567　覆盖5<br>025×81234567　覆盖6<br>010 06123456　覆盖9<br>0551\
    \ 1123456　覆盖10<br>0551 612345　覆盖11<br>0517 912345678　覆盖12<br>0571 912345ab　覆盖13<br><br>特殊值：NULL\
    \ 1234567<br>特殊值：025 NULL |\n"
