  md: "\n## 黑盒测试方法——等价划分\n\n### 等价类划分总结\n\n- 非冗余性：尽可能使等价类间没有交叉，保证测试用例不存在冗余\n- 完整性：等价类的并集等于输入/输出域\n\
    - 局限：忽略边界位置的测试用例\n\n![](img/88f667f5480db09ef600e4e177b09268_206_0.png)\n\n##\
    \ 黑盒测试方法——边界值分析\n\n### 边界值分析原理\n\n- 软件的两个主要缺陷源\n  - （1）条件\n  - （2）边界\n\n条件：变量取值决定控制流走向\n\
    \n边界：变量值的“极限”\n\n- **边界值分析**：能有效捕获出现在边界处的缺陷的一种测试方法；利用了缺陷更容易出现在边界处的事实。\n\n![](img/88f667f5480db09ef600e4e177b09268_209_0.png)\n\
    \n缺陷易出现在边界处的原因：\n\n- （1）使用比较操作符时未仔细分析\n- （2）循环和条件检查方法引起的困惑\n- （3）对边界附近需求的理解不够\n\
    \n### 边界值类型\n\n- 边界值数据类型\n  - 数值、速度、字符、地点\n  - 位置、尺寸、数量……\n- 边界特征\n  - 第一个/最后一个、最小值/最大值\n\
    \  - 开始/完成、空/满、最短/最长\n  - 最慢/最快、最早/最迟、最大/最小\n\n### 次边界条件/隐性边界\n\n- 各种数据类型的极限\n\
    - `int, unsigned int, long, char, …`——一般是2的幂次\n- ASCII、Unicode 字符\n- 空白，空值，零值，无输入\n\
    - 屏幕分辨率决定的光标/鼠标运动范围\n- ……\n\n特点：产品说明书中没有，外部用户看不到\n\n### 边界值确定\n\n|  | 边界值附近数据\
    \ | 测试用例设计思路 |\n|---|---|---|\n| 字符 | Min-1, Min, Min+1<br>Max-1, Max, Max+1 |\
    \ 文本框允许输入1-255个字符：0,1,2,254,255,256 |\n| 数值范围 | Min-1, Min, Min+1<br>Max-1, Max,\
    \ Max+1 | 输入数据允许1-999：0,1,2,998,999,1000 |\n| 集合空间 | 0, Min, Min+1<br>Max-1, Max,\
    \ Max+1 | 图片大小不能超过50k：0,1k,49k,50k,51k |\n\n### 边界值测试用例确定方法\n\n**独立参数的单变量的边界值**\n\
    \nn：存在边界值的参数个数\n\n**方法一：基本边界测试**\n\n对每个参数取4个边界值\n\n- Min, Min+1\n- Max-1, Max\n\
    \n计算公式：4n+1\n\n> Paul C. Jorgensen, Software Testing: A Craftsman’s Approach (1995)\n\
    \n**方法二：健壮性边界测试**\n\n对每个参数取6个边界值\n\n- Min-1, Min, Min+1\n- Max-1, Max, Max+1\n\
    \n计算公式：6n+1\n\n> Paul C. Jorgensen, Software Testing: A Craftsman’s Approach (1995)\n\
    \n**非独立参数的多变量的边界值**\n\nm：边界条件的数量\n\n**方法三：边界条件测试**\n\n确定边界条件，对每个边界条件取 3 个边界值\n\
    \nBC-1, BC, BC+1\n\n计算公式：3m\n\n## 边界值分析测试练习——购物折扣\n\n**大宗购买折扣**\n\n| 购买数量 | 单价\
    \ |\n|---|---|\n| 头10件（1-10件） | 5.00 |\n| 第二个10件（11-20件） | 4.75 |\n| 第三个10件（21-30件）\
    \ | 4.50 |\n| 超过30件 | 4.00 |\n\n15件需要支付：10×5+5×4.75=73.75\n\n| 测试用例 | 选择理由 | 预期输出\
    \ |\n|---|---|---|\n| 0 | 第1阶段的开始前 | 0.00 |\n| 1 | 第1阶段的开始 | 5.00 |\n| 2 | 第1阶段小值\
    \ | 10.00 |\n| 5 | 第1阶段中的值，不考虑边界 | 25.00 |\n| 9 | 正好在第1阶段的末尾 | 45.00 |\n| 10 |\
    \ 极限值 | 50.00 |\n| 11 | 第2阶段开始 | 54.75 |\n| 16 | 第2阶段中的值，不考虑边界 | 78.50 |\n| 19\
    \ | 正好在第2阶段的末尾 | 92.75 |\n| 20 | 极限值 | 97.50 |\n| 21 | 第3阶段开始 | 102.00 |\n| 27\
    \ | 第3阶段中的值，不考虑边界 | 129.00 |\n| 29 | 正好在第3阶段的末尾 | 138.00 |\n| ... | ... | ...\
    \ |\n\n## 边界值分析测试练习——公历日期\n\n### 用边界值分析方法设计合法公历日期的测试用例\n\n日期范围：1582年1月1日—3000年12月31日\n\
    \n- 1582年10月5日至10月14日排除在公历外\n- 2038年1月19日是BIOS提供的计时基准时间1970年1月1日的最大值（千年虫问题）\n\
