    \n## 软件测试背景\n\n## 软件测试的意义  软件缺陷难以避免！\n\nMichael Jackson逝世消息\n事故过程：百万网友同时在线疯狂查询修改美国流行天王迈克尔杰克逊逝的信息……\n\
    \n启发：性能测试在互联网应用中的重要性\n\n![](img/88f667f5480db09ef600e4e177b09268_72_0.png)\n\n\
    ## 软件测试背景\n\n为什么会出现软件缺陷\n\n- 一、 产品说明书(需求) (主要原因)\n- 随意、易变、沟通不足\n- 二、 设计 (次要原因)\n\
    - 随意、易变、沟通不足\n- 三、 编码\n- 软件复杂度，进度压力，低级错误\n- 四、 其它\n- 理解错误，测试错误\n\n![](img/88f667f5480db09ef600e4e177b09268_73_0.png)\n\
    \n## 软件测试背景\n\n## 软件测试的意义\n\n软件测试是保证软件质量的重要手段。\n软件测试深入软件开发过程的每个阶段，在有限的开发条件下，最大程度地保证最终软件产品符合用户需要。\n\
    \n## 二 软件测试基本概念\n\n- 1. 软件测试是什么？\n- 2. 软件测试活动需要遵循哪些原理？\n- 3. 如何实施软件测试？\n- 4. 软件测试如何分类？\n\
    \n## 软件测试基本概念\n\n## ■ 软件测试的目的\n\n**1.确保软件质量**\n\n找出软件错误和缺陷，降低软件发布后潜在错误和缺陷造成的损失，验证软件是否能满足用户需求，树立对软件的信心。\n\
    \n**2.确保软件开发过程方向的正确性**\n\n通过测试报告提供有用的数据帮助管理者做出正确判断，修正软件开发过程。\n\n## 软件测试基本概念\n\n\
    理解Bug：Fault(失效) Error(错误) Failure(失败)\n\n## Bug的定义：\n\n- **Software Fault**: A\
    \ static defect in the software (i.e., defect)\n**软件缺陷**：软件中的静态缺陷（即缺陷）\n- **Software\
    \ Error**: An incorrect internal state that is the manifestation of some faults\n\
    **软件错误**：某些缺陷表现出来的不正确内部状态\n- **Software Failure**: External, incorrect behavior\
    \ with respect to the requirements or other description of the expected behavior\n\
    **软件失效**：相对于需求或其他预期行为描述的外部、不正确行为\n\n## 软件测试基本概念\n\n## 理解Bug：Fault(失效) Error(错误)\
    \ Failure(失败)\n\nProgrammer makes a mistake.\n程序员犯了错误。\n\nFault (defect, bug)\
    \ appears in the program.\n程序中出现了缺陷（缺陷、bug）。\n\nFault remains undetected during\
    \ testing (running test inputs).\n缺陷在测试期间未被检测到（运行测试输入）。\n\nThe program fails (based\
    \ on test oracles) during execution i.e., it behaves unexpectedly.\n程序在执行期间失效（基于测试\
    \ oracle），即行为异常。\n\nError: difference between computed, observed, or measured\
    \ value or condition and true, specified, or theoretically correct value or condition\n\
    错误：计算、观察或测量的值或条件与真实、指定或理论上正确的值或条件之间的差异\n\n## 软件测试基本概念\n\n## 软件测试的原理/原则/准则\n\n\
    **原理1：用户需求至上**\n\n所有测试都应追溯到用户需求。最严重的错误是导致软件无法满足需求的错误。\n\n**原理2：测试是有计划的活动**\n\n\
    测试计划制定先于测试的执行；测试贯穿于全部软件生命周期。\n\n## 软件测试基本概念\n\n## 软件测试的原理/原则/准则\n\n## 原理3：缺陷出现的集群性\n\
    \n软件缺陷会集中出现;80%的错误可能起源于20%的模块。\n\n## 原理4：测试应从 “小规模” 走向 “大规模”\n\n## 软件测试基本概念\n\n\
    ## 软件测试的原理\n\n**原理5：穷尽测试不可能**\n\n可能对解二次方程穷尽测试吗？\n\n```\nclass Roots {\n    //\
    \ Solve ax² + bx + c = 0\n    public roots(double a, double b, double c)\n   \
    \ { ... }\n\n    // Result: values for x\n    double root_one, root_two;\n}\n\
    ```\n\n**原理6：有效的测试应由第三方独立进行**\n\n## 软件测试基本概念\n\n## 软件测试的原理\n\n原理7：测试无法揭示所有缺陷\n\
    \n测试只能说明缺陷存在，而不能说明软件没有缺陷。\n\n原理8：测试的杀虫剂悖论\n\n潜在缺陷对已进行的测试具有免疫力\n\n"
