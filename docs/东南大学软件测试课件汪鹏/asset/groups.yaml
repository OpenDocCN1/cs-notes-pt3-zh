    M

    E₂


    ## 因果图分析测试练习1——文件格式


    ### 文件管理系统规格说明


    - (1) 文件第一列的字符必须是一个A或B，且文件第二列的字符必须是一个数字；

    - (2) 在该情况下，文件被修改了；

    - (3) 第一个字符不正确，则打印X12消息；

    - (4) 第二个不是数字，则打印X13消息；


    ### 1.分析原因和结果


    **原因：**


    C1:第1列的字符是A


    C2:第1列的字符是B


    C3:第2列的字符是数字


    **结果：**


    E1:文件修改过


    E2:打印消息X12


    E3:打印消息X13


