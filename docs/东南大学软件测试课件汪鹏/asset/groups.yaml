    ![](img/88f667f5480db09ef600e4e177b09268_382_0.png)


    # 单元测试规程


    # 驱动器和程序框


    绝大多数情况下，单个单元是不能正常工作的，而是要和其他单元一起才能正常工作。


    实际测试活动中的普遍问题：其它单元不存在的情况下，如何运行单个模块？


    # 单元测试规程


    # 驱动器和程序桩


    +   - 单元测试通常与编码工作结合起来进行。


    +   - 模块本身不是一个独立的程序，在测试模块时，必须为每个被测模块开发一个驱动器(driver) 和若干个桩程序(stub)


    ![](img/88f667f5480db09ef600e4e177b09268_384_0.png)


    # 单元测试规程


    # 驱动器和程序桩


    # 驱动器（Driver）：


    对底层或子层模块进行测试时所编制的调用被测模块的程序，用以模拟被测模块的上级模块。


    接收测试数据，并把数据传送给被测模块，最后输出相关结果。


    ![](img/88f667f5480db09ef600e4e177b09268_385_0.png)


