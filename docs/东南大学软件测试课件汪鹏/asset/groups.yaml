    ## 黑盒测试基础

    —正面和负面测试


    ## 正面和负面测试用例


    ## 正面测试


    正面测试用例：


    测试用例通过一组预期输入输出验证产品需求


    目的：


    证明软件对于每条规格说明和期望都能通过


    注意：预期产品给出一个错误时它确实给出该错误，这也是正面测试的一部分


    正面测试用于验证已知测试条件，证明软件可以完成所期望的工作


    ## 正面和负面测试用例


    ## 负面测试


    负面测试：

    展示当输入非预期输入时产品没有失败


    目的：

    使用产品没有设计和预想到的场景，尝试使系统堵塞


    负面测试用于通过未知条件把产品搞垮


    ## 正面和负面测试用例


    ## 负面测试


    ## 负面测试用例举例


    | 序号 | 输入1 | 输入2 | 当前状态 | 预期状态 |

    | --- | --- | --- | --- | --- |

    | 1 | 某个其它锁的钥匙 | 顺时针转动 | 上锁 | 上锁 |

    | 2 | 某个其它锁的钥匙 | 逆时针转动 | 开锁 | 开锁 |

    | 3 | 铁丝 | 逆时针转动 | 开锁 | 开锁 |

    | 4 | 用火烧 |  | 上锁 | 上锁 |


    注意：负面测试用例不能和需求映射


    ## 正面和负面测试用例


    ## 正面测试VS负面测试


    | | 正面测试 | 负面测试 |

    |---|---|---|

    | 测试条件 | 根据需求说明规格 | 测试条件都在需求规格说明之外 |

    | 目的 | 验证需求规格说明的正确性 | 通过未知条件搞垮软件 |

    | 覆盖率计算 | 覆盖需求和条件 | 没有覆盖率 |

    | 挑战性 | 根据规格说明设计测试用例 | 需要高度创造性产生尽可能多的未知条件 |


