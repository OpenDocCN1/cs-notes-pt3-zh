  - '[PAGE 11]


    # 软件测试


    课程概述


    从认识和理解软件Bug开始，介绍软件测试的基本理论，阐述软件测试设计的多样性原理。基于多样性原理，介绍面向开发者和面向用户的测试用例设计方法，具体包括随机测试、等价类测试、结

    构化测试、数据流测试和逻辑测试；邀请业界专家讲解功能测试、性能测试、兼容性测试等专项测试技术。


    +   - Subtitles available in 中文（简体）

    +   - 2-4 hours/week


    南京大学


    Zhenyu Chen

    Associate Professor

    Software Institute


    # 1. 软件测试基础


    本节主要熟悉课程体系，了解测试基本概念，重点理解Bug及其测试原理。


    2 小时 12 分钟


    显示 9 课内容


    # 2. 软件测试方法


    本节主要讲解黑盒测试方法与黑盒测试方法。白盒测试方法从程序员的角度看如何测试代码，并以Unit为基础进行实践。


    可向学生提供证书


    完成本课程，并通过证书展示成绩，其中由Coursera颁发，确保其安全性和权威性。

    了解更多关于证书的信息


    ![](img/88f667f5480db09ef600e4e177b09268_11_0.png)'
  - '[PAGE 12]


    # 四、课程考核方式


    总评成绩 =


    平时成绩(考勤 + 上机实验) + 期末考试成绩


    +上机成绩（云测试）


    平时成绩占： 30%


    上机实验占： 10%


    期末考试成绩占： 60%


    一次点名未到： 总成绩减1分


    三次点名未到： 总成绩为0分'
