  md: "\n## 单元测试规程\n\n### 驱动器和程序桩\n\n**桩程序（Stub）：** 对上层模块进行测试时，所编制的替代下层模块的程序，用以模拟被测模块工作过程中所调用的模块。\n\
    \n模拟未被测试模块/隶属模块的功能。\n\n![](img/88f667f5480db09ef600e4e177b09268_386_0.png)\n\n\
    **驱动器结构一般如下：**\n\n- 数据说明；\n- 初始化；\n- 输入测试数据；\n- 调用被测模块；\n- 输出测试结果；\n- 停止\n\n**桩程序结构一般如下：**\n\
    \n- 数据说明；\n- 初始化；\n- 输出提示信息（表示进入了哪个桩模块）；\n- 验证调用参数；\n- 打印验证结果；\n- 将模拟结果送回被测程序；\n\
    - 返回\n\n### 手工和自动化测试\n\n**手工测试：** 按照需求规格设计测试用例完成测试。\n\n静态测试。\n\n**自动测试：** 自动化方法的效果：有效验证较为独立单元的正确性。\n\
    \n单元测试驱使程序员创建松耦合、高内聚的代码体，有助于开发健壮的软件。\n\n### 单元测试局限性\n\n- 只验证单元自身的功能，不能捕获系统范围的错误\n\
    \  - 系统错误：集成错误、性能问题等\n- 被测模块现实中可能接收的所有输入情况难以预料\n\n## 二 集成测试\n\n![](img/88f667f5480db09ef600e4e177b09268_390_0.png)\n\
    \n- 1. 集成测试的概念？\n- 2. 集成测试的关注点？\n- 3. 集成测试的策略？\n\n### 集成测试基本概念\n\n**火星登陆事故（Mars\
    \ Polar Lander）**\n\n![](img/88f667f5480db09ef600e4e177b09268_391_0.png)\n\n>\
    \ *Nancy G. Leveson, The Role of Software in Spacecraft Accidents*\n\n**定义**\n\
    \n**集成测试（Integration Testing）：** 把单独的软件模块结合在一起作为整体接受测试。\n\n**意义**\n\n- 1. 验证软件单元间能否协调工作\n\
    - 2. 验证单元集合的功能、性能和可靠性需求\n\n**实施者**\n\n软件测试人员+软件开发人员\n\n**测试技术和步骤**\n\n**技术：**\n\
    - 黑盒测试技术为主\n- 白盒测试技术为辅\n\n**步骤：**\n- 与集成测试策略相关\n\n**集成测试必要性**\n\n接口连接问题：\n\n-\
    \ 函数相互调用；\n- 模块间的相互影响；\n- 单个模块中的缺陷发生扩散；\n- 全局数据结构；\n- ...\n\n**接口**\n\n**内部接口：**\
    \ 产品内部两模块之间通信的接口\n\n**外部接口：** 产品之外第三方可以看到的接口\n\n**接口提供方法：** API、SDK\n\n**显式接口：**\
    \ 写入文档的明确化的接口\n\n**隐含接口：** 未写入文档，只有开发人员知道；如：Windows隐藏的API\n\n### 集成测试策略\n\n- 瞬时集成测试\n\
    - 增量集成测试\n\n**瞬时集成测试**\n\n又称大爆炸测试策略。\n\n**特点：** 当所有构件都通过单元测试，就把他们组合成一个最终系统，并观察它是否正常运转。\n\
    \n**缺陷：**\n\n- 无休止的错误：\n  - 错误很多；\n  - 错误修复很困难；\n  - 修正错误后，新的错误马上出现\n- 模块一次性结合，难以找出错误原因\n\
    - 接口错误和其它错误容易混淆\n\n**适用领域：** 小型软件开发\n\n**增量集成测试**\n\n**特点：** 将程序分成小的部分进行构造和测试。\n\
    \n**优点：**\n\n- 1. 错误容易分离和修正\n- 2. 接口容易进行彻底测试\n\n**缺点：** 会有额外开销，但能大大减少发现和修正错误的时间。\n\
    \n**三种增量集成测试：**\n\n- 自顶向下集成\n- 自底向上集成\n- 混合式集成\n\n**自顶向下集成**\n\n**集成顺序：** 先集成主模块（主程序），然后按照控制层次向下进行集成。\n\
    \n**集成方式：**\n\n- 1. 深度优先\n- 2. 广度优先\n\n**广度优先集成**\n\nA possible sequence of integration\
    \ is:\n\n- Unit test MA\n- Integration test MA, MB\n- Integration test MA, MB,\
    \ MC\n- Integration test MA, MB, MC, MD\n- Integration test MA, MB, MC, MD, ME\n\
    - Integration test MA, MB, MC, MD, ME, MF\n- Integration test MA, MB, MC, MD,\
    \ ME, MF, MG\n- Integration test all modules\n\n![](img/88f667f5480db09ef600e4e177b09268_406_0.png)\n\
    \n**深度优先集成**\n\n![](img/88f667f5480db09ef600e4e177b09268_407_0.png)\n\n深度优先：A\
    \ B D E C F H G\n\n**集成步骤：**\n\n- 1. **Step1.** 主程序作为测试**驱动器**\n- 2. **Step2.**\
    \ 根据集成顺序，**程序桩**逐渐被各模块替换\n- 3. **Step3.** 每个模块集成时都需要进行测试\n- 4. **Step4.** 每完成一次测试后，将**新模块替换程序桩**\n\
    - 5. **Step5.** 利用**回归测试**来保证没有引进新的错误\n\n**优点：**\n\n- 1. 尽早发现高层控制和决策错误\n- 2. 只需要一个驱动器\n\
    - 3. 每步只增加一个模块\n- 4. 支持深度优先和广度优先\n\n**实施的主要难点：**\n\n高层测试需要在低层测试完成后才可进行的情形。\n\n\
    **解决方法：**\n\n- 1. 推迟测试，直到低层模块完成测试；\n- 2. 设计程序桩，模拟低层模块；\n- 3. 自底向上测试\n\n**缺点：**\n\
    \n- 1. 对低层模块行为的验证比较晚\n- 2. 需要编写额外程序模拟未测试的模块\n- 3. 测试用例的输入和输出很难明确表示\n\n**自底向上集成**\n\
    \n**集成顺序：** 从原子模块，即程序最底层模块开始进行构造并进行集成测试。\n\n原子模块 → 构件(Build) → 应用软件系统\n\n**集成步骤：**\n\
    \n- Step1. 低层模块组成实现特定子功能的构件\n- Step2. 编写驱动程序协调输入输出\n- Step3. 测试特定子功能的构件\n- Step4.\
    \ 沿层次向上对构件进行组合\n\nA possible sequence of integration is:\n\n- Unit test MD\n-\
    \ Unit test ME\n- Unit test MH\n- Unit test MG\n- Integration test MD, MB\n- Integration\
    \ test MD, MB, ME\n- Integration test MD, MB, ME, MA\n- Integration test MH, MF\n\
    - Integration test MH, MF, MC\n- Integration test MH, MF, MC, MG\n- Integration\
    \ test all modules\n\n![](img/88f667f5480db09ef600e4e177b09268_415_0.png)\n"
