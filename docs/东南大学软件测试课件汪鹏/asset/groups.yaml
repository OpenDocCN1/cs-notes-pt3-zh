  - "[PAGE 135]\n\n# 本讲结束语\n\n> 软件测试者的一个基本素质就是打破砂锅问到底。他们喜欢找出那些难以捉摸的系统崩溃。他们乐于处理最复杂的问题。经常看到他们高高兴兴地来回奔忙，相互间击掌庆祝，拿到系统时手舞足蹈的样子。这就是平凡生活中的乐趣。\n\
    > \n> ——Ron Patton 《软件测试》"
