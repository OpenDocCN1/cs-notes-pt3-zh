    \n```\ninclude \"web_api.h\"\n\nAction()\n{\n    web_add_cookie(\"PREF-ID=12006111bbde2eb6;NW=1\n\
    \    web_url(\"www.google.com\",\n        \"URL=http://www.google.com/\",\n\n\
    ```\n\nVuGen自动生成的脚本\n\n## Vuser Script录制流程\n\n### 实例演示：WebTours在线订票系统\n\n## 事务(Transaction)\n\
    \n事务：一个或多个用户操作步骤的集合\n\nVuser script中：\n\nlr_start_transaction()和lr_end_transaction()间的代码块\n\
