    \  //获取时间表\n\n    updateFeedingSchedule();//更新时间表\n\n}\n```\n\n**测试预言程序**\n\n\
    ```\npublic boolean\n    testUpdateFeedingSchedule(){\n\n    FeedingSchedule fs=new\n\
    \        FeedingSchedule();\n\n    Calendar now=Calendar.getInstance();\n\n  \
    \  fs.setStart(now);\n\n    now.add(now.MINUTE,31);\n\n    fs.setEnd(now);\n\n\
    \    fs.updateFeedingSchedule(fs);\n\n    return checkInvariant();\n}\n```\n\n\
    **例：测试输入为1-100整数的输入框**\n\n- （1）等价类划分：\n  - 无效域：x<1\n  - 有效域：1<=x<=100\n  - 无效域：x>100\n\
