    ## 黑盒测试方法——等价划分


    ## 等价划分原理


    +   - 将软件输入和输出的值域进行划分，选择少数样本作为测试用例

    +   - 实现对无穷输入量的科学规划，极大减少测试用例数目，降低测试工作量


    ![](img/88f667f5480db09ef600e4e177b09268_176_0.png)


    ## 黑盒测试方法——等价划分


    ## 等价类（等价划分）


    如果软件行为对一组输入/输出值来说是相同的，则称这组值为等价类（或一个等价划分）


    ![](img/88f667f5480db09ef600e4e177b09268_177_0.png)


    ## 黑盒测试方法——等价划分


    ## 等价类（等价划分）


    **有效等价类：**


    有意义的输入输出数据构成的集合


    特点：满足产品规格说明的数据


    **无效等价类：**


    无意义的输入输出数据构成的集合


    特点：不满足产品规格说明的数据


    ## 黑盒测试方法——等价划分


    ## 等价类（等价划分）


    ## 有效等价类和无效等价类


    线性情况


    值域


    非线性情况


    无效等价类


    无效等价类


    有效等价类


    ![](img/88f667f5480db09ef600e4e177b09268_179_0.png)


    ## 黑盒测试方法——等价划分


    ## 等价类划分指南


    | 输入数据类型 | 划分等价类规则 |

    |---|---|

    | 布尔值 | 1个有效等价类： TRUE  1个无效等价类： FALSE |

    | 连续取值范围 | 1个有效等价类： 正确取值范围  2个无效等价类： 大于和小于取值范围 |

    | 数据个数 | 1个有效等价类： 正确数据个数  2个无效等价类： 大于和小于数据个数 |

    | 集合 | 1个有效等价类： 正确的集合取值  1个或多个无效等价类 |

    | 需分别处理的输入数据 | 多个有效等价类： 每个输入数据为1个等价类  1个无效等价类 |

    | 符合某些规则的输入 | 多个有效等价类： 符合某个规则的输入数据为1个等价类  若干个无效等价类 |


