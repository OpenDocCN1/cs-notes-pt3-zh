    \n## 软件测试基本概念\n\n## ■ 软件测试的目的\n\n**1.确保软件质量**\n\n找出软件错误和缺陷，降低软件发布后潜在错误和缺陷造成的损失，验证软件是否能满足用户需求，树立对软件的信心。\n\
    \n**2.确保软件开发过程方向的正确性**\n\n通过测试报告提供有用的数据帮助管理者做出正确判断，修正软件开发过程。\n\n## 软件测试基本概念\n\n\
    理解Bug：Fault(失效) Error(错误) Failure(失败)\n\n## Bug的定义：\n\n- **Software Fault**: A\
    \ static defect in the software (i.e., defect)\n- **Software Error**: An incorrect\
    \ internal state that is the manifestation of some faults\n- **Software Failure**:\
    \ External, incorrect behavior with respect to the requirements or other description\
    \ of the expected behavior\n\n## 软件测试基本概念\n\n## 理解Bug：Fault(失效) Error(错误) Failure(失败)\n\
    \nProgrammer makes a mistake.\n\nFault (defect, bug) appears in the program.\n\
    \nFault remains undetected during testing (running test inputs).\n\nThe program\
    \ fails (based on test oracles) during execution i.e., it behaves unexpectedly.\n\
    \nError: difference between computed, observed, or measured value or condition\
    \ and true, specified, or theoretically correct value or condition\n\n## 软件测试基本概念\n\
    \n## 软件测试的原理/原则/准则\n\n**原理1：用户需求至上**\n\n所有测试都应追溯到用户需求。最严重的错误是导致软件无法满足需求的错误。\n\n\
    **原理2：测试是有计划的活动**\n\n测试计划制定先于测试的执行；测试贯穿于全部软件生命周期。\n\n## 软件测试基本概念\n\n## 软件测试的原理/原则/准则\n\
    \n## 原理3：缺陷出现的集群性\n\n软件缺陷会集中出现;80%的错误可能起源于20%的模块。\n\n## 原理4：测试应从 “小规模” 走向 “大规模”\n\
    \n## 软件测试基本概念\n\n## 软件测试的原理\n\n**原理5：穷尽测试不可能**\n\n可能对解二次方程穷尽测试吗？\n\n```\nclass\
    \ Roots {\n    // Solve ax² + bx + c = 0\n    public roots(double a, double b,\
    \ double c)\n    { ... }\n\n    // Result: values for x\n    double root_one,\
    \ root_two;\n}\n```\n\n**原理6：有效的测试应由第三方独立进行**\n\n## 软件测试基本概念\n\n## 软件测试的原理\n\n\
    原理7：测试无法揭示所有缺陷\n\n测试只能说明缺陷存在，而不能说明软件没有缺陷。\n\n原理8：测试的杀虫剂悖论\n\n潜在缺陷对已进行的测试具有免疫力\n"
