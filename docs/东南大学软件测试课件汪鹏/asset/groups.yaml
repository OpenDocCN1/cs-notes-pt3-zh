    - 3. 在测试中模拟客户使用环境\n  正式、完备和现实的测试环境\n\n## 系统测试概述\n\n## 系统测试的实施原因\n\n- 4. 测试产品功能和非功能的问题\n\
    - 5. 建立对产品的信心\n- 6. 分析和降低产品发布的风险\n- 7. 保证满足所有需求，产品具备交付确认测试条件\n\n## 系统测试概述\n\n\
    ## 系统测试=功能测试+非功能测试\n\n## 功能测试VS非功能测试\n\n| | 功能测试 | 非功能测试 |\n|---|---|---|\n| 作用/关注点\
    \ | 验证产品功能和特性 | 验证产品质量因素 |\n| 范围 | 所有测试阶段 | 系统测试 |\n| 用例失败原因 | 代码缺陷 | 体系结构、设计和代码缺陷\
    \ |\n| 预备知识 | 产品和领域 | 产品、领域、设计、体系结构、分析技能 |\n\n## 系统测试概述\n\n系统测试=功能测试+非功能测试\n\n\
    |  | 功能测试 | 非功能测试 |\n|---|---|---|\n| 用例可重复性 | 可重复多次 | 只在沟通过的和针对不同配置时重复 |\n| 配置\
    \ | 对一组测试用例配置一次 | 每个测试用例都可能改变配置 |\n| 工作量 |  | 50%:50% ~ 30%:70% |\n\n## 功能系统测试\n\
    \n## 功能系统测试方法\n\n- 1. 设计/体系结构测试\n- 2. 业务垂直测试\n- 3. 部署测试\n- 4. Alpha测试和Beta测试\n\
    - 5. 符合性的认证、标准和测试\n\n## 功能系统测试\n\n## 设计/体系结构测试\n\n原理：\n\n对照设计和体系结构开发和检查测试用例，从而整理出产品级测试用例\n\
    \n| 测试用例特征 | 建议 |\n|---|---|\n| 测试用例关注代码逻辑、数据结构和产品单元 | 单元测试 |\n| 测试用例关注组件接口 |\
    \ 集成测试 |\n| 测试用例关注的不能为客户所看到 | 单元测试/集成测试 |\n| 测试用例综合了客户使用和产品实现 | 系统测试 |\n\n## 功能系统测试\n\
    \n## 业务垂直测试\n\n**原理：**\n\n针对不同业务纵深的产品，根据业务定制测试用例，**验证业务运作和使用**\n\n**方法：**\n\n\
    模拟和复制\n\n场景测试\n\n## 功能系统测试\n\n## 部署测试\n\n## 验证新的系统是否能有效替代老的系统\n\n## 目的：\n\n特定产品版本短期内是否能成功使用\n\
    \n## 过程：\n\n- 1. 第1阶段：采集实际系统真实数据，建立镜像测试环境，重新执行用户操作\n- 2. 第2阶段：引入新产品，进行新业务操作\n\n\
    ## 功能系统测试\n\n## Alpha测试和Beta测试\n\nAlpha测试：\n\n定义：用户在开发环境下进行的受控测试\n\n特点：不由程序员或测试员完成，但开发者会在现场\n\
    \n## 功能系统测试\n\n## Alpha测试和Beta测试\n\n在Alpha测试达到一定程度后进行Beta测试\n\n## Beta测试：\n\n\
    定义：用户在实际使用环境下进行测试\n\n一种可以把待测产品交给客户收集反馈意见的机制\n\n特点：开发者通常不在现场\n\n挑战：客户数量；客户充分了解产品\n\
    \n## 功能系统测试\n\n## 符合性的认证、标准和测试\n\n主流基础设施：操作系统、硬件、数据库...\n\n约定和法律要求：质量行业标准、法规、...\n\
    \n## 非功能系统测试\n\n## ■ 非功能系统测试方法\n\n非功能测试的最大挑战：**设置配置**\n\n**原因：**\n\n- 1. 难以预测客户使用的环境\n\
    - 2. 对配置进行组合测试的代价太高\n- 3. 建立测试环境成本高\n- 4. 很难准确预测客户使用的数据\n\n**两种方法：** 模拟环境 和 真实客户环境\n\
    \n## 非功能系统测试\n\n## 非功能系统测试方法\n\n- 1. 性能测试\n- 2. 互操作性测试/兼容性测试\n- 3. 可使用性与易获得性测试\n\
    - 4. 国际化测试\n- 5. 安全性测试\n\n## 非功能系统测试\n\n## 性能测试\n\n参见下一讲内容\n\n## 非功能系统测试\n\n##\
    \ 互操作测试/兼容性测试\n\n## 目的：\n\n保证两个或多个产品可以交换和使用信息，并恰当地在一起运行\n\n## 典型兼容目标：\n\n操作系统、数据库、网络、浏览器、应用软件\n\
    \n## 非功能系统测试\n\n## ■ 互操作测试/兼容性测试\n\n**后向兼容：**\n\n老版本中的数据能否在当前版本中使用\n\n**前向兼容：**\n\
    \n当前版本中的数据能否在未来版本中使用\n\n"
