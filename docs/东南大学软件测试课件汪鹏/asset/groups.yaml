    重庆乐客睿睿信息技术有限公司


    # “上海软件中心杯”

    开发测试大赛


    个人赛

    参赛会提供来自开源社区的Java样例代码，在赛测平台的Eclipse客户端上完成JUnit测试脚本。

    比赛时间：2017年10月15日9:00-12:00


    # “智测云杯”

    移动应用测试大赛


    个人赛

    比赛会提供来自业界的移动应用测试需求，在赛测平台的Eclipse客户端上完成Appium测试脚本。

    比赛时间：2017年10月14日14:00-17:00


    # “安恒杯”

    Web安全测试大赛


    个人赛

    组委会提供不同知识点的Web安全测试靶机，通过手工测试和根据项目中的flag提交文章评分解得相应分数。

    比赛时间：2017年10月15日14:00-18:00


    # “凯云杯”

    嵌入式测试大赛


    个人赛

    组委会提供基于国产四核的嵌入式测试任务，对根据嵌入式应用进行基于工的自动化检查测试。

    比赛时间：2017年10月14日8:30-12:50


    # “环海评测杯”

    移动应用测试大赛


    团体赛3人

    组委会提供来自业界企业的特移动应用和测试需求，全部赛平台的Eclipse客户端上完成Appium测试脚本。

    比赛时间：2017年10月14日14:00-17:00


    # “众蚁杯”

    Web应用测试大赛


    团体赛3人

    组委会提供来自业界企业的特Web应用测试，在Eclipse Selenium和Jenkins上分别完成功能测试和性能测试脚本。

    比赛时间：2017年10月14日8:30-12:30


    五大成绩组成综合证书

    36万总奖金

    5万+N分赛区奖金

