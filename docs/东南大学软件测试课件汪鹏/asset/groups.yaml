    ### 软件测试的过程


    **Step1：拟定测试计划**


    确定测试的目标和范围、测试环境、测试策略、测试结果分析计划、测试报告计划、测试重用计划、时间表、测试结束标准。


    **Step2：编制测试大纲**


    软件测试活动的依据：明确测试内容、完成测试的准则、测试活动如何实施。


    **Step3：设计测试用例**


    每次测试的详细说明。


    **Step4：实施测试**


    在每个测试周期，测试工程师依据测试大纲和测试用例，通过执行被测试软件，或检查程序代码和文档，对其进行测试。


    **Step5：分析测试结果（例1，例2，例3）**


    收集测试结果：通过和未通过的测试用例。


    生成测试报告：为软件项目进展提供重要的即时参考数据。


    ### 测试用例


    测试用例定义：


    一个文档，详细说明输入、期望输出，和为一测试项所准备的一组执行条件。


    测试用例设计准则：


    - (1) 代表性：代表合理和不合理、合法和非法、边界和越界以及极限数据、各种操作环境等

    - (2) 可判定性：测试执行结果的正确性是可判定的或可评估的

    - (3) 可再现性：对同样的测试用例，系统执行结果应当相同


