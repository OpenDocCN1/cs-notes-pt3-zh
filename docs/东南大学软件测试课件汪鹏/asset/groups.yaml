    # LoadRunner——测试结果分析


    # 内存分析方法


    +   1. 首先查看可用内存（Memory\\Available Mbytes）计数器指标。若值较小则可能有内存问题，需进一步分析。


    +   2. 注意 Pages/sec、Pages Read/sec 和 Page Faults/sec 计数器的值。Pages/sec 和 Page Faults/sec
    的值持续很高，很可能内存问题；若 Pages Read/sec 的值超过 5，则可判断存在内存问题。


    +   3. 根据 Physical Disk 计数器的值分析性能瓶颈。如果磁盘的 Average Disk Queue Length 计数器增加的同时 Pages
    Read/sec 并未降低，则可判断内存有问题。'
  - '[PAGE 607]


    # LoadRunner——测试结果分析


    # 处理器分析方法


    +   1. 首先查看 System\%Total Processor Time 计数器的值。该值体现的是 CPU 的平均利用率，若超过 90%，则说明存在处理器方面的瓶颈。

    +   2. 其次查看每个 CPU 的 Processor\%User Time 计数器的值。若应用服务器的 %User Time 值较大，可以考虑是否能通过算法优化等方法降低这个值。若数据库服务器的
    %User Time 值较大，可考虑对数据库系统进行优化。

    +   3. 查看 System\Processor Queue Length 计数器的值。当该值大于 CPU 数量的总数 +1 时，说明存在处理器方面的问题。'
  - '[PAGE 608]


    # LoadRunner——测试结果分析


    # 磁盘I/O分析方法


    +   1. **查看%Disk Time计数器的值。** 该值较大，则可能存在磁盘瓶颈问题。

    +   2. **与Processor\Privileged Time合并进行分析。** 若%Disk Time值较大，而Processor\Privileged
    Time的值适中，则可判断存在磁盘问题。若Processor\Privileged Time较大，持续超过80%，则可能是内存泄漏。

    +   3. **根据Disk sec/Transfer进行分析。** 该值超过60ms，则磁盘存在问题。'
