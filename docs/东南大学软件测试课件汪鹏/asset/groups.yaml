    \ # 黑盒测试基本概念\n\n## ## 定义\n\n黑盒测试：一种基于规格说明，不要求考察代码，以用户视角进行的测试\n\n其它称谓：\n\n功能测试、基于规格说明的测试\n\
    \n## # 黑盒测试基本概念\n\n## ## ▪意义\n\n- 1. 检查明确需求和隐含需求\n- 2. 采用有效输入/输出和无效输入/输出\n- 3.\
