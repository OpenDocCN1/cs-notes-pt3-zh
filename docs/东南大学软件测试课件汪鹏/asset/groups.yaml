    # 软件测试

    Software Testing


    # 2017

    全国大学生软件测试大赛

    National Student Contest of Software Testing


    http://mooctest.org


    # 七大分赛区


    江苏网宿科技股份有限公司

    广东明源软件科技有限公司

    山东浪潮软件科技有限公司

