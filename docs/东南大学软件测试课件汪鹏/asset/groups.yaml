    - 5. 可用性与易获得性测试

    - 6. 面向对象系统测试

    - 7. Web测试


    可用性与易获得性测试：

    确认产品的易用性、美感以及是否方便行动不便的用户。


    面向对象系统测试：

    针对采用面向对象技术开发的软件所的测试技术。


    Web测试：

    发现存在于web应用中的内容、功能、性能、安全性等方面的错误的测试活动集。


