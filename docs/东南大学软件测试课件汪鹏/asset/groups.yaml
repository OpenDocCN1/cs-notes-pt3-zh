    \n## 软件测试的成长\n\n> 我们可以通过考察测试过程模型随时间的变化以及专业化程度的提升来追溯软件测试工程的演进。当前对良好软件测试实践的定义涉及某种预防性方法。\n\
    \nDAVID GELPERIN and BILL HETZEL\n\nGelperin, D.; B. Hetzel (1988). \"The Growth\
    \ of Software Testing\". CACM 31 (6)\n\n在过去的四十年里，随着数字计算机的使用多样化并增加，以及软件失败成本相应增加，测试的重要性日益增长。在此期间，我们对如何使测试成为一种具有成本效益的过程的理解也在增长。这种理解的增长表现为测试过程模型的演进。随着理解的增长在大型人群中从不均匀，测试的需求和能力导致了不同的测试成功定义。未被识别的心智模型差异导致了客户、经理、分析师、程序员和测试人员之间以及内部的沟通混乱。\n\
    \n由于存在同时的多重模型，导致了混乱。因为测试与编码一样古老，所以与软件相关的大多数人都对测试有一个心智模型。然而，在测试范围的定义以及沟通和同化的差异化规则方面存在显著差异，今天实践中可以找到所有模型在演进中的例子。\n\
    \n本文描述了主要的过程模型，并描述了一些与测试成长相关的变化。基于专业标准的最新模型与最佳行业实践进行了比较，以突出差异。\n\n### 主要模型概述\n\
    \n我们区分了图1中列出的四个主要测试模型。这些模型主要通过活动范围和主要目标来区分。\n\n### 活动范围\n\n两种阶段模型都将执行作为主要测试活动，因为执行实现了其主要目标。虽然它们承认测试计划和数据选择是有效执行的前提，但它们强烈地将“测试”一词与“测试执行”联系起来，以至于这两个术语几乎同义。这种强关联导致了测试是生命周期阶段的观点。这种在许多组织中仍然盛行的测试观点表达在“编码和测试”这一短语中。\n\
    \n生命周期模型将测试的重点从项目的末尾转移到其开始。这种转变导致了测试不是影响软件实现的顺序阶段，而是与软件需求和设计并行影响的观点。测试被视为从项目非常开始就与开发活动强烈互动。我们将测试在计划、设计、实现、执行中的活动与软件分析（如时序分析、数据流分析、正确性证明）和软件评审（包括走查和检查）等其他评估活动区分开来。两个生命周期\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_35_0.png)\n\nDavid Gelperin\n\n![](img/88f667f5480db09ef600e4e177b09268_35_1.png)\n\
    \nBook of Bill Hetzel\n\n"
