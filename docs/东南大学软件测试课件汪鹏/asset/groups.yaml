  md: "\n## LoadRunner——基础知识\n\n- LoadRunner的概念解析\n- LoadRunner的工作原理\n- LoadRunner的使用\n\
    \  - 脚本录制与开发\n  - 场景创建与执行\n  - 测试结果分析\n\n## LoadRunner——支持协议\n### LoadRunner支持的协议\n\
    \n- **Client/Server:** MS SQL, ODBC, Oracle, DB2, Sybase, Sockets…\n- **Custom:**\
    \ C, Visual Basic, Java…\n- **Distributed Components:** COM/DCOM, CORBA, RMI\n\
    - **E-Business:** FTP, Palm, SOAP, Web…\n- **ERP/CRM:** SAP, Oracle, PeopleSoft,\
    \ Siebel…\n- **Mailing Services:** IMAP, MS Exchange, POP3, SMTP\n- **Wireless:**\
    \ WAP, VoiceXML…\n\n![](img/88f667f5480db09ef600e4e177b09268_549_0.png)\n\n##\
    \ LoadRunner——架构\n### LoadRunner架构\n\n四个组成部分：\n\n- 1. **虚拟用户发生器（Vuser Generator，VuGen）**：捕获业务流程和创建自动化测试脚本，即自动生成大部分测试脚本。\n\
    - 2. **压力调度和监控中心（Controller）**：运行和监视测试脚本\n- 3. **压力产生器（Load Generator）**：产生虚拟客户端的请求，用来在服务器上创建负载。\n\
    - 4. **压力结果分析工具（Analysis）**：集成数据统计分析功能，自动生成测试报告文档\n\n## LoadRunner——工作原理\n###\
    \ LoadRunner 工作原理\n### How LoadRunner Works\n\n- 1. The Controller is a central\
    \ console from which the load test is managed and monitored.\n- 2. Thousands of\
    \ virtual users perform real-life transactions on a system to emulate production\
    \ traffic.\n- 3. Real-time monitors capture performance data across all tiers,\
    \ servers and network resources, and display information on the Controller.\n\
    - 4. Results are stored in a database repository, allowing users to generate reports\
    \ and perform analysis.\n\n![](img/88f667f5480db09ef600e4e177b09268_552_0.png)\n\
    \nApplication Under Test\n\nLoadRunner Controller\n\n### LoadRunner内部结构\n\nLoadRunner\
    \ 测试工作流程 1-22\n\n详见 LoadRunner 自带说明文档\n\n## LoadRunner——测试步骤\n### LoadRunner测试步骤\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_555_0.png)\n\n- 1. 制定性能测试计划\n- 2. 录制并修改Vuser脚本（事务、参数化、关联）\n\
    - 3. 方案场景描述测试活动中发生的各种事件（集合点）\n- 4. 运行场景并实时监测\n- 5. 分析数据，生成性能评估报告\n\n## LoadRunner——部署和安装\n\
    \n注意事项：\n\n- 1. LoadRunner对浏览器的支持：\n  - 8.x支持IE6，支持IE更高版本需要安装补丁FP4；\n  - 9.x支持IE7-8、Firefox，但不稳定\n\
