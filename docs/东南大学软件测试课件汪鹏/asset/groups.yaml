    \n## THE GROWTH OF SOFTWARE TESTING\n\n> We can trace the evolution of software\
    \ test engineering by examining changes in the testing process model and the level\
    \ of professionalism over the years. The current definition of a good software\
    \ testing practice involves some preventive methodology.\n\nDAVID GELPERIN and\
    \ BILL HETZEL\n\nGelperin, D.; B. Hetzel (1988). \"The Growth of Software Testing\"\
    . CACM 31 (6)\n\nOver the past four decades, as the use of digital computers diversified\
    \ and increased with a corresponding increase in the cost of software failure,\
    \ the importance of testing grew. During this period, our understanding of how\
    \ to make testing a cost-effective process grew as well. This growth in understanding\
    \ was marked by a progression of testing process models. As growth in understanding\
    \ is never uniform over a large population, testing’s needs and capabilities that\
    \ have resulted in different definitions of testing success. Unrecognized differences\
    \ in mental models have resulted in confused communication between and among customers,\
    \ managers, analysts, programmers and testers.\n\nWith simultaneous multiple models\
    \ has come confusion. Since testing is as old as coding, most people involved\
    \ with software have a mental model of testing. However, there are significant\
    \ differences in the definition of testing’s scope and differential rules of communication\
    \ and assimilation, examples of all models in the progression can be found in\
    \ practice today.\n\nThis article characterizes the major process models and describes\
    \ some of the changes associated with testing’s growth. A recent model based on\
    \ professional standards is compared with the best industry practice to highlight\
    \ differences.\n\n### OUTLINE OF THE MAJOR MODELS\n\nWe distinguish the four major\
    \ testing models listed in Figure 1. These models are primarily differentiated\
    \ by scope of activity and primary goal.\n\n### Scope of Activity\n\nBoth phase\
    \ models focus on execution as the primary testing activity because execution\
    \ achieves their primary objectives. While they acknowledge test planning and\
    \ data selection as prerequisites to effective execution, they strongly associate\
    \ the word “testing” with “test execution” to the point where the terms are virtually\
    \ synonymous. This strong association has resulted in the view that testing is\
    \ a life cycle phase. This view of testing expressed in the phrase “code and test”\
    \ is still prevalent in many organizations.\n\nThe life cycle models move the\
    \ focus of testing from the end of a project to its beginning. This shift results\
    \ in the view that testing is not a sequential phase affecting just the software\
    \ implementation, but is on a parallel track affecting software requirements and\
    \ designs as well. Testing is seen as strongly interacting with development activities\
    \ from the very beginning of a project. We distinguish testing in planning, design,\
    \ implementation, execution from other evaluation activities such as software\
    \ analysis (e.g., timing analysis, data flow analysis, proof of correctness) and\
    \ software reviews (including walkthroughs and inspections). The two life cycle\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_35_0.png)\n\nDavid Gelperin\n\n![](img/88f667f5480db09ef600e4e177b09268_35_1.png)\n\
    \nBook of Bill Hetzel\n"
