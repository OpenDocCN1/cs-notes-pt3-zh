  - '[PAGE 376]


    # 单元测试——测试关注点


    # 模块或构件接口


    目标：


    选出模块/构件的数据流正确


    关注点：


    +   1. 接口名称、参数个数、类型、匹配顺序

    +   2. 输出或返回值及其类型是否正确'
  - '[PAGE 377]


    # 单元测试——测试关注点


    # 局部数据结构


    目标：


    数据在模块执行过程中维持完整性和正确性


    关注点：


    +   (1) 数据结构定义和使用过程的正确性

    +   (2) 局部数据结构对全局数据结构的影响'
  - '[PAGE 378]


    # 单元测试——测试关注点


    # 边界条件


    目标：


    保证模块在条件边界上能够正确执行


    # 关注点：


    +   1. 数据结构中的边界（例如：数组 a[n]）

