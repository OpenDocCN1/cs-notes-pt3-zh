    跟踪被测程序的执行过程，人工收集信息\n\n程序插桩技术最早是由J.C. Huang 教授提出的，它是在保证被测程序原有逻辑完整性的基础上在程序中插入一些探针（又称为“探测仪”），通过探针的执行并抛出程序运行的特征数据，通过对这些数据的分析，可以获得程序的控制流和数据流信息，进而得到逻辑覆盖等动态信息，从而实现测试目的的方法。\n\
    \n![](img/88f667f5480db09ef600e4e177b09268_425_0.png)\n\n### 测试插桩基础\n\n**原理：**\n\
    在程序特定部位附加一些操作或功能，用来检验程序运行结果以及执行特性，以便支持测试\n\n**两类插桩技术：**\n- 白盒测试插桩技术\n- 黑盒测试插桩技术\n\
    \n**白盒测试插桩**\n\n**作用：**\n- 1. 生成特定状态，检验状态的可达性；\n- 2. 显示或读取内部数据或私有数据；\n- 3. 监测不变数据；\n\
    - 4. 监测前提条件；\n- 5. 人为触发事件；\n- 6. 监测事件时间\n\n**插桩方式一：目标代码插桩**\n\n**优点：**\n- 目标代码的格式主要和操作系统相关，和具体的编程语言及版本无关，应用范围广；\n\
    - 特别适合在需要对内存进行监控的软件中使用\n\n**缺点：**\n- 目标代码中语法、语义信息不完整\n\n**插桩方式二：源代码插桩**\n\n**优点：**\n\
    在词法分析和语法分析的基础上进行的，这就保证对源文件的插桩能够达到很高的准确度和针对性。\n\n**缺点：**\n工作量较大，而且随着编码语言和版本的不同需要做一定的修改\n\
    \n**插桩问题1：探测什么信息？**\n\n**Answer:** 由具体需求而定\n\n- 覆盖率？\n- 中间结果？\n- 测试数据生成？\n- 统计信息？\n\
    - …\n\n**插桩问题2：插桩位置？**\n\n**Answer:** 由具体需求而定。\n\n**原则：**\n探针的植入要做到紧凑精干，才能保证做到收集的信息全面而无冗余，减少代码的膨胀率。\n\
    \n**探针的植入常见位置：**\n- a. 程序的第一条语句；\n- b. 分支语句的开始；\n- c. 循环语句的开始；\n- d. 下一个入口语句之前的语句；\n\
    - e. 程序的结束语句；\n- f. 分支语句的结束；\n- g. 循环语句的结束；\n\n**插桩问题3：探测点数目？**\n\n**Answer:**\
    \ 个数越少越好\n\n插桩会影响原有程序执行的效率\n\n很多测试工具能根据需求进行自动插桩\n\n**常用插桩策略：**\n\n**语句覆盖插桩（基本块插桩）：**\
    \ 在基本块的入口和出口处，分别植入相应的探针，以确定程序执行时该基本块是否被覆盖。\n\n**分支覆盖插桩：** 分支由分支点确定。对于每个分支，在其开始处植入一个相应的探针，以确定程序执行时该分支是否被覆盖。\n\
    \n**条件覆盖插桩：** if, switch, while, do-while, for 几种语法结构都支持条件判定，在每个条件表达式的布尔表达式处植入探针，进行变量跟踪取值，以确定其被覆盖情况。\n\
    \n**例：分析覆盖率和测试用例有效性**\n\n求整数X和Y的最大公约数\n\n程序的插桩\n\n![](img/88f667f5480db09ef600e4e177b09268_435_0.png)\n\
    \n**例：断言检测**\n\n断言：在程序特定部位插入用以证实程序某些特性的语句\n\n```\nvoid *memcpy(void *pvTo, const\
    \ void *pvFrom, size_t size)\n{\n    assert((pvTo != NULL) && (pvFrom != NULL));\n\
    \    byte *pbTo = (byte *) pvTo;\n    byte *pbFrom = (byte *) pvFrom;\n    while(size\
    \ -- > 0) *pbTo ++ = *pbFrom ++;\n    return pvTo;\n}\n```\n\n**黑盒测试插桩**\n\n**作用：**\n\
    - 1. 测试预言（Test Oracle）\n- 2. 随机数据生成\n\n**测试预言插桩**\n\n**定义：**\n一种独立于被测系统的程序或机制，用于确认对于给定的输入，系统是否有一个预期输出。\n\
