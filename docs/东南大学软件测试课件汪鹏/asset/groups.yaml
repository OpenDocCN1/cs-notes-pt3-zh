    # 回归测试意义：


    +   1. 保证软件维护时未更改的代码功能不会受到影响

    +   2. 保证软件模块区域和持续维护过程与回归测试的协作关系，使回归测试成为一个每月/每周/每日的常规活动

    +   3. 实现软件整个生命周期的测试'
