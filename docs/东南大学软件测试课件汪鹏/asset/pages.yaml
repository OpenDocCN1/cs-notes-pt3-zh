- pgno: 385
  md: '# 单元测试规程


    # 驱动器和程序桩


    # 驱动器（Driver）：


    对底层或子层模块进行测试时所编制的调用被测模块的程序，用以模拟被测模块的上级模块。


    接收测试数据，并把数据传送给被测模块，最后输出相关结果。


    ![](img/88f667f5480db09ef600e4e177b09268_385_0.png)'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# 单元测试规程


    # 驱动器和程序桩


    # 桩程序（Stub）：


    对上层模块进行测试时，所编制的替代下层模块的程序，用以模拟被测模块工作过程中所调用的模块。


    模拟未被测试模块/隶属模块的功能


    ![](img/88f667f5480db09ef600e4e177b09268_386_0.png)'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# 单元测试规程


    # 驱动器和程序桩


    # 驱动器结构一般如下：


    +   数据说明；

    +   初始化；

    +   输入测试数据；

    +   调用被测模块；

    +   输出测试结果；

    +   停止


    # 桩程序结构一般如下：


    +   数据说明；

    +   初始化；

    +   输出提示信息（表示进入了哪个桩模块）

    +   验证调用参数；

    +   打印验证结果；

    +   将模拟结果送回被测程序；

    +   返回'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# 单元测试规程


    # 手工和自动化测试


    # 手工测试：


    按照需求规格设计测试用例完成测试

    静态测试


    # 自动测试：


    自动化方法的效果：有效验证较为独立单元的正确性


    单元测试驱使程序员创建松耦合、高内聚的代码体，有助于开发健壮的软件'
  merge: -1
