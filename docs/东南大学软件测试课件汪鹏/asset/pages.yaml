  md: '# 灰盒测试简介


    # 白盒-黑盒-灰盒


    | | 白盒测试 | 黑盒测试 | 灰盒测试 |

    |---|---|---|---|

    | 代码依赖 | 需要源代码 | 不需要源代码 | 需要了解实现的有

    限细节 |

    | 实施时机 | 单元测试 | 单元测试后 | 集成测试前期 |

    | 实施者 | 开发人员 | 测试人员 | 测试人员 |

    | 关注对象 | 内部实现 | 功能需求 | 二者兼有 |

    | 测试方法 | 代码审查和代码

    分析 | 设计并执行测

    试用例 | 编写测试代码 |

    | 是否必须 | 不能被取代 | 不能被取代 | 可被黑盒测试取

    代 |'
