  md: '# 非功能系统测试


    # ■ 非功能系统测试方法


    非功能测试的最大挑战：**设置配置**


    **原因：**


    +   1. 难以预测客户使用的环境

    +   2. 对配置进行组合测试的代价太高

    +   3. 建立测试环境成本高

    +   4. 很难准确预测客户使用的数据


    **两种方法：** 模拟环境 和 真实客户环境'
