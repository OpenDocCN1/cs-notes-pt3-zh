- pgno: 165
  md: '# 正面和负面测试用例


    # 正面测试


    正面测试用例：


    测试用例通过一组预期输入输出验证产品需求


    目的：


    证明软件对于每条规格说明和期望都能通过


    注意：预期产品给出一个错误时它确实给出该错误，这也是正面测试的一部分


    正面测试用于验证已知测试条件，证明软件可以完成所期望的工作'
  merge: -1
  img_proc: true
- pgno: 166
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 正面和负面测试用例


    # 负面测试


    负面测试：

    展示当输入非预期输入时产品没有失败


    目的：

    使用产品没有设计和预想到的场景，尝试使系统堵塞


    负面测试用于通过未知条件把产品搞垮'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 正面和负面测试用例


    # 负面测试


