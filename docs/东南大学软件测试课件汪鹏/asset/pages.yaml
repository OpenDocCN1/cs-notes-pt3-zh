- pgno: 169
  md: '# 正面和负面测试用例


    # 正面测试VS负面测试


    | | 正面测试 | 负面测试 |

    |---|---|---|

    | 测试条件 | 根据需求说明规格 | 测试条件都在需求规格说明之外 |

    | 目的 | 验证需求规格说明的正确性 | 通过未知条件搞垮软件 |

    | 覆盖率计算 | 覆盖需求和条件 | 没有覆盖率 |

    | 挑战性 | 根据规格说明设计测试用例 | 需要高度创造性产生尽可能多的未知条件 |'
  merge: -1
  img_proc: true
