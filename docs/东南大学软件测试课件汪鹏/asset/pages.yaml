  md: '# 集成测试策略


    瞬时集成测试


    缺陷：


    +   - 无休止的错误：

    +     错误很多；

    +     错误修复很困难；

    +     修正错误后，新的错误马上出现

    +   - 模块一次性结合，难以找出错误原因

