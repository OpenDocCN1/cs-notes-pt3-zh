- pgno: 304
  md: '# # 黑盒测试方法——正交数​​组测试


    # ■ 正交数​​组测试背景


    # 拉丁方：


    古希腊，国王在检阅臣民方队时，要求每行有一个民族的代表，每列也要有一个民族的代表。


    **n阶拉丁方：** 用 n 个不同的拉丁字母排成一个 n 阶方阵（n<26），如果每行的 n 个字母均不相同，每列的 n 个字母均不相同，则称这种方阵为
    n*n 拉丁方或 n 阶拉丁方。每个字母在任一行、任一列中只出现一次。


    | 1 | 2 | 3 |

    |---|---|---|

    | 2 | 3 | 1 |

    | 3 | 1 | 2 |


    3阶拉丁方'
  merge: -1
  img_proc: true
