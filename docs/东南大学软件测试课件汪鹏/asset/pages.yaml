- pgno: 211
  md: '# 黑盒测试方法——边界值分析


    # 边界值类型


    +   - 边界值数据类型

    +     数值 速度 字符 地点

    +     位置 尺寸 数量 ...


    +   - 边界特征

    +     第一个/最后一个 最小值/最大值

    +     开始/完成 空/满 最短/最长

    +     最慢/最快 最早/最迟 最大/最小'
  merge: -1
