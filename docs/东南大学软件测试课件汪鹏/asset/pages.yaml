    # 系统测试的实施原因


    +   1. 在测试中引入独立视角

    +      独立测试团队；直接向高层报告

    +   2. 在测试中引入客户视角

    +      消除对产品的偏见

    +   3. 在测试中模拟客户使用环境

    +      正式、完备和现实的测试环境'
  merge: -1
