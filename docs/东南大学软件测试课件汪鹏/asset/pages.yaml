- pgno: 569
  md: '# LoadRunner——脚本录制与开发


    # Vuser Script录制流程


    +   - 创建脚本

    +   - 选择协议

    +   - 设置录制选项

    +   - 开始录制

    +   - 插入命令

    +   - 停止录制


    # 脚本组成：


    1.vuser_init:

    Vuser启动时执行一次（例：登录服务器）


    2.Action:

    可反复迭代执行多次；可以创建多个Action


    3.vuser_end:

