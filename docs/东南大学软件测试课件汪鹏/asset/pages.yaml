- pgno: 591
  md: '# LoadRunner——脚本录制与开发


    # 关联


    关联的作用：


    +   1. 简化或优化代码：

    +   例如，简化嵌套查询的代码

    +   2. 用于动态数据：应用程序或网站常用日期或时间来标识会话，因此会造成回放脚本失败；关联保存动态数据

    +   3. 容纳唯一数据记录：录制期间的唯一值在脚本执行时不再唯一，需要关联来解决'
  merge: -1
  img_proc: true
