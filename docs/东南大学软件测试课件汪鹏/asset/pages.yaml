  md: '# # 黑盒测试方法——等价划分


    # ■ 等价类划分指南


    # ● 2. 取值范围


    数据类型：连续取值范围（通常是线性）


    划分方法：


    +   1 个有效等价类

    +   2 个无效等价类


    例：输入的考试成绩在0-100之间


    有效等价类是：0 ≤ 成绩 ≤ 100

    无效等价类是：成绩<0 和 成绩>100'
  merge: -1
