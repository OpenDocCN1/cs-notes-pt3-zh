  md: '# 黑盒测试方法——边界值分析


    # 次边界条件/隐性边界


    +   - 各种数据类型的极限

    +   - `int, unsigned int, long, char, …`——一般是2的幂次

    +   - ASCII，Unicode字符

    +   - 空白，空值，零值，无输入

    +   - 屏幕分辨率决定的光标/鼠标运动范围

