  md: '# 系统测试概述


    # 系统测试=功能测试+非功能测试


    # 功能测试VS非功能测试


    | | 功能测试 | 非功能测试 |

    |---|---|---|

    | 作用/关注点 | 验证产品功能和特性 | 验证产品质量因素 |

    | 范围 | 所有测试阶段 | 系统测试 |

    | 用例失败原因 | 代码缺陷 | 体系结构、设计和代码缺陷 |

    | 预备知识 | 产品和领域 | 产品、领域、设计、体系结构、分析技能 |'
  merge: -1
