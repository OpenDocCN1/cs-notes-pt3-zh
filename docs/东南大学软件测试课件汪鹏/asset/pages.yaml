- pgno: 78
  md: '# 软件测试基本概念


    理解Bug：Fault(失效) Error(错误) Failure(失败)


    # Bug的定义：


    +   - **Software Fault**: A static defect in the software (i.e., defect)

    +   - **Software Error**: An incorrect internal state that is the manifestation
    of some faults

    +   - **Software Failure**: External, incorrect behavior with respect to the requirements
    or other description of the expected behavior'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 软件测试基本概念


    # 理解Bug：Fault(失效) Error(错误) Failure(失败)


    Programmer makes a mistake.


    Fault (defect, bug) appears in the program.


    Fault remains undetected during testing (running test inputs).


    The program fails (based on test oracles) during execution i.e., it behaves unexpectedly.


    Error: difference between computed, observed, or measured value or condition and
    true, specified, or theoretically correct value or condition'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 软件测试基本概念


    # 软件测试的原理/原则/准则


    **原理1：用户需求至上**


    所有测试都应追溯到用户需求。最严重的错误是导致软件无法满足需求的错误。


    **原理2：测试是有计划的活动**


    测试计划制定先于测试的执行；测试贯穿于全部软件生命周期。'
  merge: -1
  img_proc: true
