- pgno: 147
  md: "# # 挑战：测试用例规划\n\n```\nclass Roots {\n    // Solve ax² + bx + c = 0\n    public\
    \ roots(double a, double b, double c)\n    { ... }\n\n    // Result: values for\
    \ x\n    double root_one, root_two;\n}\n```\n\n+   - **Which values for _a_, _b_,\
    \ _c_ should we test?**\n+     - assuming a, b, c were 32-bit integers, we’d have\
    \ (2³²)³ ≈ 10²⁸ legal inputs\n+     - with 1.000.000.000.000 tests/s, we would\
    \ still require 2.5 billion years"
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 随机测试


    +   - 均匀选取可能输入值

    +   - 避免选择偏见

    +   - 对所有用例一视同仁'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 随机测试为什么不行


    +   - 缺陷分布并不均匀

    +   - Assume Roots applies quadratic equation

    +     $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

    +     and fails if $b^2 - 4ac = 0$ and $a = 0$

    +   - 随机测试很难取到特定值'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # 黑盒测试基本概念


    # ## 定义


    黑盒测试：一种基于规格说明，不要求考察代码，以用户视角进行的测试


    其它称谓：


    功能测试、基于规格说明的测试'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # 黑盒测试基本概念


    # ## ▪意义


    +   1. 检查明确需求和隐含需求

    +   2. 采用有效输入/输出和无效输入/输出

    +   3. 包含用户视角'
