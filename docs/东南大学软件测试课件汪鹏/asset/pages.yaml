- pgno: 457
  md: '# 系统测试概述


    # 系统测试概念


    # 定义：


    对完整集成后的产品和解决方案进行测试，用来评价系统对具体需求规格说明的功能和非功能 的符合性的测试


    # 目的/作用：


    +   1. 发现可能难以直接与模块或接口关联的缺陷

    +   2. 发现产品设计、体系和代码的基础问题（产品级缺陷）'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 系统测试概述


    # 系统测试概念


    **引入时机：**


    集成测试之后（基础的程序逻辑错误和缺陷已更正）


    **实施人员：**


    独立测试团队


    （引入独立视角，有助于发现遗漏缺陷）


    **特点：**


    是既测试产品功能也测试产品非功能的唯一测试阶段'
  merge: -1
  img_proc: true
