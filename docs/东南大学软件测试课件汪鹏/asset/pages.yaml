- pgno: 434
  md: '# 测试插桩


    # 测试插桩基础——白盒测试插桩


    常用插桩策略：


    **语句覆盖插桩（基本块插桩）：** 在基本块的入口和出口处，分别植入相应的探针，以确定程序执行时该基本块是否被覆盖。


    **分支覆盖插桩：** 分支由分支点确定。对于每个分支，在其开始处植入一个相应的探针，以确定程序执行时该分支是否被覆盖。


    **条件覆盖插桩：** if, switch, while, do-while, for 几种语法结构都支持条件判定，在每个条件表达式的布尔表达式处植入探针，进行变量跟踪取值，以确定其被覆盖情况。'
  merge: -1
  img_proc: true
