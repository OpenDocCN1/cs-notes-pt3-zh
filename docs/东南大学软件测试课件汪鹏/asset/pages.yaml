  md: '# 系统测试概述


    系统测试=功能测试+非功能测试


    |  | 功能测试 | 非功能测试 |

    |---|---|---|

    | 用例可重复性 | 可重复多次 | 只在沟通过的和针对不同配置时重复 |

    | 配置 | 对一组测试用例配置一次 | 每个测试用例都可能改变配置 |

    | 工作量 |  | 50%:50% ~ 30%:70% |'
