- pgno: 95
  md: '# 软件测试基本概念


    # 软件测试的类型


    视角1：测试技术（代码是否可见的通用划分）


    1.白盒测试　　2.黑盒测试　　3.灰盒测试


    **白盒测试：**

    基于软件代码的内部逻辑来设计测试用例。测试退出条件是代码覆盖率。一般由开发人员完成。


    **黑盒测试：**

    基于需求和功能性，不需要了解内部的设计和代码，通过软件外部表现来发现缺陷和错误。


    **灰盒测试：**

    介于白盒测试与黑盒测试之间的技术，既关注软件外部表现，又注意程序内部逻辑结构。'
  merge: -1
  img_proc: true
