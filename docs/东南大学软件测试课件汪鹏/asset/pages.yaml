  md: '# Myers的三角形问题自我测试


    被测程序描述：

    该程序从一个输入对话框中读取三个整数值。

    这三个整数值代表了三角形三边的长度。程序显示提示信息，指出该三角形究竟是不规则三角形、等腰三角形还是等边三角形。


    测试要求：

    设计适当的测试用例集，完成对该程序的测试。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Myers的三角形问题自我测试


    +   1. 代表有效的不规则三角形：(2, 3, 4)（3, 4, 5）

    +   2. 代表有效的等边三角形：(2, 2, 2)

    +   3. 代表有效的等腰三角形：(3, 3, 4)

    +   4. 第3类的所有情况：(3, 3, 4)（3, 4, 3）（4, 3, 3）

    +   5. 代表无效的等腰三角形：(2, 2, 4)

    +   6. 代表某边长度等于0：(3, 4, 0)

    +   7. 代表某边长度为负数：(3, 4, -5)

    +   8. 代表两边之和等于第三边：(1, 2, 3)

    +   9. 第8类的所有情况：(1, 2, 3)（1, 3, 2）（3, 1, 2）'
  merge: -1
  img_proc: true
