    # 均衡分散性：


    在同一张正交表中，任意两列（两个因子）的水平搭配（横向形成的数字对）是完全相同的。这样就保证了试验条件均衡地分散在因子水平的完全组合之中，因而具有很强的代表性，容易得到好的试验条件。'
