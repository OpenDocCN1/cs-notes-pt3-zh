  md: '# 黑盒测试方法——等价划分


    # 等价划分原理


    +   - 将软件输入和输出的值域进行划分，选择少数样本作为测试用例

    +   - 实现对无穷输入量的科学规划，极大减少测试用例数目，降低测试工作量


