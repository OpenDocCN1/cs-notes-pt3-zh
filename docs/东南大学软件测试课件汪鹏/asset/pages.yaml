    void *memcpy(void *pvTo, const void *pvFrom, size_t size)\n{\n    assert((pvTo\
    \ != NULL) && (pvFrom != NULL));\n    byte *pbTo = (byte *) pvTo;\n    byte *pbFrom\
    \ = (byte *) pvFrom;\n    while(size -- > 0) *pbTo ++ = *pbFrom ++;\n    return\
