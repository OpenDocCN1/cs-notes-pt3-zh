- pgno: 371
  md: '# 单元测试——基本概念


    # 软件单元


    软件单元(Software Unit):

    一个应用程序中的最小可测部分


    面向过程中的单元：

    单独的程序、函数、过程、网页、菜单、...


    面向对象中的单元：

    类（基类、抽象类、子类）'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# 单元测试——基本概念


    # 定义


    单元测试(Unit Testing)/模块测试(Module Testing):

    对最小的软件设计单元（模块/源程序单元）的验证工作


    # 意义


    +   1. 消除软件单元本身的不确定性

    +   2. 其它测试阶段的必要的基环节


    # 实施者


    软件开发人员'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# # 单元测试——基本概念


    # ## 测试目标


    +   - 单元体现了预期的**功能（黑盒 白盒）**

    +   - 单元的运行能覆盖预定的各种**逻辑（白盒）**

    +   - 单元工作中内部**数据**能够保持完整性（**白盒**）

    +   - 可接受**正确数据**，也能处理**非法数据（黑盒）**

    +   - 在数据**边界**条件上，单元能正确工作（**黑盒**）

    +   - 单元的算法合理，**性能**良好（**黑盒**）

    +   - 扫描单元代码未发现任何**安全性**问题（**白盒**）


    ……'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# # 单元测试——基本概念


    # ## 测试技术


    **白盒测试技术：**

    使用一种或多种白盒测试方法**分析模块的逻辑结构**


    **黑盒测试技术：**

    使用黑盒测试方法对照模块的**规格说明**以补充测试用例'
  merge: -1
  img_proc: true
- pgno: 375
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 单元测试——测试关注点


    # 模块或构件接口


    目标：


    选出模块/构件的数据流正确


    关注点：


    +   1. 接口名称、参数个数、类型、匹配顺序

    +   2. 输出或返回值及其类型是否正确'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 单元测试——测试关注点


    # 局部数据结构


    目标：


    数据在模块执行过程中维持完整性和正确性


    关注点：


    +   (1) 数据结构定义和使用过程的正确性

    +   (2) 局部数据结构对全局数据结构的影响'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# 单元测试——测试关注点


    # 边界条件


    目标：


    保证模块在条件边界上能够正确执行


    # 关注点：


    +   1. 数据结构中的边界（例如：数组 a[n]）

    +   2. 控制流中的边界（例如：循环次数、判断条件）'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 单元测试——测试关注点


    # 独立路径


    目标：

    保证模块中的每条独立路径(基本路径)都被覆盖，使得所有语句都被执行过一次


    关注点：

