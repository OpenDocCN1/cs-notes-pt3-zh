- pgno: 532
  md: '# 性能测试基础——模型


    # 性能测试模型/策略


    +   1. 预期指标性能测试：

    +   针对需求和设计阶段提出的性能指标而进行的测试。

    +   （性能测试基本要求）


    +   2. 独立业务性能测试：

    +   核心业务模块是性能测试重点


    +   3. 组合业务性能测试：

    +   模拟多个用户，对多项业务进行组合性能测试（接近用户使用系统的真实情形）'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# 性能测试基础——模型


    # 性能测试模型/策略


    +   4. 疲劳强度性能测试：

    +   以一定负载长时间运行系统，测试系统长时间处理大量业务的能力和稳定性


    +   5. 大数据量性能测试：

    +   测试运行时数据量较大或历史数据量较大时的性能情况


    +   6. 网络性能测试：

    +   确认带宽、延迟、负载和端口变化对用户响应时间影响


    +   7. 服务器性能测试：

    +   确认数据库、Web服务器等瓶颈'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# 性能测试基础——原则


    # 性能测试原则


    成本最优原则：

    投入的测试成本能否使系统满足预先确定的性能目标


    策略为中心原则：

    测试策略决定测试用例设计和测试实施


    适当裁剪原则：

    对测试用例包含的内容进行合理裁剪，既满足测试需求，也节约测试成本


    模型完善原则：

    具体测试中对模型不断调整、补充、完善，使之满足测试目的'
  merge: -1
  img_proc: true
