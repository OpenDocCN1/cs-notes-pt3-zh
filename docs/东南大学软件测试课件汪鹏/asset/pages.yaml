- pgno: 210
  md: '# 黑盒测试方法——边界值分析


    # 边界值分析原理


    缺陷易出现在边界处的原因：


    +   （1）使用比较操作符时未仔细分析


    +   （2）循环和条件检查方法引起的困惑


    +   （3）对边界附近需求的理解不够'
  merge: -1
