  md: '# 黑盒测试方法——边界值分析


    # 边界值测试用例确定方法


    # 独立参数的变量的边界值


    n: 存在边界值的参数个数


    方法一：基本边界测试


    对每个参数取4个边界值


    +   Min, Min+1,

    +   Max-1, Max


    计算公式：4n+1


    > Paul C. Jorgensen, Software Testing: A Craftsman’s Approach (1995)'
  merge: -1
  img_proc: true
