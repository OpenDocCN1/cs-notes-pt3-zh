  md: '# 黑盒测试方法——等价划分


    # 等价类（等价划分）


    **有效等价类：**


    有意义的输入输出数据构成的集合


    特点：满足产品规格说明的数据


    **无效等价类：**


    无意义的输入输出数据构成的集合


    特点：不满足产品规格说明的数据'
