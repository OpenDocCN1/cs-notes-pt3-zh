- pgno: 88
  md: '# 软件测试基本概念


    # 测试用例


    测试用例设计准则：


    +   (1) 代表性：

    +   代表合理和不合理、合法和非法、边界和越界以及极限数据、各种操作环境等

    +   (2) 可判定性：

    +   测试执行结果的正确性是可判定的或可评估的

    +   (3) 可再现性：

    +   对同样的测试用例，系统执行结果应当相同'
