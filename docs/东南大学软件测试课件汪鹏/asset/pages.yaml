  md: '# 软件测试基本概念


    # 软件测试的类型


    视角2：开发阶段/TestLevel


    +   1. 单元测试　　2. 集成测试　3. 系统测试　　4. 性能测试

    +   5. 确认测试　　6. 验收测试　7. 回归测试


    **系统测试：**

    测试整个系统的行为和错误属性。


    **性能测试：**

    评价系统响应时间、吞吐率等系统属性，并与不同版本或竞争产品进行比较。


    **确认测试：**

    验证软件是否可以按照用户合理的期望方式工作。'
