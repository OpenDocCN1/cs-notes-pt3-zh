- pgno: 551
  md: '# LoadRunner——架构


    # LoadRunner架构


    +   1. 虚拟用户发生器（Vuser Generator，VuGen）

    +   捕获业务流程和创建自动化测试脚本，即自动生成大部分测试脚本。


    +   2. 压力调度和监控中心（Controller）

    +   运行和监视测试脚本


    +   3. 压力产生器（Load Generator）

    +   产生虚拟客户端的请求，用来在服务器上创建负载。


    +   4. 压力结果分析工具（Analysis）

    +   集成数据统计分析功能，自动生成测试报告文档'
  merge: -1
  img_proc: true
