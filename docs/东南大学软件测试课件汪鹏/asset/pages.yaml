- pgno: 425
  md: '# 测试插桩


    # 测试插桩背景


    程序插桩技术最早是由J.C. Huang 教授提出的，它是在保证被测程序原有逻辑完整性的基础上在程序中插入一些探针（又称为“探测仪”），通过探针的执行并抛出程序运行的特征数据，通过对这些数据的分析，可以获得程序的控制流和数据流信息，进而得到逻辑覆盖等动态信息，从而实现测试目的的方法。


    ![](img/88f667f5480db09ef600e4e177b09268_425_0.png)'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# 测试插桩


    # 测试插桩基础


    # 原理：


    在程序特定部位附加一些操作或功能，用来检验程序运行结果以及执行特性，以便支持测试


    # 两类插桩技术：


    +   (1) 白盒测试插桩技术

    +   (2) 黑盒测试插桩技术'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# 测试插桩


    # 测试插桩基础——白盒测试插桩


    # 作用：


    +   1. 生成特定状态，检验状态的可达性；

    +   2. 显示或读取内部数据或私有数据；

    +   3. 监测不变数据；

    +   4. 监测前提条件；

    +   5. 人为触发事件；

    +   6. 监测事件时间'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# 测试插桩


    # 测试插桩基础——白盒测试插桩


    # 插桩方式一：目标代码插桩


    # 优点：


    +   - 目标代码的格式主要和操作系统相关，和具体的编程语言及版本无关，应用范围广；

    +   - 特别适合需要对内存进行监控的软件中


    # 缺点：


    +   - 目标代码中语法、语义信息不完整'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 测试插桩


    # 测试插桩基础—白盒测试插桩


    # 插桩方式二:源代码插桩


    # 优点：


    +   词法分析和语法分析的基础上进行的，这就保证对源文件的插桩能够达到很高的准确度和针对性。


    # 缺点：


    +   工作量较大，而且随着编码语言和版本的不同需要做一定的修改'
  merge: -1
  img_proc: true
