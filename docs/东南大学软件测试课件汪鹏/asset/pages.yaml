- pgno: 494
  md: '# # 回归测试基础


    # ## 回归测试概念


    # ## 回归测试特点：


    +   1. **测试计划**

    +      - 常规测试：已有的带有测试用例的测试计划

    +      - 回归测试：更改的规格说明书、修改过的程序和需要更新的旧测试计划


    +   2. **测试范围**

    +      - 常规测试：整个程序

    +      - 回归测试：被修改部分正确性以及它与原有功能的整合


    +   3. **时间分配**

    +      - 常规测试：测试时间实现有预算

    +      - 回归测试：测试时间不包含在进度表中'
  merge: -1
  img_proc: true
