- pgno: 538
  md: '# # 性能测试——测试自动化


    # ## 自动化测试优点


    +   1. 测试速度快

    +   2. 测试结果准确

    +   3. 高复用性

    +   4. 永不疲劳

    +   5. 可靠：


    计算机不会弄虚作假


    +   6. 能力：


    有些手工测试做不到的地方，自动化测试可以做到。例如，在性能测试中模拟1000个用户同时访问网站'
  merge: -1
  img_proc: true
- pgno: 539
  md: '# 性能测试——测试自动化


    # 正确认识自动化测试


    +   - 自动化测试有助于**提高软件开发效率、缩短开发周期、节省人力资源**等

    +   - 机器执行测试用例按部就班，**没有变通和创造力**

    +   - 人具有创造力，可以举一反三，从一个测试想到其它测试情景。

    +   - 资料显示，**良好的自动化测试只能发现30%的问题，70%的问题还是由手工发现。**

    +   - 对于复杂的逻辑判断、界面是否友好手工测试具有优势

    +   - 自动化测试更适合于负载测试、性能测试和回归测试'
  merge: -1
  img_proc: true
- pgno: 540
  md: '# 性能测试——测试自动化


    # ■ 不同测试阶段中的自动化测试


    | 测试类型 | 自动化测试应用特点 |

    |---|---|

    | 单元测试 | 静态测试和动态测试均可借助工具实现一定程度的自动化 |

    | 冒烟测试 | 自动化实现每日集成每日构建后的测试 |

    | 功能测试 | 基本操作和数据验证可以实现自动化测试 |

    | 负载测试<br>性能测试 | 一般只能由自动化测试工具完成 |

    | 回归测试 | 自动化测试最能发挥作用的地方，应尽量实现自动化 |

    | 验收测试<br>确认测试 | 自动化测试和手工测试协同完成 |'
  merge: -1
  img_proc: true
