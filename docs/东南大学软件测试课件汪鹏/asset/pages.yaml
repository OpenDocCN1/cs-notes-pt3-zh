    # 正交表


    # 四、正交表的正交性


    **整齐可比性：** 在同一张正交表中，每个因子的每个水平出现的次数是完全相同的。每个因子的每个水平与其它因子的每个水平参与试验的机率是完全相同的，这就保证在各个水平中最大程度排除了其它因子水平的干扰。'
  merge: -1
