    # # 设计模式方法分类


    # ## 1、Coad的面向对象模式


    1992年，美国面向对象技术大师 Peter Coad 从MVC的角度对面向对象系统进行了讨论，设计模式由最底层的构成部分（类和对象）及其关系来区分。他使用了一种通用的方式来描述一种设计模式：


    +   1. 模式所能解决问题的简要介绍与讨论；

    +   2. 模式的非形式文本描述以及图形表示；

    +   3. 模式的使用方针：在何时使用以及能够与哪些模式结合使用。'
  - '[PAGE 324]


    # 设计模式分类


    # 1、Coad的面向对象模式


    将Coad的模式划分为以下三类：


    +   （1）**基本的继承和交互模式**：主要包括OOPL所提供的基本建模功能，继承模式声明了一个类能够在其子类中被修改或被补充，交互模式描述了在有多个类的情况下消息的传递。


    +   （2）**面向对象软件系统的结构化模式**：描述了在适当情况下，一组类如何支持面向对象软件系统结构的建模。主要包括条目（item）描述模式、为角色变动服务的设计模式和处理对象集合的模式。'
  - '[PAGE 325]


