  md: "\n## 五、构件与重用\n\n### 6. 构件重用的层次\n\n- **代码重用**\n\n  包括目标代码和源代码的重用。其中目标代码的重用级别最低，历史也最久，当前大部分编程语言的运行支持系统都提供了连接（Link）、绑定（Binding）等功能来支持这种重用。源代码的重用级别略高于目标代码的重用，程序员在编程时把一些想重用的代码段复制到自己的程序中，但这样往往会产生一些新旧代码不匹配的错误。想大规模的实现源程序的重用只有依靠含有大量可重用构件的构件库。如“对象链接及嵌入”（OLE）技术，既支持在源程序级定义构件并用以构造新的系统，又使这些构件在目标代码的级别上仍然是一些独立的可重用构件，能够在运行时被灵活地组合为各种不同的应用。\n\
    \n- **设计重用**\n\n  设计结果比源程序的抽象级别更高，因此它的重用受实现环境的影响较少，从而使可重用构件被重用的机会更多，并且所需的修改更少。这种重用有三种途径：（1）从现有系统的设计结果中提取一些可重用的设计构件，并把这些构件应用于新系统的设计；（2）把一个现有系统的全部设计文档在新的软硬件平台上重新实现，也就是把一个设计运用于多个具体的实现；（3）独立于任何具体的应用，有计划地开发一些可重用的设计构件。\n\
    \n## 软件体系结构建模方法\n\nlliao@seu.edu.cn\n\n## 目 录\n\n- 软件体系结构概论\n- 软件体系结构建模方法\n- 软件体系结构风格\n\
    - 基于体系结构的软件开发\n- 基于体系结构的评估\n\n## 一、软件体系结构建模概述\n\n### I. 软件模型\n\n- SA的首要问题是如何表示SA，即如何对SA建模。\n\
    - **模型：**一般是指对客观世界中存在事物的一种抽象。一般都需要通过某种形式表达出来。\n  - 如：数学模型，自然语言或图形语言表达的模型。\n- **软件模型：**是软件的一种抽象，目前一般通过非数学模型来描述。\n\
    - 根据建模的侧重点不同，可以将SA模型分为五种：\n  - 结构模型\n  - 框架模型\n  - 动态模型\n  - 过程模型\n  - 功能模型\n\n\
    （1）结构模型：用组件、连接件和其他概念来刻画结构，力图通过结构来反映系统的重要语义内容，包括系统的配置、约束、隐含的假设条件、风格、性质等。研究结构模型的核心就是ADL。\n\
    \n（2）框架模型：与结构模型类似，但它侧重于整体的结构。它主要以一些特殊问题为目标建立只针对和适应该问题的结构。如应用广泛的MVC（模型-视图-控制器）框架模型解决了用户界面与业务实现相分离的问题。\n\
    \n（3）动态模型：是对结构模型和框架模型的补充，研究系统的“大颗粒”的行为性质。例如，描述系统的重新配置和演化。动态可以指系统总体结构的配置、建立或撤除通信通道或计算的过程。\n\
    \n### DARWIN EXAMPLE\n\n```\ncomponent DataStore{\n    provide landerValues;\n\
    }\n\ncomponent Calculation{\n    require landerValues;\n    provide calculationService;\n\
    }\n\ncomponent UserInterface{\n    require calculationService;\n    require landerValues;\n\
    }\n\ncomponent LunarLander{\ninst\n    U: UserInterface;\n    C: Calculation;\n\
    \    D: DataStore;\nbind\n    C.landerValues -- D.landerValues;\n    U.landerValues\
    \ -- D.landerValues;\n    U.calculationService -- C.calculationService;\n}\n```\n\
    \nCanonical Textual Visualization\n\n![img/6b451d038dc64487adac52ab7c5c2495_102_0.png](img/6b451d038dc64487adac52ab7c5c2495_102_0.png)\n\
    \nGraphical Visualization\n\n（4）过程模型：研究构造系统的步骤和过程，因而结构是遵循某些过程脚本的结果。\n\n（5）功能模型：该模型认为SA是由一组功能组件按层次组成，下层向上层提供服务。\n\
    \n这5种模型各有所长，将5种模型有机地统一在一起，形成一个完整的模型来刻画软件体系结构更合适。\n\n## 二、“4+1”视图模型\n\n- Philippe\
    \ Kruchten (Rational Software Corp.)于1995年在他的论文 “Architectural Blueprints—The\
    \ “4+1” View Model of Software Architecture”提出了软件体系结构的“4 + 1”视图模型。\n- 该模型使用以体系结构为中心、场景驱动、迭代的开发方法来设计。\n\
    - “4+1” 视图模型从5个不同视角来描述软件体系结构，每个视图只关心系统的一个侧面，5个视图结合在一起才能反映系统的软件体系结构全部内容。\n\n**“4+1”视图模型**\n\
    \n| 视图 | 关注者/关注点 |\n| --- | --- |\n| 逻辑视图 | 最终用户：功能需求 |\n| 开发视图 | 编程人员：模块管理 |\n\
    | 场景 |  |\n| 进程视图 | 系统集成人员：性能、可扩展性、吞吐量等 |\n| 物理视图 | 系统工程师：系统拓扑、安装、通信等 |\n\n- The\
    \ **logical view**, which is the object model of the design (when an object-oriented\
    \ design method is used),\n- the **process view**, which captures the concurrency\
    \ and synchronization aspects of the design,\n- the **physical view**, which describes\
    \ the mapping(s) of the software onto the hardware and reflects its distributed\
    \ aspect,\n- the **development view**, which describes the static organization\
    \ of the software in its development environment.\n\n### 逻辑视图\n\n- 逻辑视图主要支持系统功能需求，即系统提供最终用户的服务。\n\
    - 在逻辑视图中，系统分解成一系列的功能抽象，这些抽象主要来自问题领域。\n- 在面向对象技术中，通过抽象、封装和继承，可以用对象模型来代表逻辑视图，用类图来描述逻辑视图。\n\
    - （1）逻辑视图的标记方法——Booch标记法\n\n  ![img/6b451d038dc64487adac52ab7c5c2495_111_0.png](img/6b451d038dc64487adac52ab7c5c2495_111_0.png)\n\
    \n  Figure 2 — Notation for the logical blueprint\n\n### 某通信系统ACS体系结构\n\n- 会话对象代表一组参与会话的终端\n\
    - 会话对象使用转换服务\n- 转换服务对象代表将逻辑地址转换到物理地址的服务等\n- 终端\n- 连接服务\n- 线路控制器\n- 编号计划服务\n\n\
    ![img/6b451d038dc64487adac52ab7c5c2495_112_0.png](img/6b451d038dc64487adac52ab7c5c2495_112_0.png)\n\
    \n![img/6b451d038dc64487adac52ab7c5c2495_113_0.png](img/6b451d038dc64487adac52ab7c5c2495_113_0.png)\n\
    \n对于规模更大的系统来说，体系结构中包含数十甚至数百个类，可以用类层次图来表示。\n\n左图描述了空中交通管理系统的顶层类图。\n\n（b）Blueprint\
    \ for an Air Traffic Control System\n\n### 开发视图\n\n- 开发视图（development view）也称为模块视图（module\
    \ view），关注软件开发环境下实际模块的组织。\n- 软件可以打包成小的程序块（程序库或子系统），可以由一位或几位开发人员来开发。\n- 系统的开发视图可以用模块和子系统图来表达。\n\
