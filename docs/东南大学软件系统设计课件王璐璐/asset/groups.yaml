    # 实例：CASL编译程序软件体系结构分析


    +   * CASL语言的编译系统逻辑上分为6个功能：

    +   * (1)文本编辑器：一个类似与写字板的文本编辑器，用户可用来输入程序代码；还用来显示编译系统的界面元素

    +   * (2)词法分析器：对用户输入的程序代码进行词法分析。若有错，则进入报错程序。

    +   * (3)语法分析器：对用户输入的程序代码进行语法分析。若有错,则进入报错程序。

    +   * (4)语义分析器：对用户输入的程序代码进行语义分析。若有错，则进入报错程序。

    +   * (5)代码生成器：以上步骤若没有错误则生成可执行代码。

    +   * (6)报错程序：报告错误的行数。'
