    \n# The Need of Architecture\n\nThe Winchester “Mystery” House\n\n- 38 years of\
    \ construction – 147 builders 0 architects\n- 160 rooms – 40 bedrooms, 6 kitchens,\
    \ 2 basements, 950 doors\n- 65 doors to blank walls, 13 staircases abandoned,\
    \ 24 skylights in floors\n- No architectural blueprint exists\n\n![](img/6b451d038dc64487adac52ab7c5c2495_15_0.png)\n"
  mdcn: "\n\n# 设计一个狗舍\n\n![](img/6b451d038dc64487adac52ab7c5c2495_2_0.png)\n\n> 可由一人开发或建造，因为它需要：\n\
    > - 最少的建模\n> - 简单的流程\n> - 简单的工具\n\n# 设计一栋房子\n\n![](img/6b451d038dc64487adac52ab7c5c2495_3_0.png)\n\
    \n由团队建造最有效率且及时。它需要：\n- 建模\n- 明确定义的流程\n- 电动工具\n\n# 那摩天大楼呢？\n\n![](img/6b451d038dc64487adac52ab7c5c2495_4_0.png)\n\
    \n差异\n- 规模\n- 流程\n- 成本\n- 进度\n- 技能和开发团队\n- 材料和技术\n- 利益相关者\n- 风险\n\n# 软件开发中的软件架构\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_5_0.png)\n\n# 明确架构的优势\n\n- **利益相关者沟通**\n\
    \  - 架构可被用作系统利益相关者讨论的焦点。\n- **系统分析**\n  - 意味着可以分析系统是否能满足其非功能性需求。\n- **大规模复用**\n\
    \  - 架构可在一系列系统间复用\n\n![](img/6b451d038dc64487adac52ab7c5c2495_7_0.png)\n\n![](img/6b451d038dc64487adac52ab7c5c2495_7_1.png)\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_7_2.png)\n\n# 明确架构的优势\n\n- **工具用于**\n\
    \  - 理解\n    - 系统\n    - 理论限制\n  - 规划\n    - 资源\n    - 人力\n  - 沟通\n    - 客户\n\
    \    - 维护部门\n  - 评估质量\n\n# 影响因素\n\n- 技术和组织因素\n  - 目标领域的质量需求\n  - 技术环境\n- 业务因素\n\
    \  - 整体业务目标\n- 系统利益相关者\n  - 管理层“低成本，保持人员就业”\n  - 市场营销“精美功能，低成本，上市时间”\n  - 终端用户“行为，性能，可靠”\n\
    \  - 维护组织“可修改，可理解”\n  - 客户“低成本，及时交付”\n- 其他质量需求。\n\n# 谁影响软件架构？\n\n# 系统的利益相关者\n\n\
    开发组织的管理利益相关者\n\n市场营销利益相关者\n\n终端用户利益相关者\n\n维护组织利益相关者\n\n客户利益相关者\n\n低成本，保持人员就业，利用现有企业资产！\n\
    \n精美功能，上市时间短，低成本，与竞争产品持平！\n\n行为，性能，安全性，可靠性！\n\n可修改性！\n\n低成本，及时交付，很少更改！\n\n架构师\n\
    \n哦……\n\n# 架构很早\n\n- 架构代表最早的设计决策集合\n  - 最难更改\n  - 最关键要做对\n- 架构是系统质量属性得到解决的第一个设计产物\n\
    \n# 架构与设计的区别\n\n- 架构\n  - 非功能性决策被确定之处，以及功能需求被划分之处\n- 设计\n  - 功能需求得以实现之处\n\n![](img/6b451d038dc64487adac52ab7c5c2495_12_0.png)\n\
    \n# 软件中的力量\n\n![](img/6b451d038dc64487adac52ab7c5c2495_13_0.png)\n\n> 在未来 20 年里，挑战将不是速度或成本或性能；它将是一个复杂性的问题。\n\
    >\n> — Bill Ruddell，首席战略官，Sun Microsystems\n\n> 我们的敌人是复杂性，我们的目标是消灭它。\n>\n> — Jan\
    \ Baan\n\n# 架构设计的领域\n\n# “是什么”\n\n# “为什么”\n\n# “谁”\n\n# “怎么做”\n\n![](img/6b451d038dc64487adac52ab7c5c2495_14_0.png)\n\
    \n# 架构的需求\n\n温彻斯特“神秘”大厦\n\n- 38 年的建造 – 147 名建筑工人 0 名建筑师\n- 160 个房间 – 40 间卧室，6\
    \ 个厨房，2 个地下室，950 个门\n- 65 个门通向空白墙，13 个楼梯被废弃，24 个天窗在地板上\n- 不存在建筑蓝图\n\n![](img/6b451d038dc64487adac52ab7c5c2495_15_0.png)\n\
    \n"
