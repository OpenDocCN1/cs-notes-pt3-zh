  - '[PAGE 29]


    # 二、软件架构的兴起和发展


    +   I.背景分析

    +     - 小规模软件开发：算法 + 数据结构 is enough!

    +     - 大规模软件开发：总体的系统设计和规格说明 must be more important!

    +       ⇒软件架构（Software architecture）'
  - '[PAGE 30]


    # 二、软件架构的兴起和发展


    # ❀ 2.软件架构定义 – 百家之言


    （1）Dewayne Perry和Alex Wolf的定义（1992）


    软件架构是具有某种特定形式的结构化元素（即构件）的集合，包括处理构件、数据构件和连接构件。处理构件负责对数据进行加工，数据构件是被加工的信息，连接构件把架构的不同部分组合连接起来。


    > (A set of architectural (or, if you will, design) elements that have a particular
    form. Perry and Wolf distinguish between processing elements, data elements, and
    connecting elements.)'
  - '[PAGE 31]


    # 二、软件架构的兴起和发展


    2. 软件架构定义 - 百家之言


    （2）Mary Shaw 和 David Garlan 的定义（1993）


    软件架构是软件设计过程中的一个层次，这一层次超越计算过程中的算法设计和数据结构设计。架构问题包括总体组织和全局控制、通信协议、同步、数据存取，给设计元素分配特定功能，设计元素的组织、规模和性能，在各设计方案间进行选择等。软件架构处理算法与数据结构关于整体系统结构设计和描述方面的一些问题，如全局组织和全局控制结构，关于通信、同步与数据存取的协议，设计构件功能定义，物理分布与合成，设计方案的选择、评估与实现等。'
  - '[PAGE 32]


    # 二、软件架构的兴起和发展


    +   2. 软件架构定义 - 百家之言


    （3）Hayes Roth的定义（1994）


    软件架构是一个抽象的系统规约，主要包括用其行为来描述的功能构件和构件之间的相互连接、接口和关系。


    > （...an abstract system specification consisting primarily of functional components
    described in terms of their behaviors and interfaces and component-component interconnections.）'
  - '[PAGE 33]


    # 二、软件架构的兴起和发展


    +   2. 软件架构定义 - 百家之言


    （4）Booch, Rumbaugh, and Jacobson (1999)


    > An architecture is the set of **significant decisions** about the organization
    of a software system, **the selection** of the structural elements and their interfaces
    by which the system is composed, **together with their behavior** as specified
    in the collaborations among those elements, **the composition** of these structural
    and behavioral elements into progressively larger subsystems, and the architectural
    style that guides this organization---these elements and their interfaces, their
    collaborations, and their composition (The UML Modeling Language User Guide, Addison-Wesley,
    1999).'
