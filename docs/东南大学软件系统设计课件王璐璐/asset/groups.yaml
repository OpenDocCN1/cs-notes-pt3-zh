    # （3）质量属性及采用的战术


    | 目标 | 实现方式 | 所采用的战术 |

    |---|---|---|

    | 性能 | 用户访问的系统应该能在规定的时间内做出响应，如果系统由于网络或者数据库原因不能在规定时间内做出反应，那么系统应该提出警告，不能出现用户无故长时间等待的情况。
    | 限制访问队列大小；缓冲池技术 |

