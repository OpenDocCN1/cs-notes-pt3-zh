    # C/S与B/S混合之内外有别模型


    +   - 企业内部用户通过局域网直接访问数据库服务器，软件系统采取C/S体系结构；

    +   - 企业外部用户通过Internet访问Web服务器，通过Web服务器再访问数据库服务器，软件系统采用B/S结构。

    +   - 优点在于：外部用户不直接访问数据库服务器，保证数据库安全，企业内部用户的交互性较强，数据查询和修改的响应速度较快。

    +   - 缺点在于：外部用户修改和维护数据，速度较慢，较繁琐。'
