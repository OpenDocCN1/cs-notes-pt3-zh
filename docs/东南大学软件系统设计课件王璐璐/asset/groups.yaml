    # * 第9步：陈述结果


    最后，需要把在ATAM分析中所得到的各种信息进行归纳总结，并呈现给相关人员


    在这一陈述中，评估负责人概要介绍ATAM评估的各个步骤和得到的各种信息，包括商业环境、促成该体系结构的主要需求、约束条件和体系结构等，但最重要的结果如下：


    +   * 文档化的体系结构方法

    +   * 若干场景及其优先级

    +   * 基于质量属性的若干问题

    +   * 效用树

