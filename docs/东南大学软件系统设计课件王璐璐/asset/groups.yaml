    +   * 以时间为维度，评估分为4个阶段，

    +     * 第0阶段：建立阶段

    +       * 合作关系的建立——评估客户和评估人员之间

    +       * 准备工作——组建评估小组，召开开工会议，进行准备

    +     * 第1阶段：第1~6步

    +       * 以体系结构为中心

    +       * 重点是获取体系结构信息并对其进行分析

    +     * 第2阶段：第7~9步

    +       * 以相关人员为中心

    +       * 重点是获知相关人员的观点，并验证第1阶段的结果

