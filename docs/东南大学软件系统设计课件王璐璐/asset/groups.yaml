    \ as cashier_pump.Know\n    pump.Oil1 as Customer1_pump.Giveoil\n    pump.Oil2\
    \ as Customer2_pump.Giveoil\nEnd GasStation.\n```\n\n![](img/6b451d038dc64487adac52ab7c5c2495_140_0.png)\n\
    \n图3：加油站系统的架构。\n\n![](img/6b451d038dc64487adac52ab7c5c2495_140_1.png)\n\n图7：图6中切片的架构表示。\n"
