  md: "\n## 二、软件架构的兴起和发展\n\n### 2. 软件架构定义——百家之言\n\n（5）Bass, Clements, Kazman（from\
    \ “Software Architecture in Practice”, second edition, 2003）\n\nThe software architecture\
    \ of a program or computing system is the structure or structures of the system,\
    \ which comprise **software elements**, the **externally visible properties**\
    \ of those elements, and **the relationships** among them.\n\n“Externally visible”\
    \ properties refers to those assumptions other elements can make of an element,\
    \ such as its provided services, performance characteristics, fault handling,\
    \ shared resource usage, and so on.\n\n（6）综上所述，可以认为软件架构由3种基本元素组成，它们是：\n\n- 构件（component）\n\
    - 连接件（connector）\n- 配置（configuration）/规约\n\n**构件（component）**\n\n构件是计算或数据存储的单位，大致对应于常规编程语言的编译单元和其他用户级对象。它可以是简单型或复合型，例如一个系统就可以看成是复合型构件。构件作为一个封装的实体，只能通过其接口与外部交互，构件的接口由一组端口组成，每个端口表示了构件与外部的交互点。\n\
    \n**连接件（connector）**\n\n连接件是构件之间的交互及控制这些交互的规则。它们有时是简单交互，如过程调用、共享变量访问；有的则是复杂的和语义丰富的交互，如\
    \ C/S 协议等。连接件通常不能与编译单元一一对应。它们的表现形式可以是表项、缓冲区、动态数据结构、调用、初始化参数等。\n\n**配置（configuration）**\n\
    \n也可以看作是“约束/拓扑结构”。软件架构的拓扑结构反映了该结构的基本准则。\n\n### 3. 软件架构的意义\n\n- （1）架构是风险承担者进行交流的手段\n\
    \n  ——SA 代表了系统的公共的高层次的抽象。\n\n- （2）架构是早期设计决策的体现\n\n  - a. 软件架构明确了对系统实现的约束条件——架构设计者不必是算法设计者或编程语言专家，只需重点考虑系统的总体权衡问题，而构件的开发人员在架构给定的约束下进行开发。\n\
    \  - b. 软件架构决定了开发和维护组织的组织结构——SA 决定组织结构。\n  - c. 软件架构制约着系统的质量属性——好的 SA 是必要条件。\n\
    \  - d. 通过研究软件架构可能预测软件的质量——评价 SA 预测质量。\n  - e. 软件架构使推理和控制更改更简单——SA 需易更改。\n  -\
    \ f. 软件架构有助于循序渐进的原型设计——按可执行模型来构造原型。\n  - g. 软件架构可以作为培训的基础。\n\n### 4. 软件架构发展史\n\
    \n20世纪90年代以后：基于构件的软件开发阶段——以过程为核心，强调软件开发采用构件化技术和架构技术，要求开发出的软件具备很强的自适应性、互操作性、可扩展性和可重用性等。\n\
    \n软件架构发展的四个阶段：\n\n- （1）“无架构”设计阶段：以汇编语言进行小规模应用程序开发为特征。\n- （2）萌芽阶段：出现了程序结构设计主题，以控制流图和数据流图构成软件结构为特征。\n\
    - （3）初期阶段：出现了从不同侧面描述系统的结构模型，以 UML 为典型代表。\n- （4）高级阶段：以描述系统的高层抽象为中心，不关心具体的建模细节，划分了架构模型与传统软件结构的界限，该阶段以\
    \ Kruchten 提出的“4+1”模型为标志。由于概念尚不统一，描述规范也不能达成一致认识，在软件开发实践中软件架构尚不能发挥重要作用。\n\n## 三、软件重用\n\
    \n新的需求：“faster, better, and cheaper”\n\n- 1) **Faster**: The software has to meet\
    \ a market window. Competitive organizations set that time.\n- 2) **Better**:\
    \ The software has to serve the requirements of the process it is to support and\
    \ later, when serving its process, it has to do so with few failures.\n- 3) **Cheaper**:\
    \ The software has to be less expensive to produce and maintain.\n\n**Two paths\
    \ to these goals:**\n\n- 1) Increase the effectiveness of the organization that\
    \ produces the software. Such as software engineering.\n- 2) Software reuse（软件重用）——from\
    \ “Software Reuse”，Ivar Jacobson et al.\n\n### 定义\n\n软件重用是将已有的软件及其有效成分用于构造新的软件或系统。它不仅是对软件程序的重用，还包括对软件生产过程中其它劳动成果的重用，如项目计划书、可行性报告、需求分析、概要设计、详细设计、编码（源程序）、测试用例、文档与使用手册等等。因此，软件重用包括软件产品重用和软件过程重用两部分的内容。\n\
    \n### 重用和移植\n\n软件移植是指对软件进行修改和扩充，使之在保留原有功能、适应原有平台的基础上，可以运行于新的软硬件平台。而重用则指在多个系统中，尤其是在新系统中使用已有的软件成分。\n\
    \n### 白盒重用与黑盒重用\n\n黑盒重用指对已有产品或构件不需作任何修改，直接进行重用，这是理想的重用方式。它主要基于二进制代码的重用，包括可执行程序的重用和基于库（包括动态链接库和静态库）的重用。\n\
    \n白盒重用指根据用户需求对已有产品进行适应性修改后才可使用。白盒重用一般为源代码一级的重用，以及相应的测试用例、文档等的重用。\n\n### 软件重用的三个基本原则\n\
    \n- a. 必须有可以重用的对象。\n- b. 所重用的对象必须是有用的。\n- c. 重用者需要知道如何去使用被重用的对象。\n\n## 四、面向对象技术与重用\n\
    \n支持软件重用是人们对面向对象方法寄托的主要希望之一，也是这种方法受到广泛重视的主要原因之一。\n\n### 1. 面向对象对重用的支持\n\n与其它软件工程方法相比，面向对象方法的一个重要优点是，它可以在整个软件生命周期达到概念、原则、术语及表示法的高度一致。这种一致性使得各个系统成分尽管在不同的开发与演化阶段有不同的形态，但可具有贯穿整个软件生命周期的良好映射。\n\
    \n**（1）OOA 模型**\n\nOOA 方法建立的系统模型分为基本模型（如类图）和补充模型（如交互图），强调在 OOA 基本模型中只表示最重要的系统建模信息，较为细节的信息则在详细说明中给出。这种表示策略使\
    \ OOA 基本模型体现了更高的抽象，更容易成为一个可重用的系统架构。当这个架构在不同的应用系统中重用时，在很多情况下可通过不同的详细说明体现系统之间的差异，因此对系统构件的改动较少。\n\
    \n### 2. 重用对面向对象的支持\n\n"
