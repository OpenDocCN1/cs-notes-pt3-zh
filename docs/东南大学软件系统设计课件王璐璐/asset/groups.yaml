  md: "\n# 三种评估方式的比较\n\n| 评估方式 | 调查问卷或检查表 |  | 场景 | 度量 |\n| --- | 调查问卷 | 检查表 |  |\
    \  |\n| 通用性 | 通用 | 特定领域 | 特定系统 | 通用或特定领域 |\n| 评估者对体系结构的了解程度 | 粗略了解 | 无限制 | 中等了解\
    \ | 精确了解 |\n| 实施阶段 | 早 | 中 | 中 | 中 |\n| 客观性 | 主观 | 主观 | 较主观 | 较客观 |\n\n## 2.ATAM评估方法\n\
    \n- ATAM: Architecture Tradeoff Analysis Method（体系结构权衡分析方法）\n- 目标\n  - 理解SA关于软件系统的质量属性需求决策的结果。\n\
    \  - 这些设计决策会一直影响软件生命周期，在软件实现后很难改变这些决策。\n- 特点\n  - 揭示SA对特定质量目标的满足情况，描述诸多质量目标之间的相互作用和权衡\n\
    \  - 结构化的评估方法，可重复\n\nATAM主要部分包括4组，共9个步骤：\n\n- I. 陈述，包括通过它进行的信息交流\n- ① ATAM方法的陈述：评估负责人\n\
    - ② 商业动机的陈述：项目经理或系统客户\n- ③ SA的陈述：系统设计人员\n\n### 2. 调查与分析，包括对照体系结构方法评估关键质量属性需求\n\
    \n- ④ 确定体系结构方法：系统设计人员\n- ⑤ 生成质量属性效用树（utility tree）：说明构成系统“效用”的质量属性（性能、有效性、安全性、可修改性、可用性），具体到场景层次，标注刺激/反应，并区分不同的优先级\n\
    - ⑥ 分析体系结构方法：基于步骤5识别出的高优先级的场景，说明和分析针对这些场景的体系结构方法。在这一步骤中，体系结构风险、非风险、敏感点和权衡点被识别出来\n\
    \n### 2. ATAM评估方法\n\n- 3. 测试，包括对照所有相关人员的需求检验最新结果\n  - ⑦ 集体讨论并确定场景优先级\n  - ⑧ 分析体系结构方法：针对步骤7的高等级场景\n\
    - 4. 形成报告，包括陈述ATAM的结果\n  - ⑨ 结果的表述：包括方法、场景、特定属性的问题、效用树、有风险决策、无风险决策、敏感点和权衡点\n\n\
    提示：上述步骤顺序并不严格，可根据需要适当调整\n\n- 第1步：ATAM方法的陈述\n  评估负责人向参加会议的相关人员介绍ATAM方法。在这一步，要对每个人解释参与的过程，使每个人都知道要收集哪些信息，如何描述信息，将向谁报告等等。\n\
    - 进行ATAM评估步骤简介\n- 介绍用于获取信息和分析的技巧：效用树的生成、基于体系结构方法的获取和分析、对场景的集体讨论及优先级的划分\n- 描述评估的结果：场景及其优先级、用户理解和评估体系结构的问题、描述体系结构的动机需求并给出其优先级的效用树、所确定的\
    \ 一组体系结构方法、所发现的有风险决策、无风险决策、敏感点和权衡点等\n\n- **第2步：业务动机的陈述**\n  - 项目经理从业务角度，向相关人员介绍系统概况\n\
    \  - 系统最重要的功能\n  - 技术、管理、经济、政治方面的任何相关限制\n  - 业务目标和上下文\n  - 主要的相关人员\n  - 体系结构的驱动因素，即促使形成该体系结构的主要质量属性目标\n\
    \n# 第3步：体系结构陈述\n\n架构师在合适的细节层次上描述体系结构。这些体系结构信息直接影响可能的分析及分析的质量。在进行更实质的分析之前，评估小组通常需要询问更多的有关体系结构的信息，包括：\n\
    \n- 技术约束条件，诸如要求使用的操作系统、硬件、中间件等\n- 该系统必须要与之交互的其他系统\n- 用以满足质量属性需求的体系结构方法、风格、模式和采用的机制\n\
    - 高层体系结构视图：功能、代码、并发、物理\n\n- 第5步：生成质量属性效用树\n\n评估小组与项目决策者合作，共同确定出该系统的最重要的质量属性目标，并设置优先级，进行进一步的细化，该步指导其他的分析\n\
    \n这种方式将所有风险承担者和评估小组的精力集中到对系统的成功与否具有重要意义的体系结构的方面上\n\n效用树为我们提供了一种直接而有效地将系统的业务驱动因素转换为具体的质量属性场景的机制，该步骤的输出结果是对具体质量属性需求（以场景形式实现）的优先级的确定。\n\
    \n- 效用树中质量属性细化为场景\n- 确定最重要的质量属性目标，并设置优先级\n- 效用树设置优先级标准\n- 每个场景对系统成功与否的重要性\n- 体系结构设计人员所估计的实现这种场景的难度\n\
    \n## 效用树样例\n\n代表系统的整体质量\n\n效用\n\n性能\n\n数据延迟\n\n(M, L)把客户数据库的存储延迟减到最小值(200ms)\n\
    \n(H, M)提供实时视频图像\n\n交易吞吐量\n\n(M, M)使认证服务器的平均吞吐量最大化\n\n可修改性\n\n新产品目录\n\n商业产品的改变\n\
    \n(L, H)以小于20人月的工作量添加CORBA中间件\n\n(H, L)以小于4周的工作量更改Web用户界面\n\n可用性\n\n硬件故障\n\n(L,\
    \ H)若站点1断电，要求在3秒内将任务重定向到站点3\n\n(M, M)若磁盘出现故障，要在5分钟内重新启动\n\n(H, M)要在1.5分钟内检测并恢复网络故障\n\
    \n商业软件故障\n\n安全性\n\n数据机密性\n\n(L, H)信用卡交易在99.999%的时间内是安全的\n\n(L, H)客户数据库认证在99.999%的时间内能正常工作\n\
    \n数据完整性\n\n## 效用树样例\n\n效用\n\n二级节点构成质量属性\n\n性能\n\n数据延迟\n\n(M，L) 把客户数据库的存储延迟减到最小值（200ms）\n\
    (H，M) 提供实时视频图象\n(M，M) 使认证服务器的平均吞吐量最大化\n\n交易吞吐量\n\n可修改性\n\n新产品目录\n\n商业产品的改变\n\n\
    (L，H) 以小于20人月的工作量添加CORBA中间件\n(H，L) 以小于4人周的工作量更改Web用户界面\n\n可用性\n\n硬件故障\n\n(L，H)\
    \ 若站点1断电，要求在3秒内将任务重定向到站点3\n(M，M) 若磁盘出现故障，要在5分钟内重新启动\n(H，M) 要在1.5分钟内检测并恢复网络故障\n\
    \n商业软件故障\n\n安全性\n\n数据机密性\n\n(L，H) 信用卡交易在99.999%的时间内是安全的\n(L，H) 客户数据库认证在99.999%的时间内能正常工作\n\
    \n数据完整性\n\n- 第6步：分析体系结构方法\n  针对划分了优先级的质量需求（第5步）和采用的体系结构方法（第4步），评估它们的匹配情况\n- 把效用树中每个高优先级的质量属性需求与实现它们的体系结构方法关联起来\n\
