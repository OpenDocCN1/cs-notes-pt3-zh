    # 开发视图...


    +   - 开发视图的风格

    +     使用层次式风格，定义4或6层子系统。

    +     每层均有良好的职责、设计规则，即某层子系统依靠同层次的或更低层次的子系统，从而减少了具有复杂模块依赖关系的网路开发量，得到层次式的简单发布策略。

    +     各个层次，层次越低，通用性越强。以保证需求变更时，所做的改动最小。'
