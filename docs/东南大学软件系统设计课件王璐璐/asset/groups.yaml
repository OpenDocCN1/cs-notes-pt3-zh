    ## ABSD方法与生命周期


    ABSD方法的输入由下列部分组成：


    - 抽象功能需求：包括变化的需求和通用的需求。

    - 用例：功能需求具体化，在体系结构设计阶段，重要的用例才有用。

    - 抽象的质量和商业需求：质量需求尽量具体化。

    - 质量因素：实际质量和商业需求。采用质量场景可以对质量需求进行特定扩充，使质量因素具体化。

    - 体系结构选项：对于每个质量和业务需求，都要例举出能满足该需求的所有可能的体系结构。

    - 约束：前置的设计决策。例如：必须考虑某遗留系统特征。


