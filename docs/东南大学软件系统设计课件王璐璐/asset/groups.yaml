    \  - （2）Role为连接件和组件交互点的集合。其中Role=<Id,Action, Event, LConstraints>. Id是Role的标识；Action是Role活动的集合，每个活动由事件的连接（谓词）组成；Event是Role产生的事件集合；LConstraints是Role约束集合。\n\
    \  - （3）Beha是连接件的行为集合。\n  - （4）Msgs是连接件中各Role中事件产生的消息的集合。\n  - （5）Cons是连接件约束的集合，它包括连接件的初始条件、前置条件和后置条件，有时为了明确表示这三个条件，可把它写成Cons(init,pre-cond,post-cond)。\n\
    \  - （6）Non-Func是连接件的非功能说明，包括连接件的安全性、可靠性说明等。\n- **软件体系结构**：定义7：设论域为U，（1）组件是一个软件体系结构；（2）连接件是一个软件体系结构；（3）组件经有限次连接（运算）后是软件体系结构。SA记为A=<C,O>，其中C表示组成体系结构的组件集合，O表示组件运算的集合。\n\
    - **SA的性质**：\n  - （1）封闭性（envelopment）：即组件与组件、组件与体系结构、体系结构与体系结构连接后仍是一个体系结构。\n \
    \ - （2）层次性（hierarchy）：即体系结构可由组件连接而成，而体系结构又可以再经过连接组成新的更大的体系结构。\n  - （3）可扩充性（expansibility）：即一个满足条件的新组件可以通过连接加入到结构中。\n\
    \n## 软件体系结构风格\n\nllao@seu.edu.cn\n\n### 一、软件体系结构风格概述\n\n软件体系结构设计的一个核心问题是能否使用重复的体系结构模式，即能否达到体系结构级的软件重用。也就是说，能否在不同的软件系统中，使用同一体系结构。基于这个目的，学者们开始研究和实践软件体系结构风格和类型问题。\n\
    \n- 软件体系结构风格是描述某一特定应用领域中系统组织方式的惯用范型 (idiomatic paradigm)。\n- 软件体系结构风格定义的主要内涵：\n\
    \  - 定义了一个系统家族，即一个体系结构定义一个词汇表和一组约束。\n  - 词汇表中包含一些构件和连接件类型。\n  - 约束指出系统是如何将这些构件和连接件组合起来的。\n\
    \n体系结构风格反映了领域中众多系统所共有的结构和语义特性，并指导如何将各个模块和子系统有效地组织成一个完整的系统。\n\n1. 提供一个**词汇表**；\n\
    2. 定义一套**配置规则**；\n3. 定义一套**语义解释原则**；\n4. 定义对基于这种风格的系统所进行的**分析**。\n\n- Garlan和Shaw对通用体系结构风格的分类：\n\
    \  - 数据流风格：批处理序列；管道/过滤器\n  - 调用/返回风格：主程序/子程序；面向对象风格；层次结构\n  - 独立构件风格：进程通讯；事件系统\n\
    \  - 虚拟机风格：解释器；基于规则的系统\n  - 仓库风格：数据库系统；超文本系统；黑板系统\n- **特别注意：**体系结构风格不是对软件进行分类的标准。它仅仅是表示和描述软件的不同角度而已。\n\
    \  - 例如：一个系统采用了分层风格，但这并不妨碍它用面向对象的方法来实现。同一个系统采用多种风格造成了所谓体系结构风格的异构组合。\n\n### 二、管道-过滤器风格\n\
    \n- **概述**\n  - 在管道-过滤器风格下，每个功能模块都有一组输入和输出。\n  - 功能模块称作过滤器（filters）；功能模块间的连接可以看作输入、输出数据流之间的通路，所以称作管道（pipes）。\n\
    \  - 管道-过滤器风格的特性之一在于过滤器的相对独立性，即过滤器独立完成自身功能，相互之间无需进行状态交互。\n\n![](img/6b451d038dc64487adac52ab7c5c2495_164_0.png)\n\
    \n图 3-1 管道－过滤器风格的体系结构\n\n- 过滤器是独立运行的构件\n  - 非临近的过滤器之间不共享状态\n  - 过滤器自身无状态\n- 过滤器对与其上、下连接的过滤器“无知”\n\
    \  - 对相邻的过滤器不施加任何限制\n- 结果的正确性不依赖于各个过滤器运行的先后次序\n  - 各过滤器在输入具备后完成自己的计算。完整的计算过程包含在过滤器之间的拓扑结构中。\n"
  mdcn: "\n\n## 四、软件体系结构的生命周期\n\n基于SA的软件开发分为如下几个阶段：\n\n- 需求分析阶段\n  - 体系结构需求包括需求获取（功能需求和质量需求）、生成类图（Rational\
    \ Rose）、对类分组、把类打包成组件和需求评审等。\n  - 需求评审：组织一个由不同代表（如分析人员、客户、设计人员、测试人员）组成的小组，对体系结构需求及相关组件进行仔细的审查。审查内容：获取的需求是否真实反映了用户的要求，类的分组是否合理，组件合并是否合理等过程。\n\
    - 设计阶段：对系统进行模块化并决定各个组件间的详细接口、算法和数据类型的选定，对上支持建立体系结构阶段形成的框架，对下提供实现基础。\n- 实现阶段：将设计阶段设计的算法及数据类型进行程序语言表示，满足设计体系结构和需求分析的要求，从而得到满足设计要求的目标系统。\n\
    - 测试：包括单个组件的功能测试和被组装应用的整体功能和性能测试。\n\nSA在系统开发的全过程中起着基础的作用，是设计的起点和依据，同时也是装配和维护的指南。和软件本身一样，SA也有其生命周期。\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_146_0.png)\n\n- 软件体系结构非形式化描述：自然语言描述；创造性和开拓性。\n\
    - 软件体系结构的规范化描述和分析：形式化数学理论模型描述，分析SA性质（deadlock free, safety, liveness etc）。\n-\
    \ 软件体系结构的求精及其验证：抽象到具体，逐步求精；验证判断具体SA与抽象SA语义一致性，并实现抽象SA。\n- 软件体系结构的实施：将精化的SA实施于系统的设计中，并将SA的组件和连接件等有机地组织在一起，形成系统设计的框架，以便据此实施于软件设计和构造中。\n\
    - 软件体系结构的演化和扩展：在实施SA时，根据系统的需求（常常是非功能的需求，如性能、容错、安全性、互操作性、自适应性等非功能性质）来扩展和改动SA，这称为SA的演化。\n\
    - 软件体系结构的复用、评价和度量：定性评价和定量度量，以利于对SA的重用。\n- 软件体系结构的终结：SA进行多次演化、修改变得难以理解，不能适应系统的发展。\n\
    \n## 五、软件体系结构的抽象模型\n\n- **构件定义**：构件是一个数据单元或一个计算单元，它由构件的对象的集合、属性的集合、动作的集合和端口的集合组成。\n\
    \  - 构件可以抽象为：C=(O,A,X,P)\n  - 其中，O为组成构件的对象的集合\n  - A为构件属性的集合\n  - X为构件动作的集合\n\
    \  - P为构件端口的集合\n- **构件之间的主要关系**：顺序，选择，循环\n- 连接件：通过对组件间交互规则的建模来实现组件间的连接。与组件不同，连接件不需编译。\n\
    - 定义6：连接件是组件运算的实现，它是六元组 <ID, Role, Beha, Msgs, Cons, Non-Func>，其中：\n  - （1）ID是连接件的标识。\n\
    \  - （2）Role为连接件和组件交互点的集合。其中Role=<Id,Action, Event, LConstraints>. Id是Role的标识；Action是Role活动的集合，每个活动由事件的连接（谓词）组成；Event是Role产生的事件集合；LConstraints是Role约束集合。\n\
    \  - （3）Beha是连接件的行为集合。\n  - （4）Msgs是连接件中各Role中事件产生的消息的集合。\n  - （5）Cons是连接件约束的集合，它包括连接件的初始条件、前置条件和后置条件，有时为了明确表示这三个条件，可把它写成Cons(init,pre-cond,post-cond)。\n\
    \  - （6）Non-Func是连接件的非功能说明，包括连接件的安全性、可靠性说明等。\n- **软件体系结构**：定义7：设论域为U，（1）组件是一个软件体系结构；（2）连接件是一个软件体系结构；（3）组件经有限次连接（运算）后是软件体系结构。SA记为A=<C,O>，其中C表示组成体系结构的组件集合，O表示组件运算的集合。\n\
