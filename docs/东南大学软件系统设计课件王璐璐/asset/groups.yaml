  - '[PAGE 550]


    # 6 对系统构架的再分析


    # (1) 风险决策和敏感点


    | 采用战术 | 敏感点（S） | 有风险决策（R） |

    |---|---|---|

    | 超出限制访问量的请求放在等待队列中 | 提高了系统的稳定性和可用性，减少了崩溃的可能 | 会降低最大并发数目，使得用户等待时间过长，可能造成用户不满 |

    | 缓存 | 提高系统的访问速度和性能 | 单服务器提供的缓存数目有限，并发用户数多的情况下，系统处理缓慢。 |

    | 每个 IP 每次只允许发出一个请求 | 合理的要求，避免了非法用户的恶意攻击 | 可能降低了易用性，但系统的安全性提高了。 |

    | 数据库连接池 | 数据库连接池允许应用程序重复使用一个现有的数据库连接，而不是重新建立一个，提高应用系统的性能。 |  |

    | 容错性 | 能够对用户出现的误操作进行检测和处理，并给出相应的处理信息，可以提高系统的可用性。 |  |

    | 系统备份与恢复 | 增强系统的容错能力 | 操作系统和数据库软件发生崩溃时，恢复时间较长。 |'
  - "[PAGE 551]\n\n# （2）问题分析\n\n在前面对系统结构的描述中，系统采用基于B/S的分层结构，系统部署在一台应用服务器上，这种结构有它独特的优点。但经过构架方法的分析，特别是对系统的关键质量属性和优先级最高的质量属性场景的分析，发现系统在上述场景下会出现如下的问题：\n\
    \n+   （1）性能方面：在非常多的用户并发操作的情况下，单服务器系统将不能对用户的请求做出及时的响应，严重情况下服务器还会崩溃。\n+   \n+  \
    \ （2）可用性方面：在仅有的一台应用服务器出现故障或者崩溃的情况下，用户将不能访问系统，故障恢复需要花费较长时间。"
