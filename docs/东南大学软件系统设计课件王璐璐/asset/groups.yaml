    # 五、构件与重用


    +   • 1、什么是软件构件


    # 1）对象与构件


    构件的特征: (1) A component is a unit of independent deployment. 一个构件是独立部署的单元。 (2)
    A component is a unit of third-party composition. 一个构件是第三方组合的单元。 (3)A component
    has no persistent state. 一个构件没有持久状态。


    对象的特征: (1) An object is a unit of instantiation; it has a unique identity. 一个对象是实例化的单元；它具有唯一的标识。
    (2) An object has state; this state can be a persistent state. 一个对象具有状态；该状态可以是持久状态。
    (3) An object encapsulates its state and behavior. 一个对象封装其状态和行为。


    # 2) 软件构件定义


    A software Component is a unit of composition with contractually specified interfaces
    and explicit context dependencies only. 软件构件是具有合同指定接口且仅有显式上下文依赖的组合单元。 A software
    component can be deployed independently and is subject to composition by third
    parties. 软件构件可以独立部署，并可由第三方进行组合。


    b. Explicit context dependencies (清晰的上下文依赖):


    Besides the specification of provided interfaces, the above definition of components
    also requires components to specify their needs. 除了提供接口的规范外，上述构件的定义还要求构件指定其需求。
    In other words, the definitions requires specification of what the deployment
    environment will need to provide, such that the component can function. 换句话说，定义要求说明部署环境需要提供什么，以便构件能够运行。
    **These needs are called context dependencies**, referring to the context of composition
    and deployment. **这些需求称为上下文依赖**，指的是组合和部署的上下文。


    # 3）面向对象与构件


    +   a. 面向对象技术已达到了类级重用（代码重用），它以类为封装的单位。这样的重用粒度太小，不足以解决异构互操作和效率更高的重用。


    +   b. 构件将抽象的程度提高到一个更高的层次，它是对一组类的组合进行封装，并代表完成一个或多个功能的具体服务，也为用户提供了多个接口。


    +   c. 整个构件隐藏了具体的实现，只用接口对外提供服务。


    # 五、构件与重用


    +   - 2.构件模型与实现


    构件模型（Component Model）是对构件本质特征的抽象描述。


    目前国际上流行的构件模型：


    +   a. 参考模型，如3C模型；

    +   b. 描述模型，如RESOLVE模型和REBOOT模型；

    +   c. 实现模型，如CORBA，EJB，DCOM。


    '
