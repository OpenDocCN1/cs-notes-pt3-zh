    \  - 场景是从风险承担者的角度对与系统的交互的简短描述。\n  - 在体系结构评估中，一般采用刺激、环境和响应三方面来对场景进行描述。\n\n### 基本概念\n\
    \n- **刺激**是场景中解释或描述风险承担者怎样引发与系统的交互部分。例如，用户可能会激发某个功能，维护人员可能会做某个更改，测试人员可能会执行某种测试等，这些都属于对场景的刺激。\n\
    - **环境**描述的是刺激发生时的情况。例如，当前系统处于什么状态？有什么特殊的约束条件？系统的负载是否很大？某个网络通道是否出现了阻塞等。\n- **响应**是指系统是如何通过体系结构对刺激作出反应的。例如，用户所要求的功能是否得到满足？维护人员的修改是否成功？测试人员的测试是否成功等。\n\
    \n## 基本概念场景图\n\n| 刺激源 | 刺激 | 环境 | 反应 | 响应度量 |\n|--------|------|------|------|----------|\n\
    | 用户（500） | 试图同时登陆系统 | 选课系统（制品）正常运行 | 请求被处理 | 平均响应时间5秒 |\n\n## 评估的时机\n\n- 前期\n\
    \  - 又叫发现型评估\n  - 找出难以实现的需求，并划分其优先级\n- 后期\n  - 为新系统或扩展评估老系统\n  - 使用户明确是否可以通过更改老系统来满足新的质量以及功能需求\n\
    \n- 评估的必要性：\n  1. 体系结构评估可以减少后期的测试和纠错的开销\n  2. 评估是挖掘隐性需求并将其补充到设计的最后机会\n  3. 体系结构是开发过程的中心，不良的体系结构会带来一塌糊涂的效果。\n\
    \n## 主要的评估方式\n\n- 基于调查问卷或检查表的评估方式\n- 基于场景的评估方式\n- 基于度量的评估方式\n\n- 这一评估方式比较自由灵活，可评估多种质量属性，也可以在软件体系结构设计的各个阶段进行。但是由于评估的结果很大程度上来自评估人员的主观推断，因此不同的评估人员可能会产生不同甚至截然相反的结果，而且评估人员对领域的熟悉程度、是否具有丰富的相关经验也成为评估结果是否正确的重要因素。\n\
    - 尽管基于调查问卷与检查表的评估方式相对比较主观，但由于系统相关的人员的经验和知识是评估软件体系结构的重要信息来源，因而它仍然是进行软件体系结构评估的重要途径之一。\n\
    \n## 基于场景的评估方式\n\n- 基于场景的方式由SEI首先提出并应用在体系结构权衡分析方法（ATAM）和软件体系结构分析方法（SAAM）中。\n-\
    \ 这种软件体系结构评估方式分析软件体系结构对场景也就是对系统的使用或修改活动的支持程度，从而判断该体系结构对这一场景所代表的质量需求的满足程度。例如，用一系列对软件的修改来反映易修改性方面的需求，用一系列攻击性操作来代表安全性方面的需求等。\n\
    - 这一评估方式考虑到了包括系统的开发人员、维护人员、最终用户、管理人员、测试人员等在内的所有与系统相关的人员对质量的要求。基于场景的评估方式涉及到的基本活动包括确定应用领域的功能和软件体系结构的结构之间的映射，设计用于体现待评估质量属性的场景以及分析软件体系结构对场景的支持程度。\n\
    - 不同的应用系统对同一质量属性的理解可能不同，例如，对操作系统来说，可移植性被理解为系统可在不同的硬件平台上运行，而对于普通的应用系统而言，可移植性往往是指该系统可在不同的操作系统上运行。由于存在这种不一致性，对一个领域合适的场景设计在另一个领域内未必合适，因此基于场景的评估方式是特定于领域的。这一评估方式的实施者一方面需要有丰富的领域知识以对某一质量需求设计出合理的场景，另一方面，必须对待评估的软件体系结构有一定的了解以准确判断它是否支持场景描述的一系列活动。\n\
    \n## 基于度量的评估方式\n\n- 度量是指为软件产品的某一属性所赋予的数值，如代码行数、方法调用层数、构件个数等。传统的度量研究主要针对代码，但近年来也出现了一些针对高层设计的度量，软件体系结构度量即是其中之一。代码度量和代码质量之间存在着重要的联系，类似地，软件体系结构度量应该也能够作为评判质量的重要依据。\n\
    - 赫尔辛基大学提出的基于模式挖掘的面向对象软件体系结构度量技术、Karlskrona和Ronneby提出的基于面向对象度量的软件体系结构可维护性评估、西弗吉尼亚大学提出的软件体系结构度量方法等都在这方面进行了探索，提出了一些可操作的具体方案。我们把这类评估方式称作基于度量的评估方式。\n"
  mdcn: "\n\n## 体系结构说明\n\n- 主数据中心作为整个系统共享服务的一个入口，它提供了查询主数据中心上元数据信息的服务；负责向分数据中心转发用户访问科学数据的请求。\n\
    - 分数据中心也可以作为共享服务的入口。每个分数据中心都具有各自的管理信息系统，收集和管理某个研究领域内的科学数据，用户可以直接登录某个分数据中心上访问数据。\n\
    - 加入了安全中心。用户的基本信息，如密码、住址、所属单位等，都由安全中心保存和维护。安全中心为所有数据中心提供了用户的身份验证和安全维护服务。\n- 用户访问数据的权限则由各个数据中心独立地设置和管理。\n\
    \n## 各中心的信息存储结构\n\n![](img/6b451d038dc64487adac52ab7c5c2495_462_0.png)\n\n## 数据中心的分层体系结构\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_463_0.png)\n\n- 分层体系结构：某一层功能和实现的变化只与上下层有关（低耦合，可扩展、组件复用）\n\
    - 安全管理：访问权限\n- 日志管理：多种操作的记录\n- 数据访问层：审查、发布数据的操作\n- 应用服务层：多个共享服务组件\n- 共享服务接口：访问接口、入口，重用部分应用服务组件\n\
    \  - 主数据中心：全局服务\n  - 分服务中心：数据收割（为主数据中心收集元信息）\n  - 注意连接件设计 p133\n\n## 体系结构分析\n\n\
    - 面向服务的体系结构是一种松耦合、协议和实现独立的体系结构；松耦合与随需应变是SOA的两大特点。\n- 采用这种体系结构，可以重用已有系统作为分数据中心；允许异构数据的存在和访问；并且能够给系统带来良好的可维护性和可扩展性。\n\
    - 新的系统中，最主要的一点变化就是：科学数据将不再统一由“中心”服务器存储和管理，改为由数据所有者（科研工作者或是科研院所）负责存储和管理。\n\n##\
    \ 数据共享网可维护性解决策略\n\n- 在科学数据共享网系统中，在不同的层次设计中分别采用了“间接化、封装、分离”。\n  - 首先，整个系统的分布式体系结构设计，采用了SOA的体系结构设计，这种设计是将数据共享服务封装为Web\
    \ Service，由特定的Web Service提供数据共享服务。Web Service的引入，将共享数据内容和共享服务实现细节分离。当实现细节发生变化或是增加新的服务时，对原有系统的运行影响很小。\n\
    \  - 在数据中心和安全中心的系统设计上，采用了分层的设计。这是一种间接化的体系结构设计策略，上层的共享服务需要通过数据访问层提供的接口访问数据；当底层数据存储结构变化后，对上层的共享服务的影响较小。\n\
    - 数据中心和安全中心的Web应用系统采用的是MVC模式，将模型、控制、视图有机地分离。\n\n- 1. 软件体系结构评估概述\n- 2. ATAM评估方法\n\
    - 3. SAAM评估方法\n\n## I. 软件体系结构评估概述\n\n- 软件体系结构的好坏关系到软件产品的好坏，软件产品的好坏关系到软件公司的发展。\n\
    - 通过评估能了解系统的体系结构和重要属性（质量属性），能够屏蔽风险，带来诸多收益。\n- 到目前为止没有很好的自动化评估系统。\n\n## 评估的定义\n\
    \n质量属性：\n\n1. 可修改性\n\n   度量软件系统变化的成本。变化包括功能扩展、容量扩展、结构更新等。\n\n2. 可用性\n\n   是指软件能够正常运行的时间比例。\n\
    \   可用性=平均工作时间/(平均工作时间+平均修复时间)\n\n3. 性能\n\n   性能表征软件系统的响应速度或者由响应速度决定的其它度量。\n\n\
    4. 可测试性\n\n   可测试性表明软件系统在多大程度上容易被测试检查出缺陷。\n\n5. 易用性\n\n   易用性表明软件系统完成后用户的体验和效率。\n\
    \n6. 安全性\n\n   安全性代表软件对未授权和非法操作的防卫能力。\n\n## 2010年软件架构师考试题\n\n____(62)____是实现一个特定质量属性的关键特征，该特征为一个或多个软件构件所共有。\n\
    \n“改变加密的级别可能会对安全性和性能都产生显著的影响”，这是一个对系统 ____(63)____ 的描述。\n\n## 基本概念\n\n- 风险承担者（Stakeholders）\n\
    \  - 涉众、牵涉到的人\n  - 体系结构设计师\n  - 开发人员\n  - 维护人员\n  - 集成人员\n  - 测试人员\n  - 标准专家\n\
    \  - 性能工程师\n\n## 基本概念\n\n- 场景\n  - 在进行体系结构评估时，一般首先要精确地得出具体的质量目标，并以之作为判定该体系结构优劣的标准。我们把为得出这些目标而采用的机制叫做场景。\n\
    \  - 场景是从风险承担者的角度对与系统的交互的简短描述。\n  - 在体系结构评估中，一般采用刺激、环境和响应三方面来对场景进行描述。\n\n### 基本概念\n\
