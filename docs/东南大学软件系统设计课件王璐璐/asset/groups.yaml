    \ 用和数据库存取权限的功能以及记录系统处理日志的功能。功能层的程序多半是用可视化编程工具开发的，也有使用COBOL和C语言的。\n\n**数据层就是数据库管理系统**，负责管理对数据库数据的读写。数据库管理系统必须能迅速执行大量数据的更新和检索。因此，一般从功能层传送到数据层的要求大都使用SQL语言。\n"
  mdcn: "\n\n## 分层风格优点\n- 分层风格具有一些系统设计者无法抗拒的优势：\n  - 分层风格支持系统设计过程中的逐级抽象，允许将一个复杂问题分解成一个增量步骤序列的实现\n\
    \  - 基于分层风格的系统具有较好的可扩展性\n  - 分层风格支持软件复用\n\n## 分层风格不足\n- 并不是所有的系统都适合用分层风格来描述的，甚至即使一个系统的逻辑结构是层次化的，出于对系统性能的考虑，系统设计师不得不把一些低级或高级的功能综合起来；\n\
    - 对于抽象出来的功能具体应该放在哪个层次上也是设计者头疼的一个问题，很难找到一个合适的、正确的层次抽象方法。\n\n## 六、仓库风格\n- 在仓库风格中，有两种不同的组件：\n\
    \  - 中央数据结构说明当前状态\n  - 独立组件在中央数据存贮上执行\n\n- 信息交互方式的差异导致了控制策略的不同。主要的控制策略有两种，正是依据这两种不同的控制策略，基于数据共享风格的系统被分成两个子类：\n\
    \n## 六、仓库风格\n软件部件\n- 表示当前状态的中心数据结构\n- 一组相互独立的处理中心数据的部件\n\n部件交互方式\n根据输入数据流的事务处理类型决定执行哪个处理过程\n\
    \n根据中心数据结构的当前状态触发进行执行\n\n传统的数据库系统\n\n黑板系统\n\n## 六、仓库风格\n知识源\n\n知识源\n\n知识源\n\n\
    知识源\n\n直接存取：知识源不断改变黑板的状态。\n\n按照与应用程序相关的层次组织的问题求解数据\n\n黑板状态驱动控制：使用特定的知识。\n\n独立、分离的与应用程序相关的知识及其处理单元\n\
    \n## 六、仓库风格\n黑板系统主要有三个部分组成：\n- 知识源：知识源中包含独立的、与应用程序相关的知识，知识源之间不直接进行通信，它们之间的交互通过黑板来完成。\n\
    - 黑板数据结构：黑板数据是按照与应用程序相关的层次来组织的解决问题的 数据，知识源通过不断的改变黑板数据来解决问题。\n\n## 仓库风格实例\n- 专家系统（ES，Expert\
    \ System）\n  - 专家系统实质就是一组程序；\n  - 从功能上：可定义为“一个在某领域具有专家水平解题能力的程序系统”，能像领域专家一样工作，运用专家积累的工作经验与专门知识，在很短时间内对问题得出高水平的解答。\n\
    \  - 从结构上讲：可定义为“由一个专门领域的知识库，以及一个能获取和运用知识的机构构成的解题程序系统”。\n\nES一般结构如下图所示：\n\n![](img/6b451d038dc64487adac52ab7c5c2495_221_0.png)\n\
    \n## IECRMAS知识生态系统\n\n![](img/6b451d038dc64487adac52ab7c5c2495_223_0.png)\n\n\
    ## IECRMAPS知识生态系统中知识流动\n\n![](img/6b451d038dc64487adac52ab7c5c2495_224_0.png)\n\
    \n## 仓库风格优点\n- **解决问题的多方法性：**\n  - 对于一个专家系统，针对要解决的问题，如果在其领域中没有独立的方法存在，而且对解空间的完全搜索也是不可行的，在黑板模式中可以用多种不同的算法来进行试验，并且也允许用不同的控制方法。\n\
    - **具有可更改性和可维护性：**\n  - 因为在黑板模式中每个知识源是独立的，彼此之间的通信通过黑板来完成，所以这使整个系统更具有可更改性和可维护性。\n\
    \n## 仓库风格优点\n- 有可重用的知识源：\n  - 由于每个知识源在黑板系统中都是独立的，如果知识源和所基于的黑板系统有理解相同的协议和数据，我们就可以重用知识源。\n\
    \n- 支持容错性和健壮性：\n  - 在黑板模式中所有的结果都是假设的，并且只有那些被数据和其它假设强烈支持的才能够生存。这对于噪声数据和不确定的结论有很强的容错性。\n\
    \n## 仓库风格缺点\n- 开发成本高：\n  - 绝大部分黑板模式的系统需要用几年的时间来进化，所以开发成本较高。\n- 缺少对不并行机的支持：\n \
    \ - 黑板模式要求黑板上的中心数据同步并发访问，所以缺少对不并行机的支持。\n\n## 七、C/S风格\n- 在集中式计算技术时代广泛使用的是大型机/小型机计算模型。它是通过一台物理上与宿主机相连接的非智能终端来实现宿主机上的应用程序。\n\
    - 20世纪80年代以后，集中式结构逐渐被以PC机为主的微机网络所取代。个人计算机和工作站的采用，永远改变了协作计算模型，从而导致了分散的个人计算模型的产生。\n\
    \n## 七、C/S风格\n- C/S软件体系结构是基于资源不对等，且为实现共享而提出来的，是20世纪90年代成熟起来的技术，C/S体系结构定义了工作站如何与服务器相连，以实现数据和应用分布到多个处理机上。\n\
    - C/S体系结构有三个主要组成部分：数据库服务器、客户应用程序和网络。\n\n## C/S风格体系结构\n\n![](img/6b451d038dc64487adac52ab7c5c2495_231_0.png)\n\
    \n图 3-6 C/S体系结构示意图\n\n## C/S风格任务分配\n- 服务器\n  1. 数据库安全性的要求；\n  2. 数据库访问并发性的控制；\n\
    \  3. 数据库前端的客户应用程序的全局数据完整性规则；\n  4. 数据库的备份与恢复。\n\n## C/S风格任务分配\n- **客户应用程序**\n\
    \  1. 提供用户与数据库交互的界面；\n  2. 向数据库服务器提交用户请求并接收来自数据库服务器的信息；\n  3. 利用客户应用程序对存在于客户端的数据执行应用逻辑要求。\n\
    \n## C/S风格处理流程\n\n![](img/6b451d038dc64487adac52ab7c5c2495_234_0.png)\n\n表示层\n\
    \n输入数据\n\n请求按钮\n\n输出数据\n\n业务处理开始\n\n业务处理请求和业务处理所需的全部输入数据\n\n数据存取请求\n\n业务处理结束\n\
    \n全部处理结束\n\n业务处理程序\n\n数据层\n\nSQL 请求开始\n\nDBMS 执行SQL\n\nSQL 请求结束\n\n数据登录/更新/读取的请求\n\
    \n数据登录/更新/读取的结果\n\n业务处理开始\n\n数据存取请求\n\n业务处理结束\n\n数据存取程序\n\n## C/S风格优点\n- C/S 体系结构具有强大的数据操作和事务处理能力，模型思想简单，易于人们理解和接受。\n\
    - 系统的客户应用程序和服务器构件分别运行在不同的计算机上，系统中每台服务器都可以适合各构件的要求，这对于硬件和软件的变化显示出极大的适应性和灵活性，而且易于对系统进行扩充和缩小。\n\
    - 在C/S体系结构中，系统中的功能构件充分隔离，客户应用程序的开发集中于数据的显示和分析，而数据库服务器的开发则集中于数据的管理，不必在每一个新的应用程序中都要对一个DBMS进行编码。将大的应用处理任务分布到许多通过网络连接的低成本计算机上，以节约大量费用。\n\
    \n## C/S风格缺点\n- 二层C/S结构是单一服务器且以局域网为中心的，所以难以扩展至大型企业广域网或Internet；\n- 软、硬件的组合及集成能力有限；\n\
    - 客户端程序设计复杂，客户机的负荷太重，难以管理大量的客户机，系统的性能容易变坏；\n- 数据安全性不好。因为客户端程序可以直接访问数据库服务器，那么，在客户端计算机上的其他程序也可想办法访问数据库服务器，从而使数据库的安全性受到威胁。\n\
    - 软件维护和升级时，每个客户端都需要升级。\n\n## 八、三层C/S风格\n\n![](img/6b451d038dc64487adac52ab7c5c2495_237_0.png)\n\
    \n数据库服务器1\n\n数据库服务器2\n\n应用服务器\n\nInternet\nIntranet\n\n用户1\n\n用户2\n\n用户ₙ\n\n图\
    \ 3-8 三层C/S体系结构示意图\n\n表示层\n\n功能层\n\n数据层\n\n输入数据\n\n请求按钮\n\n输出数据\n\n业务处理请求和业务处理所需的全部输入数据\n\
    \n全部处理结束\n\n业务处理程序\n\n业务处理开始\n\n数据存取请求\n\n业务处理结束\n\n数据存取程序\n\n业务处理开始\n\n数据存取请求\n\
    \n业务处理结束\n\nSQL 请求开始\n\nDBMS 执行SQL\n\nSQL 请求结束\n\n数据登录/更新/读取的请求\n\n数据登录/更新/读取的结果\n\
    \n**表示层是应用的用户接口部分**，它担负着用户与应用间的对话功能。它用于检查用户从键盘等输入的数据，显示应用输出的数据。为使用户能直观地进行操作，一般要使用图形用户接口，操作简单、易学易用。在变更用户接口时，只需改写显示控制和数据检查程序，而不影响其他两层。检查的内容也只限于数据的形式和取值的范围，不包括有关业务本身的处理逻辑。\n\
    \n**功能层相当于应用的本体**，它是将具体的业务处理逻辑编入程序中。例如，在制作订购合同时要计算合同金额，按照定好的格式配置数据、打印订购合同，而处理所需的数据则要从表示层或数据层取得。表示层和功能层之间的数据交往要尽可能简洁。例如，用户检索数据时，要设法将有关检索要求的信息一次性地传送给功能层，而由功能层处理过的检索结果数据也一次性地传送给表示层。通常，在功能层中包含有确认用户对应\
    \ 用和数据库存取权限的功能以及记录系统处理日志的功能。功能层的程序多半是用可视化编程工具开发的，也有使用COBOL和C语言的。\n\n**数据层就是数据库管理系统**，负责管理对数据库数据的读写。数据库管理系统必须能迅速执行大量数据的更新和检索。因此，一般从功能层传送到数据层的要求大都使用SQL语言。\n\
    \n"
