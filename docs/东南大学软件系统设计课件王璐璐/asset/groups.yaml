  - '[PAGE 506]


    # * 第7步：集体讨论并确定场景优先级


    在第7步和第8步，评估组测试所理解的体系结构，场景被用作测试的主要手段。第5步确定的场景主要是从体系结构设计人员的角度看待系统的质量属性需求，这一步是从相关人员的角度讨论场景


    +   * 需讨论的场景：用例场景、成长场景、考察场景，这些场景可能同效用树的场景保持一致，也可能发现更多的驱动场景


    +   * 用例场景：描述风险承担者期望使用系统的方式。


    +   * 成长场景：体系结构在中短期的改变，包括功能和非功能性的修改。成长场景能够使评估人员看清在预期因素影响系统时，体系结构表现出来的优缺点。


    +   * 考察场景：描述系统成长的极端情形。例如：性能中数量级的改变，任务的重大变更等。考察场景试图找出敏感点和权衡点，有助于评估系统质量属性的限制。'
  - '[PAGE 507]


    +   •步骤：

    +     •场景收集；

    +     •相关人员对场景投票确定优先级；

    +     •比较场景讨论结果和质量效用树，找出其中相同之处和不同之处；

    +     •在高优先级的场景和效用树中的高优先级的结点之间的任何差异都要重新调整，至少要有合理解释；

    +     •将场景讨论结果放到质量效用树当中，即系统体系结构设计和系统需求一致'
  - '[PAGE 508]


    # ➤ 集体讨论并确定场景优先级


    +   ➤ 一旦收集了若干个场景后，必须要设置优先级。评估人员可通过投票表决的方式来完成，每个风险承担者分配相当于总场景数的30%的选票，且此数值只入不含。例如，如果共有17个场景，则每个风险承担者将拿到6张选票，这6张选票的具体使用则取决于风险承担者，他可以把这6张票全部投给某一个场景，或者每个场景投2-3张票，还可以一个场景一张票等。


    +   ➤ 一旦投票结果确定，所有场景就可设置优先级。设置优先级和投票的过程既可公开也可保密。'
