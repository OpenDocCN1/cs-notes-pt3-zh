    \ | 1 |\n| 代码生成 | 3 |\n| 报错程序 | 1 |\n\n应用SAAM方法对CASL语言编译系统体系结构进行分析后，可以得出如下结论：\n\
    \n- (1) 允许设计者将整个系统的输入/输出行为看成是多个过滤器的行为的简单合成。\n- (2) 系统的各个模块抽象得比较好，具有良好的隐蔽性和高内聚、低耦合的特点。\n\
    - (3) 数据格式的改变对体系结构没有很大的影响。\n- (4) 由于采用了面向对象的体系结构和基于管道过滤器的体系结构，所以各个模块的可重用性比较强，系统维护和增强系统性能简单，新的过滤器可以添加到现有系统中来；旧的可以被改进的过滤器替换掉。\n\
    \n总之，CASL语言编译系统的体系结构具有较好的特性，能够很好地满足用户的需求。但是也存在不足之处，如涉及到用户界面的模块只有1个，这说明没有对功能模块进行细化，面临诸多问题，如：可移植性、可修改性等方面的问题时都要改动这个模块，这是需要改进的地方。\n\
