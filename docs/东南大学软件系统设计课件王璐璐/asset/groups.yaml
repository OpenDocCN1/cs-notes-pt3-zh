  md: "\n# Architecting a dog house\n\n![](img/6b451d038dc64487adac52ab7c5c2495_2_0.png)\n\
    \n> Can be developed or build by one person as it requires:\n> - Minimal modeling\n\
    > - Simple Process\n> - Simple tools\n\n# Architecting a house\n\n![](img/6b451d038dc64487adac52ab7c5c2495_3_0.png)\n\
    \nBuilt most efficiently and timely by a team. It requires:\n- Modeling\n- Well-defined\
    \ processes\n- Power tools\n\n# What About Skyscrapers ?\n\n![](img/6b451d038dc64487adac52ab7c5c2495_4_0.png)\n\
    \nDifferences\n- Scale\n- Process\n- Cost\n- Schedule\n- Skills and development\
    \ teams\n- Material and technologies\n- Stakeholders\n- Risks\n\n# Software Architecture\
    \ in Development\n\n![](img/6b451d038dc64487adac52ab7c5c2495_5_0.png)\n\n# Advantages\
    \ of Explicit Architecture\n\n- **Stakeholders Communication**\n  - Architecture\
    \ may be used as a focus of discussion by system stakeholders.\n- **System Analysis**\n\
    \  - Means that analysis of whether the system can meet its non-functional requirements\
    \ is possible.\n- **Large Scale Re-use**\n  - The architecture may be reusable\
    \ across a range of systems\n\n![](img/6b451d038dc64487adac52ab7c5c2495_7_0.png)\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_7_1.png)\n\n![](img/6b451d038dc64487adac52ab7c5c2495_7_2.png)\n\
    \n# Advantages of Explicit Architecture\n\n- **Tools for**\n  - Understanding\n\
    \    - System\n    - Theoretical Limitations\n  - Planning\n    - Resources\n\
    \    - Labor\n  - Communication\n    - Customer\n    - Maintenance department\n\
    \  - Evaluating Quality\n\n# Influencing Factors\n\n- Technical and organizational\
    \ Factors\n  - Quality requirements from target domain\n  - Technical environment\n\
    - Business Factors\n  - Overall business goals\n- System Stakeholders\n  - Management\
    \ “Low cost, keep people employed”\n  - Marketing “Neat features, low cost, time-to-market”\n\
    \  - End user “behavior, performance, reliable”\n  - Maintenance org “modifiable,\
    \ understandable”\n  - Customer “Low cost, timely delivery”\n- Other quality requirements.\n\
    \n# Who Influences Software Architecture?\n\n# Stakeholders of a System\n\nDevelopment\
    \ organization's management stakeholder\n\nMarketing stakeholder\n\nEnd user stakeholder\n\
    \nMaintenance organization stakeholder\n\nCustomer stakeholder\n\nLow cost, keeping\
    \ people employed, leveraging existing corporate assets!\n\nNeat features, short\
    \ time to market, low cost, parity with competing products!\n\nBehavior, performance,\
    \ security, reliability!\n\nModifiability!\n\nLow cost, timely delivery, not changed\
    \ very often!\n\nArchitect\n\nOhhhhh...\n\n# Architecture is Early\n\n- Architecture\
    \ represents the set of earliest design decisions\n  - Hardest to change\n  -\
    \ Most critical to get right\n- Architecture is the first design artifact where\
    \ a system’s quality attributes are addressed\n\n# Difference between Architecture\
    \ and Design\n\n- Architecture\n  - Where non-functional decisions are cast, and\
    \ functional requirements are partitioned\n- Design\n  - Where functional requirements\
    \ are accomplished\n\n![](img/6b451d038dc64487adac52ab7c5c2495_12_0.png)\n\n#\
    \ Forces in Software\n\n![](img/6b451d038dc64487adac52ab7c5c2495_13_0.png)\n\n\
    > The challenge over the next 20 years will not be speed or cost or performance;\
