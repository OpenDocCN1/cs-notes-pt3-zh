    # 2.ATAM评估方法


    ATAM主要部分包括4组，共9个步骤：


    +   I. 陈述，包括通过它进行的信息交流

    +   ① ATAM方法的陈述：评估负责人

    +   ② 商业动机的陈述：项目经理或系统客户

    +   ③ SA的陈述：系统设计人员'
  - '[PAGE 492]


    # 2.ATAM评估方法


    # 2. 调查与分析，包括对照体系结构方法评估关键质量属性需求


    +   ④ 确定体系结构方法：系统设计人员


    +   ⑤ 生成质量属性效用树（utility tree）：说明构成系统“效用”的质量属性（性能、有效性、安全性、可修改性、可用性），具体到场景层次，标注刺激/反应，并区分不同的优先级


    +   ⑥ 分析体系结构方法：基于步骤5识别出的高优先级的场景，说明和分析针对这些场景的体系结构方法。在这一步骤中，体系结构风险、非风险、敏感点和权衡点被识别出来'
  - '[PAGE 493]


    # 2. ATAM评估方法


    +   3. **测试，包括对照所有相关人员的需求检验最新结果**

    +      ⑦ 集体讨论并确定场景优先级

