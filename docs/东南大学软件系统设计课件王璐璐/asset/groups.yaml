    - 第6步：形成总体评估\n  - 为场景设置权值\n  - 体系结构支持的直接场景数量\n\n### 实例：CASL编译程序软件体系结构分析\n\nCASL语言的编译系统逻辑上分为6个功能：\n\
    \n- (1) 文本编辑器：一个类似于写字板的文本编辑器，用户可用来输入程序代码；还用来显示编译系统的界面元素\n- (2) 词法分析器：对用户输入的程序代码进行词法分析。若有错，则进入报错程序。\n\
    - (3) 语法分析器：对用户输入的程序代码进行语法分析。若有错，则进入报错程序。\n- (4) 语义分析器：对用户输入的程序代码进行语义分析。若有错，则进入报错程序。\n\
    - (5) 代码生成器：以上步骤若没有错误则生成可执行代码。\n- (6) 报错程序：报告错误的行数。\n\n#### 体系结构\n\n![](img/6b451d038dc64487adac52ab7c5c2495_527_0.png)\n\
    \n- (1) 其他格式的文档，比如以前只支持本软件自定义的文档格式，不支持普通文本(*.txt)格式和Word文档(*.doc)格式，现在要求支持普通文本格式和Word文档格式等。\n\
    - (2) 增加文档结构索引的显示风格。\n- (3) 格式长度发生改变，比如指令格式长度从原来的16位升为要求的32位。\n- (4) 移植到其他的操作系统，比如UNIX，LINUX操作系统等。\n\
    - (5) 从对一个程序文本的编译改为对一个程序工程的编译。\n- (6) 与其他的软件结合。\n\n- (1) 支持其他不同格式的文档：间接支持，需要改动的模块是文本编辑模块。\n\
    - (2) 改变文档结构索引表的显示风格：间接支持，需要改动的模块是文本编辑模块。\n- (3) 改变指令格式长度：间接支持，需要改动的模块是代码生成模块。\n\
    - (4) 移植到其他的系统之中：间接支持，所有调用WinAPI函数的模块都需要改动，包括：文本编辑模块，词法分析模块，语法分析模块，语义分析模块，代码生成模块，报错程序模块等。\n\
    - (5) 从对一个程序文本的编译改为对一个程序工程的编译：间接支持，需要改动的模块是代码生成模块。\n- (6) 与一个新的开发工具结合：间接支持，需要把CASL语言编译系统改为可嵌入的服务器软件，需要改动的模块是文本编辑模块。\n\
