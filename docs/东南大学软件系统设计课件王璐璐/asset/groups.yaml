    \n## 五、构件与重用\n\n### 5.构件重用\n\n（2）基于数据的组装技术\n\n基于数据的组装技术首先根据当前软件问题的核心数据结构设计出一个框架，然后根据框架中各节点的需求提取构件并进行适应性修改，再将构件逐个分配到框架中的适当位置。此后，构件的组装方式仍然是传统的子程序调用与参数传递。这种组装技术也要求库中构件以子程序形式出现，但它所依赖的软件设计方法不再是功能分解，而是面向数据的设计方法，例如\
    \ Jackson 系统开发方法。\n\n## 五、构件与重用\n\n5.构件重用\n\n### （3）面向对象的组装技术\n\n由于封装和继承特性，面向对象方法比其他软件开发方法更适合支持软件重用。在OO软件开发方法中，如果从类库中检索出来的基类能够完全满足新软件项目的需求，则可以直接应用。否则，必须以类库中的基类为父类采用构造法或子类法生成子类。\n\
    \n```\n```cpp\nclass Person{\npublic:\n    Person(char *name, int age);\n    ~Person();\n\
    protected:\n    char *name;\n    int age;\n};\n```\n```\n\n# 构造重用…\n\n```\n```cpp\n\
    Person::Person(char *name, int age)\n{\n    Person::name=new char[strlen(name)+1];\n\
    \    strcpy(Person::name, name);\n    Person::age=age;\n    cout<<\"Construct\
    \ Person\"<<name<<\", \"<<age<<\"\\n\";\n    return;\n}\n\nPerson::~Person()\n\
    {\n    cout<<\"Destruct Person\"<<name<<\", \"<<age<<\"\\n\";\n    delete name;\n\
    \    return;\n}\n```\n```\n\n# 构件重用…\n\na. 构造法：为了在子类中使用库中基类的属性和方法，可以考虑在子类中引进基类的对象作为子类的成员变量，然后在子类中通过成员变量重用基类的属性与方法。\n\
    \nb. 子类法：与构造法完全不同，子类法将子类直接说明为库中基类的子类，通过继承和修改基类的属性与行为完成新子类的定义。\n\n```\n```cpp\n\
    //下面采用构造法生成 Teacher 类\nclass Teacher{\npublic:\n    Teacher(char *name, int age,\
    \ char *teaching);\n    ~Teacher();\nprotected:\n    Person *Person;\n    char\
    \ *course;\n};\n\n//Teacher 类的实现\nTeacher::Teacher(char *name, int age, char *teaching)\n\
    {\n    //重用基类的方法 Person()\n    Person=new Person(name, age);\n    strcpy(course,\
    \ teaching);\n    return;\n}\nTeacher::~Teacher()\n{\n    delete Person;\n}\n\
    ```\n```\n"
  mdcn: "\n\n# 构件模型与实现...\n\n基于构件的软件开发通常包括构件获取、构件分类和检索、构件评估、适应性修改以及将现有构件在新的语境下组装成新的系统。\n\
    \n## 五、构件与重用\n\n3. 构件获取\n\n- a. 从现有构件中获得符合要求的构件，直接使用或做适应性（flexibility）修改，得到可重用的构件。\n\
    - b. 通过遗产工程（legacy engineering），将具有潜在重用价值的构件提取出来，得到可重用的构件。\n- c. 从市场上购买现成的商业Components，即COTS（Commercial\
    \ Off-The-Shelf）构件。\n- d. 开发新的符合要求的构件\n\n## 五、构件与重用\n\n### 4.构件管理\n\n- a. 构件描述：包括实现方式、实现体、注释、生产者、生产日期、大小、价格、版本和关联构件等信息，它们与构件模型一起组成了对构件的完整描述。\n\
    \n- b. 构件分类与组织：为了给使用者在查询构件时提供方便，同时也为了更好地重用构件，我们必须对收集和开发的构件进行分类并置于构件库的适当位置。\n\n\
    # 构件管理…\n\n三类构件分类方法：\n\n- （1）关键字分类法（keyword classification）\n\n基本思想：根据领域分析的结果将应用领域的概念按照从抽象到具体的循序逐次分解为树状或有向无回路图结构。每个概念用一个描述性的关键字表示。\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_80_0.png)\n\n左边是构件库的关键字分类结构示例，它支持图形用户界面设计。\n\
    \n当加入构件时，库管理员必须对构件的功能或行为进行分析，在浏览上述关键字分类结构的同时将构件置于最合适的原子级关键字之下。\n\n## 五、构件与重用\n\
    \n### 4.构件管理\n（2）刻面分类法(faceted classification)；\n在刻面分类机制中，定义若干用于刻画构件特征的“刻面(facet)”，每个刻面包含若干概念，这些概念表述构件在刻面上的特征。刻面可以描述构件执行的功能、被操作的数据、构件应用的语境或其他特征。描述构件的刻面的集合称为刻面描述符（facet\
    \ descriptor）。当描述符中出现空的特征值时，表示该构件没有相应的刻面。\n\n## 五、构件与重用\n\n4.构件管理\n\n例如，考虑使用下列构件描述符的模式：\n\
    \n```\nfunction, object type, system type}\n```\n\n刻面描述符中每个刻面含有一个或多个值，这些值一般是描述性关键词。例如，如果功能是某构件的刻面，赋给此刻面的典型值可能是：\n\
    \n```\nfunction=(copy from) or (copy, replace, all)\n```\n\n青鸟构件刻面：使用环境，应用领域，功能，层次，表示方法等。\n\
    \n## 五、构件与重用\n\n### 4.构件管理\n\n（3）超文本组织法（hypertext classification）。\n\n**主要思想：**\
    \ 所有构件必须辅以详尽的功能（function）或性能（performance）说明文档；说明中出现的重要概念或构件以网状链接方式相互连接；检查者在阅读文档的过程中可按照人类的联想思维方式任意跳转到包含相关概念或构件的文档；全文检索系统将用户给出的关键字与说明文档中进行匹配，实现构件的浏览检索。Windows环境下的联机帮助系统就是一种典型的超文本系统。\n\
    \n## 五、构件与重用\n\n4.构件管理\n\n**商业化构件分类：**\n\n- （1）用户界面类、数据库类\n- （2）商务应用类\n- （3）工具类、网络通讯类\n\
    - （4）核心技术类\n\n**从构件的外部形态分类：**\n\n- （1）独立而成熟的构件\n- （2）有限制的构件\n- （3）适应性构件\n- （4）装配的构件\n\
    - （5）可修改的构件\n\n## 五、构件与重用\n\n### 5.构件重用\n\n构件开发的目的是重用，为了让构件在新的软件项目中发挥作用，构件库的使用者必须完成以下工作：检索与提取构件、理解与评价构件、修改构件，最后将构件组装到新的软件产品中。\n\
    \n- - 检索与提取构件\n  - （1）基于关键字的检索\n  - （2）刻面检索法\n  - （3）超文本检索法\n  - （4）其他检索法\n\n\
    ## 五、构件与重用\n\n5.构件重用\n\n- - **理解与评价构件**\n\n  （1）设计信息对于理解构件的必要性和构件用户逆向发掘设计信息的困难性，必须要求构件的开发过程遵循公共软件工程规范，并且在构件库的文档中全面、准确地说明以下内容：构件的功能与性能；相关的领域知识；可适应性约束条件与例外情形；可预见的修改部分及修改方法。\n\
    \n  （2）对构件重用的评价，是通过收集并分析构件的用户在实际重用该构件的历史过程中的各种反馈信息来完成的。这些信息包括：重用成功的次数、对构件的修改、构件的健壮性度量、性能度量等。\n\
    \n## 五、构件与重用\n\n### 5.构件重用\n\n- - **修改构件**\n\n  修改构件是指对构件进行或多或少的修改，以适应新的需求。\n\n\
    - - **构件组装**\n\n  构件组装是指将库中构件经过适当修改后相互连接，或者将它们与当前开发项目中的软件元素相连接，最终构成新的目标软件。\n\n\
    ## 五、构件与重用\n\n5.构件重用\n\n- （1）基于功能的组装技术\n\n基于功能的组装技术采用子程序调用和参数传递的方式将构件组装起来。它要求库中构件以子程序/过程/函数的形式出现，并且接口说明必须清晰。当使用这种组装技术进行软件开发时，开发人员首先应对目标软件系统进行功能分解，将系统分解为强内聚、松耦合的功能模块。然后根据各模块的功能需求提取构件，对它进行适应性修改后再挂接在上述功能分解框架中。\n\
    \n## 五、构件与重用\n\n### 5.构件重用\n\n（2）基于数据的组装技术\n\n基于数据的组装技术首先根据当前软件问题的核心数据结构设计出一个框架，然后根据框架中各节点的需求提取构件并进行适应性修改，再将构件逐个分配到框架中的适当位置。此后，构件的组装方式仍然是传统的子程序调用与参数传递。这种组装技术也要求库中构件以子程序形式出现，但它所依赖的软件设计方法不再是功能分解，而是面向数据的设计方法，例如\
    \ Jackson 系统开发方法。\n\n## 五、构件与重用\n\n5.构件重用\n\n### （3）面向对象的组装技术\n\n由于封装和继承特性，面向对象方法比其他软件开发方法更适合支持软件重用。在OO软件开发方法中，如果从类库中检索出来的基类能够完全满足新软件项目的需求，则可以直接应用。否则，必须以类库中的基类为父类采用构造法或子类法生成子类。\n\
    \n```\n```cpp\nclass Person{\npublic:\n    Person(char *name, int age);\n    ~Person();\n\
    protected:\n    char *name;\n    int age;\n};\n```\n```\n\n# 构造重用…\n\n```\n```cpp\n\
    Person::Person(char *name, int age)\n{\n    Person::name=new char[strlen(name)+1];\n\
    \    strcpy(Person::name, name);\n    Person::age=age;\n    cout<<\"Construct\
    \ Person\"<<name<<\", \"<<age<<\"\\n\";\n    return;\n}\n\nPerson::~Person()\n\
    {\n    cout<<\"Destruct Person\"<<name<<\", \"<<age<<\"\\n\";\n    delete name;\n\
    \    return;\n}\n```\n```\n\n# 构件重用…\n\na. 构造法：为了在子类中使用库中基类的属性和方法，可以考虑在子类中引进基类的对象作为子类的成员变量，然后在子类中通过成员变量重用基类的属性与方法。\n\
    \nb. 子类法：与构造法完全不同，子类法将子类直接说明为库中基类的子类，通过继承和修改基类的属性与行为完成新子类的定义。\n\n```\n```cpp\n\
    //下面采用构造法生成 Teacher 类\nclass Teacher{\npublic:\n    Teacher(char *name, int age,\
    \ char *teaching);\n    ~Teacher();\nprotected:\n    Person *Person;\n    char\
    \ *course;\n};\n\n//Teacher 类的实现\nTeacher::Teacher(char *name, int age, char *teaching)\n\
    {\n    //重用基类的方法 Person()\n    Person=new Person(name, age);\n    strcpy(course,\
    \ teaching);\n    return;\n}\nTeacher::~Teacher()\n{\n    delete Person;\n}\n\
    ```\n"
