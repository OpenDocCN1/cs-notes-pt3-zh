    ## 1. 项目背景


    由于票务种类的繁多，客户信息的量大复杂。所以在其管理上存在较大困难，特别是早期单用人力和纸张进行管理。导致信息的不全面和错误率高，加之存储介质的约束，难以长期有效的管理。


    随着计算机网络的发展，电子商务的普及。一种基于 B/S模式的票务系统提出了需求。由于票务的特殊性，需要系统有很强的稳定性，要求较快的反应速度，响应多点同时请求。另外后台对票务的所有相关信息需要完全记录。完成历史信息的保存，查询；对当前信息的录入，查询，修改，删除。


    ## 功能需求


    | 功能 | 说明 |

    |---|---|

    | 客户信息管理 | 用户的创建、登录、删除和维护 |

    | 票务信息管理 | 票务的添加、删除和维护 |

    | 票务查询 | 查看相应的票务信息 |

    | 预定购票 | 票务的预定、购买和取消 |


