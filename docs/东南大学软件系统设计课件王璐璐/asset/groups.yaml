    # 五、软件体系结构的抽象模型


    +   - **构件定义**：构件是一个数据单元或一个计算单元，它由构件的对象的集合、属性的集合、动作的集合和端口的集合组成。

    +     - 构件可以抽象为：C=(O,A,X,P)

    +     - 其中，O为组成构件的对象的集合

