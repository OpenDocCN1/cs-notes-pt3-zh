    # 四、面向对象技术与重用


    +   • 1. 面向对象对重用的支持


    # （2）OOA与OOD分工


    OOA只注重与问题域及系统责任有关的信息，OOD考虑与实现条件有关的因素。这种分工使OOA模型独立于具体的实现条件，从而使分析结果可以在问题域及系统责任相同而实现条件互异的多个系统中重用，并为从同一领域的多个系统的分析模型提炼领域模型创造了有利条件。


    # （3）对象的表示


    所有的对象都用类作为其抽象描述。对象的一般信息，包括对象的属性、行为及其对外关系等等都是通过对象类来表示的。类作为一种可重用构件，在运用于不同系统时，不会出现因该类对象实例不同而使系统模型有所不同的情况。


    # （4）一般—特殊结构


    引入一般-特殊结构中多态性的表示法，从而增强了类的可重用性。通过对多态性的表示，使一个类可以在需求相重叠而未必完全相同的系统中被重用。


    # （5）整体—部分结构


    把部分类作为可重用构件在整个类中使用，这种策略的原理与在特殊类中使用一般类是一致的，但在某些情况下，对问题域的映射比通过继承实现重用显得更为自然。另外还可通过整体—部分结构支持领域重用的策略---从整体对象中分离出一组可在领域范围内重用的属性与服务，定义为部分对象，使之成为领域重用构件。


    # （6）实例连接


    建议用简单的二元关系表示各种复杂关系和多元关系。这一策略使构成系统的基本成分（对象类）以及它们之间的关系在表示形式和实现技术上都是规范和一致的，这种规范性和一致性对于可重用构件的组织、管理和使用，都是很有益的。


    # （7）类描述模板


    作为OOA详细说明主要成分的类描述模板，对于对象之间关系的描述注意到使用者与被使用者的区别，仅在使用者一端给出类之间关系的描述信息。这说明可重用构件之间的依赖关系不是对等的。因此，在继承、聚合、实例连接及消息连接等关系的使用者一端描述这些关系，有利于这些关系信息和由它们指出的被依赖成份的同时重用。在被使用者一端不描述这些关系，则避免了因重用场合的不同所引起的修改。


    # （8）USE CASE


    由于USE CASE是对用户需求的一种规范化描述，因此它比普通形式的需求文档具有更强的可重用性。每个use case是对一个活动者使用系统的一项功能时的交互活动所进行描述，它具有完整性和一定的独立性，因此很适于作为可重用构件。


    # • 2.软件重用支持面向对象方法


    # （1）类库


    在面向对象的软件开发中，类库是实现对象类重用的基本条件。人们已经开发了许多基于各种OOPL的编程类库，有力地支持了源程序级的软件重用，但要在更高的级别上实现软件重用，仅有编程类库是不够的。实现OOA结果和OOD结果的重用，必须有分析类库和设计类库的支持。为了更好地支持多个级别的软件重用，可以在OOA类库、OOD类库和OOP类库之间建立各个类在不同开发阶段的对应与演化关系。即建立一种线索，表明每个OOA的类对应着哪个（或哪些）OOD类，以及每个OOD类对应着各种OO编程语言类库中的哪个OOP类。


    # （2）构件库


    类库可以看作一种特殊的可重用构件库，它为在面向对象的软件开发中实现软件重用提供了一种基本的支持。但类库只能存储和管理以类为单位的可重用构件，不能保存其它形式的构件；但是它可以更多地保持类构件之间的结构与连接关系。构件库中的可重用构件，既可以是类，也可以是其它系统单位；其组织方式，可以不考虑对象类特有的各种关系，只按一般的构件描述、分类及检索方法进行组织。在面向对象的软件开发中，可以提炼比对象类粒度更大的可重用构件，例如把某些结构或某些主题作为可重用构件；也可以提炼其它形式的构件，例如use
    case或交互图。这些构件库中，构件的形式及内容比类库更丰富，可为面向对象的软件开发提供更强的支持。


    # （5）OOA过程


    在重用技术支持下的OOA过程中，可以按两种策略进行组织：第一种策略是，基本保持某种OOA方法所建议的OOA过程原则，在此基础上对其中的各个活动引入重用技术的支持；另一种策略是重新组织OOA过程。


    第一种策略是在原有的OOA过程基础上增加重用技术的支持，应补充说明的一点是，重用技术支持下的OOA过程应增加一个提交新构件的活动。即在一个具体应用系统的开发中，如果定义了一些有希望被其它系统重用的构件，则应该把它提交到可重用构件库中。


    第二种策略的前提是：在对一个系统进行面向对象的分析之前，已经用面向对象方法对该系统所属的领域进行过领域分析，得到了一个用面向对象方法表示的领域架构和一批类构件，并且具有构件/架构库、类库及相应工具的支持。在这种条件下，重新考虑OOA过程中各个活动的内容及活动之间的关系，力求以组装的方式产生OOA模型，将使OOA过程更为合理，并达到更高的开发效率。


    # 五、构件与重用


    +   - 1. 什么是软件构件

    +   - 2. 构件模型及实现

    +   - 3. 构件获取

    +   - 4. 构件管理

    +   - 5. 构件重用

    +   - 6. 软件重用的层次


    # 五、构件与重用


    +   • 1、什么是软件构件


    # 1）对象与构件


    构件的特征: (1) A component is a unit of independent deployment. (2) A component is
    a unit of third-party composition. (3)A component has no persistent state.


    对象的特征: (1) An object is a unit of instantiation; it has a unique identity. (2)
    An object has state; this state can be a persistent state. (3) An object encapsulates
    its state and behavior.


    # 2) 软件构件定义


    A software Component is a unit of composition with contractually specified interfaces
    and explicit context dependencies only. A software component can be deployed independently
    and is subject to composition by third parties.


    b. Explicit context dependencies (清晰的上下文依赖):


    Besides the specification of provided interfaces, the above definition of components
    also requires components to specify their needs. In other words, the definitions
    requires specification of what the deployment environment will need to provide,
    such that the component can function. **These needs are called context dependencies**,
    referring to the context of composition and deployment.


    # 3）面向对象与构件


    +   a. 面向对象技术已达到了类级重用（代码重用），它以类为封装的单位。这样的重用粒度太小，不足以解决异构互操作和效率更高的重用。


    +   b. 构件将抽象的程度提高到一个更高的层次，它是对一组类的组合进行封装，并代表完成一个或多个功能的具体服务，也为用户提供了多个接口。


    +   c. 整个构件隐藏了具体的实现，只用接口对外提供服务。


    # 五、构件与重用


    +   - 2.构件模型与实现


    构件模型（Component Model）是对构件本质特征的抽象描述。


    目前国际上流行的构件模型：


    +   a. 参考模型，如3C模型；

    +   b. 描述模型，如RESOLVE模型和REBOOT模型；

    +   c. 实现模型，如CORBA，EJB，DCOM。

    '
