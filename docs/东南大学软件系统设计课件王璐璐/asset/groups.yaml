  md: "\n## 管道-过滤器风格实例\n\n- 实例：\n  - `dir | more`\n  - 传统的编译器，一个阶段的输出是另一个阶段的输入（包括词法分析、语法分析、语义分析和代码生成）\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_168_0.png)\n\n![](img/6b451d038dc64487adac52ab7c5c2495_169_0.png)\n\
    \n## 管道-过滤器风格优点\n\n- 设计者可以将整个系统的输入、输出特性简单地理解为各个过滤器功能的合成。\n  - 设计人员将整个系统的输入输出行为理解为单个过滤器行为的叠加与组合。这样可以将问题分解，化繁为简。将系统抽象成一个“黑箱”，其输入是系统中第一个过滤器的输入管道，输出是系统中最后一个过滤器的输出管道，而其内部各功能模块的具体实现对用户完全透明。\n\
    - **管道-过滤器风格支持功能模块的复用**\n  - 任何两个过滤器，只要它们之间传送的数据遵守共同的契约，就可以相连接。每个过滤器都有自己独立的输入输出接口，如果过滤器间传输的数据遵守其契约，只要用管道将它们连接就可以正常工作。\n\
    - 基于管道-过滤器风格的系统具有较强的可维护性和可扩展性。\n  - 旧的过滤器可以被替代，新的过滤器可以添加到已有的系统上。软件的易于维护和升级是衡量软件系统质量的重要指标之一，在管道-过滤器模型中，只要遵守输入输出数据规约，任何一个过滤器都可以被另一个新的过滤器代替，同时为增强程序功能，可以添加新的过滤器。这样，系统的可维护性和可升级性得到了保证。\n\
    - 支持一些特定的分析，如吞吐量计算和死锁检测等。\n  - 利用管道-过滤器风格的视图，可以很容易的得到系统的资源使用和请求的状态图。然后，根据操作系统原理等相关理论中的死锁检测方法就可以分析出系统目前所处的状态，是否存在死锁可能及如何消除死锁等问题。\n\
    - **管道-过滤器风格具有并发性**\n  - 每个过滤器作为一个独立的执行任务，可以与其它过滤器并发执行。过滤器的执行是独立的，不依赖于其它过滤器的执行。在实际运行时，可以将存在并发可能的多个过滤器看作多个并发的任务并行执行，从而大大提高系统的整体效率，加快处理速度。\n\
    \n## 管道-过滤器风格不足\n\n- **交互式处理能力弱**\n\n  管道-过滤器模型适于数据流的处理和变换，不适合为与用户交互频繁的系统建模。在这种模型中，每个过滤器都有自己的数据，这些数据或者是从磁盘存储器中读取出来，或者是由另一个过滤器的输出导入进来，整个系统没有一个共享的数据区。这样，当用户要操作某一项数据时，要涉及到多个过滤器对相应数据的操作，其实现较为复杂。针对以上的缺点，可以对每个过滤器增加相应的用户控制接口，使得外部可以对过滤器的执行进行控制。\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_176_0.png)\n\n**改进的过滤器**\n\n- 管道-过滤器风格往往导致系统处理过程的成批操作。\n\
    - 设计者也许不得不花费精力协调两个相对独立但又存在某种关系的数据流之间的关系，例如多过滤器并发执行时数据流之间的同步问题等。\n- 根据实际设计的需要，设计者也需要对数据传输进行特定的处理（如为了防止数据泄漏而采取加密等手段），导致过滤器必须对输入、输出管道中的数据流进行解析或反解析，增加了过滤器具体实现的复杂性。\n\
    \n## 管道-过滤器风格练习\n\n- 需求描述：假设有一批实时的二维坐标点数据需要变换（即对点的横、纵坐标进行缩放），并在屏幕上进行显示，要求外部要能设置变换规则（如缩放倍数）和显示规则（如显示模式和显示颜色）。\n\
    - 请根据此需求，进行管道-过滤器风格的体系结构建模。\n\n### 体系结构建模\n\n这是一个对坐标点的数据流进行顺序处理的过程，可以应用管道-过滤器体系结构建模。将这个系统分为两个过滤器，一个为坐标点数据流变换过滤器，另一个为坐标点数据流实时显示过滤器。其中，坐标点数据流变换过滤器有一个外部控制接口对变换规则如缩放倍数进行设置，坐标点数据流实时显示过滤器有一个外部控制接口对显示规则如显示模式和显示颜色进行设置。整个系统的体系结构如图所示。\n\
    \n## 三、面向对象风格\n\n### 概述\n\n面向对象模式集数据抽象、抽象数据类型、类继承于一体，使软件工程中公认的模块化、信息隐藏、抽象、重用性等原则在面向对象风格下得以充分实现。\n\
    \n### 应用场合\n\n面向对象的体系结构模式适用于数据和功能分离的系统中，同样也适合于问题域模型比较明显，或需要人机交互界面的系统。大多数应用事件驱动风格的系统也常常应用了面向对象风格。\n\
    \n### Log in Form\n\n![](img/6b451d038dc64487adac52ab7c5c2495_182_0.png)\n\n-\
    \ User Label\n- User Text\n- Pass Label\n- Pass Text\n- Cancel Button\n- Log in\
    \ Button\n- Option Group\n  - Public Option\n  - Private Option\n\n### 面向对象风格设计原则\n\
    \n- 面向对象风格系统设计时有下述几条基本原则：\n  - 将逻辑上的实体映射为对象，实体之间的关系映射为对象之间的引用关系。\n  - 对象利用引用关系来访问对方公开的接口，完成某个特定任务；一组对象之间相互协作，完成总体目标。\n\
    \n### 面向对象风格（抽象描述）\n\n**面向对象风格的抽象描述**\n\n**一个银行系统对象之间的协作实例**\n\n数据的表示及其相应操作封装在一个抽象数据类型或对象中。这种风格的组件是对象，或者说是抽象数据类型的实例。对象是一种被称为管理者的组件，因为它负责保持资源的完整性。对象是通过函数和过程的调用来交互的。\n\
    \n### 面向对象风格优点\n\n- **高度模块性**\n  - 数据与其相关操作被组织为对象，成为模块组织的基本单位。\n- **封装功能**\n \
    \ - 一组功能和其实现细节被封装在一个对象中，具有功能的接口被暴露出来。\n- **代码共享**\n  - 对象的相对独立性可被反复重用，通过拼装形成不同的软件系统。\n\
    - **灵活性**\n  - 对象在组织过程中，相互关系可以任意变化，只要接口兼容。\n- **易维护性**\n  - 对象接近于人对问题和解决方案模型的思维方式，易于理解和修改。\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_185_0.png)\n\n### 面向对象风格实例——人事档案管理系统\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_186_0.png)\n\n**系统功能结构**\n\n- **系统功能介绍：**\n\
    \  - 档案管理：根据高校人事档案管理的特点，本模块可通过录入各类人事档案信息，来构造档案数据库，编制各种目录索引。针对档案材料录入工作量较大，在该功能模块中设置了多种方式快速录入法，如对指定的部分内容可采用代码录入和菜单选项等输入方法。\n\
    \  - 信息检索：该模块主要是检索有关的人事档案信息，其检索方式为姓氏笔画检索目录。在具体检索中又可分为精确查询和模糊查询，并可将检索内容动态输出，满足档案查询的需要。\n\
    \  - 档案借阅：该模块主要是对档案的借阅情况、归还情况、利用登记等方面进行管理。它能为研究如何更有效地利用人事档案资料提供必要的信息。\n  - 档案转递：该模块包括人事档案的转进和转出管理，编制清单，并能在档案转递后，对已变更档案数据库进行相应地调整，以完成相应档案的增删。\n\
    \  - 统计报表：该模块主要用于统计库存的各类人事档案的实际数量，及每年归档的各类档案数量，并可完成相应的图形绘制和报表打印。其中，在报表生成中，该模块可根据管理人员对报表的自定义设置来生成相应的非范式报表。\n\
    \  - 系统维护：由于高校人事档案的数据管理是一项非常重要的工作，尤其是它的安全可靠性。因此，在进入本模块操作之前，系统会提醒用户输入姓名、操作口令和权限级别。同时该功能模块还包括操作员管理、口令修改、重新登录、权限级别设置、系统日志及系统初始化六个子模块。\n\
    \  - 系统帮助：本模块提供了在线联机帮助，可实现帮助主题的查询，还提供了计算器、日记/日历等系统工具和关于本系统的简介。\n"
