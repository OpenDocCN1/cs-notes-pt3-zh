    ## 基本概念


    - 如何准确理解SOA？


    OASIS（一个SOA标准组织）给出的SOA定义“SOA是一个范式，用于组织和利用可能处于不同所有权范围控制下的分布式系统。”


    维基百科给出的SOA定义“面向服务的体系结构（Service-oriented architecture）是构造分布式系统的应用程序的方法。它将应用程序功能作为服务发送给最终用户或者其他服务。它采用开放标准、与软件资源进行交互并采用表示的标准方式”。


    SOA是包含运行环境、编程模型、架构风格和相关方法论等在内的一整套新的分布式软件系统构造方法和环境，涵盖服务的整个生命周期：建模-开发-整合-部署-运行-管理。


    ## 基本概念


    ### WebService


    Web Services，从字面上理解就是通过Web提供的服务。我们可以理解Web Services是自包含的、模块化的应用程序，它可以在网络(通常为Web)中被描述、发布、查找以及调用；也可以理解Web
    Services是基于网络的、分布式的模块化组件，它执行特定的任务，遵守具体的技术规范，这些规范使得Web Services能与其他兼容的组件进行互操作；也可以这样理解，所谓Web服务，它是指由企业发布的完成其特别商务需求的在线应用服务，其他公司或应用软件能够通过Internet来访问并使用这项应用服务Web。


    service 简单来说就是一个向外界暴露出的能够通过internet进行调用的api和应用程序，是基于SOA松耦合等思想开发出来的一套技术，但是它并一定完全符合SOA的架构。


    ## SOA工作流程


    ![](img/6b451d038dc64487adac52ab7c5c2495_283_0.png)


    SOA 中的不同组件及其工作流程


    ## SOA操作


    SOA的三种操作：


    - 发布操作：为了使服务可访问，需要发布服务描述以使服务使用者可以发现它。

    - 查找操作：服务请求者定位服务，方法是查询服务注册中心来找到满足其标准的服务。

    - 绑定操作：在检索到服务描述之后，服务使用者继续根据服务描述中的信息来调用服务。


    ## SOA的相关标准——WSDL、UDDI、SOAP


    SOAP: 简单对象访问协议 (Simple Object Access Protocol)


    WSDL: Web服务描述语言 WSDL (Web Services Description Language)


    UDDI: 统一描述、发现和集成 (Universal Description, Discovery and Integration)


    WSDL用来描述服务；UDDI用来注册和查找服务；


    SOAP作为传输层，用来在消费者和服务提供者之间传递消息。一个消费者可以在UDDI注册表（registry）查找服务，取得服务的WSDL描述，然后通过SOAP来调用服务。


    ![](img/6b451d038dc64487adac52ab7c5c2495_287_0.png)


    soap用来描述传递信息的格式， WSDL 用来描述如何访问具体的接口， uddi用来管理，分发，查询webService。具体实现可以搜索 Web Services简单实例


    ## 核心思想


    - 标准化封装（满足互操作性）


    在软件的互操作方面，传统中间件只是实现了访问互操作，即通过标准化的API实现了同类系统之间的调用互操作，而连接互操作还是依赖于特定的访问协议，如JAVA使用RMI等。而SOA通过标准的、支持Internet、与操作系统无关的SOAP协议实现了连接互操作。而且，服务的封装是采用XML协议，具有自解析和自定义的特性，这样，基于SOA的中间件还可以实现语义互操作。


    SOA要实现互操作，就是通过一系列的标准族，来实现访问、连接和语义等各种层面的互操作。


    ## 核心思想


    - 复用


    | 复用对象 | 复用范围 |

    |---|---|

    | 子程序 | 一个可执行程序内复用，静态开发期复用 |

    | 组件(DLL,Com 等) | 系统内复用，动态运行期复用 |

    | 企业对象组件(Com+, .NET, EJB 等) | 企业网络内复用，不同系统之间复用 |

    | 服务(如 WebService, SCA/SDO) | 不同企业之间，全球复用，动态可配置 |


    ## 如何构建SOA


    一个SOA系统要具有以下六大关键要素——基础设施、已有资源、企业服务、流程模型、服务展现和系统工具（包括开发、测试和管理工具等）。因此，在基础设施和已有资源都已具备的基础上，开发和构建一个SOA系统要包括以下几方面的工作：


    - 首先需要设计开发出符合标准的服务，这是整个SOA系统最核心的要素。

    - 基于标准服务，借助流程编排工具和建模工具，组织构造流程，生成流程模型，更好地满足业务需求。

    - 实际构建和开发SOA系统，具体包括服务和应用程序的开发，数据的访问、处理和管理，及对服务各种形式的展现等。

