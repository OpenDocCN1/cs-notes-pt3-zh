    \ |  |\n\n#### (2) 系统的整体结构\n\n![](img/6b451d038dc64487adac52ab7c5c2495_540_0.png)\n\
    \n#### （3）质量属性及采用的战术\n\n| 目标 | 实现方式 | 所采用的战术 |\n| --- | --- | --- |\n| 性能 | 用户访问的系统应该能在规定的时间内做出响应，如果系统由于网络或者数据库原因不能在规定时间内做出反应，那么系统应该提出警告，不能出现用户无故长时间等待的情况。\
    \ | 限制访问队列大小；缓冲池技术 |\n|  | 当应用程序需要在关联关系间进行导航的时候，由 Hibernate 获取关联对象。同时 Hibernate\
