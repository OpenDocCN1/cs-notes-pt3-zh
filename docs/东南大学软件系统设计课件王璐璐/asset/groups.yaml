  - '[PAGE 194]


    # 面向对象风格不足


    面向对象风格最大的不足在于如果一个对象需要调用另一个对象，它就必须知道那个对象的标识（对象名或对象引用），这样就无形之中增强了对象之间的依赖关系。如果一个对象改变了自己的标识，就必须通知系统中所有和它有调用关系的对象，否则系统就无法正常运行。


    ![](img/6b451d038dc64487adac52ab7c5c2495_194_0.png)'
  - '[PAGE 195]


    # 四、事件驱动风格


    +   - 基于事件的系统风格的思想是组件不直接调用一个过程，而是触发或广播一个或多个事件。

    +   - 系统中的其它组件中的过程在一个或多个事件中注册，当一个事件被触发，系统自动调用在这个事件中注册的所有过程，这样，一个事件的触发就导致了另一模块中的过程的调用。

    +   - 从体系结构上说，这种风格的组件是一些模块，这些模块既可以是一些过程，又可以是一些事件的集合。过程可以用通用的方式调用，也可以在系统事件中注册一些过程，当发生这些事件时，过程被调用。'
  - '[PAGE 196]


    # 事件驱动风格特征


    +   - 事件驱动系统具有以下一些特点：

    +     - 系统是由若干子系统或元素所组成的一个整体；

    +     - 系统有一定的目标，各子系统在某一种消息机制的控制下，为了这个目标而协调行动；

    +     - 在一个系统的若干子系统中，必定有一个子系统起着主导作用，而其他子系统则处于从属地位；'
