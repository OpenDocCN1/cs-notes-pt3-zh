    模型层：职责是将模型的状态转交视图层或者控制层，以提供页面给浏览器。


    数据持久层：职责是建立持久化类及其属性与数据库中表及其字段的对应关系。提供简化SQL语句的机制。实现基本的数据操作（增、删、读、改）


    数据库层：数据库的建立与管理。


    ## 规则（约束）：


    - 1. 系统各层次及层内部子层次之间都不得跨层调用。

    - 2. 由bean传递模型状态。

    - 3. 需要在表示层绑定到列表的数据采用基于关系的数据集传递。

    - 4. 对于每一个数据库表（Table）都有一个 **数据库实体类** 与之对应，由Hibernate完成映射。

    - 5. 有些跨数据库或跨表的操作（如复杂的联合查询）也需要由Hibernate来提供支持。

    - 6. 表示层和控制层禁止出现任何SQL语句。


    ## SSH框架介绍：


    视图层、控制器层用Structs框架来实现，模型层的功能Spring来完成。持久化层时使用Hibernate实现，在这层使用了DAO模式。


    Structs应用MVC模型使页面展现与业务逻辑分离，做到了页面展现与业务逻辑的低耦合。当充当表示层的页面需要变更时，只需要修改该具体的页面，不影响业务逻辑Bean等；同样，业务逻辑需要变更的时候，只需要修改相应的Java程序。


    使用Spring能运用IoC技术来降低了业务逻辑中各个类的相互依赖：假如，类A因为需要功能F而调用类B，在通常的情况下类A需要引用类B，因而类A就依赖于类B了，也就是说当类B不存在的时候类A就无法使用了。使用了IoC，类A调用的仅仅是实现了功能F的接口的某个类，这个类可能是类B，也可能是类C，由Spring的XML配置文件来决定。这样，类A就不再依赖与类B，耦合度降低，重用性得以提高。


    使用Hibernate能让业务逻辑与数据持久化分离，就是将数据存储到数据库的操作分离。在业务逻辑中只需要将数据放到值对象中，然后交给Hibernate，或者从Hibernate那里得到值对象。至于用DB2、Oracle、MySQL还是SQL
    Server，如何执行的操作，与具体的系统无关，只需在Hibernate的相关的XML文件里根据具体系统配置好。


    ## 3.2 系统架构的分析与设计


    ### 3.2.1 质量属性


    现在我们通过下表来看看构架是如何来满足系统的关键质量属性需求。


    | 目标 | 实现方式 | 所采用的技术 |

    |---|---|---|

    | 性能 | 用户访问的系统应该能在规定的时间内做出响应，如果系统由于网络或者数据库原因不能在规定时间内做出反应，那么系统应该发出警告，不能出现用户无故长时间等待的情况。
    | 限制队列大小<br>缓冲池技术 |

    | 易用性 | 遵从 J2EE 的系统提供了诸如 JSP 和 servlet 这样的 Java 技术，它们支持内容的渲染，以满足不同用户的需要。用户对系统的操作能得到正确及时的反馈。
    | 单独的用户接口<br>支持用户主动 |

    | 安全性 | 遵从 J2EE 的系统提供了由容器进行授权校验的基于角色的安全性机制，以及已经为使用做好准备的程序中进行授权检查的安全性机制，在多个用户进行并发操作时保持数据的一致性，有效性。
    | 身份验证<br>授权<br>数据机密性<br>验证码<br>维护完整性 |

    | 可用性 | 当系统试图超出限制范围来进行票务查询或者订购票时必须进行错误检测并且抛出异常，中止进一步的错误操作。遵从 J2EE 的系统提供了可以使用的事务服务，通过提供内建的故障恢复机制，提高了应用的可用性和可靠性。
    | 异常检测<br>内建故障恢复机制<br>资源调度策略 |


    1）性能场景：在系统处于高峰时期，保证登陆的每个顾客所作的选择和查询的响应时间能在5s以内，如果需要等待则给出有友好的提示。系统可以保证以最快速度同时响应500个用户的操作。


    ![](img/6b451d038dc64487adac52ab7c5c2495_426_0.png)


    2）安全性场景：杜绝非法用户试图绕过应用服务器直接连接到数据库服务器的端口上，防止非法窃取注册用户个人信息；屏蔽某IP短时间内的大量无意义的访问，以防被挤爆，使正常用户无法使用。保证系统数据的机密性和完整性。


    ![](img/6b451d038dc64487adac52ab7c5c2495_427_0.png)


    源：系统外部


    刺激：试图非法操作信息


    制品：系统


    环境：在正常操作下


    响应：系统维持

    审核踪迹


    响应度量：

    半天内恢复

    校正数据


    3）易用性场景：在该系统中，用户希望在运行时能尽快取消某操作使错误的影响降到最低，取消在1秒内发生；要求具有基本电脑操作常识的人，可以根据良好的界面设计迅速学会使用方法，让熟手用户使用快捷键。


    ![](img/6b451d038dc64487adac52ab7c5c2495_428_0.png)


    4) 可用性场景：在正常的工作时间内，系统必须具有极高的可用性，保证出故障几率最低。出现故障时系统有相应的处理机制。


    ![](img/6b451d038dc64487adac52ab7c5c2495_429_0.png)


    ### 3.2.2 数据持久层的架构分析


    在数据持久层，我们使用Hibernate来进行处理，通过下面我们来看看如何通过Hibernate来满足系统的质量属性需求。


    ## Hibernate体系结构概要图


    ![](img/6b451d038dc64487adac52ab7c5c2495_430_0.png)


    ### 3.2.2 数据持久层的架构分析


    ### Hibernate满足的质量属性需求


    | 目标 | 实现方式 | 所采用的办法 |

    |---|---|---|

    | 性能 | 当应用程序需要在关联关系间进行导航的时候，由 Hibernate 获取关联对象。同时，Hibernate 的 Session 在事务级别进行持久化数据的缓存操作。
    | 抓取策略、缓存机制 |

    | 安全性 | 并发操作时，保证数据的排他性 | 使用锁机制 |

    | 易用性 | 用户在进行 CRUD 操作请求时，可以得到 Hibernate 的及时处理，迅速得到反馈。 | 封装 JDBC |


    ### 3.2.2 业务逻辑层的架构分析


    业务逻辑层作为该系统的关键部分，对系统的灵活性实现起着决定性的作用。在本系统的业务逻辑层架构层中，采取了MVC模式，下面简单介绍一下MVC模式的好处：


    - (1) 实现了客户端表示层和业务逻辑层的完全分离

    - (2) 高效可靠的事务处理

    - (3) 具有良好的易用性，安全性


    ## MVC模式访问流程：


    ![](img/6b451d038dc64487adac52ab7c5c2495_434_0.png)


    ## MVC模式在本系统中应用：


    当客户利用网页浏览器，发出HTTP请求时，这通常会牵涉到送出表单数据，例如用户名和密码。Servlet收到这样的数据并解析数据。Servlet扮演控制器的角色，处理你的请求，通常会向模型（一般是数据库）发出请求。处理结果往往以JavaBean的形式打包。视图就是JSP，而JSP唯一的工作就是产生页面，表现模型的视图以及进一步动作所需要的所有控件。当页面返回浏览器作为视图显示出来，用户提出的进一步请求，也会以同样的方式处理。


    由于JSP继承了J2EE良好的易用性和安全性，从而为实现系统的关键质量属性奠定了基础。在MVC模式中，视图不再是经典意义上的模型的观察者。当模型发生改变时，视图的确间接的从控制器收到了相当于通知的东西，控制器可以把bean送给视图，以使得视图取得模型的状态。所以，视图在HTTP响应返回到浏览器时只需要一个状态信息的更新。只有当页面被创建和返回时，创建视图并结合模型状态才有意义。这使得提升系统的性能成为可能。只有当相应的操作被执行，系统才会去获取关联对象，并且视图不会直接模型向注册去接受状态信息，使得系统的安全性得到大大提高。


