  - '[PAGE 150]


    # 五、软件体系结构的抽象模型


    +   - 连接件

    +     通过对组件间交互规则的建模来实现组件间的连接。与组件不同，连接件不需编译。


    +   - 定义6: 连接件是组件运算的实现，它是六元组<ID, Role, Beha, Msgs, Cons, Non-Func> 其中：

    +     （1）ID是连接件的标识。

    +     （2）Role为连接件和组件交互点的集合。其中Role=<Id,Action, Event, LConstraints>. Id是Role的标识；Action是Role活动的集合，每个活动由事件的连接（谓词）组成；Event是Role产生的事件集合；LConstraints是Role约束集合。

    +     （3）Beha是连接件的行为集合。

    +     （4）Msge是连接件中各Role中事件产生的消息的集合。

    +     （5）Cons是连接件约束的集合，它包括连接件的初始条件、前置条件和后置条件，有时为了明确表示这三个条件，可把它写成Cons(init,pre-cond,post-cond)。

    +     （6）Non-Func是连接件的非功能说明，包括连接件的安全性、可靠性说明等。'
  - '[PAGE 151]


    # 五、软件体系结构的抽象模型


    +   - 软件体系结构

    +   - 定义7: 设论域为U，（1）组件是一个软件体系结构；（2）连接件是一个软件体系结构；（3）组件经有限次连接（运算）后是软件体系结构。SA记为A=<C,O>其中C表示组成体系结构的组件集合，O表示组件运算的集合。

    +   - SA的性质

    +     - （1）封闭性（envelopment）：即组件与组件、组件与体系结构、体系结构与体系结构连接后仍是一个体系结构。

    +     - （2）层次性（hierarchy）：即体系结构可由组件连接而成，而体系结构又可以再经过连接组成新的更大的体系结构。

    +     - （3）可扩充性（expansibility）：即一个满足条件的新组件可以通过连接加入到结构中。'
