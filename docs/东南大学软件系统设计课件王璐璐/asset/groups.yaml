    系统的结构视图如下：


    ![](img/6b451d038dc64487adac52ab7c5c2495_419_0.png)


    - 在J2EE开发中，搭配良好的框架可以降低开发人员解决复杂问题的难度，而如何将框架整合起来，以使每一层都向另外的层次以松散的方式来提供接口，同时让组合的三个框架在每一层都以一种松耦合的方式彼此沟通，从而与低层的技术透明无关，这就是框架分析的目的和要求。

    - 根据前期对需求的分析，决定采用基于SSH框架来构建此分布式的信 息管理系统。

    - SSH是 struts+spring+hibernate的一个集成框架，是目前比较流行的一种Web应用程序开源框架。

    - SSH把Structs、Hibernate和Spring组合起来，目标就是希望能实现系统的“低耦合、高内聚”。也就是要求系统易于维护、易于适应变更、可重用性的特点。


    SSH多层的构架模式，从上到下依次为视图层、控制器层、模型层、持久化层和数据库层，如下图所示：


    ![](img/6b451d038dc64487adac52ab7c5c2495_421_0.png)


    视图层：职责是提供控制器，将页面的请求委派给其他层进行处理，为显示提供业务数据模型。


    控制层：职责是按预定的业务逻辑处理视图层提交的请求。


    - （1） 处理业务逻辑和业务校验

    - （2） 事务管理

    - （3） 管理业务层对象间的依赖关系

    - （4） 向表示层提供具体业务服务的实现类


    模型层：职责是将模型的状态转交视图层或者控制层，以提供页面给浏览器。


    数据持久层：职责是建立持久化类及其属性与数据库中表及其字段的对应关系。提供简化SQL语句的机制。实现基本的数据操作（增、删、读、改）


    数据库层：数据库的建立与管理。


    ## 规则（约束）：


    - 1. 系统各层次及层内部子层次之间都不得跨层调用。

    - 2. 由bean传递模型状态。

    - 3. 需要在表示层绑定到列表的数据采用基于关系的数据集传递。

    - 4. 对于每一个数据库表（Table）都有一个 **DB Entity class** 与之对应，由Hibernate完成映射。

    - 5. 有些跨数据库或跨表的操作（如复杂的联合查询）也需要由Hibernate来提供支持。

    - 6. 表示层和控制层禁止出现任何SQL语句。


    ## SSH框架介绍：


    视图层、控制器层用Structs框架来实现，模型层的功能Spring来完成。持久化层时使用Hibernate实现，在这层使用了DAO模式。


    Structs应用MVC模型使页面展现与业务逻辑分离，做到了页面展现与业务逻辑的低耦合。当充当表示层的页面需要变更时，只需要修改该具体的页面，不影响业务逻辑Bean等；同样，业务逻辑需要变更的时候，只需要修改相应的Java程序。


    使用Spring能运用IoC技术来降低了业务逻辑中各个类的相互依赖：假如，类A因为需要功能F而调用类B，在通常的情况下类A需要引用类B，因而类A就依赖于类B了，也就是说当类B不存在的时候类A就无法使用了。使用了IoC，类A调用的仅仅是实现了功能F的接口的某个类，这个类可能是类B，也可能是类C，由Spring的XML配置文件来决定。这样，类A就不再依赖与类B，耦合度降低，重用性得以提高。


    使用Hibernate能让业务逻辑与数据持久化分离，就是将数据存储到数据库的操作分离。在业务逻辑中只需要将数据放到值对象中，然后交给Hibernate，或者从Hibernate那里得到值对象。至于用DB2、Oracle、MySQL还是SQL
    Server，如何执行的操作，与具体的系统无关，只需在Hibernate的相关的XML文件里根据具体系统配置好。


