    ![](img/6b451d038dc64487adac52ab7c5c2495_164_0.png)


    图 3-1 管道－过滤器风格的体系结构'
  - '[PAGE 165]


    # 二、管道-过滤器风格


    +   - 过滤器是独立运行的构件

    +     - 非临近的过滤器之间不共享状态

    +     - 过滤器自身无状态

    +   - 过滤器对其处理上下连接的过滤器“无知”

    +     - 对相邻的过滤器不施加任何限制

    +   - 结果的正确性不依赖于各个过滤器运行的先后次序

    +     - 各过滤器在输入具备后完成自己的计算。完整的计算过程包含在过滤器之间的拓扑结构中。'
