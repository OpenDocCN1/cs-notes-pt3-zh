    - 新的体系结构划分了主数据中心、分数据中心和安全中心；三类中心分别有各自基于B/S结构的管理系统，相对独立。\n- 遵循面向服务的体系结构思想，为了实现数据的共享服务，各个中心将服务内容封装成Web\
    \ Service，作为其他中心访问本中心数据的入口，并通过Internet传输数据。\n  - SOAP 提供一种简单的、可扩展并且功能丰富的XML消息处理框架，用于定义高级别的应用程序协议，从而在分布式异构环境中提供更高的互操作性。\n\
    - 在该系统中，科学数据存储在各个数据中心上；各分数据中心通过数据服务的Web Service组件向主数据中心公布其元数据信息，作为实现数据共享的基础（元数据是描述数据的数据）。\n\
    - 通过在主数据中心上查找元数据信息，可以快速地获取科学数据的描述信息，定位数据访问入口——某个分数据中心的数据共享服务，然后实现数据的访问。\n\n"
