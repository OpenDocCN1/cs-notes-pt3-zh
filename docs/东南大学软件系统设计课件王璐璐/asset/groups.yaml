    - 通过提供方法的步骤来解决软件开发中的具体再现问题，这些微方法补充了通用的但与问题无关的分析和设计方法。\n\n### 实现模式\n\n目前的许多软件模式具有独特的面向对象风格。因此，人们往往认为，能够有效实现模式的唯一方式是使用面向对象编程语言，其实不然。\n\
    \n在设计层次，大多数模式只需要适当的编程语言的抽象机制，如模块或数据抽象。因此，可以用几乎所有的编程范式，并在所有的编程语言中来实现模式。\n\n## 设计模式方法分类\n\
    \n- Coad的面向对象模式\n- 代码模式\n- 框架应用模式\n- 形式合约\n\n### 1、Coad的面向对象模式\n\n1992年，美国面向对象技术大师\
    \ Peter Coad 从MVC的角度对面向对象系统进行了讨论，设计模式由最底层的构成部分（类和对象）及其关系来区分。他使用了一种通用的方式来描述一种设计模式：\n\
    \n1. 模式所能解决问题的简要介绍与讨论；\n2. 模式的非形式文本描述以及图形表示；\n3. 模式的使用方针：在何时使用以及能够与哪些模式结合使用。\n\
    \n将 Coad 的模式划分为以下三类：\n\n- （1）**基本的继承和交互模式**：主要包括 OOPL 所提供的基本建模功能，继承模式声明了一个类能够在其子类中被修改或被补充，交互模式描述了在有多个类的情况下消息的传递。\n\
    - （2）**面向对象软件系统的结构化模式**：描述了在适当情况下，一组类如何支持面向对象软件系统结构的建模。主要包括条目（item）描述模式、为角色变动服务的设计模式和处理对象集合的模式。\n\
    - （3）与MVC框架相关的模式。几乎所有 Coad 提出的模式都指明如何构造面向对象软件系统，有助于设计单个的或者一小组构件，描述了 MVC 框架的各个方面。但是，他没有重视抽象类和框架，没有说明如何改造框架。\n\
    \n### 2、代码模式\n\n代码模式与具体的程序设计语言或者类库有关，它们主要从语法的角度对软件系统的结构方面提供一些基本规范。\n\n这些模式对于类的设计不适用，同时也不支持程序员开发和应用框架，命名规范是类库中的名字标准化的基本方法，以免在使用类库时产生混淆。\n\
    \n### 3、框架应用模式\n\n- 框架是从特定域中提取出来的一组组件及其相互关系的可重用的体系结构。它定义了整体结构、类和对象的分割，各部分的主要责任，类和对象如何协作，以及控制流程。\n\
    - 框架记录了其应用领域共同的设计决策，因而框架更强调设计复用。\n- 程序员将框架作为应用程序开发的基础，特定的框架适用于特定的需求。\n\n### 4、形式合约\n\
    \n- 形式合约（formal contracts）也是一种描述框架设计的方法，强调组成框架的对象间的交互关系。\n- 有人认为它是面向交互的设计，对其他方法的发展有启迪作用。\n\
    - 形式化方法由于其过于抽象，而有很大的局限性，仅仅在小规模程序中使用。\n\n## 设计模式的分类\n\nGamma 和他的同事已发布了可用于 OO 系统的一系列设计模式，用一种类似分类目录的形式将设计模式记载下来。我们称这些设计模式为设计模式目录。\n\
    \n根据模式的目标，可以将它们分成创建型模式、结构型模式和行为型模式。创建型模式处理的是对象的创建过程，结构型模式处理的是对象/类的组合，行为型模式处理类和对象间的交互方式和任务分布。\n\
    \n根据它们主要的应用对象，又可以分为主要应用于类的和主要应用于对象的。\n\n### 1. 创建型模式\n\n- 创建型模式对类的实例化过程进行了抽象，能够使软件模块做到与对象的创建和组织无关。\n\
    - 创建型模式隐藏了对象是如何被创建和组合在一起的，以达到使整个系统独立的目的。\n- 创建型模式包括：工厂方法（factory method）模式、抽象工厂（abstract\
    \ factory）模式、原型（prototype）模式、单例（singleton）模式和建造者（builder）模式\n\n### 2. 结构型模式\n\n\
    - 结构型模式描述如何将类或对象结合在一起构成更大的结构。\n- 根据描述事物的不同，可以分为类结构型模式和对象结构型模式。\n- 结构型模式包括：适配器（adapter）模式、桥接（bridge）模式、组合（composite）模式、装饰（decorator）模式、外观（facade）模式、享元（flyweight）模式和代理（proxy）模式\n\
    \n### 3. 行为型模式\n\n- 行为型模式是对在不同的对象之间划分责任和算法的抽象化，它不仅是关于类和对象的，而且是关于它们之间的相互作用的。\n\
    - 根据描述事物的不同，可以分为类行为模式和对象行为模式。\n- 行为型模式包括：职责链模式、命令模式、解释器模式、迭代器模式、中介者模式、备忘录模式、观察者模式、状态模式、策略模式、模板方法模式和访问者模式等。\n\
    \n## 中间件技术\n\n- 随着信息化建设的逐步进行，一个企业可能同时运行着多个不同的业务系统，分别基于不同的操作系统、数据库和异构的网络环境。\n-\
    \ 对每个应用系统而言，在设计和开发时不仅要关心业务逻辑，还必须处理分布式环境中复杂的通信和异构问题，为此出现了中间件。\n\n- 中间件是一种独立的系统软件或服务程序，分布式应用软件借助这种软件在不同的技术之间共享资源。\n\
    - 中间件位于操作系统之上，管理计算资源和网络通信，实现应用之间的互操作。\n- 例如：CORBA，J2EE等\n\n- 中间件的基本功能：\n  - 负责客户机和服务器之间的连接和通信，以及客户机和应用层之间的高效率通信机制；\n\
    \  - 提供应用层不同服务之间的互操作机制，以及应用层和数据库之间的连接和控制机制；\n  - 提供一个多层体系结构的应用开发和运行的平台，支持模块化应用开发；\n\
    \  - 屏蔽硬件、操作系统、网络和数据库差异；\n  - 提供应用的负载均衡和高可用性、安全机制和管理功能；\n  - 提供一组通用的服务，避免重复的工作和使应用之间可以协作。\n\
    \n### 中间件的分类\n\n采用自底向上的方式来划分，可分为底层中间件、通用型中间件和集成型中间件三个层次。\n\n- 底层中间件主流技术：JVM（Java虚拟机）、CLR（公共语言运行库）、ACE（自适配通信环境）\n\
    - 通用型中间件主流技术：RPC（远程过程调用）、ORB（对象请求代理）\n- 集成型中间件主流技术：Workflow、EAI（企业应用集成）\n\n###\
    \ 中间件的应用\n\n中间件提供了应用系统基本的运行环境，也为应用系统提供了更多的高级服务功能。\n\n![](img/6b451d038dc64487adac52ab7c5c2495_338_0.png)\n\
    \n| 人员 | 集成对象 | 技术 |\n| --- | --- | --- |\n| 业务设计人员 | 业务过程 | 业务流程，工作流 |\n| IT\
    \ 技术人员 | 构件和服务 | EJB, CCM, COM |\n| 基础架构人员 | 消息 | MQSeries, TIBCO, JMS |\n| 基础架构人员\
    \ | 传输 | .NET, CORBA, Java/RMI |\n\n不同层次的集成示意图\n\n### 中间件的发展趋势\n\n- 规范化。规范化的建立极大地促进了中间件技术的发展，同时保证了系统的扩展性、开放性和互操作性。\n\
    - 构件化和松耦合。除了已经得到广泛应用的 CORBA、DCOM 等适应 Intranet 的构件技术外，随着企业业务流程整合和电子商务应用的发展，中间件技术朝着面向\
    \ Web 和松散耦合的方向发展。\n- 平台化。一些大的中间件厂商在已有的中间件产品基础上，提出了完整的面向互联网的软件平台战略计划和应用解决方案。\n\n\
    ### 主要的中间件\n\n- 远程过程调用：\n  - RPC 是一种广泛使用的分布式应用程序处理方法。\n  - 应用程序使用 RPC 来远程执行一个位于不同地址空间里的过程，并且从效果上看和执行本地调用相同。\n\
    \  - 一个 RPC 应用可以分为两个部分，分别是服务器和客户（进程）。\n  - 服务器和客户可以位于同一台计算机上，也可以位于不同计算机上，它们之间通过网络进行通信。\n"
