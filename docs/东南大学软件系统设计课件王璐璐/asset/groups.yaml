    console.log(\"Hello KIMI!\");\n```\n```\n\n## 第8步：分析体系结构方法\n\n在已确定了若干场景并进行了分析之后，评估小组就可以引导体系结构设计师在所描述的体系结构的基础上实现第7步中得出的最高优先级的场景，对相关的体系结构决策如何有助于该场景的实现做出解释\n\
    \n- 与第6步类似\n- 对新增的场景，分析其体系结构方法；对不变的场景，进行检查\n\n## 第9步：陈述结果\n\n最后，需要把在ATAM分析中所得到的各种信息进行归纳总结，并呈现给相关人员\n\
    \n在这一陈述中，评估负责人概要介绍ATAM评估的各个步骤和得到的各种信息，包括商业环境、促成该体系结构的主要需求、约束条件和体系结构等，但最重要的结果如下：\n\
    \n- 文档化的体系结构方法\n- 若干场景及其优先级\n- 基于质量属性的若干问题\n- 效用树\n- 风险决策、无风险决策、敏感点、权衡点\n\n- 以时间为维度，评估分为4个阶段，\n\
    \  - 第0阶段：建立阶段\n    - 合作关系的建立——评估客户和评估人员之间\n    - 准备工作——组建评估小组，召开开工会议，进行准备\n \
    \ - 第1阶段：第1~6步\n    - 以体系结构为中心\n    - 重点是获取体系结构信息并对其进行分析\n  - 第2阶段：第7~9步\n   \
    \ - 以相关人员为中心\n    - 重点是获知相关人员的观点，并验证第1阶段的结果\n  - 第3阶段：后续阶段\n    - 形成最终报告、对后续活动（如果有的话）做出规划\n\
    \    - 评估小组在此阶段实现文档和经验的更新\n\n- 第0阶段\n- 合作关系的建立\n- 评估人员和评估客户的交流\n- 评估客户应该是所评估体系结构对应的项目有一定影响力的人，而且可以联系到很多位体系结构相关人员\n\
    - 客户应对所要采用的评估方法有基本了解，并且知道在评估过程中都要做哪些工作\n- 客户应对所要评估的体系结构及其系统做出描述\n- 假设评估负责人已经决定可以进行评估，则应商谈并签署关于评估工作的合同或协议\n\
    - 要解决好信息专有性问题。例如，评估小组可能需要签署不得泄露该评估信息的协议\n\n- 第一阶段\n- 完成第1~6步的工作\n- 通过收集足够多的信息，以决定：\n\
    \  - 之后的评估工作是否可行、能否顺利展开\n    - 如果不行，就可在为第2阶段的工作召集更多的相关人员之前，在第1阶段及时终止\n  - 是否需要更多的体系结构文档\n\
    \    - 如果需要，则应明确需要的是哪些类型的文档，以及应以什么形式提交这些文档\n  - 哪些相关人员应参与第2阶段的工作\n    - 在第一阶段的最后，评估出资人要保证让合适的相关人员参与第2阶段的工作\n\
    \n## 第二阶段\n\n在简要重复第1~6步工作的基础上，进行第7~9步的工作\n\n| 步骤 | 所做工作 | 第1阶段的参与者 | 第2阶段的参与者\
    \ |\n|---|---|---|---|\n| 1 | ATAM方法的陈述 |  |  |\n| 2 | 商业动机的陈述 |  |  |\n| 3 |\
    \ 体系结构的陈述 | 评估小组和项目决策者 | 评估小组、项目决策者和所有相关人员 |\n| 4 | 确定体系结构方法 |  |  |\n| 5 | 生成质量属性效用树\
    \ |  |  |\n| 6 | 分析体系结构方法 |  |  |\n| 7 | 集体讨论并确定场景优先级 | — |  |\n| 8 | 分析体系结构方法\
    \ |  |  |\n| 9 | 评估结果陈述 |  |  |\n\n- 第三阶段\n- 生成最终报告\n  - 在ATAM评估快要结束时，必须撰写并提交最终的评估报告：做了哪些工作、有何发现、得出了什么结论等\n\
    - 收集数据\n  - 针对参与者/评估小组成员的改进意见调查，询问对评估实践的看法\n  - 针对评估客户/评估小组成员的成本调查\n  - 针对评估客户的长期收益调查\n\
    - 更新工作产品仓库\n  - 对在刚完成的评估中所用到的或所生成的工作产品进行维护，这将有助于更好地进行未来的评估工作，包括：成本/收益信息、场景、待分析的问题、参与者的意见、评估的最终报告\n\
    \n## ATAM方法\n\n| 针对第1阶段 | 针对第2阶段 |\n|---|---|\n| 较少的相关人员(2~4人) | 许多相关人员(10~15人)\
    \ |\n| 以体系结构为中心 | 以相关人员为中心 |\n| 面向解决方案 | 面向问题 |\n| 面向分析 | 面向验证 |\n| 促进对体系结构的理解\
    \ | 促进相关人员之间的交流 |\n| 场景主要用于效用树的创建 | 场景主要用于效用树的验证 |\n| 大信息量的、非正式的技术上的交流 | 有组织的会议\
    \ |\n\n## 2. SAAM评估方法\n\n- SAAM (Software Architecture Analysis Method)\n- 主要分析体系结构的可修改性；也可以对系统属性及系统功能进行分析\n\
    - 评估方法\n  - 描述场景、划分优先级、分析体系结构问题\n- SAAM评估的输入\n  - 一组场景\n- SAAM评估的输出\n  - 将代表了未来可能做的更改的场景与体系结构对应起来，显示出体系结构中未来可能具有较高复杂性的地方，估计预期工作量\n\
