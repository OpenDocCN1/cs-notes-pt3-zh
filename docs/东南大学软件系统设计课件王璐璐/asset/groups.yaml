    ATAM（Architecture Tradeoff Analysis Method）：SEI提出的一种软件构架评估方法。ATAM评估方法的主要目的：\n\n\
    - 1) 提炼出软件质量属性需求的精确描述；\n- 2) 提炼出构架设计决策的精确描述；\n- 3) 评估这些构架设计决策，并判定其是否令人满意地实现了这些质量需求。\n\
    \nATAM评估方法：并非把每个可以量化的质量属性都进行详尽的分析，而是使众多的风险承担者（包括经理、开发人员、测试人员、用户、客户等等）都参与进来，由此而达到上述目标的。\n\
    \nATAM是一种挖掘潜在风险，降低或者缓和现有风险的软件构架评估方法。因此，以下三点是评估中要特别注重的：风险、敏感点和权衡点。\n\n#### (2)\
    \ 构架涉众\n\n- 普通用户\n- 用户管理员\n- 票务管理员\n- 开发人员\n- 测试人员\n\n#### (3) 评估步骤\n\nATAM主要分以下几个步骤：\n\
    \n- 1) ATAM描述；\n- 2) 商业动机表述；\n- 3) 软件构架表述；\n- 4) 确定构架方式；\n- 5) 生成效用树；\n- 6) 分析构架方式；\n\
    - 7) 确定场景及其优先级；\n- 8) 进一步分析构架方式；\n- 9) 得出结论。\n\n![](img/6b451d038dc64487adac52ab7c5c2495_536_0.png)\n\
    \n### 2 商业动机的描述\n\n项目经理从开发组织和客户角度，来表述票务系统的商业目标，综合如下：\n\n- 从开发组织角度：开发一个模块性强、实时高效、界面良好、与外部其他系统兼容良好的系统，这使得开发组织能够把整个产品或某个模块卖给其他客户，同时由于良好的界面和业务处理效率而受市场欢迎。\n\
    - 从客户角度：系统容易操作，可维护性好、系统稳定、可以及时准确的处理用户的在线订票或查询业务。\n\n根据上述目标，质量属性可以划分为两类：\n\n高优先级质量属性：\n\
    \n- 1) 性能\n- 2) 安全性\n- 3) 易用性\n- 4) 可用性\n\n重要但优先级较低的属性：\n\n- 1) 模块性\n- 2) 可维护性\n\
