    \  - 管理类型的子系统一般不执行具体操作，它的主要功能是按照自己的职能指挥下级完成任务，功能性操作一般由执行类型的子系统完成。\n  - 在一般情况下，除最高级管理子系统外，子系统一般是“有问才答”，即使在必要的情况下需要积极寻找事件时，也必须征得上级系统的许可，保证了系统的控制流不会分散。\n\
    \n### 事件驱动风格实例\n\n```\nprivate void initialize() { //窗口初始化代码\n...\n//btnPress就是这次点击操作中的事件源\n\
    Button btnPress = new JButton();\n//向事件源btnPress植入侦听器对象ButtonEventHandler\nbtnPress.addActionListener(new\
    \ ButtonEventHandler(this));\n...\n}\nclass ButtonEventHandler implements ActionListener\
    \ {\n    //窗体对象\n    private EventDemo form = null;\n    //通过构造函数传入窗体对象，\n   \
    \ //作用在于让侦听器对象明白事件源处于\n    //哪个窗体容器中\n    public ButtonEventHandler(EventDemo\
    \ form) {\n        this.form = form;\n    }\n    //委托方法\n    public void actionPerformed(ActionEvent\
    \ e) {\n        //该方法将会把事件的处理权交给窗体容器类的btnPress_Click方法处理。\n        this.form.btnPress_Click(e);\n\
    \    }\n}\n\n//真正的事件处理代码片断：\nprivate void btnPress_Click(ActionEvent e) {\n  \
    \  String message = \"你点击的按钮名叫:\"\n        + ((JButton) e.getSource()).getName();\n\
    \    this.txtMessage.setText(message);\n}\n```\n\n### 事件驱动风格优点\n\n- 事件驱动风格非常适合于描述系统族，在属于同一族的任何系统中，系统的高级管理子系统的描述是完全类似的，便于重用；\n\
    - 由于最高管理子系统牢牢的掌握着控制权，又因为各同级子系统一般不直接发生关系，因此容易实现并发处理和多任务操作；\n- 基于事件驱动风格的系统具有良好的可扩展性，设计者只需为某个对象注册一个事件处理接口就可以将该对象引入整个系统，同时并不影响其它的系统对象。\n\
    \n### 事件驱动风格不足\n\n- 组件放弃了对系统计算的控制。一个组件触发一个事件时，不能确定其它组件是否会响应它。而且即使它知道事件注册了哪些组件，它也不能保证这些过程被调用的顺序。\n\
    - 数据交换的问题。有时数据可被一个事件传递，但另一些情况下，基于事件的系统必须依靠一个共享的仓库进行交互。在这些情况下，全局性能和资源管理便成了问题。\n\
    - 既然过程的语义必须依赖于被触发事件的上下文约束，关于正确性的推理存在问题。\n\n### 事件驱动风格和面向对象风格的关系\n\n- 基于面向对象风格的系统由多个封装起来的对象构成，对象之间通过消息传递实现通信，而事件驱动正是对消息传递机制的一种实现。所以基于事件驱动风格的系统往往都是面向对象的。\n\
    \n## 五、层次系统风格\n\n- 一个分层系统采用层次化的组织方式构建，系统中的每一层都要承担两个角色。\n  - 首先，它要为结构中的上层提供服务；\n\
    \  - 其次，它要作为结构中下面层次的客户，调用下层提供的功能函数。\n\n### 分层风格特征\n\n- 一个概念上的分层模型如下图所示：\n\n![](img/6b451d038dc64487adac52ab7c5c2495_209_0.png)\n\
    \n### 分层风格实例\n\n- 分层风格实例：计算机网络的设计\n\n- 概述\n  - 网络协议设计者将计算机网络中的各个部分按其功能划分为若干个层次（Layer），其中的每一个层次都可以看成是一个相对独立的黑箱、一个封闭的系统。用户只关心每一层的外部特性，只需要定义每一层的输入、数据处理和输出等外部特性。\n\
    \n- ISO/OSI网络体系结构\n\n![](img/6b451d038dc64487adac52ab7c5c2495_211_0.png)\n\n应用控制项（资源子网）\n\
    \n传输介质接口\n\n通讯控制项（通讯子网）\n\n| 左侧体系 | 右侧体系 |\n| --- | --- |\n| 应用层 | 应用层 |\n| 表示层\
    \ | 表示层 |\n| 会话层 | 会话层 |\n| 传输层 | 传输层 |\n| 网络层 | 网络层 |\n| 链路层 | 链路层 |\n| 物理层 |\
    \ 物理层 |\n\n物理传输介质位于两侧物理层下方。\n\n| OSI 参考模型 | TCP/IP概念层 | 功能与常用协议 |\n| --- | ---\
    \ | --- |\n| 7 应用层、6 表示层、5 会话层 | 应用层 | 各种服务及应用程序通过该层利用网络。常用协议：HTTP，FTP，SMTP（简单邮件传输协议）等\
    \ |\n| 4 传输层 | 传输层 | 端到端数据传输及进行流量控制，常用协议：TCP，UDP（用户数据报协议） |\n| 3 网络层 | 网际层 | 负责数据的传输，路由及地址选择。常用协议：IP，ARP（地址解析协议）\
    \ |\n| 2 数据链路层、1 物理层 | 网络接口 | 是针对不同物理网络的连接形式而制定的协议。例如：Ethernet，FDDI，ATM |\n"
