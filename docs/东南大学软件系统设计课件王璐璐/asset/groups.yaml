    # 设计模式概述


    # ◎ MVC的背景


    用户界面逻辑的更改往往比业务逻辑频繁，尤其是在基于 Web 的应用程序中。基于 Web 的瘦客户端应用程序的优点之一是可以随时更改用户界面，而不必重新分发应用程序。如果将显示代码和业务逻辑组合在一起并放在单个对象中，则每次更改用户界面时，都必须修改包含业务逻辑的对象。'
  - '[PAGE 306]


    # 设计模式概述


    # ◎ MVC的背景


    +   > 在很多情况下，应用程序需要以不同的方式显示同一数据。例如，表格显示，趋势图显示，柱状图显示，饼图显示。


    +   > 界面开发与业务逻辑开发所需要的技能不同，在这两方面都精通比较困难。


    +   > 与业务逻辑相比，用户界面代码对设备的依赖性往往更大。例如，要将应用程序从基于浏览器的应用程序迁移到个人数字助理（PDA）或支持 Web 的手机上，则必须替换很多用户界面代码，而业务逻辑可能不受影响。'
  - '[PAGE 307]


    # # 设计模式概述


    # ◎ MVC的背景


    ![](img/6b451d038dc64487adac52ab7c5c2495_307_0.png)'
  - '[PAGE 308]


    <!-- no content -->'
  - '[PAGE 309]


    # 设计模式概述


    # ◎ MVC的处理过程


    +   (1) 控制器接收用户的请求，并决定应该调用哪个模型来进行处理；

    +   (2) 模型用业务逻辑来处理用户的请求并返回数据；

    +   (3) 控制器用相应的视图格式化模型返回的数据，并通过表示层呈现给用户。'
  - '[PAGE 310]


    # 设计模式概述


    # MVC模式的优点


    +   支持多个视图。因为视图与模型分离，而且模型与视图之间没有直接依赖性，所以用户界面可以同时显示同一数据的多个视图。


    +   适应更改。用户界面要求的更改往往比业务规则快。用户可能更喜欢新设备（如手机或 PDA）采用另一颜色、字体、屏幕布局和支持级别。因为模型不依赖于视图，所以将新类型的视图添加到系统中通常不会影响模型。因此，更改的作用范围仅限于视图。'
  - '[PAGE 311]


    # 设计模式概述


    # MVC模式的缺点


    +   复杂性。MVC 模式引入了新的间接级别，因此增加了解决方案的复杂性。还增加了用户界面代码的事件驱动特性，调试用户界面代码会变得更加困难。


    +   频繁更新的成本。将模型与视图分离并不意味着模型的开发人员可以忽略视图的特性。例如，如果模型发生频繁更改，则它可能向视图发出大量更新请求。一些视图（如图形显示）的显示可能需要一定时间。'
  - '[PAGE 312]


    # 设计模式的基本成分


    ◎ 模式名称：通常用来描述一个设计问题、它的解法和后果，由一到两个词组成。


    ◎ 问题：告诉我们什么时候要使用设计模式、解释问题及其背景。


    例如：MVC模式关心用户界面经常变化的问题。它必须易于修改用户界面，但软件的功能核心不能被这种修改影响。'
  - '[PAGE 313]


    # 设计模式的基本成分


    ◎ 解决方案：描述设计的基本要素，它们的 关系、各自的任务以及相互之间的合作。


    例如：MVC模式中控制器接收输入，输入往往是鼠标移动、单击鼠标按键或键盘输入等事件。事件转换成服务请求，这些请求再发送给模型或视图。


    ◎ 效果：描述应用设计模式后的结果和权衡。比较与其他设计方法的异同，得到应用设计模式的代价和优点。


    例如：不同方案的时间和空间权衡；方案的可重用性、灵活性、可扩展性、可移植性等。'
  - "[PAGE 314]\n\n# 设计模式的描述\n\n+   ◎ 如果要理解和讨论模式，就必须以适当形式描述模式。\n+   \n+   ◎ 好的描述有助于我们立即抓住模式的本质，即模式关心的问题是什么，以及提出的解决方案是什么？\n\
    +   \n+   ◎ 模式也应该以统一方式来描述"
  - '[PAGE 315]


    # # 设计模式的描述


    Erich Gamma博士等人采用下面的固定模式来描述：


    +   1. **模式名称和分类**：模式名称和一个简短的摘要。

    +   2. **目的**：即设计模式的用处、基本原理和目的、它针对的是什么特殊的设计问题。

    +   3. **别名**：同一个模式可能会有不同的命名。

    +   4. **动机**：描述一个设计问题的方案，以及模式中类和对象的结构如何解决这个问题。'
  - '[PAGE 316]


    # 设计模式的描述


    +   (5) 应用：在什么情况下可以应用本设计模式。

    +   (6) 结构：用对象模型技术对本模式进行表示。

    +   (7) 成分：组成本设计模式的类和对象及它们的职责。

    +   (8) 合作：成分间如何合作实现他们的任务。

    +   (9) 效果：该模式如何支持它的对象；如何在在使用本模式时进行权衡。'
  md: "\n## 使用SOA进行服务组合实例\n\n假设股票行业存在以下6个服务：\n\n- **Country ()**\n  输入参数：国家编码。输出项：国家名称和其他信息。\n\
    - **YellowPages ()**\n  输入参数：公司名称；输出项：企业代码，所在国家等其他信息。\n- **NewYorkStock ()**\n\
    \  输入参数：公司代码，时间；输出项：该公司在纽约的股票价格（美元）。\n- **LondonStock ()**\n  输入参数：公司代码，时间；输出项：该公司在伦敦的股票价格。\n\
    - **USToRMB ()**\n  输入参数：美元价格，时间；输出项：对应的人民币价格。\n- **UKToRMB ()**\n  输入参数：英镑价格，时间；输出项：对应的人民币价格。\n\
    \n## 使用SOA进行服务组合实例\n\n- 用户想通过“跨国公司名称”和“时间”找出该跨国公司在纽约的股票折合成人民币的价格以及该公司所在国家的信息。\n\
    - 分析：\n  - 输入参数：跨国公司的名称、时间\n  - 输出：该公司的股票价格（RMB）以及该公司所在国家\n  - 如何实现对给定服务的组合，找出满足用户的信息？\n\
    \n![](img/6b451d038dc64487adac52ab7c5c2495_295_0.png)\n\n输入参数：国家名称、时间\n\n查询分解\n\
    \n国家名称\n\n时间\n\nYellowPages（）\n\nNewYork-Stock（）\n\n公司 ID\n\n国家 ID\n\nCountry（）\n\
    \n美元价格\n\nUSDToRMB（）\n\n国家信息\n\n人民币价格\n\n结果生成\n\n输出结果：人民币价格、所在国家信息\n\n## SOA应用——统一认证\n\
    \n在石油企业内部，有许多不同的网站，进入每个网站，都需要身份验证，不仅浪费时间而且容易遗忘代码，另外，网站维护人员对各种服务需要建立相应的用户认证与信息管理系统，分布于个服务器中的用户数据不仅浪费维护人员的时间，而且过于分散的用户数据不利于统计和管理。用户的需求和管理要求促使用户趋于统一，产生了统一者认证。\n\
    \n统一认证的实现是基于SOA的架构。\n\n## SOA应用——统一认证\n\n![](img/6b451d038dc64487adac52ab7c5c2495_297_0.png)\n\
    \n从中可以看出使用SOA的优点：将身份验证这一功能模块发布成一种服务，其他的软件可以通过UUDI查找该服务，然后将该服务与服务的实现进行绑定。\n\n##\
    \ 基于体系结构的软件开发\n\nliao@seu.edu.cn\n\n## 目录\n\n- 设计模式\n- 中间件技术\n- 基于体系结构的设计方法\n\
    - 体系结构的设计和演化\n- 基于体系结构的软件开发模型\n- 基于体系结构的软件过程\n- 软件体系结构演化模型\n\n## 设计模式概述\n\n◎ 模式是指从某个具体的形式中得到的一种抽象，在特殊的非任意性环境中，该形式不断地重复出现。\n\
    \n◎ 模式是前人经验的总结，它使人们可以方便地复用成功的设计和体系结构。\n\n◎ 当人们在特定的环境下遇到特定类型的问题，采用他人已使用过的一些成功解决方案，一方面可以降低分析、设计和实现的难度，另一方面可以使系统具有更好的可复用性和灵活性。\n\
    \n## 设计模式概述\n\n- 模式是给定上下文中普遍问题的普遍解决方案，在软件开发方面分为：\n  - 体系结构模式（风格）\n  - 设计模式\n \
    \ - 惯用法\n- 前两者与程序开发语言无关。\n\n## 设计模式概述\n\n- 一个软件体系结构的模式描述了一个出现在特定设计语境中的特殊的再现设计问题，并为它的解决方案提供了一个经过充分验证的通用图示。\n\
    - 解决方案图示通过描述其组成构件及其责任和相互关系以及它们的协作方式来具体指定。\n\n## 设计模式概述\n\n◎ 软件系统的基本组成单元是模块、类等，但单个的模块或类并没有什么意义，不能提供应用的解决方案。\n\
    \n◎ 往往需要多个模块、类、对象、服务、进程、线程、构件等共同协作，提供应用问题的解决方案。\n\n◎ 设计模式可以方便地重用成功的设计和结构，还提供了类和对象接口的明确的说明书和这些接口的潜在意义。\n\
    \n◎ 模式的实现要比解决方案复杂得多。可以使用各种语言来实现。\n\n## 设计模式概述\n\n◎ 以MVC为例\n\n软件系统的重要功能之一是从数据存储（文件/数据库）中检索数据，并将其显示给用户。在用户更改数据之后，系统再将更新内容存储到数据存储中。如果将数据存储和界面显示代码放在一起，则可以减少编码量并提高应用程序性能。\n\
    \n但这样做也存在很多问题。\n\n## 设计模式概述\n\n### ◎ MVC的背景\n\n用户界面逻辑的更改往往比业务逻辑频繁，尤其是在基于 Web 的应用程序中。基于\
    \ Web 的瘦客户端应用程序的优点之一是可以随时更改用户界面，而不必重新分发应用程序。如果将显示代码和业务逻辑组合在一起并放在单个对象中，则每次更改用户界面时，都必须修改包含业务逻辑的对象。\n\
    \n## 设计模式概述\n\n### ◎ MVC的背景\n\n- > 在很多情况下，应用程序需要以不同的方式显示同一数据。例如，表格显示，趋势图显示，柱状图显示，饼图显示。\n\
    - > 界面开发与业务逻辑开发所需要的技能不同，在这两方面都精通比较困难。\n- > 与业务逻辑相比，用户界面代码对设备的依赖性往往更大。例如，要将应用程序从基于浏览器的应用程序迁移到个人数字助理（PDA）或支持\
    \ Web 的手机上，则必须替换很多用户界面代码，而业务逻辑可能不受影响。\n\n## 设计模式概述\n\n### ◎ MVC的背景\n\n![](img/6b451d038dc64487adac52ab7c5c2495_307_0.png)\n\
    \n## 设计模式概述\n\n### ◎ MVC的处理过程\n\n- (1) 控制器接收用户的请求，并决定应该调用哪个模型来进行处理；\n- (2) 模型用业务逻辑来处理用户的请求并返回数据；\n\
    - (3) 控制器用相应的视图格式化模型返回的数据，并通过表示层呈现给用户。\n\n## 设计模式概述\n\n### MVC模式的优点\n\n- 支持多个视图。因为视图与模型分离，而且模型与视图之间没有直接依赖性，所以用户界面可以同时显示同一数据的多个视图。\n\
    - 适应更改。用户界面要求的更改往往比业务规则快。用户可能更喜欢新设备（如手机或 PDA）采用另一颜色、字体、屏幕布局和支持级别。因为模型不依赖于视图，所以将新类型的视图添加到系统中通常不会影响模型。因此，更改的作用范围仅限于视图。\n\
    \n## 设计模式概述\n\n### MVC模式的缺点\n\n- 复杂性。MVC 模式引入了新的间接级别，因此增加了解决方案的复杂性。还增加了用户界面代码的事件驱动特性，调试用户界面代码会变得更加困难。\n\
    - 频繁更新的成本。将模型与视图分离并不意味着模型的开发人员可以忽略视图的特性。例如，如果模型发生频繁更改，则它可能向视图发出大量更新请求。一些视图（如图形显示）的显示可能需要一定时间。\n\
    \n## 设计模式的基本成分\n\n◎ 模式名称：通常用来描述一个设计问题、它的解法和后果，由一到两个词组成。\n\n◎ 问题：告诉我们什么时候要使用设计模式、解释问题及其背景。\n\
    \n例如：MVC模式关心用户界面经常变化的问题。它必须易于修改用户界面，但软件的功能核心不能被这种修改影响。\n\n## 设计模式的基本成分\n\n◎ 解决方案：描述设计的基本要素，它们的\
    \ 关系、各自的任务以及相互之间的合作。\n\n例如：MVC模式中控制器接收输入，输入往往是鼠标移动、单击鼠标按键或键盘输入等事件。事件转换成服务请求，这些请求再发送给模型或视图。\n\
    \n◎ 效果：描述应用设计模式后的结果和权衡。比较与其他设计方法的异同，得到应用设计模式的代价和优点。\n\n例如：不同方案的时间和空间权衡；方案的可重用性、灵活性、可扩展性、可移植性等。\n\
    \n## 设计模式的描述\n\n◎ 如果要理解和讨论模式，就必须以适当形式描述模式。\n\n◎ 好的描述有助于我们立即抓住模式的本质，即模式关心的问题是什么，以及提出的解决方案是什么？\n\
    \n◎ 模式也应该以统一方式来描述\n\n## 设计模式的描述\n\nErich Gamma博士等人采用下面的固定模式来描述：\n\n- 1. **模式名称和分类**：模式名称和一个简短的摘要。\n\
    - 2. **目的**：即设计模式的用处、基本原理和目的、它针对的是什么特殊的设计问题。\n- 3. **别名**：同一个模式可能会有不同的命名。\n- 4.\
    \ **动机**：描述一个设计问题的方案，以及模式中类和对象的结构如何解决这个问题。\n\n## 设计模式的描述\n\n- (5) 应用：在什么情况下可以应用本设计模式。\n\
    - (6) 结构：用对象模型技术对本模式进行表示。\n- (7) 成分：组成本设计模式的类和对象及它们的职责。\n- (8) 合作：成分间如何合作实现他们的任务。\n\
    - (9) 效果：该模式如何支持它的对象；如何在在使用本模式时进行权衡。\n"
