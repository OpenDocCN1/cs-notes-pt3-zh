- pgno: 26
  md: '# 项目赞助人的责任


    项目赞助人通常对项目提供资金和支持职责：


    +   - 挑选并任命项目经理，批准项目核心成员的组成

    +   - 提供资金及审批重大财务事项

    +   - 监控项目组执行情况

    +   - 项目经理的求助对象


    ![](img/9c838e960f8e111c571ce22c05d4f375_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 项目经理的责任


    ![](img/9c838e960f8e111c571ce22c05d4f375_27_0.png)


    项目经理直接对项目赞助人负责，保证项目成功的实施。


    +   - 与项目赞助人协商，就项目的目标（QTC）和所需的资源达成共识

    +   - 挑选核心成员，并取得他们的支持

    +   - 在项目的进程中不断了解客户的需求

    +   - 在项目计划过程中领导及指导小组成员

    +   - 保证与项目干系人的沟通并汇报项目的进程

    +   - 监控项目的进程，保证项目按时间计划执行'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 项目成员的责任


    项目核心成员对项目经理负责，保证项目的完成


    +   - 参与项目的计划制定

    +   - 服从项目经理的指挥，执行计划分配的任务

    +   - 配合其他小组成员工作

    +   - 保持与项目经理沟通'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 范例背景介绍


    ![](img/9c838e960f8e111c571ce22c05d4f375_29_0.png)


    A国是公司的战略市场，其第二大运营商为TELECOM公司，我司于2005年4月5日正式中标一个100万线固网项目（N项目），该项目在2005年6月份开始实施，在实施过程，出现了以下三个方面的问题：


    +   - 延迟交付；

    +   - 发错货问题严重；

    +   - 初验测试问题屡出不穷，客户开始质疑我司软件版本管理 和质量控制能力；


    这些问题引起了TELECOM高层关注，对以后与我司的合作开始持观望态度。


    为此，代表处联系公司总部，准备在2005年7月31号前邀请TELECOM公司CTO带队到我司考察，并成立了客户考察工作项目组'
  merge: -1
  img_proc: true
