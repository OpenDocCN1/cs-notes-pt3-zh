- pgno: 94
  md: '# 沟通


    # 有效沟通的关键要素


    +   会前：

    +   ✓ 事先了解为什么开会，已经预期要取得什么结果

    +   ✓ 考虑是否可能取消会议

    +   ✓ 确定需要参加的最少人数

    +   ✓ 选择会议地点，会议的布置与会议目的相一致

    +   ✓ 会前和关键与会者就会议议题的持续时间进行沟通


    +   会中：

    +   ✓ 做好准备，按时开始，并首先点明会议的目的和议程

    +   ✓ 每位与会者都有发言的机会

    +   ✓ 对会议内容进行口头总结


    +   会后：

    +   ✓ 会后发布会议纪要给每位与会者

    +   ✓ 会议必须产生明确的决定

    +   ✓ 所有决定必须立即付诸行动


    ![](img/9c838e960f8e111c571ce22c05d4f375_94_0.png)'
