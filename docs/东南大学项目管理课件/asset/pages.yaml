- pgno: 8
  md: '# 各级课程对象及定位


    | 级别 | 课程名称 | 培训对象 | 课程定位 |

    |---|---|---|---|

    | 高层级 | 高级项目管理研讨 | 公司项目管理办公室成员、高层领导 | 怎样从流程和制度层面在公司内营造良好的项目管理环境，多项目管理，重在理念流程制度。
    |

    | 应用级 | 销售、工程、IPD、IT等专业项目管理 | 各专业领域人员 | 怎样将项目管理理念方法和工具与专业领域特点相结合，应用到具体工作领域中，申在各领域专业应用性
    |

    | 通用级 | 成功的项目管理 | 非项目管理专业人员 | 学习项目管理的基本方法与工具，将其应用到日常工作任务中，以提高效率和效果，重通用及实用 |


    PMP认证培训


    培训对象：项目管理专业人员


    课程定位：全面系统地学习项目管理九大知识领域，并做认证考试辅导，重理论知识、工具。'
