  md: "# 制定风险响应计划\n\n+   1. **规避（Avoidance）**\n+      指改变项目计划，以排除风险或条件，使项目目标不受影响。\n\
    +   \n+   2. **转移（Transference）**\n+      指设法将风险的后果连同应对的责任转移到第三方。\n+   \n+   3.\
    \ **减轻（Mitigation）**\n+      指设法把不利的风险事件的概率或后果降低到一个可以接受的临界值。\n+   \n+   4. **接受（Acceptance）**\n\
    +      该策略可以分为主动或被动方式。\n\n范例-05表"
  merge: -1
  img_proc: true
