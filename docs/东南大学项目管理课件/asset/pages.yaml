  md: "# 业界项目失败的因素\n\n+   项目失败的主要原因：\n+   \n+   - 缺少必须承担的义务和方向\n+   - 没有项目策略上的一致性\n\
    +   - 变化中不明确的效益\n+   - 不明确的目的/目标\n+   - 组织与项目目标不一致\n+   - 资源限制\n+   - 不明确的职责\n\
