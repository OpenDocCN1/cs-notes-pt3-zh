- pgno: 100
  md: '# # 变更管理


    # 变更管理的注意事项


    +   1. 变更发生时要首先确定“能做些什么，以及不能做些什么”

    +   2. 确定全体都一致同意的方案，提出变更步骤，并就将要做出的变更进行即时评估

    +   3. 申请/审批修改后的计划（修改部分）

    +   4. 保持/共享计划和信息最新状态

    +   5. 尽量做得“天衣无缝”，而且没有“痛苦”


    ![](img/9c838e960f8e111c571ce22c05d4f375_100_0.png)'
  merge: -1
  img_proc: true
