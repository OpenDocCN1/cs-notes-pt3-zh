- pgno: 61
  md: '# # 成本估算


    # 估算方法：


    # 自下而上估算方法


    +   - 估算最详细的计划活动费用，然后将这些活动费用汇总到更高层级


    # 专家判断法


    # 类比估算法


    +   - 利用历史信息和专家判断，只有当满足以下条件才比较可靠：

    +     - （a）先前的项目不仅在表面上且在实质上和当前项目是类似的；

    +     - （b）作估算的个人或小组具有必要经验


    # 参数成本法


    +   - 确定项目成本与编写计算机程序代码行的关系

    +   - `Quantity * Productivity Unit Rate`'
  merge: -1
  img_proc: true
