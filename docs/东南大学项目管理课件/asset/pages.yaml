- pgno: 58
  md: '# 资源、工期、成本估算


    # 工期估算


    **定义：**

    根据项目范围和资源的相关信息，确定（估计）完成所有活动所需的工期。


    **估算方法：**

    三点估算法：采用乐观、悲观和最可能的三点工期估算，并进行平均值、标准差值等有关计算来确定工期的方法。


    工期 = (a+4b+c) / 6


    专家判断法：由项目经理组织1~3名团队成员对任务消耗的工期进行估算，并确定项目日程。


    **关键提示：**

    任务的工期估算要以“谁来做”和“如何做”为基础。


    ![](img/9c838e960f8e111c571ce22c05d4f375_58_0.png)'
  merge: -1
  img_proc: true
