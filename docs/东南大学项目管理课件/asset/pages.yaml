- pgno: 2
  md: '# 引言：项目管理的历史和发展


    +   - 古代

    +     - 追溯到长城、埃及金字塔、都江堰、古罗马的供水渠

    +   - 近代项目管理的萌芽

    +     - 20世纪40年代，“曼哈顿计划”

    +   - 近代项目管理的成熟

    +     - 关键路线法（CPM）、计划评审技术（PERT）

    +   - 现代项目管理的新发展

    +     - 面向市场和竞争、注重人的因素、注重顾客、注重管理工具


    ![](img/9c838e960f8e111c571ce22c05d4f375_2_0.png)'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# 引言：项目管理的应用


    +   - 企业的成功有赖于每个项目的成功

    +     项目管理是企业商业目标的达成和战略实现的手

    +     段

    +     跨国公司像IBM、朗讯、诺基亚、惠普等在其公司运营的

    +     核心部分都采用了项目管理模式进行运作


    +   - 项目管理给企业带来的益处:

    +     缩短项目周期：一般都能够缩短10%以上

    +     降低成本，大约可以降低10%~20%以上

    +     减少风险、增加价值

    +     提高企业的应变能力

    +     例子：杜邦设备维修项目、北极星导弹项目'
  merge: -1
  img_proc: true
