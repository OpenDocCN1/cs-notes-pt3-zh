- pgno: 115
  md: '# 业界项目成功的因素


    影响项目成功的因素：


    +   - 项目的目标、范围是否明确；

    +   - 是否获得领导的积极支持；

    +   - 项目的组织是否健全、稳定；

    +   - 是否建立了有序的，有效的、良好的沟通渠道；

    +   - 是否具有有效、全面的项目管理，严格的变更控制；

    +   - 是否建立了良好的、积极的、团队合作的工作氛围；

    +   - 项目经理的经验；'
  merge: -1
