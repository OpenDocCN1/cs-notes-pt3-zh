- pgno: 97
  md: '# 项目进度控制


    # 实施监控过程中发现进度滞后，怎么办？


    选择最近的、时间估算较多的工作包实施以下措施：


    +   - 投入更多的人

    +   - 现有的人投入更多的时间（加班）

    +   - 换工作效率更高的人员去作

    +   - 改进工作方法和工具，提高效率

    +   - 缩小项目范围或降低活动质量要求'
  merge: -1
  img_proc: true
