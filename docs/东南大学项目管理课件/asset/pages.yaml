- pgno: 23
  md: '# 立项申请


    +   - 立项申请

    +   - 组建项目组

    +   - 策划/制作任务书

    +   - 项目开工会


    立项是项目开展前期工作的重要一环，其中可行性研究则是它的重要组成部分。


    可行性研究是对拟实施项目作详尽的技术经济分析和多方案比较，提出评价，从而对项目是否合理和可行性作出结论的过程。


    通过这个过程，储备一些可供选择的项目，使项目投资决策的基础工作超前；或取消一些不合理、不可行的项目，避免和减少投资决策的失误。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 组建项目组


    +   - 立项申请

    +   - 组建项目组

    +   - 策划/制作任务书

    +   - 项目开工会


    一个配置合理、团队合作的项目组是项目的核心，也是项目成功的保障。组建项目组时应该考虑：


    +   - 建立一个结构合理的项目组（OBS）

    +   - 寻找合适的人选，了解他们的技术、管理方面的优劣势，争取职能部门的支持。


    输出：


    +   - 项目组成员表


    OBS：组织分解结构（Organizational Breakdown Structure）'
  merge: -1
  img_proc: true
