    ## Lemma A


    For all integers $k \ge 0$, the following properties hold:


    - 1. $B_k$ has $2^k$ nodes.

    - 2. $B_k$ has height $k$.

    - 3. For $i = 0, \dots, k$, $B_k$ has exactly $\binom{k}{i}$ nodes at depth $i$.

    - 4. The root of $B_k$ has degree $k$ and all other nodes in $B_k$ have degree
    smaller than $k$.

    - 5. If $k \ge 1$, then the children of the root of $B_k$ are $B_{k-1}, B_{k-2},
    \cdots, B_0$ from left to right.


    ## Corollary B


    The maximum degree of an $n$-node binomial tree is $\lg n$.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_301_0.png)


    ## Implementation of a Binomial Heap


    Keep at each node the following pieces of information:


    - a field *key* for its key,

    - a field *degree* for the number of children,

    - a pointer *child*, which points to the leftmost-child,

    - a pointer *sibling*, which points to the right-sibling, and

    - a pointer *p*, which points to the parent.


    The roots of the trees are connected so that the sizes of the connected trees
    are in decreasing order. Also, for a heap H, *head*[H] points to the head of the
    list.


    - How count the cost of n insertions?

    - Amortized analysis(分摊代价)


    ## An O()

