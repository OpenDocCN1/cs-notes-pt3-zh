    \ pj 之后将元素 (x, o) 插入列表 Sj\n\n示例：插入键 15，i = 2\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_273_0.png)\n\
    \n## 删除\n\n要从跳表中删除一个键为 x 的元素，我们按如下步骤进行：\n\n- 我们在跳表中搜索 x，并找到键为 x 的元素的位置 p₀, p₁,\
    \ ..., pᵢ，其中位置 pⱼ 在列表 Sⱼ 中\n- 我们从列表 S₀, S₁, ..., Sᵢ 中删除位置 p₀, p₁, ..., pᵢ\n- 我们删除所有仅包含两个特殊键的列表，只保留一个\n\
    \n示例：删除键 34\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_274_0.png)\n\n## 空间使用\n\
    \n- 跳表所使用的空间取决于插入算法每次调用所使用的随机比特\n- 我们使用以下两个基本的概率事实：\n  - 事实 1：抛硬币时连续出现 i 次正面的概率是\
    \ 1/2^i\n  - 事实 2：如果 n 个元素中的每一个以概率 p 存在于一个集合中，那么该集合的期望大小为 np\n- 考虑一个有 n 个元素的跳表\n\
    \  - 根据事实 1，我们以概率 1/2^i 将元素插入列表 S_i\n  - 根据事实 2，列表 S_i 的期望大小为 n/2^i\n- 跳表使用的期望节点数为\n\
    \  ∑_{i=0}^{h} n/2^i = n ∑_{i=0}^{h} 1/2^i < 2n\n- 因此，一个有 n 个元素的跳表的期望空间使用为 O(n)\n\
    \n## 高度\n\n- 搜索和插入算法的运行时间受跳表高度 $h$ 的影响\n- 我们证明，以高概率，一个有 $n$ 个元素的跳表的高度为 $O(\\log\
    \ n)$\n- 我们使用以下额外的概率事实：\n  - 事实 3：如果 $n$ 个事件中的每一个事件发生的概率为 $p$，那么至少一个事件发生的概率至多为\
    \ $np$\n- 考虑一个有 $n$ 个元素的跳表\n  - 根据事实 1，我们以概率 $1/2^i$ 将元素插入列表 $S_i$\n  - 根据事实 3，列表\
    \ $S_i$ 至少有一个元素的概率至多为 $n/2^i$\n- 通过选取 $i = 3\\log n$，我们得到 $S_{3\\log n}$ 至少有一个元素的概率至多为\n\
    \  $n/2^{3\\log n} = n/n^3 = 1/n^2$\n- 因此，一个有 $n$ 个元素的跳表高度至多为 $3\\log n$ 的概率至少为\
    \ $1 - 1/n^2$\n\n"
