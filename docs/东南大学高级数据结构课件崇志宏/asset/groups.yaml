- raw:
  - '[PAGE 184]


    # Dimensions vs. Realities


    +   - Increasing the number of dimensions and/or realities decreases path length
    and increases per-node state

    +   - More dimensions has greater effect on path length

    +   - More realities provides stronger fault-tolerance and increased data availability

    +   - Authors do not quantify the different storage requirements

    +     - More realities requires replicating $(K,V)$ pairs


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_184_0.png)'
  - '[PAGE 185]


    # RTT Ratio


    +   - Incorporate RTT in routing metric

    +     - Each node measures RTT to each neighbor

    +     - Forward messages to neighbor with maximum ratio of progress to RTT


    | Number of dimensions | Non-*RTT* weighted routing (ms) | *RTT* weighted routing
    (ms) |

    |---:|---:|---:|

    | 2 | 116.8 | 88.3 |

    | 3 | 116.7 | 76.1 |

    | 4 | 115.8 | 71.2 |

    | 5 | 115.4 | 70.9 |'
  - '[PAGE 186]


    # Zone Overloading


    +   - Overload coordinate zones

    +     - Allow multiple nodes to share the same zone, bounded by a threshold MAXPEERS

    +     - Nodes maintain peer state, but not additional neighbor state

    +     - Periodically poll neighbor for its list of peers, measure RTT to each
    peer, retain lowest RTT node as neighbor

    +     - (K,V) pairs may be divided among peer nodes or replicated'
  - '[PAGE 187]


    # Multiple Hash Functions


    +   - Improve data availability by using $k$ hash functions to map a single key
    to $k$ points in the coordinate space

    +   - Replicate $(K,V)$ and store at $k$ distinct nodes

    +   - $(K,V)$ is only unavailable when all $k$ replicas are simultaneously unavailable

    +   - Authors suggest querying all $k$ nodes in parallel to reduce average lookup
    latency


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_187_0.png)'
  - '[PAGE 188]


    <!-- no content -->'
  - '[PAGE 189]


    # Chord'
  - '[PAGE 190]


    # System Model


    +   - **Load balance:**

    +     - Chord acts as a distributed hash function, spreading keys evenly over
    the nodes.

    +   - **Decentralization:**

    +     - Chord is fully distributed: no node is more important than any other.

    +   - **Scalability:**

    +     - The cost of a Chord lookup grows as the log of the number of nodes, so
    even very large systems are feasible.

    +   - **Availability:**

    +     - Chord automatically adjusts its internal tables to reflect newly joined
    nodes as well as node failures, ensuring that, the node responsible for a key
    can always be found.

    +   - **Flexible naming:**

    +     - Chord places no constraints on the structure of the keys it looks up.'
  - '[PAGE 191]


    # System Model


    +   - The application interacts with Chord in two main ways:

    +     - Chord provides a lookup(key) algorithm that yields the IP address of the
    node responsible for the key.

    +     - The Chord software on each node notifies the application of changes in
    the set of keys that the node is responsible for.'
  - '[PAGE 192]


    +   - The Chord protocol specifies how to find the locations of keys.

    +   - It uses consistent hashing, all nodes receive roughly the same number of
    keys.

    +   - When an $N^{th}$ node joins (or leaves) the network, only an $O(1/N)$ fraction
    of the keys are moved to a different location.

    +   - In an $N$-node network, each node maintains information only about $O(\log
    N)$ other nodes, and a lookup requires $O(\log N)$ messages.'
  - '[PAGE 193]


    # Consistent Hashing


    +   - The consistent hash function assigns each node and key an *m*-bit *identifier*
    using a base hash function such as [SHA-1](SHA-1).

    +   - Identifiers are ordered in an *identifier circle* modulo 2^m.

    +   - Key *k* is assigned to the first node whose identifier is equal to or follows
    *k* in the identifier space. This node is called the *successor node* of key *k*.

    +   - If identifiers are represented as a cycle of numbers from 0 to 2^m − 1,
    then *successor(k )* is the first node clockwise from *k*.'
  - '[PAGE 194]


    An identifier circle consisting of the three nodes 0, 1, and 3.

    In this example, key 1 is located at node 1, key 2 at node 3,

    and key 6 at node 0.'
  - '[PAGE 195]


    # Scalable key Location


    +   - Let *m* be the number of bits in the key/node identifiers.

    +   - Each node, *n*, maintains a routing table with (at most) *m* entries, called
    the *finger table*.

    +   - The *i*th entry in the table at node *n* contains the identity of the *first*
    node, *s*, that succeeds *n* by at least 2^i -1 on the identity circle.'
