    \ ≠ L₀*?\n\n- Then, Φ(L₀) might be Θ(n²) in the worst case.\n- Thus, C_MTF(S)\
    \ ≤ 4 · C_OPT(S) + Θ(n²), which is still 4-competitive, since n² is constant as\
    \ |S| → ∞.\n\n## Go Further a Step!\n\n- Not a list but a Tree\n- **Splay Tree**\n\
    \n## Problems with BSTs\n\n- Because the shape of a BST is determined by the order\
    \ that data is inserted, we run the risk of trees that are essentially lists\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_68_0.png)\n\n## BST Sequence of Operations\n\
    \n- Worst case for a single BST operation can be O(N)\n- Not so bad if this happens\
    \ only occasionally\n- BUT...its not uncommon for an entire sequence of “bad”\
    \ operations to occur. In this case, a sequence of M operations take O(M*N) time\
    \ and the time for the sequence of operations becomes noticeable.\n\n## Splay\
    \ Tree Sequence of Operations\n\n- Splay trees guarantee that a sequence of M\
    \ operations takes at most $O(\\text{M * lg N})$ time.\n- We say that the splay\
    \ tree has *amortized* running time of $O(\\text{lg N})$ cost per operation. Over\
    \ a long sequence of operations, some may take more than lg N time, some will\
    \ take less.\n\n## Splay Operation\n\n- To “splay node x”, traverse up the tree\
    \ from node x to root, rotating along the way until x is the root. For each rotation:\n\
    - If x is root, do nothing.\n- If x has no grandparent, rotate x about its parent.\n\
    - If x has a grandparent,\n  - if x and its parent are both left children or both\
    \ right children, rotate the parent about the grandparent, then rotate x about\
    \ its parent.\n  - if x and its parent are opposite type children (one left and\
    \ the other right), rotate x about its parent, then rotate x about its new parent\
    \ (former grandparent).\n\n## Node has no grandparent\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_73_0.png)\n\
    \n## Zig-Zig\n\n## Zig-Zag\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_75_0.png)\n\
    \n## Operations on Splay Trees (cont)\n\n- remove\n- splay element to be removed\n\
    \  - if the element to be deleted is not in the tree, the node last visited on\
    \ the search path is splayed\n- disconnect left and right subtrees from root\n\
    - do one or both of:\n  - splay max item in T_L (then T_L has no right child)\n\
    \  - splay min item in T_R (then T_R has no left child)\n- connect other subtree\
    \ to empty child of root\n"
