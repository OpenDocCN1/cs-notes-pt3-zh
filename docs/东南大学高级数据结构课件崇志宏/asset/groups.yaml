    ## Insertion in order into a Splay Tree


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_78_0.png)


    In a BST, building a tree from N sorted elements was O(N²). What is the performance
    of building a splay tree from N sorted elements?


    ## An extreme example of splaying


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_79_0.png)


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_79_1.png)


    After Splaying At Node "X"


    Original Tree


    ## Splay Tree Code


    - The splaying operation is performed “up the tree” from the node to the root.

    - How do we traverse “up” the tree?

    - How do we know if X and P are both left/right children or are different children?

    - How do we know if X has a grandparent?

    - What disadvantages are there to this technique?


    - a constant weight \(w(v)>0\) (for the analysis, this can be arbitrary)

    - \(weight\ sum\ s(x)=\sum_{y\in subtree(x)}w(y)\) (where subtree(x) is the subtree
    rooted at \(x\), including \(x\))

    - \(rank\ r(x)=\log s(x)\)


    We use \(r(x)\) as the potential of a node. The potential function after \(i\)
    operations is thus \(\Phi_i=\sum_{x\in tree(T)}r(x)\).


    ## Lemma 1 The amortized cost of a splay step on node x is ≤ 3(r′(x) − r(x)) +
    1, where r is rank before the splay step and r′ is rank after the splay step.
    Furthermore, the amortized cost of the rr, ll, lr, and rl splay steps is ≤ 3(r′(x)
    − r(x)).


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_82_0.png)


    We will consider only the rr splay step (refer to Figure 3.1). The actual cost
    of the splay step is 2 (for 2 rotations). The splay step only affects the potentials/ranks
    of nodes x, y, and z; we observe that r′(x) = r(z), r(y) ≥ r(x), and r′(y) ≤ r′(x).


    \[

    \begin{aligned}

    \text{amortized cost} &= 2+\phi(i+1)-\phi(i)\\

    &=2+\bigl(r''(x)+r''(y)+r''(z)\bigr)-\bigl(r(x)+r(y)-r(z)\bigr)\\

    &=2+\bigl(r''(x)-r(z)\bigr)+r''(y)+r''(z)-r(x)-r(y)\\

    &\le 2+0+r''(x)+r''(z)-r(x)-r(x)\\

    &=2+r''(x)+r''(z)-2r''(x)

    \end{aligned}

    \]


    The log function is concave, i.e., \(\frac{\log a+\log b}{2}\le \log\left(\frac{a+b}{2}\right)\).
    Thus we also have (\(s\) is weight sum before the splay step and \(s''\) is weight
    sum after the splay step):


    \[

    \frac{\log(s(x))+\log(s''(z))}{2}\le \log\left(\frac{s(x)+s''(z)}{2}\right)

    \]


    \[

    \frac{r(x)+r''(z)}{2}\le \log\left(\frac{s(x)+s''(z)}{2}\right)\qquad\text{(note
    that }s(x)+s''(z)\le s''(x)\text{)}

    \]


    \[

    \begin{aligned}

    &\le \log\left(\frac{s''(x)}{2}\right)\\

    &=r''(x)-1\\

    r''(z)&\le 2r''(x)-r(x)-2

    \end{aligned}

    \]


    ## **Corollary 1**  *The amortized cost of a splay operation on node x is O(log
    n).*


    ## **Proof:**


    The amortized cost of a splay operation on *x* is the sum of the amortized costs
    of the splay steps on *x* involved:


    ```

    $$\begin{aligned}

    \text{amortized cost} &= \sum_i \text{cost}(\text{splay step}_i) \\

    &\leq \sum_i \left(3(r^{i+1}(x)-r^i(x))+1\right) \\

    &= 3(r(\text{root})-r(x))+1

    \end{aligned}$$

    ```


    The +1 comes from the last *r* or *r* splay step (if necessary). If we set *w(v)
    = 1* for all nodes in the tree, then *r(root) = log n* and we have:


    ```

    $$\text{amortized cost} \leq 3\log n + 1 = O(\log n)$$

    ```


