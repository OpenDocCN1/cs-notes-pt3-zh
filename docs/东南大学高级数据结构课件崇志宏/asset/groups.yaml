    \n## FP-Tree 定义\n\nFP-tree 是一个频繁模式树。形式上，FP-tree 是如下定义的一种树结构：\n\n+ 1. 一个根节点标记为“null”，一组作为根的子项前缀子树，以及一个频繁项头部表。\n\
    \n+ 2. 项前缀子树中的每个节点有三个字段：\n+ - item-name：注册该节点代表的项目，\n+ - count，表示到达该节点的路径部分所代表的交易数量，\n\
    + - node-link 链接到 FP-tree 中携带相同 item-name 的下一个节点，如果没有则为 null。\n\n+ 3. 频繁项头部表中的每个条目有两个字段，\n\
    + - item-name，以及\n+ - head of node-link 指向 FP-tree 中携带该 item-name 的第一个节点。\n\n\
    ## FP-tree 结构的优点\n\n+ - FP-tree 最显著的优点\n+ - 只扫描数据库两次且仅两次。\n\n+ - 完整性：\n+ - FP-tree\
    \ 包含与挖掘频繁模式相关的所有信息（给定最小支持度阈值）。为什么？\n\n+ - 紧凑性：\n+ - 树的规模受频繁项出现次数的限制\n+ - 树的高度受事务中最大项目数的限制\n\
    \n## 问题？\n\n+ - 为什么是降序？\n+ - 示例 1：\n\n| TID | （未排序）频繁项 |\n| --- | --- |\n| 100\
    \ | {f, a, c, m, p} |\n| 500 | {a, f, c, p, m} |\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_108_0.png)\n\
    \n## 问题？\n\n+ - 示例 2：\n\n| TID | （升序）频繁项 |\n|---|---|\n| 100 | {p, m, a, c, f}\
    \ |\n| 200 | {m, b, a, c, f} |\n| 300 | {b, f} |\n| 400 | {p, b, c} |\n| 500 |\
    \ {p, m, a, c, f} |\n\n这棵树比 FP-tree 更大，因为在 FP-tree 中，更频繁的项目具有更高的位置，这使得分支更少\n\n\
    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_109_0.png)\n\n## 使用 FP-tree 挖掘频繁模式\n\n\
    + - 总体思路（分而治之）\n\n递归地使用 FP-tree 增长频繁模式：递归地寻找更短的模式，然后连接后缀：\n\n+ - 对于每个频繁项，构建其条件模式基，然后构建其条件\
    \ FP-tree；\n\n+ - 在每个新创建的条件 FP-tree 上重复该过程，直到生成的 FP-tree 为空，或仅包含一条路径（单路径将生成其子路径的所有组合，每一个都是频繁模式）\n\
    \n## 3 个主要步骤\n\n从列表 **L** 的末尾开始处理：\n\n+ 1. **步骤 1：** 为头部表中的每个项目构建 **条件模式基**\n\
    + 2. **步骤 2：** 从每个条件模式基构建 **条件 FP-tree**\n+ 3. **步骤 3：** **递归挖掘** 条件 FP-tree 并扩展迄今为止获得的频繁模式。如果条件\
    \ FP-tree 包含 _单条路径_，只需枚举所有模式\n\n"
