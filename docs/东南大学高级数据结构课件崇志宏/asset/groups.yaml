  - '[PAGE 223]


    # Load balancing


    +   - Load balancing process is initialized when a node is overloaded or under
    loaded due to insertion or deletion

    +   - 2 load balancing schemes

    +     - Do load balancing with adjacent nodes

    +     - An overloaded node finds a lightly loaded node to share work load (only
    if the overloaded / under loaded node is a leaf node)

    +       - A lightly loaded node is found by traveling through neighbor nodes within
    O(logN) steps.

    +       - Once found, the lightly loaded node transfers its content to one of
    its adjacent nodes, forced leaves its current position, and forced joins as a
    child of the overloaded node.

    +       - Network restructuring is triggered if necessary

    +     - Similar process is applied to under loaded nodes

    +   - Cost: O(log N) for each node attending load balancing process'
