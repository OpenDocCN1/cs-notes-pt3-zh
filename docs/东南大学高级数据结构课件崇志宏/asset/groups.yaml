  md: "\n## Beng Chin's Philosophy\n\nBeng Chin approaches research problems and system\
    \ design with the philosophy that all algorithms and structures should be simple,\
    \ elegant and yet efficient so that they can be easily grafted into existing systems\
    \ and they are implementable, maintainable and scalable in actual applications.\
    \ A good example would be his approach towards the design of new indexes; they\
    \ are mainly B+-tree based -- simple and elegant in design, and efficient, robust\
    \ and scalable in performance (eg. iDistance, Bx-tree, ST2B-tree).\nhttp://www.comp.nus.edu.sg/~ooibc/\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_241_0.png)\n\nquery:\n\n```\nselect\
    \ ?a, ?t where {\n?b hasAuthor ?a . ?b hasTitle ?t .\n?b inLanguage French . ?b\
    \ inCategory Crime . ?b wonPrize ?p .\n?b features ?m . ?m inList WorldHeritage\
    \ . ?m locatedIn Africa }\n```\n\njoin graph:\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_243_0.png)\n\
    \noperator tree\n(excerpt):\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_243_1.png)\n\
    \nFigure 1: Query, Join Graph and Operator Tree\n\n## Sideway Information Passing\n\
    \n- 1. Light-weight run-time method 轻量级运行时方法\n  - Run-time optimizing operator\
    \ tree based light-weight statistics information collection\n- 2. Pipelined executions\
    \ 流水线\n- 3. Scale very well with increasing complex trees\n\n## Column-Store Support\
    \ for RDF Data Management: not all swans are white[4]\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_247_0.png)\n\
    \nFigure 7: Scalability experiment\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_248_0.png)\n\
    \n| S | P | O | C |\n|---|---|---|---|\n| &N.YT | endorses | S.B. Obama | c₂ |\n\
    | &N.YT | rdf:type | Newspaper | c₄ |\n| Newspaper | rdf:type | rdfs:Class | c₃\
    \ |\n| Newspaper | rdfs:subClassOf | Mass Media | c₃ |\n| Mass Media | rdfs:subClassOf\
    \ | Media | c₅ |\n| Candidate | rdf:type | rdfs:Class | c₆ |\n| S.B. Obama | rdf:type\
    \ | Candidate | c₆ |\n| endorses | rdf:type | rdf:Property | c₁ |\n| endorses\
    \ | rdfs:domain | Newspaper | c₁ |\n| endorses | rdfs:range | Candidate | c₁ |\n\
    | Candidate | rdfs:subClassOf | Person | c₁ |\n| supports | rdf:type | rdf:Property\
    \ | c₁ |\n| supports | rdfs:domain | Mass Media | c₁ |\n| supports | rdfs:range\
    \ | Person | c₁ |\n| endorses | rdfs:subPropertyOf | supports | c₂ |\n| &N.YT\
    \ | endorses | S.B. Obama | c₂ |\n| Media | rdf:type | rdfs:Class | c₃ |\n\n#\
    \ Fig. 1. Granularity Levels of Power\n\n# Fig. 2. Relation S(s, p, o, c)\n\n\
    Fig. 3. Graph representation of Q(s, p, o, c)\n\n## Beyond Triples: Quadruple\
    \ Storage\n\nTo my knowledge, no reported research on the storage of quadruples\
    \ by now!\n\n- 1. Sextuple Indexing may not be efficient\n- 2. Complex queries\
    \ on quadruples\n- 3. It is related with uncertain data management, a hot research\
    \ point.\n  - (s, p, o, p’), where p’ means the possibility of (s, p, o).\n\n\
    Fig. 4. Nodes a₁ and a₆ are connected by a path that follows the sequence of navigational\
    \ axes next/next/edge/next/next⁻¹/node\n\n## G:\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_252_0.png)\n\
    \nβ = next::a/(next::[next::b/self::c])*/(edge::[next::d] | next::a)+\n\n## SPARQ2L:Towards\
    \ support for subgraph extraction queries in RDF Database[9]\n\n```\nSELECT ??p\n\
    WHERE {  ?x  ??p  ?x .\n         ?z  compound:name  \"Methionine\".\n        \
    \ PathFilter(containsAny(??p, ?z) ) }\n```\n\n```\nSELECT ??p\nWHERE  {  ?x  ??p\
    \  ?y .\n         ?x  foaf:name  \"salesPersonA\".\n         ?y  company:is_CIO\
    \ ?z.\n         ?z  company:name \"CompanyY\".\n         PathFilter( cost(??p)\
    \ < 4 ) }\n```\n\n## Complex Query\n\nTo my knowledge, no reported research on\
    \ complex query in database literature!\n\n- 1. Long join chain\n- 2. Complex\
    \ star join\n- 3. Support inference\n  - Materialization method may not be available?\n\
    \  - Sideway information passing?\n  - Others??\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_255_0.png)\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_255_1.png)\n"
