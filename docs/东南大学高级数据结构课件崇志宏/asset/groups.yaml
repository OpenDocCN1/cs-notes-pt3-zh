    \ 3\n\nFrequent Pattern\n\nconditional FP-tree of \"fcm\": 3\n\nFrequent Pattern\n\
    \nFrequent Pattern\n\nfcam\n\nadd \"f\"\n\nadd \"c\"\n\nconditional FP-tree of\
    \ \"cam\": (f:3)\n\nf:3\n\nadd \"f\"\n\n## Principles of FP-Growth\n\n- Pattern\
    \ growth property\n  - 设 α 是 DB 中的频繁项集，B 是 α 的条件模式基，β 是 B 中的一个项集。则 α ∪ β 是 DB\
    \ 中的频繁项集当且仅当 β 在 B 中频繁。\n- “fcabm” 是一个频繁模式吗？\n  - “fcab” 是 m 的条件模式基的一个分支\n  -\
    \ “b” 在包含 “fcab” 的事务中不是频繁的\n  - “bm” 不是一个频繁项集。\n\n## Conditional Pattern Bases\
    \ and\nConditional FP-Tree\n\n| Item | Conditional pattern base | Conditional\
    \ FP-tree |\n|---|---|---|\n| p | `{(fcam:2), (cb:1)}` | `{(c:3)}\\|p` |\n| m\
    \ | `{(fca:2), (fcab:1)}` | `{(f:3, c:3, a:3)}\\|m` |\n| b | `{(fca:1), (f:1),\
    \ (c:1)}` | `Empty` |\n| a | `{(fc:3)}` | `{(f:3, c:3)}\\|a` |\n| c | `{(f:3)}`\
    \ | `{(f:3)}\\|c` |\n| f | `Empty` | `Empty` |\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_118_0.png)\n\
    \n## Single FP-tree Path Generation\n\n- 假设 FP 树 T 有一条单一路径 P。T 的完整频繁模式集合可以通过枚举\
    \ P 的子路径的所有组合来生成\n\n{}\n|\nf:3\n|\nc:3\n|\na:3\nm-conditional FP-tree\n\nAll frequent\
    \ patterns concerning m: combination of {f, c, a} and m\n\n- m,\n- fm, cm, am,\n\
    - fcm, fam, cam,\n- fcam\n\n## Summary of FP-Growth Algorithm\n\n- 挖掘频繁模式可以看作是首先挖掘\
    \ 1-项集，然后通过在其条件模式基上递归挖掘，逐步增长每个 1-项集\n- 通过一组条件模式基，将频繁 k-项集挖掘问题转化为一系列 k 个频繁 1-项集挖掘问题\n\
    \n## Efficiency Analysis\n\n**Facts: usually**\n\n- 1. FP-tree 比 DB 的大小小得多\n-\
    \ 2. 模式基比原始 FP 树小\n- 3. 条件 FP 树比模式基小\n- ➔ 挖掘过程在一个通常要小得多的模式基和条件 FP 树集合上工作\n- ➔\
    \ 分而治之和显著的规模缩小\n\n"
