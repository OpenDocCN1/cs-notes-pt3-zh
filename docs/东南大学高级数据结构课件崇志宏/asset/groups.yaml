  - '[PAGE 210]


    # Node join


    +   - Example: new node $u$ joins the network


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_210_0.png)'
  - '[PAGE 211]


    # Node join


    +   - Cost of finding a node to join: O(log N)

    +   - When a node accepts a new node as its child

    +     - Split half of its content (its range of values) to its new child

    +     - Update adjacent links of itself and its new child

    +     - Notify both its neighbor nodes and its new child’s neighbor nodes to update
    their knowledge

    +   - Cost: 6 log N'
  - '[PAGE 212]


    # Node departure


    +   - When a node wishes to leave the network

    +     - If it is a leaf node and there is no neighbor node having children, it
    can leave the network

    +       - Transfer its content to the parent node, and update correspondence adjacent
    link

    +       - Notify its neighbor nodes and its parent’s neighbor nodes to update
    their knowledge

    +       - Cost: 4 log N

    +     - If it is a leaf node and there is a neighbor node having children, it
    needs to find a leaf node to replace it by sending a FINDREPLACEMENTNODE request
    to a child of that neighbor node

    +     - If it is an intermediate node, it needs to find a leaf node to replace
    it by sending a FINDREPLACEMENTNODE to one of its *adjacent* nodes'
  - '[PAGE 213]


    # Node departure


    +   - Example: existing node *b* leaves the network


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_213_0.png)'
  - '[PAGE 214]


    # Node departure


    +   - Cost of finding a leaf node to replace: O(log N)

    +   - When a node comes to replace a leave node

    +     - Notify its parent and its neighbor nodes as in case of leaf node leaving:
    4 log N

    +     - Notify its new parent node, its new neighbor nodes, and the parent’s neighbor
    nodes: 4 log N

    +     - Total cost: 8 log N'
  - '[PAGE 215]


    # Fault tolerance


    +   - Node failure

    +     - Nodes discovering failure of a node report to that node’s parent.

    +     - The failure’s parent node will take responsibility for finding a leaf
    node to replace if necessary.

    +     - Routing information of the failure node can be recovered by contacting
    its neighbor nodes via routing information of its parent.


    +   - Fault tolerance: failure node can be passed by two ways

    +     - Through routing tables (similar to CHORD) - *horizontal axis*

    +     - Through parent-child and adjacent links - *vertical axis*

    +     - Specifically, even if all nodes at the same level fail, the tree is not
    partitioned'
  - '[PAGE 216]


    # Network restructuring


    +   - Necessary in case of forced join or forced leave that is used in load balancing
    scheme

    +   - Network restructuring is triggered when the condition in theorem 1 is violated

    +   - Network restructuring is done by shifting nodes via adjacent links

    +     - No data movement is required

    +     - Each shifted node requires O(log N) effort to update routing tables'
  - '[PAGE 217]


    # Forced join


    +   - Example 1: network restructure is triggered as a forced join


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_217_0.png)'
  - '[PAGE 218]


    # Forced leave


    +   - Example 2: network restructuring is triggered as a forced leave


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_218_0.png)'
  - '[PAGE 219]


    # Index construction


    +   - Each node is assigned a range of values

    +   - The range of values directly managed by a node is

    +     - Greater than the range managed by its left adjacent node

    +     - Smaller than the range managed by its right adjacent node


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_219_0.png)'
  - '[PAGE 220]


    # Exact match query


    Example: node b want to search data belonged to node c, say 74


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_220_0.png)'
  - '[PAGE 221]


    # Range query


    +   - Process similar to exact match query

    +     - First, find an intersection with searched range

    +     - Second, follow adjacent links to retrieve all results

    +   - Cost

    +     - Exact match query: O(log N)

    +     - Range query: O(log N + X) where X is the total number of nodes containing
    searched results'
  - '[PAGE 222]


    # Data insertion and deletion


    +   - Insertion

    +     - Follow the exact match query process to find the node where data should
    be inserted except that

    +       - If it is the left most node and the inserted value is still less than
    its lower bound, or if it is the right most node and the inserted value is still
    greater than its upper bound, it expands its range of values to accept the new
    inserted value.

    +       - In this case, additional log N cost is needed for updating routing tables

    +   - Deletion

    +     - Follow the exact match query process to find the node containing data
    which should be deleted

    +   - Cost: similar to exact match query process

    +     - O(log N) for both insertion and deletion'
