    ## Conclusions


    - Amortized costs can provide a clean abstraction of data-structure performance.

    - Any of the analysis methods can be used when an amortized analysis is called
    for, but each method has some situations where it is arguably the simplest or
    most precise.

    - Different schemes may work for assigning amortized costs in the accounting method,
    or potentials in the potential method, sometimes yielding radically different
    bounds.


    ## Competitive Analysis


    - Self-organizing lists

    - Move-to-front heuristic

    - Competitive analysis of MTF


    ## Self-organizing lists


    List $L$ of $n$ elements


    - The operation Access($x$) costs rank$_L(x)$ = distance of $x$ from the head
    of $L$.

    - $L$ can be reordered by transposing adjacent elements at a cost of 1.


    # Example:


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_29_0.png)


    ## Self-organizing lists


    List *L* of *n* elements


    - The operation Access(*x*) costs rank_L(*x*) = distance of *x* from the head
    of *L*.

    - *L* can be reordered by transposing adjacent elements at a cost of 1.


    # Example:


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_30_0.png)


    Accessing the element with key 14 costs 4.


    ## On-line and off-line problems


    **Definition.** A sequence $S$ of operations is provided one at a time. For each
    operation, an *on-line* algorithm $A$ must execute the operation immediately without
    any knowledge of future operations (e.g., *Tetris*). An *off-line* algorithm may
    see the whole sequence $S$ in advance.


    **Goal:** Minimize the total cost $C_A(S)$.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_32_0.png)


    ## Worst-case analysis of self-organizing lists


    An adversary always accesses the tail (*n*th) element of *L*. Then, for any on-line
    algorithm *A*, we have


    $$C_A(S) = \Omega(|S| \cdot n)$$


    in the worst case.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_33_0.png)


    ## Average-case analysis of self-organizing lists


    Suppose that element $x$ is accessed with probability $p(x)$. Then, we have


    E[$C_A(S)$] = $\sum_{x \in L} p(x) \cdot \text{rank}_L(x)$


    which is minimized when $L$ is sorted in decreasing order with respect to $p$.


    **Heuristic:** Keep a count of the number of times each element is accessed, and
    maintain $L$ in order of decreasing count.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_35_0.png)


    ## The move-to-front heuristic


    **Practice:** Implementers discovered that the *move-to-front (MTF)* heuristic
    empirically yields good results.


    **IDEA:** After accessing *x*, move *x* to the head of *L* using transposes:


    cost = 2 · rank_L(x).


    The MTF heuristic responds well to locality in the access sequence *S*.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_37_0.png)


    ## MTF is O(1)-competitive


    Theorem. MTF is 4-competitive for self-organizing lists.


    ## MTF is O(1)-competitive


    **Theorem.** MTF is 4-competitive for self-organizing lists.


    *Proof.* Let $L_i$ be MTF’s list after the $i$th access, and let $L_i^*$ be OPT’s
    list after the $i$th access.


    Let $c_i$ = MTF’s cost for the $i$th operation

    $= 2 \cdot \operatorname{rank}_{L_{i-1}}(x)$ if it accesses $x$;

    $c_i^*$ = MTF’s cost for the $i$th operation

    $= \operatorname{rank}_{L_{i-1}^*}(x) + t_i$,


    where $t_i$ is the number of transposes that OPT performs.


    ## Potential function


    Define the potential function $\Phi: \{L_i\} \to \mathbb{R}$ by


    \[\Phi(L_i) = 2 \cdot |\{(x,y): x \prec_{L_i} y \text{ and } y \prec_{L_i^*} x\}|\]

    \[= 2 \cdot \#\ \textit{inversions}.\]


    ## Potential function


    Define the potential function Φ:{L_i} → ℝ by


    Φ(L_i) = 2 · |{(x, y) : x ≺_{L_i} y and y ≺_{L_i*} x}| = 2 · # inversions.


    # Example.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_40_0.png)


    ## Potential function


    Define the potential function Φ:{L_i} → ℝ by


    ```

    Φ(L_i) = 2 · |{(x, y) : x ≺_{L_i} y and y ≺_{L_i*} x}| = 2 · # inversions.

    ```


    # Example.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_42_0.png)


    ```

    Φ(L_i) = 2 · |{(E,C), ...}|

    ```

