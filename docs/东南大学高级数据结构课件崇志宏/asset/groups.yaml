    \n## FP-tree Example: step 2\n### Step 2: construct FP-tree\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_104_0.png)\n\
    \n## FP-tree\n## Construction Example\n## Final FP-tree\n\n| Header Table |\n\
    |---| \n| Item head |\n| f |\n| c |\n| a |\n| b |\n| m |\n| p |\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_105_0.png)\n\
    \n## FP-Tree Definition\n\nFP-tree is a frequent pattern tree. Formally, FP-tree\
    \ is a tree structure defined below:\n\n+ 1. One root labeled as “null”, a set\
    \ of item prefix sub-trees as the children of the root, and a frequent-item header\
    \ table.\n\n+ 2. Each node in the item prefix sub-trees has three fields:\n+ -\
    \ item-name: register which item this node represents,\n+ - count, the number\
    \ of transactions represented by the portion of the path reaching this node,\n\
    + - node-link that links to the next node in the FP-tree carrying the same item-name,\
    \ or null if there is none.\n\n+ 3. Each entry in the frequent-item header table\
    \ has two fields,\n+ - item-name, and\n+ - head of node-link that points to the\
    \ first node in the FP-tree carrying the item-name.\n\n## Advantages of the FP-tree\
    \ Structure\n\n+ - The most significant advantage of the FP-tree\n+ - Scan the\
    \ DB only twice and twice only.\n\n+ - Completeness:\n+ - the FP-tree contains\
    \ all the information related to mining frequent patterns (given the min-support\
    \ threshold). Why?\n\n+ - Compactness:\n+ - The size of the tree is bounded by\
    \ the occurrences of frequent items\n+ - The height of the tree is bounded by\
    \ the maximum number of items in a transaction\n\n## Questions?\n\n+ - Why descending\
    \ order?\n+ - Example 1:\n\n| TID | (unordered) frequent items |\n| --- | ---\
    \ |\n| 100 | {f, a, c, m, p} |\n| 500 | {a, f, c, p, m} |\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_108_0.png)\n\
    \n## Questions?\n\n+ - Example 2:\n\n| TID | (ascended) frequent items |\n|---|---|\n\
    | 100 | {p, m, a, c, f} |\n| 200 | {m, b, a, c, f} |\n| 300 | {b, f} |\n| 400\
    \ | {p, b, c} |\n| 500 | {p, m, a, c, f} |\n\nThis tree is larger than FP-tree,\
    \ because in FP-tree, more frequent items have a higher position, which makes\
    \ branches less\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_109_0.png)\n\n## Mining\
    \ Frequent Patterns Using FP-tree\n\n+ - General idea (divide-and-conquer)\n\n\
    Recursively grow frequent patterns using the FP-tree: looking for shorter ones\
    \ recursively and then concatenating the suffix:\n\n+ - For each frequent item,\
    \ construct its conditional pattern base, and then its conditional FP-tree;\n\n\
    + - Repeat the process on each newly created conditional FP-tree until the resulting\
    \ FP-tree is empty, or it contains only one path (single path will generate all\
    \ the combinations of its sub-paths, each of which is a frequent pattern)\n\n\
    ## 3 Major Steps\n\nStarting the processing from the end of list **L**:\n\n+ 1.\
    \ **Step 1:** Construct **conditional pattern base** for each item in the header\
    \ table\n+ 2. **Step 2:** Construct **conditional FP-tree** from each conditional\
    \ pattern base\n+ 3. **Step 3:** **Recursively mine** conditional FP-trees and\
    \ grow frequent patterns obtained so far. If the conditional FP-tree contains\
    \ a _single path_, simply enumerate all the patterns\n"
