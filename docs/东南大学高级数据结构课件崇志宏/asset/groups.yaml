    ## 动态表的会计分析


    对第 \(i\) 次插入收取摊还成本 \(\hat{c}_i = \$3\)。


    - \(\$1\) 支付即时插入。

    - \(\$2\) 存储起来以备表加倍时使用。


    当表加倍时，\(\$1\) 支付移动一个近期项目，\(\$1\) 支付移动一个旧项目。


    ### 示例：


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_14_0.png)


