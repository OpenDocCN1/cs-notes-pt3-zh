- raw:
  - '[PAGE 175]


    # CAN ZONES


    +   - Virtual d-dimensional Cartesian coordinate system

    +     - Example: 2-d [0,1]x[1,0]

    +   - Dynamically partitioned among all nodes

    +   - Pair (K,V) is stored by mapping key K to a point P in the space using a
    uniform hash function and storing (K,V) at the node in the zone containing P

    +   - Retrieve entry (K,V) by applying the same hash function to map K to P and
    retrieve entry from node in zone containing P

    +   - If P is not contained in the zone of the requesting node or its neighboring
    zones, route request to neighbor node in zone nearest P


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_175_0.png)'
  - '[PAGE 176]


    |  | 6 | 2 |

    |---|---|---|

    |  | 3 | 1 | 5 |

    |  |  | 4 |  |

    |  | (x,y) |  |  |


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_176_0.png)


    1’s coordinate neighbor set = {2,3,4,5}


    7’s coordinate neighbor set = {1}'
  - '[PAGE 177]


    # Routing:


    +   - Follow straight line path through the Cartesian space from source to destination
    coordinates

    +   - Each node maintains a table of the IP address and virtual coordinate zone
    of each local neighbor

    +   - Use greedy routing to neighbor closest to destination

    +   - For d-dimensional space partitioned into n equal zones, nodes maintain 2d
    neighbors (d/4)(n^{1/d})

    +     - Average routing path length:'
  - '[PAGE 178]


    # Join CAN


    +   - Joining node locates a bootstrap node using the CAN DNS entry

    +     - Bootstrap node provides IP addresses

    +       of random member nodes

    +   - Joining node sends JOIN request to random point P in the Cartesian space

    +   - Node in zone containing P splits the zone and allocates “half” to joining
    node

    +   - (K,V) pairs in the allocated “half” are transferred to the joining node

    +   - Joining node learns its neighbor set from previous zone occupant

    +     - Previous zone occupant updates its neighbor set'
  - '[PAGE 179]


    1''s coordinate neighbor set = {2,3,4,7}

    7''s coordinate neighbor set = {1,2,4,5}'
  - '[PAGE 180]


    # Departure, Recovery and Maintenance


    +   - Graceful departure: node hands over its zone and the (K,V) pairs to a neighbor

    +   - Network failure: unreachable node(s) trigger an immediate takeover algorithm
    that allocate failed node’s zone to a neighbor

    +     - Detect via lack of periodic refresh messages

    +     - Neighbor nodes start a takeover timer initialized in proportion to its
    zone volume

    +   - Send a TAKEOVER message containing zone volume to all of failed node’s neighbors

    +   - If received TAKEOVER volume is smaller kill timer, if not reply with a TAKEOVER
    message

    +   - Nodes agree on neighbor with smallest volume that is alive'
  - '[PAGE 181]


    # # CAN Improvements


    +   - CAN provides tradeoff between per-node state, *O(d)*, and path length, *O(dn<sup>1/d</sup>)*

    +     - Path length is measured in application level hops

    +     - Neighbor nodes may be geographically distant

    +   - Want to achieve a lookup latency that is comparable to underlying IP path
    latency

    +     - Several optimizations to reduce lookup latency also improve robustness
    in terms of routing and data availability

    +   - Approach: reduce the path length, reduce the per-hop latency, and add load
    balancing

    +   - Simulated CAN design on Transit-Stub (TS) topologies using the GT-ITM topology
    generator (Zegura, et. al.)'
  - '[PAGE 182]


    # Adding Dimensions


    +   - Increasing the dimensions of the coordinate space reduces the routing path
    length (and latency)

    +     - Small increase in the size of the routing table at each node

    +   - Increase in number of neighbors improves routing fault-tolerance

    +     - More potential next hop nodes

    +   - Simulated path lengths follow O(d n^{1/d})


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_182_0.png)'
  - '[PAGE 183]


    # Adding Realities


    +   - Nodes can maintain multiple independent coordinate spaces (realities)


    +   - For a CAN with *r* realities:

    +     - a single node is assigned *r* zones

    +     - and holds *r* independent neighbor sets

    +     - Contents of the hash table are replicated for each reality


    +   - Example: for three realities, a (*K*, *V*) mapping to *P*:(*x*,*y*,*z*)
    may be stored at three different nodes

    +     - (*K*, *V*) is only unavailable when all three copies are unavailable

    +     - Route using the neighbor on the reality closest to (*x*,*y*,*z*)


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_183_0.png)'
