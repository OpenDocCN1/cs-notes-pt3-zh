    \ Network）\n- 定义：一棵树是平衡的，当且仅当在树中的任意节点处\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_208_0.png)\n\
    \n节点 m：层级=3，编号=6，父节点=f，左子节点=null，右子节点=r，左邻接=f，右邻接=r\n\n左路由表：\n\n|  | 节点 | 左子节点\
