    # Beng Chin''s Philosophy


    Beng Chin approaches research problems and system design with the philosophy that
    all algorithms and structures should be simple, elegant and yet efficient so that
    they can be easily grafted into existing systems and they are implementable, maintainable
    and scalable in actual applications. A good example would be his approach towards
    the design of new indexes; they are mainly B+-tree based -- simple and elegant
    in design, and efficient, robust and scalable in performance (eg. iDistance, Bx-tree,
    ST2B-tree).

