    | 0 | n | null | null | n_lower | n_upper |\n| 1 | o | s | t | o_lower | o_upper\
    \ |\n\n二叉平衡树索引架构\n\n## 定理\n\n- *定理 1*：如果树中每个有子节点的节点的左、右路由表都是满的（*），则该树是平衡树。\n\n\
