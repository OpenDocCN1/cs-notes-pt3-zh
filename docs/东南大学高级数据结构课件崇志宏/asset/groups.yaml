    \   | Yancey | Xavier | Zeus |\n| Bertha | Xavier | Yancey | Zeus |\n| Clare |\
    \ Xavier | Yancey | Zeus |\n\n## 稳定匹配问题\n\nQ. 分配 X-A, Y-B, Z-C 稳定吗？\nA. 是的。\n\n\
    **男性偏好档案**\n\nfavorite ↓ least favorite ↓\n\n|       | 1st   | 2nd   | 3rd   |\n\
    |-------|-------|-------|-------|\n| Xavier | Amy  | Bertha | Clare |\n| Yancey\
    \ | Bertha | Amy  | Clare |\n| Zeus  | Amy   | Bertha | Clare |\n\n**女性偏好档案**\n\
    \nfavorite ↓ least favorite ↓\n\n|       | 1st    | 2nd    | 3rd  |\n|-------|--------|--------|------|\n\
    | Amy   | Yancey | Xavier | Zeus |\n| Bertha | Xavier | Yancey | Zeus |\n| Clare\
    \ | Xavier | Yancey | Zeus |\n\n## 提议-拒绝算法\n\n提议-拒绝算法。 [Gale-Shapley 1962] 一种直观的方法，保证找到稳定匹配。\n\
    \n```\nInitialize each person to be free.\nwhile (some man is free and hasn't\
    \ proposed to every woman) {\n    Choose such a man m\n    w = 1st woman on m's\
    \ list to whom m has not yet proposed\n    if (w is free)\n        assign m and\
    \ w to be engaged\n    else if (w prefers m to her fiancé m')\n        assign\
    \ m and w to be engaged, and m' to be free\n    else\n        w rejects m\n}\n\
    ```\n\n## 正确性证明：终止性\n\n观察 1. 男性按偏好递减的顺序向女性求婚。\n\n观察 2. 一旦女性被匹配，她永远不会变得未匹配；她只会“升级”。\n\
    \n断言。算法在 while 循环最多 n² 次迭代后终止。\n\nPf. 每次通过 while 循环，男性都会向一位新女性求婚。只有 n² 种可能的求婚。■\n\
    \n## 正确性证明：完美性\n\n断言。所有男性和女性都会被匹配。\n\nPf. （反证法）\n\n- 假设，为了反证，Zeus 在算法终止时未被匹配。\n\
    - 那么某位女性，比如 Amy，在算法终止时未被匹配。\n- 根据观察 2，Amy 从未被求婚。\n- 但是，Zeus 会向每个人求婚，因为他最终未匹配。\n\
    \n"
