    \n## 可扩展的键定位\n\n- 以高概率（或在标准困难性假设下），在一个包含 $N$ 个节点的网络中，查找后继所必须联系的节点数是 $O(\\log N)$。\n\
    \n## 节点加入\n\n- Chord 中的每个节点维护一个 *前驱指针*，并且可以沿标识符环逆时针方向工作。\n- 当节点 *n* 加入网络时：\n \
    \ - 初始化节点 *n* 的前驱和手指表。\n  - 更新现有节点的手指表和前驱，以反映 *n* 的加入。\n  - 通知上层软件，以便其可以转移与节点\
    \ *n* 现在负责的键相关联的状态（例如值）。\n\n## 故障与复制\n\n- 当节点 *n* 发生故障时，其手指表中包含 *n* 的节点必须找到 *n*\
