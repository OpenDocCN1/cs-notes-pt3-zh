  - "[PAGE 160]\n\n# Propose-And-Reject Algorithm\n\nPropose-and-reject algorithm.\
    \ [Gale-Shapley 1962] Intuitive method that guarantees to find a stable matching.\n\
    \n```\nInitialize each person to be free.\nwhile (some man is free and hasn't\
    \ proposed to every woman) {\n    Choose such a man m\n    w = 1st woman on m's\
    \ list to whom m has not yet proposed\n    if (w is free)\n        assign m and\
    \ w to be engaged\n    else if (w prefers m to her fiancé m')\n        assign\
    \ m and w to be engaged, and m' to be free\n    else\n        w rejects m\n}\n\
    ```"
  - '[PAGE 161]


    # Proof of Correctness: Termination


    Observation 1. Men propose to women in decreasing order of preference.


    Observation 2. Once a woman is matched, she never becomes unmatched; she only
    "trades up."


    Claim. Algorithm terminates after at most n² iterations of while loop.

    Pf. Each time through the while loop a man proposes to a new woman.

    There are only n² possible proposals. ■'
  - '[PAGE 162]


    # Proof of Correctness: Perfection


    Claim. All men and women get matched.


    Pf. (by contradiction)


    +   - Suppose, for sake of contradiction, that Zeus is not matched upon termination
    of algorithm.

    +   - Then some woman, say Amy, is not matched upon termination.

    +   - By Observation 2, Amy was never proposed to.

    +   - But, Zeus proposes to everyone, since he ends up unmatched.'
