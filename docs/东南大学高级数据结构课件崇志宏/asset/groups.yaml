  - '[PAGE 71]


    # Splay Tree Sequence of Operations


    +   - Splay trees guarantee that a sequence of M operations takes at most $O(\text{M
    * lg N})$ time.

    +   - We say that the splay tree has *amortized* running time of $O(\text{lg N})$
    cost per operation. Over a long sequence of operations, some may take more than
    lg N time, some will take less.'
  - '[PAGE 72]


    # # Splay Operation


    +   - To “splay node x”, traverse up the tree from node x to root, rotating along
    the way until x is the root. For each rotation:

    +     - If x is root, do nothing.

    +     - If x has no grandparent, rotate x about its parent.

    +     - If x has a grandparent,

    +       - if x and its parent are both left children or both right children, rotate
    the parent about the grandparent, then rotate x about its parent.

    +       - if x and its parent are opposite type children (one left and the other
    right), rotate x about its parent, then rotate x about its new parent (former
    grandparent).'
