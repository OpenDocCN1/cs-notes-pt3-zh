  mdcn: "\n\n## 负载均衡\n\n- 负载均衡过程在节点因插入或删除而过载或欠载时初始化\n- 2 种负载均衡方案\n  - 与相邻节点进行负载均衡\n\
    \  - 过载节点寻找一个负载较轻的节点来分担工作负载（仅当过载/欠载节点为叶子节点时）\n    - 通过在 O(log N) 步内遍历邻居节点来找到负载较轻的节点。\n\
    \    - 一旦找到，负载较轻的节点将其内容转移到其相邻节点之一，被强制离开其当前位置，并被强制作为过载节点的子节点加入。\n    - 如有必要则触发网络重构\n\
    \  - 类似过程应用于欠载节点\n- 成本：参与负载均衡过程的每个节点的成本为 O(log N)\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_224_0.png)\n\
    \na. 负载均衡前\n\nb. 负载均衡后\n\n## 加入和离开操作\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_226_0.png)\n\
    \n查找加入节点和替换节点的成本\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_226_1.png)\n\n更新路由表的成本\n\
    \n## 插入和删除操作\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_227_0.png)\n\n插入和删除操作的成本\n\
    \n## 访问负载\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_229_0.png)\n\n不同层级节点的访问负载\n\
    \n## 负载均衡的影响\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_230_0.png)\n\n负载均衡操作的平均消息数\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_230_1.png)\n\n负载均衡过程的大小\n\n## 网络动态的影响\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_231_0.png)\n\n网络动态\n\n## 结论\n\n- **BATON**\n\
    \  - 第一个基于平衡树结构的 P2P 覆盖网络\n  - 优势\n    - 与其他系统相比，更新路由表的成本更低\n    - 高效支持精确匹配查询和范围查询\n\
