  mdcn: "\n\n## 节点加入\n\n- 示例：新节点 $u$ 加入网络\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_210_0.png)\n\
    \n- 找到可加入节点的成本：O(log N)\n- 当一个节点接受新节点作为其子节点时\n  - 将其内容（即值范围）的一半分割给新的子节点\n  - 更新自身及其新子节点的相邻链接\n\
    \  - 通知其邻居节点及其新子节点的邻居节点更新它们的信息\n- 成本：6 log N\n\n## 节点离开\n\n- 当一个节点希望离开网络时\n  -\
    \ 如果它是叶节点且没有邻居节点拥有子节点，则它可以离开网络\n    - 将其内容转移给父节点，并更新对应的相邻链接\n    - 通知其邻居节点及其父节点的邻居节点更新它们的信息\n\
    \    - 成本：4 log N\n  - 如果它是叶节点且存在一个拥有子节点的邻居节点，则它需要通过向该邻居节点的某个子节点发送 FINDREPLACEMENTNODE\
    \ 请求来找到一个替代它的叶节点\n  - 如果它是中间节点，则它需要通过向其某个*相邻*节点发送 FINDREPLACEMENTNODE 请求来找到一个替代它的叶节点\n\
    \n- 示例：现有节点 *b* 离开网络\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_213_0.png)\n\n\
    - 找到替代叶节点的成本：O(log N)\n- 当某个节点来替代离开的节点时\n  - 按照叶节点离开的情况通知其父节点和邻居节点：4 log N\n \
    \ - 通知其新的父节点、新的邻居节点以及新父节点的邻居节点：4 log N\n  - 总成本：8 log N\n\n## 容错\n\n- 节点故障\n \
    \ - 发现某个节点故障的节点会向该节点的父节点报告。\n  - 故障节点的父节点将负责在必要时寻找一个替代的叶节点。\n  - 故障节点的路由信息可以通过其父节点的路由信息联系其邻居节点来恢复。\n\
    \n- 容错性：故障节点可以通过两种方式被绕过\n  - 通过路由表（类似于 CHORD）——*水平轴*\n  - 通过父子链接和相邻链接——*垂直轴*\n\
    \  - 特别地，即使同一层级的所有节点都发生故障，树也不会被分割\n\n## 网络重构\n\n- 在负载均衡方案中发生强制加入或强制离开时是必要的\n-\
    \ 当定理 1 中的条件被违反时，触发网络重构\n- 网络重构通过相邻链接移动节点来完成\n  - 不需要移动数据\n  - 每个被移动的节点需要 O(log\
    \ N) 的开销来更新路由表\n\n## 强制加入\n\n- 示例 1：网络重构由强制加入触发\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_217_0.png)\n\
    \n## 强制离开\n\n- 示例 2：网络重构由强制离开触发\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_218_0.png)\n\
    \n## 索引构建\n\n- 每个节点被分配一个值范围\n- 一个节点直接管理的值范围满足：\n  - 大于其左侧相邻节点管理的范围\n  - 小于其右侧相邻节点管理的范围\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_219_0.png)\n\n## 精确匹配查询\n\n示例：节点 b\
    \ 想要搜索属于节点 c 的数据，比如 74\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_220_0.png)\n\
    \n## 范围查询\n\n- 过程与精确匹配查询类似\n  - 首先，找到与搜索范围的交集\n  - 其次，沿着相邻链接检索所有结果\n- 成本\n  -\
    \ 精确匹配查询：O(log N)\n  - 范围查询：O(log N + X)，其中 X 是包含搜索结果的节点总数\n\n## 数据插入与删除\n\n-\
    \ 插入\n  - 遵循精确匹配查询过程来找到应插入数据的节点，但存在以下特殊情况：\n    - 如果该节点是最左侧节点且插入值仍小于其下界，或者该节点是最右侧节点且插入值仍大于其上界，则它扩展其值范围以接受新插入的值。\n\
    \    - 在这种情况下，需要额外的 log N 成本来更新路由表\n- 删除\n  - 遵循精确匹配查询过程来找到包含应删除数据的节点\n- 成本：与精确匹配查询过程类似\n\
    \  - 插入和删除均为 O(log N)\n\n"
