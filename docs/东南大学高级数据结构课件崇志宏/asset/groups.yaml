  md: "\n## Stream Model of Computation\n\nIncreasing time\n\nData Stream\n\nMain\
    \ Memory (Synopsis Data Structures)\n\nMemory: poly(1/ε, log N)\n\nQuery/Update\
    \ Time: poly(1/ε, log N)\n\nN: # items so far, or window size\n\nε: error parameter\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_122_0.png)\n\n## Generalized Stream\
    \ Model\n\nData stream: 2, 0, 1, 3, 1, 2, 4, ...\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_124_0.png)\n\
    \n- Input Element (i,a)\n  - a copies of domain-value i\n  - increment to ith\
    \ dimension of m by a\n  - a need not be an integer\n- Negative value – captures\
    \ deletions\n\n### Example\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_0.png)\n\
    \nOn seeing element $(i,a)=(2,2)$\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_1.png)\n\
    \nOn seeing element $(i,a)=(1,-1)$\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_2.png)\n\
    \n## Problem 1 – Top-K List\n\n[Charikar-Chen-Farach-Colton]\n\n### The Google\
    \ Problem\n\nReturn list of k most frequent items in stream\n\n### Motivation\n\
    \nsearch engine queries, network traffic, ...\n\n### Remember\n\nSaw lower bound\
    \ recently!\n\n### Solution\n\nData structure Count-Sketch → maintaining count-estimates\
    \ of high-frequency elements\n\n## Main Idea\n\n- Consider\n  - single counter\
    \ X\n  - hash function h(i): {1, 2, ..., N} → {-1, +1}\n- Input element i → update\
    \ counter X += Z_i = h(i)\n- For each r, use XZ_r as estimator of m_r\n\n### Theorem:\
    \ E[XZ_r] = m_r\n\n**Proof**\n\n- X = Σ_i m_i Z_i\n- E[XZ_r] = E[Σ_i m_i Z_i Z_r]\
    \ = Σ_i m_i E[Z_i Z_r] = m_r E[Z_r²] = m_r\n- Cross-terms cancel\n\n## Problem\
    \ with “Array of Counters”\n\n- **Variance** — dominated by highest frequency\n\
    - **Estimates for less-frequent elements like** $k$\n  - corrupted by higher frequencies\n\
    \  - variance $\\gg m_k$\n- **Avoiding Collisions?**\n  - spread out high frequency\
    \ elements\n  - replace each counter with hashtable of $b$ counters\n\n## Count\
    \ Sketch\n\n- Hash Functions\n  - 4-wise independent hashes h₁,...,hₜ and s₁,...,sₜ\n\
    \  - hashes independent of each other\n- Data structure: hashtables of counters\
    \ X(r,c)\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_131_0.png)\n\n## Overall\
    \ Algorithm\n\n- $s_r(i)$: one of $b$ counters in $r$th hashtable\n- **Input**\
    \ $i$ → for each $r$, update $X(r,s_r(i)) += h_r(i)$\n- **Estimator** $(m_i) =\
    \ \\operatorname{median}_r\\{X(r,s_r(i)) \\bullet h_r(i)\\}$\n- Maintain heap\
    \ of $k$ top elements seen so far\n- **Observe**\n  - Not completely eliminated\
    \ collision with high frequency items\n  - Few of estimates $X(r,s_r(i)) \\bullet\
    \ h_r(i)$ could have high variance\n  - Median not sensitive to these poor estimates\n\
    \n## Avoiding Large Items\n\n- **b > O(k)** → with probability **Ω(1)**, no collision\
    \ with top-k elements\n- **t** hashtables represent independent trials\n- Need\
    \ **log m/δ** trials to estimate with probability **1−δ**\n- Also need – small\
    \ variance for colliding small elements\n- **Claim:**\n  P[variance due to small\
    \ items in each estimate < (∑ᵢ>k mᵢ²)/b] = **Ω(1)**\n- Final bound  **b = O(k\
    \ + ∑ᵢ>k mᵢ² / (εmₖ)²)**\n\n## Final Results\n\n- Zipfian Distribution: m_i ∝\
    \ 1/i^α [Power Law]\n- FindApproxTop\n  - [k + (Σ_{i>k} m_i²) / (ε m_k)²] log\
    \ m/δ\n  - Roughly: sampling bound with frequencies squared\n  - Zipfian – gives\
    \ improved results\n- FindCandidateTop\n  - Zipf parameter 0.5\n  - O(k log N\
    \ log m)\n  - Compare: sampling bound O((kN)^0.5 log k)\n\n## Algorithm 1: Lossy\
    \ Counting\n\nStep 1: Divide the stream into 'windows'\n\nWindow 1\n\nWindow 2\n\
    \nWindow 3\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_136_0.png)\n\nWindow-size\
    \ w is function of support s – specify later...\n\n## Lossy Counting in Action\
    \ ...\n\nEmpty\n\nFirst Window\n\nFrequency Counts\n\nAt window boundary, decrement\
    \ all counters by 1\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_137_0.png)\n"
  mdcn: "\n\n## 计算的流模型\n\n时间递增\n\n数据流\n\n主内存（概要数据结构）\n\n内存：poly(1/ε, log N)\n\n查询/更新时间：poly(1/ε,\
    \ log N)\n\nN：迄今为止的项目数，或窗口大小\n\nε：误差参数\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_122_0.png)\n\
    \n## 广义流模型\n\n数据流：2, 0, 1, 3, 1, 2, 4, ...\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_124_0.png)\n\
    \n- 输入元素 (i,a)\n  - 域值 i 的 a 个拷贝\n  - 将 m 的第 i 维增加 a\n  - a 不必是整数\n- 负值 – 捕获删除\n\
    \n### 示例\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_0.png)\n\n看到元素 $(i,a)=(2,2)$\
    \ 时\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_1.png)\n\n看到元素 $(i,a)=(1,-1)$\
    \ 时\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_125_2.png)\n\n## 问题 1 – Top-K\
    \ 列表\n\n[Charikar-Chen-Farach-Colton]\n\n### 谷歌问题\n\n返回流中出现频率最高的 k 个项目的列表\n\n\
    ### 动机\n\n搜索引擎查询、网络流量，...\n\n### 记住\n\n最近看到了下界！\n\n### 解决方案\n\n数据结构 Count-Sketch\
    \ → 维护高频元素的计数估计\n\n## 主要思想\n\n- 考虑\n  - 单个计数器 X\n  - 哈希函数 h(i): {1, 2, ..., N}\
    \ → {-1, +1}\n- 输入元素 i → 更新计数器 X += Z_i = h(i)\n- 对每个 r，使用 XZ_r 作为 m_r 的估计值\n\n\
    ### 定理：E[XZ_r] = m_r\n\n**证明**\n\n- X = Σ_i m_i Z_i\n- E[XZ_r] = E[Σ_i m_i Z_i\
    \ Z_r] = Σ_i m_i E[Z_i Z_r] = m_r E[Z_r²] = m_r\n- 交叉项抵消\n\n## “计数器数组”的问题\n\n\
    - **方差** — 由最高频率主导\n- **对较不频繁元素如** $k$ 的估计\n  - 被更高频率污染\n  - 方差 $\\gg m_k$\n-\
    \ **避免冲突？**\n  - 将高频元素分散开\n  - 用 $b$ 个计数器的哈希表替换每个计数器\n\n## Count Sketch\n\n- 哈希函数\n\
    \  - 4-独立哈希 h₁,...,hₜ 和 s₁,...,sₜ\n  - 哈希彼此独立\n- 数据结构：计数器 X(r,c) 的哈希表\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_131_0.png)\n\
    \n## 总体算法\n\n- $s_r(i)$：第 r 个哈希表中的 $b$ 个计数器之一\n- **输入** $i$ → 对每个 r，更新 $X(r,s_r(i))\
    \ += h_r(i)$\n- **估计值** $(m_i) = \\operatorname{median}_r\\{X(r,s_r(i)) \\bullet\
    \ h_r(i)\\}$\n- 维护迄今为止看到的 k 个顶部元素的堆\n- **观察**\n  - 并未完全消除与高频项目的冲突\n  - 少数估计值 $X(r,s_r(i))\
    \ \\bullet h_r(i)$ 可能具有高方差\n  - 中位数对这些较差的估计不敏感\n\n## 避免大项目\n\n- **b > O(k)** →\
    \ 以概率 **Ω(1)**，与 top-k 元素无冲突\n- **t** 个哈希表代表独立试验\n- 需要 **log m/δ** 次试验以概率 **1−δ**\
    \ 估计\n- 还需要 – 对冲突的小元素有较小方差\n- **断言：**\n  P[每个估计中由小项引起的方差 < (∑ᵢ>k mᵢ²)/b] = **Ω(1)**\n\
    - 最终界限  **b = O(k + ∑ᵢ>k mᵢ² / (εmₖ)²)**\n\n## 最终结果\n\n- Zipf 分布：m_i ∝ 1/i^α [幂律]\n\
    - FindApproxTop\n  - [k + (Σ_{i>k} m_i²) / (ε m_k)²] log m/δ\n  - 大致：频率平方的采样界限\n\
    \  - Zipfian – 给出改进结果\n- FindCandidateTop\n  - Zipf 参数 0.5\n  - O(k log N log\
    \ m)\n  - 比较：采样界限 O((kN)^0.5 log k)\n\n## 算法 1：Lossy Counting\n\n步骤 1：将流划分为“窗口”\n\
    \n窗口 1\n\n窗口 2\n\n窗口 3\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_136_0.png)\n\
    \n窗口大小 w 是支持度 s 的函数 – 稍后指定...\n\n## Lossy Counting 的运行 ...\n\n空\n\n第一个窗口\n\n频率计数\n\
    \n在窗口边界，递减所有计数器 1\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_137_0.png)\n\n"
