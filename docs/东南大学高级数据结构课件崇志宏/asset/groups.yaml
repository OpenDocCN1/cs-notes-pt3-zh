  mdcn: "\n\n## 维度 vs. 现实\n\n- 增加维度数量和/或现实数量会减少路径长度并增加每个节点的状态\n- 更多的维度对路径长度的影响更大\n\
    - 更多的现实提供更强的容错能力和更高的数据可用性\n- 作者没有量化不同的存储需求\n  - 更多的现实需要复制 $(K,V)$ 对\n\n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_184_0.png)\n\
    \n## RTT 比率\n\n- 将 RTT 纳入路由度量\n  - 每个节点测量到每个邻居的 RTT\n  - 将消息转发给进度与 RTT 比率最大的邻居\n\
    \n| 维度数量 | 非-*RTT* 加权路由 (ms) | *RTT* 加权路由 (ms) |\n|---:|---:|---:|\n| 2 | 116.8\
    \ | 88.3 |\n| 3 | 116.7 | 76.1 |\n| 4 | 115.8 | 71.2 |\n| 5 | 115.4 | 70.9 |\n\
    \n## 区域过载\n\n- 过载坐标区域\n  - 允许多个节点共享同一区域，以阈值 MAXPEERS 为界\n  - 节点维护对等状态，但不维护额外的邻居状态\n\
    \  - 定期轮询邻居获取其对等节点列表，测量到每个对等节点的 RTT，保留 RTT 最低的节点作为邻居\n  - $(K,V)$ 对可以分片到对等节点之间或进行复制\n\
    \n## 多个哈希函数\n\n- 通过使用 $k$ 个哈希函数将单个键映射到坐标空间中的 $k$ 个点来提高数据可用性\n- 复制 $(K,V)$ 并存储在\
    \ $k$ 个不同的节点上\n- $(K,V)$ 仅在全部 $k$ 个副本同时不可用时才不可用\n- 作者建议并行查询全部 $k$ 个节点以降低平均查找延迟\n\
    \n![](img/e8cfdb0a049dc5ab9d802234ebc2190e_187_0.png)\n\n## Chord\n\n## 系统模型\n\
    \n- **负载均衡：**\n  - Chord 作为分布式哈希函数，将键均匀地分布在节点上。\n- **去中心化：**\n  - Chord 完全分布式：没有任何节点比其他节点更重要。\n\
    - **可扩展性：**\n  - Chord 查找的成本随节点数量的对数增长，因此即使非常大的系统也是可行的。\n- **可用性：**\n  - Chord\
    \ 会自动调整其内部表以反映新加入的节点以及节点故障，确保负责某个键的节点始终可以找到。\n- **灵活命名：**\n  - Chord 对其查找的键的结构不做任何限制。\n\
    \n## 系统模型\n\n- 应用程序主要通过两种方式与 Chord 交互：\n  - Chord 提供一个 lookup(key) 算法，返回负责该键的节点的\
    \ IP 地址。\n  - 每个节点上的 Chord 软件会通知应用程序其负责的键集的变化。\n\n- Chord 协议指定了如何找到键的位置。\n- 它使用一致性哈希，所有节点接收大致相同数量的键。\n\
    - 当第 $N$ 个节点加入（或离开）网络时，只有 $O(1/N)$ 的键会被移动到不同位置。\n- 在一个 $N$ 节点网络中，每个节点仅维护关于 $O(\\\
    log N)$ 个其他节点的信息，而一次查找需要 $O(\\log N)$ 条消息。\n\n## 一致性哈希\n\n- 一致性哈希函数使用诸如 [SHA-1](SHA-1)\
    \ 之类的基础哈希函数为每个节点和键分配 *m*-位 *标识符*。\n- 标识符按模 2^m 在 *标识符环* 中排序。\n- 键 *k* 被分配给标识符等于或跟随\
    \ *k* 在标识符空间中的第一个节点。该节点称为键 *k* 的 *后继节点*。\n- 如果标识符表示为从 0 到 2^m − 1 的数字环，则 *successor(k\
    \ )* 是从 *k* 开始顺时针方向的第一个节点。\n\n由三个节点 0、1 和 3 组成的标识符环。\n在此示例中，键 1 位于节点 1，键 2 位于节点\
    \ 3，\n键 6 位于节点 0。\n\n## 可扩展的键定位\n\n- 设 *m* 为键/节点标识符中的位数。\n- 每个节点 *n* 维护一个路由表，包含（最多）*m*\
    \ 个条目，称为 *手指表*。\n- 节点 *n* 的表中的第 *i* 个条目包含第一个节点 *s* 的身份，该节点在标识符环上至少比 *n* 大 2^i\
    \ -1。\n\n"
