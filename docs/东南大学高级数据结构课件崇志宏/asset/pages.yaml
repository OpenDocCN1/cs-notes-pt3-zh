  md: '| No. | Query Pattern | Cost | Query Semantics |

    |---|---|---|---|

    | Q1 | (?s, ?p, ?o) | O(N) | find all possible triples |

    | Q2 | (?s, ?p, o_i) | log N | given object o_i of any predicate, find the subjects
    and predicates of matching triples |

    | Q3 | (?s, p_i, ?o) | log N | given predicate p_i, find the subjects and objects
    of the triples having this predicate |

    | Q4 | (?s, p_i, o_i) | log N | given object o_i of predicate p_i, find the subjects
    of matching triples |

    | Q5 | (s_i, ?p, ?o) | log N | given subject s_i, find all predicates and objects
    of the resource identified by s_i |

    | Q6 | (s_i, ?p, o_i) | log N | given subject s_i, find its predicate that has
    object o_i |

    | Q7 | (s_i, p_i, ?o) | log N | given subject s_i, find its object of predicate
    p_i |

    | Q8 | (s_i, p_i, o_i) | log N | return this triple if it exists otherwise return
    nothing |


    Table 1

    The eight possible atomic triple queries for exact matches. The cost is measured
    in the number of routing hops needed to resolve each query.'
