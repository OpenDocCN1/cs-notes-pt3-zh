- pgno: 82
  md: '# Lemma 1 The amortized cost of a splay step on node x is ≤ 3(r′(x) − r(x))
    + 1, where r is rank before the splay step and r′ is rank after the splay step.
    Furthermore, the amortized cost of the rr, ll, lr, and rl splay steps is ≤ 3(r′(x)
    − r(x)).


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_82_0.png)


    We will consider only the rr splay step (refer to Figure 3.1). The actual cost
    of the splay step is 2 (for 2 rotations). The splay step only affects the potentials/ranks
    of nodes x, y, and z; we observe that r′(x) = r(z), r(y) ≥ r(x), and r′(y) ≤ r′(x).'
  merge: -1
