- pgno: 130
  md: '# Problem with “Array of Counters”


    +   - **Variance** — dominated by highest frequency

    +   - **Estimates for less-frequent elements like** $k$

    +     - corrupted by higher frequencies

    +     - variance $\gg m_k$

    +   - **Avoiding Collisions?**

    +     - spread out high frequency elements

    +     - replace each counter with hashtable of $b$ counters'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Count Sketch


    +   - Hash Functions

    +     - 4-wise independent hashes h₁,...,hₜ and s₁,...,sₜ

    +     - hashes independent of each other

    +   - Data structure: hashtables of counters X(r,c)


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Overall Algorithm


    +   - $s_r(i)$: one of $b$ counters in $r$th hashtable

    +   - **Input** $i$ → for each $r$, update $X(r,s_r(i)) += h_r(i)$

    +   - **Estimator** $(m_i) = \operatorname{median}_r\{X(r,s_r(i)) \bullet h_r(i)\}$

    +   - Maintain heap of $k$ top elements seen so far


    +   - **Observe**

    +     - Not completely eliminated collision with high frequency items

    +     - Few of estimates $X(r,s_r(i)) \bullet h_r(i)$ could have high variance

    +     - Median not sensitive to these poor estimates'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Avoiding Large Items


    +   - **b > O(k)** → with probability **Ω(1)**, no collision with top-k elements


    +   - **t** hashtables represent independent trials

    +   - Need **log m/δ** trials to estimate with probability **1−δ**


    +   - Also need – small variance for colliding small elements

    +   - **Claim:**

    +     P[variance due to small items in each estimate < (∑ᵢ>k mᵢ²)/b] = **Ω(1)**


    +   - Final bound  **b = O(k + ∑ᵢ>k mᵢ² / (εmₖ)²)**'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Final Results


    +   - Zipflan Distribution: m_i ∝ 1/i^α [Power Law]


    +   - FindApproxTop

    +     - [k + (Σ_{i>k} m_i²) / (ε m_k)²] log m/δ

    +     - Roughly: sampling bound with frequencies squared

    +     - Zipfian – gives improved results


    +   - FindCandidateTop

    +     - Zipf parameter 0.5

    +     - O(k log N log m)

    +     - Compare: sampling bound O((kN)^0.5 log k)'
  merge: -1
