- pgno: 221
  md: '# Range query


    +   - Process similar to exact match query

    +     - First, find an intersection with searched range

    +     - Second, follow adjacent links to retrieve all results

    +   - Cost

    +     - Exact match query: O(log N)

    +     - Range query: O(log N + X) where X is the total number of nodes containing
    searched results'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Data insertion and deletion


    +   - Insertion

    +     - Follow the exact match query process to find the node where data should
    be inserted except that

    +       - If it is the left most node and the inserted value is still less than
    its lower bound, or if it is the right most node and the inserted value is still
    greater than its upper bound, it expands its range of values to accept the new
    inserted value.

    +       - In this case, additional log N cost is needed for updating routing tables

    +   - Deletion

    +     - Follow the exact match query process to find the node containing data
    which should be deleted

    +   - Cost: similar to exact match query process

    +     - O(log N) for both insertion and deletion'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Load balancing


    +   - Load balancing process is initialized when a node is overloaded or under
    loaded due to insertion or deletion

    +   - 2 load balancing schemes

    +     - Do load balancing with adjacent nodes

    +     - An overloaded node finds a lightly loaded node to share work load (only
    if the overloaded / under loaded node is a leaf node)

    +       - A lightly loaded node is found by traveling through neighbor nodes within
    O(logN) steps.

    +       - Once found, the lightly loaded node transfers its content to one of
    its adjacent nodes, forced leaves its current position, and forced joins as a
    child of the overloaded node.

    +       - Network restructuring is triggered if necessary

    +     - Similar process is applied to under loaded nodes

    +   - Cost: O(log N) for each node attending load balancing process'
  merge: -1
  img_proc: true
