- pgno: 111
  md: '# Mining Frequent Patterns Using FP-tree


    +   - General idea (divide-and-conquer)


    Recursively grow frequent patterns using the FP-tree: looking for shorter ones
    recursively and then concatenating the suffix:


    +   - For each frequent item, construct its conditional pattern base, and then
    its conditional FP-tree;


    +   - Repeat the process on each newly created conditional FP-tree until the resulting
    FP-tree is empty, or it contains only one path (single path will generate all
    the combinations of its sub-paths, each of which is a frequent pattern)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 3 Major Steps


    Starting the processing from the end of list **L**:


    +   1. **Step 1:** Construct **conditional pattern base** for each item in the
    header table

    +   2. **Step 2:** Construct **conditional FP-tree** from each conditional pattern
    base

    +   3. **Step 3:** **Recursively mine** conditional FP-trees and grow frequent
    patterns obtained so far. If the conditional FP-tree contains a _single path_,
    simply enumerate all the patterns'
  merge: -1
  img_proc: true
