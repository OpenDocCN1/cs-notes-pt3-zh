- pgno: 114
  md: '# Properties of FP-Tree


    +   - Node-link property

    +     - For any frequent item $a_i$, all the possible frequent patterns that contain
    $a_i$ can be obtained by following $a_i$''s node-links, starting from $a_i$''s
    head in the FP-tree header.

    +   - Prefix path property

    +     - To calculate the frequent patterns for a node $a_i$ in a path $P$, only
    the prefix sub-path of $a_i$ in $P$ need to be accumulated, and its frequency
    count should carry the same count as node $a_i$.'
  merge: -1
  img_proc: true
