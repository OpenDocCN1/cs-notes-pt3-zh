- pgno: 300
  md: '# Lemma A


    For all integers $k \ge 0$, the following properties hold:


    +   1. $B_k$ has $2^k$ nodes.

    +   2. $B_k$ has height $k$.

    +   3. For $i = 0, \dots, k$, $B_k$ has exactly $\binom{k}{i}$ nodes at depth
    $i$.

    +   4. The root of $B_k$ has degree $k$ and all other nodes in $B_k$ have degree
    smaller than $k$.

    +   5. If $k \ge 1$, then the children of the root of $B_k$ are $B_{k-1}, B_{k-2},
    \cdots, B_0$ from left to right.


    # Corollary B


    The maximum degree of an $n$-node binomial tree is $\lg n$.'
  merge: -1
  img_proc: true
