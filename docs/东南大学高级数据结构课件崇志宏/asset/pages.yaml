- pgno: 106
  md: '# FP-Tree Definition


    FP-tree is a frequent pattern tree. Formally, FP-tree is a tree structure defined
    below:


    +   1. One root labeled as “null”, a set of item prefix sub-trees as the children
    of the root, and a frequent-item header table.


    +   2. Each node in the item prefix sub-trees has three fields:

    +   - item-name: register which item this node represents,

    +   - count, the number of transactions represented by the portion of the path
    reaching this node,

    +   - node-link that links to the next node in the FP-tree carrying the same item-name,
    or null if there is none.


    +   3. Each entry in the frequent-item header table has two fields,

    +   - item-name, and

    +   - head of node-link that points to the first node in the FP-tree carrying
    the item-name.'
  merge: -1
  img_proc: true
