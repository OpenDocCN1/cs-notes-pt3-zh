- pgno: 22
  md: '# The amortized costs bound the true costs


    The total amortized cost of *n* operations is


    $$\sum_{i=1}^{n} \hat{c}_i = \sum_{i=1}^{n}\left(c_i + \Phi(D_i)-\Phi(D_{i-1})\right)$$


    $$= \sum_{i=1}^{n} c_i + \Phi(D_n)-\Phi(D_0)$$


    $$\geq \sum_{i=1}^{n} c_i \qquad \text{since } \Phi(D_n)\geq 0 \text{ and } \Phi(D_0)=0.$$


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Potential analysis of table doubling


    Define the potential of the table after the ith insertion by Φ(D_i) = 2i − 2^[lg
    i]. (Assume that 2^[lg 0] = 0.)


    # Note:


    +   - Φ(D₀) = 0,

    +   - Φ(D_i) ≥ 0 for all i.


    # Example:


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_23_0.png)


    Φ = 2·6 − 2³ = 4


    ( accounting method )'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/e8cfdb0a049dc5ab9d802234ebc2190e_24_0.png)


    # # Calculation of amortized costs


    The amortized cost of the *i*th insertion is


    $\hat{c}_i = c_i + \Phi(D_i) - \Phi(D_{i-1})$


    $= \begin{cases} i & \text{if } i-1 \text{ is an exact power of 2,} \\ 1 & \text{otherwise;}
    \end{cases} + (2i-2^{\lceil\lg i\rceil})-(2(i-1)-2^{\lceil\lg(i-1)\rceil})$


    $= \begin{cases} i & \text{if } i-1 \text{ is an exact power of 2,} \\ 1 & \text{otherwise;}
    \end{cases} + 2 = 2^{\lceil\lg i\rceil}+2^{\lceil\lg(i-1)\rceil}$.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Calculation


    # Case 1: i − 1 is an exact power of 2.


    ĉᵢ = i + 2 − 2⌈lg i⌉ + 2⌈lg (i−1)⌉

    = i + 2 − 2(i − 1) + (i − 1)

    = i + 2 − 2i + 2 + i − 1

    = 3


    # Case 2: i − 1 is not an exact power of 2.


    ĉᵢ = 1 + 2 − 2⌈lg i⌉ + 2⌈lg (i−1)⌉

    = 3


    Therefore, n insertions cost Θ(n) in the worst case.


    # Exercise: Fix the bug in this analysis to show that the amortized cost of the
    first insertion is only 2.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Conclusions


    +   - Amortized costs can provide a clean abstraction of data-structure performance.

    +   - Any of the analysis methods can be used when an amortized analysis is called
    for, but each method has some situations where it is arguably the simplest or
    most precise.

    +   - Different schemes may work for assigning amortized costs in the accounting
    method, or potentials in the potential method, sometimes yielding radically different
    bounds.'
