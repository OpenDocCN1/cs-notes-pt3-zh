- pgno: 174
  md: '# CAN: Overview


    +   - Support basic hash table operations on key-value pairs (K,V): insert, search,
    delete

    +   - CAN is composed of individual nodes

    +   - Each node stores a chunk (zone) of the hash table

    +     - A subset of the (K,V) pairs in the table

    +   - Each node stores state information about neighbor zones

    +   - Requests (insert, lookup, or delete) for a key are routed by intermediate
    nodes using a greedy routing algorithm

    +   - Requires no centralized control (completely distributed)

    +   - Small per-node state is independent of the number of nodes in the system
    (scalable)

    +   - Nodes can route around failures (fault-tolerant)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# CAN ZONES


    +   - Virtual d-dimensional Cartesian coordinate system

    +     - Example: 2-d [0,1]x[1,0]

    +   - Dynamically partitioned among all nodes

    +   - Pair (K,V) is stored by mapping key K to a point P in the space using a
    uniform hash function and storing (K,V) at the node in the zone containing P

    +   - Retrieve entry (K,V) by applying the same hash function to map K to P and
    retrieve entry from node in zone containing P

    +   - If P is not contained in the zone of the requesting node or its neighboring
    zones, route request to neighbor node in zone nearest P


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_175_0.png)'
