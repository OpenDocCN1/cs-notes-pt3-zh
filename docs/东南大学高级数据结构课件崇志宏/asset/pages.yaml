- pgno: 183
  md: '# Adding Realities


    +   - Nodes can maintain multiple independent coordinate spaces (realities)


    +   - For a CAN with *r* realities:

    +     - a single node is assigned *r* zones

    +     - and holds *r* independent neighbor sets

    +     - Contents of the hash table are replicated for each reality


    +   - Example: for three realities, a (*K*, *V*) mapping to *P*:(*x*,*y*,*z*)
    may be stored at three different nodes

    +     - (*K*, *V*) is only unavailable when all three copies are unavailable

    +     - Route using the neighbor on the reality closest to (*x*,*y*,*z*)


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Dimensions vs. Realities


    +   - Increasing the number of dimensions and/or realities decreases path length
