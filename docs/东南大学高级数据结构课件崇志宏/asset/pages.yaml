- pgno: 201
  md: '# Failures and Replication


    +   - When a node *n* fails, nodes whose finger tables include *n* must find *n*’s
    successor.

    +   - Each Chord node maintains a “successor-list” of its r nearest successor
    on the Chord ring.

    +   - A typical application using Chord might store replicas of the data associated
    with key at the *k* nodes succeeding the key.'
