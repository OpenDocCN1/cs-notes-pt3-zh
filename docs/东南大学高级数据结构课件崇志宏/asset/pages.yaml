  md: '# 平摊分析特点


    +   1）它是一种分析的方法，适用于分析一个彼此相关的操作序列。其分析方法不是

    +   2）操作序列的总代价是序列长度的函数，而不是输入量规模的函数。

    +   3）不仅是分析方法，也是设计算法和数据结构的一种思维方法。


    因为设计算法与分析时间性能紧密相关，

    所以通过平摊分析可优化算法设计，加深对算法所操作的数据结构特性的认识，从


    提出三种平摊分析的方法：


    +   合计法、聚集方法（aggregate）：

    +   记账法、会计法（accounting）：

    +   势能法（potential）。'
