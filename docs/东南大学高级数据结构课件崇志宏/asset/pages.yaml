    \ 1962] Intuitive method that guarantees to find a stable matching.\n\n```\nInitialize\
    \ each person to be free.\nwhile (some man is free and hasn't proposed to every\
    \ woman) {\n    Choose such a man m\n    w = 1st woman on m's list to whom m has\
    \ not yet proposed\n    if (w is free)\n        assign m and w to be engaged\n\
    \    else if (w prefers m to her fiancé m')\n        assign m and w to be engaged,\
    \ and m' to be free\n    else\n        w rejects m\n}\n```"
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Proof of Correctness: Termination


    Observation 1. Men propose to women in decreasing order of preference.


    Observation 2. Once a woman is matched, she never becomes unmatched; she only
    "trades up."


    Claim. Algorithm terminates after at most n² iterations of while loop.

    Pf. Each time through the while loop a man proposes to a new woman.

    There are only n² possible proposals. ■'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Proof of Correctness: Perfection


    Claim. All men and women get matched.


    Pf. (by contradiction)


    +   - Suppose, for sake of contradiction, that Zeus is not matched upon termination
    of algorithm.

    +   - Then some woman, say Amy, is not matched upon termination.

    +   - By Observation 2, Amy was never proposed to.

    +   - But, Zeus proposes to everyone, since he ends up unmatched.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Efficient Implementation


    **Efficient implementation.** We describe O(n²) time implementation.


    +   **Representing men and women.**

    +   - Assume men are named 1, ..., n.

    +   - Assume women are named 1′, ..., n′.


    +   **Engagements.**

    +   - Maintain a list of free men, e.g., in a queue.

    +   - Maintain two arrays `wife[m]` and `husband[w]`.

    +     - set entry to 0 if unmatched

    +     - if m matched to w then `wife[m]=w` and `husband[w]=m`


    +   **Men proposing.**

    +   - For each man, maintain a list of women, ordered by preference.

    +   - Maintain an array `count[m]` that counts the number of proposals made by
    man m.'
  merge: -1
  img_proc: true
