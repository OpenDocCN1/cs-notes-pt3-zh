- pgno: 96
  md: '# Review of Apriori-like Approaches for finding complete frequent item-sets


    # Apriori


    +   - **Main Steps of Apriori Algorithm:**

    +     - Use frequent $(k-1)$-itemsets ($L_{k-1}$) to generate candidates of frequent
    $k$-itemsets $C_k$.

    +     - Scan database and count each pattern in $C_k$, get frequent $k$-itemsets
    ($L_k$).

    +   - **E.g.,**


    | TID | Items bought |

    |---|---|

    | 100 | {f, a, c, d, g, i, m, p} |

    | 200 | {a, b, c, f, l, m, o} |

    | 300 | {b, f, h, j, o} |

    | 400 | {b, c, k, s, p} |

    | 500 | {a, f, c, e, l, p, m, n} |


    | Apriori iteration | |

    |---|---|

    | C1 | f, a, c, d, g, i, m, p, l, o, h, j, k, s, b, e, n |

    | L1 | f, a, c, m, b, p |

    | C2 | fa, fc, fm, fp, ac, am, ...bp |

    | L2 | fa, fc, fm, ... |

    | ... | |


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_96_0.png)


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_96_1.png)'
