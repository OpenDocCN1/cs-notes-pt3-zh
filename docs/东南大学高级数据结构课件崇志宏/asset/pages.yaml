  md: 'A binomial tree $B_k$ is an ordered tree defined recursively.


    +   - $B_0$ consists of a single node.

    +   - For $k \ge 1$, $B_k$ is a pair of $B_{k-1}$ trees, where the root of one
    $B_{k-1}$ becomes the leftmost child of the other.'
