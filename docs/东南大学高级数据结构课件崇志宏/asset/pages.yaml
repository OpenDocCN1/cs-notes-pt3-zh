  md: '# Insertion


    +   To insert an item (x, o) into a skip list, we use a randomized algorithm:

    +   - We repeatedly toss a coin until we get tails, and we denote with i the number
    of times the coin came up heads

    +   - If i ≥ h, we add to the skip list new lists S_{h+1}, ..., S_{i+1}, each
    containing only the two special keys

    +   - We search for x in the skip list and find the positions p0, p1, ..., pi
    of the items with largest key less than x in each list S0, S1, ..., Si

    +   - For j ← 0, ..., i, we insert item (x, o) into list Sj after position pj

    +   Example: insert key 15, with i = 2


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_273_0.png)'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Deletion


    To remove an item with key x from a skip list, we proceed as follows:


    +   - We search for x in the skip list and find the positions p₀, p₁, ..., pᵢ
    of the items with key x, where position pⱼ is in list Sⱼ

    +   - We remove positions p₀, p₁, ..., pᵢ from the lists S₀, S₁, ..., Sᵢ

    +   - We remove all but one list containing only the two special keys


    Example: remove key 34


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_274_0.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Space Usage


    +   - The space used by a skip list depends on the random bits used by each invocation
    of the insertion algorithm

    +   - We use the following two basic probabilistic facts:

    +     Fact 1: The probability of getting i consecutive heads when flipping a coin
    is 1/2^i

    +     Fact 2: If each of n items is present in a set with probability p, the expected
    size of the set is np


    +   - Consider a skip list with n items

    +     - By Fact 1, we insert an item in list S_i with probability 1/2^i

    +     - By Fact 2, the expected size of list S_i is n/2^i

    +   - The expected number of nodes used by the skip list is

    +     ∑_{i=0}^{h} n/2^i = n ∑_{i=0}^{h} 1/2^i < 2n

    +   - Thus, the expected space usage of a skip list with n items is O(n)'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Height


    +   - The running time of the search an insertion algorithms is affected by the
    height $h$ of the skip list

    +   - We show that with high probability, a skip list with $n$ items has height
    $O(\log n)$

    +   - We use the following additional probabilistic fact:

    +     Fact 3: If each of $n$ events has probability $p$, the probability that
    at least one event occurs is at most $np$


    +   - Consider a skip list with $n$ items

    +     - By Fact 1, we insert an item in list $S_i$ with probability $1/2^i$

    +     - By Fact 3, the probability that list $S_i$ has at least one item is at
    most $n/2^i$

    +   - By picking $i = 3\log n$, we have that the probability that $S_{3\log n}$
    has at least one item is at most

    +     $n/2^{3\log n} = n/n^3 = 1/n^2$

    +   - Thus a skip list with $n$ items has height at most $3\log n$ with probability
    at least $1 - 1/n^2$'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Search and Update Times


    +   - The search time in a skip list is proportional to

    +     - the number of drop-down steps, plus

    +     - the number of scan-forward steps

    +   - The drop-down steps are bounded by the height of the skip list and thus
    are $O(\log n)$ with high probability

    +   - To analyze the scan-forward steps, we use yet another probabilistic fact:

    +     Fact 4: The expected number of coin tosses required in order to get tails
    is 2


    +   - When we scan forward in a list, the destination key does not belong to a
    higher list

    +     - A scan-forward step is associated with a former coin toss that gave tails

    +   - By Fact 4, in each list the expected number of scan-forward steps is 2

    +   - Thus, the expected number of scan-forward steps is $O(\log n)$

    +   - We conclude that a search in a skip list takes $O(\log n)$ expected time

    +   - The analysis of insertion and deletion gives similar results'
  merge: -1
  img_proc: true
