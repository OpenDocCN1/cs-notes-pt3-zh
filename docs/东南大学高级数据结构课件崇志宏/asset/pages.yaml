- pgno: 38
  md: '# # MTF is O(1)-competitive


    **Theorem.** MTF is 4-competitive for self-organizing lists.


    *Proof.* Let $L_i$ be MTF’s list after the $i$th access, and let $L_i^*$ be OPT’s
    list after the $i$th access.


    Let $c_i$ = MTF’s cost for the $i$th operation


    $= 2 \cdot \operatorname{rank}_{L_{i-1}}(x)$ if it accesses $x$;


    $c_i^*$ = MTF’s cost for the $i$th operation


    $= \operatorname{rank}_{L_{i-1}^*}(x) + t_i$,


    where $t_i$ is the number of transposes that OPT performs.'
  merge: -1
  img_proc: true
