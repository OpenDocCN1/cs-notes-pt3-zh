- pgno: 83
  md: '\[

    \begin{aligned}

    \text{amortized cost} &= 2+\phi(i+1)-\phi(i)\\

    &=2+\bigl(r''(x)+r''(y)+r''(z)\bigr)-\bigl(r(x)+r(y)-r(z)\bigr)\\

    &=2+\bigl(r''(x)-r(z)\bigr)+r''(y)+r''(z)-r(x)-r(y)\\

    &\le 2+0+r''(x)+r''(z)-r(x)-r(x)\\

    &=2+r''(x)+r''(z)-2r''(x)

    \end{aligned}

    \]


    The log function is concave, i.e., \(\frac{\log a+\log b}{2}\le \log\left(\frac{a+b}{2}\right)\).
    Thus we also have (\(s\) is weight sum before the splay step and \(s''\) is weight
    sum after the splay step):


    \[

    \frac{\log(s(x))+\log(s''(z))}{2}\le \log\left(\frac{s(x)+s''(z)}{2}\right)

    \]


    \[

    \frac{r(x)+r''(z)}{2}\le \log\left(\frac{s(x)+s''(z)}{2}\right)\qquad\text{(note
    that }s(x)+s''(z)\le s''(x)\text{)}

    \]


    \[

    \begin{aligned}

    &\le \log\left(\frac{s''(x)}{2}\right)\\

    &=r''(x)-1\\

    r''(z)&\le 2r''(x)-r(x)-2

    \end{aligned}

    \]'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# **Corollary 1**  *The amortized cost of a splay operation on node x is O(log
    n).*


    # **Proof:**


    The amortized cost of a splay operation on *x* is the sum of the amortized costs
    of the splay steps on *x* involved:


    ```

    $$\begin{aligned}

    \text{amortized cost} &= \sum_i \text{cost}(\text{splay step}_i) \\

    &\leq \sum_i \left(3(r^{i+1}(x)-r^i(x))+1\right) \\

    &= 3(r(\text{root})-r(x))+1

    \end{aligned}$$

    ```


    The +1 comes from the last *r* or *r* splay step (if necessary). If we set *w(v)
    = 1* for all nodes in the tree, then *r(root) = log n* and we have:


    ```

    $$\text{amortized cost} \leq 3\log n + 1 = O(\log n)$$

    ```'
  merge: -1
  img_proc: true
