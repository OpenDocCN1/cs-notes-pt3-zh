- pgno: 32
  md: '# # On-line and off-line problems


    **Definition.** A sequence $S$ of operations is provided one at a time. For each
    operation, an *on-line* algorithm $A$ must execute the operation immediately without
    any knowledge of future operations (e.g., *Tetris*). An *off-line* algorithm may
    see the whole sequence $S$ in advance.


    **Goal:** Minimize the total cost $C_A(S)$.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Worst-case analysis of self-organizing lists


    An adversary always accesses the tail (*n*th) element of *L*. Then, for any on-line
    algorithm *A*, we have


    $$C_A(S) = \Omega(|S| \cdot n)$$


    in the worst case.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_33_0.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Average-case analysis of self-organizing lists


    Suppose that element $x$ is accessed with probability $p(x)$. Then, we have


    E[$C_A(S)$] = $\sum_{x \in L} p(x) \cdot \text{rank}_L(x)$


    which is minimized when $L$ is sorted in decreasing order with respect to $p$.


    **Heuristic:** Keep a count of the number of times each element is accessed, and
    maintain $L$ in order of decreasing count.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/e8cfdb0a049dc5ab9d802234ebc2190e_35_0.png)


    # The move-to-front heuristic


    **Practice:** Implementers discovered that the *move-to-front (MTF)* heuristic
    empirically yields good results.


    **IDEA:** After accessing *x*, move *x* to the head of *L* using transposes:


    cost = 2 · rank_L(x).


    The MTF heuristic responds well to locality in the access sequence *S*.'
  merge: -1
  img_proc: true
