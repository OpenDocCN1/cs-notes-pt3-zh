  md: '# Error Analysis


    How much do we undercount?


    If current size of stream = N

    and window-size w = 1/ε


    then frequency error ≤ # windows = εN


    Rule of thumb:

    Set ε = 10% of support s

    Example:

    Given support frequency s = 1%,

    set error frequency ε = 0.1%'
