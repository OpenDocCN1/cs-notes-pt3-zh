  md: '# Principles of FP-Growth


    +   - Pattern growth property

    +     - Let α be a frequent itemset in DB, B be α''s conditional pattern base,
    and β be an itemset in B. Then α ∪ β is a frequent itemset in DB iff β is frequent
    in B.

    +   - Is “fcabm” a frequent pattern?

    +     - “fcab” is a branch of m''s conditional pattern base

    +     - “b” is NOT frequent in transactions containing “fcab”

    +     - “bm” is NOT a frequent itemset.'
