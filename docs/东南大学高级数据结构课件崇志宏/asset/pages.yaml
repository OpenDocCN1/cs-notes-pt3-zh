- pgno: 209
  md: '# Theorems


    +   - *Theorem 1*: The tree is a balanced tree if every node in the tree that
    has a child also has both its left and right routing tables full (*).


    +   - *Theorem 2*: If a node, say *x*, contains a link to another node, say *y*,
    in its left or right routing tables, parent node of *x* must also contain a link
    to parent node of *y* unless the same node is parent of both *x* and *y*.


    (*) A routing table is full if none of the valid links is NULL.'
  merge: -1
