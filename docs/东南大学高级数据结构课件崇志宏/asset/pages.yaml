- pgno: 11
  md: '# Amortized analysis


    An *amortized analysis* is any strategy for analyzing a sequence of operations
    to show that the average cost per operation is small, even though a single operation
    within the sequence might be expensive.


    Even though we’re taking averages, however, probability is not involved!


    +   - An amortized analysis guarantees the average performance of each operation
    in the *worst case*.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # Types of amortized analyses


    Three common amortization arguments:


    +   - the *aggregate* method,

    +   - the *accounting* method,

    +   - the *potential* method.


    We’ve just seen an aggregate analysis.


    The aggregate method, though simple, lacks the precision of the other two methods.
    In particular, the accounting and potential methods allow a specific *amortized
    cost* to be allocated to each operation.


    ![](img/e8cfdb0a049dc5ab9d802234ebc2190e_12_0.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # Accounting method


    +   - Charge *i*th operation a fictitious **amortized cost** $c_i$, where $\$1$
    pays for 1 unit of work (*i.e.*, time).

    +   - This fee is consumed to perform the operation.

    +   - Any amount not immediately consumed is stored in the *bank* for use by subsequent
    operations.

    +   - The bank balance must not go negative! We must ensure that

    +     $$\sum_{i=1}^{n} c_i \leq \sum_{i=1}^{n} \hat{c}_i$$

    +     for all $n$.

    +   - Thus, the total amortized costs provide an upper bound on the total true
    costs.'
  merge: -1
  img_proc: true
