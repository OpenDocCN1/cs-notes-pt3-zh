    \n- (3) 形参也是局部变量。\n\n```\n例1:  void function1(void)\nvoid function2(void);\nmain()\n\
    {      int m=1000;\n      function2();\n      printf(\"%d\\n\",m );\n} /*第三次输出*/\n\
    void function2(void)\n{      int m=100;\n      function1();\n      printf(\"%d\\\
