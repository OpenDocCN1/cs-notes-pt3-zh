    \  \n  指向指针的指针是这样一种参数，它用于描述一种把其他指针的地址作为内容的指针。\n  \n- d) 可以将 float 类型的指针强制转换为 integer\
    \ 类型的指针。\n  \n  可以把float型的指针用作指向integer型数的指针。\n\n- e) 可以将一个整数加到指针上。\n指针可以与一个整数相加。\n\
    \n- f) 一个指针永远不能从另一个指针中减去。\n指针不能与指针相减。\n\n- g) 当数组作为函数参数传递时，传递的是一个指针。\n当把数组作为变量传递给一个函数时，就等于传递了一个指针。\n\
    \n- h) 指针不能用作函数定义头部的形式参数。\n进行函数定义时，函数头内的形参不能使用指针。\n\n"
