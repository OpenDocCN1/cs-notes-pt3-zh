    如：若b为float型变量，执行b=35后，则b为35.00000\n\n（3）整型数据赋给字符型变量时,只将低8位原封不动地送到字符变量中（即截断）。\n\
    如：\n0000 0001 0010 0001   i=289=256+33\n↓\n0010 0001   c=33  c='!'\n\n（4）字符型数据赋给整型变量时，将字符数据(8位)放到整型变量低8位中。高8位则需要依据“符号扩展”来决定。\n\
    \n## 例1（无符号字符数据赋给整型变量）\n\n```\nunsigned char c;\nint i;\nc=254;\ni=c;\n```\n\n\
