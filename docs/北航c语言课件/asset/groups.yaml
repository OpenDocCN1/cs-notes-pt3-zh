    # 五、文件的定位函数


    +   1. rewind函数


    一般调用形式：


    ```

    rewind(文件指针);

    ```


    功能：使位置指针重新返回文件的开头。


    +   2. fseek函数


    一般调用形式：


    ```

    fseek(文件指针，位移量，起始点);

    ```


    起始点：用0、1、2或其对应的名字SEEK_SET、SEEK_CUR、SEEK_END代替，分别表示文件开始、文件当前位置、文件末尾。


