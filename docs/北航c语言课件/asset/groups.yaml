    \n```\nchar c;\nint i;\nc=254;\ni=c;  /* 变量c以整数形式输出为-2 */\n```\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_131_1.png)\n\
    \n- （5）将带符号数据赋给长度相同的无符号型变量，原样照赋。\n\n- （6）**double** 赋给 **float** 时，截取前面7位有效数字。\n\
