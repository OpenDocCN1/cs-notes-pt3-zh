    void main()\n{\n    int i=1;\n    long int sigma=1;\n    while (i<=10)\n    {\n\
    \        sigma=sigma*i;\n        i++;\n    }\n    printf(\"10!=%ld\\n\", sigma);\n\
    }\n```\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_276_0.png)\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_276_1.png)\n\
    \n> 思考：如果不使用long int，还可以使用什么变量类型定义sigma\n\n### 循环结构的程序流程是：\n\n在满足给定条件时，反复执行某个程序段。\n\
    \n### C语言中可以用以下语句来实现循环：\n\n- (1) 用goto语句和 if 语句构成循环；\n- (2) 用while语句；\n- (3) 用do_while语句；\n\
    - (4) 用for语句。\n\n### 6.2 goto语句和goto语句构成的循环\n\n### 一、goto 语句（Goto Sentence）\n\n\
    goto 语句为无条件转向语句，其作用为：使程序的执行无条件地转移到指定处。\n\n**一般形式：**\n\n```\ngoto 语句标号;\n```\n\n\
    ### 执行过程：执行语句时，程序转移到以标号（命名规则与变量相同）为前缀的语句处继续执行。\n\n如：向前跳\n\n```\ngoto label;\n\
    ```\n\n……\n\n……\n\n```\nlabel:语句;\n```\n\n向后跳\n\n如： √ goto label_1; × goto 123;\n\
    \n……\n\n……\n\n### 二、用goto语句和 if 语句构成循环\n\n例：计算10！并输出结果。\n\n```\nvoid main()\n\
    {\nint i=1, sum=1;\nloop: if (i<=10)\n{\n    sum=sum*i;\n    i++;\n    goto loop;\n\
    }\nprintf(\"10!=%d\\n\",sum);\n}\n```\n\n```\nvoid main()\n{\nint i=1; long sum=1;\n\
    loop: if (i<=10)\n{\n    sum=sum*i;\n    i++;\n    goto loop;\n}\nprintf(\"10!=%ld\\\
    n\",sum);\n}\n```\n\n运行结果：10!=24320\n\n本应是：10!=3628800\n\n### 6.3 while循环语句\n\n\
    一般形式：\n\n```\nwhile (表达式) 语句\n```\n\n执行过程：\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_282_0.png)\n\
    \n- 1. 先计算表达式的值；\n- 2. 若表达式的值为真（非0）时执行循环体中的语句，然后重复上面步骤。若表达式的值为假（0），则结束循环。\n\n\
    ### 例：将上面计算10！并输出结果的程序用\nwhile语句写出：\n\n```\n//用goto语句\nvoid main()\n{\n    int\
    \ i=1;\n    long int sum=1;\n    loop: if (i<=10)\n    {\n        sum=sum*i;\n\
    \        i++;\n        goto loop;\n    }\n    printf(\"10!=%ld\\n\",sum);\n}\n\
    ```\n\n```\n//用while循环语句\nvoid main()\n{\n    int i=1;\n    long int sum=1;\n\
    \    while (i<=10)\n    {\n        sum=sum*i;\n        i++;\n    }\n    printf(\"\
    10!=%ld\\n\",sum);\n}\n```\n\n### 注意：\n\n(1)循环条件中的表达式一般是逻辑表达式或关系表达式，也可以是算术表达式（非0为真，0为假）。一般表达式中应含有循环控制变量。\n\
    \n```\nwhile (3)\n```\n\n```\nwhile (0)\n```\n\n虽然从程序设计的角度上说是不合理的，但却是合法的。\n\n\
    | 语句 | 含义 |\n|---|---|\n| while (3) 语句 | 表示无限循环 |\n| while (0) 语句 | 表示不进入循环体 |\n\
    \n### 6.4 do-while循环语句\n\n一般形式：\n\n```\ndo\n语句\nwhile(表达式);\n```\n\n分号不能少\n\n\
    执行过程：\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_288_0.png)\n\n- (1)执行循环体中的语句；\n\
    - (2)计算表达式，测试循环条件，为真(非0)则重复上面步骤，为假(0)结束循环。\n\n### 将while和do-while循环做一下比较：\n\n\
    | while 循环 | do-while 循环 |\n|---|---|\n| ```c\n#include<stdio.h>\nvoid main()\n\
    {\n    int i; long sum=1;\n    scanf(\"%d\", &i);\n    while (i<=10)\n    {\n\
    \        sum=sum*i;\n        i++;\n    }\n    printf(\"%ld\\\\n\",sum);\n}\n```\
    \ | ```c\n#include<stdio.h>\nvoid main()\n{\n    int i; long sum=1;\n    scanf(\"\
    %d\", &i);\n    do\n    {\n        sum=sum*i;\n        i++;\n    }while (i<=10);\n\
    \    printf(\"%ld\\\\n\",sum);\n}\n``` |\n\n| 输入：9 | 输入：11 | 输入：9 | 输入：11 |\n\
    |---|---|---|---|\n| 输出：90 | 输出：1 | 输出：90 | 输出：11 |\n\n"
