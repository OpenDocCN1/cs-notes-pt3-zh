    # (1)非缓冲文件系统：程序与外设直接进行数据交换。


    特点：每读写一次都要启动外设。


    # (2)缓冲文件系统：程序与外设通过内存缓冲区进行数据交换。（常用的方式）


    特点：只有内存缓冲区满(写盘)或空(读盘)才启动外设。


