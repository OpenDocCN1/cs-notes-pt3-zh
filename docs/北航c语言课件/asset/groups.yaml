    ## 概述\n\n## 一、编译预处理的概念\n\nC语言允许在程序中使用几种特殊的命令（它们不是一般的C语句），在C编译系统对程序进行通常的编译之前，先对程序中这些特殊命令进行“预处理”，然后将预处理的结果和源程序一起再进行通常的编译处理，以得到目标代码。\n\
