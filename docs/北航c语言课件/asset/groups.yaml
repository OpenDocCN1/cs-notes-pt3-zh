    # （3）先赋值后使用


    字符指针变量必须先赋值后使用，否则对系统构成危险。因此，不可以如下编程：


    ```

    char *ps; scanf("%s", ps);

    ```


    而应写成：


    ```

    char *ps,s[10]; ps=s; scanf("%s", ps);

    ```


