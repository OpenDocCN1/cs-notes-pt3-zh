    |---|---|---|---|

    | a[i] | [j] | &a[i][j] | a[i][j] |

    | a[i] | j | a[i]+j | *(a[i]+j) |

    | *(a+i) | j | *(a+i)+j | *(*(a+i)+j) |

    | *(a+i) | [j] | *(a+i)[j] | *(*(a+i))[j] |

