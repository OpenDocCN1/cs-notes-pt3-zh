  - '[PAGE 20]


    # 1.2 C语言的特点（2）


    +   3. 具有丰富的运算符和数据类型，语言表达能力强，具有较强的数据类型构造能力。


    +   4. 可移植性强，广泛移植到了各类计算机上，形成多种版本的C语言。


    +   5. 生成代码质量高，程序执行效率高。只比汇编程序的目标代码效率低10%~20%。可以直接访问内存的物理地址，进行位(bit)一级的操作。


    +   6. 由于实现了对硬件的编程操作，因此C语言集高级语言和低级语言的功能于一体，既可用于系统软件的开发，也适合于应用软件的开发。


