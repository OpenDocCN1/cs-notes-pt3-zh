    # 习题6.11（看书P120~P121）


    已知：正数a和求a的算术平方根x的公式。\n求：a的算术平方根x。


    +   算法：\n① 从键盘上输入a，并假设a的第一个根为x=a；误差标志变量dx。\n② 重复做：\n　　记下上一个根x0=x；\n　　按公式求下一个根x；x=(x+a/x)/2；\n　　求两个根的误差绝对值dx=fabs(x-x0)。\n③
    当两次求得的根之差的绝对值（精度）dx<=0.00001时停止。X即为所求平方根。'
  - "[PAGE 325]\n\n```\n```c\n#include “math.h”\nmain()\n{\n    float a, x, x0, dx;\n\
    \    printf(\"\\n a=\");\n    scanf(\"%f\",&a);\n    x=a;\n    do\n    {\n   \
    \     x0=x; //上次求出的根\n        x=(x+a/x)/2; //本次求出的根\n        dx=fabs(x- x0);\n\
    \    }while(dx>0.00001);\n    printf(\"\\n x=%f\",x);\n}\n```\n```"
