    # 1.2 C语言的特点（1）


    C语言的主要特点如下：


    +   1. 是一种较简单的语言，容易入门，上手快。


    +   2. 语言精练，层次清晰，便于按模块化方式组织程序，易于调试和维护。


    ```

    i+=2;    i=i+2

    ```


    if (e) s; 如果 e 为真，则执行 s; 否则执行下一条语句


    ```

    for (s1; s2; s3) s4;

