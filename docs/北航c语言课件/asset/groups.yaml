    # 课程简介及教学安排


    ## 一、教学目的


    - 掌握计算机程序设计的基本知识和程序设计的一般方法，了解进行科学计算的一般思路。

    - 掌握C语言的基本内容及编程技巧，培养学生具备应用计算机解决和处理问题的思维方法与基本能力，为进一步学习和应用计算机打下基础。


    ## 二、教学安排及学时分配


    - 1. 总学时：46学时 （2~15周）

    - 授课学时：26学时（13次）

