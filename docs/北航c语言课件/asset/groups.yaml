    \n### 三、文件的基本操作\n\n(1) 打开文件： 把文件名等目录信息从磁盘上读入内存并存入结构体。\n(2) 关闭文件： 把内存结构体中的文件名等目录信息写入磁盘。\n\
    (3) 写文件： 向文件写内容。\n(4) 读文件： 从文件读内容。\n\n### 四、文件的输入输出方式\n\nC语言对文件进行处理分为：\n\n非缓冲文件系统\
    \ no buffer file system\n缓冲文件系统 buffer file system\n\n## (1)非缓冲文件系统：程序与外设直接进行数据交换。\n\
    \n特点：每读写一次都要启动外设。\n\n## (2)缓冲文件系统：程序与外设通过内存缓冲区进行数据交换。（常用的方式）\n\n特点：只有内存缓冲区满(写盘)或空(读盘)才启动外设。\n\
    \n![](img/7e3448331bc3f721cf3127b2b2f06002_585_0.png)\n\n## § 13.2 C文件类型指针\n\n\
    ### 一、文件类型（FILE type）\n\n每个被使用的文件都在内存中开辟一个区，用来存放文件的有关信息（如文件名，状态，当前位置等）。这些信息保存在一个结构体类型的变量中。结构体类型由系统定义为“FILE”。\n\
    \nData structure of a file is defined as **FILE** in the library of standard I/O\
    \ function definitions.\n\nTherefore, all files should be declared as **FILE**\
    \ before they are used. **FILE** is a defined data type.\n\n## § 13.3 文件的打开和关闭函数\n\
    \n### 一、文件的打开函数（fopen函数）\n\n### (1) 调用方式：\n\n```\nFILE *fp;\nfp= fopen(文件名， 文件的使用方式);\n\
    ```\n\n用户定义的文件类型指针变量\n\n所要打开的文件名。必须是双引号引起的字符串常量。\n\n具有特定含义的符号也必须由双引号引起\n\n```\n\
    fp= fopen(\"filename\", \"mode\");\n```\n\n（2）**功能：** 以指定的方式打开指定的文件，若操作成功，则返回一个指向该文件的指针，若打开文件时出现错误，则返回空指针NULL。\n\
    \n```\n例： FILE *fp;\n\n     fp=fopen(\"mydata.txt\",\"r\");\n```\n\n### （2）**Operation:**\n\
    \n- Creates a new file for use.\n- Opens an existing file for use.\n\nIf operating\
    \ success, the function will return a pointer to the file, else it will return\
    \ an empty pointer of NULL.\n\n## (3)文件使用方式\n\n• 基本方式字符（单独使用是对文本文件）：\n\nr 只读文件(读),\
    \ 如无文件，产生出错信息。\nIf the purpose is ‘reading’, and if it exists, then the file is\
    \ opened with the current contents safe otherwise an error occurs.\n\nw 建立新文件(写)，如有同名文件，删除之。\n\
    When the mode is ‘writing’, a file with the specified name is created if the file\
    \ does not exist. The contents are deleted, if the file already exists.\n\na 写旧文件(添加)，如无旧文件，则生成该文件。\n\
    When the mode is ‘appending’, the file is opened in the current contents safe.\
    \ A file with the specified name is created if the file does not exist.\n\n"
