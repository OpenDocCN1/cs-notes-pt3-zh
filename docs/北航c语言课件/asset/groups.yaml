    # 二、函数的指针及指向函数的指针变量


    # 1. 函数的指针（地址）概念


    每一个函数都占用一段内存，在编译时，被分配一个入口地址，这个入口地址就称为函数的指针。


    # 2. 指向函数的指针变量


    定义指向函数的指针变量的一般形式：


    ```

    类型标识符 (*指针变量名)();

    ```


    例如： float (*p)();

    含意： 定义了 p 是指向函数的指针变量，函数的返回值是 float 类型。'
  - '[PAGE 550]


    **注意：**（1）`(*p)()`表示定义一个指向函数的指针变量，它不是固定指向哪个函数。\n（2）对指向函数的指针变量，`p+n`、`p++`、`p--`等运算是无意义的。\n（3）注意区别
    `int (*p)()`、`int *p()`


    # 3. 对指向函数的指针变量赋值


    将一个函数的函数名（代表入口地址）赋值给指向函数的指针变量，也称该指针变量指向了这个函数。


    ```

    如：  int max(int x,int y); /*函数的原型声明*/\n      int (*p)();\n      p=max;

    ```


    **注意：**赋值时，只需给出函数名而不必给出参数。'
