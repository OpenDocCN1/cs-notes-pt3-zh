    # 什么叫循环嵌套？


    一个循环的循环体中套有另一个循环叫循环嵌套。这种嵌套过程可以一直重复下去。


    一个循环外面包围一层循环称为二重循环。


    一个循环外面包围二层循环称为三重循环。


    一个循环外面包围多层循环称为多重循环。


    while、do-while、for可以互相嵌套，自由组合。'
