    \ do-while 语句**后判断**循环控制条件，它至少执行一次循环体。\n- （4）在循环条件中或循环体内必须有使循环趋于结束的语句，否则会出现死循环等异常情况。\n\
    - （5）三种循环可以处理同一问题，一般情况可以互相代替。但在实际应用中，我们要根据具体情况来选用不同的循环语句。选用的一般原则如下：\n\n- 如果循环次数在执行循环体之前就已确定，一般用\
    \ for 语句；如果循环次数是根据循环体的执行情况确定的，一般用 while 语句或者 do-while 语句。\n\n  （循环次数确定例）\n\n```c\n\
    int i,n;\nlong sum=1;\nscanf(\"%d\", &n);\nfor(i=1;i<=n;i++)\n    sum=sum*i;\n\
    ```\n\n  （循环次数不确定例）\n\n```c\nchar c;\ndo\n{\n    c=getchar();\n    printf(\"%c\"\
    ,c);\n} while(c!='q' && c!='Q');\n```\n\n- 当循环体至少执行一次时，用 do-while 语句；反之，如果循环体可能一次也不执行，用\
    \ while 语句。\n\n  （循环体至少执行一次）\n\n```c\n/*只有当用户键入q或Q，才结束循环*/\nchar c;\ndo\n{\n \
    \   c=getchar();\n    printf(\"%c\",c);\n} while(c!='q' && c!='Q');\n```\n\n \
    \ （循环体可能一次不执行）\n\n```c\n/*只有不是q或Q的字符才被打印*/\nchar c;\nc=getchar();\nwhile(c!='q'\
    \ && c!='Q')\n{\n    printf(\"%c\",c);\n    c=getchar();\n}\n```\n\n  注意：\n\n\
    ```\n!(a&&b) == !a || !b\n!(a||b) == !a && !b\n```\n\n  所以：`c!='q' && c!='Q'`\
    \ <==> `!(c=='q' || c=='Q')`\n\n## 6.7 循环的嵌套\n\n例：在屏幕上打印一个 8 行 7 列的星号矩阵。\n\n```c\n\
    #include <stdio.h>\nmain()\n{\n    int i;\n    for( i=0; i<7; i++ ) printf(\"\
    *\"); /*打印第1行星号*/\n    printf(\"\\n\");\n    for( i=0; i<7; i++ ) printf(\"*\"\
    ); /*打印第2行星号*/\n    printf(\"\\n\");\n    .....\n    for( i=0; i<7; i++ ) printf(\"\
    *\");/*打印第8行星号*/\n}\n```\n\n### 什么叫循环嵌套？\n\n一个循环的循环体中套有另一个循环叫循环嵌套。这种嵌套过程可以一直重复下去。\n\
    \n一个循环外面包围一层循环称为二重循环。\n\n一个循环外面包围二层循环称为三重循环。\n\n一个循环外面包围多层循环称为多重循环。\n\n`while`、`do-while`、`for`\
    \ 可以互相嵌套，自由组合。\n\n例：在显示器上输出以下图案。\n\n```\n0     *\n1   ***\n2  *****\n3 *******\n\
    4 *********\n5***********\n```\n\n```c\n#include <stdio.h>\nmain()\n{\n    int\
    \ i, j, k;\n    for( i=0; i<6; i++ )  // i=1; i<7 或者 i=1; i<=6\n    {\n      \
    \  for(j=0;j<5-i;j++) printf(\" \");\n        for( k=0; k<2*i+1; k++ ) printf(\"\
    *\");\n        printf(\"\\n\");\n    }\n}\n```\n\n## 6.8 break 和 continue 语句\n\
    \n### 一、break 语句\n\n一般形式：\n\n```\nbreak;\n```\n\n功能：结束当前的循环语句。\n\n解释：break 语句一般用在循环体的条件语句中，其作用是当某个条件满足时用\
    \ break 语句退出当前循环，不再继续执行剩余的几次循环。\n\n例：打印半径为 1~10 的圆的面积，如果面积超过 100，则不再打印。\n\n```c\n\
    #include<stdio.h>\n#define PI 3.14159 //符号常量\nmain()\n{\n    int r;\n    float\
    \ area;\n    for(r=1; r<=10; r++)\n    {\n        area=PI*r*r;\n        if(area>100.0)\
    \ break; // r=6\n        printf(\"area=%f\\n\",area);\n    }\n    printf(\"now,\
    \ r=%d\\n\",r);\n}\n```\n"
  mdcn: "\n\n比较上面两个程序，虽然结构是相同的，在输入值为有效值时结果相同，但当输入无效值时输出结果是不同的。为什么？\n\n## while 与 do-while\
    \ 的主要区别\n\nwhile 语句进入循环体之前，先测试循环条件，表达式必须为真；否则 while 循环不进入循环体，即循环体可能一次也不执行。\n\n\
    而 do-while 语句先执行循环体，然后测试循环条件。不管开始的时候循环条件是真是假，循环体都要执行一次。\n\n## 6.5 for 循环语句\n\n\
    一般形式：\n\n```\nfor(表达式1; 表达式2; 表达式3) 语句(循环体)\n```\n\n分号不能省略。\n\n- 表达式1：变量初始化\n\
    - 表达式2：循环控制条件测试\n- 表达式3：控制变量更新\n\n前面已经说明，要正确表达循环结构应注意三方面的问题：控制变量的初始化，循环条件的设置和控制变量的更新。\n\
    \nfor 语句在书写形式上正好体现了这种紧密的逻辑关系。\n\n### 执行过程：\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_293_0.png)\n\
    \n- (1) 求出表达式1的值，若表达式1是逗号表达式，则依次计算；\n- (2) 对“表达式2”进行判断，为真转(3)，为假则退出循环；\n- (3)\
    \ 执行循环体中语句；\n- (4) 执行“表达式3”，若表达式3是逗号表达式，则依次计算；\n- (5) 转向(2)。\n\n### 例：将上面计算 10！的程序用\
    \ for 语句写出：\n\n```c\nmain()\n{\n    int i;  long sum=1;\n    for(i=1; i<=10; i++)\
