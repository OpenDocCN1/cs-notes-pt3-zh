  md: "\n## § 10.5 指针函数和函数的指针\n\n### 一、指针函数\n\n返回指针值的函数称作指针函数。\n\n指针函数定义函数首部的一般形式：\n\
    \n```\n类型名 *函数名（参数表）\n```\n\n含意：函数的返回值是一个指针，它指向所定义类型的数据。\n\n```\n例如： int *a(int\
    \ x, int y); /*函数原型声明*/\n含意：a是函数名，调用它以后能得到一个指向整型数据的指针（地址）。\n```\n\n### 例：编写能返回结果串地址的串拷贝函数。\n\
    \n```\n#include \"stdio.h\"\nmain()\n{ char *strcpy1(char* str1,char*str2);\n\
    \    char *ps, s1[80]=\"Tom is a boy\";\n    ps=strcpy1(s1,\"Jane is a girl\"\
    );\n    puts(ps);\n}\nchar *strcpy1(char *str1,char *str2)\n{  char *s=str1;\n\
    \    while(*str2) *str1++=*str2++;\n    *str1='\\0';\n    return s;\n}\n```\n\n\
    ### 二、函数的指针及指向函数的指针变量\n\n#### 1. 函数的指针（地址）概念\n\n每一个函数都占用一段内存，在编译时，被分配一个入口地址，这个入口地址就称为函数的指针。\n\
    \n#### 2. 指向函数的指针变量\n\n定义指向函数的指针变量的一般形式：\n\n```\n类型标识符 (*指针变量名)();\n```\n\n例如：\
    \ float (*p)();\n含意： 定义了 p 是指向函数的指针变量，函数的返回值是 float 类型。\n\n**注意：**（1）`(*p)()`表示定义一个指向函数的指针变量，它不是固定指向哪个函数。\n\
    （2）对指向函数的指针变量，`p+n`、`p++`、`p--`等运算是无意义的。\n（3）注意区别 `int (*p)()`、`int *p()`\n\n\
    #### 3. 对指向函数的指针变量赋值\n\n将一个函数的函数名（代表入口地址）赋值给指向函数的指针变量，也称该指针变量指向了这个函数。\n\n```\n\
    如：  int max(int x,int y); /*函数的原型声明*/\n      int (*p)();\n      p=max;\n```\n\n\
    **注意：**赋值时，只需给出函数名而不必给出参数。\n\n#### 4. 函数的调用\n\n- 函数的调用\n- 通过函数名调用函数\n- 通过指向函数的指针调用函数\n\
    \n当指向函数的指针变量p指向某一函数时（即指针变量p被赋值），调用函数的形式为：\n\n```\n（*p）（实参1，实参2，......）\n```\n\n\
    即，只需将（*p）代替函数名即可。\n\n```\n例如：若有定义 int max(int x,int y);\nint (*p)(),a,b,c ;\n\
    p=max;\n则可有语句 c=(*p)(a,b);\n```\n\n### 例：通过函数指针调用两个不同函数。\n\n```\n#include<math.h>\n\
    #define PI 3.1415926\ndouble y(double);\ndouble cos(double);\ndouble table(double\
    \ (*f)(), double, double, double);\n\nvoid main()\n{\n    printf(\"Table of y(x)=2*x*x-x+1\\\
    n\");\n    table(y,0.0,2.0,0.5);\n    printf(\"Table of cos(x)\\n\");\n    table(cos,0.0,PI,0.5);\n\
    }\n```\n\n```\ndouble table(double (*f)(), double min, double max, double step);\n\
    {double x,value;\n    for(x=min;x<=max;x+=step){\n    value=(*f)(x);\n    printf(\"\
    %5.2f  %10.4f\\n\", x, value);\n    }\n}\n\ndouble y(double x)\n{   return(2*x*x-x+1);}\n\
    \ndouble cos(double x)\n{   return(cos(x));}\n```\n\n## § 10.7 指针数组和指向指针的指针\n\n\
    ### 一、指针数组\n\n指针数组：就是数组中每个元素是基类型相同指针变量。\n\n定义指针数组的一般形式：\n\n```\n类型标识符 *指针变量名[常量表达式];\n\
    ```\n\n**例如：** `int *p[2];`\n\n**含意：** `p` 是一个一维指针数组，每个元素都是一个指向整型变量的指针变量。可以将整型变量的地址赋值给元素\
    \ `p[0]` 或 `p[1]`。\n\n**注意：** 区别 `int *p[2]`、`int (*p)[2]` 的含意。\n\n### 二、指针数组的应用\n\
    \n- 1. 利用指针数组处理多个字符串\n\n方法(1): 先用指针数组指向字符数组，再处理。\n\n```\nmain()\n{\n    char name[][80]={\"\
    aaa\",\"bbb\",\"ccc\",\"ddd\",\"eee\"};\n    char *pname[10], i ;\n    for(i=0;i<5;i++)\
    \ pname[i]=name[i];\n    for(i=0;i<5;i++) puts(pname[i]);\n}\n```\n\n```\nmain()\
    \ /*与用行指针解决上述问题比较*/\n{\n    char name[][80]={\"aaa\",\"bbb\",\"ccc\",\"ddd\",\"\
    eee\"};\n    char (*pname)[80]=name, i ;\n    for(i=0;i<5;i++) puts(pname[i]);\
    \ //pname[i]=pname+i\n}\n```\n\n### 方法(2)：用指针数组指向字符串常量。\n\n```\nmain()\n{\n  \
    \  char *pname[10]={\"aaa\",\"bbb\",\"ccc\",\"ddd\",\"eee\"};\n    int i ;\n \
    \   for(i=0;i<5;i++) puts(pname[i]);\n}\n```\n\n- 2. 用指针数组指向动态内存\n\nvoid指针类型介绍：\n\
    \nANSI新标准增加了void指针类型，它用于定义一个指针变量，但不指定它是指向哪种类型数据。在将它的值赋给另一个指针变量时要进行强制类型转换使之适合于被赋值的变量的类型。\n\
    \n```\n例如： char *p1; int a=2; void *p2;\np2=&a;\np1=(char *)p2;\n```\n\nvoid指针变量定义\n\
    \n强制类型转换\n\n同样，可用 p2=(void *)p1; 将p1的值转换成 void 指针类型。\n\n可以将一个函数定义为void 指针类型。表示该函数返回的是一个地址，它指向空类型，如需要引用此地址，也需要根据情况进行类型转换。\n\
    \n```\n如，库函数： void *malloc(unsigned size);\n功能：分配size字节的存储区。\n函数调用例： char *p;\
    \ p=(char *)malloc(60);\n```\n\n分配60字节的存储区，并返回该内存区的地址，并赋值给p。\n\n### 例：用指针数组指向动态内存，进行字符串的排序。\n\
    \n```\nvoid sort(char *ps[],int n);\n#define N 5\nmain()\n{\n    char *ps[100],i;\n\
    \    for(i=0;i<N;i++)\n        ps[i]=(char*)malloc(60);\n    for(i=0;i<N;i++)\n\
    \        gets(ps[i]);\n    sort(ps,N);\n    for(i=0;i<N;i++)\n        puts(ps[i]);\n\
    }\n```\n\n```\nvoid sort(char *ps[],int n)\n{\n    int i, k;\n    char *p, s[100];\n\
    \    for(i=0;i<n-1;i++)\n        for(k=i+1;k<n;k++)\n            if(strcmp(ps[i],ps[k])<0)\n\
    \            {\n                p=ps[i];\n                ps[i]=ps[k];\n     \
    \           ps[k]=p;\n            }\n}\n```\n\n### 三、指向指针的指针变量\n\n指向指针的指针变量（也称多级指针）只能存放指针变量的地址。\n\
    \n定义形式： 类型标识符 **指针变量名；\n\n```\n例如： int **q, *p, i=5;\n    p=&i; q=&p;\n```\n\n\
    含意：使指针变量p指向i，指针变量q指向p。\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_559_0.png)\n\
    \n注意：要使用一个多级指针指向目标值，必须连续使用指针运算符“*”。\n\n例如：上例中**q就是i的值。\n\n## § 10.8 指针的数据类型小结\n\
    \n| 定义 | 含义 | 名称 |\n|---|---|---|\n| `int *p;` | p为指向整型数据的指针变量 | 指针变量 |\n| `int\
    \ *p[n];` | 定义指针数组p，它有n个指向整型数据的指针元素 | 指针数组 |\n| `int (*p)[n];` | p为指向含n个元素一维数组的行指针变量\
    \ | 行指针变量 |\n| `int *p();` | p()为返回值为指针的函数（指针函数），该指针指向整型数据 | 指针函数 |\n| `int (*p)();`\
    \ | p为指向函数的指针，该函数返回一个整型值 | 指向函数的指针 |\n| `int **p;` | p是一个指针变量，它指向一个指向整型数据的指针变量\
    \ | 指向指针的指针 |\n"
