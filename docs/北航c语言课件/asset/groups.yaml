    ```

    例如：int *ptr1, *ptr2, i, j, k;


    double *q, *s, x, y, z;


    char *ch1, ch2, ch3[10];

    ```


    指针变量的类型：说明该指针所指向的变量的类型。

    Declaring the variable type to which the pointer is pointed.


    ## 在定义指针变量时要注意以下几个问题：


    (1) 变量名ptr2前面的“*”不能省略，如果写成

    int *ptr1, ptr2;

    则ptr2被定义为整型变量，而非整型指针变量。

    ptr2 is a integer variable.


    (2)定义中的“*”表示所定义的变量是指针变量，但指针变量名是ptr1、ptr2，而非*ptr1、*ptr2。

    ‘int *’ means to declare an integer pointer. The point variable name is ‘ptr1、ptr2’,
    but not ‘*ptr1、*ptr2’.


    (3)指针变量只能指向定义时所规定类型的变量。

    这个规定的类型称为该指针变量的“基类型”。

    The type of a pointer must match with the type of the variable to which the pointer
    is pointed. The type is called the ‘basic type’ of the pointer.


    如：上例中ptr1、ptr2只能指向整型变量，不能指向实型或字符型变量。其“基类型”相同，都是整型。


    (4)定义指针变量后，并未确定该变量指向何处。

    也就是说该变量的值是不确定的。在引用指针变量前必须首先让它指向一个变量，这一点非常重要。


