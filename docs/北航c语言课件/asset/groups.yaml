    - 2. 学习方式

    - 教师授课+上机实践+学生自学


    ## 三、课程特点


    - 1. 语言丰富、表达力强、功能强大

    - 2. 语言简洁、紧凑,使用方便、灵活

    - 3. 概念复杂、规则繁多、内容枯燥

    - 4. 语法限制不太严格，程序设计自由度大，容易出错

    - 5. 实践操作性很强,不仅要掌握理论知识，实验不容忽视

    - 6. 上机实验不仅可消化和巩固知识，也可验证学习中的疑难问题，激发和提高学习C程序设计的兴趣


    ## 四、要求


    - 1. 坚持出勤、认真听课，适当做笔记；课后看书、适当记忆。

    - 2. 认真进行上机编程训练，上机不允许做与课程无关的事情，按时、独立完成上机作业，不得抄袭、拷贝作业。

