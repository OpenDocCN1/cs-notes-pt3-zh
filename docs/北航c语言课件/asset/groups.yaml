    # 3. 表达式语句(Expression sentences)


    +   - 表达式：用运算符和括号将运算对象(操作对象)连接起来的、符合C语法规则的式子，称为表达式。

    +   - 表达式语句：由表达式加上“；”构成。

    +   - 表达式能构成语句是C语言的一个重要特色。C程序中的大多数语句（包括程序调用语句）是表达式语句，C语言又称为“表达式语言”。


    如： x+4*y;    算术表达式语句

    4*7, 4+8;    逗号表达式语句

    x=4*7;      赋值表达式语句(赋值语句)'
