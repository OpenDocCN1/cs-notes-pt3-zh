    \nmain\n\nroot函数\n\nxpoint函数\n\nf函数\n\n调用 root\n\n调用 xpoint\n\n调用 f\n\n输出根 x 结束\n\
    \n## 8.7 函数的递归调用\n\n定义：在一个函数的定义过程中直接或间接地调用该函数本身。\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_456_0.png)\n\
    \n说明：不应出现无终止的递归调用，因此，应该给定一个限制递归次数的条件。\n\n递归调用对应的一般算法：\n\nf(x) = {  结束公式  递归公式\
    \ }\n\n递归函数的执行过程：\n\n递归调用：记住本次现场，递归调用。\n\n结束调用：返回上次调用现场。\n\n## 例：用递归法求n!\n\n算法：\
    \ f(n)= { 1          (n=1)\n f(n-1)*n   (n>1) }\n\n```\nmain()\n{long jx(int);\n\
    \    int n;\n    long f;\n    printf(\"Input n :\");\n    scanf(\"%d\",&n);\n\
