    # 例3：对一个大于或等于3的正整数，判断它是不是一个素数。


    方法：将 n (n≥3) 作为被除数，将2 到 (n-1) 各个整数轮流作为除数，如果都不能被整除，则n为素数。


    算法表示如下：


    +   S1：输入n的值；


    +   S2：2 ⇒ i (i 作为除数)；


    +   S3：n 被 i 除，得余数 r；


    +   S4：如果 r 等于 0，表示 n 能被 i 整除，则打印 n “不是素数”，算法结束；否则执行 S5；


    +   S5：i+1 ⇒ i；


    +   S6：如果 i ≤ n-1, 返回 S3；否则打印 n “是素数”，算法结束。'
