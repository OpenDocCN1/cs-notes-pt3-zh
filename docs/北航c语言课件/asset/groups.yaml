    # § 13.1 C文件概述File in C


    # 一、文件的概念 Concept of the file


    文件：是指存储在外部介质上数据的集合。


    A file is a place on the disk where a group of related data is stored.


    操作系统是以文件为单位对数据进行管理的。每一个与主机相连的输入或输出设备都看作是一个文件。


    # 二、文件的存在形式及分类


    文件的存在形式：文件名+文件内容。


    文件内容：是一个字符(字节)序列，即由一个个字符(字节)的数据顺序组成。对文件的存取是以字符(字节)为单位的，这类文件称为流式文件。'
  - "[PAGE 583]\n\n# 文件的分类：File category\n\n根据数据在内存的组织形式不同可分为两类文件：\n\n+   1. ASCII\
    \ 码文件（文本文件）：文件的每一个字节放一个 ASCII 代码，代表一个字符。\n+   \n+      Text File\n\n+   2. 二进制文件：把内存中的数据按其在内存中的存储形式原样输出到文件上。\n\
    +   \n+      Binary File\n\n根据数据读写方式不同可分为两类文件：\n\n+   顺序存取文件\n+   随机存取文件\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_583_0.png)"
