    # 二、函数的返回值


    1. 定义： 通过函数调用使主调函数得到一个确定的值，称为函数的返回值。


    例如： c=max(3, 5);

    此时函数的返回值是5，因此c=5


    # 2. 函数的返回值语句 return


    函数的返回值是通过 return语句获得的。

    return语句将被调用函数的一个确定的值带回主调函数中去。 return语句的一般形式：


    ```

    return(函数返回值);

    ```


    ```

    return 函数返回值;

    ```


    “函数返回值”是有确定值的常量、变量或表达式。'
