    # 4. 函数的调用


    +   函数的调用

    +   - 通过函数名调用函数

    +   - 通过指向函数的指针调用函数


    当指向函数的指针变量p指向某一函数时（即指针变量p被赋值），调用函数的形式为：


    ```

    （*p）（实参1，实参2，......）

    ```


    即，只需将（*p）代替函数名即可。


    ```

    例如：若有定义 int max(int x,int y);

    int (*p)(),a,b,c ;

    p=max;

    则可有语句 c=(*p)(a,b);

    ```'
