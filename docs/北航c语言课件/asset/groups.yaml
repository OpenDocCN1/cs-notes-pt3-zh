    # 说明：


    (1) return 后面的值可以是一个表达式，例如：


    ```

    z=x>y? x:y;

    return(z);

    ```


    ```

    return (x>y? x:y);

    ```


    (2)一个函数中可以有多个return语句，但是一次函数执行只能执行其中的一个。当执行到某个return语句时，则终止函数执行，并带回函数值。


    (3)若函数体内没有return语句，就一直将函数执行完，再返回调用函数，有一个不确定的值带回。


    (4) return后面可以无“返回值”（即 return ; ），则该return语句只起到终止函数执行，返回主调函数的作用。'
