    # 三、带参数的宏替换与函数的主要区别


    +   (1) 函数调用时，先求出实参表达式的值，然后代入形参。而使用带参数的宏只是进行简单的字符替换。

    +   (2) 函数调用是在程序运行时处理的，分配临时的内存单元。而宏替换则是在编译时进行的，在展开时并不分配内存单元，不进行值的传递处理，也没有“返回值”的概念。

    +   (3) 宏替换不占运行时间，只占编译时间，而函数调用则占运行时间。

    +   (4) 函数中函数名及参数均有一定的数据类型，而宏不存在类型问题，宏名及其参数无类型。'
