    “&”(取地址运算符)：取变量的存储地址


    The & operator can be remembered as ‘address of’, its function is to access the
    address of a variable.


    例如： &a 是求变量a的地址。

    &a is evaluating the address of argument ‘a’


    “*”(取值运算符)：取指针所指向变量的内容


    The * can be remembered as ‘value at address’. its function is to access the value
    of a variable to which the pointer is pointed.

