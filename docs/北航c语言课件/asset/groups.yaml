    # 三、文件的基本操作


    +   (1) 打开文件： 把文件名等目录信息从磁盘上读入内存并存入结构体。

    +   (2) 关闭文件： 把内存结构体中的文件名等目录信息写入磁盘。

    +   (3) 写文件： 向文件写内容。

    +   (4) 读文件： 从文件读内容。


    # 四、文件的输入输出方式


    C语言对文件进行处理分为：


    +   非缓冲文件系统 no buffer file system

    +   缓冲文件系统 buffer file system'
