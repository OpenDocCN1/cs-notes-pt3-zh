    \n```\ninput number a,b,c:\n  6, 5, 1\nMAX: 6\n```\n\n## 第二章 算法简介及程序的基本结构\n\n\
    本章要点：\n\n- 了解算法的基本概念\n- 掌握程序的基本结构\n\n程序=数据结构+算法+程序设计方法+编程语言\n\n## 2.1 算法的概念\n\n\
    对特定问题求解步骤的一种描述(algorithm)\n\n计算机算法：\n\n- 数值算法，有模型，比较成熟，数学程序库\n- 非数值算法，种类繁多，难以规范\n\
    \n## 2.2 简单算法举例（用自然语言描述法）\n\n### 例1. 有50个学生，要求将他们之中成绩在80分以上的学号和成绩打印出来。\n\n用 n\
    \ 表示学号，n₁ 代表第一个学生学号，nᵢ 代表第 i 个学生学号。用 g 代表学生成绩，gᵢ 代表第 i 个学生成绩，算法可表示如下：\n\n- S1：1\
    \ ⇒ i\n- S2：如果 gᵢ ≥ 80，则打印 nᵢ 和 gᵢ，否则不打印\n- S3：i + 1 ⇒ i\n- S4：如果 i ≤ 50，返回 S2，继续执行；否则，算法结束。\n\
    \n### 例2 将学生百分成绩按分数段分级的程序。\n\n该算法的核心部分是对输入的每一个数进行比较判断，以确定所属的级别。算法描述如下：\n\n- S1:\
    \ 1⇒i\n- S2: \n- S3: i+1 ⇒i\n- S4: 如果i ≤ num，返回S2；否则，算法结束。\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_46_0.png)\n\
    \n第二种算法如下：\n\n![](img/7e3448331bc3f721cf3127b2b2f06002_47_0.png)\n\n| 分数 | 0—59\
