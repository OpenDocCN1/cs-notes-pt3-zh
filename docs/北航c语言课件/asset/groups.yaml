  md: "\n## 习题6.11（看书P120~P121）\n\n已知：正数a和求a的算术平方根x的公式。\n求：a的算术平方根x。\n\n- 算法：\n① 从键盘上输入a，并假设a的第一个根为x=a；误差标志变量dx。\n\
    ② 重复做：\n　　记下上一个根x0=x；\n　　按公式求下一个根x；x=(x+a/x)/2；\n　　求两个根的误差绝对值dx=fabs(x-x0)。\n\
    ③ 当两次求得的根之差的绝对值（精度）dx<=0.00001时停止。X即为所求平方根。\n\n```c\n#include \"math.h\"\nmain()\n\
    {\n    float a, x, x0, dx;\n    printf(\"\\n a=\");\n    scanf(\"%f\",&a);\n \
    \   x=a;\n    do\n    {\n        x0=x; //上次求出的根\n        x=(x+a/x)/2; //本次求出的根\n\
    \        dx=fabs(x- x0);\n    }while(dx>0.00001);\n    printf(\"\\n x=%f\",x);\n\
    }\n```\n\n## 要牢记\n\n- 1. 勿忘在do...while语句后使用分号；\n- 2. 在for语句的头表达式中使用逗号将产生错误；\n\
