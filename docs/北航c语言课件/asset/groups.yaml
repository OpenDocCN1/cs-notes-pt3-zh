    \ 比例 | 0.05 | 0.15 | 0.4 | 0.3 | 0.10 |\n\n### 例3：对一个大于或等于3的正整数，判断它是不是一个素数。\n\n\
    方法：将 n (n≥3) 作为被除数，将 2 到 (n-1) 各个整数轮流作为除数，如果都不能被整除，则 n 为素数。\n\n算法表示如下：\n\n- S1：输入\
    \ n 的值；\n- S2：2 ⇒ i (i 作为除数)；\n- S3：n 被 i 除，得余数 r；\n- S4：如果 r 等于 0，表示 n 能被 i 整除，则打印\
    \ n “不是素数”，算法结束；否则执行 S5；\n- S5：i+1 ⇒ i；\n- S6：如果 i ≤ n-1，返回 S3；否则打印 n “是素数”，算法结束。\n\
    \n### 例4: 求 1-1/2 + 1/3 −1/4 +...+ 1/99 −1/100。\n\n- S1: 1 ⇒ sign //设置符号变量第1项为+\n\
    - S2: 1 ⇒ sum //设置和变量等于第1项\n- S3: 2 ⇒ deno //设置分母变量\n- S4: (-1)*sign ⇒ sign //i+1项的符号=(-1)*i项符号\n\
    - S5: sign*(1/deno) ⇒ term //计算级数第i+1项的值\n- S6: sum+term ⇒ sum //累加\n- S7: deno+1\
    \ ⇒ deno //下一项分母的值\n- S8: 若 deno ≤100 返回 S4; //给出累加结束条件\n  否则算法结束。\n\n请思考：\n\n\
    如果第一项的值必须计算，则 sum 必须设初值\n\n- 1) 对于求和， sum 的初值应设为多少？\n- 2) 对于求阶乘， sum 的初值应设为多少？\n\
    \n## 2.3 算法的特性\n\n算法的五个特性：\n\n- 有穷性：一个算法必须在执行有穷步之后结束。\n- 确定性：算法的每一步必须是确切定义的，对于相同输入必须得到相同结果。\n\
    - 有效性：算法的每一步都是能够实现的，即可操作的。\n- 输入：算法有零个或多个输入。\n- 有输出：算法执行完毕，必须有一个或若干个输出结果。\n\n\
