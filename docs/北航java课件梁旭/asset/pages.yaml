    { //接口体\n    [public] [static] [final] 域类型 常量名=常量值;\n    //常量域声明，可为多个\n    [public]\
    \ [abstract] [native] 返回值类型 方法名 ([参数列表]) [throws 异常列表];\n    //抽象方法声明，可为多个\n}\n\
    ```"
