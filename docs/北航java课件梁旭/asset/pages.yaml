  md: '# 7.4.2 动画制作


    +   原理：连续输出一系列帧（图片），利用人眼的视觉暂停来造成运动的感觉。（电影胶片是 24帧/秒）


    +   Java动画的两大要素：

    +   - 动画图片

    +   - 播放速度


    +   动画图片：多用Image数组存放，图片名要事先准备好。


    +   播放速度：利用多线程功能实现(java.lang.Thread包)

    +   - 在程序public class中实现Runnable接口。

    +   - 建立一个Thread对象。

    +   - 实现run()方法：图片的循环播放和暂停。

    +   - 实现paint()方法：输出一副帧（图形）。'
