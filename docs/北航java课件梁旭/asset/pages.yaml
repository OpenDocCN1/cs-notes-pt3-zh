  md: '# 3. 构造方法的继承


    +   - 在创建子类的对象时，使用子类的构造方法对其初始化，不但要对自身的成员变量赋初值，还要对父类的成员变量赋初值。

    +   - Java中允许子类继承父类的构造方法。继承原则有三条。'
  merge: -1
