- pgno: 37
  md: '# 2.6 简单的输出与输入


    +   2、字符串输入


    +   I、利用标准IO流方法


    ```

    try{

    BufferedReader in =

    new BufferedReader (new InputStreamReader(System.in));

    String s = in.readLine(); //从键盘读取一个字符串

    }

    catch (IOException ex) {System.out.println(ex);} //异常处理

    System.out.println(s); //打印输出前面输入的字符串

    ```


    +   II、利用命令行参数的方法


    在main(String args[])方法的参数数组记录的是命令行所有参数，每个参数为一个数组元素，数组大小取决于参数个数。可以用这种方法获得字符串输入，命令行参数间用空格隔开。


    ```

    System.out.println(args[0]+''&''+args[1]); //输出前面输入的命令行参数字符串

    ```'
  merge: -1
  img_proc: true
