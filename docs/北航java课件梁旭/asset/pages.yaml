- pgno: 271
  md: '# 10.1 输入/输出流概述


    # 10.1.1 输入/输出流的概念


    +   - 流：计算机中流动的数据缓冲区，分：

    +     - 输入流：从外设流向CPU，数据提供者，可从中读取数据出来，如键盘；

    +     - 输出流：从CPU流向外设，数据接收者，可往其中写数据，如显示器；

    +     - 特：文件，当向其中写数据时，它就是一个输出流；当从其中读取数据时，它就是一个输入流。


    +   - Java中的所有输入输出，都通过流完成。


    +   - 流就像一个管道，连通了信息的源及其目的地。'
  merge: -1
  img_proc: true
