- pgno: 140
  md: '# 6.3.1 接口的声明


    +   由接口声明的语法格式可以看出，接口是一种由常量和抽象方法组成的特殊的类。Java中一个类只有一个父类，但是它可以同时实现若干个接口，这种情况如果把接口理解为特殊类，则这个类利用接口实现了多重继承。


    +   注：


    +   （1）interface是定义接口的关键字。


    +   （2）接口名只要符合Java对标识符的规定即可。


    +   （3）接口的访问控制符只有一个public,用此修饰的接口为公共接口，可以被所有类和接口使用，否则只能被同一个包中的其他类和接口使用。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 6.3.1 接口的声明


    （4）接口具有继承性。定义一个接口时可通过extends声明该新接口是某个已存在的父接口的派生接口（子接口），它将继承父接口的所有属性和方法。与类不同的是一个接口可以有一个以上的父接口，它们之间用“，”隔开，形成父接口列表。新接口将继承所有父接口中的属性和方法。如果在子接口中定义了和父接口同名的常量或方法，则父接口中的常量被隐藏，方法被重写。


    （5）接口体的声明是定义接口的重要部分。接口体由两部分组成，一部分是对接口中属性的声明，另一部分是对接口中方法的声明。


    （6）接口中的所有属性都必须是public static final修饰的，这是系统默认的规定。所以接口属性也可以没有任何修饰符，其效果完全相同。


    （7）接口中的所有方法都必须是抽象方法。'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 6.3.3 接口的实现


    +   - 含义：为具体实现接口所规定的功能，则需要某个类为接口的抽象方法书写语句并定义实在的方法体，称为接口的实现。

    +   - 类要实现某个或某几个接口时的步骤和注意：

    +   - （1）在类的声明部分，用implements关键字声明该类将要实现哪些接口。

    +   - （2）如果实现某接口的类不是abstract类，则在类的定义部分必须实现指定接口的所有抽象方法，即为所有抽象方法定义方法体，而且方法头部分应该与接口中的定义完全一致，即有完全相同的返回值和参数列表。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 6.3.3 接口的实现


    +   （3）如果实现某接口的类是抽象类，则它可以不实现该接口所有的方法，但是对于这个抽象类任何一个非抽象的子类而言，它们父类所实现的接口中所有抽象方法都必须有实在的方法体。这些方法体可以来自抽象的父类，也可以来自于类本身，但是不允许存在未被实现的接口方法。


    +   （4）一个类在实现某接口的抽象方法时，必须使用完全相同的方法头。如果所实现的方法与抽象方法有相同的方法名和不同的参数列表，则只是一个新的方法，而不是实现已有的抽象方法。


    +   （5）接口的抽象方法，其访问限制符都已指定是 **public**，所以类在实现方法时，必须显式地使用 **public** 修饰符，否则将被系统警告为缩小了接口定义的方法和访问控制范围。'
  merge: -1
