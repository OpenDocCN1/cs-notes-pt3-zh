  md: '# 5.3.4 清除对象


    java运行使系统有一个垃圾回收进程负责清除不再使用的对象。


    # 垃圾回收器


    +   1. 垃圾回收器定期扫描内存，对于被应用的对象加上标记，按可能的路径扫描结束后清除未加标记的对象。

    +   2. 被回收的对象是：

    +      1. 不再被任何引用变量引用的对象

    +      2. 引用变量自动放弃

    +      3. 人为地将引用变量置为null

    +   3. 当系统的内存用尽或程序中调用System.gc()要求进行垃圾收集时，垃圾收集线程与系统同步运行。否则垃圾收集器在系统空闲时异步地执行。'
