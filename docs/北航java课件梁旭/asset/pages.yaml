- pgno: 312
  md: '# 11.1.3 线程的状态和生命周期


    +   - 线程的生命周期：一个线程从创建到消亡的过程。

    +   - 线程的生命周期可分为5个状态：

    +     1. 新建状态

    +     2. 可运行状态

    +     3. 运行状态

    +     4. 不可运行状态

    +     5. 死亡状态


    ![](img/b58cead0522d3247058937ec2b7b313c_312_0.png)'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 11.1.3 线程的状态和生命周期


    +   - 新建状态（new Thread）


    +   - 当创建了一个新的线程时（ myThread thd = new myThread(); ），它就处于创建状态，此时它仅仅是一个空的线程对象，系统不为它分配资源。处于这种状态时只能启动或终止该线程，调用除这两种以外的其它线程状态相关的方法都会失败并且会引起非法状态例外
    illegalThreadStateException （对于其它状态，若所调用的方法与状态不符，都会引起非法状态例外）。'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 11.1.3 线程的状态和生命周期


    +   - 可运行状态（Runnable）

    +   - 当线程处于创建状态时，可以调用start()方法（thd.start();）来启动它，产生运行这个线程所需的系统资源，安排其运行，并调用线程体run()方法，这样就使得该线程处于可运行（Runnable）状态。

    +   - 需要注意的是这一状态并不是运行中状态（Running），因为线程也许实际上并未真正运行（Ready）。'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 11.1.3 线程的状态和生命周期


    +   - **运行状态(Running)**

    +   - 当可运行状态的线程获得CPU资源时，即实际被CPU运行，这是线程的状态被称为运行状态。线程进入运行状态就会调用该线程对象的RUN()方法，RUN()方法定义该线程所要完成的操作和功能。'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 11.1.3 线程的状态和生命周期


    +   - 不可运行状态（Not Runnable）

    +   - 线程处于可运行状态时，当下面四种情况发生，线程就进入不可运行状态：

    +     - 调用了 sleep() 方法，睡眠；

    +     - 调用了 suspend() 方法，挂起；

    +     - 为等候一个条件变量，线程调用 wait() 方法；

    +     - 输入输出流中发生线程阻塞，费时操作。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 11.1.3 线程的状态和生命周期


    +   - 死亡状态（Dead）

    +   - 线程的终止一般可通过两种方法实现：

    +     - 自然撤消是指从线程的 run() 方法正常退出；

    +     - 被停止：调用线程的实例方法 stop() 或 destroy() 则可以强制停止当前线程，前者会产生异常（SecurityException），后者是强制终止。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 11.1.4 线程的调度和优先级


    +   - Java提供一个**线程调度器**来监控程序中启动后进入可运行状态的所有线程。

    +   - 线程调度器依据**优先级基础上的先到先服务**原则：按照线程的优先级决定调度哪些线程来执行。具有高优先级的线程会在较低优先级的线程之前得到执行。

    +   - 同时线程的调度是**抢先式**的，即如果当前线程在执行过程中，一个具有更高优先级的线程进入可执行状态，则该高优先级的线程会被立即调度执行。

    +   - 多个线程运行时，若线程的优先级相同，按**先到先服务**原则，由操作系统按**分时方式**（时间片轮转）或**独占方式**来分配线程的执行时间。'
  merge: -1
  img_proc: true
