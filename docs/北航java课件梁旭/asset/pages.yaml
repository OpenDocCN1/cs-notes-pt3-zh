  md: '# 9.2 异常处理


    异常处理方法：


    +   1. 使用 try-catch-finally 语句捕获处理异常

    +   2. 通过 throws 和 throw 子句抛出(声明)异常'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 9.2.1. try-catch-finally语句


    +   - 用try-catch-finally语句来捕获一个或多个异常

    +   - 基本格式为：


    ```

    try { 可能发生异常的程序代码 }

    catch (异常类型1 异常对象名1)

    {异常处理代码}

    catch (ExceptionType2 ExceptionObject2)

    { Exception Handling }

    ……

    finally { 必然要执行的代码 }

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# try-catch-finally语句说明：


    +   - try {...}：定义可能产生异常的代码段。

    +     如果出现异常，程序中断运行，并抛出该异常产生的对象。


    +   - catch (Etype e){...}: 用于捕获一个异常。

    +     当try抛出异常对象时，catch识别，如果与catch语句参数中声明的异常类相同或是它的子类对象时，捕获这个异常对象，显示简短信息，处理。注意捕获顺序--先子后父。


    +   - finally {...}: 用于做统一的事后处理，如释放资源，必然会被执行的代码。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 9.2.2 throw语句和throws语句


    +   - 抛出异常的两种方式：

    +   - throw： 程序中通过此语句抛出异常，同时在该方法中解决抛出的异常。

    +   - throws： 在声明方法时使用，抛出但不捕获异常，让调用该方法的其他方法捕获异常。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 1. throw语句


    +   - **格式：**

    +     `throw e; //e为异常类对象`


    +   - 抛出异常，同时在该方法中解决抛出的异常：`try{...}中抛出，catch{...}中解决。`


    +   - 异常抛出点后的代码在抛出异常后不再执行，即异常的抛出终止了代码段的执行。'
  merge: -1
