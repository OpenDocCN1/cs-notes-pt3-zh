  md: '# 2.3 基本数据类型


    +   一、整型数据：Long, int(默认), short, byte;


    +   数值进制：

    +   - 十进制：非0开头,如：4, -15;

    +   - 八进制：以0开头，如：054;

    +   - 十六进制：以0x开头，如：0x12AF;


    +   存储空间：

    +   - byte在机器中占8位，short占16位，int占32位，long占64位。

    +   - 64位长整数以l或L结尾

    +     - 没有以l或L结尾的数字，根据其实际值所属范围，可以被用作byte, short, 或int型整数

    +     - 以l或L结尾的数字，无论其实际值所属范围怎样，都被用作long型整数'
