  md: '# 11.3 多线程操作


    # 11.3 线程的死锁


    +   - 当一个线程需要一个资源而另一个线程持有该资源而不释放时，就会发生死锁。

    +   - Java技术既不能发现死锁，又不能避免死锁。注意死锁，尽量避免。

    +   - 死锁是资源的无序使用而带来的，解决死锁问题的方法就是给资源施加排序。


