- pgno: 169
  md: '# # Applet的6个主要方法


    # ## Applet的方法


    +   - `public void init()`

    +     - 当Applet创建时调用，第一次运行Applet时调用；

    +     - 可以被用来初始化数据：对参数进行处理以及增加用户界面组件；

    +   - `public void start()`

    +     - 当applet变成可见时调用，在init()调用之后；

    +     - 会被多次调用，实现需多次调用的代码，以及在用户离开当前页面时需要挂起的操作；

    +   - `public void stop()`

    +     - 当applet变成不可见时调用，在用户离开对应页面前调用，可多次调用；一般不直接调用该方法；

    +     - 实现某些耗时操作（动画、音视频、计算等），在用户离开页面时，可停止那些耗时操作，节约系统资源。'
  merge: -1
  img_proc: true
