  md: '# 10.1.3 标准输入/输出流


    +   - 语言包 java.lang 中的 System 类管理标准输入/输出流和错误流。

    +   - **System.in**，从 InputStream 中继承而来，用于从标准输入设备中获取输入数据（通常是键盘）。

    +   - **System.out**，从 PrintStream 中继承而来，把输出送到缺省的显示设备（通常是显示器）。

    +   - 每当 **main** 方法被执行时，就自动生成上述两个对象。'
