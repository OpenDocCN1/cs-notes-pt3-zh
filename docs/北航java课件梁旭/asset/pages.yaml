- pgno: 129
  md: '# 继承原则：


    +   1. 若父类是无参数的构造方法，则子类无条件的继承该构造方法。


    +   2. 若子类无自己的构造方法，则它将继承父类的无参数构造方法作为自己的构造方法；若子类有自己的构造方法，则在创建子类对象时，它将先执行继承自父类的无参数构造方法，然后执行自己的构造方法。


    +   3. 若父类是有参数的构造方法，子类可以通过在自己的构造方法中使用 `super` 关键字来调用它，但这个调用语句必须是子类构造方法的第一个可执行语句。


    +   例：6.2'
