- pgno: 305
  md: '# 11.1 多线程概述


    +   - 以前所编写的程序，每个程序都有一个入口、一个出口以及一个顺序执行的序列，在程序执行过程中的任何指定时刻，都只有一个单独的执行点，即单线程。

    +   - 一个线程是一个程序内部的一个顺序控制流。

    +   - 线程并不是程序，它自己本身并不能运行，必须在程序中运行。在一个程序中可以实现多个线程，这些线程同时运行，完成不同的功能，这就是所谓的**多线程**。'
  merge: -1
  img_proc: true
