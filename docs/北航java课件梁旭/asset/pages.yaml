    +   - 复杂的异常，无法避免，需要使用JAVA的异常处理机制来处理。


    +   - **JAVA的异常处理机制：**


    +   - 用面向对象的方法处理异常，一个异常事件由一个异常类的对象来代表。所有的异常都是以类的类型存在，除了内置的异常类之外，也可自行定义异常类。允许抛出异常，保证程序允许。'
