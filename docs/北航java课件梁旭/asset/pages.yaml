  md: '# 6.3 接口


    # 6.3.1 接口的概念


    +   接口（界面）：是用来组织应用中的各类并调节它们的相互关系的一种结构，是用来实现类间多重继承的结构。


    +   接口是一种特殊的类，它是方法定义（没有方法的实现）和常量值的集合。


    +   多重继承：一个子类可以有一个以上的直接父类，该子类可继承它所有直接父类的成员。'
