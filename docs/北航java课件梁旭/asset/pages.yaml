- pgno: 307
  md: '# 11.1.1 与线程有关的概念


    +   - **程序**(program)是对数据描述与操作的一段静态代码的集合，是应用程序执行的依据。

    +   - **进程**(process)是程序的一次动态执行过程，是系统运行程序的基本单位。

    +   - **线程**(Thread)是比进程更小的执行单位，是一个程序内部的顺序控制流。

    +   - **多线程**：一个程序中可以同时运行多个不同的线程，执行不同的任务。'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 11.1.1 与线程有关的概念


    +   - **多线程意义：** 一个程序的多行语句在多处理器下可以同时运行，而在单处理器下分时运行，提高程序的运行效率。

    +   - **多线程与多进程的区别：**

    +     - 内存空间与系统资源共享

    +     - 相互切换时，系统负担小

    +   - **多线程编程的目的：** 最大限度地利用 CPU资源。

    +     - CPU发展： 速度更快，多核。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 11.1.2 Java中的线程模型


    +   - **多线程的优势：**

    +   - 多线程编程简单，效率高（能直接共享数据和资源，多进程不能）

    +   - 适合于开发服务程序（如Web服务，聊天服务等）

    +   - 适合于开发有多种交互接口的程序（如聊天程序的客户端，网络下载工具）

    +   - 适合于有人机交互又有计算量的程序（如字处理程序 Word，Excel）

    +     - 减轻编写交互烦繁、涉及面多的程序的困难（如监听网络端口）

    +     - 程序的吞吐量会得到改善（同时监听多种设备，如网络端口、串口，并可以及其他外设）

    +     - 有多个处理器的系统，可以并发运行不同的线程（否则，任何时刻只有一个线程在运行）'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 11.1.2 Java中的线程模型


    对多线程的综合支持是Java语言的一个重要特征，它提供了Thread类来实现多线程。在Java中，线程可以认为是由三部分组成的：


    +   - 虚拟CPU，封装在java.lang.Thread类中，它控制着整个线程的运行；

    +   - 执行的代码，传递给Thread类，由Thread类控制顺序执行；

    +   - 处理的数据，传递给Thread类，是在代码执行过程中所要处理的数据。'
  merge: -1
