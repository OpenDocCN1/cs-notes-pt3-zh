  md: '# 5.2.3 类的构造函数


    +   - 创建类的对象时，利用 new 关键字和一个与类同名的方法来完成，这个方法就是构造函数。

    +   - 构造函数:类中用来初始化新建的对象的 方法。

    +   - 构造函数特点：

    +     （1）构造函数名与类名相同；

    +     （2）没有返回值类型；

    +     （3）主要作用是完成对类对象的初始化操作。

    +     （4）不能由编程人员显式的直接调用，在创建一个类 的新对象的同时，系统会自动调用该类的构造函数为新对象初始化。

    +     （5）每一个类可以有零个或多个构造函数。当一个类定义多个构造函数时，称构造方法的重载。

    +   - 变量和方法称为类的成员（成员变量和成员方法），而构造函数不是类的成员。'
