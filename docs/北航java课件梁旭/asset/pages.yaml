  md: '# 2.2 Java的数据类型


    # 一、数据类型的分类


    +   - 基本（简单）数据类型：整数、浮点、字符、布尔类型；占用存储空间固定。

    +   - 引用（复合）数据类型：类、接口、数组；数据存储取决于数据类型的定义。


    | 数据类型 | 所占位数 | 所占字节 | 默认值 | 数的范围 |

    |---|---:|---:|---|---|

    | char | 16 | 2 | `\u0000` | 0～65535 |

    | byte | 8 | 1 | 0 | -2^7～2^7-1 |

    | short | 16 | 2 | 0 | -2^15～2^15-1 |

    | int | 32 | 4 | 0 | -2^31～2^31-1 |

    | long | 64 | 8 | 0L | -2^63～2^63-1 |

    | float | 32 | 4 | 0.0F | 3.4e-038～3.4e+038 |

    | double | 64 | 8 | 0.0D | 1.7e-308～1.7e+308 |

    | boolean | 8 | 1 | false | true, false |'
  merge: -1
