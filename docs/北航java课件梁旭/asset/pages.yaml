- pgno: 258
  md: '# 9.1.3 异常处理机制


    抛出和处理错误机制：


    +   1. 抛出（Throw）异常： JAVA程序运行过程中如果出现异常，会自动生成一个异常类对象，该对象将被提交给JAVA运行时环境。


    +   2. 捕获（Catch）异常： JAVA运行时环境接收到一个异常对象时，会寻找能处理这一异常的代码，并把当前异常对象交给它处理。如果找不到可以捕获异常的方法，则运行时环境将终止，相应的JAVA程序退出。


    +   3. 异常类的常用方法。 P205'
  merge: -1
  img_proc: true
