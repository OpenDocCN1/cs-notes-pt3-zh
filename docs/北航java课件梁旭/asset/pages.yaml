- pgno: 122
  md: '# 6.1.1 继承的概念


    +   - 定义：继承是程序中两个类间的一种关系，在定义一个类时，如果指明了类A继承了类B（B已存在），则类A通常就拥有了类B的成员属性和成员方法，此时称类A和类B间具有继承的关系。

    +   - 直接父类（直接超类）：被继承的类B称为类A的直接父类。父类包括所有直接或间接被继承的类。

    +   - 子类、次类、衍生类：继承于父类的类。子类继承父类的状态和行为，同时也可以修改父类的状态或重写父类的行为，并添加新的状态和行为。'
  merge: -1
