  md: '# 10.1.2 I/O流类


    +   1. InputStream类

    +   - InputStream类层次关系图，图10.2。

    +   - 缓冲区：数据传输时，用来暂存数据的存储区域

    +   - 主要方法：

    +     - read(): 从流中读入数据

    +     - skip(): 跳过流中若干字节数

    +     - available(): 返回流中可用字节数

    +     - close(): 关闭流

    +   - read()方法的三种形式：'
