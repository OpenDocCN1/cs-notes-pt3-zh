- pgno: 337
  md: '# 12.3 TCP Socket通信


    无论一个Socket通信程序的功能多么齐全、程序多么复杂，其基本结构都是一样的，都包括以下四个基本步骤：


    +   - 1、在客户端和服务器方创建Socket/ServerSocket实例。

    +   - 2、打开连接到Socket的输入/输出I/O流。

    +   - 3、利用I/O流，按照一定的协议对Socket进行读写操作。

    +   - 4、关闭输入/输出流和Socket。


    通常，程序员的主要工作是针对所要完成的功能在第3步进行编程。'
