  md: '# 2.5　运算符和表达式


    # 四、位运算符和位表达式


    +   - 移位运算符：`>>` 带符号右移（空位补最高符号位），`<<` 带符号左移（符号位不变，右边补0），`>>>` 不带符号右移（左边空位补0）。

    +   - 按位逻辑运算：`&` 与，`|` 或，`^` 异或，`~` 取反。


    # 几种语言位运算符号比较。


    | 运算符 | Java | C/C++ | Delphi | VBasic |

    |---|---|---|---|---|

    | 与 | `&` | `&` | `and` | `and` |

    | 或 | `~` | `~` | `not` | `not` |

    | 取反 | `|` | `|` | `or` | `or` |

    | 异或 | `^` | `^` | `xor` | `xor` |

    | 左移 | `<<` | `<<` | `Shl` | 无 |

    | 右移 | `>>` | `>>` | `Shr` | 无 |'
