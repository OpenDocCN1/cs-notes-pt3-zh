- pgno: 152
  md: '+   - 信息系统定级阶段

    +     用于指导信息系统运营使用单位按照国家有关管理规范和《信息系统安全等级保护定级指南》，确定信息系统的安全保护等级。

    +   - 总体安全规划阶段

    +     用于指导信息系统运营使用单位根据信息系统定级情况，在分析信息系统安全需求基础上，设计出科学、合理的信息系统总体安全方案，并确定安全建设项目规划，以指导后续的信息系统安全建设工程实施。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 安全设计与实施阶段内容


    用于指导信息系统运营使用单位按照信息系统安全总体方案的要求，结合信息系统安全建设项目计划，进行安全方案详细设计，实施安全建设工程，落实安全保护技术措施和安全管理措施。


    # 安全运行与维护阶段内容


    用于指导信息系统运营使用单位通过实施操作管理和控制、变更管理和控制、安全状态监控、安全事件处置和应急预案、安全评估和持续改进、等级测评以及监督检查等活动，进行系统运行的动态管理。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 信息系统终止阶段内容


    用于指导信息系统运营使用单位在信息系统被转移、终止或废弃时，正确处理系统内的

    重要信息，确保信息资产的安全。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 3.2.2如何确定信息系统等级


    等级确定的原则


    +   - 满足国家管理要求原则


    信息系统安全保护等级既不是信息系统安全保障等级，也不是信息系统所能达到的技术能力等级，而是从国家管理的需要出发，从信息系统对国家安全、经济建设、公共利益等方面的的重要性，以及信息或信息系统被破坏后造成危害的严重性角度确定的信息系统应达到的安全等级。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 全局性原则


    信息系统安全等级保护是针对全国范围内、涵盖各个行业信息系统的管理制度信息系统安全保护等级的划分也必须从国家层面考虑，体现全局性


    # 业务为核心原则


    信息系统是为业务应用服务的，信息系统的安全保护等级应当依据信息系统承载业务的重要性、业务对信息系统的依赖度和系统特殊的安全需求确定。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 合理性原则


    不同于信息安全产品，信息系统千差万别，各具特色，只有在划分安全保护等级的过程中，尽可能反映出信息系统的主要安全特征，合理划分等级，才能做到突出重点，适度保护。'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 决定等级的主要因素分析


    以在不同分级方法中出现的作为划分信息系统安全等级的因素主要包括：


    +   - 业务系统在国家事务中的重要性（实施意见）；

    +   - 资产（包括有形资产和无形资产）（FIPS199, IATF, DITSCAP, NIST800-37）；

    +   - 威胁（IATF）；

    +   - 信息被破坏后对国家、社会公共利益和单位或个人的影响（FIPS199, 通用要求, 实施指南）；

    +   - 业务对信息系统的依赖程度（DITSCAP）'
  merge: -1
  img_proc: true
- pgno: 159
  md: '划分等级时应考虑以下因素：


    +   - 系统所属类型，即信息系统的安全利益主体。

    +   - 信息系统主要处理的业务信息类别。

    +   - 系统服务范围，包括服务对象和服务网络覆盖范围。

    +   - 业务依赖程度程度，或以手工作业替代信息系统处理业务的程度

    +   - 其中第1、2个要素决定信息系统内信息资产的重要性，第3、4个要素决定信息系统所提供服务的重要性，而信息资产及信息系统服务的重要性决定了信息系统的重要性'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 定级指南


