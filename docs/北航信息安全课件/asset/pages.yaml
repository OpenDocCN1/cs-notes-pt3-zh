- pgno: 9
  md: '# 路由控制机制


    +   - 在一个大型网络中，从源节点到目的节点可能有多条线路，有些线路可能是安全的，而另一些线路是不安全的。

    +   - 路由控制机制可使信息发送者选择特殊的路由，以保证数据安全。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 公证机制


    在一個大型網絡中，有許多節點或端節點。在使用這個網絡時，並不是所有用戶都是誠實的、可信的，同時也可能由於系統故障等原因使信息丟失、遲到等，這很可能引起責任問題，為了解決這個問題，就需要有一個各方都信任的實體——公證機構，如同一個國家設立的公證機構一樣，提供公證服務，仲裁出現的問題。


    一旦引入公證機制，通信雙方進行數據通信時必須經過這個機構來轉換，以確保公證機構能得到必要的信息，供以後仲裁。'
  merge: -1
  img_proc: true
