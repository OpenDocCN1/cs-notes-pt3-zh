- pgno: 1
  md: '# 网络安全


    +   - 网络安全是指对网络系统的硬件、软件及其中的数据实施保护，使网络信息不因偶然或者恶意攻击而遭到破坏、更改或泄露，并且保证网络系统连续、可靠、正常地运行，保证网络服务不中断。

    +   - 网络安全是一门涉及计算机科学、网络技术、通信技术、密码技术、信息安全技术、应用数学、数论、信息论等多种学科的综合性学科。'
  merge: -1
  img_proc: true
