- pgno: 25
  md: '# 使用对称密码学通信


    +   - 密钥必须秘密地分配：

    +     - 如果密钥被损害了，攻击者就能解密所有消息，并可以假装是其中一方。

    +     - 假设网络中每对用户使用不同的密钥，那么密钥总数随着用户的增加而迅速增加：

    +       - n个用户需要的密钥总数=n(n-1)/2

    +       - 100个用户需要4950个不同的密钥'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 公钥密码学的基础——单向陷门函数


    +   - 单向陷门函数（trapdoor one-way function）：除非知道某种附加的信息，否则这样的函数在一个方向上容易计算，而在另外的方向上要计算是不可行的。

    +   - 单向陷门函数是公钥密码通信的基础：除非知道密钥，否则只能加密，解密非常困难。'
  merge: -1
  img_proc: true
- pgno: 27
