    +   - 各单位应建立并运行合理程序，以确认、维护、保存和处理这些过程是否规范的要求。

    +   - 记录要求清晰可辨，通过其可追溯到所记录的活动情况。记录的保存和维护应当做到随时可得，并不得损坏、磨损或丢失。'
