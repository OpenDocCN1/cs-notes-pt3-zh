- pgno: 29
  md: '# 常见密码（加、解密）算法


    +   - DES是最通用的计算机加密算法。DES是美国和国际标准，它是对称算法，加密和解密的密钥是相同的。

    +   - IDEA（International Data Encryption Algorithm）：对DES的改进，增强了安全性。

    +   - RSA是最流行的公开密钥算法，它能用作加密和数字签名。

    +   - DSA是另外一种公开密钥算法，它不能用作加密，只能用作数字签名。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# DES（对称）


    +   - DES是第一个得到广泛应用的密码算法；

    +   - DES是一种分组加密算法，输入的明文为64位，密钥为56位，生成的密文为64位；

    +   - DES基本上被认为不再安全；


    [http://dir.yahoo.com/Computers_and_Internet/Security_and_Encryption/RSA/RSA_Secret_Key_Challenge/](http://dir.yahoo.com/Computers_and_Internet/Security_and_Encryption/RSA/RSA_Secret_Key_Challenge/)'
  merge: -1
