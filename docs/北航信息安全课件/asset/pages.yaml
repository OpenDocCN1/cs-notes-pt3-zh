- pgno: 194
  md: '# 如何设计


    依据


    BMB17-2006、BMB20-2007


    步骤


    +   1. 根据系统等级，确定系统保护所应达到的基本要求；

    +   2. 结合系统实际进行风险评估，对部分保护要求作适当调整；

    +   3. 按照最终确定的保护要求，采取具体保护措施。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 设计原则


    从实际出发，综合平衡安全成本与风险，根据BMB23-2008《涉密信息系统分级保护方案设计指南》，设计符合BMB17-2006《涉密信息系统分级保护要求》和BMB20-2007《涉密信息系统分级保护管理规范》的系统方案。


    在方案设计时，应遵循以下原则：


    +   - 物理隔离

    +   - 分域分级

    +   - 技管并重

    +   - 最小授权与分权管理'
  merge: -1
  img_proc: true
