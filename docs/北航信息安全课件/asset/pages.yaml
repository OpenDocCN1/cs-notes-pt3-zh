- pgno: 115
  md: '# 3.1.1什么是等级保护


    信息安全等级保护是指：对国家秘密信息、法人和其他组织及公民的专有信息、公开信息分类分级进行管理和保护


    根据信息系统应用业务重要程度及其实际安全需求，实行分级、分类、分阶段实施保护，保障信息安全和系统安全正常运行，维护国家利益、公共利益和社会稳定。


    等级保护的核心是对信息系统特别是对业务应用系统安全分等级、按标准进行建设、管理和监督。国家对信息安全等级保护工作运用法律和技术规范逐级加强监管力度。突出重点，保障重要信息资源和重要信息系统的安全。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '+   - 信息安全等级保护制度的主要内容：

    +   - 对信息系统按业务安全应用域和区实行等级保护

    +   - 对系统中使用的信息安全产品实行按分级许可管理

    +   - 对等级系统的安全服务资质分级许可管理

    +   - 对信息系统中发生的信息安全事件分等级响应、处置'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 信息安全等级保护工作职责分工


    +   - 公安机关负责信息安全等级保护工作的监督、检查、指导。

    +   - 国家保密工作部门负责等级保护工作中有保密工作的监督、检查、指导。

    +   - 国家密码管理部门负责等级保护工作中有密码工作的监督、检查、指导。

    +   - 国务院信息化工作办公室负责信息安全等级保护工作中部门间的协调。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 安全保护等级的划分


    | 等级 | 对象 | 侵害客体 | 侵害程度 | 监管强度 |

    |---|---|---|---|---|

    | 第一级 | 一般系统 | 合法利益 | 损害 | 自主性保护 |

    | 第二级 | 一般系统 | 合法权益 | 严重损害 | 指导性保护 |

    | 第二级 | 一般系统 | 社会秩序和公共利益 | 损害 | 指导性保护 |

    | 第三级 | 重要系统 | 社会秩序和公共利益 | 严重损害 | 监督性保护 |

    | 第三级 | 重要系统 | 国家安全 | 损害 | 监督性保护 |

    | 第四级 | 重要系统 | 社会秩序和公共利益 | 特别严重损害 | 强制性保护 |

    | 第四级 | 重要系统 | 国家安全 | 严重损害 | 强制性保护 |

    | 第五级 | 极端重要系统 | 国家安全 | 特别严重损害 | 专门性保护 |'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 1.1.2为什么开展等级保护工作


    +   - 重点防护、适度防护

    +   - 保护投资、节省费用

    +   - 保证不同安全保护等级的信息系统具有相应的安全保护能力'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 1.1.3等级保护的内容


    +   - 自主保护级

    +   - 指导保护级

    +   - 监督保护级

    +   - 强制保护级

    +   - 专控保护级'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 自主保护级


    +   - 适用于一般的信息系统，其受到破坏后，会对公民、法人和其他组织的合法权益产生损害，但不损害国家安全、社会秩序和公共利益。

    +   - 信息系统运营、使用单位或个人依照国家管理规范和技术标准进行保护。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 指导保护级


    +   - 适用于一般的信息系统，其受到破坏后，会对社会秩序和公共利益造成轻微损害，但不损害国家安全；

    +   - 信息系统运营、使用单位应当依据国家管理规范和技术标准进行保护。必要时，国家信息安全监管职能部门进行指导。'
  merge: -1
  img_proc: true
- pgno: 123
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 强制保护级


    +   - 适用于涉及国家安全、社会秩序和公共利益的重要信息系统，其受到破坏后，对国家安全、社会秩序和公共利益造成严重损害；

    +   - 依照国家管理规范和技术标准进行保护，信息安全监管职能部门对其进行强制监督、检查'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 专控保护级


    +   - 适用于涉及国家安全、社会秩序和公共利益的重要信息系统的核心子系统，所承载的业务受到破坏后，会直接对国家安全造成特别严重损害；

    +   - 依照国家管理规范和技术标准进行保护，国家指定专门部门、专门机构进行专门监督。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 信息安全产品的使用


    +   - 信息安全产品的安全功能和可控性直接关系到其所构建的信息系统的安全。

    +   - 国家对信息安全产品的管理除按法律要求实行销售许可外，还对信息安全产品的使用按照其安全性，特别是其可控性和可信性进行分等级管理。'
  merge: -1
  img_proc: true
