    # 第五步 选择控制目标和控制措施


    +   - 选择的控制措施是否建立在风险评估的结果之上？

    +   - 是否能从风险评估中清楚地看出哪一些是基本控制措施，哪一些是必须的，哪一些是可以考虑选择的控制措施？

    +   - 选择的控制措施是否反应了组织的风险管理战略？

    +   - 针对每一种风险，控制措施都不是唯一的，要根据实际情况进行选择'
