- pgno: 168
  md: '# 3.3.1 定级系统互联设计


    # 设计目标


    定级系统互联的设计目标是：对相同或不同等级的定级系统之间的互联、互通、互操作进行安全保护，确保用户身份的真实性、操作的安全性以及抗抵赖性，并按安全策略对信息流向进行严格控制，确保进出安全计算环境、安全区域边界以及安全通信网络的数据安全。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 设计策略


    定级系统互联的设计策略是：在各定级系统的计算环境安全、区域边界安全和通信网络安全的基础上，通过安全管理中心增加相应的安全互联策略，保持用户身份、主/客体标记、访问控制策略等安全要素的一致性，对互联系统之间的互操作和数据交换进行安全保护。定级系统互联的设计通过安全互联部件的设计和跨定级系统安全管理中心的设计加以实现。'
  merge: -1
  img_proc: true
- pgno: 170
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 3.3.2等级保护测评


    +   - 等级测评 assessment for classified security protection

    +     具有相关资质的、独立的第三方测评服务机构，对信息系统的等级保护落实情况与信息安全等级保护相关标准要求之间的符合程度的测试评定

    +   - 主体：测评服务机构

    +   - 对象：信息系统（被测系统）

    +   - 工作内容：等级保护标准要求的符合性评定

    +   - 方式：assessment'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 测评单元 assessment unit


    等级测评的最小工作单位，由测评项、测评方法、测评对象、测评实施和结果判定组成。


    ![](img/2d1cfefc8e06efe29722afe0c8d5e64f_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '测评强度 assessment intensity

    测评的广度和深度，体现测评工作的努力程度。


    访谈 interview

    测评人员通过与信息系统用户（个人/群体）进行交流、讨论等活动，以获取证据证明信息系统安全保障措施是否有效的一种方法。


    检查 examine

    测评人员通过对测评对象进行观察、查验、分析等活动，以获取证据证明信息系统安全保证措施是否有效的一种方法。


    测试 test

    测评人员通过对测评对象按照预定的方法/工具使其产生特定的行为等活动，查看输出结果与预期结果的差异，以获取证据证明信息系统安全保证措施是否有效的一种方法。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 三种基本的测评方法


    +   - 访谈Interview

    +   - 检查Examine

    +   - 测试Test'
  merge: -1
  img_proc: true
- pgno: 175
  md: '+   - 访谈的对象是人员。

    +   - 典型的访谈包括：访谈信息安全主管、信息系统安全管理员、系统管理员、网络管理员、人力资源管理员设备管理员和用户等。

    +   - 工具：管理核查表（checklist）。

    +   - 适用情况：

    +     对技术要求，使用‘访谈’方法进行测评的目的是为了了解信息系统的全局性(包括局部，但不是细节)、方向/策略性和过程性信息，一般不涉及到具体的实现细节和具体技术措施。

    +     对管理要求，访谈的内容应该较为详细和明确的。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   - 检查包括：评审、核查、审查、观察、研究和分析等方式。

    +   - 检查对象包括文档、机制、设备等。

    +   - 工具：技术核查表（checklist）。

    +   - 适用情况：

    +     - 对技术要求，“检查”的内容应该是具体的、较为详细的机制配置和运行实现。

    +     - 对管理要求，“检查”方法主要用于规范性要求（检查文档）。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   - 测试包括：功能/性能测试、渗透测试等。

    +   - 测评对象包括机制和设备等。

    +   - 测试一般需要借助特定工具。

    +     - 扫描检测工具，网络协议分析仪，攻击工具，渗透工具

    +   - 适用情况：

    +     - 对技术要求，“测试”的目的是验证信息系统当前的、具体的安全机制或运行的有效性或安全强度。

    +     - 对管理要求，一般不采用测试技术。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 测评强度


    +   - 对信息系统的要求：安全等级级别越高，基本要求强度越强，体现为安全控制点越多，安全控制要求越细。

    +   - 对信息系统的测评：安全等级级别越高，测评强度越强，测评强度体现测评工作的努力程度，反映出测评的广度和深度。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   - 测评强度体现测评工作的努力程度，反映出测评的广度和深度。

    +   - 测评广度越大，范围越大，包含的测评对象就越多，就需要更大的努力。

    +   - 测评的深度越深，越需要在细节上展开，就越需要更大的努力。

    +   - 越大的努力程度就越能为测评提供更好的保证，体现测评强度越强。'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 测评原则


    +   - 适当性

    +     所有参与安全测评工作的机构，为达到预定的强度等级所采取的测评活动应该是适当的。


    +   - 公正性

    +     所有的测评活动应当没有偏见。相互认可的测评方案必须详细地提出不可接受的利益冲突。


    +   - 客观性

    +     既然不能完全摆脱个人主张或判断，测评人员应当在最小主观判断或主张情形下，基于明确定义的测评方法和解释，得到测评结果。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   - 可重复性和可再现性

    +     不论谁执行测评，依照同样的要求，使用同样的测评方法，对每个测评项的重复评估应该导出同样的结果。可再现性和可重复性的区别在于，前者与不同测评者测评结果的一致性有关，后者与同一测评者测评结果的一致性有关。

    +   - 可重用性

    +     出于成本和工作复杂性考虑，测评工作可以重用以前的测评结果。所有重用的结果，都应基于结果适用于目前的系统，并且能够反映出目前系统的安全状态基础之上。

    +   - 结果的完善性

    +     测评所产生的结果应当证明是良好的判断和对测评项的正确理解。测评过程和结果应当服从正确的测评方法以确保其满足了测评项的要求。'
  merge: -1
  img_proc: true
