- pgno: 101
  md: '# 风险分析矩阵----风险程度


    | 可能性\\后果 | 无关紧要 1 | 较小 2 | 中等 3 | 较大 4 | 灾难性 5 |

    |---|---:|---:|---:|---:|---:|

    | 几乎肯定 A | H | H | E | E | E |

    | 很可能 B | M | H | H | E | E |

    | 可能 C | L | M | H | E | E |

    | 不太可能 D | L | L | M | H | E |

    | 罕见 E | L | L | M | H | H |


    E：极度风险　 H：高风险　 M：中等风险　 L：低风险'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 风险的处理措施


    +   - E： 极度风险---要求立即采取措施

    +   - H： 高风险-----需要高级管理部门的注意

    +   - M： 中等风险---必须规定管理责任

    +   - L: 低风险-----用日常程序处理'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 定量的风险分析


    +   - 当部分公司资产已具有量化的价值

    +   - 利用财务的手法算出风险造成的财务损失

    +   - 再根据损失的大小决定风险等级'
  merge: -1
  img_proc: true
