- pgno: 66
  md: '# 3. 2. 5防火墙技术


    防火墙是一台用于信息安全管理与服务的计算机系统。它可以加强网络间的访问控制，防止外部用户非法使用内部网的资源，保护内网的设备工作状态不被破坏，数据不被窃取


    防火墙技术是建立在现代通信网络技术和信息安全技术基础上的应用性安全技术，越来越多地应用于专用网络与公用网络的互联环境之中，尤其以接入 Internet 网络为最甚。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - 防火墙的基本功能

    +     - 过滤进出网络的数据包。

    +     - 管理进出网络的访问。

    +     - 封堵某些禁止的访问。

    +     - 记录通过防火墙的信息内容和活动情况。

    +     - 对攻击进行检测与告警。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 防火墙的特性


    +   - 所有通过内网与外网之间传输的数据必须通过防火墙。

    +   - 只有被授的合法数据才可能通过防火墙。

    +   - 防火墙本身不受各种攻击。

    +   - 使用了新的信息安全技术，例如现代密码技术、一次口令、智能卡等技术。

    +   - 人机界面良好。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 利用防火墙保护内网的主要优点


    +   - 简化了网络安全管理；

    +   - 保护了网络中脆弱的服务；

    +   - 防火墙可以方便地监视网络安全并产生报警；

    +   - 内网所有或大部分需要改动的以及附加的安全程序都集中地放在防火墙系统中；

    +   - 增强了保密，强化了私有权。

    +   - 防火墙是审计和记录Internet使用情况的最佳地方。

    +   - 防火墙也可成为向客户发布信息的地点，作为布置WWW服务器和FTP服务器的地点是非常理想的。还可以对防火墙进行配置，允许Internet用户访问上述服务器，而禁止外网对内网中其他系统的访问。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - 防火墙的主要缺陷如下：

    +     - 限制了网络服务，特别是限制或关闭了很多有用但存在安全缺陷的网络服务；

    +     - 无法防止内部网络用户的攻击；

    +     - 无法防范绕过防火墙的攻击，需要附加认证的代理服务器；

    +     - 不能完全防止感染和传送病毒。不能期望防火墙对每一个文件扫描，查出潜在的病毒；

    +     - 无法防范数据驱动型的攻击。数据驱动型的攻击从表面上看是无害的数据，被拷贝到Internet的主机上，一旦被执行，就发起了攻击。

    +     - 不能防范新的网络安全问题。防火墙是一种被动式的防护手段，它只能对现在已知的网络威胁起作用。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 防火墙的体系结构


    +   - 包过滤

    +   - 双宿网关

    +   - 屏蔽主机

    +   - 屏蔽子网'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 过滤型防火墙


    可以用一台过滤路由器来实现，对所接收的每个数据包做允许或拒绝的决定。此时，路由器审查每个数据包以便确定其是否与某一条过滤规则匹配。过滤规则基于可以提供给IP转发过程的包头信息。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 包过滤防火墙一般应用场合


    +   - 机构是非集中化管理；

    +   - 机构没有强大的集中安全策略；

    +   - 网络的主机数非常少；

    +   - 主要依赖于主机安全来防止入侵；

    +   - 没有使用DHCP这样的动态IP地址分配协议'
  merge: -1
  img_proc: true
- pgno: 74
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 屏蔽子网防火墙


    +   - 采用两个包过滤路由器和一个堡垒主机。

    +   - 堡垒主机、信息服务器以及其他公用服务器放在“非军事区”网络中。“非军事区”网络处于因特网和内部网络之间。

    +   - 内部路由器(阻塞路由器)位于内部网和“非军事区”之间，用于保护内部网不受“非军事区”和因特网的侵害，它执行了大部分的过滤工作。

    +   - 外部路由器的一個主要功能是保护“非军事区”上的主机。  - 这种保护不是很必要，因为主要是通过堡垒主机来进行安全保护的。  - 外部路由器还可以防止部分IP欺骗，因为内部路由器分辨不出一个声称从“非军事区”来的数据包是否真的从“非军事区”来，而外部路由器很容易分辨出真伪。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - 对于进来的信息

    +     - 只允许外部系统访问堡垒主机(还可能有信息服务器)。

    +     - 内部路由器只接收源于堡垒主机的数据包，负责的是管理“非军事区”到内部网络的访问。

    +   - 对于去往因特网的数据包

    +     - 内部路由器管理内部网络到“非军事区”网络的访问。它允许内部系统只访问堡垒主机(还可能有信息服务器)。

    +     - 外面的路由器上的过滤规则要求使用代理服务(只接收来自堡垒主机的去往因特网的数据包)。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - 万一堡垒主机被控制，采用了屏蔽子网体系结构，入侵者仍然不能直接侵袭内部网络，内部网络仍受到内部过滤路由器的保护。

    +   - 如果没有“非军事区”，那么入侵者控制了堡垒主机后就可以监听整个内部网络的对话。

    +   - 把堡垒主机放在“非军事区”网络上，即使入侵者控制了堡垒主机，他所能侦听到内容是有限的。

    +   - 内部网络上的数据包虽然在内部网上是广播式的，但内部过滤路由器会阻止这些数据包流入“非军事区”网络。'
  merge: -1
  img_proc: true
