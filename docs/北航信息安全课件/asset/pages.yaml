- pgno: 183
  md: '# 3.4.1什么是分级保护


    +   - 涉密信息系统分级保护的含义


    涉密信息系统分级保护是指涉密信息系统的建设使用单位根据分级保护管理办法和有关标准，对涉密信息系统分等级实施保护，各级保密工作部门根据涉密信息系统的保护等级实施监督管理，确保系统和信息安全。'
  merge: -1
  img_proc: true
