- pgno: 130
  md: '# 等级保护制度的基本原则


    +   - 信息安全等级保护的核心是对信息安全分等级、按标准进行建设、管理和监督。信息安全等级保护制度遵循以下基本原则：

    +   - 一是明确责任，共同保护

    +   - 二是依照标准，自行保护

    +   - 三是同步建设，动态调整

    +   - 四是指导监督，重点保护'
