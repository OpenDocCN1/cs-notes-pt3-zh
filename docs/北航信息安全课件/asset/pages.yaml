- pgno: 162
  md: '# 3.2.3等级保护基本技术要求


    通用技术要求是《准则》的详细说明和细化，包括：


    +   - 基本技术要求

    +     安全功能要求是指为实现计算机信息系统的安全运行和对其中的信息进行安全保护所采取的安全策略的具体实现（即安全机制）的外部表现，包括物理安全、运行安全和信息安全


    +   - 安全保证要求

    +     是为确保安全功能达到所要求的安全目标所应采取的措施。包括从安全机制的自身安全保护，安全机制的设计与实现，以及安全机制的安全管理等方面'
  merge: -1
  img_proc: true
- pgno: 163
  md: '网络技术要求是《准则》技术要求在网络方面的详细说明。包括：


    +   - 网络系统安全运行

    +     是指通过采取一系列措施，防止由于人为的和自然的原因对网络系统的运行造成的攻击和破坏，保护网络系统的安全运行，使网络系统能提供预期的有效服务。


    +   - 网络传输信息安全保护

    +     是指对在网络中传输的数据信息进行有效保护，使其在保密性、完整性和可用性（含可控性和不可抵赖性）方面达到预定的目标要求。'
  merge: -1
  img_proc: true
- pgno: 164
  md: '数据库管理系统技术要求是《准则》技术要求在数据库管理系统方面的详细说明。包括：


    +   - DB中数据的保护


    从信息保护的角度，数据库管理系统安全可概括为信息的保密性、完整性和可用性（含可控性、可操作性和不可抵赖性）。


    +   - DBMS的安全要求


    提供有效信息服务'
  merge: -1
  img_proc: true
- pgno: 165
  md: '操作系统技术要求是《准则》技术要求在操作系统方面的详细说明。


    从信息保护的角度，操作系统安全可概括为信息的保密性、完整性和可用性（含可控性和不可抵赖性）。从系统运行的角度操作系统安全可以概括为系统的运行安全和运行中的信息安全。


    操作系统的最终安全目标是，在操作系统提供的信息处理功能的范围内，进行信息保护和提供有效信息服务。'
  merge: -1
  img_proc: true
