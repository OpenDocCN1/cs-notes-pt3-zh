  md: '# 风险评估方法概述


    原则：不管使用哪一种风险评估的方法或工具，其内容都应包括以下四个要素：


    +   - 识别资产及其价值

    +   - 确定威胁（Threat）

    +   - 识别脆弱性（Vulnerability）

