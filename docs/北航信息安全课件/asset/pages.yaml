- pgno: 281
  md: '# 2.3.5 ISMS文件控制


    # BS7799-2对ISMS文件控制的要求：


    组织要建立和维护一套控制3.4条款中要求的所有文件的流程，应确保这些文件：


    +   - 随时可得

    +   - 根据组织的安全方针的变化得以定期评审和修订

    +   - 版本要及时更新，并存放在信息安全管理体系的涉及的现场

    +   - 过时后及时撤换

    +   - 过时撤换后对其进行分类存档，用于事后凭据或查阅


    此类文本应保持整洁、清楚，并标明日期，按分类妥善保存至规定期限到期为止。针对各类文件的建立和修订，要制定一定的流程和职责划分。'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 2.3.6 ISMS记录


