- pgno: 31
  md: '# IDEA（对称）


    +   - Xuejia Lai和James Massey提出；

    +   - IDEA是对称、分组密码算法，输入明文为64位，密钥为128位，生成的密文为64位；

    +   - IDEA是一种相对较新的算法，虽有坚实的理论基础，但仍应谨慎使用（尽管该算法已被证明可对抗差分分析和线性分析）；

    +   - IDEA是一种专利算法（在欧洲和美国），专利由Ascom-Tech AG拥有；

    +   - PGP中已实现了IDEA；'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# AES


    +   - 高级加密标准 (AES) 是美国标准与技术研究院针对电子数据的加密所制定的规范，它将要成为公认的数字信息（包括财务数据、电信数据和政府数据）加密方法。

    +   - AES 是可以使用 128、192 和 256 位密钥的迭代式对称密钥块密码，并且可以对 128 位（16 个字节）的数据块进行加密和解密。由块密码返回的加密数据与输入数据具有相同的位数。迭代式密码使用循环结构来针对输入数据反复执行排列和置换运算。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# RSA (非对称)


    +   - Ron Rivest, Adi Shamir和Len Adleman于1977年研制并于1978年首次发表；

    +   - 一种分组密码，基础：一种特殊的可逆模幂运算。其安全性基于分解大整数的困难性；

    +   - 可用于加密和数字签名，已得到广泛采用；

    +   - 已被许多标准化组织(如ISO、ITU、IETF和SWIFT等)接纳；

    +   - RSA-155(512 bit), RSA-140于1999年分别被分解；'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# DH/DSA（非对称）


    +   - Diffie-Hellman(DH)是第一个公钥算法，其安全性基于在有限域中计算离散对数的难度；

    +   - DH可用于密钥分发（交换或协商），但不能用于加/解密报文；

    +   - DH算法已得到广泛应用，并为许多标准化组织(IETF等)接纳；

    +   - DSA是NIST于1991年提出的数字签名标准(DSS),该标准于1994年5月19日被颁布；

    +   - DSA是Schnorr和Elgamal签名算法的变型,DSA只能用于数字签名不能用于加密；'
  merge: -1
  img_proc: true
