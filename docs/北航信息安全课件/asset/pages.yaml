- pgno: 18
  md: '# 密码算法和密钥（续）


    现代密码学用密钥（key）解决了这个问题：


    ![](img/2d1cfefc8e06efe29722afe0c8d5e64f_18_0.png)


    +   - 密码系统（cryptosystem）由算法以及所有可能的明文、密文和密钥组成。

    +   - 加密后数据的安全性是基于密钥的安全性；而不是基于算法的安全性。算法可以公开，也可以被分析，只要密钥不泄露，加密数据就无法被破解。'
  merge: -1
  img_proc: true
