- pgno: 105
  md: '# ALE定量风险分析


    简易的定量计算公式：


    资产价值（V）乘以频率（L）可以得出 ALE（年度风险损失），即：


    ALE = V * L


    风险的函数表达：


    +   - R = f（a, v, t）

    +   - R：风险

    +   - a：资产的价值

    +   - v：资产本身的脆弱性

    +   - t：资产所面临的威胁'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 定性分析与定量分析的比较


    +   - 定性风险分析


    定性风险分析是所有风险分析的方法中，最容易也是最常被运用的方法。可是也是最主观的。


    其结果高度依存于RMT（风险管理小组）的专业能力。


    需要一套系统化的执行步骤，来帮助RMT的执行成果更接近预期的效果。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 定性风险分析的优点


    +   - 简易的计算方式

    +   - 不必精确算出资产价值

    +   - 不需得到量化的威胁发生率

    +   - 非技术或非安全背景的员工也能轻易参与

    +   - 流程和报告形式比较有弹性


    # 定性风险分析的缺点


    +   - 本质上是非常主观的

    +   - 对关键资产的财务价值评估参考性较低

    +   - 缺乏对风险降低的成本分析'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 定量风险分析的优点


    +   - 大体来说其结果都是建立在独立客观的程序或量化指标上

    +   - 大部分的工作集中在制定资产价值和减缓可能风险

    +   - 主要目的是做成本效益的审核


    # 定量风险分析的缺点


    +   - 风险计算方法复杂

    +   - 需要自动化工具及相当的基础知识

    +   - 投入大

    +   - 个人难以执行

    +   - 很难中途改变方向

    +   - 不会有范围之外的结果'
  merge: -1
  img_proc: true
- pgno: 109
  md: "# 2.3 风险评估的实施过程\n\n+   风险评估方法的九个主要步骤\n+   \n+   - 步骤一：系统特征描述\n+   - 步骤二：威胁识别\n\
    +   - 步骤三：弱点识别\n+   - 步骤四：控制分析\n+   - 步骤五：可能性确定\n+   - 步骤六：影响分析\n+   - 步骤七：风险确定\n\
    +   - 步骤八：控制建议\n+   - 步骤九：结果文档"
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 风险评估成功的关键


    +   - 获得高级管理的支持和参与

    +   - 确定安全重点

    +   - 明确评估方法，明确评估过程

    +   - 风险评估的灵魂是参与项目的人

    +   - 浓缩评估的范围

    +   - 评估结果的有效管理

    +   - 有效利用工具

    +   - 考虑收益效果'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 风险评估面临的挑战


    +   - 评估的深度与专业知识的相关性

    +   - 风险因素方面的数据非常有限

    +   - 有些损失，像失去客户信任或敏感信息的泄露，本质上很难量化

    +   - 往往不能精确地估计非直接的成本

    +   - 容易忽视对安全产品进行评估'
  merge: -1
  img_proc: true
