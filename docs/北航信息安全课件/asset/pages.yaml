- pgno: 3
  md: '# 加密机制


    +   - 加密是提供数据保密的最常用方法。

    +   - 按密钥类型划分，加密算法可分为对称密钥加密算法和非对称密钥两种；

    +   - 按密码体制分，可分为序列密码和分组密码算法两种。

    +   - 用加密的方法与其他技术相结合，可以提供数据的保密性和完整性。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# # 数字签名机制


    数字签名是解决网络通信中持有的安全问题的有效方法。特别是针对通信双方发生争执时可能产生的如下安全问题：


    +   - **否认**：发送者事后不承认自己发送过某份文件。

    +   - **伪造**：接收者伪造一份文件，声称它发自发送者。

    +   - **冒充**：网上的某个用户冒充另一个用户接收或发送信息。

    +   - **篡改**：接收者对收到的信息进行部分篡改。'
  merge: -1
  img_proc: true
