- pgno: 129
  md: '# 信息安全等级保护制度的意义（续）


    +   - 有利于明确国家、法人和其他组织、公民的安全责任，强化政府监管职能，共同落实各项安全建设和安全管理措施；

    +   - 有利于提高安全保护的科学性、整体性、针对性，推动信息安全产业水平，逐步探索一条适应社会主义市场经济发展的信息安全发展模式。'
  merge: -1
