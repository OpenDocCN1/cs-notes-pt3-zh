    组织应定义信息安全方针。


    # 信息安全方针


    +   一、目的：信息安全是指保证信息的保密性、完整性和可用性不受破坏。建立信息安全管理体系的目标是对公司的信息安全进行全面管理，

    +   二、公司总经理张来先生决定在整个公司范围内建立并实施信息安全管理体系。要求各部门高度重视，'
