- pgno: 16
  md: '# 密码算法和密钥


    +   - 密码算法（algorithm）也叫密码（cipher），是用于加密和解密的数学函数。（通常情况下有两个相关的函数，一个用来加密，一个用来解密）

    +   - 如果数据的保密性是基于保持算法的秘密，这种算法称为受限制的（restricted）算法。受限制的算法不可能进行质量控制或标准化。每个用户和组织必须由他们自己唯一的算法。'
  merge: -1
  img_proc: true
