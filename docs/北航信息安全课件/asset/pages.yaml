  md: '影响计算机网络的因素很多，有些因素可能是有意的，也可能是无意的；可能是人为的，也可能是非人为的；可能是外来黑客对网络系统资源的非法使有，归结起来，针对网络安全的威胁主要有三：


    +   (1) 人为的无意失误；

    +   (2) 人为的恶意攻击；

    +   (3) 网络软件的漏洞和“后门”；'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - (1)人为的无意失误：

    +     如操作员安全配置不当造成的安全漏洞，用户安全意识不强，用户口令选择不慎，用户将自己的帐号随意转借他人或与别人共享等都会对网络安全带来威胁。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - (2)人为的恶意攻击：

    +     这是计算机网络所面临的最大威胁，故手的攻击和计算机犯罪就属于这一类。此类攻击又可以分为以下两种：一种是主动攻击，它以各种方式有选择地破坏信息的有效性和完整性；另一类是被动攻击，它是在不影响网络正常工作的情况下，进行截获、窃取、破译以获得重要机密信息。这两种攻击均可对计算机网络造成极大的危害，并导致机密数据的泄漏。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - (3)网络软件的漏洞和“后门”：

    +     网络软件不可能是一百分之百的无缺陷和无漏洞的，然而，这些漏洞和缺陷恰恰是黑客进行攻击的首选目标，曾经出现过的黑客攻入网络内部的事件，这些事件的大部分就是因为安全措施不完善所招致的苦果。另外，软件的“后门”都是软件公司的设计编程人员为了自便而设置的，一般不为外人所知，但一旦“后门”洞开，其造成的后果将不堪设想。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 3. 2网络安全技术介绍


    +   - 3. 2. 1加密技术


    加密技术是EC采取的主要安全措施,贸易方可根据需要在信息交换的阶段使用。

    目前,加密技术分为两类,即对称加密和非对称加密。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 对称加密


    对称加密技术存在着在通信的贸易方之间确保密钥安全交换的问题。此外,当某一贸易方有"n"个贸易关系,那么他就要维护"n"个专用密钥(即 每把密钥对应一贸易方)。对称加密方式存在的另一个问题是无法鉴别贸易发起方或贸易最终方。因为贸易双方共享同一把专用密钥,贸易双方的任何信息都是通过这把密钥加密后传送给对方的。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 非对称加密/公开密钥加密


    在非对称加密体系中，密钥被分解为一对(即一把公开密钥或加密密钥和一把专用密钥或解密密钥)。这对密钥中的任何一把都可作为公开密钥(加密密钥)通过非保密方式向他人公开，而另一把则作为专用密钥(解密密钥)加以保存。公开密钥用于对机密性的加密，专用密钥则用于对加密信息的解密。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 3.2.2 密钥管理技术


    # ① 对称密钥管理


    对称加密是基于共同保守秘密来实现的。采用对称加密技术的贸易双方必须要保证采用的是相同的密钥，要保证彼此密钥的交换是安全可靠的，同时还要设定防止密钥泄露和更改密钥的程序。这样，对称密钥的管理和分发工作将变成一件潜在危险的和繁琐的过程。'
  merge: -1
  img_proc: true
- pgno: 63
  md: "+   - ②公开密钥管理/数字证书\n+   \n+   贸易伙伴间可以使用数字证书(公开密钥证书)来交换公开密钥。国际电信联盟(ITU)制定的标准X.509(即信息技术--开放系统互连--目录:鉴别框架)对数字证书进行了定义该标准等同于国际标准化组织(ISO)与国际电工委员会(IEC)联合发布的ISO/IEC\
    \ 9594-8:195标准。数字证书通常包含有唯一标识证书所有者(即贸易方)的名称、唯一标识证书发布者的名称、证书所有者的公开密钥、证书发布者的数字签名、证书的有效期及证书的序列号等。"
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 3.2.3数字签名


    数字签名是公开密钥加密技术的另一类应用。它的主要方式是:报文的发送方 从报文文本中生成一个128位的散列值(或报文摘要)。发送方用自己的专用密钥对 这个散列值进行加密来形成发送方的数字签名。然后，这个数字签名将作为报文的
    附件和报文一起发送给报文的接收方。报文的接收方首先从接收到的原始报文中 计算出128位的散列值(或报文摘要)，接着再用发送方的公开密钥来对报文附加的 数字签名进行解密。如果两个散列值相同，那么接收方就能确认该数字签名是发送方的。通过数字签名能够实现对原始报文的鉴别和不可抵赖性。'
  merge: -1
  img_proc: true
- pgno: 65
  md: <!-- no content -->
  merge: -1
