- pgno: 97
  md: '# 定量分析：


    +   - 对后果和可能性进行分析

    +   - 采用量化的数值描述后果（估计出可能损失的金额）和可能性（概率或频率）

    +   - 分析的有效性取决于所用的数值精确度和完整性。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 定性分析：


    +   - 对后果和可能性进行分析

    +   - 采用文字形式或叙述性的数值范围描述风险的影响程度和可能性的大小（如高、中、低等）

    +   - 分析的有效性取决于所用的数值精确度和完整性。


    # 定性分析适用于：


    +   - 初始的筛选活动，以鉴定出需要更仔细分析的风险

    +   - 风险程度和经济上的考虑

    +   - 数据不足以进行定量分析的情况'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 半定量分析：


    +   - 在半定量分析中，上述的那些定性数值范围均为已知值。每项说明所指的数字并不一定与后果或可能性的实际大小程度具有精确的关系。

    +   - 半定量分析的目的是为了得到比通常在定性分析中所得到的更为详细的风险程度，但并非要提出任何在定量分析中所得到的风险实际值。'
  merge: -1
  img_proc: true
