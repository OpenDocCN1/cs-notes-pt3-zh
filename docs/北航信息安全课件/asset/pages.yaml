- pgno: 84
  md: '# 2.1 风险相关概念


    风险的定义


    +   - 普通字典中风险：遭受损害或损失的可能性。

    +   - 风险：对目标产生影响的某种事件发生的机会。它可以用后果和可能性来衡量

    +   - 安全风险：是指一种特定的威胁利用一种或一组脆弱性造成组织的资产损失或损害的可能性。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 信息安全的定义（ISO17799）：


    # 信息安全的三个特征：


    +   - **机密性**：确保只有被授权的人才可以访问信息；

    +   - **完整性**：确保信息和信息处理方法的准确性和完整性；

    +   - **可用性**：确保在需要时，被授权的用户可以访问信息和相关的资产。


    信息安全风险是指信息资产的保密性、完整性可用性遭到破坏的可能性。


    信息安全风险只考虑那些对组织有负面影响的事。'
  merge: -1
  img_proc: true
