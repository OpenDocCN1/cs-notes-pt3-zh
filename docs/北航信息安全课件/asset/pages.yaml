  md: '# 信息安全等级保护的意义


    +   - 实施信息安全等级保护，可以有效地提高我国信息安全建设的整体水平；

    +   - 有利于在信息化建设过程中同步建设信息安全设施，保障信息安全与信息化建设相协调；

    +   - 有利于加强对涉及国家安全、经济秩序、社会稳定和公共利益的信息系统的安全保护和管理监督'
  merge: -1
