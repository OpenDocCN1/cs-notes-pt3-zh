  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 6
  md: '# # 数据完整性机制


    +   - 数据完整性包括两种形式：一种是数据单元的完整性，另一种是数据单元序列的完整性。

    +   - 保证数据完整性的一般方法是：发送实体在一个数据单元上加一个标记，这个标记是数据本身的函数，如一个分组校验、或密码校验函数，它本身是经过加密的。接收实体是一个对应的标记，并将所产生的标记与接收的标记相比较，以确定在传输过程中数据是否被修改过。

    +   - 数据单元序列的完整性是要求数据编号的连续性和时间标记的正确性，以防止假冒、丢失、重发、插入或修改数据。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 交换鉴别机制


    交换鉴别是以交换信息的方式来确认实体身份的机制。用于交换鉴别的技术有：


    +   - 口令：由发方实体提供，收方实体检测。

    +   - 密码技术：将交换的数据加密，只有合法用户才能解密，得出有意义的明文。

    +   - 利用实体的特征或所有权。常采用的技术是指纹识别和身份卡等。'
  merge: -1
  img_proc: true
