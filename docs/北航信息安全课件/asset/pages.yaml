    +   - 《应用软件系统安全等级保护通用技术指南》（GA/T 711-2007）

    +   - 《应用软件系统安全等级保护通用测试指南》（GA/T 712-2007）

    +   - 《网络和终端设备隔离部件测试评价方法》（GB/T 20277-2006）

    +   - 《网络脆弱性扫描产品测评方法》（GB/T 20280-2006）'
