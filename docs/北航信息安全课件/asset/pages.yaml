- pgno: 241
  md: '# ## 2.2.1 PDCA循环


    +   - 又称“戴明环”，PDCA循环是能使任何一项活动有效进行的工作程序：

    +     - **P**：计划，方针和目标的确定以及活动计划的制定；

    +     - **D**：执行，具体运作，实现计划中的内容；

    +     - **C**：检查，总结执行计划的结果，分清哪些对了，哪些错了，明确效果，找出问题；

    +     - **A**：改进（或处理），对总结检查的结果进行处理，成功的经验加以肯定，并予以标准化，或制定作业指导书，便于以后工作时遵循；对于失败的教训也要总结，以免重现。对于没有解决的问题，应提给下一个PDCA循环中去解决。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 2.2.1 PDCA循环


    PDCA循环的特点一


    按顺序进行，它靠组织的力量来推动，像车轮一样向前进，周而复始，不断循环


    ![](img/2d1cfefc8e06efe29722afe0c8d5e64f_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 2.2.1 PDCA循环


    # PDCA循环的特点二


    组织中的每个部分，甚至个人，均有一个PDCA循环，大环套小环，一层一层地解决问题。


    ![](img/2d1cfefc8e06efe29722afe0c8d5e64f_243_0.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 2.2.1 PDCA循环


    # PDCA循环的特点三


    每通过一次PDCA循环，都要进行总结，提出新目标，再进行第二次PDCA循环。


    ![](img/2d1cfefc8e06efe29722afe0c8d5e64f_244_0.png)'
  merge: -1
  img_proc: true
