- pgno: 236
  md: '# # 2.1 什么是ISMS


    +   - **ISMS:**

    +     - Information Security Management System

    +     - 信息安全管理体系


    +   - **ISO9000-2000 术语和定义**

    +     - 组织 organization

    +       - 职责、权限和相互关系得到安排的一组人员及设施，如：公司、集团、商行、企事业单位、研究机构、慈善机构、代理商、社团，或上述组织的部分或组合。

    +     - 管理 management

    +       - 指挥和控制组织的协调的活动

    +     - 体系 system

    +       - 相互关联和相互作用的一组要素

    +     - 管理体系 management system

    +       - 建立方针和目标并实现这些目标的体系


    +   - **管理学中的定义**

    +     - 管理

    +       - 是指通过计划、组织、领导、控制等环节来协调人力、物力、财力等资源，以期有效达到组织目标的过程。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 信息安全管理体系 ISMS定义


    +   ■ ISMS是：

    +   在信息安全方面指挥和控制组织的以实现信息安全目标的相互关联和相互作用的一组要素。


    +   □ 信息安全目标应是可测量的

    +   □ 要素可能包括

    +     ■ 信息安全方针、策略

    +     ■ 信息安全组织结构

    +     ■ 各种活动、过程

    +     - 信息安全控制措施

    +     - 人力、物力等资源

    +     ■ ……'
  merge: -1
