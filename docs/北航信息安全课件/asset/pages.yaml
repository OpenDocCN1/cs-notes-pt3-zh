- pgno: 256
  md: '# 2.3.1 ISMS总则


    # 3.1 General（总则）


    The organization shall establish and maintain documented ISMS. This shall address
    the assets to be protected, the organization’s approach to risk management, the
    control objectives and controls, and the degree of assurance required.


    +   - 组织应该建立并运行一套文件化的ISMS

    +   - 确定组织需要保护的资产

    +   - 确定风险管理的方法

    +   - 确定风险控制的目标和控制措施

    +   - 确定要达到的安全保证程度'
  merge: -1
  img_proc: true
