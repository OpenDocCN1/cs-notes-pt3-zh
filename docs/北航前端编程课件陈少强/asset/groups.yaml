  - "[PAGE 295]\n\n# 5.4.7 使用计数气泡\n\n计数气泡是一个在行的右侧显示的包含数字的圆圈，通常用于显示该交互行包含多少项。\n\n要使用计数气泡，只需在列表项（li）中包含任意带ui-li-count类的html元素，例如span元素。例如：\n\
    \n```\n```html\n<li><a href=\"inbox.html\">Inbox</a>\n    <span class=\"ui-li-count\"\
    >86</span>\n```\n```\n\n下图显示了计数气泡在一个交互列表中的显示效果。如果想改变默认的白色背景，可以在对应的ul元素中指定data-count-theme属性。\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_295_0.png)"
  - '[PAGE 296]


    # 5.4.8 使用搜索过滤数据


    在ul或ol标记内添加data-filter="true"属性，不用任何编码就可以在列表的顶部添加一个搜索框。它会根据用户的输入过滤列表元素。可以在ul中使用data-filter-placeholder属性来自定义占位字符，或使用data-filter-theme属性来改变搜索栏的色样。


    例见：5-4-9.html


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_296_0.png)'
  - '[PAGE 297]


    # 5.5 表单组件


    jQuery Mobile框架支持标准的HTML表单，在支持的设备上会自动使用AJAX处理，同时标准表单控件的外观也为触摸操作进行了优化。


    所谓标准表单指的是位于form元素内的一组表单控件，如input、textarea以及select元素等。表单的数据将被发送到该form元素的action属性所指向的URL。'
  - "[PAGE 298]\n\n# 5.5.1 表单动作\n\njQuery Mobile表单的动作处理方式与原来一样：当用户按下提交按钮时，表单会被提交。\n\
    \n表单提交时，除非是提交到不同的域名，否则jQuery Mobile会使用AJAX方式过渡到目标页面，就像链接到一个外部页面一样。\n\n表单的提交方式有post和get，由form元素的method属性指定。\
    \  \n**get:** 以URL的形式发送数据；**post:** 浏览器与服务器建立联系后，再将表单数据发往服务器。\n\n典型的jQuery Mobile表单与标准的HTML表单很像：\n\
