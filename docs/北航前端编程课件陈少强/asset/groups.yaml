  - '[PAGE 157]


    # 3.3.7 层叠样式单和动态HTML


    层叠样式单（Cascading Style Sheets，CSS）指定了HTML文档的视觉表现。使用CSS和JavaScript，可以创造出各种视觉效果，这些视觉效果统称为动态HTML（DHTML）。


    1、使用脚本控制样式


    文档对象模型允许将应用到每个文档元素上的样式进行脚本化，利用脚本化CSS样式的能力，可以动态地改变颜色、字体等。更重要的是，可以用它设置和改变元素的位置，甚至隐藏或显示元素。这意味着可以用DHTML技术创造出动画效果。'
  - "[PAGE 158]\n\n# 3.3.7 层叠样式单和动态HTML\n\n一旦获取了想应用样式的元素的引用，就可以使用元素的style属性获取那个元素的CSSProperties对象。这个JavaScript对象拥有与CSS的每个样式对应的JavaScript属性。设置这些属性与设置HTML元素的style属性中的相应样式的效果一样。读取这些属性将返回HTML元素的style性质设置的CSS属性（如果存在）。即设置和读取的都是HTML元素的内联样式，而不是应用到该元素的样式表的样式信息。设置对象的这个属性后，就定义了元素的内联样式，它能有效地覆盖样式表样式。例如：\n\
    \n```\n```javascript\nvar imgs = document.getElementsByTagName(\"img\");\nfor(var\
    \ i = 0; i < imgs.length; i++) {\n    var img=imgs[i];\n    if (img.width == 468\
    \ && img.height == 60) //标题广告尺寸\n        img.style.visibility = “hidden”; //占位但不可见\n\
    }\n```\n```"
  - '[PAGE 159]


    # 3.3.7 层叠样式单和动态HTML


    （1）CSS属性在JavaScript中的命名惯例


    许多CSS样式名中都包含连字符，例如：font-faminly。在JavaScript中连字符被解释为减号，因此，CSSProperties对象的属性名和真正的CSS性质名有点不同：


    +   如果一个CSS属性名包含一个或多个连字符，那么CSS2Properties属性名删除了连字符，且原来紧接在连字符后的字母改为大写。例如，可以用下列代码访问font-family属性：


    ```

    element.style.fontFamily = "sans-serif";

    ```


    +   float是JavaScript的保留关键字。在JavaScript中，CSS的float样式名对应CSS2Properties的cssFloat属性。'
  - '[PAGE 160]


    # 3.3.7 层叠样式单和动态HTML


    （2）使用样式属性


    在使用CSSProperties对象的属性时，要记住，所有值必须是字符串，而且必须是有单位的。不论是设置还是读取。


    ```

    e.style.marginLeft = "30px";

    var totalMarginWidth = parseInt(e.style.marginLeft) + parseInt(e.style.marginRight);
    //相同单位时

    ```


    有些CSS属性是其它属性的简化形式，CSSProperties对象也有相应与这些简化属性的属性。例如：


    ```

    e.style.margin = topMargin + "px " + rightMargin + "px " + bottomMargin + "px
    " + leftMargin + "px";

    ```


    但使用简化属性通常并不方便。


    再次强调：CSSProperties对象只能设置单个元素的内联属性，也只能读取单个元素的内联属性（包括由CSSProperties对象设置的）。它没有提供查询CSS级联样式的方法，也没有提供判断应用到给定元素的完整样式集合的方法。'
  - '[PAGE 161]


    # 3.3.7 层叠样式单和动态HTML


    (3) DHTML动画


    用JavaScript和CSS能够实现的最强大的DHTML功能是动画。DHTML动画没有什么特殊之处，所需要做的只是周期性地改变元素的一个或多个样式属性。例如：


    ```

    <div id="urgent">

    <h1>Red Alert!</h1>The Web server is under attack!

    </div>

    <script>

    var e = document.getElementById("urgent");

    var colors = ["white", "yellow", "orange", "red"]; //特殊色

    var nextColor = 0;

    setInterval("e.style.backgroundColor=colors[nextColor++%colors.length];", 500);

    </script>

    ```


    所有DHTML动画都要是用window对象的setInterval()或setTimeout()方法。'
  - '[PAGE 162]


    # 3.3.7 层叠样式单和动态HTML


    （4）DHTML动画举例

    由于代码较长，请参看：3-8.html。

    此例演示了下列功能：


    +   1. 具有动画功能的HTML标签 `<marquee>`。它不属于W3C标准，可酌情使用。

    +   2. 使用css进行剪切

    +   3. 使用javascript和css实现动画效果。

    +   4. 使用javascript的事件处理实现动画控制。'
  - '[PAGE 163]


    # 3.3.7 层叠样式单和动态HTML


    # 2、关于样式和样式表的其它DOM API


    对于想创建DHTML的脚本作者，使用CSSProperties对象的属性控制HTML元素的内联样式通常就足够了，但这毕竟只是CSS的DOM API的一部分。其它DOM
    API则提供了诸如确定元素的完整样式集合、处理或创建CSS样式表单，甚至覆盖内联样式的接口。使用时可以查询相关文档。'
