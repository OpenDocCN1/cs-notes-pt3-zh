  - '[PAGE 335]


    # 5.6.6 处理事件


    ② 加载事件


    用于使用AJAX加载的页面：


    +   - pagebeforeload: 就在AJAX加载页面前。

    +   - pageload: 页面已加载。

    +   - pageloadfailed: 页面加载失败时。


    ③ 显示事件


    用于处理页面的显示或隐藏事件：


    +   - pagebeforechange: 页面改变及过渡之前。

    +   - pagechange: 页面刚刚改变。

    +   - Pagechangefailed: 页面改变失败时。

    +   - pagebeforeshow: 在页面以过渡方式显示之前。

    +   - Pageshow: 页面刚刚以过渡方式在屏幕上显示。

    +   - Pagebeforehide: 页面即将隐藏前。

    +   - Pagehide: 页面刚刚完成卸载及隐藏。'
  - "[PAGE 336]\n\n# 5.6.6 处理事件\n\n# 3、组件事件\n\n每个能动态显示或隐藏内容的组件，例如collapsible等，都会触发一个updateLayout事件，表示页面布局已经发生了变化。有时可能需要监听这个事件，以便更新其上的其它内容。\n\
    \n# 4、方向事件\n\n移动设备可以旋转，至少会有两个不同的方向。jQuery Mobile提供了一个orientationchange事件，可以附加在document上。例如：\n\
    \n```\n```javascript\n$(document).bind(\"orientationchange\", function(orientation)\
    \ {\n    if (orientation == \"landscape\") {\n        // We are now in landscape\n\
    \    } else {\n        // We are now in portrait\n    }\n});\n});\n```\n```"
