    \n- ^ : 值在字符串的开始\n- $ : 值在字符串的结尾\n- * : 值可以在字符串的任意位置\n- ! : 对值取反\n\n下面将为4-2-1.html中的链接添加样式。\n\
    \n```\n/* 4-2-1.css */\na { color: #00c;}\na.mailto {\n    background: url(email.png)\
    \ no-repeat 100% 2px;\n    padding-right: 18px;}\na.pdflink {\n    background:\
    \ url(pdf.png) no-repeat 100% 0;\n    padding-right: 18px;}\na.henrylink {\n \
    \   background-color: #fff;\n    padding: 2px;\n    border: 1px solid #000;}\n\
    /* 4-2-1.js */\n$(document).ready(function() {\n    $(\"a[href^=\\\"mailto:\\\"\
    ]\").addClass('mailto');\n    $(\"a[href$=\\\".pdf\\\"]\").addClass('pdflink');\n\
    \    $(\"a[href^=\\\"http\\\"][href*=\\\"henry\\\"]\").addClass('henrylink');\n\
    });\n```\n\n注：这里使用了组合的属性选择符，它们是“与”的关系。\n\n### 4.2.4 jQuery自定义选择符\n\njQuery自定义选择符的语法与CSS中的伪类选择符语法相同，即选择符以冒号（：）开头。它通常跟在一个CSS选择符后面，基于已经选择的元\
    \ 素集的位置来查找元素。例如：\n$(\"div.horizontal:eq(1)\")\n用来确定原选择集中的第二个元素（JavaScript中的编号从0开始）。\n\
    需要注意的是，由于CSS中的编号则是从1开始的，所以：\n$(\"div:nth-child(1)\")\n获取的是作为其父元素的第一个子元素的 所有div元素，也可以写为：\n\
    $(\"div:first-child\")。\n下面介绍jQuery中的三个十分有用的自定义选择符:odd、:even和contains()。\n\n###\
    \ 4.2.4 jQuery自定义选择符\n\n4-2-2.html: 两个表格\n\n# Shakespeare's Plays\n\nAs You Like\
    \ It        Comedy\nAll's Well that Ends Well  Comedy 1601\nHamlet           \
    \       Tragedy 1604\nMacbeth                 Tragedy 1606\nRomeo and Juliet \
    \       Tragedy 1595\nHenry IV, Part I        History 1596\nHenry V          \
    \       History 1599\n\n# Shakespeare's Sonnets\n\nThe Fair Youth  1-126\nThe\
    \ Dark Lady  127-152\nThe Rival Poet 78-86\n\n```\n/* 4-2-2.css */\n.alt {\n \
    \   background-color: #ccc;\n}\n/* 4-2-2.js */\n$(document).ready(function() {\n\
    \    //$('tr:even').addClass('alt');\n    $('tr:nth-child(odd)').addClass('alt');\n\
    \    $('td:contains(Henry)').addClass('highlight');\n});\n```\n\n**注意：**\n\n-\
    \ ① 这里使用的 **:nth-child()** 是 jQuery 中唯一从 1 开始计数的选择符。它的参数可以是数值、**odd** 或 **even**。\n\
    - ② **contains()** 选择符区分大小写。\n"
  mdcn: "\n\n## 4.1.3 第一个jQuery驱动的页面\n\n## 6.开发工具\n\n推荐适用firefox浏览器及其firebug工具\n\n\
    ## 4.2 选择元素\n\n这里所说的元素即DOM元素。jQuery不仅利用了CSS选择元素的方式，而且还自定义了它独有的选择符。\n\n### 4.2.1\
    \ DOM\n\n文档对象模型是JavaScript和网页之间的接口，它以对象网络(树)而非文本的形式来表现HTML的源代码。例如：\n\n### DOM一个例\n\
    \n```html\n<html>\n  <head>\n    <title>the title</title>\n  </head>\n  <body>\n\
    \    <div>\n      <p>This is a paragraph.</p>\n      <p>This is another paragraph.</p>\n\
    \      <p>This is yet another paragraph.</p>\n    </div>\n  </body>\n</html>\n\
    ```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_171_0.png)\n\n### 4.2.2 选择函数$()\n\
    \n在jQuery中，所有选择由$()函数完成。它的参数通常是CSS选择符，返回结果是一个jQuery对象（一个集合对象）。需要说明的是，$是JavaScript的合法标识符，而且很多类似jQuery的JavaScript库都使用了这个标识符。当同时使用多个JavaScript函数库时，是会引起冲突的。\n\
    \n其实在jQuery中，$标识符不过是就jQuery的“别名”。在引起冲突的情况下，需要在自定义的jQuery文件中，将$标识符全部替换为jQuery。\n\
    \n### 4.2.3 CSS选择符\n\njQuery支持几乎所有CSS选择符。有三种基本的CSS选择符：标签名、ID和类。它们可以单独使用，也可以与其它选择符组合使用。\n\
    \n| 选择符 | CSS | jQuery | 说明 |\n|---|---|---|---|\n| 基本的选择符 |  |  |  |\n| 标签名 |\
    \ p{} | $('p') | 取得文档中的所有段落 |\n| ID | #some-id{} | $('#some-id') | 取得文档中ID为some-id的一个元素\
    \ |\n| 类 | .some-class{} | $('.some-class') | 取得文档中类为some-class的所有元素 |\n\njQuery支持从CSS1到CSS3的几乎所有选择符，只要启用JavaScript，你不必关心浏览器支持什么版本。\n\
    \n通过在jQuery中使用CSS选择符，4-2-1.html利用一个无序列表实现了一个常用的导航菜单。\n\n### 4.2.3 CSS选择符\n\n4-2-1.html:\
    \ 一个无序列表\n\n# 选定的莎士比亚戏剧\n\n- 喜剧\n  - *《如你所愿》*\n  - 一切顺利终有好\n  - 《仲夏夜之梦》\n  - 《第十二夜》\n\
    - 悲剧\n  - *《哈姆雷特》*\n  - 《麦克白》\n  - 《罗密欧与朱丽叶》\n- 历史剧\n  - 亨利四世 (email)\n    - 第一部分\n\
    \    - 第二部分\n  - *《亨利五世》*\n  - 《理查二世》\n\n### 4.2.3 CSS选择符\n\n- 1. 基于列表项的级别添加样式\n\
    \  1）使顶级项水平排列。\n  2）为非顶级项添加样式\n\n```\n/* 4-2-1.css */\n.horizontal {\n    float:\
    \ left;\n    list-style: none;\n    margin: 10px;\n}\n.sub-level {\n    background:\
    \ #ccc;\n}\n```\n\n```\n/* 4-2-1.js */\n$(document).ready(function() {\n    $('#selected-plays\
    \ > li').addClass('horizontal');\n    $('#selected-plays li:not(.horizontal)').addClass('sub-level');\n\
    });\n```\n\n**注：** 这里使用了新的否定式伪类选择符 **:not(.horizontal)**\n\n### 4.2.3 CSS选择符\n\
    \n## 2. 属性选择符\n\n属性选择符是CSS选择符中特别有用的一类选择符，HTML标记的属性放在方括号[]中，用于选择具有该属性的标记（元素）。\n\
    \n在属性选择符中可以使用通配符：\n\n- ^ : 值在字符串的开始\n- $ : 值在字符串的结尾\n- * : 值可以在字符串的任意位置\n- ! :\
    \ 对值取反\n\n下面将为4-2-1.html中的链接添加样式。\n\n```\n/* 4-2-1.css */\na { color: #00c;}\n\
    a.mailto {\n    background: url(email.png) no-repeat 100% 2px;\n    padding-right:\
    \ 18px;}\na.pdflink {\n    background: url(pdf.png) no-repeat 100% 0;\n    padding-right:\
    \ 18px;}\na.henrylink {\n    background-color: #fff;\n    padding: 2px;\n    border:\
    \ 1px solid #000;}\n/* 4-2-1.js */\n$(document).ready(function() {\n    $(\"a[href^=\\\
    \"mailto:\\\"]\").addClass('mailto');\n    $(\"a[href$=\\\".pdf\\\"]\").addClass('pdflink');\n\
    \    $(\"a[href^=\\\"http\\\"][href*=\\\"henry\\\"]\").addClass('henrylink');\n\
    });\n```\n\n注：这里使用了组合的属性选择符，它们是“与”的关系。\n\n### 4.2.4 jQuery自定义选择符\n\njQuery自定义选择符的语法与CSS中的伪类选择符语法相同，即选择符以冒号（：）开头。它通常跟在一个CSS选择符后面，基于已经选择的元\
    \ 素集的位置来查找元素。例如：\n$(\"div.horizontal:eq(1)\")\n用来确定原选择集中的第二个元素（JavaScript中的编号从0开始）。\n\
    需要注意的是，由于CSS中的编号则是从1开始的，所以：\n$(\"div:nth-child(1)\")\n获取的是作为其父元素的第一个子元素的 所有div元素，也可以写为：\n\
    $(\"div:first-child\")。\n下面介绍jQuery中的三个十分有用的自定义选择符:odd、:even和contains()。\n\n###\
    \ 4.2.4 jQuery自定义选择符\n\n4-2-2.html: 两个表格\n\n# 莎士比亚的戏剧\n\n如你所愿        喜剧\n一切顺利终有好\
    \  喜剧 1601\n哈姆雷特                  悲剧 1604\n麦克白                 悲剧 1606\n罗密欧与朱丽叶\
    \        悲剧 1595\n亨利四世，第一部分        历史剧 1596\n亨利五世                 历史剧 1599\n\n\
    # 莎士比亚的十四行诗\n\n佳人  1-126\n黑暗女子  127-152\n竞争诗人 78-86\n\n```\n/* 4-2-2.css */\n\
    .alt {\n    background-color: #ccc;\n}\n/* 4-2-2.js */\n$(document).ready(function()\
    \ {\n    //$('tr:even').addClass('alt');\n    $('tr:nth-child(odd)').addClass('alt');\n\
    \    $('td:contains(Henry)').addClass('highlight');\n});\n```\n\n**注意：**\n\n-\
    \ ① 这里使用的 **:nth-child()** 是 jQuery 中唯一从 1 开始计数的选择符。它的参数可以是数值、**odd** 或 **even**。\n\
    - ② **contains()** 选择符区分大小写。\n\n"
