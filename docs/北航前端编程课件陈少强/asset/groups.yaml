    ### 8、for/in语句\n\n针对对象（包括数组）的循环语句，用于枚举对象所有属性。C和C++语言中都没有相应的语句。其语法为：\n\n```js\n\
    for(变量 in 对象)\n```\n\n循环体；// 或称子语句\n\n当循环体执行之前，对象的一个属性名被作为字符串赋值给变量。在循环体内部可以使用这个变量和“[]”运算符来查询对象的属性值。例如，下面的for/in循环将输出一个对象和一个数组的所有属性名及它的值：\n\
