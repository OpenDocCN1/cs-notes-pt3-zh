    +   - scale (比例)指图形和文本的放大比例，视口也随之放大。\n\n可以指定禁止用户改变页面比例：\n\n```\n```html\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1,\n    user-scalable=no\"\
    >\n```\n```"
  - '[PAGE 239]


    # 5.2.2 文档结构


    jQuery Mobile的文档结构主要由页面(page)构成。一个页面仅仅是一个带有data-role="page"属性的div元素。一个HTML文档可以包含多个页面。


    使用简单的HTML标记（例如超链接标记a），可以连接到同一个HTML文档中的另一个页面，也可以连接到外部HTML文档中的页面。


    # 1、 data-role属性


    jQuery Mobile使用标准的HTML标记，如div标记。只要给这些标记增加data-role属性，就可以使其具有不同的作用。例如<div data-role="page">


    HTML5有一个自定义数据属性的特性，可以用来在标记上添加任何形如data-*的属性。data-role只不过是jQuery Mobile使用该特性添加的一个自定义数据属性。jQuery
    Mobile中大量使用这种特性。'
  - '[PAGE 240]


    # 5.2.2 文档结构


    # 2、主题（theme）


    jQuery Mobile使用主题机制来定义用户界面的可视化表现。每一个界面元素（如页面、按钮或组件）都可以使用主题中不同的色样（swatch）。


    所谓主题，是一组排版、样式以及颜色，它定义了一种风格。每个主题都包含一组色样。色样为元素显示提供了不同的选择，在应用中可以随时更换色样。色样由a到z的字母标识，默认主题包含了从a到e的定义（见下图），为自定义色样预留了很多字母。


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_240_0.png)


    默认主题的从a到e的色样'
  - '[PAGE 241]


    # 5.2.2 文档结构


    色样通过在jQuery Mobile的HTML元素上使用data-theme属性来指定，例如：data-theme="e"。


    色样具有CSS的层叠特性，如果为父元素指定了一个色样，除非另外指定，它的子元素也将使用这个色样。


    使用默认主题的色样时，有一些默认的约定。见下表：


    | 字母 | 描述 | 颜色 |

    |---|---|---|

    | a | 最高视觉优先级（缺省用于工具栏） | 黑色 |

    | b | 次最高视觉优先级 | 蓝色 |

    | c | 基准优先级（适用于大多数情况） | 银色 |

    | d | 次最高优先级的替代方案 | 灰色 |

    | e | 强调 | 黄色 |'
