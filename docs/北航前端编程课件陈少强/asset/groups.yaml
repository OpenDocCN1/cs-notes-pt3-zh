    # 2.6.1 CSS选择器


    8）属性选择器


    属性选择器可以根据元素的属性及属性值来选择元素。id和class也适用该选择器。其格式为：名称[表达式]。例如：


    ```

    a[href][title^="def"]{color:red;}

    ```


    将有href属性且title属性以def开头的超链接的文本设置为红色


    9）类型标记选择器举例：


    ```

    h2.p1{font-size:12px; font-family:arial}

    ```


    为p1类型的h2标记指定字体及大小


    10）组合选择器举例：


    上述各种选择器均可进行组合。


    ```

    h1 .p1{...}

    #content h1{...}

    h1 .p1, #content h1{...}

    h1 #content h2{...}

    ```'
