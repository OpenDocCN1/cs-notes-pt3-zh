    # 4.4 样式与动画


    在前面几节中，为了修改文档的外观，都是先在单独的样式表中为类定义好样式，然后再通过jQuery来添加或者移除这些类。一般而言，这是为HTML应用CSS样式的首选方式。但jQuery还提供了更加灵活的控制样式的方式。


    # 4.4.1 修改内联CSS


    jQuery提供了.css()方法，用于获取和设置jQuery对象的CSS属性：


    ```

    .css(''property''); //获取CSS样式

    ```


    ```

    .css(''property'', ''value''); //设置CSS样式

    ```


    其中的属性名既可以用连字符形式的CSS表示法(如：background-color)，也可以是JavaScript中使用的驼峰表示法(如：backgroundColor)，而且驼峰表示法的属性名可以省略引用。


    设置属性时，也可以通过使用由属性-值对构成的对象常量，同时设置多个CSS属性，即：


    ```

    .css({''property1'': ''value1'', ''property2'': ''value2''});

    ```'
