    >\n  <a href=\"#\" data-role=\"button\">Button 1</a>\n  <a href=\"#\" data-role=\"\
    button\">Button 2</a>\n  <a href=\"#\" data-role=\"button\">Button 3</a>\n  </div>\n\
    \  ```\n\n  ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_277_0.png)\n\n  也可以通过在控件组上使用\
    \ `data-type=\"horizontal\"` 属性来创建水平布局的分组控件。\n\n- **5、创建自定义图标**\n\n  jQuery Mobile的系统图标使用了Sprites技术。该技术的一个图标文件中有一组图标，以此来提高加载效率。\n\
    \n  这里，我们准备的图标文件仅包含一个图标。具体要求是：\n\n  - 带alpha位面的PNG-8图像格式。\n  - 18*18像素。\n  - 白色或透明背景。其实任何背景都可以，jQuery\
    \ Mobile会自动为图标添加白色背景。\n  - 不带边框。需要时，系统会自动添加。\n  - 图案应该比18*18像素小一些，因为要渲染到18像素的圆形中。\n\
    \  - 不需要边角图案，因为要绘制在圆形中，用不上。\n\n  另外还需要为高分辨率设备准备一个36*36像素的图标文件作为备选。因此一个图标需要准备两个图标文件。\n\
    \n  准备好图标文件后，需要进行下列工作：\n\n  - ① 为每个自定义图标确定一个不重复的图标名，推荐的名称格式为：`<应用名>-<图标名>`，例如：`myapp-tweet`。\n\
    \  - ② 使用①中的图标名，创建一个CSS样式，其选择器为 `.ui-icon-<name>`，例如 `.ui-icon-myapp-tweet`，在其中指明使用的图标文件。\n\
    \  - ③ 使用CSS3媒体查询格式为两倍制式分辨率的设备创建备选的相同选择器的CSS样式。需要强制背景尺寸为 `18*18`，因为在这些设备上px是虚拟的点，每一个对应两个真实的像素。\n\
    \n- **6、图标的位置**\n\n  默认情况下，每个图标都被渲染在按钮文字的左侧。可以使用属性 `data-iconpos` 来改变这个位置，可能的值包括：right、left（缺省值）、bottom和top。见下例：\n\
    \n  ```html\n  <a href=\"#\" data-role=\"button\" data-icon=\"help\" data-iconpos=\"\
    right\">Help</a>\n  <a href=\"#\" data-role=\"button\" data-icon=\"help\" data-iconpos=\"\
    left\">Help</a>\n  <div data-role=\"controlgroup\">\n  <a href=\"#\" data-role=\"\
    button\" data-icon=\"help\" data-iconpos=\"bottom\">Help</a>\n  <a href=\"#\"\
    \ data-role=\"button\" data-icon=\"help\" data-iconpos=\"top\">Help</a>\n  </div>\n\
    \  ```\n\n  ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_282_0.png)\n\n- **7、 纯图标按钮**\n\
    \n  这种按钮对触摸界面来说太小了，因此很少使用。要创建一个纯图标按钮，只需在按钮上指定 `data-iconpos=\"notext\"` 属性。所以\
    \ `data-iconpos` 属性还有第五个值！\n\n- **8、 图标阴影**\n\n  jQuery Mobile有一个可删除图标阴影效果的属性。要实现这个效果，只需要在按钮上指定\
    \ `data-iconshadow=\"false\"`。\n\n## 5.4 列表组件\n\n列表在jQuery Mobile框架中功能强大而且用途广泛，几乎所有移动应用中都至少会包含一个列表。\n\
    \n在jQuery Mobile的世界里，列表就是一个具有 `data-role=\"listview\"` 属性的HTML有序（ol）或无序（ul）列表。\n\
    \n例见：5-4-1.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_284_0.png)\n\n注意代码中的列表项元素。由于HTML5没有使用XML语法，所以该元素可以没有关闭标记。\n\
    \n### 5.4.1 整页列表与插入列表\n\n默认情况下列表占据整个页面，称为整页列表。如果希望与其它HTML内容混排，可以使用插入列表。这只需要在对应的列表元素上添加\
    \ `data-inset=\"true\"` 属性即可。\n见例：5-4-2.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_285_0.png)\n\
    \n### 5.4.2 视觉分隔符\n\n视觉分隔符就是带有属性 `data-role=\"list-divider\"` 的li元素。\n使用这个技术可以将列表元素划分为不同的组。可以通过改变色样高亮显示每个视觉分隔符。\n\
    \n见例：5-4-3.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_286_0.png)\n\n###\
    \ 5.4.3 交互行\n\n如果一个列表元素包含一个 `<a>` 元素，则该行成为一个能响应触摸或鼠标点击的交互行。jQuery Mobile会自动在交互行的右侧添加漂亮的箭头（可通过\
    \ `data-icon` 属性改变或取消 `data-icon=\"false\"`），提醒用户该行是可触摸的。\n\n交互行的高度也与只读行不同，经过了优化设计，更有利于触摸。如果某交互行的文本超过一行，则行末的文本会被省略号代替。并且选中的行可能被添加焦点边框。\n\
    \n例见：**5-4-4.html**\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_287_0.png)\n\n\
    - **一、内嵌列表**\n\n  内嵌列表就是位于某一个jQuery Mobile列表的某一列表项（li）中的另一个jQuery Mobile列表。jQuery\
    \ Mobile会隐式地为一个内嵌列表生成一个新的页面，并会自动处理各个层级的关系。\n\n  需要为内嵌列表所在的li标记中填写适当文本。它不仅是列表项的标题，而且也是隐式创建的页面标题。\n\
    \n  见例：5-4-5.html\n\n  ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_288_0.png)\n\n\
    - **2、分裂行列表**\n\n  如果一个jQuery Mobile列表的某一列表项（li）中包含两个超链接元素a，则它自动被当作分裂行处理。即同一行中包含两个交互操作。\n\
    \n  按照iOS用户界面准则，第一个操作应该是详情，第二个操作应该是编辑。\n\n  默认情况下，jQuery Mobile会为右边第二个操作自动添加一个带边框的箭头图标，所以它不必带有文本。\n\
    \n  见例：5-4-6.html\n\n  ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_289_0.png)\n\n\
    \  可以在对应的ul标签（而不是li标签）上通过 `data-split-theme` 和 `data-split-icon` 来为第二个操作分别指定不同的主题和图标。\n\
    \n  列表与按钮使用的是同一组图标，但同一个图标在列表中显示时多了一个圆角边框。\n\n- **3、有序列表**\n\n  有序列表的各个列表项会被自动编号。\n\
    \n  例：5-4-7.html\n\n  ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_290_0.png)\n\n\
    ### 5.4.4 使用图片\n\n每一行都可以用指定的图片来标记，而且可以添加两种不同类型的图片：图标和缩略图。\n\n- **1、行图标**\n\n \
    \ 行图标是显示在列表项左侧的图标，而不是交互行右侧的箭头或分裂行列表中的图标。\n\n  行图标是位于标记中的一个 16*16 像素的图片（不是 jQuery\
    \ Mobile 中所说的图标），由 `ui-li-icon` 类定义。例如：\n\n  ```html\n  <li>\n      <img src=\"\
    /icons/email.png\" class=\"ui-li-icon\">\n      Send by e-mail\n  </li>\n  ```\n\
    \n  行图标通常用于对可做操作的提示，例如：删除、编辑、共享等。\n\n### 5.4.5 附加内容\n\n至此，每个列表都只有一列文本内容。虽然可以添加缩略图或图标，但文本列只有一列。可以为每一行添加一个次级列，用于显示补充信息。\n\
    \n这个功能可以使用任何带有 **ui-li-aside** 类的 HTML 元素来实现，例如 span 或 div 元素。\n\n见例：**5-4-8.html**\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_293_0.png)\n"
