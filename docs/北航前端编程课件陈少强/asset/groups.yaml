  - "[PAGE 111]\n\n# 3.3.1 Web浏览器中的JavaScript\n\n# 3) 事件处理程序\n\n由于客户端JavaScript的事件是由HTML元素引发的，因此事件处理程序被定义为这些元素的属性值。例如：\n\
