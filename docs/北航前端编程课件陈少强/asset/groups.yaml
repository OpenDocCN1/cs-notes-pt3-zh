  - '[PAGE 201]


    # 4.3.5 改变事件的传播过程


    3、默认操作


    有些元素有默认操作，例如a元素的默认操作是加载一个新页面。


    这种默认操作是事件的.stopPropagation()方法所无法阻止的，因为默认操作不是在正常的事件处理传播中发生的。


    事件的.preventDefault()方法则可以在触发默认操作之前终止它。


    事件传播和默认操作是相互独立的两套机制，任何一个都可以在另一个发生时被停止。可以在事件处理程序最后返回false，这是在事件对象上同时调用.stopPropagation()和.preventDefault()的一种简写方法。'
  - "[PAGE 202]\n\n# 4.3.5 改变事件的传播过程\n\n4、事件委托\n\n事件冒泡并不是总带来问题。事件委托就是利用了冒泡的事件传播特性，借助一个父元素上的事件处理程序完成很多工作。例如：\n\
    \n```\n/* 在4-3-7.js中 */\n$(document).ready(function() {\n  $('#switcher').click(function(event)\
    \ {\n    if ($(event.target).is('button')) {\n      var bodyClass = event.target.id.split('-')[1];\n\
    \      $('body').removeClass().addClass(bodyClass);\n      $('#switcher button').removeClass('selected');\n\
    \      $(event.target).addClass('selected');\n      event.stopPropagation();\n\
    \    }\n  });\n});\n```\n\n这里的.is()方法接受一个选择符表达式，然后用选择符来检测当前的jQuery对象。如果集合中有至少一个元素与选择符匹配，.is()返回true。它比.hasClass()使用范围更大。"
  - "[PAGE 203]\n\n# 4.3.5 改变事件的传播过程\n\n5、事件委托的方法\n\njQuery专门提供了一组利用事件委托的方法，包括：.live()、.die()、.delegate()和.undelegate()。例如：\n\
    \n```\n$('#switcher button').live('click', function() {\n  var bodyClass = event.target.id.split('-')[1];\n\
    \  $('body').removeClass().addClass(bodyClass);\n  $('#switcher button').removeClass('selected');\n\
    \  $(this).addClass('selected');\n});\n```\n\n在后台，jQuery会把单击处理程序绑定到document身上，并且检查event.target（或其父元素）是否与传入的选择符表达式(#switcher\
    \ button)匹配。如果匹配，jQuery会把关键字this映射到匹配的元素上。这样就避免了把事件绑定到多个子元素，提高了代码运行效率。而且.live()方法可以将事件处理程序绑定到将来插入到DOM中的元素。"
  - "[PAGE 204]\n\n# 4.3.6 移除事件处理程序\n\n移除事件处理程序可以使用unbind()方法。例如：\n\n```\n/* 在4-3-8.css中\
    \ */\n$(document).ready(function() {\n    $('#switcher').click(function(event)\
    \ {\n        if (!$(event.target).is('button')) {\n            $('#switcher button').toggleClass('hidden');\n\
    \        }\n    });\n    $('#switcher-narrow, #switcher-large').click(function()\
    \ {\n        $('#switcher').unbind('click');\n    });\n});\n```\n\n这里的.unbind()把#switcher上所有的click事件都取\
    \ 消了，在本例中也影响到了按钮上的click事件。"
  - "[PAGE 205]\n\n# 4.3.6 移除事件处理程序\n\n1、事件的命名空间\n为了使对.unbind()的调用更具有针对性，可以使用事件的命名空间。方法是为事件增加命名空间后缀。例如：\n\
    \n```\n/* 在4-3-9.css中 */\n$(document).ready(function() {\n    $('#switcher').bind('click.collapse',\
    \ function(event) {\n        if (!$(event.target).is('button')) {\n          \
    \  $('#switcher button').toggleClass('hidden');\n        }\n    });\n    $('#switcher-narrow,\
    \ #switcher-large').click(function() {\n        $('#switcher').unbind('click.collapse');\n\
    \    });\n});\n```\n\n对事件处理系统而言，后缀.collapse是不可见的。就是说，这里仍然会像编写.bind('click')一样，让注册的函数响应单击事件。但在绑定和解除绑定时，这个后缀却有意义。"
  - "[PAGE 206]\n\n# 4.3.6 移除事件处理程序\n\n重新绑定事件\n已经移除的事件响应可以重新绑定。这时应当使用命名函数。例如：\n\n\
    ```\n/* 在4-3-10.css中 */\n$(document).ready(function() {\n    var toggleSwitcher\
    \ = function(event) {\n        if (!$(event.target).is('button')) {\n        \
    \    $('#switcher button').toggleClass('hidden');\n        }\n    };\n    $('#switcher').bind('click',\
    \ toggleSwitcher);\n    $('#switcher button').click(function() {\n        $('#switcher').unbind('click',\
    \ toggleSwitcher);\n        if (this.id === 'switcher-default') {\n          \
    \  $('#switcher').bind('click', toggleSwitcher);\n        }\n    });\n});\n```"
  - '[PAGE 207]


    # 4.3.6 移除事件处理程序


    如上例所示，使用命名函数不仅可以重复利用，而且可以带来另外一个好处：不必再使用事件命名空间，因为unbind函数将一个函数作为第二个参数时，它只会移除对该处理函数的绑定。


    对于只需触发一次，随后就要立即解除绑定的函数还有一种简写绑定方法：.one()，例如：


    ```

    ```javascript

    $(''#switcher'').one(''click'', toggleSwitcher);

    ```

    ```'
  - "[PAGE 208]\n\n# 4.3.7 模拟事件操作\n\n可以通过程序模拟触发事件，以便调用相应的事件处理程序。这需要调用.trigger()方法。例如：\n\
    \n```\n$(document).ready(function() {\n  $('#switcher').trigger('click');\n});\n\
    ```\n\n.trigger()方法具有与.bind()方法同样的简写方式。当使用不带参数的事件名函数时，结果将是触发操作而不是绑定操作。例如：\n\n\
    ```\n$(document).ready(function() {\n  $('#switcher').click();\n});\n```\n\n#\
    \ 键盘事件：\n\n键盘事件与鼠标事件稍有不同。键盘事件可以分为两类：直接对键盘按键给出的响应事件(keyup和keydown)和对文本输入给出的响应事件(keypress)。\n\
    \n如果只想知道用户按了几个键中的哪个键，应该侦听keyup和keydown事件；如果想知道用户输入的是什么字符，应当侦听keypress事件。"
  - "[PAGE 209]\n\n# 4.3.7 模仿事件操作\n\n键盘事件对象的.keyCode属性中包含着被按下的那个键的标识符。对字母键来说，这个标示符就是相应大写字母的ASCII值。键盘事件的目标对象是当前具有输入焦点的元素，如果对此并不关心，可以通过冒泡，将事件绑定到document对象上，例如：\n\
    \n```\n/* 在4-3-11.css中 */\n$(document).ready(function() {\n    var triggers =\
    \ {\n        D: 'default',\n        N: 'narrow',\n        L: 'large'\n    };\n\
    \    $(document).keyup(function(event) {\n        var key = String.fromCharCode(event.keyCode);\n\
    \        if (key in triggers) {\n            $('#switcher-' + triggers[key]).click();\n\
    \        }\n    });});\n```"
