    \n涉及运算符的概念包括：\n\n- **1）运算数的个数**：根据运算符需要的运算数的个数，可以将运算符分为：\n  - 一元运算符：例如：“-”（负号运算符）\n\
    \  - 二元运算符：最多的运算符，例如：“+”、“-”、“*”、“/”\n  - 三元运算符：例如：“？：”（条件运算符）\n- **2）运算数的类型**：不同的运算符需要不同类型的运算数，计算结果的数据类型也不尽相同。在可能的情况下，JavaScript会将运算数转换为适当的类型。例如：\n\
    \n```js\n\"a\" ** \"b\"; //非法\n\"3\" ** \"5\"; //合法，结果为数字15\n```\n\n- **3）运算符的优先级**：优先级控制执行操作的顺序。考虑表达式：\n\
    \n```js\nw = x + y * z;\n```\n\n由于乘法运算符“*”的优先级高于加法运算符“+”的优先级，所以先执行乘法，再执行加法。赋值运算符“=”的优先级最低，所以在右边的操作都结束后才会被执行。\n\
    \n使用括号可以提高运算符的优先级。例如：\n\n```js\nw = (x + y) * z;\n```\n\n运算符的优先级定义符合常规，必要时可查阅手册。\n\
    \n### 4、一些特殊的运算符\n\n- **1）in**\n  - 用法：字符串 in 对象\n  - 用途：检查对象中是否存在以字符串为名字的属性（包括方法）。\n\
    \  - 举例：`var point={x:1,y:2}; var b=\"x\" in point; //返回true`\n- **2）void**\n\
    \  - 用法：`void` 任意\n  - 用途：舍弃运算数的值，返回`undefined`。\n  - 举例：`var a=0; void a; //返回undefined，但并没有改变a的值。`\n\
    - **3）typeof**\n  - 用法：`typeof` 任意\n  - 用途：返回运算数类型的字符串。\n  - 举例：`var i=1; var\
    \ s = typeof i; //返回“number”`\n- **4）instanceof**\n  - 用法：对象 instanceof 对象类名\n\
    \  - 用途：判断左边对象是否是右边类的一个实例。\n  - 举例：\n    ```js\n    var a = [1,2,3];\n    var\
    \ b = a instanceof Array; //值为true\n    var b = a instanceof Object; //值为true，数组都是对象\n\
    \    ```\n- **5）new**\n  - 用法：new 构造函数(参数表)\n  - 用途：创建一个指定类型的新对象。\n  - 举例：`var\
    \ d = new Date();`\n\n## 3.2.5 语句\n\n语句是完整的句子或命令，JavaScript程序就是一些语句的集合。语句的形式多种多样：\n\
    \n### 1、表达式语句\n\n在JavaScript中，最简单的语句莫过于表达式了。例如：\n\n```js\nvar a=0; a++;\n```\n\
    \n### 2、复合语句\n\n将一些语句用花括号括起来，就形成了一个复合语句，这样它就可以出现在需要使用单个语句的地方。例如：\n\n```js\n{x\
    \ = Math.PI; cx = Math.cos(x);}\n```\n\n注意：花括号的后面不需要有分号，而且这不是不良习惯。\n\n### 3、if语句\n\
    \n该语句用来实现有条件地选择执行语句，与C语言中的if语句用法基本相同。例如：\n\n```js\nif(n==1) {\n    //执行代码块#1\n\
    }\nelse if(n==2) {\n    //执行代码块#2\n}\nelse {\n    //执行代码块#3\n}\n```\n\n### 4、switch语句\n\
    \n用来实现简单的多分支结构，该语句与C语言中的switch语句用法基本相同。例如：\n\n```js\nswitch(n) {\n    case 1:\n\
    \        //执行代码块#1\n        break;\n    case 2:\n        //执行代码块#2\n        break;\n\
    \    default:\n        //执行代码块#3\n}\n```\n\n注意：switch后的表达式与case后的常量表达式的“匹配”指“===”。\n\
    \n### 5、while语句\n\n循环语句，该语句与C语言中的while语句用法基本相同。例如：\n\n```js\nvar count = 0;\n\
    while(count < 10) {\n    document.write(count+\"<br>\");\n    count++;\n}\n```\n\
    \n### 6、do/while语句\n\n至少执行一次的循环语句，与C语言中的do/while语句用法基本相同。\n\n```js\nvar count\
    \ = 0;\ndo {\n    document.write(count+\"<br>\");\n    count++;\n} while(count\
    \ < 10);\n```\n\n### 7、for语句\n\n最常用的循环语句，与C语言中的for语句用法基本相同。例如：\n\n```js\nfor(var\
