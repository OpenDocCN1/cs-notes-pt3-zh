    `<div style=\"clear:both\"></div>`\n\n```\n#left{\n  background-color:#ccc;\n\
    \  border:2px solid #333;\n  width:200px;\n  height:300px;\n  float:left;\n}\n\
    #right{\n  background-color:#ccc;\n  border:2px solid #333;\n  width:300px;\n\
    \  height:300px;\n  clear:left;\n  float:left;\n}\n```\n\n### 2.8.7 定位布局\n\n定位布局分为三种，由属性position的值确定。分别是：\n\
    \n- 相对定位：`position:relative`。\n- 绝对定位：`position:absolute`。\n- 固定定位：`position:fixed`。\n\
    \n相对定位指元素依据自己的原有位置进行定位，并保持自己原有站位的影响。具体位置由属性top、right、bottom、left的值确定（top优先于bottom；left优先于right，其实只需要两个）。\n\
    \n绝对定位元素被从文档流中抽出，失去对文档流的影响。若其父元素经过position定位，则其定位是相对于父元素的，否则是相对于页面的。具体位置由样式top、right、bottom、left的值确定（只需要两个）。\n\
    \n固定定位则是依据窗口的位置进行定位，元素不随滚动条滚动。具体位置同样由样式top、right、bottom、left的值确定（只需要两个）。\n\n（1）相对定位举例\n\
    \n```\n```html\n<!-- 例2-8.html -->\n<link rel=\"stylesheet\" type=\"text/css\"\
