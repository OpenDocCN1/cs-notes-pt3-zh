    - 后者优先：同一元素同一样式的定义，后者优先。\n  ```css\n  p{background-color:#ff0000}\n  p{background-color:#00ff00}\n\
    \  ```\n\n## 2.8 CSS页面布局与定位\n\n### 2.8.1 CSS的元素模型\n\nCSS将所有元素视为一个盒状物，称为盒(box)模型。由内容(content)、内边界(padding)、边框(border)和外边界(margin)构成。如下图：\n\
