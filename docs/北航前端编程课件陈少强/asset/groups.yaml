  - '[PAGE 312]


    # 5.5.2 表单元素


    打开非本地选择菜单时，当前菜单上出现一个覆盖层。可以通过data-overlay-theme来指定这个覆盖层的色样。如果某个option元素显式地指定了空值（value=""）或带有属性data-placeholder="true"，则它将作为覆盖层的标题，而不再是一个可选项。见例：5-5-5.html


