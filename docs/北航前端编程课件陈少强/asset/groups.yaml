    # 4.3.2 简单事件


    jQuery为标准的DOM事件都提供了相应的事件简写方法：


    +   - change

    +   - focus

    +   - load

    +   - mouseover

    +   - select

    +   - click

    +   - keydown

    +   - mousedown

    +   - mouseup

    +   - submit

    +   - dblclick

    +   - keypress

    +   - mousemove

    +   - resize

    +   - unload

    +   - error

    +   - keyup

    +   - mouseout

    +   - scroll


    # 4. jQuery事件方法的来历


    jQuery中的大多数事件方法都直接对应标准的DOM事件，也有少数出于跨浏览器优化和方便性考虑而添加的自定义处理方法，例如.ready()方法。另外还有经过标准化的IE同名事件的处理方法，例如：.mouseenter(),
    .mouseleave(), .focusin(),和.focusout()。'
  - "[PAGE 194]\n\n# 4.3.3 复合事件\n\njQuery自定义了两个事件处理方法.toggle()和.hover()。由于它们截取组合的用户操作，并且以多个函数作为响应，因此被称为复合事件处理程序。\n\
    \n+   1. .toggle()\n\n.toggle()方法接受两个参数，这两个参数都是函数。第一次在元素上单击会调用第一个函数，第二次单击会调用第二个函数。这一过程反复循环。下面通过该方法实现4-3-4.html中样式转换器的折叠。\n\
    \n```\n/* 在4-3-4.css中 */\n.hidden {\n    display: none;\n}\n```"
  - "[PAGE 195]\n\n# 4.3.3 复合事件\n\n```\n/* 在4-3-4.js中 */\n$(document).ready(function()\
    \ {\n  $('#switcher h3').toggle(\n    function() {$('#switcher button').addClass('hidden');},\n\
    \    function() {$('#switcher button').removeClass('hidden');}\n  );\n});\n```\n\
    \n在本例这种特殊的情况下，可以使用.toggleClass()方法。例如：\n\n```\n$(document).ready(function() {\n\
    \  $('#switcher h3').click(function() {\n    $('#switcher button').toggleClass('hidden');\n\
    \  });\n});\n```\n\n该方法在自动检查该类是否存在，从而决定是为元素应用还是移除该类名。"
  - "[PAGE 196]\n\n# 4.3.3 复合事件\n\n# 2. .hover()\n\n虽然CSS具有:hover伪类选择符，但它通常只用在链接元素上。jQuery的.hover()方法同.toggle()方法一样，也接受两个函数参数。第一个函数会在鼠标进入被选择元素时执行，而第二个函数会在鼠标离开该元素时执行。通过使用该方法，可以实现4-3-5.html中样式转换器标题的反转效果。\n\
    \n```\n/* 在4-3-5.css中 */\n.hover {\n    cursor: pointer;\n    background-color:\
    \ #afa; }\n```\n\n```\n/* 在4-3-5.js中 */\n$(document).ready(function() {\n    $('#switcher\
    \ h3').hover(\n        function() {$(this).addClass('hover');},\n        function()\
    \ {$(this).removeClass('hover');}\n    );\n});\n```"
  - '[PAGE 197]


    # 4.3.4 事件的旅程


    当页面上发生一个事件时，每个层次上的元素都有机会处理这个事件。事件的处理策略有两种：Netscape的事件捕获和微软的事件冒泡。在事件捕获的过程中，事件首先会交给最外层的元素，接着再交给更具体的元素。见下图：


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_197_0.png)


    相反，在事件冒泡过程中，事件首先发送给最具体的元素，在这个元素获得响应机会之后，事件会向上冒泡到更一般的元素。见下图：


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_197_1.png)'
  - '[PAGE 198]


    # 4.3.4 事件的旅程


    DOM标准同时使用这两种策略：首先，事件从一般元素到具体元素逐层捕获，然后，事件再通过冒泡返回DOM树的顶层。而事件处理程序可以注册到这个过程中的任何一个阶段。


    为了提供跨浏览器的统一性，jQuery始终会在模型的冒泡阶段注册事件处理程序。'
  - "[PAGE 199]\n\n# 4.3.5 改变事件的传播过程\n\nDOM提供了事件对象，其中包含与事件有关的信息，也提供了可以用来影响事件在DOM中传播过程的一些方法。为了使用事件对象，需要为事件处理函数添加一个参数。例如：\n\
    \n```\n```javascript\n$(document).ready(function() {\n    $('#switcher').click(function(event)\
    \ {\n        $('#switcher button').toggleClass('hidden');\n    });\n});\n```\n\
    ```\n\n+   1、事件目标\n\n事件对象中包含着目标元素的信息，即属性.target。\n\n```\n```javascript\n$(document).ready(function()\
    \ {\n    $('#switcher').click(function(event) {\n        if (event.target == this)\
    \ {\n            $('#switcher button').toggleClass('hidden');\n        }\n   \
    \ });\n});\n```\n```"
  - "[PAGE 200]\n\n# 4.3.5 改变事件的传播过程\n\n2、停止事件传播\n\n事件对象提供了一个.stopPropagation()方法，可以阻止事件冒泡。这样就可以不使用event.target\
    \ == this，仍然得到正确的结果。\n\n```\n/* 在4-3-6.css中 */\n$(document).ready(function() {\n\
    \    $('#switcher').click(function(event) {\n        $('#switcher button').toggleClass('hidden');\n\
    \    });});\n$(document).ready(function() {\n    $('#switcher-default').addClass('selected');\n\
    \    $('#switcher button').click(function(event) {\n        var bodyClass = this.id.split('-')[1];\n\
    \        $('body').removeClass().addClass(bodyClass);\n        $('#switcher button').removeClass('selected');\n\
    \        $(this).addClass('selected');\n        event.stopPropagation();\n   \
    \ });});\n```"
