    # 3.2.4 表达式和运算符


    +   1、表达式


    表达式（expression）是JavaScript的一个“短语”，它可以生成一个值。最简单的表达式是一个常量或一个变量。利用运算符可以将简单的表达式合并为复杂的表达式。


    +   2、运算符


    JavaScript有同C语言类似的运算符。运算符有符号型的，例如：+、-、*、/等；也有关键字型的，例如：new、delete、typeof、instanceof等，但它们都是运算符。


    涉及运算符的概念包括：


