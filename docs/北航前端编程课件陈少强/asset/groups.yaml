  - '[PAGE 273]


    # 5.3.2 格式化内容


    2、手风琴组件


    手风琴组件可以将多个可折叠内容聚合起来，一次只有一个面板可见。


    这种组件就是一个带有 data-role="collapsible-set" 属性的容器，以及一组作为子元素的可折叠面板。


    默认情况下，jQuery Mobile 会展开可折叠集合中的最后一个面板。


    如果想默认展开别的面板，只需在想展开的元素上加上 data-collapsed="false" 属性，而在其它面板上加上 data-collapsed="true"。


