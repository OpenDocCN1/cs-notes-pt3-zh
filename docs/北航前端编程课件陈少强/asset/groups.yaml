    Document对象和它呈现给JavaScript的HTML元素集合构成了文档对象模型（DOM）。W3C标准化了DOM，并发布了该标准的两个版本，分别为1级DOM和2级DOM。


    本章介绍的DOM早于W3C标准，但几乎所有的浏览器都支持它，因此它是事实上的工业标准，被称为0级DOM。'
