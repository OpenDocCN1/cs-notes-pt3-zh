    # 5.6.2 配置


    组件的默认配置保存在构造函数的原型(prototype)属性中，可以通过 $.mobile.<widget_name>.prototype来访问。通常，每个组件原型都有一个options对象，通过这个对象可以访问组件的默认属性。例如，$.mobile.page.prototype.options可用于设置应用到每个页面实例(data-role="page")的默认属性。


    +   1、全局配置

    +      指全局属性配置。全局属性与组件无关，不需要使用原型。


    +   ① 用户界面


    缺省情况下，jQuery Mobile会为页面上的活动和非活动元素分配不同的类名（即class属性）以便通过CSS来为它们提供不同的外观。通过设置字符串属性activePageClass和activeBtnClass可以改变当前活动页面和活动按钮的类名，它们的缺省值分别为ui-page-active和ui-btn-active。很多其它组件也会使用活动按钮状态，例如在导航条、单选和复选按钮的内部。


    另两个经常改动的全局属性是页面或对话框的默认加载过渡效果，其缺省值分别是slide和pop，可以通过defaultPageTransition和defaultDialogTransition属性来改变。'
