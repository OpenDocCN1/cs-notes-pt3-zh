    主题CSS文件主要包含颜色和形状样式；结构CSS主要描述文档结构，例如元素大小和位置样式。\n如果对系统提供的结构CSS文件不满意，也不要更改它。建议另写一个CSS文件，然后在载入系统结构CSS文件后再引入它，从而实现样式的覆盖。\n\
    \njQuery Mobile提供了免费的在线的图形化主题编辑器ThemeRoller:\nhttp://jquerymobile.com/themeroller\n\
    另外新版本的Adobe Fireworks也包含一个jQuery Mobile主题编辑器。\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_339_0.png)\n"
  mdcn: "\n\n## 5.6.4 动态内容\n\n### 一、创建页面\n\n/* 见例：5-6-1.html*/\n\n本例使用的方法有：\n\n- $():\
    \ jQuery函数。当参数为HTML标记时，创建只有一个DOM元素的jQuery对象；当参数为选择器时，创建选择结果的jQuery对象。\n  例如：$(\"\
    <div>\"); //创建具有一个div元素的jQuery对象。\n  $(\"body\"); //创建一个包含所有body元素的jQuery对象。\n\
    \n- .jqmData(属性名, 属性值)：为元素添加自定义属性，jQuery Mobile函数。\n  例如：.jqmData(\"role\", \"\
    page\"); //为元素添加属性data-role=\"page\"。\n\n- .attr(属性名, 属性值)：为元素添加属性，jQuery函数。\n\
    \  例如：attr(\"id\", \"page0\"); //为元素添加id=\"page0\"属性。\n\n- .append(jQuery对象)：将参数对象添加到父亲的末尾，jQuery函数。\n\
    \  .append($(\"<p>\"));为父亲追加一个段落对象。\n\n- .html(HTML字符串)：参数字符串作为匹配元素的内容。\n  例如：$(\"\
    <h1>\").html(\"Page0\"): 创建只有一个h1元素的jQuery对象，其文本为page0。\n\n创建页面的最佳方法是先创建一个可分辨的链接，然后捕获它的\
    \ pagebeforechange事件，在响应函数中修改框架中页面的内容并显示。\n\n/* 参见: 5-6-2.html*/\n\n本例中需要解释的有：\n\
    \n- pagebeforechange事件的响应函数可以有两个参数，第二个参数中包含各种关于启动和目标页面的信息。\n- $.mobile.path: jQuery\
    \ Mobile的路径工具属性。\n- dataUrl: changePage()操作的可选属性，表示写入地址的URL。\n- event.preventDefault():\
    \ 阻止缺省行为的发生。\n\n### 2、创建组件\n创建动态组件需要使用组件的构造函数。只要将jQuery对象传递给组件的构造函数即可。例如：\n\n\
    ```\n$(\"#list1\").listview();\n$(\"a\").button();\n/* 参见: 5-6-3.html*/\n```\n\
    \n### 3、更新组件\n对已经创建并渲染的组件，在进行了更新后，需要使用\"refresh\"字符串调用组件的构造函数进行刷新。例如：\n\n```\n\
    $(\"#list1\").listview('refresh');\n$(\"#checkbox\").val('true').checkboxradio('refresh');\n\
    /* 参见: 5-6-4.html*/\n```\n\n## 5.6.5 改变页面内容\n\n如果改变了包含多个组件的一大块HTML，就需要刷新整个容器。要刷新一个容器，只需要在页面上触发create事件。这时每个组件就会检查是否需要创建新的实例。例如：\n\
    \n```\n$(\"#content\").html(newHTMLcontentWithWidgets);\n$(\"#page1\").trigger(\"\
    create\");\n```\n\n其中：.trigger()方法用来模拟发生各种事件，包括create事件。页面将根据新的内容重新创建。\n\n## 5.6.6\
    \ 处理事件\n\njQuery Mobile提供了一些新的事件。这些事件可以使用bind或live等典型的jQuery方法来处理。\n\nbind方法用于将事件绑定到已有的DOM对象；live方法将事件委托给document对象进行处理，是一个事件委托方法。另外live方法还可以被用来处理将要创建的DOM对象。\n\
    \n### 1、手势事件\n\n手势事件主要包括：swipe、swipeleft、swiperight、tap、taphold\n\n- ① **swipe**：一秒钟以内，水平滑动30像素以上（要求垂直移动不超过75像素）。其中的参数可以设置。\n\
    - ② **swipeleft**：一秒钟以内，向左水平滑动30像素以上（要求垂直移动不超过75像素）。\n- ③ **swiperight**：一秒钟以内，向右水平滑动30像素以上（要求垂直移动不超过75像素）。\n\
    - ④ **tap**：在屏幕上快速地触摸一下。\n- ⑤ **taphold**：在屏幕上触摸并保持一秒钟时触发。\n\n/* 示例：5-6-5.html*/\n\
    \n### 2、页面事件\n\n要处理页面事件，可以调用$(document).bind，也可以更准确地调用$(\".jqmData(role='page')\"\
    ).bind。或者用live代替bind，以便可以绑定那些将来要添加到DOM中的页面。\n\n- ① 创建事件（包括创建和初始化事件）：\n  - **pagebeforecreate**：页面已插入DOM，但组件尚未创建。\n\
    \  - **pagecreate**：页面（包括其中的组件）已被创建，但尚未被渲染。\n  - **pageinit**：页面已完全加载。\n  - **pageremove**：框架打算从DOM中删除一个外部页面前。\n\
    \n例如：\n\n```javascript\n$(\"#page2\").live(\"pageinit\", function(event) {\n\n\
    });\n```\n\n- ② 加载事件\n\n用于使用AJAX加载的页面：\n\n- pagebeforeload: 就在AJAX加载页面前。\n- pageload:\
    \ 页面已加载。\n- pageloadfailed: 页面加载失败时。\n\n- ③ 显示事件\n\n用于处理页面的显示或隐藏事件：\n\n- pagebeforechange:\
    \ 页面改变及过渡之前。\n- pagechange: 页面刚刚改变。\n- pagechangefailed: 页面改变失败时。\n- pagebeforeshow:\
    \ 在页面以过渡方式显示之前。\n- pageshow: 页面刚刚以过渡方式在屏幕上显示。\n- pagebeforehide: 页面即将隐藏前。\n- pagehide:\
    \ 页面刚刚完成卸载及隐藏。\n\n### 3、组件事件\n\n每个能动态显示或隐藏内容的组件，例如collapsible等，都会触发一个updateLayout事件，表示页面布局已经发生了变化。有时可能需要监听这个事件，以便更新其上的其它内容。\n\
    \n### 4、方向事件\n\n移动设备可以旋转，至少会有两个不同的方向。jQuery Mobile提供了一个orientationchange事件，可以附加在document上。例如：\n\
    \n```javascript\n$(document).bind(\"orientationchange\", function(orientation)\
    \ {\n    if (orientation == \"landscape\") {\n        // We are now in landscape\n\
    \    } else {\n        // We are now in portrait\n    }\n});\n```\n\n## 5.7 创建主题\n\
    \njQuery Mobile允许开发者通过主题和CSS来定制整个用户界面。\n\n主题是一组配色方案（也称为色样），包括：\n\n- 文本颜色。\n- 背景颜色及变化。\n\
    - 字体。\n\n每个主题可以定义多达26个配色方案，用字母a到z表示。通常至少会定义5个配色方案。\n\n每个主题还包含一个全局定义，适用于主题的所有配色方案。包括：\n\
    \n- 文本效果和盒效果，例如阴影和圆角。\n- 按钮和其它控件的激活状态。\n\n全局定义可以确保无论主题套用哪个色样，都可以保持一致的用户体验。比如，在默认主题中，无论按钮使用什么色样，它的选中状态始终显示为蓝色。\n\
    \n主题保存在一个CSS文件中。\n使用默认主题时，只需要在HTML文档中包含框架提供的核心CSS文件。\n使用自定义主题时，不仅需要包含自定义的主题CSS文件，而且需要包含系统提供的结构CSS文件。\n\
    主题CSS文件主要包含颜色和形状样式；结构CSS主要描述文档结构，例如元素大小和位置样式。\n如果对系统提供的结构CSS文件不满意，也不要更改它。建议另写一个CSS文件，然后在载入系统结构CSS文件后再引入它，从而实现样式的覆盖。\n\
    \njQuery Mobile提供了免费的在线的图形化主题编辑器ThemeRoller:\nhttp://jquerymobile.com/themeroller\n\
    另外新版本的Adobe Fireworks也包含一个jQuery Mobile主题编辑器。\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_339_0.png)\n\
    \n"
