  mdcn: "\n\n## 4.4 样式与动画\n\n在前面几节中，为了修改文档的外观，都是先在单独的样式表中为类定义好样式，然后再通过jQuery来添加或者移除这些类。一般而言，这是为HTML应用CSS样式的首选方式。但jQuery还提供了更加灵活的控制样式的方式。\n\
    \n### 4.4.1 修改内联CSS\n\njQuery提供了.css()方法，用于获取和设置jQuery对象的CSS属性：\n\n```\n.css('property');\
    \ //获取CSS样式\n```\n\n```\n.css('property', 'value'); //设置CSS样式\n```\n\n其中的属性名既可以用连字符形式的CSS表示法(如：background-color)，也可以是JavaScript中使用的驼峰表示法(如：backgroundColor)，而且驼峰表示法的属性名可以省略引用。\n\
    \n设置属性时，也可以通过使用由属性-值对构成的对象常量，同时设置多个CSS属性，即：\n\n```\n.css({'property1': 'value1',\
    \ 'property2': 'value2'});\n```\n\n```\n```html\n//在例4-4-1.html中：\n<div id=\"\
    switcher\">\n    <div class=\"label\">Text Size</div>\n    <button id=\"switcher-default\"\
    >Default</button>\n    <button id=\"switcher-large\">Bigger</button>\n    <button\
    \ id=\"switcher-small\">Smaller</button>\n</div>\n<div class=\"speech\">\n   \
    \ <p>Fourscore and seven years ago our fathers brought\n        forth on this\
    \ continent a new nation, conceived in\n        liberty, and dedicated to the\
    \ proposition that all men\n        are created equal.\n    </p>\n</div>\n</div>\n\
    ```\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_211_0.png)\n\n```\n```javascript\n\
    //在例4-4-1.js中：\n$(document).ready(function() {\n    var $speech = $('div.speech');\n\
    \    var defaultSize = $speech.css('fontSize');\n    $('#switcher button').click(function()\
    \ {\n        var num = parseFloat($speech.css('fontSize'));\n        switch (this.id)\
    \ {\n            case 'switcher-large':    num *= 1.4;\n                break;\n\
    \            case 'switcher-small':    num /= 1.4;\n                break;\n \
    \           default: num = parseFloat(defaultSize);\n        }\n        $speech.css('fontSize',\
    \ num + 'px');\n    });\n});\n```\n```\n\n### 4.4.2 基本的隐藏和显示\n\n在例4-4-2.js中：\n\
