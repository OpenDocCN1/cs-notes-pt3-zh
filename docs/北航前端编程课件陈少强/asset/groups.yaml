    }, {\n    duration: 'slow',\n    queue: false\n})\n.fadeTo('slow', 1.0)\n.slideUp('slow')\n\
    .slideDown('slow');\n});\n```\n\n本例中，.animate()的第二个参数包含了queue选项，把该选项设置为false可将当前动画与前一个动画同时开始，而不是顺序开始。由于两个动画的速度不同，这是.animate()的第一种形式所做不到的。\n"
  mdcn: "\n\n## 4.4.3 动画效果\n\n```\n//在例4-4-7.js中：\nvar $firstPara = $('p').eq(1);\n\
    $firstPara.hide();\n$('a.more').click(function() {\n    $firstPara.slideToggle('slow');\n\
    \    var $link = $(this);\n    if ($link.text() == 'read more') {\n        $link.text('read\
    \ less');\n    } else {\n        $link.text('read more');\n    }\n    return false;\n\
    });\n```\n\n## 4.4.4 创建自定义动画\n\n除了预置的动画方法外，jQuery还提供了一个强大的.animate()方法，用于创建更加精细的自定义动画效果。它有两种形式。\n\
    \n第一种形式有4个参数：\n\n- ① 一个目标样式表：用于指定目标样式。\n- ② 可选的整体时间参数：指定完成动画总共需要的时间。\n- ③ 可选的局部速率参数(easing)：指定不同时间段动画进行的快慢。\n\
    - ④ 可选的回调函数：将在动画执行之后作为本次动画内容被调用。\n\n形如：\n\n```\n.animate({property1: 'value1',\
    \ property2: 'value2'},\n    speed, easing,\n    function() {alert('The animation\
    \ is finished');}\n);\n```\n\n第二种形式只有2个参数：\n\n- ① 一个目标样式表：用于指定目标样式。\n- ② 一组可选项。\n\
    \n事实上，第二种形式是将第一种形式的后三个可选项放在了一起，并且增加了一些更复杂的选项。形如：\n\n```\n.animate({\n    property1:\
    \ 'value1',\n    property2: 'value2'\n}, {\n    duration: 'value',\n    easing:\
    \ 'value',\n    specialEasing: {\n        property1: 'easing1',\n        property2:\
    \ 'easing2'\n    },\n    complete: function() {\n        alert('The animation\
    \ is finished.');\n    },\n    queue: true,\n    step: callback\n});\n```\n\n\
    ### 1、 使用.animate()创建预置动画效果\n\n```\n//例4-4-8.js模拟了.slideToggle()效果:\nvar $firstPara\
    \ = $('p').eq(1);\n$firstPara.hide();\n$('a.more').click(function() {\n    $firstPara.animate({height:\
    \ 'toggle'}, 'slow');\n    var $link = $(this);\n    if ($link.text() == 'read\
    \ more') {\n        $link.text('read less');\n    } else {\n        $link.text('read\
    \ more');\n    }\n    return false;\n});\n```\n\n可以看出，.animate()方法对CSS属性提供了简写值（例如：toggle）使对预置动画方法的模拟更加容易。\n\
    \n```\n//例4-4-10.js以动画形式改变字体大小:\nvar $speech = $('div.speech');\nvar defaultSize\
    \ = $speech.css('fontSize');\n$('#switcher button').click(function() {\n    var\
    \ num = parseFloat($speech.css('fontSize'));\n    switch (this.id) {\n    case\
    \ 'switcher-large': num *= 1.4;\n        break;\n    case 'switcher-small': num\
    \ /= 1.4;\n        break;\n    default:\n        num = parseFloat(defaultSize);\n\
    \    }\n    $speech.animate({fontSize: num + 'px'}, 'slow');\n});\n```\n\n```\n\
    //例4-4-11.js同时实现了文本尺寸盒的移动、增加高度和边框宽度：\n$('div.label').click(function() {\n    var\
    \ paraWidth = $('div.speech p').outerWidth();\n    var $switcher = $(this).parent();\n\
    \    var switcherWidth = $switcher.outerWidth();\n    $switcher.css({\n      \
    \  position: 'relative'\n    }).animate({\n        borderWidth: '5px',\n     \
    \   left: paraWidth - switcherWidth,\n        height: '+=20px'\n    },\n    'slow');\n\
    });\n```\n\n其中\n\n.outerWidth()方法用来计算元素的外宽度。\n\nheight: '+=20px'用来增加元素的CSS高度。\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_226_0.png)\n\n## 4.4.5 排队效果\n\n前面的实例同时改变多种CSS属性，体现的是并发效果。但有时希望效果一个一个地发生，即想要排队效果。\n\
    \n### 1、对一组元素进行排队\n\n这只要通过连缀即可实现。\n\n//例4-4-12.js排队实现了文本尺寸盒的移动、增加高度和边框宽度：\n\n\
    ```\n$('div.label').click(function() {\n    var paraWidth = $('div.speech p').outerWidth();\n\
    \    var $switcher = $(this).parent();\n    var switcherWidth = $switcher.outerWidth();\n\
    \    $switcher\n    .css({position: 'relative'})\n    .animate({left: paraWidth\
    \ - switcherWidth}, 'slow')\n    .animate({height: '+=20px'}, 'slow')\n    .animate({borderWidth:\
    \ '5px'}, 'slow');\n});\n```\n\n连缀可以对任意jQuery效果进行排队，而不仅限于.animate()方法。\n\n```\n\
    //在例4-4-13.js中：\n$('div.label').click(function() {\n  var paraWidth = $('div.speech\
