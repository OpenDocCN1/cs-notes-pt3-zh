    >帮助光标（问号或气球）</div>\n```\n\n## 2.7 “层叠”与“继承”\n\n样式表一个最重要的优点是一些简单的声明就可以改变大量文本的外观，这是样式继承带来的好处。继承是将样式定义从父元素传递给子元素的原则。\n\
    \n大多数样式会被继承（有些样式不会被继承，例如margin、padding等）。例如，为了设置默认的文本样式，可以给body元素定义一个样式规则如下：\n\
