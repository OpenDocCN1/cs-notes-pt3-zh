  - "[PAGE 242]\n\n# 5.2.2 文档结构\n\n# 3、页面(page)\n\n页面是jQuery Mobile的主要单位。一个典型的页面包括页头、内容和页脚三个部分。通常只有内容部分是必不可少的。各个部分使用data-role属性指定。\n\
    \n```\n```html\n<div data-role=\"page\">\n    <div data-role=\"header\">\n   \
    \ </div>\n    <div data-role=\"content\">\n    </div>\n    <div data-role=\"footer\"\
    >\n    </div>\n</div>\n```\n```\n\n当然，可以为每个部分指定不同的色样。\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_242_0.png)"
  - '[PAGE 243]


    # 5.2.2 文档结构


    # 页头和页脚


    在页头与页脚可以插入任何的HTML内容，但由于标准jQuery Mobile样式表的限制，最好在页头中使用h1，在页脚中使用h4，以便得到最好的显示效果。


    在Web应用的导航界面中，页头通常是必须的，而页脚则是可选的。页头结构已经被预定义并划分为三个子区域：左侧、标题和右侧。


    jQuery Mobile会自动从hx(例如h1)标签中提取标题。


    由于空间有限，如果标题太长，它会被自动截断。在大多数设备上，被截断的标题末尾会显示省略号。页脚也有相同的行为。


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_243_0.png)


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_243_1.png)'
