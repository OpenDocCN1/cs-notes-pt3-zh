  - '[PAGE 87]


    # 3.2.3 关于变量


    3、变量的作用域


    变量的作用域就是变量的有效范围。


    在函数中声明的变量（包括函数的参数）称为局部变量；在函数外声明的变量称为全局变量。隐式声明不管是否发生在函数中，其声明的变量都是全局变量。


    全局变量的作用域是全局的，即从定义点处开始，在代码中处处有效；局部变量的作用域是局部性的，即只在函数内部有效。


    局部变量的优先级高于全局变量：如果一个局部变量的名字与某个全局变量的名字相同，局部变量就隐藏了全局变量。


    局部变量的定义应该放在函数的最前面。'
