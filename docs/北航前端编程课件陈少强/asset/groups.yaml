    # 5.5.2 表单元素


    非本地选择菜单


    当点击选项菜单时，将激活一个本地菜单供选择。这个行为可以通过 data-native-menu="false"属性来改变。


    改变后，将弹出一个列表供选择。当列表太长时，它将使用一个类似对话框的外观。


    见例：5-5-4.html


