    # 1.3 HTML5新标记简介


    # 1.3.6 地理定位(Geolocation)


    HTML5 可以通过其JavaScript API获得用户的地理坐标（当然这需要用户的同意），这样就能实现移动客户端的基于地理位置的应用。


    +   1）getCurrentPosition()方法可以得到用户的当前位置。


    例：1-9.html /* 只IE成功 */


    +   2）watchPosition()方法则可以不断返回用户的位置，直到用clearWatch()方法来停止。


    例：1-A.html /* 只IE成功 */


    有了地理定位功能，就可以调用谷歌或百度的地图服务，在地图中显示当前位置。


    例：1-B.html /*只IE、百度地图成功 */'
  - '[PAGE 19]


    # 第二章 CSS简介


    # 2.1 网页组成


    随着Web技术的发展，人们不再仅仅满足于在页面上浏览文本和图片并使用超链接，大家希望的是更加赏心悦目的界面并与之互动，而这些是HTML所不能满足的。目前认为，Web页面有三大部分内容：即：结构、表现和行为。


    +   - 结构：网页的内容及层次关系。

    +   - 表现：结构化内容的展示方式，包括版式、颜色大小等。

    +   - 行为：与用户的交互能力。


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_19_0.png)'
  - '[PAGE 20]


    # 2.2 前台技术


    要完成上述三部分内容，需要有相应的技术来实现。由于都是直接面对用户的技术，所以称为前台技术，或称表现层技术。具体包括：


    +   - 结构技术：主要有 HTML、XML、XHTML。

    +   - 表现技术：主要是 CSS

    +   - 行为技术：主要是各种前台脚本语言，例如 JavaScript。'
  - '[PAGE 21]


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_21_0.png)


    # 2.3 层叠样式表（CSS）


    网页设计最初是用HTML标记来定义网页的内容和简单效果。主要侧重于定义内容，并没有过多涉及排版和界面效果。当网页的页面变得越来越重要时，HTML就难以满足需求了。CSS的出现解决了这个问题。


    CSS是Cascading Style Sheets（层叠样式表）的简称，也叫样式表。它专门用来实现排版及网页元素（由HTML标记表示）的显示样式。


    由于有了CSS，实现了内容与表现的分离，即：


    +   - HTML（或XHTML）用来表示网页内容及结构。

    +   - CSS用来决定网页内容的排版和显示方式。'
  - "[PAGE 22]\n\n# 2.4 CSS的使用方式\n\n# 2.4.1 内嵌样式：\n\n即将样式作为标记的style属性值直接写在标记内，样式之间以“；”分割。见下例，2-1.html：\n\
    \n```\n<!DOCTYPE...>\n<html>\n    <head>\n        <title>网络编程技术</title>\n    </head>\n\
    \    <body>\n        <h2 style=\"font-size:20pt\">前台技术</h2>\n        <p style=\"\
    background-color:rgb(255,0,0)\">HTML</p>\n        <p style=\"background-color:#00ff00\"\
    >CSS</p>\n        <p style=\"background-color:#00f\">JavaScript</p>\n    </body>\n\
    </html>\n```"
  - '[PAGE 23]


    # 2.4 CSS的使用方式


    # 2.4.2 内部样式表：


    内部样式表使用style标记，写在head标记之间，见下例，

    2-2.html：


    ```

    <html>

    <head>

    <title>网络编程技术</title>

    <style type="text/css">

    h2 {font-size:30pt; background-color:rgb(0,255,0)}

    p {background-color:rgb(255,0,0)}

    </style>

    </head>

    <body>

    <h2>前台技术</h2>

    <p>HTML</p>

    <p>CSS</p>

    <p>JavaScript</p>

    </body>

    </html>

    ```'
  - '[PAGE 24]


    # 2.4 CSS的使用方式


    # 2.4.3 导入外部样式表：


    将CSS文件导入到内部样式表，见下例，2-3.html：


    ```

    <html>

    <head>

    <title>网络编程技术</title>

    <style type="text/css">

    @import url(2-3.css); <!--注意分号一定要-->

    </style>

    </head>

    <body>

    <h2>前台技术</h2>

    <p>HTML</p>

    <p>CSS</p>

    <p>JavaScript</p>

    </body>

    </html>

    /*2-3.css*/

    h2{

    font-size:30pt;

    background-color:rgb(0,255,0)

    }

    p{background-color:rgb(255,0,0)}

    ```'
  - '[PAGE 25]


    # 2.4 CSS的使用方式


    # 2.4.4 链接外部样式表：


    使用link标记，从<head>～</head>部分链接一个CSS文件，见下例2-4.html：


    ```

    <html>

    <head>

    <title>网络编程技术</title>

    <link rel="stylesheet" href="2-3.css">

    </head>

    <body>

    <h2>前台技术</h2>

    <p>HTML</p>

    <p>CSS</p>

    <p>JavaScript</p>

    </body>

    </html>

    ```


    注：前面介绍的@import语句，也可用在CSS文件中。'
  - '[PAGE 26]


    # 2.5 HTML与CSS的接口


    为了能够准确地使用CSS控制由标记定义的HTML各元素的表现形式（也包括将来使用脚本控制其行为），HTML为所有标记定义了id和class属性，以便从不同级别定位元素。


    id: 元素标识符属性。用来唯一地标识一个元素。


    class: 类型标识符属性。用来表示元素所属的类型。多个元素可以属于一个类型，一个元素也可以属于多个类型（以空格隔开）。


    例如：


    ```

    <p id="id1" class="para cl1">HTML</p>

    <p id="id2" class="para cl1">CSS</p>

    <p id="id3" class="para cl2">JavaScript</p>

    ```'
  - '[PAGE 27]


    # 2.6 CSS语法结构


    前面已经见过简单的CSS样式定义，例如：


    ```

    p {background-color:rgb(255,0,0);}

    ```


    CSS语法结构由3个部分组成：选择器(Selector)、属性(Property)和值(Value)。使用方法是：


    ```

    Selector {Property: Value;}

    ```


    其中：


    选择器：指出需要设置样式的对象，有各种指定方式。


    属性和值：指定具体的一个样式。


    重要：CSS样式表中可以包含注释，形如： /*注释*/'
