  - '[PAGE 112]


    # 3.3.1 Web浏览器中的JavaScript


    这里的HTML元素是超链接，其onclick属性的值是一个字符串，其中可以包含多个JavaScript语句。当指定的事件（这里是点击）发生时，字符串中的JavaScript代码就会被执行。


    为了减少JavaScript与HTML的混合，如果事件处理程序的语句多于一条或两条，通常将事件处理程序定义为标记<script>和</script>之间的一个函数，然后在事件处理程序中调用这个函数。


    最常见的代表事件的属性包括：


    +   onclick, onmousedown, onmouseup, onmouseover, onmouseout

    +   onchange, onsubmit, onreset


    事件处理程序的返回值非常重要，返回true意味着去执行与元素相关的默认动作（对标记<a>，onclick默认将执行超链接），返回false则不执行。当然元素可以没有默认动作。


    关于事件处理程序，需要记住的重要一点是：在事件处理程序的代码中，关键字this引用触发该事件的文档元素。'
  md: "\n## 3.2.5 语句\n\n12、return语句\n\n用在函数体中，用于返回函数的值或中断函数的执行。用法与c语言中的return语句基本相同。没有参数的return语句返回undefined。\n\
    \n## 3.3 客户端JavaScript\n\n前面介绍的是作为通用语言的JavaScript核心，客户端JavaScript是其在浏览器环境下的一个具体实现。\n\
    \n### 3.3.1 Web浏览器中的JavaScript\n\n+   1、客户端JavaScript特点\n\n+   1）顶层Window对象\n\n\
    在客户端JavaScript中，表示HTML文档的是Document对象，Window对象表示显示该文档的窗口（或框架）。\n\nWindow对象定义了一些属性和方法用于控制浏览器窗口，也定义了一些属性用来表示一些重要的对象（例如Document对象）。而且，Window对象定义了两个表示自己的属性：window和self。\n\
    \nWindow对象是顶层对象（顶层this），所有定义的全局变量都是其属性。所以下面两行代码的功能是相同的：\n\n```\nvar answer = 42;\n\
    ```\n\n```\nwindow.answer = 42;\n```\n\n### 3.3.1 Web浏览器中的JavaScript\n\n2）客户端JavaScript对象层次结构及（0级）文档对象模型（DOM）\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_103_0.png)\n\n### 3.3.1 Web浏览器中的JavaScript\n\
    \n上图中的许多对象都继承自Document对象，这个较大的客户端对象子树被称为文档对象模型（DOM）。它构成了文档功能的基础层次，被称为0级文档对象模型。由于已经被大多数浏览器实现，已经成为事实上的标准，程序员们可以非常信赖地在所有的浏览器上使用它。\n\
    \n# 3）事件驱动的程序设计模型\n\n在客户端JavaScript中，Web浏览器使用事件（event）来通知程序用户有输入。事件的类型有很多，例如键盘事件，鼠标事件等等。当一个事件发生时，Web浏览器会先尝试调用一个合适的事件处理程序来响应这个事件。\n\
    \n因此，要编写一个动态的、交互性的客户端JavaScript程序，必须先定义一些适当的事件处理程序，并将它们注册到系统中，这样浏览器才能在适当的时候调用它们。\n\
    \n这是典型的事件驱动程序设计模型。在大部分时间中，程序根本就不运行，而是等待用户输入，由系统调用它的某一个事件处理程序。\n\n### 3.3.1 Web浏览器中的JavaScript\n\
    \n2、在HTML中嵌入JavaScript\n\n在HTML中嵌入JavaScript代码有很多方法，例如：\n\n- ① 放置在标记对 <script>\
    \ 和 </script> 之间。\n- ② 放置在由标记 <script> 的 src 属性指定的外部文件中。\n- ③ 作为 HTML 标签的属性（例如\
    \ onclick、onmouseover 等）的值，放置在事件处理程序中。\n- ④ 写在超链接中\n\n1） <script> 标记\n\n客户端 JavaScript\
    \ 脚本是 HTML 文件的一部分，放置在标记对 <script> 和 </script> 之间。<script> 标记既可以出现在 HTML 文档的 <head>\
    \ 部分，也可以出现在 <body> 部分。但不可嵌套和交叉。\n\n```\n<script>\n// Your JavaScript code goes\
    \ here\n</script>\n```\n\n### 3.3.1 Web浏览器中的JavaScript\n\n一个HTML文档可以包含任意多个不重叠的<script>、</script>标记对，这些独立脚本的执行顺序就是它们在文档中出现的顺序。尽管在装载和解析一个HTML文档的过程中，各脚本在不同时刻执行，但它们是同一个JavaScript程序的组成部分。在一个脚本块中定义的函数和变量，适用于随后出现的同一个HTML文件中的所有脚本块。关键的环境是这个HTML文档，而不是脚本块。\n\
    \n例如，可以将下面的一行脚本放到HTML文档某个地方：\n\n```\n<script>var x=1;</script>\n```\n\n然后，你可以引用变量x，即使这个引用出现在另一个脚本块中：\n\
    \n```\n<script>document.write(x);</script>\n```\n\ndocument.write()是个重要且常用的方法，它将把自己的输出插入到脚本所在的文档位置。当脚本执行完毕时，HTML解析器将继续解析文档，并开始解析document.write()方法生成的文本。\n\
    \n下例是一个HTML文档，它包含一个简单的JavaScript程序：\n\n### 3.3.1 Web浏览器中的JavaScript\n\n```\n<html><!--3-1.html-->\n\
    <head>\n<title>Today's Date</title>\n<script language=\"JavaScript\"> // 定义一个函数供以后使用\n\
    function print_todays_date() {\nvar d = new Date(); // 得到当前时间和日期\ndocument.write(d.toLocaleString());\
    \ // 插入到文档\n}\n</script>\n</head>\n<body>\nThe date and time are:<br>\n<script\
    \ language=\"JavaScript\"> // 调用上面定义的函数\nprint_todays_date();\n</script>\n</body>\n\
    </html>\n```\n\n### 3.3.1 Web浏览器中的JavaScript\n\n<script>标记的language和type属性：\n\n\
    上例中出现了<script>标记的language属性。该属性是可选的，用于指定书写脚本的语言。过去曾经有<script language=\"VBScript\"\
    >，但现在已经基本不用了。\n\n新规范主张使用type属性来区分，例如：\n\n```\n<script type=\"text/javascript\"\
    >\n```\n\n但实际上什么也不用写，现在已经没有第二种选择了！\n\n### 3.3.1 Web浏览器中的JavaScript\n\n# 2）包含JavaScript文件\n\
    \n`<script>`标记支持src属性，其值用来指定一个包含JavaScript代码文件的URL。它的用法如下：\n\n```html\n<script\
    \ src=\"../../scripts/util.js\"></script>\n```\n\n例如：\n\n```html\n<html><!--3-2.html-->\n\
    <head>\n    <title>Today's Date</title>\n    <script src=\"3-2.js\"></script>\n\
    </head>\n<body>\n    The date and time are:<br>\n    <script language=\"JavaScript\"\
    >\n        print_todays_date( );\n    </script>\n</body>\n</html>\n```\n\n```javascript\n\
    // 3-2.js\nfunction print_todays_date( ) {\n    var d = new Date();\n    document.write(d.toLocaleString(\
    \ ));\n}\n```\n\n### 3.3.1 Web浏览器中的JavaScript\n\n具有src属性的<script>标记的行为就像指定的JavaScript文件内容直接出现在标记<script>和</script>之间一样，浏览器会忽略标记之间的代码，但结束标记</script>不可省略。\n\
    \n使用<script>标记的好处有很多：\n\n- 可以把大型的JavaScript代码块移出HTML文件，从而简化了HTML文档。\n- 将公共代码放置在共享文件中，可以减少磁盘占用，并提高维护效率。\n\
    - 多个页面共享JavaScript文件时，该文件将被缓存，读取效率会更高。\n- 通过设置URL，一个Web服务器可以使用另一个Web服务器输出的代码。\n\
    \n### 3.3.1 Web浏览器中的JavaScript\n\n# 3) 事件处理程序\n\n由于客户端JavaScript的事件是由HTML元素引发的，因此事件处理程序被定义为这些元素的属性值。例如：\n\
    \n```html\n<html><!--3-3.html-->\n<head>\n    <title>Welcome to Sina!</title>\n\
    </head>\n<body>\n    <a href=\"http://www.sina.com\"\n       onclick=\"alert('You\
    \ are cheated!'); return false;\">\n       Welcome to Sina!\n    </a>\n</body>\n\
    </html>\n```\n\n### 3.3.1 Web浏览器中的JavaScript\n\n这里的HTML元素是超链接，其onclick属性的值是一个字符串，其中可以包含多个JavaScript语句。当指定的事件（这里是点击）发生时，字符串中的JavaScript代码就会被执行。\n\
    \n为了减少JavaScript与HTML的混合，如果事件处理程序的语句多于一条或两条，通常将事件处理程序定义为标记<script>和</script>之间的一个函数，然后在事件处理程序中调用这个函数。\n\
    \n最常见的代表事件的属性包括：\n\n- onclick, onmousedown, onmouseup, onmouseover, onmouseout\n\
    - onchange, onsubmit, onreset\n\n事件处理程序的返回值非常重要，返回true意味着去执行与元素相关的默认动作（对标记<a>，onclick默认将执行超链接），返回false则不执行。当然元素可以没有默认动作。\n\
    \n关于事件处理程序，需要记住的重要一点是：在事件处理程序的代码中，关键字this引用触发该事件的文档元素。\n"
