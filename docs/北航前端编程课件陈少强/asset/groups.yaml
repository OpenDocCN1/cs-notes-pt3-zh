    \n+ ① Document对象有几个获取元素对象（元素）的方法：\n\ngetElementsByTagName(): 返回元素的数组。例如：\nvar\
    \ body = document.getElementsByTagName(\"body\")[0];\n\ngetElementsByName(): 返回元素的数组。例如：\n\
    // 找出所有<input type=\"radio\" name=\"shippingMethod\">单选按钮\nvar choices = document.getElementsByName(\"\
    shippingMethod\");\n\ngetElementById(): 返回具有特定标识符元素。例如：\n//<p id=\"specialParagraph\"\
    >\nvar myParagraph = document.getElementById(\"specialParagraph\");\n\n+ ② Element对象也定义了getElementsByTagName()方法，它返回此对象的子元素数组。例如：\n\
    \n```\n// 找到文档中特定的Table元素，统计它的行数\nvar tableOfContents = document.getElementById(\"\
    TOC\");\nvar rows = tableOfContents.getElementsByTagName(\"tr\");\nvar numrows\
    \ = rows.length;\n```\n\n（3）修改文档\n\n① 可以用插入、删除、重排节点和重定义节点的方式修改文档，例如：\n\n```\n\
    ```html\n<script> <!-- 3-6.html -->\nfunction embolden(node) {\n    var bold =\
    \ document.createElement('b');\n    var parent = node.parentNode;\n    parent.replaceChild(bold,\
    \ node);\n    bold.appendChild(node);\n}\n</script>\n\n<p id=\"p1\">This <i>is</i>\
    \ paragraph #1.</p>\n<p id=\"p2\">This <i>is</i> paragraph #2.</p>\n<button onclick=\"\
    embolden(document.getElementById('p1'));\">\n    Embolden\n</button>\n```\n```\n\
    \n② 也通过设置文档元素的性质改变文档的显示。例如：\n\n```\nvar headline = document.getElementById(\"\
    headline\");\nheadline.setAttribute(\"align\", \"center\");\n```\n\n表示HTML元素的DOM元素，为HTML元素的每个标准属性定义了JavaScript属性，所以下面的代码可以得到相同的效果：\n\
    \n```\nvar headline = document.getElementById(\"headline\");\nheadline.align =\
    \ \"center\"; // Set alignment attribute.\n```\n\n注意：IE对setAttribute()的支持有限。\n\
    \n上例中的debug()函数可以将调试信息附加在文档的后面。可用于下面的HTML文档：\n\n```\n<!-- 3-7.html -->\n<body>\n\
    \    <script>var numtimes=0;</script>\n    <button onclick=\"debug('clicked: '\
    \ + numtimes++);\">\n    press me\n    </button>\n</body>\n```\n\n这个例子中示范了一个给文档添加内容的新方法。即：使用了<div>元素的innerHTML属性。把任何元素的innerHTML属性设置成一个HTML文本串，都会使那段HTML被解析为元素的内容。虽然这个属性不属于DOM\
    \ API，但它非常简便，而且所有的浏览器都支持它。\n"
  mdcn: "\n\n## 3.3.6 文档对象模型\n\n### 一、DOM概述\n\n+ （1）把文档表示为树\n\nHTML文档有一个由嵌套标记构成的层次结构，这个结构在DOM中被表示为一棵对象树。这个HTML文档的树形表示由节点构成，主要包含表示元素（即标记）的节点和表示文本串的节点。也可以包含表示HTML注释的节点。例如：\n\
    \n```\n<!--简单的HTML文档和其对应的DOM树形表示-->\n<html>\n<head>\n<title>Sample Document</title>\n\
    </head>\n<body>\n<h1>An HTML Document</h1>\n<p>This is a <i>simple</i> document.\
    \ </p>\n</body>\n</html>\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_147_0.png)\n\
    \n### (2) 树中的节点\n\nDOM树形结构由各种类型的节点对象构成。所有类型的节点对象都具有：childNodes属性，其中包含所有的子节点；firstChild、lastChild、nextSibling、previousSibling和parentNode属性，提供了遍历树的途径；appendChild()、removeChild()、replaceChild()和insertBefore()方法使你能够为文档树添加节点或从文档树中删除节点。\n\
    \nDocument节点类型定义了W3C标准化之前（0级DOM）的浏览器支持的各种Document对象的属性和方法。例如：location属性、forms[]数组和write()方法的。\n\
    \nElement节点类型定义了id、style、title、lang、dir和className属性。用这些属性访问HTML标记的id、style、title、lang、dir和class属性非常方便，这些属性是所有HTML标记共有的。\n\
    \n各种HTML元素类型（它们属于Element的子类）都定义了标记专用的属性。你可以安全地假定：表示特定HTML标记的节点类型具有该标记的所有标准属性所对应的属性。\n\
    \nElement节点的属性可以由Element类型的方法getAttribute()、setAttribute()和removeAttribute()进行查询、设置和删除。\n\
    \n### （3）节点属性的命名规则\n\n属性名应该以小写字母开头。如果属性名由多个单词构成，第二个单词开始的每个单词的首字母都要大写。因此，`<input>`标记的\
    \ `maxlength` 属性将命名为 `maxLength`。\n\n当HTML属性名与JavaScript关键字发生冲突时，应该在属性名前加前缀“html”。因此，`<label>`标记的for属性被命名htmlFor。这个规则的一个例外是class属性，它被命名为className属性。\n\
    \n> 记住：**JavaScript的所有事件处理程序属性都必须小写。**\n\n### 2、使用DOM\n\n（1）遍历文档\n\n① 使用childNodes属性：\n\
    \n```\n```html\n<head> <!-- 3-4.html -->\n<script>\n  function countTags(n) {\
    \ // n是一个Node\n    var numtags = 0\n    if (n.nodeType == 1 /*Node.ELEMENT_NODE*/)\
    \ numtags++;\n    var children = n.childNodes;\n    for(var i=0; i<children.length;\
    \ i++) numtags+=countTags(children[i]);\n    return numtags;}\n</script>\n</head>\n\
    <body onload=\"alert('It has ' + countTags(document) + ' tags')\">\n  This is\
    \ a <i>sample</i> document.\n</body>\n```\n```\n\n② 使用firstChild和nextSibling属性：\n\
    \n```\n<head> <!-- 3-5.html -->\n<script>\n    function countCharacters(n) { //\
    \ n是一个Node\n        if (n.nodeType === 3 /*Node.TEXT_NODE*/) return n.length;\n\
    \        var numchars = 0;\n        for(var m = n.firstChild; m != null; m = m.nextSibling)\
    \ {\n            numchars += countCharacters(m);\n        }\n        return numchars;\n\
    \    }\n</script>\n</head>\n<body onload=\"alert('Length: ' + countCharacters(document.body))\"\
    >\n    This is a sample document.How long is it?\n</body>\n```\n\n（2）确定文档中的特定元素\n\
    \n+ ① Document对象有几个获取元素对象（元素）的方法：\n\ngetElementsByTagName(): 返回元素的数组。例如：\nvar\
    \ body = document.getElementsByTagName(\"body\")[0];\n\ngetElementsByName(): 返回元素的数组。例如：\n\
    // 找出所有<input type=\"radio\" name=\"shippingMethod\">单选按钮\nvar choices = document.getElementsByName(\"\
    shippingMethod\");\n\ngetElementById(): 返回具有特定标识符元素。例如：\n//<p id=\"specialParagraph\"\
    >\nvar myParagraph = document.getElementById(\"specialParagraph\");\n\n+ ② Element对象也定义了getElementsByTagName()方法，它返回此对象的子元素数组。例如：\n\
    \n```\n// 找到文档中特定的Table元素，统计它的行数\nvar tableOfContents = document.getElementById(\"\
    TOC\");\nvar rows = tableOfContents.getElementsByTagName(\"tr\");\nvar numrows\
    \ = rows.length;\n```\n\n（3）修改文档\n\n① 可以用插入、删除、重排节点和重定义节点的方式修改文档，例如：\n\n```\n\
    ```html\n<script> <!-- 3-6.html -->\nfunction embolden(node) {\n    var bold =\
    \ document.createElement('b');\n    var parent = node.parentNode;\n    parent.replaceChild(bold,\
    \ node);\n    bold.appendChild(node);\n}\n</script>\n\n<p id=\"p1\">This <i>is</i>\
    \ paragraph #1.</p>\n<p id=\"p2\">This <i>is</i> paragraph #2.</p>\n<button onclick=\"\
    embolden(document.getElementById('p1'));\">\n    Embolden\n</button>\n```\n```\n\
    \n② 也通过设置文档元素的性质改变文档的显示。例如：\n\n```\nvar headline = document.getElementById(\"\
    headline\");\nheadline.setAttribute(\"align\", \"center\");\n```\n\n表示HTML元素的DOM元素，为HTML元素的每个标准属性定义了JavaScript属性，所以下面的代码可以得到相同的效果：\n\
    \n```\nvar headline = document.getElementById(\"headline\");\nheadline.align =\
    \ \"center\"; // Set alignment attribute.\n```\n\n注意：IE对setAttribute()的支持有限。\n\
    \n上例中的debug()函数可以将调试信息附加在文档的后面。可用于下面的HTML文档：\n\n```\n<!-- 3-7.html -->\n<body>\n\
    \    <script>var numtimes=0;</script>\n    <button onclick=\"debug('clicked: '\
    \ + numtimes++);\">\n    press me\n    </button>\n</body>\n```\n\n这个例子中示范了一个给文档添加内容的新方法。即：使用了<div>元素的innerHTML属性。把任何元素的innerHTML属性设置成一个HTML文本串，都会使那段HTML被解析为元素的内容。虽然这个属性不属于DOM\
    \ API，但它非常简便，而且所有的浏览器都支持它。\n\n"
