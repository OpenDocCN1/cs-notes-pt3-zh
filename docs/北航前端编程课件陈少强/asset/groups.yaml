    \    .slideDown('slow'); //显示\n});\n```\n\n### 2、使用.animate()第二种形式\n\n可以实现更复杂的效果。\n\
    \n```javascript\n//在例4-4-14.js中：\n$('div.label').click(function() {\n    var paraWidth\
    \ = $('div.speech p').outerWidth();\n    var $switcher = $(this).parent();\n \
    \   var switcherWidth = $switcher.outerWidth();\n```\n\n```\n$switcher\n.css({position:\
    \ 'relative'})\n.fadeTo('fast', 0.5)\n.animate({\n    left: paraWidth - switcherWidth\n\
    }, {\n    duration: 'slow',\n    queue: false\n})\n.fadeTo('slow', 1.0)\n.slideUp('slow')\n\
    .slideDown('slow');\n});\n```\n\n本例中，.animate()的第二个参数包含了queue选项，把该选项设置为false可将当前动画与前一个动画同时开始，而不是顺序开始。由于两个动画的速度不同，这是.animate()的第一种形式所做不到的。\n\
    \n"
