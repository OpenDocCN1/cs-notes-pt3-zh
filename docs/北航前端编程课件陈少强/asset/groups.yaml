    \ 元素的显示状态，实现按钮及菜单功能。\n  - `display:block`，将超链接从一段文本转变为块状元素。这里的超链接是一段普通文本，转换为块状元素后就可以进一步设置其布局与显示，实现按钮功能。\n\
