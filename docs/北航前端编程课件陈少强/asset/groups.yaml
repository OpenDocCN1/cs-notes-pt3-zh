    \ Mobile使用主题机制来定义用户界面的可视化表现。每一个界面元素（如页面、按钮或组件）都可以使用主题中不同的色样（swatch）。\n\n所谓主题，是一组排版、样式以及颜色，它定义了一种风格。每个主题都包含一组色样。色样为元素显示提供了不同的选择，在应用中可以随时更换色样。色样由a到z的字母标识，默认主题包含了从a到e的定义（见下图），为自定义色样预留了很多字母。\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_240_0.png)\n\n默认主题的从a到e的色样\n\n色样通过在jQuery\
    \ Mobile的HTML元素上使用data-theme属性来指定，例如：data-theme=\"e\"。\n\n色样具有CSS的层叠特性，如果为父元素指定了一个色样，除非另外指定，它的子元素也将使用这个色样。\n\
    \n使用默认主题的色样时，有一些默认的约定。见下表：\n\n| 字母 | 描述 | 颜色 |\n|---|---|---|\n| a | 最高视觉优先级（缺省用于工具栏）\
    \ | 黑色 |\n| b | 次最高视觉优先级 | 蓝色 |\n| c | 基准优先级（适用于大多数情况） | 银色 |\n| d | 次最高优先级的替代方案\
    \ | 灰色 |\n| e | 强调 | 黄色 |\n"
  mdcn: "\n\n## 4.4.5 排队效果\n\n排队效果不能自动应用到其它的非动画方法上，例如.css()方法，即使把它们放置在连续序列中的正确位置上，它们也会立即执行。\n\
    \n```\n//在例4-4-15.js中：\n.fadeTo('slow', 1.0)\n.slideUp('slow')\n.css({backgroundColor:\
    \ '#f00'})\n.slideDown('slow');\n```\n\n把非动画方法添加到队列中的一种方式，就是使用.queue()方法。\n\n\
    ```\n//在例4-4-16.js中：\n$('div.label').click(function() {\n    var paraWidth = $('div.speech\
    \ p').outerWidth();\n    var $switcher = $(this).parent();\n    ...\n    .fadeTo('slow',\
    \ 1.0)\n    .slideUp('slow')\n    .queue(function(next) {\n        $switcher.css({backgroundColor:\
    \ '#f00'});\n        next();\n    })\n    .slideDown('slow');\n});\n```\n\n在这里，.queue()方法把一个回调函数添加到元素的效果队列中。\n\
    \n回调函数有一个函数参数，它用于将效果连接起来，否则动画将中断。\n\n3、处理多组元素\n\n当为不同组的元素应用动画效果时，这些效果几乎会同时发生。\n\
    \n```\n//在例4-4-17.js中：\n$('p').eq(2)\n.css('border', '1px solid #333')\n.click(function()\
    \ {\n    $(this).slideUp('slow').next().slideDown('slow');\n});\n$('p').eq(3).css('backgroundColor',\
    \ '#ccc').hide();\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_233_0.png)\n\
    \n注意：这里的点击事件针对的是第三段文本，而第二段文本起初是被隐藏的。\n\n为了对不同组元素的动画效果进行排队，jQuery为每个动画方法提供了回调函数。作为参数的回调函数将在动画执行之后作为本次动画内容被调用。\n\
    \n```\n//在例4-4-18.js中：\n$('p').eq(2)\n.css('border', '1px solid #333')\n.click(function()\
    \ {\n    var $clickedItem = $(this);\n    $clickedItem.next().slideDown('slow',\
    \ function() {\n        $clickedItem.slideUp('slow');\n    });\n});\n$('p').eq(3).css('backgroundColor',\
    \ '#ccc').hide();\n```\n\n有了回调函数就可以解决前面提到的对非动画方法的排队问题，而不使用.queue()方法。\n\n```\n\
    //在例4-4-19.js中：\n$('div.label').click(function() {\n  var paraWidth = $('div.speech\
    \ p').outerWidth();\n  var $switcher = $(this).parent();\n  ...\n  .fadeTo('slow',\
    \ 1.0)\n  .slideUp('slow', function() {\n    $switcher.css({backgroundColor: '#f00'});\n\
    \  })\n  .slideDown('slow');\n});\n```\n\n## 第五章 jQuery Mobile简介\n\n### 5.1 jQuery\
    \ Mobile是什么\n\njQuery Mobile是一个支持所有流行移动设备平台的统一的用户界面系统，是一个构建于jQuery之上的UI层。它是一个帮助开发者更容易地在移动设备和平板电脑上交付跨平台Web应用的框架，只使用标准的HTML5代码。\n\
    \n移动Web应用与通常的移动网站在目标上并不相同。一个Web应用通常会模仿原生的手机应用，有着更加事务性的用户界面。它虽然是由网页技术(HTML、CSS、JavaScript、AJAX)创建的，但向用户提供了一个类似应用程序的体验。\n\
    \n它不是面向所有移动应用的解决方案，但它比使用原生代码开发在跨平台方面具有优势，因为它使用W3C的标准。\n\n### 5.2 jQuery Mobile初步\n\
    \n#### 5.2.1 准备文档\n\n- 1、系统文件\n- jquery-1.9.1.min.js: jQuery核心JavaScript文件\n-\
    \ jquery.mobile-1.3.2.min.js: jQuery Mobile核心JavaScript文件\n- jquery.mobile-1.3.2.min.css:\
    \ jQuery Mobile核心CSS文件\n\n对本地应用来说，需要将它们保存到项目的根目录下。\n其它可能涉及的文件包括：\n\n- jquery-XX.js\n\
    - jquery.mobile-XX.js\n- jquery.mobile-XX.css\n- jquery.mobile.structure-XX.css\n\
    - jquery.mobile.structure-XX.min.css\n- 图片文件夹\n\n2、在HTML5文档中\n\n```\n```html\n\
    <head>\n    <meta charset=\"utf-8\" />\n    <title>Your Title</title>\n    <link\
    \ rel=\"stylesheet\" href=\"jquery.mobile-1.3.2.min.css\" />\n    <script type=\"\
    text/javascript\" src=\"jquery-1.9.1.min.js\"></script>\n    <script type=\"text/javascript\"\
    \ src=\"jquery.mobile-1.3.2.min.js\"></script>\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n</head>\n```\n```\n\n其中：\n\n- viewport(视口)是页面在屏幕上所占的区域，可以指定它的宽和高，使它比屏幕的可见区域更大。\n\
    - scale (比例)指图形和文本的放大比例，视口也随之放大。\n\n可以指定禁止用户改变页面比例：\n\n```\n```html\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1,\n    user-scalable=no\"\
    >\n```\n```\n\n### 5.2.2 文档结构\n\njQuery Mobile的文档结构主要由页面(page)构成。一个页面仅仅是一个带有data-role=\"\
    page\"属性的div元素。一个HTML文档可以包含多个页面。\n\n使用简单的HTML标记（例如超链接标记a），可以连接到同一个HTML文档中的另一个页面，也可以连接到外部HTML文档中的页面。\n\
    \n#### 1、 data-role属性\n\njQuery Mobile使用标准的HTML标记，如div标记。只要给这些标记增加data-role属性，就可以使其具有不同的作用。例如<div\
    \ data-role=\"page\">\n\nHTML5有一个自定义数据属性的特性，可以用来在标记上添加任何形如data-*的属性。data-role只不过是jQuery\
    \ Mobile使用该特性添加的一个自定义数据属性。jQuery Mobile中大量使用这种特性。\n\n#### 2、主题（theme）\n\njQuery\
    \ Mobile使用主题机制来定义用户界面的可视化表现。每一个界面元素（如页面、按钮或组件）都可以使用主题中不同的色样（swatch）。\n\n所谓主题，是一组排版、样式以及颜色，它定义了一种风格。每个主题都包含一组色样。色样为元素显示提供了不同的选择，在应用中可以随时更换色样。色样由a到z的字母标识，默认主题包含了从a到e的定义（见下图），为自定义色样预留了很多字母。\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_240_0.png)\n\n默认主题的从a到e的色样\n\n色样通过在jQuery\
    \ Mobile的HTML元素上使用data-theme属性来指定，例如：data-theme=\"e\"。\n\n色样具有CSS的层叠特性，如果为父元素指定了一个色样，除非另外指定，它的子元素也将使用这个色样。\n\
    \n使用默认主题的色样时，有一些默认的约定。见下表：\n\n| 字母 | 描述 | 颜色 |\n|---|---|---|\n| a | 最高视觉优先级（缺省用于工具栏）\
    \ | 黑色 |\n| b | 次最高视觉优先级 | 蓝色 |\n| c | 基准优先级（适用于大多数情况） | 银色 |\n| d | 次最高优先级的替代方案\
    \ | 灰色 |\n| e | 强调 | 黄色 |\n\n"
