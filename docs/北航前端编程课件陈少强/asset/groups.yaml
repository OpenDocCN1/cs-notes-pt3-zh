  md: "\n### 5.2.4 对话框\n\n### 5、边栏\n\n也称为面板组件(Panel Widget)。它与页眉、页脚和内容平级，不会影响浏览历史。通常写在页面的前部或后部，作为边栏滑出。\n\
    \n为了实现此功能，组件需要 `data-role=\"panel\"`，并且有一个 `id` 属性，其 `id` 值是打开它的超链接的链接目标。例如：\n\
    \n```\n<a href=\"#mypanel\">Open panel</a>\n<div data-role=\"panel\" id=\"mypanel\"\
    >\n<!-- panel content goes here -->\n</div>\n```\n\n打开面板的超链接是以切换(toggle)方式绑定的，再次点击则关闭边栏。其实关闭边栏有很多方法，包括滑动、在空白处点击等。\n\
    \n边栏有一个固定的宽度：17em（272 pixels），见例5-2-7.html。\n\n设置边栏的宽度样式比较复杂，但如果需要这些CSS也可以重写。\n\
    \n### 5.2.5 与电话整合\n\n实现这一点的一个方法是使用URL机制。\n\n`a` 标签的 `href` 属性中可以使用不同的协议。这些协议中有些是大多数设备都支持的，还有些则是依赖平台的（如iOS）。依赖平台的协议在创建本地Web应用并知道它会在什么平台上运行时很有用。\n\
    \n见例：5-2-8.html\n\n### 1、拨打电话\n\n首选的方法是使用 `tel:<电话号码>` 方案：\n\n```\n<a href=\"\
    tel:01082313346\">Call me!</a>\n```\n\n建议插入的电话号码使用国际格式：加号(+)，国家代码，区号，最后是本地号码。\n\
    \n用户激活电话链接时将看到一个确认页面，询问是否要拨打这个电话，以防止用户拨打国际电话或收费电话。\n\n如果手机不能拨打国际电话，也可以在这里删除国家代码。\n\
    \n### 2、发送电子邮件\n\n需要使用 `mailto` 协议，语法是：\n\n```\nmailto:<destination email>[?parameters]\n\
    ```\n\n方括号表示可选参数。\n\n不同的设备支持不同的参数，但基本上都包含cc（抄送）、bcc（暗送）、subject（标题）以及body（信件内容）参数。\n\
    \n参数以URL格式(key=value&key=value)定义，值必须经过URI编码。\n\n例如：\n\n```\n<a href=\"mailto:info@mobilexweb.com\"\
    >Mail us</a>\n<a href=\"mailto:info@mobilexweb.com?subject=Contact%20from%20mobile\"\
    >Mail us</a>\n<a href=\"mailto:info@mobilexweb.com?subject=Contact&body=This%20is%20the%20body\"\
    >Mail us</a>\n```\n\n通常，用户点击发送电子邮件链接时，支持的手机将打开发送邮件应用，相应字段也已填充。\n\n### 3、发送消息\n\
    \n对支持jQuery Mobile的智能手机，可以安全地使用 `sms://` 协议。\n\n发送消息的语法是 `sms://[<destination\
    \ number>][?parameters]` 方括号表示可选，其参数格式与发送电子邮件一样。例如：\n\n```\n<a href=\"sms://\"\
    >Send an SMS</a>\n\n<a href=\"sms://?body=Visit%20the%20best%20site%20at%20http://mobilexweb.com\"\
    >Invite a friend by SMS</a>\n\n<a href=\"sms://+3490322111\">Contact us by SMS</a>\n\
    \n<a href=\"sms://+3490322111?body=Interested%20in%20Product%20AA2\">More info\
    \ for product AA2</a>\n```\n\n用户点击发送消息链接时，只是打开编辑短消息的窗口，相应字段也已填充，用户必须手动完成整个过程。\n\
    \n## 5.3 UI组件\n\njQuery Mobile为Web应用准备了相当多的UI组件。尽管可以使用普通的HTML和CSS来添加内容及实现各种创意，但为了兼容各个平台，建议优先使用jQuery\
    \ Mobile提供的各种组件。\n\njQuery Mobile组件可以分为以下几类：\n\n- 工具栏组件\n- 格式化组件\n- 按钮组件\n- 列表组件\n\
    - 表单组件\n\n本章介绍前三类组件，列表和表单组件有独立的两章介绍。\n\n### 5.3.1 工具栏\n\n工具栏就是页头和页脚，它们是可选的，但基本上每个Web应用都有页头。\n\
    \n### 1、定位\n\n不论是页头或页脚，工具栏都可以有4种方法定位：\n\n- 内联模式\n- 固定模式\n- 全屏下的固定模式\n- 真正的固定模式\n\
    \n① 内联模式：是工具栏的默认模式，工具栏位于页面的顶部或底部，随页面滚动。如果页面的长度超出可见高度时页脚将被隐藏，直到向下拖动滚动条，同时页头只在滚动条在顶部时才可见。\n\
    \n② 固定模式：工具栏不随页面滚动，总是浮在可见区域的顶部或底部。页面滚动时，工具栏会自动淡出隐藏，滚动完成时，工具栏会再次在顶部或底部出现。\n\n要定义一个固定工具栏，只需在页头或页脚中使用\
    \ `data-position=\"fixed\"` 属性。缺省属性是 `data-position=\"inline\"`。\n\n当用户点击页面上某个非交互的内容区域时，固定模式和内联模式将相互切换，以便在需要时有更多的空间来显示内容。\n\
    \n③ 全屏下的固定模式：在全屏模式下（页面具有 `data-fullscreen=\"true\"` 属性），固定工具栏只在用户点击屏幕时才出现，再次点击则消失。例如：\n\
    \n```\n<div data-role=\"page\" data-fullscreen=\"true\">\n  <div data-role=\"\
    header\" data-position=\"fixed\">\n  </div>\n  <div data-role=\"content\">\n \
    \ </div>\n  <div data-role=\"footer\" data-position=\"fixed\">\n  </div>\n</div>\n\
    ```\n\n固定工具栏可见时，内容会被遮挡。在大多数浏览器中，页头会使用半透明，可以透过页头看到后面的内容。\n\n④ 真正的固定模式：框架将创建一个较小的滚动区域来代替全屏，这样工具栏就可以总是位于一个位置。\n\
    \n使用该模式，首先需要在页头或页脚中使用 `data-position=\"fixed\"` 属性，然后使用后面介绍的 JavaScript API 开启\
    \ touchOverflow 特性，通常这个特性是关闭的：\n\n```\n$.mobile.touchOverflowEnabled = true;\n\
    ```\n\n开启该特性后，不支持它的浏览器将降级为固定工具栏。\n\n### 2、在页头中添加内容\n\n标准的jQuery Mobile页头包含一个hx标题，以及一到两个可选的位于页头两侧的按钮。也可以按需要定制页头的外观和内容。\n\
    \n- ① 添加按钮：通常在右侧使用肯定动作按钮，在左侧使用否定动作按钮。\n- 页头的按钮就是一个超链接。如果只提供了一个a元素，则它将位于左侧，如果添加了两个按钮，则第一个位于左侧，第二个位于右侧。\n\
    - 如果想强制指定按钮的位置，可以使用CSS类：`class=\"ui-btn-right\"` 或 `class=\"ui-btn-left\"`。\n\n\
    例如：\n\n```\n<div data-role=\"header\">\n<a href=\"logout\">Log out</a>\n<h1>Title</h1>\n\
    <a href=\"settings\" data-icon=\"gear\">Settings</a>\n</div>\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_261_0.png)\n\
    \n默认情况下，工具栏的每个按钮都继承工具栏的主题。如果想让一个按钮与众不同，可以使用 `data-theme` 来改变它的色样。\n\n例如：\n\n```html\n\
    <div data-role=\"header\">\n<a href=\"cancel\" data-icon=\"delete\">Cancel</a>\n\
    <h1>New record</h1>\n<a href=\"save\" data-icon=\"check\" data-theme=\"b\">Save</a>\n\
    </div>\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_262_0.png)\n\n如果想自定义一个后退按钮，一定要在对应的a元素上使用\
    \ `data-rel=\"back\"` 属性；如果已经在页面中使用 `data-add-back-btn=\"true\"` 属性添加了后退按钮，则不应该再在左侧添加其它按钮。\n\
    \n### 添加logo\n\n使用图片或logo代替文本是很常见的。在带有标准左右按钮的页头中显示图片，最好的方式是在对应的h1中使用img标记，例如：\n\
    \n```\n<div data-role=\"header\">\n<a href=\"cancel\" data-icon=\"delete\">Cancel</a>\n\
    <h1><img src=\"images/logo.png\"></h1>\n<a href=\"save\" data-icon=\"check\" data-theme=\"\
    b\">Save</a>\n</div>\n```\n\n页头会自动适应图片的高度，但不要使用高度超过125像素的图片。\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_263_0.png)\n"
