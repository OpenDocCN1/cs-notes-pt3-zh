    \n### 2.4 CSS的使用方式\n\n### 2.4.1 内嵌样式：\n\n即将样式作为标记的style属性值直接写在标记内，样式之间以“;”分割。见下例，2-1.html：\n\
    \n```\n<!DOCTYPE...>\n<html>\n    <head>\n        <title>网络编程技术</title>\n    </head>\n\
    \    <body>\n        <h2 style=\"font-size:20pt\">前台技术</h2>\n        <p style=\"\
    background-color:rgb(255,0,0)\">HTML</p>\n        <p style=\"background-color:#00ff00\"\
    >CSS</p>\n        <p style=\"background-color:#00f\">JavaScript</p>\n    </body>\n\
    </html>\n```\n\n### 2.4.2 内部样式表：\n\n内部样式表使用style标记，写在head标记之间，见下例，2-2.html：\n\n\
    ```\n<html>\n<head>\n<title>网络编程技术</title>\n<style type=\"text/css\">\nh2 {font-size:30pt;\
    \ background-color:rgb(0,255,0)}\np {background-color:rgb(255,0,0)}\n</style>\n\
    </head>\n<body>\n<h2>前台技术</h2>\n<p>HTML</p>\n<p>CSS</p>\n<p>JavaScript</p>\n</body>\n\
    </html>\n```\n\n### 2.4.3 导入外部样式表：\n\n将CSS文件导入到内部样式表，见下例，2-3.html：\n\n```\n<html>\n\
    <head>\n<title>网络编程技术</title>\n<style type=\"text/css\">\n@import url(2-3.css);\
    \ <!--注意分号一定要-->\n</style>\n</head>\n<body>\n<h2>前台技术</h2>\n<p>HTML</p>\n<p>CSS</p>\n\
    <p>JavaScript</p>\n</body>\n</html>\n```\n\n```\n/*2-3.css*/\nh2{\nfont-size:30pt;\n\
    background-color:rgb(0,255,0)\n}\np{background-color:rgb(255,0,0)}\n```\n\n###\
    \ 2.4.4 链接外部样式表：\n\n使用link标记，从<head>～</head>部分链接一个CSS文件，见下例2-4.html：\n\n```\n\
    <html>\n<head>\n<title>网络编程技术</title>\n<link rel=\"stylesheet\" href=\"2-3.css\"\
    >\n</head>\n<body>\n<h2>前台技术</h2>\n<p>HTML</p>\n<p>CSS</p>\n<p>JavaScript</p>\n\
    </body>\n</html>\n```\n\n注：前面介绍的@import语句，也可用在CSS文件中。\n\n### 2.5 HTML与CSS的接口\n\
    \n为了能够准确地使用CSS控制由标记定义的HTML各元素的表现形式（也包括将来使用脚本控制其行为），HTML为所有标记定义了id和class属性，以便从不同级别定位元素。\n\
    \nid: 元素标识符属性。用来唯一地标识一个元素。\n\nclass: 类型标识符属性。用来表示元素所属的类型。多个元素可以属于一个类型，一个元素也可以属于多个类型（以空格隔开）。\n\
    \n例如：\n\n```\n<p id=\"id1\" class=\"para cl1\">HTML</p>\n<p id=\"id2\" class=\"\
    para cl1\">CSS</p>\n<p id=\"id3\" class=\"para cl2\">JavaScript</p>\n```\n\n###\
    \ 2.6 CSS语法结构\n\n前面已经见过简单的CSS样式定义，例如：\n\n```\np {background-color:rgb(255,0,0);}\n\
    ```\n\nCSS语法结构由3个部分组成：选择器(Selector)、属性(Property)和值(Value)。使用方法是：\n\n```\nSelector\
    \ {Property: Value;}\n```\n\n其中：\n\n选择器：指出需要设置样式的对象，有各种指定方式。\n\n属性和值：指定具体的一个样式。\n\
    \n重要：CSS样式表中可以包含注释，形如： /*注释*/\n"
