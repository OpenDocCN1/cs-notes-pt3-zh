    \n## 2.7 CSS样式优先权\n\n由于存在4种不同的样式使用方式，以及定义样式时的各种选择器，因此在CSS的样式定义中，难免存在重复定义。最终到底是哪个样式定义起作用？就是所谓的样式优先权问题。下面的原则与前页的“继承”是一致的：\n\
