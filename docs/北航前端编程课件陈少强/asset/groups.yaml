  - '[PAGE 132]


    # 3.3.4 表单和表单元素


    # 1、Form对象


    JavaScript的Form对象代表了一个HTML表单。它们按照自己在文档中出现的顺序存放在Document对象的forms[]数组中。例如：


    ```

    `document.forms[document.forms.length-1]; // 最后一个表单`

    ```


    表单对象最重要的属性是elements[]数组，其中包含着各种类型的表单输入元素的JavaScript对象。它们也是按照其在文档中出现的顺序放置的。


    还有其它的表单属性，例如：


    +   - **action**：对应<form>的属性action，提交表单时，向该URL发送表单数据。

    +   - **method**：对应<form>的属性method，指定表单数据传送至HTTP服务器的方法：get/post。get：以URL的形式发送数据；post：浏览器与服务器建立联系后，再将表单数据发往服务器。

    +   - **target**：对应<form>的属性target，指定目标窗口或框架的名称。


    它们都用于控制如何将表单数据提交给服务器以及在哪里显示结果。它们的值都是可读可写的字符串，可以动态地进行设置来改变提交表单的方式。'
  - "[PAGE 133]\n\n# 3.3.4 表单和表单元素\n\nJavaScript的Form对象支持两个方法：submit()和reset()。调用它们相当于点击了表单的Submit按钮和Reset按钮，用于提交和重置表单。\n\
    \n为了配合submit()和reset()方法，Form对象提供了事件处理程序onsubmit和onreset，前者用于探测表单的提交，后者用于探测表单的重置。onsubmit在表单提交之前调用，如果它返回false，则取消表单提交。这给JavaScript提供了检查用户输入是否存在错误的机会，以免向Web服务器提供不完整或无效的数据。\n\
    \n注意：只用真正点击Submit按钮才会触发onsubmit事件处理程序，调用表单的submit()方法则不会触发它。reset()方法也于此类似。\n\n\
    如果表单又长又复杂，就应该使用类似下面的重置确认：\n\n```\n<form...\n    onreset=\"return confirm('Really\
    \ erase ALL data and start over?')\"\n>\n```"
