    # 2.8 CSS页面布局与定位


    # 2.8.7 定位布局


    （4）设置层叠顺序


    由于定位的出现，使得元素重叠的情况成为可能。这就出现谁遮挡谁的问题，即层叠顺序问题。


    在默认规则下，使用position属性的元素要遮挡没有该属性的元素；在使用position属性的元素间，后面的元素遮挡前面的元素。


    使用z-index属性，可以改变使用position属性元素间的层叠顺序。其值为一整数，值越大越具有显示优先权，即层叠顺序越高。但只有具有相同父元素的元素之间才具有可比性。


    见例2-11.html。注意字母b原来被float排挤，现在已不受float影响。


    ```

    /*例：2-11.CSS*/

    #a,#b,#c,#d{

    background-color:#ccc;

    border:2px solid #333;

    width:100px;

    height:100px;

    float:left;

    }

    #b{

    width:300px;

    height:200px;

    position:relative;

    }

    #c{

    position:absolute;

    top:50px;

    left:50px;

    z-index:10;

    }

    #d{

    position:absolute;

    z-index:1;

    }

    ```'
