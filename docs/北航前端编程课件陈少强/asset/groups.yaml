    \ = \"Back\";\n$.mobile.dialog.prototype.options.closeBtnText = \"Close\"\n$.mobile.collapsible.prototype.options.expandCueText\
    \ = \"click to expand contents\";\n$.mobile.collapsible.prototype.options.collapseCueText\
    \ = \"click to collapse contents\";\n$.mobile.listview.prototype.options.filterPlaceholder\
    \ = \"Filter items...\";\n$.mobile.selectmenu.prototype.options.closeText = \"\
    Close\";\n```\n\n这些都可以在mobileinit中进行改变，例如：\n\n```\n$.mobile.loadingMessage = \"\
    正在加载\";\n```\n\n2、页面配置\n\n页面由data-role=\"page\"定义。缺省情况下，页面使用默认属性。如果想改变默认属性，可以在页面中使用data-*属性来设置。\n\
    \n这里所说的是改变所有页面使用的默认属性。这要通过页面原型的 options对象来改变。例如下例为页面增加了后退按钮并设置了默认主题。\n\n```\n\
    $(document).bind('mobileinit', function() {\n    $.mobile.page.prototype.options.addBackBtn\
    \ = true;\n    $.mobile.page.prototype.options.backBtnTheme = \"e\";\n    $.mobile.page.prototype.options.headerTheme\
    \ = \"b\";\n    $.mobile.page.prototype.options.footerTheme = \"d\";\n});\n```\n\
    \n3、组件配置\n\njQuery Mobile中的每个组件都有自己的默认配置属性。可以通过组件的prototype属性中的options对象来改变这些默认属性。例如：\n\
    \n```\n$(document).bind('mobileinit', function() {\n  $.mobile.listview.prototype.options.filter\
    \ = true;\n  $.mobile.selectmenu.prototype.options.nativeMenu=false;\n  $.mobile.selectmenu.prototype.options.theme=\"\
    e\";\n});\n```\n\n其实页面也是一种组件。每种组件都有哪些默认配置属性可以查阅jQuery Mobile文档。\n\n## 5.6.3 实用工具\n\
    \njQuery Mobile提供了许多使用JavaScript来管理应用的实用工具，这些工具通过方法及只读属性提供，使jQuery Mobile程序设计更加方便。\n\
    \n- 1、操作自定义属性\n\n使用jQuery Mobile时，经常需要处理各种data-*自定义属性。例如：\n\n```\nvar buttons\
    \ = $(\"a[data-role='button']\");\n```\n\njQuery Mobile添加了一个新的过滤器jqmData，它能够处理名字空间，因此使用起来更安全。例如，下面的语句与上面的等效但更安全：\n\
    \n```\nvar buttons = $(\"a:jqmData(role='button')\");\n```\n\n同理，在jQuery集合上使用jqmData和jqmRemoveData比使用jQuery函数data和removeData更加安全。例如：\n\
    \n```\n$(\"#button1\").jqmData(\"theme\", \"a\");\n$(\"a\").jqmRemoveData(\"transition\"\
    );\n```\n\n2、页面工具\n\n当需要访问当前页面时，可以使用$.mobile.activePage属性，该属性自动与当前可见的data-role=\"\
    page\"元素关联，是一个JavaScript对象，通常是一个div元素。例如：\n\n```\nvar currentPageId = $.mobile.activePage.id;\n\
    ```\n\n另一个属性：$.mobile.pageContainer则代表当前页面的容器，通常是body元素。\n\n框架中最有用的工具应该是$.mobile.changePage方法，它允许我们转向另一个页面，就像点击了响应的链接一样。\n\
    \n该方法的第一个参数是必选的：可以是一个代表外部页面的字符串，也可以是指向内部页面的jQuery对象。例如：\n\n```\n$.mobile.changePage(\"\
    external.html\");\n$.mobile.changePage($(\"#pageId\"));\n```\n\n注意：不能通过字符串来加载内部页面，必须使用jQuery对象。这就是上例中使用$(\"\
    #pageId\")的原因。\n\nchangePage的第二个参数是可选的，是一个对象，通常为JSON格式，用于定义页面过渡和AJAX加载的选项。例如：\n\
    \n```\n$.mobile.changePage($(\"#page2\"), {\n    transition: \"slide\",\n    reverse:\
    \ true\n});\n```\n\n页面过渡和AJAX加载的选项有很多，具体可以查阅文档。\n还有一个$.mobile.loadPage方法，它只将页面加载到DOM，但并不会转向它。需要使用$.mobile.changePage来显示它。\n\
    \n"
