  - '[PAGE 314]


    # 5.5.2 表单元素


    # 10. 单选按钮


    在jQuery Mobile中使用单选按钮有几个条件：


    +   - 每个选项必须是一个 `<input type="radio">`。

    +   - 同一组每个选项的name属性值必须相同。

    +   - 每个选项必须具有唯一的id和一个关联的label标签。


    单选按钮与它的label标签被显示在一个按钮里。可以使用一个legend元素为整个选项组提供一个文本标签。


    示例：`5-5-6.html`


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_314_0.png)'
  - '[PAGE 315]


    # 5.5.2 表单元素


    如果将所有radio元素都包含在一个controlgroup容器中，用户界面会更友好一些。


    见例： 5-5-7.html


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_315_0.png)


    如果将controlgroup容器的type改为horizontal，外观将大不一样。元素将不再是典型的单选按钮，而是变成了单选开关按钮。


    见例： 5-5-8.html


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_315_1.png)'
