    4. 在有库冲突时使用$()\n\n   在某些情况下，可能有必要在同一个页面中使用多个JavaScript库。由于很多库都使用了$标识符，这将引起冲突。为此，jQuery提供了一个jQuery.noConflict()方法，调用该方法可以把对$标识符的控制权转让给其它库。例如：\n\
    \n   ```html\n   <script src=\"prototype.js\"></script>\n   <script src=\"jquery.js\"\
    ></script>\n   <script> jQuery.noConflict(); </script>\n   <script src=\"myscript.js\"\
    ></script>\n   ```\n\n   上面的代码将对$的控制权交给了prototype.js库。这时，在自己的脚本(myscript.js)中，可以使用两个库。当然，在使用jQuery方法时，需要用jQuery代替$。\n\
    \n   在这种情况下，仍然有一种在.ready()方法中使用$的技巧。在传递给ready的回调函数中可以接收一个参数——jQuery对象本身。利用这个参数，可以重新命名jQuery为$，而不必担心冲突：\n\
    \n   ```javascript\n   jQuery(document).ready(function($) {\n       // 在这里，可以正常使用$\n\
    \   });\n   ```\n\n   或者简写为：\n\n   ```javascript\n   jQuery(function($) {\n  \
    \ // Code that uses $.\n   });\n   ```\n\n### 4.3.2 简单事件\n\njQuery通过.bind()方法为DOM元素添加事件响应函数。\n\
    \n1. 一个简单的样式转换器\n\n例：4-3-1.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_187_0.png)\n\
    \n该例的按钮部分有如下代码：\n\n```\n/* 在4-3-1.html中 */\n<div id=\"switcher\" class=\"switcher\"\
    >\n  <h3>Style Switcher</h3>\n  <button id=\"switcher-default\">Default</button>\n\
    \  <button id=\"switcher-narrow\">Narrow Column</button>\n  <button id=\"switcher-large\"\
    >Large Print</button>\n</div>\n\n/* 在4-3-1.css中 */\nbody.large .chapter { font-size:\
    \ 1.5em;}\nbody.narrow .chapter { width: 250px;}\n```\n\n```\n/* 4-3-1.js */\n\
    $(document).ready(function() {\n    $('#switcher-default').bind('click', function()\
    \ {\n        $('body').removeClass('narrow');\n        $('body').removeClass('large');\n\
