    # 2.9.2 对子元素的剪切控制


    Overflow属性用来决定对超出元素边框范围的子元素的处理方式，可能的选择包括：


    +   1) visible: 显示全部内容。这是缺省选项。\n2) hidden: 隐藏超出显示范围的内容，也就是进行剪切。\n3) scroll: 元素出现水平和垂直两个滚动条。\n4)
    auto: 两个滚动条会根据内容是否超出范围分别自动出现。


    例2-13.html: 剪切效果'
