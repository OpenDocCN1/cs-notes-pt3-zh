    5、变量存储的内容


    +   1）基本类型与引用类型

    +   可以將數據類型分為兩組：基本類型和引用類型。


    +   ① 基本类型：包括数值、布尔值、null和undefined。

    +   它们的特点是在内存中具有固定的大小。


    +   ② 引用类型：就是对象（包括函数、数组等）。

    +   它们的特点是在内存中的大小不固定。


    +   2）变量的存储内容


    +   ① 对基本类型，变量存储的是值。


    +   ② 对引用类型，变量存储的是引用，也就是通常说的指针。


    +   3）字符串的类型


    字符串的类型是个特例：它既不是基本类型，因为不同字符串没有固定的大小；也不是引用类型，因为不可以通过变量名改变字符串的内容和大小。可以把它看做是不可变引用类型。'
