    \n### 4.4.3 动画效果\n\n#### 1、指定显示速度\n\njQuery有3种预设的速度常量：‘slow’、‘normal’和‘fast’。如果想指定更精确的速度，可以使用毫秒值。\n\
    \n可以为hide()和show()方法指定速度参数来产生动画效果。例如：.show(‘slow’)会在0.6秒钟内完成显示，.show(‘normal’)是0.4秒，.show(‘fast’)则是0.2秒。另外还可以指定更精确的0.85秒：.show(850)。\n\
