    \    document.write(\"name:\"+prop+ \"; value:\"+obj[prop]+\"<br>\");\nfor(var\
    \ prop in ary)\n    document.write(\"index:\"+prop+ \"; value:\"+ary[prop]+\"\
    <br>\");\n```\n\n### 9、标签语句\n\n任何语句都可以通过在它前面加上标识符和冒号来标记，成为带有标签的语句。这样在程序的任何地方都可以通过这个标签来引用它。由于标签名不同于变量名和函数名，所以标签名可以和变量或函数同名，且互不影响。标签语句的语法为：\n\
