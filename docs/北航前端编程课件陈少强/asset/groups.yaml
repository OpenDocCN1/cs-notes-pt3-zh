    # 3、Document对象的属性


    **body**：提供对 `<body>` 元素的直接访问。对于定义了框架集的文档，该属性引用最外层的 `<frameset>`。


    +   - **cookie**：设置或返回与当前文档有关的所有 cookie。

    +   - **domain**：返回当前文档的域名。

    +   - **lastModified**：文档的最后修改日期

    +   - **title**：位于文档标记 `<title>` 和 `</title>` 之间的文本

    +   - **URL**：文档的 URL。它应该与 Window 对象的属性 location.href 相同。

    +   - **referrer**：将浏览器带到当前文档的前一个文档的 URL。


    # 4、文档中的表单


    HTML中的表单元素由 `<form>` 标签定义。Document对象的 forms[] 数组中存放着对它们的引用。Web应用程序的交互界面通常由表单构成，所以它非常重要，将在后面单独介绍。'
  - '[PAGE 128]


    # 3.3.3 Document对象


    5、图像


    HTML中的图像元素由<img>标签定义。Document对象的images[]数组中存放着对它们的引用。


