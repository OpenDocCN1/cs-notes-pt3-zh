    \n这两个方法与hide()和show()方法类似，但渐变的只有不透明度。\n\n#### 3、滑上和滑下\n\n使用.fadeIn()和.fadeOut()，有时会感到文档跳了一下。jQuery提供了.slideDown()和.slideUp()方法，它们仅渐进改变文档的高度，用于实现垂直滑入、滑出的效果。\n\
