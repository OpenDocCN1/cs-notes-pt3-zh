    \n### 6、日期输入框\n\n在HTML中输入日期一直是个问题。HTML5加入了对日期输入的支持，只需要使用下列类型的input元素：\n\n- **date**：日期选择（年/月/日）。\n\
    - **datetime**：日期和时间选择（年/月/日/时/分），包含GMT时区。\n- **time**：时间选择（时/分）。\n- **datetime-local**：日期和时间选择，但不包括时区信息。\n\
    - **month**：月份选择，通常是个下拉列表。\n- **week**：星期选择，通常为下拉列表。\n\n这些日期输入框支持min和max属性。例如：\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_305_0.png)\n\n"
