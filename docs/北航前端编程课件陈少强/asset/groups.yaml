    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_243_1.png)\n\n## 5.2.3 导航\n\n导航在jQuery\
    \ Mobile中使用标准的HTML元素a来实现。\n\n- 1、后退按钮\n\njQuery Mobile使用栈来维护访问过的页面，这样就可以随时返回访问过的页面。但只能后退，不能前进。\n\
    \n在页面上使用data-add-back-btn=\"true\"属性将在页头左侧添加一个“后退”按钮。按钮的文本和色样可以使用页面上的data-back-btn-text和data-back-btn-theme属性来设置。如：\n\
    \n```html\n<div data-role=\"page\" data-add-back-btn=\"true\"\n    data-back-btn-text=\"\
    Previous\" data-back-btn-theme=\"e\">\n</div>\n```\n\njQuery Mobile会自动将一个指向前一个页面的链接行为转换为后退，点击时会显示一个后退动画，不会在浏览器访问历史中添加新纪录。\n\
    \n如果希望一个链接的行为后退，可以为这个a元素添加data-rel=\"back\"属性，这时的href属性值无关紧要，而仅仅是用来保持一个超链接的下划线。\n\
    \n- 2、内部页面链接\n\n要实现页面内部的跳转，需要为每个页面设置一个id属性。然后在a标记的href属性中使用“#id”即可，例如： <a href=\"\
    #next\">。\n\n默认情况下，jQuery Mobile使用页头中的标题(h1中的文本)作为浏览器的标题。可以使用页面的可选属性data-title改变缺省标题。\n\
    \n见例： 5-2-2.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_246_0.png)\n\n3、外部页面链接\n\
    外部页面链接指链接到另一个本地HTML文档。例如：\n`<a href=\"otherDocument.html\">Go to other html</a>`\n\
    外部链接目标应该是一个jQuery Mobile文档，并且仅包含一个page页面，所以才称作外部页面链接。如果一个外部文档包含多个页面，jQuery Mobile只会从加载的文档中取出第一个页面，其它内容（包括head元素中的）都会忽略。\n\
    其实在内部，jQuery Mobile只是将该页面的内容以AJAX方式加入到当前的DOM中，并将该页面添加到已访问页面堆栈中。\n见例：5-2-3.html\n\
    请求正在进行时，如果加载时间过长，用户会看到一个旋转的，表示正在加载的漂亮图标。\njQuery Mobile不支持下面这种链接：\n`<a href=\"\
    other.html#otherpage\">Go to other html</a>`\n\n### 4、绝对外部链接\n\n当需要链接到其它站点或非jQuery\
    \ Mobile文档时，就需要使用绝对外部链接。它可以通过在a标记中添加data-rel=\"external\"来实现：\n\n```html\n<a href=\"\
    http://www.mobilexweb.com\" data-rel=\"external\">Check my blog</a>\n```\n\n还有些链接，比如指定了target属性或链接到不同域名的文档，无论这些文档是否jQuery\
    \ Mobile文档，都会被当做绝对外部链接：\n\n```html\n<a href=\"http://www.mobilexweb.com\" target=\"\
    _blank\">Check my blog</a>\n```\n\n```html\n<a href=\"http://www.otherdomain.com/whatever\"\
    >Check my blog</a>\n```\n\n另一个强制将链接转换为绝对外部链接的方法是在连接中使用data-ajax=false属性。这在链接本地多页面jQuery\
    \ Mobile文档时有用：\n\n```html\n<a href=\"otherpage.html\" data-ajax=\"false\">Other\
    \ page</a>\n```\n\n实际上，在点击一个绝对外部链接时，jQuery Mobile将卸载当前实例，浏览器将转向指定目标。\n\n### 5、页面间的过渡效果\n\
    \n用户从一个页面转到另一个页面时，jQuery Mobile会使用一个平滑的动画过渡。缺省情况下，所有的过渡都使用从右到左的动画：在导航深入前进时，会看到从右到左的动画；返回到以前的页面时，则是从左到右的动画。\n\
    \njQuery Mobile允许为每个链接指定使用动画的过渡效果。要实现这一点，需要在链接中使用自定义属性data-transition:\n\n- slide:\
    \ 默认的从右到左的动画。\n- slideup: 从下到上的动画。\n- slidedown: 从上到下的动画。\n- pop: 从屏幕中心的一个小点开始变大，直到占满屏幕。\n\
    - fade: 淡入淡出的渐变动畫。\n- flip: 2D到3D的旋转动画。在某些设备上体现为2D旋转。\n\n另外，每种过渡效果都有一个对应的用于后退的相反的效果。相反效果由链接上的自定义属性data-direction=\"\
    reverse\"实现。\n\n见例：5-2-4.html\n\n## 5.2.4 对话框\n\n对话框是Web应用中显示页面的另一种方式。它与普通页面的最大区别是：\n\
    \n- 不是全屏显示，而是在原页面上弹出的窗口。\n- 不会在访问历史中留下记录。\n- 如果指定了data-add-back-btn=\"true\"属性，则在左上角后退按钮的位置出现一个关闭按钮（一个叉）。\n\
    \n要打开对话框，只需在a标记中加上data-rel=\"dialog\"属性。例如：\n\n```html\n<a href=\"./confirm.html\"\
    \ data-rel=\"dialog\">删除此页</a>\n```\n\n在这里data-rel=\"dialog\"指示将链接目标在对话框中打开，这是一种最常用的方式。\n\
    \n为了避免引起困惑，最好将对话框的默认过渡动画改为slide之外的效果，以便与层级页面之间的动画区别开来。\n\n还可以使data-role=\"dialog\"\
    而不是data-role=\"page\"来生成对话框。它将目标本身指定为对话框。\n\n对话框是出现在当前页面上的覆盖层，可以通过data-overlay-theme指定其色样。\n\
    \n- 1、关闭对话框\n\n以对话框方式打开的页面不能后退，只能关闭。\n\n对话框属于打开它的页面，关闭对话框时，只应该返回原来的页面。\n\njQuery\
    \ Mobile会将指向原页面的链接当作关闭处理，不会在访问历史记录中增加新的记录。\n\n见例：5-2-5.html和5-2-5-confirm.html\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_251_0.png)\n\n- 2、从对话框打开页面\n\n对话框可以有指向其它页面的普通链接。用户点击指向非原有页面的链接时，jQuery\
    \ Mobile会关闭对话框，回到原有页面，然后打开新页面，就像这个链接本来就在原页面上一样。\n\n### 3、JavaScript的对话框\n\n不要忘了可以使用JavaScript的对话框，包括：alert()、confirm()和prompt()。特别是在调试程序时，它们特别有用。\n\
    \n### 4、弹出对话框\n\n也称为弹出组件（Popup Widget）。它能够将包含在div中的任何内容，通过超链接弹出。\n\n与对话框一样，它也不影响访问历史，因此称它为对话框。\n\
    \n为了实现此功能，div需要data-role=\"popup\"，并且有一个id属性；而打开它的超链接需要data-rel=\"popup\"，并且其链接目标为div的id值。\n\
    \n例如：\n\n```html\n<a href=\"#popupBasic\" data-rel=\"popup\">Open Popup</a>\n\
    <div data-role=\"popup\" id=\"popupBasic\">\n    <p>This is a completely basic\
    \ popup, no options set.</p>\n</div>\n```\n\n这一组件的功能强大，可以各种形式弹出提示(tooltip)和图片等。见例5-2-6.html。\n"
  mdcn: "\n\n## 5.2.2 文档结构\n\n### 3、页面(page)\n\n页面是jQuery Mobile的主要单位。一个典型的页面包括页头、内容和页脚三个部分。通常只有内容部分是必不可少的。各个部分使用data-role属性指定。\n\
