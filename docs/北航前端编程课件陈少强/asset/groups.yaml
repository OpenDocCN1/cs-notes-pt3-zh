    \ `data-position=\"fixed\"` 属性。缺省属性是 `data-position=\"inline\"`。\n\n当用户点击页面上某个非交互的内容区域时，固定模式和内联模式将相互切换，以便在需要时有更多的空间来显示内容。\n\
    \n③ 全屏下的固定模式：在全屏模式下（页面具有 `data-fullscreen=\"true\"` 属性），固定工具栏只在用户点击屏幕时才出现，再次点击则消失。例如：\n\
    \n```\n<div data-role=\"page\" data-fullscreen=\"true\">\n  <div data-role=\"\
    header\" data-position=\"fixed\">\n  </div>\n  <div data-role=\"content\">\n \
    \ </div>\n  <div data-role=\"footer\" data-position=\"fixed\">\n  </div>\n</div>\n\
    ```\n\n固定工具栏可见时，内容会被遮挡。在大多数浏览器中，页头会使用半透明，可以透过页头看到后面的内容。\n\n④ 真正的固定模式：框架将创建一个较小的滚动区域来代替全屏，这样工具栏就可以总是位于一个位置。\n\
    \n使用该模式，首先需要在页头或页脚中使用 `data-position=\"fixed\"` 属性，然后使用后面介绍的 JavaScript API 开启\
    \ touchOverflow 特性，通常这个特性是关闭的：\n\n```\n$.mobile.touchOverflowEnabled = true;\n\
    ```\n\n开启该特性后，不支持它的浏览器将降级为固定工具栏。\n\n### 2、在页头中添加内容\n\n标准的jQuery Mobile页头包含一个hx标题，以及一到两个可选的位于页头两侧的按钮。也可以按需要定制页头的外观和内容。\n\
    \n- ① 添加按钮：通常在右侧使用肯定动作按钮，在左侧使用否定动作按钮。\n- 页头的按钮就是一个超链接。如果只提供了一个a元素，则它将位于左侧，如果添加了两个按钮，则第一个位于左侧，第二个位于右侧。\n\
    - 如果想强制指定按钮的位置，可以使用CSS类：`class=\"ui-btn-right\"` 或 `class=\"ui-btn-left\"`。\n\n\
    例如：\n\n```\n<div data-role=\"header\">\n<a href=\"logout\">Log out</a>\n<h1>Title</h1>\n\
    <a href=\"settings\" data-icon=\"gear\">Settings</a>\n</div>\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_261_0.png)\n\
    \n默认情况下，工具栏的每个按钮都继承工具栏的主题。如果想让一个按钮与众不同，可以使用 `data-theme` 来改变它的色样。\n\n例如：\n\n```html\n\
    <div data-role=\"header\">\n<a href=\"cancel\" data-icon=\"delete\">Cancel</a>\n\
    <h1>New record</h1>\n<a href=\"save\" data-icon=\"check\" data-theme=\"b\">Save</a>\n\
    </div>\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_262_0.png)\n\n如果想自定义一个后退按钮，一定要在对应的a元素上使用\
    \ `data-rel=\"back\"` 属性；如果已经在页面中使用 `data-add-back-btn=\"true\"` 属性添加了后退按钮，则不应该再在左侧添加其它按钮。\n\
    \n### 添加logo\n\n使用图片或logo代替文本是很常见的。在带有标准左右按钮的页头中显示图片，最好的方式是在对应的h1中使用img标记，例如：\n\
    \n```\n<div data-role=\"header\">\n<a href=\"cancel\" data-icon=\"delete\">Cancel</a>\n\
    <h1><img src=\"images/logo.png\"></h1>\n<a href=\"save\" data-icon=\"check\" data-theme=\"\
    b\">Save</a>\n</div>\n```\n\n页头会自动适应图片的高度，但不要使用高度超过125像素的图片。\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_263_0.png)\n\
    \n"
