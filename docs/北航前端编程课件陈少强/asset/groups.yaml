    # 3.2 JavaScript语言的基本内容


    # 3.2.1 语法结构


    +   1、对大小写敏感

    +   程序中标识符（包括：关键字、变量、函数名等）的大小写是有区别的。例如： while不能写为While。


    +   2、语句末尾的分号

    +   JavaScript语句以分号结束。尽管行末语句的分号可以省略（系统会自动补上），但这不是个好习惯，有时会引起误解，例如：

    +   return

    +   true

    +   会被解释为：

    +   return;

    +   true;'
  - '[PAGE 69]


    # 3.2.1 语法结构


    3、注释

    JavaScript使用c语言的注释方法，包括：

    区间注释： 可跨行，即： /*...*/

    行末注释： 以//开始至行末，即： //...


    4、常量

    即在程序中直接写出的数据。例如：


    +   - 1.2 //数字1.2

    +   - "Hello world" //字符串

    +   - true //布尔值

    +   - null //空值，是对象类型的一个特殊值

    +   - undefined //未定义值

    +   - {x:1,y:2} //用于初始化对象

    +   - [1,2,3,4,5] //用于初始化数组'
  - '[PAGE 70]


    # 3.2.1 语法结构


    # 3、标识符


    标识符就是名字。在JavaScript中，标识符用来命名变量和函数。还可用标签，来作标识语句位置。


    标识符的第一个字符必须是字母、下划线或美元符号。其它字符可以是字母、数字、下划线或美元符号。下面列出的都是合法标识符：


    ```

    i,x1,y_1,_1,$m

    ```


    注意：标识符不能与JavaScript保留字（保留字：在JavaScript中有特殊意义，而被保留的名字）、JavaScript全局变量或全局函数同名。'
  - '[PAGE 71]


    # 3.2.2 数据类型和值


    JavaScript的变量不分类型，并不意味着JavaScript的数据不分类型，而是指JavaScript的变量可以存储各种数据类型。


    JavaScript数据分为两大类：基本数据类型和复合数据类型。


    基本数据类型分为三种：数字、字符串和布尔值。（此外还支持两个小的数据类型：null(空)和undefined(未定义)，他们各自只定义了一个值）。


    复合数据类型则包括：对象、数组和函数。


    JavaScript已经预先定义了一些类，例如：表示日期的Date类可以创建不同的日期对象。


    JavaScript也提供了创建自定义类的方法，但由于时间所限，本课程不予介绍，只使用JavaScript的预定义类。'
  md: "\n## 2.10 CSS3的新样式\n\n### 2.10.2 圆角和阴影样式\n\n- 1、圆角\n过去，border属性可以指定边框的宽度、颜色、线型。现在，使用border-radius属性可以使边框具有圆角。见例2-15：\n\
    \n```\ndiv\n{\n  border:2px solid;\n  border-radius:25px;\n}\n```\n\n- 2、阴影\n\
    box-shadow属性向框添加一个或多个阴影。见例2-16：\n\n```\ndiv\n{\n  box-shadow: 10px 10px 5px #888888;\n\
    }\n```\n\n其参数的具体意义请查手册。\n\n这些功能在CSS3之前都需要使用图片技巧来实现。\n\n### 2.10.3 变换\n\n- 1、2D变换\n\
    \n使用变换translate()、rotate()、scale()、skew()、matrix()，可以对元素进行平移，旋转、比例、倾斜和指定矩阵的二维变换。\n\
    \n见例2-17：\n\n```\ndiv {\n  transform: rotate(30deg);\n  -ms-transform: rotate(30deg);\
    \ /* IE 9 */\n  -webkit-transform: rotate(30deg); /* Safari and Chrome */\n  -o-transform:\
    \ rotate(30deg); /* Opera */\n  -moz-transform: rotate(30deg); /* Firefox */\n\
    }\n```\n\n其中的matrix()变换需要六个参数：\n\n```\ntransform: matrix(a,b,c,d,e,f);\n```\n\n\
    其实是给出了二维齐次变换矩阵：\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_61_0.png)\n\n它把各种二维变换组合在一起。例如：\n\
    \n- `transform:translate(dx+\"px\", dy+\"px\");`\n  等价于`transform:matrix(1, 0,\
    \ 0, 1, dx, dy);`\n- `transform:rotate(θ+\"deg\");`\n  等价于`transform:matrix(cosθ,\
    \ sinθ, -sinθ, cosθ, 0, 0);`\n- `transform:scale(sx, sy);`\n  等价于`transform:matrix(sx,\
    \ 0, 0, sy, 0, 0);`\n- `transform:skew(θx+\"deg\", θy+\"deg\");`\n  等价于`transform:matrix(1,tan(θy),tan(θx),1,0,0);`\n\
    \n- 2、3D变换\n\n三维变换的种类有很多，但最常用的是旋转。二维旋转是绕Z轴的旋转，三维旋转可以绕X、Y或任意指定轴进行。见例2-18：\n\n```\n\
    div {\n  transform: rotateY(130deg);\n  -webkit-transform: rotateY(130deg); /*\
    \ Safari 和 Chrome */\n  -moz-transform: rotateY(130deg); /* Firefox */\n}\n```\n\
    \n目前，三维变换并未被浏览器广泛支持。例如rotateX就没有多少浏览器支持。\n\n### 2.10.4 过渡\n\n在不使用flash和Javascript的情况下，过渡可以实现在两种样式之间的渐变。见例2-19:\n\
    \n```\ndiv {\n  transition: width 2s; /* 宽度方向上的渐变为两秒 */\n  -moz-transition: width\
    \ 2s; /* Firefox 4 */\n  -webkit-transition: width 2s; /* Safari 和 Chrome */\n\
    \  -o-transition: width 2s; /* Opera */\n}\ndiv:hover { width:300px; }\n```\n\n\
    过渡有不少参数可以设置，请参阅CSS3手册。如果忽略时长，默认值是0。\n\n### 2.10.5 动画\n\n动画是在关键帧之间的过渡。动画开始的关键帧表示为0%或\
    \ from，动画结束的关键帧表示为100%或to，其它关键帧位置只能用百分比表示。@keyframes规则用于定义动画的各个关键帧，animation属性用于定义动画的用时和方式等。见例2-20：\n\
    \n```\n@keyframes myfirst\n{\n  from {background: red;}\n  to {background: yellow;}\n\
    }\n@-moz-keyframes myfirst /* Firefox */\n{\n  0% {background: red;}\n  100% {background:\
    \ yellow;}\n}\n```\n\n...\n这里的from、to和百分比也属于选择器。\n\n```\ndiv\n{\n  animation:\
    \ myfirst 5s;\n  -moz-animation: myfirst 5s;\n  ...\n}\n```\n\n定义animation属性时至少需要指定动画名称和时长。如果忽略时长，默认值是0。\n\
    \n### 2.10.6 媒体类型和媒体查询\n\n@media规则可以使样式应用于特定的设备或媒介。\n\n- 1、在CSS2中，@media可用于指定不同的媒体类型。例如：\n\
    \  ➢ `<link href=\"css/reset.css\" rel=\"stylesheet\" media=\"screen\">`\n  ➢\
    \ `@media print { p.test {font-family:times,serif; font-size:10px }`\n  其它的媒体类型还包括：all、handheld、tv等。\n\
    \n- 2、CSS3引入了媒体查询功能，它扩展了媒体类型功能。例如：\n\n```\n<link href=\"css/reset.css\" rel=\"\
    stylesheet\"\n      media=\"screen and (max-width: 600px)\" >\n@media screen and\
    \ (min-width: 900px) {\n    .class { background: #666; }\n}\n```\n\n其它的媒体查询还包括：\n\
    (min-width:900px)\n(orientation:portrait)等\n\n## 3.2 JavaScript语言的基本内容\n\n###\
    \ 3.2.1 语法结构\n\n- 1、对大小写敏感\n程序中标识符（包括：关键字、变量、函数名等）的大小写是有区别的。例如： while不能写为While。\n\
    \n- 2、语句末尾的分号\nJavaScript语句以分号结束。尽管行末语句的分号可以省略（系统会自动补上），但这不是个好习惯，有时会引起误解，例如：\n\
    return\ntrue\n会被解释为：\nreturn;\ntrue;\n\n3、注释\nJavaScript使用c语言的注释方法，包括：\n区间注释：\
    \ 可跨行，即： /*...*/\n行末注释： 以//开始至行末，即： //...\n\n4、常量\n即在程序中直接写出的数据。例如：\n\n- 1.2 //数字1.2\n\
    - \"Hello world\" //字符串\n- true //布尔值\n- null //空值，是对象类型的一个特殊值\n- undefined //未定义值\n\
    - {x:1,y:2} //用于初始化对象\n- [1,2,3,4,5] //用于初始化数组\n\n- 3、标识符\n\n标识符就是名字。在JavaScript中，标识符用来命名变量和函数。还可用标签，来作标识语句位置。\n\
    \n标识符的第一个字符必须是字母、下划线或美元符号。其它字符可以是字母、数字、下划线或美元符号。下面列出的都是合法标识符：\n\n```\ni,x1,y_1,_1,$m\n\
    ```\n\n注意：标识符不能与JavaScript保留字（保留字：在JavaScript中有特殊意义，而被保留的名字）、JavaScript全局变量或全局函数同名。\n\
    \n### 3.2.2 数据类型和值\n\nJavaScript的变量不分类型，并不意味着JavaScript的数据不分类型，而是指JavaScript的变量可以存储各种数据类型。\n\
    \nJavaScript数据分为两大类：基本数据类型和复合数据类型。\n\n基本数据类型分为三种：数字、字符串和布尔值。（此外还支持两个小的数据类型：null(空)和undefined(未定义)，他们各自只定义了一个值）。\n\
    \n复合数据类型则包括：对象、数组和函数。\n\nJavaScript已经预先定义了一些类，例如：表示日期的Date类可以创建不同的日期对象。\n\nJavaScript也提供了创建自定义类的方法，但由于时间所限，本课程不予介绍，只使用JavaScript的预定义类。\n"
