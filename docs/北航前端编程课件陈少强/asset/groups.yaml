  - "[PAGE 306]\n\n# 5.5.2 表单元素\n\n## 7、滑块\n滑块用于输入处于某个范围的数字的值。它会提供一个接受数字的文本输入框，右侧会有一个水平滑块。滑块是一个\
    \ `<input type=\"range\">` 的 HTML5 控件，它接受 min、max 以及 step 属性值。\n\n可以使用 data-theme\
    \ 和 data-track-theme 属性来分别控制滑块左右两个部分的色样。例如：\n\n```\n```html\n<div data-role=\"\
    fieldcontainter\">\n    <label for=\"qty\">Quantity:</label>\n    <input type=\"\
    range\" id=\"qty\" name=\"qty\" min=\"1\" max=\"100\"\n           value=\"5\"\
    \ data-theme=\"e\" data-track-theme=\"b\">\n</div>\n```\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_306_0.png)"
  - '[PAGE 307]


    # 5.5.2 表单元素


    8、轻弹切换开关


    这种开关是一个布尔值（true或false）选择器。功能上与复选框类似，但用户界面完全不同。


    它是第一个需要制定角色的表单控件： data-role="slider"。它是一个 select元素，其中只包含两个option子元素，第一个值为false，第二个值为true。


    不指定域容器的话，开关将占满整个页面宽度。更常见的情况是将其放入一个域容器中。例如：


    ```

    <label for="updated">Receive updates</label>

    <select id="updated" name="updated" data-role="slider">

    <option value="no">No</option>

    <option value="yes">Yes</option>

    </select>

    ```


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_307_0.png)'
  - '[PAGE 308]


    # 5.5.2 表单元素


    # 9、选择菜单


    选择菜单由select元素创建，用于从一个弹出列表中选择一个或多个选项。jQuery Mobile将选择菜单的外观改变为按钮样式，右边带有一个提示用户可以打开选项菜单的图标。点击时，将激活一个本地菜单供选择。


    默认情况下，选择菜单会占用整个宽度，除非将它包含在一个容器中。


    ```

    例列：5-5-1.html

    <label for="training">Training</label>

    <select id="training" name="training">

    <option value="1">HTML5</option>

    <option value="2">jQuery Mobile</option>

    <option value="3">iOS</option>

    <option value="4">Android</option>

    <option value="5">BlackBerry</option>

    <option value="6">Qt for Meego</option>

    </select>

    ```


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_308_0.png)'
  - '[PAGE 309]


    # 5.5.2 表单元素


    当使用multiple布尔值属性后，界面会显示使用逗号分隔的已选中元素（初始空白）以及一个显示已选中多少元素的计数气泡。


    见例：5-5-2.html


    ```

    <label for="lang">Languages you like</label>

    <select id="lang" name="lang" multiple>

    <option value="1">C/C++</option>

    <option value="2">Objective-C</option>

    <option value="3">Java</option>

    <option value="4">C#</option>

    <option value="5">Visual Basic</option>

    <option value="6">ActionScript</option>

    <option value="7">Delphi</option>

    <option value="8">Phyton</option>

    <option value="9">JavaScript</option>

    <option value="10">Ruby</option>

    <option value="11">PHP</option>

    </select>

    ```


    ![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_309_0.png)'
