    # 4.1.2 jQuery的优点


    +   1. 功能强大，易扩展，代码量小，免费使用

    +   2. 充分利用CSS的概念和语法

    +      使得熟悉CSS的设计人员有顺畅的切入点。

    +   3. 屏蔽浏览器的不一致性

    +   4. 总是面向集合

    +      查询结果和操作对象都是集合。这样就可以通过所谓的隐式迭代避免臃肿的循环结构，大幅减少代码。

    +   5. 将多重操作集于一行

    +      这被称为连缀（chaining）：对一个jQuery对象的操作结果还是一个jQuery对象。这样可以避免使用临时变量和重复代码。

    +      所有这些得益于jQuery优秀的设计理念。'
