  md: "\n## 5.4.6 标题与描述\n\n如果想在一行上同时显示标题与描述，可以将标题放在 hx 标签里，将描述文本放在 p 元素里。它们不会被显示为两列。如下图：\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_294_0.png)\n\n不会这样！\n\n## 5.4.7 使用计数气泡\n\
    \n计数气泡是一个在行的右侧显示的包含数字的圆圈，通常用于显示该交互行包含多少项。\n\n要使用计数气泡，只需在列表项（li）中包含任意带ui-li-count类的html元素，例如span元素。例如：\n\
    \n```\n```html\n<li><a href=\"inbox.html\">Inbox</a>\n    <span class=\"ui-li-count\"\
    >86</span>\n```\n```\n\n下图显示了计数气泡在一个交互列表中的显示效果。如果想改变默认的白色背景，可以在对应的ul元素中指定data-count-theme属性。\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_295_0.png)\n\n## 5.4.8 使用搜索过滤数据\n\n\
    在ul或ol标记内添加data-filter=\"true\"属性，不用任何编码就可以在列表的顶部添加一个搜索框。它会根据用户的输入过滤列表元素。可以在ul中使用data-filter-placeholder属性来自定义占位字符，或使用data-filter-theme属性来改变搜索栏的色样。\n\
    \n例见：5-4-9.html\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_296_0.png)\n\n## 5.5\
    \ 表单组件\n\njQuery Mobile框架支持标准的HTML表单，在支持的设备上会自动使用AJAX处理，同时标准表单控件的外观也为触摸操作进行了优化。\n\
    \n所谓标准表单指的是位于form元素内的一组表单控件，如input、textarea以及select元素等。表单的数据将被发送到该form元素的action属性所指向的URL。\n\
    \n## 5.5.1 表单动作\n\njQuery Mobile表单的动作处理方式与原来一样：当用户按下提交按钮时，表单会被提交。\n\n表单提交时，除非是提交到不同的域名，否则jQuery\
    \ Mobile会使用AJAX方式过渡到目标页面，就像链接到一个外部页面一样。\n\n表单的提交方式有post和get，由form元素的method属性指定。\
    \  \n**get:** 以URL的形式发送数据；**post:** 浏览器与服务器建立联系后，再将表单数据发往服务器。\n\n典型的jQuery Mobile表单与标准的HTML表单很像：\n\
    \n```\n```html\n<form action=\"send.php\" action=\"get\">\n<!--表单控件-->\n</form>\n\
    ```\n```\n\n提交后的结果页面也要求是一个jQuery Mobile文档，以便通过AJAX方式过渡。\n\n也可以使用data-transition和data-direction改变表单的过渡方式：\n\
    \n```\n```html\n<form action=\"send.php\" action=\"get\" data-transition=\"pop\"\
    >\n<!--表单控件-->\n</form>\n```\n```\n\n## 5.5.2 表单元素\n\njQuery Mobile允许使用HTML5中的新表单控件，例如滑块（input\
    \ type=\"range\"），并且自动将表单控件替换为对触摸更为友好的富控件（rich control）。默认情况下，每个表单控件独占一行。\n\n\
    ### 1、文本标签\n\n文本标签（label）附着在表单控件上。它不仅作为提示，也扩大了所附着控件的焦点的选择范围。就是说，表单元素的可点击范围为控件自身加上label标签。所以，应当尽量为所有控件加上文本标签。\n\
    \n例如：\n\n```\n<label for=\"company\">Company Name:</label>\n<input type=\"text\"\
    \ id=\"company\">\n```\n\n### 2、域容器\n\n域容器可以是任意带data-role=\"fieldcontainer\"的块级元素。它会将其内部的的文本标签和表单控件自动对齐，并且会自动添加一个细边框作为字段分隔符。\n\
    \n如果设备宽度比较窄，文本标签就会放置在表单控件的顶部，否则就使用两列布局。例如：\n\n```\n<div data-role=\"fieldcontainer\"\
    >\n<label for=\"company\">Company Name:</label>\n<input type=\"text\" id=\"company\"\
    \ name=\"company\">\n</div>\n<div data-role=\"fieldcontainer\">\n<label for=\"\
    email\">Email:</label>\n<input type=\"email\" id=\"email\" name=\"email\">\n</div>\n\
    ```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_300_0.png)\n\n### 3、文本输入框\n\n\
    jQuery Mobile支持基本的HTML5文本输入控件，并根据当前的主\n题和色样进行渲染。下面是可用的文本输入框：\n\n- <input type=\"\
    text\">\n- <input type=\"password\">\n- <input type=\"email\">\n- <input type=\"\
    tel\">\n- <input type=\"url\">\n- <input type=\"search\">\n- <input type=\"number\"\
    >\n- <textarea>\n\n使用上面的元素时会自动得到jQuery Mobile控件，不用显式指定 data-role属性。\n\ntype为button、submit、reset和image的input元素，会被自动渲染为jQuery\
    \ Mobile按钮。\n\nemail、tel、url、search以及number是HTML5的新输入类型。在移动设备上，指定这些新输入类型时，将得到不同的经过优化的虚拟键盘。例如：\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_302_0.png)\n\n在jQuery Mobile中，search类型输入域的用户界面与其它类型也不相同：\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_302_1.png)\n\n### 4、自增长文本区\n\ntextarea多行文本输入域有个额外的特性：自动增长。jQuery\
    \ Mobile会以一个两行高的区域开始，随着输入文本的增加而变高。例如：\n\n```\n```html\n<div data-role=\"fieldcontainer\"\
    >\n<label for=\"comments\">Your comments:</label>\n<textarea id=\"comments\" name=\"\
    comments\"></textarea>\n</div>\n```\n```\n\n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_303_0.png)\n\
    \n### 5、HTML5新属性\n\n可以在文本输入框中使用HTML5的新属性。例如：\n\n- **required**：布尔值，该输入域是必须的。\n\
    - **placeholder**：当输入框中无值时，它将显示为灰色的提示。\n- **min和max**：仅用于 `<input type=\"number\"\
    >`，指定数值范围。\n\n```\n```html\n<div data-role=\"fieldcontainer\">\n<label for=\"\
    name\">Your Name:</label>\n<input type=\"text\" id=\"name\" required placeholder=\"\
    Enter your\nname\">\n</div>\n<div data-role=\"fieldcontainer\">\n<label for=\"\
    age\">Your Age:</label>\n<input type=\"number\" id=\"age\" required placeholder=\"\
    Enter\nyour age\" min=\"10\" max=\"110\">\n</div>\n```\n```\n\n使用CSS3的伪类，不用编写JavaScript校验代码，就可为有效、无效、必填以及选填的文本输入框创建不同的样式。\n\
    \n### 6、日期输入框\n\n在HTML中输入日期一直是个问题。HTML5加入了对日期输入的支持，只需要使用下列类型的input元素：\n\n- **date**：日期选择（年/月/日）。\n\
    - **datetime**：日期和时间选择（年/月/日/时/分），包含GMT时区。\n- **time**：时间选择（时/分）。\n- **datetime-local**：日期和时间选择，但不包括时区信息。\n\
    - **month**：月份选择，通常是个下拉列表。\n- **week**：星期选择，通常为下拉列表。\n\n这些日期输入框支持min和max属性。例如：\n\
    \n![](img/e6e6db66e3939a2cb9a18b01dd5c3fae_305_0.png)\n"
