    在客户端程序设计中，JavaScript代码中常包含HTML代码，HTML代码中也常常包含JavaScript代码。和JavaScript一样，HTML也使用单引号或双引号来定界字符串。因此在同时使用JavaScript和HTML时，最好对JavaScript采用一种引用方式，对HTML采用另一种引用方式，例如：


    ```

