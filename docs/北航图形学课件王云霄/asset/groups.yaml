    \n对非极值的简便处理\n\n### step1．如何计算扫描线与多边形边界线的所有交点？\n\n若扫描线 $y_i$ 与多边形边界线交点 $x$ 的坐标是\
    \ $x_i$，则对下一条扫描线 $y_{i+1}$，它与那条边界线的交点的 $x$ 坐标 $x_{i+1}$，可如下求出：\n\n$$m=\\frac{y_{i+1}-y_i}{x_{i+1}-x_i},\\\
    quad y_{i+1}=y_i+1\\Rightarrow x_{i+1}=x_i+\\frac{1}{m}$$\n\n活跃边：与当前扫描线相交的边。\n\
    \n活跃边表 AET：存储当前扫描线相交的各边的表。\n\n| y_max | x | 1/m | next |\n|---|---|---|---|\n\
    - y_max：当前这条边的上端点的 y 坐标\n- x：当前边与扫描线交点的 x 坐标\n- 1/m：当前边的斜率的倒数\n- next：指向下一条边的指针\n\
    \n### 边表 ET：记录多边形的所有边\n\n“吊桶”：记录一条边的信息。\n\n| Ymax | Xmin | 1/m | next |\n|---|---|---|---|\n\
    - Ymax：边的另一端点的较大的 y 坐标\n- Xmin：与较小的 y 坐标对应的边的端点的 x 坐标\n- 1/m：斜率的倒数\n- next：指向下一条边的指针\n\
