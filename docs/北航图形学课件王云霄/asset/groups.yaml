    \ $f_1(t)=-2t^3+3t^2$\n$f_0(t)=1-t$, $f_1(t)=t$\n\n## Problem 1: Find the surface\
    \ through four boundary curves\n\nGiven four boundary curves u0, u1, 0w, 1w, with\
    \ 0≤u≤1, 0≤w≤1\n\n① Performing linear interpolation in the u direction gives the\
