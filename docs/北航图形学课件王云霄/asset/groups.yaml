    ## 4. 曲线段间 $C^1$、$C^2$ 和 $G^1$、$G^2$ 连续性定义


    -   (1) 若 $Q_1(1)=Q_2(0)$，则 $Q_1(t)$ 和 $Q_2(t)$ 在 $P$ 处具有 $C^0$ 和 $G^0$ 连续性。

    -   (2) 若 $Q_1(1)$ 与 $Q_2(0)$ 在 $P$ 处重合，且二者在 $P$ 点处的切矢量方向相同、大小不等，则 $Q_1(t)$ 和
    $Q_2(t)$ 在 $P$ 处具有 $G^1$ 连续性。

    -   (3) 若 $Q_1(1)$ 与 $Q_2(0)$ 在 $P$ 处重合，且二者在 $P$ 点处的切矢量方向相同、大小相等，则 $Q_1(t)$ 和
    $Q_2(t)$ 在 $P$ 处具有 $C^1$ 连续性。

    -   (4) 若 $Q_1(1)$ 与 $Q_2(0)$ 在 $P$ 处已有 $C^0$、$C^1$ 连续性，且 $Q_1''''(1)$ 和 $Q_2''''(0)$
    的大小和方向均相同，则 $Q_1(t)$ 和 $Q_2(t)$ 在 $P$ 处具有 $C^2$ 连续性。


    推广之，若 $Q_1(1)$ 与 $Q_2(0)$ 在 $P$ 处具有 $C^0, C^1, \ldots, C^n$ 连续性，且 $Q_1''''$ 和
    $Q_2''''$ 在 $P$ 处的大小和方向均相同，则称 $Q_1(t)$ 和 $Q_2(t)$ 在 $P$ 处具有 $C^n$ 连续性。


    (5) 若 $Q_1(1)$ 与 $Q_2(0)$ 在 $P$ 处已有 $G^0$、$G^1$ 连续性，且 $Q_1''''(1)$ 和 $Q_2''''(0)$
    方向相同但大小不等，则 $Q_1(t)$ 和 $Q_2(t)$ 在 $P$ 处具有 $G^2$ 连续性。


    ## 5. 光顺


    光顺（smoothness）是指曲线的拐点不能太多，要光滑顺畅。对于平面曲线相对光顺的条件应该是：（1）具有二阶几何连续（$G^2$）；（2）不存在多余拐点和奇异点；（3）曲率变化较小。


    ## 第二节 埃尔米特（Hermite）多项式


    已知函数 $f(t)$ 在 $k+1$ 个点 $\{t_i\}$ 处的函数值和导数值 $\{f^{(j)}(t_i)\}$，$j=0,1,\ldots,k$，$i=0,1,\ldots,m_i-1$，要求确定一个
    $N=m_0+m_1+\cdots+m_k-1$ 次的多项式 $P(t)$，满足下面的插值条件：


    $$P^{(j)}(t_i)=f^{(j)}(t_i)$$


    ## 1. 拉格朗日（Lagrange）插值法（$m_0 = m_1 = \cdots = m_k = 1$）


    已知 $f(t)$ 在 $k+1$ 个点的函数值 $f(t_i)$，求一个 $k$ 次多项式 $p(t)$，使 $p(t_i)=f(t_i)$。


    $$p(t) = \sum_{i=0}^{k} f(t_i) \cdot l_i(t)$$


    $$l_i(t) = \frac{(t - t_0)\cdots(t - t_{i-1})\cdot(t - t_{i+1})\cdots(t - t_k)}{(t_i
    - t_0)\cdots(t_i - t_{i-1})\cdot(t_i - t_{i+1})\cdots(t_i - t_k)}$$


    $$\begin{cases} 1 & t = t_i \\ 0 & t = t_j,\ j \neq i \end{cases} \quad \text{调和函数}$$


    ## 混合函数如下：


    $$ \begin{cases} l_0(t)=\dfrac{(t-t_1)(t-t_2)}{(t_0-t_1)(t_0-t_2)} \\ l_1(t)=\dfrac{(t-t_0)(t-t_2)}{(t_1-t_0)(t_1-t_2)}
    \\ l_2(t)=\dfrac{(t-t_0)(t-t_1)}{(t_2-t_0)(t_2-t_1)} \end{cases}$$


    ## 2.


    当 $k=1$，$m_0=m_1=2$，$t \in [t_0, t_1]$ 时：


    已知表示一条曲线的某个函数 $f(t)$ 在两点 $t_0$、$t_1$ 处的函数值 $f(t_0)$、$f(t_1)$ 和一阶导数值 $f''(t_0)$、$f''(t_1)$，求三次多项式
    $P(t)$：


    $$P(t)=a_3 t^3 + a_2 t^2 + a_1 t + a_0 \quad t \in [t_0, t_1]$$


    $$P(t_0) = f(t_0),\quad P(t_1) = f(t_1),\quad P''(t_0) = f''(t_0),\quad P''(t_1)
    = f''(t_1)$$


    ## 把 $a_0$、$a_1$、$a_2$ 和 $a_3$ 代入则有：


    $$P(t) = f(t_0)\cdot\frac{(t-t_1)^2(-2t+3t_0-t_1)}{(t_0-t_1)^3} + f(t_1)\cdot\frac{(t-t_0)^2(-2t+3t_1-t_0)}{(t_1-t_0)^3}
    + f''(t_0)\cdot\frac{(t-t_1)^2(t-t_0)}{(t_1-t_0)^2} + f''(t_1)\cdot\frac{(t-t_0)^2(t-t_1)}{(t_1-t_0)^2},\quad
    t \in [t_0, t_1]$$


    ## 经整理，所求多项式 $P_0(t)$ 可以写出如下：


    $$P_0(t) = f(t_0)\cdot g_{00}(t) + f(t_1)\cdot g_{01}(t) + f''(t_0)\cdot h_{00}(t)\cdot(t_1
    - t_0) + f''(t_1)\cdot h_{01}(t)\cdot(t_1 - t_0)$$


    式中选取两个端点及其切向量作为曲线构造条件。


    混合函数如下：


    $$ \begin{cases} g_{00}(t)=\left(1-2\cdot\frac{t-t_0}{t_0-t_1}\right)\cdot\left(\frac{t-t_1}{t_0-t_1}\right)^2
    \\ g_{01}(t)=\left(1-2\cdot\frac{t-t_1}{t_1-t_0}\right)\cdot\left(\frac{t-t_0}{t_1-t_0}\right)^2
    \\ h_{00}(t)=\left(\frac{t-t_0}{t_1-t_0}\right)\cdot\left(\frac{t-t_1}{t_0-t_1}\right)^2
    \\ h_{01}(t)=\left(\frac{t-t_1}{t_1-t_0}\right)\cdot\left(\frac{t-t_0}{t_1-t_0}\right)^2
    \end{cases}$$


    经验可知：


    $$\begin{cases} g_{00}(t_0)=1 \\ g_{01}(t_0)=0 \\ h_{00}(t_0)=0 \\ h_{01}(t_0)=0
    \end{cases}$$


    $$\begin{cases} g_{00}(t_1)=0 \\ g_{01}(t_1)=1 \\ h_{00}(t_1)=0 \\ h_{01}(t_1)=0
    \end{cases}$$


    $$\begin{cases} g''_{00}(t_0)=0 \\ g''_{01}(t_0)=0 \\ h''_{00}(t_0)=\frac{1}{t_1-t_0}
    \\ h''_{01}(t_0)=0 \end{cases}$$


    $$\begin{cases} g''_{00}(t_1)=0 \\ g''_{01}(t_1)=0 \\ h''_{00}(t_1)=0 \\ h''_{01}(t_1)=\frac{1}{t_1-t_0}
    \end{cases}$$


    ## 3.


    $t \in [t_0, t_1] \rightarrow u \in [0,1]$


    为了使 $P_0(t)$ 的定义区间 $t_0 \le t \le t_1$ 变为区间 $0 \le u \le 1$，可以做如下变换


    ```

    u = (t - t₀) / (t₁ - t₀)

    ```


    解出 $t = t_0 + (t_1 - t_0)u$，代入混合函数式中，得：


    $$g_{00}(t) = g_{00}(t_0+(t_1-t_0)u) = (1+2u)(u-1)^2 = 2u^3 - 3u^2 + 1 = q_{00}(u)$$


    $$g_{01}(t) = g_{01}(t_0+(t_1-t_0)u) = (3-2u)u^2 = -2u^3 + 3u^2 = q_{01}(u)$$


    $$h_{00}(t) = h_{00}(t_0+(t_1-t_0)u) = u(1-u)^2 = u^3-2u^2+u = q_{10}(u)$$


    $$h_{01}(t) = h_{01}(t_0+(t_1-t_0)u) = (-1+u)u^2 = u^3-u^2 = q_{11}(u)$$


    ## 将关于 $u$ 的混合函数代入，所求的三次多项式成为：


    $$\tilde{f}(u)=\tilde{P}_0(u)=P_0\bigl(t_0+(t_1-t_0)u\bigr)$$


    $$=f(t_0)\cdot q_{00}(u)+f(t_1)\cdot q_{01}(u)$$


    $$+f''(t_0)\cdot(t_1-t_0)\cdot q_{10}(u)$$


    $$+f''(t_1)\cdot(t_1-t_0)\cdot q_{11}(u)$$


    令


    $$\tilde{f}(0)=f(t_0)$$


    $$\tilde{f}(1)=f(t_1)$$


    $$\tilde{f}''(0)=f''(t_0)(t_1-t_0)$$


    $$\tilde{f}''(1)=f''(t_1)(t_1-t_0)$$


    得


    $$\widetilde{P}_0(u)=\widetilde{f}(0)\cdot q_{00}(u)+\widetilde{f}(1)\cdot q_{01}(u)$$

    $$\qquad\quad+\widetilde{f}''(0)\cdot q_{10}(u)+\widetilde{f}''(1)\cdot q_{11}(u)$$


    $$=(q_{00}(u)\quad q_{01}(u)\quad q_{10}(u)\quad q_{11}(u))\begin{bmatrix}\widetilde{f}(0)\\\widetilde{f}(1)\\\widetilde{f}''(0)\\\widetilde{f}''(1)\end{bmatrix}$$


    '
