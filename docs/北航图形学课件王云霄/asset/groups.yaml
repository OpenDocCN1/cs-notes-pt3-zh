    \n将前面 $t_0$ 和 $t_1$ 视为 $t_i$ 和 $t_{i+1}$，设给定 $f(t_i)$，$f(t_{i+1})$，$f'(t_i)$，$f'(t_{i+1})$，则在区间\
    \ $[t_i,t_{i+1}]$ 的Hermite三次插值多项式 $P_i(t)$ 是：\n\nP_i(t) = f(t_i)·g_{i0}(t) + f(t_{i+1})·g_{i1}(t)\n\
    + f'(t_i)·h_{i0}(t)·(t_{i+1} - t_i)\n+ f'(t_{i+1})·h_{i1}(t)·(t_{i+1} - t_i)\n\
    \nt_0, t_1, t_2, …, t_{n-1}, t_n\nn段曲线拼接\n\n\\begin{cases}\n g_{i,0}(t)=\\left(1-2\\\
    cdot\\dfrac{t-t_i}{t_i-t_{i+1}}\\right)\\left(\\dfrac{t-t_{i+1}}{t_i-t_{i+1}}\\\
    right)^2 \\\\\n g_{i,1}(t)=\\left(1-2\\cdot\\dfrac{t-t_{i+1}}{t_{i+1}-t_i}\\right)\\\
    left(\\dfrac{t-t_i}{t_{i+1}-t_i}\\right)^2 \\\\\n h_{i,0}(t)=\\left(\\dfrac{t-t_i}{t_{i+1}-t_i}\\\
    right)\\left(\\dfrac{t-t_{i+1}}{t_i-t_{i+1}}\\right)^2 \\\\\n h_{i,1}(t)=\\left(\\\
    dfrac{t-t_{i+1}}{t_{i+1}-t_i}\\right)\\left(\\dfrac{t-t_i}{t_{i+1}-t_i}\\right)^2\n\
    \\end{cases}\\qquad i=0,1,\\cdots,n-1\n\n为了完整地写出这个插值多项式，可以在区间[$t_i$, $t_{i+1}$]中引入如下一些基本函数：\n\
    \n$a_{0,0}(t)=\\begin{cases} g_{0,0}(t), & t_0\\le t\\le t_1 \\\\ 0, & t_1\\le\
    \ t\\le t_n \\end{cases}$\n\n$a_{i,0}(t)=\\begin{cases} g_{i-1,1}(t), & t_{i-1}\\\
    le t\\le t_i \\\\ g_{i,0}(t), & t_i\\le t\\le t_{i+1} \\\\ 0, & \\text{其它} \\\
    end{cases}\\quad i=1,2,\\cdots n-1$\n\n$a_{i,1}(t)=\\begin{cases} h_{i-1,1}(t)\\\
    cdot(t_i-t_{i-1}), & t_{i-1}\\le t\\le t_i \\\\ h_{i,0}(t)\\cdot(t_{i+1}-t_i),\
    \ & t_i\\le t\\le t_{i+1} \\\\ 0, & \\text{其它} \\end{cases}\\quad i=1,2,\\cdots\
    \ n-1$\n\n$a_{n,1}(t)=\\begin{cases} 0, & t_0\\le t\\le t_{n-1} \\\\ h_{n-1,1}(t)\\\
    cdot(t_n-t_{n-1}), & t_{n-1}\\le t\\le t_n \\end{cases}$\n\n## 完整的插值多项式可写为：\n\n\
