    \ 0 ≤ u ≤ 1\n\n② Performing linear interpolation in the w direction gives the\
    \ ruled surface:\n\nP₂(u,w) = f₀(w)·u0 + f₁(w)·u1\nwhere f₀(w)+f₁(w)=1, 0≤w≤1\n\
    \n③ Superimposing ① and ② yields a new surface P₃(u, w) whose boundaries are exactly\
    \ the unwanted straight-line boundaries:\n\n$P_3(u,w)=f_0(w)[f_0(u)\\cdot 00+f_1(u)\\\
    cdot 10]$\n\n$\\quad\\quad\\quad+f_1(w)[f_0(u)\\cdot 01+f_1(u)\\cdot 11]$\n\n\
    $=f_0(w)\\cdot f_0(u)\\cdot 00+f_0(w)\\cdot f_1(u)\\cdot 10$\n\n$\\quad\\quad\\\
    quad+f_1(w)\\cdot f_0(u)\\cdot 01+f_1(w)\\cdot f_1(u)\\cdot 11$\n\nwhere $f_0(u)+f_1(u)=1,\\\
