    $+⋯+ \\frac{n!}{(n-2)!}t^{n-2}(1-t)P_{n-1} - \\frac{n!}{(n-1)!}t^{n-1}P_{n-1}\
    \ + \\frac{n!}{(n-1)!}t^{n-1}P_n$\n$= ∑_{i=0}^{n-1} \\frac{n!}{i!(n-i-1)!}·t^{i}·(1-t)^{n-i-1}·(P_{i+1}-P_i)$\n\
