    # 常用方法 最小二乘法


    假设已知一组型值点（xi,yi），i=1,2,...n,要求构造一个m（m<n-1）次多项式函数y=F(x) 逼近这些型值点。


    偏差的平方和最小：

    φ = Σ_{k=1}^{n} (F(x_k) - y_k)^2


