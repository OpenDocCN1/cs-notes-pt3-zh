    \ 开始的 $s$ 个顶点按顺时针方向排列围成。（图中 $S_{0,4}, S_{3,5}$）\n\n每个子问题 $S_{i,s}$ 中都仅涉及原多边形一条对角线。\n\
    \n为了解 $S_{i,s}$，必须考虑如下三种情况：\n\n- 1. 选择顶点 $V_{i+s-2}$，这时构成一个三角形 $V_i V_{i+s-2}\
    \ V_{i+s-1}$，得到一个子问题 $S_{i,s-1}$。\n- 2. 选择顶点 $V_{i+1}$，这时构成一个三角形 $V_i V_{i+1}\
    \ V_{i+s-1}$，得到一个子问题 $S_{i+1,s-1}$。\n- 3. 对 $2 \\le k \\le s-3$，选择 $V_{i+k}$，这时构成一个三角形\
    \ $V_i V_{i+k} V_{i+s-1}$，得到两个子问题 $S_{i,k+1}$ 和 $S_{i+k,s-k}$。\n\n实际上可以把三种情况概括为一句话，即对\
    \ $1 \\le k \\le s-2$，把 $S_{i,s}$ 分解成两个子问题 $S_{i,k+1}$ 和 $S_{i+k,s-k}$。容易验证 $k=1$\
    \ 和 $k=s-2$ 时，各自有一个子问题不成其为问题，但这不影响一般的讨论。\n\n![](img/4628856fffb4db710a3ae3a299935a63_493_0.png)\n\
    \n$C_{i,s}=\\min\\{C_{i,k+1}+C_{i+k,s-k}+D(V_i,V_{i+k})+D(V_{i+k},V_{i+s-1})\\\
