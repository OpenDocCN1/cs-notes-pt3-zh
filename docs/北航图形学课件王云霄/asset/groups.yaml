    \ = P_{i+1} - 2P_{i+2} + P_{i+3} = 2[1/2 (P_{i+1} + P_{i+3}) - P_{i+2}]\n\n性质一：曲线在拼接处是连续的，一阶和二阶导数也是连续的。\n\
