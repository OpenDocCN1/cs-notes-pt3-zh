  md: "\n## 5.液晶显示器LCD (Liquid Crystal Display)\n\nLCD是靠后方一组日光灯管发光，然后经由一组菱镜片与背光模块，将光源均匀地传送到前方，依照所接收的影像讯号，液晶画素玻璃层内的液晶分子会作相对应的排列，决定哪些光线是需偏折或阻隔的\n\
