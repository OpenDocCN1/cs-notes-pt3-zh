    # # 单消失点的透视投影计算


    投影中心是坐标原点

    投影平面垂直于 z 轴


    设投影平面位于 z=d，可设 d>0。这样投影平面是平面 Z=d，对空间中任意一点 P，其普通坐标为 (x，y，z)，它在投影平面上的投影点 P′ 的普通坐标为
    (x′，y′，z′)。'
