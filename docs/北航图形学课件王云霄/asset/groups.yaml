    \n## 第五节 z-缓冲算法\n\nz-缓冲算法（深度缓冲算法）是一种最简单的图像空间算法。\n\n帧缓冲存储器：存储各点的像素值，初始化为背景值。\n\n\
    z-缓冲存储器：存储相应的 z 值。初始化最大 z 值。\n\n对每个多边形，无需进行深度排序算法所要求的初始排序，可以立即逐个进行扫描转换。\n\n###\
    \ 屏幕\n\n![](img/4628856fffb4db710a3ae3a299935a63_585_0.png)\n\n### 帧缓冲器\n\n![](img/4628856fffb4db710a3ae3a299935a63_585_1.png)\n\
    \n每个单元存放对应像素的颜色值\n\n### Z缓冲器\n\n![](img/4628856fffb4db710a3ae3a299935a63_585_2.png)\n\
    \n每个单元存放对应像素的深度值\n\n扫描转换时，对每个多边形内部的任意点（x, y），实施如下步骤：\n\n- 1. 计算在点（x, y）处多边形的深度值\
    \ z（x, y）。\n- 2. 如果计算所得的 z（x, y）值，小于在 z-缓冲存储器中点 (x, y) 处记录的深度值，那么就做：\n  - （1）把值\
    \ z(x, y) 送入 z-缓冲存储器的点 (x, y) 处。\n  - （2）把多边形在深度 z(x,y) 处应有的像素值，送入帧缓冲存储器的点 (x,\
    \ y) 处。\n\n算法中的深度计算，可通过多边形顶点坐标求出所在平面方程，然后再使用平面方程，对每个点 (x, y) 解出相应的 z。\n\n对平面方程\
    \ $Ax + By + Cz + D = 0$，解出 z 为：\n\n$$z = \\frac{-D - Ax - By}{C}$$\n\n设在点 (x,\
    \ y) 处的深度值是 $z_1$：\n\n$$\\frac{-D-Ax-By}{C}=z_1$$\n\n则在点 (x+Δx, y) 处的深度值为\n\n\
    $$\\frac{-D-A(x+\\Delta x)-By}{C}=\\frac{-D-Ax-By}{C}-\\frac{A}{C}\\Delta x$$\n\
    \n$$=z_1-\\frac{A}{C}\\Delta x$$\n\nz-缓冲算法的工作流程：\n\n```\n帧缓冲区置成背景色；\nz-缓冲区置成最大z值；\n\
    for（各个多边形）\n{\n    扫描转换该多边形；\n    for (计算多边形所覆盖的每个像素（x, y）)\n    {\n        计算多边形在该像素的深度值\
    \ Z(x, y)；\n        if (Z(x, y) 小于 Z缓冲区中的 (x, y) 处的值)\n        {\n           \
    \ 把 Z(x, y) 存入 Z缓冲区中的 (x, y) 处；\n            把多边形在 (x, y) 处的亮度值存入帧缓存区的 (x, y)\
    \ 处；\n        }\n    }\n}\n```\n\n## 第六节 扫描线算法\n\n消除隐藏面的扫描线算法：**图像空间算法**\n\n第二章第三节\
    \ 多边形扫描转换算法 ⇒ **推广**\n\n- 填充算法：针对单个多边形进行扫描转换\n- 消隐算法：同时对**多个多边形**进行扫描转换\n\n###\
    \ ET表（边表）中吊桶的内容\n\n- 1. 与较小的 y 坐标对应的端点的 x 坐标 xmin。\n- 2. 边的另一端点的较大的 y 坐标 ymax。\n\
    - 3. x 的增量 Δx，实际上是边斜率的倒数，表示从一条扫描线走到下一条扫描线时沿 x 方向的递增步长。\n- 4. 边所属多边形的标记。\n- 5.\
    \ 指针：指向下一条边。\n\n### PT表（多边形表）\n\n记录多边形信息，一个记录对应一个多边形。一个记录的内容：\n\n- 1. 多边形所在平面方程的系数\
    \ A, B, C, D\n- 2. 多边形的颜色或亮度值\n- 3. 进入/退出标志，标记当前扫描线对该多边形是“进入”还是“退出”\n\n### AET表（活跃边表）\n\
