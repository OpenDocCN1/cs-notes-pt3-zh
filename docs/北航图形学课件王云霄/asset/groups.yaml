    \ \\le z'_1$ 且 $z_2 \\le z'_2$，则线段不被遮挡\n\n若 $z_1 \\ge z'_1$ 且 $z_2 \\ge z'_2$，有可能遮挡需要进一步检查\n\
    \n若非以上两种情况，必然相交，求出交点，交点将原线段分成两段，分别属于上面两种情况\n\n求出 $z_1, z'_1$\n\n设平面方程为 $Ax+By+Cz+D=0$\n\
    \n直线 $L_1$ 的参数方程\n\n$X=x_1,$\n\n$Y=y_1,$\n\n$Z=z_1+t,$ 代入平面方程得： $Ax_1+By_1+C(z_1+t)+D=0$\n\
    \n解得 t = − (Ax₁+By₁+Cz₁+D)/C\n\n若t≥0, 则z1 ≤ z1′, 靠近视点 可见\n\n若t<0, 则z1>z1′， 远离视点\n\
    \n# 4. 进一步检查\n\n对平面遮挡了线段的哪些部分做精确计算\n\n求线段投影与多边形边框投影的交点（第五章 第一节）\n\n设交点已经求出，设其对应的参数\
    \ λ，按从小到大依次排序后是 λ1，λ2。。。 ，则这些交点将投影线段分成的各子线段的可见性应是可见，不可见交替出现。\n\n判断子线段的可见性：（第五章\
    \ 第四节）\n\n![](img/4628856fffb4db710a3ae3a299935a63_576_0.png)\n\n需要检查出某一子线段是否可见。为此可以取子线段上任意一点，若这点在多边形表面各边线的投影所形成的封闭多边形内，这子线段就不可见，否则就可见。\n\
    \n# 第三节 深度排序算法\n\n深度排序算法：先画最远的，再画最近的\n（优先级算法，画家算法）\n\n深度排序算法的主要步骤：\n\n+   1. 把所有的多边形按顶点最大z坐标值进行排序。\n\
    +   （客体空间）\n\n+   2. 解决当多边形z范围发生交送时出现的不明确问题。\n\n+   3. 按最大z坐标值逐渐减小的次序，对每个多边形进行扫描转换。（图像空间）\n\
    \n# 不明确问题检验方法\n\n所有多边形按顶点最大z坐标值排序后得到一个排序表，设P是排在表中最后的那个多边形。\n\n设Q是排在P前面并且z坐标范围与其发生交迭的一个多边形，对Q与P的次序关系进行检查。\n\
    \nQP\n\n"
