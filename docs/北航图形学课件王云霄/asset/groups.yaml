    # 第五节 B样条曲线和曲面


    一. B样条曲线（构造具有局部性的调和函数）


    给定n+1个控制点P₀, P₁, …, Pₙ, 它们所确定的k阶B样条曲线是：


    ```

    P(u) = Σ (i=0 to n) N_{i,k}(u)·P_i

    ```


    其中N_{i,k}(u)递归定义如下：'
  - '[PAGE 388]


    $$N_{i,1}(u)=\begin{cases}1, & u_i\le u\le u_{i+1},\ 0\le i\le n+k-1\\0, & \text{其它}\end{cases}$$


    $$N_{i,k}(u)=\frac{u-u_i}{u_{i+k-1}-u_i}N_{i,k-1}(u)+\frac{u_{i+k}-u}{u_{i+k}-u_{i+1}}N_{i+1,k-1}(u),\quad
    k>1,\ 0\le i\le n$$


    这里 $u_0，u_1，\ldots，u_{n+k}$ 是一个**非递减**的序列，称为节点，$(u_0，u_1，\ldots，u_{n+k})$ 称为**节点向量**。定义中可能出现
    $\frac{0}{0}$，这时约定为 0。'
