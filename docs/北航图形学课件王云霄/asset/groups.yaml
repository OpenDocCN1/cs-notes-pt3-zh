  - '[PAGE 355]


    左端 = Σ (i=0 to n) B_{i,n}(t)·P_i

    = C_n^0 (1 - t)^n P_0 + C_n^1 t^1 (1 - t)^{n-1} P_1 + … + C_n^n t^n P_n


    右端 = (1 - t)· Σ (i=0 to n-1) C_{n-1}^i t^i (1 - t)^{n-i-1}·P_i + t· Σ (i=0 to
    n-1) C_{n-1}^i t^i (1 - t)^{n-i-1}·P_{i+1}

    = (1 - t)[ (1 - t)^{n-1}·P_0 + Σ (i=1 to n-1) C_{n-1}^i t^i (1 - t)^{n-i-1}·P_i
    ]

    + t[ Σ (i=1 to n-1) C_{n-1}^{i-1} t^{i-1} (1 - t)^{n-i}·P_i + t^{n-1}·P_n ]

    = (1 - t)^n P_0 + Σ (i=1 to n-1) C_{n-1}^i t^i (1 - t)^{n-i}·P_i + Σ (i=1 to n-1)
    C_{n-1}^{i-1} t^i (1 - t)^{n-i}·P_i + t^n·P_n

    = (1 - t)^n·P_0 + Σ (i=1 to n-1) (C_{n-1}^i + C_{n-1}^{i-1}) t^i (1 - t)^{n-i}·P_i
