  md: "\n## ③比较投影范围：\n\n在xv方向：\n\n若xmax1<=xmin2或xmax2<=xmin1,则无遮挡关系\n\nYv方向：\n\n若ymax1<=ymin2或ymax2<=ymin1,则无遮挡关系\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_510_0.png)\n\n![](img/4628856fffb4db710a3ae3a299935a63_510_1.png)\n\
    \n## 2. $z$方向粗略的深度检查。\n\n若线段投影的最大$z$坐标$z_{max1}$小于多边形表面投影范围最小的$z$坐标$z_{min2}$，则线段完全在表面前面，根不发生遮挡现象，可以不必再往下做精确的深度检验。\n\
    \n## 3. 精确的深度检验\n\n![](img/4628856fffb4db710a3ae3a299935a63_511_0.png)\n\n若 $z_1\
    \ \\le z'_1$ 且 $z_2 \\le z'_2$，则线段不被遮挡\n\n若 $z_1 \\ge z'_1$ 且 $z_2 \\ge z'_2$，有可能遮挡需要进一步检查\n\
    \n若非以上两种情况，必然相交，求出交点，交点将原线段分成两段，分别属于上面两种情况\n\n求出 $z_1, z'_1$\n\n设平面方程为 $Ax+By+Cz+D=0$\n\
    \n直线 $L_1$ 的参数方程\n\n$X=x_1,$\n\n$Y=y_1,$\n\n$Z=z_1+t,$ 代入平面方程得： $Ax_1+By_1+C(z_1+t)+D=0$\n\
    \n解得 t = − (Ax₁+By₁+Cz₁+D)/C\n\n若t≥0, 则z1 ≤ z1′, 靠近视点 可见\n\n若t<0, 则z1>z1′， 远离视点\n\
    \n## 4. 进一步检查\n\n对平面遮挡了线段的哪些部分做精确计算\n\n求线段投影与多边形边框投影的交点（第五章 第一节）\n\n设交点已经求出，设其对应的参数\
    \ λ，按从小到大依次排序后是 λ1，λ2。。。 ，则这些交点将投影线段分成的各子线段的可见性应是可见，不可见交替出现。\n\n判断子线段的可见性：（第五章\
    \ 第四节）\n\n![](img/4628856fffb4db710a3ae3a299935a63_514_0.png)\n\n需要检查出某一子线段是否可见。为此可以取子线段上任意一点，若这点在多边形表面各边线的投影所形成的封闭多边形内，这子线段就不可见，否则就可见。\n\
    \n## 第三节 深度排序算法\n\n深度排序算法：先画最远的，再画最近的\n（优先级算法，画家算法）\n\n深度排序算法的主要步骤：\n\n- 1. 把所有的多边形按顶点最大z坐标值进行排序。\n\
    - （客体空间）\n- 2. 解决当多边形z范围发生交送时出现的不明确问题。\n- 3. 按最大z坐标值逐渐减小的次序，对每个多边形进行扫描转换。（图像空间）\n\
    \n## 不明确问题检验方法\n\n所有多边形按顶点最大z坐标值排序后得到一个排序表，设P是排在表中最后的那个多边形。\n\n设Q是排在P前面并且z坐标范围与其发生交迭的一个多边形，对Q与P的次序关系进行检查。\n\
    \nQP\n\n![](img/4628856fffb4db710a3ae3a299935a63_517_0.png)\n\n检查可以按下面列出的五个步骤进行，每个步骤判断一种情况。\n\
    \n- 1. 多边形的x坐标范围不相交迭，所以多边形不相交迭。QP\n- 2. 多边形的y坐标范围不相交迭，所以多边形不相交迭。QP\n- 3. P整个在Q远离观察点的一侧。QP\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_518_0.png)\n\n4. Q整个在P的靠近观察点的一侧。 QP\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_519_0.png)\n\n5. 多边形在z=0平面上的投影本身不相交迭。\
    \ QP\n\n以上五步中任何一步成立，都可以说明当前排序正确\n\n## 第五节 z-缓冲算法\n\nz-缓冲算法：(深度缓冲算法)是一种最简单的图象空间算法。\n\
    \n帧缓冲存储器：存储各点的像素值，初始化为背景值。\n\nz-缓冲存储器：存储相应的z值。初始化最大z值。\n\n对每一个多边形，不必进行深度排序算法要求的初始排序，立即就可以逐个进行扫描转换。\n\
    \n## 原幕\n\n![](img/4628856fffb4db710a3ae3a299935a63_523_0.png)\n\n## 帧缓冲器\n\n\
    ![](img/4628856fffb4db710a3ae3a299935a63_523_1.png)\n\n每个单元存放对应象素的颜色值\n\n## Z缓冲器\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_523_2.png)\n\n每个单元存放对应象素的深度值\n\n扫描转换时，对每个多边形内部的任意点（x,\
    \ y），实施如下步骤：\n\n- 1. 计算在点（x, y）处多边形的深度值z（x, y）。\n- 2. 如果计算所得的z（x, y）值，小于在z-缓冲存储器中点(x,y)处记录的深度值，那么就做：\n\
    - （1）把值z(x, y)送入z-缓冲存储器的点(x, y)处。\n- （2）把多边形在深度z(x,y)处应有的象素值，送入帧缓冲存储器的点(x, y)处。\n\
    \n算法中深度计算，可通过多边形的顶点坐标求出所在平面的方程，然后再使用平面方程，对每个点(x,y)，解出相应的z。\n\n对面方程 $Ax + By +\
    \ Cz + D = 0$，\n\n解出 z 是：\n\n$$z = \\frac{-D - Ax - By}{C}$$\n\n设在点 **(x, y)**\
    \ 处的深度值是 $z_1$：\n\n$$\\frac{-D-Ax-By}{C}=z_1$$\n\n则在点 **(x+Δx, y)** 处的深度值就是\n\n\
    $$\\frac{-D-A(x+\\Delta x)-By}{C}=\\frac{-D-Ax-By}{C}-\\frac{A}{C}\\Delta x$$\n\
    \n$$=z_1-\\frac{A}{C}\\Delta x$$\n\n```\nz-缓冲算法的工作流程：\n帧缓冲区置成背景色；\nz-缓冲区置成最大z值；\n\
    for（各个多边形）\n{ 扫描转换该多边形；\n    for (计算多边形所覆盖的每个像素（x, y）)\n    {  计算多边形在该像素的深度值Z(x,\
    \ y)；\n    if(Z(x, y) 小于Z缓冲区中的(x, y)处的值)\n        {  把Z(x, y)存入Z缓冲区中的(x, y)处；\n\
    \        把多边形在(x, y)处的亮度值存入帧缓存区的(x, y)处； }\n    }\n}\n```\n\nZ-Buffer算法优点：\n在像素级上以近物取代远物。形体在屏幕上的出现顺序是无关紧要的。这种取代方法实现起来远比总体排序灵活简单，有利于硬件实现。\n\
    Z-Buffer算法缺点：占用空间大，没有利用图形的相关性与连续性。需要开一个与图象大小相等的缓存数组ZB。\n\n改进算法:只用一个深度缓存变量zb。\n\
    \n```\nZ-Buffer()\n[ 帧缓存全置为背景色\n    for (屏幕上的每个像素(i, j)) //扫描整个屏幕\n[ 深度缓存变量zb置最大值MaxValue\n\
    \    for (多面体上的每个多边形Pk)\n    { if (像素点(i, j)在pk的投影多边形之内)\n    { 计算Pk在(i, j)处的深度值depth;\n\
    \        if (depth小于zb)\n        { zb = depth;\n            indexp = k;}}}\n \
    \   If (zb != MaxValue) 计算多边形Pindexp在交点 (i, j) 处的光照颜色并显示\n]]\n```\n\n## 第六节 扫描线算法\n\
    \n消除隐藏面的扫描线算法： 图像空间算法\n\n第二章 第三节 多边形扫描转换算法 => 推广\n\n填充算法： 针对一个多边形做扫描转换\n\n消隐算法：\
    \ 同时对多个多边形做扫描转换。\n\n## ET表（边表）中吊桶的内容：\n\n- 1. 与较小的y坐标对应的端点的x坐标xmin。\n- 2. 边的另一端点的较大的y坐标ymax。\n\
    - 3. x的增量Δx，它实际上是边的斜率的倒数，是从一条扫描线走到下一条扫描线时，按x方向递增的步长。\n- 4. 边所属多边形的标记。\n- 5. 指针\
    \ 指向下一条边\n\n## PT表（多边形表）：记录多边形信息，一个记录对应一个多边形。\n\n一个记录的内容：\n\n- 1. 多边形所在平面方程的系数A,\
    \ B, C, D\n- 2. 多边形的颜色或亮度值\n- 3. 进入/退出标志，标记当前扫描线对该多边形是“进入”还是“退出”\n\n## AET表（活跃边表）：存储与当前扫描线相交的各边的信息。\n\
    \n## APT表（活跃多边形表）：与当前扫描线相交的所有多边形，按深度递增排序。\n\n## 扫描线y=α：\n\nAET表中有AB, AC，\n到AB时，Flag_ABC=1，AB到AC一段用ABC的颜色填充\n\
    到AC时，Flag_ABC=0，\n\n## 扫描线y=β：\n\nAET表中有四项AB, AC, FD, FEF，\n到AB时，Flag_ABC=1，AB到AC一段用ABC的颜色填充\n\
    到AC时，Flag_ABC=0, AC到FD之间填充背景色\n到FD时，Flag_DEF=1, FD到FE之间填充DEF颜色\n到FE时，Flag_DEF=0\n\
    \n## 扫描线y=γ：\n\nAET表中有四项AB, DE, CB, FE\n\n到AB时，Flag_ABC=1，AB到DE之间填ABC的颜色\n\n到DE时，Flag_DEF=1，做深度比较，求（x’，γ）的深度\n\
    \nz_ABC = (-A1 x' - B1 γ - D1)/C1 , z_DEF = (-A2 x' - B2 γ - D2)/C2\n\n若Z_DEF\
    \ < Z_ABC，则DE到CB之间填DEF的颜色\n\n到CB时，Flag_ABC=0, BC到EF之间填DEF颜色\n\n到FE时，Flag_DEF=0\n"
