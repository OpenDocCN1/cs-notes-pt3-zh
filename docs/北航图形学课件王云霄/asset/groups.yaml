    # 第五节 z-缓冲算法


    z-缓冲算法：(深度缓冲算法)是一种最简单的图象空间算法。


    帧缓冲存储器：存储各点的像素值，初始化为背景值。


    z-缓冲存储器：存储相应的z值。初始化最大z值。


    对每一个多边形，不必进行深度排序算法要求的初始排序，立即就可以逐个进行扫描转换。'
  - '[PAGE 523]


    # 原幕


    ![](img/4628856fffb4db710a3ae3a299935a63_523_0.png)


    # 帧缓冲器


    ![](img/4628856fffb4db710a3ae3a299935a63_523_1.png)


    每个单元存放对应象素的颜色值


    # Z缓冲器


    ![](img/4628856fffb4db710a3ae3a299935a63_523_2.png)


    每个单元存放对应象素的深度值'
  - '[PAGE 524]


    扫描转换时，对每个多边形内部的任意点（x, y），实施如下步骤：


    +   1. 计算在点（x, y）处多边形的深度值z（x, y）。


    +   2. 如果计算所得的z（x, y）值，小于在z-缓冲存储器中点(x,y)处记录的深度值，那么就做：


    +   （1）把值z(x, y)送入z-缓冲存储器的点(x, y)处。

    +   （2）把多边形在深度z(x,y)处应有的象素值，送入帧缓冲存储器的点(x, y)处。'
  - '[PAGE 525]


    算法中深度计算，可通过多边形的顶点坐标求出所在平面的方程，然后再使用平面方程，对每个点(x,y)，解出相应的z。


    对面方程 $Ax + By + Cz + D = 0$，


    解出 z 是：


    $$z = \frac{-D - Ax - By}{C}$$'
  - '[PAGE 526]


    设在点 **(x, y)** 处的深度值是 $z_1$：


    $$\frac{-D-Ax-By}{C}=z_1$$


    则在点 **(x+Δx, y)** 处的深度值就是


    $$\frac{-D-A(x+\Delta x)-By}{C}=\frac{-D-Ax-By}{C}-\frac{A}{C}\Delta x$$


    $$=z_1-\frac{A}{C}\Delta x$$'
