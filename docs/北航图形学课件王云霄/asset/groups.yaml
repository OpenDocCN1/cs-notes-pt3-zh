    \            x++;\n            y--;\n        }\n        SetPixel(x, y);\n    }\n\
    }\n```\n\n### 算法四：Bresenham画圆算法\n\n在 $0\\le x\\le y$ 的 $1/8$ 圆周上，像素坐标 $x$ 值单调增加，$y$\
    \ 值单调减少。\n\n设第 $i$ 步已确定 $(x_i,y_i)$ 是要画的圆上的像素点，看第 $i+1$ 步像素点 $(x_{i+1},y_{i+1})$\
    \ 应如何确定。下一个像素点只能是 $(x_i+1,y_i)$ 或者 $(x_i+1,y_i-1)$ 中的一个。\n\n$$d_H=(x_i+1)^2+y_i^2-R^2$$\n\
    \n$$d_D=R^2-(x_i+1)^2-(y_i-1)^2$$\n\n构造判别式：$p_i=d_H-d_D$\n\n若精确圆弧是①或②，显然 $H$ 是应选择的点，而此时\
    \ $d_H\\leq0$，$d_D>0$，必有 $p_i<0$。\n\n精确圆弧是③，则 $d_H>0$ 且 $d_D>0$。若 $p_i<0$，即 $d_H<d_D$，应选\
    \ $H$ 点。若 $p_i\\geq0$，即 $d_H\\geq d_D$，应选 $D$ 点。\n\n若精确圆弧是④或⑤，显然 $D$ 是应选择的点，而此时\
    \ $d_H>0$，$d_D\\leq0$，必有 $p_i>0$。\n\n得出结论：以 $p_i$ 作为判别量，$p_i<0$ 选 $H$ 点为下一个像素点，当\
    \ $p_i\\geq0$ 时，选 $D$ 点为下一个像素点。\n\n### 从 $p_i$ 计算 $p_{i+1}$\n\n$$p_i=2(x_i+1)^2+2y_i^2-2y_i-2R^2+1$$\n\
    \n$$p_{i+1}-p_i=2(y_{i+1}^2-y_i^2-y_{i+1}+y_i)+4x_i+6$$\n\n当 $p_i\\geq0$ 时，应选\
    \ $D$ 点，即选 $y_{i+1}=y_i-1$\n\n$$p_{i+1}=p_i+4(x_i-y_i)+10$$\n\n```cpp\nvoid BresenhamCircle(int\
    \ R)\n{\n    int x,y,p;\n    x=0; y=R;\n    p=3-2*R;\n    for(;x<=y;x++)\n   \
    \ {\n        SetPixel(x,y);\n        if(p>=0)\n        {\n            p+=4*(x-y)+10;\n\
    \            y--;\n        }\n        else\n        {\n            p+=4*x+6;\n\
    \        }\n    }\n}\n```\n\n只需修改语句 `SetPixel(x,y)`，画八个对称的点，就可以画出全部圆周。若加一个平移，就可以画出圆心在任意位置的圆周。\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_76_0.png)\n\n## 椭圆的扫描转换算法\n\n中点画圆法推广到一般的二次曲线\n\
    \n$$F(x,y)=b^2x^2+a^2y^2-a^2b^2=0$$\n\n椭圆上一点 $(x,y)$ 处的法向量为\n\n$$N(x,y)=\\frac{\\\
    partial F}{\\partial x}i+\\frac{\\partial F}{\\partial y}j=2b^2x\\,i+2a^2y\\,j$$\n\
    \n即法向量为 $(2b^2x,2a^2y)$（$i,j$ 为 $x$ 轴、$y$ 轴的单位向量）。\n\n上半部分：$(x_p,y_p)$，$M(x_p+1,y_p-0.5)$，法向量的\
    \ $y$ 分量更大。\n\n下半部分：$(x_p,y_p)$，$M(x_p+0.5,y_p-1)$，法向量的 $x$ 分量更大。\n\n当前中点：$2b^2(x_p+1)<2a^2(y_p-0.5)$\
    \ 为上半部分。\n\n下一个中点：$2b^2(x_p+1)>2a^2(y_p-0.5)$ 为下半部分。\n\n"
