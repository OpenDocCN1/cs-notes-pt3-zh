    \n![](img/4628856fffb4db710a3ae3a299935a63_237_0.png)\n\n对多边形的裁剪可以采用Suther land-Hodgman算法，只要对多边形用窗口的四条边裁剪四次就可得到裁剪后的多边形\n\
