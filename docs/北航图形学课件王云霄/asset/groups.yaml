  - '[PAGE 191]


    主消失点：如果一组平行直线平行于三个坐标轴中的一个，那么对应的消失点将落在坐标轴上，这样的消失点称为主消失点。


    因为只有三个坐标轴，所以最多只有三个主消失点。根据主消失点的数目，透视投影可以分为一点透视、两点透视、三点透视。


    如果投影平面截Z轴并与它垂直，这时就只能在Z轴方向上有主消失点。'
