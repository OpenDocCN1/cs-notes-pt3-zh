  - '[PAGE 470]


    # 二. 凸多边形的包含算法


    如何判断坐标为 (xp, yp) 的点P在直线的哪一侧？


    设直线的端点为 (x1, y1) 和 (x2, y2)，直线方向是由 (x1, y1) 到 (x2, y2) 的方向。


    直线的方程记为 Ax+By+C=0，则有：


    A=y2−y1，B=x1−x2，C=x2y1−x1y2


    计算D：


    D=Axp+Byp+C


    +   若 **D<0**，则点在直线**左侧**；

    +   若 **D>0**，则点在直线**右侧**；

    +   若 D=0，则点在直线**上**。


    ![](img/4628856fffb4db710a3ae3a299935a63_470_0.png)'
