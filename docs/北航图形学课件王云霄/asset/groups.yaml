    \n## Bezier几何作图算法计算过程\n\n## b. 分裂法\n\n思想：将原控制点集分为两个点数相同的新控制点集，分别对应原曲线的前半段和后半段，新控制点集比原控制点集更接近直线，分裂过程继续进行，控制点集会迅速向曲线靠近，当满足某个允许的界限时，可依次连接各点的折线来表示曲线\n\
    \n设控制点序列P₀, P₁, …, Pₙ确定的n次Bezier曲线是P(t)，用如下递归方式计算另一组点集：\n\nPᵢᵏ = { Pᵢ, k=0, i=0,1,…,n\n\
    \ 1/2(Pᵢᵏ⁻¹+Pᵢ₋₁ᵏ⁻¹), k=1,2,…,n, i=k,k+1,…,n }\n\n如果令Pₐ(s)和Pᵦ(s)分别是以控制点序列P₀⁰,P₁¹,…,Pₙⁿ，Pₙⁿ,Pₙ₋₁ⁿ⁻¹,…,P₀⁰确定的Bezier曲线，其中0≤s≤1，那么就有：\n\
    \n$$P(t)=\\begin{cases} P_a(s)=\\displaystyle\\sum_{i=0}^{n}C_n^i\\cdot s^i(1-s)^{n-i}\\\
    cdot P_1^i, & s=2t,\\ 0\\le t\\le\\frac{1}{2}\\\\[6pt] P_b(s)=\\displaystyle\\\
    sum_{i=0}^{n}C_n^i\\cdot s^i(1-s)^{n-i}\\cdot P_n^{n-i}, & s=2t-1,\\ \\frac{1}{2}\\\
    le t\\le1 \\end{cases}$$\n\n## 已知四点P₀，P₁，P₂，P₃，确定了一条三次Bezier曲线P(t)，可写出下式，\n\n\
    P(t) = B₀,₃(t)P₀ + B₁,₃(t)P₁ + B₂,₃(t)P₂ + B₃,₃(t)P₃\n= { B₀,₃(2t)P₀⁰ + B₁,₃(2t)P₁¹\
    \ + B₂,₃(2t)P₂² + B₃,₃(2t)P₃³,  0 ≤ t ≤ 1/2\n  B₀,₃(2t−1)P₃³ + B₁,₃(2t−1)P₃² +\
    \ B₂,₃(2t−1)P₃¹ + B₃,₃(2t−1)P₃⁰,  1/2 ≤ t ≤ 1 }\n\n![](img/4628856fffb4db710a3ae3a299935a63_365_0.png)\n\
    \n分裂法中的递归计算\n\n分裂法的示意图\n\n## 验证Bezier曲线分成前后两段的正确性，\n\nP₀的系数为例，验证两端它的系数是相等的。\n\n\
    左端 = B₀,₃(t) = (1 - t)³\n0 ≤ t ≤ 1/2\n\n右端 = B₀,₃(2t) + 1/2 B₁,₃(2t) + 1/4 B₂,₃(2t)\
    \ + 1/8 B₃,₃(2t)\n\n= (1 - 2t)³ + 1/2 · 3 · 2t · (1 - 2t)² + 1/4 · 3 · (2t)² (1\
    \ - 2t) + 1/8 (2t)³\n\n= (1 - 2t)³ + 3·t·(1 - 2t)² + 3·t²·(1 - 2t) + t³\n\n= (1\
    \ - 2t + t)³\n\n= (1 - t)³\n1/2 ≤ t ≤ 1\n\n右端 = 1/8 B₀,₃(2t - 1) = 1/8 (1 - (2t\
    \ - 1))² = (1 - t)³\n\n## P₁的系数：\n\n左端 = B₁,₃(t) = 3t(1 - t)²\n0 ≤ t ≤ 1/2\n\n\
    右端 = 1/2 B₁,₃(2t) + 1/2 B₂,₃(2t) + 3/8 B₃,₃(2t)\n= 1/2 · 3 · 2t · (1 - 2t)² +\
    \ 1/2 · 3 · (2t)²(1 - 2t) + 3/8 (2t)³\n= 3·t·(1 - 2t)² + 6·t²·(1 - 2t) + 3t³\n\
    = 3t(1 - 2t + t²)\n= 3t(1 - t)²\n1/2 ≤ t ≤ 1\n\n右端 = 3/8 B₀,₃(2t - 1) + 1/4 B₁,₃(2t\
    \ - 1)\n= 3/8 (1 - (2t - 1))³ + 1/4 · 3 · (2t - 1)(1 - (2t - 1))²\n= 3(1 - t)³\
    \ + 3(2t - 1)(1 - t)²\n= 3t(1 - t)²\n\n设已知三次Bezier曲线P(t)的控制顶点是P₀，P₁，P₂，P₃，在P(½)处将曲线分为两段，求出前半段的控制顶点Q₀，Q₁，Q₂，Q₃和后半段的控制顶点R₀，R₁，R₂，R₃，。有算法如下\n\
    \n```\nvoid split_Bezier(Point P[])\n{\n    Point R[4],Q[4];\n    int i,j;\n \
    \   for(i=0;i<=3;i++)\n        R[i]=P[i];\n    for(i=0;i<=2;i++)\n    {   Q[i]=R[0];\n\
    \        for(j=0;j<=2-i;j++)\n        {   R[j].x=(R[j].x+R[j+1].x)/2;\n      \
    \      //分别对相邻两控制点间的线段进行分裂\n            R[j].y=(R[j].y+R[j+1].y)/2;\n        }\n\
    \    }\n    Q[3]=R[0];\n}\n```\n\n"
