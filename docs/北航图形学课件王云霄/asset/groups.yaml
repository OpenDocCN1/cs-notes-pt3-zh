    # 构造具有指定边界曲线的曲面片：


    Coons给出的一個解法是：寻找两个混合函数 $f_0(t)$ 和 $f_1(t)$，它们是连续的，并且满足 $f_0(0)=1$，$f_0(1)=0$，$f_1(0)=0$，$f_1(1)=1$，且
    $f_0(t)+f_1(t)=1$，$0\leqslant t\leqslant1$。


    $f_0(t)=2t^3-3t^2+1$, $f_1(t)=-2t^3+3t^2$

    $f_0(t)=1-t$, $f_1(t)=t$'
  - '[PAGE 315]


    # 问题1：求通过四条边界线的曲面


    给定四条边界曲线u0，u1，0w，1w，且0≤u≤1，0≤w≤1


    ①在u向进行线性插值，得到直纹面为：


    P₁(u,w) = f₀(u)·0w + f₁(u)·1w


    其中f₀(u) + f₁(u) = 1, 0 ≤ u ≤ 1'
  - '[PAGE 316]


    ②在w向进行线性插值，得到直纹面为：


