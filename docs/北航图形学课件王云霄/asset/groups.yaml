  - '[PAGE 185]


    # 2. 斜交投影


    当平行投影中投影平面的法线方向与投影方向不同时就得到斜交投影。在斜交投影中，投影平面一般取坐标平面。


    ![](img/4628856fffb4db710a3ae3a299935a63_185_0.png)


    图 3-19 对点 P(0,0,l) 作斜平行投影到 P′(l cos α,l sin α,0)'
  - '[PAGE 186]


    设三维空间中有普通坐标为的任意一点 $(x, y, z)$，经斜交投影后所得投影点普通坐标为 $(x'', y'', z'')$。显然 $z'' = 0$，有：


    $$\frac{x'' - x}{z} = \frac{l \cos \alpha}{1}, \quad \frac{y'' - y}{z} = \frac{l
    \sin \alpha}{1}$$


    $$x'' = x + z \bullet (l \bullet \cos \alpha)$$

    $$y'' = y + z \bullet (l \bullet \sin \alpha)$$'
  - '[PAGE 187]


    [x''  y''  z''  1]=[x  y  z  1]\begin{bmatrix}1 & 0 & 0 & 0 \\ 0 & 1 & 0 & 0 \\
    l\cos\alpha & l\sin\alpha & 0 & 0 \\ 0 & 0 & 0 & 1\end{bmatrix}


    M_{ob}=\begin{bmatrix}1 & 0 & 0 & 0 \\ 0 & 1 & 0 & 0 \\ l\cos\alpha & l\sin\alpha
    & 0 & 0 \\ 0 & 0 & 0 & 1\end{bmatrix}'
