    # 二：等距B样条曲线：


    参数节点中参数 $u$ 的每一区间为等长时所得到的B样条函数称为是等距的，或均匀B样条曲线。可假定 $u_i= i$，$i=0,1,\cdots,n+k$，设
    $t=u-u_{i+j}$，$u_{i+j}\le u\le u_{i+j+1}$ 与 $0\le t_j\le1$ 是等价的。


    递归式，经过计算，可以写出：


    ```

    $$N_{i,1}(u)=\begin{cases}1,&u_i\le u\le u_{i+1}\\0,&\text{其它}\end{cases}$$


    $$=\begin{cases}1,&0\le t_0\le1,\ t_0=u-u_i\\0,&\text{其它}\end{cases}$$

    ```'
