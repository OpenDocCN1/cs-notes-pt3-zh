    cdots,n+k$，设 $t=u-u_{i+j}$，$u_{i+j}\\le u\\le u_{i+j+1}$ 与 $0\\le t_j\\le1$ 是等价的。\n\
    \n递归式，经过计算，可以写出：\n\n```\n$$N_{i,1}(u)=\\begin{cases}1,&u_i\\le u\\le u_{i+1}\\\
    \\0,&\\text{其它}\\end{cases}$$\n\n$$=\\begin{cases}1,&0\\le t_0\\le1,\\ t_0=u-u_i\\\
    \\0,&\\text{其它}\\end{cases}$$\n```\n\nN_{i,2}(u)=\\frac{u-u_i}{u_{i+1}-u_i}\\\
    cdot N_{i,1}(u)+\\frac{u_{i+2}-u}{u_{i+2}-u_{i+1}}\\cdot N_{i+1,1}(u)\n\n=\\begin{cases}\n\
    \ u-u_i, & u_i\\le u\\le u_{i+1}\\\\\n u_{i+2}-u, & u_{i+1}\\le u\\le u_{i+2}\\\
    \\\n 0, & \\text{其它}\n\\end{cases}\n\n=\\begin{cases}\n t_0, & 0\\le t_0\\le1,\
    \ t_0=u-u_i\\\\\n 1-t_1, & 0\\le t_1\\le1, t_1=u-u_{i+1}\\\\\n 0, & \\text{其它}\n\
    \\end{cases}\n\n$$N_{i,3}(u)=\\frac{u-u_i}{u_{i+2}-u_i}N_{i,2}(u)+\\frac{u_{i+3}-u}{u_{i+3}-u_{i+1}}N_{i+1,2}(u)$$\n\
    \n$$N_{i,3}(u)=\\begin{cases}\\frac{1}{2}(u-u_i)^2, & u_i\\le u\\le u_{i+1}\\\\\
    [2pt]\\frac{1}{2}(u-u_i)(u_{i+2}-u)+\\frac{1}{2}(u_{i+3}-u)(u-u_{i+1}), & u_{i+1}\\\
    le u\\le u_{i+2}\\\\[2pt]\\frac{1}{2}(u_{i+3}-u)^2, & u_{i+2}\\le u\\le u_{i+3}\\\
    \\[2pt]0, & \\text{其它}\\end{cases}$$\n\n$$=\\begin{cases}\\frac{1}{2}t_0^2, &\
    \ 0\\le t_0\\le1,\\ t_0=u-u_i\\\\[2pt]\\frac{1}{2}(-2t_1^2+2t_1+1), & 0\\le t_1\\\
    le1,\\ t_1=u-u_{i+1}\\\\[2pt]\\frac{1}{2}(1-t_2)^2, & 0\\le t_2\\le1,\\ t_2=u-u_{i+2}\\\
    \\[2pt]0, & \\text{其它}\\end{cases}$$\n\nN_{i,4}(u)=\\frac{u-u_i}{u_{i+3}-u_i}\\\
    cdot N_{i,3}(u)+\\frac{u_{i+4}-u}{u_{i+4}-u_{i+1}}\\cdot N_{i+1,3}(u)\n=\\begin{cases}\n\
    \\frac{1}{6}(u-u_i)^3, & u_i\\le u\\le u_{i+1}\\\\\n\\frac{1}{6}\\big[(u-u_i)^2(u_{i+2}-u)+(u-u_i)(u_{i+3}-u)(u-u_{i+1})+(u_{i+4}-u)(u-u_{i+1})^2\\\
    big], & u_{i+1}\\le u\\le u_{i+2}\\\\\n\\frac{1}{6}\\big[(u-u_i)(u_{i+3}-u)^2+(u-u_{i+1})(u_{i+4}-u)(u_{i+3}-u)+(u_{i+4}-u)^2(u-u_{i+2})\\\
    big], & u_{i+2}\\le u\\le u_{i+3}\\\\\n\\frac{1}{6}(u_{i+4}-u)^3 & u_{i+3}\\le\
    \ u\\le u_{i+4}\\\\\n0, & \\text{其它}\n\\end{cases}\n\n=\\begin{cases}\n\\frac{1}{6}t_0^3,\
    \ & 0\\le t_0 \\le 1, t_0 = u - u_i \\\\\n\\frac{1}{6}(-3t_1^3 + 3t_1^2 + 3t_1\
    \ + 1), & 0\\le t_1 \\le 1, t_1 = u - u_{i+1} \\\\\n\\frac{1}{6}(3t_2^3 - 6t_2^2\
