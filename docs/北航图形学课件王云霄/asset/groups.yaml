    \nC = k·2·S_z\n\nA = k·2·S_x\n\nB = k·2·S_y\n\n多边形在z=0平面上投影的面积S可如下求出：\n\n$$S=\\\
    frac{1}{2}\\sum_{i=1}^{n}(x_i-x_j)(y_i+y_j)$$\n\n式中若i=n则j=1，否则j=i+1。\n\n![](img/4628856fffb4db710a3ae3a299935a63_447_0.png)\n\
    \n(x1, y1)\n\n(x2, y2)\n\n(x3, y3)\n\nA1\n\nA2\n\nA3\n\n- A1 = \\frac{1}{2} (y1\
    \ + y2) (x1 - x2)\n- A2 = \\frac{1}{2} (y2 + y3) (x2 - x3)\nA1 + A2 + A3 = \\\
    frac{1}{2} (y1 + y3) (x3 - x1)\nS = \\frac{1}{2} [ (y1+y2)(x1-x2) + (y2+y3)(x2-x3)\
