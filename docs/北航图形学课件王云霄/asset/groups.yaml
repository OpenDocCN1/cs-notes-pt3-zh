  mdcn: "\n\n检查可按照下列五个步骤进行，每一步判断一种情况。\n\n- 1. 多边形的 x 坐标范围不重叠，因此多边形不重叠。QP\n- 2. 多边形的\
    \ y 坐标范围不重叠，因此多边形不重叠。QP\n- 3. P 完全位于 Q 的远离观察点的一侧。QP\n\n![](img/4628856fffb4db710a3ae3a299935a63_580_0.png)\n\
    \n- 4. Q 完全位于 P 的靠近观察点的一侧。QP\n\n![](img/4628856fffb4db710a3ae3a299935a63_581_0.png)\n\
