    \ |\n\n![](img/4628856fffb4db710a3ae3a299935a63_500_0.png)\n\n## 第七章 消除隐藏线和隐藏面的算法\n\
    \n消隐：面消隐、线消隐。\n\n假设：三维形体表示为多边形表面的集合。\n\n投影约定为沿着 $z$ 轴正向的正交投影。\n\n消除隐藏面算法：\n\n\
    - 图象空间算法\n- 客体空间算法\n\n- 图象空间算法对显示设备上每一个可分辨像素进行判断，看组成物体的多个多边形表面中哪一个在该像素上可见，即要对每一像素检查所有的表面。\n\
    - 客体空间算法把注意力集中在分析要显示形体各部分之间的关系上，这种算法对每一个组成形体的表面，都要与其他各表面进行比较，以便消去不可见的面或面的不可见部分。\n\
    \n### 第一节 线面比较法消除隐藏线\n\n- 多面体的面可见性\n- 对象：凸多面体\n- 可见面：朝向观察位置的面\n- 观察方向：由指向观察位置的一个方向向量\
    \ $k$ 给出，面的外法向量是 $n$，则这两个向量的夹角 $\\alpha$ 满足 $0 \\le \\alpha < \\pi/2$ 时，所考察面是可见的，否则就是不可见的。\n\
    \n把 $n$ 和 $k$ 记作 $\\mathbf{n}=(n_x,n_y,n_z)$，$\\mathbf{k}=(k_x,k_y,k_z)$，则\n\n\
    \\[\n\\cos\\alpha=\\frac{\\mathbf{n}\\cdot\\mathbf{k}}{|\\mathbf{n}|\\,|\\mathbf{k}|}=\\\
    frac{n_xk_x+n_yk_y+n_zk_z}{\\sqrt{n_x^2+n_y^2+n_z^2}\\,\\sqrt{k_x^2+k_y^2+k_z^2}}\n\
    \\]\n\n\\[\n\\Delta=n_xk_x+n_yk_y+n_zk_z\n\\]\n\n- $\\Delta>0$，$0\\le\\alpha<\\\
    pi/2$，面为可见。\n- $\\Delta<0$，$\\pi/2<\\alpha\\le\\pi$，面不可见。\n- $\\Delta=0$，$\\alpha=\\\
    pi/2$，面退化为线。\n\n设空间有一个四面体，顶点 $A,B,C,D$ 的坐标依次是 $(0,0,0)$，$(2,0,1)$，$(4,0,0)$，$(3,2,1)$。从\
    \ $z$ 轴正向无穷远处观察，求各面的可见性。观察方向向量是 $k=(0,0,1)$。\n\n![](img/4628856fffb4db710a3ae3a299935a63_506_0.png)\n\
    \n三角面 $DAB$ 的法向量是：\n\n\\[\n\\mathbf{n} = \\overrightarrow{DA} \\times \\overrightarrow{AB}\n\
    = (-3,-2,-1) \\times (2,0,1)\n= (-2,1,4)\n\\]\n\n因此，$\\mathbf{n}\\cdot\\mathbf{k}=4>0$，面\
    \ $DAB$ 为可见面。类似计算可知，面 $DBC$ 是可见面，面 $ADC$ 是不可见面，面 $ACB$ 退化为线。\n\n单个凸多面体——可见面上的线是可见线；多个凸多面体或非凸多面体——用上面的方法预处理，剩下可能可见面。\n\
    \n可能可见的棱线：在可见面上或与可见面有边界。\n\n线面比较法：（观察位置位于 $z$ 轴负方向无穷远处）\n\n0. 预处理，用外法线法判断出所有可能可见面。\n\
    \n思想：求出所有可能可见面，可能可见面上的线段是可能可见线。\n\n每一条可能可见线和每一个可能可见面比较：\n\n↓\n\n线段\n\n↓\n\n多边形表面\n\
    \n1. 范围检查（$x_v, y_v$ 方向）\n\n- ① 求出线段的投影：\n\n  $x_{\\min 1}, x_{\\max 1}, y_{\\\
