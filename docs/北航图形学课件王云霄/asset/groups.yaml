    operatorname{next}(Q_n) = Q_1$，$\\operatorname{pred}(Q_1) = Q_n$。\n\n### 倾角计算\n\
    \n记 $P$ 点坐标为 $(x_p, y_p)$，$O$ 点坐标为 $(x_0, y_0)$，这个角度数可如下简单地计算：\n\n\\[\nA = \\\
    frac{x_p - x_0}{\\sqrt{(x_p - x_0)^2 + (y_p - y_0)^2}} = \\cos\\theta\n\\]\n\n\
    \\[\nB = y_p - y_0\n\\]\n\n若 $B \\ge 0$，则角度数 $= 1 - A$（$0 \\le \\theta \\le 180^\\\
    circ$）；若 $B < 0$，则角度数 $= 3 + A$（$180^\\circ \\le \\theta \\le 360^\\circ$）。\n\n\
    $\\cos\\theta$ 在 I、II 象限递减，在 III、IV 象限递增。\n\n### 算法中 $v \\leftarrow \\operatorname{PRED}(v)$\
    \ 的作用：例子说明\n\n$P_0P_1P_2$ 左转，$P_1P_2P_3$ 右转，$P_0P_1P_3$ 右转。\n\n![](img/4628856fffb4db710a3ae3a299935a63_460_0.png)\n\
    \n### 2. Jarvis 行进算法\n\n思想：若相继两点构成的边是凸壳的一条边，则对于过该边的直线，所有点集中的点在该直线同侧。因此若找到 $pq$\
    \ 是壳上一边，则以 $q$ 为端点的下一条壳边 $qr$ 可以如下求出：计算点集中其余各点相对从 $q$ 点发出、沿向量 $pq$ 方向的射线的倾角，若倾角最小者对应的点是\
    \ $r$，则 $qr$ 是下一条壳边。\n\n第一条壳边的确定：把点集 $S$ 中所有点按 $x, y$ 字典式排序，取最低点。从该点引一条竖直向下的射线，在此做一个行进步就找到了第一条壳边。\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_462_0.png)\n\n- 3.【准备下次】若 $v_1 \\ne\
    \ v_0$，将 $v_1$ 送入 $Q$ 中；$S_1 = S - \\{u, v_1\\}$；$d \\leftarrow$ 从 $u$ 到 $v_1$\
    \ 的一个方向向量；$u \\leftarrow v_1$；返回步骤 2。\n- 4.【结束】将所有的壳顶点存入 $Q$ 中，算法结束。\n\n### 练习\n\
    \n- 1. 给定平面上的 $n$ 个点，找一个算法，使之成为简单多边形。\n- 2. 给定一个多边形，如何判断是否为凸多边形。\n\n## 第四节 包含与重叠\n\
    \n### 一、点对简单多边形的包含算法\n\n简单多边形是指平面上不相邻的边不能相交的多边形。\n\n设它用顶点坐标的逆时针序列 $(x_0, y_0),\
    \ (x_1, y_1), \\ldots, (x_{n-1}, y_{n-1})$ 确定。\n\n思想：由 $P$ 竖直向下引一条射线，计算此射线与多边形各边交点的个数。\n\
    \n- 奇数：$P$ 在多边形内部；\n- 偶数：$P$ 在多边形外部。\n\n![](img/4628856fffb4db710a3ae3a299935a63_466_0.png)\n\
    \n### 特殊情况处理：左闭右开\n\n即：当多边形一边的两个顶点的 $x$ 坐标都小于或等于点 $P$ 的 $x$ 坐标时，相应交点不计算在内（左闭）；边全部在射线右侧时，交点不计数（右开）。\n\
    \n![](img/4628856fffb4db710a3ae3a299935a63_467_0.png)\n\n注意：射线均为竖直向下。\n\n### 为了减少计算量，可判断不可能相交的情况\n\
    \n- （1）$x_p < x_i$ 且 $x_p < x_{i+1}$；\n- （2）$x_p \\ge x_i$ 且 $x_p \\ge x_{i+1}$；\n\
    - （3）$y_p < y_i$ 且 $y_p < y_{i+1}$。\n\n![](img/4628856fffb4db710a3ae3a299935a63_468_0.png)\n\
    \n算法中用 $m$ 代表奇偶性：初始 $m = -1$，$m \\leftarrow (-1) \\cdot m$。\n\n| 条件 | $m$ | 位置\
    \ |\n| --- | --- | --- |\n| $C$ 为偶数 | 负 | 点在多边形外部 |\n| $C$ 为奇数 | 正 | 点在多边形内部 |\n\
    \n### 简单多边形包含性检验的算法\n\n- 1.（准备）$x_n \\leftarrow x_0, y_n \\leftarrow y_0, m \\\
    leftarrow -1, i \\leftarrow 0$；\n- 2.（排除必不相交情形）若下列条件有一个成立，则转到 4。\n  - 2.1 $x_p\
    \ < x_i$ 且 $x_p < x_{i+1}$；\n  - 2.2 $x_p \\ge x_i$ 且 $x_p \\ge x_{i+1}$；\n  -\
    \ 2.3 $y_p < y_i$ 且 $y_p < y_{i+1}$；\n- 3.（计算交点）$y = y_i + \\dfrac{(x_p - x_i)(y_{i+1}\
    \ - y_i)}{x_{i+1} - x_i}$，分两种情形：\n  - （1）若 $y = y_p$，则点 $P$ 在多边形边界上，算法结束；\n  -\
    \ （2）若 $y < y_p$，则 $m \\leftarrow (-1) \\cdot m$；\n- 4.（结束判断）$i \\leftarrow i\
    \ + 1$，若 $i < n$，则返回到 2，否则算法结束。此时若 $m = -1$，则点 $P$ 在多边形外部；$m = 1$ 则在内部。\n\n###\
    \ 二、凸多边形的包含算法\n\n如何判断坐标为 $(x_p, y_p)$ 的点 $P$ 在直线的哪一侧？\n\n设直线的端点为 $(x_1, y_1)$\
    \ 和 $(x_2, y_2)$，直线方向是由 $(x_1, y_1)$ 到 $(x_2, y_2)$ 的方向。\n\n直线的方程记为 $Ax + By +\
    \ C = 0$，则有：\n\n\\[\nA = y_2 - y_1,\\quad B = x_1 - x_2,\\quad C = x_2 y_1 - x_1\
    \ y_2.\n\\]\n\n计算 $D$：\n\n\\[\nD = A x_p + B y_p + C.\n\\]\n\n- 若 **$D < 0$**，则点在直线**左侧**；\n\
    - 若 **$D > 0$**，则点在直线**右侧**；\n- 若 $D = 0$，则点在直线**上**。\n\n![](img/4628856fffb4db710a3ae3a299935a63_470_0.png)\n\
    \n### “折半查找”\n\n设算法的输入是一个凸多边形的顶点逆时针序列 $P_0, P_1, \\ldots, P_{n-1}$ 以及询问点 $P$，可进行如下包含性检验算法：\n\
    \n- 1.【准备】$i \\leftarrow 1$，$j \\leftarrow n - 1$；\n- 2.【查找是否结束】若 $j - i = 1$\
    \ 则到 4，否则继续；\n- 3.【折半查找】$k \\leftarrow \\lfloor (i + j) / 2 \\rfloor$，检查询问点相对直线\
    \ $P_0P_k$ 的位置关系，分三种情况：\n  - 3.1 点在直线上：若点在线段 $P_0P_k$ 上或内部，则点在原凸多边形内部；若点在线段 $P_0P_k$\
    \ 延长线上，则在原凸多边形外；输出回答后算法结束；\n  - 3.2 点在左侧：$i \\leftarrow k$，返回步 2；\n  - 3.3 点在右侧：$j\
    \ \\leftarrow k$，返回步 2。\n- 4.【最后检查】检查询问点 $P$ 对 $\\triangle P_0P_iP_j$ 的包含性，若在内则也在原凸多边形内部，若在外则也在原凸多边形外部，输出回答后算法结束。\n\
    \n**注：** 对点在三角形内的判断，三条边分别判断。\n\n"
