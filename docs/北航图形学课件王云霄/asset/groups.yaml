    \ $P_2$\n- $F(M)=0$ 时，$P_1$ 或 $P_2$ 任取一个即可，约定取 $P_2$\n\n### 构造判别式\n\n$$d=F(M)=F(x_i+1,y_i-0.5)$$\n\
    \n$$=(x_i+1)^2+(y_i-0.5)^2-R^2$$\n\n若 $d<0$，取 $P_1$ 作为下一个像素，而且再下一个像素的判别式为\n\n\
