    - 图形基元（输出图形元素）图形系统能产生的最基本图形\n- 线段、圆、多边形\n\n- 第一节 直线扫描转换算法\n- 第二节 圆的扫描转换算法\n- 第三节\
    \ 区域填充\n\n## 第一节 直线扫描转换算法\n\n- DDA直线扫描转换算法\n- 中点画线法\n- Bresenham画线算法\n\n![](img/4628856fffb4db710a3ae3a299935a63_32_0.png)\n\
    \n(x1,y1)\n\n(x2,y2)\n\nMpaint演示\n\n## 1. DDA线段扫描转换算法\n\n设待画线段两端点的坐标值（x1，y1）和（x2，y2），假定\
    \ x1<x2\n\ny=mx+b\n\nm=（y2−y1）/（x2−x1）\n\nb=（x2y1−x1y2）/（x2−x1）\n\n|m|≤1，对x每增1取允许的各整数值\n\
    \n```\n```cpp\nx=x1;\ny=y1;\nfor(int i=1;i<=e;i++)\n{\n\nSetPixel((int)(x+0.5),\
    \ (int)(y+0.5));\nx+=dx;\ny+=dy;\n}\n}\n```\n```\n\n## 中点画线法的实现：\n\n起点和终点分别为\n\
    （$x_0，y_0$）和（$x_1，y_1$）。\n\n$F(x，y)=ax+by+c=0$\n\n其中，$a=y_0-y_1$，$b=x_1-x_0$，$c=x_0y_1-x_1y_0$。\n\
    \n- 直线上的点，$F(x，y)=0$；\n- 直线上方的点，$F(x，y)>0$；\n- 直线下方的点，$F(x，y)<0$。\n\nP₂(xᵢ+1,\
    \ yᵢ+1)\n\nQ\n\nM\n\n(xᵢ, yᵢ)\n\nP₁(xᵢ+1, yᵢ)\n\n对每一个像素计算判别式$d$，根据它的符号确定下一像素。\n\
    $d\\ge 0$ 时，取正右方像素$P_1$，判断再下一个像素应取哪个，应计算\n$d_1 = F\\left( x_i+2\\ ,\\ y_i+0.5\
    \ \\right) = a\\left( x_i+2 \\right) + b\\left( y_i+0.5 \\right) +c = d + a$\n\
    故$d$的增量为$a$。\n而若$d<0$，则取右上方向素$P_2$。要判断再下一个像素，则要计算\n\nd₂ = F( xᵢ+2, yᵢ+1.5 )\n\
    = a( xᵢ+2 ) + b( yᵢ+1.5 ) + c\n= d + a + b\n\n故在第二种情况，d的增量为a + b\n\n再看d的初始值。显然，第一个元素应取左端点(x₀,\
    \ y₀)，相应的判别式值为\n\nd₀ = F(x₀ +1, y₀ +0.5)\n= (x₀ +1) + b(y₀ +0.5) + c\n= a x₀ +\
    \ b y₀ + c + a + 0.5b\n= F(x₀, y₀) + a + 0.5b\n但由于(x₀, y₀)在直线上，故 F(x₀, y₀)=0。\n\
    因此，d的初始值为 d₀ = a+0.5b\n\n考虑用2d来代替d的计算\n\n```\nvoid MidpointLine (int x0,int y0,int\
    \ x1,int y1)\n{\n    int a,b,delta1,delta2,d,x,y ;\n    a = y0 - y1;\n    b =\
    \ x1 - x0;\n    d = 2 * a + b ;\n    delta1 = 2 * a ;\n    delta2 = 2 * ( a +\
    \ b );\n    x = x0 ;\n    y = y0 ;\n    SetPixel(x,y);\n```\n\n```\nwhile( x<x1\
    \ )\n{\n    if( d<0 )\n    { x ++;\n      y ++;\n      d+= delta2;\n    }\n  \
    \  else\n    { x ++;\n      d+= delta1;\n    }\n    SetPixel(x,y);\n}\n}\n```\n\
    \n例:(0, 0)、(5, 2)  a = y₀ - y₁ = -2,\n b = x₁ - x₀ = 5, d₀ = 2 * a + b = 1,\n\
    \ delta1 = 2a = -4, delta2 = 2(a + b) = 6\n\n| x | y | d |\n|---|---|---|\n| 0\
    \ | 0 | 1 |\n| 1 | 0 | -3 |\n| 2 | 1 | 3 |\n| 3 | 1 | -1 |\n| 4 | 2 | 5 |\n| 5\
    \ | 2 | 1 |\n\n## 3. Bresenham画线算法\n\n斜率m在0到1之间，并且x₂ > x₁。设在第 i 步已经确定第 i 个像素点是\
    \ (xᵢ, yᵢ)，它是直线上点 (ẋᵢ, ẏᵢ) 的最接近位置，ẋᵢ = xᵢ，现在看第 i+1 步如何确定第 i+1 个像素点的位置。\n\n$d_1=y-\\\
    dot{y}_i=m(\\dot{x}_i+1)+b-\\dot{y}_i$\n\n$d_2=(\\dot{y}_i+1)-y=(\\dot{y}+1)-m(\\\
    dot{x}_i+1)-b$\n\n$d_1-d_2=2m(\\dot{x}_i+1)-2\\dot{y}_i+2b-1$\n\n$d_1>d_2$，下一个象素点取\
    \ $(\\dot{x}_i+1,\\dot{y}_i+1)$\n\n$d_1<d_2$，下一个象素点取 $(\\dot{x}_i+1,\\dot{y}_i)$\n\
    \n$d_1=d_2$，取两象素点中的任意一个\n\n$p_i = \\Delta x(d_1 - d_2)$\n\n$= 2\\Delta y \\cdot\
    \ \\dot{x}_i - 2\\Delta x \\cdot \\dot{y}_i + c$\n\n$p_{i+1} = 2\\Delta y \\cdot\
    \ \\dot{x}_{i+1} - 2\\Delta x \\cdot \\dot{y}_{i+1} + c$\n\n$p_{i+1} - p_i = 2\\\
    Delta y - 2\\Delta x(\\dot{y}_{i+1} - \\dot{y}_i)$\n\np_i ≥ 0 应取 ẏ_{i+1}=ẏ_i+1\n\
    \np_{i+1} = p_i + 2(Δy − Δx)\n\np_i < 0 应取 ẏ_{i+1}=ẏ_i\n\np_{i+1} = p_i + 2Δy\n\
    \n初始值确定P₁，\n\nẋ₁ = x₁, ẏ₁ = y₁ = (Δy / Δx) x₁ + b\n\n令 i=1，可计算求出：\n\np₁ = 2Δy\
    \ − Δx\n\n```\nvoid BresenhamLine(int x1,int y1,int x2,int y2)\n{\n    int x,y,dx,dy,p;\n\
    \    x=x1;\n    y=y1;\n    dx=x2-x1;\n    dy=y2-y1;\n    p=2*dy-dx;\n    for(;x<=x2;x++)\n\
    \    {\n\n```\n"
