    若本过程是第一次被调用, 则做:

    R₀←第一次求得的交点, 若Pᵢ在Qⱼ₋₁Qⱼ左则 t←i, 否则t←j;


    否则做:

    若Pᵢ在Qⱼ₋₁Qⱼ左, 则做:

    输出多边形Q上t至j-1各顶点, 输出当前交点, t←i;


    否则做:

    输出多边形P上t至i-1各顶点, 输出当前交点, t←j;


