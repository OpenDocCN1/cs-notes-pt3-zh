    \n图 3.25 区域编码\n\n## 2. 判别：\n\n(1)c1=c2=0, 完全可见，保留， AB\n\n(2)C1&C2!=0 完全不可见，舍弃\
    \ CD\n\n(3) 不满足(1)(2)可分为三种情况\n\n+   ① 一个端点在内另一个端点在外 EF\n\n+   ② 两个端点都在外，且直线段在外\
    \ JK\n\n+   ③ 两个端点都在外，但直线中部跨越窗口 HI\n\n图 3.26 Cohen-sutherland 裁剪算法的例子\n\n## 3.\
    \ 求交。\n\n# 求线段与窗口边界及其延长线的交点\n\ny−y1 / x−x1 = y2−y1 / x2−x1\n\n⇒ y = y1 + m(x −\
    \ x1)\n\n将 x = xl, x = xr ，代入上式，求出交点坐标\n\n## 4. 对剩下的子线段重复以上各步，从而完成对直线段的裁剪\n\n\
    ```\n```c\nif (c&1==1) {y=y0+(y2-y0)*(x1-x0)/(x2-x0); x=x1;}\nelse if (c&2==2)\
    \ {y=y0+(y2-y0)*(xr-x0)/(x2-x0);\n                    x=xr;}\nelse if (c&4==4)\
    \ {x=x0+(x2-x0)*(yb-y0)/(y2-y0);\n                    y=yb;}\nelse if (c&8==8)\
    \ {x=x0+(x2-x0)*(yt-y0)/(y2-y0);\n                    y=yt;}\nif (c==c1)\n{x0=x;\
    \ y0=y; makecode(x, y, c1);}\nelse\n    {x2=x; y2=y; makecode(x, y, c2);\n   \
    \ }\nshowline(x0, y0, x2, y2); //显示可见线段}\n```\n```\n\n```\nvoid makecode(double\
    \ x, y; int c)\n{\n    c=0;\n    if (x<xl) c=1;\n    else if (x>xr) c=2;\n   \
    \ if (y<yb) c=c+4;\n    else if (y>yt) c=c+8;\n}\n```\n\n![](img/4628856fffb4db710a3ae3a299935a63_223_0.png)\n\
    \n## 2. 中点分割算法\n\n**基本思想：** 可分成两个过程平行进行，\n从 p0 点出发找出离点 p0 最近的可见点，\n从 p1 点出发找出离点\
    \ p1 最近的可见点。\n这两个最近可见点的连线就是原直线段的可见部分。\n\n```\np0p1 → mid(p0, p1) = pm → mid(p0,\
    \ pm)\n　　　　　　　　　　　　→ mid(pm, p1)\n```\n\n+   1) 完全可见，绘制线段  \n2) 完全不可见：线段不绘制，舍弃\
    \  \n3) 求中点 pm，分割成 p0pm、pmp1，在分别进行判断\n　直到 \\(|p_m p_1| < \\varepsilon\\)\n\n![](img/4628856fffb4db710a3ae3a299935a63_225_0.png)\n\
    \n图 3.27 中点分割算法\n\n![](img/4628856fffb4db710a3ae3a299935a63_226_0.png)\n\n# 图\
    \ 3.28　中点分割算法框图\n\n## 3. 梁友栋-Barsky算法\n\n设要裁剪的直线段为P0P1, Pi的坐标为(xi, yi), i=0, 1。\
    \ P0P1和窗口边界交于A、B、C和D四个点。该算法的基本思想是从A、B和P0三点中找出最靠近P1的点，在图3.29中该点是P0。从C、D和P1点中找出最靠近P0的点，在图3.29中该点是点C。那么就是线段上的可见部分\n\
    \n# 写成参数方程： $P_0P_1$\n\n$x = x_0 + \\Delta x \\bullet t$\n\n$\\Delta x = x_1 -\
    \ x_0$\n\n$y = y_0 + \\Delta y \\bullet t$\n\n$\\Delta y = y_1 - y_0$\n\n把窗口边界的四条边分成两类，一类称为始边，另一类称为终边。\n\
    \n当 $\\Delta x \\ge 0 (\\Delta y \\ge 0)$ 时，称 $x = x_l (y = y_b)$ 为始边，$x = x_r\
    \ (y = y_t)$ 为终边。当 $\\Delta x < 0 (\\Delta y < 0)$ 时，则称 $x = x_r (y = y_t)$ 为始边，$x\
    \ = x_l (y = y_b)$ 为终边。\n\n求出P₀P₁和两条始边的交点的参数 t'₀ , t''₀\n令： t₀ = max(t'₀ , t''₀\
    \ ,0)\nt ∈ [t₀ , t₁]\n\n求出P₀P₁和两条终边的交点的参数 t'₁ , t''₁\n令： t₁ = min(t'₁ , t''₁ ,1)\n\
    \n当 t₁ > t₀ 时，参数方程中参数的线段就是的可见部分。当 t₀ > t₁ 时，整个直线段为不可见\n\n"
