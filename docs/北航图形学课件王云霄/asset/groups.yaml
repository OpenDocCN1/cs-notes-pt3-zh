    27. 三次等距B样条曲线，起点和终点分别是单位圆在x轴、y轴上的点，利用三角形的关系求出控制点。


    ## 第五章 图形运算


    ### 第一节 线段的交点计算


    #### 一、两条线段求交


    设有两线段 \(AB\) 和 \(CD\)，其端点坐标分别为 \((x_a,y_a)\)、\((x_b,y_b)\) 和 \((x_c,y_c)\)、\((x_d,y_d)\)，它们所在直线的参数方程分别为：


    $$

    \begin{cases}

    x=x_a+\lambda(x_b-x_a)\\

    y=y_a+\lambda(y_b-y_a)

    \end{cases}

    \qquad

    \begin{cases}

    x=x_c+\mu(x_d-x_c)\\

    y=y_c+\mu(y_d-y_c)

    \end{cases}

    $$


    若两线段相交，则交点的参数值应满足：


    $$

    \begin{cases}

    x=x_a+\lambda(x_b-x_a)=x_c+\mu(x_d-x_c)\\

    y=y_a+\lambda(y_b-y_a)=y_c+\mu(y_d-y_c)

    \end{cases}

    $$


    即


    $$

    \begin{cases}

    (x_b-x_a)\lambda-(x_d-x_c)\mu=x_c-x_a\\

    (y_b-y_a)\lambda-(y_d-y_c)\mu=y_c-y_a

    \end{cases}

    $$


    因此，若行列式


    $$

    \Delta=

    \begin{vmatrix}

    x_b-x_a & -(x_d-x_c)\\

    y_b-y_a & -(y_d-y_c)

    \end{vmatrix}

    =0

    $$


    表示两线段 \(AB\) 和 \(CD\) 重合或平行，一般作为它们不相交来处理。如果 \(\Delta\ne0\)，则可求出交点对应的两个参数值：


    $$

    \begin{cases}

    \lambda=\frac{1}{\Delta}

    \begin{vmatrix}

    x_c-x_a & -(x_d-x_c)\\

    y_c-y_a & -(y_d-y_c)

    \end{vmatrix}\\[4mm]

    \mu=\frac{1}{\Delta}

    \begin{vmatrix}

    x_b-x_a & x_c-x_a\\

    y_b-y_a & y_c-y_a

    \end{vmatrix}

    \end{cases}

    $$


    并且 \(0\le\lambda\le1\)，\(0\le\mu\le1\)。


    #### 两线段 \(AB\) 和 \(CD\) 交点的算法


    1.〔计算行列式〕

    \(\Delta \leftarrow (x_b-x_a)(y_c-y_d)-(x_c-x_d)(y_b-y_a)\)

    若 \(\Delta=0\)，则两线段重合或平行，可算作无交点，算法结束；


    2.〔计算交点参数〕

    \(\lambda \leftarrow \big((x_c-x_a)(y_c-y_d)-(x_c-x_d)(y_c-y_a)\big)/\Delta\)

    若 \(\lambda<0\) 或 \(\lambda>1\)，则无交点，算法结束；

    \(\mu \leftarrow \big((x_b-x_a)(y_c-y_a)-(x_c-x_a)(y_b-y_a)\big)/\Delta\)

    若 \(\mu<0\) 或 \(\mu>1\)，则无交点，算法结束；


    3.〔计算交点〕

    \(x \leftarrow x_a+\lambda(x_b-x_a)\)，\(y \leftarrow y_a+\lambda(y_b-y_a)\)，输出交点
    \((x,y)\) 后算法结束。


    #### 二、多条线段求交


    - ① 穷举法（很多线段不相交时，效率低，计算浪费）

    - ② 扫描线思想求交（高效算法只对有可能相交的两线段计算交点，对不可能相交的线段不计算交点）


    #### 定义关系


    线段之间是可比较的（两条线段与同一垂线有交点）。


    在 \(x\) 处的“上面”关系为：


    在 \(x\) 处，线段 \(S_1\) 在 \(S_2\) 的上面，记为 \(S_1>_x S_2\)，如果在 \(x\) 处可比较，且 \(S_1\)
    与垂直线的交点位于 \(S_2\) 与垂直线的交点的上面。

