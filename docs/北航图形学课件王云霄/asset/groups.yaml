  - '[PAGE 20]


    # ① 基本概念（性能指标）


    +   a. 像素 (pixel)： 屏幕上可以点亮或熄灭的最小单位

    +   b. 分辨率 (resolution)： 显示屏上像素的总数，常用每行的像素数与行数的乘积表示

    +   c. 颜色或者亮度等级


    # ② 帧存储器: 二维矩阵，帧存大小=分辨率×单元字节


    存储屏幕上每个像素对应的颜色或亮度值


    ![](img/4628856fffb4db710a3ae3a299935a63_20_0.png)


    光栅扫描显示结构图'
  - '[PAGE 21]


    # ③工作过程（从左到右，自上而下的扫描过程）


    ![](img/4628856fffb4db710a3ae3a299935a63_21_0.png)


    +   i： 开始x←0,y←ymax

    +   帧存储器（x,y）位置的值被取出，设置CRT强度值，同时(x,y)控制电子束偏转


    +   ii： x←x+1,处理下一个像素，直到处理完该行最后一个像素（x=xmax）


    +   iii： x←0, y←y-1,处理下一行，重复执行直到最下面一条扫描线处理完


    +   iv： 回到开始处，刷新过程重复开始'
  - '[PAGE 22]


    # 4.等离子显示器PDP (Plasma Display Panel)


    等离子显示屏：利用气体放电的显示装置，由三层玻璃板组成，在第一层的里面涂有导电材料的垂直条，中间层是灯泡阵列，第三层表面涂有导电材料的水平条。


    ![](img/4628856fffb4db710a3ae3a299935a63_22_0.png)'
  - '[PAGE 23]


    每个像素由一个等离子管构成，大量等离子管排列构成屏幕


    内充有氖氙气体


    加高压


    放电空间内的混合气体发生等离子体放电产生紫外光


    激活屏幕显示屏上红绿蓝三基色荧光粉而发光


    独立的荧光粉像素发光


    低电压维持发光（不用刷新存储器）'
  - '[PAGE 24]


    +   优点：

    +   1. 高亮度、高对比度

    +   2. 纯平面图像无扭曲（CRT边缘的扫描速度不均匀，很难控制到不失真的水平）

    +   3. 超薄设计、超宽视角

    +   4. 具有良好的防电磁干扰功能。（显示原理不需要借助于电磁场）

    +   5. 环保无辐射


    +   缺点：

    +   1. 耗电量大

    +   2. 画质随时间递减

    +   3. 散热环境需良好

    +   4. 使用寿命较短'
  md: '

    ## 计算机图形学


    授课教师：王云霞


    Email: w_yunxiao@yahoo.com.cn


    QQ：63114592


    计算机图形学是研究通过计算机将数据转换为图形，并在专门显示设备上显示的原理、方法和技术的学科。（确切）


    计算机生成图形的过程: 对象→模型→图形


    (1)根据对象建立对象的模型(建模)


    模型：能够正确地表达出一个对象性质、结构和行为的所有描述信息。


    (2)利用计算机对这个模型进行必要的处理,产生能正确反映对象的某种性质的图形输出。


    ### 3. 图象处理是指用计算机来改善图象质量的数字技术.


    - (1) 如何消除噪声 (去噪)

    - (2) 压缩图像数据以便于传输和存贮

    - (3) 用对比增强技术突出图像中的某些特征

    - (4) 用复原技术使模糊的图像清晰

    - (5) 从CT信息重建二维、三维图像


    ### 4. 模式识别是指用计算机对输入图形进行识别的技术。


    特征提取、统计判定法或者语法分析法


    (人像, 指纹, 味觉, 声音, 虹膜, 血管识别)


    ### 5.三者之间的关系


    ![](img/4628856fffb4db710a3ae3a299935a63_5_0.png)


    ### 6. 与计算机图形学关系密切的学科


    (1) 计算几何学 是研究几何模型和数据处理的学科。

    曲线曲面的构造, 三维立体造型, 拼接


    (2) 交互式计算机图形学 是指用计算机交互式地产生图形的技术。


    交互设备是实现交互技术，完成交互任务的基础。


    交互设备有定位、键盘、选择、取值和拾取。


    交互任务是用户输入到计算机的一个单元信息，基本任务有四种：定位、字串、选择、取数。


    ### 第二节  计算机图形学的起源


    - 1. 早期:打印机


    1950年 与麻省理工学院的旋风计算机相连的显示器


    产生了简单的图形


    第一台图形显示器的诞生


    阴极射线管(CRT)


    当时的计算机图形学称为"被动式"图形学


    - 2. 50年代末期  MIT的林肯实验室在"旋风"机上开发的


    SAGE空中防御系统


    第一次使用了具有指挥和控制功能的CRT显示器(用笔在屏幕上指出目标)


    交互式计算机图形学的诞生


    //Interactive Computer Graphics


    - 3. 1962年 MIT Ivan E Sutherland发表了博士论文


    "sketchpad 人-机图形通信系统


    首次使用" Computer Graphics "术语, 为计算机图形学奠定了基础


    证明交互式计算机图形学有前途的研究领域


    - 4. 60年代中期


    国际大公司(通用, 贝尔等)研究计算机图形显示


    计算机图形学的黄金时代


    - 5. 70年代


    计算机图形学广泛应用 (CAD, 教育等)


    - 6. 80年代


    应用领域 (工业, 管理, 艺术), 进入家庭


    - 7. 90年代 科学计算可视化, 虚拟现实VR的应用


    ### 第三节 计算机图形学的应用及发展趋势


    ### 1. 计算机图形学的主要应用领域


    - (1) 用户接口 (软件人性化设计)

    - (2) CAD/CAM. (精确易修改)

    - (3) 计算机仿真与动画 (电影特技和飞行员的太空模拟驾驶舱)

    - (4) 制图学方面 (人口分布图, 气象图, 股票走势图等)

    - (5) 过程控制 (铁路, 机场调度)

    - (6) 办公自动化 (多媒体技术, 可视电话, 视频会议)

    - (7) 艺术模拟 (艺术创作, 传统油画, 中国国画, 书法等)

    - (8) 科学计算可视化 (科学计算结果图形化)

    - (9) 虚拟现实 (虚拟校园模拟)

    - (10) 教育领域


    Low poly modelling

    with edit mesh / edit poly,

    and meshsmooth with creasing.

    (untextured)


    Glenn Melenhorst


    3ds max™


    ### 2. 图形学主要研究内容


    - (1) 图形的生成和表示技术

    - (2) 图形的操作与处理方法

    - (3) 图形输出设备与输出技术的研究

    - (4) 图形输入设备、交互技术及用户接口技术的研究

    - (5) 图形信息的数据结构及存储、检索方法

    - (6) 几何模型构造技术(造型, 颅骨"克隆"技术)

    - (7) 动画技术 3DMAX, FLASH

    - (8) 图形软硬件的系列化、模块化和标准化的研究

    - (9) 科学计算的可视化


    ### 第四节 图形系统的硬件


    - 1. 计算机图形系统的硬件组成


    计算机、显示处理器 (DPU)、图形显示器、输入设备和硬拷贝设备


    - 2. CRT (Cathode Ray Tube) 显示器工作原理图


    ![](img/4628856fffb4db710a3ae3a299935a63_15_0.png)


    电子枪(Electron gun)、偏转线圈(Deflection coils)、荫罩(Shadow mask)、荧光粉层(phosphor)和玻璃外壳（荧光屏）五部分组成


    ![](img/4628856fffb4db710a3ae3a299935a63_16_0.png)


    CRT显示器工作原理示意图


    - ① 阴极：被加热时发射电子

    - ② 控制极：控制电子束的偏转方向和运动速度

    - ③ 聚焦极：保证电子束在轰击屏幕时汇聚成很细的点

    - ④ 加速极：产生高速电子束

    - ⑤ 偏转线圈：控制电子束在屏幕上的运动轨迹

    - ⑥ 荧光粉层：被电子束轰击时发光


    荧光屏上涂满了按一定方式紧密排列的红、绿、蓝三种颜色的荧光粉点或粉条，称为荧光粉单元，相邻的红绿蓝荧光粉单元各一个为一组，称之为像素，每个像素都拥有红绿蓝三原色。三个电子束分别受电脑显卡R、G、B三个基色视频信号电压的控制，去轰击各自的荧光粉单元


    ### 3. CRT显示器工作方式


    - (1) 随机扫描方式（画线显示器, 矢量显示器）

    - (2) 光栅扫描方式


    ![](img/4628856fffb4db710a3ae3a299935a63_19_0.png)


    ![](img/4628856fffb4db710a3ae3a299935a63_19_1.png)


    ![](img/4628856fffb4db710a3ae3a299935a63_19_2.png)


    随机扫描


    光栅扫描


    光栅扫描


    ### ① 基本概念（性能指标）


    - a. 像素 (pixel)： 屏幕上可以点亮或熄灭的最小单位

    - b. 分辨率 (resolution)： 显示屏上像素的总数，常用每行的像素数与行数的乘积表示

    - c. 颜色或者亮度等级


    ### ② 帧存储器: 二维矩阵，帧存大小=分辨率×单元字节


    存储屏幕上每个像素对应的颜色或亮度值


    ![](img/4628856fffb4db710a3ae3a299935a63_20_0.png)


    光栅扫描显示结构图


    ### ③工作过程（从左到右，自上而下的扫描过程）


    ![](img/4628856fffb4db710a3ae3a299935a63_21_0.png)


    - i： 开始x←0,y←ymax。帧存储器（x,y）位置的值被取出，设置CRT强度值，同时(x,y)控制电子束偏转

    - ii： x←x+1,处理下一个像素，直到处理完该行最后一个像素（x=xmax）

    - iii： x←0, y←y-1,处理下一行，重复执行直到最下面一条扫描线处理完

    - iv： 回到开始处，刷新过程重复开始


    ### 4.等离子显示器PDP (Plasma Display Panel)


    等离子显示屏：利用气体放电的显示装置，由三层玻璃板组成，在第一层的里面涂有导电材料的垂直条，中间层是灯泡阵列，第三层表面涂有导电材料的水平条。


    ![](img/4628856fffb4db710a3ae3a299935a63_22_0.png)


    每个像素由一个等离子管构成，大量等离子管排列构成屏幕


    内充有氖氙气体


    加高压


    放电空间内的混合气体发生等离子体放电产生紫外光


    激活屏幕显示屏上红绿蓝三基色荧光粉而发光


    独立的荧光粉像素发光


    低电压维持发光（不用刷新存储器）


    - 优点：

    - 1. 高亮度、高对比度

    - 2. 纯平面图像无扭曲（CRT边缘的扫描速度不均匀，很难控制到不失真的水平）

    - 3. 超薄设计、超宽视角

