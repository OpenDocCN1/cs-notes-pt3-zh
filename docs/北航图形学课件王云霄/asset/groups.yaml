    \ 0\\le t_3 \\le 1, t_3 = u - u_{i+3} \\\\\n0, & \\text{其它}\n\\end{cases}\n\n\
    # 如果固定在 $u_{i+3} \\leqslant u \\leqslant u_{i+4}$ 区间，可以写出：\n\nN_{i,4}(u) = \\\
    frac{1}{6}(-t_3 + 1)^3\n\nN_{i+1,4}(u) = \\frac{1}{6}(3t_3^3 - 6t_3^2 + 4)\n\n\
    N_{i+2,4}(u) = \\frac{1}{6}(-3t_3^3 + 3t_3^2 + 3t_3 + 1)\n\nN_{i+3,4}(u) = \\\
