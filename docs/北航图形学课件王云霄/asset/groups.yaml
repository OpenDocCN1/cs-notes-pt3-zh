    cdot 01+f_1(w)\\cdot f_1(u)\\cdot 11$\n\n其中 $f_0(u)+f_1(u)=1,\\ 0\\leq u\\leq\
    \ 1,$\n\n$\\quad\\quad\\quad f_0(w)+f_1(w)=1,\\ 0\\leq w\\leq 1$\n\n### P₁(u,w)\n\
    \n### P₂(u,w)\n\n### P₃(u,w)\n\n### P(u,w)\n\n例如我们来验证0w是它的一条边界线，这只要把u=0代入公式右端，得\n\
    \n右端 = 00·f₀(w) + 01·f₁(w) + 0w\n− 00·f₀(w) − 01·f₁(w) = 0w\n\n## 问题2：\n\n①边界线为指定曲线\n\
    \n②具有指定的跨界切向量。\n\n应用上节定义的四个混合函数 $q_{00}(u)$，$q_{01}(u)$，$q_{10}(u)$，$q_{11}(u)$。\n\
    \n- $q_{00}(u)=2u^3-3u^2+1$\n- $q_{01}(u)=-2u^3+3u^2$\n- $q_{10}(u)=u^3-2u^2+u$\n\
    - $q_{11}(u)=u^3-u^2$\n\n这四个函数均是三次多项式。故连续可微，并且还满足下面的条件：\n\n$$\\begin{cases}\n\
    q_{00}(0)=1\\\\\nq_{01}(0)=0\\\\\nq_{10}(0)=0\\\\\nq_{11}(0)=0\n\\end{cases}\n\
    \\qquad\n\\begin{cases}\nq_{00}(1)=0\\\\\nq_{01}(1)=1\\\\\nq_{10}(1)=0\\\\\nq_{11}(1)=0\n\
    \\end{cases}$$\n\n$$\\begin{cases}\nq'_{00}(0)=0\\\\\nq'_{01}(0)=0\\\\\nq'_{10}(0)=1\\\
    \\\nq'_{11}(0)=0\n\\end{cases}\n\\qquad\n\\begin{cases}\nq'_{00}(1)=0\\\\\nq'_{01}(1)=0\\\
    \\\nq'_{10}(1)=0\\\\\nq'_{11}(1)=1\n\\end{cases}$$\n\n设已知四条边界曲线 $\\omega_0$、$\\\
    omega_1$、$0_w$、$1_w$ 及沿这四条边界曲线的跨界切向量 $\\omega_{w}$、$\\omega_{u}$、$0_{w,u}$、$1_{w,u}$。\n\
    \n求出四个角点的位置向量 $00$、$01$、$10$、$11$，切向量 $00_w$、$01_w$、$10_w$、$11_w$、$00_u$、$01_u$、$10_u$、$11_u$，扭曲向量\
    \ $00_{uw}$、$01_{uw}$、$10_{uw}$、$11_{uw}$。\n\n写出符合要求曲面的数学表达式如下：\n\n$$uw=[u_0,u_1,u_0',u_1']_{w',w}\\\
    begin{bmatrix}q_{00}(w)\\\\q_{01}(w)\\\\q_{10}(w)\\\\q_{11}(w)\\end{bmatrix}+[0_w,1_w,0_w,1_w]_{u',u}\\\
    begin{bmatrix}q_{00}(u)\\\\q_{01}(u)\\\\q_{10}(u)\\\\q_{11}(u)\\end{bmatrix}-[q_{00}(u),q_{01}(u),q_{10}(u),q_{11}(u)]\\\
    cdot M\\cdot\\begin{bmatrix}q_{00}(w)\\\\q_{01}(w)\\\\q_{10}(w)\\\\q_{11}(w)\\\
    end{bmatrix}$$\n\nM = \\begin{bmatrix} 00 & 01 & 00_{w} & 01_{w} \\\\ 10 & 11\
    \ & 10_{w} & 11_{w} \\\\ 00_{u} & 01_{u} & 00_{uw} & 01_{uw} \\\\ 10_{u} & 11_{u}\
    \ & 10_{uw} & 11_{uw} \\end{bmatrix}\n\n## 验证通过边界0w\n\n右端 = 00·q₀₀(w) + 01·q₀₁(w)\n\
    \    + 00_w·q₁₀(w) + 01_w·q₁₁(w) + 0w\n    − 00·q₀₀(w) − 01·q₀₁(w)\n    − 00_w·q₁₀(w)\
    \ − 01_w·q₁₁(w) + 0w\n    = 0w\n\n## 验证满足跨界切向量 $\\mathbf{0}_{wu}$：\n\n右端 $=[00\\\
    \ _u\\quad 01\\ _u\\quad 00\\ _{uw}\\quad 01\\ _{uw}]\\begin{bmatrix}q_{00}(w)\\\
    \\q_{01}(w)\\\\q_{10}(w)\\\\q_{11}(w)\\end{bmatrix}$\n\n$+[0w\\quad 1w\\quad 0w\\\
    \ _u\\quad 1w\\ _u]\\begin{bmatrix}0\\\\0\\\\1\\\\0\\end{bmatrix}$\n\n$-[0\\quad\
    \ 0\\quad 1\\quad 0]M\\begin{bmatrix}q_{00}(w)\\\\q_{01}(w)\\\\q_{10}(w)\\\\q_{11}(w)\\\
    end{bmatrix}$\n\n$=0w\\ _u$\n\n## 问题3： 指定四个角点以及在这些点上的切向量和扭曲向量后，求解曲面的表达式。\n\n计算求得四个角点的位置向量00，01，10，11，切向量00_w，01_w，10_w，11_w，00_u，01_u，10_u，11_u，以及扭曲向量00_uw，01_uw，10_uw，11_uw。\n\
    \n已知角点位置向量00，10以及在这两点关于u的切向量00_u和01_u，可以用Hermite插值公式来指定一条边界线：\n\nu0 = 00·q00(u)\
    \ + 10·q01(u)\n+ 00_u·q10(u) + 10_u·q11(u)\nu1 = 01·q00(u) + 11·q01(u)\n+ 01_u·q10(u)\
    \ + 11_u·q11(u)\n\nu0_w = 00_w · q_00(u) + 10_w · q_01(u)\n    + 00_uw · q_10(u)\
    \ + 10_uw · q_11(u)\n\nu1_w = 01_w · q_00(u) + 11_w · q_01(u)\n    + 01_uw · q_10(u)\
    \ + 11_uw · q_11(u)\n\n$$[u_0\\quad u_1\\quad u_{0_w}\\quad u_{1_w}] = [q_{00}(u)\\\
    quad q_{01}(u)\\quad q_{10}(u)\\quad q_{11}(u)]\\cdot M$$\n\n$$M=\\begin{bmatrix}\
    \ 00 & 01 & 00_w & 01_w \\\\ 10 & 11 & 10_w & 11_w \\\\ 00_u & 01_u & 00_{uw}\
    \ & 01_{uw} \\\\ 10_u & 11_u & 10_{uw} & 11_{uw} \\end{bmatrix}$$\n\nuw = [q₀₀(u)\
    \  q₀₁(u)  q₁₀(u)  q₁₁(u)] · M · [q₀₀(w) q₀₁(w) q₁₀(w) q₁₁(w)]ᵀ\n\n= [u³  u² \
    \ u  1] ⎡ 2  -2  1  1 ⎤\n                ⎢-3   3 -2 -1 ⎥\n                ⎢ 0\
    \   0  1  0 ⎥\n                ⎣ 1   0  0  0 ⎦\n\n· ⎡ 00   01   00_w  01_w ⎤ ⎡\
    \ 2  -3  0  1 ⎤ ⎡ w³ ⎤\n  ⎢ 10   11   10_w  11_w ⎥ ⎢-2   3  0  0 ⎥ ⎢ w² ⎥\n  ⎢\
    \ 00_u 01_u 00_uw 01_uw⎥ ⎢ 1  -2  1  0 ⎥ ⎢ w  ⎥\n  ⎣ 10_u 11_u 10_uw 11_uw⎦ ⎣\
    \ 1  -1  0  0 ⎦ ⎣ 1  ⎦\n\n= [u³  u²  u  1] · H · M · Hᵀ · [w³  w²  w  1]ᵀ\n"
  mdcn: "\n\n## Constructing Surface Patches with Specified Boundary Curves:\n\nA\
