    # 二、多边形的扫描转换算法


    “奇偶”性质：即一条直线与任意封闭的曲线相交时，总是从第一个交点进入内部，再从第二个交点退出，以下交替的进入退出，即奇数次进入，偶数次退出。当然可能有一些“相切”的点应特殊处理。


    # 扫描转换法步骤：


    +   1. 找出扫描线与多边形边界线的所有交点；

    +   2. 按 x 坐标增加顺序对交点排序；

    +   3. 在交点对之间进行填充。（偶数）'
