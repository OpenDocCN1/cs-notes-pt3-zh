    \ 0 ≤ t ≤ 1\n\n### 3. 三次Bezier曲线光滑拼接的条件\n\nP₀P₁P₂P₃和Q₀Q₁Q₂Q₃，两个Bezier多边形\n\n-\
    \ ① 曲线在连接点处C⁰连续的条件是P₃=Q₀\n\n- ② 曲线在连接点处G¹连续，Q'₀=aP'₃\n\nQ'₀=3(Q₁-Q₀)， P'₃=3(P₃-P₂)，Q₁-Q₀=a(P₃-P₂)\n\
    \n于是知, P''(1)=6P₁−12P₂+6P₃, Q''(0)=6Q₀−12Q₁+6Q₂\n\n要求, P''(1)=Q''(0)即 Q₀−2Q₁+Q₂=P₃−2P₂+P₁\n\
    \n注意到Q₀=P₃, 由此得：\n\nQ₂−P₁=2(Q₁−P₂)⇒Q₁P₂//Q₂P₁且|Q₁P₂|=½|Q₂P₁|\n\n![](img/4628856fffb4db710a3ae3a299935a63_350_0.png)\n\
    \n### 4. Bezier 曲线绘制\n\n### ①利用定义式\n\nBezier曲线的绘制，可以利用其定义式，对参数选取足够多的值，计算曲线上的一些点，然后用折线连接来近似画出实际的曲线。随着选取点增多，折线和曲线可以任意接近。假设给定的四个型值点是\
