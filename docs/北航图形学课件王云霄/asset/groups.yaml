  - '[PAGE 528]


    Z-Buffer算法优点：

    在像素级上以近物取代远物。形体在屏幕上的出现顺序是无关紧要的。这种取代方法实现起来远比总体排序灵活简单，有利于硬件实现。

    Z-Buffer算法缺点：占用空间大，没有利用图形的相关性与连续性。需要开一个与图象大小相等的缓存数组ZB。


    改进算法:只用一个深度缓存变量zb。'
