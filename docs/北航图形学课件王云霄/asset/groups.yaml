    +   (1) 如何消除噪声 (去噪)

    +   (2) 压缩图像数据以便于传输和存贮

    +   (3) 用对比增强技术突出图像中的某些特征

    +   (4) 用复原技术使模糊的图像清晰

    +   (5) 从CT信息重建二维 三维图像


    # 4. 模式识别是指用计算机对输入图形进行识别的技术。


    特征提取

    统计判定法或者语法分析法


