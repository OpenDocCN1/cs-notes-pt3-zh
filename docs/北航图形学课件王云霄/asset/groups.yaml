  - '[PAGE 453]


    A(x₁+(x₂-x₁)t)+B(y₁+(y₂-y₁)t)+C(z₁+(z₂-z₁)t)+D=0

    [A(x₂-x₁)+B(y₂-y₁)+C(z₂-z₁)]t=-(Ax₁+By₁+Cz₁+D)

    若A(x₂-x₁)+B(y₂-y₁)+C(z₂-z₁)=0

    即（A,B,C）和（x₂-x₁,y₂-y₁,z₂-z₁）点积为零 则所给线段在平面上或与平面平行,没有唯一确定的交点。


    否则,交点对应的参数t可以求出：


    t = - (Ax₁ + By₁ + Cz₁ + D) / [A(x2 - x1) + B(y2 - y1) + C(z2 - z1)]


    若t<0或t>1,交点在线段延长线上，没有交点


    若0≤t≤1，将参数t代回直线的参数方程求出交点的坐标'
  - '[PAGE 454]


    # 第三节 平面中的凸壳算法


    凸壳 包含一个平面点集的最小凸区域


    凸区域指要求区域内任意两点的连线仍在该区域内。


    设S是平面上n个点的集合，则S的凸壳是一个凸多边形，它包含所有n点且面积最小。


    求点集S的凸壳：


    +   1） 在S中选出壳上的点


    +   2） 给出围成凸多边形的序列。'
  - '[PAGE 455]


    # 1. Graham扫描算法


    思想：设有一点O，设为原点，对点集S中所有的点计算与OX轴的倾角，并按照倾角递增排序，若某一点不是凸顶点，则它必然在两个壳顶点与点O形成的三角形内部，则删除这个内点。


    Graham扫描的实质是围绕已经按“倾角”排序的各顶点进行一次扫描，在扫描过程中消去在凸壳内部的点，留下以希望次序排列的壳顶点。'
  - '[PAGE 456]


    ![](img/4628856fffb4db710a3ae3a299935a63_456_0.png)


    由于是按倾角递增排序，可知若连续三个顶点P₁, P₂, P₃是一个“右转”，则P₂是一个应去掉的内点。'
  - "[PAGE 457]\n\n对给出的三点P₁, P₂, P₃，设它们的坐标是 (x₁, y₁), (x₂, y₂), (x₃, y₃)，这时要判断三点在\
    \ P₂处形成一个右转还是左转，可以计算下面的行列式\n\nΔ = | x₁ y₁ 1 |\n    | x₂ y₂ 1 |\n    | x₃ y₃ 1\
    \ |\n\n其中△给出的是带有正负号的三角形P₁P₂P₃面积的2倍，因此若△>0，则P₁, P₂, P₃是左转； △ <0，则是右转； △ =0，则三点共线。"
  - '[PAGE 458]


    # Graham扫描算法


    +   1. 【倾角排序】确定O点，设想有一条从O出发水平向右的射线OX，对S中其余各点P计算相对于OX的倾角POX，之后按倾角递增排序，得到点序列Q₁=O，Q₂，Q₃…，Qₙ；


    +   2. 【准备扫描】v←Q₁；


    +   3. 【扫描】

    +   if NEXT(v)=Q1，算法结束，序列中剩余的点就是凸壳上的顶点

    +   else if v、NEXT(v)、NEXT(NEXT(v))形成一个左转

    +   　　then v←NEXT(v)

    +   　　else 删除NEXT(v)，v←PRED(v)；

    +   goto 3.


    next(v)：返回点序列中的v的下一个点（后继节点）

    pred(v)：返回点序列中的v的前一个点（前驱节点）

    循环链表 next(Qn)=Q1，pred(Q1)=Qn'
  - '[PAGE 459]


    # 倾角计算


    记P点坐标为(Xp, Yp)，O点坐标(X₀, Y₀)，这个角度数可如下简单地计算：


    A = (x_p - x_0) / sqrt((x_p - x_0)^2 + (y_p - y_0)^2) = cosθ


    B = y_p - y_0


    若B ≥ 0 则角度数 = 1 - A （0 ≤ θ ≤ 180°）


    若B < 0 则角度数 = 3 + A。 （180° ≤ θ ≤ 360°）


    cos θ 在 I II 象限递减，在 III IV 象限递增'
