    \ yn, zn), 求所确定的平面方程。\n\nA = 1/2 Σ_{i=1}^{n} (y_i - y_j)(z_i + z_j)\nB = 1/2 Σ_{i=1}^{n}\
    \ (z_i - z_j)(x_i + x_j)\nC = 1/2 Σ_{i=1}^{n} (x_i - x_j)(y_i + y_j)\n\nD = -A\
    \ x1 - B y1 - C z1\n\n式中若 i = n, 则 j = 1, 否则 j = i + 1\n\n## 2. 平面方程的求交\n\n$A_1x+B_1y+C_1z+D_1=0$\
    \  \n$A_2x+B_2y+C_2z+D_2=0$\n\n$\\frac{A_1}{A_2}=\\frac{B_1}{B_2}=\\frac{C_1}{C_2}$　两平面**重合或平行**，一般算没有交点\n\
    \n## 3. 确定交线同时在两个多边形内部的部分\n\n分别对每个多边形表面各边相应的线段，计算它与另一个多边形表面所在平面的交点。\n\n**注意：**\
    \ 求线段（有限）与平面（无限）的交点，即交点在线段延长线上时算不相交。\n\n假定两个多边形表面都是凸的，故共可以交出**四个交点**。\n"
  mdcn: "\n\n![](img/4628856fffb4db710a3ae3a299935a63_431_0.png)\n\n其中，$S_2 >_{\\\
    mu} S_4$，$S_1 >_{\\nu} S_2$，$S_2 >_{\\nu} S_4$，$S_1 >_{\\nu} S_4$。\n\n## 假设：为简便起见，要求交点的n条线段中没有垂直的线段，也没有三条以上的线段交于一点的情况\n\
    \n## 两线段相交的必要条件：\n\n若两线段相交，则必然存在某个x，使它们在规定的次序关系 >x 下是相邻的。\n\n从左向右扫描线变化，线段之间的种次序关系只能有三种可能的变化方式：\n\
    \n- 1. 遇见某条线段S的左端点，此时S应加入次序关系。\n- 2. 遇见某线段S的右端点，此时S应从次序关系中删除。\n- 3. 遇到某两条线段S₁和S₂\
    \ 的交点，这时在次序关系中S₁和S₂交换位置。\n\n## 算法的数据结构和实现过程：\n\n扫描线状态表L：存放按次序关系>ₓ排序的线段的序列。初始为空，扫描过程中当关系>ₓ改变时变化。\n\
    \n事件点进度表E：存放事件点的表，初始为n条线段的2n个端点，计算的交点插入该表。\n\n事件点：扫描过程中可能使次序关系>ₓ发生变化的点，\n\n##\
    \ 扫描线状态表应能支持以下四个操作：\n\n- (1) INSERT (S, L)，把线段S插入到扫描线状态表L中，注意应插入到适当位置以保持正确的次序关系。\n\
    - (2) DELETE (S, L)，从L中删除线段S。\n- (3) ABOVE (S, L)，返回次序关系中S上面紧接着的线段的编号。\n- (4)\
    \ BELOW (S, L)，返回次序关系中S下面紧接着的线段的编号。\n\n## 事件点进度表E应能支持以下三个操作：\n\n(1) MIN(E)，取出表E中的最小元素。\n\
    \n(2) INSERT(x, E)，把横坐标为x的一个点插入到表E中，插入要使E中事件点存放保持递增次序。\n\n(3) MEMBER(x, E)，判定横坐标为x的点是否在事件点进度表E中。\n\
    \n## 算法：\n\n- 1. 初始化E表：n条线段的2n个端点按x,y字典式排序后存放于表E中；\n- 2. A←∅；{A是一个集合，初为空，准备存入找到的交点；}\n\
    - 3. 若表E不为空，则进行3.1~3.3循环。表E为空时算法结束。\n- 3.1　P←MIN(E)；\n- 3.2　考查当前事件点P，分三种情况：\n\n\
    (1) 若P是边S的左端点,则做： INSERT(S,L);\nS₁=ABOVE(S,L);\nS₂=BELOW(S,L);\n若S和S₁相交,则求出的交点送入集合A中;\n\
    若S和S₂相交,则求出的交点送入集合A中;\ngoto 3.3\n\n(2) 若P是边S的右端点,则做：\nS₁=ABOVE(S,L);\nS₂=BELOW(S,L);\n\
    若S₁和S₂相交于点P的右边,则求出的交点送入集合A中;\nDELETE(S,L);\ngoto 3.3\n\n(3) 若P是边S₁和S₂的交点，且在P的左边S₁=ABOVE(S₂)，则做\n\
    S₃=ABOVE(S₁,L)；\nS₄=BELOW(S₂,L)；\n若S₃和S₂相交，则求出的交点送入集合A中；\n若S₄和S₁相交，则求出的交点送入集合A中；\n\
    在L中交换S₁和S₂的位置；\nGoto 3.3\n\n3.3 若集合A不为空，做下面循环，直至A为空：\n取出集合A中一个交点，其横坐标是x；\n若MEMBER(x,E)为FALSE，则输出此交点，并做INSERT(x,E)；\n\
    （交点是不是第一次求得）\n\n设有三条线段S₁，S₂，S₃，它们的坐标如下\n(1, 1)，(5, 3)，(2, 3)，(4, 1)，(6, 4)，(8,\
    \ 2). 要计算所有交点。\n\n![](img/4628856fffb4db710a3ae3a299935a63_439_0.png)\n\n## 算法初始形成的事件点进度表E：\n\
    \n(((1,1),S1左端点), ((2,3),S2左端点)\n, ((4,1),S2右端点), ((5,3),S1右端点)\n, ((6,4),S3左端点),\
    \ ((8,8),S3右端点))\n\n## 第二节 多边形表面的交线计算\n\n多边形：空间多面体的表面，设为凸多边形\n\n求交步骤：（已知两个多边形定点序列）\n\
    \n- 1. 根据顶点坐标求出两个多边形表面分别所在平面的方程\n- 2. 根据平面方程计算交线\n- 3. 确定出交线同时在两个多边形表面内部的部分\n\n\
    ## 1. 求平面方程\n\n采用多个顶点位置坐标来计算平面方程.\n\n设要求出通过若干顶点的平面方程\n\nAx+By+Cz+D=0, 即要定出系数A,\
    \ B, C, D, 可采用如下做法\n\n平面方程Ax+By+Cz+D=0的系数A, B, C与该平面上多边形分别在x=0, y=0, z=0三个坐标平面上投影的面积成比例\n\
    \n证明：设三角形三点 (x₁,y₁,z₁),(x₂,y₂,z₂),(x₃,y₃,z₃) 所在的平面方程为 Ax + By + Cz + D = 0\n\n\
    法向量为 (A,B,C)\n\nP₁P₂ × P₁P₃ 为平面法向量\n\nP₁P₂ = (x₂ − x₁, y₂ − y₁, z₂ − z₁)\n\nP₁P₃\
    \ = (x₃ − x₁, y₃ − y₁, z₃ − z₁)\n\nP₁P₂ × P₁P₃ = | i   j   k |\n             \
    \   | x₂−x₁ y₂−y₁ z₂−z₁ |\n                | x₃−x₁ y₃−y₁ z₃−z₁ |\n\ni,j,k 的系数：\n\
    \n( |y₂−y₁  z₂−z₁| , −|x₂−x₁  z₂−z₁| , |x₂−x₁  y₂−y₁| )\n  |y₃−y₁  z₃−z₁|   |x₃−x₁\
    \  z₃−z₁|   |x₃−x₁  y₃−y₁|\n\n(A,B,C)=k\\left(\\begin{vmatrix}y_2-y_1 & z_2-z_1\
    \ \\\\ y_3-y_1 & z_3-z_1\\end{vmatrix}, -\\begin{vmatrix}x_2-x_1 & z_2-z_1 \\\\\
    \ x_3-x_1 & z_3-z_1\\end{vmatrix}, \\begin{vmatrix}x_2-x_1 & y_2-y_1 \\\\ x_3-x_1\
    \ & y_3-y_1\\end{vmatrix}\\right)\n\nS_z = \\frac{1}{2}\\begin{vmatrix}x_1 & y_1\
    \ & 1 \\\\ x_2 & y_2 & 1 \\\\ x_3 & y_3 & 1\\end{vmatrix} = \\frac{1}{2}\\begin{vmatrix}x_1\
    \ & y_1 & 1 \\\\ x_2-x_1 & y_2-y_1 & 0 \\\\ x_3-x_1 & y_3-y_1 & 0\\end{vmatrix}\
    \ = \\frac{1}{2}\\begin{vmatrix}x_2-x_1 & y_2-y_1 \\\\ x_3-x_1 & y_3-y_1\\end{vmatrix}\n\
    \nC = k·2·S_z\n\nA = k·2·S_x\n\nB = k·2·S_y\n\n多边形在z=0平面上投影的面积S可如下求出：\n\n$$S=\\\
    frac{1}{2}\\sum_{i=1}^{n}(x_i-x_j)(y_i+y_j)$$\n\n式中若i=n则j=1，否则j=i+1。\n\n![](img/4628856fffb4db710a3ae3a299935a63_447_0.png)\n\
    \n(x1, y1)\n\n(x2, y2)\n\n(x3, y3)\n\nA1\n\nA2\n\nA3\n\n- A1 = \\frac{1}{2} (y1\
    \ + y2) (x1 - x2)\n- A2 = \\frac{1}{2} (y2 + y3) (x2 - x3)\nA1 + A2 + A3 = \\\
    frac{1}{2} (y1 + y3) (x3 - x1)\nS = \\frac{1}{2} [ (y1+y2)(x1-x2) + (y2+y3)(x2-x3)\
    \ + (y3+y1)(x3-x1) ]\n\n## 若给出空间若干点的坐标\n\n(x1, y1, z1), (x2, y2, z2), .... (xn,\
    \ yn, zn), 求所确定的平面方程。\n\nA = 1/2 Σ_{i=1}^{n} (y_i - y_j)(z_i + z_j)\nB = 1/2 Σ_{i=1}^{n}\
    \ (z_i - z_j)(x_i + x_j)\nC = 1/2 Σ_{i=1}^{n} (x_i - x_j)(y_i + y_j)\n\nD = -A\
    \ x1 - B y1 - C z1\n\n式中若 i = n, 则 j = 1, 否则 j = i + 1\n\n## 2. 平面方程的求交\n\n$A_1x+B_1y+C_1z+D_1=0$\
    \  \n$A_2x+B_2y+C_2z+D_2=0$\n\n$\\frac{A_1}{A_2}=\\frac{B_1}{B_2}=\\frac{C_1}{C_2}$　两平面**重合或平行**，一般算没有交点\n\
    \n## 3. 确定交线同时在两个多边形内部的部分\n\n分别对每个多边形表面各边相应的线段，计算它与另一个多边形表面所在平面的交点。\n\n**注意：**\
