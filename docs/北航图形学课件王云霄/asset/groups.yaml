    # “折半查找”


    设算法的输入是一个凸多边形的顶点逆时针序列P0,P1,…,Pn-1，询问点P,可有包含性检验算法：


    +   1. 【准备】i←1，j←n−1；

    +   2. 【查找是否结束】若j−i=1则到4，否则继续；

    +   3. 【折半查找】k←⌊(i+j)/2⌋，检查询问点相对直线P0Pk的位置关系，分三种情况：

    +      3.1 在直线上，若点在线段P0Pk上或内部，则点在原凸多边形内部；若点在线段P0Pk延长线上，则在原凸多边形外；输出回答后算法结束；

    +      3.2 在左侧，i←k返回步2

    +      3.3 在右侧，j←k返回步2

    +   4. 【最后检查】检查询问点P对△P0PiPj的包含性，若在内则也在原凸多边形内部，若在外则也在原凸多边形外部，输出回答后算法结束。


