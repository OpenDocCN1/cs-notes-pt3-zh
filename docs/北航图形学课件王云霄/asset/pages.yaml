  md: '矩阵的加法适合交换律和结合律，其中A、B、C为矩阵。

    A + B = B + A

    A + (B + C) = (A + B) + C

    矩阵的乘法适合结合律，即：

    A • (B • C) = (A • B) • C

    矩阵的乘法对加法适合分配律，即：

    (A + B) • C = A • C + B • C

    C • (A + B) = C • A + C • B

    矩阵的乘法不适合交换律'
