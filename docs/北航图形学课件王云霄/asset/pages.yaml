- pgno: 27
  md: '# 第五节　计算机图形标准


    1. 计算机图形的标准是指图形系统及其相关应用系统中各界面之间进行数据传送和通信的接口标准，以及供图形应用程序调用的子程序功能及其格式标准，前者为数据及文件格式标准，后者为子程序界面标准。


    +   1974年 ANSI “与机器无关的图形技术“会议上

    +   1977年 美国计算机协会ACM提出了CGS（核心图形系统）

    +   国际标准化组织ISO：

    +   　计算机图形核心系统及其语言联编（GKS）

    +   　三维图形核心系统及其语言联编（GKS-3D）

    +   　程序层次交互式图形系统及其语言联编（PHIGS）

    +   　计算机图形接口（CGI）

    +   　计算机图形源文件（CGM）

    +   　基本图形转换规范（IGES）

    +   　产品数据转换规范（STEP）'
  merge: -1
  img_proc: true
