  md: '# 两个凸多边形求交的完整算法：


    # CONVEX POLYGON INTERSECTION


    +   1. 【准备】$i\leftarrow1,\ j\leftarrow1,\ k\leftarrow1,\ P_0\leftarrow P_l,\ Q_0\leftarrow
    Q_m$；

    +   2. 【交替前进求交】若 $k\leq2(l+m)$ 并且所求出当前交点不是第一次求得交点 $R_0$，则做 $2.1\sim2.3$ 循环：

    +      2.1 若线段 $P_{i-1}P_i$ 与 $Q_{j-1}Q_j$ 相交，则调用 Output；

    +      2.2 调用 Advance；

    +      2.3 $k\leftarrow k+1$；'
