- pgno: 3
  md: '计算机图形学是研究通过计算机将数据转换为图形，并在专门显示设备上显示的原理、方法和技术的学科。（确切）


    计算机生成图形的过程: 对象→模型→图形


    (1)根据对象建立对象的模型(建模)


    模型：能够正确地表达出一个对象性质、结构和行为的所有描述信息。


    (2)利用计算机对这个模型进行必要的处理,产生能正确反映对象的某种性质的图形输出。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 3. 图象处理是指用计算机来改善图象质量的数字技术.


    +   (1) 如何消除噪声 (去噪)

    +   (2) 压缩图像数据以便于传输和存贮

    +   (3) 用对比增强技术突出图像中的某些特征

    +   (4) 用复原技术使模糊的图像清晰

    +   (5) 从CT信息重建二维 三维图像


    # 4. 模式识别是指用计算机对输入图形进行识别的技术。


    特征提取

    统计判定法或者语法分析法


    (人像, 指纹, 味觉, 声音, 虹膜, 血管识别)'
