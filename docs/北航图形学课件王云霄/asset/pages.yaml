- pgno: 512
  md: '若 $z_1 \le z''_1$ 且 $z_2 \le z''_2$，则线段不被遮挡


    若 $z_1 \ge z''_1$ 且 $z_2 \ge z''_2$，有可能遮挡需要进一步检查


    若非以上两种情况，必然相交，求出交点，交点将原线段分成两段，分别属于上面两种情况


    求出 $z_1, z''_1$


    设平面方程为 $Ax+By+Cz+D=0$


    直线 $L_1$ 的参数方程


    $X=x_1,$


    $Y=y_1,$


    $Z=z_1+t,$ 代入平面方程得： $Ax_1+By_1+C(z_1+t)+D=0$'
