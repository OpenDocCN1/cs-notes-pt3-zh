  md: '# 1. DDA线段扫描转换算法


    设待画线段两端点的坐标值（x1，y1）和（x2，y2），假定 x1<x2


    y=mx+b


    m=（y2−y1）/（x2−x1）


    b=（x2y1−x1y2）/（x2−x1）


    |m|≤1，对x每增1取允许的各整数值'
