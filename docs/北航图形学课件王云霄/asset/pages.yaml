- pgno: 240
  md: '# 裁剪区域为任意凸多边形区域时的直线段的裁剪算法


    +   1. 计算所要裁剪的直线段所在直线与凸多边形区域的边界直线段的交点。


    +   2. 当交点的个数为0或1时，该直线段处于凸多边形区域外


    +   3. 当交点的个数为2时，通过判断这两个交点与被裁剪的直线段的端点在直线段所在的直线上的关系来进行裁剪。


    +   1). 如果直线段的两个端点和两个交点刚好全部重合，则显而易见该直线段完全可见。


    +   2). 如果直线段的两个端点和两个交点中有一个'
  merge: -1
  img_proc: true
- pgno: 241
  md: '重合，则将重合的点视为一点，则将重合点与另外的一个端点、一个交点按在直线上的顺序排列。根据排列的顺序有如下三种情况：


    +   ① 重合点和交点不相邻，则直线段完全可见；

    +   ② 如果重合点与交点相邻，且该交点与另一个端点相邻，则直线段部分可见，且可见部分为重合点与另一个交点确定的直线段，它的可视部分为直线段；

    +   ③ 如果重合点与交点相邻，且该交点与另一个端点不相邻，则直线段完全不可见。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '3) 如果直线段的两个端点和两个交点都不重合。将这四个点按在直线上的顺序排列，根据排列的顺序有如下四种情况：


    +   ① 如果两个端点和两个交点分别相邻，则直线段完全不可见；

    +   ② 如果两个端点在两个交点之间，则直线段完全可见；

    +   ③ 如果两个交点在两个端点之间，则直线段部分可见，且可见部分为两个交点决定的直线段，它的可见部分为直线段；

    +   ④ 如果交点和端点的排列顺序是交错的，则直线段部分可见，且可见部分为中间的一个交点和一个端点决定的直线段，它的可见部分为直线段。'
  merge: -1
  img_proc: true
