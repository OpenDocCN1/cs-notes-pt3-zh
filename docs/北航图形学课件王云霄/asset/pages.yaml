    # 两线段相交的必要条件：


    若两线段相交，则必然存在某个x，使它们在规定的次序关系 >x 下是相邻的。


    从左向右扫描线变化，线段之间的种次序关系只能有三种可能的变化方式：


    +   1. 遇见某条线段S的左端点，此时S应加入次序关系。

    +   2. 遇见某线段S的右端点，此时S应从次序关系中删除。

