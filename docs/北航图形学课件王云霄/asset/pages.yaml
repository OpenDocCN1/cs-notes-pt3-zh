  md: '# 第五章　图形运算


    # 第一节　线段的交点计算


    # 一、两条线段求交


    设有两线段AB和CD，其端点坐标分别为（xₐ，yₐ）、（xᵦ，yᵦ）和（x𝑐，y𝑐）、（x𝒹，y𝒹），它们所在直线的参数方程分别为：


    ```

    $$\begin{cases} x=x_a+\lambda(x_b-x_a) \\ y=y_a+\lambda(y_b-y_a) \end{cases}\qquad\begin{cases}
    x=x_c+\mu(x_d-x_c) \\ y=y_c+\mu(y_d-y_c) \end{cases}$$

    ```'
