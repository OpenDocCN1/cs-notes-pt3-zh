  md: '# 2. Jarvis行进算法


    思想：若相继两点构成的边是凸壳的一条边则对于过该边的直线，所有点集中的点在该直线同侧。因此若找到pq是壳上一边，则以q为端点的下一条壳边qr可以如下求出：计算点集中其余各点相对q点发出沿向量pq向的射线的倾角，若倾角最小者对应的点是r，则qr是下一条壳边


