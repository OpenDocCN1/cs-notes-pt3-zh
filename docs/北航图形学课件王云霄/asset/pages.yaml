    $(t^3 - 2t^2 + t)P_0'' + (t^3 - t^2)P_1''$

    $P(t) = F_1 P_0 + F_2 P_1 + F_3 P_0'' + F_4 P_1''$


    参数曲线的几何形式 $P(t) = F_1 P_0 + F_2 P_1 + F_3 P_0'' + F_4 P_1''$'
