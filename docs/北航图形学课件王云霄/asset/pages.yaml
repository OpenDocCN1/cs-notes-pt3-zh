    每个单元存放对应象素的颜色值


    # Z缓冲器


    ![](img/4628856fffb4db710a3ae3a299935a63_585_2.png)


    每个单元存放对应象素的深度值'
  merge: -1
  img_proc: true
- pgno: 586
  md: '扫描转换时，对每个多边形内部的任意点（x, y），实施如下步骤：


    +   1. 计算在点（x, y）处多边形的深度值z（x, y）。


    +   2. 如果计算所得的z（x, y）值，小于在z-缓冲存储器中点(x,y)处记录的深度值，那么就做：


    +   （1）把值z(x, y)送入z-缓冲存储器的点(x, y)处。

    +   （2）把多边形在深度z(x,y)处应有的象素值，送入帧缓冲存储器的点(x, y)处。'
  merge: -1
  img_proc: true
- pgno: 587
  md: '算法中深度计算，可通过多边形的顶点坐标求出所在平面的方程，然后再使用平面方程，对每个点(x,y)，解出相应的z。


    对面方程 $Ax + By + Cz + D = 0$，


    解出 z 是：


    $$z = \frac{-D - Ax - By}{C}$$'
  merge: -1
  img_proc: true
- pgno: 588
  md: '设在点 **(x, y)** 处的深度值是 $z_1$：


    $$\frac{-D-Ax-By}{C}=z_1$$


    则在点 **(x+Δx, y)** 处的深度值就是


    $$\frac{-D-A(x+\Delta x)-By}{C}=\frac{-D-Ax-By}{C}-\frac{A}{C}\Delta x$$


    $$=z_1-\frac{A}{C}\Delta x$$'
  merge: -1
  img_proc: true
- pgno: 589
  md: "```\nz-缓冲算法的工作流程：\n帧缓冲区置成背景色；\nz-缓冲区置成最大z值；\nfor（各个多边形）\n{ 扫描转换该多边形；\n    for\
    \ (计算多边形所覆盖的每个像素（x, y）)\n    {  计算多边形在该像素的深度值Z(x, y)；\n    if(Z(x, y) 小于Z缓冲区中的(x,\
    \ y)处的值)\n        {  把Z(x, y)存入Z缓冲区中的(x, y)处；\n        把多边形在(x, y)处的亮度值存入帧缓存区的(x,\
    \ y)处； }\n    }\n}\n```"
  merge: -1
  img_proc: true
