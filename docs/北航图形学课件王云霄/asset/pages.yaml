  md: "因此，若行列式\n\nΔ = | x_b - x_a  -(x_d - x_c) |\n      | y_b - y_a  -(y_d - y_c)\
    \ | = 0\n\n表示两线段AB和CD重合或平行。一般做为它们不相交来处理。如果 Δ ≠0, 则可求出交点对应的两个参数值："
