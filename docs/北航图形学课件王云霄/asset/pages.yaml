    \ ⎡P₀⎤\n                 ⎢−2  2  0⎥ ⎢P₁⎥ ,  0 ≤ t ≤ 1\n                 ⎣1   0\
    \  0⎦ ⎣P₂⎦\n\n二次bezier曲线是抛物线"
