- pgno: 455
  md: '# 1. Graham扫描算法


    思想：设有一点O，设为原点，对点集S中所有的点计算与OX轴的倾角，并按照倾角递增排序，若某一点不是凸顶点，则它必然在两个壳顶点与点O形成的三角形内部，则删除这个内点。


    Graham扫描的实质是围绕已经按“倾角”排序的各顶点进行一次扫描，在扫描过程中消去在凸壳内部的点，留下以希望次序排列的壳顶点。'
  merge: -1
