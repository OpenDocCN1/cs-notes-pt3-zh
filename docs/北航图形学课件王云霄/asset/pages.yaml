- pgno: 522
  md: '# 第五节 z-缓冲算法


    z-缓冲算法：(深度缓冲算法)是一种最简单的图象空间算法。


    帧缓冲存储器：存储各点的像素值，初始化为背景值。


    z-缓冲存储器：存储相应的z值。初始化最大z值。


    对每一个多边形，不必进行深度排序算法要求的初始排序，立即就可以逐个进行扫描转换。'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# 原幕


    ![](img/4628856fffb4db710a3ae3a299935a63_523_0.png)


    # 帧缓冲器


    ![](img/4628856fffb4db710a3ae3a299935a63_523_1.png)


    每个单元存放对应象素的颜色值


    # Z缓冲器


    ![](img/4628856fffb4db710a3ae3a299935a63_523_2.png)


    每个单元存放对应象素的深度值'
  merge: -1
  img_proc: true
- pgno: 524
  md: '扫描转换时，对每个多边形内部的任意点（x, y），实施如下步骤：


    +   1. 计算在点（x, y）处多边形的深度值z（x, y）。


    +   2. 如果计算所得的z（x, y）值，小于在z-缓冲存储器中点(x,y)处记录的深度值，那么就做：


    +   （1）把值z(x, y)送入z-缓冲存储器的点(x, y)处。

    +   （2）把多边形在深度z(x,y)处应有的象素值，送入帧缓冲存储器的点(x, y)处。'
  merge: -1
  img_proc: true
- pgno: 525
  md: '算法中深度计算，可通过多边形的顶点坐标求出所在平面的方程，然后再使用平面方程，对每个点(x,y)，解出相应的z。


    对面方程 $Ax + By + Cz + D = 0$，


    解出 z 是：


    $$z = \frac{-D - Ax - By}{C}$$'
  merge: -1
  img_proc: true
- pgno: 526
  md: '设在点 **(x, y)** 处的深度值是 $z_1$：


    $$\frac{-D-Ax-By}{C}=z_1$$


    则在点 **(x+Δx, y)** 处的深度值就是


    $$\frac{-D-A(x+\Delta x)-By}{C}=\frac{-D-Ax-By}{C}-\frac{A}{C}\Delta x$$


    $$=z_1-\frac{A}{C}\Delta x$$'
  merge: -1
  img_proc: true
- pgno: 527
  md: "```\nz-缓冲算法的工作流程：\n帧缓冲区置成背景色；\nz-缓冲区置成最大z值；\nfor（各个多边形）\n{ 扫描转换该多边形；\n    for\
    \ (计算多边形所覆盖的每个像素（x, y）)\n    {  计算多边形在该像素的深度值Z(x, y)；\n    if(Z(x, y) 小于Z缓冲区中的(x,\
    \ y)处的值)\n        {  把Z(x, y)存入Z缓冲区中的(x, y)处；\n        把多边形在(x, y)处的亮度值存入帧缓存区的(x,\
    \ y)处； }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 528
  md: 'Z-Buffer算法优点：

    在像素级上以近物取代远物。形体在屏幕上的出现顺序是无关紧要的。这种取代方法实现起来远比总体排序灵活简单，有利于硬件实现。

    Z-Buffer算法缺点：占用空间大，没有利用图形的相关性与连续性。需要开一个与图象大小相等的缓存数组ZB。


    改进算法:只用一个深度缓存变量zb。'
  merge: -1
  img_proc: true
- pgno: 529
  md: "```\nZ-Buffer()\n[ 帧缓存全置为背景色\n    for (屏幕上的每个像素(i, j)) //扫描整个屏幕\n[ 深度缓存变量zb置最大值MaxValue\n\
    \    for (多面体上的每个多边形Pk)\n    { if (像素点(i, j)在pk的投影多边形之内)\n    { 计算Pk在(i, j)处的深度值depth;\n\
    \        if (depth小于zb)\n        { zb = depth;\n            indexp = k;}}}\n \
    \   If (zb != MaxValue) 计算多边形Pindexp在交点 (i, j) 处的光照颜色并显示\n]]\n```"
  merge: -1
  img_proc: true
