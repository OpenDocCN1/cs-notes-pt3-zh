- pgno: 270
  md: '# 常用方法 最小二乘法


    假设已知一组型值点（xi,yi），i=1,2,...n,要求构造一个m（m<n-1）次多项式函数y=F(x) 逼近这些型值点。


    偏差的平方和最小：

    φ = Σ_{k=1}^{n} (F(x_k) - y_k)^2


    或加权平方和最小： φ = Σ_{k=1}^{n} d_k (F(x_k) - y_k)^2


    令F(x)为一个m次多项式      F(x) = Σ_{j=0}^{m} a_j x^j


    最小二乘法就是定出ai使偏差平方和最小'
  merge: -1
  img_proc: true
