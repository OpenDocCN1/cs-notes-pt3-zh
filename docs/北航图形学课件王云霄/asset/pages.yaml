- pgno: 248
  md: '梁友栋-Barsky算法也可以推广到三维情况下。当视域为立方体时，这种推广是直接的。当视域为棱台时，对于x = ±z，y = ±z 四个平面来说，对应于二维裁剪时的Q值和D值可如下取值：


    Qₗ = -(Δx + Δz),      Dₗ = z₀ + x₀

    Qᵣ = (Δx - Δz),      Dᵣ = z₀ - x₀

    Qᵦ = -(Δy + Δz),     Dᵦ = y₀ + z₀

    Qₜ = (Δy - Δz),      Dₜ = z₀ - y₀'
