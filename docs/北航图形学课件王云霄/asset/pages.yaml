  md: '# 倾角计算


    记P点坐标为(Xp, Yp)，O点坐标(X₀, Y₀)，这个角度数可如下简单地计算：


    A = (x_p - x_0) / sqrt((x_p - x_0)^2 + (y_p - y_0)^2) = cosθ


    B = y_p - y_0


    若B ≥ 0 则角度数 = 1 - A （0 ≤ θ ≤ 180°）


    若B < 0 则角度数 = 3 + A。 （180° ≤ θ ≤ 360°）


    cos θ 在 I II 象限递减，在 III IV 象限递增'
