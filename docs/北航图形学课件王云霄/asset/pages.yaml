- pgno: 99
  md: '# step1．如何计算扫描线与多边形边界线的所有交点？


    若扫描线 $y_i$ 与多边形边界线交点 $x$ 的坐标是 $x_i$，则对下一条扫描线 $y_{i+1}$，它与那条边界线的交点的 $x$ 坐标 $x_{i+1}$，可如下求出：


    $$m=\frac{y_{i+1}-y_i}{x_{i+1}-x_i},\quad y_{i+1}=y_i+1\Rightarrow x_{i+1}=x_i+\frac{1}{m}$$'
  merge: -1
  img_proc: true
