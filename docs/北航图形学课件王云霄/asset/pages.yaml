- pgno: 227
  md: '# 3. 梁友栋-Barsky算法


    设要裁剪的直线段为P0P1, Pi的坐标为(xi, yi), i=0, 1。 P0P1和窗口边界交于A、B、C和D四个点。该算法的基本思想是从A、B和P0三点中找出最靠近P1的点，在图3.29中该点是P0。从C、D和P1点中找出最靠近P0的点，在图3.29中该点是点C。那么就是线段上的可见部分'
  merge: -1
  img_proc: true
- pgno: 228
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 写成参数方程： $P_0P_1$


    $x = x_0 + \Delta x \bullet t$


    $\Delta x = x_1 - x_0$


    $y = y_0 + \Delta y \bullet t$


    $\Delta y = y_1 - y_0$


    把窗口边界的四条边分成两类，一类称为始边，另一类称为终边。


    当 $\Delta x \ge 0 (\Delta y \ge 0)$ 时，称 $x = x_l (y = y_b)$ 为始边，$x = x_r (y =
    y_t)$ 为终边。当 $\Delta x < 0 (\Delta y < 0)$ 时，则称 $x = x_r (y = y_t)$ 为始边，$x = x_l
    (y = y_b)$ 为终边。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '求出P₀P₁和两条始边的交点的参数 t''₀ , t''''₀

    令： t₀ = max(t''₀ , t''''₀ ,0)

    t ∈ [t₀ , t₁]


    求出P₀P₁和两条终边的交点的参数 t''₁ , t''''₁

    令： t₁ = min(t''₁ , t''''₁ ,1)


    当 t₁ > t₀ 时，参数方程中参数的线段就是的可见部分。当 t₀ > t₁ 时，整个直线段为不可见'
  merge: -1
  img_proc: true
- pgno: 231
  md: '为了确定始边和终边，并求出$P_0P_1$与它们的交点，可采用如下方法，令：


    $Q_l = -\Delta x,$      $D_l = x_0 - x_l$

    $Q_r = \Delta x,$      $D_r = x_r - x_0$

    $Q_b = -\Delta y,$      $D_b = y_0 - y_b$

    $Q_t = \Delta y,$      $D_t = y_t - y_0$


    交点的参数为：


    $t_i = \frac{D_i}{Q_i},\quad i = l, r, b, t$'
  merge: -1
  img_proc: true
- pgno: 232
  md: 当$Q_i<0$时，求得的 $t_i$ 必定是 $P_0P_1$ 和始边的交点的参数。当$Q_i>0$时，$t_i$ 则是 $P_0P_1$ 和终边的交点的参数。
    $Q_i=0$时，若$D_i<0$，则p0p1是完全不可见的（如图3.30中的直线段AB,使 $Q_r=0,D_r\ge0$）。 $Q_i=0,D_i\ge0$时，如CD,$Q_l=0,D_l>0$;$Q_r=0,D_r>0$
