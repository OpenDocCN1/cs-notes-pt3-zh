  md: '# 2. 如何排列求出交点和原凸多边形的顶点，形成交得凸多边形的顶点序列？


    可以在每求出一个交点时进行一次输出，求出的第一个交点可只做一下记录，如果在以后交替前进求交点的过程中再次求出与第一次求得相同的交点，就知道整个求交过程已经结束了。


    求得一个不是第一个的其它任何一个交点时，为形成交得凸多边形顶点序列，要区分边 P_{i-1}P_i 是进入多边形Q，还是走出Q两种情况。'
