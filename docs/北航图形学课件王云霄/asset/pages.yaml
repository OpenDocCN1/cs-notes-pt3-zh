    函数cansee用于判断直线段是否可见。

    double xl, xr, yt, yb; （窗口位置）


    ```

    void L_Barsky(double x0, y0, x2, y2)

    {

    double t0, t1, deltax, deltay;

    t0=0.0; t1=1.0;

    deltax=x2-x0;

    if (!cansee(-deltax, x0-x1, t0, t1)) return;

    ```'
