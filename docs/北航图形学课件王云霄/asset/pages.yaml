- pgno: 388
  md: '$$N_{i,1}(u)=\begin{cases}1, & u_i\le u\le u_{i+1},\ 0\le i\le n+k-1\\0, &
    \text{其它}\end{cases}$$


    $$N_{i,k}(u)=\frac{u-u_i}{u_{i+k-1}-u_i}N_{i,k-1}(u)+\frac{u_{i+k}-u}{u_{i+k}-u_{i+1}}N_{i+1,k-1}(u),\quad
    k>1,\ 0\le i\le n$$


    这里 $u_0，u_1，\ldots，u_{n+k}$ 是一个**非递减**的序列，称为节点，$(u_0，u_1，\ldots，u_{n+k})$ 称为**节点向量**。定义中可能出现
    $\frac{0}{0}$，这时约定为 0。'
  merge: -1
