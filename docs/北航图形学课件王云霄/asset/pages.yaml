- pgno: 565
  md: '# 第一节 线面比较法消除隐藏线


    +   • 多面体的面可见性

    +   对象：凸多面体

    +   可见面：朝向观察位置的面

    +   观察方向：由指向观察位置的一个方向向量k给出，面的外法向量是n，则这两个向量的夹角 α 满足0≤ α < π/2时，所考察面是可见的，否则就是不可见的'
  merge: -1
  img_proc: true
- pgno: 566
  md: '把 n 和 k 记作 \(\mathbf{n}=(n_x,n_y,n_z)\)，\(\mathbf{k}=(k_x,k_y,k_z)\)，则


    \[\cos\alpha=\frac{\mathbf{n}\cdot\mathbf{k}}{|\mathbf{n}|\,|\mathbf{k}|}=\frac{n_xk_x+n_yk_y+n_zk_z}{\sqrt{n_x^2+n_y^2+n_z^2}\,\sqrt{k_x^2+k_y^2+k_z^2}}\]


    \[\Delta=n_xk_x+n_yk_y+n_zk_z\]


    +   - \(\Delta>0\)，\(0\leq\alpha<\frac{\pi}{2}\)，面为可见

    +   - \(\Delta<0\)，\(\frac{\pi}{2}<\alpha\leq\pi\)，面不可见

    +   - \(\Delta=0\)，\(\alpha=\frac{\pi}{2}\)，面退化为线。'
  merge: -1
  img_proc: true
