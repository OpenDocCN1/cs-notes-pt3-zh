  md: '# 3.2.3:


    if s=0, goto 3.2.5（这时扫描线不在任何多边形内，正通过背景，不必做扫描转换）


    if s=1, goto 3.2.4（这时扫描线只在一个多边形内，不必做深度比较，去做扫描转换。）


