  md: '# 第三节 深度排序算法


    深度排序算法：先画最远的，再画最近的

    （优先级算法，画家算法）


    深度排序算法的主要步骤：


    +   1. 把所有的多边形按顶点最大z坐标值进行排序。

    +   （客体空间）


    +   2. 解决当多边形z范围发生交送时出现的不明确问题。


    +   3. 按最大z坐标值逐渐减小的次序，对每个多边形进行扫描转换。（图像空间）'
