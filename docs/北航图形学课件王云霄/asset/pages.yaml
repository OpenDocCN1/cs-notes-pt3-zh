- pgno: 426
  md: "# 若两线段相交, 则交点的参数值, 应满足：\n\n⎧\n  x = xₐ + λ (x_b - x_a) = x_c + μ (x_d - x_c)\n\
    \  y = yₐ + λ (y_b - y_a) = y_c + μ (y_d - y_c)\n\n即\n\n⎧\n  (x_b - x_a) λ - (x_d\
    \ - x_c) μ = x_c - x_a\n  (y_b - y_a) λ - (y_d - y_c) μ = y_c - y_a"
