- pgno: 245
  md: 'Cohen-Sutherland算法推广至三维时，用于判断显然不可见的线段的编码应为六位，这六位的安排是：


    +   - 点在视域上面，第一位为1，y>1（y>z）

    +   - 点在视域下面，第二位为1，y<0（y<−z）

    +   - 点在视域右面，第三位为1，x>1（x>z）

    +   - 点在视域左面，第四位为1，x<0（x<−z）

    +   - 点在视域后面，第五位为1，z>1（z>1）

    +   - 点在视域前面，第六位为1，z<0（z<z_min）'
