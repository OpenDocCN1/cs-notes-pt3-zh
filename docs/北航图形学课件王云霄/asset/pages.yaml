- pgno: 6
  md: '# 6. 与计算机图形学关系密切的学科


    (1) 计算几何学 是研究几何模型和数据处理的学科。

    曲线曲面的构造, 三维立体造型, 拼接


    (2) 交互式计算机图形学 是指用计算机交互式地产 生图形的技术。


    交互设备是实现交互技术，完成交互任务的基 础。


    交互设备有定位、键盘、选择、取值和拾取。


    交互任务是用户输入到计算机的一个单元信息， 基本任务有四种：定位、字串、选择、取数。'
