- pgno: 224
  md: '# 2. 中点分割算法


    **基本思想：** 可分成两个过程平行进行，\n从 p0 点出发找出离点 p0 最近的可见点，\n从 p1 点出发找出离点 p1 最近的可见点。\n这两个最近可见点的连线就是原直线段的可见部分。


    ```

    p0p1 → mid(p0, p1) = pm → mid(p0, pm)\n　　　　　　　　　　　　→ mid(pm, p1)

    ```


    +   1) 完全可见，绘制线段  \n2) 完全不可见：线段不绘制，舍弃  \n3) 求中点 pm，分割成 p0pm、pmp1，在分别进行判断\n　直到
    \(|p_m p_1| < \varepsilon\)'
