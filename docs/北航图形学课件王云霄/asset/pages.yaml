- pgno: 272
  md: '解四个方程，求得参数

    $a_0 = P(0), a_1 = P''(0)$

    $a_2 = -3P(0) + 3P(1) - 2P''(0) - P''(1)$

    $a_3 = 2P(0) - 2P(1) + P''(0) + P''(1)$


