- pgno: 458
  md: '# Graham扫描算法


    +   1. 【倾角排序】确定O点，设想有一条从O出发水平向右的射线OX，对S中其余各点P计算相对于OX的倾角POX，之后按倾角递增排序，得到点序列Q₁=O，Q₂，Q₃…，Qₙ；


    +   2. 【准备扫描】v←Q₁；


    +   3. 【扫描】

    +   if NEXT(v)=Q1，算法结束，序列中剩余的点就是凸壳上的顶点

    +   else if v、NEXT(v)、NEXT(NEXT(v))形成一个左转

    +   　　then v←NEXT(v)

    +   　　else 删除NEXT(v)，v←PRED(v)；

    +   goto 3.


    next(v)：返回点序列中的v的下一个点（后继节点）

    pred(v)：返回点序列中的v的前一个点（前驱节点）

    循环链表 next(Qn)=Q1，pred(Q1)=Qn'
