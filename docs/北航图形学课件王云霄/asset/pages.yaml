- pgno: 247
  md: '1 = (y₁ − y₀)t'' + y₀    t'' = (1 − y₀)/(y₁ − y₀)


    直线段和平面 x=z 的交点，可得出交点处的参数为：


    t'' = (z₀ − x₀)/[(x₁ − x₀) − (z₁ − z₀)]'
