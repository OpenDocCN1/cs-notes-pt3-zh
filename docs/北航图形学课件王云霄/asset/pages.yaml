- pgno: 487
  md: '简单多边形的顶点序列为P₀, P₁, Pₙ₋₁, 那么算法可描述如下：


    # SIMPLE POLYGON TRIANGULATION


    +   1. （准备）Q₀←P₀；

    +   2. （剖分）若n>3，则做2.1~2.2，否则转到步3：

    +      2.1 Q1←点序列中Q₀的下一个顶点；Q2←点序列中Q₁的下一个顶点；

    +      2.2 若Test(Q₀, Q₁, Q₂)为真，则做：

    +          输出△Q₀Q₁Q₂；

    +          从点序列中删除顶点Q₁；

    +          n←n-1；

    +          goto2；

    +      否则做Q₀←Q₁，返回步2.1；

    +   3. （最后输出）输出点序列中剩下三点为最后一个三角形，然后算法结束。


    函数Test分两步实现，第一步检查Q₀, Q₁, Q₂是否是一个在Q₁的左转，若不然，是右转，则Q₀Q₂在多边形外部而可以回答假而结束。第二步检查可对原多边形中除去Q₀,
    Q₁, Q₂这三点的其它点，对每一点都考查它对三角形的包含性，若有一点被包含则就可以回答假而结束，只有其它点都在三角形外部时才能回答真而结束。'
  merge: -1
  img_proc: true
