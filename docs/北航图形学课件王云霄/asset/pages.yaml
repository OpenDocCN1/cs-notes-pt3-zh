  md: '# 简单多边形包含性检验的算法：


    +   1. （准备）xn←x0, yn←y0, m←−1, i←0;

    +   2. （排除必不相交情形）若下列条件有一个成立，则到4。

    +      2.1 xp<xi 并且 xp<xi+1：

    +      2.2 xp≥xi 并且 xp≥xi+1；

    +      2.3 yp<yi 并且 yp<yi+1；

    +   3. （计算交点）y=yi+(xp−xi)(yi+1−yi)/(xi+1−xi)，分两种情形：

    +      （1）若y=yp，则点P在多边形边界上，算法结束；

    +      （2）若y<yp，则m←(−1)•m；

    +   4. （结束判断）i←i+1，若i<n”，则返回到2，否则算法结束，此时若m=−1则点P在多边形外部，m=1则在内部。'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# 二. 凸多边形的包含算法


    如何判断坐标为 (xp, yp) 的点P在直线的哪一侧？


    设直线的端点为 (x1, y1) 和 (x2, y2)，直线方向是由 (x1, y1) 到 (x2, y2) 的方向。


    直线的方程记为 Ax+By+C=0，则有：


    A=y2−y1，B=x1−x2，C=x2y1−x1y2


    计算D：


    D=Axp+Byp+C


    +   若 **D<0**，则点在直线**左侧**；

    +   若 **D>0**，则点在直线**右侧**；

    +   若 D=0，则点在直线**上**。


    ![](img/4628856fffb4db710a3ae3a299935a63_470_0.png)'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# “折半查找”


    设算法的输入是一个凸多边形的顶点逆时针序列P0,P1,…,Pn-1，询问点P,可有包含性检验算法：


    +   1. 【准备】i←1，j←n−1；

    +   2. 【查找是否结束】若j−i=1则到4，否则继续；

    +   3. 【折半查找】k←⌊(i+j)/2⌋，检查询问点相对直线P0Pk的位置关系，分三种情况：

    +      3.1 在直线上，若点在线段P0Pk上或内部，则点在原凸多边形内部；若点在线段P0Pk延长线上，则在原凸多边形外；输出回答后算法结束；

    +      3.2 在左侧，i←k返回步2

    +      3.3 在右侧，j←k返回步2

    +   4. 【最后检查】检查询问点P对△P0PiPj的包含性，若在内则也在原凸多边形内部，若在外则也在原凸多边形外部，输出回答后算法结束。


    **注：** 对点在三角形内的判断，三条边分别判断'
  merge: -1
  img_proc: true
