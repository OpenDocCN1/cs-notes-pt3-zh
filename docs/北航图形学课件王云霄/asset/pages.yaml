    # a.几何作图法


    记点Pₖ, Pₖ₊₁, ..., P, 可以生成的Bezier曲线为 Pₖ, (t), 0≤t≤1, 则成立下面的递推关系


    P₀,ₙ(t) = (1−t)·P₀,ₙ₋₁(t) + t·P₁,ₙ(t)


