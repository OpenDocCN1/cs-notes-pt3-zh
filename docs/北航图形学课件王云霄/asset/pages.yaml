- pgno: 151
  md: '视见变换就是将用户坐标系窗口中指定的图形转换至设备坐标系视区中显示的过程。


    # 视见变换的实现：


    窗口：左下角点（wxl, wyb）右上角点（wxh, wyh）


    视区：左下角点（vxl, vyl）右上角点（vxh, vyh）


    1. (x_w - wxl)/(wxh - wxl) = (x_v - vxl)/(vxh - vxl)


    x_v = vxl + (x_w - wxl) * (vxh - vxl)/(wxh - wxl)


    同理 y_v = vyl + (y_w - wyb) * (vyh - vyl)/(wyh - wyb)'
