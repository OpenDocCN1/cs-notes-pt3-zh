- pgno: 40
  md: '对每一个像素计算判别式$d$，根据它的符号确定下一像素。

    $d\ge 0$ 时，取正右方像素$P_1$，判断再下一个像素应取哪个，应计算

    $d_1 = F\left( x_i+2\ ,\ y_i+0.5 \right) = a\left( x_i+2 \right) + b\left( y_i+0.5
    \right) +c = d + a$

    故$d$的增量为$a$。

    而若$d<0$，则取右上方向素$P_2$。要判断再下一个像素，则要计算'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'd₂ = F( xᵢ+2, yᵢ+1.5 )

    = a( xᵢ+2 ) + b( yᵢ+1.5 ) + c

    = d + a + b


    故在第二种情况，d的增量为a + b


    再看d的初始值。显然，第一个元素应取左端点(x₀, y₀)，相应的判别式值为'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'd₀ = F(x₀ +1, y₀ +0.5)

    = (x₀ +1) + b(y₀ +0.5) + c

    = a x₀ + b y₀ + c + a + 0.5b

    = F(x₀, y₀) + a + 0.5b

    但由于(x₀, y₀)在直线上，故 F(x₀, y₀)=0。

    因此，d的初始值为 d₀ = a+0.5b


    考虑用2d来代替d的计算'
  merge: -1
  img_proc: true
- pgno: 43
  md: "```\nvoid MidpointLine (int x0,int y0,int x1,int y1)\n{\n    int a,b,delta1,delta2,d,x,y\
    \ ;\n    a = y0 - y1;\n    b = x1 - x0;\n    d = 2 * a + b ;\n    delta1 = 2 *\
    \ a ;\n    delta2 = 2 * ( a + b );\n    x = x0 ;\n    y = y0 ;\n    SetPixel(x,y);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "```\nwhile( x<x1 )\n{\n    if( d<0 )\n    { x ++;\n      y ++;\n      d+= delta2;\n\
    \    }\n    else\n    { x ++;\n      d+= delta1;\n    }\n    SetPixel(x,y);\n\
    }\n}\n```"
  merge: -1
  img_proc: true
