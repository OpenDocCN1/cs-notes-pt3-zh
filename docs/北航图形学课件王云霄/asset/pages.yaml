- pgno: 485
  md: '# 第五节 简单多边形的三角剖分


    简单多边形做三角剖分，是要求选出完全在内部又互不相交的一组对角线，把整个多边形划分成一些三角形。


    对角线是不相邻顶点间的连线，

    选出的对角线的集合称为是简单多边形的三角剖分。

    对任意一个简单多边形，其三角剖分不唯一。


    事实1 简单多边形必有一条对角线完全在其内部。


    事实2 简单多边形上必有连续的三个顶点A, B, C, 使对角线AC完全在其内部。'
  merge: -1
