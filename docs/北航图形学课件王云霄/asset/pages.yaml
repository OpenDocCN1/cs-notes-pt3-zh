- pgno: 246
  md: '设直线段的起点和终点分别为P₀(x₀,y₀,z₀)和P₁(x₁,y₁,z₁)，直线方程可以表示成如下的参数方程形式：


    x = x₀ + (x₁ - x₀)t

    y = y₀ + (y₁ - y₀)t

    z = z₀ + (z₁ - z₀)t


    y=1求交时，可由下式求得：'
