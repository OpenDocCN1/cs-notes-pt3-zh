- pgno: 274
  md: '+   • 参数连续性

    +   一函数在某一点x₀处具有相等的直到k阶的左右导数，称它在x₀处是k次连续可微的，或称它在x₀处是k阶连续的，记作Cᵏ。几何上C⁰、C¹、C²依次表示该函数的图形、切线方向、曲率是连续的。参数曲线的可微性称为参数曲线的连续性。


    +   • 几何连续性

    +   两曲线段的相应的弧长参数化在公共连接点处具有Cᵏ连续性，则称它们在该点处具有k阶几何连续性，记作Gᵏ。零阶几何连续G⁰与零阶参数连续C⁰是一致的。一阶几何连续G¹指一阶导数在两个相邻曲线段的交点处成比例，即方向相同，大小不同。二阶几何连续G²指两个曲线段在交点处其一阶和二阶导数均成比例。'
  merge: -1
  img_proc: true
