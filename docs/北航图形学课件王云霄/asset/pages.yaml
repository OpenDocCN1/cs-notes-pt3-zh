- pgno: 483
  md: '3.〔结束判断〕若在步2找到过交点，则交得凸多边形顶点序列已在调用 Output 过程中输出，算法结束；否则，做如下检查：


    若 $P_1$ 包含于多边形 $Q$ 中，则输出 $P$ 包含于 $Q$ 中，算法结束；


    若 $Q_1$ 包含于多边形 $P$ 中，则输出 $Q$ 包含于 $P$ 中，算法结束；


    若上述两个检查都不成功，输出交为空，两多边形分离，算法结束；'
