    +   - 圆外的点，$F(x,y)>0$

    +   - 圆内的点，$F(x,y)<0$


    $P_1$和$P_2$的中点为 $M=(x_i+1, y_i-0.5)$


    +   - $F(M)<0$时，$M$在圆内，取$P_1$

    +   - $F(M)>0$时，$M$在圆外，取$P_2$

