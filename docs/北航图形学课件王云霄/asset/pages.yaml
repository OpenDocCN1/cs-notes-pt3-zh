- pgno: 37
  md: '# 中点画线法的实现：


    起点和终点分别为

    （$x_0，y_0$）和（$x_1，y_1$）。


    $F(x，y)=ax+by+c=0$


    其中，$a=y_0-y_1$，$b=x_1-x_0$，$c=x_0y_1-x_1y_0$。


    +   - 直线上的点，$F(x，y)=0$；

    +   - 直线上方的点，$F(x，y)>0$；

    +   - 直线下方的点，$F(x，y)<0$。'
  merge: -1
