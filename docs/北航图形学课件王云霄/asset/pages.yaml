    （1）四连通内定义区域填充算法：


    ```

    void Floodfill(int x,int y,COLORREF oldvalue,COLORREF newvalue)

    /* (x, y) 为种子 oldvalue是原值 newvalue是新值，应不等于原值。 */

    { if (GetPixel(x,y) == oldvalue) (是否在区域内并且尚未被访问过)

    { SetPixel(x,y,newvalue);

