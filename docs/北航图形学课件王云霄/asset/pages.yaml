    Floodfill(x,y+1,oldvalue,newvalue);//下

    Floodfill(x-1,y,oldvalue,newvalue); //左

    Floodfill(x+1,y,oldvalue,newvalue); //右

    }

    }

    ```


    优点：算法简单 缺点：重复多'
