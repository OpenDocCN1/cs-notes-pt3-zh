- pgno: 180
  md: '# 第五节 投影


    三维观察过程：

    世界坐标系→观察坐标系→观察表面


    投影：把n维空间中的点投射到小于n维的空间中去


    投影的形成：首先在三维空间中确定一个投影中心和一个投影平面，然后从投影中心引出一些投射直线，这些直线通过形体上的每一点，与投影平面相交，在投影平面上就形成了形体的投影。


    投影中心与投影平面之间距离为d


    +   d无限 平行投影，投射线平行，立体感差，能保持比例关系


    +   d有限 透视投影，立体感强，更真实，但不能保持原来的比例关系'
  merge: -1
  img_proc: true
