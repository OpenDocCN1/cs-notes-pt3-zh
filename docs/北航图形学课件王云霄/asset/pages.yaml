- pgno: 548
  md: '# 第七节 区域分割算法


    **区域分割算法：**


    **将投影平面分割成区域**，考察区域内的图象。如果容易决定在这个区域内某些多边形是可见的，那么就可以显示那些可见的多边形，完成对这一区域的显示任务。否则，就将区域再分割成小的区域，对小的区域递归地进行判断。由于区域逐渐变小，在每个区域内的多边形逐渐变小，最终总可以判定哪些多边形是可见的。这个算法利用的区域的相关性，这种相关性是指位于适当大小的区域内的所有象素，表示的其实是同一个表面。


    **区域分割算法：** 图像空间算法'
