  md: '对z=1和z= z_min两个平面，相应的Q值和D值可如下取值：


    Q_f = -Δz,      D_f = z_0 - z_min

    Q_ba = Δz,      D_ba = 1 - z_0


    其中，Δx = x_1 - y_0   Δy = y_1 -和   Δz = z_1 - z_0 可知，相应平面与P_0P_1的交点的参数值为，。


    t_i = D_i / Q_i      (i = l,r,b,t,f,ba)'
