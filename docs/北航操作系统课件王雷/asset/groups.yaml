    - 可靠性高\n- 磁盘 I/O 速度高\n- 性能价格比\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_946_0.png)\n\
    \n## 优化数据布局\n\n- 优化物理块的分布\n  - 连续摆放\n- 优化索引节点的分布\n  - 减少与数据块的距离\n  - 与数据块结合\n\n\
    - 提前读\n- 延迟写\n- 虚拟盘\n\n## 1981 年至 2000 年 DRAM 每兆字节价格\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_950_0.png)\n\
    \n## 1981 年至 2000 年磁性硬盘每兆字节价格\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_951_0.png)\n\
    \n## 1984 年至 2000 年磁带驱动器每兆字节价格\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_952_0.png)\n\
    \n## 计算机操作系统\n\n教师：王雷\n\n助教：王振 赵玉龙 王宇 王鲁俊\n\n82316284，wanglei@buaa.edu.cn，http://219.224.165.31\n\
    \n## Windows 2000磁盘管理系统\n\n- 跨磁盘管理（DISK SPANNING）\n- 容错（FAULT TOLERANCE）\n\n##\
    \ MS-DOS 的分区方式缺点\n\n- 对大多数磁盘设置的改变需要重新启动操作系统才能生效。\n- Windows NT 的注册表中为 MS-DOS 方式的分区保存了多分区盘的配置信息。\n\
    - 每个卷有一个唯一的从 A 到 Z 的驱动器名。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_955_0.png)\n\
    \n## 基本术语\n\n- 盘（DISKS）：一种物理存储设备，如硬盘、3.5 英寸软盘、光盘。\n- 盘被分为扇区（SECTOR），扇区是可寻址的大小固定的块。扇区的大小是由硬件决定的。目前所有\
    \ x86 处理器的硬盘扇区大小为 512 字节。光盘的扇区一般为 2048 字节。未来的 x86 系统可能支持更大的硬盘扇区。\n- 分区是盘上连续扇区的集合，分区表或其他盘管理数据库中保存了分区的起始扇区、大小和其他特性。\n\
    - 简单卷（SIMPLE VOLUME）是这样一种对象，它代表文件系统驱动程序作为一个独立单元所管理的、来自一个分区的扇区。\n- 多分区卷（MULTIPARTITION\
    \ VOLUME）是这样一种对象，它代表文件系统驱动程序作为一个独立单元所管理的、来自多个分区的扇区。多分区卷提供简单卷所不支持的更好的性能、可靠性和大小特性。\n\
    \n## 基本盘和动态盘的概念\n\n- Windows 2000 把基于 MS-DOS 分区表的盘称为基本盘。\n- 动态盘对 Windows 2000\
    \ 来说是一个新的概念，它实现了比基本盘更具适应性的分区机制。\n\n## 基本盘和动态盘之间的不同点\n\n- 动态盘支持创建新的多分区卷。\n- 基本盘的多分区卷的配置信息保存在注册表中。动态盘的多分区卷的配置信息保存在磁盘中。\n\
    \n## 动态盘的缺点\n\n- 它所应用的分区的格式是专有的，并且不与其他操作系统兼容。\n\n- 系统卷是 Windows 2000 存放引导文件的地方，包括引导程序（NTLDR）和\
    \ NTDETECT。\n- 引导卷是 Windows 2000 存放系统文件（如 NTOSKRNL.EXE 核心内核文件）的地方。\n\n"
