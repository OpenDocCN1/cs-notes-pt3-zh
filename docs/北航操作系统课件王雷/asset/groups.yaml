    +   - SPooling程序和外设进行数据交换可以称为“实际I/O”。一方面，SPOOLing程序预先从外设输入数据并加以缓冲，在以后需要的时候输入到应用程序；另一方面，SPOOLing程序接受应用程序的输出数据并加以缓冲，在以后适当的时候输出到外设。

    +   - 应用程序进行I/O操作时，只是和SPOOLing程序交换数据，可以称为“虚拟I/O”。这时候的虚拟I/O实际上是从SPOOLing程序的缓冲池中读出数据或把数据送入缓冲池，而不是跟实际的外设进行I/O操作。'
  - '[PAGE 845]


