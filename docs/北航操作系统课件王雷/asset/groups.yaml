    \  - 实体之间可以并发地执行；\n  - 实体之间共享相同的地址空间；\n\n## 进程与线程\n\n- 进程包含了两个概念：资源拥有者和可执行单元。\n\
    - 现代操作系统将资源拥有者称为进程（process, task）\n- 可执行单元称为线程。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_313_0.png)\n\
