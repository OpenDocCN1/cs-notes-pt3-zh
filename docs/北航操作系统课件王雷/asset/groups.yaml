  - '[PAGE 452]


    # 覆盖


    +   - 覆盖：“覆盖”管理，就是把一个大的程序划分成一系列的覆盖，每个覆盖是一个相对独立的程序单位。把程序执行时并不要求同时装入主存的覆盖组成一组，称其为覆盖段，这个覆盖段被分配到同一个存储区域。这个存储区域称之为覆盖区，它与覆盖段一一对应。

    +   - 缺点：编程时必须划分程序模块和确定程序模块之间的覆盖关系，增加编程复杂度。从外存装入覆盖文件，以时间延长来换取空间节省。'
  md: "\n![](img/861c0ad57b0249095c0356c9e5a83b26_424_0.png)\n\n```text\nPROCEDURE\
    \ enter(VAR instance: one_)\nBEGIN\n    P(instance.mutex)\nEND\n\nPROCEDURE leave(VAR\
    \ instance: one_)\nBEGIN\n    V(instance.mutex)\nEND;\n```\n\n```text\nPROCEDURE\
    \ wait(VAR s: semaphore)\nBEGIN\n    count++;\n    ...\n```\n\n```text\nPROCEDURE\
    \ signal(VAR s: semaphore)\nBEGIN\n    IF count > 0 THEN\n        BEGIN\n    \
    \        count--;\n            ...\n```\n\n## Barriers\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_427_0.png)\n\
    \n## 经典进程同步问题\n\n- 生产者—消费者问题（the producer-consumer problem）\n- 读者—写者问题（the readers-writers\
    \ problem）\n- 哲学家进餐问题（the dining philosophers problem）\n\n## 生产者-消费者问题（the producer-consumer\
    \ problem）\n\n- 问题描述：若干进程通过有限的共享缓冲区交换数据。其中，“生产者”进程不断写入，而“消费者”进程不断读出；共享缓冲区共有 N\
    \ 个；任何时刻只能有一个进程可对共享缓冲区进行操作。\n\nProducer 1\nProducer 2\n...\nProducer M\n\n生产指针\n\
    \n消费指针\n\nConsumer 1\nConsumer 2\n...\nConsumer N\n\n满\n\n空\n\n共享缓冲区\n\n指针移动方向\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_430_0.png)\n\n### 采用AND信号量集\n\n- SP(empty,\
    \ mutex), SP(full, mutex)\n\n### 采用管程解决生产者-消费者问题\n\n```text\nMonitor PC {\n  \
    \  condition full, empty;\n    int buffer[N];\n    int pnum = N;\n    int cnum\
    \ = 0;\n\n    public producer() {\n        if (pnum > 0)\n            pnum--;\n\
    \        else\n            full.wait;\n        one >> buffer;\n        cnum++;\n\
    \        if (cnum <= 0)\n            empty.signal;\n    }\n\n    public consumer()\
    \ {\n        if (cnum > 0)\n            cnum--;\n        else\n            empty.wait;\n\
    \        one >> buffer;\n        pnum++;\n        if (pnum <= 0)\n           \
    \ full.signal;\n    }\n}\n```\n\n## 读者—写者问题（the readers-writers problem）\n\n-\
    \ 问题描述：对共享资源的读写操作，任意时刻“写者”最多只允许一个，而“读者”则允许多个——“读-写”互斥，“写-写”互斥，“读-读”允许。\n\n###\
    \ 采用信号量机制\n\n- wmutex 表示“允许写”，初值是 1。\n- 公共变量 readcount 表示“正在读”的进程数，初值是 0。\n- rmutex\
    \ 表示对 readcount 的互斥操作，初值是 1。\n\n### 采用一般“信号量集”机制\n\n- 增加一个限制条件：同时读的“读者”最多 RN 个。\n\
    - mx 表示“允许写”，初值是 1。\n- L 表示“允许读者数目”，初值为 RN。\n\n```text\nWriter\n\nSP(mx, 1, 1;\
    \ L, RN, 0);\nwrite\nSV(mx, 1);\n```\n\n```text\nReader\n\nSP(L, 1, 1; mx, 1,\
    \ 0);\nread\nSV(L, 1);\n```\n\n## 哲学家进餐问题（the dining philosophers problem）\n\n\
    - **问题描述：**（由 Dijkstra 首先提出并解决）5 个哲学家围绕一张圆桌而坐，桌子上放着 5 支筷子，每两个哲学家之间放一支；哲学家的动作包括思考和进餐，进餐时需要同时拿起他左边和右边的两支筷子，思考时则同时将两支筷子放回原处。如何保证哲学家们的动作有序进行？如：不出现相邻者同时要求进餐；不出现有人永远拿不到筷子。\n\
    \n```text\nVar chopstick : array[0..4] of semaphore;\n\nP(chopstick[i]);\nP(chopstick[(i+1)\
    \ mod 5]);\neat\nV(chopstick[i]);\nV(chopstick[(i+1) mod 5]);\nthink\n```\n\n\
    ```text\nVar chopstick : array[0..4] of semaphore;\n\nthink\nSP(chopstick[(i+1)\
    \ mod 5], chopstick[i]);\neat\nSV(chopstick[(i+1) mod 5], chopstick[i]);\n```\n\
    \n## Solaris\n\n- Mutex locks\n- Reader/writer (RW) locks\n- Turnstiles\n- Condition\
    \ variables\n\n## 存储管理\n\n王雷\n\n南京航空航天大学计算机系\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_442_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_442_1.png)\n\n### 内容\n\n- 存储分配\n- 存储器资源的组织\n\
    - 地址变换\n- 虚拟存储的调度算法\n- Windows Server 2003 内存管理\n- Windows Server 2003 外存管理\n\
    - Windows Server 2003 高速缓存管理\n\n### 存储层次结构\n\n寄存器（register）\n\n快速缓存（cache）\n\n\
    主存（primary storage）\n\n外存（secondary storage）\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_444_0.png)\n\
    \n### 存储管理的职能\n\n- 存储分配和回收\n- 地址变换\n- 存储共享和保护\n- 存储器扩充\n  - 由应用程序控制：覆盖；\n  - 由\
    \ OS 控制：交换（整个进程空间），请求调入和预调入（部分进程空间）\n\n- 地址空间：源程序经过编译后得到的目标程序，存在于它所限定的地址范围内，这个范围称为地址空间。简言之，地址空间是逻辑地址的集合。\n\
    - 存储空间：存储空间是指主存中一系列存储信息的物理单元的集合，这些单元的编号称为物理地址或绝对地址。简言之，存储空间是物理地址的集合。\n\n### 单一连续区存储管理\n\
    \n- 内存分为两个区域：系统区，用户区。应用程序装入到用户区，可使用用户区全部空间。\n- 最简单，适用于单用户、单任务的 OS。CP/M 和 DOS。\n\
    - 优点：易于管理。\n- 缺点：对要求内存空间少的程序，造成内存浪费；程序全部装入，很少使用的程序部分也占用内存。\n\n### 固定式分区\n\n- 固定式分区（静态存储区域）：当系统初始化时，把存储空间划分成若干个任意大小的区域；然后，把这些区域分配给每个用户作业。\n\
    \n### 可变式分区\n\n- 可变式分区：分区的边界可以移动，即分区的大小可变。\n- 优点：没有内碎片。\n- 缺点：有外碎片。\n\n### 可变式分区的分配策略\n\
    \n1. 最佳适应算法（Best Fit）\n2. 最坏适应算法（Worst Fit）\n3. 首次适应算法（First Fit）\n4. 下次适应算法（Next\
    \ Fit）\n"
