    \n## 问题\n\n- 处理机管理的工作是对CPU资源进行合理的分配使用，以提高处理机利用率，并使各用户公平地得到处理机资源。这里的主要问题是处理机调度算法和调度算法特征分析。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_610_0.png)\n\n## 高级调度\n\n高级调度：又称为“宏观调度”、“作业调度”。从用户工作流程的角度，一次提交的若干个作业，对每个作业进行调度。时间上通常是分钟、小时或天。\n\
    \n- 接纳多少个作业\n- 接纳哪些作业\n\n## 中级调度\n\n- 内外存交换：又称为“中级调度”。从存储器资源的角度，将进程的部分或全部换出到外存上，将当前所需部分换入到内存。指令和数据必须在内存里才能被CPU直接访问。\n\
    \n## 低级调度\n\n- 低级调度：又称为“微观调度”，进程或线程调度。从CPU资源的角度，执行的单位。时间上通常是毫秒。因为执行频繁，要求实时达到高效率。\n\
    - 非抢占式\n- 抢占式\n  - 时间片原则\n  - 优先权原则\n  - 短作业（进程）优先\n\n## 何时进行切换\n\n- 只要OS取得对CPU的控制，进程切换就可能发生：\n\
    \  - 用户调用：来自程序的显式请求(如：打开文件)，该进程多半会被阻塞\n  - 陷阱：最末一条指令导致出错，会引起进程移至退出状态\n  - 中断：外部因素影响当前指令的执行，控制被转移至中断处理程序\n\
    \n- 在进程（上下文）中切换的步骤\n  - 保存处理器的上下文，包括程序计数器和其它寄存器\n  - 用新状态和其它相关信息更新正在运行进程的 PCB\n\
    \  - 把进程移至合适的队列——就绪、阻塞\n  - 选择另一个要执行的进程\n  - 更新被选中进程的 PCB\n  - 从被选中进程中重装入 CPU\
    \ 上下文\n\n## 调度的性能准则\n\n- 从不同的角度来判断处理机调度算法的性能，如用户的角度、处理机的角度和算法实现的角度。实际的处理机调度算法选择是一个综合的判断结果。\n\
    \n### 面向用户的调度性能准则2\n\n- 截止时间：开始截止时间和完成截止时间——实时系统，与周转时间有些相似。\n- 优先级：可以使关键任务达到更好的指标。\n\
    - 公平性：不因作业或进程本身的特性而使上述指标过分恶化。如长作业等待很长的时间。\n\n### 面向系统的调度性能准则\n\n- 吞吐量：单位时间内所完成的作业数，跟作业本身特性和调度算法都有关系——批处理系统\n\
    \  - 平均周转时间不是吞吐量的倒数，因为并发执行的作业在时间上可以重叠。如：在2小时内完成4个作业，而平均周转时间是1.25小时，则吞吐量是2个作业/小时\n\
    - 处理机利用率：——大中型主机\n- 各种资源的均衡利用：如CPU繁忙的作业和I/O繁忙（指次数多，每次时间短）的作业搭配——大中型主机\n\n- 不可抢占式方式\n\
    \  - 一旦处理器分配给一个进程，它就一直占用处理器，直到该进程自己因调用原语操作或等待I/O等原因而进入阻塞状态，或时间片用完时才让出处理器，重新进行调度\n\
    - 抢占式方式\n  - 就绪队列中一旦有优先级高于当前运行进程优先级的进程存在时，便立即进行进程调度，把处理器转给优先级高的进程\n\n## 先来先服务(FCFS,\
    \ First Come First Service)\n\n- 这是最简单的调度算法，按先后顺序调度。\n  - 按照作业提交或进程变为就绪状态的先后次序，分派CPU；\n\
    \  - 当前作业或进程占用CPU，直到执行完或阻塞，才出让CPU（非抢占方式）。\n  - 在作业或进程唤醒后（如I/O完成），并不立即恢复执行，通常等到当前作业或进程出让CPU。最简单的算法。\n\
    - FCFS的特点\n  - 比较有利于长作业，而不利于短作业。\n  - 有利于CPU繁忙的作业，不利于I/O繁忙的作业。\n\n## 短作业优先(SJF,\
    \ Shortest Job First)\n\n- 又称为 “短进程优先” SPN(Shortest Process Next)；这是对FCFS算法的改进，其目标是减少平均周转时间。\n\
    - 对预计执行时间短的作业（进程）优先分派处理机。通常后来的短作业不抢先正在执行的作业。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_627_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_627_1.png)\n\n## 时间片轮转(Round Robin)算法\n\
    \n前两种算法主要用于宏观调度，本算法主要用于微观调度，设计目标是提高资源利用率。其基本思路是通过时间片轮转，提高进程并发性和响应时间特性，从而提高资源利用率。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_629_0.png)\n\n## 时间片轮转算法\n\n- 将系统中所有的就绪进程按照FCFS原则，排成一个队列。\n\
    - 每次调度时将CPU分派给队首进程，让其执行一个时间片。时间片的长度从几个ms到几百ms。\n- 在一个时间片结束时，发生时钟中断。\n- 调度程序据此暂停当前进程的执行，将其送到就绪队列的末尾，并通过上下文切换执行当前的队首进程。\n\
    - 进程可以未使用完一个时间片，就出让CPU（如阻塞）。\n\n## 时间片长度的确定\n\n- 时间片长度变化的影响\n  - 过长 → 退化为FCFS算法，进程在一个时间片内都执行完，响应时间长。\n\
    \  - 过短 → 用户的一次请求需要多个时间片才能处理完，上下文切换次数增加，响应时间长。\n- 对响应时间的要求：T(响应时间)=N(进程数目)*q(时间片)\n\
    - 就绪进程的数目：数目越多，时间片越小\n- 系统的处理能力：应当使用户输入通常在一个时间片内能处理完，否则使响应时间、平均周转时间和平均带权周转时间延长。\n\
    \n| 进程 | 到达时间 | 服务时间 |\n| --- | --- | --- |\n| A | 0 | 4 |\n| B | 1 | 3 |\n| C\
    \ | 2 | 5 |\n| D | 3 | 2 |\n| E | 4 | 4 |\n"
