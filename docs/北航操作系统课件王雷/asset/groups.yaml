    \nLinux并不为这三种调度策略的进程分别设置一个运行队列，而是通过权重的不同计算以及其他的一些队列操作，在一个运行队列中实现这三种不同的调度。发生进程调度时，调度程序要在运行队列中选择一个最值得运行的进程来执行，这个进程便是通过在运行队列中一一比较各个可运行进程的权重来选择的。权重越大的进程越优，而对于相同权重的进程，在运行队列中的位置越靠前越优。\n\
    \n- 调度策略为 SCHED_RR 的实时进程，在分配的时间片到期后，插入到运行队列的队尾。\n\n- 调度策略为 SCHED_FIFO 的进程，在时间片到期后，调度程序并不改变该进程在运行队列中的位置。\n\
    \n- sys_sched_setscheduler, sys_sched_setparam, sys_sched_getscheduler, sys_sched_getparam,\
    \ sys_sched_get_priority_max, sys_sched_get_priority_min\n\n## 优先级priority\n\n\
    - 进程的优先级反映了进程相对于其他进程的可选择度，其实就是系统每次允许进程运行的时间。子进程继承了父进程的优先级。priority也可以通过系统调用sys_setpriority（sys_nice已被sys_setpriority取代）设置。系统为每个进程预定的priority为DEF_PRIORITY（include/linux/sched.h），200ms。\n\
    \n## 相对优先级rt_priority\n\n- 对于实时进程，除了用priority来反映其优先级（可执行时间）外，还有相对优先级用来同类进程之间的比较选择。实时进程的rt_priority取值1～99，一般进程的rt_priority值只能取0。进程的rt_priority可通过setscheduler函数而改变。\n\
    \n计数器counter是衡量一般进程权重的重要指标，主要因为如下几种事件而改变：\n\n- task 0的counter初值为DEF_PRIORITY，在执行sys_idle()时，将counter值置为\
    \ -100。\n- 在创建子进程时，父进程的counter变为原值的一半，并将该值赋予子进程。\n- 在进程运行期间，每次发生时钟中断时，counter值减1，直至为0。\n\
    - 若所有的可运行进程的counter值都为0，则需要为所有的进程都重新赋counter值。\n\n## 小结\n\n- 调度的类型（如调度单位的不同级别、时间周期，不同的OS），性能准则\n\
    - 调度算法：FCFS, SJF, RR，多级队列，优先级，多级反馈队列\n- 调度算法的性能分析：周转时间和作业长短的关系\n- 实时调度：调度算法\n\
    - 多处理机调度：自调度，成组调度，专用处理机调度\n\n## 竞争资源引起死锁\n\n- 可剥夺资源：CPU，内存；\n- 非可剥夺资源：磁带机、打印机；\n\
    - 临时性资源：消息、中断；\n\n## 竞争非可剥夺资源\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_680_0.png)\n\
    \n## 竞争临时性资源\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_681_0.png)\n\n## 进程推进顺序不当引起死锁\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_682_0.png)\n\n## 处理死锁方法\n\n- 预防死锁\n\
    - 避免死锁\n- 检测死锁\n- 解除死锁\n\n## 预防死锁\n\n- 互斥：设备特性\n- 请求和保持：一次性申请所有资源\n  - 资源浪费\n\
    \  - 运行延迟\n- 不剥夺：增加系统开销\n- 环路等待：影响资源利用。\n\n## 有序资源分配法\n\n- 例如：进程 PA，使用资源的顺序是 R1、R2；\n\
    - 进程 PB，使用资源的顺序是 R2、R1；\n- 采用有序资源分配法：R1 的编号为 1，R2 的编号为 2；\n- PA：申请次序应是：R1、R2\n\
    - PB：申请次序应是：R1、R2\n\n## 避免死锁\n\n- 在分配资源时判断是否会出现死锁\n  - 如不会死锁，则分配资源。\n- 死锁避免不那么严格限制产生死锁的四个必要条件（区别于死锁预防）\n\
    \n## 安全状态\n\n- 安全状态：系统存在一个序列<p1,p2,...pn>可顺利完成\n- 不安全状态：\n\n| 进程 | 最大需求 | 已分配\
    \ | 可用 |\n| --- | --- | --- | --- |\n| P1 | 10 | 5 | 3 |\n| P2 | 4 | 2 |  |\n\
    | P3 | 9 | 2 |  |\n\n<P2, P1, P3> P3请求1\n\n| 进程 | 最大需求 | 已分配 | 可用 |\n|---|---|---|---|\n\
    | P1 | 10 | 5 | 2 |\n| P2 | 4 | 2 |  |\n| P3 | 9 | 3 |  |\n\n## 银行家算法\n\n- 银行家算法（Dijkstra,\
    \ 1965）\n  - 一个银行家把他的固定资金（capital）借给若干顾客。只要不出现一个顾客借走所有资金后还不能满足，银行家的资金应该是安全的。银行家需一个算法保证借出去的资金在有限时间内可收回。\n\
    \n- 为了保证资金的安全，银行家规定：\n  - 当一个顾客对资金的最大需求量不超过银行家现有资金时就可接纳顾客\n  - 顾客可以分期贷款，但贷款总数不能超过最大需求量\n\
    \  - 当银行家现有的资金不能满足顾客尚需的贷款数额时，对顾客的贷款可推迟支付，但总能使顾客在有限的时间里得到贷款\n  - 当顾客得到所需的全部资金后，一定能在有限的时间里归还所有的资金\n"
  mdcn: "\n\n## 调度标志\n\n- UNIX System V中有三个与调度有关的标志：\n  - **runrun**：表示要求进行调度，当发现有就绪进程优先级高于当前进程时，设置该标识。在\
    \ wakeup、setrun、setpri（设置优先级）过程中和时钟中断处理例程进行设置。\n  - **runin**：表示内存中没有适当的进程可以换出或内存无足够空间换入一个外存就绪进程。\n\
    \  - **runout**：表示外存交换区中没有适当的进程可以换入。\n\n## 用户优先级\n\n- 进程在用户态和核心态的优先级是不同的，这里说的是用户态进程的优先级。它是基于执行时间的动态优先级，进程优先级可为0~127之间的任一整数。优先数越大，优先级越低。0~49之间的优先级为系统内核保留，用户态下的进程优先级为50~127之间。\n\
    \n- 在UNIX System V中：进程优先数：P_pri = P_CPU / 2 + PUSER + P_nice + NZERO\n  - 系统设置部分：PUSER和NZERO是基本用户优先数的阈值，分别为25和20\n\
    \  - CPU使用时间部分：P_CPU表示该进程最近一次CPU使用时间。每次时钟中断则该值加1（最多可达80）。如果时钟中断的周期为16.6ms，则每秒钟过后将该值为60。\n\
    \    - 新创建进程的P_CPU值为0，因而具有较高的优先级。\n  - 用户设置部分：P_nice是用户可以通过系统调用设置的一个优先级偏移值。默认为20。超级用户可以设置其在0到39之间，而普通用户只能增大该值（即降低优先级）。\n\
    \n## 核心优先级\n\n- 内核把进程阻塞事件与一个睡眠优先级（0~49）联系起来；当进程从阻塞中醒来时，可及时进行处理。核心优先级分为可中断和不可中断两类优先级。当一个软中断信号到达时，若进程正在可中断优先级上阻塞，则进程立即被唤醒；若正在不可中断优先级上，则继续阻塞。其中：\n\
    \  - 不可中断优先级：对换，等待磁盘I/O，等待缓冲区，等待文件索引结点——关键操作，应该很快完成\n  - 可中断优先级：等待tty（虚终端）I/O，等待子进程退出\n\
