  - '[PAGE 224]


    # 反置页表(Inverted page table)


    +   - 反置页表不是依据进程的逻辑页号来组织，而是依据该进程在内存中的物理页面号来组织（即：按物理页面号排列）。


    +   - 每个进程一个反置页表，通过哈希表(hash table)查找可由逻辑页号得到物理页面号。虚拟地址中的逻辑页号通过哈希表指向反置页表中的表项链头（因为哈希表可能指向多个表项），得到物理页面号。


    +   - 反置页表的大小只与物理内存的大小相关，与逻辑空间大小和进程数无关。


    +   - 如PowerPC, IBM AS/400'
