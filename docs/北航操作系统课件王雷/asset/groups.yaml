    - CLONE_FS: 父子进程共享同一个文件系统。\n- CLONE_FILES: 父子进程共享打开的文件。\n- CLONE_SIGHAND。父子进程共享信号处理句柄。\n\
    - CLONE_PID。父子进程共享pid\n\n## 思考题问题\n\n- 什么情况下不适合用多线程？\n\n## 计算机操作系统\n\n教师：王雷\n\n\
