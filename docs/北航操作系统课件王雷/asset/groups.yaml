    +     - 逻辑页号（本进程的地址空间）→物理页号（实际内存空间）；\n\n+   - **物理页面表**：整个系统有一个物理页面表，描述物理内存空间的分配使用状况。\n\
    +     - 数据结构：位示图、空闲页面链表；\n\n+   - **请求表**：整个系统有一个请求表，描述系统内各个进程页表的位置和大小，用于地址转换，也可以结合到各进程的PCB里；\n\
    \n## 页表 (page table)\n\n| 页号 | 页框号 |\n|---:|---:|\n| 0 | 0 |\n| 1 | 1 |\n| 2 |\
    \ 2 |\n| 3 | 3 |\n\nProcess A\n\n| 页号 | 页框号 |\n|---:|:---:|\n| 0 | --- |\n| 1\
