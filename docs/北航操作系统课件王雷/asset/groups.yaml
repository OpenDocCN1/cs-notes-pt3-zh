    - 对于多分区卷来说就复杂多了，因为组成卷的分区可以是不连续的分区，甚至可以在不同的磁盘中。有一些多分区卷使用数据冗余技术，所以它们需要更多的卷到磁盘的转换工作。\n\
    \n## 多重分区管理\n\n- 跨分区卷(spanned volume)\n- 条带卷（striped volume）\n- 镜像卷（mirrored volume）\n\
    - 廉价冗余磁盘阵列5卷（RAID-5 volume）\n\n## 跨分区卷\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_975_0.png)\n\
    \nC: 100MB\n\nD: 50MB\n\nNTFS\nVOLUME 1\n\nNTFS\nVOLUME 2\n\nD: 50MB\n\nE: 100MB\n\
    \nNTFS\nVOLUME 2\n\nNTFS\nVOLUME 3\n\n- 一个单独的逻辑卷，最多由在一个或多个磁盘上的32个空闲分区组成。\n- 跨分区卷可以用来把小的磁盘空闲区域，或者把两个或更多的小磁盘组成大的卷。\n\
    - 卷管理器对Windows Server 2003的文件系统隐藏了磁盘物理配置信息。\n\n## 条带卷（RAID-0卷）\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_977_0.png)\n\
    \n北京航空航天大学\n\n计算机学院\n\n王雷\n\n- 一系列分区组成的单独的逻辑卷，最多有32个分区并且每个盘一个分区。\n- 条带卷中的一个分区不需要占据整个磁盘，唯一的限制是每个盘上的分区大小相同\n\
    - 数据能够被平均分配到每个磁盘上\n\n- 一个磁盘上分区的内容被复制另一磁盘与它等大小的分区中。镜像卷有时也被称为 RAID-1。\n\n- 镜像卷能够可以在主分区和镜像分区之间平衡\
    \ I/O 操作。两个读操作可以同时进行，所以理论上只用一半时间就可以完成。当修改一个文件时，必须写入镜像卷的两个分区，但是磁盘写操作可以异步进行，所以用户态程序的性能一般不会被这种额外的磁盘更新所影响。\n\
    \n- 镜像卷是唯一一种支持系统卷和引导卷的多分区卷。\n\n## 廉价冗余磁盘阵列5卷\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_981_0.png)\n\
