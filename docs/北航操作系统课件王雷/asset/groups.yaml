    ## 页式和段式系统的区别

    - 页是信息的物理单位，段是信息的逻辑单位，它含有一个相对完整的信息

    - 页的大小由自由系统决定，段的长度是不固定的，决定于用户所编写的程序。

    - 页式系统地址空间是一维的，分段的作业地址空间是二维的。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_461_0.png)


    ## 局部性原理

    - 程序在执行时，大部分是顺序执行的指令，少部分是转移和过程调用指令。

    - 过程调用的嵌套深度一般不超过5，因此执行的范围不超过这组嵌套的过程。

    - 程序中存在相当多的循环结构，它们由少量指令组成，而被多次执行。

    - 程序中存在相当多对一定数据结构的操作，如数组操作，往往局限在较小范围内。


    ## 虚拟存储的基本原理

    - 在程序装入时，不必将其全部装入到内存，而只需将当前需要执行的部分页或段读入到内存，就可让程序开始执行。

    - 在程序执行过程中，如果需执行的指令或访问的数据尚不在内存（称为缺页或缺段），则由处理器通知操作系统将相应的页或段调入到内存，然后继续执行程序。

    - 另一方面，操作系统将内存中暂时不使用的页或段调出保存在外存上，从而腾出空间存放将要装入的程序以及将要调入的页或段


    ## 优点

    - 可在较小的可用内存中执行较大的用户程序；

    - 可在内存中容纳更多程序并发执行；

    - 不必影响编程时的程序结构（与覆盖技术比较）

    - 提供给用户可用的虚拟内存空间通常大于物理内存(real memory)


    ## 请求分页系统

    - 在运行作业之前，只要求当前需要的一部分页面装入内存。当需要其它的页时，可以按需选择一些页交换到辅存去，同时把所需的页调入主存。

    - 虚拟存储系统：控制自动页面交换而用户意识不到的那个机构，成为虚拟存储系统。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_465_0.png)


    ## 页表机制

    - 存在位（present bit，内存页和外存页）

    - 修改位(modified bit)

    - 访问统计：在近期内被访问的次数，或最近一次访问到现在的时间间隔外存地址


    ## 页面调入策略

    - 请求式提取

    - 预先调页

    - 系统对换区

    - 从文件调入


    ## 置换策略

    - 固定分配局部置换

    - 可变分配全局置换

    - 可变分配局部置换


    ![](img/861c0ad57b0249095c0356c9e5a83b26_468_0.png)

    ![](img/861c0ad57b0249095c0356c9e5a83b26_468_1.png)


    ## 置换算法

    - 最佳策略

    - 先进先出算法

    - 最近最久未使用

    - Clock算法

    - 最不常用算法

    - 页面缓冲算法


    ## 工作集策略(working set strategy)

    - 引入工作集的目的是依据进程在过去的一段时间内访问的页面来调整常驻集大小。

    - 工作集大小的变化：进程开始执行后，随着访问新页面逐步建立较稳定的工作集，当内存访问的局部性区域的位置大致稳定时，工作集大小也大致稳定，局部性区域的位置改变时，工作集会快速扩张和收缩过渡到下一个稳定值。


    ## 请求分段式

    - 在简单段式存储管理的基础上，增加请求调段和段置换功能。

    - 地址变换和缺段中断：指令和操作数必定不会跨越在段边界上


    ## 磁盘存储器管理

    - 分配空间

    - 提高磁盘储存空间的利用率

    - 提高I/O速度

    - 保证文件系统的可靠性


    ## 磁盘的类型

    - 固定头磁盘

    - 移动头磁盘


    ## 磁盘调度算法

    - 先来先服务

    - 最短寻道时间优先


    - 扫描算法

    - 循环扫描算法


    ## RAID

    - 并行交叉存取

    - RAID分级


    ## RAID的优点

    - 可靠性高

    - 磁盘I/O速度高

    - 性能价格比


    ![](img/861c0ad57b0249095c0356c9e5a83b26_478_0.png)


    ## 高速缓存

    - 磁盘高速缓存的形式

    - 数据交付

    - 置换算法

    - 周期性写回


    ![](img/861c0ad57b0249095c0356c9e5a83b26_479_0.png)


    ## 提高磁盘I/O速度的方法

    - 预读（Read-Ahead）

    - 延迟写

    - 虚拟盘（Virtual Disk）


    ## 1989年NT的需求

    - 32位抢占式可重入的虚拟存储操作系统

    - 在多种硬件体系结构上运行

    - 支持对称多处理系统

    - 分布式计算平台

    - 兼容16位DOS、Windows 3.1的应用程序

    - 符合POSIX 1003.1

    - 符合安全性的要求

    - 支持UNICODE


    ## Windows Server 2003 内存管理

    - 组成部分

    - 地址空间的布局

    - 地址转换机制

    - 内存分配方式

    - 缺页处理

    - 工作集

    - 物理内存管理

    - 其他内存相关机制


    ## 组成部分

    - 一组执行系统服务程序，用于虚拟内存的分配、回收和管理。大多数这些服务都是通过Win32 API 或内核态的设备驱动程序接口形式出现。

    - 一个转换无效和访问错误陷阱处理程序用于解决硬件监测到的内存管理异常，并代表进程将虚拟页面装入内存。

    - 六个的关键组件


    - 工作集管理器（16优先）：当空闲内存低于某一界限时，便启动所有的内存管理策略，如：工作集的修整、老化和已修改页面的写入等。

    - 进程/堆栈交换程序（23优先）：完成进程和内核线程堆栈的换入和换出操作。

    - 已修改页面写入器（17优先）：将修改链表上的“脏”页写回到适当的页文件。


    - 映射页面写入器（17优先）：将映射文件中脏页写回磁盘。

    - 废弃段线程（18优先）：负责系统高速缓存和页面文件的扩大和缩小。

    - 零页线程（9优先）：将空闲链表中的页面清零


