  - '[PAGE 20]


    # CS167课程介绍：


    +   - 本课程讨论操作系统的基本原理

    +   - 第一部分为基本概念：多线程设计和并发，动态存储、分配和释放，链接和装入，文件系统和虚存

    +   - 第二部分为操作系统的当前设计概念：微内核和面向对象处理技术

    +   - 最后部分是分布式系统：计算机网络通信协议，远程过程调用协议，计算机安全，并发管理，分布式文件和存储系统'
