  - '[PAGE 514]


    +   - 取页策略：内存管理器利用请求式页面调度算法以及簇方式将页面装入内存

    +   - 置页策略：选择页框位置CPU内存高速缓存不必要的震荡最小

    +   - 换页策略

    +     - 在多处理器系统中，Windows Server 2003采用了局部先进先出置换策略。而在单处理器系统中，Windows Server 2003的实现更接近于最近最少使用策略（LRU）（称为“轮转算法”，用于大多数版本的UNIX）。'
