    有效\n无效：迁移\n无效：磁盘地址\n：修改链表\n：前向指针\n后向指针\n```\n\nMicrosoft® Windows® 2000/XP\n\n\
    ```\n零初始化\n空闲\n后备\n坏\n修改\n修改不写入\n页框号数据库\n当前\n当前\n当前\n```\n\n## 锁内存\n\n- 设备驱动程序可以调用核心态函数\
    \ `MmProbeAndLockPages`、`MmLockPagableCodeSection`、`MmLockPagableDataSection`，或者\
    \ `MmLockPagableSectionByHandle`。\n- Win32 应用程序可以调用 `VirtualLock` 函数锁住进程工作集中的页面。\n\
    \n## 内存保护机制\n\n- 所有系统范围内核心态组件使用的数据结构和内存缓冲池只能在核心态下访问。\n- 每个进程有一个独立、私有的地址空间，禁止其它进程的线程访问。\n\
    - 支持的处理器还提供了一些硬件内存保护措施（如读/写、只读等）。\n- 共享内存区域对象具有标准的 Windows Server 2003 访问控制列表（ACLs）。\n\
