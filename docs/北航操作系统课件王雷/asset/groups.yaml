    # # 批处理系统


    +   - 分类：

    +     - 单道批处理系统：无须作业调度和进程调度；内存仅有一道作业；顺序完成

    +     - 多道批处理系统：作业调度和进程调度；内存有多道作业；非顺序完成

    +     - 远程批处理系统


    +   - 优点：

    +     - 系统吞吐量大

    +     - 资源利用率高


    +   - 缺点：

    +     - 平均周转时间长

