    # 高速缓存的数据结构


    +   - 在系统高速缓存的每个 256 KB 的槽由一个 VACB 描述。

    +   - 每个打开的被缓存文件有一个专用的缓存映射，里面包含了用于控制文件预读的信息。

    +   - 每个被缓存的文件有一个单独的共享缓存映射结构，它指向系统缓存中包含此文件映射视图的槽。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_563_0.png)'
