    \  - 只能调用直接下层\n  - 可以调用所有下层\n  - 可以部分调用下层。\n\n## 层次结构的层间关系\n\n第3层\n\n第2层\n\n第1层\n\
    \n第0层\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_101_0.png)\n\n## 层次结构\n\n- 层次结构设计方法的核心思想\n\
    - 例如E.W.Dijkstra的THE系统：\n\n|  |  |\n|---|---|\n| 5 | 操作员 |\n| 4 | 用户程序 |\n| 3\
    \ | 输入/输出管理 |\n| 2 | 操作员—进程通信 |\n| 1 | 内存和磁盘管理 |\n| 0 | 处理器分配和多道程序 |\n\n## 虚拟机结构\n\
    \n- 如IBM大型机上的系列操作系统\n- 基本思想：系统应该提供 1）多道程序能力 2）一个比裸机有更方便扩展界面的计算机。但是二者的实现应该相互独立\n\
    - 优缺点\n  - 虚拟机概念可以实现完全保护\n  - 用软件将硬件逐层扩展\n  - 虚拟机方法把多道程序和扩充机器的功能完全分开了，使每一部分都简单、灵活，更易于维护。\n\
