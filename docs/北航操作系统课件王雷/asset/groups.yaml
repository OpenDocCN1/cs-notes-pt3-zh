  - '[PAGE 789]


    # NT的I/O系统结构


    +   - I/O子系统：实现文件性的I/O函数；NT I/O系统提供的I/O特性有：

    +     - 通常的打开、关闭、读写函数；

    +     - 异步I/O：应用进程在发出I/O请求后，不需等待I/O完成，可继续其它工作；

    +     - 映射文件I/O：把文件作为进程虚拟空间的一部分进行直接访问；

    +     - 快速I/O：不通过I/O管理器，直接向驱动程序发出I/O请求；'
  - '[PAGE 790]


    +   - I/O管理器：依据抽象I/O操作建立和传送I/O请求包（IRP）；

    +   - 核心态设备驱动程序：将I/O请求包转化为对硬件设备的特定控制请求；

    +   - 驱动程序支持例程：提供设备驱动程序调用，以完成I/O请求；

    +   - 硬件抽象层I/O访问例程：隔离驱动程序与硬件平台，以提高可移植性（同体系结构上的源代码可移植和NT支持平台间的源代码可移植）。'
