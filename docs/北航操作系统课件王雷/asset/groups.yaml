    - 现代操作系统将资源拥有者称为进程（process, task）\n- 可执行单元称为线程。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_313_0.png)\n\
    \n## 引入线程的目的\n\n- 减小进程切换的开销\n- 提高进程内的并发程度\n- 共享资源\n\n- 进程：\n  - 创建进程\n  - 撤消进程\n\
    \  - 进程切换\n\n- 线程：\n  - 进程中的一个实体\n  - 是一个CPU调度和分派的单位\n  - 基本上不拥有资源，只有必不可少的少量资源\n\
    \  - 可以与其他同进程的线程共享进程拥有的所有资源\n\n- 引入进程好处\n  - 多个程序可以并发执行，改善资源使用率，提高系统效率\n- 引入线程好处\n\
    \  - 减少并发程序执行时所付出的时空开销，使得并发粒度更细、并发性更好\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_317_0.png)\n\
    \n单线程\n\n多线程\n\n## 每个线程有自己的栈\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_318_0.png)\n\
    \n## Word\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_319_0.png)\n\n键盘\n\n内核\n\
    \n磁盘\n\n## Web\n\nWeb服务器进程\n\n调度线程\n\n工作线程\n\n网页缓存\n\n用户空间\n\n内核\n\n内核空间\n\n网络连接\n\
    \n- MS DOS是单进程、单线程系统；\n- UNIX是多进程系统，但每个进程一个线程；\n- JAVA是单进程、多线程系统；\n- NT、OS/2、SALORIS、MACH是多进程和多线程系统，每个进程有多个线程。\n\
    \n## 进程与线程的关系\n\n- 1：1（UNIX系统）\n- 1：M（NT、OS/2、SALORIS、MACH）\n- M：M（TRIX）\n- M：1\n\
    \n## 线程的实现方式\n\n- 用户线程\n- 内核线程\n\n- 用户线程是在用户空间中，通过库模拟的线程，不需要或仅需要极少的内核支持，上下文切换比较快，因为不用更改页表等等东西，使用起来较为轻便快速。用户线程提供操控视窗系统的绝佳解决方案。\n\
    - 示例：\n  - POSIX Pthreads\n  - Mach C-threads\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_325_0.png)\n\
    \n- 内核线程就是内核有好几个分身，每个分身可以处理一件事的意思。这用来处理同步事件很有用，内核可以对每个非同步事件生个分身来处理。内核线程的操作非常轻便，几乎没有负担，而且对内核的结构有帮助，支持内核线程的内核称作多线程内核。\n\
    \n- 示例：Windows 95/98/NT/2000，Solaris，Tru64 UNIX，Linux\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_327_0.png)\n\
    \n## 一对一模型\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_330_0.png)\n\n## 多对多模型\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_331_0.png)\n\n## 线程编程问题—全局变量\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_332_0.png)\n\
    \n## 线程局部变量\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_333_0.png)\n\n## Pthreads\n\
    \n- 用于线程创建和同步的 POSIX 标准（IEEE 1003.1c）API。\n- API 规定了线程库的行为，具体实现由线程库的开发决定。\n- 在\
    \ UNIX 操作系统中常见。\n\n## Solaris 2 线程\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_335_0.png)\n\
    \n- Linux并不确切区分进程与线程，而将线程定义为“执行上下文”，它实际只是同一个进程的另外一个执行上下文而已。对于调度，仍然可以使用进程的调度程序。Linux的内核进程，使用kernel_thread创建，一般被称作线程。\n\
    \n- 有两个系统调用可用以建立新的进程：fork 与 clone。fork 一般用以创建普通进程，而 clone 可用以创建线程，内核线程便是通过 sys_clone\
    \ 来创建新的内核进程。fork 与 clone 都调用 do_fork 函数执行创建进程的操作。fork 并不指定克隆标志，而 clone 可由用户指定克隆标志。克隆标志有\
    \ CLONE_VM、CLONE_FS、CLONE_FILES、CLONE_SIGHAND 与 CLONE_PID 等，这些克隆标志分别对应相应的进程共享机制。而\
    \ fork 创建普通进程则使用 SIGCHILD 标志。\n\n- CLONE_VM。父子进程共享同一个mm_struct结构，这个克隆标志用以创建一个线程。由于两个进程都使用同一个mm_struct结构，于是这两个进程的指令、数据都共享，也就是将线程视为同一个进程的不同执行上下文。\n\
    - CLONE_FS: 父子进程共享同一个文件系统。\n- CLONE_FILES: 父子进程共享打开的文件。\n- CLONE_SIGHAND。父子进程共享信号处理句柄。\n\
    - CLONE_PID。父子进程共享pid\n\n## 思考题问题\n\n- 什么情况下不适合用多线程？\n\n## 计算机操作系统\n\n教师：王雷\n\n\
    助教：王振 赵玉龙 王宇 王鲁俊\n\n82316284，wanglei@buaa.edu.cn，http://219.224.165.31\n\n"
