    \n## 进程的基本概念\n\n- 多道程序设计技术、分时系统要求能够描述程序的动态特性，需要引入新概念。\n- MULTICS和IBM的CTSS360中首先引入了进程的概念。*\n\
    \n## 进程的定义和特征\n\n- 进程是程序的一次执行；\n- 进程是可以和别的计算并发执行的计算；\n- 进程可定义为一个数据结构，以及能在其上进行操作的一个程序；\n\
    - 进程是一个程序及其数据在处理机上顺序执行时所发生的活动；\n- 进程是程序在一个数据集合上运行的过程，它是系统进行资源分配和调度的一个独立单位。\n\n\
    ## 进程的特征\n\n- 动态性\n- 并发性\n- 独立性\n- 异步性\n- 结构特征：程序段，数据段，进程控制块PCB\n\n## 一个进程应该包括\n\
    \n- 程序的代码；\n- 程序的数据；\n- PC中的值，用来指示下一条将运行的指令；\n- 一组通用的寄存器的当前值，堆、栈；\n- 一组系统资源（如打开的文件）\n\
    \n## 进程与程序的区别\n\n- 进程是动态的，程序是静态的：程序是有序代码的集合；进程是程序的执行。通常进程不可在计算机之间迁移；而程序通常对应着文件，是静态的，可以复制。\n\
    - 进程是暂时的，程序是永久的：进程是一个状态变化的过程，程序可长久保存。\n- 进程与程序的组成不同：进程的组成包括程序、数据和进程控制块（即进程状态信息）。\n\
    - 进程与程序的对应关系：通过多次执行，一个程序可对应多个进程；通过调用关系，一个进程可包括多个程序。\n\n有一个计算机科学家，有一天女儿过生日，想亲手给女儿做一个生日蛋糕。所以他就找了一本有关做蛋糕的食谱，买了一些原料，面粉、鸡蛋、糖、香料等，然后边看边学边做。\n\
    \n食谱＝程序；科学家＝CPU；\n原料＝数据；做蛋糕＝进程，\n\n这时小儿子哭着跑进来，说手被蜜蜂蛰了。教授只好把蛋糕先放在一边。他在食谱上做了个标记，把状态信息记录了起来。然后又去找了一本医疗手册，查到了相关的内容，按照上面的指令一步步地执行。当伤口处理完之后，又回到厨房继续做蛋糕。\n\
    \nCPU从一个进程（做蛋糕）切换到另一个进程（医疗救护）。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_358_0.png)\n\
    \n## 进程控制\n\n- 进程控制的主要任务是创建和撤销进程，以及实现进程的状态转换。由内核来实现。\n\n## 进程的创建\n\n- 提交一个批处理作业\n\
    - 用户登录\n- 由OS创建，用以向一个用户提供服务\n- 由已存在的一进程创建\n\n## 进程撤消\n\n- 用户退出登录\n- 进程执行一中止服务请求\n\
    - 出错及失败因素\n- 正常结束\n- 给定时限到\n- ……\n\n- 进程图\n- 创建原语 (fork, exec)\n- 撤消原语 (kill)\n\
    \  - 释放资源、撤消子进程、重新调度。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_362_0.png)\n\
    \n- 原语：由若干条指令所组成的指令序列，来实现某个特定的操作功能\n  - 指令序列执行是连续的，不可分割\n  - 是操作系统核心组成部分\n  -\
    \ 必须在管态（内核态）下执行，且常驻内存\n- 与系统调用的区别\n\n```\n#include <sys/types.h>\nint     glob\
    \ = 6;          /* external variable in initialized data */\n\nint\nmain(void)\n\
