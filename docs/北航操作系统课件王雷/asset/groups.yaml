    - 比较不同类型进程间IPC的优缺点。\n\n# # IPC概述\n\n- IPC历史\n  - AT&T的贝尔实验室：System V IPC，通信进程局限在单个计算机内。\n\
    \  - BSD的加盟大学伯克利分校的软件发布中心：基于套接字（Socket）的进程间通信机制。\n  - 电子电气工程协会（IEEE）：POSIX\n-\
    \ SolarisIPC\n  - Solaris则把两者（SYSTEM V和BSD）都继承了下来，并用于不同场合。POSIX放在了函数库中。\n  - 都有轻微变动和增加。\n\
    - WindowsIPC\n\n# IPC概述\n\n- 管道（Pipe）及命名管道（Named pipe或FIFO）\n- 消息队列（Message）\n\
    - 共享内存（Shared memory）\n- 信号量（Semaphore）\n- 套接字（Socket）\n- 信号（Signal）\n\n# 进程间通信\n\
    \n- 低级通信：只能传递状态和整数值（控制信息），包括进程互斥和同步所采用的信号量和管道机制。缺点：\n  - 传递信息量小：效率低，每次通信传递的信息量固定，若传递较多信息则需要进行多次通信。\n\
    \  - 编程复杂：用户直接实现通信的细节，编程复杂，容易出错。\n- 高级通信：能够传送任意数量的数据，包括三类：管道、共享内存、消息系统等。\n\n#\
    \ 管道(pipe)\n\n- 管道是一条在进程间以字节流方式传送的通信通道。它由OS核心的缓冲区（通常几十KB）来实现；常用于命令行所指定的输入输出重定向和管道命令。在使用管道前要建立相应的管道，然后才可使用。\n\
    - 互斥、同步、对方是否存在。\n\n- 通常的管道例如POSIX管道是半双工的，数据只能向一个方向流动；需要双方通信时，需要建立起两个管道；而Solaris中的管道是全双工的，这些管道是基于STREAMS的。\n\
    - 管道只能用于父子进程或者兄弟进程之间（具有亲缘关系的进程）。\n- 管道单独构成一种独立的文件系统：管道对于管道两端的进程而言，就是一个文件，但它不是普通的文件，它不属于某种文件系统，而是自立门户，单独构成一种文件系统，并且只存在在内存中。\n\
    \n- 管道两端分别用描述符 `fildes[0]` 以及 `fildes[1]` 相关联。\n\n- 管道创建时两个各自的描述符 `O_NDELAY`、`O_NONBLOCK`\
    \ 和 `FD_CLOEXEC` 标志都被清空。\n\n- 从 `fildes[0]` 读取的是从 `fildes[1]` 写入的数据；从 `fildes[1]`\
    \ 读取的是从 `fildes[0]` 写入的数据。\n\n- 都是按先进先出的方式来操作。\n\n- Solaris 是可以自写自读的（但没有意义）。\n\
    \n父进程创建一个子进程\n通过管道向子进程发送命令\n\n管道fd[1]\n\n子进程创建一个FIFO\n子进程从管道fd[0]读取命令\n得到命令后向FIFO写入数据\n\
    \n写入数据\n\nFIFO\n\n阻塞读\n\n进程从FIFO读取数据\n\n# Windows NT举例\n\n- 无名管道：类似于UNIX管道，CreatePipe可以创建无名管道，得到两个读写句柄；利用ReadFile和WriteFile可进行无名管道的读写；\n\
    \n```\nBOOL CreatePipe(\n    PHANDLE hReadPipe,       // address of variable for\
    \ read handle\n    PHANDLE hWritePipe,      // address of variable for write handle\n\
    \    LPSECURITY_ATTRIBUTES lpPipeAttributes, // pointer to security attributes\n\
    \    DWORD nSize              // number of bytes reserved for pipe\n);\n```\n\n"
