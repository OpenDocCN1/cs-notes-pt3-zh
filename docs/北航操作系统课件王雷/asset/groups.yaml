- raw:
  - '[PAGE 911]


    # MBR组成


    +   - 主引导程序代码，占446字节

    +   - 硬盘分区表DPT，占64字节

    +   - 主引导扇区结束标志AA55H'
  - '[PAGE 912]


    # 启动过程


    +   - 启动PC机时，自举程序INT 19H

    +   - 读系统磁盘0柱面、0磁头、1扇区的主引导扇区MBR的内容到内存指定单元：7C00首地址开始的区域

    +   - 执行MBR程序段。

    +     - 扫描分区表查找活动分区；

    +     - 寻找活动分区的起始扇区；

    +     - 将活动分区的引导扇区读到内存；

    +     - 执行引导扇区的运行代码。'
  - '[PAGE 913]


    # # 硬盘分区表DPT


    +   - 从偏移01BEH开始到偏移01FDH结束的64字节

    +   - 硬盘分区表分为四个部分，每一个小部分表示一个分区的信息，占16字节

    +   - 第0个字节是自举标志，其值为80H时表示该分区是当前活动分区

    +   - 第4字节是分区类型


    ![](img/861c0ad57b0249095c0356c9e5a83b26_913_0.png)'
