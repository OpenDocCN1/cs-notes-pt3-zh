  md: "\n## I/O通道控制方式(channel control)\n\n- 可以执行由通道指令组成的通道程序，因此可以进行较为复杂的I/O控制。通道程序通常由操作系统所构造，放在内存里。\n\
    - 优点：执行一个通道程序可以完成几组I/O操作。\n\n## 缓冲技术\n\n- 缓冲技术可提高外设利用率。\n- 原因\n  - 匹配CPU与外设的不同处理速度\n\
    \  - 减少对CPU的中断次数。\n  - 提高CPU和I/O设备之间的并行性。\n\n## 单缓冲(single buffer)\n\n- 一个缓冲区，CPU和外设轮流使用，一个处理完之后接着等待对方处理。\n\
    \n## 双缓冲(double buffer)\n\n- 两个缓冲区，CPU和外设都可以连续处理而无需等待对方。要求CPU和外设的速度相近。\n\n## 环形缓冲(circular\
    \ buffer)\n\n- 多个缓冲区，CPU和外设的处理速度可能相差较大。可参见“生产者—消费者问题”，关键是资源量的增减（空或满的缓冲区数目）而不是生产者和消费者的指针移动。\n\
    \n## 过程\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_827_0.png)\n\n## 工作方式\n\n\
    - 收容输入\n- 提取输入\n- 收容输出\n- 提取输出\n\n## 设备分配\n\n- 由于外设资源的有限，需解决进程间的外设共享问题，以提高外设资源的利用率。设备分配是对进程使用外设过程的管理。\n\
    - 这里有两种作法：\n  - 1) 在进程间切换使用外设，如键盘和鼠标；\n  - 2) 通过一个虚拟设备把外设与应用进程隔开，只由虚拟设备来使用设备。\n\
    \n## 数据结构\n\n- 设备控制表(DCT, Device Control Table)：每个设备一张，描述设备特性和状态。反映设备的特性、设备和控制器的连接情况。\n\
    - 控制器控制表(COCT, Controller Control Table)：每个设备控制器一张，描述I/O控制器的配置和状态。如DMA控制器所占用的中断号、DMA数据通道的分配。\n\
    - 通道控制表(CHCT, CHannel Control Table)：每个通道一张，描述通道工作状态。\n- 系统设备表(SDT, System Device\
    \ Table)：系统内一张，反映系统中设备资源的状态，记录所有设备的状态及其设备控制表的入口。SDT表项的主要组成：\n  - DCT指针：指向相应设备的DCT；\n\
    \  - 设备使用进程标识：正在使用该设备的进程标识；\n  - DCT信息：为引用方便而保存的DCT信息，如：设备标识、设备类型等；\n\n## 设备分配时应考虑的因素\n\
    \n- 设备固有属性\n- 设备分配算法\n- 设备分配中的安全性\n\n## 设备固有属性\n\n- 独占\n- 共享\n- 独享设备\n- 共享设备\n\
    - 虚拟设备\n\n## 设备分配算法\n\n- 先来先服务\n- 优先级高者优先\n\n## 设备分配中的安全性\n\n- 安全分配方式\n- 不安全分配方式\n\
    \n## 设备独立性\n\n- 设备分配灵活\n- 易于实现I/O重定向\n\n## 标准接口\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_838_0.png)\n\
    \n## 设备无关的缓冲\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_839_0.png)\n\nUser process\n\
    \nUser space\n\nKernel space\n\nNetwork controller\n\nNetwork\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_840_0.png)\n\
    \n## 逻辑设备名到物理设备名映射的实现\n\n- 逻辑设备表\n- LUT的设置\n  - 系统LUT\n  - 用户LUT\n\n## 独占设备分配程序\n\
    \n- 基本设备分配程序\n  - 分配设备\n  - 分配设备控制器\n  - 分配通道\n- 改进\n  - 增加设备独立性\n  - 考虑多通路问题\n\
    \n- SPooling程序和外设进行数据交换可以称为“实际I/O”。一方面，SPOOLing程序预先从外设输入数据并加以缓冲，在以后需要的时候输入到应用程序；另一方面，SPOOLing程序接受应用程序的输出数据并加以缓冲，在以后适当的时候输出到外设。\n\
    - 应用程序进行I/O操作时，只是和SPOOLing程序交换数据，可以称为“虚拟I/O”。这时候的虚拟I/O实际上是从SPOOLing程序的缓冲池中读出数据或把数据送入缓冲池，而不是跟实际的外设进行I/O操作。\n\
    \n## SPOOLing系统组成\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_845_0.png)\n\nVirtual\
    \ I/O\n\nActual I/O\n\nApplication A\n\nApplication B\n\nSPOOLing Program\n\n\
    Device\n\n## 特点\n\n- 高速虚拟I/O操作：应用程序的虚拟I/O比实际I/O速度提高，缩短应用程序的执行时间（尽快完成计算，并释放占用的计算机资源）。另一方面，程序的虚拟I/O操作时间和实际I/O操作时间分离开来。\n\
    - 实现对独享设备的共享：由SPOOLing程序提供虚拟设备，可以对独享设备依次共享使用。\n\n## 举例\n\n- 打印机设备和可由打印机管理器管理的打印作业队列。如：Windows\
    \ NT中，应用程序直接向针式打印机输出需要15分钟，而向打印作业队列输出只需要1分钟，此后用户可以关闭应用程序而转入其他工作，在以后适当的时候由打印机管理器完成15分钟的打印输出而无需用户干预。\n\
    \n## 处理方式\n\n- 为每类设备设置一个进程\n- 整个系统一个I/O进程\n- 不设专门进程\n\n## 设备驱动程序的功能\n\n- 将抽象要求转换为具体要求\n\
    - 检查I/O请求的合法性\n- 发出I/O命令\n- 响应中断请求\n- 构成通道程序\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_850_0.png)\n\
    \n## 特点\n\n- I/O进程与设备控制器之间的通信程序\n- 驱动程序与I/O设备的特性紧密相关\n- 与I/O控制方式紧密相关\n- 与硬件紧密相关\n\
    \n## 中断处理程序处理过程\n\n- 唤醒被阻塞的驱动程序\n- 保存现场\n- 转入设备中断处理程序\n- 进行中断处理\n- 恢复被中断进程的现场\n\
    \n## 电源管理\n\n| Device | Li et al. (1994) | Lorch and Smith (1998) |\n|---|---|---|\n\
    | Display | 68% | 39% |\n| CPU | 12% | 18% |\n| Hard disk | 20% | 12% |\n| Modem\
    \ |  | 6% |\n| Sound |  | 2% |\n| Memory | 0.5% | 1% |\n| Other |  | 22% |\n\n\
    ![](img/861c0ad57b0249095c0356c9e5a83b26_855_0.png)\n\nWindow 1\n\nWindow 2\n\n\
    Zone\n\n(a)\n\nWindow 1\n\nWindow 2\n\n(b)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_856_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_856_1.png)\n\n## UNIX的设备管理\n\n- UNIX的外设与特殊文件对应，由文件系统按文件管理方式进行管理，向上提供一个与文件系统统一的接口。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_858_0.png)\n\n## I/O多路转接\n\n- `while(n=read(STDIN_FILENO,\
    \ buf, BUFSIZE) > 0)`\n  - `if(write(STDOUT_FILENO, buf, n) != n)`\n    - `err_sys(\"\
    write error\");`\n"
