    \n## 特点\n\n- - 结构简单；\n- - 文件多时，目录检索时间长；\n- - 有命名冲突：如多个文件有相同的文件名（不同用户的相同作用的文件）或一个文件有多个不同的文件名（不同用户对同一文件的命名）；\n\
    - - 不便于实现共享\n\n## 二级目录\n\n- 在根目录（第一级目录）下，每个用户对应一个目录（二级目录），在用户目录下是该用户的文件，而不再有下级目录。适用于多用户系统，各用户可有自己的专用目录。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1014_0.png)\n\n## 多级目录\n\n- - 在较高的目录级，其目录表目为下一级目录名以及一个指向其目录的指针。\n\
    \n- - 在最后一级目录，这个指针指向文件的物理地址。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1015_0.png)\n\
    \n## 在多级目录结构中，如何来指定需要访问的文件？\n\n- - 绝对路径名：对于每一个文件或目录，可以用从根目录开始依次经过的各级目录名，再加上最终的文件名或目录名来表示（之间用分隔符隔开）。文件或目录的绝对路径名是唯一的。例如：`\\\
    spell\\mail\\copy\\all`\n- - 当前目录：也叫工作目录，用户可以指定一个目录作为当前的工作目录；\n- - 相对路径名\n\n##\
    \ 多级目录特点\n\n- - **层次清楚**\n  - 不同性质、不同用户的文件可以构成不同子树，便于管理；\n  - 不同用户的文件可以被赋予不同的存取权限，有利于文件的保护\n\
    \  - 数目较多时，便于系统和用户将文件分散管理，使得文件和目录的层次结构较为清晰。适用于大型的文件系统管理；\n- - **解决文件重名问题**\n \
    \ - 文件在系统中的搜索路径由从根开始到文件名为止的各文件名组成，只要在同一目录下的文件名不发生重复就不会由文件重名而引发混乱\n- - **查找速度快**\n\
    \  - 可为每类文件建立一个子目录，由于对多级目录的查找每次只查找最低的一个子集，所以搜索速度快于一级和二级目录\n- - 目录级别太多时，会增加路径检索时间。\n\
    \n- - 目录的主要功能：根据用户给出的ASCII形式的文件名（路径名），迅速地定位到相应的文件控制块。目录的实现需解决以下三个问题：\n  - 目录项的内容；\n\
    \  - 长文件名问题；\n  - 目录的搜索方法。\n\n- - 不同的系统采用不同的实现方法，一般分为两类：\n  - 直接法：目录项=文件名+FCB（属性信息、在外存上的存放位置）。如MS-DOS/Windows；\n\
    \  - 间接法：目录项=文件名+FCB的地址（索引号）。如Unix（inode）；\n  - 不管是何种方法，给定一个文件名，即可返回相应的FCB。\n\n\
    | games | attributes |\n| mail | attributes |\n| news | attributes |\n| work |\
    \ attributes |\n\n(a)\n\n(b)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1021_0.png)\n\
    \n包含属性的数据结构\n\n在MS-DOS中，文件名的最大长度为8个字符，扩展名的最大长度为3个字符；在Unix V7中，文件名的最大长度为14个字符。但是在现代OS当中，一般都支持更长的、可变长度的文件名。实现方法有：\n\
    \n- - 方法1：在目录项中，将文件名的长度固定为255个字符。缺点：浪费空间，很少文件用很长的名字。\n- - 方法2：每个目录项的长度可变，分为三部分：目录项长度、文件的属性信息（此两项长度固定）、文件名（长度可变）。缺点：文件被删除后，该目录项所占用的空间不太好回收利用。\n\
    - - 方法3：目录项本身的长度固定，把长度可变的文件名统一放在目录文件的末尾。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1023_0.png)\n\
    \n## 目录操作\n\n- 1. 创建\n- 2. 删除\n- 3. 打开目录\n- 4. 关闭目录\n- 5. 读取目录\n- 6. 重命名\n- 7.\
    \ 链接\n- 8. 取消链接\n\n## 符号文件目录的查询技术\n\n- - 顺序查寻法：\n  - 依次扫描符号文件目录中的表目，将表目中的名字字段与查找的符号名NAME进行比较（只在表目不多时适用）。\n\
    \n- - Hash方法：\n  - 即一种“散列法”或成“杂凑法”，是一种构造符号表、查询符号表常用的技术。其基本思想是：利用一个易于实现的变换函数（即Hash函数），把每个符号名唯一地变换成符号表中的表目索引。\n\
    \n## 便于共享的目录组织\n\n文件的共享，要求系统能提供某种手段，使存储空间内置保存一份副本，而所有要共享该文件的用户可用相同的或不同的文件名来访问它。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1026_0.png)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1027_0.png)\n\
    \n## 文件系统\n\n- 1. 文件系统定义\n- 2. 采用文件系统方式来管理各种软件资源和其它信息的优点\n- 3. 一个文件系统必须解决的几个主要问题\n\
    - 4. 一个理想文件系统应具有的特性\n\n## 文件系统定义\n\n- - 文件系统定义\n  是指操作系统中与文件管理有关的那部分软件和被管理的文件以及实施管理所需要的一些数据结构的总体。\n\
    \n## 目的\n\n- - 方便的文件访问和控制：以符号名称作为文件标识，便于用户使用；\n- - 并发文件访问和控制：在多道程系统中支持对文件的并发访问和控制；\n\
    - - 统一的用户接口：在不同设备上提供同样的接口，方便用户操作和编程；\n- - 多种文件访问权限：在多用户系统中的不同用户对同一文件会有不同的访问权限；\n\
    - - 优化性能：存储效率、检索性能、读写性能；\n- - 差错恢复：能够验证文件的正确性，并具有一定的差错恢复能力；\n\n## 目的\n\n- - 操作系统为系统管理者和用户提供了对文件的透明存取（按名存取）\n\
    \  - 不必了解文件存放的物理机制和查找方法，只需给定一个代表某段程序或数据的文件名称，文件系统就会自动地完成对给定文件名称相对应的文件的有关操作\n\n"
