  mdcn: "\n\n## 运行级别\n\n| 运行级别 | 脚本目录<br>(Red Hat/Fedora Core) | 状态 |\n|---|---|---|\n\
    | 0 | /etc/rc.d/rc0.d/ | shutdown/halt system |\n| 1 | /etc/rc.d/rc1.d/ | Single\
    \ user mode |\n| 2 | /etc/rc.d/rc2.d/ | Multiuser with no network services exported\
    \ |\n| 3 | /etc/rc.d/rc3.d/ | Default text/console only start. Full multiuser\
    \ |\n| 4 | /etc/rc.d/rc4.d/ | Reserved for local use. Also X-windows (Slackware/BSD)\
    \ |\n| 5 | /etc/rc.d/rc5.d/ | XDM X-windows GUI mode (Red Hat/System V) |\n| 6\
    \ | /etc/rc.d/rc6.d/ | Reboot |\n| s or S |  | Single user/Maintenance mode (Slackware)\
    \ |\n| M |  | Multiuser mode (Slackware) |\n\n## rc#.d 文件\n\n- rc#.d 文件是给定运行级别在启动和关闭期间运行的脚本\n\
    - 脚本位于目录 /etc/rc.d/rc#.d/ 中，其中符号 # 代表运行级别\n\n## 启动/停止守护进程\n\n- 管理员可以发出命令并使用 start、stop、status、restart\
    \ 或 reload 选项\n- 例如，要停止 Web 服务器：\n  - cd /etc/rc.d/init.d/\n  - (or /etc/init.d/\
    \ for SuSE and Debian)\n  - httpd stop\n\n## Linux 文件结构\n\nhttp://www.secguru.com/files/linux_file_structure\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_161_0.png)\n\n## FSSTND: (Filesystem\
    \ standard)\n\n- 所有目录都分组在根目录 \"/\" 下\n- root - root 用户的主目录\n- home - 包含用户的主目录以及服务的目录\n\
    \  - ftp\n  - HTTP\n  - samba\n- **bin** - 启动期间需要的命令，普通用户也可能需要\n- **sbin** - 类似\
    \ bin 但命令不打算供普通用户使用。由 Linux 运行的命令。\n- **proc** - 此文件系统不在磁盘上。它是一个虚拟文件系统，存在于内核的想象中，即内存\n\
    \  - 1 - 包含有关进程号 1 的信息的目录。每个进程在 proc 下都有一个目录。\n- **boot** - 由引导加载程序使用的文件，LILO，内核映像通常保存在这里。\n\
    - **lib** - 根文件系统上程序所需的共享库\n- **modules** - 可加载的内核模块，尤其是在灾难后启动系统所需的模块。\n- **dev**\
    \ - 设备文件\n- **etc** - 特定于机器的配置文件。\n- **skel** - 创建主目录时，它会使用此目录中的文件进行初始化\n- **sysconfig**\
    \ - 配置 Linux 系统以用于设备的<|message|>\n- **var** - 包含邮件、新闻、打印机日志文件、man 页面、临时文件等会更改的文件\n\
    \  - file\n  - **lib** - 系统正常运行时会更改的文件\n  - **local** - 安装在 `/usr/local` 中的程序的可变数据。\n\
    \  - **lock** - 锁文件。由程序使用以指示它正在使用特定设备或文件\n  - **log** - 来自 login 和 syslog 等程序的日志文件，它们记录所有登录和注销。\n\
    \  - **run** - 包含有关系统直到下次启动前有效的信息的文件。\n  - **spool** - 邮件、打印机 spool、新闻和其他 spool\
    \ 工作用的目录。\n  - **tmp** - 临时文件，它们很大或需要在 `/tmp` 中存在的时间更长。\n  - **catman** - 按需格式化的\
    \ man 页面的缓存。\n- mnt - 系统管理员临时挂载的挂载点。\n- tmp - 临时文件。启动后运行的程序应使用 /var/tmp\n\n##\
    \ 远程启动\n\n- 客户端在启动前，既无操作系统，又无启动的软盘或者硬盘，它只有计算机的基本部件：CPU、内存、主板等。但必须有网卡和启动的 Boot\
    \ ROM。因此客户机只能通过网络获得操作系统。Linux 的远程启动基于标准的 BOOTP/DHCP 和 TFTP 协议，并通过 NFS 文件系统建立文件系统。\n\
    - 客户端开机后，在 Boot ROM 获得控制权之前先做自我测试（BIOS 自检）。\n- Boot ROM 送出 BOOTP/DHCP 要求而取得 IP。\n\
    - 如果服务器收到客户端所送出的要求，就会送回 BOOTP/DHCP 回应，内容包括 IP 地址、预设网关及开机镜像文件。\n- Boot ROM 由 TFTP\
    \ 通讯协议从服务器下载开机镜像文件。\n\n"
