    # 假脱机技术


    +   - 利用假脱机技术 (SPOOLing, Simultaneous Peripheral Operation On Line, 也称为虚拟设备技术)
    可把独享设备转变成具有共享特征的虚拟设备，从而提高设备利用率。

    +   - 引入

    +     - 在多道程序系统中，专门利用一道程序 (SPOOLing程序) 来完成对设备的I/O操作。

    +     - 无需使用外围I/O处理机。'
  - '[PAGE 753]


    +   - SP00Ling程序和外设进行数据交换，可以称为“实际I/O”。一方面，SP00Ling程序预先从外设输入数据并加以缓冲，在以后需要的时候输入到应用程序；另一方面，SP00Ling程序接受应用程序的输出数据并加以缓冲，在以后适当的时候输出到外设。

    +   - 应用程序进行I/O操作时，只是和SP00Ling程序交换数据，可以称为“虚拟I/O”。这时候的虚拟I/O实际上是从SP00Ling程序的缓冲池中读出数据或把数据送入缓冲池，而不是跟实际的外设进行I/O操作。'
