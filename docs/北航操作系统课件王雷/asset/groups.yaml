    ## 文件系统的注册


    ![](img/861c0ad57b0249095c0356c9e5a83b26_1098_0.png)


    ## 文件系统的挂装和卸载


    - 1. 寻找对应的文件系统信息。VFS 通过 `file_systems`，在由 `file_system_type` 组成的链表中，根据指定的文件系统名称搜索文件系统类型信息。

    - 2. 如果在上述链表中找到匹配的文件系统，则说明内核具有对该文件系统的内建支持。否则，说明该文件系统可能由可装载模块支持，VFS 会请求内核装入相应的文件系统模块，此时，该文件系统在
    VFS 中注册并初始化。

    - 3. 不管是哪种情况，如果 VFS 无法找到指定的文件系统，则返回错误。

    - 4. VFS 检查给定的物理块设备是否已经挂装。如果指定的块设备已被挂装，则返回错误。


    - VFS 查找将作为新文件系统挂装点的目录所对应的 VFS 索引节点。该 VFS 索引节点可能在索引节点高速缓存中，也有可能需要从挂装点所在的块设备中读取。


    - 如果该挂装点已经挂装有其他文件系统，则返回错误。因为同一目录只能同时挂装一个文件系统。


    - VFS 挂装代码为新的文件系统分配超块，并将挂装信息传递给该文件系统的超块读取例程。系统中所有的 VFS 超块保存在 `super_blocks` 指向的
    `super_block` 数据结构指针数组中。


    - 文件系统的超块读取例程将对应文件系统的信息映射到 VFS 超块中。如果在此过程中发生错误，例如所读取的超块幻数和指定的文件系统不一致，则返回错误。


