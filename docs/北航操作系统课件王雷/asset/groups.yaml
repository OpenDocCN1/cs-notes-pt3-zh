    \n## 基本术语\n\n- 盘（DISKS）：一种物理存储设备，如硬盘、3.5 英寸软盘、光盘。\n- 盘被分为扇区（SECTOR），扇区是可寻址的大小固定的块。扇区的大小是由硬件决定的。目前所有\
    \ x86 处理器的硬盘扇区大小为 512 字节。光盘的扇区一般为 2048 字节。未来的 x86 系统可能支持更大的硬盘扇区。\n- 分区是盘上连续扇区的集合，分区表或其他盘管理数据库中保存了分区的起始扇区、大小和其他特性。\n\
    - 简单卷（SIMPLE VOLUME）是这样一种对象，它代表文件系统驱动程序作为一个独立单元所管理的、来自一个分区的扇区。\n- 多分区卷（MULTIPARTITION\
    \ VOLUME）是这样一种对象，它代表文件系统驱动程序作为一个独立单元所管理的、来自多个分区的扇区。多分区卷提供简单卷所不支持的更好的性能、可靠性和大小特性。\n\
    \n## 基本盘和动态盘的概念\n\n- Windows 2000 把基于 MS-DOS 分区表的盘称为基本盘。\n- 动态盘对 Windows 2000\
    \ 来说是一个新的概念，它实现了比基本盘更具适应性的分区机制。\n\n## 基本盘和动态盘之间的不同点\n\n- 动态盘支持创建新的多分区卷。\n- 基本盘的多分区卷的配置信息保存在注册表中。动态盘的多分区卷的配置信息保存在磁盘中。\n\
