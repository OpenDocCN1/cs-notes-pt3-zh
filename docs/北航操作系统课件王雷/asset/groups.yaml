    # How does the processor actually talk to the device?


    ![](img/861c0ad57b0249095c0356c9e5a83b26_721_0.png)


    +   - **CPU interacts with a _Controller_**

    +     - Contains a set of _registers_ that can be read and written

    +     - May contain memory for request queues or bit-mapped images

    +   - Regardless of the complexity of the connections and buses, processor accesses
    registers in two ways:

    +     - **I/O instructions:** in/out instructions

    +       - Example from the Intel architecture: `out 0x21, AL`

    +     - **Memory mapped I/O:** load/store instructions

    +       - Registers/memory appear in physical address space

    +       - I/O accomplished with load and store instructions'
