    # inode


    ![](img/861c0ad57b0249095c0356c9e5a83b26_1083_0.png)'
  - '[PAGE 1084]


    +   - **模式**：该数据域包含索引节点所描述的对象类型，以及用户的许可信息。在 Ext2 中，每个节点描述一个文件、目录、符号链接、块设备、字符设备或一个
    FIFO。


    +   - **所有者信息**：文件或目录所有者的用户和组标识符。


    +   - **大小**：文件以字节为单位的大小。


    +   - **时间戳**：该索引节点的创建时间以及索引节点的最后改动时间。


    +   - **数据块**：包含索引节点所描述的数据的数据块指针。对于前 12 个数据块指针来说，它们指向的数据块是包含实际文件数据的数据块，而后面的三个指针则包含间接数据块指针。'
  - '[PAGE 1085]


    # Ext2 文件系统的超块


    +   - 文件系统的超块（Superblock）包含了文件系统的基本大小和形式。其中包含的数据由文件系统管理程序用来进行文件系统的维护。每个块组中包含有相同的超块信息，但通常只需读取块组
    0 的超块。'
  - '[PAGE 1086]


    +   - 幻数 幻数用来标识超块的类型。文件系统的挂装软件可据此判断是否为有效的 Ext2 文件系统超块。当前的 Ext2 文件系统幻数为 0xEF53。


    +   - 修订级别 包含两个数据，分别为主修订级别和次修订级别。文件系统的挂装软件可据此判断文件系统是否支持某种特定的功能。实际上，该信息作为兼容性标志而存在。'
  - '[PAGE 1087]


    +   - 挂装计数和最大挂装计数 利用这两个信息，系统可以判断文件系统是否需要彻底检验。文件系统每挂装一次，挂装计数加1。如果挂装计数达到最大挂装计数，则系统会提示应进行检查。

    +   - 组块编号 保存该超块的组块编号。

    +   - 数据块大小 文件系统的数据块大小，以字节为单位。

    +   - 每组的数据块个数 每组的数据块个数，该值在建立文件系统时设置并保持不变。'
  md: "\n## 安全性的设计原则\n- 系统设计必须公开\n- 缺省属性应该不可访问\n- 检查当前权限\n- 给每个进程赋予一个最小的可能权限\n- 保护机制应简单一致，嵌入到系统底层\n\
    - 采取的方案必须可接受\n\n## 对文件的各种操作\n- 文件的使用\n- 文件控制块\n\n## 文件的使用\n- 建立文件\n- 打开文件\n- 写文件\n\
    - “添加” 命令\n- 读文件\n- 修改纪录\n- 拷贝文件\n- “搬家” 命令\n- 删除文件\n- 关闭文件\n\n## 文件系统加载\n![](img/861c0ad57b0249095c0356c9e5a83b26_1063_0.png)\n\
    \n## Mount Point\n![](img/861c0ad57b0249095c0356c9e5a83b26_1064_0.png)\n\n## 计算机操作系统\n\
    教师：王雷\n助教：王振 赵玉龙 王宇 王鲁俊\n82316284，wanglei@buaa.edu.cn，http://219.224.165.31\n\n\
    ## MS DOS的文件系统\n- 多级目录\n- 无文件别名\n- 无用户访问权限控制\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1067_0.png)\n\
    \n- 文件卷(volume)信息：记录在引导记录的扇区中。包括：簇大小，根目录项数目，FAT表大小，磁盘参数（每道扇区数，磁头数），文件卷中的扇区总数，簇编号长度等\n\
    - 逻辑扇区号：三元组（柱面号，磁头号，扇区号）->一个文件卷中从0开始对每个扇区编号，优点：屏蔽了物理磁盘参数的不同\n- 允许同时访问的文件卷数目上限可以由config.sys文件中的LASTDRIVE=\
    \ 语句指定\n\n- 簇 (cluster)：由若干个扇区组成。在文件卷中从 0 开始对每个簇编号。\n- 对簇大小的讨论\n  - 文件卷容量越大，若簇的总数保持不变即簇编号所需位数保持不变，则簇越大。缺点：簇内碎片浪费越多\n\
    \  - 文件卷容量越大，若簇大小不变，则簇总数越多，相应簇编号所需位数越多，可以是 12、16、32 二进制位即 FAT12、FAT16、FAT32。\n\
    \n- FAT表：两个镜像，互为备份。文件卷中的每个簇均对应一个FAT表项，文件分配采用链式分配方法。每个FAT表项所占位数是簇编号的位数，其值是（以FAT12为例）：\n\
    \  - 0：表示该簇空闲\n  - FF7h：物理坏扇区\n  - FF8h~FFFh：表示该簇是文件的最后一个簇\n  - 其他值：表示该簇被文件占用，而且表项中的值是文件下一个簇的编号。\n\
    - FAT表大小占文件卷容量的比例：簇编号位数 / (8*512*每个簇的扇区数)\n\n## 目录\n- 是目录项的顺序文件，不对目录项排序。若目录中包含的文件数目较多，则搜索效率低。每个目录项大小为32字节，其内容包括：文件名（8+3个字符），属性（包括文件、子目录和文件卷标识），最后一次修改时间和日期，文件长度，第一个簇的编号。在目录项中，若第一个字节为\
    \ E5h，则表示空目录项；若为 05h，则表示文件名的第一个字符为 E5h。\n- 文件名不区分大小写\n\n- 系统文件表(SFT, System File\
    \ Table)和任务文件表(JFT, Job File Table):\n  - SFT包含系统的所有打开文件，可以由几个子表依次连接组成。\n  - JFT包含该任务（进程）的所有打开文件。\n\
    \  - SFT的表项数目可由 config.sys 文件中的 FILES= 来语句指定，默认是8。JFT的表项数目默认是20，可以增加从而允许同时打开更多文件\n\
    \nFile Handle\n\nJFT\n\nProgram A\n\n0\n\n9\n\n5\n\nSFT\n\n./file1\n\n0\n\n5\n\
    \n3\n\n3193\n\nnum_handles\n\noffset\n\nProgram B\n\ndup()\n\n0\n\n6\n\n3\n\n\
    7\n\n5\n\n- 网络重定向(redirect): 对本计算机操作系统所提供的文件卷进行访问，实际上是访问网络其他计算机中的文件和目录\n\n## UNIX的文件系统\n\
    - 多级文件目录，可以建立文件别名（索引节点方式和符号链接方式），有用户访问权限控制（文件的读R、写W和执行X，相应于目录的检索文件、增删文件和进入目录）\n\
    \  - 注意：如果对文件具有写权限，而对文件所在目录没有写权限，仍然可以改变该文件的长度（如添加数据），因为除文件名外的其他文件目录内容都存放于索引结点而不是在目录文件。\n\
    - 文件类型：常规文件(ordinary file)，目录文件(directory)，特殊文件(special file)如外设，先进先出文件(FIFO)如命名管道\n\
    \nSector #\n0\t1\nBoot Record\tSuper Block\tinode Table\tData (File & Directory)\n\
    \nVolume Structure in UNIX\n\n## User File Descriptors\n## File Table\n## Inode\
    \ Table\nProcess A\n\nProcess B\n\nProcess C\n\nfork()\n\ndup()\n\nCount\n\nOffset\n\
    \nRead/Write Mode\n\nCount\n\nFile Size\n\n./file1\n\n- 进程打开文件表，系统打开文件表\n- 内存i节点表：空闲的内存i节点->组织成链表；占用的内存i节点->哈希表（对冲突采用链表方式解决）\n\
    \  - 内存i节点的分配\n  - 内存i节点的释放\n  - 内存i节点的锁定\n\n- 进程所进入的目录：包括各个打开文件的目录路径，以及进程的当前目录\n\
    \  - 进入一个目录，如果该目录文件的内存i节点已经存在，则只需把内存i节点的引用计数加1，否则读入该目录文件的磁盘i节点并建立内存i节点。\n  - 系统启动之后，进入根目录并建立相应内存结点，直到系统关闭\n\
    \  - 退出目录：如关闭文件或修改当前目录\n\n## Linux文件系统\nExt2 文件系统利用索引节点（inode）来描述文件系统的拓扑结构。在单个文件系统中，每个文件对应一个索引节点，而每个索引节点有一个唯一的整数标识符。文件系统中所有文件的索引节点保存在索引节点表中。Ext2\
    \ 文件系统中的目录实际是一种特殊文件，它们也有对应的索引节点，索引节点指向的数据块中包含该目录中所有的目录项（文件、目录、符号链接等），每个目录项对应自己的索引节点。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1082_0.png)\n\n## inode\n![](img/861c0ad57b0249095c0356c9e5a83b26_1083_0.png)\n\
    \n- **模式**：该数据域包含索引节点所描述的对象类型，以及用户的许可信息。在 Ext2 中，每个节点描述一个文件、目录、符号链接、块设备、字符设备或一个\
    \ FIFO。\n- **所有者信息**：文件或目录所有者的用户和组标识符。\n- **大小**：文件以字节为单位的大小。\n- **时间戳**：该索引节点的创建时间以及索引节点的最后改动时间。\n\
    - **数据块**：包含索引节点所描述的数据的数据块指针。对于前 12 个数据块指针来说，它们指向的数据块是包含实际文件数据的数据块，而后面的三个指针则包含间接数据块指针。\n\
    \n## Ext2 文件系统的超块\n- 文件系统的超块（Superblock）包含了文件系统的基本大小和形式。其中包含的数据由文件系统管理程序用来进行文件系统的维护。每个块组中包含有相同的超块信息，但通常只需读取块组\
    \ 0 的超块。\n\n- 幻数 幻数用来标识超块的类型。文件系统的挂装软件可据此判断是否为有效的 Ext2 文件系统超块。当前的 Ext2 文件系统幻数为\
    \ 0xEF53。\n- 修订级别 包含两个数据，分别为主修订级别和次修订级别。文件系统的挂装软件可据此判断文件系统是否支持某种特定的功能。实际上，该信息作为兼容性标志而存在。\n\
    \n- 挂装计数和最大挂装计数 利用这两个信息，系统可以判断文件系统是否需要彻底检验。文件系统每挂装一次，挂装计数加1。如果挂装计数达到最大挂装计数，则系统会提示应进行检查。\n\
    - 组块编号 保存该超块的组块编号。\n- 数据块大小 文件系统的数据块大小，以字节为单位。\n- 每组的数据块个数 每组的数据块个数，该值在建立文件系统时设置并保持不变。\n"
