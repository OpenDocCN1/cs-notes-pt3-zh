  - '[PAGE 366]


    # 进程状态及其演变


    +   - **进程的三种基本状态**

    +     - **就绪状态**：进程已获得除处理机外的所需资源，等待分配处理机资源；只要分配CPU就可执行。

    +     - **执行状态**：占用处理机资源，处于此状态的进程的数目小于等于CPU的数目。在没有其他进程可以执行时（如所有进程都处于阻塞状态），通常会自动执行系统的idle进程（相当于空操作）。

    +     - **阻塞状态**：正在执行的进程，由于发生某种事件而暂时无法执行，便放弃处理机处于暂停状态。'
