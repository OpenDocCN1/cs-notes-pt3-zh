    # 特点


    +   - 高速虚拟I/O操作：应用程序的虚拟I/O比实际I/O速度提高，缩短应用程序的执行时间（尽快完成计算，并释放占用的计算机资源）。另一方面，程序的虚拟I/O操作时间和实际I/O操作时间分离开来。

    +   - 实现对独享设备的共享：由SPOOLing程序提供虚拟设备，可以对独享设备依次共享使用。'
