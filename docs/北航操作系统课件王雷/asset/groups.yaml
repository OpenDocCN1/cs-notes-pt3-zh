  - '[PAGE 915]


    # 8.46GB问题


    +   - 第1至第3字节是该分区起始地址。其中第1字节为起始磁头号（面号）；第2字节的低6位为起始扇区号，高2位则为起始柱面号的高2位；第3字节为起始柱面号的低8位。

    +   - 柱面号最大值为 2^10 − 1 = 1023

    +   - 扇区号不会超过 2^6 − 1 = 63

    +   - 磁头号不会超过 2^8 − 1 = 255

    +     - 1024 × 256 × 63 = 16,515,072

    +   - 这个扇区之前的所有物理扇区所包含的字节数为：

    +     - 16,515,072 × 512Bytes ≈ 8.46GB。

    +   - INT 13服务扩展标准'
  - '[PAGE 916]


    # 分区引导扇区DBR(DOS BOOT RECORD)


    +   - 由FORMAT高级格式化命令写到该扇区的内容；

    +   - DBR是由硬盘的MBR装载的程序段。

    +   - DBR装入内存后，即开始执行该引导程序段，其主要功能是完成操作系统的自举并将控制权交给操作系统。

    +   - 每个分区都有引导扇区，但只有被设为活动分区的DBR才会被MBR装入内存运行。'
  - '[PAGE 917]


    # DBR主要部分


    +   - 跳转指令，占用3个字节的跳转指令将跳转至引导代码。

    +   - 厂商标识和DOS版本号，该部分总共占用8个字节。

    +   - BPB（BIOS Parameter Block，BIOS 参数块）。

    +   - 操作系统引导程序。

    +   - 结束标志字，结束标志占用2个字节，其值为AA55'
  - '[PAGE 918]


    # # 磁盘的类型


    +   - 固定头磁盘

    +   - 移动头磁盘'
  - '[PAGE 919]


    # 磁盘访问时间


    +   - 寻道时间

    +   - 旋转延迟时间

    +   - 传输时间


    ![](img/861c0ad57b0249095c0356c9e5a83b26_919_0.png)


    ![](img/861c0ad57b0249095c0356c9e5a83b26_919_1.png)


    Response Time = Queue+Disk Service Time'
  - '[PAGE 920]


    # 寻道时间


    +   - 这是把磁臂（磁头）从当前位置移动到指定磁道上所经历的时间。该时间是启动磁盘的时间 $s$ 与磁头移动 $n$ 条磁道所花费的时间之和。


    +   - $T_s = m \times n + s$'
  - '[PAGE 921]


    # 转延迟时间


    +   - 对于硬盘，典型的旋转速度为3 600 r/min，每转需时16.7 ms，平均旋转延迟时间 Tr 为8.3 ms。对于软盘，其旋转速度为300或600
    r/min，这样，平均 Tr 为50~100 ms。'
  - '[PAGE 922]


    # 传输时间


    +   - Tt是指把数据从磁盘读出，或向磁盘写入数据所经历的时间，Tt的大小与每次所读/写的字节数b，旋转速度r以及磁道上的字节数N有关

    +   - Tt=b/(rN)

    +     - Transfer size (usually a sector): 512B - 1KB per sector

    +     - Rotation speed: 3600 RPM to 15000 RPM

    +     - Typical values: 2 to 50 MB per second'
  - '[PAGE 923]


    # 总时间


    +   - $T_s + 1/(2r) + b/(rN)$

    +   - 例如，我们假定寻道时间和旋转延迟时间平均为 30 ms，而磁道的传输速率为 1 MB/s，如果传输 1K 字节，此时总的访问时间为 31 ms，传输时间所占比例是相当地小。当传输
    10K 字节的数据时，访问时间也只是 40 ms，即当传输的数据量增加 10 倍时，访问时间只增加了约 30%。'
  - '[PAGE 924]


    # 磁盘调度算法


    +   - 先来先服务

    +   - 最短寻道时间优先'
