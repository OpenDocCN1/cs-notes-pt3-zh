    |  | 紧凑前 |\n| --- | --- |\n| 0 | 操作系统 |\n| 20K | 作业 1 (18K) |\n|  | 12K |\n| \
    \ | 作业 3 (24K) |\n|  | 16K |\n|  | 作业 4 (46K) |\n|  | 10K |\n|  | 作业 2 (40K) |\n\
    |  | 12K |\n|  | 作业 5 (50K) |\n| 256K | 8K |\n\n|  | 紧凑后 |\n| --- | --- |\n| 0\
    \ | 操作系统 |\n| 20K | 作业 1 |\n|  | 作业 3 |\n|  | 作业 4 |\n|  | 作业 2 |\n|  | 作业 5 |\n\
    | 198K | 空白区 58K |\n| 256K |  |\n\n"
