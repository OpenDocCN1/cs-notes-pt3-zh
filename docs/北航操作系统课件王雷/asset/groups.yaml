    +   - 优点：增加并发运行的程序数目，并且给用户提供适当的响应时间；编写程序时不影响程序结构\n+   - 缺点：对换入和换出的控制增加处理机开销；程序整个地址空间都进行传送，没有考虑执行过程中地址访问的统计特性。\n\
