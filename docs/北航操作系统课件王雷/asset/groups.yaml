    - 检查是否大内核（big kernel）,若是则还要检查装载程序（Loader）,老的装载程序不能装载大内核.\n- 获取内存大小(主要是扩展内存放在9000:01e0),(接着往9000:0002存放由ah=0x88,int\
    \ 15返回的ax值),设置最大击键速度,检查显卡并获取相应参数(调用video过程,在video.S中),存放区9000:0000--9000:0017.\n\
    - 获取hd0的数据,存至9000:0080--9000:0090.获取hd1的数据,存至9000:0090--9000:00A0.再检查hd1是否存在,若不,该区域清零.\n\
