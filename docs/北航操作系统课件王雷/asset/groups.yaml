  - '[PAGE 280]


    # 改善时间性能的途径


    +   - 降低缺页率：缺页率越低，虚拟存储器的平均访问时间延长得越小；

    +   - 提高外存的访问速度：外存和内存的访问时间比值越大，则达到同样的时间延长比例，所要求的缺页率就越低；

    +   - 高速缓存命中率。'
  - '[PAGE 281]


    # Performance of Demand Paging


    +   - Page Fault Rate \(0 \le p \le 1.0\n  - if \(p = 0\) no page faults\n  -
    if \(p = 1\), every reference is a fault


    +   - Effective Access Time (EAT)


    \[\begin{aligned}

    \mathrm{EAT} ={}& (1-p) \times \text{memory access} \\

    &+ p\,(\text{page fault overhead} \\

    &\quad + [\text{swap page out}] \\

    &\quad + \text{swap page in} \\

    &\quad + \text{restart overhead})

    \end{aligned}\]'
