  md: "\n- 客户端通过这个开机映像文件开机，这个开机文件可以只是单纯的开机程序，也可以是操作系统。\n- 开机映像文件将包含 kernel loader\
    \ 及压缩过的 kernel，此 kernel 将支持 NFS root 系统。\n- 远程客户端根据下载的文件启动机器。\n\n## 计算机操作系统\n\n\
    教师：王雷\n\n助教：王振 赵玉龙 王宇 王鲁俊\n\n82316284，wanglei@buaa.edu.cn，http://219.224.165.31\n\
    \n### 存储器的管理\n\n- 存储分配：主要是讨论和解决多道作业之间共享主存的存储空间的问题。\n- 存储器资源的组织（如内存的组织方式）\n- 地址变换（逻辑地址与物理地址的对应关系维护）\n\
    - 虚拟存储的调度算法\n\n### 存储层次结构\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_174_0.png)\n\
    \n### Processor-DRAM Memory Gap (latency)\n\n```\nPerformance\n\nTime\n\n\"Moore's\
    \ Law\"\n(really Joy's Law)\n\n\"Less Law?\"\n\nProcessor-Memory Performance Gap:\n\
    (grows 50% / year)\n\nμProc\nCPU\n60%/yr.\n(2X/1.5yr)\n\nDRAM\n9%/yr.\nDRAM (2X/10\
    \ yrs)\n\n1980 1981 1982 1983 1984 1985 1986 1987 1988 1989 1990 1991 1992 1993\
    \ 1994 1995 1996 1997 1998 1999 2000\n```\n\n### 为什么进行存储管理\n\n- 重要的资源\n- 帕金森定律(Parkinson):\n\
    \  - 存储器有多大，程序有多长。\n\n### 存储管理的功能\n\n- 存储分配和回收：是存储管理的主要内容。讨论其算法和相应的数据结构。\n- 地址变换：可执行文件生成中的链接技术、程序加载时的重定位技术，进程运行时硬件和软件的地址变换技术和机构。\n\
    - 存储共享和保护：代码和数据共享，对地址空间的访问权限（读、写、执行）。\n- 存储器扩充：它涉及存储器的逻辑组织和物理组织；\n  - 由应用程序控制：覆盖；\n\
    \  - 由OS控制：交换（整个进程空间），请求调入和预调入（部分进程空间）\n\n### 程序的装入和链接\n\n- 编译\n- 链接\n- 装入\n\n\
    ![](img/861c0ad57b0249095c0356c9e5a83b26_178_0.png)\n\n1. 地址空间：源程序经过编译后得到的目标程序，存在于它所限定的地址范围内，这个范围称为地址空间。简言之，地址空间是逻辑地址的集合。\n\
    \n2. 存储空间：存储空间是指主存中一系列存储信息的物理单元的集合，这些单元的编号称为物理地址或绝对地址。换言之，存储空间是物理地址的集合。\n\n###\
    \ 作业J存在于不同的空间中\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_180_0.png)\n\n### 作业由地址空间装入存储空间\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_181_0.png)\n\n### 重定位\n\n在装入时对目标程序中的指令和数据地址的修改，或映射过程。\n\
    \n- 静态重定位\n- 动态重定位\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_182_0.png)\n\n\
    ### 存储分配的三种方式\n\n1. 直接指定方式：程序员在编程序时，或编译程序(汇编程序)对源程序进行编译(汇编)时，所用的是实际地址。\n2. 静态分配(Static\
    \ Allocation)：程序员编程时，或由编译程序产生的目的程序，均可从其地址空间的零地址开始；当装配程序对其进行连接装入时才确定它们在主存中的地址。\n\
    3. 动态分配(Dynamic Allocation)：作业在存储空间中的位置，在其装入时确定，在其执行过程中可根据需要申请附加的存储空间，而且一个作业已占用的部分区域不再需要时，可以要求归还给系统。\n\
    \n### 连续分配存储管理方式\n\n- 单一连续分配方式\n- 分区分配方式\n  - 固定分区\n  - 动态分区\n\n### 单一连续区存储管理\n\
    \n- 内存分为两个区域：系统区，用户区。应用程序装入到用户区，可使用用户区全部空间。\n- 最简单，适用于单用户、单任务的OS。CP/M和DOS\n- 优点：易于管理。\n\
    - 缺点：对要求内存空间少的程序，造成内存浪费；程序全部装入，很少使用的程序部分也占用内存。\n\n```\n0xFFF ...\n\nUser program\n\
    \nOperating system in RAM\n\n0\n\n(a)\n\nOperating system in ROM\n\nUser program\n\
    \n0\n\n(b)\n\nDevice drivers in ROM\n\nUser program\n\nOperating system in RAM\n\
    \n0\n\n(c)\n```\n\n### 多用户系统存储器管理----分区式分配\n\n- 把内存分为一些大小相等或不等的分区(partition)，每个应用程序占用一个或几个分区。操作系统占用其中一个分区。\n\
    - 适用于多道程序系统和分时系统，支持多个程序并发执行，但难以进行内存分区的共享。\n\n### 固定式分区\n\n固定式分区（静态存储区域）：当系统初始化时，把存储空间划分成若干个任意大小的区域；然后，把这些区域分配给每个用户作业。\n\
    \n| 分区号 | 大小 | 起址 | 状态 |\n| --- | --- | --- | --- |\n| 1 | 12K | 20K | 已分配 |\n\
    | 2 | 32K | 32K | 已分配 |\n| 3 | 64K | 64K | 已分配 |\n| 4 | 128K | 128K | 未分配 |\n\n\
    分区说明表\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_188_0.png)\n\n- 把内存划分为若干个固定大小的连续分区。\n\
    \  - 分区大小相等：只适合于多个相同程序的并发执行（处理多个类型相同的对象）。\n  - 分区大小不等：多个小分区、适量的中等分区、少量的大分区。根据程序的大小，分配当前空闲的、适当大小的分区。\n\
    - 优点：易于实现，开销小。\n- 缺点：内碎片造成浪费，分区总数固定，限制了并发执行的程序数目。\n- 采用的数据结构：分区表——记录分区的大小和使用情况\n\
    \n### 可变式分区：\n\n- 可变式分区：分区的边界可以移动，即分区的大小可变。\n- 优点：没有内碎片。缺点：有外碎片。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_191_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_192_0.png)\n\n北京航空航天大学\n\n计算机学院\n\n\
    王雷\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_193_0.png)\n\n### 动态分区的操作和数据结构\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_195_0.png)\n\n### 可变式分区的分配策略：\n\n1.\
    \ 最佳适应算法（Best Fit）：为一个作业选择分区时，总是寻找其大小最接近于作业所要求的存储区域。\n2. 最坏适应算法（Worst Fit）：为作业选择存储区域时，总是寻找最大的空白区。\n\
    3. 首次适应算法（First Fit）：每个空白区按其在存储空间中地址递增的顺序连在一起，在为作业分配存储区域时，从这个空白区域链的始端开始查找，选择第一个足以满足请求的空白块。\n\
    4. 下次适应算法（Next Fit）：把存储空间中空白区构成一个循环链，每次为存储请求查找合适的分区时，总是从上次查找结束的地方开始，只要找到一个足够大的空白区，就将它划分后分配出去。\n\
    \n### 可重定位分区分配\n\n可重定位分区分配：定时的或在内存紧张时，移动某些已分配区中的信息，把存储空间中所有的空白区合并为一个大的连续区。\n\n\
    |  | 紧凑前 |\n| --- | --- |\n| 0 | 操作系统 |\n| 20K | 作业 1 (18K) |\n|  | 12K |\n| \
    \ | 作业 3 (24K) |\n|  | 16K |\n|  | 作业 4 (46K) |\n|  | 10K |\n|  | 作业 2 (40K) |\n\
    |  | 12K |\n|  | 作业 5 (50K) |\n| 256K | 8K |\n\n|  | 紧凑后 |\n| --- | --- |\n| 0\
    \ | 操作系统 |\n| 20K | 作业 1 |\n|  | 作业 3 |\n|  | 作业 4 |\n|  | 作业 2 |\n|  | 作业 5 |\n\
    | 198K | 空白区 58K |\n| 256K |  |\n"
