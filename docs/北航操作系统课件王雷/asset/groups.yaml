    \n![](img/861c0ad57b0249095c0356c9e5a83b26_547_1.png)\n\n- 一个磁盘上分区的内容被复制到一个磁盘与它等大小的分区中。镜像卷有时也被称为RAID-1。\n\
    - 镜像卷能够可以在主分区和镜像分区之间平衡 I/O 操作。两个读操作可以同时进行，所以理论上只用一半时间就可以完成。当修改一个文件时，就须写入镜像卷的两个分区，但是磁盘写操作的异步进行，所以用户态程序的性能一般不会被这种额外的磁盘更新所影响。\n\
    - 镜像卷是唯一一种支持系统卷和引导卷的多分区卷。\n\n## 廉价冗余磁盘阵列5卷\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_549_0.png)\n\
    \n磁盘1\n\n磁盘2\n\n磁盘3\n\n奇偶校验\n\n## 卷名字空间\n- 安装管理器\n- 安装点\n- 卷安装\n\nMicrosoft® Windows®\
    \ 2000/XP\n\n## 安装管理器\n- 安装管理器（Mountmgr.sys）是Windows Server 2003中新驱动程序，为在Windows\
    \ Server 2003安装后创建的动态磁盘卷和基本磁盘卷分配驱动器名。\n- 卷管理器创建卷时都将通知它。当接到通知时，确定新的卷GUID或者磁盘标记；\n\
    - 安装管理器使用卷GUID（或者标识）在内部数据库中进行查询\n- 安装管理器使用第一个未分配的驱动器名，为这次分配创建一个符号链接（例如，\\??\\\
    D:）\n\n## 安装点\n- 实现安装点的技术是解析点（Reparse Point）技术。\n- `C:\\Project\\CurrentProject\\\
    Description.txt`\n- `C:\\Projects\\CurrentProject\\Description.txt`\n\n## 1.1.1\
    \ 从毕业到毕业设计\n\n每年到了毕业季，总有许多同学感到焦虑、迷茫，因为他们即将离开熟悉的校园，步入一个完全陌生的环境。毕业论文或毕业设计，是大学生们在校期间需要完成的最后一项学习任务，也是他们从学校走向社会的一个过渡环节。因此，对于每一位大学生来说，毕业设计都具有非常重要的意义。\n\
    \n许多同学对毕业设计没有正确的认识，认为它只是针对某一个课题做一些简单的研究，做得好与不好无关紧要，只要最终能拿到毕业证和学位证就够了。实际上，这种想法完全是错误的。毕业设计是对大学生综合运用所学知识能力的一次全面检验，也是对大学生独立分析问题和解决问题能力的一次综合训练。\n\
    \n首先，毕业设计可以提高大学生分析问题和解决问题的能力。通过毕业设计，同学们可以学会如何综合运用所学的基础理论、基本知识和基本技能，去解决一个实际问题。其次，毕业设计可以锻炼大学生的独立思考能力和创新能力。做毕业设计不能只靠课堂上老师教授的知识，还需要结合自己的思考，去查阅资料、分析问题、设计方案，甚至需要做一些实验来验证自己的设想。这个过程实际上就是对大学生独立思考能力和创新能力的一种锻炼。最后，毕业设计可以提高大学生的书面表达能力和口头表达能力。在毕业设计过程中，学生需要撰写毕业论文，还要在答辩时向评委老师阐述自己的研究成果，这些都在无形中提高了大学生的书面表达和口头表达能力。\n\
    \n另外，毕业设计也是大学生走向工作岗位前的一次“实战演练”。通过毕业设计，同学们可以提前了解本专业领域的最新发展动态，掌握一些基本的科学研究方法，为今后从事相关工作打下良好的基础。因此，每一位大学生都应该认真对待毕业设计，把它当作一次难得的锻炼机会，而不仅仅是一项必须完成的学习任务。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_557_0.png)\n\n## 虚拟块缓存\n\nWindows Server\
    \ 2003高速缓存管理器用一种虚拟块缓存方式，管理器对缓存中的文件的某些部分进行追踪。通过内存管理器的特殊系统高速缓存例程将256-KB大小的文件视图映射到系统虚拟地址空间，高速缓存管理器能够驻留文件的这些部分。这种方式有以下几个主要特点：\n\
    \n- 它使智能的文件预读成为可能。\n- 它允许I/O系统绕开文件系统访问已经在缓存中的数据（快速I/O）。\n\n- 基于流的缓存\n- 可恢复的文件系统支持\n\
    \  - 文件系统写一个日志文件记录，记录将要进行的卷修改操作。\n  - 文件系统调用高速缓存管理器将日志文件记录刷新到磁盘上。\n  - 文件系统把卷修改内容写入高速缓存，即修改文件系统在高速缓存的元数据。\n\
    \  - 高速缓存管理器将被更改的元数据刷新到磁盘上，更新卷结构。\n\n| 地址 | 内容 |\n|---|---|\n| 80000000 | 系统代码（Ntoskrnl，HAL）和一些系统中初始的未分页缓冲池\
    \ |\n| A0000000 | 系统映射视图（例如，Win32k.sys）或会话空间 |\n| A4000000 | 附加的系统PTE（高速缓存可以映射到这里）\
    \ |\n| C0000000 | 进程的页表和页目录 |\n| C0400000 | 超级用户进程工作集列表 |\n| C0800000 | 没有使用，不可访问\
    \ |\n| C0C00000 | 系统工作集列表 |\n| C1000000 | 系统高速缓存 |\n| E1000000 | 分页缓冲池 |\n| EB000000\
    \ | 系统PTE |\n| EFC00000 | 未分页缓冲池扩充 |\n| FFBE0000 | 故障转储信息 |\n| FFC00000 | HAL使用\
    \ |\n"
  mdcn: "\n\n- 磁盘的类驱动程序使用 I/O 管理器的 IoReadPartitionTable 函数识别表示分区的设备对象\n- 设备名\n  -\
