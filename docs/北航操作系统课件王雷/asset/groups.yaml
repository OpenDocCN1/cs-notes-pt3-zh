  - '[PAGE 568]


    # 高速缓存的操作


    +   - 回写缓存和延迟写

    +     - 写入文件的数据首先被存储在高速缓存页面的内存中，然后再被写入磁盘。因此，写操作允许在短时间内积累，并一次性刷新到磁盘，这可以减少磁盘的I/O次数。

    +   - 屏蔽对文件延迟写

    +     - 在调用Win32 CreateFile函数时指定 FILE_ATTRIBUTE_TEMPORARY标志创建一个临时文件，延迟写器就不会将脏页写回磁盘，除非物理内存严重不足或文件关闭。

    +   - 强制写缓存到磁盘

    +   - 刷新被映射的文件'
