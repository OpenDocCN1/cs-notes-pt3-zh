    \ endfor\nelse\n    wait in Si;\nendif\nSV(S1, d1, ... ,Sn, dn)\nfor I :=1 to\
    \ n do\n    Si := Si + di;\n    wake waited proces\nendfor\n```\n\n## P.V操作的优缺点\n\
    \n- 优点：\n  - 简单，而且表达能力强（用P.V操作可解决任何同步互斥问题）\n- 缺点：\n  - 不够安全；P.V操作使用不当会出现死锁；遇到复杂同步互斥问题时实现复杂\n\
    \n## 管程 (Monitor)\n\n- 用信号量可实现进程间的同步，但由于信号量的控制分布在整个程序中，其正确性分析很困难。管程是管理进程间同步的机制，它保证进程互斥地访问共享变量，并方便地阻塞和唤醒进程。管程可以以函数库的形式实现。相比之下，管程比信号量好控制。\n\
