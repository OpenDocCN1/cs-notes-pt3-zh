  md: "\n## I/O设备\n\n- **类型**\n  - 传输速度：低速、中速、高速\n  - 信息交换单位：字符设备和字节设备（网络）\n  - 共享属性：独占设备、共享设备、虚拟设备\n\
    \n- **设备与控制器之间的接口**\n  - 数据信号\n  - 控制信号\n  - 状态信号\n\n## 设备控制器\n\n- 控制设备的功能\n \
    \ - 接收和识别命令\n  - 数据交换\n  - 设备状态的了解和报告\n  - 地址识别\n- 组成\n  - 控制器与外围机接口\n  - 与设备接口\n\
    \  - I/O逻辑\n\n| I/O address range (hexadecimal) | device |\n|---|---|\n| 000-00F\
    \ | DMA controller |\n| 020-021 | interrupt controller |\n| 040-043 | timer |\n\
    | 200-20F | game controller |\n| 2F8-2FF | serial port (secondary) |\n| 320-32F\
    \ | hard-disk controller |\n| 378-37F | parallel port |\n| 3D0-3DF | graphics\
    \ controller |\n| 3F0-3F7 | diskette-drive controller |\n| 3F8-3FF | serial port\
    \ (primary) |\n\n## How does the processor actually talk to the device?\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_721_0.png)\n\
    \n- **CPU interacts with a _Controller_**\n  - Contains a set of _registers_ that\
    \ can be read and written\n  - May contain memory for request queues or bit-mapped\
    \ images\n- Regardless of the complexity of the connections and buses, processor\
    \ accesses registers in two ways:\n  - **I/O instructions:** in/out instructions\n\
    \    - Example from the Intel architecture: `out 0x21, AL`\n  - **Memory mapped\
    \ I/O:** load/store instructions\n    - Registers/memory appear in physical address\
    \ space\n    - I/O accomplished with load and store instructions\n\n## I/O通道\n\
    \n- 字节多路通道\n- 数组选择通道\n- 数组多路通道\n- 瓶颈问题\n\n## I/O控制技术\n\n- 程序控制I/O (programmed\
    \ I/O)\n- 中断驱动方式 (interrupt-driven I/O)\n- 直接存储访问方式 (DMA, Direct Memory Access)\n\
    \n## 程序控制I/O(programmed I/O)\n\n- I/O操作由程序发起，并等待操作完成。数据的每次读写通过CPU。\n- 缺点：在外设进行数据处理时，CPU只能等待。\n\
    \n## 中断驱动方式 (interrupt-driven I/O)\n\n- I/O操作由程序发起，在操作完成时（如数据可读或已经写入）由外设向CPU发出中断，通知该程序。数据的每次读写通过CPU。\n\
    \n- 优点：在外设进行数据处理时，CPU不必等待，可以继续执行该程序或其他程序。\n\n- 缺点：CPU每次处理的数据量少（通常不超过几个字节），只适于数据传输率较低的设备。\n\
    \n## 直接存储访问方式 (DMA, Direct Memory Access)\n\n- 由程序设置DMA控制器中的若干寄存器值（如内存始址，传送字节数），然后发起I/O操作，而后者完成内存与外设的成批数据交换，在操作完成时由DMA控制器向CPU发出中断。\n\
    - 优点：CPU只需干预I/O操作的开始和结束，而其中的一批数据读写无需CPU控制，适于高速设备。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_728_0.png)\n\
    \n## I/O通道控制方式(channel control)\n\n- 可以执行由通道指令组成的通道程序，因此可以进行较为复杂的I/O控制。通道程序通常由操作系统所构造，放在内存里。\n\
    - 优点：执行一个通道程序可以完成几组I/O操作。\n\n## Life Cycle of An I/O Request\n\nUser Program\n\
    \nKernel I/O Subsystem\n\nDevice Driver Top Half\n\nDevice Driver Bottom Half\n\
    \nDevice Hardware\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_730_0.png)\n\n##\
    \ 单缓冲 (single buffer)\n\n- 一个缓冲区，CPU和外设轮流使用，一方处理完之后接着等待对方处理。\n\n## 缓冲池(buffer\
    \ pool)\n\n- 缓冲区整体利用率高。\n- 缓冲区队列\n  - 空闲缓冲区，\n  - 输入缓冲区\n  - 输出缓冲区\n\n## 过程\n\n\
    ![](img/861c0ad57b0249095c0356c9e5a83b26_736_0.png)\n\n## 工作方式\n\n- 收容输入\n- 提取输入\n\
    - 收容输出\n- 提取输出\n\n## 设备分配\n\n- 由于外设资源的有限，外设决定进程间的外设共享问题，以提高外设资源的利用率。设备分配是对进程进行外设过程的管理。\n\
    \n- 这里有两种作法：\n  - 1) 在进程间交换使用外设，如键盘和鼠标；\n  - 2) 通过建立虚拟设备把外设与应用进程隔开，只向虚拟设备来使用设备。\n\
    \n## 数据结构\n\n- 设备控制表（DCT，Device Control Table）：每个设备一张，描述设备的状态。反映设备的特性、设备和控制器的连接情况。\n\
    - 控制器控制表（COCT，Controller Control Table）：每个设备控制器一张，描述 I/O 控制器的配置和状态，如 DMA 控制器所占用的中断号、DMA\
    \ 数量通道的分配。\n- 通道控制表（CHCT，Channel Control Table）：每个通道一张，描述通道工作状态。\n\n- 系统设备表（SDT，System\
    \ Device Table）\n  - 系统内一张，反映系统中设备资源的状态，记录所有设备的状态及其设备控制表的入口。SDT表项的主要组成：\n    -\
    \ DCT指针：指向相应设备的DCT；\n    - 设备使用进程标识：正在使用该设备的进程标识；\n    - DCT信息：为引用方便而保存的DCT信息，如设备标识、设备类型等；\n\
    \n## 设备分配时应考虑的因素\n\n- 设备固有属性\n- 设备分配算法\n- 设备分配中的安全性\n\n## 设备固有属性\n\n- 独占\n- 共享\n\
    - 独享设备\n- 共享设备\n- 虚拟设备\n\n## 设备分配算法\n\n- 先来先服务\n- 优先级高者优先\n\n## 设备分配中的安全性\n\n\
    - 安全分配方式\n- 不安全分配方式\n\n## 设备独立性\n\n- 设备分配灵活\n- 易于实现I/O重定向\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_745_0.png)\n\
    \n## 标准接口\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_747_0.png)\n"
