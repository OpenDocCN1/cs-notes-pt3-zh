  - "[PAGE 403]\n\n# 计数信号量\n\n```\nSemaphore(S)\n{\n    value : integer;\n    L :\
    \ list of process;\n    while (S.value <= 0)\n        block(S.L);\n    end\n}\n\
    \nprocedure V(S)\n{\n    var S : semaphore;\n    begin\n        S.value := S.value\
    \ + 1;\n        if S.value <= 0 then wakeup(S.L);\n    end\n```"
