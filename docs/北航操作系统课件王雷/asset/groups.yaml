    \  - 内存i节点的分配\n  - 内存i节点的释放\n  - 内存i节点的锁定\n\n- 进程所进入的目录：包括各个打开文件的目录路径，以及进程的当前目录\n\
    \  - 进入一个目录，如果该目录文件的内存i节点已经存在，则只需把内存i节点的引用计数加1，否则读入该目录文件的磁盘i节点并建立内存i节点。\n  - 系统启动之后，进入根目录并建立相应内存结点，直到系统关闭\n\
    \  - 退出目录：如关闭文件或修改当前目录\n\n## Linux文件系统\nExt2 文件系统利用索引节点（inode）来描述文件系统的拓扑结构。在单个文件系统中，每个文件对应一个索引节点，而每个索引节点有一个唯一的整数标识符。文件系统中所有文件的索引节点保存在索引节点表中。Ext2\
    \ 文件系统中的目录实际是一种特殊文件，它们也有对应的索引节点，索引节点指向的数据块中包含该目录中所有的目录项（文件、目录、符号链接等），每个目录项对应自己的索引节点。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1082_0.png)\n\n## inode\n![](img/861c0ad57b0249095c0356c9e5a83b26_1083_0.png)\n\
    \n- **模式**：该数据域包含索引节点所描述的对象类型，以及用户的许可信息。在 Ext2 中，每个节点描述一个文件、目录、符号链接、块设备、字符设备或一个\
    \ FIFO。\n- **所有者信息**：文件或目录所有者的用户和组标识符。\n- **大小**：文件以字节为单位的大小。\n- **时间戳**：该索引节点的创建时间以及索引节点的最后改动时间。\n\
    - **数据块**：包含索引节点所描述的数据的数据块指针。对于前 12 个数据块指针来说，它们指向的数据块是包含实际文件数据的数据块，而后面的三个指针则包含间接数据块指针。\n\
    \n## Ext2 文件系统的超块\n- 文件系统的超块（Superblock）包含了文件系统的基本大小和形式。其中包含的数据由文件系统管理程序用来进行文件系统的维护。每个块组中包含有相同的超块信息，但通常只需读取块组\
    \ 0 的超块。\n\n- 幻数 幻数用来标识超块的类型。文件系统的挂装软件可据此判断是否为有效的 Ext2 文件系统超块。当前的 Ext2 文件系统幻数为\
    \ 0xEF53。\n- 修订级别 包含两个数据，分别为主修订级别和次修订级别。文件系统的挂装软件可据此判断文件系统是否支持某种特定的功能。实际上，该信息作为兼容性标志而存在。\n\
    \n- 挂装计数和最大挂装计数 利用这两个信息，系统可以判断文件系统是否需要彻底检验。文件系统每挂装一次，挂装计数加1。如果挂装计数达到最大挂装计数，则系统会提示应进行检查。\n\
    - 组块编号 保存该超块的组块编号。\n- 数据块大小 文件系统的数据块大小，以字节为单位。\n- 每组的数据块个数 每组的数据块个数，该值在建立文件系统时设置并保持不变。\n\
    \n"
