    # 设备的管理的目的和功能


    +   - 外设管理目的

    +     - 提高效率：提高I/O访问效率，匹配CPU和多种不同处理速度的外设

    +     - 方便使用：方便用户使用，对不同类型的设备统一使用方法，协调对设备的并发使用

    +     - 方便控制：方便OS内部对设备的控制：增加和删除设备，适应新的设备类型

    +   - 外设管理功能

    +     - 提供设备使用的用户接口：命令接口和编程接口。

    +     - 设备分配和释放：使用设备前，需要分配设备和相应的通道、控制器。

    +     - 设备的访问和控制：包括并发访问和差错处理。

    +     - I/O缓冲和调度：目标是提高I/O访问效率。'
