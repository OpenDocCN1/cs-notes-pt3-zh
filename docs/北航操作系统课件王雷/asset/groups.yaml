    | CTRL-S | STOP | 停止输出 |

    | CTRL-Q | START | 开始输出 |

    | DEL | INTR | 中断进程（SIGINT） |

    | CTRL-\ | QUIT | 强制核心转储（SIGQUIT） |

    | CTRL-D | EOF | 文件结束 |

    | CTRL-M | CR | 回车（不可更改） |

    | CTRL-J | NL | 换行（不可更改） |


    ## 字符设备(character device)的缓冲区管理


    +   - 字符缓冲区采用缓冲池结构，构成一个字符队列 (Character Queue)，它不同于块设备缓冲区的多次读写，缓冲区中每个字符只能读一次，读后被破坏。


    字符缓冲池的基本分配单位为字符缓冲区 cblock：供各种字符设备（的设备驱动程序）使用。


    +   - 每个缓冲区大小为70字节，内容包括：第一个字符和最后一个字符的位置（便于从开头移出字符和向末尾添加字符），指向下一个缓冲区的指针 cnext，可存放64个字符的数据区


    ## 字符设备缓冲区的操作


    +   - 空闲缓冲区操作：申请空闲缓冲区、释放空闲缓冲区；

    +   - 字符设备缓冲队列操作：从队首读出一个字符、向队尾写入一个字符、读出队首缓冲区的所有字符、向队尾加入一个有数据的缓冲区、从队首读出n个字符、向队尾写入n个字符；


    ## 设备开关表(switch table)


    +   - UNIX设备驱动程序通过相应的块设备开关表和字符设备开关表描述向上与文件系统的接口。开关表是每个设备驱动程序的一系列接口过程的入口表，给出了一组标准操作的驱动程序入口地址，文件系统可通过开关表中的各函数入口地址转向适当的驱动程序入口。


    ## 文件系统


    open close read write ioctl


    open close read write


    缓冲区管理


