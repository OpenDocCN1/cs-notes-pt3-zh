    \n- 阻塞原语\n  1) 停止执行；2) 插入等待队列；3) 重新调度。\n  - 暂停一段时间sleep；暂停并等待信号pause；等待子进程暂停或终止wait\n\
    - 唤醒原语\n  - 发送信号到某个或一组进程kill\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_379_0.png)\n\
    \n## 进程同步\n\n- 间接相互制约。主要原因是资源共享。\n- 直接相互制约。主要源于进程合作。\n- 进程同步：指多个相关进程在执行次序上的协调，用于保证这种关系的相应机制称为同步机制。\n\
    \n| 相互感知的程度 | 交互关系 | 一个进程对其他进程的影响 | 潜在的控制问题 |\n|---|---|---|---|\n| 相互不感知（完全不了解其它进程的存在）\
    \ | 竞争（competition） | 一个进程的操作对其他进程的结果无影响 | 互斥，死锁（可释放的资源），饥饿 |\n| 间接感知（双方都与第三方交互，如共享资源）\
    \ | 通过共享进行协作 | 一个进程的结果依赖于从其他进程获得的信息 | 互斥，死锁（可释放的资源），饥饿，数据一致性 |\n| 直接感知（双方直接交互，如通信）\
    \ | 通过通信进行协作 | 一个进程的结果依赖于从其他进程获得的信息 | 死锁，饥饿 |\n\n## 竞争状态（race condition）\n\n-\
    \ 两个或多个进程对同一共享数据同时进行读写操作，而最后的结果是不可预测的，它取决于各个进程具体运行情况。\n- 在同一时刻，只允许一个进程访问该共享数据，即如果当前已有一个进程正在使用该数据，那么其他进程暂时不能访问。这就是互斥的概念。\n\
    \n## 临界区\n\n- 临界资源\n  - 这种一次只允许一个进程使用的资源称为临界资源。\n  - 例如打印机、变量。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_383_0.png)\n\
    \n| Time | Person A | Person B |\n|------|----------|----------|\n| 3:00 | Look\
    \ in Fridge. Out of milk |  |\n| 3:05 | Leave for store |  |\n| 3:10 | Arrive\
    \ at store | Look in Fridge. Out of milk |\n| 3:15 | Buy milk | Leave for store\
    \ |\n| 3:20 | Arrive home, put milk away | Arrive at store |\n| 3:25 |  | Buy\
    \ milk |\n| 3:30 |  | Arrive home, put milk away |\n\n```\nP1:      R1:=R1+1;\n\
    R1:=count;\n        count:=R1;\nP2:\nR1:=R1+1;\nR2:=count;\ncount:=R1;\nR2:=R2+1;\n\
    count:=R2;\n\nP1: R1:=count;\nP2: R2:=count;\nR1:=R1+1;\nP2:\nR2:=count;\ncount:=R1;\n\
    R2:=R2+1;\ncount:=R2;\ncount:=R2;\n```\n\n## 临界区的定义\n\n- 每个进程中访问临界资源的那段代码称为临界区。\n\
    \n```\nRepeat\nentry section\ncritical section\nexit section\nremainder section\n\
    until false\n```\n\n- 任何两个进程都不能同时进入临界区；\n- 不能事先假定CPU的个数和运行速度；\n- 当一个进程运行在它的临界区外面时，不能妨碍其他的进程进入临界区；\n\
    - 任何一个进程进入临界区的要求应该在有限时间内得到满足。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_388_0.png)\n\
    \n## 同步机制应遵循的准则\n\n- 空闲让进\n- 忙则等待\n- 有限等待\n- 让权等待\n\n```\nenter_region:\n    TSL\
    \ REGISTER,LOCK        ; copy lock to register and set lock to 1\n    CMP REGISTER,#0\
    \           ; was lock zero?\n    JNE enter_region          ; if it was non zero,\
    \ lock was set, so loop\n    RET | return to caller; critical region entered\n\
    \nleave_region:\n    MOVE LOCK,#0              ; store a 0 in lock\n    RET |\
    \ return to caller\n```\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_391_0.png)\n\
    \n## 软件实现进程互斥 1\n\n- 两个进程Pi, Pj，其中Pi\n\n- 设立一个公用整型变量 turn： 描述允许进入临界区的进程标识\n\n\
    - 在进入区循环检查是否允许本进程进入： turn为i时，进程Pi可进入；\n\n- 在退出区修改允许进入进程标识： 进程Pi退出时，改turn为进程Pj的标识；\n\
    \n```\nwhile turn != i do\ncritical section;\nturn := j;\nremainder sectio\n```\n\
    \n- 缺点：强制轮流进入临界区，没有考虑进程的实际需要。\n  - 容易造成资源利用不充分：在 Pi 进出临界区之后，Pj 使用临界区之前，Pi 不可能再次使用临界区；\n\
    \n- **优点：** 不用交替进入，可连续使用；\n\n- **缺点：** Pi和Pj可能同时进入临界区。按序列执行时，会同时进入：“Pi<a> Pj<a>\
    \ Pi<b> Pj<b>”。即在检查对方flag之后和切换自己flag之前有一段时间，结果都检查通过。这里的问题出在检查和修改操作不能连续进行。\n\n\
    ## 软件实现进程互斥 3\n\n```\nflag[i] := true;\n<a>\nwhile (flag[j]) do\nskip; <b>\ncritical\
    \ section;\nflag[i] := false;\nremainder section;\n```\n\n- 类似于算法2，与互斥算法2的区别在于先修改后检查。仍防两进程同时进入临界区。\n\
    \n缺点：Pi和Pj可能都进入不了临界区。按下面序列执行时，会都进不了临界区：“Pi<a> Pj<a> Pi<b> Pj<b>”。即在切换自己flag之后和检查对方flag之前有一段时间，结果都切换flag，都检查不通过。\n\
    \n## 软件实现进程互斥 4\n\n```\nflag[i] := true;  turn := j;\nwhile (flag[j] && turn ==\
    \ j) do skip;\ncritical section;\nflag[i] := false;\nremainder section;\n```\n\
    \n- 在进入区先修改后检查，并检查并发修改的先后：(Peterson algorithm)\n- 检查对方flag，如果不在临界区则自己进入——空闲则入\n\
    - 否则再检查turn：保存的是较晚的一次赋值，则较晚的进程等待，较早的进程进入——先到先入，后到等待\n"
