    \n## I/O设备\n\n- 类型\n  - 传输速度：低速、中速、高速\n  - 信息交换单位：块设备和字符设备（网络）\n  - 共享属性：独占设备、共享设备、虚拟设备\n\
    - 设备与控制器之间的接口\n  - 数据信号\n  - 控制信号\n  - 状态信号\n\n## 设备控制器\n\n- 控制设备的功能\n  - 接收和识别命令\n\
    \  - 数据交换\n  - 设备状态的了解和报告\n  - 地址识别\n- 组成\n  - 控制器与处理机接口\n  - 与设备接口\n  - I/O逻辑\n\
    \n| I/O address range (hexadecimal) | device |\n|---|---|\n| 000-00F | DMA controller\
    \ |\n| 020-021 | interrupt controller |\n| 040-043 | timer |\n| 200-20F | game\
    \ controller |\n| 2F8-2FF | serial port (secondary) |\n| 320-32F | hard-disk controller\
    \ |\n| 378-37F | parallel port |\n| 3D0-3DF | graphics controller |\n| 3F0-3F7\
    \ | diskette-drive controller |\n| 3F8-3FF | serial port (primary) |\n\n## How\
    \ does the processor actually talk to the device?\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_812_0.png)\n\
    \n- CPU interacts with a *Controller*\n  - Contains a set of *registers* that\
    \ can be read and written\n  - May contain memory for request queues or bit-mapped\
    \ images\n- Regardless of the complexity of the connections and buses, processor\
    \ accesses registers in two ways:\n  - I/O instructions: in/out instructions\n\
    \    - Example from the Intel architecture: out 0x21, AL\n  - Memory mapped I/O:\
    \ load/store instructions\n    - Registers/memory appear in physical address space\n\
    \    - I/O accomplished with load and store instructions\n\n## I/O通道\n\n- 字节多路通道\n\
    - 数组选择通道\n- 数组多路通道\n- 瓶颈问题\n\n## I/O控制技术\n\n- 程序控制I/O(programmed I/O)\n- 中断驱动方式(interrupt-driven\
    \ I/O)\n- 直接存储访问方式(DMA, Direct Memory Access)\n\n## 程序控制I/O(programmed I/O)\n\n\
    - I/O操作由程序发起，并等待操作完成。数据的每次读写通过CPU。\n- 缺点：在外设进行数据处理时，CPU只能等待。\n\n## 中断驱动方式(interrupt-driven\
    \ I/O)\n\n- I/O操作由程序发起，在操作完成时（如数据可读或已经写入）由外设向CPU发出中断，通知该程序。数据的每次读写通过CPU。\n- 优点：在外设进行数据处理时，CPU不必等待，可以继续执行该程序或其他程序。\n\
    - 缺点：CPU每次处理的数据量少（通常不超过几个字节），只适于数据传输率较低的设备。\n\n## Intel Pentium Processor Event-Vector\
    \ Table\n\n| vector number | description |\n|---|---|\n| 0 | divide error |\n\
    | 1 | debug exception |\n| 2 | null interrupt |\n| 3 | breakpoint |\n| 4 | INTO-detected\
    \ overflow |\n| 5 | bound range exception |\n| 6 | invalid opcode |\n| 7 | device\
    \ not available |\n| 8 | double fault |\n| 9 | coprocessor segment overrun (reserved)\
    \ |\n| 10 | invalid task state segment |\n| 11 | segment not present |\n| 12 |\
    \ stack fault |\n| 13 | general protection |\n| 14 | page fault |\n| 15 | (Intel\
    \ reserved, do not use) |\n| 16 | floating-point error |\n| 17 | alignment check\
    \ |\n| 18 | machine check |\n| 19–31 | (Intel reserved, do not use) |\n| 32–255\
    \ | maskable interrupts |\n\n## 直接存储访问方式(DMA, Direct Memory Access)\n\n- 由程序设置DMA控制器中的若干寄存器值（如内存地址，传送字节数），然后发起I/O操作，而后者完成内存与外设的成批数据交换，在操作完成时由DMA控制器向CPU发出中断。\n\
    - 优点：CPU只需干预I/O操作的开始和结束，而其中的一批数据读写无需CPU牵制，适于高速设备。\n\n- 1. device driver is told\
    \ to transfer disk data to buffer at address X\n- 2. device driver tells disk\
    \ controller to transfer C bytes from disk to buffer at address X\n- 3. disk controller\
    \ initiates DMA transfer\n- 4. disk controller sends each byte to DMA controller\n\
    - 5. DMA controller transfers bytes to buffer X, increasing memory address and\
    \ decreasing C until C = 0\n- 6. when C = 0, DMA interrupts CPU to signal transfer\
    \ completion\n\n```text\nCPU\n\ncache\n\nCPU memory bus\n\nmemory\nbuffer\n\n\
    DMA/bus/interrupt controller\n\nPCI bus\n\nIDE disk controller\n\ndisk\n\ndisk\n\
    \ndisk\n\ndisk\n\n5. DMA controller transfers bytes to buffer X, increasing memory\
    \ address and decreasing C until C = 0\n6. when C = 0, DMA interrupts CPU to signal\
    \ transfer completion\n```\n"
