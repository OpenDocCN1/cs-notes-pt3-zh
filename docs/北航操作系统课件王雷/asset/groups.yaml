    - 计算型进程：每次都执行完时间片，进入更低级队列。最终采用最大时间片来运行，减少调度次数。\n- I/O次数不多，而主要是CPU处理的进程。在I/O完成后，放回I/O请求时所在的队列，以免每次都回到最高优先级队列后再逐次下降。\n\
    - 为适应一个进程在不同时间段的运行特点，I/O完成时，提高优先级；时间片用完时，降低优先级；\n\n## 线程调度\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_646_0.png)\n\
    \n线程运行顺序\n\n进程 A\n\n进程 B\n\n2. 运行时系统选择一个线程\n\n1. 内核选择一个进程\n\n**可能：** A1, A2, A3,\
    \ A1, A2, A3  \n**不可能：** A1, B1, A2, B2, A3, B3\n\n进程 A\n\n进程 B\n\n1. 内核选择一个线程\n\
    \n**可能：** A1, A2, A3, A1, A2, A3  \n**也可能：** A1, B1, A2, B2, A3, B3\n\n## 实时调度\n\
    \n- 要求更详细的调度信息：如，就绪时间、开始或完成截止时间、处理时间、资源要求、绝对或相对优先级（硬实时或软实时）。\n- 采用抢先式调度。\n- 快速中断响应，在中断处理时（硬件）关中断的时间尽量短。\n\
    - 快速任务分派。相应地采用较小的调度单位（如线程）。\n\n## 实时调度算法\n\n- 时间片轮转\n- Rate Monotonic\n- EDF\n\
    - 非抢占优先级\n- 基于时钟中断抢占的优先级\n- 立即抢占\n\n$\\sum_{i=1}^{m} \\frac{C_i}{P_i} \\le 1$\n\
    \n## Rate-Monotonic\n\n- 任务的周期越小，其优先级越高，优先级最高的任务最先被调度\n- 如果两个任务的优先级一样，当调度它们时，RM算法将随机选择一个调度\n\
    \n## Earliest Deadline First\n\n- 任务的绝对截止时间越早，其优先级越高，优先级最高的任务最先被调度\n- 如果两个任务的优先级一样，当调度它们时，EDF\
    \ 算法将随机选择一个调度\n\n| 任务Ji | 起始时间Si | 执行时间Ci | 周期Pi | 截止时间Di |\n|---|---|---|---|---|\n\
    | J1 | 0 | 5 | 10 | 10 |\n| J2 | 0 | 12 | 25 | 25 |\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_652_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_652_1.png)\n\n## 非对称式多处理系统(ASMP)\n\n\
    - 主—从处理机系统，由主处理机管理一个公共就绪队列，并分派进程给从处理机执行。\n- 各个处理机有固定分工，如执行OS的系统功能，I/O处理，应用程序。\n\
    \n## 对称式多处理系统(SMP)\n\n- 按控制方式，SMP调度算法可分为集中控制和分散控制。\n  - 下面所述静态和动态调度都是集中控制，而自调度是分散控制。\n\
    \n- 静态分配(static assignment)：每个CPU设立一个就绪队列，进程从开始执行到完成，都在同一个CPU上。  \n  - 优点：调度算法开销小。\
    \  \n  - 缺点：容易出现忙闲不均。  \n- 动态分配(dynamic assignment)：各个CPU采用一个公共就绪队列，队首进程每次分派到当前空闲的CPU上执行。\n\
    \n## 自调度的问题\n\n- 瓶颈问题\n- 低效问题\n- 线程切换问题\n\n## 成组调度(gang scheduling)\n\n- 将一个进程中的一组线程，每次分派的同时到一组处理机上执行，在剩余处理机时也同时对这一组线程进行。\n\
    \n- 优点\n  - 通常这样的一组线程在应用逻辑上相互合作，成组调度提高了这些线程的执行并行度，有利于减少阻塞和加快推进速度，最终提高系统吞吐量。\n\
    \  - 每次调度可以完成多个线程的分派，在系统内线程总数相同时能够减少调度次数，从而减少调度算法的开销。\n\n## 专用处理机调度(dedicated\
    \ processor assignment)\n\n- 为进程中的每个线程都固定分配一个CPU，直到该线程执行完成。\n- 缺点：线程阻塞时，造成CPU的闲置。优点：线程执行时不需切换，相应的开销可以大大减小，推进速度更快。\n\
    - 适用场合：CPU数量众多的高度并行系统，单个CPU利用率已不太重要。\n\n## 传统UNIX的进程调度\n\n- 未设置作业调度，进程调度采用基于时间的多级反馈队列算法，进程优先级分为核心优先级和用户优先级。\n\
    \n## 调度时机\n\n- 调度由0号进程完成（始终在核心态执行）。时机：\n- 进程由核心态转入用户态时：在每次执行核心代码之后返回用户态之前，检查各就绪进程的优先级并进行调度。如中断——进程回到就绪队列\n\
    - 进程主动放弃处理机时：进程申请系统资源而未得到满足（如read），或进行进程间同步而暂停（如wait或pause），或进程退出（如exit）——进程进入阻塞队列或exit状态。\n\
    \n"
