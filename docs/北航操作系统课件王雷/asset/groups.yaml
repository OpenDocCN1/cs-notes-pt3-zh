  md: "\n## 具体算法\n\n- 假定顾客分成若干次进存；并在第一次借款时，能说明他的最大借款额。具体算法：\n  - 顾客的借款操作依次顺序进行，直到全部操作完成；\n\
    \  - 银行家对当前顾客的借款操作进行判断，以确定其安全性（能否支持顾客借款，直到全部归还）；\n  - 安全时，贷款；否则暂不贷款。\n\n- 可利用资源向量\
    \ Available\n- 最大需求矩阵 Max\n- 分配矩阵 Allocation\n- 需求矩阵 Need\n\n- 5 processes \\\
    (P_0\\) through \\(P_4\\); 3 resource types \\(A\\) (10 instances), \\(B\\) (5\
    \ instances), and \\(C\\) (7 instances).\n\n- Snapshot at time \\(T_0\\):\n\n\
    | Process | Allocation A | Allocation B | Allocation C | Max A | Max B | Max C\
    \ | Available A | Available B | Available C |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n\
    | \\(P_0\\) | 0 | 1 | 0 | 7 | 5 | 3 | 3 | 3 | 2 |\n| \\(P_1\\) | 2 | 0 | 0 | 3\
    \ | 2 | 2 |  |  |  |\n| \\(P_2\\) | 3 | 0 | 2 | 9 | 0 | 2 |  |  |  |\n| \\(P_3\\\
    ) | 2 | 1 | 1 | 2 | 2 | 2 |  |  |  |\n| \\(P_4\\) | 0 | 0 | 2 | 4 | 3 | 3 |  |\
    \  |  |\n\n- The content of the matrix. Need is defined to be Max – Allocation.\n\
    \n_Need_          _Allocation_ _Max_ _Available_\n_A B C_         _A B C_ _A B\
    \ C_ _A B C_\nP0 7 4 3   P0 0 1 0   7 5 3   3 3 2\nP1 1 2 2   P1 2 0 0   3 2 2\
    \   5 3 2\nP2 6 0 0   P2 3 0 2   9 0 2   7 4 3\nP3 0 1 1   P3 2 1 1   2 2 2  \
    \ 7 4 5\nP4 4 3 1   P4 0 0 2   4 3 3   10 4 7\n                            10\
    \ 5 7\n\n- The system is in a safe state since the sequence < P1, P3, P4, P2,\
    \ P0 > satisfies safety criteria.\n\n- Check that Request ≤ Available (that is,\
    \ (1,0,2) ≤ (3,3,2)) ⇒ *true*.\n\n|  | Allocation |  |  | Need |  |  | Available\
    \ |  |  |\n|---|---|---|---|---|---|---|---|---|---|\n|  | A | B | C | A | B |\
    \ C | A | B | C |\n| P₀ | 0 | 1 | 0 | 7 | 4 | 3 | 2 | 3 | 0 |\n| P₁ | 3 | 0 |\
    \ 2 | 0 | 2 | 0 |  |  |  |\n| P₂ | 3 | 0 | 1 | 6 | 0 | 0 |  |  |  |\n| P₃ | 2\
    \ | 1 | 1 | 0 | 1 | 1 |  |  |  |\n| P₄ | 0 | 0 | 2 | 4 | 3 | 1 |  |  |  |\n\n\
    - Executing safety algorithm shows that sequence <P₁, P₃, P₄, P₀, P₂> satisfies\
    \ safety requirement.\n\n- Can request for (3,3,0) by P₄ be granted?\n\n- Can\
    \ request for (0,2,0) by P₀ be granted?\n\n## 银行家算法的特点\n\n- 允许互斥、部分分配和不可抢占，可提高资源利用率；\n\
    - 要求事先说明最大资源要求，在现实中很困难；\n\n## 检测死锁\n\n- 保存资源的要求和分配信息，利用某种算法对这些信息加以检查，以判断是否存在死锁。死锁检测算法主要是检查是否有循环等待。\n\
    - 在UNIX系统中，PS；Windows中的任务管理器\n\n## 资源分配图 (resource allocation graph)算法\n\n有向图G的顶点为资源或进程，从资源R到进程P的边表示R已分配给P，从进程P到资源R的边表示P正因请求R而处于等待状态。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_699_0.png)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_701_0.png)\n\
    \n## 死锁定理\n\n- 不可简化的资源分配图====>存在死锁\n\n## 死锁解除\n\n- 死锁解除重要的是以最小的代价恢复系统的运行\n- 死锁解除后，释放资源的进程应恢复它原来的状态，才能保证该进程的执行不会出现错误\n\
    - 实质：如何让释放资源的进程能够继续运行\n  - 选择一个牺牲进程\n  - 重新运行或回退到某一点开始继续运行\n  - 回退到足以解除死锁即可\n\
    \  - 怎样保证不发生“饥饿”现象，如何保证并不总是剥夺同一进程的资源\n  - “最小代价”，即最经济合算的算法，使得进程回退带来的开销最小\n\n##\
    \ 计算机操作系统\n\n教师：王雷\n\n助教：王欢 王刚 李康 王宇 赵玉龙\n\n82316284, wanglei@buaa.edu.cn, http://219.224.165.31\n\
    \n## 问题\n\n- 性能\n- 复杂\n\n## 设备的管理的目的和功能\n\n- **外设管理目的**\n  - 提高效率：提高 I/O 访问效率，匹配\
    \ CPU 和外设不同处理速度\n  - 方便使用：方便用户使用，对不同类型的设备统一使用方法，协调对设备的并发使用\n  - 方便控制：方便 OS 内部对设备的控制；增加和删除设备，适应新的设备类型\n\
    \n- **外设管理功能**\n  - 提供设备使用的用户接口：命令接口和编程接口。\n  - 设备分配和释放：使用设备前，需要分配设备和相应的通道、控制器。\n\
    \  - 设备的访问和控制：包括并发访问和差错处理。\n  - I/O 缓冲和调度：目标是提高 I/O 访问效率。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_709_0.png)\n\
    \n北京航空航天大学　计算机学院　王雷\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_710_0.png)\n\n\
    CDC 6600\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_711_0.png)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_712_0.png)\n\
    \n## I/O系统的组成\n\n- I/O系统的结构\n  - 微型机I/O系统\n  - 主机I/O系统\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_714_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_715_0.png)\n\n## Main components of\
    \ Intel Chipset: Pentium 4\n\n- **Northbridge:**\n  - Handles memory\n  - Graphics\n\
    - **Southbridge: I/O**\n  - PCI bus\n  - Disk controllers\n  - USB controllers\n\
    \  - Audio\n  - Serial I/O\n  - Interrupt controller\n  - Timers\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_717_0.png)\n"
