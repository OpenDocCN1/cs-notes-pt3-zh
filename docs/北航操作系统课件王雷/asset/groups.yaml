  - '[PAGE 635]


    # 优先级算法(Priority Scheduling)


    +   - 本算法是平衡各进程对响应时间的要求。适用于作业调度和进程调度，可分成抢先式和非抢先式。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_635_0.png)'
  - '[PAGE 636]


    # 静态优先级


    +   - 创建进程时就确定，直到进程终止前都不改变。通常是一个整数。依据：

    +     - 进程类型（系统进程优先级较高）

    +     - 对资源的需求（对CPU和内存需求较少的进程，优先级较高）

    +     - 用户要求（紧急程度和付费多少）'
  - '[PAGE 637]


    # 动态优先级


    +   - 在创建进程时赋予的优先级，在进程运行过程中可以自动改变，以便获得更好的调度性能。如：

    +     - 在就绪队列中，等待时间延长则优先级提高，从而使优先级较低的进程在等待足够的时间后，其优先级提高到可被调度执行；

    +     - 进程每执行一个时间片，就降低其优先级，从而一个进程持续执行时，其优先级降低到出让CPU。'
  - '[PAGE 638]


    # 高响应比优先调度算法


    +   - 响应比=(执行时间＋等待时间)／执行时间

    +   - 等待时间相同，短作业优先

    +   - 要求服务时间相同，优先权决定于等待时间，（FCFS）

    +   - 长作业等待时间长，优先权提高'
  - '[PAGE 639]


    <!-- no content -->'
  - '[PAGE 640]


    ![](img/861c0ad57b0249095c0356c9e5a83b26_640_0.png)'
  - '[PAGE 641]


    # 多级反馈队列算法(Round Robin with Multiple Feedback)


    +   - 多级反馈队列算法时间片轮转算法和优先级的综合和发展。优点：

    +     - 为提高系统吞吐量和缩短平均周转时间而照顾短进程

    +     - 为获得较好的I/O设备利用率和缩短响应时间而照顾I/O型进程

    +     - 不必估计进程的执行时间，动态调节'
  - '[PAGE 642]


    # 多级反馈队列算法


    +   - 设置多个就绪队列，分别赋予不同的优先级，如逐级降低，队列1的优先级最高。每个队列执行时间片的长度也不同，规定优先级越低则时间片越长，如逐级加倍


    +   - 新进程进入内存后，先投入队列1的末尾，按FCFS算法调度；若按队列1一个时间片未能执行完，则降低投入到队列2的末尾，同样按FCFS算法调度；如此下去，降低到最后的队列，则按“时间片轮转”算法调度直到完成。


    +   - 仅当较高优先级的队列为空，才调度较低优先级的队列中的进程执行。如果进程执行时有新进程进入较高优先级的队列，则抢先执行新进程，并把被抢先的进程投入原队列的末尾。'
