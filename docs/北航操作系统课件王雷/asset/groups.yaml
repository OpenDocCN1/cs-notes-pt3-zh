  md: "\n## Bakery Algorithm\n\nCritical section for n processes\n\n- Before entering\
    \ its critical section, process receives a number. Holder of the smallest number\
    \ enters the critical section.\n- If processes $P_i$ and $P_j$ receive the same\
    \ number, if $i < j$, then $P_i$ is served first; else $P_j$ is served first.\n\
    - The numbering scheme always generates numbers in increasing order of enumeration;\
    \ i.e., 1,2,3,3,3,3,4,5...\n\n### Bakery Algorithm\n\n- Notation <= lexicographical\
    \ order (ticket #, process id #)\n  - $(a,b) < (c,d)$ if $a < c$ or if $a = c$\
    \ and $b < d$\n  - $\\max(a_0,\\cdots,a_{n-1})$ is a number, $k$, such that $k\
    \ \\ge a_i$ for $i = 0,\\cdots,n-1$\n\n- Shared data\n\n```\nboolean choosing[n];\n\
    int number[n];\n```\n\nData structures are initialized to false and 0 respectively\n\
    \n### Bakery Algorithm\n\n```\ndo {\n    choosing[i] = true;\n    number[i] =\
    \ max(number[0], number[1], ..., number[n - 1])+1;\n    choosing[i] = false;\n\
    \    for (j = 0; j < n; j++) {\n        while (choosing[j]);\n        while ((number[j]\
    \ != 0) && ((number[j], j) < (number[i], i)));\n    }\n    critical section\n\
    \    number[i] = 0;\n    remainder section\n```\n\n## 信号量机制\n\n- 1965年Dijkstra。P（S），V（S）操作。P、V分别是荷兰语的test(proberen)和increment(verhogen)\n\
    - 其基本思路是用一种新的变量类型（semaphore）\n- 信号量只能通过初始化和两个标准的原语来访问——作为OS核心代码执行，不受进程调度的打断\n\n\
    ## 经典信号量机制\n\n```\nP(S) :while S<=0 do skip\n    S:=S-1;\n```\n\n```\nV(S) :S:=S+1;\n\
    ```\n\n## 计数信号量\n\n```\nSemaphore(S)\n{\n    value : integer;\n    L : list of\
    \ process;\n    while (S.value <= 0)\n        block(S.L);\n    end\n}\n\nprocedure\
    \ V(S)\n{\n    var S : semaphore;\n    begin\n        S.value := S.value + 1;\n\
    \        if S.value <= 0 then wakeup(S.L);\n    end\n```\n\n## 信号量的使用：\n\n- 必须置一次且只能置一次初值\n\
    - 只能由 P、V 操作来改变\n\n## 物理意义\n\n- S.value为正时表示资源的个数\n- S.value为负时表示等待进程的个数\n- P操作分配资源\n\
    - V操作释放资源。\n\n## 信号量机制的实现\n\n- 原子性问题；\n  - 关中断、TS指令等\n- PCB链表形式。\n\n## 补充练习\n\n\
    ```\nmovl sem, %ecx\ndecl 0(%ecx)\njs down_failed\n......\ndown_failed: block\n\
    ```\n\n## 信号量的应用\n\n- 互斥\n  - 利用信号量实现进程互斥（S=1）\n- 同步\n  - 利用信号量实现进程同步（S=0）\n-\
    \ 描述前趋关系\n  - 利用信号量实现描述前趋关系（S=0）\n\n## 互斥\n\nP(S)\n\n临界区\n\nV(S)\n\nP(S)\n\n临界区\n\
    \nV(S)\n\n## 同步\n\nP(S)\n\n代码\n\n代码\n\nV(S)\n\n## 前趋关系\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_411_0.png)\n\
    \n## 解题步骤：\n\n- 分析问题，弄清楚同步关系；\n- 设置信号量，说明其含义和初值；\n- 写出程序描述。\n\n## “信号量集”机制\n\n\
    Process A:    Process B:\nP(Dmutex);    P(Emutex);\nP(Emutex);    P(Dmutex);\n\
    \nProcess A: P(Dmutex);\nProcess B: P(Emutex);\nProcess A: P(Emutex);\nProcess\
    \ B: P(Dmutex);\n\n## AND型信号量集机制\n\n- 基本思想：将进程需要的所有共享资源一次全部分配给它；待该进程使用完后再一起释放。\n\
    \n```\nSP(S1, S2, ...,Sn)\n    if S1=>1 and ... and Sn=>1 then\n        for I\
    \ :=1 to n do\n            Si := Si - 1; SV(S1, S2, ...,Sn)\n        endfor\n\
    \    else\n        wait in Si;\n    endif\n    for I :=1 to n do\n        Si :=\
    \ Si + 1;\n        wake waited proces\n    endfor\n```\n\n## 一般“信号量集”机制\n\n- 一次需要N个某类临界资源时，就要进行N次wait操作一一低效又可能死锁\n\
    - 基本思想：在AND型信号量集的基础上进行扩充：进程对信号量Si的测试值为ti（用于信号量的判断，即Si >= ti，表示资源数量低于ti时，便不予分配），占用值为di（用于信号量的增减，即Si\
