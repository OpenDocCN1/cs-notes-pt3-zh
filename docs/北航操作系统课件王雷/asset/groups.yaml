    - 字符缓冲池的基本分配单位为字符缓冲区 cblock：供各种字符设备的设备驱动程序使用。\n- 每个缓冲区大小为 70 字节，内容包括：第一个字符和最后一个字符的位置（便于从开头移出字符和向末尾添加字符），指向下一个缓冲区的指针\
