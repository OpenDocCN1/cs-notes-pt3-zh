  md: "\n## 卷安装\n\n- 每个文件系统驱动程序在初始化时都向I/O管理器注册\n- 每个设备对象包含一个卷参数块VPB，但是I/O管理器认为只有卷设备对象的VPB是有意义的\n\
    - 安装请求\n\n- 安装管理器把D:分配给系统中的第二个卷\n- 它产生符号连接\\??\\D:指向设备对象\\Device\\HarddiskVolume2。\n\
    - 一个WIN 32应用程序试图打开D:上的文件\\Temp\\Test.txt时，它将会指定路径D:\\Temp\\Test.txt。\n\n- WIN\
    \ 32子系统在调用NtCreateFile之前将路径转化为\\??\\D:\\Temp\\Test.txt。\n- I/O管理器将检查\\Device\\\
    HarddiskVolume2的VPB是否引用一个文件系统。\n\n1\n文件系统驱动程序完成扇区级的 I/O\n\n2\nI/O 管理器把 IRP 传送给\
    \ DMIO 驱动程序\n\n\\Device\\HarddiskDmVolumes\\PhysicalDmVolumes\\BlockVolume3\n\n\
    DMIO 驱动程序\n\n3\nDMIO 驱动程序决定 IRP 目标物理磁盘的哪个分区，并产生一个目标为该分区所对应的 IRP\n\n\\Device\\\
    Harddisk0\\DR0\n\n\\Device\\Harddisk0\\DR1\n\n4\nI/O 管理器把 IRP 传送给磁盘类驱动程序\n\n磁盘类驱动程序\n\
    \n磁盘端口驱动程序\n\n磁盘小端口驱动程序\n\n5\n磁盘类驱动程序执行硬件 I/O 访问磁盘\n\nHarddisk 0\n条状分区 1\n\nHarddisk\
    \ 1\n条状分区 2\n\n## 计算机操作系统\n\n教师：王雷\n\n助教：王振 赵玉龙 王宇 王鲁俊\n\n82316284，wanglei@buaa.edu.cn，http://219.224.165.31\n\
    \n## 文件管理\n\n- 什么是文件系统\n- 文件的存取方式\n- 文件的物理组织\n- 文件的存取控制\n- 对文件的操作\n- 文件系统的层次结构\n\
    \n- **硬件资源：**\n  中央处理机、主存储器及各种输入输出设备。\n\n- **软件资源：**\n  各种系统程序、标准程序和某些常用的应用程序。\n\
    \n所有的应用程序都需要存储和检索信息，但是这些信息应该保存在哪里呢？当一个进程正在运行的时候，可以将一些信息保存在它自己的地址空间中，但一则，进程地址空间的大小是有限的；二则，当进程运行结束后，这些信息就丢失了。因此，有些信息必须保存在磁盘、光盘等外部存储设备上，因为这些存储设备能够长期地保存大量的信息。\n\
    \n## 信息应该如何来存放？\n\n- 信息的种类繁多：\n  - 数据：数值数据、字符数据、二进制数据；\n  - 程序；\n\n- 信息访问的局部性，每次只访问一部分的信息；\n\
    \n- 有些信息可能会被多个不同的进程所访问；\n\n- 为解决这些问题，提出“文件”的概念，把信息组织成文件的形式，并用文件作为信息的存储和访问单位。\n\
    \n## 文件、文件系统\n\n- 文件\n- 逻辑结构和物理结构\n- 文件类型\n- 文件系统\n\n## 基本概念\n\n- 文件是具有符号名的数据项的集合。文件名是文件的标识符号。文件包括两部分：\n\
    \  - 文件体：文件本身的信息；\n  - 文件说明：文件存储和管理信息；如：文件名、文件内部标识、文件存储地址、访问权限、访问时间等；\n- 文件是一种抽象机制，它提供了一种把信息保存在磁盘等存储设备上，并且便于以后访问的方法。抽象性体现在用户不必关心具体的实现细节。\n\
    - 可以视为一个单独的连续的逻辑地址空间，其大小即为文件的大小，与进程的地址空间无关。\n\n## 文件管理\n\n- 早期解决方法\n  - 将程序和数据保存在纸带和卡片上，再用纸带机或卡片机输入到计算机\n\
    - 磁盘存储器和磁带存储器出现，程序和数据才开始真正被计算机管理\n- 解决方法：把信息以一种单元，即文件的形式存储在磁盘或其他外部介质上\n- 文件是通过操作系统来管理的，包括：\n\
    \  - 文件的结构，命名，存取，使用，保护和实现方法\n\n可以从两种不同的观点来看待文件系统：\n\n- 用户观点：关心的是文件系统所提供的对外的用户接口，包括文件如何命名、如何保护、如何访问（创建、打开、关闭、读、写等）；\n\
    - 操作系统观点：关心的是如何来实现与文件有关的各个功能模块，包括如何来管理存储空间、文件系统的布局、文件的存储位置等。\n\n## 逻辑文件和物理文件\n\
    \n- 逻辑文件：\n  用户看到的建立在逻辑结构基础上的文件。\n- 物理文件：\n  存储在物理设备上的文件。\n\n## 文件名\n\n- 当一个文件被创建时，必须给它指定一个名字，用户通过文件名来访问文件。\n\
    - 命名规则：文件名是一个有限长度的字符串。一个文件名一般由两部分组成，中间用句点隔开。\n- 文件名.扩展名\n- 文件名的长度一般不超过8个字符，但很多系统支持长文件名，即255个字符。文件名可以由字母、数字和特殊字符组成，有的系统区分字母的大小写（如Unix），有的系统则不区分（如Windows）。\n\
    \n## 文件类型\n\n- 按性质和用途分：\n  - 系统文件、库文件、用户文件\n- 按数据形式：\n  - 源文件、目标文件、可执行文件\n- 按对文件实施的保护级别分：\n\
    \  - 只读文件、读写文件、执行文件\n- 按逻辑结构分：\n  - 有结构文件、无结构文件\n- 按文件中物理结构分：\n  - 顺序文件、链接文件、索引文件\n\
    \n| file type | usual extension | function |\n|---|---|---|\n| executable | exe,\
    \ com, bin or none | read to run machine-language program |\n| object | obj, o\
    \ | compiled machine language, not linked |\n| source code | c, cc, java, pas,\
    \ asm, a | source code in various languages |\n| batch | bat, sh | commands to\
    \ the command interpreter |\n| text | txt, doc | textual data, documents |\n|\
    \ word processor | wp, tex, rtf, doc | various word-processor formats |\n| library\
    \ | lib, a, so, dll, mpeg, mov, rm | libraries of routines for programmers |\n\
    | print or view | arc, zip, tar | ASCII or binary file in a format for printing\
    \ or viewing |\n| archive | arc, zip, tar | related files grouped into one file,\
    \ sometimes compressed, for archiving or storage |\n| multimedia | mpeg, mov,\
    \ rm | binary file containing audio or A/V information |\n\n## 文件操作\n\n- 创建文件\n\
    - 删除文件\n- 读文件\n- 写文件\n- 截断文件\n- 设置文件的读写位置\n\n1. Create\n2. Delete\n3. Open\n4.\
    \ Close\n5. Read\n6. Write\n7. Append\n8. Seek\n9. Get attributes\n10. Set Attributes\n\
    11. Rename\n\n- 文件太多了怎么办？不同的应用程序有不同类型的文件，不同的用户有不同的文件，如何对它们进行组织、分类？\n- 如何对文件进行管理？当用户需要访问某个文件时，如何根据这个文件名迅速地定位到相应的文件，从而对文件的属性和内容进行各种操作？\n\
    - 解决的办法就是：目录。\n\n- 效率：要能迅速定位一个文件；\n- 命名：要方便用户；\n  - 重名：对不同的用户文件，可使用相同名字；\n  -\
    \ 别名：对同一个文件，可有多个不同的名字；\n- 分组功能：能够把不同的文件按照某种属性进行分组（如某门课程的所有文件可分为讲义、作业、参考资料等不同的组）。\n"
