  - '[PAGE 266]


    # 最近最久不用的页面置换算法


    选择内存中最久未使用的页面被置换，这是局部性原理的合理近似，性能接近最佳算法。但由于需要记录页面使用时间的先后关系，硬件开销太大。硬件机构如：


    +   - 一个特殊的栈：把被访问的页面移到栈顶，于是栈底的是最久未使用页面。

    +   - 每个页面设立移位寄存器：被访问时左边最高位置1，定期右移并且最前位置0，于是寄存器数值最小的是最久未使用页面。'
