    ## 工作集策略(working set strategy)

    - 引入工作集的目的是依据进程在过去的一段时间内访问的页面来调整常驻集大小。

    - 工作集大小的变化：进程开始执行后，随着访问新页面逐步建立较稳定的工作集，当内存访问的局部性区域的位置大致稳定时，工作集大小也大致稳定，局部性区域的位置改变时，工作集会快速扩张和收缩过渡到下一个稳定值。


