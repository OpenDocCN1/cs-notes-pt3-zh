  - '[PAGE 398]


    # Bakery Algorithm


    Critical section for n processes


    +   - Before entering its critical section, process receives a number. Holder
    of the smallest number enters the critical section.

    +   - If processes $P_i$ and $P_j$ receive the same number, if $i < j$, then $P_i$
    is served first; else $P_j$ is served first.

    +   - The numbering scheme always generates numbers in increasing order of enumeration;
    i.e., 1,2,3,3,3,3,4,5...'
  - '[PAGE 399]


    # Bakery Algorithm


    +   - Notation <= lexicographical order (ticket #, process id #)

    +     - $(a,b) < (c,d)$ if $a < c$ or if $a = c$ and $b < d$

    +     - $\max(a_0,\cdots,a_{n-1})$ is a number, $k$, such that $k \ge a_i$ for
    $i = 0,\cdots,n-1$


    +   - Shared data


    ```

    boolean choosing[n];

    int number[n];

    ```


    Data structures are initialized to false and 0 respectively'
  - "[PAGE 400]\n\n# Bakery Algorithm\n\n```\ndo {\n    choosing[i] = true;\n    number[i]\
    \ = max(number[0], number[1], ..., number[n - 1])+1;\n    choosing[i] = false;\n\
    \    for (j = 0; j < n; j++) {\n        while (choosing[j]);\n        while ((number[j]\
    \ != 0) && ((number[j], j) < (number[i], i)));\n    }\n    critical section\n\
    \    number[i] = 0;\n    remainder section\n```"
