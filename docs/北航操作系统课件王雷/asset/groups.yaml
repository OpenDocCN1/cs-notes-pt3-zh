    - 卷管理器创建卷时都将通知它。当接到通知时，确定新的卷GUID或者磁盘标记；\n- 安装管理器使用卷GUID（或者标识）在内部数据库中进行查询\n- 安装管理者使用第一个未分配的驱动器名，为这次分配创建一个符号链接（例如，\\\
