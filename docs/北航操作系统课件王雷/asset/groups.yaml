  - '[PAGE 532]


    # 数据库结构


    +   - 私有头：GUID，磁盘组的名字。该名字是由Dg0和计算机的名字一起组成（例如SusanDg0，意味着计算机的名字是Susan）和一个指向数据库内容表的指针。为了保证可靠性，LDM在磁盘的最后一个扇区保存了私有头的拷贝。

    +   - 数据库内容表占一个扇区大小，其中包含关于数据库布局的信息。

    +   - 数据库记录头区域紧接着内容表，并将内容表后第一个扇区作为数据库记录头。这个扇区中存储了数据库记录区的信息，包括其所包含的记录个数，数据库相关的磁盘组的名字和GUID，以及LDM用于创建下一项的序列号。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_532_0.png)'
  - '[PAGE 533]


    • 数据库中的每一项可以是如下几种类型之一：分区，磁盘，组件，卷。LDM将这些项与内部对象的标识符联系到一起。在最低的级别，分区项描述软件分区，它是在一个盘上的连续区域。存储在分区项中的标识符把这个项与一个磁盘中的一个磁盘项联系起来。磁盘项代表一个磁盘的动态盘，包括磁盘的GUID。组件项像一条链把一个或多个分区项和与分区相连的卷项联系起来。卷项存放这个卷的GUID、卷的大小和状态、驱动器的字母。比一个数据库记录大的磁盘项占用多个记录的空间，分区项、组件项和卷项很少占用多个记录的空间。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_533_0.png)


    ![](img/861c0ad57b0249095c0356c9e5a83b26_533_1.png)'
  - '[PAGE 534]


    LDM需要三个项来描述一个简单卷。卷项、组件项和卷项。分区项描述系统分配给磁盘上的一个区域，组件项把一个分区项和卷项联系起来，卷项中包含Windows Server
    2003内部用于识别卷的GUID。多数分区卷需要的项数多于1。例如，一个条带卷包括最少两个分区项、一个组件项和一个卷项。唯一一种含有一个以上组件项的卷的类型是：镜像卷。镜像卷含有两个组件项，每个只表示这个镜像的一半。LDM为每个镜像卷创建两个组件项的目的是：当一个镜像破坏时LDM将这两个组件一级将他们分割开来，并创建两个各含有一个分区项的卷。因为简单卷需要三个项，而1MB的数据库空间大约可以容纳8000个项，所以在Windows
    Server 2003中可以创建的卷数目的有效上界大约是2500个。'
  - '[PAGE 535]


    +   - LDM数据库的最后部分是事务处理日志区，它包含的几个扇区在数据库信息改变时用来存储备份信息。这样确保在系统崩溃或断电时，LDM能够利用日志把系统恢复到一个正确状态。'
  - '[PAGE 536]


    # 驱动程序


    +   - 系统卷中引导扇区中的代码负责执行Ntlder。

    +   - Ntlder从系统卷中读取Boot.ini文件，把计算机的引导选项显示给用户。Boot.ini指定分区名为 mult(0)disk(0)rdisk(0)partition(1)的形式。

    +   - Ntlder把Boot.ini中用户指定的项转换为正确的引导分区，然后将Windows Server 2003系统文件（从注册表、Ntoskrnl.exe、引导驱动程序开始）装入内存，继续引导过程。'
