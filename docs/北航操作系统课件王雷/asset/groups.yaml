  - '[PAGE 10]


    # 操作系统的工作


    +   - 程序的执行

    +     - 负责启动每个程序，以及结束程序的工作

    +   - 完成与硬件有关的工作

    +   - 完成与应用无关的工作

    +     - 易于使用，基本服务，统一性

    +   - 计算机系统的效率与安全问题


    假如没有操作系统，怎样控制硬件？'
  - '[PAGE 11]


    # 例子：软盘I/O操作


    +   - 控制芯片NEC PD765有16条命令

    +   - 每一条命令向一个设备寄存器装入长度从1到9字节的特定数据（读写数据、移动磁头、格式化磁道，及初始化、检测状态、复位、校准控制器及设备等）

    +   - 以READ为例：13个参数

    +   - 要读取的磁盘块地址、磁道的扇区数、物理介质的记录格式、扇区间隙、对已删除数据地址标识的处理方法

    +   - 操作结束时，控制器芯片在7个字节中返回23个状态及出错字段

    +   - 软盘程序员还要保持注意步进电机的开关状态'
  - '[PAGE 12]


    ![](img/861c0ad57b0249095c0356c9e5a83b26_12_0.png)'
  - '[PAGE 13]


    # 学习操作系统课的重要性


    +   - 使用计算机必须要使用操作系统

    +     - 交互式

    +     - 编程、系统调用

    +   - 操作系统的设计原理体现了硬件最新的发展

    +     - 计算机体系结构（巨型机、大型机、微机、工作站、多核、GPGPU等）

    +     - 程序设计方法（并发、面向对象、结构化）

    +     - 加深对使用的OS的理解，有利于深入编程

    +     - 编程时借鉴操作系统的设计思想和算法

    +     - 大型系统的设计

    +   - 将来个人的发展'
  - '[PAGE 14]


    # 学习目标


    +   - 对操作系统的基本概念、基本结构及运行环境有深入的认识；

    +   - 系统级编程能力的提高

    +   - 深入到操作系统内部，理解并掌握操作系统的基本原理、设计方法和实现技术

    +   - 思维方式的学习，权衡（Trade Off），抽象

    +   - 了解操作系统的演化过程、发展研究动向、新技术以及新思想'
  - '[PAGE 15]


    # 学习方法


    +   - 按时上课，认真听讲，理解原理

    +   - 阅读参考书，扩展视野

    +   - 阅读代码，分析实例

    +   - 上机实践

    +   - 记笔记，思考，讨论，提问

    +   - Learn OS concepts by coding them!'
  - '[PAGE 16]


    # 学习内容


    +   - ACM Computing Curricula 2001 DRAFT (March 6, 2000)

    +     - Operating system principles

    +     - Concurrency

    +     - Scheduling and dispatch

    +     - Virtual memory

    +     - Device management

    +     - Security and protection

    +     - File systems and naming

    +     - Real-time systems'
