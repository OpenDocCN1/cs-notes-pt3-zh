  - '[PAGE 269]


    # Clock算法


    +   - 也称最近未使用算法(NRU, Not Recently Used)，它是LRU和FIFO的折衷。

    +     - 每页有一个使用标志位(use bit)，若该页被访问则置user bit=1。

    +     - 置换时采用一个指针，从当前指针位置开始按地址先后检查各页，寻找use bit=0的页面作为被置换页。

    +     - 指针经过的user bit=1的页都修改user bit=0，最后指针停留在被置换页的下一个页。'
