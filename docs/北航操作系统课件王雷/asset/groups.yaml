    # 缓冲技术


    +   - 缓冲技术可提高外设利用率。

    +   - 原因

    +     - 匹配CPU与外设的不同处理速度

    +     - 减少对CPU的中断次数。

    +     - 提高CPU和I/O设备之间的并行性。'
