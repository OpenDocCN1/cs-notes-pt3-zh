  md: "\n## Process Creation\n\n- Virtual memory allows other benefits during process\
    \ creation:\n  - Copy-on-Write\n  - Memory-Mapped Files\n\n### Copy-on-Write\n\
    \n- Copy-on-Write (COW) allows both parent and child processes to initially **share**\
    \ the same pages in memory.\n  If either process modifies a shared page, only\
    \ then is the page copied.\n- COW allows more efficient process creation as only\
    \ modified pages are copied.\n- Free pages are allocated from a *pool* of zeroed-out\
    \ pages.\n\n### Memory-Mapped Files\n\n- Memory-mapped file I/O allows file I/O\
    \ to be treated as routine memory access by *mapping* a disk block to a page in\
    \ memory.\n- A file is initially read using demand paging. A page-sized portion\
    \ of the file is read from the file system into a physical page. Subsequent reads/writes\
    \ to/from the file are treated as ordinary memory accesses.\n- Simplifies file\
    \ access by treating file I/O through memory rather than read()/write() system\
    \ calls.\n- Also allows several processes to map the same file allowing the pages\
    \ in memory to be shared.\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_285_0.png)\n\
    \n## 抖动问题(thrashing)\n\n- 随着驻留内存的进程数目增加，或者说进程并发水平(multiprogramming level)的上升，处理器利用率先是上升，然后下降。这里处理器利用率下降的原因通常称为虚拟存储器发生“抖动”，也就是：每个进程的常驻集不断减小，缺页率不断上升，频繁调页使得调页开销增大。OS要选择一个适当的进程数目，以在并发水平和缺页率之间达到一个平衡。\n\
    \n### 抖动的预防\n\n- 局部置换策略\n- 引入工作集算法\n- 预留部分页面\n- 挂起若干进程\n\n## Separation of Policy\
    \ and Mechanism\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_288_0.png)\n\nPage\
    \ fault handling with an external pager\n\n### 问题\n\n- Can an application modify\
    \ its own translation tables?\n\n### 保护\n\n- 边界保护（上下界限制地址寄存器）：所有访问地址必须在上下界之间；\n\
    - 用户态与内核态\n- 存取控制检查\n- 环保护：处理器状态分为多个环(ring)，分别具有不同的存储访问特权级别(privilege)，通常是级别高的环位于内环，编号小（如0环）级别最高；可访问同环或更低级别环的数据；可调用同环或更高级别环的服务。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_291_0.png)\n\n| User process | Kernel\
    \ |\n|---|---|\n| user process executing | |\n| calls system call | |\n| | trap\
    \ (mode bit = 0) |\n| | execute system call |\n| | return (mode bit = 1) |\n|\
    \ return from system call | |\n| user mode (mode bit = 1) | kernel mode (mode\
    \ bit = 0) |\n\n- 如果硬件没有支持，软件能否实现保护?\n  - Protection via Strong Typing\n    -\
    \ Example languages: LISP, Ada, Modula-3 and Java\n  - Protection via software\
    \ fault isolation\n\n## Unix中的存储管理\n\n- 由于UNIX可在多种平台上运行，其存储管理差异十分大。这里我们介绍Solaris\
    \ 2.x的存储管理系统。Solaris的存储管理系统分成两部分：对换系统（paging system）和内核存储分配器（kernel memory allocator）。\n\
    \  - 对换系统：为进程和磁盘缓存提供页式虚拟存储管理；\n  - 内核存储分配器：为内核提供内存分配服务；\n\n### 对换系统\n\n- 对换系统的数据结构\n\
    \  - 页表(page table)：每个进程有一个页表，进程逻辑空间的每页对应页表中的一个表项；\n  - 硬盘块描述表(disk block descriptor)：该表表项与页表表项一一对应，描述该页在磁盘上的副本；\n\
    \  - 页面表(page frame data table)：按物理页面号排序，描述每个物理页面；\n  - 对换表(swap-use table)：每个磁盘对换区有一个对换表，该对换区的每个页副本对应一个表项；\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_297_0.png)\n\n### 内核存储分配器\n\n- 内核存储分配特征\n\
    \  - 内核需要分配和释放小内存块，用于内核的数据结构和缓冲区；\n  - 这些内存块通常比物理页面要小许多；\n  - 这些内存块的分配和释放要求快速进行；\n\
    \  - 分配和释放的内存块的大小变化是缓慢的。\n\n### 惰性动态分区算法 (lazy buddy system)\n\n- 惰性动态分区算法：该算法是一种动态分区算法。\n\
    \  - 分配的分区大小可变，但只能为2^k。\n  - 释放的分区并不马上合并，而是维持一定数目的各种大小的空闲分区；当空闲分区超过一定数目时，才合并。\n\
    \n## 内存管理方式\n\n- 保留与提交\n- 内存映射文件\n- 内存堆\n\n## 页面调度策略\n\n- 页面调度策略包括取页策略、置页策略和淘汰策略。\n\
    \  - 取页策略：NT采用按进程需要进行的请求取页和按集群方法进行的提前取页。集群方法是指在发生缺页时，不仅装入所需的页，而且装入该页附近的一些页。\n\
    \  - 置页策略：在线性存储结构中，简单地把装入的页放在未分配的物理页面即可。\n  - 淘汰策略：采用局部FIFO置换算法。在本进程范围内进行局部置换，利用FIFO算法把驻留时间最长的页面淘汰出去。\n\
    \n## 工作集策略\n\n- NT根据内存负荷和进程缺页情况自动调整工作集。\n  - 进程创建时，指定一个最小工作集（可用 SetProcessWorkingSetSize\
    \ 函数指定）；\n  - 当内存负荷不太大时，允许进程拥有尽可能多的页面；\n  - 系统通过自动调整保证内存中有一定的空闲页面存在；\n\n## 小结\n\
    \n- 存储组织（层次），存储管理功能\n- 重定位和装入\n- 静态链接和动态链接\n- 存储管理方式：单一连续区管理，分区管理（静态和动态分区）\n-\
    \ 覆盖，交换\n- 页式和段式存储管理：原理，优缺点，数据结构，地址变换，分段的意义，两者比较\n"
  mdcn: "\n\n## 进程创建\n\n- 虚拟内存允许在进程创建期间获得其他好处：\n  - 写时复制\n  - 内存映射文件\n\n### 写时复制\n\
    \n- 写时复制（COW）允许父进程和子进程最初**共享**内存中的同一页。\n  如果任一进程修改了共享页，则仅在此时才复制该页。\n- COW 允许更高效的进程创建，因为只有被修改的页才会被复制。\n\
