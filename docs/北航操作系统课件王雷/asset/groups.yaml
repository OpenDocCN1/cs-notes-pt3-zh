    \n## Word\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_319_0.png)\n\nKeyboard\n\
    \nKernel\n\nDisk\n\n## Web\n\nWeb server process\n\nDispatcher thread\n\nWorker\
    \ thread\n\nWeb page cache\n\nUser space\n\nKernel\n\nKernel space\n\nNetwork\
    \ connection\n\n- MS DOS是单进程、单线程系统；\n- UNIX是多进程系统，但每个进程一个线程；\n- JAVA是单进程、多线程系统；\n\
