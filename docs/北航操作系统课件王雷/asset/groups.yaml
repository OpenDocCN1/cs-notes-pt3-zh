    \n- 由于磁盘对象实际上存在于父对象的子目录中，所以 Windows Server 2003 使用符号链接，把在 `\\??` 子目录下的名字与在名字空间中相应地方的对象联系起来。I/O\
    \ 管理器为系统中的每一个物理盘都创建一个 `\\??\\PhysicalDriveX` 的链接，指向 `\\Device\\HarddiskX\\Partition0`（从零开始的数字来替代\
    \ X）。\n\n- 那些直接访问磁盘扇区的 WIN 32 应用程序可以调用 Win32 函数 CreateFile，通过指定 `\\\\.\\PhysicalDriveX`（X\
