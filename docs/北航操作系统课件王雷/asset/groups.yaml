    ## 段式存储管理

    - 分段地址空间

    - 一个段可定义为一组逻辑信息，每个作业的地址空间是由一些分段构成的；每段都有自己的名字，且都是一段连续的地址空间。


    ## 段式管理的数据结构

    - **进程段表**：描述组成进程地址空间的各段，可以是指向段表中表项的索引。每段有段基址（base address）

    - **系统段表**：系统内所有占用段

    - **空闲段表**：内存中所有空闲段，可以结合到系统段表中


