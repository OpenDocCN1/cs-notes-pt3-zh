    Description.txt\n- C:\\Projects\\CurrentProject\\Description.txt\n"
  mdcn: "\n\n- LDM的分区在一个盘的MSDOS分区表中并没有体现出来，所以被称为软分区，而MSDOS分区被称为硬分区。\n\n# 1MB\n\n主引导记录\n\
    \nLDM 分区区域\n\nLDM 数据库\n\n动态盘的内部组织\n\n北京航空航天大学\n\n计算机学院\n\n王雷\n\n1MB\n\n内容表\n\n\
    数据库记录\n\n处理日志\n\n私有头\n\n数据库记录头\n\n私有头镜像\n\n## 数据库结构\n\n- **私有头**：GUID，磁盘组的名字（该名字是由Dg0和计算机的名字一起组成，例如SusanDg0，意味着计算机的名字是Susan）和一个指向数据库表的指针。为了保证可靠性，LDM在磁盘的最后一个扇区保存了私有头的拷贝。\n\
    - 数据库内容表有16个扇区，其中包含关于数据库布局的信息。\n- 数据库记录区域紧接着内容表，并将内容表后第一个扇区作为数据库记录。这个扇区中存储了数据库记录区域的信息，包括其所包含的记录个数、数据库相关的磁盘组的名字和GUID，以及LDM用于创建下一项的序列号。\n\
    \n- 数据库中的每一项可以是如下四种类型之一：分区，磁盘，组件，卷。LDM把每一项与内部对象的标识符联系到一起。在最低的级别，分区项描述软分区，它是在一个盘上的连续区域。存储在分区项中的标识符把这个项与一个组件和一个磁盘项联系起来。磁盘项代表一个磁盘组中的动态盘，包括磁盘的GUID。组件项像一条链子把一个或多个分区项和与分区相连的卷项联系起来。卷项存放这个卷的GUID，卷的大小和状态，驱动器的名字。比一个数据库记录大的磁盘项占用多个记录的空间，分区项，组件项和卷项很少占用多个记录的空间。\n\
    \n▪ LDM需要三个项来描述一个简单卷：分区项、组件项和卷项。分区项描述系统分配给某个卷的磁盘上的一个区域，组件项把一个分区项和一个卷项联系起来，卷项中包含Windows\
    \ Server 2003内部用来识别卷的GUID。多分区卷需要的项数多于三个，例如，一个条带卷包括至少两个分区项、一个组件项和一个卷项。唯一一种含有一个以上组件项的卷的类型是：镜像卷。镜像卷含有两个组件项，每个只表示这个镜像的一半。LDM为每个镜像卷使用两个组件项的目的是：当一个镜像破坏时LDM能够在组件一级将他们分割开来，并创建两个各含有一个组件项的卷。因为简单卷需要三个项，而1MB数据库空间大约可以容纳8000个项，所以在Windows\
    \ Server 2003中可以创建的卷数目的有效上界大约是2500个。\n\n- LDM数据库的最后部分是事务处理日志，它包含的几个扇区在数据库信息改变时用来存储备份信息。这样确保在系统崩溃或断电时，LDM能够利用日志把系统恢复到一个正确的状态。\n\
    \n## 驱动程序\n\n- 系统卷中引导扇区中的代码负责执行Ntldr。\n- Ntldr从系统卷中读取Boot.ini文件，把计算机的引导选项显示给用户。Boot.ini指定分区名为mult(0)disk(0)rdisk(0)partition(1)的形式。\n\
    - Ntldr把Boot.ini中用斜线指定的项转换为正确的引导分区，然后将Windows Server 2003系统文件（从注册表、Ntoskrnl.exe引导驱动程序开始）装入内存，继续引导过程。\n\
