    \n![](img/861c0ad57b0249095c0356c9e5a83b26_161_0.png)\n\n## FSSTND: (Filesystem\
    \ standard)\n\n- All directories are grouped under the root entry \"/\"\n- root\
    \ - The home directory for the root user\n- home - Contains the user's home directories\
    \ along with directories for services\n  - ftp\n  - HTTP\n  - samba\n- **bin**\
    \ - Commands needed during booting up that might be needed by normal users\n-\
    \ **sbin** - Like bin but commands are not intended for normal users. Commands\
    \ run by Linux.\n- **proc** - This filesystem is not on a disk. It is a virtual\
    \ filesystem that exists in the kernel's imagination, which is memory\n  - 1 -\
    \ A directory with info about process number 1. Each process has a directory below\
    \ proc.\n- **boot** - Files used by the bootstrap loader, LILO, kernel images\
    \ are often kept here.\n- **lib** - Shared libraries needed by the programs on\
    \ the root filesystem\n- **modules** - Loadable kernel modules, especially those\
    \ needed to boot the system after disasters.\n- **dev** - Device files\n- **etc**\
    \ - Configuration files specific to the machine.\n- **skel** - When a home directory\
    \ is created, it is initialized with files from this directory\n- **sysconfig**\
    \ - Files that configure the Linux system for devices.\n- **var** - Contains files\
    \ that change for mail, news, printers log files, man pages, temp files\n  - file\n\
    \  - **lib** - Files that change while the system is running normally\n  - **local**\
    \ - Variable data for programs installed in `/usr/local`.\n  - **lock** - Lock\
    \ files. Used by a program to indicate it is using a particular device or file\n\
    \  - **log** - Log files from programs such as login and syslog, which log all\
    \ logins and logouts.\n  - **run** - Files that contain information about the\
    \ system that is valid until the system is next booted.\n  - **spool** - Directories\
    \ for mail, printer spools, news and other spooled work.\n  - **tmp** - Temporary\
    \ files that are large or need to exist for longer than they should in `/tmp`.\n\
    \  - **catman** - A cache for man pages that are formatted on demand.\n- mnt -\
    \ Mount points for temporary mounts by the system administrator.\n- tmp - Temporary\
    \ files. Programs running after bootup should use /var/tmp\n\n## 远程启动\n\n- 客户端在启动前，既无操作系统，又无启动的软盘或者硬盘，它只有计算机的基本部件：CPU、内存、主板等。但必须有网卡和启动的\
    \ Boot ROM。因此客户机只能通过网络获得操作系统。Linux 的远程启动基于标准的 BOOTP/DHCP 和 TFTP 协议，并通过 NFS 文件系统建立文件系统。\n\
