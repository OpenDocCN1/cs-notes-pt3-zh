    \n## 处理方式\n\n- 为每类设备设置一个进程\n- 整个系统一个I/O进程\n- 不设专门进程\n\n## 设备驱动程序的功能\n\n- 将抽象要求转换为具体要求\n\
    - 检查I/O请求的合法性\n- 发出I/O命令\n- 响应中断请求\n- 构成通道程序\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_759_0.png)\n\
    \n## 处理过程\n\n- 将抽象要求转换为具体要求\n- 检查I/O请求的合法性\n- 读出和检查设备状态\n- 传递必要参数\n- 方式设置\n- 启动I/O设备\n\
    \n## 中断处理程序处理过程\n\n- 唤醒被阻塞的驱动程序\n- 保存现场\n- 转入设备中断处理程序\n- 进行中断处理\n- 恢复被中断进程的现场\n\
    \n## 电源管理\n\n| Device | Li et al. (1994) | Lorch and Smith (1998) |\n|---|---|---|\n\
    | Display | 68% | 39% |\n| CPU | 12% | 18% |\n| Hard disk | 20% | 12% |\n| Modem\
    \ |  | 6% |\n| Sound |  | 2% |\n| Memory | 0.5% | 1% |\n| Other |  | 22% |\n\n\
    ![](img/861c0ad57b0249095c0356c9e5a83b26_765_0.png)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_765_1.png)\n\
    \nPower  \nTime  \n(a)  \nPower  \nTime  \n(b)  \n\n## UNIX的设备管理\n\n- UNIX的外设与特殊文件对应，由文件系统按文件管理方式进行管理，向上提供一个与文件系统统一的接口。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_767_0.png)\n\n文件子系统  \n缓冲区管理  \n字符设备\
    \  \n块设备  \n设备驱动程序  \n硬件控制  \n硬件  \n逻辑 I/O  \n设备 I/O  \n调度与控制  \n\n## I/O多路转接\n\
    \n```c\nwhile((n=read(STDIN_FILENO, buf, BUFSIZ)) > 0)\n    if(write(STDOUT_FILENO,\
    \ buf, n) != n)\n        err_sys(\"write error\");\n```\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_769_0.png)\n\
    \n- `select(int maxfdp1, fd_set *readfds, fd_set *writefds, fd_set *exceptfds,\
    \ struct timeval *tvptr)`\n\n按设备I/O的不同情况，UNIX系统的I/O分成2种：\n- 无缓存I/O (Unbuffered\
    \ I/O)：在进程I/O区域与系统I/O模块间直接进行数据交换；\n- 有缓存I/O (Buffered I/O)：有缓存I/O要经过系统的缓冲区管理机构；它分成系统缓冲区(system\
    \ buffer caches)和字符队列(character queues)两种。\n\n## 块设备(block device)的缓冲区管理\n\n-\
    \ 缓冲区采用缓冲池结构，主要用于磁盘等外存的缓存。\n- 块设备缓冲区结构：缓存块是缓存使用的基本单位，它与外设数据块相对应；每个缓存块由分立的两部分组成：缓冲控制块和缓冲数据区。前者用于缓冲区管理，而后者用于存放数据（长度为512字节或1024字节）。\n\
    - 缓冲控制块：也称为缓冲首部(buffer header)。内容包括：逻辑设备号，物理块号，缓冲区状态（如空闲、延迟写、锁定等标志），指向缓冲数据区的指针，哈希队列的前后向指针，空闲队列的前后向指针\n\
    - 缓冲区管理的相关数据结构\n  - 空闲缓冲队列 (Free list)：系统的所有空闲缓冲区列表；\n  - 设备I/O请求队列 (Driver I/O\
    \ queue)：正与外设进行I/O操作的缓存块列表；一个缓存块必须处于空闲或操作状态；\n  - 设备缓冲区队列 (Device list)：与各外设相关的缓存块列表，其中有缓存数据；\n\
    \n## 缓冲区检索和置换方式\n\n- 设备缓冲区队列为Hash队列：为了检索方便，设备缓冲区队列为一个按(逻辑设备号，物理块号)组织的Hash队列。把逻辑设备号和物理块号之和对64取模作为哈希函数值，据此建立多个哈希队列（64个队列）。\n\
    - 缓存块可同时链入设备缓冲区队列和空闲缓冲队列：一个缓存块在分配给一个外设后，一直与该外设相关(即使该缓存块在空闲缓冲队列中)，直到分配给另一外设。即：设备释放缓冲区后，该缓冲区可处于“延迟写”状态，等待被写入到外设；该缓冲区被重新分配之前，要将其写入到外设。\n\
    - 缓冲区数据读写：\n  - 外设与核心缓冲区间：\n    - 一般读和预先读（适用于数据的顺序访问）：\n      - 一般读是从外设读入指定的数据块，预先读是在一般读的基础上，异步读入一块，以提高数据读取速度；\n\
    \    - 一般写（立即启动I/O并等待完成）、异步写（立即启动I/O而不等待完成，以提高写速度）、延迟写（不立即启动I/O，以减少不必要的I/O操作，但系统崩溃时会产生数据错误）\n\
    \  - 核心缓冲区与进程的用户区间：使用DMA方式在缓存与用户进程进行内存到内存的数据传送，可节约CPU时间，但要占用总线。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_776_0.png)\n\
    \nCPU  \nMemory  \nVideo RAM  \nGraphics adapter  \nVideo controller  \nBus  \n\
    Analog video signal  \n\n"
