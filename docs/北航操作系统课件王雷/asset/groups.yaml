  mdcn: "\n\n- 程序的顺序执行\n- 程序的并发执行和特征\n- Bernstein条件\n\n## 程序的顺序执行与特征\n\n- **顺序性**：按照程序结构所指定的次序执行，可能有分支或循环\n\
    - **封闭性**：独占全部资源，计算机的状态只由该程序的控制逻辑所决定\n- **可再现性**：初始条件相同，结果相同。\n\n## 程序并发执行时的特征\n\
    \n- 不可再现性\n- 间断性\n  - 共享资源\n  - 程序之间相互协同，\n- 通信性\n- 独立性\n\n```\nVar N :integer;\n\
    begin\n  N:=0;\n  parbegin\n    program A : begin\n      repeat\n        ...\n\
    \        N:=N+1;\n        until false\n      end\n    program B : begin\n    \
    \  repeat\n        ...\n        print(N);\n        N:=N+1;\n        ...\n    \
    \    until false\n      end\n  parend\nend\n```\n\nN=1 N=0\n\n- S₁: a:=x+y\n-\
    \ S₂: b:=z+1\n- S₃: c:=a-b\n- S₄: w:=c+1\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_347_0.png)\n\
    \n在顺序环境下\nCPU利用率 = 40/80 = 50%\nDEV1利用率 = 15/80 = 18.75%\nDEV2利用率 = 25/80 = 31.25%\n\
