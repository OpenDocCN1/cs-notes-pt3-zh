    \  - 进程切换\n\n- 线程：\n  - 进程中的一个实体\n  - 是一个CPU调度和分派的单位\n  - 基本上不拥有资源，只有必不可少的少量资源\n\
    \  - 可以与其他同进程的线程共享进程拥有的所有资源\n\n- 引入进程好处\n  - 多个程序可以并发执行，改善资源使用率，提高系统效率\n- 引入线程好处\n\
