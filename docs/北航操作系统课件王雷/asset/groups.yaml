  - '[PAGE 1134]


    # 对计算机系统的安全防护


    +   - 防止非法入侵

    +     - 防火墙技术、安全网关技术主要是防止非法入侵；

    +   - 防止信息泄密

    +     - 各种信息加密技术主要是保证信息传递中的安全；

    +   - 以及防止对系统的破坏。

    +     - 信息平台安全技术则主要是确保计算机系统本身的安全性，以便保证计算机应用系统和网络安全可靠地运行，以及在万一被非法入侵后将破坏限制在最小的局部范围，并保证计算机及其网络系统整体的安全。同时，它也为防止非法入侵提供了基本的技术支持手段。'
  - '[PAGE 1135]


    +   - 在保证计算机系统及信息安全上，安全技术和密码技术两者缺一不可。而CPU和操作系统是安全技术的关键，安全操作系统是信息平台安全技术的核心。

    +   - 操作系统是构建安全系统的基石。为了构筑我国信息与网络安全防线，我国在信息安全研究方面，制订了相应的标准，并进行了安全操作系统、多级安全数据库等的研制。

    +   - 我们必须采用国产的CPU和相应的与之配套的安全操作系统，在此基础上构筑自己的安全信息平台和应用系统，从根本上解决我国的信息安全问题。'
  - '[PAGE 1136]


    +   - 美国国防部于1983年提出了“可信计算机评估准则”，它是迄今评估计算机安全最有名的标准之一。其后又制订了关于网络系统、数据库等方面的系列安全解释，形成了安全信息系统体系结构的最初原则。'
  - '[PAGE 1137]


    T C S E C 将安全保护分成四等、八个级别，分别为 D，C1，C2，B1，B2，B3，A1，超 A1，安全等级依次增强。不满足任何较高级别安全可信条件的系统均为
    D 类。'
  - "[PAGE 1138]\n\n+   - C 类为自主型保护，由两个级别组成。  \n+     - C1级：具有一定的自主型存取控制机制。象 UNIX\
    \ 的 OWNER/GROUP/OTHER 存取控制。  \n+     - C2级：具有更细粒度（到每一个单独用户）的自主型存取机制，而且引入审计机制。"
  - '[PAGE 1139]


    +   - B类为强制型保护，由三个级别组成：

    +     - B1级：满足C2级所有的要求，而且需要有所用安全策略模型的非形式化描述，实施强制型存取控制。

    +     - B2级：系统的可信计算基（TCB）是基于明确定义的形式化模型，并对系统中所有的主体和客体实施自主型存取控制和强制型存取控制。另外，具有可追溯控制、系统结构设计、最小特权管理以及对隐通道的分析和处理等。

    +     - B3级：系统的TCB设计要满足能够对系统中所有的主体对客体的访问进行控制，TCB不会被非法篡改。且TCB设计非常的小而结构化以便于分析和测试其正确性。支持安全管理员的实现，审计机制能实时报告系统的安全性事件，支持系统恢复。'
  - '[PAGE 1140]


    +   - A类为验证型保护，由两个级别组成：

    +     - A1级：从实现的功能上看，它等同于B3。它的特色在于形式化的顶层设计规格（FTDS）、形式化验证FTDS与形式化模型的一致性和由此带来的更高的可信度；

    +     - A1以上级：比A1级可信度更高的系统归入该级。'
