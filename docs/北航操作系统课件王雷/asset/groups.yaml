  - "[PAGE 433]\n\n# 采用管程解决生产者-消费者问题\n\n```\nMonitor PC {\n    condition full, empty;\n\
    \    int buffer[N];\n    int pnum = N;\n    int cnum = 0;\n\n    public producer\
    \ {\n        if( pnum > 0 )\n            pnum--;\n        else\n            full.wait;\n\
    \        one >> buffer;\n        cnum++;\n        if (cnum <= 0)\n           \
    \ empty.signal;\n    }\n\n    public consumer {\n        if( cnum > 0 )\n    \
    \        cnum--;\n        else\n            empty.wait;\n        one >> buffer;\n\
    \        pnum++;\n        if (pnum <= 0)\n            full.signal;\n    }\n}\n\
    ```"
