    ## 流机制(streams)


    +   - 流的引入：流的引入是为了解决内核驱动程序抽象层次过高，而引起的驱动程序功能大量重复。它可提供一个完全基于消息的模块化的驱动程序编写方法。

    +   - 流的定义：流是一组系统调用、内核资源和创建、使用及拆除流的例程的集合，构成一个数据传输通道，两端为读队列和写队列。

    +   - 流的结构：上行流(upstream)和下行流(downstream)


    ![](img/861c0ad57b0249095c0356c9e5a83b26_877_0.png)


    ## 流的多路复用机制


    +   - 上部多路复用器：向上连接多个流；

    +   - 下部多路复用器：向下连接多个流；

    +   - 双向多路复用器：同时支持向上连接的多个流和向下连接的多个流；


    I/O子系统


    I/O管理器


    核心态设备驱动程序


