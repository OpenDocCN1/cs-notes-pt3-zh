    # 环形缓冲(circular buffer)


    +   - 多个缓冲区，CPU和外设的处理速度可能相差较大。可参见“生产者—消费者问题”，关键是资源量的增减（空或满的缓冲区数目）而不是生产者和消费者的指针移动。'
