- raw:
  - '[PAGE 1006]


    # 目录管理


    +   目录是由文件说明索引组成的用于文件的检索特殊文件。文件目录的内容主要是文件访问和控制的信息（不包括文件内容）。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_1006_0.png)'
  - '[PAGE 1007]


    ![](img/861c0ad57b0249095c0356c9e5a83b26_1007_0.png)'
  - '[PAGE 1008]


    # 目录内容


    +   - 目录的内容是文件属性信息(properties)，其中的一部分是用户可获取的

    +   - 基本信息

    +     - 文件名：字符串，通常在不同系统中允许不同的最大长度。可以修改。有些系统允许同一个文件有多个别名(alias)；

    +     - 别名的数目；

    +   - 文件类型：可有多种不同的划分方法，如：

    +     - 有无结构（记录文件，流式文件）

    +     - 内容（二进制，文本）

    +     - 用途（源代码，目标代码，可执行文件，数据）

    +     - 属性attribute（如系统，隐含等）

    +     - 文件组织（如顺序，索引等）'
  - '[PAGE 1009]


    +   - 地址信息

    +     - 存放位置：包括哪个设备或文件卷 volume，以及各个存储块位置；

    +     - 文件长度（当前和上限）：以字节、字或存储块为单位。可以通过写入或创建、打开、关闭等操作而变化

    +   - 访问控制信息

