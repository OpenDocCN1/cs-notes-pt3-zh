  - '[PAGE 199]


    # 多重分区分配


    ▪ 多重分区分配：一个作业往往由相互独立的程序段和数据段组成，将这些片断分别装入存储空间中不同的区域内的分配方式。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_199_0.png)'
  - '[PAGE 200]


    # 覆盖


    +   - 覆盖：“覆盖”管理，就是把一个大的程序划分成一系列的覆盖，每个覆盖是一个相对独立的程序单位。把程序执行时并不要求同时装入主存的覆盖组成一组，称其为覆盖段，这个覆盖段被分配到同一个存储区域。这个存储区域称之为覆盖区，它与覆盖段一一对应。

    +   - 缺点：编程时必须划分程序模块和确定程序模块之间的覆盖关系，增加编程复杂度。从外存装入覆盖文件，以时间延长来换取空间节省。'
  - '[PAGE 201]


    # 覆盖管理


    ![](img/861c0ad57b0249095c0356c9e5a83b26_201_0.png)


    主程序（24K）


    覆盖段1


