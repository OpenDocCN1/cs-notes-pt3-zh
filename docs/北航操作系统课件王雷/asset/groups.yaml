  - '[PAGE 625]


    +   - 不可抢占式方式

    +     - 一旦处理器分配给一个进程，它就一直占用处理器，直到该进程自己因调用原语操作或等待I/O等原因而进入阻塞状态，或时间片用完时才让出处理器，重新进行

    +   - 抢占式方式

    +     - 就绪队列中一旦有优先级高于当前运行进程优先级的进程存在时，便立即进行进程调度，把处理器转给优先级高的进程'
  - '[PAGE 626]


    # 先来先服务(FCFS, First Come First Service)


    +   - 这是最简单的调度算法，按先后顺序调度。

    +     - 按照作业提交或进程变为就绪状态的先后次序，分派CPU；

    +     - 当前作业或进程占用CPU，直到执行完或阻塞，才出让CPU（非抢占方式）。

    +     - 在作业或进程唤醒后（如I/O完成），并不立即恢复执行，通常等到当前作业或进程出让CPU。最简单的算法。


    +   - FCFS的特点

    +     - 比较有利于长作业，而不利于短作业。

    +     - 有利于CPU繁忙的作业，不利于I/O繁忙的作业。'
  - '[PAGE 627]


    # 短作业优先(SJF, Shortest Job First)


    +   - 又称为 “短进程优先” SPN(Shortest Process Next)；这是对FCFS算法的改进，其目标是减少平均周转时间。

    +   - 对预计执行时间短的作业（进程）优先分派处理机。通常后来的短作业不抢先正在执行的作业。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_627_0.png)


    ![](img/861c0ad57b0249095c0356c9e5a83b26_627_1.png)'
  - '[PAGE 628]


    <!-- no content -->'
  - '[PAGE 629]


    # 时间片轮转(Round Robin)算法


    前两种算法主要用于宏观调度，本算法主要用于微观调度，设计目标是提高资源利用率。其基本思路是通过时间片轮转，提高进程并发性和响应时间特性，从而提高资源利用率；


    ![](img/861c0ad57b0249095c0356c9e5a83b26_629_0.png)'
  - '[PAGE 630]


    # 时间片轮转算法


    +   - 将系统中所有的就绪进程按照FCFS原则，排成一个队列。

    +   - 每次调度时将CPU分派给队首进程，让其执行一个时间片。时间片的长度从几个ms到几百ms。

    +   - 在一个时间片结束时，发生时钟中断。

    +   - 调度程序据此暂停当前进程的执行，将其送到就绪队列的末尾，并通过上下文切换执行当前的队首进程。

    +   - 进程可以未使用完一个时间片，就出让CPU（如阻塞）。'
  - '[PAGE 631]


    # 时间片长度的确定


    +   - 时间片长度变化的影响

    +     - 过长—>退化为FCFS算法，进程在一个时间片内都执行完，响应时间长。

    +     - 过短—>用户的一次请求需要多个时间片才能处理完，上下文切换次数增加，响应时间长。

    +   - 对响应时间的要求：T(响应时间)=N(进程数目)*q(时间片)

    +   - 就绪进程的数目：数目越多，时间片越小

    +   - 系统的处理能力：应当使用户输入通常在一个时间片内能处理完，否则使响应时间，平均周转时间和平均带权周转时间延长。'
  - '[PAGE 632]


