    \  - (a) 经典以太网\n  - (b) 交换式以太网\n\n## 网络硬件（2）\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1119_0.png)\n\
    \n## 互联网\n\n## 基于共享对象的中间件\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1121_0.png)\n\
    \n- ■ 基于CORBA的系统的主要元素\n  - • 公共对象请求代理体系结构\n\n## 进程迁移\n\n- 数据迁移\n- 计算迁移\n\n## 迁移的原因\n\
    \n- 负载平衡\n- 通信性能\n- 加速计算\n- 需要特殊资源\n- 提高可利用性\n\n## 进程迁移机制\n\n- 发动迁移\n- 迁移那些部分\n\
    - 如何进行迁移\n\n## 分布式进程同步\n\n- 事件排序\n  - 为每个进程建立逻辑时钟\n  - 收到消息进程的逻辑时钟大于发出消息的逻辑时钟，如果收到消息的进程发现消息的逻辑时钟大于自己的逻辑时钟，则重置自己的逻辑时钟。\n\
    \    - Send(m)=100, Receive(m)=90, 因此需要 Receive(m)=Send(m)+1=101\n- Lamport算法\n\
    \n## 假设条件\n\n- 对系统节点N进行编号，每个节点有一个进程提出请求。\n- 按序传递消息。\n- 消息在有限时间内送达。\n- 处理器直接通信。\n\
    \n- 每个进程在发消息时加上自己的逻辑时钟 Ti，并保持一个请求队列\n\n- Pi请求某个资源时，Request（Ti，i）发送到自己的队列，并发送给其他进程\n\
    \n- Pj收到Request（Ti，i），回复Reply（Tj，j），放入自己的队列。如果Pj收到Request（Ti，i）前已经请求过同一资源，其比较本地的邮戳时间，如果Ti＞Tj，则推迟回复。\n\
    \n- 允许访问\n  - Pi请求处于队列的最前面\n  - 收到的其他请求，晚于（Ti，i）\n\n- 从自己的队列中去掉消息，发Release消息给其他进程\n\
    \n- Pj收到Pj的Release后，消去请求消息。\n\n- 当每一个进程要访问一个共享资源时，本算法要求该进程发送3（N-1）个消息，其中（N-1）个Request消息，（N-1）个Reply消息，（N-1）个Release消息。\n\
    \n## 远程过程调用\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1128_0.png)\n\n- RPC可用于不同机器或同一机器上地址空间之间的通信\n\
    \  - 服务可以在最合适的位置运行\n  - 访问本地和远程服务的方式看起来相同\n- 现代RPC系统的示例：\n  - CORBA（公共对象请求代理体系结构）\n\
    \  - DCOM（分布式COM）\n  - RMI（Java远程方法调用）\n\n"
