    \n- 编译成可执行文件\n- 用户告诉shell执行该可执行程序\n- 创建一个新的子进程\n  - 创建进程控制块\n- 装入hello程序\n  -\
    \ 操作系统找到该程序，检查其类型\n  - 检查程序首部，找出正文和数据的地址\n  - 可执行文件映射到进程结构\n  - 设置CPU上下文环境，并设置程序开始处\n\
    \  - 调度hello程序\n- 执行程序的第一条指令\n  - 执行失败，缺页中断发生\n  - 分配一页内存，并将代码从磁盘读入，继续执行\n  -\
    \ 更多的缺页中断，读入更多的页面\n\n## 操作系统的工作\n\n- 程序的执行\n  - 负责启动每个程序，以及结束程序的工作\n- 完成与硬件有关的工作\n\
    - 完成与应用无关的工作\n  - 易于使用，基本服务，统一性\n- 计算机系统的效率与安全问题\n\n假如没有操作系统，怎样控制硬件？\n\n### 例子：软盘I/O操作\n\
    \n- 控制芯片NEC PD765有16条命令\n- 每一条命令向一个设备寄存器装入长度从1到9字节的特定数据（读写数据、移动磁头、格式化磁道，及初始化、检测状态、复位、校准控制器及设备等）\n\
    - 以READ为例：13个参数\n  - 要读取的磁盘块地址、磁道的扇区数、物理介质的记录格式、扇区间隙、对已删除数据地址标识的处理方法\n- 操作结束时，控制器芯片在7个字节中返回23个状态及出错字段\n\
    - 软盘程序员还要保持注意步进电机的开关状态\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_12_0.png)\n\
    \n## 学习操作系统课的重要性\n\n- 使用计算机必须要使用操作系统\n  - 交互式\n  - 编程、系统调用\n- 操作系统的设计原理体现了硬件最新的发展\n\
    \  - 计算机体系结构（巨型机、大型机、微机、工作站、多核、GPGPU等）\n  - 程序设计方法（并发、面向对象、结构化）\n  - 加深对使用的OS的理解，有利于深入编程\n\
    \  - 编程时借鉴操作系统的设计思想和算法\n  - 大型系统的设计\n- 将来个人的发展\n\n## 学习目标\n\n- 对操作系统的基本概念、基本结构及运行环境有深入的认识；\n\
    - 系统级编程能力的提高\n- 深入到操作系统内部，理解并掌握操作系统的基本原理、设计方法和实现技术\n- 思维方式的学习，权衡（Trade Off），抽象\n\
    - 了解操作系统的演化过程、发展研究动向、新技术以及新思想\n\n## 学习方法\n\n- 按时上课，认真听讲，理解原理\n- 阅读参考书，扩展视野\n-\
    \ 阅读代码，分析实例\n- 上机实践\n- 记笔记，思考，讨论，提问\n- Learn OS concepts by coding them!\n\n##\
    \ 学习内容\n\n- ACM Computing Curricula 2001 DRAFT (March 6, 2000)\n  - Operating\
    \ system principles\n  - Concurrency\n  - Scheduling and dispatch\n  - Virtual\
    \ memory\n  - Device management\n  - Security and protection\n  - File systems\
    \ and naming\n  - Real-time systems\n\n### ACM Computing Curricula 的变化\n\n- 知识点进行了细化\n\
    - 增加了选修部分\n- 去掉了通信、网络和分布式等内容\n\n## 1. Brown University\n\n- 课程名称：**CS167/CS169\
    \ Operating System**\n- 授课教师：**Tom Doeppner**\n\n### CS167 课程介绍\n\n本课程讨论操作系统的基本原理\n\
    \n- 第一部分为基本概念：多线程设计和并发，动态存储、分配和释放，链接和装入，文件系统和虚存\n- 第二部分为操作系统的当前设计概念：微内核和面向对象处理技术\n\
    - 最后部分是分布式系统：计算机网络通信协议，远程过程调用协议，计算机安全，并发管理，分布式文件和存储系统\n\n### 实习项目\n\n- shell，9月14日前完成\n\
    - 线程，10月5日前完成\n- 线程应用，10月22日\n- 虚拟文件系统，11月12日\n- 文件系统，12月7日\n- 基础系统：Weenix\n\n\
    ### 评分依据\n\n- 5个程序(40%)\n- 家庭作业(20%)\n- 期中考试(10%)\n- 期末考试(30%)\n\n### 特点\n\n-\
    \ **cs167** 为操作系统课堂授课，而 **cs169** 为操作系统课程实习\n- 基本要求：独立思考、独立设计和独立编码\n- 允许和其它学生探讨功课、教科书的内容和一般的高层概念\n\
    - 可以回答其它学生的有关设计任务中使用的软件包的问题，但问题必须是具体的，不对解决设计问题形成较大的帮助\n\n## 2. Princeton University\n\
    \n- 课程名称：COS 318: Operating systems\n- 授课教师：Vivek Pai\n\n### 评分依据\n\n- 阅读、讨论与练习：20%\n\
    - 中考：15%\n- 项目：65%\n\n### 教学\n\n- 采用讲课与课堂中讨论结合的方式\n- 教师提前提供阅读分配材料、讨论课题及练习\n- 学生在上课之前先行阅读和思考讨论题\n\
    - 不参与得0分；1至3分为阅读、讨论题及练习的理解\n- 两种方式表明理解：参加课堂讨论或在上课前交文章\n\n"
