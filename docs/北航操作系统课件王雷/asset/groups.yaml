    # 内存保护机制


    +   - 所有系统范围内核心态组件使用的数据结构和内存缓冲池只能在核心态下访问。

    +   - 每个进程有一个独立、私有的地址空间，禁止其它进程的线程访问。

    +   - 支持的处理器还提供了一些硬件内存保护措施（如读/写，只读等）。

    +   - 共享内存区域对象具有标准的Windows Server 2003存取控制表（ACLs）'
