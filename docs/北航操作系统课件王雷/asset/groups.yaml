    \n## 工作原理\n\n## 基本概念\n\n- **扇区（sector）**\n  - 盘片被分成许多扇形的区域\n- **磁道（track）**\n\
    \  - 盘片上以盘片中心为圆心、不同半径的同心圆。\n- **柱面（cylinder）**\n  - 硬盘中，不同盘片相同半径的磁道所组成的圆柱。\n-\
    \ 每个磁盘有两个盘面，每个面都有一个磁头(head)。\n\n## 温彻斯特盘\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_896_0.png)\n\
    \n磁头架\n\n磁头0\n\n扇区\n\n磁道0\n\n柱面0\n\n柱面1\n\n柱面2\n\n## 磁盘的组织\n\n- 问题：读一个扇区需要柱面/磁头/扇区？\n\
    - 现代磁盘驱动器可以看做一个一维的逻辑块的数组，逻辑块是最小的传输单位\n- 一维逻辑块数组按顺序映射到磁盘的扇区。\n  - 扇区0是最外面柱面的第一个磁道第一个扇区。\n\
    \  - 该映射是先按磁道内扇区顺序，再按柱面内磁道顺序，再按从外到内的柱面顺序来排序的。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_898_0.png)\n\
    \n- 绝大多数磁盘都有一些缺陷扇区，因此映射必须用磁盘上的其他空闲扇区来替代这些缺陷扇区。\n- 对于磁盘，每个磁道的扇区数并不是常量。\n  - 磁道的位密度\n\
