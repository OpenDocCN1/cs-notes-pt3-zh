  - '[PAGE 1067]


    ![](img/861c0ad57b0249095c0356c9e5a83b26_1067_0.png)'
  - '[PAGE 1068]


    +   - 文件卷(volume)信息：记录在引导记录的扇区中。包括：簇大小，根目录项数目，FAT表大小，磁盘参数（每道扇区数，磁头数），文件卷中的扇区总数，簇编号长度等

    +   - 逻辑扇区号：三元组（柱面号，磁头号，扇区号）->一个文件卷中从0开始对每个扇区编号，优点：屏蔽了物理磁盘参数的不同

    +   - 允许同时访问的文件卷数目上限可以由config.sys文件中的LASTDRIVE= 语句指定'
  - '[PAGE 1069]


    +   - 簇 (cluster)：由若干个扇区组成。在文件卷中从 0 开始对每个簇编号。


    +   - 对簇大小的讨论

    +     - 文件卷容量越大，若簇的总数保持不变即簇编号所需位数保持不变，则簇越大。缺点：簇内碎片浪费越多

    +     - 文件卷容量越大，若簇大小不变，则簇总数越多，相应簇编号所需位数越多，可以是 12、16、32 二进制位即 FAT12、FAT16、FAT32。'
  - '[PAGE 1070]


    +   - FAT表：两个镜像，互为备份。文件卷中的每个簇均对应一个FAT表项，文件分配采用链式分配方法。每个FAT表项所占位数是簇编号的位数，其值是（以FAT12为例）：

    +     - 0：表示该簇空闲

    +     - FF7h：物理坏扇区

    +     - FF8h~FFFh：表示该簇是文件的最后一个簇

    +     - 其他值：表示该簇被文件占用，而且表项中的值是文件下一个簇的编号。

    +   - FAT表大小占文件卷容量的比例：簇编号位数 / (8*512*每个簇的扇区数)'
  - '[PAGE 1071]


    # 目录


    +   - 是目录项的顺序文件，不对目录项排序。若目录中包含的文件数目较多，则搜索效率低。每个目录项大小为32字节，其内容包括：文件名（8+3个字符），属性（包括文件、子目录和文件卷标识），最后一次修改时间和日期，文件长度，第一个簇的编号。在目录项中，若第一个字节为
    E5h，则表示空目录项；若为 05h，则表示文件名的第一个字符为 E5h。

    +   - 文件名不区分大小写'
  - '[PAGE 1072]


    +   - 系统文件表(SFT, System File Table)和任务文件表(JFT, Job File Table):

    +     - SFT包含系统的所有打开文件，可以由几个子表依次连接组成。

    +     - JFT包含该任务（进程）的所有打开文件。

    +     - SFT的表项数目可由 config.sys 文件中的 FILES= 来语句指定，默认是8。JFT的表项数目默认是20，可以增加从而允许同时打开更多文件'
