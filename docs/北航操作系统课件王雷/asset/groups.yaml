    - 文件物理结构\n  - 表示了一个文件在文件存储器上的位置、链接和编目的方法。\n\n## 顺序文件\n\n- 顺序文件：记录是按某种方式排序的，并按该顺序一个接着一个存取。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1042_0.png)\n\n## 索引顺序文件\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1043_0.png)\n\
    \n## 索引文件\n\n- 索引文件：为每个文件建立一张索引表，其中每一个表目指出文件中记录所在的物理块号。文件的某个记录是否已存入，由索引表中相应的标识位指出。\n\
    \n| 记录号 | 标识 | 物理块号 |\n| --- | --- | --- |\n| 0 | 1 | 4 |\n| 1 | 1 | 7 |\n| 2\
    \ | 0 |  |\n| 3 | 1 | 10 |\n| 4 | 0 |  |\n\n索引式文件\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1044_0.png)\n\
    \n## Figure 12.2 Elements of File Management\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1046_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_1047_0.png)\n\n## 文件存储器存储空间的管理\n\n\
    - 空白文件目录\n- 空白物理块链\n- 位视图\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1048_0.png)\n\
    \n## 空白文件目录\n\n一个连续的未分配区域称为“空白文件”,系统为所有这些“空白文件”单独建立一个目录。对应于每个空白文件，在这个目录中建立一个表目。表目的内容包括：第一空白物理块的物理块号、空白块的数目。\n\
    \n## 空白物理块链\n\n- 成组链接法：\n  - 把空白物理块分成组，在通过指针把组与组之间链接起来，，这种管理空白块的方法称为成组链接法。\n\n\
    - 成组链接法的优点：\n  - 1. 空白块号登记不占用额外空间；\n  - 2. 节省时间；\n  - 3. 采用后进先出的栈结构思想。\n\n## 保护文件的方法\n\
    \n- 建立副本\n- 定时转储\n- 规定文件的权限\n\n## 建立副本\n\n- 把同一个文件保存到多个存储介质上（同类或不同类）\n  - 出故障时，可备用副本替换\n\
    - 优点\n  - 方法简单\n- 缺点\n  - 设备费用和系统开销增大\n- 适用于短小且极为重要的文件\n\n## 定时转储\n\n- 定时转储\n\
    \  - 每隔一定时间把文件转储到其他存储介质上，当文件发生故障，就用转储的文件来复原；把有故障的文件恢复到转储时刻文件的状态\n- UNIX采用定时转储办法保护文件，可以提高文件的可靠性\n\
    \n## 文件保护机制\n\n- 文件保护机制应做到\n  - 防止未被核准的用户存取文件；\n  - 防止一个用户冒充另一个用户来存取；\n  - 防止核准用户（包括文件主）误用文件；\n\
    \n## 存取权限验证步骤\n\n- 审定用户的权限；\n- 比较用户的权限与本次存取要求是否一致；\n- 将存取要求和被访间文件的保密性比较，看是否有冲突。\n\
    \n## 存取控制的实现方案\n\n- 存取控制矩阵\n- 存取控制表\n- 用户权限表\n- 口令\n\nMode of access: read, write,\
    \ execute\nThree classes of users\n\na) owner access\nRWX\n7 ⇒ 1 1 1\nb) group\
    \ access\nRWX\n6 ⇒ 1 1 0\nc) public access\nRWX\n1 ⇒ 0 0 1\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_1057_0.png)\n\
    \n## 文件的并发访问\n\n- 文件并发访问控制的目的是提供多个进程并发访问同一文件的机制\n- 访问文件之前，必须先打开文件：如果文件的目录内容不在内存，则将其从外存读入，否则仍使用已在内存的目录内容。这样，多个进程访问同一个文件都使用内存中同一个目录内容，保证了文件系统的一致性。\n\
    - 文件锁定(file lock)：可以协调对文件指定区域的互斥访问\n  - Solaris 8中 “int lockf(int fildes, int\
    \ function, off_t size);” 的锁定方式：\n    - F_UNLOCK：取消锁定；\n    - F_LOCK：锁定，如果已被锁定，则阻塞；\n\
    \    - F_TLOCK：锁定，如果已被锁定，则失败返回\n    - F_TEST：锁定测试；\n- 利用进程间通信，协调对文件的访问\n\n## 著名的漏洞\n\
    \n- 中文Windows 2000 登录时，启动中文输入法看其帮助，就能够访问文件系统，从而绕过登录机制\n\n- Unix 下，用 lpr 命令（lpr\
    \ 命令是脱机打印命令,该命令将打印作业放到打印缓冲队列中）可以打印任何文件，并有选项指定是否打印完后删除。打印口令文件并删除口令文件后，就不需要口令了。\n\
    \n- Finger name@site 显示计算机用户的身份信息。Finger 程序接受参数的缓冲区是自动变量，而且不检查溢出。将精心设计的长字符串（可以包括攻击指令等）作为参数传递给\
    \ finger, 会导致缓冲区溢出。缓冲区溢出后破坏栈的内容，将栈中的函数调用返回地址改写到攻击代码，那么函数调用返回时就会执行攻击代码。\n"
