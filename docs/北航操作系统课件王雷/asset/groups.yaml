  md: "\n## Intel 386\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_241_0.png)\n\n##\
    \ Intel PTE\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_242_0.png)\n\n- P: Present\
    \ (same as “valid” bit in other architectures)\n- W: Writeable\n- U: User accessible\n\
    - PWT: Page write transparent; external cache write-through\n- PCD: Page cache\
    \ disabled (page cannot be cached)\n- A: Accessed: page has been accessed recently\n\
    - D: Dirty (PTE only); page has been modified recently\n- L: L=1⇒4MB page (directory\
    \ only).\n- Bottom 22 bits of virtual address serve as offset\n\n## 虚拟存储器\n\n\
    - 局部性原理\n- 虚拟存储技术\n\n## 局部性原理\n\n- 程序在执行时，大部分是顺序执行的指令，少部分是转移和过程调用指令。\n- 过程调用的嵌套深度一般不超过5，因此执行的范围不超过这组嵌套的过程。\n\
    - 程序中存在相当多的循环结构，它们由少量指令组成，而被多次执行。\n- 程序中存在相当多对一定数据结构的操作，如数组操作，往往局限在较小范围内。\n\n\
    ## 局部性原理\n\n- 指程序在执行过程中的一个较短时期，所执行的指令地址和指令的操作数地址，分别局限于一定区域。还可以表现为：\n  - 时间局部性，即一条指令的一次执行和下次执行，一个数据的一次访问和下次访问都集中在一个较短时期内；\n\
    \  - 空间局部性，即当前指令和邻近的几条指令，当前访问的数据和邻近的数据都集中在一个较小区域内。\n\n## 虚拟存储的基本原理\n\n- 在程序装入时，不必将其全部读入到内存，而只需将当前需要执行的部分页或段读入到内存，就可让程序开始执行。\n\
    - 在程序执行过程中，如果需执行的指令或访问的数据尚未在内存（称为缺页或缺段），则由处理器通知操作系统将相应的页或段调入到内存，然后继续执行程序。\n- 另一方面，操作系统将内存中暂时不使用的页或段调出保存在外存上，从而腾出空间存放将要装入的程序以及将要调入的页或段——具有请求调入和置换功能，只需程序的一部分在内存就可执行，对于动态链接库也可以请求调入\n\
    \n## 优点\n\n- 可在较小的可用内存中执行较大的用户程序；\n- 可在内存中容纳更多程序并发执行；\n- 不必影响编程时的程序结构（与覆盖技术比较）\n\
    - 提供给用户可用的虚拟内存空间通常大于物理内存(real memory)\n\n## Virtual Memory That is Larger Than\
    \ Physical Memory\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_248_0.png)\n\n##\
    \ 虚拟存储技术的特征\n\n- 离散性：物理内存分配的不连续，虚拟地址空间使用不连续（数据段和栈段之间的空闲空间，共享段和动态链接库占用的空间）\n- 多次性\n\
    - 对换性：与交换的比较：调入和调出是对部分虚拟地址空间进行\n- 虚拟性：通过物理内存和快速外存相结合，提供大范围的虚拟地址空间\n  - 范围大，但占用容量不超过物理内存和外存交换区容量之和\n\
    \  - 占用容量包括：进程地址空间中的各个段，操作系统代码\n\n## 请求式分页系统\n\n- 在运行作业之前，只要求把当前需要的一部分页面装入主存。当需要其它的页时，可自动的选择一些页交换倒辅存去，同时把所需的页调入主存。\n\
    - 虚拟存储系统：控制自动页面交换而用户作业意识不到的那个机构，成为虚拟存储系统。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_250_0.png)\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_251_0.png)\n\nCPU\n\nCPU package\n\n\
    The CPU sends virtual addresses to the MMU\n\nMemory management unit\n\nMemory\n\
    \nDisk controller\n\nThe MMU sends physical addresses to the memory\n\nBus\n\n\
    ## 页表机制\n\n- 需要在进程页表中添加若干项\n  - 标志位：存在位（present bit，内存页和外存页）\n  - 修改位(modified\
    \ bit)\n  - 访问统计：在近期内被访问的次数，或最近一次访问到现在的时间间隔外存地址\n\n## Intel PTE\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_253_0.png)\n\
    \n- P: Present (same as “valid” bit in other architectures)\n- W: Writeable\n\
    - U: User accessible\n- PWT: Page write transparent; external cache write-through\n\
    - PCD: Page cache disabled (page cannot be cached)\n- A: Accessed: page has been\
    \ accessed recently\n- D: Dirty (PTE only); page has been modified recently\n\
    - L: L=1⇒4MB page (directory only). Bottom 22 bits of virtual address serve as\
    \ offset\n\n## 地址变换\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_254_0.png)\n\n\
    ## 缺页故障（Page Fault）处理\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_255_0.png)\n\
    \n## 虚拟存储器的管理\n\n- 置换问题\n- 最小物理块数问题\n- 分配问题\n\n## 页面调入策略\n\n- 1. 请求式提取：仅当需要时才提取页面的策略。\n\
    - 2. 预先调页：事先提取页面的策略。\n- 系统对换区\n- 从文件调入\n\n## Main memory\n\n## Pages\n\n0\n\n\
    3\n\n4\n\n6\n\n## Page table\n\n6\n4\n3\n0\n\n## Disk\n\n## Swap area\n\n7\n5\n\
    2\n1\n\n(a)\n\n## Main memory\n\n## Pages\n\n0\n\n3\n\n4\n\n6\n\n## Page table\n\
    \n6\n4\n3\n0\n\nDisk map\n\n## Disk\n\n## Swap area\n\n7\n5\n2\n1\n\n(b)\n\n##\
    \ 页面置换策略 (Replacement Strategies)\n\n- 一，一种最佳策略:从主存中移出永远不再需要的页面，如无这样的页面存在，则应选择最长时间不需要访问的页面。\n\
    - 二，先进先出算法 (First-in, First-out):总选择作业中在主存驻留时间最长的一页淘汰。\n- 三，最近最久不用的页面置换算法 (Least\
    \ Recently Used Replacement):当需要置换一页时，选择在最近一段时间内最久不用的页面予以淘汰。\n\n## 先进先出算法\n\n\
    - 选择建立最早的页面被置换。可以通过链表来表示各页的建立时间先后。性能较差。较早调入的页往往是经常被访问的页，这些页在FIFO算法下被反复调入和调出。并且有Belady现象。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_262_0.png)\n\n## Belady现象\n\n- 进程P有5页程序访问页的顺序为：1,2,3,4,1,2,5,1,2,3,4,5;\n\
    - 如果在内存中分配3个页面，则缺页情况如下：12次访问中有缺页9次;\n\n| FIFO | 1 | 2 | 3 | 4 | 1 | 2 | 5 | 1\
    \ | 2 | 3 | 4 | 5 |\n|------|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | 页 0 | 1 | 2 | 3 | 4 | 1 | 2 | 5 | 5 | 5 | 3 | 4 | 4 |\n| 页 1 |   | 1 | 2 | 3\
    \ | 4 | 1 | 2 | 2 | 2 | 5 | 3 | 3 |\n| 页 2 |   |   | 1 | 2 | 3 | 4 | 1 | 1 | 1\
    \ | 2 | 5 | 5 |\n| 缺页 | x | x | x | x | x | x | x | √ | √ | x | X | √ |\n"
