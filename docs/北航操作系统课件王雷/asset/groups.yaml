    # CP/M（Control Program Monitor）


    +   - CP/M（Control Program Monitor）是1975年Digital Research公司推出的带有软盘系统的8位微机操作系统，配置在以Intel
    8080、8085、Z80为芯片的微机上。'
  - '[PAGE 112]


    # UNIX操作系统


    +   - UNIX系统在1969~70年有贝尔实验室开发，在PDP-7上运行。

    +   - 于MULTICS项目的研究工作。MULTICS是一个误入歧途而又辉煌灿烂的计算系统。她提供了非常复杂的功能，同时消耗大量的计算资源。她太大而且太慢。


    ![](img/861c0ad57b0249095c0356c9e5a83b26_112_0.png)


    北京航空航天大学　　　　　　　　　计算机学院　　　　　　　　　王雷'
  - '[PAGE 113]


    +   - "little-used PDP-7 sitting in a corner"


    +   - 1970年 UNIX 被移植到 PDP-11/20 上。那可不是一件轻而易举的事，整个系统全是用汇编写的！该系统的手册被标为 "First Edition"，日期为
    1971年11月。'
  - '[PAGE 114]


    +   - 1973年，C语言加入了结构和全局变量。与此同时，Ken和Dennis成功地用C重写了UNIX核心。Shell也被重写了。

    +   - 1974年，Ken和Dennis在Communications of the ACM上发表了论文介绍UNIX系统。

    +   - Rudd Canaday领导的PWB小组支持一个用于大型软件开发的UNIX版本。PWB试图向那些并不对UNIX研究感兴趣的用户提供服务。他们做了大量的工作来强化了UNIX的核心，包括支持更多的用户。PWB的两个非常有用的计划分别是SCCS(源码控制系统)和RJE。

    +   - 1975年，第六版UNIX系统发行了。这是第一个在贝尔实验室外广为流传的UNIX系统。'
  - '[PAGE 115]


    +   - Ferentz创办了一个称为UNIX News的实事通讯 (newsletter)的服务，免费为用户发送消息。后来贝尔告知他不能使用UNIX的名字，于是他把它改名为login。随着越来越多的人想要实事通讯的服务，Ferentz不堪负担提供这些服务了。于是创立一个组织来处理这些费用，它被称为USENIX。USENIX很快负担了其它的义务，包括组织会议和软件的分布。

    +   - 1977年，Interactive Systems公司称为首家向最终用户出售UNIX的公司。UNIX终于成了产品。

    +   - Dennis和Ken最大的突破在于他们清楚的认识到在效率和效用之间存在着折衷。'
  - '[PAGE 116]


    +   - 1977年，加利福尼亚伯克利分校开始发行他们的Pascal解释器。其中还包括了一些新的设备驱动程序，对核心的修改，ex编辑器，和一个比V6的Shell更好用的Shell。这就是1BSD(1st
    Berkeley Software Distribution)。

    +   - 1979年UNIX的第七版发行了。Version 7包括了一个完整的K&R C编译器，

    +   - Arpanet计划，BBN赋予UNIX使用DoD协议来通讯的能力。这些工作后来在伯克利得到改进并捆绑在伯克利的软件。

    +   - 1979间Ken曾在伯克利教授操作系统。在他逗留期间他将UNIX移植到了PDP-11/70上，这是一台可以支持多用户的机器。'
  - '[PAGE 117]


    ![](img/861c0ad57b0249095c0356c9e5a83b26_117_0.png)'
  - '[PAGE 118]


    +   - "Life with UNIX(R) -- A Guide for Everyone"

    +     - Don Libes, Sandy Ressler

    +   - "Unix Programming Environment"

    +     - Brian W. Kernighan, Rob Pike

    +   - "The Design of the UNIX Operating System"

    +     - Maurice Bach

    +   - "The Design and Implementation of the 4.4 BSD Operating System"

    +     - McKusick等'
  - '[PAGE 119]


    # Linux操作系统


    +   - Linux是由Linus Torvalds于1991年开发的。

    +   - 1991年9月，Linux 0.0.1，很不完善。

    +   - 1991年10月，Linux 0.0.2，第一个“正式”版本。两周后0.0.3。

    +   - 1991年12月，Linux 0.1.0，已经有许多人在上面工作了。

    +   - 1994年3月，Linux 1.0'
  md: "\n## 设备管理\n\n- 任务：\n  - 为用户程序分配 I/O 设备\n  - 完成用户程序请求的 I/O 操作\n  - 提高 CPU 和\
