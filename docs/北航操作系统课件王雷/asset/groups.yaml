    \  - 恢复0号进程的上下文，然后执行0号进程，寻找最高优先级的就绪进程。如果没有这样的进程存在，则执行idle进程。如果有这样的进程存在，则该进程作为当前进程来处理机，保存0号进程的上下文。\n\
    \  - 恢复当前进程的上下文，执行该进程。\n\n## Linux的调度\n\n- Linux中实现了三种进程调度策略：\n  - SCHED_OTHER。一般进程。\n\
