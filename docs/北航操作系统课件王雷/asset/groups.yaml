    \n## 内存分配方式\n\n- 以页单位的虚拟内存函数（Virtualxxx），\n  - 保留与提交\n- 内存映射文件函数（CreateFileMapping,\
    \ MapViewOfFile），\n- 堆函数（Heapxxx 和早期的接口 Localxxx 和 Globalxxx）。\n\n## 虚拟地址描述符\n\
    \n范围：20000000到2000FFFF\n保护限制：读/写\n继承：有\n\n范围：00002000到0000FFFF\n保护限制：只读\n继承：无\n\
    \n范围：4E000000到4F000000\n保护限制：复制可写入\n继承：有\n\n范围：32000000到3300FFFF\n保护限制：只读\n继承：无\n\
    \n范围：7AAA0000到7AAA0FFF\n保护限制：读/写\n继承：无\n\n## 内存映射文件\n\n- 加载和执行.exe和dll文件，这可以节省应用程序启动所需的时间；\n\
    - 访问磁盘上的数据文件，这可以减少文件I/O，并且不必对文件进行缓存；\n- 实现多个进程间的数据共享。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_501_0.png)\n\
    \n## 建立过程\n\n- 打开文件，区域对象可以连接到已经打开的磁盘文件（映射文件），或是已提交的页面文件（提供共享内存）。\n- 可以调用 Win32\
    \ 函数 CreateFileMapping 创建区域对象，其参数包括映射到区域对象的文件句柄（或是 INVALID_HANDLE_VALUE 表示页面文件支持区域）。如果区域有名字，其它进程可以用\
    \ OpenFileMapping 打开它。\n- 设备驱动程序可以使用 ZwOpenSection、ZwMapViewOfSection，和 ZwUnmapViewOfSection\
    \ 函数映射区域对象。\n- MapViewOfFile 函数映射区域对象的一部分，并指定映射范围。\n\n## 堆函数\n\n- 缺省进程堆，通常是1MB大小\n\
    - HeapCreate函数创建另外的私有堆，HeapDestroy删除。\n- 串行化选项\n\n## 系统内存分配\n\n- **非分页缓冲池**：由系统在物理内存中组成，它们长期驻留在物理内存中，在任何时刻都可以被访问到（从任何\
    \ IRQL 级和任何进程上下文），而不会发生页错误。需要未分页缓冲池的主要原因是：页错误不能满足在 DPC/调度级或更高。\n- **分页缓冲池**：系统可以被分页和分出系统的空间中虚拟内存的一个区域。不必从\
    \ DPC/调度级或更高一级访问它。设备驱动程序可以使用分页缓冲池。它从任何进程上下文都是可访问的。\n- 系统有两种非分页缓冲池：一种在一般情况下使用，另一种小型的（4页）缓冲池在非分页缓冲池已满并且调用者不能允许分配失败时，紧急使用。\n\
    - 单处理机系统有三个分页缓冲池；多处理机系统有五个。\n- 后备表（Look-Aside Lists）。\n- Ex…\n\n## 缺页处理\n\n- 无效的页表项\n\
    \  - 页文件\n  - 请求零页\n  - 转换\n  - 未知\n- 原型页表项\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_507_0.png)\n\
    \n## 问题\n\n- 同一进程中的另一线程，或一个其它的进程，都可能由于一个相同的页面导致缺页错误。（称为“冲突页错误”，将在下节中介绍）。\n- 页面可能已经从虚拟地址空间中被删除（并重新映射）。\n\
    - 页面的保护限制可能发生了变化。\n- 错误可能是由一个原型页表项引发的，并且这个原型页表项所映射的页面可能并不在工作集中。\n\n## 冲突页错误（Collided\
    \ page fault）\n\n- 页面调度程序检测\n- 等待操作\n- I/O操作完成后，所有等待该事件的线程都会被唤醒\n- 第一个获得页框号数据库锁的线程负责执行页面调入完成操作。\n\
    \n## 页文件\n\n- 最多16个页文件\n- 以非压缩的形式来创建\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_511_0.png)\n\
    \n## 工作集\n\n- 进程工作集\n- 系统工作集\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_512_0.png)\n\
    \n## 系统工作集\n\n- 系统高速缓存页面\n- 分页缓冲池\n- Ntoskrnl.exe中可分页的代码和数据\n- 设备驱动程序中可分页的代码和数据\n\
    - 系统映射视图（部分映射在0xA0000000处，如Win32k.sys）\n"
