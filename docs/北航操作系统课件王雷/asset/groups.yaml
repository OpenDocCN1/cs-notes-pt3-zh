  - '[PAGE 815]


    # 程序控制I/O(programmed I/O)


    +   - I/O操作由程序发起，并等待操作完成。数据的每次读写通过CPU。

    +   - 缺点：在外设进行数据处理时，CPU只能等待。'
  - '[PAGE 816]


    # 中断驱动方式(interrupt-driven I/O)


    +   - I/O操作由程序发起，在操作完成时（如数据可读或已经写入）由外设向CPU发出中断，通知该程序。数据的每次读写通过CPU。

    +   - 优点：在外设进行数据处理时，CPU不必等待，可以继续执行该程序或其他程序。

    +   - 缺点：CPU每次处理的数据量少（通常不超过几个字节），只适于数据传输率较低的设备。'
  - '[PAGE 817]


    # Intel Pentium Processor Event-Vector Table


    | vector number | description |

    |---:|---|

    | 0 | divide error |

    | 1 | debug exception |

    | 2 | null interrupt |

    | 3 | breakpoint |

    | 4 | INTO-detected overflow |

    | 5 | bound range exception |

    | 6 | invalid opcode |

    | 7 | device not available |

    | 8 | double fault |

    | 9 | coprocessor segment overrun (reserved) |

    | 10 | invalid task state segment |

    | 11 | segment not present |

    | 12 | stack fault |

    | 13 | general protection |

    | 14 | page fault |

    | 15 | (Intel reserved, do not use) |

    | 16 | floating-point error |

    | 17 | alignment check |

    | 18 | machine check |

    | 19–31 | (Intel reserved, do not use) |

    | 32–255 | maskable interrupts |'
  - '[PAGE 818]


    # 直接存储访问方式(DMA, Direct Memory Access)


    +   - 由程序设置DMA控制器中的若干寄存器值（如内存地址，传送字节数），然后发起I/O操作，而后者完成内存与外设的成批数据交换，在操作完成时由DMA控制器向CPU发出中断。

    +   - 优点：CPU只需干预I/O操作的开始和结束，而其中的一批数据读写无需CPU牵制，适于高速设备。'
