  - '[PAGE 187]


    # 多用户系统存储器管理----分区式分配


    +   - 把内存分为一些大小相等或不等的分区(partition)，每个应用程序占用一个或几个分区。操作系统占用其中一个分区。

    +   - 适用于多道程序系统和分时系统，支持多个程序并发执行，但难以进行内存分区的共享。'
  - '[PAGE 188]


    # 固定式分区


    +   固定式分区（静态存储区域）：当系统初始化时，把存储空间划分成若干个任意大小的区域；然后，把这些区域分配给每个用户作业。


    | 分区号 | 大小 | 起址 | 状态 |

    | --- | --- | --- | --- |

    | 1 | 12K | 20K | 已分配 |

    | 2 | 32K | 32K | 已分配 |

    | 3 | 64K | 64K | 已分配 |

    | 4 | 128K | 128K | 未分配 |


    分区说明表


    ![](img/861c0ad57b0249095c0356c9e5a83b26_188_0.png)'
  - '[PAGE 189]


    +   - 把内存划分为若干个固定大小的连续分区。  - 分区大小相等：只适合于多个相同程序的并发执行（处理多个类型相同的对象）。  - 分区大小不等：多个小分区、适量的中等分区、少量的大分区。根据程序的大小，分配当前空闲的、适当大小的分区。
    - 优点：易于实现，开销小。 - 缺点：内碎片造成浪费，分区总数固定，限制了并发执行的程序数目。 - 采用的数据结构：分区表——记录分区的大小和使用情况'
