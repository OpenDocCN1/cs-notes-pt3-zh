    # Windows Server 2003的存储驱动程序


    +   - 类： 实现所有存储设备共同的功能

    +   - 端口： 基于某种特定总线设备的共同功能，如SCSI、IDE

    +   - 小端口： OEM提供'
  md: "\n- 取页策略：内存管理器利用请求式页面调度算法以及簇方式将页面装入内存。\n- 置页策略：选择页框位置，使 CPU 内存高速缓存不必要的震荡最小。\n\
    - 换页策略：\n  - 在多处理器系统中，Windows Server 2003 采用了局部先进先出置换策略。而在单处理器系统中，Windows Server\
    \ 2003 的实现更接近于最近最少使用策略（LRU）（称为“轮转算法”，用于大多数版本的 UNIX）。\n\n## 物理内存管理\n\n- 活动（又称有效）\n\
    - 过渡（Transition）\n- 后备（Stand by）\n- 修改\n- 修改写入\n- 空闲\n- 零初始化（zeroed）\n- 坏\n\n\
