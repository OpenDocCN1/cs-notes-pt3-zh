    \nPage table\n\nPresent/absent bit\n\nVirtual page = 2 is used as an index into\
    \ the page table\n\nIncoming virtual address (8196)\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_214_0.png)\n\
    \n## 页面大小\n\n+   - 与体系结构相关\n+   - 2ⁿ\n+   - 通常是：几KB到几MB。  \n+     - 小一>内碎片小；大一>页表短，管理开销小，交换时对外存I/O效率高。\
