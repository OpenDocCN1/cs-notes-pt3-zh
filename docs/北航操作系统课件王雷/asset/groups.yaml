    要求的页、要求的字节\n回写缓冲存储\n```\n\n## 地址窗口扩充\n\n```\n4GB 系统地址空间\n2GB 用户地址空间\nAWE 窗口\n\
    服务器扩展地址空间\n64GB\n0\n物理内存\nAWE 内存\n```\n\n## 外存管理\n\n- Windows Server 2003 存储的演变\n\
    - 分区（Partitioning）\n- 驱动程序（Drivers）\n- 多重分区卷（Multipartition Volume Management）\n\
    - 卷名字空间（The Volume Namespace）\n\n## 早期磁盘管理的缺点\n\n- 对大多数磁盘设置的变化需要重启操作系统才能生效。\n\
    - NT 的注册表和 MS-DOS 方式的分区表保存了多分区磁盘的配置信息。\n- 每个卷有一个唯一的从 A 到 Z 的驱动器名。\n\n- 磁盘是一种物理存储设备。\n\
    - 扇区是可寻址的、大小固定的块。\n- 分区是盘上连续扇区的集合。\n- 简单卷代表文件系统驱动程序作为一个独立单元管理来自一个分区的所有扇区。\n- 多分区卷代表文件系统驱动程序作为一个独立单元管理来自多个分区的所有扇区，多分区卷提供简单卷所不支持的性能、可靠性和大小等特性。\n\
    \n## LDM\n\n- LDM 的数据库存在于每个磁盘最后的 1MB 保留空间中。\n- LDM 实现了一个类似于 MS-DOS 的分区表，这是为了兼容一些在\
    \ Windows Server 2003 下运行的磁盘管理工具，以便在双引导环境中让其它系统不至于认为该磁盘还没有被分区。\n- 由于 LDM 分区在磁盘的\
    \ MS-DOS 分区表中并没有传统的分区标志，所以被称为软分区，而 MS-DOS 分区被称为硬分区。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_529_0.png)\n\
    \n```\n主引导记录\n动态盘区域\n动态盘的内部组织\nLDM 数据库\n1MB\n```\n\nMicrosoft® Windows® 2000/XP\n\
    \n```\n1MB\n内容表\n数据记录\n处理日志\n私有头\n数据记录头\n私有头镜像\n```\n\n### 数据库结构\n\n- 私有头：包含 GUID、磁盘组的名字以及一个指向数据库内容表的指针。磁盘组名字由\
    \ Dg0 和计算机的名字一起组成（例如 SusanDg0，意味着计算机的名字是 Susan）。为了保证可靠性，LDM 在磁盘的最后一个扇区保存了私有头的拷贝。\n\
    - 数据库内容表占用一个扇区大小，其中包含关于数据库布局的信息。\n- 数据库记录头区域紧接着内容表，并将内容表后的第一个扇区作为数据库记录头。这个扇区中存储了数据库记录区的信息，包括其中所包含的记录个数、数据库相关的磁盘组的名字和\
    \ GUID，以及 LDM 用于创建下一项的序列号。\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_532_0.png)\n\
    \n数据库中的每一项可以是如下几种类型之一：分区、磁盘、组件、卷。LDM 将这些项与内部对象的标识符联系到一起。在最低的级别，分区项描述软件分区，它是在一个盘上的连续区域。存储在分区项中的标识符把这个项与一个磁盘中的一个磁盘项联系起来。磁盘项代表一个动态磁盘，包括磁盘的\
    \ GUID。组件项像一条链一样，把一个或多个分区项和与分区相连的卷项联系起来。卷项存放该卷的 GUID、大小、状态和驱动器字母。比一个数据库记录大的磁盘项占用多个记录的空间，分区项、组件项和卷项很少占用多个记录的空间。\n\
    \n![](img/861c0ad57b0249095c0356c9e5a83b26_533_0.png)\n![](img/861c0ad57b0249095c0356c9e5a83b26_533_1.png)\n\
    \nLDM 需要三个项来描述一个简单卷：分区项、组件项和卷项。分区项描述系统分配给磁盘上的一个区域，组件项把一个分区项和卷项联系起来，卷项中包含 Windows\
    \ Server 2003 内部用于识别卷的 GUID。多分区卷需要的项数多于 1。例如，一个条带卷包括最少两个分区项、一个组件项和一个卷项。唯一一种含有一个以上组件项的卷的类型是：镜像卷。镜像卷含有两个组件项，每个只表示这个镜像的一半。LDM\
    \ 为每个镜像卷创建两个组件项的目的是：当一个镜像损坏时，LDM 将这两个组件一并分割开来，并创建两个各含有一个分区项的卷。因为简单卷需要三个项，而 1MB\
    \ 的数据库空间大约可以容纳 8000 个项，所以在 Windows Server 2003 中可以创建的卷数目的有效上界大约是 2500 个。\n\n-\
    \ LDM 数据库的最后部分是事务处理日志区，它包含的几个扇区在数据库信息改变时用来存储备份信息。这样确保在系统崩溃或断电时，LDM 能够利用日志把系统恢复到一个正确状态。\n\
    \n## 驱动程序\n\n- 系统卷的引导扇区中的代码负责执行 `Ntldr`。\n- `Ntldr` 从系统卷中读取 `Boot.ini` 文件，把计算机的引导选项显示给用户。`Boot.ini`\
    \ 指定分区名为 `multi(0)disk(0)rdisk(0)partition(1)` 的形式。\n- `Ntldr` 把 `Boot.ini` 中用户指定的项转换为正确的引导分区，然后将\
    \ Windows Server 2003 系统文件（从注册表、`Ntoskrnl.exe`、引导驱动程序开始）装入内存，继续引导过程。\n\n## Windows\
    \ Server 2003 的存储驱动程序\n\n- 类：实现所有存储设备共同的功能\n- 端口：基于某种特定总线设备的共同功能，如 SCSI、IDE\n\
    - 小端口：OEM 提供\n\n"
