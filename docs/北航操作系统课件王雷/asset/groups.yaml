    \ run-level, scripts are executed to start various processes to run the system\
    \ and make it functional\n\n## The Linux Init Processes\n\n- The init process\
    \ is identified by process id \"1\"\n- Init is responsible for starting system\
    \ processes as defined in the /etc/inittab file\n- Init typically will start multiple\
    \ instances of \"getty\" which waits for console logins which spawn one's user\
    \ shell process\n- Upon shutdown, init controls the sequence and processes for\
    \ shutdown\n\n## System processes\n\n| Process ID | Description |\n|------------|-------------|\n\
    | 0 | The Scheduler |\n| 1 | The init process |\n| 2 | kflushd |\n| 3 | kupdate\
    \ |\n| 4 | kpiod |\n| 5 | kswapd |\n| 6 | mdrecoveryd |\n\n## Initab file\n\n\
