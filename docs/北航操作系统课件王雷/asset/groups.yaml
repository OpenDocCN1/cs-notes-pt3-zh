    - 优点：增加并发运行的程序数目，并且给用户提供适当的响应时间；编写程序时不影响程序结构

    - 缺点：对换入和换出的控制增加处理机开销；程序整个地址空间都进行传送，没有考虑执行过程中地址访问的统计特性。


    ## 分页式存储管理

    - 碎片和紧凑问题

    - 页：在分页存储管理系统中，把每个作业的地址空间分成一些大小相等的片，称之为页面或页。

    - 存储块：在分页存储管理系统中，把主存的存储空间也分成与页面相同大小的片，这些片称为存储块，或称为页框。


    - 页表

    - 哈希页表

    - 反置页表


