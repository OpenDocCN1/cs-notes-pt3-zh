    \    else if (pid == 0) { /* child */\n        glob++;\n        var++;\n     \
    \   /* modify variables */\n    } else\n        sleep(2); /* parent */\n\n   \
    \ printf(\"pid = %d, glob = %d, var = %d\\n\", getpid(), glob, var);\n    exit(0);\n\
    }\n```\n\n- Advanced Programming the Unix Environment\n  - W. Richard Stevens\n\
    \n## 进程状态及其演变\n\n- **进程的三种基本状态**\n  - **就绪状态**：进程已获得除处理机外的所需资源，等待分配处理机资源；只要分配CPU就可执行。\n\
    \  - **执行状态**：占用处理机资源，处于此状态的进程的数目小于等于CPU的数目。在没有其他进程可以执行时（如所有进程都处于阻塞状态），通常会自动执行系统的idle进程（相当于空操作）。\n\
    \  - **阻塞状态**：正在执行的进程，由于发生某种事件而暂时无法执行，便放弃处理机处于暂停状态。\n\n- 就绪--> 运行\n  - 时间一到，调度程序选择一个进程运行\n\
    - 运行--> 就绪\n  - 运行进程用完了时间片\n  - 运行进程被中断，因为一高优先级进程处于就绪状态\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_368_0.png)\n\
    \n- 运行 --> 阻塞\n  - 当一进程所需的东西必须等待时\n  - OS尚未完成服务\n  - 对一资源的访问尚不能进行\n  - 初始化I/O\
    \ 且必须等待结果\n  - 等待某一进程提供输入(I/O)\n- 阻塞 --> 就绪\n  - 当所等待的事件发生时\n\n![](img/861c0ad57b0249095c0356c9e5a83b26_369_0.png)\n\
