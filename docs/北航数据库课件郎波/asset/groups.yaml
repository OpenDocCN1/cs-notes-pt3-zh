    \n### 嵌入式SQL程序示例\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    \nEXEC SQL BEGIN DECLARE SECTION;\nint var_c1;\nchar var_c2[21] = { 0x00 };\n\
    EXEC SQL END DECLARE SECTION;\n\nint main(int argc, char* argv[])\n{\n    /* 步骤1：建立连接\
    \ */\n    EXEC SQL WHENEVER SQLERROR SQLPRINT;    /* 异常发生时的处理动作统一为打印消息 */\n  \
    \  EXEC SQL CONNECT TO postgres@localhost:5432 USER postgres/xxxx;   /* 指定连接的目标数据库，用户名，密码\
    \ */\n\n    /* 步骤2：利用游标执行查询 */\n    EXEC SQL DECLARE foo_bar CURSOR FOR SELECT\
    \ c1, c2 FROM tbl;   /* 声明一个游标便于用于执行SELECT语句 */\n    EXEC SQL OPEN foo_bar;  \
    \  /* 打开游标从而使SELECT文被执行 */\n    EXEC SQL FETCH foo_bar INTO :var_c1, :var_c2;\
    \    /* 获取一行数据 */\n\n    printf(\"C1: %d, C2: %s\\n\", var_c1, var_c2);\n\n  \
    \  EXEC SQL CLOSE foo_bar;    /* 关闭所打开的游标 */\n\n    /* 步骤3：关闭连接 */\n    EXEC SQL\
    \ DISCONNECT CURRENT;\n\n    return 0;\n}\n```\n\n连接PostgreSQL数据库，宿主语言是C。\n\n\
    - 对于嵌入式SQL，DBMS多采用预编译方法进行处理。\n- 把嵌入在程序中的SQL语句翻译为高级语言（主语言）源码，然后按主语言的通常方式进行编译、连接形成可执行代码。\n\
    - 把SQL嵌入主语言使用时必须解决的问题：\n  - 区分SQL语句与主语言语句。\n    - 在SQL语句前加前缀 `EXEC SQL` 解决。\n\
    \  - 数据库工作单元和程序工作单元之间的通信。\n    - 通过定义SQL通信区向主语言传递SQL语句执行状态信息；\n    - 通过主变量（主语言程序变量）交换参数与数据。\n\
    \  - SQL与主语言之间操作方式的协调。SQL是一次一集合。主语言是一次一记录（一组主变量一次只能存放一条记录）。\n    - 通过游标解决。游标是系统开辟的存放SQL执行结果的缓冲区，由游标指针指向一组记录。程序通过游标逐一获取记录，并赋给主变量。\n\
    \n"
