    \n## 课程管理\n\n- 数据库教学平台 (http://sammini.nslde.buaa.edu.cn)\n- 课程助教\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_10_0.png)\n\
    \n## 第一章 概述\n\n- 什么是数据库系统\n- 数据模型\n- 数据库系统结构\n- 数据库技术的发展\n\n### 什么是数据库系统\n\n-\
    \ 数据管理技术的产生\n- 数据管理技术的发展\n- 数据库系统的组成\n\n### 数据与信息\n\n- **数据**\n  - 数据是描述现实世界中的各种事物的可以识别的符号；\n\
    - **信息**\n  - 信息是一种已经被加工为特定形式的数据，这些数据对现在与将来的决策有明显价值；\n- **数据与信息**\n  - 数据是信息的载体，是信息的具体表现形式；信息是各种数据所包括的意义，数据与信息是密切关联的。\n\
    \n### 数据处理与数据管理\n\n- 数据处理\n  - 目的：从大量原始数据中抽取和推导出有价值的信息。\n  - 过程：数据收集、组织、存储、加工、分类、检索、输出、传输等操作。\n\
    \n- 数据管理\n  - 数据处理中的一般性基本操作，如数据收集、组织、存储、分类、检索、传输等称为数据管理，并研究专门的技术——数据管理技术。\n\n\
    ### 数据管理技术的发展\n\n- 人工管理阶段\n- 文件系统阶段\n- 数据库系统阶段\n\n### 人工管理阶段\n\n- 时间：20世纪50年代中期以前\n\
    - 背景：\n  - 外存只有磁带、卡片、纸带等，没有磁盘等直接存取设备。\n  - 没有操作系统，没有数据管理软件（用户用机器指令编码）。\n  - 计算机主要用于科学计算。\n\
    \n### 人工管理阶段特点\n\n- 数据不在计算机上保存；\n- 没有软件系统对数据进行管理。程序规定数据的逻辑结构与物理结构。数据与程序不具有独立性；\n\
    - 基本没有文件概念，数据组织方式必须由程序员自行设计；\n- 一组数据对应一个程序，数据是面向应用的，程序间不能共享数据。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_18_0.png)\n\
    \n### 文件系统阶段\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_20_0.png)\n\n应用程序1\n\n\
    应用程序2\n\n应用程序n\n\n存取方法\n\n文件1\n\n文件2\n\n文件n\n\n### 文件系统阶段特点\n\n- 数据以文件形式保留在外存上；\n\
    - 程序和数据有一定的独立性；\n- 文件多样化；\n- 数据的存取基本上以记录为单位；\n- 缺点：\n  - 数据冗余度大；浪费空间并易造成数据的不一致性。\n\
    \  - 数据和程序缺乏独立性（逻辑独立性）\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_21_0.png)\n\
    \n文件系统是不具弹性的无结构的数据集合，数据之间是孤立的，不能反映现实世界事物之间的内在联系。\n\n### 数据库系统阶段\n\n- 时间：20世纪60年代后期开始\n\
    - 背景：\n  - 外存有了大容量磁盘、光盘；\n  - 软件价格上升，硬件价格下降，编制和维护软件及应用程序成本相对增加，其中维护的成本更高；\n  -\
    \ 计算机管理的数据量大，关系复杂，共享性要求强（多种应用、不同语言共享数据）。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_23_0.png)\n\
    \n### 数据库系统数据管理特点（1）\n\n- 面向全组织的复杂的数据结构\n  - 在描述数据时，不仅描述数据本身，还要描述数据之间的联系，使整个组织的数据结构化；\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_24_0.png)\n\n数据结构化是数据库主要特征之一，是数据库与文件系统的根本区别。\n\
    \n### 数据库系统数据管理特点（2）\n\n- **数据冗余度小，易扩充**\n  - 数据库从整体观点描述数据。数据不再面向某个应用，而是面向整个系统，从而大大减小数据的冗余度；\n\
    \  - 数据库数据的应用可以有很灵活的方式，可以取整体数据的各种合理子集用于不同的应用系统，并可以根据应用需求的变化，重新选取不同子集。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_25_0.png)\n\
    \n### 数据库系统数据管理特点（3）\n\n- 具有较高的数据和程序的独立性\n  - 数据独立性\n    - 数据的物理独立性：数据的存储结构（物理结构）改变时，数据的逻辑结构可以不变，从而应用程序也不必改变；\n\
    \    - 数据的逻辑独立性：数据的逻辑结构改变时，应用程序可以不变；\n  - 数据库系统提供了两方面的映射（转换）功能：\n    - 数据的存储结构与逻辑结构之间——实现数据的物理独立性\n\
    \    - 数据的整体逻辑结构与某类应用所涉及的局部逻辑结构之间——实现数据的逻辑独立性\n\n"
