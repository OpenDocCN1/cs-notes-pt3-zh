    \ F>∈BCNF。\n  - 由BCNF的定义可以看到，每个BCNF的关系模式都具有如下三个性质：\n    - 所有非主属性都完全函数依赖于每个候选码。\n\
    \    - 所有主属性都完全函数依赖于每个不包含它的候选码。\n    - 没有任何属性完全函数依赖于非码的任何一组属性。\n\n## BCNF（4）\n\
    \n### BCNF 的规范化\n\n- STJ（S，T，J），因为 T→J，而 T 不是码。所以，STJ ∉ BCNF。\n- 将 S 分解为 ST（S，T），TJ（T，J）。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_288_0.png)\n\n## 多值依赖与第四范式\n\n- 属性之间的函数依赖反映了现实世界一些特性之间的相互约束。\n\
    - 现实世界一些特性之间的还有其他类型的约束：\n  - 多值依赖(Multivalue Dependency)\n  - 连接依赖(Join Dependency)\n\
    \  - 分层依赖(Hierarchical Dependency)\n  - 相互依赖(Mutual Dependency)。\n\n## 多值依赖的定义\n\
    \n- 定义：设R(U)是属性集U上的一个关系模式，X、Y、Z是U的子集，并且Z = U − X − Y，关系模式R(U)中多值依赖X →→ Y成立，当且仅当对R(U)的任一关系r，给定的一对（x，z）值有一组Y的值，这组值仅仅决定于x值而与z值无关。\n\
    - 形式化定义：在R(U)的任一关系r中，如果存在元组t，s使得t[X]=s[X]，那么就必然存在元组w，v∈r，（w，v可以与s，t相同），使得：\n \
    \ w[X] = s[X] = v[X] = t[X]\n  w[Y] = t[Y]， v[Y] = s[Y]\n  w[Z] = s[Z]， v[Z] =\
    \ t[Z]\n  则称Y多值依赖与X，记作X →→ Y。\n\n## 示例（1）\n\n- 关系模式TEACH（C，T，B），一门课程由多个教师担任，每个教师可以讲授多门课程；一门课程使用相同的一套参考书，每种参考书可被多门课程使用。它的码是（C，T，B），所以属于BCNF。\n\
    \n| C | T | B |\n|---|---|---|\n| 物理 | {张明, 张平} | {普通物理学, 光学原理} |\n| 化学 | {李勇,\
    \ 王微} | {无机化学, 有机化学} |\n\nT 多值依赖于 C，记作 C ⟶⟶ T，\n同样有 C ⟶⟶ B\n\n| C | T | B |\n\
    |---|---|---|\n| 物理 | 张明 | 普通物理学 |\n| 物理 | 张明 | 光学原理 |\n| 物理 | 张平 | 普通物理学 |\n\
    | 物理 | 张平 | 光学原理 |\n| 化学 | 李勇 | 无机化学 |\n| 化学 | 李勇 | 有机化学 |\n| 化学 | 王微 | 无机化学 |\n\
    | 化学 | 王微 | 有机化学 |\n\n## 多值依赖的性质\n\n- **多值依赖有对称性**\n  - 若 `X →→ Y`，则 `X →→ Z`，其中\
    \ `Z = U - X - Y`\n- 若 `X → Y`，则 `X →→ Y`。即函数依赖可以看作多值依赖的特殊情况。\n- 若 `X →→ Y`，而\
    \ `Z = ∅`，则称 `X →→ Y` 为平凡的多值依赖，否则，若 `X →→ Y`，而 `Z ≠ ∅`，则称 `X →→ Y` 为非平凡的多值依赖。\n\
    - 若 `X →→ Y`，`X →→ Z`，则 `X →→ YZ`。\n- 若 `X →→ Y`，`X →→ Z`，则 `X →→ Y ∩ Z`。\n- 若\
    \ `X →→ Y`，`X →→ Z`，则 `X →→ Y - Z`，`X →→ Z - Y`。\n\n## 4NF的定义\n\n定义\n\n关系模式R<U,\
    \ F>∈1NF，如果对于R的每个非平凡的多值依赖X→→Y（Y⊈X），X都含有码，则称R∈4NF。\n\n4NF所允许的非平凡的多值依赖实际上是函数依赖（左部含有码的）。4NF就是限制关系模式的属性之间不允许有非平凡且非函数依赖的多值依赖。\n\
    \n或定义\n\n关系模式R∈BCNF，且不存在非平凡的非函数依赖的多值依赖，则R∈4NF。\n\n含义：若R∈BCNF，且R中只存在函数依赖，则R∈4NF；或若R中存在平凡的多值依赖时，R∈4NF。\n\
    \n## 4NF 的规范化\n\n- 非4NF 的关系存在的弊病是数据冗余太大\n  - 例： TEACH (C, T, B)，由于 C →→ T， C →→\
    \ B，码为 (C, T, B)。所以 TEACH ∉4NF。\n  - 如果一门课有 m 个教师，n 本参考书，则同一门课将有 m×n 个元组。\n- 采用模式分解的方法消除非平凡且非函数依赖的多值依赖\n\
    \  - 例：将 CTB 分解为 CT (C, T)， CB (C, B)。在 CT、CB 中，CT ∈4NF， CB∈4NF。\n  - 如果一门课有 m\
    \ 个教师，n 本参考书，则同一门课将有 m+n 个元组。\n\n| C | T | B |\n|---|---|---|\n| 课程 | 张明 | 普通物理参考书\
    \ |\n| 课程 | 张明 | 普通参考书 |\n| 课程 | 张平 | 普通物理参考书 |\n| 课程 | 张平 | 无参考书 |\n| 化学 | 李勇\
    \ | 无参考书 |\n| 化学 | 李勇 | 无参考书 |\n| 化学 | 王敏 | 无参考书 |\n| 化学 | 王敏 | 有参考书 |\n\n## 规范化目的与基本思想\n\
    \n- 在关系数据库中，对关系的最基本要求是满足第一范式。这些关系常有一些异常或冗余等弊病。规范化的目的就是要消除这些弊病。\n- 规范化的基本思想是逐步消除数据依赖中不合适的部分，使数据库模式中各关系模式达到某种程度的“分离”，使一个关系只描述一个实体或者实体间的一种联系。即“一事一地”的设计原则。规范化的实质是概念的单一化。\n\
    \n## # 规范化的过程\n\n- 规范化的过程概括如下：\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_297_0.png)\n\
    \n## 范式之间的关系（1）\n\n- 3NF ⊂ 2NF\n\n反证：若 R∈3NF，但 R∉2NF，则按 2NF 定义，一定有非主属性部分依赖于码，\n\
    \n设 X 为 R 的码，则存在 X 的真子集 X′，以及非主属性 Z（Z ⊄ X′），使得 X′→Z。\n\n于是 在 R 中存在码 X，属性组 X′，以及非主属性\
    \ Z（Z ⊄ X′），使得 X→X′，X′→Z，X′→X 成立，这与 R∈3NF 矛盾。所以 R∈2NF。\n\n## 范式之间的关系（2）\n\n- **BCNF\
    \ ⊂ 3NF**\n\n反证：若 R∈BCNF，但 R∉3NF，则按3NF定义，一定有非主属性对码的传递依赖，于是存在：\n\nR的码X，属性组Y，以及非主属性Z（Z⊄Y），使得X→Y，Y→Z，Y↛X成立。\n\
    \n由Y→Z，按BCNF定义，Y含有码，于是Y→X成立，这与Y↛X矛盾。所以R∈3NF。\n\n- **4NF ⊂ BCNF**\n\n## 模式分解理论\n\
    \n- 模式分解的定义\n- 分解的无损连接性\n- 分解的保持函数依赖性\n- 模式分解的原则\n- 模式分解的算法\n\n## 模式分解的定义\n\n\
    - 关系模式分解\n  - 函数依赖集合 Fᵢ = { X→Y | X→Y ∈ F⁺ ∧ XY ⊆ Uᵢ }，称 Fᵢ 为 F 在 Uᵢ 上的投影。\n \
    \ - 关系模式 R<U, F> 的一个分解 ρ 是指 ρ = { R₁<U₁, F₁>, R₂<U₂, F₂>, ..., Rₙ<Uₙ, Fₙ> } 其中\
    \ U = ⋃ᵢ₌₁ⁿ Uᵢ，并且没有 Uᵢ ⊆ Uⱼ，1≤i, j≤n，Fᵢ 是 F 在 Uᵢ 上的投影。\n"
