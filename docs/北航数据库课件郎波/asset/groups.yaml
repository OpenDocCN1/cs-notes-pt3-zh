    +   算法：

    +   给定关系模式R<U, F>，

    +   (1) 令ρ = {R<U, F>}

    +   (2) 检查ρ中各关系模式是否属于BCNF，若是，则算法终止。

    +   (3) 设ρ中Rᵢ<Uᵢ, Fᵢ>不属于BCNF，则存在函数依赖X→A∈Fᵢ⁺(A∉X)，且X不是Rᵢ的码，则XA是Uᵢ的真子集，将Rᵢ分解为σ={S₁,
    S₂}，其中U S₁ = XA， U S₂ = Uᵢ − {A} 以σ代替Rᵢ，返回到(2)。'
