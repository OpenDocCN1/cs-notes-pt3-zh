    +   - 最小依赖集

    +     - 定义：若函数依赖集F满足下列条件，则称F为一个极小函数依赖集，也称为最小依赖集或最小覆盖：

    +       - F中任一函数依赖X→A，A必是单属性。（右部单属性化）

