  - '[PAGE 289]


    # 多值依赖与第四范式


    +   - 属性之间的函数依赖反映了现实世界一些特性之间的相互约束。

    +   - 现实世界一些特性之间的还有其他类型的约束：

    +     - 多值依赖(Multivalue Dependency)

    +     - 连接依赖(Join Dependency)

    +     - 分层依赖(Hierarchical Dependency)

    +     - 相互依赖(Mutual Dependency)。'
  - '[PAGE 290]


    # 多值依赖的定义


    +   - 定义：设R(U)是属性集U上的一个关系模式，X、Y、Z是U的子集，并且Z = U − X − Y，关系模式R(U)中多值依赖X →→ Y成立，当且仅当对R(U)的任一关系r，给定的一对（x，z）值有一组Y的值，这组值仅仅决定于x值而与z值无关。


    +   - 形式化定义：在R(U)的任一关系r中，如果存在元组t，s使得t[X]=s[X]，那么就必然存在元组w，v∈r，（w，v可以与s，t相同），使得：

    +     w[X] = s[X] = v[X] = t[X]

    +     w[Y] = t[Y]， v[Y] = s[Y]

    +     w[Z] = s[Z]， v[Z] = t[Z]

    +     则称Y多值依赖与X，记作X →→ Y。'
