    \ A/R, order processing, inventory control, and so forth; access and connectivity\
    \ to DBMS. Dynamic Web pages; management of session\n\nEnterprise tier\n\nTransaction\
    \ databases containing all organizational data or summaries of data on department\
    \ servers\n\nEnterprise server with DBMS\n\n## 数据库系统原理\n\n关系数据理论、数据库设计方法\n\n底层实现技术、事务处理\
    \ 数据库安全、完整性控制\n\n数据模型\n\nDBMS\n\n数据库DB\n\n应用程序1\n\n应用程序2\n\n用户\n\n数据库系统\n\n系统管理员\n\
    \n用户\n\n## 课程内容\n\n- 数据库系统基本概念（数据模型，体系结构）\n- 关系数据库\n- 关系数据库标准语言SQL\n- 关系数据库理论\n\
    - 数据库设计\n- 关系查询处理和查询优化\n- 事务处理技术\n- 数据库保护\n- 数据库技术新发展\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_6_0.png)\n\
    \n## 教材及考核方式\n\n- 教材\n  - 萨师煊、王珊编著，数据库系统概论，第三版/第四版，高等教育出版社\n- 考核方式\n  - 作业 10%\n\
