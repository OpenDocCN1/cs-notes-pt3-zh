    \  - 违约响应，若违背了完整性约束条件，则采取一定措施来保证数据的完整性。\n\n### 完整性检查的时机\n\n- 完整性约束条件按照完整性检查的时机分为立即执行约束和延迟执行约束。\n\
    \  - 立即执行约束是指在执行用户事务的过程中，在一条语句执行完后立即进行完整性约束的检查。若违背了完整性约束，系统将拒绝该操作。\n  - 延迟执行约束是指在整个用户事务执行完毕后，再进行完整性约束的检查，结果正确方能提交。否则系统将拒绝整个事务。\n\
    \n### 完整性规则的表示\n\n一条完整性规则可以用一个五元组（D，O，A，C，P）来描述，其中：\n\n- D（Data）约束所作用的数据对象\n-\
    \ O（Operation）触发完整性检查的数据库操作。\n- A（Assertion）数据对象必须满足的断言或语义约束。\n- C（Condition）选择A作用的数据对象值的谓词。\n\
    - P（Procedure）违反完整性规则时触发的过程。\n\n### 示例\n\n- 若有表 TEACHER(编号，姓名，职称，工资，...)，表达：教授的工资不得低于\
    \ 5000 元。\n  - D：工资\n  - O：插入或修改\n  - A：工资>=5000\n  - C：职称='教授'\n  - P：拒绝执行该操作\n\
    \n### 触发器\n\n- 触发器（Trigger）是用户定义在关系上的一类由事件驱动的特殊过程\n- 对于用户对表的更新操作，系统自动激活相应触发器，执行完整性控制\n\
    - 定义触发器\n  - CREATE TRIGGER <触发器名称>\n  - |BEFORE|AFTER|<触发器事件> ON <表名>\n  - |FOR\
    \ EACH |ROW|STATEMENT|\n  - [WHEN <触发条件>]\n  - <触发动作体>\n\n## 第九章　分布式数据库系统\n\n\
    - 分布式数据库系统基本概念\n  - 什么是分布式数据库系统\n  - 分布式数据库系统的特点\n- 分布式数据库系统体系结构\n- 分布式数据库系统主要技术\n\
    \n### 什么是分布式数据库系统\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_448_0.png)\n\n-\
    \ **分布性**——数据分布存储在网络的各个节点上。\n- **逻辑上的整体性**——数据被一种机制联系在一起，构成一个有机整体。\n\n- 分布式数据库定义\n\
    \n- 分布式数据库是由一组分布在计算机网络的不同节点上的数据组成，每个节点具有独立处理的能力（称为场地自治），可以执行局部应用，同时每个节点也能通过网络通信支持全局应用。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_449_0.png)\n\n分布式数据库以“数据分布”为前提，强调场地自治性（局部应用）以及自治场地之间的协作性（全局应用），两者缺一不可。\n\
    \n- 场地自治性：每个场地有自己的数据库、一组终端、运行局部DBMS，是独立的DBS，具有高度自治性。\n- 自治场地之间的协作性：各结点组成整体。整体性的含义是，从用户角度看，分布式数据库系统逻辑上如同一个集中式数据库一样，用户可以在任何场地执行全局应用。\n\
    \n支持全局应用，而不是分布式数据库系统。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_451_0.png)\n\
    \n全局应用\n\nDB1 DB2 DB3\n\n计算机1 计算机2 计算机3\n\n网络\n\n前台客户机\n\n客户 客户 客户\n\n不支持局部应用，因而不是分布式数据库系统。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_452_0.png)\n\n### 分布式数据库系统的特点（1）\n\n\
    - 分布式数据库系统是在集中式数据库系统技术的基础上发展起来的，它具有自己独特的特征和性质。\n\n#### 数据独立性\n\n- 数据的逻辑独立性和物理独立性\n\
    - 数据的分布独立性（也称分布透明性）：数据的逻辑分片、数据物理位置分布的细节、重复副本（冗余数据）一致性问题、局部节点上的数据模型等与用户程序无关。\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_453_0.png)\n\n### 分布式数据库系统的特点（2）\n\n\
    #### （2）集中与自治相结合的控制机构\n\n- 数据的共享有两个层次：\n  - 一是局部共享，即在局部数据库中存储局部节点各用户的共享数据；\n \
    \ - 二是全局共享。即在分布式数据库系统的各个节点也存储供其他节点的用户共享的数据，支持系统的全局应用。\n- 分布式数据库系统常常采用集中和自治相结合的控制机构。\n\
    \  - 各局部的DBMS可以独立的管理局部的数据库，具有自治功能。\n  - 系统又设有集中控制机构，协调各局部DBMS的工作，执行全局应用。\n\n###\
    \ 分布式数据库系统的特点（4）\n\n#### （4）全局的一致性、可串行性和可恢复性\n\n- 分布式数据库系统除了各局部数据库应满足集中式数据库的一致性、可串行性和可恢复性以外，还应保证数据库的全局一致性、并发操作的可串行性和系统的全局可恢复性。\n\
    \n### 分布式数据库系统的体系结构\n\n- 分布式数据库系统的模式结构\n- 数据分片\n- 分布透明性\n- 分布式数据库管理系统DDBMS\n\n\
    #### 分布式数据库系统的模式结构\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_458_0.png)\n\n\
    全局 DBMS  \n全局外模式  \n全局外模式  \n全局概念模式  \n分片模式  \n分布模式  \n局部 DBMS  \n局部概念模式  \n局部概念模式\
    \  \n局部内模式  \n局部内模式  \n局部 DB  \n局部 DB  \n映像1  \n映像2  \n映像3  \n映像4  \n分布式数据集中存储的\
    \  \n集中式数据集中存储的\n\n- 全局外模式：全局应用的用户视图，是全局概念模式的子集。\n- 全局概念模式：定义分布式数据库中数据的整体逻辑结构，使得数据如同没有分布一样。\n\
    - 分片模式及全局概念模式/分片模式映射（映射2）：每一个全局关系可以分为若干互不相交的部分，每一部分称为一个片段。分片模式及映射2定义片段以及全局关系到片段的映射。这种映射是一对多的。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_459_0.png)\n"
  mdcn: "\n\n## 数据完整性控制\n\n- 数据完整性含义\n- 完整性约束条件\n- 完整性控制\n\n- 数据完整性是指数据的正确性和相容性。\n\
    \  - 正确性是指数据应具有合法的类型，并在有效的取值范围之内。\n  - 相容性是指表示同一个事实的两个数据应该相同。\n- 数据库能否保持完整性关系到数据库系统是否能够真实的反映现实世界，因此维护数据库的完整性十分重要。\n\
    \n### 数据完整性与数据安全性\n\n- 数据完整性控制是为了防止数据库中存在不符合语义的数据，防止错误信息的输入和输出；\n- 数据安全性控制是保护数据库防止恶意的破坏和非法存取；\n\
    - 安全性防范的是非法用户和非法操作，完整性措施的防范对象是不合语义的数据。\n\n### 完整性约束条件\n\n- 附加在数据库数据之上的语义约束条件称为数据库完整性约束条件。数据库系统依据完整性约束条件进行完整性检查。\n\
    - 完整性约束条件作用的对象可以是列、元组、关系三种。\n  - 列约束主要是列的类型、取值范围、精度等约束条件；\n  - 元组约束是元组中各个字段间联系的约束；\n\
    \  - 关系约束是若干元组间、关系之间的联系的约束。\n\n### 完整性约束条件分类\n\n- 完整性约束可分为静态约束和动态约束。\n  - 静态约束是指数据库在每一确定状态数据对象所应满足的约束条件，它是反映数据库状态合理性的约束。\n\
    \  - 动态约束是指数据库从一种状态转变为另一种状态时，新、旧值之间所应满足的约束条件，它是反映数据库状态变迁的约束。\n\n### 静态约束\n\n-\
    \ 静态列级约束是对一个列的取值域的说明，包括对数据类型（包括数据类型、长度、单位、精度等）、数据格式、取值范围或取值集合、空值等的约束。\n- 静态元组约束规定了组成一个元组的各个列之间的约束关系。\n\
    - 静态关系约束规定了一个关系的若干元组或者若干关系之间常常存在的各种联系或约束。包括：实体完整性约束、参照完整性约束、函数依赖、统计约束等。\n\n###\
    \ 动态约束\n\n- 动态列级约束是修改列定义或列值时应满足的约束条件；\n- 动态元组约束指修改元组值时元组中各个字段间需要满足的约束；\n- 动态关系约束是加在关系变化前后状态上的限制条件。\n\
    \n### 完整性控制\n\n- 数据库完整性控制应包括三个方面的功能：\n  - 定义功能，提供定义完整性约束条件的机制。\n  - 检查功能，检查用户发出的操作请求是否违背了完整性约束条件。\n\
