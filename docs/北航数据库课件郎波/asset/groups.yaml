  - '[PAGE 484]


    # # 查询处理和优化要解决的问题


    +   - 在分布式数据库系统中，查询可分为三类：局部查询、远程查询、全局查询。

    +     - 局部查询和远程查询只涉及单个结点的数据（本地的或远程的），可以采用集中式数据库的处理技术；

    +     - 全局查询涉及到多个结点的数据，十分复杂。


    +   - 为了执行全局查询和确定一个好的查询策略，要做许多判断、计算工作。

    +     - 查询分解

    +       - 把全局查询分解为若干子查询，每个子查询只涉及某一个结点的数据，可由局部DBMS处理。必须选择查询开销最省的那些结点（物理片段）。

    +     - 选择操作执行的次序

    +       - 主要是确定涉及不同结点上关系的连接和开操作的次序。

    +     - 选择执行操作的方法

    +       - 包括选择存取路径、选择某种操作的算法以及连接的执行方法。'
  - "[PAGE 485]\n\n# 查询优化的目标\n\n+   - 查询处理策略的选择是以执行查询的预期代价为依据的。  \n+     - 查询执行的开销：I/O代价+CPU代价+通信代价\
    \  \n+     - 分布式查询可分为存取策略的分布优化和局部优化。其中存取策略的分布优化更重要。\n+   - 通信代价可计算，通常是数据传输量的函数：\
    \  \n+     TC (X) = C0+X*C1  \n+     X为数据传输量，C0为两节点初始化一次传输所花费的开销，C1为传输率，即单位数据传输所花费的时间。\n\
    +   - 分布式数据库查询优化中，将“通信代价”作为首要因素进行研究。因此，查询优化的首要目标是：使查询执行时通信代价最省。\n+   - 不同节点之间的连接操作和并操作是数据传输的主要原因，因此连接查询的优化是优化中研究的重要问题。"
  - '[PAGE 486]


    # 连接查询的优化


    +   - 半连接：使用半连接来缩减关系（或片段）进而节省传输开销。


    +   - 半连接法定义： R ⋉ₐ=ʙ S = R ⋈ₐ=ʙ (Πʙ (S))


    例：


    # R1


    | A | B |

    | --- | --- |

    | a1 | b1 |

    | a2 | b1 |

    | a2 | b3 |

    | a2 | b4 |

    | a3 | b3 |


    ⋈


    # R2


    | B | C |

    | --- | --- |

    | b1 | c1 |

    | b2 | c2 |

    | b5 | c1 |

    | b5 | c2 |

    | b6 | c4 |

    | b7 | c2 |

    | b8 | c3 |


    =


    # R1 ⋈ R2


    | A | B |

    | --- | --- |

    | a1 | b1 |

    | a2 | b1 |'
