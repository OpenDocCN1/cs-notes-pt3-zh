  mdcn: "\n\n## E-R图向关系模型示例\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_217_0.png)\n\
    \n## E-R图向关系模型的转换规则\n\n- 弱实体类型的转换\n  - 对于每个弱实体类型，创建一个新的关系，该关系中包含所有弱实体类型的属性。\n\
    \  - 把标识关系的主码添加到新关系中，并将其作为新关系的外码。\n  - 新关系的主码是标识关系的主码和弱实体类型的部分标识符的组合。\n\n## 弱实体类型的转换示例\n\
    \n图4-11 弱实体映射示例\n\n(a) 弱实体 DEPENDENT\n\n(b) 由弱实体产生的关系\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_219_0.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_219_1.png)\n\n## E-R图向关系模型的转换规则\n\n\
    - 超类/子类联系的转换\n  - 为超类和每个子类创建单独的关系。\n  - 在为超类所创建的关系中，包含所有子类成员都共有的属性，包括主码。\n  -\
    \ 在为每个子类所创建的关系中，包含超类主码以及子类特有的属性。\n  - 在超类中包含一个（或多个）属性作为子类判定符。\n\n## 超类/子类联系转换的示例\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_221_0.png)\n\n## 关系模型的规范化与优化（2）\n\n\
    - 水平分解\n  - 是把关系的元组分为若干子集合，定义每个子集合为一个子关系，以提高系统效率。\n  - 80/20原则\n    可以把经常使用的那一部分数据分解出来作为一个关系，其他数据作为另一个关系。\n\
    \  - 数据分片\n    如果关系R上具有n个事务，而且多数事务存取的数据不相交，则R可以分解为少于或等于n个子关系。\n\n## 数据库的物理设计\n\
    \n- 确定数据库的存储结构\n- 选择关系的存取方法\n  - 存取方法使事务能够快速存取数据库中数据的技术。\n\n## 关系的存取方法\n\n- 常用的存取方法：\n\
    \  - 索引方法\n  - 聚集方法\n  - HASH方法\n\n## 索引方法\n\n- 基本概念\n  - 索引记录/索引项，索引文件的记录，包括两个域：\n\
    \    - 索引域：存储数据文件中一个或一组域的一个值（K）\n    - 指针：指向索引域值为K的记录所在磁盘块的地址。\n- 分类\n  - 按照索引文件结构\n\
    \    - 稀疏索引：把所有数据记录按索引域值分成许多组，每组设立一个索引项；\n    - 稠密索引：为每个记录设立一个索引项，记录存放是任意的，但索引是有序的。\n\
    \n## 多级索引\n\n- 二叉树索引\n  - 每个节点只有一个关键字，有两个指针，分别指向关键字值小于或大于当前节点值的节点；\n- 多枝树索引\n\
    \  - 每个节点有D（D>=2）个关键字值，则有D+1个指针,每两个指针之间对应相邻关键字之间取值的区间；\n\n## 多级索引\n\n- **B树（平衡树）索引**\n\
    \  - 是附加限制条件的索引树。限制了每个节点放置关键字与指针的最小和最大个数，并且所有的叶节点都在同一层上。B树的关键字是数布在各层上。\n- **B+树索引**\n\
    \  - 是B树的改进。把树中所有关键字都按递增次序从左到右安排在叶节点上，并且链接起来。B+树能同时进行随机查找和顺序查找。\n\n## 索引存取方法的选择\n\
    \n- 选择索引域原则：\n  - 经常在查询条件中出现的属性\n  - 经常作为最大值和最小值库函数的参数\n  - 经常作为连接属性\n- 索引并非越多越好\n\
    \n## 聚集方法\n\n- **基本概念**\n  - 把某个属性/组（聚集键）值相同的关系的记录集中存放在连续的物理块，称为聚集。能够提高该属性的查询速度；\n\
    \  - 把经常进行连接操作的关系的记录以连接属性为中心进行存储，连接属性为聚集键。提高连接操作的效率。\n- 一个关系只能参加一个聚集。\n\n## 聚集存取方法的选择\n\
    \n- 一般原则\n  - 经常进行连接操作的关係可建立聚集\n  - 单个关係的某组属性经常进行相等比较\n  - 关係的某个属性组值重复率高\n- 注意问题\n\
    \  - 建立与维护聚集系统开销很大，对于更新操作远远多于连接操作的关係不应使用聚集方法。\n\n## HASH 文件\n\n- 一种支持快速存取的文件存储方法\n\
    - 基本概念\n\n通过HASH函数将记录关键字转换成地址。设F是一个文件，A是F的HASH域，H是定义在A的值域上的HASH函数。对于记录r（其A的值为a）的存储地址由H(a)确定。\n\
    \n## HASH存取方法的选择\n\n- 如果关系的属性主要出现在等连接条件中，或出现在相等比较条件中，而且满足下列条件之一，可以选择该方法：\n  -\
    \ 关系的大小可预知，而且不变；\n  - 如果关系大小动态改变，则须DBMS提供动态HASH存取方法。\n\n## 确定数据库的存储结构\n\n- 确定存放位置\n\
    \  - 经常存取部分分开存放\n  - 数据和日志备份放于磁带上\n- 确定系统配置\n  - 确定系统配置变量、存储分配参数，进行物理优化\n\n##\
    \ 问题的提出（1）\n\n例：为学校设计一个关系数据库，管理的信息包括学生学号、选修课程名称、成绩、所在系以及系主任名。\n\n现实世界的语义：\n\n\
    - 一个系有若干个学生，但一个学生只属于一个系。\n- 一个系只有一名系主任。\n- 一个学生可以选修多门课程，每门课程可有若干学生选修。\n- 每个学生学习每门课程有一个成绩\n\
    \n设计名称为UN的关系模式：\n\nUN (S#, CN, G, SDN, MN)，\n其中：S#——学号，CN —— 课程名，G —— 成绩，\nSDN\
    \ —— 系名，MN —— 系负责人\n\n## 问题的提出（2）\n\n- 对UN进行操作时的问题：\n  UN (S#, CN, G, SDN, MN)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_239_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_239_1.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_239_2.png)\n\n- UN是“不好”的关系模式！\n\n##\
    \ 问题的提出（3）\n\n将学生管理数据库进行如下设计：\n\nSD（S#，SDN）  \nSG（S#，CN，G）  \nDM（SDN，MN）\n\n其中：S#——学号，SDN——系名，CN——课程名，G——成绩，MN——系负责人\n\
    \n> SD、SG、DM不会发生插入异常和删除异常，冗余最少。  \n> SD、SG、DM是“好的”数据库模式！\n\n## 问题的分析\n\nUN (S#,\
    \ CN, G, SDN, MN)\n\n不好的关系模式\n\n属性之间关系：\nS# → SDN；\nSDN → MN；\nS# →MN；\n(S#, CN)→G；\n\
    (S#, CN)→SDN；\n(S#, CN)→MN\n\n图意：关系内部属性之间的约束关系\n\n好的关系模式\n\nSD (S#, SDN)\nSG (\
    \ S#, CN, G )\nDM (SDN, MN)\n\n属性之间关系：\nS# → SDN；\n(S#, CN)→G；\nSDN → MN；\n\n\
    ## 数据依赖的概念\n\n- **数据依赖**：属性值之间相互依赖又相互制约的关系。\n- **数据依赖有许多种类型，其中最重要的有两种：**\n  -\
    \ 函数依赖（Functional Dependency）;\n  - 多值依赖（Multivalued Dependency）。\n\n## 关系数据理论与数据依赖\n\
    \n不好的关系模式\n如： UN (S#, CN, G, SDN, MN)\n\n关系的规范化\n\n规范化方法与算法\n\n范式理论\n\n数据依赖的概念与公理\n\
