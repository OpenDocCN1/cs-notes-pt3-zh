  md: "\n## 子查询嵌套检索（5）\n\n- 用 EXISTS 检索\n  - EXISTS 表示存在量词“∃”。\n  - 表达式 EXISTS（子查询）\n\
    \    当且仅当子查询结果为非空时为真。\n\n例5：检索选修C2课程的学生姓名。\n\n```sql\nSELECT SN\nFROM S\nWHERE\
    \ EXISTS\n      (SELECT * FROM SC\n       WHERE S#=S.S# AND C#='C2');\n```\n\n\
    - 用 NOT EXISTS 检索\n  - 表示“不存在”。\n  - 表达式 NOT EXISTS（子查询）在子查询结果为空时为真。\n\n## 子查询嵌套检索（7）\n\
    \nS(S#,SN,SA,SD); C(C#,CN,PC#); SC(S#,C#,G)\n\n- 用NOT EXISTS 表达蕴涵\n\n¬ p→q ≡ ¬\
    \ p ∨ q\n\n(∀y) p→q ≡ ¬ (∃y (¬ (p→q))) ≡ ¬ (∃y (¬ (¬ p ∨ q))) ≡ ¬ ∃y (p ∧ ¬ q)\n\
    \n例7：检索至少选修了学生S2选修的全部课程的学生学号。\n\n本题用蕴含表达：\n\n> “检索这样学生的学号，对于任意课程，只要S2选修，他就选修。”\n\
    \n本题等价于“检索这样学生的学号，不存在S2选修而他没有选修的课程”。\n\n```sql\nSELECT DISTINCT S#\nFROM SC SCX\n\
    WHERE NOT EXISTS\n(SELECT * FROM SC SCY\nWHERE SCY.S#='S2' AND NOT EXISTS\n(SELECT\
    \ * FROM SC SCZ\nWHERE S#=SCX.S# AND C#=SCY.C#));\n```\n\n检索S2选修而SCX.S#没有选修的课程\n\
    \n检索SCX.S#选修SCY.C#的记录\n\n## 并、差、交检索（1）\n\n- 并、差、交的SQL运算符：\n  - 并： UNION\n  - 差：\
    \ MINUS\n  - 交： INTERSECT\n- 并、差、交检索的操作对象必须是相容的，即必须有相同数量的属性列，且相应属性列的域也必须相同。\n\n\
    ## 并、差、交检索（2）\n\nS(S#,SN,SA,SD);  \nC(C#,CN,PC#);  \nSC(S#,C#,G)\n\n例1：检索选修了C1或C2课程的学生学号。\n\
    \n```sql\nSELECT S#  FROM SC  WHERE C#='C1'\nUNION\nSELECT S#  FROM SC  WHERE\
    \ C#='C2';\n```\n\n例2：检索无人选修的课程号和名称。\n\n```sql\nSELECT C#, CN  FROM C  WHERE C#\
    \ IN\n(SELECT C# FROM C\nMINUS\nSELECT DISTINCT C#  FROM SC);\n```\n\n## 库函数检索（1）\n\
    \n- 库（集）函数\n  - COUNT() 按列值计个数，COUNT(*) 对行计数。\n  - SUM() 对数值列求总和\n  - AVG() 求数值列的平均值\n\
    \  - MAX() 在列中找出最大值\n  - MIN() 在列中找出最小值\n\n## 库函数检索（2）\n\nS(S#,SN,SA,SD);  \n\
    C(C#,CN,PC#);  \nSC(S#,C#,G)\n\n例1：检索学生总数。\n\n```sql\nSELECT COUNT (*) FROM S;\n\
    ```\n\n例2：检索选修了课程的学生人数。\n\n```sql\nSELECT COUNT (DISTINCT S#) FROM SC;\n```\n\n\
    例3：求学号为S4的学生的总分和平均分。\n\n```sql\nSELECT SUM (G), AVG (G)\nFROM SC\nWHERE S#='S4';\n\
    ```\n\n例4：检索选修了C1课程的学生最高分。\n\n```sql\nSELECT MAX (G) FROM SC WHERE C#='C1';\n\
    ```\n\n## 分组检索（1）\n\n- 按属性列（列组）将关系的元组分组，每组在这些分组属性列（列组）上具有相同值，对每一组可执行SELECT操作。\n\
    - 分组子句：\n  - GROUP BY 列名\n  - [ HAVING 条件表达式] ——分组条件\n- WHERE子句与HAVING子句\n  -\
    \ WHERE 子句是针对“行”进行，用于去掉不符合条件的若干行；HAVING子句针对“分组”进行，必须和GROUP BY 连用，用于去掉不符合条件的若干分组。\n\
    \  - 在查询块中出现的顺序：WHERE — GROUP BY — HAVING\n\n## 分组检索（2）\n\nS(S#,SN,SA,SD);  \n\
    C(C#,CN,PC#);  \nSC(S#,C#,G)\n\n例1：检索至少选修三门课程的学生学号和选课门数。\n\n```sql\nSELECT S#,\
    \ COUNT (*)\nFROM SC\nGROUP BY S#\nHAVING COUNT (*) >=3;\n```\n\n例2：求选修四门以上课程的学生学号和总成绩（不统计不及格的课程）。最后按降序列出总成绩排序名单。\n\
    \n```sql\nSELECT S#, SUM (G)\nFROM SC\nWHERE G>=60\nGROUP BY S#\nHAVING COUNT\
    \ (*) >=4\nORDER BY SUM(G) DESC;\n```\n\n## 算术表达式值的检索\n\n- SELECT子句中，可包括由属性列、常数、库函数、算术运算符+-*/等组成的算术表达式。\n\
    - 检索结果数据项名可用表达式表示或用“别名”来表示。\n\n例1：有职工表EMP (EMP#, EMPN, JOB, SALARY, BONUS, DEPT)，要求检索所有PROGRAMMER的奖金大于工资25%的职工姓名和一年的总收入，并按奖金与工资之比的降序排列。\n\
    \n```sql\nSELECT EMPN, BONUS/SALARY  BS,\n       12* (SALARY+BONUS)  TOTAL\nFROM\
    \ EMP\nWHERE JOB='PROGRAMMER'\n  AND BONUS>0.25*SALARY\nORDER BY BONUS/SALARY\
    \ DESC ;\n```\n\n## 部分匹配查询\n\n- 使用谓词LIKE 或NOT LIKE，一般形式：\n  - `<列名> LIKE/NOT LIKE\
    \ <字符串常量>`\n- “列名” 必须为字符型或变长字符型。\n- “字符串常量” 可包含两个特殊符号 % 与 _\n  - %：代表任意序列的0个或多个字符；\n\
    \  - _：代表任意单个字符\n\n例1：检索所有姓刘的学生学号、姓名。\n\n```sql\nSELECT S#, SN\nFROM S\nWHERE\
    \ SN LIKE '刘%';\n```\n\n## SQL数据定义功能\n\n- 定义、删除、修改基本表\n- 定义、删除索引\n- 定义、删除视图\n\n\
    | 操作对象 | 创建 | 删除 | 修改 |\n| --- | --- | --- | --- |\n| 表 | Create Table | Drop\
    \ Table | Alter Table |\n| 视图 | Create View | Drop View | |\n| 索引 | Create Index\
    \ | Drop Index | |\n\n## SQL92的数据类型\n\n- char（n）：固定长度的字符串。\n- varchar（n）：可变长字符串。\n\
    - int：整数。\n- smallint：小整数类型。\n- numeric（p，q）：定点数共p位，小数点右边q位。\n- Real，double precision：浮点数与双精度浮点数，精度与机器有关。\n\
    - Float(n)：n位的精度浮点数。\n- date：日期（年、月、日）。\n- time：时间（小时、分、秒）。\n- interval：两个date或time类型数据之间的差\n\
    \n## 示例\n\n```sql\nCreate table S\n(S# char(5) not null unique,\nSN char(20) not\
    \ null,\nSA int,\nSD char(15),\nPrimary key(S#),\nCheck (SA >=18 and SA <=45));\n\
    \nCreate table SC\n(S# char(5) not null,\nC# char(5) not null,\nG number(4,2),\n\
    Primary key (S#, C#),\nForeign key (S#) references S (S#),\nForeign key (C#) references\
    \ C (C#));\n```\n\n## 修改、删除基本表定义\n\n### 修改基本表\n\n- 语法：`Alter Table <表名>`\n  -\
    \ [Add <新列名><数据类型>[<完整性约束>]]\n  - [Drop <完整性约束名>]\n  - [Modify <列名><数据类型>]\n-\
    \ 示例：\n  - 例1：S表增加 “入学时间” 属性\n\n    ```sql\n    Alter Table S Add Scome Date ;\n\
    \    ```\n  - 例2：将SA的数据类型改为半字长整数\n\n    ```sql\n    Alter Table S Modify SA Smallint\n\
    \    ```\n\n### 删除基本表\n\n- 语法：`Drop Table <表名>`\n- 示例：`Drop Table S;`\n"
