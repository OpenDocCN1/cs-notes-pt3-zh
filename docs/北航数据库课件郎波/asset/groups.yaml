  - '[PAGE 167]


    # 嵌入式SQL


    +   - **嵌入式SQL的意义**

    +     - 嵌入式SQL把SQL的最佳特性与程序设计语言的最佳特性（如过程处理能力）结合起来，使SQL功能更强，灵活性更强。

    +     - 实际的应用系统是非常复杂的，数据库访问只是其中一个部件。有些动作如与用户交互、图形化显示数据等只能用高级语言实现。'
  - "[PAGE 168]\n\n# 嵌入式SQL程序示例\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <string.h>\n\nEXEC SQL BEGIN DECLARE SECTION;\nint var_c1;\nchar var_c2[21]\
    \ = { 0x00 };\nEXEC SQL END DECLARE SECTION;\n\nint main(int argc, char* argv[])\n\
    {\n    /* 步骤1：建立连接 */\n    EXEC SQL WHENEVER SQLERROR SQLPRINT;    /* 异常发生时的处理动作统一为打印消息\
    \ */\n    EXEC SQL CONNECT TO postgres@localhost:5432 USER postgres/xxxx;   /*\
    \ 指定连接的目标数据库，用户名，密码 */\n\n    /* 步骤2：利用游标执行查询 */\n    EXEC SQL DECLARE foo_bar\
    \ CURSOR FOR SELECT c1, c2 FROM tbl;   /* 声明一个游标便于用于执行SELECT文 */\n    EXEC SQL\
    \ OPEN foo_bar;    /* 打开游标从而使SELECT文被执行 */\n    EXEC SQL FETCH foo_bar INTO :var_c1,\
    \ :var_c2;    /* 获取一行数据 */\n\n    printf(\"C1: %d, C2: %s\\n\", var_c1, var_c2);\n\
    \n    EXEC SQL CLOSE foo_bar;    /* 关闭所打开的游标 */\n\n    /* 步骤3：关闭连接 */\n    EXEC\
    \ SQL DISCONNECT CURRENT;\n\n    return 0;\n}\n```\n\n连接PostgreSQL数据库，宿主语言是C"
  - '[PAGE 169]


    +   • 对于嵌入式SQL，DBMS多采用预编译方法进行处理。


    +   – 把嵌入在程序中的SQL语句翻译为高级语言（主语言）源码，然后按主语言的通常方式进行编译、连接形成可执行代码。'
  - '[PAGE 170]


    +   • 把SQL嵌入主语言使用时必须解决的问题：

    +     – 区分SQL语句与主语言语句。

    +       • 在SQL语句前加前缀 EXEC SQL解决。

    +     – 数据库工作单元和程序工作单元之间的通信。

    +       • 通过定义SQL通信区向主语言传递SQL语句执行状态信息；

    +       • 通过主变量（主语言程序变量）交换参数与数据。

    +     – SQL与主语言之间操作方式的协调。SQL是一次一集合。主语言是一次一记录（一组主变量一次只能存放一条记录）。

    +       • 通过游标解决。游标是系统开辟的存放SQL执行结果的缓冲区，由游标指针执行一组记录。程序通过游标逐一获取记录，并赋给主变量。'
  md: "\n## 定义、删除索引\n\n- 定义索引\n  - 语法：\n\n    ```\n    Create [Unique][Cluster] Index\
    \ <索引名> On <表名> (<列名>[<次序>][, <列名>[<次序>] ...);\n    ```\n\n  - 示例：\n\n    ```\n\
    \    Create Unique Index Scno On SC(S# ASC, C# DESC)\n    ```\n\n- 删除索引\n  - 语法：\n\
    \n    ```\n    Drop Index <索引名>\n    ```\n\n  - 示例：\n\n    ```\n    Drop Index\
    \ Stusno;\n    ```\n\n## 定义视图\n\n- 定义视图\n\n  - 语法：\n\n    ```\n    Create View\
    \ <视图名>\n    [(<列名>[，<列名> …])]\n    As <子查询>\n    [With Check Option]\n    ```\n\
    \n  - 示例：建立计算机系的学生视图\n\n    ```\n    Create View CS_Student\n    As\n    SELECT\
    \ S#, SN, SA FROM S\n    WHERE  SD = 'CS'\n    ```\n\n- 删除视图\n\n  ```\n  Drop\
    \ View <视图名>\n  ```\n\n  ```\n  S(S#,SN,SA,SD);\n  C(C#,CN,PC#);\n  SC(S#,C#,G)\n\
    \  ```\n\n## 查询视图\n\n- **视图消解（View Resolution）**\n\n  DBMS执行对视图的查询时，从数据字典中取出视图的定义，把定义中的子查询和用户的查询结合起来，**转换成等价的对基本表的查询**，然后再执行修正后的查询。这一转换过程称为视图消解。\n\
    \n## 视图查询示例\n\n- 在计算机系学生的视图中找出年龄小于20岁的学生。\n\n  ```\n  Create View CS_Student\n\
    \  As\n      SELECT S#, SN, SA FROM S\n      WHERE  SD = 'CS'\n  ```\n\n  ```\n\
    \  Select S#, SA From CS_Student\n      Where SA < 20;\n  ```\n\n- 转换后为：\n\n \
    \ ```\n  Select S#, SA From S\n      Where SD='CS' And SA <20;\n  ```\n\n## 视图的作用\n\
    \n- 能够简化用户操作\n  - 例：\n\n    ```\n    Select S#, SA From IS_Student\n    Where\
    \ SA < 20;\n    Select S#, SA From S\n    Where SD='IS' And SA <20;\n    ```\n\
    \n- 使用户能够以多种角度看待同一数据\n- 提供了一定程度的逻辑独立性\n- 能够对机密数据提供安全保护\n\n## SQL数据更新\n\n- 插入数据——Insert语句\n\
    - 修改数据——Update语句\n- 删除数据——Delete语句\n\n### 示例\n\n```\nS(S#,SN,SA,SD);\nC(C#,CN,PC#);\n\
    SC(S#,C#,G)\n```\n\n- 例1：\n\n  ```\n  Insert Into S\n  Values ('S10', '陈冬', 18,\
    \ 'CS');\n  ```\n\n- 例2：\n\n  ```\n  Insert Into SC (S#, C#)\n  Values('S20',\
    \ 'C1');\n  ```\n\n- 例3：\n\n  ```\n  Insert Into Dept_Age (Sdept, Avgage)\n  Select\
    \ SD, AVG(SA) From S\n  Group By SD;\n  ```\n\n### 修改数据\n\n- 语法：\n\n  ```\n  Update\
    \ <表名>\n  Set <列名>=<表达式>[{, <列名>=<表达式>}]\n  [Where <条件>]\n  ```\n\n- 示例：\n  -\
    \ 例1：将学生S1的年龄改为22岁\n\n    ```\n    Update S\n    Set SA = 22\n    Where S#='S1'\n\
    \    ```\n\n  - 例2：将所有学生的年龄增加1岁\n\n    ```\n    Update S\n    Set SA=SA+1\n  \
    \  ```\n\n  - 例3：将计算机系全体学生的成绩置零。\n\n    ```\n    Update SC\n    Set G = 0\n  \
    \  Where 'CS' = (Select SD From S\n    Where S.S# = SC.S#)\n    ```\n\n### 删除数据\n\
    \n- 语法：\n\n  ```\n  Delete From <表名> [Where <条件>]\n  ```\n\n- 示例：\n  - 例1：删除学号为S19的学生记录\n\
    \n    ```\n    Delete From S Where S#='S19'\n    ```\n\n  - 例2：删除所有学生的选课记录\n\n\
    \    ```\n    Delete From SC\n    ```\n\n  - 例3：删除计算机系所有学生的选课记录\n\n    ```\n \
    \   Delete From SC\n    Where 'CS' = (Select SD From S\n    Where S.S# = SC.S#)\n\
    \    ```\n\n## SQL数据控制功能\n\n- 定义完整性约束条件\n- 支持事务操作\n- 提供安全控制功能\n  - 授权\n\n    ```\n\
    \    GRANT 〈权限〉 [ON 〈对象类型〉 〈对象名〉]\n    TO 〈用户〉\n    ```\n\n  - 收回权限\n\n    ```\n\
    \    REVOKE 〈权限〉 [ON 〈对象类型〉 〈对象名〉]\n    FROM 〈用户〉\n    ```\n\n## 嵌入式SQL\n\n- **嵌入式SQL的意义**\n\
    \  - 嵌入式SQL把SQL的最佳特性与程序设计语言的最佳特性（如过程处理能力）结合起来，使SQL功能更强，灵活性更强。\n  - 实际的应用系统是非常复杂的，数据库访问只是其中一个部件。有些动作如与用户交互、图形化显示数据等只能用高级语言实现。\n\
    \n### 嵌入式SQL程序示例\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    \nEXEC SQL BEGIN DECLARE SECTION;\nint var_c1;\nchar var_c2[21] = { 0x00 };\n\
    EXEC SQL END DECLARE SECTION;\n\nint main(int argc, char* argv[])\n{\n    /* 步骤1：建立连接\
    \ */\n    EXEC SQL WHENEVER SQLERROR SQLPRINT;    /* 异常发生时的处理动作统一为打印消息 */\n  \
    \  EXEC SQL CONNECT TO postgres@localhost:5432 USER postgres/xxxx;   /* 指定连接的目标数据库，用户名，密码\
    \ */\n\n    /* 步骤2：利用游标执行查询 */\n    EXEC SQL DECLARE foo_bar CURSOR FOR SELECT\
    \ c1, c2 FROM tbl;   /* 声明一个游标便于用于执行SELECT语句 */\n    EXEC SQL OPEN foo_bar;  \
    \  /* 打开游标从而使SELECT文被执行 */\n    EXEC SQL FETCH foo_bar INTO :var_c1, :var_c2;\
    \    /* 获取一行数据 */\n\n    printf(\"C1: %d, C2: %s\\n\", var_c1, var_c2);\n\n  \
    \  EXEC SQL CLOSE foo_bar;    /* 关闭所打开的游标 */\n\n    /* 步骤3：关闭连接 */\n    EXEC SQL\
    \ DISCONNECT CURRENT;\n\n    return 0;\n}\n```\n\n连接PostgreSQL数据库，宿主语言是C。\n\n\
    - 对于嵌入式SQL，DBMS多采用预编译方法进行处理。\n- 把嵌入在程序中的SQL语句翻译为高级语言（主语言）源码，然后按主语言的通常方式进行编译、连接形成可执行代码。\n\
    - 把SQL嵌入主语言使用时必须解决的问题：\n  - 区分SQL语句与主语言语句。\n    - 在SQL语句前加前缀 `EXEC SQL` 解决。\n\
    \  - 数据库工作单元和程序工作单元之间的通信。\n    - 通过定义SQL通信区向主语言传递SQL语句执行状态信息；\n    - 通过主变量（主语言程序变量）交换参数与数据。\n\
    \  - SQL与主语言之间操作方式的协调。SQL是一次一集合。主语言是一次一记录（一组主变量一次只能存放一条记录）。\n    - 通过游标解决。游标是系统开辟的存放SQL执行结果的缓冲区，由游标指针指向一组记录。程序通过游标逐一获取记录，并赋给主变量。\n"
