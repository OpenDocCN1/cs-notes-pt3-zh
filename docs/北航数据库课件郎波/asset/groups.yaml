    \ }\n\n## 域关系演算\n\n- 域关系演算类似于元组演算。不同的是公式中的变量是对应元组各个分量的域变量。\n\n- 域演算表达式的形式定义：\n\
    { (x1x2...xk) | Φ ( x1, x2, ..., xk ) }，表示所有使Φ为真的那些 (x1, x2, ..., xk) 组成的元组集合，即表达了一个关系。\n\
    \n其中：\n\n- xi代表域变量，如果域变量前有“全称”(∀)或“存在”(∃)量词，则称其为约束域变量，否则称为自由域变量。\n\n- Φ为域关系演算公式，由原子公式和运算符组成。\n\
    \n## 域演算公式的递归定义\n\n- 域演算有三种形式的原子命题函数或称原子公式：\n  - $R(x_1, x_2, ..., x_k)$。$(x_1,\
    \ x_2, ..., x_k)$是R的一个元组，$x_i$是域变量或常量。\n  - $x_i \\theta y_j$。域变量$x_i$与$y_j$之间满足比较关系$\\\
    theta$。\n  - $x_i \\theta c$或$c \\theta x_i$。域变量$x_i$与常量$c$之间满足比较关系$\\theta$。\n\
    - 域演算与元组关系演算具有相同的运算符，相同的公式递归定义。\n\n## 示例\n\n例：设关系R，S分别如下图所示，现给出域演算公式，求结果关系。\n\n\
    | R | A1 | A2 | A3 |\n|---|---|---|---|\n|  | d | ce | 5 |\n|  | d | bd | 2 |\n\
    |  | g | ef | 7 |\n|  | d | cd | 9 |\n\n| S | A1 | A2 | A3 |\n|---|---|---|---|\n\
    |  | c | bd | 7 |\n|  | c | he | 3 |\n|  | b | cf | 6 |\n|  | d | cd | 9 |\n\n\
    (1)R1={xyz|R(xyz) ∧ z<8 ∧ x=d}\n\n(2)R2={xyz|(R(xyz) ∨ S(xyz)) ∧ x ≠ c ∧ y≠cd}\n\
    \n结果： R1\n\n| A1 | A2 | A3 |\n|---|---|---|\n| d | ce | 5 |\n| d | bd | 2 |\n\n\
    R2\n\n| A1 | A2 | A3 |\n|---|---|---|\n| d | ce | 5 |\n| d | bd | 2 |\n| g | ef\
    \ | 7 |\n| b | cf | 6 |\n\n## 关系运算的安全约束\n\n- 关系运算中不产生无限关系和无穷验证的运算称为安全运算；其运算表达式称为安全表达式；对其所采取的限制称为安全约束。\n\
    - 关系代数是安全运算，关系演算则不一定是。所以对关系演算要进行安全约束。\n\n## 关系运算的安全约束\n\n- 在关系演算中，通常采用的安全约束方法是对Φ定义一个有限的符号集DOM（Φ），使Φ的运算结果及中间结果所产生的关系及其元组的各个分量都必须属于DOM（Φ）。\n\
    - 设Φ是一个元组关系演算公式，为DOM(Φ)是由如下两类符号构成的集合：\n  - Φ中的所有常量\n  - Φ中出现的所有元组的所有分量值\n\n##\
    \ 三类关系运算的等价性\n\n经过安全约束后的三类关系运算的表达能力是等价的，可以相互转换。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_113_0.png)\n\
    \n- 每一个关系代数表达式有一个等价的安全元组演算表达式；\n- 每一个安全元组演算表达式有一个等价的安全域演算表达式；\n- 每一个安全域演算表达式有一个等价的关系代数表达式。\n\
    \n## 关系数据语言概述\n\n- 数据库数据语言\n- 关系数据语言特点\n- 关系数据语言分类\n\n## 数据库数据语言\n\n- 数据库数据语言从功能上一般分为以下几种：\n\
    \  - 数据定义（描述）语言（Data definition or description language），包括模式DDL，外模式DDL，内模式DDL；\n\
    \  - 数据操纵语言（Data Manipulation Language）DML\n    - 数据库有四种基本操作：检索、插入、修改、删除\n   \
    \ - DML有联机交互方式和宿主语言方式。\n      - 联机交互方式下的DML称为自含式语言，可独立使用，适用于终端直接查询；\n      - 宿主语言方式下的DML称为嵌入式语言，依附于宿主语言，是嵌入高级语言的程序中，以实现数据操作。\n\
    \  - 数据控制语言（Data Control Language）DCL，完成数据库的安全性控制、完整性控制、并发控制等。\n\n## 关系数据语言的特点（1）\n\
    \n- **一体化**\n  - 将数据的定义、查询、更新、控制等功能融为一体，只给用户提供一种称之为“查询语言”的语言。便于用户学习与使用。\n- **非过程化**\n\
    \  - 用户只需提出“干什么”，而“怎样干”由 DBMS 解决。所以语言操作简单，易学、易用。\n- **面向集合的存取方式**\n  - 操作对象是一个或多个关系，操作的结果也是一个新关系。\n\
    - **既可独立使用又可与主语言嵌套使用**\n\n## 关系数据语言的特点 (2)\n\n- 关系数据语言优越性的根源：\n  - 关系模型采用了最简单、最规范化的数据结构，这使DML大大简化；\n\
    \  - 关系数据语言是建立在关系运算的数学基础上，可实现关系的垂直方向和水平方向的任意分割和组装操作，使得关系语言可随机地构造出用户需要的各种各样的新关系。\n\
    \n## 关系数据语言的分类（1）\n\n- 关系数据语言的核心是查询，所以又称为查询语言。而查询往往表示成一个关系运算表达式，因此关系运算是设计关系数据语言的基础，关系运算的分类也决定了关系语言的分类。\n\
    - 关系数据语言目前常用分类：\n\n| 采用的关系运算 | 语言名称 |\n|---|---|\n| 关系代数 | ISBL | SQL |\n| 关系演算<br>元组关系演算\
    \ | ALPHA; QUEL | |\n| 域关系演算 | QBE | |\n\n## 关系数据语言的分类（2）\n\n- ISBL(Information\
    \ System Base Language), 关系代数语言的代表。英格兰底特律的IBM英国科学中心研究。应用于实验系统PRTV上。\n- QUEL（Query\
    \ Language），基于元组演算的语言。美国加利福尼亚大学研制。用于Ingres数据库。\n- QBE(Query By Example)，基于域演算的表格显示语言。用于QBE数据库。\n\
    - SQL(Structured Query Language), 介于关系代数与关系演算之间的语言，标准的关系数据语言。\n\n## 第三章 关系数据库标准语言SQL\n\
    \n- 概述\n- SQL数据查询功能\n- SQL数据定义功能\n- SQL视图操作\n- SQL数据更新\n- SQL数据控制\n- 嵌入式SQL\n\n\
    ## SQL概述\n\n- SQL的产生与发展\n  - 1974年，由Boyce和Chamber提出，称为SEQUEL (Structured English\
    \ Query Language)；\n  - 1975-1979年，在IBM的San Jose研究室研制的System R上实现；\n  - 1981年，IBM在推出SQL/DS关系数据库时，将其命名为SQL\
    \ (Structured Query Language)；\n  - 随着SQL语言应用的日益广泛，ANSI和ISO先后制定了SQL-86、SQL-89、SQL-92、SQL-99、SQL-2003等多个SQL标准。\n\
    \n"
