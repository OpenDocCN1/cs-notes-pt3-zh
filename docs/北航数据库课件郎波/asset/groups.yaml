  - '[PAGE 287]


    # BCNF (3)


    +   - BCNF的定义：

    +     - 若关系模式R<U, F>∈1NF，如果对于R的每个函数依赖X→Y，且Y⊈X时，X必含有码，则R<U, F>∈BCNF。

    +     - 由BCNF的定义可以看到，每个BCNF的关系模式都具有如下三个性质：

    +       - 所有非主属性都完全函数依赖于每个候选码。

    +       - 所有主属性都完全函数依赖于每个不包含它的候选码。

    +       - 没有任何属性完全函数依赖于非码的任何一组属性。'
