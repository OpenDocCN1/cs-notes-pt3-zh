    - **位置透明性**——用户或应用程序不必了解片段的存储场地，也不必关心各数据副本的一致性。\n- **局部数据模型透明性**——用户或应用程序不必了解局部场地上使用的是哪种数据模型。模型的转换以及查询语言等的转换均由分布模式/局部概念模式（映象4）完成。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_465_0.png)\n\n## 分布透明性示例\n\n• 示例：设有全局关系\
    \ S（S#，SN，SD，SA），它被划分为两个片段 S-A（本科生），S-B（研究生），S-B 有两个副本。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_466_0.png)\n\
    \n## 分布透明性示例\n\n执行查询操作：检索所有学生的学号和年龄。\n\n- 若系统具有分片透明性，则执行操作：\n  SELECT S#,SA\n\
    \  FROM S\n\n- 若系统具有位置透明性，不具有分片透明性，则可执行操作：\n  SELECT S#, SA\n  FROM  S_A\n  UNION\n\
    \  SELECT S#, SA\n  FROM  S_B\n\n- 若系统只具有局部数据模型的透明性，不具有位置透明性与分片透明性，在执行操作：\n  SELECT\
    \ S#, SA\n  FROM S_A AT SITE-1\n  UNION\n  SELECT S#, SA\n  FROM S_B AT SITE-3\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_467_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_467_1.png)\n\
    \n## 分布式数据库管理系统DDBMS\n\n• DDBMS的组成\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_468_0.png)\n\
    \n## DDBMS的组成\n\n- LDBMS(局部场地上的数据库管理系统)\n  - 功能：建立和管理局部数据库，提供场地自治能力，执行局部应用及全局查询的子查询。\n\
    - GDBMS（全局数据库管理系统）\n  - 功能：提供分布透明性，协调全局事务的执行，协调各局部DBMS以完成全局应用，并保证数据库的全局一致性，执行并发控制，实现更新同步，提供全局恢复功能。\n\
    - GDD（全局数据字典）\n  - 存放全局概念模式、分片模式、分布模式的定义以及各模式之间映射的定义。\n  - 存放有关用户存取权限的定义，以保证全局用户的合法权限和数据库的安全性。\n\
    \  - 存放数据完整性约束条件的定义。\n- CM（通信管理）\n  - 在分布式数据库各场地之间传递消息和数据，完成通信功能。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_469_0.png)\n\
    \n## DDBMS的分类（1）\n\n- 按全局控制方式分类\n  - 全局控制集中的DDBMS\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_470_0.png)\n\
    \n- 特点：GDBMS集中在某一节点上，GDD只有一个，也故在该节点上。\n- 优点：控制简单，容易设计实现\n- 缺点：易形成瓶颈，并且一旦该节点出现故障，整个系统将瘫痪。\n\
    \n## DDBMS 的分类（2）\n\n- 全局控制分散的DDBMS\n  - 特点：GDBMS 分散在每一个节点上。GDD 也在每个节点上有一份。这类结构称为完全分布的DDBMS。\n\
    \  - 优点：节点独立，自治性强，单个节点出现问题不会使系统瘫痪；\n  - 缺点：全局控制的协调机制和一致性维护都比较复杂。\n\n- 全局控制部分分散的DDBMS\n\
    \  - 根据应用的需要将全局数据库管理器和全局数据字典分散在某些节点上。介于上述两者之间的体系结构。\n\n## DDBMS 的分类 (3)\n\n- 按局部DBMS的类型分类\n\
    \  - 同构型DDBMS\n    - 每个节点的局部数据库具有相同的DBMS，即使硬件与操作系统不同。\n  - 异构型DDBMS\n    - 各节点的局部数据库具有不同的DBMS\n\
    \n## 分布式数据库系统的主要技术\n\n- 分布式查询处理和优化\n- 分布事务管理\n\n## 分布式查询处理和优化\n\n分布式数据库系统中查询处理较集中式数据库复杂，查询优化较集中数据库更重要，效果更显著。\n\
    \n- 分布式查询中的突出矛盾\n- 查询处理和优化要解决的问题\n- 查询优化的目标\n- 连接查询的优化\n\n## 分布式查询中的突出矛盾\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_475_0.png)\n\
    \n- 传送时间 T = 总传输延迟 + 总数据量 / 传输速度\n\n- 数据库：\n  - Site-A：供应商表 S，供应商零件关系表 SP；Site-B：产品库\
    \ P；\n  - 每个关系的元组均为 100byte 长；\n\n- 查询：求供应红色零件的北京的供应商号。\n\n```\nselect S.S# from\
    \ S, P, SP\nwhere S.S# = SP.S# and SP.P# = P.P#\nand COLOR = ‘红色’ and CITY = ‘北京’；\n\
    ```\n\n- 估算值：红色零件数=10， 北京供应商的装运单数=10^5，\n\n## 6种可能的查询策略\n\n1.把关系P从B站传送到A站，在A站进行查询\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_476_0.png)\n\nSite-A\n\nSite-B\n\n\
    S(S#,CITY) 10^4个元组\nP(P#,COLOR) 10^5个元组\nSP(S#,P#) 10^6个元组\n\n红色条件数=10;\n北京供应商的装运单数=10^5\n\
    \n传送时间T=1t+10^5*100/10^7=(t+1)s\n\n## 2.把关系S，SP从A站传递到B站，在B站进行查询\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_477_0.png)\n\
    \nSite-A\n\nSite-B\n\nS(S#,CITY) 10^4个元组\nP(P#,COLOR) 10^5个元组\nSP(S#,P#) 10^6个元组\n\
    \n颜色条件数=10;\n北京供应商的载运单数=10^5\n\n传递时间T=2t+(10^4+10^6)*100/10^7≈(2t+10)s\n\n3.在A站连接S与SP，选出城市为北京的元组（有10⁵个），然后对其中每个元组的P#，询问B站，看其是否为红色。\n\
    \nS(S#,CITY) 10⁴个元组\nP(P#,COLOR) 10⁵个元组\nSP(S#,P#) 10⁶个元组\n红色零件数=10；\n北京供应商的零件单数=10⁵\n\
    \nSite-A\n\nSite-B\n\n传送时间T=2t * 10⁵s\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_478_0.png)\n\
