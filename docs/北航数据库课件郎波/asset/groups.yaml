    \n## 无损分解的判定算法（3）\n\n- 例： U={A,B,C,D,E}, F={AB→C, C→D,D→E}\n- ρ={(A, B, C), (C,\
    \ D), (D, E)}\n\n| A | B | C | D | E |\n|---|---|---|---|---|\n| a₁ | a₂ | a₃\
    \ | b₁₄ | b₁₅ |\n| b₂₁ | b₂₂ | a₃ | a₄ | b₂₅ |\n| b₃₁ | b₃₂ | b₃₃ | a₄ | a₅ |\n\
