  - '[PAGE 301]


    # 模式分解的定义


    +   - 关系模式分解

    +     - 函数依赖集合 Fᵢ = { X→Y | X→Y ∈ F⁺ ∧ XY ⊆ Uᵢ }，称 Fᵢ 为 F 在 Uᵢ 上的投影。

    +     - 关系模式 R<U, F> 的一个分解 ρ 是指 ρ = { R₁<U₁, F₁>, R₂<U₂, F₂>, ..., Rₙ<Uₙ, Fₙ>
    } 其中 U = ⋃ᵢ₌₁ⁿ Uᵢ，并且没有 Uᵢ ⊆ Uⱼ，1≤i, j≤n，Fᵢ 是 F 在 Uᵢ 上的投影。'
