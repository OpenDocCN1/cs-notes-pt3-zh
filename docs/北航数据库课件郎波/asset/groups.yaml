    # 关系模型的语义约束


    +   - 参照完整性

    +     - 外部码

    +       - 设F是基本关系R的一个或一组属性，但不是R的码。如果F与基本关系S的主码Ks相对应，则称F是关系R的外部码（Foreign Key），并称R为参照关系（Referencing
    Relation），S为被参照关系（Referenced Relation）或目标关系（Target Relation）。R和S不一定是不同的关系。

    +       - 目标关系S的主码Ks和参照关系的外码F必须定义在一个域上。

    +     - 参照完整性

    +       - 如果关系R的外码Fk与关系S的主码Pk相对应，则R中的每一个元组的Fk值或者等于S中某个元组的Pk值，或者为空值。'
