    \ ⟨U2，F2⟩，R3 ⟨U3，F3⟩}，且R1，R2，R3均属于BCNF。\n\n## 候选码的求解理论和算法\n\n- 快速求解候选码的充分条件\n\
    - 左边为单属性的函数依赖集候选码成员的图论判定方法\n- 多属性依赖集候选码求解法\n\n## 候选码的求解理论和算法\n\n对于关系 R<U,F>，其属性可分为4类：\n\
    \n- L类：仅出现在F的函数依赖左部的属性。\n- R类：仅出现在F的函数依赖右部的属性。\n- N类：在F的函数依赖左右两边均未出现的属性。\n- LR类：在F的函数依赖左右两边均出现的属性。\n\
    \n## 快速求解候选码\n\n- 定理1：对于关系R<U,F>，若X（X⊆U）是L类属性，则X必为R的任一候选码成员。\n- 推论1.1：对于关系R<U,F>，若X（X⊆U）是L类属性，且X⁺_F\
    \ =U，则X必为R的唯一候选码。\n- 定理2：对于关系R<U,F>，若X（X⊆U）是R类属性，则X不在R的任何候选码中。\n- 定理3：对于关系R<U,F>，若X（X⊆U）是N类属性，则X必包含在R的任一候选码中。\n\
    - 推论3.1：对于关系R<U,F>，若X（X⊆U）是N类和L类组成的属性集，且X⁺_F =U，则X为R的唯一候选码。\n\n## 示例\n\n- 例1：设有关系模式R（A，B，C，D），其函数依赖集F={D\
    \ →B, B →D, AD →B, AC →D}, 求R的所有候选码。\n- 例2：设有关系模式R（A，B，C，D，E，P），其函数依赖集F={A → D，E\
    \ → D，D → B，BC →D，DC →A}，求R的所有候选码。\n\n## 候选码的图论判定方法（1）\n\n定义1：函数依赖关系图G是一个有序二元组（U，F），记作G=（U，F），其中：\n\
    \n(1) U=（A1，A2，...An）是有限非空集，Ai(i=1,2,...,n)是G的结点，它们表示对应关系模式R（A1，A2，...An）的属性。\n\
    (2) F是G的边集，其元素是G的一条有向边，每条边(Ai,Aj)表示一个函数依赖Ai→Aj，则F是R的单属性最小依赖集。\n\n## 候选码的图论判定方法（2）\n\
    \n定义2：在一个函数依赖图中有如下术语：\n\n- 原始点：只有引出线而无引入线的节点，表示L类属性；\n- 终结点：只有引入线而无引出线的节点，表示R类属性；\n\
    - 中间点：既有引出线又有引入线的节点，表示LR类属性；\n- 孤立点：既无引出线又无引入线的节点，表示N类属性；\n- 关键点：原始点和孤立点统称为关键点；\n\
    - 关键属性：关键点对应的属性；\n- 独立回路：不能由其他节点到达的回路。\n\n回路：有向图G=(V,E)中，若边序列P=(e_i1, e_i2, …,\
    \ e_iq)，如果e_iq的终点也是e_i1的始点，则称P是G的一条有向回路。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_325_0.png)\n\
    \n## 候选码的图论判定方法（3）\n\n- **定理4：** 关系模式 R 的函数依赖图 G 中若存在关键点，则关键点对应的属性必在 R 的任何候选码中，而所有终结点必不在\
    \ R 的任何候选码中。\n\n- **定理5：** 属性集 X 是 R 的唯一候选码的充要条件是 X 能到达 G 中的任一结点。\n\n    - **推论5.1：**\
    \ 在单属性情况下，R 只有唯一候选码的充要条件是 G 中不存在独立的回路。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_326_0.png)\n\
    \n## 候选码的图论判定方法（4）\n\n- 定理6：设Y是中间点，则Y必在某个候选码中的充要条件是Y为某一独立回路中的结点。\n- 定理7：设F是单属性依赖集，X是R的关键属性集，G中存在K（K>=1）个独立回路r₁,r₂,…,rₖ，则：\n\
    \    - （1）R的候选码必不唯一；\n    - （2）R的候选码均由两部分构成：\n        - 关键属性集X（X可为空）；\n      \
    \  - K个独立回路结点的笛卡尔积的任一元素；\n    - （3）候选码的个数等于k个独立回路中结点个数的乘积。\n    - （4）每个候选码所含属性个数是一个常数，等于关键属性个数加上独立回路个数k。\n\
    \n## 候选码的图论判定方法（5）\n\n- 算法1：单属性依赖集图论求解法。\n    - 输入：关系模式R，R的单属性函数依赖集F。\n    - 输出：R的所有候选码。\n\
    \n算法：\n\n(1) 求F的最小依赖集Fm；\n(2) 构造函数依赖图G；\n(3) 从G中找出关键属性集X（X可为空）；\n(4) 查看G中有无独立回路，若无则输出X即为R的唯一候选码，结束；若有则继续（5）；\n\
    (5) 从各独立回路中各取一结点对应的属性与X组成一个候选码，并重复这一过程，直至取尽所有可能组合，即为R的全部候选码。结束。\n\n## 示例\n\n例：设\
    \ R（O，B，I，S，Q，D），F={S→D，D→S，I→B，B→I，B→O，O→B}，求 R 的所有候选码。\n\n解：\n\n- Fm=F；\n- 构造函数依赖图；\n\
    - 关键属性集{Q}；\n- 有四条回路，两条独立回路，所以共有6个候选码，每个候选码有3个属性；\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_329_0.png)\n\
    \nR 的所有候选码为 QSI，QSB，QSO，QDI，QDB，QDO。\n\n## 多属性依赖集候选码求解法\n\n算法2：多属性依赖集候选码求解法。\n\
    \n输入：关系模式R<U,F>；\n输出：R的所有候选码。\n\n算法：\n\n(1) 将R的所有属性分为L、R、N和LR四类，并令X代表L、N两类，Y代表LR类。\n\
    (2) 求X_F^+，若 X_F^+ =U，则X即为R的唯一候选码，结束。否则，继续。\n(3) 对于Y中的任一属性A，求(XA)_F^+，若(XA)_F^+\
    \ =U，则XA为一候选码；否则在Y中依次取两个、三个、...，求其属性闭包，直到其闭包包含R的全部属性。\n\n## 关系模型的规范化与优化\n\n- 按照数据依赖的理论，逐一分析转换所得关系模式，判断是否存在部分函数依赖、传递函数依赖、多值依赖等，确定它们的范式等级。\n\
    - 按应用系统的处理要求，确定是否进行模式合并或分解。\n- 一般情况下3NF已足以满足要求。\n\n## 课程内容\n\n- 数据库系统基本概念（数据模型，体系结构）\n\
    - 关系数据库\n- 关系数据库标准语言SQL\n- 关系数据库理论\n- 数据库设计\n- 关系查询处理和查询优化\n- 事务处理技术\n- 数据库保护\n\
