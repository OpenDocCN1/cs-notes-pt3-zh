    \n## 元组关系演算公式的递归定义 (2)\n\n- (4) 在元组演算公式中，各种运算符的优先次序为：\n  - 算术比较运算符最高。\n  - 量词次之，且∃的优先级高于∀。\n\
    \  - 逻辑运算符最低，且¬优先级高于∧，∧高于∨。\n  - 如果有括号，则括号中的运算优先级最高。\n- 按照上述4个规则对元组公式进行有限次复合，可以得到元组演算的所有公式。\n\
