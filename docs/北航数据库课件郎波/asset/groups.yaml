    \ 或 n:m 联系表示为实体码之间的函数依赖表达式 X→Y；\n  - 利用函数依赖集的最小覆盖并法进行极小化处理。设原函数依赖表达式集合为 F，最小覆盖集为\
    \ G，则 D=F-G；\n  - 考察 D 中每一个函数依赖表达式，确定是否冗余联系；\n  - 去掉冗余联系后形成基本E-R图。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_213_0.png)\n\
    \n## 数据库逻辑结构设计\n\n- 逻辑结构设计的任务就是把概念结构转换为选用的DBMS所支持的数据模型的过程。\n- 逻辑结构设计步骤如下：\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_214_0.png)\n\n## 数据库逻辑结构设计\n\n- 关系数据库逻辑结构设计的任务具体包括：\n\
    \  - 形成初始关系数据库模式\n  - 关系模式规范化\n  - 关系模式优化\n  - 子模式定义\n\n## E-R图向关系模型的转换规则\n\n\
    - 一个实体型转换为一个关系模式。实体的属性就是关系的属性，实体的码就是关系的码。\n- 一个联系转换为一个关系模式。与该联系相连的各实体的码以及联系的属性转换为关系的属性：\n\
    \  - 若联系为1：1，则每个关系的码均是该关系的候选码；\n  - 若联系为1：n，则该关系的码是n端实体的码；\n  - 若联系为n：m，则该关系的码是诸实体码的组合。\n\
    - 三个或三个以上实体间的多元联系，转换为一个关系模式，与该多元联系相连的各实体的码以及联系的属性转换为关系的属性，而关系的码为各实体码的组合。\n- 具有相同码的关系可以合并。\n\
    \n"
