    \ Server，Sybase\n  - Access，FoxPro，Foxbase\n\n## 主要内容\n\n- 关系模型的基本概念\n- 关系代数\n\
    - 元组关系演算与域关系演算\n- 三类关系运算的安全约束及等价性\n- 关系数据语言概述\n\n## 关系的数学定义\n\n- **域（Domain）**\n\
    \  - 定义：一组具有相同的数据类型的值的集合。例如，整数、实数，{0，1}等。\n\n- **元组和分量**\n  - 定义：给定一组域 D₁，D₂，…，Dₙ，这些域中可以有相同的。\n\
    \  \n    D₁，D₂，…，Dₙ 的笛卡尔积（Cartesian Product）为：\n  \n    D₁×D₂×…×Dₙ = {(d₁，d₂，…，dₙ)\
    \ | dᵢ∈Dᵢ，i=1，…，n}。\n  \n    笛卡尔积的每个元素 (d₁，d₂，…，dₙ) 称作一个元组（n-tuple）或简称元组。元组的每一个值\
    \ dᵢ 叫做一个分量（component）。\n\n若 Dᵢ（i=1，…，n）为有限集，其基数（Cardinal number）为 mᵢ，则笛卡尔积的基数为\n\
    \n∏ᵢ₌₁ⁿ mᵢ\n\n## 关系的数学定义\n\n笛卡儿积可以表达为二维表：\n\n| D1 | D2 | … | Dn |\n|---|---|---|---|\n\
    | d1 | d2 | … | dn |\n| … | … | … | … |\n| … | … | … | … |\n| … | … | … | … |\n\
    \n域\n\n元组\n\n分量\n\nD1 × D2 × … × Dn = {(d1, d2, …, dn) | di ∈ Di, i=1,…,n}\n\n\
    ## 笛卡儿和示例\n\n例：有三个域\nD₁=MAN={M₁, M₂, M₃}\nD₂=WOMAN={W₁, W₂}\nD₃=CHILD={C₁, C₂,\
    \ C₃}\n\n则 D₁ × D₂ × D₃ =\n{ ( M₁, W₁, C₁ ), ( M₁, W₁, C₂ ),\n( M₁, W₁, C₃ ),\
    \ ......}\n\n二维表的表示：\n\n共18个\n\n| D₁ | D₂ | D₃ |\n|---|---|---|\n| M₁ | W₁ | C₁\
    \ |\n| M₁ | W₁ | C₂ |\n| M₁ | W₁ | C₃ |\n| ... | ... | ... |\n\n## 关系的定义\n\n关系的定义：集合\
    \ $D_1\\times D_2\\times\\cdots\\times D_n$ 的子集叫做在域 $D_1,D_2,\\cdots,D_n$ 上的关系，用\
    \ $R(D_1,D_2,\\cdots,D_n)$ 表示。\n$R$ 是关系的名字，$n$ 是关系的度或目（Degree）。\n当 $n=1$ 时称为一元关系，\n\
    当 $n=2$ 时称为二元关系，依此类推。\n\n- 关系可以表示为二维表：\n  - 表的框架由 $D_i$（$i=1,2,\\cdots,n$）构成\n\
    \  - 表的每一行对应一个元组\n  - 表的每一列对应一个域\n  - 每个列附加一个名称，则每个列称为一个属性（Attribute）。\n  \n \
    \ 属性的名字是唯一的。属性 $A_i$ 的取值范围 $D_i$（$i=1,2,\\cdots,n$）称为值域。n 元关系必有 $n$ 个属性。\n\n|\
    \ $A_1$ | $A_2$ | $\\cdots$ | $A_n$ |\n|---|---|---|---|\n| a1 | a2 | $\\cdots$\
    \ | an |\n| $\\cdots$ | $\\cdots$ | $\\cdots$ | $\\cdots$ |\n| $\\cdots$ | $\\\
    cdots$ | $\\cdots$ | $\\cdots$ |\n\n## 关系示例\n\n以MAN、WOMAN、CHILD三个域的笛卡儿积的子集构造FAMILY关系：\n\
    \nFAMILY (MAN, WOMAN, CHILD)\n\n其中MAN—丈夫，WOMAN—妻子，CHILD—这对夫妇的子女。假设M1、W1、C1，M2、W2、C2，C3是两个家庭，则FAMILY关系为：\n\
    \n| MAN | WOMAN | CHILD |\n| --- | --- | --- |\n| M₁ | W₁ | C₁ |\n| M₂ | W₂ |\
    \ C₂ |\n| M₂ | W₂ | C₃ |\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_70_0.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_70_1.png)\n\n## 关系的性质\n\n- 列是同质的（Homogeneous）即每一列中的分量来自同一域，是同一类型的数据；\n\
    - 不同的列可出自同一域，每列必须有不同的属性名；\n- 列的顺序无所谓，即列次序可以互换；\n- 任意两个元组不能完全相同；\n- 行的顺序无所谓，即行次序可以互换；\n\
    - 每一分量必须是不可再分的数据。满足这一条件的關係称作满足第一范式（1NF）的。\n\n## 关系数据模型\n\n- 关系模型的数据结构\n- 关系模型的语义约束\n\
    - 关系模型的数据操作概述\n\n## 关系模型的数据结构（1）\n\n- 关系模型的数据结构—关系\n  - 实体及实体之间的联系均用单一的数据结构—“关系”来表示。\n\
    - 几个基本概念\n  - 关系、域、n目关系、元组、属性。\n  - 码（Key,键）\n    - 候选码（Candidate key）：关系中的某一属性组，若它的值唯一地标识了一个元组，并具有最小性，则称该属性组为候选码。\n\
    \    - 主码(Primary key,首码，码)：若一个关系有多个候选码，则选定其中一个为主码。\n  - 主属性与非主属性\n    - 码中的诸属性称为主属性，不包含在任何候选码中的属性称为非主属性。\n\
    \n"
