    # 分布透明性（1）


    分布透明性包括：分片透明性、位置透明性、局部数据模型透明性


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_464_0.png)'
  - '[PAGE 465]


    # # 分布透明性（2）


    +   - **分片透明性**——用户或应用程序只对全局关系进行操作而不必考虑关系的分片。它是分布透明性的最高层次。

    +   - **位置透明性**——用户或应用程序不必了解片段的存储场地，也不必关心各数据副本的一致性。

    +   - **局部数据模型透明性**——用户或应用程序不必了解局部场地上使用的是哪种数据模型。模型的转换以及查询语言等的转换均由分布模式/局部概念模式（映象4）完成。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_465_0.png)'
  - '[PAGE 466]


    # 分布透明性示例


    • 示例：设有全局关系 S（S#，SN，SD，SA），它被划分为两个片段 S-A（本科生），S-B（研究生），S-B 有两个副本。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_466_0.png)'
  - '[PAGE 467]


    # 分布透明性示例


    执行查询操作：检索所有学生的学号和年龄。


    +   - 若系统具有分片透明性，则执行操作：

    +     SELECT S#,SA

    +     FROM S


    +   - 若系统具有位置透明性，不具有分片透明性，则可执行操作：

    +     SELECT S#, SA

    +     FROM  S_A

    +     UNION

    +     SELECT S#, SA

    +     FROM  S_B


    +   - 若系统只具有局部数据模型的透明性，不具有位置透明性与分片透明性，在执行操作：

    +     SELECT S#, SA

    +     FROM S_A AT SITE-1

    +     UNION

    +     SELECT S#, SA

    +     FROM S_B AT SITE-3


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_467_0.png)


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_467_1.png)'
  - '[PAGE 468]


    # 分布式数据库管理系统DDBMS


    # • DDBMS的组成


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_468_0.png)'
  - '[PAGE 469]


    # DDBMS的组成


    +   - LDBMS(局部场地上的数据库管理系统)

    +     - 功能：建立和管理局部数据库，提供场地自治能力，执行局部应用及全局查询的子查询。

    +   - GDBMS（全局数据库管理系统）

    +     - 功能：提供分布透明性，协调全局事务的执行，协调各局部DBMS以完成全局应用，并保证数据库的全局一致性，执行并发控制，实现更新同步，提供全局恢复功能。

    +   - GDD（全局数据字典）

    +     - 存放全局概念模式、分片模式、分布模式的定义以及各模式之间映射的定义。

    +     - 存放有关用户存取权限的定义，以保证全局用户的合法权限和数据库的安全性。

    +     - 存放数据完整性约束条件的定义。

    +   - CM（通信管理）

    +     - 在分布式数据库各场地之间传递消息和数据，完成通信功能。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_469_0.png)'
  - '[PAGE 470]


    # DDBMS的分类（1）


    +   - 按全局控制方式分类

    +     - 全局控制集中的DDBMS


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_470_0.png)


    +   - 特点：GDBMS集中在某一节点上，GDD只有一个，也故在该节点上。

    +   - 优点：控制简单，容易设计实现

    +   - 缺点：易形成瓶颈，并且一旦该节点出现故障，整个系统将瘫痪。'
  - '[PAGE 471]


    # DDBMS 的分类（2）


    +   - 全局控制分散的DDBMS

    +     - 特点：GDBMS 分散在每一个节点上。GDD 也在每个节点上有一份。这类结构称为完全分布的DDBMS。

    +     - 优点：节点独立，自治性强，单个节点出现问题不会使系统瘫痪；

    +     - 缺点：全局控制的协调机制和一致性维护都比较复杂。


    +   - 全局控制部分分散的DDBMS

    +     - 根据应用的需要将全局数据库管理器和全局数据字典分散在某些节点上。介于上述两者之间的体系结构。'
  - '[PAGE 472]


    # DDBMS 的分类 (3)


    +   - 按局部DBMS的类型分类

    +     - 同构型DDBMS

    +       - 每个节点的局部数据库具有相同的DBMS，即使硬件与操作系统不同。

    +     - 异构型DDBMS

    +       - 各节点的局部数据库具有不同的DBMS'
  - '[PAGE 473]


