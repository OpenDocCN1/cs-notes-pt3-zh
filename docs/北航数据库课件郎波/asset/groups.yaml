  - '[PAGE 71]


    # 关系的性质


    +   - 列是同质的（Homogeneous）即每一列中的分量来自同一域，是同一类型的数据；

    +   - 不同的列可出自同一域，每列必须有不同的属性名；

    +   - 列的顺序无所谓，即列次序可以互换；

    +   - 任意两个元组不能完全相同；

    +   - 行的顺序无所谓，即行次序可以互换；

    +   - 每一分量必须是不可再分的数据。满足这一条件的關係称作满足第一范式（1NF）的。'
