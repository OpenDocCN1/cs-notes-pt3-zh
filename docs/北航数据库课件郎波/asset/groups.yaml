    例2：求选修四门以上课程的学生学号和总成绩（不统计不及格的课程）。最后按降序列出总成绩排序名单。


    ```

    SELECT S#, SUM (G)

    FROM SC

    WHERE G>=60

    GROUP BY S#

    HAVING COUNT (*) >=4

