    \n## DDBMS 的分类（2）\n\n- 全局控制分散的DDBMS\n  - 特点：GDBMS 分散在每一个节点上。GDD 也在每个节点上有一份。这类结构称为完全分布的DDBMS。\n\
    \  - 优点：节点独立，自治性强，单个节点出现问题不会使系统瘫痪；\n  - 缺点：全局控制的协调机制和一致性维护都比较复杂。\n\n- 全局控制部分分散的DDBMS\n\
    \  - 根据应用的需要将全局数据库管理器和全局数据字典分散在某些节点上。介于上述两者之间的体系结构。\n\n## DDBMS 的分类 (3)\n\n- 按局部DBMS的类型分类\n\
    \  - 同构型DDBMS\n    - 每个节点的局部数据库具有相同的DBMS，即使硬件与操作系统不同。\n  - 异构型DDBMS\n    - 各节点的局部数据库具有不同的DBMS\n\
