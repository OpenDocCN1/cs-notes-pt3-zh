  - '[PAGE 292]


    # 示例（1）


    +   关系模式TEACH（C，T，B），一门课程由多个教师担任，每个教师可以讲授多门课程；一门课程使用相同的一套参考书，每种参考书可被多门课程使用。它的码是（C，T，B），所以属于BCNF。


    | C | T | B |

    |---|---|---|

    | 物理 | {张明, 张平} | {普通物理学, 光学原理} |

    | 化学 | {李勇, 王微} | {无机化学, 有机化学} |


    T 多值依赖于 C，记作 C ⟶⟶ T，

    同样有 C ⟶⟶ B


    | C | T | B |

    |---|---|---|

    | 物理 | 张明 | 普通物理学 |

    | 物理 | 张明 | 光学原理 |

    | 物理 | 张平 | 普通物理学 |

    | 物理 | 张平 | 光学原理 |

    | 化学 | 李勇 | 无机化学 |

    | 化学 | 李勇 | 有机化学 |

    | 化学 | 王微 | 无机化学 |

    | 化学 | 王微 | 有机化学 |'
  - '[PAGE 293]


    # 多值依赖的性质


    +   - **多值依赖有对称性**

    +     - 若 `X →→ Y`，则 `X →→ Z`，其中 `Z = U - X - Y`

    +   - 若 `X → Y`，则 `X →→ Y`。即函数依赖可以看作多值依赖的特殊情况。

    +   - 若 `X →→ Y`，而 `Z = ∅`，则称 `X →→ Y` 为平凡的多值依赖，否则，若 `X →→ Y`，而 `Z ≠ ∅`，则称 `X
    →→ Y` 为非平凡的多值依赖。

    +   - 若 `X →→ Y`，`X →→ Z`，则 `X →→ YZ`。

    +   - 若 `X →→ Y`，`X →→ Z`，则 `X →→ Y ∩ Z`。

    +   - 若 `X →→ Y`，`X →→ Z`，则 `X →→ Y - Z`，`X →→ Z - Y`。'
  - '[PAGE 294]


    # 4NF的定义


    定义


    关系模式R<U, F>∈1NF，如果对于R的每个非平凡的多值依赖X→→Y（Y⊈X），X都含有码，则称R∈4NF。


    4NF所允许的非平凡的多值依赖实际上是函数依赖（左部含有码的）。4NF就是限制关系模式的属性之间不允许有非平凡且非函数依赖的多值依赖。


    或定义


    关系模式R∈BCNF，且不存在非平凡的非函数依赖的多值依赖，则R∈4NF。


    含义：若R∈BCNF，且R中只存在函数依赖，则R∈4NF；或若R中存在平凡的多值依赖时，R∈4NF。'
  - '[PAGE 295]


    # 4NF 的规范化


    +   - 非4NF 的关系存在的弊病是数据冗余太大

    +     - 例： TEACH (C, T, B)，由于 C →→ T， C →→ B，码为 (C, T, B)。所以 TEACH ∉4NF。

    +     - 如果一门课有 m 个教师，n 本参考书，则同一门课将有 m×n 个元组。


    +   - 采用模式分解的方法消除非平凡且非函数依赖的多值依赖

    +     - 例：将 CTB 分解为 CT (C, T)， CB (C, B)。在 CT、CB 中，CT ∈4NF， CB∈4NF。

    +     - 如果一门课有 m 个教师，n 本参考书，则同一门课将有 m+n 个元组。


    | C | T | B |

    |---|---|---|

    | 课程 | 张明 | 普通物理参考书 |

    | 课程 | 张明 | 普通参考书 |

    | 课程 | 张平 | 普通物理参考书 |

    | 课程 | 张平 | 无参考书 |

    | 化学 | 李勇 | 无参考书 |

    | 化学 | 李勇 | 无参考书 |

    | 化学 | 王敏 | 无参考书 |

    | 化学 | 王敏 | 有参考书 |'
  - '[PAGE 296]


    # 规范化目的与基本思想


    +   - 在关系数据库中，对关系的最基本要求是满足第一范式。这些关系常有一些异常或冗余等弊病。规范化的目的就是要消除这些弊病。

    +   - 规范化的基本思想是逐步消除数据依赖中不合适的部分，使数据库模式中各关系模式达到某种程度的“分离”，使一个关系只描述一个实体或者实体间的一种联系。即“一事一地”的设计原则。规范化的实质是概念的单一化。'
  - '[PAGE 297]


    # # 规范化的过程


    +   - 规范化的过程概括如下：


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_297_0.png)'
  - '[PAGE 298]


    # 范式之间的关系（1）


    +   - 3NF ⊂ 2NF


    反证：若 R∈3NF，但 R∉2NF，则按 2NF 定义，一定有非主属性部分依赖于码，


    设 X 为 R 的码，则存在 X 的真子集 X′，以及非主属性 Z（Z ⊄ X′），使得 X′→Z。


    于是 在 R 中存在码 X，属性组 X′，以及非主属性 Z（Z ⊄ X′），使得 X→X′，X′→Z，X′→X 成立，这与 R∈3NF 矛盾。所以 R∈2NF。'
  - '[PAGE 299]


    # 范式之间的关系（2）


    +   - **BCNF ⊂ 3NF**


    反证：若 R∈BCNF，但 R∉3NF，则按3NF定义，一定有非主属性对码的传递依赖，于是存在：


    R的码X，属性组Y，以及非主属性Z（Z⊄Y），使得X→Y，Y→Z，Y↛X成立。


    由Y→Z，按BCNF定义，Y含有码，于是Y→X成立，这与Y↛X矛盾。所以R∈3NF。


    +   - **4NF ⊂ BCNF**'
