    # Armstrong公理系统


    # Armstrong公理系统


    对于R<U,F>，有如下规则：


    +   - A1自反律：若Y ⊆ X ⊆ U，则X → Y为F所蕴含。

    +   - A2增广律：若X → Y为F所蕴含，且Z ⊆ U则XZ → YZ为F所蕴含。

    +   - A3传递律：若X → Y，Y → Z为F所蕴含，则X → Z为F所蕴含。'
  - "[PAGE 259]\n\n# Armstrong公理系统的正确性\n\n对 R∪F 的任一关系中任意两个元组，S：\n\n+   - **证明自反律**：即若\
    \ Y ⊆ X，则 X → Y。\n+   \n+   若 t[X] = s[X] 且 Y ⊆ X，则 t[Y] = s[Y]，因此 X → Y。\n\n\
    +   - **证明增广律**：即若 X → Y，则 XZ → YZ。\n+   \n+   若 t[XZ] = s[XZ]，则 t[Z] = s[Z]，且\
    \ t[X] = s[X]。又因 X → Y，所以 t[Y] = s[Y]，从而 t[YZ] = s[YZ]，因此 XZ → YZ。"
  - "[PAGE 260]\n\n# Armstrong公理系统的正确性\n\n对R<U, F>的任一关系r中任意两个元组t，s：\n\n+   - 证明传递律：即若X→Y，\
    \ Y→Z，则X→Z。\n\n若 t[X] = s[X]\n由于 X→Y } ⇒ t[Y] = s[Y] }\n          又因 Y→Z     \
    \ ⇒ t[Z] = s[Z]\n\n⇒ X→Z"
  - '[PAGE 261]


    # Armstrong公理的推论


    +   - 由Armstrong公理系统得到的三条推理规则

    +     - 合并规则：由X→Y， X→Z，有X→YZ。

    +     - 伪传递规则：由X→Y， WY→Z，有XW→Z。

    +     - 分解规则：由X→Y及Z⊆Y，有X→Z。


    +   - 从合并规则和分解规则得出如下定理：


    # 定理1：


    X→A₁ A₂ ... Aₖ 成立 ⇔ X→Aᵢ 成立 (i=1, 2, ..., k)'
  - '[PAGE 262]


    # 属性集的闭包


    +   - 属性集X关于函数依赖集F的闭包

    +     - 定义：在R<U, F>中，X⊆U，

    +       X_F⁺ = {A | X→A能由F根据Armstrong公理导出}

    +       称 X_F⁺ 为属性集X关于函数依赖集F的闭包。


    +   - 定理：

    +     X → Y能够由F根据Armstrong公理导出

    +     ⇔ Y ⊆ X_F⁺


