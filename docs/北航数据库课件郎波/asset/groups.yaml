    \ | a₄ | a₅ |\n| b₃₁ | b₃₂ | b₃₃ | a₄ | a₅ |\n\n## 无损分解的判定准则\n\n- • 定理： R <U,\
    \ F> 的一个分解ρ={R1<U1, F1>, R2<U2, F2>}具有无损连接性的充分必要条件是U1∩U2→U1-U2∈F⁺ 或 U1∩U2→U2−U1∈F⁺。\n\
    \  - 即R1, R2的共同属性至少构成R1、R2二者之一的候选码。\n\n## 分解的保持函数依赖性\n\n- • **定义：** 若 $F^+=(\\\
    bigcup_{i=1}^{n}F_i)^+$，则称 $R<U,F>$ 的分解 $\\rho=\\{R_1<U_1,F_1>,\\ldots,R_n<U_n,F_n>\\\
    }$ 保持函数依赖。\n\n- • **保持函数依赖性的判定方法**\n  \n  设 $G=(\\bigcup_{i=1}^{n}F_i)$，则\n  \n\
    \  $F^+=G^+\\Leftrightarrow F\\subseteq G^+$，且 $G\\subseteq F^+$\n  \n  要判定 $F\\\
    subseteq G^+$，只需逐一对 $F$ 中函数依赖 $X\\to Y$，考察 $Y$ 是否属于 $X_G^+$。若有 $F$ 中的函数依赖不满足该条件，则\
    \ $F^+\\ne G^+$，$\\rho$ 不保持函数依赖。\n\n— $R$ 中的每个函数依赖都能够从 $R_1\\ldots R_n$ 函数依赖的并集中逻辑导出。\n\
    \n## 示例\n\n- • 例： R=< ABC, {A→B , B→C}>,\n  ρ={<AB, {A→B}> , <AC, {A→C}>}\n\n\
    则 G={A→B, A→C}, G⁺={A→B, A→C, A→BC}, B 关于 G⁺ 的闭包为（B），因为对于 F 中 B→C，C ∉ B 关于 G⁺\
    \ 的闭包，所以 F ⊈ G⁺，F⁺ ≠ G⁺，ρ 未保持函数依赖。\n\n## Rissanen 判别条件\n\n- - 判别是否具有无损连接性和保持函数依赖\n\
    \n关系R投影分解为R1和R2，如果\n\n- - (1) R中的每个函数依赖都能够从R₁ 或 R₂ 逻辑导出，则分解保持函数依赖；\n- - (2) R₁,\
    \ R₂ 的共同属性至少构成 R₁, R₂ 二者之一的候选码，则分解具有无损连接性。\n\n## 模式分解的原则\n\n- - 规范化中的问题\n  - 规范化通过投影分解来完成。投影分解不是唯一的。并且结果大不相同。\n\
    \  - 例如，对于SDM (S#, SDN, MN) 的投影分解：\n\n（1）SD（S#, SDN）\nSM（S#, MN）\n-具有无损连接性；\n\
    -未保持函数依赖\n\n（2）SM（S#, MN）\nDM（SDN, MN）\n-不具有无损连接性；\n-未保持函数依赖\n\n（3）SD（S#, SDN）\n\
    DM（SDN, MN）\n-具有无损连接性；\n-保持函数依赖\n\n- - 投影分解中应遵循的原则：\n  - 具有无损连接性\n  - 保持函数依赖\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_310_0.png)\n\n## 模式分解能够达到的范式等级\n\n\
    - - 模式分解能够达到的范式等级：\n  - 若要求分解保持函数依赖，那么模式分解最多可以达到3NF，但不一定能达到BCNF；\n  - 若要求分解具有无损连接性，则一定可以达到4NF或更高；\n\
    \  - 若要求分解既保持函数依赖，又具有无损连接性，可以达到3NF，但不一定能达到BCNF。\n\n## 关系模式的分解算法\n\n- - 关系模式的分解算法\n\
    \  - 达到3NF且保持函数依赖的分解算法\n  - 达到3NF且同时保持无损连接与函数依赖的分解算法\n  - 达到BCNF无损连接分解算法\n\n##\
    \ 达到3NF的等价模式分解（1）\n\n- 达到3NF且保持函数依赖的分解算法：\n  1. 对F进行极小化处理，仍记为F。\n  2. 找出不在F中出现的属性，将它们构成一个关系模式，并从U中去掉它们(剩余属性仍记为U)。\n\
    \  3. 若有X→A∈F，且XA=U，则ρ={R}，算法终止。\n  4. 对F按具有相同左部的原则进行分组(设为k组)，每一组函数依赖所涉及的属性全体为Ui，若有Ui⊆Uj(i≠j),则去掉Ui。令Fi为F在Ui上的投影，则ρ={R1<U1,F1>,...,Rk<Uk,Fk>}是R<U,F>的一个保持函数依赖的分解，并且每个Ri<Ui,Fi>∈3NF。\n\
    \n## 示例\n\n# — 示例1：\n\nU={S#, SD, MN, C#, G}\n\nF={S#→SD, S#→MN, SD→MN, (S#,C#)→G}\n\
    \n- 1. Fₘ={S#→SD, SD→MN, (S#,C#)→G}\n\n- 2. 保持函数依赖的分解：ρ={\n    {(S#, SD), S#→SD}\n\
    \    {(SD, MN), SD→MN}\n    {(S#, C#, G), (S#,C#)→G}\n  }\n\n分解具有无损连接性。\n\n##\
    \ 示例\n\n– 示例2： R（ABC； A→C， B→C）\n保持函数依赖分解：\nρ = { {AC； A→C}, {BC； B→C}}。\n分解是有损的。\n\
    \n## 达到3NF的等价模式分解（2）\n\n- - 达到3NF且同时保持无损连接与函数依赖的分解\n\n算法：设 ρ = {R₁⟨U₁，F₁⟩，…，Rₖ⟨Uₖ，Fₖ⟩}\
    \ 是 R⟨U，F⟩ 的一个保持函数依赖的3NF分解。\n\n设 X 为 R⟨U，F⟩ 的码，\n\n- 1. 若有某个 Uᵢ，X ⊆ Uᵢ，则 ρ 即为所求。\n\
    \n- 2. 否则令 τ = ρ ∪ {R*⟨X，Fₓ⟩}，τ 即为所求。\n\n## 示例\n\n例1：求R（ABC；A→C，B→C）的保持无损连接和函数依赖的3NF分解。\n\
    \n- (1) 按保持函数依赖分解\n  进行分组，ρ={{AC；A→C}，{BC；B→C}}。\n\n- (2) 码为AB\n  τ = ρ∪{AB}\n\
    \  最后的分解为：\n  {{AC；A→C}，{BC；B→C}，{AB}}\n\n"
