    # 函数依赖相关术语


    +   - 平凡与非平凡的函数依赖

    +     — 对于函数依赖 X→Y，若 Y ⊆ X，则称 X→Y 是平凡的函数依赖；若 Y ⊈ X，则称 X→Y 是非平凡的函数依赖。


    +   - 决定因素

    +     — 对于函数依赖 X→Y，则 X 叫做决定因素。'
  - '[PAGE 249]


    # 函数依赖的进一步说明


    +   - **函数依赖是不随时间而变的**

    +     - 若关系 $R$ 只有函数依赖 $X\to Y$，那么虽然关系 $R$ 随时间而变化，但 $X\to Y$ 不变


    +   - **函数依赖是语义范畴的概念**

    +     - 只能根据语义来确定一个函数依赖，而不能形式化证明一个函数依赖成立'
