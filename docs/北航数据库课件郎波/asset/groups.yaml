    # 并发操作导致的数据不一致性


    +   - 丢失更新(Lost Update)

    +     - 两个事务T₁和T₂读入同一数据并修改，T₂提交的结果破坏了T₁提交的结果，导致T₁的修改被丢失。


    | T₁ | T₂ |

    | --- | --- |

    | READ(A) //A=16 | |

    | A=A-1 | READ(A) //A=16 |

    | WRITE(A) //A=15 | |

    | | A=A-1 |

    | | WRITE(A) //A=15 |'
  - '[PAGE 382]


    # “脏”数据的读出(Dirty Read)


    事务T₁修改某一数据，并将其写回磁盘，事务T₂读取同一数据后，T₁由于某种原因被撤销，这时T₁已修改过的数据恢复为原值，T₂读到的数据就与数据库中的不一致，则T₂读到的数据就为“脏”数据。


    | T₁ | T₂ |

    |---|---|

    | READ(C) //C=100

    C=C*2

    WRITE (C) | |

    | | READ(C) //C=200 |

    | ROLLBACK

    //C=100 | |'
  - '[PAGE 383]


    # • 不能重复读 (Non-Repeatable Read)


    事务 T₁ 读取数据后，事务 T₂ 执行更新（修改、插入、删除）操作，使 T₁ 无法再现前一次读取的结果。


    | T₁ | T₂ |

    |---|---|

    | READ(A) | |

    | READ(B) | |

    | Sum=A+B | |

    | | READ(B) |

    | | B=B*2 |

    | | WRITE(B) |

    | READ(A) | |

    | READ(B) | |

    | Sum=A+B | |


    | T₁ | T₂ |

    |---|---|

    | select * from SC<br>where CNO = C01<br>and SNO = S01 | |

    | | Delete From SC<br>Where CNO = C01 and<br>SNO = S01 |

    | select * from SC<br>where CNO = C01<br>and SNO = S01 | |'
  - '[PAGE 384]


    # 事务并发操作中可能存在的问题


    +   - 丢失更新(Lost Update)

    +   - “脏”数据的读出(Dirty Read)

    +   - 不能重复读(Non-Repeatable Read)'
  - '[PAGE 385]


    # 并发控制基本思想


    +   - 并发控制就是要合理调度并发事务，避免并发事务之间的互相干扰造成数据的不一致性。

    +   - 并发控制的主要方法是采用封锁机制。'
  - '[PAGE 386]


    # 并发控制的基本手段—封锁


    +   - 封锁就是事务T在对某个数据对象如表、记录等操作之前，先向系统发出请求，对其加锁，从而对该数据对象有了一定的控制权。

    +   - 基本的封锁有两种类型：

    +     - 排它锁（X锁，eXclusive lock）

    +     - 共享锁（S锁，Share lock）'
  - '[PAGE 387]


    +   - 排它锁（X锁）：事务T对数据对象R加上X锁，则只允许T读取和修改R，其它事务对R的任何封锁请求都不能成功（因而不能读取和修改R），直至T释放R上的X锁。

    +   - 共享锁（S锁）：事务T对数据对象R加上S锁，则事务T可以读取但不能修改R，其它事务只能对R加S锁（因而可以读取R），而不能对R加X锁（因而不能修改R），直到T释放R上的S锁。'
  - '[PAGE 388]


    +   - 以相容矩阵表示两种基本锁的控制：


    |  | X | S |

    |---|---|---|

    | T₁ \ T₂ |  |  |

    | X | N | N |

    | S | N | Y |'
  - '[PAGE 389]


    +   - 运用X锁和S锁这两种基本封锁，可以建立不同的约定，形成不同级别的封锁协议，以保证事务并发执行过程中的数据的一致性。


    +   - 一级封锁协议——防止丢失修改

    +   - 二级封锁协议——防止读“脏”数据

    +   - 三级封锁协议——保证数据可重复读'
  - '[PAGE 390]


    # 一级封锁协议


    +   - 协议内容：事务T在修改数据R之前必须对其加X锁，直到事务结束才释放。事务结束包括正常结束(COMMIT)和非正常结束(ROLLBACK)。


    | T₁ | T₂ |

    | --- | --- |

    | X LOCK A | |

    | ... | |

    | A=A-1 | X LOCK A |

    | ... | 等待 |

    | COMMIT | . |

    | UNLOCK A | . |

    |  | 获得 |


    一级封锁协议可以防止丢失修改，并保证事务T是可恢复的。但在一级封锁协议中，不要求读数据操作对数据加锁，因此它不能保证可重复读和不读“脏”数据。'
  - '[PAGE 391]


    <!-- no content -->'
  - '[PAGE 392]


    # 三级封锁协议


    — 协议内容：一级封锁协议加上事务T在读取R之前必须须对其加S锁，直到事务结束才释放。


    | T₁ | T₂ |

    |---|---|

    | S LOCK A<br>S LOCK B<br>…<br>READ(A) //A=50<br>READ(B)// B= 100<br>Sum=A+B //Sum=150<br>…
    | <br><br>X LOCK B<br>等待<br>·<br>·<br>· |


    | T₁ | T₂ |

    |---|---|

    | READ(A)<br>READ(B)<br>Sum=A+B //Sum=150<br>COMMIT<br>UNLOCK(A)<br>UNLOCK(B)
    | 等待<br>·<br>·<br>·<br>·<br>·<br>获得<br>WRITE(B) |


    — 三级封锁协议除了防止丢失修改和读“脏”数据以外，还进一步防止了不可重复读。'
  - '[PAGE 393]


    # 封锁协议小结


    +   - 三级协议的主要区别在于何时加锁以及何时释放。


    | | X锁 | | S锁 | | 一致性保证 | | |

    | | 操作结束释放 | 事务结束释放 | 操作结束释放 | 事务结束释放 | 不要求改 | 不读“脏”数据 | 可重复读 |

    | 一级封锁协议 | | √ | | | √ | | |

    | 二级封锁协议 | | √ | √ | | √ | √ | |

    | 三级封锁协议 | | √ | | √ | √ | √ | √ |'
  - '[PAGE 394]


    # 封锁的粒度


    +   - 封锁对象的大小称为封锁粒度。


    +   - 封锁对象：属性值、属性值集合、元组、关系、某索引项、整个索引、整个数据库、物理页、块等。


    +   - 封锁粒度大，则并发度低，封锁机构简单，开销小。

    +     封锁粒度小，则并发度高，封锁机构复杂，开销高。


    +   - 多粒度封锁：在一个系统中同时支持多种封锁粒度供不同的事务选择。选择封锁粒度时应同时考虑封锁开销和并发度两个因素，适当选择封锁粒度以达到最优效果。'
  - '[PAGE 395]


    # 多粒度封锁（1）


    +   - 多粒度树

    +     - 多粒度树的根结点是整个数据库，表示最大的粒度。叶结点表示最小的粒度。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_395_0.png)'
  - '[PAGE 396]


    # 多粒度封锁（2）


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_396_0.png)


    +   - 多粒度封锁协议

    +     - 多粒度封锁协议允许多粒度树中的每个结点被独立地加锁。对一个结点加锁意味着这个结点的所有后裔结点也被加以同样类型的锁。因此，在多粒度封锁中一个数据对象可能以两种方式封锁，即：

    +       - 显式封锁是应事务的要求直接加到数据对象上的封锁。

    +       - 隐式封锁是该数据对象没有独立加锁，是由于其上级结点加锁而使该数据对象加上了锁。

    +     - 在多粒度封锁方法中，显式封锁与隐式封锁的效果是一样的。'
  - '[PAGE 397]


    # 多粒度封锁（3）


    +   - 多粒度封锁中存在的问题

    +     - 在多粒度封锁方法中，一般对某个数据对象加锁，系统要做如下检查：

    +       - 是否与该数据对象上的显式封锁冲突（检查对象本身）；

    +       - 是否与该数据对象上的隐式封锁冲突（检查对象的所有上级结点）；

    +       - 是否与该数据对象下级的显式封锁冲突（检查其所有下级结点）。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_397_0.png)'
  md: "\n## 并发控制\n\n- **事务并行执行的优点**\n  - 一个事务由不同的步骤组成，所涉及的系统资源也不同。这些步骤可以并发执行，以提高系统的吞吐量。\n\
    \  - 系统中存在着周期不等的各种事务，串行会导致难于预测的时延。如果各个事务所涉及的是数据库的不同部分，采用并发会减少平均响应时间。\n\n- **事务并行执行带来的问题**\n\
    \  - 多个事务同时在取同一数据时，如不加控制就可能会读取或存储不正确的数据，破坏数据库的一致性。\n\n### 并发控制的必要性\n\n- 例：假设存款余额\
    \ X=1000 元，事务甲取走 300 元，事务乙取走 200 元，存款余额最终更新后应该是 X=500 元。\n\n| 时间 | 事务甲 | 事务乙 |\n\
    |---|---|---|\n| … | … | … |\n| t₁ | 读 X（1000） | … |\n| … | … | … |\n| t₂ | …\
    \ | 读 X（1000） |\n| … | … | … |\n| t₃ | 更新：X=X-300（700） | … |\n| … | … | 更新：X=X-200（800）\
    \ |\n\n错误\n\n### 并发操作导致的数据不一致性\n\n- 丢失更新(Lost Update)\n  - 两个事务T₁和T₂读入同一数据并修改，T₂提交的结果破坏了T₁提交的结果，导致T₁的修改被丢失。\n\
    \n| T₁ | T₂ |\n| --- | --- |\n| READ(A) //A=16 | |\n| A=A-1 | READ(A) //A=16 |\n\
    | WRITE(A) //A=15 | |\n| | A=A-1 |\n| | WRITE(A) //A=15 |\n\n### “脏”数据的读出(Dirty\
    \ Read)\n\n事务T₁修改某一数据，并将其写回磁盘，事务T₂读取同一数据后，T₁由于某种原因被撤销，这时T₁已修改过的数据恢复为原值，T₂读到的数据就与数据库中的不一致，则T₂读到的数据就为“脏”数据。\n\
    \n| T₁ | T₂ |\n|---|---|\n| READ(C) //C=100<br>C=C*2<br>WRITE (C) | |\n| | READ(C)\
    \ //C=200 |\n| ROLLBACK<br>//C=100 | |\n\n### 不能重复读 (Non-Repeatable Read)\n\n\
    事务 T₁ 读取数据后，事务 T₂ 执行更新（修改、插入、删除）操作，使 T₁ 无法再现前一次读取的结果。\n\n| T₁ | T₂ |\n|---|---|\n\
    | READ(A) | |\n| READ(B) | |\n| Sum=A+B | |\n| | READ(B) |\n| | B=B*2 |\n| | WRITE(B)\
    \ |\n| READ(A) | |\n| READ(B) | |\n| Sum=A+B | |\n\n| T₁ | T₂ |\n|---|---|\n|\
    \ select * from SC<br>where CNO = C01<br>and SNO = S01 | |\n| | Delete From SC<br>Where\
    \ CNO = C01 and<br>SNO = S01 |\n| select * from SC<br>where CNO = C01<br>and SNO\
    \ = S01 | |\n\n### 事务并发操作中可能存在的问题\n\n- 丢失更新(Lost Update)\n- “脏”数据的读出(Dirty Read)\n\
    - 不能重复读(Non-Repeatable Read)\n\n### 并发控制基本思想\n\n- 并发控制就是要合理调度并发事务，避免并发事务之间的互相干扰造成数据的不一致性。\n\
    - 并发控制的主要方法是采用封锁机制。\n\n### 并发控制的基本手段—封锁\n\n- 封锁就是事务T在对某个数据对象如表、记录等操作之前，先向系统发出请求，对其加锁，从而对该数据对象有了一定的控制权。\n\
    - 基本的封锁有两种类型：\n  - 排它锁（X锁，eXclusive lock）\n  - 共享锁（S锁，Share lock）\n\n- 排它锁（X锁）：事务T对数据对象R加上X锁，则只允许T读取和修改R，其它事务对R的任何封锁请求都不能成功（因而不能读取和修改R），直至T释放R上的X锁。\n\
    - 共享锁（S锁）：事务T对数据对象R加上S锁，则事务T可以读取但不能修改R，其它事务只能对R加S锁（因而可以读取R），而不能对R加X锁（因而不能修改R），直到T释放R上的S锁。\n\
    \n- 以相容矩阵表示两种基本锁的控制：\n\n|  | X | S |\n|---|---|---|\n| T₁ \\ T₂ |  |  |\n| X |\
    \ N | N |\n| S | N | Y |\n\n- 运用X锁和S锁这两种基本封锁，可以建立不同的约定，形成不同级别的封锁协议，以保证事务并发执行过程中的数据的一致性。\n\
    \n- 一级封锁协议——防止丢失修改\n- 二级封锁协议——防止读“脏”数据\n- 三级封锁协议——保证数据可重复读\n\n### 一级封锁协议\n\n-\
    \ 协议内容：事务T在修改数据R之前必须对其加X锁，直到事务结束才释放。事务结束包括正常结束(COMMIT)和非正常结束(ROLLBACK)。\n\n| T₁\
    \ | T₂ |\n| --- | --- |\n| X LOCK A | |\n| ... | |\n| A=A-1 | X LOCK A |\n| ...\
    \ | 等待 |\n| COMMIT | . |\n| UNLOCK A | . |\n|  | 获得 |\n\n一级封锁协议可以防止丢失修改，并保证事务T是可恢复的。但在一级封锁协议中，不要求读数据操作对数据加锁，因此它不能保证可重复读和不读“脏”数据。\n\
    \n### 三级封锁协议\n\n- 协议内容：一级封锁协议加上事务T在读取R之前必须对其加S锁，直到事务结束才释放。\n\n| T₁ | T₂ |\n|---|---|\n\
    | S LOCK A<br>S LOCK B<br>…<br>READ(A) //A=50<br>READ(B)// B= 100<br>Sum=A+B //Sum=150<br>…\
    \ | <br><br>X LOCK B<br>等待<br>·<br>·<br>· |\n\n| T₁ | T₂ |\n|---|---|\n| READ(A)<br>READ(B)<br>Sum=A+B\
    \ //Sum=150<br>COMMIT<br>UNLOCK(A)<br>UNLOCK(B) | 等待<br>·<br>·<br>·<br>·<br>·<br>获得<br>WRITE(B)\
    \ |\n\n三级封锁协议除了防止丢失修改和读“脏”数据以外，还进一步防止了不可重复读。\n\n### 封锁协议小结\n\n- 三级协议的主要区别在于何时加锁以及何时释放。\n\
    \n|  | X锁（操作结束释放） | X锁（事务结束释放） | S锁（操作结束释放） | S锁（事务结束释放） | 一致性保证（不要求改） | 一致性保证（不读“脏”数据）\
    \ | 一致性保证（可重复读） |\n| 一级封锁协议 |  | √ |  |  | √ |  |  |\n| 二级封锁协议 |  | √ | √ |  |\
    \ √ | √ |  |\n| 三级封锁协议 |  | √ |  | √ | √ | √ | √ |\n\n### 封锁的粒度\n\n- 封锁对象的大小称为封锁粒度。\n\
    \n- 封锁对象：属性值、属性值集合、元组、关系、某索引项、整个索引、整个数据库、物理页、块等。\n\n- 封锁粒度大，则并发度低，封锁机构简单，开销小。\n\
    - 封锁粒度小，则并发度高，封锁机构复杂，开销高。\n\n- 多粒度封锁：在一个系统中同时支持多种封锁粒度供不同的事务选择。选择封锁粒度时应同时考虑封锁开销和并发度两个因素，适当选择封锁粒度以达到最优效果。\n\
    \n### 多粒度封锁（1）\n\n- 多粒度树\n  - 多粒度树的根结点是整个数据库，表示最大的粒度。叶结点表示最小的粒度。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_395_0.png)\n\
    \n### 多粒度封锁（2）\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_396_0.png)\n\n- 多粒度封锁协议\n\
    \  - 多粒度封锁协议允许多粒度树中的每个结点被独立地加锁。对一个结点加锁意味着这个结点的所有后裔结点也被加以同样类型的锁。因此，在多粒度封锁中一个数据对象可能以两种方式封锁，即：\n\
    \    - 显式封锁是应事务的要求直接加到数据对象上的封锁。\n    - 隐式封锁是该数据对象没有独立加锁，是由于其上级结点加锁而使该数据对象加上了锁。\n\
    \  - 在多粒度封锁方法中，显式封锁与隐式封锁的效果是一样的。\n\n### 多粒度封锁（3）\n\n- 多粒度封锁中存在的问题\n  - 在多粒度封锁方法中，一般对某个数据对象加锁，系统要做如下检查：\n\
    \    - 是否与该数据对象上的显式封锁冲突（检查对象本身）；\n    - 是否与该数据对象上的隐式封锁冲突（检查对象的所有上级结点）；\n    -\
    \ 是否与该数据对象下级的显式封锁冲突（检查其所有下级结点）。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_397_0.png)\n"
