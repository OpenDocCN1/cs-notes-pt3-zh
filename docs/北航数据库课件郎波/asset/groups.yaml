    +   - 一个联系转换为一个关系模式。与该联系相连的各实体的码以及联系的属性转换为关系的属性：

    +     - 若联系为1：1，则每个关系的码均是该关系的候选码；

    +     - 若联系为1：n，则该关系的码是n端实体的码；

    +     - 若联系为n：m，则该关系的码是诸实体码的组合。

    +   - 三个或三个以上实体间的多元联系，转换为一个关系模式，与该多元联系相连的各实体的码以及联系的属性转换为关系的属性，而关系的码为各实体码的组合。

    +   - 具有相同码的关系可以合并。'
  md: "\n## E-R图（2）\n\n- 同一个实体集内部各实体之间也可以存在一对一、一对多、多对多的联系。（a）\n- 三个或多个实体型间可能具有联系。（b）\n\
    - 两个实体型之间可具有多种联系。（c）\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_192_0.png)\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_192_1.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_192_2.png)\n\
    \n## E-R图（3）\n\nE-R图实体之间联系的语义扩充\n\n### （1）存在依赖\n\n### （2）标识依赖\n\n### （3）实体的子类\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_193_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_193_1.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_193_2.png)\n\n子女实体存在依赖于职工实体的存在，则称子女实体是弱实体。\n\
    \n如果实体不能由它自己的属性来唯一标识，而必须通过与它相联系的另一实体一起来标识，那么称该实体标识依赖于另一个实体。\n\n- 子类可继承父类的属性，子类也可以附加某些属性；\n\
    - 子类之间的交不一定为空。\n\n## 概念结构设计方法\n\n- 设计概念结构通常有四类方法：\n- 自顶向下：首先定义全局概念结构的框架，然后逐步细化。\n\
    - 自底向上：首先定义各局部应用的概念结构，然后将其集成起来。\n- 逐步扩张：首先定义核心概念结构，然后向外扩充。\n- 混合策略：自顶向下设计全局概念框架，自底向上设计各局部概念结构。\n\
    - 最常用的方法是自底向上方法\n\n## 概念结构设计方法\n\n- 自底向上法\n  - 自顶向下进行需求分析；\n  - 自底向上设计概念结构。\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_195_0.png)\n\n## 基于E-R法的概念模型设计\n\n基于E-R法的概念模式自底向上的设计方法分为两个阶段：\n\
    \n- 数据抽象与局部E-R图设计\n- 综合局部E-R图形成总E-R图\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_196_0.png)\n\
    \n## 局部E-R图设计（1）\n\n- 局部E-R图具体设计方法：\n  - 选择局部应用；\n  - 以需求分析中得到的数据元素表为基础，建立实体模型；\n\
    \  - 确定实体之间的联系类型，用E-R图表示这些实体与实体之间的联系，形成分E-R图。\n\n## 局部E-R图设计（2）\n\n- 建立实体模型的关鍵是确定实体及其属性\n\
    - 实体模型的建立方法：\n  - 对数据字典进行初步抽象，得到实体和属性，然后再按原则进行必要调整\n\n## 实体模型的调整原则（2）\n\n- 属性不能与其他实体具有联系，即ER图中所表示的联系是实体之间的联系\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_201_0.png)\n\n## 生产部门的局部E-R图\n\n##\
    \ 供应部门的局部E-R图\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_203_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_203_1.png)\n\
    \n## 集成局部E-R图的步骤\n\n- 合并\n  - 解决各分E-R图之间的冲突，将各分E-R图合并起来生成初步E-R图。\n- 修改和重构\n  -\
    \ 消除不必要的冗余，生成基本E-R图。\n\n## 局部E-R图的合并（1）\n\n- 消除冲突，合并分E-R图，生成初步E-R图。\n- 冲突主要包括：属性冲突、命名冲突和结构冲突\n\
    \n- （1）属性冲突：属性的类型、取值范围或取值集合不同，或属性取值单位冲突。\n  解决——讨论协商解决。\n\n- （2）命名冲突：包括属性名、实体名、联系名之间的同名异义，异名同义。\n\
    \  - 同名异义：不同意义的对象具有相同的名字。\n  - 异名同义：相同意义的对象具有不同名字。\n  解决——建立命名表，统一命名，异名同义的名字可标为别名。\n\
    \n## 局部E-R图的合并（2）\n\n### (3) 结构冲突：\n\n- 同一对象在不同应用中有不同抽象。如在一应用中为实体，在另一应用中为属性。\n\
    \  \n  解决——遵守实体与属性的划分原则，把属性变为实体或实体变为属性，使同一对象具有相同的抽象。\n\n- 同一实体在不同分E-R图中属性个数、次序不同。\n\
    \  \n  解决——同一实体的属性通常取分E-R图中属性的并，再适当调整次序。\n\n- 实体之间的联系在不同分E-R图中呈现不同类型。\n  \n  解决——根据语义加以综合或调整。\n\
