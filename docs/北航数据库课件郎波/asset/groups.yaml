    # 并发控制的必要性


    +   - 例：假设存款余额 X=1000 元，事务甲取走 300 元，事务乙取走 200 元，存款余额最终更新后应该是 X=500 元。


    | 时间 | 事务甲 | 事务乙 |

    |---|---|---|

    | … | … | … |

    | t₁ | 读 X（1000） | … |

    | … | … | … |

    | t₂ | … | 读 X（1000） |

    | … | … | … |

    | t₃ | 更新：X=X-300（700） | … |

    | … | … | 更新：X=X-200（800） |


    错误'
