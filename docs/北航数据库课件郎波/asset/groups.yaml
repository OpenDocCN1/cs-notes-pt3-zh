    \n## 分布式数据库管理系统DDBMS\n\n• DDBMS的组成\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_468_0.png)\n\
    \n## DDBMS的组成\n\n- LDBMS(局部场地上的数据库管理系统)\n  - 功能：建立和管理局部数据库，提供场地自治能力，执行局部应用及全局查询的子查询。\n\
    - GDBMS（全局数据库管理系统）\n  - 功能：提供分布透明性，协调全局事务的执行，协调各局部DBMS以完成全局应用，并保证数据库的全局一致性，执行并发控制，实现更新同步，提供全局恢复功能。\n\
    - GDD（全局数据字典）\n  - 存放全局概念模式、分片模式、分布模式的定义以及各模式之间映射的定义。\n  - 存放有关用户存取权限的定义，以保证全局用户的合法权限和数据库的安全性。\n\
