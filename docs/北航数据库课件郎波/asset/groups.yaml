  - '[PAGE 108]


    # 域关系演算


    +   域关系演算类似于元组演算。不同的是公式中的变量是对应元组各个分量的域变量。


    +   域演算表达式的形式定义：

    +   { (x1x2...xk) | Φ ( x1, x2, ..., xk ) }，表示所有使Φ为真的那些 (x1, x2, ..., xk) 组成的元组集合，即表达了一个关系。


    其中：


    +   xi代表域变量，如果域变量前有“全称”(∀)或“存在”(∃)量词，则称其为约束域变量，否则称为自由域变量。


    +   Φ为域关系演算公式，由原子公式和运算符组成。'
  - '[PAGE 109]


    # 域演算公式的递归定义


    +   - 域演算有三种形式的原子命题函数或称原子公式：

    +     - $R(x_1, x_2, ..., x_k)$。$(x_1, x_2, ..., x_k)$是R的一个元组，$x_i$是域变量或常量。

    +     - $x_i \theta y_j$。域变量$x_i$与$y_j$之间满足比较关系$\theta$。

    +     - $x_i \theta c$或$c \theta x_i$。域变量$x_i$与常量$c$之间满足比较关系$\theta$。

    +   - 域演算与元组关系演算具有相同的运算符，相同的公式递归定义。'
