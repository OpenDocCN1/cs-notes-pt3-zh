    转换\n\n- 概念模型用于信息世界建模，是现实世界到信息世界的抽象，是用户和数据库设计人员进行交流的语言。\n- 数据模型用于机器世界，按计算机系统的观点对数据建模。\n\
    \n## 数据模型\n\n- 概念模型\n- 数据模型\n- 数据模型的分类\n\n## 概念模型\n\n- 概念模型基于信息世界的主要概念，具有较强的语义表达能力，能够方便、直接表达应用中的各种语义。\n\
    - 概念模型应该简单、清晰、易于理解。\n- 概念模型的最常用的表示方法：实体—联系方法（E-R）法。\n\n## 数据库中的数据模型\n\n- 数据模型是严格定义的概念的集合。这些概念精确地描述系统中数据的静态特性、动态特性和完整性约束。\n\
    - 数据模型的三要素：\n  - 数据结构\n  - 数据操作\n  - 完整性约束\n\n## 数据模型三要素——数据结构\n\n- 数据结构由描述数据对象以及对象之间联系的一组概念组成。包括：\n\
    \  - 描述对象的类型、内容、性质的概念，如关系模型中的域、属性等；\n  - 描述对象之间联系的概念，如关系模型中的关系。\n- 是数据模型静态特性的描述。\n\
    - 数据结构是刻画数据模型最重要的方面。通常按照数据结构的类型来命名数据模型。\n\n## 数据模型三要素——数据操作\n\n- 是对数据库中各种数据对象（型）的实例（值）允许执行的操作集合，包括操作及操作规则。数据模型要定义操作的确切含义、操作符号、操作规则及操作语言。\n\
    - 是数据模型的动态特性的描述。\n- 数据库主要有检索和更新（插、删、改）两大类操作。\n\n## 数据模型三要素——数据的约束条件\n\n- 是完整性规则的集合。完整性规则是给定的数据模型中数据及其联系所具有的制约和依存规则，用以保证数据的正确、相容。\n\
    \n- 完整约束条件包括：\n  - 符合这种数据模型所必须遵守的基本的通用的完整性约束条件；\n  - 针对具体数据的特定语义约束条件。\n\n## 数据模型的分类\n\
    \n- 当前公认的基本数据模型有三类：层次模型、网状模型、关系模型。\n- 各种数据类型之间的根本区别在于数据之间联系的表示方式不同：\n  - 层次模型：用“树结构”表示数据之间的联系；\n\
    \  - 网状模型：用“图结构”表示数据之间的联系\n  - 关系模型：用“二维表”表示数据之间的联系\n\n## 层次模型\n\n- 是数据库系统中最早出现的数据模型。\n\
    - 数据结构是有向树。节点代表实体型，连线表示两个实体型间的一对多联系。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_43_0.png)\n\
    \n**特征：**\n\n- 有且仅有一个结点没有双亲；\n- 其它结点有且仅有一个双亲。\n\n## 层次模型\n\n- 优点：\n  - 结构简单，易于实现。\n\
    - 缺点：\n  - 支持的联系种类太少，只支持二元一对多联系。\n  - 数据操纵不方便，子节点的存取只能通过父节点来进行。\n- 代表产品：\n  -\
    \ IBM的IMS数据库，1968年研制成功。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_44_0.png)\n\
    \n## 图状模型\n\n- 数据结构是有向图。节点代表实体型，连线表示两类实体型间的一对多联系。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_45_0.png)\n\
    \n- **特征：**\n  - 可有一个以上的结点没有双亲；\n  - 至少有一个结点有多于一个的双亲。\n\n## 网状模型\n\n- 特点：\n  -\
    \ 表达的联系种类丰富。\n  - 结构复杂。\n- DBTG报告：\n  - 1969年，由美国CODASYL（Conference On Data System\
    \ Language，数据系统语言协商会）下属的DBTG（Data Base Task Group）组提出，确立了网状数据库系统的概念、方法、技术。\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_46_0.png)\n\n## 关系模型\n\n- 用二维表格结构（关系）表示实体及实体之间的联系。\n\
    \n# 学生\n\n| 学号 | 姓名 | 年龄 | 系列 |\n|---|---|---|---|\n| s1 | A | 18 | CS |\n| s2\
    \ | B | 18 | CS |\n| s3 | C | 18 | MA |\n\n# 课程\n\n| 课号 | 课名 | 先行课号 |\n|---|---|---|\n\
    | c1 | aaa |  |\n| c2 | bbb | c1 |\n| c3 | ccc |  |\n\n# 学生选课\n\n| 学号 | 课号 | 成绩\
    \ |\n|---|---|---|\n| s1 | c1 | 80 |\n| s1 | c2 | 90 |\n| s2 | c1 | 95 |\n\n##\
    \ 关系模型\n\n- 特点\n  - 用关系描述实体及实体间的联系。这种描述一致性使数据结构大大简化，概念简单。\n  - 可直接表示多对多联系。\n \
    \ - 关系必须是规范化关系。即每个分量是不可分的数据项，或不许表中套表。\n  - 关系模型是建立在数学概念基础上，有较强的理论基础。\n- 关系数据库产品：\
    \ Oracle, SQL Server, MySQL等。\n\n## 数据库系统的结构\n\n- 数据库系统的体系结构上具有三级模式的结构特征。\n  -\
    \ 模式\n  - 外模式\n  - 内模式\n  - 两级映射\n- DBMS和DBA\n\n## 数据库系统三级模式结构 —外模式\n\n- 也称为子模式或用户模式。是个别用户的数据视图，即与某一应用有关的数据的逻辑表示。\n\
    \n- 通常是模式的子集。不同应用的外模式可以相互覆盖，一个应用只能启用一个外模式。\n\n- 数据库系统提供外模式描述语言（外模式DDL）定义外模式。外模式DDL和用户选用的程序设计语言具有相容的语法。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_52_0.png)\n\n## 数据库系统三级模式结构 —内模式\n\n\
    - 也称为存储模式，是数据在数据库系统内部的表示，即对数据的物理结构和存储方式的描述。\n- 内模式通常用内模式数据描述语言（内模式DDL）来描述和定义。\n\
    \n## 数据库系统三级模式结构 ——两级映象\n\n- 外模式/模式映象定义外模式与模式之间的对应关系。当模式改变时，外模式/模式映象做相应改变，可以保证外模式不变。——数据的逻辑独立性\n\
    - 模式/内模式映象定义数据逻辑结构与存储结构之间的对应关系。当内模式改变时，模式/内模式映象做相应修改，使得模式保持不变。——数据的物理独立性\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_54_0.png)\n"
