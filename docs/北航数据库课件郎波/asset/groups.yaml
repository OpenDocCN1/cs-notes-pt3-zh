  md: "\n## 数据库系统的安全性\n\n数据库的安全性是指保护数据库以防止不合法的使用所造成的数据泄漏、更改和破坏。它包括两个方面的含义：\n\n- 向授权用户提供可靠的信息服务。\n\
    - 拒绝非授权的对数据的存取访问请求，保证数据库管理下的数据的可用性、完整性和一致性，进而保护数据库所有者和使用者的合法权益。\n\n### 用户标识与鉴别\n\
    \n- 用户标识和认证是系统提供的最外层安全保护措施。\n  - 标识是指系统采用一定的方式标识其用户或应用程序的名字或身份。\n  - 认证是指系统在用户或应用程序登录时判断其是否为合法的授权用户。\n\
    \  - 常用的方法是采用用户名和口令。\n\n### 存取控制\n\n- 存取控制确保合法用户按照指定的权限使用DBMS和访问数据，而非法用户或不具有相关权限的用户则不能。\n\
    - 存取控制机制主要包括两个部分：\n  - 用户权限定义：将用户权限记录到数据字典中，形成安全规则或授权规则。\n  - 合法权限检查，每当用户发出数据库操作请求后，DBMS根据数据字典中的安全规则进行合法权限检查，决定是否接受用户的操作请求。\n\
    \  - 用户权限定义和合法权限检查机制一起组成了DBMS的安全子系统。\n\n### 存取控制方法分类\n\n- 自主存取控制(discretionary\
    \ access control, 简称DAC)\n  - 用户对于不同的数据对象拥有不同的存取权限，不同的用户对同一对象也有不同的权限，而且用户还可以将其拥有的权限转授给其他用户。\n\
    - 强制存取控制(mandatory access control, 简称MAC)\n  - 每一个数据对象被标以一定的密级，每一个用户也被授予某一个级别的许可证。对于任何一个对象，只有具有合法许可证的用户才可以存取。\n\
    \n### 自主存取控制\n\n系统根据预先定义好的用户权限进行存取控制。用户权限是指不同的用户对于不同的数据对象允许执行的操作权限，由数据对象和操作类型两个要素组成。\n\
    \n| 类别 | 数据对象 | 操作类型 |\n|---|---|---|\n| 模式 | 模式 | 建立、修改、检索 |\n|  | 外模式 | 建立、修改、检索\
    \ |\n|  | 内模式 | 建立、修改、检索 |\n| 数据 | 表 | 查找、插入、删除、修改 |\n|  | 属性列 | 查找、插入、删除、修改 |\n\
    \n对于用户存取权限的定义称为授权。在授权中应指明：用户名，数据对象名，允许的操作类型。\n\n### SQL 的数据安全性控制\n\n- 在SQL中可以授予用户两类权限：\n\
    \  - 用户级权限\n    - 是数据库管理员为每个用户授予的特定权限。这种权限与整个数据库相关，与数据库中具体的关系无关。这种权限是对用户使用整个数据库的权限的限定。\n\
    \  - 关系级权限\n    - 是数据库管理员或数据库对象的拥有者为用户授予的与关系或视图有关的权限。这种权限是对用户使用关系和视图的权限的限定。\n\n\
    ### 角色与用户组\n\n- 为了管理数据库特权的方便，数据库还支持角色和用户组的概念。\n  - 角色是一组权限的集合，可以把它授予用户或其他角色。当把某个角色授予用户（或角色）或从用户（或角色）处撤回时，就同时授予或收回了该角色代表的全部权限。\n\
    \  - 用户组是一组具有相同特性用户的集合。在授权或收回权限时，可以以用户组为单位进行。\n\n### 用户级权限与角色的授予与收回\n\n在SQL语言中，通过Grant语句授予用户用户级权限或角色，其语法格式：\n\
    \n```sql\nGrant <用户级权限>|<角色> [{,<用户级权限>|<角色>}]\nTo <用户名>|<角色>|public [{,<用户名>|<角色>}]\n\
    [With Grant Option]\n```\n\n- `public`：数据库中的全部用户\n- `With Grant Option`：允许被授权的用户将指定的用户级权限或角色授予其他用户\n\
    \n当要取消一个用户或角色的权限时，可以使用REVOKE语句将其收回：\n\n```sql\nRevoke <用户级权限>|<角色> [{,<用户级权限>|<角色>}]\n\
    From <用户名>|<角色>|public [{,<用户名>|<角色>}]\n```\n\n### 示例\n\n- 为用户授予用户级权限\n  - `Grant\
    \ Create Session to SCOTT;`\n- 将权限授予角色\n  - `Grant Create table to Student_role;`\n\
    - 取消用户SCOTT的Create Table权限。\n  - `Revoke Create Table From SCOTT;`\n\n### 关系级权限的授予与收回\n\
    \n- DBA和数据库对象所有者将这些数据库对象上的部分或全部权限授予其他用户。语法格式为：\n\n```sql\nGrant ALL|<权限> [{,<权限>}]\n\
    On <表名>|<视图名> [{,<表名>|<视图名>}]\nTo {<用户> [{,<用户>}]}|public\n[With Grant Option]\n\
    ```\n\n- 回收权限：\n\n```sql\nRevoke ALL|<表级权限> [{,<表级权限>}]\nOn <表名>|<视图名> [{,<表名>|<视图名>}]\n\
    From {<用户>[{,<用户>}]|PUBLIC}\n```\n\n  - 收回权限时，若该用户已将权限授予其它用户，则也一并收回。\n\n### 示例\n\
    \n- 授予用户Liming在Student表上的Select和Insert权限。\n\n```sql\nGrant Select, Insert On Student\n\
    To Liming\nWith Grant Option;\n```\n\n- 将Student表上的全部权限授予全体用户。\n\n```sql\nGrant\
    \ ALL On Student To PUBLIC;\n```\n\n- 收回Liming对Student表的全部权限\n\n```sql\nRevoke\
    \ ALL On Student From Liming;\n```\n\n### 强制存取方法\n\n- 在MAC中，DBMS所管理的全部实体被分为主体和客体两类。\n\
    \  - 主体是系统中的活动实体，既包括DBMS所管理的实际用户，也包括代表用户的各进程。\n  - 客体是系统中的被动实体，是受主体操纵的，包括文件、基本表、索引、视图等。\n\
    - 对于主体和客体，DBMS为它们每个实例指定一个敏感度标记(Label)。敏感度标记被分为若干级别，如绝密、机密、秘密、公开等。主体的敏感度标记称为许可证级别，客体的敏感度标记称为密级。\n\
    - MAC控制通过对比主体的Label和客体的Label，最终确定主体是否能够存取客体。\n- 当某一主体以某一许可证级别注册入系统时，系统要求他对任何客体的存取必须遵循如下规则：\n\
    \  - 仅当主体的许可证级别大于或等于客体的密级时，该主体才能读取相应的客体；\n  - 仅当主体的许可证级别等于客体的密级时，该主体才能写相应的客体。\n\
    \n### 数据安全性控制的其它方法（1）\n\n- 视图机制\n  - 为不同的用户定义不同的视图，可以将用户对数据访问限制在一定的范围内。\n  - 例：限制王平只能检索Student表中计算机系学生的学号和姓名。\n\
    \n    ```sql\n    Create View CS_Student\n    As Select Sno, Sname From Student\n\
    \    Where Sdept = 'CS';\n    Grant Select On CS_Student To Wangping;\n    ```\n\
    \n### 安全数据库体系结构示例\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_432_0.png)\n\n###\
    \ 可信计算机系统评测标准\n\n- TCSEC（Trusted Computer System Evaluation Criteria）\n  - 1985年，美国国防部制定了可信计算机评估标准\
    \ TCSEC\n- TDI/TCSEC\n  - 1991年4月，美国国家计算机安全中心NCSC发布《可信计算机系统评估标准关于数据库系统的解释TDI（Trusted\
    \ Database Interpretation）》，将TCSEC扩展到数据库管理系统；\n- TDI与TCSEC从安全策略、责任、保证、文档四个方面描述了安全级别划分的指标。\n\
    \n| 序号 | 安全性等级 | 级别 | 主要特征 |\n|---|---|---|---|\n| 1 | D（最低保护等级） | D | 非安全保护 |\n\
    | 2 | C（自主保护等级） | C1（自主安全保护） | 自主存取控制、审计功能 |\n|  | C（自主保护等级） | C2（可控存取保护） | 比C1级更强的自主存取控制、审计功能\
    \ |\n| 3 | B（强制保护等级） | B1（标记安全保护） | 强制存取控制，敏感度标记 |\n|  | B（强制保护等级） | B2（可结构化保护）\
    \ | 形式化模型，隐藏通道约束 |\n|  | B（强制保护等级） | B3（安全区域保护） | 安全内核，高抗渗透能力 |\n| 4 | A（验证保护等级）\
    \ | A1（可验证保护） | 形式化安全验证，隐藏通道分析 |\n|  | A（验证保护等级） | 超A1 |  |\n"
