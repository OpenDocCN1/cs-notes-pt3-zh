    \ | 1t (10^-3 s) |\n\n- Different query strategies differ greatly in communication\
    \ time, so optimization is necessary.\n- In some strategies, both data transmission\
    \ time and transmission delay must be considered, while in other strategies the\
    \ main consideration is transmission delay (such as the query-reply approach),\
    \ and in still other strategies the data transmission volume is large, so the\
    \ main consideration is transmission time.\n\n## Problems to be solved in query\
    \ processing and optimization\n\n- In a distributed database system, queries can\
    \ be divided into three categories: local queries, remote queries, and global\
    \ queries.\n  - Local queries and remote queries involve data at a single node\
    \ (local or remote) and can be handled using centralized database processing techniques;\n\
    \  - Global queries involve data at multiple nodes and are very complex.\n\n-\
    \ To execute global queries and determine a good query strategy, many judgments\
    \ and computations are needed.\n  - Query decomposition\n    - Decompose the global\
    \ query into several subqueries, each involving data at only one node and processable\
    \ by the local DBMS. It is necessary to select those nodes (physical fragments)\
    \ with the lowest query cost.\n  - Choosing the order of operation execution\n\
    \    - Mainly determines the order of joins and union operations involving relations\
    \ at different nodes.\n  - Choosing the method of operation execution\n    - Includes\
    \ selecting access paths, the algorithm for a certain operation, and the execution\
    \ method for joins.\n\n## Goals of query optimization\n\n- The choice of query\
    \ processing strategy is based on the expected cost of executing the query.\n\
    \  - Query execution cost: I/O cost + CPU cost + communication cost\n  - Distributed\
    \ queries can be divided into distributed optimization of access strategies and\
    \ local optimization. Among them, distributed optimization of access strategies\
    \ is more important.\n- Communication cost is computable and is usually a function\
    \ of data transmission volume:\n  TC(X) = C0 + X*C1\n  X is the data transmission\
    \ volume, C0 is the overhead of initializing one transmission between two nodes,\
    \ and C1 is the transmission rate, i.e., the time spent transmitting a unit of\
    \ data.\n- In distributed database query optimization, \"communication cost\"\
    \ is studied as the primary factor. Therefore, the primary goal of query optimization\
    \ is to minimize the communication cost during query execution.\n- Join operations\
    \ and union operations between different nodes are the main causes of data transmission,\
    \ so the optimization of join queries is an important research topic in optimization.\n\
    \n## Optimization of join queries\n\n- Semijoin: Use semijoins to reduce relations\
    \ (or fragments) and thereby save transmission overhead.\n\n- Definition of semijoin:\
    \ R ⋉ₐ=ʙ S = R ⋈ₐ=ʙ (Πʙ (S))\n\nExample:\n\n### R1\n\n| A | B |\n| --- | --- |\n\
    | a1 | b1 |\n| a2 | b1 |\n| a2 | b3 |\n| a2 | b4 |\n| a3 | b3 |\n\n⋈\n\n### R2\n\
    \n| B | C |\n| --- | --- |\n| b1 | c1 |\n| b2 | c2 |\n| b5 | c1 |\n| b5 | c2 |\n\
    | b6 | c4 |\n| b7 | c2 |\n| b8 | c3 |\n\n=\n\n### R1 ⋈ R2\n\n| A | B |\n| ---\
    \ | --- |\n| a1 | b1 |\n| a2 | b1 |\n\n- According to the definition of semijoin,\
    \ we have\n- R ⋈ₐ=ʙ S = (R ⋈ₐ=ʙ S) ⋈ₐ=ʙ S = (R ⋈ₐ=ʙ Π_B (S) ) ⋈ₐ=ʙ S\n\n- Application\
    \ of semijoins in query optimization\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_487_0.png)\n\
    \n- Communication cost when using semijoin:\n- C_SJ = 2C0 + C1 * (size(B) * card(Π_B(S))\
    \ + size(R) * card(R'))\n\n- Communication cost when not using semijoin:\n- C_JN\
    \ = C0 + C1 * size(R) * card(R)\n\n- When the number of tuples in R participating\
    \ in the join is sufficiently small, using the semijoin strategy is advantageous.\
    \ 41\n\n## Distributed transaction processing\n\n- Atomicity and serializability\
    \ of distributed transactions\n  - In a distributed database system, a global\
    \ transaction is divided into subtransactions on many nodes. The atomicity of\
    \ a distributed transaction means that all subtransactions composing the transaction\
    \ must either all commit consistently or all roll back consistently.\n  - In multi-user\
    \ systems, the serializability of distributed transactions must also be guaranteed.\n\
    - Distributed transaction management mainly includes: transaction recovery and\
    \ concurrency control.\n\n## Recovery of distributed transactions\n\n- Each site\
    \ has a local transaction manager, responsible for managing the execution of local\
    \ subtransactions. At the same time, all local transaction managers must coordinate\
    \ with each other to ensure the atomicity of distributed transactions: all subtransactions\
    \ must either commit or roll back.\n- The most commonly used technique for coordinating\
    \ local transaction managers to ensure the atomicity of distributed transactions\
    \ is the two-phase commit protocol (2-Phase-Commitment Protocol).\n\n## Two-Phase\
    \ Commit Protocol (1)\n\n- The two-phase commit protocol divides all local transaction\
    \ managers of a distributed transaction into two categories: a coordinator (one)\
    \ and participants.\n  - Coordinator: responsible for making the final decision\
    \ on whether the transaction commits or aborts.\n  - Participants: responsible\
    \ for managing the execution of the corresponding subtransactions and performing\
    \ write operations on their respective local databases.\n\n## Two-Phase Commit\
    \ Protocol (2)\n\n- Contents of the two-phase commit protocol\n  - Phase 1: The\
    \ coordinator solicits opinions and makes a decision\n    - The coordinator sends\
    \ a \"prepare to commit\" message to all participants and records it in the log;\
    \ if a participant is ready to commit, it replies \"ready\", otherwise it replies\
    \ \"abort\", and records it in the log.\n    - If the coordinator receives \"\
    ready\" messages from all participants within the specified time, it makes a \"\
    commit\" decision; otherwise, it makes an \"abort\" decision.\n  - Phase 2: Participants\
    \ execute the decision\n    - The coordinator writes the relevant decision to\
    \ the log, then sends this decision to all participants.\n    - After receiving\
    \ the command, all participants first record the information \"received commit/abort\
    \ decision\" in the log, then send a response message to the coordinator, and\
    \ finally execute the corresponding decision.\n    - After the coordinator receives\
    \ the response messages from all participants, the execution of a transaction\
    \ ends. The relevant log information can be saved offline.\n- With the two-phase\
    \ commit protocol, if the system fails, each site uses its relevant log for transaction\
    \ recovery.\n\n## Concurrency Control (2)\n\n- Further strategies for concurrency\
    \ control in distributed database systems:\n  - Several feasible methods for handling\
    \ multi-copy locking:\n    - For write operations, X locks must be requested on\
    \ all copies; for read operations, it is sufficient to request an S lock on one\
    \ copy.\n    - For both write and read operations, X locks or S locks must be\
    \ requested on the majority of copies.\n    - Designate the copy on a certain\
    \ site as the primary copy, and all read and write operations request locking\
    \ on the primary copy.\n  - Solving global deadlock (deadlock occurring at two\
    \ or more sites)\n    - Deadlock detection and resolution methods\n    - Deadlock\
    \ prevention, such as sorting transactions according to a certain criterion and\
    \ only allowing transactions to wait one-way in this order.\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_493_0.png)\n"
