    \    - F1只有E1的属性，F2有E1和E2的属性：σ_F(E1 × E2) ≡ σ_{F2}(σ_{F1}(E1) × E2)\n  - 选择与并的分配律\n\
    \n    \\[\n    \\sigma_F(E_1 \\cup E_2)=\\sigma_F(E_1)\\cup\\sigma_F(E_2)\n  \
    \  \\]\n\n  - 选择与差的分配律\n\n    \\[\n    \\sigma_F(E_1-E_2)=\\sigma_F(E_1)-\\sigma_F(E_2)\n\
    \    \\]\n\n  - 选择对自然连接的分配律\n\n    \\[\n    \\sigma_F(E_1\\bowtie E_2)=\\sigma_F(E_1)\\\
    bowtie\\sigma_F(E_2)\n    \\]\n\n  - 投影与笛卡尔积的分配律\n\n    \\[\n    \\pi_{A_1,A_2,\\\
    ldots,A_n,B_1,B_2,\\ldots,B_m}(E_1\\times E_2)=\\pi_{A_1,A_2,\\ldots,A_n}(E_1)\\\
    times\\pi_{B_1,B_2,\\ldots,B_m}(E_2)\n    \\]\n\n  - 投影与并的分配律\n\n    \\[\n   \
    \ \\pi_{A_1,A_2,\\ldots,A_n}(E_1\\cup E_2)=\\pi_{A_1,A_2,\\ldots,A_n}(E_1)\\cup\\\
    pi_{A_1,A_2,\\ldots,A_n}(E_2)\n    \\]\n\n### 代数优化（2）\n\n- 查询树的启发式优化（优化的一般准则）\n\
    \  - 选择运算尽可能先做。是优化策略中最重要、最基本的一条。\n  - 把投影运算和选择运算同时进行。\n  - 把投影同其前或其后的双目运算结合起来。\n\
    \  - 把某些选择同在它前面要执行的笛卡尔积结合起来成为一个连接运算。\n  - 找出公共子表达式，把公共子表达式的结果写入中间文件，重复使用。\n\n\
    ### 物理优化\n\n- 选择高效合理的操作算法或存取路径，得到优化的查询计划。\n- 常用方法\n  - 基于规则的启发式优化方法\n  - 基于代价估算的优化方法\n\
    \  - 两者结合的优化方法\n\n### 实现查询操作的算法\n\n- **连接操作的实现算法示例**\n  - 嵌套循环法\n    - 两个连接的表，第一个表为外循环，另一个为内循环\n\
    \  - 排序-合并法\n    - 两个表都按照连接属性排序，取第一个表元组的连接属性与第二个表元组的连接属性比较\n  - 索引连接法\n    - 第二个表按照连接属性建立索引，取第一个表元组的连接属性与第二个表元组的连接属性比较\n\
    \  - Hash Join 法\n    - 连接属性作为 hash 码，用同一个 hash 函数把两个连接表的元组散列到各自的 hash 文件\n\n\
    ### 基于启发式规则的存取路径选择优化\n\n- 选择操作的启发式规则\n  - 对于小关系，使用全表顺序扫描。\n  - 对于大关系：可以采用索引扫描法（如果结果的元组数目较小），全表顺序扫描。\n\
    \n- 连接操作的启发式规则\n  - 如果两个表都已经按照连接属性排序——排序-合并法；\n  - 如果一个表在连接属性上有索引——索引连接法；\n  -\
    \ 如果连接属性上未排序且未建索引，且其中一个表较小——Hash Join 法；\n  - 最后可选用嵌套循环法，并选择较小的表为外循环表。\n\n## 第七章\
    \ 事务处理技术\n\n- 事务的概念\n- 数据库恢复技术\n- 并发控制技术\n\n### DBMS体系结构\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_350_0.png)\n\
    \n**Users:**\n\n- DBA Staff\n- Casual Users\n- Application Programmers\n- Parametric\
    \ Users\n\n- DDL Statements\n- Privileged Commands\n- Interactive Query\n- Application\
    \ Programs\n\n- DDL Compiler\n- Query Compiler\n- Precompiler\n- Host Language\
    \ Compiler\n- Query Optimizer\n- DML Compiler\n- Compiled Transactions\n- DBA\
    \ Commands, Queries, and Transactions\n- Runtime Database Processor\n- System\
    \ Catalog/ Data Dictionary\n- Concurrency Control / Backup/Recovery Subsystems\n\
    - Stored Data Manager\n- Stored Database\n- Input/Output from Database\n- Query\
    \ and Transaction Execution\n\n### 事务的定义\n\n事务(Transaction)是用户定义的数据库操作序列，这些操作要么都做，要么都不做，是一个不可分割的工作单位。\n\
    \n- 事务与应用程序是两个概念，一般来说，一个应用程序可以包含多个事务。\n- 事务的开始与结束可以由用户显式控制。如果用户没有显式定义事务，则由DBMS按缺省规定自动划分事务。\n\
    \n### 事务的特性（1）\n\n- **原子性 (Atomicity)**\n  - 事务中包括的所有操作要么都做，要么都不做\n\n- **一致性 (Consistency)**\n\
    \  - 事务执行的结果必须是使数据库从一个一致性状态，变到另一个一致性的状态\n\n### 事务的特性（2）\n\n- **隔离性 (Isolation)**\n\
    \  - 一个事务的执行不能被其它事务干扰。即一个事务内部的操作及使用的数据对其他并发事务是隔离的，并发执行的各个事务之间不能互相干扰\n\n- **持久性\
    \ (Durability)**\n  - 一个事务一旦提交之后，它对数据库的影响必须是永久的。其它操作或故障不应该对其执行结果有任何影响\n\n"
