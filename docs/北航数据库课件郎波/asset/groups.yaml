    # 面向对象数据库产生背景


    +   - 对于数据结构异常复杂的某些应用领域，关系数据库显示出局限性。

    +   - 要求DBS能够处理更复杂的数据模型，能适度地演化，便于管理、构造与维护大量的持久数据，并能与大型复杂程序紧密结合。

