    # 关系代数—传统集合运算


    +   - 差（Difference）

    +     - 关系R和关系S的差记为R-S。结果仍为n元关系，由属于R而不属于S的元组构成。

    +     - R-S表达为R−S = {t | t∈R ∧ t∉S }


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_84_0.png)'
  - '[PAGE 85]


    # 关系代数—传统集合运算


    +   - 交（Intersection）

    +     - 关系R和关系S的交记为R∩S。结果仍为n元关系，由既属于R又属于S的元组构成。

    +     - R∩S表达为R∩S={ t | t∈R ∧ t∈S }


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_85_0.png)'
  - '[PAGE 86]


    # 关系代数—传统集合运算


    +   - 广义笛卡儿积

    +     - 两个关系 R, S, 其度分别为 n, m, 则它们的笛卡儿积是所有这样的元组集合：元组的前 n 个分量是 R 中的一个元组，后 m 个分量是
    S 中的一个元组。 R×S 的度为 (n+m)。

    +     若 R 有 k₁ 个元组，S 有 k₂ 个元组，则 R×S 有 k₁ ×k₂ 个元组。

    +     - R×S 表达为 R×S={ t | t=< r , s > ∧ r∈R ∧ s∈S }'
