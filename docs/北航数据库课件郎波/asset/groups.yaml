  - '[PAGE 340]


    # 代数优化（1）


    +   - 关系代数表达式等价变换规则

    +     - 连接、笛卡尔积交换律

    +       E₁ × E₂ ≡ E₂ × E₁

    +       E₁ ⋈ E₂ ≡ E₂ ⋈ E₁

    +       E₁ ⋈_F E₂ ≡ E₂ ⋈_F E₁

    +     - 连接、笛卡尔积的结合律

    +       (E₁ × E₂) × E₃ ≡ E₁ × (E₂ × E₃)

    +       (E₁ ⋈ E₂) ⋈ E₃ ≡ E₁ ⋈ (E₂ ⋈ E₃)

    +       (E₁ ⋈_F₁ E₂) ⋈_F₂ E₃ ≡ E₁ ⋈_F₁ (E₂ ⋈_F₂ E₃)'
  - '[PAGE 341]


    # 代数优化（1）


    +   - 投影的串接定律

    +     π_{A1,A2,...,An}(π_{B1,B2,...,Bm}(E)) ≡ π_{A1,A2,...,An}(E)

    +     其中{A1,A2,...,An}是{B1,B2,...,Bm}的子集

    +   - 选择的串接定律

    +     σ_{F1}(σ_{F2}(E)) ≡ σ_{F1∧F2}(E)

    +   - 选择与投影的交换律

    +     σ_F(π_{A1,A2,...,An}(E)) ≡ π_{A1,A2,...,An}(σ_F(E))

    +   - 选择与笛卡尔积交换律

    +     - F中只有E1的属性： σ_F(E1 × E2) ≡ σ_F(E1) × E2

    +     - F=F1∧F2，且F1只有E1的属性、F2中只有E2的属性： σ_F(E1 × E2) ≡ σ_{F1}(E1) × σ_{F2}(E2)

    +     - F1只有E1的属性，F2有E1和E2的属性： σ_F(E1 × E2) ≡ σ_{F2}(σ_{F1}(E1) × E2)'
  - '[PAGE 342]


    # 代数优化（1）


    +   - 选择与并的分配律

    +     \[

    +     \sigma_F(E_1 \cup E_2)=\sigma_F(E_1)\cup\sigma_F(E_2)

    +     \]


    +   - 选择与差的分配律

    +     \[

    +     \sigma_F(E_1-E_2)=\sigma_F(E_1)-\sigma_F(E_2)

