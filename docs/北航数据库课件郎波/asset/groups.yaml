    \ c2 |\n| a2 | b2 | c1 |\n\n**S**\n\n| A | B | C |\n|---|---|---|\n| a1 | b2 |\
    \ c2 |\n| a1 | b3 | c2 |\n| a2 | b2 | c1 |\n\n求：R∪S　　R-S　　R∩S　　R×S\n\n## 关系代数—专门的关系运算\n\
    \n- 选取或限制（Selection or Restriction）\n  - 定义：在关系R中选择满足给定条件的元组。记作： σ_F(R)={t | t\
    \ ∈ R , F(t) = ‘真’ }\n  - F是选择的条件，取逻辑值“真”或“假”。\n  - F由运算对象（属性名、常量、简单函数），运算符，包括算术比较符（>，≥，<，≤，=，≠）和逻辑运算符（∧，∨，¬）连接起来的表达式组成。\n\
