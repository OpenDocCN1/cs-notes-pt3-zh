  md: "\n## Armstrong公理完备性\n\n### 证明（2）\n\n| $X_F^+$ | $U - X_F^+$ |\n|---|---|\n\
    | t 11...1 | 00...0 |\n| s 11...1 | 11...1 |\n\n（1）设 V→W 是 F 中任一函数依赖，则有下列两种情况：\n\
    \n- a) V ⊆ $X_F^+$。因为 V ⊆ $X_F^+$，所以有 X→V；于是 X→W 成立，所以 W ⊆ $X_F^+$。因为 r 中 $X_F^+$\
    \ 的值全相等，所以 V→W 在 r 上成立。\n\n- b) V ⊈ $X_F^+$。如果 V 不完全属于 $X_F^+$，则 V 在两元组 t 和 s\
    \ 上的属性值必不相等，则 V→W 在 r 上成立。\n\n因此，在关系 r 中，F 的任一函数依赖都成立。\n\n### 证明（3）\n\n| $X_F^+$\
    \ | $U - X_F^+$ |\n|---|---|\n| t 11...1 | 00...0 |\n| s 11...1 | 11...1 |\n\n\
    （2）因为 X→Y 不能用公理从 F 推出，则 Y⊈$X_F^+$，而 X⊆$X_F^+$，那么 r 中元组 t,s 在 X 上的值相等，而在 Y 上的值不等，则\
    \ X→Y 在 r 上不成立。\n\n结论：凡不能用公理推出的函数依赖都不被 F 逻辑蕴涵，即凡是 F 逻辑蕴涵的函数依赖都能用 Armstrong 公理从\
    \ F 导出。\n— Armstrong 公理是完备的。\n\n## 闭包的计算\n\n### 求 $X_F^+$ 的算法\n\n```text\nInput:\
    \ X, F\nOutput: $X_F^+$\n$X_F^+ := X$;\ndo\n  for any $A \\subseteq X_F^+$ do\n\
    \    if 在F中存在函数依赖 $A \\rightarrow B$\n      then $X_F^+ = X_F^+ \\cup B$\nwhile\
    \ ( $X_F^+$ 发生变化且 $X_F^+ \\neq U$ )\n```\n\n### 示例（1）\n\n- 求 $X_F^+$ 的示例1：R<U,\
    \ F>, U = (A, B, C, D, E), F = {AB→C, B→D, C→E, CE→B, AC→B}, 计算 $(AB)_F^+$。\n\n\
    | 所用依赖 | $(AB)_F^+$ |\n|---|---|\n|  | AB |\n| AB→C | ABC |\n| B→D | ABCD |\n\
    | C→E | ABCDE |\n\n$(AB)_F^+ = ABCDE$\n\n### 示例（2）\n\n- 求 $X_F^+$ 的示例2：R<U, F>,\
    \ U = (A, B, C, G, H, I), F = {A→B, A→C, CG→H, CG→I, B→H}, 计算 $(AG)_F^+$。\n\n\
    | 所用依赖 | $(AG)_F^+$ |\n|---|---|\n|  | AG |\n| A→B | AGB |\n| A→C | AGBC |\n|\
    \ CG→H | AGBCH |\n| CG→I | AGBCHI |\n|  | $(AG)_F^+ = AGBCHI$ |\n\n### 示例（3）\n\
    \n- 示例3：R<U, F>, U = (A, B, C, D, E, G), F = {A→E, BE→AG, CE→A, G→D}, 计算 $(AB)_F^+$。\n\
    \n| 所用依赖 | $(AB)_F^+$ |\n|---|---|\n|  | AB |\n| A→E | ABE |\n| BE→AG | ABEG |\n\
    | G→D | ABEGD |\n\n$(AB)_F^+ = ABEGD$\n\n## 函数依赖集等价与覆盖\n\n- 函数依赖集等价\n  - 函数依赖集\
    \ F，G，若 $F^+ = G^+$，则称 F 与 G 等价。\n  - 如果 F 和 G 等价，则称 F 覆盖 G，同时 G 也覆盖 F。\n  - $F^+\
    \ = G^+ \\iff F \\subseteq G^+，G \\subseteq F^+$\n\n## 函数依赖集的最小依赖集\n\n- 最小依赖集\n\
    \  - 定义：若函数依赖集 F 满足下列条件，则称 F 为一个极小函数依赖集，也称为最小依赖集或最小覆盖：\n    - F 中任一函数依赖 X→A，A\
    \ 必是单属性。（右部单属性化）\n    - F 中不存在这样的函数依赖 X→A，使得 F 与 F−{X→A} 等价。（没有多余的 FD）\n    -\
    \ F 中不存在这样的函数依赖 X→A，在 X 中有其子集 Z，使得 F 与 F−{X→A}∪{Z→A} 等价。（每个 FD 左部没有多余属性）\n\n##\
    \ 函数依赖集 F 的极小化处理\n\n**定理：** 每个函数依赖集 F 均等价于一个极小函数依赖集 Fm，此 Fm 为 F 的最小依赖集。\n\n###\
    \ F 的极小化算法\n\n- 逐个检查 F 中各函数依赖 $FD_i$：X→Y，若 $Y=A_1A_2…A_k$，k≥2，则用 $\\{X→A_i | i=1,2,…,k\\\
    }$ 代替 X→Y。\n- 逐个检查 F 中各函数依赖 X→A，设 $X=B_1…B_m$，逐个考查 $B_i$，若 $A \\in (X−B_i)^+_F$，则以\
    \ $(X−B_i)$ 取代 X。直到 F 不再改变。\n- 逐个检查 F 中各函数依赖 X→A，令 G=F−{X→A}，若 $A \\in (X)^+_G$，则从\
    \ F 中去掉该函数依赖，直到 F 不再改变。\n\n### 示例\n\n- 示例1\n\nF = {A→B，B→A，A→C，B→C}，求 Fm。\n\n\
    Fm = {A→B，B→A，B→C}\n\n或者\n\nFm = {A→B，B→A，A→C}\n\n- 示例2\n\nF = {C→A，A→G，CG→B，B→A}，求\
    \ Fm。\n\nFm = {A→G，C→B，B→A}\n\n## 范式的概念（1）\n\n- 如果一个关系满足某个指定的约束集，则称它属于某种特定的范式（Normal\
    \ Form）；\n- 满足最低要求约束的称为第一范式，简称为 1NF，当一个关系只包含原子值这一约束时，称为 1NF。原子值即为二维表的每一行和列的交叉位置上总是精确地存在一个值，而不是值集。也就是说不能“表中有表”；\n\
    - 满足“原子值”这一约束条件的关系称为规范化关系，简称为范式。在关系数据库中，都是规范化的关系。\n\n## 范式的概念（2）\n\n- 范式理论的发展过程：\n\
    \  - 1971-1972 CODD 系统提出 1NF，2NF，3NF 的概念，讨论了进一步规范化的问题。\n  - 1974- CODD 和 BOYCE\
    \ 提出 BCNF。\n  - 1976- FAGIN 提出 4NF，后来又提出了“投影-连接范式”PJNF，也称 5NF。\n\n- 各级范式间的联系：\n\
    \  $1NF \\supset 2NF \\supset 3NF \\supset BCNF \\supset 4NF \\supset 5NF$\n\n\
    - 一个低一级范式的关系模式，通过模式分解可以转换为若干个高级范式的关系模式的集合，这一过程称作规范化。\n\n## 2NF（1）\n\n- 定义：若 R∈1NF，且每个非主属性完全依赖于码，则称\
    \ R∈2NF；\n- 注意：\n  - 如果关系 R 的全体属性都是 R 的主属性，那么 R∈2NF；\n  - 从 1NF 中消除非主属性对码的部分函数依赖，则可获得\
    \ 2NF 关系；\n  - 在 2NF 中，允许主属性部分函数依赖于码。\n\n## 2NF（2）\n\n- 2NF 的规范化\n  - 把 1NF 关系模式规范提高到\
    \ 2NF 关系模式的集合。\n\n例：关系 UN（S#，CN，G，SDN，MN）∈1NF，其属性之间的函数依赖关系，用函数依赖图表示：\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_278_0.png)\n\
    \n所以 UN ∉ 2NF。\n\n## 2NF（3）\n\n- 采取投影分解方法，消除 UN 中的非主属性对码的部分函数依赖。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_279_0.png)\n\
    \nUN → { SG=UN[S#, CN, G] ∈2NF，SDM=UN[S#, SDN, MN] ∈2NF }\n\n## 2NF（4）\n\n- 2NF\
    \ 存在的弊病\n  - SG=UN[S#, CN, G] ∈2NF\n  - SDM=UN[S#, SDN, MN] ∈2NF\n- 插入异常有所改善，但还是存在：如果系中没有学生，则有关系的信息就无法插入。\n\
    - 删除异常：如果删除学生的信息，所在系的信息也随之删除了。\n- 数据冗余得到一定改善：每个学生都存储了所在系的系主任的信息。\n\n## 3NF（1）\n\
    \n- 定义：关系模式 R<U, F> 中，若不存在这样的码 X，属性组 Y 及非主属性 Z（Z⊄Y），使得下式成立：X→Y，Y→Z，Y 不函数依赖于 X，则称\
    \ R∈3NF。\n- 或定义为：\n  - 若关系模式 R∈2NF，且每个非主属性都不传递依赖于 R 的任何码，则 R∈3NF。\n\n## 3NF（2）\n\
    \n- 3NF 规范化\n\nUN → { SG=UN[S#, CN, G] ∈2NF，SDM=UN[S#, SDN, MN] ∈2NF }\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_282_0.png)\n\
    \nSG ∈3NF\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_282_1.png)\n\nSDM ∉ 3NF\n"
