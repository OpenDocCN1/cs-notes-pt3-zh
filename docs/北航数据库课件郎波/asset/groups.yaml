  - '[PAGE 271]


    # 函数依赖集等价与覆盖


    +   - 函数依赖集等价

    +     - 函数依赖集 F，G，若 F⁺ = G⁺，则称 F 与 G 等价。

    +     - 如果 F 和 G 等价，则称 F 覆盖 G，同时 G 也覆盖 F。

