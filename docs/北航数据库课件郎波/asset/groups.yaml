    \n## 关系代数—传统集合运算\n\n- 广义笛卡儿积\n  - 两个关系 R, S, 其度分别为 n, m, 则它们的笛卡儿积是所有这样的元组集合：元组的前\
    \ n 个分量是 R 中的一个元组，后 m 个分量是 S 中的一个元组。 R×S 的度为 (n+m)。\n  - 若 R 有 k₁ 个元组，S 有 k₂ 个元组，则\
