  - '[PAGE 408]


    # 事务并发调度的正确性


    +   - 对并发事务中操作的调度是随机的，而不同的调度可能产生不同的结果，但调度要保证事务执行的正确性

    +   - 事务执行正确性的含义

    +     - 一个事务正常的或者预想的结果是没有其它并发事务干扰时得到的结果。因此一组事务的串行调度兼略一定是正确的调度兼略。

    +     - 虽然不同的串行顺序的结果会不同，由于各种结果都将保持数据库数据的一致性，所以都是正确的。'
  - '[PAGE 409]


    # 并发调度的可串行性


    +   - **可串行化**

    +     - 多个事务的并发执行是正确的，当且仅当其结果与按某一次序串行执行它们时的结果相同，我们称这种调度策略为可串行化调度。


    +   - **可串行性是并行事务正确性的准则**

    +     - 一个给定的并发调度，而且仅当它是可串行化的，才认为是正确调度。'
  - '[PAGE 410]


    # 可串行化调度的判定


    +   - 可串行化调度判定的充分条件

    +     - 一个调度Sc在保证冲突操作次序不变的情况下，可以通过交换两个事务不冲突操作的次序，得到另一个串行调度Sc’，则调度Sc为冲突可串行化调度。

    +       - 冲突操作

    +         冲突操作是不同事务对同一数据的读-写操作以及写-写操作。表示为：

    +         事务Ti读x，Tj写x —— Ri(x)与Wj(x)

    +         事务Ti写x，Tj写x —— Wi(x)与Wj(x)

    +       - 不同事务的冲突操作与同一个事务的两个操作不能交换。

    +     - 一个冲突可串行化调度，一定是可串行化调度。'
