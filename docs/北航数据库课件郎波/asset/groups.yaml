    ```\n\n- 回收权限：\n\n```sql\nRevoke ALL|<表级权限> [{,<表级权限>}]\nOn <表名>|<视图名> [{,<表名>|<视图名>}]\n\
    From {<用户>[{,<用户>}]|PUBLIC}\n```\n\n  - 收回权限时，若该用户已将权限授予其它用户，则也一并收回。\n\n### 示例\n\
    \n- 授予用户Liming在Student表上的Select和Insert权限。\n\n```sql\nGrant Select, Insert On Student\n\
    To Liming\nWith Grant Option;\n```\n\n- 将Student表上的全部权限授予全体用户。\n\n```sql\nGrant\
    \ ALL On Student To PUBLIC;\n```\n\n- 收回Liming对Student表的全部权限\n\n```sql\nRevoke\
    \ ALL On Student From Liming;\n```\n\n### 强制存取方法\n\n- 在MAC中，DBMS所管理的全部实体被分为主体和客体两类。\n\
    \  - 主体是系统中的活动实体，既包括DBMS所管理的实际用户，也包括代表用户的各进程。\n  - 客体是系统中的被动实体，是受主体操纵的，包括文件、基本表、索引、视图等。\n\
    - 对于主体和客体，DBMS为它们每个实例指定一个敏感度标记(Label)。敏感度标记被分为若干级别，如绝密、机密、秘密、公开等。主体的敏感度标记称为许可证级别，客体的敏感度标记称为密级。\n\
    - MAC控制通过对比主体的Label和客体的Label，最终确定主体是否能够存取客体。\n- 当某一主体以某一许可证级别注册入系统时，系统要求他对任何客体的存取必须遵循如下规则：\n\
    \  - 仅当主体的许可证级别大于或等于客体的密级时，该主体才能读取相应的客体；\n  - 仅当主体的许可证级别等于客体的密级时，该主体才能写相应的客体。\n\
    \n### 数据安全性控制的其它方法（1）\n\n- 视图机制\n  - 为不同的用户定义不同的视图，可以将用户对数据访问限制在一定的范围内。\n  - 例：限制王平只能检索Student表中计算机系学生的学号和姓名。\n\
    \n    ```sql\n    Create View CS_Student\n    As Select Sno, Sname From Student\n\
    \    Where Sdept = 'CS';\n    Grant Select On CS_Student To Wangping;\n    ```\n\
    \n### 安全数据库体系结构示例\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_432_0.png)\n\n###\
    \ 可信计算机系统评测标准\n\n- TCSEC（Trusted Computer System Evaluation Criteria）\n  - 1985年，美国国防部制定了可信计算机评估标准\
    \ TCSEC\n- TDI/TCSEC\n  - 1991年4月，美国国家计算机安全中心NCSC发布《可信计算机系统评估标准关于数据库系统的解释TDI（Trusted\
    \ Database Interpretation）》，将TCSEC扩展到数据库管理系统；\n- TDI与TCSEC从安全策略、责任、保证、文档四个方面描述了安全级别划分的指标。\n\
    \n| 序号 | 安全性等级 | 级别 | 主要特征 |\n|---|---|---|---|\n| 1 | D（最低保护等级） | D | 非安全保护 |\n\
    | 2 | C（自主保护等级） | C1（自主安全保护） | 自主存取控制、审计功能 |\n|  | C（自主保护等级） | C2（可控存取保护） | 比C1级更强的自主存取控制、审计功能\
    \ |\n| 3 | B（强制保护等级） | B1（标记安全保护） | 强制存取控制，敏感度标记 |\n|  | B（强制保护等级） | B2（可结构化保护）\
    \ | 形式化模型，隐藏通道约束 |\n|  | B（强制保护等级） | B3（安全区域保护） | 安全内核，高抗渗透能力 |\n| 4 | A（验证保护等级）\
    \ | A1（可验证保护） | 形式化安全验证，隐藏通道分析 |\n|  | A（验证保护等级） | 超A1 |  |\n\n"
