    \n## 查询处理和优化要解决的问题\n\n- 在分布式数据库系统中，查询可分为三类：局部查询、远程查询、全局查询。\n  - 局部查询和远程查询只涉及单个结点的数据（本地的或远程的），可以采用集中式数据库的处理技术；\n\
    \  - 全局查询涉及到多个结点的数据，十分复杂。\n\n- 为了执行全局查询和确定一个好的查询策略，要做许多判断、计算工作。\n  - 查询分解\n  \
    \  - 把全局查询分解为若干子查询，每个子查询只涉及某一个结点的数据，可由局部DBMS处理。必须选择查询开销最省的那些结点（物理片段）。\n  - 选择操作执行的次序\n\
    \    - 主要是确定涉及不同结点上关系的连接和开操作的次序。\n  - 选择执行操作的方法\n    - 包括选择存取路径、选择某种操作的算法以及连接的执行方法。\n\
    \n## 查询优化的目标\n\n- 查询处理策略的选择是以执行查询的预期代价为依据的。\n  - 查询执行的开销：I/O代价+CPU代价+通信代价\n  -\
    \ 分布式查询可分为存取策略的分布优化和局部优化。其中存取策略的分布优化更重要。\n- 通信代价可计算，通常是数据传输量的函数：\n  TC (X) = C0+X*C1\n\
    \  X为数据传输量，C0为两节点初始化一次传输所花费的开销，C1为传输率，即单位数据传输所花费的时间。\n- 分布式数据库查询优化中，将“通信代价”作为首要因素进行研究。因此，查询优化的首要目标是：使查询执行时通信代价最省。\n\
    - 不同节点之间的连接操作和并操作是数据传输的主要原因，因此连接查询的优化是优化中研究的重要问题。\n\n## 连接查询的优化\n\n- 半连接：使用半连接来缩减关系（或片段）进而节省传输开销。\n\
    \n- 半连接法定义： R ⋉ₐ=ʙ S = R ⋈ₐ=ʙ (Πʙ (S))\n\n例：\n\n### R1\n\n| A | B |\n| --- | ---\
    \ |\n| a1 | b1 |\n| a2 | b1 |\n| a2 | b3 |\n| a2 | b4 |\n| a3 | b3 |\n\n⋈\n\n\
    ### R2\n\n| B | C |\n| --- | --- |\n| b1 | c1 |\n| b2 | c2 |\n| b5 | c1 |\n| b5\
    \ | c2 |\n| b6 | c4 |\n| b7 | c2 |\n| b8 | c3 |\n\n=\n\n### R1 ⋈ R2\n\n| A | B\
    \ |\n| --- | --- |\n| a1 | b1 |\n| a2 | b1 |\n\n- 根据半连接定义，有\n- R ⋈ₐ=ʙ S = (R ⋈ₐ=ʙ\
    \ S) ⋈ₐ=ʙ S = (R ⋈ₐ=ʙ Π_B (S) ) ⋈ₐ=ʙ S\n\n- 半连接在查询优化中的应用\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_487_0.png)\n\
    \n- 采用半连接的通讯代价：\n- C_SJ=2C0+ C1* (size(B)*card(Π_B(S))+size(R)*card(R'))\n\n-\
    \ 不采用半连接的通讯代价：\n- C_JN=C0+C1*size(R)*card(R)\n\n- 当R中参与连接的元组足够少时 采用半连接策略是有利的。41\n\
    \n## 分布式事务处理\n\n- 分布式事务的原子性与可串行性\n  - 在分布式数据库系统中，一个全局事务被划分为在许多节点上的子事务。分布式事务的原子性是：组成该事务的所有子事务要么一致地全部提交，要么一致地全部回滚。\n\
    \  - 在多用户系统中，还必须保证分布式事务的可串行性。\n- 分布式事务管理主要包括：事务的恢复和并发控制。\n\n## 分布式事务的恢复\n\n- 每个场地都有一个局部事务管理器，负责管理局部子事务的执行。同时，各局部事务管理器之间必须相互协调，保证分布式事务的原子性：各子事务要么都提交，要么都回滚。\n\
    - 对局部事务管理器进行协调，保证分布式事务原子性最常用的技术——两段提交协议 ( 2- Phase-Commitment Protocol )\n\n##\
    \ 两段提交协议（1）\n\n- 两段提交协议把一个分布事务的所有局部事务管理分为两类：协调者（一个），参与者。\n  - 协调者：负责作出该事务是提交还是撤销的最后决定。\n\
    \  - 参与者：负责管理相应子事务的执行以及在各自局部数据库上执行写操作。\n\n## 两段提交协议（2）\n\n- 两段提交协议内容\n  - 第一阶段：协调者征求意见作决定\n\
    \    - 协调者向所有参与者发出“准备提交”信息，并记入日志；参与者准备提交就回答“就绪”，否则回答“撤销”，并记入日志。\n    - 如果在规定时间内，协调者收到所有参与者的“就绪”信息，则作出“提交”决定，否则将作出“撤销”决定。\n\
    \  - 第二阶段：参与者执行决定\n    - 协调者将有关决定写入日志，然后把这个决定发送给所有的参与者。\n    - 所有参与者收到命令后，首先在日志中记入“收到提交/撤销决定”的信息，并向协调者发送应答消息，最后执行相应决定。\n\
    \    - 协调者收到所有参与者的应答消息后，一个事务的执行到此结束。有关日志信息可以脱机保存。\n- 采用两段提交协议后，若系统发生故障时，各场地利用各自有关的日志进行事务恢复。\n\
    \n## 并发控制（2）\n\n- 分布式数据库系统开发控制进一步的策略：\n  - 处理多副本封锁的几种可行方法：\n    - 对写操作，要申请所有副本的X锁；对读操作，只要申请某个副本的S锁。\n\
    \    - 无论是写操作还是读操作都要对大多数副本申请X锁或S锁。\n    - 规定某个场地上的副本为主副本，所有的读、写操作均申请对主副本的封锁。\n\
    \  - 解决全局死锁（两个以上场地上发生死锁）\n    - 死锁检测及解除方式\n    - 死锁预防，如对事务按某一标准进行排序，只允许事务按这一次序单向等待。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_493_0.png)\n"
