  - '[PAGE 194]


    # 概念结构设计方法


    +   设计概念结构通常有四类方法：


    +   自顶向下：首先定义全局概念结构的框架，然后逐步细化。


    +   自底向上：首先定义各局部应用的概念结构，然后将其集成起来。


    +   逐步扩张：首先定义核心概念结构，然后向外扩充。


    +   混合策略：自顶向下设计全局概念框架，自底向上设计各局部概念结构。


    +   最常用的方法是自底向上方法'
