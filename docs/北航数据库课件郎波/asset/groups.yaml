    # 三种函数依赖


    +   - 完全函数依赖与部分函数依赖

    +     - 定义：在R(U)中，如果X→Y，且对于任意X的真子集X''，都有X'' ↛ Y，则称Y对X完全函数依赖，记作X \xrightarrow{f}
    Y，否则称为Y对X部分函数依赖，记作X \xrightarrow{p} Y。


    +   - 传递函数依赖

    +     - 定义：在R(U)中，如果X→Y，Y→Z，且Y ↛ X，则称Z对X传递函数依赖。'
