  md: "\n## 分布式数据库系统的模式结构\n\n- **分布模式及分片模式/分布模式映象（映象3）**\n\n定义片段的存储点及片段到节点的映象。分布模式的映象类型确定了分布式数据库是冗余的还是非冗余的。\n\
    \n- **分布模式/局部数据库概念模式映象（映象4）**\n\n该映象把存储在局部场地的全局关系或全局关系的片段映象为各局部概念模式。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_460_0.png)\n\
    \n## 数据分片\n\n- 分片的方式有多种：\n  - 水平分片，垂直分片——两种基本的分片方式\n  - 混合分片，导出分片——较复杂的分片方式\n\n\
    ## 数据分片方式\n\n- 水平分片\n  - 将关系依照一定条件按行分为不相交的若干子集，每个子集称为一个水平片段。\n\n- 垂直分片\n  - 将关系按列分为若干属性子集，每个子集称为一个垂直片段。垂直分片的片段通过连接的方法恢复原关系。因此垂直分片的诸片段通常都包含关系的码。\n\
    \n- 导出分片\n  - 导出水平分片，分片的条件不是关系本身属性条件，而是其它关系的属性条件。如SC (SNO, CNO, G) 摘S关系中学生所在的系分片。\n\
    \n- 混合分片\n  - 指按上述三种分片方式得到的片段，继续按另一种方式分片。\n\n## 分布透明性（1）\n\n分布透明性包括：分片透明性、位置透明性、局部数据模型透明性\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_464_0.png)\n\n## 分布透明性（2）\n\n- **分片透明性**——用户或应用程序只对全局关系进行操作而不必考虑关系的分片。它是分布透明性的最高层次。\n\
    - **位置透明性**——用户或应用程序不必了解片段的存储场地，也不必关心各数据副本的一致性。\n- **局部数据模型透明性**——用户或应用程序不必了解局部场地上使用的是哪种数据模型。模型的转换以及查询语言等的转换均由分布模式/局部概念模式（映象4）完成。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_465_0.png)\n\n## 分布透明性示例\n\n• 示例：设有全局关系\
    \ S（S#，SN，SD，SA），它被划分为两个片段 S-A（本科生），S-B（研究生），S-B 有两个副本。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_466_0.png)\n\
    \n## 分布透明性示例\n\n执行查询操作：检索所有学生的学号和年龄。\n\n- 若系统具有分片透明性，则执行操作：\n  SELECT S#,SA\n\
    \  FROM S\n\n- 若系统具有位置透明性，不具有分片透明性，则可执行操作：\n  SELECT S#, SA\n  FROM  S_A\n  UNION\n\
    \  SELECT S#, SA\n  FROM  S_B\n\n- 若系统只具有局部数据模型的透明性，不具有位置透明性与分片透明性，在执行操作：\n  SELECT\
    \ S#, SA\n  FROM S_A AT SITE-1\n  UNION\n  SELECT S#, SA\n  FROM S_B AT SITE-3\n\
