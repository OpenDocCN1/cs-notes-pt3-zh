    \n## 需求的表达（2）\n\n### 数据字典\n\n是对数据的集中的系列说明。包含每一个数据元素的名字、意义等各方面的描述。\n\n- 从数据流图中提取出所有原子数据项；\n\
    - 把有联系的数据项组合起来形成数据组；\n- 以数据组为单位，写出数据项的如下定义：\n  - 语义定义：名字，实际意义等\n  - 类型定义：数据类型、数据宽度、小数位数等\n\
    \  - 完整性的约束定义：值约束、空值约束以及其他比较复杂的完整性的约束。\n- 根据用户和实际领域的信息模型需要补充其他数据项及其定义。\n\n## 需求的表达（3）\n\
    \n| 数据组名： |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| 特征 | 数据项名字 | 数据项名字\
    \ | 数据项名字 | 数据项名字 |\n|  | 编号： | 编号： | 编号： | 编号： |\n| 数据类型 |  |  |  |  |\n| 数据宽度\
    \ |  |  |  |  |\n| 小数位数 |  |  |  |  |\n| 单位 |  |  |  |  |\n| 值约束 |  |  |  |  |\n\
    | 允许空值否 |  |  |  |  |\n| 值个数 |  |  |  |  |\n\n## 需求的表达（4）\n\n- 数据字典还可以包括数据在系统内的传输路径、数据存储位置和处理过程信息等。\n\
    - 需求分析阶段的数据字典，可看成是数据元素表。\n- 在数据库实施阶段建立起来的数据字典，是数据库系统重要组成部分。\n\n## E-R法概述\n\n-\
    \ Peter Chen在1976年提出E-R法（Entity-Relationship Approach，实体联系方法）也称为E-R模型；\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_189_0.png)\n\
    \nDr. Peter Chen（陈品山）at Louisiana State University (LSU)\n\n- E-R法的思想是用E-R图描述现实世界的信息，这种信息结构称为概念结构，然后根据具体系统的要求将概念结构转换成为特定系统所能接受的逻辑结构（层次、网状、关系）；\n\
    \n- E-R法由两部分组成：\n  - 用E-R图描述现实世界；\n  - 将E-R图转换成为相应的数据模型。\n\n## 概念模型的重要性\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_190_0.png)\n\
    \n- 概念模型用于信息世界建模，是现实世界到信息世界的抽象，是用户和数据库设计人员进行交流的语言。\n\n## E-R图（1）\n\n- E-R图的组成：实体、联系、属性\n\
    \  - 实体：用长方形表示实体型，在框内写上实体名。\n  - 属性：用椭圆形表示实体的属性，并用无向边把实体与其属性连接起来。\n  - 联系：用菱形表示实体间的联系，菱形框内写上联系名。用无向边把菱形分别与有关实体相连，在无向边旁标注上联系的类型。若联系也具有属性，则属性和菱形也用无向边连接上。\n\
    \n例：\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_191_0.png)\n"
  mdcn: "\n\n## 动态SQL\n\n- 如果在预编译时SQL语句中的主变量、数据库对象等信息不能确定，就必须使用动态SQL技术。\n- 动态SQL允许在程序运行过程中\
    \ “临时” 组装SQL语句，主要有三种形式：\n  - 语句可变\n  - 条件可变\n  - 数据库对象、查询条件均可变\n\n## 小结\n\n- 概念\n\
    \  - 基本表与视图；关系数据库的三级模式结构\n  - SQL 的特点\n- SQL 的数据定义、查询、更新、控制功能\n- 视图的作用及SQL 的视图操作\n\
    \n## 第四章 数据库设计\n\n- 数据库设计概述\n- 需求分析\n- 概念结构设计\n- 逻辑结构设计\n- 物理结构设计\n\n## 数据库设计概述\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_174_0.png)\n\nDBMS\n\n数据库DB\n\n数据库系统\n\
    \n## 数据库设计概述\n\n- **什么是数据库设计**\n  - 是指对于一个给定的应用环境，设计优化的数据库逻辑和物理结构，建立数据库，使之能够有效地存储数据，为开发满足用户需求的应用系统奠定基础。\n\
    - **数据库设计的特点**\n  - 要把数据设计和处理设计密切结合起来；\n  - 与硬件、软件和管理紧密相关。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_175_0.png)\n\
    \n## 数据库设计概述\n\n- 数据库设计的方法（1）\n  - 手工决定法（直接设计法）：根据应用的数据要求与处理要求，直接设计数据库的结构。缺点：\n\
    \    - 数据间关系复杂，使用要求各式各样，很难仅凭经验进行设计；\n    - 把数据的逻辑结构、物理结构、处理要求等一起考虑，很难对模式进行评价和优化。用户需求一旦发生变化，数据结构很难随之发生变化；\n\
    \    - 数据库设计与具体的DBMS紧密结合，移植困难；\n    - 缺乏文档资料，难以与用户交流，对设计难以评审；\n    - 难以由多个人合作进行设计。\n\
    \n## 数据库设计概述\n\n- 数据库设计的方法（2）\n  - 规范设计法：运用软件工程的思想和方法，把整个设计过程划分为若干阶段，把复杂的大问题分为若干相对简单的小问题，每个阶段只解决整个设计中的部分问题。\n\
    \  - 规范设计法是迭代和逐步求精的过程，每一过程完成时要进行设计分析，产生各种设计文档，并组织评审和用户交流，如不满足要求则进行修改。\n\n## 数据库设计的基本步骤\n\
    \n按照规范设计方法，数据库设计分为以下六个阶段：\n\n- 需求分析；\n- 概念结构设计；\n- 逻辑结构设计；\n- 物理结构设计；\n- 数据库实施；\n\
    - 数据库运行和维护。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_178_0.png)\n\n## 数据库设计的基本步骤\n\
    \n在六阶段数据库设计的不同阶段形成了数据库的各级模式：\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_179_0.png)\n\
    \n## 数据库设计阶段概述（1）\n\n- **需求分析**\n  - 对应用环境进行详细调查，收集支持系统目标的基础数据及其处理；\n- **数据库概念结构设计**\n\
    \  - 通过对用户需求进行综合、归纳与抽象，形成独立于数据库逻辑结构与具体 DBMS 的概念模型，可以用 E-R 图等表示；\n- **数据库逻辑结构设计**\n\
    \  - 将概念结构转换为某个 DBMS 所支持的数据模型，并进行优化。再将得到的逻辑结构转换成特定的 DBMS 能处理的模式、子模式；\n\n## 数据库设计阶段概述（2）\n\
    \n- 数据库物理结构设计\n  - 设计数据库在物理设备上的存储结构和存取方法。一般分为两步：一是确定数据库的内模式；二是对物理结构进行时间与空间效率的评价；\n\
    - 数据库实施\n  - 是建立数据库的过程。用DBMS的DDL描述三级模式，并调试产生目标模式。开发应用程序，组织数据入库并试运行；\n- 数据库运行和维护\n\
    \  - 在数据库正式运行后，由DBA执行对数据库经常性的维护工作，包括数据库转储与恢复、数据库控制、数据库性能监控、数据库的重组与重构。\n\n## 需求分析的目标\n\
    \n- 需求分析阶段的目标是收集支持系统应用目标的基础数据及其处理。调查的重点是“数据”和“处理”，包括：\n  - 信息要求：指系统中所涉及的数据及数据之间的联系。具体收集数据的名称、类型、长度等，确定数据之间联系的类型。\n\
    \  - 处理要求：指用户要完成什么处理功能，对处理的响应时间和处理方式的要求。\n  - 安全性与完整性的要求\n\n## 需求分析的方法\n\n- 需求分析分为两个阶段：\n\
    \  - 调查用户实际要求，与用户达成共识\n  - 分析、表达用户的需求\n    - 用数据流图表达数据和处理之间的关系；\n    - 用数据字典描述系统中各类数据。\n\
    \n## 需求的表达（1）\n\n- 数据流图\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_184_0.png)\n\
    \n采用结构化分析方法SA 从最上层的系统组织机构入手，自顶向下逐步分解处理功能以及它们所用的数据，形成若干层次的数据流图。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_184_1.png)\n\
    \n## 需求的表达（2）\n\n### 数据字典\n\n是对数据的集中的系列说明。包含每一个数据元素的名字、意义等各方面的描述。\n\n- 从数据流图中提取出所有原子数据项；\n\
    - 把有联系的数据项组合起来形成数据组；\n- 以数据组为单位，写出数据项的如下定义：\n  - 语义定义：名字，实际意义等\n  - 类型定义：数据类型、数据宽度、小数位数等\n\
    \  - 完整性的约束定义：值约束、空值约束以及其他比较复杂的完整性的约束。\n- 根据用户和实际领域的信息模型需要补充其他数据项及其定义。\n\n## 需求的表达（3）\n\
    \n| 数据组名： |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| 特征 | 数据项名字 | 数据项名字\
    \ | 数据项名字 | 数据项名字 |\n|  | 编号： | 编号： | 编号： | 编号： |\n| 数据类型 |  |  |  |  |\n| 数据宽度\
    \ |  |  |  |  |\n| 小数位数 |  |  |  |  |\n| 单位 |  |  |  |  |\n| 值约束 |  |  |  |  |\n\
    | 允许空值否 |  |  |  |  |\n| 值个数 |  |  |  |  |\n\n## 需求的表达（4）\n\n- 数据字典还可以包括数据在系统内的传输路径、数据存储位置和处理过程信息等。\n\
    - 需求分析阶段的数据字典，可看成是数据元素表。\n- 在数据库实施阶段建立起来的数据字典，是数据库系统重要组成部分。\n\n## E-R法概述\n\n-\
    \ Peter Chen在1976年提出E-R法（Entity-Relationship Approach，实体联系方法）也称为E-R模型；\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_189_0.png)\n\
    \nDr. Peter Chen（陈品山）at Louisiana State University (LSU)\n\n- E-R法的思想是用E-R图描述现实世界的信息，这种信息结构称为概念结构，然后根据具体系统的要求将概念结构转换成为特定系统所能接受的逻辑结构（层次、网状、关系）；\n\
    \n- E-R法由两部分组成：\n  - 用E-R图描述现实世界；\n  - 将E-R图转换成为相应的数据模型。\n\n## 概念模型的重要性\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_190_0.png)\n\
    \n- 概念模型用于信息世界建模，是现实世界到信息世界的抽象，是用户和数据库设计人员进行交流的语言。\n\n## E-R图（1）\n\n- E-R图的组成：实体、联系、属性\n\
    \  - 实体：用长方形表示实体型，在框内写上实体名。\n  - 属性：用椭圆形表示实体的属性，并用无向边把实体与其属性连接起来。\n  - 联系：用菱形表示实体间的联系，菱形框内写上联系名。用无向边把菱形分别与有关实体相连，在无向边旁标注上联系的类型。若联系也具有属性，则属性和菱形也用无向边连接上。\n\
