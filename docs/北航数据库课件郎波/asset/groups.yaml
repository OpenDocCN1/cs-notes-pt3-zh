  - '[PAGE 522]


    # # 非结构化数据的构成特点


    +   - **基本属性（Basic Attribute）**：所有数据都具有的一般属性，包括名称、类型、创建者等


    +   - **语义特征（Semantic Feature）**：以文字表达的非结构化数据特有的语义属性，包括作者、创作意图、数据主题说明、底层特征含义等语义要素


    +   - **底层特征（Low-level Feature）**：通过各种专用处理技术（如图像、语音、视频等）获得的非结构化数据特性，如颜色、纹理、形状等


    +   - **原始数据（Data）**：非结构化数据的原生态文件


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_522_0.png)'
  - '[PAGE 523]


    # 一种非结构化数据的数据模型—四面体模型


    +   - 四面体模型=顶点+刻面+连线

    +     - 顶点：数据的标识

    +     - 刻面1：基本属性刻面

    +       - 点集：基本属性

    +     - 刻面2：语义特征刻面

    +       - 点集：各种语义特征描述

    +     - 刻面3：底层特征刻面

    +       - 点集：各种底层特征

    +     - 刻面4：原始数据刻面

    +       - 点集：各种原始数据

    +     - 连线：四个刻面上点之间的关联


    ```

    Tetrahedron = (V, BA_FACET, SF_FACET, LF_FACET, RD_FACET, CONUS)

    BA_FACET = {Basic_Attribute}

    SF_FACET = {Semantic_Feature | j ∈ [1,m]}

    LF_FACET = {Lowlevel_Feature | k ∈ [1,m]}

    RD_FACET = {Data | l ∈ [1,p]}

    CONUS = {BA_FACET×SF_FACET ∪ BA_FACET×LF_FACET ∪ BA_FACET×RD_FACET ∪ SF_FACET×LF_FACET
    ∪ SF_FACET×RD_FACET ∪ LF_FACET×RD_FACET}

    ```


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_523_0.png)'
