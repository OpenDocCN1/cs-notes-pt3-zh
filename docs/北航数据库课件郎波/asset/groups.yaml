    # 关系键的形式定义（1）


    +   - 候选码（键）与主码（键）

    +     - 定义：设K为R<U, F>中的属性或属性组合，若K→U，则称K为R的候选码。若候选码多于一个，则选定其中的一个作为主码。

    +     - 主码的性质：

    +       - 唯一性：唯一地标识关系中的元组。

    +       - 最小性：若去掉主码中的任意一属性，则主码将失去标识的唯一性。


    +   - 主属性与非主属性：

    +     包含在任何一个候选码中的属性，叫主属性。

    +     不包含在任何码中的属性称为非主属性。'
