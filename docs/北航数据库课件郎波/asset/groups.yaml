    # # 并发控制


    +   - **事务并行执行的优点**

    +     - 一个事务由不同的步骤组成，所涉及的系统资源也不同。这些步骤可以并发执行，以提高系统的吞吐量。

    +     - 系统中存在着周期不等的各种事务，串行会导致难于预测的时延。如果各个事务所涉及的是数据库的不同部分，采用并发会减少平均响应时间。


    +   - **事务并行执行带来的问题**

    +     - 多个事务同时在取同一数据时，如不加控制就可能会读取或存储不正确的数据，破坏数据库的一致性。'
