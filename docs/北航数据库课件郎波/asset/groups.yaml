    \n## 活锁与死锁（4）\n\n- 死锁的检测\n  - 超时法\n    - 如果一个事务的等待时间超过了规定的期限，就认为发生了死锁。\n  - 等待图法\n\
    \    - 事务等待图是一个有向回路G=(T, U),其中T为节点集合，每个节点表示正在运行的事务，U为边集，每条边表示事务的等待情况。并发控制子系统周期性的检测事务等待图，如果发现图中存在回路，则表示系统出现死锁。\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_405_0.png)\n\n- 死锁恢复\n  通常采用的方法是选择一个处理死锁代价最小的事务，将其撤销，释放此事务持有的所有锁，使其他事务得以继续运行下去。对于所撤销的事务所作的操作必须加以恢复。\n\
    \n## 串行调度与并行调度\n\n## (a) 串行调度\n\n## (b) 串行调度\n\n## (c) 不可串行化的调度\n\n## (d) 可串行化的调度\n\
    \n图 11.7 并发事务的不同调度\n\n| T₁ | T₂ | T₁ | T₂ | T₁ | T₂ | T₁ | T₂ |\n|---|---|---|---|---|---|---|---|\n\
    | S lock B<br>Y = R(B) = 2<br>Unlock B<br>X lock A<br>A = Y + 1 = 3<br>W(A)<br>Unlock\
    \ A<br><br>S lock A<br>X = R(A) = 3<br>Unlock A<br>X lock B<br>B = X + 1 = 4<br>W(B)<br>Unlock\
    \ B |  | S lock B<br>Y = R(B) = 3<br>Unlock B<br>X lock A<br>A = Y + 1 = 4<br>W(A)<br>Unlock\
    \ A | S lock A<br>X = R(A) = 2<br>Unlock A<br>X lock B<br>B = X + 1 = 3<br>W(B)<br>Unlock\
    \ B | S lock B<br>Y = R(B) = 2<br>Unlock B<br>X lock A<br>A = Y + 1 = 3<br>W(A)<br>Unlock\
    \ A | S lock A<br>X = R(A) = 2<br>Unlock A<br>X lock B<br>B = X + 1 = 3<br>W(B)<br>Unlock\
    \ B | S lock B<br>Y = R(B) = 2<br>Unlock B<br>X lock A<br>A = Y + 1 = 3<br>W(A)<br>Unlock\
    \ A | S lock A<br>等待<br>等待<br>等待<br>X = R(A) = 3<br>Unlock A<br>X lock B<br>B\
    \ = X + 1 = 4<br>W(B)<br>Unlock B |\n\n## 事务并发调度的正确性\n\n- 对并发事务中操作的调度是随机的，而不同的调度可能产生不同的结果，但调度要保证事务执行的正确性\n\
    - 事务执行正确性的含义\n  - 一个事务正常的或者预想的结果是没有其它并发事务干扰时得到的结果。因此一组事务的串行调度兼略一定是正确的调度兼略。\n \
    \ - 虽然不同的串行顺序的结果会不同，由于各种结果都将保持数据库数据的一致性，所以都是正确的。\n\n## 并发调度的可串行性\n\n- **可串行化**\n\
    \  - 多个事务的并发执行是正确的，当且仅当其结果与按某一次序串行执行它们时的结果相同，我们称这种调度策略为可串行化调度。\n\n- **可串行性是并行事务正确性的准则**\n\
    \  - 一个给定的并发调度，而且仅当它是可串行化的，才认为是正确调度。\n\n## 可串行化调度的判定\n\n- 可串行化调度判定的充分条件\n  - 一个调度Sc在保证冲突操作次序不变的情况下，可以通过交换两个事务不冲突操作的次序，得到另一个串行调度Sc’，则调度Sc为冲突可串行化调度。\n\
    \    - 冲突操作\n      冲突操作是不同事务对同一数据的读-写操作以及写-写操作。表示为：\n      事务Ti读x，Tj写x —— Ri(x)与Wj(x)\n\
    \      事务Ti写x，Tj写x —— Wi(x)与Wj(x)\n    - 不同事务的冲突操作与同一个事务的两个操作不能交换。\n  - 一个冲突可串行化调度，一定是可串行化调度。\n\
    \n## 可串行化调度的判定\n\n- 示例\n\n调度 Scl=R1(A)W1(A)R2(A)W2(A)R1(B)W1(B)R2(B)W2(B)，经交换操作得到\
    \ Sc2=R1(A)W1(A) R1(B) W1(B)R2(A)W2(A) R2(B)W2(B)\n\n= T1,T2\n\n所以Scl是可串行化调度。\n\
    \n## 并发调度的可串行性\n\n- 定理：若所有事务均遵循两段锁协议，则这些事务的所有并发调度都是可串行化的。按照这个定理，所有遵守两段锁协议的事务，其并行执行的结果一定是正确的。\n\
    \n- 注意的问题\n  - 事务遵守两段锁协议是可串行化调度的充分条件而不是必要条件。\n  - 两段锁协议并不要求事务在执行任何数据库读、写操作之前就一次申请全部封锁，因此遵守两段锁的事务仍可能发生死锁。\n\
    \n## 第八章 数据库保护\n\n- 数据库安全性控制\n- 数据库完整性控制\n\n## 数据库安全性控制\n\n- 数据库安全性含义\n- 数据库安全性控制\n\
    \  - 用户标识与鉴别\n  - 自主存取控制\n  - 强制存取方法\n  - 其它方法\n- 安全数据库体系结构示例\n- 可信计算机系统评测标准\n"
