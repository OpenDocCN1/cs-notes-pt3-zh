    # 分组检索（1）


    +   - 按属性列（列组）将关系的元组分组，每组在这些分组属性列（列组）上具有相同值，对每一组可执行SELECT操作。

    +   - 分组子句：

    +     GROUP BY 列名

    +     [ HAVING 条件表达式] ——分组条件

    +   - WHERE子句与HAVING子句

    +     - WHERE 子句是针对“行”进行，用于去掉不符合条件的若干行；HAVING子句针对“分组”进行，必须和GROUP BY 连用，用于去掉不符合条件的若干分组。

    +     - 在查询块中出现的顺序：WHERE — GROUP BY — HAVING'
  - '[PAGE 147]


