    # SQL92的数据类型


    +   - char（n）：固定长度的字符串。

    +   - varchar（n）：可变长字符串。

    +   - int：整数。

    +   - smallint：小整数类型。

    +   - numeric（p，q）：定点数共p位，小数点右边q位。

    +   - Real，double precision：浮点数与双精度浮点数，精度与机器有关。

    +   - Float(n)：n位的精度浮点数。

    +   - date：日期（年、月、日）。

    +   - time：时间（小时、分、秒）。

    +   - interval：两个date或time类型数据之间的差'
