    # 数据系统的组成


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_29_0.png)


    数据库系统包括四个主要部分：数据库、用户、软件、硬件。'
  - '[PAGE 30]


    # 数据库系统的组成（1）


    +   - 数据库——数据库系统中集中存储的一批数据的集合。数据库中存储的数据是“集成的”和“共享的”。

    +     - “集成的”是指把特定应用环境中各种应用相关的数据及数据之间的联系全部地、集中地并按照一定结构形式进行存储。

    +     - “共享的”是指数据库中的数据可为多个不同的用户所共享。'
  - '[PAGE 31]


    <!-- no content -->'
  - '[PAGE 32]


    # 数据库系统的组成（3）


    +   - 软件——指负责数据库存取、维护和管理的软件系统。包括数据库管理系统 DBMS，各种应用系统。DBMS是数据库系统的核心软件，在操作系统支持下工作；

    +   - 硬件——指存储数据库和运行DBMS的硬件资源，包括计算机的内存和外存等。'
  - '[PAGE 33]


    # # 数据模型


    +   - 数据模型用来抽象和表现现实世界中的数据和信息。

    +   - 在数据库中，根据模型应用的不同目的，将模型分为两类或两个层次：

    +     - 概念模型（也称信息模型）

    +     - 数据模型（如层次、网状、关系模型）。'
  - '[PAGE 34]


    # 数据模型的层次


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_34_0.png)


    认识、抽象


    转换


    +   - 概念模型用于信息世界建模，是现实世界到信息世界的抽象，是用户和数据库设计人员进行交流的语言。

    +   - 数据模型用于机器世界，按计算机系统的观点对数据建模。'
  - '[PAGE 35]


    # 数据模型


    +   - 概念模型

    +   - 数据模型

    +   - 数据模型的分类'
  - '[PAGE 36]


    # 概念模型


    +   - 概念模型基于信息世界的主要概念，具有较强的语义表达能力，能够方便、直接表达应用中的各种语义。

    +   - 概念模型应该简单、清晰、易于理解。

    +   - 概念模型的最常用的表示方法：实体—联系方法（E-R）法。'
