    +   - 元组关系演算的基本结构是元组演算表达式。元组关系表达式的形式定义：{ t | Φ(t) }，表示了所有使Φ为真的元组的集合，即表示了一个关系。

    +     其中：

    +     - t为元组变量。如果元组变量前有“全称”（∀）或“存在”（∃）量词，则称其为约束元组变量，否则称为自由元组变量。

    +     - Φ(t)是元组关系演算公式，由原子公式和运算符组成，简称公式。'
  - '[PAGE 103]


    # 元组关系演算公式的递归定义（1）


    +   1. 原子命题函数是公式，称为原子公式。原子公式有三类：

    +      - `R(t)`。`t`是关系`R`中的一个元组。

    +      - `t[i]θu[j]`。`t[i]`与`u[j]`分别为`t`的第`i`个分量和`u`的第`j`个分量，它们之间满足比较关系`θ`。

    +      - `t[i]θc`或`cθt[i]`。分量`t[i]`与常量`c`之间满足比较关系`θ`。


    2. 如果`Φ₁`，`Φ₂`是公式，则`Φ₁∧Φ₂`，`Φ₁∨Φ₂`，`¬Φ`也是公式。


    3. 如果`Φ`是公式，则`∃t(Φ)`和`∀t(Φ)`也是公式。'
  - '[PAGE 104]


    # 元组关系演算公式的递归定义 (2)


    (4)在元组演算公式中，各种运算符的优先次序为：


    +   - 算术比较运算符最高。

    +   - 量词次之，且∃的优先级高于∀。

    +   - 逻辑运算符最低，且¬优先级高于∧，∧高于∨。

    +   - 如果有括号，则括号中的运算优先级最高。


    +   - 按照上述4个规则对元组公式进行有限次复合，可以得到元组演算的所有公式。'
