  - '[PAGE 94]


    # 关系代数—专门的关系运算


    +   - 自然连接（Natural Join）

    +     - 定义：关系R与关系S的自然连接，是从两个关系的广义笛卡儿积R×S中选取在相同属性列上取值相等的元组，并去掉重复的属性列。记作：R⋈S，或R*S

    +       R ⋈ S = { (Z,X,W) | (Z,X)∈R ∧ (W,X)∈S ∧ r[X]=s[X] }

    +     - 连接与自然连接：在等值（θ取“=”）连接情况下，连接属性X和Y是相同属性时，R与S的连接称为自然连接。自然连接的结果要在上述R与S的等值连接结果基础上再进行投影运算，去掉重复的属性列。'
