    \ store, manage, and analyze.\n  ——无法用一般数据库软件工具进行获取、管理 和分析处理的数据集合（麦肯锡全球研究所）\n\n\
    - 大数据就是一个量特别大（10TB以上），数据类别特别多的数据集\n\n## 大数据 的产生\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_527_0.png)\n\
    \n资料来源： Hilbert and López, “The world’s technological capacity to store, communicate,\
    \ and compute information,” Science, 2011\n\n- 超过80%比例的数据是非结构化数据，已经超过了传统数据库的管理能力\n\
    \n## 大数据技术\n\n- 是在成本可承受（economically）的条件下，通过非常快速（velocity）的采集、发现和分析从大量（volumes）、多类别（variety）的数据中提取价值（value）的技术，将是IT领域新一代的技术与架构\n\
    - 有很多方法和技术能够对大数据进行聚合、分析等操作，这些方法和技术来自统计学、应用数学、计算机科学、经济学等多个领域，一部分是用来处理传统数据的，通过扩展来处理大数据；另一部分是最近专门用来处理大数据的\n"
  mdcn: "\n\n## 非结构化数据的 使用需求\n\n- 原始数据检索\n  - 按内容检索\n  - 查准、查全、快速\n- 数据关联检索\n  - 同类媒体之间的关联\n\
    \  - 跨媒体关联\n- 智能检索\n  - 自动分类、聚类\n  - 数据分析\n  - 知识发现\n\n## 非结构化数据管理的现状\n\n- 原始数据查询准确性不能令人满意\n\
    \  - 基于文本检索——受限于语义描述\n  - 基于内容——受限于底层特征处理技术\n- 缺乏关联检索、模式匹配、多维数据分析和数据挖掘等智能服务\n\
    - 目前缺少成熟的非结构化数据管理系统，国内外处于同一起跑线上\n\n## 非结构化数据管理的突破口\n\n- 数据模型是数据管理的核心，定义了数据描述结构、数据操作方法以及数据完整性约束\n\
    - E.F.Codd于70年代初成功提出关系数据模型与数据理论，奠定了几十年来关系数据库应用蓬勃发展的基础\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_519_0.png)\n\
    \nEdgar Frank Codd，1923–2003\n\n## 非结构化数据管理的突破口\n\n- 原始数据检索　数据关联检索　智能检索\n\n数据处理引擎\n\
    \n数据存储\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_1.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_2.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_3.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_4.png)\n\n非结构化数据管理用户视图\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_5.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_6.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_7.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_520_8.png)\n\n非结构化数据管理功能视图\n\n## 非结构化数据的构成\n\
    \n- • 每种数据组成复杂\n  - – 多模态\n  - – 多张性强\n\n| 语义项 | 描述 |\n|---|---|\n| 图像表示 | 极其复杂的语义类型，如长度、宽度、亮度等\
    \ |\n| 拍摄者 | 图像的拍摄者 |\n| 拍摄时间 | 图像的拍摄时间 |\n| 拍摄地点 | 图像的拍摄地点 |\n| 感兴趣区域 | 图像中用户感兴趣区域的描述\
    \ |\n| 内容描述 | 图像的内容描述 |\n| 类别 | 预定义的图像类别，如动物、植物、交通等 |\n| 用户评论 | 用户对图像的评论 |\n|\
    \ 宽度 | 图像的宽度 |\n| 高度 | 图像的高度 |\n| 关键词 | 反映图像内容的关键词 |\n| 标题 | 图像内容的标题 |\n| 文件类型\
    \ | 图像文件的后缀类型，如 jpg、png 等 |\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_521_0.png)\n\
    \n### 图像语义描述\n\n### 图像底层特征\n\n可伸缩颜色描述符(64维): \"scalablecolor\"; 0; 164 40 18 58\
    \ 9 …\n颜色空间分布描述符(120维): \"descriptorColorLayout\"; 33 …\n边缘直方图描述符(80维): \"edgeHistogram\"\
    ; 33 0 0 0 …\n色彩边缘等方向性描述符(综合颜色和纹理特征,144维): \"cedd\"; 144 …\n模糊颜色纹理直方图(综合颜色和纹理特征,192维):\
    \ \"fcth\"; 192 …\n颜色直方图描述符(256维): \"RGB\" 256 73 13 20 18 20 16 …\n纹理特征(粗糙、对比度、方向性,18维):\
    \ \"tamura\" 18 …\n\n## 非结构化数据的构成特点\n\n- **基本属性（Basic Attribute）**：所有数据都具有的一般属性，包括名称、类型、创建者等\n\
    \n- **语义特征（Semantic Feature）**：以文字表达的非结构化数据特有的语义属性，包括作者、创作意图、数据主题说明、底层特征含义等语义要素\n\
    \n- **底层特征（Low-level Feature）**：通过各种专用处理技术（如图像、语音、视频等）获得的非结构化数据特性，如颜色、纹理、形状等\n\
    \n- **原始数据（Data）**：非结构化数据的原生态文件\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_522_0.png)\n\
    \n## 一种非结构化数据的数据模型—四面体模型\n\n- 四面体模型=顶点+刻面+连线\n  - 顶点：数据的标识\n  - 刻面1：基本属性刻面\n \
    \   - 点集：基本属性\n  - 刻面2：语义特征刻面\n    - 点集：各种语义特征描述\n  - 刻面3：底层特征刻面\n    - 点集：各种底层特征\n\
    \  - 刻面4：原始数据刻面\n    - 点集：各种原始数据\n  - 连线：四个刻面上点之间的关联\n\n```\nTetrahedron = (V,\
    \ BA_FACET, SF_FACET, LF_FACET, RD_FACET, CONUS)\nBA_FACET = {Basic_Attribute}\n\
    SF_FACET = {Semantic_Feature | j ∈ [1,m]}\nLF_FACET = {Lowlevel_Feature | k ∈\
    \ [1,m]}\nRD_FACET = {Data | l ∈ [1,p]}\nCONUS = {BA_FACET×SF_FACET ∪ BA_FACET×LF_FACET\
    \ ∪ BA_FACET×RD_FACET ∪ SF_FACET×LF_FACET ∪ SF_FACET×RD_FACET ∪ LF_FACET×RD_FACET}\n\
    ```\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_523_0.png)\n\n## 海量非结构化数据管理系统AUDR\n\
    \n### 核心功能层\n- 图像、视频、音频、文本的读取与检索\n- 图像、视频、音频、文本的内容检索\n- 图像、视频、音频、文本的关联检索\n- 图像、视频、音频、文本的分类定义与更新\n\
    \n### 基础支撑层\n- 存储引擎\n- 图像、视频、音频、文本的查询引擎\n- 图像、视频、音频、文本的标注工具\n- 存储管理工具\n- 事务管理工具\n\
    - 安全管理工具\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_524_0.png)\n\n## 大数据时代\n\n\
