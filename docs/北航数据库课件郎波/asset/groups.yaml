    +   3. 若有X→A∈F，且XA=U，则ρ={R}，算法终止。

    +   4. 对F按具有相同左部的原则进行分组(设为k组)，每一组函数依赖所涉及的属性全体为Ui，若有Ui⊆Uj(i≠j),则去掉Ui。令Fi为F在Ui上的投影，则ρ={R1<U1,F1>,...,Rk<Uk,Fk>}是R<U,F>的一个保持函数依赖的分解，并且每个Ri<Ui,Fi>∈3NF。'
