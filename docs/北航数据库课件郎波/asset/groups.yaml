    # 函数依赖


    +   - 函数依赖的定义


    设 R(U) 是属性集 U 上的关系模式。X、Y 是 U 的子集。r 是 R 的任意一个具体关系，t, s 是 r 中任意两个元组。如果 t[X] = s[X]，则
    t[Y] = s[Y]，则称 “X 函数确定 Y” 或 “Y 函数依赖于 X”，记作： X→Y。


    +   - 函数依赖 X→Y 也可定义为：


    对于 X 的每个具体值，Y 有唯一的值与之对应，则称 “X 函数确定 Y” 或 “Y 函数依赖于 X”。'
