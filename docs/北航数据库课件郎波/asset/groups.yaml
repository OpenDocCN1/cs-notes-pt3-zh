  md: "\n## 课程知识点回顾\n\n- 数据库系统基本概念\n- 关系数据库\n- 关系数据库标准语言SQL\n- 关系数据理论\n- 数据库设计\n-\
    \ 事务处理技术\n- 数据库保护\n- 分布式数据库技术\n- 面向对象数据库\n- 数据挖掘技术\n\n数据库系统基本原理\n基础理论\n设计理论\n\
    实现技术\n新技术\n\n## 数据库系统的结构\n\n应用A\n\n应用A\n\n应用A\n\n应用A\n\n外模式1\n\n外模式2\n\n外模式/模式映射1\n\
    \n外模式/模式映射2\n\n模式\n\n模式/内模式映射\n\n内模式\n\n数据库\n\n数据库管理系统\nDBMS\n\n操作系统\nOS\n\nDBA\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_495_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_495_1.png)\n\
    \n## 第十章 数据管理技术新进展\n\n- 面向对象数据库\n- 数据仓库\n- 非结构化数据管理\n- 大数据处理\n\n## 面向对象数据库产生背景\n\
    \n- 对于数据结构异常复杂的某些应用领域，关系数据库显示出局限性。\n- 要求DBS能够处理更复杂的数据模型，能适度地演化，便于管理、构造与维护大量的持久数据，并能与大型复杂程序紧密结合。\n\
    - 面向对象数据库是面向对象程序设计技术与数据库技术结合的产物。\n\n## 面向对象数据库发展现状\n\n- 面向对象数据库系统现阶段特征：\n  - 缺乏通用数据模型\n\
    \  - 缺乏坚实的形式化理论基础\n  - 具有较强的实践性\n\n## 面向对象的基本概念\n\n- 对象（Object）的概念\n  - 是由实体所包含的一组数据和施加于这些数据上的操作组成。对象是现实世界概念实体的模型，可以是有形的/抽象的、简单的/复杂的。\n\
    \  - 对象的特征\n    - 有一个状态，可由其他对象的状态构成，并且只能被自身的行为改变；\n    - 有一组操作（行为），包括自操作和它操作；\n\
    \    - 有唯一标识；\n    - 对象之间可以互通消息。\n\n## 面向对象的基本概念\n\n- 类（class）的概念\n  - 将类似的对象组合在一起，形成一个对象类。\n\
    \  - 对象之间的联系\n    - 继承：形成类的层次结构。\n      - 单继承：每个子类只有一个直接超类\n      - 多继承：每个子类可有多个直接超类\n\
    \    - 嵌套：一个对象的属性是另一个对象，对象间形成嵌套层次结构\n\n## 面向对象数据模型\n\n- 面向对象的数据模型是由一组类组成，这些类构成了有限的层次结构，称为类层次。\n\
    - 一个面向对象数据库模式可能包含多个类层次。在一个类层次中，一个类继承其所有超类的全部变量、方法和消息。\n\n## OODBS 的特性\n\n- 必备特性\n\
    \  - 判定 OODBS 的充要条件\n- 可选特性\n  - 使系统更完善的添加特性\n- 开放特性\n  - 系统设计者自由选择部分\n\n## OODBS的必备特性\n\
    \n- OODBS必须满足两个标准：\n  - 是一个DBS\n    - 持久性、存储管理、并发性、恢复和即席查询\n  - 是一个面向对象的系统\n \
    \   - 复杂对象、对象标识、封装性、类、继承、结合滞后联编的重载、可扩充性、计算完备性\n\n## OODBS 的必备特性\n\n- 复杂对象\n  -\
    \ 如果一个对象的属性是一个对象，则该对象称为复杂对象。\n- 对象标识\n  - 每个对象都有一个系统赋予的唯一不变的标识称为对象标识 OID。使对象独立于其值而存在。\n\
    \n## OODBS 的必备特性\n\n- 重载和滞后联编\n  - 重写(Overriding)和重载(Overloading)\n  - 滞后联编：OODBS在编译时不能把重载方法的方法名联编到方法代码上，必须在运行时把方法名联编到方法代码上，这种推迟的联编称为滞后联编。\n\
    \n- 可扩充性\n  - 系统定义和用户定义的类在应用中没有区别，即新定义的类和原有的类具有同等的地位。\n\n- 计算完备性\n  - 由DBS的DML可表达任何可计算的功能。\n\
    \n## OODBS 的必备特性\n\n- 永久性\n  - 如果一个对象在应用程序结束后仍继续存在，则该对象具有永久性（持久性）。\n  - 是数据库和程序设计语言的一个重大区别。\n\
    - 存储管理\n  - 包括索引管理、数据聚集、数据缓存、存储路径选择、查询优化等。\n- 即席查询\n  - 通过查询语句、界面进行查询。应具有高层次、高效率和与应用无关的特性。\n\
    \n## OODBS 的可选特性\n\n- 多重继承\n- 类型检查和类型推理\n- 分布\n- 设计事务处理\n  - 长事务或嵌套事务\n- 版本管理\n\
    \n## OODBS 的可选特性\n\n- 模式演进\n  - 面向对象数据库模式，随着需求的变化而变化，称为模式演进。\n  - 主要模式演进操作\n \
    \   - 增加新类\n    - 删除类\n    - 修改类定义\n    - 修改类之间的关系\n  - 模式一致性：模式内部不能出现矛盾和错误\n\
    \  - 模式演进实现的难点是保证模式的一致性。\n\n## OODBM S介绍\n\n- ORION/ITASCA\n  - MCC (Microelectronics\
    \ and Computer Technology Corporation )85年开发。\n- GEMSTONE\n  - Servio公司开发。最早的商品化OODBMS之一。基于Smalltalk。\n\
    - ONTOS\n  - Ontos公司开发，基于C++。\n- ObjectStore\n  - Object Design公司产品，基于C++。\n-\
    \ Versant\n  - Versant Object Technology 公司开发。基于C++，支持C。\n\n## 什么是数据仓库\n\n- 数据仓库是支持管理决策过程的、面向主题的、集成的、随时间而增长的持久数据集。\n\
    - 数据仓库中的业务\n  - 数据仓库上的业务处理称作 OLAP (On-Line Analytical Processing)，即联机分析处理。\n \
    \ - 数据库上的业务处理称作 OLTP (On-Line Transaction Processing)，即联机事务处理\n\n## 数据仓库主要特征\n\
    \n- 面向主题\n  - 可以根据最终用户的观点组织和提供数据\n- 管理大量信息\n  - 数据仓库含有大量历史数据\n- 信息存储在多个存储介质上\n\
    - 从多种数据源中将信息集成\n\n## 数据仓库的结构\n\n高度综合级\n\n高度综合数据、准决策数据\n\n轻度综合级\n\n从近期基本数据中提取\n\
    \n当前细节级\n\n最近时期业务数据\n\n早期细节级\n\n早期基本数据\n\n## 数据仓库系统的组成\n\n数据源\n\n数据库\n\n数据文件\n\
    \n其他数据源\n\n数据仓库管理工具\n\n数据建模工具\n\n抽取、转换、装载\n\n元数据库\n\n数据仓库管理工具\n\n数据仓库\n\n高度综合数据\n\
    \n轻度综合数据\n\n当前数据\n\n历史数据\n\n分析工具\n\n用户查询工具\n\nOLAP工具\n\nDM工具\n\n## 非结构化数据\n\n\
    - 非结构化数据与传统数据库使用的常规数据结构不同，缺少甚至没有计算机软件解析数据所需的格式语义\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_515_0.png)\n\
    \n## 非结构化数据的现状\n\n个人私有数据\n\n特定领域数据\n\n企业数据\n\nWeb数据\n\n超过80%的数据为非结构化数据，包括声音、影像、工程图、文件、记录资料、演示文稿等。\n\
    \n到2011点8月，FaceBook有上传图片突破100亿张，Flickr上有上传图片60亿张\n\n目视导航视频\n\n雷达导航图像\n\n天文导航图像\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_516_0.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_516_1.png)\n\
    \n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_516_2.png)\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_516_3.png)\n"
