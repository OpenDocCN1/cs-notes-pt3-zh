    \  定义片段的存储点及片段到节点的映象。分布模式的映象类型确定了分布式数据库是冗余的还是非冗余的。\n\n+   - **分布模式/局部数据库概念模式映象（映象4）**\n\
    +   \n+     该映象把存储在局部场地的全局关系或全局关系的片段映象为各局部概念模式。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_460_0.png)"
  - '[PAGE 461]


    # 数据分片


    +   - 分片的方式有多种：

    +     - 水平分片，垂直分片——两种基本的分片方式

    +     - 混合分片，导出分片——较复杂的分片方式'
  - '[PAGE 462]


    # 数据分片方式


    +   - 水平分片

    +     - 将关系依照一定条件按行分为不相交的若干子集，每个子集称为一个水平片段。


    +   - 垂直分片

    +     - 将关系按列分为若干属性子集，每个子集称为一个垂直片段。垂直分片的片段通过连接的方法恢复原关系。因此垂直分片的诸片段通常都包含关系的码。


    +   - 导出分片

    +     - 导出水平分片，分片的条件不是关系本身属性条件，而是其它关系的属性条件。如SC (SNO, CNO, G) 摘S关系中学生所在的系分片。


    +   - 混合分片

    +     - 指按上述三种分片方式得到的片段，继续按另一种方式分片。'
