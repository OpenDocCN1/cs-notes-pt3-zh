  mdcn: "\n\n关系模式通常可以简记作 R(A₁, A₂, …, Aₙ)，R 为关系名，A₁，A₂，…，Aₙ 为属性名，域及属性向域的映射直接说明为属性的类型、长度。\n\
    \n关系是关系模式在某一时刻的状态或内容。关系模式是相对稳定的，而关系是动态的，是随时间不断变化的。\n\n## 一关系数据库（关系数据库的型和值的概念）\n\
    \n- 关系模式的集合构成关系数据库模式——关系数据库的型；\n- 关系的集合则构成具体的关系数据库——关系数据库的值。\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_74_0.png)\n\
    \n## 关系模型的语义约束\n\n- 实体完整性\n- 参照完整性\n- 用户定义完整性\n  - 用户针对具体的应用环境定义的完整性约束条件。\n\n\
    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_75_0.png)\n\n## 关系模型的语义约束\n\n- **实体完整性（Entity\
    \ Integrity）**\n  - 要有属性或属性组合作为主码，主码值不可为空或部分为空。或定义为若属性A是关系R的主属性，则属性A不能取空值。\n \
    \ - 空值的含义是：不知道或不存在的值。\n\n| 学号 | 姓名 | 年龄 | 系别 |\n|---|---|---|---|\n| s1 | A |\
    \ 18 | CS |\n| s2 | B | 18 | CS |\n| s3 | C | 18 | MA |\n\n## 关系模型的语义约束\n\n- 参照完整性\n\
    \  - 外部码\n    - 设F是基本关系R的一个或一组属性，但不是R的码。如果F与基本关系S的主码Ks相对应，则称F是关系R的外部码（Foreign\
    \ Key），并称R为参照关系（Referencing Relation），S为被参照关系（Referenced Relation）或目标关系（Target\
    \ Relation）。R和S不一定是不同的关系。\n    - 目标关系S的主码Ks和参照关系的外码F必须定义在一个域上。\n  - 参照完整性\n  \
    \  - 如果关系R的外码Fk与关系S的主码Pk相对应，则R中的每一个元组的Fk值或者等于S中某个元组的Pk值，或者为空值。\n\n## 关系模型的语义约束\n\
    \n- 参照完整性示例\n\n职工关系 EMP（ENO，ENAME，DNO）和部门关系 DEPT（DNO，DNAME）是两个基本关系。DNO 是 EMP 的外码。\n\
    \nEMP 中每个元组在 DNO 上的取值允许有两种：\n\n- 1. 取空值；\n- 2. 非空，则 DNO 的值必须是 DEPT 中某个元组的 DNO\
    \ 值。\n\n## 关系代数简介\n\n- 关系代数是三种关系运算中的基础方法，有9种：\n  - 常规集合运算：并、差、交、广义笛卡儿积（乘）；\n \
    \ - 特有的关系运算：选择、投影、连接、自然连接、求商。\n\n## 关系演算简介\n\n- 元组演算表达式的形式：\n  { t | Φ(t) },\n\
    \  其中 t 为元组变量， Φ(t)是元组关系演算公式，由原子公式和运算符组成；\n\n- 域关系演算表达式的形式：\n  { (x₁,x₂,...,xₖ)\
    \ | Φ (x₁,x₂,...,xₖ) }\n  其中 xᵢ 代表域变量， Φ为域关系演算公式，由原子公式和运算符组成。\n\n## 关系代数—传统集合运算\n\
    \n- 传统的集合运算是二目运算。除笛卡儿积外，要求参加运算的两个关系必须是同类关系，即两个关系具有相同的度 “n”，且相对应的属性值必须取自同一个域。\n\
    - 设关系R和S是同类关系，可定义关系的集合运算如下：\n\n## 关系代数—传统集合运算\n\n- 并（Union）\n  - 关系R和关系S的并记为R∪S，结果仍为n元关系，由属于R或属于S的元组构成。\n\
    \  - R∪S表达为 R∪S = { t | t ∈ R ∨ t ∈ S }\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_83_0.png)\n\
    \n## 关系代数—传统集合运算\n\n- 差（Difference）\n  - 关系R和关系S的差记为R-S。结果仍为n元关系，由属于R而不属于S的元组构成。\n\
    \  - R-S表达为R−S = {t | t∈R ∧ t∉S }\n\n![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_84_0.png)\n\
    \n## 关系代数—传统集合运算\n\n- 交（Intersection）\n  - 关系R和关系S的交记为R∩S。结果仍为n元关系，由既属于R又属于S的元组构成。\n\
