    # 数据库系统数据管理特点（4）


    +   - 统一的数据控制功能

    +     - 数据的安全性控制

    +       - 保护数据以防止不合法的使用所造成数据的泄露和破坏。

    +     - 数据的完整性控制

    +       - 指数据的正确性与相容性。

    +     - 并发控制

    +       - 对多用户的并发操作进行控制、协调，保护数据的完整性。

    +     - 数据库恢复

    +       - 将数据库从错误状态恢复到某一已知的正确状态'
