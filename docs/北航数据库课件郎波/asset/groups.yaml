    或者


    Fm = {A→B，B→A，A→C}


    +   - 示例2


    F = {C→A，A→G，CG→B，B→A}，求Fm。


    Fm = {A→G，C→B，B→A}'
  - '[PAGE 275]


    # 范式的概念（1）


    +   - 如果一个关系满足某个指定的约束集，则称它属于某种特定的范式（Normal Form）；

    +   - 满足最低要求约束的称为第一范式，简称为1NF，当一个关系只包含原子值这一约束时，称为1NF。原子值即为二维表的每一行和列的交叉位置上总是精确地存在一个值，而不是值集。也就是说不能“表中有表”；

    +   - 满足“原子值”这一约束条件的關係称为规范化关系，简称为范式。在关系数据库中，都是规范化的关系。'
  - '[PAGE 276]


    # 范式的概念（1）


    +   - 范式理论的发展过程：

    +     - 1971- 1972 CODD系统提出1NF，2NF，3NF的概念，讨论了进一步规范化的问题。

    +     - 1974- CODD 和BOYCE提出BCNF。

    +     - 1976- FAGIN 提出4NF，后来又提出了 “投影-连接范式” PJNF，也称5NF。


    +   - 各级范式间的联系：

    +     1NF ⊃ 2NF ⊃ 3NF ⊃ BCNF ⊃ 4NF ⊃ 5NF


    +   - 一个低一级范式的关系模式，通过模式分解可以转换为若干个高级范式的关系模式的集合，这一过程称作规范化。'
  - '[PAGE 277]


    # 2NF（1）


    +   - 定义：若R∈1NF，且每个非主属性完全依赖于码，则称R∈2NF；

    +   - 注意：

    +     - 如果关系R的全体属性都是R的主属性，那么R∈2NF；

    +     - 从1NF中消除非主属性对码的部分函数依赖，则可获得2NF关系；

    +     - 在2NF中，允许主属性部分函数依赖于码。'
  - '[PAGE 278]


    # 2NF（2）


    +   - 2NF的规范化

    +     - 把1NF关系模式规范提高到2NF关系模式的集合。


    例：关系 UN（S#，CN，G，SDN，MN）∈1NF，其属性之间的函数依赖关系，用函数依赖图表示：


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_278_0.png)


    所以 UN ∉ 2NF。'
  - '[PAGE 279]


    # 2NF (3)


    +   采取投影分解方法，消除UN中的非主属性对码的部分函数依赖。


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_279_0.png)


    UN → { SG=UN[S#, CN, G] ∈2NF

    SDM=UN[S#, SDN, MN] ∈2NF }'
  - '[PAGE 280]


    # 2NF（4）


    +   - 2NF存在的弊病

    +     SG=UN[S#, CN, G] ∈2NF

    +     SDM=UN[S#, SDN, MN] ∈2NF


    +   - 插入异常有所改善，但还是存在：如果系中没有学生，则有关系的信息就无法插入。


    +   - 删除异常：如果删除学生的信息，所在系的信息也随之删除了。


    +   - 数据冗余得到一定改善：每个学生都存储了所在系的系主任的信息。'
  - '[PAGE 281]


    # 3NF (1)


    +   - 定义：关系模式R<U, F>中，若不存在这样的码X，属性组Y及非主属性Z(Z⊆Y)，使得下式成立，X→Y，Y→Z，Y⊀X 则称R∈3NF。


    +   - 或定义为：

    +     若关系模式R ∈2NF，且每个非主属性都不传递依赖于R的任何码，则R ∈3NF。'
