    +   - 基本表与导出表

    +     - 基本表：是实际存在的，每个表在存储中可用一个存储文件来表示。

    +     - 导出表:是从基本表导出的表，有视图（View）和快照(Snapshot)。

    +     - 视图是一个虚表。即视图所对应的数据不实际存储在数据库中，只在数据库的数据字典中存储视图的定义。

