  - '[PAGE 206]


    # 局部E-R图的合并（1）


    +   - 消除冲突，合并分E-R图，生成初步E-R图。

    +   - 冲突主要包括：属性冲突、命名冲突和结构冲突


    +   （1）属性冲突：属性的类型、取值范围或取值集合不同，或属性取值单位冲突。

    +   解决——讨论协商解决。


    +   （2）命名冲突：包括属性名、实体名、联系名之间的同名异义，异名同义。

    +   - 同名异义：不同意义的对象具有相同的名字。

    +   - 异名同义：相同意义的对象具有不同名字。

    +   解决——建立命名表，统一命名，异名同义的名字可标为别名。'
  - "[PAGE 207]\n\n# 局部E-R图的合并（2）\n\n# (3) 结构冲突：\n\n+   - 同一对象在不同应用中有不同抽象。如在一应用中为实体，在另一应用中为属性。\n\
