  - '[PAGE 364]


    # 数据转储（1）


    +   - 是DBA定期地将整个数据库复制到磁带或另一个磁盘上保存起来的过程。这些备用的数据文本称为后备副本或后援副本。

    +   - 利用副本进行恢复的基本原理


    ![](img/0e3bdb3629a6dd1eaa4c29e30bfd2664_364_0.png)'
  - '[PAGE 365]


    # 数据转储（2）


    +   - 数据转储分为两种转储状态

    +     - 静态转储：系统中无事务运行时进行的转储操作。并且转储过程中，不允许对数据库进行任何存取、修改。

    +       - 优点：保证副本的数据一致性；

    +       - 缺点：由于转储必须等待正在运行的事务结束才能开始，而新的事务必须等待转储结束才能执行，降低了数据库的可用性。

    +     - 动态转储：转储期间允许对数据库进行存取或修改。

    +       - 优点：不影响数据库的可用性

    +       - 缺点：不能保证副本上的数据正确、有效。还必须把转储期间各事务对数据库的修改记录下来，建立日志文件。后根据副本加上日志文件就能把数据库恢复到某一时刻的正确状态。'
  - '[PAGE 366]


    +   - **数据转储可有两种转储方式**

    +     - **海量转储**

    +       - 海量转储指每次转储全部数据库。

    +     - **增量转储**

    +       - 增量转储指每次只转储上一次转储后更新过的数据。'
  - '[PAGE 367]


    <!-- no content -->'
  - '[PAGE 368]


    +   - **日志文件的作用**


    +     - **事务故障和系统故障恢复必须使用日志文件。**


    +     - 在动态转储方式中必须建立日志文件，后备副本和日志文件综合起来才能有效地恢复数据库。


    +     - 在静态转储方式中，用日志文件恢复转储结束时刻到故障点间的事务。


    +   - **日志文件的写入规则**


    +     - 登记的次序严格按并发事务执行的时间顺序；


    +     - **必须先写日志文件，后写数据库。**'
  - '[PAGE 369]


    # 故障的恢复策略


    +   - 事务故障的恢复—UNDO，即撤销事务

    +     在不影响其它事务的情况下，强行回滚，撤销已做的修改。具体步骤：

    +     - 反向扫描日志文件，查找该事务的更新操作。

    +     - 对该事务的更新操作（插入、删除、修改）执行逆操作，即将日志记录中的“更新前的值”写入数据库。

    +     - 如此处理下去，直到读到该事务的开始标志。'
  - '[PAGE 370]


    # 系统故障——UNDO+REDO


    +   - 系统故障造成数据库不一致状态的原因有两个：

    +     - 一是未完成的事务对数据库的更新可能已经写入数据库；

    +     - 二是已提交事务对数据库的更新可能还留在缓冲区未写入数据库。

    +   - 因此恢复操作就是要撤销(UNDO)故障发生时未完成的事务，重做(REDO)已完成的事务。'
  - '[PAGE 371]


    +   - 系统故障恢复具体步骤：

    +     - 正向扫描日志文件，找到故障发生前已经提交的事务，将其事务标识记入重做（REDO）队列。同时找出故障发生时尚未完成的事务，将其事务标识记入撤销（UNDO）队列。

    +     - 对撤销队列中的各个事务进行UNDO处理。

    +     - 对重做队列中的各个事务进行REDO处理。'
  - '[PAGE 372]


    # • 介质故障的恢复


    – 恢复的方法是：


    +   • 装入最新的数据库后备副本，使数据库恢复到最近一次转储时的一致状态。对于动态转储的副本，还需要装入转储开始时刻的日志文件副本，将数据库恢复到一致状态；

    +   • 装入转储以后的日志文件副本，重做已经完成的事务。'
  - '[PAGE 373]


    # 具有检查点的恢复技术


    +   - 利用日志技术进行恢复时，恢复子系统通常需要检查大量日志记录，存在的问题是：

    +     - 搜索日志耗费大量时间

    +     - 不必要重做某些事务


    +   - 检查点技术可以改善效率，使得在检查点之前提交的事务，在数据库恢复处理时不必重做。'
  - '[PAGE 374]


    # 检查点技术（1）


    +   - 检查点技术在日志文件中增加一类新的记录 — 检查点（checkpoint）记录

    +   - 检查点记录的内容包括：

    +     - 建立检查点时刻所有正在执行的事务清单

    +     - 这些事务最近一个日志记录的地址

    +   - 系统中增加一个重新开始文件，用来记录各个检查点记录在日志文件中的地址

    +   - 恢复于系统在登录日志文件期间动态地维护日志'
  - '[PAGE 375]


    # 检查点技术（2）


    +   - 动态维护日志文件的方法是周期性地执行如下操作：

    +     - 将当前日志缓存中的所有日志记录写入磁盘的日志文件上。

    +     - 在日志文件上写入一个检查点记录。

    +     - 将当前数据缓存的所有数据记录写入磁盘的数据库中。

    +     - 把检查点记录在日志文件中地址写入重新开始文件。'
  - '[PAGE 376]


    # 利用检查点技术进行恢复


    +   - **定位最近检查点记录**：在重新开始文件中找到最后一个检查点记录在日志文件中的地址。

    +   - **找到检查点时则运行事务清单**：由该检查点记录得到检查点建立时刻所有正在运行的事务清单 ACTIVE-LIST，把 ACTIVE-LIST
    暂时放入 UNDO-LIST。

    +   - **确定需要撤消和重做的事务**：从检查点开始正向扫描日志文件，做如下处理，直到文件结束。

    +     - 如果有新开始的事务 Tᵢ，把 Tᵢ 暂时放入 UNDO-LIST；

    +     - 如果有提交的事务 Tⱼ，把 Tⱼ 从 UNDO-LIST 队列移入到 REDO-LIST 队列；

    +   - **执行撤消或重做动作**：对 UNDO-LIST 中的每一个事务执行 UNDO 操作，对 REDO-LIST 中的每个事务执行 REDO 操作。'
