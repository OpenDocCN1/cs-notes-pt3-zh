  md: "# 算法\n\n```\nprocedure DEL(A, n, item)\nfor i←1 to n do\n  if (A[i]=item) then\n\
    \    [ for j←i+1 to n do\n      A[j-1]←A[j]\n      end\n      n←n-1 ]\n  end\n\
