- pgno: 292
  md: "# 2. 查找算法\n\n# 递归算法\n\n```\nfunction SORTSEARCH1( T, key )\n    if (T≠nil)\
    \ then\n    [ if (data(T)=key) then\n        return(T)                // 查找成功\
    \ //\n      if (data(T)<key) then       // 查找T的右子树 //\n        return( SORTSEARCH1(\
    \ rchild(T), key) )\n      else\n        return( SORTSEARCH1( lchild(T), key)\
    \ ) ]\n                              // 查找T的左子树 //\n    else\n      return(nil)\
    \                // 查找失败 //\nend\n```"
  merge: -1
