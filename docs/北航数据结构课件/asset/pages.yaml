  md: "# 算法\n\nO(n²)\n\nO(n)\n\n```\nprocedure DEL(A, n)\n    i ← 1\n    while (i\
    \ < n) do\n        if (A[i] ≠ A[i+1]) then\n            i ← i + 1\n        else\n\
    \            [ for j ← i+1 to n do\n              A[j-1] ← A[j]\n            \
