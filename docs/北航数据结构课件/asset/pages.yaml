  md: '# 4. 图的连通


    # （1）. 无向图的连通


    无向图中顶点$v_i$到$v_j$有路径，则称顶点$v_i$与$v_j$是连通的。若无向图中任意两个顶点都连通，则称该无向图是连通的。


    # （2）. 有向图的连通


    若有向图中顶点$v_i$到$v_j$有路径，并且顶点$v_j$到$v_i$也有路径，则称顶点$v_i$与$v_j$是连通的。若有向图中任意两个顶点都连通，则称该有向图是强连通的。'
  merge: -1
