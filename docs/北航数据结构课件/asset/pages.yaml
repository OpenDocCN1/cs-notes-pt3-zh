- pgno: 283
  md: '# 二. 二叉排序树的建立 (逐点插入法)


    设K=(k₁, k₂, k₃, ..., kₙ)为具有n个数据元素的序列。从序列的第一个元素开始,依次取序列中的元素,每取一个元素kᵢ, 按照下述原则将kᵢ插入到二叉树中:


    +   1. 若二叉树为空,则kᵢ作为该二叉树的根结点;

    +   2. 若二叉树非空,则将kᵢ与该二叉树的根结点的

    +   值进行比较,若kᵢ小于根结点的值,则将kᵢ插入

    +   到根结点的左子树中; 否则,将kᵢ插入到根结

    +   点的右子树中。


    将kᵢ插入到左子树或者右子树中仍然遵循上述原则.'
  merge: -1
  img_proc: true
