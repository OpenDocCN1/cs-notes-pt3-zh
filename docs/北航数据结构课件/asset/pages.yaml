- pgno: 263
  md: '```

    procedure INORDER(T)

    if (T=nil) then

    return

    top←0

    p←T

    repeat

    while (p≠nil) do

    if (top=M) then

    [ call ERROR(''overflow!'')

    return ]

    top←top+1

    STACK[top]←p

    p←lchild(p)

    end

    p←STACK[top]

    top←top-1

    call VISIT(p)

    p←rchild(p)

    until (p=nil and top=0)

    end

    ```


    ![](img/f94080b0b6a6124b22e8484de896d7b7_263_0.png)'
