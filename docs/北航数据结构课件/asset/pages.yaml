- pgno: 296
  md: '# 关于广义表形式表示二叉树的说明


    +   1. **约定：**表中的一个字母代表一个结点的数据信息。

    +   2. 每个根结点作为由子树构成的表的名字放在表的前面。

    +   3. 每个结点的左子树和右子树之间用逗号分开，若只有右子树而无左子树，则逗号不能省略。

    +   4. 在整个广义表的末尾加一个特殊符号（如 @）作为结束标志。


