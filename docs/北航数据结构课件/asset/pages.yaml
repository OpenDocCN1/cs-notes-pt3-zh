  md: '# 三、排序的分类


    # 按使用的存储器分


    # 内排序


    当参加排序的数据量不大，以致于能够一次将参加排序的数据全部装入内存实现排序。


    # 外排序


    当参加排序的数据量很大，以致于不能够一次将参加排序的数据全部装入内存，排序过程中需要不断地通过内存与外存之间的数据交换达到排序目的。'
