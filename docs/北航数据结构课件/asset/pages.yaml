    f(m, n) = { m+n+1 当m×n=0时

    f(m-1, f(m, n-1)) 当m×n≠0时 }


    # 递归算法：


    ```

    function F( m, n )

    if (m×n=0) then

    return( m+n+1 )

    else

    return( F( m-1, F(m, n-1)) )

    end

    ```'
