  md: '# 8.5 最短路径问题


    # 一. 路径长度的定义


    +   1. 不带权的图：路径上所经过的边的数目。

    +   2. 带权的图：路径上所经过的边上的权值之和。


    # 二. 问题的提出


    设出发顶点为v(通常称为源点)。


    # 三. 解决问题所需要确定的数据结构


    +   1. 图的存储: 以1~n 分别代表n个顶点,采用邻接矩阵存储该图,有


    A[i, j] = { w_ij 当顶点v_i 到顶点v_j 有边, 且权为w_ij

    ∞ 当顶点v_i 到顶点v_j 无边时

    0 当v_i=v_j 时 }'
  merge: -1
  img_proc: true
- pgno: 349
  md: '2. 设置一个标志数组S[1:n]记录源点v 到图中哪些顶点的最短路径已经找到，有：

    S[i] = { 1 表示源点到顶点i 的最短路径已经找到

    0 表示源点到顶点i 的最短路径尚未找到

    初始时， S[v]=1， S[i]=0 i=1,2,...,n i≠v


    3. 设置数组dist[1:n] 分别记录源点v 到图中各顶点的最短路径的路径长度，其中，dist[i]记录源点到顶点i 的最短路径的长度；初始时，dist数组的值为邻接矩阵第v
    行的n 个元素值。


    4. 设置数组path[1:n] 分别记录源点v 到图中各顶点的最短路径所经过的顶点序列，其中，path[i]记录源点到顶点i 的路径，初始时，path[i]={
    v }， i=1,2,3,...,n'
  merge: -1
