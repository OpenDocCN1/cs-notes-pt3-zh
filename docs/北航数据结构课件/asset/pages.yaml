  md: '# 算法分析


    如果图中具有n个顶点、e条边，则


    +   - 若采用邻接表存储该图，由于邻接表中有2e个边结点，因而扫描边结点的时间为O(e)；而所有顶点都递归访问一次，所以，算法的时间复杂度为O(n+e)。

    +   - 若采用邻接矩阵存储该图，则查找每一个顶点所依附的所有边的时间复杂度为O(n)，因而算法的时间复杂度为O(n²)'
