  md: '# 10.7 堆积排序法


    # 一. 堆积的定义


    +   1. n个元素的序列（k₁, k₂, ..., kₙ），当且仅当满足条件


    (1) { kᵢ ≥ k₂ᵢ

    kᵢ ≥ k₂ᵢ₊₁ } 或者 (2) { kᵢ ≤ k₂ᵢ

    kᵢ ≤ k₂ᵢ₊₁ }

    i=1, 2, 3, ..., ⌊n/2⌋


    称该序列为一个堆积(heap)。


    称满足条件(1)的堆积为大顶堆积，称满足条件(2)的堆积为小顶堆积。


    本课程选择(1)


