- pgno: 364
  md: '# 二. AOE网的存储方法


    采用邻接矩阵存储方法。


    # 三. 关键路径


    +   1. 关键路径的定义


    从源点到终点的路径中具有最大路径长度的路径为关键路径；关键路径上的活动称为关键活动。


    +   2. 关键路径的特点


    +   1) 关键路径的长度(路径上的边的权值之和)为完成整个工程所需要的最短时间。


    +   2) 关键路径的长度变化(即任意关键活动的权值变化)将影响整个工程的进度，而其他非关键活动在一定范围内的变化不会影响工期。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_364_0.png)'
  merge: -1
  img_proc: true
