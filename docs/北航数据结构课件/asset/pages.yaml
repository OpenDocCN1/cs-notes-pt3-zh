- pgno: 64
  md: "# 正确的算法：\n\n```\nprocedure DEL(A, n, item)\n  i←1\n  while (i≤n) do\n    if\
    \ (A[i]=item) then\n      | for j←i+1 to n do\n          A[j-1]←A[j]\n      end\n\
    \      n←n-1 |\n    else\n      i←i+1\n    end\n  end\n\n  O(n²)\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "# 改进后的算法\n\n```\nprocedure DEL(A, n, item)\n  k←0\n  for i←1 to n do\n    if\
    \ (A[i]=item) then\n      k←k+1\n    else\n      A[i−k]←A[i]\n    end\n  n←n−k\n\
    end\n\nO(n)\n```"
  merge: -1
  img_proc: true
