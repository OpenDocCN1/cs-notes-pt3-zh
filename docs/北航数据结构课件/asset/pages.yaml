  md: "# 折半查找算法\n\n```\n```text\nfunction BINSEARCH(KEY, n, k)\n    low←1\n    high←n\n\
    \    while (low≤high) do\n        mid←⌊(low+high)/2⌋\n        if (KEY[mid]=k)\
    \ then\n            return mid        // 查找成功 //\n        if (k>KEY[mid]) then\n\
    \            low←mid+1         // 查找后半部分 //\n        else\n            high←mid-1\
    \        // 查找前半部分 //\n        end\n    return(0)                 // 查找失败 //\n\
    end\n```\n```"
