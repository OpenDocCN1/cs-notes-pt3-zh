- pgno: 393
  md: '# 9.2 顺序文件


    # 一. 顺序文件的基本概念


    在物理结构中记录排列的先后次序与在逻辑结构中记录排列的先后次序一致的文件称为顺序文件。


    记录的排列按关键字值有序的顺序文件称为排序顺序文件，否则，称为一般顺序文件。


    逻辑上划分


    在存储介质上采用连续组织方式的顺序文件称为连续顺序文件；采用链接组织方式的顺序文件称为链接顺序文件。


    物理上划分


    若排序顺序文件在存储介质上采用连续组织方式，称之为排序连续顺序文件。'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# 二. 连续顺序文件的查找


    # 1. 顺序查找法


    查找思想: 从文件的第一个记录开始，将用户给出的关键字值与当前被查找记录的关键字值进行比较，若匹配，则查找成功，给出被查到的记录在文件中的位置，查找结束。若所有n个记录的关键字值都已比较，不存在与用户要查的关键字值匹配的记录，则查找失败，给出信息0。


    ( key₁, key₂, key₃, ......, keyₙ )


