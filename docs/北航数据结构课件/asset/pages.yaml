    | 2 | n-1 |

    | 3 | n-2 |

    | … | … |


    第 i 趟排序前，序列中未排序序列的元素个数


    每一趟排序从序列中没有排好序的元素中选择一个值最小的元素，与没有排好序的元素最前面那个元素交换位置。'
