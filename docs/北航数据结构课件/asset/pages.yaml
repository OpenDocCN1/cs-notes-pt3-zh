- pgno: 345
  md: '# 二、求最小生成树


    # 普里姆（Prim）算法：


    设 G=(V, GE) 为具有 n 个顶点的带权连通图；

    T=(U, TE) 为正在生成的最小生成树，

    初始时，TE=空，U={v₁}，v₁∈V。


    依次在 G 中选择一条一个顶点仅在 V 中，另一个顶点在 U 中，并且权值最小的边加入集合 TE，同时将该边仅在 V 中的那个顶点加入集合 U。重复上述过程
    n-1 次，使得 U=V，此时 T 为 G 的最小生成树。'
  merge: -1
  img_proc: true
