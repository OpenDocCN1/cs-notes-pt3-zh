    \   // 没有找到满足条件的结点 //\n    call GETNODE(p)              // 申请一个新的结点 //\n    data(p)←item\n\
    \    llink(p)←q\n    rlink(p)←rlink(q)\n    llink(rlink(q))←p\n    rlink(q)←p\n\
