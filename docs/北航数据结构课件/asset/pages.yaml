- pgno: 172
  md: '# 二. 插入(进栈)算法


    ![](img/f94080b0b6a6124b22e8484de896d7b7_172_0.png)


    ```

    procedure PUSH_LINK_STACK( top, item )

    call GETNODE(p)        //申请一个新结点//

    data(p)←item          //将item送新结点数据域//

    link(p)←top           //将新节点插在链表最前面//

    top←p                 //修改栈顶指针的指向//

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: "# 三. 删除(退栈)算法\n\n![](img/f94080b0b6a6124b22e8484de896d7b7_173_0.png)\n\n```\n\
    procedure POP_LINK_STACK( top, item )\nif (top = nil) then\n    call STACK_EMPTY(\
    \ 'Stack is empty!' )\nelse\n    [ p←top                //暂时保存栈顶节点的地址//\n    \
    \  item←data(top)       //保存被删栈顶的数据信息//\n      top←link(top)        //删去栈顶节点//\n\
    \      call RET(p) ]        //释放被删节点//\nend\n```"
  merge: -1
  img_proc: true
