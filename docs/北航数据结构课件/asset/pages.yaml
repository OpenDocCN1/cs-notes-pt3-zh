  md: '# 7.4 二叉树的存储结构


    # 一、二叉树的顺序存储结构


    # 1. 完全二叉树的顺序存储结构


    根据完全二叉树的性质5，对于深度为 h 的完全二叉树，将树中所有结点的数据信息按照编号的顺序依次存储到一维数组 BT[1:2^h-1] 中，由于编号与数组下标一一对应，该数组就是该完全二叉树的顺序存储结构。


