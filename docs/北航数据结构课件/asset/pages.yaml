- pgno: 281
  md: '# 7.7 二叉排序树


    # 一. 二叉排序树的定义


    ![](img/f94080b0b6a6124b22e8484de896d7b7_281_0.png)


    二叉排序树或者为空二叉树，或者为具有以下性质的二叉树：


    若根结点的左子树不空，则左子树上所有节点的值都小于根节点的值；


    若根结点的右子树不空，则右子树上所有节点的值都大于或者等于根节点的值；


    每一棵子树分别也是二叉排序树.'
  merge: -1
  img_proc: true
