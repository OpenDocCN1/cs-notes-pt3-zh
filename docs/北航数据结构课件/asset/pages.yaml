- pgno: 336
  md: '# 8.3 图的遍历


    # 以无向图为例


    从图中某个指定的顶点出发，按照某一原则对图中所有顶点都访问一次，得到一个由图中所有顶点组成的序列，这一过程称为图的遍历。


    # 一. 深度优先搜索


    # 原则


    从图中某个指定的顶点v出发,先访问顶点v,然后从顶点v 未被访问过的一个邻接点出发, 继续进行深度优先遍历,直到图中与v相通的所有顶点都被访问；若此时图中还有未被访问过的顶点,
    则从另一个未被访问过的顶点出发重复上述过程,直到遍历全图。'
  merge: -1
  img_proc: true
