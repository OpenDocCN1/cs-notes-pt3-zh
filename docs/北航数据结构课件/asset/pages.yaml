- pgno: 356
  md: '# 三. 拓扑排序


    检查AOV网是否存在回路的方法是对AOV网进行拓扑排序，构造一个序列，使得该序列满足条件：


    +   1. 若在AOV网中，顶点i 优先于顶点j，则在该序列中也是顶点i 优先于顶点j。


    +   2. 若在AOV网中，顶点i 与顶点j之间不存在优先关系，则在该序列中建立它们的优先关系，即顶点i 优先于顶点j，或顶点j 优先于顶点i。


    +   3. 若能够构造出拓扑序列，则拓扑序列包含AOV网的全部顶点。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 四、拓扑排序方法


    +   1. 从AOV网中任选一个没有前驱（入度为0）的顶点；


    +   2. 从AOV网中去掉该顶点以及以该顶点为出发点的所有边；


    +   3. 重复上述过程，直到网中的所有顶点都被去掉，或者网中还有顶点，但不存在入度为0的顶点。


    > 前者说明AOV网中无回路，后者说明AOV网中存在回路。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 用自然语言描述的算法


    +   1. 首先建立一个入度为0的顶点堆栈，将网中所有入度为0的顶点分别进栈。


    +   2. 当入度为0的顶点栈不空时，反复执行以下动作：

    +      - 从顶点栈中退出一个顶点，并输出它；

    +      - 从AOV网中删去该顶点以及以它发出的所有边，并同时分别将这些边的终点的入度减1；

    +      - 若此时边的终点的入度为0，则将该顶点进栈；


    +   3. 若输出的顶点个数少于AOV网中的顶点个数，则报告网中存在有向回路；否则，说明该网中不存在回路。'
  merge: -1
