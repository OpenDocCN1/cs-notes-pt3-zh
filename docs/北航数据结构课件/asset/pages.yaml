- pgno: 275
  md: '# 指针与线索的区分方法之一：


    | lbit | lchild | data | rchild | rbit |


    lbit(p) = { 0 表示 lchild(p) 为指向直接前驱的线索

    1 表示 lchild(p) 为指向左孩子的指针 }


    rbit(p) = { 0 表示 rchild(p) 为指向直接后继的线索

    1 表示 rchild(p) 为指向右孩子的指针 }'
