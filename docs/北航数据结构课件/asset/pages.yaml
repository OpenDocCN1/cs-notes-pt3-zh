- pgno: 273
  md: '# 二、什么是线索二叉树


    利用二叉链表中空的指针域指出结点在遍历序列中的直接前驱和直接后继；这些指向前驱和后继的指针称为线索，加了线索的二叉树称为线索二叉树。


    # 三、线索二叉树的构造


    利用链结点的空的左指针域存放该结点的直接前驱的地址, 空的右指针域存放该结点直接后继的地址；而非空的指针域仍然存放结点的左孩子或右孩子的地址。'
  merge: -1
