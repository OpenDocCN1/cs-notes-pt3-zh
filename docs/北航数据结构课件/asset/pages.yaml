  md: "```\nprocedure BININSERTSORT( K, n )\n  for i←2 to n do\n    temp←K[i]\n  \
    \  low←1\n    high←i-1\n    while (low≤high) do\n      mid←⌊(low+high)/2⌋\n  \
    \    if (temp<K[mid]) then\n        high←mid-1\n      else\n        low←mid+1\n\
    \    end\n    for j←i-1 downto low do\n      K[j+1]←K[j]\n    end\n    K[low]←temp\n\
    \  end\nend\n```\n\n采用折半查找方法确定插入位置\n\n![](img/f94080b0b6a6124b22e8484de896d7b7_448_0.png)"
