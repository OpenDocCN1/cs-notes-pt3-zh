- pgno: 38
  md: '# 2.1 线性表的基本概念


    # 一、线性表的定义


    A=(a₁, a₂, a₃, ..., , aₙ)


    # 1. 线性关系


    +   (1) 当1<i<n时，

    +   aᵢ的直接前驱为aᵢ₋₁，aᵢ的直接后继为aᵢ₊₁。

    +   (2) 除了第一个元素与最后一个元素，序列中任何一个元素有且仅有一个直接前驱元素，有且仅有一个直接后继元素。

    +   (3) 数据元素之间的先后顺序为“一对一”的关系。'
  merge: -1
