- pgno: 239
  md: '# 二. 两种特殊形态的二叉树


    # 1. 满二叉树


    若一棵二叉树中的结点，或者为叶结点，或者具有两棵非空子树，并且叶结点都集中在二叉树的最后面一层. 这样的二叉树为满二叉树.


    ![](img/f94080b0b6a6124b22e8484de896d7b7_239_0.png)


    # 2. 完全二叉树


    若一棵二叉树中只有最下面两层的结点的度可以小于2，并且最下面一层的结点(叶结点)都依次排列在该层从左至右的位置上。这样的二叉树为完全二叉树.


    ![](img/f94080b0b6a6124b22e8484de896d7b7_239_1.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 三. 二叉树的性质


    # 0. 具有n个结点的非空二叉树共有n-1个分支。


    证明：


    除了根结点以外，每个结点有且仅有一个双亲结点，即每个结点与其双亲结点之间仅有一个分支存在，因此，具有n个结点的非空二叉树的分支总数为n-1。


    证毕'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 1. 非空二叉树的第i层最多有2^{i-1}个结点(i≥1)。


    证明(采用归纳法)


    +   (1). 当i=1时, 结论显然正确。非空二叉树的第1层有且仅有一个结点, 即树的根结点。


    +   (2). 假设对于第j层(1≤j≤i−1)结论也正确, 即第j层最多有2^{j-1}个结点。


    +   (3). 由定义可知, 二叉树中每个结点最多只能有两个孩子结点。若第i−1层的每个结点都有两棵非空子树, 则第i层的结点数目达到最大。而第i−1层最多有2^{i-2}个结点已由假设证明,
    于是, 应有


    证毕。 2×2^{i-2} = 2^{i-1}'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 2. 深度为h 的非空二叉树最多有2^h−1个结点。


    证明：


    由性质1可知, 若深度为h的二叉树的每一层的结点数目都达到各自所在层的最大值, 则二叉树的结点总数一定达到最大。即有

    2^0+2^1+2^2+...+2^{i-1}+...+2^{h-1}=2^h-1


    证毕'
  merge: -1
