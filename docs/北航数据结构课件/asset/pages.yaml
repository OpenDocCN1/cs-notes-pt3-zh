- pgno: 462
  md: "![](img/f94080b0b6a6124b22e8484de896d7b7_462_0.png)\n\n```\nprocedure QUICKSORT(\
    \ K, s, t )\nif (s<t) then\n[\n i←s\n j←t+1\n temp←K[s]\n loop\n  repeat\n   i←i+1\n\
    \  until (temp≤K[i] or i=t)\n  repeat\n   j←j-1\n  until (temp≥K[j] or j=s)\n\
    \  if (i<j) then\n   call SWAP( K[i], K[j] )\n  else\n   exit\n forever\ncall\
    \ SWAP( K[s], K[j] )\ncall QUICKSORT( K, s, j-1 )\ncall QUICKSORT( K, j+1, t )\
    \ ]\nend\n```\n\n![](img/f94080b0b6a6124b22e8484de896d7b7_462_1.png)"
