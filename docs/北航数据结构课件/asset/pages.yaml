- pgno: 470
  md: "# 四. 调整子算法\n\n功能：将以编号为 i 的结点作为根的子树调整为一个堆积。\n\n```\nprocedure ADJUST(K, i, n)\n\
    \  temp ← K[i]\n  j ← 2 × i\n  while (j ≤ n) do\n    if (j < n and K[j+1] > K[j])\
    \ then\n      j ← j + 1\n    if (temp ≥ K[j]) then\n      [ K[⌊j/2⌋] ← temp\n\
    \        return ]\n    K[⌊j/2⌋] ← K[j]\n    j ← 2 × j\n  end\n  K[⌊j/2⌋] ← temp\n\
    end\n```\n\nK：序列\ni：被调整的二叉树的根的序号\nn：被调整的二叉树的结点数目"
  merge: -1
  img_proc: true
