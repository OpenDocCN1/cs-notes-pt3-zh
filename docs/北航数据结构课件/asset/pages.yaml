  md: '# 7.3 二叉树


    # 一. 二叉树的定义


    > 二叉树是有序树


    二叉树是n≥0个节点的有穷集合D与D上关系的集合R构成的结构。当n=0时，称该二叉树为空二叉树；否则，它为包含了一个根结点以及两棵不相交的、分别称之为左子树与右子树的二叉树。


    > 递归定义'
