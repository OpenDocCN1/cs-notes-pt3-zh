- pgno: 32
  md: '# 时间复杂度


    一个程序在计算机中运行时间的多少与诸多因素有关，其中主要有：


    +   1. 问题的规模。

    +   2. 编译程序功能强弱以及所产生的机器代码质量的优劣。

    +   3. 机器执行一条指令的时间长短。

    +   程序中语句的执行次数。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 频率统计法


    以语句执行的次数的多少作为算法的时间量度的分析方法称为频率统计法。


    一条语句的频度是指该语句被执行的次数，而整个算法的频度是指算法中所有语句的频度之和。'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# 例\n\n```\nprocedure MATRIX( A, B, C, n )\n    for i←1 to n do -----------------------------\
    \ n+1\n        for j←1 to n do ------------------- n(n+1)\n            C[i, j]←0\
    \ ----------------------------- n²\n            for k←1 to n do ---------- n²(n+1)\n\
    \                C[i, j]←C[i, j]+A[i, k]×B[k, j] --- n³\n            end\n   \
    \     end\n    end\nend\n```\n\n求两个n阶矩阵的乘积\n\n# 算法的频度：\n\nf(n) = n+1 + n(n+1)\
    \ + n² + n²(n+1) + n³\n= 2n³ + 3n² + 2n + 1"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 关于符号O的定义


    当 n→∞ 时，有 f(n)/g(n)=常数≠0，

    则称函数 f(n) 与 g(n) 同阶，或者说，f(n) 与 g(n) 同一个数量级，记作

    f(n)=O(g(n))

    称上式为算法的时间复杂度，或称该算法的时间复杂度为 O(g(n))。其中，n 为问题的规模(大小)的量度。


    limₙ→∞ (f(n)/g(n)) = limₙ→∞ (2n³ + 3n² + 2n + 1)/n³ = 2

    称算法的时间复杂度为 O(n³)。

    g(n)'
  merge: -1
  img_proc: true
