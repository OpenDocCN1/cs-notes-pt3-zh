- pgno: 351
  md: '![](img/f94080b0b6a6124b22e8484de896d7b7_351_0.png)


    +   1. 确定 dist、S、path 三个数组的初值。

    +   2. 利用 S 数组与 dist 数组在那些尚未找到最短路径的顶点中确定一个与源点最近的顶点，并置 S[u] 为1，同时将顶点 u 加入 path[u]。

    +   3. 根据顶点 u 修改源点到所有尚未找到最短路径的顶点的路径长度。

    +      1) 将源点 v 到顶点 u 的（最短）路径长度分别加到源点 v 通过顶点 u 可以直接到达、且尚未找到最短路那些顶点的路径长度上；若加后的长度小于原来
