- pgno: 457
  md: "# # 算法\n\n```\nprocedure SHELLSORT(K, n)\nd←n\nwhile (d>1) do\n    d←⌊d/2⌋\n\
    \    repeat\n        flag←0\n        for i←1 to n-d do\n            j←i+d\n  \
    \          if (K[i]>K[j]) then\n                [\n                    temp←K[i]\n\
    \                    K[i]←K[j]\n                    K[j]←temp\n              \
    \      flag←1\n                ]\n            end\n        until flag=0\n    end\n\
    end\n```\n\n经过 Shell 排序\n\nO(nlogn)\n\n非稳定性排序方法"
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 10.6 快速排序法


    # 一、核心思想


    可以选第一个或者最后一个、或位置居中的那个元素作为分界元素


    从当前参加排序的元素中任选一个元素（通常称之为分界元素）与当前参加排序的那些元素进行比较，凡是小于分界元素的元素都移到分界元素的前面，凡是大于分界元的元素都移到分界元素的后面，分界元素将当前参加排序的元素分成前后两个部分，而分界元素处在排序的最终位置。然后，分别对这两部分中大小大于1的部分重复上述过程，直到排序结束。


    递归过程'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# 二. 算法步骤


    # 方法一


    # 算法中用到的变量：


    s：当前参加排序的那些元素的第一个元素在序列中的位置，初始值为1。


    t：当前参加排序的那些元素的最后一个元素在序列中的位置，初始值为n。


    temp: 保存分界元素。


    i, j：两个位置变量，初始值分别为s 与t+1。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_459_0.png)'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# 步骤


    +   1. 反复执行动作 i←i+1，直到 temp≤K[i] 或者 i=t。

    +      反复执行动作 j←j-1，直到 temp≥K[j] 或者 j=s。

    +   2. 若 i<j，则 K[i] 与 K[j] 交换位置，转到第 1 步。

    +   3. 若 i≥j，则 K[s] 与 K[j] 交换位置，到此，分界元素 K[s] 的最终位置已经确定，然后对被 K[s] 分成的两部分中大小大于 1
    的部分重复上述过程，直到排序结束。'
  merge: -1
  img_proc: true
