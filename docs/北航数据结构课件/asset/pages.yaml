- pgno: 146
  md: '对于一个 m×n 的稀疏矩阵，分别建立 m 个行的循环链表与 n 个列的循环链表，每个非零元素用一个链结点存储。


    链结点的构造为：


    | row | col | value |

    |---|---|---|

    | down | right |  |


    其中，row、col、value 分别表示某个非零元素所在的行号、列号和元素的值；down 和 right 分别为向下与向右指针，分别用来链接同一列中的与同一行中的所有非零元素对应的链结点。'
  merge: -1
