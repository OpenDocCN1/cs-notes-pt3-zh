- pgno: 11
  md: '# 存储结构


    具有某种逻辑结构的数据在计算机存储器中的存储方式(存储映射)。


    # 1. 顺序存储结构


    用一组地址连续的存储单元依次存放数据元素，数据元素之间的逻辑关系通过元素的地址直接反映。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_11_0.png)


    # 2. 链式存储结构


    用一组地址任意的存储单元依次存放数据元素，数据元素之间的逻辑关系通过指针间接地反映。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_11_1.png)


    链表结构！'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 3. 索引存储结构


    构造原理：

    利用数据元素的索引关系来确定数据元素的存储位置，由数据元素本身与索引表两部分组成。


    特点：

    诸如查找、插入和删除等操作的时间效率较高，但存储空间开销较大。


    # 4. 散列存储结构


    构造原理：

    通过事先准备好的散列函数关系与处理冲突的方法来确定数据元素的存储位置。


    特点：

    诸如查找、插入和删除等操作的时间效率较高，主要缺点是确定好的散列关系比较困难。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_12_0.png)'
  merge: -1
  img_proc: true
