- pgno: 455
  md: "# 10.5 谢尔(Shell)排序法\n\n# 核心思想\n\n首先确定一个元素的间隔数 d。将参加排序的元素按照 d 分隔成若干个子序列（即分别把那些位置相隔为\
    \ d 的元素看作一个子序列），然后对各个子序列采用某一种排序方法进行排序。此后减少 d 值，重复上述过程，直到 d<1 为止。\n\n减少 d 的方法之一：\n\
    \n\\[\n d_1 = \\lfloor n/2 \\rfloor\n\\]\n\\[\n d_i = \\lfloor d_{i-1}/2 \\rfloor,\
    \ \\quad i=2,3,4,\\ldots\n\\]"
  merge: -1
