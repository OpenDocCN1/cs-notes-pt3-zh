  md: "# 算法\n\n```\nprocedure INSERTD( list, x, item )\n    q←rlink(list)        \
    \        // q 初值时指向头结点的下一个结点 //\n    while (q≠list and data(q)≠x) do\n       \
    \ q←rlink(q)\n    end                         // 寻找满足条件的链结点 //\n    if (q=list)\
