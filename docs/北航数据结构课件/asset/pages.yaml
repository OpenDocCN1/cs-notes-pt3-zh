  md: "# 六. 堆积排序算法\n\n```\nprocedure HEAPSORT( K, n )\n  for i←⌊n/2⌋ downto 1 do\n\
    \    call ADJUST( K, i, n )\n  end\n  for i←n-1 downto 1 do\n    temp←K[i+1]\n\
    \    K[i+1]←K[1]\n    K[1]←temp\n    call ADJUST( K, 1, i )\n  end\nend\n```\n\
    \n建初始堆积\n\n具体排序"
