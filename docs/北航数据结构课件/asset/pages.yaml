- pgno: 52
  md: '# 算法时间复杂度分析


    通常采用元素移动次数的平均值作为衡量插入和删除算法时间效率的主要指标。


    若设p_i为插入一个元素于线性表第i个位置的概率

    （概率相等），则在长度为n的线性表中插入一个元素需要移动其他元素的平均次数为：


    T_is = Σ_{i=1}^n P_i (n-i+1) = Σ_{i=1}^n (n-i+1)/(n+1) = n/2


    称该算法的时间复杂度是O(n)。'
  merge: -1
  img_proc: true
