- pgno: 257
  md: "# 前序遍历\n\n```\nprocedure PREORDER( T )\n    if (T≠nil) then\n    [ call VISIT(\
    \ T )\n      call PREORDER( lchild(T) )\n      call PREORDER( rchild(T) ) ]\n\
    end\n```\n\n# 后序遍历\n\n```\nprocedure POSTORDER( T )\n    if (T≠nil) then\n   \
    \ [ call POSTORDER( lchild(T) )\n      call POSTORDER( rchild(T) )\n      call\
    \ VISIT( T ) ]\nend\n```"
  merge: -1
  img_proc: true
