  md: "# 算法\n\n```\nprocedure BUBBLESORT( K, n )\n    flag←1\n    i←n-1\n    while\
    \ (i>0 and flag=1) do\n        flag←0\n        for j←1 to i do\n            if\
    \ (K[j]>K[j+1]) then\n            [  temp←K[j]\n            K[j]←K[j+1]\n    \
    \        K[j+1]←temp      // 交换两个元素的位置 //\n            flag←1  ]\n        end\n\
