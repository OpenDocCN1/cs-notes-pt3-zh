  md: "# 算法\n\n```\nprocedure CIRCULATE(A, n, k)\n  for t←1 to k do\n    temp←A[n-1]\
    \      // 保存数组最后一个元素 //\n    for j←n-2 downto 0 do\n      A[j+1]←A[j]\n    end\n\
    \    A[0]←temp\n  end\nend\n```\n\n数组的所有元素右移1位\n\n```\nfor t←1 to k do\n  temp←A[0]\
    \      //保存数组第一个元素//\n  for j←n-1 downto 1 do\n    A[(j+1) MOD n]←A[j]\n  end\n\
    \  A[1]←temp\nend\n```"
