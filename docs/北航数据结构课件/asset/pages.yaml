- pgno: 396
  md: '# 平均查找长度ASL


    确定记录在文件中位置所进行的关键字比较的次数的平均值（期望值）。


    对于具有 n 个记录的文件，查找成功的平均查找长度为


    $$ASL=\sum_{i=1}^{n}p_i c_i$$


    其中，$p_i$为查找第i个记录的概率，$c_i$为查找第i个记录所进行过的关键字的比较次数。


    对于顺序文件，若查找概率相等，则有


    $$ASL=\sum_{i=1}^{n}p_i c_i=\frac{1}{n}\sum_{i=1}^{n}i=\frac{n+1}{2}$$


    $O(n)$'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# 2. 排序连续顺序文件的折半查找法


    （二分查找法、对半查找法）


    # 查找思想：


    将要查找的关键字值与当前查找范围内位置居中的记录的关键字的值进行比较，若匹配，则查找成功，给出被查到记录在文件中的位置，查找结束。若要查找的关键字值小于位置居中的记录的关键字值，则到当前查找范围的前半部分重复上述查找过程，否则，到当前查找范围的后半部分重复上述查找过程，直到查找成功或者失败。若查找失败，则给出信息0。'
  merge: -1
  img_proc: true
