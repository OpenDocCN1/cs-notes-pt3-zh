- pgno: 161
  md: '# 4.1 堆栈的基本概念


    # 一. 堆栈的定义


    堆栈 是一种只允许在表的一端进行插入操作和删除操作的线性表。允许操作的一端称为栈顶，栈顶元素的位置由一个称为栈顶指针的变量给出。当表中没有元素时，称之为 空栈。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/f94080b0b6a6124b22e8484de896d7b7_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 二. 堆栈的基本操作


    +   1. 插入 PUSH(S,item)

    +   2. 删除 POP(S)

    +   3. 测试堆栈是否为空 EMPTY(S)

    +   4. 检索当前栈顶元素 TOPS(S)


    # 特殊性:


    +   1. 其操作仅仅是一般线性表的操作的一个子集。

    +   2. 插入和删除操作的位置受到限制。'
  merge: -1
