- pgno: 412
  md: '# 9.5 B树和B+树


    # 一、B树的定义


    一个m阶的B树为满足下列条件的m叉树：


    +   1. 每个分支结点最多有m棵子树；

    +   2. 除根结点外，每个分支结点最少有⌈m/2⌉棵子树；

    +   3. 根结点最少有两棵子树（除非根为叶结点，此时B树只有一个结点）；

    +   4. 所有“叶结点”都在同一层上，叶结点不包含任何关键字信息（可以把叶结点视为实际上不存在的外部结点；

    +   5. 排序旁变结点中包含的关键字递增）：


    ```

    • n，p₀，key₁，p₁，key₂，p₂，…，keyₙ，pₙ

    ```


    其中，n为结点中关键字值的个数，

    keyᵢ为关键字，且满足 keyᵢ < keyᵢ₊₁，1≤i<n

    pᵢ为指向该结点的第i+1棵子树的根的指针，0≤i≤n'
  merge: -1
