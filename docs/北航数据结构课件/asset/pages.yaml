- pgno: 243
  md: '# 3. 若非空二叉树有n₀个叶结点, 有n₂个度为2的结点, 则 n₀=n₂+1


    证明：


    设该二叉树有n₁个度为1的结点, 结点总数为n, 有


    n=n₀+n₁+n₂ --------(1)


    设二叉树的分支数目为B, 根据性质0, 有


    B=n-1 --------(2)


    这些分支来自度为1的结点与度为2结点, 即


    B=n₁+2n₂ --------(3)


    联列关系(1), (2)与(3), 可得到


    n₀=n₂+1


    证毕。


    推论: n₀=n₂+2n₃+3n₄+...+(m-1)nₘ+1'
