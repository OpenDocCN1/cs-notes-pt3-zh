- pgno: 253
  md: '# 一. 什么是二叉树的遍历


    按照一定的顺序（原则）对二叉树中每一个结点都访问一次（仅访问一次），得到一个由该二叉树的所有结点组成的序列，这一过程称为二叉树的遍历。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_253_0.png)


    +   常用的二叉树的遍历方法：

    +   1. 前序遍历

    +   2. 中序遍历

    +   3. 后序遍历

    +   4. 按层次遍历'
  merge: -1
  img_proc: true
