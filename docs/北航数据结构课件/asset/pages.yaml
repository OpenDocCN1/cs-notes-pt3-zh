- pgno: 58
  md: '# 五、线性表的顺序存储结构的特点


    # 1. 优点


    +   1. 构造原理简单、直观，易理解。

    +   2. 元素的存储地址可以通过一个简单的解析式计算出来。是一种随机存储结构，存储速度快。

    +   3. 由于只需存放数据元素本身的信息，而无其他空间开销，相对链式存储结构而言，存储空间开销小（仅此而已！）


    # 2. 缺点


    +   1. 存储分配需要事先进行。

    +   2. 需要一片地址连续的存储空间。

    +   3. 基本操作（如插入、删除）的时间效率较低。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_58_0.png)'
