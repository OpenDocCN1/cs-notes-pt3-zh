- pgno: 429
  md: "# 算法\n\n```\nfunction HASHSEARCH(HT,M,key)\ni←H(key)\nD←i\nwhile (HT[D]=空 and\
    \ HT[D]≠key) do\n    D←(D+1) MOD M\n    if (D=i) then        // 转了一圈回到开始点（表满）//\n\
    \        return (−D)\n    end\n    if (HT[D]=key) then\n        return(D)    \
    \    // 查找成功 //\n    else\n        return(−D)       // 查找失败 //\n    end\n```"
  merge: -1
  img_proc: true
