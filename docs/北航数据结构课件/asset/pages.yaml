- pgno: 290
  md: '# 四. 二叉排序树的查找


    # 1. 查找过程


    若二叉排序树为空，则查找失败，结束。


    若二叉排序树非空，则将 被查找元素 与二叉排序树的根结点的值进行比较，


    +   - 若等于根结点的值,则查找成功,返回被查到元素所在链结点的地址,查找结束;

    +   - 若小于根结点的值，则到根结点的左子树中重复上述查找过程;

    +   - 若大于根结点的值,则到根结点的右子树中重复上述查找过程;


    直到查找成功或者失败。'
  merge: -1
  img_proc: true
