  md: "# 求关键活动的思路\n\ne(i) —— 活动 aᵢ 的最早开始时间  \nl(i) —— 活动 aᵢ 的最迟开始时间  \n若 l(i)−e(i)=0，则说明活动\
    \ aᵢ 为一个关键活动。\n\nee(k) —— 事件 k 的最早发生时间\n\n![](img/f94080b0b6a6124b22e8484de896d7b7_365_0.png)\n\
