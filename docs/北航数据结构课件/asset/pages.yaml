- pgno: 477
  md: "# 合并算法\n\n将两个位置相邻且按值有序序列合并为一个按值有序的序列\n\n```\nprocedure MERGE( X, s, t, u, Z\
    \ )\n\ti←s\nj←t+1\nq←s\nwhile ( i≤t and j≤u ) do\n    if (X[i]≤X[j]) then\n  \
    \      [ Z[q]←X[i]\n          i←i+1 ]\n    else\n        [ Z[q]←X[j]\n       \
    \   j←j+1 ]\n    q←q+1\nend\nwhile (i≤t) do\n    Z[q]←X[i]\n    i←i+1\n    q←q+1\n\
    end\nwhile (j≤u) do\n    Z[q]←X[j]\n    j←j+1\n    q←q+1\nend\nend\n```"
