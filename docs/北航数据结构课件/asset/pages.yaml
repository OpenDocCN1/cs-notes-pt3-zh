- pgno: 261
  md: '# （以中序遍历为例）


    STACK[1: M] —— 保存遍历过程中链结点的地址；

    top —— 栈顶指针,初始为0；

    p —— 为遍历过程中使用的指针变量,初始时指向根结点。


    # 用自然语言表达的算法


    +   (1) 若p指向的结点非空，则将p指向的结点的地址进栈,然后,将p指向左子树的根；

    +   (2) 若p指向的结点为空,则从堆栈中退出栈顶元素送p,访问该结点,然后,将p指向右子树的根；


    重复上述过程,直到p为空,并且堆栈也为空。


    ![](img/f94080b0b6a6124b22e8484de896d7b7_261_0.png)


    ![](img/f94080b0b6a6124b22e8484de896d7b7_261_1.png)'
