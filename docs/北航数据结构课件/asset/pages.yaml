- pgno: 61
  md: "# 算法\n\n```\nprocedure INSERT(A, n, item)\n    if (item ≥ A[n]) then\n    \
    \    A[n+1] ← item        // 插入表的末尾 //\n    else\n        [ i ← 1\n          while\
    \ (item ≥ A[i]) do\n              i ← i+1\n          end\n          for j ← n\
    \ downto i do\n              A[j+1] ← A[j]\n          end\n          A[i] ← item\
    \ ]        // 插入表的第i个位置 //\n        n ← n+1\nend\n```"
  merge: -1
  img_proc: true
