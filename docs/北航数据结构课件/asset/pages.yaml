  md: '# 结论1


    对于具有n个顶点, e条边的图, 有

    2e = Σᵢ₌₁ⁿ TD(vᵢ)


    # 结论2


    具有n个顶点的无向图最多有n(n-1)/2 条边。


    # 结论3


    具有n个顶点的有向图最多有n(n-1) 条边。


    边的数目达到最大的图称为完全图。边的数目达到或接近最大的图称为稠密图, 否则, 称为稀疏图。'
