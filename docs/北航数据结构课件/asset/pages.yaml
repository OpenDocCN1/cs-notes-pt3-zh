    \n# 结论\n\n事件 k 的最早发生时间 ee(k)  →  活动的 aᵢ 最早开始时间 e(i)  \n事件 k 的最迟发生时间 le(k)  → \
    \ 活动的 aᵢ 最迟开始时间 l(i)\n\naᵢ 为关键活动\n\n求 e(i) = l(i)"
