- pgno: 286
  md: "# 非递归算法\n\n功能: 将一个数据元素item 插入到根为T的二叉排序树中。\n\n```\nprocedure INSERT(T, item)\n\
    call GETNODE(p)\ndata(p)←item\nlchild(p)←nil\nrchild(p)←nil\nif (T=nil) then\n\
    \  T←p\nelse\n```\n\n```\n[ q←T\nloop\n  if (item<data(q)) then\n    if (lchild(q)=nil)\
    \ then\n      [ lchild(q)←p\n        exit ]\n    else\n      q←lchild(q)\n  else\n\
    \    if (rchild(q)=nil) then\n      [ rchild(q)←p\n        exit ]\n    else\n\
    \      q←rchild(q)\n  forever ]\nend\n```"
  merge: -1
  img_proc: true
- pgno: 287
  md: "# 建立二叉排序树的算法(主算法)\n\n```\nprocedure  SORTTREE( K, n, T )\nT←nil\nfor i←1 to\
    \ n do\n  call  INSERTT( T, K[i] )\nend\nend\n```"
