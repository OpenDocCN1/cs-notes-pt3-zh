- pgno: 299
  md: '# 算法思路


    # 依次从广义表中取元素，


    +   1. 若取到的元素为字母，则如下建立一个新结点，


    +   • 若该结点为根结点，则将该结点的地址送T。


    +   • 若该结点不是二叉树的根结点，则将该结点作为左孩子(若标志为1)或者右孩子(若标志为2)链接到其双亲结点上(双亲结点的地址在栈顶)。


    +   2. 若取到的元素为左括号(，则表明一个子表开始，将标志置为1，同时将前面那个结点的地址进栈。


    +   3. 若取到的元素为右括号)，则表明一个子表结束，将作退栈操作。


    +   4. 若取到的元素为逗号，则表明以左孩子为根的子树处理完毕，接着应该处理以右孩子为根的子树，将标志置为2。


    如此处理广义表中每一个元素，直到取到结束符号@为止。'
  merge: -1
  img_proc: true
- pgno: 300
  md: "```\nprocedure CREATBT(T)\n  T←nil  top←0\n  loop\n    read( ch )         \
    \                 // 取表中一个元素 //\n    case\n      ch='@': return              \
    \       // 取到结束符号 //\n      ch='(' : top←top+1                // 取到左括号 //\n  \
    \             STACK[top]←p\n               flag←1\n      ch=')' : top←top-1  \
    \              // 取到右括号 //\n      ch=',' : flag←2                   // 取到逗号 //\n\
    \      : else : call GETNODE(p)          // 取到字母 //\n               data(p)←ch\n\
    \               lchild(p)←rchild(p)←nil\n               if (T=nil) then\n    \
    \             T←p\n               else if ( flag=1 ) then\n                 lchild(\
    \ STACK[top] )←p\n               else\n                 rchild( STACK[top] )←p\n\
    \    end\n  forever\nend\n```"
  merge: -1
  img_proc: true
