    \   A[j]←key(ptr,j)\n    end\n    for j←0 to n do\n      B[j]←pointer(ptr, j)\n\
    \    end\n    i←SEQSEARCH(A, k)\n    if (key(ptr,i)=k) then\n      return(ptr,\
    \ i, 1)\n    qtr←ptr\n    ptr←B[i]\n  end\n  return(qtr, i, 0)\nend\n```\n\n```\n\
    function SEQSEARCH(A,k)\n  j←1\n  loop\n    if (k<A[j]) then\n      return(j-1)\n\
    \    j←j+1\n  forever\nend\n```\n\n![](img/f94080b0b6a6124b22e8484de896d7b7_416_0.png)\n\
