- pgno: 1011
  md: '# EM算法


    ● 期待最大化算法(以求解极大似然问题为例)


    X测随机变量的数据，Z隐随机变量的数据


    {X, Z}是完全数据，X是不完全数据，θ是需要估计的模型参数


    X概率分布为 p(X|θ)，对数似然函数为 L(θ) = log p(X|θ)


    X和Z联合分布为 p(X, Z|θ)，对数似然函数为 L(θ) = log p(X, Z|θ)


    选择参数初值 θ^old


    E步骤：估计潜变量后验分布 p(Z|X, θ^old)

    计算期望 Q(θ, θ^old) = Σ p(Z|X, θ^old) ln p(X, Z|θ)


    M步骤：最大化期望，更新参数 θ^new = argmax_θ Q(θ, θ^old)


    检验停止条件，若不满足 θ^old ← θ^new，继续迭代。'
  merge: -1
  img_proc: true
- pgno: 1012
  md: '# # 混合高斯模型


    # 🔴 估计模型参数


    $p(z_k=1)=\pi_k \quad 0\leq\pi_k\leq1 \quad \sum_{k=1}^{K}\pi_k=1$


    $p(\mathbf{z})=\prod_{k=1}^{K}\pi_k^{z_k}\qquad p(\mathbf{x}|\mathbf{z})=\prod_{k=1}^{K}\mathcal{N}(\mathbf{x}|\mu_k,\Sigma_k)^{z_k}$


    $p(\mathbf{x})=\sum_{\mathbf{z}}p(\mathbf{z})p(\mathbf{x}|\mathbf{z})=\sum_{k=1}^{K}\pi_k\mathcal{N}(\mathbf{x}|\mu_k,\Sigma_k)$


    $\ln p(\mathbf{X}|\boldsymbol{\pi},\boldsymbol{\mu},\boldsymbol{\Sigma})=\sum_{n=1}^{N}\ln\left\{\sum_{k=1}^{K}\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)\right\}$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1012_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1012_1.png)


    ```

    $\mu_k=\frac{1}{N_k}\sum_{n=1}^{N}\gamma(z_{nk})\mathbf{x}_n\qquad N_k=\sum_{n=1}^{N}\gamma(z_{nk})$


    $\Sigma_k=\frac{1}{N_k}\sum_{n=1}^{N}\gamma(z_{nk})(\mathbf{x}_n-\mu_k)(\mathbf{x}_n-\mu_k)^T$


    $\pi_k=\frac{N_k}{N}\qquad \gamma(z_{nk})=\frac{\pi_k\mathcal{N}(\mathbf{x}_n|\mu_k,\Sigma_k)}{\sum_j\pi_j\mathcal{N}(\mathbf{x}_n|\mu_j,\Sigma_j)}$

    ```'
  merge: -1
