- pgno: 835
  md: '# 布丰投针问题


    1777年法国科学家布丰（Buffon）提出一种计算圆周率π的方法—随机投针法。


    +   1、在平面上画上间距为a的平行线


    +   2、取一根长度为l（l<a）的针，随机投掷于平面上，针与任一线相交的概率p为


    p = 2l / (π a)


    π的值可计算为：


    π = 2l / (a p) ≈ 2l / a (N / n)


    N为总的投针次数，n为与平行线相交次数


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_835_0.png)


    | 试验者 | 时间 | 投掷次数 | 相交次数 | 圆周率估计值 |

    |---|---|---|---|---|

    | Wolf | 1850年 | 5000 | 2532 | 3.1596 |

    | Smith | 1855年 | 3204 | 1218.5 | 3.1554 |

    | C.De Morgan | 1860年 | 600 | 382.5 | 3.137 |

    | Fox | 1884年 | 1030 | 489 | 3.1595 |

    | Lazzerini | 1901年 | 3408 | 1808 | 3.1415929 |'
  merge: -1
