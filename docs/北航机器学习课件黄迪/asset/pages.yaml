  md: "# 重要性采样 (Importance Sampling)\n\n+   - 同样地，我们也希望 $q(z)$ 具有类似的性质，即\n+   \n+\
    \     $$q(z) = \\frac{1}{Z_q}\\tilde{q}(z)$$\n\n+   - 再看 $\\mathbb{E}(f)$\n+ \
    \  \n+     $$\\mathbb{E}(f) = \\int f(z)p(z)dz$$\n+   \n+     $$= \\frac{Z_q}{Z_p}\\\
    int f(z)\\frac{\\tilde{p}(z)}{\\tilde{q}(z)}q(z)dz$$\n+   \n+     $$\\approx \\\
    frac{Z_q}{Z_p}\\frac{1}{L}\\sum_{l=1}^{L}\\tilde{r}_l f(z^{(l)})$$\n\n其中 $\\tilde{r}_l\
    \ = \\frac{\\tilde{p}(z^{(l)})}{\\tilde{q}(z^{(l)})}$"
