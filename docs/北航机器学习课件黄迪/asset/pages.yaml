  md: '# # 非参数估计


    # 🔴 直接用样本估计总体分布


    基本思路：要估计 $x_i$ 点的密度 $p(x_i)$，可把所有样本在该点上的“贡献”相加近似作为其概率密度，进而得到 $\hat{p}(x)$。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_153_0.png)'
