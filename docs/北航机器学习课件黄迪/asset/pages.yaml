    *a*ₙ}

    +   - 基于划分点*t*，可将*D*分为子集*D*⁺ₜ和*D*⁻ₜ，其中*D*⁺ₜ (*D*⁻ₜ)包含了属性值*A*不小(大)于*t*的样本子集

