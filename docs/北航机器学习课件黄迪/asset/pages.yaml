- pgno: 829
  md: '# Generative Adversarial Networks(GAN)


    +   ➢ 假设有真实的数据集，分布为 $p_r(x)$，$x$ 是一张人脸


    假设一个生成器 $G$ 生成的分布是 $p_G(\tilde{x};\theta)$


    $=p_G(G_{z\sim p(z)}(z);\theta)$


    假设我们在真实分布中取一些数据 $\{x^1,x^2,\cdots,x^m\}$


    这些数据是从生成器中得到的似然是 $\prod_{i=1}^{m}p_G(x^i;\theta)$


    最大化该似然，即拟合生成器对真实数据的分布'
