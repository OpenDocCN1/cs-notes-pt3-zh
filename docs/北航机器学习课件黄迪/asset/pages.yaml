  md: '# 蒙特卡罗方法（Monte Carlo Method）


    注：


    $p(z) = \frac{1}{Z_p} \tilde{p}(z)$


    +   - 首先产生一个采样点 $z^{(\tau)}$

    +   - 根据建议概率 $q(z|z^{(\tau)})$ 产生新的采样点

    +   - 依次类推，产生马尔可夫链 $z^{(1)}, z^{(2)}, ...$


    +   - 要求 $q(z|z^{(\tau)})$ 尽可能简单，便于产生采样点；

    +   - 有一个准则去决定是接受还是拒绝产生的采样点'
