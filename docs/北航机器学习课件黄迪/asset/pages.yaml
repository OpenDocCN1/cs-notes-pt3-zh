  md: '# 线性判别函数


    +   利用样本集直接设计分类器


    线性回归： $y(x) = w^T x + w_0$

    利用样本估计 $w$, 对于给定 $x$, 计算 $y$。


    $y(x) = f(w^T x + w_0) \quad f(a) = \begin{cases} +1, & a \ge 0 \\ -1, & a < 0
