- pgno: 420
  md: "# 连续值处理\n\n+   基本思想：采用二分法(Bi-Partition)进行离散化\n\n+   候选划分点集合 $T_a = \\left\\\
    { \\frac{a_n + a_{n+1}}{2} \\mid 1 \\le n \\le N-1 \\right\\}$\n\n+   信息增益 $G(D,a)\
    \ = \\max_{t \\in T_a} G(D,a,t)$\n+   \n+   $= \\max_{t \\in T_a} \\left( H(D)\
    \ - \\sum_{\\lambda \\in \\{+,-\\}} \\frac{|D_t^{\\lambda}|}{|D|} H(D_t^{\\lambda})\
    \ \\right)$\n\n其中，$G(D,A,t)$ 是样本集$D$基于划分点$t$二分后的信息增益。我们需选择使 $G(D,A,t)$ 最大的划分点$t$。"
  merge: -1
