- pgno: 486
  md: '# 主成分分析-算法


    +   最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    将D维数据集 {xₙ}, n = 1,2,...,N 降为M维, M < D


    首先考虑 M = 1, 定义这个空间的投影方向为D维向量 u₁


    出于方便且不失一般性, 令 u₁ᵀ u₁ = 1


    每个数据点 xₙ 在新空间中表示为标量 u₁ᵀ xₙ


    样本均值在新空间中表示为 u₁ᵀ x̄, 其中 x̄ = 1/N ∑ₙ₌₁ᴺ xₙ


    投影后样本方差表示为 1/N ∑ₙ₌₁ᴺ {u₁ᵀ xₙ - u₁ᵀ x̄}² = u₁ᵀ S u₁ 最大


    其中原样本方差 S = 1/N ∑ₙ₌₁ᴺ (xₙ - x̄)(xₙ - x̄)ᵀ'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# 主成分分析-算法


    +   最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    目标是最大化 u₁ᵀ S u₁， s.t. u₁ᵀ u₁ = 1


    利用拉格朗日乘子法 u₁ᵀ S u₁ + λ₁(1 − u₁ᵀ u₁)


    对 u₁ 求导置零得到 S u₁ = λ₁ u₁


    u₁是S的特征向量


    进一步得到 u₁ᵀ S u₁ = λ₁


    u₁是S最大特征值对应的特征向量时 方差取到极大值，称u₁为第一主成分'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# 主成分分析-算法


    最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    考虑更一般性的情况( M > 1 ), 新空间中数据方差最大的最佳投影方向由协方差矩阵 S 的 M 个特征向量 u₁, ..., u_M 定义, 其分别对应
    M 个最大的特征值 λ₁, ..., λ_M


    +   - 首先获得方差最大的1维，生成该维的补空间；

    +   - 继续在补空间中获得方差最大的1维，生成新的补空间；

    +   - 依次循环下去得到 M 维的空间。'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# 主成分分析-算法


    最小均方误差思想


    使原数据与降维后的数据(在原空间中的重建)的误差最小


    定义一组正交的*D*维基向量 {u_i}, i = 1, ..., D, 满足


    u_i^T u_j = δ_ij


    由于基是完全的，每个数据点可以表示为基向量的线性组合


    x_n = Σ_{i=1}^D α_{ni} u_i


    相当于进行了坐标变换


    {x_{n1}, ..., x_{nD}}  {u_i}  {α_{n1}, ..., α_{nD}}


    α_{nj} = x_n^T u_j


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_489_0.png)'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# 主成分分析-算法


    最小均方误差思想


    使原数据与降维后的数据(在原空间中的重建)的误差最小


    那么 $x_n = \sum_{i=1}^{D} (x_n^T u_i) u_i$


    在$M$维变量($M < D$)生成的空间中对其进行表示


    $\tilde{x}_n = \sum_{i=1}^{M} z_{ni} u_i + \sum_{i=M+1}^{D} b_i u_i$


    独特的


    共享的


    目标最小化失真度 $J = \frac{1}{N} \sum_{n=1}^{N} \|x_n - \tilde{x}_n\|^2$


    倒数置零得到 $z_{nj} = x_n^T u_j, j = 1, ..., M$


    $b_j = \bar{x}^T u_j, j = M+1, ..., D$'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# # 主成分分析-算法


    # 🔴 最小均方误差思想


    使用原数据与降维后的数据（在原空间中的重建）的误差最小


    有 \(\mathbf{x}_n-\tilde{\mathbf{x}}_n=\sum_{i=M+1}^{D}\{(\mathbf{x}_n-\bar{\mathbf{x}})^T\mathbf{u}_i\}\mathbf{u}_i\)


    \(J=\frac{1}{N}\sum_{n=1}^{N}\sum_{i=M+1}^{D}(\mathbf{x}_n^T\mathbf{u}_i-\bar{\mathbf{x}}^T\mathbf{u}_i)^2=\sum_{i=M+1}^{D}\mathbf{u}_i^T
    S\mathbf{u}_i\)


    拉格朗日乘子法 \(\tilde{J}=\sum_{i=M+1}^{D}\mathbf{u}_i^T S\mathbf{u}_i+\sum_{i=M+1}^{D}\lambda_i(1-\mathbf{u}_i^T\mathbf{u}_i)\)


    求导得到 \(S\mathbf{u}_i=\lambda_i\mathbf{u}_i\)


    J最小时取D-M个最小的特征值


    对应失真度为 \(J=\sum_{i=M+1}^{D}\lambda_i\)


    主子空间对应M个最大特征值'
  merge: -1
  img_proc: true
