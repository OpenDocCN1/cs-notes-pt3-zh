- pgno: 975
  md: '# # 最小二乘准则


    • 寻找最好投影方向 $a^*$


    $a^T y_n > 0$


    $a^T y_n = b_n > 0$


    $b_n$ 是任意给定的正常数


    方程组形式：


    $Ya=b$


    $Y=\begin{bmatrix}y_1^T\\y_2^T\\\vdots\\y_N^T\end{bmatrix}=\begin{bmatrix}y_{11}&y_{12}&\cdots&y_{1\hat
    d}\\y_{21}&y_{22}&\cdots&y_{2\hat d}\\\vdots&\vdots&\ddots&\vdots\\y_{N1}&y_{N2}&\cdots&y_{N\hat
    d}\end{bmatrix}$


    $y_n$ 是规范化增广向量样本


    $Y$ 是 $N\times\hat d$ 维矩阵，通常 $N>\hat d$，一般为列满秩阵


    $b=[b_1\quad b_2\quad\cdots\quad b_N]$


    $b$ 是 $N$ 维向量，$b_n>0$，$n=1,2,\ldots,N$


    方程数多于未知数的矛盾方程组通常没有精确解


    定义误差向量：$e=Ya-b$ 及平方误差准则函数


    $J_s(a)=\|e\|^2=\|Ya-b\|^2=\sum_{n=1}^{N}(a^T y_n-b_n)^2$'
  merge: -1
  img_proc: true
- pgno: 976
  md: '# 最小二乘准则


    求使 $J_S(a)$ 最小的 $a^*$（最小二乘近似解/伪逆解/MSE解）


    采用解析法求伪逆解 $J_S(a)=\|e\|^2=\|Ya-b\|^2=\sum_{n=1}^{N}(a^T y_n-b_n)^2$


    $\nabla J_S(a)=\sum_{n=1}^{N}2(a^T y_n-b_n)y_n=2Y^T(Ya-b)$


    令 $\nabla J_S(a)=0$


    得 $Y^TYa^*=Y^Tb$


    矩阵 $Y^TY$ 是 $d\times d$ 方阵，一般非奇异


    唯一解 $a^*=(Y^TY)^{-1}Y^Tb=Y^+b$


    其中 $d\times N$ 矩阵 $Y^+=(Y^TY)^{-1}Y^T$ 是 $Y$ 的左逆矩阵


    如何选 $b$?


    $b=\begin{bmatrix}N/N_1\\\vdots\\N/N_1\\N/N_2\\\vdots\\N/N_2\end{bmatrix}$，其中
    $N_1$ 个，$N_2$ 个


    $a^*$ 等价于 Fisher 解


    $g_0(x)=P(\omega_1|x)-P(\omega_2|x)$


    $N\to\infty,\ b=[1,1,\cdots,1]^T$（$N$ 个）


    以最小均方误差逼近贝叶斯判别函数'
  merge: -1
  img_proc: true
- pgno: 977
  md: '# 最小二乘准则


    ● 求使 $J_S(a)$ 最小的 $a^*$ (最小二乘近似解/伪逆解/MSE解)


    $a^* = Y^+ b \quad Y^+ = (Y^T Y)^{-1} Y^T$


    问题：①要求 $Y^T Y$ 非奇异；②求 $Y^+$ 计算量大同时可能引入较大误差。


    采用梯度下降法求解：$\nabla J_S(a) = 2Y^T(Ya - b)$


    $\begin{cases} a(1), \text{Random} \\ a(k+1) = a(k) - \rho_k Y^T(Ya - b) \end{cases}$


    可以证明，选择 $\rho_k = \frac{\rho_1}{k}$，$\rho_1$ 是任意常数


    该算法权向量收敛于使 $\nabla J_S(a) = 2Y^T(Ya - b) = 0$ 的权向量 $a^*$


    不要求 $Y^T Y$ 奇异与否，只计算 $\hat{d} \times \hat{d}$ 方阵 $Y^T Y$，比 $\hat{d} \times N$
    矩阵 $Y^+$ 计算量小'
  merge: -1
  img_proc: true
