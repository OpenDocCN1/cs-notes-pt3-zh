- pgno: 151
  md: '# # 贝叶斯曲线拟合


    $$p(t|\mathbf{x},\mathbf{t})=\int p(t|\mathbf{x},\mathbf{w})p(\mathbf{w}|\mathbf{x},\mathbf{t})\,d\mathbf{w}=\mathcal{N}(t|m(\mathbf{x}),s^2(\mathbf{x}))$$


    $$p(\mathbf{w}|\mathbf{x},\mathbf{t},\alpha,\beta)\propto p(\mathbf{t}|\mathbf{x},\mathbf{w},\beta)p(\mathbf{w}|\alpha)$$


    $$y(\mathbf{x},\mathbf{w})=\sum_{j=0}^{M-1}w_j\phi_j(\mathbf{x})=\mathbf{w}^{\mathrm{T}}\boldsymbol{\phi}(\mathbf{x})$$


    $$m(x)=\beta\boldsymbol{\phi}(x)^{\mathrm{T}}\mathbf{S}\sum_{n=1}^{N}\boldsymbol{\phi}(x_n)t_n\qquad
    s^2(x)=\beta^{-1}+\boldsymbol{\phi}(x)^{\mathrm{T}}\mathbf{S}\boldsymbol{\phi}(x)$$


    $$\mathbf{S}^{-1}=\alpha\mathbf{I}+\beta\sum_{n=1}^{N}\boldsymbol{\phi}(x_n)\boldsymbol{\phi}(x_n)^{\mathrm{T}}\qquad
    \boldsymbol{\phi}(x_n)=(x_n^0,\ldots,x_n^M)^{\mathrm{T}}$$'
  merge: -1
