- pgno: 1015
  md: '# 主成分分析-算法


    ● 最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    将D维数据集 {xₙ}, n = 1,2,...,N 降为M维, M < D


    首先考虑 M = 1, 定义这个空间的投影方向为D维向量 u₁


    出于方便且不失一般性, 令 u₁ᵀ u₁ = 1


    每个数据点 xₙ 在新空间中表示为标量 u₁ᵀ xₙ


    样本均值在新空间中表示为 u₁ᵀ x̄, 其中 x̄ = 1/N ∑ₙ₌₁ᴺ xₙ


    投影后样本方差表示为 1/N ∑ₙ₌₁ᴺ {u₁ᵀ xₙ − u₁ᵀ x̄}² = u₁ᵀ S u₁ 最大


    其中原样本方差 S = 1/N ∑ₙ₌₁ᴺ (xₙ − x̄)(xₙ − x̄)ᵀ'
  merge: -1
  img_proc: true
- pgno: 1016
  md: '# 主成分分析-算法


    +   最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    目标是最大化 u₁ᵀ S u₁， s.t. u₁ᵀ u₁ = 1


    利用拉格朗日乘子法 u₁ᵀ S u₁ + λ₁(1 − u₁ᵀ u₁)


    对 u₁ 求导置零得到 S u₁ = λ₁ u₁


    u₁是S的特征向量


    进一步得到 u₁ᵀ S u₁ = λ₁


    u₁是S最大特征值对应的特征向量时

    方差取到极大值，称u₁为第一主成分'
  merge: -1
  img_proc: true
- pgno: 1017
  md: '# 主成分分析-算法


    最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    考虑更一般性的情况( M > 1 ), 新空间中数据方差最大的最佳投影方向由协方差矩阵 S 的 M 个特征向量 u₁, ..., uₘ 定义, 其分别对应
    M 个最大的特征值 λ₁, ..., λₘ


    +   首先获得方差最大的1维，生成该维的补空间；

    +   继续在补空间中获得方差最大的1维，生成新的补空间；

    +   依次循环下去得到 M 维的空间。'
  merge: -1
  img_proc: true
