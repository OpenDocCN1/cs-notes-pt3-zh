- pgno: 427
  md: "# 缺失值处理\n\n# 定义\n\n+   - $\tilde{D}$: $D$中在属性$a$上没有缺失值的样本子集\n+   - 属性$a$($a\
    \ \\in A$) 有$N$个可取值$\\{a_1, a_2, ..., a_N\\}$\n+   - $\tilde{D}^n$: $\tilde{D}$中在属性$a$上取值为$a_n$的样本子集\n\
    +   - $\tilde{D}_c$: $\tilde{D}$中属于第$c$($c \\in C$)类的样本子集\n+   - 无缺失值样本所占比例 $\\\
    rho = \\frac{\\sum_{x \\in \\tilde{D}} \\omega_x}{\\sum_{x \\in D} \\omega_x}$\n\
    +   - 无缺失样本中第$c$类比例 $\\tilde{p}_c = \\frac{\\sum_{x \\in \\tilde{D}_c} \\omega_x}{\\\
    sum_{x \\in \\tilde{D}} \\omega_x}, (1 \\le c \\le C), \\sum_{c=1}^{C} \\tilde{p}_c\
    \ = 1$\n+   - 无缺失样本中属性$a$上取值为$a_n$的比例 $\\tilde{r}_n = \\frac{\\sum_{x \\in \\\
    tilde{D}^n} \\omega_x}{\\sum_{x \\in \\tilde{D}} \\omega_x}, (1 \\le n \\le N),\
    \ \\sum_{n=1}^{N} \\tilde{r}_n = 1$"
  merge: -1
  img_proc: true
- pgno: 428
  md: '# 缺失值处理


    信息增益 $G(D,A)=\rho\times G(\tilde{D},A)$

    $=\rho\times\left(H(\tilde{D})-\sum_{n=1}^{N}\tilde{r}_n H(\tilde{D}_n)\right)$


    其中 $H(\tilde{D})=-\sum_{c=1}^{C}\tilde{p}_c \log_2 \tilde{p}_c$


    原则：让样本以不同概率划分到不同的子结点去


    +   若样本 $x$ 在属性 $a$ 上的取值已知，则将 $x$ 划入与其取值对应的子结点，且样本权值保持为 $\omega_x$


    +   若样本 $x$ 在属性 $a$ 上的取值未知，则将 $x$ 划入所有子结点，且样本权值在与属性值对应的子结点中调整为 $\tilde{r}_n \cdot
    \omega_x$'
  merge: -1
  img_proc: true
