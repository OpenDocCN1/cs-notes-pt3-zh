- pgno: 77
  md: '# # 机器学习目标


    +   - **Under-fitting:** model is too “simple” to represent all the relevant class
    characteristics

    +     - High bias and low variance

    +     - High training error and high test error


    +   - **Over-fitting:** model is too “complex” and fits irrelevant characteristics
    (noise) in the data

    +     - Low bias and high variance

    +     - Low training error and high test error'
  merge: -1
