- pgno: 580
  md: '# EM算法求解混合高斯问题


    μ_k = (1/N_k) Σ_{n=1}^N γ(z_nk) x_n    N_k = Σ_{n=1}^N γ(z_nk)


    Σ_k = (1/N_k) Σ_{n=1}^N γ(z_nk) (x_n - μ_k)(x_n - μ_k)^T


    π_k = N_k / N


    γ(z_nk) = [π_k N(x_n | μ_k, Σ_k)] / [Σ_j π_j N(x_n | μ_j, Σ_j)]'
