- pgno: 541
  md: '# 高斯混合模型（Gaussian Mixture Model）


    # ● 一个例子


    ➢ 假设学校一个叫小明的老师，要统计学校各院系学生的身高，他从学校的档案馆随机抽取了N（如N=2000）名学生的档案，并从中得到了学生的身高信息。


    ➢ 问：如何从中得到各院系的学生身高分布？（假设身高服从高斯分布）以及各院系学生的人数分布。'
  merge: -1
  img_proc: true
- pgno: 542
  md: '# 高斯混合模型 (Gaussian Mixture Model)


    ➢学生的身高（观测值）：

    { X₁, X₂ ⋯ X_N }   p(x) ∼ Σ_z p(z) p(x|z)


    ➢每个院系的身高分布：

    𝒩(μ_k, σ_k)


    ➢每个院系的人数分布（人数不一样，被抽中的概率也不一样）：

    p(z) = { π₁, π₂, ⋯, π₂₁ }'
  merge: -1
  img_proc: true
- pgno: 543
  md: "# 高斯混合模型 (Gaussian Mixture Model)\n\nz是一个隐变量，K维，且这K维当中只有第k维的值为1，其他维均为0\n\n\
    Z = ⎛0⎞\n    ⎜0⎟\n    ⎜1⎟\n    ⎜.⎟\n    ⎜.⎟\n    ⎝0⎠\n\np(z_k = 1) = π_k\ns.t.\
    \ 0 ≤ π_k ≤ 1\n∑_{k=1}^{K} π_k = 1"
  merge: -1
  img_proc: true
- pgno: 544
  md: "# 混合高斯模型\n\n+   • x从第k个高斯采样的概率是\n+   \n+   $p(x|z_k = 1) = \\mathcal{N}(x|\\\
    mu_k, \\Sigma_k)$\n\n+   • x和z的联合分布是\n+   \n+   $p(x, z) = p(z) \\cdot p(x|z)$\n\
    \n$p(x) = \\sum_{z} p(z) p(x|z) = \\sum_{k=1}^{K} \\pi_k \\mathcal{N}(x|\\mu_k,\
    \ \\Sigma_k)$"
  merge: -1
  img_proc: true
- pgno: 545
  md: "# 混合高斯模型\n\n+   - **N个样本的联合分布**\n+   \n+     $p(X|\\pi,\\mu,\\Sigma)=\\prod_{n=1}^{N}p(x_n|\\\
    pi,\\mu,\\Sigma)\\rightarrow\\text{似然函数}$\n+   \n+     $=\\prod_{n=1}^{N}\\sum_{k=1}^{K}\\\
    pi_k\\mathcal{N}(x_n|\\mu_k,\\Sigma_k)$\n\n+   - **两边取对数**\n+   \n+     $\\ln\
    \ p(X|\\pi,\\mu,\\Sigma)=\\sum_{n=1}^{N}\\ln\\left\\{\\sum_{k=1}^{K}\\pi_k\\mathcal{N}(x_n|\\\
    mu_k,\\Sigma_k)\\right\\}$"
  merge: -1
  img_proc: true
- pgno: 546
  md: '# # 混合高斯模型的最大似然估计


    +   - 给定 \(\{x_1,\ldots,x_N\}\)，估计混合高斯模型参数


    ```

    \[

    \ln p(\mathbf{X}|\boldsymbol{\pi},\boldsymbol{\mu},\boldsymbol{\Sigma})

    =\sum_{n=1}^{N}\ln\left\{\sum_{k=1}^{K}\pi_k\mathcal{N}(x_n|\mu_k,\Sigma_k)\right\}

    \]

    ```


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_546_0.png)'
  merge: -1
  img_proc: true
- pgno: 547
  md: '# EM算法求解混合高斯问题


    ln p(X|π, μ, Σ) = Σ_{n=1}^N ln { Σ_{k=1}^K π_k N(x_n|μ_k, Σ_k) }


    直接求解该最大似然估计较难


    但它的解一定满足以下条件：


    对 μ_k 求导


    0 = - Σ_{n=1}^N [ π_k N(x_n|μ_k, Σ_k) / Σ_j π_j N(x_n|μ_j, Σ_j) ] Σ_k (x_n - μ_k)


    γ(z_nk)


    x_n 属于第 K 个高斯的概率'
  merge: -1
  img_proc: true
- pgno: 548
  md: '# 混合高斯模型


    γ(z_k) ≡ p(z_k = 1|x)


    = \frac{p(z_k = 1)p(x|z_k = 1)}{\sum_{j=1}^{K} p(z_j = 1)p(x|z_j = 1)}


    = \frac{π_k \mathcal{N}(x|μ_k, Σ_k)}{\sum_{j=1}^{K} π_j \mathcal{N}(x|μ_j, Σ_j)}'
  merge: -1
  img_proc: true
- pgno: 549
  md: '# EM算法求解混合高斯问题


    ```

    ln p(X|π, μ, Σ) = Σ_{n=1}^N ln { Σ_{k=1}^K π_k N(x_n | μ_k, Σ_k) }

    ```


    对 μ_k 求导


    ```

    μ_k = (1/N_k) Σ_{n=1}^N γ(z_nk) x_n    N_k = Σ_{n=1}^N γ(z_nk)

    ```


    第k个高斯所包含的样本数'
  merge: -1
  img_proc: true
- pgno: 550
  md: '# EM算法求解混合高斯问题


    ln p(X|π, μ, Σ) = Σ_{n=1}^{N} ln { Σ_{k=1}^{K} π_k N(x_n | μ_k, Σ_k) }


    对 Σ_k 求导


    Σ_k = (1 / N_k) Σ_{n=1}^{N} γ(z_nk) (x_n - μ_k)(x_n - μ_k)^T


    对 π_k 求导


    必须考虑一个约束条件 Σ_{k=1}^{K} π_k = 1


    ln p(X|π, μ, Σ) + λ ( Σ_{k=1}^{K} π_k - 1 )


    0 = Σ_{n=1}^{N} [ N(x_n | μ_k, Σ_k) / Σ_j π_j N(x_n | μ_j, Σ_j) ] + λ


    λ = -N


    N_k = Σ_{n=1}^{N} [ π_k N(x_n | μ_k, Σ_k) / Σ_j π_j N(x_n | μ_j, Σ_j) ]


    π_k = N_k / N'
  merge: -1
  img_proc: true
- pgno: 551
  md: '# EM算法求解混合高斯问题


    μₖ = (1/Nₖ) Σₙ=1ᴺ γ(zₙₖ) xₙ    Nₖ = Σₙ=1ᴺ γ(zₙₖ)


    Σₖ = (1/Nₖ) Σₙ=1ᴺ γ(zₙₖ) (xₙ - μₖ)(xₙ - μₖ)ᵀ


    πₖ = Nₖ / N


    γ(zₙₖ) = [πₖ 𝒩(xₙ | μₖ, Σₖ)] / [Σⱼ πⱼ 𝒩(xₙ | μⱼ, Σⱼ)]'
  merge: -1
  img_proc: true
- pgno: 552
  md: "# EM算法求解混合高斯问题\n\n# EM for Gaussian Mixtures\n\nGiven a Gaussian mixture model,\
    \ the goal is to maximize the likelihood function with respect to the parameters\
    \ (comprising the means and covariances of the components and the mixing coefficients).\n\
    \n+   1. Initialize the means $\\mu_k$, covariances $\\Sigma_k$ and mixing coefficients\
    \ $\\pi_k$, and evaluate the initial value of the log likelihood.\n+   \n+   2.\
    \ **E step.** Evaluate the responsibilities using the current parameter values\n\
    \n$$\\gamma(z_{nk}) = \\frac{\\pi_k \\mathcal{N}(x_n\\mid\\mu_k,\\Sigma_k)}{\\\
    sum_{j=1}^{K}\\pi_j\\mathcal{N}(x_n\\mid\\mu_j,\\Sigma_j)}. \\tag{9.23}$$"
  merge: -1
  img_proc: true
- pgno: 553
  md: '# EM算法求解混合高斯问题


    3. M step. Re-estimate the parameters using the current responsibilities


    μₖ^new = (1/Nₖ) Σₙ=1^N γ(zₙₖ) xₙ  (9.24)


    Σₖ^new = (1/Nₖ) Σₙ=1^N γ(zₙₖ) (xₙ - μₖ^new)(xₙ - μₖ^new)ᵀ  (9.25)


    πₖ^new = Nₖ / N  (9.26)


    where


    Nₖ = Σₙ=1^N γ(zₙₖ).  (9.27)'
  merge: -1
  img_proc: true
