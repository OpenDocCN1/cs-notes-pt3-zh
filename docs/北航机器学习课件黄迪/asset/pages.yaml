- pgno: 1026
  md: '# 人工神经元的MP模型


    人工神经元是仿照生物神经元提出的，神经元可以有N个输入：


    $x_1, x_2, ..., x_N$


    每个输入端与神经元之间有一定的连接权值：


    $w_1, w_2, ..., w_N$


    神经元总输入为对每个输入的加权求和，同时减去阈值θ。a代表神经元的活跃值，即神经元状态：


    $a = \sum_{i=1}^{N} w_i x_i - \theta = \sum_{i=0}^{N} w_i x_i$'
  merge: -1
  img_proc: true
- pgno: 1027
  md: '# 人工神经元的MP模型


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1027_0.png)


    神经元的输出 y 是对 a 的映射：


    y = f(a) = f\left(\sum_{i=0}^{N} w_i x_i\right)


    f 称为激活函数(激励函数，输出函数)。'
  merge: -1
