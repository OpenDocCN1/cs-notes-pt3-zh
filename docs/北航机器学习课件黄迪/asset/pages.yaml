  md: '# 马尔可夫蒙特卡罗方法

    (Markov Chain Monte Carlo)


    +   蒙特卡罗（Monte Carlo）蒙特卡洛坐落于欧洲地中海之滨、法国的东南方，有一个版图很小的国家摩纳哥公国。蒙特卡罗是世界著名的赌城，是摩纳哥的标志，世界三大赌城之一。富丽堂皇的蒙地卡罗赌场，建成于一八六三年，是一幢古色古香以及巍峨的宫殿式建筑物。1856年，摩纳哥亲王Charles三世为了解决财政危机，才在市区北边开设了第一家赌场。


    +   蒙特卡罗方法于20世纪40年代美国在第二次世界大战中研制原子弹的“曼哈顿计划”计划的成员S.M.乌拉姆和J.冯·诺伊曼首先提出。数学家冯·诺伊曼用驰名世界的赌城一摩纳哥的Monte
    Carlo—来命名这种方法，为它蒙上了一层神秘色彩。在这之前，蒙特卡罗方法就已经存在。1777年，法国Buffon提出用投针实验的方法求圆周率π。这被认为是蒙特卡罗方法的起源。


