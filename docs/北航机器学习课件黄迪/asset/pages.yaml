- pgno: 765
  md: '# Long Short Term Memory (LSTM)


    “遗忘门”


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_765_0.png)


    f_t = σ(W_f · [h_{t-1}, x_t] + b_f)


    # 选择哪些信息应该被遗忘


    先前输出（即隐藏状态）的信息和来自当前输入的信息经sigmoid函数激活，输出介于0-1之间。越接近0意味着越容易被遗忘，越接近1则越容易被保留。'
  merge: -1
  img_proc: true
- pgno: 766
  md: '# Long Short Term Memory (LSTM)


    +   • "输入门"


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_766_0.png)


    iₜ = σ(Wᵢ·[hₜ₋₁, xₜ] + bᵢ)


    Ĉₜ = tanh(W_C·[hₜ₋₁, xₜ] + b_C)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_766_1.png)


    # Cell新状态


    +   1. 先前输出和当前输入经sigmoid函数，计算出哪些值更重要；

    +   2. 同时，把先前输出和当前输入给tanh函数，生成候选状态；

    +   3. 最后，把tanh的输出与sigmoid的输出相乘，生成更新状态'
  merge: -1
  img_proc: true
- pgno: 767
  md: "# # Long Short Term Memory (LSTM)\n\n# ● 状态更新\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_767_0.png)\n\
    \n$C_t = f_t \\otimes C_{t-1} + i_t \\otimes \\widetilde{C}_t$\n\n+   ➢ **更新cell状态**\n\
    +   \n+   1. 先前cell状态和遗忘门输出的向量点乘，由于越不重要的值越接近0，原隐藏状态中不重要的信息被丢弃。\n+   2. 新的输出，与当前cell的候选状态相加，输出更新后的cell状态。"
  merge: -1
