  md: '# 激活函数的性质


    +   - 连续并可导（允许少数点上不可导）的非线性函数

    +     - 可导的激活函数可以直接利用数值优化的方法来学习网络参数。

    +   - 激活函数及其导函数要尽可能的简单

    +     - 有利于提高网络计算效率。

