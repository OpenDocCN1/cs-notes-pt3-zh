- pgno: 1101
  md: '# 3.1 Pooling


    A pooling layer is another building block of a CNN. Its function is to progressively
    reduce the spatial size of the representation to reduce the number of parameters
    and amount of computation in the network. Pooling layer operates on each feature
    map independently.


    The most common form of pooling layer is max pooling. Max pooling takes a filter
    (e.g., 2x2) and a stride of the same length. It then applies it to the input volume
    and outputs the maximum number in every subregion that the filter convolves around.


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1101_0.png)


    Figure 3.5: An example of max pooling with 2x2 filter and stride 2.


    Other pooling functions include average pooling, L2 norm pooling, etc.'
  merge: -1
  img_proc: true
