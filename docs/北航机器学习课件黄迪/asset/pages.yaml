- pgno: 832
  md: "# Generative Adversarial Networks(GAN)\n\n+   - 固定 $G$\n+   \n+     $V(G, D)\
    \ = \\int_{\\boldsymbol{x}} p_r(\\boldsymbol{x}) \\log(D(\\boldsymbol{x})) dx\
    \ + \\int_{\\boldsymbol{z}} p_z(\\boldsymbol{z}) \\log(1 - D(G(\\boldsymbol{z})))\
    \ dz$\n+   \n+     $= \\int_{\\boldsymbol{x}} p_r(\\boldsymbol{x}) \\log(D(\\\
    boldsymbol{x})) + p_G(\\boldsymbol{x}) \\log(1 - D(\\boldsymbol{x})) dx$\n\n+\
    \   - 最优的 $D$ 为\n+   \n+     $D_G^*(\\boldsymbol{x}) = \\frac{p_r(\\boldsymbol{x})}{p_r(\\\
    boldsymbol{x}) + p_G(\\boldsymbol{x})}$"
