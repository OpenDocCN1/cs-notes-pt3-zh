- pgno: 1046
  md: '# 反向传播(BP)算法


    练习： $a_k = \sum_{j} w_{kj} z_j \quad z_j = h(a_j)$


    推导 $\delta_j = h''(a_j) \sum_{k} w_{kj} \delta_k$


    $\delta_j = \sum_{k} \frac{\partial E_n}{\partial a_k} \frac{\partial a_k}{\partial
    a_j} = \sum_{k} \delta_k \frac{\partial a_k}{\partial a_j}$


    $= \sum_{k} \delta_k \frac{\partial a_k}{\partial z_j} \frac{\partial z_j}{\partial
    a_j} = \sum_{k} \delta_k w_{kj} \frac{\partial h(a_j)}{\partial a_j}$


    $= h''(a_j) \sum_{k} \delta_k w_{kj}$'
