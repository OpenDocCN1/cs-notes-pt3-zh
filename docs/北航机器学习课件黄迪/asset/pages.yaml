- pgno: 559
  md: '# K均值算法


    +   两步走策略


    +   第一步：初始化 $\mu_k$，按照最优化准则产生 $r_{nk}$


    $J = \sum_{n=1}^{N} \sum_{k=1}^{K} r_{nk} \| \mathbf{x}_n - \boldsymbol{\mu}_k
    \|^2$


    $r_{nk} = \begin{cases} 1 \text{ if } k = \arg\min_j \| \mathbf{x}_n - \boldsymbol{\mu}_j
    \|^2 \\ 0 \text{ otherwise} \end{cases}$'
