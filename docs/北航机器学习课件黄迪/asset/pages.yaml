  md: '# ID3算法


    +   - ID3 (Iterative Dichotomiser 3)迭代二分器算法

    +     - 由J. R. Quinlan于1979年提出

    +     - 一种最经典的决策树学习算法


    基本思想：以信息熵为度量，用于决策树结点的属性选择，每次优先选取信息增益最大的属性，即能使熵值最小的属性，构造一棵熵值下降最快的决策树。到叶子结点的熵值为0，此时对应实例集中的实例属于同一类别。'
