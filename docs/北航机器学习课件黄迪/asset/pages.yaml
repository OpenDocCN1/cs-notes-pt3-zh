- pgno: 276
  md: '# 序列最小优化算法


    # 两个变量二次规划的解析方法


    考虑变量为 a₂ 的最优化问题，假设问题的初始可行解为 a₁^old, a₂^old，最优解为 a₁^new, a₂^new，并且在沿着约束方向未经剪辑(未考虑不等式约束)时
    a₂ 的最优解为 a₂^{new, unc}。

    0 ≤ aₙ ≤ C, n = 1, 2


    由于 a₂^{new} 需要满足不等式约束，所以其取值范围须满足 L ≤ aₙ^{new} ≤ H，其中，L 与 H 是 a₂^{new} 所在的对角线段端点的界。


    如果 t₁ ≠ t₂，则 L = max(0, a₂^{old} − a₁^{old}), H = min(C, C + a₂^{old} − a₁^{old})


    如果 t₁ = t₂，则 L = max(0, a₂^{old} + a₁^{old} − C), H = min(C, a₂^{old} + a₁^{old})


    首先求沿着约束方向未经剪辑时的 a₂ 最优解 a₂^{new, unc}，然后再求剪辑后 a₂ 的解 a₂^{new}。'
