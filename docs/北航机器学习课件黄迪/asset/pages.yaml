  md: '# Adagrad


    +   - 对稀疏参数进行大幅更新和对频繁参数进行小幅更新

    +   - 适合处理稀疏数据


    η^τ = 1 / sqrt( Σ_{t=1}^τ ΔE^2(w^t) + ε ) · η^0


    w^(τ+1) = w^τ − η^τ ΔE(w^(τ))'
