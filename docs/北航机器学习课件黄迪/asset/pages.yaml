- pgno: 837
  md: '# # 复杂函数定积分计算


    +   - 上面的方法称为**蒙特卡罗方法（Monte Carlo method, Monte Carlo Simulation）**，可以用于计算任一个函数的定积分。


    +   - 如果要求 $\int_a^b f(x)\,dx$ 积分，而 $f(x)$ 积分的解析形式又很难求，可通过数值方法求其近似值：


    $$\int_a^b f(x)\,dx=\int_a^b\frac{f(x)}{q(x)}q(x)\,dx$$


    $$\approx\frac{1}{N}\sum_{i=1}^{N}\frac{f(x_i)}{q(x_i)}$$


    其中 $q(x)$ 是某种容易采样的分布，


    $x_i$ 是服从 $q(x)$ 分布的随机样本


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_837_0.png)'
