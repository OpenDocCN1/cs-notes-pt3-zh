- pgno: 459
  md: '# 讨论


    # PCA的优点


    具有很高普适性，最大程度地保持了原有数据的信 息；


    可对主元的重要性进行排序，并根据需要略去部分维数，达到降维从而简化模型或对数据进行压缩的效果；


    完全无参数限制，在计算过程中不需要人为设定参数或 是根据任何经验模型对计算进行干预，最终结果只与数据相关。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_459_0.png)'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# 讨论


    # PCA的局限性


    假设模型是线性的，也就决定了它能进行的主元分析之间的关系也是线性的；


    假设概率分布模型是指数型；


    假设数据具有较高信噪比，具有最高方差的一维向量被看作是主元，而方差较小的变化被认为是噪声。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_460_0.png)'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# 讨论


    # PCA vs. LDA


    PCA追求降维后能够最大化保持数据内在信息，并通过衡量在投影方向上的数据方差来判断其重要性。但这对数据的区分作用并不大，反而可能使得数据点混杂在一起。


    LDA所追求的目标与PCA不同，不是希望保持数据最多的信息，而是希望数据在降维后能够很容易地被区分开。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_461_0.png)'
  merge: -1
