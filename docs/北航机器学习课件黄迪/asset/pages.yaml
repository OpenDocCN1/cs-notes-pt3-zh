  md: '# 梯度消失问题


    梯度消失的原因


    σ′(z) ≤ 1/4

    |w| < 1

    ⇒ |σ′(z)w| ≤ 1/4


    ∂C/∂b₁ = σ′(z₁) w₂ σ′(z₂) w₃ σ′(z₃) w₄ σ′(z₄) ∂C/∂a₄


    ∂C/∂b₃ = σ′(z₃) w₄ σ′(z₄) ∂C/∂a₄


    common terms


    ∂C/∂b₁ < 1/16 ∂C/∂b₃

    << ∂C/∂bₙ, n > 3'
