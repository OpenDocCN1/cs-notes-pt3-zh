    +   - K. Pearson (1901年论文) 针对非随机变量

    +   - H. Hotelling(1933年论文) 推广到随机向量


    主成分分析(Principal Component Analysis, PCA)，将原有众多具有一定相关性的指标重新组合成一组少量互相关无的综合指标。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_485_0.png)


    使得降维后样本的方差尽可能大


