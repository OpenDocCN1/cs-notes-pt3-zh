- pgno: 321
  md: "# ID3算法\n\n# 信息熵(Entropy)\n\n+   - 信息论与概率统计中，熵表示随机变量不确定性的大小，是度量样本集合纯度最常用的一种指标。\n\
    \n+   - 令离散随机变量 $X$ 概率分布为 $p(X = x_i) = p_i$，则随机变量 $X$ 的熵定义为：\n+   \n+   $$H(X)\
    \ = -\\sum_{i=1}^{n} p_i \\log_2 p_i$$\n\n信息按二进制位编码，因此以2为底\n\n+   - 若 $X$ 为连续随机变量，则概率分布变成概率密度函数、求和符号变成积分符号即可。"
  merge: -1
  img_proc: true
- pgno: 322
  md: '# ID3算法


    # 信息熵(Entropy)


    +   - 熵定义了一个函数(概率密度函数)到一个值(信息熵)的映射

    +     P(x)→H (函数→数值)


    +   - 熵是随机变量不确定性的度量：


    +   - 不确定性越大，熵值越大；


    +   - 若随机变量退化成定值，熵为0.


    示例：明天下雪？明天晴天？


    +   - 均匀分布是“最不确定”的分布


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# ID3算法


    # 经验(信息)熵


    假设当前样本集合 $D$ 中第 $c$ ($c=1, 2, ..., C$) 类样本所占比例为 $p_c$，则 $D$ 的经验信息熵(简称经验熵)定义为：


    ```

    $H(D) = -\sum_{c=1}^{C} p_c \log_2 p_c$

    ```


    ```

    $= -\sum_{c=1}^{C} \frac{D_c}{D} \log_2 \frac{D_c}{D}$

    ```


    $H(D)$ 的值越小，则 $D$ 的纯度越高。'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# ID3算法\n\n# 条件熵(Conditional Entropy)\n\n+   对随机变量 $(X, Y)$，联合分布为 $p(X = x_i,\
    \ Y = y_i) = p_{ij}$ 条件熵 $H(Y|X)$ 表示在已知随机变量 $X$ 的条件下，随机变量 $Y$ 的不确定性，定义为在 $X$ 给定条件下\
    \ $Y$ 的条件概率分布的熵对 $X$ 的数学期望：\n+   \n+   $H(Y|X) = -\\sum_{i=1}^{n} p_i H(Y|X =\
    \ x_i)$\n\n+   $(X, Y)$ 发生所包含的信息熵，减去 $Y$ 单独发生包含的信息熵——在 $Y$ 发生前提下，$X$ 发生“新”带来的信息熵。"
  merge: -1
  img_proc: true
