- pgno: 496
  md: '# 概率主成分分析


    +   • PCA的概率表示


    最大似然估计求解


    给定 X = {xₙ}，求其对数似然函数


    $$\ln p(\mathbf{X}\mid\mu,\mathbf{W},\sigma^2)=\sum_{n=1}^{N}\ln p(\mathbf{x}_n\mid\mu,\mathbf{W},\sigma^2)$$


    $$=-\frac{ND}{2}\ln(2\pi)-\frac{N}{2}\ln|\mathbf{C}|-\frac{1}{2}\sum_{n=1}^{N}(\mathbf{x}_n-\mu)^T\mathbf{C}^{-1}(\mathbf{x}_n-\mu)$$


    对 μ 求导置零并代回


    $$=-\frac{N}{2}\{D\ln(2\pi)+\ln|\mathbf{C}|+\operatorname{Tr}(\mathbf{C}^{-1}\mathbf{S})\}$$


    相关矩阵


    $$\mathbf{W}_{ML}=\mathbf{U}_M(\mathbf{L}_M-\sigma^2\mathbf{I})^{1/2}\mathbf{R}$$


    $$\sigma^2_{ML}=\frac{1}{D-M}\sum_{i=M+1}^{D}\lambda_i$$'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 核主成分分析


    # Kernel PCA


    将主成分分析的线性假设一般化使之适应非线性数据


    传统PCA： D维样本 {xₙ}, n = 1,2,...,N, Σₙ xₙ = 0


    S uᵢ = λᵢ uᵢ   S = 1/N Σₙ₌₁ᴺ xₙ xₙᵀ   uᵢᵀ uᵢ = 1


    核PCA： 非线性映射 φ(x), xₙ ⟼ φ(xₙ), Σₙ φ(xₙ) = 0


    C vᵢ = λᵢ vᵢ   C = 1/N Σₙ₌₁ᴺ φ(xₙ) φ(xₙ)ᵀ


    1/N Σₙ₌₁ᴺ φ(xₙ) { φ(xₙ)ᵀ vᵢ } = λᵢ vᵢ


    vᵢ = Σₙ₌₁ᴺ aᵢₙ φ(xₙ)'
  merge: -1
