- pgno: 127
  md: '# 梯度下降(Gradient Descent)


    # 🔴 梯度下降


    梯度下降法是一个最优化算法，是求解无约束优化问题最简单和最基础的方法之一。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_127_0.png)


    以负梯度方向为搜索方向，越接近目标值，步长越小，前进越慢。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 梯度下降(Gradient Descent)


    +   - 梯度下降：

    +     - 给定初始值 w⁰

    +     - 更新 w 使得 J(w) 越来越小

    +       $$w_j^t = w_j^{t-1} - \alpha \frac{\partial}{\partial w_j} J(\mathbf{w})$$

    +       $$\frac{\partial}{\partial w_j} J(\mathbf{w}) = \sum_{i=1}^{N} (f(\mathbf{x}_i)
    - y_i) \cdot \mathbf{x}_{i,j}$$

    +     - 同时更新 w 的各维 $f(\mathbf{x}_i) = [\mathbf{w}^{t-1}]^T \mathbf{x}_i$

    +     - $\alpha$ 为学习率(Learning Rate)或更新步长'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 批处理梯度下降

    (Batch Gradient Descent)


    在梯度下降方法中，每次更新都利用所有数据，即：


    ```

    w_j^t = w_j^{t-1} - α Σ_{i=1}^N (f(x_i) - y_i) · x_j

    ```


    在大样本条件下，批处理梯度下降的迭代速度很慢


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_129_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_129_1.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 随机梯度下降

    (Stochastic Gradient Descent)


    基本思想：如果条件对所有样本都成立，则对任一样本也成立

    每次只用一个样本 (x_r, y_r)

    $w_j^t = w_j^{t-1} - \alpha (f(x_r) - y_r) \cdot x_{r,j}$


    +   - 收敛速度较快

    +   - 不太容易陷入局部极值

    +   - 对大样本数据较有效


    又称在线学习(Online Learning)


    变化形式


    可离线学习，每次“看”一个样本，对所有样本循环使用多次(一次循环称为一个Epoch)

    每次可以看一些样本(Mini-Batch)'
  merge: -1
  img_proc: true
