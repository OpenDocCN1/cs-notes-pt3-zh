    对 1/N XXᵀ 求的特征值 λᵢ 和特征向量 vᵢ


    1/N XXᵀ vᵢ = λᵢ vᵢ


    1/N XᵀX (Xᵀ vᵢ) = λᵢ (Xᵀ vᵢ) S的特征向量


    调整尺度 uᵢ ∝ Xᵀ vᵢ 满足 ‖uᵢ‖ = 1


    uᵢ = 1/(N λᵢ)^{1/2} Xᵀ vᵢ


    奇异值分解(Singular Value Decomposition, SVD)'
