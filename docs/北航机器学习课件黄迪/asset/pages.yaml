    +   - 固定学习率不是一个好的选择

    +   - 学习的不同阶段梯度不同


    +   - **自适应学习率**

    +     - 线性衰减

    +       $$\eta^k = \alpha\eta^{k-1},\quad \alpha=0.5,\ 0.2,\ldots$$

    +     - 指数衰减

    +       $$\eta^k = \eta^0 e^{-kt}$$

    +     - …


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_664_0.png)'
  merge: -1
  img_proc: true
- pgno: 665
  md: '# Adagrad


    +   - 对稀疏参数进行大幅更新和对频繁参数进行小幅更新

    +   - 适合处理稀疏数据


    $$\eta^\tau=\frac{1}{\sqrt{\sum_{t=1}^{\tau}\Delta E^2(\mathbf{w}^t)+\epsilon}}\cdot\eta^0$$


    $$\mathbf{w}^{(\tau+1)}=\mathbf{w}^{\tau}-\eta^{\tau}\Delta E(\mathbf{w}^{(\tau)})$$'
  merge: -1
  img_proc: true
- pgno: 666
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 667
  md: '# Adadelta


    +   - 使用前一次的梯度开方 $\sqrt{\mathbf{w}^{(\tau-1)}} + \epsilon$ 代替 $\eta^0$


    $\eta^{\tau} = \frac{\sqrt{\mathbf{w}^{(\tau-1)}} + \epsilon}{\sqrt{g^{(\tau)}}
    + \epsilon}$


    $\mathbf{w}^{(\tau+1)} = \mathbf{w}^{\tau} - \frac{\sqrt{\mathbf{w}^{(\tau-1)}}
    + \epsilon}{\sqrt{g^{(\tau)}} + \epsilon}\,\Delta E(\mathbf{w}^{(\tau)})$'
  merge: -1
  img_proc: true
- pgno: 668
  md: '# 动量SGD


    +   SGD在遇到局部极值和鞍点时容易震荡


    +   引入动量momentum，抑制梯度的震荡


    w^{(τ+1)} = w^{τ} - η \frac{1}{m} \sum_{i=1}^{m} ΔE(x_i; w^{(τ)})


    ∇_w E^{(τ)}


    g^{(τ)} 表示 τ 时刻的优化方向，且 g^{(0)} = ∇_w E^{(0)}


    τ 时刻的优化方向为： g^{(τ)} = α g^{(τ-1)} + η ∇_w E^{(τ)}


    w^{(τ+1)} = w^{τ} - g^{τ}'
  merge: -1
  img_proc: true
