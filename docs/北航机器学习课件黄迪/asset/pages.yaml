- pgno: 54
  md: '# 机器学习目标


    # Components of generalization error


    +   - **Bias (偏差)**: how much the average model over all training sets differ
    from the true model?

    +     - Error due to inaccurate assumptions/simplifications made by the model


    +   - **Variance (方差)**: how many models estimated from different training sets
    differ from each other'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # 机器学习目标


    +   - **Under-fitting:** model is too “simple” to represent all the relevant class
    characteristics

    +     - High bias and low variance

    +     - High training error and high test error


    +   - **Over-fitting:** model is too “complex” and fits irrelevant characteristics
    (noise) in the data

    +     - Low bias and high variance

    +     - Low training error and high test error'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 机器学习目标


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_56_0.png)


    Models with too few parameters are inaccurate because of a large bias (not enough
    flexibility).


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_56_1.png)


    Models with too many parameters are inaccurate because of a large variance (too
    much sensitivity to the sample).'
  merge: -1
  img_proc: true
