- pgno: 670
  md: '# Nesterov梯度（NAG）


    +   • 具有一定的预测性


    w^{τ''} = w^{τ} + β∇_w E^{(τ-1)}


    g^{(τ)} = αg^{(τ-1)} + η∇_w E^{(τ'')}


    w^{(τ+1)} = w^{τ} - g^{τ}'
