- pgno: 1094
  md: '# 拒绝采样（Rejection Sampling）


    +   - 找到一个常数 $k$ $\tilde{p}(z) \le kq(z)$ ⇒ 对比函数 comparison function

    +   - 采样步骤

    +     1、从 $q(z)$ 中产生 $z_0$

    +     2、从 $[0, kq(z_0)]$ 均匀分布中产生 $u_0$

    +     3、如果 $u_0 > \tilde{p}(z_0)$ 拒绝采样，否则接受采样


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1094_0.png)


    $p(\text{accept}) = \int \{\tilde{p}(z)/kq(z)\}q(z)dz = \frac{1}{k}\int \tilde{p}(z)dz$


    拒绝采样又称为接受-拒绝采样（Acceptance-Rejection Sampling）'
  merge: -1
  img_proc: true
- pgno: 1095
  md: '# 自适应拒绝采样

    (Adaptive Rejection Sampling)


    +   - 实际应用中，往往很难找到合适的 $q(z)$

    +   - 特别地，当 $p(z)$ 为 log 凹函数时，可采用 ARS


    $q(z)=k_i\lambda_i\exp\{-\lambda_i(z-z_{i-1})\},\quad z_{i-1}<z\le z_i$


    $\ln q(z)=C-\lambda(z-\tilde z_{i-1}),\quad \tilde z_{i-1}<z\le \tilde z_i$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1095_0.png)


    # 在log域执行拒绝采样


    +   - 如果满足，接受

    +   - 如果拒绝，重新逼近'
  merge: -1
  img_proc: true
- pgno: 1096
  md: '# 重要性采样 (Importance Sampling)


    +   - 对于某个变量 $z \sim p(z)$

    +   - 一个关于 $z$ 函数 $f(z)$，预测 $f(z)$ 的关于 $Z$ 的期望：

    +     $$\mathbb{E}(f) = \int f(z)p(z)dz$$

    +   - $p(z)$ 很复杂，但可以估算每个出现 $z$ 的概率 $p(z)$

    +   - 要估计 $\mathbb{E}(f) = \int f(z)p(z)dz$

    +   - 可以按如下方式计算-将空间网络化

    +   - $$\mathbb{E}(f) \approx \sum_{l=1}^{L} p(z^{(l)}) f(z^{(l)})$$ 维度灾难'
  merge: -1
  img_proc: true
- pgno: 1097
  md: '# 重要性采样（Importance Sampling）


    +   与拒绝采样类似，借助一个容易采样的建议分布 $q(z)$


    $\mathbb{E}(f) = \int f(z)p(z)dz$

    $= \int f(z)\frac{p(z)}{q(z)}q(z)dz$

    $\approx \frac{1}{L}\sum_{l=1}^{L}\frac{p(z^{(l)})}{q(z^{(l)})}f(z^{(l)})$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1097_0.png)


    重要性权重


    注：$p(z) = \frac{1}{Z_p}\tilde{p}(z)$'
  merge: -1
