  md: '# 决策树定义


    +   - 决策树(Decision Tree)

    +     - 决策树是一种树型结构，由结点和有向边组成

    +     - 结点

    +       - 内部结点表示一个属性或特征

    +       - 叶结点代表一种类别

    +     - 有向边/分支

    +       - 分支代表一个测试输出


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_393_0.png)'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# 决策树算法


    # 基本思想


    +   采用自顶向下的递归方法，以信息熵为度量构造一棵熵值下降最快的树，到叶子结点处的熵值为零，此时每个叶结点中的实例都属于同一类


    +   决策树可以看成一个if-then的规则集合


    +   一个决策树将特征空间划分为不相交的单元(Cell)或区域(Region)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_394_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_394_1.png)'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# # 算法流程


    +   - **基本流程分为两步**

    +     - **第1步：**训练，从数据中获取知识进行学习

    +       利用训练集建立(并精化)一棵决策树，构建决策树模型。

    +     - **第2步：**测试，利用生成的模型对输入数据进行分类

    +       对测试样本，从根结点依次测试记录的属性值，直至到达某个叶结点，找到该样本所在的类别。'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# 算法流程


    # 构建过程的基本流程


    +   - Step1：选取一个属性作为决策树的根结点，然后就这个属性所有的取值创建树的分支。


    +   - Step2：用这棵树来对训练数据集进行分类：

    +     - 如果一个叶结点的所有实例都属于同一类，则以该类为标记标识此叶结点。

    +     - 如果所有的叶结点都有类标记，则算法终止。


    +   - Step3：否则，选取一个从该结点到根路径中没有出现过的属性作为标记标识该结点，然后就这个属性的所有取值继续创建树的分支；重复算法步骤2。'
  merge: -1
  img_proc: true
