- pgno: 842
  md: '# 基本采样法 (Basic Sampling)


    +   练习：指数分布 $p(y) = \lambda \exp(-\lambda y)\quad y \in [0, \infty)$


    求 $y = f(z)$


    $h(y) = \int_{-\infty}^{y} p(\hat{y}) d\hat{y} = 1 - \exp(-\lambda y)$


    $y = h^{-1}(z) = -\lambda^{-1} \ln(1 - z)$


    +   多变量分布形式：


    $p(y_1, \dots, y_M) = p(z_1, \dots, z_M) \left| \frac{\partial(z_1, \dots, z_M)}{\partial(y_1,
    \dots, y_M)} \right|$'
