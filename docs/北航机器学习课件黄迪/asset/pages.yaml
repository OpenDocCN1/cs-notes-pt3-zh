- pgno: 722
  md: '# RMSprop


    +   - Adagrad引起学习率衰减


    $$\eta^\tau = \frac{1}{\sqrt{\sum_{t=1}^{\tau}\Delta E^2(\mathbf{w}^\tau)}+\epsilon}\eta^1$$


    学习率衰减


    +   - 减弱梯度累积


    $$\mathbf{w}^{(\tau+1)}=\mathbf{w}^{\tau}-\frac{\eta^0}{\sqrt{g^{(\tau)}}+\epsilon}\Delta
