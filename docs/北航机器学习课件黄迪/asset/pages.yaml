- pgno: 523
  md: '# K均值算法


    +   两步走策略


    – 第二步：初始化 $r_{nk}$，按照最优化准则产生 $\mu_k$


    $J = \sum_{n=1}^{N} \sum_{k=1}^{K} r_{nk} \| \mathbf{x}_n - \mu_k \|^2$


    $2 \sum_{n=1}^{N} r_{nk} (\mathbf{x}_n - \mu_k) = 0$


    $\mu_k = \frac{\sum_n r_{nk} \mathbf{x}_n}{\sum_n r_{nk}}$'
  merge: -1
