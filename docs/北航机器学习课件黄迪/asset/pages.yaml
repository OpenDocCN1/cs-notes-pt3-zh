  md: '# 支持向量机


    # 非线性支持向量机


    利用一个固定的非线性映射将数据映射到特征空间学习的线性分类器等价于基于原始数据学习的非线性分类器。


    y(x) = w^T x + b  ⇒  y(x) = w^T φ(x) + b


