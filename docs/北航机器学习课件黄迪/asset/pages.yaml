- pgno: 849
  md: '# 重要性采样（Importance Sampling）


    与拒绝采样类似，借助一个容易采样的建议分布 $q(z)$


    $$\mathbb{E}(f)=\int f(z)p(z)\,dz$$


    $$=\int f(z)\frac{p(z)}{q(z)}q(z)\,dz$$


    $$\approx \frac{1}{L}\sum_{l=1}^{L}\frac{p(z^{(l)})}{q(z^{(l)})}f(z^{(l)})$$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_849_0.png)


    # 重要性权重


    注：$p(z)=\frac{1}{Z_p}\tilde{p}(z)$'
  merge: -1
  img_proc: true
- pgno: 850
  md: '# 重要性采样（Importance Sampling）


    +   - 同样地，我们也希望 $q(z)$ 具有类似的性质，即

    +     $$q(z)=\frac{1}{Z_q}\tilde{q}(z)$$

    +   - 再看 $\mathbb{E}(f)$

    +     $$\mathbb{E}(f)=\int f(z)p(z)\,dz$$

    +     $$=\frac{Z_q}{Z_p}\int f(z)\frac{\tilde{p}(z)}{\tilde{q}(z)}q(z)\,dz$$

    +     $$\approx \frac{Z_q}{Z_p}\frac{1}{L}\sum_{l=1}^{L}\tilde{r}_l f(z^{(l)})$$


    其中 $\tilde{r}_l=\frac{\tilde{p}(z^{(l)})}{\tilde{q}(z^{(l)})}$'
  merge: -1
  img_proc: true
- pgno: 851
  md: "# 重要性采样 (Importance Sampling)\n\n$$\frac{Z_p}{Z_q} = \\frac{1}{Z_q} \\int \\\
    tilde p(z) dz$$\n\n$$= \\int \\frac{\\tilde p(z)}{\\tilde q(z)} q(z) dz$$\n\n\
    $$\\approx \\frac{1}{L} \\sum_{l=1}^{L} \\tilde r_l$$\n\n$$\\mathbb{E}(f) \\approx\
    \ \\sum_{l=1}^{L} w_l f(z^{(l)})$$\n\n$$w_l = \\frac{\\tilde r_l}{\\sum_m \\tilde\
    \ r_m} = \\frac{\\tilde p(z^{(l)})/q(z^{(l)})}{\\sum_m \\tilde p(z^{(m)})/q(z^{(m)})}$$"
