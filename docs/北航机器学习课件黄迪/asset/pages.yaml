    $$g^{(\tau)} = \alpha g^{(\tau-1)} + \eta\nabla_{\mathbf{w}}E^{(\tau'')}$$


    $$\mathbf{w}^{(\tau+1)} = \mathbf{w}^{\tau} - g^{\tau}$$

