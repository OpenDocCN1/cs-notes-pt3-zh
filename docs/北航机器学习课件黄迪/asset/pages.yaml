- pgno: 581
  md: '# EM算法求解混合高斯问题


    # EM for Gaussian Mixtures


    Given a Gaussian mixture model, the goal is to maximize the likelihood function
    with respect to the parameters (comprising the means and covariances of the components
    and the mixing coefficients).


    +   1. Initialize the means μ_k, covariances Σ_k and mixing coefficients π_k,
    and evaluate the initial value of the log likelihood.

    +   2. E step. Evaluate the responsibilities using the current parameter values


    γ(z_nk) = π_k N(x_n | μ_k, Σ_k) / Σ_{j=1}^K π_j N(x_n | μ_j, Σ_j). (9.23)'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# EM算法求解混合高斯问题


    3. M step. Re-estimate the parameters using the current responsibilities


    μ_k^{new} = (1/N_k) Σ_{n=1}^{N} γ(z_{nk}) x_n  (9.24)


    Σ_k^{new} = (1/N_k) Σ_{n=1}^{N} γ(z_{nk}) (x_n - μ_k^{new}) (x_n - μ_k^{new})^T  (9.25)


    π_k^{new} = N_k / N  (9.26)


    where


    N_k = Σ_{n=1}^{N} γ(z_{nk}).  (9.27)'
