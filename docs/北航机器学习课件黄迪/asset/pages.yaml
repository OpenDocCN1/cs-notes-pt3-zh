- pgno: 326
  md: '# ID3算法


    # 条件熵-推导


    H(X|Y) = H(X,Y) - H(Y)

    = -∑_{x,y} p(x,y) log₂ p(x,y) + ∑_{y} p(y) log₂ p(y)

    = -∑_{x,y} p(x,y) log₂ p(x,y) + ∑_{y} (∑_{x} p(x,y)) log₂ p(y)

    = -∑_{x,y} p(x,y) log₂ p(x,y) + ∑_{x,y} p(x,y) log₂ p(y)

    = -∑_{x,y} p(x,y) log₂ [p(x,y)/p(y)]

    = -∑_{x,y} p(x,y) log₂ p(x|y)'
  merge: -1
  img_proc: true
- pgno: 327
  md: "# ID3算法\n\n经验条件熵\n\n+   - 假设当前样本集合 $D$ 共有 $C$ 类，每一类有 $D_c$ 个样本，属性 $a(a \\in\
    \ A)$ 有不同的取值 $\\{a_1, a_2, ..., a_N\\}$，每一类中属性为 $i$ 的样本数为 $D_c^n$，则 $D$ 的经验条件熵定义为\n\
    +   \n+   $$H(D|a) = -\\sum_{n,c} p(D_c, a_n) \\log_2 p(D_c|a_n)$$ \n+   \n+ \
    \  $$= -\\sum_{n=1}^{N} \\frac{|D^n|}{|D|} \\sum_{c=1}^{C} \\frac{|D_c^n|}{|D^n|}\
    \ \\log_2 \\frac{|D_c^n|}{|D^n|}$$ \n+   \n+   $$= -\\sum_{n=1}^{N} \\frac{|D^n|}{|D|}\
    \ H(D^n)$$\n\n+   - 特征 $a$ 的信息对样本 $D$ 的信息的不确定性减少的程度"
  merge: -1
  img_proc: true
- pgno: 328
  md: "# ID3算法\n\n# 信息增益(Information Gain)\n\n+   - 特征*a*对训练数据集*D*的信息增益*G(D, a)*，定义为集合*D*的经验熵*H(D)*与特征*a*给定条件下*D*的经验条件熵*H(D|a)*之差，即：\n\
    +   \n+     $G(D, a) = H(D) - H(D \\mid a)$\n+   \n+     $= H(D) + \\sum_{n=1}^{N}\
    \ \\frac{|D^n|}{|D|} H(D^n)$\n\n+   - ID3算法即是以此信息增益为准则，对每次递归的结点属性进行选择的。"
  merge: -1
  img_proc: true
- pgno: 329
  md: '# # ID3算法


    # ## 决策树的生成算法


    **输入：**训练数据集$D$，特征集$A$，阈值$\epsilon$


    **输出：**决策树$T$


    +   1. 若$D$中所有实例属于同一类$C_k$，则$T$为单结点树，并将$C_k$作为该结点的类标记，返回$T$；

    +   2. 若$A=\varnothing$，则$T$为单结点树，并将$D$中实例数最大类$C_k$作为该结点类标记，返回$T$；

    +   3. 否则，计算$A$中各特征对$D$的信息增益，选择信息增益最大的特征$A_g$；

    +   4. 如果$A_g$的信息增益小于阈值$\epsilon$，则置$T$为单结点树，并将$D$中样本数最大的类$C_k$作为该结点的类标记，返回$T$；

    +   5. 否则，对$A_g$的每一个可能值$a_i$，分割$D$为若干非空子集$D_i$，将$D_i$中实例数最大的类作为标记，构建子结点，由结点及其子结点构成树$T$，返回$T$；

    +   6. 对第$i$个子结点，以$D_i$为训练集，$A-\{A_g\}$为特征集，递归的调用第(1)~(5)步，得到子树$T_i$，返回$T_i$。'
  merge: -1
  img_proc: true
