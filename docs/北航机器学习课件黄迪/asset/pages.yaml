  md: '# 基本采样法（Basic Sampling）


    🔴 **思想：** 从基本概率分布中产生新变量的分布


    +   - 均匀分布（Uniform distribution）：\(p(z)=1,\ z\in(0,1)\)


    +   - 产生非均匀分布：\(p(y),\ y=f(z)\)


    \[p(y)=p(z)\left|\frac{dz}{dy}\right|\]


    \[p(z)=1\]


    \[z=h(y)\equiv\int_{\infty}^{y}p(\hat y)\,d\hat y\]


    \[y=h^{-1}(z)\]


