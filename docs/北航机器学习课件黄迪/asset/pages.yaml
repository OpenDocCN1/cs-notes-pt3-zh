  md: '# 主成分分析-应用


    +   利用PCA处理高维数据


    在实际应用中，样本维数可能很高，远大于样本的个数


    在人脸识别中，1000张人脸图像，每张图像100×100像素


    *D*维空间，*N*个样本点，*N* < *D*


    **X**是*N*×*D*维的数据矩阵，其行向量为(**x**ₙ − **x̄**)ᵀ


    S = 1/N Σₙ=1ᴺ (xₙ − x̄)(xₙ − x̄)ᵀ 可以写为 S = N⁻¹ Xᵀ X


    S 维数？ D×D 维 10000×10000


    1/N Xᵀ X uᵢ = λᵢ uᵢ ⟶ 1/N X Xᵀ (X uᵢ) = λᵢ (X uᵢ)


    令 vᵢ = X uᵢ，得到 1/N X Xᵀ vᵢ = λᵢ vᵢ N×N 维'
  merge: -1
