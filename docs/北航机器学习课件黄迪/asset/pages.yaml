  md: '# # 算法流程


    +   - **基本流程分为两步**

    +     - **第1步：**训练，从数据中获取知识进行学习

    +       利用训练集建立(并精化)一棵决策树，构建决策树模型。

    +     - **第2步：**测试，利用生成的模型对输入数据进行分类

    +       对测试样本，从根结点依次测试记录的属性值，直至到达某个叶结点，找到该样本所在的类别。'
