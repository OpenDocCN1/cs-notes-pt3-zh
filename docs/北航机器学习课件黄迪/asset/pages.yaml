- pgno: 288
  md: '# VC维


    # SLT中衡量函数集性能的指标


    一般而言，VC维反映了函数集的学习能力，VC维越大则学习机器越复杂，学习内容量就越大。


    目前没有通用的关于任意函数集VC维计算的理论，只对一些特殊的函数集知道其函数维。


    +   - 在$n$维实数空间中线性分类器和线性实函数的VC维是$n+1$

    +   - 而$f(x, a)=sin(ax)$的VC维则为无穷大


    如何用理论和试验的方法计算其VC维是当前SLT中一个待研究的问题。'
