- pgno: 1119
  md: '# Markov Random Fields


    +   - 分布形式化：

    +     - 使用基于极大团的势函数（因子）

    +       - 对于图中节点的一个子集，若其中任意两节点间都有边连接，则称该节点子集为一个“团”（clique）。若一个团中加入另外任何一个节点都不再形成团，则称该团为“极大团”（maximal
    clique）

    +       - 图中{x₁, x₂}, {x₂, x₆}, {x₂, x₅, x₆}等为团

    +       - 图中{x₂, x₆}不是极大团

    +       - 每个节点至少出现在一个极大团中

    +     - 多个变量之间的连续分布可基于团分解为多个因子的乘积


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1119_0.png)'
  merge: -1
  img_proc: true
- pgno: 1120
  md: "# Markov Random Fields\n\n+   - 极大团的势函数（因子）：\n+     - 多个变量之间的连续分布可基于团分解为多个因子的乘积，每个因子只与一个团相关\n\
    +     - 对于 n 个变量 x = {x₁, x₂, ... xₙ}，所有团构成的集合为 C，与团 Q ∈ C 对应的变量集合记为 x_Q，则联合概率定义为：\n\
    +       $$P(\\mathbf{x}) = \\frac{1}{Z} \\prod_{Q \\in C} \\psi_Q(\\mathbf{x}_Q)$$\
    \ \n+     - 其中，ψ_Q 是于团 Q 对应的势函数\n+     - 若变量问题较多，需要考虑极大团"
  merge: -1
  img_proc: true
- pgno: 1121
  md: '# Markov Random Fields


    +   - **基于极大团的势函数：**

    +     - 通过极大团构造势函数。若团 Q 不是一个极大团，则必然被一个极大团 Q* 包含，这意味着变量 x_Q 的关系不仅体现在势函数 ψ_Q 中，还体现在
    ψ_{Q*} 中

    +     - 联合概率分布可以使用极大团定义

    +     - 假设所有极大团构成的集合为 C*


    $$P(\mathbf{x})=\frac{1}{Z^*}\prod_{Q\in C^*}\psi_Q(\mathbf{x}_Q)$$


    - 其中，$Z^*$ 是规范化因子：$$Z^*=\sum_{\mathbf{x}}\prod_{Q\in C^*}\psi_Q(\mathbf{x}_Q)$$'
  merge: -1
  img_proc: true
