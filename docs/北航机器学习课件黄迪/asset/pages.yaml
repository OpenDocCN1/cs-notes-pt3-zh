- pgno: 271
  md: '# 支持向量机


    # 非线性支持向量机


    根据问题和数据的不同，选择带有不同的核函数。


    一些常用的核函数：


    线性核： $k(x_1, x_2) = x_1^T x_2$


    多项式核： $k(x_1, x_2) = (<x_1, x_2> + R)^d$


    高斯核： $k(x_1, x_2) = \exp\{ -\frac{||x_1 - x_2||^2}{2\sigma^2} \}$


    Sigmoid核： $k(x_1, x_2) = \tanh(\beta_0 x_1^T x_2 + \beta_1)$


    如何判断一个函数是否可以作为核函数？


    Mercer定理：

    $\mathbb{R}^n \times \mathbb{R}^n \to \mathbb{R}$ 上的映射 $k$ 是一个有效核函数(也称 Mercer
    核函数) 当且仅当 对于训练样本其相应的核函数矩阵是对称半正定的, 即对于任何平方可积函数 $g(x)$ 有 $\iint k(x,y) g(x) g(y)
    dx dy \ge 0$。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 序列最小优化算法


    +   ● J. C. Platt(1999年提出)


    支持向量机的学习问题可以形式化为求解具有全局最优解的凸二次规划问题。许多方法可以用于求解这一问题，但当训练样本容量很大时，这些算法往往效率较低，以致无法使用。


    序列最小优化算法(Sequential Minimal Optimization, SMO)是一种启发式算法。基本思想是：如果所有变量都满足此优化问题的KKT条件，那么这个问题的解就得到了。


    SMO算法的特点是不断地将原二次规划问题分解为只有两个变量的二次规划问题，并对子问题进行解析求解，直到所有变量都满足KKT条件为止。因为子问题解析解存在，所以每次计算子问题都很快，虽然子问题次数很多，但是总体上还是高效的。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 序列最小优化算法


    # SMO算法解凸二次规划问题


    minₐ ½ ∑ₙ=1ᴺ ∑ₘ=1ᴺ aₙ aₘ tₙ tₘ k(xₙ, xₘ) − ∑ₙ=1ᴺ aₙ

    s.t. 0 ≤ aₙ ≤ C, n = 1, 2, ..., N

    ∑ₙ=1ᴺ aₙ tₙ = 0


    子问题有两个变量，一个是违反KKT条件最严重的，另一个有约束条件自动确定。两个变量中只有一个是自由变量。假设a₁, a₂为两个变量，a₃, a₄, ...,
    a_N固定，那么： a₁ = −t₁ ∑ₙ=2ᴺ aₙ tₙ = 0 即a₂确定，a₁也随之确定。


    SMO算法包括：求解两个变量二次规划的解析方法和选择变量的启发式方法。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # 序列最小优化算法


    # ● 两个变量二次规划的解析方法


    不失一般性，假设选择的两个变量是 $a_1$ 和 $a_2$，其他变量 $a_i$（$i=3,4,\ldots,N$）是固定的，原问题的子问题可以写成：


    $$\begin{aligned}

    \min_{a_1,a_2}\quad W(a_1,a_2)={}&\frac{1}{2}K_{11}a_1^2+\frac{1}{2}K_{22}a_2^2+t_1t_2K_{12}a_1a_2\\

    &-(a_1+a_2)+t_1a_1\sum_{n=3}^{N}t_na_nK_{n1}+t_2a_2\sum_{n=3}^{N}t_na_nK_{n2}+const\\

    \text{s.t.}\quad &a_1t_1+a_2t_2=-\sum_{n=3}^{N}t_na_n=\zeta\\

    &0\leq a_n\leq C,\quad i=1,2

    \end{aligned}$$


    其中，$K_{mn}=K(x_m,x_n)$，$m,n=1,2,\ldots,N$，$\zeta$ 是常数。'
  merge: -1
  img_proc: true
