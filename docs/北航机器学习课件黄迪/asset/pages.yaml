- pgno: 683
  md: '# # 梯度消失问题


    # ● 梯度消失的起因


    $$\frac{\partial C}{\partial b_1}=\frac{\partial C}{\partial y_4}\frac{\partial
    y_4}{\partial z_4}\frac{\partial z_4}{\partial x_4}\frac{\partial x_4}{\partial
    z_3}\frac{\partial z_3}{\partial x_3}\frac{\partial x_3}{\partial z_2}\frac{\partial
    z_2}{\partial x_2}\frac{\partial x_2}{\partial z_1}\frac{\partial z_1}{\partial
    b_1}$$


    $$=\frac{\partial C}{\partial y_4}\sigma''(z_4)w_4\sigma''(z_3)w_3\sigma''(z_2)w_2\sigma''(z_1)$$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_683_0.png)


    $$\sigma''(z)\leq\frac{1}{4},\quad |w|<1$$


    $$|\sigma''(z)w|\leq\frac{1}{4}$$


    $$\frac{\partial C}{\partial b_1}\rightarrow 0\quad\text{梯度消失}$$


    $$|\sigma''(z)w|>1\rightarrow\text{梯度爆炸}$$'
  merge: -1
  img_proc: true
