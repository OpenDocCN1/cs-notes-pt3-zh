  md: "# # 数据降维\n\n+   • **为什么要降维？**\n+   \n+     在原始的高维空间中，包含冗余信息和噪声信息，会在实际应用中引入误差，影响准确率；而降维可以提取数据内部的本质结构，减少冗余信息和噪声信息造成的误差，提高应用中的精度。\n\
    \n+   • **降维**\n+   \n+     利用某种映射将原高维度空间的数据点投影到低维度的空间：\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1014_0.png)"
