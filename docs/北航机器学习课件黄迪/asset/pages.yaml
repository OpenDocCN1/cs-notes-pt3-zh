- pgno: 297
  md: '# 支持向量机


    # 线性支持向量机


    问题转化为最大化 $\|w\|^{-1}$，等价于 $\arg\min_{w,b} \frac{1}{2}\|w\|^2$


    s.t. $t_n(w^T x_n + b) \ge 1$


    二次规划问题


    拉格朗日乘子法 $L(w,b,a)=\frac{1}{2}\|w\|^2 - \sum_{n=1}^{N} a_n\{t_n(w^T x_n + b)-1\},
    a_n \ge 0$


    分别对变量求导 $\frac{\partial L(w,b,a)}{\partial w}= w - \sum_{n=1}^{N} a_n t_n x_n
    = 0$


    $\frac{\partial L(w,b,a)}{\partial b}= \sum_{n=1}^{N} a_n t_n = 0$


    代入$L$得到对偶形式：


    $\tilde{L}(a)= \sum_{n=1}^{N} a_n - \frac{1}{2} \sum_{n=1}^{N} \sum_{m=1}^{N}
    a_n a_m t_n t_m x_n^T x_m$


    $w.r.t.\ a_n \ge 0, n=1,...,N, \sum_{n=1}^{N} a_n t_n = 0$


    二次规划问题'
  merge: -1
