- pgno: 630
  md: '# BP反向传播算法


    +   样本集 {x_n, t_n}_{n=1}^N, x ∈ ℝ^D, t ∈ ℝ^3


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_630_0.png)


    y_k = Σ_{i=1}^D w_{ki} x_i


    E_n(w) = 1/2 Σ_{k=1}^3 (y_{nk} - t_{nk})^2


    ∂E_n / ∂w_{ki} = (y_{nk} - t_{nk}) x_{ni}'
  merge: -1
  img_proc: true
- pgno: 631
  md: '# BP反向传播算法


    ● 练习： 对非线性 $y_k = h(a_k) = h\left(\sum_i w_{ki} x_i\right)$


    计算 $\frac{\partial E_n}{\partial w_{ki}}$    $E_n = \frac{1}{2}\sum_k (y_k - t_k)^2$


    $\frac{\partial E_n}{\partial w_{ki}} = \frac{\partial E_n}{\partial y_k}\frac{\partial
    y_k}{\partial a_k}\frac{\partial a_k}{\partial w_{ki}}$


    $= (y_k - t_k)\frac{\partial y_k}{\partial a_k}\frac{\partial a_k}{\partial w_{ki}}$


    $= (y_k - t_k)h''(a_k)\frac{\partial a_k}{\partial w_{ki}}$


    $= (y_k - t_k)h''(a_k)x_i$'
  merge: -1
  img_proc: true
- pgno: 632
  md: '# BP反向传播算法


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_632_0.png)


    a_j = Σ_i w_{ji} z_i    z_j = h(a_j)


    ∂E_n / ∂w_{ji} = ∂E_n / ∂a_j · ∂a_j / ∂w_{ji}


    δ_j ≡ ∂E_n / ∂a_j    ∂a_j / ∂w_{ji} = z_i


    ∂E_n / ∂w_{ji} = δ_j z_i'
  merge: -1
  img_proc: true
- pgno: 633
  md: '# BP反向传播算法


    对于输出层而言： $\delta_k = y_k - t_k$


    对于隐藏层而言： $\delta_j \equiv \frac{\partial E_n}{\partial a_j} = \sum_{k} \frac{\partial
    E_n}{\partial a_k} \frac{\partial a_k}{\partial a_j}$


    $\delta_j = h''(a_j) \sum_{k} w_{kj} \delta_k$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_633_0.png)'
  merge: -1
  img_proc: true
- pgno: 634
  md: '# BP反向传播算法


    ● 练习： $a_k = \sum_{j} w_{kj} z_j \quad z_j = h(a_j)$


    推导 $\delta_j = h''(a_j) \sum_{k} w_{kj} \delta_k$


    $\delta_j = \sum_{k} \frac{\partial E_n}{\partial a_k} \frac{\partial a_k}{\partial
    a_j} = \sum_{k} \delta_k \frac{\partial a_k}{\partial a_j}$


    $= \sum_{k} \delta_k \frac{\partial a_k}{\partial z_j} \frac{\partial z_j}{\partial
    a_j} = \sum_{k} \delta_k w_{kj} \frac{\partial h(a_j)}{\partial a_j}$


    $= h''(a_j) \sum_{k} \delta_k w_{kj}$'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# BP反向传播算法


    +   - 初始化权重 $w_{ij}$

    +   - 对于输入的训练样本，求取每个节点输出和最终输出层的输出值

    +   - 对输出层求取 $\delta_k = y_k - t_k$

    +   - 对于隐藏层求取 $\delta_j = h''(a_j) \sum_{k} w_{kj} \delta_k$

    +   - 求取输出误差对于每个权重的梯度 $\frac{\partial E_n}{\partial w_{ji}} = \delta_j z_i$

    +   - 更新权重 $\mathbf{w}^{(\tau+1)} = \mathbf{w}^{\tau} + \eta \Delta E(\mathbf{w}^{(\tau)})$'
  merge: -1
  img_proc: true
- pgno: 636
  md: '# BP反向传播算法


    +   - 多层前馈网络的学习算法比较复杂，其主要困难是中间的隐层不直接与外界连接，无法直接计算其误差。

    +   - 反向逐层传播输出层的误差，以间接算出隐层误差。算法分为两个阶段：第一阶段(正向过程)输入信息从输入层经隐层逐层计算各单元的输出值；第二阶段(反向传播过程)由输出误差逐层向前算出隐层各单元的误差，并用此误差修正前层权值。'
  merge: -1
