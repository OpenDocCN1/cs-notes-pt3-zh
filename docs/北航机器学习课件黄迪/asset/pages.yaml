  md: '# # EM算法


    ● **A. P. Dempster等人（1977年提出）**


    Expectation Maximization (EM)，期望最大化是一种迭代算法，用于含有**隐变量**(Hidden Variable)或**潜变量**(Latent
    Variable)概率模型参数的极大似然估计或极大后验概率估计。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1010_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1010_1.png)'
