  md: '# 支持向量机


    # 非线性支持向量机


    利用一个固定的非线性映射将数据映射到特征空间学习的线性分类器等价于基于原始数据学习的非线性分类器。


    a₁X₁ + a₂X₁² + a₃X₂ + a₄X₂² + a₅X₁X₂ + a₆ = 0    φ : ℝ² → ℝ⁵


    # 原始样本增加到三维


    a₁X₁³ + a₂X₂³ + a₃X₃³ + a₄X₁²X₂ + a₅X₁²X₃ + a₆X₂²X₁ + a₇X₂²X₃ + a₈X₃²X₁ + a₉X₃²X₂
    + a₁₀X₁X₂X₃ + a₁₁X₁² + a₁₂X₂² + a₁₃X₃² + a₁₄X₁X₂ + a₁₅X₂X₃ + a₁₆X₁X₃ + a₁₇X₁ +
