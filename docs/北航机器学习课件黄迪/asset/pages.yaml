- pgno: 1108
  md: '# Metropolis-Hastings 方法


    +   思想：对于需要采样的一分布 $p(z)$，构造一个转移矩阵为 $T$ 的马尔可夫链，使它的平稳分布恰好为 $p(z)$


    +   假设有一个转移矩阵 $Q(z, z'') = q(z''|z)$，$q(z)$为容易采样的分布


    +   通常情况下，该转移矩阵难以满足细致平稳条件

    +   $p(z)q(z''|z) \neq p(z'')q(z|z'')$


    +   引入 $a(z, z'')$ 使

    +   $p(z)q(z''|z)a(z, z'') = p(z'')q(z|z'')a(z'', z)$


    其中：

    $a(z, z'') = p(z'')q(z|z'')$

    $a(z'', z) = p(z)q(z''|z)$

    } 接受率'
  merge: -1
  img_proc: true
