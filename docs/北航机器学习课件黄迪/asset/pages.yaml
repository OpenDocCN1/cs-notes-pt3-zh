  md: "# 与M-H的关系\n\n+   - 建议概率：\n+   \n+     $$q_k(z^*|z)=p(z_k^*|z_{\\neg k})$$\n\
    \n+   - 接受概率：\n+   \n+     $$A_k(z^*,z^{(\\tau)})=\\min\\left\\{1,\\frac{\\tilde\
    \ p(z^*)q_k(z^{(\\tau)}|z^*)}{\\tilde p(z^{(\\tau)})q_k(z^*|z^{(\\tau)})}\\right\\\
    }$$\n\n$$p(z)=p(z_k|z_{\\neg k})p(z_{\\neg k})\\qquad z_k^*=z_{\\neg k}$$\n\n\
    $$A(z^*,z)=\\frac{p(z^*)q_k(z|z^*)}{p(z)q_k(z^*|z)}=\\frac{p(z_k^*|z_{\\neg k})p(z_{\\\
    neg k})p(z_k|z_{\\neg k}^*)}{p(z_k|z_{\\neg k})p(z_{\\neg k})p(z_k^*|z_{\\neg\
    \ k})}=1$$"
