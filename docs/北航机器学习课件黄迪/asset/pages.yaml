- pgno: 918
  md: '# # 隐马尔可夫模型

    ## (Hidden Markov Models)


    +   - HMM的模型用 $(N, M, \pi, A, B)$ 五元组来表示，或简写为 $\lambda=(\pi,A,B)$


    | 参数 | 含义 | 实例 |

    |---|---|---|

    | N | 状态数目 | 罐的数目 |

    | M | 观测值数目 | 球的颜色数目 |

    | π | 初始状态概率分布 | 初始时选择某口罐的概率 |

    | A | 与时间无关的状态转移概率矩阵 | 在某个罐选后之后跳转到另一个罐的概率 |

    | B | 状态生成观测的概率矩阵 | 每个罐的颜色数目 |


    +   - HMM两个基本假设

    +     - 齐次马尔可夫假设

    +     - 观测独立假设'
  merge: -1
  img_proc: true
- pgno: 919
  md: "# # 隐马尔可夫模型\n## (Hidden Markov Models)\n\n# ● HMM的三个基本问题\n\n+   ▪ **概率计算问题**：给定观测序列\
    \ $O=\\{O_1,O_2,\\ldots,O_T\\}$，以及模型 $\\lambda=(\\pi,A,B)$，如何计算观测序列出现的概率？\n+ \
    \  \n+   算法：前向-后向算法\n\n+   ▪ **预测问题（又叫解码问题）**：给定观测序列 $O=\\{O_1,O_2,\\ldots,O_T\\\
    }$，以及模型 $\\lambda=(\\pi,A,B)$，如何选择一个最合理的状态序列 $S=(q_1,q_2,\\ldots,q_T)$，使其能够合理地解释观测序列？\n\
    +   \n+   算法：维特比（Viterbi）算法\n\n+   ▪ **学习问题**：给定观测序列 $O=\\{O_1,O_2,\\ldots,O_T\\\
    }$，估计模型参数 $\\lambda=(\\pi,A,B)$，使得在该模型下观测序列出现的概率最大。\n+   \n+   算法：Baum-Welch算法"
  merge: -1
