- pgno: 188
  md: '# Fisher准则


    希望投影后在一维Y空间中各类样本尽可能分开，即两类均值之差 $(\tilde{m}_1-\tilde{m}_2)$ 越大越好；同时希望各类样本内部尽量密集，即类内离散度越小越好。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_188_0.png)


    **Fisher准则函数：** $J_F(w)=\dfrac{(\tilde{m}_1-\tilde{m}_2)^2}{S_1^2+S_2^2}$'
