- pgno: 889
  md: "# 马尔可夫链（Markov Chain）\n\n+   一个状态的边缘分布可以表示为\n+   \n+   $p(z^{(m+1)}) = \\sum_{z^{(m)}}\
    \ p(z^{(m+1)}|z^{(m)})p(z^{(m)})$\n\n+   平稳性（Stationary，或不变性 Invariant）\n+   \n\
    +   $p^*(z) = \\sum_{z'} T(z',z)p^*(z')$\n\n+   细致平稳（Detailed balance）-充分条件\n\
    +   \n+   $p^*(z)T(z,z') = p^*(z')T(z',z)$\n+   \n+   $\\sum_{z'} p^*(z')T(z',z)\
    \ = \\sum_{z'} p^*(z)T(z,z') = p^*(z)\\sum_{z'} p(z'|z) = p^*(z)$"
  merge: -1
  img_proc: true
- pgno: 890
  md: '# 马尔可夫链（Markov Chain）


    +   当 $m \to \infty$ 马尔可夫链各状态趋于平稳，即


    $p_m = p_{m-1}T \xrightarrow{m \to \infty} p = pT$


    $p = [p(1),...,p(j),...]$


    平稳分布


    +   同时


    $\lim_{m \to \infty} T^m = \begin{bmatrix} p(1),...,p(j),... \\ p(1),...,p(j),...
    \\ ..., ... \\ p(1),...,p(j),... \\ ..., ... \end{bmatrix}$


    $\sum_{j} p(j) = 1$'
  merge: -1
  img_proc: true
- pgno: 891
  md: "# Metropolis-Hastings 方法\n\n+   - 思想：对于需要采样的一分布 $p(z)$，构造一个转移矩阵为 $T$ 的马尔可夫链，使它的平稳分布恰好为\
    \ $p(z)$\n\n+   - 假设有一个转移矩阵 $Q(z, z') = q(z'|z)$, $q(z)$为容易采样的分布\n\n+   - 通常情况下，该转移矩阵难以满足细致平稳条件\n\
    +   \n+   $p(z)q(z'|z) \\neq p(z')q(z|z')$\n\n+   - 引入 $a(z, z')$ 使\n+   \n+ \
    \  $p(z)q(z'|z)a(z, z') = p(z')q(z|z')a(z', z)$\n\n其中：\n$a(z, z') = p(z')q(z|z')$\n\
    $a(z', z) = p(z)q(z'|z)$\n} 接受率"
  merge: -1
  img_proc: true
- pgno: 892
  md: "# Metropolis-Hastings 方法\n\n+   步骤：\n+   1、初始化马尔可夫链状态 $z = z_0$\n+   2、对 $\\\
    tau = 1,2,...$ 循环以下过程采样\n+      1) 第 $\\tau$ 个时刻马尔可夫链状态为 $z = z^{(\\tau)}$ 采样\
    \ $z^* = q(z|z^{(\\tau)})$ \n+      2) 从均匀分布中采样 $u \\sim \\text{uniform}[0,1]$\n\
    +      3) 如果 $u < a(z^{(\\tau)}, z^*) = p(z^*)q(z^{(\\tau)}|z^*)$ 则接受 $z^{(\\\
    tau+1)} = z^*$\n+      4) 否则 $z^{(\\tau+1)} = z^{(\\tau)}$\n+   如果 $a(z^{(\\tau)},\
    \ z)$ 过小，则采样效率较低！"
  merge: -1
  img_proc: true
- pgno: 893
  md: '# Metropolis-Hastings 方法


    +   在细致平稳条件两边乘以因子 $C$


    $p(z)q(z''|z)a(z,z'') \cdot C = p(z'')q(z|z'')a(z'',z) \cdot C$


    细致平稳条件并没有打破！！！


    +   同比例放大 $a(z,z'')$, $a(z'',z)$ 使最大的为1, 令


    $A(z,z'') = \min\left\{1, \frac{p(z)q(z''|z)}{p(z'')q(z|z'')}\right\}$


    $= \min\left\{1, \frac{\tilde p(z)q(z''|z)}{\tilde p(z'')q(z|z'')}\right\} \quad
    p(z) = \frac{1}{Z_p}\tilde p(z)$'
  merge: -1
  img_proc: true
- pgno: 894
  md: "# # Metropolis-Hastings 方法\n\n+   ● **步骤：**\n+   \n+   1. **初始化马尔可夫链状态** $z=z_0$\n\
    +   2. **对** $\\tau=1,2,\\ldots$ **循环以下过程采样**\n+      1. **第** $\\tau$ **个时刻马尔可夫链状态为**\
    \ $z=z^{(\\tau)}$ **采样** $z^*=q(z\\mid z^{(\\tau)})$\n+      2. **从均匀分布中采样** $u\\\
    sim\\mathrm{uniform}[0,1]$\n+      3. **如果** $u<A(z^{(\\tau)},z^*)=\\min\\left\\\
    {1,\\frac{\\tilde p(z^*)q(z^{(\\tau)}\\mid z^*)}{\\tilde p(z^{(\\tau)})q(z^*\\\
    mid z^{(\\tau)})}\\right\\}$ **则接受** $z^{(\\tau+1)}=z^*$\n+      4. **否则** $z^{(\\\
    tau+1)}=z^{(\\tau)}$"
  merge: -1
