- pgno: 989
  md: '# 支持向量机


    # 🔴 非线性支持向量机


    利用一个固定的非线性映射将数据映射到特征空间学习的线性分类器等价于基于原始数据学习的非线性分类器。


    $$y(x)=w^Tx+b\quad\longrightarrow\quad y(x)=w^T\phi(x)+b$$


    # 决策时


    $$y(x)=\sum_{n=1}^{N}a_nt_nx^T x_n+b\quad\longrightarrow\quad y(x)=\sum_{n=1}^{N}a_nt_nk(x,x_n)+b$$


    $$k(x,x_n)=\phi(x)^T\phi(x_n)$$


    核函数


    核函数在特征空间中直接计算数据映射后的内积就像在原始输入数据的函数中计算一样，大大简化了计算过程。'
  merge: -1
  img_proc: true
- pgno: 990
  md: '# 支持向量机


    # 非线性支持向量机


    利用一个固定的非线性映射将数据映射到特征空间学习的线性分类器等价于基于原始数据学习的非线性分类器。


    ```

    a₁X₁ + a₂X₁² + a₃X₂ + a₄X₂² + a₅X₁X₂ + a₆ = 0   φ : ℝ² → ℝ⁵

    ```


    # 原始样本增加到三维


    ```

    a₁X₁³ + a₂X₂³ + a₃X₃³ + a₄X₁²X₂ + a₅X₁²X₃ + a₆X₂²X₁ + a₇X₂²X₃ + a₈X₃²X₁ + a₉X₃²X₂
    + a₁₀X₁X₂X₃ + a₁₁X₁² + a₁₂X₂² + a₁₃X₃² + a₁₄X₁X₂ + a₁₅X₂X₃ + a₁₆X₁X₃ + a₁₇X₁ +
    a₁₈X₂ + a₁₉X₃ + a₂₀ = 0

    ```


    ```

    φ : ℝ³ → ℝ¹⁹

    ```


    维度大大增加

    计算变得非常困难


    ```

    k(x₁, x₂) = (< x₁, x₂ > +1)²

    ```


    利用核函数直接在原来的低维空间中进行计算不需要显式地写出映射后的结果，避免了先映射到高维空间中然后再根据内积的公式进行计算'
  merge: -1
  img_proc: true
- pgno: 991
  md: '# 支持向量机


    # 非线性支持向量机


    根据问题和数据的不同，选择带有不同的核函数。


    一些常用的核函数：


    线性核： $k(x_1, x_2) = x_1^T x_2$


    多项式核： $k(x_1, x_2) = (< x_1, x_2 > + R)^d$


    高斯核： $k(x_1, x_2) = \exp\{ - \frac{||x_1 - x_2||^2}{2\sigma^2} \}$


    Sigmoid核： $k(x_1, x_2) = \tanh(\beta_0 x_1^T x_2 + \beta_1)$


    如何判断一个函数是否可以作为核函数？


    Mercer定理：

    $\mathbb{R}^n \times \mathbb{R}^n \rightarrow \mathbb{R}$ 上的映射 $k$ 是一个有效核函数(也称
    Mercer 核函数)当且仅当对于训练样本其相应的核函数矩阵是对称半正定的,即对于任何平方可积函数 $g(x)$ 有 $\iint k(x,y) g(x)
    g(y) dx dy \ge 0$。'
  merge: -1
  img_proc: true
