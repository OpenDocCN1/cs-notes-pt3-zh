- pgno: 182
  md: '# 线性判别函数齐次化


    线性判别函数 $g(x)=w^T x + w_0$


    改写成 $g(x)=w_0 + \sum_{i=1}^{d} w_i x_i = \sum_{i=1}^{d} a_i y_i = a^T y$


    称为线性判别函数的齐次简化


    $y=\begin{bmatrix}1\\x_1\\x_2\\\vdots\\x_d\end{bmatrix}=\begin{bmatrix}1\\x\end{bmatrix}$
    增广样本向量； $a=\begin{bmatrix}w_0\\w_1\\w_2\\\vdots\\w_d\end{bmatrix}=\begin{bmatrix}w_0\\w\end{bmatrix}$
    增广权向量


    $\hat d = d + 1$; $y$ 比 $x$ 增加一维，保持样本空间欧式距离不变，变换后的样本仍全部位于 $d$ 维子空间(原 $X$ 空间)中。


    方程 $a^T y = 0$ 在 $Y$ 空间确定了一个通过原点的超平面 $\hat H$，它对 $d$ 维子空间的划分与原决策面 $w^T x + w_0
    = 0$ 对原 $X$ 空间的划分完全相同。$Y$ 空间中任意一点 $y$ 到 $\hat H$ 的距离： $r = \frac{g(x)}{||a||}
    = \frac{a^T y}{||a||}$'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# # 线性分类器设计


    # 利用训练样本建立线性判别函数


    $$g(x)=w^Tx+w_0$$


    $$g(x)=w_0+\sum_{i=1}^{d}w_ix_i=\sum_{i=1}^{d}a_iy_i=\boldsymbol{a}^T\boldsymbol{y}$$


    最好的结果一般出现在准则函数的极值点上，所以将分类器设计问题转化为求准则函数极值 $w^*$、$w_0^*$ 或 $a^*$ 的问题。


    +   1. **步骤1：** 具有类别标志的样本集 $X=\{x_1,x_2,\ldots,x_N\}$ 或其增广样本集 $Y$。

    +   2. **步骤2：** 确定准则函数 $J$，满足：① $J$ 是样本集和 $w$、$w_0$ 或 $a$ 的函数；② $J$ 的值反应分类器的性能，其极值对应“最好”的决策。

    +   3. **步骤3：** 优化求解准则函数极值 $w^*$、$w_0^*$ 或 $a^*$。


    最终得到线性判别函数：$g(x)=w^{*T}x+w_0^*$ 或 $g(x)=a^{*T}y$，对于位置类别样本 $x_k$，计算 $g(x_k)$ 并通过决策规则判断其类别。'
