- pgno: 458
  md: '# 主成分分析-应用


    +   利用PCA处理高维数据


    在实际应用中，样本维数可能很高，远大于样本的个数


    在人脸识别中，1000张人脸图像，每张图像100×100像素


    对 1/N XX^T 求的特征值 λ_i 和特征向量 v_i


    1/N XX^T v_i = λ_i v_i


    1/N X^T X (X^T v_i) = λ_i (X^T v_i) S的特征向量


    调整尺度 u_i ∝ X^T v_i 满足 ||u_i|| = 1


    u_i = 1/(N λ_i)^{1/2} X^T v_i


    奇异值分解(Singular Value Decomposition, SVD)'
