- pgno: 351
  md: '# ID3算法


    # 算法优点


    +   - 只需对训练实例进行较好地标注，就能进行学习，从一类无序、无规则事物(概念)中推理出分类规则。


    +   - 分类模型是树状结构，简单直观，可将决策树中到达每个叶结点的路径转换为IF—THEN形式的分类规则，比较符合人类的理解方式。'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# ID3算法


    # ID3算法局限性


    +   - 信息增益偏好取值多的属性(极限趋近于均匀分布)

    +   - 可能会受噪声或小样本影响，易出现过拟合问题

    +   - 无法处理连续值的属性

    +   - 无法处理属性值不完整的训练数据

    +   - 无法处理不同代价的属性'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# 属性筛选度量标准


    # 信息增益的问题


    $$G(D,a)=H(D)+\sum_{n=1}^{N}\frac{|D^n|}{|D|}H(D^n)$$


    +   - 信息增益准则对可取值数目 $N$ 较多的属性有所偏好。

    +   - 取值更多的属性容易使得数据更“纯”，其信息增益更大。决策树会首先挑选这个属性作为树的顶/结点；结果训练出来的形状是一棵庞大且深度很浅的树，这样的划分极不合理。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 属性筛选度量标准


    +   信息增益率(Information Gain Ratio)


    G_ratio(D, a) = G(D, a) / H(a)


    其中


    H(a) = - Σ_{n=1}^{N} |D_n| / |D| log₂ |D_n| / |D|


    称为属性a的固有值


    N越大，H(a)通常也越大；因此采用信息增益率，可缓解信息增益准则对可取值数目较多的属性的偏好。


    C4.5算法就采用增益率替代了ID3算法的信息增益'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 属性筛选度量标准


    +   基尼指数(Gini Index)


    Gini(D) = Σ_{c=1}^{C} Σ_{c''≠c} p_c p''_c = 1 - Σ_{c=1}^{C} p_c^2 = 1 - Σ_{c=1}^{C}
    (|D_c| / |D|)^2


    直观反映了从数据集中随机抽取两个样本，其类别不一致的概率；基尼指数越小，数据集的纯度越高。


    +   属性A的基尼指数    Gini(D, a) = Σ_{n=1}^{N} |D^n| / |D| Gini(D^n)


    +   最优属性选择    a* = arg min_{a∈A} Gini(D, a)


    CART算法就采用基尼指数替代了ID3算法的信息增益'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 剪枝处理(Pruning)


    # 问题：过拟合


    决策树对训练数据有很好的分类能力，但对未知的测试数据未必有好的分类能力，泛化能力弱，即可能发生过拟合现象。


    # 可能原因


    训练数据有噪声，同时拟合了数据和噪音，影响分类效果。


    叶结点样本太少，易出现耦合的规律性，使一些属性恰巧可很好地分类，但却与实际目标函数无关。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_356_0.png)'
  merge: -1
  img_proc: true
- pgno: 357
  md: "# # 剪枝处理(Pruning)\n\n# ● 针对过拟合问题\n\n■ 剪枝是主要手段\n\n# ● 基本策略\n\n+   ■ **预剪枝策略(Pre-pruning)**：**决策树生成过程中**，对每个结点在划分前进行估计，若划分不能带来决策树**泛化性能提升**，则停止划分并将该节点设为叶结点。\n\
    +   \n+   ■ **后剪枝策略(Post-pruning)**：**先利用训练集生成决策树**，自底向上对非叶结点进行考察，若将该结点对应子树替换为叶结点能带来**泛化性能提升**，则将该子树替换为叶结点。"
  merge: -1
  img_proc: true
