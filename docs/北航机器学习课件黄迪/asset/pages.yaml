- pgno: 1044
  md: '# 反向传播(BP)算法


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1044_0.png)


    Layer i


    Layer j


    Layer k


    a_j = Σ_i w_ji z_i   z_j = h(a_j)


    ∂E_n / ∂w_ji = ∂E_n / ∂a_j · ∂a_j / ∂w_ji


    δ_j ≡ ∂E_n / ∂a_j


    ∂a_j / ∂w_ji = z_i


    ∂E_n / ∂w_ji = δ_j z_i'
