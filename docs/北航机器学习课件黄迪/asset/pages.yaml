- pgno: 778
  md: '# Generative Adversarial Networks(GAN)


    # 对抗训练


    +   生成网络要尽可能地欺骗判别网络。

    +   判别网络将生成网络生成的样本与真实样本中尽可能区分出来。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_778_0.png)


    两个网络相互对抗、不断调整参数，最终目的是使判别网络无法判断生成网络的输出结果是否真实。'
  merge: -1
  img_proc: true
- pgno: 779
  md: '# # Generative Adversarial Networks(GAN)


    +   - 判别网络


    $$\max_{\phi}\mathbb{E}_{x\sim p_r(x)}\left[\log D(x;\phi)\right]+\mathbb{E}_{z\sim
    p(z)}\left[\log\left(1-D(G(z;\theta);\phi)\right)\right]$$


    +   - 生成网络


    $$\max_{\theta}\left(\mathbb{E}_{z\sim p(z)}\left[\log D(G(z;\theta);\phi)\right]\right)$$


    +   - Minimax Game


    $$\min_{\theta}\max_{\phi}\left(\mathbb{E}_{x\sim p_r(x)}\left[\log D(x;\phi)\right]+\mathbb{E}_{z\sim
    p(z)}\left[\log\left(1-D(G(z;\theta);\phi)\right)\right]\right)$$'
  merge: -1
  img_proc: true
