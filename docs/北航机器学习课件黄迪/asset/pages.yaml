  md: '# Fisher准则


    寻找最好投影方向 $w^*$


    以二分类问题为例，$d$维样本$x_1, x_2, ... x_N$ 其中$N_1$个属于$w_1$类记为子集$X_1$, $N_2$个属于$w_2$类记为子集$X_2$。


    在一维$Y$空间

    $y_n = w^T x_n$


    +   (1) 各类样本均值 $\tilde{m}_i$    $\tilde{m}_i = \frac{1}{N_i} \sum_{y \in \eta_i}
    y, i = 1, 2$


    +   (2) 样本类内离散度 $\tilde{S}_i^2$ 和总类内离散度 $\tilde{S}_w$


    $\tilde{S}_i^2 = \sum_{y \in \eta_i} (y - \tilde{m}_i)^2, i = 1, 2$


    $\tilde{S}_w = \tilde{S}_1^2 + \tilde{S}_2^2$'
