- pgno: 470
  md: '# 等距映射


    +   ISO-Metric Mapping (ISOMAP)


    保持数据点内在几何性质(测地距离)


    令 $H = I_n - \frac{1}{N} 1 1^T$ (中心矩阵，Centering Matrix)


    并定义平方距离矩阵 $S(i,j) = D_G^2(i,j)$


    求矩阵 $L = -\frac{1}{2} H S H$ 的特征值与特征向量(按特征值降序排列)，$\lambda_p$ 为第 $p$ 个特征值，$v_p$
    为对应的特征向量。


    降维矩阵为 $[\sqrt{\lambda_1}v_1, ..., \sqrt{\lambda_d}v_d]_{N \times d}$'
  merge: -1
