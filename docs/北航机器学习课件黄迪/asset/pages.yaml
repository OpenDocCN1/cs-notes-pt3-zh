- pgno: 1110
  md: "# Metropolis-Hastings 方法\n\n+   在细致平稳条件两边乘以因子 $C$\n+   \n+   $p(z)q(z'|z)a(z,z')\
    \ \\cdot C = p(z')q(z|z')a(z',z) \\cdot C$\n\n细致平稳条件并没有打破！！！\n\n+   同比例放大 $a(z,z')$,\
    \ $a(z',z)$ 使最大的为 1，令\n+   \n+   $A(z,z') = \\min\\left\\{1, \\frac{p(z)q(z'|z)}{p(z')q(z|z')}\\\
    right\\}$\n+   \n+   $= \\min\\left\\{1, \\frac{\\tilde{p}(z)q(z'|z)}{\\tilde{p}(z')q(z|z')}\\\
    right\\}$  $p(z) = \\frac{1}{Z_p}\\tilde{p}(z)$"
  merge: -1
  img_proc: true
- pgno: 1111
  md: "# # Metropolis-Hastings 方法\n\n+   ● **步骤：**\n+   \n+   1、**初始化**马尔可夫链状态 $z=z_0$\n\
    +   \n+   2、对 $\\tau=1,2,\\ldots$ **循环以下过程采样**\n+   \n+      1) 第 $\\tau$ 个时刻马尔可夫链状态为\
    \ $z=z^{(\\tau)}$，采样 $z^*=q(z\\mid z^{(\\tau)})$\n+   \n+      2) 从均匀分布中采样 $u\\\
    sim\\operatorname{uniform}[0,1]$\n+   \n+      3) 如果 $u<A(z^{(\\tau)},z^*)=\\\
    min\\left\\{1,\\frac{\\tilde p(z^*)q(z'\\mid z^*)}{\\tilde p(z')q(z^*\\mid z')}\\\
    right\\}$，则接受 $z^{(\\tau+1)}=z^*$\n+   \n+      4) 否则 $z^{(\\tau+1)}=z^{(\\tau)}$"
  merge: -1
  img_proc: true
- pgno: 1112
  md: '# 吉布斯采样（Gibbs Sampling）


    +   - 一种特殊的M-H采样算法

    +   - 针对多元分布进行采样　$p(z)=p(z_1,\ldots,z_M)$


    **每次只改变一个维度上的值，保持其他维度不变**


    $p(z_1,z_2,z_3)$


    首先：初始化 $(z_1^{(0)}, z_2^{(0)}, z_3^{(0)})$


    在第 $\tau$ 步，假设已经产生了 $(z_1^{(\tau)}, z_2^{(\tau)}, z_3^{(\tau)})$


    +   ➡ 根据 $p(z_1\mid z_2^{(\tau)},z_3^{(\tau)})$ 产生 $z_1^{(\tau+1)}$

    +   ➡ 根据 $p(z_2\mid z_1^{(\tau+1)},z_3^{(\tau)})$ 产生 $z_2^{(\tau+1)}$

    +   ➡ 根据 $p(z_3\mid z_1^{(\tau+1)},z_2^{(\tau+1)})$ 产生 $z_3^{(\tau+1)}$'
  merge: -1
  img_proc: true
- pgno: 1113
  md: '# 与M-H的关系


    +   建议概率：

    +   $q_k(\mathbf{z}^*|\mathbf{z}) = p(z_k^*|\mathbf{z}_{\setminus k})$


    +   接受概率：

    +   $A_k(z^*, z^{(\tau)}) = \min\left\{1, \frac{\tilde{p}(z^*) q_k(z^{(\tau)}|z^*)}{\tilde{p}(z^{(\tau)})
    q_k(z^*|z^{(\tau)})}\right\}$


    $p(\mathbf{z}) = p(z_k|\mathbf{z}_{\setminus k})p(\mathbf{z}_{\setminus k}) \quad
    \mathbf{z}^*_{\setminus k} = \mathbf{z}_{\setminus k}$


    $A(\mathbf{z}^*, \mathbf{z}) = \frac{p(\mathbf{z}^*) q_k(\mathbf{z}|\mathbf{z}^*)}{p(\mathbf{z})
    q_k(\mathbf{z}^*|\mathbf{z})} = \frac{p(z_k^*|\mathbf{z}^*_{\setminus k})p(\mathbf{z}^*_{\setminus
    k})p(z_k|\mathbf{z}^*_{\setminus k})}{p(z_k|\mathbf{z}_{\setminus k})p(\mathbf{z}_{\setminus
    k})p(z_k^*|\mathbf{z}_{\setminus k})} = 1$'
