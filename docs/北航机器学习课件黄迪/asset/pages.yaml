- pgno: 760
  md: "# 循环神经网络 (Recurrent neural Network, RNN)\n\n# RNN训练-Back Prop Through Time(BTPP)\n\
    \n+   - 计算W的偏导，需要对每个t求偏导\n+   \n+     ∂E/∂W = Σ_{t=1}^{T} ∂E_t/∂W\n\n+   - 链式法则\n\
    +   \n+     ∂E_t/∂W = Σ_{k=1}^{t} ∂E_t/∂y_t ∂y_t/∂h_t ∂h_t/∂h_k ∂h_k/∂W"
  merge: -1
  img_proc: true
- pgno: 761
  md: '# 循环神经网络（Recurrent neural Network，RNN）


    +   - 已知 $h_t = W\left(f(h_{t-1}) + W^{(hx)}x_{[t]}\right)$

    +   - 可得


    $$\frac{\partial h_t}{\partial h_k}=\prod_{j=k+1}^{t}\frac{\partial h_j}{\partial
    h_{j-1}}$$


    $$\frac{\partial h_t}{\partial h_k}=\prod_{j=k+1}^{t}\frac{\partial h_j}{\partial
    h_{j-1}}=\prod_{j=k+1}^{t}W^T\operatorname{diag}\left[f''(h_{j-1})\right]$$'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# 循环神经网络（Recurrent neural Network，RNN）


    +   - RNN中gradient vanishing/exploding

    +     - 已知 \(\frac{\partial h_t}{\partial h_k}=\prod_{j=k+1}^{t}\frac{\partial
    h_j}{\partial h_{j-1}}=\prod_{j=k+1}^{t}W^T\operatorname{diag}[f''(h_{j-1})]\)

    +     - 根据 \(\|xy\|\leq\|x\|\cdot\|y\|\)


    \(\left\|\frac{\partial h_j}{\partial h_{j-1}}\right\|\leq\|W^T\|\|\operatorname{diag}[f''(h_{j-1})]\|\leq\beta_W\beta_h\)　代表上限


    \(\left\|\frac{\partial h_t}{\partial h_k}\right\|=\left\|\prod_{j=k+1}^{t}\frac{\partial
    h_j}{\partial h_{j-1}}\right\|\leq(\beta_W\beta_h)^{t-k}\)


    当\(t\)为间隔较远时，梯度会很快的变的很大或很小'
  merge: -1
  img_proc: true
