- pgno: 215
  md: '# 线性分类器设计


    # 利用训练样本建立线性判别函数


    g(x) = w^T x + w0


    g(x) = w0 + Σ_{i=1}^{d} w_i x_i = Σ_{i=1}^{d} a_i y_i = a^T y


    最好的结果一般出现在准则函数的极值点上，所以将分类器设计问题转化

    为求准则函数极值 w*, w0* 或 a* 的问题。


    +   步骤1：具有类别标志的样本集 X = {x1, x2, ... xN} 或其增广样本集 Y。


    +   步骤2：确定准则函数 J，满足 ① J 是样本集和 w, w0 或 a 的函数；② J 的值反应分类器的性能，其极值对应 “最好” 的决策。


    +   步骤3：优化求解准则函数极值 w*, w0* 或 a*。


    最终得到线性判别函数：g(x) = w*^T x + w0* 或 g(x) = a*^T y，对于未知类别样本 x_k，计算 g(x_k) 并通过决策规则判断其类别。'
