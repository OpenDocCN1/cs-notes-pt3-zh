- pgno: 1040
  md: '# 如何训练神经网络？


    +   定义准则函数


    $E(\mathbf{w}) = \frac{1}{2} \sum_{n=1}^{N} \{ y(\mathbf{x}_n, \mathbf{w}) - t_n
    \}^2$


    寻找一个 $\mathbf{w}$，使得 $E(\mathbf{w})$ 最小。


    $\nabla E(\mathbf{w}) = 0$


    $\mathbf{w}^{(\tau+1)} = \mathbf{w}^{(\tau)} - \eta \nabla E(\mathbf{w}^{(\tau)})$'
  merge: -1
  img_proc: true
- pgno: 1041
  md: '# 反向传播(BP)算法


    感知器算法实际上是在利用理想输出与实际输出之间的误差作为增量来修正权值，然而多层感知器只能计算出输出层的误差，中间隐层由于不直接与外界连接，其误差无法估计。


    w_ij(t+1)=w_ij(t)+η(y_j - y*_j)x_i


    反向传播算法思想：从后向前反向逐层传播输出层的误差，以间接计算隐层的误差。算法可以分为两个阶段：


    +   前馈(正向过程)：从输入层经隐层逐层正向计算各单元的输出；


    +   学习(反向过程)：由输出误差逐层反向计算隐层各单元的误差，并用此误差修正前层的权值。'
  merge: -1
  img_proc: true
- pgno: 1042
  md: '# # 反向传播(BP)算法


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1042_0.png)


    $y_k = \sum_i w_{ki}x_i$


    $E_n = \frac{1}{2}\sum_k (y_{nk}-t_{nk})^2$


    $E(\mathbf{w}) = \sum_{n=1}^{N} E_n(\mathbf{w})$


    $\frac{\partial E_n}{\partial w_{jk}} = (y_{nk}-t_{nk})x_{nk}$


    误差'
  merge: -1
  img_proc: true
- pgno: 1043
  md: '# # 反向传播(BP)算法


    +   🔴 **练习：**


    对非线性 $y_k=h(a_k)=h\left(\sum_j w_{kj}x_j\right)$


    计算 $\frac{\partial E_n}{\partial w_{jk}}$，其中 $E=\frac{1}{2}\sum_k(y_k-t_k)^2$


    $\frac{\partial E}{\partial w_{jk}}=(y_k-t_k)\frac{\partial y_k}{\partial w_{jk}}$


    $=(y_k-t_k)\frac{\partial y_k}{\partial h}\frac{\partial h}{\partial w_{jk}}$


    $=(y_k-t_k)h''(a_k)x_j$'
  merge: -1
