  md: '# VC维


    # SLT中衡量函数集性能的指标


    为了研究经验风险最小化函数集的学习一致收敛速度和推广性，统计学力理论定义了一些指标来衡量函数集的性能，其中最重要的就是VC维 (Vapnik-Chervonenkis
    Dimension)


    VC维定义：

    对于一个指示函数(即只有0和1两种取值的函数)集，如果存在*h*个样本能够被函数集里的函数按照所有可能的2^*h*种形式分开，则称函数集能够把*h*个样本打散，函数集的VC维就是能够打散的最大样本数目。'
