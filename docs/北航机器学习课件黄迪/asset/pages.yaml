  md: '# 条件独立

    (Conditional independence)


    +   三个变量 $a, b, c$


    $p(a|b, c) = p(a|c)$


    称在给定$c$的条件下，$a$与$b$条件独立


    $p(a, b|c) = p(a|b, c)p(b|c)$

    $= p(a|c)p(b|c)$


    $p(a, b|c) = p(a|c)p(b|c)$  $a \perp b \mid c$'
