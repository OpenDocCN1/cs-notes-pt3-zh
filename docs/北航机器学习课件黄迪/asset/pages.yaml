- pgno: 1045
  md: '# 反向传播(BP)算法


    E_n = 1/2 Σ_k (y_nk - t_nk)^2    a_j = Σ_i w_ji z_i    z_j = h(a_j)


    δ_j ≡ ∂E_n / ∂a_j    ∂a_j / ∂w_ji = z_i    ∂E_n / ∂w_ji = δ_j z_i


    对于输出层而言： δ_k ≡ ∂E_n / ∂a_k = y_k - t_k


    对于隐藏层而言： δ_j ≡ ∂E_n / ∂a_j = Σ_k ∂E_n / ∂a_k ∂a_k / ∂a_j


    δ_j = h''(a_j) Σ_k w_kj δ_k'
