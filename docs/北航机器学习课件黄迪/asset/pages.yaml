- pgno: 845
  md: "# # 拒绝采样（Rejection Sampling）\n\n+   - 对一个很复杂的分布 $p(z)$ 进行采样，但又无法给出其具体的解析形式，但是每个\
    \ $z$ 可以计算其概率\n+   \n+     $$p(z)=\\frac{1}{Z_p}\\tilde{p}(z)$$\n+   \n+     其中\
    \ $\\tilde{p}(z)$ 已知，$Z_p$ 未知。\n\n+   - 借助一个容易采样的分布 $q(z)$ 去逼近 $\\tilde{p}(z)$\n\
    +   \n+     $q(z)$ 称为**建议分布**（proposal distribution）。\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_845_0.png)"
  merge: -1
  img_proc: true
- pgno: 846
  md: '# # 拒绝采样（Rejection Sampling）


    +   - 找到一个常数 $k$，使得 $\tilde{p}(z) \leq kq(z)$ —— 对比函数 comparison function

    +   - 采样步骤

    +     1. 从 $q(z)$ 中产生 $z_0$

    +     2. 从 $[0,kq(z_0)]$ 均匀分布中产生 $u_0$

    +     3. 如果 $u_0 > \tilde{p}(z_0)$ 拒绝采样，否则接受采样


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_846_0.png)


    $p(\mathrm{accept})=\int\{\tilde{p}(z)/kq(z)\}q(z)\,dz=\frac{1}{k}\int\tilde{p}(z)\,dz$


    拒绝采样又称为接受-拒绝采样（Acceptance-Rejection Sampling）'
  merge: -1
  img_proc: true
- pgno: 847
  md: '# 自适应拒绝采样

    (Adaptive Rejection Sampling)


    +   - 实际应用中，往往很难找到合适的 $q(z)$

    +   - 特别地，当 $p(z)$ 为 log 凸函数时，可采用 ARS


    $q(z) = k_i \lambda_i \exp\{-\lambda_i (z - z_{i-1})\} \quad z_{i-1} < z \le z_i$


    $\ln q(z) = C - \lambda (z - z_{i-1}), \quad z_{i-1} < z \le z_i$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_847_0.png)


    在 log 域执行拒绝采样


    +   - 如果满足，接受

    +   - 如果拒绝，重新逼近'
  merge: -1
  img_proc: true
