- pgno: 445
  md: '# 主成分分析-算法


    +   最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    目标是最大化 u₁ᵀ S u₁， s.t. u₁ᵀ u₁ = 1


    利用拉格朗日乘子法 u₁ᵀ S u₁ + λ₁(1 − u₁ᵀ u₁)


    对 u₁ 求导置零得到 S u₁ = λ₁ u₁


    u₁是S的特征向量


    进一步得到 u₁ᵀ S u₁ = λ₁


    u₁是S最大特征值对应的特征向量时

    方差取到极大值，称u₁为第一主成分'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# 主成分分析-算法


    # 最大方差思想


    使用较少的数据维度保留住较多的原数据特性


    考虑更一般性的情况( $M > 1$ ), 新空间中数据方差最大的最佳投影方向由协方差矩阵 $S$ 的 $M$ 个特征向量 $u_1, ..., u_M$
    定义，其分别对应 $M$ 个最大的特征值 $\lambda_1, ..., \lambda_M$


    +   - 首先获得方差最大的1维，生成该维的补空间；

    +   - 继续在补空间中获得方差最大的1维，生成新的补空间；

    +   - 依次循环下去得到 $M$ 维的空间。'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# 主成分分析-算法


    最小均方误差思想


    使原数据与降维后的数据(在原空间中的重建)的误差最小


    定义一组正交的 D 维基向量 {u_i}, i = 1, ..., D, 满足


    ```

    u_i^T u_j = δ_ij

    ```


    由于基是完全的，每个数据点可以表示为基向量的线性组合


    ```

    x_n = Σ_{i=1}^D α_{ni} u_i

    ```


    相当于进行了坐标变换


    {x_{n1}, ..., x_{nD}} → {u_i} → {α_{n1}, ..., α_{nD}}


    ```

    α_{nj} = x_n^T u_j

    ```'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# # 主成分分析-算法


    # 🔴 最小均方误差思想


    使原数据与降维后的数据（在原空间中的重建）的误差最小


    那么 $\mathbf{x}_n = \sum_{i=1}^{D}(\mathbf{x}_n^T\mathbf{u}_i)\mathbf{u}_i$


    在 $M$ 维变量（$M<D$）生成的空间中对其进行表示


    $\tilde{\mathbf{x}}_n = \sum_{i=1}^{M} z_{ni}\mathbf{u}_i + \sum_{i=M+1}^{D} b_i\mathbf{u}_i$


    独特的　　　　　　　　　　共享的


    目标最小化失真度　$J=\frac{1}{N}\sum_{n=1}^{N}\|\mathbf{x}_n-\tilde{\mathbf{x}}_n\|^2$


    导数置零得到　$z_{nj}=\mathbf{x}_n^T\mathbf{u}_j,\ j=1,\ldots,M$


    $b_j=\bar{\mathbf{x}}^T\mathbf{u}_j,\ j=M+1,\ldots,D$'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# 主成分分析-算法


    +   最小均方误差思想


    使原数据与降维后的数据(在原空间中的重建)的误差最小


    有 $\mathbf{x}_n - \tilde{\mathbf{x}}_n = \sum_{i=M+1}^{D} \{(\mathbf{x}_n - \bar{\mathbf{x}})^T
    \mathbf{u}_i\} \mathbf{u}_i$


    $J = \frac{1}{N} \sum_{n=1}^{N} \sum_{i=M+1}^{D} (\mathbf{x}_n^T \mathbf{u}_i
    - \bar{\mathbf{x}}^T \mathbf{u}_i)^2 = \sum_{i=M+1}^{D} \mathbf{u}_i^T \mathbf{S}
    \mathbf{u}_i$


    拉格朗日乘子法 $\tilde{J} = \sum_{i=M+1}^{D} \mathbf{u}_i^T \mathbf{S} \mathbf{u}_i +
    \sum_{i=M+1}^{D} \lambda_i (1 - \mathbf{u}_i^T \mathbf{u}_i)$


    求导得到 $\mathbf{S} \mathbf{u}_i = \lambda_i \mathbf{u}_i$


    $J$ 最小时取 $D-M$ 个最小的特征值


    对应失真度为 $J = \sum_{i=M+1}^{D} \lambda_i$


    主子空间对应 $M$ 个最大特征值'
  merge: -1
  img_proc: true
