- pgno: 951
  md: "# 从贝叶斯分类说起\n\n+   - **后验概率 (A Posteriori Probability or Posterior)**  \n+ \
    \    \\(P(\\omega_1|\\mathbf{x}),\\ P(\\omega_2|\\mathbf{x})\\)\n+   \n+   - **错误概率\
    \ (Probability of Error)**  \n+     \\[\n+     P(e|\\mathbf{x})=\n+     \\begin{cases}\n\
    +     P(\\omega_2|\\mathbf{x}) & \\text{if } \\mathbf{x} \\text{ is assigned to\
    \ } \\omega_1 \\\\\n+     P(\\omega_1|\\mathbf{x}) & \\text{if } \\mathbf{x} \\\
    text{ is assigned to } \\omega_2\n+     \\end{cases}\n+     \\]\n+   \n+   - **平均错误率\
    \ (Average Probability of Error)**  \n+     \\[\n+     P(e)=\\int P(e|\\mathbf{x})p(\\\
    mathbf{x})d\\mathbf{x}\n+     \\]\n+   \n+   - **正确率 (Probability of Correctness)**\
    \  \\(P(c)\\)"
  merge: -1
