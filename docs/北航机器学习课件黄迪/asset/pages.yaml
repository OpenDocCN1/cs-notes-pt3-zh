- pgno: 119
  md: '# “回归” 起源


    # Francis Galton


    英国生物学家

    研究父母身高与子女身高之间关系

    若父母身高高于平均身高，则其子女身高倾向于倒退生长，即会比其父母身高矮一些而更接近于大众平均身高.

    若父母身高小于平均身高，则其子女身高倾向于向上生长，即会更接近于大众平均身高.

    此现象被Galton称之为回归现象，即 Regression.


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_119_0.png)


    Francis Galton

    1822.2.16-1911.1.17'
