- pgno: 953
  md: '# 基于最小风险的决策


    条件期望损失：对于特定的x采取决策 α_i 的期望损失：

    R(α_i|x) = E[λ(α_i, w_j) | x] = ∑_{j=1}^c λ(α_i, w_j) P(w_j | x), i = 1, 2, ...,
    k


    期望风险：对所有可能的x采取决策 α(x) 所造成的期望损失之和

    R(α) = ∫ R(α(x) | x) p(x) dx


    也称平均风险（R(α)表示R依赖于决策规则α(·)）


    对所有x，使 R(α(x) | x) 最小，则可以使 R(α) 最小


    最小风险贝叶斯决策规则：

    if R(α_t | x) = min_{j=1...k} R(α_j | x), then α = α_t'
  merge: -1
  img_proc: true
- pgno: 954
  md: '# 示例-基于最小错误率


    假设在某个局部区域细胞中正常($w_1$)和异常($w_2$)两类的先验概率分别为：正常状态 $P(w_1)=0.9$，异常状态 $P(w_2)=0.1$。现有一待识别细胞，其观察值为$x$，从类条件概率密度曲线上查得
    $p(x|w_1)=0.2$，$p(x|w_2)=0.4$。试对该细胞$x$进行分类。


    # 解：利用贝叶斯公式计算$w_1$和$w_2$的后验概率


    $P(w_1|x) = \frac{p(x|w_1)P(w_1)}{\sum_{j=1}^{2} p(x|w_j)P(w_j)} = \frac{0.2\times0.9}{0.2\times0.9+0.4\times0.1}
    = 0.818$

    $P(w_2|x) = 1 - P(w_1|x) = 0.182$


    # 根据贝叶斯决策规则有


    $P(w_1|x) = 0.818 > P(w_2|x) = 0.182$


    把$x$归类于正常细胞。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_954_0.png)'
  merge: -1
  img_proc: true
