- pgno: 1000
  md: '# 属性筛选度量标准


    🔴 信息增益率 (Information Gain Ratio)


    $G_{ratio}(D,a)=\frac{G(D,a)}{H(a)}$


    其中


    $H(a)=-\sum_{n=1}^{N}\frac{|D_n|}{|D|}\log_2\frac{|D_n|}{|D|}$


    称为属性$a$的固有值


    $N$越大，$H(a)$通常也越大；因此采用信息增益率，可缓解信息增益准则对可取值数目较多的属性的偏好。


    C4.5算法就采用增益率替代了ID3算法的信息增益'
  merge: -1
  img_proc: true
- pgno: 1001
  md: "# 属性筛选度量标准\n\n# \U0001F534 基尼指数 (Gini Index)\n\n$$Gini(D)=\\sum_{c=1}^{C}\\\
    sum_{c'\\ne c}p_cp_{c'}=1-\\sum_{c=1}^{C}p_c^2=1-\\sum_{c=1}^{C}\\left(\\frac{|D_c|}{|D|}\\\
    right)^2$$\n\n直观反映了从数据集中随机抽取两个样本，其类别不一致的概率；基尼指数越小，数据集的纯度越高。\n\n+   - 属性A的基尼指数\
    \  \n+     $$Gini(D,a)=\\sum_{n=1}^{N}\\frac{|D^n|}{|D|}Gini(D^n)$$\n\n+   - 最优属性选择\
    \  \n+     $$a^*=\\mathop{\\arg\\min}_{a\\in A}Gini(D,a)$$\n\nCART算法就采用基尼指数替代了ID3算法的信息增益"
  merge: -1
  img_proc: true
- pgno: 1002
  md: '# 剪枝处理(Pruning)


    +   针对过拟合问题

    +   剪枝是主要手段


    +   基本策略

    +   预剪枝策略(Pre-pruning)：决策树生成过程中，对每个节点在划分前进行估计，若划分不能带来决策树泛化性能提升，则停止划分，并将该节点设为叶节点。

    +   后剪枝策略(Post-pruning)：先利用训练集生成决策树，自底向上对非叶节点进行考察，若将该叶节点对应子树替换为叶节点能带来泛化性能提升，则将该子树替换为叶节点。'
  merge: -1
  img_proc: true
- pgno: 1003
  md: '# 剪枝处理(Pruning)


    +   预剪枝策略特点


    +   优势： “剪掉了” 很多没必要展开的分支，降低了过拟合的风险，并且显著减少了决策树的训练时间开销和测试时间开销。


    +   劣势： 有些分支的当前划分有可能不能提高甚至降低泛化性能，但后续划分有可能提高泛化性能；预剪枝禁止这些后续分支的展开，可能会导致欠拟合。'
  merge: -1
  img_proc: true
- pgno: 1004
  md: '# 剪枝处理(Pruning)


    # 后剪枝策略特点


    +   - **优势：** 测试了所有分支，比预剪枝决策树保留了更多分支，降低了欠拟合的风险，泛化性能一般优于预剪枝决策树。


    +   - **劣势：** 后剪枝过程在生成完全决策树后在进行，且要自底向上对所有非叶节点逐一评估；因此，决策树的训练时间开销要高于未剪枝决策树和预剪枝决策树。'
  merge: -1
  img_proc: true
- pgno: 1005
  md: '# # K均值算法


    +   - 对于样本 $\mathbf{x}_n$，定义一个聚类标注 $r_n$，即如果 $\mathbf{x}_n$ 属于第 $k$ 个聚类，那么 $r_{nk}=1$，否则
    $r_{nk}=0$。


    +   - 准则函数：


    $J=\sum_{n=1}^{N}\sum_{k=1}^{K}r_{nk}\lVert\mathbf{x}_n-\boldsymbol{\mu}_k\rVert^2$


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1005_0.png)'
  merge: -1
  img_proc: true
- pgno: 1006
  md: '# K均值算法


    # 算法步骤


    +   ① 初始化 μ_k，按照最优化准则产生 r_nk

    +   J = Σ_{n=1}^N Σ_{k=1}^K r_nk || X_n - μ_k ||^2 → r_nk = { 0 if k = arg min_j
    || X_n - μ_j ||^2

    +   1 otherwise }


    +   ② 根据得到的 r_nk，按照最优准则产生 μ_k

    +   J = Σ_{n=1}^N Σ_{k=1}^K r_nk || X_n - μ_k ||^2 → μ_k = (Σ_n r_nk X_n) / (Σ_n
    r_nk)


    +   ③ 循环迭代 ① ②

    +   迭代 r_nk → Expectation

    +   迭代 μ_k → Maximization'
  merge: -1
  img_proc: true
