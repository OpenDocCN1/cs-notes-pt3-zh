- pgno: 398
  md: "# 主要算法\n\n# ID3 (Iterative Dichotomiser 3)算法\n\n+   以信息熵为度量，每次优先选取信息增益最大的属性，即能使熵值最小的属性。\n\
    +   \n+   $H(D) = -\\sum_{c=1}^{C} p_c \\log_2 p_c$\n\n+   熵→随机变量不确定性的度量。\n+ \
    \  \n+   $ = -\\sum_{c=1}^{C} \\frac{D_c}{D} \\log_2 \\frac{D_c}{D}$\n+   \n+\
    \   $H(Y|X) = -\\sum_{i=1}^{n} p_i H(Y|X = x_i)$\n\n+   信息熵/经验熵/条件熵/经验条件熵/…\n\n\
    +   信息增益→特征对训练数据的信息增益定义为集合的经验熵与特征给定条件下集合的经验条件熵之差\n+   \n+   $G(D,a) = H(D) - H(D|a)$\n\
    +   \n+   $= H(D) + \\sum_{n=1}^{N} \\frac{|D^n|}{|D|} H(D^n)$"
  merge: -1
  img_proc: true
- pgno: 399
  md: '# # ID3算法


    # ## 决策树的生成算法


    **输入：**训练数据集$D$，特征集$A$，阈值$\epsilon$


    **输出：**决策树$T$


    +   1. 若$D$中所有实例属于同一类$C_k$，则$T$为单结点树，并将$C_k$作为该结点的类标记，返回$T$；

    +   2. 若$A=\varnothing$，则$T$为单结点树，并将$D$中实例数最大类$C_k$作为该结点类标记，返回$T$；

    +   3. 否则，计算$A$中各特征对$D$的信息增益，选择信息增益最大的特征$A_g$；

    +   4. 如果$A_g$的信息增益小于阈值$\epsilon$，则置$T$为单结点树，并将$D$中样本数最大的类$C_k$作为该结点的类标记，返回$T$；

    +   5. 否则，对$A_g$的每一个可能值$a_i$，分割$D$为若干非空子集$D_i$，将$D_i$中实例数最大的类作为标记，构建子结点，由结点及其子结点构成树$T$，返回$T$；

    +   6. 对第$i$个子结点，以$D_i$为训练集，$A-\{A_g\}$为特征集，递归的调用第(1)~(5)步，得到子树$T_i$，返回$T_i$。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# ID3算法


    # 算法优点


    +   - 只需对训练实例进行较好地标注，就能进行学习，从一类无序、无规则事物(概念)中推理出分类规则。


    +   - 分类模型是树状结构，简单直观，可将决策树中到达每个叶结点的路径转换为IF—THEN形式的分类规则，比较符合人类的理解方式。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# ID3算法


    # ID3算法局限性


    +   - 信息增益偏好取值多的属性(极限趋近于均匀分布)

    +   - 可能会受噪声或小样本影响，易出现过拟合问题

    +   - 无法处理连续值的属性

    +   - 无法处理属性值不完整的训练数据

    +   - 无法处理不同代价的属性'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# 属性筛选度量标准


    +   信息增益率(Information Gain Ratio)


    G_ratio(D, a) = G(D, a) / H(a)


    其中


    H(a) = - Σ_{n=1}^{N} |D_n| / |D| log₂ |D_n| / |D|


    称为属性a的固有值


    N越大，H(a)通常也越大；因此采用信息增益率，可缓解信息增益准则对可取值数目较多的属性的偏好。


    C4.5算法就采用增益率替代了ID3算法的信息增益'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 属性筛选度量标准


    +   基尼指数(Gini Index)


    Gini(D) = Σ_{c=1}^{C} Σ_{c''≠c} p_c p''_c = 1 - Σ_{c=1}^{C} p_c^2 = 1 - Σ_{c=1}^{C}
    (|D_c| / |D|)^2


    直观反映了从数据集中随机抽取两个样本，其类别不一致的概率；基尼指数越小，数据集的纯度越高。


    +   属性A的基尼指数    Gini(D, a) = Σ_{n=1}^{N} |D^n| / |D| Gini(D^n)


    +   最优属性选择    a* = arg min_{a∈A} Gini(D, a)


    CART算法就采用基尼指数替代了ID3算法的信息增益'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# 剪枝处理(Pruning)


    +   - 针对过拟合问题

    +     - 剪枝是主要手段


    +   - 基本策略

    +     - 预剪枝策略(Pre-pruning)：决策树生成过程中，对每个结点在划分前进行估计，若划分不能带来决策树泛化性能提升，则停止划分并将该节点设为叶结点。

    +     - 后剪枝策略(Post-pruning)：先利用训练集生成决策树，自底向上对非叶结点进行考察，若将该叶结点对应子树替换为叶结点能带来泛化性能提升，则将该子树替换为叶结点。'
  merge: -1
  img_proc: true
