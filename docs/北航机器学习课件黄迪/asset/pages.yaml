- pgno: 597
  md: '# 实例：背景建模


    +   - 针对每一个像素 **I(x, y)**，建立一个混合高斯模型

    +     $I_t(x, y) \sim p(x_t, y_t) = \sum_{k=1}^{K} \pi_k \cdot \mathcal{N}(x_t,
    y_t; \mu_k, \Sigma_k), \quad \sum_{k=1}^{K} \pi_k = 1$

    +   - $\pi_k$ 为第 $k$ 个高斯的权重，$\mu_k$, $\Sigma_k$ 分别为第 $k$ 个高斯的均值向量和协方差矩阵

    +   - 用前 N 帧图像进行训练，得到 GMM 的参数

    +     $\hat{\pi}_{x,y,k}, \quad \hat{\mu}_{x,y,k}, \quad \hat{\Sigma}_{x,y,k}$

    +   - 如果第 $N+i$ 帧图像中某像素不服从 GMM，则该像素为前景'
