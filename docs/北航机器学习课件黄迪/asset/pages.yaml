- pgno: 1089
  md: '# 基本采样法 (Basic Sampling)


    例子：标准柯西分布

    已知 z ~ U(0,1)

    求 y = f(z)

    使 p(y) = 1/π * 1/(1+y²)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_1089_0.png)


    h(y) = ∫_{-∞}^{y} p(ŷ) dŷ = 1/π arctan y + 1/2


    y = h^{-1}(z) = π tan(z - 1/2)'
