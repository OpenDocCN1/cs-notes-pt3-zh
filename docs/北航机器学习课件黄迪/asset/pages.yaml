  md: '# 不同代价属性的处理


    +   - 问题描述

    +     - 不同的属性测量具有不同的代价

    +     - 医疗诊断为例：

    +       - 属性：体温、血压、血常规、活检

    +       - 代价不同：所需时间、费用、友好性等


    +   - 基本思想

    +     - 在属性筛选度量标准中考虑属性的不同代价

    +     - 优先选择低代价属性的决策树

    +     - 必要时才依赖高代价属性'
