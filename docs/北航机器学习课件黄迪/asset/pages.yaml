- pgno: 931
  md: '# 条件随机场

    (Conditional Random Fields)


    +   CRF定义


    X与Y是随机变量，是在给定X的条件下的条件概率分布，若随机变量Y构成一个由无向图G = (V, E) 表示的马尔可夫场，即


    p(Y_v|X, Y_w, w ≠ v) = p(Y_v|X, Y_w, w ~ v)


    对任意节点v成立，则称条件概率分布p(Y|X) 为条件随机场。式中 w ~ v 表示在图G中与节点v有边连接的所有节点w, w ≠ v 表示节点v以外的所有节点。Y_v,
    Y_w 为节点 v, w 对应的随机变量。'
  merge: -1
  img_proc: true
- pgno: 932
  md: '# 条件随机场

    (Conditional Random Fields)


    +   线性链条随机场 (Linear-chain CRF)


    令 x = {x₁, x₂, ..., xₙ} 表示观测序列


    是 y = {y₁, y₂, ..., yₙ} 状态序列变量，有：


    p(y|x, λ) ∝ exp( Σⱼ λⱼ tⱼ(yᵢ₋₁, yᵢ, x, i) + Σₖ μₖ sₖ(yᵢ, x, i) )


    tⱼ(yᵢ₋₁, yᵢ, x, i) 是定义在边上的特征函数，称为转移特征函数，依赖当前和前一个位置。


    sₖ(yᵢ, x, i) 是定义在结点上的特征函数，称为状态特征函数，依赖于当前位置。'
  merge: -1
  img_proc: true
- pgno: 933
  md: '# 条件随机场

    (Conditional Random Fields)


    +   两个特征函数可以统一为： $f_j(y_{i-1}, y_i, x, i)$

    +   则有：


    $p(\mathbf{y}|\mathbf{x}, \lambda) = \frac{1}{Z(\mathbf{x})} \exp\left(\sum_{i=1}^{n}
    \sum_{j} \lambda_j f_j(y_{i-1}, y_i, x, i)\right)$


    其中：


    $Z(\mathbf{x}) = \sum_{j} \exp\left(\sum_{i=1}^{n} \sum_{j} \lambda_j f_j(y_{i-1},
    y_i, x, i)\right)$'
