- pgno: 316
  md: '# 决策树算法


    # 基本思想


    +   采用自顶向下的递归方法，以信息熵为度量构造一棵熵值下降最快的树，到叶子结点处的熵值为零，此时每个叶结点中的实例都属于同一类


    +   决策树可以看成一个if-then的规则集合


    +   一个决策树将特征空间划分为不相交的单元(Cell)或区域(Region)


