  md: '# 线性判别函数


    +   两类情况下线性判别函数 $g(x) = w^T x + w_0$


    $x = \begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_d \end{bmatrix}$ 特征向量/样本向量； $w
    = \begin{bmatrix} w_1 \\ w_2 \\ \vdots \\ w_d \end{bmatrix}$ 权向量； $w_0$ 阈值权(常数)


    $g(x) = g_1(x) - g_2(x)$


    如果 $\begin{cases} g(x) > 0, x \in w_1 \\ g(x) < 0, x \in w_2 \\ g(x) = 0, \text{可将}x\text{分到任意一类或拒绝}
    \end{cases}$


    $g(x)=0$ 定义了一个决策面，当 $g(x)$ 为线性函数时，决策面就是超平面。'
