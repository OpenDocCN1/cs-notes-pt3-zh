- pgno: 173
  md: '# 基于最小风险的决策


    条件期望损失（条件风险）：对于特定的 $x$ 采取决策 $\alpha_i$ 的期望损失：


    $$R(\alpha_i|x)=E[\lambda(\alpha_i,w_j)|x]=\sum_{j=1}^{c}\lambda(\alpha_i,w_j)P(w_j|x),\quad
    i=1,2,\ldots,k$$


    期望风险：对所有可能 $x$ 采取决策 $\alpha(x)$ 所造成的期望损失之和


    $$R(\alpha)=\int R(\alpha(x)|x)p(x)\,dx$$


    也称平均风险（$R(\alpha)$ 表示 $R$ 依赖于决策规则 $\alpha(\cdot)$）


    对所有 $x$，使 $R(\alpha(x)|x)$ 最小，则可以使 $R(\alpha)$ 最小


    最小风险贝叶斯决策规则：


    $$\text{if }R(\alpha_t|x)=\min_{j=1,\ldots,k}R(\alpha_j|x),\text{ then }\alpha=\alpha_t$$'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 示例-基于最小错误率


    假设在某个局部区域细胞中正常($w_1$)和异常($w_2$)两类的先验概率分别为：正常状态 $P(w_1)=0.9$，异常状态 $P(w_2)=0.1$。现有一待识别细胞，其观察值为$x$，从类条件概率密度曲线上查得
    $p(x|w_1)=0.2$，$p(x|w_2)=0.4$。试对该细胞$x$进行分类。


    # 解：利用贝叶斯公式计算$w_1$和$w_2$的后验概率


    $P(w_1|x) = \frac{p(x|w_1)P(w_1)}{\sum_{j=1}^{2} p(x|w_j)P(w_j)} = \frac{0.2\times0.9}{0.2\times0.9+0.4\times0.1}
    = 0.818$

    $P(w_2|x) = 1 - P(w_1|x) = 0.182$


    # 根据贝叶斯决策规则有


    $P(w_1|x) = 0.818 > P(w_2|x) = 0.182$


    把$x$归类于正常细胞。'
  merge: -1
  img_proc: true
