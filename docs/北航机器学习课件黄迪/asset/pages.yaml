- pgno: 965
  md: "# Fisher准则\n\n寻找最好投影方向 $w^*$\n\n以二分类问题为例，$d$维样本$x_1, x_2.... x_N$ 其中$N_1$个属于$w_1$类记为子集$X_1$,\
    \ $N_2$个属于$w_2$类记为子集$X_2$。\n\n在$d$维$X$空间\n\n+   (1) 各类样本的均值向量 $m_i$  $m_i = \\\
    frac{1}{N_i} \\sum_{x \\in X_i} x, i = 1, 2$\n\n+   (2) 样本类内离散度矩阵 $S_i$ 和总类内离散度矩阵\
    \ $S_w$\n+   \n+   $S_i = \\sum_{x \\in X_i} (x - m_i)(x - m_i)^T, i = 1, 2$\n\
    +   \n+   $S_w = S_1 + S_2$\n+   \n+   $S_w = P(w_1)S_1 + P(w_1)S_2$\n\n+   (3)\
    \ 样本类间离散度矩阵 $S_b$\n+   \n+   $S_b = (m_1 - m_2)(m_1 - m_2)^T$\n+   \n+   $S_b\
    \ = P(w_1)P(w_2)(m_1 - m_2)(m_1 - m_2)^T$"
  merge: -1
  img_proc: true
- pgno: 966
  md: "# Fisher准则\n\n寻找最好投影方向 $w^*$\n\n以二分类问题为例，$d$维样本$x_1, x_2, ... x_N$ 其中$N_1$个属于$w_1$类记为子集$X_1$,\
    \ $N_2$个属于$w_2$类记为子集$X_2$。\n\n在一维$Y$空间\n$y_n = w^T x_n$\n\n+   (1) 各类样本均值 $\\\
    tilde{m}_i$    $\\tilde{m}_i = \\frac{1}{N_i} \\sum_{y \\in \\eta_i} y, i = 1,\
    \ 2$\n\n+   (2) 样本类内离散度 $\\tilde{S}_i^2$ 和总类内离散度 $\\tilde{S}_w$\n+   \n+   $\\\
    tilde{S}_i^2 = \\sum_{y \\in \\eta_i} (y - \\tilde{m}_i)^2, i = 1, 2$\n+   \n\
    +   $\\tilde{S}_w = \\tilde{S}_1^2 + \\tilde{S}_2^2$"
