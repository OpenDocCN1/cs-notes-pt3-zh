  md: '# 决策树定义


    # 决策树(Decision Tree)


    +   - 决策树是一种树型结构，由结点和有向边组成


    +   - 节点


    +     - 内部节点表示一个属性或特征


    +     - 叶节点代表一种类别


    +   - 有向边/分支


    +     - 分支代表一个测试输出


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_993_0.png)'
  merge: -1
  img_proc: true
- pgno: 994
  md: '# 决策树算法


    # 基本思想


    +   - 采用自顶向下的递归方法，以信息熵为度量构造一棵熵值下降最快的树，到叶子节点处的熵值为零，此时每个叶节点中的实例都属于同一类


    +   - 决策树可以看成一个 if-then 的规则集合


    +   - 一个决策树将特征空间划分为不相交的单元(Cell)或区域(Region)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_994_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_994_1.png)'
  merge: -1
  img_proc: true
- pgno: 995
  md: '# 算法流程


    # 决策树构建的基本流程


    +   Step 1：选取一个属性作为决策树的根结点，然后就这个属性所有的取值创建树的分支。


    +   Step 2：用这棵树来对训练数据集进行分类：

    +   - 如果一个叶结点的所有实例都属于同一类，则以该类为标记标识此叶结点。

    +   - 如果所有的叶结点都有类标记，则算法终止。


    +   Step 3：否则，选取一个从该结点到根路径中没有出现过的属性作为标记标识该结点，然后就这个属性所有的取值继续创建树的分支；重复算法步骤Step 2。'
  merge: -1
  img_proc: true
- pgno: 996
  md: '# 主要算法


    +   ID3 (Iterative Dichotomiser 3)算法


    +   以信息熵为度量，每次优先选取信息增益最大的属性，即能使熵值最小的属性。

    +   $H(D) = -\sum_{c=1}^{C} p_c \log_2 p_c$

    +   $= -\sum_{c=1}^{C} \frac{D_c}{D} \log_2 \frac{D_c}{D}$


    +   熵→随机变量不确定性的度量。

    +   信息熵/经验熵/条件熵/…

    +   $H(Y|X) = -\sum_{i=1}^{n} p_i H(Y|X = x_i)$


    +   信息增益→特征对训练数据的信息增益定义为集合的经验熵与特征给定条件下集合的经验条件熵之差

    +   $G(D,a) = H(D) - H(D|a)$

    +   $= H(D) + \sum_{n=1}^{N} \frac{|D^n|}{|D|} H(D^n)$'
  merge: -1
  img_proc: true
- pgno: 997
  md: '# ID3算法


    # 决策树的生成算法


    输入：训练数据集$D$, 特征集$A$, 阈值$\varepsilon$


    输出：决策树$T$


    +   (1)若$D$中所有实例属于同一类$C_k$，则$T$为单结点树，并将类$C_k$作为该结点的类标记，返回$T$；


    +   (2)若$A=\varnothing$，则$T$为单结点树，并将$D$中实例数最大类$C_k$作为该结点类标记，返回$T$；


    +   (3)否则，计算$A$中各特征对$D$的信息增益，选择信息增益最大的特征$A_g$；


    +   (4)如果$A_g$的信息增益小于阈值$\varepsilon$，则置$T$为单结点树，并将$D$中样本数最大的类$C_k$作为该结点的类标记，返回$T$；


    +   (5)否则，对$A_g$的每一个可能值$a_i$，分割$D$为若干非空子集$D_i$，将$D_i$中实例数最大的类作为标记，构建子结点，由结点及其子结点构成树$T$，返回$T$；


    +   (6)对第$i$个子结点，以$D_i$为训练集，$A-\{A_g\}$为特征集，递归的调用第(1)~(5)步，得到子树$T_i$，返回$T_i$。'
  merge: -1
  img_proc: true
- pgno: 998
  md: '# 主要算法


    # ID3算法特点


    +   - 从一类无序、无规则的事物(概念)中推理出决策树表示的分类规则，只需要对训练实例进行较好的标注，就能够进行学习。

    +   - 分类模型是树状结构，简单直观，可将决策树中到达每个叶节点的路径转换为IF—THEN形式的分类规则，比较符合人类的理解方式。'
  merge: -1
  img_proc: true
