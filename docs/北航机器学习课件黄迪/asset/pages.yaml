- pgno: 614
  md: '# 神经元结构


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_614_0.png)


    人类的脑皮层大约有14,000,000,000个神经细胞，亦称为神经元。每个神经元有数以千计的通道同其它神经元广泛相互连接，形成复杂的生物神经网络。'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# 神经元结构


    +   - 工作机制

    +     - 一个神经元有两种状态：兴奋和抑制；

    +     - 平时处于抑制状态的神经元，其树突和胞体接收其他神经元由突触传来的兴奋电位，多个输入在神经元中以代数和的方式叠加；

    +     - 如果输入兴奋电位总量超过某个阈值，神经元会被激发进入兴奋状态，发出输出脉冲，并由突触传递给其他神经元。

    +     - 神经元被触发后进入不应期，在不应期不能被触发，然后阈值逐渐下降，恢复兴奋性。'
  merge: -1
  img_proc: true
- pgno: 616
  md: '# 神经元结构


    +   - 六个基本特征

    +   1) 神经元及其联接；

    +   2) 神经元之间的联接强度决定信号传递的强弱；

    +   3) 神经元之间的联接强度是可以随训练改变的；

    +   4) 信号可以是起刺激作用的，也可以是起抑制作用的；

    +   5) 一个神经元接受的信号的累积效果决定该神经元的状态；

    +   6) 每个神经元可以有一个“阈值”。'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# # 人工神经元的MP模型


    # ## MP模型


    +   - 是一种人工神经元的数学模型，它最早是由美国的McCulloch和Pitts提出的神经元模型，是大多数神经网络模型的基础。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_617_0.png)'
  merge: -1
  img_proc: true
- pgno: 618
  md: "# 人工神经元的MP模型\n\n+   • 人工神经元是仿照生物神经元提出的，神经元可以有N个输入：\n+   \n+   $x_1, x_2, ...,\
    \ x_N$\n\n+   • 每个输入端与神经元之间有一定的联接权值：\n+   \n+   $w_1, w_2, ..., w_N$\n\n+   •\
    \ 神经元总的输入为对每个输入的加权求和，同时减去阈值$\\theta$。$a$代表神经元的活跃值，即神经元状态：\n+   \n+   $a = \\sum_{i=1}^{N}\
    \ w_i x_i - \\theta = \\sum_{i=0}^{N} w_i x_i$"
  merge: -1
  img_proc: true
- pgno: 619
  md: '# # 人工神经元的MP模型


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_619_0.png)


    +   - 神经元的输出 $y$ 是对 $a$ 的映射：

    +     $$y=f(a)=f\left(\sum_{i=0}^{N}w_i x_i\right)$$


    $f$ 称为激活函数（激励函数，输出函数），有很多形式。'
  merge: -1
  img_proc: true
- pgno: 620
  md: "# 人工神经元的MP模型\n\n+   - MP模型采用阶跃函数作为激活函数\n\n```\nf(x) = { 1,   x ≥ 0\n      \
    \  -1,  x < 0 }\n```\n\n```\ny = sign( Σ_{i=0}^{N} w_i x_i )\n```\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_620_0.png)\n\
    \n+   - 当激活函数 f 为阈值(阶跃)函数时，神经元就可以看作是一个线性分类器。"
  merge: -1
  img_proc: true
