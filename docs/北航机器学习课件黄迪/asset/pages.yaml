- pgno: 915
  md: '# 隐马尔可夫模型

    (Hidden Markov Models)


    假设有N个缸，每个缸中装有许多个彩球


    | 缸 | 1 | 2 | 3 | ... |

    |---|---|---|---|---|

    | 颜色1 | m₁₁ | m₁₂ | m₁₃ |  |

    | 颜色2 | m₂₁ | m₂₂ | m₂₃ | ... |

    | 颜色3 | m₃₁ | m₃₂ | m₃₃ |  |

    | ... |  |  |  |  |


    按照以下方式实验


    +   - 随机从N个缸中选取一个

    +   - 从中随机抽出一个球，记录其颜色O₁，并放回

    +   - 以概率pᵢ转移到缸i

    +   - 重复以上步骤


    最后得到一个球的观测序列 O = {O₁, O₂, ..., O_T}'
  merge: -1
  img_proc: true
- pgno: 916
  md: '# 隐马尔可夫模型

    (Hidden Markov Models)


    +   - HMM的状态是不确定或不可见的，只有通过观测序列的随机过程才能表现出来

    +   - 观察到的事件与状态并不是一一对应，而是通过一组概率分布相联系

    +   - HMM是一个双重随机过程

    +     - 马尔可夫随机：状态之间的转移是随机的，且具有马尔可夫性，状态之间的转移用转移概率描述。

    +     - 一般随机过程：状态生成某种观测是随机的，用观测概率描述'
  merge: -1
