  md: "# 支持向量机\n\n# 处理噪声和离群点\n\n这种处理方式也被称为是从硬间隔(Hard Margin)向软间隔(Soft Margin)的转变。\n\
    \n硬间隔\n\n```\nmin_{w,b} \\frac{1}{||w||^2}\n s.t. t_n(w^T x_n + b) \\ge 1, n =\
    \ 1, ..., N\n```\n\n软间隔\n\n```\nmin_{w,b,\\xi} \\frac{1}{||w||^2} + C \\sum_{n=1}^{N}\
    \ \\xi_n\n s.t. t_n(w^T x_n + b) \\ge 1 - \\xi_n, n = 1, ..., N\n \\xi_n \\ge\
    \ 0\n```\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_985_0.png)\n\n![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_985_1.png)"
