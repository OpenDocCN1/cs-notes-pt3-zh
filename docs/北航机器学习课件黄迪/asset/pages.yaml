- pgno: 524
  md: '# K均值算法


    +   - 两步走策略

    +     - 循环迭代：根据产生的 $\mu_k$，按照最优准则产生 $r_{nk}$


    迭代 $r_{nk}$ → Expectation


    迭代 $\mu_k$ → Maximization'
