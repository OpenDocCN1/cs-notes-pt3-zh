  md: '# # 最小二乘准则


    +   - A.-M. Legendre(1806提出)，C. Gauss(1809提出/1829证明)


    最小二乘法(最小平方误差法)通过最小化误差的平方和寻找数据的最佳函数匹配，即可以使求得的数据与实际数据之间误差的平方和最小。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_205_0.png)'
  merge: -1
