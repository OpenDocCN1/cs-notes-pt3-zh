  md: '# K均值算法


    +   对于样本 xₙ，定义一个聚类标注 rₙ    rₙ ∈ ℝᴷ


    +   如果 xₙ属于第k个聚类，则第k维为1，即

    +   rₙₖ = 1, and rₙⱼ = 0 for j ≠ k

    +   如 rₙ = [0, 0, 1, 0, 0]ᵀ 表示xₙ属于5类中的第3类


    +   准则函数：

    +   J = Σₙ=1ᴺ Σₖ=1ᴷ rₙₖ ‖xₙ − μₖ‖²


