  md: '# K均值算法


    +   - 对于样本 $x_n$，定义一个聚类标注 $r_n$    $r_n \in \mathbb{R}^K$

    +   - 如果 $x_n$属于第k个聚类，则第k维为1，即

    +     $r_{nk}=1$, and $r_{nj}=0$ for $j \neq k$

    +     如 $r_n = [0,0,1,0,0]^T$ 表示$x_n$属于5类中的第3类

    +   - 准则函数：

    +     $$J = \sum_{n=1}^{N} \sum_{k=1}^{K} r_{nk} \|x_n - \mu_k\|^2$$'
  merge: -1
