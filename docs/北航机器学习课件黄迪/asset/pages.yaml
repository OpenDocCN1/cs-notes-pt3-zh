- pgno: 474
  md: '# 局部线性嵌入


    # Local Linear Embedding (LLE)


    保持数据点的原有流形结构


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_474_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_474_1.png)


    # Nonlinear Dimensionality Reduction by Locally Linear Embedding


    Sam T. Roweis¹ and Lawrence K. Saul²


    SCIENCE VOL 290 22 DECEMBER 2000


    前提假设：采样数据所在的低维流形在局部是线性的，每个采样点可以用它的近邻点线性表示。


    学习目标：在低维空间中保持每个邻域中的权值不变，即假设嵌入映射在局部是线性的条件下，最小化重构误差。'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# 局部线性嵌入


    # Local Linear Embedding (LLE)


    保持数据点的原有流形结构


    寻找每个样本点的K近邻 $x_{ij} (j = 1, ..., k)$


    对每个点用K个近邻进行重建，即求一组权值 $w_{ij}$，$\sum_j w_{ij} = 1$


    使 $\min \sum_i \left| x_i - \sum_j w_{ij} x_{ij} \right|^2$


    求低维空间中的点集 $y_i$


    使 $\min \sum_i \left| y_i - \sum_j w_{ij} y_{ij} \right|^2$'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# 局部线性嵌入


    Local Linear Embedding (LLE)


    保持数据点的原有流形结构


    计算权值，首先构造局部协方差矩阵 $C^i$


    $C^i_{jk} = (x_i - x_j) \cdot (x_i - x_k)$


    然后，最小化 $\min \sum_i |x_i - \sum_j w_{ij} x_{ij}|^2$


    $s.t. \quad \sum_j w_{ij} = 1$


    最后可求得 $w_{ij} = \frac{\sum_k (C^i_{jk})^{-1}}{\sum_{jk} (C^i_{jk})^{-1}}$'
  merge: -1
  img_proc: true
- pgno: 477
  md: '# 局部线性嵌入


    # Local Linear Embedding (LLE)


    保持数据点的原有流形结构


    计算低维数据，最小化 min Σ_i |y_i − Σ_j w_ij y_ij|²


    可转化为最小化 min Σ_ij M_ij (y_i · y_j)


    其中，M = (I − W)^T (I − W)


    求解 MY = λY


    取Y为M的最小d个非零特征值所对应的特征向量，最终的输出结果即为N×d大小的矩阵'
  merge: -1
  img_proc: true
