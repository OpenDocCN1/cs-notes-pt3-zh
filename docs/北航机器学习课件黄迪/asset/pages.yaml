- pgno: 495
  md: '# 概率主成分分析


    # PCA的概率表示


    p(z) = N(z|0, I)

    p(x|z) = N(x|Wz + μ, σ²I)

    p(x) = ∫ p(x|z)p(z)dz = N(x|μ, C)

    C = WWᵀ + σ²I


    E[x] = E[Wz + μ + ε] = μ

    cov[x] = E[(Wz + ε)(Wz + ε)ᵀ]

    = E[WzzᵀWᵀ] + E[εεᵀ] = WWᵀ + σ²I'
