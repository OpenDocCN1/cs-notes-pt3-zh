- pgno: 637
  md: '# BP反向传播算法


    +   - 用梯度法求非线性函数极值，因而有可能陷入局部极小点，不能保证收敛到全局极小点。

    +   - 权值初始值：如果权值初始值都为零或都相同，隐层各单元不能出现差异，运算不能正常进行。因此，通常用较小的随机数(例如均值为0，方差为0.1高斯随机数)作为权值初始值。初始值对收敛有影响，当计算不收敛时，可以改变初始值试算。'
  merge: -1
