- pgno: 959
  md: '# 线性判别函数


    如果 $x_1$ 和 $x_2$ 都在决策面 $H$ 上，则有

    $$w^T x_1+w_0=w^T x_2+w_0$$

    即

    $$w^T(x_1-x_2)=0$$

    说明 $w$ 和超平面 $H$ 上任一向量正交，即 $w$ 是 $H$ 的法向量。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_959_0.png)


    判别函数 $g(x)$ 可以看成是特征空间中某点 $x$ 到超平面 $H$ 距离的一种代表度量


    $$x=x_p+r\frac{w}{\|w\|}$$


    +   - $x_p$：$x$ 在 $H$ 上的投影向量

    +   - $r$：$x$ 到 $H$ 上的垂直距离

    +   - $\frac{w}{\|w\|}$：是 $w$ 方向上的单位向量


    $$g(x)=w^T\left(x_p+r\frac{w}{\|w\|}\right)+w_0$$

    $$=w^T x_p+r\frac{w^T w}{\|w\|}+w_0=r\|w\|$$


    $$r=\frac{g(x)}{\|w\|}$$'
  merge: -1
  img_proc: true
- pgno: 960
  md: '# # 线性判别函数


    若 $x$ 为原点，则 $g(x)=w_0$


    从原点到超平面 $H$ 的距离 $r_0=\frac{w_0}{\|w\|}$


    如果 $w_0>0$，则原点在 $H$ 的正侧


    如果 $w_0<0$，则原点在 $H$ 的负侧


    如果 $w_0=0$，则 $g(x)$ 具有齐次形式，超平面 $H$ 通过原点


    超平面 $H$ 的方向由权向量 $w$ 决定；其位置由阈值权 $w_0$ 确定。


    判别函数 $g(x)$ 正比于 $x$ 点到超平面的代数距离


    当 $x$ 在 $H$ 的正侧时，$g(x)>0$


    当 $x$ 在 $H$ 的负侧时，$g(x)<0$'
  merge: -1
  img_proc: true
- pgno: 961
  md: '# 广义线性判别函数


    不适用于非凸和多连通区域划分


    +   - 两类问题, X是一维样本空间

    +   若 x < a 或 x > b, x ∈ w₁

    +   若 a < x < b, x ∈ w₂

    +   如果建立 g(x) = (x - a)(x - b)

    +   决策规则 { g(x) > 0, x ∈ w₁

    +   { g(x) < 0, x ∈ w₂

    +   一般形式 g(x) = c₀ + c₁x + c₂x²

    +   可转化为 g(x) = aᵀy = Σᵢ₌₁³ aᵢyᵢ

    +   y = [y₁ y₂ y₃]ᵀ = [1 x x²]ᵀ    a = [a₁ a₂ a₃]ᵀ = [c₀ c₁ c₂]ᵀ

    +   称 g(x) = aᵀy 广义线性判别函数

    +    a 广义权向量


    利用线性函数的简单性解决复杂问题


    维数大大增加 → “维数灾难”


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_961_0.png)'
