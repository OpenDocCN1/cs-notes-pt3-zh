- pgno: 806
  md: '# 循环神经网络 (Recurrent neural Network, RNN)


    # RNN训练-Back Prop Through Time(BTPP)


    +   计算W的偏导，需要对每个t求偏导


    ∂E/∂W = Σ_{t=1}^{T} ∂E_t/∂W


    +   链式法则


    ∂E_t/∂W = Σ_{k=1}^{t} ∂E_t/∂y_t ∂y_t/∂h_t ∂h_t/∂h_k ∂h_k/∂W'
  merge: -1
  img_proc: true
- pgno: 807
  md: "# 循环神经网络 (Recurrent neural Network, RNN)\n\n+   ■ 已知 $h_t = W\\left(f(h_{t-1})\
    \ + W^{(hx)} x_{[t]}\\right)$\n\n+   ■ 可得\n+   \n+   $\\frac{\\partial h_t}{\\\
    partial h_k} = \\prod_{j=k+1}^{t} \\frac{\\partial h_j}{\\partial h_{j-1}}$\n\n\
    $\\frac{\\partial h_t}{\\partial h_k} = \\prod_{j=k+1}^{t} \\frac{\\partial h_j}{\\\
    partial h_{j-1}} = \\prod_{j=k+1}^{t} W^T \\operatorname{diag}[f'(h_{j-1})]$"
  merge: -1
  img_proc: true
- pgno: 808
  md: '# 循环神经网络 (Recurrent neural Network, RNN)


    +   RNN中gradient vanishing/exploding


    +   已知 ∂h_t/∂h_k = ∏_{j=k+1}^{t} ∂h_j/∂h_{j-1} = ∏_{j=k+1}^{t} W^T diag[f''(h_{j-1})]


    +   根据 ||xy|| ≤ ||x|| · ||y||


    ||∂h_j/∂h_{j-1}|| ≤ ||W^T|| ||diag[f''(h_{(j-1)})]|| ≤ β_W β_h   代表上限


    ||∂h_t/∂h_k|| = ||∏_{j=k+1}^{t} ∂h_j/∂h_{j-1}|| ≤ (β_W β_h)^{t-k}


    当与间隔较远时，梯度会很快的变的很大或很小'
  merge: -1
  img_proc: true
