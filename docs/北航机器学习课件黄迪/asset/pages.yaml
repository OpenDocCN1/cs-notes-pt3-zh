- pgno: 590
  md: '# EM算法


    • 假设有一组数据 $X=\{X_1,\cdots,X_N\}$，经隐变量 $Z$ 产生，该数据的对数似然函数可以写作：


    $\ell(\theta)=\ln p(X;\theta)=\ln\sum_Z p(X,Z\mid\theta)$


    $=\ln\sum_Z p(X\mid Z,\theta)p(Z\mid\theta)$


    式中含有和（或积分）的对数，优化困难'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# EM算法


    +   • 要最大化 $\ell(\theta)$，可以考虑利用迭代的方式，每一个新的 $\theta$ 能使 $\ell(\theta)$ 变大，即 $\ell(\theta)
    > \ell(\theta^{(i)})$ 为此，考虑两者的差：


    $\ell(\theta) - \ell(\theta^{(i)}) = \ln \sum_{Z} p(X|Z,\theta)p(Z|\theta) - \ln
    p(X;\theta^{(i)})$'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# EM算法


    +   ● 利用Jensen不等式，得其下界：


    $\ell(\theta)-\ell(\theta^{(i)})=\ln\sum_Z p(X|Z,\theta)p(Z|\theta)-\ln p(X|\theta^{(i)})$


    $=\ln\left(\sum_Z p(X|Z,\theta^{(i)})\frac{p(X|Z,\theta)p(Z|\theta)}{p(X|Z,\theta^{(i)})}\right)-\ln
    p(X|\theta^{(i)})$


    $\geq\sum_Z p(Z|X,\theta^{(i)})\ln\frac{p(X|Z,\theta)p(Z|\theta)}{p(Z|X,\theta^{(i)})}-\ln
    p(X|\theta^{(i)})$


    $=\sum_Z p(Z|X,\theta^{(i)})\ln\frac{p(X|Z,\theta)p(Z|\theta)}{p(Z|X,\theta^{(i)})p(X|\theta^{(i)})}$'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# EM算法


    ● 令


    $$B(\theta,\theta^{(i)})=\ell(\theta^{(i)})+\sum_z p(z\mid X,\theta^{(i)})\ln\frac{p(X\mid
    Z,\theta)p(Z\mid\theta)}{p(Z\mid X,\theta^{(i)})p(X\mid\theta^{(i)})}$$


    则


    $$\ell(\theta)\ge B(\theta,\theta^{(i)})$$


    $B(\theta,\theta^{(i)})$ 是 $\ell(\theta)$ 的一个下界


    因此，使 $B(\theta,\theta^{(i)})$ 增大的 $\theta$ 也可以使 $\ell(\theta)$ 增大'
  merge: -1
  img_proc: true
- pgno: 594
  md: '# # EM算法


    +   • 为了使 $\ell(\theta)$ 尽可能增大，求使 $B(\theta,\theta^{(i)})$ 极大的 $\theta$


    $$\theta^{(i+1)}=\arg\max_{\theta} B(\theta,\theta^{(i)})$$


    $$\theta^{(i+1)}=\arg\max_{\theta}\left(\ell(\theta^{(i)})+\sum_Z p(Z\mid X,\theta^{(i)})\ln\frac{p(X\mid
    Z,\theta)p(Z\mid\theta)}{p(Z\mid X,\theta^{(i)})p(X\mid\theta^{(i)})}\right)$$


    $$=\arg\max_{\theta}\left(\sum_Z p(Z\mid X,\theta^{(i)})\ln\bigl(p(X\mid Z,\theta)p(Z\mid\theta)\bigr)\right)$$


    $$=\arg\max_{\theta}\left(\sum_Z p(Z\mid X,\theta^{(i)})\ln p(X,Z\mid\theta)\right)$$


    $$=\arg\max_{\theta}Q(\theta,\theta^{(i)})$$


    EM算法的一次迭代，即求Q函数及其极大化'
  merge: -1
  img_proc: true
