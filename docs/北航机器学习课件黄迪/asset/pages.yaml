- pgno: 150
  md: '# # 贝叶斯曲线拟合


    $p(t\mid x,\mathbf{x},t)=\int p(t\mid x,\mathbf{w})p(\mathbf{w}\mid\mathbf{x},t)\,d\mathbf{w}.$


    $p(t\mid x,\mathbf{w},\beta)=\mathcal{N}\left(t\mid y(x,\mathbf{w}),\beta^{-1}\right)$


    $p(\mathbf{w}\mid\mathbf{x},t,\alpha,\beta)\propto p(t\mid x,\mathbf{w},\beta)p(\mathbf{w}\mid\alpha).$


    $p(t\mid x,\mathbf{x},t)=\mathcal{N}\left(t\mid m(x),s^2(x)\right)$'
