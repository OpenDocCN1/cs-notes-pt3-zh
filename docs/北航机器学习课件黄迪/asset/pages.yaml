- pgno: 140
  md: '# 标准方程组

    (Normal Equations)


    +   - 目标函数：

    +     $J(\mathbf{w}) = \sum_{i=1}^{N} (f(\mathbf{x}_i) - y_i)^2$

    +     $= \sum_{i=1}^{N} (\mathbf{w}^T \mathbf{x}_i - y_i)^2$


    +   - 直接求导，并令其等于0，求得极值'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 标准方程组

    (Normal Equations)


    +   将目标函数写成矩阵形式：


    J(w) = Σ_{i=1}^{N} (w^T x_i - y_i)^2

    = (X w - y)^T (X w - y)


    +   其中


    X = (x_1^T \ x_2^T \ ... \ x_N^T) = (x_{11}, x_{12}, ..., x_{1m} \ x_{21}, x_{22},
    ..., x_{2m} \ ... \ x_{N1}, x_{N2}, ..., x_{Nm})


    y = (y_1 \ y_2 \ ... \ y_N)^T'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 标准方程组

    (Normal Equations)


    +   求导：

    +   ∂J(w)/∂w = ∂/∂w (Xw - y)^T (Xw - y)

    +   = 2 X^T (Xw - y) = 0

    +   ⇒ X^T X w = X^T y


    +   得到模型的参数：

    +   ŵ = (X^T X)^{-1} X^T y'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# # 梯度下降 vs 标准方程组


    +   🔴 **梯度下降法：**

    +   - 需要选择 α

    +   - 需要迭代多次

    +   - 需要数据归一化

    +   - 样本量非常大时也适用


    +   🔴 **标准方程组：**

    +   - 不需要选择 α

    +   - 不需要迭代多次

    +   - 无需数据归一化

    +   - 样本量大时不适用

    +     （需要计算 $(X^T X)^{-1}$）


    样本量较小时选用标准方程组求解

    样本量较大时选用梯度下降法求解'
  merge: -1
