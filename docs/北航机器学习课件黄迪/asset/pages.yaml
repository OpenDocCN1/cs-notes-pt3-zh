- pgno: 257
  md: '# 对偶问题


    # 拉格朗日对偶性


    原问题 min_w f(w) 转化为 min_w θ_P(w) = min_w max_{α,β;α_i≥0} L(w,α,β)，记为 p*


    直接求解不容易进而转向另一个问题 θ_D(α,β) = min_w L(w,α,β)，先固定 α,β，求拉格朗日函数关于 w 的最小值，之后再求 θ_D(α,β)
    的最大值，即 max_{α,β;α_i≥0} θ_D(α,β) = max_{α,β;α_i≥0} min_w L(w,α,β) 原问题的对偶问题，记为 d*


    d* = max_{α,β;α_i≥0} min_w L(w,α,β) ≤ min_w max_{α,β;α_i≥0} L(w,α,β) = p*


    假设 f 和 g 都是凸函数，h 是仿射的(Affine，线性函数的一般形式)，且对于所有的 i，g_i(w) < 0，那么一定存在 w*，α*，β*，使
    w* 是原问题的解，α*，β* 是对偶问题的解，即 d* = p* = L(w*，α*，β*)，且 w*，α*，β* 满足 KKT 条件。'
