- pgno: 278
  md: '# # 序列最小优化算法


    # ● 变量的选择方法


    SMO算法在每个子问题中选择两个变量优化，其中至少一个变量是违反KKT条件的。


    # (1)第一个变量的选择(外层循环)


    外层循环在训练样本中选取违反KKT条件最严重的样本点，并将其对应的变量作为第一个变量。检验是否满足KKT条件：


    $$a_i=0\ \Longleftrightarrow\ y_i g(x_i)\geq 1$$

    $$0<a_i<C\ \Longleftrightarrow\ y_i g(x_i)=1$$

    $$a_i=C\ \Longleftrightarrow\ y_i g(x_i)\leq 1$$


    其中，$g(x_i)=\sum_{j=1}^{N}a_jy_jK(x_j,x_i)+b$


    外循环首先遍历满足条件 $0<a_i<C$ 的样本点，就是在边界上的支持向量点，如果都满足KKT条件，再遍历整个训练集。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 序列最小优化算法


    # 变量的选择方法


    SMO算法在每个子问题中选择两个变量优化，其中至少一个变量是违反KKT条件的。


    (2)第二个变量的选择(内层循环)


    假设在外层循环已经找到第一个变量 $a_1$，那么内层循环要找到第二个变量 $a_2$，希望使 $a_2$ 有足够大的变化。


    $a_2^{new,unc} = a_2^{old} + \frac{y_2(E_1 - E_2)}{\eta}$


    $a_2^{new} = \begin{cases} H, & a_2^{new,unc} > H \\ a_2^{new,unc}, & L \le a_2^{new,unc}
    \le H \\ L, & a_2^{new,unc} < L \end{cases}$


    $a_2^{new}$ 是依赖于 $|E_1 - E_2|$ 的


    简单做法是选择 $a_2$ 使 $|E_1 - E_2|$ 最大


    $a_1$ 已定，$E_1$ 确定，如果 $E_1$ 为正，选择最小的 $E_i$ 作为 $E_2$；如果 $E_1$ 为负，选择最大的 $E_i$ 作为
    $E_2$。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# # 序列最小优化算法


    # ## 变量的选择方法


    SMO算法在每个子问题中选择两个变量优化，其中至少一个变量是违反KKT条件的。


    **(3) 计算阈值** $b$ **和差值** $E_i$


    在每次完成两个变量的优化后，都要重新计算阈值 $b$。当 $0<a_1^{new}<C$ 时，由KKT条件 $0<a_i<C\Longleftrightarrow
    y_i g(x_i)=1$ 可计算：


    $$b_1^{new}=-E_1-y_1K_{11}(a_1^{new}-a_1^{old})-y_2K_{21}(a_2^{new}-a_2^{old})+b^{old}$$


    同理，当 $0<a_2^{new}<C$ 时，可计算：


    $$b_2^{new}=-E_2-y_1K_{12}(a_1^{new}-a_1^{old})-y_2K_{22}(a_2^{new}-a_2^{old})+b^{old}$$


    如果 $a_1^{new},a_2^{new}$ 同时满足条件 $0<a_i^{new}<C,i=1,2$，那么 $b_1^{new}=b_2^{new}$。


    如果 $a_1^{new},a_2^{new}$ 是 $0$ 或者 $C$，那么 $b_1^{new},b_2^{new}$ 以及他们之间的数都是符合KKT条件的阈值，这是取它们的中点作为
    $b^{new}$。之后更新 $E_i$


    $$E_i^{new}=\sum_j y_j a_j K(x_i,x_j)+b^{new}-y_i$$'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 序列最小优化算法


    # SMO算法


    输入：训练数据集 $T = (x_1, y_1), (x_2, y_2), ..., (x_N, y_N)$，其中 $x_i \in \mathcal{X}
    = R^n$，$y_i \in \mathcal{Y} = \{-1, +1\}, i = 1, 2, ..., N$，精度 $\epsilon$；


    输出：近似解 $\hat{a}$。


    +   (1) 取初值 $a^{(0)} = 0$，令 $k = 0$；


    +   (2) 选取优化变量 $a_1^k, a_2^k$，解析求解两个变量的最优化问题，求得最优解 $a_1^{k+1}, a_2^{k+1}$，更新 $a$
    为 $a^{k+1}$；


    +   (3) 若在精度 $\epsilon$ 范围内满足停止条件 其中， $g(x_i) = \sum_{j=1}^{N} a_j y_j K(x_j,
    x_i) + b$ 则转(4)；否则令 $k = k + 1$，转(2)；


    $\sum_{i=1}^{N} a_i y_i = 0$  $0 \le a_i \le C, i = 1, 2, ..., N$  $y_i \cdot
    g(x_i) = \begin{cases} \ge 1, & \{x_i | a_i = 0\} \\ = 1, & \{x_i | 0 < a_i <
    C\} \\ \le 1, & \{x_i | a_i = C\} \end{cases}$


    +   (4) 取 $\hat{a} = a^{(k+1)}$。'
