- pgno: 318
  md: '# 算法流程


    # 构建过程的基本流程


    +   - Step1：选取一个属性作为决策树的根结点，然后就这个属性所有的取值创建树的分支。


    +   - Step2：用这棵树来对训练数据集进行分类：

    +     - 如果一个叶结点的所有实例都属于同一类，则以该类为标记标识此叶结点。

    +     - 如果所有的叶结点都有类标记，则算法终止。


    +   - Step3：否则，选取一个从该结点到根路径中没有出现过的属性作为标记标识该结点，然后就这个属性的所有取值继续创建树的分支；重复算法步骤2。'
