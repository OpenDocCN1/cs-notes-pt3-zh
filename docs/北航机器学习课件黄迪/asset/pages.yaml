- pgno: 262
  md: '# 支持向量机


    # 处理噪声和离群点


    这种处理方式也被视为是从硬间隔(Hard Margin)向软间隔(Soft Margin)的转变。


    硬间隔


    ```

    $$\min_{w,b} \frac{1}{2}\|w\|^2$$

    $$s.t.\quad t_n(w^T x_n+b)\geq 1,\quad n=1,\ldots,N$$

    ```


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_262_0.png)


    软间隔


    ```

    $$\min_{w,b} \frac{1}{2}\|w\|^2+C\sum_{n=1}^{N}\xi_n$$

    $$s.t.\quad t_n(w^T x_n+b)\geq 1-\xi_n,\quad n=1,\ldots,N$$

    $$\xi_n\geq 0$$

    ```


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_262_1.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # 支持向量机


    # ## 处理噪声和离群点


    利用拉格朗日乘子法求解：


    $$L(w,b,\xi,a,\mu)=\frac{1}{2}\lVert w\rVert^2+C\sum_{n=1}^{N}\xi_n-\sum_{n=1}^{N}a_n\{t_ny(x_n)-1+\xi_n\}-\sum_{n=1}^{N}\mu_n\xi_n$$


    $$a_n\geq 0;\ \mu_n\geq 0$$


    # ### KKT条件：


    +   - $a_n\geq 0$

    +   - $t_ny(x_n)-1+\xi_n\geq 0$

    +   - $a_n(t_ny(x_n)-1+\xi_n)=0$

    +   - $\mu_n\geq 0$

    +   - $\xi_n\geq 0$

    +   - $\mu_n\xi_n=0$


    # ### 优化 $w,b,\{\xi_n\}$


    $$\frac{\partial L}{\partial w}=0\Rightarrow w=\sum_{n=1}^{N}a_nt_nx_n$$


    $$\frac{\partial L}{\partial b}=0\Rightarrow\sum_{n=1}^{N}a_nt_n=0$$


    $$\frac{\partial L}{\partial \xi_n}=0\Rightarrow a_n=C-\mu_n$$


    # ### 代入化简：


    $$\tilde{L}(a)=\sum_{n=1}^{N}a_n-\frac{1}{2}\sum_{n=1}^{N}\sum_{m=1}^{N}a_na_mt_nt_mx_n^Tx_m$$'
  merge: -1
  img_proc: true
