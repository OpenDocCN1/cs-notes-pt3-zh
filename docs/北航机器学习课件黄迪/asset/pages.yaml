- pgno: 435
  md: "# 不同代价属性的处理\n\n+   属性筛选度量标准1 [Tan et al., 1990, 1993]\n+   \n+   $G_{Cost}(D,a)\
    \ = \\frac{G(D,a)}{Cost(a)}$\n\n+   属性筛选度量标准2 [Nunez et al., 1988, 1991]\n+  \
    \ \n+   $G_{Cost}(D,a) = \\frac{2^{G(D,a)} - 1}{(Cost(a)+1)^{\\omega}}$\n\n其中\
    \ $Cost(a)$ 为属性 $a$ 的代价\n\n$\\omega \\in [0,1]$ 为常数，决定代价对于信息增益的相对重要性"
