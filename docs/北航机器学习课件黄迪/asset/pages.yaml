- pgno: 600
  md: '# # 人工神经网络发展概述


    # ● 萌芽期（20世纪40年代）


    +   ➢ 40年代初，美国McCulloch和Pitts从信息处理的角度，研究神经细胞行为的数学模型表达，提出了二值神经元模型。**MP模型**的提出开始了对神经网络的研究进程。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_600_0.png)


    +   ➢ 1949年，心理学家Hebb提出著名的**Hebb学习规则**，即由神经元之间结合强度的改变来实现神经学习的方法。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_600_1.png)'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# 人工神经网络发展概述


    第一次高潮期（20世纪50-60年代）


    现代串行计算机的奠基人 Von Neumann 注意到计算机与人脑的差异，对类似于神经网络的分布系统做了许多研究


    50年代末期，Rosenblatt 提出感知机模型，它基本符合神经生理学的原理。在60代掀起了神经网络研究的第一次高潮。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_601_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_601_1.png)'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# 人工神经网络发展概述


    # 反思期（1969-1980年）


    +   1969年，人工智能创始人之一的Minsky和Papert以出版了《感知器》，从数学上深入分析了感知器的原理，指出其局限性。


    +   Minsky的结论是悲观的，神经网络的研究进入了低潮。主要自适应共振理论，自组织映射，认知机网络模型理论，BSB模型等等，为神经网络的发展奠定了理论基础。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_602_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_602_1.png)'
  merge: -1
  img_proc: true
- pgno: 603
  md: '# # 人工神经网络发展概述


    # ● 第二高潮期(1981~1990)


    +   ➢ 1982年，Hopfield提出了人工神经网络的一种数学模型，引入了能量函数的概念，设计出用电子线路实现这一网络的方案，大大促进了人工神经网络的研究。


    +   ➢ 1986年，Rumelhart及Hinton等学者提出了多层感知器的反向传播算法，解决了多层前向神经网络的学习问题，证明了多层神经网络具有很强的学习能力。


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_603_0.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_603_1.png)


    ![](img/292e77b9b7b40db2ea6f49ac62f8aa0f_603_2.png)'
  merge: -1
  img_proc: true
- pgno: 604
  md: '# # 人工神经网络发展概述


    # ●再认识与应用研究期(1991~2006年)


    问题：


    +   - 应用面还不够宽

    +   - 结果不够精确


    研究：


    +   - 开发现有模型的应用，并在应用中根据实际运行情况对模型、算法加以改进，以提高网络的训练速度和运行的准确度。

    +   - 在理论上寻找新的突破，建立新的专用/通用模型和算法。

    +   - 进一步对生物神经系统进行研究，不断地丰富对人脑的认识。'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 人工神经网络发展概述


    # 深度神经网络时期(2006~)


    +   > 2006年，Hinton提出了更有效的训练神经元的新方法，通过“逐层初始化（layer-wise pre-training）”来克服多层神经网络在训练上的难度。


    +   > 2012年，Alex Krizhevsky 在ImageNet图像分类竞赛中取得了里程碑式的突破，Top5分类准确率由74%提升至85%。


