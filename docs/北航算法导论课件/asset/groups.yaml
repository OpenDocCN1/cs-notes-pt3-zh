  - '[PAGE 25]


    # 1.2.1 Efficiency


    3×10⁹ × 3×10⁹ instruc / 10⁹ instruc/s ≈ 285.39 years


    3×10⁹ × lg(3×10⁹) instruc / 10⁹ instruc/s ≈ 94.45 seconds


    +   1. To same problem, algorithms often differ dramatically in their efficiency
    （同一问题，同样环境，不同算法的效率可能悬殊巨大） （A1 < A2）


    +   2. The differences can be much more significant than differences due to hardware
    and software （类比硬件与软件的不同，算法的迥异带来的意义可能更明显，即，改进算法可能比升级硬件更有益） （A > H & S）


    +   ● Example: sorting ten million (10⁷) numbers


    +   ◆ Insertion sort: T(n) = c₁ n²


    +   ■ Computer A: 10⁹ instruc/s


    +   ■ World’s craftiest programmer


    +   ■ Machine language


    T(n) = 2 n²


    t = 2·(10⁷)² instruc / 10⁹ instruc/s = 2×10⁵ s ≈ 55.56 h


    +   ◆ Merge sort: T(n) = c₂ n lg n


    +   ■ Computer B: 10⁷ instruc/s


    +   ■ Average programmer


    +   ■ High-level language


    T(n) = 50 n lg n


    t = 50·10⁷ lg 10⁷ instruc / 10⁷ instruc/s ≈ 19.38 m'
  - '[PAGE 26]


    # 1.2.1 Efficiency


    3. Efficient algorithm gains much more from the hardware improvement. For example,


    +   - Suppose that the computer makes one basic step per second (ν=1). Algorithm
    A and B use the same computer. Algorithm A runs as (n_A)², and B as 100n_B.


    +   - If an application requires you to complete as many items as possible in
    one hour (t= 3600 sec).


    +   - Thus if A can make n_A items, and B makes n_B items, then ν t = 3600 = (n_A)²
    = 100n_B yields n_A = 60 and n_B = 36.


    +   - But suppose that you replace the computer with one that is hundred times
    as fast. So you can make 360000 steps in the same time. Then 360000 = (n_A)² =
    100n_B yields n_A = 600 and n_B = 3600.


    Algorithm B gains much more from the faster computer than A !!!'
