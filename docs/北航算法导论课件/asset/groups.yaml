    \ + f[a] d_T(a) - f[x] d_{T'}(x) - f[a] d_{T'}(a) \\\\\n&= f[x] d_T(x) + f[a]\
    \ d_T(a) - f[x] d_T(a) - f[a] d_T(x) \\\\\n&= (f[x] - f[a]) d_T(x) + (f[a] - f[x])\
    \ d_T(a) \\\\\n&= (f[a] - f[x]) (d_T(a) - d_T(x)) \\ge 0.\n\\end{aligned}\n$$\n\
    \n类似地，$B(T') - B(T'') \\ge 0$；因此，$B(T'') \\le B(T)$。由于 $T$ 是最优的，$B(T) \\le B(T'')$。于是\
    \ $B(T'') = B(T)$。因此，$T''$ 是一棵最优树。\n\n### 引理 16.3（最优子结构性质）\n\n设字母表 $C$ 中每个字符 $c\
    \ \\in C$ 的频率为 $f[c]$。设 $x, y \\in C$ 是频率最低的两个字符。令 $C' = (C - \\{x, y\\}) \\cup\
