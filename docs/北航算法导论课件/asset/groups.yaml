  - '[PAGE 396]


    # 15.4 Longest common subsequence


    **Subsequence:** given a sequence $X=\langle x_1,x_2,\ldots,x_m\rangle$, another
    sequence $Z=\langle z_1,z_2,\ldots,z_k\rangle$ is a *subsequence* of $X$ if there
    exists a strictly increasing sequence $\langle i_1,i_2,\ldots,i_k\rangle$ of indices
    of $X$ such that for all $j=1,2,\ldots,k$, we have $x[i_j]=z_j$.


    （给定序列 $X$，如果存在 $X$ 的索引的一个严格增序列 $\langle i_1,i_2,\ldots,i_k\rangle$，使得对所有的 $j=1,2,\ldots,k$，其中
    $i_j\in\{1,2,\ldots,m\}$，且都有 $x[i_j]=z_j$，则称 $Z=\langle z_1,z_2,\ldots,z_k\rangle$
    是 $X$ 的子序列。）


    For example, $Z=\langle B,C,D,B\rangle$ is a subsequence of $X=\langle A,B,C,B,D,A,B\rangle$
    with corresponding index sequence $\langle i_1,i_2,i_3,i_4\rangle=\langle 2,3,5,7\rangle$.'
  - '[PAGE 397]


    # 15.4 Longest common subsequence


    Common subsequence: Given two sequences X and Y, a sequence Z is a common subsequence
    of X and Y if Z is a subsequence of both X and Y.


    （给定两个序列 X 和 Y，如果序列 Z 是 X 的子序列同时也是 Y 的子序列，则称 Z 为 X 和 Y 的相同子序列）


    For example,


    X = A, B, C, B, D, A, B

    Z₁ = B, C, A

    Y = B, D, C, A, B, A


    X = A, B, C, B, D, A, B

    Z₂ = B, C, B, A

    Y = B, D, C, A, B, A


    Z₁ is a common subsequence, but not a LCS of X and Y.


    Z₂ is an LCS of X and Y (<B, D, A, B> is also an LCS).'
