    \ ⇒ f(n)=O(g(n)) then n≥n₀, 0≤c₁g(n)≤f(n) ⇒ f(n)=Ω(g(n))\n\n⇐: f(n)=O(g(n)), then\
    \ ∃c₂>0, n₂₀>0, s.t. n≥n₂₀, 0≤f(n)≤c₂₀g(n) f(n)=Ω(g(n)), then ∃c₁₀>0, n₁₀>0, s.t.\
    \ n≥n₁₀, 0≤c₁₀g(n)≤f(n) let n₀=max{n₁₀, n₂₀}, then n≥n₀, 0≤c₁₀g(n)≤f(n)≤c₂₀g(n),\
    \ that is f(n)=Θ(g(n)).\n\n## 3.1.3 Ω-notation: asymptotic lower bound\n\n###\
    \ Theorem 3.1\n\nFor any two functions f(n) and g(n), we have f(n)=Θ(g(n)) if\
    \ and only if f(n)=O(g(n)) and f(n)=Ω(g(n)).\n\n- In practice, rather than using\
    \ the theorem to obtain asymptotic upper and lower bounds from asymptotically\
    \ tight bounds, we usually use it to prove asymptotically tight bounds from asymptotic\
    \ upper and tower bounds.\n\n（定理作用：实际中，通常根据渐近上界和渐近下界来证明渐近紧界，而不是根据渐近紧界来得到渐近上界和渐近下界。）\n\
    \n## 3.1.3 Ω-notation: asymptotic lower bound\n\n- The running time of insertion\
    \ sort falls between Ω(n) and O(n²), the bounds are asymptotically tight.\n- The\
    \ running time of insertion sort is not Ω(n²). Why?\n- It is not contradictory\
    \ to say that the **worst-case running time** of insertion sort is Ω(n²). Why?\n\
    - The running time of an algorithm is Ω(g(n)), we mean that no matter what particular\
    \ input of size n is chosen for each value of n, the running time on that input\
    \ is at least a constant times g(n), for large n.\n- （算法的运行时间为Ω(g(n))意味着对足够大的n，对输入规模为n的任意输入,其运算时间至少是g(n)的一个常数倍。）\n\
    \n## 3.1.5 o-notation: upper bound but not asymptotically tight\n\n- The bound\
    \ provided by O-notation may or may not be asymptotically tight.\n- The bound\
