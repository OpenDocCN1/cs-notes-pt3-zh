    \ the k-p smallest elements, after line 14 copies L[i] into A[k], the subarray\
    \ A[p .. k] will contain the k-p+1 smallest elements. If L[i]>R[j], so do that.\n\
    \nTermination: k=r+1, subarray A[p .. k-1] is A[p .. r], contains r-p+1 smallest\
    \ elements of L[1 .. n₁+1] and R[1 .. n₂+1], in sorted order. All but the two\
    \ largest (sentinels) have been copied back into A.\n\n| MERGE(A, p, q, r) | cost\
    \ | times |\n|---|---|---|\n| 1   n₁ ← q-p+1 | c | 1 |\n| 2   n₂ ← r-q | c | 1\
