  - '[PAGE 563]


    # ### 33.3 Finding the convex hull


    CH(Q), the *convex hull* of a set Q of points, is the smallest convex polygon
    P for which each point in Q is either on the boundary of P or in its interior.


    Intuitively, we can think of each point in Q as being a nail sticking out from
    a board. The convex hull is then the shape formed by a tight rubber band that
    surrounds all the nails (See Figure 33.6).


    ![](img/09c68ab421cfce4995ddad1430ef2637_563_0.png)


    Figure 33.6: A set of points $Q = \{p_0, p_1, \ldots, p_{12}\}$ with its convex
    hull $\mathrm{CH}(Q)$ in gray.'
