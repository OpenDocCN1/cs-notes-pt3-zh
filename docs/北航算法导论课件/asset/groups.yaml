    \ $$\\alpha(T) = T.num/T.size$$\n\n- 我们将空表（没有任何项）的大小指定为 0，并将其负载因子定义为 1。\n\n###\
    \ 17.4.1 表的扩展\n\n- 我们假设表的存储是作为槽位的**数组**来分配的。\n- 当向已满的表中插入一个项时，我们可以通过分配一个比旧表有更多槽位的新表来**扩展**表。\n\
    - 一种常见的启发式方法是分配一个槽位数量是旧表两倍的新表。\n\n- 如果表的唯一操作是**插入**，那么表的负载因子总是至少为 1/2，因此浪费的空间量永远不会超过表总空间的一半。\n\
