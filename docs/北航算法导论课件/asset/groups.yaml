  - '[PAGE 367]


    # 15.3.1 Optimal substructure


    +   - **How to characterize the space of subproblems?**

    +     - simple, expand


    ![](img/09c68ab421cfce4995ddad1430ef2637_367_0.png)


    +   - **Matrix-chain multiplication**

    +     - constrain subproblem space to matrix products $A_1A_2\ldots A_j$,

    +     - an optimal parenthesization split this product between $A_k$ and $A_{k+1}$
    for some $1\le k<j$,

    +     - we had subproblems of the form $A_1A_2\ldots A_k$ and $A_{k+1}A_{k+2}\ldots
    A_j$,

    +     - the latter subproblem is not of the form $A_1A_2\ldots A_j$,

    +     - it was necessary to allow our subproblems to vary at “both ends”, that
    is, to allow both $i$ and $j$ to vary in the subproblem $A_iA_{i+1}\ldots A_j$.'
