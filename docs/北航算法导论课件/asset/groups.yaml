    \n当一个算法包含对自身的递归调用时，其运行时间通常可以用递归方程或递归式来描述，该方程根据规模更小的输入上的运行时间来描述规模为 n 的问题的总运行时间。\n\
    \n我们得到如下递归式：\n\nT(n) = { Θ(1) 若 n ≤ c\n         aT(n / b) + D(n) + C(n) 否则 }\n\
    \n- D(n) 是将问题分解为子问题所需的时间。\n- C(n) 是将子问题的解合并为原问题的解所需的时间。\n\n```\nMERGE-SORT(A,\
    \ p, r)\n1   if p < r\n2     Then q ← ⌊(p + r) / 2⌋\n3       MERGE-SORT(A, p,\
    \ q)\n4       MERGE-SORT(A, q+1, r)\n5       MERGE(A, p, q, r)\n```\n\nT(n) =\
    \ { Θ(1) 若 n ≤ c\n         a T(n / b) + D(n) + C(n) 否则 }\n\n- 假设原问题规模是 2 的幂，可以简化递归式的分析。这样，每一次分解都会得到两个规模恰好为\
    \ n/2 的子序列（该假设不影响递归式解的增长阶）。\n\n```\nMERGE-SORT(A, p, r)\n1   if p < r\n2   Then\
    \ q ← ⌊(p + r) / 2⌋\n3       MERGE-SORT(A, p, q)\n4       MERGE-SORT(A, q + 1,\
    \ r)\n5       MERGE(A, p, q, r)\n```\n\nT(n) = { Θ(1) 若 n ≤ c\n          aT(n\
    \ / b) + D(n) + C(n) 否则 }\n\n如何为 T(n)（归并排序对 n 个数的最坏情况运行时间）建立递归式？\n\n- 如果只有一个元素\
    \ n=1，则需要常数时间。\n- 当 n>1 时，\n\n- **分解**：该步骤只是计算子数组的中间位置，只需一步。因此，D(n)=Θ(1)。\n- **解决**：递归求解两个规模均为\
    \ n/2 的子问题，它对运行时间的贡献为 2T(n/2)。\n- **合并**：MERGE 过程表明 C(n)=Θ(n)。\n\nT(n) = { Θ(1)\
    \ 若 n = 1\n         2T(n / 2) + Θ(n) 若 n > 1 }\n\n```\nMERGE-SORT(A, p, r)\n1\
