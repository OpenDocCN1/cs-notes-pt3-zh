    - 类似地，如果从表中删除了许多对象，那么重新分配一个更小的表也许是值得的。\n- 我们假设动态表支持操作 TABLE-INSERT 和 TABLE-DELETE。\n\
    \  - TABLE-INSERT 向表中插入一个占用单个槽位的项，即一个条目的空间。\n  - 类似地，TABLE-DELETE 从表中删除一个项，从而释放一个槽位。\n\
