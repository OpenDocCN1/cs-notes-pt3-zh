    # 34.6 NP-Complete Class


    ![](img/09c68ab421cfce4995ddad1430ef2637_592_0.png)


    +   - Clearly all problems in P are in NP, i.e. P ⊆ NP.

    +   - Intuitively, NP-Complete is the class of the “most difficult” problems in
    NP.

    +   - All NP-Complete problems appear to be difficult.

    +   - No polynomial-time algorithm has been found for any NP-Complete problem.（对任何NPC，尚没有找到多项式算法）.
    For example,

    +     - Hamiltonian cycle problem

    +     - Boolean Satisfiability（布尔可满足性问题）


    +   - 如果NP问题的所有可能答案，都是可以在多项式时间内进行正确与否的验算的话，就叫完全多项式非确定问题（NPC）。

    +   - 一个可判定性问题C是NP完全（NPC）的，如果：

    +     1. 这个问题是NP问题。

    +     2. 所有其他的NPC问题可以归约为C问题。'
