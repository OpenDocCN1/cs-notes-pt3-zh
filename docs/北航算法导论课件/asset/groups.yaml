    14. PUSH(p₁, S)\n15. PUSH(p₂, S)\n16. for i ← 3 to m\n17.     while (the consecutive\
    \ segments formed by points\n           NEXT-TO-TOP(S), TOP(S), and pᵢ\n     \
    \      make a nonleft turn)\n18.         POP(S)\n19.     PUSH(pᵢ, S)\n20. return\
    \ S\n```\n\n![](img/09c68ab421cfce4995ddad1430ef2637_566_0.png)\n\n## Graham's\
    \ scan\n\n```\nGRAHAM-SCAN(Q) // T(n) , n = |Q|\n1. let p0 be the point in Q with\
    \ the minimum y-coordinate, or the leftmost such point in case of a tie\n2. let\
    \ <p1, p2, ..., pm> be the remaining points in Q sorted by polar angle in counterclockwise\
    \ order around p0 (if more than one point has the same angle, remove all but the\
    \ one that is farthest from p0)\n3. PUSH(p0, S)\n4. PUSH(p1, S)\n5. PUSH(p2, S)\n\
    6. for i ← 3 to m (|| m < n\n7. while (the consecutive segments formed by points\
    \ NEXT-TO-TOP(S), TOP(S), and pi makes a nonleft turn)\n8. POP(S)\n9. PUSH(pi,\
    \ S)\n10. return S\n```\n\nT(n) = ?\nΘ(n)\nO(n lg n), using merge sort and the\
