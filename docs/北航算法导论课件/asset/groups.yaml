    \n- **最终目标：底盘以最快方式通过整个工厂的时间** $= f^*$。\n\n  底盘必须完全通过线 1 或线 2 上的站点 $n$，然后到达工厂出口。\n\
    \n（目标：以最快方式通过整个装配过程，设该时间为 $f^*$。最后一步是在 line 1 or line 2 上通过 station $n$，然后直接退出装配线）\n\
    \n$f^* = \\min(f_1[n] + x_1, f_2[n] + x_2) \\qquad (15.1)$\n\n"
