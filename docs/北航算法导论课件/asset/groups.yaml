- raw:
  - '[PAGE 0]


    # Introduction to Algorithms


    # 算法导论


    北京航空航天大学 软件学院


    College of Software, Beihang University'
  - '[PAGE 1]


    # First Example: Identifying Genes in Human DNA (基因识别)


    +   - Identifying all the 100,000 genes in human DNA

    +     - determining the sequences of the sequences of the 3 billion(10⁹) chemical
    base pairs that make up human DNA.

    +     ( a strand of DNA ⊆ finite set {A, C, G, T} )


    （30亿对化学基组成人类DNA，如何界定这些序列，从而进行基因识别？不同化学基序列组成了不同的DNA。排序问题！）


    +   - Computer: 4G Hz CPU, 4*10⁹B/s, suppose that it executes one billion (10⁹)
    instructions per second

    +     （设该计算机的运行速度为：10亿条基本指令/s ，[一条指令含多个字节]）

    +   - Input size: n = 3*10⁹

    +   - Insertion sort: running time n²


    t = s/v : (3×10⁹ × 3×10⁹ instruc) / (10⁹ instruc/s) = 9×10⁹ seconds = (9×10⁹)/(60×60×24×365)
    y ≈ 285.39 years


    ![](img/09c68ab421cfce4995ddad1430ef2637_1_0.png)'
  - '[PAGE 2]


    # First Example: Identifying Genes in Human DNA


    +   - Identifying all the 100,000 genes in human DNA

    +     - determining the sequences of the 3 billion(10⁹) chemical base pairs that
    make up human DNA.

    +     - Insertion sort: running time n²

    +       \(\frac{3\times10^9 \times 3\times10^9 \text{instruc}}{10^9 \text{instruc/s}}
    = 9\times10^9 \text{seconds} = \frac{9\times10^9}{60\times60\times24\times365}
    \text{ y} \approx 285.39 \text{years}\)


    +   - Merge sort: running time n lgn

    +     \(\frac{3\times10^9 \times \lg(3\times10^9) \text{instruc}}{10^9 \text{instruc/s}}
    = 3\times \lg(3\times10^9) \text{seconds} \approx 94.45 \text{seconds}\)


    +   - The both sort methods are feasible in reason

    +   - But insertion sort is impractical'
  - "[PAGE 3]\n\n# Second Example: Fibonacci Number\n\n+   - F(n) = F(n-1) + F(n-2)\n\
    \n```\nA1: recurrence\n\nre_type f(type n)\n{\n    if(n<=2)\n        return 1;\n\
    \    else\n        return f(n-1)+f(n-2);\n}\n```\n\n```\nA2: non-recurrence\n\n\
    f1 = 1;\nf2 = 1;\nfor(i=3; i<=n; i++){\n    f = f1 + f2;\n    f1 = f2;\n    f2\
    \ = f;\n}\n```"
  - '[PAGE 4]


    # More Examples...


    +   - 淘宝网 (www.taobao.com)

    +     注册用户数：1.7亿（2009年），3.7亿（2011年1月），now？

    +     在线商品数8亿（2011年1月）, now？

    +     产品分类？不同类型产品成交金额分析？消费行为分析？

    +     物流配送？

    +     大数据量稀疏矩阵的SVD（奇异值分解）算法R=U·S·V’

    +   - 支付宝、阿里巴巴

    +   - 微信

    +     2011.1.21，发布

    +     → 2012.3.29，1亿 → 2012.9.17，2亿

    +     → 2013.1.16，3亿 → 2013.9，4亿+ → ???'
  - '[PAGE 5]


    # More Examples...


    +   - 全国居民身份证管理系统： $n = 1.3 \times 10^9$ 人

    +   - 国家安全防护指纹识别系统： $n >= 1.3 \times 10^9$ 人

    +   - $2^{67}-1 = A \times B$ ......

    +   - 天气预报、天文学、......'
  - '[PAGE 6]


    # Introduction to Algorithms


    +   - Students: undergraduate, graduate

    +   - Course property: base & core in computing


    软件学院日文应用软件开发专业研一学生栾鸿钧对总理说，最近几年我们国家对软件工程产业比较重视，但同印度相比，还存在差距。


    温总理接着栾鸿钧的话题说：“我参观过印度的软件公司。当时我就讲，软件主要决定于两个因素，第一是人的大脑，第二是市场的需求。人的智力开发，是无穷无尽的。我希望学软件的学生，一定要把基础打好，必须要有创造思维。如果学软件没有创造思维，就没有出路。不能仅仅满足于书本，软件关键在于开发，学习这个专业，是很有前途的。”


    （2008年12月20日，北航图书馆）'
  - "[PAGE 7]\n\n# Introduction to Algorithms\n\n![](img/09c68ab421cfce4995ddad1430ef2637_7_0.png)\n\
    \n> 温家宝：“我希望学软件的学生，一定要把基础打好，……，学习这个专业，是很有前途的。”\n> \n> （2008年12月20日，北航图书馆）"
  - '[PAGE 8]


    # Introduction to Algorithms


    +   - Students ... undergraduate, graduate

    +   - ... e & core in c...

    +   - Bibliography


    +   - 《Introduction to Algorithms》(Second Edition, Third Edition), T. H. Cormen,
    C. E. Leiserson, R. L. Rivest (2002, Turing Award), The MIT Press

    +   - 《The Art of Computer Programming》, Donald E, Knuth 1974, Turing Award


    > 网友： “没有读过《Intro…》，不能算是一个真正的程序员”


    > “计算机算法的圣经”


    > Bill Gates: “如果你认为你是一名真正优秀的程序员，请读Knuth的《计算机程序设计艺术》，如果你能读懂整套书的话，请给我发一份你的简历。”


    > “计算机程序设计理论的荷马史诗”


    Computer Algo... 里，D.S. 约翰逊 与开澄，谭明术 东增武，段振华 ，陈增武'
  - '[PAGE 9]


    # Introduction to Algorithms


    +   - 学习方式

    +     听课 + 看书 + 做作业 + 上机实践（编程） + 课外创作 + 考核

    +     20%  20%  10%  20%  20%  10%


    +   - 课堂要求

    +     学术很自由，课堂很严肃：不迟到、早退；不允许接听电话、大声聊天...


    +   - 考核形式与分数比例（仅作参考，内容和比例都根据需要随时调整）

    +     - 10~30分：平时上机

    +     - 05~10分：课堂测验

    +     - 20~30分：期末上机

    +     - 30~60分：期末笔试

    +     - 10分：大作业（软件创作；一定代码量的应用程序，演示效果好，用到一些典型的算法；小论文；竞赛获得比较好的奖；......）

    +     - 10分：讨论班（课堂知识点分析；上机题分析；相关最新算法分析；一些工程应用的算法分析；......）

    +     - 10分：鼓励同学们参与出题（包括上机题。给出题目和解题报告。例...）'
  - '[PAGE 10]


    # Introduction to Algorithms


    +   - 课程安排

    +     - 课堂讲解：基本理论讲解，基本方法的介绍分析

    +     - 上机实践：基本习题和经典习题的上机实践

    +     - 实际的项目训练：在以后的整个软件工程实践中，注重程序设计的可行性，程序的效率，软件测试的性能分析，……。

    +   - 如何读这本书'
