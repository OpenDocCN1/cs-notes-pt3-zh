    \n## 2.1 插入排序\n\n问题：将一组数字排序为非递减顺序\n\n输入：n 个数字的序列 <a₁,a₂,…,aₙ>\n\n输出：输入序列的一个排列（重新排序）<a₁',a₂',…,aₙ'>，使得\
    \ a₁' ≤ a₂' ≤ … ≤ aₙ'\n\n![](img/09c68ab421cfce4995ddad1430ef2637_35_0.png)\n\n\
    ## 2.1 插入排序\n\n- **伪代码**\n  - 在许多方面与 C、Pascal 或 Java 相似\n- **伪代码与真实代码之间的差异**\n\
    \  - 伪代码清晰、简洁地指定给定算法（清晰、准确）\n  - 伪代码通常不关心软件工程问题（数据抽象、模块化(模块化)、错误处理）（不用考虑太多技术细节）\n\
    \  - 用伪代码可以体现算法的本质\n  - 永远不会过时\n\n![](img/09c68ab421cfce4995ddad1430ef2637_37_0.png)\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_37_1.png)\n\n```\nINSERTION-SORT(A)\n\
    1   for(j = 2; j <= length[A]; j++) // loop header\n2   {      key = A[j]\n3 \
    \      // Insert A[j] into the sorted sequence A[1 .. j-1]\n4       i <- j-1\n\
    5       while(i > 0 && A[i] > key)\n6       {      A[i+1] = A[i]\n7          \
