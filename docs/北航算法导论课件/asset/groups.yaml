    \ Graham's scan\n\n- 通过维护候选点栈 S 连续线段左转或右转\n  - 输入集合 Q 的每个点都被推入栈一次。\n  - 不是 CH(Q)\
    \ 顶点的点最终会被从栈中弹出\n  - 算法终止时，栈 S 恰好包含 CH(Q) 的顶点，按其在边界上出现的逆时针顺序排列。\n\n```\nGRAHAM-SCAN(Q)\n\
    1. let p0 be the point in Q with the minimum y-coordinate,\n   or the leftmost\
    \ such point in case of a tie\n2. let <p1, p2, ..., pm> be the remaining points\
