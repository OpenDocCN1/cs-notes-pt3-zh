    \ n/4 \\rfloor + 3\\left(\\lfloor n/16 \\rfloor + 3T(\\lfloor n/64 \\rfloor)\\\
    right)\\right) \\\\\n     &= n + 3\\lfloor n/4 \\rfloor + 9\\lfloor n/16 \\rfloor\
    \ + 27T(\\lfloor n/64 \\rfloor).\n\\end{aligned}\n$$\n\n- How far must we iterate\
