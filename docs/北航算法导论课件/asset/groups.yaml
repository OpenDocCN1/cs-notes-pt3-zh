    # 30.2.1 Complex roots of unity


    +   - ωⁿ = 1 , complex number ω is a complex nth root of unity

    +     【ω称为 1 的 n 次复根，或单位 n 次复根】

    +   - ωₙ = e^(2πi / n) : principal nth root of unity 【单位 n 次复根的基元】

    +   - ωₙᵏ = e^(2πik / n) , k = 0,1,⋯,n−1

    +     exactly n complex nth roots of unity

    +     【单位 1 有 n 个 n 次复根】

    +   - e^(iu) = cos(u) + i sin(u) :

    +     the exponential of a complex number

    +     ωₙᵏ = e^(2πik / n) = cos(2πk / n) + i sin(2πk / n),

    +     k = 0,1,⋯,n−1

    +   - All of the other complex nth roots of unity are powers of ωₙ.

    +     The n complex nth roots of unity {ωₙᵏ, k = 0,⋯,n−1} form a group.

    +     【n 个单位 n 次复根组成一个群（伽罗瓦, 法, 1811~1832）】


