    \       c[1, j] ← c[0, j]\n10          else c[1, j] ← c[1, j-1]\n11  for j ← 1\
    \ to n\n12      c[0, j] ← c[1, j]\n13  return c\n```\n\n# Solution\n\n## 15.4-4　$\\\
    min(m,n)$\n\n![](img/09c68ab421cfce4995ddad1430ef2637_419_0.png)\n\nUse $d_1$,\
