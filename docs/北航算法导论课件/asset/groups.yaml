    18     A(r, r[i,j]+1, j)\n```\n\n## Amortized Analysis\n\n- 在摊还分析中，我们将执行一系列数据结构操作所需的时间在所有已执行的操作上取平均。（在多个操作中，求一个操作的平均时间）\n\
    - 通过摊还分析，我们可以证明如果在操作序列上取平均，则操作的平均成本很小，即使序列中的单个操作可能很昂贵。\n- 摊还分析与平均情况分析不同，概率不涉及；摊还分析保证了在最坏情况下每个操作的平均性能。\n\
    \n## 17.1 Aggregate analysis\n\n- 在聚合分析中，我们证明对于所有 *n*，*n* 个操作的序列总共需要最坏情况时间 T(*n*)。\n\
    - 在最坏情况下，每个操作的平均成本，或摊还成本，因此为 T(*n*)/*n*。\n\n## Stack operations\n\n- **PUSH(S,\
    \ x)**: 将对象 x 压入栈 S。O(1)\n- **POP(S)**: 弹出栈 S 的顶部并返回被弹出的对象。在空栈上调用 POP 会产生错误。O(1)\n\
    - **MULTIPOP(S, x)**: 删除栈 S 的 k 个顶部对象，如果栈中包含的对象少于 k 个，则弹出整个栈。 （栈有 s 个对象。）O(min(s,\
