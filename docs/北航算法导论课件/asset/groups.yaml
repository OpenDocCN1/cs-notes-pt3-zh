    \ k 个，则弹出整个栈。 （栈有 s 个对象。）\n\n```\nMULTIPOP(S, k)\n1   while not STACK-EMPTY(S)\
    \ and k > 0\n2       POP(S)\n3       k = k - 1\n```\n\nO(min(s, k))\n\n![](img/09c68ab421cfce4995ddad1430ef2637_333_0.png)\n\
    \n## Stack operations\n\n- 让我们分析对初始为空的栈执行 n 个 PUSH、POP 和 MULTIPOP 操作的序列。\n\n```\n\
    STACK(S, n)\n    S = NULL\n    for i←1 to n\n        One of ( PUSH(S, i), POP(S),\
    \ MULTIPOP(S, k) )\n```\n\n- 运行时间紧密。O(n)\n- POP 可以在非空栈上被调用的次数，包括 MULTIPOP 内的调用，至多为\
    \ PUSH 操作的次数，而 PUSH 操作的次数至多为 n。 （push一个对象后，至多能被pop一次。至多n次push.）\n- 操作的平均成本为 O(n)/n\
    \ = O(1)\n- 在聚合分析中，我们将每个操作的摊还成本指定为平均成本。\n- 对于 STACK 操作，栈操作的平均成本（运行时间）为 O(1)，我们没有使用概率推理。\n\
    - 将此总成本除以 n 得出每个操作的平均成本，或摊还成本。\n\n## Incrementing a binary counter\n\n- 考虑实现一个\
    \ k 位二进制计数器，从 0 开始向上计数的问题。\n- 我们使用位数组 A[0 .. k-1] 作为计数器。 （使用位数组作为计数器）\n- 存储在计数器中的数字\
    \ x 具有最低有效位在 A[0] 中，最高有效位在 A[k-1] 中，使得\n  $$x = \\sum_{i=0}^{k-1} A[i] \\cdot\
