    17              j←j+1\n```\n\n![](img/09c68ab421cfce4995ddad1430ef2637_56_0.png)\n\
    \n### properties of loop invariant for MERGE\n\n```\nMERGE(A, p, q, r)\n1    n₁\
    \ ← q-p+1\n2    n₂ ← r-q\n3    create L[1 .. n₁+1], R[1 .. n₂+1]\n4    for i←1\
    \ to n₁\n5      do L[i]←A[p+i-1]\n6    for j←1 to n₂\n7      do R[j]←A[q+j]\n\
    8    L[n₁+1]←∞\n9    R[n₂+1]←∞\n10   i←1\n11   j←1\n12   for k←p to r\n13    \
    \ do if L[i]≤R[j]\n14         then A[k]←L[i]\n15              i←i+1\n16      \
    \   else A[k]←R[j]\n17              j←j+1\n```\n\nInitialization: prior to the\
    \ first iteration of the loop, k = p, so that A[p .. k-1] is empty. A[p .. k-1]\
    \ contains 0 smallest elements of L and R, and since i=j=1, both L[i] and R[j]\
    \ are the smallest elements of their arrays that have not been copied back into\
