  mdcn: "\n\n## 2.3.1 分治法\n\n- **MERGE(A,p,q,r):** MERGE 排序算法的关键操作，在“合并”步骤中合并两个已排序序列。\n\
    \  - *A* 是一个数组，*p, q,* 和 *r* 是对数组元素进行编号的下标，且满足 *p ≤ q < r*。\n  - 该过程假设子数组 *A[p\
    \ .. q]* 和 *A[q+1 .. r]* 已按排序顺序排列。该过程将它们合并形成一个单一的已排序子数组，用以替换当前子数组 *A[p .. r]*。\n\
    \  - 工作步骤：\n\n该过程耗时 Θ(n)，n=r-p+1\n\n? \n\n9 10 J Q K\n\n7 8 9 10 J\n\n```\nMERGE(A,\
    \ p, q, r)\n1   n₁ ← q-p+1\n2   n₂ ← r-q\n3   create arrays L[1 .. n₁+1] and R[1\
    \ .. n₂+1]\n4   for i←1 to n₁\n5       do L[i]←A[p+i-1]\n6   for j←1 to n₂\n7\
    \       do R[j]←A[q+j]\n8   L[n₁+1]←∞    // To avoid having to check whether either\
    \ pile is empty in each\n9   R[n₂+1]←∞    // basic step, a sentinel card is put\
    \ on the bottom of each pile.\n10  i←1\n11  j←1\n12  for k←p to r\n13      do\
    \ if L[i]≤R[j]\n14          then A[k]←L[i]\n15              i←i+1\n16        \
    \  else A[k]←R[j]\n17              j←j+1\n```\n\n![](img/09c68ab421cfce4995ddad1430ef2637_55_0.png)\n\
    \n子程序如何工作？下一页\n\n```\nMERGE(A, p, q, r)\n1   n₁ ← q-p+1\n2   n₂ ← r-q\n3   create\
    \ arrays L[1 .. n₁+1] and R[1 .. n₂+1]\n4   for i←1 to n₁\n5       do L[i]←A[p+i-1]\n\
    6   for j←1 to n₂\n7       do R[j]←A[q+j]\n8   L[n₁+1]←∞\n9   R[n₂+1]←∞\n10  i←1\n\
    11  j←1\n12  for k←p to r\n13      do if L[i]≤R[j]\n14          then A[k]←L[i]\n\
    15              i←i+1\n16          else A[k]←R[j]\n17              j←j+1\n```\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_56_0.png)\n\n### MERGE 的循环不变式性质\n\n\
    ```\nMERGE(A, p, q, r)\n1    n₁ ← q-p+1\n2    n₂ ← r-q\n3    create L[1 .. n₁+1],\
    \ R[1 .. n₂+1]\n4    for i←1 to n₁\n5      do L[i]←A[p+i-1]\n6    for j←1 to n₂\n\
    7      do R[j]←A[q+j]\n8    L[n₁+1]←∞\n9    R[n₂+1]←∞\n10   i←1\n11   j←1\n12\
    \   for k←p to r\n13     do if L[i]≤R[j]\n14         then A[k]←L[i]\n15      \
    \        i←i+1\n16         else A[k]←R[j]\n17              j←j+1\n```\n\n初始化：在循环的第一次迭代之前，k\
    \ = p，因此 A[p .. k-1] 为空。A[p .. k-1] 包含 L 和 R 的 0 个最小元素，并且由于 i=j=1，L[i] 和 R[j]\
    \ 分别是尚未复制回 A 的各自数组的最小元素。\n\n维护：首先假设 L[i]≤R[j]。由于 A[p .. k-1] 包含 k-p 个最小元素，在第 14\
    \ 行将 L[i] 复制到 A[k] 之后，子数组 A[p .. k] 将包含 k-p+1 个最小元素。如果 L[i]>R[j]，则如此做。\n\n终止：k=r+1，子数组\
    \ A[p .. k-1] 为 A[p .. r]，包含 L[1 .. n₁+1] 和 R[1 .. n₂+1] 的 r-p+1 个最小元素，按排序顺序排列。除了两个最大的哨兵之外，其余元素都已复制回\
    \ A。\n\n| MERGE(A, p, q, r) | cost | times |\n|---|---|---|\n| 1   n₁ ← q-p+1\
    \ | c | 1 |\n| 2   n₂ ← r-q | c | 1 |\n| 3   create arrays L[1 .. n₁+1] and R[1\
    \ .. n₂+1] | c | 1 |\n| 4   for i←1 to n₁ | c | n₁+1 |\n| 5     do L[i]←A[p+i-1]\
    \ | c | n₁ |\n| 6   for j←1 to n₂ | c | n₂+1 |\n| 7     do R[j]←A[q+j] | c | n₂\
