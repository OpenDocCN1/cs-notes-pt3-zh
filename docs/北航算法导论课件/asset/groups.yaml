    \ 2.85。) （不一定将概率最大的 key 放在树根，如...）\n\n- 对所有可能性进行穷举检查无法得到高效算法。\n  - 矩阵链乘法，装配线调度\n\
    - *n* 个节点的 BST 的数量为 Ω(4^n / n^{3/2}) (Problem 12-4)。\n- 毫不奇怪，我们将用动态规划来解决这个问题。\n\
    \n## Step 1: 最优 BST 的结构\n\n- 从关于子树的观察开始。\n- 考虑 BST 的任意子树\n  - 它必须包含某个连续范围的键 $k_i$,\
    \ ..., $k_j$，其中 $1\\le i \\le j \\le n$。\n  - 此外，该子树还必须以哑键 $d_{i-1}$, ..., $d_j$\
    \ 作为其叶子。\n- 最优子结构？\n\n![](img/09c68ab421cfce4995ddad1430ef2637_309_0.png)\n\n\
    ### 最优子结构\n\n如果最优 BST T 有一个包含键 k_i, ..., k_j 的子树 T’，那么这个子树 T’ 对于子问题 —— 键为 k_i\
    \ , ..., k_j 且哑键为 d_{i-1} , ..., d_j —— 也是最优的。\n\n（设 T’ 为最优 BST T 的一个子树，T’ 包含\
    \ keys k_i, ..., k_j 那么 T’ 是子问题〔关于 keys k_i, ..., k_j 和 dummy keys d_{i-1}, ...,\
    \ d_j〕的最优 BST）\n\n![](img/09c68ab421cfce4995ddad1430ef2637_310_0.png)\n\noptimal\
    \ BST T\n➔ optimal BST T’\n\n- **剪切-粘贴论证适用。**\n\n如果存在一个子树 *T′′* 其期望代价低于 *T′*，那么我们可以将\
    \ *T′* 从 *T* 中剪切出来并粘贴上 *T′′*，从而得到一棵期望代价低于 *T* 的二叉搜索树，这与 *T* 的最优性矛盾。\n\n![](img/09c68ab421cfce4995ddad1430ef2637_311_0.png)\n\
    \n- 一个细节，“空”子树\n- 假设在一个包含键 $k_i$, ..., $k_j$ 的子树中，\n  - 我们选择 $k_i$ 作为根，$k_i$ 的左子树不包含任何键。请记住，子树也包含哑键\
    \ $d_{i-1}$。\n  - 对称地，如果我们选择 $k_j$ 作为根，$k_j$ 的右子树包含键 $k_{j+1}$, ..., $k_j$；该右子树不包含实际键，但它确实包含哑键\
    \ $d_j$。\n\n![](img/09c68ab421cfce4995ddad1430ef2637_313_0.png)\n\n"
