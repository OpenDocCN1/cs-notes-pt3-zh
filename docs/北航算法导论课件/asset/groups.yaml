    LCS 动态规划表格，行标签为 $X$ 的前缀，列标签为 $Y$ 的前缀，单元格中包含长度值及回溯箭头。\n\n```\nLCS-LENGTH(X, Y)\
    \                       // X and Y as inputs\n1  m ← length[X]\n2  n ← length[Y]\n\
