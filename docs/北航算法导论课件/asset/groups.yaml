  - "[PAGE 470]\n\n# 16.3.2 Constructing a Huffman code\n\n**Huffman code:**  \na\
    \ greedy algorithm  \nthat constructs an  \noptimal prefix code\n\n```\nHUFFMAN(C)\n\
    1  n ← |C|\n2  Q ← C\n3  for i ← 1 to n − 1\n4      allocate(分配) a new node z\n\
    5      left[z] ← x ← EXTRACT-MIN(Q)\n6      right[z] ← y ← EXTRACT-MIN(Q)\n7 \
    \     f[z] ← f[x] + f[y]\n8      INSERT(Q, z)\n9  return EXTRACT-MIN(Q)  //return\
