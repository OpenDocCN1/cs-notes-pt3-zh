    \ an object with frequency *f*[*c*].\n+     - Build the tree *T* corresponding\
    \ to the optimal code.\n+     - Begin with |*C*| leaves, perform |*C*|−1 “merging”\
    \ operations.\n+     - A min-priority queue *Q*, keyed on *f*, is used to identify\
    \ the two least-frequent objects to merge together. Result of the merger is a\
    \ new object whose frequency is the sum of the frequencies of the two objects\
