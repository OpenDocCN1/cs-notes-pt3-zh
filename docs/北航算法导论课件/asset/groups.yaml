  md: "\n## 17.3 The potential method\n\n- The potential method of amortized analysis\
    \ represents the prepaid work as “potential energy” (potential), which can be\
    \ released to pay for future operations.\n- We associate the potential with the\
    \ data structure (DS) as a whole rather than with specific objects within the\
    \ data structure.\n- The potential method works as follows:\n  - We will perform\
    \ n operations, starting with an initial DS D₀.\n  - cᵢ : the actual cost of the\
    \ i-th operation (i = 1, 2, ..., n).\n  - Dᵢ : the DS that results after applying\
    \ the i-th operation to DS Dᵢ₋₁.\n  - Φ : A potential function Φ maps each DS\
    \ Dᵢ to a real number Φ(Dᵢ), which is the potential associated with DS Dᵢ.\n-\
    \ The amortized cost ĉᵢ of the i-th operation with respect to potential function\
    \ Φ is defined by\n\n  ĉᵢ = cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁)\n- The total amortized cost of\
    \ the n operations is\n\n  ∑ᵢ₌₁ⁿ ĉᵢ = ∑ᵢ₌₁ⁿ (cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁))\n\n  = ∑ᵢ₌₁ⁿ\
    \ cᵢ + Φ(Dₙ) − Φ(D₀).\n\n- The amortized cost $\\widehat{c}_i$ of the $i$th operation\
    \ with respect to potential function $\\Phi$ is defined by\n\n  $$\\widehat{c}_i\
    \ = c_i + \\Phi(D_i) - \\Phi(D_{i-1})$$\n- The total amortized cost of the $n$\
    \ operations is\n\n  $$\\sum_{i=1}^{n} \\widehat{c}_i = \\sum_{i=1}^{n} (c_i +\
    \ \\Phi(D_i) - \\Phi(D_{i-1}))$$\n\n  $$= \\sum_{i=1}^{n} c_i + \\Phi(D_n) - \\\
    Phi(D_0).$$\n- We usually just define $\\Phi(D_0)$ to be 0 and then show that\
    \ $\\Phi(D_i) \\ge 0$ for all $i$.\n- Different potential functions may yield\
    \ different amortized costs.\n\n### 17.3 The potential method - Stack operations\n\
    \n- The amortized cost $\\hat{c}_i$ of the $i$th operation with respect to potential\
    \ function $\\Phi$ is defined by\n\n  $$\\hat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1})$$\n\
    \n- The total amortized cost of the $n$ operations is\n\n  $$\\sum_{i=1}^{n} \\\
    hat{c}_i = \\sum_{i=1}^{n} (c_i + \\Phi(D_i) - \\Phi(D_{i-1}))$$\n\n  $$= \\sum_{i=1}^{n}\
    \ c_i + \\Phi(D_n) - \\Phi(D_0).$$\n\n- We define the potential function $\\Phi$\
    \ on a stack to be the number of objects in the stack.\n  - for the empty stack\
    \ $D_0$ with which we start, we have $\\Phi(D_0)=0$\n  - after the $i$th operation,\
    \ for the stack $D_i$, $\\Phi(D_i) \\ge 0$ ?\n\n- If the $i$th operation on a\
    \ stack containing $s$ objects is a PUSH operation, the potential difference is\
    \ $\\Phi(D_i) - \\Phi(D_{i-1}) = (s+1) - s = 1.$\n\n- The amortized cost of this\
    \ PUSH operation is\n\n  $$\\hat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1}) = 1\
    \ + 1 = 2.$$\n\n### 17.3 The potential method - Incrementing a binary counter\n\
    \n- We define the potential Φ of the counter after the i-th INCREMENT operation\
    \ to be b_i, the number of 1s in the counter after the i-th operation. (第i次操作后，势函数b_i为计数器中1的个数)\n\
    - Suppose that the i-th INCREMENT operation resets t_i bits (from 1 to 0). The\
    \ actual cost of the operation is therefore at most t_i+1, since in addition to\
    \ resetting t_i bits, it sets at most one bit to 1.\n  - If b_i = 0, then the\
    \ i-th operation resets all k bits, and so b_{i-1} = t_i = k.\n  - If b_i > 0,\
    \ then b_i = b_{i-1} - t_i + 1. (t_i 个1变为0，1个0变为1)\n  - In either case, b_i ≤\
    \ b_{i-1} - t_i + 1, and the potential difference is Φ(D_i) - Φ(D_{i-1}) ≤ (b_{i-1}\
    \ - t_i + 1) - b_{i-1} = 1 - t_i.\n- The amortized cost is therefore\n\n  ĉ_i\
    \ = c_i + Φ(D_i) - Φ(D_{i-1}) ≤ (t_i + 1) + (1 - t_i) = 2.\n\n- We define the\
    \ potential Φ of the counter after the i-th INCREMENT operation to be b_i, the\
    \ number of 1s in the counter after the i-th operation. (第i次操作后，势函数b_i为计数器中1的个数)\n\
    \n- The amortized cost is therefore\n  $\\hat{c}_i = c_i + Φ(D_i) - Φ(D_{i-1})\
    \ \\le (t_i + 1) + (1 - t_i) = 2$.\n\n- The worst-case cost of COUNTER is therefore\
    \ O(n)?\n\n```\nCOUNTER(A, n)\n    A = 0\n    for j ← 1 to n\n        INCREMENT(A)\n\
    ```\n\n```\nINCREMENT(A)\n1   i = 0\n2   while i < A.length and A[i] == 1\n3 \
    \      A[i] = 0\n4       i = i + 1\n5   if i < A.length\n6       A[i] = 1\n```\n\
    \n| Counter value | A[7] | A[6] | A[5] | A[4] | A[3] | A[2] | A[1] | A[0] | Total\
    \ cost |\n|---|---|---|---|---|---|---|---|---|---|\n| 0 | 0 | 0 | 0 | 0 | 0 |\
