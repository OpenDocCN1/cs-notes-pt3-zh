    \nExample:\nΓ = (u1∨u2)∧(u1∨¬u2)∧(u1∨u3)\n∧(u2∨u3)∧(u1∨¬u3)∧(u2∨¬u3)\n\n```\n\
    GSAT(Γ∈CNF)      // Las Vegas algorithm\nbegin\n1 for i=1 to Max-tries\n2   S=random(Γ);\
