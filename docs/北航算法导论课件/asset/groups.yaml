  - '[PAGE 441]


    # 16.1.4 A recursive greedy algorithm


    ```

    REC-ACTIVITY-SELECTOR(s, f, i, n)

    1 m ← i+1

    2 while m ≤ n and s_m < f_i  // Find first activity in S_{i,n+1}.

    3     m ← m+1

    4 if m ≤ n

    5     return {a_m} ∪ REC-ACTIVITY-SELECTOR(s, f, m, n)

    6 else return ∅

    ```


    +   - *Initial call:* REC-ACTIVITY-SELECTOR(s, f, 0, n).


    +   - *Idea:* The while loop checks a_{i+1}, a_{i+2}, . . . , a_n until it finds
    an activity a_m that is compatible with a_i (need s_m ≥ f_i).


    +   - If the loop terminates because a_m is found (m ≤ n), then recursively solve
    S_{m,n+1}, and return this solution, along with a_m.


    +   - If the loop never finds a compatible a_m (m > n), then just return empty
    set.


    ![](img/09c68ab421cfce4995ddad1430ef2637_441_0.png)


    ![](img/09c68ab421cfce4995ddad1430ef2637_441_1.png)'
