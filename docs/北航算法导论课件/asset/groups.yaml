    | 11  j←1 | c | 1 |\n| 12  for k←p to r | c | r-p+2 |\n| 13    do if L[i]≤R[j]\
    \ | c | r-p+1 |\n| 14      then A[k]←L[i] | c | x |\n| 15        i←i+1 | c | x\
    \ |\n| 16      else A[k]←R[j] | c | r-p+1-x |\n| 17        j←j+1 | c | r-p+1-x\
    \ |\n\nr-p+1\n= n₁ + n₂ = n\n\n1<=x<=n₁\n\nΘ(n₁+n₂)=Θ(n)\n\n- MERGE 过程作为子程序。\n\
    - MERGE-SORT(A, p, r) 对子数组 A[p .. r] 中的元素进行排序。\n- 如果 p ≥ r，则子数组最多有一个元素，已排序，为基本情况。\n\
    - 否则，分治步骤计算一个下标 q，将 A[p .. r] 分区为两个子数组：A[p .. q]，包含 ⌊n/2⌋ 个元素，和 A[q+1 .. r]，包含\
    \ ⌈n/2⌉ 个元素。\n\n```\nMERGE-SORT(A, p, r)\n1  if p < r\n2    Then q ← ⌊(p+r)/2⌋\n\
    3      MERGE-SORT(A, p, q)\n4      MERGE-SORT(A, q+1, r)\n5      MERGE(A, p, q,\
    \ r)\n```\n\n"
