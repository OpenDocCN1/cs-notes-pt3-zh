    \ 的最优前缀无关编码的任意一棵树。那么，将 $T'$ 中叶子节点 $z$ 替换为以 $x$ 和 $y$ 为子节点的内部节点而得到的树 $T$，表示 $C$\
    \ 的一个最优前缀无关编码。\n\n（给定字符集 $C$，每一个字符 $c \\in C$ 的频率为 $f[c]$。$x$ 和 $y \\in C$ 有最低频率。从\
