    \ *e*，即 gcd(*e*, *φ(n)*) = 1。\n5. 计算 *d* 为 *e* 模 *φ(n)* 的乘法逆元，即 *e d ≡ 1 (mod\
    \ φ(n))*。\n6. 公布配对 *P = (e, n)* 作为他的 *RSA 公钥*。\n7. 秘密保存配对 *S = (d, n)* 作为他的 *RSA\
    \ 私钥*。\n\n### 为什么 RSA 加密有效\n\n![](img/09c68ab421cfce4995ddad1430ef2637_584_0.png)\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_585_0.png)\n\n### RSA 的正确性\n\n定理 31.36：\n\
    \nS(P(M)) = S(M^e (mod n)) = (M^e (mod n))^d (mod n) = M^{ed} (mod n)\n= M^{1+k\
    \ φ(n)} (mod n) = M M^{k φ(n)} (mod n) = M (M^{(p-1)})^{k(q-1)} (mod n) ... =\
    \ M (mod n)\n\n（根据定理 31.31，费马定理，若 p 为素数，则 M^{(p-1)} ≡ 1 (mod p)）\n\n### RSA 的安全性\n\
    \nS(P(M)) = S(M^e (mod n)) = M^{ed} (mod n) = ... = M\n\n- 如果对 n 进行因式分解很容易，则破解\
    \ RSA 密码系统很容易。\n- 反之，如果对大整数进行因式分解是困难的，则破解 RSA 是困难的，这一说法尚未得到证明。\n- 然而，经过二十多年的研究，尚未找到比对\
    \ n 进行因式分解更容易破解 RSA 公钥密码系统的方法。\n- 事实上，对大整数进行因式分解出奇地困难。\n\n## RSA 挑战数\n\n- 将一个由两个大质数相乘得到的大数分解回来\n\
