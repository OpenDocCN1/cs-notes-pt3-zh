  - '[PAGE 57]


    # 2.3.1 The divide-and-conquer approach


    # properties of loop invariant for MERGE


    ```

    MERGE(A, p, q, r)

    1    n₁ ← q-p+1

    2    n₂ ← r-q

    3    create L[1 .. n₁+1], R[1 .. n₂+1]

    4    for i←1 to n₁

    5      do L[i]←A[p+i-1]

    6    for j←1 to n₂

    7      do R[j]←A[q+j]

    8    L[n₁+1]←∞

    9    R[n₂+1]←∞

    10   i←1

    11   j←1

    12   for k←p to r

    13     do if L[i]≤R[j]

    14         then A[k]←L[i]

    15              i←i+1

    16         else A[k]←R[j]

    17              j←j+1

    ```


    Initialization: prior to the first iteration of the loop, k = p, so that A[p ..
    k-1] is empty. A[p .. k-1] contains 0 samllest elements of L and R, and since
    i=j=1, both L[i] and R[j] are the smallest elements of their arrays that have
    not been copied back into A.


    Maintenance: firstly suppose that L[i]≤R[j]. Because A[p .. k-1] contains the
    k-p smallest elements, after line 14 copies L[i] into A[k], the subarray A[p ..
    k] will contain the k-p+1 smallest elements. If L[i]>R[j], so do that.


    Termination: k=r+1, subarray A[p .. k-1] is A[p .. r], contains r-p+1 smallest
    elements of L[1 .. n₁+1] and R[1 .. n₂+1], in sorted order. All but the two largest
