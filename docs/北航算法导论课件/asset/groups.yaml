    +   - **For $j \ge 2$, two choices**

    +     - through $S_{1,j-1}$, then **directly** to $S_{1,j}$, no transfer time;

    +     - through $S_{2,j-1}$, then **transfer over** to station $S_{1,j}$, transfer
    time $t_{2,j-1}$.

    +     - These two possibilities have much in common.'
