    \ algorithms\n\n### Sorting problem\n\n- Bubble sort: bubbling\n- Insertion sort:\
    \ incremental approach （增量靠近）\n- Merge sort: divide-and conquer （特定位置，分而治之）\n\
    - Quick sort: location （元素定位，分而治之）\n- ......\n- The worst-case running time of\
    \ divide-and-conquer algorithms is much less than that of insertion sort.\n\n\
    ## 2.3.1 The divide-and-conquer approach\n\n- **Divide-and-conquer approach**\n\
    \  （分而治之，各个击破）\n\n**Recursive** : call themselves recursively one or more times\
    \ to deal with closely related subproblems.\n\n- **Divide** the problem into a\
    \ number of subproblems.\n- **Conquer** the subproblems by solving them recursively.\
    \ If the subproblem sizes are small enough, however, just solve the subproblems\
    \ in a straightforward manner.\n- **Combine** the solutions to the subproblems\
    \ into the solution for the original problem.\n\n## 2.3.1 The divide-and-conquer\
    \ approach\n\n- **Merge sort algorithm**\n  - **Divide:** divide the *n*-element\
    \ sequence to be sorted into two subsequences of *n*/2 elements each.\n  - *(Exercise:\
    \ how about four subsequences, n/4 elements each?)*\n  - **Conquer:** merge sort\
    \ the two subsequences recursively.\n  - **Combine:** merge the two sorted subsequences\
    \ to produce the sorted answer.\n\nThe recursion “bottoms out” when the sequence\
    \ to be sorted has length 1, in which case there is no work to be done, since\
