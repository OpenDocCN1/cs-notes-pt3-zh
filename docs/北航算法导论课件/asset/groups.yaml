    # 3.1.1 Θ-notation: asymptotically tight bound


    Θ(g(n)) = {f(n): there exist positive constants c₁, c₂, and n₀ such that 0 ≤ c₁g(n)
    ≤ f(n) ≤ c₂g(n) for all n ≥ n₀}.


    +   - In this chapter, assume that every asymptotic notations are asymptotically
    nonnegative. (设所有的渐近符号为渐近非负)


    +   - Example: How to show that n²/2-3n = Θ(n²)?

    +   We must determine positive constants c₁, c₂, and n₀ such that

