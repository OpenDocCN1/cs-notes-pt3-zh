    \n```\nBtSAT(Γ∈CNF)\nbegin\n    if Γ is an empty formula, then return(Yes);\n\
    \    if Γ contains empty clauses then return(No);\n    Select a variable x from\
    \ Γ\n    if BtSAT(Γ[x/1])=Yes then return(Yes); // Substitute x=1 into Γ\n   \
    \ if BtSAT(Γ[x/0])=Yes then return(Yes); // Substitute x=0 into Γ\n    return(No);\n\
    end\n```"
