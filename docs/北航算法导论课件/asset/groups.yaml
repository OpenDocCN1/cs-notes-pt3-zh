  - '[PAGE 551]


    # Chapter 33: Computational Geometry


    +   - A branch of CS that studies algorithms for solving geometric problems

    +   - Applications

    +     - computer graphics

    +     - robotics

    +     - VLSI(very large-scale integration) design

    +     - computer- aided design

    +     - ...

    +   - Input: a description of a set of geometric objects

    +     - a set of points

    +     - a set of line segments

    +     - the vertices of a polygon in counterclockwise order

    +     - ...

    +   - Output: is often a response to a query about the objects

    +     - whether any of the lines intersect

    +     - some new geometric object, such as the convex hull (smallest enclosing
    convex polygon) ...'
  - '[PAGE 552]


    In this chapter, we look at a few computational-geometry algorithms in two dimensions,
    that is, in the plane.


    Each input object is represented as a set of points {p₁, p₂, p₃, ...}, where each
    pᵢ = (xᵢ, yᵢ) and xᵢ, yᵢ ∈ R. For example, an n-vertex polygon P is represented
    by a sequence p₀, p₁, p₂, ..., pₙ₋₁ of its vertices in order of their appearance
    on the boundary of P.


    ![](img/09c68ab421cfce4995ddad1430ef2637_552_0.png)


    Computational geometry can also be performed in three dimensions, and even in
    higher-dimensional spaces (an application to database), but such problems and
    their solutions can be very difficult to visualize.


    Even in two dimensions, however, we can see a good sample of computational-geometry
    techniques.'
  - '[PAGE 553]


    <!-- no content -->'
  - '[PAGE 554]


    We shall explore the following questions:


    +   1. Given two directed segments $\overrightarrow{p_0p_1}$ and $\overrightarrow{p_0p_2}$,
    is $\overrightarrow{p_0p_1}$ clockwise from $\overrightarrow{p_0p_2}$ with respect
    to their common endpoint $p_0$?

    +   2. Given two line segments $\overrightarrow{p_0p_1}$ and $\overrightarrow{p_1p_2}$,
    if we traverse $\overrightarrow{p_0p_1}$ and then $\overrightarrow{p_1p_2}$, do
    we make a left turn at point $p_1$?

    +   3. Do line segments $\overline{p_1p_2}$ and $\overline{p_3p_4}$ intersect?


    ![](img/09c68ab421cfce4995ddad1430ef2637_554_0.png)


    We can answer each question in O(1) time.


    Moreover, our methods will use only additions, subtractions, multiplications,
    and comparisons. We need neither division nor trigonometric functions, both of
    which can be computationally expensive and prone to problems with round-off error.


    For example, ...'
  - '[PAGE 555]


    We will use only **additions, subtractions, multiplications,** and **comparisons**.
    We need neither division nor trigonometric functions, both of which can be computationally
    expensive and prone to problems with round-off error.


    ![](img/09c68ab421cfce4995ddad1430ef2637_555_0.png)


    For example,


    +   - the "straightforward" method of determining whether two segments **intersect**
    (相交)

    +     - Compute the line equation of the form $y=mx+b$ for each segment ($m$ is
    the **slope** (斜率) and $b$ is the $y$-intercept ($y$ 轴截距)),

    +     - find the point of intersection of the lines (uses division to find the
    point of intersection),

    +     - and check whether this point is on both segments.

    +   - When the segments are nearly parallel, this method is very sensitive to
    the precision of the division operation on real computers.


    $\begin{cases} y=m_1x+b_1 \\ y=m_2x+b_2 \end{cases} \quad\Rightarrow\quad x=\frac{b_2-b_1}{m_1-m_2},\
    y=\frac{m_1b_2-m_2b_1}{m_1-m_2}$


    The method in this section, which avoids division, is much more accurate.'
