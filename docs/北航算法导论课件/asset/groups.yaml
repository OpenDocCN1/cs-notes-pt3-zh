  - "[PAGE 410]\n\n# Step 3: Computing the length of an LCS\n\nX_m = <x₁, x₂, ...,\
    \ x_m>\nY_n = <y₁, y₂, ..., y_n>\n\nc[i, j] = \n{ 0 (if i = 0 or j = 0),\n  c[i-1,\
