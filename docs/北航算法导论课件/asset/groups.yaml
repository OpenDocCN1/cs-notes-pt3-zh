    $$\n\n**证明。** 设 $a$ 和 $b$ 是最优树 $T$ 中深度最大的一对兄弟叶子节点。假设 $f[a] \\le f[b]$ 且 $f[x]\
    \ \\le f[y]$。由于 $f[x]$ 和 $f[y]$ 是两个最低的叶子频率，而 $f[a]$、$f[b]$ 是按顺序排列的任意两个频率，因此 $f[x]\
    \ \\le f[a]$，$f[y] \\le f[b]$。在 $T$ 中交换 $a$ 和 $x$ 的位置得到树 $T'$，再在 $T'$ 中交换 $b$\
