    \n```\n$$c[i,j]=\\begin{cases}0,&\\text{if }i=0\\text{ or }j=0,\\\\c[i-1,j-1]+1,&\\\
    text{if }i,j>0\\text{ and }x_i=y_j,\\\\\\max(c[i-1,j],c[i,j-1]),&\\text{if }i,j>0\\\
    text{ and }x_i\\ne y_j.\\end{cases}\\tag{15.14}$$\n```\n\n```\n$X_m=\\langle x_1,x_2,\\\
    ldots,x_m\\rangle$  \n$Y_n=\\langle y_1,y_2,\\ldots,y_n\\rangle$\n```\n\n+   -\
