  - '[PAGE 311]


    # Step 1: The structure of an optimal BST


    +   - **Cut-and-paste argument applies.**


    If there were a subtree *T′′* whose expected cost is lower than that of *T′*,
    then we could cut *T′* out of *T* and paste in *T′′*, resulting in a binary search
    tree of lower expected cost than *T*, thus contradicting the optimality of *T*.


    ![](img/09c68ab421cfce4995ddad1430ef2637_311_0.png)'
