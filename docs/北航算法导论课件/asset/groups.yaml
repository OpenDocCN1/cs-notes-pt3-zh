  - '[PAGE 84]


    # 2.2.2 Worse-case and average-case analysis


    +   - **We usually concentrate on finding the worst-case running time (the longest
    running time for any input of size *n*).**

    +     - The worst-case running time of an algorithm is an upper bound on the running
    time for any input.

    +     - The worst case occurs fairly often. (in searching a databse) (最坏情况经常发生)

    +     - The “average case” is often roughly as bad as the worst case. (suppose
    that we randomly choose *n* numbers and apply insertion sort.)

    +   - **Average-case or expected running time of an algorithm**

    +     - Probabilistic analysis (Knuth)

    +     - Randomized algorithm'
  - '[PAGE 85]


    # 2.2.3 Order of growth


    # Rate of growth (order of growth, 函数增长率)


    +   - the more simplifying abstraction.

    +   - considering only the leading term of a formula (e.g., $an^2$ of $an^2+bn+c$),
    since the lower-order terms are relatively insignificant for large $n$.

    +   - ignoring the leading term’s constant coefficient, since constant factors
    are less significant than the rate of growth in determining computational efficiency
    for large inputs.


    Thus, the insertion sort has a worst-case running time of Θ(n²)


    +   - Usually, one algorithm is more efficient than another if its worst-case
    running time has a lower order of growth (small inputs exception, e.g., 10n lgn
    vs 2n²).'
  - '[PAGE 86]


    # 2.3 Designing algorithms


    +   - many ways to design algorithms


    # Sorting problem


    +   - Bubble sort: bubbling

    +   - Insertion sort: incremental approach （增量靠近）

    +   - Merge sort: divide-and conquer （特定位置，分而治之）

    +   - Quick sort: location （元素定位，分而治之）

    +   - ......

    +   - The worst-case running time of divide-and-conquer algorithms is much less
    than that of insertion sort.'
  - '[PAGE 87]


    # 2.3.1 The divide-and-conquer approach


    +   - **Divide-and-conquer approach**

    +     （分而治之，各个击破）


    **Recursive** : call themselves recursively one or more times to deal with closely
    related subproblems.


    +   - **Divide** the problem into a number of subproblems.


    +   - **Conquer** the subproblems by solving them recursively. If the subproblem
    sizes are small enough, however, just solve the subproblems in a straightforward
    manner.


    +   - **Combine** the sloutions to the subproblems into the solution for the original
    problem.'
  - '[PAGE 88]


    # 2.3.1 The divide-and-conquer approach


    +   - **Merge sort algorithm**

    +     - **Divide:** divide the *n*-element sequence to be sorted into two subsequences
    of *n*/2 elements each.

    +     - *(Exercise: how about four subsequences, n/4 elements each?)*

    +     - **Conquer:** merge sort the two subsequences recursively.

    +     - **Combine:** merge the two sorted subsequences to produce the sorted answer.


    The recursion “bottoms out” when the sequence to be sorted has length 1, in which
    case there is no work to be done, since every sequence of length 1 is already
    in sorted order.


    ![](img/09c68ab421cfce4995ddad1430ef2637_88_0.png)'
  - '[PAGE 89]


    # 2.3.1 The divide-and-conquer approach


    +   - **MERGE(A,p,q,r):** the key operation of the MERGE sort algorithm, the merging
    of two sorted sequences in the “combine” step.

    +     - *A* is an array and *p, q,* and *r* are indices numbering elements of
    the array such that *p ≤ q < r*.

    +     - The procedure assumes the subarrays *A[p .. q]* and *A[q+1 .. r]* are
    in sorted order. The procedure merges them to form a single sorted subarray that
    replaces the current subarray *A[p .. r]*.

    +     - Working step:


    The procedure takes time Θ(n), n=r-p+1'
