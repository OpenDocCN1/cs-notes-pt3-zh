    \ scan, runs in O(n lgn) time\n- Jarvis's march, runs in O(nh) time, where h is\
    \ the number of vertices of the convex hull.\n- Additional several methods\n \
    \ - incremental method, O(n lg n)\n  - divide-and-conquer method, O(n lg n)\n\
    \  - prune-and-search method, O(n lg h)\n\n## Graham's scan\n\n- By maintaining\
    \ a stack S of candidate points consecutive segments turn left or right\n  - Each\
