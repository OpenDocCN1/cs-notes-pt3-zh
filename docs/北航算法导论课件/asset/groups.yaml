  - '[PAGE 73]


    # 2.1.1 Loop invariants and the correctness of insertion sort


    +   - **Loop invariants**


    **Loop invariant:** At the start of each iteration of **for** loop, the subarray
    *A[1 .. j-1]* consists of the elements originally in *A[1 .. j-1]* but in sorted
    order.


    It can help us to understand why an algorithm is correct.


    +   - **three properties about a loop invariant**

    +     （初值、维持、终值） （初始化、保存、终止）


    +   - **Initialization:** it is true prior to the first iteration of the loop.(base
    case)


    +   - **Maintenance:** if it is true before an iteration of the loop, it remains
    true before the next iteration. (inductive step) ( [i-1] true => [i] true )


    +   - **Termination:** When the loop terminates, the invariant show that the algorithms
    is correct. (stopping the “induction” when the loop terminates; the inductive
    step of mathematical induction is used infinitely. 类似于数学归纳法，但数学归纳法能用于无限情况)


    When the first two properties hold, the loop invariant is true prior to every
    iteration of the loop. It is similar to mathematical induction.'
  - '[PAGE 74]


    # 2.1.1 Loop invariants and the correctness of insertion sort


    +   - three properties hold for insertion sort


    Loop invariant: original A[1 .. j-1] is permuted to A''[1 .. j-1] but in sorted
    order


    +   - Initialization: j=2, A[1 .. j-1] consists of just the single A[1], which
    is the original element in A[1], and is sorted. Obviously, the loop invariant
    holds prior to the first iteration of the loop.


    +   - Maintenance: A''[1 .. j-1] is in sorted order, sorting A[j] into A''[1 ..
    j-1], s.t. <a''₁, a''₂, ..., a''ₖ, aⱼ, a''ₖ₊₁, ..., ..., a''ⱼ₋₁>, obviously, it
    is sorted. The second property holds for the outer loop.


    +   - Termination: when j=n+1. A''[1 .. j-1] = A''[1 .. n] consists of the elements
    originally in A[1 .. n], but in sorted sorder. A''[1 .. n] is the entire array!
    Hence, the algorithm is correct.'
  - '[PAGE 75]


    # 2.1.2 Pseudocode conventions


    +   - Indentation indicates block structure. （缩排）

    +   - The looping constructs (**while**, **for**, **repeat**) and the conditional
    constructs (**if**, **then**, **else**) have interpretations similar to those
    in Pascal, C.

    +   - “//” or “▷” indicates a comment.

    +   - A multiple assignment *i←j←e* is equivalent to *j←e* then *i←j*.

    +   - Variables are local to the given procedure.

    +   - Array elements access: *A[i]*； *A[1..j] = <A[1], A[2],…, A[i]>*

    +   - Compound data are typically organized into objects.

    +   - Parameters are passed to a procedure by value.

    +   - The boolean operators “and” and “or” are short circuiting: for example “*x*
    and (or) *y*”: whether or not evaluate *y* rely on the evaluating of *x*.'
