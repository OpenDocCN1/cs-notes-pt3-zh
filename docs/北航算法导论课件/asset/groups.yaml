  - '[PAGE 485]


    # Polynomials


    A(x) = Σ_{j=0}^{n-1} a_j x^j      x ∈ F, (R, C)


    +   polynomial coefficients : a₀, a₁, ..., aₙ₋₁ ∈ F.


    +   polynomial degree (维数) : A(x) is said to have degree k if its highest nonzero
    coefficient is a_k.


    +   polynomial degree-bound (维界) : any integer strictly greater than the degree.


    +   Therefore, the degree of a polynomial of degree-bound n may be any integer
    between 0 and n-1, inclusive.'
  - '[PAGE 486]


    # Polynomials addition （多项式相加）


    +   - A(x), B(x), degree-bound n

    +   - C(x) = A(x) + B(x), also degree-bound n


    A(x) = Σ_{j=0}^{n-1} a_j x^j  and  B(x) = Σ_{j=0}^{n-1} b_j x^j


    then  C(x) = Σ_{j=0}^{n-1} c_j x^j


    where c_j = a_j + b_j for j = 0, 1, ..., n - 1.

    For example, if the polynomials A(x) = 6x³+7x²-10x+9

    and      B(x) = -2x³+4x-5,

    then      C(x) = 4x³+7x²-6x+4.


    +   - Running time: T(n) = Θ(n)'
  - "[PAGE 487]\n\n# Polynomials multiplication（多项式相乘）\n\n+   - $A(x), B(x)$, degree-bound\
    \ $n$\n+   - $C(x)=A(x)B(x)$, degree-bound $2n-1$\n\nFor example, multiply $A(x)=6x^3+7x^2-10x+9$\
