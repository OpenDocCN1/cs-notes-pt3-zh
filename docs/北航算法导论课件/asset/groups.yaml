    +     （LCS问题具有最优子结构属性）


    +   - Natural classes of subproblems: prefixes

    +     （子问题的自然分类：前缀）

    +     Xᵢ = <x₁, ..., xᵢ>, the i-th prefix of X, for i = 0, 1, ..., m

    +     Yⱼ = <y₁, ..., yⱼ>, the j-th prefix of Y, for j = 0, 1, ..., n


