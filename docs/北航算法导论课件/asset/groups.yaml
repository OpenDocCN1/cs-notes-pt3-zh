    \ T(n) = Θ(n lg n)。\n\n## 4.1.2 细微之处\n\n有时，猜测正确，但归纳中的数学似乎无法成立。\n\n例如  $T(n) =\
    \ T(\\lfloor n/2 \\rfloor) + T(\\lceil n/2 \\rceil) + 1.$\n\n猜测 $T(n)=cn$，则 $T(n)\
