    \n- 分治法\n  - 示例\n  - 划分成更小的问题\n\n![](img/09c68ab421cfce4995ddad1430ef2637_181_0.png)\n\
    \n- 分治法\n  - 示例\n  - 解决小问题并合并\n\n![](img/09c68ab421cfce4995ddad1430ef2637_182_0.png)\n\
    \n- **分治法**\n\n```\nMaxMin(L)\n    if length(L)=1 or 2, we use at most one comparison.\n\
    \    else\n    {\n        split (分裂) L into lists L1 and L2, each of n/2 elements\n\
    \        (min1, max1) = MaxMin(L1)\n        (min2, max2) = MaxMin(L2)\n      \
    \  return (Min(min1, min2), Max(max1, max2))\n    }\n```\n\n**复杂度分析 (比较次数)：**\n\
    \nT(1)=0, T(2)=1,\n\nT(n) = 2T(n/2)+2\n\n= 4T(n/4)+2²+2 = 2³T(n/2³) + 2³+2²+2\
    \ = …\n\n= 2ᵏ·T(n/2ᵏ)+2ᵏ+¹+…+2 = 2ᵏ+¹+2ᵏ+¹+…+2\n\n= 2ᵏ⁻¹+2ᵏ−2 = **3n/2 − 2** （There,\
    \ assume n=2ᵏ, Sₙ=a(1−qⁿ)/(1−q).）\n\n- 明显方法 ($2n-3$) 与 分治法 ($3n/2-2$) 的比较\n\n\
    假设一次比较需要一秒。\n\n| 时间 | $2n-3$ | $3n/2-2$ |\n|---|---:|---:|\n| 1 分钟 | $n=31$ |\
    \ $n=41$ |\n| 1 小时 | $n=1801$ | $n=2401$ |\n| 1 天 | $n=43201$ | $n=57601$ |\n\n\
    # Exam5 多数问题 (多数问题)\n\n- **问题**\n  - 给定一个包含 n 个元素的数组 A，仅使用 “==” 测试来找出 A 中的多数元素\
    \ (出现次数超过 n/2 次)。\n- **例如，给定 (2, 3, 2, 1, 3, 2, 2)，则 2 是多数元素因为 4>7/2。**\n- **平凡解法：**\n\
    \  - 计数 (计数) 为 O(n²)。\n\n```\nMajority(A[1, n])\nfor(i = 1 to n)\n    M = 0\n\
    \    for(j = 1 to n)\n        if (i != j and A[i]==A[j]) M++\n    end\n    if\
    \ (M>n/2) return “A[i] is the majority”\nend\nreturn “No majority”\n```\n\n分治法\n\
    \n```\nMajority(A[1, n])\nif n=1, then\n    return A[1]\nelse\n    m1=Majority(A[1,\
    \ n/2])\n    m2=Majority(A[n/2+1, n])\n    test if m1 or m2 is the majority for\
    \ A[1, n]\n    return majority or no majority.\n```\n\n复杂度分析 (计数)：\nT(n) = 2T(n/2)+O(n)\
    \ = O(nlogn)\n\nA=(2, 1, 3, 2, 1, 5, 4, 2, 5, 2)\n\nf[1] = 2\nf[2] = 4\nf[3] =\
    \ 1\nf[4] = 1\nf[5] = 2\n\n然而，该问题存在线性时间算法。\n\n```\nfor(i=1 to n) ++frequency[\
    \ A[i] ]\nM = Max(frequency( A[j] ))\nif (M > n/2)\n    return \"A[j] is the majority\"\
    \n```\n\n- 故事的寓意 (寓意)？\n\n# 练习\n\n使用一个可以比较 2 个元素重量的天平，求出 n 个元素中的第二重的一个。 （对于一个具有\
    \ n 个元素的数组，用一个天平，通过比较 2 个元素的重量，求出第二重的一个）\n\n尝试给出一个算法，并分析其运行时间。如果使用分治法，如何描述该算法？以及其运行时间？\n\
    \n# 5 概率分析与随机算法\n\n- 解释概率分析与随机算法的区别。\n  （概率分析与随机算法）\n- 介绍指示随机变量的技术。\n  （用指示(器)随机变量来对算法进行概率分析）\n\
