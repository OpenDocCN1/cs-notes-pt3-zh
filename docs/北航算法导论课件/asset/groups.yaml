  - '[PAGE 449]


    # 16.2 Elements of the greedy strategy


    Typical streamlined steps


    +   1. Cast the optimization problem as one in which we make a choice and are
    left with one subproblem to solve.

    +   （最优问题为：做一个选择，留下一个待解的子问题）

    +   2. Prove that there’s always an optimal solution that makes the greedy choice,
