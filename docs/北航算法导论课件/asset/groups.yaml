    \ \\cup \\{z\\}$。除 $f[z] = f[x] + f[y]$ 以外，$f$ 在 $C'$ 中的定义与在 $C$ 中相同。若 $T'$ 为\
    \ $C'$ 的最优前缀无关编码，则 $T$ 为关于 $C$ 的最优前缀无关编码，其中，$T$ 是把 $T'$ 的叶节点 $z$ 替换为以 $x$ 和 $y$\
    \ 作为叶节点的内部节点而得到的。）\n\n![](img/09c68ab421cfce4995ddad1430ef2637_474_0.png)\n\n\
    $C : \\{c_1, \\ldots, c_m, x, y\\}, \\quad C' : \\{c_1, \\ldots, c_m, z\\}, \\\
