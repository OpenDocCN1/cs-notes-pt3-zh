    \n((A₁(A₂ A₃)) ((A₄ A₅) A₆))\n```\n\n## 练习\n\n使用代入法证明递推式 (15.11) 的解为 $\\Omega(2^n)$。\n\
    \n$$P(n)=\\begin{cases}1, & \\text{如果 } n=1,\\\\\\displaystyle\\sum_{k=1}^{n-1}P(k)P(n-k),\
    \ & \\text{如果 } n\\ge 2.\\end{cases}\\tag{15.11}$$\n\n### 解答\n\n我们需要 $P(n) \\\
    ge c \\cdot 2^{n}$。\n\n$P(k) \\ge c \\cdot 2^{k} \\Rightarrow$\n\n$P(n) = \\sum_{k=1}^{n-1}\
    \ P(k)P(n-k)$\n\n$\\ge \\sum_{k=1}^{n-1} c \\cdot 2^{k} \\cdot c \\cdot 2^{n-k}\
    \ = \\sum_{k=1}^{n-1} c^{2} \\cdot 2^{n} = (n-1) \\cdot c^{2} \\cdot 2^{n}$\n\n\
    $\\ge c \\cdot 2^{n}$  （若 $(n-1) \\cdot c^{2} \\ge c$，即 $c \\ge \\dfrac{1}{n-1}$）\n\
    \n## 15 动态规划\n\n- 两条汽车装配线的调度\n  - （流水线、装配线调度）\n- 矩阵链乘法\n  - （矩阵链相乘，或矩阵连乘问题）\n\
    - 动态规划的特征\n  - （动态规划法的特征）\n- 最长公共子序列 （最长相同子序列）\n- **最优二叉搜索树** （最优二叉搜索树）\n\n###\
    \ 15.5 最优二叉搜索树\n\n- 设计一个将英文文本翻译成中文的程序\n  （例如自动翻译机）\n\n![](img/09c68ab421cfce4995ddad1430ef2637_298_0.png)\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_298_1.png)\n\n**生词表**\n\n| 字段1 | 字段2\
    \ |\n|---|---|\n| aggregate analysis | 综合分析;总体分析 |\n| amortized | *** |\n| arbitrary\
    \ | 任意的, 武断的, 独裁的, 专断的 |\n| auxiliary | *** |\n| binomial | 二项的, 二项式的 |\n| bog\
    \ | 沼泽, 陷于泥沼 |\n| contemporary | 当代的, 同时代的 |\n| convention | 归约, 常规 |\n| crucial\
    \ | 至关重要的 |\n| disjoint | 不相交的,不相接的,分离的 |\n| distinct | 清楚的, 明显的, 截然不同的, 独特的 |\n\
    \n### 15.5 最优二叉搜索树\n\n- 需要使搜索所花费的总时间尽可能低。\n- 单词出现的频率各不相同。\n- 可能出现这样的情况：“algorithm”（常用）离根很远；“mycophagist”（不常用，食菌者）离根很近。\n\
    - （高频出现的单词出现在远离树根的节点，......）\n- 这样的组织方式会拖慢翻译速度，因为在 BST 中搜索一个键所访问的节点数为“包含该键的节点的深度加\
    \ 1”（1+depth）。\n- 我们希望文本中频繁出现的单词位于更靠近根的位置。\n\n![](img/09c68ab421cfce4995ddad1430ef2637_301_0.png)\n\
    \n### 15.5 最优二叉搜索树\n\n- 给定按升序排列的 $n$ 个互异键的序列 $K=\\langle k_1,k_2,\\ldots,k_n\\\
    rangle$（$k_1<k_2<\\cdots<k_n$），如何构建一棵 BST？\n  - 对于每个键 $k_i$，搜索概率为 $p_i$（它也可以是\
    \ $k_i$ 在文本中出现的次数 $I$，文本总词数为 $M$，则 $p_i=I/M$。）\n  - 有些值不在 $K$ 中，设有 $n+1$ 个“伪关键字”\
    \ $d_0,d_1,\\ldots,d_n$\n  - $d_0$ 代表所有小于 $k_1$ 的值；$d_n$ 代表所有大于 $k_n$ 的值\n  -\
    \ 对于 $1\\le i\\le n-1$，$d_i$ 满足 $k_i<d_i<k_{i+1}$，搜索概率为 $q_i$\n  - 图：每个键 $k_i$\
    \ 是一个内部节点；$d_i$ 是一个叶节点\n\n![](img/09c68ab421cfce4995ddad1430ef2637_303_0.png)\n\
    \n| $i$ | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---:|---:|---:|---:|---:|---:|\n| $p_i$\
    \ |  | 0.15 | 0.10 | 0.05 | 0.10 | 0.20 |\n| $q_i$ | 0.05 | 0.10 | 0.05 | 0.05\
    \ | 0.05 | 0.10 |\n\n### 15.5 最优二叉搜索树\n\n- 每次搜索要么成功，要么不成功，因此有\n\n$$\\sum_{i=1}^{n}\
    \ p_i + \\sum_{i=0}^{n} q_i = 1 \\quad (15.15)$$\n\n- 有了每个（伪）关键字的搜索概率，我们就可以确定给定\
    \ BST $T$ 中一次搜索的期望代价。\n\n- 假设一次搜索的实际代价是检查的节点数。那么在 $T$ 中一次搜索的期望代价为\n\n$$\\mathrm{E}[\\\
    text{在 }T\\text{ 中的搜索代价}]=\\sum_{i=1}^{n}(\\text{depth}_T(k_i)+1)\\cdot p_i +\
    \ \\sum_{i=0}^{n}(\\text{depth}_T(d_i)+1)\\cdot q_i$$\n\n$$=1+\\sum_{i=1}^{n}\\\
    text{depth}_T(k_i)\\cdot p_i + \\sum_{i=0}^{n}\\text{depth}_T(d_i)\\cdot q_i,\
    \ \\quad (15.16)$$\n\n其中 $\\text{depth}_T$ 表示节点在树 $T$ 中的深度。\n\n"
