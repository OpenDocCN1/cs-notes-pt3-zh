  md: "\n## 34.4 RSA encryption\n\n### Encryption in a public key system\n\n![](img/09c68ab421cfce4995ddad1430ef2637_582_0.png)\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_582_1.png)\n\n### RSA public-key cryptosystem\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_583_0.png)\n\n1. Select at random two\
    \ large prime numbers *p* and *q* such that *p* ≠ *q*. The primes *p* and *q*\
    \ might be, say, 512 bits each, 1024 bits, or more.\n2. Compute *n* by the equation\
    \ *n = p q*.\n3. Let *φ(n) = (p - 1)(q - 1)*.\n4. Select a small odd integer *e*\
    \ that is relatively prime to *φ(n)*, i.e., gcd(*e*, *φ(n)*) = 1.\n5. Compute\
    \ *d* as the multiplicative inverse of *e*, modulo *φ(n)*, i.e., *e d ≡ 1 (mod\
    \ φ(n))*.\n6. Publish the pair *P = (e, n)* as his *RSA public key*.\n7. Keep\
    \ secret the pair *S = (d, n)* as his *RSA secret key*.\n\n### Why is RSA encryption\
    \ effective\n\n![](img/09c68ab421cfce4995ddad1430ef2637_584_0.png)\n\n![](img/09c68ab421cfce4995ddad1430ef2637_585_0.png)\n\
    \n### RSA is correct\n\nTheorem 31.36:\n\nS(P(M)) = S(M^e (mod n)) = (M^e (mod\
    \ n))^d (mod n) = M^{ed} (mod n)\n= M^{1+k φ(n)} (mod n) = M M^{k φ(n)} (mod n)\
    \ = M (M^{(p-1)})^{k(q-1)} (mod n) ... = M (mod n)\n\n(by Theorem 31.31, Fermat’s\
    \ Theorem, if p is prime, M^{(p-1)} ≡ 1 (mod p))\n\n### RSA is secure\n\nS(P(M))\
    \ = S(M^e (mod n)) = M^{ed} (mod n) = ... = M\n\n- If factoring n is easy, breaking\
    \ the RSA cryptosystem is easy.\n- Conversely, that if factoring large integers\
