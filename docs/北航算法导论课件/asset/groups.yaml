  - "[PAGE 269]\n\n# Counting the number of parenthesizations\n\nA₁ A₂ A₃ A₄ A₅ :\
    \ (A₁ A₂ A₃)(A₄ A₅)?   (A₁ A₂)(A₃ A₄ A₅)? ……\nA₁(A₂ A₃)?   (A₁ A₂)A₃?\n\n+   Brute\
    \ force, exhaustively checking all possible parenthesizations.\n\n+   P(n): the\
    \ # of alternative parenthesizations of n matrices.\n+   （令P(n)表示 n 个矩阵连乘时所有可能的全括号方式的个数）\n\
    \n+   n=1, one matrix, one way to parenthesize the matrix product.\n\n+   n≥2,\
    \ product of two fully parenthesized matrix subproducts, and the split between\
    \ the two subproducts may occur between the kth and (k+1)st matrices for any k\
    \ = 1, 2, ..., n-1. Thus,\n+   （n≥2, 矩阵连乘全括号的积是两个‘全括号子矩阵之积’的积。两个全括号子矩阵的分隔位置在A_k和A_{k+1}之间）\n\
    \nP(n) = { 1 , if n = 1,\n         Σ_{k=1}^{n-1} P(k)P(n−k), if n ≥ 2. }  (15.11)\n\
    \n+   The solution to the recurrence (15.11) is Ω(2ⁿ), a poor strategy."
