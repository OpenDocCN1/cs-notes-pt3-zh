    \ d_T(y) = d_{T'}(z) + 1$，我们有\n\n$$\nf[x]d_T(x) + f[y]d_T(y) = (f[x] + f[y])(d_{T'}(z)\
    \ + 1) = f[z]d_{T'}(z) + (f[x] + f[y]),\n$$\n\n由此可得\n\n$$\nB(T) = B(T') + f[x]\
    \ + f[y].\n$$\n\n其中\n\n$$\nB(T) = \\sum_{c \\in C-\\{x,y\\}} f[c]d_T(c) + f[x]d_T(x)\
    \ + f[y]d_T(y), \\qquad\nB(T') = \\sum_{c \\in C-\\{x,y\\}} f[c]d_{T'}(c) + f[z]d_{T'}(z).\n\
