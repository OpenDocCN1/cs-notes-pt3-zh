    \ and Y.\n3. If xₘ ≠ yₙ, then zₖ ≠ yₙ ⇒ Z is an LCS of X and Yₙ₋₁.\n\n## Step\
    \ 1: Characterizing an LCS\n\n![](img/09c68ab421cfce4995ddad1430ef2637_403_0.png)\n\
