    \ \\Phi_{i-1}$\n\n$= 1 + (2\\cdot num_i - size_i) - (2\\cdot num_{i-1} - size_{i-1})$\n\
    \n$= 1 + (2\\cdot num_i - size_i) - (2(num_i-1) - size_i)$\n\n$= 3$.\n\n```\n\
    TABLE-EXPANSION(T, n)\n    T = NULL\n    for j = 1 to n\n        TABLE-INSERT(T,\
    \ x)\n```\n\n| No. | Cost | T |\n|---:|---:|:---|\n| 1 | 1 | ■ |\n| 2 | 2 | ■\
    \ ■ |\n| 3 | 3 | ■ ■ ■ ▪ |\n| 4 | 1 | ■ ■ ■ ■ |\n| 5 | 5 | ■ ■ ■ ■ ■ ▧ ▧ ▧ |\n\
