    # 5.3 Randomized algorithms


    # 5.3.1 The hiring problem


    For the hiring problem, the algorithm is deterministic.


    +   For any given input, the number of times we hire a new office assistant will
    always be the same. (给定输入，则雇佣的人数确定)


    +   The number of times we hire a new office assistant depends only on the input.
    (雇佣的人数〔资源消耗〕依赖于输入)


    +   Some rank orderings will always produce a high hiring cost. Example: <1,2,3,4,5,6>,
    where each is hired.


    +   Some will always produce a low hiring cost. Example: <6,*,*,*,*,*>, where
    only the first is hired.


    +   Some may be in between.


    ![](img/09c68ab421cfce4995ddad1430ef2637_213_0.png)'
  - '[PAGE 214]


    # 5.3.1 The hiring problem


    Instead of always interviewing the candidates in the order presented, what if
    we first randomly permuted this order.


    +   - The randomization is now in the algorithm, not in the input distribution.
    （随机化过程在算法中，而不是在输入中体现）

    +   - Given a particular input, we can no longer say what its hiring cost will
    be. Each time we run the algorithm, we can get a different hiring cost. （算法的运行时间与输入无关）

    +   - No particular input always elicits worst-case behavior. （算法的最坏运算时间不取决于特定的输入）

    +   - Bad behavior occurs only if we get “unlucky” numbers from the random-number
    generator. （只有当随机数产生器产生很不幸的数时，算法的运算时间最坏）'
