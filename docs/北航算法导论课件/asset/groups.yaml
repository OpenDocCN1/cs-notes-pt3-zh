    \n![](img/09c68ab421cfce4995ddad1430ef2637_564_0.png)\n\n计算 n 个点的凸包的一些算法：\n\n\
    - Graham's scan，运行时间为 O(n lgn)\n- Jarvis's march，运行时间为 O(nh)，其中 h 为凸包的顶点数。\n-\
