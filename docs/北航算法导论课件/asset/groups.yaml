  - "[PAGE 151]\n\n# 4.1.3 Avoiding pitfalls (陷阱)\n\n+   - It is easy to err in the\
    \ use of asymptotic notation.\n\nFor example, in the recurrence (4.4)\n\n```\n\
    T(n) = 2T(⌊n / 2⌋) + n      (4.4)\n```\n\nwe can falsely prove T(n) = O(n) by\
    \ guessing T(n) ≤ cn and then arguing\n\n```\nT(n) = 2T(⌊n / 2⌋) + n ≤ 2(c⌊n /\
    \ 2⌋) + n\n    ≤ cn + n\n    = O(n),      ← wrong!!!\n```\n\nsince c is a constant.\
    \ The error is that we haven't proved the exact form of the inductive hypothesis,\
    \ that is, that T(n) ≤ cn."
  - '[PAGE 152]


    # 4.1.4 Changing variables


    +   - **algebraic manipulation**: sometimes solute an unknown recurrence similar
    to one you have seen before.


    Example, $T(n) = 2T(\lfloor\sqrt{n}\rfloor) + \lg n$,


    which looks difficult. Simplify the recurrence with a **change of variables**.
    For convenience, we shall not worry about rounding off values, such as $\sqrt{n}$,
    to be integers.


    Let $m = \lg n$, then $T(2^m) = 2T(2^{m/2}) + m$.


    Thus rename $S(m) = T(2^m)$ => $S(m) = 2S(m/2) + m$,


    which is very much like recurrence (4.4) and has the same solution: $S(m) = O(m
    \lg m)$. Changing back from $S(m)$ to $T(n)$, we obtain $T(n) = T(2^m) = S(m)
    = O(m \lg m) = O(\lg n \lg \lg n)$.'
  - "[PAGE 153]\n\n# 4.2  The iteration method\n\n+   - **Substitution:** It is difficult\
    \ to come up with a good guess\n+   - **The iteration method**\n+     - doesn't\
    \ require us to guess the answer\n+     - may require more **algebra**（迭代法对代数能力的要求较高）\n\
    +     - to **expand (iterate)** the recurrence and express it as a **summation\
    \ of terms**, and the initial conditions\n+     - to **evaluate summations.**（不断迭代展开为级数，并求和）\n\
    \n**For example,**  \\(T(n)=3T(\\lfloor n/4\\rfloor)+n\\)\n\n```\n\\[\n\\begin{aligned}\n\
    T(n) &= n + 3T(\\lfloor n/4\\rfloor) \\\\\n     &= n + 3\\left(\\lfloor n/4\\\
    rfloor + 3T(\\lfloor n/16\\rfloor)\\right) \\\\\n     &= n + 3\\left(\\lfloor\
    \ n/4\\rfloor + 3\\left\\lfloor n/16\\right\\rfloor + 3T(\\lfloor n/64\\rfloor)\\\
    right) \\\\\n     &= n + 3\\lfloor n/4\\rfloor + 9\\lfloor n/16\\rfloor + 27T(\\\
    lfloor n/64\\rfloor)\n\\end{aligned}\n\\]\n```"
  - '[PAGE 154]


    # 4.2 The iteration method


    T(n) = n + 3T(⌊n / 4⌋) = n + 3(⌊n / 4⌋ + 3T(⌊n / 16⌋))

    = n + 3(⌊n / 4⌋ + 3(⌊n / 16⌋ + 3T(⌊n / 64⌋)))

    = n + 3⌊n / 4⌋ + 9⌊n / 16⌋ + 27T(⌊n / 64⌋),


    +   How far must we iterate the recurrence?


    +   The i-th term in the series is 3^i T(⌊n / 4^i⌋).


    +   The iteration halts when ⌊n / 4^i⌋ = 1. By continuing the iteration until
    this point and using the bound ⌊n / 4^i⌋ ≤ n / 4^i, we get a decreasing geometric
    series:


    T(n) ≤ n + 3n / 4 + 9n / 16 + 27n / 64 + ⋯ + 3^i T(n / 4^i)

