  mdcn: "\n\n## 3.1.7 函数比较\n\n- **Reflexivity（自反性）**\n  $f(n) = \\Theta(f(n))$,\n\
    \  $f(n) = O(f(n))$,\n  $f(n) = \\Omega(f(n))$.\n\n- **Symmetry（对称性）**\n  $f(n)\
    \ = \\Theta(g(n))$ if and only if $g(n) = \\Theta(f(n))$.\n\n- **Transpose symmetry（反对称性）**\n\
    \  $f(n) = O(g(n))$ if and only if $g(n) = \\Omega(f(n))$,\n  $f(n) = o(g(n))$\
    \ if and only if $g(n) = \\omega(f(n))$.\n\n- An analogy between the asymptotic\
    \ comparison of two functions and the comparison of two real numbers\n\n  （函数渐近性比较与实数比较的类比）\n\
    \n  $f(n) = o(g(n)) \\leftrightarrow f(n) < g(n) \\leftrightarrow a < b$,\n\n\
    \  $f(n) = O(g(n)) \\leftrightarrow f(n) \\le g(n) \\leftrightarrow a \\le b$,\n\
    \n  $f(n) = \\Theta(g(n)) \\leftrightarrow f(n) = g(n) \\leftrightarrow a = b$,\n\
    \n  $f(n) = \\Omega(g(n)) \\leftrightarrow f(n) \\ge g(n) \\leftrightarrow a \\\
    ge b$,\n\n  $f(n) = \\omega(g(n)) \\leftrightarrow f(n) > g(n) \\leftrightarrow\
    \ a > b$.\n\n- One property of real numbers, does not carry over to asymptotic\
    \ notation\n  - Trichotomy (三分法) : any two real numbers $a$ and $b$, one of the\
    \ following must holds: $a<b$, $a=b$, or $a>b$.\n  - Not all functions are asymptotically\
    \ comparable. That is, for two functions $f(n)$ and $g(n)$, it may be the case\
    \ that neither $f(n)=O(g(n))$ nor $f(n)=\\Omega(g(n))$ holds.\n\n  For example,\
    \ the functions $n$ and $n^{1+\\sin n}$ cannot be compared using asymptotic notation.\n\
