  mdcn: "\n\n## 17.3 势能法\n\n- 摊还分析中的势能法将预付的工作表示为“势能”（potential），这些势能可以在未来释放以支付操作代价。\n\
    - 我们将势能与整个数据结构（DS）相关联，而不是与数据结构中的特定对象相关联。\n- 势能法的运作方式如下：\n  - 我们将执行 n 个操作，从初始数据结构\
    \ D₀ 开始。\n  - cᵢ：第 i 个操作的实际代价（i = 1, 2, ..., n）。\n  - Dᵢ：对数据结构 Dᵢ₋₁ 应用第 i 个操作后得到的数据结构。\n\
    \  - Φ：势能函数 Φ 将每个数据结构 Dᵢ 映射为一个实数 Φ(Dᵢ)，即与数据结构 Dᵢ 相关联的势能。\n- 关于势能函数 Φ，第 i 个操作的摊还代价\
    \ ĉᵢ 定义为\n\n  ĉᵢ = cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁)\n- n 个操作的总摊还代价为\n\n  ∑ᵢ₌₁ⁿ ĉᵢ = ∑ᵢ₌₁ⁿ\
    \ (cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁))\n\n  = ∑ᵢ₌₁ⁿ cᵢ + Φ(Dₙ) − Φ(D₀)。\n\n- 关于势能函数 $\\Phi$，第\
    \ $i$ 个操作的摊还代价 $\\widehat{c}_i$ 定义为\n\n  $$\\widehat{c}_i = c_i + \\Phi(D_i) -\
    \ \\Phi(D_{i-1})$$\n- $n$ 个操作的总摊还代价为\n\n  $$\\sum_{i=1}^{n} \\widehat{c}_i = \\\
    sum_{i=1}^{n} (c_i + \\Phi(D_i) - \\Phi(D_{i-1}))$$\n\n  $$= \\sum_{i=1}^{n} c_i\
    \ + \\Phi(D_n) - \\Phi(D_0).$$\n- 我们通常定义 $\\Phi(D_0)$ 为 0，然后证明对所有 $i$ 都有 $\\Phi(D_i)\
    \ \\ge 0$。\n- 不同的势能函数可能会产生不同的摊还代价。\n\n### 17.3 势能法——栈操作\n\n- 关于势能函数 $\\Phi$，第\
    \ $i$ 个操作的摊还代价 $\\hat{c}_i$ 定义为\n\n  $$\\hat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1})$$\n\
    \n- $n$ 个操作的总摊还代价为\n\n  $$\\sum_{i=1}^{n} \\hat{c}_i = \\sum_{i=1}^{n} (c_i +\
    \ \\Phi(D_i) - \\Phi(D_{i-1}))$$\n\n  $$= \\sum_{i=1}^{n} c_i + \\Phi(D_n) - \\\
    Phi(D_0).$$\n\n- 我们定义栈的势能函数 $\\Phi$ 为栈中对象的数量。\n  - 对于起始的空栈 $D_0$，我们有 $\\Phi(D_0)=0$\n\
    \  - 第 $i$ 次操作后，对于栈 $D_i$，$\\Phi(D_i) \\ge 0$？\n\n- 如果对包含 $s$ 个对象的栈执行的第 $i$ 个操作是\
    \ PUSH（压入）操作，则势能差为 $\\Phi(D_i) - \\Phi(D_{i-1}) = (s+1) - s = 1.$\n\n- 该 PUSH（压入）操作的摊还代价为\n\
    \n  $$\\hat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1}) = 1 + 1 = 2.$$\n\n### 17.3\
    \ 势能法——二进制计数器递增\n\n- 我们将第 i 次 INCREMENT（递增）操作后计数器的势能 Φ 定义为 b_i，即第 i 次操作后计数器中 1\
    \ 的个数。（第i次操作后，势函数b_i为计数器中1的个数）\n- 假设第 i 次 INCREMENT（递增）操作重置了 t_i 个位（从 1 变为 0）。因此，该操作的实际代价至多为\
    \ t_i+1，因为除了重置 t_i 个位之外，它至多将一个位设为 1。\n  - 如果 b_i = 0，则第 i 次操作重置了全部 k 个位，因此 b_{i-1}\
    \ = t_i = k。\n  - 如果 b_i > 0，则 b_i = b_{i-1} - t_i + 1。（t_i 个1变为0，1个0变为1）\n  -\
    \ 无论哪种情况，b_i ≤ b_{i-1} - t_i + 1，因此势能差为 Φ(D_i) - Φ(D_{i-1}) ≤ (b_{i-1} - t_i +\
    \ 1) - b_{i-1} = 1 - t_i。\n- 因此摊还代价为\n\n  ĉ_i = c_i + Φ(D_i) - Φ(D_{i-1}) ≤ (t_i\
    \ + 1) + (1 - t_i) = 2。\n\n- 我们将第 i 次 INCREMENT（递增）操作后计数器的势能 Φ 定义为 b_i，即第 i 次操作后计数器中\
    \ 1 的个数。（第i次操作后，势函数b_i为计数器中1的个数）\n\n- 因此摊还代价为\n  $\\hat{c}_i = c_i + Φ(D_i) -\
    \ Φ(D_{i-1}) \\le (t_i + 1) + (1 - t_i) = 2$。\n\n- 因此，COUNTER 的最坏情况代价为 O(n)？\n\
    \n```\nCOUNTER(A, n)\n    A = 0\n    for j ← 1 to n\n        INCREMENT(A)\n```\n\
    \n```\nINCREMENT(A)\n1   i = 0\n2   while i < A.length and A[i] == 1\n3      \
    \ A[i] = 0\n4       i = i + 1\n5   if i < A.length\n6       A[i] = 1\n```\n\n\
    | 计数器值 | A[7] | A[6] | A[5] | A[4] | A[3] | A[2] | A[1] | A[0] | 总代价 |\n|---|---|---|---|---|---|---|---|---|---|\n\
