  md: "\n## 4.1.3 Avoiding pitfalls (陷阱)\n\n- It is easy to err in the use of asymptotic\
    \ notation.\n\nFor example, in the recurrence (4.4)\n\n$$\nT(n) = 2T(\\lfloor\
    \ n/2 \\rfloor) + n \\tag{4.4}\n$$\n\nwe can falsely prove $T(n) = O(n)$ by guessing\
    \ $T(n) \\le cn$ and then arguing\n\n$$\n\\begin{aligned}\nT(n) &= 2T(\\lfloor\
    \ n/2 \\rfloor) + n \\\\\n     &\\le 2(c\\lfloor n/2 \\rfloor) + n \\\\\n    \
    \ &\\le cn + n \\\\\n     &= O(n), \\quad \\leftarrow \\text{wrong!!!}\n\\end{aligned}\n\
    $$\n\nsince $c$ is a constant. The error is that we haven't proved the exact form\
    \ of the inductive hypothesis, that is, that $T(n) \\le cn$.\n\n## 4.1.4 Changing\
    \ variables\n\n- **algebraic manipulation**: sometimes solve an unknown recurrence\
    \ similar to one you have seen before.\n\nExample, $T(n) = 2T(\\lfloor\\sqrt{n}\\\
    rfloor) + \\lg n$, which looks difficult. Simplify the recurrence with a **change\
    \ of variables**. For convenience, we shall not worry about rounding off values,\
    \ such as $\\sqrt{n}$, to be integers.\n\nLet $m = \\lg n$, then $T(2^m) = 2T(2^{m/2})\
    \ + m$.\n\nThus rename $S(m) = T(2^m)$, so $S(m) = 2S(m/2) + m$, which is very\
    \ much like recurrence (4.4) and has the same solution: $S(m) = O(m \\lg m)$.\
    \ Changing back from $S(m)$ to $T(n)$, we obtain $T(n) = T(2^m) = S(m) = O(m \\\
    lg m) = O(\\lg n \\lg \\lg n)$.\n\n## 4.2 The iteration method\n\n- **Substitution:**\
    \ It is difficult to come up with a good guess.\n- **The iteration method**\n\
    \  - doesn't require us to guess the answer\n  - may require more **algebra**（迭代法对代数能力的要求较高）\n\
    \  - to **expand (iterate)** the recurrence and express it as a **summation of\
    \ terms**, and the initial conditions\n  - to **evaluate summations.**（不断迭代展开为级数，并求和）\n\
    \n**For example,** $T(n) = 3T(\\lfloor n/4 \\rfloor) + n$\n\n$$\n\\begin{aligned}\n\
