    # Step 2: A recursive solution


    +   - When j ≥ i, select a root k_r from among k_i , ..., k_j , and then make
    an optimal BST with keys k_i , ..., k_{r-1} its left subtree and an optimal BST
    with keys k_{r+1} , ..., k_j its right subtree.


    ![](img/09c68ab421cfce4995ddad1430ef2637_315_0.png)


