    odd,  A^{[1]}(x) = a₁ + a₃x + a₅x² + ... + aₙ₋₁xⁿ/²⁻¹.\n\n(2)\nA(x) = A^{[0]}(x²)\
    \ + x A^{[1]}(x²)\n\n(4)\nDFT(a₀, a₁, ⋯, aₙ₋₁) = A(ωₙᵏ), k = 0, 1, ⋯, n−1\nDFT(a₀,\
    \ a₂, ⋯, aₙ₋₂) = A^{[0]}(ωₙ/₂ᵏ), k = 0, 1, ⋯, n/2−1\nDFT(a₁, a₃, ⋯, aₙ₋₁) = A^{[1]}(ωₙ/₂ᵏ),\
    \ k = 0, 1, ⋯, n/2−1\n\n(3)\nωₙᵏ          (ωₙᵏ)² = ωₙ/₂ᵏ\nA(ωₙᵏ)      = A^{[0]}(ωₙ/₂ᵏ)\
    \ + (ωₙᵏ)·A^{[1]}(ωₙ/₂ᵏ),\nA(ωₙ^{n/2 + k}) = A^{[0]}(ωₙ/₂ᵏ) − (ωₙᵏ)·A^{[1]}(ωₙ/₂ᵏ),\n\
    k = 0, 1, ..., n/2 − 1\n\n```\nfor k = 0 to n/2 − 1\n    t = ω yₖ^{[1]}\n    yₖ\
    \ = yₖ^{[0]} + t\n    yₖ₊(n/2) = yₖ^{[0]} − t\n    ω = ω ωₙ\n```\n\n![](img/09c68ab421cfce4995ddad1430ef2637_547_0.png)"
