    \ 必定表示字母表 $C$ 的一个最优前缀无关编码。\n\n![](img/09c68ab421cfce4995ddad1430ef2637_476_1.png)\n\
    \n### 定理 16.4\n\n过程 HUFFMAN 产生一个最优前缀无关编码。\n\n**证明。** 由引理 16.2（每一次选择是贪婪的、是正确的）和引理\
