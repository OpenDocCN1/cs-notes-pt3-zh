    \n## 2.1.1 循环不变量和插入排序的正确性\n\n- **循环不变量**\n\n**循环不变量：** 在 **for** 循环的每次迭代开始时，子数组\
    \ *A[1 .. j-1]* 由 *A[1 .. j-1]* 中原本的元素组成，但已按排序顺序排列。\n\n它可以帮助我们理解为什么算法是正确的。\n\n\
    - **关于循环不变量的三个属性**\n  - （初值、维持、终值）（初始化、保存、终止）\n\n- **初始化：** 在循环的第一次迭代之前它是成立的。(base\
    \ case)\n\n- **维护：** 如果在循环的一次迭代之前它是成立的，则在下一次迭代之前仍然成立。(inductive step)（ [i-1] true\
    \ => [i] true ）\n\n- **终止：** 当循环终止时，不变量表明算法是正确的。(stopping the “induction” when\
    \ the loop terminates; the inductive step of mathematical induction is used infinitely.\
    \ 类似于数学归纳法，但数学归纳法能用于无限情况)\n\n当前两个属性成立时，循环不变量在循环的每次迭代之前都为真。它类似于数学归纳法。\n\n"
