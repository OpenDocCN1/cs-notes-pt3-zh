    \ denotes an upper bound that is not asymptotically tight. Formally, define o(g(n))\
    \ as the set\n\n（非渐近紧的上界）\n\no(g(n)) = {f(n): for any positive constants c>0,\
    \ there exits a constant n₀>0 such that 0≤f(n)<c g(n) for all n≥n₀}.\n\nFor example,\
    \ 2n=o(n²), but 2n²≠o(n²).\n\n## 3.1.5 o-notation: upper bound but not asymptotically\
    \ tight\n\no(g(n)) = {f(n): for any positive constants c>0, there exits a constant\
    \ n₀>0 such that 0≤f(n)<c g(n) for all n≥n₀}.\n\n- The definitions of O-notation\
    \ and o-notation are similar.\n- The main difference\n  - In f(n)=O(g(n)), the\
    \ bound 0≤f(n)≤c g(n) holds for some constant c>0\n  - In f(n)=o(g(n)), the bound\
    \ 0≤f(n)<c g(n) holds for all constant c>0\n- Intuitively, in the o-notation,\
    \ the function f(n) becomes insignificant relative to g(n) as n approaches infinity;\
    \ that is\n\nlimₙ→∞ f(n)/g(n) = 0\n\n## 3.1.6 ω-notation: lower bound but not\
