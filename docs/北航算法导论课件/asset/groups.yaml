    +     - ...\n+   - 输入：几何对象集合的描述\n+     - 一组点\n+     - 一组线段\n+     - 按逆时针顺序的多边形的顶点\n\
    +     - ...\n+   - 输出：通常是对对象的一个查询的响应\n+     - 任意两条线是否相交\n+     - 某个新的几何对象，例如凸包（最小包围凸多边形）...\n\
    \n在本章中，我们将研究二维，即平面上的一些计算几何算法。\n\n每个输入对象表示为一组点 {p₁, p₂, p₃, ...}，其中每个 pᵢ = (xᵢ,\
    \ yᵢ) 且 xᵢ, yᵢ ∈ R。例如，n 个顶点的多边形 P 由其边界上出现的顺序的顶点序列 p₀, p₁, p₂, ..., pₙ₋₁ 表示。\n\n\
    ![](img/09c68ab421cfce4995ddad1430ef2637_552_0.png)\n\n计算几何也可以在三维中进行，甚至在更高维空间中进行（数据库的一个应用），但此类问题及其解可能很难可视化。\n\
    \n即使在二维中，我们也可以看到计算几何技术的良好样本。\n\n我们将探讨以下问题：\n\n+   1. 给定两个有向线段 $\\overrightarrow{p_0p_1}$\
    \ 和 $\\overrightarrow{p_0p_2}$，$\\overrightarrow{p_0p_1}$ 相对于它们的公共端点 $p_0$ 是否在\
    \ $\\overrightarrow{p_0p_2}$ 的顺时针方向？\n+   2. 给定两条线段 $\\overrightarrow{p_0p_1}$\
    \ 和 $\\overrightarrow{p_1p_2}$，如果我们遍历 $\\overrightarrow{p_0p_1}$ 然后遍历 $\\overrightarrow{p_1p_2}$，我们在点\
    \ $p_1$ 处是否左转？\n+   3. 线段 $\\overline{p_1p_2}$ 和 $\\overline{p_3p_4}$ 是否相交？\n\n\
    ![](img/09c68ab421cfce4995ddad1430ef2637_554_0.png)\n\n我们可以每个问题在 O(1) 时间内回答。\n\
    \n而且，我们的方法只使用加法、减法、乘法和比较。我们既不需要除法也不需要三角函数，两者都可能计算成本高且容易出现舍入误差问题。\n\n例如，...\n\n\
    我们只使用 **加法、减法、乘法** 和 **比较**。我们既不需要除法也不需要三角函数，两者都可能计算成本高且容易出现舍入误差问题。\n\n![](img/09c68ab421cfce4995ddad1430ef2637_555_0.png)\n\
    \n例如，\n\n+   - 确定两条线段是否 **相交**（相交）的“直接”方法\n+     - 计算每条线段的直线方程形式 $y=mx+b$（$m$\
    \ 是 **斜率**（斜率）且 $b$ 是 $y$ 轴截距（$y$ 轴截距）），\n+     - 求出直线的交点（使用除法求交点），\n+     - 并检查该点是否在两条线段上。\n\
    +   - 当线段几乎平行时，该方法对实际计算机上除法运算的精度非常敏感。\n\n$\\begin{cases} y=m_1x+b_1 \\\\ y=m_2x+b_2\
    \ \\end{cases} \\quad\\Rightarrow\\quad x=\\frac{b_2-b_1}{m_1-m_2},\\ y=\\frac{m_1b_2-m_2b_1}{m_1-m_2}$\n\
    \n本节中避免除法的方法要准确得多。\n\n"
