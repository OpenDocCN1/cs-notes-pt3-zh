  - '[PAGE 235]


    # Step 1: The structure of the fastest way through the factory


    +   - To characterize the structure of an optimal solution.

    +   - Considering the fastest possible way for a chassis to get from the starting
    point through station $S_{1,j}$. （从装配线的入口点开始，以最快的方式通过 $S_{1,j}$，这条路径是什么？）

    +   - If $j=1$, only one way


