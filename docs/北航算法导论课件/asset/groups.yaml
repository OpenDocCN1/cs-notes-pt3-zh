    # Step 1: The structure of an optimal BST


    +   - Start with an observation about subtrees.

    +   - Consider any subtree of a BST

    +     - It must contain keys in a contiguous range $k_i$, ..., $k_j$, for some
    $1\le i \le j \le n$.

    +     - In addition, the subtree must also have as its leaves the dummy keys $d_{i-1}$,
    ..., $d_j$.

    +   - Optimal substructure?


