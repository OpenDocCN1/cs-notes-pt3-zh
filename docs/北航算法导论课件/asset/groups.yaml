    3    MERGE-SORT(A, 1, 1)

    1  if 1 < 1

    4    MERGE-SORT(A, 2, 2)

    1  if 2 < 2

    5    MERGE(A, 1, 1, 2)

    4    MERGE-SORT(A, 3, 4)

    1  if 3 < 4

    2    then q ← ⌊(3 + 4) / 2⌋ = 3

    3    MERGE-SORT(A, 3, 3)

    1  if 3 < 3

    4    MERGE-SORT(A, 4, 4)

    1  if 4 < 4

    5    MERGE(A, 3, 3, 4)

    5    MERGE(A, 1, 2, 4)

