    \Theta\left(n^{\log_b a}\lg n\right), & f(n)=\Theta\left(n^{\log_b a}\right)\\

    \Theta(f(n)), & f(n)=\Omega\left(n^{\log_b a+\varepsilon}\right)\text{ and }af(n/b)\le
    cf(n)\text{ for large }n

    \end{cases}

    $$


    where $\varepsilon>0$ and $c<1$.


    +   - **Polynomially**

    +     - **Case 1**, $f(n)$ must be polynomially smaller than $n^{\log_b a}$.

    +     - **Case 3**, $f(n)$ must be polynomially larger than $n^{\log_b a}$.


    **Example:** $f(n)=n\lg n$,   $n^{\log_b a}=n$


    +   - **Gap**

    +     - There is a gap between cases 1 and 2 when $f(n)$ is smaller than $n^{\log_b
    a}$ but not polynomially smaller.

    +     - Similarly, there is a gap between cases 2 and 3 when $f(n)$ is larger
    than $n^{\log_b a}$ but not polynomially larger.'
