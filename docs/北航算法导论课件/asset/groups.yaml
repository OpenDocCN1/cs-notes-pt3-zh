    Theorem 30.1 For any set $\{(x_k , y_k)\}$ of $n$ point-value pairs, all the $x_k$
    values are distinct, there is a unique polynomial $A(x)$ of degree-bound $n$ such
    that $y_k = A(x_k)$ for $k = 0,1,..., n - 1$.


    +   - Lagrange''s formula: A faster algorithm for $n$-point interpolation

    +     $A(x) = \sum_{k=0}^{n-1} y_k \frac{\prod_{j \neq k} (x - x_j)}{\prod_{j
    \neq k} (x_k - x_j)}$

    +     Computing $a$ of $A$ using Lagrange’s formula takes time $\Theta(n^2)$.'
