  mdcn: "\n\n## 多项式乘法（多项式相乘）\n\n- **A(x)、B(x)，次数界为 n**  $A(x)=\\sum_{j=0}^{n-1}a_jx^j$\
    \  和  $B(x)=\\sum_{j=0}^{n-1}b_jx^j$\n- **C(x) = A(x)B(x)，次数界为 2n-1**\n  \n  乘积\
    \ $C(x)$ 的另一种表达方式是\n  \n  $C(x)=\\sum_{j=0}^{2n-2}c_jx^j$\n  \n  其中  $c_j=\\sum_{k=0}^{j}a_kb_{j-k}$\n\
    - **运行时间：** $T(n)=\\Theta(n^2)$，因为 A 中的每个系数都必须与 B 中的每个系数相乘。\n- **我们能加速这个计算吗？能！**\n\
    \n## 章节概要\n\n- 30.1 介绍表示多项式的两种方式：\n  - 系数表示\n  - 点值表示\n- 多项式的加法\n- 多项式乘法的直接方法\n\
    \  - $\\Theta(n^2)$，多项式以系数形式表示\n  - $\\Theta(n)$，多项式以点值形式表示\n- 用系数表示法在 $\\Theta(n\
    \ \\lg n)$ 时间内完成多项式乘法？FFT 及其逆变换\n- 30.2，DFT 和 FFT\n- 30.3，如何快速实现 FFT\n\n### 30.1\
    \ 多项式的表示\n\n- **等价性**：多项式的系数表示和点值表示在某种意义上是等价的。\n- 也就是说，点值形式的多项式在系数形式下有唯一的对应形式。\n\
    \n### 30.1.1 系数表示\n\n- **多项式的*系数表示*** $A(x) = \\sum_{j=0}^{n-1} a_j x^j$\n  $a\
    \ = (a_0, a_1, ..., a_{n-1})^T$，列向量\n- **对某些运算很方便。例如，**\n  - *在给定点 $x_0$ 处求值 $A(x)$，耗时\
    \ $\\Theta(n)$*，使用的是*霍纳法则*：\n    $A(x_0) = a_0 + x_0(a_1 + x_0(a_2 + \\cdots +\
    \ x_0(a_{n-2} + x_0(a_{n-1}))))$\n  - *两个多项式相加，其表示为 $a = (a_0, a_1, ..., a_{n-1})^T$\
    \ 和 $b = (b_0, b_1, ..., b_{n-1})^T$，耗时 $\\Theta(n)$*：我们只需生成系数向量 $c = (c_0, c_1,\
    \ ..., c_{n-1})$，其中 $c_j = a_j + b_j$，$j = 0, 1, ..., n - 1$。\n- **$A(x)$ 和 $B(x)$\
    \ 的乘法**\n\n  $A(x)=\\sum_{j=0}^{n-1}a_jx^j,\\quad a=(a_0,a_1,\\cdots,a_{n-1})^T;\\\
    quad B(x)=\\sum_{j=0}^{n-1}b_jx^j,\\quad b=(b_0,b_1,\\cdots,b_{n-1})^T$\n\n  $C(x)=\\\
    sum_{j=0}^{2n-2}c_jx^j$ (30.1)\n\n  其中 $c_j=\\sum_{k=0}^{j}a_kb_{j-k}$ (30.2)\n\
    \n- 耗时 $\\Theta(n^2)$，为什么？\n- 比两个多项式相加更困难。\n- 由方程 (30.2) 给出的系数向量 $c$ 也称为 $a$ 和\
    \ $b$ 的*卷积* [卷积]，记为 $c=a\\odot b$。\n- 多项式乘法和计算卷积是基本的计算问题，而且很重要。\n\n### 30.1.2\
    \ 点值表示\n\n- **多项式的点值表示**\n\n  $y = A(x) = \\sum_{j=0}^{n-1} a_j x^j$\n\n  $\\\
    {(x_0, y_0), (x_1, y_1), ..., (x_{n-1}, y_{n-1})\\}$，一个由 $n$ 个点值对组成的集合，其中所有 $x_k$\
    \ 互不相同，且\n\n  $y_k = A(x_k),\\ k = 0, 1, ..., n - 1 \\quad (30.3)$\n\n- 任意 $n$\
    \ 个不同的点 $x_0, x_1, ..., x_{n-1}$ 都可用作多项式表示的一组基，这种表示不唯一。 【多项式的点值表示不唯一】\n\n- **多项式表示**\
    \  \n  $y=A(x)=\\sum_{j=0}^{n-1}a_jx^j$  \n  $a=(a_0,a_1,\\ldots,a_{n-1})^T$，列向量\
    \  \n  $\\{(x_0,y_0),(x_1,y_1),\\ldots,(x_{n-1},y_{n-1})\\}$，一个由 $n$ 个点值对组成的集合\n\
    \n  ![](img/09c68ab421cfce4995ddad1430ef2637_495_0.png)\n\n### 求值\n\n- 选择 $n$\
    \ 个不同的点 $x_0,x_1,\\ldots,x_{n-1}$，\n- 对 $k=0,1,\\ldots,n-1$，求 $A(x_k)$。\n- $n$\
    \ 点求值耗时 $\\Theta(n^2)$。（霍纳方法）\n- 如果巧妙地选择 $x_k$，计算只需 $\\Theta(n\\lg n)$。\n\n- **多项式表示**\
    \  $A(x) = \\sum_{j=0}^{n-1} a_j x^j$\n  $a = (a_0, a_1, ..., a_{n-1})^T$，列向量\n\
    \  $\\{(x_0, y_0), (x_1, y_1), ..., (x_{n-1}, y_{n-1})\\}$，一个由 $n$ 个点值对组成的集合\n\
    \n  ![](img/09c68ab421cfce4995ddad1430ef2637_496_0.png)\n\n- **插值**〔插值〕，求值的逆运算\n\
    \n### 定理 30.1（插值多项式的唯一性）\n\n对于由 $n$ 个点值对组成的任意集合 $\\{(x_k, y_k)\\}$，若所有 $x_k$ 的值互不相同，则存在唯一一个次数界为\
    \ $n$ 的多项式 $A(x)$，使得对于 $k = 0,1,..., n - 1$，有 $y_k = A(x_k)$。\n\n"
