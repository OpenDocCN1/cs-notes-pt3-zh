  - '[PAGE 125]


    # 3.1.7 Comparison of functions


    +   - One property of real numbers, does not carry over to asymptotic notation

    +     - Trichotomy (三分法) : any two real numbers $a$ and $b$, one of the following
    must holds: $a<b$, $a=b$, or $a>b$.

    +     - Not all functions are asymptotically comparable. That is, for two functions
    $f(n)$ and $g(n)$, it may be the case that neither $f(n)=O(g(n))$ nor $f(n)=\Omega(g(n))$
    holds.


    For example, the functions $n$ and $n^{1+\sin n}$ cannot be compared using asymptotic
    notation.


    $-1 \le \sin n \le 1 \Rightarrow n^0 \le n^{1+\sin n} \le n^2$


    $n^{1+\sin n} \le n \le n^{1+\sin n}$ ???'
