    end\n```\n\nExample: Γ = (p ∨ q) ∧ (¬p ∨ q) ∧ (p ∨ ¬q) ∧ (¬p ∨ ¬q)\nS1: p=0, q=0;\
    \ S2: p=1, q=0; S3: p=0, q=1; S4: p=1, q=1.\n\nNone of the above candidate solutions\
    \ satisfies Γ. So Γ is unsatisfiable.\n\n# Search Method 2: Backtrack Search (回溯搜索)\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_600_0.png)\n\n```\nBtSAT(Γ∈CNF)\nbegin\n\
    \    if Γ is an empty formula, then return(Yes);\n    if Γ contains empty clauses\
    \ then return(No);\n    Select a variable x from Γ\n    if BtSAT(Γ[x/1])=Yes then\
    \ return(Yes); // Substitute x=1 into Γ\n    if BtSAT(Γ[x/0])=Yes then return(Yes);\
    \ // Substitute x=0 into Γ\n    return(No);\nend\n```\n\n# Search Method 3: Local\
    \ Search（局部搜索）\n\n- Local search is a simple search method that repeatedly moves\
    \ from a candidate solution to the best candidate solution nearby.\n- Incomplete\
    \ but generally very efficient.\n\n![](img/09c68ab421cfce4995ddad1430ef2637_601_0.png)\n\
