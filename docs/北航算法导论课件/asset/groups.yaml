    \n### 如何获得递推式解的渐近“Θ”或“O”界？\n\n- **代入法（置换法）**：猜测一个界，然后使用数学归纳法证明我们的猜测是正确的。\n- **迭代法**：将递推式转换为一个求和式，然后利用求和有界的技术来求解递推式。\n\
    - **递归树法**（一种迭代法）。\n- **主方法（主函数法）**：为形如 \\(T(n)=aT(n/b)+f(n)\\) 的递推式提供界，其中 \\\
    (a\\ge1\\)，\\(b>1\\)，且 \\(f(n)\\) 是给定函数。\n\n### 技术细节\n\n在实践中，当我们陈述和求解递推式时，会忽略某些技术细节。（忽略技术细节）\n\
    \n- 1) 假设函数参数为整数\n  - 通常，\\(T(n)\\) 仅在 \\(n\\) 为整数时有定义。\n  - 例如，`MERGE-SORT` 的最坏情况运行时间：\n\
    \n  \\[\n  T(n)=\\begin{cases}\n  \\Theta(1), & \\text{if } n=1,\\\\\n  T(\\lceil\
    \ n/2\\rceil)+T(\\lfloor n/2\\rfloor)+\\Theta(n), & \\text{if } n>1.\n  \\end{cases}\n\
    \  \\tag{4.2}\n  \\]\n\n- 2) 忽略边界条件\n  - 省略递推式的边界条件陈述，假设对于较小的 \\(n\\)，\\(T(n)\\\
    ) 为常数，即对于足够小的 \\(n\\)，有 \\(T(n)=\\Theta(1)\\)。（\\(n\\) 较小时，\\(T(n)\\)为常数）\n  -\
    \ 例如，将递推式 (4.1) 陈述为\n\n  \\[\n  T(n)=2T(n/2)+\\Theta(n),\n  \\]\n\n  （省略 \\(T(1)=\\\
    Theta(1)\\)）(4.3) 而不显式给出小 \\(n\\) 时的值。\n  - 原因是，虽然改变 \\(T(1)\\) 的值会改变递推式的解，但解的增长率不变。（改变边界值，可能改变递推式的解，但不改变解的函数增长率）\n\
    \n- 3) 省略向上取整、向下取整\n\n这些细节不会影响算法分析中遇到的许多递推式的渐近界。（忽略细节不会影响算法的渐近分析）\n\n### 4.1 代入法\n\
    \n关键点：\n\n- 1) 猜测解的形式；\n- 2) 使用数学归纳法证明解成立。\n\n示例：\n\n\\[\nT(n)=\\begin{cases}\n\
    1, & \\text{if } n=1,\\\\\n2T(n/2)+n, & \\text{if } n>1.\n\\end{cases}\n\\]\n\n\
    (1) 猜测：\\(T(n)=n\\lg n+n\\)\n\n(2) 归纳\n\n**基础情况：** \\(n=1 \\Rightarrow n\\lg n+n=1=T(n)\\\
    )\n\n**归纳步骤：** 归纳假设是对于所有 \\(k<n\\)，有 \\(T(k)=k\\lg k+k\\)。\n\n使用关于 \\(T(n/2)\\\
    ) 的归纳假设来证明 \\(T(n)\\)：\n\n\\[\n\\begin{aligned}\nT(n)&=2T(n/2)+n\\\\\n&=2\\left((n/2)\\\
    lg(n/2)+(n/2)\\right)+n\\quad\\text{（根据归纳假设）}\\\\\n&=n\\lg(n/2)+n+n\\\\\n&=n(\\\
    lg n-\\lg 2)+2n\\\\\n&=n\\lg n+n.\n\\end{aligned}\n\\]\n\n该方法功能强大，但仅适用于容易猜测出答案形式的情形。\n\
    \n"
