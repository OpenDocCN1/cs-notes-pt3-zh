  - '[PAGE 273]


    # Step 1: The structure of an optimal parenthesization


    +   - **The optimal substructure**

    +     - The parenthesization of the "prefix" subchain $A_i A_{i+1}...A_k$ within
    this optimal parenthesization of $A_i A_{i+1}...A_j$ must be an optimal parenthesization
    of $A_i A_{i+1}...A_k$？（$A_{i,j}$ 的最佳全括号中的 $A_{i..k}$ 的全括号必须是 $A_{i..k}$ 的最佳全括号）


    Proof Optimal parenthesization $A_{i,j} = (A_i...A_k)(A_{k+1}...A_j) = M·N$, parenthesization
    $M = (A_i A_{i+1}...A_k)$ in $A_{i..j}$ above. If there were a less costly way
    to parenthesize $A_i...A_k = P$, substituting $M$ with $P$, that is $P·N$ would
    produce another parenthesization of $A_{i..j}$ whose cost was lower than $M·N$.
    A contradiction.


    +   - A similar observation holds for $A_{k+1} A_{k+2}...A_j$'
  - "[PAGE 274]\n\n# Step 1: The structure of an optimal parenthesization\n\n![](img/09c68ab421cfce4995ddad1430ef2637_274_0.png)\n\
    \n+   - Construct an optimal solution to the problem from optimal solutions to\
    \ subproblems based on optimal substructure.\n+   \n+     （基于最佳子结构，可以从子问题的最优解构造原问题的最优解）\n\
    +   \n+   - Any solution to the matrix-chain multiplication requires us to split\
    \ the product, and **any optimal solution contains within it optimal solutions\
    \ to subproblem instances.**\n+   \n+     （任何最优解必包含其子问题的最优解）\n+   \n+     - **Split**\
    \ the problem into two subproblems (optimally parenthesizing $A_iA_{i+1}\\cdots\
    \ A_k$ and $A_{k+1}A_{k+2}\\cdots A_j$);\n+     - **find** optimal solutions to\
    \ subproblem;\n+     - **combine** these optimal subproblem solutions.\n+   \n\
    +     （将问题分为两个问题，求子问题的最优解，合并子问题的最优解）"
