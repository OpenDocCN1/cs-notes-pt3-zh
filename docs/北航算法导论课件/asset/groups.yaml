  - '[PAGE 497]


    # 30.1.2 Point-value representation


    +   polynomial representation

    +   $y = A(x) = \sum_{j=0}^{n-1} a_j x^j$


    coefficient form

    $a = (a_0, a_1, ..., a_{n-1})^T$


    evaluation


    interpolation


    point-value form

    $\{(x_j, y_j)\}$


    Theorem 30.1 For any set $\{(x_k, y_k)\}$ of $n$ point-value pairs, all the $x_k$
    values are distinct, there is a unique polynomial $A(x)$ of degree-bound $n$ such
    that $y_k = A(x_k)$ for $k = 0,1,..., n - 1.$


    Proof Equation (30.3) "$y_k = A(x_k), k = 0, 1..., n-1$" is equivalent to


    \begin{pmatrix} y_0 \ y_1 \ \vdots \ y_{n-1} \end{pmatrix} = \begin{pmatrix} 1
    & x_0 & x_0^2 & \cdots & x_0^{n-1} \ 1 & x_1 & x_1^2 & \cdots & x_1^{n-1} \ \vdots
    & \vdots & \vdots & \ddots & \vdots \ 1 & x_{n-1} & x_{n-1}^2 & \cdots & x_{n-1}^{n-1}
    \end{pmatrix} \begin{pmatrix} a_0 \ a_1 \ \vdots \ a_{n-1} \end{pmatrix} = V(x_0,
    x_1, \cdots, x_{n-1}) \cdot a \quad (30.4)


    $V$ is Vander-monde matrix, has determinant $\prod_{0 \le j < k \le n-1} (x_k
    - x_j)$, therefore, $V^{-1}$ exists. Thus, $a = V(x_0, x_1, \cdots, x_{n-1})^{-1}
    \cdot y$. (chap28, LU decomposition, $O(n^3)$)'
