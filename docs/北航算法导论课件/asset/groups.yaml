  - '[PAGE 127]


    # ** 3.2 Standard notation and common function


    +   - **Functional iteration（迭代函数）**


    We use the notation $f^{(i)}(n)$ to denote the function $f(n)$ iteratively applied
    $i$ times to an initial value of $n$. For non-negative integers $i$, we recursively
    define


    $f^{(i)}(n) = \begin{cases} n & \text{if } i=0 \\ f\left(f^{(i-1)}(n)\right) &
    \text{if } i>0 \end{cases}$


    For example, if $f(n)=2n$, then


    $f^{(2)}(n) = f(f(n)) = f(2n) = 2(2n) = 2^2 n$


    ...


    $f^{(i)}(n) = 2^i n$'
  - '[PAGE 128]


    # ** 3.2 Standard notation and common function


    +   - The iterated logarithm function


    We use the notation lg* n to denote the iterated logarithm. Let lg^(i) n be iterated
    function, with f(n)=lg n, that is lg^(i)(n)=lg(lg^(i-1)(n)). lg^(i) n is defined
    only if lg^(i-1) n>0. Be sure to distinguish lg^(i) n from lg^i n. lg* n is defined
    as


    lg* n = min{ i ≥ 0 : lg^(i) n ≤ 1 }


    The iterated logarithms is a very slowly growing function:


    lg* 2 = 1,      lg* 4 = 2,      lg* 16 = 3,


    lg* 65536 = 4,  lg* 2^65536 = 5.


    2^65536 >> 10^80. Rarely encounter an input size n such that lg* n > 5.


    +   - Fibonacci numbers (self-study)'
