    \n### 扩展边界条件\n\nT(n) = 2T(⌊n/2⌋) + n ;  T(n) = O(n lg n) , T(n) ≤ c n lg n\n\n\
    - 归纳假设与特定边界条件不一致，如何克服困难？ (如何克服递归结果与边界条件不一致的问题？)\n- 渐近记号只要求我们证明当 n ≥ n₀ 时 T(n)\
    \ ≤ c n lg n 成立，其中 n₀ 是一个常数。\n- 去除困难的边界条件 T(1) = 1\n- 将 T(2) 和 T(3) 作为归纳证明的边界条件。\n\
    - 由递推式可得 T(2) = 2*T(1) + 2 = 4 ， T(3) = 2*T(1) + 3 = 5。\n- 归纳证明 T(n) ≤ c n lg\
    \ n 现在可以通过选择任意 c ≥ 2 来完成，使得 T(2) = 4 ≤ c*2 lg 2 且 T(3) = 5 ≤ c 3 lg 3。\n\n## 4.1.1\
    \ 做出一个好的猜测\n\n- 如果一个递推式与你之前见过的相似，那么猜测一个相似的解是合理的。例如，T(n) = 2T(⌊n/2⌋ + 17) + n\n\
    - 看起来很困难，因为加上了“17”。\n- 直观上，这个附加项不会从根本上影响递推式的解。 (该附加项不会从本质上影响递归解)\n- 当 n 很大时，T(\
    \ n/2 ) 和 T( n/2 + 17) 之间的差异并不大。因此，我们猜测 T(n) = O(n lg n)，你可以用替换法验证其正确性。\n\n##\
    \ 4.1.1 做出一个好的猜测\n\n- 做出一个好的猜测的另一种方法是证明递推式的松的上界和下界，然后缩小不确定范围。\n- （寻找松的上、下渐近界，范围缩小，逐步逼近）\n\
    \n例如\n\n```\nT(n) = 2T(⌊n/2⌋) + n      (4.4)\n```\n\n- 我们可能会从递推式中含有项 n 开始，给出下界\
