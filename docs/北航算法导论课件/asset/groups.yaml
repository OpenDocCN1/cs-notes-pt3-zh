    \ T(n)=a.T(n/b)+f(n) ⇒ d.f(n)=a.d.f(n/b)+f(n) 若 a.f(n/b)>f(n)，则 d.f(n)=a.d.f(n/b)+f(n)>d.f(n)+f(n)=(d+1).f(n)\
    \ ⇒ d>d+1\n\n## 4.4.1 主定理：特殊情况\n\n$T(n)=aT(n/b)+f(n),$\n\n$$\nT(n)=\n\\begin{cases}\n\
