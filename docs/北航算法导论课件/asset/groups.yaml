  mdcn: "\n\n## 4.1.3 避免陷阱\n\n- 在使用渐近记号时很容易出错。\n\n例如，在递推式 (4.4) 中\n\n$$\nT(n) = 2T(\\\
    lfloor n/2 \\rfloor) + n \\tag{4.4}\n$$\n\n我们可以通过猜测 $T(n) \\le cn$ 然后论证来错误地证明\
    \ $T(n) = O(n)$\n\n$$\n\\begin{aligned}\nT(n) &= 2T(\\lfloor n/2 \\rfloor) + n\
    \ \\\\\n     &\\le 2(c\\lfloor n/2 \\rfloor) + n \\\\\n     &\\le cn + n \\\\\n\
    \     &= O(n), \\quad \\leftarrow \\text{wrong!!!}\n\\end{aligned}\n$$\n\n因为 $c$\
    \ 是一个常数。错误在于我们没有证明归纳假设的确切形式，即 $T(n) \\le cn$。\n\n## 4.1.4 变量替换\n\n- **代数运算**：有时可将一个未知的递推式化为与之前见过的形式相似。\n\
    \n例如，$T(n) = 2T(\\lfloor\\sqrt{n}\\rfloor) + \\lg n$，看起来很困难。用**变量替换**简化递推式。为方便起见，我们不考虑将诸如\
    \ $\\sqrt{n}$ 等值四舍五入为整数的问题。\n\n令 $m = \\lg n$，则 $T(2^m) = 2T(2^{m/2}) + m$。\n\n\
    于是令 $S(m) = T(2^m)$，则 $S(m) = 2S(m/2) + m$，这与递推式 (4.4) 非常相似，且解相同：$S(m) = O(m \\\
    lg m)$。将 $S(m)$ 换回 $T(n)$，我们得到 $T(n) = T(2^m) = S(m) = O(m \\lg m) = O(\\lg n\
    \ \\lg \\lg n)$。\n\n## 4.2 迭代法\n\n- **置换法：** 很难给出一个好的猜测。\n- **迭代法**\n  - 不需要我们猜测答案\n\
    \  - 可能需要更多的 **代数**（迭代法对代数能力的要求较高）\n  - 将递推式**展开（迭代）**并表示为一系列项的**求和**，以及初始条件\n\
    \  - **求和。**（不断迭代展开为级数，并求和）\n\n**例如，** $T(n) = 3T(\\lfloor n/4 \\rfloor) + n$\n\
    \n$$\n\\begin{aligned}\nT(n) &= n + 3T(\\lfloor n/4 \\rfloor) \\\\\n     &= n\
    \ + 3\\left(\\lfloor n/4 \\rfloor + 3T(\\lfloor n/16 \\rfloor)\\right) \\\\\n\
    \     &= n + 3\\left(\\lfloor n/4 \\rfloor + 3\\left(\\lfloor n/16 \\rfloor +\
    \ 3T(\\lfloor n/64 \\rfloor)\\right)\\right) \\\\\n     &= n + 3\\lfloor n/4 \\\
    rfloor + 9\\lfloor n/16 \\rfloor + 27T(\\lfloor n/64 \\rfloor).\n\\end{aligned}\n\
    $$\n\n- 我们必须迭代递推式多远？\n- 级数中的第 $i$ 项为 $3^i T(\\lfloor n/4^i \\rfloor)$。\n- 当 $\\\
    lfloor n/4^i \\rfloor = 1$ 时迭代停止。通过继续迭代到这一点并使用界 $\\lfloor n/4^i \\rfloor \\le\
    \ n/4^i$，我们得到一个递减的几何级数：\n\n$$\nT(n) \\le n + \\frac{3n}{4} + \\frac{9n}{16} +\
    \ \\frac{27n}{64} + \\cdots + 3^i T\\left(\\frac{n}{4^i}\\right)\n$$\n\n$$\nT(n)\
    \ \\le n \\sum_{i=0}^{\\infty} \\left(\\frac{3}{4}\\right)^i + \\Theta(n^{\\log_4\
    \ 3}) = 4n + o(n) = O(n).\n$$\n\n$$\nn/4^i = 1 \\Rightarrow i = \\log_4 n \\Rightarrow\
    \ 3^i = 3^{\\log_4 n} = n^{\\log_4 3}\n$$\n\n- 迭代法通常会导致大量的代数运算。这可能具有挑战性。关键点在于：\n\
    \  - 递推式需要迭代多少次才能达到边界条件（迭代次数），\n  - 以及迭代过程中每一层产生的项之和（级数求和）。\n- 有时，在迭代递推式的过程中，你可以在不完全算出数学细节的情况下猜出解。然后，可以放弃迭代而采用置换法，后者通常需要的代数运算更少。\n\
    \n（在展开递归式为迭代求和的过程中，有时只需要部分展开，然后根据其规律来猜想递归式的解，接着用置换法进行证明。）\n\n- 当递推式包含 floor 和\
    \ ceiling 函数时，数学可能会变得特别复杂。\n- 通常，假设递推式仅在某个数的精确幂上定义会有所帮助。\n\n例如，$T(n) = 3T(\\lfloor\
    \ n/4 \\rfloor) + n$。如果我们假设 $n = 4^k$ 对于某个整数 $k$，则 floor 函数可以方便地省略。\n\n## * 4.3\
    \ 递归树方法\n\n- 画出递归树是一种直接的方法来设计一个好的猜测，并直观地展示迭代法。（画递归树可以从直观上表示迭代法，也有助于猜想递归式的解）\n\
