    # 15.5 Optimal binary search trees


    +   - Given a sequence $K=\langle k_1,k_2,\ldots,k_n\rangle$ of $n$ distinct keys
    in sorted order $(k_1<k_2<\cdots<k_n)$, how to build a BST?

    +     - For each key $k_i$, search probability $p_i$ (it can also be the number
    $I$ of occurrence of $k_i$ in the text, whose number of total words is $M$, then
    $p_i=I/M$.)

    +     - Some values not in $K$, $n+1$ "dummy keys" $d_0,d_1,\ldots,d_n$

    +     - $d_0$ represents all values $<k_1$; $d_n$ represents all values $>k_n$

    +     - for $1\le i\le n-1$, $d_i$: $k_i<d_i<k_{i+1}$, search probability $q_i$

    +     - Fig, each key $k_i$, an internal node; $d_i$, a leaf


    ![](img/09c68ab421cfce4995ddad1430ef2637_303_0.png)


    | $i$ | 0 | 1 | 2 | 3 | 4 | 5 |

    |---|---:|---:|---:|---:|---:|---:|

    | $p_i$ |  | 0.15 | 0.10 | 0.05 | 0.10 | 0.20 |

    | $q_i$ | 0.05 | 0.10 | 0.05 | 0.05 | 0.05 | 0.10 |'
  - '[PAGE 304]


    # 15.5 Optimal binary search trees


    +   - Every search is either successful or unsuccessful, we have

    +     $$\sum_{i=1}^{n} p_i + \sum_{i=0}^{n} q_i = 1 \quad (15.15)$$


    +   - We have probabilities of searches for each (dummy) key, we can determine
    the expected cost of a search in a given BST $T$.


    +   - Assume that the actual cost of a search is the number of nodes examined.
    Then the expected cost of a search in $T$ is

    +     $$\mathrm{E}[\text{search cost in } T]=\sum_{i=1}^{n}(\text{depth}_T(k_i)+1)\cdot
    p_i + \sum_{i=0}^{n}(\text{depth}_T(d_i)+1)\cdot q_i$$

    +     $$=1+\sum_{i=1}^{n}\text{depth}_T(k_i)\cdot p_i + \sum_{i=0}^{n}\text{depth}_T(d_i)\cdot
    q_i, \quad (15.16)$$


    where $\text{depth}_T$ denotes a node''s depth in the tree $T$.'
