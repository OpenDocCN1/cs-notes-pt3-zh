    \ | 0 | 0 | 0 | 1 | 0 | 3 |\n| 3 | 0 | 0 | 0 | 0 | 0 | 0 | 1 | 1 | 4 |\n| 4 |\
    \ 0 | 0 | 0 | 0 | 0 | 1 | 0 | 0 | 7 |\n| 5 | 0 | 0 | 0 | 0 | 0 | 1 | 0 | 1 | 8\
