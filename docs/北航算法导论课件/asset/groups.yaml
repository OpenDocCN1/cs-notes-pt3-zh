  mdcn: "\n\n## 2.2 分析算法\n\n- 分析算法意味着预测资源需求。\n  - 资源：\n    - 内存（空间）\n    - 通信带宽\n\
    \    - 主要关注：计算机硬件\n    - 计算时间（CPU、I/O 等）\n  - 通过分析一个问题的若干候选算法，可以确定最高效的算法，并舍弃若干较差的算法（最优方案选取）\n\
    \n- **计算模型（Computing model）**\n  - **图灵（Turing）**（图灵机，计算的原始模型：符号体系，读写介质，1/0，......）\n\
    \    - $M = (Q, \\Gamma, I, \\delta, B, q_0, q_f)$\n  - **RAM**\n    - 随机存取机器（Random-access\
    \ machine）\n\n![](img/09c68ab421cfce4995ddad1430ef2637_77_0.png)\n\n- **RAM 模型：算法将作为计算机程序来实现。**\n\
    \  - RAM 是一种通用的单处理器模型；指令一条接一条地执行，不存在并发操作。\n  - RAM 包含常用指令：\n    - 算术运算（加、减、乘、除、取余、向下取整、向上取整）\n\
    \    - 数据移动（载入、存储、复制）\n    - 控制（条件分支与无条件分支、子程序调用与返回）\n  - 每条这类指令的执行时间都是常数。\n\n\
    - 分析一个简单算法也可能很有挑战性\n  - 所需数学知识：组合数学、概率论、代数运算能力（数学功底好）\n  - 从公式中识别最重要项的能力（洞察能力强，能抓住最重要的部分）\n\
    \  - 用简单公式概括算法的能力（抽象思维强，能将算法的本质特征归纳成简单形式）\n\n### 2.2.1 插入排序的分析\n\n- **程序的运行时间描述为其输入规模的函数。**（通常，程序的运算时间是输入规模的函数）\n\
    \  - **输入规模 $n$**：*输入中数据项的数量，取决于具体问题*\n    - 排序数组 $A$：$n$ 为 $A$ 的长度\n    - 图：$n$\
    \ 可以是顶点数和边数\n  - **运行时间 $T(n)$**：在特定输入下，*执行的基本操作或“步骤”的数量*（基本操作数）\n    - 运行时间满足如下一致性原则\n\
    \      - 步骤是机器无关的（基本操作独立于机器）\n      - 执行伪代码第 $i$ 行需要常数时间 $c_i$（每行指令的执行时间为常数）\n\
    \n```\nINSERTION-SORT(A)\n1   for(j = 2; j <= length[A]; j++)\n2   {   key = A[j]\n\
    3       // Insert A[j] into the sorted sequence A[1 .. j-1]\n4       i = j-1\n\
    5       while(i > 0 && A[i] > key)\n6       {   A[i+1] = A[i]\n7           i =\
    \ i-1\n8       }\n9       A[i+1] = key\n10  }\n```\n\n| 代价 | 次数 |\n|------|-------|\n\
    | $c_1$ | $n$ |\n| $c_2$ | $n-1$ |\n| $0$ | $n-1$ |\n| $c_4$ | $n-1$ |\n| $c_5$\
    \ | $\\sum_{j=2}^{n} t_j$ |\n| $c_6$ | $\\sum_{j=2}^{n} (t_j - 1)$ |\n| $c_7$\
    \ | $\\sum_{j=2}^{n} (t_j - 1)$ |\n| $c_8$ | $n-1$ |\n\n$$T(n) = c_1 n + c_2(n-1)\
    \ + c_4(n-1) + c_5 \\sum_{j=2}^{n} t_j + c_6 \\sum_{j=2}^{n} (t_j-1) + c_7 \\\
    sum_{j=2}^{n} (t_j-1) + c_8(n-1)$$\n\n![](img/09c68ab421cfce4995ddad1430ef2637_81_0.png)\n\
    \n- 即使输入规模相同，算法的运行时间也可能取决于给出的是该规模下的哪个输入。（相同输入规模的情况下，输入不同，运算时间也可能不同）\n\n- 最佳情况出现在数组已经有序时。对于每个\
    \ $j = 2, 3, \\ldots, n$，当 $i$ 的初始值为 $j-1$ 时，第 5 行中的 $A[i] \\le key$ 成立。因此 $t_j\
    \ = 1$，最佳情况运行时间为\n\n$$T(n) = c_1 n + c_2(n-1) + c_4(n-1) + c_5(n-1) + c_8(n-1)\
    \ = (c_1 + c_2 + c_4 + c_5 + c_8)n - (c_2 + c_4 + c_5 + c_8) = a n + b$$\n\n因此它是\
    \ $n$ 的线性函数。\n\n- 算法的运行时间可能依赖于实际输入。\n\n- 如果数组按逆序排列，则会出现最坏情况。我们必须将每个元素 $A[j]$ 与整个已排序子数组\
    \ $A[1 .. j-1]$ 中的每个元素进行比较，因此 $t_j = j$。\n\n$$\\sum_{j=2}^{n} j = \\frac{n(n+1)}{2}\
    \ - 1, \\quad \\sum_{j=2}^{n} (j-1) = \\frac{n(n-1)}{2}$$\n\n于是\n\n$$T(n) = c_1\
    \ n + c_2(n-1) + c_4(n-1) + c_5\\left(\\frac{n(n+1)}{2} - 1\\right) + c_6\\left(\\\
    frac{n(n-1)}{2}\\right) + c_7\\left(\\frac{n(n-1)}{2}\\right) + c_8(n-1) = a n^2\
    \ + b n + c$$\n\n因此它是 $n$ 的二次函数（$n^2$）。\n\n"
