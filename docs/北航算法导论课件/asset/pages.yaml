  md: "# 16.3.1 Prefix codes\n\n• **prefix codes** (prefix-free codes): no codeword\
    \ is a prefix of some other codeword.\n（字首码，前缀代码，前置代码〔前缀无关码〕：没有字码是其他字码的前缀）\n\n\
    |  | a | b | c | d | e | f |\n|---|---|---|---|---|---|---|\n| Variable-length\
    \ codeword | 0 | 101 | 100 | 111 | 1101 | 1100 |\n\n+   • Encoding is always simple\
    \ for any binary character code\n+   \n+   • Prefix codes **simplify decoding**\n\
    \n+   ◆ Since no codeword is a prefix of any other, the codeword that begins an\
    \ encoded file is unambiguous（明确的）。\n+   \n+   ◆ We can simply identify the initial\
    \ codeword, translate it back to the original character, and repeat the decoding\
    \ process on the remainder of the encoded file.\n+   \n+   ◆ Exam: 001011101 uniquely\
    \ as 0·0·101·1101, which decodes to “aabe”."
