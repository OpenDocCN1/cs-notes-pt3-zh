  md: "# Step 3: Computing the fastest times\n\n+   - The FASTEST-WAY procedure takes\
    \ as input the values $a_{i,j}$, $t_{i,j}$, $e_i$, and $x_i$, as well as $n$,\
    \ the number of stations in each assembly line.\n+   \n+   (以 $a_{i,j}$, $t_{i,j}$,\
    \ $e_i$, $x_i$, $n$ 作为输入，可设计程序 FASTEST-WAY)\n\n![](img/09c68ab421cfce4995ddad1430ef2637_251_0.png)"
  merge: -1
