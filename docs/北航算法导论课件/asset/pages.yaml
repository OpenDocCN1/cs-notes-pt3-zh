  md: '# 2.2.3 Order of growth


    # Rate of growth (order of growth, 函数增长率)


    +   - the more simplifying abstraction.

    +   - considering only the leading term of a formula (e.g., $an^2$ of $an^2+bn+c$),
    since the lower-order terms are relatively insignificant for large $n$.

    +   - ignoring the leading term’s constant coefficient, since constant factors
    are less significant than the rate of growth in determining computational efficiency
    for large inputs.


    Thus, the insertion sort has a worst-case running time of Θ(n²)


    +   - Usually, one algorithm is more efficient than another if its worst-case
    running time has a lower order of growth (small inputs exception, e.g., 10n lgn
    vs 2n²).'
