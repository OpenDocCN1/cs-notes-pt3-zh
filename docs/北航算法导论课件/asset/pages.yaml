    3     m ← m+1\n4 if m ≤ n\n5     return {a_m} ∪ REC-ACTIVITY-SELECTOR(s, f, m,\
    \ n)\n6 else return ∅\n```\n\n+   Time: Θ(n)—each activity examined exactly once.\n\
