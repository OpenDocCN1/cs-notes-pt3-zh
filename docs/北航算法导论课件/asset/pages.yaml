- pgno: 440
  md: '# 16.1.4 A recursive greedy algorithm


    +   - Original problem is $S_{0,n+1}$

    +   - Each subproblem is $S_{m_i,n+1}$

    +   - Assumes activities already sorted by monotonically increasing finish time.
    (If not, then sort in $O(n\lg n)$ time.) Return an optimal solution for $S_{i,n+1}$:


    ```

    REC-ACTIVITY-SELECTOR(s, f, i, n)

    1  m ← i+1 // initially i = 0, m = 1

    2  while m≤n and sₘ < fᵢ  // Find first activity in Sᵢ,ₙ₊₁

    3      m ← m+1

    4  if m≤n

    5      return {aₘ} ∪ REC-ACTIVITY-SELECTOR(s, f, m, n)

    6  else return ∅

    ```


    ![](img/09c68ab421cfce4995ddad1430ef2637_440_0.png)'
  merge: -1
