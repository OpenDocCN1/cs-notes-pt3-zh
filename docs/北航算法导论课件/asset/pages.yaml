  md: '# 15.3.1 Optimal substructure : Subtleties


    +   Optimal substructure doesn''t apply to all optimization problems.


    +   Here are two problems that look similar. In both, we''re given an unweighted,
    directed graph G = (V, E). （无权有向图）


    +   V is a set of vertices; E is a set of edges.


    ![](img/09c68ab421cfce4995ddad1430ef2637_373_0.png)


    +   Finding a path from vertex u to vertex v.


    +   Shortest path: find path u to v with fewest edges. Must be simple (no cycles),
    since removing a cycle from a path gives a path with fewer edges. （最短路径）


    +   Longest simple path: find simple path u to v with most edges. If didn''t require
    simple, could repeatedly traverse a cycle to make an arbitrarily long path. （最长简单路径）'
