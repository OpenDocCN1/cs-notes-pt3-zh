- pgno: 379
  md: '# 15.3.1 Optimal substructure : Subtleties


    +   - **The big difference between shortest path and longest path**

    +     - For shortest paths, the subproblems do not share resources.

    +     - If we look at a shortest path $u \xrightarrow{p_1} w \xrightarrow{p_2}
    v$, $e$ edges, no vertex other than $w$ can appear in $p_1$ and $p_2$. Otherwise,
    we have a cycle, get rid of the cycle. This path from $u$ to $v$ has at most $e-2$
    edges, contradiction.


    （考察从 $u$ 到 $v$ 的最短路径 $p$，设其长度为 $e$，顶点 $w$ 将 $p$ 分为 $p_1$ 和 $p_2$，则除 $w$ 以外，路径
    $p_1$ 和 $p_2$ 中不会再有相同的顶点出现，否则，路径 $p$ 中有周期子路径，从 $p$ 中去掉该周期子路径，得 $u$ 到 $v$ 的路径最多有
    $e-2$ 条边，矛盾）


