  md: "# 2.3.2 Analyzing divide-and-conquer algorithms\n\nT(n) = { Θ(1) if n ≤ c\n\
    \  aT(n / b) + D(n) + C(n) otherwise }\n\n+   - How to set up the recurrence for\
    \ T(n), the worst-case running time of merge sort on n numbers?\n\n+   - If one\
    \ element n=1, takes constant time.\n\n+   - When n>1,\n\n+   - **Divide**: The\
    \ step just computes the middle of the subarray, one step. Thus, D(n)=Θ(1).\n\n\
