- pgno: 238
  md: '# Step 1: The structure of the fastest way through the factory


    +   - **Optimal substructure**

    +     （最佳子结构）

    +     - An optimal solution to a problem (assembly-line scheduling, finding the
    fastest way through station $S_{i,j}$) **contains within it** an optimal solution
    to subproblems (finding the fastest way through either $S_{1,j-1}$ or $S_{2,j-1}$).

    +     （问题的最优解包含其子问题的最优解，$p_j$ contains $p_{j-1}$ within it.）

    +     - We refer to this property as *optimal substructure*.

    +     - Optimal substructure is one of the hallmarks of the applicability of dynamic
    programming.

    +     （为什么使用动态规划法？最佳子结构是其特点之一）


    ![](img/09c68ab421cfce4995ddad1430ef2637_238_0.png)'
