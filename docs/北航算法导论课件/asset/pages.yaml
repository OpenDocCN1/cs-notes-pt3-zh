- pgno: 569
  md: '+   - *Jarvis''s march: package wrapping* (or *gift wrapping*).

    +   - Intuitively, Jarvis''s march simulates wrapping a taut piece of paper around
    the set $Q$.

    +     - We start by taping the end of the paper to the lowest point in the set,
    that is, to the same point $p_0$ with which we start Graham''s scan. This point
    is a vertex of the convex hull.

    +     - We pull the paper to the right to make it taut, and then we pull it higher
    until it touches a point. This point must also be a vertex of the convex hull.

    +     - Keeping the paper taut, we continue in this way around the set of vertices
    until we come back to our original point $p_0$.

    +   - Jarvis''s march has a running time of $O(nh)$?


    ![](img/09c68ab421cfce4995ddad1430ef2637_569_0.png)'
