  md: "# 5.1.3 Randomized algorithms\n\n+   - **What makes an algorithms randomized:**\
    \ An algorithm is randomized if its behavior is determined in part by values produced\
    \ by a *random-number generator*.\n+   \n+     （算法随机化：由随机数产生器生成数值……）\n+   \n+\
    \   - **RANDOM(a, b)** returns an integer *r*, where *a≤r≤b* and each of the *b-a+1*\
    \ possible values of *r* is equally likely.\n+   \n+   - In practice, RANDOM is\
    \ implemented by a pseudorandom-number generator, which is a deterministic method\
    \ returning numbers that “look” random and pass statistical tests.（RANDOM实际上由一个确定的算法〔伪随机产生器〕产生，其结果表面上看上去像是随机数）"
