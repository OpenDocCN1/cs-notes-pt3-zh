  md: '# 34 NP Complete Problems


    +   - 多项式时间算法(n^1000)，简单！

    +   - 非多项式时间算法，复杂！

    +   - 不知是否存在可解算法的问题，复杂！

    +   - 旅行商问题（Traveling Salesman Problem）：找出一条通过所有城镇并回到原出发点的最短路线


    +   - 1→2→3(1→3→2)→ ……，这两种走法的距离不一样。

    +   - 可能的路线： n!

