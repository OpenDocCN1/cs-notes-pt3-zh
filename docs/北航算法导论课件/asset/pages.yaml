- pgno: 236
  md: "# Step 1: The structure of the fastest way through the factory\n\n+   - **First,\
    \ suppose that the fastest way through station $S_{1j}$ is through station $S_{1,j-1}$.**\n\
    +   \n+     （首先，设以最快方式通过 $S_{1j}$ 的路径为 $p_j$，$p_j$ 中的 $S_{1j}$ 的前一个 station 是\
    \ $S_{1,j-1}$）\n\n![](img/09c68ab421cfce4995ddad1430ef2637_236_0.png)\n\n+   -\
    \ **The chassis must have taken a fastest way from the starting point through\
    \ station $S_{1,j-1}$. Why?** （去掉路径 $p_j$ 中的最后一个 $S_{1j}$ 后得到 $p_{j-1}$，则 $p_{j-1}$\
    \ 是通过 $S_{1,j-1}$ 的最快路径）\n\n+     - If there were **another faster way** to get\
    \ through station $S_{1,j-1}$, we could **substitute** this faster way to yield\
    \ **another faster way** through station $S_{1j}$: a **contradiction**.\n+   \n\
    +       （若有另外一条更快的路径 $q_{j-1}$ 通过 $S_{1,j-1}$，则用 $q_{j-1}$ 替换 $p_{j-1}$，那么 $q_j=q_{j-1}+S_{1,j}$\
    \ 是比 $p_j$ 更快的路径，矛盾）"
