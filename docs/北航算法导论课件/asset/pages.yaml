  md: '# 16.1.5 An iterative greedy algorithm


    +   - **REC-ACTIVITY-SELECTOR is almost "tail recursive".**

    +   - **We easily can convert the recursive procedure to an iterative one. (Some
    compilers perform this task automatically)**


    ![](img/09c68ab421cfce4995ddad1430ef2637_444_0.png)


    ```

    GREEDY-ACTIVITY-SELECTOR(s, f, n)

    1  A ← {a₁}

    2  i ← 1

    3  for m ← 2 to n

    4      if sₘ ≥ fᵢ

    5          A ← A ∪ {aₘ}

    6          i ← m   // aᵢ is most recent addition to A

    7  return A

    ```'
