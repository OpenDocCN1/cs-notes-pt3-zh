  md: "# Exam4  Finding Minimum and Maximum （MaxMin）\n\n+   - **Divide and conquer**\n\
    \n```\nMaxMin(L)\n    if length(L)=1 or 2, we use at most one comparison.\n  \
    \  else\n    {\n        split (分裂) L into lists L1 and L2, each of n/2 elements\n\
    \        (min1, max1) = MaxMin(L1)\n        (min2, max2) = MaxMin(L2)\n      \
    \  return (Min(min1, min2), Max(max1, max2))\n    }\n```\n\n**Complexity analysis\
    \ (Number of Comparisons):**\n\nT(1)=0, T(2)=1,\n\nT(n) = 2T(n/2)+2\n\n= 4T(n/4)+2²+2\
    \ = 2³T(n/2³) + 2³+2²+2 = …\n\n= 2ᵏ·T(n/2ᵏ)+2ᵏ+¹+…+2 = 2ᵏ+¹+2ᵏ+¹+…+2\n\n= 2ᵏ⁻¹+2ᵏ−2\
    \ = **3n/2 − 2** （There, assume n=2ᵏ, Sₙ=a(1−qⁿ)/(1−q).）"
