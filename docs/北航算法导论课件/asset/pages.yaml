  md: "# 17.3 The potential method\n\n+   - The potential method of amortized analysis\
    \ represents the prepaid work as “potential energy” (potential), which can be\
    \ released to pay for future operations.\n+   - We associate the potential with\
    \ the data structure (DS) as a whole rather than with specific objects within\
    \ the data structure.\n+   - The potential method works as follows:\n+     - We\
    \ will perform n operations, starting with an initial DS D₀.\n+     - cᵢ : the\
    \ actual cost of the i-th operation (i = 1, 2, ..., n).\n+     - Dᵢ : the DS that\
    \ results after applying the i-th operation to DS Dᵢ₋₁.\n+     - Φ : A potential\
    \ function Φ maps each DS Dᵢ to a real number Φ(Dᵢ), which is the potential associated\
    \ with DS Dᵢ.\n+   - The amortized cost ĉᵢ of the i-th operation with respect\
    \ to potential function Φ is defined by\n+     \n+     ĉᵢ = cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁)\n\
    +   - The total amortized cost of the n operations is\n+     \n+     ∑ᵢ₌₁ⁿ ĉᵢ\
    \ = ∑ᵢ₌₁ⁿ (cᵢ + Φ(Dᵢ) − Φ(Dᵢ₋₁))\n+     \n+     = ∑ᵢ₌₁ⁿ cᵢ + Φ(Dₙ) − Φ(D₀)."
  merge: -1
  img_proc: true
- pgno: 344
  md: "# 17.3 The potential method\n\n+   - The amortized cost $\\widehat{c}_i$ of\
    \ the $i$th operation with respect to potential function $\\Phi$ is defined by\n\
    +   \n+     $$\\widehat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1})$$\n+   - The\
    \ total amortized cost of the $n$ operations is\n+   \n+     $$\\sum_{i=1}^{n}\
    \ \\widehat{c}_i = \\sum_{i=1}^{n} (c_i + \\Phi(D_i) - \\Phi(D_{i-1}))$$\n+  \
    \ \n+     $$= \\sum_{i=1}^{n} c_i + \\Phi(D_n) - \\Phi(D_0).$$\n+   - We usually\
    \ just define $\\Phi(D_0)$ to be 0 and then show that $\\Phi(D_i) \\ge 0$ for\
    \ all $i$.\n+   - Different potential functions may yield different amortized\
    \ costs."
