    \ ON-SEGMENT(p1, p2, p4)\n   then return TRUE\n else return FALSE\n```\n\n```\n\
    DIRECTION(p1, p2, p3)\n return (p2 - p1) × (p3 - p1)\n```\n\n```\nON-SEGMENT(pq,\
    \ pr, pi)\n if min(xq, xr) ≤ xi ≤ max(xq, xr) and min(yq, yr) ≤ yi ≤ max(yq, yr)\n\
