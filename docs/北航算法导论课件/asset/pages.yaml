    Proof 1. Let A_ij be a maximum-size subset of mutually Compatible activities in
    S_ij. Order activities in A_ij in monotonically increasing order of finish time.
    Let a_k be the first activity in A_ij.


    +   If a_k = a_m, done (a_m is used in a maximum-size subset).


