- pgno: 345
  md: "# 17.3 The potential method - Stack operations\n\n+   The amortized cost \\\
    (\\hat{c}_i\\) of the $i$th operation with respect to potential function $\\Phi$\
    \ is defined by\n+   \n+   $$\\hat{c}_i = c_i + \\Phi(D_i) - \\Phi(D_{i-1})$$\n\
    \n+   The total amortized cost of the $n$ operations is\n+   \n+   $$\\sum_{i=1}^{n}\
    \ \\hat{c}_i = \\sum_{i=1}^{n} (c_i + \\Phi(D_i) - \\Phi(D_{i-1}))$$\n+   \n+\
    \   $$= \\sum_{i=1}^{n} c_i + \\Phi(D_n) - \\Phi(D_0).$$\n\n+   We define the\
    \ potential function $\\Phi$ on a stack to be the number of objects in the stack.\n\
    +   \n+   - for the empty stack $D_0$ with which we start, we have $\\Phi(D_0)=0$\n\
    +   - after the $i$th operation, for the stack $D_i$, $\\Phi(D_i) \\ge 0$ ?\n\n\
    +   If the $i$th operation on a stack containing $s$ objects is a PUSH operation,\
    \ the potential difference is $\\Phi(D_i) - \\Phi(D_{i-1}) = (s+1) - s = 1.$\n\
    \n+   The amortized cost of this PUSH operation is\n+   \n+   $$\\hat{c}_i = c_i\
    \ + \\Phi(D_i) - \\Phi(D_{i-1}) = 1 + 1 = 2.$$"
