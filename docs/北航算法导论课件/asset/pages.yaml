  md: '# 5.2 Indicator random variables（指示随机变量）


    Lemma


    For an event A, let X_A = I{A}. Then E[X_A]=Pr{A}.


    +   Slightly more complicated example: Determine the expected number of heads
    when in n coin flips.

    +   （投 n 次硬币，正面向上的期望〔平均数〕）


