- pgno: 255
  md: '# Comparison between Divide-and-conquer and Dynamic programming


    |  | Divide-and-conquer | Dynamic programming |

    |---|---|---|

    | **similarity** | solves problems by combining the solutions to subproblems.
    | solves problems by combining the solutions to subproblems. |

    | **difference** | 1) partition the problem into **independent subproblems**,
    2) solve the subproblems **recursively**, 3) **combine** their solutions to solve
    the original problem. | the subproblems are **not independent**, that is, when
    subproblems **share** subsubproblems.（子问题不独立，不同子问题共享相同的子子问题） |

    |  | might do more work than necessary, **repeatedly** solving the common subsubproblems.
    | solves every subsubproblem **just once** and then **saves its answer in a table**,
    avoiding recomputing the answer every time the subsubproblem is encountered. |'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Comparison between Divide-and-conquer and Dynamic programming


    +   - Dynamic programming is typically applied to **optimization problems**.

    +   - Optimization problems

    +     - There can be many possible solutions,

    +     - Each solution has a value,

    +     - We wish to find a solution with the optimal (min or max) value.

    +   - We call such a solution *an* optimal solution to the problem, as opposed
    to *the* optimal solution, since there may be several solutions that achieve the
    optimal value.


    （称问题的某个解为一个最优解，而不是单纯地称为最优解，因为可能有多个解能得出问题的最优值）


