- pgno: 335
  md: "# Stack operations\n\n+   Let us analyze a sequence of n PUSH, POP, and MULTIPOP\
    \ operations on an initially empty stack.\n\n```\nSTACK(S, n)\n    S = NULL\n\
    \    for i←1 to n\n        One of ( PUSH(S, i), POP(S), MULIPOP(S, k) )\n```\n\
    \n+   Running time tightly. O(n)\n\n+   The number of times that POP can be called\
    \ on a nonempty stack, including calls within MULTIPOP, is at most the number\
    \ of PUSH operations, which is at most n. (push一个对象后，至多能被pop一次。至多n次push。)\n\n\
    +   The average cost of an operation is O(n)/n = O(1)\n\n+   In aggregate analysis,\
    \ we assign the amortized cost of each operation to be the average cost.\n\n+\
    \   For STACK operations, the average cost (the running time) of a stack operation\
    \ is O(1), we did not use probabilistic reasoning.\n\n+   Dividing this total\
