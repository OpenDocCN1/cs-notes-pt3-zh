  md: '# Incrementing a binary counter


    +   - Consider the problem of implementing a k-bit binary counter that counts
    upward from 0.

    +   - We use an array A[0 .. k-1] of bits as the counter. (使用位数组作为计数器)

    +   - A number x that is stored in the counter has its lowest-order bit in A[0]
    and its highest-order bit in A[k-1], so that

    +     $$x = \sum_{i=0}^{k-1} A[i] \cdot 2^{i}$$

    +   - Initially, x = 0, and thus A[i] = 0 for i = 0, 1, ..., k-1.

    +   - To add 1 (modulo 2^k) to the value in the counter, we use the following
    procedure.


    ```

    INCREMENT(A)

    1  i = 0      // index of A

    2  while i < A.length and A[i] == 1

    3      A[i] = 0

    4      i = i + 1

    5  if i < A.length

    6      A[i] = 1

    ```


