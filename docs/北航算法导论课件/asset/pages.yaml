  md: '# 4.1.4 Changing variables


    +   - **algebraic manipulation**: sometimes solute an unknown recurrence similar
    to one you have seen before.


    Example, $T(n) = 2T(\lfloor\sqrt{n}\rfloor) + \lg n$,


    which looks difficult. Simplify the recurrence with a **change of variables**.
    For convenience, we shall not worry about rounding off values, such as $\sqrt{n}$,
    to be integers.


    Let $m = \lg n$, then $T(2^m) = 2T(2^{m/2}) + m$.


    Thus rename $S(m) = T(2^m)$ => $S(m) = 2S(m/2) + m$,


    which is very much like recurrence (4.4) and has the same solution: $S(m) = O(m
    \lg m)$. Changing back from $S(m)$ to $T(n)$, we obtain $T(n) = T(2^m) = S(m)
    = O(m \lg m) = O(\lg n \lg \lg n)$.'
