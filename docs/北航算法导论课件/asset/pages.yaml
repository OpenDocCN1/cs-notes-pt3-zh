- pgno: 2
  md: '# First Example: Identifying Genes in Human DNA


    +   - Identifying all the 100,000 genes in human DNA

    +     - determining the sequences of the 3 billion(10⁹) chemical base pairs that
    make up human DNA.

    +     - Insertion sort: running time n²

    +       \(\frac{3\times10^9 \times 3\times10^9 \text{instruc}}{10^9 \text{instruc/s}}
    = 9\times10^9 \text{seconds} = \frac{9\times10^9}{60\times60\times24\times365}
    \text{ y} \approx 285.39 \text{years}\)


    +   - Merge sort: running time n lgn

    +     \(\frac{3\times10^9 \times \lg(3\times10^9) \text{instruc}}{10^9 \text{instruc/s}}
    = 3\times \lg(3\times10^9) \text{seconds} \approx 94.45 \text{seconds}\)


    +   - The both sort methods are feasible in reason

    +   - But insertion sort is impractical'
