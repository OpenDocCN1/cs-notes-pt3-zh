- pgno: 410
  md: "# Step 3: Computing the length of an LCS\n\nX_m = <x₁, x₂, ..., x_m>\nY_n =\
    \ <y₁, y₂, ..., y_n>\n\nc[i, j] = \n{ 0 (if i = 0 or j = 0),\n  c[i-1, j-1] +\
    \ 1,\n    (if i, j > 0 and x_i = y_j),\n  max(c[i-1, j], c[i, j-1]),\n    (if\
    \ i, j > 0 and x_i ≠ y_j). }\n\nUse table b[1..m, 1..n]\nto simplify construction\n\
    of an optimal solution.\n(使用b表构造最优解)\n\n```\nLCS-LENGTH(X, Y)        // X and\
    \ Y as inputs\n1  m ← length[X]\n2  n ← length[Y]\n3  for i ← 1 to m        //\
    \ Table c[0..m, 0..n] stores c[i,j],\n4    do c[i, 0] ← 0      // computed in\
    \ row-major order.\n5  for j ← 0 to n\n6    do c[0, j] ← 0\n7  for i ← 1 to m\n\
    8    for j ← 1 to n\n9      if x_i = y_j\n10       c[i, j] ← c[i-1, j-1] + 1\n\
