- pgno: 555
  md: 'We will use only **additions, subtractions, multiplications,** and **comparisons**.
    We need neither division nor trigonometric functions, both of which can be computationally
    expensive and prone to problems with round-off error.


    ![](img/09c68ab421cfce4995ddad1430ef2637_555_0.png)


    For example,


    +   - the "straightforward" method of determining whether two segments **intersect**
    (相交)

    +     - Compute the line equation of the form $y=mx+b$ for each segment ($m$ is
    the **slope** (斜率) and $b$ is the $y$-intercept ($y$ 轴截距)),

    +     - find the point of intersection of the lines (uses division to find the
    point of intersection),

    +     - and check whether this point is on both segments.

    +   - When the segments are nearly parallel, this method is very sensitive to
    the precision of the division operation on real computers.


    $\begin{cases} y=m_1x+b_1 \\ y=m_2x+b_2 \end{cases} \quad\Rightarrow\quad x=\frac{b_2-b_1}{m_1-m_2},\
    y=\frac{m_1b_2-m_2b_1}{m_1-m_2}$


    The method in this section, which avoids division, is much more accurate.'
