- pgno: 26
  md: '# 1.2.1 Efficiency


    3. Efficient algorithm gains much more from the hardware improvement. For example,


    +   - Suppose that the computer makes one basic step per second (ν=1). Algorithm
    A and B use the same computer. Algorithm A runs as (n_A)², and B as 100n_B.


    +   - If an application requires you to complete as many items as possible in
    one hour (t= 3600 sec).


    +   - Thus if A can make n_A items, and B makes n_B items, then ν t = 3600 = (n_A)²
    = 100n_B yields n_A = 60 and n_B = 36.


    +   - But suppose that you replace the computer with one that is hundred times
    as fast. So you can make 360000 steps in the same time. Then 360000 = (n_A)² =
    100n_B yields n_A = 600 and n_B = 3600.


    Algorithm B gains much more from the faster computer than A !!!'
  merge: -1
  img_proc: true
