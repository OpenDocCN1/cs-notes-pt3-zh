  md: '# Step 3: Computing the expected search cost


    A_i ... A_r ... A_j


    ![](img/09c68ab421cfce4995ddad1430ef2637_319_0.png)


    ![](img/09c68ab421cfce4995ddad1430ef2637_319_1.png)


    ```

    e[i, j] = { q_{i-1} if j = i-1, min_{i ≤ r ≤ j} { e[i, r-1] + e[r+1, j] + w[i,
    j] } if i ≤ j. (15.19)

    ```


    +   - Similarity: optimal BST and matrix-chain multiplication.


    +   - A direct, recursive implementation would be as inefficient.


    +   - Store the e[i,j] values in a table e[1.. n+1, 0.. n].


    +     - The first index runs to n+1, in order to have a subtree containing only
    d_n, need to compute and store e[n+1, n].


    +     - The second index starts from 0, in order to have a subtree containing
    only d_0, need to compute and store e[1, 0].


    +   - Use a table root[i,j], for recording the root of the subtree containing
    keys k_i, ..., k_j, only for 1 ≤ i ≤ j ≤ n.'
