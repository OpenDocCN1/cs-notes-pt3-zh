    +   Otherwise, construct B_ij = A_ij - {a_k} ∪ {a_m} (replace a_k by a_m). Activities
    in B_ij are disjoint. (Activities in A_ij are disjoint, a_k is the first activity
    in A_ij to finish. f_m ≤ f_k ⇒ a_m doesn’t overlap anything else in B_ij). Since
    |B_ij| = |A_ij| and A_ij is a maximum-size subset, so is B_ij.'
