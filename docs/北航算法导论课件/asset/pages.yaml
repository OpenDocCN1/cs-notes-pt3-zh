- pgno: 172
  md: "# Exam2  Multiplication of two integers（整数相乘）\n\ntwo *n*-digit numbers X and\
    \ Y, Complexity(X × Y) = ?\n\n# Divide and Conquer algorithm\n\nLet        X =\
    \ a b ,        Y = c d\nthen       XY = (10^m a+b)(10^m c+d) = 10^(2m)ac + 10^m(bc+ad)\
    \ + bd\n\n```\nMultiply(X; Y; n):\nif n = 1\n    return X×Y\nelse\n    m = ⌈n/2⌉\n\
    \    a = ⌊X/10^m⌋; b = X mod 10^m\n    c = ⌊Y/10^m⌋; d = Y mod 10^m\n    e = Multiply(a;\
    \ c; m)\n    f = Multiply(b; d; m)\n    g = Multiply(b; c; m)\n    h = Multiply(a;\
    \ d; m)\n    return 10^(2m)e + 10^m(g + h) + f\n```\n\nComplexity analysis:\n\
    T(1)=1,\nT(n)=4T(⌈n/2⌉)+O(n).\nApplying Master Theorem,\nwe have\nT(n)=O(n^2).\n\
    \n![](img/09c68ab421cfce4995ddad1430ef2637_172_0.png)"
