  md: "# 17.2 The accounting method - Incrementing a binary counter\n\n+   - Let us\
    \ charge an amortized cost of 2 dollars to set a bit to 1. When a bit is set,\
    \ we use 1 dollar (out of the 2 dollars charged) to pay for the actual setting\
    \ of the bit, and we place the other dollar on the bit as credit to be used later\
    \ when we flip the bit back to 0. At any point in time, every 1 in the counter\
    \ has a dollar of credit on it, and thus we can charge nothing to reset a bit\
    \ to 0.\n+   - The amortized cost of an INCREMENT operation is at most 2 dollars.\n\
    +   - For *n* INCREMENT operations, the total amortized cost is *O(n)*, which\
    \ bounds the total actual cost.\n\n```\nCOUNTER(A, n)\n    A = 0\n    for j ←\
    \ 1 to n\n        INCREMENT(A)\n```\n\n```\nINCREMENT(A)\n1    i = 0\n2    while\
    \ i < A.length and A[i] == 1\n3        A[i] = 0\n4        i = i + 1\n5    if i\
    \ < A.length\n6        A[i] = 1\n```\n\n| Counter value | A[7] | A[6] | A[5] |\
    \ A[4] | A[3] | A[2] | A[1] | A[0] | Total cost |\n|---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|---:|\n\
