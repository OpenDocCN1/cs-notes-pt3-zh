  md: '# 16.2.3 Greedy vs. dynamic programming


    ![](img/09c68ab421cfce4995ddad1430ef2637_457_0.png)


    ![](img/09c68ab421cfce4995ddad1430ef2637_457_1.png)


    ![](img/09c68ab421cfce4995ddad1430ef2637_457_2.png)


    +   - Fractional knapsack problem has the greedy-choice property, and the 0-1
    knapsack problem does not.

    +   - To solve the fractional problem, rank decreasingly items by v_i/w_i

    +   - Let v_i/w_i ≥ v_{i+1}/w_{i+1} for all i

    +   - Time: O(n lg n) to sort, O(n) to greedy choice thereafter.


    ```

    FRACTIONAL-KNAPSACK(v,w,W)

    1 load ← 0

    2 i ← 1

    3 while load < W and i ≤ n

    4   if w_i ≤ W - load

    5     take all of item i

    6   else take W-load of w_i from item i

    7   add what was taken to load

    8   i ← i + 1

    ```'
