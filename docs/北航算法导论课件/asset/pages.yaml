  md: '# 4.2 The iteration method


    +   - The iteration method usually leads to lots of algebra. It can be a challenge.
    The key points:

    +     - the number of times the recurrence needs to be iterated to reach the boundary
    condition, (迭代次数)

    +     - and the sum of the terms arising from each level of the iteration process.
    (级数求和)


    +   - Sometimes, in the process of iterating a recurrence, you can guess the solution
    without working out all the math. Then, the iteration can be abandoned in favor
    of the substitution method, which usually requires less algebra.

