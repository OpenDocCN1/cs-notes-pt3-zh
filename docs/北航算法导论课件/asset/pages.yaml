  md: '# 16.3 Huffman codes


    +   - **Wish to store compactly 100,000-character data file**

    +     - Only six different characters appear.

    +     - `abaaaabbbdcffaeaaeecc.......`

    +     - `ccdaecffdaecffabbceacfea......`

    +     - Frequency table:


    |  | a | b | c | d | e | f |

    |---|---:|---:|---:|---:|---:|---:|

    | Frequency (in thousands) | 45 | 13 | 12 | 16 | 9 | 5 |

    | Fixed-length codeword | 000 | 001 | 010 | 011 | 100 | 101 |

    | Variable-length codeword | 0 | 101 | 100 | 111 | 1101 | 1100 |


    +   - Many ways (encodes) to represent such a file of information

    +   - *binary character code* (or code for short): each character is represented
    by a unique binary string.

    +     - *fixed-length code*: if use 3-bit codeword, the file can be encoded in
    300,000 bits. Can we do better?'
