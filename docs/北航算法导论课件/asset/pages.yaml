  md: '# 5.2 Indicator random variables（指示随机变量）


    ![](img/09c68ab421cfce4995ddad1430ef2637_204_0.png)


    Given a sample space and an event A, we define the indicator random variable（给定采样空间和事件
    A，指示随机变量…）


    $$I\{A\}=\begin{cases}1 & \text{if A occur,}\\0 & \text{if A does not occur.}\end{cases}$$


    ▢  *Lemma*


    For an event, let $X_A=I\{A\}$. Then $E[X_A]=Pr\{A\}$.


    *Proof* Letting ~A be the complement of A, we have

    $$E[X_A]=E[I\{A\}]$$

    $$\qquad=1\cdot Pr\{A\}+0\cdot Pr\{~A\}\qquad\text{\{definition of expected value\}}$$

    $$\qquad=Pr\{A\}.$$'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 5.2 Indicator random variables (指示随机变量)


    Lemma


    For an event A, let X_A = I{A}. Then E[X_A]=Pr{A}.


    Simple example: Determine the expected number of heads when we flip a fair coin
    one time.


    （投一次硬币，正面向上的期望〔平均数〕）


    +   - Sample space is {H, T}


    +   - Pr{H} = Pr{T} = 1/2


    +   - Define indicator random variable X_H = I{H}. X_H counts the number of heads
    in one flip.


    +   - Since Pr{H} =1/2, lemma says that E[X_H] = 1/2 .'
