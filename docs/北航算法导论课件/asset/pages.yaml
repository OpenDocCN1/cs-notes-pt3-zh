    o(g(n)) = {f(n): for any positive constants c>0, there exits a constant n₀>0 such
    that 0≤f(n)<c g(n) for all n≥n₀}.


    +   - The definitions of O-notation and o-notation are similar.


    +   - The main difference


    +     - In f(n)=O(g(n)), the bound 0≤f(n)≤c g(n) holds for some constant c>0


