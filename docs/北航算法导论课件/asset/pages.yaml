    RECURSIVE-FFT(a)

    1  n = a.length          // n is a power of 2

    2  if n == 1

    3      return a

    4  ω_n = e^{2πi/n}

    5  ω = 1

    6  a^[0] = (a₀, a₂, ..., a_{n-2})

    7  a^[1] = (a₁, a₃, ..., a_{n-1})

    8  y^[0] = RECURSIVE-FFT(a^[0])

    9  y^[1] = RECURSIVE-FFT(a^[1])

    10 for k = 0 to n/2 - 1

    11     y_k = y_k^[0] + ω y_k^[1]

    12     y_{k+(n/2)} = y_k^[0] - ω y_k^[1]

    13     ω = ω ω_n

    14 return y                // y is assumed to be a column vector

    ```


    (ω_n^0)² , (ω_n^1)² , ⋯ , (ω_n^{n/2-1})²

    (ω_n^{0+n/2})² , (ω_n^{1+n/2})² , ⋯ , (ω_n^{n/2-1+n/2})²


    ω_{n/2}^0 , ω_{n/2}^1 , ⋯ , ω_{n/2}^{n/2-1}


    Line 8-9

    y_k^[0] = A^[0](ω_{n/2}^k) = A^[0](ω_n^{2k}),

    y_k^[1] = A^[1](ω_{n/2}^k) = A^[1](ω_n^{2k}).

    Line 11

    y_k = y_k^[0] + ω_n^k y_k^[1]

    = A^[0](ω_n^{2k}) + ω_n^k A^[1](ω_n^{2k}) = A(ω_n^k)'
