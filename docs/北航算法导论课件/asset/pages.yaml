  md: "# 16.2.3 Greedy vs. dynamic programming\n\n+   - **0-1 knapsack problem** （0-1背包问题，小偷问题）\n\
    +   - **Fractional knapsack problem** （分数背包问题，小偷问题）\n+   - **Both have optimal\
    \ substructure property.**\n+     - 0-1：？\n+     - fractional: choose a weight\
    \ *w* from item *j* (part of *j*), then remove the part, the remaining load is\
    \ the most valuable load weighing at most *W-w* that the thief can take from the\
    \ *n-1* original items plus *wⱼ-w* pounds from item *j*.\n+   \n+       （若先选 item\
    \ *j* 的一部分，其重 *w*，则接下来的最优挑选方案为从余下的 *n-1* 个物品〔除 *j* 外〕和 *j* 的另外重量 *wⱼ-w* 的部分中挑选，其重量不超过\
    \ *W-w*）\n+   - **But the fractional problem has the _greedy-choice_ property,\
    \ and the 0-1 problem does not.**"
