- pgno: 563
  md: '# ### 33.3 Finding the convex hull


    CH(Q), the *convex hull* of a set Q of points, is the smallest convex polygon
    P for which each point in Q is either on the boundary of P or in its interior.


    Intuitively, we can think of each point in Q as being a nail sticking out from
    a board. The convex hull is then the shape formed by a tight rubber band that
    surrounds all the nails (See Figure 33.6).


    ![](img/09c68ab421cfce4995ddad1430ef2637_563_0.png)


    Figure 33.6: A set of points $Q = \{p_0, p_1, \ldots, p_{12}\}$ with its convex
    hull $\mathrm{CH}(Q)$ in gray.'
  merge: -1
  img_proc: true
- pgno: 564
  md: 'Computing the convex hull of a set of points is an interesting problem in its
    own right. Moreover, algorithms for some other computational-geometry problems
    start by computing a convex hull. Consider, for example, the two-dimensional farthest-pair
    problem (Exer 33.3-3).


    ![](img/09c68ab421cfce4995ddad1430ef2637_564_0.png)


    Some algorithms that compute the convex hull of a set of n points:


    +   - Graham''s scan, runs in O(n lgn) time

    +   - Jarvis''s march, runs in O(nh) time, where h is the number of vertices of
    the convex hull.

    +   - Additional several methods

    +     - incremental method, O(n lg n)

    +     - divide-and-conquer method, O(n lg n)

    +     - prune-and-search method, O(n lg h)'
  merge: -1
  img_proc: true
- pgno: 565
  md: "# Graham's scan\n\n+   - By maintaining a stack S of candidate points consecutive\
    \ segments turn left or right\n+     - Each point of the input set Q is pushed\
    \ once onto the stack.\n+     - The points that are not vertices of CH(Q) are\
    \ eventually popped from the stack\n+     - When the algorithm terminates, stack\
    \ S contains exactly the vertices of CH(Q), in counterclockwise order of their\
    \ appearance on the boundary.\n\n```\nGRAHAM-SCAN(Q)\n1. let p0 be the point in\
    \ Q with the minimum y-coordinate,\n   or the leftmost such point in case of a\
    \ tie\n2. let <p1, p2, ..., pm> be the remaining points in Q,\n   sorted by polar\
    \ angle in counterclockwise\n   around p0 (if more than one point has the same\
    \ angle,\n   remove all but the one that is farthest from p0)\n3. PUSH(p0, S)\n\
    4. PUSH(p1, S)\n5. PUSH(p2, S)\n6. for i ← 3 to m\n7.   while (the consecutive\
    \ segments formed by points\n         NEXT-TO-TOP(S), TOP(S), and pi\n       \
    \  make a nonleft turn)\n8.     POP(S)\n9.   PUSH(pi, S)\n10. return S\n```\n\n\
    ![](img/09c68ab421cfce4995ddad1430ef2637_565_0.png)"
  merge: -1
  img_proc: true
