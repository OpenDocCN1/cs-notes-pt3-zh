- pgno: 257
  md: "# Comparison between Divide-and-conquer and Dynamic programming\n\n+   - **The\
    \ development of a dynamic-programming algorithm can be broken into a sequence\
    \ of four steps.**\n+     1. **Characterize** the structure of an optimal solution.\n\
    +     2. **Recursively** define the value of an optimal solution.\n+     3. Compute\
    \ the value of an optimal solution in a **bottom-up** fashion.\n+     4. **Construct\
    \ an optimal solution from computed information.**\n\n+   - **Step 4 can be omitted\
    \ if only the value of an optimal solution is required.** When we do perform step\
    \ 4, we sometimes **maintain additional information** during the computation in\
    \ step 3 to ease the construction of an optimal solution.\n+   \n+     （当仅需求最优值时step\
    \ 4通常可以省略。为了执行step 4【更容易第构造最优解】，通常在执行step 3时记录必要的信息）"
  merge: -1
