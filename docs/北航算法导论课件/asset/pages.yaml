    \ to the running time.\n\n+   - **Combine**: MERGE procedure shows C(n)=Θ(n).\n\
    \nT(n) = { Θ(1) if n = 1\n  2T(n / 2) + Θ(n) if n > 1 }\n\n```\nMERGE-SORT(A,\
