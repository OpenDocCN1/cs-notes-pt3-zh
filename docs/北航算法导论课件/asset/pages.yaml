  md: "# 17.3 The potential method - Incrementing a binary counter\n\n+   - We define\
    \ the potential Φ of the counter after the i-th INCREMENT operation to be b_i,\
    \ the number of 1s in the counter after the i-th operation. (第i次操作后，势函数b_i为计数器中1的个数)\n\
    +   - Suppose that the i-th INCREMENT operation resets t_i bits (from 1 to 0).\
    \ The actual cost of the operation is therefore at most t_i+1, since in addition\
    \ to resetting t_i bits, it sets at most one bit to 1.\n+     - If b_i = 0, then\
    \ the i-th operation resets all k bits, and so b_{i-1} = t_i = k.\n+     - If\
    \ b_i > 0, then b_i = b_{i-1} - t_i + 1. (t_i 个1变为0，1个0变为1)\n+     - In either\
    \ case, b_i ≤ b_{i-1} - t_i + 1, and the potential difference is Φ(D_i) - Φ(D_{i-1})\
    \ ≤ (b_{i-1} - t_i + 1) - b_{i-1} = 1 - t_i.\n+   - The amortized cost is therefore\n\
    +     \n+     ĉ_i = c_i + Φ(D_i) - Φ(D_{i-1}) ≤ (t_i + 1) + (1 - t_i) = 2."
