- pgno: 554
  md: 'We shall explore the following questions:


    +   1. Given two directed segments $\overrightarrow{p_0p_1}$ and $\overrightarrow{p_0p_2}$,
    is $\overrightarrow{p_0p_1}$ clockwise from $\overrightarrow{p_0p_2}$ with respect
    to their common endpoint $p_0$?

    +   2. Given two line segments $\overrightarrow{p_0p_1}$ and $\overrightarrow{p_1p_2}$,
    if we traverse $\overrightarrow{p_0p_1}$ and then $\overrightarrow{p_1p_2}$, do
    we make a left turn at point $p_1$?

    +   3. Do line segments $\overline{p_1p_2}$ and $\overline{p_3p_4}$ intersect?


    ![](img/09c68ab421cfce4995ddad1430ef2637_554_0.png)


    We can answer each question in O(1) time.


    Moreover, our methods will use only additions, subtractions, multiplications,
    and comparisons. We need neither division nor trigonometric functions, both of
    which can be computationally expensive and prone to problems with round-off error.


    For example, ...'
