  md: "# Exam3  Multiplication of two matrices（矩阵相乘）\n\ntwo $n \\times n$ matrices\
    \ A and B, Complexity(C=A × B) = ?\n\n+   - **Standard method**\n+   \n+     $c_{ij}=\\\
    sum_{k=1}^{n}a_{ik}b_{kj}$\n\n```\nMATRIX-MULTIPLY(A, B)\nfor i ← 1 to n\n   \
    \ for j ← 1 to n\n        C[i, j] ← 0\n        for k ← 1 to n\n            C[i,\
    \ j] ← C[i, j] + A[i, k]·B[k, j]\nreturn C\n```\n\n**Complexity:**\n$O(n^3)$ multiplications\
    \ and additions.\n\n$T(n)=O(n^3)$."
