    Lemma 30.6 (Summation lemma, 求和引理)

    For any integer n≥1 and nonnegative integer k not divisible by n , (k ≠ m·n),
    we have

    ∑_{j=0}^{n-1} (ω_n^k)^j = 0.


    Theorem 30.7

    For j, k = 0, 1, …, n-1, the (j, k) entry of V_n^{-1} is ω_n^{-kj} / n.


    Proof We show that V_n^{-1} V_n = I_n


    [V_n^{-1} V_n]_{j j''} = ∑_{k=0}^{n-1} (ω_n^{-kj} / n)(ω_n^{k j''}) = ∑_{k=0}^{n-1}
    ω_n^{k(j'' - j)} / n = { 1 if j'' = j

    0 if j'' ≠ j }


    since -(n-1) < j'' - j < n-1, apparently j'' - j ≠ m n, if m ≠ 0'
