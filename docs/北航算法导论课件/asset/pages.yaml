- pgno: 583
  md: '# 34.4 RSA encryption


    ![](img/09c68ab421cfce4995ddad1430ef2637_583_0.png)


    # RSA public-key cryptosystem


    +   1. Select at random two large prime numbers *p* and *q* such that *p* ≠ *q*.
    The primes *p* and *q* might be, say, 512 bits each, 1024, or more.

    +   2. Compute *n* by the equation *n = p q*.

    +   3. Let *φ(n) = (p - 1)(q - 1)*.

    +   4. Select a small odd integer *e* that is relatively prime to *φ(n)*, i.e.,
    gcd(*e*, *φ(n)*)=1.

    +   5. Compute *d* as the multiplicative inverse of *e*, modulo *φ(n)*, i.e.,
    *e d ≡ 1 (mod φ(n))*.

    +   6. Publish the pair *P = (e, n)* as his *RSA public key*.

    +   7. Keep secret the pair *S = (d, n)* as his *RSA secret key*.'
  merge: -1
  img_proc: true
- pgno: 584
  md: '# Why is RSA encryption effective


    ![](img/09c68ab421cfce4995ddad1430ef2637_584_0.png)


    # RSA public-key cryptosystem


    +   1. Select two large prime numbers p and q, p ≠ q.

    +   2. Compute n = p q.

    +   3. Compute φ(n) = (p - 1)(q - 1).

    +   4. Select a small odd integer e, s.t., gcd(e, φ(n))=1.

    +   5. Compute d, by the equation e d ≡ 1(mod φ(n))

    +   6. Publish the pair P = (e, n) as his RSA public key.

    +   7. Keep secret the pair S = (d, n) as his RSA secret key.


    # RSA is correct


    Theorem 31.36:

    S(P(M)) = S( M^e (mod n) ) = (M^e (mod n) )^d (mod n) = M^{ed} (mod n)

    = M^{1+k φ(n)} (mod n) = M M^{k φ(n)} (mod n) = M (M^{(p-1)})^{k(q-1)} (mod n)
    ... = M (mod n)

    (by Theorem31.31, Fermat’s Theorem, if p is prime, M^{(p-1)} = 1 (mod n))'
  merge: -1
  img_proc: true
- pgno: 585
  md: '# Why is RSA encryption effective


    ![](img/09c68ab421cfce4995ddad1430ef2637_585_0.png)


    +   - **RSA public-key cryptosystem**

    +     1. Select two large prime numbers p and q, p ≠ q.

    +     2. Compute n = pq.

    +     3. Compute φ(n) = (p - 1)(q - 1).

    +     4. Select a small odd integer e, s.t., gcd(e, φ(n))=1.

    +     5. Compute d, by the equation ed ≡ 1(mod φ(n))

    +     6. Publish the pair P = (e, n) as his RSA public key.

    +     7. Keep secret the pair S = (d, n) as his RSA secret key.


    # RSA is secure


    S(P(M)) = S( M^e (mod n) ) = M^{ed} (mod n) = ... = M


    +   - If factoring n is easy, breaking the RSA cryptosystem is easy.

    +   - Conversely, that if factoring large integers is hard, then breaking RSA
    is hard, is unproven.

    +   - After two decades of research, however, no easier method has been found
    to break the RSA public-key cryptosystem than to factor n.

    +   - In fact, the factoring of large integers is surprisingly difficult.'
  merge: -1
  img_proc: true
