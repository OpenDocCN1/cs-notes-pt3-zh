  md: "# Step 1: Characterizing an LCS\n\n![](img/09c68ab421cfce4995ddad1430ef2637_403_0.png)\n\
    \n□ **Theorem 15.1: (Optimal substructure of an LCS)**  \nLet $Z=\\langle z_1,\\\
    ldots,z_k\\rangle$ be any LCS of $X=\\langle x_1,\\ldots,x_m\\rangle$ and $Y=\\\
    langle y_1,\\ldots,y_n\\rangle$.\n\n+   2. If $x_m\\ne y_n$, then $z_k\\ne x_m\
    \ \\Rightarrow Z$ is an LCS of $X_{m-1}$ and $Y$.\n+   3. If $x_m\\ne y_n$, then\
    \ $z_k\\ne y_n \\Rightarrow Z$ is an LCS of $X$ and $Y_{n-1}$.\n\n# Proof:\n\n\
    2. If $z_k\\ne x_m$, then $Z$ is a CS of $X_{m-1}$ and $Y$. Suppose there exists\
    \ a subsequence $W$ of $X_{m-1}$ and $Y$ with length $>k$. Then $W$ is a CS of\
    \ $X$ and $Y \\Rightarrow$ contradicts $Z$ being an LCS.\n\n（若$z_k\\ne x_m$，则$Z$是$X_{m-1}$和$Y$的一个CS。设存在一个$X_{m-1}$和$Y$的子序列$W$，其length$(W)>k$，那么，$W$是$X$和$Y$的一个CS\
    \ ⇒ 与题设$Z$是一个LCS矛盾）\n\n3. Symmetric to 2."
