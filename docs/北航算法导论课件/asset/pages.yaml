    +   - The bound 2n²=O(n²) is asymptotically tight, but the bound 2n=O(n²) is not.

    +   - The o-notation denotes an upper bound that is not asymptotically tight.
    Formally, define o(g(n)) as the set


    （非渐近紧的上界）


    o(g(n)) = {f(n): for any positive constants c>0, there exits a constant n₀>0 such
    that 0≤f(n)<c g(n) for all n≥n₀}.


    For example, 2n=o(n²), but 2n²≠o(n²).'
