- pgno: 406
  md: '# Step 2: A recursive solution


    +   - Theorem 15.1 implies that there are either one or two subproblems to examine
    when finding an LCS of X and Y.

    +     （当求 an LCS时，定理表明了有一个或两个子问题需要考虑）

    +   - Let c[i,j] be the length of an LCS of X_i and Y_j (c[i,j]=0, i,j=0).


    X_i = <x_1, x_2, ..., x_i>

    Z_k = <z_1, z_2, ..., z_k>

    Y_j = <y_1, y_2, ..., y_j>


    x_i = y_j


    X_{i-1} = <x_1, x_2, ..., x_{i-1}>

    Z_{k-1} = <z_1, z_2, ..., z_{k-1}>

    Y_{j-1} = <y_1, y_2, ..., y_{j-1}>


    c[i,j] = c[i-1,j-1] + 1


    x_i ≠ y_j

    z_k ≠ x_i


    X_{i-1} = <x_1, x_2, ..., x_{i-1}>

    Z_k = <z_1, z_2, ..., z_k>

    Y_j = <y_1, y_2, ..., y_j>


    c[i,j] = max( c[i-1,j], c[i,j-1] )


    x_i ≠ y_j

    z_k ≠ y_j


    X_i = <x_1, x_2, ..., x_i>

    Z_k = <z_1, z_2, ..., z_k>

    Y_{j-1} = <y_1, y_2, ..., y_{j-1}>'
  merge: -1
