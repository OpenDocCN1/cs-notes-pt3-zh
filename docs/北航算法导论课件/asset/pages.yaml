  md: "# Step 2: A recursive solution\n\n![](img/09c68ab421cfce4995ddad1430ef2637_318_0.png)\n\
    \n+   - Choose $k_r$ as the root that gives the lowest expected search cost, giving\
    \ us our final recursive formulation:\n+   \n+     $$e[i,j] = \\begin{cases} q_{i-1},\
    \ & \\text{if } j=i-1, \\\\ \\displaystyle\\min_{i\\le r\\le j}\\{e[i,r-1]+e[r+1,j]+w[i,j]\\\
    }, & \\text{if } i\\le j. \\end{cases} \\tag{15.19}$$\n\n+   - $e[i,j]$ give the\
    \ expected search costs in optimal BST.\n\n+   - To help us keep track of the\
    \ structure of optimal BST, define $root[i,j]$, for $1\\le i\\le j\\le n$, to\
    \ be the index $r$ for which $k_r$ is the root of an optimal BST containing keys\
