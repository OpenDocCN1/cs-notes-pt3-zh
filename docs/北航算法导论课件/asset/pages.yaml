    Alphabet C, each character c ∈ C has frequency f[c]. x and y ∈ C, and having the
    lowest frequencies. C′ = C-{x, y} ∪ {z}. Define f for C′ as for C, except that
    f[z]=f[x]+f[y]. Let T′ be any tree representing an optimal prefix code for the
    alphabet C′. Then the tree T, obtained from T′ by replacing the leaf node for
    z with an internal node having x and y as children, represents an optimal prefix
    code for C.


