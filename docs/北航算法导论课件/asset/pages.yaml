    } n > 1. \end{cases}$


    (1) Guess: $T(n) = n \lg n + n$


    (2) Induction


    **Basic:** $n = 1 \Rightarrow n \lg n + n = 1 = T(n)$


    **Inductive step:** Inductive hypothesis is that $T(k) = k \lg k + k$ for all
