- pgno: 121
  md: '# 3.1.6 ω-notation: lower bound but not asymptotically tight


    +   - ω-notation is to Ω-notation as o-notation is to O-notation.

    +   - The ω-notation denotes an lower bound that is not asymptotically tight.
    Formally, define ω(g(n)) as the set ω(g(n)) = {f(n): for any positive constants
    c>0, there exists a constant n₀>0 such that 0≤c g(n)<f(n) for all n≥n₀}.


    One way to define it is by f(n) ∈ ω(g(n)) if and only if g(n) ∈ o(f(n))


    For example, n²/2 = ω(n), but n²/2 ≠ ω(n²).


