- pgno: 470
  md: "# 16.3.2 Constructing a Huffman code\n\n**Huffman code:**  \na greedy algorithm\
    \  \nthat constructs an  \noptimal prefix code\n\n```\nHUFFMAN(C)\n1  n ← |C|\n\
    2  Q ← C\n3  for i ← 1 to n − 1\n4      allocate(分配) a new node z\n5      left[z]\
    \ ← x ← EXTRACT-MIN(Q)\n6      right[z] ← y ← EXTRACT-MIN(Q)\n7      f[z] ← f[x]\
    \ + f[y]\n8      INSERT(Q, z)\n9  return EXTRACT-MIN(Q)  //return the root of\
    \ the tree.\n```\n\n+   - **C**: set of *n* characters, *c* ∈ **C**: an object\
    \ with frequency *f*[*c*].\n+     - Build the tree *T* corresponding to the optimal\
    \ code.\n+     - Begin with |*C*| leaves, perform |*C*|−1 “merging” operations.\n\
    +     - A min-priority queue *Q*, keyed on *f*, is used to identify the two least-frequent\
    \ objects to merge together. Result of the merger is a new object whose frequency\
    \ is the sum of the frequencies of the two objects that were merged."
  merge: -1
  img_proc: true
- pgno: 471
  md: '# 16.3.2 Constructing a Huffman code


    Example:

    Huffman''s algorithm proceeds. 6 letters,

    5 merge steps.

    The final tree represents the optimal prefix code.


    ```

    HUFFMAN(C)

    1 n ← |C|

    2 Q ← C

    3 for i ← 1 to n - 1

    4   allocate(分配) a new node z

    5   left[z] ← x ← EXTRACT-MIN (Q)

    6   right[z] ← y ← EXTRACT-MIN (Q)

    7   f[z] ← f[x] + f[y]

    8   INSERT(Q, z)

    9 return EXTRACT-MIN(Q) //return the root of the tree.

    ```


