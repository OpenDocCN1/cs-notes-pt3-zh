  md: "# 16.1.1 Optimal substructure of activity selection\n\n![](img/09c68ab421cfce4995ddad1430ef2637_430_0.png)\n\
    \n+   - Suppose that a solution to $S_{ij}$ includes $a_k$. Have 2 sub-problems:\n\
    +     - $S_{ik}$ (start after $a_i$ finishes, finish before $a_k$ starts)\n+ \
    \    - $S_{kj}$ (start after $a_k$ finishes, finish before $a_j$ starts)\n+  \
    \ - Solution to $S_{ij}$ = (solution to $S_{ik}$) ∪ {$a_k$} ∪ (solution to $S_{kj}$)\n\
    +   \n+     Since $a_k$ is in neither of the subproblems, and the subproblems\
    \ are disjoint, $|$ solution to $S$ $| = |$ solution to $S_{ik}$ $| + 1 + |$ solution\
    \ to $S_{kj}$ $|$.\n+   - **Optimal substructure:** If an optimal solution to\
    \ $S_{ij}$ includes $a_k$, then the solutions to $S_{ik}$ and $S_{kj}$ used within\
    \ this solution must be optimal as well. (use usual cut-and-paste argument).\n\
    +   - Let $A_{ij}$ = optimal solution to $S_{ij}$,\n+   \n+     so $A_{ij} = A_{ik}\
    \ \\cup \\{a_k\\} \\cup A_{kj}$,                          (16.2)\n+   \n+    \
