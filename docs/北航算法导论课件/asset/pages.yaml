- pgno: 173
  md: "# Exam2 Multiplication of two integers (整数相乘)\n\ntwo n-digit numbers X and\
    \ Y, Complexity(X × Y) = ?\n\n+   - Divide and Conquer (Karatsuba’s algorithm)\n\
    \nLet X = a b, Y = c d\nthen XY = (10^m a + b)(10^m c + d) = 10^{2m} ac + 10^m\
    \ (bc + ad) + bd\n\nNote that bc + ad = ac + bd − (a − b)(c − d). So, we have\n\
    \n```\nFastMultiply(X; Y; n):\nif n = 1\n    return X×Y\nelse\n    m = ⌈n/2⌉\n\
    \    a = ⌊X/10^m⌋; b = X mod 10^m\n    c = ⌊Y/10^m⌋; d = Y mod 10^m\n    e = FastMultiply(a;\
    \ c; m)\n    f = FastMultiply(b; d; m)\n    g = FastMultiply(a−b; c−d; m)\n  \
    \  return 10^{2m} e + 10^m (e + f − g) + f\n```\n\nComplexity analysis:\nT(1)=1,\n\
    T(n)=3T(⌈n/2⌉)+O(n).\nApplying Master Theorem, we have\nT(n) = O(n^{log₂3}) =\
    \ O(n^{1.59})"
