- pgno: 320
  md: '# Step 3: Computing the expected search cost


    +   - Other table for efficiency.

    +     $e[i,j] = e[i,r-1] + e[r+1,j] + w[i,j]$  (15.18)

    +   - Rather than compute the value of $w[i,j]$ every time we are computing $e[i,j]$—which
    would take $\Theta(j-i)$ additions—we store these values in a table $w[1..n+1,
    0..n]$.

    +     （无需每次计算 $e[i,j]$ 时都计算 $w[i,j]$，...）

    +   - For the base case, we compute $w[i,i-1] = q_{i-1}$ for $1\le i\le n$.

    +   - For $j\ge i$, $w[i,j] = \sum_{l=i}^{j} p_l + \sum_{l=i-1}^{j} q_l = w[i,j-1]
    + p_j + q_j$  (15.20)

    +   - Thus, compute the $\Theta(n^2)$ values of $w[i,j]$ in $\Theta(1)$ time each.

    +   - Inputs: the probabilities $p_1, ..., p_n$ and $q_0, ..., q_n$ and the size
    $n$'
