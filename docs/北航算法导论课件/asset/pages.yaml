    +   - **Divide-and-conquer approach**

    +     （分而治之，各个击破）


    **Recursive** : call themselves recursively one or more times to deal with closely
    related subproblems.


    +   - **Divide** the problem into a number of subproblems.


    +   - **Conquer** the subproblems by solving them recursively. If the subproblem
    sizes are small enough, however, just solve the subproblems in a straightforward
    manner.


    +   - **Combine** the sloutions to the subproblems into the solution for the original
    problem.'
