  md: '# 16.3.1 Prefix codes


    ![](img/09c68ab421cfce4995ddad1430ef2637_469_0.png)


    # Compute # of bits required to encode a file


    +   - Given a tree $T$ corresponding to a prefix code, for each character $c$
    in the alphabet $C$,

    +     - $f(c)$: frequency of $c$ in the file

    +     - $d_T(c)$: depth of $c$’s leaf in the tree (length of the codeword for
    character $c$). Then, # of bits required to encode a file


    $$B(T)=\sum_{c\in C} f(c)d_T(c) \qquad (16.5)$$


    which we define as the *cost* of the tree $T$.'
