    +     - The worst-case running time of an algorithm is an upper bound on the running
    time for any input.

    +     - The worst case occurs fairly often. (in searching a databse) (最坏情况经常发生)

    +     - The “average case” is often roughly as bad as the worst case. (suppose
    that we randomly choose *n* numbers and apply insertion sort.)

    +   - **Average-case or expected running time of an algorithm**

    +     - Probabilistic analysis (Knuth)

    +     - Randomized algorithm'
