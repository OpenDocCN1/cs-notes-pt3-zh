  md: "# 2.3.2 Analyzing divide-and-conquer algorithms\n\nWhen an algorithm contains\
    \ a recursive call to itself, its running time can often be described by a recurrence\
    \ equation or recurrence, which described the overall running time on a problem\
    \ of size n in terms of the running time on smaller inputs.\n\nWe get the recurrence\n\
    \nT(n) = { Θ(1) if n ≤ c\n aT(n / b) + D(n) + C(n) otherwise }\n\n+   D(n) is\
    \ the time of dividing the problem into subproblems.\n\n+   C(n) is the time of\
    \ combining the solutions to the subproblems into the solution to the original\
