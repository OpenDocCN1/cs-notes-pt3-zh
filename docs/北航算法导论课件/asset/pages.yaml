- pgno: 552
  md: 'In this chapter, we look at a few computational-geometry algorithms in two
    dimensions, that is, in the plane.


    Each input object is represented as a set of points {p₁, p₂, p₃, ...}, where each
    pᵢ = (xᵢ, yᵢ) and xᵢ, yᵢ ∈ R. For example, an n-vertex polygon P is represented
    by a sequence p₀, p₁, p₂, ..., pₙ₋₁ of its vertices in order of their appearance
    on the boundary of P.


    ![](img/09c68ab421cfce4995ddad1430ef2637_552_0.png)


    Computational geometry can also be performed in three dimensions, and even in
    higher-dimensional spaces (an application to database), but such problems and
    their solutions can be very difficult to visualize.


    Even in two dimensions, however, we can see a good sample of computational-geometry
    techniques.'
