  md: '# Jarvis''s march


    +   - *Jarvis''s march* computes the convex hull of a set Q of points by a technique
    known as *package wrapping* (or *gift wrapping*).

    +   - The algorithm runs in time O(nh), where h is the number of vertices of CH(Q).

    +   - Is Jarvis''s march asymptotically faster than Graham''s scan, whose running
    time is O(n lgn)?


    ![](img/09c68ab421cfce4995ddad1430ef2637_568_0.png)'
  merge: -1
