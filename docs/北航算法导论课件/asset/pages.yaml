    \ m₁ − m₂ − m₃) = …\n    = Σ m_k + T(n − Σ m_k)\n\nbasecase: n − Σ m_k = 1, then\
    \ Σ m_k = n − 1, Σ m_k + T(1) = Θ(n)"
