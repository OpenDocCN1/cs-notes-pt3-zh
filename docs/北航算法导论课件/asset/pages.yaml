- pgno: 561
  md: '# Determining whether two line segments intersect


    +   - By checking whether each segment straddles(横跨) the line containing the other.


    +   - Straddles: A segment p1p2 straddles a line if point p1 lies on one side
    of the line and point p2 lies on the other side.


    +   - A boundary case arises if p1 or p2 lies directly on the line.


    +   - Two line segments intersect if and only if either (or both) of the following
    conditions holds:


    +   1. Each segment straddles the line containing the other.

    +   2. An endpoint of one segment lies on the other segment. (This condition comes
    from the boundary case.)


    ![](img/09c68ab421cfce4995ddad1430ef2637_561_0.png)


    Figure 33.3: Cases in the procedure SEGMENTS-INTERSECT.'
  merge: -1
  img_proc: true
- pgno: 562
  md: "+   - SEGMENTS-INTERSECT returns TRUE if segments p1p2 and p3p4 intersect.\
    \ Return FALSE if not.\n+   - Subroutine DIRECTION: computes relative orientations\
    \ using the cross product.\n+   - ON-SEGMENT: determines whether a point known\
    \ to be collinear with a segment lies on that segment.\n\n![](img/09c68ab421cfce4995ddad1430ef2637_562_0.png)\n\
    \nFigure 33.3: Cases in the procedure SEGMENTS-INTERSECT.\n\n```\nSEGMENTS-INTERSECT(p1,\
    \ p2, p3, p4)\n d1 ← DIRECTION(p3, p4, p1)\n d2 ← DIRECTION(p3, p4, p2)\n d3 ←\
    \ DIRECTION(p1, p2, p3)\n d4 ← DIRECTION(p1, p2, p4)\n if ((d1 > 0 and d2 < 0)\
    \ or (d1 < 0 and d2 > 0)) and ((d3 > 0 and d4 < 0) or (d3 < 0 and d4 > 0))\n \
    \  then return TRUE\n else if d1 = 0 and ON-SEGMENT(p3, p4, p1)\n   then return\
    \ TRUE\n else if d2 = 0 and ON-SEGMENT(p3, p4, p2)\n   then return TRUE\n else\
