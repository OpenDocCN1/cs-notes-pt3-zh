    ```

    GRAHAM-SCAN(Q) // T(n) , n = |Q|

    1. let p0 be the point in Q with the minimum y-coordinate, or the leftmost such
    point in case of a tie

    2. let <p1, p2, ..., pm> be the remaining points in Q sorted by polar angle in
    counterclockwise order around p0 (if more than one point has the same angle, remove
    all but the one that is farthest from p0)

    3. PUSH(p0, S)

    4. PUSH(p1, S)

    5. PUSH(p2, S)

    6. for i ← 3 to m (|| m < n

    7. while (the consecutive segments formed by points NEXT-TO-TOP(S), TOP(S), and
    pi makes a nonleft turn)

    8. POP(S)

    9. PUSH(pi, S)

    10. return S

    ```


