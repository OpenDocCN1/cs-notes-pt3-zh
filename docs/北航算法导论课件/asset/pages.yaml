  md: '# 17.1 Aggregate analysis


    +   - In aggregate analysis, we show that for all *n*, a sequence of *n* operations
    takes worst-case time T(*n*) in total.

    +   - In the worst case, the average cost, or amortized cost, per operation is
    therefore T(*n*)/*n*.'
