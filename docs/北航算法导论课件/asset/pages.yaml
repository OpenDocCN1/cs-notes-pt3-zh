- pgno: 316
  md: '# Step 2: A recursive solution


    +   - What happens to the expected search cost of a subtree when it becomes a
    subtree of a node?


    +   - The depth of each node in the subtree increases by 1, the expected search
    cost of this subtree increases by the sum of all the probabilities in the subtree.
    (子树中每个节点的深度增加 1，该子树的期望搜索的 cost 的增量为该子树所有节点的搜索概率之和，...) the sum of probabilities:


    增量: $w[i, j] = \sum_{i=i}^{j} p_i + \sum_{i=i-1}^{j} q_i \quad (15.17)$


    ![](img/09c68ab421cfce4995ddad1430ef2637_316_0.png)


    E_T = e[m, n]


    ![](img/09c68ab421cfce4995ddad1430ef2637_316_1.png)


    E_T = \sum_{x=m}^{n} (depth(k_x)+1+1)·p_x + \sum_{x=m-1}^{n} (depth(d_x)+1+1)·q_x


    = \sum_{x=m}^{n} (depth(k_x)+1)·p_x + \sum_{x=m-1}^{n} (depth(d_x)+1)·q_x + \sum_{x=m}^{n}
    p_i + \sum_{x=m}^{n} q_x


    = e[m, n] + w[m, n]'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Step 2: A recursive solution


    +   Thus, if $k_r$ is the root of an optimal subtree containing keys $k_i$, ...,
    $k_j$, we have

    +   $e[i,j] = p_r + (e[i, r-1] + w[i, r-1])$

    +   $+ (e[r+1,j] + w[r+1,j])$ ?


    ![](img/09c68ab421cfce4995ddad1430ef2637_317_0.png)


    Noting that $w[i,j] = w[i, r-1] + p_r + w[r+1,j]$


    $\left( w[i, r-1] = \sum_{l=i}^{r-1} p_l + \sum_{l=i-1}^{r-1} q_l \quad , \quad
    w[r+1, j] = \sum_{l=r+1}^{j} p_l + \sum_{l=r}^{j} q_l \right)$


    We rewrite $e[i,j]$ as


    $e[i,j] = e[i, r-1] + e[r+1,j] + w[i,j] \quad (15.18)$


    The recursive equation (15.18) assumes that we know which node $k_r$ to use as
    the root, which we do not know.'
