  md: '# First Example: Identifying Genes in Human DNA (基因识别)


    +   - Identifying all the 100,000 genes in human DNA

    +     - determining the sequences of the sequences of the 3 billion(10⁹) chemical
    base pairs that make up human DNA.

    +     ( a strand of DNA ⊆ finite set {A, C, G, T} )


    （30亿对化学基组成人类DNA，如何界定这些序列，从而进行基因识别？不同化学基序列组成了不同的DNA。排序问题！）


    +   - Computer: 4G Hz CPU, 4*10⁹B/s, suppose that it executes one billion (10⁹)
    instructions per second

    +     （设该计算机的运行速度为：10亿条基本指令/s ，[一条指令含多个字节]）

    +   - Input size: n = 3*10⁹

    +   - Insertion sort: running time n²


    t = s/v : (3×10⁹ × 3×10⁹ instruc) / (10⁹ instruc/s) = 9×10⁹ seconds = (9×10⁹)/(60×60×24×365)
    y ≈ 285.39 years


    ![](img/09c68ab421cfce4995ddad1430ef2637_1_0.png)'
