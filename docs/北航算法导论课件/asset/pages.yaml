  md: "# Step 1: Characterizing an LCS\n\n$X = \\langle x_1, x_2, \\ldots, x_m \\\
    rangle$ and $Y = \\langle y_1, y_2, \\ldots, y_n \\rangle$\n\n+   • **A brute-force\
    \ approach**\n\n+   ◆ Enumerate all subsequences of X and check each subsequence\
    \ to see if it is also a subsequence of Y. （列举出 X 的所有子序列，逐项核查这些子序列是否为 Y 的子序列）\n\
    \n+   ◆ Each subsequence of X corresponds to a subset of the indices {1, 2, ...,\
    \ m} of X. There are $2^m$ subsequences of X. Exponential time, impractical for\
    \ long sequences.\n+   \n+   （X 的子序列对应 X 的索引 {1, 2, ..., m} 的某个子集。有 $2^m$ 个 X\
    \ 的子序列。需要指数运算时间，当序列较大时实际不可行）\n\n1个元素：$C(1,m)$，$\\langle x_1\\rangle$，$\\langle\
    \ x_2\\rangle$，...，$\\langle x_m\\rangle$；\n\n2个元素：$C(2,m)$，$\\langle x_1,x_2\\\
    rangle$，$\\langle x_1,x_3\\rangle$，...，$\\langle x_{m-1},x_m\\rangle$；……；\n\n\
    $m$个元素：$C(m,m)$，$\\langle x_1,x_2,\\ldots,x_m\\rangle$"
