  md: '# 15.3.1 Optimal substructure : Subtleties


    +   - Consider q → r → t = longest path q ⇝ t. Are its subpaths longest paths?
    No!

    +     - Subpath q ⇝ r is q → r.

    +     - Longest simple path q ⇝ r is q → s → t → r.

    +     - Subpath r ⇝ t is r → t.

    +     - Longest simple path r ⇝ t is r → q → s → t.

    +   - Not only isn’t there optimal substructure, but we can’t even assemble a
    legal solution from solutions to subproblems.

    +     (没有最优子结构；且从子问题的解中不能构造出原问题的正确解)

    +   - Combine longest simple subpaths to q → s → t → r → q → s → t

    +   - Not simple!


    ![](img/09c68ab421cfce4995ddad1430ef2637_376_0.png)'
