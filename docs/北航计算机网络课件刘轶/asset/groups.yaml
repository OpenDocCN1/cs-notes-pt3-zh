    \ Multiple Access with Collision Detection**\n  - Note: “collision” is also translated\
    \ as “冲突” (conflict).\n  - It is a random access protocol.\n- Several core concepts\
    \ of CSMA/CD:\n  - Carrier sense\n  - Collision detection\n  - Collision enforcement\n\
    \  - Collision backoff\n\n- Carrier sense:\n  - Before sending data, a station\
    \ checks whether another node on the bus is already transmitting. If so, it temporarily\
    \ withholds data to avoid a collision → “listen before sending”\n- Collision detection:\n\
    \  - While sending data, a station checks whether a collision has occurred on\
    \ the channel (by monitoring the signal on the bus) → “listen while sending”\n\
    \  - Because of propagation delay on the line, carrier sense alone cannot completely\
    \ avoid collisions; collisions may still occur.\n  - When a collision occurs,\
    \ two or more signals overlap on the bus and become unrecognizable.\n\n![](img/81d9dd756f10056160a08242a5d29d2c_13_2.png)\n\
    \n- Collision enforcement:\n  - After detecting a collision, the sender immediately\
