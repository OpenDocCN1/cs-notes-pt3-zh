    # 2009年考研题


    主机甲与主机乙之间已建立一个TCP连接，主机甲向主机乙发送了两个连续的TCP段，分别包含300字节和500字节的有效载荷，第一个段的序列号为200，主机乙正确接收到两个段后，发送给主机甲的确认序列号是（
    ）

    A. 500   B. 700   C. 800   D. 1000


    +   - 发送缓存用来暂时存储：

    +     - 发送应用程序要发送的TCP段，但尚未发出的数据

    +     - 已发出，但尚未收到确认的数据

    +   - 接收缓存用来暂时存储：

    +     - 接收到的数据，但尚未被应用程序取走的数据

    +     - 接收到的数据，但尚未按顺序到达的数据

    +   - A的发送窗口大小是和B的接收窗口一样大

    +   - TCP要实现接收方缓存和累积确认的功能，这样可以减少传输开销


    # 5.5 TCP可靠传输的实现


    # 二、超时重传时间的选择


    +   - TCP的可靠传输通过发送方和超时重传实现

    +     - TCP发送一个报文段，就启动一个计时器

    +     - 如果计时器设置的重传时间已过，但没有收到确认，就重传该报文段


    +   - 超时时间设置是一个复杂的问题

    +     - IP协议提供的是尽最大努力服务，每个数据报所经过的路由都可能变化

    +     - 传输的性能也同时变化


    # 5.5 TCP可靠传输的实现


    # 二、超时重传时间的选择


    +   - TCP采用一种自适应算法计算超时重传时间

    +   - 加权平均往返时间RTTs（往返，RTT—Round Trip Time）

    +   - TCP估计RTT的一个加权平均往返时间RTTs，又称为平滑的往返时间

    +   - 每次收到报文样本，RTTs按这样计算：

    +     - 以加权平均一个新的RTTs，估计如下式计算：

    +       新的RTTs = (1-α)×旧的RTTs + α×新的RTT样本

    +       其中0<α<1，α越小，新样本权重越小，越大，RTT值更新越快

    +       RFC 2988 推荐α=1/8 即 0.125


    问：为什么不直接用单一的RTT？


    # 5.5 TCP可靠传输的实现


    # 二、超时重传时间的选择


    +   - 超时重传时间RTO(Retransmission Time-Out)

    +     - RTO应略大于RTTs

    +     - RFC 2988 建议使用下式计算RTO：

    +       RTO = RTTs + 4 × RTTd

    +       RTTd是RTTs的偏差的加权平均值

    +       RFC 2988 建议这样计算RTTd：

    +       - 第一次测量时，RTTs值取为测得的RTT样本值的一半

    +       - 在以后的测量中，使用下式计算加权平均RTTd

    +       新的RTTd = (1-β)×旧的RTTd + β×|RTTs-新的RTT样本|

    +       其中0<β<1，推荐是1/4，即 0.25


    # 5.5 TCP可靠传输的实现


    +   - 在往返时间RTT的测量并不简单

    +     - TCP发送报文段时，记录发送时间，收到该报文段ACK时，计算该报文段往返时间

    +     - 如何确定确认报文段是对哪一个报文段的确认，还要对重传的报文段做2个判断？


    +   - Karn法

    +     - 计算平均往返时间RTTs时，只考虑报文段重传了，就不采用其样本

    +     - 这样做可以使加权平均往返时间RTTs、超时重传时间RTO较为准确

    +   - 修正的Karn法

    +     - 报文段重传一次，就把RTO增大一倍(如加倍)

    +     - 不再发生重传时，才开始往返时间更新RTT和RTO


    # 5.6 TCP的流量控制


    # 5.6 TCP的流量控制


    # 一、利用滑动窗口实现流量控制


    +   - 流量控制(flow control)就是让发送方的发送速率不要太快，使得接收方来得及接收

    +   - 利用滑动窗口机制可以很方便地在TCP连接上实现流量控制

    +   - TCP连接建立过程中，将自己的接收窗口大小告知对方

    +   - TCP报头中都携带窗口大小字段，告知对方自己接收窗口的剩余大小(即可以接收的字节数)

    +   - 发送方的发送窗口应不大对方的接收窗口'
