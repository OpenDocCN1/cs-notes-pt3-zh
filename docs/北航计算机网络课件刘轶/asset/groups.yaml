    \  \n    - 受控访问：如多点线路探询（polling），或令牌 → 局域网中使用较少\n\n## 二、CSMA/CD 协议\n\n- **Carrier\
    \ Sense Multiple Access with Collision Detection** 载波监听多点访问/碰撞检测  \n  - 注意：collision\
