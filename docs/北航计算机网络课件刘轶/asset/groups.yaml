    \  - 在BGP的四种报文中，只有UPDATE报文是交换路由信息的报文；当路由发生变化时才发送UPDATE报文，且只更新受影响的部分，有利于节省网络带宽和减少处理开销\n\
    \n### 五、路由器（Router）\n\n- 路由器是一种具有多个输入端口和多个输出端口的专用计算机，其任务是转发分组\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_3.png)\n\
    \n- Cisco 7304高端路由器\n  - LAN接口：2个10/100/1000M以太网\n  - WAN模块：OC-3或OC-48\n  - 包转发速率：3.5Mpps\n\
    - Cisco 2811多业务路由器\n  - LAN接口：2个10/100M以太网\n  - WAN模块：T1/E1/DSL等\n  - 集成防火墙、支持VPN、IP语音等功能\n\
    \n- 路由器包含两部分\n  - 路由选择部分：核心为路由选择处理机，它按照路由选择协议与其他路由器交换路由信息，构建路由表\n  - 分组转发部分：包含交换结构（switching\
    \ fabric）、一组输入端口和输出端口\n    - 交换结构将分组转发到合适的输出端口（每发送一个分组便转发到相应输出端口）\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_4.png)\n\
    \n- **路由器设计的关键之一是分组的高速转发**\n  - 决定报文转发速率的因素有：\n    - 输入/输出端口的处理性能\n    - 交换结构的性能\n\
    \    - 线速（line speed或wire speed）：分组的处理速率能够达到线路上分组的传输速率\n    - 衡量路由器性能的指标：pps（packets\
    \ per second）\n    - 如OC-48链路（2.5Gb/s），如果分组长度为256字节，则线速转发意味着每秒处理分组>100万\n"
  mdcn: "\n\n## 4.5 路由算法及协议\n\n### 二、距离向量路由与RIP协议（1/7）\n\n- 在自治系统背景下，Internet路由器协议可以分为两类：\n\
    \  - 内部网关协议IGP（Interior Gateway Protocol）\n    - 自治系统内部使用的路由选择协议\n    - 经常使用协议为RIP和OSPF协议\n\
    \  - 外部网关协议EGP（External Gateway Protocol）\n    - 若源点和目的网络在不同的自治系统中，当信息传递到一个自治系统的边界时，就需要使用EGP协议将信息传递到另一个自治系统中\n\
    \    - 经常使用的协议为BGP-4\n- 自治系统之间的路由选择又称为域间路由选择（interdomain routing）\n- 自治系统内部的路由选择又称为域内路由选择（intradomain\
    \ routing）\n\n### 距离向量路由（distance vector routing）简介\n\n也称为Bellman-Ford路由算法和Ford-Fulkerson算法。\n\
    \n最先用于ARPANET，RIP协议采用。\n\n距离向量路由的基本思想是：\n\n每个路由器维护一张表，表中给出了到达目的地的已知路由的距离，并通过与邻居交换路由信息来更新表。\n\
    \n路由器周期性地向所有相邻路由器发送它自己的距离表，同时也接收到邻居路由器所发送的距离表。\n\n设邻居路由器X发送的内容为：X到某目的网络Y的距离为d；本路由器到X的距离为m；则本路由器经X到Y的距离为d+m。根据不同邻居发来的信息，计算d+m，并取最小值，更新本路由器的路由表。\n\
    \n### 二、距离向量路由与RIP协议（3/7）\n\n- 距离向量路由的无穷计数问题\n  - 算法的缺陷：对好消息反应迅速，对坏消息反应迟钝\n\n\
    ![](img/81d9dd756f10056160a08242a5d29d2c_24_0.png)\n\n![](img/81d9dd756f10056160a08242a5d29d2c_24_1.png)\n\
    \n### 二、距离向量路由与RIP协议（4/7）\n\n- RIP（Routing Information Protocol）协议\n  - 属于距离向量路由协议\n\
    \  - RFC 1058: Routing Information Protocol\n  - 特点：简单，适用于小型网络中的路由\n  - RIP中的距离定义：路由器跳数（hop\
    \ count）\n    - 优点：使得计算简单\n    - 缺点：只能找到最短路径，且最多包含15个跳数的路由\n    - 路由跳数超过15时就认为是不可达\n\
    \    - 直连网络的跳数为0\n  - RIP的三个要点\n    - 仅和相邻路由器交换信息\n    - 交换的信息是整个网络的路由信息，即自己的路由表\n\
    \    - 按照固定的时间间隔交换路由信息（每隔30秒）\n\n### 2010年的一道考研题：\n\n某自治系统采用RIP协议，若该自治系统内的路由器R1收到其邻居路由器R2的距离矢量中包含的信息<net1,\
    \ 16>，则可得出的结论是：\n\n- A. R2可以经过R1到达net1，跳数为17\n- B. R2可以到达net1，跳数为16\n- C. R1可以经过R2到达net1，跳数为17\n\
    - D. R1不能经过R2到达net1\n\n### 收到相邻路由器发来RIP报文后的处理流程（注意它并没有按照距离向量算法工作）\n\n### RIP报文格式\n\
    \n### 二、距离向量路由与RIP协议（7/7）\n\n- **RIP优缺点**\n  - 优点\n    - 实现简单，开销较小\n  - 缺点\n \
    \   - 当网络出现故障时，要经过比较长的时间才能将此信息传送到所有的路由器（距离向量路由的固有缺点）\n    - 支持的网络规模有限，最大距离为15（16表示不可达）\n\
    \    - 路由器之间交换的路由信息是路由器中的完整路由表，随着网络规模的扩大，开销随之增加\n\n### 三、链路状态路由与OSPF协议（1/7）\n\n\
    - **链路状态路由（link-state routing）的基本思想**\n  - 每个路由器先完成5步工作：\n    1. 发现它的邻居节点，获得邻居节点的网络地址\n\
    \    2. 测量邻居各链路的延迟或开销\n    3. 构造一个分组，其中包含所有它所知道的信息\n    4. 将这个分组发送给其他所有相邻路由器\n\
    \    5. 计算出到每一个其他路由器的最短路径\n  - 各路由器之间交换完整的路由状态信息，每个路由器都建立一个链路状态数据库。\n  - 链路状态数据库中包含邻居路由器的相邻关系，以及该链路的“度量”（metric）。\n\
    \  - 链路状态数据库实际上是全网的拓扑结构图，它在全网范围内是一致的（链路状态数据库的同步）。\n  - 各路由器根据网络拓扑使用Dijkstra算法计算从本路由器到其他各节点的最短路径，生成路由表。\n\
    \n### 三、链路状态路由与OSPF协议（2/7）\n\n- 发现邻居节点，并学习它们的网络地址\n  - 路由器启动后，通过发送HELLO包发现邻居路由器\n\
    \  - 当两个或多个路由器连接到同一个LAN时，引入指定路由器（DR）\n\n![](img/81d9dd756f10056160a08242a5d29d2c_25_0.png)\n\
    \n### 三、链路状态路由与OSPF协议（3/7）\n\n- **OSPF（Open Shortest Path First）协议简介**\n  - 属于链路状态路由协议\n\
    \  - RFC 2328: OSPF Version 2\n  - 优点：\n    - 收敛速度快：当链路状态发生变化时，结点会以洪泛（flooding）方式告知网络中其他所有结点\n\
    \    - 适用于较大规模的网络：仅在链路状态发生变化时才发送洪泛信息，不会产生很大通信量\n\n- 为了管理大规模的网络，OSPF将一个自治系统再划分为若干个区域（area）。\n\
    - 每一个区域都有一个32位的区域标识符（Area ID）。\n- 采用区域的划分后，洪泛传送链路状态信息的范围局限于一个区域即可，避免了整个网络上的通信量。\n\
    - 一个区域内的路由器只知道本区域的完整网络拓扑，而不知道其他区域的网络拓扑。\n- 层次结构的区域划分中，上层区域称为主干区域（backbone area），主干区域的作用是让自治系统内其他区域之间互相传递信息。\n\
    \  - 主干区域的标识符规定为0.0.0.0。\n\n![](img/81d9dd756f10056160a08242a5d29d2c_25_1.png)\n\
    \n### OSPF分组结构\n\n（OSPF不用UDP而是直接用IP数据报传送）\n\n| 字段 | 长度 |\n| --- | ---: |\n| 版本\
    \ | 8 |\n| 类型 | 8 |\n| 分组长度 | 16 |\n| 路由器标识 | 32 |\n| 区域标识 | 32 |\n| 检验和 | 16\
    \ |\n| 鉴别类型 | 16 |\n| 鉴别 | 64 |\n| 数据 | 可变 |\n\n![](img/81d9dd756f10056160a08242a5d29d2c_25_2.png)\n\
    \n### OSPF的5种分组\n\n- 类型1：Hello分组\n- 类型2：Database Description分组\n- 类型3：Link State\
    \ Request分组\n- 类型4：Link State Update分组，用洪泛法对全网更新链路状态\n- 类型5：Link State Acknowledgment分组\n\
    \n### OSPF操作\n\n![](img/81d9dd756f10056160a08242a5d29d2c_25_3.png)\n\n### OSPF洪泛发送\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_25_4.png)\n\n### 四、外部网关路由协议BGP\n\n\
    - **BGP简介**\n  - BGP是不同自治系统的路由器之间交换路由信息的协议\n  - BGP-4，RFC 4271～4278，2006年\n\n\
    - **BGP使用环境的特性**\n  - Internet的规模很大，AS之间的路由选择非常困难\n    - Internet主干网络由表中包含的网络前缀达到数百万\n\
    \    - 对于AS之间的路由选择，要寻找最佳路由是不现实的\n    - 不同AS路径复杂且标准不同\n  - AS之间的路由选择需要考虑多种因素\n\
    \    - 例1：AS1到AS6的数据经过AS3在技术上最短，但AS3可能不同意\n    - 例2：出于国家安全的考虑，可能不希望数据经过某些国家\n\
    \  - BGP难以找到最佳路由，只能寻找一条能够到达目的网络且比较好的路由（不能兜圈子）\n\n- **BGP发言人（speaker）**\n  - 每个AS都选择一个路由器作为“BGP\
    \ speaker”\n  - 两个BGP发言人通过一个共享网络连接在一起\n  - BGP发言人一般是AS的边界路由器，但也可以不是\n  - BGP发言人与其他自治系统中的BGP发言人交换路由信息，这种交换通过TCP协议进行；两个发言人在TCP连接上交换BGP报文以建立BGP会话（session），利用BGP会话交换路由信息\n\
    \  - BGP发言人除了运行BGP协议外，还要运行AS的内部网关路由协议\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_0.png)\n\
    \n- **信息交换与路由生成**\n  - BGP所交换的网络可达性信息就是要到达某个网络所要经过的路径\n    - 称为路径向量（path vector）\n\
    \  - BGP发言人互相交换了网络可达性信息后，就根据所采用的策略从中找出到达各AS的较好路由\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_1.png)\n\
    \n根据路由信息计算得到的通道图示例（注意无回路）\n\n- **示例**\n  - AS2的BGP发言人通知主干网的BGP发言人：要到达网络N1、N2、N3和N4可经过AS2\n\
    \  - 主干网的BGP发言人还可发出通知：“要到达网络N5、N6和N7可沿路径（AS1，AS3）”\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_2.png)\n\
    \n**BGP使用四种报文**\n\n1. OPEN报文：用来与相邻的另一方BGP发言人建立关系\n2. UPDATE报文：用来发送一些路由信息，以及列出需要撤销的多条路由\n\
    3. KEEPALIVE报文：用来确认OPEN报文和周期性地证实邻站关系\n4. NOTIFICATION报文：用来发送检测到的错误\n\nBGP发言人通过OPEN报文与另一发言人建立会话，对方如果同意则回应KEEPALIVE报文。\n\
    \n双方周期性发送KEEPALIVE报文，以确认会话未中断。\n\n当信息发生变化时，发送UPDATE报文。\n\n- **BGP协议特点**\n  - 交换路由信息的结点数量级与自治系统个数相当，大大少于这些自治系统中网络的数目\n\
    \  - 每个自治系统中BGP发言人（或边界路由器）的数目很少，使得自治系统间的路由选择不致过分复杂\n  - BGP支持CIDR，因此BGP路由表包括目的网络前缀、下一跳路由器，以及到达该目的网络经过的各自治系统序列\n\
    \  - 在BGP的四种报文中，只有UPDATE报文是交换路由信息的报文；当路由发生变化时才发送UPDATE报文，且只更新受影响的部分，有利于节省网络带宽和减少处理开销\n\
    \n### 五、路由器（Router）\n\n- 路由器是一种具有多个输入端口和多个输出端口的专用计算机，其任务是转发分组\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_3.png)\n\
    \n- Cisco 7304高端路由器\n  - LAN接口：2个10/100/1000M以太网\n  - WAN模块：OC-3或OC-48\n  - 包转发速率：3.5Mpps\n\
    - Cisco 2811多业务路由器\n  - LAN接口：2个10/100M以太网\n  - WAN模块：T1/E1/DSL等\n  - 集成防火墙、支持VPN、IP语音等功能\n\
    \n- 路由器包含两部分\n  - 路由选择部分：核心为路由选择处理机，它按照路由选择协议与其他路由器交换路由信息，构建路由表\n  - 分组转发部分：包含交换结构（switching\
    \ fabric）、一组输入端口和输出端口\n    - 交换结构将分组转发到合适的输出端口（每发送一个分组便转发到相应输出端口）\n\n![](img/81d9dd756f10056160a08242a5d29d2c_26_4.png)\n\
    \n- **路由器设计的关键之一是分组的高速转发**\n  - 决定报文转发速率的因素有：\n    - 输入/输出端口的处理性能\n    - 交换结构的性能\n\
    \    - 线速（line speed或wire speed）：分组的处理速率能够达到线路上分组的传输速率\n    - 衡量路由器性能的指标：pps（packets\
    \ per second）\n    - 如OC-48链路（2.5Gb/s），如果分组长度为256字节，则线速转发意味着每秒处理分组>100万\n\n"
