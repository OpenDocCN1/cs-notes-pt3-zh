    # 4.5 路由算法及协议


    **2011年的一道考研题：**


    在下列关于IP路由器功能的描述中，正确的是：（　　）


    I. 运行路由协议，设置路由表

    II. 监测到拥塞时，合理丢弃IP分组

    III. 对收到的IP分组头进行差错校验，确保传输的IP分组不丢失

    IV. 根据收到的IP分组的目的IP地址，将其转发到合适的输出线路上


    +   A. I、III、IV　　　B. I、II、III

    +   C. 仅 I、II、IV　　D. I、II、III、IV


    # 4.6 IP 组播


    # 4.6 IP 组播


    +   • 组播(multicast)又称为多播，用于实现一对多的数据传输

    +     对于一些网络应用，采用组播可大大减少网络流量

    +   • 组播的典型应用示例：网络视频服务


    ![](img/81d9dd756f10056160a08242a5d29d2c_27_2.png)


    # 4.6 IP 组播


    +   • 使用D类IP地址作为组播地址

    +     – 224.0.0.0～239.255.255.255

    +     – 组播数据报：IP包头中的目的地址为D类地址，协议类型为2(IGMP协议)

    +   • 组播地址即为特定组播组的标识符，主机通过加入组播组来接收组播数据

    +   • 组播可分为两种

    +     – 在局域网内的硬件组播

    +       · 将MAC地址中的特定地址段作为组播地址，并与IP组播地址形成对应关系

    +     – 在Internet中的组播

    +       · 路由器需支持组播，组播路由器

    +       · 主机通过IGMP协议与组播路由器通信，加入组播并接收组播

    +       · 组播路由器之间通过组播路由协议实现组播数据的传输


    # 4.7 网络地址转换NAT和虚拟专用网VPN


    # 4.7 虚拟专用网VPN和网络地址转换NAT


    # 一、网络地址转换 NAT


    +   • 专用地址(保留地址)

    +     – RFC1918中定义了一系列专用地址(private address)

    +       · 10.0.0.0 ～ 10.255.255.255（CIDR记法：10/8）

    +       · 172.16.0.0 ～ 172.31.255.255（CIDR记法：172.16/12）

    +       · 192.168.0.0 ～ 192.168.255.255（CIDR记法：192.168/16）

    +     – 这些地址只能用于机构的内部

    +     – Internet中的路由器不转发目的地址为专用地址的包

    +   • 企业/机构内部网络使用专用地址的优点

    +     – 减少IP地址空间的占用

    +     – 可提高安全性'
