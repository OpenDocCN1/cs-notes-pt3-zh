  md: "\n## 3.6 介质访问控制\n\n**2010年的一道考研题：**\n某局域网采用CSMA/CD协议实现介质访问控制，数据传输率为100M/s，主机甲和主机乙的距离为2km。假设传播速度是200000km/s。请回答下列问题：\n\
    \n(1) 若主机甲和主机乙发送数据时发生冲突，则从开始发送数据到两台主机检测到冲突时为止，最短经过多长时间？最长经过多长时间？（假设主机甲和主机乙发送数据时，其他主机不发送数据）\n\
    \n**求解：**\n甲乙间单向传输时延 = 2/200000 = 10μs\n最短：无论冲突点在何处，冲突信号向甲乙方向扩散的时间不小于10μs\n最长：甲发送的帧即将到达时，乙开始发送数据造成冲突，甲检测到冲突所需的时间\
    \ = 20μs\n\n## 3.6 介质访问控制\n\n- **争用期**\n  - 一个站点开始发送数据后，最多经过时间 2τ（两倍的端-端时延）就知道是否发生了碰撞\n\
    \  - 以太网的端到端时延不超过 2τ 称为争用期\n  - 如果经过争用期还没有检测到碰撞，就可以肯定这次发送不会发生碰撞\n- **以太网的争用期**\n\
    \  - 以太网的争用期长度：51.2 μs\n  - 对于10 Mb/s的以太网，在争用期内可发送512 bit，即64字节\n  - 在发送数据时，若首64字节未发生碰撞，就不会发生碰撞\n\
    \  - 据此规定以太网帧长度≥64字节，长度小于64字节的帧为无效帧\n\n## 3.6 介质访问控制\n\n**2009年的一道考研题：**\n在一个采用CSMA/CD协议的网络中，传输介质是一根完整的电缆，传输速率为1Gbps，电缆中的信号传播速度是200000km/s。若最小数据帧长度减少800比特，则最远的两个站点之间的距离至少需要：\n\
    \nA. 增加160m　　B. 增加80m　　C. 减少160m　　D. 减少80m\n\n## 3.6 介质访问控制\n\n- **CSMA/CD协议的优缺点讨论**\n\
    \  - 网络负载较轻时效率高\n  - 网络实现简单、灵活\n  - 网络负载较重时，碰撞发生概率增大，网络效率较低\n- 由于存在多次冲突的可能，数据从发送方到达接收方的时间没有保证\
    \ ⇒ 实时性较差\n\n## 3.7 以太网\n\n### 一、局域网技术标准(1/2)\n\n- IEEE802标准将局域网的数据链路层分为两个子层\n\
    \  - LLC (Logic Link Control) 逻辑链路控制子层\n  - MAC (Media Access Control) 介质访问控制子层\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_14_0.png)\n\n## 3.7 以太网\n\n### 一、局域网技术标准(2/2)\n\
    \n- IEEE802系列局域网标准\n  - IEEE 802.1a 综述与体系结构\n  - IEEE 802.1b 寻址、互联、管理\n  - IEEE\
    \ 802.2 逻辑链路控制(LLC)\n  - IEEE 802.3 CSMA/CD介质访问控制(MAC)与物理层技术规范\n    - IEEE 802.3u\
    \ 快速以太网(Fast Ethernet)\n    - IEEE 802.3z 千兆以太网(Gigabit Ethernet)\n  - IEEE 802.4\
    \ Token Bus介质访问控制与物理层技术规范\n  - IEEE 802.5 Token Ring介质访问控制与物理层技术规范\n  - IEEE 802.11\
    \ 无线局域网介质访问控制与物理层技术规范\n\n**注：**令牌环网(Token Ring)和令牌总线网(Token bus)使用一种令牌为争用( token)的控制标志，当网络中结点有待发送数据时，才能够发送数据。\n\
    \n## 3.7 以太网\n\n### 二、以太网简介\n\n- Ether：以太\n- 1975年，Xerox公司Palo Alto研究中心(PARC)研制\n\
    - 1980年，DEC、Intel和Xerox公司联合推出以太网标准 DIX v1\n- 1982年，DIX v2\n- 1983年，IEEE802.3标准\n\
    \n## 3.7 以太网\n\n### 三、以太网物理层\n\n- 最初的以太网为总线结构，采用 50Ω同轴电缆，传输速率10Mbps\n- 帧长：最短64字节最长可达1518字节\n\
    - 长度：网络中总长度同时考虑信号衰减\n- 后来发展为采用更便宜且灵活的非屏蔽双绞线，使用集线器(HUB)连接各个站点，物理上呈星形结构\n- 此种物理结构为10Base-T\n\
    \  - 10：10Mbps\n  - Base：基带传输\n  - T：双绞线(Twisted pair)\n- 使用双绞线的以太网两个站点之间是一条总线\n\
    - 集线器提供一个多接口的转发器，工作在物理层\n\n| Name | Cable | Max. seg. | Nodes/seg. | Advantages\
    \ |\n|---|---|---|---|---|\n| 10Base5 | Thick coax | 500 m | 100 | Original cable,\
    \ now obsolete |\n| 10Base2 | Thin coax | 185 m | 30 | No hub needed |\n| 10Base-T\
    \ | Twisted pair | 100 m | 1024 | Cheapest system |\n| 10Base-F | Fiber optics\
    \ | 2000 m | 1024 | Best between buildings |\n\n- 采用曼彻斯特(Manchester)编码\n  - 用电平的跳变表示0或1，即每个码元都有电平跳变\n\
    \n### 四、以太网的MAC层\n\n- 以太网采用CSMA/CD介质访问控制协议\n- MAC地址\n  - 结点发送数据时，以太网总线结构，总线上的所有结点都能收到帧\n\
