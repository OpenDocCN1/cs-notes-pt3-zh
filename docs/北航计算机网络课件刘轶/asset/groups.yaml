    \  - “发往本站的帧”包括以下三种帧：\n    - 单播(unicast)——一对一\n    - 广播(broadcast)——一对全体，MAC地址为全1表示广播\n\
    \    - 组播/多播(multicast)——一对多\n\n## 3.7 以太网\n\n- 以太网的帧格式(5个字段)\n  - 目的地址、源地址：各6字节的MAC地址\n\
    \  - 类型：2字节，标明上层协议类型，如：0x0800表示IP包\n  - 数据：网络层数据报，长度46~1500字节\n  - FCS：4字节，帧校验序列，采用CRC校验\n\
    \n## 3.7 以太网\n\n### 五、高速以太网(1/3)\n\n- 快速以太网(Fast Ethernet)\n  - IEEE802.3u标准\n\
    \  - 传输速率100Mb/s\n  - 仍使用 IEEE 802.3 CSMA/CD 协议(全双工模式时不用)\n  - MAC 帧格式仍然是802.3\
    \ 标准的规定\n  - 最大帧长不变，但将一个以太网的最大电缆长度减小到100m\n  - 线缆标准\n    - 100BASE-TX：使用2对UTP\
    \ 5类或屏蔽双绞线 STP\n    - 100BASE-FX：使用光纤环\n    - 100BASE-T4：使用4对 UTP类3或5类线缆\n\n##\
    \ 3.7 以太网\n\n### 五、高速以太网(2/3)\n\n- 千兆以太网(Gigabit Ethernet)\n  - IEEE802.3z标准\n\
    \  - 传输速率1Gb/s\n  - 仍使用 IEEE 802.3 CSMA/CD 协议(全双工模式时不用)\n  - 线缆标准\n    - 1000BASE-X：千兆光纤\n\
    \      - 1000BASE-SX：SA标准光纤\n      - 1000BASE-LX：LX标准光纤\n      - 1000BASE-CX：CX标准光纤\n\
    \    - 1000BASE-T：使用4对双绞线UTP\n\n## 3.7 以太网\n\n### 五、高速以太网(3/3)\n\n- 万兆以太网(10吉比特以太网)\n\
    \  - IEEE802.3ae标准\n  - 传输速率10Gb/s\n  - 帧格式不变\n  - 只使用光纤\n  - 只工作在全双工模式，不存在争用，因此不用CSMA/CD\n\
