    \ 字节的有效载荷，第一个段的序列号为 200，主机乙正确接收到两个段后，发送给主机甲的确认序列号是（ ）\n\n- A. 500\n- B. 700\n\
    - C. 800\n- D. 1000\n\n- 发送缓存用来暂时存储：\n  - 发送应用程序要发送的 TCP 段，但尚未发出的数据\n  - 已发出，但尚未收到确认的数据\n\
    - 接收缓存用来暂时存储：\n  - 接收到的数据，但尚未被应用程序取走的数据\n  - 接收到的数据，但尚未按顺序到达的数据\n- A 的发送窗口大小是和\
    \ B 的接收窗口一样大\n- TCP 要实现接收方缓存和累积确认的功能，这样可以减少传输开销\n\n### 二、超时重传时间的选择\n\n- TCP 的可靠传输通过发送方的超时重传实现\n\
    \  - TCP 发送一个报文段，就启动一个计时器\n  - 如果计时器设置的重传时间已过，但没有收到确认，就重传该报文段\n- 超时重传时间设置是一个复杂的问题\n\
    \  - IP 协议提供的是尽最大努力服务，每个数据报所经过的路由都可能变化\n  - 传输的性能也同时变化\n- TCP 采用一种自适应算法计算超时重传时间\n\
    - 加权平均往返时间 RTTs（往返时间，RTT—Round Trip Time）\n- TCP 用 RTTs 表示 RTT 的加权平均往返时间，又称为平滑的往返时间\n\
    - 每次收到新的 RTT 样本，RTTs 按如下加权平均计算：\n  - 新的 RTTs = (1-α)×旧的 RTTs + α×新的 RTT 样本\n \
    \ - 其中 0<α<1，α 越小，新样本权重越小；α 越大，RTT 值更新越快\n  - RFC 2988 推荐 α=1/8，即 0.125\n\n问：为什么不直接用单一的\
    \ RTT？\n\n- 超时重传时间 RTO（Retransmission Time-Out）\n  - RTO 应略大于 RTTs\n  - RFC 2988\
    \ 建议使用下式计算 RTO：\n  - RTO = RTTs + 4 × RTTd\n  - RTTd 是 RTTs 的偏差的加权平均值\n  - RFC\
    \ 2988 建议这样计算 RTTd：\n    - 第一次测量时，RTTd 值取为测得的 RTT 样本值的一半\n    - 在以后的测量中，使用下式计算加权平均\
    \ RTTd：\n      - 新的 RTTd = (1-β)×旧的 RTTd + β×|RTTs - 新的 RTT 样本|\n      - 其中 0<β<1，推荐是\
    \ 1/4，即 0.25\n\n- 往返时间 RTT 的测量并不简单\n  - TCP 发送报文段时，记录发送时间，收到该报文段 ACK 时，计算该报文段往返时间\n\
    \  - 还要确定确认报文段是对哪一个报文段的确认，并对重传的报文段做判断\n- Karn 法\n  - 计算平均往返时间 RTTs 时，只要报文段重传了，就不采用其样本\n\
    \  - 这样做可以使加权平均往返时间 RTTs、超时重传时间 RTO 较为准确\n- 修正的 Karn 法\n  - 报文段每重传一次，就把 RTO 增大一倍（如加倍）\n\
    \  - 不再发生重传时，才开始更新往返时间 RTT 和 RTO\n\n## 5.6 TCP的流量控制\n\n### 一、利用滑动窗口实现流量控制\n\n\
    - 流量控制（flow control）就是让发送方的发送速率不要太快，使得接收方来得及接收\n- 利用滑动窗口机制可以很方便地在 TCP 连接上实现流量控制\n\
    - TCP 连接建立过程中，将自己的接收窗口大小告知对方\n- TCP 报头中都携带窗口大小字段，告知对方自己接收窗口的剩余大小（即可以接收的字节数）\n\
    - 发送方的发送窗口应不大于对方的接收窗口\n\n- A 向 B 发送数据\n- 在连接建立时，B 告诉 A：“我的接收窗口 rwnd = 400（字节）”\n\
    \n问题：如果 B 向 A 发送的这个报文丢失了，如何避免双方互相等待？\n\n- 持续计时器（persistence timer）\n- TCP 为每一个连接设置一个特殊计时器\n\
    - 只要一方收到对方的零窗口通知，就启动持续计时器\n- 若持续计时器设置的时间到，就发送一个零窗口探测报文段（仅携带 1 字节的数据），而对方在确认这个探测报文段时给出当前窗口值\n\
    - 若窗口仍是零，则收到这个报文段的一方就重新设置持续计时器\n- 若窗口不是零，则死锁的僵局就可以打破了\n\n### 二、传输效率\n\n- 可以用不同的机制来控制\
    \ TCP 报文段的发送时机\n- 机制一：缓存中的数据达到一定量时就发送\n  - TCP 维持一个变量，它等于最大报文段长度 MSS\n  - 只要缓存中存放的数据达到\
    \ MSS 字节时，就组装成一个 TCP 报文段发出\n- 机制二：应用进程控制\n  - 由发送方应用程序明确要求发送报文段，即推送（push）操作\n\
    - 机制三：定时发送\n  - 发送方的一个计时器周期到了，这时就把当前已有的缓存数据装入报文段（但长度不能超过 MSS）发送出去\n\n## 5.7 TCP的拥塞控制\n\
    \n### 一、拥塞控制的一般原理\n\n- 拥塞（congestion）概念和产生原因（1/2）\n  - 在某段时间，某网络中同时要求传送的数据量超过了该网络所能提供的可用部分，网络的拥塞就变得明显，从而产生拥塞，即拥塞产生的条件：\n\
    \    - 资源的需求 > 可用资源\n    - 网络资源、链路带宽、路由器处理能力等\n  - 网络拥塞是由多种原因引起的，通过简单地增加某种资源数量往往并不能消除拥塞\n\
    \  - 例如：若网络中的存储容量太小，造成到达数据的频繁丢失；如果增加缓存容量，网络拥塞反而会加剧\n  - 报文在网络中排队，但如果路由器处理能力和输出链路带宽增加，报文就能被及时转发，发送主机就提高发送速率，则拥塞就又会产生\n\
    \n- 拥塞（congestion）概念和产生原因（2/2）\n  - 网络拥塞的表现：\n    - 网络性能下降，具体表现为网络时延增大、报文传输时延增大、丢包增多等，用户感觉到时延变长、丢包增多等\n\
    \    - 拥塞常常会引起恶化，即恶性循环。由 TCP 流量控制，如：一个网络由于拥塞，不断丢弃报文段，发送端主机超时重传，导致网络中报文段数增多，从而加剧拥塞\n\
    \n- 拥塞控制（congestion control）与流量控制\n  - 拥塞控制：防止过多的数据注入到网络中，使网络的路由或链路不致过载\n  - 拥塞控制是全网络性的问题，而流量控制是点对点通信量的控制，是端到端的问题\n\
    \n- 拥塞控制的作用\n\n- 开环控制与闭环控制\n  - 开环控制：在设计网络时就考虑到可能发生拥塞的因素，力求在网络工作时不产生拥塞\n  - 闭环控制：基于反馈的闭环控制，有以下几种措施：\n\
    \    - 监测网络系统在运行中是否出现拥塞、何处发生拥塞\n    - 将检测结果的信号传递给网络的某个地方的有关机构\n    - 调整网络系统的某些参数以消除或减轻拥塞\n\
    \  - RFC 2581 中定义了四种拥塞控制方法：\n    - 慢启动（slow-start），又称慢开始\n    - 拥塞避免（congestion\
    \ avoidance）\n    - 快重传（fast retransmit）\n    - 快恢复（fast recovery）\n\n"
