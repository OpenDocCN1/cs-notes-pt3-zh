    \n## 第一章 概述\n\n刘轶\n北京航空航天大学 计算机学院\n\n### 1.1 计算机网络定义与分类\n\n**一、计算机网络的定义**\n\n\
    - 计算机网络(Computer network)的简单定义：\n  - 计算机网络是一组互连的、自治的计算机的集合\n  - A collection of\
    \ autonomous computers interconnected by a single technology\n- 网络的功能：\n  - 通信性\n\
    \  - 资源共享\n- 计算机网络与分布式系统(distributed system)：\n  - 在分布式系统中，一组独立的计算机呈现给用户好像是一个整体系统，具有单一系统的概念\n\
    \  - 计算机网络似乎没有这种一致性\n  - 分布式系统建立在网络之上\n\n### 1.3 计算机网络的性能\n\n**一、性能指标(3/3)**\n\
    \n- 时延(delay, latency)：指数据从网络的一端传送到另一端所需的时间，又称为延迟\n- 网络时延由多个部分组成：\n  - 发送时延\n\
    \  - 传播时延\n  - 处理时延\n  - 排队时延\n\n发送时延 = 数据块长度(b) / 发送速率(b/s)\n\n传播时延 = 信道长度(m)\
    \ / 电磁波在信道上的传播速率(m/s)\n\n- 时延带宽积：时延带宽积 = 传播时延 × 带宽\n- 往返时间(RTT—Round-Trip Time)：\n\
    \  - 又称为往返时延\n  - 从发送方发送数据开始，到发送方收到来自接收方的应答所需的时间\n- 利用率：\n  - 信道利用率和网络利用率\n  -\
    \ 信道利用率指出信道有百分之几时间被利用(有数据通过)\n  - 网络利用率则是全网络的信道利用率的加权平均值\n\n**二、非性能指标**\n\n- 费用\n\
    - 质量\n- 标准化\n- 可靠性\n- 可扩展性和可升级性\n- 易于管理和维护\n\n### 1.4 计算机网络体系结构\n\n**一、网络体系结构概述**\n\
    \n计算机网络的体系结构(architecture)是计算机网络的各层及其协议的集合\n\n- 分层原因：实现信息在网络中传输非常复杂，分层是将复杂问题简单化、局部化的有效方法\n\
    - 传输媒体：有铜缆、光纤、无线\n- 连接到网络中的计算机或软件平台不相同\n- 通信双方可能长距离，可能经过多个网络\n- 需要提供尽可能多的服务，服务多样\n\
    - 需要各种各样的应用：文件传输、电子邮件、实时多媒体、...\n\n**二、具有七层和五层协议的体系结构**\n\n- (1) 物理层 (physical\
    \ layer)\n- (2) 数据链路层 (data link layer)\n- (3) 网络层 (network layer)\n- (4) 传输层\
    \ (transport layer)\n- (5) 会话层 (session layer)\n- (6) 表示层 (presentation layer)\n\
    - (7) 应用层 (application layer)\n\n**数据在各层之间的传递过程**\n\n协议数据单元PDU(Protocol Data Unit)：对等层之间传送的数据单位\n\
    \n有些文献将多个层次的协议称为协议栈(protocol stack)\n\n**三、实体、协议、服务和服务访问点**\n\n- 若干概念：\n  - 实体(entity)：任何可发送或接收信息的硬件或软件进程\n\
    \  - 协议(protocol)：控制两个对等实体进行通信的规则的集合\n  - 服务(service)：协议的实现向下为上一层提供服务，上一层使用服务\n\
    \  - 服务访问点(SAP)：层间接口，称为服务访问点SAP\n- 协议的设计不仅要考虑正常情况，还要考虑各种异常情况，较为复杂\n- 网络协议的经典问题：两军问题\n\
    \  - 两支军队驻扎在富士山和白山之间\n  - 两支军队通信使用信鸽进行，白天信鸽全部失踪\n  - 两支军队只能晚上放鸽子，信鸽经过富士山的山峰时，传递的信息可能丢失\n\
