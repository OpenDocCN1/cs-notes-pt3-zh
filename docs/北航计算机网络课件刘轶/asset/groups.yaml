  - "[PAGE 10]\n\n# 3.2 错误检测和纠正\n\n# 一、检错编码(Error detecting code)\n\n+   - 循环冗余校验CRC原理\n\
    +   - 发送方把数据段分成k位，设每帧k个比特，在其后添加n位差错检测的n位冗余码，(k+n)比特一起发送\n+   - 对接收方M计算第n位冗余码的过程：\n\
    +     - 用n位除数除2位冗余码，得到M的商，设当n位在M后面添加n个0\n+     - 得到(k+n)位的数值先除选定的长度为(n+1)位的数值P，得到商为Q和余数R，余数R就是P为n位，R为n-1位\n\
    +     - R作为余数，构成生成多项式M'，最后发送元素：2*M - R\n+     - 接收方收到数据后进行校验\n+   - 接收方对收到的(k+n)比特计算冗余码，结果为0表示传输正确，否则表示传输错误\n\
    \n# 3.2 错误检测和纠正\n\n# 例：计算101001的3位CRC冗余码\n\n已知：M=101001 k=6, n=3 除数P=1101 101001→Q(商)\
    \ P(除数)→1101 101001000→2*M(除数) 设除数P=1101 1101 1110 1111 0111 0000 被除数：2*M=101001000\
    \ 模运算的结果：商Q=110101 余数R=001 1110 1101 0110 1100 1101 001←R(余数) 发送的数据：2*M+R 即：101001001，共(k+m)位\n\
    \n# 3.2 错误检测和纠正\n\n+   - 通常用生成多项式P(x)表示除数P\n+     例：除数P=1101的生成多项式P(x)=X^3+X^2+1\n\
    +   - 目前广泛使用的生成多项式\n+     CRC-16=X^16+X^15+X^5+1\n+     CRC-CCITT=X^16+X^12+X^5+1\n\
    +     CRC-32=X^32+X^26+X^23+X^22+X^16+X^12+X^11+X^10+X^8+X^7+X^5+X^4+X^2+X+1\n\
    +   - 在网络中具体实现时，通常采用硬件电路生成CRC校验和(checksum)\n\n# 3.2 错误检测和纠正\n\n# 二、纠错编码(Error\
    \ correcting code)\n\n+   - 检错码只能发现数据出现了错误，无法得知哪个比特出错\n+   - 纠错编码通过增加冗余信息使得能够检测错误发生所在，以便于纠正，又称为向前纠错(forward\
    \ error correcting)\n+   - 关于数据链路层检错纠错的讨论\n+     通过检错码/纠错码可以做到无差错接收，或者说“无比特差错”\n\
    +     -并不意味着可靠传输，其他的错误包括：\n+       - 帧丢失、帧重复、帧失序\n\n# 3.3 基本数据链路协议\n\n# 3.3 基本数据链路协议\n\
    \n# 一、无限制的单工协议\n\n+   - 假定信道\n+     - 单向传输\n+     - 永远不会出错\n+     - 交付能力有界但无限\n\
    +     - 接收方能够及时处理所收到的数据\n\n```\nvoid sender(void)\n{\n  frame a; //待发送帧\n  packet\
    \ buffer; //待发送数据包\n  while (1)\n  {\n    from_network_layer(&buffer); //从网络层获得数据包\n\
    \    a.info = buffer; //把数据包装入帧\n    to_physical_layer(&a); //把帧传给物理层\n  }\n}\n\
    ```\n\n```\nvoid receiver(void)\n{\n  frame r;\n  event_type event; //等待事件\n \
    \ while (1)\n  {\n    wait_for_event(&event); //等待帧到达\n    from_physical_layer(&r);\
    \ //从物理层获得帧\n    to_network_layer(&r.info); //把帧交给网络层\n  }\n}\n```\n\n# 3.3 基本数据链路协议\n\
    \n# 二、单工停等(stop-and-wait)协议\n\n按“无限能力单工协议”，如果接收方处理帧的速度不及发送方，帧可能丢失\n\n解决办法：增加流量控制(flow\
    \ control)机制，得到单工停等协议\n- 接收方每收到一帧后，都要发送一个确认帧\n- 发送方每发送一帧，都要等待接收方的确认，然后才发送下一帧数据\n\
    \n```\nvoid sender(void)\n{\n  frame s;\n  packet buffer;\n  event_type event;\n\
    \  while (1)\n  {\n    from_network_layer(&buffer); //从网络层获得数据包\n    s.info =\
    \ buffer; //把数据包装入帧\n    to_physical_layer(&s); //把帧传给物理层\n    wait_for_event(&event);\
    \ //等待确认帧\n  }\n}\n```\n\n```\nvoid receiver(void)\n{\n  frame r;\n  event_type\
    \ event;\n  while (1)\n  {\n    wait_for_event(&event); //等待帧到达\n    from_physical_layer(&r);\
    \ //从物理层获得帧\n    to_network_layer(&r.info); //把帧交给网络层\n    to_physical_layer(&ack);\
    \ //发送确认帧\n  }\n}\n```\n\n# 3.3 基本数据链路协议\n\n# 三、有噪声信道的单工协议\n\n在有噪声信道中，帧在传输过程中可能出错\n\
    \n解决办法——ARQ(Automatic Repeat reQuest)协议\n- 校验和：使接收方能够检测是否出错\n- 序号：使接收方知道收到的帧是否正确\n\
    - 序号：使接收方知道收到的帧是否正确\n- 序号：使接收方知道收到的帧是否正确\n- 序号：使接收方知道收到的帧是否正确\n\n协议实现考虑的两个主要情形\n\
    1 数据帧可能出错\n  - 接收方收到错误帧，发送方收到确认后发送下一帧\n2 数据帧可能丢失\n  - 数据帧可能丢失，发送方超时后重传\n  - 接收方收到重复帧后丢弃\n\
    3 序号出错可能丢失\n  - 发送方收到确认后重传，接收方收到后，检查序号\n  - 不正确时，只返回确认"
