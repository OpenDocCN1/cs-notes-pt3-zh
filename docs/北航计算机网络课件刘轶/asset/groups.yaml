  - "[PAGE 21]\n\n# 4.3 划分子网和构造超网\n\n# 一、划分子网\n\n+   - 子网掩码的提出\n+     - 在划分子网、路由器需要根据数据报发往不同的子网，从何处得知子网掩码？IP地址中并非采用通用分隔信息。\n\
    +     - 解决方法：使用子网掩码（subnet mask）\n+   - 对目的主机的IP网络地址进行“按位与”操作，即得到子网地址\n\n![](img/81d9dd756f10056160a08242a5d29d2c_21_0.png)\n\
    \n# 4.3 划分子网和构造超网\n\n# 一、划分子网\n\n+   - 子网掩码\n+     - Internet标准规定，所有网络都必须使用子网掩码\n\
    +     - 子网掩码是一个网络或一个网段的重要属性\n+     - 路由器的路由表中的每个表项除了包含目的网络地址外，还要有子网掩码\n+     -\
