    # 1.4 计算机网络体系结构


    # 三、实体、协议、服务和服务访问点


    +   - 协议的设计不仅要考虑正常情况，还要考虑各种异常情况，较 为复杂

    +   - 网络协议的经典问题：西岸问题

    +     - 两支军队驻扎在富士山和白山之间

    +     - 两支军队通信使用信鸽进行，白天信鸽全部失踪

    +     - 两支军队只能晚上放鸽子，鸽子经过了富士山的山峰传递信息可能丢失

    +     - 蓝军1于次日午夜发起进攻，前进知道蓝2

    +     - 如何保证蓝军1发起进攻能够成功发起进攻？


