    \ division multiplexing, time division multiplexing, wavelength division multiplexing,\
    \ code division multiplexing.\n  - (2) Dynamic medium access control (multi-access):\n\
    \    - Random access: users may send information at any time, which may cause\
    \ collisions (conflicts).\n    - Controlled access: e.g., multi-point polling,\
