    # 三、域名服务器


    +   - 主机向本地域名服务器的查询一般采用递归查询

    +     - 如果本地域名服务器不知道被查询域名的 IP 地址，那么它就以 DNS 客户的身份，向根域名服务器继续发出查询请求报文

    +   - 本地域名服务器向根域名服务器的查询通常是采用迭代查询

    +     - 当根域名服务器收到本地域名服务器的迭代查询请求报文时

    +       - 要么给出所要查询的 IP 地址

    +       - 要么告诉本地域名服务器下一步应向哪一个域名服务器查询

    +     - 本地域名服务器进行后续的查询


