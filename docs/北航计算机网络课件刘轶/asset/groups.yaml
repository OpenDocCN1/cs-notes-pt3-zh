    # 2.4 信道复用技术


    # 2.4 信道复用技术


    +   二、波分复用(WDM—Wavelength Division Multiplexing)

    +   • 波分复用实际上就是光的频分复用

    +   • 专门用于光纤通信，由于光纤中光载波频率很高，人们习惯于使用波长来表示光载波


    ![](img/81d9dd756f10056160a08242a5d29d2c_7_0.png)


    ![](img/81d9dd756f10056160a08242a5d29d2c_7_1.png)


    # 2.4 信道复用技术


    +   三、码分复用(CDM—Code Division Multiplexing)

    +   • 更常的别名是码分多址(CDMA—Code Division Multiple Access)

    +   • 用于无线通信

    +   • 基本原理

    +     - 每一位比特时间间隔分为 m 个短的时间段，称为码片(chip)

    +     - 每个发送端分配一个唯一的 m 位码片序列，各路的码片序列必须互相正交(orthogonal)

    +     - 使用扩频通信(Spread spectrum)方法，每位转换成为 m 位码片

    +   • 这种码分发送的信号有很强的抗干扰能力，其频谱类似白噪声


    # 2.5 数字传输系统


    # 2.5 数字传输系统


    +   一、脉码调制系统(PCM—Pulse Code Modulation)

    +   • 用于电话交换系统，在数字传输系统中进行多路话音的变换与传输

    +   • 语音由模拟→数字的变换：对模拟话音按周期进行采样和A/D变换

    +     - 采样频率8000次/秒，采样数据用8bit表示

    +     - 话音数据速率：64kb/s

    +   • 数字化的语音数据进行时分多路复用

    +     ——中国使用逐次时分复用

    +     - 每个时分复用包含32个时隙，其中有1个用于同步，30个用于传输语音数据，每路包含8bit，即有8×32=256 bit

    +     - 8000 × 256 bit = 2.048 Mb/s，称为E1，可传输30路语音

    +     - 北美等国家使用另一种时分复用，称为北美T1制，其中1bit用于信令，7bit用于承载，每帧有1个时隙，即有24 × 8 + 1 = 193
    bit

    +     - 8000 × 193 bit = 1.544 Mb/s，称为T1，可传输24路语音


    ![](img/81d9dd756f10056160a08242a5d29d2c_7_2.png)


    # 2.5 数字传输系统


    +   二、同步光纤网SONET和同步数字系列SDH

    +   • 用于高速数字传输，特别是光纤传输

    +   • 1988年美国制定了SONET(Synchronous Optical Network)标准

    +   • 同步传输，系统需要精确的主时钟

    +     - 主要用于光纤传输

    +   • ITU-T以SONET为基础制定出SDH(Synchronous Digital Hierarchy)

    +   • 可以认为SONET与SDH是同义词


    | 传输速率(Mb/s) | SONET 段号 | ITU-T 段号 | 表示网络的相对速率 |

    | 51.840 | OC-1/STS-1 |  |  |

    | 155.520 | OC-3/STS-3 | STM-1 | 155 Mb/s |

    | 466.560 | OC-9/STS-9 | STM-3 |  |

    | 622.080 | OC-12/STS-12 | STM-4 | 622 Mb/s |

    | 933.120 | OC-18/STS-18 | STM-6 |  |

    | 1244.160 | OC-24/STS-24 | STM-8 |  |

    | 2488.320 | OC-48/STS-48 | STM-16 | 2.5 Gb/s |

    | 4976.640 | OC-96/STS-96 | STM-32 |  |

    | 9953.280 | OC-192/STS-192 | STM-64 | 10 Gb/s |

    | 39813.120 | OC-768/STS-768 | STM-256 | 40 Gb/s |


    # 2.6 宽带接入技术


    +   • 接入：access

    +   • 通用术语是指(计算机)用户间网络的技术，如家庭用户

    +   • 接入服务器：access server

    +   • 宽带常有两种定义，宽带接入还包括超高速线的modem+电话线等上网速度56kbps的技术

    +   • 典型宽带接入技术

    +     - 基于电话线的接入技术：基于电话线的ADSL，基于有线电视的HFC

    +     - 基于光纤接入：典型的FTTH'
  - '[PAGE 8]


    # 2.6 宽带接入技术


    # 一、xDSL技术(Digital Subscribe Line)


    +   - “最后—英里(last mile)”

    +   - 通信运营商运营商端局到家庭用户之间的本地回路

    +   - 对此最后一段进行数字化改造成为宽带，对传统电话提供传输方式

    +   - “最后—英里”被称作技术改造的瓶颈和心脏之一


    xDSL技术不改变现有一类“电话线”作为传输媒体的情况下，通过改造现有的模拟电话用户线来提供高速率数据业务的接入技术。


    +   - xDSL的几种类型

    +   - ADSL(Asymmetric Digital Subscriber Line)

    +   - HDSL(High speed DSL)

    +   - SDSL(Single-line DSL)

    +   - VDSL(Very high speed DSL)


    +   - ADSL主要特点

    +   - 仍然保留电话功能，无需对现有的电话系统进行改造

    +   - 下行频率高于上行频率，频率分配使用不同，面向网络接入用户

    +   - 上行

    +   - 管理端，即运行于ISP下行(ISP→用户)业务不同，适应各种用户上网需求(多业务网，下载为主用)


    ![](img/81d9dd756f10056160a08242a5d29d2c_8_0.png)


    接入用户线路接入复用器 DSL Access Multiplexer (DSL Access Multiplexer)

    接入连接单元 ATU (Access Termination Unit)

    ATU-C (C 代表 Central Office)

    ATU-R (R 代表 Remote)

    电话分离器 PS (POTS Splitter)


    # ADSL频谱分布


    ![](img/81d9dd756f10056160a08242a5d29d2c_8_1.png)


    +   - 高频多音频 DMT (Discrete Multi-Tone)调制技术

    +   - 采用频分复用

    +   - 将 40k~1.1MHz 的频谱频段划分为许多子信道，其中 25 个子信道用于上行，249 个子信道用于下行

    +   - 每个子信道宽为 4kHz，并使用不同的载波(即不同的音调)

    +   - 进行数字信号传输

    +   - 用户线彼此差别很大(距离、线材等)，ADSL 采用自适应调制技术使用户端能够传输尽可能高的数据率


    # 2.6 宽带接入技术


    # 一、xDSL技术(Digital Subscribe Line)


    +   - ADSL标准和传输速率

    +   - 1999年，ADSL1形成国际标准ITU-T，下行8Mbps，上行1Mbps

    +   - 2002年，ADSL2，下行12Mbps，上行1Mbps

    +   - 2003年，ADSL2+，下行24Mbps，上行1Mbps


    ADSL定义传输速率是可能达到的最高传输速率，实际传输速率与用户线路的质量和距离相关


    # 2.6 宽带接入技术


    # 二、HFC


    +   - Hybrid Fiber Coax光纤混合同轴网

    +   - 以有线电视网 CATV为基础的宽带接入技术

    +   - 单向广播式传输 → 双向传输

    +   - 传输数据信号 → 传输视频、语音、数据

    +   - 以同轴电缆为主 → 光纤 + 同轴电缆


    +   - 主要特点

    +   - 主干线路采用光纤

    +   - 采用点对点系统结构

    +   - 其具有CATV网络原有的频谱，且具有双向传输功能

    +   - 每个家庭安装一个用户接口盒UIB (User Interface Box)


    同轴电缆连接到用户端，电缆调制解调器确定用户计算机


    ![](img/81d9dd756f10056160a08242a5d29d2c_8_2.png)


    # HFC网的结构


    # 频率划分


    ![](img/81d9dd756f10056160a08242a5d29d2c_8_3.png)


    # 三、基于光纤的宽带接入：FTTx


    +   - 基于光纤传输的宽带接入技术

    +   - FTTH(Fiber To The Home)：光纤到户

    +   - FTTB(Fiber To The Building)：光纤到楼

    +   - FTTC(Fiber To The Curb)：光纤到路边


    +   - 目前用于光纤到户的技术

    +   - GPON(Gigabit-capable Passive Optical Network)

    +   - EPON(Ethernet Passive Optical Network)


    ![](img/81d9dd756f10056160a08242a5d29d2c_8_4.png)


    # 用做光纤到户的无源光网(PON)结构


    # 第2章作业


    +   - 2-04

    +   - 2-05

    +   - 2-07

    +   - 2-09

    +   - 2-13

    +   下周四交'
