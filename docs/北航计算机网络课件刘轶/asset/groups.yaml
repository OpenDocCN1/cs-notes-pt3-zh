  md: "\n## 8.4 IEEE 802.11的MAC层\n\n- **帧间间隔（InterFrame Space）** 详见：闲学天地（www.e-studysk...com）。咨询QQ：2696670126\n\
    \  - IEEE 802.11e，2005年，扩展了CSMA/CA\n  - 一帧发出后，需要保持一段时间的空闲，任何站才可以发送帧\n  - 为不同类型的帧定义了不同的时间间隔\n\
    \    - ① **SIFS**：Short IFS，短帧间隔，用于CTS、ACK等帧\n    - ② **DIFS**：DCF IFS，DCF帧间隔，用于DCF模式下数据帧\n\
    \    - ③ **AIFS1/AIFS4**：Arbitration IFS，不同优先级的帧\n    - ④ **EIFS**：Extended IFS，收到坏帧时报告\n\
    \n- 帧间间隔机制使得在竞争式发送时，高优先级帧可以优先发送\n\n![](img/81d9dd756f10056160a08242a5d29d2c_49_0.png)\n\
    \n- **CSMA/CA的退避算法**\n  - 一个站要发送数据时，检测到信道空闲后，退避一段时间再检测信道并发送\n    （注：退避时间与帧间隔不同）\n\
    \  - 使用二进制指数退避算法：\n    第 i 次退避：在 2^(i+2) 个时隙中随机选择，即：{0, 1, …, 2^(i+2)-1}\n   \
    \ - 第1次退避：退避时间0～7个时隙\n    - 第2次退避：退避时间0～15个时隙\n  - 站点每过一个时隙就检测一次信道：\n    - 若检测到信道空闲，退避计数器继续倒计时\n\
    \    - 若检测到信道忙，就冻结退避计时器的剩余时间，重新等待信道变为空闲并再经过时间DIFS后，从剩余时间开始继续倒计时\n\n- **CSMA/CA主要特性总结**\n\
    \  - 发送前退避\n    → 同时检测到信道空闲的站退避时间长度不同\n  - 发送站/接收站之间RTS/CTS握手\n    → 使隐藏站也知晓数据传输\n\
    \  - 虚拟载波监听NAV配合使用\n    → 等待站无须持续监听信道\n  - 接收站正确接收数据帧后，需返回ACK帧\n    → 使发送站知道是否发生冲突\n\
    \  - 不同类型的帧设置不同的帧间间隔\n    → 控制帧等高优先级帧优先发送出去\n\n> 问：按照CSMA/CA协议，网络中是否可能发生冲突？\n\n\
