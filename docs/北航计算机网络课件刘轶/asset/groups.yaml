  - "[PAGE 49]\n\n• **帧间间隔（InterFrame Space）**详见：闲学天地（www.e-studysk...com）。咨询QQ：2696670126\n\
    \  – IEEE 802.11e、2005年，扩展了CSMA/CA\n  – 一帧发出后，需要保持一段时间的空闲，任何站才可以发送帧\n  – 为不同类型的帧定义了不同的时间间隔\n\
    \    ① **SIFS**：Short IFS，短帧间隔，用于CTS、ACK等帧\n    ② **DIFS**：DCF IFS，DCF帧间隔，用于DCF模式下数据帧\n\
    \    ③ **AIFS1/AIFS4**：Arbitration IFS，不同优先级的帧\n    ④ **EIFS**：Extended IFS，收到坏帧时报告\n\
    \n• 帧间间隔机制使得在竞争式发送时，高优先级帧可以优先发送\n\n![](img/81d9dd756f10056160a08242a5d29d2c_49_0.png)\n\
    \n# 8.4 IEEE802.11的MAC层\n\n• **CSMA/CA的退避算法**\n  – 一个站要发送数据时，检测到信道空闲后，退避一段时间再检测信道并发送\n\
    \    （注：退避时间与帧间隔不同）\n  – 使用二进制指数退避算法：\n    第i次退避：在2^i+1个时隙中随机选择，即：{0, 1, …, 2^(i+1)-1}\n\
    \    • 第1次退避：退避时间0～7个时隙\n    • 第2次退避：退避时间0～15个时隙\n  – 站点每过一个时隙就检测一次信道：\n    •\
    \ 若检测到信道空闲，退避计数器继续倒计时\n    • 若检测到信道忙，就冻结退避计时器的剩余时间，重新等待信道变为空闲并再经过时间DIFS后，从剩余时间开始继续倒计时\n\
    \n# 8.4 IEEE802.11的MAC层\n\n• **CSMA/CA主要特性总结**\n  – 发送前退避\n    → 同时检测到信道空闲的站退避时间长度不同\n\
    \  – 发送站/接收站之间RTS/CTS握手\n    → 使隐藏站与知晓数据传输\n  – 虚拟载波监听NAV配合使用\n    → 等待站无须持续监听信道\n\
    \  – 接收正确接收数据帧后，需返回ACK帧\n    → 使发送站知道是否发生冲突\n  – 不同类型的帧设置不同的帧间间隔\n    → 控制帧等高优先级帧优先发送出去\n\
    \n> 问：按照CSMA/CA协议，网络中是否可能发生冲突？\n\n# 8.5 IEEE802.11的帧结构\n\n• 802.11的帧分为三种类型：数据帧、控制帧、管理帧\n\
    • 帧控制（Frame control）：包含11个子字段\n  – Version：帧版本\n  – Type和Subtype：帧类型（数据、控制、管理）和子类型（如RTS、CTS等）\n\
    \  – To DS和From DS：该帧是发送到或来自于AP连接的网络\n  – More Fragment：分片传输用\n  – Retry：是否是重传帧\n\
    \  – Power management：指明发送方进入节能模式\n  – More data：发送方还有更多的帧需要发送\n  – Protected\
    \ frame：该帧数据部分是否被加密\n  – Order：告诉接收方高层是否按顺序处理帧\n\n| Frame control | Duration |\
    \ Address 1 (receiver) | Address 2 (transmitter) | Address 3 | Sequence | Data\
    \ | Check sequence |\n|---|---|---|---|---|---|---|---|\n| Version | Type | Subtype\
    \ | To DS | From DS | More Frag. | Retry | Pwr. mgmt. | More data | Protected\
    \ | Order |\n\n• **持续时间（Duration）**\n  本帧及ACK帧将占用信道时间（单位：微秒）\n  其它数据根据该字段设置NAV，进行虚拟载波监听\n\
    • **地址（Address）**\n  – 连续3个字节，802标准地址（即MAC地址）\n  – 两个网络之间通信需通过AP，涉及3个地址\n\n| DS状态\
    \ | Address 1 | Address 2 | Address 3 |\n|---|---|---|---|\n| 0 | 1 | 目的地址 | AP地址\
    \ | 源地址 |\n| 1 | 0 | AP地址 | 源地址 | 目的地址 |\n\n![](img/81d9dd756f10056160a08242a5d29d2c_49_1.png)\n\
    \n| Frame control | Duration | Address 1 (receiver) | Address 2 (transmitter)\
    \ | Address 3 | Sequence | Data | Check sequence |\n|---|---|---|---|---|---|---|---|\n\
    | Version | Type | Subtype | To DS | From DS | More Frag. | Retry | Pwr. mgmt.\
    \ | More data | Protected | Order |\n\n# 8.5 IEEE802.11的帧结构\n\n• 序号字段（Sequence）：2字节，用于重复帧的检测\n\
    • 数据（Data）：帧的有效载荷\n  – 帧中数据最多2312字节\n  – 一般小于1500字节\n• 帧校验（Frame check sequence）：32位CRC校验\n\
    • 管理帧格式与数据帧相同，数据内容依管理帧类型而不同\n• 控制帧较短，只有一个地址，没有数据\n\n| Frame control | Duration\
