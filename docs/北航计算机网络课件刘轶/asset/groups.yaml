    A. 7KB B. 8KB C. 9KB D. 16KB\n\n2010年的一道考研题\n主机甲和主机乙之间建立一个TCP连接，TCP最大段长度为1000字节。主机甲的接收窗口为1000字节。在主机甲向主机乙发送数据之前，主机乙已向主机甲发送了初始序号为100的报文段。主机乙收到主机甲的第一个报文段后，确认号应为？\n\
    A. 100 B. 200 C. 300 D. 400\n\n## 5.8 TCP的连接管理\n\n三、拥塞控制方法：快重传和快恢复\n• 快重传（fast\
    \ retransmit）算法思路\n  - 如果发送方在规定时间内未收到确认报文，说明网络中发生了拥塞，此时发送方就重传丢失的小段数据\n  - 接收方收到一个失序的报文段，就发送重复确认，以便使发送方及早知道该报文段已被接收方收到\n\
    \  - 发送方只要连续收到三个重复确认就立即重传对方尚未收到的数据报文段\n• 快恢复（fast recovery）算法思路\n  - 当源端收到连续三个重复的确认时，就进行“乘法减小”，把拥塞窗口ssthresh减半\n\
    \  - 接下来不执行慢启动算法，而是设置cwnd为ssthresh减半值，然后执行拥塞 avoidance（“加法增大”），使拥塞窗口缓慢地线性增大\n\
    \  - 只要收到从网络中传来的没有发生失序的数据（只有重复确认），因为拥塞时不会有重复数据又传回给发送方\n\n# 快重传示例\n\n![](img/81d9dd756f10056160a08242a5d29d2c_36_0.png)\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_36_1.png)\n\n三、拥塞控制方法：快重传和快恢复\n• 发送窗口的上限值\n\
    \  - 从流量控制角度考虑，发送窗口不能超过对方给出的接收窗口rwnd\n  - 综合考虑流量控制和拥塞控制，发送方的发送窗口的上限应取发送方基于拥塞控制窗口rwnd和拥塞窗口cwnd两者中较小的一个\n\
    \  - 发送窗口的上限值 = Min[rwnd, cwnd]\n  - 当rwnd < cwnd时，是接收方的接收能力限制发送窗口的最大值\n  - 当rwnd\
    \ ≥ cwnd时，则是网络的拥塞限制发送窗口的最大值\n\n一、简介\n• TCP传输连接有三个阶段\n  ① 连接建立\n  ② 数据传输\n  ③ 连接释放\n\
    • 连接建立过程中要解决三个问题：\n  - 双方——可能够知道对方的存在\n  - 双方——能够协商一些参数（如最大报文段长度、最大窗口大小、服务类型等）\n\
    \  - 能够使连接双方进行分配（如缓存、连接表中的项目等）\n• TCP 连接的建立都采用客户/服务器方式\n  - 客户(client)：主动请求建立连接的应用进程\n\
    \  - 服务器(server)：被动等待连接建立的应用进程\n\n二、TCP的连接建立\n• TCP连接的建立采用三次握手（three-way handshake）\n\
    \  ① A发送连接请求报文段，其SYN=1，同时选择序号seq=x，并将该报文段发给B\n  ② B收到连接请求报文段，若同意建立连接，则向A发送确认报文段，其ACK=1，确认号ack=x+1，同时也选择一个初始序号seq=y，并将该报文段发给A\n\
    \  ③ A收到B的确认后，向B发送确认报文段，其ACK=1，确认号ack=y+1\n  B收到后，TCP连接建立\n\n![](img/81d9dd756f10056160a08242a5d29d2c_36_2.png)\n\
    \n二、TCP的连接建立\n• 关于3次握手的讨论\n  - 为什么要采用三次握手而不是两次握手？\n    防止“已失效的连接请求报文段”在网络中漫游\n\
    \  - 客户等待超时后，重新发送请求，服务器响应，导致建立连接，服务器建立连接后，客户若收到旧的确认报文段，会误以为连接建立\n  - 安全问题，专门针对三次握手的TCP\
    \ SYN Flooding攻击\n  - 攻击者发送大量SYN报文段，但不向对方发送确认报文段，导致服务器资源耗尽\n  - Linux采用SYN Cookies机制控制这种攻击\n\
    \n## 三、TCP的连接释放\n\n- 连接的释放可由一方发起\n- （假设A主动关闭连接）A发送报文，其首部的 FIN=1，序号seq=u\n- B发出确认，ACK=1，确认号ack=u+1，序号seq=v\n\
    \n- 若发送数据，A要继续发送数据\n- 若已发送完所有数据，A发送连接释放报文(FIN=1, ACK=1)\n- A收到后，发出确认，其中ACK=1，确认号ack=w+1，序号seq=u+1\n\
    - TCP连接必须经过时间2MSL才真正释放掉\n\n![](img/81d9dd756f10056160a08242a5d29d2c_37_0.png)\n\
    \n## 5.8 TCP的连接管理\n\n三、TCP的连接释放\n- 关于MSL\n  - Maximum Segment Lifetime，报文段最大存活时间\n\
    \  - RFC793中建议MSL=2分钟，一般使用更小的值\n- 关闭连接前等待2MSL时间的原因\n  - 为保护A发送的最后一个ACK报文段能够到达B\n\
    \  - 防止“已失效的连接请求报文段”出现在本连接中\n  - A在发送完最后一个ACK报文段后，再经过时间2MSL，就可使本连接持续的时间内所产生的所有报文段，都从网络中消失。这样就可以使下一个新的连接中不会出现这种旧的连接请求报文段\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_37_1.png)\n\n# 第5章作业\n\n- 5-12\n- 5-13\n\
    - 5-14\n- 5-23\n- 5-29\n- 5-31\n- 5-33\n- 5-39\n- 5-41\n下周四交\n\n# 第六章 应用层\n\n\
    刘轶\n北京航空航天大学 计算机学院\n\n# 本章内容\n\n- 6.1 套接字编程接口\n- 6.2 域名系统 DNS\n- 6.3 文件传输协议\n\
    - 6.4 万维网WWW\n- 6.5 电子邮件\n\n# 应用层协议特点\n\n- 应用层协议为了解决某一类应用问题\n  - 由于网络应用的多样性，应用层的协议也种类繁多\n\
    - 应用层的许多协议都是基于客户/服务器方式\n  - 客户(client)和服务器(server)都是指通信中涉及的两个应用进程\n  - 客户/服务器方式所描述的是进程之间服务和被服务的关系\n\
    \  - 客户是服务请求方，服务器是服务提供方\n\n"
