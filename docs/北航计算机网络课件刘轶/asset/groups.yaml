  - "[PAGE 13]\n\n# 3.5 点对点协议 PPP\n\n# 三、PPP 协议的工作状态\n\n![](img/81d9dd756f10056160a08242a5d29d2c_13_0.png)\n\
    \n# 3.6 介质访问控制\n\n**media**：介质、媒体  \n**access**：访问、接入  \n**media access control**：介质访问控制、媒体接入控制\n\
    \n# 3.6 介质访问控制\n\n# 一、局域网的数据链路层\n\n+   - 局域网的主要特点  \n+     - 网络为一个单位所拥有，且地理范围和站点数目均有限\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_13_1.png)\n\n# 3.6 介质访问控制\n\n+   -\
    \ 局域网要解决的重要问题：**介质访问控制技术（Media Access Control）**  \n+     - 问题缘由：局域网通常使用广播信道 \
    \ \n+     - (1) 静态划分信道：频分复用、时分复用、波分复用、码分复用  \n+     - (2) 动态介质访问控制（多点访问）  \n+\
    \       - 随机访问：用户可随时发送信息，可能产生碰撞（冲突）  \n+       - 受控访问：如多点线路探询（polling），或令牌 → 局域网中使用较少\n\
    \n# 3.6 介质访问控制\n\n# 二、CSMA/CD 协议\n\n+   - **Carrier Sense Multiple Access with\
    \ Collision Detection** 载波监听多点访问/碰撞检测  \n+     - 注意：collision 又被译为“冲突”  \n+  \
    \   - 是一种随机访问协议  \n+   - CSMA/CD 的几个核心概念  \n+     - 载波监听（carrier sense）  \n+ \
    \    - 碰撞检测（collision detection）  \n+     - 碰撞强化  \n+     - 碰撞退避\n\n# 3.6 介质访问控制\n\
    \n# 二、CSMA/CD 协议\n\n+   - 载波监听  \n+     - 站点在发送数据之前先检测一下总线上是否有其他结点正在发送数据，有则暂时不发送数据，以免发生碰撞\
    \ → “发送前先听”  \n+   - 碰撞检测  \n+     - 站点边发送数据边检测信道上是否发生了碰撞（监听总线上传输的信号）→ “边发送边听”\
    \  \n+     - 由于线路的传播时延，单纯靠载波监听并不能完全避免碰撞 → 碰撞仍有可能发生  \n+     - 在发生碰撞时，两个或更多的信号在总线上相互叠加，导致无法识别\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_13_2.png)\n\n# 3.6 介质访问控制\n\n+   -\
    \ 碰撞强化  \n+     - 发送方检测到碰撞后，立即停止发送，并发送32或48bit的人为干扰信号（jamming signal），以便让所有用户都知道已经发生了碰撞\
    \  \n+   - 碰撞退避  \n+     - 碰撞后，结点等待一段时间，重新开始载波检测和发送操作  \n+     - 为避免退避后再次碰撞，冲突各方的等待时间应不相同\
    \  \n+     - 以太网采用截断二进制指数退避算法（truncated binary exponential backoff）  \n+     \
    \  - 退避时间：$T = 2^k\\tau$  \n+       - 倍数：在0, 1, ..., $2^k-1$中随机数，$k=\\min(重传次数,10)$\
    \  \n+       - 重传次数超过16后，丢弃该帧，并向上层报告  \n+   - 问：退避算法的效果是怎样的？"
