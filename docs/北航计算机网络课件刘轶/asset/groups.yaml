    \ × 8 + 1 = 193 bit\n  - 8000 × 193 bit = 1.544 Mb/s，称为T1，可传输24路语音\n\n![](img/81d9dd756f10056160a08242a5d29d2c_7_2.png)\n\
    \n### 二、同步光纤网SONET和同步数字系列SDH\n\n- 用于高速数字传输，特别是光纤传输\n- 1988年美国制定了SONET(Synchronous\
    \ Optical Network)标准\n- 同步传输，系统需要精确的主时钟\n  - 主要用于光纤传输\n- ITU-T以SONET为基础制定出SDH(Synchronous\
    \ Digital Hierarchy)\n- 可以认为SONET与SDH是同义词\n\n| 传输速率(Mb/s) | SONET 段号 | ITU-T 段号\
    \ | 表示网络的相对速率 |\n| 51.840 | OC-1/STS-1 |  |  |\n| 155.520 | OC-3/STS-3 | STM-1\
    \ | 155 Mb/s |\n| 466.560 | OC-9/STS-9 | STM-3 |  |\n| 622.080 | OC-12/STS-12\
    \ | STM-4 | 622 Mb/s |\n| 933.120 | OC-18/STS-18 | STM-6 |  |\n| 1244.160 | OC-24/STS-24\
    \ | STM-8 |  |\n| 2488.320 | OC-48/STS-48 | STM-16 | 2.5 Gb/s |\n| 4976.640 |\
    \ OC-96/STS-96 | STM-32 |  |\n| 9953.280 | OC-192/STS-192 | STM-64 | 10 Gb/s |\n\
    | 39813.120 | OC-768/STS-768 | STM-256 | 40 Gb/s |\n\n## 2.6 宽带接入技术\n\n- 接入：access\n\
    - 通用术语是指（计算机）用户接入网络的技术，如家庭用户\n- 接入服务器：access server\n- 宽带常有两种定义，宽带接入还包括超高速线的modem+电话线等上网速度56kbps的技术\n\
    - 典型宽带接入技术\n  - 基于电话线的接入技术：基于电话线的ADSL，基于有线电视的HFC\n  - 基于光纤接入：典型的FTTH\n\n### 一、xDSL技术(Digital\
    \ Subscriber Line)\n\n- “最后一英里(last mile)”\n- 通信运营商端局到家庭用户之间的本地回路\n- 对此最后一段进行数字化改造成为宽带，对传统电话提供传输方式\n\
    - “最后一英里”被称作技术改造的瓶颈和心脏之一\n\nxDSL技术不改变现有电话线作为传输媒体的情况下，通过改造现有的模拟电话用户线来提供高速率数据业务的接入技术。\n\
    \n- xDSL的几种类型\n  - ADSL(Asymmetric Digital Subscriber Line)\n  - HDSL(High speed\
    \ DSL)\n  - SDSL(Single-line DSL)\n  - VDSL(Very high speed DSL)\n\n- ADSL主要特点\n\
    \  - 仍然保留电话功能，无需对现有的电话系统进行改造\n  - 下行频率高于上行频率，频率分配使用不同，面向网络接入用户\n  - 上行（用户→ISP）与下行（ISP→用户）业务不同，适应各种用户上网需求（多业务网，下载为主用）\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_8_0.png)\n\n- 接入用户线路接入复用器：DSL Access\
    \ Multiplexer\n- 接入连接单元：ATU (Access Termination Unit)\n- ATU-C（C 代表 Central Office）\n\
    - ATU-R（R 代表 Remote）\n- 电话分离器：PS (POTS Splitter)\n\n**ADSL频谱分布**\n\n![](img/81d9dd756f10056160a08242a5d29d2c_8_1.png)\n\
    \n- 离散多音频 DMT (Discrete Multi-Tone)调制技术\n- 采用频分复用\n- 将 40kHz~1.1MHz 的频谱频段划分为许多子信道，其中\
    \ 25 个子信道用于上行，249 个子信道用于下行\n- 每个子信道宽为 4kHz，并使用不同的载波(即不同的音调)\n- 进行数字信号传输\n- 用户线彼此差别很大(距离、线材等)，ADSL\
    \ 采用自适应调制技术使用户端能够传输尽可能高的数据率\n\n- ADSL标准和传输速率\n  - 1999年，ADSL1形成国际标准ITU-T，下行8Mbps，上行1Mbps\n\
    \  - 2002年，ADSL2，下行12Mbps，上行1Mbps\n  - 2003年，ADSL2+，下行24Mbps，上行1Mbps\n\nADSL定义的传输速率是可能达到的最高传输速率，实际传输速率与用户线路的质量和距离相关\n\
    \n### 二、HFC\n\n- Hybrid Fiber Coax光纤混合同轴网\n- 以有线电视网 CATV为基础的宽带接入技术\n- 单向广播式传输\
    \ → 双向传输\n- 传输数据信号 → 传输视频、语音、数据\n- 以同轴电缆为主 → 光纤 + 同轴电缆\n\n- 主要特点\n  - 主干线路采用光纤\n\
    \  - 采用点对点系统结构\n  - 其具有CATV网络原有的频谱，且具有双向传输功能\n  - 每个家庭安装一个用户接口盒UIB (User Interface\
    \ Box)\n\n同轴电缆连接到用户端，电缆调制解调器连接用户计算机\n\n![](img/81d9dd756f10056160a08242a5d29d2c_8_2.png)\n\
    \n**HFC网的结构**\n\n**频率划分**\n\n![](img/81d9dd756f10056160a08242a5d29d2c_8_3.png)\n\
    \n### 三、基于光纤的宽带接入：FTTx\n\n- 基于光纤传输的宽带接入技术\n- FTTH(Fiber To The Home)：光纤到户\n- FTTB(Fiber\
    \ To The Building)：光纤到楼\n- FTTC(Fiber To The Curb)：光纤到路边\n\n- 目前用于光纤到户的技术\n  -\
    \ GPON(Gigabit-capable Passive Optical Network)\n  - EPON(Ethernet Passive Optical\
    \ Network)\n\n![](img/81d9dd756f10056160a08242a5d29d2c_8_4.png)\n\n**用作光纤到户的无源光网(PON)结构**\n\
    \n## 第2章作业\n\n- 2-04\n- 2-05\n- 2-07\n- 2-09\n- 2-13\n- 下周四交\n\n"
