    \ / 电磁波在信道上的传播速率(m/s)\n\n- 时延带宽积：时延带宽积 = 传播时延 × 带宽\n- 往返时间(RTT—Round-Trip Time)：\n\
    \  - 又称为往返时延\n  - 从发送方发送数据开始，到发送方收到来自接收方的应答所需的时间\n- 利用率：\n  - 信道利用率和网络利用率\n  -\
