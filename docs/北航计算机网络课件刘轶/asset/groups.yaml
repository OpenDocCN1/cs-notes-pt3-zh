    - (7) 应用层 (application layer)\n\n**数据在各层之间的传递过程**\n\n协议数据单元PDU(Protocol Data Unit)：对等层之间传送的数据单位\n\
    \n有些文献将多个层次的协议称为协议栈(protocol stack)\n\n**三、实体、协议、服务和服务访问点**\n\n- 若干概念：\n  - 实体(entity)：任何可发送或接收信息的硬件或软件进程\n\
    \  - 协议(protocol)：控制两个对等实体进行通信的规则的集合\n  - 服务(service)：协议的实现向下为上一层提供服务，上一层使用服务\n\
    \  - 服务访问点(SAP)：层间接口，称为服务访问点SAP\n- 协议的设计不仅要考虑正常情况，还要考虑各种异常情况，较为复杂\n- 网络协议的经典问题：两军问题\n\
    \  - 两支军队驻扎在富士山和白山之间\n  - 两支军队通信使用信鸽进行，白天信鸽全部失踪\n  - 两支军队只能晚上放鸽子，信鸽经过富士山的山峰时，传递的信息可能丢失\n\
    \  - 蓝军1于次日午夜发起进攻，除非确知蓝2也会同时发起进攻\n  - 如何保证蓝军1能够成功发起进攻？\n\n![](img/81d9dd756f10056160a08242a5d29d2c_3_0.png)\n\
    \n**四、TCP/IP的体系结构**\n\n![](img/81d9dd756f10056160a08242a5d29d2c_3_1.png)\n\n![](img/81d9dd756f10056160a08242a5d29d2c_3_2.png)\n\
    \n### 1.5 网络标准化\n\n**一、概述**\n\n- 标准化对于计算机网络至关重要\n- 标准化使不同厂商的硬件、软件之间能够互连，大家必须遵循统一的规范\n\
    - 标准的分类：\n  - 法定标准：由权威机构制定的正式的、合法的标准\n  - 事实标准：某些公司的产品在竞争中占据了主流，时间长了，这些产品中的协议和技术就成了标准。如TCP/IP\n\
    \n**二、标准化组织**\n\n- ITU-T\n  - 国际电信联盟电信标准化部门(International Telecommunication Union)，前身是国际电报电话咨询委员会(CCITT)\n\
    \  - 各国政府间建立的机构，主要成员是各国的邮电部门，主要负责制定电信行业的标准\n- ISO\n  - 国际标准化组织(International Standard\
    \ Organization)\n  - 由各成员国组成，主要成员是各大公司技术人员、大学教授、政府官员\n  - 负责各行业的标准制定，主要贡献：ISO/OSI\
    \ RM\n- IEEE\n  - 美国电子、电气工程师学会(The Institute of Electrical and Electronics Engineers)\n\
    \  - 专业性组织，学术团体，主要贡献：IEEE 802系列局域网标准\n- IETF\n  - Internet工程任务组(Internet Engineering\
    \ Task Force)\n  - 负责Internet相关标准的制定\n  - 标准形式：RFC xxxx，RFC指Request for Comments\n\
    \n## 第二章 物理层\n\n刘轶\n北京航空航天大学 计算机学院\n\n### 2.2 数据通信的基础知识\n\n**三、信道的极限容量**\n\n-\
    \ 信号失真问题\n- 任何实际信道都不是理想的，在传输信号时会产生各种失真以及信道带宽有限\n- 码元传输速率越高，或信号传输的距离越远，在信道的输出端波形的失真就越严重。\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_5_0.png)\n\n- 信道能够通过的频率范围\n- 一个信道能够通过的频率范围总是有限的，高频分量往往不能通过信道\n\
    - 接收端收到的信号波形失去了码元之间的清晰界限，即“码间串扰”\n- 奈奎斯特(Nyquist)定理\n- 理想低通信道最大数据传输速率 = 2H log2\
    \ V (bps)\n- H——信道带宽，V——信号码元的级数(信号的电平数)\n- 在信道传输中，码元传输速率越高越受到上限的限制，否则会出现码间串扰的现象，使接收端无法从收到的信号中恢复出原来的信号\n\
    - 信道频率带宽越宽，能通过的信号高频分量越多，就可以用更快的速率传输码元而不出现码间串扰\n\n2009年的一道考研题：\n\n在无噪声情况下，若某通信链路的带宽为3kHz，采用4个相位，每个相位具有不同振幅的QAM调制技术，则该通信链路的最大数据传输速率是：\n\
    \nA. 12kbps  B. 24kbps  C. 48kbps  D. 96kbps\n\n- 信噪比：\n  - 信号的平均功率与噪声的平均功率之比，常记为S/N，以分贝(dB)为计算单位\n\
    \  - 信噪比 = 10log10(S/N) (dB)\n  - 例：S/N=10时，信噪比为10dB；S/N=1000时，30dB\n- 1948年，信息论创始人香农(Shannon)推出了香农公式\n\
    - 信道的极限信息传输速率C可表示为：\n  C = W log2(1+S/N) b/s\n  - W：信道带宽\n  - S：信号的平均功率\n  - N：信道内部的高斯噪声功率\n\
    - 香农公式表明：信道带宽或信道中的信噪比越大，则信息的最大传输速率越高\n\n### 2.3 物理层下面的传输介质\n\nmedia: 介质、媒体\n\n\
    - 传输介质，又称为传输媒体或传输媒介，指数据传输系统发送端和接收端之间的物理通路\n- 传输媒体分为两大类：\n  - 导向传输介质\n  - 非导向传输介质\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_5_1.png)\n\n**一、导向传输介质(1/3)**\n\n-\
    \ 双绞线(twisted pair)\n- 通过将两根绝缘铜线绞合，减小相互干扰\n- 分类：\n  - 屏蔽双绞线 STP (Shielded Twisted\
    \ Pair)\n  - 无屏蔽双绞线 UTP (Unshielded Twisted Pair)\n- 在网络布线时常采用无屏蔽双绞线\n- 价格便宜，易于安装使用，传输距离较短\n\
    - 局域网EIA/TIA-568标准定义了非屏蔽双绞线的类别和带宽：\n\n| 类别 | 带宽 |\n|---|---|\n| 3 | 16 MHz |\n\
    | 4 | 20 MHz |\n| 5 | 100 MHz |\n| 5e | 100 MHz |\n| 6 | 250 MHz |\n| 7 | 600\
    \ MHz |\n\n![](img/81d9dd756f10056160a08242a5d29d2c_5_2.png)\n\n**一、导向传输介质(2/3)**\n\
    \n- 同轴电缆(coaxial cable)\n- 由内导体铜芯线外包绝缘外套，再包网状编织屏蔽层和塑料保护外套\n- 抗干扰能力及传输速率均高于双绞线，但造价较高，大规模应用不便\n\
    - 广泛应用的同轴电缆分为2类：\n  - 50Ω同轴电缆\n  - 75Ω同轴电缆\n\n![](img/81d9dd756f10056160a08242a5d29d2c_5_3.png)\n"
