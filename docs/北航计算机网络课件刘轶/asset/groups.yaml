    # 8.2 IEEE802.11的安全性


    # 8.2 IEEE802.11的安全性


    +   - **第一代安全协议：WEP (Wired Equivalent Privacy)**

    +     - 各方面安全性都存在缺陷

    +       - 通过共享密钥加密数据，密钥分配极易导致始终常重复

    +       - 通过32位CRC实现完整性保护，防攻击能力很弱

    +     - 2002年被首次攻破

    +       - 目前使用免费软件可在很短时间内破解WEP

    +   - **在此背景下，802.11沿何处上马**

    +     - 2003年推出WPA (WiFi Protected Access)

    +     - 2004年推出WPA2，成为正式标准性

    +     - WPA是802.11的子集

    +   - **同一时期，中国推出了WAPI (Wireless LAN Authentication and Privacy Infrastructure)，强制性国家标准→原理与802.11相似**


    # 8.2 IEEE802.11的安全性


    +   - 移动站在通过AP发送帧之前须进行认证(authentication)

    +     - 如果802.11网络是开放(open)的

    +       - 可直接通信，无需认证

    +       - 否则必须进行认证

    +   - WPA2的两种认证方式

    +     - ① 有认证服务器

    +       - 配置认证服务器，存有用户名和口令数据库

    +       - 使用802.1x实现认证

    +       - 适用于企业

    +     - ② 无认证服务器

    +       - 移动站和AP间使用预共享密钥(preshared key)进行认证

    +       - 适用于家庭和小型应用场合


    +   - 认证握手过程：4次握手

    +     ① AP发出一个随机数(nonce)用于识别(nonce: 仅使用一次的临时值)

    +     ② 客户端选取自己的临时值nonce，并用其nonce、MAC地址、AP的MAC地址、主密钥制作参与计算会话密钥Kₛ，客户端将自己的临时值和消息完整性检查值(MIC)发送给AP

    +     ③ AP分发一个组密钥K𝐺，并用手后的广播组播组

    +     ④ 客户端确认组密钥

    +   - 后续的通信使用AES算法加密，密钥为会话密钥Kₛ


    ![](img/81d9dd756f10056160a08242a5d29d2c_47_0.png)


    # 8.3 IEEE802.11的物理层


    # 8.3 IEEE802.11的物理层


    +   - **无线频段**

    +     - 多数无线频段由政府管理和分配，需license才可使用

    +     - 预留了无需许可即可免费使用的频段

    +       - ISM频段：ISM—Industrial, Scientific, Medical

    +       - 限制：发射功率 <1 Watt（WLAN一般不超过50mW）


    ![](img/81d9dd756f10056160a08242a5d29d2c_47_1.png)


    # 8.3 IEEE802.11的物理层


    +   - **802.11物理层的几种实现方法：**

    +     - ① 红外IR

    +       - 早期，已很少使用

    +     - ② 2.4GHz跳频扩频FHSS

    +       - 早期，已很少使用

    +     - ③ 直接扩频DSSS

    +       - IEEE80211b，速率11Mbps，广泛应用

    +     - ④ 正交频分复用(OFDM)

    +       - 2003年，IEEE802.11g，速率54Mbps

    +     - ⑤ 多入多出(MIMO)-OFDM

    +       - 2009年，IEEE802.11n，速率600Mbps


    # 8.3 IEEE802.11的物理层


    | 标准 | 频段 | 数据速率 | 物理层 | 优缺点 |

    |---|---|---|---|---|

    | 802.11b | 2.4GHz | 最高11 Mb/s | HR-DSSS | 数据速率较低；信号传播距离远，不易受阻碍物等影响 |

    | 802.11a | 5 GHz | 最高54 Mb/s | OFDM | 数据速率较高；支持更多用户同时上网；信号传播距离较短，易受阻碍物影响 |

    | 802.11g | 2.4GHz | 最高54 Mb/s | OFDM | 数据速率较高；支持更多用户同时上网；信号传播距离远，不易受阻碍物影响 |

    | 802.11n | 2.4GHz / 5GHz | 最高600Mb/s | MIMO + OFDM | 数据速率最高 |'
