    \  - `IP 地址 ::= {<网络号>,<主机号>}`\n  - 不同类别IP地址的网络号、主机号的长度不同\n\n### IP地址中的网络号字段和主机号字段\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_18_0.png)\n\n### IP地址的表示方法：点分十进制记法(dotted\
    \ decimal notation)\n\n32位IP地址 10000000 00001011 00000011 00011111 采用点分十进制记法后可读性更强：128.11.3.31\n\
    \n- 全0、全1的IP地址都具有特殊含义\n  - 全0表示本网络\n  - 全1表示本网络广播\n  - 全1表示广播\n  - 全0表示广播\n\n\
    ### 三、IP地址与物理地址\n\n- IP地址\n  - 网络层及以上各层使用的地址，是一种逻辑地址\n  - 存放在IP数据报首部\n- 物理地址\n\
    \  - 数据链路层及以下各层使用的地址\n  - 存放在数据链路层的帧中\n  - 每一台主机只拥有一块网卡\n  - IP 地址\n  - 逻辑地址\n\
    \  - 网络层及以上使用IP 地址\n  - 物理地址\n  - IP 数据报\n  - 电缆\n  - 链路层以下使用物理地址\n\n### 四、ARP与RARP协议\n\
    \n- IP 地址与物理地址的相互转换问题\n  - 例如：主机H1向主机H2发送邮件，路由器R要将邮件从网络A发送到网络B中，将包发送给主机H2，需要知道H2的物理地址\n\
    - RFC 826: An Ethernet Address Resolution Protocol\n\n![](img/81d9dd756f10056160a08242a5d29d2c_18_1.png)\n\
    \n- ARP协议(Address Resolution Protocol)\n- 每台主机都有一个ARP高速缓存(ARP cache)，保存本地局域网上各主机对应的IP地址和物理地址的映射表\n\
    - 当主机A欲向本局域网的主机B发送IP数据包时：\n  - 先在ARP高速缓存中查是否有主机B的物理地址\n  - 如果能够查出其对应的物理地址，则将该物理地址写入MAC帧，通过数据链路层发送给主机B\n\
    \  - 当主机B收到ARP请求后，向主机A返回一个ARP应答，告知自己的物理地址\n- 注意：\n  - ARP请求是广播发送的，同一局域网中的所有主机都能收到\n\
    \  - ARP完成IP地址和物理地址的映射\n  - IP包最终都要通过物理地址的映射来传送\n  - 若目的主机不在同一个局域网内，则要通过路由器转发；路由器也依赖ARP完成物理地址的映射\n\
    \n### 五、IP数据报格式\n\n- 一个IP数据报也由头部和数据两部分组成\n- 头部：20字节的固定长度 + 0到40字节的可选字段\n\n![](img/81d9dd756f10056160a08242a5d29d2c_19_0.png)\n\
    \n- Version字段：4bit，IP协议的版本，目前的IP协议版本号为4（即IPv4）\n- IHL：4bit，IP包头长度，最小5，最大15，单位为word(32bit)。因此IP包头最短长度为20字节\n\
    - Type of service：1字节，服务类型，目前很少被路由器所识别\n- Total Length：2字节，IP包的总长度（包括头部和数据），单位为字节。因此IP包的最大长度为65535字节\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_19_1.png)\n\n- Identification：2字节，标识，是一个计数器，用来产生IP包的标识\n\
    - 超过数据链路层MTU(Maximum Transmission Unit)时需要分片传输\n- 分片后的多个包具有相同的标识，便于接收端重组\n- DF：1bit，Don't\
    \ Fragment，若DF=0则允许分片\n- MF：1bit，More Fragment，MF=1表示后面“还有分片”，MF=0表示最后一个分片\n-\
    \ Fragment offset：13bit，分片偏移，指出该片在原数据包中的相对位置，以8字节为单位\n\n**分片举例**\n\n![](img/81d9dd756f10056160a08242a5d29d2c_19_2.png)\n\
    \n- Time to live(TTL)：1字节，生存时间，IP包在网络中可通过的路由器的最大次数\n- 实际应用中，IP包每经过一个路由器的TTL减1，为0则丢弃，并向源主机发送一个“超时”包\n\
    - 最大值为255，由主机设定初始值，Windows操作系统一般为128，UNIX操作系统一般为255，Linux一般为64\n\n- Protocol：8bit，协议字段，该包中数据部分的协议类型，即上层协议类型，该字段决定了该包将被交给哪个上层协议模块\n\
    - Header checksum：2字节，包头校验和(注意，只针对包头)\n- Source address：4字节，源IP地址\n- Destination\
    \ address：4字节，目的IP地址\n- 选项字段：以4字节为单位，最长40字节。实际网络中很少使用\n\n![](img/81d9dd756f10056160a08242a5d29d2c_19_3.png)\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_19_4.png)\n"
  mdcn: "\n\n## 3.8 局域网互连\n\n- **源路由网桥**\n  - 源路由（source route）网桥在发送帧时将路由信息放在帧的首部中\n\
    \  - 获取路由信息的方法\n    - 源站以广播方式向目的站发送一个发现帧，发现帧在转发过程中记录所经过的路由\n    - 发现帧到达目的站后，目的站将自己的路由返回源站\n\
    \    - 源站收取返回的发现帧后，从所有可能的路由中选择出一个最佳路由\n  - 与透明网桥相比\n    - 源路由网桥可以获得最佳路由\n    -\
    \ 源路由网桥对网络中的主机不透明\n\n- **虚拟局域网（VLAN）**\n  - VLAN（Virtual LAN），在现有局域网基础上，通过将网络站点分组细分，构成若干逻辑上独立的虚拟局域网\n\
    \  - 注意：帧不会在两个VLAN之间自动转发，包括广播帧\n  - VLAN的用途：便于管理、控制广播风暴、安全性、……\n\n![](img/81d9dd756f10056160a08242a5d29d2c_17_0.png)\n\
