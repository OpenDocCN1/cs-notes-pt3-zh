    # 4.5 路由算法及协议


    # 二、距离向量路由与RIP协议(7/7)


    +   - **RIP优缺点**

    +     - 优点

    +       - 实现简单，开销较小

    +     - 缺点

    +       - 当网络出现故障时，要经过比较长的时间才能将此信息传送到所有的路由器(距离向量路由的固有缺点)

    +       - 支持的网络规模有限，最大距离为15(16表示不可达)

    +       - 路由器之间交换的路由信息是路由器中的完整路由表，随着网络规模的扩大，开销随之增加


    # 4.5 路由算法及协议


    # 三、链路状态路由与OSPF协议(1/7)


    +   - **链路状态路由(link-state routing)的基本思想**

    +     - 每个路由器先完成5步工作：

    +       ① 发现它的邻居节点，获得邻居节点的网络地址

    +       ② 测量邻居各链路的延迟或开销

    +       ③ 构造一个分组，其中包含所有它所知道的信息

    +       ④ 将这个分组发送给其他所有相邻路由器

    +       ⑤ 计算出到每一个其他路由器的最短路径

    +     - 各路由器之间交换完整的路由状态信息，每个路由器都建立一个链路状态数据库。

    +     - 链路状态数据库中包含邻居路由器相邻，以及该链路的“度量”(metric)。

    +     - 链路状态数据库实际上是全网的拓扑结构图，它在全网范围内是一致的(链路状态数据库的同步)。

    +     - 各路由器根据网络拓扑使用Dijkstra算法计算从本路由器到其他各节点的最短路径，将成路由表。


