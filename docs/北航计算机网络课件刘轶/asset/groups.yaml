    # 4.7 虚拟专用网 VPN 和网络地址转换 NAT


    # 一、网络地址转换 NAT


    +   - 当内部网络使用专用地址时，与Internet的通信需要通过NAT(Network Address Translation)


    NAT路由器内部都使用TCP/UDP端口号与外部网络数据包首部向两地址的转换


    # 4.7 虚拟专用网 VPN 和网络地址转换 NAT


