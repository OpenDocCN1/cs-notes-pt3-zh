    \  - 两种选择：面向连接 or 无连接\n  - 曾引起了长期的争论\n  - 争论的实质：可靠传输应由网络还是端系统来负责？\n- 面向连接的服务，即虚电路（virtual\
    \ circuit）\n  - 通信双方在开始数据传输前，先由网络建立连接，之后的数据都通过该连接进行，由网络保证数据传输的可靠性\n  - 建立好后是一种逻辑连接，分组沿着这条逻辑连接按照存储转发方式传送，而并不是真正建立了一条物理连接\n\
