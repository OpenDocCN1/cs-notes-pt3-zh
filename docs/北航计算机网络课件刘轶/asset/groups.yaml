    \ 可直接通信，无需认证\n        - 否则必须进行认证\n    - WPA2的两种认证方式\n        - ① 有认证服务器\n    \
    \        - 配置认证服务器，存有用户名和口令数据库\n            - 使用802.1x实现认证\n            - 适用于企业\n\
    \        - ② 无认证服务器\n            - 移动站和AP间使用预共享密钥（preshared key）进行认证\n       \
    \     - 适用于家庭和小型应用场合\n\n- 认证握手过程：4次握手\n    1. AP发出一个随机数（nonce）用于识别（nonce：仅使用一次的临时值）\n\
    \    2. 客户端选取自己的临时值nonce，并使用自己的nonce、MAC地址、AP的MAC地址、主密钥参与计算会话密钥K_s，客户端将自己的临时值和消息完整性检查值（MIC）发送给AP\n\
    \    3. AP分发一个组密钥K_G，并用于后续的广播/组播组\n    4. 客户端确认组密钥\n- 后续的通信使用AES算法加密，密钥为会话密钥K_s\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_47_0.png)\n\n## 8.3 IEEE 802.11的物理层\n\
    \n- **无线频段**\n    - 多数无线频段由政府管理和分配，需license才可使用\n    - 预留了无需许可即可免费使用的频段\n    \
    \    - ISM频段：ISM—Industrial, Scientific, Medical\n        - 限制：发射功率 <1 Watt（WLAN一般不超过50mW）\n\
    \n![](img/81d9dd756f10056160a08242a5d29d2c_47_1.png)\n\n- **802.11物理层的几种实现方法：**\n\
    \    - ① 红外IR\n        - 早期，已很少使用\n    - ② 2.4GHz跳频扩频FHSS\n        - 早期，已很少使用\n\
    \    - ③ 直接扩频DSSS\n        - IEEE 802.11b，速率11Mbps，广泛应用\n    - ④ 正交频分复用（OFDM）\n\
    \        - 2003年，IEEE 802.11g，速率54Mbps\n    - ⑤ 多入多出（MIMO）-OFDM\n        - 2009年，IEEE\
    \ 802.11n，速率600Mbps\n\n| 标准 | 频段 | 数据速率 | 物理层 | 优缺点 |\n|---|---|---|---|---|\n\
    | 802.11b | 2.4GHz | 最高11 Mb/s | HR-DSSS | 数据速率较低；信号传播距离远，不易受阻碍物等影响 |\n| 802.11a\
    \ | 5 GHz | 最高54 Mb/s | OFDM | 数据速率较高；支持更多用户同时上网；信号传播距离较短，易受阻碍物影响 |\n| 802.11g\
    \ | 2.4GHz | 最高54 Mb/s | OFDM | 数据速率较高；支持更多用户同时上网；信号传播距离远，不易受阻碍物影响 |\n| 802.11n\
    \ | 2.4GHz / 5GHz | 最高600Mb/s | MIMO + OFDM | 数据速率最高 |\n\n### TP-LINK TL-WR845N\n\
    \n- 无线路由\n- 无线标准：IEEE 802.11b/g/n\n- 无线传输速率：300Mbps\n- 1个10/100M WAN口\n- 4个10/100M\
    \ LAN口\n\n### TP-LINK TL-WR720N\n\n- 迷你多功能无线路由器\n- 三种工作模式：AP、Router、3G\n- 无线标准：IEEE\
    \ 802.11b/g/n\n- 无线传输速率：150Mbps\n- 1个10/100M LAN/WAN口\n- 1个10/100M LAN口\n\n##\
    \ 8.4 IEEE 802.11的MAC层\n\n- 以太网的CSMA/CD协议取得了巨大的成功\n- WLAN与以太网同属IEEE 802系列标准\n\
    - 无线网络的特点使WLAN不能简单照搬CSMA/CD：\n    - 无线网络中，终端设备接收到的信号能量远小于发送节点的信号强度，像CSMA/CD协议那样在发送时进行碰撞检测比较困难\n\
    \    - 无线信号覆盖范围有限，即使能够进行碰撞检测，也可能检测不到问题 → 隐藏站问题\n- WLAN使用CSMA/CA协议\n    - CSMA/CA：Carrier\
    \ Sense Multiple Access / Collision Avoidance\n    - 由于无线网络的特点，难以像有线网络那样检测冲突，因此采用碰撞避免\n\
    \    - 比CSMA/CD复杂得多\n\n### 隐藏站问题（hidden station problem）\n\n![](img/81d9dd756f10056160a08242a5d29d2c_48_0.png)\n\
    \n### 暴露站问题（exposed station problem）\n\n![](img/81d9dd756f10056160a08242a5d29d2c_48_1.png)\n\
    \n- 一个发送帧的时序例子：\n    1. A向B发送一个帧，此时B、C都准备发送，它们检测到信道忙，于是等待\n    2. A收到来自B的确认（ACK），信道变为空闲\n\
    \    3. B、C不同时发送，避免冲突，而信道仍处于忙\n    4. C收到来自A的帧，先等待一段时间，等B发送完成帧后，继续等待，退避\n- 与CSMA/CD的两个主要区别\n\
    \    - 无线网络中信道忙时，有帧到达时先退避，而不是发送\n    - 利用确认帧来判断是否发生冲突，无线网络中检测碰撞效果很差\n\n![](img/81d9dd756f10056160a08242a5d29d2c_48_2.png)\n\
    \n- 802.11的MAC层提供两种服务\n    - 分布协调功能DCF：各站点间用CSMA/CA协议竞争使用信道\n    - 点协调功能PCF：集中控制方法，由AP逐一轮询各站发送数据，避免了碰撞的发生\n\
    - 在实际应用中，DCF使用较多\n    - DCF需要考虑的因素：如何尽可能减少冲突\n\n![](img/81d9dd756f10056160a08242a5d29d2c_48_3.png)\n\
    \n- 802.11的载波监听机制\n    - 物理载波监听：检测信道上是否存在有效信号\n    - 虚拟载波监听：802.11中的机制\n- 虚拟载波监听（Virtual\
    \ Carrier Sense）\n    - 发送站把它占用信道的时间放在发送帧中，其他站在收到该信息后，将不会在一段时间内发送数据 → 冲突的几率大大减少\n\
    \    - 该信息由发送帧MAC帧中的“持续时间（Duration）”字段表示\n    - 本帧发送完毕后会显示出信道还要被占用多长时间，包括确认帧发送所需时间\n\
    \    - 虚拟载波监听的优点是，其它站不是在收到信号时，而是在收到发送站的通知后才知道信道被占用\n- 网络分配向量NAV（Network Allocation\
    \ Vector）\n    - 当一个站检测到正在信道中发送的MAC帧所带的“持续时间”字段时，更新自己的网络分配向量NAV（Network Allocation\
    \ Vector）\n    - NAV指出必须经过多长时间才能完成帧的这次传输，才能使信道转入空闲状态\n\n- 使用CSMA/CA的虚拟载波监听\n \
    \   - RTS/CTS机制与NAV配合使用，防止隐藏站在同一时间发送，减少冲突\n    - ① A向B发送数据帧前，先发送一个RTS（请求发送）\n\
    \    - ② B收到此请求后，返回一个CTS（允许发送）\n    - ③ A开始发送数据帧，并启动一个ACK计时器\n    - ④ B收到数据帧后，返回一个ACK\n\
    \    - 如果ACK计时器超时而未收到ACK，则认为发生了冲突，退避后重新发送\n    - 如果其他站收到RTS或CTS，会由此更新自己的NAV\n\
    \    - 因此在收到时间内禁止发送\n\n![](img/81d9dd756f10056160a08242a5d29d2c_48_4.png)\n"
