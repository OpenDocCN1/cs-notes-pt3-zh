    # 三、链路状态路由与OSPF协议(3/7)


    +   - **OSPF(Open Shortest Path First)协议简介**

    +     - 属于链路状态路由协议

    +     - RFC2328: OSPF Version 2

    +     - 优点：

    +       - 收敛速度快

    +         - 当链路状态发生变化时，结点会以洪泛(flooding)方式告知所有网络中的其他所有结点

    +       - 适用于较大规模的网络

    +         - 仅在链路状态发生变化时才发送洪泛信息，不会产生很大通信量


    +   - 为了管理大规模的网络，OSPF将一个自治系统再划分为若干个区域(area)。

    +   - 每一个区域都有一个32位的区域标识符(Areas标识符)。

    +   - 对照区域的划分，利于洪泛传送链路状态信息的范围局限于一个区域即可，避免了整个网络上的通信量。

    +   - 一个区域内的路由器只知道本区域的完整网络拓扑，而不知道其他区域的网络拓扑。

    +   - 层次结构的区域划分，上层的区域称为主干区域(backbone area)，主干区域的作用是用户自治系统其他区域之间互相传递信息。

    +     - 主干区域的标识符规定为0.0.0.0。


