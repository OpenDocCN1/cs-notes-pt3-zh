    \ know a collision has occurred.\n- Collision backoff:\n  - After a collision,\
    \ a node waits for a period of time and then restarts carrier sensing and transmission.\n\
    \  - To avoid another collision after backoff, the waiting times of the conflicting\
    \ parties should be different.\n  - Ethernet uses the truncated binary exponential\
    \ backoff algorithm.\n    - Backoff time: $T = 2^k\\tau$\n    - Multiplier: a\
