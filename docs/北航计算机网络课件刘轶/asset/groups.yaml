    \  或12AB::CD30:0:0:0:0/60\n  或12AB:0:0:CD30::/60\n\n## 7.3 IPv6首部\n\n### 一、IPv6数据报结构\n\
    - 首部长度固定40字节，称为基本首部(base header)\n- 取掉了不必要的功能，首部字段数量减少到8个\n- 取消了首部的校验和字段，加快了由路由器处理数据报的速度\n\
    - 在基本首部的后面可以有零个或多个扩展首部\n- 所有的扩展首部和数据部分合起来叫做数据报的有效载荷(payload)\n\n![](img/81d9dd756f10056160a08242a5d29d2c_44_0.png)\n\
    \n### 二、基本首部\n- 版本(version): 4位, 协议版本, 对应IPv6数据报为6\n- 流标签(traffic class): 8位,\
