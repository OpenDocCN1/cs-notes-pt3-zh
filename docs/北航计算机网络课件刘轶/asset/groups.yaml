    ## 6.2 域名系统 DNS


    ### 一、域名系统概述


    域名系统 DNS（Domain Name System）是 Internet 使用的命名系统

    RFC 1034：Domain Names - Concepts And Facilities

    RFC 1035：Domain Names - Implementation and Specification

    Internet 采用层次结构的命名树作为主机的名字，并使用分布式的域名系统 DNS

    多个域名服务器共同运行专门的域名服务器程序，完成域名到 IP 地址的解析（resolve）

    DNS 基于 UDP 协议实现

    应用进程需要进行域名解析时，就调用域名解析程序（resolver），它成为 DNS 的一个客户

    向本地域名服务器发送域名解析请求（通常包含待解析的域名）

    本地域名服务器在查找域名后，返回应答报文，其中包含对应的 IP 地址


    ### 二、Internet的域名结构


    Internet采用层次结构的命名方法

    ...顶级域名...二级域名...三级域名

    顶级域名（TLD: Top Level Domain）

    国家顶级域名，如：.cn 表示中国，.us 表示美国，.uk 表示英国，等等

    通用顶级域名：


    | 域名 | 含义 |

    |---|---|

    | .com | 公司和企业 |

    | .net | 网络服务机构 |

    | .org | 非营利性组织 |

    | .edu | 美国专用的教育机构 |

    | .gov | 美国专用的政府部门 |

    | .mil | 美国专用的军事部门 |

    | .int | 国际组织 |


    新增的通用顶级域名


    | 域名 | 含义 |

    |---|---|

    | .aero | 航空运输企业 |

    | .biz | 公司和企业 |

    | .cat | 加泰隆人的语言和文化团体 |

    | .coop | 合作团体 |

    | .info | 各种情况 |

    | .jobs | 人力资源管理者 |

    | .mobi | 移动产品服务商和用户提供者 |

    | .museum | 博物馆 |

    | .name | 个人 |

    | .pro | 有证书的专业人员 |

    | .travel | 旅游业 |


    注意：

    - 域名不区分大小写

    - 域名长度不超过255字符


    ![](img/81d9dd756f10056160a08242a5d29d2c_39_0.png)


    ### 三、域名服务器


    域名服务器分为四类

    根域名服务器

    最高级的域名服务器，知道所有的顶级域名服务器的域名和 IP 地址

    当本地域名服务器无法解析域名时，求助于根域名服务器

    顶级域名服务器

    负责管理该顶级域名服务器注册的所有二级域名

    权限域名服务器

    负责一个区（zone）的域名服务器

    本地域名服务器

    有时也称为默认域名服务器

    域名服务器是相对独立地把收到几个域名服务器来保存，其中的一个是主域名服务器，其他的是辅助域名服务器


    树状结构的 DNS 域名服务器


    ![](img/81d9dd756f10056160a08242a5d29d2c_39_1.png)


    主机向本地域名服务器的查询一般采用递归查询

    如果本地域名服务器不知道被查询域名的 IP 地址，那么它就以 DNS 客户的身份，向根域名服务器继续发出查询请求报文

    本地域名服务器向根域名服务器的查询通常是采用迭代查询

    当根域名服务器收到本地域名服务器的迭代查询请求报文时

    要么给出所要查询的 IP 地址

    要么告诉本地域名服务器下一步应向哪一个域名服务器查询

    本地域名服务器进行后续的查询


    本地域名服务器采用迭代查询


    ![](img/81d9dd756f10056160a08242a5d29d2c_39_2.png)


    域名服务器端口号：53

    为提高域名查询效率，域名服务器上通常存放着高速缓存


    本地域名服务器采用递归查询(较少采用)


    根域名服务器 递归查询 顶级域名服务器 dns.com 权威域名服务器 dns.abc.com 本地根域名服务器 dns.xyz.com 递归查询 y.abc.com
    的 IP 地址 m.xyz.com


    2010年的一道考研题


    如果本地域名服务器无缓存，当采用递归方法解析另一网络主机域名时，用户主机、本地域名服务器发送的域名请求消息数分别为 A. 一条、一条 B. 一条、多条 C.
    多条、一条 D. 多条、多条


    ## 6.3 文件传送协议


    RFC 959: File Transfer Protocol (FTP)

    FTP使用客户/服务器方式

    一个FTP服务器同时可为多个客户提供服务

    FTP的服务模型是采用大端口小端口组成

    一个主进程，负责监听新请求

    若有新请求到来，则从主进程中派生一个从进程

    主进程的工作步骤

    打开服务器端端口(端口号为21)，使客户进程能够连接上

    等待客户进程发出连接请求

    启动从属进程处理客户进程发来的请求

    从属进程和客户进程建立连接后可以单独工作

    从属进程在运行过程中若接收到客户进程发来的一些请求

    回到初始状态，继续接受其他客户进程发来的请求

    主进程与从属进程的处理是并行进行的


    FTP使用2个TCP连接：控制连接和数据连接


    控制连接

    在一个会话期间一直保持打开

    FTP客户所发出的控制信息通过控制连接发送给服务器端的控制进程，但控制连接不传输数据

    数据连接

    收到FTP客户发来的文件传输请求后，服务器端控制进程创建“数据连接进程”如“数据传送”

    数据连接用来传输文件的数据，传输完毕后关闭，“数据传送连接”并结束运行


    2009年的一道考研题


    FTP客户和服务器间传送FTP命令时，使用的是连接是 A. 建立在TCP之上的控制链接 B. 建立在TCP之上的数据链接 C. 建立在UDP之上的控制链接
    D. 建立在UDP之上的数据链接


    ## 6.4 万维网WWW


    一、万维网概述

    WWW---World Wide Web

    1989年，欧洲核子研究中心提出WWW

    1993年，第一个浏览器Mosaic

    1995年，Netscape Navigator上市

    万维网是分布式的超媒体(hypermedia)系统，它是超文本(hypertext)系统的扩充

    要解决的几个问题

    怎样将分布在整个网络上的万维网文档？------URL

    用什么协议实现万维网上传各种超链接的链接？------HTTP

    如何存储和表示万维网文档？------HTML

