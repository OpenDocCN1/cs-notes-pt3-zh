    IPv6地址为128位\n- 地址空间≈3.4×10^38，地球表面每平方米×10^10个地址\nIPv6地址采用冒号十六进制记法(colon hexadecimal\
    \ notation)\n- 每一16位的数值用十六进制值表示，各值之间用冒号分隔\n- 例：68E6:8C64:FFFF:FFFF:0:1180:960A:FFFF\n\
    \n冒号十六进制记法\n- 零压缩(zero compression)，即连续的零可以为一对冒号所取代(一个地址只能用一次)\n- 例：FF05::0:0:0:B3\
