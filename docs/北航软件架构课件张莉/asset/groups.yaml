    # 包图


    ◆ 包图的表现形式各异，是因为它们：


    +   ➢ 表现了系统各部分之间存在的数据和功能的依赖关系。

    +   ➢ 描述了系统是如何被分割为若干子系统的。

    +   ➢ 表现了项目的各个阶段。

    +   ➢ 分离了系统特定构件的功能。

    +   ➢ 将整个体系结构的层次分离。


    # 包图——一般用法


    ◆ 类和包的重要区别：


    +   ➢ 类是从问题中或解中发现的事物的抽象

    +   ➢ 包完全是组织设计的机制，在系统运行时不出现。


    ◆ 包用来：


    +   ➢ 对成组的元素建模

    +   ➢ 对体系结构视图建模'
