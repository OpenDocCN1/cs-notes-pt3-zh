    # 例子1: The Swedish Ship Vasa


    +   - **Goal:** in the 1620s, Sweden and Poland were at war. The king of Sweden
    determined to put a swift end to it, so commissioned a new warship, the like of
    which had never been seen before: 70 meters long, able to carry 300 soldiers,
    and with an astonishing 64 heavy guns mounted on two gun decks.

    +   - **Architect Henrik Hybertsson:** with an impeccable reputation

    +     - He had to balance many concerns:

    +       - Swift time to development was critical

    +       - then performance, functionality, safety, reliability, and cost.

    +     - He was also responsible to a variety of stakeholders

    +       - The real customer: the king

    +       - also responsible to the crew that would sail his creation

    +     - His experience: a single-gun-deck ship, --> technical environment of the
    day

    +   - **Result:** August 10, 1628, first sail, never back. --- "bad proportioned"


    # What do we learn from the old story?


    +   - 从这个古老的故事我们得到什么启发?

    +     - Enterprise goals beget requirements, which beget an architecture, which
    begets a system.

    +     - The architecture flows from the architect’s experience and the technical
    environment of the day.


    企业目标 → 需求 → 软件体系结构 → 系统

    体系结构师的经验

    当时的技术条件'
