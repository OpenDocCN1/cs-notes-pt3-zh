    Mellon University | 该研究组重点关注对软件体系结构开发和评审技术、以及软件产品线技术的研究，提出了多种软件体系结构评审方法，如SAAM、ATAM、CBAM等，主要关注非功能属性（质量属性）对体系结构的影响，提出了属性驱动的软件体系结构设计方法ADD（Attribute
    Driven Design）、Quality Attribute Workshop（QAW）。这一研究组出版了大量关于软件体系结构的书籍和著作。目前，该研究组正在致力于将其软件体系结构方面的研究成果集成到一些较流行的软件开发过程方法中，如RUP、XP等。网址：http://www.sei.cmu.edu/publications/publications.html
    |

    | David Garlan, Mary Shaw | Composable Systems Group, School of Computer Science,
    Carnegie Mellon University | Garlan和Shaw对软件体系结构研究有非常重要的推动作用，他们的合著“Software Architecture:
    Perspectives on an Emerging Discipline”成为软件体系结构领域被引用最多的著作之一。该研究组在软件体系结构研究方面处于较为领先的地位，其研究内容较为广泛，包括：软件体系结构基础理论、描述语言（Aesop、Wright、Unicon、ACME）及支持工具（Aesop、AcmeStudio）、软件体系结构风格理论、软件体系结构风格整理和分类、软件体系结构学科教育和培训、动态软件体系结构、软件体系结构细化、以及软件体系结构适用文档化技术等。网址：http://www-2.cs.cmu.edu/~able/
    |


