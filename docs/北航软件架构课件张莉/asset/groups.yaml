    # 软件体系结构渐进设计的基本思想


    +   将整个软件构架设计过程划分为若干阶段

    +   保证软件构架设计可以由粗略到详细逐步推进

    +   减小设计的难度、复杂度以及风险


    +   明确定义每一阶段的实施步骤

    +   整个设计过程更为透明化

    +   更容易被理解和实施


    +   为每个阶段设置明确的结束准则

    +   组织对软件构架的阶段性评审，以有利于问题的及早发现和解决

    +   而不仅仅是在整个设计完成后才一次性进行分析和验证


    +   每一阶段对软件构架模型描述采用相似的核心概念

    +   减少各阶段设计结果之间的语义隔阂

    +   保证各阶段之间可以进行平滑的过渡'
