    |

    | 杨芙清，梅宏 | 北京大学信息科学技术学院软件工程研究所 | 该研究机构从事的研究方向主要包括软件工程基础理论、软件复用技术、面向对象方法与技术等。在软件体系结构方面的主要研究成果包括基于消息总线的软件体系结构风格及描述语言，基于软件体系结构的可复用构件制作和组装技术，基于体系结构、面向构件的软件开发方法ABX及支持工具（ABCTool、PKUAS），以及运行时软件体系结构等。网址：http://sei.pku.edu.cn
    |'
