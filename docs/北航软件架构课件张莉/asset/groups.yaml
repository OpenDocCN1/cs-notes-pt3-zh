    \n- 性能这一质量属性经常用单位时间内所能完成的处理或计算量来表示，或为完成一个处理所需要消耗的时间来表示。\n- 由于通信所用的时间通常大于计算所用的时间，因此系统性能是通过系统中各个组件间进行通信或交互的数据量的函数——虽然还是软件体系结构问题。\n\
    \n## 安全性（Security）\n\n[定义]: 是衡量系统在向合法用户正常提供服务的情况下，阻止非授权使用企图和拒绝服务攻击的能力。\n\n包括：\n\
