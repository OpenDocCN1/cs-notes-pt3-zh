    （软件架构实践，第二版，清华大学出版社）\n\n## 什么是软件体系结构？（续）\n\nDewayne Perry和David Galan于1995年IEEE软件工程学报上定义：\n\
    \n软件体系结构是一个程序/系统各部件 (components) 的结构、它们之间的相互关系、进行设计的原则和随时间演进的指导方针。\n\n南加州大学软件工程中心的Barry\
    \ Boehm等1995指出：\n\n- 一个软件体系结构包括：\n- (1) 一个软件和系统部件、各种连接器以及约束的集合；\n- (2) 一个系统需求说明的集合\
    \ (风险承担者 (stakeholder) 的需求陈述)；\n- (3) 一个基本原理用以说明这一部件，连接器以及约束定义的系统可以满足系统stakeholders的需求陈述。\n\
    \n## 什么是软件体系结构？（续）\n\n1997年，Bass,Clements和Kazman在《实用软件体系结构》一书中的定义：一个程序或计算机系统的软件体系结构包括一个或一组软件部件、软件部件的外部可见特性及其相互关系。\n\
    \n- 多个结构（structures）\n- “外部可见特性”是指软件部件提供的服务、性能、特性、错误处理、共享资源使用等。\n- 这一定义强调软件体系结构必须从系统中抽象出某些信息。\n\
    \n## 什么是软件体系结构？（续）\n\n> ◆ Bass, Clements, and Kazman *Software Architecture in\
    \ Practice*, Addison-Wesley 2003\n> \n> > “一个程序或计算系统的软件体系结构是指该系统的各种结构，它包含软件组件，这些组件的外部的可见属性，以及它们之间的关系。”\n\
    \n> ◆ ANSI/IEEE标准1471-2000对大规模软件系统体系结构的描述建议\n> \n> > “软件体系结构被定义为系统的基本组织结构，包括构件、构件之间的关系、环境以及管理系统设计和演化的原则。”\n\
    \n## 软件体系结构定义(续)\n\n- ◆ Booch & Rumbaugh & Jacobson 定义\n- \n  - 一个软件系统的体系结构要对以下一系列重要问题作出决定：\n\
    \    - 确定软件系统的组织方案 —— Organization\n    - 选择构成该系统的结构元素及其界面 —— Element Interface\n\
    \    - 确定由这些元素的合作所获得的行为 —— Behavior\n    - 确定这些结构与行为元素逐步至规模更大的系统的组合方案 —— Structure\
    \ Composition\n    - 指导组织这些元素及其界面以及它们之间的合作与组合的体系结构风格 —— Style\n"
  mdcn: "\n\n## 解决方案：模型-视图-控制器 (MVC)\n\n- • MVC风格主要处理软件用户界面开发所面临的问题。\n- 界面变动大，不同系统平台不一样。\n\
    \n- • MVC是一种软件体系结构，它将应用程序的数据模型/业务逻辑、用户界面分别放在独立的构件中，从而对用户界面的修改不会对数据模型/业务逻辑造成很大影响。\n\
    \n- • MVC在传统的B/S体系结构的基础上加入了一个新的元素：控制器，由控制器来决定视图与模型之间的依赖关系。\n\n![](img/da691714eec1b93795825838a75ee408_119_0.png)\n\
    \n## 模型—视图—控制器风格\n\n![](img/da691714eec1b93795825838a75ee408_119_1.png)\n\n构件\n\
    \n- - 模型(Model, M)：用于管理应用系统的行为和数据，并响应为获取其状态信息(通常来自视图)而发出的请求，还会响应更改状态的指令(通常来自控制器)；——对应于传统B/S中的业务逻辑和数据\n\
    \n- - 视图(View, V)：用于管理数据的显示；——对应于传统B/S中的用户界面\n\n- - 控制器(Controller, C)：用于解释用户的鼠标和键盘输入，以通过模型和视图进行相应的更改。——在传统B/S结构中新增的元素\n\
    \n## MVC运行机制\n\n模型：\n封装业务逻辑/数据\n将数据变化通知视图\n\n模型\n- 封装应用状态\n- 提供应用功能\n- 向视图通知变化\n\
    \n视图：\n显示用户界面\n将用户行为传递给控制器\n\n视图\n- 渲染模型\n- 将用户手势发送给控制器\n- 允许控制器选择视图\n\n控制器\n\
    - 定义应用行为\n- 将用户操作映射为模型更新\n- 选择用于响应的视图\n- 每种功能一个\n\n控制器：\n将用户行为映射到模型的更新上\n选择需要显示的视图\n\
    \n功能调用\n事件\n\n## 模型—视图—控制器风格\n\n- - 优点\n  - 问题分解考虑，简化系统设计，保证系统的可扩展性；\n  - 改变系统界面不影响应用程序的功能内核，易于演化，可维护性好；\n\
    \  - 易于改变，甚至可能在运行时改变，提供了很好的动态机制。\n- - 缺点\n  - 主要局限在应用软件的用户界面开发领域\n- - 典型实例\n \
    \ - Windows应用程序的文档视图结构\n  - 在SmallTalk和Java应用程序中常用到。\n\n## 异质体系结构\n\n- - 异构是不可避免的\n\
    \  - 一个系统的体系结构往往是不同风格的组合。\n  - 不同风格的结构适合于不同的应用场合\n  - 新系统需要和老系统协调工作\n\n![](img/da691714eec1b93795825838a75ee408_121_0.png)\n\
    \n## 层次异质\n\n- - 组合的方法\n  - 空间异质（Spatial/Locational heterogeneous）\n    - 允许构件使用不同连接件的混合。系统以一种体系结构实现一个子系统，以另外一种体系结构实现另一个子系统。如：一个构件既可以通过其部分接口访问仓库，也可以应用管道和系统中的其他构件交互，还可以通过其它接口接受中央信息。\n\
    \  - 时间异质（Temporal/Simultaneously heterogeneous）\n    - 系统在不同的时间采用不同的风格。如，一个管道过滤器系统的构件被发现为一个独立进程。整个系统的运行时体系结构就会随有无此进程的参与而发生变化。\n\
    \  - 层次异质（Hierarchically heterogeneous）\n    - 按照层次结构组好子。采用了某种体系结构风格的系统，其构件和连接件内部可以是另外一种体系结构。例如，分层系统中的某一层可以用不同的风格实现。\n\
