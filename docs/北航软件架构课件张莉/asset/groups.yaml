    # Architecture and the UML


    ![](img/da691714eec1b93795825838a75ee408_226_0.png)


    Organization

    Package, subsystem

    Dynamics

    Interaction

    State machine


    # UML的用例视图


    +   - 从系统外部执行者的角度理解系统的功能：它描述执行者与系统的交互，其执行者可以是一个用户，也可以是另一个系统。

    +   - 用例图面向客户、建模人员、开发人员和测试人员，是系统模型图的核心。

    +   - 用例视图：用例图和活动图描述。

    +   - 一张用例图是系统的一种用途的描述；一组用例图描述了整个系统所期望的用途。'
  - '[PAGE 227]


    # UML的逻辑视图


    +   - **描述系统如何提供要求的功能：**

    +     - 静态结构：

    +       - 类（界面，内部结构）；对象；关系。

    +       - 用类图和对象图描述。

    +     - 动态行为：

    +       - 对象之间相互发送消息而引发的动态合作关系。

    +       - 用状态图、顺序图、合作图和活动图描述。

    +       - 各种特性：永久性，并发性。

    +   - **主要是面向设计人员和开发人员。**


    # UML的构件视图


    +   - **描述实现的各个模块及其相互之间的关系：**

    +     - 模块的内部结构；

    +     - 模块间的依赖关系；

    +     - 关于各构件的一些附加信息：

    +       - 资源分配（构件的责任）；

    +       - 其它管理信息，如开发工作的进展报告等。

    +   - **主要面向开发人员。**

    +   - **构件视图：**由构件图组成，其中构件表示不同类型的代码模块。'
  - '[PAGE 228]


    # UML的并发视图


    +   - 系统中进程和处理器的划分。


    +   - 属于非功能性特性：

    +     - 着眼于资源的有效利用；

    +     - 并行执行，并发地执行多线程控制，处理线程之间的通信和同步；

    +     - 处理来自外部环境的同步事件。


    +   - 面向开发人员和系统集成人员。


    +   - 描述并发视图的主要模型图：

    +     - 动态图：状态图，合作图，活动图。

    +     - 实现图：构件图，配置图。


    # UML的配置视图


    +   - 展示系统的物理配置，如计算机和其它设备(统称结点)及其相互之间的连接关系，包括在物理的体系结构中如何配置构件的映射关系。


    +   - 面向开发、集成和测试人员。


    +   - 配置视图用配置图描述。'
