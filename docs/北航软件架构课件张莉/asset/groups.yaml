  - '[PAGE 194]


    # ADL与其它语言的比较


    +   > 构造能力：ADL能够使用较小的独立体系结构元素来建造大型软件系统；

    +   > 抽象能力：ADL使得软件体系结构中的构件和连接件描述可以只关注它们的抽象特性，而不管其具体的实现细节；

    +   > 重用能力：ADL使得组成软件系统的构件、连接件甚至是软件体系结构都成为软件系统开发和设计的可靠用部件；

    +   > 组合能力：ADL使得其描述的每一系统元素都有其自己的局部结构，这种描述局部结构的特点使得ADL支持软件系统的动态变化组合；

    +   > 异构能力：ADL允许多个不同的体系结构描述关联存在；

    +   > 分析和推理能力：ADL允许对其描述的体系结构进行多种不同的性能和功能上的多种推理分析。


    # 介绍几种典型的ADL


    +   - Wright

    +   - ACME

    +   - Aesop

    +   - C2

    +   - UniCon

    +   - Darwin

    +   - Rapide

    +   - MetaH

    +   - XYZ/ADL

    +   - AADL'
  - '[PAGE 195]


    # Wright


    +   - Wright是美国卡内基-梅隆大学软件工程研究所的Robert J. Allen和David Garlan等人定义的完全形式化的软件系统结构描述语言。它为体系结构中连接提供了形式化基础。

    +   - 可以描述体系结构风格、系统族、体系结构实例和单个系统。

    +   - 提供了对计算构件和连接件的描述

    +   - 关键思想：

    +     - 将体系结构连接件定义为明确的语义实体。这些实体用协议的集合来说明，而这些协议代表了交互中的各个参与角色及其相互作用。


    # Wright


    +   - 特点：使用显式的、独立的连接件类型作为交互模式。

    +     - 构件定义由3部分组成：构件标识符、端口集合、表示构件计算行为的CSP进程。

    +     - 构件通过端口与其它构件进行交互。连接件也有类似于构件的端口。粘接规则描述参与交互各方的行为如何协调、组合。

    +   - 符号定义如下：

    +     - e?x表示x是事件e的输入值。在通道e上输入x。

    +     - e! y表示y是事件e的输出值。在通道e上输出y。

    +     - e→P前缀操作符，表示一进程执行事件e，然后成为进程P。

    +     - P□Q表示一进程不确定的选择进程P或Q执行。

    +     - P▣Q表示一进程根据与其发生交互的其它进程从进程P和进程Q中选择一个执行。

    +     - √终止操作符，表示进程可以终止。'
  - "[PAGE 196]\n\n# 例子\n\n+   - 下图是一个简单的客户机/服务器模型。\n+     - 该模型由一个连接件和一个系统配置组成。\n\
    +       客户的request端口和服务器的provide端口分别连接到连接器的Client和Server角色上。\n\n![](img/da691714eec1b93795825838a75ee408_196_0.png)\n\
    \n# 例子\n\n+   - 一个简单的客户服务器结构的体系结构\n\n```\nSystem SimpleExample\n  Component Server\
    \ =\n    port provide [provide protocol]\n    spec [Server specification]\n  Component\
    \ Client =\n    port request [request protocol]\n    spec [client specification]\n\
    \  Connector C-S-connector =\n    role client [client protocol]\n    role server\
    \ [server protocol]\n    glue [glue protocol]\n  Instances\n    s: Server\n  \
    \  c: Client\n    cs: C-S-connector\n  Attachments:\n    s.provide as cs.server\n\
    \    c.request as cs.client\n  end SimpleExample\n```\n\n第一部分：定义构件和连接件类型\n\n第二部分：定义构件和连接件实例的集合\n\
    \n第三部分：定义构件和连接件实例被组合在一起的方式"
  - '[PAGE 197]


    # 体系结构描述和推理


    +   - 体系结构描述包括：协议（用CSP进程表示）和协议轨迹预测说明

    +   - 支持端口和角色的一致性检查。

    +   - CSP（Communicational Sequential Processes）是 C A R.

    +     - Hoare在1978年提出的分布式程序设计原则“通讯顺序进程”。它是进程代数的重要组成部分，并被广泛用于并发分布式设计的建模和分析。

    +     - C A R. Hoare, Communicating Sequential Processes, Prentice Hall. 1985
    （英国图灵奖获得者）

    +   - CSP提供了丰富的描述进程行为的语义集，主要包括进程的语义、实施、行为、并发、通信等内容。


    # CSP (Communicational Sequential Processes)


    +   - 语言的目的：为了克服传统程序设计语言在多处理器体系上的障碍。

    +     - 基本单元是一系列并发的进程，同时能很方便地描述进程之间的通信和同步。

    +     - 一段CSP描述由一组按顺序执行的命令组成。

    +     - CSP可以通过并行命令生成新的进程。一个新进程不能使用进程之间共享的变量。并行命令中的进程是同步执行的。并行命令的结束是以所有进程都结束为标志的。'
  - '[PAGE 198]


    # 特点


    +   - Wright只选用了CSP的一个小型子集，包括：

    +     - 进程与事件（Processes and Events）

    +     - 前缀(profixing)

    +     - 选择

    +     - 决策


    +   - Wright没有提供图形化的描述方式。


    +   - 主要特点：

    +     - 将连接件语义进行了显示的形式化表示，支持用户将复杂的交互模式定义成新的连接件类型。

    +     - 支持用户自定义软件体系结构风格，并可对风格的约束进行检查。与Aesop将软件体系结构风格的约束信息内嵌到实现对象的方法中的做法不同，Wright对软件体系结构及其约束信息的定义都是显示表示的。


    +   - Wright的语义建立在CSP基础之上，通过事件和进程来定义构件、连接件、以及软件体系结构配置的行为，支持模型的一致性、完整性检查，以及构件之间连接关系的静态死锁分析。'
  - '[PAGE 199]


    # ACME


    +   - ACME是一种软件体系结构交换语言

    +     - 目的：解决目前出现的众多软件体系结构描述语言之间的不兼容问题。

    +     - 可以作为体系结构设计工具中的通用交换格式，也可以作为开发新的体系结构设计和分析工具的基础。

    +   - ACME项目开始于1995年，由Carnegie Mellon大学的David Garlan等人开发。

    +     - 当时的目标是在不同的体系结构开发工具之间提供一种能够相互交换体系结构描述的工具。

    +     - 目前，ACME语言和工具开发库（Acmelib）为软件体系结构描述、表示、生成和分析，提供了一种通用的、可扩展的基础设施。

    +   - 尽管从严格意义上讲，ACME并不是一种体系结构描述语言，但是它包含了大量ADL特点，实用性很高。我们也作简要介绍。


    +   - ACME语言和工具包提供3种功能:

    +     - 体系结构的相互交换。

    +       - 提供一种体系结构设计的交换格式。

    +       - 允许各种开发工具与其他补充工具协同工作。

    +     - 为新的体系结构设计和分析工具提供了可扩展的基础。

    +       - 体系结构设计和分析工具需要一个用于描述、存储、操纵体系结构设计表示法

    +       - ACME及其开发工具提供了一个很好的基础。

    +     - 体系结构描述。

    +       - ACME本身是很好的开发语言，虽然不是适合所有的应用系统。

    +       - ACME可以让开发者很好地认识体系结构建模，提供了一个相对容易的对简单软件系统的描述方法。'
