    \n![](img/da691714eec1b93795825838a75ee408_297_4.png)\n\n![](img/da691714eec1b93795825838a75ee408_297_5.png)\n\
    \n## What Engineers Do\n\n- Before they build the real thing...\n\n![](img/da691714eec1b93795825838a75ee408_298_0.png)\n\
    \n...they first build models\n\n...and then learn from them\n\n![](img/da691714eec1b93795825838a75ee408_298_1.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_298_2.png)\n\n![](img/da691714eec1b93795825838a75ee408_298_3.png)\n\
    \n—From IBM\n\n## Engineering Models\n\n- Engineering model:\n  - *A reduced representation\
    \ of some system*\n\n![](img/da691714eec1b93795825838a75ee408_298_4.png)\n\n![](img/da691714eec1b93795825838a75ee408_298_5.png)\n\
    \nModeled system\n\nModel\n\n- Purpose:\n  - *To help us understand a complex\
    \ problem or solution*\n  - *To communicate ideas about a problem or solution*\n\
    \  - *To drive implementation*\n\n—From IBM\n\n## Characteristics of Useful Models\n\
    \n- **Abstract（抽象性）**\n  - Emphasize important aspects while removing irrelevant\
    \ ones\n- **Understandable（可理解性）**\n  - Expressed in a form that is readily understood\
    \ by observers\n- **Accurate（准确性）**\n  - Faithfully represents the modeled system\n\
    - **Predictive（可预测性）**\n  - Can be used to derive correct conclusions about the\
    \ modeled system\n- **Inexpensive（经济性）**\n  - Much cheaper to construct and study\
    \ than the modeled system\n\n## How Models are Used\n\n- To detect errors and\
    \ omissions in designs before committing full resources to full implementation\n\
    \  - Through (formal) analysis and experimentation\n  - Investigate and compare\
    \ alternative solutions\n  - Minimize engineering risk\n- To communicate with\
    \ stakeholders\n  - Clients, users, implementers, testers, documenters, etc.\n\
    - To drive implementation\n\n## Evolving Models\n\nAdding detail to a high-level\
    \ model:\n\n![](img/da691714eec1b93795825838a75ee408_301_0.png)\n\n## 模型表示的统一\n\
    \n- 存在种类繁多的系统建模需求\n- 存在各种各样的建模语言和工具\n- 由于建模语言的不同，尽管有些模型内容相似，但表示方式和建模元素并不一致\n\n\
    需要一种以一致方式描述建模语言的方法，MOF可以完成这一任务，这也是OMG制定MOF规范的初衷。\n\n## 横向与纵向的统一\n\n- 横向：对某领域内现有重要的建模语言进行选取，合并成一个新的建模语言，以统一的方式描述模型构造及构造间的关系\n\
    - 纵向：提供核心的基本建模构造，定义一个开放的层次结构，通过继承和实例化等扩展机制，定制多种建模语言\n\n## UML的形成-横向统一\n\n![](img/da691714eec1b93795825838a75ee408_302_0.png)\n\
    \n## 基于MOF的纵向统一\n\n![](img/da691714eec1b93795825838a75ee408_303_0.png)\n\n## MOF\n\
    \n- 什么是MOF？\n- 什么是模型？\n- 四层元模型\n- MOF的核心元建模构造\n- MOF的应用（后面讲）\n"
  mdcn: "\n\n## 对模型的要求\n\n- 模型是以精确定义的语言对系统（或系统的一部分）作出的描述。\n- 精确定义的语言是具有精确定义的形式（语法）和含义的语言，这样的语言适合计算机自动解释。\n\
    \n## 变换\n\n![](img/da691714eec1b93795825838a75ee408_292_0.png)\n\n- 变换是按照变换定义从源模型到目标模型的自动生成。\n\
    - 变换定义是一组变换规则，这些规则共同表达了用源语言描述的模型如何变换为目标语言表述的模型。\n- 变换规则是对源语言中一个（或一些）构造如何变换为目标语言中一个（或一些）构造的描述。\n\
    \n![](img/da691714eec1b93795825838a75ee408_293_0.png)\n\n- 变换定义描述了用源语言表达的模型如何变换为目标语言表达的模型。\n\
    - 变换工具按照变换定义为特定源模型执行变换。\n\n## 工具分类\n\n![](img/da691714eec1b93795825838a75ee408_293_1.png)\n\
    \n## MOF\n\n- 什么是MOF？\n- 什么是模型？\n- 四层元模型\n- MOF的应用\n- MOF的核心元建模构造\n\n## 什么是MOF？\n\
    \nMOF（元对象设施）是OMG组织制定的元数据管理框架。\n\n按OMG MOF核心规范所述：MOF提供一组元数据服务，这些服务可以完成基于模型（元数据）的系统开发，及系统间的交互。\n\
    \n- 1997年，OMG制定了MOF1.1规范\n- 自1997年开始，OMG对MOF1.1进行过较小的修订，直到2002年4月\n- 2006年发布2.0\n\
    \n## MOF\n\n- 什么是MOF？\n- 什么是模型？\n- 四层元模型\n- MOF的核心元建模构造\n- MOF的应用（后面讲）\n\n## 什么是模型？\n\
    \n- 我国《大百科全书》把模型定义为：\n  - “按照科学研究的目的，用物质形式或思维形式对原型客体本质关系的再现。通过对模型的研究获得关于原型客体的知识”\n\
    - DOD对模型的定义是：\n  - “对一个系统、实体、现象或过程的物理、数学或其他逻辑表示”\n\n简言之：“模型是对客观事物的一种抽象描述。”\n将被考察的事物抽象为模型，是解决实际问题的一个基本思路。\n\
    \n## 飞机模型\n\n![](img/da691714eec1b93795825838a75ee408_296_0.png)\n\n## 电路模型\n\n\
    ![](img/da691714eec1b93795825838a75ee408_296_1.png)\n\n![](img/da691714eec1b93795825838a75ee408_296_2.png)\n\
    \n## 桥梁模型\n\n![](img/da691714eec1b93795825838a75ee408_297_0.png)\n\n![](img/da691714eec1b93795825838a75ee408_297_1.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_297_2.png)\n\n## OO模型\n\n![](img/da691714eec1b93795825838a75ee408_297_3.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_297_4.png)\n\n![](img/da691714eec1b93795825838a75ee408_297_5.png)\n\
    \n## 工程师做什么\n\n- 在建造真正的产品之前……\n\n![](img/da691714eec1b93795825838a75ee408_298_0.png)\n\
    \n……他们首先构建模型\n\n……然后从中学习\n\n![](img/da691714eec1b93795825838a75ee408_298_1.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_298_2.png)\n\n![](img/da691714eec1b93795825838a75ee408_298_3.png)\n\
    \n——摘自IBM\n\n## 工程模型\n\n- 工程模型：\n  - *对某个系统的简化表示*\n\n![](img/da691714eec1b93795825838a75ee408_298_4.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_298_5.png)\n\n被建模的系统\n\n模型\n\n- 目的：\n\
    \  - *帮助我们理解复杂的问题或解决方案*\n  - *传达关于问题或解决方案的想法*\n  - *驱动实现*\n\n——摘自IBM\n\n## 有用模型的特征\n\
    \n- **抽象性（Abstract）**\n  - 突出重要方面，去除无关方面\n- **可理解性（Understandable）**\n  - 以观察者容易理解的形式表达\n\
    - **准确性（Accurate）**\n  - 忠实地表示被建模的系统\n- **可预测性（Predictive）**\n  - 可用于推导关于被建模系统的正确结论\n\
    - **经济性（Inexpensive）**\n  - 构建和研究的成本远低于被建模的系统\n\n## 模型的使用方式\n\n- 在投入全部资源进行全面实现之前，发现设计中的错误和遗漏\n\
    \  - 通过（正式）分析和实验\n  - 研究和比较备选解决方案\n  - 最小化工程风险\n- 与利益相关者沟通\n  - 客户、用户、实现者、测试者、文档编写者等\n\
    - 驱动实现\n\n## 模型的演化\n\n为高层模型添加细节：\n\n![](img/da691714eec1b93795825838a75ee408_301_0.png)\n\
    \n## 模型表示的统一\n\n- 存在种类繁多的系统建模需求\n- 存在各种各样的建模语言和工具\n- 由于建模语言的不同，尽管有些模型内容相似，但表示方式和建模元素并不一致\n\
    \n需要一种以一致方式描述建模语言的方法，MOF可以完成这一任务，这也是OMG制定MOF规范的初衷。\n\n## 横向与纵向的统一\n\n- 横向：对某领域内现有重要的建模语言进行选取，合并成一个新的建模语言，以统一的方式描述模型构造及构造间的关系\n\
    - 纵向：提供核心的基本建模构造，定义一个开放的层次结构，通过继承和实例化等扩展机制，定制多种建模语言\n\n## UML的形成-横向统一\n\n![](img/da691714eec1b93795825838a75ee408_302_0.png)\n\
    \n## 基于MOF的纵向统一\n\n![](img/da691714eec1b93795825838a75ee408_303_0.png)\n\n## MOF\n\
    \n- 什么是MOF？\n- 什么是模型？\n- 四层元模型\n- MOF的核心元建模构造\n- MOF的应用（后面讲）\n\n"
