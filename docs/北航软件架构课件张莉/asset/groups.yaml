  mdcn: "\n\n## 软件开发过程----瀑布模型\n\n![](img/da691714eec1b93795825838a75ee408_139_0.png)\n\
    \n## 区分三个概念\n\n- 用户需求、系统需求和开发需求\n\n![](img/da691714eec1b93795825838a75ee408_139_1.png)\n\
    \n## 我竟然是做需求的？\n\n## 近几年博士生的工作选题\n\n2004年评上博导，至今（2015年）\n\n- 毕业了14个博士，有6个论文和需求有关，尤其是最近5年毕业的学生中有5个和需求有关。还有一个是09年毕业的。\n\
    - 还毕业了3个留学博士生，2个和需求有关（名字中看不出来）\n  - 一个：从需求模型到设计模型，最好的文章：2008年WWW\n  - 一个：从用户行为挖掘，改进质量，最好的文章：RE\
    \ 2012（毕业后才采用的）\n- 目前已开题的，和即将开题的，大部分和需求有关。\n\n## 区分两个概念\n\n- 用户需求、系统需求和开发需求\n\n\
    ![](img/da691714eec1b93795825838a75ee408_140_0.png)\n\n## 成本\n\n软件项目中40%~60%的问题都是在软件需求分析阶段埋下的“祸根”。(Leffingwell\
    \ 1997)\n\n- 软件测试、维护\n- 软件开发费用的40%~60%，还是80%\n- 为什么？\n- 一直以来重编码，轻设计。重体力劳动，轻脑力劳动。\n\
    - 早期埋下祸根。缺乏整体规划\n- 怎么办？\n- 考虑全生命期的费用，增加前期投入，降低整体成本。\n\n## 时间——进度\n\n- 磨刀不付砍柴功。\n\
    - 抓设计、重评审，可以提高进度和质量，大大缩短系统开发和调试时间。早期评审正在成为保证软件质量的重要技术手段。\n- 重用：设计重用和代码重用—基于构件的软件开发：体系结构和构件是核心\n\
    - 体系结构是并行开发和外包的基础。\n- 增量式开发：总体规划、分步实施。有利于占领市场、也有利于用户反馈，降低风险。成功的基础是良好的体系结构。\n\n\
    ## 软件工程进展\n\n- 20世纪60年代末－70年代中期：\n  - 高级语言应用，结构化程序设计技术，支持工具\n- 20世纪70年代中期－80年代：\n\
    \  - 计算机辅助软件工程（CASE），软件工程环境。\n- 20世纪80年代中期－90年代：\n  - 出现面向对象语言和方法，并成为主流的软件开发技术\n\
    \  - 开展软件过程及软件过程改善的研究\n  - 软件构件技术、软件体系结构技术\n\n## 越重要，耗时越长成本越高\n---摘自软件工程的演进\n\n\
    ![](img/da691714eec1b93795825838a75ee408_142_0.png)\n\n## 需求秋千理论\n\n![](img/da691714eec1b93795825838a75ee408_143_0.png)\n\
    \n## • 软件体系结构\n\n- 1992和1993年，以【1】【2】两篇文章的发表为主要标志，软件体系结构作为软件工程中一个新兴的研究领域逐渐引起了人们的广泛关注。\n\
    - 【1】Dewayne E. Perry and Alexander L. Wolf, Foundations for the study of software\
    \ architecture. ACM SIGSOFT Software Engineering Notes, 17(4):40–52, October 1992.\n\
    - 【2】David Garlan and Mary Shaw. An introduction to software architecture. In\
    \ Advances in Software Engineering and Knowledge Engineering, volume 1. World\
    \ Scientific Publishing Co., 1993.\n\n软件体系结构是对软件设计层次的再一次提升\n\n|  | 设计 | 软件体系结构设计\
    \ |\n|---|---|---|\n| 设计重点 | 算法+数据结构 | 系统整体组织结构 |\n| 主要概念 | 过程、函数、过程调用 | 构件、连接件、端口、角色、配置\
    \ |\n| 关注特性 | 单个构件的接口和行为特性 | 系统全局质量属性 |\n\n- 软件体系结构在软件开发中的作用越来越受到开发组织重视\n- 以软件体系结构为中心的开发方法逐渐被广泛采纳\n\
    \n## 结论\n\n- 随着计算机应用的逐步广泛和深入，随着信息技术的突飞猛进的发展，各行各业对于大规模、密集型软件应用系统的需求越来越普遍，对软件开发的周期要求越来越短，对于软件质量保证的要求越来越高，基于软件体系结构的软件开发方法是满足这些苛刻要求的必经途径。\n\
    \n## 例子1: 瑞典战舰瓦萨号\n\n- **目标：** 在1620年代，瑞典和波兰处于战争状态。瑞典国王决心迅速结束战争，因此委托建造一艘前所未有的新型战舰瓦萨号：长70米，能够搭载300名士兵，并装有令人惊叹的64门重炮，布置在两层炮甲板上。\n\
    - **建筑师 Henrik Hybertsson：** 声誉卓著\n  - 他必须平衡诸多关注点：\n    - 开发时间迅速至关重要\n    - 其次是性能、功能、安全、可靠性及成本。\n\
    \  - 他还要对多方利益相关者负责\n    - 真正的客户：国王\n    - 还要对将驾驶其创造物的船员负责\n  - 他的经验：单层炮甲板的船 -->\
    \ 当时的技术环境\n- **结果：** 1628年8月10日，首次出航，从此再未返回。——“比例失调”\n\n## 我们能从这个古老的故事中学到什么？\n\
    \n- 从这个古老的故事我们得到什么启发?\n- 企业目标 → 需求 → 软件体系结构 → 系统。\n- 体系结构源于建筑师的经验和当时的技术环境。\n\n\
    企业目标 → 需求 → 软件体系结构 → 系统\n体系结构师的经验\n当时的技术条件\n\n## 教训\n\n- 合理切实可行的系统结构是保证系统成功运行的首要因素。\n\
    \  - Vasa战舰设计精良，但是船体比例严重失调，体系结构存在致命的缺陷\n- 设计师在无前人设计、建造过配备如此多武器装备舰船的情况下，既要执行国王的命令，又要对未来的船员负责，还有考虑舰艇的性能、功能、安全性、可靠性、造价等多项指标。（见下页）\n\
    \  - 勉强答应不可能的需求\n- 吸取的教训：在构建任何一个应用系统之前，应对所用体系结构进行评价，以减少开发系统的风险。\n- 建立软件体系结构的业务周期ABC。\n\
    \n## 体系结构受系统利益相关者影响\n\n![](img/da691714eec1b93795825838a75ee408_147_0.png)\n\n\
    ## 体系结构业务周期\n\n客户和最终用户\n开发组织\n技术背景\n体系结构设计师的经验\n需求(质量)\n体系结构设计师\n体系结构\n系统\n\n\
    - 软件体系结构受系统风险承担者的影响\n- 软件体系结构受技术、组织方面因素的影响\n- 软件体系结构受体系结构设计师的影响\n- 体系结构影响开发组织的结构\n\
    - 体系结构影响开发组织的企业目标\n- 体系结构影响后续系统的客户需求\n- 该系统的创建过程影响体系结构设计师的经验。少量系统将影响，并实际改变软件工程文化\n\
    \n## WWW\n\n- 技术：1986– 中心数据库\n- Len Bass : 1986– 中心数据库\n- Tim Berners-Lee，欧洲粒子物理实验室\
    \ CERN 的研究员\n  - 1989 “信息管理：建议”\n  - 1990 万维网\n    - 为了在异构计算环境中促进 CERN 研究人员之间的互动。\n\
    \n"
