  md: "\n## 什么是软件体系结构？（续）\n\n对软件体系结构定义的总结分析：\n\n- > 软件体系结构定义了软件部件(Component)，包括部件间交互的定义，特别强调省略和部件相互关系无关的内容信息(content\
    \ information)。\n- > 软件体系结构并不说明部件的具体实现是什么、部件相互关系的具体体现是什么。\n- > 每一个软件系统都有自身的体系结构，即由软件部件及其相互关系组成。\n\
    - > 软件体系结构中每一部件的行为是体系结构的一部分，反映部件间如何进行交互。\n- > 软件体系结构的基本元素是部件，部件的描述信息包括：\n\n- （1）计算功能：部件所实现的核心功能；\n\
    - （2）额外功能特性：描述部件的执行效率、处理能力、环境假设和整体特性；\n- （3）结构特性：描述部件如何与其他部件集成在一起，以构成系统信息；\n-\
    \ （4）家族特性：描述了相同或相关部件之间的关系。\n\n## 什么是软件体系结构？（续）\n\n表1: 普通部件及其支持的相互作用\n\n| 部件类型\
    \ | 部件支持的相互作用类型 |\n|---|---|\n| 模块(Module) | 过程调用、数据共享 |\n| 对象(Object) | 方法调用\
    \ |\n| 过滤器(Filter) | 数据流 |\n| 过程(Process) | 消息传递、远程过程调用、通讯协议、同步 |\n| 数据文件(Data\
    \ file) | 读/写 |\n| 数据库(Database) | 模式(Schema)、查询语言 |\n| 文档(Document) | 共享表示假设\
    \ |\n\n## 第一部分　软件体系结构概述\n\n- - 什么是软件体系结构（粗略的）\n- - 为什么研究软件体系结构？\n- - 对软件体系结构的进一步认识\n\
    - - 软件体系结构的重要性\n- - 什么是软件体系结构\n- - 软件体系结构的研究领域\n- - 一个实例\n\n## 为什么研究软件体系结构\n\n\
    ## 1、软件开发当前的问题\n\n- - 规模；\n- - 质量；\n- - 进度；\n- - 新技术、软件资产、需求……\n- 怎么解决？\n\n![](img/da691714eec1b93795825838a75ee408_130_0.png)\n\
    \n## 1. 计算机应用的深入及影响\n\n- a. 软件组成的复杂化\n- （新开发的代码，集成软件资产，源代码和二进制文件，静态库，动态库，不同语种、不同平台的集成）\n\
    - b. 程序规模变化（1000行 -3000万行的程序代码）\n- c. 平台的多样化\n- （多种操作系统、应用程序的混合、多厂商联合开发）\n\n-\
    \ d. 物理的分布（由集中到分布，由此带来技术上的考虑）\n- e. 协议（各种通讯协议的混合）\n- f. 功能分配（出现了多层的应用程序模式）\n-\
    \ g. 产品需求的更改（需求的变化，市场的变化）\n- h. 算法和数据结构（退居次要地位，特别是硬件性能的提高）\n\n如何有效的考虑软件组织，而且是从高层进行抽象？适应将来的负载？\n\
    \n## 2.软件市场的新趋势\n\n- ——零时间（开发周期短）\n- ——零bug（软件质量）\n- ——开发方法的革新\n\n（硬件、机械和汽车产业的启示，\n\
    基于构件的软件开发要求考虑软件的体系结构）\n\n## 软件系统的开发已变得越来越复杂\n\n![](img/da691714eec1b93795825838a75ee408_132_0.png)\n\
    \n> ➢ The challenge over the next 20 years will not be speed or cost or performance;\
    \ it will be a question of complexity.\n\nBill Raduchel, Chief Strategy Officer,\
    \ Sun Microsystems\n\n> ➢ Our enemy is complexity, and it’s our goal to kill it.\n\
    \nJan Baan\n\n- ➢ **IBM360系统之父 F. Brooks：**复杂性是软件的固有属性\n- \n- ➢ 软件复杂性不能通过任何方法彻底消除，只能采取某些手段加以控制\n\
    \  - 技术创新\n  - 软件开发过程改进\n  - 可视化建模和模型驱动的开发\n  - 提高软件设计的抽象层次\n\n## Dimensions of\
    \ software complexity\n\n![](img/da691714eec1b93795825838a75ee408_133_0.png)\n\
    \n## 一个最复杂的系统\n\n## 美国空中交通管制系统ATC(Air Traffic Control)\n\n- - 需求:\n- - 美国的航空业发达，商用飞机、私人飞机和军用飞机数量远远高于其他国家；\n\
    - - 系统要求很高的实时性、安全性和分布性\n- - 对系统软件体系结构的要求\n- - 极高的可用行和高性能\n- - 开发性、可更改性、不断提高自系统的能力和互操作性\n\
    - - 系统\n- - 架构在广域网上，综合了20世纪90年代计算机领域的各种技术\n- - 系统规模\n\n## 一个最复杂的系统（续）\n\n## 系统规模\n\
    \n- - 总长度：Ada程序 > 100万行；\n- - 系统分布在数百台计算机上，并嵌入了各种新的、复杂的硬件设备。\n- - 所有这些都必须对不可预见的实时事件随时作出响应。\n\
