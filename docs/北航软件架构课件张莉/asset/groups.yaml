  - '[PAGE 200]


    # 特点


    +   - ACME有如下主要特点:

    +     - 用7种基本的设计元素来表示软件体系结构

    +     - 提供了一种灵活的注释机制，支持将体系结构和用子语言表示的非结构化信息结合起来。这些子语言是外部定义的。

    +     - 提供了一种类型机制，用于抽象出共同的、可重用的体系结构惯用法和风格。

    +     - 提供了一个开放的语义框架，用于体系结构描述的推理。


    # ACME体系结构设计元素类型


    +   - 7类基本元素:

    +     - 构件、连接件、系统、端口、角色、表述和表述图。

    +   - 核心是：构件、连接件和系统


    ![](img/da691714eec1b93795825838a75ee408_200_0.png)'
  - "[PAGE 201]\n\n• **构件**：代表系统中基本的计算元素和数据存储。\n  - 典型的构件有：客户、服务器、过滤器、对象、黑板、数据库等。\n\
    • **连接件**：构件之间的通信和交互方式。\n  - 例子：简单的交互形式，如管道、过程调用、事件广播等；复杂的交互，如客户/服务器协议、数据库和应用程序之间的SQL连接。\n\
    • **系统**：代表构件和连接件的配置。\n\n• **构件的接口**：定义为端口（port）的集合。一个端口表示构件与外部环境的一个交互点。\n• **连接件的接口**：可以用角色来定义。每个角色定义了连接件所代表的交互中的一个参与方。\n\
    \  - 二重连接有两个角色。如RPC中的Caller和Callee；管道连接中的Reading和Writing；消息发送连接中的sender和receiver等。\n\
    \n# 例子\n\n![](img/da691714eec1b93795825838a75ee408_201_0.png)\n\n• 以C/S模型为例。图中包含两个构件和连接件。\n\
    ACME描述如下：\n\n```\nSystem simple_CS={\n    Component Client = { Port send-request\
    \ }\n    Component Server = { Port receive-request }\n    Connector RPC = { Roles\
    \ (Caller, Callee) }\n    Attachment: { Client. send-request to RPC.Caller\n \
    \                 Server. receive-request to RPC.Callee\n                }\n}\n\
    ```"
  - '[PAGE 202]


    +   - ACME支持体系结构的分层描述。每个构件或连接件都能用一个或多个更详细、更底层的描述来表示——称为一个表述（representation）。

    +   - 表述图：当某个构件或连接件有体系结构描述时，表述图用于说明在这个表述的系统内部和此表述所代表的构件或连接件的外部接口之间，存在何种关系。


    # 构件的表述和属性


    ![](img/da691714eec1b93795825838a75ee408_202_0.png)'
