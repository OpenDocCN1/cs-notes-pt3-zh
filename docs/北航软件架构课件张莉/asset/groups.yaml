  mdcn: "\n\n## 6. 保持文档为最新，但不要太最新。-2\n- 通过让最新的文档来回答问题，帮助在你的组织中建立以文档为基础的文化。\n- 对文档应能回答的问题的首次回应应该是，“你可以在文档的这里找到答案。”\n\
    - 如果信息缺失，要么更新文档，要么以提供答案为代价，要求提问者提交变更请求表。\n- 确保下一个版本包含该信息。\n- 这传递了一个强有力的信息，即文档是获取信息的首选、权威来源。\n\
    - 与之形成对比的是，那位每次电话响起都乐于回答问题的架构师。电话会一直响个不停。\n\n## 6. 保持文档为最新，但不要太最新。-3\n- 不要让它*太*最新：\n\
    \  - 在设计过程中，决策会被频繁地考虑和重新考虑。\n  - 每五分钟就修订一次文档会导致不必要的开销。发布过于频繁会让读者感到沮丧。\n  - 确定开发过程中的节点，在这些节点上会发布最新的文档。\n\
    \  - 遵循一种对你的项目有意义的发布策略或节奏。\n\n## 良好文档的原则\n- 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n- 3.\
    \ 避免歧义。\n- 4. 使用标准的组织结构。\n- 5. 记录你的理由。\n- 6. 保持文档为最新，但不要太最新。\n- 7. 审查文档。\n\n##\
    \ 7. 审查文档。-1\n- 只有文档的预期使用者才能告诉你它是否：\n  - 包含正确的信息\n  - 以有用的方式呈现信息\n  - 满足他们的需求。\n\
    - 计划与文档所创建的利益相关者的代表一起审查你的文档。\n- *主动设计*审查是一种很好的使用技巧。\n\n## 7. 审查文档。-2\n- *主动设计审查：*\n\
    \  - 避免一次全体会议\n  - 使用精心挑选的审查者\n  - 要求每个审查者审查文档的一部分，……\n\nPamas,D.L. and Weiss\
    \ D. M., 1985, Active design reviews: principles and practices, in proceedings\
    \ of the 8th international conference on Software engineering.\n\n## 总结\n- 某些原则适用于所有文档，而不仅仅是软件架构的文档。\n\
    - 将它们用作指南，帮助你编写高质量的文档。\n- 你也可以在审查他人文档时使用它们，以帮助他们改进。\n\n## 模块视图\n\nViews: Decomposition,\
    \ Uses, Layers, Generalization...\n\nElements: modules, where a module is a code\
    \ unit that implements some functionality\n\nRelation: Relations among modules\
    \ can be\n- A \"is part of\" B. This defines a part-whole relation among modules.\n\
    - A \"depends on\" B. This defines a dependency relation among modules.\n- A \"\
    is a\" B. This defines specialization and generalization relations among modules.\n\
    \n## 模块视图的用途是什么？\n- 构造：这些视图是代码的蓝图。模块被分配给团队进行实现，并且通常是后续设计的基础，例如接口设计。\n- 分析：可追溯性和影响分析依赖于实现单元。项目管理、预算、规划和跟踪通常使用模块。\n\
    - 教育：软件开发者可以通过理解模块视图来学习开发项目的结构。\n\n## 模块视图的表示法\n- 非正式：\n  - box and line（嵌套可以表示“是…的一部分”）\n\
    \  - 文本大纲\n  - 表格\n- 半正式：\n  - UML 类图和包图\n\n## 模块视图类型中的五种风格\n- Decomposition style:\
    \ documents how system responsibilities are partitioned across modules and how\
    \ those modules are decomposed into submodules\n- Uses style: tells the developer\
    \ what other modules must exist for this portion of the system to work correctly.\n\
    - Generalization style: documents the \"is a\" relations among elements of the\
    \ system.\n- Layered style: documents the \"allowed to use\" relations among elements\
    \ of the system.\n- Aspect style: modules crossing concerns in object-oriented\
    \ designs.\n\n## 分解风格\n- Elements: modules\n- Relations:\n  - \"is part of\" Criteria\
    \ for decomposition vary:\n    - Achievement of modifiability\n    - Build vs.\
    \ buy\n    - Software product lines: common vs. unique parts\n    - Developer's\
    \ skills\n- Topology: A child can have only one parent.\n- What it's for:\n  -\
    \ Starting point for assigning responsibilities to modules as a prelude to subsequent,\
    \ downstream design.\n  - Change/impact analysis\n  - Basis for work assignments\n\
    \  - Basis for unit testing\n\n## 示例 1：UML 中的模块分解视图\n\n![](img/da691714eec1b93795825838a75ee408_39_0.png)\n\
    \n"
