    # 软件体系结构相关的研究团体/机构及领军人物


    | 领军人物 | 研究团体/机构 | 主要研究内容及成果 |

    |---|---|---|

    | Barry Boehm | Center for Software Engineering at University of Southern California
    (CSE USC) | 该中心由Barry Boehm于1993年创建，主要从事大型系统设计和开发过程、通用以及特定领域软件体系结构、软件工程工具和环境的研发及教学工作。在软件体系结构方面，该研究组侧重于研究软件体系结构在整个软件生命周期中的作用，包括：软件体系结构设计、建模和细化、视图集成和一致性检查、软件体系结构描述语言与UML的集成、特定领域软件体系结构。

    网址：http://sunset.usc.edu/about_center/index.html |

    | Richard N. Taylor | Institute of Software Research (ISR) at University of California,
    Irvine | 该研究组主要研究C2风格的软件体系结构的设计、描述、动态演化以及支持工具的开发，定义了软件体系结构描述语言C2、xADL，并在ADL的分析、比较以及与UML的融合方面做了大量研究工作。

    网址：http://www.isr.uci.edu/architecture/index.html |'
