  - '[PAGE 190]


    # 为什么需要形式化方法


    +   - 在计算机科学，形式化方法指的是用于软件与硬件系统的说明、开发与验证的数学化方法。

    +   - 形式化方法的特点:

    +     - 可以用于系统描述，且可以在不同层次上进行描述：精确的语义，消除语义模糊。

    +     - 在体系结构行为描述的优势:

    +       - 更利于机器表达和计算

    +       - 提供了形式化且准确的定义用于描述行为、行为模式、行为分析。如：进程代数提供了代数法则用于处理分析等

    +       - 对行为的分析和建模是系统验证的主要组成部分


    +   - 形式化方法使得系统验证变得可行

    +     - 自动化理论证明：在给定系统描述的情况下，基于逻辑原语与推理规则来进行形式化证明

    +     - 模式识别：系统通过对可能到达的状态进行完全搜索的方式验证特定的属性。

    +   - 常见的形式化方法

    +     - Petri网：主要用于描述分布式系统。

    +     - Z语言：用于计算系统的建模和描述

    +     - B-Method(Abrial, 1996)

    +     - CSP（Hoare, 2004）

    +     - 。 。 。 。 。 。'
  - "[PAGE 191]\n\n- 软件体系结构描述语言ADL（Architecture Description Language）\n  - ADL是软件体系结构研究领域为进行软件体系结构描述和分析而专门定义的一种语言符号。\n\
    \  - “ADL指用来表示和分析软件体系结构的形式化符号”。一般认为，ADL的核心元素主要包括：\n    - 构件（Component）：表示系统中主要的计算元素和数据存储，如客户端、服务器、数据库等；\n\
    \    - 连接件（Connector）：定义构件之间的交互关系，如过程调用、消息传递、事件广播等；\n    - 软件体系结构配置（Architecture\
    \ Configuration）：描述构件、连接件之间的拓扑关系。构件、连接件的外部可见特性由接口定义。\n\n# 分类\n\n+   - 根据各个ADL的研究范围，可归纳为：\n\
    +     - 描述软件体系结构配置的ADL\n+     - 描述软件体系结构实例的ADL\n+     - 软件体系结构风格的ADL\n+   - 典型的ADL有：Aesop，C2，Darwin，Rapide，SADL，UniCon，Meta-H，和Wright等。"
  - '[PAGE 192]


    # 部分ADL


    | ADL | 研究单位和代表人物 | 适用范围 | 主要设计元素/特点 | 具备的主要能力 |

    |---|---|---|---|---|

    | Aesop | 美国卡内基-梅隆大学软件工程研究所、David Garlan等 | 同一设计环境中多种软件体系结构风格的应用、特定风格软件体系结构设计环境、软件体系结构的快速生成
    | 定义了六种通用对象类型：构件、连接件、端口、角色、表示和绑定；以子类方式通过类型进行扩展；可定义新类型；每个对象类型用一个C++类表示，软件体系结构风格信息保存在C++类代码实现中
    | 外部工具集成：语法制导的类型检查；代码编译；可执行系统的生成；循环、资源冲突、调度可性性检查 |

    | C2 | 美国加利福尼亚大学圣地亚哥分校、Richard N. Taylor等 | 主要适用于分布式构件环境中、基于消息的图形用户界面应用系统的软件体系结构描述
    | 主要设计元素为构件、连接件以及它们之间的拓扑关系；构件只能通过连接件访问，具有“受限的可见性”；异步通信消息和请求是构件间唯一的通信方式 | 软件体系结构演化；软件体系结构动态配置；多形式的类视图查看；设计决策过程支持；可执行代码生成
    |

    | MetaH | 美国霍尼韦尔公司 | 一种特定领域的ADL，支持对可靠性分析和安全性要求较高的多处理器实时嵌入式系统的创立、分析和谐验证，主要应用于航空电子子控制软件系统
    | 基于形式化调度 and 数据流模型；提供定义的结构件和连接件类型，与硬件密切相关；构件包括处理器、端口、子系统、包、监视器和进程等；连接类型包括事件连接、端口连接、等价连接和存取连接等
    | 软硬件绑定：实时调度；可靠性 and 安全性能分析；代码自动生成、编译和链接


    # 部分ADL


    | ADL | 研究单位和代表人物 | 适用范围 | 主要设计元素/特点 | 具备的主要能力 |

    |---|---|---|---|---|

    | Unicon | 美国卡内基-梅隆大学软件工程研究所、Mary Shaw等 | 一种通用类型的ADL，支持多种构件和连接件类型类型的综合应用 | 主要设计元素为构件和连接件，构件和连接件类型以类的方式预定义，并定义了构件类型和连接件类型之间的匹配规则，连接件机制在被设计工具的实现中
    | 类型检查；编译、验证和可执行系统的自动生成；外部工具集成；进程调度分析 |

    | Rapide | 美国斯坦福大学、David C. Luckham等 | 基于事件的、复杂、并发、分布式系统软件体系结构描述 | 主要要素由数据接口（相当于构件）和连接规则组成，接口定义描述操作、服务、行为和约束；构件的计算和交互活动通过事件集合（postsets）定义；构件的行为为集中式抽象状态和状态转移规则定义
