    - 什么是功能性？\n- 体系结构的类型\n- 功能性属性：它是如何与其他质量属性交互，以及它是如何提供其他质量属性的。\n\n## 体系结构和质量属性\n\
    \n必须从设计、实现到部署的整个过程中考虑质量属性。\n\n## 在复杂系统中，决不可能以独立的方式实现质量属性。\n\n- 任何一个质量的实现都会对其他质量属性的实现产生积极或消极的影响。\n\
