    # Linux 的代码规模


    Linux版本2.6.27更新后,已经超过了1000万行。

    使用David Wheeler的SLOCCount计数程序对Linux内核代码库进行的分析发现了一些有趣的事实。分析发现只有6,399,191行源代码，因为这个计数程序没有计算空白行、注释和其它输入的信息。下面是SLOCCount程序提供的代码分类统计：


    | 类型 | 行数 | 百分比 |

    |---|---|---|

    | 驱动程序 | 3,301,081 | 51.6 |

    | 架构 | 1,258,638 | 19.7 |

    | 文件系统 | 544,871 | 8.5 |

    | 网络 | 376,716 | 5.9 |

    | 声音 | 356,180 | 5.6 |

    | Include | 320,078 | 5.0 |

    | 内核 | 74,503 | 1.2 |

    | 内存管理 | 36,312 | 0.6 |

    | 密码学 | 32,769 | 0.5 |

    | 安全 | 25,303 | 0.4 |

    | 其它 | 72,780 | 1.1 |'
