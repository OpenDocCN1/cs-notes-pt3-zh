    \ 2 周内完成该项改变。”\n- 可见，一个一般场景可能含有多个特定于系统的场景。\n\n## 下面讨论 6 个最常见的系统质量属性\n\n- 目的：\n\
    \  — 确定质量属性描述所使用的概念；\n  — 提供一个为该属性生成一般场景的方法。\n\n## 1、可用性（Availability）\n\n- 可用性与系统故障及其相关后果有关。\n\
    - 当系统无法提供所承诺的服务时，就出现了系统故障。\n- 系统的用户（人或其它系统）可以感知到这种失效。\n\n![](img/da691714eec1b93795825838a75ee408_8_0.png)\n\
    \n## 可用性\n\n- 可用性所涉及的方面：\n  - 如何检测系统故障；\n  - 系统故障产生的原因；\n  - 此故障将导致什么样的问题；\n \
    \ - 如何保证系统尽可能长时间正常运行；\n  - 什么时机可以安全地出现故障；\n  - 如何防止或缓解故障发生；\n  - 发生故障时如何进行通知等。\n\
    - 系统出现故障后，一个重要概念是：\n  - 恢复所需的时间：从出现故障到用户看不到故障的时间。\n\n## 可用性\n\n- 系统的可用性：系统正常运行的时间比例。\n\
    \  例如：\n  “对于生产系统”\n  可用性标准：至少 99.9% 的可用性，0.1% 的停机率。\n- 区分：故障和错误。\n- 区分故障与错误，使系统有可能实现自动恢复。\n\
    - 注意：计划内的停机和维护时间不算故障。\n\n## 可用性的一般场景生成\n\n| 场景 | 可能的值 |\n|---|---|\n| 源 | 系统故障、系统崩溃\
    \ |\n| 刺激 | 故障、错误、损坏、异常 |\n| 制品 | 系统的硬件、软件、数据、持久存储、进程 |\n| 环境 | 正常操作、偶发事件 |\n\
    | 响应 | 系统检测到故障，并执行以下一个或多个动作：<br>- 将其记录下来；<br>- 通知用户或其它系统；<br>- 采取措施恢复系统；<br>-\
    \ 根据故障重要性采取不同措施并通知相关人员 |\n| 响应度量 | 故障检测所需的时间<br>- 从故障发生到用户不再感知故障的时间<br>- 系统正常模式和降级模式下的运行时间<br>-\
    \ 恢复时间 |\n\n## 2、可修改性（Modifiability）\n\n- 可修改性涉及更复杂的成本问题。\n- 需要考虑两个方面：\n  - 修改的对象（制品）是什么？例如，系统的功能、性能或结构等：\n\
    \    - 修改系统的各个部分；\n    - 由谁来进行修改（例如，开发者、系统用户）。\n  - 系统修改的成本，包括修改后系统与其他系统保持兼容、用于各种不同环境的成本；\n\
    \  - 系统修改的复杂性（例如，是否容易检查、未来是否易于再次修改等）；\n  - 修改可能发生的时机和场景（例如，开发方、用户方）。\n- 哪些修改更重要，以及如何设计系统的结构和实现来支持这些修改？一般来说，修改的影响越小越好、修改的代价越低越好。\n\
    \  - 系统的修改应尽量局部化。\n  - 系统的修改应尽量简单。\n  - 系统的修改对现有功能的影响应尽量小。\n\n## 可修改性的一般场景生成\n\
    \n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 潜在用户、开发人员、管理员、进程 |\n| 刺激 | 在修改过程中触发的修改请求、错误信息、异常\
    \ |\n| 制品 | 正在开发的产品、软件、其修改后与旧版本定义的功能或性能 |\n| 环境 | 运行时、维护期、测试期、设计时 |\n| 响应 | 系统能够在不影响其正常运行的前提下进行修改\
    \ |\n| 响应度量 | 修改所涉及元素的数量、修改成本、工作量、资源消耗，以及该修改对其他可能被修改系统造成的影响程度 |\n\n## 3、性能\n\n\
    - 性能与时间有关。\n\n## 性能的一般场景生成\n\n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 大量独立请求的发起者、可执行任务的内部\
    \ |\n| 刺激 | 连续的请求、事件触发的请求 |\n| 制品 | 系统 |\n| 环境 | 正常模式、超载模式 |\n| 响应 | 产生性能响应、调整服务周期\
    \ |\n| 响应度量 | 等待时间、响应时间、吞吐量、抖动、失败率、截止时间丢失率 |\n\n## 4、安全性（Security）\n\n- 安全性衡量系统在向合法用户正常提供服务的同时，阻止未授权访问、抵御拒绝服务攻击或其它攻击的能力。\n\
    - 可以将安全性制品视为提供“可信性、机密性、完整性、保护、可验证性”的能力。\n- 认证：验证交易（请求或信息）确实来自声称的发送方，不能被任何设备或成员冒充，例如通过\
    \ Internet 发送的请求或木马程序。\n- 机密性：控制未授权访问者获取敏感数据的风险。\n- 完整性：保证交易数据的完整性，防止被未经授权地篡改。\n\
    - 保护：保护交易以及参与交易的各方身份。\n- 可用性：系统可供合法用户使用的属性。\n- 审计：系统对异常行为进行记录的属性。\n\n## 安全性的一般场景生成\n\
    \n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 企图攻击、窃取或破坏系统的个人或系统，可能来自系统外部或内部 |\n| 刺激 |\
    \ 企图攻击、窃取或破坏系统 |\n| 制品 | 系统、系统中的数据 |\n| 环境 | 系统正常运行、系统维护、系统遭受攻击时 |\n| 响应 | 系统能够检测到攻击并阻止攻击\
    \ |\n| 响应度量 | 系统响应时间、系统可用性、安全防护有效性 |\n\n## 5、可测试性（Testability）\n\n- 软件的可测试性：指通过测试揭示软件缺陷的容易程度。\n\
    - 通常，测试占开发成本的 40%。\n- 一般来说，系统可能处于错误状态，需要通过测试来发现。\n- 可测试性意味着能够“控制”系统的内部状态和输入，并能够“观察”其输出。\n\
    \n## 可测试性的一般场景\n\n刺激源：测试人员、开发人员等\n刺激：执行命令、请求\n制品：被测系统\n环境：相应的测试环境\n响应：能够控制被测系统的内部状态和输入；输出到被测系统，且输出是可测量的\n\
    响应度量：在规定时间内完成系统输出的测量\n\n## 可测试性的一般场景生成\n\n| 场景 | 可能的值 |\n| --- | --- |\n| 源 |\
    \ 通常是开发人员，也可能是用户 |\n| 刺激 | 执行测试命令、输入测试数据、提交操作请求 |\n| 制品 | 设计、代码、被测软件系统 |\n| 环境\
    \ | 实验室、开发环境、测试环境、部署环境、用户使用环境 |\n| 响应 | 观察系统状态、输出、测量结果，以及其它被测系统的行为 |\n| 响应度量 |\
    \ 已执行测试动作的百分比<br>输出率<br>其它度量指标的覆盖率<br>测量率及其比较<br>测量指标的变化量 |\n\n## 6、易用性（Usability）\n\
    \n- 易用性关注：对用户而言完成某项预期任务的容易程度，以及系统所支持的用户种类。\n- 划分：\n  - 可学习性：使系统容易被学习和使用。\n  -\
    \ 有效性：系统如何高效地执行用户期望的操作。\n  - 可记忆性：系统如何帮助用户记住操作方法。\n  - 错误处理与用户反应：如何将用户在使用错误后的反应保持在可接受范围内。\n\
    \  - 反馈：系统如何向用户提供恰当的反馈。\n- 有些细节不属于软件体系结构层面，例如用户在工作场所如何获取信息，这包括操作界面和系统所处的环境，以及系统是否需要提供以用户为中心的核心能力。\n\
    \n## 易用性的一般场景\n\n刺激源：用户\n刺激：执行命令、请求和控制操作\n制品：系统\n环境：实际使用环境中\n响应：系统在给定条件下作出响应\n\
    响应度量：在 18 秒内完成\n\n## 易用性的一般场景生成\n\n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 通常是最终用户\
    \ |\n| 刺激 | 想要学习某项功能、使用某项功能、使系统更易用、从系统故障中恢复 |\n| 制品 | 系统 |\n| 环境 | 在特定的使用时间 |\n\
    | 响应 | • 系统应在特定时间内支持用户学习使用。<br>• 系统应在特定时间内支持用户高效使用。<br>• 系统应在特定时间内支持用户记忆操作。<br>•\
    \ 系统应在特定时间内支持用户处理错误。<br>• 系统应在特定时间内向用户提供反馈。<br>• 系统应在特定时间内保证用户满意度。<br>• 系统应在特定时间内支持可访问性。\
    \ |\n| 响应度量 | • 用户完成任务所需的时间<br>• 错误率、成功率<br>• 用户满意度<br>• 可访问性指标 |\n\n## 使用一般场景进行沟通\n\
    \n- 一般场景的用途之一是与相关人员进行沟通。\n- 质量属性场景有助于理解和发现问题。\n\n| 质量属性 | 刺激 |\n| --- | --- |\n\
    | 可用性 | 不断出现问题、故障发生 |\n| 可修改性 | 需求的改变、需求的增加、系统运行、维护和扩展 |\n| 可靠性 | 故障率、故障恢复时间 |\n\
    | 安全性 | 系统被攻击、系统数据被篡改、系统资源被访问、系统服务被破坏 |\n| 可测试性 | 系统开发和测试 |\n| 易用性 | 难以学习新特性、高效使用系统、提供准确信息、降低错误率\
    \ |\n\n"
