    \n## 软件体系结构技术\n\n- 主要讨论：设计师使用构造模式、体系结构模式、体系结构风格和设计时的“战术”。\n- 概念：\n  - 战术：是影响质量属性应对控制的设计决策；\n\
    \  - 一个或多个集合，称为“体系结构策略”。\n- 战术与体系结构模式：\n  - 设计师通常会选择一个精心设计的模式或模式集合，来实现一个体系结构；\n\
    \  - 因此，一个模式实现了多个战术，不管是否是所声明的。\n- 战术与体系结构风格：\n  - 战术是设计的基本“构建块”。\n\n## （一）可用性技术\n\
    \n- **[可用性]**：系统正常运行的时间比例。\n\n\\[\na=\\frac{mean\\ time\\ to\\ failure}{mean\\\
    \ time\\ to\\ failure+mean\\ time\\ to\\ repair}\n\\]\n\n- 系统不再提供与其规范一致的服务时，故障就发生了；系统的用户可以观察到故障。\n\
    - 错误（或错误的组合）可能会导致故障的发生。\n- 恢复或修复是可用性的最后方面。\n\n- **可用性技术的目标：**\n  - 阻止错误演变成为故障，至少把错误限制在一定范围内，从而使修复成为可能。\n\
    - **维护可用性的方法：**\n  - 一种类型的冗余，用来检测故障的某种类型的健康监视，以及在监控检测到故障时进行恢复。\n- 分别讨论错误检测、错误恢复、错误预防。\n\
    \n- **错误检测：识别错误**\n  - 命令/响应（ping/echo）\n  - 心跳（dead man 计时器）\n  - 异常\n    - 当识别到前面（可用性场景）所讨论的错误类中的某一个时，就出现了异常。\n\
    \    - 异常处理程序通常将错误在语义上转换为可以被处理的形式。\n\n- **错误恢复：包括准备恢复和修复系统两个部分**\n  - 表决\n  -\
    \ 主动冗余（热启动）\n    - 所有的冗余组件都以并行的方式对事件做出响应，因此，它们处于相同的状态。\n    - 仅使用一个组件的响应（通常是被叫作响应的第一个组件），丢弃其余组件的响应。\n\
    \    - 错误发生时，使用最诚实的响应可将执行时间开销降到最低，因为恢复时间就是初始时间。\n    - 运行时切换后备配置（数据启停管理系统）。\n\
    \  - 被动冗余（温启动/双冗余/三冗余）\n    - 一个组件（主要的）对事件做出响应，并通知其它组件（备用的）进行状态更新。\n    - 当错误发生时，在继续提供服务前，系统必须确保备用状态是最新的。\n\
    \  - 备件\n    - 每个备用组件配置用于更换各种不同的故障组件。\n    - 出现故障时，必须将其重新启动为适当的软件配置，并对其状态进行初始化。\n\
    \    - 备用组件的启动时间通常是几分钟。\n\n有一些硬件组件支持在修复后重新引入；当冗余组件失效时，可以在纠正组件后将其再次引入。相关技术有：\n\n\
    - **Shadow 操作：** 以前出现故障的组件可以在短时间内以“shadow 模式”运行，这确保在恢复组件之前，核验该组件的行为。\n- **状态再同步：**\
    \ 主动或被动冗余技术要求所恢复的组件在重新提供服务之前重新同步状态。重新同步方法有所不同，取决于冗余组件、更新的规模以及需要维护的状态信息数量。\n- **检查点/回滚：**\
    \ 检查点就是记录临时的一致状态，可以定期进行，或者在具体事件发生时进行。出现故障时，当检测到状态不一致时，通过使用上一个一致状态检查点和事务日志来恢复系统。\n"
