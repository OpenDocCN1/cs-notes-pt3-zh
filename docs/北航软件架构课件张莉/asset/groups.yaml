    # Consequences


    +   1. It lets you vary a product''s internal representation.

    +   2. It isolates code for construction and representation.

    +   3. It gives you finer control over the construction process.


    # Factory Method


    +   - Factory Method

    +     - Define an interface for creating an object, but let subclasses decide
    which class to instantiate. Factory Method lets a class defer instantiation to
    subclasses.

    +   - Applicability

    +     - a class can''t anticipate the class of objects it must create.

    +     - a class wants its subclasses to specify the objects it creates.

    +     - classes delegate responsibility to one of several helper subclasses, and
    you want to localize the knowledge of which helper subclass is the delegate.


    # Factory Method


