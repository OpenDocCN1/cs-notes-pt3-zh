    \ artifact means we've completed the design task.\n- Documentation enables the\
    \ set of design decisions that must be made along the way to establishing/maintaining\
    \ the architecture.\n- Documentation also clarifies the line between architectural\
    \ and non-architectural design decisions.\n  - Non-architectural design is the\
    \ term preferred over detailed design. Architectural decisions can be quite detailed.\n\
    \  - Architectural decisions are those that affect the system's ability to deliver\
    \ on its behavioral and quality goals.\n\n## So, How do You document a software\
    \ Architecture?\n\nIn practice, the answer seems to be\n\n- \"use UML\"\n- \"\
    use JavaDoc\"\n- \"What else do I need besides my Rose class diagrams?\"\n- \"\
    Draw boxes and lines\"\n- \"Not very well\"\n- \"We usually don't\"\n- \"How do\
    \ you document a what?\"\n\n## Goals\n\nThe goals for this course are to\n\n-\
    \ Help you decide what information about an architecture should be captured.\n\
    - Provide guidelines and notations for capturing the necessary information, and\
    \ examples for it.\n- Answer this question: \"How do you record architectures\
    \ so that others can successfully use, maintain, and evolve them? How do you build\
    \ a system from it?\"\n\nNote that by \"document\" we do not necessarily mean\
    \ information printed on paper.\n"
  mdcn: "\n\n## 结果\n\n1. 它允许你改变产品的内部表示。\n2. 它将构造和表示的代码隔离开。\n3. 它让你对构造过程拥有更精细的控制。\n\
    \n## 工厂方法\n\n- 工厂方法\n  - 定义一个用于创建对象的接口，但让子类决定实例化哪个类。工厂方法使一个类的实例化延迟到子类。\n- 适用性\n\
    \  - 一个类无法预知它必须创建的对象类。\n  - 一个类希望其子类指定它要创建的对象。\n  - 类将责任委托给几个辅助子类之一，并且你希望将哪个辅助子类是委托者的知识局部化。\n\
    \n## 工厂方法\n\n![](img/da691714eec1b93795825838a75ee408_28_0.png)\n\n## 工厂方法\n\n\
