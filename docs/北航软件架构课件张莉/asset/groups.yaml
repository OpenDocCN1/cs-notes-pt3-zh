    # B/S体系结构存在的问题


    +   - 不采用C/S结构，而采用纯粹的B/S结构，会不会解决这个问题？

    +     - ...用户界面仍然需要显式的调用功能层的业务逻辑...

    +     - ...仍然难以避免“用户界面的修改”→业务逻辑的修改”的问题


    # 问题


    +   - ——用户界面需要频繁的修改，它是“不稳定”的。

    +   - ——业务逻辑/数据 与 用户界面 之间应尽量少的避免直接通信。

    +   - 问题：如何让 Web 应用程序的用户界面与业务逻辑功能实现模块化，以使使程序开发人员可以轻松地单独修改各个部分而不影响其他部分？'
  - '[PAGE 118]


    # 影响因素


    +   - 在基于 Web 的应用程序中，用户界面逻辑的更改往往比业务逻辑频繁。

    +     - 例如，可能添加新的用户界面页面，或者可能完全打乱现有的页面布局。


    +   - 如果将UI代码和业务逻辑组合在一起并放在UI中，则每次更改用户界面时，都有可能引起对业务逻辑的修改。

    +     - 这很可能引起错误，并需要在对用户界面进行每个极小更改之后都要重新测试所有业务逻辑。


    +   - 在某些情况下，应用程序以不同的方式显示同一数据。

    +     - 如果用户在一个视图图中更改了数据，则系统必须自动更新该数据的其他所有视图。


    ![](img/da691714eec1b93795825838a75ee408_118_0.png)


    +   - 与业务逻辑相比，用户界面代码对设备的依赖性往往更大。

    +     - 如果要将应用程序从基于浏览器的应用程序迁移到智能手机上，则必须替换很多用户界面代码，而业务逻辑可能不受影响。

    +     - 这两部分的完全分离可以使迁移更快完成，并最大限度地降低将错误引入业务逻辑的风险。


    +   - 设计美观而有效的用户界面(如HTML、JSP等)通常要求采用一套与开发复杂业务逻辑不同的编程技能。

    +     - 很少有人同时具有这两种技能。

    +     - 将这两部分开发工作隔离开来是比较理想的。


    +   - 通常，为用户界面创建自动测试比为业务逻辑更难、更耗时。

    +     - 因此，减少直接绑定到用户界面中的代码量可提高应用程序的可测试性。'
  md: "\n## 示例1: 基于数据库的系统结构\n\n![](img/da691714eec1b93795825838a75ee408_109_0.png)\n\
    \n## 例2: 剪贴板 (Clipboard)\n\n剪贴板是一个用来进行短时间的数据存储并在组件/应用之间进行数据传递和交换的软件机制。\n\n- 用来存储和传递信息和交换信息的公共区域（形成共享数据仓库）；\n\
    - 不同的应用程序通过该区域交换格式化的信息；\n- 访问剪贴板的方式：copy & paste。\n\n![](img/da691714eec1b93795825838a75ee408_109_1.png)\n\
    \n## 例3 注册表\n\n![](img/da691714eec1b93795825838a75ee408_110_0.png)\n\n### 注册表的结构\n\
    \n- 最初，硬件/软件系统的配置信息均被集中存储在一个配置文件中；\n- 这些文件散落在系统的各个角落，很难对其进行维护；\n- 为此，引入注册表的思想，将所有\
    \ INI 文件集中起来，形成共享仓库，为系统运行起到了集中的资源配置管理和控制调度的作用。\n- 注册表中存在着系统的所有硬件和软件配置信息，如启动信息、用户、BIOS、各类硬件、网络、INI\
    \ 文件、驱动程序、应用程序等；\n- 注册表信息影响着操作系统/应用软件的行为，应用软件安装/运行/卸载时对其进行添加/修改/删除信息，以达到改变系统功能和控制软件运行的目的。\n\
    \n![](img/da691714eec1b93795825838a75ee408_110_1.png)\n\n## 仓库系统\n\n![](img/da691714eec1b93795825838a75ee408_111_0.png)\n\
    \n- 分类（对数据和状态的控制方法）\n- Passive Repository，如传统的数据体系结构：由输入事务选择进行何种处理，并将执行结果作为当前状态存储到中央数据结构中。此时，仓库是传统的数据体系结构。\n\
    - Active Repository，如 blackboard—黑板体系结构：由中央数据结构的当前状态决定进行何种处理。\n- 黑板体系结构是仓库体系结构的特殊化。\n\
    - 传统上用于在信号处理方面进行复杂解释的应用程序，以及松散耦合的构件访问共享数据的应用程序；\n- 适用于：需要解决冲突并处理可能存在的不确定性。\n\n\
    ## 仓库系统\n\n### 黑板系统的组成\n\n- 知识源：指特定应用程序知识的独立片段。知识源之间的交互只在黑板内部发生。知识源代理独立进行自己的处理，可能向黑板加知识，供其它知识源开展工作。\n\
    - 黑板数据结构：是反映应用程序求解状态的数据。知识源不断地对黑板数据进行修改，直到得出问题的解。———是知识源间的通讯机制。\n- 控制器：控制（即对知识源的调用）是由黑板的状况决定的。一旦黑板数据的改变使得某个知识源成为可用，该知识源就被激活。\n\
    \n![](img/da691714eec1b93795825838a75ee408_111_1.png)\n\n## A small catalog of\
    \ architecture styles\n\n| 体系结构风格 | 进一步细分 | 更进一步的细分 |\n| --- | --- | --- |\n|\
    \ 数据流系统 (Data flow) | 顺序批处理 (Batch Sequential) |  |\n|  | 管道和过滤器 (Pipes and Filters)\
    \ |  |\n| 调用-返回系统 (call and return) | 主程序和子程序 (Main program and subroutine) |\
    \  |\n|  | OO 系统 |  |\n|  | 分层结构 (Layered) |  |\n| 独立组件 (Independent components)\
    \ | 通信进程 (Communicating Process) |  |\n|  | 事件系统 | Implicit Invocation |\n|  |\
    \  | Explicit Invocation |\n| 虚拟机 (Virtual machine) | 解释器 (Interpreter) |  |\n\
    |  | 基于规则的系统 (Rule-Based System) |  |\n| 数据为中心系统 (Data-centered) | 数据仓库 (Repository)\
    \ |  |\n|  | 超文本系统 ( Hypertext) |  |\n|  | 黑板 ( Blackboard) |  |\n\n## 虚拟机结构/解释器风格\n\
    \n### 基本结构\n\n![](img/da691714eec1b93795825838a75ee408_113_0.png)\n\nInterpreters/Virtual\
    \ Machine\n\n- 作用：常被用于建立一种虚拟机以弥合程序的语义和作为计算引擎的硬件之间的间隙。\n- 构件：四个构件——作为执行引擎的状态机和三个存储器\n\
    - 连接件：过程调用和直接存储访问。\n\n- 优点：\n  - 有助于应用程序的可移植性和程序设计语言的跨平台能力\n  - 可以对未实现的硬件进行仿真（因为实际测试可能是复杂、昂贵或危险的）\n\
    - 缺点\n  - 额外的间接层次带来了系统性能的下降。\n- 实例\n  - 适用于应用程序不能直接运行在最合适的机器上，或不能直接以最适合的语言执行。\n\
    \  - 典型的例子是专家系统、基于规则的系统\n  - 程序设计语言的解释器，如Java、Smalltalk等\n  - 脚本语言，如Awk、Perl等\n\
    \n## Process Control（Loop）\n\n### （1）背景\n\n当软件被用来操作一个物理系统时，软件与硬件之间可以粗略地表示为一个反馈循环，这个反馈循环通过接受一定的输入、确定一系列的输出，最终使环境达到一个新的状态。\n\
    \n适合于嵌入式系统，涉及连续的动作与状态。\n\n### （2）控制系统的定义\n\n![](img/da691714eec1b93795825838a75ee408_115_0.png)\n\
    \n### （3）控制系统模型的构成\n\n- 计算型模型\n  - 过程定义：包括操作某些过程变量的机制\n  - 控制算法：用来决定如何操纵过程变量\n\
    - 数据元素\n  - 过程变量：指定的输入、操纵变量等\n  - 设置点：受控变量的参考值\n  - 传感器：用于获得控制所需的过程变量值\n- 控制环模型\n\
    \  - 建立控制算法之间的关系，它收集关于过程实际的和欲达到的状态，并调节过程变量，以使实际状态向目标状态发展\n\n## “模型-视图-控制器”(MVC)\n\
    \n### C/S体系结构存在的问题\n\n![](img/da691714eec1b93795825838a75ee408_116_0.png)\n\n\
    - 许多应用系统的用途都是从数据库存储检索数据并将其显示给用户。\n- 在用户更改数据之后，系统再将更新内容存储到数据存储中。\n- 因为关键的信息流发生在数据存储和用户界面之间，所以一般倾向于将这两部分捆绑在一起，以减少编码量并提高应用程序性能。\n\
    \n- 但是，这种看起来自然而然的方法有一些问题。\n  - 用户界面的更改往往比数据存储的更改频繁。\n  - 除了数据存取功能之外，应用程序的业务逻辑中往往还会包含很多的其他业务逻辑。\n\
    \n...考虑(CCP) The Common Closure Principle 共同封闭原则\n\n...考虑(SIP) The Single Responsibility\
    \ Principle 单一责任原则\n\n![](img/da691714eec1b93795825838a75ee408_117_0.png)\n\n\
    ### B/S体系结构存在的问题\n\n- 不采用C/S结构，而采用纯粹的B/S结构，会不会解决这个问题？\n  - ...用户界面仍然需要显式的调用功能层的业务逻辑...\n\
    \  - ...仍然难以避免“用户界面的修改”→“业务逻辑的修改”的问题\n\n### 问题\n\n- ——用户界面需要频繁的修改，它是“不稳定”的。\n\
    - ——业务逻辑/数据 与 用户界面 之间应尽量避免直接通信。\n- 问题：如何让 Web 应用程序的用户界面与业务逻辑功能实现模块化，以使程序开发人员可以轻松地单独修改各个部分而不影响其他部分？\n\
    \n### 影响因素\n\n- 在基于 Web 的应用程序中，用户界面逻辑的更改往往比业务逻辑频繁。\n  - 例如，可能添加新的用户界面页面，或者可能完全打乱现有的页面布局。\n\
    \n- 如果将UI代码和业务逻辑组合在一起并放在UI中，则每次更改用户界面时，都有可能引起对业务逻辑的修改。\n  - 这很可能引起错误，并需要在对用户界面进行每个极小更改之后都要重新测试所有业务逻辑。\n\
    \n- 在某些情况下，应用程序以不同的方式显示同一数据。\n  - 如果用户在一个视图中更改了数据，则系统必须自动更新该数据的其他所有视图。\n\n![](img/da691714eec1b93795825838a75ee408_118_0.png)\n\
    \n- 与业务逻辑相比，用户界面代码对设备的依赖性往往更大。\n  - 如果要将应用程序从基于浏览器的应用程序迁移到智能手机上，则必须替换很多用户界面代码，而业务逻辑可能不受影响。\n\
    \  - 这两部分的完全分离可以使迁移更快完成，并最大限度地降低将错误引入业务逻辑的风险。\n\n- 设计美观而有效的用户界面(如HTML、JSP等)通常要求采用一套与开发复杂业务逻辑不同的编程技能。\n\
    \  - 很少有人同时具有这两种技能。\n  - 将这两部分开发工作隔离开来是比较理想的。\n\n- 通常，为用户界面创建自动测试比为业务逻辑更难、更耗时。\n\
    \  - 因此，减少直接绑定到用户界面中的代码量可提高应用程序的可测试性。\n"
