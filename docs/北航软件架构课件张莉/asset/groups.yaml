    \n## 结构模式\n\n结构性模式关注于如何将类和对象组合成更大的结构。结构类模式使用继承来组合接口或实现。\n\n- 适配器\n- 桥接\n- 组合\n\
    - 装饰\n- 外观\n- 享元\n- 代理\n\n## 适配器\n\n### 目的\n\n将类接口转化成用户所希望的接口。适配器使原本由于不兼容接口而无法使用的类一同工作。\n\
    \n### 问题提出\n\n## 结构模式 - 适配器\n\n![](img/da691714eec1b93795825838a75ee408_29_0.png)\n\
