  - "[PAGE 98]\n\n# 物理结构\n\n![](img/da691714eec1b93795825838a75ee408_98_0.png)\n\n\
    # 优点\n\n+   ➢ 允许合理地划分三层结构的功能，使之在逻辑上保持相对独立性，从而提高系统和软件的可维护性和可扩展性。\n+   \n+   ➢ 允许更灵活有效地选用相应的平台和硬件系统，使之在处理负荷能力上与处理特性上分别适应于结构清晰的三层；并且这些平台和各个组成部分可以具有良好的可升级性和开放性。\n\
    +   \n+   ➢ 应用的各层可以并行开发，可以选择各自最适合的开发语言。\n+   \n+   ➢ 利用功能层有效地隔离开表示层与数据层，未授权的用户难以绕过功能层而利用数据库工具或黑客手段去非法地访问数据层，为严格的安全管理奠定了坚实的基础。"
  - "[PAGE 99]\n\n# 要注意的问题\n\n+   ➢ 三层C/S结构各层间的通信效率若不高，即使分配给各层的硬件能力很强，其作为整体来说也达不到所要求的性能。\n\
    +   \n+   ➢ 设计时必须慎重考虑三层间的通信方法、通信频度及数据量。这和提高各层的独立性一样是三层C/S结构的关键问题。\n\n# 浏览器/服务器风格（B/S结构）\n\
    \n+   • 浏览器/服务器(B/S)是三层C/S风格的一种实现方式。\n+     - 表现层：浏览器\n+     - 逻辑层：\n+       -\
    \ Web服务器\n+       - 应用服务器\n+     - 数据层：数据库服务器\n\n![](img/da691714eec1b93795825838a75ee408_99_0.png)"
  - '[PAGE 100]


    # B/S体系结构


    ![](img/da691714eec1b93795825838a75ee408_100_0.png)


    # 优点


    +   - 基于B/S体系结构的软件，系统安装、修改和维护全在服务器端解决。系统维护成本低。

    +     - 客户端无须任何维护，用户在使用系统时，仅仅需要一个浏览器就可运行全部的模块，真正达到了“零客户端”的功能，很容易在运行时自动升级。

    +     - 良好的灵活性和可扩展性：对于环境和应用条件经常变动的情况，只要对业务逻辑层实施相应的改变，就能够达到目的。

    +   - B/S成为真正意义上的“瘦客户端”，从而具备了很高的稳定性、延展性和执行效率。

    +   - B/S将服务集中在一起管理，统一服务于客户端，从而具备了良好的容错能力和负载平衡能力。

    +   - B/S体系结构还提供了异种机、异种网、异种应用服务的联机、联网、统一服务的最现实的开放性基础。'
  md: "\n## A small catalog of architecture styles\n\n| 体系结构风格 | 进一步细分 |\n| --- |\
    \ --- |\n| 数据流系统 (Data flow) | 顺序批处理 (Batch Sequential) |\n|  | 管道和过滤器 (Pipes\
    \ and Filters) |\n| 调用-返回系统 (call and return) | 主程序和子程序 (Main program and subroutine)\
    \ |\n|  | OO系统 |\n|  | 分层结构 (Layered) |\n| 独立组件 (Independent components) | 通信进程\
    \ (Communicating Process) |\n|  | 事件系统：隐式调用 (Implicit Invocation)、显式调用 (Explicit\
    \ Invocation) |\n| 虚拟机 (Virtual machine) | 解释器 (Interpreter) |\n|  | 基于规则的系统 (Rule-Based\
    \ System) |\n| 数据为中心系统 (Data-centered) | 数据仓库 (Repository) |\n|  | 超文本系统 (Hypertext)\
    \ |\n|  | 黑板 (Blackboard) |\n\n## 分层系统风格（Layered）\n\n- 层次化已经成为一种复杂系统设计的普遍性原则；\n\
    - 两个方面的原因：\n  - 事物发生就是从简单的、基础的层次开始发生的；\n  - 众多复杂软件设计的实践，大到操作系统，中到网络系统，小到一般应用，几乎都是以层次化结构建立起来的。\n\
    \n![](img/da691714eec1b93795825838a75ee408_89_0.png)\n\n操作系统层次结构\n\n### 分层系统（续）\n\
    \n- 优点：\n  - 设计体现抽象层次，支持分解复杂问题，支持增量式设计；\n  - 由于对邻接关系进行了限制，所以系统易于改进和扩展；\n  - 每一层的软件都支持重用，并可为每一层提供多种可替换的实现。\n\
    - 缺点：\n  - 分层可能带来效率方面的问题；\n  - 接口定义标准的问题\n  - 如何界定层次间的划分是较复杂的问题\n- 典型实例：\n  -\
    \ 通讯协议，如：OSI的七层参考模型\n  - 操作系统，如：Unix系统。\n  - 数据库系统等\n\n### 严格分层和松散分层\n\n严格分层系统要求严格遵循分层原则，限制一层中的构件只能与对等实体以及与它紧邻的下面一层进行交互\n\
    \n- 优点：修改时的简单性\n- 缺点：故障率低下\n\n松散的分层应用程序放宽了此限制，它允许构件与位于它下面的任意层中的组件进行交互\n\n- 优点：效率高\n\
    - 缺点：修改时困难\n\n![](img/da691714eec1b93795825838a75ee408_91_0.png)\n\n## 客户服务器风格（Client-Server）\n\
    \n![](img/da691714eec1b93795825838a75ee408_92_0.png)\n\n- 适于应用系统的数据和处理分布在一定范围内的多个构件上，构件之间通过网络连接。\n\
    - 服务器构件：向多个用户提供服务，永远处于活跃状态，监听用户请求；\n- 客户构件：向服务器构件请求服务；\n- 连接件：某种进程间通讯机制，通常是基于RPC的交互协议。\n\
    \n### 客户服务器风格（续）\n\n- 优点\n  - 有利于分布式的数据组织\n  - 构件间是位置透明的，构件间无需知道位置信息\n  - 便于异质平台间的融合与匹配，构件可以运行不同的操作系统\n\
    \  - 具有良好的可扩展性，易于对服务器进行修改、扩展和增加服务器。\n- 缺点\n  - 客户必须知道服务器的访问标识，否则很难知道有哪些服务可用。\n\
    - 例子\n  - 远程文件系统、数据库服务器\n\n### 客户服务器风格（续）\n\n客户机/服务器：一个应用系统被分为两个逻辑上分离的部分，每一部分充当不同的角色、完成不同的功能，多台计算机共同完成统一的任务。\n\
    \n- 客户机（前端，front-end）：业务逻辑、与服务器通讯的接口；\n- 服务器（后端，back-end）：与客户机通讯的接口、业务逻辑、数据管理。\n\
    \n一般的，\n\n- 客户机为完成特定的工作向服务器发出请求；\n- 服务器处理客户机的请求并返回结果。\n\n![](img/da691714eec1b93795825838a75ee408_93_0.png)\n\
    \n### 客户服务器的层次\n\n“客户机-服务器”结构的发展历程：\n\n- 两层C/S\n- 三层C/S\n- 多层C/S\n\n![](img/da691714eec1b93795825838a75ee408_93_1.png)\n\
    \n### 两层C/S结构\n\n![](img/da691714eec1b93795825838a75ee408_94_0.png)\n\n### ◇ 任务分配\n\
    \n- 服务器\n  1. 数据库安全性的要求；\n  2. 数据库访问并发性的控制；\n  3. 数据库前端的客户应用程序的全局数据完整性规则；\n  4.\
    \ 数据库的备份与恢复。\n- 客户应用程序\n  1. 提供用户与数据库交互的界面；\n  2. 向数据库服务器提交用户请求并接收来自数据库服务器的信息；\n\
    \  3. 利用客户应用程序对存在于客户端的数据执行应用逻辑要求。\n\n### ◇ 处理流程\n\n![](img/da691714eec1b93795825838a75ee408_95_0.png)\n\
    \n### ◇ 优点\n\n- 具有强大的数据操作和事务处理能力，模型思想简单，易于人们理解和接受。\n- 系统的客户应用程序和服务器构件分别运行在不同的计算机上，系统中每台服务器都可以适合各种构件的要求，这对于硬件和软件的变化显示出极大的适应性和灵活性，而且易于对系统进行扩充和缩小。\n\
    - 系统中的功能构件充分隔离，客户应用程序的开发集中于数据的显示和分析，而数据库服务器的开发则集中于数据的管理，不必在每一个新的应用程序中都要对一个DBMS进行编码。将大的应用处理任务分布到许多通过网络连接的低成本计算机上，以节约大量费用。\n\
    \n### 缺点\n\n- 开发成本较高\n- 客户端程序设计复杂\n- 信息内容和形式单一\n- 用户界面风格不一，使用繁杂，不利于推广使用\n- 软件移植困难\n\
    - 软件维护和升级困难\n- 新技术不能轻易应用\n\n### 胖客户端和瘦客户端\n\n- 业务逻辑的划分比重：在客户端多一些还是在服务器端多一些?\n\
    \  - 胖客户端：客户端执行大部分的数据处理操作\n  - 瘦客户端：客户端具有很少或没有业务逻辑\n\n![](img/da691714eec1b93795825838a75ee408_96_0.png)\n\
    \n### 物理结构\n\n![](img/da691714eec1b93795825838a75ee408_98_0.png)\n\n### 优点\n\n\
    - 允许合理地划分三层结构的功能，使之在逻辑上保持相对独立性，从而提高系统和软件的可维护性和可扩展性。\n- 允许更灵活有效地选用相应的平台和硬件系统，使之在处理负荷能力上与处理特性上分别适应于结构清晰的三层；并且这些平台和各个组成部分可以具有良好的可升级性和开放性。\n\
    - 应用的各层可以并行开发，可以选择各自最适合的开发语言。\n- 利用功能层有效地隔离开表示层与数据层，未授权的用户难以绕过功能层而利用数据库工具或黑客手段去非法地访问数据层，为严格的安全管理奠定了坚实的基础。\n\
    \n### 要注意的问题\n\n- 三层C/S结构各层间的通信效率若不高，即使分配给各层的硬件能力很强，其作为整体来说也达不到所要求的性能。\n- 设计时必须慎重考虑三层间的通信方法、通信频度及数据量。这和提高各层的独立性一样是三层C/S结构的关键问题。\n\
    \n## 浏览器/服务器风格（B/S结构）\n\n- 浏览器/服务器(B/S)是三层C/S风格的一种实现方式。\n  - 表现层：浏览器\n  - 逻辑层：\n\
    \    - Web服务器\n    - 应用服务器\n  - 数据层：数据库服务器\n\n![](img/da691714eec1b93795825838a75ee408_99_0.png)\n\
    \n### B/S体系结构\n\n![](img/da691714eec1b93795825838a75ee408_100_0.png)\n\n### 优点\n\
    \n- 基于B/S体系结构的软件，系统安装、修改和维护全在服务器端解决。系统维护成本低。\n  - 客户端无须任何维护，用户在使用系统时，仅仅需要一个浏览器就可运行全部的模块，真正达到了“零客户端”的功能，很容易在运行时自动升级。\n\
    \  - 良好的灵活性和可扩展性：对于环境和应用条件经常变动的情况，只要对业务逻辑层实施相应的改变，就能够达到目的。\n- B/S成为真正意义上的“瘦客户端”，从而具备了很高的稳定性、延展性和执行效率。\n\
    - B/S将服务集中在一起管理，统一服务于客户端，从而具备了良好的容错能力和负载平衡能力。\n- B/S体系结构还提供了异种机、异种网、异种应用服务的联机、联网、统一服务的最现实的开放性基础。\n"
