    # Why that is not enough


    A system description for an underwater acoustic simulation


    ![](img/da691714eec1b93795825838a75ee408_150_0.png)


    +   - What we can tell from this diagram?

    +     - The system consists of four components

    +     - Three of the components might have more in common with each other because
    they are positioned next to each other

    +     - All of the components apparently have some sort of relationship with each
    other, since the diagram is fully connected.


    +   - Is this an architecture? If it is, what can we not tell from the diagram?


    +   - what can we not tell from the diagram?

    +     - What is the nature of the components?

    +       - What is the significance of the separation? Do the components run on
    separate processors? Do they run at separate time? Do the components consist of
    processes, programs, or both? Do the components represent ways in which the project
    labor will be divided, or do they convey a sense of runtime separation? Are they
    modules, objects, tasks, functions, processes, distributed programs, or something
    else?

    +     - What is the significance of the links?

    +       - Do the links means that the components communicate with each other,
    control each other, sent data to each other, use each other, invoke each other,
    synchronize with each other, or some combination of these or other relations?
    What are the mechanisms for the communication?

    +     - What is the significance of the layout?

    +       - Why is CP on a separate level? Dose it call the other three components,
    and are the others not allowed to call it? Or was there simply not room enough
    to put all four components on the same row in the diagram?

    +     - How does the architecture operate at runtime?

    +       - How do data and control flow through the system?'
