    \n### 行为描述\n\n对系统逻辑行为进行描述的目的，一方面是为了验证这种结构设计是否能够真正满足系统的功能需求，另一方面是为了将用例所代表的功能分解成粒度更小、更易于理解的形式，并分别分配到各个逻辑组成元素上。\n\
    \n逻辑行为可以采用交互图（顺序图和协作图）、状态图等形式来描述。\n\n具体做法是：\n\n1. 首先，在“XX子系统逻辑视图”包中创建一个包，命名为“用例实现”。\n\
