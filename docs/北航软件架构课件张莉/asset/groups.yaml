    # Design pattern 在三类软件开发中所起的作用：


    +   - Application programs

    +   - Toolkits

    +   - frameworks


    # 第二部分


    # 类用 Design Pattern 分类


    +   - Creational Patterns

    +   - Structural Patterns

    +   - Behavior Patterns


    +   - Abstract Factory

    +   - Builder

    +   - Factory Method

    +   - Prototype

    +   - Singleton


    +   - Chain of Responsibility

    +   - Command

    +   - Interpreter

    +   - Iterator

    +   - Mediator

    +   - Memento

    +   - Observer

    +   - State

    +   - Strategy

    +   - Template

    +   - Visitor


    +   - Adapter

    +   - Bridge

    +   - Composite

    +   - Decorator

    +   - Facade

    +   - Flyweight

    +   - Proxy


    # Creational Patterns


    +   - Abstract Factory (87)

    +     Provide an interface for creating families of related or dependent objects
    without specifying their concrete classes.

    +   - Builder (97)

    +     Separate the construction of a complex object from its representation so
    that the same construction process can create different representations.

    +   - Factory Method (107)

    +     Define an interface for creating an object, but let subclasses decide which
    class to instantiate. Factory Method lets a class defer instantiation to subclasses.

    +   - Prototype (117)

    +     Specify the kinds of objects to create using a prototypical instance, and
    create new objects by copying this prototype.

    +   - Singleton (127)

    +     Ensure a class only has one instance, and provide a global point of access
    to it.


    # Structural Patterns


    +   - Adapter (139)

    +     Convert the interface of a class into another interface clients expect.
    Adapter lets classes work together that couldn''t otherwise because of incompatible
    interfaces.

    +   - Bridge (151)

    +     Decouple an abstraction from its implementation so that the two can vary
    independently.

    +   - Composite (165)

    +     Compose objects into tree structures to represent part-whole hierarchies.
    Composite lets clients treat individual objects and compositions of objects uniformly.

    +   - Decorator (175)

    +     Attach additional responsibilities to an object dynamically. Decorators
    provide a flexible alternative to subclassing for extending functionality.


    # Structural Patterns (续)


    +   - Facade (185)

    +     Provide a unified interface to a set of interfaces in a subsystem. Facade
    defines a higher-level interface that makes the subsystem easier to use.

    +   - Flyweight (195)

    +     Use sharing to support large numbers of fine-grained objects efficiently.

    +   - Proxy (207)

    +     Provide a surrogate or placeholder for another object to control access
    to it.


    # Behavioral Patterns


    +   - Chain of Responsibility (223)

    +     Avoid coupling the sender of a request to its receiver by giving more than
    one object a chance to handle the request. Chain the receiving objects and pass
    the request along the chain until an object handles it.

    +   - Command (233)

    +     Encapsulate a request as an object, thereby letting you parameterize clients
    with different requests, queue or log requests, and support undoable operations.

    +   - Interpreter (243)

    +     Given a language, define a representation for its grammar along with an
    interpreter that uses the representation to interpret sentences in the language.

    +   - Iterator (257)

    +     Provide a way to access the elements of an aggregate object sequentially
    without exposing its underlying representation.'
