  mdcn: "\n\n## 第二部分\n\n## 软件体系结构建模和表示\n\n张莉 教授\n北京航空航天大学\n软件工程研究所\ntily@buaa.edu.cn\n\
    \n### 内容\n\n- 软件体系结构建模和表示\n  - 概述\n  - 软件体系结构建模（UML）\n  - 软件体系结构描述语言（ADL）\n  -\
    \ 软件体系结构编档\n    - Documenting\n\n## 软件体系结构建模和表示\n\n解决软件体系结构描述问题。\n\n- 为什么？\n-\
