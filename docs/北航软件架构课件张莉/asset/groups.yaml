  md: "\n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_360_0.png)\n\n##\
    \ 行为型图介绍\n\n- 行为型的图描述了用结构型的图建模的资源是如何交互并执行其功能的。\n- 行为型的图描述的是系统的动态行为，它们使资源动起来。\n\
    - 支持行为型结构图的包\n\n## 活动图\n\n- 建造一座房子：\n  - 选择地址→委托建筑师设计→开发商开发→付款→拥有房子。\n- 实际的工程是由多种活动及它们之间的协作组成的。\n\
    - 如何最好的模拟系统动态方面的工作流或操作？—— 活动图\n\n## 活动图\n\n- 活动图一般包括：\n  - 动作\n  - 活动节点\n  - 流\n\
    \  - 对象值\n- 活动图的价值在于：\n  - 表述了实现系统行为所需要的逻辑。\n  - 可以描述设计所需的任何层次上的逻辑，从系统的工作流到单独的方法实现都可以。\n\
    \  - 非常简单，易于掌握。\n  - 用户对活动图相对而言比较熟悉。\n\n## 活动图的一般用法\n\n活动图用于对系统的动态方面建模，可涉及系统体系结构的任意视图中任何类型抽象的活动，这些抽象类型包括类、接口、构件和节点。\n\
    \n通常有两种使用活动图的方式：\n\n- 对工作流建模——此时，要关注与系统进行协作的参与者观察到的活动。【示例1】\n- 对操作建模——在这种用法中，对分支、分支和汇合状态建模特别重要。【示例2】\n\
    \n## 活动图示例\n\n![](img/da691714eec1b93795825838a75ee408_363_0.png)\n\n## RATIONAL\
    \ USER CONFERENCE 2001\n\n## 对操作建模\n\n![](img/da691714eec1b93795825838a75ee408_364_0.png)\n\
    \n## 对工作流建模（泳道）\n\n![](img/da691714eec1b93795825838a75ee408_364_1.png)\n\n## UML2.0中的图\n\
    \n![](img/da691714eec1b93795825838a75ee408_365_0.png)\n\n## 交互图\n\n- 策划一部电影，创作故事板是一项主要活动，它可以帮助小组可视化、详述、构造和文档化电影的一个模型。\n\
    - 对系统的动态方面建模的较好方法是建立脚本的故事版。\n- 可以用UML的交互图对这些故事版建模。\n- 交互图只描述消息是否发生、以什么顺序发生以及发生的约束条件，不解释对象为回答问题、了解事件以及从其他对象获取信息而进行的数据处理。这些可用活动图实现。\n\
    \n## 带激活的顺序图\n\n◆ 可以使用带执行规格的顺序图显示对象的激活和撤销。\n\n![](img/da691714eec1b93795825838a75ee408_368_0.png)\n\
    \n## 顺序图中的结构化控制\n\n- 序列性的消息能很好的说明单一的线性序列，但通常需要展示条件、循环和并发。\n- 因而，顺序图支持结构化控制。常见的控制类型有：\n\
    \  - 可选执行 (opt)\n  - 条件执行 (alt)\n  - 并行执行 (par)\n  - 循环执行 (loop)\n\n## RATIONAL\
    \ USER CONFERENCE 2001\n\n## 结构化控制示例\n\n![](img/da691714eec1b93795825838a75ee408_369_0.png)\n\
    \n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_369_1.png)\n\n## 通讯图(communication\
    \ Diagram)\n\n- 通讯图强调参加交互对象的组织，只包含上下文涉及的对象，而不考虑系统中的其它对象。\n- 与顺序图不同，通讯图不能显式的展示对象的生命线（尽管可以展示create和destroy消息）。另外，在通讯图中不能显式地展示控制焦点，尽管各消息的序号能够表示嵌套。\n\
    \n## 通讯图\n\n- 通讯图的价值在于：\n  - 反映了完成某项任务的结构需求，它明确标明了参与交互的对象，有助于确认或发现类的特征。\n  - 展现了对参与交互的对象的接口的需求。\n\
    \  - 标明了为满足某项交互必须进行的结构性变动。\n  - 明确标明了作为交互的一部分被传递的数据，这些数据属于设计中的类的一部分，跟踪数据的来源通常会发现新的交互。\n\
    - 通讯图中的消息支持迭代表达式、并行表达式和条件表达式。\n\n## RATIONAL USER CONFERENCE 2001\n\n## UML2.0中的图\n\
    \n![](img/da691714eec1b93795825838a75ee408_373_0.png)\n\n## 时间图(timing Diagram)\n\
    \n时间图是带有特殊目的的交互图，它关注的焦点是对象生命周期中事件的时间顺序。它是状态机图和交互图的混合，并增加了定时约束和持续时间约束。\n\n时间图使用两种形式：\n\
    \n- 状态时间线\n- 概要时间线\n\n## 时间图示例\n\n右侧显示了一个门控系统的时间图\n\n![](img/da691714eec1b93795825838a75ee408_374_0.png)\n\
    \n## 交互图的比较\n\n- 顺序图是基于时间的视图，它描述对象为完成某个行为目标而进行的交互。交互可以在任意抽象层次上描述，既可以是子系统的操作或行为，也可以是实例之间的交互。\n\
    - 通信图是对对象之间交互的结构图，源于UML1.4的协作图。\n- 交互概览图是较高层次的视图，它将一组交互组织成一个逻辑序列，包括在交互之间导航的流控逻辑。\n\
    - 时间图是一种可选的图，它被用来规定交互中消息发送和接收的时间约束。\n\n## RATIONAL USER CONFERENCE 2001\n\n##\
    \ UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_375_0.png)\n\n## 用例图(Usecase\
    \ Diagram)\n\n- 假设别人给你一个盒子，上面有许多按钮和一个液晶显示器。\n  - 你得不到一点关于如何使用它的暗示，只能随机的按动按钮，并观察发生什么。\n\
    \n用例图用于对系统、子系统或类的行为进行可视化，是用户能够理解如何使用这些元素，并使开发者能够实现这些元素。\n\n## 用例图\n\n- ◆ 用例图包含六种元素：\n\
    \  ➢ 参与者：参与系统成功操作的某个人、系统、设备甚至是企业所扮演的角色。\n  ➢ 用例：标志系统的某个关键行为。如果没有该行为，系统将不能满足参与者的需求。每个用例都表达了系统必须达到的目标或必须产生的结果。\n\
    \  ➢ 关联：标志参与者和用例之间的交互。每个关联成为在用例描述中加以解释的对话，而每个用例描述又提供了一组脚本，它们有助于开发测试用例。\n  ➢ 包含《include》关系：标志一个可重用的用例，它可以被无条件地集成到其他的用例中，什么时候或者为什么调用该用例取决于调用它的用例。\n\
    \  ➢ 扩展《extend》关系：指的是一个可重用的用例被另外一个用例有条件地扩展断开，以增加其功能。什么时候使用扩展用例取决于扩展用例。\n  ➢ 泛化：指的是参与者之间或用例之间的继承关系。\n\
    \n## 用例图\n\n- ◆ 用例图用来对主体的外部行为建模。\n  ➢ 对主体的语境建模\n  ➢ 对主体的需求建模\n- ◆ 用例图的价值在于：\n\
    \  ➢ 反映了用户对系统的期望。\n  ➢ 描述了系统的特征。\n  ➢ 描述了系统特征中的公共行为。\n  ➢ 为客户观察自己的需求提供了简单易行的方法。\n\
    \n## 用例图示例--对话境建模\n\n![](img/da691714eec1b93795825838a75ee408_377_0.png)\n\n##\
    \ 用例的活动图\n\n- 活动图可以细化用例\n- 如：订货过程的用例。\n\n当收到一个订单时，我们针对订单上的每一项，检察是否有足够的货物。如果有，则把货物分配给这份订单。假设按分配的数量发放货物后，如仓库里剩下的货物数量低于库存最低限额，则要重新订购这种货物。与此同时，我们还要检查此订单是否已付款。如果此订单已付款，且库中有足够的货物，则发送货物；如果已付款但库中缺货，则让订单等待；如果未付款，则取消订单。\n\
    \n## 订货过程\n\n![](img/da691714eec1b93795825838a75ee408_378_0.png)\n\n所谓活动图的结束点是指所有被触发的活动都执行完毕，且没有待执行的活动时，活动图也就结束了。所以可以以标结束点。\n\
    图中有一个死端点：订购货物活动。该活动执行后，不进一步执行别的活动。死端点常常用在像这样没有结束点的活动图中。\n如果该条件不满足，在这张图中没有提出任何办法，只能停在那里，即当仓库缺货时，必须等待直到新货入库后才能发送订单。\n\
    \n## 新货入库\n\n- 另一个用例。\n- 当货物入库时，我们查看未交付的订单，并判断新货物能满足哪些订单。然后给这些订单分配货物；接着交付这些订单并发送货物；发送完后把剩下的货物入库。\n\
    \n![](img/da691714eec1b93795825838a75ee408_378_1.png)\n"
