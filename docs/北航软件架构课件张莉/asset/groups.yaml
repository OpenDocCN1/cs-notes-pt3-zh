    - - 全球都是排名第二的，据了解北京首都机场一年起降次数高达597000次，而旅客吞吐量也高达9578.6万人次。来过首都机场的小伙伴应该就知道在这里基本上每时每刻都有飞机起飞或者降落。\n\
