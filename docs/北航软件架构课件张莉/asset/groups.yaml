    \ 事件信号\n- 3、本地类型字典（数据类型）\n- 4、字典（术语）\n- 5、不期望事件字典\n- 6、系统生成参数\n- 7、接口设计问题\n- 8、实现备忘\n\
    - 9、假设列表\n  - 基本假设\n  - 关于不期望事件的假设\n- 10、精度、时间和效率指南\n\n## 使用结构 - USES STRUCTURE\n\
    \n区分：\n\nUse、 interaction、 call relation.\n\n| 目标 | 如何实现 |\n|---|---|\n| 增量式逐步实现和测试系统的各个功能\
    \ | 为程序员创建“被允许使用”结构，限制每个程序员所能使用的过程 |\n| 提高可移植性 | 以层次结构描述使用结构 |\n| 生成规模合理的使用关系指南\
    \ | 在适当的情况下，将使用关系定义为模块间的关系 |\n\n## Layered Architecture of A-7E\n\n![](img/da691714eec1b93795825838a75ee408_187_0.png)\n\
    \nFIGURE The layered architecture that emerges from the A-7E uses structure.\n\
    \n## 进程结构 - PROCESS STRUCTURE\n\n| 目标 | 如何实现 |\n| --- | --- |\n| 实现从输入到输出的映射 |\
    \ 每个进程都作为一个采样、输入、计算、输出的周期来实现 |\n| 满足实时需求 | 通过进程结构确定进程，实现进程的非在线调度 |\n| 及时提供运算量大的计算结果\
    \ | 后台计算，并在需要时将最新结果返回。 |\n\n## 为什么需要形式化方法\n\n- 在计算机科学，形式化方法指的是用于软件与硬件系统的说明、开发与验证的数学化方法。\n\
    - 形式化方法的特点:\n  - 可以用于系统描述，且可以在不同层次上进行描述：精确的语义，消除语义模糊。\n  - 在体系结构行为描述的优势:\n   \
    \ - 更利于机器表达和计算\n    - 提供了形式化且准确的定义用于描述行为、行为模式、行为分析。如：进程代数提供了代数法则用于处理分析等\n    -\
    \ 对行为的分析和建模是系统验证的主要组成部分\n- 形式化方法使得系统验证变得可行\n  - 自动化理论证明：在给定系统描述的情况下，基于逻辑原语与推理规则来进行形式化证明\n\
    \  - 模式识别：系统通过对可能到达的状态进行完全搜索的方式验证特定的属性。\n- 常见的形式化方法\n  - Petri网：主要用于描述分布式系统。\n\
    \  - Z语言：用于计算系统的建模和描述\n  - B-Method(Abrial, 1996)\n  - CSP（Hoare, 2004）\n  - 。\
    \ 。 。 。 。 。\n\n- 软件体系结构描述语言ADL（Architecture Description Language）\n  - ADL是软件体系结构研究领域为进行软件体系结构描述和分析而专门定义的一种语言符号。\n\
    \  - “ADL指用来表示和分析软件体系结构的形式化符号”。一般认为，ADL的核心元素主要包括：\n    - 构件（Component）：表示系统中主要的计算元素和数据存储，如客户端、服务器、数据库等；\n\
    \    - 连接件（Connector）：定义构件之间的交互关系，如过程调用、消息传递、事件广播等；\n    - 软件体系结构配置（Architecture\
    \ Configuration）：描述构件、连接件之间的拓扑关系。构件、连接件的外部可见特性由接口定义。\n\n## 分类\n\n- 根据各个ADL的研究范围，可归纳为：\n\
    \  - 描述软件体系结构配置的ADL\n  - 描述软件体系结构实例的ADL\n  - 软件体系结构风格的ADL\n- 典型的ADL有：Aesop，C2，Darwin，Rapide，SADL，UniCon，Meta-H，和Wright等。\n\
    \n## 部分ADL\n\n| ADL | 研究单位和代表人物 | 适用范围 | 主要设计元素/特点 | 具备的主要能力 |\n|---|---|---|---|---|\n\
    | Aesop | 美国卡内基-梅隆大学软件工程研究所、David Garlan等 | 同一设计环境中多种软件体系结构风格的应用、特定风格软件体系结构设计环境、软件体系结构的快速生成\
    \ | 定义了六种通用对象类型：构件、连接件、端口、角色、表示和绑定；以子类方式通过类型进行扩展；可定义新类型；每个对象类型用一个C++类表示，软件体系结构风格信息保存在C++类代码实现中\
    \ | 外部工具集成：语法制导的类型检查；代码编译；可执行系统的生成；循环、资源冲突、调度可性性检查 |\n| C2 | 美国加利福尼亚大学圣地亚哥分校、Richard\
    \ N. Taylor等 | 主要适用于分布式构件环境中、基于消息的图形用户界面应用系统的软件体系结构描述 | 主要设计元素为构件、连接件以及它们之间的拓扑关系；构件只能通过连接件访问，具有“受限的可见性”；异步通信消息和请求是构件间唯一的通信方式\
    \ | 软件体系结构演化；软件体系结构动态配置；多形式的类视图查看；设计决策过程支持；可执行代码生成 |\n| MetaH | 美国霍尼韦尔公司 | 一种特定领域的ADL，支持对可靠性分析和安全性要求较高的多处理器实时嵌入式系统的创立、分析和谐验证，主要应用于航空电子子控制软件系统\
    \ | 基于形式化调度 and 数据流模型；提供定义的结构件和连接件类型，与硬件密切相关；构件包括处理器、端口、子系统、包、监视器和进程等；连接类型包括事件连接、端口连接、等价连接和存取连接等\
    \ | 软硬件绑定：实时调度；可靠性 and 安全性能分析；代码自动生成、编译和链接 |\n\n## 部分ADL\n\n| ADL | 研究单位和代表人物\
    \ | 适用范围 | 主要设计元素/特点 | 具备的主要能力 |\n|---|---|---|---|---|\n| Unicon | 美国卡内基-梅隆大学软件工程研究所、Mary\
    \ Shaw等 | 一种通用类型的ADL，支持多种构件和连接件类型类型的综合应用 | 主要设计元素为构件和连接件，构件和连接件类型以类的方式预定义，并定义了构件类型和连接件类型之间的匹配规则，连接件机制在被设计工具的实现中\
    \ | 类型检查；编译、验证和可执行系统的自动生成；外部工具集成；进程调度分析 |\n| Rapide | 美国斯坦福大学、David C. Luckham等\
    \ | 基于事件的、复杂、并发、分布式系统软件体系结构描述 | 主要要素由数据接口（相当于构件）和连接规则组成，接口定义描述操作、服务、行为和约束；构件的计算和交互活动通过事件集合（postsets）定义；构件的行为为集中式抽象状态和状态转移规则定义\
    \ | 软件体系结构模拟执行；模拟结果分析（约束检查、postsets覆盖率、模拟动画）；软件体系结构动态配置和代码生成 |\n| Wright | 美国卡内基-梅隆大学(CMU)软件工程研究所、Robert\
    \ J. Allen等 | 一种完全形式化的ADL，对连接件语言进行了形式化表示，支持用户将复杂的交互模式定义成新的连接件类型 | 主要设计元素包括构件、连接件和配置，构件定义包括端口和计算，连接件定义包括角色和胶水（Glue）；支持用户定义接口类型和风格；以CSP作为语言基础\
    \ | 用户自定义软件体系结构风格；风格约束检查；模型一致性、完整性检查；死锁分析 |\n"
