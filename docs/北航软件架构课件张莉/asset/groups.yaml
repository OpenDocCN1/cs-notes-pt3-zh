    \ 桥接\n\n![](img/da691714eec1b93795825838a75ee408_29_3.png)\n\n## 结构模式 - 桥接\n\n\
    ### 结构\n\n## 结构模式\n\n组合：将对象组合成树状结构。组合让客户端可以统一地处理对象。\n\n## 结构模式（二）\n\n外观：为子系统中的一组接口提供一个统一接口。外观定义了一个更高层接口，使子系统更容易使用。\n\
    \n## 行为模式\n\n- 行为模式涉及算法和对象间职责的分配。\n- 行为模式不仅描述了对象和类的模式，还描述了它们之间的通讯模式。\n- 分为两类：\n\
    \  - 使用继承机制：如 Template Method, Interpreter\n  - 使用对象组合：如 Mediator, Chain of Responsibility\
    \ 等\n\n## 行为模式——责任链\n\n通过给多个对象处理请求的机会，避免将请求的发送者耦合到其接收者。将接收对象链式连接，并沿着链传递请求，直到某个对象处理它。\n\
    \n### 问题的提出\n\n## 行为模式\n\n### 何时使用\n\n- 可能有多个对象处理一个请求，且处理者事先未知。处理者应被自动确定。\n- 你希望向几个对象之一发出请求，而不显式指定接收者。\n\
    - 能够处理请求的对象集合应该被动态指定。\n\n## 行为模式\n\n### 结构\n\n## 行为模式——命令\n\n### 命令\n\n将请求封装为一个对象，从而使你可以用不同的请求对客户端进行参数化、对请求进行排队或记录日志，并支持可撤销操作。\n\
    \n### 问题的提出\n\n## 命令 1\n\n## 命令 2\n\n![](img/da691714eec1b93795825838a75ee408_32_0.png)\n\
    \n## 命令 3\n\n### 结构\n\n![](img/da691714eec1b93795825838a75ee408_32_1.png)\n\n\
    ## 命令 4\n\n### 协作\n\n![](img/da691714eec1b93795825838a75ee408_32_2.png)\n\n##\
    \ 行为模式\n\n### 策略\n\n定义一系列算法，封装每一个算法，并使它们可以互换。策略让算法独立于使用它的客户端而变化。\n\n![](img/da691714eec1b93795825838a75ee408_32_3.png)\n\
    \n## 软件架构：原理与实践\n\n软件架构文档化\n\n孙君 教授\n北京计算机学院\n软件工程研究所\nlily@...edu.cn\n\n## 模块目标\n\
    \n本模块将使参与者熟悉\n\n- 架构视图以及它们如何用于记录软件架构\n- 各种类型的视图、它们为何有用以及何时使用它们\n- 常用于描述架构的记号法\n\
    - 软件架构文档应包含什么\n\n## 为什么要记录架构？\n\n- 架构是系统及其开发项目的蓝图。\n  - 它定义了工作分配。\n  - 它是质量属性的主要载体。\n\
    \  - 它是早期分析的最佳工件。\n  - 它是部署后维护和挖掘的关键。\n- 这份蓝图若要被使用，就必须被理解；若要被理解，就必须被沟通。\n- 文档代表了架构师，无论是今天、明天，还是20年后。\n\
    \n## 架构文档化也有助于架构过程\n\n- 文档支持以工件驱动的方法进行软件设计。\n  - 完成工件意味着我们完成了设计任务。\n- 文档支持在建立/维护架构的过程中必须做出的一系列设计决策。\n\
    - 文档还能厘清架构设计决策与非架构设计决策之间的界限。\n  - “非架构设计”是比“详细设计”更受青睐的术语。架构决策可以相当详细。\n  - 架构决策是那些影响系统实现其行为和质量目标能力的决策。\n\
    \n## 那么，你如何记录软件架构？\n\n在实践中，答案似乎是\n\n- “使用 UML”\n- “使用 JavaDoc”\n- “除了 Rose 类图，我还需要什么？”\n\
    - “画方框和线条”\n- “不太清楚”\n- “我们通常不记录”\n- “记录什么？”\n\n## 目标\n\n本课程的目标是\n\n- 帮助你决定应该捕获关于架构的哪些信息。\n\
    - 为捕获必要信息提供指导和记号法，并给出示例。\n- 回答这个问题：“你如何记录架构，以便其他人能够成功地使用、维护和演进它们？你如何从中构建一个系统？”\n\
    \n注意：我们所说的“document”并不一定指打印在纸上的信息。\n\n"
