    # Uses Style


    +   - **Elements:** modules

    +   - **Relations:** uses, a specialization of “depends on”

    +     - A uses B if A depends on the presence of a correctly functioning B to
    satisfy its (A’s) own requirements.

    +   - **Typology:** no constraints (However, loops can cause problems in incrementally
    system delivery.)

    +   - **What it’s for:**

    +     - Planning incremental development

    +     - System extension

    +     - Debugging and testing

    +     - Gauging the effects of specific changes.


