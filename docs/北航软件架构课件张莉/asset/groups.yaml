    \n- - 北京首都机场每天早6点到晚9点，每3分钟一架。北京首都国际机场，为中国北京市对外主要国际机场，是全世界第二繁忙的机场，同时也是中国国际航空公司的基地机场。2006年，北京首都国际机场发展成为亚洲第二大机场（仅次于羽田机场），全球排名第9位。2008年，北京首都国际机场旅客吞吐量达到5592万人次，同比增长4.4%。2012年，首都机场旅客吞吐量超过8180万人次，仅次于美国亚特兰大国际机场。\n\
    - - 全球都是排名第二的，据了解北京首都机场一年起降次数高达597000次，而旅客吞吐量也高达9578.6万人次。来过首都机场的小伙伴应该就知道在这里基本上每时每刻都有飞机起飞或者降落。\n\
    \n## 软件系统的复杂性\n\n- - 软件系统的复杂性来自多个方面（Zuse，1991）\n  - 软件所描述问题域的复杂性\n  - 软件系统本身多状态、多元素及其交互的复杂性\n\
    \  - 人对现实事物的认知与其被认知的方式根本不同所造成的翻译过程的复杂性\n  - 人在构件软件过程中的认知的复杂性\n  - 软件开发过程中用户、开发者等涉众之间交互的复杂性\n\
    \  - 软件项目组织管理的复杂性\n  - 。。。。。。\n\n## 我们面临的困境\n\n- - 软件的抽象性和不可见性\n- - 软件开发过程的不可见性\n\
    \n软件？汽车+一个光盘？\n\n![](img/da691714eec1b93795825838a75ee408_136_0.png)\n\n![](img/da691714eec1b93795825838a75ee408_136_1.png)\n\
    \n![](img/da691714eec1b93795825838a75ee408_136_2.png)\n\n![](img/da691714eec1b93795825838a75ee408_136_3.png)\n\
    \n- 又如：建筑、房屋装修\n\n![](img/da691714eec1b93795825838a75ee408_136_4.png)\n\n![](img/da691714eec1b93795825838a75ee408_136_5.png)\n\
    \n## 软件开发副的問題\n\n- - 带来的问题：\n- - 需求中供需双方的交流问题\n- - 方案设计和评审（难以交流、用户参与困难）\n- - 开发进度的控制、问题的及时发现\n\
    - - 管理无法预见\n- - 尤其是随着软件规模的增大，算法越来越不再是：算法＋数据结构时，也就越来越不再够用。\n\n![](img/da691714eec1b93795825838a75ee408_137_0.png)\n\
    \n## 问题\n\n- - 需求分析\n- - 软件项目中40%~60%的问题都是在软件需求分析阶段埋下的“祸根”。(Leffingwell 1997)\n\
    - - 软件测试、维护\n- - 软件开发费用的40%~60%，还是80%\n\n## 我们的观点\n\n- - 改变思想，更新观点，寻求全生命周期的综合集成、整体优化。\n\
    - - 软件开发的目标:\n- - 质量\n- - 成本\n- - 时间\n\n需求分析 设计阶段 编码 测试 实施和维护阶段\n\n- - 我们能做什么？\n\
    - - 需求是谁写的？质量谁定义？\n- - 一个故事。\n- - 隐含的需求，软件质量的定义。\n\n"
