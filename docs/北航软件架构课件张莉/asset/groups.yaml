    \ | 表示两个构件在语义上存在某种关联系，抽象地说明两个构件之间以某种形式存在相互依赖或通信的手段。 |\n| 依赖关系 |  | Dependency\
    \ | 用符号表示一个构件的修改会对另一个构件产生影响。 |\n| 使用关系 |  | Usage | 一种特殊形式的依赖，表示一个构件的运行以另一个构件的正确运行为前提。\
    \ |\n| 控制流 |  | Association | 对构件之间控制关系的抽象描述。简要说明相关的构件之间以某种方式存在控制，但不揭示控制的具体实现机制。\
    \ |\n| 数据流 |  | InformationFlow | 对构件之间信息关系的抽象描述。概括性地说明构件之间对于数据信息的产生和需求关系，不包括对数据信息的具体特性和制约，也不说明数据信息以怎样的方式实现。\
    \ |\n| 信息流 |  | InformationFlow | 信息流是一种控制和数据同构的关系。控制的传递需要信息的传递。 |\n\n构件图\n对象图\n\
    交互图\n\n## 如何采用UML进行软件体系结构设计\n\n## SAS 建模约束规则\n\n- 1) 每个<<SASComponent>>必须带有一个功能描述；\n\
    - 2) <<SASComponent>>没有接口；\n- 3) <<SASComponent>>构件没有端口；\n- 4) 一个构件至少与一个其它构件相连；\n\
    - 5) 如果构件之间用数据流连接，必须指明传递的数据；\n- 6) 协作中参与交互的构件实例必须已定义构件类型的实例；\n- 7) 协作中，如果两个构件实例之间存在消息传递，则这两个构件之间必须以某种关系相连；\n\
    - 8) 协作中构件实例之间传递的消息必须是接收该消息的实例所属类型的一个特征操作。\n\n## SAD Profile\n\n| 建模元素 | 可视化图符\
    \ | 基类 | 描述 |\n|---|---|---|---|\n| `<<SADComponent>>` | Processor | Component\
    \ | 用于对系统中的逻辑性单元或数据存储单元进行定义。 |\n| `<<SADConnector>>` | Connector | Class | 将系统组件之间进行通信、协调和合作机制进行定义。\
    \ |\n| Connector | Connector | Connector | 分为两种类型：一种是紧密连接件，另一种是粗连接插件。 |\n| `<<RoleBinding>>`\
    \ | RoleBinding | Connector | 用于构件端口和连接件角色之间的匹配连接。 |\n| Interface | Interface\
    \ | Interface | 接口是对一组共特征和职责的声明，分别提供给接口和要求的接口两种类型。 |\n| Port | Port | Port | 表示构件的对外交互点。\
    \ |\n| `<<Role>>` | Role | Port | 角色是 UML2.0 中 Port 的扩展型，表示连接件的对外交互点。 |\n| 协作\
    \ | UML 交互图建模机制 | — | — |\n\n## SAD Profile中建模元素元模型\n\n![](img/da691714eec1b93795825838a75ee408_265_0.png)\n\
    \n"
