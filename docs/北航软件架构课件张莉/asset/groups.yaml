    \n- 面对这样的图，你会有什么反应？\n\n### 假设你是Consultant(顾问)\n\n![](img/da691714eec1b93795825838a75ee408_278_0.png)\n\
    \n面对这样的图，你会有什么反应？\n\n## 软件体系结构建模和表示\n\n- 主要研究软件体系结构描述语言及其支持环境、体系结构描述规范。\n- 主要问题：表达问题。\n\
    \  - 对软件体系结构进行描述的方式主要有\n    - 早期的框线图（Box-and-Line）\n    - MIL (Module Interconnection\
    \ Language)\n    - UML (Unified Modeling Language)\n    - ADL等几种方式\n  - 其它一些语言如SDL\
    \ (Specification & Description Language)在一定程度上具有软件体系结构层次的描述能力。\n  - 还出现了关于软件体系结构描述的规范，如IEEE\
    \ STD 1471-2000[48]，IBM ADS (Architecture Description Standard)等。\n\n### IEEE\
    \ 1471-2000\n\n### 4个核心原则\n\n- 每个系统都有自己的体系结构，每个都和其他的不同\n- 软件体系结构和软件体系结构描述不同\n\
    \  - 软件体系结构描述是一组对体系结构进行编档的产品\n- 无论是在研究中还是在实际应用中，软件体系结构、软件体系结构描述和开发过程是分离的。\n  -\
    \ 可以独立研究和应用\n- 在建立体系结构模型时预留下一定的自由空间，以便允许对具体的体系结构进行定制。\n  - 标准只给出了应该考虑什么，没有强制性要求。\n\
    \n### 内容\n\n- 软件体系结构建模和表示\n  - 概述\n  - 软件体系结构建模（UML）\n  - 软件体系结构描述语言（ADL）\n  -\
    \ 软件体系结构编档\n    - Documenting\n\n### 关于UML的思考\n\n### 静态建模机制\n\n- 类图 (class diagram)\n\
    - 用例图 (use case diagram)\n- 对象图 (object diagram)\n- 构件图 (component diagram)\n\
    - 配置图 (deployment diagram)\n\n### 动态建模机制\n\n- 活动图 (activity diagram)\n- 顺序图 (sequence\
    \ diagram)\n- 合作图 (collaboration diagram)\n- 状态图 (state diagram)\n\n### UML新进展：UML2.0\n\
    \n![](img/da691714eec1b93795825838a75ee408_281_0.png)\n\n新增：组合结构图，包图，交互概览图，时间图\n\
    \n### MDA、MOF、UML简介\n\n探讨：\n\n- 模型驱动的方式\n- 建模机制问题\n- 建模语言的定义方法\n\nMDA MOF UML\n\
    SEL/BUAA\n北航计算机学院\n\n![](img/da691714eec1b93795825838a75ee408_282_0.png)\n\n###\
    \ RATIONAL USER CONFERENCE 2001\n\n### 内容\n\n- 1 OMG\n- 2 MDA\n- 3 MOF\n- 4 UML\
    \ 2.0简介\n- 5 建模语言的定义（构造）\n\n### OMG及其目标\n\n- OMG – 对象管理组织，是一个独立于各厂商的非盈利性组织，全世界最大的软件联盟。\n\
    \  - *The World's Best Standardization Process*\n- OMG的目标是通过提供开放的、厂商独立的交互规范来帮助计算机用户解决集成和协同工作问题。\n\
    \  - Integration\n  - Interoperability\n\n### RATIONAL USER CONFERENCE 2001\n\n\
    ### MDA的出现\n\n- MDA（Model Driven Architecture）则是OMG用于解决以上集成和协同工作问题而提出的最新标准。并综合了OMG以往提出的多项标准。\n\
    - CORBA是OMG在中间件层次上一个显著的工作成果，然而，这个技术上的成功作品在商业应用上却称不上成功，数年之间，J2EE和DotNet相继在中间件的层面上异军突起。\n\
    \n### 中间件市场的多极化 - 混乱\n\n![](img/da691714eec1b93795825838a75ee408_285_0.png)\n\n\
    ### 困难-中间件市场的多极化\n\n对于一个企业，很难在（或根本不可能）在一种中间件体系结构上建立起自己的系统\n\n- 历史遗留\n- 部门分化\n\
    - 技术发展\n- B2B\n\n当初OMG的所有标准都是围绕CORBA定制的，但现在，要考虑一种支持所有中间件架构的开发方法，因此就提出了MDA。\n\n\
    ### MDA的出现\n\nOMG开始把眼光放到更远的地方：\n\n- 希望在更高的层面上统一这兵荒马乱的局面\n- 基于OMG非常成功的工作--UML，提出了MDA的概念。\n\
    \nMDA成功，还因为：\n\n- 开发者们发现，在大部分应用程序的商业逻辑和支持这种逻辑的实现机制之间，存在着明显的分界线；不管采用何种实现技术，一些基本的规则是不变的\
    \ ==》 如何抽取和表示这些规则？\n- 如果这些规则被绑定到某项具体的实现中，当技术改变时，事务处理的规则会被改变，常常被动地适应技术，甚至“削足适履”\
    \ ==》 呼唤二者的分离\n\n### MDA开发生命周期\n\n![](img/da691714eec1b93795825838a75ee408_289_0.png)\n\
    \n### MDA的四种核心模型\n\n- 计算独立模型（CIM—Computing Independent Model）\n  - 高的抽象层次，计算无关，面向问题域\n\
    \  - 业务模型\n- 平台独立模型（PIM—Platform Independent Model）\n  - 具有高抽象层次、独立于任何实现技术的模型\n\
    \  - 描述支撑某些业务的软件系统，建模视角：“系统如何才能最好地支撑业务”。不关心实现技术。\n- 平台相关模型（PSM—Platform Specific\
    \ Model）\n  - 是为某种特定实现技术量身定做的。如采用EJB\n  - PIM可以被变换为一个或多个PSM\n- 代码\n  - 最后一步，将每一个PSM变换成代码。\n\
    \n### MDA的核心技术\n\n- 建模技术\n- 转换技术\n\n### MDA的基本概念\n\n- **MDA**的关键之处是：**模型**在软件开发过程中扮演了非常重要的角色。\n\
    - 在**MDA**中，软件开发过程是由对软件系统的建模行为驱动的。\n\n> MDA就是把建模语言当编程语言使用，\n> 而不只是当作设计语言来用。\n\n\
    ### The Languages of MDA\n\nUML \"bootstrap\"\n\nMetaObject Facility (MOF)\nMOF\
    \ \"core\"\nA modeling language for defining modeling languages\n\nGeneral Standard\
    \ UML\nFor general OO modeling\n\nCommon Warehouse Metamodel (CWM)\nFor exchanging\
    \ information about business data\n\netc.\n\nReal-Time profile\n\nEAI profile\n\
    \nSoftware process profile\n\netc.\n\n### MDA的核心技术：变换技术\n\n### MDA的开发过程\n\nPIM\
    \ → 变换工具 → PSM → 变换工具 → 代码\n\n传统：从模型到代码的变换，主要由手工完成。\n\n一个PIM对应一个或多个PSM\n\nMDA：变换应...\
    \ 许多工具可以把PSM变换成代码，但是，MDA创新之处是把PIM到PSM的变换也自动化了。\n\n"
