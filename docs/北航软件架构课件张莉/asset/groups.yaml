  md: "\n## 可用性的一般场景\n\n刺激源：用户、系统或外部环境产生的刺激；刺激：刺激源发出的请求；环境：正常、可能慢；响应：速度、延迟、等待时间等；响应度量：响应时间、可用性、吞吐量等。\n\
    \n- 目标：应用场景的结果，将要执行的请求或需要。\n- 示例：在正常操作期间，进程收到一个请求并对其进行响应。\n\n## 可用性场景示例\n\n刺激源：系统外部事件；刺激：未预料到的请求；环境：正常操作；响应：通知操作人员或采取措施；响应度量：在规定时间内完成响应。\n\
    \n> 刺激源很重要，因为不同的刺激源可能要求软件作出不同的响应。\n\n> 环境也可以影响响应。例如：系统已经处于非故障状态，为零件降低方式不会不同时。\n\
    \n## 可修改性场景示例\n\n可修改性场景示例：开发人员希望改变系统的行为，以便增加新的行为。这些变更可能造成代码、数据和环境的变化。\n\n刺激源：开发人员；刺激：提出改变用户需求；环境：设计时；响应：修改产生影响的代码。\n\
    \n## 生成质量属性场景\n\n- 可以把具体场景的集合视为系统的质量属性需求。\n  - 对于每个场景是足够具体的，因此对设计师是有意义的。\n  -\
    \ 响应的细节具有足够的意义，可测试系统是否实现了该响应。\n- 可采用表的方式描述\n\n## 例如：可用性的一般场景生成\n\n| 场景 | 可能的值\
    \ |\n|---|---|\n| 源 | 系统内外、系统外部 |\n| 刺激 | 错误、故障、病毒、时间、响应 |\n| 制品 | 系统的处理器、通信通道、持久存储器、进程\
    \ |\n| 环境 | 正常操作、降级模式 |\n| 响应 | 系统知道检测到事件，并进行如下一个或多个活动：记录处理、通过活动的各方、包括用户在内的其他系统、根据适当的规则处理；在一段时间范围内完成响应；系统的资源管理能力\
    \ |\n| 响应度量 | 系统必须在可用的时间内响应；可用时间；系统可以在响应模式下运行的时间间隔 |\n\n## 实践中的质量属性场景\n\n- 一般场景提供了一个生成大量一般的、独立于系统的、特定于质量属性的场景的框架。如：\n\
    \  - 一般场景：一个要求改变功能的请求达到，必须在一个指定的时间内，在开发过程中的一个特定时间段改变功能。\n  - 特定于系统的场景：“一个要求在某天的系统中增加新浏览器支持的请求达到，必须在2周内进行该项改变。”\n\
    - 可见，一个一般场景可能含有多个特定于系统的场景。\n\n## 下面讨论6个最常见的系统质量属性；\n\n- 目的：\n  — 确定质量属性描述所使用的概念；\n\
    \  — 提供一个为该属性生成一般场景的方法\n\n## 1、可⽤性（Availability）\n\n- 可用性与系统故障及其相关后果有关。\n- 当系统不能就其所承诺的服务时，或出现了系统故障。\n\
    - 系统的⽤户（⼈或其它系统）可以感知到此失效情况。\n\n![](img/da691714eec1b93795825838a75ee408_8_0.png)\n\
    \n## 可用性\n\n- 可用性所涉及的方面：\n  - 如何检测系统故障，\n  - 系统故障产生的原因，\n  - 此故障将发生什么样的问题，\n \
    \ - 为保证系统尽可能长时间正常运行，\n  - 什么时机可以安全地出现故障，\n  - 如何防止或缓解故障发生，\n  - 发生故障时如何进行通知等\n\
    - 系统出现故障后，一个重要概念\n  - 恢复所需的时间：从出现故障到用户看不到故障的时间。\n\n## 可用性\n\n- 系统的可用性：系统正常运行的时间比例。\n\
    \  例如：\n  “对于生产系统”\n  可用性标准：至少99.9%的可用性，0.1%的停机率。\n- 区分：故障和错误\n- 故障和错误的区别为允许自动恢复系统提供了可能。\n\
    - 注意：预先定的停止和时间不是故障。\n\n## 可用性的一般场景生成\n\n| 场景 | 可能的值 |\n|---|---|\n| 触发 | 系统故障、系统崩溃\
    \ |\n| 刺激 | 故障、故障、损坏、错误、情况 |\n| 制品 | 系统的硬件、软件、数据、持久存储、进程 |\n| 环境 | 正常操作、偶发事件 |\n\
    | 响应 | 系统检测到故障，并进行下一个或多个动作<br>- 将其记录下来，<br>- 通知用户或其它系统，<br>- 采取措施恢复系统，<br>- 根据其重要性采取不同的措施并通知相关人员\
    \ |\n| 响应度量 | 故障检测所需的时间<br>- 从出现故障到用户看不到故障的时间<br>- 系统在正常模式下运行的时间和时间<br>- 恢复时间\
    \ |\n\n## 2、Modifiability（可修改性）\n\n- 可修改性是有着更复杂成本问题。\n- 有两个观点：\n  - 可以修改条件（制品）？你可以说（例如，制造和修理）系统的性能方面，或系统的状态：\n\
    \    - 各种部件的修改，\n    - 各种部件的修改（例如，制造商、系统用户）\n  - 系统修改的成本，修改系统与其它系统保持兼容，系统用于各种不同的环境（例如，系统）\n\
    \  - 系统修改的复杂性（例如，可检查，未来的修改等）\n  - 系统修改（例如制造商、用户）可能发生的修改条件\n- 何种修改更重要以及修改设计和实现（系统）？一般来说，修改越小越好，修改越小越好。\n\
    \  - 系统的修改越小越好，修改越小越好。\n  - 系统的修改越小越好，修改越小越好。\n  - 系统的修改越小越好，修改越小越好。\n\n## 可修改性的一般场景生成\n\
    \n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 潜在用户、开发人员、管理员进程 |\n| 刺激 | 在修改过程中触发的修改请求、错误信息、异常\
    \ |\n| 制品 | 正在开发的产品、软件、其修改后与旧版本定义的功能或性能 |\n| 环境 | 在运行中、维护中、测试中、设计时 |\n| 响应 | 系统能够在不影响其正常运行的前提下进行修改\
    \ |\n| 响应度量 | 根据修改所涉及元素的数量、修改的成本、努力、资源、该修改对其他可能被修改系统所造成影响的程度 |\n\n## 3、性能\n\n\
    - 性能与时间有关。\n\n## 3、性能的一般场景生成\n\n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 大量独立请求的个体、可执行任务内部\
    \ |\n| 刺激 | 连续的请求、触发事件的请求、触发事件的请求 |\n| 制品 | 系统 |\n| 环境 | 正常模式、超载模式 |\n| 响应 | 性能响应、改变服务周期\
    \ |\n| 响应度量 | 等待时间、响应时间、吞吐量、抖动、失败率、截止丢失 |\n\n## 4、安全性（Security）\n\n- 安全性是衡量系统在合理合法用户正常提供服务的情形下，阻止企图非授权使用和抵制拒绝服务或攻击的能力。\n\
    - 可以把安全性制品看为一个提供“可信、机密性、完整性、保护、可验证性”的能力。\n- 认证：交易（请求或信息被接受）不能被更多的任何一台设备或任何的成员，如通过Internet发送或被一个木马，或不能被确认。\n\
    - 机密性：未经授权的访问者可能获取敏感数据的风险。\n- 完整性：被设计以提供交易数据的完整性。\n- 保护：交易与各方涉及的各方人员的身份。\n- 可用性：系统可用于合法使用的属性。\n\
    - 审计：系统在其它异常活动时的属性。\n\n## 安全性的一般场景生成\n\n| 场景 | 可能的值 |\n| --- | --- |\n| 源 | 企图破坏、窃取或破坏系统的个人或系统，它有自己的条件；除了对系统有破坏外，还可能对系统有破坏\
    \ |\n| 刺激 | 企图破坏、窃取或破坏系统 |\n| 制品 | 系统、系统中的数据 |\n| 环境 | 系统在正常运行、系统在维护、系统在被攻击时 |\n\
    | 响应 | 系统能够检测到攻击并阻止攻击 |\n| 响应度量 | 系统的响应时间、系统的可用性、系统的安全性 |\n\n## 5、可测试性（Testability）\n\
    \n- 软件的可测试性：指通过测试揭示软件缺陷的容易程度。\n- 通常：测试占40%的开发成本\n- 一般说：系统在错误状态。\n- 能“控制”内部状态和输入，能“观察”输出\n\
    \n## 可测试性的一般场景\n\n可测试性的一般场景\n刺激源：\n刺激：执行命令、请求\n产品：\n环境：\n在相应环境中\n响应：\n响应具有控制\n\
    输出到被测系统\n且是可测量的\n响应度量：\n在时间中测量\n了系统的输出\n\n## 可测试性的一般场景生成\n\n| 场景 | 可能的值 |\n| ---\
    \ | --- |\n| 触发 | 经常无开发人员、经常是开发人员 |\n| 刺激 | 经常是开发人员、经常是被测软件人员、系统使用用户<br>自己完成的操作、体操动作、设计、英文字母和数字、所交付的系统\
    \ |\n| 产品 | 设计、代码、实施的软件 |\n| 环境 | 实验室、开发环境、测试环境、部署环境、用户环境 |\n| 响应 | 观察到的状态、输出、测量结果、其他被测试系统\
    \ |\n| 响应度量 | 已被执行的动作的百分比<br>如果有输出则测量输出率<br>其他度量的指标<br>测量率和比较<br>测量率和比较的增长量<br>测量率和比较的增长量\
    \ |\n\n## 6. Usability（易用性）\n\n- 关注：对用户而言完成某个期望任务的容易程度和系统所提供给的用户种类。\n- 划分：\n \
    \ - 可学习性：使系统容易学习使用。\n  - 有效率性：系统如何有效率地执行用户所期望的操作。\n  - 易于记忆的影响因素：系统如何使用户记忆操作。\n\
    \  - 使用错误和用户的反应：如何使用户的反应保持在可接受的范围内。\n  - 提供自我和沟通的反馈：如何使系统反馈给用户正确的反馈。\n- 细节不是软件体系结构层面的问题\
