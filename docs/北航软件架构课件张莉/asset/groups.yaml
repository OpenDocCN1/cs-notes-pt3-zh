    Reconstructed from Duke''s Bank Application—Sun JEE 1.3 tutorial


    # Allocation Views


    +   - Views: Development, Implementation, Work Assignment...

    +   - Elements:

    +     - Software elements (from module or C&C views)

    +     - Environment elements (e.g., files, processors, organization units)

    +   - Relations: Software elements are allocated or assigned to environment elements.


    # What Are Allocation Views Used for?


    +   - Communication: These styles let everyone agree where the software "lives"
    during its environment, production and execution.

    +   - Analysis: Analyzing purchasing options for execution and development environments.
    The Development style enables detailed performance modeling.

    +   - Education: A Software developer can learn the team structure via the Work
    Assignment style. The Development style shows how the system works in its execution
    environment.


    # Styles of the Allocation Viewtype


    +   - Deployment style

    +     - Allocates software elements to processing and communication nodes

    +     - Properties include those necessary to calculate (and achieve) performance
    and availability

    +   - Implementation style

    +     - Allocates software elements to structures in the file system of the development
    or production environment

    +     - Properties include files and capacities.

    +   - Work assignment style

    +     - Allocates software elements to organizational work units

    +     - Properties include skill sets.


