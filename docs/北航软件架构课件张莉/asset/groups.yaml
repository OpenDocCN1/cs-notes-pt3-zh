  mdcn: "\n\n## 问题\n\n- ◆ 你读过哪些非常好的软件文档？\n- ◆ 是什么让它很好？\n\n- ◆ 你读过哪些非常糟糕的软件文档？\n- ◆\
    \ 是什么让它很糟糕？\n\n## 良好文档的原则\n\n良好文档的七项原则\n\n- 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n- 3.\
    \ 避免歧义。\n- 4. 使用标准组织结构。\n- 5. 记录你的理由。\n- 6. 保持文档最新，但不要太新。\n- 7. 审阅文档。\n\n## 良好文档的原则\n\
    \n- 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n- 3. 避免歧义。\n- 4. 使用标准组织结构。\n- 5. 记录你的理由。\n- 6.\
    \ 保持文档最新，但不要太新。\n- 7. 审阅文档。\n\n## 1. 从读者的角度写作-1\n\n- ◆ 确定读者是谁。\n- ◆ 确定读者想要了解什么\n\
    - ◆ 使信息易于查找。\n- ◆ 你的读者会欣赏你的努力，更有可能阅读你的文档。\n\n![](img/da691714eec1b93795825838a75ee408_34_0.png)\n\
    \n## 1. 从读者的角度写作-2\n\n- ◆ 文档为作者方便而写的迹象包括\n  - ➢ “意识流”写作 -- 主题以作者随机想到的顺序呈现。\n \
    \ - ➢ “执行流”写作 -- 主题以其在计算机中出现的顺序呈现。\n  - ➢ 作者显然对读者已知的知识做了太多假设\n\n## 良好文档的原则\n\n\
    - 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n- 3. 避免歧义。\n- 4. 使用标准组织结构。\n- 5. 记录你的理由。\n- 6.\
    \ 保持文档最新，但不要太新。\n- 7. 审阅文档。\n\n## 避免不必要的重复\n\n- 每种信息应只记录在一个地方。\n- 这使得文档更易于使用，也更易于更改。\n\
    - 重复常常会让读者困惑，尤其是在信息以略有不同的方式重复时。读者会想知道\n  - “这种差异是有意为之吗？如果是，为什么？”\n  - “如果不是，哪种方式是正确的？”\n\
    \n## 良好文档的原则\n\n- 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n- 3. 避免歧义。\n- 4. 使用标准组织结构。\n- 5.\
    \ 记录你的理由。\n- 6. 保持文档最新，但不要太新。\n- 7. 审阅文档。\n\n## 3. 避免歧义 (避免歧义) -1\n\n- 文档用于传达信息和思想。如果读者因歧义而误解，文档就失败了。\n\
    - 精确定义的符号/语言有助于避免歧义\n- 如果你的文档使用图形语言，务必包含图例。图例应\n  - 指向该语言的正式定义，或\n  - 给出每个符号的含义（不要忘记线条！）。如果颜色或位置很重要，请定义它。\n\
    - 使图例有意义。不要只说“元素”和“关系”。不同的元素/关系类型应有不同的符号。\n\n## 3. 避免歧义 (避免歧义) -2\n\n- 方框连线图是常见的架构表示形式。\n\
    - 但它们是什么意思？\n- 如果你使用方框连线图，务必精确定义方框和线条的含义。\n- 如果你看到一个方框连线图，请询问作者它是什么意思。结果通常很有趣。\n\
    - 如果你的文档包含已知的歧义，请标记它们以便以后解决。\n\n## 良好文档的原则\n\n- 1. 从读者的角度写作\n- 2. 避免不必要的重复。\n\
    - 3. 避免歧义。\n- 4. 使用标准组织结构。\n- 5. 记录你的理由。\n- 6. 保持文档最新，但不要太新。\n- 7. 审阅文档。\n\n##\
    \ 4. 使用标准组织结构.-1\n\n- 建立它，确保你的文档遵循它，并确保读者知道它是什么。\n- 标准组织结构\n  - 帮助读者导航和查找信息。\n\
