    \nOrganization\nPackage, subsystem\nDynamics\nInteraction\nState machine\n\n##\
    \ UML的用例视图\n\n- 从系统外部执行者的角度理解系统的功能：它描述执行者与系统的交互，其执行者可以是一个用户，也可以是另一个系统。\n- 用例图面向客户、建模人员、开发人员和测试人员，是系统模型图的核心。\n\
    - 用例视图：用例图和活动图描述。\n- 一张用例图是系统的一种用途的描述；一组用例图描述了整个系统所期望的用途。\n\n## UML的逻辑视图\n\n-\
    \ **描述系统如何提供要求的功能：**\n  - 静态结构：\n    - 类（界面，内部结构）；对象；关系。\n    - 用类图和对象图描述。\n \
    \ - 动态行为：\n    - 对象之间相互发送消息而引发的动态合作关系。\n    - 用状态图、顺序图、合作图和活动图描述。\n    - 各种特性：永久性，并发性。\n\
    - **主要是面向设计人员和开发人员。**\n\n## UML的构件视图\n\n- **描述实现的各个模块及其相互之间的关系：**\n  - 模块的内部结构；\n\
    \  - 模块间的依赖关系；\n  - 关于各构件的一些附加信息：\n    - 资源分配（构件的责任）；\n    - 其它管理信息，如开发工作的进展报告等。\n\
    - **主要面向开发人员。**\n- **构件视图：**由构件图组成，其中构件表示不同类型的代码模块。\n\n## UML的并发视图\n\n- 系统中进程和处理器的划分。\n\
