    # RATIONAL USER CONFERENCE 2001


    # 建一座摩天大楼


    ![](img/da691714eec1b93795825838a75ee408_321_0.png)


    # 什么是UML


    +   ◆ UML是一种标准化的建模语言，它统一了面向对象建模的基本概念、术语及其图形符号，为人们建立了便于交流的共同语言。


    +   ◆ UML是一种图形化语言，用来详细地描述，可视化地表示一个系统的构建过程，并以文档化的形式记录最终得到的系统产品。


    +   ◆ UML是用来描述MDA（模型驱动体系结构）的关键标准语言，这些关键标准即UML自身、元对象机制（MOF）以及公共仓库模型（CWM）。UML也用于创建MDA处理的工作结果，尤其是商业和实规模型。'
  - '[PAGE 322]


    # 什么是UML


    # UML是一种建模语言


    +   ◆ 建模方法 = 建模语言 + 建模过程。建模语言定义了用于表示设计的符号(通常是图形符号)；建模过程描述进行设计所需要遵循的步骤。


    +   ◆ 标准建模语言UML是一种建模语言，而不是一种方法，它统一了面向对象建模的基本概念、术语及其图形符号，为人们建立了便于交流的共同语言。


    +   ◆ 建模能力: 建模方法 + 领域知识 + 实践


    # 什么是UML


    +   ◆ UML源于Booch, OMT and Objectory建模语言，在其基础上，集众家之长，几经修改而成。

    +     ➢ 起源可以回溯到数据建模和SDL (Specification and Description Language, 规格说明与描述语言)


    +   ◆ 1997年11月，OMG通过了UML1.1版

    +     ➢ 使用最广的版本是2001年5月通过的UML1.4版


    +   ◆ 2003年7月，OMG采纳了UML2.0规范。'
  - '[PAGE 323]


    # UML的设计目标


    UML的设计目标是：


    +   - 运用面向对象概念，在尽可能简单的同时，对实际需要建立的系统的各个方面建模（不仅是针对软件）

    +   - 建立起从概念模型直至可执行体之间明显的对应关系

    +   - 着眼于那些有重大影响的问题

    +   - 创建一种对人和机器都适用的建模语言


