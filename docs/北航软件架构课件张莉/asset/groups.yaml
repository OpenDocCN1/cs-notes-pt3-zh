    \n基状态名\n激活状态\n\n## 评审状态图\n\n![](img/da691714eec1b93795825838a75ee408_385_0.png)\n\
    \n## 特性描述\n\n- 扩展UML元模型有三个基本途径：\n  - 原型(stereotype)\n  - 标记值(tagged value)\n \
    \ - 约束(constraint)\n\n特性描述(profile)是这三者的集合，它是一种特殊的包，为建模的特定平台或领域扩展UML。\n\n## 原型\n\
    \n- 原型建立在已存在的元素基础之上，可以有它自己的图标，但信息内容与已存在的模型元素相同。\n- 原型用双尖括号(《 》)包围的文字字符串表示。\n\n\
    ![](img/da691714eec1b93795825838a75ee408_386_0.png)\n\n## 标记值\n\n标记定义是关于模型元素本身的一个属性的定义，即一个元属性的定义，它具有名字和类型。标记定义被原型所拥有。\n\
    \n![](img/da691714eec1b93795825838a75ee408_386_1.png)\n\n## 约束\n\n- 利用约束，可以设置对UML元素添加的附加属性，可以规范一些通常不能规范的东西。\n\
    - 例如，特性描述可以规范一种约束：用户不能在原型entity的两个类之间画上关联。\n\n## 内容\n\n- 1 OMG\n- 2 MDA\n- 3 MOF\n\
