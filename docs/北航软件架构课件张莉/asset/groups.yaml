    \    methods component_methods\n    [behavior component_behavior]\n    [context\
    \ component_context]\n  end component_name;\n```\n\n+   • 对接口的描述\n\n```\ncomponent_message_interface\
    \ ::= \n  top_domain_interface\n  bottom_domain_interface\n\ntop_domain_interface\
    \ ::= \n  top_domain is\n    out interface_requests\n    in interface_notifications\n\
    \nbottom_domain_interface ::= \n  bottom_domain is\n    out interface_notifications\n\
    \    in interface_requests\n\ninterface_requests ::= \n  { request; } | null;\n\
    ```\n\n```\ninterface_notifications ::= \n  { notification; } | null;\n\nrequest\
    \ ::= \n  message_name (request_parameters)\n\nrequest_parameters ::= \n  [to\
    \ component_name][parameter_list]\n\nNotification ::= \n  message_name[parameter_list]\n\
    ```"
  - '[PAGE 207]


    # Unicon


    +   - Unicon (UNiversal CONnection) 是 SEI/CMU 的 Mary Shaw 等人定义的一个通用型软件体系结构描述语言，主要目的：

    +     - 支持对现有组件的使用。

    +     - 提供对组件和连接器的统一的访问。

    +     - 区分不同类型的组件和连接器以便对体系结构配置进行检查。

    +     - 支持不同的表示方式和不同的分析工具。


    +   - 主要元素包括构件和连接件。

    +     - 构件代表软件系统中的计算和数据的处所，用于将计算和数据组织成多个部分。这些组成部分都有完善定义的语义和行为。

    +     - 连接件代表构件间的交互作用的类。它们在构件之间的交互中起中介作用。


    # Unicon


    +   - Unicon 中构件和连接件的结构非常对称，都包括如下几个部分：

    +     - 名字 Name；

    +     - 规格说明 Specification（构件的规格说明称为构件的接口 Interface，连接件的规格说明称为连接件的协议 Protocol）；

    +     - 构件和连接件类型 Type；

    +     - 一个特性列表 Property List（每个特性用“特性名-数值”的形式表示，是对设计元素的属性、约束信息等的进一步说明，Unicon 有
    35 个预定义的特性）；

    +     - 一系列的关联单位 Association Unit（构件的关联单位称为演员 Player，连接件的关联单位称为角色 Role）；

    +     - 实现 Implementation。构件和连接件的实现部分都有原子 Primitive 和复合 Composite 两种形式。原子构件直接由程序设计语言或系统外壳脚本编码实现。复合构件则通过构件和连接件的组合表示。原子连接通常实现通过编程语言或系统中的内嵌机制（如进程调用、数据共享、消息机制等）来实现。目前
    Unicon 还不能对复合连接件提供支持'
  md: "\n## 特点\n\n- ACME有如下主要特点:\n  - 用7种基本的设计元素来表示软件体系结构\n  - 提供了一种灵活的注释机制，支持将体系结构和用子语言表示的非结构化信息结合起来。这些子语言是外部定义的。\n\
    \  - 提供了一种类型机制，用于抽象出共同的、可重用的体系结构惯用法和风格。\n  - 提供了一个开放的语义框架，用于体系结构描述的推理。\n\n## ACME体系结构设计元素类型\n\
    \n- 7类基本元素:\n  - 构件、连接件、系统、端口、角色、表述和表述图。\n  - 核心是：构件、连接件和系统\n\n![](img/da691714eec1b93795825838a75ee408_200_0.png)\n\
    \n- **构件**：代表系统中基本的计算元素和数据存储。\n  - 典型的构件有：客户、服务器、过滤器、对象、黑板、数据库等。\n- **连接件**：构件之间的通信和交互方式。\n\
    \  - 例子：简单的交互形式，如管道、过程调用、事件广播等；复杂的交互，如客户/服务器协议、数据库和应用程序之间的SQL连接。\n- **系统**：代表构件和连接件的配置。\n\
    \n- **构件的接口**：定义为端口（port）的集合。一个端口表示构件与外部环境的一个交互点。\n- **连接件的接口**：可以用角色来定义。每个角色定义了连接件所代表的交互中的一个参与方。\n\
    \  - 二重连接有两个角色。如RPC中的Caller和Callee；管道连接中的Reading和Writing；消息发送连接中的sender和receiver等。\n\
    \n## 例子\n\n![](img/da691714eec1b93795825838a75ee408_201_0.png)\n\n- 以C/S模型为例。图中包含两个构件和连接件。\n\
    ACME描述如下：\n\n```\nSystem simple_CS={\n    Component Client = { Port send-request\
    \ }\n    Component Server = { Port receive-request }\n    Connector RPC = { Roles\
    \ (Caller, Callee) }\n    Attachment: { Client. send-request to RPC.Caller\n \
    \                 Server. receive-request to RPC.Callee\n                }\n}\n\
    ```\n\n- ACME支持体系结构的分层描述。每个构件或连接件都能用一个或多个更详细、更底层的描述来表示——称为一个表述（representation）。\n\
    - 表述图：当某个构件或连接件有体系结构描述时，表述图用于说明在这个表述的系统内部和此表述所代表的构件或连接件的外部接口之间，存在何种关系。\n\n## 构件的表述和属性\n\
    \n![](img/da691714eec1b93795825838a75ee408_202_0.png)\n\n- Aesop的主要特点是支持特定风格的软件系统结构设计环境的快速生成。\n\
    - 最初的目标是提供一个用于构造开放的、支持体系结构风格的体系结构环境的开发工具包。\n- 基本思路：使定义新的风格变得容易，从而让设计者能够利用这些风格进行体系结构设计。\n\
    - 基于以上想法，Aesop提供下列支持：\n  - 一个开发工具包，用于快速开发体系结构设计环境，着重于特定领域的体系结构风格；\n  - 一个开放的工具集成框架，用于支持与其他工具的协作；\n\
    \  - 一个“有限意识的”库，用于存储、检索和重用体系结构设计元素；\n  - 一个可以维持体系结构设计状态的面向对象数据库，用于存储和操作体系结构设计；\n\
    \  - 一个用户可定制的基于Tcl/Tk的图形用户界面\n\n## C2\n\n- C2是加利福尼亚大学软件研究所ISR（Institute of Software\
    \ Research at University of California）的Richard N. Taylor等人定义的，主要是对C2风格的软件体系结构进行描述。\n\
    - C2风格是由ISR定义的一种软件体系结构风格\n  - 主要适合于分布式异构环境中，基于消息的图形用户界面应用系统的设计。\n  - 其主要的设计元素包括构件、连接件，以及它们之间的拓扑关系。\n\
    - 一个C2风格的软件体系结构，可以看作由并行构件堆接在消息路由设备上连接而成的一个具有层次性的网络。\n  - 每个构件和连接件都有一个“顶层域”和一个“底层域”；\n\
    \  - 构件的“顶层域”连接到某个连接件的“底层域”，构件的“底层域”连接到另一个连接件的“顶层域”，连接数目不受限制；\n  - 构件之间的交互只能通过连接件进行，异步通知消息和异步请求消息是构件之间进行交互的唯一方式；\n\
    \  - 连接件负责对消息进行路由或多点传送。\n\n## C2\n\n- C2风格的一个主要特点是其“受限的可见性”，即对于层次结构中的任何构件来说，它仅知道其上层构件的存在，而不知道其下层构件的存在。\n\
    \  - 通过在构件内部定义一个消息转换器来实现的。消息转换器可以将其发送的请求消息转换为接收方可理解的形式，并把接收的通知消息转换为自身可理解的形式。\n\
    \  - 这种机制提高了构件的可替换性和重用性，以及系统的可扩展性和一定的动态配置能力。\n- ArchStudio是一个建立在C2基础之上的基于软件体系结构的开发环境。\n\
    \  - 包含一个Java和一个C++的面向对象类框架，这两个框架为其构件、连接件和消息交互机制的实现提供了底层支持，可以从软件体系结构模型生成可执行代码。\n\
    \n## C2风格的货物路线系统的体系结构\n\n![](img/da691714eec1b93795825838a75ee408_205_0.png)\n\
    \n- 对构件的描述\n\n```\nComponent::=\n  component component_name is\n    interface\
    \ component_message_interface\n    parameters component_parameters\n    methods\
    \ component_methods\n    [behavior component_behavior]\n    [context component_context]\n\
    \  end component_name;\n```\n\n- 对接口的描述\n\n```\ncomponent_message_interface ::=\
    \ \n  top_domain_interface\n  bottom_domain_interface\n\ntop_domain_interface\
    \ ::= \n  top_domain is\n    out interface_requests\n    in interface_notifications\n\
    \nbottom_domain_interface ::= \n  bottom_domain is\n    out interface_notifications\n\
    \    in interface_requests\n\ninterface_requests ::= \n  { request; } | null;\n\
    ```\n\n```\ninterface_notifications ::= \n  { notification; } | null;\n\nrequest\
    \ ::= \n  message_name (request_parameters)\n\nrequest_parameters ::= \n  [to\
    \ component_name][parameter_list]\n\nNotification ::= \n  message_name[parameter_list]\n\
    ```\n\n## Unicon\n\n- Unicon (UNiversal CONnection) 是 SEI/CMU 的 Mary Shaw 等人定义的一个通用型软件体系结构描述语言，主要目的：\n\
    \  - 支持对现有组件的使用。\n  - 提供对组件和连接器的统一的访问。\n  - 区分不同类型的组件和连接器以便对体系结构配置进行检查。\n  - 支持不同的表示方式和不同的分析工具。\n\
    \n- 主要元素包括构件和连接件。\n  - 构件代表软件系统中的计算和数据的处所，用于将计算和数据组织成多个部分。这些组成部分都有完善定义的语义和行为。\n\
    \  - 连接件代表构件间的交互作用的类。它们在构件之间的交互中起中介作用。\n\n## Unicon\n\n- Unicon 中构件和连接件的结构非常对称，都包括如下几个部分：\n\
    \  - 名字 Name；\n  - 规格说明 Specification（构件的规格说明称为构件的接口 Interface，连接件的规格说明称为连接件的协议\
    \ Protocol）；\n  - 构件和连接件类型 Type；\n  - 一个特性列表 Property List（每个特性用“特性名-数值”的形式表示，是对设计元素的属性、约束信息等的进一步说明，Unicon\
    \ 有 35 个预定义的特性）；\n  - 一系列的关联单位 Association Unit（构件的关联单位称为演员 Player，连接件的关联单位称为角色\
    \ Role）；\n  - 实现 Implementation。构件和连接件的实现部分都有原子 Primitive 和复合 Composite 两种形式。原子构件直接由程序设计语言或系统外壳脚本编码实现。复合构件则通过构件和连接件的组合表示。原子连接通常实现通过编程语言或系统中的内嵌机制（如进程调用、数据共享、消息机制等）来实现。目前\
    \ Unicon 还不能对复合连接件提供支持\n"
