    # AADL的构件


    +   - AADL的构件的定义包括两部分：构件的类型和构件的实现。一个AADL的构件拥有一个类型（component type）以及对应的零个、一个或者很多个实现（component
    implementation）。

    +   - 构件的类型描述了对外的功能接口（进出端口，属性等）。

    +   - 构件的实现描述了构件的内部结构（子构件，其他的属性等）。

    +   - 一个构件的类型可以有多个实现，和构件类型一样，一个实现同样可以扩展为其他的实现。'
