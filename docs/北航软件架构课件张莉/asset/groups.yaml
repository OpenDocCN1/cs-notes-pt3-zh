- raw:
  - '[PAGE 23]


    # 重要概念（续）


    +   - 通常，对每个Pattern主要包括四个部分：

    +     - Pattern name

    +     - 要解决的Problem

    +     - Solution（解答，抽象层次的描述）

    +     - Consequences（结果，对性能方面的影响和折中）


    +   - 采用MVC：

    +     Model — application object

    +     view — screen presentation

    +     Control - user interface reacts to user input


    # 重要概念（续）


    # 如何用它解决实际问题


    +   1. 找到合适的Object

    +   2. 决定Object的粒度

    +   3. 确定Object的接口

    +   4. 指定Object的实现 — 一群Class

    +   5. Putting reuse mechanisms to work

    +   6. Relating run-time and compile-time structure

    +   7. Design for change


    # 区分两个概念：


    +   - object’s class — 决定 object 的实现（包括内部状态和操作的实现）

    +   - Object’s type — 指 interface

    +     ∴ Class 定义了 object’s type


    +   - Class inheritance

    +   - Interface inheritance


    An object may have many types and widely different objects can share a type


    Program to an interface, not an implementation


    # reuse mechanisms


    +   1. Class inheritance – white-box reuse

    +   2. Object composition – black-box reuse

    +   3. Delegation

    +   4. Parameterized type

    +      - 功能重要的另一种技术，

    +        可在C++中的templates,

    +        Ada, Eiffel 中的generics


    # 类继承：white-box reuse


    +   - 优点：

    +     1. 继承关系能够被修改，可以直接重用（因为继承关系暴露了内部细节）

    +     2. 能够修改重用的方式（override）


    +   - 缺点：

    +     1. 不能够很好地被修改了父类的结构和实现

    +     2. 更糟的是父类关系又了类之间的紧密耦合

    +        因为继承关系于子类与父类的紧密

    +        ...继承就破坏了封装性

    +     3. 且子类实现细节于父类，即父类中实际的修改将破坏子类的实现

    +        => 降低了灵活性和最终的重用性

    +        => 方法众多；只从结构继承，...reuse'
  - '[PAGE 24]


    # 对象组装：black-box reuse


    实现组装的对象具有明确的定义接口


    +   - 优点：1. 它是运行时期通过对象间的动态定义（类继承是一类）

    +   2. Keep each class encapsulated and focused on one work

    +   3. 如果系统相对独立在较小的规模，不会增加管理复杂性

    +   - 缺点：1. 会有更多对象，系统行为依赖于不同的对象，而非一个类的定义


    # 两者的合作：


    +   - 对象组合组装对象

    +   - 继承使对象易于生成（用于组装）


    O-O design 的两个 Principles:


    Program to an interface, not an implementation


    Favor object composition over class inheritance


    # Delegation:


    +   - 保持Composition 的重用性与继承一样 Powerful

    +   - 例：


    类1就重用类2的方法有两种解释：<功能重用>


    +   1. 类1作为类2的子类（继承）

    +   2. 类1 have 类2（即类1的组成部件—delegate）

    +   类1引用类2的方法，或说类1将操作委托给类2


    主要优点：方便地将类扩展到其它地方组behavior，以及其它组合方式


    缺点：比静态软件子程序，对执行效率的影响。


    # 三种重用技术比较


    # Inheritance:


    +   - 提供操作的缺省实现，且子可重定义


    # Object Composition:


