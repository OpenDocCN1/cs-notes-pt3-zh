    # • Software Architecture


    +   - 1992和1993年，以【1】【2】两篇文章的发表为主要标志，软件体系结构作为软件工程中一个新兴的研究领域逐渐引起了人们的广泛关注。

    +   - 【1】Dewayne E. Perry and Alexander L. Wolf, Foundations for the study of
