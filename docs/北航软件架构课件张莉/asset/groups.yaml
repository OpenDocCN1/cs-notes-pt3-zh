    # 逻辑视图


    +   主要是从满足功能需求的角度出发对系统进行分解，目的是向用户表明系统如何在功能上满足其最终的需求。


    +   逻辑视图


    +   逻辑结构：包图和类图


    +   行为描述：交互图（顺序图和协作图）、状态图等


    # 逻辑结构


    +   从系统用户角度看到的系统结构。


    +   逻辑结构的创建很大程度上依赖于设计师对领域知识的熟知程度，应建立在深入的领域分析基础之上。


    +   逻辑结构可通过UML中包图和类图来描述。包表示可被进一步分解的元素，其内部可由其它包或者类组成，类表示在体系结构设计阶段不需要再对其进行分解的元素。'
  - "[PAGE 243]\n\n# 行为描述\n\n+   ◆ 对系统逻辑行为进行描述的目的，一方面是为了验证这种结构设计是否能够真正满足系统的功能需求，另一方面是为了将用例所代表的功能分解成粒度更小、更易于理解的形式，并分别分配到各个逻辑组成元素上。\n\
    +   \n+   ◆ 逻辑行为可以采用交互图（顺序图和协作图）、状态图等形式来描述。\n\n+   ◆ 具体做法是：\n+   \n+   ◆ 1）首先，“XX子系统逻辑视图”包中创建一个包，命名为“用例实现”。\n\
    +   \n+   ◆ 2）然后，在这个包中，创建一个用例图，针对每一个用例创建一个“用例实现（Usecase Realization）”，并建立该用例实现到其对应用例的追踪关系。\n\
    +   \n+   ◆ 3）以逻辑视图中划分的逻辑模块做参与者和对象，通过交互来描述每个用例的实现。这样就可以将用例的功能分解为这些逻辑模块的一个职责。\n\
    +   \n+   ◆ 4）如果某个元素的行为比较复杂，在整个生命周期中会存在多种不同的状态，也可以用状态图对其行为进行细化。\n+   \n+   ◆ 通过创建逻辑行为模型，可以更深入的理解和交流需求，并且也为进一步的设计提供了基础。\n\
    +   \n+   ◆ 逻辑视图仍然是在概念层次对系统进行的分析，不必过多的考虑系统实现方面的问题。\n+   \n+   ◆ 建议用协作图，因为：这时候不关心严格的时序关系，而更关心对象之间彼此的关系。"
