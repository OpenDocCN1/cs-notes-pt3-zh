    6. 理解、评价并接受系统需求。\n7. 评价和确认软件架构的实现专业技能。\n\n## 为什么大部分码农做不了软件架构师？\n\n小团队一般 10 人左右，其中常是技术最牛的人做架构师（或\
    \ TL）。所以，架构师在广大码农中的占比大概平均不到 10%。而架构师也可以分为初级、中级、高级三档，江湖上真正高水平的软件架构师就更少了。\n\n所以，大部分（超过九成）的码农干上许多年，还是做不了架构师，这是什么原因造成的呢？\n\
    \n## 85 个回答\n\n知乎用户  \n首席系统架构师  \n\n77 人赞同该回答\n\n其实吧，主要是大部分人没机会接触到足够的经验。现在程序员界也阶级固化了，很多人听上去牛逼的不得了，其实不过是一个组的主力而已，接触不到足够的全局，你是无法了解什么是架构的。\n\
    \n很多外行的人或者学生，看着这黑黑的窗口和一行行代码到底是如何变成一个软件的，这就是外行和程序员对软件的理解不同，相对的，普通程序员，也无法理解，他编的一个功能，到底在最后整体架构中有些什么作用。\n\
    \n## 成为软件架构师的途径\n\n- **软件架构——巨大的知识海洋**\n  - 门槛相对较高、职业生涯非常长\n  - 相对独立于技术的新陈代谢\n\
    \  - 适合于喜欢学习的人\n- **不断学习、增加积累、注重经验**\n  - 注意学习方法论、框架\n  - 不断增加各种系统架构的知识\n  - 经验积累非常重要\n\
    - **在与高手和同行合作中提高水平**\n  - 与高手的合作是最佳途径\n  - 同行之间的交流也非常有效\n  - 在每一个项目中进行创新\n\n"
