    \n![](img/da691714eec1b93795825838a75ee408_3_0.png)\n\n## McCall模型\n\n- McCall模型对质量进行分解，并将质量属性按照产品的生命周期划分为三类。\n\
    \n![](img/da691714eec1b93795825838a75ee408_3_1.png)\n\n## ISO/IEC9126\n\nMcCall模型质量属性映射到ISO/IEC9126的六个特性：正确性、可维护性、可靠性、效率、易用性、完整性等\n\
    \n## ISO/IEC9126是McCall模型的继承模型。将软件质量分解为6个特性：\n\n- 功能性\n- 可靠性\n- 易用性\n- 可使用性\n\
    - 可维护性\n- 可移植性\n\n## 为了方便起见，从以下两个方面讨论质量属性：\n\n- 通过运行可观察到的系统质量属性\n  - 在运行过程中，系统是否按照规格说明的要求工作？系统运行是否达到了预期的效果？系统的输出是否及时？执行是否正确？系统是否能按要求达到预期的精度及稳定程度？当与其他系统连接时，系统工作是否正常？\n\
    - 通过运行不可观察到的系统质量属性\n  - 系统的复杂性、修改软件的难易程度如何？开发的成本有多少？是否在预定时间内投入市场等？\n\n## 软件体系结构和质量属性\n\
    \n我们将从以下三个方面讨论：\n\n- 系统的质量属性\n  - 能通过观察系统运行确定的质量属性\n  - 不能通过观察系统运行确定的质量属性\n- 受系统结构影响的非商业属性\n\
    - 与软件体系结构本身相关联的一些质量属性，如概念完整性。\n\n## 可直接观察到的系统的运行属性\n\n可在运行时观察确定的系统质量属性\n\n- 性能\n\
    - 可靠性\n- 可维护性\n- 可扩展性\n- 易用性\n\n## 性能（Performance）\n\n[定义]: 对外刺激（事件）做出响应所需要的时间或某个时间间隔内所处理的事件个数。\n\
    \n- 性能这一质量属性经常用单位时间内所能完成的处理或计算量来表示，或为完成一个处理所需要消耗的时间来表示。\n- 由于通信所用的时间通常大于计算所用的时间，因此系统性能是通过系统中各个组件间进行通信或交互的数据量的函数——虽然还是软件体系结构问题。\n\
    \n## 安全性（Security）\n\n[定义]: 是衡量系统在向合法用户正常提供服务的情况下，阻止非授权使用企图和拒绝服务攻击的能力。\n\n包括：\n\
    - 指纹服务\n- IP地址欺骗\n\n软件体系结构策略：\n- 认证系统\n- 网络系统\n- 防火墙\n- 可信内核\n\n## 可用性（Availability）\n\
    \n[定义]: 系统正常运行的时间比例。\n\n- 可靠性——是否能够保证系统正常运行的能力。通过构件技术：\n  - 安全冗余\n  - 备份等\n\n\
    ## 功能性\n\n[定义]: 系统能够完成所期望的工作的能力。\n\n## 可测试性（Testability）\n\n- [定义] 指通过测试使软件暴露出缺陷的容易程度。\n\
    \  - 可观察性\n  - 可控制性\n\n## 直接归属于系统的质量属性\n\n- 不可通过观察系统运行确定的质量属性\n\n| 质量属性 | 体系结构策略\
    \ |\n| --- | --- |\n| 可修改性 | 模块化、封装组件 |\n| 可移植性 | 可移植性层 |\n| 可复用性 | 减少组件的耦合 |\n\
    | 可集成性 | 可复用的交互机制；一致的组件接口； |\n| 可测试性 | 使用关系允许渐进开发；模块化、封装组件； |\n\n## 问题？\n\n- 从设计师的角度看，以上对于系统质量属性的定义没有在下面阐述：\n\
    \  - 不可操作。如果说某个系统是可修改的，这是没有意义的。\n  - 问题讨论的焦点并不在于质量属性不清楚。如系统故障是可用性问题，还是安全性问题，还是易用性问题？\n\
    \n## 为了更好地描述质量属性\n\n- 质量属性场景\n  - 刺激源（Source of stimulus）\n    - 产生刺激的实体（人、物、计算机系统或其他致动器）\n\
    \  - 刺激（Stimulus）\n    - 到达系统并使其需要采取某些动作的条件\n  - 环境\n    - 刺激在某些条件下发生。当刺激发生时，系统可能处于运行、测试或其他状态\n\
    \  - 制品（Artifact）\n    - 受刺激的制品，可以是整个系统，也可以是系统的一部分\n  - 响应\n    - 系统在刺激后所采取的行动\n\
    \  - 响应度量\n    - 当响应发生时，应能够以某种方式对其进行度量，以对其结果进行测试\n\n## 质量属性场景\n\n- 区分：\n  - 一般质量属性场景：独立于系统，很可能适合任何系统的场景。\n\
    \  - 具体质量属性场景：描述适合正在考虑的某个特定系统的场景。\n\n## 质量属性场景\n\n- 质量属性场景的6个部分\n\n![](img/da691714eec1b93795825838a75ee408_6_0.png)\n\
    \n"
