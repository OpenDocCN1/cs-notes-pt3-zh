  - '[PAGE 37]


    # 6. Keep documentation current, but not too current. -2


    +   - Help instill a documentation-based culture in your organization by letting
    up-to-date documents answer questions.

    +     - The first response to a question that a document should answer is, “Here
    is where you can find that in the documentation.”

    +     - If the information is missing, either update or (as the price for giving
    the answer) make the questioner submit a change request form.

    +     - Make sure the next release contains the information.

    +   - This sends a powerful message that the documentation is the preferred, authoritative
    source for information.

    +   - Contrast that to the architect who happily answers questions every time
    the phone rings. The phone will keep on ringing.


    # 6. Keep documentation current, but not too current. -3


    +   - Don’t keep it *too* current:

    +     - During the design process, decisions are considered and reconsidered frequently.

    +     - Revising the documentation every five minutes will result in unnecessary
    expense. Releasing it too often will cause frustration among the readers.

    +     - Determine points in the development process when up-to-date documentation
    will be released.

    +     - Follow a release strategy or rhythm that makes sense for your project.


    # Principles of Sound Documentation


    +   1. Write form the reader’s point of view

    +   2. Avoid unnecessary repetition.

    +   3. Avoid ambiguity.

    +   4. Use a standard organization.

    +   5. Record your rationale.

    +   6. Keep documentation current, but not too current.

    +   7. Review documentation.


    # 7. Review documentation.-1


    +   - Only the intended users of a document can tell you if it:

    +     - Contains the right information

    +     - Presents the information in a useful way

    +     - Satisfies their needs.

    +   - Plan to review your documents with representatives of the stakeholders for
    whom it was created.

    +   - The *active design* review is a good technique to use.


    # 7. Review documentation.-2


    +   - *active design reviews:*

    +     - Avoid a single all-hands meeting

    +     - Use carefully-chosen reviewers

    +     - Ask each reviewer to review a part of the document,……


    Pamas,D.L. and Weiss D. M., 1985, Active design reviews: principles and practices,
    in proceedings of the 8th international conference on Software engineering.


    # Summary


    +   - Certain principles apply to all documentation, not just that for software
    architecture.

    +   - Use them as guidelines to help you write high quality documentation.

    +   - You can also use them when you are reviewing other people’s documentation
    that you wish to help them improve.'
