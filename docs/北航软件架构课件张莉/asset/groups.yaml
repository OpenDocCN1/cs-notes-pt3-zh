    - 全面地把握复杂的系统。\n\n### 为什么要建模\n\n一个形象的比喻：\n\n开发一个具有一定规模和复杂性的软件系统和编写一个简单的程序大不一样。其间的差别，借用\
    \ G. Booch 的比喻，约同建造一座大厦和搭一个狗窝的差别。\n\n### 建一座狗窝\n\n![](img/da691714eec1b93795825838a75ee408_320_0.png)\n\
    \n- Can be built by one person\n- Requires\n  - Minimal modeling\n  - Simple process\n\
    \  - Simple tools\n\n### 建一座房屋\n\n![](img/da691714eec1b93795825838a75ee408_320_1.png)\n\
    \n- Built most efficiently and timely by a team\n- Requires\n  - Modeling\n  -\
    \ Well-defined process\n  - Power tools\n\n### 建一座摩天大楼\n\n![](img/da691714eec1b93795825838a75ee408_321_0.png)\n\
    \n## 什么是UML\n\n- UML是一种标准化的建模语言，它统一了面向对象建模的基本概念、术语及其图形符号，为人们建立了便于交流的共同语言。\n- UML是一种图形化语言，用来详细地描述、可视化地表示一个系统的构建过程，并以文档化的形式记录最终得到的系统产品。\n\
    - UML是用来描述MDA（模型驱动体系结构）的关键标准语言，这些关键标准即UML自身、元对象机制（MOF）以及公共仓库模型（CWM）。UML也用于创建MDA处理的工作结果，尤其是商业和实现模型。\n\
    \n### UML是一种建模语言\n\n- 建模方法 = 建模语言 + 建模过程。建模语言定义了用于表示设计的符号（通常是图形符号）；建模过程描述进行设计所需要遵循的步骤。\n\
    - 标准建模语言UML是一种建模语言，而不是一种方法，它统一了面向对象建模的基本概念、术语及其图形符号，为人们建立了便于交流的共同语言。\n- 建模能力：建模方法\
    \ + 领域知识 + 实践\n\n### 什么是UML\n\n- UML源于 Booch、OMT 和 Objectory 建模语言，在其基础上，集众家之长，几经修改而成。\n\
    \  - 起源可以回溯到数据建模和 SDL（Specification and Description Language，规格说明与描述语言）。\n- 1997年11月，OMG通过了UML\
    \ 1.1版。\n  - 使用最广的版本是2001年5月通过的UML 1.4版。\n- 2003年7月，OMG采纳了UML 2.0规范。\n\n## UML的设计目标\n\
    \nUML的设计目标是：\n\n- 运用面向对象概念，在尽可能简单的同时，对实际需要建立的系统的各个方面建模（不仅是针对软件）\n- 建立起从概念模型直至可执行体之间明显的对应关系\n\
    - 着眼于那些有重大影响的问题\n- 创建一种对人和机器都适用的建模语言\n\n## UML的演化\n\n![](img/da691714eec1b93795825838a75ee408_323_0.png)\n\
    \n### UML2.0\n\n- 改进了体系结构\n- 提供了经过改进的可扩展性\n- 加强了对基于构件的开发的支持\n- 改进了关系建模\n- 分离了状态图和活动图的语义\n\
    - 增强了模型管理\n- 通用机制\n\n![](img/da691714eec1b93795825838a75ee408_325_0.png)\n\n-\
    \ 2013年：启动UML 2.5\n- 目前是UML 2.5 beta2 版本。是在2015年3月发现有两个语法错误，将在2.6版修订。\n\n### UML2.5的目标\n\
    \n- 领导UML 2.5版本任务的主力军是来自微软的架构师 Steve Cook\n- **UML2.5的目标：简单化。** UML本身没有改变。\n-\
    \ 对之前的版本进行了大范围的重写，通过**消除冗余和提升清晰度**来使得它更易读。\n- 没有使用包合并。每个元类都在一个章节内完整地被定义。——**因此，章节是按照元类来组织的。**\n\
    - UML 2.5也为图表和模型的互换，第一次引入了正式规范。——解决不同工具实现之间的互换问题\n\n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_327_0.png)\n\
    \n新增图\n\n- Diagram\n  - Structure Diagram\n  - Behavior Diagram\n\n![](img/da691714eec1b93795825838a75ee408_327_1.png)\n\
    \n## UML2.0简介\n\n- 四层元模型体系结构\n- UML2.0的构成\n- UML2.0的Infrastructure\n- UML2.0的Superstructure\n\
    - 特性描述\n\n### 四层元模型体系结构\n\n| 层 | 描述 | 示例 |\n| --- | --- | --- |\n| 元-元模型（M3） |\
    \ 元模型体系结构的基础结构，定义了规定元模型的语言。 | 元类、元属性、元操作 |\n| 元模型（M2） | 元-元模型的实例，定义了规定模型的语言 |\
    \ 类、操作、构件 |\n| 模型（M1） | 元模型的实例，定义描述某一信息域的语言 | People |\n| 用户对象（数据）（M0） | 模型的实例，定义了特定领域的值。\
    \ | `name_张三` |\n\n事实上，多层体系结构可以有无限多的层次。\n\n![](img/da691714eec1b93795825838a75ee408_329_0.png)\n\
    \n### UML 2.0 构成\n\n- UML 2.0 Infrastructure\n  - UML internals\n- UML 2.0 Superstructure\n\
    \  - User-level features\n- UML 2.0 OCL\n  - Constraint language\n- UML 2.0 Diagram\
    \ Interchange\n  - For exchanging graphic information (model diagrams)\n\n###\
    \ UML2.0\n\n![](img/da691714eec1b93795825838a75ee408_330_0.png)\n\n### Infrastructure\n\
    \nInfrastructure — Defines basic constructs to specify UML and to customize it\
    \ for specific domains (e.g., real-time)\n\n- UML规格说明是通过元模型方法来定义的（也就是，一个元模型用来定义包含UML的模型），这种方法采用了一些形式化的定义技术。\n\
    - 虽然这种方法缺乏一些形式化定义方法的严密性，但是对大多数执行人员和从业者来说，它具有更强的直观性和实效性。\n\nUML元模型遵循以下的设计原则：\n\n\
    - **模块性。** 这一个原则具有高内聚性和低耦合性，可以运用它们把整个结构分为若干包，按照特征组织每一个元类。\n- **层次性。** 层次性以两种方法运用于UML元模型。第一，包的层次结构使元语言核心结构独立于使用它们的高层结构。第二，四层结构的元模型体系结构模式用于隔离各抽象层的关系（尤其是实例化）。\n\
    - **可分区性。** 可分区性用于组织相同层的概念域。对于基础结构库，粒度小的分区用来提供当前和将来元建模标准所需的灵活性。对于UML元模型，为了增强包的内聚力，减弱包的耦合性，分区的粒度较大。\n\
    - **可扩展性。** UML可以以两种方式扩展：\n  1. 通过使用外廓（profile）为专用平台（比如，J2EE/EJB、.NET/COM+）和领域（比如，金融，电信，航空）定制UML语言。\n\
    \  2. 可以通过重用基础结构库中包的部分内容，增加适当的元类和元关系，来描述和UML相关的新语言。\n\n  前者定义了专用的UML，后者定义了UML语言系列中的新成员。\n\
    - **重用性。** 一个细粒度、灵活的元模型库可以用来自定义UML元模型，同时也可以用来定义其他相关的元模型，比如，Meta Object Facility（元对象机制，MOF）和Common\
    \ Warehouse Model（公共仓库模型，CWM）。\n"
