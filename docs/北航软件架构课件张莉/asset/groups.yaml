    # 例2: 剪贴板 (Clipboard)


    剪贴板是一个用来进行短时间的数据存储并在支柱/应用之间进行数据传递和交换的软件进程


    +   - 用来存储和传递信息和交换信息的公共区域形成共享数据仓库);

    +   - 不同的应用程序通过该区域交换格式化的信息;

    +   - 访问剪贴板的方式: copy & paste.


