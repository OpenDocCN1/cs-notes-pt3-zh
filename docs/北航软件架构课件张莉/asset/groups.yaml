    # 为什么要建模


    模型从某个建模观点出发，抓住事物最重要的方面而简化或忽略其他方面。


    # 模型的目的：


    +   - 捕获和精确表达项目的需求和应用领域中的知识，以使全部涉众能够理解并达成一致。\n- 进行系统设计，并使具体的设计细节和需求分开。\n- 生成有用的实际产品。\n-
    组织、查找、过滤、获取、检查及编辑大型系统的有关信息。\n- 经济地研究多种解决方案。\n- 全面地把握复杂的系统。


    # 为什么要建模


    一个形象的比喻：


    开发一个具有一定规模和复杂性的软件系统和编写一个简单的程序大不一样。其间的差别，借用 G. Booch 的比喻，约同建造一座大厦和搭一个狗窝的差别。'
  - '[PAGE 320]


