    # 下面讨论6个最常见的系统质量属性；


    +   - 目的：

    +     — 确定质量属性描述所使用的概念；

    +     — 提供一个为该属性生成一般场景的方法


    # 1、可⽤性（Availability）


    +   - 可用性与系统故障及其相关后果有关。

    +   - 当系统不能就其所承诺的服务时，或出现了系统故障。

    +   - 系统的⽤户（⼈或其它系统）可以感知到此失效情况。


    ![](img/da691714eec1b93795825838a75ee408_8_0.png)


    # 可用性


    +   - 可用性所涉及的方面：

    +     - 如何检测系统故障，

    +     - 系统故障产生的原因，

    +     - 此故障将发生什么样的问题，

    +     - 为保证系统尽可能长时间正常运行，

    +     - 什么时机可以安全地出现故障，

    +     - 如何防止或缓解故障发生，

    +     - 发生故障时如何进行通知等

    +   - 系统出现故障后，一个重要概念

    +     - 恢复所需的时间：从出现故障到用户看不到故障的时间。


    # 可用性


    +   - 系统的可用性：系统正常运行的时间比例。

    +     例如：

    +     “对于生产系统”

    +     可用性标准：至少99.9%的可用性，0.1%的停机率。

    +   - 区分：故障和错误

    +   - 故障和错误的区别为允许自动恢复系统提供了可能。

    +   - 注意：预先定的停止和时间不是故障。


    # 可用性的一般场景生成


    | 场景 | 可能的值 |

    |---|---|

    | 触发 | 系统故障、系统崩溃 |

    | 刺激 | 故障、故障、损坏、错误、情况 |

    | 制品 | 系统的硬件、软件、数据、持久存储、进程 |

    | 环境 | 正常操作、偶发事件 |

    | 响应 | 系统检测到故障，并进行下一个或多个动作

    - 将其记录下来，

    - 通知用户或其它系统，

    - 采取措施恢复系统，

    - 根据其重要性采取不同的措施并通知相关人员 |

    | 响应度量 | 故障检测所需的时间

    - 从出现故障到用户看不到故障的时间

    - 系统在正常模式下运行的时间和时间

    - 恢复时间 |



    # 2、Modifiability（可修改性）


    +   - 可修改性是有着更复杂成本问题。

    +   - 有两个观点：

    +     - 可以修改条件（制品）？你可以说（例如，制造和修理）系统的性能方面，或系统的状态：

    +       - 各种部件的修改，

    +       - 各种部件的修改（例如，制造商、系统用户）

    +     - 系统修改的成本，修改系统与其它系统保持兼容，系统用于各种不同的环境（例如，系统）

    +     - 系统修改的复杂性（例如，可检查，未来的修改等）

    +     - 系统修改（例如制造商、用户）可能发生的修改条件

    +   - 何种修改更重要以及修改设计和实现（系统）？一般来说，修改越小越好，修改越小越好。

    +     - 系统的修改越小越好，修改越小越好。

    +     - 系统的修改越小越好，修改越小越好。

    +     - 系统的修改越小越好，修改越小越好。'
