    \ 提出了多种软件体系结构评估方法，如SAAM、ATAM、CBAM等<br>- 关注由功能性、质量属性、对象系统结构、地理分布等各种因素驱动的软件体系结构设计方法ADD\
    \ (Attribute Driven Design)、Quality Attribute Workshop (QAW)。<br>- 出现了大量关于软件体系结构的书籍和著作。<br>**网站：**<br>http://www.sei.cmu.edu/publications/publications.htm\
