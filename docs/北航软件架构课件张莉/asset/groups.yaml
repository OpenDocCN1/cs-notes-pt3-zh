    \n- 需求捕获阶段主要由6个活动步骤组成：\n  - 创建系统语境图\n  - 创建用例图\n  - 详细描述用例\n  - 捕获其它需求\n  - 编写需求规格说明\n\
    \  - 阶段评审。\n\n"
