    \n# Rational 用户大会 2001\n\n## 基础构造\n\n- 基础构造库提供了更精确的概念基础，以更好的支持 MDA。\n- 基础构造库包括了建立元模型时所用到的核心概念，提供了\
    \ MOF、UML 等语言的共同核心。\n\n![](img/da691714eec1b93795825838a75ee408_336_0.png)\n\n\
    ## 基础构造\n\n- 基础构造由基础构造库来描述。\n- 基础结构包含定义了 UML 的可重用元语言核心与元模型扩展机制。\n  - 元语言核心能够用于制定各种元模型，包括\
    \ UML、MOF 和 CWM。\n  - 基础结构库还定义了一种外廓扩展机制，当某些平台和建模领域不具备元模型建模能力时，利用这种扩展机制可以为这些平台对\
    \ UML 进行定制。\n\n![](img/da691714eec1b93795825838a75ee408_336_1.png)\n\n## 基础构造\n\
    \n- 为了更好的重复使用，核心包被细分为三个子包：抽象包、基础包、构造包。它们都依赖于原子类型包中定义的数据类型。\n- 原子类型包定义了包含若干预定义类型，预定义类型通常用于元模型建模，因此它们不仅用于基础结构本身，而且用于MOF和UML等元模型。\n\
    \n![](img/da691714eec1b93795825838a75ee408_337_0.png)\n\n它们并不是应用领域建模中使用的数据类型。\n\
    \n- 抽象包定义了通用的概念，这些概念用于建立许多建模元素，如类元、注释、泛化和属性。\n- 基础包定义了类元、类、数据类型和包的共同特征；\n- 构造包对抽象包的内容进行精化，构造包的子包创建了可实现的概念，例如类、属性、关联和包等。\n\
    \n## 基础构造库\n\n![](img/da691714eec1b93795825838a75ee408_337_1.png)\n\n# Rational\
    \ 用户大会 2001\n\n## 基础构造\n\n核心包的第二个作用是用来定义用于创建元模型的建模结构。这是通过基础结构库中的元类实例化来实现的。通过MOF对元类进行实例化，而基础结构类定义了一些实际的元素，这些元类用来实例化UML、MOF、CWM中的元素，实际上也是实例化基础结构库自身的元素。\n\
    \n从这个角度考虑，基础结构库具有自我描述功能或者说具有反射性。\n\n## 主要设计思想\n\n将概念细分为概念原语：\n\n- 消除语义重叠。\n- 提供更好的基础，以便精确定义概念和语义\n\
    \n![](img/da691714eec1b93795825838a75ee408_338_0.png)\n\n## 基础构造：行为协调\n\n- 所有行为共用的语义基础\n\
    \  - 行为形式的选择由应用需求驱动\n\n![](img/da691714eec1b93795825838a75ee408_339_0.png)\n\n\
    ## 主要设计思想\n\n取消差异：使不同种类的行为具有相同的基。\n\n![](img/da691714eec1b93795825838a75ee408_339_1.png)\n\
    \n## 主要设计思想\n\n- 关系特化——解决协变性问题，在定义元模型时大量存在（如分类器的定义）。\n\n![](img/da691714eec1b93795825838a75ee408_340_0.png)\n\
    \n## 使用关系特殊化的范例\n\n![](img/da691714eec1b93795825838a75ee408_340_1.png)\n\n## 主要设计思想\n\
    \n- 包含并：\n  - 为共享的概念提供共同的定义，并提供它们根据需要扩展的能力\n\n![](img/da691714eec1b93795825838a75ee408_341_0.png)\n\
    \n## 使用包含并的示例\n\n- 增量式定义概念\n\n![](img/da691714eec1b93795825838a75ee408_341_1.png)\n\
    \n## 上层构造\n\n- UML2.0的UML包\n- 定义了UML的所有绘图元素，这些元素按照它们支持的图的类型排列并分为三类，分别是结构型、行为型、补充型。\n\
    \n## 上层构造\n\n![](img/da691714eec1b93795825838a75ee408_342_0.png)\n\n# Rational\
    \ 用户大会 2001\n\n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_343_0.png)\n\
    \n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_343_1.png)\n\n## 结构型图的介绍\n\
    \n- 表征了模型的静态特征\n  - 包括类和关联、对象和链以及协作\n- 这些静态特征提供了模型的框架，在这些框架里，模型的动态元素得以执行。\n  -\
    \ 类定义了哪种类型的对象所能提供的行为\n  - 关联定义了对象可以参与的关系的类型\n  - 部署图模拟能工作的系统硬件部分（或人）\n  - 构件则定义需要提交给处理器的软件或者过程。\n\
    - 可以显示系统的各个部分以及怎样将它们组装起来，但不能模拟组装后的系统的工作情况。\n\n## UML2.0中的图\n\n![](img/da691714eec1b93795825838a75ee408_344_0.png)\n\
    \n"
