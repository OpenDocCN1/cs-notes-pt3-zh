  - "[PAGE 26]\n\n# Behavioral Patterns （续）\n\n+   - Mediator (273)\n+     - Define\
    \ an object that encapsulates how a set of objects interact. Mediator promotes\
    \ loose coupling by keeping objects from referring to each other explicitly, and\
    \ it lets you vary their interaction independently.\n+   - Memento (285)\n+  \
    \   - Without violating encapsulation, capture and externalize an object's internal\
    \ state so that the object can be restored to this state later.\n+   - Observer\
    \ (295)\n+     - Define a one-to-many dependency between objects so that when\
    \ one object changes state, all its dependents are notified and updated automatically.\n\
    +   - State (305)\n+     - Allow an object to alter its behavior when its internal\
    \ state changes. The object will appear to change its class.\n\n# Behavioral Patterns\
    \ （续）\n\n+   - Strategy (315)\n+     - Define a family of algorithms, encapsulate\
    \ each one, and make them interchangeable. Strategy lets the algorithm vary independently\
    \ from clients that use it.\n+   - Template Method (325)\n+     - Define the skeleton\
    \ of an algorithm in an operation, deferring some steps to subclasses. Template\
    \ Method lets subclasses redefine certain steps of an algorithm without changing\
    \ the algorithm's structure.\n+   - Visitor (331)\n+     - Represent an operation\
    \ to be performed on the elements of an object structure. Visitor lets you define\
    \ a new operation without changing the classes of the elements on which it operates.\n\
    \n# For Every Pattern\n\n+   - Pattern Name and Classification\n+   - Intent（目的）\n\
    +   - Also Known As（别名）\n+   - Motivation（问题的提出）\n+   - Applicability（什么情况下使用）\n\
    +   - Structure（结构）\n+   - Participants（元素）\n+   - Collaborations —How the participants\
    \ collaborate to carry out their responsibilities.\n\n# \n\n+   - Consequences\
    \ —How does the pattern support its objectives? What are the trade-offs and results\
    \ of using the pattern? What aspect of system structure does it let you vary independently?\n\
    +   - Implementation —What pitfalls, hints, or techniques should you be aware\
    \ of when implementing the pattern? Are there language-specific issues?\n+   -\
    \ Sample Code —in C++ or Smalltalk.\n+   - Known Uses\n+   - Related Patterns\
    \ —What design patterns are closely related to this one? What are the important\
