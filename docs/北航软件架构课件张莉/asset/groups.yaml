  - '[PAGE 87]


    # 主程序与子程序风格（续）


    +   • 优点

    +     – 是程序设计语言中最基本的表现形式。几乎所有的程序设计语言都对此提供了支持。并以函数、过程、库、包等形式出现。

    +     – 程序中需要多次执行的代码，可以使用函数或子过程的形式，提高代码的使用率，减少内存的使用。

    +     – 合理地组织子程序和恰当的过程名为软件代码的理解和维护提供方便。

    +   • 缺点

    +     – 难以表达构件间复杂的连接关系。只有过程间的调用关系；

    +     – 软件规模增大时，造成代码可维护性和易理解性变差；

    +     – 可重用层次低。主要是科学计算和数据结构经典算法的重用。


    # 面向对象和抽象数据风格


    +   ◆ 数据及其操作被封装成抽象数据类型(对象)。对象即是构件。

    +   ◆ 连接件通过过程调用（方法）来实现。

    +   ◆ 适用于：

    +     ✓ 以相互关联的数据实体的标识和保护为中心问题的应用程序


    ![](img/da691714eec1b93795825838a75ee408_87_0.png)'
  - "[PAGE 88]\n\n# 面向对象和抽象数据风格\n\n# 面向对象的特点：\n\n+   ➢ **封装**：对象具有信息隐藏特性。对象负责维护本身的内部变量，其内部结构对其它对象不可见。\n\
    +   \n+   ➢ **继承**：指从具有通用特征的对象开始，逐渐定义更具体的对象。新对象的创建可以在继承已有对象定义的基础上，加入其他定义。\n+ \
    \  \n+   ➢ **多态**：指不同类型对象可以对相同的激励适当做出不同的响应。\n\n➢ 数据抽象风格是特殊的00风格，只有封装的特点，没有继承和多态的特点。\n\
    \n# 面向对象风格的优点\n\n+   ➢ 封装：（1）封装提供了可重用性和易修改性；可以在不影响其它客户的情况下修改对象；（2）提供功能独立性。\n+\
    \   \n+   ➢ 继承：支持重用\n+   \n+   ➢ 多态：系统的灵活性和动态性\n+   \n+   ➢ 对象可以是单线程，也可以是多线程\n\
    +   \n+   ➢ 支持问题分解。\n\n# 缺点\n\n+   ➢ 过程调用依赖于对象标识的确定。和管道过滤器风格的系统不同，一个对象必须知道它要与之交互的对象的标识。\n\
    +   \n+   ➢ 不同对象的操作关联性弱。在两个对象同时访问一个对象时，可能引起副作用。\n+   \n+   ➢ 对象的接口一旦改变，所有使用它的其它对象都需要修改。\n\
    \n➢ 例子：CORBA"
