    - 做出构件获取方式的决策，即确定系统中哪些构件需要购买/复用/开发\n- 对大粒度构件进一步进行分解\n- 将构件之间抽象的连接关系具体化\n- 为系统中的开发行为设计实现机制\n\
    - 识别和完善构件接口，采用严格的规格说明对接口操作进行定义\n"
  mdcn: "\n\n## 开发结构\n\n开发结构是建立在经验、对相关应用领域及软硬件技术的深入了解基础之上的。在创建开发结构的过程中，各子系统的设计人员应充分交流，以便彼此互相借鉴。\n\
    \n当不需要考虑重用、信息隐藏、开发性等内部需求时，开发结构与逻辑结构可以存在一一映射的关系。尽管如此，还是建议单独建立一个开发视图，以便于保留逻辑层次的设计结果。\n\
    \n## 行为描述\n\n采用与逻辑行为相似的方法，以开发中定义的各个元素为参与对象，描述它们如何通过相互协作，完成用例中的功能。在开发视图中描述用例的实现时，建议采用顺序图，因为这时我们更关心消息的先后顺序。\n\
    \n但是，开发视图中的行为描述可以不仅仅局限于用例实现，当某个模块的行为比较复杂时，也可以用状态图来详细对其行为进行刻画。\n\n## 行为细化\n\n![](img/da691714eec1b93795825838a75ee408_247_0.png)\n\
    \n## 内部接口关系\n\n在对各模块的行为有了深入了解之后，经过整理创建详细的接口关系图，以说明每个模块提供哪些接口和要求哪些接口。提供的接口指该模块必须实现的接口，通过在类或包之间建立实现关系来表示；要求的接口指该构件为完成其功能而需要其它模块必须提供的接口。对这些接口都进行说明，使得我们可以明确地表示出每个模块与外部环境的依赖关系，从而提高了模块的独立性。\n\
    \n![](img/da691714eec1b93795825838a75ee408_247_1.png)\n\n## 渐进式的迭代过程\n\n- **4个视图**\n\
    \  - 逻辑视图\n    - 逻辑结构：包图、类图\n    - 行为描述：交互图（顺序图和协作图）、状态图\n  - 并发视图：\n    - 活动图、交互图、状态图（时序图—时间限制）\n\
    \  - 开发视图\n    - 开发结构：包图、类图\n    - 行为描述：交互图（顺序图和协作图）、状态图\n    - 内部接口关系\n  - 构件视图：构件图\n\
    \  - 部署视图：部署图\n\n![](img/da691714eec1b93795825838a75ee408_248_0.png)\n\n## 构件视图\n\
    \n构件视图主要说明系统开发完成后将得到哪些软件制品，即最终系统将生成哪些Exe、dll或其它，并在必要时表明其间的依赖关系。在系统开发之前构件视图的主要作用是对系统最终将开发的软件制品进行的规划，作为软件打包的指导策略。在系统开发完成后，应根据实际情况进行修改，以反映实际的打包结果，为系统产品的配置管理提供依据。构件视图通过UML的构件图来描述，面向系统配置管理人员。\n\
    \n![](img/da691714eec1b93795825838a75ee408_249_0.png)\n\n## 部署视图\n\n部署视图主要描述系统的硬件拓扑结构，以及软件制品在硬件设备上部署后的情况，即描述系统中存在哪些硬件设备，它们如何相互连接，软件制品在硬件设备上如何部署。主要面向系统集成人员和维护人员。\n\
    \n## 如何采用UML进行软件体系结构设计\n\n![](img/da691714eec1b93795825838a75ee408_250_0.png)\n\
    \n## 系统硬件及软件配置列表\n\n| 系统名称 | 系统编号 | 硬件名称 | 硬件标识 | 类型 | 数量 | 选择网络 | 软件配置项 | 软件配置项标识\
    \ | 功能 | 备注 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 速度模拟系统 | ZL3 |\
    \ 指挥台模拟器 | H2.06.1 | 多功能控制台 | 6台 | 作战系统网络 | 指挥设备控制台软件载荷软件 | S2.06 | 模拟指挥设备的动作、实现指挥员对某项任务的完成情况的显示。\
    \ | 配置固定设备2个、机动设备3个 |\n|  |  |  | H2.18.1 | PC | 6台 | 作战系统网络 | 指挥设备单机版软件载荷软件 |\
    \ S2.18 | 模拟指挥设备功能。 |  |\n|  |  | 载弹台模拟器 | H2.06.3 | 多功能控制台 | 5台 | 作战系统网络 | 指挥设备控制台软件载荷软件\
    \ | S2.06 | 模拟载弹台的动作。 |  |\n|  |  |  | H2.18.3 | PC | 5台 | 作战系统网络 | 指挥设备单机版软件载荷软件\
    \ | S2.18 | 模拟载弹台功能。 |  |\n|  |  | 数据库模拟器 | H2.12 | PC | 4台 | 作战系统网络 | 数据库载荷软件\
    \ | S2.12 | 存储指挥系统内部各类数据库信息及相关数据库查询的软件。 |  |\n|  |  | 时间设备 | H2.21 | PC | 4台 |\
    \ 作战系统网络 | 时间模拟软件 | S2.21 | 模拟时间信息发送。 | 固定单点2个 |\n|  |  | 信号传输模拟器 | H2.20 | PC\
    \ | 6台 | 信号传输网络系统 | 信号传输软件 | S2.20 | 实现模拟网内各点间的信号传输的点对点发送。 | 机动单点1个 |\n\n## 软件体系结构渐进设计过程\n\
    \n我们的一项研究\n（2005年的一篇博士论文）\n\n### 问题的提出——软件构架设计过程\n\n- 软件构架设计是复杂的，不能一蹴而就地完成\n\n\
    ![](img/da691714eec1b93795825838a75ee408_251_0.png)\n\n### 问题1\n\n- 至今关于软件构架渐进设计过程具体实施步骤的定义仍然比较模糊\n\
    - 软件构架设计主要由设计师依靠自身的经验和直觉进行\n- 软件构架设计带有很大的随机性\n- 软件构架设计过程难以被重用，难以获得持续不断的改进\n\n\
    如何采用UML进行软件体系结构设计\n\n- 软件需求\n- 软件构架概略设计\n- 软件构架早期评审\n- 软件构架概要模型\n- 软件构架细化\n- 软件构架中期评审\n\
    - 软件构架定义模型\n- 软件构架向实现过渡\n- 软件构架后期评审\n- 可执行软件构架\n\n弹性的、可以根据项目规模划分层次\n\n### 软件体系结构渐进设计的基本思想\n\
    \n- 将整个软件构架设计过程划分为若干阶段\n- 保证软件构架设计可以由粗略到详细逐步推进\n- 减小设计的难度、复杂度以及风险\n\n- 明确定义每一阶段的实施步骤\n\
    - 整个设计过程更为透明化\n- 更容易被理解和实施\n\n- 为每个阶段设置明确的结束准则\n- 组织对软件构架的阶段性评审，以有利于问题的及早发现和解决\n\
    - 而不仅仅是在整个设计完成后才一次性进行分析和验证\n\n- 每一阶段对软件构架模型描述采用相似的核心概念\n- 减少各阶段设计结果之间的语义隔阂\n-\
    \ 保证各阶段之间可以进行平滑的过渡\n\n## 软件构架概略设计\n\n如何采用UML进行软件体系结构设计\n\n### 主要目的\n\n- 构建一个包含较少细节的初始软件构架模型\n\
    - 在深入软件构架设计工作之前，使各相关人员可对系统的高层结构产生一个大致的了解\n- 以便对系统能够满足各种软件构架需求的潜在可能性做出初步评价\n\n\
    ### 设计重点\n\n- 识别软件构架设计策略\n- 对系统的结构进行分解，功能进行分配\n- 说明控制和数据在构件间传递\n\nSAS建模语言示例\n\n\
    SAS模型示例\n\n![](img/da691714eec1b93795825838a75ee408_253_0.png)\n\n![](img/da691714eec1b93795825838a75ee408_253_1.png)\n\
    \n## SAS设计的具体实施步骤\n\n- 步骤1：识别软件架构需求\n  - 架构级重要用例\n  - 架构级重要质量属性\n- 步骤2：识别候选软件架构设计策略\n\
    - 步骤3：软件架构设计策略的权衡和取舍\n- 步骤4：创建软件架构概要模型\n  - 步骤4.1：结构设计\n  - 步骤4.2：行为描述\n\n## 软件架构早期评审\n\
    \n### 评审时机\n\n- 获得软件架构概要模型之后\n\n### 评审目的\n\n- 对系统满足功能和质量需求的潜在可能性做出评价\n- 不是精确预测系统的行为和质量指标\n\
    - 识别软件架构的设计风险\n- 对某些重要问题还没有做出决策\n- 虽然对问题做出了决策但对决策的后果还不清楚\n\n### 评审手段\n\n- 基于提问的方法（Checklist、场景）\n\
    - 功能需求的满足可通过用例分析来实现\n- 质量需求的满足可采用SAAM、ATAM等方法通过质量场景来验证\n\n## 软件构架早期评审 Checklist\n\
    \n- 所有软件构架需求都得到识别；\n- 不存在代价太大而难于实现的需求；\n- 软件构架覆盖了所有软件构架需求，即设计中不存在对重要设计问题的遗漏；\n\
    - 系统中所有关键构件及其间主要的连接关系都已被识别出来；\n- 模型中每个构件都有一个名称和一个反映其在系统中作用的功能描述；\n- 每个构架级重要的用例至少有一个交互图来反映该用例代表的功能如何得到满足；\n\
    - 针对每一个构架级重要的质量属性，能说明构架设计中为满足这一质量属性所采取的机制，包括相关的构件、连接件或约束；\n- 用于实现该构架的所有技术都是可行的，即该构架在实现上不存在无法克服的技术风险。\n\
    \n## 软件构架细化\n\n![](img/da691714eec1b93795825838a75ee408_255_0.png)\n\n### 主要目的\n\
    \n- 对SAS模型进行细化（SAD模型）\n- 以更严格的形式对软件架构作出定义\n- 为系统的开发和组装提供所需的约束信息\n\n### 设计重点\n\n\
    - 做出构件获取方式的决策，即确定系统中哪些构件需要购买/复用/开发\n- 对大粒度构件进一步进行分解\n- 将构件之间抽象的连接关系具体化\n- 为系统中的开发行为设计实现机制\n\
    - 识别和完善构件接口，采用严格的规格说明对接口操作进行定义\n\n"
