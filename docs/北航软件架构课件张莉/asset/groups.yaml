    \  - ATAM等方法\n- 基于体系结构的软件开发方法\n  - 引入体系结构的开发过程\n  - 中间件技术集成\n  - 基于体系结构的程序框架自动生成技术\n\
    \  - 软件产品线\n  - MDA, MDE\n\n## 软件体系结构研究领域（续）\n\n- 面向特定领域的软件体系结构研究\n- 软件体系结构自身的演化、逆向构造等\n\
    - 自适应体系结构、智能体系结构\n- 软件体系结构度量、坏味道\n- 系统重构reconstruction、refactoring\n\n## 关于UML的思考\n\
    \n### 静态建模机制\n\n- 类图 (class diagram)\n- 用例图 (use case diagram)\n- 对象图 (object\
    \ diagram)\n- 构件图 (component diagram)\n- 配置图 (deployment diagram)\n\n### 动态建模机制\n\
    \n- 活动图 (activity diagram)\n- 顺序图 (sequence diagram)\n- 合作图 (collaboration diagram)\n\
    - 状态图 (state diagram)\n\n## UML2.0、2.5\n\n![](img/da691714eec1b93795825838a75ee408_168_0.png)\n\
    \n新增：组合结构图，包图，交互概览图，时间图\n\n## 调查\n\n- A: 没学过UML\n- B: 学过UML，后来没用过\n- C: 学过并使用过UML\n\
    - D: 学过UML，了解MOF\n\n![](img/da691714eec1b93795825838a75ee408_169_0.png)\n\n##\
    \ 软件体系结构相关的研究团体/机构及领军人物\n\n| 领军人物 | 研究团体/机构 | 主要研究内容及成果 |\n|---|---|---|\n| Barry\
    \ Boehm | Center for Software Engineering at University of Southern California\
    \ (CSE USC) | 该中心由Barry Boehm于1993年创建，主要从事大型系统设计和开发过程、通用以及特定领域软件体系结构、软件工程工具和环境的研发及教学工作。在软件体系结构方面，该研究组侧重于研究软件体系结构在整个软件生命周期中的作用，包括：软件体系结构设计、建模和细化、视图集成和一致性检查、软件体系结构描述语言与UML的集成、特定领域软件体系结构。<br>网址：http://sunset.usc.edu/about_center/index.html\
    \ |\n| Richard N. Taylor | Institute of Software Research (ISR) at University\
    \ of California, Irvine | 该研究组主要研究C2风格的软件体系结构的设计、描述、动态演化以及支持工具的开发，定义了软件体系结构描述语言C2、xADL，并在ADL的分析、比较以及与UML的融合方面做了大量研究工作。<br>网址：http://www.isr.uci.edu/architecture/index.html\
    \ |\n| Len Bass, Rick Kazman, Paul Clements | Software Engineering Institute,\
    \ Carnegie Mellon University | 该研究组重点关注对软件体系结构开发和评审技术、以及软件产品线技术的研究，提出了多种软件体系结构评审方法，如SAAM、ATAM、CBAM等，主要关注非功能属性（质量属性）对体系结构的影响，提出了属性驱动的软件体系结构设计方法ADD（Attribute\
    \ Driven Design）、Quality Attribute Workshop（QAW）。这一研究组出版了大量关于软件体系结构的书籍和著作。目前，该研究组正在致力于将其软件体系结构方面的研究成果集成到一些较流行的软件开发过程方法中，如RUP、XP等。<br>网址：http://www.sei.cmu.edu/publications/publications.html\
    \ |\n| David Garlan, Mary Shaw | Composable Systems Group, School of Computer\
    \ Science, Carnegie Mellon University | Garlan和Shaw对软件体系结构研究有非常重要的推动作用，他们的合著“Software\
    \ Architecture: Perspectives on an Emerging Discipline”成为软件体系结构领域被引用最多的著作之一。该研究组在软件体系结构研究方面处于较为领先的地位，其研究内容较为广泛，包括：软件体系结构基础理论、描述语言（Aesop、Wright、Unicon、ACME）及支持工具（Aesop、AcmeStudio）、软件体系结构风格理论、软件体系结构风格整理和分类、软件体系结构学科教育和培训、动态软件体系结构、软件体系结构细化、以及软件体系结构适用文档化技术等。网址：http://www-2.cs.cmu.edu/~able/\
    \ |\n| David Luckham | Program Analysis and Verification Group, Department of\
    \ Electrical Engineering, Stanford University | 该研究组主要侧重基于事件的、复杂、并发、分布式系统的软件体系结构设计和描述研究，定义了软件体系结构描述语言Rapide。\
    \ |\n| 唐稚松 | 中国科学院软件研究所计算机科学重点实验室 | 在软件体系结构方面的主要研究成果包括软件体系结构描述语言XYZ/ADL和软件体系结构细化方法等。\
    \ |\n| 杨芙清，梅宏 | 北京大学信息科学技术学院软件工程研究所 | 该研究机构从事的研究方向主要包括软件工程基础理论、软件复用技术、面向对象方法与技术等。在软件体系结构方面的主要研究成果包括基于消息总线的软件体系结构风格及描述语言，基于软件体系结构的可复用构件制作和组装技术，基于体系结构、面向构件的软件开发方法ABC及支持工具（ABCTool、PKUAS），以及运行时软件体系结构等。网址：http://sei.pku.edu.cn\
    \ |\n\n## 工业界的关注点：建议有2-3个团队\n\n- 中国系统架构师大会（2018 第十届）\n  - IT168旗下ITPUB企业社区平台主办，2009年第一届\n\
    - ArchSummit 全球架构师峰会。\n  - （主办：北京极客邦科技有限公司）两年一次？\n- 全球软件架构技术大会\n  - 贵！！2000-8000元，一般会有培训\n\
    \n服务架构、智慧云架构、云平台架构、大数据系统架构、大数据平台架构设计、高可用与高可靠、分布式架构、行业案例、架构设计与演化、数据库架构设计的前世今生、区块链、高可用业务架构设计。\n\
    \n## 第二页综述模板\n\n| 领军人物 | 研究团体/机构 | 主要研究内容及成果 | 代表性成果 |\n|---|---|---|---|\n| Len\
