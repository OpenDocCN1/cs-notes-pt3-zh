  - '[PAGE 33]


    # Software Architecture: Principles and Practices

    Documenting Software Architectures


    孙君 教授

    北京计算机学院

    软件工程研究所

    lily@...edu.cn


    # Module Objectives


    This module will familiarize participants with


    +   - Architectural views and how they are used to document software architectures

    +   - Various types of views, why they are useful, and when to use them

    +   - Notations often used to describe architectures

    +   - What a software architecture document should contain


    # Why Document an Architecture?


    +   - Architecture serves as the blueprint for the system and the project that
    develops it.

    +     - It defines the work assignments.

    +     - It is the primary carrier of quality attributes

    +     - It is the best artifact to early analysis

    +     - It is the key to post-deployment maintenance and mining.

    +   - This blueprint must be understand if it is to be used. It must be communicated
    if it is to be understand.

    +   - Documentation speaks for the architect, today, tomorrow, and 20 years from
    now.


    # Architecture Documentation Also Helps the Architecture Process


    +   - Documentation enables an artifact-driven approach to software design

    +     - Completing the artifact means we''ve completed the design task.

    +   - Documentation enables the set of design decisions that must be made along
    the way to establishing/maintaining the architecture.

    +   - Documentation also clarifies the line between architectural and non-architectural
    design decisions.

    +     - Non-architectural design is the term preferred over detailed design. Architectural
    decision can be quite detailed.

    +     - Architectural decision are those that affect the system''s ability to
    deliver on its behavioral and quality goals.


    # So, How do You document a software Architecture?


    In practice, the answer seems to be


    +   - "use UML"

    +   - "use JavaDoc"

    +   - "What else do I need besides my Rose class diagrams?"

    +   - "Draw boxes and lines"

    +   - "Not very well"

    +   - "We usually don''t"

    +   - "How do you document a what?"


    # Goals


    The goals for this course are to


    +   - Help you decide what information about an architecture should be captured

    +   - Provide guidelines and notations for capturing the necessary information,
    and examples for it

    +   - Answer this question: "How do you record architectures so that others can
    successfully use, maintain, and evolve them? How do you build a system from it?"

    +   Note that by "document" we do not necessarily mean information printed on
    paper'
