    # 区分几个概念


    +   - **An architecture style** is a description of component types and a pattern
    of their runtime control and /or data transfer.

    +     - Example: client-server is an architecture style. Countless architectures
    are of the client-server style as we have defined, but this architectures are
    different from each other. An architecture style is not an architecture, but it
    still conveys a useful image of the system.

    +   - **A reference model** is a division of functionality together with data
    flow between the pieces.

    +     - a standard decomposition of a known problem into parts that cooperatively
    solve the problem.

    +   - **A reference architecture** is a reference model mapped onto software components(that
    will cooperatively implement the functionality defined in the reference model)
    and the data flows between the components.


