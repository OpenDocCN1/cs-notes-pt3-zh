    # VAML中的核心概念


    +   - **构件**

    +     - 构件指系统中负责进行计算或数据存储的单元

    +   - **连接件**

    +     - 连接件是对构件之间通信、协调和合作机制的一种抽象

    +   - **接口**

    +     - 接口是对一组公共特征和职责的声明

    +   - **构架配置**

    +     - 构架配置用于定义构件和连接件实例互相连接构成的系统的拓扑结构

    +   - **协作**

    +     - 协作是对构件之间交互场景的描述

    +   - **细化映射**


    # 实现手段


    +   - VAML的定义通过对UML2.0进行扩展来实现

    +   - UML2.0具有很多可作为软件构架建模语言的潜在优势

    +     - 作为一种标准建模语言，已为广大开发人员所熟知

    +     - 本身已具备了软件构架建模的部分支持能力

    +     - 设计结果与开发过程的其它阶段更容易衔接'
  - "[PAGE 262]\n\n# UML2.0软件构架建模能力分析\n\n# ◆ 构件建模能力\n\n+   ➢ 已具有丰富的语义来表示软件构架设计中构件的概念\n\
    +   \n+   ➢ UML2.0中Component是一个“大而全”的通用构件，包含了各个阶段建模所需的信息，没有针对不同设计阶段的需要给出关于构件语义的不同约束\n\
    +   \n+   ➢ 容易造成不同阶段的设计信息相互混杂，或在设计早期就陷入对细节信息的关注\n\n# ◆ 连接件建模能力\n\n+   ➢ UML2.0新增了Connector元类来建模连接件，区分为委托连接件和装配连接件\n\
    +   \n+   ➢ UML2.0中Connector只是一种特征(Feature)，而不是一个独立的实体\n\n# UML2.0软件构架建模能力分析（续）\n\
    \n# ◆ UML2.0行为建模能力\n\n+   ➢ 顺序图、通信图、交互概览图、时序图、状态机和活动图\n+   \n+   ➢ 顺序图用于描述多个构件为完成某一功能而进行的相互协作\n\
    +     - 用以检验构件之间的控制流程是否合理\n+     - 用来辅助设计人员识别和捕获构件的潜在职责或接口需求\n+   \n+   ➢ 状态图主要用于在不限制任何特定行为为实现技术的条件下，强化构件、连接件、端口、接口等的合法使用场景\n\
    \n# ◆ 架构配置建模\n\n+   ➢ 用组装连接件来表示构件之间的装配关系"
