    # 软件体系结构是系统分析和设计的高层重用


    +   - 在需求和代码之间起到桥梁作用。理想情况，体系结构设计为整个系统提供了易驾驭的、知识性的指导。\n- 易理解：抽象，简化对大型系统的理解，考虑重要问题。\n-
    重用：支持多种重用，构件、体系结构的重用。\n- 构造：定义构件和构件之间关系，为开发提供蓝图。\n- 演化：能够指出系统演化的方向\n- 分析：包括对系统连接性检查、体系结构风格约束的一致性检查、质量属性一致性检查、依赖性分析，对于构建在特殊体系结构风格上的体系结构领域特定分析等。\n-
    管理：经验证明，成功的项目规划往往将合理可行的体系结构看成是软件开发过程的关键里程碑。某个软件体系结构的成熟性评估，将导致对需求、实施策略和潜在危机的清晰而深入的认识。\n-
    交流：是风险承担者之间进行的手段。


