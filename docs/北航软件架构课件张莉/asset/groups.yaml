  - '[PAGE 39]


    # Module Views


    Views: Decomposition, Uses, Layers, Generalization...


    Elements: modules, where a module is a code unit that implements some functionality


    Relation: Relations among modules can be


    +   - A "is part of" B. This defines a part-whole relation among modules.

    +   - A "depends on" B. This defines a dependency relation among modules.

    +   - A "is a" B. This defines specialization and generalization relations among
    modules.


    # What Are Module Views Used for?


    +   - Construction: These views are the blueprints for the code. Modules are assigned
    to teams for implementation and are often the basis of for subsequent design (e.g.,
    of interfaces).

    +   - Analysis: Traceability and impact analysis rely on implementation units.
    Project management, budgeting, planning, and tracking often use modules.

    +   - Education: A software developer can learn the development project''s structure
    by understanding module views.


    # Notation for Module Views


    +   - Informal:

    +     - box and line (nesting can represent "is part of")

    +     - textual outline

    +     - table

    +   - Semi-formal:

    +     - UML class diagrams and package diagrams


    # Five Styles in the Module Viewtype


    +   - Decomposition style: documents how system responsibilities are partitioned
    across modules and how those modules are decomposed into submodules

    +   - Uses style: tells the developer what other modules must exist for this portion
    of the system to work correctly.

    +   - Generalization style: documents the "is a" relations among elements of the
    system.

    +   - Layered style: documents the "allowed to use" relations among elements of
    the system.

    +   - Aspect style: modules crossing concerns in object-oriented designs.


    # Decomposition style


    +   - Elements: modules

    +   - Relations:

    +     - "is part of" Criteria for decomposition vary:

    +       - Achievement of modifiability

    +       - Build vs. buy

    +       - Software product lines: common vs. unique parts

    +       - Developer''s skills

    +   - Topology: A child can have only one parent.

    +   - What it''s for:

    +     - Starting point for assigning responsibilities to modules as a prelude
    to subsequent, downstream design.

    +     - Change/impact analysis

    +     - Basis for work assignments

    +     - Basis for unit testing


    # Example 1: Module Decomposition View in UML


