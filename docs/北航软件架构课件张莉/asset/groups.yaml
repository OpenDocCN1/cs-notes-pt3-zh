  - '[PAGE 35]


    # Avoid Unnecessary Repetition


    +   - Each kind of information should be recorded in only one place.

    +   - This makes documents easier to use and easier to change.

    +   - Repetition often confuses the reader, especially when information is repeated
    in slightly different ways. The reader is left to wonder

    +     - "Was the difference intentional? If so, why?"

    +     - "If not, which way is correct?"


    # Principles of Sound Documentation


    +   1. Write form the reader''s point of view

    +   2. Avoid unnecessary repetition.

    +   3. Avoid ambiguity.

    +   4. Use a standard organization.

    +   5. Record your rationale.

    +   6. Keep documentation current, but not too current.

    +   7. Review documentation.


    # 3. Avoid ambiguity (避免歧义) -1


    +   - Documentation is for communicating information and ideas. If the reader
    misunderstands because of ambiguities, the documentation has failed.

    +   - Precisely defined notations/languages help avoid ambiguity

    +   - If you documentation uses a graphical language, always include a key. The
    key should

    +     - Point to the language''s formal definition, or

    +     - Give the meaning of each symbol (don''t forget the lines!). If color or
    position is significant, define it.

    +   - Make the key meaningful. Don''t just say "element" and "relation". Different
    element/relation types should have different symbols.


    # 3. Avoid ambiguity (避免歧义) -2


    +   - Box-and-line diagrams are a common form of architectural notation.

    +   - But what do they mean?

    +   - If you use a box-and-line diagram, always define precisely what the boxes
    and lines mean.

    +   - If you see a box-and-line diagram, ask the owner what it means. The result
    is usually entertaining.

    +   - If you document contains known ambiguities, mark them so the can be resolved
    later.


    # Principles of Sound Documentation


    +   1. Write form the reader''s point of view

    +   2. Avoid unnecessary repetition.

    +   3. Avoid ambiguity.

    +   4. Use a standard organization.

    +   5. Record your rationale.

    +   6. Keep documentation current, but not too current.

    +   7. Review documentation.


    # 4. Use a standard organization.-1


    +   - Establish it, make sure that your documents follow, and make sure that readers
    know what it is.

    +   - A standard organization

    +     - Help the reader navigate and find information.

    +     - Help the writer place information and measure the work left to be done.

    +     - Lets the writer record information as soon as it is known, in whatever
    order it is discovered

    +     - Embodies completeness rules and helps with validation'
