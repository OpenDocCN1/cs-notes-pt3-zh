    # 处理用例间的关系


    +   ☑ 扩展关系中基用例并不知道子用例的存在，而是通过扩展点描述了可扩展的行为接口，由子用例去实现这些扩展点

    +     ◆ 对于用例分析来说，扩展关系中的基用例实现定义并使用指定的接口来描述其所需要的行为

    +     ◆ 相应地，其子用例实现则是来实现这些接口所描述的行为


    +   ☑ 扩展关系的具体分析过程如下所示：

    +     ◆ 为基用例的每一个扩展点定义一个边界类；该边界类是一个系统接口类，描述了基用例所需扩展行为

    +     ◆ 针对每一个扩展用例，以该边界类的职责作为启动消息，分析职责的内部实现'
