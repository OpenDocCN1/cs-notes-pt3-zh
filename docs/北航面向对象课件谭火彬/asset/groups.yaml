    # 保持类职责的一致性


    从每个用例实现中发现类的职责，之后，要从系统整体角度定义类的职责


    +   - 跨类的职责冗余

    +   - 类中的互不相干职责

    +   - 一个职责的类

    +   - 没有职责的类

    +   - 行为的更佳分配

    +   - 与许多其它类交互的类'
