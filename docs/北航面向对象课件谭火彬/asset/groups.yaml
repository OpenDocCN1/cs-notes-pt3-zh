  - '[PAGE 411]


    # ☑ **LSP(The Liskov Substitution Principle, Liskov替换原则)**


    +   ◆ “若对于类型S的任一对象o₁，均有类型T的对象o₂存在，使得在T定义的所有程序P中，用o₁替换o₂之后，程序的行为不变，则S是T的子类型”


    +   ◆ 如果在任何情况下，子类（或子类型）或实现类与基类都是可以互换的，那么继承的使用就是合适的。为了达到这一目标，**子类不能添加任何父类没有的附加约束**


    +   ◆ “子类对象必须可以替换基类对象”'
