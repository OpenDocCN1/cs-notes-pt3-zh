    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_431_0.png)'
  - '[PAGE 432]


    # 解决方案：分离接口


    +   ☑ 使用委托分离接口：**Adapter模式**

    +   ☑ 使用多重继承(实现)分离接口


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_432_0.png)'
