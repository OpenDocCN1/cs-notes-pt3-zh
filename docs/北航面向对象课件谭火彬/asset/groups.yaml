    # 设计模式相关术语


    +   - ☑ 设计模式 vs 模式

    +   - ☑ 设计模式 vs 设计原则

    +   - ☑ 设计模式 vs 软件体系结构

    +   - ☑ 设计模式 vs 习惯用法'
  - '[PAGE 486]


    # 设计模式 vs 模式


    +   - 模式的含义更广，可用于各类背景

    +     - 设计模式是一种模式

    +     - 除设计模式外，在软件领域还有其他的模式

    +       - 分析模式、组织模式、过程模式、领域模式


    +   - 设计模式是关于面向对象设计微结构的模式

    +     - 这种微结构又称为对象结构

    +     - 微结构指对象及其类之间的静态或动态关系'
  - '[PAGE 487]


    # 设计模式 vs 设计原则


    +   ☑ 设计原则是面向对象设计的指导思想

    +     ◆ 设计模式只是更好地遵循这一指导思想的手段之一

    +   ☑ 设计模式是面向对象设计的具体技术

    +     ◆ 设计模式抽象出成功设计的共性，并进行分类与标识

    +     ◆ 设计模式通过描述对象、协作和职责将设计中的意图抽取出来'
  - '[PAGE 488]


    # 设计模式 vs 软件体系结构


    +   - 软件体系结构所研究的对象粒度更大

    +     - 软件体系结构可以是为单个应用而设计

    +     - 设计模式通常是为了多个软件产品的生产线而设计


    +   - 某些专家也将软件体系结构看作抽象层次更高的模式

    +     - 体系结构模式（宏模式）、设计模式（微模式）与习惯用法三个层次'
  - '[PAGE 489]


    # 设计模式 vs 习惯用法


    ☑ 习惯用法（idiom）所讨论的对象粒度更小


    +   - 习惯用法通常是与特定的程序设计语言有关

    +   - 设计模式通常只与特定的程序设计方法有关


    ☑ 习惯用法可看作抽象层次更低的模式'
