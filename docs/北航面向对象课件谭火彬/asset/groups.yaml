  - '[PAGE 174]


    # 开发过程解析


    +   - 业务建模：用软件建模方法描述业务流程；其目标是认识业务本质，该业务本质是后续用例建模的基础

    +   - 用例建模：采用UML用例建模技术描述软件需求，该需求模型将为后续用例分析提供输入

    +   - 用例分析：采用UML用例分析技术分析软件需求，建立软件系统的分析模型

    +   - 架构设计：在系统的全局范围内，以分析模型为基础，设计系统的架构

    +   - 构件设计：根据架构设计的成果，将分析模型细化，设计系统构件的实现细节

    +   - 代码实现：将系统构件映射到目标语言上'
