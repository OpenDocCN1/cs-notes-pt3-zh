    # 指南：名词筛选法识别实体类


    名词筛选法识别实体类的基本思路：


    +   - 将用例文档作为输入，找出文档中的名词或名词性短语，形成了实体类初始候选列表

    +   - 合并那些含义相同的名词

    +   - 删除那些系统不需要处理的名词

    +   - 删除作为参与者的名词

    +   - 删除与实现相关的名词

    +   - 删除那些作为其它实体类属性的名词

    +   - 对剩余的名词，综合考虑它在当前用例以及整个系统中的含义、作用以及职责，并基于此确定合适的名字，作为初始实体类存在'
