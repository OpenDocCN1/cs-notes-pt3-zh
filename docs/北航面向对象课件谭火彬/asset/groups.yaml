    # 远景说明


    远景可以作为一个单独的文档存在，而这其中最重要的部分就是关于远景目标的说明，它建立了一个项目涉及的所有人的共同目标


    远景说明应该是精确、清晰和激励性的描述，以便激励所有的团队成员为达成该远景而努力。一个好的远景应该具有以下五个特点(SMART):


    +   - 具体的（Specific）

    +   - 可测量的（Measurable）

    +   - 可实现的（Achievable）

    +   - 相关的（Relevant）

    +   - 基于时间的（Time-based）'
