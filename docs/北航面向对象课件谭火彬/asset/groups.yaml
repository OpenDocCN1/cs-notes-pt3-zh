    if (e != null && e.isTimeToPay(today))\n    e.pay();\n```\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_533_0.png)\n\
    \n```java\nEmployee e = DB.getEmployee(\"Bob\");\nif (e.isTimeToPay(today))\n\
    \    e.pay();\n```\n\n## 内容安排\n\n- ☑ 模式基础\n- ☑ 设计模式\n- ☑ GoF设计模式及应用\n- ☑ GRASP职责分配模式\n\
