    \ 起点：只有离开的转移\n  - ◆ 终点：只有进入的转移\n  - ◆ 存在从起点出发，到达终点的路径\n- ☑ 活动和动作\n  - ◆ 有进有出\n\
    \  - ◆ 动宾结构\n  - ◆ 可以简单，可以复杂\n- ☑ 分区\n  - ◆ 定义活动的负责人\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_195_0.png)\n\
    \n## 细说活动图(2)\n☑ 控制流\n- ◆ 向外转移的条件之和必须是完备集\n- ◆ 向外转移的条件之间不能重叠\n☑ 决策点\n- ◆ 注意和流程图的区别\n\
    - ◆ 误把活动当决策\n- ▸ 图中判断“技术可行性”需要单独的活动来完成\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_196_0.png)\n\
    \n## 细说活动图(3)\n- ☑ 并发(concurrent)\n- ☑ 同步条(synchronization bar)的分叉(fork)与合并(join)\n\
    - ◆ 有分必有合\n- ◆ 有分必有进\n- ◆ 有合必有出\n- ◆ 并发≠同时\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_197_0.png)\n\
