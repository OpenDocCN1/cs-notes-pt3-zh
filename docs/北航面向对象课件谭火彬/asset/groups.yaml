  - '[PAGE 83]


    # The UML


    +   - ☑ UML — You Must Learn

    +   - ☑ UML — Unified Modeling Language

    +   - ☑ UML是一种标准的图形化建模语言，是面向对象分析与设计的标准表示，它：

    +     - 不是一种可视化的程序设计语言，而是一种可视化的建模语言(用于分析设计)

    +     - 不是工具或知识库的规格说明，而是一种建模语言规格说明，是一种表示的标准

    +     - 不是过程，也不是方法，但允许任何一种过程和方法使用它'
  - '[PAGE 84]


    # # What Is the UML?


    ☑ **The UML is a language for**


    +   - **Visualizing**

    +   - **Specifying**


    Unified Modeling Language（统一建模语言）是对象管理组织（OMG）制定的一个通用的、可视化的建模语言标准，可以用来可视化（visualize）、描述（specify）、构造（construct）和文档化（document）软件密集型系统的各种工件（artifacts，又译制品）


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_84_0.png)'
  - '[PAGE 85]


    # 选择UML


    ☑ 很多情况下，推荐使用UML:


    +   ◆ 1) OO方法是项目决定采用的方法论，是整个项目或产品成功的关键

    +   ◆ 2) 系统规模比较复杂，需要用图形抽象地表达复杂概念，增强设计的灵活性、可读性和可理解性，以便暴露深层次的设计问题，降低开发风险

    +   ◆ 3) 组织希望记录已成功项目、产品的公共设计方案，在开发新项目时可以参考、重用过去的设计，以节省投入，提高开发效率和整体成功率

    +   ◆ 4) 有必要采用一套通用的图形语言和符号体系描述组织的业务流程和软件需求，促进业务人员、开发人员之间一致、高效地交流'
  - '[PAGE 86]


    # 不选择UML


    ☑ UML不是万能，有些场合并不适合


    +   1）传统的做法已完全适用，对OOAD的要求也不高，项目非常成功，无改进必要


    +   2）开发的系统比较简单，直接用源码配上少量的文字就能解决问题，软件开发文档也无需添加图形来辅助说明


    +   3）开发的系统本身不属于OO方法、UML适用范围


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_86_0.png)'
  - '[PAGE 87]


    # # UML发展背景


