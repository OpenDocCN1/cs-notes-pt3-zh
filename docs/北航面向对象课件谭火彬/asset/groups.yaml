  md: "\n## 业务建模实践：建模指南\n\n- 业务模型不是UML标准直接支持的，但是通过UML的扩展机制可以很方便的建立业务模型\n\n- 主要构造型(stereotype)\n\
    \  - 业务用例模型\n    - 参与者的构造型：业务参与者(Business Actor)\n    - 用例的构造型：业务用例(Business Use\
    \ Case)\n  - 业务对象模型\n    - 类的构造型：业务工人(Business Worker)、业务实体(Business Entity)\n\
    \n## 建模指南：模型的组织\n\n- 利用“包”组织模型\n\n- 用例视图中\n  - “业务用例模型”\n  - 每个业务用例的“状态/活动模型”\n\
    \n- 逻辑视图中\n  - “业务对象模型”\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_204_0.png)\n\
    \n## 建模指南：使用构造型\n\n- ☑ 业务用例模型是在 **UML** 的用例模型（用例图）基础上添加构造型来实现的\n  \n- ☑ 业务对象模型是在\
    \ **UML** 的对象模型（类图）基础上添加构造型来实现的\n  \n- ◆ 利用已有元素添加构造型\n  \n- ◆ **Rose** 直接支持这些构造型\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_205_0.png)\n\n## 业务建模实践：实例分析\n\n☑ 研究对象：某旅店\n\
    \n☑ 业务现状：\n\n- 某旅店可对外开放 **50个双人间** 和 **20个单人间**，房间费用视情况按季节调整，但周一到周五提供半价（周末全价）折扣\n\
    - 旅客可以直接入住房间（如果有空房），也可提前预订；入住和预订都需要登记个人信息\n- 旅客提前预订房间时，需提交一定的订金；入住时间24小时之外的旅客可以取消预订，并退回所有订金，24小时以内则不退还订金\n\
    - 退房时缴纳全部的住宿费用\n- 服务员每月为经理提供房间的预订情况和入住情况的详细信息\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_206_0.png)\n\
    \n## 实例分析：业务用例模型\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_207_0.png)\n\n旅店的本质就是为旅客提供住宿服务，其它的只是为达到这个目标而采用的手段\n\
    （用例观点：把业务看成对外提供价值的价值流）\n\n## 实例分析：旅客住宿业务流程\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_208_0.png)\n\
    \n## 实例分析：检查业务用例模型\n\n- ☑ 该业务用例模型体现了整个旅店的业务需求吗？\n- ☑ 如何考虑这项业务：服务员每月为经理提供房间的预订情况和入住情况的详细信息？\n\
    - ◆ 经理是什么，如何体现在业务建模过程中？\n- ◆ 是业务参与者还是业务工人？体现怎样的业务本质的差异？\n\n## 实例分析：业务对象模型\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_210_0.png)\n\n## 业务模型为系统模型提供素材\n\n- ☑\
    \ 为用例视图和逻辑视图提供输入\n\n- ◆ 对于每个将被系统实现的业务用例，在用例视图中确定一个系统用例或用例包（或单独的子系统）来实现该业务\n\n\
    - ◆ 为需要支持自动化业务确定相应的用例\n\n- ◆ 对于业务对象模型中的业务实体，可以在系统模型中定义对应的实体类\n\n- ☑ 为系统构架提供一些重要的构架机制\n\
    \n- ◆ 在软件构架中定义专用层来实现复杂的业务逻辑\n\n## 业务模型映射到系统模型\n\n- ☑ 从业务改进点入手，结合系统远景，可以帮助获取系统模型\n\
    \n- ☑ 可能的对应关系（并非一一对应）\n  \n  - ◆ 业务用例 → 系统(子系统)\n  \n  - ◆ 业务参与者 → 系统参与者\n  \n\
