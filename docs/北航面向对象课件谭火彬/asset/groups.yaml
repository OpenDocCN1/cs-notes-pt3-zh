    2. 使用折半查找\n\n## 模式\n\n- 来自建筑行业\n  - Christopher Alexander\n  - 1977年《A Pattern\
    \ Language》\n  - Each pattern describes a problem which occurs over and over again\
    \ in our environments, and then describes the core of the solution to that problem,\
    \ in such a way that you can use this solution a million times over, without ever\
    \ doing it the same way twice.\n- 通用问题的解决方案\n\n## 模式的三大要素\n\nC. Alexander: Each\
    \ pattern is a three-part rule, which expresses a relation between a certain **context**,\
    \ a **problem**, and a **solution**\n\n- 背景（**context**）：那些适合运用该模式的可重现情形\n- 问题（**problem**）：出现在背景中的一系列影响力，即目标与约束\n\
