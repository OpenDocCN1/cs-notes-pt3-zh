    +     - 1986年，提出术语use case

    +     - 1987年，OOPSLA’86采用Jacobson论文，用例诞生


    +   成熟期（1987-1992）

    +     - Objectory AB公司，以用例内容为核心的Objectory Process（对象工厂过程）


    +   发展期（1992-）

    +     - 用例在面向对象方法中的应用，并成为UML的...部分'
