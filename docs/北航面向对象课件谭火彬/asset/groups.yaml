    +   - 将接收对象连成一条链，并沿着这条链传递请求，直到有一个对象处理这个请求为止\n\n## 行为型模式\n\n+   ☑ 16 命令 command\n\
    +     ◆ 将一个请求封装为对象，从而以不同请求将客户程序参数化；\n+     可以将请求排队或是记录请求日志，并支持undo操作\n\n+   ☑\
    \ 17 迭代器 iterator\n+     ◆ 提供一种方法顺序访问一个聚合对象中各个元素，而又不暴露该对象的内部表示\n\n+   ☑ 18 中介者\
