    +   - 有些可能一直运转的很好，不需要改进，也就没有必要作为软件需求来由系统实现


    +   - 而另外可能更多的业务在运转过程中存在这样或那样的问题，这些问题就成为业务待改进的改进点，也就很可能作为软件需求而存在


