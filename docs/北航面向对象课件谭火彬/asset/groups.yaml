  - '[PAGE 52]


    # 抽象和封装


    +   - ☑ 抽象是事物区别于其它事物的本质特征

    +     - ♦ 抽象的过程取决于使用者的目的，它应该包括使用者所感兴趣的那些职责，而忽略掉其它不相关的部分

    +   - ☑ 封装是指对象对其客户隐藏具体的实现，是软件模块化思想的体现

    +     - ♦ 通过封装实现信息隐藏和数据抽象'
  - '[PAGE 53]


    # 泛化


    泛化是类与类之间一种关系


    +   通过这种关系一个类可以共享另外一个或多个类的结构和行为


    +   为了实现泛化关系，采用继承机制


    +   一个子类（subclass）继承一个或多个父类（superclass），从而实现了不同的抽象层次


    +   通过这种关系可以很容易地复用已经存在的数据和代码，并实现多态处理


    +   根据父类的个数不同，存在着单一继承和多重继承两种情况'
  - '[PAGE 54]


    # 多态


    ☑ 多态在同一外表（接口）下表现出多种行为的能力


    +   - 是对象技术的根本特征

    +   - 对象技术正是利用多态提供的动态行为特征，来封装变化，适应变更，以达到系统的稳定'
