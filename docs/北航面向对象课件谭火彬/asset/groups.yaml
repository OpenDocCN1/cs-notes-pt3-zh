    \n- **用例关系**\n  - 通过用例关系将复杂的用例进行适当的分解，以便于提高需求的复用性和可扩展性等，从而使用例模型的结构更合理\n- **用例分级**\n\
    \  - 可以根据用例的重要程度进行分级，以便后续迭代计划的制定，高级别的用例优先考虑\n- **用例分包**\n  - 将相关的用例打包，通过分包的方式可以将用例图分层表示，以用于大规模系统的用例建模\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_292_0.png)\n\n## 用例关系\n\n<<extend>>\
    \ → 扩展\n\n<<include>> → 包含\n\n→ 泛化\n\n## 通过关系整理文档\n\n- ☑ **Extend(扩展)**\n  - 通过扩展用例对基用例增加附加的行为\n\
    - ☑ **Include(包含)**\n  - 基用例中复用被包含用例的行为\n  - 提取公共步骤，便于复用\n- ☑ **Generalization(泛化)**\n\
    \  - 派生用例继承泛化用例的行为并添加新行为\n\n## 用例关系：扩展\n\n扩展：某个用例在特定情况下，包含其他用例(扩展用例)的行为，表示功能被扩展\n\
    \n- 扩展使用带有<<extend>>的虚线表示。此时，箭头由扩展的用例指向原用例，通过扩展点指明在原用例中的扩展位置\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_295_0.png)\n\
    \n## 用例关系：包含\n\n☑ 包含：表示某个用例中包含了其他用例的行为\n\n- 包含用带有 <<include>> 的虚线来表示。此时，箭头由原有的用例指向被包含部分的用例\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_296_0.png)\n\n## 扩展 VS. 包含-1\n\n- 包含：由用例A连向用例B，表示用例A中使用了用例B中的行为或功能\n\
    \  - 包含关系的提出一般是基于用例行为复用的考虑，这也意味着被包含的用例往往被多个基用例引用\n- 扩展：由用例B连向用例A，表示用例A描述了一项基本需求，而用例B则描述了该基本需求的特殊情况，即一种扩展\n\
    \  - 扩展用例的提出是为了将基用例的一些特殊情况分离出来，在保持基用例本身相对完整的情况下（即一般情况都能处理）来处理这些特殊行为\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_0.png)\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_1.png)\n\n## 用例关系：泛化\n\n☑ 泛化：表示子用例继承了父用例\n\
    \n- 用例间的泛化关系表明子用例继承父用例中定义的所有属性、行为序列和扩展点，并且参与父用例中所有的关系\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_298_0.png)\n\
    \n"
