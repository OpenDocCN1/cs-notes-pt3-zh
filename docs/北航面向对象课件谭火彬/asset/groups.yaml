  - '[PAGE 484]


    # 设计模式


    +   ☑ 是：

    +     ◆ 优秀的设计范例

    +     ◆ 从优秀设计方案中发现和总结出来的经验

    +     ◆ 在实践中反复出现的设计问题的优秀解决方案

    +     ◆ 设计者相互交流的基本术语： 设计语言

    +     ◆ 培养优秀设计师的一条捷径


    +   ☑ 不是：

    +     ◆ 面向对象设计的框架

    +     ◆ 可供简单组合的设计元件

    +     ◆ 发明创造出来的创新思路

    +     ◆ 解决面向对象设计问题的完整方案'
