    - //记录支付并提交申请()\n\n### 《entity》申请\n*（from Entity Layer）*\n\n- //设置申请旅游团()\n- //设置申请责任人()\n\
    - //计算申请信息()\n- //计算费用和订金()\n- //更新申请信息()\n\n### 《entity》旅游团\n*（from Entity Layer）*\n\
    \n- //设置路线信息()\n\n### 《entity》支付明细\n*（from Entity Layer）*\n\n- //更新支付信息()\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_377_0.png)\n\n## 利用文本方式描述职责\n\n- 可以直接利用文字描述单个类的职责\n\
    - 传统的面向对象方法提供了一种“CRC卡”的技术可以更好地描述类的职责\n- CRC卡由三部分组成，即类(Class)、职责(Responsibility)、协作(Collaborator)\n\
    \n| 类名 |  |\n|---|---|\n| 职责1 | 职责1的协作 |\n| 职责2 | 职责2的协作 |\n| ... | ... |\n\n\
    ## 保持类职责的一致性\n\n从每个用例实现中发现类的职责，之后，要从系统整体角度定义类的职责\n\n- 跨类的职责冗余\n- 类中的互不相干职责\n-\
    \ 一个职责的类\n- 没有职责的类\n- 行为的更佳分配\n- 与许多其它类交互的类\n\n## 2. 定义分析类的属性\n\n☑ 属性(Attribute)用来存储对象的数据信息，是没有职责的原子事物\n\
    \n- 属性名是一个名词，清楚地表达了属性保留的信息\n- 可以利用文字详细说明属性中将要存储的相关信息\n- 属性类型应来自业务领域，与编程语言无关\n\n\
    ☑ 从以下几个方面来定义属性：\n\n- 识别分析类的过程中，也可同时发现类的属性，包括：接在所有格后面的名词或形容词（即某某的属性），不能成为类的名词以及字段列表中所描述的数据需求\n\
    - 作为一般业务常识，是否有从类职责范围考虑所应包括的属性\n- 该业务领域的专家意见以及过去的类似系统\n\n## 实例：为分析类添加属性\n\n<<entity>>\n\
    路线\n(from Entity Layer)\n代码\n名称：字符串\n天数：整数\n\n<<entity>>\n申请\n(from Entity Layer)\n\
    申请编号\n大人人数：整数\n小孩人数：整数\n申请状态\n申请日期：日期\n\n<<entity>>\n支付明细\n(from Entity Layer)\n\
    金额：费用\n截止日期：日期\n支付日期：日期\n支付状态\n\n<<entity>>\n旅游团\n(from Entity Layer)\n出发日期：日期\n\
    截止日期：日期\n可申请人数：整数\n大人价格：费用\n小孩价格：费用\n\n<<entity>>\n参加人\n(from Entity Layer)\n\
    姓名：字符串\n性别\n出生日期：日期\n电话号码：字符串\n联系地址：字符串\n邮政编码：字符串\nemail：字符串\n\n## 3. 定义分析类的关系\n\
    \n对象不能孤立地存在，它们之间需要频繁地通过消息进行交互从而执行有用的工作，并达到用例的目标\n\n为此，相应的类之间也应该存在特定的关系来支持这种交互过程\n\
    \n- 3.1 关联关系：协作关系\n- 3.2 聚合关系：整体-部分\n- 3.3 泛化关系：抽象-具体\n\n## 3.1 关联关系\n\n- 关联是类之间的一种结构化关系，是类之间的语义联系\n\
    \  - 表明类的对象之间存在着链接\n  - 对象是类的实例，而链接是关联的实例\n- 识别关联的基本思路\n  - 从交互模型中发现对象之间的链接，从而在相应的类上建立关联关系：如VOPC图中关联关系\n\
    \  - 从业务领域出发，分析领域中所存在的实体类之间的语义联系，为那些存在语义联系的类之间建立关联关系：如实体类之间的各种语义联系\n\n## 实例：实体类之间的关联关系\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_384_0.png)\n\n## 细化关联关系\n\n关联具有：名称、端点和角色名、多重性\n\
    \n- ◆ 名称：动词短语\n- ◆ 端点和角色名\n- ◆ 多重性表达式：*，1..*，1-40，5，3,5,8，...\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_385_0.png)\n\
    \n## 自反关联\n\n☑ 自反关联是指一个类自身之间存在关联，它表明同一个类的不同对象之间存在链接\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_386_0.png)\n\
    \n## 关联类\n\n## 关联类 (Association Class)\n\n- 是一种被附加到关联上的类，用来描述该关联自身所拥有的属性和行为\n\
    - 当某些属于关联自身的特征信息无法被附加到关联两端的类时，就需要为该关联定义关联类\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_387_0.png)\n\
    \n## 3.2 聚合关系\n\n☑ 聚合(Aggregation)关系是一种特殊的关联关系\n\n- ◆ 除了拥有关联关系所有的基本特征之外\n- ◆ 两个关联的类还分别代表\
    \ “整体” 和 “部分”，意味着整体包含部分\n\n☑ 可以在已有的关联关系基础上，通过分析两个关联的类之间是否存在如何语义来识别聚合关系\n\n- ◆\
    \ A（整体）由 B（部分）构成\n- ◆ B（部分）是 A（整体）的一部分\n\n"
