    # B-C-E三层构架解析


    +   - ☑ 以构造型 <<layer>> 表示系统不同层次

    +   - ☑ 以 B-C-E 三层划分系统三类处理逻辑

    +     - ◆ 边界层 (Boundary) 负责系统与参与者之间的交互

    +     - ◆ 控制层 (Control) 处理系统的控制逻辑

