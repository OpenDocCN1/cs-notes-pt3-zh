    # 分析设计过程简介


    +   - UML2提供的5类14种图

    +   - 不同的软件工程过程定义了不同阶段

    +     - 过程是一种“战术”，而UML则是基本的“作战技能”

    +     - 是一种多对多的关系，没有严格的对应，但有些最佳实践

    +     - 过程只是一个模板，每个团队都有自己的特点，根据这个模板定义自己的过程


