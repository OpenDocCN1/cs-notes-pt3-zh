  md: "\n# 内容安排\n\n- ☑ 理解分析\n- ☑ 从用例开始分析\n- ☑ 构架分析\n- ☑ 构造用例实现\n- ☑ 定义分析类\n\n# 构架分析\n\
    \n☑构架分析的过程就是定义系统高层组织结构和核心构架机制的过程\n\n- ◆ 1. 定义系统高层组织结构—备选构架\n- ◆ 2. 确定系统通用构架机制—分析机制\n\
    - ◆ 3. 提取系统的关键抽象以揭示系统必须能够处理的核心概念—关键抽象\n- ◆ 4. 创建用例实现来启动用例分析—用例实现\n\n## 1.定义备选构架\n\
    \n☑ 定义备选构架\n\n- 构架的初始草图\n- 初步定义系统的分层与组织\n- 初步定义一组在构架方面具有重要意义的元素，以作为分析的基础\n- 初步定义一组分析机制\n\
    - 定义要在当前迭代中处理的用例实现\n\n# 备选构架模式\n\n构架模式表示了对软件系统的一个基础结构组织形式。它提供了一套预定义子系统，详细说明它们的职责，并且包括组织它们之间的规则和指南\n\
    \n- 层\n- 模型-视图-控制器(M-V-C)\n- 管道和过滤器\n- 黑板\n\n# 分析阶段备选分层构架B-C-E\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_330_0.png)\n\
    \nBoundary Layer\n\n边界层，负责与参与者和外部设备进行交互\n\nControl Layer\n\n控制层，负责协调用例内部的处理流程\n\
    \nEntity Layer\n\n实体层，负责存储和访问系统内部实体信息\n\n# B-C-E三层构架解析\n\n- ☑ 以构造型 <<layer>> 表示系统不同层次\n\
    - ☑ 以 B-C-E 三层划分系统三类处理逻辑\n  - ◆ 边界层 (Boundary) 负责系统与参与者之间的交互\n  - ◆ 控制层 (Control)\
    \ 处理系统的控制逻辑\n  - ◆ 实体层 (Entity) 管理系统使用信息\n- ☑ 层之间建立依赖关系\n\n# 2.构架机制\n\n- ☑ 构架机制是对通用问题的决策、方针和实践\n\
    \n- ◆ 构架机制描述了针对一个经常发生的问题的一种通用解决方案\n\n- ◆ 作为系统构架的一部分，构架机制常常集中和定位在系统的非功能需求上\n\n\
    - ☑ 三类构架机制\n\n- ◆ 分析机制（概念）\n\n- ◆ 设计机制（具体）\n\n- ◆ 实现机制（实际）\n\n# 为什么使用分析机制\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_333_0.png)\n\n> 唉！不好了，我发现有一组类具有需要永久保存的数据。如果我现在还不知道将使用什么数据库的话，我如何去设计它们呢？\n\
    \n> 没关系，这就是我们为什么要有一个持久性分析机制的原因。我们了解得还不充分，我们可以先标记下来，设计时再仔细定义其的存储结构和方式\n\n分析机制用于在分析阶段中向设计人员提供复杂行为的简短表示，从而减少分析的复杂性并提高分析的一致性\n\
    \n# 常见的分析机制\n\n- ☑ 持久性(Persistency)\n- ☑ 遗留接口(Legacy Interface)\n- ☑ 分布(Distribution)\n\
    - ☑ 安全性(Security)\n- ☑ 事务管理(Transaction Management)\n- ☑ 进程控制和同步(Process Control\
    \ and Synchronization)\n- ☑ 通信(Communication)\n- ☑ ……\n\n# 分析机制特性\n\n☑分析机制特性定义了一些系统的非功能性需求\n\
