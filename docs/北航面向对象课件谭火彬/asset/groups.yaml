    \n## 我们得到的是“咖啡机”\n\n- 所有这三个类与“Mark IV咖啡机”这一特殊产品没有任何直接关系\n- 这正是我们所期望的——我们得到了真正的抽象，把握住了问题的本质\n\
    - 下面要做的，是根据这个抽象来实现 **Mark IV咖啡机**\n\n## 以MarkIV角度审视用例\n\n“加热”用例的路径“开始加热”中，用户按下“加热”键，导致一系列动作，这些动作在MarkIV中如何实现？\n\
    \n### start(), isReady()如何实现？\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_462_0.png)\n\
    \n## 添加操作后的系统类图\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_463_0.png)\n\n## 操作如何实现具体？\n\
    \n- 要是系统运行在MarkIV型咖啡机上，则必须调用相应的硬件接口！\n- Start:\n  - UserInterface如何知道“加热”键被按下？显然是通过调用CoffeeMakerAPI.getBrewButtonStatus()得到的\n\
    - IsReady\n  - HotWaterSource和ContainmentVessel都不知道如何判断，所以其中isReady方法都只能是抽象方法\n\
    - 为了实现这些操作，必须添加相应的硬件API代码，而这些代码实现应该放在何处\n\n## 利用泛化(实现)关系添加细节\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_465_0.png)\n\
    \n抽象类的抽象操作，保持该类的稳定性，满足OCP\n\n具体的代码实现交由具体类来实现\n\n## 解决方案\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_466_0.png)\n\
    \n## 这就是DIP\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_467_0.png)\n\n《abstract》\n\
    **UserInterface**\n- start()\n\n《abstract》\n**HotWaterSource**\n- isReady()\n\n\
    《abstract》\n**ContainmentVessel**\n- isReady()\n\n**MarkIVUI**\n- start()\n\n\
    **MarkIVCV**\n- isReady()\n\n**MarkIVHWS**\n- isReady()\n\n## DIP的本质\n\n- 通过抽象提取业务本质，并建立一个稳定的结构描述这个本质\n\
    - 对于具体的业务规则的处理是在这个本质的基础上的扩展\n- 技术、工具、意识形态等的发展可能使业务规则不断变化，但本质不变；而DIP则帮助我们轻松的适应这些变更\n\
    \n## UML2面向对象分析与设计\n\n### Object-Oriented Analysis & Design with UML2\n\n谭火彬\n\
    \n## 学习路线图\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_470_0.png)\n\n... Case-Study\
    \ ...\n\n## 第07章 面向对象的设计模式\n\nObject-Oriented Design Patterns\n\n## 内容安排\n\n-\
    \ 模式与设计模式\n- GoF设计模式及应用\n- GRASP职责分配模式\n- 模式与编程语言\n- 模式与重构\n\n## 内容安排\n\n- 模式与设计模式\n\
    - GoF设计模式及应用\n- GRASP职责分配模式\n- 模式与编程语言\n- 模式与重构\n\n## 模式无处不在\n\n- 好莱坞电影模式\n  -\
    \ 社会题材、动作片、言情片、历史题材片...\n- 中国象棋开局\n  - 当头炮、顺炮、列炮、屏风马...\n- 围棋布局\n  - 星小目、三连星、中国流、宇宙流...\n\
    - 古代行军布阵\n  - 八阵图、天门阵、一字长蛇阵...\n- 建筑、服装、交通、社会、文化...诸多模式\n\n## 计算机中的模式？\n\n###\
    \ 如何在已排序的列表中查找一个数？\n\n1. 将列表一分为二。将要查找的值与中间元素的值相比较。如果相等，就找到我们要查找的值。如果要查找的值小于中间元素的值，将中间点设置为列表的新顶点（并再次将列表一分为二）。如果要查找的值大于中间元素的值，将中间点设置为列表的新尾点。然后再将列表一分为二。继续这种分割过程，直到列表不能再分为止。此时，如果要查找的值不在最后两个元素中，它就不在这个列表中\n\
    2. 使用折半查找\n\n## 模式\n\n- 来自建筑行业\n  - Christopher Alexander\n  - 1977年《A Pattern\
    \ Language》\n  - Each pattern describes a problem which occurs over and over again\
    \ in our environments, and then describes the core of the solution to that problem,\
    \ in such a way that you can use this solution a million times over, without ever\
    \ doing it the same way twice.\n- 通用问题的解决方案\n\n## 模式的三大要素\n\nC. Alexander: Each\
    \ pattern is a three-part rule, which expresses a relation between a certain **context**,\
    \ a **problem**, and a **solution**\n\n- 背景（**context**）：那些适合运用该模式的可重现情形\n- 问题（**problem**）：出现在背景中的一系列影响力，即目标与约束\n\
    - 解决方案（**solution**）：可用于解决问题的经典设计形式或设计规则\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_478_0.png)\n\
