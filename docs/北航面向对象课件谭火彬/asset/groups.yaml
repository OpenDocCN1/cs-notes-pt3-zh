    - 谁使用系统的功能（用例）\n- 谁对系统进行维护\n- 与外部系统是否有关联\n- 时间参与者：一种习惯用法，用于激活那些系统定期的、自动执行的用例\n\
    \n## 参与者的命名\n\n☑ 对参与者赋予能更好地表达其角色(作用)的名称\n\n◆ 不好的参与者命名的例子：用职务名称和个人姓名来命名\n\n➢ 例如，张三、老李、校长、科长...\n\
    \n➢ 若使用系统的人（职务名称）变化的话，就不是参与者了\n\n◆ 好的参与者命名的例子：用能知道其角色的名称来命名\n\n➢ 例如，学生、订单管理员、维护部门...\n\
    \n➢ 即使使用系统的人改变，从系统来看，使用者的角色（作用）是相同的。\n"
