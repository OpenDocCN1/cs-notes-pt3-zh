  - '[PAGE 492]


    # GoF模式分类-1


    ☑ 根据模式的目的(用来完成什么工作的)


    +   - 创建型模式

    +   - 结构型模式

    +   - 行为型模式


    ☑ 根据模式的作用范围(是处理类还是处理对象的):


    +   - 类模式

    +   - 对象模式'
  - '[PAGE 493]


    # GoF模式分类-2


    +   - ☑ 创建型模式

    +     - 创建型类模式将对象的部分创建工作延迟到子类

    +     - 创建型对象模式将它延迟到另一个对象中

    +   - ☑ 结构型模式

    +     - 结构型类模式使用继承机制来组合类

    +     - 结构型对象模式描述了对象间的组装方式

    +   - ☑ 行为型模式

    +     - 行为型类模式使用继承描述算法与控制法

    +     - 行为型对象模式则描述一组对象怎样协作完成单个对象无法完成的工作'
