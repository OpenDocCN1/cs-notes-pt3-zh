    # 素数问题


    **素数的定义**：除了1与本身之外，不能被其他正整数除的数，叫作素数，也叫质数


    按照习惯规定，1 不算素数，最小的素数是 2，其余的是 3、5、7、11、13、17、19……等等


    # 由定义判断素数


    对于数 n，从 i=2, 3, 4, 5...到 n−1 判断 n 能否被 i 整除，如果全部不能整除，则 n 是素数，只要有一个能除尽，则 n 不是素数，为了压缩循环次数，可将判断范围从
    2 ~ n−1 改为 2 ~ sqrt(n)'
