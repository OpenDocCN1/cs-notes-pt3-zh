    \ UML\n3\n4\n5\n6. OOP / DP\n7\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_399_1.png)\n\
    \n... Case-Study ...\n\n### 学习路线图\n\n10...\n\n## 第06章 面向对象的设计原则\n\n### Object-Oriented\
    \ Design Principles\n\n## 从问题开始！\n\n### 长方形与正方形\n\n- ◆ 假如我们有一个类：长方形 (Rectangle)\n\
    - ◆ 我们需要一个新的类，正方形 (Square)\n- ◆ 问：可否直接继承长方形？\n\n没问题，因为数学上正方形就是长方形的子类！\n\n## 开始设计：正方形\n\
    \n```java\npublic class Rectangle {\n    private int width;\n    private int height;\n\
    \    public void setWidth(int w) {\n        width = w;\n    }\n    public int\
