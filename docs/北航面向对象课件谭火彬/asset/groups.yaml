  md: "\n## 类\n\n- 类是一系列对象的抽象描述，这些对象共享相同的属性、操作、关系和语义。\n  - 一个具体的对象是该类的一个实例。\n- 抽象过程强调相关特征而忽略其它的特征。\n\
    \  - 类抽象的过程就是将具体对象的特征和行为进行参数化，分别用类的属性（attribute）和操作（operation）来表示。\n\n## 属性\n\n\
    - 属性（attribute）是类的特征或特性。\n- 属性的值是某一特定对象的属性值。\n- 在类中属性名必须是唯一的。\n- 每一个类的实例都有为这个类定义的所有属性的值。\n\
    \n### 银行帐户类属性 / Mary 的银行帐户属性值\n\n| 银行帐户类属性 | Mary 的银行帐户属性值 |\n| --- | --- |\n\
    | 帐号 | 12345678 |\n| 银行名称 | First National Bank |\n| 拥有者 | Mary Smith |\n| 金额\
    \ | $1024.48 |\n\n## 属性取决于视点\n\n一辆汽车具有的属性：\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_45_0.png)\n\
    \n- 从销售人员的角度\n  - 型号\n  - 价格\n  - 颜色\n  - 里程数\n- 从维修人员的角度\n  - 马达类型\n  - 传动类型\n\
    \  - 维修记录\n\n## 操作\n\n- 操作（operation）访问或修改对象的属性值。\n- 对象的行为是由为此对象定义的一系列操作决定的。\n\
    - 一个类可能同时存在多个实例，也可能在某一时刻没有实例。\n- 一个类的所有实例都可以使用在这个类中定义的操作。\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_46_0.png)\n\
    \n## 操作取决于视点\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_47_0.png)\n\n一辆汽车具有的操作：\n\
    \n- 从销售人员的角度\n  - 处理客户订单\n  - 准备销售合同\n  - 加入清单\n  - 从清单中删除\n- 从维修人员的角度\n  - 测试刹车\n\
    \  - 修理刹车\n  - 转动轮胎\n  - 检查马达速度\n\n## UML 中的类\n\n属性\n\n操作\n\n| Professor |\n|\
    \ --- |\n| name |\n| employeeID |\n| hireDate |\n| status |\n| discipline |\n\
    | maxLoad |\n| submitFinalGrade() |\n| acceptCourseOffering() |\n| setMaxLoad()\
    \ |\n| takeSabbatical() |\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_48_0.png)\n\
    \nProfessor J Clark\n\n## 内容安排\n\n- 从结构化到面向对象\n- 课程介绍\n- 对象技术\n- 对象和类\n- **对象技术相关原则**\n\
    - 上升到面向对象\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_50_0.png)\n\n## 对象技术相关原则\n\
    \n对象技术基本原则\n\n- 抽象（**Abstraction**）\n- 封装（**Encapsulation**）\n- 泛化（**Generalization**）\n\
    - 多态（**Polymorphism**）\n- ……\n\n## 抽象和封装\n\n- 抽象是事物区别于其它事物的本质特征。\n  - 抽象的过程取决于使用者的目的，它应该包括使用者所感兴趣的那些职责，而忽略掉其它不相关的部分。\n\
    - 封装是指对象对其客户隐藏具体的实现，是软件模块化思想的体现。\n  - 通过封装实现信息隐藏和数据抽象。\n\n## 泛化\n\n泛化是类与类之间一种关系。\n\
    \n- 通过这种关系，一个类可以共享另外一个或多个类的结构和行为。\n- 为了实现泛化关系，采用继承机制。\n- 一个子类（subclass）继承一个或多个父类（superclass），从而实现了不同的抽象层次。\n\
    - 通过这种关系可以很容易地复用已经存在的数据和代码，并实现多态处理。\n- 根据父类的个数不同，存在着单一继承和多重继承两种情况。\n\n## 多态\n\n\
    多态是在同一外表（接口）下表现出多种行为的能力。\n\n- 是对象技术的根本特征。\n- 对象技术正是利用多态提供的动态行为特征，来封装变化，适应变更，以达到系统的稳定。\n\
    \n## 应用多态性\n\n假设我们有一个数组 `sharr`，里面放着一排 `Shape`，但是不知道哪些是 `Rectangle`，哪些是 `Circle`。利用多态性，我们可以：\n\
    \n```\nfor (int i = 0; i < sharr.length; ++i) {\n    Shape shape = (Shape)sharr[i];\n\
    \    shape.draw();\n}\n```\n\n遍历整个数组的过程中，各个 `Shape` 自己知道应当如何在画布上绘制自己。`shape.draw()`\
    \ 这一行代码在 `shape` 指向不同的对象时表现出不同的行为，这就是所谓多态性。\n\n## 内容安排\n\n- 从结构化到面向对象\n- 课程介绍\n\
    - 对象技术\n- 对象和类\n- 对象技术相关原则\n- **上升到面向对象**\n\n## OO 个人简介的 UML 表示\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_58_0.png)\n\
    \n## 打电话\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_58_1.png)\n\n## 实例2：用对象思维分析问题\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_59_0.png)\n\n昨天我的一个朋友结婚了。\n\n## 问题分析-1\n\
    \n- A. 这里面有什么东西？\n  - 月老，小伙，姑娘，恋人，玫瑰花\n- B. 每个东西看上去是什么样的？\n  - 月老：看上去有些年纪了，挺热心的\n\
    \  - 小伙：看上去很强壮，很诚实的\n  - 姑娘：看上去好漂亮，还很温柔\n  - 恋人：看上去很黏糊，当然就结婚了\n  - 玫瑰花：火红火红的，难怪姑娘动情了\n\
    \n## 问题分析-2\n\n- C. 每个东西能做点什么用？\n  - 月老：牵线搭桥，介绍认识\n  - 小伙：追求献花，表达爱意\n  - 姑娘：仰慕倾情，以身相许\n\
    \  - 恋人：拍拖，……，结婚\n  - 玫瑰花：令姑娘头晕，传情示爱\n\n## 问题分析-3\n\n- D. 这些东西都呆在什么地方？\n  - 月老：婚介所，交友网站\n\
    \  - 小伙：软件园，住回龙观\n  - 姑娘：人民医院，住望京\n  - 恋人：情侣路，电影院，……\n  - 玫瑰花：花店里，小伙手中，姑娘手中\n\n\
    ## 问题分析-4\n\n- E. 这些东西之间有什么关系？\n\n| 关系 | 月老 | 小伙 | 姑娘 | 恋人 | 玫瑰 |\n| --- | ---\
    \ | --- | --- | --- | --- |\n| 月老 |  | 干妈 | 舅妈 | 撮合者 | 没关系 |\n| 小伙 | 干儿子 |  |\
    \ 男友老公 | 男主角 | 买送主 |\n| 姑娘 | 外甥女 | 女友太太 |  | 女主角 | 受主 |\n| 恋人 | 作品 | 组成 | 组成 |\
    \  | 使用者 |\n| 玫瑰 | 没关系 | 信物 | 受物心意 | 信物 |  |\n\n## 问题分析-5\n\n- F. 这些东西是怎么发生的？\n\
    \  - 月老牵线搭桥，介绍小伙和姑娘认识。\n  - 姑娘和小伙一见钟情，成为一对恋人。\n  - 一对恋人开始拍拖。\n  - 小伙追求献花，表达对姑娘的爱意。\n\
    \  - 姑娘收到999火红玫瑰，激动得头晕目眩。\n  - 小伙真心求婚，姑娘以身相许。\n  - 一对恋人终于走入婚姻殿堂。\n\n## 一、上升到面向对象——用面向对象观点观看事物\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_65_0.png)\n\n## 用对象观点认识事物\n\n- A. 这里面有什么东西？\n\
    \  - 类与对象\n- B. 每个东西看上去是什么样的？\n  - 类的属性\n- C. 每个东西能做点什么用？\n  - 类的操作\n- D. 这些东西都呆在什么地方？\n\
    \  - 类的行为、状态、部署\n- E. 这些东西之间有什么关系？\n  - 类间的关联\n- F. 这些东西是怎么成事的？\n  - 类间的协作（用例实现）\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_66_0.png)\n"
