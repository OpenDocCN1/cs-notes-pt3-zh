    # Demeter准则


    +   - 作为PV模式的一个特例，Demeter准则 是获得受限结构变化的一种机制，它给出了在一个方法内应该向哪些对象发送消息的限制

    +   - Demeter准则（Law of Demeter）：在那些需要在其上发送消息的对象上面放置一些限制条件，它表明在一个方法中，消息只能发往下面的对象

    +     - 对象本身

    +     - 方法的一个参数

    +     - 对象本身的属性

    +     - 对象本身的一个属性集合中的元素

