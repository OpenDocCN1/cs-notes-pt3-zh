    \n## 面向对象的设计原则\n\n- ☑ 面向对象的设计原则\n  - 是面向对象设计的基本指导思想\n  - 是评价面向对象设计的价值观体系\n  -\
    \ 是设计模式的出发点和归宿\n\n☑ 面向对象的设计原则是构造高质量软件的出发点\n\n## 设计目标\n\n- ☑ 构造出高质量软件，以保持系统稳定\n\
