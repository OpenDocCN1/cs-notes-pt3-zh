    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_78_1.png)\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_78_2.png)\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_78_3.png)\n\n## 模型的重要性\n\n不重要\n\n非常重要\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_79_0.png)\n\n纸飞机\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_79_1.png)\n\
    \n战斗机\n\n## 建模的目的\n\n- ☑ 模型有助于按照所需的样式可视化（**可视化**）系统\n- ☑ 模型能够描述（**规定**）系统的结构和行为\n\
    - ☑ 模型提供构造（**构建**）系统的模板\n- ☑ 模型可以文档化（**文档化**）设计决策\n\n## 建模的原则\n\n- ☑ 选择合适的模型\n\
    - ☑ 模型具有不同的精确程度\n- ☑ 最好的模型是与现实相联系\n- ☑ 需要从多个视角创建不同的模型，单一的模型是不够的\n\n## 内容安排\n\n\
    - ☑ 可视化建模\n- ☑ UML\n- ☑ UML组成结构\n- ☑ UML概念模型\n- ☑ 应用UML2建模\n\n## UML\n\n- ☑ UML\
    \ — 你必须学习\n- ☑ UML — 统一建模语言\n- ☑ UML是一种标准的图形化建模语言，是面向对象分析与设计的标准表示，它：\n  - 不是一种可视化的程序设计语言，而是一种可视化的建模语言(用于分析设计)\n\
    \  - 不是工具或知识库的规格说明，而是一种建模语言规格说明，是一种表示的标准\n  - 不是过程，也不是方法，但允许任何一种过程和方法使用它\n\n##\
    \ 什么是UML？\n\n☑ **UML是一种用于以下方面的语言**\n\n- **可视化**\n- **描述**\n\nUnified Modeling\
    \ Language（统一建模语言）是对象管理组织（OMG）制定的一个通用的、可视化的建模语言标准，可以用来可视化（visualize）、描述（specify）、构造（construct）和文档化（document）软件密集型系统的各种工件（artifacts，又译制品）\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_84_0.png)\n\n## 选择UML\n\n☑ 很多情况下，推荐使用UML:\n\
    \n- ◆ 1) OO方法是项目决定采用的方法论，是整个项目或产品成功的关键\n- ◆ 2) 系统规模比较复杂，需要用图形抽象地表达复杂概念，增强设计的灵活性、可读性和可理解性，以便暴露深层次的设计问题，降低开发风险\n\
    - ◆ 3) 组织希望记录已成功项目、产品的公共设计方案，在开发新项目时可以参考、重用过去的设计，以节省投入，提高开发效率和整体成功率\n- ◆ 4) 有必要采用一套通用的图形语言和符号体系描述组织的业务流程和软件需求，促进业务人员、开发人员之间一致、高效地交流\n\
    \n## 不选择UML\n\n☑ UML不是万能，有些场合并不适合\n\n- 1）传统的做法已完全适用，对OOAD的要求也不高，项目非常成功，无改进必要\n\
    - 2）开发的系统比较简单，直接用源码配上少量的文字就能解决问题，软件开发文档也无需添加图形来辅助说明\n- 3）开发的系统本身不属于OO方法、UML适用范围\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_86_0.png)\n\n## UML发展背景\n\n☑ **90年代：**\
    \ 面向对象分析设计方法学之战\n\n- P. Coad和E.Yourdon提出OOA和OOD\n- G. Booch提出面向对象开发方法\n- Jacobson提出OOSE\n\
    - Rumbaugh提出的OMT\n- ……\n\n☑ **UML的出现结束了这场方法学战争**\n\n## UML发展历程\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_88_0.png)\n\
    \nUML 合作伙伴的专业知识\n\nUML 2.4.1\n(2011)\n\nUML 2.0\n(2005)\n\nUML 1.5\n(2003年3月)\n\
    \nUML 1.1\n(1997年9月)\n\nUML 1.0\n(1997年1月)\n\nUML 0.9\n(1996年6月) 和 UML 0.91\n\
    (1996年10月)\n\n统一方法 0.8\n(OOPSLA '95)\n\nBooch '93 OMT - 2\n\nBooch '91\n\nOMT\
    \ - 1\n\nOOSE\n\n其他方法\n\n公众反馈\n\n工业化\n标准化\n统一化\n分散的各部分\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_88_1.png)\n\
    \n## UML现状\n\n## ☑ UML 1.x\n\n- 目前应用较为普及，包括从1.1~1.5\n- 2003年3月发布的UML 1.5\n\n##\
    \ ☑ UML 2\n\n- 分为基础结构和上层结构\n- 2005年7月正式发布UML 2.0\n- 2007年8月、11月UML2.1.1&2.1.2\n\
    - 2009年2月UML 2.2，2010年5月UML 2.3\n- 2011年8月UML2.4.1，2012年5月 ISO/IEC 19505-1:2012，ISO/IEC\
    \ 19505-2:2012\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_89_0.png)\n\n## UML的统一\n\
    \n☑ 统一了什么？\n\n- 开发生命周期\n- 应用领域\n- 实现语言和平台\n- 开发过程\n- 本身的内部概念\n\n## 内容安排\n\n- ☑\
    \ 可视化建模\n- ☑ UML\n- ☑ UML组成结构\n- ☑ UML概念模型\n- ☑ 应用UML2建模\n\n## UML基础结构和上层结构\n\n\
    ## ☑ UML基础结构(Infrastructure)\n\n- 即UML元模型\n- 使之更加模块化，更易于扩展\n- 与UML其它规范更加保持一致(MOF)\n\
    \n## ☑ UML上层结构(Superstructure)\n\n- 是指普通用户使用的UML语法、语义以及符号表示\n- 使UML更具可用性\n\n"
