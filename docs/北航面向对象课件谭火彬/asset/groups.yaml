    # 面向对象 VS 结构化-3


    | | 传统结构化方法 | 面向对象方法(UML) |

    |---|---|---|

    | 需求模型 | 输入I、处理P、输出O的视角，面向功能的文档(用户需求规格说明书)需求变化，其功能变化，所以系统的基础不稳固 | 从用户和整体角度出发

    使用系统抽象出用例图、活动图，获取需求；如需求变化，对象的性质相对功能稳定，系统基础稳定 |

    | 分析模型 | 面向过程的数据流图DFD、实体一关系图ERD、数据字典DD表示分析模型

    功能分解,数据和功能/过程分开 | 把问题作为一组相互作用的实体，显式表示实体间的关系

    数据模型和功能模型一致

    类、对象图表示分析模型，状态、顺序、通信、活动图细化说明 |

    | 设计模型 | 功能模块(SC图)，模块之间的连接/调用是模块的附属形式 | 类和对象实现,类/对象的关联、聚集、继承等连接、连接规范和约束作为显式定义
    |

    | 实施模型 | 体系结构设计 | 构件图，部署图 |

    | 测试模型 | 根据文档进行单元测试，集成测试,确认测试 | 单元测试采用类图，集成测试用实现图和交互图，确认测试采用用例图 |


