    # 分析


    +   ☑ 分析

    +     ◆ 为了满足需求模型中所描述的功能，系统内部应该有什么样的业务核心机制(做什么？)


    +   ☑ 分析的目标开发一系列模型，以描述机软件核心成分，从而满足客户定义的需求：

    +   分析模型


    +   ◆ 包括两个层次：构架分析和用例分析


    +   ◆ 包括两类模型：静态结构(包图、类图)和动态交互(顺序图、通信图)


    +   ◆ 模型元素按照构架来组织，各类视图按照用例实现(协作)来组织'
  - '[PAGE 315]


    # 分析与需求的关系


    +   ☑ 分析是建立在需求收集的基础上

    +     ◆ 分析模型建立在用例模型的基础上

    +     ◆ 用例模型确定了分析模型的结构（通过用例实现(协作)来组织分析模型）

    +     ◆ 用户视角理解用户问题过渡到开发团队视角分析用户问题

    +       ➢ 与需求一样，它还是在问题域中

    +       ➢ 从用户视角跨入开发团队视角

    +     ◆ 分析与需求捕获在很大程度上重叠，这两个活动常常相辅相成，为了澄清和找出任何遗漏或歪曲的需求，常常需要在需求之上作一些分析'
  - '[PAGE 316]


    # 分析的“度”


    +   ☑ 面向对象分析是以对象的视角去理解业务问题


    +   ◆ 不同于以自然语言描述的需求

    +   ◆ 也不同于以技术语言去表达的设计


    +   ☑ 如何把握这种介于业务和技术之间的分析活动的“度”是非常关键的


    +   ◆ 过渡的分析会陷入设计误区，从而难以有效的达到分析的目标

    +   ◆ 不够深入的分析则容易遗漏那些重要的信息，从而无法及早发现并处理需求中的问题'
  - "[PAGE 317]\n\n# 把握分析的“度”\n\n+   ☑ 把整个分析活动限制在业务问题域词汇，而不考虑任何技术领域的实现策略\n+   \n+\
    \   ◆ 保持对系统结构和行为的精确和简单陈述\n+   \n+   ◆ 所有与实现相关内容都留给设计和实现阶段来考虑\n\n+   ☑ 一些具体的分析原则：\n\
    +   \n+   ◆ 分析模型使用业务语言\n+   \n+   ◆ 分析类和关系等应该是业务中明确存在的\n+   \n+   ◆ 分析是对需求模型的重新表述，是以理想化的方式来实现用例行为，不考虑技术实现\n\
    +   \n+   ◆ 分析侧重于系统主要部分，关注核心的业务场景；对支撑性行为、非功能需求等不做深入的分析"
