    # SRP本质


    ☑ **SRP体现了内聚性（Cohesion）**


    +   ◆ 内聚性：一个模块的组成元素之间的功能相关性


    ☑ 类的职责定义为“变化的原因”，每个职责都是变化的一个轴线；


    +   ◆ 当需求变化时，该变化会反映为类的职责的变化


    +   ◆ 如果一个类承担了多于一个的职责，那么引起它变化的原因就会有多个'
