  mdcn: "\n\n## 参与者之间的关系：泛化\n\n☑ 参与者可以通过泛化关系来定义，在这种泛化关系中，一个参与者的抽象描述可以被一个或多个具体的参与者所共享\n\
    \n- ◆ 如系统中经理可以参加雇员的所有用例\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_252_0.png)\n\
    \n## 参与者地位\n\n- ☑ 识别用例之前很重要\n  - 有助于识别用例，宁多勿少\n- ☑ 开始书写用例文档以后不重要\n  - 涉及的参与者太多\n\
    - ☑ 测试和部署阶段很重要\n  - 需要从参与者的角度考虑\n\n## 3 识别用例\n\n- ☑ 关键词：价值\n\n- ☑ 定义\n  - ◆ 用例实例是系统执行的一系列动作，这些动作将生成特定参与者可观测的结果值\n\
    \  - ◆ 一个用例定义一组用例实例（场景）\n\n- ☑ 简洁：参与者使用系统达到某个目标\n\n记住，我是(系统)用例\n\n## 用例要点\n\n\
    - ☑ 可观测→用例止于系统边界\n- ☑ 结果值→用例是有意义的目标\n- ☑ 系统执行→结果值由系统生成\n- ☑ 由参与者观测→业务语言、用户观点\n\
    - ☑ 一组用例实例→用例的粒度\n\n## 要点：有意义的目标\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_256_0.png)\n\
    \n## 要点：结果值由系统生成\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_257_0.png)\n\n系统需要处理的，由系统生成\n\
    \n## 要点：用户观点而非系统观点\n\n会员\n查询商品\n订购商品\n用户观点\n\n会员\n显示商品信息\n处理订购\n系统观点\n\n## 用例的命名\n\
    \n☑ 参与者视角：\n\n- ◆ （状语）动词+（定语+）宾语\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_259_0.png)\n\
    \n## 要点：用例粒度-1\n\n- ☑ 用例是一组用例实例的抽象；其内部要有路径，路径要有步骤\n\n- ☑ 最常犯错误：粒度过细，陷入功能分解\n\n\
    - ◆ 通过执行用例，参与者完成想做的事情（最终的目的），并为参与者产生价值\n\n- ◆ 过细的粒度，一般都会导致技术语言的描述，而不再是业务语言\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_260_0.png)\n\n## 用例粒度-2\n\n☑把步骤当用例\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_261_0.png)\n\n会员\n\n输入用户名\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_261_1.png)\n\
    \n会员\n\n登录\n\n<<include>>\n\n验证用户名和密码\n\n☑把系统活动当用例\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_261_2.png)\n\
    \n<<include>>\n\n建立数据库连接\n\n查询订单\n\n<<include>>\n\n## 用例粒度-3\n\n☑ “四轮马车”\n\n-\
    \ ◆ **C(Create)**\n- **R(Read)**\n- **U(Update)**\n- **D(Delete)**\n\n- 所有业务最终都会成为\
    \ **CRUD**？\n\n- **CRUD** 能为Actor提供价值？\n\n- **CRUD掩盖业务，**蜕变成关系数据库的建模：\n  - “系统就是数据的增删改查”\
    \ 查询用户\n  - 关心数据的存储和维护，反而忽略了用户的目的\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_262_0.png)\n\
    \n## 用例粒度-4\n\n☑ 如果确实是CRUD？\n\n- 如果CRUD不涉及复杂的交互，一个用例“管理××”即可\n- 不管是C、R、U、D，都是为了完成“管理”目标\n\
