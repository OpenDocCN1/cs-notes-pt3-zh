    +       ➢ 与需求一样，它还是在问题域中\n+       ➢ 从用户视角跨入开发团队视角\n+     ◆ 分析与需求捕获在很大程度上重叠，这两个活动常常相辅相成，为了澄清和找出任何遗漏或歪曲的需求，常常需要在需求之上作一些分析\n\
    \n## 分析的“度”\n\n+   ☑ 面向对象分析是以对象的视角去理解业务问题\n\n+   ◆ 不同于以自然语言描述的需求\n+   ◆ 也不同于以技术语言去表达的设计\n\
    \n+   ☑ 如何把握这种介于业务和技术之间的分析活动的“度”是非常关键的\n\n+   ◆ 过渡的分析会陷入设计误区，从而难以有效的达到分析的目标\n\
    +   ◆ 不够深入的分析则容易遗漏那些重要的信息，从而无法及早发现并处理需求中的问题\n\n## 把握分析的“度”\n\n+   ☑ 把整个分析活动限制在业务问题域词汇，而不考虑任何技术领域的实现策略\n\
    +   \n+   ◆ 保持对系统结构和行为的精确和简单陈述\n+   \n+   ◆ 所有与实现相关内容都留给设计和实现阶段来考虑\n\n+   ☑ 一些具体的分析原则：\n\
    +   \n+   ◆ 分析模型使用业务语言\n+   \n+   ◆ 分析类和关系等应该是业务中明确存在的\n+   \n+   ◆ 分析是对需求模型的重新表述，是以理想化的方式来实现用例行为，不考虑技术实现\n\
    +   \n+   ◆ 分析侧重于系统主要部分，关注核心的业务场景；对支撑性行为、非功能需求等不做深入的分析\n\n## 内容安排\n\n+   - ☑ 理解分析\n\
    +   - ☑ 从用例开始分析\n+   - ☑ 构架分析\n+   - ☑ 构造用例实现\n+   - ☑ 定义分析类\n\n## 分析模型与用例模型\n\
    \n用例：外观\n\n类协作：内部机理\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_319_0.png)\n\n\
    ## 从用例开始分析迭代\n\n+   - UP方法中最重要的思想就是迭代，而迭代的基础就是用例\n+   - 从用例开始分析基本思路\n+     - 根据用例图和用例文档来确认需求定义是可靠的、一致的\n\
    +     - 用例分级：根据风险、重要性以及项目组的能力确定用例以及用例相关路径的优先级\n\n## 实例-旅游申请系统迭代1\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_321_0.png)\n\
    \n## 分析阶段的用例—用例实现\n\n☑ 用例实现(UML2中的协作)是设计(分析)模型中一个系统用例的表达式\n\n+   - 使用构造型<<use-case\
    \ realization>>\n+   - 描述了对象间的协作以完成用例目标\n+   - 将用例模型中的用例和设计(分析)模型中的类和关系连接在一起\n\
