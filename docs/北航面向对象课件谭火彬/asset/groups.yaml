    # 3. 定义分析类的关系


    对象不能孤立地存在，它们之间需要频繁地通过消息进行交互从而执行有用的工作，并达到用例的目标


    为此，相应的类之间也应该存在特定的关系来支持这种交互过程


    +   - 3.1 关联关系：协作关系

    +   - 3.2 聚合关系：整体-部分

    +   - 3.3 泛化关系：抽象-具体'
  - '[PAGE 383]


    # 3.1 关联关系


    +   - 关联是类之间的一种结构化关系，是类之间的语义联系

    +     - 表明类的对象之间存在着链接

    +     - 对象是类的实例，而链接是关联的实例

    +   - 识别关联的基本思路

    +     - 从交互模型中发现对象之间的链接，从而在相应的类上建立关联关系：如VOPC图中关联关系

    +     - 从业务领域出发，分析领域中所存在的实体类之间的语义联系，为那些存在语义联系的类之间建立关联关系：如实体类之间的各种语义联系'
  - '[PAGE 384]


    # 实例：实体类之间的关联关系


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_384_0.png)'
  - '[PAGE 385]


    # 细化关联关系


    关联具有：名称、端点和角色名、多重性


    +   ◆ 名称：动词短语

    +   ◆ 端点和角色名

    +   ◆ 多重性表达式：*，1..*，1-40，5，3,5,8，...


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_385_0.png)'
  - '[PAGE 386]


    # 自反关联


    ☑ 自反关联是指一个类自身之间存在关联，它表明同一个类的不同对象之间存在链接


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_386_0.png)'
  - '[PAGE 387]


    # 关联类


    # 关联类 (Association Class)


    +   - 是一种被附加到关联上的类，用来描述该关联自身所拥有的属性和行为

    +   - 当某些属于关联自身的特征信息无法被附加到关联两端的类时，就需要为该关联定义关联类


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_387_0.png)'
  - '[PAGE 388]


    # 3.2 聚合关系


    ☑ 聚合(Aggregation)关系是一种特殊的关联关系


    +   ◆ 除了拥有关联关系所有的基本特征之外

    +   ◆ 两个关联的类还分别代表 “整体” 和 “部分”，意味着整体包含部分


    ☑ 可以在已有的关联关系基础上，通过分析两个关联的类之间是否存在如何语义来识别聚合关系


    +   ◆ A（整体）由 B（部分）构成

    +   ◆ B（部分）是 A（整体）的一部分'
