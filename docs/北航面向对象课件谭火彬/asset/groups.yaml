    # # 重构用例模型


    ☑ 利用用例建模高级技术重构用例模型


    +   - **用例关系**

    +     - 通过用例关系将复杂的用例进行适当的分解，以便于提高需求的复用性和可扩展性等，从而使用例模型的结构更合理


    +   - **用例分级**

    +     - 可以根据用例的重要程度进行分级，以便后续迭代计划的制定，高级别的用例优先考虑


    +   - **用例分包**

    +     - 将相关的用例打包，通过分包的方式可以将用例图分层表示，以用于大规模系统的用例建模


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_292_0.png)'
  - '[PAGE 293]


    # 用例关系


    <<extend>> → 扩展


    <<include>> → 包含


    → 泛化'
  - '[PAGE 294]


    # 通过关系整理文档


    +   ☑ **Extend(扩展)**

    +     ◆ 通过扩展用例对基用例增加附加的行为


    +   ☑ **Include(包含)**

    +     ◆ 基用例中复用被包含用例的行为

    +     ◆ 提取公共步骤，便于复用


    +   ☑ **Generalization(泛化)**

    +     ◆ 派生用例继承泛化用例的行为并添加新行为'
  - '[PAGE 295]


    # 用例关系：扩展


    扩展：某个用例在特定情况下，包含其他用例(扩展用例)的行为，表示功能被扩展


    +   扩展使用带有<<extend>>的虚线表示。此时，箭头由扩展的用例指向原用例，通过扩展点指明在原用例中的扩展位置


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_295_0.png)'
  - '[PAGE 296]


    # 用例关系：包含


    ☑ 包含：表示某个用例中包含了其他用例的行为


    +   ◆ 包含用带有 <<include>> 的虚线来表示。此时，箭头由原有的用例指向被包含部分的用例


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_296_0.png)'
  - '[PAGE 297]


    # 扩展 VS. 包含-1


    +   - 包含：由用例A连向用例B，表示用例A中使用了用例B中的行为或功能

    +     - 包含关系的提出一般是基于用例行为复用的考虑，这也意味着被包含的用例往往被多个基用例引用


    +   - 扩展：由用例B连向用例A，表示用例A描述了一项基本需求，而用例B则描述了该基本需求的特殊情况，即一种扩展

    +     - 扩展用例的提出是为了将基用例的一些特殊情况分离出来，在保持基用例本身相对完整的情况下（即一般情况都能处理）来处理这些特殊行为


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_0.png)


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_1.png)'
  - '[PAGE 298]


    # 用例关系：泛化


    ☑ 泛化：表示子用例继承了父用例


    +   ◆ 用例间的泛化关系表明子用例继承父用例中定义的所有属性、行为序列和扩展点，并且参与父用例中所有的关系


    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_298_0.png)'
  md: "\n## 从涉众利益角度定义用例\n\n☑Cockburn：用例是涉众之间达成的契约，以参与者为达成特定目标和系统交互的方式演绎\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_276_0.png)\n\
    \n## 用例平衡涉众之间的利益\n\n- 用例平衡涉众之间的利益\n- 涉众是受系统影响的，有自己主张的人或组织，可能的涉众有：\n  - 最终用户、客户、政府、法律\n\
    \  - 开发者、管理人员、竞争对手、...\n- 对于用户在ATM取钱的用例\n  - 用户：希望方便\n  - 银行：希望安全\n  - 法律：保护财产\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_277_0.png)\n\n## 涉众利益的冲突\n\n- ☑ 用例相当于参与者在台上表演，而最重要的是台下的观众(涉众)的利益\n\
    - ☑ 编写用例文档的过程就是描述如何满足涉众之间的利益，达到涉众利益的平衡\n- ☑ 涉众有轻重缓急\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_278_0.png)\n\
    \n## 寻找涉众的思路\n\n- ☑ 区分涉众与参与者\n  - 涉众是与当前用例存在利益关系的人或组织\n  - 参与者是启动或参与用例执行过程的人或外部事物\n\
    - ☑ 可能的涉众有：\n  - 当事人\n  - 上游下游\n  - 操作对象的主人\n  - …\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_279_0.png)\n\
    \n## 前置、后置条件\n\n- ☑ 前置条件约束在用例开始前系统的状态\n  - 作为用例的入口限制，它阻止参与者触发该用例直到满足所有条件\n  -\
    \ 说明在用例触发之前什么必须为真\n- ☑ 后置条件约束用例执行后系统的状态\n  - 用例执行后什么必须为真\n  - 对于存在各种分支事件流的用例，则可以指定多个后置条件\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_280_0.png)\n\n## 定义前置、后置条件\n\n- ☑ 前置、后置条件必须是系统能检测到的\n\
    \n- ☑ 前置条件必须是系统在用例开始前就能检测到的\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_281_0.png)\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_281_1.png)\n\n前置条件\n客户打来电话\n\n前置条件\n\
    客服部人员已经登录\n\n前置条件\nATM用户的账户里有足够的金额\n\n## 应用前置、后置条件\n\n- ☑ 某些用例依赖于其他用例\n  - 一个用例在离开系统时，可能是另一个用例的前置条件（例如：“登录”和“管理系统”）\n\
    - ☑ 有助于识别漏掉的用例\n  - 如果一个用例的前置条件不能由执行其他用例满足，可能意味着丢失了用例（例如：“管理订单”却没有“登录”用例）\n\n\
    ## 事件流描述-用例交互四部曲\n\n1. 动作\n\n   系统\n\n2. 验证\n\n3. 处理\n\n4. 响应\n\n重点写：1和4（可观测的、体现客户利益的文字）\n\
    \n## 事件流描述要点\n\n☑ 事件流描述要使用户和开发人员互相理解用例的功能，要注意以下几点：\n\n- 使用业务语言：使用用户平时所使用的语言进行描述\n\
    - 要明确参与者与系统所交互的信息\n- 不使用[例如]、[等]这样的不清晰的表达\n- 不要细化GUI\n- 不要描述计算机内部的处理，要描述从系统外部所看到的活动\n\
    - 除了基本流程，还要描述替代流程\n- 要明确描述用例的开始和结束\n\n## 例1：使用业务语言\n\n- ☑ 技术语言：无法与用户沟通\n  - 系统通过\
    \ **JDBC** 建立数据库连接，传送 **SQL** 查询语句，从“商品表”查询商品的详细信息…\n- ☑ 业务语言（用户语言）\n  - 系统按照查询条件搜索商品的详细信息\n\
    \n## 例2：描述参与者与系统交互过程\n\n- ☑ 以参与者或系统作为主语描述\n  - 参与者......\n  - 系统......\n- ☑ 示例\n\
    \  - 出纳员接收顾客的付款—顾客的付款数可能高于商品总额\n  - 出纳员录入顾客所付的现金总额\n  - 系统显示出应找还给顾客的余额，打印付款收据\n\
    \n## 例3：不细化GUI\n\n### ☑ 过细的GUI描述\n\n- 会员从下拉框中选择类别\n- 会员在相应文本框中输入查询条件\n- 会员点击“确定”按钮\n\
    \n## 例4：分支和循环的描述\n\n- ☑分支：放到备选路径中\n  - 参与者的选择\n  - 另一条成功线路\n  - 系统进行验证\n  - ……\n\
    - ☑循环：直接描述\n\n## 用例文档中的补充约束\n\n☑ 用例重点在于描述功能需求，而其它方面的补充约束：\n\n- 与特定用例相关的补充约束，作为该用例文档中一部分来描述\n\
    - 一些全局性的补充约束，单独形成一份独立的文档，如“补充需求规约”文档\n\n☑ 补充约束\n\n- 字段列表\n- 业务规则\n- 非功能需求\n- 设计约束\n\
    \n## 实例分析：撰写用例文档\n\n- ☑ 用例文档参考模板\n- ☑ 旅店预订系统用例文档\n  - “UC01-预订房间” 用例文档\n  - “UC02-取消预订”\
    \ 用例文档\n- ☑ 旅行申请系统用例文档\n  - “UC01-申请旅游团” 用例文档\n\n## 内容安排\n\n- ☑ 从业务模型获取需求\n- ☑\
    \ 建立用例模型\n- ☑ 编写用例文档\n- ☑ 重构用例模型\n- ☑ 其它问题\n\n## 重构用例模型\n\n☑ 利用用例建模高级技术重构用例模型\n\
    \n- **用例关系**\n  - 通过用例关系将复杂的用例进行适当的分解，以便于提高需求的复用性和可扩展性等，从而使用例模型的结构更合理\n- **用例分级**\n\
    \  - 可以根据用例的重要程度进行分级，以便后续迭代计划的制定，高级别的用例优先考虑\n- **用例分包**\n  - 将相关的用例打包，通过分包的方式可以将用例图分层表示，以用于大规模系统的用例建模\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_292_0.png)\n\n## 用例关系\n\n<<extend>>\
    \ → 扩展\n\n<<include>> → 包含\n\n→ 泛化\n\n## 通过关系整理文档\n\n- ☑ **Extend(扩展)**\n  - 通过扩展用例对基用例增加附加的行为\n\
    - ☑ **Include(包含)**\n  - 基用例中复用被包含用例的行为\n  - 提取公共步骤，便于复用\n- ☑ **Generalization(泛化)**\n\
    \  - 派生用例继承泛化用例的行为并添加新行为\n\n## 用例关系：扩展\n\n扩展：某个用例在特定情况下，包含其他用例(扩展用例)的行为，表示功能被扩展\n\
    \n- 扩展使用带有<<extend>>的虚线表示。此时，箭头由扩展的用例指向原用例，通过扩展点指明在原用例中的扩展位置\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_295_0.png)\n\
    \n## 用例关系：包含\n\n☑ 包含：表示某个用例中包含了其他用例的行为\n\n- 包含用带有 <<include>> 的虚线来表示。此时，箭头由原有的用例指向被包含部分的用例\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_296_0.png)\n\n## 扩展 VS. 包含-1\n\n- 包含：由用例A连向用例B，表示用例A中使用了用例B中的行为或功能\n\
    \  - 包含关系的提出一般是基于用例行为复用的考虑，这也意味着被包含的用例往往被多个基用例引用\n- 扩展：由用例B连向用例A，表示用例A描述了一项基本需求，而用例B则描述了该基本需求的特殊情况，即一种扩展\n\
    \  - 扩展用例的提出是为了将基用例的一些特殊情况分离出来，在保持基用例本身相对完整的情况下（即一般情况都能处理）来处理这些特殊行为\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_0.png)\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_297_1.png)\n\n## 用例关系：泛化\n\n☑ 泛化：表示子用例继承了父用例\n\
    \n- 用例间的泛化关系表明子用例继承父用例中定义的所有属性、行为序列和扩展点，并且参与父用例中所有的关系\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_298_0.png)\n"
