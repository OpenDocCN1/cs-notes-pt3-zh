    # 3.关键抽象


    ☑ 关键抽象是一个通常在需求上被揭示的概念，系统必须能够对其处理


    +   - 来源于业务，体现了业务的核心价值，即业务需要处理哪些信息

    +   - 这些信息所构成的实体即可作为初步的实体分析类

    +   - 具体来源有需求描述、词汇表、特别是业务对象模型

