    \  - 扩展UML构造型的特性，可以用来创建构造型的详述信息\n- 约束(constraint)\n  - 扩展UML构造块的语义，可以用来增加新的规则或修改现有的规则\n\
    - 外廓(profile)\n  - 提供了一组预定义的构造型、标记值、约束和基类，以用于特定领域的建模\n\n## 示例：扩展机制\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_108_0.png)\n\
    \n## 构造型(stereotypes)\n\n### 构造型(stereotypes, 衍型)\n\n- 根据已有的模型元素定义一个新元素\n- 建立在UML已定义的模型元素基础上\n\
    - 可以用于所有的UML模型元素，如类、关联、用例、构件等\n- UML规范提供了一些预定义的构造型\n\n## 构造型的几种表现形式\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_110_0.png)\n\
    \n## OMG提供的Profile\n\nOMG基于Profile机制扩展UML应用\n\n- SoaML (Service oriented architecture\
    \ Modeling Language)\n- SysML (OMG Systems Modeling Language)\n- EAI (UML Profile\
    \ for Enterprise Application Integration)\n- MARTE (UML Profile for Modeling and\
    \ Analysis of Real-time and Embedded Systems)\n- UML Profile for System on a Chip\
    \ (SoC)\n- UML Testing Profile\n- ……\n\n## 外廓图（Profile Diagram）\n\nUML2.2新增的Profile\
    \ Diagram专门用于可视化描述外廓以及构造型、标记值、约束等\n\n### 主要概念\n\n- **Profile:** 一个包，代表一个外廓\n-\
    \ **Stereotype:** 定义一种针对元类的扩展\n- **Metaclass:** 可被扩展的元素\n- **Extension:** 构造型和元类之间的关系\n\
    - **ProfileApplication:** Profile和应用模型之间的关系\n\n## 应用Profile Diagram\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_114_0.png)\n\
    \n## 架构：4+1视图(from RUP)\n\nLogical View\nImplementation View\nUse-Case View\n\
    Process View\nDeployment View\nAnalysts/Designers\nStructure\nEnd-user\nFunctionality\n\
    Programmers\nSoftware management\nSystem integrators\nPerformance\nScalability\n\
    Throughput\nSystem engineering\nSystem topology\nDelivery, installation communication\n\
    \n## 4+1视图(续)\n\n### Use Case View\n\n- End-user: Functionality\n\n这些视图由用例视图所统一，它描述项目干系人（stakeholder）的需求；所有其他视图都是从用例视图派生而来，该视图把系统的基本需求捕获为用例并提供构造其他视图的基础\n\
    \n### Logical View\n\n- Analysts/Designers: Structure\n\n系统功能和词汇；描述问题域的词汇，作为类和对象的集合。重点是展示对象和类是如何组成系统、实现所需系统行为\n"
