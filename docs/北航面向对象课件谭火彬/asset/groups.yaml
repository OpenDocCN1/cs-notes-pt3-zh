    # 模式的三大要素


    ☑ **C. Alexander:** Each pattern is a three-part rule, which expresses a relation
    between a certain **context**, a **problem**, and a **solution**


    +   - 背景（**context**）：那些适合运用该模式的可重现情形

    +   - 问题（**problem**）：出现在背景中的一系列影响力，即目标与约束

    +   - 解决方案（**solution**）：可用于解决问题的经典设计形式或设计规则


