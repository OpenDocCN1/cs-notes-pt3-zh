  - '[PAGE 230]


    # 寻找业务改进点


    从业务流程中获取改进点的思路：


    +   - 信息的自动流转

    +   - 演绎复杂业务逻辑

    +   - 访问和操作业务对象

    +   - 自动工作

    +   - ……'
  - '[PAGE 231]


    # 2. 远景(Vision)


    +   - 系统改进点不等同于软件需求

    +     - 用户根据自身的工作特点和支付能力决定哪些应该改进，哪些不需要改进

    +     - 这就是用户的远景，它表明用户改进的目标，这也将成为项目的目标

    +   - 业务模型描述了“现实是什么”，远景则描述“希望的改进”

    +     - 远景表达了“为什么要开发这个系统”

    +     - 在业务现状(业务模型)下，开发系统是为了达到什么目标？'
  - '[PAGE 232]


    # 定义项目远景


    +   ☑ 远景包含了对待开发系统的目标和约束

    +     ◆ 代表了项目涉及的所有人之间达成的第一个共识

    +     ◆ 是项目核心需求的概览

    +     ◆ 为更详细的技术需求提供了契约性的依据

    +     ◆ 指导团队实现具体的业务目标


    +   ☑ 远景的作用

    +     ◆ 最初，根据项目的远景目标来决定项目是否值得继续

