    \n## 3. 详述业务用例\n- ☑ 业务用例是对业务流程的封装，在业务建模过程中需要逐一描述其内部细节，即详述业务用例\n- ☑ 目的\n  - ◆ 详细说明业务用例的工作流程\n\
    \  - ◆ 说明业务用例的工作流程，以便于客户、用户和涉众理解\n\n## 三种可选技术\n文字\n\n活动图\n\n顺序图\n\n## 选择合适的技术\n\
    - ☑ 只有文字\n  - 不生动，不便于和客户交流\n- ☑ 只有活动图\n  - 难以表达所有细节\n- ☑ 业务用例文档中插入活动图\n- ☑ 活动图中插入文字(+注释+基本路径)\n\
