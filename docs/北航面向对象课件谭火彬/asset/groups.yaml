    # 俗语和术语间的对应


    | 俗语 | 术语 | 例子 |

    |---|---|---|

    | 出了什么事？ | 用例 | 我的一个朋友结了婚。 |

    | 具体事物 | 对象 | 我的一个朋友,他未婚妻... |

    | 事物类型 | 类 | 小伙,姑娘,玫瑰,月老... |

