    \ = new Rectangle();\nr1.setHeight(5);\nr1.setWidth(15);\nresize(r1);\n```\n\n\
    ```java\nRectangle r2 = new Square();\nr2.setHeight(5);\nr2.setWidth(15);\nresize(r2);\n\
    ```\n\n- ✓ 使用父类（长方形）时，程序正常运行\n- ✓ 使用子类（正方形）时，程序陷入死循环\n- ✓ 设计出问题了？继承出问题了？\n\n##\
