    # 5. 处理用例间的关系


    +   - 前面的过程是针对单个用例开展的

    +     - 用例间存在关系时，两个用例的分析过程互相影响


    +   - 包含关系表达了基用例对子用例的直接引用

    +     - 这种引用在分析阶段即表现为基用例实现对子用例实现的交互的引用

    +     - 可以采用UML2所提供的ref片段来表达：即在基用例实现的顺序图中通过ref引用子用例的顺序图片段，以包含子用例实现的行为


    +   - 包含关系具体分析过程如下：

    +     - 为子用例定义一个边界类，该边界类可以看做是基用例对子用例的调用接口，由基用例的控制类来启动该边界类

    +     - 基用例实现通过横向分拆或纵向分拆的方式引用子用例实现的交互'
