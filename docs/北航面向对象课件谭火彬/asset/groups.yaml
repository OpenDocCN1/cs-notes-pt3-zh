  - '[PAGE 308]


    # 何时适用用例建模


    +   - 用例是从参与者角度捕获系统功能，当系统只有一个或者没有参与者时，显然不是非常有效的

    +   - 用例捕获功能需求，因此对于系统的非功能需求不是有效

    +     - 当遇到下述情况时，用例是需求捕获的最好选择

    +       - 系统由功能需求所主导

    +       - 系统具有很多类型的用户，系统对他们提供不同的功能

    +       - 系统具有很多接口

    +     - 当遇到下述情况时，用例是一个糟糕的选择：

    +       - 系统由非功能需求所主导（如： google）

    +       - 系统具有很少的用户

    +       - 系统具有很少的接口（非内部功能）

    +       - 如：嵌入式系统、算法复杂但接口少的系统等'
