    \n食客\n\n吃饭\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_187_2.png)\n\n## 识别业务用例的方法\n\
    - 直接获得：从业务参与者的角度，从外部推导出出来\n- 拼装：从里面往外面看，内部业务流程的目标是什么\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_188_0.png)\n\
    \n## 从业务流程拼装业务用例\n☑ 业务流程\n- 1. 收款人在支票背后签名，写上身份证件号码，把支票和身份证件交给营业员\n- 2. 营业员核对印章正确且证件有效\n\
    - 3. 营业员操作营业受理系统，办理支票兑现手续\n- 4. 营业员把现金和证件交给收款人\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_189_0.png)\n\
    \n## 识别业务用例-支持性事件\n- 不要遗漏支撑性业务流程背后的业务用例\n- 支持性事件\n  - 人员的发展与维护\n  - 业务内部IT的开发与维护\n\
