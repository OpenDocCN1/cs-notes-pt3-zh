    # 利用顺序图进行职责分配


    +   - 以**B-C-E**的方式绘制顺序图，并以**Control**类将控制逻辑隐藏起来

    +   - 可以将对象之间的信息传递以“//”的方式标记，表明初步进行类的职责分配，该项信息尚未制定完全

    +   - 可以利用白话的方式将信息进行的说明，在信息长度不够时，可以加上**UML**的注释来做说明

    +   - 分析阶段顺序图中所找到的对象可以放置到分析阶段的类图上，反之，也可以由分析阶段的类图上找出顺序图中所需的对象'
