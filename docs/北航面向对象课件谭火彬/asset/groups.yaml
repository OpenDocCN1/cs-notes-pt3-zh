  md: "\n## 解决方案\n\n增加新的类，使得每个类仅有一个职责\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_429_0.png)\n\
    \n## ISP(The Interface Segregation Principle, 接口隔离原则)\n\n- 客户不应该依赖他们不用到的方法，只给每个客户它所需要的接口\n\
    - 为了避免 “肥接口(fat interface)”，应当以一个类实现多个接口，而各客户仅仅获知必须的接口\n\n### 接口污染\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_431_0.png)\n\
    \n### 解决方案：分离接口\n\n- 使用委托分离接口：**Adapter模式**\n- 使用多重继承(实现)分离接口\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_432_0.png)\n\
    \n### ISP本质\n\n- 使用多个专门的接口比使用单一的接口好\n- 一个类对另一个类的依赖性应当是建立在最小的接口上的\n- 避免接口污染(Interface\
    \ Pollution)\n\n## DIP(依赖倒置原则，The Dependency Inversion Principle)\n\n- 高层模块不依赖于低层模块，二者都依赖于抽象\n\
    - 抽象不依赖于细节，细节依赖于抽象\n- 针对接口编程，不要针对实现编程\n- 又称控制反转(IoC，Inversion of Control)、依赖注入\n\
    \nBooch：所有结构良好的面向对象架构都具有清晰的层次定义，每个层次通过一个定义良好的、受控的接口向外提供了一组内聚的服务\n\n### 传统的依赖关系\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_435_0.png)\n\n### 符合DIP的系统\n\n依赖的方向\n\
    \n依赖的方向\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_436_0.png)\n\n### 启发式原则\n\n\
    “依赖于抽象”——程序中所有依赖关系都应该终止于抽象类或者接口。\n\n启发式原则：\n\n- 任何变量都不应该拥有指向具体类的指针或者引用\n- 任何类都不应该从具体类派生\n\
    - 任何方法都不应该改写其任何基类中已实现的方法\n\n### DIP经典案例-Mark IV咖啡机\n\nMark IV咖啡机最多可以一次煮好12杯咖啡。使用者首先将滤网（filter）放入滤网支架（filter\
    \ holder）中，将咖啡粉末放入滤网内，将滤网支架滑入托座中。然后，使用者向烧水壶（boiler）内加入最多12杯冷水，按下“加热（Brew）”键，水被加热至沸腾。蒸汽压力将迫使水漫过咖啡粉末，咖啡通过滤网的过滤，流入咖啡壶（pot）中。咖啡壶放在保温托盘（warmer\
    \ plate）上，从而可以在一段时间内保持温度。只有壶中有咖啡时，保温托盘才处于工作状态。如果将壶从保温托盘上拿开，水流将立刻停止，这样煮沸的咖啡就不会溢出到保温托盘上。\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_438_0.png)\n\n### 硬件设施\n\n- 用于烧水壶的加热部件。它可以被开启和关闭\n\
    - 保温托盘的加热部件。它可以被开启和关闭\n- 保温托盘上的传感器。它有三个状态：\n  - warmerEmpty, potEmpty和potNotEmpty\n\
    - 烧水壶中的传感器。它有两个状态：\n  - boilerEmpty和boilerNotEmpty\n- “加热”键。这个键指示加热过程。它上面有一个小指示灯，当加热过程结束，咖啡已经煮好之后，这个灯亮起来\n\
    - 一个压力阀门，当它开启时，烧水壶中的压力降低。压力下降，则经过滤网的水流立刻停止。该阀门可以处于“开启”和“关闭”\n\n### 开始分析、设计工作…\n\
    \n您找到了哪些对象？\n\n您的基本设计想法是怎样的？\n\n### 常见的设计方案\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_441_0.png)\n\
    \n### 泡泡类（Vapor Classes）\n\n- 所谓泡泡类，就是没有带来任何好处的类\n- 封装成类的目的是什么？\n\n考虑Light类：\n\
    \n```\npublic class Light {\n    public void turnOn() {\n        CoffeeMakerAPI.api.setIndicatorState(CoffeeMakerAPI.INDICATOR_ON);\n\
    \    }\n    public void turnOff() {\n        CoffeeMakerAPI.api.setIndicatorState(CoffeeMakerAPI.INDICATOR_OFF);\n\
    \    }\n}\n```\n\n这种类的存在似乎只是让代码变得简洁好看一些。\n\n从实际作用来看，毫无价值。\n\n### 无用的抽象\n\n- 考虑UML类图中的两个继承关系，试着为两个基类（或接口）写出代码\n\
    \n```\npublic interface Heater {\n    public void turnOn();\n    public void turnOff();\n\
    }\npublic interface Sensor {\n    public int sense();\n}\n```\n\n看上去似乎很不错，问题是：谁会使用这两个类？\n\
    \n### 上帝类(God Classes)\n\n- 全部逻辑都集中在**CoffeeMaker**类中，这个类就是整个程序，其他的类都是臆想出来的、没有用的、多余的\n\
    - 这种集中了程序全部或几乎全部逻辑的类，称为上帝类（**God Classes**）\n- 如果你的设计中出现了上帝类，那说明设计得很糟糕\n\n###\
    \ 问题出在哪里？\n\n- 我们按照规范说明来寻找对象，根据对象间的关系来创作类图，这中间出了什么问题呢？\n- 即使我们按照 “用例→交互图→类图” 的步骤来设计，所得到的结果即使有所改善，也不会很明显\n\
    \n抽象！\n\n### 抽象：把握现实世界的本质\n\n- 如何认识世界，这是个哲学认识论的命题，在面向对象设计里却有着至关重要的地位\n- 面向对象的设计目标是提高系统的可维护能力，而如何找到系统的稳定状态呢？\n\
    \n### 抽象：找到系统的本质特征\n\n### 什么是真正的抽象？\n\n- 复读机：实际上是两台相互协作的录音机\n- 洗衣机：水源、衣物、盆、搓衣板、洗衣粉...\n\
