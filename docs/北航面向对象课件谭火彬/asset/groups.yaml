    \ |  |\n| 旅游团 | 各个旅行路线的具体组团；各个线路可组织多次不同的旅游团 | 路线 |\n| 申请 | 参加人提交的旅游团申请表 | 旅游团\
    \ |\n| 支付明细 | 与申请相关的订金、旅费、退费等费用支付信息 | 申请 |\n| 参加人 | 某申请的参加人员信息，分责任人和普通人员两种角色；具体人员还需要区分大人的小孩\
    \ | 申请 |\n| 联系人 | 参加人指定的联系人信息 | 参加人 |\n\n# 构造用例实现\n\n- ☑ 构造用例实现是分析最核心的工作\n  -\
    \ ◆ 获得实现用例行为所必须的分析类\n  - ◆ 利用这些分析类来描述其实现逻辑\n- ☑ 针对每一个用例实现：\n  - ◆ 1. 完善用例文档\n\
    \  - ◆ 2. 识别分析类\n    - ➤ 边界类、控制类和实体类\n  - ◆ 3. 分析交互\n    - ➤ 交互图分析用例实现\n  - ◆\
    \ 4. 完成参与类类图\n    - ➤ 参与用例实现的类的类图\n  - ◆ 5. 处理用例关系\n\n## 1.完善用例文档\n\n- ☑ **需求阶段的用例文档是从用户角度看待用户问题，侧重描述交互的1、4步**\n\
    \n- ☑ **分析阶段则需要从系统角度看待用户问题，重点关注交互的2、3步：即系统如何响应用户请求；此时可以对需求阶段用例文档中系统的处理流程进一步细化**\n\
    \n- \U0001F539 获取理解系统必要的**内部行为**所需的其他信息：从“黑盒”到“白盒”的过渡\n\n- \U0001F539 有些情况下，可能找到一些不正确或不易理解的需求；此时，原始的用例事件流也需要进行更新\n\
    \n# 示例：完善用例文档\n\n- ● 系统显示旅行费用的总额和申请订金金额\n\n- ● 系统根据旅游团价格和参加人情况计算费用总额以及订金金额\n\n\
    ![](img/32b9da3a6e0f048e7dd2e9664c939f9e_341_0.png)\n\n# 什么是分析类\n\n- 分析类代表了“系统中必须具备职责和行为的事物”的早期概念模型\n\
    - 分析类处理主要的功能需求，模型化问题域对象\n- 根据备选构架定义三类分析类\n  - 边界类：系统及其参与者的边界\n  - 控制类：系统的控制逻辑\n\
    \  - 实体类：系统使用信息\n\n# 边界类\n\n- 边界类表示系统与参与者之间的边界\n  - 代表系统与环境的交互\n  - 是接口和外部事物的中间体\n\
    \  - 构造型 <<boundary>>\n- 两类边界类\n  - 用户界面类\n  - 系统和设备接口类\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_345_0.png)\n\
    \n# 示例：识别边界类\n\n☑每对参与者/用例定义一个边界类\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_346_0.png)\n\
    \n# 指南：边界类\n\n- ☑ 关注职责，而不是细节\n- ☑ 用户界面类\n  - ◆ 关注展示给用户的信息\n  - ◆ 不关注用户界面细节\n-\
    \ ☑ 系统和设备接口类\n  - ◆ 关注系统必须定义的协议\n  - ◆ 不关注协议如何实现\n\n# 控制类\n\n- 控制类表示系统的控制逻辑\n\
    \  - 系统行为的协调器\n  - 构造型 <<control>>\n- 识别控制类\n  - 在系统开发早期，为一个用例定义一个控制类，负责该用例的控制逻辑\n\
    \  - 针对复杂用例，可为备选路径分别定义不同控制类\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_348_0.png)\n\
    \n# 示例：识别控制类\n\n通常，每个用例定义一个控制类\n\n随着分析的继续，一个复杂用例的控制类可以发展为多个\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_349_0.png)\n\
    \n"
