  md: "\n## 通信图推荐的使用场合\n\n通信图是一种交互图，而交互图主要用于\n\n- 描述对象之间的动态协作关系（通信图）以及协作过程中的行为次序（顺序图）\n\
    - 常常用来描述一个用例的行为，显示该用例中所涉及的对象以及这些对象之间的协作和消息传递情况\n\n## 通信图与顺序图对比\n\n- 功能完全相同，可以利用工具进行互相转换\n\
    - 侧重点不同，根据实际情况选择一种合适的图进行用例分析和设计\n\n### 顺序图 / 通信图\n\n- 显示了消息的明确顺序\n- 更适用于全部流的可视化\n\
    - 更适用于实时规约和复杂场景\n- 显示除交互之外的关系\n- 更适用于协作模式的可视化\n- 更适用于一个既定对象上的所有效果的可视化\n- 更易于头脑风暴讨论使用\n\
    \n## 用例分析：“加热”用例-2\n\n### “加热”步骤4：加热结束\n\n加热结束后，指示灯应当点亮，停止供应热水。加热结束的消息也应该让ContainmentVessel知道，因为当用户再次将空咖啡壶放到保温托盘上，它必须负责通知UI熄灭指示灯，表明无咖啡可供饮用。\n\
    \nHotWaterSource和ContainmentVessel都有责任通知其他对象加热结束。因为加热结束既有可能是因为烧水壶空了，也有可能是因为咖啡壶满了。\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_457_0.png)\n\n### 异常路径：加热中拿走咖啡壶\n\n\
    在加热过程中，用户突然把咖啡壶从加热托盘上拿开。则ContainmentVessel应当立刻通知HotWaterSource停止继续供应热水（想象在冲咖啡的时候，突然有人把下面的杯子拿开，则你应当立刻停止倾倒热水）\n\
    \n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_458_0.png)\n\n## 用例分析：更多用例……\n\n“保温”用例中的备选路径：**咖啡耗尽**\n\
    \n用户将咖啡壶中的咖啡倒光，然后将空咖啡壶放到保温托盘上，咖啡机应当将指示灯关闭，表示没有咖啡可供饮用\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_459_0.png)\n\
    \n## 我们得到的是“咖啡机”\n\n- 所有这三个类与“Mark IV咖啡机”这一特殊产品没有任何直接关系\n- 这正是我们所期望的——我们得到了真正的抽象，把握住了问题的本质\n\
    - 下面要做的，是根据这个抽象来实现 **Mark IV咖啡机**\n\n## 以MarkIV角度审视用例\n\n“加热”用例的路径“开始加热”中，用户按下“加热”键，导致一系列动作，这些动作在MarkIV中如何实现？\n\
    \n### start(), isReady()如何实现？\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_462_0.png)\n\
    \n## 添加操作后的系统类图\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_463_0.png)\n\n## 操作如何实现具体？\n\
    \n- 要是系统运行在MarkIV型咖啡机上，则必须调用相应的硬件接口！\n- Start:\n  - UserInterface如何知道“加热”键被按下？显然是通过调用CoffeeMakerAPI.getBrewButtonStatus()得到的\n\
    - IsReady\n  - HotWaterSource和ContainmentVessel都不知道如何判断，所以其中isReady方法都只能是抽象方法\n\
    - 为了实现这些操作，必须添加相应的硬件API代码，而这些代码实现应该放在何处\n\n## 利用泛化(实现)关系添加细节\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_465_0.png)\n\
    \n抽象类的抽象操作，保持该类的稳定性，满足OCP\n\n具体的代码实现交由具体类来实现\n\n## 解决方案\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_466_0.png)\n\
    \n## 这就是DIP\n\n![](img/32b9da3a6e0f048e7dd2e9664c939f9e_467_0.png)\n\n《abstract》\n\
    **UserInterface**\n- start()\n\n《abstract》\n**HotWaterSource**\n- isReady()\n\n\
    《abstract》\n**ContainmentVessel**\n- isReady()\n\n**MarkIVUI**\n- start()\n\n\
    **MarkIVCV**\n- isReady()\n\n**MarkIVHWS**\n- isReady()\n\n## DIP的本质\n\n- 通过抽象提取业务本质，并建立一个稳定的结构描述这个本质\n\
    - 对于具体的业务规则的处理是在这个本质的基础上的扩展\n- 技术、工具、意识形态等的发展可能使业务规则不断变化，但本质不变；而DIP则帮助我们轻松的适应这些变更\n\
