    \n## 识别实体类\n\n☑分析用例事件流中的**名词、名词短语**，找出系统所需的实体对象，这些名词可能是：\n\n- 对象、对象的特征和状态\n- 参与者、描述信息、系统之外的\n\
    \n☑从这些名词、名词短语中进行筛选，抽取出系统对象，并抽象成类\n\n- 综合考虑在系统中的意义、作用和职责\n\n☑对于所识别的类进行命名\n\n##\
    \ 指南：名词筛选法识别实体类\n\n名词筛选法识别实体类的基本思路：\n\n- 将用例文档作为输入，找出文档中的名词或名词性短语，形成了实体类初始候选列表\n\
    - 合并那些含义相同的名词\n- 删除那些系统不需要处理的名词\n- 删除作为参与者的名词\n- 删除与实现相关的名词\n- 删除那些作为其它实体类属性的名词\n\
    - 对剩余的名词，综合考虑它在当前用例以及整个系统中的含义、作用以及职责，并基于此确定合适的名字，作为初始实体类存在\n\n## 实体类的其它来源\n\n\
