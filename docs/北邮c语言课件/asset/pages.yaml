  md: '# (3) 指针变量的引用


    +   ① *指针变量名——代表所指变量的值。

    +   ② 指针变量名——代表所指变量的地址。


    有定义： int a,*p=&a;


    用*p来表示p指向的对象a,*p与a是等价的。


    *p可以象普通变量一样使用。 例如：


    ```

    a=12;

    *p=12;

    scanf("%d",&*p);  scanf("%d",p);

    printf(" %d%d" ,*p,a);

    ```


    注意：*与&具有相同的优先级，结合方向从右到左。这样，&*p即&(*p),是对变量*p取地址，它与&a等价；p与&(*p)等价，a与*(&a)等价。'
