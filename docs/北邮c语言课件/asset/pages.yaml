  md: '# 8.6 程序举例


    例8.12 输入一个十进制正整数，将其转换成二进制、八进制、十六进制数输出


    分析：


    +   (1) 将十进制数n转换成r进制数的方法是：n除以r取余数作为转换后的数的最低位。若商不为0，则商继续除以r，取余数作为次低位……，以此类推，直到商为0为止。


    +   (2) 对于十六进制数中大于9的六个数字是用A, B, C, D, E, F来表示。


    +   (3) 所得余数序列转换成字符保存在字符数组a中。


    +   (4) 字符 ‘0’ 的ascii码是48，故余数0~9只要加上48就变成字符 ‘0’ ~ ‘9’ 了；余数中大于9的数10~15要转换成字母，加上55就转换成
    ‘A’、‘B’、‘C’、‘D’、‘E’、‘F’ 了。


    +   (5) 由于求得的余数序列是低位到高位，而屏幕显示先显示高位，所以输出数组a时要按顺序逆序输出'
