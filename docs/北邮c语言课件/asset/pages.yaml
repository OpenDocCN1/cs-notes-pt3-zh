  md: '# 表达式值的类型


    # type格式


    字符型（char、unsigned char）


    %c、%d、%u、%o、%x


    整型（int、unsigned）


    %d、%u、%o、%x、%c


    （long、unsigned long）


    %ld、%lu、%o、%x、%c


    实型（float）


    %f、%e、%g


    （double）


    %lf、%e、%g


    字符串（字符串常量、字符数组）


    %s


    在字符型和整型之间，输出的type格式是可以互换的，而与实型及字符串型则不能。


    在%与type字符之间加一个字符l表示输出长整型或双精度型数据的值。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 2. .prec


    %f与%lf的输出格式都是在小数点后保留六位数，有余四舍五入，缺少以0补足。


    在C语言中，输出实数时可以用在%与type符之间加入.prec的格式来控制输出的小数位数。


    例：


    ```

    printf("%.3f, %.2f", 3.1415926 , 3);

    ```


    输出为： 3.142 , 3.00


    .prec也可以加在%与整型、字符型type符之间，意义各不一样，此处不作介绍。'
  merge: -1
  img_proc: true
