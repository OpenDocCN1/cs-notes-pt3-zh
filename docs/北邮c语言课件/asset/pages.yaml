    \   int i=1,s=0;\n    for(;i<=99;)\n    {s=s+i;i++;}\n    printf(\"s=%d\",s);\n\
    ```\n\n> 注意：表达式省略，分号不省略。\n\n> 表达式2也可以省略\n> 但在循环体中要借助\n> break语句来实现循环\n> 环的结束，我们将在\n\
