- pgno: 193
  md: '# 递归方法求n!


    算法：由于 n! = n*(n-1)! 是递归定义

    且 0! 值为1

    递归调用求n!如下：


    ```

    long jc(long x)

    { long a;

    if(x==0) a=1;

    else a=x*jc(x-1);

    return a;

    }

    main()

    { long n;

    scanf("%ld",&n);

    printf("\n%ld",jc(n));

    }

    ```


    函数jc是求x的阶乘，由于x!=x*(x-1)!(当x!=0)，在函数jc中又调用了函数jc本身，这就是函数的递归调用。'
  merge: -1
  img_proc: true
