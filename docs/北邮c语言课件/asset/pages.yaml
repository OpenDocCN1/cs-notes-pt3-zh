  md: '# 例：求3~150中所有素数的和。


    # 算法分析：


    +   1. 用变量a从3到150循环，每次值增加1

    +   2. 用变量i从2到a-1循环，每次值增加1

    +   3. 若a%i==0，结束i的循环，执行第4步

    +   4. 若i==a，把a累加到s上。

    +   5. 输出s的值


    > 注意：此题中执行第4步时有两种情况。第一种：在第3步中发现了满足a%i==0的情况，直接跳出了i的循环，此时的i一定是在2到a-1中间的一个值，而且a不是素数。第二种：一直没有发现满足a%i==0的i，在i==a时，不再满足i循环的执行条件，i循环结束，此时的a是素数！'
