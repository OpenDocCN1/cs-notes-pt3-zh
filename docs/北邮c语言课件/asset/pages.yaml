  md: '# 例：求兔子问题


    第1个月有1对兔子


    每对兔子从出生后第3个月起，就可每个月生1对兔子


    问第n个月有多少对兔子？


    # 算法分析：设第n个月有 f(n) 对兔子


    根据题意有 $f(1)=0， f(2)=1$


    ```

    $$f(n)=f(n-1)+f(n-2)$$

    ```


    可看出每个月兔子的个数也是一种递归定义


    可以用递归法编写函数 f 求第 x 个月的兔子的个数'
