    \    for(n=1;n<=30;n++)\n    {  s=s+(float)i/j;\n        c=i;\n        i=j+1;\n\
    \        j=c+j;\n    }\n    printf(\"\\n%f\",s);\n}\n```\n\n此题中的n与循环体中的执行语句没有数值上的联系，仅仅用做决定循环执行的次数。"
