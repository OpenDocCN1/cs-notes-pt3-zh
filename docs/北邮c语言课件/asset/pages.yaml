- pgno: 138
  md: '# for、while、do-while的比较


    所有需要用到循环结构的程序，都可以用for、while、do-while中的任何一个来实现，区别只在于某些问题用哪种语句更方便。


    比如求1+2+...+99的问题我们也可以分别用 while与do-while语句编写如下：


    # 用while:


    # 用do-while:


    ```

    #include<stdio.h>

    main()

    { int i=1,s=0;

    while(i<=99)

    {s=s+i; i++;

    }

    printf("\ns=%d",s);

    ```


    ```

    #include<stdio.h>

    main()

    { int i=1,s=0;

    do{s=s+i;

    i++;

    }while(i<=99);

    printf("\ns=%d",s);

    }

    ```'
  merge: -1
  img_proc: true
