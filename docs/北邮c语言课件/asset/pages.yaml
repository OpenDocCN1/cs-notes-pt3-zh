  md: '例：已知 a>b>c>0，a、b、c 均为整数，且 a+b+c<100，求满足 1/a²+1/b²=1/c² 的 a、b、c 共有多少组？


    # 算法分析：


    这是一道典型的三重嵌套循环的题目。a、b、c 都是位于1到99之间整数。编程的基本思路是：找出1到99之间的所有 a、b、c 的排列，察看同时满足 a>b>c、a+b+c<100、1/a²+1/b²=1/c²
    这三个条件的 a、b、c 有多少组。


    值的注意的是，1/a²+1/b²=1/c² 这个条件并不能简单的原样照写，因为在求分数的过程中必然有四舍五入，不能得出真正的准确的结果。必须把条件变形成：c²(a²+b²)=a²b²才能得出正确的结果。


    +   1. a从1到99循环

    +   2. b从1到99循环

    +   3. c从1到99循环

    +   4. 若 a>b && b>c && a+b+c<100 && c*c*(a*a+b*b)==a*a*b*b，统计找到了 一组

    +   5. 输出找到的组数'
