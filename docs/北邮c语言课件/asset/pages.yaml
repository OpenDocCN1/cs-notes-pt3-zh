  md: '数组名做函数参数时是把实参数组的起始地址传给了形参数组，即：**形参数组和实参数组对应同一段内存单元**。利用这个特点，可用数组返回多个值。


    # 例7.13 用冒泡法将10个数按由小到大排序


    冒泡法的基本思想：**相邻两数比较，若前面数大，则两数交换位置，直至最后一个元素被处理，最大的元素就“沉”到最下面，即在最后一个元素位置。这样，如有n个元素，共进行n-1轮，每轮让剩余元素中最大的元素“沉”到下面，从而完成排序。**


    事实上，n-1轮是最多的排序轮数，只要在某一轮排序中没有进行元素交换，说明已排好序，可以提前退出外循环，结束排序。'
