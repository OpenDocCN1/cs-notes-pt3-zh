- pgno: 134
  md: '从上面的程序我们看到， for语句中：


    表达式1： 通常是给循环变量赋初值


    表达式2： 循环是否继续执行的判别表达式，这个表达式通常与某一个（或多个）变量的值有关，随着这个（些）变量的值的改变，表达式的结果发生变化，这个（些）变量被称为循环因变量。


    表达式3： 通常用于改变循环因变量的值。


    在某些情况下， for语句中的表达式1、2、3都可以省略，而改用其他的方式来实现这些功能。我们还用上面的例子说明for语句省略表达式的情形。'
