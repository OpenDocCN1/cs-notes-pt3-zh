    创建 一个新文件。


    # 1、文件的打开(fopen)函数


    形式： FILE * fopen ( char *filename, char *mode) ;


    +   - filename: 文件名(可以包含驱动器、路径、文件名、扩展名)


    +   - mode: 打开方式


    +   - FILE *: 返回值


    1)如果成功打开，返回一个指向被打开文件的文件信息区的起始地址；


