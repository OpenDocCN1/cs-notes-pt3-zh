  md: "# 读／写函数的选用原则：\n\n从功能角度来说，fread()和fwrite()函数可以完成文件的任何数据读／写操作。但是为方便起见，依下列原则选用：\n\
    \n+   1) 读／写1个字符（或字节）数据时：选用fgetc()和fputc()函数。\n+   \n+   2) 读／写1个字符串时：选用fgets()和fputs()函数。\n\
    +   \n+   3) 整体读／写结构体或数组时：选用fread()和fwrite()函数。\n+   \n+   4) 读／写1个（或多个）合格式的数据时：选用fscanf()和fprintf()函数。"
