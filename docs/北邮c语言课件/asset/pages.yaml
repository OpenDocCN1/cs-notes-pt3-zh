    +   - 静态变量

    +   - 动态变量


    静态存储类型的变量的生存期为程序执行的整个过程，在该过程中占有固定的存储空间，通常称它们为永久存储。


    动态存储类型变量只生存在某一段时间内。例如，函数的形参和函数体或分程序中定义的变量，只是在程序进入该函数或分程序时才分配存储空间，当该函数或分程序执行完后，变量对应的存储空间又被撤销了。


    # 2. C语言中每一个变量有两个属性：数据类型、存储特性


    完整的变量定义：[存储特性][数据类型] 变量名;'
