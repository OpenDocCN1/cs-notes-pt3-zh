    如:a[0]又包含:a[0][0],a[0][1],a[0][2],a[0][3].

    a代表第0行的首地址,a+1代表第1行的首地址,a+2代表第2行的首地址.每行存放4个整型数据(即1个元素占2个字节),因此,这里+1的含义是:+4*2=+8个字节.'
