  md: '# 5.4.1 break语句


    一般形式：


    ```

    break;

    ```


    它的作用是把流程转向所在结构之后。在 switch分支结构中，使用break语句可以使流程跳出switch分支结构。同样的，在循环结构中，使用break语句使流程跳出当前的循环层,转向执行该循环结构后面的语句。'
  merge: -1
