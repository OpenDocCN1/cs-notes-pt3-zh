  md: "# 1. 省略表达式1：\n\n```\n#include<stdio.h>\nmain()\n{\n    int i=1,s=0;\n    for(;i<=99;i++)\n\
    \        s=s+i;\n    printf(\"s=%d\",s);\n}\n```\n\n# 2. 省略表达式3：\n\n```\n#include<stdio.h>\n\
    main()\n{\n    int i,s=0;\n    for(i=1;i<=99;)\n    {s=s+i;i++;}\n    printf(\"\
