  md: '# 汉诺塔问题


    汉诺塔是一个很繁杂的游戏，但可以用递归的方法异常简单的完成。


    ![](img/609af85bac45577917bd36819bca122b_196_0.png)


    有A、B、C三个柱子，其中一个柱子上从上到下，按从小到大的顺序叠放着n个盘子，要想把法把所有盘子从A柱移动到C柱，也按从小到大的顺序从上到下叠放。


    +   规则：

    +   (1) 一次只能移动一个盘子

    +   (2) 大的不能放在小的上面

    +   (3) 只能在三个柱子中移动


    假设盘子按从小到大的顺序编号为1到n，要求编程按操作顺序把每次移动的盘子的编号及移动方式（从哪个柱子到哪个柱子）输出。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '要把n个盘子从A通过B移动到C，分为三步：


    +   1. 把n-1个盘子从A通过C移动到B

    +   2. 把第n个盘子从A移动到C

    +   3. 把n-1个盘子从B通过A移动到C


    我们注意到，在这三步中的第1步和第3步，是把n-1个盘子从一个柱子通过一个柱子移动到另一个柱子的过程。


    抽象的看，把x个盘子从I柱通过K柱移动到J柱的过程，分为以下步骤：

    （其中x、I、J、K为待定值，x的范围是1~n，I、J、K的范围均是A、B、C）


    +   当x!=1时，步骤为三步：

    +   1. 把x-1个盘子从I通过J移动到K

    +   2. 把第x个盘子从I移动到J

    +   3. 把x-1个盘子从K通过I移动到J


    当x==1时，把第x个盘子从I移动到J


    这是一个递归定义的过程！


    通过上面的分析，我们定义函数f（long x,char I,char K,char J），其作用是实现把x个盘子从I柱通过K柱移动到J柱的过程。程序见下：'
  merge: -1
  img_proc: true
- pgno: 198
  md: "# 汉诺塔程序如下：\n\n```\nvoid f(long x,char I,char K,char J)\n{ if(x==1)\n    printf(\"\
    \\t%d %c→%c\",x,I,J);\n  else\n  { f(x-1,I,J,K);\n    printf(\"\\t%d %c→%c\",x,I,J);\n\
    \    f(x-1,K,I,J);\n  }\n}\nmain()\n{ long n;\n  void f(long x,char I,char K,char\
    \ J);\n  scanf(\"%ld\",&n);\n  f(n,'A','B','C');\n}\n```"
