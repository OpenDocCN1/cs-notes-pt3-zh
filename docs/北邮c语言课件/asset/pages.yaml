  md: "例：用牛顿迭代法求方程$f(x)=2x^3-4x^2+3x-7=0$在$x=2.5$附近的实根，直到满足$|x_n-x_{n-1}|<10^{-6}$为止。\n\
    \n牛顿迭代公式为：$x_n=x_{n-1}-f(x_{n-1})/f'(x_{n-1})$\n\n# 算法分析：\n\n牛顿迭代法认为，以任意一个$x$的初值开始，都可以根据牛顿迭代公式$x_n=x_{n-1}-f(x_{n-1})/f(x_{n-1})$求出一串$x$的序列，这个序列将越来越趋向于某一个值，这个值就是方程$f(x)$的一个实根。\n\
    \n```\n```c\n#include<stdio.h>\n#include<math.h>\nmain()\n{\n    float x=2.5,x0,f,f2;\n\
    \    do{\n        x0=x;\n        f=2*x0*x0*x0-4*x0*x0+3*x0-7;\n        f2=6*x0*x0-8*x0+3;\n\
    \        x=x0-f/f2;\n    }while(fabs(x-x0)>=1e-6);\n    printf(\"%f\",x);\n}\n\
    ```\n```"
