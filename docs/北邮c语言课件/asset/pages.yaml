  md: '# (2) 自增自减运算


    指针变量自增、自减运算具有上述运算的特点，但有前置后置、先用后用的考虑，务请小心。例如：


    ```

    int a[10], *p=a, *x;

    ```


    ```

    x=p++; /* x第一个元素分量， p指向第二个元素*/

    ```


    ```

    x=++p; /* x、 p均指向数组的第二个分量*/

    ```


    * p++相当于* (p++)。


    * (p++) 与 (*p) ++ 含义不同，前者表示地址自增，后者表示当前所指向的数据自增。'
