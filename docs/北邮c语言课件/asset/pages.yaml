  md: '# 8.5 指针数组与命令行参数


    # 8.5.1 指针数组


    指针数组：是指针变量的集合。即它的每一个元素都是指针变量，且都具有相同的存储类别和指向相同的数据类型。


    指针数组的定义形式为：


    类型标识符 *数组名[数组长度说明];


    例如： int *p[10];


    由于[]比*的优先级高，因此p先与[10]结合成p[10]，而p[10]正是数组的定义形式，共10个元素。最后p[10]与*结合，表示它的各元素可以指向一个整型变量。


    注意:指向一维数组的指针变量int (*p)[4];

    与指针数组int *p[4];的区别'
