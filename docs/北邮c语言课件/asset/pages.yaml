  md: "# 看一个简单的函数调用例子：\n\n输出右图所示图形，其中，第一行为一个*，第二行为两个*，第n行为n个*。\n\n算法：编写一个在一行输出x个*的函数。在主函数中调用此函数实现右边图形的输出。\n\
    \n```\nvoid f( long x )\n{ long I;\n    for(I=1;I<=x;I++)\n        printf(\"*\
    \ \");\n    printf(\"\\n\");\n}\nmain()\n{ long n,I;\n    void f(long x);\n  \
    \  scanf(\"%ld\",&n);\n    for(I=1;I<=n;I++)\n        f(I);\n}\n```\n\n![](img/609af85bac45577917bd36819bca122b_184_0.png)\n\
    \n> 在左边的程序中，f是一个自定义函数，实现的功能是输出x个*号，其中x的值由该函数被调用时赋予的值来确定。\n> \n> main函数中，用I从1到n循环，每次调用f(I)，即把I的值赋给函数中的x，实现输出I个*的功能。"
