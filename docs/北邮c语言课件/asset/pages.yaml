- pgno: 46
  md: '# 结合性：自右至左。


    如： i = 2;

    j = -i++;    求执行完这两句后i与j的值分别是多少


    分析： “++”与“-”是同优先级，且都高于“=”


    按结合规则，等价于： j=-(i++);


    结果： i的值为3，j的值为-2。


    # 再看几个例子：


    如：设i=3, k=(i++)+(i++)+(i++)        k= 9   i= 6


    如：设a=3, b=(a++)+(a++)        b= 6   a= 5


    设a=3, b=(++a)+(a++)        b= 8   a= 5


    设a=3, b=(a++)+(++a)        b= 8   a= 5


    设a=3, b=(++a)+(++a)        b= 10   a= 5


    特殊的：设i=3, j=4, k=i+++j,        k= 7   i= 4   j= 4


    ![](img/609af85bac45577917bd36819bca122b_46_0.png)'
  merge: -1
