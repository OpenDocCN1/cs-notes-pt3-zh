    +   (1) 指针加或减一个整数n，计算结果仍然是上一个地址量，它是以运算数的地址量为基点，前方或后方第n个数据的地址。


    +   (2) 指针的算术运算只允许加减运算，不允许乘除及移位运算，不允许两个指针之间进行加运算，也不允许指针加减实型数据。


