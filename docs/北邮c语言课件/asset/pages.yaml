  md: '# 例：求 1+2 +...+99


    分析：用变量i从1到99循环，把i的值累加到变量s中，最后输出s的值。


    程序如下：


    ```

    #include<stdio.h>

    main()

    { int i,s=0;

    for(i=1;i<=99;i++)

    s=s+i;

    printf("s=%d",s);

    }

    ```


