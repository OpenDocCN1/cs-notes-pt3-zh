- pgno: 260
  md: '# 7.1 一维数组


    # 7.1.1 一维数组的定义


    一维数组：只有一个下标的数组。


    定义格式：


    存储类别 类型标识符 数组名[元素个数];


    说明：


    +   1. 存储类别：说明数组的存储属性，即数组的作用域与生成期，可以是静态型（static），自动型（auto）及外部型（extern）。当使用auto型时可以省略。我们现在所用都是auto型，故省略。


    +   2. 类型标识符：数组元素的类型。Int、long、char、float、double等。


    +   3. 数组名的命名规则：与标识符的命名规则相同。


    +   4. 数组“元素个数”：即数组长度，只能是一个整型常量表达式。可以是符号常量。'
  merge: -1
  img_proc: true
