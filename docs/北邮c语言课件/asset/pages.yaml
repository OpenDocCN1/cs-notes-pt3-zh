- pgno: 141
  md: '例：有数列 2/3、4/5、6/9、10/15……求此数列前30项的和。


    # 算法分析：


    对于数列的题，首先要找出通项公式，或前后项的计算关系公式，根据公式求所需。由于数列的题一般执行次数能确定，用for语句来编写比较方便。


    此题，前后项的关系是：后一项的分子是前一项的分母加1，后一项的分母是前一项的分子加分母。解题思路是用循环语句求各项，并把值累加，因为是求前30项的和，循环执行30次。


    +   1. 初值 i=2, j=3, s=0;

    +   2. 用 n 从 1 到 30 循环

    +   3. s=s+i/j;

    +   4. c=i; i=j+1; j=c+j;

    +   5. 输出 s;'
  merge: -1
  img_proc: true
- pgno: 142
