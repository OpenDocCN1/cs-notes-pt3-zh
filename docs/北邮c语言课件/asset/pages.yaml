  md: '# (4)extern型


    +   • 引用：extern 类型 变量名;


    +   • 如果某个模块文件中要用到另一个模块文件中的全局变量，就要用extern说明


    例如：程序模块file1.c中定义了全局变量


    ```

    int s;

    ```


    而在另一个程序模块file2.c中的函数fun1()中需要使用这个变量s。为此，可以在file2.c的函数fun1()中加上外部变量说明语句：


    ```

    fun1()

    { extern int s; /*表明变量s是在其他文件定义的*/

    ......

    }

    ```


    +   • 定义时分配内存,其他文件引用时不再分配内存.'
