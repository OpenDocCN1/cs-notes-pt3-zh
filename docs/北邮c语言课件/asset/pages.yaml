- pgno: 448
  md: '# ## 二、数据文件的存储形式


    数据文件用于保存数据，其读写往往由应用程序实现。


    +   1、**字符文件：**也称文本文件或正文文件，其数据以字符的形式出现，每个字符用一个 ASCII 代码（占一个字节）表示。


    +   2、**二进制文件：**以数据在内存中的形式原样存于磁盘。


    在 Turbo C 中，二进制文件中，整型数用2个字节表示，长整型用4个字节表示，实型数（浮点数）用4个字节，双精度数用8个字节表示。'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# 第10章 文件


    例: 十进制整数10000，在内存中占两字节，其存放形式是：0010,0111,0001,0000。在二进制文件中也按这种方式存放，占2个字节。在ASCII文件中，存放为31H、30H、30H、30H、30H，占5个字节，它们分别是1、0、0、0、0字母的ASCII码。


    ![](img/609af85bac45577917bd36819bca122b_449_0.png)'
