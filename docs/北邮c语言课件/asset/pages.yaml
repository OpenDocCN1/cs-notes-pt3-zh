- pgno: 147
  md: "# 例：下面这个程序，想想它实现的是什么功能？\n\n```\n#include<stdio.h>\nmain()\n{ int i,s=0;\n \
    \   for(i=1;i<=100;i++)\n    {if(i%5==0) continue;\n        s=s+i;\n    }\n  \
    \  printf(\"\\n%d\",s);\n}\n```\n\n在左边的程序中，i从1到100循环，当i是5的倍数时，直接进入下一个i,当i不是5的倍数时，把i累加到s，最后输出s。所以，这个程序实现的是求1~100中间所有非5的倍数的数之和。\n\
