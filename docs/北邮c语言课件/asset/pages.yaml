  md: '# 2. 通过指针引用数组元素


    ```

    *p=5;

    ```


    表示对p当前所指的数组元素赋以一个值5。


    C规定:p+1指向数组的下一元素(而不是将p值简单地加1)。p+1意味着使p的原值（地址）加d个字节（d为一个数组元素所占的字节数）。


    引用的形式：


    如果p的初值为&a[0],则：


    +   （1） p+i和a+i就是a[i]的地址，或者说它们指向a数组的第i个元素（见下页图）。

    +   （2） *(p+i)或*(a+i)是p+i或a+i所指向的数组元素，即a[i]。

    +   （3） 指向数组的指针变量也可以带下标，如p[i]与*(p+i)、a[i]等价。'
