  md: '# 8.1.3 指针运算


    指针运算实际上是地址的计算，包括赋值运算、算术运算、关系运算三种。


    # 1. 指针的赋值运算


    （1）将变量地址值赋给指针变量，使指针指向该变量。


    设有如下定义：


    ```

    int a,b,*pa,*pb;

    float *pf;

    ```


    第一行定义了整型变量a,b及指针变量pa,pb。pa、pb还没有被赋值，因此pa、pb没有指向任何变量，下面语句完成对pa,pb的赋值：


    ```

    pa=&a;    pb=&b;

    ```'
