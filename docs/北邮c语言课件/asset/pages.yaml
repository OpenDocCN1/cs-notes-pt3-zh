- pgno: 137
  md: '# 例：求 1/100+2/99+...+1


    分析：用变量i从1开始循环，每次增加1；用变量j从100开始循环，每次减少1。累加i/j的值到s中。当i>j时结束循环（即i<=j时继续循环）。最后输出s。


    程序如下：


    ```

    #include<stdio.h>


    main()

    { int i,j;


    float s=0;


    for( i=1,j=100 ; i<=j ; i++,j--)


    s=s+(float)i/j;


    printf("\ns=%f",s);

    }

    ```'
