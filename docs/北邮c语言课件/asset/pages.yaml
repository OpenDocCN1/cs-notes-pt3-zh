    ```

    pa=0; 或: pa=''\0'';

    ```


    这里指针pa并非指向0地址单元，而是具有一个确定的“空值”，表示pa不指向任何变量。


    注意：指针虽然可以赋值0，但却不能把其它的常量地址赋给指针。例如： pa=4000; 是非法的。'
