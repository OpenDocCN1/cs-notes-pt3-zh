  md: '# 2.带实参的宏名被展开


    宏名被所定义的宏体替换，宏体中的形参按从左到右的顺序被实参替换。


    例如： area = S (3,2);

    PR(area);


    展开为：


    ```

    area=3*2;

    ```


    PR(area) 展开的结果是： printf(" s=%f\n", area);


    # •宏定义与函数的区别


    +   (1) 引用宏只占编译时间，不占运行时间。

