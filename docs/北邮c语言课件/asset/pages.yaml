  md: '# 3、局部变量


    +   ♣ C语言程序是由函数组成的，有且只能有一个main函数。

    +   ♣ 变量定义可以出现在函数内，亦可出现在函数外或者是函数的参数中。


    # 按照变量定义语句出现的位置，可以分为：


    **局部变量**：在函数或复合语句内定义；

    只在该函数或复合语句中才能使用。


    **全局变量**：在函数外定义；

    从它被定义的位置起，在之后的所有函数中有效。


    **形式参数**：定义为函数的参数；

    只在该函数中才能使用。'
