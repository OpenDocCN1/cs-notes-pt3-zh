- pgno: 148
  md: '# 5.5 循环的嵌套


    循环体语句可以是任何形式的语句，简单语句、空语句、复合语句、流程控制语句都可作为循环体语句。


    当循环体语句又是一条循环语句，或作为循环体的复合语句中又包含循环语句时称为循环的嵌套。嵌套可以是两层或多层。While、do-while、for三种循环都可以互相嵌套。'
