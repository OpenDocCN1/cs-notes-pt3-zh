- pgno: 453
  md: '# 11.2 标准文件操作


    # 一、标准文件FILE结构指针


    要调用一个文件，需要有以下的信息：


    +   - 文件当前的读写位置

    +   - 与该文件对应的内存缓冲区的地址

    +   - 文件操作方式等


    1、每个被使用的文件都在内存中开辟一个区，用来存放文件的有关信息。这些信息是保存在一个结构体类型的变量中。该结构体类型是由系统定义的，取名为FILE。


    2、标准文件系统借助FILE数据结构对文件进行管理，利用文件指针读写文件。每当程序成功打开一个文件，系统就在内存建立一个与该文件对应的FILE结构体变量，并返回该变量的指针（地址）。'
  merge: -1
  img_proc: true
- pgno: 454
  md: "# 第10章 文件\n\n3、在程序中定义一个**指针变量**，用以**保存已打开文件**所对应的**FILE结构在内存的地址**，此后用户程序就可用此FILE指针来实现对指定文件的存取操作。定义文件指针变量的一般形式为：\n\
    \n```\nFILE *文件结构指针变量名\n例如：FILE *fp;\n```\n\n**注意：**\n\n+   1) 只有通过文件指针，才能调用相应的文件。\n\
    +   \n+   2) 对文件操作的库函数，函数原型均在头文件stdio.h中。\n+   \n+   3) 文件操作的过程：对磁盘文件的操作必须“先打开，再读写，最后关闭”。"
