- pgno: 145
  md: "例：前面讲到的计算1+2+…+99的程序，可以同时省略for循环的三个表达式，改写成如下形式：\n\n```\nmain()\n{\n    int\
    \ s=0,i=1;\n    for ( ; ; )\n    {\n        if (i>99)    break;\n\n        s =\
    \ s+i;    i++;\n    }\n    printf(\"s=%d\",s);\n}\n```\n\n> 本程序中，当i>99时，利用break语句强行终止for循环，继续执行for语句后的下一条语句。"
