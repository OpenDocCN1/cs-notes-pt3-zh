- pgno: 472
  md: '# 四、标准文件的定位函数


    文件中有一个位置指针，指向当前读写的位 置。我们可以使用有关函数来改变其位置，以完成文件的随机读写。


    # fseek()函数：


    调用形式为： fseek（文件类型指针，位移量，起始点）


    说明： 位移量一般是long型数据；起始点用0、1或2表示；


    | 起始点位置及其代表符号对应表 |

    | 起始点具体位置 | 符号代表 | 数字代表 |

    | 文件的开头 | SEEK-SET | 0 |

    | 文件指针现行位置 | SEEK-CUR | 1 |

    | 文件尾 | SEEK-END | 2 |


    函数的作用： 是使文件指针移动到所需的位置；若调用成功，返回值为0；否则返回一个非零值。'
  merge: -1
  img_proc: true
- pgno: 473
  md: '例如： fseek(fp,20L,0);


    把文件指针从文件开头移到第20个字节处。


    ```

    fseek(fp,-20L,2);

    ```


    把文件指针从文件尾向前移动 20 个字节。


    # ftell()函数：


    调用形式为： ftell(文件类型指针)


    函数的作用： 得到文件指针离开文件起点的字节数。若调用不成功，返回-1L，表示出错。


    例如： long i;


    ```

    i=ftell(fp); if(i==-1L) printf("error\n");

    ```


    # rewind()函数：


    调用形式为： rewind(文件类型指针)


    函数的作用： 用于把文件指针移到文件的开头。移动成功时，返回值为0，否则返回一个非零值。'
  merge: -1
