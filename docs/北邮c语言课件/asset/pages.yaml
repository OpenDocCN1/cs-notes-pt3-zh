  md: '# 2. 指针的算术运算


    指针变量做++、--、+、-等运算，指针增量的运算不是单纯的算术运算，而是地址按数据个数增加所指目标变量字节个数。


    （1）加减运算：一个指针可以加、减一个整数n，其结果与指针所指对象的

    数据类型有关。指针变量的值应增加或减少“n×sizeof(指针所指对象的类型)”。


    加减运算常用于数组的处理，对指向一般数据的指针，加减运算无实际意义。


    ```

    例如： int a[10], *p=a, *x;


    x=p+3; /*实际上是p加上3*2个字节赋给x*/

    ```


    ![](img/609af85bac45577917bd36819bca122b_344_0.png)'
  merge: -1
