- pgno: 30
  md: '在学习各种数据类型之前，我们先简单了解一下常量和变量的概念。后面章节中将会详细介绍。


    常量：指在程序运行中,其数值不能被改变的量。


    变量：指以标识符为名字，其值可以改变的量。


    变量代表计算机内存中的某一存储空间，变量的类型决定了该存储空间的长度和其中存放数据的编码方式及存储格式。


    变量的类型也决定了该存储空间中存放数据的数据形式和取值范围。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 整型(采用定点整数的存储格式，只能表示纯整数)


    # 1、整型常量：


    +   (1) 十进制形式:与数学上的整数表示相同;

    +   例如：12, -100, 0


    +   (2) 八进制形式:在数码前加数字0;

    +   例如：012=1*8^1+2*8^0=10(十进制)


    +   (3) 十六进制形式:在数码前加0X（数字0和字母X）。

    +   例如：0x12=1*16^1+2*16^0=18(十进制)


    注意！

    * 八进制的数码范围为0~7； 018 ×

    * 十六进制的数码除了数字0~9外，还使用英文字母a~f(或A~F)表示10~15。

    如：0x1e √'
  merge: -1
  img_proc: true
- pgno: 32
  md: "# 2、整型变量的分类：\n\n根据数据所占的存储长度的不同分为：int、short、long；同样存储长度的数据又分unsigned、signed；故可组合出六种类型。\n\
    \n# 3、整型变量的值域：\n\n由机器中数据的存储长度决定\n\n> 思考：int a=20000,b=20000,c;\n> \n> c=a+b；c的值为多少？\n\
    > \n> 如果c定义为long型是否能解决问题？\n\n如Turbo C中，有 short(2字节)≤int(2字节)≤long(4字节)\n\n| 关键字\
    \ | 所占位数 | 取值范围 |\n|---|---:|---|\n| short | 16 | -32768～32767 |\n| unsigned short\
    \ | 16 | 0～65535 |\n| int | 16 | -32768～32767 |\n| unsigned | 16 | 0～65535 |\n\
    | long | 32 | -2147483648～2147483647 |\n| unsigned long | 32 | 0～4294967295 |"
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 三、实型


    +   1、常量：


    +   (1) 十进制小数形式：由数字和小数点组成；

    +   例如：3.4, 4., .3。


    +   (2) 指数形式： “十进制小数” + “ e(或E)” + “十进制数整数”。

