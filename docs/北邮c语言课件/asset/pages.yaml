  md: '# 8.5.2 指针数组与命令行参数


    在操作系统命令状态下，可以输入程序或命令使其运行，称命令行状态。输入的命令（或运行程序）及该命令（或程序）所需的参数称为命令行参数。


    main函数是可以有参数的，但与普通函数不同。


    带形参的main()函数的一般形式是：


    ```

    main (int argc, char *argv[])

    { ... }

    ```


    形参argc记录命令行中字符串的个数，argv是一个字符型指针数组，每一个元素顺序指向命令行中的一个字符串。'
