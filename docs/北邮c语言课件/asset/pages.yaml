- pgno: 450
  md: '# 比较：


    +   - 字符文件的每1个字节存储1个字符，因而便于对字符进行逐个处理。但一般占用存储空间较多，而且要花费转换时间（二进制与ASCII码之间的转换）。

    +   - 二进制文件是把内存中的数据，原样输出到磁盘文件中。可以节省存储空间和转换时间，但1个字节并不对应1个字符，不能直接输出字符形式。'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# 三、标准文件与非标准文件


    1、标准文件系统：利用缓冲区将对磁盘文件进行操作的文件系统称为缓冲（或高层）文件系统，用户使用方便。


    从内存向磁盘输出数据时，必须首先输出到缓冲区中。待缓冲区装满后，再一起输出到磁盘文件中。


    从磁盘文件向内存读入数据时，则正好相反：首先将一批数据读入到缓冲区中，再从缓冲区中将数据逐个送到程序数据区。


    2、非标准文件系统：不使用缓冲区的磁盘文件系统称为非缓冲（或低层）文件系统。编程难度较大，但程序的执行效率高，占用内存资源较少。'
  merge: -1
  img_proc: true
