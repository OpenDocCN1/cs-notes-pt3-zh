- pgno: 349
  md: '# 3. 指针的关系运算


    两指针之间关系运算表示它们所指向的地址位置关系。指针的关系运算符包括：==、!=、<、<=、>、>= 6种。


    指向同一数据类型的指针，才有可能进行关系运算。若p,q是两个同类型的指针变量，则：p>q,p<q,p==q,p!=q， p>=q都是允许的。


    指针的关系运算在指向数组的指针中广泛的运用，假设p、q是指向同一数组的两个指针，执行p>q的运算，其含义为，若表达式结果为真（非0值），则说明p所指元素在q所指元素之后。或者说q所指元素离数组第一个元素更近些。


    注意：在指针进行关系运算之前，指针必须指向确定的变量或存储区域，即指针有初始值；'
  merge: -1
