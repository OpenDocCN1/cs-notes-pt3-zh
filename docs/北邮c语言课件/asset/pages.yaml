- pgno: 398
  md: '# # 1.main()函数的形参与实参


    main（ ）函数由系统自动调用，而不是被程序内部的其它函数调用，main()函数所需的实参不可能由程序内部得到，而是由系统传送。


    main（ ）函数所需的实参与形参的传递方式也与一般函数的参数传递不同，实参是在命令行与程序名一同输入，程序名和各实际参数之间都用空格分隔。


    格式为：执行程序名  参数1  参数2  ……  参数n


    +   - **形参argc**为命令行中参数的个数（包括执行程序名），其值大于或等于1，而不像普通C语言函数一样接受第一个实参。

    +   - **形参argv**是一个指针数组，其元素依次指向命令行中以空格分开的各字符串。


    即：第一个指针argv[0]指向的是程序名字符串，argv[1]指向参数1，argv[2]指向参数2，……，argv[n]指向参数n。'
