  md: '# 5.4.2 continue语句


    一般形式：


    ```

    continue;

    ```


    该语句被称为继续语句。在循环结构中执行 continue语句,使本次循环提前结束，即跳过循环体中continrue语句下面的尚未执行的循环体语句，但不结束整个循环，继续进行下一次循环的条件判别，条件为真，继续进行执行循环语句。'
