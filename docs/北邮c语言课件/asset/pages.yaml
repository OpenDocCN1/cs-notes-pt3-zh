  md: '# 5.1 while语句


    一般形式：


    ```

    while(表达式) 语句

    ```


    执行流程：


    +   1. 计算表达式

    +   2. 如果表达式的值为非零，执行语句

    +   3. 返回第一步，重新计算表达式

    +   4. 如果表达式的值为零，则结束循环


    如果表达式的值一开始就为0，则语句一次也不会被执行。


