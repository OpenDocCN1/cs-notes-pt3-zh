  md: '# 逻辑或优化和逻辑与优化：


    在逻辑表达式的求解中，并不是所有的逻辑运算符都被执行，只是在必须执行下一个逻辑运算符才能求出表达式的解时，才执行该运算符。


    # 例如：


    ```

    (1)a = 0; b = 1;

    c = a++ && ( b = 3 );

    执行后： a为 1 , b为 1 , c为 0 。

    ```


    ```

    (2)a = 1; b = 1; c=0;

    d = --a || b-- || (c = b+3);

    执行后： a为 0 , b为 0 , c为 0 , d为 1 。

    ```'
