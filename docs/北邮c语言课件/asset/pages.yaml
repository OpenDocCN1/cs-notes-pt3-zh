  md: '# 7.1.3 一维数组的存储结构与初始化


    # 1. 一维数组的存储结构


    数组变量在内存中分配一片连续的存储单元，数组元素按数组下标从小到大连续存放。a代表首地址（数组起始地址），每个元素字节数相同，因此，根据数组元素序号可以求得数组各元素在内存的地址，并可对数组元素进行随机存取。


    数组元素地址=数组首地址+元素序号×元素字节数。设a的首地址为1000，数组存储示意图如下图所示。


    ![](img/609af85bac45577917bd36819bca122b_266_0.png)


    a[3]的地址=1000+3×2=1006'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 2. 一维数组的初始化


    含义：在定义数组的同时，对数组各元素指定初值。

    初始化是 编译阶段完成。


    注意：用赋值语句或输入语句也可给数组素指定初值，

    是在运行时完成。


    初始化数组格式：


    ```

    [static] <类型标识符> <数组名[元素个数]>= {<初值列表>};

    或 <类型标识符> <数组名[元素个数]>= {<初值列表>} ;

    ```


    说明：


    +   ① <初值列表> 是用逗号分隔的数组元素的初始值(常量)。

    +   ② <初值列表> 中数值的类型必须与 <类型标识符> 一致。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 对数组初始化的几种方法：


    ①在定义数组时，对全部数组元素赋予初值。


    ```

    int a[5]={0, 1, 2, 3, 4};

    ```


    ②在定义数组时，对部分数组元素赋予初值。


    ```

    int a[5]={1, 2}; 等价 a[0]=1, a[1]=2; 其余赋0

    ```


    ③对全部数组元素赋初值时，可省数组长度，系统自动确定。


    ```

    a[5]={0,1,2,3,4}

    ```


    若不对auto数组进行初始化，则其初值是不可知的。


    若一个static或外部数组未进行初始化，则对数值型数组元素，初值为0，而对字符型数组元素，初值为空字符 ''\0''。


    | a[0] | 0 |

    | a[1] | 1 |

    | a[2] | 2 |

    | a[3] | 3 |

    | a[4] | 4 |


    ![](img/609af85bac45577917bd36819bca122b_268_0.png)'
