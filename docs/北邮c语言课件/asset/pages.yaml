  md: "# 第10章 文件\n\n```\nint fread(void *buffer, unsigned size, unsigned count, FILE\
    \ *fp);\n```\n\n从文件fp中读入count次，每次读size字节，读入的信息存在buffer指针指向的缓冲区。函数返回值等于实际读入的次数（可能少于count）。\n\
    \n```\ntypedef struct\n    { long num;\n      char name[10];\n      int age;\n\
    \    } student;\nstudent test[3];\n```\n\n```\nfor (j=0; j<number; j++)\n```\n\
    \n```\nfread(&test[j], sizeof(student), 1, fp);\n```\n\n作用：按数据项（即数据块）进行操作，通过它们可以方便地对程序中的数组、结构体数据进行整体输入输出。函数操作完成后，将返回读出或写入的数据项项数。\n\
    \n![](img/609af85bac45577917bd36819bca122b_469_0.png)"
