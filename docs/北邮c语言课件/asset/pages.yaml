- pgno: 1
  md: '# C语言程序设计课程简介


    C语言是当今使用最广泛的高级语言，是操作系统、编译系统等大型复杂系统的首选语言。实践证明，用该语言编写的程序，灵活、方便、简洁、高效、数据结构丰富、功能齐全。C语言自问世以来，很快就流行于全世界，并为各种规模的通用计算机所必备。


    同时，C语言以其灵活方便的特点，成为培养学生计算机语言思维，了解计算机编程思想的最佳语言，它已被当今国内外众多主要高校列为各理工科专业必修课程。


