    \n此题的关键是 $n$ 的取值不能确定。这里用循环法求 $n$。设 $n$ 的初值为 10，每次加一，当相邻两次 $n$ 值算得的积分值相差不超过 $10^{-7}$\
    \ 时，认为已经取到了合适的 $n$ 值。\n\n```\n```c\n#include<math.h>\nmain()\n{\n    long n; double\
    \ f,d,x,s=0,t;\n    for(n=10;;n++)\n    {\n        d=(double)9/n;  t=s;\n    \
    \    for(s=0,x=1;x<=10-d;x+=d)\n        {\n            f=1/(1+x);\n          \
    \  s=s+f*d;\n        }\n        if(fabs(s-t)<1e-7) break;\n    }\n    printf(\"\
