  md: '# （3）给指针变量赋空值


    给指针变量赋空值，说明该指针不指向任何变量。


    “空”指针值用NULL表示，NULL是在头文件stdio.h中预定义的常量，其值为0，在使用时应加上预定义行,如：


    ```

    #include "stdio.h"

