    \nint fac2(int n) {                     void g(int* p);\nif(n>1) return n*fac2(n-1);\
    \           void h(int* p) { /* ... */ }\nreturn 1; // 可以有多个返回语句    return g(p);\
    \ } // ok\n```\n\n## 7.4 重载函数名\n\n- 两个在不同类型对象上执行概念相同的工作时，可以给两个函数起相同的名字，叫做重载\n\
