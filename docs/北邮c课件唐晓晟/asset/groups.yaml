    - 考虑到效率因素，STL中推崇采用内联函数而非虚函数去实现小且使用频繁的访问函数。\n- 为了避免在公共基类中包含那些无法在所有集合中有效实现的操作。\n\
    - 为每个容器提供自己的迭代器，并让这些迭代器都支持同一组标准的迭代器操作。\n- 标准容器不是从一个公共基类派生出来的，而是每个容器实现了完整的标准容器接口。\n\
