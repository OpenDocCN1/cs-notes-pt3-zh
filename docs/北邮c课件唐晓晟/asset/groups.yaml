    \ f(){ /*...*/ }\n    int g(){ /*...*/ }\n}\n\n相当于：\n#include \"header.h\"\nnamespace\
    \ $$${\n    int a;\n    void f(){ /*...*/ }\n    int g(){ /*...*/ }\n}\n```\n\n\
    ## 8.2.6 名字查找\n\n+ 一个取T类型参数的函数常与T类型本身定义在同一个名字空间中。如果在使用一个函数的环境中无法找到它，我们就去查看它的参数所在的名字空间\n\
    \n```\nnamespace Chrono{\nclass Date{\npublic:\n    bool operator==(const Date&,\n\
    \                    const Date&);\n};\n}\n\nvoid f(Chrono::Date d, int){\n  \
    \  std::string s = format(d);\n    //Error: 找不到使用int输入\n    format(const Date&);\
    \ //参数的format()版本\n}\n```\n\n## 名字空间示例\n\n+ 名字若提取能够使程序员节省许多输入，同时也不必使用using语句导入名字字面，这个规则对于运算对象和模板参数特别有用\n\
