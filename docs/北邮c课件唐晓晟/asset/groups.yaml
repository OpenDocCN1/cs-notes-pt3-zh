    +   - 字符集一般都采用ISO-646的某个变形,比如说ASCII(ANSI3.4-1968)\n\n# 以下假设都是不安全的\n\n+   - 8位字符集中共有不超过127个字符(有的字符集提供了255个字符)\n\
