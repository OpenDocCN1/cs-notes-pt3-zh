    \ 用一个 vector 保存其中的元素，对任何能提供 front()、push_back() 和 pop_back()，并能使用随机访问迭代器的序列都可以使用。\n\
    - priority_queue 最可能是用一个 heap 实现。\n\n## 17.4 关联容器\n\n- 关联容器是类型定义类群中最常见的也最有用的 一种。\n\
    - 关联容器也常被称作映射(map)，有时也被称作字典(dictionary)；其中每个元素都是对。\n- 给定一个标有关键码的值，我们就访问一个称为映射的值。\n\
