  - "[PAGE 41]\n\n# 7.7 指向函数的指针\n\n+   - 对一个函数只能做两件事：调用它或者取得它的地址\n+   - 通过取一个函数的地址而得到的指针即为函数指针，可以在后面用来调用这个函数\n\
    +   - 在指向函数的指针的声明中需要给出参数类型，就像函数声明一样，在指针赋值时，完整的函数类型必须完全匹配\n\n# 函数指针示例\n\n```\n\
    void error(string s) { /* ... */ }\nvoid (*efct)(string); // 设函数指针\nvoid f() {\n\
    \    efct = &error; // efct指向error\n    efct(\"error\"); // 调用error\n    // 不需要取地址符&\n\
    }\nvoid (*f1)(string);\nvoid f1(string);\nint f2(string);\nvoid f3(int*);\nvoid\
    \ (*pf)(string):\npf = f1; // ok\npf = &f1;\npf = &f2; // Error: 返回值不匹配\npf =\
    \ &f3; // Error\npf(\"Hera\"); // ok\npf(1); // Error\nint i = pf(\"Zeus\"); }\
    \ // Error: void赋值给int\n```\n\n# 其他函数指针示例\n\n```\n// 摘自<signal.h>\ntypedef void\
    \ (*SIG_TYP)(int); // 比此 typedef char * PCH;\nSIG_TYP void (*SIG_ARG_TYP)(int);\n\
    SIG_TYP signal(int,SIG_ARG_TYP);\n\ntypedef void (*PF)();\nPF edit_ops[] = { &cut,\
    \ &paste, &copy, &search };\nPF file_ops[] = { &open, &append, &close, &write\
    \ };\n\nPF* button2 = edit_ops;\nPF* button3 = file_ops;\n请参考书中p141, ssrt\n函数实现，以及p142\n\
    中其他的调用举例\nbutton2[2](); // 调用按钮2的第3个函数\n```\n\n# 函数指针示例\n\n+   - 关于重载函数的指针，可以通过赋值或者初始化指向重载指针的方式，取到一个重载函数的地址\n\
    +   - 通过指向重载函数的指针调用的函数，其参数类型和返回值类型必须与指针的要求完全一致\n+   - 当函数指针对指针赋值或初始化时，没有隐含的参数或者返回类型转换\n\
    \n```\nvoid f(int);\nint f(char)\n\nvoid (*pf1)(int) = &f; // void f(int)\nint\
    \ (*pf2)(char) = &f; // int f(char)\nvoid (*pf3)(char) = &f; // Error\n```"
