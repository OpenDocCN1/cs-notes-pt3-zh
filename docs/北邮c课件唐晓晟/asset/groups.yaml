    \    void splice(iterator pos, list& x);\n    // 将x的所有元素移到本表pos之前，且不改变顺序\n   \
    \ void splice(iterator pos, list& x, iterator p);\n    // 将x中的p移到本表的pos之前，且不改变顺序\n\
    \    void splice(iterator pos, list& x, iterator first, iterator last);\n    void\
    \ merge(list<T>&, list<T>&);\n    template <class Cmp> void merge(list<T>&, Cmp);\n\
    \    void sort();\n    template <class Cmp> void sort(Cmp);\n};\n```\n\n# 粘接、排序和归并\n\
    \n例如：输出\nfruit: apple pear\ncitrus: orange grapefruit lemon\n我们可以：\n\n```\nlist<string>::iterator\
    \ p = find_if(fruit.begin(), fruit.end(), initial(p));\nfruit.splice(p, citrus,\
    \ citrus.begin());\nfruit.splice(p, citrus, citrus.begin(), citrus.end());\n\n\
    注意，这里的迭代器参数必须是合法的迭代器，确实指向或迭代指向的某个list。\n```\n\n```\nlist<string>::iterator p =\
    \ find_if(fruit.begin(), fruit.end(), initial('p'));\nfruit.splice(p, citrus,\
    \ citrus.begin()); // OK\nfruit.splice(p, citrus, citrus.begin()); // 错误：fruit.begin()并不指向citrus\n\
    citrus.splice(p, fruit, fruit.begin()); // 错误：p不是指向citrus\n```\n\n# 粘接、排序和归并\n\
    \n+   - merge组合起两个排序好的表，方式是将一个list的元素搬进另一个，将它们都加入另外一个表，且维持正确的顺序\n+   - 如果一个表未排序，merge()仍然能够产生一个表，其中包含两个表的元素的并集，只是顺序未作保证\n\
    \n```\nf1: apple quince pear\nf2: lemon grapefruit orange lime\n归并：\nf1.sort();\n\
