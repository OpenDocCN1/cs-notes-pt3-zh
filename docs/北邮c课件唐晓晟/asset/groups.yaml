  md: "\n## 编译器的匹配判断原则\n\n- 完全匹配：无论任何转换或拷贝只要能被平凡转换（数组到指针、函数到指针、T到const T等）的匹配\n- 提升匹配：即包含整型提升（bool到int、char到int、short到int以及相应的无符号版本）以及从float到double的提升\n\
    - 使用标准转换（int到double、double到int、double到long double、Derived*到Base*、T*到void*、int到unsigned\
    \ int）的匹配\n- 利用用户定义转换的匹配\n- 和在表达式中常用的省略匹配\n- 若在匹配的某个步骤上同时发现两个匹配，这个调用将被作为歧义而被拒绝\n\
    \n## 重载函数名示例\n\n```cpp\nvoid print(double);\nvoid print(int);\nvoid print(long);\n\
    void print(const char*);\n\nvoid f()\n{\n    print(1L); // print(long)\n    print(1.0);\
    \ // print(double)\n    print(t);\n    print(1); // Error:歧义\n}\n\nvoid h(char\
    \ c, int i, short s, float f)\n{\n    print(c); print(i); // 准确匹配\n    print(s);\
    \ // 整型提升; print(int)\n    print(f); // float到double提升\n    print('a'); print(49);\
    \ // 准确匹配\n    print('a'); // 准确匹配; print(int)\n    print(\"a\"); // 准确匹配: print(const\
    \ char*)\n}\n```\n\n## 7.4.1 重载和返回类型\n\n重载解析中不考虑返回类型，其理由是，保持对重载的解释只是针对单独的运算符或者函数调用，与调用的环境无关\n\
    \n```cpp\nfloat sqrt(float);\ndouble sqrt(double);\nvoid f(double d, float f)\n\
    {\n    float fl = sqrt(d); // sqrt(double)\n    double db = sqrt(d); // sqrt(double)\n\
    \    fl = sqrt(f); // sqrt(float)\n    db = sqrt(f); // sqrt(float)\n}\n```\n\n\
    ## 7.4.2 重载与作用域\n\n在不同的非名字空间作用域里声明的函数不算是重载\n\n```cpp\nvoid f(int);\nvoid g()\n\
    {\n    void f(double);\n    f(1); // 调用f(double)\n}\n```\n\n## 7.4.3 手工的歧义性解析\n\
    \n- 对一个函数，声明的重载版本太多（或者过少）都可能导致歧义性\n- 只要可能，应该做的是将该函数的重载版本集合作为一个整体来考虑；有关问题通常可以通过增加一个消除歧义性的版本来解决\n\
    - 此外，也可以增加一个显式类型转换的方式去掉某个特定调用的问题，但是这样做通常只是权宜之计\n\n### 手工的歧义性解析示例\n\n```cpp\nvoid\
    \ f1(char);\nvoid f1(long);\nvoid f2(char*);\nvoid f2(int*);\nvoid k(int i)\n\
    {\n    f1(); // 歧义\n    f2(0); // 歧义\n}\n```\n\n解决方案\n\n```cpp\nvoid f1(int n)\n\
    {\n    f1(long(n));\n}\nf2(static_cast<int*>(0));\n```\n\n## 7.4.4 多参数的解析\n\n\
    基于上述重载解析规则，可以保证，当所涉及到的不同类型在计算效率或者精度方面存在明显差异时，被调用的将会是最简单的方法（函数）\n\n### 多参数的解析示例\n\
    \n```cpp\nint pow(int,int);\ndouble pow(double,double);\ncomplex pow(double,complex);\n\
    complex pow(complex,int);\ncomplex pow(complex,double);\ncomplex pow(complex,complex);\n\
    void k(complex z)\n{\n    int i = pow(2,2); // pow(int,int)\n    double d = pow(2.0,2.0);\
    \ // pow(double,double)\n    complex z2 = pow(2,2); // pow(double,complex)\n \
    \   complex z3 = pow(z,2); // pow(complex,int)\n    complex z4 = pow(z,2); //\
    \ pow(complex,complex)\n}\n```\n\n注意：\ndouble d = pow(2.0,2);\n将会引起歧义\n\n## 7.5\
    \ 默认参数\n\n- 一个通用函数所需要的参数常常比处理简单情况时所需要的参数更多一些\n- 默认参数的使用可以为编程增加灵活性\n- 默认参数的类型将在函数声明时检查，在调用时求值\n\
    - 只能对排在最后的那 些参数提供默认参数\n\n### 默认参数示例\n\n```cpp\nvoid print(int value, int base\
    \ = 10);\nvoid f() {\n    print(31);\n    print(31,10);\n    print(31,16);\n \
    \   print(32,2);\n}\n\nvoid print(int value, int base) {\n    // ...\n}\n```\n\
    \n```cpp\nvoid f(int x = 7);\nvoid f(int x = 7); // Error: 参数重复\nvoid f(int =\
    \ 8); // Error: 参数位置改变\nvoid g() {\n    void f(int x = 9);\n    // ok\n}\n```\n\
    \n```cpp\nint f(int, int =0, char* =0); // ok\nint g(int =0, int =0, char* =0);\
    \ // Error\nint h(int =0, int =0, char* =0); // Error\nint nasty(char* =0); //\
    \ Syntax Error\n```\n\n## 7.6 未确定数目的参数\n\n- 有些函数，无法确定在各个调用中所期望的所有参数的个数和类型，声明这种函数的方式就是在参数表的最后用省略号(...)结束，表示还可能有另外一些参数\n\
    - 对于省略号省略的参数，编译器在编译时无法对其进行参数检查，即：可能编译通过，但是运行出错。C++中可以通过重载函数和使用默认参数避免此类问题\n- <cstdarg>里提供了一组标准宏，专门用于在这种函数里访问未加描述的参数\n\
    \n### 未确定数目的参数示例\n\n```cpp\nint printf(const char* ...);\n\nprintf(\"Hello, world\\\
    n\");\nprintf(\"My name is %s %s\\n\", first_name, last_name);\nprintf(\"%d %d\
    \ = %d\\n\", 2,3,5);\n\n#include <cstdio.h>\nint main() {\n    printf(\"My name\
    \ is %s %s\\n\",2);\n} // 最后的调用, 会有一种怪异的输出\n\nint fprintf(FILE*, const char* ...);\n\
    int execv(const char* ...);\n```\n"
