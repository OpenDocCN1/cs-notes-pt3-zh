    \ q) // 定义\n{\n    int t = *p;\n    *p = *q;\n    *q = t;\n}\n\ninline int fac(int\
    \ n)\n{\n    return (n<=2) ? 1 : n*fac(n-1);\n}\n```\n\n# 7.1.2 静态变量\n\n+   局部变量将在运行线程达到其定义时进行初始化，这种情形发生在函数的每次被调用时，且每次调用都有自己的一个局部变量副本\n\
    \n+   若局部变量被声明为static，那么将只有一个唯一的一个被懒惰分配的对象，在该函数的所有调用中该对象唯一，这个对象在该函数第一次被调用时被初始化\n\
    \n# 静态变量示例\n\n```\nvoid f(int a)\n{\n    while(a--)\n    {\n        static int\
    \ n = 0; //初始化仅一次\n        int x = 0; //每次f()被调用都初始化\n        cout << \"n=\"<<n++<<\"\
    ,x=\"<<x++<<\"\\n\";\n    }\n}\n\nint main()\n{\n    f(3);\n}\n```\n\n输出结果:\n\
    n=0,x=0\nn=1,x=0\nn=2,x=0"
