    \ `#endif` 指令\n\n```\nint f(int a\n#ifdef arg_two\n, int b\n#endif\n);\n```\n\n\
    ```\n将产生 int f(int a, int b); // 编译器参数 arg_two 存在\n```\n\n## 7.9 忠告\n\n- [1]质疑那些非\
    \ `const` 的常参数：如果你想要一个函数去修改其参数，请使用指针或者返回值\n- [2]当你需要尽可能减少参数复制时，应该使用 `const` 引用参数\n\
    - [3]广泛而一致地使用 `const`\n- [4]避免宏\n- [5]避免不确定数目的参数\n- [6]不要返回局部变量的指针或者引用\n- [7]当一些函数对不同的类型执行概念上相同的工作时，请使用重载\n\
    - [8]在各种整数上重载，通过提供函数去消除常见的歧义性\n- [9]在考虑使用指向函数的指针时，请考虑虚函数或模板是否是更好的选择\n- [10]如果你必须使用宏，请使用带有许多大写字母的丑陋的名字\n\
    \n## 8.2 名字空间\n\n- 名字空间是一种描述细节分组的机制，如果有一些声明按照某种规则在逻辑上属于同一个集团，就可以将它们插入同一个名字空间内\n\
    - 名字空间描述了一个程序的某些部分；一般情况下，它和数据的具体实现是分离开来\n- 成员可以在名字空间的定义里声明，而后再声明 namespace-name::member-name\
    \ 是限定名\n- 不能在名字空间定义之外用限定前缀形式为名字空间引入新成员\n- 一般而言，程序中的每个声明都必须位于某个名字空间内，但是main()函数例外\n\
    \n### 理想情况下，一个名字空间应该\n\n- 描述一个具有逻辑统一性的特征集合\n- 不为用户提供对无关特征的访问\n- 不给用户强加任何明显的记忆负担\n\
    \n### 示例\n\n```\nnamespace Parser {\n    double expr(bool);\n    double prim(bool\
    \ get) { ... }\n    double term(bool get) { ... }\n    double expr(bool get) {\
    \ ... } // 声明和定义同时进行\n}\n\nnamespace Parser {\n    double expr(bool);\n    double\
    \ prim(bool);\n    double term(bool);\n} // 实现与声明分离\ndouble Parser::expr(bool\
    \ get) { ... }\ndouble Parser::prim(bool get) { ... }\ndouble Parser::term(bool\
    \ get) { ... }\n```\n\n名字空间的成员必须采用如下写法引入：\n\n```\nnamespace name {\n    // 声明和定义\n\
    }\nvoid Parser::logical(bool);\n// Error: Parser中没有logical\n// 也无法引入名字logical\n\
    void Parser::prim(int);\n// Error: prim的参数不匹配\n```\n\n### 8.2.1 限定词的名字\n\n- 名字空间是作用域，普通的作用域规则也对名字空间成立\n\
    - 如果一个名字先前已经在本名字空间里或者其外围作用域里声明过，就可以直接使用。\n- 也可以使用来自另外一个名字空间的名字，但需要该名字所属的名字空间作为限定词\n\
    \n### 带限定词的名字示例\n\n```\nnamespace Lexer { // 另一个 namespace\n  enum Token_value\
    \ { NAME, NUMBER, END, MUL='*' };\n  Token_value curr_tok;\n  double number_value;\n\
    \  string string_value;\n  Token_value get_token() { /* ... */ }\n}\n\ndouble\
    \ Parser::term(bool get) // Parser作用域\n{\n  double left = prim(get); // 不需要限定词\n\
    \  for(;;) switch(Lexer::curr_tok) { // Lexer\n    case Lexer::NAME:\n      left\
    \ *= prim(true); // 不需要限定词\n      // ...\n  }\n  /* ... */\n}\n```\n\n### 8.2.2\
    \ 使用声明\n\n当编程中频繁使用另外一个名字空间中的变量时，可以通过使用声明语句来避免反复书写名字空间限定词\n\n```\ndouble Parser::prim(bool\
    \ get)\n{\n  if(get) Lexer::get_token();\n  switch(Lexer::curr_tok){\n    case\
    \ Lexer::NUMBER:\n      Lexer::get_token();\n      /* ... */\n  }\n}\n\ndouble\
    \ Parser::prim(bool get)\n{\n  using Lexer::get_token;\n  using Lexer::curr_tok;\n\
    \  if(get) get_token();\n  switch(curr_tok){\n    case NUMBER:\n      get_token();\
    \ // ...\n  }\n}\n```\n\n也可以把相关的使用说明放在 Parser 名字空间的定义里\n\n```\nnamespace Parser{\n\
    \  double prim(bool);\n  double term(bool);\n  double expr(bool);\n\n  using Lexer::get_token;\n\
    \  using Lexer::curr_tok;\n  using Error::error;\n}\n\ndouble Parser::term(bool\
    \ get)\n{\n  double left = prim(get);\n  switch(curr_tok){\n    case Lexer::MUL:\n\
    \      left *= prim(true);\n      break;\n    case Lexer::DIV:\n      if(double\
    \ d = prim(true))\n        { left /= prim(true); break; }\n      return error(\"\
    divided by 0\");\n  }\n  /* ... */\n}\n```\n\n### 8.2.3 使用指令\n\n一个使用指令能把来自一个名字空间的所有名字都变成可用\n\
    \n```\nnamespace Parser{\n  double prim(bool);\n  double term(bool);\n  double\
    \ expr(bool);\n\n  using namespace Lexer;\n  using namespace Error;\n}\n```\n"
