  - "[PAGE 110]\n\n# 函数模板的参数示例\n\n累积描述的最常见用途是为模板参数提供返回值类型\n\n可以将 implicit_cast 解释为隐式转换的一个显式模板\n\
    \n```\ntemplate<class T, class U> T implicit_cast(U u) {return u;}\nvoid g(int\
    \ i)\n{\n    implicit_cast(i); // 拷贝, 无转换, T 推导\n    implicit_cast<double>(i);\
    \ // T 为 double, U 为 int\n    implicit_cast<char>(double(i)); // T 为 char, U 为\
    \ double, 可以\n    implicit_cast<char*>(int(i)); // T 为 char*, U 为 int\n    //\
    \ 错误, 无法将 int 转换为 char*\n}\n```\n\n# 13.3.2 函数模板的重载\n\n可以声明多个具有同样名字的函数模板，甚至可以声明具有同一个名字的多个函数模板和常规函数数组的组合\n\
    \n```\ntemplate<class T> T sqrt(T);\ntemplate<class T> complex<T> sqrt(complex<T>);\n\
    double sqrt(double);\n\nvoid f(complex<double> z)\n{\n    sqrt(2); // sqrt<int>(int)\n\
    \    sqrt(2.0); // sqrt(double)\n    sqrt(z); // sqrt<double>(complex<double>)\n\
    }\n```\n\n# 模板函数重载规则\n\n找出了与这一重载解析的二维模板参数的专门化。例如，sqrt(z)产生候选函数 sqrt<double>(complex<double>)\
    \ 和 sqrt<complex<double>>(complex<double>)\n\n如果两个模板函数都可用，而其中一个比另外一个更专一，在随后的步骤中就只有那一个最专一的模板函数被考虑。例如，sqrt(z)意味着\
    \ sqrt<double>(complex<double>) 而非 sqrt<complex<double>>(complex<double>)\n\n\
    # 模板函数重载规则\n\n在某些函数上被重载解析，包括那些常规函数，如果某个函数参数数据已经通过模板参数推断确定下来，这个参数就不能同时通过模板推断、标准转换或者用户定义的转换。对于\
    \ sqrt(2)， sqrt<int>(int) 是精确匹配，优先于 sqrt(double)\n\n如果一个函数和一个专门化具有相同的匹配，那么就选用函数，因此，sqrt(2.0)\
    \ 将选用 sqrt(double) 而不是 sqrt<double>(double)\n\n如果找不到匹配者或找到多个匹配，都产生错误"
  - "[PAGE 111]\n\n# 模板函数重载示例\n\n```\ntemplate<class T> Tmax(T,T);\nconst int s =\
    \ 7;\nvoid f() {\n    max(1,2); // max<int>\n    max('a','b'); // max<char>\n\
    \    max(2.7,4.9); // max<double>\n    max(3,7); // max<int>(s,7)\n    max('a',1);\
    \ // 错误，歧义\n    max(2.7,4); // 错误，歧义\n}\nvoid f() { // 显式限定，避免歧义\n    max<int>('a',1);\n\
    \    max<double>(2.7,4);\n}\n```\n\n# 模板函数重载示例\n\n也可以增加适当的声明来避免歧义\n\n```\nint\
    \ max(int i, int j) { return max<int>(i,j); }\ndouble max(int i, double d) { return\
    \ max<double>(i,d); }\ndouble max(double d, int i) { return max<double>(d,i);\
    \ }\ndouble max(double d1, double d2)\n{ return max<double>(d1,d2); }\n\nvoid\
    \ g() {\n    max('a',1); // max(int('a'),1)\n    max(2.7,4); // max(2.7,double(4))\n\
    }\n```\n\n# 模板函数重载示例\n\n重载解析规则保证模板函数能够正确地与继承机制相互作用\n\n```\ntemplate<class T> class\
    \ B{/*...*/};\ntemplate<class T> class D : public B<T>{/*...*/};\ntemplate<class\
    \ T> void f(B<T>*);\n\nvoid g(B<int>* pb, D<int>* pd)\n{\n    f(pb); // f<int>(pb)\n\
    \    f(pd); // f<int>(static_cast<B<int>*>(pd))\n}\n```\n\n# 模板函数重载示例\n\n在对模板参数的推断中未涉及到的那些函数参数，亦完全会按照其模板所求的参数处理。特别是可以使用普通的转换规则\n\
