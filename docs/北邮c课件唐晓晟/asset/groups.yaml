    +   - [7] 用类层次去减少代码的重载细节\n+   - [8] 用抽象类提供不同的实现能共存\n+   - [9] 一个没有虚函数的类有一个虚析构函数\n\
    +   - [10] 抽象类通常不需要拷贝构造函数\n+   - [11] 还有概念表的表示也不相同"
