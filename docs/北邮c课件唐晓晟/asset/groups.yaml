    # 6.4 注释和缩进编排


    +   □ 明智地使用注释、一致性地使用缩进编排形式，可以使阅读和理解一个程序的工作变得更轻松愉快


    +   □ 注释信息只对读者有用，编译器不会去理解注释的内容


    +   □ 糟糕的注释还不如没有


    # 糟糕的注释示例


    ```

    // 变量 "v" 必须初始化

    // 变量 "v" 仅由函数 "init()" 使用

    // 在调用这一文件中的任何其他函数之前调用函数 "init()"

    // 在你的程序最后调用函数 "cleanup()"

    // 不要使用函数 "weird()"

    // 函数 "f()" 有两个参数


    a = b + c; // a设为 b + c

    count++; // count 加1

    ```


    # 作者的偏爱


    +   □ 为每个源文件写一个注释，一般性的陈述在它里面有些啰嗦声明，对有关非绑的引用，为维护而提供的一般性提示，如此等等


    +   □ 对每个类、模板和名字空间写一个注释


    +   □ 对每个非平凡的函数写一个注释，阐述其用途、所用到的算法（除非算法非常明显），已经可能有关的对其它平台所做的假设


    +   □ 对每个文件和它的名字空间的变量和常量写一个注释


    +   □ 在非明显或不可移动的代码处少量注释


    +   □ 极少其他的东酉


    # 6.5 忠告


    +   □ [1]尽量可能使用标准库，而不是其他的库和“手工打造的”


    +   □ [2]避免过于复杂的表达式；


    +   □ [3]如果运算符号的优先级有疑问，加括号；


    +   □ [4]避免显示类型转换（强制）；


    +   □ [5]若必须强制显示类型转换，提倡使用特殊强制运算符，而不是C风格的强制。


    +   □ [6]只对定义良好的构造使用T(e)记法；


    +   □ [7]避免带有无定义求值顺序的表达式；


    +   □ [8]避免goto语句；'
