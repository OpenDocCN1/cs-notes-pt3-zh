    \n构造是自下而上进行：基类、派生类。若受封则顺序相反。\n\n## 12.2.3 复制\n\n- 类对象的复制由复制构造函数和赋值操作定义\n- 注意，如果没有为Manager定义复制构造等，编译器会为你生成一个，也即：该类等于是不能继承的，构造函数也会复制\n\
