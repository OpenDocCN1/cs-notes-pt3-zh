    n=0,x=0\nn=1,x=0\nn=2,x=0\n\n## 7.2 参数传递\n\n- 当一个函数被调用时，将按其形式参数所需要的存储，并用实际参数对其进行初始化，必要时需要进行类型转换\n\
    - 传递一个引用参数，一般意味着要修改这个参数，为减少效率因传递引用参数，可以将其声明为const类型，显示表明将不对其实值进行修改\n- 字面量、常量和需要转换的参数都可以传递给const&参数，但不能传递给非const引用\n\
    \n### 参数传递示例(1)\n\n```\nvoid f(int val, int& ref)\n{\n    val ++; ref ++;\n}\n\
    \nvoid g()\n{\n    int i = 1;\n    int j = 1;\n    f(i,j);\n    // 此时，i 仍为1，j变为2\n\
