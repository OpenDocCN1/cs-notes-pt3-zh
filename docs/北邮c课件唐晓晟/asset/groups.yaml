  md: "\n## 13.5 专门化\n\n- 用户可以提供多个模板定义实例，编译器在实际应用中根据模板参数来进行选择。\n- 一个模板的多个可以互相替代的定义被称为对用户的专门化，或者简称为用户专门化。\n\
    \n```cpp\ntemplate<class T> class Vector {\n    T* v;\n    int sz;\npublic:\n\
    \    Vector();\n    explicit Vector(int);\n    T& elem(int i) { return v[i]; }\n\
    \    T& operator[](int i);\n};\n// 大致分离 Vector 中继承系统并\n// 重新定义从它继承过来的方法\nVector<int>\
    \ vi;\nVector<Shape*> vps;\nVector<string> vs;\nVector<char> vpc;\nVector<Node*>\
    \ vpn;\n```\n\n### 专门化\n\n- 大部分 C++ 实现的方式是为模板函数建立代码段的副本，这可能导致严重的代码膨胀。\n- 可以通过设计，使得所有指针容器都能够共享同一份实现代码，这可以通过专门化做到。\n\
    - 首先，定义一个 `void*` 的（专门化）`Vector` 版本。\n- 而后这个专门化就会被用作所有指针的 `Vector` 的共同实现，因为所有特定的指针类型都可以被转化为\
    \ `void*`。\n\n### 专门化示例\n\n- `template<>` 表示这是一个专门化，不需要模板参数；`<void*>` 表示这个定义应该用在所有的\
    \ `T` 是 `void*` 的 `Vector` 实现中。\n- `Vector<void*>` 将用于如下定义的 `Vector`：`Vector<void*>\
    \ vpv;`\n\n```cpp\ntemplate<> class Vector<void*> {\n    void** p;\n    void*&\
    \ operator[](int i);\n};\n```\n\n### 专门化示例\n\n- 为了使得该专门化能够用于所有指针的 `Vector`，且仅用于指针的\
    \ `Vector`，需要一个部分专门化（partial specialization）。\n- 名称后面的 `<T*>` 表明这个专门化将被用于每一个指针类型。\n\
    \n```cpp\ntemplate<class T> class Vector<T*> : private Vector<void*> {\npublic:\n\
    \    typedef Vector<void*> Base;\n    Vector() : Base() {}\n    explicit Vector(int\
    \ i) : Base(i) {}\n    T*& elem(int i) { return reinterpret_cast<T*&>(Base::elem(i));\
    \ }\n    T*& operator[](int i) { return reinterpret_cast<T*&>(Base::operator[](i));\
    \ }\n}; // 部分专门化\n```\n\n### 专门化示例\n\n- 上面的定义将用于每一个模板参数能够表达为 `T*` 的 `Vector`。\n\
    - 现在可以使得所有指针的 `Vector` 共享同一个实现，`Vector<T*>` 实际上是 `Vector<void*>` 的接口，完全通过派生结构扩展实现。\n\
    - 实际应用表明，这种技术在控制代码膨胀方面非常有效。\n\n```cpp\nVector<Shape*> vps; // T* = Shape*，即 T\
    \ 是 Shape\n// 注意，这里的基类部分本身就是一个专门化（针对某些模板参数）\n// 这说明此处模板参数 T 不是 Shape*\nVector<int*>\
    \ vpi; // T* = int*，所以可以使用这个专门化\n```\n\n### 13.5.1 专门化的顺序\n\n- 一个专门化比另一个更专门的意思是：能够与它匹配的每个实际参数表也能与另外的那个专门化匹配，但是反之则不行。\n\
    - 更专门可以被理解为更特殊。\n- 在声明对象、指针等的时候，做重载解析时，最专门化的那个版本都会比一般的版本优先被选中。\n\n```cpp\ntemplate<class\
    \ T> class Vector; // 一般情况\ntemplate<class T> class Vector<T*>; // 对指针的专门化\ntemplate<class\
    \ V> class Vector<void*>; // 对 void* 的专门化，最专门\n```\n\n### 13.5.2 模板函数的专门化\n\n\
    - 专门化对于模板函数也非常有意义，考虑前面提到过的 `shell` 排序，其中需要比较元素。\n- 一个更好的定义是使用模板函数 `less()` 替代比较符号。\n\
    - 可以通过 `less()` 对 `const char*` 的一个专门化来做好这类比较。\n\n```cpp\ntemplate<class T> bool\
    \ less(T a, T b) { return a < b; }\n// 对于 char*，无法正确比较\ntemplate<> bool less(const\
    \ char* a,\n                    const char* b) {\n    return strcmp(a, b) < 0;\n\
    }\n```\n\n### 模板函数的专门化\n\n```cpp\n// 模板参数可以从函数的实际参数表推断，不需要显式描述\ntemplate<> bool\
    \ less<>(const char* a,\n                       const char* b) {\n    return strcmp(a,\
    \ b) < 0;\n}\n// 给出了 template<> 后，函数名后面的 <> 就多余了\ntemplate<> bool less(const char*\
    \ a,\n                     const char* b) {\n    return strcmp(a, b) < 0;\n}\n\
    ```\n\n### 13.6 派生和模板\n\n- 模板和派生都是从已有类型创建新类型的机制，通常被用于写出各种共性的代码。\n- 从一个具体类派生出一个模板类，这是为一组模板提供一个通用实现的办法，例如：\n\
    \n```cpp\ntemplate<class T> class Vector<T*> :\n    private Vector<void*> {};\n\
    ```\n\n- 从模板派生模板类也很有效，如果某个基类的成员依赖于派生类的模板参数，那么这个基类本身也必须参数化。\n\n```cpp\ntemplate<class\
    \ T> class vector { /* ... */ };\ntemplate<class T> class Vec : public vector<T>\
    \ { /* ... */ };\n```\n\n### 13.6.1 参数化和继承\n\n- 模板是将一个类型或者一个函数用其他的类型进行参数化，该模板对于所有参数类型的代码实现都是相同的。\n\
    - 抽象类定义了一个接口。抽象类的不同实现中的许多代码可以被该类层次结构所共享，同时，利用抽象类的大部分代码不依赖于它的具体实现。\n- 两者都在于实现一次，然后被应用于多种不同类型，因而非常相似，可用多态来描述。\n\
    \n### 参数化和继承\n\n为了区分，将继承提供的东西称为运行时多态性（run-time polymorphism），而模板提供的多态性称为编译时多态性（compile-time\
    \ polymorphism）或者参数式多态性（parametric polymorphism）。\n\n选择继承或者模板的依据：若所操作的一组对象之间不需要类型层次的关系，选择模板；若编译时无法得知这些对象的类型，选择抽象类；若对运行效率要求严格，选择模板，因为它可以格外方便地内联化。\n\
    \n### 13.6.2 成员模板\n\n- 一个类或者模板的成员也可以是模板。\n- 但是成员模板不能是 `virtual`。\n\n```cpp\ntemplate<class\
    \ Scalar> class complex {\n    Scalar re, im;\npublic:\n    template<class T>\
    \ complex(const complex<T>& c) :\n        re(c.real()), im(c.imag()) {}\n};\n\n\
    complex<float> cf(0.0);\ncomplex<double> cd = cf; // 允许：使用 float 到 double 的转换\n\
    \nclass Quad {\npublic:\n    Quad(int); // 允许从 int 转换\n};\n\ncomplex<Quad> cq;\n\
    complex<int> ci = cq; // 错误：没有从 Quad 到 int 的转换\n```\n\n### 13.6.3 继承关系\n\n- 可以将类模板理解为一种有关如何生成特定类的规范。\n\
    - 因此，类模板有时也被称作类型生成器（type generator）。\n- 如果只考虑 C++ 的规则，由同一个类模板生成的两个类之间并不存在任何关系。\n\
    \n### 继承关系示例\n\n```cpp\nclass Shape { /* ... */ };\nclass Circle : public Shape\
    \ { /* ... */ };\n```\n\n基于上述声明，人们会有疑问，能否将 `set<Circle*>*` 当成 `set<Shape*>*` 使用？但这是错误的。`Circle`\
    \ 是 `Shape`，但是 `Circle*` 的集合并不构成 `Shape*` 的集合。\n\n```cpp\nclass Triangle : public\
    \ Shape { /* ... */ };\n\nvoid f(set<Shape*>*& s) {\n    s->insert(new Triangle());\
    \ // 可以\n}\n\nvoid g(set<Circle*>*& s) {\n    f(s); // 错误：类类型不匹配，s 是 set<Circle*>*，不能转换为\
    \ set<Shape*>*\n    // 不存在从 set<Circle*>* 到 set<Shape*>* 的隐式转换，也不应该有这种转换。\n  \
    \  // set<Circle*>* 应该能保证所存放的就一定是 Circle*。\n}\n```\n\n### 13.6.3.1 模板转换\n\n- 模板生成的各个类之间没有默认的关系。然而对于某些模板，我们可能希望能表达这种关系。\n\
    \n```cpp\ntemplate<class T> class Ptr {\n    T* p;\npublic:\n    Ptr(T*);\n  \
    \  Ptr(const Ptr&);\n    template<class T2> operator Ptr<T2>();\n    // 把 Ptr<T>\
    \ 转换为 Ptr<T2>\n};\n\nvoid f(Ptr<Circle> pc) {\n    Ptr<Shape> ps = pc; // 允许转换\n\
    \    Ptr<Circle> pc2 = ps; // 需要类型信息检查\n}\n```\n\n### 模板转换\n\n- 我们希望在上例中，只有当 `Shape`\
    \ 是 `Circle` 的直接或间接基类时，才能进行指针的转换。\n- 当且仅当 `p` 的类型 `T*` 可以作为 `T2*` 时，下面的返回语句才能编译：\n\
    \n```cpp\ntemplate<class T> // 模板的模板参数表\ntemplate<class T2> // 模板成员的模板参数表\noperator\
    \ Ptr<T2>() { return Ptr<T2>(p); }\n```\n\n```cpp\nvoid f(Ptr<Circle> pc) {\n\
    \    Ptr<Shape> ps = pc; // 可以。Circle* 可以转换为 Shape*\n    Ptr<Circle> pc2 = ps;\
    \ // 错误。Shape* 不能转换为 Circle*\n}\n```\n"
