    \n## 第一章 导论（致读者）\n\n- 书本结构\n- 学习C++\n- C++的设计\n- 历史注释\n- C++的使用\n- C和C++\n- 忠告\n\
    \n## 1 书本结构\n\n- 导论：1-3章，有关C++语言、所支持的关键性程序设计风格、有关C++标准库的综述\n- 第一部分：4-9章，C++内部类型\n\
