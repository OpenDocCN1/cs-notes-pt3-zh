  - '[PAGE 164]


    # 操作综述


    +   关联容器提供如下基于关键码的检索操作


    | Associative Operations (§17.4.1) |  |

    |---|---|

    | `operator[]` | Access the element with key k (for containers with unique keys).
    |

    | `find(k)` | Find the element with key k. |

    | `lower_bound(k)` | Find the first element with key ≥ k. |

    | `upper_bound(k)` | Find the first element with key greater than k. |

    | `equal_range(k)` | Find the lower_bound and upper_bound elements with key k.
    |

    | `key_comp()` | Copy of the key comparison object. |

    | `value_comp` | Copy of the mapped value comparison object. |


    # 17.1.2 容器综述


    | Standard Container Operations |  |  |  |  |

    |---|---|---|---|---|

    |  | List Operations | Front Operations | Back (Stack) Operations | Iterators
    |

    | vector | const, O(1) | const | const+ | Ran |

    | list | const, O(1) | const | const+ | Bi |

    | deque | O(1) | const | const+ | Ran |

    | stack |  |  | const+ |  |

    | queue |  | const | const+ |  |

    | priority_queue | O(log(n)) | O(log(n)) |  | Bi |

    | map | O(log(n))++ | O(log(n))++ |  | Bi |

    | multimap | O(log(n))++ | O(log(n))++ |  | Bi |

    | set | O(log(n))++ | O(log(n))++ |  | Bi |

    | multiset | O(log(n))++ | O(log(n))++ |  | Bi |

    | string | O(n)++ | O(n)++ | const+ | Ran |

    | array | const | const | const+ | Ran |

    | valarray | const | const |  | Ran |

    | bitset | const | const |  | Ran |


    # 容器综述


    +   - 主表中，Iterators列的Ran表示随机访问，Bi表示双向迭代

    +   - 表中黄色项目表示都是操作的效率，`const`表示该操作所用的时间不依赖于容器中元素的数目（相当于O(1)），后缀+表明偶尔会出现显著的额外时间开销，注意基本操作中没有非常潜在的操作，比如说O(n²)

    +   - 有关复杂性和代价的度量值都是上界


    # 17.1.3 表示


    +   - 标准并没有为各种标准容器预先设定任何特定的实现方式。相反，标准只是描述了各种容器的界面，并提出了一些复杂性要求

    +   - 实现者将择适当的，一般也是经过最聪明地优化过的实现方式，以满足这些普遍要求

    +   - 例如：vector(数组)、list(链表)、map(平衡树)、string(11章所描述的方式或者数组)'
  - "[PAGE 165]\n\n# 17.1.4 对元素的要求\n\n+   - 容器里的元素是被插入对象的副本\n+   - 一个对象要想成为容器的元素，它就必须属于某个允许容器的实现对他进行复制的类型\n\
    +   - 容器可迅速调用复制构造函数或者赋值元素的赋值工作，在两种情况下，都要求复制结果是一个等价的对象\n\n# 17.1.4.1 比较\n\n+  \
    \ - 关联容器要求其元素是有序的，许多可以应用于容器的操作也是这样（例如，sort()）\n+   - 按照默认方式，这个序由运算符定义，如果不合适，程序员必须另外提供合适的比较操作\n\
    +   - 排序准则必须定义一种严格的弱序（strict weak ordering），即小于和等于操作必须具有传递性\n\n# 比较示例\n\n```\n\
    template<class Ran> void sort(Ran first, Ran last);\ntemplate<class Ran, class\
    \ Comp> void sort(Ran first,\n                                Ran last, Comp cmp);\n\
    \nclass Nocase{\npublic: bool operator()(const string& x, const string& y) const{\n\
    \    string::const_iterator p = x.begin();\n    string::const_iterator q = y.begin();\n\
    \    while(p!=x.end() && q!=y.end() && toupper(*p)==toupper(*q)){\n        ++p;\
    \ ++q;\n    }\n    if(p == x.end()) return q==y.end();\n    if(q == y.end()) return\
    \ false;\n    return toupper(*p < toupper(*q);\n}\n};\n```\n\n# 比较示例\n\n+   -\
    \ 使用上面的比较准则调用sort()，例如，给定fruit：apple pear Apple Pear lemon\n+   - 用sort(fruit.begin(),\
    \ fruit.end(), Nocase())将产生 fruit：Apple apple lemon Pear pear\n+   - 而简单的用sort(fruit.begin(),\
    \ fruit.end())将给出 fruit：Apple apple lemon Pear pear"
