    \ m[buf]++;\n                                    }\n```\n\n### 示例\n\n```\n// 标准库提供了\
    \ 一个模板类basic_string，其中，string被定义为 basic_string<char>，构造又可 typedef basic_string<char>\
    \ string;\n\nint main()\n{\n    string buf;\n    map<string, int> m;\n    while(cin>>buf)\
    \ m[buf]++;\n}\n```\n\n## 13.2.1 定义一个模板\n\n- 一个由类模板生成的类也是一个完全正常的类\n- 方法：先做好特定的类，如String，并排除其中错误，然后再将它转化为String<C>\
    \ 一类的模板\n- 模板类中成员的声明和定义与在非模板类里完全一样，模板类的成员也不一定要在类内部定义，可以在外部定义，成员本身也是模板参数化的\n\n\
    ### 定义一个模板示例\n\n```\ntemplate<class C> class String\n{\n    struct Srep;\n   \
    \ Srep* rep;\npublic:\n    String();\n    String(const C*);\n    String(const\
    \ String&);\n    C read(int i) const;\n    //...\n};\n\ntemplate<class C> struct\
    \ String<C>::Srep {\n    C* s;\n    int sz;\n    int n;\n};\n\ntemplate<class\
    \ C> String<C>::String(const C* s) {\n    return rep->s[i];\n}\n\ntemplate<class\
    \ C> String<C>::String()\n{\n    rep = new Srep(0,C());\n};\n```\n\n### 定义一个模板示例\n\
    \n类模板的名字不能重载\n\n```\ntemplate<class T> class String{...};\nclass String{...};\
    \ // 错误，重复定义\n```\n\n## 13.2.2 模板实例化\n\n- 从一个模板类和一个模板参数生成一个类声明的过程通常被称为模板实例化\n\
    - 该说法同样用于由模板函数加上模板参数产生一个函数的过程\n- 针对一个特定模板参数的模板版本被称为是一个专门化\n\n### 模板实例化\n\n一般来说，具体的实现负责验证对所用的每个模板参数能够生成模板函数的相关版本。程序员不必考虑该问题\n\
