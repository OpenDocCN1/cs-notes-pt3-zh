  md: "\n## 14.3.1 重新抛出\n\n- 在捕捉到了一个异常之后，很多情况下，处理者并不能完成对这个错误的全部处理，典型的方式是：该处理者能够局部做到的事情，然后再一次抛出这个异常，这将使得错误恢复动作分布在几个处理器里。\n\
    - 重新抛出用一个不带运算对象的throw语句。\n- 重新抛出的异常就是当初捕捉到的那个异常，而不仅仅是异常处理器能够访问到的那个部分。\n\n### 重新抛出示例\n\
    \n```\nvoid h() {\n    try { // 可能抛出Matherr的代码\n        // ...\n    }\n    catch(Matherr){\n\
    \        if(can_handle_it_completed){\n            //处理Matherr\n            return;\n\
    \        }\n        else{\n            //完成这里做的事情\n            throw;\n      \
    \  }\n    }\n}\n```\n\n## 14.3.2 捕捉所有异常\n\n- 对于函数，省略号\"...\"表示\"任何参数\"。同样，catch(...)表示要捕捉所有异常。\n\
    \n```\nvoid m() {\n    try {\n        // 一些代码\n    }\n    catch(...) { // 处理所有异常\n\
    \        // 报告工作\n        throw;\n    }\n}\n```\n\n### 14.3.2.1 处理器的顺序\n\n- 派生异常可能被多于一个异常类型的处理器捕捉，因此，在try语句中处理器的排列顺序非常重要。\n\
    \n```\nvoid f0() {\n    try{\n        ...\n    }\n    catch(std::ios_base::failure){\n\
    \        //处理标准I/O信息\n    }\n    catch(std::exception& e){\n        //处理所有标准异常\n\
    \    }\n    catch(...){\n        //处理其他异常\n    }\n}\n```\n\n### 处理器的顺序\n\n```\n\
    void f() {\n    try {\n        //...\n    }\n    catch(...) {\n        //处理任何其他异常\n\
    \    }\n    catch(std::exception& e){\n        //处理所有标准异常\n    }\n    catch(std::bad_cast){\n\
    \        //处理dynamic_cast失败\n    }\n}\n```\n\n如果次序安排得不好，有些异常处理代码将永远不会运行。左例中，bad_cast部分将永远不被执行，即使catch(...)部分去掉也不行。\n\
    \n## 14.4 资源管理\n\n- 当函数请求了某种资源（打开文件或者分配空间）时，一个很重要的问题就是需要正确释放这些资源。\n- 但是如果程序在运行过程中产生了异常，就会导致程序的流程不是所希望那样，此时要特别注意资源问题。\n\
    - 异常产生时，实现会向上穿越堆栈去为某个异常查找对应处理器，叫做“堆栈回退”，此时，会对所有局部对象调用析构函数。\n\n### 资源管理示例\n\n```\n\
    void use_file(const char* fn) {\n    FILE *f = fopen(fn,\"r\");\n    //使用资源\n\
    \    fclose(f);\n}\n//若在使用资源的过程中产生了异常，则fclose(f)将不会被调用，资源将不会被释放\n```\n\n```\n\
    void use_file(const char* fn) {\n    FILE *f = fopen(fn,\"r\");\n    try { //使用时\n\
    \        ...\n    }\n    catch(...){\n        fclose(f);\n        throw;\n   \
    \ }\n    fclose(f);\n}\n//一种解决办法，但是非常罗嗦\n```\n\n### 资源管理示例\n\n考虑问题的一般形式：定义一个类File_ptr\n\
    \n```\nclass File_ptr {\n    FILE* p;\npublic:\n    File_ptr(const char* n, const\
    \ char* a) { p = fopen(n, a); }\n    File_ptr(FILE* pp) { p = pp; }\n    ~File_ptr()\
    \ { if(p) fclose(p); }\n    operator FILE*() { return p; }\n};\n```\n\n一般按照申请的顺序反向释放资源。也就是说，上述例子中只需要用`File_ptr\
    \ f(fn,\"r\");`保护资源，析构函数就会被调用，资源就会被释放。\n\n## 14.4.1 构造函数和析构函数的使用\n\n- 利用局部对象管理资源的技术通常被称为“资源申请即初始化（resource\
    \ acquisition is initialization）”。\n- 只有在一个对象的构造函数执行完毕时，这个对象才被看作已经建立起来了。只有在此之后，异常产生时的堆栈回退才为该对象调用析构函数。\n\
    - 一个由子对象组成的对象的构造将一直持续到它所有的子对象都完成了构造。\n\n### 示例\n\n```\nclass X {\n    File_ptr\
    \ aa;\n    Lock_ptr bb;\npublic:\n    X(const char* x, const char* y)\n      \
    \  :aa(x,\"rw\"), // 申请x\n         bb(y) // 申请y\n    {}\n};\n```\n\n考虑X，构造该类需要两种资源：文件x和锁y。这些资源都可能失效并抛出异常。若设计不当，程序容易出现异常。为此，可以使用两个（子对象）类来处理x、y。这保持程序结构不会改变也不会漏掉任何异常情况。若在创建aa()之后、bb()之前抛出了异常，aa()的析构函数将被调用，bb()则不会。\n\
    \n### 示例\n\n```\nclass Y {\n    int* p;\n    void init();\npublic:\n    Y(int\
    \ s) {\n        p = new int(s);\n        init();\n    }\n    ~Y() { delete[] p;\
    \ }\n    //...\n};\n```\n\n```\nclass Z {\n    vector<int> p;\n    void init();\n\
    public:\n    Z(int s) : p(s) { init(); }\n    //...\n}; // 改造后的代码\n```\n\n// 若仅使用class\
    \ Y那样的代码，可能导致内存泄漏\n\n## 14.4.2 auto_ptr\n\n- 标准库提供的auto_ptr支持“资源申请即初始化”的技术。\n\
    - 下例中，Rectangle和由pc所指向的Circle都将被删除，无论是否有异常被抛出。\n\n```\nvoid f(Point p1, Point\
    \ p2, auto_ptr<Circle> pc, Shape* pb)\n{\n    auto_ptr<Shape> p(new Rectangle(p1,p2));\
    \ // 指向一个矩形\n    auto_ptr<Shape> pbox(pb);\n    p->rotate(45); // auto_ptr<Shape>\
    \ 会释放 Shape* 指针\n    //...\n    if(in_a_mess) throw Mess();\n} // 此时，p和pbox所指向的对象将被删除\n\
    ```\n\n### auto_ptr\n\n- 为了获得这种所有权语义（ownership semantics），也常被称为破坏性复制语义（destructive\
    \ copy semantic），auto_ptr具有与常规指针很不一样的复制语义：在将一个auto_ptr复制给另一个之后，原来的auto_ptr将不再指向任何东西。\n\
    - 因为复制auto_ptr将导致对它自身的修改，所以const auto_ptr就不能复制。\n\n### auto_ptr的声明\n\n```\ntemplate<class\
    \ X> class std::auto_ptr {\npublic:\n    typedef X element_type;\n    explicit\
    \ auto_ptr(X* p = 0) throw() { ptr=p; }\n    ~auto_ptr() throw() { delete ptr;\
    \ }\n    auto_ptr(auto_ptr& a) throw() : ptr(a.ptr) { a.ptr=0; }\n    template<class\
    \ Y> auto_ptr(auto_ptr<Y>& a) throw() : ptr(a.ptr) { a.ptr=0; }\n    auto_ptr&\
    \ operator=(auto_ptr& a) throw() { delete ptr; ptr=a.ptr; a.ptr=0; }\n    template<class\
    \ Y> auto_ptr& operator=(auto_ptr<Y>& a) throw() { delete ptr; ptr=a.ptr; a.ptr=0;\
    \ }\n};\n```\n\n```\n// 构造析构\nX& operator*() const throw() { return *ptr; }\n\
    X* operator->() const throw() { return ptr; }\nX* get() const throw() { return\
    \ ptr; }\nX* release() throw() { X* t=ptr; ptr=0; return t; }\n// 放弃所有权\nvoid\
    \ reset(X* p=0) throw() { if (ptr!=p) { delete ptr; ptr=p; } }\n\nauto_ptr(auto_ptr<X>&\
    \ x) throw(); // auto_ptr复制\ntemplate<class Y> auto_ptr(auto_ptr<Y>& x) throw();\
    \ // 复制构造函数\ntemplate<class Y> operator auto_ptr<Y>() throw(); // auto_ptr隐式转换\n\
    ```\n\n### auto_ptr说明\n\n- auto_ptr_ref的用途就是为普通auto_ptr实现破坏性复制语义，这使得const auto_ptr不可复制。\n\
    - 如果指针D*能转换到B*，那么这里的模板构造函数也能够将auto_ptr<D>转换到auto_ptr<B>。\n"
