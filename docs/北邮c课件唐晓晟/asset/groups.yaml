    \ T& x); // 加入新的第一个元素\n    void pop_front(); // 删除第一个元素\n};\n```"
  md: "\n## 操作综述\n\n- 关联容器提供如下基于关键码的检索操作\n\n| Associative Operations (§17.4.1) | \
    \ |\n|---|---|\n| `operator[]` | Access the element with key k (for containers\
    \ with unique keys). |\n| `find(k)` | Find the element with key k. |\n| `lower_bound(k)`\
    \ | Find the first element with key ≥ k. |\n| `upper_bound(k)` | Find the first\
    \ element with key greater than k. |\n| `equal_range(k)` | Find the lower_bound\
    \ and upper_bound elements with key k. |\n| `key_comp()` | Copy of the key comparison\
    \ object. |\n| `value_comp()` | Copy of the mapped value comparison object. |\n\
    \n## 17.1.2 容器综述\n\n**Standard Container Operations**\n\n| | List Operations |\
    \ Front Operations | Back (Stack) Operations | Iterators |\n|---|---|---|---|---|\n\
    | vector | const | const | const+ | Ran |\n| list | const | const | const+ | Bi\
    \ |\n| deque | O(1) | const | const+ | Ran |\n| stack |  |  | const+ |  |\n| queue\
    \ |  | const | const+ |  |\n| priority_queue | O(log(n)) |  | O(log(n)) |  |\n\
    | map | O(log(n)) |  |  | Bi |\n| multimap | O(log(n)) |  |  | Bi |\n| set | O(log(n))\
    \ |  |  | Bi |\n| multiset | O(log(n)) |  |  | Bi |\n| string | O(n) | O(n) |\
    \ const+ | Ran |\n| array | const | const | const+ | Ran |\n| valarray | const\
    \ | const |  | Ran |\n| bitset | const | const |  | Ran |\n\n- 主表中，Iterators列的Ran表示随机访问，Bi表示双向迭代。\n\
    - 表中各项表示的都是操作的效率，`const`表示该操作所用的时间不依赖于容器中元素的数目（相当于O(1)），后缀+表明偶尔会出现显著的额外时间开销，注意基本操作中没有特别昂贵的操作，比如说O(n²)。\n\
    - 有关复杂性和代价的度量值都是上界。\n\n## 17.1.3 表示\n\n- 标准并没有为各种标准容器预先设定任何特定的实现方式。相反，标准只是描述了各种容器的界面，并提出了一些复杂性要求。\n\
    - 实现者将选择适当的，一般也是经过最聪明地优化过的实现方式，以满足这些普遍要求。\n- 例如：vector(数组)、list(链表)、map(平衡树)、string(11章所描述的方式或者数组)。\n\
    \n## 17.1.4 对元素的要求\n\n- 容器里的元素是被插入对象的副本。\n- 一个对象要想成为容器的元素，它就必须属于某个允许容器的实现对它进行复制的类型。\n\
    - 容器可以使用复制构造函数或赋值运算符来完成元素的复制工作，在两种情况下，都要求复制结果是一个等价的对象。\n\n### 17.1.4.1 比较\n\n\
    - 关联容器要求其元素是有序的，许多可以应用于容器的操作也是这样（例如，sort()）。\n- 按照默认方式，这个序由 `<` 运算符定义，如果不合适，程序员必须另外提供合适的比较操作。\n\
    - 排序准则必须定义一种严格的弱序（strict weak ordering），即小于和等于操作必须具有传递性。\n\n### 比较示例\n\n```\n\
    template<class Ran> void sort(Ran first, Ran last);\ntemplate<class Ran, class\
    \ Comp> void sort(Ran first,\n                                Ran last, Comp cmp);\n\
    \nclass Nocase{\npublic: bool operator()(const string& x, const string& y) const{\n\
    \    string::const_iterator p = x.begin();\n    string::const_iterator q = y.begin();\n\
    \    while(p!=x.end() && q!=y.end() && toupper(*p)==toupper(*q)){\n        ++p;\
    \ ++q;\n    }\n    if(p == x.end()) return q!=y.end();\n    if(q == y.end()) return\
    \ false;\n    return toupper(*p) < toupper(*q);\n}\n};\n```\n\n- 使用上面的比较准则调用sort()，例如，给定fruit：apple\
    \ pear Apple Pear lemon。\n- 用sort(fruit.begin(), fruit.end(), Nocase())将产生 fruit：Apple\
    \ apple lemon Pear pear。\n- 而简单地用sort(fruit.begin(), fruit.end())将给出 fruit：Apple\
    \ Pear apple lemon pear。\n\n### 17.1.4.2 其他关系运算符\n\n- 默认情况下，容器和算法在需要小于比较时都采用 `<`，如果默认方式不合适，程序员必须提供一个比较准则。\n\
    - 标准库在名字空间std::rel_ops里定义了各种比较运算符，并通过`<utility>`给出：\n\n```\ntemplate<class T>\
    \ bool rel_ops::operator!=(const T& x, const T& y) { return !(x==y); }\ntemplate<class\
    \ T> bool rel_ops::operator>(const T& x, const T& y) { return y<x; }\ntemplate<class\
    \ T> bool rel_ops::operator<=(const T& x, const T& y) { return !(y<x); }\ntemplate<class\
    \ T> bool rel_ops::operator>=(const T& x, const T& y) { return !(x<y); } // 注意以上运算符假设x<y定义在类中或有转换\n\
    ```\n\n## 17.2 序列\n\n- 序列是vector所描述的模式的一般化。\n- 标准库提供的基本序列包括：vector、list、deque。\n\
    - 从它们出发，通过定义适当的界面，生成了stack、queue、priority_queue。\n- 这几个序列被称为容器适配器(container adapters)、序列适配器(sequence\
    \ adapters)、或简称适配器。\n\n## 17.2.1 向量—vector\n\n- 前面已经描述了vector的细节。\n- 只有vector提供预留空间的功能。\n\
    - 按默认规则，用`[]`的下标操作不做范围检查，如果需要检查，请用at()。\n- vector提供随机访问迭代器。\n\n## 17.2.2 表—list\n\
    \n- list是一种最适合于做元素插入和删除的序列。\n- 由于下标访问操作太慢（与vector相比），list没有提供下标操作，也因为这个原因，list提供的就是双向迭代器。\n\
    - list给出了vector所提供的几乎所有成员类型和操作，例外的是下标、capacity()和reserve()。\n\n### 17.2.2.1 拼接、排序和归并\n\
    \nlist提供了若干特别适合于对表进行处理的操作，这些操作都是稳定的。\n\n```\ntemplate <class T, class A = allocator<T>\
    \ > class list {\npublic:\n    // 表的拼接、排序和归并操作\n    void splice(iterator pos,\
    \ list& x);\n    // 将x的所有元素移到本表pos之前，且不改变顺序\n    void splice(iterator pos, list&\
    \ x, iterator p);\n    // 将x中的p移到本表的pos之前，且不改变顺序\n    void splice(iterator pos,\
    \ list& x, iterator first, iterator last);\n    void merge(list& x);\n    template\
    \ <class Cmp> void merge(list& x, Cmp cmp);\n    void sort();\n    template <class\
    \ Cmp> void sort(Cmp cmp);\n};\n```\n\n例如：输出\n\nfruit: apple pear\ncitrus: orange\
    \ grapefruit lemon\n\n我们可以：\n\n```\nlist<string>::iterator p = find_if(fruit.begin(),\
    \ fruit.end(), initial('p'));\nfruit.splice(p, citrus, citrus.begin());\nfruit.splice(p,\
    \ citrus, citrus.begin(), citrus.end());\n```\n\n注意，这里的迭代器参数必须是合法的迭代器，确实指向它们所声称来自的某个list。\n\
    \n```\nlist<string>::iterator p = find_if(fruit.begin(), fruit.end(), initial('p'));\n\
    fruit.splice(p, citrus, citrus.begin()); // OK\nfruit.splice(p, citrus, fruit.begin());\
    \ // 错误：fruit.begin()并不指向citrus\ncitrus.splice(p, fruit, fruit.begin()); // 错误：p不是指向citrus\n\
    ```\n\n- merge()将两个排序好的表组合起来，方式是把一个list的元素搬进另一个，并维持正确的顺序。\n- 如果一个表未排序，merge()仍然能够产生一个表，其中包含两个表的元素的并集，只是顺序未作保证。\n\
    \n```\nf1: apple quince pear\nf2: lemon grapefruit orange lime\n归并：\nf1.sort();\n\
    f2.sort();\nf1.merge(f2); // merge也不改变顺序\n其结果是：\nf1: apple grapefruit lemon lime\
    \ orange pear quince\nf2: <empty>\n```\n\n### 17.2.2.2 前端操作\n\n- list也提供一些针对第一个元素的操作，与每个容器都提供的针对最后元素的操作相对应。\n\
    - 对list而言，前端操作与后端操作一样方便高效，如果可以选择的话，最好是用后端操作，这样写出来的代码也较短。\n\n```\ntemplate <class\
    \ T, class A = allocator<T> > class list {\npublic:\n    // 元素访问\n    reference\
    \ front(); // 访问第一个元素\n    const_reference front() const;\n    void push_front(const\
    \ T& x); // 加入新的第一个元素\n    void pop_front(); // 删除第一个元素\n};\n```\n"
