  - "[PAGE 69]\n\n# 延迟求值(lazy evaluation)\n\n+   - 若某个类中只有一部分内容改变时，将这些或声称为 mutable表示合适的。但是如果有批量或频繁修改，最好将该数据放入另外一个独立的对象里，并间接访问它\n\
    \n```\nstruct cache{\n    bool valid;\n    string rep;\n}\nclass Date{\n    cache*\
    \ c;\n    void cache_value() const;\npublic:\n    string rep() const;\n};\nstring\
    \ Date::string_rep() const\n{\n    if(!c->valid){\n        cache_value();\n  \
    \      c->valid = true;\n    }\n    return c->rep;\n}\n```\n\n这种技术可以用于到类成员方式的延迟求值\n\
    \n# 10.2.8 结构体和类\n\n+   - 按定义，'struct'类是与class一样，但是成员默认是公用的，也即：struct S{ ... }等价\
    \ class S { public: ... }的简写形式\n+   - 一般情况下，struct被用来存放具有或几乎是公用的数据表\n+   - 这种类是不完整的类，不足以构成数据表\n\
    +   - 结构中也可以有构造函数\n\n```\nclass Date1 {\n    int d, m, y;\npublic:\n    int day()\
    \ const;\n    void add_year(int n);\n};\nclass Date2{\n    private:\n    int d,\
    \ m, y;\npublic:\n    Date2(int dd, int mm, int yy);\n    void add_year(int n);\n\
    };\n```\n\n上述两类声明了各自不同、完全备份\n\n# 10.2.9 类内部定义的函数定义\n\n+   - 如果一个函数是在类内定义的(不是简单的声明)，那么这个函数就被做为内联函数处理\n\
    +   - 也或者说，在类内部定义的函数应该很小，频繁使用的函数\n\n```\nclass Date{\n    int d, m, y;\npublic:\n\
    \    int day() const\n    { return d; }\n}; // 声明和函数都在首部\nclass Date{\npublic:\n\
    \    int day() const;\nprivate:\n    int d, m, y;\n};\ninline int Date::day()\
    \ const\n{ return d; }\n```\n\n# 10.3 高效的用户定义类型\n\n前边所提及的是设计一个Date类的各种细节，本部分主要内容讨论设计一个简单而高效的Date类，并阐明语言的各种特性来如何支持这种设计\n\
    \n+   - 应用系统中会频繁的使用很多种抽象，例如：字符、整数、复数、向量、数组等，但C++直接支持其中一些最常见的抽象，但是，C++提供了使用用户定义类型的机制"
  md: "\n## 10.2.2 访问控制\n\n通过struct Date声明，提供了一组操作Date的函数，然而，它却没有清楚地说明这些函数就是直接依赖于Date表示的全部函数，而且也是仅有的能够直接访问Date类的对象的函数。\n\
    \n这些限制可以通过用class替代struct而描述清楚。\n\n### 访问控制\n\nstruct的public成员还分两个部分：其中第一部分（由用符号{}分隔的成员函数组成）被限定。前一部分（由成员变量组成）形成了该类的对应的公共界面：struct也是class。不论此处的认识方式如何，共同认识到各个成员界面。\n\
    \n```cpp\nclass Date { //成员变量声明\n  int d, m, y;\n  public:\n    void init(Date&\
    \ d, int, int, int);\n    void add_year(int n)\n    {\n      y += n;\n    }\n\
    \    void add_year(Date& d, int n);\n    void add_month(Date& d, int n);\n   \
    \ void add_day(Date& d, int n);\n};\n```\n\n```cpp\n//非成员函数被禁止访问对象的成员\nvoid timewrap(Date&\
    \ d)\n{\n  d.y -= 200; // Error\n}\n```\n\n这和预期的一样。1. 与声明的成员函数必然是由成员函数组成的；2. 普通的用于客户使用一个类，但必须要求变成成员函数定义。又这样一个init函数的问题：1.\
    \ 有一个类被初始化的对象信息是有用的；2. 数据的封装性要求我们这么做。\n\n## 10.2.3 构造函数\n\n采用init一类的函数提供对类对象的初始化，这么做既不优美又容易出错（比如说，忘记调用）。\n\
    \n更好的途径是让程序员有能力去声明一个函数，其声明目的就是去完成对对象的初始化，此类函数称为构造函数。\n\n构造函数具有与类相同的名字。\n\n###\
    \ 构造函数\n\n```cpp\nclass Date{\n//\nDate(int,int,int);\n//默认构造函数\n// ctor\n};\n\
    ```\n\n```cpp\nDate today = Date(23,6,1983);\nDate xmas(25,12,1990);\nDate my_birthday;\n\
    // Error 构造函数缺失\nDate release1_0(10,12);\n// Error 一个参数\n```\n\n对于一个类，这个类的所有对象的构造都通过类的构造函数进行。构造函数可以完成对象的初始化工作。\n\
    \n### 构造函数\n\n```cpp\nclass Date {\nint d, m, y;\npublic:\nDate(int dd=0,\nint\
    \ mm=0, int yy=0);\n//\n};\nDate::Date(int dd, int mm, int yy)\n{\nd = dd? dd\
    \ : today.d;\nm = mm? mm : today.m;\ny = yy? yy : today.y;\n}\n```\n\n也可以用带默认参数的函数来模拟重载函数。\n\
    \n## 10.2.4 静态成员\n\n- 为Date提供默认值的方式隐藏着一个重要问题：Date类现在依赖一个全局变量today\n- 如果这是一个全局变量，而只在Date类中使用，用户会遇到很多意想不到的事情，而且维护工作也变得棘手\n\
    - 对此的解决办法是：创建一个static静态成员，可以获得全局变量的方便，而又无需受到访问全局变量之累\n- 对于所有对象，静态成员只有一个副本\n- 使用一个静态成员，不必依赖任何对象\n\
    \n### 静态成员\n\n```cpp\nclass Date{\nint d, m, y;\nstatic Date default_date;\npublic:\n\
    Date(int dd=0,\nint mm=0, int yy=0);\n//\nstatic void set_default(int,int,int);\n\
    };\n```\n\n```cpp\nvoid f()\n{\nDate::set_default(4,5,1945);\n}\nDate::Date(int\
    \ dd, int mm, int yy)\n{\nd = dd? dd : default_date.d;\nm = mm? mm : default_date.m;\n\
    y = yy? yy : default_date.y;\n}//Date()相当于Date::default_date\n```\n\n```cpp\n\
    void Date::set_default(int d,\nint m, int y)\n{\nDate::default_date = Date(d,m,y);\n\
    }\n```\n\n### this示例\n\n```cpp\nDate& Date::add_year(int n)        Date::Date(int\
    \ y, int m, int d)\n{\n    if(this->d==29 && this->m==2){\n        if(leapyear(this->y+n)){\n\
    \            this->d = 1;\n            this->m += 1;\n        } else {\n     \
    \       this->m = m;\n            this->d = d;\n        }\n    }\n    this->y\
    \ += n;\n    return *this;\n}\n// 使用this的例子\n```\n\n## 10.2.7.1 物理的和逻辑的常量性\n\n\
    - 偶尔有这种情形，一个成员函数在逻辑上是const，但它却仍然需要改变某个成员的值。对于用户而言，这个函数看似没有改变其对象的状态，然而，它却可能更新某些用户不能直接访问的细节，这通常被称为逻辑的常量性。\n\
    - 例如：Date类可能有一个函数，返回该日期的字符串表示，构造字符串是相对费时的，实现中可以为其保留一个副本。重复需要时返回该副本即可。\n\n### 逻辑的常量性\n\
    \n```cpp\nclass Date{\n    bool cache_valid;\n    string cache;\n    void compute_cache_value()\
    \ const;\n    //...\npublic:\n    string string_rep() const;\n    //检查一次缓存是否有效\n\
    };\n\n// 头文件解决一点点类似，也无法保证绝对能工作，例如\nDate d1;\nconst Date d2;\nstring s1 = d1.string_rep();\
    \ // ok\nstring s2 = d2.string_rep(); // 不允许变为const\n```\n\n## 10.2.7.2 可变的—mutable\n\
    \n- 为了解决上述const限制，可以将所涉及的变量声明为mutable。\n\n```cpp\nclass Date{\n    mutable bool\
    \ cache_valid;\n    mutable string cache;\n    void compute_cache_value() const;\n\
    \    //...\npublic:\n    string string_rep() const;\n};\n\nDate d1;\nconst Date\
    \ d2;\nstring s1 = d1.string_rep(); // ok\nstring s2 = d2.string_rep(); // ok\n\
    ```\n\n### 延迟求值(lazy evaluation)\n\n- 若某个类中只有一部分内容改变时，将这些成员声明为mutable是合适的。但是如果大量或频繁修改，最好将该数据放入另外一个独立的对象里，并间接访问它。\n\
    \n```cpp\nstruct cache{\n    bool valid;\n    string rep;\n}\n\nclass Date{\n\
    \    cache* c;\n    void cache_value() const;\npublic:\n    string rep() const;\n\
    };\n\nstring Date::rep() const\n{\n    if(!c->valid){\n        cache_value();\n\
    \        c->valid = true;\n    }\n    return c->rep;\n}\n```\n\n这种技术可以用于类成员的延迟求值。\n\
    \n## 10.2.8 结构体和类\n\n- 按定义，struct与class是一样的，但是成员默认是公用的，也即：struct S { ... } 等价于\
    \ class S { public: ... } 的简写形式。\n- 一般情况下，struct被用来存放具有或几乎是公用的数据表。\n- 这种类是不完整的类，不足以构成数据表。\n\
    - 结构中也可以有构造函数。\n\n```cpp\nclass Date1 {\n    int d, m, y;\npublic:\n    int day()\
    \ const;\n    void add_year(int n);\n};\nclass Date2{\n    private:\n    int d,\
    \ m, y;\npublic:\n    Date2(int dd, int mm, int yy);\n    void add_year(int n);\n\
    };\n```\n\n上述两类声明了各自不同但完全等价的类。\n\n## 10.2.9 类内部定义的函数定义\n\n- 如果一个函数是在类内定义的（不是简单的声明），那么这个函数就被作为内联函数处理。\n\
    - 换句话说，在类内部定义的函数应该是很小的、频繁使用的函数。\n\n```cpp\nclass Date{\n    int d, m, y;\npublic:\n\
    \    int day() const\n    { return d; }\n}; // 声明和函数都在首部\nclass Date{\npublic:\n\
    \    int day() const;\nprivate:\n    int d, m, y;\n};\ninline int Date::day()\
    \ const\n{ return d; }\n```\n\n## 10.3 高效的用户定义类型\n\n前边所提及的是设计一个Date类的各种细节，本部分主要内容是讨论设计一个简单而高效的Date类，并阐明语言的各种特性如何支持这种设计。\n\
    \n- 应用系统中会频繁地使用很多种抽象，例如：字符、整数、复数、向量、数组等，但C++直接支持其中一些最常见的抽象，但是，C++提供了使用用户定义类型的机制。\n"
