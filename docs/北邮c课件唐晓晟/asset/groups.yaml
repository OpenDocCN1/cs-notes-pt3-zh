    # 7.8 宏


    +   - 第一规则：绝不应去使用它，除非你不得

    +   不这么做

    +   - 几乎每个宏都表明了程序设计语言中、或者

    +   程序里、或者程序员的一个缺陷

    +   - 宏使得编译器在真正处理正文之前需要进行

    +   预处理操作，编译器看到的是宏展开后的结

    +   果、可能导致非常难以理解的错误


    # 关于宏使用中的注意事项


    +   - 宏预处理器不能处理递归的宏

    +   - 宏的名字不能重载

    +   - 在宏中，引用全局名字时一定要使用作用域

    +   解析运算符::；并在所有可能的地方将出现

    +   的宏参数都用括号圈起来

    +   - 宏中的注释请使用/* */方式

    +   - 通过##宏运算符可以拼接起两个串，构造

    +   出一个新串


    # 宏的示例(1)


    ```

    #define NAME rest of line

    named = NAME

    // named = rest of line


    #define MAC(x,y) arg x arg y

