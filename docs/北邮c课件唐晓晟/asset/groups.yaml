  - "[PAGE 46]\n\n# 带限定词的名字示例\n\n```\nnamespace Lexer1 { // 另一个 namespace\n  enum\
    \ Token_value { NAME, NUMBER, END, MUL='*' };\n  Token_value curr_tok;\n  double\
    \ number_value;\n  string string_value;\n  Token_value get_token() { /* ... */\
    \ }\n}\n\ndouble Parser::term(bool get) // Parser作用域\n{\n  double left = prim(get);\
    \ // 不需要限定词\n  for(;;) switch(Lexer::curr_tok) { // Lexer\n    case Lexer::NAME:\n\
    \      left *= prim(true); // 不需要限定词\n      // ...\n  }\n  /* ... */\n}\n```\n\
    \n# 8.2.2 使用声明\n\n当编程中频繁使用另外一个名字空间中的变量时，可以通过使用声明语句来避免反复书写名字空间限定词\n\n```\ndouble\
    \ Parser::prim(bool get)\n{\n  if(get) Lexer::get_token();\n  switch(Lexer::curr_tok){\n\
    \    case Lexer::NUMBER:\n      Lexer::get_token();\n      /* ... */\n  }\n}\n\
    \ndouble Parser::prim(bool get)\n{\n  using Lexer::get_token;\n  using Lexer::curr_tok;\n\
    \  if(get) get_token();\n  switch(curr_tok){\n    case NUMBER:\n      get_token();\
    \ // ...\n  }\n}\n```\n\n也可以把相关的使用说明放在在 Parser 名字空间的定义里\n\n```\nnamespace Parser{\n\
    \  double prim(bool);\n  double term(bool);\n  double expr(bool);\n\n  using Lexer::get_token;\n\
    \  using Lexer::curr_tok;\n  using Error::error;\n}\n\ndouble Parser::term(bool\
    \ get)\n{\n  double left = prim(get);\n  switch(curr_tok){\n    case Lexer::MUL:\n\
    \      left *= prim(true);\n      break;\n    case Lexer::DIV:\n      if(double\
    \ d = prim(true))\n        { left /= prim(true); break; }\n      return error(\"\
    divided by 0\");\n  }\n  /* ... */\n}\n```\n\n# 8.2.3 使用指令\n\n一个使用指令能把来自一个名字空间的所有名字都变成可用\n\
    \n```\nnamespace Parser{\n  double prim(bool);\n  double term(bool);\n  double\
    \ expr(bool);\n\n  using namespace Lexer;\n  using namespace Error;\n}\n```"
