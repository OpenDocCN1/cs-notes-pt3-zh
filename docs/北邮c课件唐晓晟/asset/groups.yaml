    \ = new DD;\nB* pb = pd; //可以：通过D1访问\nint i1 = pd->m; //可以：通过D1访问\n```\n\n###\
    \ 多重继承和访问控制示例\n\n如果一个实体可以通过多条路径到达，我们还是可能歧义地引用它\n\n```\nstruct B{\nint m;\nstatic\
    \ int sm;\n};\nclass X1:public B(...);\nclass X2:public B(...);\nclass XX:public\
    \ X1,public X2(...);\nXX* pxx = new XX;\nint i1 = pxx->sm; //可以：静态\nint i2 = pxx->m;\
    \ //错误：有XX两个B::sm\n```\n"
