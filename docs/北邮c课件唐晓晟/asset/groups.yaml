  - "[PAGE 97]\n\n# 12.2.4 类层次结构(Class Hierarchies)\n\n+   派生类也可以做为基类\n\n```\nclass\
    \ Employee{...};\nclass Manager:public Employee{...};\nclass Director:public Manager{...};\n\
    ```\n\n+   一组相关的类按照习惯被称为一个类层次结构\n\n```\nclass Temporary{...};\nclass Secretary:public\
    \ Employee{...};\nclass Tsec:public Temporary, public Secretary{...};\nclass Consultant:public\
    \ Temporary, public Manager{...};\n```\n\n+   C++可以表示类的有向无环图\n\n# 12.2.5 类型域\n\
    \n为了使派生类不仅仅是一种完成声明的方便简写形式，必须解决如下问题：对于给定的类型为Base*的指针，被指的对象到底属于哪个派生类？\n\n+   四种基本的解决方案\n\
    \n+   (1) 保证被指的只能是唯一类型的对象\n+   (2) 在基类里安排一个类型域，供函数检查\n+   (3) 使用 dynamic_cast\n\
    +   (4) 使用虚函数\n\n# 方案2的示例\n\n```\nstruct Employee\n{\n  enum EmpL_type{M,E};\n\
    \  EmpL_type type;\n  Employee():type(E){}\n  string ...\n};\nstruct Manager:public\
    \ Employee\n{\n  Manager():type(M)\n  list<Employee*> group;\n  ...\n};\nvoid\
    \ print_employee(const Employee* e)\n{\n  switch(e->type){\n    case Employee::E:\n\
    \      cout << e->family_name << e->department;\n      break;\n    case Employee::M:\n\
    \      cout << e->family_name << e->department;\n      const Manager* p =\n  \
    \      static_cast<const Manager*>(e);\n      cout << p->level;\n      break;\n\
    \  }\n}\n```\n\n# 方案2的示例\n\n+   这种方式可以工作，特别是当由一个人维护的小型项目里\n\n+   致命弱点：程序员按照特定的方式来继续这些类型，这种方式是编译器无法检查的\n\
    \n+   如果引入Employee的新的派生类，需要改动太多的原有代码，维护麻烦\n\n+   对数据隐藏以及信息隐藏原则是一个很大的破坏，基类是类“公信信息”的展台"
