    基础类型是：char

    声明符是：*king[]，常用的声明符有*、const、&等前缀，以及[]、()等后缀，前缀和后缀的声明顺序能影响声明实体的含义

    例如定义：{...}


    ```

    注意，声明中不能没有类型

    const c=7; // Error

    gt(int a, int b){ return (a>b)?a:b; } //Error

