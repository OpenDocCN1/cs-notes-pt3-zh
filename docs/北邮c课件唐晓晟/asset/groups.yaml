    +   - 实际应用中，也可直接使用数值下标(比如数字7)作为索引，方法是c.erase(c.begin()+7)


    # 元素定位示例


    ```

    template<class C, void f(C& c){

    c.erase(c.begin()+7); // ok

    // 但是不支持迭代器的类型不能这样用，list不支持c.begin()+7

    c.erase(&c[7]); // 更好

    // 但是c[7]可能越界，其它类型如map，vector等不支持

    // 比如对于map，迭代器是mapped_type&，value_type&，不能直接用

