    # 13.5 专门化


    +   用户可以提供多个模板设计实例，编译器在实际应用中基于模板参数来进行选择


    +   一个模板的多个可以互相替代的定义被称为对用户的专门化，或者简称为用户专门化


    ```

    template<class T> class Vector{

    T* v;

    int sz;

    public:

    Vector();

    explicit Vector(int);

    T& elem(int i){return v[i];}

    T& operator[](int i);

    };

    // 大致分离Vector中继承系统并

    // 重新定义从它继承过来的方法

    Vector<int> vi;

    Vector<Shape*> vps;

    Vector<string> vs;

    Vector<char> vpc;

    Vector<Node*> vpn;

    ```


    # 专门化


    +   大部分C++实现的方式是对模板函数建立代码段的副本，这可能导致严重的代码膨胀


    +   可以通过设计，使得所有指针容器都能够共享同一份实现代码，这可以通过专门化做到


    +   首先，定义一个void的指针的(专门化)Vector版本


    +   而后这个专门化就会被用作所有指针的Vector的共同实现，因为所有特定的指针类都都可以被转化为void*


    # 专门化示例


    +   template<> 表示这是一个专门化，不需要模板参数，<void*> 表示这个定义应该用在所有的T是void*的Vector实现中


    +   Vector<void*> 将用于如下定义的Vector: Vector<void*> vpv;


    ```

    template<> class Vector<void*>{

    void** p;

    void*& operator[](int i);

    };

    ```


    # 专门化示例


    +   为了使得该专门化能够用于所有指针的Vector，且仅用于指针的Vector。需要一个部分专门化(partial specification)


    +   名称后面的 <T*> 证明这个专门化将被用于每一个指针类型


    ```

    template<class T> class Vector<T*> : private Vector<void*>{

    public:

    typedef Vector<void*>: Base;

    Vector() : Base() {}

    explicit Vector(int i) : Base(i) {}

    T* & elem(int i){return reinterpret_cast<T*&>(Base::elem(i));}

    T* & operator[](int i){return reinterpret_cast<T*&>(Base::operator[](i));}

    }; // 部分专门化

    ```'
