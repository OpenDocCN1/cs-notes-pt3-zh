  - "[PAGE 51]\n\n# 组合与选择\n\n查看一个名字空间时，其中显式声明的名字（包括通过using指令声明的名字）优先于在其他作用域里的那些通过using指令才能访问的名字\n\
    \n例如：对于String和Vector名字冲突的解析将分别偏向于His_lib::String和Her_lib::Vector。此外，My_lib::List总会被使用，和Her_lib或者His_lib中是否提供了List没有任何关系\n\
    \n# 8.2.9 名字空间和老代码\n\n现有数以百万行计的C和C++代码，我们若想使用这些代码，必须通过名字空间缓和这种代码之间的名字冲突问题\n\n\
    幸运的是，对于C代码，我们可以继续使用它们（就像它们是在名字空间里定义的一样），但是，对于C++代码无法做到这一点，只能尽力减少由于设计时名字空间的引入给已有的C++程序带来的破坏\n\
    \n# 8.2.9.1 名字空间和C\n\n```\n#include <cstdio.h>      //c_stdio. 恰恰你看不见一大堆\nint\
    \ main()               //名字都能够直接使用的人\n{                        namespace std{\n\
    \    printf(\"Hello, world!\\n\");   int printf(const char *...);\n}         \
    \               ...\n}\n\n//标准C中stdio.h可以如下定义     //在纯C++标准库中stdio.h\nnamespace\
    \ std{           //#include <cstdio.h>\n    int printf(const char *...);   using\
    \ std::printf;\n    ...\n}\nusing namespace std;\n```\n\n# 8.2.9.2 名字空间和重载\n\n\
    重载可以跨名字空间工作\n\n```\n//老到A.h                //新到A.h        //新的B.h\nvoid f(int);\
    \             namespace A{      namespace B{\n                         void f(int);\
    \      void f(char);\n}                        }                }\n//老到B.h\nvoid\
    \ f(char);\n//新到user.c\n#include \"A.h\"      #include \"A.h\"      #include \"\
    B.h\"\n#include \"B.h\"      using namespace A;   using namespace B;\nvoid g()\
    \ {               void g() {        void g() {\n    f('a'); //调用B.h中的f }     \
    \           f('a'); //调用B.h中的f()\n}\n```"
  - "[PAGE 52]\n\n# 8.2.9.3 名字空间是开放的\n\n可以通过多个名字空间声明给它加入名字\n\n```\nnamespace A{ int\
    \ f(); } //A中没有g()\nnamespace A{ int g(); } //A中既有f()和g()\nvoid A::f() { ... }\n\
    ```\n\n注意，当定义一个名字空间中已经声明过的成员时，安全的方法是采用语法形式 A::语法格式\n\n```\nvoid A::f() { ... }\n\
    //Error:A没有g()\n//不要使用如下方式\nnamespace A{ void g() {...}; } //这个声明会引入一个前置声明f()，而不是\
    \ //实现已经声明过的f()请注意，编译器不检查\n```\n\n# 8.3 异常\n\n当一个程序是由一些相互分离的模块组成时，特别是当这些模块来自某些独立开发的库时，错误处理的工作就需要分成两个相互独立的部分\n\
    \n+   - 一方报告那些无法在局部解决的错误\n+   - 另一方处理那些在其他地方被查出来的错误\n\n异常(exception)机制是C++中用于将错误报告与错误处理分开的手段\n\
    \n# 8.3.1 抛出和捕捉\n\n异常概念是为了帮助处理错误的报告\n\n基本思想是：如果函数发现了一个自己无法处理的问题，它就抛出(throw)一个异常，希望它的(直接或间接)调用者能够处理这个问题。如果一个函数想处理某个问题，它就可以说明自己要捕捉(catch)用于报告这种问题的异常\n\
    \n# 异常处理示例\n\n```\nstruct Range_error{\n int i;\n Range_error(int ii)\n :i(ii){}\n\
    };\nchar_to_char(int i)\n{\n if(i<numeric_limits<char>::min()\n || i>numeric_limits<char>::max())i\n\
    \ throw Range_error(i);\n return i;\n}\n```\n\n```\nvoid g(int i)\n{\n try {\n\
    \ char c = to_char(i);\n ...\n } catch(Range_error x){\n cerr << \"oops\\n\";\n\
    \ cerr << x.i << endl;\n }\n}\n```\n\n其中catch(...){...}为异常处理者，它只能作为try语句作为底层的块之，或或者接下来有一个后续处理之行"
  - "[PAGE 53]\n\n# 异常的处理过程\n\n+   - 如果在一个try块中的任何代码（或者由那里调用的函数）抛出了一个异常，代码马上会产生异常的地方跳转到try后面的第一个异常处理器\n\
    +   - 如果所抛出的异常属于某个处理器所描述的类型，这个处理器就被执行\n+   - 如果try未抛出异常，这些异常处理器都将被忽略\n+   - 如果抛出了一个异常，而又没有catch块捕捉它，整个程序就将终止\n\
    \n# 8.3.2 异常的辨识\n\n+   - 典型情况下，一个程序中可能存在多种不同的运行时错误，可以将这些错误映射到一些具有不同名字的异常，为每一种异常取一个系统中唯一的名字是比较好的解决办法\n\
    +   - 处理器中不需要break语句\n+   - 一个函数不必捕捉所有可能的异常\n+   - 异常处理器也可以嵌套\n\n# 异常的辨识示例\n\n\
    ```\nstruct Zero_divide{};\nstruct Syntax_error;\n    const char* p;\n    Syntax_error(const\
    \ char* q)\n    { p = q; }\n};\n\ntry {\n    //...\n    expr(false);\n    //...\n\
    }\ncatch(Syntax_error se){\n    //处理语法错误\n}\ncatch(Zero_divide zd){\n    //处理除零问题\n\
    }\n//在exp执行过程中没有异常\n//或者出现异常并且被捕捉到\n//程序仍然将执行到这里\n```\n\n# 8.3.3 计算器中的异常\n\n+\
    \   - 利用异常处理机制来完成以前计算器程序中的错误处理\n+   - 这样做的好处是减少原来代码中程序各个部分的耦合程度，主要是其他部分和错误处理部分的耦合程度\n\
    +   - 原来的那种方式不能很好的用到由分别开发的库和会而成的程序中\n+   - 例子见课本p170和p171"
