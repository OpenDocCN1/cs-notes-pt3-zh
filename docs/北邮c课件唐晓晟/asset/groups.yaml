    \ const\n{\n    print(); //错误，无穷递归调用\n}\n```\n\n## 12.2.2 构造函数和析构函数\n\n```\nclass\
    \ Employee{\n    string first_name, family_name;\n    short department;\npublic:\n\
    \    Employee(const string & n, int d);\n};\nclass Manager : public Employee\n\
    {\n    list<Employee *> group;\n    short level;\npublic:\n    Manager(const string\
