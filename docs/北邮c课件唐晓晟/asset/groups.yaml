    \n```\nclass complex{\n    double re, im;\npublic:\n    double real() const {\
    \ return re; }\n    double imag() const { return im; }\n};\ninline bool operator==(complex\
    \ a, complex b)\n{\n    return a.real()==b.real() && a.imag()==b.imag();\n}\n\
    ```\n\n## 11.3.8 协助函数\n\n- 将所有的东西集中到一起，complex就变成了\n\n```\nclass complex\n{\n\
    \    double re, im;\npublic:\n    complex(double r=0, double i=0) : re(r), im(i)\
    \ {}\n    double real() const { return re; }\n    double imag() const { return\
    \ im; }\n    complex& operator+=(complex);\n    complex& operator-=(double);\n\
    \    // ==, !=, *, / == ...\n};\n```\n\n## 协助函数\n\n- 除此之外，还必须提供一批协助函数\n  - complex\
    \ operator+(complex, complex);\n  - complex operator+(complex, double);\n  - complex\
    \ operator+=(double, complex);\n  - // -, *, /, ...\n  - complex operator+(complex);\
    \ // 一元正号\n  - complex operator-(complex); // 一元负号\n  - bool operator==(complex,\
    \ complex);\n  - bool operator!=(complex, complex);\n  - ostream& operator<<(ostream&,\
    \ complex&);\n  - ostream& operator>>(ostream&, complex&);\n\n## 11.4 转换运算符\n\n\
    - 虽然通过构造函数来进行类型转换确实很方便，但是构造函数也无法达到\n  - 从用户类型到一个内部类型的转换（因为内部类型不是类）\n  - 从类类型到某个已有类型的转换（而不是修改那个已有类的声明）\n\
    - 这些问题可以通过为派生类定义转换运算符的方式解决\n- 成员函数X::operator T()，其中T是一个类型名，定义了一个从X到T的转换\n\n"
