    \ 传递的是引用\n    r = fsqrt(d); // 传递的是存储float(d)的临时值的引用\n}\nvoid update(float& r);\
    \ // 要求参数为普通引用类型\nvoid g(double d, float r)\n{\n    update(2.0f); // Error: 传递的参数是const\n\
