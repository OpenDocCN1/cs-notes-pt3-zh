    {\npublic:\n    Quad(double);\n};\nQuad operator+(Quad, Quad);\nvoid f(double\
    \ a1, double a2)\n{\n    Quad r1 = a1+a2; // 双精度加法\n    Quad r2 = Quad(a1) + a2;\
    \ // 需要求Quad算术\n}\n```\n\n## 11.5 友元\n\n- 一个常规的成员函数声明描述了一律在逻辑上相同不再的事情\n- \n- -\
    \ 该函数能访问类声明的私用部分\n- - 该函数位于类的作用域之中\n- - 该函数必须经过一个对象去激活（有一个this指针）\n- \n- static函数具有前两种性质\n\
    - 友元(friend)则只具有第一种性质\n\n## 友元示例\n\n- 比如说，我们希望定义一个运算符类Matrix和Vector的乘法。然而，我们所要做的这个乘法矩阵不可能同时成为两者的成员函数。此外，我们也不希望提供一个此领域访问函数，使每个用户都能对Matrix和Vector的完整表示进行读写操作\n\
    \n```\nclass Matrix;\nclass Vector;\nfloat v[4];\nfriend Vector operator*(const\
    \ Matrix&, const Vector&);\n\nclass Matrix{\n    Vector v[4];\n    friend Vector\
    \ operator*(const Matrix&, const Vector&);\n};\n```\n\n## 友元示例\n\n- - `friend`声明可以放在类的任何部分（私用或公用），放在哪里都没有关系\n\
    - - 一个类的成员函数可以是另一个类的友元\n- - 某个类的所有函数可以全都是另一个类的友元\n\n```\nclass List_iterator{\n\
    \    int* next();\n};\n\nclass List{\n    friend int* List_iterator::next();\n\
    };\n```\n\n## 11.5.1 友元的寻找\n\n- - 像成员的声明一样，一个友元声明不会给外围的作用域引进一个名字\n\n```\nclass\
    \ Matrix{\n    friend class Xform;\n    friend Matrix invert(const Matrix&);\n\
    };\n\nXform x; // 错误：在外围域里无Xform\nMatrix (*p)(const Matrix&) = &invert;\n// 错误：作用域里无invert()\n\
    ```\n\n## 友元的寻找示例\n\n- - 一个友元类必须或者是在外围作用域或是在外围作用域里进行声明的\n- - 或者是在友元为友元的那个类的直接外围且不是类的非类作用域里\n\
    - - 在外围的域内另名字空间作用域块之外的作用域中不存在声明\n\n```\nclass X{/*...*/}; // Y的友元\nnamespace N{\n\
    \    class Y{\n        friend class X;\n        friend class Z;\n        friend\
    \ class AE;\n    };\n}\nclass Z{/*...*/}; // Y的友元\nclass AE{/*...*/}; // Y的友元\n\
    ```\n\n## 友元的寻找示例\n\n- - 友元函数可以像友元类一样明确地声明，此外，还可以通过它的类参数找到，即使如果它并没有在外围最近的作用域里声明\n\
    \n```\nvoid f(Matrix& m)\n{\n    invert(m);\n} // Matrix的友元invert()\n```\n\n##\
    \ 11.5.2 友元和成员\n\n- 什么时候选用友元函数，什么时候成员函数刻画一个运算符才好？\n\n- 应该尽可能地减少访问类表面的函数数目\n\n\
    - 尽可能地将能访问的函数集合做小\n\n## 11.6 大型对象\n\n前面complex的运算符被定义为以类complex为参数，意味着对于每一个这个运算符，各个运算对象都需要复制。为了避免过度的复制，我们需要定义以引用为参数的函数\n\
    \n```\nclass Matrix{\n    double m[4][4];\npublic:\n    Matrix();\n    friend\
    \ Matrix operator+(const Matrix&, const Matrix&);\n    friend Matrix operator*(const\
    \ Matrix&, const Matrix&);\n};\n```\n\n## 大型对象实例(一种避免复制的技术)\n\n- 使用静态对象的缓冲\n\n\
    ```\nconst int max_matrix_temp=7;\nMatrix& get_matrix_temp()\n{\n    static int\
    \ nbuf = 0;\n    static Matrix buf[max_matrix_temp];\n    if(nbuf==max_matrix_temp)\
    \ nbuf=0;\n    return buf[nbuf++];\n}\n\nMatrix& operator+(const Matrix& arg1,\
    \ const Matrix& arg2)\n{\n    Matrix& res=get_matrix_temp();\n    //...\n    return\
    \ res;\n}\n```\n\n## 11.7 基本运算符\n\n一般说来，对于类X，复制构造函数X(const X&)负责完成从对象到另一个对象出发的初始化。如果类X有一个完成非平凡工作的析构函数，这样类很可能需要一个完整的互补和完整的类来控制构造、析构和复制\n\
    \n对于一个类，如果用户没有显式地声明复制构造函数或复制构造函数通过默认，编译器就会生成默认的操作\n\n```\nclass X{\n    X(SomeType);\n\
    \    X(const X&);\n    X& operator=(const X&);\n    ~X();\n};\n```\n"
