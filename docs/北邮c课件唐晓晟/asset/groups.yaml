    +   - 对于用户自己定义的`->`运算符，不保证这些关系，但若必要，并中间也提供这些部分指针。\n\n```\nclass Ptr_to_Y{\n  \
    \  Y* p;\npublic:\n    Y& operator=(){ return p;}\n    Y& operator*(){ return\
    \ *p;}\n    Y& operator[](int i){ return p[i];}\n};\n```\n\n# 11.11 增量和减量\n\n\
    +   - 一旦归定义`class Ptr_to_T`，一旦对指针的增量和减量进行重载，就可以像使用内置指针一样使用它。\n\n```\nclass Ptr_to_T{\n\
    \    T* p;\npublic:\n    Ptr_to_T(T* p, T* v, int s);\n    Ptr_to_T& operator++();\
    \ // 前缀\n    Ptr_to_T& operator++(int); // 后缀\n    Ptr_to_T& operator--(); //\
    \ 前缀\n    Ptr_to_T& operator--(int); // 后缀\n    T& operator*();\n};\n```\n\n#\
    \ 增量和减量示例\n\n```\nvoid f1(T a)\n{\n    T y[200];\n    T* p=&v[0];\n    *p--;\n\
    \    *p=a;\n    // p越界，没有捕捉到\n    ++p;\n    *p=a; // ok\n}\n\nvoid f2(T a)\n{\n\
    \    T y[200];\n    Ptr_to_T p(&y[0], y, 200);\n    p--; // p.operator--(0);\n\
    \    p=a;\n    // p.operator*() = a;\n    ++p;\n    *p=a; // ok\n}\n```\n\n# 11.12\
    \ 一个字符串类\n\n+   - 一个更实际的String类版本\n+   - 提供了一种语言义、字符读写操作、检查和不检查的访问、流I/O、用字符串字面量作为文字量、相等和拼接运算符，字符串表示为C风格的、用0结束的字符数组，并利用引用计数尽可能地减少复制"
