    +   - 抽象类的层次结构是一种表述概念的清晰而强有力的方法，又不会用实现细节或者运行时的额外开销去模糊这种表述\n\n# 类层次结构和抽象类\n\n+\
    \   - 虚函数的调用是廉价的，与它跨过的抽象边界的种类无关，调用一个抽象类的成员函数时开放着与调用任何其他virtual函数完全一样\n+   - 结论：一个系统展现给用户的应该是一个抽象类的层次结构，其实现所用的是一个传统的层次结构\n\
