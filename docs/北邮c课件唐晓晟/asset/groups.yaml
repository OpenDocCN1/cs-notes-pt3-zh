    - 下面通过一些小例子阐述模板的各种基本技术\n\n- 13.2 定义和使用类模板的基本机制\n- 13.3 函数模板，函数重载和类型推断\n- 13.4\
    \ 用模板参数多通用型算法的策略\n- 13.5 通过多个定义为一个模板提供多种实现\n- 13.6 派生和模板（运行时的和编译时的多态性）\n- 13.7\
    \ 源代码组织\n\n## 13.2 一个简单的String模板\n\n- 串是一个能够保存一些字符的类，而且提供了各种串的基本操作。\n- 实际应用中，我们可能希望为多种不同种类的字符（有符号字符、无符号字符、中文字符、希腊字符）提供这样的功能，因此希望能够以最大存储于特定字符集的方式输出串的概念。\n\
    - 因此可以将以前的char类型的串抽象为一个更具普遍性的串类型\n\n### 一个简单的String模板\n\n```\ntemplate<class C>\
    \ class String\n{\n    struct Srep;\n    Srep* rep;\npublic:\n    String();\n\
    \    String(const C*);\n    String(const String&);\n    C& operator[](int);\n\
    \    C read(int) const;\n    //...\n};\n```\n\ntemplate<class C>前缀说明当前正在声明的是一个模板，它有一个将在声明中使用的类型参数C。C的作用域将一直延伸到这个template<class\
    \ C>作为直接前缀的结束处。C代表了一种类型，不应该是某个类的名称。\n\n### 示例\n\n```\nString<char> cs;       \
    \          // 统计输入各个字母出现的次数\nString<unsigned char> us;       int main()\nString<wchar_t>\
    \ ws;              {\nclass uchar{                         String<char> buf;\n\
    \    String<char> buf;                map<String<char>,int> m;\n    map<String<char>,int>\
    \ m;         while(cin>>buf) m[buf]++;\n    while(cin>>buf) m[buf]++;    }\n};\n\
    String<uchar> js;                   // 以下按宽版\n                               \
    \     int main()\n                                    {\n                    \
