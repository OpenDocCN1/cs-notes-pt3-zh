    \n## 歧义性示例\n\n```\nclass X { /*...*/ X(int); X(char*); };\nclass Y { /*...*/ Y(int);\
    \ };\nclass Z { /*...*/ Z(X); };\n\nX f(X); Y f(Y); Z g(Z);\n\nvoid k1() {\n \
