    \ 的序列都可以用（vector 没有提供 pop_front()，所以不能作为 queue 的基础容器）。\n\n对于 queue，也是使用 push()\
    \ 添加元素，使用 pop() 删除元素。\n\n### 17.3.3 优先队列—priority_queue\n\n```cpp\ntemplate <class\
    \ T, class C = vector<T>,\n          class Cmp = less<typename C::value_type>\
    \ > class std::priority_queue {\nprotected: C c; Cmp cmp;\npublic:\ntypedef typename\
    \ C::value_type value_type;\ntypedef typename C::size_type size_type;\ntypedef\
    \ C container_type;\nexplicit priority_queue(const Cmp& a1 = Cmp(), const C& a2\
