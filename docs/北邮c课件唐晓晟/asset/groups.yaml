    +   - [5] 类名各子空间，彼此与其成员数据之间的关系更明确

    +   - [6] 将那些不被改变的数据成员或成员函数声明为const

    +   - [7] 将那些需要动态的表示，但无须针对特定调用的成员数据或static成员数据


