  - "[PAGE 122]\n\n# 14.3.1 重新抛出\n\n+   □ 在捕捉到了一个异常之后，很多情况下，处理者并不能完成对这个错误的全部处理，典型的方式是：该处理者能够局部能够做的事\
    \ 情，然后再一次抛出这个异常，这将使得错 误恢复动作分布在几个处理器里\n\n+   □ 重新抛出用一个不带运算对象的throw语句\n\n+   □ 重新抛出的异常就是当初捕捉到的那个异常，而不仅仅是异常处理器能够访问到的那个\
    \ 部分\n\n# 重新抛出示例\n\n```\nvoid h() {\n    try { // 可能抛出Matherr的代码\n    catch(Matherr){\n\
    \        if(can_handle_it_completed){\n            //处理Matherr\n            return;\n\
    \        }\n        else{\n            //完成这里做的事情\n            throw;\n      \
    \  }\n    }\n}\n```\n\n# 14.3.2 捕捉所有异常\n\n□ 对于函数，省略号\"...\"表示\"任何参数\"。同 样，catch(...)表示要捕捉所有异常\n\
    \n```\nvoid m() {\n    try {\n        // 一些代码\n    }\n    catch(...) { // 处理所有异常\n\
    \        // 报告工作\n        throw;\n    }\n}\n```\n\n# 14.3.2.1 处理器的顺序\n\n+   □\
    \ 派生异常可能被多于一个异常类型的处理器捕捉，因 此，在try语句时处理器的排列顺序非常 重要\n\n```\nvoid f0() {\n    try{\n\
    \        ...\n    }\n    catch(std::ios_base::failure){\n        //处理标准I/O信息\n\
    \    }\n    catch(std::exception& e){\n        //处理所有标准异常\n    }\n    catch(...){\n\
    \        //处理在其他异常\n    }\n}\n```"
  - "[PAGE 123]\n\n# 处理器的顺序\n\n```\nvoid f() {\n    try { \n        //... \n    }\n\
    \    catch(...) {\n        //处理任何其他异常\n    }\n    catch(std::exception& e){\n\
    \        //处理所有标准异常\n    }\n    catch(std::bad_cast){\n        //处理dynamic_cast失败\n\
    \    }\n}\n```\n\n如果次序安排的不\n好，有些异常处理代\n码将永远不会运行\n\n左例中，bad_cast\n部分将永远不被执\n行，即使catch(...)\n\
    部分去掉也不行\n\n# 14.4 资源管理\n\n+   - 当函数请求了某种资源(打开文件或者分配空间)时，一个很重要的间题就是需要正确释放这些资源\n\
    +   - 但是如果程序在运行过程中产生了异常，就会导致程序的流程不是所希望那样，此时特别注意资源问题\n+   - 异常产生时，实现会向上穿越堆栈”去为某个异常查找对应处理器，叫做“堆栈回退”，此时，会对所有局部对象调用析构函数\n\
    \n# 资源管理示例\n\n```\nvoid use_file(const char* fn) {\n    FILE *f = fopen(fn,\"\
    r\");\n    //使用资源\n    fclose(f);\n}\n//若在使用资源的过程中产生\n了异常，则close(f)将不会被调\n用，资源将被失败\n\
    ```\n\n```\nvoid use_file(const char* fn) {\n    FILE *f = open(fn,\"r\");\n \
    \   try { //使用时\n        ...\n    }\n    catch(...){\n        fclose(f);\n   \
    \     throw;\n    }\n    fclose(f);\n}\n//一种解决办法，但是非常罗嗦\n```\n\n# 资源管理示例\n\n考虑问题的一般形式：定义一个类File_ptr\n\
    void acquire() { class File_ptr{\n//申请资源1 FILE* p;\n//申请资源n public:\n//使用资源1 File_ptr(const\
    \ char* n,\n//使用资源n const char* a){fopen(n,a);}\n//释放资源n File_ptr(FILE* pp){p=pp;}\n\
    //释放资源1 ~File_ptr(){if(p) fclose(p);} \n} operator FILE*(){ return p;}\n}\n//一般按照申请的顺序：\n\
    反向释放资源。也就是说，上述例子中需要一句话和析构时释放的对象顺序\nFile_ptr f(fn,\"r\");\n保护资源\n析构函数就会被调用，资源就会被释放"
  - "[PAGE 124]\n\n# 14.4.1 构造函数和析构函数的的使用\n\n+   □ 利用局部对象管理资源的技术通常被称为 “资源申请即初始化(resource\
    \ acquisition is initialization)”\n+   □ 只有在一个对象的构造函数执行完毕时，这个对象才被看作已经建立起来了。只有在此之后，异常产生时的堆栈回退才为该对象调用析构函数\n\
    +   □ 一个由子对象组成的对象的构造将一直持续到它所有的子对象都完成了构造\n\n# 示例\n\n```\nclass X{\n    File_ptr\
    \ aa;\n    Lock_ptr bb;\npublic:\n    X(const char* x,\n      const char* y)\n\
    \      :aa(x,\"rw\"), // 申请x\n        bb(y)/... // 申请y\n    {}\n};\n```\n\n考虑X，构造该类需要两种资源：文件x和锁y。这些资源都可能失效并抛出异常。若若设计，程序异常容易大...为此，可以使用两个(子对象)类来处理x、y。这保持程序结构不会改变也不会去任何异常情况。若在创建aa()还没有bb()的情况下也抛出了异常，aa()的析构函数将被调用，bb()则不会\n\
    \n# 示例\n\n```\nclass Y{\n    int* p;\n    void init();\npublic:\n    Y(int s)\
    \ {\n        p=new int(s);\n        init();\n    }\n    ~Y(){delete[] p;}\n  \
    \  //...\n};\n```\n\n```\nclass Z{\n    vector<int> p;\n    void init();\npublic:\n\
    \    Z(int s) : p(s) {init();}\n    //...\n}; // 改造后的代码\n```\n\n// 仅有位避免的代码，可能导致内存流失\n\
    \n# 14.4.2 auto_ptr\n\n+   □ 标准库提供的auto_ptr支持“资源申请即初始化”的技术\n+   □ 下例中，Rectangle和由po所指向的Circle都将被删除。无论是否有异常被抛出\n\
    \n```\nvoid f(Point p1, Point p2, auto_ptr<Circle> pc, Shape* pb)\n{\n    auto_ptr<Shape>\
