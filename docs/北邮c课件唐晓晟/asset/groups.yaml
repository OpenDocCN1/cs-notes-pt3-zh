    \n# 运行时类型信息\n\n考虑以前设计过的Ival_box类层次结构\n\n一般使用方式是将Ival_box的派生类生成的对象指针传递给一个需要Ival_box类型指针的控制系统进行控制。系统对系统进行控制，程序一\
    \ 些调用后，系统将对象返回给应用程序。但是，用户系统对Ival_box一无所知，这是 显然是必须的，也是正确的。但是，我们确实会遇到将传递给系统而后又被返回我们的对象的类型\n\
