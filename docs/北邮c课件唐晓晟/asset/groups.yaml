    \ `-` `*` `/` `%` `^` `&` |\n| `|` `~` `!` `=` `<` `>` `+=` |\n| `-=` `*=` `/=`\
    \ `%=` `^=` `&=` `|=` |\n| `<<` `>>` `>>=` `<<=` `==` `!=` |\n| `<=` `>=` `&&`\
    \ `||` `++` `--` |\n| `->` `[]` `()` `new` `new[]` `delete` `delete[]` |\n| 以下操作符不能被重载\
    \ |\n| `::` `.` `.*` | 这些操作符的名字不是函数名或第二个参数 |\n| `?:` `sizeof` `typeid` |\n\n##\
    \ 11.2.1 二元和一元运算符\n\n- 二元运算符可以定义为取一个参数的非静态成员函数，也可以定义为取两个参数的非成员函数\n- 对于任何一元运算符\
    \ `@`，`aa@bb` 可以解释为 `aa.operator@(bb)`，或者解释为 `operator@(aa,bb)`，如果两者都有定义，那么按照重载解析来确定究竟应该调用哪个定义\n\
    \n## 二元和一元运算符\n\n- 对于一元运算符，无论它是前缀的还是后缀的，都可以定义为无参的非静态成员函数，或者定义为取一个参数的非成员函数\n- 对任何前缀一元运算符\
    \ `@`，`@aa` 可以解释为 `aa.operator@()` 或者 `operator@(aa)`\n- 对任何后缀一元运算符 `@`，`aa@`\
    \ 可以解释为 `aa.operator@(int)` 或者 `operator@(aa,int)`\n\n## 二元和一元运算符示例\n\n```\nclass\
    \ X {\npublic:\n    void operator+(int);\n    X(int);\n};\n\nvoid operator+(X,\
    \ X);\nvoid operator+(X, double);\n\nvoid f(X a)\n{\n    a+1;       // a.operator+(1)\n\
    \    1+a;       // operator+(1,a)\n    a+1.0;     // operator+(a,1.0)\n}\n\nclass\
    \ X { // 具有各种this指针\n    X* operator+();      // 前缀一元运算符\n    X operator&(); \
