  - "[PAGE 35]\n\n# 7.1.1 函数定义\n\n+   程序中调用的函数必须在某个地方定义(仅一次)，函数定义相当于给出了函数体的函数声明\n\n\
    +   函数的定义和对它的所有声明都必须描述了同样的类型，因为参数名字不是类型的一部分，所以参数名不必保持一致\n\n+   函数可以被定义为inline(内联)的\n\
