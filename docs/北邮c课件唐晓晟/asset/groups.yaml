    struct Link { Link *pre; Link *suc; T val;

    Link(Link *p, Link *s, const T& v) : pre(p), suc(s), val(v) {}

    }; // 链接

    Link *head;

    public:

    List() : head(7) {} // 构造函数

    List(const T& t) : head(new Link(0,0,t)) {} // 构造函数

    void print_all() const {

    for(Link *p=head; p!=0; p=p->suc)

    cout << p->val << "\n";

    }}

