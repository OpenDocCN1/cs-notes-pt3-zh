    \ = 7\n    // m 是类 X 的成员\n}\n```\n\n### 间接\n\n+   从对象指针 `p` 到指针 `p.operator->()`\
    \ 的转换并不依赖于被指向对象的成员 `m`。这也是 `->` 被看作是一元后缀运算符的理由。但是，无论如何这里并没有引入一种新语法形式，所以在 `->`\
    \ 之后仍然要求写一个成员名字。\n\n```\nvoid g(Ptr p)\n{\n  X* q1 = p->;          // 错误语法\n \
    \ X* q2 = p.operator->(); // ok\n}\n```\n\n### 间接\n\n+   间接是一个很重要的概念。\n+   迭代器是这个说法的一个重要佐证。\n\
    +   认识运算符 `->` 的另一种方式是把它看成 C++ 里提供的一种受限的，但也非常有用的委托（delegation）机制。\n+   运算符 `->`\
    \ 必须是成员函数，如果使用，它的返回类型必须是一个指针，或者是一个你可以使用 `->` 运算符的类对象。\n\n### 间接示例\n\n+   重载 `->`\
    \ 的最有用之处就是创建所谓的“灵巧指针”，也就是一种行为像是指针的对象。\n\n```\nclass Rec_ptr {\n  const char* identifier;\n\
    \  Rec* in_core_address;\npublic:\n  Rec_ptr(const char* p) : identifier(p), in_core_address(0)\
    \ {}\n  ~Rec_ptr() { write_to_disk(in_core_address, identifier); }\n  Rec* operator->();\n\
    };\n\nRec* Rec_ptr::operator->() {\n  if(in_core_address == 0)\n    in_core_address\
    \ = read_from_disk(identifier);\n  return in_core_address;\n}\n```\n\n### 间接示例\n\
    \n```\nstruct Rec\n{\n  string name;\n};\n\nvoid update(const char* s)\n{\n  Rec_ptr\
    \ p(s); // 构造得到一个 Rec_ptr\n  p->name = \"Roscoe\";\n  // 使用时，如果需要，第一次将从磁盘读取\n\
    }\n// 正常使用时，Rec_ptr 像整个载体，而 Rec 类型则是在它的参数\n// 此处，类程序可能需要包含诸如读取或写磁盘等\n```\n"
  mdcn: "\n\n## 11.7.1 显式构造函数\n\n按照规则，具有一个参数的构造函数也就定义了一个隐式转换，例如：\n\n```\ncomplex z\
    \ = 2; // 用 complex(2) 初始化\n```\n\n但是有时我们也不希望进行隐式转换，例如，我们可以用一个 `int` 作为大小初始化一个\
    \ `string`，但是，某人或许会写出：\n\n```\nstring s = \"a\"; // 将 s 做成一个包含有 \"a\" 个元素的 string\n\
    ```\n\n通过将构造函数声明为 `explicit`（显式）的方式可以抑制隐式转换。\n\n### 显式构造函数示例\n\n```\nclass String\n\
    {\n  explicit String(int n);\n  String(const char* p);\n};\n\nString s1 = \"a\"\
    ;        // 错误\nString s2(10);          // 可以\nString s3 = String(10); // 可以\n\
    String s4 = \"Brian\";    // 可以\nString s5 = \"flawly\";\n\nvoid f(String);\n\n\
    String g()\n{\n  f(10);          // 错误\n  f(String(10));  // 可以\n  f(\"Arthur\"\
    );    // 可以\n  f(s1);\n\n  String* p1 = new String(\"Eric\");\n  String* p2 =\
    \ new String(10);\n\n  return 10;\n} // 错误\n```\n\n### 显式构造函数示例\n\n```\nclass\
    \ Year\n{\n  int y;\npublic:\n  explicit Year(int y) : y(y) {}\n  operator int()\
    \ const { return y; }\n};\n\nclass Date\n{\npublic:\n  Date(int d, Month m, Year\
    \ y);\n};\n\nDate d3(1978, feb, 21);        // 错误\nDate d4(21, feb, Year(1978));\
    \  // 可以\n```\n\n由于 `operator int()`，根据隐式规则 `Year` 可以转换成为 `int` 类型。将构造函数声明为 `explicit`，就可以禁止\
    \ `int` 到 `Year` 的隐式转换。其它的转换要求在必须的地方进行。\n\n类的构造函数可以用于定义返回该类型对象时的转换方式。\n\n## 11.8\
    \ 下标\n\n+   函数 `operator[]` 可以用于为类的对象定义下标运算的意义。\n+   `operator[]` 的第二个参数（下标）可以具有任何类型，这就使我们可以去定义\
    \ `vector`、关联数组等。\n+   `operator[]()` 必须是成员函数。\n\n### 下标示例\n\n```\nclass Assoc\
    \ {\n    struct Pair {\n        string name;\n        double val;\n        Pair(string\
    \ n = \"\", double v = 0) : name(n), val(v) {}\n    };\n    vector<Pair> vec;\n\
    \    Assoc(const Assoc&);            // 禁止拷贝\n    Assoc& operator=(const Assoc&);\
    \ // 禁止复制\npublic:\n    Assoc();\n    const double& operator[](const string&);\n\
    \    double& operator[](string& s);\n    void print_all() const;\n};\n```\n\n\
    ### 下标示例\n\n```\ndouble& Assoc::operator[](string& s){\n    // 若 s 已存在则返回其对应值\n\
    \    // 否则新建 Pair 项并把值设为 0\n    for(vector<Pair>::const_iterator p = vec.begin();\n\
    \        p != vec.end(); ++p)\n        if(s == p->name) return p->val;\n    vec.push_back(Pair(s,0));\n\
    \    return vec.back().val;\n}\n\nvoid Assoc::print_all() const{\n    for(vector<Pair>::const_iterator\
    \ p = vec.begin();\n        p != vec.end(); ++p)\n        cout << p->name << \"\
    :\" << p->val << \"\\n\";\n}\n```\n\n### 下标示例\n\n```\nint main()\n{\n    // 统计每个单词在输入时出现的次数\n\
    \    string buf;\n    Assoc vec;\n    while(cin >> buf) vec[buf]++;\n    vec.print_all();\n\
    }\n```\n\n## 11.9 函数调用\n\n+   函数调用，记法为 `expression(expression-list)`，也可以解释为一种二元运算符，其中将\
    \ `expression` 作为左运算对象，而 `expression-list` 作为右运算对象，该运算符 `()` 也可以被重载。\n+   运算符\
    \ `()` 最常见、或许也是最重要的一种用途是为对象提供函数调用的语法形式。它可能被重载以提供与函数类似的调用方式，不过它总是把对象作为第一个参数，即函数对象，或简称为函数对象（伪函数对象）。\n\
    +   `operator()` 的另外一种普遍进行的应用是作为子串运算符，以及作为多维数组的下标运算符。\n+   `operator()` 必须作为成员函数。\n\
    \n### 函数调用示例\n\n```\ntemplate<class Iter, class F> F for_each\n    (Iter b, Iter\
    \ e, F f)\n{\n    while(b != e) f(*b++);\n    return f;\n}\n// for_each 是一个模板，它反复地应用第三个参数的\
    \ ()\n\nvoid negate(complex<double>& c) { c = -c; }\n\nvoid f(vector<complex>&\
    \ aa, list<complex>& ll)\n{\n    for_each(aa.begin(), aa.end(), negate);\n   \
    \ for_each(ll.begin(), ll.end(), negate);\n}\n```\n\n### 函数调用示例\n\n```\nvoid add23(complex\
    \ c)\n{\n    c += complex(2,3);\n}\n\nvoid g(vector<complex>& aa, list<complex>&\
    \ ll)\n{\n    for_each(aa.begin(), aa.end(), add23);\n    for_each(ll.begin(),\
    \ ll.end(), add23);\n}\n// 解决向一个向量或者列表中所有元素施加一个固定的值的问题\n```\n\n### 函数调用示例\n\n\
    ```\nclass Add{\n    complex val;\npublic:\n    Add(complex c) { val = c; }\n\
    \    Add(double r, double i) { val = complex(r,i); }\n    void operator()(complex&\
    \ c) const { c += val; }\n};\n\nvoid h(vector<complex>& aa, list<complex>& ll,\
    \ complex z)\n{\n    for_each(aa.begin(), aa.end(), Add(z,3));\n    for_each(ll.begin(),\
    \ ll.end(), Add(z));\n}\n// 解决向一个向量或者列表中所有元素施加一个任意的值的问题\n```\n\n## 11.10 间接（Dereferencing）\n\
    \n间接（键类）运算符 `->` 可以被定义为一个一元的后缀运算符，由括号括起来：\n\n```\nclass Ptr{\n    /**/\n    X*\
    \ operator->();\n};\n\nvoid f(Ptr p)\n{\n    p->m = 7; // (p.operator->())->m\
    \ = 7\n    // m 是类 X 的成员\n}\n```\n\n### 间接\n\n+   从对象指针 `p` 到指针 `p.operator->()`\
    \ 的转换并不依赖于被指向对象的成员 `m`。这也是 `->` 被看作是一元后缀运算符的理由。但是，无论如何这里并没有引入一种新语法形式，所以在 `->`\
    \ 之后仍然要求写一个成员名字。\n\n```\nvoid g(Ptr p)\n{\n  X* q1 = p->;          // 错误语法\n \
    \ X* q2 = p.operator->(); // ok\n}\n```\n\n### 间接\n\n+   间接是一个很重要的概念。\n+   迭代器是这个说法的一个重要佐证。\n\
    +   认识运算符 `->` 的另一种方式是把它看成 C++ 里提供的一种受限的，但也非常有用的委托（delegation）机制。\n+   运算符 `->`\
    \ 必须是成员函数，如果使用，它的返回类型必须是一个指针，或者是一个你可以使用 `->` 运算符的类对象。\n\n### 间接示例\n\n+   重载 `->`\
    \ 的最有用之处就是创建所谓的“灵巧指针”，也就是一种行为像是指针的对象。\n\n```\nclass Rec_ptr {\n  const char* identifier;\n\
    \  Rec* in_core_address;\npublic:\n  Rec_ptr(const char* p) : identifier(p), in_core_address(0)\
    \ {}\n  ~Rec_ptr() { write_to_disk(in_core_address, identifier); }\n  Rec* operator->();\n\
    };\n\nRec* Rec_ptr::operator->() {\n  if(in_core_address == 0)\n    in_core_address\
    \ = read_from_disk(identifier);\n  return in_core_address;\n}\n```\n\n### 间接示例\n\
    \n```\nstruct Rec\n{\n  string name;\n};\n\nvoid update(const char* s)\n{\n  Rec_ptr\
    \ p(s); // 构造得到一个 Rec_ptr\n  p->name = \"Roscoe\";\n  // 使用时，如果需要，第一次将从磁盘读取\n\
    }\n// 正常使用时，Rec_ptr 像整个载体，而 Rec 类型则是在它的参数\n// 此处，类程序可能需要包含诸如读取或写磁盘等\n```\n\n"
