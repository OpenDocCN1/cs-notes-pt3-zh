    # dynamic_cast


    dynamic_cast的专长是处理那些编译器无法确定转换正确性的情况


    dynamic_cast<T*>(p)将查看p指向的对象，如果这个对象属于类T或有唯一的类型为T的基类，则返回指向该对象的类T*的指针；否则就返回0(要求该转换能唯一确定一个对象，否则转换失败，返回0)'
