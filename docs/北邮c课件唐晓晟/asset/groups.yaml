  - "[PAGE 38]\n\n# 编译器的匹配判断原则\n\n+   - 准匹配-无论任何转换或拷贝只要能被平凡转换(赋值到指针、赋值到指针、T到const\
    \ T等)的匹配\n+   - 引用匹配的匹配，即包含整型提升(bool到int、char到int、short到int以及相应的无符号版本)以及从float到double的提升\n\
    +   - 使用标准转换(int到double、double到int、double到long double、Derived*到Base*、T*到void*、int到unsigned\
    \ int)的匹配\n+   - 利用用户定义转换的匹配\n+   - 和在表达式中常用的省略匹配\n+   - 若在匹配的某个步骤上同时发现两个匹配，这个调用将被作为歧义而被拒绝\n\
    \n# 重载函数名示例\n\n```\nvoid print(double);    void print(int);\nvoid print(long);\
    \      void print(const char*);\n                       void print(double);\n\
    \                       void print(long);\n\nvoid f()\n{\n    print(1L);     \
    \     void h(char c, int i, short s, float f)\n    // print(long)        { print(c);\
    \ print(i); // 准确匹配\n    print(1.0);         print(s); // 整型提升; print(int)\n \
    \   // print(double)      print(f); // float到double提升\n    print(t);         \
    \  print('a'); print(49); // 准确匹配\n    print(1);           print('a'); // 准确匹配;\
    \ print(int)\n    // Error:歧义          print(\"a\");\n}                      \
    \ // 准确匹配: print(const char*) }\n```\n\n# 7.4.1 重载和返回类型\n\n重载解析中不考虑返回类型，其理由是，保持对重载的解释只是针对单独的运算符或者函数调用，与调用的环境无关\n\
    \n```\nfloat sqrt(float);\ndouble sqrt(double);\nvoid f(double d, float f)\n{\n\
    \    float fl = sqrt(d); // sqrt(double)\n    double db = sqrt(d); // sqrt(double)\n\
    \    fl = sqrt(f); // sqrt(float)\n    db = sqrt(f); // sqrt(float)\n}\n```\n\n\
