    +   - [1] 定义运算符重载主要是为了模仿对操作数使用方式

    +   - [2] 对于大型运算对象，请使用const引用参数类型

    +   - [3] 对于大型的结果，请考虑优化返回方式

    +   - [4] 如果默认复制操作对一个类很合适，最好是直接用它

