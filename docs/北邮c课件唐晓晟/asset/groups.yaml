    # 头文件中可以包括


    |  | |

    |---|---|

    | 命名空间声明 | namespace N{...}; |

    | 结构定义 | struct Point {int x,y;}; |

    | 模板声明 | template <class T> class Z; |

    | 模板定义 | template <class T> class V{...} |

    | 函数声明 | extern int strlen(const char*); |

    | 数据定义 | const int a; |

    | 静态定义 | const int a = 10; |

    | 名字空间 | class Matrix; |

    | 包含指令 | #include <algorithm> |

    | 条件编译 | #ifdef __cplusplus |

    | 注释 | // check for end of file */ |

    | 宏定义 | #define VERSION 12 |


    # 头文件中绝对不可以包括


    |  | |

    |---|---|

    | 常规的函数定义 | char get(char *p){return *p++;} |

    | 变量定义 | int a; |

    | 聚合量(aggregate)定义 | short tbl[] = {1,2,3}; |

    |  |  |

    | 名字空间声明 | namespace {...} |

    | 特殊的(exported)模板定义 | export template <class T> {T t(...)} |


    # 9.2.2 标准库中的头文件


    +   标准库的功能是通过一组标准头文件给出的

    +   标准库中的头文件不需要后缀，但并不意味着这些头文件采用了某种特殊的存储方式


    +   使用标准库中的头文件需要用#include <...> 而不是#include "..."


    +   相对于每一个C标准库文件<X.h>，存在着一个与之对应的标准C++头文件<cX>，例如#include <stdio.h>和#include <cstdio>'
  - "[PAGE 58]\n\n# 标准库中的头文件示例\n\n```\n#ifndef __cplusplus\n// 如果是 C++ 程序\nnamespace\
    \ std {\n  extern \"C\" {\n  // 见 9.2.4\n#endif\n/* ...... */\nint printf(const\
    \ char* ...);\n#endif __cplusplus\n}\nusing namespace std;\n#endif\n```\n\n左边代码每一块具体的\n\
    实际内部都是相同的，但\n是有相同名字同时需要\n为不同语言，以此把 C++\n能与其它头文件\n<stdio.h> 在起来的样子\n\n# 9.2.3 单一定义规则\n\
    \n在一个程序里，任一个类、枚举和模板等都必须只定义唯一的一次。这种规则需要以一种复杂和精细的方式来描述，被称为“单一定义规则(One-Definition\
    \ Rule, ODR)\n\n+   - 也就是说，一个类、模板或其内联函数 的两个定义能够被接受为同一个唯一定义的实例，当且仅当\n+     - 它们出现在不同的编译单位里\n\
    +     - 它拥有一个相同的对照相同\n+     - 这些条件的意义在两个编译单位中也完全一样\n\n# 单一定义规则(ODR)示例\n\n```\n\
    //file1.h\nstruct S {int a; char b;};\nvoid f(S*);\n\n//file2.c\nstruct S {int\
    \ a; char b;};\nvoid f(S*) { /*...*/ }\n\n// ok\n// 两个不同的文件都声明了两次\n// 重点是\n//\
    \ 堆指针 file2.c 人们不想要得到 S\n// 在不同文件被声明了两次\n// 或者认为可以自由地修改它\n```\n\n```\n//s.h\n\
    struct S {int a; char b;};\nvoid f(S*);\n\n//file1.c\n#include \"s.h\"\n\n//file2.c\n\
    #include \"s.h\"\nvoid f(S* p) { /*...*/ }\n// 基于 ODR 的设计\n```\n\n# 单一定义规则的错误示例\n\
    \n```\n//file1.h\nstruct S {int a; char b;};\n//file1.c\nstruct S {int a; char\
    \ b;};\n// Error 重复定义\n\n//file2.h\nstruct S2 {int a; char b;};\n//file2.c\nclass\
    \ Point { /*...*/ };\n// Error 成员不匹配\n\n//file1.c\ntypedef int X;\nstruct S3 {X\
    \ a; char b;};\n//file2.c\ntypedef def char X;\nstruct S3 {X a; char b;};\n//\
    \ Error X 的含义被改变了\n```\n\n//s.h\nstruct S {int a; char b;};\n//file1.c\n#define\
    \ Point int\n#include \"s.h\"\n//...\n//file2.c\n#include \"s.h\"\nclass Point\
    \ { /*...*/ };\n//...\n// 假如上面是正确的\n// 可能会导致编译器通过\n// #include 包含来同时的含义\n// 导致在不同的编译单位中\n\
    // 比如，在 s.h 中定义 X Point"
  - "[PAGE 59]\n\n# 9.2.4 与非C++代码的连接\n\n+   - 一个C++程序可能由多个部分组成，这些部分不一定都使用C++语言编写\n\
    +   - 不同语言写出的程序片段，或者是同一种语言，但是由不同的编译器编译的片段之间的协作比较困难，为了能让C++使用，可以在extern声明中给出有关其连接约定\n\
    +   - 这种声明能够提醒编译器应该如何去连接这片代码（例如：寄存器使用方式、参数传入的顺序、整数等内部类型的布局）\n\n# 与非C++代码的连接示例(1)\n\
    \nextern \"C\" 提供给其他一种连接约定。非显式声明的函数，例如声明为extern \"C\"时函数仍遵循C++的类规则和参数传递规则，而不是C的规则\n\
    \n```\nextern \"C\" char* strcpy(char*, const char*);\n// 与 extern char* strcpy(char*,\
    \ const char*);\n// 的区别在于这里没有定义\n```\n\n```\nextern \"C\" int f();\n\nextern g()\
    \ { return f(); } // Error f()函数没有参数\n```\n\n```\nextern \"C\" {\n    char* strcpy(char*,\
    \ const char*);\n    int strncmp(const char*, const char*);\n} // 这对符号的连接约定为块\n\
    ```\n\n# 与非C++代码的连接示例(2)\n\n```\nextern \"C\" {\n#include <string.h>\n}\n\n//\
    \ ||extern \"C\"将整个文件包起来来\n// 以使所有文件能被C++使用\n\n#ifdef __cplusplus\nextern \"C\"\
    \ {\n#endif\nchar* strcpy(char*, const char*);\nint strncmp(const char*, const\
    \ char*);\n#ifdef __cplusplus\n}\n#endif\n#endif // __cplusplus是一个预定义名\n```\n\n\
    # 9.2.5 连接与指向函数的指针\n\n+   - 当一个程序中混合使用C和C++代码片段时，有时会希望把在一个语言里定义的函数指针传递到另一个语言中定义的函数里\n\
    +   - 在这种情况下，注意不同语言之间的连接约定是否一致"
