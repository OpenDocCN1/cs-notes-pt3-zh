  - "[PAGE 127]\n\n# 示例\n\n```\nvoid* operator new(size_t size) // 某类new的实现\n{\n \
    \   for(;;){\n        if(void* p = malloc(size)) return p; // 申请内存\n        if(_new_handler\
    \ == 0) throw bad_alloc(); // 无处理器\n        _new_handler(); // 正常情况，如果我们找不到内存\n\
    \    }               // 就会抛出一个异常。否则就先循环\n    // _new_handler()是new无法申请到内存时，系统内定的处理\n\
