    \n## （2）给C++程序员的建议\n\n- C++在不断发展中，应该章引进新的特征，很多以前看来是全新的程序设计技术现在已经变成可行的东西了\n- 不断的学习（作者本人有写这本书的过程中就学到了不少东西）\n\
    \n## 7 忠告\n\n- 编程是在为某个问题的解决方案中的思想建立起一种具体表示\n  - 如果能够把“看成一个独立的概念，将其作为一个类\n  - 如果能够把它看成一个独立的实体，将它当成某类的一个对象\n\
