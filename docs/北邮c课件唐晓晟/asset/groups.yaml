    # 10.5 忠告


    +   - [1] 尽量表示概念

    +   - [2] 对public或private(struct)用在实际场合上仅是数据，却针对其数据成员或其成员存在不变性的说明

    +   - [3] 一个具体类型最好是简单的，如果运用得好，就应该能够用基本类型来代替，而不要采用更复杂的类，也不要采用简单的数据结构

