    \  - 声明\n+   - 忠告\n+   - 练习\n\n# 4.1 类型\n\n+   - C++中，每个名字都有一个与之相关联的类型，类型决定了可以对其进行怎样的操作，并决定这些操作如何解释\n\
    +   - 基本类型有：\n+   - 布尔、字符、整数、浮点、枚举、void、指针、数组、引用、数据结构和类\n+   - 可以分为内置类型和用户自定义类型\n\
    \n# 4.2 布尔量(bool)\n\n+   - 布尔量bool，可以具有两个值false或者true，用于表示逻辑运算的结果。\n+   - 根据定义true\
    \ = 1，false = 0，实际上，非0即true\n+   - bool变量和整数（包括指针）可以相互转换\n\n```\nvoid f(int a,\
    \ int b)\n{\n  bool bl = a == b;\n  // ...\n}\n\nbool b = 7;\n\nint i = true;\n\
    \nvoid g()\n{\n  bool a = true;\n  bool b = true;\n  bool x = a + b;\n  bool y\
    \ = a + b;\n}\n```"
