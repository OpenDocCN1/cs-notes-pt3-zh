    \    // 另一种方法\n    int size;\n}\n```\n\n## 7.3 返回值\n\n- 没有被声明为void的函数都必须返回一个值，void函数不能有返回值\n\
    - 返回值由返回语句(return)描述，一个函数中可以有多个返回语句，返回值语句义和初始化的语句相同\n- 不要返回指向局部变量的指针\n\n### 返回值示例\n\
    \n```\nint f1(){} // Error: 无返回值        double f() { return 1; }\nvoid f2() {}\
    \ // ok                    // 1被隐式转换为double(1)\nint f3() { return 1; } // ok\n\
    int f4() { return 1.2; } // Error    int* fp() { int local = 1;\nint f5() { return;\
