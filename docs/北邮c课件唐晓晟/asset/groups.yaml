    \ jan, 1901);\n```\n\n## 使用Date类示例\n\n```\nvoid f(Date& d)\n{\n    Date lvb_day\
    \ = Date(16, Date::dec, d.year());\n    if(d.day() == 29 && d.month() == Date::feb)\n\
    \    {\n        // ...\n    }\n    if(midnight()) d.add_day(1);\n    cout << \"\
    day after:\" << d << \"\\n\";\n}\n```\n\n变量Date会产生一个不带参数的Date的默认构造函数。完全可以不用单独为Date提供构造函数。Date的默认构造在每个类中，最能使程序简洁易于理解\n\
    \n## 10.3.1 成员函数\n\n```\nDate::Date(int dd, Month mm, int yy)\n{\n    if(yy==0)\
    \ yy=default_date.year();\n    if(mm==default_date.month());\n    if(dd==0) dd=default_date.day();\n\
    \    int max;\n    switch(mm) {\n    case feb:\n        max = 28 + leapyear(yy);\n\
    \        break;\n    case apr: case jun: case sep: case nov:\n        max = 30;\n\
    \        break;\n    default:\n        max = 31;\n    }\n    if(dd<1 || max<dd)\n\
    \        throw Bad_date;\n    y = yy; m = mm; d = dd;\n}\ncase jan: case mar:\
    \ case may:\ncase jul: case aug: case oct:\ncase dec: max = 31;\nbreak;\n// 构造函数实现此代码的目的是\n\
    // 一旦完成，此代码就很少使用\n// 尤其是构造函数和析构函数\n// 对于它们，还需要很大的灵活性\n```\n\n## 10.3.2 协助函数\n\n\
    - 一个类通常与一些与其相关的函数，但它们没有被定义为类成员，放在单独的文件中，它们的使用与Date的使用在同一个文件里（例如.h文件）。此外，我们也可以将这些函数作为协助函数包在一个头文件中。\n\
    - 一般情况下，一个名字空间内的内容比下述Chrono要多的多\n\n```\nnamespace Chrono {\n    class Date { ...\
    \ };\n    int diff(Date a, Date b);\n    bool leapyear(int y);\n    Date next_weekday(Date\
    \ d);\n    Date next_saturday(Date d);\n}\n```\n\n## 10.3.3 重载的运算符\n\n- 增加一些具有习惯形式的函数很有用，比如，使用\
    \ `==` 来判断两个 `Date` 对象是否相等\n\n```cpp\nbool operator==(Date a, Date b)\n{\n   \
    \ return a.day() == b.day() && a.month() == b.month()\n        && a.year() ==\
    \ b.year();\n}\n```\n\n类似的：\n\n```cpp\nbool operator!=(Date, Date);\nbool operator<(Date,\
    \ Date);\nbool operator>(Date, Date);\nDate operator+(Date d, int n);\nDate operator-(Date\
    \ d, int n);\n```\n\n## 10.3.4 具体类型的意义\n\n- 像 `Date` 这样的简单用户定义类型称作具体类型。对于一个记住了抽象类型与实现细节，同时也是为了强调这种类型与内部\
    \ `int` 或者 `char` 等内部类型的相似性。\n- 这种类型有时也被称为值类型\n- 定义良好的一组这种类型（小而有效）能够为应用提供一个基础，提高程序开发效率\n\
    \n## 10.4 对象\n\n- 对象的建立有多种可能，有的对象是局部变量，有的是全局变量，有的是类的成员等。本部分讨论这方面的不同情况。统筹着它们的规则，初始化对象所用的构造函数，以及在它们变得不可用之前清理他们的构造函数\n\
    \n## 10.4.1 构造函数\n\n- 构造函数完成对象的初始化，因此，在类中需要一个函数完成对对象的清理工作，并且该函数能够象构造函数一样被自动调用，这个函数称为析构函数（destructor）\n\
    - 析构函数通常完成一些清理和释放资源的工作，一般情况下，用户不需要显式地调用它\n- 对于没有析构函数的类型，可以简单认为这种类型有一个什么都不做的析构函数\n\
    \n## 析构函数示例\n\n```\nclass Name{ const char* s; };\nclass Table{\nName* p;\nsize_t\
    \ sz;\npublic:\nTable(size_t s = 15) { p = new Name[s=s]; }\n~Table() { delete\
    \ []p; }\nName* lookup(const char*);\nbool insert(Name*);\n};\n```\n\n## 10.4.2\
    \ 默认构造函数\n\n- 可以以为大部分类型都有一个默认构造函数\n- 默认构造函数就是调用时不必提供参数的构造函数。上例中，Table::Table(size_t)就是默认构造函数。\n\
    - 若用户没有声明构造函数，并且有必要，编译器会生成去生成一个\n- 编译器生成的默认构造函数略式地为类类型(class type)的成员和基类调用有关的默认构造函数\n\
    \n## 默认构造函数\n\n```\nstruct Tables{\nint i;\nint v[10];\nTable t1;\nTable v[10];\n\
    };\nTables tt;\n\nstruct X{\nconst int a;\nconst int& r;\n};\nX x; // Error\n\
    ```\n\ntt将利用一个生成或来自默认构造函数的方式初始化。诸如数组为tt.t1以及tt.v[i]每个元素调用Tables(15)。但是它们不会初始化tt.i或tt.v[i]。只有它们的class\
    \ type\n\n由于const引用必须被初始化，包含const成员引用类型的类不能被默认构造。数组、结构或类也可以被显示调用(10.4.10)。再类实例也有默认构造函数\n\
    \n## 10.4.3 构造和析构\n\n- 对象可以有各种不同方式\n- 10.4.4 一个具名的自动对象\n- 10.4.5 一个自由存储对象\n- 10.4.6\
    \ 一个非静态成员对象\n- 10.4.7 一个数组元素\n- 10.4.8 一个局部静态对象\n- 10.4.9 一个全局对象\n- 10.4.10 一个临时对象\n\
    - 10.4.11 一个由用户函数获得在存储器放置的对象\n- 10.4.12 一个union成员\n\n## 10.4.4 局部变量\n\n- 对一个局部变量的构造函数将在控制线程每次通过该变量的声明时执行\n\
    - 该变量所在的块结束时，就会去调用它的析构函数\n- 局部变量的析构函数将按照构造它们的相反顺序执行\n\n```\nvoid f(int i)\n{\n\
    \  Table aa;\n  Table bb;\n  if(i==0) { Table cc; }\n  Table dd;\n}\n```\n\n##\
    \ 10.4.4.1 对象的复制\n\n- 对象复制的默认含义是对对象按成员逐个复制到另外一个中\n- 在例子中，构造函数被调用2次，而析构函数被调用3次\n\
    - 为避免这类情形，可以将Table复制的意义定义清楚（复制构造函数，复制赋值）\n\n```\nvoid h()\n{\n  Table t1;\n  Table\
    \ t2 = t1; // 复制构造函数\n  Table t3;\n  t3 = t2; // 复制赋值\n}\n```\n\n## 对象的复制\n\n\
    ```\nclass Table\n{\n  ...\n  Table(const Table&);\n  Tables operator= (const\
    \ Tables);\n};\nTable::Table(const Table& t)\n{\n  p = new Name[sz=t.sz];\n  for(int\
    \ i=0;i<sz;i++)\n    p[i]=t.p[i];\n}\nTables::operator=(const Table& t)\n{\n \
    \ if(this != &t) { // 防止自赋值\n    delete []p;\n    p = new Name[sz=t.sz];\n   \
    \ for(int i=0;i<sz;i++)\n      p[i]=t.p[i];\n  }\n  return *this;\n}\n// Table\
    \ t1;\n// Table t2 = t1; // 复制构造函数\n// Table t3;\n// t3 = t2; // 复制赋值\n```\n\n\
    ## 10.4.5 自由存储\n\n- 使用new的方式建立对象时，这些对象在自由存储里。该对象将一直存在直到将delete函数用于指向它的指针\n- 有些编程语言可以自动进行内存管理\n\
    \n```\nint main() {\n  Table* p = new Table;\n  Table* q = new Table;\n  delete\
    \ p;\n  delete p; // 行行为不定义\n}\n```\n\n"
