- pgno: 144
  md: '# 1）多边形边框的表示


    +   - 设多边形的总顶点数为 MN，外环顶点数为 M，则内孔顶点数 N=MN-M （N=0 时，即无内孔）

    +   - 定义二维数组 P(2, MN) 存放多边形各顶点的 x、y 坐标。多边形的外环和内孔的顶点分别有序地排列在这个数组中。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_144_0.png)


    图3.12 带孔的平面多边形'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 2）阴影线的数学模型


    +   - 阴影线是一组平行的直线，通常用户指定它与X轴间的夹角α和相邻两阴影线之间的垂直间隔 h。

    +   - 阴影线的数学模型采用：

    +     y=kx+b_j  (k=tgα)

    +   - 截距的计算可以利用递推公式：

    +     b_{j+1}=b_j+Δb

    +     其中Δb=h/|cos α|


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: '+   • 截距初值B₀的确定：

    +   经多边形外环各顶点按斜率tgα引线，求出各引线的截距，设其最大值为B_max，最小值为B_min，则选取截距初值为：

    +   B₀ = B_min

    +   所有填充的阴影线的截距范围是(B_min , B_max)。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_146_0.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# 3) 阴影线与多边形边框的求交运算\n\n+   • 每一条阴影线只与多边形的部分棱边有交点,设某条阴影线的截距为bⱼ,对于某一棱边而言,设它的两个端点分别为P(xₚ,yₚ)和Q(x_q,y_q),从P和Q按阴影线斜率引线,对应的截距为bₚ和b_q,可用以下公式计算：\n\
    \n```\n{\n  bₚ = yₚ - k xₚ\n  b_q = y_q - k x_q\n}\n```\n\n当满足min(bₚ,b_q) <= bⱼ\
    \ < max(bₚ,b_q)时,该阴影线与该棱边有交点。"
  merge: -1
  img_proc: true
- pgno: 148
  md: "+   - 若阴影线与棱边的交点是$(x_l,y_l)$，则\n+   \n+   $$\begin{cases} x_l = \\frac{x_p\
    \ y_q - y_p x_q + b_j (x_q - x_p)}{(y_q - y_p) - k (x_q - x_p)} \\ y_l = k x_l\
    \ + b_j \\end{cases}$$ \n+   - 因为不同的阴影线都需判断与每条棱边是否有交点,以决定相应的阴影线在填充时开始/终止于何处,因而有必要事先计算出所有棱边的两个端点按阴影线斜率引线的对应截距,方便每一次的判断,避免重复计算。\n\
    +   - 鉴于上述原因,定义数组B(2,MN)记录各棱边两端点按阴影线斜率引线产生的截距,并将两者中的较小值放在第一行。"
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 4）交点处理及画阴影线段


    对每一条阴影线作以下处理：


    +   a. 将它与各棱边交点按X或者Y坐标值升序排列；

    +   b. 按顺序，产生奇数点到偶数点之间的线段。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_149_0.png)


    图3.15 交点排序'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 5) 算法步骤


    +   1).对于MN条棱边,计算每一条棱边Lᵢ的两个端点分别按阴影线斜率k=tgα引线得到的截距,其中较小值放在B(1,i)中,较大值放在B(2,i)中。


    +   2).求出Bₘᵢₙ=min B(1,i), Bₘₐₓ=max B(2,i), i=1,2,...,MN


    +   3).取第一条阴影线截距为b=Bₘᵢₙ+Δb, (Δb=h/|cosα|)


    +   4).初始化存放阴影线与各棱边交点的数组D(2,MN); 判断当前阴影线与各棱边是否有交点,若存在则计算出交点坐标并存入D数组; 按X/Y坐标排列D数组中的交点并生成阴影线段;
    取下一条阴影线b=b +Δb,若b≠ Bₘₐₓ转4)继续。'
  merge: -1
  img_proc: true
