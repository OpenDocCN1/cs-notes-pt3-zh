- pgno: 316
  md: "# 6.2.1 Bézier曲线\n\n# 一、Bézier曲线的定义\n\n+   给定空间 $n+1$ 个点的位置矢量 $P_i (i=0,1,...,n)$，则称下面参数曲线为\
    \ $n$ 次 Bézier 曲线：\n+   \n+   $$P(t) = \\sum_{i=0}^{n} P_i J_{i,n}(t),\\ 0 \\\
    le t \\le 1$$\n+   \n+   见图6.1。其中 $J_{i,n}(t)$ 是 Bernstein 基函数：\n+   \n+   $$J_{i,n}(t)\
    \ = C_n^i t^i (1-t)^{n-i},\\ i = 0,1,...,\\ n$$\n+   \n+   $$C_n^i = \\frac{n!}{i!(n-i)!}$$\n\
    +   \n+   $J_{0,n}(t) = (1-t)^n$, $J_{n,n}(t) = t^n$\n\n+   折线 $P_0P_1...P_n$\
    \ 为 $P(t)$ 的控制多边形，$P_0$, $P_1$, ..., $P_n$ 各点为 $P(t)$ 控制顶点。"
  merge: -1
  img_proc: true
- pgno: 317
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_317_0.png)


    图6.1 Bézier曲线'
  merge: -1
  img_proc: true
- pgno: 318
  md: "# 二、Bézier曲线的性质\n\n+   (1) 端点位置\n+   \n+   P₀，Pₙ为P(t)的端点：P(0)=P₀，P(1)=Pₙ\n\
    +   \n+   (2) 端点切线\n+   \n+   P(t)在P₀点与边P₀P₁相切，在Pₙ点与边Pₙ₋₁Pₙ相切：\n+   \n+   P′(0)=n(P₁-P₀)，P′(1)=n(Pₙ-Pₙ₋₁)\n\
    +   \n+   (3) 端点的曲率\n+   \n+   P(t)在P₀、Pₙ两端点曲率分别为：\n\n$$K(0)=\\frac{n-1}{n}\\\
    cdot\\frac{\\left|\\overrightarrow{P_0P_1}\\times\\overrightarrow{P_1P_2}\\right|}{\\\
    left|\\overrightarrow{P_0P_1}\\right|^3}$$\n\n$$K(1)=\\frac{n-1}{n}\\cdot\\frac{\\\
    left|\\overrightarrow{P_{n-2}P_{n-1}}\\times\\overrightarrow{P_{n-1}P_n}\\right|}{\\\
    left|\\overrightarrow{P_{n-1}P_n}\\right|^3}$$"
  merge: -1
  img_proc: true
- pgno: 319
  md: '# （4）凸包性


    Bézier曲线位于其特征多边形构成的凸包之中。


    $J_{i,n}(t)\geq 0,$


    $$\sum_{i=0}^{n}J_{i,n}(t)\equiv 1\qquad(0\leq t\leq 1)$$


    即，$P(t)$为$P_0,P_1,\ldots,P_n$各点的凸线性组合。曲线$P(t)$必在点$P_0,P_1,\ldots,P_n$凸包内（凸多边形）。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_319_0.png)


    图6.2


    # （5）几何不变性


    几何特性不随一定的坐标系变换而变化的性质称几何不变性。Bézier曲线的形状仅与各顶点$P_i$位置有关，与坐标系选择无关。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# （6）交互能力


    改变 $P(t)$ 的形状，只要改变 $P_0、P_1、\cdots、P_n$ 位置，把控制多边形作为输入和人机交互的手段。


    # （7）保凸性


    如果平面上的凸控制多边形能导致所生成的曲线为凸曲线，称这个生成曲线的方法具有保凸性。\nBézier 曲线有保凸性。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_320_0.png)


    图6.3　保凸性'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 6.2.2 Bézier曲面


    # 一、定义


    在空间给定 $(n+1)\times(m+1)$ 个点 $P_{ij}(i=0,1,\ldots,n;\ j=0,1,\ldots,m)$，称下列张量积形式的参数曲面为
    $n\times m$ 次 Bézier 曲面：


    $$P(u,v)=\sum_{i=0}^{n}\sum_{j=0}^{m}P_{ij}J_{i,n}(u)J_{j,m}(v),\quad 0\leq u,v\leq
    1$$


    一般称 $P_{ij}$ 为 $P(u,v)$ 的控制顶点，把由两组多边形


    $$P_{i0}P_{i1}\cdots P_{im}\quad(i=0,1,\ldots,n)$$


    $$P_{0j}P_{1j}\cdots P_{nj}\quad(j=0,1,\ldots,m)$$


    组成的网格称为 $P(u,v)$ 的控制网格，记为 $\{P_{ij}\}$，如图 6.4。'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_322_0.png)


    图6.4 Bézier曲面控制网格'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 二、$P(u,v)$的性质


    （1）端点位置


    $P_{00}=P(0,0),\quad P_{0m}=P(0,1)$


    $P_{n0}=P(1,0),\quad P_{nm}=P(1,1)$


    （2）边界线位置


    $P(u,v)$的4条边界线$P(0,v),\ P(u,0),\ P(1,v),\ P(u,1)$分别是以$P_{00}P_{01}P_{02}\cdots
    P_{0m}$，$P_{00}P_{10}P_{20}\cdots P_{n0}$，$P_{n0}P_{n1}\cdots P_{nm}$，$P_{0m}P_{1m}\cdots
    P_{nm}$为控制多边形的Bézier曲线，见图6.5。'
