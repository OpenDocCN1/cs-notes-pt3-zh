  md: "# 9.5.2 光线跟踪算法\n\n算法描述\n\n```\nbegin\n  for 每个像素e do\n    begin\n      确定通过视点V和像素e的光线R;\n\
    \      ray_tracing(R, I, 1);\n      置e的光亮度为I;\n    end\n  end\n  procedure ray_tracing(R,I,A)\n\
    ```\n\n/*R—跟踪光线,I—跟踪光线光亮度; A—I对总光亮度的贡献系数*/"
  merge: -1
