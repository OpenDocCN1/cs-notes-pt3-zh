- pgno: 341
  md: "# 6.4 Coons曲面\n\n# 一、双三次孔斯曲面(1964)\n\nBezier曲面和B样条曲面的特点是曲面逼近控制网格；Coons曲面特点是插值，它构造满足给定边界条件的曲面。现考虑下面插值问题。\n\
    \n+   - $H(u,v)$是在区域$[0,1;\\ 0,1]$上给定的曲面，现要求作一曲面$P(u,v)$使得\n+   \n+     $P(u,v)=H(u,v),\\\
    quad u=0,1,\\ v=0,1$\n+   \n+     $P'_u(u,v)=H'_u(u,v),\\quad u=0,1,\\ v=0,1$\n\
    +   \n+     $P'_v(u,v)=H'_v(u,v),\\quad u=0,1,\\ v=0,1$\n+   \n+     $P''_{uv}(u,v)=H''_{uv}(u,v),\\\
    quad u=0,1,\\ v=0,1$  (6.1)"
  merge: -1
  img_proc: true
- pgno: 342
  md: '这要求P(u,v)的端点、端点导矢、端点扭矢都要与 H(u,v)相同。


    +   - 解决方法之一是作双三次多项式的插值。取埃尔米特基函数F₀,F₁,G₀,G₁作为混合函数。它们分别为：

    +     F₀(t) = 2t³ − 3t² + 1

    +     F₁(t) = −2t³ + 3t²

    +     G₀(t) = t³ − 2t² + t

    +     G₁(t) = t³ − t²'
  merge: -1
  img_proc: true
- pgno: 343
  md: "现规定行向量[F₀ F₁ G₀ G₁]=[F₀(u) F₁(u) G₀(u) G₁(u)]\n列向量 ⎡F₀⎤   ⎡F₀(v)⎤\n       ⎢F₁⎥\
    \ = ⎢F₁(v)⎥\n       ⎢G₀⎥   ⎢G₀(v)⎥\n       ⎣G₁⎦   ⎣G₁(v)⎦\n则下式定义的双三次曲面P(u,v)满足上述的四方面插值条件，称为双三次孔斯曲面。\n\
    P(u,v)=[F₀ F₁ G₀ G₁] ⎡H(0,0)  H(0,1)  H′ᵥ(0,0)  H′ᵥ(1,0)⎤ ⎡F₀⎤\n             \
    \        ⎢H(1,0)  H(1,1)  H′ᵥ(1,0)  H′ᵥ(1,1)⎥ ⎢F₁⎥\n                     ⎢H′ᵤ(0,0)\
    \ H′ᵤ(0,1) H″ᵤᵥ(0,0) H″ᵤᵥ(0,1)⎥ ⎢G₀⎥\n                     ⎣H′ᵤ(1,0) H′ᵤ(1,1)\
    \ H″ᵤᵥ(1,0) H″ᵤᵥ(1,1)⎦ ⎣G₁⎦  (6.2)"
  merge: -1
  img_proc: true
- pgno: 344
  md: '# 二、孔斯曲面的性质


    # （1）端点位置


    $H(0,0)，H(0,1)，H(1,0)，H(1,1)$ 是曲面 $P(u,v)$ 的端点。


    # （2）边界线


    在 $v=0$ 处曲面的边界线为


    $$P(u,0)=H(0,0)F_0(u)+H(1,0)F_1(u)+H''_u(0,0)G_0(u)$$

    $$\qquad +H''_u(1,0)G_1(u),\ 0\leq u\leq 1$$


    这是式(6.2)中的矩阵的第一列元素为系数的三次埃尔米特曲线。其余的边界线 $P(u,1)$、$P(0,v)$、$P(1,v)$ 分别是以该矩阵中的第2列、第1行和第2行的元素为系数的三次埃尔米特曲线。'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# (3) 跨界导矢


    由式(6.1)可得v=0处的跨界导矢为


    P''ᵥ(u,0) = H''ᵥ(0,0)F₀(u) + H''ᵥ(1,0)F₁(u) + H''''ᵤᵥ(0,0)G₀(u) + H''''ᵤᵥ(1,0)G₁(u),
    0 ≤ u ≤ 1


    这是以式(6.2)中的矩阵的第3列元素为系数的三次埃尔米特曲线。


    其余各条边界的跨界导矢 P''ᵥ(u,1), P''ᵤ(0,v), P''ᵤ(1,v) 分别是以该矩阵中的第4列,第3行和第4行的元素为系数的三次埃尔米特曲线。'
  merge: -1
  img_proc: true
