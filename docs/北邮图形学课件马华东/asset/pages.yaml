- pgno: 272
  md: '# 4.5.2 三维图形的裁剪


    +   - 前面我们介绍了三维投影空间的概念，与设计二维裁剪算法的出发点相同，在三维裁剪算法中，裁剪操作应能迅速地接收完全可见线段、舍弃完全不可见线段，求出三维形体与裁剪窗口的交点，从而得到形体内部分彩见线段。

    +   - 对应于立方体裁剪窗口6个面的方程(规格化)分别为：

    +     - $x=-1；x=1；$

    +     - $y=-1；y=1；$

    +     - $z=-1；z=1$'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - 空间任意一条直线段P₁(x₁,y₁,z₁)和P₂(x₂,y₂,z₂), P₁P₂端点和6个面的关系可转换为6位二进制代码表示:

    +     第1位为1: 点在裁剪窗口的上面,即y>1,否则第1位为0;

    +     第2位为1: 点在裁剪窗口的下面,即y<-1,否则第2位为0;

    +     第3位为1: 点在裁剪窗口的右面,即x>1,否则第3位为0;

    +     第4位为1: 点在裁剪窗口的左面,即x<-1,否则第4位为0;

    +     第5位为1: 点在裁剪窗口的后面,即z>1,否则第5位为0;

    +     第6位为1: 点在裁剪窗口的前面,即z<-1,否则第6位为0。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - 如果一个点在窗口内,则两端点编码都为零。

    +   - 对任意一条三维线段的参数方程为：

    +     $x=x_1+(x_2-x_1)t=x_1+pt$

    +     $y=y_1+(y_2-y_1)t=y_1+qt$

    +     $z=z_1+(z_2-z_1)t=z_1+rt$'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - 如求一条直线与裁剪空间上平面(如y=1)的交点，将y=1代入，得$t=\frac{1-y_1}{g}$，若t不在0到1的闭区间内，则交点在裁剪空间外，否则可求得：

    +     $x=x_1+\frac{1-y_1}{g}$，$z=z_1+\frac{1-y_1}{g}$，这时三维线段与裁剪窗口的有效交点为$(x_1+\frac{1-y_1}{g},z_1+\frac{1-y_1}{g})$；

    +   - 类似可求出其它5个面与直线段的有效交点,连续有效交点可得出落在裁剪窗口内的有效线段。

    +   - 可以很方便得将二维裁剪中的Sutherland-Cohen算法与中点分割算法推广到三维裁剪。'
  merge: -1
  img_proc: true
