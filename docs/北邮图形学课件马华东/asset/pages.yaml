- pgno: 175
  md: '+   - **相对定位方式：** 参照点选择在被填充区域的包围长方形的左下角（x_min，y_min）


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_175_0.png)


    图3.18 填充图案的区域与模式示意


    参照点与模式P的左下角元素（n-1,0）相对应，'
  merge: -1
  img_proc: true
- pgno: 176
  md: '则填充区域内的点(x,y)的像素值可从模式(i,j)处取得：


    ```

    i=(x-x_min) mod n

    j=(n-1)-[(y-y_min) mod n]

    ```


    这种方式,对于几何性较强的图案,即使填充区域移动,填充图案的视觉效果保持不变。


    +   - 绝对定位方式：参照点选择在屏幕坐标原点。


    屏幕坐标原点(0,0)与模式P的左下角元素(n-1,0)相对应,则填充区域内的点(x,y)的像素值可从模式(i,j)处取得：'
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\n{\n  i = x mod n\n  j = (n-1) - (y mod n)\n}\n```\n\n这种方式,对于几何性较强的图案,填充区域移动,视觉效果可能是有差异的;但是如果图案的几何方向性不是很强的话,对视觉效果影响不大.\n\
    \n+   - 这种方式的好处在于提高了计算的效益，而且用相同图案模式填充相邻或重叠区域时不会有接缝出现。"
  merge: -1
  img_proc: true
