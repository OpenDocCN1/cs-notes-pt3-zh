- pgno: 443
  md: '# 9.2 简单光照模型


    # 9.2.1 基本原理


    +   - 光照射到物体上后分解为：反射光、透射光、被物体表面吸收转换成热。

    +     其中反射光和透射光的强弱决定了物体表面的明暗程度。(参见图9.1)

    +   - 不同光源，不同表面材料对光亮度有很大影响。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_443_0.png)'
  merge: -1
  img_proc: true
- pgno: 444
  md: '+   - **简单光照模型(不考虑透射光, 仅有反射光)**

    +     而反射光又分成3个分量, 即：

    +     反射光=环境反射+漫反射+镜面反射


    +   - **环境反射**

    +     物体除了受特定光源照射外, 还受到周围环境来的反射光照射。该分量用Iₚₐ表示, 取常数。


    +   - **漫反射**

    +     表示特定光源在景物表面的反射光中那些向空间各方向均匀反射出去的光。

    +     漫反射可使用朗伯定律计算。'
  merge: -1
  img_proc: true
- pgno: 445
  md: '+   朗伯定律


    对于一个漫反射体，表面的反射光亮度和光源入射角的余弦成正比。


    $I = I_{pd} cos i$


    $I$为表面反射光的光亮度；

    $I_{pd}$为光源垂直入射时反射光的光亮度；

    $i$为光源入射角(入射光角和表面法向夹角)。

    (参见图9.2)


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_445_0.png)'
  merge: -1
