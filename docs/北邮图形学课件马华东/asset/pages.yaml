  md: '# 2.3.3 常见的图形软件系统标准


    +   1) 图形核心系统GKS

    +   (Graphics Kernel System)

    +   2) 计算机图形元文件CGM

    +   (Computer Graphics Metafile)

    +   3) 计算机图形设备接口CGI

    +   (Computer Graphics Interface)

    +   4) 程序员层次结构图形系统PHIGS

    +   (Programmer’s Hierarchical Interactive Graphics System)

    +   5) OPEN GL'
  merge: -1
