- pgno: 32
  md: '# 2.2.1.1 输入设备的逻辑分类


    图形输入设备是将用户的图形数据、命令等转换成电信号传送给计算机。


    可以分成以下6类逻辑输入设备：


    +   - 定位(locator): 指定一个坐标点。对应的物理设备有鼠标器、键盘、数字化仪、触摸屏等。\n- 笔划(stroke): 指示一个坐标点系列,
    如指定一条曲线的控制点等。主要物理设备有数字化仪。\n- 送值(valuator): 输入一个数值。最常用的物理设备是键盘的数字键。'
  merge: -1
  img_proc: true
- pgno: 33
  md: <!-- no content -->
