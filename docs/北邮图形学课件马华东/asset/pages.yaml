  md: "# 6）复合变换\n\n+   - 有些复杂的变换单靠上面所列的某个简单变换是不可能实现的，通常的做法是把多个简单变换联合起来作复合变换，如以任意直线\
    \ $Ax+By+C=0$ 对称。见图4.1(m)\n\n+   - 变换矩阵为：\n+   \n+     $T1=\\begin{bmatrix}1&0&0\\\
