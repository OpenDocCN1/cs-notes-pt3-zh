- pgno: 283
  md: '+   - 对话框也可提供选择功能。建立对话框的工具也可从各种软件的应用程序界面工具中找到。

    +   - 在编辑已绘制的图形时，选择已绘制的子图或图元便十分重要。一般可对每一个子图预先求一个边界盒或比边界盒稍大一点的ε边界盒(参见图5.2)。

    +   - 所谓边界盒是边和坐标轴平行且包含该子图的最小的矩形。在选择时用户指定一个选择点。若这点仅在某一个子图的ε边界盒内，则这子图便被选中。若有几个子图的ε边界盒被选中，最短距离那一个子图便是被选中的。'
