- pgno: 486
  md: '+   • 求新表面P法向量N''

    +     N''可通过两个偏导数求叉积求得： N''=P_u''×P_v''

    +     这里： P_u''=dP''/du=d(P+FN)/du=P_u+F_u N+F N_u

    +           P_v''=dP''/dv=d(P+FN)/dv=P_v+F_v N+F N_v


    +   • 由于粗糙表面凹凸高度相对于表面尺寸一般小得多，故F相对于式中其它量很小，可忽略不计。

    +     P_u''≈P_u+F_u N, P_v''≈P_v+F_v N

    +     所以新表面法向量近似为：

    +     N''≈(P_u+F_u N)×(P_v+F_v N)

    +     =P_u×P_v+F_u(N×P_v)+F_v(P_u×N)+F_u F_v(N×N)

    +     =N+D'
  merge: -1
  img_proc: true
- pgno: 487
  md: '其中，$D=F_u(N\times P_v)+F_v(P_u\times N)$为扰动向量。$D$是$P$的切平面上的一个向量，它与$N$之间改变了原曲面法向量，即产生扰动。


    $N$单位化后用于明暗度计算，产生纹理效果。


    +   - 几何(凹包)纹理函数


    其定义方法与颜色纹理函数定义方法相同。几何(凹包)纹理由函数$P$和凹包位移函数定义。'
  merge: -1
  img_proc: true
