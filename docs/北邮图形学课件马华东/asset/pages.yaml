- pgno: 362
  md: '+   - 拓扑一致性用欧拉公式表示：

    +     v−e+f−r=2(s−h)

    +     v,e,f表示物体顶点,棱边,表面数； r,s,h分别表示物体表面边界的内环数,不相连的物体个数以及物体上通孔数目。

    +     例图:v=16, e=24, f=10, r=2, s=1, h=1

    +   - 如将v, e, f, r, h, s分别看作独立的变量,则上式定义了高维空间中的一张平面,该平面通过原点。

    +     由于上述变量均是大于或等于0的整数,故任一实际的三维物体只对应此高维平面上的网格点。

    +   - 造型的过程就是从原点(null object)开始一步一步地走到给定的位置,构造所需的立体。只需选定5种位移作为基本走法,就可以多达高维平面上的任一网格点。


