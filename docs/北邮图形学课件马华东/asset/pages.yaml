- pgno: 454
  md: '# 9.3.2 解决方法


    # 一、 Gouraud明暗处理技术(Gouraud Shading)


    +   - 思想：对离散的光亮度采样作双线性插值以获取连续的光亮度函数。


    +   - 过程：

    +   a.计算出多边形顶点处的光亮度值，作为插值采样点；

    +   b.对多边形顶点的光亮度插值计算出多边形内任一点的光亮度。'
  merge: -1
  img_proc: true
- pgno: 455
  md: '+   如图9.6, 设三角形面3个顶点处光亮度为I₁, I₂, I₃, 为计算P点光亮度Iₚ

    +   Iₐ = uI₁ + (1-u)I₂    (u = av₂ / v₁v₂)

    +   Iᵦ = vI₁ + (1-v)I₃    (v = bv₃ / v₁v₃)

    +   Iₚ = tIₐ + (1-t)Iᵦ    (t = Pb/ab)

    +   同时, 相邻两点P₁, P₂可用增量法计算光亮度:

    +   Iₚ₂ = Iₚ₁ + ΔI


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_455_0.png)


    +   优缺点

    +   效果尚好, 计算量小;

    +   不能正确模拟高光, 会产生Mach带效应(光亮度变化率不连续的边界处呈现亮带或黑带)。'
  merge: -1
  img_proc: true
- pgno: 456
  md: 图9.6 光亮度插值及其顶点法向量计算
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 二、Phong明暗处理技术(Phong Shading)


    +   - 思想: 对离散的法向量采样作双线性插值，构造一个连续的法向量函数，将这个连续的法向量插值函数代入光亮度计算公式，即得到一个非线性的光亮度插值公式。

    +     如图9.7所示, 任一点P处法向按插值方法由各顶点处法向推出。

    +   - 优点: 大大减少了马赫带效应；

    +     产生真实的高光效果。

    +   - 缺点: 由于对每一像素光亮度计算还需使用光照模型, 故计算量大。'
  merge: -1
  img_proc: true
