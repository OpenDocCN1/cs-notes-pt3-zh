- pgno: 459
  md: '# 9.4 整体光照模型


    +   - Phong模型仅考虑光源直接照射在景物表面产生的反射光能，因而是一种局部光照模型。

    +   - 局部光照模型忽略了光能在环境景物之间的传递，很难生成高质量真实感图形。

    +     原因：未能考虑环境的漫射、镜面反射和规则透射对景物表面产生的整体照明效果。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_459_0.png)


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_459_1.png)'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# 9.4 整体光照模型


    +   - **整体光照模型**


    Whitted在Phong模型中增加了环境镜面反射光亮度 $I_s$ 和环境规则透射光亮度 $I_t$，从而模拟周围环境的光透射在景物表面上产生的理想镜面反射和规则透射现象。'
  merge: -1
  img_proc: true
- pgno: 461
  md: "+   - **Whitted模型**\n+     如图9.8，假设景物表面向空间某方向V辐射的光亮度由3部分组成：\n+     1. 由光源直接照射引起的反射光亮度\
    \ $I_c$；\n+     2. 由V的镜面反射方向来的环境光 $I_s$ 投射在光滑表面上产生的镜面反射光；\n+     3. 由V的规则透射方向来的环境光\
    \ $I_t$ 通过透射在透明体表面上产生的规则透射光。\n\n+   - **Whitted模型表示公式**\n+   \n+     $$I=I_c+k_sI_s+k_tI_t$$\n\
    +   \n+     $k_s$：反射系数，$0\\leq k_s\\leq1$；$k_t$：透射系数，$0\\leq k_t\\leq1$。\n+  \
    \ \n+     $I_c$可用Phong模型计算，而$I_s$和$I_t$可转化为其它物体表面朝P点方向辐射的光亮度，仍利用Whitted模型计算。因此Whitted模型是**递归计算模型**。"
  merge: -1
  img_proc: true
- pgno: 462
  md: 图9.8 Whitted模型示意图
  merge: -1
  img_proc: true
- pgno: 463
  md: "# 9.5 光线跟踪技术(Ray Tracing)\n\n# 9.5.1 基本原理\n\n+   - 光线跟踪技术是为了求解Whitted模型而提出一种高度真实感图形绘制技术。\n\
    +   - 光线投射(ray casting)\n+   \n+     假设从视点V通过屏幕像素e向场景投射一光线交场景中的景物于P₁,P₂...Pₘ点，那么离视点最近的P₁点就是画面在像素e处的可见点，像素e的光亮度应由P₁点向\
    \ **p₁v** 方向辐射的光亮度决定的。这样，对屏幕上每一像素都投射光线以求得与场景的第一个交点，并置像素的光亮度为交点处的光亮度。（如图9.9）"
  merge: -1
  img_proc: true
- pgno: 464
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_464_0.png)


    # 图9.9 光线投射过程'
  merge: -1
  img_proc: true
- pgno: 465
  md: "+   - 光线投射方法评价\n+     - 优点：不必单独消隐，算法简单；\n+     - 局限性：仅实现局部光照效果。\n\n+   - 光线跟踪技术原理\n\
    +   \n+     Whitted在求解其整体光照模型时将光线投射发展改进为光线跟踪技术。根据Whitted模型：\n+   \n+     $$I=I_c+k_sI_s+k_tI_t$$\n\
    +   \n+     光线跟踪示意图如图9.10。\n\n+   - 光线跟踪求解任一像素点e亮度I过程如下：\n+   \n+     （1）先从视点V出发，通过像素e发射一根光线求得它与场景的最近交点P₁，容易算出P₁点的局部光照亮度I_c（使用Phong模型）"
  merge: -1
