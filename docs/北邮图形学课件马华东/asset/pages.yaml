- pgno: 328
  md: '+   - 常称$T$为节点向量，$t_i$为节点，如果$t_{j-1}<t_j=t_{j+1}=\cdots=t_{j+l-1}<t_{j+l}$，则称上式中除$t_{j-1}$和$t_{j+l}$以外的每一节点为$T$的$l$重节点。

    +   - 由$B_{i,k}(t)$的定义，它具有以下性质：


    (1) 局部性


    $$B_{i,k}(t)=\begin{cases}>0, & t_i<t<t_{i+k} \quad\text{（此区间为正）}\\=0, & t\le
    t_i\text{或}t\ge t_{i+k}\quad\text{（其它为0）}\end{cases}$$'
  merge: -1
  img_proc: true
- pgno: 329
  md: <!-- no content -->
