- pgno: 6
  md: '# 1.1.1 什么是计算机图形学


    +   - 国际标准化组织ISO在其数据处理字典中对计算机图形学有这样的定义：

    +     计算机图形学(Computer Graphics)是研究通过计算机将数据转换为图形,并且在专用的显示设备上显示的原理、方法和技术的学科。


    +   - 简言之：

    +     计算机图形学是研究如何用计算机表示、生成、处理和显示图形的一门学科。'
  merge: -1
  img_proc: true
