    \ 确定P₁的镜面反射光线R_r;\n            ray_tracing(R_r, I_s, k_sA);\n            若P₁所在表面为透明面,\
    \ 确定P₁的规则透射光线R_t;\n            ray_tracing(R_t, I_t, k_tA);\n            I = I_c\
