- pgno: 100
  md: '# 2) 算法原理


    +   - 考虑圆心坐标在坐标系原点,位于第一象限的八分之一圆弧 P₁P₂,如图3.4所示。其他部分可用7个对称点绘出。

    +   - 方程

    +     x²+y²=R²


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_100_0.png)


    图3.4 第1象限的八分之一圆弧'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   - 此算法在每一步都选择一个离开理想圆周最近的点 $P_i(x_i,y_i)$，使其误差项

    +     $$|D(P_i)|=|x_i^2+y_i^2-R^2|$$

    +     在每一步都是极小值。


    +   - 设 $P_{i-1}(x_{i-1},y_{i-1})$ 已被选定为最靠近圆弧的点，下一步 $x=x_{i-1}+1$ 时，参见图3.5，要决定
    T 还是 S 更接近理想的圆弧，令

    +     $$D(S)=(x_{i-1}+1)^2+y_{i-1}^2-R^2$$

    +     $$D(T)=(x_{i-1}+1)^2+(y_{i-1}-1)^2-R^2$$'
  merge: -1
  img_proc: true
- pgno: 102
  md: "+   - 显然, |D(S)|>=|D(T)|时, 应该取T点; 反之则取S点。即若令\n+   \n+   $d_i = |D(S)| - |D(T)|$\n\
    +   \n+   则$d_i >=0$, 选择T点, 否则选取S点。\n\n![](img/c00b4e8ccb17d37f1489c44f2791c008_102_0.png)"
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - 改用dᵢ=D(S)+D(T)作为判别条件

    +     dᵢ=D(S)+D(T)= 2(xᵢ₋₁+1)² + yᵢ₋₁² + (yᵢ₋₁-1)² -2R²

    +     dᵢ(R) 是递减函数。(dᵢ=0是到S和T近似相等的圆C)

    +     dᵢ >=0, 弧AB在圆C的下方, 选择T点; 否则选取S点。

    +   - 推导一个递推公式, 简化dᵢ的计算

    +     x₀=0; y₀=R; x₁ = x₀ +1;

    +     d₁=D(S)+D(T)=(1²+ y₀² -R²)+(1²+(y₀ -1)² - R²)

    +     =3 - 2 y₀= 3 - 2R;

    +     dᵢ = (xᵢ² + yᵢ₋₁² - R²)+(xᵢ² + (yᵢ₋₁-1)² - R²)

    +     =2xᵢ²+2yᵢ₋₁² -2yᵢ₋₁- 2R²+1

    +     dᵢ₊₁= (xᵢ+1)² + yᵢ² -R² + (xᵢ+1)² + (yᵢ -1)² - R²

    +     =2xᵢ²+4xᵢ+2yᵢ² -2yᵢ -2R² +3'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - 结论：

    +     d₁ = 3 - 2R;

    +     如果 dᵢ < 0, 选 Pᵢ(xᵢ, yᵢ₋₁), 将 yᵢ = yᵢ₋₁ 代入求 dᵢ₊₁:

    +       dᵢ₊₁ = dᵢ + 4xᵢ + 2 = dᵢ + 4xᵢ₋₁ + 6

    +     如果 dᵢ >= 0, 选 Pᵢ(xᵢ, yᵢ₋₁ - 1), 将 yᵢ = yᵢ₋₁ - 1 代入求 dᵢ₊₁:

    +       dᵢ₊₁ = dᵢ + 4xᵢ - 4yᵢ₋₁ + 6 = dᵢ + 4(xᵢ₋₁ - yᵢ₋₁) + 10'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   - 推广。利用圆周对坐标原点(圆心)及坐标轴的对称性，就可以将45°圆弧扩展到整个圆周。如图3.6，如果点(x,y)在圆周上，则与之对称的另外7个点也在圆周上，它们的坐标如图所示。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_105_0.png)


    图3.6 圆周上的8个对称点'
  merge: -1
  img_proc: true
