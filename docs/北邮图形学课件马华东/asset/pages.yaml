- pgno: 13
  md: '# 4) 矢量表示与位图表示比较


    # 位图


    +   - 可以表示任何图形

    +     真实感效果好

    +   - 应用方面的制约：

    +     较强的处理和存储能力；

    +     像素之间无内在联系；

    +     分辨率固定;

    +   - 实例：

    +     三维场景表示是位图图形


    # 矢量


    +   - 画面简洁

    +     速度快

    +   - 对许多应用而言：

    +     比位图更高效、更灵活；

    +     表示方法有局限;

    +   - 实例：

    +     字符表示是矢量图形'
  merge: -1
  img_proc: true
