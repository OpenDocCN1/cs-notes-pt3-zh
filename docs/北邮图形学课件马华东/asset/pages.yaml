- pgno: 8
  md: '# 1）什么是图形


    图形是从客观世界的物体中抽象出来的带有灰度或者色彩以及形状的图或形。


    # 2）图形与图象


    图象指计算机内以位图(bitmap)形式存在的灰度信息,强调视觉表现;而图形含有几何属性,更强调场景的几何表示,由场景的几何模型和景物的物理属性组成.（见图例）'
  merge: -1
  img_proc: true
