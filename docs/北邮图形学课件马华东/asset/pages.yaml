- pgno: 182
  md: '# 4.1.1 齐次坐标


    +   - 用*n*+1维向量表示*n*维点坐标的方法称为齐次坐标表示法。

    +   - 例如,平面上一点(*x*,*y*)可以用齐次坐标(*h*x*, *h*y*, *h*) (*h*≠0)来表示。

    +   - 齐次坐标不是唯一的, *h*可以为任意不为0的比例系数。但若用*h*去除齐次坐标各分量,即得到(*x*,*y*,1),这却是唯一的。

    +   - 通常把*h*=1的齐次坐标称为规格化齐次坐标,而把使*h*=1的变换方法称为齐次坐标规格化。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   - 采用齐次坐标，即是将$n$维空间的几何问题转换到$n+1$维空间中去解决。从而找到一种统一的方法来处理各种图形的简单变换。


    +   - 采用齐次坐标，还能十分完美地表示$n$维空间的无穷远点。$(x_1, x_2, x_3, \ldots, x_n, 0)$即表示$n$维空间中的无穷远点。'
  merge: -1
  img_proc: true
- pgno: 184
  md: "# 4.1.2 变换矩阵\n\n+   设二维平面上有一点(x,y)，经图形变换后成为另一点(x',y')，则可用向量(x,y)乘上\n+   \n\
    +   一个变换矩阵 $\\begin{bmatrix} a & d \\\\ b & e \\end{bmatrix}$ 得：\n+   \n+   $[x'\\\
    \ y'] = [x\\ y] \\begin{bmatrix} a & d \\\\ b & e \\end{bmatrix} = [ax+by\\ dx+ey]$"
  merge: -1
  img_proc: true
- pgno: 185
  md: '若用齐次坐标表示，则有


    \[

    [x''\ y''\ u]=[x\ y\ 1]

    \begin{bmatrix}

    a & d & g\\

    b & e & h\\

    c & f & i

    \end{bmatrix}

    \]


    \[

    =[ax+by+c\quad dx+ey+f\quad gx+hy+i]

    \]


    我们称


    \[

    \begin{bmatrix}

    a & d & g\\

    b & e & h\\

    c & f & i

    \end{bmatrix}

    \]


    为二维变换矩阵，它可以分为4个子矩阵：其中


    \[

    \begin{bmatrix}

    a & d\\

    b & e

    \end{bmatrix}

    \]


    对图形进行比例、旋转、对称、错切等变换；\([c\ f]\) 对图形进行平移变换；


    \[

    \begin{bmatrix}

    g\\h

    \end{bmatrix}

    \]


    对图形作投影变换；\([i]\) 对整体图形作比例变换。'
  merge: -1
  img_proc: true
