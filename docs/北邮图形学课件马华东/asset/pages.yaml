    \   \\begin{cases}\n+     \\cos i=(\\vec{L}_0\\cdot\\vec{N}_0)\\\\\n+     \\cos\\\
    theta=\\vec{R}_0\\cdot\\vec{V}_0\\approx(\\vec{N}_0\\cdot\\vec{H}_0)\n+     \\\
    end{cases}\n+     $$\n+   \n+     其中 $\\vec{L}_0,\\vec{N}_0,\\vec{R}_0,\\vec{V}_0$\
    \ 是 $L,N,R,V$ 相应的单位向量，$\\vec{H}_0$ 为光和 $V$ 的角平分线的单位向量。\n\n+   - 使用 Phong 模型的扫描线绘制算法\n\
    \n![](img/c00b4e8ccb17d37f1489c44f2791c008_449_0.png)"
