  md: '# 2. 正轴测投影变换


    +   - 投影面与坐标轴之间有夹角。设投影面与三个轴交于A,B,C，投影方向与投影面垂直。

    +   - 首先把物体及投影面绕Y轴顺时针旋转φ（varphi），再绕X轴逆时针旋θ，使投影方向与Z轴重合，如图4.4所示，变换矩阵如下：


    ```

    $$T=\begin{bmatrix}\cos\varphi&0&\sin\varphi&0\\0&1&0&0\\-\sin\varphi&0&\cos\varphi&0\\0&0&0&1\end{bmatrix}\begin{bmatrix}1&0&0&0\\0&\cos\theta&\sin\theta&0\\0&-\sin\theta&\cos\theta&0\\0&0&0&1\end{bmatrix}$$

    ```'
  merge: -1
  img_proc: true
- pgno: 226
  md: '$$=\begin{vmatrix}\cos\varphi&-\sin\varphi\sin\theta&\sin\varphi\cos\theta&0\\0&\cos\theta&\sin\theta&0\\-\sin\varphi&-\cos\varphi\sin\theta&\cos\varphi\cos\theta&0\\0&0&0&1\end{vmatrix}$$


    +   - 最后做Z方向的正投影，得到变换


    $$T=\begin{vmatrix}\cos\varphi&-\sin\varphi\sin\theta&0&0\\0&\cos\theta&0&0\\-\sin\varphi&-\cos\varphi\sin\theta&0&0\\0&0&0&1\end{vmatrix}$$'
