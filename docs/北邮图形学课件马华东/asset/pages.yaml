- pgno: 431
  md: "# 扫描线Z-buffer算法（）\n\n```\n```text\n{\n  建立多边形表；对每一个多边形根据顶点最小的值，将多边形置入多边形表。\n\
    \  活化多边形表APT，活化边对表AET初始化为空。\n  for (每条扫描线i, i从小到大)\n  {\n    1. 帧缓存CB置为背景色。\n\
    \    2. 深度缓存ZB(一维数组)置为负无穷大。\n    3. 将对应扫描线i的，多边形表中的多边形加入到活化多边形表APT中。\n    4. 对新加入的多边形，生成其相应的边表。\n\
    \    5. 对APT中每一个多边形，若其边表中对应扫描线i增加了新的边，将新边配对，\n       加到活化边对表AET中。\n    6. 对AET中的每一对边：\n\
    \       6.1 对x_l<j<x_r的每一个像素，按增量公式z=z_l+Δz_x计算各点深度depth。\n       6.2 与ZB对应量比较，depth>ZB(j)，则ZB(j)=depth，并计算颜色值，写帧缓存。\n\
    \    7. 删除APT中多边形顶点最大y坐标为j的多边形，并删除相应的边。\n    8. 对AET中的每一个边对，作如下处理：\n       8.1\
    \ 删除y_lmax或y_rmax已经等于i的边。\n       8.2 用增量公式计算新的x_l、x_r和z_l。x_l=x_l+Δx_l x_r=x_r+Δx_r\
    \ z_l=z_l+Δz_xΔz_y\n  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 432
  md: '# 8.6 区间扫描线算法


    +   - 与深度缓存算法相比，扫描线算法做了两点改进：

    +     - 将整个绘图窗口内的消隐问题分解到一条条扫描线上解决，使所需的Z缓冲器大大减少；

    +     - 计算深度值时，利用了面连贯性，只用了一个加法。

    +   - 问题

    +     - 在每个像素处都计算深度值，进行深度比较。

    +     - 被多个多边形覆盖的像素区处需进行多次计算，计算量仍很大。

    +   - 区间扫描线算法

    +     - 在一条扫描线上每个区间只计算一次深度值，不需要Z缓冲器。

    +     - 把当前扫描线与各多边形在投影平面的投影的交点进行排序后，将扫描线分成若干个子区间。

    +     - 在区间任一点处找出在该处z值最大的一个面，这个区间上的每一个像素就用这个面的颜色来显示。

    +     - 优点：将逐点(像素)计算改为逐段计算，效率大大提高。'
  merge: -1
  img_proc: true
- pgno: 433
  md: '+   - 如何确定小区间的颜色可分为三种情况：

    +     - 小区间上没有任何多边形，该小区间用背景色显示。

    +     - 小区间上只有一个多边形，用对应的多边形在该处的颜色显示。

    +     - 小区间上存在两个或两个以上的多边形，必须通过深度测试判断哪个多边形可见。


