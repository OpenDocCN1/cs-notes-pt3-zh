    P(t)的形状和位置与坐标系的选择无关。


    # (5) 保凸性


    B样条曲线和Bézier曲线一样,也具有保凸性,即当P₁P₂...Pₙ形成一个平面凸的闭多边形时, P(t)是一平面凸曲线,参见图6.8。'
