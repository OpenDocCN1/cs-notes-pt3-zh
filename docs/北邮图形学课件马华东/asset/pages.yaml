- pgno: 511
  md: '# 10.3.2 绘制OpenGL的基本几何元素


    +   - OpenGL几何要素有点、线、多边形。光滑曲线、曲面都是一系列线段、多边形近似得到的。OpenGL不直接提供绘制曲线、曲面的命令。


    +   - 描述几何要素就是按一定顺序给出几何要素的顶点。glVertex()命令指定一个顶点，并在生成顶点后，把当前颜色、纹理坐标、法线等值赋给这个顶点。该函数只能在glBegin()与glEnd()之间调用才有意义，它们分别标志几何要素定义的开始和结束。'
  merge: -1
  img_proc: true
- pgno: 512
  md: '# ■ 绘制多边形


