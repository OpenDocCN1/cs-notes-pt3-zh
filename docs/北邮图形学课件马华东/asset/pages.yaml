- pgno: 447
  md: '+   - 镜面反射


    对某些材质的物体,在光照射下出现“高光现象”。镜面反射的计算一般遵守反射定律。实际上，光滑表面镜面反射光分布于表面镜面反射方向的周围：


    $I=I_{ps}\cos^n\theta$


    $I_{ps}$——镜面反射方向上镜面反射光亮度；

    $\theta$——镜面反射方向和视线方向的夹角；

    $n$——会聚指数。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_447_0.png)'
  merge: -1
  img_proc: true
- pgno: 448
  md: '+   • Phong模型

    +   考虑反射光3个分量所建立的光照模型，表示为：

    +   $I = k_a I_{pa} + \Sigma[k_d I_{pd} cos i + k_s I_{ps} cos^n \theta]$

    +   $k_a, k_d, k_s$ 分别为环境反射、漫反射和镜面反射分量系数，即材质系数($k_d + k_s =1$), $\Sigma$ 表示对所有光源求和。


    +   • 计算机实现时, 用R、G、B三分量计算, 表示为：

    +   $\begin{bmatrix} r \\ g \\ b \end{bmatrix} = k_a \begin{bmatrix} r_{pa} \\
    g_{pa} \\ b_{pa} \end{bmatrix} + \sum k_d \begin{bmatrix} r_{pd} \\ g_{pd} \\
    b_{pd} \end{bmatrix} cos i + k_s \begin{bmatrix} r_{ps} \\ g_{ps} \\ b_{ps} \end{bmatrix}
    cos^n \theta$'
  merge: -1
  img_proc: true
- pgno: 449
