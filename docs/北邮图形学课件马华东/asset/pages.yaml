- pgno: 412
  md: '# 遮挡判断


    +   - 可把窗口4个顶点坐标的x,y值代入那个包围窗口的多边形的平面方程，求出对应4个顶点处该平面的z坐标值，这4个z坐标的最小值记为z_min。

    +   - 对序列中第i个多边形，求各顶点z坐标值的最大值z_max,i，若z_min ≥ z_max,i，则第i个多边形被遮挡,如图8.5中多边形CD被多边形AB所遮挡。

    +   - 其它情况,如图8.5中多边形EF，可在窗口内多边形EF上任找一点G(x_G, y_G, z_G)，把x_G,y_G代入多边形AB所在的平面方程，求出H点处的坐标z值z_H，若z_H
    > z_G，则AB在窗口内遮挡了EF。'
  merge: -1
  img_proc: true
