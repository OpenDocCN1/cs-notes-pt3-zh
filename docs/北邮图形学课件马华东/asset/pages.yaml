- pgno: 510
  md: '在绘制完图形时，需要使用两个函数来结束绘图并返回：

    - void glFlush() 强制OpenGL命令序列在有限的时间内完成执行；

    - void glFinish() 使完成前面发出的全部OpenGL命令的执行，即等到完全实现全部命令的结束后再返回。'
  merge: -1
