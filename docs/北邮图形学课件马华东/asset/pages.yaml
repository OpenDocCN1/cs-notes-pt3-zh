- pgno: 392
  md: '+   - 消隐的对象是三维物体,三维物体在计算机中可用其表面上的平面多边形表示,形成三维物体的体面边点四表结构。

    +   - 根据消隐对象的不同,消隐算法分为两类：

    +     若消除的是物体上不可见的线段,称为线消隐。

    +     若消除的是物体上不可见的面,称为面消隐。

    +   - 消隐不仅与消隐对象有关,还与观察物体的方式,即投影方式有关.随着观察点、观察方向或投影面的改变,物体上某些可见的部分将会变成不可见,某些不可见的部分又会变成可见。'
  merge: -1
  img_proc: true
- pgno: 393
  md: '+   - 消隐是在规格化投影空间或屏幕坐标空间中进行的(一般投影平面指OXY，视点在Z轴的正无穷大处，视线方向为负Z轴)。


    +   - 根据消隐空间的不同,消隐算法又可分为3类：

    +     - 物体空间的消隐算法(光线投射)

    +     物体空间是指物体所在的空间，即规范化投影空间。(逐面比较，决定每个面棱之间的遮挡关系)

    +     - 图象空间的消隐算法(区域子分、深度缓存、扫描线)

    +     图象空间是相对于物体空间而言的，在消隐算法中，图象空间就是屏幕坐标空间。(逐像素判断,决定哪个多边形在该像素可见)

    +     - 物体空间和图象空间的消隐算法(画家算法)

    +     在物体空间中预先计算面的可见性优先级，再在图像空间中生成消隐图。'
  merge: -1
  img_proc: true
- pgno: 394
  md: '+   - 消隐算法种类繁多，但必然都涉及排序和相关性两个基本原则：

    +     - 排序是为了确定消隐对象之间的遮挡关系。大多数消隐算法都是先在 Z 方向排序，确定体、面、边、点相对于观察点的距离，然后再在 X 方向和 Y
    方向进一步排序，以确定这种遮挡关系。

    +     - 所谓相关性，是指所考察的物体或视图区内的图像局部保持不变的一种性质。相关性利用得越充分、越巧妙，消隐算法的效率也就越高。'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# 8.2 画家算法


    # 算法思想：


    类似油画作家作画的过程，先画远景，再画中景，最后画近景。


    # 算法原理：


    +   - 先把屏幕置成背景色；

    +   - 再把物体的各个面按其离视点的远近进行排序，排序结果存在一张深度优先级表中；

    +   - 然后按照从远到近的顺序逐个绘制各个面，后显示的图形取代先显示的画面，相当于消除隐藏面。'
  merge: -1
  img_proc: true
- pgno: 396
  md: '+   - **算法关键**

    +     - 如何对场景中的物体按深度排序。


    +   - **深度重叠测试**

    +     - 先根据每个多边形顶点 z 坐标的极小值 z<sub>min</sub> 的大小把多边形作初步排序；

    +     - 设 z<sub>min</sub> 最小的多边形为 P，序列中其他多边形记为 Q。显然，z<sub>min</sub>(P) &lt; z<sub>min</sub>(Q)，若
    z<sub>max</sub>(P) &lt; z<sub>min</sub>(Q)，则 P 肯定不能遮挡 Q。

    +     - 若 z<sub>max</sub>(P) &gt; z<sub>min</sub>(Q)，则需进一步做投影重叠判断。'
  merge: -1
  img_proc: true
- pgno: 397
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 398
  md: P不遮挡Q的各种情况(a, b, c, d, e) 及互相遮挡(f) (Http://cg.cs.tsinghua.edu.cn)
  merge: -1
  img_proc: true
- pgno: 399
  md: '+   - 优点

    +     - 原理简单，关键是如何对场景中的物体按深度排序。

    +   - 缺点

    +     - 只能处理互不相交的面，而且深度优先级表中面的顺序可能出错。在两个面相交，三个以上的面重叠的情形，用任何排序方法都不能排出正确的序。这时只能把有关的面进行分割后再排序。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# 8.3 区域子分算法


    # 8.3.1 算法思想


    +   - 区域子分算法是针对光栅扫描式图像显示器上填色产生图形的。它是一种所谓分而治之的算法。


    +   - 整个屏幕称为窗口，每一次把矩形的窗口等分成4个相等的小矩形，分成的矩形也称为窗口，见图8.2。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_401_0.png)


    # 图8.2 子分的过程'
  merge: -1
  img_proc: true
- pgno: 402
  md: '+   - 每一次子分，均要把要显示的多边形和窗口的关系做一次判断。这种关系有以下4种：

    +     - 多边形包围了窗口(图8.3中情况1);

    +     - 多边形和窗口相交(图8.3中情况2);

    +     - 窗口包围了多边形(图8.3中情况3);

    +     - 窗口和多边形分离(图8.3中情况4)。'
  merge: -1
  img_proc: true
- pgno: 403
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_403_0.png)


    # 图8.3 多边形和窗口的4种关系'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   • 窗口和每个多边形的关系确定之后，有些窗口内的图形便可显示了，它们属于下列情况：

    +   (1)所有多边形都和窗口分离。这时只要把窗口内所有的象素填上背景颜色。

    +   (2)只有一个多边形和窗口相交，或这个多边形包含在窗口内。这时先对窗口内每一象素填上背景颜色，再对窗口内多边形部分用扫描线算法填色。

    +   (3)只有一个多边形和窗口相交，这个多边形把窗口整个包围在内；或虽有几个多边形和窗口相交，但离观察者最近的一个多边形包围了整个窗口。这时把整个窗口填上离观察者最近的那个多边形的颜色。'
  merge: -1
  img_proc: true
- pgno: 405
  md: '+   - 对上述3种情况不成立的窗口再一分为四,见图8.2。分得的窗口重复上述的处理。

    +   - 重复处理后,窗口的边长越分越短,分了若干次后,窗口的边长就和一个象素的宽度一样了。

    +     这时,这个窗口对应的象素的颜色可取成最靠近观察者的多边形的颜色,或和这个窗口相交的多边形颜色的平均值。'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# 算法步骤


    该算法把初始窗口取作屏幕坐标系的矩形，将场景中的多边形投影到窗口内。


    +   - 如果窗口内没有物体，则按背景色显示；

    +   - 若窗口内只有一个面，则把该面显示出来。

    +   - 否则，窗口内含有两个以上的面，则把窗口等分成四个子窗口。对每个小窗口再做上述同样的处理。这样反复进行下去。

    +   - 如果到某个时刻，窗口仅有像素那么大，而窗口内仍有两个以上的面，这时不必再分割，只要取窗口内最近的可见面的颜色或所有可见面的平均颜色作为该像素的值。'
  merge: -1
  img_proc: true
