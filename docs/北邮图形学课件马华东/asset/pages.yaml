- pgno: 15
  md: '# 1.1.4 计算机图形学的相关学科


    与计算机图形学关系较为密切的学科有计算机图像处理、模式识别和多媒体技术等。彼此相互独立又相互渗透和关联。


    +   - 计算机图像处理　图像 → 图像

    +   - 模式识别　　　　图像 → 数据(模型)

    +   - 计算机图形学　　数据(模型) → 图形

    +   - 多媒体技术　　　综合处理声、文、图形/图像等技术，集成性、实时性、交互性'
  merge: -1
  img_proc: true
