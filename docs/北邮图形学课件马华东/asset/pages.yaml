- pgno: 530
  md: '# 10.5.1 OpenGL光照模型的基本概念


    +   - 光线由4个部分构成：发射光、泛光、漫反射光、镜面发射光，这4个成分单独计算，然后再累加起来。


    +   - 材料颜色取决于反射的红绿蓝光的百分数。与光源的特性相似，材料也有泛光、扩散、反射颜色。'
  merge: -1
  img_proc: true
- pgno: 531
  md: '# 10.5.2 光源定义


    定义光源主要就是定义它的各种特性。可用来下面函数定义：


    ```

    void glLight{if}[v](GLenum light, GLenum pname, TYPE param);

    ```


    *light*用形式为GL_LIGHTi的符号常量表示, 0≤i≤8;

    *pname*设置光源的特性;

    *param*设置*pname*特性的值.

    光源定义后, 须调用glEnable()打开该光源。'
  merge: -1
  img_proc: true
- pgno: 532
  md: '+   ■ 其中,可选的特性参数(pname)有

    +   - 颜色

    +     GL_AMBIENT用于指定环境泛光的强度, (0,0,0,1);

    +     GL_DIFFUSE用于指定漫反射的强度, (1,1,1,1);

    +     GL_SPECULAR用于指定镜面反射光的强度, (1,1,1,1)。

    +   - 位置

    +     GL_POSITION定义光源位置坐标, 缺省为齐次坐标(0,0,1,0).'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# - 衰减


    光线的强度随光源距离的增加而减少。


    对于位置光源，OpenGL使用下面的衰减因子


    子来衰减光线强度： 1 / (k_c + k_e d + k_q d²)


    其中：d为光源位置到物体顶点之间的距离。


    k_c为常数衰减因子 (GL_CONSTANT_ATTENUATION), 1.0


    k_e为线性衰减因子 (GL_LINEAR_ATTENUATION), 0.0


    k_q为二次衰减因子 (GL_QUADRATIC_ATTENUATION), 0.0'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# 10.5.3 光照模式


    +   - 全局环境光


    使用下面函数来指定全局环境光的强度：

    glLightModev(GL_LIGHT_MODEL_AMBIENT, GLfloat param)


    +   - 观察点性质


    定义观察点性质的函数是：

    glLightModeli(GL_LIGHT_MODEL_LOCAL_VIEWER, glboolean param);

    当参数param取GL_TRUE时,观察点为本地观察点；取GL_FALSE时,为无穷观察点。'
  merge: -1
