  md: '# 4) PHIGS


    +   - 它是ANSI在1986年公布的图形系统软件标准，是为应用程序员提供的控制图形设备的子程序接口标准

    +   - 与GKS-3D功能类似，但PHIGS的图形数据按照层次结构组织，而且还提供了动态修改和绘制显示图形数据的手段，是一个高交互、高动态的应用程序图形标准

    +   - PHIGS的图形数据都被组织在称之为结构的单元中，结构之间可以通过层次调用发生联系。每个结构由若干元素组成'
