- pgno: 305
  md: '# 5.4 输入过程基本处理模式


    +   - 为了实现上两节中的各种交互功能，必须把从输入设备输入的信息和应用程序有机地结合好。

    +   - 由于输入设备是多种多样的，而且对一个应用程序而言可以有多个输入设备。这就要求输入过程的处理要有一些合理的办法。

    +   - 现在常用的3种基本处理模式是：'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# 1.请求方式(Request mode)


    +   - 用请求方式时, 输入设备的初始化是在应用程序序中安排的。


    +   - 例如, 当应用程序执行到某点时需要输入一个点, 在应用程序的对应位置便安排一条输入命令。这命令初始化输入设备并等待用户输入。而应用程序也暂停在这点上,
    一直到了用户输入了一个信息(如把光标移到一定位置并按一下鼠标器上的按键), 这时输入命令才回到应用程序, 应用程序才继续执行下去。'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 2. 取样方式(Sample mode)


    当把一台或多台输入设备定义为取样方式后,这些设备立即会把信息输入进来,和应用程序的输入命令无关。


    # 3. 事件方式(Event mode)


    当设备设置成事件方式后,输入设备和程序同时工作。当用户在输入设备上发生一个表示输入的动作(如按按钮)便产生一个事件,输入信息及设备编号等便会存放到一个事件的队列中去。不同的应用程序可到队列中来检索和取走属于该应用程序有关的事件(参见图5.18)。'
  merge: -1
  img_proc: true
