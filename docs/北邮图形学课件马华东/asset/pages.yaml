- pgno: 332
  md: "+   - 由$B_{i,k}(t)$的定义，可知定义的B样条曲线具有以下性质：\n+   \n+     **(1) 凸包性**\n+   \n+\
    \     B样条曲线在区间$(t_k,t_{i+1})$，$k\\leq i\\leq n$上的部分位于$k$个点$P_{i-k+1},P_{i-k+2},\\\
    ldots,P_i$的凸包内。整条曲线$P(t)$则位于各凸包的并集之内。见图6.7。\n+   \n+     **(2) 分段参数多项式**\n+  \
    \ \n+     $P(t)$在每一区间$(t_i,t_{i+1})$，$k\\leq i\\leq n$上都是次数不高于$k-1$的参数$t$的多项式，即$P(t)$是参数$t$的$k-1$次的分段多项式曲线。"
