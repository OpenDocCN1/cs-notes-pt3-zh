- pgno: 43
  md: '# 2.2.2.1 软拷贝设备——显示器


    |  | 出现时间 | 目前使用状况 |

    |---|---|---|

    | 向量显示器

    (随机扫描显示器) | 60 年代中期 | 已淘汰 |

    | 存储管式显示器 | 60 年代末期 | 已淘汰 |

    | 光栅扫描显示器 | 70 年代中期 | 主流产品 |

