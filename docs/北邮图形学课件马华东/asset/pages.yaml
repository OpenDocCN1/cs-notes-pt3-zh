- pgno: 109
  md: '# 1）算法思想


    +   - 首先,区分不同象限的圆弧；

    +   - 然后,选定圆弧起点后,在输出圆弧的过程中,根据当前点的位置与理想圆弧的关系和所在象限,决定下一步的走向,每次只在一个方向(X 或 Y)走步取点；

    +   - 这样一步步地逼近产生应显示的圆弧。'
