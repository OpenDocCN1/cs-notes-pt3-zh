  md: '# 2.3.1 制定图形软件标准的目的


    制定图形软件标准的目的在于使图形软件能够在不同的计算机和图形设备之间进行移植,以便提高图形软件的利用率,降低开发成本,缩短研制周期,使图形软件向着通用、高级与设备无关的方向发展。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 2.3.2 图形软件标准分类


    目前已经制定或正在制定的一些图形标准都是接口标准。这些标准的功能旨在使图形系统中两部分之间的接口标准化，可以分为两类：


    +   - 数据接口标准

    +   - 子程序接口标准'
  merge: -1
