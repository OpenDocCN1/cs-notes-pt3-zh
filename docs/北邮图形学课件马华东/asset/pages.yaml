  md: '# 4.4.4 从规格化坐标到设备坐标的变换


    +   - 规格化坐标(NDC)也称为与设备无关坐标，它不考虑各种设备的不同，独立于设备而建立的一种坐标系。

    +   - 在图形输出时，就必须将NDC转换为相应图形输出设备坐标(DC)一般要经过平移(dx, dy)和比例(Sx, Sy)变换后得到，通常采用的变换为：


