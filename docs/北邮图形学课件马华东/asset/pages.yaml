- pgno: 137
  md: '# 1）定义字符


    用户定义矢量字符一般需要以下几步：


    +   (1)写字模：字符写在一定大小的正方形网格(大小可选16×16, 32×32,64×64,128×128等)中,采集其每一笔划两端点相对网格左下角(0,
    0)点的(x, y)坐标值。


    +   (2)确定字符代码：定义字符的编号(编号不能重复,也不能越界)。


    +   (3)按一定结构保存字符各端点坐标及由前一点到此端点是否划线的标志。


    +   (4)将字模写入字符库中。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 2) 存储字符


    为节省存储空间,查找迅速,可采取以下措施：


    +   (1) 压缩存储：如将每一端点的x、y坐标和划线标志3个信息用两个字节保存，x、y坐标各占7位，划线标志占一位。\n(2) 用定长记录存储字模：这样可以加快查找速度。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 3) 显示字符


    +   - 在应用中，用户必须指定字符的显示位置，另外还可以按条件显示字符(字符尺寸、倾斜度、笔划的宽度等)，这些都可用坐标变换的方法实现。

    +   - 显示过程包括：

    +     (1)确定字符显示时字符界框的左下角点坐标(x,y);

    +     (2)根据字符代码CODE, 取出该字符的存储记录;

    +     (3)进行一系列坐标变换, 计算出该字符的每个端点在实际用户坐标系中的坐标,并且根据端点间划线关系进行连接。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 3.4.3 点阵字符的存储和显示


    +   - 在光栅扫描显示系统中，利用掩膜(mask)来定义字符，保存在字符发生器中。所谓字符掩膜，就是包含该字符的像素信息的一小块光栅。

    +   - 当指定了字符掩膜的原点在显示缓存的对应位置(x₀,y₀)后，就可将此字符掩膜中每个像素相对(x₀,y₀)平移后的值写入显示缓存，从而在屏幕上显示此字符。

    +   - 将字符掩膜相应的像素值置成背景色，就可以擦除显示缓存中的该字符。'
  merge: -1
  img_proc: true
- pgno: 141
