- pgno: 83
  md: "# 3）算法描述\n\n```\nProcedure DDA(x1,x2,y1,y2)\nvar k, i: integer; x, y, dx, dy:\
    \ real;\nbegin\n    k:=abs(x2-x1);\n    if abs(y2-y1)>k then k:=abs(y2-y1); //求最大增量\n\
    \    dx:=(x2-x1)/k; dy:=(y2-y1)/k;\n    x:=x1; y:=y1;\n    for i:=1 to k do\n\
    \    begin\n        plot(round(x), round(y)); //下一个像素点坐标\n        x:=x+dx; y:=y+dy;\n\
    \    end\nend\n```"
  merge: -1
