- pgno: 520
  md: '# 10.4.1 概述


    OpenGL的坐标变换的步骤分为如下4步：


    +   - 第1步 指定视图和造型变换，两者结合称为视图造型变换。WC==》VC

    +   - 第2步 指定投影变换，使对象从视觉坐标变换到裁剪坐标。VC==》CC

    +   - 第3步 通过对坐标值除以w，执行透视除法，变换到规格化设备坐标 CC==》NDC

    +   - 第4步 通过视口变换将坐标变换到窗口坐标。NDC==》WinC'
  merge: -1
  img_proc: true
