  md: '# 5.3 高级的交互技术


    # 1.几何约束


    +   - 第一种几何约束是定位约束。在屏幕上定义一个不可见的网格，有时也可用点的形式显示网格结点的位置。对用任何方式输入一个点都用离它最近的一个网格结点来代替。


    +   - 第二种几何约束为方向约束。例如，要绘制的线只能是垂直或水平两个方向，当给定的起点和终点连线和水平线的交角小于45° 时，便绘出一条水平线，否则就绘垂直线。如图5.4所示。'
