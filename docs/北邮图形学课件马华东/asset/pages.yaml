  md: '# 10.5.4 材质属性


    +   设置材质属性的函数是：


    ```

    void glMaterial{if}(GLenum *face*, GLenum *pname*, TYPE *param*);

    ```


    参数 *face* 可以是 GL_FRONT、GL_BACK 或 GL_FRONT_AND_BACK，指定当前材质作用于物体的哪一个方面。


    被设置的材质的属性由 *pname* 标识，对应于该属性的值由 *param* 给出。'
  merge: -1
