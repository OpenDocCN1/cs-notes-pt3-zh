- pgno: 426
  md: "# (2)计算多边形在其边界的深度值\n\n+   • 设多边形P（$ax+by+cz+d=0$）的边L与扫描线$y=j$的交点为$x_j$，则多边形P在$(x_j,j)$处的深度为\n\
    +   \n+   $$z_j=-(ax_j+bj+d)/c$$\n+   \n+   • 在扫描线$y=j+1$上，边L与扫描线的交点坐标为$(x_{j+1},j+1)$，则多边形P在交点处的深度为\n\
    +   \n+   $$z_{j+1}=-(ax_{j+1}+b(j+1)+d)/c$$\n+   \n+   $$z_{j+1}=z_j+aq/(cp)-b/c=z_j+\\\
    Delta z_x\\Delta x+\\Delta z_y$$\n+   \n+   $\\Delta z_x$为多边形在X方向的深度增值，$\\Delta\
    \ z_y$为多边形在Y方向的深度增值。\n+   \n+   • 上式表明，求多边形在边L与扫描线$j+1$的交点处的深度值$z_{j+1}$，可基于边与前一个扫描线的交点深度值做一次乘法、二次加减法就可得到。"
  merge: -1
  img_proc: true
- pgno: 427
  md: "# (3)计算多边形在点(i,j)处的深度值\n\n+   - 设(i,j,z_ij)为多边形P内的一点，z_ij为多边形P在(i,j)处的深度值，则\n\
    +   \n+     z_ij = -(a i + b j + d)/c\n+   - 在点(i+1,j)，则多边形P的深度为\n+   \n+    \
    \ z_{i+1,j} = -(a(i+1)+b j + d)/c\n+   \n+     z_{i+1,j} = z_{ij} - a/c = z_{ij}\
    \ + Δz_x\n+   \n+     Δz_x为多边形在X方向的深度增值。\n+   - 上式表明，求多边形P在(i,j)处的深度值z_ij后，用一个加法就可得到多边形在同一条扫描线j上后续点(i+1,j)处多边形P的深度z_{i+1,j}。"
  merge: -1
