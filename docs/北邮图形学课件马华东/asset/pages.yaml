- pgno: 480
  md: '# 三、纹理映射


    +   - 离散法定义纹理

    +     通过一个二维数组来定义各种图形、字符位图和数字化图象构成的纹理。

    +   - 纹理映射

    +     为把二维纹理图案映射到三维的物体表面，必须建立物体空间坐标(x,y,z)与纹理空间坐标(u,v)之间的对应关系——物体表面参数化。

    +     (1) 如果物体表面是参数曲面,对应是显然的；

    +     (2) 如果物体表面是平面多边形或隐函数定义二次曲面,须求出映射关系。'
  merge: -1
  img_proc: true
- pgno: 481
  md: "• 二次曲面纹理映射\n可用极坐标把曲面的隐式方程改写为参数方程。\n例1：圆柱面 x² + y² = 1 (0 <= z <= 1) 改写为：\n\
    { x = cos(2πu)   0 ≤ u ≤ 1\n  y = sin(2πu)   0 ≤ v ≤ 1\n  z = v }\n给定 u, v, 可以求出\
    \ x, y, z。\n反之, 给定圆柱面上一点 (x, y, z), 可用下列公式求出参数 u, v。\n(u, v) = { (y, z)      \
    \    当 x = 0\n           (x, z)          当 y = 0\n           ( atan2(y, x) / 2π\
    \ , z )   其它情况 }"
  merge: -1
  img_proc: true
- pgno: 482
  md: '例2：球面 $x^2+y^2+z^2=1$ 可改写为


    ```

    $$\begin{cases}x=\cos(2\pi u)\cos(2\pi v)\\y=\sin(2\pi u)\cos(2\pi v)\\z=\sin(2\pi
    v)\end{cases}\quad\{0\le u\le1,\ 0\le v\le1\}$$

    ```


    其逆公式：


    ```

    $$(u,v)=\begin{cases}(0,0)&\text{当 }(x,y)=(0,0)\\\left(\dfrac{\operatorname{atan2}(y,x)}{2\pi},\dfrac{\arcsin(z)}{2\pi}\right)&\text{其它情况}\end{cases}$$

    ```'
