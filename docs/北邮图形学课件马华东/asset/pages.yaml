- pgno: 336
  md: '# (6)局部调整性


    由于B样条基函数的局部性，如果只变动某一个控制点$P_i(1\le i\le n)$，曲线$P(t)$上只有一段发生变化(对应$max(t_1, t_i)\le
    t\le min(t_{n+1}, t_{i+k})$的一段)。$P(t)$的其它部分均不变动，这就为设计曲线时修改某一局部的形状带来很大的方便。


    # (7)造型灵活性


    在设计曲线时，有时希望在曲线某一点处形成一角点或在某一段形成直线段，或要求曲线与某一直线相切，B样条曲线提供了这种手段。


    可用控制多边形大致勾画B样条曲线形状，再通过局部修改使曲线设计满足要求。


    如为使三次B样条曲线P(t)对应$(t_{i+3}, t_{i+4})$一段为直线段，只要取$P_i P_{i+1} P_{i+2} P_{i+3}$位于一直线上。'
  merge: -1
  img_proc: true
