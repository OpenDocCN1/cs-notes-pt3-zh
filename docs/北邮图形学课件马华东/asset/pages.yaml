- pgno: 81
  md: '# 1) 算法思想


    从直线段的起点像素出发，依据直线的微分方程依次确定描述直线的各个像素点。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_81_0.png)


    图3.1 理想直线段与像素点表示直线段的比较


    微分方程: dy/dx=m, y[i+1]=y[i]+m(x[i+1]-x[i])


    y[i+1]=y[i]+m  (0<m<1)'
  merge: -1
  img_proc: true
