- pgno: 414
  md: '# 8.4 深度缓存算法


    # 8.4.1 算法思想


    +   - 深度缓存算法(Z-Buffer)是一种最简单的图象空间面消隐算法, 既适应于多边形面也适用其它曲面。

    +   - 它需要一个深度缓存数组ZB, 其大小与屏幕上像素点的个数相同, 也与显示器的帧缓存FB的单元个数相同, 彼此一一对应。

    +   - 如图8.6, 在屏幕坐标系中, 过屏幕上任一像素点(i, j)作平行于Z轴的射线R, 与物体表面上的多边形相交于p₁和p₂点。

    +   - 比较p₁和p₂的Z值, 将最大Z值存入深度缓存数组ZB, 最大Z值所对应点的颜色存入显示器的帧缓存FB。'
  merge: -1
  img_proc: true
- pgno: 415
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_415_0.png)


    # 图8.6 射线R与物体相交于p₁,p₂点'
  merge: -1
  img_proc: true
- pgno: 416
  md: "# 8.4.2 算法描述\n\n+   - 若有$N$个多边形，屏幕上象素点个数为$m\\times n$，则算法的基本步骤如下：\n+   \n+\
    \     (1) 初始化$ZB$和$FB$，使\n+     $ZB(i,j)=z$的极小值，$FB(i,j)=$背景色；\n+     $(i=1,2,\\\
    ldots,m,\\ j=1,2,\\ldots,n)$\n+   \n+     (2) `FOR j=1,n` /*第j棵扫描线*/\n+     `FOR\
    \ i=1,m` /*第j棵扫描线上第i个象素点*/\n+     `FOR k=1,N` /*多边形$P_k$*/"
  merge: -1
  img_proc: true
- pgno: 417
  md: '+   (2. 1) 令 Z_ij = Z 的极小值；

    +   (2. 2) 判断点 (i,j) 是否落在多边形 P_k 在 XOY 面上的投影多边形内；

    +   (2. 3) 若 (i,j) 在 P_k 的投影多边形内，则计算多边形 P_k 在点 (i,j) 处的深度值 Z_ij；

    +   (2. 4) 比较 Z_ij 与 ZB(i,j) 的大小，若 Z_ij > ZB(i,j)，则令 ZB(i,j) = Z_ij，FB(i,j) =
    多边形 P_k 的颜色。'
  merge: -1
  img_proc: true
- pgno: 418
  md: '+   - 实现上述算法要解决如下2个问题：

    +     (1).判断点(i, j)是否落在多边形Pₖ在XOY平面上的投影多边形内；

    +     (2).计算多边形Pₖ在点(i, j)处的深度值Zᵢⱼ。

    +   - 解决问题(1)可采用射线法或弧长法。

    +   - 计算多边形Pₖ在(i, j)处的深度值，方法如下：

    +     设多边形Pₖ的平面方程: ax+by+cz+d=0

    +     若c≠0，则把(i, j)代入面方程，得

    +     $$Z_{ij} = -\frac{ai + bj + d}{c}$$

    +     若c=0，则说明多边形Pₖ在XOY的投影为一条直线，算法不考虑这种多边形。'
  merge: -1
  img_proc: true
- pgno: 419
  md: '+   - 射线法

    +     - 由被测点P处向y=-∞方向作射线

    +       - 交点个数是奇数，则被测点在多边形内部；

    +       - 交点个数是偶数，则被测点在多边形外部。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_419_0.png)'
  merge: -1
  img_proc: true
- pgno: 420
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 421
  md: '+   • 弧长法


    +   – 要求多边形是有向多边形，一般规定沿多边形的正向，边的左侧为多边形的内域。


    +   – 以被测计算点为圆心作单位圆，将全部有向边向单位圆作径向投影，并计算其在单位圆上弧长的代数和。


    +   • 代数和为0，点在多边形外部；


    +   • 代数和为2π，点在多边形内部；


    +   • 代数和为π，点在多边形边上。


    +   – 计算边的弧长费时，可利用多边形的顶点符号，以及边所跨越的象限计算弧长代数和。'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 8.5 扫描线算法


    +   - 深度缓存算法的优点是简单、可靠，不需要对显示对象的面预先进行排序；

    +   - 缺点是要很大的Z缓冲器，显示对象的表面和像素对应的每一个点处都要计算它的Z值，因而工作量较大。

    +   - 为了克服上述缺点，引入面向多边形场景的扫描线算法。处理时考虑扫描线内多边形面的相关性，以及扫描线间的多边形面的相关性，省略大量Z值计算。处理后，帧缓冲器中这一行的值便反应了消隐后的图形。'
  merge: -1
  img_proc: true
- pgno: 423
  md: '+   - 在处理当前扫描线时，开一个一维数组作为当前扫描线的Z-buffer。首先找出与当前扫描线相关的多边形，以及每个多边形中相关的边对。在求交点时，利用边的相关性。

    +   - 对每一个边对之间的小区间上的各像素，计算其深度，并与Z-buffer中的值比较，找出各像素处的可见平面。在计算深度时，充分利用图形的连贯性，采用增量算法计算深度。

    +   - 计算颜色，写帧缓存。'
  merge: -1
  img_proc: true
- pgno: 424
  md: '+   • 如图8.7所示, 利用边的相关性可容易计算多边形P在指定象素(i,j)的深度值Z。

    +   改进方法如下：

    +   (1)计算投影多边形P’的边L与扫描线的交点


    +   • 设L的方程为

    +   $p x + q y + r = 0$

    +   则在$y=j$这根扫描线上, 边与扫描线交点的$x$坐标为：

    +   $x_j = -(q j + r)/p$

    +   在$y=j+1$这根扫描线上, 交点的$x$坐标为：

    +   $x_{j+1} = -(q(j+1)+r)/p = x_j - q/p = x_j + \Delta x$


    +   • 上式表明, 将边与前一条扫描线的交点$x_j$做一次加法就可得到下一条扫描线的交点'
  merge: -1
  img_proc: true
