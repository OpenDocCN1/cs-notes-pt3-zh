- pgno: 90
  md: "# 3) 算法描述\n\n```\nProcedure Bresenhamline(xs,ys,xe,ye)\nint x, y, deltax, deltay,\
    \ e;\nbegin\n    deltax:=xe-xs; deltay:=ye-ys;\n    e:=-deltax; x:=xs; y:=ys;\n\
    \    for(i:=0 to deltax) do\n    begin\n        plot(x, y);\n        if (e>=0)\
    \ then\n        begin\n            y:=y+1; e:=e-2*deltax;\n        end\n     \
    \   x:=x+1; e:=e+2*deltay;\n    end\nend\n```"
  merge: -1
