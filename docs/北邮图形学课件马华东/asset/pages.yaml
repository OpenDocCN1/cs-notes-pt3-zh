- pgno: 110
  md: '# 2) 算法原理


    +   - 设要显示的圆的圆心在 C(x_c, y_c)，半径为 R。


    +   - 以图3.7中第一象限画圆弧AB为例。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_110_0.png)


    图3.7 正负法原理示意图'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - 令 $F(x,y)=(x-x_c)^2+(y-y_c)^2-R^2$，则圆的方程为：$F(x,y)=0$。\

    +     当点 $(x,y)$ 在圆内时，有 $F(x,y)<0$；当点 $(x,y)$ 在圆外时，有 $F(x,y)>0$。


    +   - 取 $P_0(x_0,y_0)$ 为 A 点，即 $x_0=x_c，y_0=y_c+R$。求得 $P_i(x_i,y_i)$ 后找下一点 $P_{i+1}$
    的原则为：\

    +     当 $F_i(x_i,y_i)<0$ 时，向 +X 方向（圆外方向）走步，取\

    +     $x_{i+1}=x_i+1，\ y_{i+1}=y_i$；\

    +     当 $F_i(x_i,y_i)\geq0$ 时，向 -Y 方向（圆内方向）走步，取\

    +     $x_{i+1}=x_i，\ y_{i+1}=y_i-1$。


    +   - $F(x,y)$ 时正时负，这是算法名称来源'
  merge: -1
  img_proc: true
- pgno: 112
  md: "+   - 推导递推公式，简化判别式\n+   \n+     注意 \\(F(x_0,y_0)=0\\);\n+   \n+     当 \\(x_{i+1}=x_i+1,\\\
    \ y_{i+1}=y_i\\)（圆外方向走）时，\n+     \n+     \\[\n+     F(x_{i+1},y_{i+1})=(x_i+1-x_c)^2+(y_i-y_c)^2-R^2\n\
    +     \\]\n+     \\[\n+     =(x_i-x_c)^2+(y_i-y_c)^2-R^2+2(x_i-x_c)+1\n+     \\\
    ]\n+     \\[\n+     =F(x_i,y_i)+2(x_i-x_c)+1\n+     \\]\n+   \n+     当 \\(x_{i+1}=x_i,\\\
    \ y_{i+1}=y_i-1\\)（圆内方向走）时，\n+     \n+     \\[\n+     F(x_{i+1},y_{i+1})=(x_i-x_c)^2+(y_i-1-y_c)^2-R^2\n\
    +     \\]\n+     \\[\n+     =F(x_i,y_i)-2(y_i-y_c)+1\n+     \\]"
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   - 结论：

    +     - 判别式初值 $F_0=0$；

    +     - 当 $F_i<0$ 时（在圆内），选 $P_{i+1}(x_i+1,y_i)$，且

    +       $$F_{i+1}=F_i+2(x_i-x_c)+1;$$

    +     - 当 $F_i\geq0$ 时（在圆外），选 $P_{i+1}(x_i,y_i-1)$，且

    +       $$F_{i+1}=F_i-2(y_i-y_c)+1.$$'
  merge: -1
  img_proc: true
- pgno: 114
  md: "# 算法描述\n\n```\nProcedure pnarc(r,xc,yc: integer);\n  var x,y,f: integer;\n\
    \  begin\n    x:=xc; y:=yc+r; f:=0;\n    while y>yc do {        //画1/4圆弧\n   \
    \   plot(x,y);\n      if f>0 then { f:=f-2*(y-yc)+1;\n                    y:=y-1\
    \ }    //向圆内走\n      else { f:=f+2*(x-xc)+1;\n             x:=x+1 }    //向圆外走\n\
    \    }\n    if (y=yc) plot(x,y)\n  end\n```"
  merge: -1
  img_proc: true
