- pgno: 309
  md: '# 5.5 设计人机交互的一般风格及原则


    +   - 现在计算机系统的人机界面一般具有下列风格，即：“所见即所得”(what you see is what you get)，直接操作(direct
    manipulate)及菜单和图形符号(icon)驱动。

    +     - “所见即所得”在交互式图形系统中一般都能做到，即在屏幕上所见到的设计结果和用硬拷贝所得的输出结果是一致的。

    +     - 直接操作是对对象、特性及关系等操作时用户可得到一种直观及形象的表示，以说明这个操作是正确地被执行了。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   - 图形符号驱动的目的是要用户不需要专门学习及记忆便可借助菜单选择来运行系统。要做到这一点最主要的是要设计好图形符号，使它一看便知道它代表什么操作。

    +   - 用命令语言作交互手段也在一些人机交互界面中使用。

    +   - 自然语言也是一种有希望的交互手段。

    +   - 人机界面设计的一些基本原则:

    +     (1) 简单易学

    +     (2) 提供反馈

    +     (3) 对错误操作容易纠正 Undo

    +     (4) 设计一致性 功能布局、颜色、代号等应一致'
  merge: -1
  img_proc: true
