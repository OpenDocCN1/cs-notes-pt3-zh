- pgno: 509
  md: '# 10.3.1 绘图准备和结束


    在开始绘制新图形前，必须清除当前已有的图形信息内容，以免影响绘图的效果，可以用


    +   - void glClearColor(red, green, blue, alpha);

    +     给定当前屏幕的背景设置颜色

    +   - void glClear(mask);

    +     命令标志要清除的缓冲区(颜色、深度、累加、模板); 如GL_COLOR_BUFFER_BIT

    +   - void glColor *();

    +     设置当前颜色'
