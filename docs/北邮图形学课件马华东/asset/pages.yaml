- pgno: 161
  md: '# 1) 适用对象


    +   - 扫描转换填充算法适用于规则边界的区域。通常是将由顶点定义的多边形区域，其内部用预期的像素值予以填充，因此称为多边形的扫描转换。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 2) 基本原理


    +   - 这种算法不是孤立地去测试平面上的点是否在一个多边形之内，而是利用一条扫描线上的像素存在着相关性这一特征。

    +   - 在图3.16中，对于y=8这条扫描线，可以求出交点A、B、C、D，在AB和CD区段内的像素都位于多边形之内，因此可以按每一条扫描线处理：

    +     a. 与多边形各棱边求交，若为水平边则跳过；

    +     b. 交点按X坐标升序排列；

    +     c. 填充每一对交点之间的所有像素。'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/c00b4e8ccb17d37f1489c44f2791c008_163_0.png)


    图3.16 多边形和扫描线'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 3）利用边的连贯性简化求交点计算


    +   - 每一条扫描线与多边形每条棱边求交点，计算量是很大的。

    +   - 设扫描线y=j与多边形的某条棱边PQ的交点为(x_j, j)，若PQ与扫描线y=j+1仍有交点存在，则交点的X坐标应为：

    +     $$x_{j+1}=x_j+1/m$$

    +     其中，m是该棱边的斜率。

    +   - 利用这种边的连贯性，交点坐标可以简单递推得到。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_164_0.png)


    图3.17 简化交点计算'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 4）算法中的数据结构


    +   - 边的分类表ET：指针数组，记录对多边形的所有棱边(水平边除外),按下端点的纵坐标y的分类。下端点的纵坐标y=j的边归入第j类，有多少条扫描线，就设多少类。同类中的边构成一个链。


    +   - 链上的边元素由以下4个域组成：

    +     y_max： 该棱边的上端点的y坐标；

    +     x： 该棱边的下端点的x坐标；

    +     Δx： 该棱边的斜率m的倒数；

    +     next： 指向下一条棱边的指针；

    +     同一类中,边元素按x (x相同时按Δx)值递增的顺序排列。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   - 边的活化链表AEL：记录当前扫描线与棱边的交点序列。初值为空,在处理过程中利用ET表和求交点的递推关系不断刷新。

    +   - 链表AEL的边元素由以下4个域组成：

    +     y_max：该棱边的上端点的y坐标；

    +     x：该棱边与当前扫描线交点的x坐标；

    +     Δx：该棱边的斜率m的倒数；

    +     next：指向下一条棱边的指针。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 5）算法步骤


    +   a. 非极值奇点的预处理；

    +      （极值奇点=2个交点；非极值奇点=1个交点）

    +   b. 建立边的分类表ET；

    +   c. 取扫描线初始值 y=ET表中所列的最小 y坐标值；

    +   d. 边的活化链表AEL初始化，使其为空；

    +   e. 重复下列操作，直至ET表和AEL表都变成空：

    +      e1. 把ET表中纵坐标为y的链取下，与AEL表合并，并保持AEL表中元素按x（x相同时，按Δx）域值升序排列；

    +      e2. 对于当前扫描线y，从左到右，将AEL表中元素两两配对，按每对两个x域定义的区段填充所需要的像素值。'
  merge: -1
  img_proc: true
- pgno: 168
  md: "+   e3. 将AEL表中满足$y_{\\max}=y$的元素删除；\n+   \n+    e4. 对于仍留在AEL表中的元素，求下一条扫描线与边的交点，即x域累加Δx：$x=x+\\\
    Delta x$；\n+   \n+    e5. 取下一条扫描线作为当前扫描线：$y=y+1$。"
  merge: -1
  img_proc: true
