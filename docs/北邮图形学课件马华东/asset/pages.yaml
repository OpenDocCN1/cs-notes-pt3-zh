  md: '# 7.3 体素构造表示法


    # 7.3.1 物体定义


    +   - 我们将物体定义为三维欧氏空间E³中点的正则集合 rX=kiX。式中X表示E³中一个点集, r表示正则化算子, k,i分别表示点集的闭包和内部。bX是X的边界,
    cX是X的外部。

    +   - 正则化的含义是取点集内部并用一张边界把它包裹起来。

    +   - 由以上定义可得下述推论：

    +     (1) 一个物体只能占据有限空间。它是封闭的，具有一定的体积。

    +     (2) 物体中不允许存在孤立点、悬挂的线或面。见图7.5。'
