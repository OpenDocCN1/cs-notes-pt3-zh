- pgno: 228
  md: '# 4.3.3 透视投影


    +   - 透视投影的投影线是从视点(观察点)出发，投影线是不平行的。

    +   - 任何一束不平行于投影平面的平行线的透视投影将汇聚成一点，称为灭点。灭点可以看作是无限远处的一点在投影面上的投影。灭点有无限多个。

    +   - 在坐标轴方向上的灭点，称为主灭点。

    +   - 透视投影根据主灭点的个数分为一点透视、二点透视和三点透视。主灭点数是和投影平面切割坐标轴的数量相对应的。'
  merge: -1
  img_proc: true
