- pgno: 366
  md: "# 7.3.2 物体间的正则集合运算\n\n+   - 传统的点集之间的并、交、差运算可能改变点集的正则性质，有必要对传统的点的集合运算施加一定的限制。\n\
    +   - 为此，对点集的正则集合运算作下述定义：\n+   \n+     正则并运算　A ∪*B=r(A ∪ B)\n+   \n+     正则交运算　A\
    \ ∩*B=r(A ∩ B)\n+   \n+     正则差运算　A −*B=r(A − B)\n+   \n+     其中，r表示正则化算子。正则物体经正则运算结果仍为正则物体。"
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   正则集合运算后产生的新物体的边界是原两拼合物体边界的一个子集，即：


    $b(A<op>B)\subset (bA\cup bB)$


    +   A，B为两个物体，由于A，B为正则点集，所以


    $A=bA\cup iA$


    $B=bB\cup iB$


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_367_0.png)'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# 边界公式:


    $b(A\cap{}^*B)=(bA\cap iB)\cup(bB\cap iA)\cup(bA\cap bB\cap k(iA\cap iB))$


    $b(A\cup{}^*B)=(bA\cap cB)\cup(bB\cap cA)\cup(bA\cap bB\cap k(cA\cap cB))$


    $b(A-{}^*B)=(bA\cap cB)\cup(bB\cap iA)\cup(bA\cap bB\cap k(iA\cap cB))$'
