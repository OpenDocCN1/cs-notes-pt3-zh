- pgno: 262
  md: "# 2. 中点分割裁剪法\n\n+   - **算法思想**\n+   \n+     当一条线段既不能直接接受也不能直接舍弃，欲求其与区域的交点时，假设此交点在线段的中点，如果估计错误，则将直线分为两段，并对该两段再分别加以测试。一直进行下去，直到原来线段的一段被直接接受，而另一段被直接舍弃。\n\
    +   \n+   - 设裁剪的区域是矩形，要裁剪的线段为P₁P₂，如图4.12所示。为求其可见部分AB，算法可分为两个过程平行进行，即："
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   1) 从P₁出发, 找出离P₁最近的可见点A;

    +   2) 从P₂出发, 找出离P₂最近的可见点B;


    此两点的连线AB, 即为原线段P₁P₂的可见部分。求P₁最近的可见点A的算法框图如图4.13所示。这里ε可取为一个像素的宽度。'
  merge: -1
