- pgno: 123
  md: '# 3.3.1 规则曲线的一般生成方法


    +   - 平面曲线可分为两大类: 规则曲线(函数曲线)和不规则曲线(或称为自由曲线)。

    +   - 规则曲线通常是指可以用函数直接描述的曲线，如圆、椭圆、双曲线、渐开线等; 不规则曲线通常由一系列离散点(样本点)定义,不规则曲线的生成方法第6章讨论。

    +   - 规则曲线生成的基本方法是将曲线离散化成小直线段，通过连接各直线段来逼近所要的曲线。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 3.3.2 椭圆生成算法


    椭圆是一种常见的二次曲线,下面介绍两种方法,说明选择合理的几何描述的重要性。


    +   1) 标准方程法

    +   2) 参数方程法


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_124_0.png)


    图3.9 椭圆'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 1) 标准方程法


    +   • 椭圆的标准方程为： $\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$


    可以解得： $y = \pm \frac{b}{a}\sqrt{a^2 - x^2} \quad (-a \le x \le a)$


    该式分别表示图3.9中上下两个半椭圆。


    +   • 对每一个半椭圆，可以通过以下步骤绘制：

    +   (1) 选择x的步进增量为dx，从x=-a,y=0出发；

    +   (2) 计算x=x+dx时的相应y值，并且将前一个点和(x, y)连接为一个直线段，反复执行(2)，直至x=a为止。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - 分析


    该方法明显的缺点是：x坐标的步进增量dx被选定后，在整个过程中就是常数，但是由率大的两端与曲率小的两侧的点的分布情况是不一样的。一个弯大的图形见图3.10，椭圆两端出现棱角。若dx取值减小，两端情况会好转，但是对于相对平滑的两侧而言，计算更多的点则有所浪费。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_126_0.png)


    图3.10 步进增量dx较大时生成的椭圆'
  merge: -1
  img_proc: true
- pgno: 127
  md: "# 2) 参数方程法\n\n+   - 椭圆的参数方程为：\n+     $$\begin{cases} x = a \\ y = b \\end{cases}$$\
    \  $(0 \\le t \\le 2\\pi)$\n\n+   - 按以下步骤生成椭圆：\n+     (1) 选择幅角参数 t 的步进增量 dt, 计算\
    \ t=0 时的点 (x, y)\n+     (2) 计算下一点坐标, 即 t=t+dt 时点 (x, y), 并且与前一点连接为一个直线段, 反复执行\
    \ (2), 直至 t=2π 为止。\n\n+   - 分析：\n+     由椭圆的参数方程可以得到参数 t 有增量 dt 时, 引起 X 和 Y 方向的增量\
    \ dx 和 dy 分别为"
  merge: -1
  img_proc: true
- pgno: 128
  md: "$$\begin{cases} dx = -a\\sin t\\cdot dt \\\\ dy = b\\cos t\\cdot dt \\end{cases}$$\
    \ 当t接近0或π时，有|dx|→0和|dy|→b·dt，这就是说，x几乎不增加的情况下，y有一定的增值，这与椭圆两端所需要的趋势符合；\n当 t 接近π/2或3π/2时，有|dx|→a·dt和|dy|→0，这就是说，y几乎不增加的情况下，x有一定的增值，这与椭圆两侧所需要的趋势符合。\n\
    \n+   - 而且，由于a>b，因此两侧的增值大于两端的增值，做到了曲率大处点密，曲率小处点稀。\n+     t由0到2π，即可生成完整的椭圆。"
  merge: -1
  img_proc: true
- pgno: 129
  md: "# 3.3.3 抛物线生成算法\n\n+   - 以坐标原点为顶点，焦点在(0, p)的抛物线其标准方程为：\n+   \n+     y=x²/4p\n\
    +   \n+     在该表达式中，自变量x的取值范围是任意的，图形不封闭。但在实际绘图时，x的取值范围受图纸或者显示器上显示区域大小的限制。\n\n+\
    \   - x的取值范围的确定"
  merge: -1
  img_proc: true
- pgno: 130
  md: '设显示区域限制在长为XL和高为YH范围内，如图3.11所示。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_130_0.png)


    图3.11 确定x的取值范围'
  merge: -1
  img_proc: true
- pgno: 131
  md: "+   - 对于曲线2，显然x的取值范围为[-XL/2, XL/2]；对于曲线1，还必须计算相对于y=YH时的x₁与x₂值，这时x的取值范围为[x₁,\
    \ x₂]。\n+   - 因此，决定x的取值范围[x₁,x₂]方法如下：\n+     1. 计算x=XL/2时的y值；\n+     2. 若y≤YH，则x₁=-XL/2，x₂=XL/2；否则，将y=YH代入抛物线方程解得x₁和x₂。\n\
    +   - 抛物线的生成\n+   \n+     设定x的步进增量dx，从x=x₁开始，求出对应的y值，直到x=x₂为止。相邻点以直线段相连即可。"
  merge: -1
  img_proc: true
