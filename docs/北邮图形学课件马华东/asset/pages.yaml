- pgno: 53
  md: '# 1）像素


    +   - 光栅扫描显示器的显示屏上有许多水平光栅扫描线，每条光栅线由许多点组成，这些点就是像素，即图像的基本元素。

    +   - 每一个像素是显示屏上可以编址控制的最小单元。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_53_0.png)


    图2.3 显示屏上的像素'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 2）分辨率


    +   - 显示器的分辨率表示为：

    +     水平分辨率×垂直分辨率

    +   - 水平分辨率即每条光栅线上像素的总数目；垂直分辨率即屏上的水平光栅线数目。显示器的分辨率决定了显示屏上所拥有的像素总数。

    +   - 例如, IBM PC彩色图形显示器(CGA)的中分辨率模式为320×200, 表明屏上共有320×200 = 64000个像素。又如, 目前常用1024×768。

    +   - 对于同样尺寸的显示器, 分辨率越高, 记录图形的像素密度越大, 显示出的图形质量越好。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 3）屏幕坐标


    +   - 显示屏上的每一像素被赋予一对整数值作为该像素的坐标。

    +   - 屏上像素的坐标值一般是按照水平方向(X)从左到右、垂直方向(Y)从上向下两个方向从0开始整值排列。

    +   - 显示屏上的坐标和像素位置一一对应。


    ![](img/c00b4e8ccb17d37f1489c44f2791c008_55_0.png)


