- pgno: 57
  md: '# 2.2.3.3 显示存储器


    +   - 显示存储器(也称为位存储器、帧缓冲存储器)存储着屏幕画面上图形的映像。该图形映像对应一个二维矩阵，矩阵的每个元素就是屏幕对应点的图像信息，称为像素值。显示存储器的组织结构有多种形式。


    +   - 显示存储器的分页处理是目前的常用技术，存储区划分成若干页，每一页存放一幅屏幕画面。正在显示的页称为可见页。被进行读写操作的页称为活动页。此技术可以使用户通过上下左右移屏功能看到存储器中的整幅画面，还用来支持动画效果。'
  merge: -1
  img_proc: true
