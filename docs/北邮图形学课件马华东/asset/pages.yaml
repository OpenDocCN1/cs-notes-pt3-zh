  md: '# 2) 算法原理


    （以斜率在0~1之间的直线段为例）


    +   - 这种情况下，选择X方向为计长方向，即增量 dx=1。如图3.2所示,设Pᵢ(xᵢ,yᵢ)是已选定的离直线最近的像素,现在要决定Pᵢ₊₁是T还是S。

    +   - 显然，若d<0.5，则S比较靠近直线，应选S；若d>=0.5，则应选T。（m= △y/△x）

    +   - 令e=d-0.5(初值为-0.5)，即有：

    +     { e <0时，选Pᵢ₊₁(xᵢ+1, yᵢ)，更新e=e+m; e >=0时,选Pᵢ₊₁(xᵢ+1, yᵢ+1)，更新e=e+m-1; }'
