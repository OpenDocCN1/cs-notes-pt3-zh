- pgno: 537
  md: '+   ■ 其中，属性可以是

    +   - 漫反射和泛反射

    +   GL_AMBIENT和GL_DIFFUSE属性定义了物体对漫反射和泛射光的反射率。

    +   - 镜面反射

    +   GL_SPECULAR属性设置镜面反射率。

    +   GL_SHININESS属性可控制亮斑的大小和亮度，这时param的取值范围为0.0至128.0，这个值越大，亮斑的尺寸越小且亮度越高。

    +   - 发射光

    +   用GL_EMISSION作为pname参数的值调用glMaterial*()函数，指定一种RGBA颜色，使得物体看起来像发出某种颜色的光。'
  merge: -1
