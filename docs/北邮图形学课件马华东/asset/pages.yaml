- pgno: 330
  md: '# （4）连续性


    $B_{i,k}(t)$在$1$重节点处的连续阶不低于$k-1-l$（阶连续），$B_{i,k}(t)$的求导公式如下：


    $$B''_{i,k}(t)=(k-1)\left[\frac{B_{i,k-1}(t)}{t_i+k-1-t_i}-\frac{B_{i+1,k-1}(t)}{t_i+k-t_{i+1}}\right]$$'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 二、B样条曲线


    +   • 给定空间$n$个点$P_1 P_2 ... P_n$ ($n \ge k$), 称下列参数曲线 $P(t) = \sum_{i=1}^{n} B_{i,k}(t)
    P_i, \ t_k \le t \le t_{n+1}$ 为$k$阶 (或$k-1$次)B样条曲线, 折线$P_1 P_2 ... P_n$为$P(t)$的控制多边形,
    称点集$\{P_i\}$为$P(t)$的控制顶点。如图6.6所示。


