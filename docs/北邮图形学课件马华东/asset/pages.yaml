- pgno: 245
  md: "# 4.4.1 用户域和窗口区\n\n+   - **用户域**\n+   \n+     用户域是指程序员用来定义图形的整个自然空间 wc(世界坐标)。用户域是一个实数域，wc从理论上说是连续无限的。\n\
    +   \n+   - **窗口区**\n+   \n+     窗口区 w 是 wc 的一个子域，小于或等于 wc，通常是指用户指定的某个区域。窗口区通常是矩形域，可以用左上角点和右下角点坐标来表示。窗口可以嵌套定义，还可以定义圆形或多边形窗口。"
  merge: -1
  img_proc: true
- pgno: 246
  md: "# 4.4.2 屏幕域和视图区\n\n+   - **屏幕域**\n+   \n+     屏幕域dc是设备输出图形的最大区域，是一个有限的整数域。如某图形显示器有1024×768个可编程象素，则dc可定义为：\n\
    +   \n+     `dc ∈ [0:1023]×[0:767]`\n\n+   - **视图区**\n+   \n+     任何小于或等于屏幕域的区域都称为视图区，可由用户在屏幕域中用设备坐标来定义。视图区可嵌套定义，一般定义为矩形，也可定义为圆形或多边形。"
  merge: -1
  img_proc: true
- pgno: 247
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   - 要将窗口内图形对应在屏幕视图区内显示出来，亦即在用户坐标系下的点 $(X_w, Y_w)$ 变换到视图区中的点 $(X_s, Y_s)$，其变换公式为：


    $$X_s=\frac{VXR-VXL}{WXR-WXL}\bullet(X_w-WXL)+VXL=a\bullet X_w+b$$


    $$Y_s=\frac{VTT-VYB}{WYT-WYB}\bullet(Y_w-WYB)+VYB=c\bullet Y_w+d$$'
  merge: -1
  img_proc: true
- pgno: 249
  md: '其中：


    \[

    a=\frac{VKR-VXL}{WKR-WXL}

    \]


    \[

    b=WXL-WWL\cdot\frac{VXR-VXL}{WXR-WXL}

    \]


    \[

    c=\frac{VYT-VYB}{WYT-WYB}

    \]


    \[

    d=VYB-WYB\cdot\frac{VYT-VYB}{WYT-WYB}

    \]


    相应的变换矩阵为：


    \[

    \begin{bmatrix}

    a & 0 & 0 \\

    0 & c & 0 \\

    b & d & 1

    \end{bmatrix}

    \]


    用户定义的图形从窗口区到视图区的输出过程如图4.10所示.'
