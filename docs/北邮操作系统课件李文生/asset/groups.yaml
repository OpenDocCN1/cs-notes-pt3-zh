  - '[PAGE 573]


    # Pentium segmentation


    +   - Allows a segment to be as large as 4GB, maximum number of segments per process
    is 16K(=16384).

    +   - The logical-address space of a process is divided into two partition

    +     - 1st, up to 8K segments, private to that process

    +     - 2nd, up to 8K segments, shared among all the processes

    +   - Information about the 1st partition is kept in the local descriptor table,
    LDT;

    +     information about the 2nd partition is kept in the global descriptor table,
    GDT.

    +   - Each entry in the LDT and GDT consists of an 8-byte segment descriptor with
    detailed information about a particular segment, including the base location and
    limit of that segment.'
  - '[PAGE 574]


    # Pentium segmentation


    +   - **Logical address: (selector, offset)**

    +     - Selector is a 16-bit number, **13-bit s, 1-bit g, and 2-bit p**

    +       - s, the segment number

    +       - g, whether the segment is in the GDT or LDT

    +       - p, deals with protection

    +     - offset, 32-bit number, location of byte within the segment

    +   - The machine has six segment registers, allowing 6 segments to be addressed
    at any time by a process.

    +   - It has six 8-byte microprogram registers to hold the corresponding descriptors
    from either the LDT or GDT. (cache)'
  - '[PAGE 575]


    # Pentium segmentation


    +   - The segment register points to the appropriate entry in the LDT or GDT.

    +   - The base and limit information is used to generate a linear address.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_575_0.png)'
  - '[PAGE 576]


    # Pentium paging


    +   - Allow a page size of either 4KB or 4MB

    +   - For 4KB pages, the Pentium uses a two-level paging scheme.

    +   - The linear address: 32-bit long

    +     - 20-bit page number

    +       - 10-bit page directory pointer (P1)

    +       - 10-bit page table pointer (P2)

    +     - 12-bit offset (d)


    | page number | page offset |

    |---|---|

    | P₁ | P₂ | d |'
  - '[PAGE 577]


    # Pentium paging


    +   - **One entry in the page directory is the Page Size flag,**

    +     - If set, page size is 4MB

    +     - If not set, page size is 4KB

    +   - **For 4MB page size**

    +     - the page directory points directly to the 4-MB page frame

    +     - and the 22 low-order bits in the linear address refer to the offset in
    the 4-MB page frame.'
  - '[PAGE 578]


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_578_0.png)'
  - '[PAGE 579]


    # Pentium paging


    +   - **Page table can be swapped to disk**

    +     - An invalid bit is used

    +     - If swapped, the OS uses the other 31 bits to specify the disk location
    of the table'
