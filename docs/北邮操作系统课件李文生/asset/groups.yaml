    \    j = (j+1) % n;\n    if (j == i)  lock = FALSE;\n    else  waiting[j] = FALSE;\n\
    \n    remainder section\n} while(TRUE);\n```\n\n- 互斥？✔\n- 有空让进？✔\n- 有限等待？✔\n\n\
    ### 互斥的机器指令\n\n**优点**\n\n- 适用于任意数量的进程，无论是在单个处理器上还是在共享主存的多处理器上\n- 它很简单，因此易于验证\n\
    - 它可以用来支持多个临界区\n\n**缺点**\n\n- 忙等待会消耗处理器时间\n- 当一个进程离开临界区且不止一个进程在等待时，可能发生饥饿。\n-\
