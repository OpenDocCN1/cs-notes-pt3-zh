    +   - 管道分为有名管道和无名管道

    +   - 管道按先进先出（FIFO）的方式传送消息，且只能单向传

    +   送消息。

    +   - 管道操作

    +     - 发送进程利用文件系统的系统调用 write（fd[1], buf, size）

    +       把buf中长度为size字符的消息送入管道入口fd[1];

    +     - 接收进程利用文件系统的系统调用 read（fd[0], buf, size）

    +       从管道出口fd[0]读出size字符的消息放入buf中。'
