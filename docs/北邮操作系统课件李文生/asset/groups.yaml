    read queue | write queue


    read queue | write queue


    read queue | write queue


    driver end


    device


    modules'
  - '[PAGE 868]


    # 13.7 Performance


    I/O is a major factor in system performance:


    +   - Demands CPU to execute device driver, kernel I/O code

    +   - Context switches due to interrupts

    +   - Data copying

    +   - Network traffic especially stressful'
