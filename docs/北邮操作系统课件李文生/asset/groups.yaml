  mdcn: "\n\n## 13.5 将 I/O 请求转换为硬件操作\n\n考虑为一个进程从磁盘读取文件：\n\n- 确定保存文件的设备\n- 将名称转换为设备表示形式\n\
    - 物理上将数据从磁盘读入缓冲区\n- 使数据可供请求进程使用\n- 将控制权返回给进程\n\n### I/O 请求的生命周期\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_865_0.png)\n\
    \n## 13.6 STREAMS\n\n- **STREAM** – 用户级进程与设备之间的全双工通信通道\n- 一个 STREAM 由以下部分组成：\n\
    \  - **STREAM 头** 与用户进程接口\n  - **驱动程序端** 与设备接口\n  - 它们之间零个或多个 **STREAM 模块**。\n\
    - 每个模块包含一个读队列和一个写队列\n- 使用消息传递在队列之间进行通信\n\n### STREAMS 结构\n\nread()\ngetmsg()\n\
    \nwrite()\nputmsg()\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_867_0.png)\n\n\
    ```\nuser process\n\nstream head\n\nread queue | write queue\nread queue | write\
    \ queue\nread queue | write queue\nread queue | write queue\n\ndriver end\n\n\
    device\n\nmodules\n```\n\n## 13.7 性能\n\nI/O 是系统性能的主要因素：\n\n- 需要 CPU 执行设备驱动程序、内核\
    \ I/O 代码\n- 由于中断导致上下文切换\n- 数据复制\n- 网络流量尤其具有压力\n\n### 计算机间通信\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_869_0.png)\n\
    \n### 提高性能\n\n- 减少上下文切换次数\n- 减少数据复制\n- 通过使用大传输、智能控制器、轮询来减少中断\n- 使用 DMA\n- 平衡 CPU、内存、总线和\
    \ I/O 性能以获得最高吞吐量\n\n### 设备功能演进\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_871_0.png)\n\
    \n## 作业（第 526 页）\n\n- **13.6** 第 13.2.1 节中握手示例使用了 2 位：忙位和命令就绪位。是否可以用只有 1 位来实现这种握手？如果是，请描述该协议。如果不是，请解释为什么\
    \ 1 位不足。\n- DMA 如何提高系统并发性？它如何使硬件设计复杂化？\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_872_0.png)\n\
    \n## 补充：I/O 设备分类\n\n- **人类可读：用于与用户通信**\n  - 打印机\n  - 视频显示终端：\n    显示器、键盘、鼠标\n\
    - **机器可读：用于与电子设备通信**\n  - 磁盘和磁带驱动器\n  - 传感器（传感器）\n  - 控制器\n  - 致动器（传动器）\n- **通信：用于与远程设备通信**\n\
    \  - 数字线路驱动器\n  - 调制解调器\n\n### I/O 设备的差异\n\n- **数据速率**\n  - 数据传输速率之间可能相差几个数量级\n\
    - **应用**\n  - 用于存储文件的磁盘需要文件管理软件\n  - 用于存储虚拟内存页的磁盘需要特殊的硬件和软件来支持它\n  - 系统管理员使用的终端可能具有更高的优先级\n\
    - **控制复杂性**\n- **传输单元**\n  - 数据可能作为终端的字节流传输，或作为磁盘的大块传输\n- **数据表示**\n  - 编码方案\n\
    - **错误条件**\n  - 设备对错误的响应不同\n\n### I/O 功能的演进\n\n- 处理器直接控制外围设备\n- 添加控制器或 I/O 模块\n\
    \  - 处理器使用无中断的程序化 I/O\n  - 处理器无需处理外部设备的细节\n- 带中断的控制器或 I/O 模块\n  - 处理器无需花费时间等待\
    \ I/O 操作执行\n- 直接内存访问\n  - 数据块在不涉及处理器的情况下移入内存\n  - 处理器仅在开始和结束时参与\n- I/O 模块是独立的处理器\n\
    - I/O 处理器\n  - I/O 模块有自己的本地内存\n  - 它本身就是一台计算机\n\n"
