  - '[PAGE 516]


    # Address Binding


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_516_0.png)'
  - '[PAGE 517]


    # Binding of Instructions and Data to Memory


    Address binding of instructions and data to memory addresses can happen at three
    different stages.


    +   - **Compile time:** If memory location known a priori, absolute code can be
    generated; must recompile code if starting location changes.

    +   - **Load time:** Must generate *relocatable* code if memory location is not
    known at compile time.

    +   - **Execution time:** Binding must be delayed until run time if the process
    can be moved during its execution from one memory segment to another. Need hardware
    support for address maps (e.g., *base and limit registers*).'
  - '[PAGE 518]


    # Logical vs. Physical Address Space


    +   - The concept of a *logical-address space* that is bound to a separate *physical-address
    space* is central to proper memory management.

    +     - *Logical address* – generated by the CPU; also referred to as *virtual
    address*.

    +     - *Physical address* – address seen by the memory unit; loaded into the
    memory-address register.

    +     - *Logical address space*: The set of all logocal addresses generated by
    a program

    +       *Physical address space*: the set of all physical addresses corresponding
    to these logical addresses.

    +   - Logical and physical addresses are the same in compile-time and load-time
    address-binding schemes.

    +   - logical (virtual) and physical addresses differ in execution-time address-binding
    scheme.'
  - '[PAGE 519]


    # Memory-Management Unit (MMU)


    +   - Hardware device that maps virtual to physical address in run-time.

    +   - In MMU scheme, the value in the **relocation register** is added to every
    address generated by a user process at the time it is sent to memory.

    +   - The user program deals with *logical* addresses; it never sees the *real*
    physical addresses.'
  - '[PAGE 520]


    # Dynamic relocation using a relocation register


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_520_0.png)'
  - '[PAGE 521]


    # * Dynamic Loading


    +   - Routine is not loaded until it is called.

    +   - Main program is loaded into memory and is executed, all routines are kept
    on disk in a relocatable load format.

    +   - When needed, the relocatable linking loader is called.

    +   - Better memory-space utilization; unused routine is never loaded.

    +   - Useful when large amounts of code are needed to handle infrequently occurring
    cases, such as error routines.

    +   - No special support from the operating system is required, implemented through
    program design.'
  - '[PAGE 522]


    # * Dynamic Linking


    +   - Linking postponed until execution time.

    +   - A *stub* is included in the image for each library-routine reference.

    +   - *stub*, Small piece of code, used to locate the appropriate memory-resident
    library routine or how to load the library if the routine is not already present.

    +   - When executed, the *stub* replaces itself with the address of the routine,
    and executes the routine.

    +   - Dynamic linking generally requires help from the operating system (Operating
    system needed to check if routine is in processes’ memory address).

    +   - Dynamic linking is particularly useful for libraries.

    +     - A library may be replaced by a new version, and all programs that reference
    the library will automatically use the new version.

    +   - shared libraries'
  - '[PAGE 523]


    # 8.2 Swapping


    +   - A process can be *swapped* temporarily out of memory to a *backing store*,
    and then brought back into memory for continued execution.

    +   - **Backing store** – fast disk large enough to accommodate copies of all
    memory images for all users; must provide direct access to these memory images.

    +   - *Roll out, roll in* – swapping variant used for priority-based scheduling
    algorithms; lower-priority process is swapped out so higher-priority process can
    be loaded and executed.

    +   - *ready queue* — Consists of all processes whose memory images are on the
    backing store or in memory and are ready to run.

    +   - **Dispatcher** is called whenever the CPU scheduler decides to execute a
    process.'
