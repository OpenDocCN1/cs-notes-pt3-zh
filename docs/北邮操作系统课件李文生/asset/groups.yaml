  - '[PAGE 587]


    # Supplement:


    # Memory Management Requirements (2/5)


    # ■ Protection


    +   - Processes should not be able to reference memory locations in another process
    without permission

    +   - Must be checked during execution

    +     - Impossible to check absolute addresses in programs since the program could
    be relocated

    +     - Operating system cannot anticipate(预测) all of the memory references a
    program will make'
  - '[PAGE 588]


    # Supplement:


    # Memory Management Requirements (3/5)


    # ▪ Sharing


    +   - Allow several processes to access the same portion of memory

    +   - Better to allow each process (person) access to the same copy of the program
    rather than have their own separate copy'
  - '[PAGE 589]


    # Supplement:

    Memory Management Requirements (4/5)


    # Logical Organization


    +   - Programs are written in modules

    +   - Modules can be written and compiled independently

    +   - Different degrees of protection given to modules (read-only, execute-only)

    +   - Share modules'
  - '[PAGE 590]


    # Supplement:

    Memory Management Requirements (5/5)


    # Physical Organization


    +   - Memory available for a program plus its data may be insufficient

    +     - Overlaying allows various modules to be assigned the same region of memory

    +   - Programmer does not know how much space will be available'
  - '[PAGE 591]


    # Supplement: Overlays


    +   - Keep in memory only those instructions and data that are needed at any given
    time.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_591_0.png)'
  - '[PAGE 592]


    # Supplement: **Overlays (Cont.)**


    +   - Needed when process is larger than amount of memory allocated to it.

    +   - Implemented by user, no special support needed from operating system, programming
    design of overlay structure is complex

    +     - This task can be a major undertaking, requiring complete knowledge of
    the structure of the program, its code, and its data structures.

    +   - Currently limited to microcomputer and other systems that have limited amounts
    of physical memory and that lack hardware support for more advanced techniques.'
  - '[PAGE 593]


    # Supplement: 覆盖与交换技术


    +   - 多道程序设计环境下用来扩充内存的两种方法

    +   - 覆盖技术

    +     - 当用户程序所需要的内存空间比分配给它使用的内存空间大时，可以使用覆盖技术。

    +     - 由程序员实现，不需要操作系统特别支持

    +     - 设计思想：把程序划分为若干个功能上相对独立的程序段，按照程序的逻辑结构让那些不会同时执行的程序段共享同一块内存区域。

    +     - 对程序员要求很高

    +       - 必须十分清楚程序的逻辑结构

    +       - 明确规定各程序段的执行和覆盖顺序。

    +       - 设计实现覆盖驱动模块。'
  - '[PAGE 594]


    # Supplement: 覆盖与交换技术


    +   - **交换技术**

    +     - 由操作系统中的交换程序实现，对用户透明

    +     - 将内存某区域中的进程调出内存写入外存交换区（swap out），再从外存交换区中把指定的进程调入内存（swap in）并让它执行的一种技术。达到扩充内存的效果。

    +   - **交换与覆盖的区别**

    +     - 覆盖技术要求程序员自己设计覆盖结构，而交换对用户是透明的。

    +     - 交换主要是在进程和进程之间进行，而覆盖则是在同一作业/进程内进行。'
  - '[PAGE 595]


    # 分配流程


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_595_0.png)'
  - '[PAGE 596]


    # 动态分区的回收


    +   - 用户进程执行结束后，存储管理程序要收回已经使用完毕的存储空间，并将其插入空闲分区表/链中。

    +   - 对于所释放的空闲区，在将它插入空闲分区表/链中之前，要考虑内存中与其上下相邻的存储空间的使用情况，如果有空闲分区，则要进行拼接，使之成为较大的空闲区。

    +   - 上下相邻分区状态

    +     - 上下相邻分区均为空闲分区

    +       - 更新上邻空闲区记录的长度=上邻区长度+释放区长度+下邻区长度

    +       - 从表/链中取消下邻区的记录

    +     - 上邻分区为空闲分区:

    +       - 更新上邻区记录的长度=上邻区长度+释放区长度

    +     - 下邻分区为空闲分区

    +       - 更新下邻区记录的长度=释放区长度+下邻区长度

    +       - 更新下邻区记录的起始地址=释放区的起始地址

    +     - 上下邻分区均非空闲区

    +       - 为释放区在表/链中适当的位置建立记录'
  - '[PAGE 597]


    # 补充：首次适应法


    +   - 要求空闲区按**首址递增**的次序组织空闲区表（队列）


    +   - **分配：**当进程申请大小为 S 的内存时，系统从空闲区表的第一个表目开始查询，直到首次找到等于或大于 S 的空闲区。从该区中划出大小为 S
    的分区分配给进程，余下的部分仍作为一个空闲区留在空闲区表中，但要修改其首址和大小。


    +   - **回收：**按释放区的首址，查询空闲区表，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址；否则，把释放区作为一个空闲区，将其大小和首址按照首地址大小递增的顺序插入到空闲区表的适当位置。'
  - '[PAGE 598]


    # 补充：分析


    +   - **注意：**每次分配和回收后空闲区表或空闲区队列都要按首址递增的次序排序。


    +   - **首次适应法的优点：**

    +     - 释放某一存储区时，若与空闲区相邻则合并到相邻空闲分区中去，这种情况并不改变该区在表中的位置，只要修改其大小或首址。

    +     - 这种算法是尽可能地利用低地址空间，从而保证高地址空间有较大的空闲区。'
  - '[PAGE 599]


    # 补充：最佳适应法


    +   - 要求按空闲区大小从小到大的次序组成空闲区表/队列

    +   - 分配：当进程申请一个存储区时，系统从表头开始查找，当找到第一个满足要求的空闲区时，停止查找，并且这个空闲区是最佳的空闲区。

    +   - 所谓最佳即选中的空闲区是满足要求的最小空闲区。

    +   - 回收：按释放区的首址，查询空闲区表/队列，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址，否则，把释放区作为一个空闲区插入空闲区表/队列。

    +   - 分配和回收后要对空闲区表/队列重新排序。'
  - '[PAGE 600]


    <!-- no content -->'
  - '[PAGE 601]


    # 补充：最坏适应法


    +   - 要求空闲区按**大小递减**的顺序组织空闲区表/队列

    +   - 分配：进程申请一个大小为 S 的存储区时，总是检查空闲区表的第一个空闲区的大小是否大于或等于 S。若空闲区小于 S，则分配失败；否则从空闲区中分配
    S 的存储区给用户，然后修改和调整空闲区表。

    +   - 回收：按释放区的首址，查询空闲区表/队列，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址，否则，把释放区作为一个空闲区插入空闲区表/队列。

    +   - 分配和回收后要对空闲区表/队列重新排序。'
