  mdcn: "\n\n## 11.4 分配方法\n\n- 分配方法是指为文件分配磁盘块的方式。\n- 连续分配\n- 链接分配\n- 索引分配\n\n### 磁盘空间的连续分配\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_759_0.png)\n\n| file | start | length\
    \ |\n|---|---|---:|---:|\n| count | 0 | 2 |\n| tr | 14 | 3 |\n| mail | 19 | 6\
    \ |\n| list | 28 | 4 |\n| f | 6 | 2 |\n\n### 补充：从逻辑到物理的映射\n\nLA / block size →\
    \ Q  \nR\n\n- 要访问的块 = Q + 起始地址\n- 块内位移 = R\n- 示例\n  - 对于文本文件\n  - 对于记录文件\n- 问题\n\
    \  - 难以为新文件找到空间\n  - 外部碎片\n  - 确定文件需要多少空间\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_760_0.png)\n\
    \n### 基于 Extent 的系统\n\n- 许多较新的文件系统（即 Veritas 文件系统）使用修改后的连续分配方案。\n- 最初分配一块连续的空间，然后当该空间不足时，再向初始分配添加另一块连续空间，即\
    \ extent。\n- 基于 extent 的文件系统以 extent 的形式分配磁盘块。\n- Extent 是磁盘块的连续块。Extent 用于文件分配。文件由一个或多个\
    \ extent 组成。\n\n### 链接分配\n\n- 基于单个块的分配\n- 每个文件都是磁盘块的链表：块可以分散在磁盘的任何位置。\n- 目录包含指向文件第一块和最后一块的指针。\n\
    - 每个块包含指向链中下一块的指针。\n- 没有外部碎片。\n- 任何空闲空间列表上的空闲块都可用于满足请求。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_762_0.png)\n\
    \n### 链接分配\n\n**directory**\n\n| file | start | end |\n|---|---|---|\n| jeep |\
    \ 9 | 25 |\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_763_0.png)\n\n### 链接分配（续）\n\
    \n- **缺点**\n  - 无随机访问，指针占用空间，可靠性\n- **从逻辑到物理的映射**\n  - 要访问的块是表示文件的块链表中的第 Q 个块。\n\
    \  - 块内位移 = R + ptr_space\n  - LA / (block_size - ptr_space) → Q  \n    R\n- **文件分配表（FAT）**\n\
    \  - MS-DOS 和 OS/2 使用的简单但高效的方法\n  - 包含在每个分区的开头部分。\n  - 每个块一个条目。\n  - 按块号索引。\n\
    \  - 缓存在内存中\n\n### 文件分配表\n\n**directory entry**\n\n| name | start block | no.\
    \ of disk blocks |\n|---|---|---|\n| test | 217 | ... |\n\n**FAT**\n\n| FAT |\
    \ |\n|---|---|\n| 0 | |\n| 217 | |\n| 618 | |\n| 339 | |\n| -1 | end of file |\n\
    \n### 索引分配\n\n- 将所有指针集中到 *索引块* 中。\n- 每个文件都有自己的索引块，它是一个磁盘块地址的数组。\n- 目录包含索引块的块号。\n\
    - 逻辑视图。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_766_0.png)\n\n### 索引分配示例\n\
    \n**directory**\n\n| file | index block |\n|---|---|\n| jeep | 19 |\n\nIndex block:\n\
    \n```\n9\n16\n1\n10\n25\n-1\n-1\n-1\n```\n\n### 索引分配（续）\n\n- 需要索引表\n- 随机访问\n-\
    \ 动态访问且无外部碎片，但有索引块的开销。\n- 在最大文件大小为 256K 词且块大小为 512 词的文件中从逻辑到物理的映射。我们只需要 1 个块用于索引表。\n\
    \nLA / 512 → Q  \nR\n\nQ = 索引表内的位移\n\nR = 块内的位移\n\n### 索引分配 – 映射（续）\n\n- 在文件长度无界的情况下从逻辑到物理的映射（块大小为\
    \ 512 词）。\n- 链接方案 – 链接索引表的块（大小无限制）。\n\nLA / (512 × 511) → Q₁  \nR₁\n\nQ₁ = 索引表的块\
    \  \nR₁ 按如下方式使用：\n\nR₁ / 512 → Q₂  \nR₂\n\nQ₂ = 索引表块内的位移  \nR₂ = 文件块内的位移\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_769_0.png)\n\
    \n"
