    # Timer to prevent infinite loop / process hogging resources


    +   - Set interrupt after specific period

    +   - Operating system decrements counter

    +   - When counter zero generate an interrupt

    +   - Set up before scheduling process to regain control or terminate program
    that exceeds allotted time

    +   - Instructions that modify the content of the timer are privileged.'
  - '[PAGE 50]


    # 1.6 Process Management


    +   - A process is a program in execution. a unit of work within the system. The
    entity that can be assigned to and executed on a processor

    +   - Program is a *passive entity*, process is an *active entity*.

    +   - Process needs resources to accomplish its task

    +     - CPU, memory, I/O, files, Initialization data

    +   - Process termination requires reclaim(归还) of any reusable resources

    +   - Single-threaded process has one *program counter* specifying location of
    next instruction to execute

    +     - Process executes instructions sequentially, one at a time, until completion

    +   - Multi-threaded process has one program counter per thread

    +   - Typically system has many processes, some user, some operating system running
    concurrently on one or more CPUs

    +     - Concurrency by multiplexing the CPUs among the processes / threads'
