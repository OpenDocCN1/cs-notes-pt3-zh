  md: "\n## Transition from User to Kernel Mode\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_49_0.png)\n\
    \n### Timer to prevent infinite loop / process hogging resources\n\n- Set interrupt\
    \ after specific period\n- Operating system decrements counter\n- When counter\
    \ is zero, generate an interrupt\n- Set up before scheduling process to regain\
    \ control or terminate program that exceeds allotted time\n- Instructions that\
    \ modify the content of the timer are privileged.\n\n## 1.6 Process Management\n\
    \n- A process is a program in execution, a unit of work within the system, the\
    \ entity that can be assigned to and executed on a processor.\n- Program is a\
    \ *passive entity*, process is an *active entity*.\n- Process needs resources\
    \ to accomplish its task\n  - CPU, memory, I/O, files, Initialization data\n-\
    \ Process termination requires reclaim(归还) of any reusable resources\n- Single-threaded\
    \ process has one *program counter* specifying location of next instruction to\
    \ execute\n  - Process executes instructions sequentially, one at a time, until\
    \ completion\n- Multi-threaded process has one program counter per thread\n- Typically\
    \ system has many processes, some user, some operating system running concurrently\
    \ on one or more CPUs\n  - Concurrency by multiplexing the CPUs among the processes\
    \ / threads\n\n### Process Management Activities\n\nThe OS is responsible for\
    \ the following activities in connection with process management:\n\n- Creating\
    \ and deleting both user and system processes\n- Suspending and resuming processes\n\
    - Providing mechanisms for process synchronization\n- Providing mechanisms for\
    \ process communication\n- Providing mechanisms for deadlock handling\n\n## 1.7\
    \ Memory Management\n\n- Central to the operation of a modern computer system\n\
    \  - All data in memory before and after processing\n  - All instructions in memory\
    \ in order to execute\n- The only large storage device that CPU is able to address\
    \ and access directly\n- Memory management determines what is in memory when\n\
    \  - Optimizing CPU utilization and computer response to users\n- Memory management\
    \ activities\n  - Keeping track of which parts of memory are currently being used\
    \ and by whom\n  - Deciding which processes (or parts thereof) and data to move\
    \ into and out of memory\n  - Allocating and deallocating memory space as needed\n\
    \n### Supplement: Virtual Memory\n\n- Allows programmers to address memory from\
    \ a logical point of view\n- While one process is written out to secondary store\
