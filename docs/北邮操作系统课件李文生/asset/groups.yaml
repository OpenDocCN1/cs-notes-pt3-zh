  md: "\n## File Sharing – Failure Modes\n\n- Remote file systems add new failure\
    \ modes, due to network failure, server failure\n- Recovery from failure can involve\
    \ state information about status of each remote request\n- Stateless protocols\
    \ such as NFS include all information in each request, allowing easy recovery\
    \ but less security\n\n## File Sharing – Consistency Semantics\n\nConsistency\
    \ semantics specify how multiple users are to access a shared file simultaneously\n\
    \n- Similar to Ch 6 process synchronization algorithms\n  - Tend to be less complex\
    \ due to disk I/O and network latency for remote file systems\n- Andrew File System\
    \ (AFS) implemented complex remote file sharing semantics\n- Unix file system\
    \ (UFS) implements:\n  - Writes to an open file visible immediately to other users\
    \ of the same open file\n  - Sharing file pointer to allow multiple users to read\
    \ and write concurrently\n- AFS has session semantics\n  - Writes only visible\
    \ to sessions starting after the file is closed\n\n## 10.6 Protection\n\n- **File\
    \ owner/creator should be able to control:**\n  - what can be done\n  - by whom\n\
    - **Types of access**\n  - **Read**: read from the file\n  - **Write**: write\
    \ or rewrite the file\n  - **Execute**: load the file into memory and execute\
    \ it\n  - **Append**: write new information at the end of the file\n  - **Delete**:\
    \ delete the file and free its space for possible reuse\n  - **List**: list the\
    \ name and attributes of the file\n  - Other operations, such as **renaming**,\
    \ **copying**, or **editing** the file, may also be controlled.\n\n## Access control\
    \ (1/2)\n\n- Mode of access: **read, write, execute**\n- Access-control list (ACL):\
    \ associates with each file and specifies the user name and the types of access\
    \ allowed for each user.\n- Three classes of users\n  - **Owner**: the user who\
    \ created the file.\n  - **Group**: a set of users who are sharing the file and\
    \ need similar access.\n  - **Universe (Public)**: all other users in the system.\n\
    - Access-control information\n  - User access: RWX (111 – 7)\n  - Group access:\
