    \ an *exact* duplicate to the underlying machine.\n  - **Virtual user mode** and\
    \ **virtual monitor mode** run in a physical user mode.\n  - Actions that cause\
    \ a transfer from user mode to monitor mode on a real machine must also cause\
    \ a transfer from virtual user mode to virtual monitor mode on a virtual machine.\n\
    \n## example\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_158_0.png)\n\n## VMware\
    \ Architecture\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_159_0.png)\n\n## Java\
    \ Virtual Machine\n\n- Compiled Java programs are platform-neutral bytecodes executed\
    \ by a Java Virtual Machine (JVM).\n- JVM consists of:\n  - class loader\n  -\
    \ class verifier\n  - Java interpreter that executes the architecture-neutral\
    \ bytecodes.\n- JVM automatically manages memory by performing garbage collection.\n\
    - Java interpreter may be:\n  - a software module that interprets the bytecodes\
    \ one at a time\n  - a Just-In-Time (JIT) compiler that turns the architecture-neutral\
    \ bytecodes into native machine language for the host computer.\n\n## 2.9 Operating\
    \ System Generation\n\n- Operating systems are designed to run on any of a class\
    \ of machines; the system must be configured for each specific computer site.\n\
    - SYSGEN program obtains information concerning the specific configuration of\
    \ the hardware system.\n- *Booting* – starting a computer by loading the kernel.\n\
    - *Bootstrap program* – code stored in ROM that is able to locate the kernel,\
    \ load it into memory, and start its execution.\n\n## 2.10 System Boot\n\n- Operating\
    \ system must be made available to hardware so hardware can start it.\n  - A small\
    \ piece of code – **bootstrap loader** – locates the kernel, loads it into memory,\
    \ and starts it.\n  - Sometimes a two-step process where the **boot block** at\
    \ a fixed location loads the bootstrap loader.\n  - When power is initialized\
    \ on the system, execution starts at a fixed memory location.\n    - Firmware\
    \ is used to hold initial boot code.\n\n## Linux与Windows的命令控制界面\n\n### 命令控制界面\n\
    \n- 传统的字符界面\n  - 用户在系统给出的提示符下敲入特定的命令\n  - 系统接受用户输入的命令，并执行\n  - 系统向用户报告执行结果，并等待用户输入新的命令\n\
    - 图形用户界面（GUI）\n  - 多窗口\n  - 命令被开发成用鼠标点击的菜单或者图标\n  - Linux的图形化界面：X Window\n\n##\
    \ Linux的命令控制界面\n\n- 命令位置：/usr/sbin、/usr/bin、/sbin、/bin\n- Linux命令分类\n  - 系统维护及管理：如date,\
    \ setenv等\n  - 文件操作及管理：如ls, find等\n  - 进程管理：如kill, at等\n  - 磁盘及设备管理：如df, du, mount等\n\
    \  - 用户管理：如adduser, userdel等\n  - 文档操作：如csplit, sort等\n  - 网络通信：如netstat, ifconfig等\n\
    \  - 程序开发：如cc, link等\n  - X Window管理：如startx, XF86Setup等\n- man命令：显示某命令的联机帮助\n\
    \n## Linux shell\n\n- 交互型命令解释程序、Shell程序解释系统\n- Shell程序：带形参的批命令文件\n- Shell程序的组成\n\
    \  - 命令或其他shell程序\n  - 位置参数\n  - 变量及特殊字符\n  - 表达式比较\n  - 控制流语句\n  - 函数\n"
  mdcn: "\n\n## 虚拟机（续）\n\n- 物理计算机的资源被共享以创建虚拟机。\n  - CPU 调度可以分配 CPU，营造出用户拥有自己的处理器的假象。\n\
    \  -  spooling 和文件系统可以提供虚拟卡片阅读器和虚拟行式打印机。\n  - 普通的用户分时终端充当虚拟机操作员的控制台。\n\n## 系统模型\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_155_0.png)\n\nprogramming interface\n\
    \nNonvirtual machine\n\nVirtual machine\n\n## 虚拟机优缺点 (1/2)\n\n- 虚拟机概念提供了对系统资源的完全\
    \ **保护**，因为每个虚拟机都与其他所有虚拟机隔离。然而，这种隔离不允许直接共享资源。\n- 虚拟机系统是进行操作系统研究和开发的完美 **载体**。系统开发是在虚拟机上进行的，而不是在物理机上，因此不会干扰正常的系统操作。\n\
    - 虚拟机作为解决 **系统兼容性问题** 的手段越来越受欢迎。\n\n## 虚拟机优缺点 (2/2)\n\n- 虚拟机概念 **难以实现**，因为需要付出努力来提供与底层机器\
    \ *完全* 相同的副本。\n  - **虚拟用户模式** 和 **虚拟监控模式** 在物理用户模式下运行。\n  - 在真实机器上导致从用户模式转移到监控模式的操作，在虚拟机上也必须导致从虚拟用户模式转移到虚拟监控模式。\n\
    \n## example\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_158_0.png)\n\n## VMware\
    \ 架构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_159_0.png)\n\n## Java 虚拟机\n\n\
    - 编译后的 Java 程序是平台中立的字节码，由 Java 虚拟机 (JVM) 执行。\n- JVM 由以下部分组成：\n  - 类加载器\n  - 类验证器\n\
    \  - 执行架构中立字节码的 Java 解释器。\n- JVM 通过执行垃圾回收自动管理内存。\n- Java 解释器可能是：\n  - 一个逐条解释字节码的软件模块\n\
    \  - 一个即时编译器 (JIT)，将架构中立的字节码转换为主机计算机的本地机器语言。\n\n## 2.9 操作系统生成\n\n- 操作系统设计为可在某一类机器上运行；系统必须为每个特定的计算机站点进行配置。\n\
    - SYSGEN 程序获取有关硬件系统特定配置的信息。\n- *引导* – 通过加载内核来启动计算机。\n- *引导程序* – 存储在 ROM 中的代码，能够定位内核，将其加载到内存中并启动其执行。\n\
    \n## 2.10 系统引导\n\n- 操作系统必须使硬件可用，以便硬件可以启动它。\n  - 一小段代码 – **引导加载程序** – 定位内核，将其加载到内存中并启动它。\n\
    \  - 有时是一个两步过程，其中固定位置的 **引导块** 加载引导加载程序。\n  - 当系统通电初始化时，执行从固定内存位置开始。\n    - 固件用于保存初始引导代码。\n\
    \n## Linux与Windows的命令控制界面\n\n### 命令控制界面\n\n- 传统的字符界面\n  - 用户在系统给出的提示符下敲入特定的命令\n\
    \  - 系统接受用户输入的命令，并执行\n  - 系统向用户报告执行结果，并等待用户输入新的命令\n- 图形用户界面（GUI）\n  - 多窗口\n  -\
    \ 命令被开发成用鼠标点击的菜单或者图标\n  - Linux的图形化界面：X Window\n\n## Linux的命令控制界面\n\n- 命令位置：/usr/sbin、/usr/bin、/sbin、/bin\n\
    - Linux命令分类\n  - 系统维护及管理：如date, setenv等\n  - 文件操作及管理：如ls, find等\n  - 进程管理：如kill,\
    \ at等\n  - 磁盘及设备管理：如df, du, mount等\n  - 用户管理：如adduser, userdel等\n  - 文档操作：如csplit,\
    \ sort等\n  - 网络通信：如netstat, ifconfig等\n  - 程序开发：如cc, link等\n  - X Window管理：如startx,\
    \ XF86Setup等\n- man命令：显示某命令的联机帮助\n\n## Linux shell\n\n- 交互型命令解释程序、Shell程序解释系统\n\
