  - '[PAGE 489]


    # Several Instances of a Resource Type


    # Several time-varying data structures used


    +   - **Available**: A vector of length *m* indicates the number of available
    resources of each type.

    +   - **Allocation**: An *n* × *m* matrix defines the number of resources of each
    type currently allocated to each process.

    +   - **Request**: An *n* × *m* matrix indicates the current request of each process.
    If *Request* [*i,j*] = *k*, then process *P_i* is requesting *k* more instances
    of resource type *R_j*.


    Rows in *Allocation* and *Request* can be treated as vectors, and referred to
    as *Allocation_i* and *Request_i* respectively'
  - "[PAGE 490]\n\n# Detection Algorithm\n\n+   1. Let *Work* and *Finish* be vectors\
    \ of length *m* and *n*, respectively. Initialize:\n+      (a) *Work* = *Available*\n\
    +      (b) For *i* = 1,2, ..., *n*, if *Allocation*ᵢ ≠ 0, then *Finish*[i] = false;\
    \ otherwise, *Finish*[i] = true.\n+   2. Find an index *i* such that both:\n+\
    \      (a) *Finish*[i] == false      (b) *Request*ᵢ ≤ *Work*\n+      If no such\
    \ *i* exists, go to step 4.\n+   3. *Work* = *Work* + *Allocation*ᵢ    *Finish*[i]\
    \ = true\n+      go to step 2.\n+   4. If *Finish*[i] == false, for some *i*,\
    \ 1 ≤ *i* ≤ *n*, then the system is in a deadlock state.\n+      Moreover, if\
    \ *Finish*[i] == false, then *P*ᵢ is deadlocked.\n+   \n+   This algorithm requires\
    \ an order of O(*m* × *n*²) operations to detect whether the system is in a deadlocked\
    \ state."
