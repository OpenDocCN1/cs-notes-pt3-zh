    \  @echo off\n  Type %1\\*.txt\n  Echo type ok!\n\nExample3.bat\n@echo off\nMk\
    \ dir bate xample\nCall exam1.bat test\nCall exam2.bat test\nEcho call ok!\npause\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_172_0.png)\n\n## 第3章 进程\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_173_0.png)\n\
    \n教学时长：4小时\n\n## 重点：\n\n- 进程概念\n- 进程操作\n- 协作进程\n- 进程间通信\n\n## 本章目标\n\n- 介绍进程的概念——一个正在执行的程序，它构成了所有计算机的基础\n\
    - 描述进程的各种特性，包括\n  - 调度\n  - 创建和终止\n  - 通信\n- 描述客户机-服务器系统中的通信\n\n## 3.1 进程概念\n\n\
    - 操作系统执行各种程序：\n  - 批处理系统——作业\n  - 分时系统——用户程序或任务\n- 术语 *作业* 和 *进程*\n- 进程——一个正在执行的程序；进程执行必须以顺序方式进行。\n\
    - 进程包括：\n  - 程序代码，称为文本段\n  - 数据段，包含全局变量。\n  - 当前活动，由程序计数器的值和处理器寄存器的内容表示。\n  -\
    \ 进程栈，包含临时数据。\n\n## 内存中的进程\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_177_0.png)\n\
    \n## 补充：\n\n典型进程实现\n\n主存\n\n处理器寄存器\n\n进程列表\n\ni\n\nj\n\n进程A\n\n上下文\n\n数据\n\n代码\n\
    \n进程B\n\nb\nh\n\n上下文\n\n数据\n\n代码\n\n进程索引\ni\n\nPC\n\n基址\n限长\nb\nh\n\n其他寄存器\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_179_0.png)\n\n## 进程状态\n\n- 随着进程的执行，它会改变*状态*\n\
    \  - **新建**：进程正在被创建。\n  - **运行**：正在执行指令。\n  - **等待**：进程正在等待某个事件发生。\n  - **就绪**：进程正在等待被分配给处理器。\n\
    \  - **终止**：进程已完成执行。\n- 这些状态名称是任意的，在不同的操作系统中会有所不同。\n- 在任何时候，任何一个处理器上只能有一个进程在运行，尽管许多进程可能处于*就绪*和*等待*状态。\n\
    \n## 进程状态图\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_181_0.png)\n\n## 进程控制块（PCB）\n\
    \n- PCB 也称为*任务控制块*\n- PCB 包含与每个进程关联的多项信息。\n\n| 指针 | 进程状态 |\n|---|---|\n| 进程号 |\
    \ |\n| 程序计数器 | |\n| CPU寄存器 | |\n| 内存限制 | |\n| 打开文件列表 | |\n| : | |\n\n## PCB（1/5）\n\
    \n■ 进程标识\n\n— 标识符：可以与进程控制块一起存储的数字标识符包括：\n\n- 本进程的标识符\n- 创建此进程的进程（父进程）的标识符\n- 用户标识符\n\
    \n■ 处理器状态信息\n\n## — 用户可见寄存器\n\n• 用户可见寄存器是可以通过处理器执行的机器语言引用的寄存器。通常有 8 到 32 个这样的寄存器，尽管一些\
    \ RISC（精简指令集计算机）实现有超过 100 个。\n\n"
