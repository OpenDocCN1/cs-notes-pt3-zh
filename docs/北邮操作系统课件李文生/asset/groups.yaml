  - '[PAGE 470]


    # Deadlock Prevention (Cont.)


    +   No Preemption – two alternations


    +   Waiting with no resources


    +   - If a process that is holding some resources requests another resource that
    cannot be immediately allocated to it, then all resources currently being held
    are released.

    +   - Preempted resources are added to the list of resources for which the process
    is waiting.

    +   - Process will be restarted only when it can regain its old resources, as
    well as the new ones that it is requesting.


    +   Waiting with holding resources, but resources may be preempted by other process
    requesting them.


    Often applied to resources whose state can be easily saved and restored later,
    such as CPU registers and memory space.'
