  - '[PAGE 471]


    # Deadlock Prevention (Cont.)


    +   - **Circular Wait** – impose a total ordering of all resource types, and require
    that each process requests resources in an increasing order of enumeration. Two
    alternatives:

    +     - The process can request instances of resource type Rj if and only if F(Rj)>F(Ri).
    If several instances of the same resource type are needed, a single request for
    all of them must be issued.

    +     - Whenever a process requests an instance of resource type Rj, it has released
    any resources Ri such that F(Ri)>=F(Rj)'
  - '[PAGE 472]


    # 7.5 Deadlock Avoidance


    Requires that the system has some additional *a priori* information available.


    Processes under consideration must be independent; No synchronization requirements.


    +   - Simplest and most useful model requires that each process declare the *maximum
    number* of resources of each type that it may need.

    +   - The **deadlock-avoidance algorithm** dynamically examines the resource-allocation
    state to ensure that there can never be a circular-wait condition.

    +   - **Resource-allocation state** is defined by the number of available and
    allocated resources, and the maximum demands of the processes.'
  - '[PAGE 473]


    # Two Approaches to Deadlock Avoidance


    +   - Do not start a process if its demands might lead to deadlock

    +   - Do not grant an incremental resource request to a process if this allocation
    might lead to deadlock'
  - '[PAGE 474]


    # Safe State


    +   - When a process requests an available resource, system must decide if immediate
    allocation leaves the system in a *safe state*.

    +   - System is in safe state if there exists a *safe sequence* of all processes.

    +   - Sequence <P₁, P₂, ..., Pₙ> is safe if for each Pᵢ, the resources that Pᵢ
    can still request can be satisfied by currently available resources + resources
    held by all the Pⱼ, with j<i.

    +     - If the resources that Pᵢ needs are not immediately available, then Pᵢ
    can wait until all Pⱼ have finished.

    +     - When Pⱼ is finished, Pᵢ can obtain needed resources, execute, return its
    allocated resources, and terminate.

    +     - When Pᵢ terminates, Pᵢ₊₁ can obtain its needed resources, and so on.'
  - '[PAGE 475]


    # Basic Facts


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_475_0.png)


    +   - If a system is in safe state ⇒ no deadlocks.

    +   - If a system is in unsafe state ⇒ possibility of deadlock.


    Total: 12


    Max needs current holding

    P₀ 10 5

    P₁ 4 2

    P₂ 9 3


    +   - Avoidance ⇒ ensure that a system will never enter an unsafe state.'
  - '[PAGE 476]


    # Resource-Allocation Graph Algorithm


    +   - *Claim edge* $P_i \rightarrow R_j$ indicated that process $P_j$ may request
    resource $R_j$; represented by a dashed line.

    +   - Claim edge $P_i \rightarrow R_j$ converts to request edge when process $P_i$
    requests resource $R_j$.

    +   - When a resource $R_j$ is released by process $P_i$, the assignment edge
    $R_j \rightarrow P_i$ reconverts to a claim edge $P_i \rightarrow R_j$.

    +   - Resources must be claimed *a priori* in the system.'
  - '[PAGE 477]


    <!-- no content -->'
  - '[PAGE 478]


    # Banker’s Algorithm


    +   - Applicable to a resource-allocation system with multiple instances of each
    resource type.

    +   - Each process must a priori claim maximum use of instances of each resource
    type.

    +   - When a process requests a resource it may have to wait.

    +   - When a process gets all its resources it must return them in a finite amount
    of time.'
  - '[PAGE 479]


    # Data Structures for the Banker’s Algorithm


    *n* = number of processes

    *m* = number of resources types


    +   - **Available:** Vector of length *m*. If available [*j*] = *k*, there are
    *k* instances of resource type *R_j* available.


    +   - **Max:** *n* × *m* matrix. If *Max* [*i,j*] = *k*, then process *P_i* may
    request at most *k* instances of resource type *R_j*.


    +   - **Allocation:** *n* × *m* matrix. If Allocation[*i,j*] = *k* then *P_i*
    is currently allocated *k* instances of *R_j*.


    +   - **Need:** *n* × *m* matrix. If *Need*[*i,j*] = *k*, then *P_i* may need
    *k* more instances of *R_j* to complete its task.


    *Need* [*i,j*] = *Max*[*i,j*] − *Allocation* [*i,j*]'
  md: "\n## Deadlock Prevention (Cont.)\n\n- **Circular Wait** – impose a total ordering\
    \ of all resource types, and require that each process requests resources in an\
    \ increasing order of enumeration. Two alternatives:\n  - The process can request\
    \ instances of resource type Rj if and only if F(Rj)>F(Ri). If several instances\
    \ of the same resource type are needed, a single request for all of them must\
    \ be issued.\n  - Whenever a process requests an instance of resource type Rj,\
    \ it has released any resources Ri such that F(Ri)>=F(Rj)\n\n## 7.5 Deadlock Avoidance\n\
    \nRequires that the system has some additional *a priori* information available.\n\
    \nProcesses under consideration must be independent; No synchronization requirements.\n\
    \n- Simplest and most useful model requires that each process declare the *maximum\
    \ number* of resources of each type that it may need.\n- The **deadlock-avoidance\
    \ algorithm** dynamically examines the resource-allocation state to ensure that\
    \ there can never be a circular-wait condition.\n- **Resource-allocation state**\
    \ is defined by the number of available and allocated resources, and the maximum\
    \ demands of the processes.\n\n## Two Approaches to Deadlock Avoidance\n\n- Do\
    \ not start a process if its demands might lead to deadlock\n- Do not grant an\
    \ incremental resource request to a process if this allocation might lead to deadlock\n\
    \n## Safe State\n\n- When a process requests an available resource, system must\
    \ decide if immediate allocation leaves the system in a *safe state*.\n- System\
    \ is in safe state if there exists a *safe sequence* of all processes.\n- Sequence\
    \ <P₁, P₂, ..., Pₙ> is safe if for each Pᵢ, the resources that Pᵢ can still request\
    \ can be satisfied by currently available resources + resources held by all the\
    \ Pⱼ, with j<i.\n  - If the resources that Pᵢ needs are not immediately available,\
    \ then Pᵢ can wait until all Pⱼ have finished.\n  - When Pⱼ is finished, Pᵢ can\
    \ obtain needed resources, execute, return its allocated resources, and terminate.\n\
    \  - When Pᵢ terminates, Pᵢ₊₁ can obtain its needed resources, and so on.\n\n\
    ## Basic Facts\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_475_0.png)\n\n- If\
    \ a system is in safe state ⇒ no deadlocks.\n- If a system is in unsafe state\
    \ ⇒ possibility of deadlock.\n\nTotal: 12\n\nMax needs current holding\nP₀ 10\
    \ 5\nP₁ 4 2\nP₂ 9 3\n\n- Avoidance ⇒ ensure that a system will never enter an\
    \ unsafe state.\n\n## Resource-Allocation Graph Algorithm\n\n- *Claim edge* $P_i\
    \ \\rightarrow R_j$ indicated that process $P_j$ may request resource $R_j$; represented\
    \ by a dashed line.\n- Claim edge $P_i \\rightarrow R_j$ converts to request edge\
    \ when process $P_i$ requests resource $R_j$.\n- When a resource $R_j$ is released\
    \ by process $P_i$, the assignment edge $R_j \\rightarrow P_i$ reconverts to a\
    \ claim edge $P_i \\rightarrow R_j$.\n- Resources must be claimed *a priori* in\
    \ the system.\n\n## Banker’s Algorithm\n\n- Applicable to a resource-allocation\
    \ system with multiple instances of each resource type.\n- Each process must a\
    \ priori claim maximum use of instances of each resource type.\n- When a process\
    \ requests a resource it may have to wait.\n- When a process gets all its resources\
    \ it must return them in a finite amount of time.\n\n## Data Structures for the\
    \ Banker’s Algorithm\n\n*n* = number of processes\n*m* = number of resources types\n\
    \n- **Available:** Vector of length *m*. If available [*j*] = *k*, there are *k*\
    \ instances of resource type *R_j* available.\n\n- **Max:** *n* × *m* matrix.\
    \ If *Max* [*i,j*] = *k*, then process *P_i* may request at most *k* instances\
    \ of resource type *R_j*.\n\n- **Allocation:** *n* × *m* matrix. If Allocation[*i,j*]\
    \ = *k* then *P_i* is currently allocated *k* instances of *R_j*.\n\n- **Need:**\
    \ *n* × *m* matrix. If *Need*[*i,j*] = *k*, then *P_i* may need *k* more instances\
    \ of *R_j* to complete its task.\n\n*Need* [*i,j*] = *Max*[*i,j*] − *Allocation*\
    \ [*i,j*]\n"
  mdcn: "\n\n## 死锁预防（续）\n\n- **循环等待** – 对所有资源类型施加一个总序，并要求每个进程按枚举的递增顺序请求资源。有两种替代方案：\n\
    \  - 进程只能在 F(Rj)>F(Ri) 时请求资源类型 Rj 的实例。如果需要同一资源类型的多个实例，必须一次性发出请求。\n  - 每当进程请求资源类型\
    \ Rj 的实例时，它已释放所有满足 F(Ri)>=F(Rj) 的资源 Ri\n\n## 7.5 死锁避免\n\n要求系统具有一些额外的 *先验* 信息可用。\n\
    \n所考虑的进程必须相互独立；没有同步要求。\n\n- 最简单且最有用的模型要求每个进程声明其可能需要的每种资源类型的 *最大数量*。\n- **死锁避免算法**\
    \ 动态检查资源分配状态，以确保永远不会出现循环等待条件。\n- **资源分配状态** 由可用资源和已分配资源的数量以及进程的最大需求定义。\n\n## 死锁避免的两种方法\n\
    \n- 如果进程的需求可能导致死锁，则不启动该进程\n- 如果分配增量资源请求可能导致死锁，则不授予进程的请求\n\n## 安全状态\n\n- 当进程请求可用资源时，系统必须决定立即分配是否使系统处于\
    \ *安全状态*。\n- 系统处于安全状态，如果存在所有进程的 *安全序列*。\n- 序列 <P₁, P₂, ..., Pₙ> 是安全的，如果对于每个 Pᵢ，Pᵢ\
    \ 仍可请求资源可由当前可用资源 + 所有 Pⱼ 拥有的资源满足，其中 j<i。\n  - 如果 Pᵢ 需要的资源不能立即获得，则 Pᵢ 可以等待所有 Pⱼ\
    \ 完成。\n  - 当 Pⱼ 完成时，Pᵢ 可以获得所需资源，执行，归还其分配的资源并终止。\n  - 当 Pᵢ 终止时，Pᵢ₊₁ 可以获得其所需资源，依此类推。\n\
    \n## 基本事实\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_475_0.png)\n\n- 如果系统处于安全状态\
    \ ⇒ 不会发生死锁。\n- 如果系统处于不安全状态 ⇒ 可能发生死锁。\n\n总计：12\n\n最大需求 当前持有\nP₀ 10 5\nP₁ 4 2\n\
    P₂ 9 3\n\n- 避免 ⇒ 确保系统永远不会进入不安全状态。\n\n## 资源分配图算法\n\n- *声明边* $P_i \\rightarrow R_j$\
    \ 表示进程 $P_j$ 可能请求资源 $R_j$；用虚线表示。\n- 声明边 $P_i \\rightarrow R_j$ 在进程 $P_i$ 请求资源\
    \ $R_j$ 时转换为请求边。\n- 当资源 $R_j$ 被进程 $P_i$ 释放时，分配边 $R_j \\rightarrow P_i$ 重新转换为声明边\
    \ $P_i \\rightarrow R_j$。\n- 资源必须在系统中 *先验* 声明。\n\n## 银行家算法\n\n- 适用于每种资源类型有多个实例的资源分配系统。\n\
    - 每个进程必须先验声明每种资源类型的最大使用实例数。\n- 当进程请求资源时可能需要等待。\n- 当进程获得所有资源时，必须在有限时间内归还它们。\n\n\
    ## 银行家算法的数据结构\n\n*n* = 进程数\n*m* = 资源类型数\n\n- **Available:** 长度为 *m* 的向量。如果 available\
    \ [*j*] = *k*，则有 *k* 个资源类型 *R_j* 的实例可用。\n\n- **Max:** *n* × *m* 矩阵。如果 *Max* [*i,j*]\
    \ = *k*，则进程 *P_i* 最多可请求 *k* 个资源类型 *R_j* 的实例。\n\n- **Allocation:** *n* × *m* 矩阵。如果\
    \ Allocation[*i,j*] = *k* 则 *P_i* 当前被分配了 *k* 个 *R_j* 的实例。\n\n- **Need:** *n* ×\
    \ *m* 矩阵。如果 *Need*[*i,j*] = *k*，则 *P_i* 为完成其任务可能还需要 *k* 个 *R_j* 的实例。\n\n*Need*\
    \ [*i,j*] = *Max*[*i,j*] − *Allocation* [*i,j*]\n\n"
