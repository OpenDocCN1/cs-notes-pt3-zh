    +   - **User-level threads may be either bound or unbound.**

    +     - A bound ULT is permanently attached to an LWP

    +     - An unbound thread is not permanently attached to any LWP. (default)


    +   - **data structures used**

    +     - A ULT contains a thread ID, register set (including a program counter
    and stack pointer), stack, and priority.

    +     - A LWP has a register set for the user-level thread it is running, as well
    as memory and accounting information.

    +     - A kernel thread has only a small data structure and a stack. The data
    structure includes a copy of the kernel registers, a pointer to the LWP to which
    it is attached, and a priority and scheduling information.'
