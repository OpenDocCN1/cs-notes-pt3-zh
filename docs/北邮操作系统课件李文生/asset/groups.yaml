  mdcn: "\n\n## 文件系统管理\n\n- 文件通常组织在目录中\n- 大多数系统上都有访问控制来确定谁可以访问什么\n- 操作系统的活动包括\n  -\
    \ 创建和删除文件和目录\n  - 操作文件和目录的原语（原语）\n  - 将文件映射到二级存储\n  - 将文件备份到稳定（非易失性）存储介质上\n\n\
    ## 大容量存储管理\n\n- 通常磁盘用于存储不适合主内存的数据或必须保存“较长时间”的数据。\n- 适当的<|message|> 管理至关重要\n- 整个计算机运行速度取决于磁盘子系统及其算法\n\
    - 操作系统活动\n  - 空闲空间管理\n  - 存储分配\n  - 磁盘调度\n- 某些存储不需要很快\n  - 三级存储包括光学存储、磁带\n  -\
    \ 仍需管理\n  - 在 WORM（一次写入，多次读取）和 RW（读写）之间变化\n\n### 磁盘缓存\n\n- 主内存的一部分用作缓冲区，暂时保存磁盘的数据\n\
    - 磁盘写入是簇（簇）\n- 一些写入的数据可能会再次被引用。数据是从软件缓存中快速检索，而不是缓慢地从磁盘检索\n\n### 缓存内存（高速缓存）\n\n\
    - 对操作系统不可见\n- 增加内存速度\n- 处理器速度快于内存速度\n\n### 一致性和相干性\n\n- 相同的数据可能出现在存储系统的不同层级中。\n\
    - 从磁盘到寄存器的 A 的迁移\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_62_0.png)\n\n- 计算环境\n\
    \  - 仅一个进程一次执行\n  - 多任务环境\n  - 多处理器环境 — 缓存相干性\n  - 分布式环境\n\n### 补充：缓存内存\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_63_0.png)\n\
    \n- 包含主内存的一部分\n- 处理器首先检查缓存\n- 如果在缓存中未找到，则包含所需信息的内存块会被移动到缓存中\n\n### 补充：缓存/主内存结构\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_64_0.png)\n\n### 补充：**缓存设计**\n\n- **缓存大小**\n\
    \  - 小缓存对性能有显著影响\n- **块大小**\n  - 缓存与主内存之间交换数据的单位\n  - 命中意味着信息在缓存中找到\n  - 块大小越大命中次数越多，直到使用新获取数据的概率小于重用已移出缓存的数据的概率\n\
    \n### 补充：缓存设计（续）\n\n- **映射函数**\n  - 确定块将占据的缓存位置\n- **替换算法**\n  - 确定要替换哪个块\n  -\
    \ 最近最少使用（LRU）算法\n- **写策略：内存写操作发生的时间**\n  - 可以在每次块更新时发生\n  - 仅在块被替换时发生\n    - 最小化内存操作\n\
    \    - 使内存处于过时（陈旧的）状态\n\n## I/O 子系统\n\n- 操作系统的一个目的是隐藏硬件设备的特殊性（特性）对用户\n- I/O 子系统负责\n\
    \  - I/O 的内存管理，包括\n    - **缓冲**（在数据传输时临时存储数据），\n    - **缓存**（为性能将数据部分存储在更快的存储中），\n\
    \    - ** spooling **（将一个作业的输出与另一个作业的输入重叠）\n  - 通用设备驱动程序接口\n  - 特定硬件设备的驱动程序\n\n\
    ## 1.9 保护和安全\n\n- **保护** – 操作系统定义的任何用于控制进程或用户对资源访问的机制\n- **安全** – 系统抵御内部和外部攻击的防御\n\
    \  - 范围巨大，包括拒绝服务、蠕虫、病毒、身份盗窃、服务盗窃\n- **访问控制**\n  - 规范用户对系统的访问\n- **信息流控制**\n  -\
    \ 规范系统内数据的流动及其向用户的交付\n- **认证**\n  - 证明访问和流控制按照规范执行\n\n"
