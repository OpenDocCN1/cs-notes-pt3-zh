  mdcn: "\n\n## 从用户模式到内核模式的转换\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_49_0.png)\n\
    \n### 防止无限循环 / 进程占用资源的计时器\n\n- 在特定周期后设置中断\n- 操作系统递减计数器\n- 当计数器为零时，产生中断\n- 在调度进程之前设置，以便重新获得控制权或终止超出分配时间的程序\n\
    - 修改计时器内容的指令是特权的。\n\n## 1.6 进程管理\n\n- 进程是正在执行的程序，是系统中的工作单元，是可以分配给处理器并在其上执行的实体。\n\
    - 程序是*被动实体*，进程是*主动实体*。\n- 进程需要资源来完成其任务\n  - CPU、内存、I/O、文件、初始化数据\n- 进程终止需要收回(归还)任何可重用的资源\n\
    - 单线程进程有一个*程序计数器*，指定要执行的下一条指令的位置\n  - 进程按顺序执行指令，一次一条，直到完成\n- 多线程进程每个线程有一个程序计数器\n\
    - 通常系统有许多进程，一些是用户进程，一些是操作系统进程，在一个或多个 CPU 上并发运行\n  - 通过在进程/线程之间复用 CPU 实现并发\n\n\
    ### 进程管理活动\n\n操作系统负责与进程管理相关的以下活动：\n\n- 创建和删除用户和系统进程\n- 挂起和恢复进程\n- 提供进程同步机制\n-\
    \ 提供进程通信机制\n- 提供死锁处理机制\n\n## 1.7 内存管理\n\n- 现代计算机系统运行的核心\n  - 所有数据在处理前后的内存中\n \
    \ - 所有指令在内存中以便执行\n- CPU 能够寻址和直接访问的唯一大容量存储设备\n- 内存管理决定何时在内存中有什么\n  - 优化 CPU 利用率和计算机对用户的响应\n\
    - 内存管理活动\n  - 跟踪内存的哪些部分当前正在被使用以及被谁使用\n  - 决定将哪些进程（或其部分）和数据移入和移出内存\n  - 根据需要分配和释放内存空间\n\
    \n### 补充：虚拟内存\n\n- 允许程序员从逻辑角度寻址内存\n- 当一个进程被写出到二级存储而后继进程被读入时，没有间隙（裂缝）\n\n### 补充：分页\n\
    \n- 允许进程由多个固定大小的块组成，称为页\n- 虚拟地址是一个页号和页内的偏移量\n- 每个页可以位于主内存中的任何位置\n- 主内存中的实际地址或物理地址\n\
    - 地址映射\n\n### 补充：虚拟内存概念\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_55_0.png)\n\
