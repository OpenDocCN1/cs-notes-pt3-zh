  - '[PAGE 132]


    # System Programs (Cont.)


    # Status information


    +   - Some ask the system for info - date, time, amount of available memory, disk
    space, number of users

    +   - Others provide detailed performance, logging, and debugging information

    +   - Typically, these programs format and print the output to the terminal or
    other output devices

    +   - Some systems implement a registry - used to store and retrieve configuration
    information


    # File modification


    +   - Text editors to create and modify files

    +   - Special commands to search contents of files or perform transformations
    of the text'
  - '[PAGE 133]


    # System Programs (Cont.)


    +   - **Programming-language support** - Compilers, assemblers, debuggers and
    interpreters sometimes provided


    +   - **Program loading and execution** - Absolute loaders, relocatable loaders,
    linkage editors, and overlay-loaders, debugging systems for higher-level and machine
    language


    +   - **Communications** - Provide the mechanism for creating virtual connections
    among processes, users, and computer systems

    +     - Allow users to send messages to one another’s screens, browse web pages,
    send electronic-mail messages, log in remotely, transfer files from one machine
    to another'
  - '[PAGE 134]


    # 2.6 OS Design and Implementation


    +   - Design and Implementation of OS not “solvable”, but some approaches have
    proven successful

    +   - Internal structure of different Operating Systems can vary widely

    +   - Start by defining goals and specifications

    +   - Affected by choice of hardware, type of system

    +   - *User* goals and *System* goals

    +     - **User goals** – operating system should be convenient to use, easy to
    learn, reliable, safe, and fast

    +     - **System goals** – operating system should be easy to design, implement,
    and maintain, as well as flexible, reliable, error-free, and efficient'
  - '[PAGE 135]


    # OS Design and Implementation (Cont.)


    +   - Important principle to separate **Policy** from **Mechanism**

    +     - **Policy**: What will be done?

    +     - **Mechanism**: How to do it?


    +   - Mechanisms determine how to do something, policies decide what will be done

    +     - The separation of policy from mechanism is a very important principle,
    it allows maximum flexibility if policy decisions are to be changed later'
  - '[PAGE 136]


