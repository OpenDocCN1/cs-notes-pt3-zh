  mdcn: "\n\n## 两级目录\n\n- 主目录和每个用户的目录各一个，主目录包含每个用户的条目，提供地址和访问控制信息\n- 每个用户目录是该用户的文件的简单列表\n\
    - 为每个用户创建单独的目录。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_715_0.png)\n\n- 不同用户可能有同名文件\n\
    - 高效搜索\n- 路径名\n- 无分组能力\n\n## 树形结构目录 (1/3)\n\n- 主目录下有用户目录\n- 每个用户目录的条目可以有子目录和文件\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_716_0.png)\n\n## 树形结构目录 (2/3)\n\n-\
    \ 高效搜索\n- 方便命名\n- 分组能力\n- 当前目录（工作目录）\n  - cd /spell/mail/prog\n  - type list\n\
    - 绝对或相对路径名\n- 在当前目录中创建新文件。\n- 删除文件\n  - rm <file-name>\n\n## 树形结构目录 (3/3)\n\n\
    在当前目录中创建新的子目录。\n\nmkdir <dir-name>\n\n示例：如果在当前目录 /mail\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_718_0.png)\n\
    \nmkdir count\n\n删除子目录\n- 删除空目录。\n- 删除其包含的所有文件和子目录。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_718_1.png)\n\
    \n## 无环图目录 (1/2)\n\n- 具有共享的子目录和文件。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_719_0.png)\n\
    \n## 通用图目录\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_721_0.png)\n\n## 我们如何保证没有环？\n\
    \n- 仅允许链接到文件而不是子目录。\n- 垃圾回收。\n- 每次添加新链接时使用循环检测算法来确定是否可以。\n\n## 10.4 文件系统挂载\n\n\
    - 文件系统必须先**挂载**才能被访问。\n- **挂载过程**\n  - 操作系统被给出_设备名称_，以及在文件结构中用于附加文件系统的_位置_。\n\
    \  - 操作系统通过要求_设备驱动程序_读取设备目录并验证目录具有预期的格式来_验证_设备包含有效的文件系统。\n  - 操作系统在目录结构中_记录_文件系统已在指定的**挂载点**挂载。\n\
    \n## 示例\n\n现有\n\n未挂载分区\n\n挂载点：users\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_723_0.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_723_1.png)\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_723_2.png)\n\
    \n## 10.5 文件共享\n\n- 在多用户系统上共享文件是可取的。\n- 共享可以通过*保护*方案完成。\n- 在分布式系统中，文件可以通过网络共享。\n\
    \  - ftp\n  - DFS：分布式文件系统\n  - WWW：万维网\n- 网络文件系统（NFS）是一种常见的分布式文件共享方法。\n\n## 文件共享\
    \ – 多用户\n\n- **用户 ID** 标识用户，允许权限和保护按用户设置\n- **组 ID** 允许用户加入组，允许组访问权限\n\n## 文件共享\
    \ – 远程文件系统\n\n- 使用网络允许系统之间访问文件系统\n  - 通过 FTP 等程序手动\n  - 自动、无缝地使用分布式文件系统\n  - 半自动地通过万维网\n\
    - 客户端-服务器模型允许客户端从服务器挂载远程文件系统\n  - 服务器可以为多个客户端提供服务\n  - 客户端和客户端上的用户识别不安全或复杂\n \
    \ - NFS 是标准 UNIX 客户端-服务器文件共享协议\n  - CIFS 是标准 Windows 协议\n  - 标准操作系统文件调用被转换为远程调用\n\
    - 分布式信息系统（分布式命名服务）如 LDAP、DNS、NIS、Active Directory 实现对远程计算所需信息的统一访问\n\n"
