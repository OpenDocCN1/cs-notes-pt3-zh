  - '[PAGE 780]


    # Free-behind and read ahead


    +   - **Synchronous writes** occur in the order in which the disk subsystem receives
    them, and the writes are not buffered.

    +   - In an **asynchronous write** the data is stored in the cache and returns
    control to the caller.

    +   - Using a flag in the open system call to allow a process to request that
    writes be performed synchronously.

    +   - **Free-behind** removes a page from the buffer as soon as the next page
    is requested.

    +   - With **read-ahead**, a requested page and several subsequent pages are read
    and cached.'
