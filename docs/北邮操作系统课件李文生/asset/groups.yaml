  - '[PAGE 703]


    # File Structure


    +   - **None** - sequence of words, bytes

    +   - **Simple record structure**

    +     - Lines

    +     - Fixed length

    +     - Variable length

    +   - **Complex Structures**

    +     - Formatted document

    +     - Relocatable load file

    +   - Can simulate last two with first method by inserting appropriate control
    characters.

    +   - **Who decides?**

    +     - Operating system

    +     - Program


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_703_0.png)'
  - '[PAGE 704]


    # Internal file structure


    +   - **Logical structure**

    +     - Two types

    +       - Text file: a sequence of 8-bit bytes

    +       - Record file: a sequence of records with fixed or variable length

    +     - Logical address

    +       - Offset from the beginning of the file

    +       - Logic record no.


    +   - **Physical structure: A set of disk blocks**


    +   - **Basic I/O functions operate in terms of blocks**


    +   - **Mapping logical address to physical address**

    +     - Logical block no.

    +     - Physical disk block no.

    +     - Offset in block


    +   - **Internal fragmentation**'
  - '[PAGE 705]


    # 10.2 Access Methods


    +   - Reflect different file structures

    +   - Different ways to store and process data

    +   - Criteria for File Organization


    +   - Rapid access

    +     - Needed when accessing a single record

    +     - Not needed for batch mode


    +   - Ease of update

    +     - File on CD-ROM will not be updated, so this is not a concern


    +   - Economy of storage

    +     - Should be minimum redundancy in the data

    +     - Redundancy can be used to speed access such as an index


    +   - Simple maintenance


    +   - Reliability


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_705_0.png)'
  - '[PAGE 706]


    # Access Methods (1/3)


    +   - Sequential Access

    +     - read next

    +     - write next

    +     - reset

    +     - rewrite, no read after last write

    +   - sequential-access file


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_706_0.png)'
  - '[PAGE 707]


    # Access Methods (2/3)


    +   - **Direct Access**

    +     - read n

    +     - write n

    +     - position to n

    +       - read next

    +       - write next

    +     - rewrite n

    +   - n = relative block number


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_707_0.png)


    simulation of sequential access on a direct-access file.


    | sequential access | implementation for direct access |

    |---|---|

    | read | `cp = 0;` |

    | read next | `read cp;`<br>`cp = cp + 1;` |

    | write next | `write cp;`<br>`cp = cp + 1;` |'
  - '[PAGE 708]


    # Other Access Methods (3/3)


    +   - Can be built on top of a direct-access method.

    +   - Usually involve the construction of an index for the file.

    +   - Two- or multiple-level index files.

    +   - Example of index and relative files.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_708_0.png)'
  - '[PAGE 709]


    # 10.3 Directory Structure


    +   - Disks are split into one or more partitions.

    +     - Each disk on a system contains at least one partition.

    +     - Some systems allow partitions to be larger than a disk to group disks
    into one logical structure.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_709_0.png)


    +   - Each partition contains information about files within it

    +     - Information such as name, location, size, and type is kept in entries
    in a directory'
  - '[PAGE 710]


    <!-- no content -->'
  - '[PAGE 711]


    # Supplement:

    Information in a Directory Entry


    +   - Name

    +   - Type

    +   - Address

    +   - Current length

    +   - Maximum length

    +   - Date last accessed (for archival)

    +   - Date last updated (for dump)

    +   - Owner ID (who pays)

    +   - Protection information'
  - '[PAGE 712]


    # Operations Performed on a Directory


    +   - Search for a file

    +   - Create a file

    +   - Delete a file

    +   - List a directory

    +   - Rename a file

    +   - Traverse the file system'
  - '[PAGE 713]


    # Supplement:

    objects of organizing Directory (Logically)


    +   - **Efficiency** – locating a file quickly.

    +   - **Naming** – convenient to users.

    +     - Two users can have same name for different files.

    +     - The same file can have several different names.

    +   - **Grouping** – logical grouping of files by properties, (e.g., all Java
    programs, all games, ...)'
  - '[PAGE 714]


