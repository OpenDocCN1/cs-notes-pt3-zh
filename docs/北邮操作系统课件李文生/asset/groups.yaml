  mdcn: "\n\n## 4.5 操作系统示例\n\n- Windows XP 线程\n- Linux 线程\n- Solaris 2 线程\n\n### Linux\
    \ 线程\n\n- Linux 将其称为 *tasks* 而不是 *threads*\n- 线程创建是通过 `clone()` 系统调用完成的\n- `clone()`\
    \ 允许子任务共享父任务（进程）的地址空间\n- 当 `clone()` 被调用时，它会传递一组标志，这些标志决定了父任务和子任务之间要共享多少\n  -\
    \ `CLONE_FS`: 文件系统信息被共享\n  - `CLONE_VM`: 相同的内存空间被共享\n  - `CLONE_SIGHAND`: 信号处理器被共享\n\
    \  - `CLONE_FILES`: 打开的文件集被共享\n- 如果未设置这些标志中的任何一个，则不共享，类似于 `fork()`\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_292_0.png)\n\
    \n## 作业（第146页）\n\n4.2 思考：4.1, 4.3\n\n- 1. 用户级线程和内核级线程之间有哪些两个区别？在什么情况下一种类型比另一种更好？\n\
    - 2. 描述内核在内核级线程之间进行上下文切换时所采取的动作。\n- 3. 创建线程时使用哪些资源？它们与创建进程时使用的资源有何不同？\n\n## 补充：多线程\n\
    \n- 操作系统支持在单个进程内执行多个线程\n- MS-DOS 支持单个线程\n- UNIX 支持多个用户进程但每个进程仅支持一个线程\n- Windows\
    \ 2000、Solaris、Linux、Mach 和 OS/2 支持多线程\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_295_0.png)\n\
    \n| 进程 | 线程 | 示例 |\n| --- | --- | --- |\n| 一个进程 | 一个线程 | **MS DOS** |\n| 多个进程\
    \ | 每个进程一个线程 | **UNIX** |\n| 一个进程 | 多个线程 | **JAVA** |\n| 多个进程 | 每个进程多个线程 | **W2K,\
    \ Linux, Solaris** |\n\n## 补充：进程和线程\n\n### 进程：\n\n- 拥有一个虚拟地址空间，其中包含进程映像\n- 受保护地访问处理器、其他进程、文件和\
    \ I/O 资源\n\n### 线程：\n\n- 一个执行状态（运行、就绪、等待等）\n- 未运行时保存线程上下文\n- 具有执行栈\n- 具有用于局部变量的一些线程静态存储\n\
    - 访问其进程的内存和资源\n  - 进程的所有线程共享这些资源\n\n## 补充：单线程和多线程进程模型\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_297_0.png)\n\
    \n## 补充：线程的好处\n\n- 创建新线程所需的时间比创建进程少\n- 终止线程所需的时间比终止进程少\n- 在同一进程内在两个线程之间切换所需的时间更少\n\
    - 由于同一进程内的线程共享内存和文件，因此它们可以在不调用内核的情况下相互通信\n\n## 补充：Windows XP 线程状态\n\n- Ready\n\
    - Standby\n- Running\n- Waiting\n- Transition\n- Terminated\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_300_0.png)\n\
    \n## 补充：Linux 进程状态\n\n- Running\n- Interruptible\n- Uninterruptible\n- Stopped\n\
    - Zombie（僵死）\n\n## 补充：Linux 进程/线程模型\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_302_0.png)\n\
    \n- 等待硬件条件，不接收任何信号\n- 等待事件完成（如 I/O 操作）、可用资源或来自另一个进程的信号\n\n## 补充：Solaris 线程\n\n\
    - 进程，包括用户的地址空间、栈和进程控制块\n- 用户级线程\n- 轻量级进程\n- 内核线程\n\n## 补充：Solaris 2 线程\n\n###\
    \ 多对多模型\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_305_0.png)\n\n- **用户级线程可以是绑定或非绑定的。**\n\
    \  - 绑定的 ULT 永久附加到一个 LWP\n  - 非绑定线程未永久附加到任何 LWP。（默认）\n- **使用的数据结构**\n  - 一个 ULT\
    \ 包含线程 ID、寄存器集（包括程序计数器和栈指针）、栈和优先级。\n  - 一个 LWP 具有其正在运行的用户级线程的寄存器集，以及内存和记账信息。\n\
    \  - 一个内核线程只有少量数据结构和一个栈。数据结构包括内核寄存器的副本、指向其附加的 LWP 的指针，以及优先级和调度信息。\n\n"
