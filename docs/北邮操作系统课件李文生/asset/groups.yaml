  mdcn: "\n\n## 5.4 多处理器调度\n\n- 当存在多个 CPU 时，CPU 调度变得更加复杂。\n- **多处理器系统的分类**\n  - 松耦合多处理器\n\
    \    - 每个处理器拥有自己的内存和 I/O 通道\n  - 紧耦合多处理\n    - 处理器共享主内存\n    - 由操作系统控制\n  - 功能专用处理器\n\
    \    - 例如 I/O 处理器\n    - 由主处理器控制\n- *同构处理器：* 在多处理器中，任何可用的处理器都可用于运行队列中的任何进程。\n\
    - *异构系统：* 只有为特定处理器指令集编译的程序才能在该处理器上运行。\n\n## 进程调度\n\n- 将进程分配给处理器\n- 在单个处理器上使用多道程序设计\n\
    - 进程的实际分派\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_359_0.png)\n\n## 将进程分配给处理器\n\
    \n- **对等架构（对称多处理）**\n  - 操作系统可在任何处理器上执行\n  - 每个处理器都是自调度的\n- **就绪队列**\n  - 每个处理器都有自己的私有就绪队列\n\
    \  - 一个公共就绪队列\n- **使用私有队列，将进程永久分配给一个处理器**\n  - 可能为每个处理器提供一个专用的短期队列\n  - 问题：一个处理器可能空闲而另一个处理器非常繁忙\n\
    - **使用公共队列，必须确保：**\n  - 两个处理器不会选择同一个进程\n  - 进程不会从队列中丢失\n\n## 处理器亲和性\n\n- **处理器亲和性(亲和力)**\n\
    \  - 一个进程对其当前运行的处理器具有亲和性\n  - 使进程在同一处理器上运行\n\n- **示例：使缓存内存失效并重新填充的高成本**\n\n- **形式**\n\
    \  - **软亲和性**\n    - 操作系统有一种策略，尝试使进程在同一处理器上运行，但不保证这样做。\n  - **硬亲和性**\n    - 操作系统提供系统调用，允许进程指定其不得迁移到其他处理器\n\
    \n## 负载均衡\n\n- 负载均衡：将工作负载均匀分布在 SMP 系统的所有处理器上\n- 仅在每个处理器拥有自己的私有就绪队列的系统上才**需要**负载均衡\n\
    - 两种方法\n  - 推迁移：一个**特定任务**定期检查每个处理器的负载，如果不平衡，则将进程从过载的处理器推向空闲或较不繁忙的处理器。\n  - 拉迁移：空闲处理器从繁忙处理器拉取一个等待任务\n\
    - 通常会抵消处理器亲和性的好处\n\n## 对称多线程（SMT）\n\n- SMP 系统通过提供多个处理器允许多个线程并发运行\n- SMT：提供多个逻辑处理器\n\
    \  Intel 处理器上的超线程技术\n- 在同一物理处理器上创建多个逻辑处理器\n  - 即使在仅有一个物理处理器的系统上，也向 OS 呈现多个逻辑处理器的视图。\n\
    \  - 每个逻辑处理器都有自己的架构状态（包括通用寄存器和机器状态寄存器）\n  - 每个逻辑处理器负责自己的中断处理\n  - 每个逻辑处理器共享其物理处理器的资源，例如缓存内存和总线\n\
    \n## 一个典型的 SMT 架构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_365_0.png)\n\n-\
    \ **SMT 是硬件提供的功能**\n  - 硬件必须为每个逻辑处理器提供架构状态的表示和中断处理\n\n## 5.5 线程调度\n\n### 线程\n\n\
    - 与进程的其余部分分开执行\n- 一个应用程序可以是一组线程，它们在同一地址空间中协作并并发执行\n- 在单独的处理器上运行的线程可带来显著的性能提升\n\
    \n### 线程调度\n\n- 本地调度 – 线程库如何决定将哪个用户级线程放到可用的 LWP 上。m:1 和 m:n 模型，进程竞争范围（PCS）\n-\
    \ 全局调度 – 内核如何决定下一个运行哪个内核线程。系统竞争范围（SCS）1:1 模型仅使用 SCS。\n\n"
