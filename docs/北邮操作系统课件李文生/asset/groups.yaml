    # Real-Time Systems


    +   - Used when there are rigid(严格的) time requirements on the operation of a processor
    or the flow of data.

    +   - Often used as a control device in a dedicated application, such as controlling
    scientific experiments, medical imaging systems, industrial control systems, and
    some display systems.

    +   - Well-defined fixed time constraints.

    +     kernel delays need to be bounded.

    +   - There are two classes of real-time systems

    +     - hard real-time system

    +     - soft real-time system.'
