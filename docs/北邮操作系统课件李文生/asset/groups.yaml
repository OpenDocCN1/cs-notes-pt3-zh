  - '[PAGE 69]


    # Protection and Security (Cont.)


    +   - Systems generally first distinguish among users, to determine who can do
    what

    +     - User identities (**user IDs**, security IDs) include name and associated
    number, one per user

    +     - User ID then associated with all files, processes of that user to determine
    access control

    +     - Group identifier (**group ID**) allows set of users to be defined and
    controls managed, then also associated with each process, file

    +     - **Privilege escalation** allows user to change to effective ID with more
    rights'
  - '[PAGE 70]


    # 1.10* Distributed Systems


    +   - Distribute the computation among several physical processors.


    +   - *Loosely coupled system -- distributed system*

    +     - each processor has its own local memory;

    +     - processors communicate with one another through various communications
    lines, such as high-speed buses or telephone lines.


    +   - Advantages of distributed systems.

    +     - Resources Sharing

    +     - Computation speed up – load sharing

    +     - Reliability

    +     - Communications'
  - '[PAGE 71]


    # Distributed Systems (Cont.)


    # Basic concept


    +   - Requires networking infrastructure.

    +   - Local area networks (LAN) or Wide area networks (WAN)

    +   - May be either client-server or peer-to-peer systems.


    # General Structure of Client-Server


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_71_0.png)'
  - '[PAGE 72]


    # Distributed Systems (Cont.)


    +   **Network Operating System**

    +   - provides file sharing across the network

    +   - provides communication scheme allowing different processes on different
    computers to exchange messages.

    +   - runs independently from other computers on the network

    +   **Distributed Operating System**

    +   - less autonomy between computers

    +   - gives the impression there is a single operating system controlling the
    network.'
