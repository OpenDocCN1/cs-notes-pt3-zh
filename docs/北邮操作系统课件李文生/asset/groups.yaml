    \n## A Typical PC Bus Structure\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_831_0.png)\n\
    \n## I/O device control\n\n- Processor gives commands and data to a controller\
    \ to accomplish an I/O transfer.\n- I/O instructions control devices\n- Devices\
    \ have addresses, used by\n  - Direct I/O instructions\n  - Memory-mapped I/O\n\
    \n## Device I/O Port Locations on PCs (partial)\n\n| I/O address range (hexadecimal)\
    \ | device |\n|---|---|\n| 000-00F | DMA controller |\n| 020-021 | interrupt controller\
    \ |\n| 040-043 | timer |\n| 200-20F | game controller |\n| 2F8-2FF | serial port\
    \ (secondary) |\n| 320-32F | hard-disk controller |\n| 378-37F | parallel port\
    \ |\n| 3D0-3DF | graphics controller |\n| 3F0-3F7 | diskette-drive controller\
    \ |\n| 3F8-3FF | serial port (primary) |\n\n## I/O port\n\n- **4 registers**\n\
    \  - Status: contains bits that can be read by the host. Idle, busy, ready, error\n\
    \  - Control: can be written by the host to start a command or to change the mode\
    \ of a device.\n  - Data-in: read by the host to get input\n  - Data-out: written\
    \ by the host to send output\n\nData registers are typically 1 to 4 bytes in size.\n\
    \nSome controllers have FIFO chips to expand the capacity of the controller beyond\
    \ the size of the data register. FIFO chips can hold several bytes of input or\
    \ output data.\n\n## Techniques for Performing I/O\n\n- **Programmed I/O**\n \
    \ - Processor is busy-waiting for the operation to complete\n- **Interrupt-driven\
