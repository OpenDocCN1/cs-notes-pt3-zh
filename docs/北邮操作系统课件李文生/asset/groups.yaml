  mdcn: "\n\n## 2.7.2 分层方法\n\n- 操作系统被划分为若干层（级别），每一层都建立在较低层之上。最底层（第 0 层）是硬件；最高层（第 N\
    \ 层）是用户界面。\n- 操作系统层是对抽象对象的实现，该抽象对象是对数据的封装，以及可以操作这些数据的操作。\n- 通过模块化，各层被选择为每一层仅使用较低层的功能（或操作）和服务。\n\
    \n### 补充：总结 — 分层系统结构\n\n- 将系统视为一系列级别\n- 每个级别执行相关的功能子集\n- 每个级别依赖于下一较低级别来执行更原始的功能\n\
    - 这将问题分解为若干更易管理的子问题\n\n## 2.7.3 微内核\n\n- 将尽可能多的内容从内核移至“*用户*”空间。\n  - 小型操作系统核心\n\
    \  - 仅包含基本的操作系统功能\n    - 地址空间\n    - 进程间通信（IPC）\n    - 基础调度\n- 传统上包含在操作系统中的许多服务现在是外部子系统\n\
    \  - 设备驱动程序\n  - 文件系统\n  - 虚拟内存管理器\n  - 窗口系统\n  - 安全服务\n\n- 微内核的主要功能是为客户端程序与在用户空间运行的各种服务之间提供通信设施。\n\
    - 通信通过消息传递在用户模块之间进行。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_147_0.png)\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_147_1.png)\n\n### 微内核组织的优点\n\n- **进程请求上的统一接口**\n\
    \  - 所有服务均通过消息传递提供\n- **可扩展性**\n  - 允许添加新服务\n- **灵活性**\n  - 添加新功能\n  - 可以减去现有功能\n\
    - **可移植性**\n  - 将系统移植到新处理器所需的更改在微内核中进行，而非在其他服务中\n- **可靠性**\n  - 模块化设计\n  - 小型微内核可以严格测试\n\
    - **分布式系统支持**\n  - 发送消息时无需知道目标机器是什么\n- **面向对象的操作系统**\n  - 组件是具有明确定义接口的对象，可以相互连接形成软件\n\
    - **弊端：**\n  - 用户空间到内核空间通信的性能开销\n\n## 2.7.4 模块\n\n- 大多数现代操作系统实现内核模块\n  - 使用面向对象的方法\n\
    \  - 每个核心组件都是独立的\n  - 每个组件通过已知接口相互通信\n  - 每个组件可根据需要在内核中加载\n- 总体上与分层类似，但灵活性更高\n\
    \n### Solaris 模块化方法\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_151_0.png)\n\n\
    ### 混合结构：Mac OS X 结构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_152_0.png)\n\n\
    | 组件 | 详情 |\n|---|---|\n| 应用程序环境和通用服务 | 图形界面 |\n| BSD | CLI、网络、文件系统、POSIX API\
    \ 的实现，包括 Pthreads |\n| Mach | 内存管理；对 RPC 和 IPC 的支持；消息传递；线程调度 |\n| 内核环境 | 用于开发设备驱动程序和动态可加载模块（内核扩展）的\
    \ I/O kit |\n\n## 2.8 虚拟机（VM）\n\n- *虚拟机*将分层方法推向逻辑的极致。它将硬件和操作系统内核视为硬件。\n- 虚拟机提供与底层裸硬件*相同*的接口。\n\
    - 操作系统创造出多个进程的幻觉，每个进程都在其自己的处理器上执行，并拥有其自己的（虚拟）内存。\n  - 通过 CPU 调度\n  - 通过虚拟内存\n\n"
