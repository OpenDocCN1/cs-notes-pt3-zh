  - "[PAGE 656]\n\n# Fixed Allocation\n\n+   - **Equal allocation** – e.g., if 100\
    \ frames and 5 processes, give each 20 pages.\n+   - **Proportional allocation**\
    \ – Allocate according to the size of process.\n+     - `s_i` size of virtual\
    \ memory for process `p_i`\n+     - `S = ∑s_i`\n+     - `m` total number of frames\n\
    +     - `a_i` allocation for process `p_i`\n+   \n+     `a_i = s_i/S × m`\n+ \
    \  - when a page fault occurs, one of the pages of that process must be replaced.\n\
    +   - **Local replacement**\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_656_0.png)"
  - '[PAGE 657]


    # Priority Allocation


    +   - Use a proportional allocation scheme using **priorities** rather than size.


    +   - If process *Pᵢ* generates a page fault,

    +     - select for replacement one of its frames. **Local replacement**

    +     - select for replacement a frame from a process with lower priority number.
    **Global replacement**'
  - '[PAGE 658]


    # Global vs. Local replacement


    # Global replacement


    +   - process selects a replacement frame from the set of all frames; one process
    can take a frame from another.

    +   - Easiest to implement, Adopted by many operating systems

    +   - Operating system keeps list of free frames

    +   - Free frame is added to resident set of process when a page fault occurs


    # Local replacement


    +   - When page fault occurs, select page from among the resident set of the process
    that suffers the fault.

    +   - When new process added, allocate number of page frames based on application
    type, program request, or other criteria


    One problem with a global replacement algorithm is that a process cannot control
    its own page-fault rate.'
  - '[PAGE 659]


    # 9.6 Thrashing


    +   - If a process does not have “enough” pages, the page-fault rate is very high.

    +   - The process spends most of its time swapping pages rather than executing
    user instructions

    +   - Swapping out a page of a process just before that page is needed

    +   - Thrashing ≡ a process is busy swapping pages in and out.

    +   - Thrashing leads to:

    +     - low CPU utilization.

    +     - operating system thinks that it needs to increase the degree of multiprogramming.

    +     - another process added to the system.'
  md: "\n## LRU Approximation Algorithms\n\n### Second-Chance (Clock) Page-Replacement\
