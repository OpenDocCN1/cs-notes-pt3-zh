  - '[PAGE 218]


    # 3.4.1 Shared-memory systems

    Producer-Consumer Problem


    +   - A common paradigm for cooperating processes: *producer* process produces
    information that is consumed by a *consumer* process.


    +   - we must have available a buffer of items that can be filled by the *producer*
    and emptied by the *consumer*.

    +     - A *producer* can produce one item while the *consumer* is consuming another
    item.

    +     - The *producer* and *consumer* must be **synchronized**.


    +   - Two types of buffer used

    +     - *unbounded-buffer* places no practical limit on the size of the buffer.

    +     - *bounded-buffer* assumes that there is a fixed buffer size.'
  - '[PAGE 219]


    # Shared-Memory Solution to Bounded-Buffer problem


    # Shared data


    ```

    #define BUFFER_SIZE 10

    Typedef struct {

    ...

    } item;

    item buffer[BUFFER_SIZE];

    int in = 0;

    int out = 0;

    ```


    +   - **in** points to the next free position in the buffer;

    +   - **out** points to the full position in the buffer.

    +   - the buffer is empty when **in==out**;

    +   - the buffer is full when **((in+1) % buffer_size)==out**.

    +   - solution is correct, but can only use **BUFFER_SIZE-1** elements'
