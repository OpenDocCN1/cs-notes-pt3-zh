  - '[PAGE 59]


    # Mass-Storage Management


    +   - Usually disk is used to store data that does not fit in main memory or data
    that must be kept for a “long” period of time.

    +   - Proper management is of central importance

    +   - Entire speed of computer operation hinges on disk subsystem and its algorithms

    +   - OS activities

    +     - Free-space management

    +     - Storage allocation

    +     - Disk scheduling

    +   - Some storage need not be fast

    +     - Tertiary storage includes optical storage, magnetic tape

    +     - Still must be managed

    +     - Varies between WORM (write-once, read-many-times) and RW (read-write)'
  - '[PAGE 60]


    <!-- no content -->'
  - '[PAGE 61]


    # # Disk Cache


    +   - A portion of main memory used as a buffer to temporarily to hold data for
    the disk

    +   - Disk writes are clustered (簇)

    +   - Some data written out may be referenced again. The data are retrieved rapidly
    from the software cache instead of slowly from disk


    # # Cache Memory（高速缓存）


    +   - Invisible to operating system

    +   - Increase the speed of memory

    +   - Processor speed is faster than memory speed'
  - '[PAGE 62]


    # Coherency and Consistency


    +   - The same data may appear in different levels of the storage system.

    +   - Migration of A From Disk to Register


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_62_0.png)


    +   - Computing environment

    +     - only one process executes at a time

    +     - multitasking environment

    +     - multiprocessor environment ---- cache coherency

    +     - distributed environment'
  - '[PAGE 63]


    # Supplement: Cache Memory


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_63_0.png)


    +   - Contains a portion of main memory

    +   - Processor first checks cache

    +   - If not found in cache, the block of memory containing the needed information
    is moved to the cache'
  - '[PAGE 64]


    # Supplement:


    # Cache/Main Memory Structure


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_64_0.png)'
  - '[PAGE 65]


    # Supplement: **Cache Design**


    +   - **Cache size**

    +     - small caches have a significant impact on performance

    +   - **Block size**

    +     - the unit of data exchanged between cache and main memory

    +     - hit means the information was found in the cache

    +     - larger block size more hits until probability of using newly fetched data
    becomes less than the probability of reusing data that has been moved out of cache'
  - '[PAGE 66]


    # Supplement: Cache Design (Cont.)


    +   - **Mapping function**

    +     - determines which cache location the block will occupy

    +   - **Replacement algorithm**

    +     - determines which block to replace

    +     - Least-Recently-Used (LRU) algorithm

    +   - **Write policy: When the memory write operation takes place**

    +     - Can occur every time block is updated

    +     - Can occur only when block is replaced

    +       - Minimizes memory operations

    +       - Leaves memory in an obsolete(陈旧的) state'
  - '[PAGE 67]


    # I/O Subsystem


    +   - One purpose of OS is to hide peculiarities(特性) of hardware devices from
    the user

    +   - I/O subsystem responsible for

    +     - Memory management of I/O, including

    +       - **buffering** (storing data temporarily while it is being transferred),

    +       - **caching** (storing parts of data in faster storage for performance),

    +       - **spooling** (the overlapping of output of one job with input of other
    jobs)

    +     - General device-driver interface

    +     - Drivers for specific hardware devices'
  - '[PAGE 68]


