  mdcn: "\n\n## 章节目标\n\n- 描述死锁，即阻止一组并发进程完成其任务的情况。\n- 提出在计算机系统中防止或避免死锁的多种不同方法。\n\n\
    ## 7.1 系统模型\n\n- **资源类型** $R_1, R_2, \\ldots, R_m$\n  - *CPUs, CPU cycles, memory\
    \ space, files, I/O devices (printers)*\n- 资源可以是物理资源或逻辑资源。\n- 每种资源类型 $R_i$ 有 $W_i$\
    \ 个实例。\n- 每个进程使用资源的方式如下：\n  - request\n  - use\n  - Release\n- 系统表记录每个资源是空闲还是已分配，如果资源已分配，则记录分配给哪个进程。\n\
    \n## 7.2 死锁特征\n\n- **互斥：** 一次只有一个进程可以使用资源。\n- **占有并等待：** 持有至少一个资源的进程正在等待获取由其他进程持有的额外资源。\n\
    - **不可剥夺：** 资源只能由持有它的进程自愿释放，在该进程完成其任务之后。\n- **循环等待：** 存在一组等待进程 {P₀, P₁, …, Pₙ}，使得\
    \ P₀ 正在等待由 P₁ 持有的资源，P₁ 正在等待由 P₂ 持有的资源，…，Pₙ₋₁ 正在等待由 Pₙ 持有的资源，且 Pₙ 正在等待由 P₀ 持有的资源。\n\
    \n如果上述四个条件同时成立，则可能出现死锁情况。\n\n## 资源分配图\n\n- 死锁可以用系统资源分配图来描述\n  - 有向图\n  - 一组顶点\
    \ *V* 和一组边 *E*。\n- *V* 被划分为两种不同类型：\n  - *P* = {P₁, P₂, …, Pₙ}，由系统中所有进程组成的集合。\n\
    \  - *R* = {R₁, R₂, …, Rₘ}，由系统中所有资源类型组成的集合。\n- *E* 被分为两种不同类型：\n  - 请求边 – 有向边 Pᵢ\
    \ → Rⱼ。进程 Pᵢ 请求了资源类型 Rⱼ 的一个实例，并且当前正在等待该资源。\n  - 分配边 – 有向边 Rⱼ → Pᵢ。资源类型 Rⱼ 的一个实例已被分配给进程\
    \ Pᵢ。\n\n## 资源分配图（续）\n\n- 进程\n- 具有 4 个实例的资源类型\n- $P_i$ requests instance of $R_j$\n\
    - $P_i$ is holding an instance of $R_j$\n\n## 资源分配图示例\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_464_0.png)\n\
    \n## 存在死锁的资源分配图\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_465_0.png)\n\n## 存在环但无死锁的资源分配图\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_466_0.png)\n\n## 基本事实\n\n- 如果图中不包含环\
    \ ⇒ 无死锁。\n- 如果图中包含环 ⇒\n  - 如果每种资源类型只有一个实例，则死锁。\n  - 如果每种资源类型有多个实例，则可能死锁。\n\n##\
    \ 7.3 处理死锁的方法\n\n- 确保系统永远不会进入死锁状态。\n  - 死锁预防\n  - 死锁避免\n- 允许系统进入死锁状态，检测到它，然后恢复。\n\
    - 忽略该问题并假装系统中从不发生死锁；被大多数操作系统采用，包括 UNIX。\n\n## 死锁预防（续）\n\n- 不可剥夺 – 两种替代方案\n\n-\
    \ 无资源等待\n\n  - 如果持有某些资源的进程请求另一个资源而该资源不能立即分配给它，则当前持有的所有资源将被释放。\n  - 被剥夺的资源将被添加到进程正在等待的资源列表中。\n\
    \  - 进程只有在能够重新获得其旧资源以及正在请求的新资源时才会被重新启动。\n\n- 持有资源等待，但资源可能被请求它们的其他进程剥夺。\n\n通常应用于状态可以轻松保存并稍后恢复的资源，例如\
    \ CPU 寄存器和内存空间。\n\n"
