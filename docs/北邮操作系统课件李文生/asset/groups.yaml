  - '[PAGE 193]


    # 3.2.2 Schedulers


    +   - Long-term scheduler (or job scheduler) – selects which processes should
    be brought into the ready queue.

    +   - Short-term scheduler (or CPU scheduler) – selects which process should be
    executed next and allocates CPU.

    +   - Primary distinction: execution frequency.

    +     - Short-term scheduler is invoked very frequently (milliseconds) ⇒ (scheduler
    must be fast).

    +     - Long-term scheduler is invoked very infrequently (seconds, minutes) ⇒
    (scheduler may be slow).

    +     - The long-term scheduler controls the degree of multiprogramming. the number
    of processes in memory.'
