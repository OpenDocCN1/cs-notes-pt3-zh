    \ is removed from the buffer.\n\n## Bounded-Buffer procedure-consumer problem\n\
    \n- Shared data\n\n```c\n#define BUFFER_SIZE 10\ntypedef struct {\n    ...\n}\
    \ item;\nitem buffer[BUFFER_SIZE];\nint in = 0;\nint out = 0;\nint counter = 0;\n\
    ```\n\n## Bounded-Buffer procedure-consumer problem\n\n```\nProducer process\n\
    \nitem nextProduced;\n\nwhile (1) {\n    while (counter == BUFFER_SIZE)\n    \
    \    ; /* do nothing */\n    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n\
    \    counter++;\n}\n```\n\n```\nConsumer process\n\nitem nextConsumed;\n\nwhile\
    \ (1) {\n    while (counter == 0)\n        ; /* do nothing */\n    nextConsumed\
    \ = buffer[out];\n    out = (out + 1) %\n    BUFFER_SIZE;\n    counter--;\n}\n\
    ```\n\n## Bounded-Buffer procedure-consumer problem\n\n- The statements\n  counter++;\n\
    \  counter--;\n  \n  must be performed *atomically*.\n\n- **Atomic operation**\
    \ means an operation that completes in its entirety without interruption.\n\n\
    ## Bounded-Buffer procedure-consumer problem\n\n- The statement “ count++ ” may\
    \ be implemented in machine language as:\n  register₁ = counter\n  register₁ =\
    \ register₁ + 1\n  counter = register₁\n\n- The statement “ count-- ” may be implemented\
    \ as:\n  register₂ = counter\n  register₂ = register₂ − 1\n  counter = register₂\n\
    \n## Race Condition\n\n▪ Assume **counter** is initially 5. One interleaving of\
    \ statements is:\n\n- producer:  $register_1 = counter$    (*$register_1 = 5$*)\
    \  \n- producer:  $register_1 = register_1 + 1$    (*$register_1 = 6$*)  \n- consumer:\
    \  $register_2 = counter$    (*$register_2 = 5$*)  \n- consumer:  $register_2\
    \ = register_2 - 1$    (*$register_2 = 4$*)  \n- producer:  $counter = register_1$\
    \    (*$counter = 6$*)  \n- consumer:  $counter = register_2$    (*$counter =\
    \ 4$*)\n\n▪ The value of **counter** may be either 4 or 6, where the correct result\
    \ should be 5.\n\n## Race Condition (Cont.)\n\n▪ **Race condition:** The situation\
    \ where several processes access and manipulate shared data concurrently. The\
    \ final value of the shared data depends upon the particular order in which the\
    \ access takes place.\n\n- ▪ **Race conditions in operating systems**\n  - The\
    \ code implementing an OS is subject to several possible race conditions.\n  \
    \  - System open-file-table\n    - Structures for maintaining memory allocation,\
    \ for maintaining process lists, and for interrupt handling\n\n▪ **To prevent\
    \ race conditions, concurrent processes must be synchronized.**\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_403_0.png)\n\
    \n## 6.2 The Critical-Section Problem\n\n- *n* processes all competing to use\
    \ some shared data\n- Each process has a code segment, called *critical section*,\
    \ in which the shared data is accessed.\n- Problem – ensure that when one process\
    \ is executing in its critical section, no other process is to be allowed to execute\
    \ in its critical section.\n- Need to design a protocol that the processes can\
    \ use to cooperate.\n  - Each process must **request** permission to enter its\
    \ critical section.\n  - The section of code implementing this request is the\
    \ **entry section**.\n  - The critical section may be followed by an **exit section**.\n\
    \  - The remaining code is the remainder section.\n"
  mdcn: "\n## 本章目标\n\n- 介绍临界区问题，该问题的解决方案可用于确保共享数据的一致性。\n- 介绍临界区问题的软件和硬件解决方案\n- 引入原子事务的概念，并描述确保原子性的机制。\n\
    \n## 目录\n\n- 6.1 背景\n- 6.2 临界区问题\n- 6.3 Peterson 解法\n- 6.4 同步硬件\n- 6.5 信号量\n-\
    \ 6.6 经典同步问题\n- 6.7 管程\n- 6.8 同步示例\n\n## 并发带来的困难\n\n- 共享全局资源\n- 资源分配管理\n- 难以定位的编程错误\n\
    \n## 示例\n\n- 对共享数据的并发访问可能导致数据不一致。\n\n- 维护数据一致性需要确保协作进程有序执行的机制。\n\n- 有界缓冲区问题的共享内存解决方案（第3章）最多允许缓冲区中同时有\
    \ $n - 1$ 个条目。一个使用所有 $N$ 个缓冲区的解决方案并不简单。\n\n- 假设我们修改生产者-消费者代码，添加一个整型变量 *counter*，初始化为\
    \ 0，每次向缓冲区添加新条目时将其递增，每次从缓冲区移除条目时将其递减。\n\n## 有界缓冲区生产者-消费者问题\n\n- 共享数据\n\n```c\n\
    #define BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\nint counter = 0;\n```\n\n## 有界缓冲区生产者-消费者问题\n\n```\n\
    Producer process\n\nitem nextProduced;\n\nwhile (1) {\n    while (counter == BUFFER_SIZE)\n\
    \        ; /* do nothing */\n    buffer[in] = nextProduced;\n    in = (in + 1)\
    \ % BUFFER_SIZE;\n    counter++;\n}\n```\n\n```\nConsumer process\n\nitem nextConsumed;\n\
    \nwhile (1) {\n    while (counter == 0)\n        ; /* do nothing */\n    nextConsumed\
    \ = buffer[out];\n    out = (out + 1) %\n    BUFFER_SIZE;\n    counter--;\n}\n\
    ```\n\n## 有界缓冲区生产者-消费者问题\n\n- 以下语句\n  counter++;\n  counter--;\n  \n  必须*原子地*执行。\n\
    \n- **原子操作**是指一次完整执行、不可中断的操作。\n\n## 有界缓冲区生产者-消费者问题\n\n- 语句“ count++ ”可以用机器语言实现为：\n\
    \  register₁ = counter\n  register₁ = register₁ + 1\n  counter = register₁\n\n\
    - 语句“ count-- ”可以实现为：\n  register₂ = counter\n  register₂ = register₂ − 1\n  counter\
    \ = register₂\n\n## 竞态条件\n\n▪ 假设 **counter** 初始为 5。语句的一种交错执行如下：\n\n- 生产者：  $register_1\
    \ = counter$   (*$register_1 = 5$*)  \n- 生产者：  $register_1 = register_1 + 1$ \
    \  (*$register_1 = 6$*)  \n- 消费者：  $register_2 = counter$   (*$register_2 = 5$*)\
    \  \n- 消费者：  $register_2 = register_2 - 1$   (*$register_2 = 4$*)  \n- 生产者：  $counter\
    \ = register_1$   (*$counter = 6$*)  \n- 消费者：  $counter = register_2$   (*$counter\
    \ = 4$*)\n\n▪ **counter** 的值可能为 4 或 6，而正确结果应为 5。\n\n## 竞态条件（续）\n\n▪ **竞态条件：**\
    \ 多个进程并发访问和操作共享数据的情况。共享数据的最终值取决于访问发生的特定顺序。\n\n- ▪ **操作系统中的竞态条件**\n  - 实现操作系统的代码会面临若干可能的竞态条件。\n\
    \    - 系统打开文件表\n    - 用于维护内存分配、维护进程列表和处理中断的结构\n\n▪ **为防止竞态条件，并发进程必须同步。**\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_403_0.png)\n\
    \n## 6.2 临界区问题\n\n- *n* 个进程竞争使用某些共享数据\n- 每个进程都有一个称为*临界区*的代码段，在该代码段中访问共享数据。\n-\
    \ 问题——确保当一个进程在其临界区中执行时，不允许任何其他进程在其临界区中执行。\n- 需要设计一种进程可以用来协作的协议。\n  - 每个进程必须**请求**进入其临界区的许可。\n\
    \  - 实现该请求的代码段称为**进入区**。\n  - 临界区之后可以跟有一个**退出区**。\n  - 其余代码是剩余区。\n\n"
