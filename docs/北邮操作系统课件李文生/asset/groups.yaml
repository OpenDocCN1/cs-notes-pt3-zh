    \  - On-line communication between the user and the system is provided;\n  - Multiple\
    \ users simultaneously access the system through terminals;\n  - when the operating\
    \ system finishes the execution of one command, it seeks the next “control statement”\
    \ not from a card reader, but rather from the user’s keyboard.\n- On-line system\
    \ must be available for users to access data and code.\n\n## OS Features\nNeeded\
    \ for time-sharing system\n\n- I/O routines supplied by the system.\n- Memory\
    \ management – the system must allocate the memory to several jobs.\n- Virtual\
    \ memory – allows the execution of job not be completely in memory.\n- Disk management\
    \ – file system must be provided, which resides on a collection of disks.\n- CPU\
    \ scheduling – mechanisms for concurrent execution, job synchronization and communication,\
    \ avoiding deadlock.\n- Allocation of resources.\n\n## Supplement:\nBatch Multiprogramming\
    \ versus Time Sharing\n\n|  | Batch Multiprogramming | Time Sharing |\n|---|---|---|\n\
    | Principal objective | Maximize processor use | Minimize response time |\n| Source\
    \ of directives to Operating System | Job control language commands provided with\
    \ the job | Commands entered at the terminal |\n\n## 1.5 Operating-System Operations\n\
    \n- Interrupt driven by hardware\n- Software error or request creates **exception**\
    \ or **trap**\n  - Division by zero, request for operating system service\n- Other\
    \ process problems include infinite loop, processes modifying each other or the\
    \ operating system\n- **Dual-mode** operation allows OS to protect itself and\
    \ other system components\n  - Provide hardware support to differentiate between\
    \ at least two modes of operations.\n    1. *User mode* – execution done on behalf\
    \ of a user.\n    2. *Monitor mode* (also *kernel mode* or *system mode*) – execution\
