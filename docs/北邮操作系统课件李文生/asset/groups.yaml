    +   - List of entries, one for each file

    +   - Sequential file with the name of the file serving as the key


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_714_0.png)


    +   - Naming problem

    +     - Files must have unique names.

    +     - The length of a file name.

    +   - Grouping problem'
