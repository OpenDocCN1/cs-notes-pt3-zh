    ## Combined Scheme: UNIX (4K bytes per block)


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_771_0.png)


    ## 11.5 Free-Space Management


    Bit map / Bit vector (n blocks)


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_772_0.png)


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_772_1.png)


    Block number calculation:

    (number of bits per word)*(number of 0-value words) + offset of first 1 bit


    ## Free-Space Management (Cont.)


    +   - Bit map requires extra space. Example:

    +     block size = 2¹² bytes

    +     disk size = 2³⁰ bytes (1 gigabyte)

    +     n = 2³⁰/2¹² = 2¹⁸ bits (or 32K bytes)

    +     40G ---- 1MB

    +     - Easy to get contiguous files space

    +   - Linked list (free list)

    +     - Cannot get contiguous space easily

    +     - No waste of space

    +   - Grouping

    +   - Counting


    ## Linked Free Space List on Disk


    free-space list head


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_774_0.png)


    ## Free-Space Management (Cont.)


    ## Grouping


    ## Counting


    Free-space list


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_775_0.png)


    | addr1 | count1 |

    |-------|--------|

    | addr2 | count2 |

    | addr3 | count3 |

    | ...   | ...    |


    ## 11.6* Efficiency and Performance


    +   - Efficiency dependent on:

    +     - disk allocation and directory algorithms

    +     - types of data kept in file’s directory entry

    +     - size of pointers used to access data


    +   - Performance

    +     - **disk cache** – separate section of main memory for frequently used blocks

    +     - **free-behind and read-ahead** – techniques to optimize sequential access

    +     - improve PC performance by dedicating section of memory as **virtual disk**,
    or RAM disk.


    ## Page Cache


    +   - A page cache caches pages rather than disk blocks using virtual memory techniques.

    +   - Memory-mapped I/O uses a page cache.

    +   - Routine I/O through the file system uses the buffer (disk) cache.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_778_0.png)


    ## Unified Buffer Cache


    A unified buffer cache uses the same page cache to cache both memory-mapped pages
    and ordinary file system I/O.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_779_0.png)


    ## Free-behind and read ahead


    +   - **Synchronous writes** occur in the order in which the disk subsystem receives
    them, and the writes are not buffered.

    +   - In an **asynchronous write** the data is stored in the cache and returns
    control to the caller.

    +   - Using a flag in the open system call to allow a process to request that
    writes be performed synchronously.

    +   - **Free-behind** removes a page from the buffer as soon as the next page
    is requested.

    +   - With **read-ahead**, a requested page and several subsequent pages are read
    and cached.


    ## Various Disk-Caching Locations


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_781_0.png)


    RAM disk: contents are controlled by user

    Disk cache: controlled by OS


    ## 11.7* Recovery


    +   - Consistency checking – compares data in directory structure with data blocks
    on disk, and tries to fix inconsistencies.

    +   - Use system programs to *back up* data from disk to another storage device
    (floppy disk, magnetic tape).

    +   - Recover lost file or disk by *restoring* data from backup.

    +   - A typical backup schedule

    +     - Day 1: full backup

    +     - Day 2: incremental backup

    +     - ...

    +     - Day N: incremental backup. Go back to Day 1.


    ## 11.8* Log Structured File Systems


    +   - **Log structured** (or journaling) file systems record each update to the
    file system as a **transaction**.

    +   - All transactions are written to a **log**. A transaction is considered **committed**
    once it is written to the log. However, the file system may not yet be updated.

    +   - The transactions in the log are asynchronously written to the file system.
    When the file system is modified, the transaction is removed from the log.

    +   - If the file system crashes, all remaining transactions in the log must still
    be performed.

    '
