    +   - 允许系统任意选择接收者。发送者会被通知接收者是谁。\n\n## 间接通信(3/3)\n\n+   - **如果邮箱由一个进程拥有**\n+  \
    \   - 所有者只能通过此邮箱接收消息\n+     - 用户只能向邮箱发送消息\n+   - **如果邮箱由操作系统拥有**\n+     - 邮箱是独立的\n\
    +     - 不附加到任何特定进程\n+   - **操作系统提供机制允许进程执行以下操作**\n+     - 创建一个新的邮箱\n+     - 通过邮箱发送和接收消息\n\
    +     - 删除一个邮箱\n\n## 缓冲\n\n附加到链接的消息队列；以三种方式之一实现。\n\n+   - **零容量** – 0 条消息  \n\
    \     发送者必须等待接收者（握手）。  \n+   - **有界容量** – *n* 条消息的有限长度  \n     如果链接已满，发送者必须等待。\
    \  \n+   - **无界容量** – 无限长度  \n     发送者永不等待。\n\n## Supplement: pipeline(管道)\n\n\
    +   - 管道是一条在进程间以字节流方式传送数据的通信通道。\n+   - 由OS核心的缓冲区（通常几十KB）来实现，是单向的；\n+   - 常用于命令行所指定的输入输出重定向和管道命令。\n\
    +   - 使用前要建立相应的管道，然后才可使用。\n+   - 管道逻辑上可以看作管道文件，物理上则是由文件系统的高\n     速缓存区构成。\n+ \
    \  - 管道分为有名管道和无名管道\n+   - 管道按先进先出（FIFO）的方式传送消息，且只能单向传\n     送消息。\n+   - 管道操作\n\
    \     - 发送进程利用文件系统的系统调用 write（fd[1], buf, size）\n       把buf中长度为size字符的消息送入管道入口fd[1];\n\
    \     - 接收进程利用文件系统的系统调用 read（fd[0], buf, size）\n       从管道出口fd[0]读出size字符的消息放入buf中。\n\
    \n## Supplement: 管道应用示例\n\n```\n```c\n#include<stdio.h>\nmain()\n{\n  int pid,fd[2];\n\
    \  char buf[30],s[30];\n  pipe(fd);\n  while((pid=fork())==-1);\n  if (pid==0)\
    \ {\n    sprintf(buf, \"this is an example\\n\");\n    write(fd[1],buf,30);\n\
    \    exit(0);\n  }\n  else {\n    wait(0);\n    read(fd[0],s,30);\n    printf(\"\
    %s\",s);\n  }\n}\n```\n```\n\n## 3.5 IPC 系统示例\n\n## C 程序说明 POSIX 共享内存 API\n\n\
    ```\n#include <stdio.h>\n#include <sys/shm.h>\n#include <sys/stat.h>\nint main()\n\
    {\n    int segment_id;                 // the id for the shared memory segment\n\
    \    char* shared_memory;            // a pointer to the shared memory segment\n\
    \    const int segment_size = 4096; // the size of the shared memory segment\n\
    \n    /** allocate a shared memory segment */\n    segment_id = shmget (IPC_PRIVATE,\
    \ segment_size, S_IRUSR | S_IWUSR);\n\n    /** attach the shared memory segment\
    \ */\n    shared_memory = (char *) shmat (segment_id, NULL, 0);\n\n    printf(\"\
    shared memory segment %d attached at address %p\\n\", segment_id, shared_memory);\n\
    }\n```\n\n```\n/** write a message to the shared memory segment */\nsprintf(shared_memory,\
    \ \"Hi there!\");\n\n// now print out the string from shared memory\nprintf(\"\
    *%s*\\n\", shared_memory);\n\n/** now detach the shared memory segment */\nif\
    \ ( shmdt(shared_memory) == -1)\n{\n    fprintf(stderr, \"Unable to detach\\n\"\
    );\n}\n\n/** now remove the shared memory segment */\nshmctl(segment_id, IPC_RMID,\
    \ NULL);\n\nreturn 0;\n}\n```\n\n## Windows XP 中的消息传递设施 -- LPC\n\n+   - LPC 在同一台机器上的两个进程之间通信。\n\
    +   - 端口对象用于在两个进程之间建立和维护连接。\n+   - 两种类型的端口：\n+     - 连接端口\n       命名对象，对所有进程可见；\n\
    \       用于设置通信通道。\n+     - 通信端口\n+   - 通信工作方式\n+     - 客户端打开对子系统连接端口对象的句柄\n+ \
    \    - 客户端发送连接请求\n+     - 服务器创建两个私有通信端口并将其中一个的句柄返回给客户端\n+     - 客户端和服务器使用相应的端口句柄发送消息或回调并监听回复\n\
    \n## 两种消息传递技术\n\n+   - 用于小消息（最多 256 字节）\n     最简单。\n     使用端口的消息队列作为中间存储并将消息从一个进程复制到另一个进程。\n\
    +   - 段对象（用于大消息）\n     设置一个共享内存区域。\n     发送一条包含段对象指针和大小信息的小消息。\n\n## 回调机制\n\n\
    +   - 可在客户端或服务器无法立即响应请求时使用。\n+   - 允许执行异步消息处理。\n\n"
