    \  - DMA 控制器直接操作内存总线，将地址置于总线上以执行传输\n- DVMA 可以在 CPU 不介入或不使用主内存的情况下在两个内存映射设备之间执行传输。\n\
    \n## 执行 DMA 传输的六步流程\n\n1. 设备驱动程序被告知将磁盘数据传输到地址 X 的缓冲区\n2. 设备驱动程序告诉磁盘控制器从磁盘传输 C\
