  - '[PAGE 650]


    # LRU Approximation Algorithms


    # Second chance


    +   - Basic algorithm: FIFO replacement algorithm

    +   - Need reference bit

    +   - Clock replacement

    +   - If page to be replaced (in clock order) has reference bit = 1. then:

    +     - set reference bit 0.

    +     - leave page in memory.

    +     - replace next page (in clock order), subject to same rules.'
  - '[PAGE 651]


    # Second-Chance (clock) Page-Replacement Algorithm


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_651_0.png)'
  - '[PAGE 652]


    # LRU Approximation Algorithms


    # Enhanced Second-Chance Algorithm


    +   - Considering both the reference bit and the modify bit as an ordered pair.

    +   - Each page is in one of four classes.


    +   - **(0,0)** neither recently used nor modified -- best page to replace

    +   - **(0,1)** not recently used but modified -- not quite good, the page will
    need to be written out before replacement.

    +   - **(1,0)** recently used but clean -- probably will be used again soon

    +   - **(1,1)** recently used and modified -- probably will be used again soon,
    and the page will be need to be written out to disk before it can be replaced.'
  - '[PAGE 653]


    # LRU Approximation Algorithms


    # Counting-based page replacement


    +   - Keep a counter of the number of references that have been made to each page.

    +   - **LFU Algorithm**: Least Frequently Used

    +     - replaces page with the smallest count.

    +   - **MFU Algorithm**: Most Frequently Used

    +     - based on the argument that the page with the smallest count was probably
    just brought in and has yet to be used.'
  - '[PAGE 654]


    # * Page-Buffering Algorithm


    +   - **Keep a pool of free frames**

    +     - When page fault occurs, the desired page is read into a free frame from
    the pool before the victim is written out.

    +     - When the victim is later written out, its frame is added to the free-frame
    pool.

    +   - **Maintain a list of modified pages**

    +     - Whenever the paging device is idle, a modified page is selected and is
    written to the disk.

    +   - **Keep a pool of free frames, but to remember which page was in each frame**

    +     - The old page can be reused directly from the free-frame pool if it is
    needed before that frame is reused.'
