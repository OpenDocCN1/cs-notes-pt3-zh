  mdcn: "\n\n## 2.5 系统程序\n\n系统程序为程序开发和执行提供了一个方便的环境。它们可以分为：\n\n- 文件管理\n- 状态信息\n- 文件修改\n\
    - 编程语言支持\n- 程序加载和执行\n- 通讯\n- 系统实用程序 / 应用程序\n\n大多数用户对操作系统的看法是由系统程序定义的，而不是实际的系统调用。\n\
    \n### 状态信息\n\n- 有些程序向系统请求信息 - 日期、时间、可用内存量、磁盘空间、用户数量\n- 其他程序提供详细的性能、日志和调试信息\n-\
    \ 通常，这些程序将输出格式化并打印到终端或其他输出设备\n- 一些系统实现注册表 - 用于存储和检索配置信息\n\n### 文件修改\n\n- 文本编辑器用于创建和修改文件\n\
    - 特殊命令用于搜索文件内容或执行文本转换\n\n### 编程语言支持\n\n- 编译器、汇编器、调试器和解释器有时会提供\n\n### 程序加载和执行\n\
    \n- 绝对装载器、可重定位装载器、链接编辑器和覆盖装载器，以及用于高级语言和机器语言的调试系统\n\n### 通讯\n\n- 提供创建进程、用户和计算机系统之间虚拟连接的机制\n\
    \  - 允许用户相互发送消息到对方屏幕、浏览网页、发送电子邮件、远程登录、从一台机器向另一台机器传输文件\n\n## 2.6 操作系统设计与实现\n\n\
    - 操作系统的设计和实现并非“可解”，但某些方法已被证明是成功的\n- 不同操作系统的内部结构可能差异很大\n- 首先通过定义目标和规范开始\n- 受硬件选择、系统类型的影响\n\
    - *用户*目标和*系统*目标\n  - **用户目标** – 操作系统应方便使用、易于学习、可靠、安全且快速\n  - **系统目标** – 操作系统应易于设计、实现和维护，同时具有灵活性、可靠性、无错误和高效性\n\
    - 重要的原则是将**策略**与**机制**分离\n  - **策略**：将做什么？\n  - **机制**：如何做？\n- 机制决定如何做某事，策略决定将做什么\n\
    \  - 将策略与机制分离是一个非常重要的原则，如果以后要更改策略决策，它允许最大程度的灵活性\n\n### 2.7.1 简单结构\n\nMS-DOS 系统结构\n\
    \n- MS-DOS – 编写时旨在在最小空间内提供最多的功能\n  - 未仔细划分为模块。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_137_0.png)\n\
    \n- 尽管 MS-DOS 有一定的结构，但其接口和功能级别并未很好地分离\n\n### UNIX 系统结构\n\n- **UNIX – 受硬件功能限制，原版\
    \ UNIX 操作系统具有有限的结构。**\n- **UNIX 操作系统由两个可分离的部分组成**\n  - 系统程序\n  - 内核，其进一步分为一系列接口和设备驱动程序。\n\
    \    - 由系统调用接口以下和物理硬件之上的所有内容组成\n    - 提供文件系统、CPU 调度、内存管理和其他操作系统功能；一个层级包含大量功能。\n\
    - **系统调用定义了 UNIX 的 API，通常可用的系统程序集定义了用户界面。**\n\n```\n(the user)\n\nshells and commands\n\
    compilers and interpreters\nsystem libraries\n\nsystem-call interface to the kernel\n\
    \nsignals terminal handling\ncharacter I/O system\nterminal drivers\n\nfile system\n\
    swapping block I/O system\nDisk and tape drivers\n\nCPU scheduling\npage replacement\n\
    demand paging\nvirtual memory\n\nkernel interface to the hardware\n\nterminal\
    \ controllers\nterminals\n\ndevice controllers\ndisks and tapes\n\nmemory controllers\n\
    physical memory\n```\n\n"
