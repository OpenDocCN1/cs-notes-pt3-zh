    ## 9.1 背景


    +   - **虚拟内存** – 用户逻辑内存与物理内存的分离。

    +     - 执行时程序只需部分在内存中。

    +     - 因此逻辑地址空间可以远大于物理地址空间。

    +     - 允许多个进程共享地址空间。

    +     - 使进程创建更高效。


    +   - 虚拟内存可以通过以下方式实现：

    +     - 按需分页

    +     - 按需分段


