    \ a frame from a process with lower priority number. **Global replacement**\n\n\
    ## Global vs. Local Replacement\n\n### Global Replacement\n\n- Process selects\
    \ a replacement frame from the set of all frames; one process can take a frame\
    \ from another.\n- Easiest to implement; adopted by many operating systems.\n\
    - Operating system keeps a list of free frames.\n- A free frame is added to the\
    \ resident set of the process when a page fault occurs.\n\n### Local Replacement\n\
    \n- When a page fault occurs, select a page from among the resident set of the\
    \ process that suffers the fault.\n- When a new process is added, allocate a number\
    \ of page frames based on application type, program request, or other criteria.\n\
    \nOne problem with a global replacement algorithm is that a process cannot control\
    \ its own page-fault rate.\n\n## 9.6 Thrashing\n\n- If a process does not have\
    \ “enough” pages, the page-fault rate is very high.\n- The process spends most\
    \ of its time swapping pages rather than executing user instructions.\n- Swapping\
    \ out a page of a process just before that page is needed.\n- Thrashing ≡ a process\
    \ is busy swapping pages in and out.\n- Thrashing leads to:\n  - low CPU utilization.\n\
    \  - operating system thinks that it needs to increase the degree of multiprogramming.\n\
    \  - another process added to the system.\n"
  mdcn: "\n\n## LRU 近似算法\n\n### 第二机会（时钟）页面置换算法\n\n- 基本算法：FIFO 置换算法\n- 需要引用位\n- 时钟置换\n\
    - 如果要置换的页面（按时钟顺序）引用位 = 1，则：\n  - 将引用位置 0。\n  - 保留页面在内存中。\n  - 置换下一个页面（按时钟顺序），受相同规则约束。\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_651_0.png)\n\n### 增强的第二机会算法\n\n- 同时考虑引用位和修改位作为有序对。\n\
    - 每个页面属于四类之一。\n  - **(0,0)** 未最近使用且未修改 — 最佳可置换页面。\n  - **(0,1)** 未最近使用但已修改 — 不太理想；置换前页面需要写出。\n\
    \  - **(1,0)** 最近使用但干净 — 可能很快会被再次使用。\n  - **(1,1)** 最近使用且已修改 — 可能很快会被再次使用，且页面在被置换前需要写回磁盘。\n\
    \n## 基于计数的页面置换\n\n- 为每个页面维护一个引用次数计数器。\n- **LFU 算法**：最少使用频率\n  - 置换计数最小的页面。\n-\
    \ **MFU 算法**：最频繁使用\n  - 基于这样的论点：计数最小的页面很可能刚刚被调入，尚未被使用。\n\n## 页面缓冲算法\n\n- **保留一个空闲帧池**\n\
    \  - 当发生缺页时，所需页面先从池中读取到一个空闲帧，再将受害者写出。\n  - 当受害者稍后被写出时，其帧被加入空闲帧池。\n- **维护一个已修改页面的列表**\n\
    \  - 每当分页设备空闲时，选择一个已修改页面并将其写入磁盘。\n- **保留空闲帧池，但记住每个帧中存放的页面**\n  - 如果在该帧被重用之前又需要旧页面，则可以从空闲帧池直接重用。\n\
    \n## 固定分配\n\n- **等量分配** – 例如，如果有 100 个帧和 5 个进程，每个分配 20 页。\n- **按比例分配** – 根据进程大小进行分配。\n\
    \  - `s_i` 进程 `p_i` 虚拟内存大小\n  - `S = ∑s_i`\n  - `m` 帧总数\n  - `a_i` 进程 `p_i` 的分配量\n\
    \  - `a_i = s_i/S × m`\n- 当发生缺页时，必须置换该进程的一个页面。\n- **局部置换**\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_656_0.png)\n\
    \n## 优先级分配\n\n- 使用基于**优先级**而非大小的按比例分配方案。\n- 如果进程 *Pᵢ* 产生缺页，\n  - 从其帧中选择一个进行置换。**局部置换**\n\
    \  - 从优先级编号较低的进程中选择一个帧进行置换。**全局置换**\n\n## 全局 vs. 局部置换\n\n### 全局置换\n\n- 进程从所有帧集合中选择置换帧；一个进程可以从另一个进程夺取帧。\n\
    - 实现最简单；被许多操作系统采用。\n- 操作系统维护一个空闲帧列表。\n- 当发生缺页时，空闲帧被加入发生缺页进程的常驻集。\n\n### 局部置换\n\
    \n- 当发生缺页时，从发生缺页的进程的常驻集中选择一个页面。\n- 当添加新进程时，根据应用类型、程序请求或其他标准分配一定数量的页帧。\n\n全局置换算法的一个问题是进程无法控制自己的缺页率。\n\
    \n## 9.6 抖动\n\n- 如果进程没有“足够”的页面，缺页率会非常高。\n- 进程花费大部分时间在交换页面，而不是执行用户指令。\n- 在页面即将被需要之前将其交换出。\n\
    - 抖动 ≡ 进程忙于交换页面进出。\n- 抖动会导致：\n  - CPU 利用率低。\n  - 操作系统认为需要增加多道程序的程度。\n  - 另一个进程被加入系统。\n\
    \n"
