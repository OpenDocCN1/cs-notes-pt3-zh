    \ is created during disk partitioning; adding more swap space requires repartitioning\
    \ the disk.\n\n## Swap-space management\n\n- 4.3BSD allocates swap space when\
    \ a process starts; holds *text segment* (the program) and *data segment*.\n-\
    \ Kernel uses *swap maps* to track swap-space use.\n- Solaris 2 allocates swap\
    \ space only when a page is forced out of physical memory, not when the virtual\
    \ memory page is first created.\n\n## Data Structures for Swapping on Linux Systems\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_825_0.png)\n\n## Homework (page 48)\n\
    \n- 12.2\n\n## Thinking:\n\n12.1\n\n## Chapter 13 I/O Systems\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_827_0.png)\n\
    \nTeaching hours: 2h\n\n## Strong points:\n\n- I/O Hardware\n- Application I/O\
    \ Interface, Kernel I/O Subsystem\n- Transforming I/O Requests to Hardware Operations\n\
    \n## Chapter Objectives\n\n- Explore the structure of an operating system’s I/O\
    \ subsystem\n- Discuss the principles of I/O hardware and its complexity\n- Provide\
    \ details of the performance aspects of I/O hardware and software\n\n## Contents\n\
    \n- 13.1 Overview\n- 13.2 I/O Hardware\n- 13.3 Application I/O Interface\n- 13.4\
    \ Kernel I/O Subsystem\n- 13.5 Transforming I/O Requests to Hardware Operations\n\
    - 13.6\\* Streams\n- 13.7\\* Performance\n\n## 13.1 Overview\n\n- Incredible variety\
    \ of I/O devices\n- Two trends\n  - Increasing standardization of software and\
