  mdcn: "\n\n## Convoy（护航）效应\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_325_0.png)\n\
    \n## 5.3.2 最短作业优先（SJF）调度\n\n- SJF 算法将每个进程与其下一次 CPU 突发的长度关联起来。利用这些长度，将 CPU 分配给所需时间最短的进程。\n\
    - 两种方案：\n  - **非抢占**：一旦 CPU 分配给某个进程，在该进程完成其 CPU 突发之前，它不能被抢占。\n  - **抢占**：如果新到达的进程的\
    \ CPU 突发长度小于当前正在执行进程的剩余时间，则进行抢占。这种方案称为**最短剩余时间优先（SRTF）**。\n- SJF 是最优的——对于给定的一组进程，能提供最小的平均等待时间。\n\
    \n### 非抢占式 SJF 示例\n\n| 进程 | 到达时间 | 突发时间 |\n|---|---|---|\n| P₁ | 0 | 7 |\n| P₂\
    \ | 2 | 4 |\n| P₃ | 4 | 1 |\n| P₄ | 5 | 4 |\n\nSJF（非抢占）\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_327_0.png)\n\
