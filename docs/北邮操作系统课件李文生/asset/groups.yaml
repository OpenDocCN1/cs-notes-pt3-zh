    +   - To discuss the APIs for Pthreads, Win32, and Java thread libraries


    ## Contents


    +   4.1 Overview

    +   4.2 Multithreading Models

    +   4.3 Threads Libraries

    +   4.4 Threading Issues

    +   4.5 Operating-System examples


    ## 4.1 Overview


    +   - **process**

    +     - Resource ownership - process is allocated a virtual address space to hold
    the process image

    +     - Scheduling/execution- follows an execution path that may be interleaved(交叉)
    with other processes

    +     - These two characteristics are treated independently by the operating system

    +   - Dispatching is referred to as a thread

    +   - Resource of ownership is referred to as a process or task


    ## Overview (Cont.)


    +   - A thread, called a lightweight process (LWP), is a basic unit of CPU utilization.

    +     - Comprises a thread ID, a program counter, a register set, and a stack.

    +     - Shares with other threads belongs to the same process its code section,
    data section, and other operating-system resources, such as open files and signals.

    +   - A traditional (or heavyweight) process has a single thread of control.

    +   - If the process has multiple threads of control, it can do more than one
    task at a time.


    ## Single and Multithreaded Processes


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_254_0.png)


    An application typically is implemented as a separate process with several threads
    of control.


    ## Benefits of Threads


    +   - Responsiveness

    +   - Resource Sharing

    +   - Economy

    +   - Utilization of MP Architectures


