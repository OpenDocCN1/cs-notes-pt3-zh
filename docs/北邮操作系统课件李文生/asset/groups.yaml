  - '[PAGE 140]


    # 2.7.2 Layered Approach


    +   - The operating system is divided into a number of layers (levels), each built
    on top of lower layers. The bottom layer (layer 0) is the hardware; the highest
    (layer N) is the user interface.

    +   - An operating-system layer is an implementation of an abstract object that
    is the encapsulation of data, and of the operations that can manipulate those
    data.

    +   - With modularity, layers are selected such that each uses functions (or operations)
    and services of only lower-level layers.'
