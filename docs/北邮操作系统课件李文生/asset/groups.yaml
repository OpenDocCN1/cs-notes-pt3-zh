    \ of resources of each type currently allocated to each process.\n- **Request**:\
    \ An *n* × *m* matrix indicates the current request of each process. If *Request*\
    \ [*i,j*] = *k*, then process *P_i* is requesting *k* more instances of resource\
    \ type *R_j*.\n\nRows in *Allocation* and *Request* can be treated as vectors,\
    \ and referred to as *Allocation_i* and *Request_i* respectively\n\n## Detection\
    \ Algorithm\n\n- 1. Let *Work* and *Finish* be vectors of length *m* and *n*,\
    \ respectively. Initialize:\n  (a) *Work* = *Available*\n  (b) For *i* = 1,2,\
    \ ..., *n*, if *Allocation*ᵢ ≠ 0, then *Finish*[i] = false; otherwise, *Finish*[i]\
    \ = true.\n- 2. Find an index *i* such that both:\n  (a) *Finish*[i] == false\
    \      (b) *Request*ᵢ ≤ *Work*\n  If no such *i* exists, go to step 4.\n- 3. *Work*\
    \ = *Work* + *Allocation*ᵢ    *Finish*[i] = true\n  go to step 2.\n- 4. If *Finish*[i]\
    \ == false, for some *i*, 1 ≤ *i* ≤ *n*, then the system is in a deadlock state.\n\
    \  Moreover, if *Finish*[i] == false, then *P*ᵢ is deadlocked.\n\nThis algorithm\
    \ requires an order of O(*m* × *n*²) operations to detect whether the system is\
    \ in a deadlocked state.\n\n## Example of Detection Algorithm\n\n- A system with\
    \ Five processes P₀ through P₄, three resource types A (7 instances), B (2 instances),\
    \ and C (6 instances).\n\n- Snapshot at time T₀:\n\n|  | Allocation | Request\
    \ | Available |\n|  | A B C | A B C | A B C |\n| P₀ | 0 1 0 | 0 0 0 | 0 0 0 |\n\
    | P₁ | 2 0 0 | 2 0 2 |  |\n| P₂ | 3 0 3 | 0 0 0 |  |\n| P₃ | 2 1 1 | 1 0 0 | \
    \ |\n| P₄ | 0 0 2 | 0 0 2 |  |\n\n| Seq. | Work |\n|  | 0 0 0 |\n| P₀ | 0 1 0\
    \ |\n| P₂ | 3 1 3 |\n| P₃ | 5 2 4 |\n| P₄ | 5 2 6 |\n| P₁ | 7 2 6 |\n\n- Sequence\
    \ <P₀, P₂, P₃, P₄, P₁> will result in Finish[i] = true for all i.\n\n## Example\
    \ (Cont.)\n\nSuppose P₂ requests an additional instance of type C.\n\n|  | Allocation\
    \ |  |  | Request |  |  | Available |  |  |\n|---|---|---|---|---|---|---|---|---|---|\n\
    |  | A | B | C | A | B | C | A | B | C |\n| P₀ | 0 | 1 | 0 | 0 | 0 | 0 | 0 | 0\
    \ | 0 |\n| P₁ | 2 | 0 | 0 | 2 | 0 | 2 |  |  |  |\n| P₂ | 3 | 0 | 3 | 0 | 0 | 1\
    \ |  |  |  |\n| P₃ | 2 | 1 | 1 | 1 | 0 | 0 |  |  |  |\n| P₄ | 0 | 0 | 2 | 0 |\
    \ 0 | 2 |  |  |  |\n\nState of system?\n\n- Can reclaim resources held by process\
    \ P₀, but insufficient resources to fulfill other processes’ requests.\n- Deadlock\
    \ exists, consisting of processes P₁, P₂, P₃, and P₄.\n\n## Detection-Algorithm\
