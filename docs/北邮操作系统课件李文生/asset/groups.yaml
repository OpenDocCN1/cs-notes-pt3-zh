  mdcn: "\n\n## FCFS — 先来先服务\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67  \nhead\
    \ starts at 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_806_0.png)\n\n总磁头移动距离为\
    \ 640 个柱面。\n\n## SSTF — 最短寻道时间优先\n\n- 从当前磁头位置选择寻道时间最小的请求。\n\nqueue = 98, 183,\
    \ 37, 122, 14, 124, 65, 67  \nhead starts at 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_807_0.png)\n\
    \n- 磁头移动 236 个柱面。\n- 饥饿现象\n\n## SCAN 调度\n\n- 磁盘臂从磁盘的一端开始，向另一端移动，在到达另一端之前提供服务，到达另一端后磁头移动方向反转并继续提供服务。\n\
    - 有时称为 *电梯算法*。\n\n## SCAN (续)\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67  \n\
    head starts at 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_809_0.png)\n\n总磁头移动距离为\
    \ 236 个柱面。\n\n## C-SCAN (续)\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67  \nhead\
    \ starts at 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_811_0.png)\n\n## LOOK\
    \ (续)\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67  \nhead starts at 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_813_0.png)\n\
    \n## C-LOOK (续)\n\nqueue = 98, 183, 37, 122, 14, 124, 65, 67  \nhead starts at\
    \ 53\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_814_0.png)\n\n## 选择磁盘调度算法\n\n\
    - SSTF 很常见且有其自然吸引力\n- SCAN 和 C-SCAN 对于对磁盘产生重负载的系统性能更好。\n- 性能取决于请求的数量和类型。\n- 磁盘服务的请求会受到文件分配方法的影响。\n\
    - 磁盘调度算法应作为操作系统的独立模块编写，以便在必要时可以替换为不同的算法。\n- SSTF 或 LOOK 是默认算法的合理选择。\n\n## 12.5\
    \ 磁盘管理\n\n- 格式化\n- 从磁盘启动\n- 坏块恢复\n\n## 磁盘格式化\n\n- **低级格式化**，或 *物理格式化* — 将磁盘划分为磁盘控制器可以读取和写入的扇区。\n\
    - **低级格式化** 用特殊的数据结构填充磁盘的每个扇区。数据结构通常由头部、数据区和尾部组成。\n- 为了使用磁盘存储文件，操作系统仍需要在磁盘上记录自己的数据结构。\n\
    \  - *分区* 磁盘为一个或多个柱面组。\n  - *逻辑格式化* 或“创建文件系统”。\n\n## 启动块\n\n## 启动块初始化系统\n\n- 初始化系统的所有方面，从\
    \ CPU 寄存器到设备控制器和主内存的内容，然后启动操作系统。\n- **引导程序** 存储在 ROM 中。\n- 大多数系统在启动 ROM 中存储一个微小的\
    \ *引导加载程序*。\n- 完整的引导程序存储在磁盘上固定位置的称为 **启动块** 的分区中。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_818_0.png)\n\
    \n## 从磁盘在 Windows 2000 中启动\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_819_0.png)\n\
    \n## 坏块\n\n处理坏块的方法取决于所使用的磁盘和控制器。\n\n- 对于简单的磁盘，例如某些带 IDE 控制器的磁盘，坏块由人工处理。\n  - MS-DOS，*format*\
    \ 命令，*chkdsk* 命令\n- 对于更复杂的磁盘\n  - 使用诸如 *扇区备用*（或 *转发*）等方法来处理坏块。\n  - 某些控制器可以被指示通过\
    \ *扇区滑动* 替换坏块。\n\n## 12.6 交换空间管理\n\n- 交换空间 — 虚拟内存使用磁盘空间作为主内存的扩展。\n- 交换空间使用\n-\
    \ 交换空间位置\n- 交换空间管理\n\n"
