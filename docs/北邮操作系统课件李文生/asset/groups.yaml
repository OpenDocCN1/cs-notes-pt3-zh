  md: "\n## Page Replacement Algorithms\n\n- **Placement Policy**\n  - Which page\
    \ is replaced?\n  - Page removed should be the page least likely to be referenced\
    \ in the near future\n  - Most policies predict the future behavior on the basis\
    \ of past behavior\n\n- **Want lowest page-fault rate**\n\n- Evaluate algorithm\
    \ by running it on a particular string of memory references (*reference string*)\
    \ and computing the number of page faults on that string.\n\n- We can generate\
    \ reference strings artificially (by a random-number generator) or we can trace\
    \ a given system and record the address of each memory reference.\n\n- In all\
    \ our examples, the reference strings are\n  - 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0,\
    \ 3, 2, 1, 2, 0, 1, 7, 0, 1\n  - 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n## Graph\
    \ of Page Faults Versus The Number of Frames\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_637_0.png)\n\
    \n## FIFO (First-In-First-Out) Algorithm\n\n- Associates with each page the time\
    \ when that page was brought into memory.\n- When a page must be replaced, the\
    \ oldest page is chosen.\n- Example\n  - 3 frames (3 pages can be in memory at\
    \ a time per process)\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_638_0.png)\n\
    \n- Treats frames allocated to a process as a circular buffer\n- Pages are removed\
    \ in round-robin style\n- These pages may be needed again very soon\n\n## Optimal\
    \ Algorithm\n\n- Replace page that will not be used for longest period of time.\n\
    \n- 3 frames example\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_639_0.png)\n\n\
    - Only 9 page faults\n\n- OPT is much better than FIFO algorithm.\n\n## Least\
    \ Recently Used (LRU) Algorithm\n\n- replaces the page that has not been used\
    \ for the longest period of time.\n- By the principle of locality, this should\
    \ be the page least likely to be referenced in the near future\n- Associates with\
    \ each page the time of that page’s last use. This would require a great deal\
    \ of overhead.\n- Example\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_640_0.png)\n\
    \n## Belady’s Anomaly  more frames ⇒ more page faults\n\n- Reference string: 1,\
    \ 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n- 3 frames\n\n9 times page fault\nPage fault\
    \ rate:\n9/12=75%\n\n- 4 frames\n\n10 times page fault\nPage fault rate:\n10/12=83.3%\n\
    \n## FIFO Illustrating Belady’s Anomaly\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_642_0.png)\n\
    \n## Optimal Algorithm example\n\n- **Thinking about:**\n  - How do you know the\
    \ reference string?\n- **Impossible to have perfect knowledge of future events.**\n\
    - **Used for measuring how well your algorithm performs.**\n\n## LRU Algorithm\
    \ example\n\n- Reference string: 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n- 3 frames\n\
    \n10 times page fault\nPage fault rate:\n10/12=83.3%\n\n- 4 frames\n\n8 times\
    \ page fault\nPage fault rate :\n8/12=66.7%\n\n## LRU implementation\n\n### Counters\n\
    \n- Every page entry has a counter; every time page is referenced through this\
    \ entry, copy the clock into the counter.\n- When a page needs to be replaced,\
    \ look at the counters to determine which are to be replaced.\n\n## LRU implementation\n\
    \n- Stack – keep a stack of page numbers in a double link form:\n  - Page referenced:\n\
    \    - move it to the top\n    - requires 6 pointers to be changed\n  - No search\
    \ for replacement\n\n- example: 4 7 0 7 1 0 1 2 1 2 7 1 2\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_647_0.png)\n\
    \n## LRU Approximation Algorithms\n\n### Reference bit algorithm\n\n- With each\
    \ page associate a bit, initially = 0.\n- When page is referenced, the bit is\
    \ set to 1.\n- Replace the one which is 0 (if one exists).\n- **Problem:** We\
    \ do not know the order.\n\n## LRU Approximation Algorithms\n\n### Additional-reference-bits\
    \ algorithm\n\n- Keep an 8-bit byte for each page in a table in memory.\n- At\
    \ regular intervals, a timer interrupts, OS shifts the reference bit for each\
    \ page into the high-order bit of its 8-bit byte, shifting the other bits right\
    \ by 1 bit and discarding the low-order bit\n- These 8-bit byte contains the history\
    \ of page use for the last 8 time periods.\n- The page with the lowest number\
    \ is the LRU page, can be replaced.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_649_0.png)\n"
  mdcn: "\n\n## 页面置换算法\n\n- **置放策略**\n  - 替换哪一页？\n  - 被移除的页面应是近期最不可能被引用的页面\n  - 大多数策略都基于过去的行为来预测未来的行为\n\
    \n- **希望获得最低的缺页率**\n\n- 通过在特定的内存引用字符串（*reference string*）上运行算法并计算该字符串上的缺页次数来评估算法。\n\
    \n- 我们可以人工生成引用字符串（通过随机数生成器），也可以追踪给定系统并记录每次内存引用的地址。\n\n- 在我们的所有示例中，引用字符串为\n  -\
    \ 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1\n  - 1, 2, 3, 4,\
    \ 1, 2, 5, 1, 2, 3, 4, 5\n\n## 缺页数与帧数关系的图\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_637_0.png)\n\
    \n## FIFO（先进先出）算法\n\n- 为每个页面关联该页面被调入内存的时间。\n- 当必须替换页面时，选择最旧的页面。\n- 示例\n  - 3 个帧（每个进程一次最多可有\
    \ 3 页在内存中）\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_638_0.png)\n\n- 将分配给进程的帧视为循环缓冲区\n\
    - 页面以轮询方式移除\n- 这些页面可能很快又会被需要\n\n## 最优算法\n\n- 替换未来最长时间内不会被使用的页面。\n\n- 3 个帧示例\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_639_0.png)\n\n- 仅有 9 次缺页\n\n- OPT 比 FIFO\
    \ 算法好得多。\n\n## 最近最少使用（LRU）算法\n\n- 替换最长时间未被使用的页面。\n- 根据局部性原理，这应是最不可能在近期被引用的页面\n\
    - 为每个页面关联该页面的最后使用时间。这需要大量的开销。\n- 示例\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_640_0.png)\n\
    \n## Belady 异常  更多帧 ⇒ 更多缺页\n\n- 引用字符串：1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n-\
    \ 3 个帧\n\n9 次缺页\n缺页率：\n9/12=75%\n\n- 4 个帧\n\n10 次缺页\n缺页率：\n10/12=83.3%\n\n## FIFO\
    \ 说明 Belady 异常\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_642_0.png)\n\n## 最优算法示例\n\
    \n- **思考：**\n  - 你如何知道引用字符串？\n- **不可能对未来事件有完美的了解。**\n- **用于衡量你的算法性能如何。**\n\n##\
    \ LRU 算法示例\n\n- 引用字符串：1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5\n\n- 3 个帧\n\n10 次缺页\n\
    缺页率：\n10/12=83.3%\n\n- 4 个帧\n\n8 次缺页\n缺页率：\n8/12=66.7%\n\n## LRU 实现\n\n### 计数器\n\
    \n- 每个页面条目都有一个计数器；每次通过该条目引用页面时，将时钟复制到计数器中。\n- 当需要替换页面时，查看计数器以确定要替换哪些页面。\n\n##\
    \ LRU 实现\n\n- 栈 – 以双向链表形式维护一个页面号栈：\n  - 页面被引用：\n    - 将其移至顶部\n    - 需要更改 6 个指针\n\
    \  - 无需搜索替换对象\n\n- 示例：4 7 0 7 1 0 1 2 1 2 7 1 2\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_647_0.png)\n\
    \n## LRU 近似算法\n\n### 引用位算法\n\n- 为每个页面关联一个位，初始为 = 0。\n- 当页面被引用时，该位置为 1。\n- 替换为\
    \ 0 的页面（如果存在）。\n- **问题：** 我们不知道顺序。\n\n## LRU 近似算法\n\n### 附加引用位算法\n\n- 为内存中的每个页面在表中保留一个\
    \ 8 位字节。\n- 在固定间隔，定时器中断，操作系统将每个页面的引用位移入其 8 位字节的高位，将其他位右移 1 位并丢弃低位\n- 这些 8 位字节包含最近\
    \ 8 个时间段的页面使用历史。\n- 数字最小的页面是 LRU 页面，可以被替换。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_649_0.png)\n\
    \n"
