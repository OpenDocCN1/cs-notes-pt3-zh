  mdcn: "\n\n## 11.1 文件系统结构\n\n- **文件结构**\n  - 逻辑存储单元\n  - 相关信息的集合\n- **文件系统驻留在辅助存储（磁盘）上**\n\
    \  - 磁盘可以原地写入\n  - 磁盘可以直接访问任意给定的信息块\n  - 内存与磁盘之间的 I/O 以块为单位传输\n- **主要设计问题**\n\
    \  - 用户接口\n  - 将逻辑文件系统映射到物理辅助存储设备上\n- **文件系统按层组织**\n\n## 分层文件系统\n\n应用程序\n\n文件操作的系统调用\n\
    \n逻辑文件系统\n\n管理元数据信息，\n管理目录结构，\n通过 FCB 维护文件结构。\n\n文件组织模块\n\n将逻辑块地址转换为\n物理块地址。\n\
    空闲空间管理器。\n\n基本文件系统\n\n向适当的\n设备驱动程序发出通用命令，以读写\n磁盘上的物理块。\n\nI/O 控制\n\n设备驱动程序和中断处理程序。\n\
    在主内存\n和磁盘系统之间传输信息。\n\n设备\n\n## 11.2 文件系统实现\n\n- 在磁盘上，文件系统可能包含有关如何引导存储在那里的操作系统、块总数、空闲块的数量和位置、目录结构以及各个文件的信息。\n\
    - 磁盘上的结构\n  - 引导控制块（每个卷）\n    - 在 UFS 中为引导块，在 NTFS 中为引导扇区\n  - 卷/分区控制块（每个卷）\n\
    \    - 在 UFS 中为超级块，在 NTFS 中为主文件表\n  - 目录结构（每个文件系统）\n    - 在 UFS 中为文件名和关联的 inode\n\
    \    - 在 NTFS 中在主文件表中\n  - 文件控制块（每个文件）\n    - 在 UFS 中为 inode，在 NTFS 中为主文件表（关系数据库）\n\
    \n## 一个典型的文件控制块\n\n- *文件控制块* ——由有关文件的信息组成的存储结构，包括所有权、权限以及文件内容的存储位置。\n\n| 文件权限\
    \ |  |\n|---|---|\n| 文件日期（创建、访问、写入） |  |\n| 文件所有者、组、ACL |  |\n| 文件大小 |  |\n| 文件数据块\
    \ |  |\n\n## 内存中的文件系统结构\n\n- 内存中的挂载表（分区表）\n- 内存中的目录结构缓存\n- 系统级打开文件表\n  - 包含每个打开文件的\
    \ FCB 副本\n  - 每个打开文件对应一个表项\n  - 整个系统只有一张表\n- 每进程打开文件表\n  - 包含指向系统级打开文件表中相应表项的指针\n\
    \  - 每个打开文件对应一个表项\n  - 每个进程一张表\n\n## 内存中的文件系统结构\n\n打开（文件名）\n\n用户空间\n\n目录结构\n\n\
    内核内存\n\n目录结构\n\n文件控制块\n\n辅助存储\n\n读取（索引）\n\n用户空间\n\n索引\n\n每进程打开文件表\n\n系统级打开文件表\n\
    \n内核内存\n\n数据块\n\n文件控制块\n\n辅助存储\n\n## 分区与挂载\n\n- 一个磁盘可以切分为多个分区，或者一个分区可以跨越多个磁盘。\n\
    - 每个分区可以是：\n  - “raw”（裸）：不包含文件系统\n  - “cooked”（熟）：包含文件系统\n- 引导信息可以存储在单独的分区中。\n\
    \  - 引导信息作为映像加载到内存中\n- 引导加载程序能理解多种文件系统，并且多个操作系统可以占用引导空间。\n- 包含操作系统内核以及可能其他系统文件的根分区在引导时被挂载。\n\
    - 挂载表——包含已挂载文件系统的信息。\n\n## 虚拟文件系统\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_755_0.png)\n\
    \n> 将文件系统通用操作与其实现分离开来。提供了一种在整个网络中唯一表示文件的机制——vnode。\n\n## 11.3 目录实现\n\n- 文件名的线性列表，带有指向数据块的指针。\n\
    \  - 编程简单\n  - 执行耗时\n- 排序列表允许二分查找，减少了平均查找时间。\n- 哈希表——带有哈希数据结构的线性列表。\n  - 减少目录查找时间\n\
    \  - *冲突* —— 两个文件名哈希到相同位置的情况\n  - 困难：固定大小、哈希函数\n\n"
