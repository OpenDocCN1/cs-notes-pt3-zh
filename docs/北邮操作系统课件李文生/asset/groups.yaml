    # # Linux Threads


    +   - Linux refers to them as *tasks* rather than *threads*


    +   - Thread creation is done through `clone()` system call


    +   - `clone()` allows a child task to share the address space of the parent task
    (process)


    +   - When `clone()` is invoked, it passed a set of flags, which determine how
    much sharing is to take place between the parent and child tasks

    +     - `CLONE_FS`: file system information is shared

    +     - `CLONE_VM`: the same memory space is shared

    +     - `CLONE_SIGHAND`: signal handlers are shared

    +     - `CLONE_FILES`: the set of open files is shared


    +   - If none of these flags are set, no sharing, similar to `fork()`


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_292_0.png)'
