  mdcn: "\n\n## 使用 Pthreads API 的多线程 C 程序\n\n```c\npthread_attr_init(&attr);    /*\
    \ get the default attributes */\n/* create the thread */\npthread_create(&tid,&attr,runner,argv[1]);\n\
    /* now wait for the thread to exit */\npthread_join(tid,NULL);\nprintf(\"sum =\
    \ %d\\n\",sum);\n}\n\n/* The thread will begin control in this function */\nvoid\
    \ *runner(void *param)\n{\n    int i, upper = atoi(param);\n    sum = 0;\n   \
    \ for (i = 1; i <= upper; i++)\n        sum += i;\n    pthread_exit(0);\n}\n```\n\
    \n## Win32 线程\n\n- Windows 系统上可用的内核级线程库\n\n## 使用 Win32 API 的多线程 C 程序\n\n```c\n\
    int main(int argc, char *argv[])\n{\n    DWORD ThreadId;\n    HANDLE ThreadHandle;\n\
    \    int Param;\n\n    // do some basic error checking\n    if (argc != 2) {\n\
    \        fprintf(stderr,\"An integer parameter is required\\n\");\n        return\
    \ -1;\n    }\n\n    Param = atoi(argv[1]);\n\n    if (Param < 0) {\n        fprintf(stderr,\
    \ \"an integer >= 0 is required \\n\");\n        return -1;\n    }\n}\n```\n\n\
    ## Java 线程\n\n- Java 在 **语言层面** 为线程的创建和管理提供支持。\n- Java 线程由 JVM 管理。\n- 所有 Java\
    \ 程序至少包含一个控制线程。\n- Java 线程可以通过以下方式创建：\n  - 扩展 Thread 类\n  - 实现 Runnable 接口\n \
    \   - 当一个类实现 runnable 时，它必须定义一个 run() 方法。\n    - 实现 run() 方法的代码作为单独的线程运行。\n\n\
    ## fork() 和 exec() 系统调用\n\n- 如果程序中的一个线程调用 **fork**，新进程会复制所有线程还是新进程是单线程的？\n  -\
    \ 复制所有线程\n  - 仅复制调用 fork 系统调用的线程。\n- 如果一个线程调用 **exec** 系统调用，则 exec 参数中指定的程序将替换整个进程，包括所有线程和\
    \ LWP。\n- 如果在 fork 之后立即调用 **exec**，仅复制调用线程是合适的。\n- 如果单独的进程在 fork 之后不调用 **exec**，则单独的进程应复制所有线程。\n\
    \n## 信号处理\n\n- **在多线程程序中，信号应被传递**\n  - 给信号适用的线程\n  - 给进程中的每个线程\n  - 给进程中的某些线程\n\
    \  - 给一个专门分配接收进程所有信号的特定线程。\n- **传递信号的方法取决于信号类型**\n  - **同步信号** 需要传递给生成信号的线程，而不是传递给进程中的其他线程\n\
    \  - **某些异步信号** 应发送给所有线程\n  - **某些异步信号** 可能只传递给未阻塞该信号的线程。\n\n  （某些多线程版本的 UNIX\
    \ 允许线程指定它将接受哪些信号以及将阻塞哪些信号。）\n\n## 线程特定数据\n\n- 允许每个线程拥有自己的数据副本\n- 当你无法控制线程创建过程时很有用（即使用线程池时）\n\
    - 示例\n  - 在事务处理系统中，我们可能在单独的线程中处理每个事务。每个事务可能被分配一个唯一标识符。为了将每个线程与其唯一标识符关联，我们可以使用线程特定数据。\n\
    \n## 调度器激活\n\n- M:M 和两级模型都需要在应用程序中保持分配给应用程序的内核线程的适当数量时进行通信\n- 调度器激活提供 **upcalls**，即从内核到线程库的通信机制\n\
    - 这种通信允许应用程序保持正确的内核线程数量\n\n"
