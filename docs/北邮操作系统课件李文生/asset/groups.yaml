    ## Decision Mode\n\n- **Nonpreemptive**\n  - Once a process is in the running\
    \ state, it will continue until it terminates or blocks itself for I/O\n- **Preemptive**\n\
    \  - Currently running process may be interrupted and moved to the Ready state\
