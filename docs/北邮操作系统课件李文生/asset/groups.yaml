    \  - 死锁主要是在共享这类资源时产生。\n\n### 临时性资源\n- 由一个进程产生，被另一个进程使用一短暂时间后便无用的资源，也称为消耗性资源。\n\
    - 竞争临时性资源也可能引起死锁。\n\n## 挂起：举例\n- **争用 I/O 设备时的死锁**\n  - 系统有 2 台磁带机\n  - P₁ 和 P₂\
    \ 都需要同时使用这两台磁带机进行数据处理\n  - P₁ 和 P₂ 分别占有其中的一台，并且又都需要另一台\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_504_0.png)\n\
    \n进程之间通信时的死锁\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_504_1.png)\n\n## 挂起：**死锁示例**\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_506_0.png)\n\n图中标注：Q的进度、P的进度、释放A、释放B、获取A、获取B、P和Q想要A、P和Q想要B、死锁不可避免。\n\
    \n## 挂起：无死锁示例\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_507_0.png)\n\nQ的进度\n\
