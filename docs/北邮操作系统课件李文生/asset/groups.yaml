    \ ready to run.\n- Allocation of devices.\n\n## Supplement: Timesharing systems\n\
    \n- **Timesharing (multitasking)** is logical extension in which CPU switches\
    \ jobs so frequently that users can interact with each job while it is running,\
    \ creating **interactive** computing\n  - **Response time** should be < 1 second\n\
    \  - Each user has at least one program executing in memory ⇒ process\n  - If\
    \ several jobs ready to run at the same time ⇒ **CPU scheduling**\n  - If processes\
    \ don’t fit in memory, **swapping** moves them in and out to run\n  - **Virtual\
    \ memory** allows execution of processes not completely in memory\n\n## Supplement:\n\
    Timesharing systems (Cont.)\n\n- Using multiprogramming to handle multiple interactive\
    \ jobs\n- The CPU is multiplexed (复用) among several jobs that are kept in memory\
    \ and on disk\n  - Processor’s time is shared among multiple users\n  - the CPU\
    \ is allocated to a job only if the job is in memory.\n- A job swapped in and\
