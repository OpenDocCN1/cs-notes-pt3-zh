    \ struct {\n    int value;\n    struct process *List;\n  } semaphore;\n  ```\n\
    \n- Assume two simple operations:\n  - Block() suspends the process that invokes\
    \ it.\n  - wakeup(P) resumes the execution of a blocked process P.\n\n## Critical-Section\
    \ Problem of Semaphore\n\n- **Uniprocessor environment**\n  - Inhibit interrupts\
    \ during the time that wait and signal operations are executing.\n- **multiprocessor\
    \ environment**\n  - inhibiting interrupts does not work.\n  - Special hardware\
    \ instructions\n  - Software solution for the critical-section problem, where\
    \ the critical section consists of the wait and signal procedures.\n- **Busy waiting\
    \ problem**\n  - have removed busy waiting from the entry to the critical sections\
    \ of application programs.\n  - have limited busy waiting to only the critical\
    \ sections of the wait and signal operations, these sections are short.\n\n##\
    \ Problems: Deadlock and Starvation\n\n- **Deadlock** – two or more processes\
    \ are waiting indefinitely for an event that can be caused by only one of the\
    \ waiting processes.\n\nLet S and Q be two semaphores initialized to 1\n\n```\n\
    P₀                 P₁\nwait (S);          wait (Q);\nwait (Q);          wait (S);\n\
    \n…                  …\n\nsignal (Q);        signal (S);\nsignal (S);        signal\
    \ (Q);\n```\n\n```\nP₀: wait (S);\nP₁: wait (Q);\nP₀: wait (Q);\nP₁: wait (S);\n\
    ```\n\n- **Starvation** – indefinite blocking. A process may never be removed\
    \ from the semaphore queue in which it is suspended. ( a LIFO queue )\n\n## Supplement:\
    \ Two Types of Semaphores\n\n- **Binary** semaphore – integer value can range\
    \ only between 0 and 1; can be simple to implement.\n- **Counting** semaphore\
    \ – integer value can range over an unrestricted domain.\n- A counting semaphore\
    \ S Can be implemented by using binary semaphores.\n  - Data structures:\n   \
    \ binary-semaphore S1, S2;\n    int C;\n  - Initialization:\n    S1 = 1\n    S2\
    \ = 0\n    C = initial value of semaphore S\n\n## Supplement:\n### Implementing\
    \ S as a Binary semaphore\n\n### Wait(S) operation\n\n```\nwait (S1);\nC--;\n\
    if (C < 0) {\n    signal (S1);\n    wait (S2)\n}\nelse\n    signal (S1);\n```\n\
    \n### Signal(S) operation\n\n```\nwait (S1);\nC ++;\nif (C <= 0)\n    signal(S2);\n\
    signal(S1);\n```\n\n## 6.6 Classica Problems of Synchronization\n\n- The Bounded-Buffer\
    \ Problem\n- The Readers-Writers Problem\n- The Dining-Philosophers Problem\n\n\
