  mdcn: "\n\n## 倒排页表\n\n- 为每个实际的内存帧提供一个条目。\n- 每个条目由存储在该实际内存位置中的页面的虚拟地址组成，并包含拥有该页面的进程的信息。\n\
    - 通常需要在页表中的每个条目中存储一个地址空间标识符（ASID）。确保特定进程的逻辑页映射到相应的物理页帧。\n- IBM RT 中使用的实现的简化版本：\n\
    \n  `<process-id, page-number, offset>`\n\n## 倒排页表架构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_560_0.png)\n\
    \n## 倒排页表（续）\n\n- 减少了存储每个页表所需的内存量，但增加了页引用发生时搜索表所需的时间。\n- 使用哈希表将搜索限制在一 — 或最多几个\
    \ — 页表条目。\n\n## 8.6 分段\n\n支持用户对内存的视图的内存管理方案。\n\n一个程序是一组段的集合。段是一个逻辑单元，例如：\n\n-\
    \ 主程序，\n- 过程，\n- 函数，\n- 方法，\n- 对象，\n- 局部变量，全局变量，\n- 公共块，\n- 栈，\n- 符号表，数组\n\n##\
    \ 程序的用户视图\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_563_0.png)\n\n## 分段的逻辑视图\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_564_0.png)\n\n用户空间\n\n物理内存空间\n\n##\
    \ 分段架构\n\n- 所有程序的所有段不必具有相同的长度\n- 存在最大段长度\n- 逻辑地址由两部分组成 - 段号和偏移量\n\n  `<segment-number,\
    \ offset>`\n- *段表* – 映射二维物理地址；每个表条目具有：\n  - *基址* – 包含段在内存中驻留的起始物理地址。\n  - *界限*\
    \ – 指定段的长度。\n- *段表基址寄存器* (**STBR**) 指向段表在内存中的位置。\n- *段表长度寄存器* (**STLR**) 指示程序使用的段数；段号\
