    \ second readers-writers problem: writer first\n  - once a writer is ready, that\
    \ writer performs its write as soon as possible.\n  - Readers may starve.\n"
  mdcn: "\n\n## 6.5 信号量\n\n- 一种不需要忙等待的同步工具。\n- 特殊变量，信号量 $S$ —— 整型变量\n- 只能通过两个不可分割（原子）操作访问\n\
    \n```\nwait (S):\n    while S ≤ 0 ;    // 不执行任何操作\n    S--;\n\nsignal (S):\n \
    \   S++;\n```\n\n- 等待和信号操作不能被中断。\n- 信号量是一个具有整数值的变量\n  - 可以初始化为非负数\n  - 等待操作递减信号量的值\n\
    \  - 信号操作递增信号量的值\n\n## 用法\n\nn 个进程的临界区\n\n- 共享数据：\n  semaphore mutex; // 初始时 mutex\
    \ = 1\n\n- 进程 Pi：\n  do {\n    wait(mutex);\n    临界区\n    signal(mutex);\n   \
    \ 剩余区\n  } while (1);\n\n```\nwait (S):\n  while S ≤ 0 ;\n  S--;\nsignal (S):\n\
    \  S++;\n```\n\n共享数据：\nSemaphore synch; // 0\n\nP1:\n  S1;\n  signal(synch);\n\
    P2:\n  wait(synch);\n  S2;\n\n## 信号量的实现\n\n- 将信号量定义为一个记录\n  ```c\n  typedef struct\
    \ {\n    int value;\n    struct process *List;\n  } semaphore;\n  ```\n\n- 假设两个简单的操作：\n\
    \  - Block() 挂起调用它的进程。\n  - wakeup(P) 恢复被阻塞进程 P 的执行。\n\n## 信号量的临界区问题\n\n- **单处理器环境**\n\
    \  - 在执行等待和信号操作期间禁止中断。\n- **多处理器环境**\n  - 禁止中断不起作用。\n  - 特殊的硬件指令\n  - 针对临界区问题的软件解决方案，其中临界区由等待和信号过程组成。\n\
    - **忙等待问题**\n  - 已经从应用程序进入临界区的部分消除了忙等待。\n  - 将忙等待限制在等待和信号操作的临界区内，这些区段很短。\n\n##\
    \ 问题：死锁与饥饿\n\n- **死锁** —— 两个或多个进程无限期等待一个只能由其中一个等待进程引发的事件。\n\n设 S 和 Q 为两个初始化为 1\
    \ 的信号量\n\n```\nP₀                 P₁\nwait (S);          wait (Q);\nwait (Q);\
    \          wait (S);\n\n…                  …\n\nsignal (Q);        signal (S);\n\
    signal (S);        signal (Q);\n```\n\n```\nP₀: wait (S);\nP₁: wait (Q);\nP₀:\
    \ wait (Q);\nP₁: wait (S);\n```\n\n- **饥饿** —— 无限期阻塞。一个进程可能永远无法从它被挂起的信号量队列中移除。（LIFO\
    \ 队列）\n\n## 补充：两种类型的信号量\n\n- **二进制**信号量 —— 整数值只能在 0 和 1 之间变化；实现简单。\n- **计数**信号量\
    \ —— 整数值可以在无限制的域内变化。\n- 计数信号量 S 可以通过使用二进制信号量来实现。\n  - 数据结构：\n    binary-semaphore\
    \ S1, S2;\n    int C;\n  - 初始化：\n    S1 = 1\n    S2 = 0\n    C = 信号量 S 的初始值\n\n\
    ## 补充：\n### 使用二进制信号量实现 S\n\n### Wait(S) 操作\n\n```\nwait (S1);\nC--;\nif (C < 0)\
    \ {\n    signal (S1);\n    wait (S2)\n}\nelse\n    signal (S1);\n```\n\n### Signal(S)\
    \ 操作\n\n```\nwait (S1);\nC ++;\nif (C <= 0)\n    signal(S2);\nsignal(S1);\n```\n\
    \n## 6.6 同步的经典问题\n\n- 有界缓冲区问题\n- 读者-写者问题\n- 哲学家就餐问题\n\n## 读者-写者问题\n\n- 读者：只读取共享对象的内容。\n\
    - 写者：可以更新共享对象的内容。\n- 写者对共享对象拥有排他访问权。\n- 第一个读者-写者问题：读者优先\n  - 除非写者已经获得使用共享对象的许可，否则不会让读者等待。\n\
    \  - 写者可能会饥饿。\n- 第二个读者-写者问题：写者优先\n  - 一旦写者准备就绪，该写者将尽快执行写入操作。\n  - 读者可能会饥饿。\n\n"
