  - '[PAGE 19]


    # Computer Startup


    +   - **bootstrap program** is loaded at power-up or reboot

    +     - Typically stored in ROM or EEPROM, generally known as **firmware**

    +     - Initializes all aspects of system

    +       - From CPU registers to device controllers to memory contents

    +     - Loads operating system kernel and starts execution


    +   - OS starts executing the first process, such as “init” and waits for some
    events to occur

    +     - An interrupt from the hardware

    +       - Sending a signal to CPU by way of the system bus

    +     - An interrupt from the software

    +       - Executing a system call'
  - '[PAGE 20]


    # 1.2.1 Computer-System Operation


    +   - I/O devices and the CPU can execute concurrently.

    +   - Each device controller is in charge of a particular device type.

    +   - Each device controller has a local buffer.

    +   - CPU moves data from/to main memory to/from local buffers

    +   - I/O is from the device to local buffer of controller.

    +   - Device controller informs CPU that it has finished its operation by causing
    an *interrupt*.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_20_0.png)'
  - '[PAGE 21]


    # Interrupt Timeline


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_21_0.png)'
  - '[PAGE 22]


    # Supplement:

    Program Flow of Control Without and With Interrupt


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_22_0.png)


    No interrupts


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_22_1.png)


    Interrupts, short I/O wait'
  - '[PAGE 23]


    # 1.2.2 Storage Structure


    +   - Main memory – only large storage area that the processor can access directly.

    +   - Secondary storage – extension of main memory that provides large nonvolatile
    storage capacity.

    +   - Magnetic disks – rigid metal or glass platters covered with magnetic recording
    material

    +     - Disk surface is logically divided into *tracks*, which are subdivided
    into *sectors*.

    +     - The *disk controller* determines the logical interaction between the device
    and the computer.

    +   - Magnetic tapes - used for backup, for storage of infrequently used information'
  - '[PAGE 24]


    # Supplement:

    Moving-Head Disk Mechanism


    编号：

    从上向下

    0, 1, ..., T-1


    编号：

    依次为

    0,1,...,S-1


    编号：

    从外向内

    0, 1, ..., C-1


    磁盘块编号：

    从0柱面、0磁道的0扇区开始，依次为0,1,......,S-1;

    再对0柱面、1磁道的s个扇区依次编号为S,S+1,......,2S-1;

    依次类推，对柱面0的所有磁道所有扇区进行编号;

    然后，对1柱面的0磁道的各个扇区进行编号,...;

    直到对所有柱面上所有磁道的所有扇区编完为止。


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_24_0.png)'
  - '[PAGE 25]


    # Storage Hierarchy


    +   - Storage systems organized in hierarchy.

    +     - Speed

    +     - Cost

    +     - Volatility

    +   - Volatile storage loses its contents when the power to the device is removed.

    +   - Principle of design a computer memory system

    +     - uses only as much expensive memory as necessary

    +     - provides as much inexpensive, nonvolatile memory as possible.'
