  md: "\n## 9.8 Allocating Kernel Memory\n\n- Treated differently from user memory.\n\
    - Kernel memory is often allocated from a free-memory pool different from the\
    \ list used to satisfy ordinary user-mode processes. Reasons are:\n  - The kernel\
    \ request memory for data structures of varying sizes, some of which are less\
    \ than a page in size.\n  - Some kernel memory needs to be contiguous. Certain\
    \ hardware devices interact directly with physical memory, and may require memory\
    \ residing in physically contiguous pages.\n- Buddy system\n- Slab allocation\n\
    \n## Buddy System (伙伴系统)\n\n- Allocates memory from a fixed-size segment consisting\
    \ of physically contiguous pages.\n- Memory is allocated by using a **power-of-2\
    \ allocator**.\n- Entire space available is treated as a single block of \\(2^U\\\
    ).\n- If a request of size \\(s\\) such that \\(2^{U-1} < s <= 2^U\\), entire\
    \ block is allocated\n  - Otherwise block is split into two equal buddies\n  -\
    \ Process continues until smallest block greater than or equal to \\(s\\) is generated\n\
    \n## Example of Buddy System\n\n1MB block\n\nA: Request 100KB    B: Request 240KB\
    \    C: Request 64KB\n\nD: Request 256KB    Release B    Release A\n\nE: Request\
    \ 75KB    Release C    Release E    Release D\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_676_0.png)\n\
    \n## Slab allocation\n\n- A **slab** is made up of one or more physically contiguous\
    \ pages.\n- A **cache** consists of one or more slabs.\n- There is a single cache\
    \ for each unique kernel data structure\n  - Cache for PCBs\n  - Cache for file\
    \ objects\n  - Cache for semaphores\n- Each cache is filled with objects -- instantiations\
    \ of the kernel data structure the cache represents.\n\n## The relationship between\
    \ slabs, caches and objects\n\nkernel objects\n\ncaches\n\nslabs\n\n3 KB objects\n\
    \n7 KB objects\n\nphysical contiguous pages\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_678_0.png)\n\
    \n## Slab allocation\n\n- **When cache created, filled with objects marked as\
    \ free**\n  - The number of objects in the cache depends on the size of the associated\
    \ slab.\n- **When structures stored, objects marked as used**\n- **If slab is\
    \ full of used objects, next object allocated from empty slab**\n  - If no empty\
    \ slabs, new slab allocated\n- **Benefits**\n  - no fragmentation\n  - fast memory\
    \ request satisfaction\n\n## 9.9 Other Considerations-- Prepaging\n\n- To reduce\
    \ the large number of page faults that occurs at process startup\n- Prepaging\
    \ all or some of the pages a process will need, before they are referenced.\n\
    - Prepaging may be an advantage in some cases.\n  - whether the cost of using\
    \ prepaging is less than the cost of servicing the corresponding page faults.\n\
    - Example\n  - *S* pages are prepaged\n  - a fraction *α* of these *S* pages is\
    \ actually used (0<α<1)\n  - the cost of the *S × α* saved page faults is greater\
    \ or less than the cost of prepaging *S × (1 - α)* unnecessary pages\n  - if *α*\
    \ is close to 0, prepaging loses; if *α* is close to 1, prepaging wins.\n\n##\
    \ Other Issues --Page size selection\n\n- **size of the page table**\n  - each\
    \ active process must have its own copy of the page table, a **large page size**\
    \ is desirable.\n- **fragmentation**\n  - to minimize internal fragmentation,\
    \ **small page size** is needed.\n- **I/O overhead**\n  - I/O time = seek time\
    \ + latency time + transfer time\n  - seek and latency time normally dwarf transfer\
    \ time\n  - to minimize I/O time, **large page size** is desired\n- **locality**\n\
    \  - with a small page size, locality will be improved, total I/O should be reduced\n\
    \  - to minimize the number of page faults, a **large page size** is need.\n\n\
    ## Example Page Sizes\n\n| Computer | page size |\n|---|---|\n| Atlas | 512 48-bit\
    \ words |\n| Honeywell-Multics | 1024 36-bit words |\n| IBM370/XA and 370/ESA\
    \ | 4 Kbytes |\n| VAX family | 512 bytes |\n| IBM AS/400 | 512 bytes |\n| DEC\
    \ Alpha | 8 Kbytes |\n| MIPS | 4 Kbytes to 16 Mbytes |\n| UltraSPARC | 8 Kbytes\
    \ to 4 Mbytes |\n| Pentium | 4 Kbytes to 4 Mbytes |\n| PowerPC | 4 Kbytes |\n"
  mdcn: "\n\n## 9.8 内核内存分配\n\n- 与用户内存的处理方式不同。\n- 内核内存通常从空闲内存池中分配，该内存池有别于用于满足普通用户态进程需求的内存列表。原因如下：\n\
    \  - 内核请求内存用于各种大小的数据结构，其中一些数据结构的尺寸小于一个页面。\n  - 某些内核内存需要连续。某些硬件设备直接与物理内存交互，可能要求内存位于物理连续的页面中。\n\
    - 伙伴系统\n- Slab 分配\n\n## 伙伴系统（Buddy System）\n\n- 从由物理连续的页面组成的固定大小段中分配内存。\n- 内存通过使用**2\
    \ 的幂分配器**进行分配。\n- 整个可用空间被视为大小为 \\(2^U\\) 的单个块。\n- 如果请求的大小 \\(s\\) 满足 \\(2^{U-1}\
    \ < s <= 2^U\\)，则分配整个块\n  - 否则，块被分割成两个相等的伙伴\n  - 继续此过程，直到生成大于或等于 \\(s\\) 的最小块\n\
    \n## 伙伴系统示例\n\n1MB 块\n\nA：请求 100KB    B：请求 240KB    C：请求 64KB\n\nD：请求 256KB  \
    \  释放 B    释放 A\n\nE：请求 75KB    释放 C    释放 E    释放 D\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_676_0.png)\n\
    \n## Slab 分配\n\n- 一个**slab**由一个或多个物理连续的页面组成。\n- 一个**缓存**由一个或多个slab组成。\n- 每个唯一的内核数据结构都有一个单独的缓存\n\
    \  - 用于PCB的缓存\n  - 用于文件对象的缓存\n  - 用于信号量的缓存\n- 每个缓存都充满了对象——即该缓存所代表的内核数据结构的实例。\n\
    \n## Slab、缓存和对象之间的关系\n\n内核对象\n\n缓存\n\nSlab\n\n3 KB 对象\n\n7 KB 对象\n\n物理连续的页面\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_678_0.png)\n\n## Slab 分配\n\n- **当创建缓存时，用标记为空闲的对象将其填满**\n\
    \  - 缓存中对象的数量取决于相关slab的大小。\n- **当存储数据结构时，对象被标记为已使用**\n- **如果slab中全是已使用的对象，则从空slab分配下一个对象**\n\
    \  - 如果没有空slab，则分配新的slab\n- **优点**\n  - 无碎片\n  - 快速满足内存请求\n\n## 9.9 其他考虑——预调页\n\
    \n- 为了减少进程启动时出现的大量缺页中断\n- 在进程需要使用的页被引用之前，预先调入全部或部分页。\n- 在某些情况下，预调页可能是一种优势。\n \
    \ - 使用预调页的成本是否低于处理相应缺页中断的成本。\n- 示例\n  - 预调入了 *S* 个页\n  - 这些 *S* 个页中实际使用的比例为 *α*\
    \ (0<α<1)\n  - 节省的 *S × α* 次缺页中断的成本与预调 *S × (1 - α)* 个不必要的页的成本相比，哪个更大\n  - 如果\
    \ *α* 接近 0，预调页失败；如果 *α* 接近 1，预调页成功。\n\n## 其他问题——页面大小选择\n\n- **页表大小**\n  - 每个活动进程都必须有自己的页表副本，因此**大的页面大小**是理想的。\n\
    - **碎片化**\n  - 为了最小化内部碎片，需要**小的页面大小**。\n- **I/O 开销**\n  - I/O 时间 = 寻道时间 + 延迟时间\
    \ + 传输时间\n  - 寻道时间和延迟时间通常远大于传输时间\n  - 为了最小化 I/O 时间，**大的页面大小**是理想的选择。\n- **局部性**\n\
    \  - 使用小的页面大小，局部性会得到改善，总 I/O 应该会减少\n  - 为了最小化缺页中断的数量，需要**大的页面大小**。\n\n## 页面大小示例\n\
    \n| 计算机 | 页面大小 |\n|---|---|\n| Atlas | 512 个 48 位字 |\n| Honeywell-Multics | 1024\
    \ 个 36 位字 |\n| IBM370/XA 和 370/ESA | 4 KB |\n| VAX 系列 | 512 字节 |\n| IBM AS/400\
    \ | 512 字节 |\n| DEC Alpha | 8 KB |\n| MIPS | 4 KB 到 16 MB |\n| UltraSPARC | 8\
    \ KB 到 4 MB |\n| Pentium | 4 KB 到 4 MB |\n| PowerPC | 4 KB |\n\n"
