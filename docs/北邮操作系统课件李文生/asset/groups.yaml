    P的进度\n\n## 挂起：死锁\n- 一组进程的永久阻塞，这些进程要么竞争系统资源，要么相互通信\n- 两个或多个进程对资源的冲突需求\n- 没有有效的解决方案\n\
    \n## 第8章 主存储器\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_509_0.png)\n\n教学时长：4小时\n\
    \n## 重点：\n- 分页\n- 分段\n\n## 本章目标\n- 详细描述组织内存硬件的各种方式\n- 讨论各种内存管理技术，包括分页和分段。\n- 详细描述Intel\
