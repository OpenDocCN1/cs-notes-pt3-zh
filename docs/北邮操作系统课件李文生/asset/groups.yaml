    \ for different files.\n  - The same file can have several different names.\n\
    - **Grouping** – logical grouping of files by properties, (e.g., all Java programs,\
    \ all games, ...)\n\n## Single-Level Directory\n\n- All files are contained in\
    \ the same directory.\n- List of entries, one for each file\n- Sequential file\
    \ with the name of the file serving as the key\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_714_0.png)\n\
    \n- Naming problem\n  - Files must have unique names.\n  - The length of a file\
    \ name.\n- Grouping problem\n"
  mdcn: "\n\n## 文件结构\n\n- **None** - 词序列、字节序列\n- **简单记录结构**\n  - 行\n  - 固定长度\n  -\
    \ 可变长度\n- **复杂结构**\n  - 格式化文档\n  - 可重定位装载文件\n- 可通过在第一种方法中插入适当的控制字符来模拟最后两种。\n-\
    \ **谁来决定？**\n  - 操作系统\n  - 程序\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_703_0.png)\n\
    \n## 内部文件结构\n\n- **逻辑结构**\n  - 两种类型\n    - 文本文件：8 位字节的序列\n    - 记录文件：具有固定或可变长度的记录序列\n\
    \  - 逻辑地址\n    - 文件开头的偏移量\n    - 逻辑记录号\n\n- **物理结构：一组磁盘块**\n\n- **基本 I/O 函数以块为单位操作**\n\
    \n- **将逻辑地址映射到物理地址**\n  - 逻辑块号\n  - 物理磁盘块号\n  - 块内偏移量\n\n- **内部碎片**\n\n## 10.2\
    \ 访问方法\n\n- 反映不同的文件结构\n- 存储和处理数据的不同方式\n- 文件组织的标准\n\n- 快速访问\n  - 访问单个记录时需要\n  -\
    \ 批处理模式下不需要\n\n- 更新的便捷性\n  - CD-ROM 上的文件不会被更新，因此这不是问题\n\n- 存储经济性\n  - 数据中应具有最小冗余\n\
    \  - 冗余可用于加速访问，例如索引\n\n- 简单维护\n\n- 可靠性\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_705_0.png)\n\
    \n## 访问方法 (1/3)\n\n- 顺序访问\n  - 读下一个\n  - 写下一个\n  - 重置\n  - 重写，末次写入后不读\n- 顺序访问文件\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_706_0.png)\n\n## 访问方法 (2/3)\n\n- **直接访问**\n\
    \  - 读 n\n  - 写 n\n  - 定位到 n\n    - 读下一个\n    - 写下一个\n  - 重写 n\n- n = 相对块号\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_707_0.png)\n\n在直接访问文件上模拟顺序访问。\n\n| 顺序访问\
    \ | 直接访问的实现 |\n|---|---|\n| 读 | `cp = 0;` |\n| 读下一个 | `read cp;`<br>`cp = cp +\
    \ 1;` |\n| 写下一个 | `write cp;`<br>`cp = cp + 1;` |\n\n## 其他访问方法 (3/3)\n\n- 可以建立在直接访问方法之上。\n\
    - 通常涉及为文件构造索引。\n- 两级或多级索引文件。\n- 索引和相对文件的示例。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_708_0.png)\n\
    \n## 10.3 目录结构\n\n- 磁盘被划分为一个或多个分区。\n  - 系统中的每个磁盘至少包含一个分区。\n  - 有些系统允许分区大于一个磁盘，以将磁盘组合成一个逻辑结构。\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_709_0.png)\n\n- 每个分区包含有关其中文件的的信息\n\
    \  - 名称、位置、大小和类型等信息保存在目录的条目中\n\n## 补充：\n目录条目中的信息\n\n- 名称\n- 类型\n- 地址\n- 当前长度\n\
    - 最大长度\n- 最后访问日期（用于归档）\n- 最后更新日期（用于转储）\n- 所有者 ID（谁付费）\n- 保护信息\n\n## 对目录执行的操作\n\
    \n- 搜索文件\n- 创建文件\n- 删除文件\n- 列出目录\n- 重命名文件\n- 遍历文件系统\n\n## 补充：\n组织目录（逻辑上）的对象\n\n\
    - **效率** – 快速定位文件。\n- **命名** – 对用户方便。\n  - 两个用户可以为不同的文件使用相同的名称。\n  - 同一个文件可以有几个不同的名称。\n\
    - **分组** – 按属性对文件进行逻辑分组，（例如，所有 Java 程序，所有游戏，...）\n\n## 单级目录\n\n- 所有文件都包含在同一个目录中。\n\
    - 条目列表，每个文件一个\n- 以文件名作为键的顺序文件\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_714_0.png)\n\
    \n- 命名问题\n  - 文件必须具有唯一名称。\n  - 文件名的长度。\n- 分组问题\n\n"
