- raw:
  - '[PAGE 108]


    # 2.1 Operating System Services


    +   - **User interface**: Almost all OS have a user interface

    +     - Command-Line (CLI), Graphics User Interface (GUI)

    +     - APIs (system calls)


    +   - **Program execution**: The system must be able to load a program into memory
    and to run that program, end execution, either normally or abnormally.


    +   - **I/O operations**: A running program may require I/O, which may involve
    a file or an I/O device.


    +   - **File-system manipulation**: The file system is of particular interest.
    Obviously, programs need to read and write files and directories, create and delete
    them, search them, list file Information, permission management.'
  - '[PAGE 109]


    # Operating System Services (Cont.)


    +   - **Communications** – Processes may exchange information, on the same computer
    or between computers over a network

    +     - Communications may be via shared memory or through message passing (packets
    moved by the OS)

    +   - **Error detection** – OS needs to be constantly aware of possible errors

    +     - May occur in the CPU and memory hardware, in I/O devices, in user program

    +     - For each type of error, OS should take the appropriate action to ensure
    correct and consistent computing

    +     - Debugging facilities can greatly enhance the user’s and programmer’s abilities
    to efficiently use the system'
  - '[PAGE 110]


    # Operating System Services (Cont.)


    +   - Another set of OS functions exists for ensuring the efficient operation
    of the system itself via resource sharing

    +     - **Resource allocation** - When multiple users or multiple jobs running
    concurrently, resources must be allocated to each of them

    +       - Many types of resources - Some (such as CPU cycles, main memory, and
    file storage) may have special allocation code, others (such as I/O devices) may
    have general request and release code.

    +     - **Accounting** - To keep track of which users use how much and what kinds
    of computer resources'
  - '[PAGE 111]


    # Operating System Services (Cont.)


    +   - **Protection and security** - The owners of information stored in a multiuser
    or networked computer system may want to control use of that information, concurrent
    processes should not interfere with each other

    +     - **Protection** involves ensuring that all access to system resources is
    controlled

    +     - **Security** of the system from outsiders requires user authentication,
    extends to defending external I/O devices from invalid access attempts

    +     - If a system is to be protected and secure, precautions must be instituted
    throughout it. A chain is only as strong as its weakest link.'
  - '[PAGE 112]


    # 2.2 User Operating-system Interface


    +   - Command-Line (CLI)

    +   - Graphics User Interface (GUI)'
  - '[PAGE 113]


    # User OS Interface - CLI


    +   - allows direct command entry


    +   - **Command interpreter** is the interface between the user and the operating
    system.


    +   - Sometimes implemented in kernel, sometimes by systems program


    +   - Sometimes multiple flavors implemented – **shells**


    +   - Primarily fetches a command from user and executes it

    +     - Sometimes commands built-in, sometimes just names of programs

    +       - If the latter, adding new features doesn’t require shell modification'
  - '[PAGE 114]


    # User OS Interface - GUI


    +   - **User-friendly desktop metaphor interface**

    +     - Usually mouse, keyboard, and monitor

    +     - **Icons** represent files, programs, actions, etc

    +     - Various mouse buttons over objects in the interface cause various actions
    (provide information, options, execute function, open directory (known as a **folder**)

    +     - Invented at Xerox PARC(帕洛阿尔托研究中心)

    +   - **Many systems now include both CLI and GUI interfaces**

    +     - Microsoft Windows is GUI with CLI “command” shell

    +     - Apple Mac OS X as “Aqua” GUI interface with UNIX kernel underneath and
    shells available

    +     - Solaris is CLI with optional GUI interfaces (Java Desktop, KDE)


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_114_0.png)'
  - '[PAGE 115]


    # 2.3 System Calls


    +   - **Programming interface to the services provided by the OS**

    +   - Typically written in a high-level language (C or C++)

    +   - Mostly accessed by programs via a high-level Application Program Interface
    (API) rather than direct system call use

    +   - Three most common APIs are

    +     - Win32 API for Windows

    +     - POSIX API for POSIX-based systems (including virtually all versions of
    UNIX, Linux, and Mac OS X)

    +       POSIX: Portable Operating System Interface for computer environment

    +     - Java API for the Java virtual machine (JVM)

    +   - Why use APIs rather than system calls?'
