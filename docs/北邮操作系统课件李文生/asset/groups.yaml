  mdcn: "\n\n## 补充：多处理器线程调度\n\n- **负载共享**\n  - 进程不会被分配到特定的处理器\n- **成组调度**\n  - 一组相关线程被安排在同一时间运行在一组处理器上\n\
    - **专用处理器分配**\n  - 线程被分配到特定的处理器\n- **动态调度**\n  - 线程数量可在执行过程中改变\n\n## 5.6 操作系统示例\n\
