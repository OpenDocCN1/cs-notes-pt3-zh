    \ chopstick[5]={1,1,1,1,1};\nsemaphore room=4;\nint i;\nvoid philosopher(int i)\n\
    {\n  while(1){\n    thinking;\n    wait (room);\n    wait (chopstick[i]);\n  \
    \  wait (chopstick[(i+1) % 5]);\n    eating;\n    signal (chopstick[(i+1) % 5]);\n\
    \    signal (chopstick[i]);\n    signal (room);\n  }\n}\n```\n\n## Solution 2:\
    \ an odd philosopher picks up first her left and then right chopstick, whereas\
    \ an even philosopher picks up her right and then left chopsticks\n\n```\nsemaphore\
    \ chopstick[5]={1,1,1,1,1};\nint i;\nvoid philosopher(int i)\n{\n    while(1){\n\
    \        thinking;\n        if(i%2!=0){\n            wait (chopstick[i]);\n  \
