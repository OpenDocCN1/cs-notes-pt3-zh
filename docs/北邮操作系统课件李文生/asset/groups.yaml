    - 分配和回收后要对空闲区表/队列重新排序。\n\n# 补充：最坏适应法\n- 要求空闲区按**大小递减**的顺序组织空闲区表/队列\n- 分配：进程申请一个大小为\
    \ S 的存储区时，总是检查空闲区表的第一个空闲区的大小是否大于或等于 S。若空闲区小于 S，则分配失败；否则从空闲区中分配 S 的存储区给用户，然后修改和调整空闲区表。\n\
    - 回收：按释放区的首址，查询空闲区表/队列，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址，否则，把释放区作为一个空闲区插入空闲区表/队列。\n\
    - 分配和回收后要对空闲区表/队列重新排序。\n"
  mdcn: "\n\n# 补充：\n## 内存管理需求 (2/5)\n### ■ 保护\n- 进程不应在未经许可的情况下引用另一个进程中的内存位置\n- 必须在执行期间进行检查\n\
    \  - 由于程序可能被重新定位，因此无法检查程序中的绝对地址\n  - 操作系统无法预见程序将进行的所有内存引用\n\n# 补充：\n## 内存管理需求\
    \ (3/5)\n### ▪ 共享\n- 允许多个进程访问同一部分内存\n- 允许每个进程（用户）访问同一份程序副本要更好，而不是让它们各自拥有单独的副本\n\
    \n# 补充：\n## 内存管理需求 (4/5)\n### 逻辑组织\n- 程序以模块形式编写\n- 模块可以独立编写和编译\n- 对模块给予不同程度的保护（只读、仅执行）\n\
    - 共享模块\n\n# 补充：\n## 内存管理需求 (5/5)\n### 物理组织\n- 可用于程序及其数据的内存可能不足\n  - 覆盖技术允许将各个模块分配到同一块内存区域\n\
    - 程序员不知道将有多少空间可用\n\n# 补充：覆盖\n- 仅在任何给定时间保留所需的指令和数据在内存中。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_591_0.png)\n\
    \n# 补充：**覆盖 (续)**\n- 当进程大于分配给它的内存量时需要。\n- 由用户实现，不需要操作系统的特殊支持，覆盖结构的编程设计很复杂\n  -\
    \ 这项任务可能是一项庞大的工作，需要完全了解程序的结构、其代码和数据结构。\n- 目前仅限于微型计算机和其他物理内存有限且缺乏更高级技术硬件支持的系统。\n\
    \n# 补充：覆盖与交换技术\n- 多道程序设计环境下用来扩充内存的两种方法\n- 覆盖技术\n  - 当用户程序所需要的内存空间比分配给它使用的内存空间大时，可以使用覆盖技术。\n\
    \  - 由程序员实现，不需要操作系统特别支持\n  - 设计思想：把程序划分为若干个功能上相对独立的程序段，按照程序的逻辑结构让那些不会同时执行的程序段共享同一块内存区域。\n\
    \  - 对程序员要求很高\n    - 必须十分清楚程序的逻辑结构\n    - 明确规定各程序段的执行和覆盖顺序。\n    - 设计实现覆盖驱动模块。\n\
    - **交换技术**\n  - 由操作系统中的交换程序实现，对用户透明\n  - 将内存某区域中的进程调出内存写入外存交换区（swap out），再从外存交换区中把指定的进程调入内存（swap\
    \ in）并让它执行的一种技术。达到扩充内存的效果。\n- **交换与覆盖的区别**\n  - 覆盖技术要求程序员自己设计覆盖结构，而交换对用户是透明的。\n\
    \  - 交换主要是在进程和进程之间进行，而覆盖则是在同一作业/进程内进行。\n\n# 分配流程\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_595_0.png)\n\
    \n# 动态分区的回收\n- 用户进程执行结束后，存储管理程序要收回已经使用完毕的存储空间，并将其插入空闲分区表/链中。\n- 对于所释放的空闲区，在将它插入空闲分区表/链中之前，要考虑内存中与其上下相邻的存储空间的使用情况，如果有空闲分区，则要进行拼接，使之成为较大的空闲区。\n\
    - 上下相邻分区状态\n  - 上下相邻分区均为空闲分区\n    - 更新上邻空闲区记录的长度=上邻区长度+释放区长度+下邻区长度\n    - 从表/链中取消下邻区的记录\n\
    \  - 上邻分区为空闲分区:\n    - 更新上邻区记录的长度=上邻区长度+释放区长度\n  - 下邻分区为空闲分区\n    - 更新下邻区记录的长度=释放区长度+下邻区长度\n\
    \    - 更新下邻区记录的起始地址=释放区的起始地址\n  - 上下邻分区均非空闲区\n    - 为释放区在表/链中适当的位置建立记录\n\n# 补充：首次适应法\n\
    - 要求空闲区按**首址递增**的次序组织空闲区表（队列）\n- **分配：**当进程申请大小为 S 的内存时，系统从空闲区表的第一个表目开始查询，直到首次找到等于或大于\
    \ S 的空闲区。从该区中划出大小为 S 的分区分配给进程，余下的部分仍作为一个空闲区留在空闲区表中，但要修改其首址和大小。\n- **回收：**按释放区的首址，查询空闲区表，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址；否则，把释放区作为一个空闲区，将其大小和首址按照首地址大小递增的顺序插入到空闲区表的适当位置。\n\
    \n# 补充：分析\n- **注意：**每次分配和回收后空闲区表或空闲区队列都要按首址递增的次序排序。\n- **首次适应法的优点：**\n  - 释放某一存储区时，若与空闲区相邻则合并到相邻空闲分区中去，这种情况并不改变该区在表中的位置，只要修改其大小或首址。\n\
    \  - 这种算法是尽可能地利用低地址空间，从而保证高地址空间有较大的空闲区。\n\n# 补充：最佳适应法\n- 要求按空闲区大小从小到大的次序组成空闲区表/队列\n\
    - 分配：当进程申请一个存储区时，系统从表头开始查找，当找到第一个满足要求的空闲区时，停止查找，并且这个空闲区是最佳的空闲区。\n- 所谓最佳即选中的空闲区是满足要求的最小空闲区。\n\
    - 回收：按释放区的首址，查询空闲区表/队列，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址，否则，把释放区作为一个空闲区插入空闲区表/队列。\n\
    - 分配和回收后要对空闲区表/队列重新排序。\n\n# 补充：最坏适应法\n- 要求空闲区按**大小递减**的顺序组织空闲区表/队列\n- 分配：进程申请一个大小为\
    \ S 的存储区时，总是检查空闲区表的第一个空闲区的大小是否大于或等于 S。若空闲区小于 S，则分配失败；否则从空闲区中分配 S 的存储区给用户，然后修改和调整空闲区表。\n\
    - 回收：按释放区的首址，查询空闲区表/队列，若有与释放区相邻的空闲区，则合并到相邻的空闲区中，并修改该区的大小和首址，否则，把释放区作为一个空闲区插入空闲区表/队列。\n\
    - 分配和回收后要对空闲区表/队列重新排序。\n\n"
