  md: '

    ## Supplement: Single Buffer (Cont.)


    ### Block-oriented


    - User process can process one block of data while next block is read in

    - Swapping can occur since input is taking place in system memory, not user memory

    - Operating system keeps track of assignment of system buffers to user processes


    ### Stream-oriented


    - Used a line at a time

    - User input from a terminal is one line at a time with carriage return signaling
    the end of the line

    - Output to the terminal is one line at a time


    ## Supplement: Double Buffer


    - Use two system buffers instead of one

    - A process can transfer data to or from one buffer while the operating system
    empties or fills the other buffer


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_892_0.png)


    ## Supplement: Circular Buffer


    - More than two buffers are used

    - Each individual buffer is one unit in a circular buffer

    - Used when I/O operation must keep up with process


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_893_0.png)

    '
  mdcn: '


    ## 补充：单缓冲（续）


    ### 按块处理


    - 用户进程可以在读取下一个数据块的同时处理一个数据块

    - 由于输入是在系统内存中进行，而不是在用户内存中，因此可以进行交换

    - 操作系统负责跟踪系统缓冲区与用户进程的分配情况


    ### 按流处理


    - 一次使用一行

    - 来自终端的用户输入是一次一行，以回车符表示行尾

    - 输出到终端也是一次一行


    ## 补充：双缓冲


    - 使用两个系统缓冲区而不是一个

    - 进程可以在操作系统清空或填充另一个缓冲区时向一个缓冲区传输数据或从一个缓冲区传输数据


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_892_0.png)


    ## 补充：循环缓冲


    - 使用两个以上的缓冲区

    - 每个单独的缓冲区是循环缓冲区中的一个单元

    - 当 I/O 操作必须跟上进程时使用


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_893_0.png)


    '
