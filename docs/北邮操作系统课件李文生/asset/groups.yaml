    - Unix 文件系统 (UFS) 实现：\n  - 对打开文件的写入立即可被同一打开文件的其他用户看到\n  - 共享文件指针以允许多个用户并发读取和写入\n\
    - AFS 具有会话语义\n  - 写入仅对在文件关闭后开始的会话可见\n\n## 10.6 保护\n\n- **文件所有者/创建者应能够控制：**\n \
    \ - 可以做什么\n  - 由谁来做\n- **访问类型**\n  - **读**：从文件中读取\n  - **写**：写入或重写文件\n  - **执行**：将文件加载到内存并执行它\n\
    \  - **追加**：在文件末尾写入新信息\n  - **删除**：删除文件并释放其空间以供可能重用\n  - **列出**：列出文件的名称和属性\n \
    \ - 其他操作，例如**重命名**、**复制**或**编辑**文件，也可能受控制。\n\n## 访问控制 (1/2)\n\n- 访问模式：**读, 写,\
    \ 执行**\n- 访问控制列表 (ACL)：与每个文件关联并指定用户名以及允许每个用户的访问类型。\n- 三类用户\n  - **所有者**：创建文件的用户。\n\
