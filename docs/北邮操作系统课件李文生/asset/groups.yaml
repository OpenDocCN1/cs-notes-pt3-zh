    \ Mechanism\n\n编号：从上向下 0, 1, ..., T-1\n\n编号：依次为 0,1,...,S-1\n\n编号：从外向内 0, 1, ...,\
    \ C-1\n\n磁盘块编号：从0柱面、0磁道的0扇区开始，依次为0,1,......,S-1; 再对0柱面、1磁道的S个扇区依次编号为S,S+1,......,2S-1;\
