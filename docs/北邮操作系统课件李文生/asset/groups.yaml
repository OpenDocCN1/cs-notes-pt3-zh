    \ and other registers\n- Update the process control block (PCB) of the process\
    \ that is currently running\n- Move process control block (PCB) to appropriate\
    \ queue - ready, waiting\n- Select another process for execution (--scheduling)\n\
    - Update the process control block (PCB) of the process selected\n- Update memory-management\
    \ data structures\n- Restore context of the selected process\n\n## Context Switch\n\
    \n- The context of a process is represented in the PCB of the process.\n- Context-switch\
    \ time is overhead; the system does no useful work while switching.\n- Context-switch\
    \ times dependent on hardware support.\n\n## 3.3 Operations on Processes\n\n##\
    \ Process Creation & Process Termination\n\n## Reason for Process Creation\n\n\
    - Submission of a batch job\n- User logs on\n- Created to provide a service such\
    \ as printing\n- Process creates another process\n\n## Process Creation\n\nParent\
    \ process create children processes, which, in turn create other processes, forming\
    \ a tree of processes.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_202_0.png)\n\
    \n## A tree of processes on a typical Solaris\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_203_0.png)\n\
    \n## Process Creation (1/3)\n\n- Assign a unique process identifier\n- Allocate\
    \ space for the process\n- Initialize process control block (PCB)\n- Set up appropriate\
    \ linkages\n  - e.g. add new process to linked list used for scheduling queue\n\
    - Create or expand other data structures\n  - e.g. maintain an accounting file\n\
    \n## Process Creation (2/3)\n\n- **Resource sharing**\n  - Parent and children\
    \ share all resources.\n  - Children share subset of parent’s resources.\n  -\
    \ Parent and child share no resources.\n\nWhen a process is created, it obtains\
    \ initialization data that may be passed along from the parent process to the\
    \ child process.\n\n- **Execution**\n  - Parent and children execute concurrently.\n\
    \  - Parent waits until some or all of its children terminate.\n"
  mdcn: "\n\n## 调度器（续）\n\n- **进程可以描述为以下两种类型之一：**\n  - *I/O 密集型进程* – 花在 I/O 操作上的时间多于计算，CPU\
    \ 突发次数多且都很短。\n  - *CPU 密集型进程* – 花在计算上的时间多；CPU 突发次数少但都很长。\n- **选择一个良好的进程组合。**\n\
    \  - 如果所有进程都是 I/O 密集型的，准备队列几乎总是空的，CPU 调度程序将几乎没有工作可做。\n  - 如果所有进程都是 CPU 密集型的，I/O\
    \ 等待队列几乎总是空的，设备将处于未使用状态。\n\n## 中期调度的加入\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_195_0.png)\n\
    \n## 补充：挂起的进程\n\n- 处理器比 I/O 快，因此所有进程都可能在等待 I/O\n- 将这些进程交换到磁盘以释放更多内存\n- 等待状态在被交换到磁盘时变为交换等待\n\
    - 两个新的状态\n  - 交换等待（挂起等待/阻塞）\n  - 交换就绪（挂起就绪）\n\n## 补充：两种交换状态\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_197_0.png)\n\
    \n## 补充：进程被交换出的原因\n\n| 原因 | 描述 |\n|---|---|\n| 交换 | 操作系统需要释放足够的内存以引入一个准备执行的进程。\
    \ |\n| 其他操作系统原因 | 操作系统可能会挂起一个后台或实用程序进程，或被怀疑导致问题的进程。 |\n| 交互式用户请求 | 用户可能希望暂停程序的执行以进行调试或与资源的使用相关。\
    \ |\n| 定时 | 进程可能定期执行（例如，记账或系统监控进程），并在等待下一个时间间隔时被挂起。 |\n| 父进程请求 | 父进程可能希望挂起一个后代进程以检查或修改该挂起进程，或协调各个后代的活动。\
    \ |\n\n## 3.2.3 上下文切换\n\n当 CPU 切换到另一个进程时，系统必须保存旧进程的状态并加载新进程的保存状态。称为**上下文切换**。\n\
    \n- 保存处理器上下文，包括程序计数器和其他寄存器\n- 更新当前运行进程的进程控制块（PCB）\n- 将进程控制块（PCB）移动到适当的队列 - 就绪、等待\n\
    - 选择另一个进程执行（--调度）\n- 更新所选进程的进程控制块（PCB）\n- 更新内存管理数据结构\n- 恢复所选进程的上下文\n\n## 上下文切换\n\
    \n- 进程的上下文在该进程的 PCB 中表示。\n- 上下文切换时间是开销；切换期间系统不做任何有用工作。\n- 上下文切换时间取决于硬件支持。\n\n\
    ## 3.3 进程操作\n\n## 进程创建与进程终止\n\n## 进程创建的原因\n\n- 批处理作业的提交\n- 用户登录\n- 创建以提供服务，例如打印\n\
    - 进程创建另一个进程\n\n## 进程创建\n\n父进程创建子进程，而子进程又创建其他进程，形成一个进程树。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_202_0.png)\n\
    \n## 典型 Solaris 上的进程树\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_203_0.png)\n\
    \n## 进程创建（1/3）\n\n- 分配一个唯一的进程标识符\n- 为进程分配空间\n- 初始化进程控制块（PCB）\n- 设置适当的链接\n  - 例如，将新进程添加到用于调度队列的链表中\n\
    - 创建或扩展其他数据结构\n  - 例如，维护一个记账文件\n\n## 进程创建（2/3）\n\n- **资源共享**\n  - 父进程和子进程共享所有资源。\n\
    \  - 子进程共享父进程资源的一个子集。\n  - 父进程和子进程不共享任何资源。\n\n进程创建时，它会获得初始化数据，该数据可能从父进程传递给子进程。\n\
    \n- **执行**\n  - 父进程和子进程并发执行。\n  - 父进程等待其部分或全部子进程终止。\n\n"
