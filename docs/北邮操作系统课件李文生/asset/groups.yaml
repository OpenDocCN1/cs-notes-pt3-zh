    \ Distributed Systems\n\n- 在多个物理处理器之间分配计算。\n- *松耦合系统 -- 分布式系统*\n    - 每个处理器都有自己的本地内存；\n\
    \    - 处理器通过各种通信线路相互通信，例如高速总线或电话线。\n- 分布式系统的优点。\n    - 资源共享\n    - 计算加速 – 负载共享\n\
    \    - 可靠性\n    - 通信\n\n### Basic concept\n\n- 需要网络基础设施。\n- 局域网（LAN）或广域网（WAN）\n\
    - 可能是客户端-服务器或点对点系统。\n\n### General Structure of Client-Server\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_71_0.png)\n\
    \n- **网络操作系统**\n    - 在网络上提供文件共享\n    - 提供通信方案，允许不同计算机上的不同进程交换消息。\n    - 独立于网络上的其他计算机运行\n\
    - **分布式操作系统**\n    - 计算机之间的自主性较低\n    - 给人一种网络由单一操作系统控制的印象。\n\n## Real-Time Systems\n\
    \n- 当处理器操作或数据流存在严格的时间要求时使用。\n- 通常用作专用应用中的控制设备，例如控制科学实验、医学成像系统、工业控制系统和某些显示系统。\n\
    - 具有明确定义固定的时间约束。内核延迟需要有界。\n- 实时系统分为两类\n    - 硬实时系统\n    - 软实时系统。\n\n## Multimedia\
    \ systems\n\n- 多媒体数据包括音频和视频文件以及常规文件\n\n## Handheld systems\n\n- **个人数字助理（PDAs）**\n\
    \    - Palm 和 Pocket PCs 以及蜂窝电话\n    - 使用专用嵌入式 OS\n- **问题：**\n    - 内存大小有限\n \
    \   - 处理器速度慢\n    - 显示屏小。\n\n## 1.12* Computing Environments\n\n- **传统计算机**\n\
    \    - **随时间模糊**\n    - **办公环境**\n        - PC 连接到网络，终端连接到大型机或小型机提供批处理和分时\n  \
    \      - 现在门户允许网络化和远程系统访问相同资源\n    - **家庭网络**\n        - 以前是单一系统，然后是调制解调器\n  \
    \      - 现在是防火墙，网络化\n\n### Client-Server Computing\n\n- 哑终端被智能 PC 取代\n- 现在许多系统都是**服务器**，响应由**客户端**生成的请求\n\
    \    - 计算服务器为客户端提供接口以请求服务（即数据库）\n    - 文件服务器为客户端提供接口以存储和检索文件\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_80_0.png)\n\
    \n### Peer-to-Peer Computing\n\n- **另一种分布式系统模型**\n- **P2P 不区分客户端和服务器**\n    -\
    \ 相反所有节点都被视为对等体\n    - 可能各自充当客户端、服务器或两者\n    - 节点必须加入 P2P 网络\n        - 在网络上的中央查找服务上注册其服务，或\n\
    \        - 广播服务请求并通过 *discovery protocol* 响应服务请求\n    - **示例包括 *Napster* 和 *Gnutella***\n\
    \n"
