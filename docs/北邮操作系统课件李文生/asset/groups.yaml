  - '[PAGE 397]


    # Example


    +   - Concurrent access to shared data may result in data inconsistency.


    +   - Maintaining data consistency requires mechanisms to ensure the orderly execution
    of cooperating processes.


    +   - Shared-memory solution to bounded-buffer problem (Chapter 3) allows at most
    $n - 1$ items in buffer at the same time. A solution, where all $N$ buffers are
    used is not simple.


    +   - Suppose that we modify the producer-consumer code by adding a integer variable
    *counter*, initialized to 0 and incremented each time a new item is added to the
    buffer, and decremented each time an item is removed from the buffer.'
  - "[PAGE 398]\n\n# Bounded-Buffer procedure-consumer problem\n\n+   - Shared data\n\
    \n```\n```c\n#define BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem\
    \ buffer[BUFFER_SIZE];\nint in = 0;\nint out = 0;\nint counter = 0;\n```\n```"
  - "[PAGE 399]\n\n# Bounded-Buffer procedure-consumer problem\n\n```\nProducer process\n\
    \nitem nextProduced;\n\nwhile (1) {\n    while (counter == BUFFER_SIZE)\n    \
    \    ; /* do nothing */\n    buffer[in] = nextProduced;\n    in = (in + 1) % BUFFER_SIZE;\n\
    \    counter++;\n}\n```\n\n```\nConsumer process\n\nitem nextConsumed;\n\nwhile\
    \ (1) {\n    while (counter == 0)\n        ; /* do nothing */\n    nextConsumed\
    \ = buffer[out];\n    out = (out + 1) %\n    BUFFER_SIZE;\n    counter--;\n}\n\
    ```"
  - "[PAGE 400]\n\n# Bounded-Buffer procedure-consumer problem\n\n+   - The statements\n\
    +   counter++;\n+   counter--;\n+   \n+   must be performed *atomically*.\n\n\
    +   - **Atomic operation** means an operation that completes in its entirety without\
    \ interruption."
  - '[PAGE 401]


    # Bounded-Buffer procedure-consumer problem


    +   The statement “ count++ ” may be implemented in machine language as:

    +   register₁ = counter

    +   register₁ = register₁ + 1

    +   counter = register₁


    +   The statement “ count-- ” may be implemented as:

    +   register₂ = counter

    +   register₂ = register₂ − 1

    +   counter = register₂'
  - "[PAGE 402]\n\n# Race Condition\n\n▪ Assume **counter** is initially 5. One interleaving\
    \ of statements is:\n\n+   producer:  $register_1 = counter$    (*$register_1\
    \ = 5$*)  \n+   producer:  $register_1 = register_1 + 1$    (*$register_1 = 6$*)\
    \  \n+   consumer:  $register_2 = counter$    (*$register_2 = 5$*)  \n+   consumer:\
    \  $register_2 = register_2 - 1$    (*$register_2 = 4$*)  \n+   producer:  $counter\
    \ = register_1$    (*$counter = 6$*)  \n+   consumer:  $counter = register_2$\
    \    (*$counter = 4$*)\n\n▪ The value of **counter** may be either 4 or 6, where\
    \ the correct result should be 5."
  - '[PAGE 403]


    # Race Condition (Cont.)


    ▪ **Race condition:** The situation where several processes access and manipulate
    shared data concurrently. The final value of the shared data depends upon the
    particular order in which the access takes place.


    +   ▪ **Race conditions in operating systems**

    +     - The code implementing an OS is subject to several possible race conditions.

    +       - System open-file-table

    +       - Structures for maintaining memory allocation, for maintaining process
    lists, and for interrupt handling


    ▪ **To prevent race conditions, concurrent processes must be synchronized.**


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_403_0.png)'
  - '[PAGE 404]


    # 6.2 The Critical-Section Problem


    +   - *n* processes all competing to use some shared data

    +   - Each process has a code segment, called *critical section*, in which the
    shared data is accessed.

    +   - Problem – ensure that when one process is executing in its critical section,
    no other process is to be allowed to execute in its critical section.

    +   - Need to design a protocol that the processes can use to cooperate.

    +     - Each process must **request** permission to enter its critical section.

    +     - The section of code implementing this request is the **entry section**.

    +     - The critical section may be followed by an **exit section**.

    +     - The remaining code is the remainder section.'
