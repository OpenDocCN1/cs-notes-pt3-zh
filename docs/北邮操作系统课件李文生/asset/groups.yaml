  mdcn: "\n\n## 系统调用示例\n\n- 编写一个简单的程序，从文件中读取数据并将其复制到另一个文件。\n  - 程序需要输入文件和输出文件的名称。\n\
    \  - 打开输入文件，创建输出文件。\n  - 循环：从输入文件读取并写入输出文件。\n  - 关闭两个文件，向控制台写入一条消息，然后正常终止。\n\n\
    ## 将一个文件的内容复制到另一个文件的系统调用序列\n\n源文件\n\n目标文件\n\n示例系统调用序列\n获取输入文件名\n向屏幕写入提示\n接受输入\n\
    获取输出文件名\n向屏幕写入提示\n接受输入\n打开输入文件\n如果文件不存在，则中止\n创建输出文件\n如果文件已存在，则中止\n循环\n从输入文件读取\n\
    写入输出文件\n直到读取失败\n关闭输出文件\n向屏幕写入完成消息\n正常终止\n\n## 标准 API 示例\n\n- 考虑 Win32 API 中的 ReadFile()\
    \ 函数——一个用于从文件读取数据的函数\n\n```\nreturn value\n↓\nBOOL  ReadFile  (HANDLE      file,\n\
    \                  LPVOID      buffer,\n                  DWORD       bytes To\
    \ Read,\n                  LPDWORD     bytes Read,\n                  LPOVERLAPPED\
    \ ovl);\n↑\nfunction name\nparameters\n```\n\n- 对传递给 ReadFile() 的参数说明\n\n  - HANDLE\
    \ file——要读取的文件\n  - LPVOID buffer——数据将被读入和写出的缓冲区\n  - DWORD bytesToRead——要读入缓冲区的字节数\n\
    \  - LPDWORD bytesRead——上一次读取期间读取的字节数\n  - LPOVERLAPPED ovl——指示是否正在使用重叠 I/O\n\n\
    ## 标准 C 库示例\n\n- C 程序调用 printf() 库函数，该函数调用 write() 系统调用\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_121_0.png)\n\
    \n```c\n#include <stdio.h>\nint main ()\n{\n  ⋮\n  printf (\"Greetings\");\n \
    \ ⋮\n  return 0;\n}\n```\n\n用户模式\n\n内核模式\n\n标准 C 库\n\nwrite()\n\nwrite() 系统调用\n\
    \n## 系统调用参数传递\n\n- 通常，所需的信息不仅仅是所需系统调用的标识\n  - 信息的确切类型和数量因操作系统和调用而异\n- 向操作系统传递参数有三种常用方法\n\
    \  - 最简单：将参数放在*寄存器*中\n    - 某些情况下，参数可能比寄存器还多\n  - 参数存储在内存中的*块*或表中，并将块的地址作为参数通过寄存器传递\n\
    \    - 这种方法被 Linux 和 Solaris 采用\n  - 参数由程序放置或*推入*到*栈*中，并由操作系统从栈中*弹出*\n  - （块和栈的方法不限制所传递参数的数量或长度）\n\
    \n## 通过表传递参数\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_123_0.png)\n\nX：调用参数\n\
    \n加载地址 X\n系统调用 13\n\nX\n寄存器\n\n使用表 X 中的参数\n\n系统调用 13 的代码\n\n用户程序\n\n操作系统\n\n##\
    \ 2.4 系统调用的类型\n\n- 进程控制\n- 文件管理\n- 设备管理\n- 信息维护\n- 通信\n\n## 进程控制\n\n- 结束、中止\n\
    - 加载、执行\n- 创建进程、终止进程\n- 获取进程属性、设置进程属性\n- 等待时间\n- 等待事件、信号事件\n- 分配和释放内存\n\n## 设备管理\n\
    \n- 请求设备、释放设备\n- 读、写、重新定位\n- 获取设备属性、设置设备属性\n- 逻辑上附加或分离设备\n\n## 信息维护\n\n- 获取时间或日期、设置时间或日期\n\
    - 获取系统数据、设置系统数据\n- 获取进程、文件或设备属性\n- 设置进程、文件或设备属性\n\n## 通信\n\n- 创建、删除通信连接\n- 发送、接收消息\n\
    - 传输状态信息\n- 附加或分离远程设备\n- 两种常见的通信模型\n  - **消息传递模型**：信息通过操作系统提供的进程间通信设施（IPC）进行交换。\n\
    \  - **共享内存模型**：进程使用映射内存系统调用获取对其他进程所拥有的内存区域的访问权限。\n\n"
