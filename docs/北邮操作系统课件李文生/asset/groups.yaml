    \n## 2.3 系统调用\n\n- **操作系统所提供服务的编程接口**\n- 通常用高级语言（C 或 C++）编写\n- 程序大多通过高级应用程序编程接口（API）访问，而非直接使用系统调用\n\
    - 最常见的三种 API 是\n  - 用于 Windows 的 Win32 API\n  - 用于基于 POSIX 的系统的 POSIX API（包括几乎所有版本的\
    \ UNIX、Linux 和 Mac OS X）\n    - POSIX：可移植操作系统接口（Portable Operating System Interface\
    \ for computer environment）\n  - 用于 Java 虚拟机（JVM）的 Java API\n- 为什么使用 API 而不是系统调用？\n"
