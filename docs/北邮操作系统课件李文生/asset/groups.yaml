  md: "\n## Communication Models (1/2)\n\n- Communication may take place using either\
    \ message passing or shared memory.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_216_0.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_216_1.png)\n\n## Communication Models\
    \ (2/2)\n\n- **Message passing is**\n  - useful when smaller numbers of data need\
    \ to be exchanged, because no conflicts need to be avoided.\n  - easier to implement\
    \ for intercomputer communication.\n- **Shared memory allows maximum speed and\
    \ convenience of communication.**\n  - It can be done at memory speeds when within\
    \ a computer.\n\n## 3.4.1 Shared-memory systems\n\n### Producer-Consumer Problem\n\
    \n- A common paradigm for cooperating processes: *producer* process produces information\
    \ that is consumed by a *consumer* process.\n- We must have available a buffer\
    \ of items that can be filled by the *producer* and emptied by the *consumer*.\n\
    \  - A *producer* can produce one item while the *consumer* is consuming another\
    \ item.\n  - The *producer* and *consumer* must be **synchronized**.\n- Two types\
    \ of buffers are used\n  - *unbounded-buffer* places no practical limit on the\
    \ size of the buffer.\n  - *bounded-buffer* assumes that there is a fixed buffer\
    \ size.\n\n## Shared-Memory Solution to Bounded-Buffer problem\n\n### Shared data\n\
    \n```\n#define BUFFER_SIZE 10\ntypedef struct {\n...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\n```\n\n- **in** points to the next free position in\
    \ the buffer;\n- **out** points to the first full position in the buffer;\n- The\
    \ buffer is empty when **in == out**;\n- The buffer is full when **((in + 1) %\
    \ BUFFER_SIZE) == out**;\n- The solution is correct, but can only use **BUFFER_SIZE-1**\
    \ elements.\n\n## Shared Buffer--Circular array\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_220_0.png)\n\
    \n- The buffer is empty when `in == out;`\n- The buffer is full when `(in + 1)\
    \ % BUFFER_SIZE == out.`\n\nSolution is correct, but can only use BUFFER_SIZE-1\
    \ elements.\n\n### Bounded-Buffer — *Producer Process*\n\n```\nitem nextProduced;\n\
    while (1) {    /* produce an item in nextProduced */\n              while (((in\
    \ + 1) % BUFFER_SIZE) == out)\n                    ; /* do nothing */\n      \
    \        buffer[in] = nextProduced;\n              in = (in + 1) % BUFFER_SIZE;\n\
    \            }\n```\n\n### Bounded-Buffer — *Consumer Process*\n\n```\nitem nextConsumed;\n\
    while (1) {  while (in == out) ; /* do nothing */\n              nextConsumed\
    \ = buffer[out];\n              out = (out + 1) % BUFFER_SIZE;\n             \
    \ /* consume the item in nextConsumed */\n            }\n```\n\n## Implementation\
    \ Questions\n\n- Direct / indirect communication?\n- Synchronous / asynchronous\
    \ communication?\n- Automatic / explicit buffering?\n- How are links established?\n\
    - Can a link be associated with more than two processes?\n- How many links can\
    \ there be between every pair of communicating processes?\n- What is the capacity\
    \ of a link?\n- Is the size of a message that the link can accommodate fixed or\
    \ variable?\n- Is a link unidirectional or bi-directional?\n\n## Direct Communication--naming\n\
    \n- **Processes must name each other explicitly:**\n  - `send(P, message)` – send\
    \ a message to process P\n  - `receive(Q, message)` – receive a message from process\
    \ Q\n- **Properties of communication link**\n  - Links are established automatically.\n\
    \  - A link is associated with exactly one pair of communicating processes.\n\
    \  - Between each pair there exists exactly one link.\n  - The link may be unidirectional,\
    \ but is usually bi-directional.\n- **Disadvantages**\n  - Limited modularity\
    \ of the resulting process definitions\n\n## Indirect Communication(1/3)\n\n-\
    \ Messages are sent and received from mailboxes (also referred to as ports).\n\
    \  - Each mailbox has a unique id.\n  - Processes can communicate only if they\
    \ share a mailbox.\n- Primitives are defined as:\n  - `send(A, message)` – send\
    \ a message to mailbox A\n  - `receive(A, message)` – receive a message from mailbox\
    \ A\n- Properties of communication link\n  - A link is established only if processes\
    \ share a common mailbox.\n  - A link may be associated with many processes.\n\
    \  - Each pair of processes may share several communication links.\n  - A link\
    \ may be unidirectional or bi-directional.\n"
  mdcn: "\n\n## 通信模型 (1/2)\n\n- 通信可以通过消息传递或共享内存进行。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_216_0.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_216_1.png)\n\n## 通信模型 (2/2)\n\n- **消息传递**在需要交换的数据量较小时很有用，因为无需避免冲突。\n\
    - 对于计算机间通信，消息传递更容易实现。\n- **共享内存可以实现最大速度和通信便利性。**\n  - 在计算机内部，它可以以内存速度进行。\n\n##\
    \ 3.4.1 共享内存系统\n\n### 生产者-消费者问题\n\n- 协作进程的一种常见范式：*生产者*进程产生信息，由*消费者*进程消费。\n- 我们必须有一个缓冲区，其中的项目可以由*生产者*填充，并由*消费者*清空。\n\
    \  - *生产者*可以在*消费者*消费另一个项目的同时产生一个项目。\n  - *生产者*和*消费者*必须**同步**。\n- 使用了两种类型的缓冲区：\n\
    \  - *无界缓冲区*对缓冲区的大小没有实际限制。\n  - *有界缓冲区*假定缓冲区大小固定。\n\n## 有界缓冲区问题的共享内存解决方案\n\n###\
    \ 共享数据\n\n```\n#define BUFFER_SIZE 10\ntypedef struct {\n...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\n```\n\n- **in** 指向缓冲区中下一个空闲位置；\n- **out** 指向缓冲区中第一个已满位置；\n\
    - 当 **in == out** 时缓冲区为空；\n- 当 **((in + 1) % BUFFER_SIZE) == out** 时缓冲区已满；\n-\
    \ 该解决方案是正确的，但只能使用 **BUFFER_SIZE-1** 个元素。\n\n## 共享缓冲区——环形数组\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_220_0.png)\n\
    \n- 当 `in == out;` 时缓冲区为空；\n- 当 `(in + 1) % BUFFER_SIZE == out.` 时缓冲区已满。\n\n解决方案是正确的，但只能使用\
    \ BUFFER_SIZE-1 个元素。\n\n### 有界缓冲区——*生产者进程*\n\n```\nitem nextProduced;\nwhile (1)\
    \ {    /* produce an item in nextProduced */\n              while (((in + 1) %\
    \ BUFFER_SIZE) == out)\n                    ; /* do nothing */\n             \
    \ buffer[in] = nextProduced;\n              in = (in + 1) % BUFFER_SIZE;\n   \
    \         }\n```\n\n### 有界缓冲区——*消费者进程*\n\n```\nitem nextConsumed;\nwhile (1) {\
    \  while (in == out) ; /* do nothing */\n              nextConsumed = buffer[out];\n\
    \              out = (out + 1) % BUFFER_SIZE;\n              /* consume the item\
    \ in nextConsumed */\n            }\n```\n\n## 实现问题\n\n- 直接/间接通信？\n- 同步/异步通信？\n\
    - 自动/显式缓冲？\n- 链路如何建立？\n- 一条链路可以关联两个以上的进程吗？\n- 每对通信进程之间可以有多少条链路？\n- 链路的容量是多少？\n\
    - 链路能够容纳的消息大小是固定的还是可变的？\n- 链路是单向的还是双向的？\n\n## 直接通信——命名\n\n- **进程必须显式地相互命名：**\n\
    \  - `send(P, message)` – 向进程 P 发送消息\n  - `receive(Q, message)` – 从进程 Q 接收消息\n\
    - **通信链路的属性**\n  - 链路自动建立。\n  - 一条链路恰好关联一对通信进程。\n  - 每对进程之间恰好存在一条链路。\n  - 链路可以是单向的，但通常是双向的。\n\
    - **缺点**\n  - 所生成的进程定义的模块化程度有限\n\n## 间接通信（1/3）\n\n- 消息通过邮箱（也称为端口）发送和接收。\n  - 每个邮箱都有唯一的\
    \ id。\n  - 进程只有在共享邮箱时才能通信。\n- 原语定义如下：\n  - `send(A, message)` – 向邮箱 A 发送消息\n \
    \ - `receive(A, message)` – 从邮箱 A 接收消息\n- 通信链路的属性\n  - 只有当进程共享一个公共邮箱时，才会建立链路。\n\
    \  - 一条链路可以关联多个进程。\n  - 每对进程可以共享多条通信链路。\n  - 链路可以是单向的或双向的。\n\n"
