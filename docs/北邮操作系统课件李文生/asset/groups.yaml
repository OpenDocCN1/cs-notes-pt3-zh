    {\n  int pid,fd[2];\n  char buf[30],s[30];\n  pipe(fd);\n  while((pid=fork())==-1);\n\
    \  if (pid==0) {\n    sprintf(buf, \"this is an example\\n\");\n    write(fd[1],buf,30);\n\
