    # 1.12* Computing Environments


    +   - **Traditional computer**

    +     - **Blurring over time**

    +     - **Office environment**

    +       - PCs connected to a network, terminals attached to mainframe or minicomputers
    providing batch and timesharing

    +       - Now portals allowing networked and remote systems access to same resources

    +     - **Home networks**

    +       - Used to be single system, then modems

    +       - Now firewalled, networked'
  - '[PAGE 80]


    # Computing Environments (Cont.)


    # Client-Server Computing


    +   - Dumb terminals supplanted by smart PCs

    +   - Many systems now **servers**, responding to requests generated by **clients**

    +     - Compute-server provides an interface to client to request services (i.e.
    database)

    +     - File-server provides interface for clients to store and retrieve files


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_80_0.png)'
  - '[PAGE 81]


    # Peer-to-Peer Computing


    +   - **Another model of distributed system**

    +   - **P2P does not distinguish clients and servers**

    +     - Instead all nodes are considered peers

    +     - May each act as client, server or both

    +     - Node must join P2P network

    +       - Registers its service with central lookup service on network, or

    +       - Broadcast request for service and respond to requests for service via
    *discovery protocol*

    +     - **Examples include *Napster* and *Gnutella***'
