    \  wait (chopstick[(i+1) % 5]);\n            wait (chopstick[i]);\n        }\n\
    \        eating;\n        signal (chopstick[(i+1) % 5]);\n        signal (chopstick[i]);\n\
    \    }\n}\n```\n\n## 6.7 Monitors\n\n- High-level synchronization construct that\
    \ allows the safe sharing of an abstract data type among concurrent processes.\n\
    - Monitor is a software module\n- Chief characteristics\n  - Local data variables\
    \ are accessible only by the monitor\n  - Process enters monitor by invoking one\
    \ of its procedures\n  - Only one process may be executing in the monitor at a\
    \ time\n\n```\nmonitor monitor-name\n{\n    shared variable declarations\n   \
    \ procedure body P1 (...)\n    { ... }\n    procedure body P2 (...)\n    { ...\
    \ }\n    procedure body Pn (...)\n    { ... }\n    {\n    initialization code\n\
    \    }\n}\n```\n\n## Schematic View of a Monitor\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_436_0.png)\n\
    \n## Condition variable and operations on it\n\n- To allow a process to wait within\
    \ the monitor, a *condition* variable must be declared, as\n\n  `condition x,\
    \ y;`\n- Condition variable can only be used with the operations *wait* and *signal*.\n\
    \  - The operation\n\n    `x.wait();`\n    means that the process invoking this\
    \ operation is suspended until another process invokes\n\n    `x.signal();`\n\
    \  - The `x.signal()` operation resumes exactly one suspended process. If no process\
    \ is suspended, then the signal operation has no effect.\n\n## Monitor With Condition\
    \ Variables\n\nqueue associated with x, y conditions\n\nshared data\n\nentry queue\n\
