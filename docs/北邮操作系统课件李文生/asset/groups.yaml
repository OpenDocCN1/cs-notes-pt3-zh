  mdcn: "\n\n## 10.1 文件概念\n\n- 连续的逻辑地址空间。\n- 信息存储的统一逻辑视图。\n- 文件是记录在辅助存储器上的相关信息的命名集合。\n\
    - 通常，文件代表程序和数据。\n  - 数据文件\n    - 数字\n    - 字符\n    - 二进制\n  - 程序\n    - 源代码\n\
    \    - 目标代码\n- 文件可能是自由形式的，也可能是严格格式化的。\n- 文件中的信息由其创建者定义。\n\n## 文件属性\n\n- **Name**\
    \ – 仅以人类可读形式保存的信息。\n- **Identifier** – 文件的非人类可读名称，是系统内唯一标识该文件的数字。\n- **Type**\
    \ – 支持不同类型的系统所需要的。\n- **Location** – 指向设备上文件位置的指针。\n- **Size** – 文件的当前大小。\n- **Protection**\
    \ – 访问控制信息，控制谁可以进行读、写、执行。\n- **Time, date, and user identification** – 用于保护、安全和使用监控的数据。\n\
    - 有关文件的信息保存在目录结构中，该结构维护在磁盘上。\n\n## 文件操作 (1/2)\n\n文件是一种抽象数据类型\n\n- **Create** –\
    \ 找到空间，为文件在目录中创建条目。\n- **Write** – 文件名，要写入的信息。*write* 指针。\n- **Read** – 文件名，内存中的位置。*read*\
    \ 指针。\n- **Reposition** within file – 文件定位，无需 I/O。\n- **Delete** – 名称，释放文件空间，删除目录条目。\n\
    - **Truncate** – 将长度重置为 0，释放文件空间。\n- 这些基本操作可以组合起来执行其他文件操作。\n\n## 文件操作 (2/2)\n\n\
    - Open-file table\n- Open(*Fᵢ*) – 在磁盘上的目录结构中搜索条目 *Fᵢ*，并将条目的内容移动到打开文件表中。返回指向打开文件表中条目的指针\n\
    - Close (*Fᵢ*) – 将打开文件表中条目 *Fᵢ* 的内容移动到磁盘上的目录结构中。\n- 若干用户可能同时打开文件。两个层级的内部表：\n \
    \ - Process open-file table，进程级表，跟踪进程已打开的所有文件。\n  - System open-file table，系统级表，包含与进程无关的信息，如文件在磁盘上的位置、访问日期、文件大小。\n\
    - 与打开文件相关联的信息：文件指针、文件打开计数、文件的磁盘位置、访问权限。\n\n## 与打开文件相关联的信息\n\n管理打开文件需要若干数据：\n\n\
    - **File pointer**：指向最后一次读写位置的指针，按拥有文件打开的进程区分\n- **File-open count**：文件被打开次数的计数器——以便在最后一个进程关闭时允许从打开文件表中移除数据\n\
    - **Disk location of the file**：数据访问信息的缓存\n- **Access rights**：按进程的访问模式信息\n\n\
    ## 打开文件锁定\n\n- 由某些操作系统和文件系统提供\n- 调停对文件的访问\n- 共享锁和独占锁（类似于读锁、写锁）\n- Mandatory(强制的)\
    \ 或 advisory(劝告的)：\n  - Mandatory – 根据持有的锁和请求的锁拒绝访问\n  - Advisory – 进程可以查找锁的状态并决定如何操作\n\
    \n## 文件类型\n\n| file type | usual extension | function |\n|---|---|---|\n| executable\
    \ | exe, com, bin or none | read to run machine-language program |\n| object |\
    \ obj, o | compiled, machine language, not linked |\n| Source code | c, cpp, java,\
    \ psa, asm, a | source code in various languages |\n| Batch | bat, sh | commands\
    \ to the command interpreter |\n| text | txt, doc | textual data, documents |\n\
    | Word processor | wp, tex, rrf, doc | various word-processor formats |\n| library\
    \ | lib, a, so, dll, mpeg, mov, rm | libraries of routines for programmers |\n\
    | Print or view | arc, zip, tar mpeg, mov, rm | ASCII or binary file in a format\
    \ for printing or viewing |\n| archive | arc, zip, tar | related files grouped\
    \ into one file, sometimes compressed, for archiving or storage |\n| multimedia\
    \ | mpeg, mov, rm | binary file containing audio or A/V information |\n\n"
