    // Wait until child process exits.\nWaitForSingleObject( pi.hProcess, INFINITE\
    \ );\nprintf( \"parent exit\" );\n// Close process and thread handles.\nCloseHandle(\
    \ pi.hProcess );\nCloseHandle( pi.hThread );\n```\n```\n\n## 进程终止\n\n- 批处理作业发出\
