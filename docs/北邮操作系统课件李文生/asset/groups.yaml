    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_24_0.png)\n\n#### Storage Hierarchy\n\
    \n- Storage systems organized in hierarchy.\n  - Speed\n  - Cost\n  - Volatility\n\
    - Volatile storage loses its contents when the power to the device is removed.\n\
    - Principle of design a computer memory system\n  - uses only as much expensive\
    \ memory as necessary\n  - provides as much inexpensive, nonvolatile memory as\
    \ possible.\n"
  mdcn: "\n\n## 操作系统提供的服务。\n\n- 程序开发\n  - 编辑器和调试器\n- 程序执行\n- 访问 I/O 设备\n- 受控访问文件\n\
    - 系统访问\n- **错误检测和响应**\n  - 内部和外部硬件错误\n    - 内存错误\n    - 设备故障\n  - 软件错误\n    -\
    \ 算术溢出\n    - 访问禁止的内存位置\n  - 操作系统无法满足应用程序的请求\n- **记账**\n  - 收集统计信息\n  - 监控性能\n\
    \  - 用于预测未来增强\n  - 用于用户计费\n\n## 操作系统的定义\n\n操作系统是计算机系统中的一个系统软件，是一些程序模块的集合，它们能以尽量有效、合理的方式组织和管理计算机的软硬件资源，合理地组织计算机的工作流程，控制程序的执行，向用户提供各种服务功能，使得用户能够灵活、方便、有效地使用计算机，使整个计算机系统能高效地运行。\n\
    \n## 1.2 计算机系统组织\n\n- 一个或多个 CPU，设备控制器通过提供对共享内存访问的公共总线连接\n- CPU 和设备并发执行，竞争内存周期\n\
    \n### 现代计算机系统\n\n- 磁盘\n- 磁盘\n- 打印机\n- 磁带驱动器\n- 在线\n- CPU\n- 磁盘控制器\n- 打印机控制器\n\
    - 磁带驱动器控制器\n- USB 控制器\n- 内存控制器\n- 内存\n\n寄存器类型？\n\n### 计算机启动\n\n- **引导程序**在加电或重启时加载\n\
    \  - 通常存储在 ROM 或 EEPROM 中，通常称为**固件**\n  - 初始化系统的各个方面\n    - 从 CPU 寄存器到设备控制器到内存内容\n\
    \  - 加载操作系统内核并开始执行\n- OS 开始执行第一个进程，例如“init”并等待某些事件发生\n  - 来自硬件的中断\n    - 通过系统总线向\
    \ CPU 发送信号\n  - 来自软件的中断\n    - 执行系统调用\n\n### 1.2.1 计算机系统操作\n\n- I/O 设备和 CPU 可以并发执行。\n\
    - 每个设备控制器负责一种特定类型的设备。\n- 每个设备控制器都有一个本地缓冲区。\n- CPU 将数据从/向主内存移动到/来自本地缓冲区\n- I/O\
    \ 是从设备到控制器的本地缓冲区。\n- 设备控制器通过引起*中断*通知 CPU 其操作已完成。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_20_0.png)\n\
    \n#### 中断时间线\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_21_0.png)\n\n#### 补充：无中断和有中断的程序控制流\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_22_0.png)\n\n无中断\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_22_1.png)\n\
    \n中断，短 I/O 等待\n\n### 1.2.2 存储结构\n\n- 主内存 – 处理器可以直接访问的唯一大存储区域。\n- 辅助存储 – 提供大容量非易失性存储容量的主内存扩展。\n\
    - 磁盘 – 覆盖有磁性记录材料的刚性金属或玻璃盘片\n  - 磁盘表面在逻辑上被划分为*磁道*，磁道又细分为*扇区*。\n  - *磁盘控制器*确定设备与计算机之间的逻辑交互。\n\
    - 磁带 - 用于备份，用于存储不经常使用的信息\n\n#### 补充：移动头磁盘机构\n\n编号：从上向下 0, 1, ..., T-1\n\n编号：依次为\
    \ 0,1,...,S-1\n\n编号：从外向内 0, 1, ..., C-1\n\n磁盘块编号：从0柱面、0磁道的0扇区开始，依次为0,1,......,S-1;\
    \ 再对0柱面、1磁道的S个扇区依次编号为S,S+1,......,2S-1; 依次类推，对柱面0的所有磁道所有扇区进行编号; 然后，对1柱面的0磁道的各个扇区进行编号,...;\
    \ 直到对所有柱面上所有磁道的所有扇区编完为止。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_24_0.png)\n\
    \n#### 存储层次结构\n\n- 存储系统按层次组织。\n  - 速度\n  - 成本\n  - 易失性\n- 易失性存储在断电时丢失其内容。\n- 设计计算机内存系统的原则\n\
    \  - 仅使用必要的昂贵内存\n  - 提供尽可能多的廉价、非易失性内存。\n\n"
