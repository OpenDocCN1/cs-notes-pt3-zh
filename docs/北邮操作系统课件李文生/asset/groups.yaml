    \n### 1. 大容量存储结构概述\n\n- 磁盘提供了现代计算机的大部分辅助存储。\n  - 驱动器每秒旋转60到200次。\n  - 传输速率是数据在驱动器和计算机之间流动的速率。\n\
    \  - 定位时间（随机访问时间）是将磁盘臂移动到目标柱面的时间（寻道时间）加上目标扇区旋转到磁盘磁头下方的时间（旋转延迟）。\n  - 磁头碰撞是磁盘磁头与磁盘表面接触所致。\n\
