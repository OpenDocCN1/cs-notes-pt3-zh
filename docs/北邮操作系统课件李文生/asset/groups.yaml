    - 需要保护内存以确保正确运行\n\n## 保护：基址寄存器和界限寄存器\n- 一对**基址**和**界限**寄存器定义物理地址空间\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_513_0.png)\n\
