- raw:
  - '[PAGE 727]


    # File Sharing – Failure Modes


    +   - Remote file systems add new failure modes, due to network failure, server
    failure

    +   - Recovery from failure can involve state information about status of each
    remote request

    +   - Stateless protocols such as NFS include all information in each request,
    allowing easy recovery but less security'
  - '[PAGE 728]


    # File Sharing – Consistency Semantics


    Consistency semantics specify how multiple users are to access a shared file simultaneously


    +   - Similar to Ch 6 process synchronization algorithms

    +     - Tend to be less complex due to disk I/O and network latency (for remote
    file systems


    +   - Andrew File System (AFS) implemented complex remote file sharing semantics


    +   - Unix file system (UFS) implements:

    +     - Writes to an open file visible immediately to other users of the same
    open file

    +     - Sharing file pointer to allow multiple users to read and write concurrently


    +   - AFS has session semantics

    +     - Writes only visible to sessions starting after the file is closed'
  - '[PAGE 729]


    # 10.6 Protection


    +   - **File owner/creator should be able to control:**

    +     - what can be done

    +     - by whom


    +   - **Types of access**

    +     - **Read**: read from the file

    +     - **Write**: write or rewrite the file

    +     - **Execute**: load the file into memory and execute it

    +     - **Append**: write new information at the end of the file

    +     - **Delete**: delete the file and free its space for possible reuse

    +     - **List**: list the name and attributes of the file

    +     - Other operations, such as **renaming**, **copying**, or **editing** the
    file, may also be controlled.'
  - '[PAGE 730]


    # Access control (1/2)


    +   - Mode of access: **read, write, execute**

    +   - Access-control list (ACL): associates with each file and specifies the user
    name and the types of access allowed for each user.

    +   - Three classes of users

    +     - **Owner**: the user who created the file.

    +     - **Group**: a set of users who are sharing the file and need similar access.

    +     - **Universe (Public)**: all other users in the system.

    +   - Access-control information

    +     - User access: RWX (111 – 7)

    +     - Group access: RW– (110 – 6)

    +     - Public access: ––X (001 – 1)'
  - '[PAGE 731]


    # Access control (2/2)


    +   - Ask manager to create a group (unique name), say G, and add some users to
    the group.

    +   - For a particular file (say game) or subdirectory, define an appropriate
    access.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_731_0.png)


    +   - Change user’s access methods

    +     chmod go -RW file

    +   - Attach a group to a file

    +     chgrp G game.'
  - '[PAGE 732]


