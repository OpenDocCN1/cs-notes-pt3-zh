    do {\n  while (turn != 1);\n  critical section\n  turn = 0;\n  remainder section\n\
    } while (1);\n```\n\n- 互斥？√\n- 有空让进？×\n- 有限等待？×\n\n### 补充：算法 2\n\n- 互斥？√\n- 有空让进？×\n\
    - 有限等待？×\n\n**共享变量**\n\n- `boolean flag[2];` 初始 `flag[0] = flag[1] = false`\n\
    - `flag[i] = true` ⇒ $P_i$ 准备进入其临界区\n\n**进程 $P_0$**\n\n```c\ndo {\n  while (flag[1]);\n\
    \  flag[0] := true;\n  critical section\n  flag[0] = false;\n  remainder section\n\
