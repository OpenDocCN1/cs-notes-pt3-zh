  mdcn: "\n\n## 补充：**Solaris 线程执行**\n\n- 同步\n- 挂起\n- 抢占\n- 让出（yielding）\n\n## 补充：Solaris\
    \ ULT 与 LWP 状态\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_308_0.png)\n\n## 第5章\
    \ CPU调度\n\n授课学时：4学时\n\n## 重点：\n\n- 调度准则\n- 调度算法\n\n## 章节目标\n\n- 引入CPU调度，它是多道程序设计操作系统的基础\n\
    - 描述各种CPU调度算法\n- 讨论为特定系统选择CPU调度算法的评估标准\n\n## 目录\n\n- 1. 5.1 基本概念\n- 2. 5.2 调度准则\n\
    - 3. 5.3 调度算法\n- 4. 5.4 多处理器调度 (*)\n- 5. 5.5 线程调度 (*)\n- 6. 5.6 操作系统示例 (*)\n-\
    \ 7. 5.7 算法评估 (*)\n\n## 决策模式\n\n- **非抢占式（Nonpreemptive）**\n  - 一旦进程进入运行状态，它将持续运行直到终止或自我阻塞等待I/O\n\
    - **抢占式（Preemptive）**\n  - 当前运行的进程可能被操作系统中断并移入就绪状态\n  - 由于任何进程都不能长期垄断（独占）处理器，因此可以提供更好的服务\n\
    \n## 分派器（Dispatcher）\n\n- ▪ 分派器模块将CPU的控制权交给短期调度器选中的进程；这包括：\n  - 切换上下文\n  - 切换到用户模式\n\
    \  - 跳转到用户程序中的适当位置，以重新启动该程序\n\n- ▪ *分派延迟（Dispatch latency）*——分派器停止一个进程并启动另一个进程运行所需的时间。\n\
    \n## 补充：\n\n## 调度准则的分类\n\n- 面向用户\n  - 响应时间\n    - 从提交请求到产生输出之间的时间\n- 面向系统\n  -\
    \ 处理器的有效且高效的利用\n- 与性能相关\n  - 定量（Quantitative）\n  - 可测量，如响应时间和吞吐量\n- 与性能无关\n  -\
    \ 定性（Qualitative）\n  - 可预测性\n\n## 补充：\n\n## 调度准则的分类\n\n|  | 与性能相关 | 与性能无关 |\n\
    |---|---|---|\n| **面向用户** | 周转时间<br>响应时间 | 可预测性<br>截止时间 |\n| **面向系统** | 吞吐量<br>CPU利用率\
    \ | 公平性<br>强制优先级<br>资源平衡 |\n\n## 优化准则\n\n- CPU利用率 → **最大化**\n- 吞吐量 → **最大化**\n\
    - 周转时间 → **最小化**\n- 等待时间 → **最小化**\n- 响应时间 → **最小化**\n\n## 5.3 调度算法\n\n- 先来先服务（FCFS）调度\n\
    - 最短作业优先（SJF）调度\n- 优先级调度\n- 时间片轮转（RR）调度\n- 多级队列调度\n- 多级反馈队列调度\n- 最高响应比优先（HRRN）调度\n\
    \n## 5.3.1 先来先服务（FCFS）调度\n\n- 每个进程加入就绪队列\n- 当当前进程停止执行时，选择就绪队列中最早的进程\n- FCFS调度算法是非抢占式的。\n\
    \n| 进程 | 突发时间 |\n|---|---:|\n| P₁ | 24 |\n| P₂ | 3 |\n| P₃ | 3 |\n\n- 假设进程按顺序到达：P₁、P₂、P₃\n\
    - 调度的甘特图如下：\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_323_0.png)\n\n- P₁ 的等待时间\
    \ = 0；P₂ = 24；P₃ = 27\n- 平均等待时间：(0 + 24 + 27)/3 = 17\n\n## FCFS调度（续）\n\n假设进程按顺序到达\n\
    \\[P_2, P_3, P_1.\\]\n\n调度的甘特图如下：\n\n| $P_2$ | $P_3$ | $P_1$ |\n|---|---|---|\n\
    | 0 | 3 | 6 | 30 |\n\n- $P_1$ 的等待时间 = 6；$P_2 = 0$；$P_3 = 3$\n- 平均等待时间：$(6 + 0\
    \ + 3)/3 = 3$\n- 比前一种情况好得多。\n- 短进程可能需要等待非常长的时间才能执行\n- 有利于CPU密集型进程\n  - I/O进程必须等待CPU密集型进程完成\n\
    - **护航效应（Convoy effect）：**短进程排在长进程后面\n\n"
