    \   |   |\n|   |   |   |   |\n|   |   |   |   |\n| B.4 | B.5 | B.6 |   |\n|  \
    \ |   |   |   |\n\nMain Memory\n\n主内存由多个固定长度的帧组成，其大小等于页的大小。对于程序的执行，其一些或全部页必须在主内存中。\n\
