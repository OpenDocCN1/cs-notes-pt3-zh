    - 每个用户都应能够在文件之间 **移动数据**\n- 每个用户都应能够在文件损坏时 **备份** 和 **恢复** 用户的文件\n- 每个用户都应能够通过\
    \ **使用符号名** 访问用户的文件\n\n## 补充：文件管理功能\n\n- 识别并定位选定的文件\n- 使用目录描述所有文件的位置及其属性\n- 在共享系统上描述用户访问控制\n\
    - 对文件访问进行阻塞\n- 将文件分配到空闲块\n- 管理可用块的空闲存储\n\n## 访问权限 (1/2)\n\n- **无**\n  - 用户可能不知道文件的存在\n\
    \  - 用户不允许读取包含该文件<|message|>\n- **知晓**\n  - 用户只能确定文件存在以及其所有者是谁\n- **执行**\n  -\
    \ 用户可以加载并执行程序但不能复制它\n- **读取**\n  - 用户可以出于任何目的读取文件，包括复制和执行\n- **追加**\n  - 用户可以向文件添加数据但不能修改或删除文件的任何内容\n\
    \n## 访问权限 (2/2)\n\n- 更新\n  - 用户可以修改、删除并向文件数据添加内容。这包括创建文件、重写它以及删除全部或部分数据\n- 更改保护\n\
    \  - 用户可以更改授予其他用户的访问权限\n- 删除\n  - 用户可以删除文件\n- 所有者\n  - 拥有之前列出的所有权利\n  - 可以使用以下用户类别将权利授予他人\n\
