  mdcn: "\n\n## 文件共享 – 故障模式\n\n- 远程文件系统由于网络故障、服务器故障而增加了新的故障模式\n- 从故障中恢复可能涉及有关每个远程请求状态的状态信息\n\
    - 诸如 NFS 之类的无状态协议在每个请求中都包含所有信息，从而允许轻松恢复但安全性较低\n\n## 文件共享 – 一致性语义\n\n一致性语义指定多个用户如何同时访问共享文件\n\
