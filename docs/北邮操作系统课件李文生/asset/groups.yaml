  - '[PAGE 271]


    # Comparison of these three models


    +   - Many-to-one model allows the developer to create as many user threads as
    he wishes, true concurrency is not gained because the kernel can schedule only
    one thread at a time.

    +   - One-to-one model allows for greater concurrency, but the developer has to
    be careful not to create too many threads within an application.

    +   - Many-to-many model allows the developer to create as many user threads as
    necessary, and the corresponding kernel threads can run in parallel on a multiprocessor.'
