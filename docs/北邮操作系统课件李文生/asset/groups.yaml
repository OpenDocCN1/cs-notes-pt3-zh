  mdcn: "\n\n## PCB (2/5)\n\n## 处理器状态信息\n\n## 控制和状态寄存器\n\n这些是用于控制处理器操作的各种处理器寄存器。其中包括\n\
    \n- *程序计数器：* 包含要获取的下一条指令的地址\n- *条件码：* 最近一次算术或逻辑操作的结果（例如，符号、零、进位、相等、溢出）\n- *状态信息：*\
    \ 包括中断使能/禁用标志、执行模式\n\n## 堆栈指针\n\n- 每个进程都有一个或多个与其关联的后进先出（LIFO）系统堆栈。堆栈用于存储过程和系统调用的参数和调用地址。堆栈指针指向堆栈顶部。\n\
    \n## PCB (3/5)\n\n## 进程控制信息\n\n### 调度和状态信息\n\n这是操作系统执行其调度功能所需的信息。典型信息项包括：\n\n\
    - *进程状态：* 定义进程被调度执行的就绪程度（例如，运行、就绪、等待、终止）。\n- *优先级：* 可使用一个或多个字段来描述进程的调度优先级。在某些系统中，需要多个值（例如，默认、当前、最高允许）\n\
    - *调度相关信息：* 这取决于所使用的调度算法。示例是进程等待的时间量以及进程上次运行时执行的时间量。\n- *事件：* 进程在可以恢复之前正在等待的事件的标识\n\
    \n## PCB (4/5)\n\n## 进程控制信息\n\n### 数据结构化\n\n- 一个进程可能通过队列、环或其他结构链接到其他进程。例如，所有处于特定优先级级别等待状态的进程可能链接在队列中。一个进程可能与另一个进程表现出父子（创建者-被创建者）关系。进程控制块可能包含指向其他进程的指针以支持这些结构。\n\
    \n### 进程间通信\n\n- 两个独立进程之间通信可能关联各种标志、信号和消息。这些信息中的一些或全部可能保存在进程控制块中。\n\n### 进程特权\n\
    \n- 进程被授予特权，涉及可以访问的内存和可以执行的指令类型。此外，特权可能适用于系统实用程序和服务的使用。\n\n## PCB (5/5)\n\n##\
    \ 进程控制信息\n\n### 内存管理\n\n- 本节可能包括指向描述分配给此进程的虚拟内存的段和/或页表的指针。\n- 基址和界限寄存器的值\n\n###\
    \ 资源拥有和利用\n\n- 进程控制的资源可以被指示，例如已打开的文件。\n- 处理器或其他资源的利用历史也可能包含在内；\n- 调度程序可能需要此信息。\n\
    \n## 补充：何时切换进程\n\n- **时钟中断**\n  - 进程已执行了最大允许的时间片\n- **I/O 中断**\n- **内存故障**\n \
    \ - 内存地址在虚拟内存中，因此必须将其调入主内存\n- **陷阱**\n  - 发生错误\n  - 可能导致进程被移至终止/退出状态\n- **系统调用**\n\
    \  - 例如文件打开\n\n## 调度队列(续)\n\n设备队列 – 等待 I/O 设备的进程集合。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_191_0.png)\n\
    \n## 进程调度的表示\n\n进程在各个队列之间的迁移。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_192_0.png)\n\
    \n## 3.2.2 调度程序\n\n- 长期调度程序（或作业调度程序） – 选择应引入就绪队列的进程。\n- 短期调度程序（或 CPU 调度程序） – 选择应接下来执行的进程并分配\
    \ CPU。\n- 主要区别：执行频率。\n  - 短期调度程序被非常频繁地调用（毫秒） ⇒ （调度程序必须快速）。\n  - 长期调度程序被非常不频繁地调用（秒、分钟）\
    \ ⇒ （调度程序可以较慢）。\n  - 长期调度程序控制多道程序设计的程度。内存中的进程数。\n\n"
