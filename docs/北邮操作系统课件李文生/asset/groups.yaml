    +   - buffer is empty when `in==out;`

    +   - buffer is full when `(in+1) % buffer-size ==out.`


    solution is correct,

    but can only use

    BUFFER_SIZE-1

    elements'
  - "[PAGE 221]\n\n# Bounded-Buffer — *Producer Process*\n\n```\nitem nextProduced;\n\
    while (1) {    /* produce an item in nextProduced */\n              while (((in\
    \ + 1) % BUFFER_SIZE) == out)\n                    ; /* do nothing */\n      \
    \        buffer[in] = nextProduced;\n              in = (in + 1) % BUFFER_SIZE;\n\
    \            }\n```\n\n# Bounded-Buffer — *Consumer Process*\n\n```\nitem nextConsumed;\n\
    while (1) {  while (in == out) ; /* do nothing */\n              nextConsumed\
