  mdcn: "\n\n## 资源类型的多个实例\n\n## 使用了多个时变数据结构\n\n- **Available**: 一个长度为 *m* 的向量表示每种资源类型的可用资源数量。\n\
    - **Allocation**: 一个 *n* × *m* 矩阵定义了当前分配给每个进程的每种资源的数量。\n- **Request**: 一个 *n*\
    \ × *m* 矩阵表示每个进程的当前请求。如果 *Request* [*i,j*] = *k*，则进程 *P_i* 请求资源类型 *R_j* 的另外 *k*\
    \ 个实例。\n\n*Allocation* 和 *Request* 中的行可以被视为向量，并分别称为 *Allocation_i* 和 *Request_i*\n\
    \n## 检测算法\n\n- 1. 设 *Work* 和 *Finish* 分别为长度为 *m* 和 *n* 的向量。初始化：\n  (a) *Work*\
    \ = *Available*\n  (b) 对于 *i* = 1,2, ..., *n*，如果 *Allocation*ᵢ ≠ 0，则 *Finish*[i]\
    \ = false；否则，*Finish*[i] = true。\n- 2. 找到一个索引 *i* 使得同时满足：\n  (a) *Finish*[i] ==\
    \ false      (b) *Request*ᵢ ≤ *Work*\n  如果不存在这样的 *i*，则转到步骤 4。\n- 3. *Work* = *Work*\
    \ + *Allocation*ᵢ    *Finish*[i] = true\n  转到步骤 2。\n- 4. 如果 *Finish*[i] == false，对于某些\
    \ *i*，1 ≤ *i* ≤ *n*，则系统处于死锁状态。\n  而且，如果 *Finish*[i] == false，则 *P*ᵢ 处于死锁。\n\n\
    该算法需要 O(*m* × *n*²) 的操作顺序来检测系统是否处于死锁状态。\n\n## 检测算法示例\n\n- 一个具有五个进程 P₀ 到 P₄、三种资源类型\
    \ A（7 个实例）、B（2 个实例）和 C（6 个实例）的系统。\n\n- 时间 T₀ 的快照：\n\n|  | Allocation | Request\
    \ | Available |\n|  | A B C | A B C | A B C |\n| P₀ | 0 1 0 | 0 0 0 | 0 0 0 |\n\
    | P₁ | 2 0 0 | 2 0 2 |  |\n| P₂ | 3 0 3 | 0 0 0 |  |\n| P₃ | 2 1 1 | 1 0 0 | \
    \ |\n| P₄ | 0 0 2 | 0 0 2 |  |\n\n| Seq. | Work |\n|  | 0 0 0 |\n| P₀ | 0 1 0\
    \ |\n| P₂ | 3 1 3 |\n| P₃ | 5 2 4 |\n| P₄ | 5 2 6 |\n| P₁ | 7 2 6 |\n\n- 序列 <P₀,\
    \ P₂, P₃, P₄, P₁> 将导致所有 i 的 Finish[i] = true。\n\n## 示例（续）\n\n假设 P₂ 请求额外一个类型 C\
    \ 的实例。\n\n|  | Allocation |  |  | Request |  |  | Available |  |  |\n|---|---|---|---|---|---|---|---|---|---|\n\
    |  | A | B | C | A | B | C | A | B | C |\n| P₀ | 0 | 1 | 0 | 0 | 0 | 0 | 0 | 0\
    \ | 0 |\n| P₁ | 2 | 0 | 0 | 2 | 0 | 2 |  |  |  |\n| P₂ | 3 | 0 | 3 | 0 | 0 | 1\
    \ |  |  |  |\n| P₃ | 2 | 1 | 1 | 1 | 0 | 0 |  |  |  |\n| P₄ | 0 | 0 | 2 | 0 |\
    \ 0 | 2 |  |  |  |\n\n系统状态？\n\n- 可以收回进程 P₀ 持有的资源，但资源不足以满足其他进程的请求。\n- 死锁存在，由进程\
    \ P₁、P₂、P₃ 和 P₄ 组成。\n\n## 检测算法使用\n\n- 何时以及多频繁调用取决于：\n  - 死锁发生的可能性有多大？\n  - 需要回滚多少个进程？\n\
    \    - 每个不相交的循环一个\n\n如果检测算法被任意调用，资源图中可能存在许多循环，因此我们无法判断众多死锁进程中哪个“导致”了死锁。\n\n##\
    \ Suspended: 资源图消边法检测死锁\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_494_0.png)\n\
    \nrequest edge\n\nassignment edge\n\n## Suspended: 资源图消边法检测死锁\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_495_0.png)\n\
    \nrequest edge\nassignment edge\n\n## 7.7 Recovery from Deadlock\n\n### ---- Process\
    \ Termination\n\n- 通过中止进程消除死锁\n- 中止所有死锁进程。\n- 每次中止一个进程，直到死锁循环被消除。\n\n- 我们应该按什么顺序选择中止？\n\
    \  - 进程的优先级。\n  - 进程已计算的时间长度，以及完成还需要多长时间。\n  - 进程已使用多少资源以及资源类型。\n  - 进程完成还需要多少资源。\n\
    \  - 需要终止多少个进程。\n  - 进程是交互式的还是批处理的？\n\n## Recovery from Deadlock (Cont.)\n\n###\
    \ ---- Resource Preemption\n\n- **Selecting a victim** – 哪些资源和哪些进程将被抢占？\n  最小化成本。\n\
    \n- **Rollback** – 将进程返回到某个安全状态，并从该状态重新启动。\n  中止进程然后重新启动它。\n\n- **Starvation**\
    \ – 同一个进程可能总是被选为受害者。\n  将回滚次数纳入成本因素。\n\n"
