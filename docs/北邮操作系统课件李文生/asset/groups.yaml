    \ kernel code\n  - A segment for kernel data\n  - A segment for user code\n  -\
    \ A segment for user data\n  - A task-state segment (TSS)\n  - A default LDT segment\n\
    \nshared by all processes running in user mode\n\nUsed to store the hardware context\
    \ of each process during context switches.\n\nIs normally shared by all processes\
    \ and is usually not used\n\n## Three-level Paging in Linux\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_583_0.png)\n\
    \n## Homework (page 310)\n- 8.3\n- 8.5\n- 8.9\n- 8.12\n\n## Thinking about:\n\
    - 8.1\n- 8.10\n- 8.11\n- 8.13\n\n## Supplement:\n\n## About Main Memory Management\n\
    \n## Goals of Memory Management\n- Subdividing memory to accommodate multiple\
    \ processes\n- Memory needs to be allocated efficiently to pack as many processes\
    \ into memory as possible\n\n## Supplement:\n## Memory Management Requirements\
    \ (1/5)\n\n## Relocation\n- Programmer does not know where the program will be\
    \ placed in memory when it is executed\n- While the program is executing, it may\
    \ be swapped to disk and returned to main memory at a different location (relocated)\n\
    - Memory references must be translated in the code to actual physical memory address\n"
  mdcn: "\n\n## Pentium 分段\n- 允许一个段最大为 4GB，每个进程的最大段数为 16K(=16384)。\n- 进程的逻辑地址空间被划分为两个分区\n\
    \  - 1st, 最多 8K 段，私有给该进程\n  - 2nd, 最多 8K 段，供所有进程共享\n- 第 1 个分区的信息保存在局部描述符表 LDT\
    \ 中；第 2 个分区的信息保存在全局描述符表 GDT 中。\n- LDT 和 GDT 中的每个条目都由一个 8 字节的段描述符组成，其中包含有关特定段的详细信息，包括该段的基地址和界限。\n\
    \n## Pentium 分段\n- **逻辑地址：(选择子, 偏移量)**\n  - 选择子是一个 16 位数字，**13 位 s，1 位 g，和 2 位\
    \ p**\n    - s，段号\n    - g，段是否在 GDT 或 LDT 中\n    - p，处理保护\n  - offset，32 位数字，段内字节的位置\n\
    - 该机器有六个段寄存器，允许进程在任何时候寻址 6 个段。\n- 它有六个 8 字节微程序寄存器，用于保存来自 LDT 或 GDT 的相应描述符。 (cache)\n\
    \n## Pentium 分段\n- 段寄存器指向 LDT 或 GDT 中的适当条目。\n- 基地址和界限信息用于生成线性地址。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_575_0.png)\n\
    \n## Pentium 分页\n- 允许页面大小为 4KB 或 4MB\n- 对于 4KB 页面，Pentium 使用两级分页方案。\n- 线性地址：32\
    \ 位长\n  - 20 位页号\n    - 10 位页目录指针 (P1)\n    - 10 位页表指针 (P2)\n  - 12 位偏移量 (d)\n\
    \n| page number | page offset |\n|---|---|\n| P₁ | P₂ | d |\n\n## Pentium 分页\n\
    - **页目录中的一个条目是页大小标志，**\n  - 如果设置，页面大小为 4MB\n  - 如果未设置，页面大小为 4KB\n- **对于 4MB 页面大小**\n\
    \  - 页目录直接指向 4-MB 页帧\n  - 线性地址中的 22 个低位表示 4-MB 页帧内的偏移量。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_578_0.png)\n\
    \n## Pentium 分页\n- **页表可以交换到磁盘**\n  - 使用一个无效位\n  - 如果已交换，操作系统使用其他 31 位来指定表的磁盘位置\n\
    \n## 地址转换\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_580_0.png)\n\nlogical address\n\
    \nsegment | g | p | offset\n\ndescriptor table\n\nlimit | base\n\nlinear address\n\
    \ndirectory | page | offset\n\npage directory\n\npage table base\n\npage table\n\
    \nframe number\n\npage frame\n\nphysical address\n\npage directory base register\n\
    \n## Linux on Pentium systems\n- 仅提供对分段的有限支持\n- Linux 不依赖于分段并最小化使用它。\n- 在 Pentium\
    \ 上，Linux 仅使用六个段：\n  - 一个内核代码段\n  - 一个内核数据段\n  - 一个用户代码段\n  - 一个用户数据段\n  - 一个任务状态段\
    \ (TSS)\n  - 一个默认 LDT 段\n\nshared by all processes running in user mode\n\nUsed\
    \ to store the hardware context of each process during context switches.\n\nIs\
    \ normally shared by all processes and is usually not used\n\n## Linux 中的三级分页\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_583_0.png)\n\n## 作业 (第 310 页)\n- 8.3\n\
    - 8.5\n- 8.9\n- 8.12\n\n## 思考：\n- 8.1\n- 8.10\n- 8.11\n- 8.13\n\n## 补充：\n\n##\
    \ 关于主存管理\n\n## 内存管理的目标\n- 将内存细分以容纳多个进程\n- 内存需要被有效分配以尽可能多地将进程打包到内存中\n\n## 补充：\n\
    ## 内存管理需求 (1/5)\n\n## 重定位\n- 程序员在程序执行时并不知道程序将在内存中的何处放置\n- 程序执行时，它可能被交换到磁盘并返回到主存的不同位置\
    \ (重定位)\n- 内存引用必须在代码中被转换为主物理内存地址\n\n"
