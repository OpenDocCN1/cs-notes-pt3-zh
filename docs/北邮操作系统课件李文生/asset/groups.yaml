  md: "\n## 3.6 Communication in Client-Server Systems\n\n- Sockets\n- Remote Procedure\
    \ Calls (RPC)\n- Remote Method Invocation (RMI, Java)\n\n### Sockets\n\n- A socket\
    \ is defined as an *endpoint for communication*.\n- A socket is a concatenation\
    \ of an IP address and a port.\n- The socket 161.25.19.8:1625 refers to port 1625\
    \ on host 161.25.19.8.\n- Communication takes place between a pair of sockets.\n\
    \n### Communication using sockets\n\nHost X (146.86.5.20)  \nSocket (146.86.5.20/1625)\
    \  \nWeb server (161.25.19.8)  \nSocket (161.25.19.8/80)\n\nAll connections must\
    \ be unique.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_239_0.png)\n\n### RPCs\
    \ — Remote Procedure Calls\n\n- Remote Procedure Call (RPC) abstracts procedure\
    \ calls between processes on networked systems.\n- The semantics of RPCs allow\
    \ a client to invoke a procedure on a remote host as it would invoke a procedure\
    \ locally.\n\nBy providing a stub on the client side:\n\n- **Stubs** – client-side\
    \ proxy for the actual procedure on the server.\n- **The client-side stub** locates\
    \ the port on the server and *marshals* the parameters.\n- **The server-side stub**\
    \ receives this message, unpacks the marshaled parameters, and performs the procedure\
    \ on the server. Return values are passed back to the client using the same technique.\n\
    \n### Remote Procedure Calls (Cont.)\n\n- Machine-independent representation of\
    \ data: external data representation (XDR).\n  - Client: converts machine-dependent\
    \ data into XDR.\n  - Server: unmarshals XDR data and converts it into the machine-dependent\
    \ representation.\n- The semantics of a call:\n  - Attaching a timestamp to each\
    \ message.\n  - The server must keep a history of all the timestamps of messages\
    \ it has already processed.\n- The communication between a server and a client:\n\
    \  - Binding information may be predetermined (fixed port address).\n  - Binding\
    \ can be done dynamically by a rendezvous mechanism.\n\n### Execution of RPC\n\
    \n| Client | Message | Server |\n|---|---|---|\n| user calls kernel to send RPC\
    \ message to procedure X | | |\n| kernel sends message to matchmaker to find port\
    \ number | From: client to server; Port: matchmaker; Re: address for RPC X | |\n\
    | | | matchmaker receives message, looks up answer |\n| | From: server to client;\
    \ Port: kernel; Re: RPC X port: P | matchmaker replies to client with port P |\n\
    | kernel places port P in user RPC message | | |\n| kernel sends RPC | From: client\
    \ to server; Port: port P; `<contents>` | |\n| | | daemon listening to port P\
    \ receives message |\n| | | daemon processes request and sends output |\n| | From:\
    \ RPC Port P; To: client; Port: kernel; `<output>` | |\n| kernel receives reply,\
    \ passes it to user | | |\n\n### RMI — Remote Method Invocation\n\n- Remote Method\
    \ Invocation (RMI) is a Java mechanism similar to RPCs.\n- RMI allows a Java program\
    \ on one machine to invoke a method on a remote object.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_243_0.png)\n\
    \n### Marshalling Parameters\n\n**Client**\n\n```\nval = server.someMethod(A,\
    \ B)\n```\n\n**Remote object**\n\n```\nBoolean someMethod(Object x, Object y)\n\
    {\n    implementation of someMethod\n    ...\n}\n```\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_244_0.png)\n\
    \nstub  \nskeleton  \nA, B, someMethod  \nBoolean return value\n\n### Rules about\
    \ Parameter Passing Behavior\n\n- If the marshalled parameters are local objects,\
    \ they are passed by copy using a technique known as object serialization. If\
    \ the parameters are also remote objects, they are passed by reference.\n- If\
    \ local objects are to be passed as parameters to remote objects, they must implement\
    \ the interface `java.io.Serializable`.\n\n### Differences between RPCs and RMI\n\
    \n- RPCs support procedural programming whereby only remote procedures or functions\
    \ may be called.\n- RMI is object-based; it supports invocation of methods on\
    \ remote objects.\n- The parameters to remote procedures are ordinary data structures\
    \ in RPC; with RMI it is possible to pass objects as parameters to remote methods.\n\
    - RMI implements the remote object using stubs and skeletons, so remote methods\
    \ are transparent to both the client and the server.\n  - A stub is a proxy for\
    \ the remote object and resides with the client.\n  - The skeleton is responsible\
    \ for unmarshalling the parameters and invoking the desired method on the server.\n"
  mdcn: "\n\n## 3.6 客户端-服务器系统中的通信\n\n- 套接字\n- 远程过程调用（RPC）\n- 远程方法调用（RMI，Java）\n\n\
    ### 套接字\n\n- 套接字被定义为*用于通信的端点*。\n- 套接字是 IP 地址和端口的组合。\n- 套接字 161.25.19.8:1625 指的是主机\
    \ 161.25.19.8 上的端口 1625。\n- 通信发生在一对套接字之间。\n\n### 使用套接字进行通信\n\n主机 X (146.86.5.20)\
    \  \n套接字 (146.86.5.20/1625)  \nWeb 服务器 (161.25.19.8)  \n套接字 (161.25.19.8/80)\n\
    \n所有连接必须是唯一的。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_239_0.png)\n\n### RPC——远程过程调用\n\
    \n- 远程过程调用（RPC）抽象了网络系统中进程之间的过程调用。\n- RPC 的语义允许客户端像在本地调用过程一样，在远程主机上调用过程。\n\n通过在客户端提供一个存根（stub）：\n\
    \n- **存根**——服务器上实际过程的客户端代理。\n- **客户端存根**定位服务器上的端口并*编组*参数。\n- **服务器端存根**接收此消息，解包已编组的参数，并在服务器上执行过程。返回值使用相同技术传回客户端。\n\
    \n### 远程过程调用（续）\n\n- 与机器无关的数据表示：外部数据表示（XDR）。\n  - 客户端：将机器相关的数据转换为 XDR。\n  - 服务器：解组\
    \ XDR 数据并将其转换为机器相关的表示。\n- 调用的语义：\n  - 为每条消息附加时间戳。\n  - 服务器必须保留其已处理消息的所有时间戳的历史记录。\n\
    - 服务器与客户端之间的通信：\n  - 绑定信息可以是预先确定的（固定端口地址）。\n  - 绑定可以通过会合机制动态完成。\n\n### RPC 的执行\n\
    \n| 客户端 | 消息 | 服务器 |\n|---|---|---|\n| 用户调用内核向过程 X 发送 RPC 消息 | | |\n| 内核向匹配器发送消息以查找端口号\
    \ | 从：客户端到服务器；端口：匹配器；关于：RPC X 的地址 | |\n| | | 匹配器接收消息，查找答案 |\n| | 从：服务器到客户端；端口：内核；关于：RPC\
    \ X 端口：P | 匹配器向客户端回复端口 P |\n| 内核将端口 P 放入用户 RPC 消息中 | | |\n| 内核发送 RPC | 从：客户端到服务器；端口：端口\
    \ P；`<contents>` | |\n| | | 监听端口 P 的守护进程接收消息 |\n| | | 守护进程处理请求并发送输出 |\n| | 从：RPC\
    \ 端口 P；到：客户端；端口：内核；`<output>` | |\n| 内核接收回复，并将其传递给用户 | | |\n\n### RMI——远程方法调用\n\
    \n- 远程方法调用（RMI）是一种类似于 RPC 的 Java 机制。\n- RMI 允许一台机器上的 Java 程序调用远程对象上的方法。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_243_0.png)\n\
    \n### 参数编组\n\n**客户端**\n\n```\nval = server.someMethod(A, B)\n```\n\n**远程对象**\n\
    \n```\nBoolean someMethod(Object x, Object y)\n{\n    implementation of someMethod\n\
    \    ...\n}\n```\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_244_0.png)\n\n存根\
    \  \n骨架  \nA, B, someMethod  \n布尔返回值\n\n### 参数传递行为规则\n\n- 如果编组的参数是本地对象，则通过一种称为对象序列化的技术按副本传递。如果参数是远程对象，则按引用传递。\n\
    - 如果本地对象要作为参数传递给远程对象，则它们必须实现接口 `java.io.Serializable`。\n\n### RPC 与 RMI 之间的区别\n\
    \n- RPC 支持过程式编程，其中只能调用远程过程或函数。\n- RMI 是基于对象的；它支持对远程对象方法的调用。\n- RPC 中远程过程的参数是普通数据结构；而\
    \ RMI 可以将对象作为参数传递给远程方法。\n- RMI 使用存根和骨架实现远程对象，因此远程方法对客户端和服务器都是透明的。\n  - 存根是远程对象的代理，驻留在客户端。\n\
    \  - 骨架负责解组参数并在服务器上调用所需的方法。\n\n"
