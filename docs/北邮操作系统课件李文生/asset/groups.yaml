  mdcn: "\n\n## Translation Look-aside Buffer (Cont.)\n\n- TLB 是关联的高速存储器。\n- 关联存储器\
    \ – 并行搜索\n\n| Page # | Frame # |\n| --- | --- |\n|  |  |\n|  |  |\n|  |  |\n|\
    \  |  |\n\n- 地址转换 (A′, A″)\n  - 如果 A′ 在关联寄存器中，则取出帧号。\n  - 否则从内存中的页表获取帧号。\n\n##\
    \ Paging Hardware With TLB\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_546_0.png)\n\
    \n```text\nCPU\nlogical address\np\nd\npage number\nframe number\nTLB\nTLB hit\n\
    physical address\nf\nd\np\nTLB miss\nf\npage table\nf\nf0000...0000\nf1111...1111\n\
    physical memory\n```\n\n## Effective Access Time\n\n- 关联查找 = ε 微秒\n- 假设内存周期时间为\
    \ τ 微秒\n- **命中率** – 页号在关联寄存器中找到的次数百分比；比率与关联寄存器数量相关。\n- 命中率 = α\n- **有效访问时间 (EAT)**\n\
    \n  EAT = (ε + τ) α + (ε + 2τ)(1 − α)\n\n  = 2τ + ε − τα\n\n- ε=20ns, α=0.8, τ=100ns\
    \  EAT=140ns\n- ε=20ns, α=0.98, τ=100ns  EAT=122ns\n\n## Memory Protection\n\n\
    - 内存保护通过为每个帧关联保护位来实现。\n- 通常这些位保存在页表中。\n- **R/W** 位，可以将页面定义为读写或只读。\n- *有效-无效* 位附加到页表中的每个条目：\n\
    \  - “**有效**” 表示相关页面在进程的逻辑地址空间中，因此是合法页面。\n  - “**无效**” 表示页面不在进程的逻辑地址空间中。\n\n##\
    \ Shared Pages\n\n- **共享代码**\n  - 一个只读 (**可重入**) 代码的副本在进程之间共享（即文本编辑器、编译器、窗口系统）。\n\
    \  - 共享代码必须在所有进程的逻辑地址空间中出现在相同的位置。\n- **私有代码和数据**\n  - 每个进程保留代码和数据的单独副本。\n  - 私有代码和数据的页面可以在逻辑地址空间中的任何位置出现。\n\
    \n## 8.5 Structure of Page Table\n\n- 层次分页\n- 哈希页表\n- 倒排页表\n\n### Hierarchical\
    \ Page Tables\n\n- 一个逻辑地址（在 32 位机器上，页面大小为 4KB）被划分为：\n  - 由 20 位组成的页号。\n  - 由 12\
    \ 位组成的页偏移。\n- 将逻辑地址空间分解为多个页表。\n- 一个简单技术是两级页表。\n  - 页表本身也被分页\n- 由于页表被分页，页号进一步划分为：\n\
    \  - 10 位页号。\n  - 10 位页偏移。\n\n### Two-Level Paging Example\n\n因此，一个逻辑地址如下：\n\n\
    | page number | page offset |\n| --- | --- |\n| $p_1$ + $p_2$ | $d$ |\n| 10 +\
    \ 10 | 12 |\n\n其中\n\n$p_1$ 是外部页表的索引，且\n\n$p_2$ 是外部页表页面内的位移。\n\n### Address-Translation\
    \ Scheme\n\n- 两级 32 位分页架构的地址转换方案\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_556_0.png)\n\
    \n### Hashed Page Tables\n\n- 常见于地址空间 > 32 位。\n- 哈希表中的每个条目包含一个链接列表，其中元素被哈希到同一位置。\n\
    - 每个元素由三个字段组成：\n  - (a) 虚拟页号\n  - (b) 映射页帧的值（帧号）\n  - (c) 指向链接列表中下一个元素的指针\n- 虚拟页号被哈希到哈希表。\n\
    - 虚拟页号与该链中字段 (a) 进行比较，搜索匹配项。如果找到匹配项，则提取相应的物理帧。\n\n### Hashed Page Table\n\n```text\n\
    logical address\nphysical address\nhash function\nhash table\nmemory\n```\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_558_0.png)\n\n"
