    \ when system is running user code or kernel code\n  - Some instructions designated\
    \ as **privileged**, only executable in kernel mode\n  - System call changes mode\
    \ to kernel, return from call resets it to user\n\nWhen an interrupt or fault\
    \ occurs hardware switches to monitor mode.\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_48_0.png)\n"
  mdcn: "\n\n## 补充：多道程序设计\n\n- 当一个作业需要等待 I/O 时，处理器可以切换到另一个作业。\n- 两个程序的多道程序设计\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_38_0.png)\n\
    \n## 补充：示例\n\n# 一台计算机：\n\n256KB 内存，一块磁盘，一个终端，和一台打印机\n\n|  | Job1 | Job2 | Job3\
    \ |\n|---|---|---|---|\n| 作业类型 | 重计算 | 重 I/O | 重 I/O |\n| 持续时间 | 5 分钟 | 15 分钟\
    \ | 10 分钟 |\n| 所需内存 | 50K | 100K | 80K |\n| 需要磁盘？ | 否 | 否 | 是 |\n| 需要终端？ | 否 |\
    \ 是 | 否 |\n| 需要打印机？ | 否 | 否 | 是 |\n\n## 补充：利用率直方图\n\n(a) 单道程序设计\n\n(b) 多道程序设计\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_41_0.png)\n\n## 补充：\n多道程序设计所需的 OS 功能\n\
    \n- 系统提供的 I/O 例程。\n- 内存管理 – 系统必须为多个作业分配内存。\n- CPU 调度 – 系统必须在多个准备运行的作业中进行选择。\n\
    - 设备分配。\n\n## 补充：分时系统\n\n- **分时（多任务）** 是逻辑上的扩展，其中 CPU 频繁切换作业，使得用户可以在作业运行时与每个作业交互，从而实现\
    \ **交互式** 计算\n  - **响应时间** 应 < 1 秒\n  - 每个用户至少有一个程序在内存中执行 ⇒ 进程\n  - 如果同时有多个作业准备运行\
    \ ⇒ **CPU 调度**\n  - 如果进程不适合内存，**交换** 会将它们移入移出以运行\n  - **虚拟内存** 允许执行未完全在内存中的进程\n\
    \n## 补充：\n分时系统（续）\n\n- 使用多道程序设计处理多个交互式作业\n- CPU 在保存在内存和磁盘中的多个作业之间复用（复用）\n  - 处理器的时间在多个用户之间共享\n\
    \  - 仅当作业在内存中时 CPU 才分配给该作业。\n- 一个作业被交换进出内存到磁盘。\n- 许多用户同时共享计算机。\n  - 在用户和系统之间提供在线通信；\n\
    \  - 多个用户通过终端同时访问系统；\n  - 当操作系统完成一个命令的执行时，它寻求下一个“控制语句”不是来自卡片阅读机，而是来自用户的键盘。\n-\
    \ 在线系统必须可供用户访问数据和代码。\n\n## OS 功能\n分时系统所需\n\n- 系统提供的 I/O 例程。\n- 内存管理 – 系统必须为多个作业分配内存。\n\
    - 虚拟内存 – 允许执行未完全在内存中的作业。\n- 磁盘管理 – 必须提供文件系统，它驻留在磁盘集合上。\n- CPU 调度 – 并发执行、作业同步和通信的机制，避免死锁。\n\
    - 资源分配。\n\n## 补充：\n批处理多道程序设计与分时\n\n|  | 批处理多道程序设计 | 分时 |\n|---|---|---|\n| 主要目标\
    \ | 最大化处理器使用 | 最小化响应时间 |\n| 操作系统指令来源 | 与作业一起提供的作业控制语言命令 | 在终端输入的命令 |\n\n## 1.5\
    \ 操作系统操作\n\n- 由硬件驱动的中断\n- 软件错误或请求产生 **异常** 或 **陷阱**\n  - 除以零，请求操作系统服务\n- 其他进程问题包括无限循环，进程相互修改或修改操作系统\n\
    - **双模式** 操作允许 OS 保护自身和其他系统组件\n  - 提供硬件支持以区分至少两种操作模式。\n    1. *用户模式* – 代表用户执行的执行。\n\
    \    2. *监控模式*（也称 *内核模式* 或 *系统模式*）– 代表操作系统执行的执行。\n\n## 双模式操作\n\n- 由硬件提供的 **模式位**\n\
    \  - 监控（0）或用户（1）\n  - 提供区分系统正在运行用户代码还是内核代码的能力\n  - 一些指令被指定为 **特权**，只能在内核模式下执行\n\
    \  - 系统调用将模式更改为内核，返回调用时将其重置为用户\n\n当中断或故障发生时，硬件切换到监控模式。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_48_0.png)\n\
    \n"
