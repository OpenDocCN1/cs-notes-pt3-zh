  - '[PAGE 798]


    # Overview of Mass Storage Structure (Cont.)


    # Magnetic tape


    +   - Was early secondary-storage medium

    +   - Relatively permanent and holds large quantities of data

    +   - Access time slow

    +   - Random access ~1000 times slower than disk

    +   - Mainly used for backup, storage of infrequently-used data, transfer medium
    between systems

    +   - Kept in spool and wound or rewound past read-write head

    +   - Once data under head, transfer rates comparable to disk

    +   - 20-200GB typical storage

    +   - Common technologies are 4mm, 8mm, 19mm, ¼ inch, ½ inch, named according
    to technology, LTO-2 and SDLT'
  - '[PAGE 799]


    # 12.2 Disk Structure


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_0.png)


    +   - Disk drives are addressed as large 1-dimensional arrays of logical blocks,
    where the logical block is the smallest unit of transfer. (block size is usually
    512 bytes)

    +   - The 1-dimensional array of logical blocks is mapped into the sectors of
    the disk sequentially.

    +     - Sector 0 is the first sector of the first track on the outermost cylinder.

    +     - Mapping proceeds in order through that track, then the rest of the tracks
    in that cylinder, and then through the rest of the cylinders from outermost to
    innermost.

    +   - Constant Linear Velocity (常数线性周转率)

    +     - 位密度相同, CD-ROM, DVD-ROM

    +   - Constant Angular Velocity (常数角周转率)

    +     - 位密度不同, hard disk


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_1.png)'
  - '[PAGE 800]


    # 12.3 Disk Attachment


    +   - **Computer access disk storage in two ways**

    +     - Via I/O ports (host-attached storage)

    +     - Via a remote host in a distributed file system (NAS)'
  - '[PAGE 801]


    # Host-attached storage


    +   - Is accessed through I/O ports talking to I/O busses

    +   - IDE, ATA, support maximum of 2 drives per I/O bus

    +   - SATA (Serial ATA)

    +   - SCSI itself is a bus, up to 16 devices on one cable, SCSI initiator (controller
    card in the host) requests operation and SCSI targets (storage devices) perform
    tasks

    +     - A SCSI disk is a common SCSI target

    +     - Each target can have up to 8 logical units (disks attached to device controller)

    +   - FC is a high-speed serial architecture, can operate over optical fiber or
    over a 4-conductor copper cable, two variants:

    +     - Can be switched fabric with 24-bit address space – the basis of storage
    area networks (SANs) in which many hosts attach to many storage units

    +     - Can be arbitrated loop (FC-AL, Fibre Channel Arbitrated Loop) of 126 devices'
  - '[PAGE 802]


    # Network-Attached Storage


    +   - Network-attached storage (NAS) is storage made available over a network
    rather than over a local connection (such as a bus)

    +   - NFS and CIFS (Common Internet File System) are common protocols, RPC interface

    +   - Implemented via remote procedure calls (RPCs) between host and storage

    +   - New iSCSI protocol uses IP network protocol to carry the SCSI protocol


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_802_0.png)'
  - '[PAGE 803]


    # Storage Area Network


    +   - Private network, connecting servers and storage units

    +   - Common in large storage environments (and becoming more common)

    +   - Multiple hosts attached to multiple storage arrays – flexible

    +   - FC is the most common SAN interconnect.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_803_0.png)'
  - '[PAGE 804]


    # 12.4 Disk Scheduling


    +   - The operating system is responsible for using hardware efficiently — for
    the disk drives, this means having a fast access time and disk bandwidth.

    +   - To read or write, the disk head must be positioned at the desired track
    and at the beginning of the desired sector.

    +   - Access time has two major components:

    +     - *Seek time* is the time for the disk arm to move the heads to the cylinder
    containing the desired sector.

    +     - *Rotational latency* is the additional time waiting for the disk to rotate
    the desired sector to the disk head.

    +   - Minimize seek time

    +   - Seek time ≈ seek distance

    +   - **Disk bandwidth** is the total number of bytes transferred, divided by
    the total time between the first request for service and the completion of the
    last transfer.'
  md: "\n## Overview of Mass Storage Structure (Cont.)\n\n### Magnetic tape\n\n- Was\
    \ early secondary-storage medium\n- Relatively permanent and holds large quantities\
    \ of data\n- Access time slow\n- Random access ~1000 times slower than disk\n\
    - Mainly used for backup, storage of infrequently-used data, transfer medium between\
    \ systems\n- Kept in spool and wound or rewound past read-write head\n- Once data\
    \ under head, transfer rates comparable to disk\n- 20-200GB typical storage\n\
    - Common technologies are 4mm, 8mm, 19mm, ¼ inch, ½ inch, named according to technology,\
    \ LTO-2 and SDLT\n\n## 12.2 Disk Structure\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_0.png)\n\
    \n- Disk drives are addressed as large 1-dimensional arrays of logical blocks,\
    \ where the logical block is the smallest unit of transfer. (block size is usually\
    \ 512 bytes)\n- The 1-dimensional array of logical blocks is mapped into the sectors\
    \ of the disk sequentially.\n  - Sector 0 is the first sector of the first track\
    \ on the outermost cylinder.\n  - Mapping proceeds in order through that track,\
    \ then the rest of the tracks in that cylinder, and then through the rest of the\
    \ cylinders from outermost to innermost.\n- Constant Linear Velocity (常数线性周转率)\n\
    \  - 位密度相同, CD-ROM, DVD-ROM\n- Constant Angular Velocity (常数角周转率)\n  - 位密度不同,\
    \ hard disk\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_1.png)\n\n## 12.3\
    \ Disk Attachment\n\n- **Computer access disk storage in two ways**\n  - Via I/O\
    \ ports (host-attached storage)\n  - Via a remote host in a distributed file system\
    \ (NAS)\n\n### Host-attached storage\n\n- Is accessed through I/O ports talking\
    \ to I/O busses\n- IDE, ATA, support maximum of 2 drives per I/O bus\n- SATA (Serial\
    \ ATA)\n- SCSI itself is a bus, up to 16 devices on one cable, SCSI initiator\
    \ (controller card in the host) requests operation and SCSI targets (storage devices)\
    \ perform tasks\n  - A SCSI disk is a common SCSI target\n  - Each target can\
    \ have up to 8 logical units (disks attached to device controller)\n- FC is a\
    \ high-speed serial architecture, can operate over optical fiber or over a 4-conductor\
    \ copper cable, two variants:\n  - Can be switched fabric with 24-bit address\
    \ space – the basis of storage area networks (SANs) in which many hosts attach\
    \ to many storage units\n  - Can be arbitrated loop (FC-AL, Fibre Channel Arbitrated\
    \ Loop) of 126 devices\n\n### Network-Attached Storage\n\n- Network-attached storage\
    \ (NAS) is storage made available over a network rather than over a local connection\
    \ (such as a bus)\n- NFS and CIFS (Common Internet File System) are common protocols,\
    \ RPC interface\n- Implemented via remote procedure calls (RPCs) between host\
    \ and storage\n- New iSCSI protocol uses IP network protocol to carry the SCSI\
    \ protocol\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_802_0.png)\n\n### Storage\
    \ Area Network\n\n- Private network, connecting servers and storage units\n- Common\
    \ in large storage environments (and becoming more common)\n- Multiple hosts attached\
    \ to multiple storage arrays – flexible\n- FC is the most common SAN interconnect.\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_803_0.png)\n\n## 12.4 Disk Scheduling\n\
    \n- The operating system is responsible for using hardware efficiently — for the\
    \ disk drives, this means having a fast access time and disk bandwidth.\n- To\
    \ read or write, the disk head must be positioned at the desired track and at\
    \ the beginning of the desired sector.\n- Access time has two major components:\n\
    \  - *Seek time* is the time for the disk arm to move the heads to the cylinder\
    \ containing the desired sector.\n  - *Rotational latency* is the additional time\
    \ waiting for the disk to rotate the desired sector to the disk head.\n- Minimize\
    \ seek time\n- Seek time ≈ seek distance\n- **Disk bandwidth** is the total number\
    \ of bytes transferred, divided by the total time between the first request for\
    \ service and the completion of the last transfer.\n"
  mdcn: "\n\n## 海量存储结构概述（续）\n\n### 磁带\n\n- 曾是早期的二级存储介质\n- 相对持久且可存储大量数据\n- 访问时间慢\n\
    - 随机访问比磁盘慢约1000倍\n- 主要用于备份、存储不常使用的数据、系统间的传输介质\n- 保存在卷盘中，并经过读写头缠绕或重绕\n- 一旦数据位于读写头下方，传输速率可与磁盘相当\n\
    - 典型存储容量为20-200GB\n- 常见技术有4mm、8mm、19mm、¼英寸、½英寸，按技术命名，如LTO-2和SDLT\n\n## 12.2 磁盘结构\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_0.png)\n\n- 磁盘驱动器被视为大型一维逻辑块数组，其中逻辑块是传输的最小单位。（块大小通常为512字节）\n\
    - 逻辑块的一维数组按顺序映射到磁盘的扇区中。\n  - 扇区0是最外层柱面上第一条磁道的第一个扇区。\n  - 映射按顺序先经过该磁道，然后是该柱面上的其余磁道，再经过其余柱面，从最外层到最内层。\n\
    - 恒定线速度（常数线性周转率）\n  - 位密度相同，CD-ROM、DVD-ROM\n- 恒定角速度（常数角周转率）\n  - 位密度不同，硬盘\n\n\
    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_799_1.png)\n\n## 12.3 磁盘连接\n\n- **计算机通过两种方式访问磁盘存储**\n\
    \  - 通过I/O端口（主机连接存储）\n  - 通过分布式文件系统中的远程主机（NAS）\n\n### 主机连接存储\n\n- 通过I/O端口与I/O总线通信来访问\n\
    - IDE、ATA，每条I/O总线最多支持2个驱动器\n- SATA（串行ATA）\n- SCSI本身是一种总线，一条电缆上最多可连接16个设备，SCSI发起器（主机中的控制器卡）请求操作，SCSI目标（存储设备）执行任务\n\
    \  - SCSI磁盘是常见的SCSI目标\n  - 每个目标最多可有8个逻辑单元（连接到设备控制器的磁盘）\n- FC是一种高速串行架构，可运行于光纤或4芯铜缆之上，有两种变体：\n\
    \  - 可构成具有24位地址空间的交换式结构——这是存储区域网络（SAN）的基础，其中许多主机连接到许多存储单元\n  - 可构成126个设备的仲裁环（FC-AL，光纤通道仲裁环）\n\
    \n### 网络连接存储\n\n- 网络连接存储（NAS）是通过网络而非本地连接（如总线）提供的存储\n- NFS和CIFS（通用互联网文件系统）是常见协议，使用RPC接口\n\
    - 通过主机与存储之间的远程过程调用（RPC）实现\n- 新的iSCSI协议使用IP网络协议来承载SCSI协议\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_802_0.png)\n\
    \n### 存储区域网络\n\n- 专用网络，连接服务器和存储单元\n- 常见于大型存储环境（且日益普及）\n- 多台主机连接到多个存储阵列——灵活\n-\
    \ FC是最常见的SAN互连方式。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_803_0.png)\n\n##\
    \ 12.4 磁盘调度\n\n- 操作系统负责高效使用硬件——对于磁盘驱动器，这意味着要有较快的访问时间和磁盘带宽。\n- 为了读写，磁盘头必须定位到目标磁道和目标扇区的起始位置。\n\
    - 访问时间有两个主要组成部分：\n  - *寻道时间*是磁盘臂将磁头移动到包含目标扇区的柱面所需的时间。\n  - *旋转延迟*是等待磁盘将目标扇区旋转到磁盘头下方的额外时间。\n\
    - 最小化寻道时间\n- 寻道时间 ≈ 寻道距离\n- **磁盘带宽**是传输的总字节数除以从首次请求服务到最后一次传输完成之间的总时间。\n\n"
