  - '[PAGE 161]


    # Java Virtual Machine


    +   - Compiled Java programs are platform-neutral bytecodes executed by a Java
    Virtual Machine (JVM).

    +   - JVM consists of

    +     - class loader

    +     - class verifier

    +     - Java interpreter that executes the architecture-neutral bytecodes.

    +   - JVM automatically manages memory by performing garbage collection.

    +   - Java interpreter may be a

    +     - software module that interprets the bytecodes one at a time

    +     - Just-In-Time (JIT) compilers turns the architecture-neutral bytecodes
    into native machine language for the host computer.'
  - '[PAGE 162]


    # 2.9 Operating System Generation


    +   - Operating systems are designed to run on any of a class of machines; the
    system must be configured for each specific computer site

    +   - SYSGEN program obtains information concerning the specific configuration
    of the hardware system

    +   - *Booting* – starting a computer by loading the kernel

    +   - *Bootstrap program* – code stored in ROM that is able to locate the kernel,
    load it into memory, and start its execution'
  - '[PAGE 163]


    # 2.10 System Boot


    +   - Operating system must be made available to hardware so hardware can start
    it

    +     - Small piece of code – **bootstrap loader**, locates the kernel, loads
    it into memory, and starts it

    +     - Sometimes two-step process where **boot block** at fixed location loads
    bootstrap loader

    +     - When power initialized on system, execution starts at a fixed memory location

    +       - Firmware used to hold initial boot code'
  - '[PAGE 164]


