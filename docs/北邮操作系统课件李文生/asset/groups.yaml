    等待时间：P₁=0；P₂=6；P₃=3；P₄=7\n\n周转时间：P₁=7；P₂=10；P₃=4；P₄=11\n\n### 抢占式 SJF 示例\n\n|\
    \ 进程 | 到达时间 | 突发时间 |\n|---|---|---|\n| P₁ | 0 | 7 |\n| P₂ | 2 | 4 |\n| P₃ | 4\
    \ | 1 |\n| P₄ | 5 | 4 |\n\nSRTF（抢占式 SJF）\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_329_0.png)\n\
    \nP₂ 到达\nP₁: 5, P₂: 4\n\nP₃ 到达\nP₂: 2, P₃: 1\n\nP₄ 到达\nP₁: 5, P₂: 2, P₄: 4\n\n\
    - P₁ 的等待时间 = 9；P₂ = 1；P₃ = 0；P₄ = 2\n- 平均等待时间 = (9 + 1 + 0 + 2)/4 = 3\n\n### SRTF\n\
    \n| 进程 | 到达时间 | 突发时间 |\n|---|---|---|\n| P₁ | 0 | 7 |\n| P₂ | 2 | 4 |\n| P₃ |\
    \ 4 | 1 |\n| P₄ | 5 | 4 |\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_330_0.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_330_1.png)\n\n- P₁ 的等待时间 = 9；P₂ = 1；P₃\
    \ = 0；P₄ = 2\n- 周转时间：P₁=16；P₂=5；P₃=1；P₄=6\n\n### 预测下一次 CPU 突发的长度（*）\n\n- 只能估计其长度。\n\
    - 可以通过使用之前 CPU 突发的长度，采用指数平均法来估算。\n  - tₙ = 第 n 个 CPU 突发的实际长度\n  - τₙ₊₁ = 下一个 CPU\
    \ 突发的预测值\n  - α，0 ≤ α ≤ 1\n  - 定义：\n    \n    τₙ₊₁ = α tₙ + (1 − α) τₙ\n\nτₙ₊₁\
    \ = α tₙ + (1-α)α tₙ₋₁ + ... + (1-α)ʲ α tₙ₋ⱼ + ... + (1-α)ⁿ⁺¹ τ₀\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_332_0.png)\n\
    \n$\\tau_{n+1}=\\alpha\\hat{t}_n+(1-\\alpha)\\tau_n\\qquad \\alpha=1/2\\qquad\
    \ \\tau_0=10$\n\n|  |  |  |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|---|---|\n\
    | **CPU 突发** ($t_i$) | 6 | 4 | 6 | 4 | 13 | 13 | 13 |  |\n| **“猜测值”** ($\\tau_i$)\
    \ | 10 | 8 | 6 | 6 | 5 | 9 | 11 | 12 |\n\n### 指数平均的示例\n\nτₙ₊₁ = α tₙ + (1 − α)\
    \ τₙ\n\n- α = 0\n  - τₙ₊₁ = τₙ  最近的历史不会计入。\n- α = 1\n  - τₙ₊₁ = tₙ  只有上一次实际的 CPU\
    \ 突发才会计入。\n- 如果展开这个公式，我们得到：\n  \n  τₙ₊₁ = α tₙ + (1−α) α tₙ₋₁ + ... + (1−α)ʲ α\
    \ tₙ₋ⱼ + ... + (1−α)ⁿ⁺¹ τ₀\n- 由于 α 和 (1−α) 都小于等于 1，每一项的权重都比前一项小。\n\n## 5.3.3 优先级调度\n\
    \n- 每个进程都有一个优先级号码（整数）与之关联。\n- CPU 分配给优先级最高的进程（最小整数 = 最高优先级）。\n- 优先级相同的进程按 FCFS\
    \ 顺序调度。\n- 两种方案：\n  - **抢占式**：如果新到达进程的优先级高于当前正在运行进程的优先级，则抢占 CPU。\n  - **非抢占式**：简单地将新进程放到就绪队列的头部。\n\
    - 优先级既可以由内部定义，也可以由外部定义。\n\n- SJF 是一种优先级调度，其优先级是预测的下一次 CPU 突发时间。\n- 问题：饥饿（或无限阻塞）——低优先级进程可能永远无法执行。\n\
    - 解决方案：老化（Aging）——随着时间推移，增加进程的优先级。\n- 例如：\n  - 如果优先级范围从 127（最低）到 0（最高）\n  - 我们可以每\
    \ 15 分钟将等待进程的优先级号码减 1。\n  - 最终，即使是初始优先级为 127 的进程也会成为系统中优先级最高的进程，并得到执行。\n\n"
