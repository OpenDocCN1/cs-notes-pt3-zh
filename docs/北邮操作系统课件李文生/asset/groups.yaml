    | 50 | 40 | 40 | 58 |\n| 55 | 40 | 45 | 58 |\n| 59 | 20 | 49 | 59 |\n\nlow / high\
    \ / new priority\n\n### Windows XP 优先级\n\n- 每个线程的优先级基于其优先级类和相对优先级\n- 进程通常是 NORMAL_PRIORITY_CLASS\
    \ 的成员\n- 线程的初始优先级通常是其所属进程的基础优先级\n- 当时间片用完时，优先级降低，但永远不会降低到基础优先级以下；当从等待操作恢复时，优先级会提升。\n\
