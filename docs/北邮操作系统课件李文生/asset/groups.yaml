  mdcn: "\n\n## 使用备份存储进行交换\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_524_0.png)\n\
    \n- 被换出的进程会被换回到它之前占用的同一内存空间吗？\n- 上下文切换时间相当高。\n\n## 交换（续）\n\n交换时间的主要部分是传输时间；总传输时间与交换的内存\
    \ *量* 直接成正比。\n\n- 有用的是确切知道用户进程正在使用多少内存，而不仅仅是它可能使用的内存量。\n- 用户必须让系统了解内存需求的任何变化。\n\
    \n确保我们想要交换的进程**完全空闲**。\n\n挂起 I/O 的解决方案\n\n- 切勿交换有挂起 I/O 的进程。\n- 仅将 I/O 操作执行到操作系统缓冲区中。\n\
    \n标准交换在少数系统中被使用。许多系统上都使用了交换的修改版本，即 UNIX、Linux 和 Windows。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_525_0.png)\n\
    \n## 8.3 连续内存分配\n\n- 主内存通常分为两个分区：\n  - 常驻操作系统，通常保留在低内存中并带有中断向量。\n  - 用户进程，保留在高内存中。\n\
    - 用户空间被划分为多个分区\n- 每个进程的单分区分配\n- 使用重定位寄存器方案来保护用户进程彼此之间，以及防止更改操作系统代码和数据。\n  - 重定位寄存器包含最小物理地址的值；\n\
    \  - 限制寄存器包含逻辑地址的范围 – 每个逻辑地址必须小于限制寄存器。\n\n## 重定位和限制寄存器的硬件支持\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_527_0.png)\n\
    \ntrap; addressing error\n\n## 内存分配\n\n## 固定分区\n\n- 等大小分区\n  - 任何大小小于或等于分区大小的进程都可以加载到可用分区中\n\
    \  - 如果所有分区都已满，操作系统可以将进程换出分区\n  - 程序可能无法适应分区。程序员必须使用覆盖设计程序\n\n- 不等大小分区\n\n- 主内存使用效率低下。无论程序多小，都占用整个分区。这导致内部碎片。\n\
    \n## 等大小分区\n\n## 不等大小分区\n\nOS\n\nOS\n\n内部碎片\n\n内部碎片\n\ndata structure?\n\n## 可变分区方案\n\
    \n- **动态分区（MVT）**\n  - 分区长度和数量可变\n  - 当进程到达时，从足够容纳它的空洞中分配内存。进程被分配恰好所需的内存量\n  -\
    \ 最终会在内存中产生小的空洞。这称为**外部碎片**\n  - 必须使用紧凑技术移动进程，使其连续并且所有空闲内存都在一个块中\n- **空洞** – 可用内存块\n\
    \  - 最初，所有内存都可供用户进程使用，一个空洞；\n  - 不同大小的空洞散布在整个内存中。\n- 操作系统维护一个**表**，其中包含有关以下信息：\n\
    \  - 哪些分区已分配，以及分配给哪个进程\n  - 哪些分区是空闲的（空洞）\n\n## 可变分区方案\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_532_0.png)\n\
    \n- 在任何给定时间，我们都有可用块大小的列表和输入队列。\n- 大空洞被分成两部分：一部分分配给进程，另一部分返回到空洞集合。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_532_1.png)\n\
    \n## 碎片\n\n- **外部碎片** – 存在足够的内存空间来满足请求，但它不是连续的。\n- **内部碎片** – 分配的内存可能略大于请求的内存；这种**大小差异**是分区内部的内存，但未被使用。\n\
    - **通过紧凑减少外部碎片**\n  - 重新排列内存内容，将所有空闲内存放在一个大块中。\n  - 只有在重定位是动态的并且在执行时完成时，紧凑才有可能。\n\
    \  - **I/O 问题**\n    - 在作业涉及 I/O 时将其锁定在内存中。\n    - 仅将 I/O 执行到 OS 缓冲区中。\n\n"
