    \ false）：\n  - `boolean lock;`\n\n**进程 $P_i$**\n\n```c\ndo {\n    key = true;\n\
    \    while (key == TRUE)\n        Swap(&lock, &key);\n    critical section\n \
    \   lock = FALSE;\n    remainder section\n} while(TRUE)\n```\n\n- 互斥？√\n- 有空让进？√\n\
