    \ |\n|---|---|---|\n| **User oriented** | Turnaround time<br>Response time | Predictability<br>Deadline\
    \ |\n| **System oriented** | Throughput<br>CPU utilization | Fairness<br>Forced\
    \ priority<br>Balance resources |\n\n## Optimization Criteria\n\n- CPU utilization\
    \ → **Max**\n- throughput → **Max**\n- turnaround time → **Min**\n- waiting time\
    \ → **Min**\n- response time → **Min**\n\n## 5.3 Scheduling Algorithms\n\n- First-Come,\
