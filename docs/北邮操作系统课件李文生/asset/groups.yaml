    # Deterministic modeling


    +   - Deterministic modeling – takes a particular predetermined workload and defines
    the performance of each algorithm for that workload.


    +   - Example

    +     - assume we have the workload:

    +     - consider the FCFS, SJF, RR(q=10)

    +     - compare their average waiting time


    | Process | Burst time |

    |---|---|

    | P₁ | 10 |

    | P₂ | 29 |

    | P₃ | 3 |

    | P₄ | 7 |

    | P₅ | 12 |


    +   - Average waiting time

    +     - FCFS: (0+10+39+42+49)/5=28

    +     - SJF: (10+32+0+3+20)/5=13

    +     - RR: (0+32+20+23+40)/5=23'
  - '[PAGE 377]


    # Queuing models


    +   - The distribution of times when processes arrive in the system, the *arrival-time
    distribution*, must be given.

    +   - Computer system is described as a network of servers.

    +     - Each server has a queue of waiting processes.

    +     - The CPU is a server with its ready queue, as is the I/O system with its
    device queues.

    +   - Knowing arrival rates and service rates, we can compute utilization, average
    queue length, average wait time.

    +   - **Little’s formula**: n=λ×W

    +     - n: average queue length excluding the process being serviced

    +     - W: average waiting time in the queue

    +     - λ: average arrival rate for new processes in the queue'
  - '[PAGE 378]


    # Simulations


    +   - Simulations involve programming a model of the computer system

    +     - software data structures--the major components of the system

    +     - a variable--clock

    +     - as the simulation executes, statistics that indicate algorithm performance
    are gathered and printed.

    +   - The data to drive the simulation can be generated by using a *random-number
    generator*.

    +   - The distributions may be defined mathematically or *empirically (根据经验)*.

    +   - A distribution-driven simulation may be inaccurate, due to relationships
    between successive events in the real system.'
