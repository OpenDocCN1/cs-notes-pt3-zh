  - '[PAGE 817]


    # Disk formatting


    +   - **Low-level formatting**, or *physical formatting* — Dividing a disk into
    sectors that the disk controller can read and write.

    +   - **Low-level formatting** fills the disk with a special data structure for
    each sector. The data structure typically consists of a header, a data area, and
    a trailer.

    +   - To use a disk to hold files, the operating system still needs to record
    its own data structures on the disk.

    +     - *Partition* the disk into one or more groups of cylinders.

    +     - *Logical formatting* or “making a file system”.'
  - '[PAGE 818]


    # Boot block


    # Boot block initializes system


    +   - Initializes all aspects of the system, from CPU registers to device controllers
    and the contents of main memory, and then starts the operating system.

    +   - The **bootstrap** is stored in ROM.

    +   - Most systems store a tiny *bootstrap loader* program in the boot ROM.

    +   - The full bootstrap program is stored in a partition called the **boot blocks**,
    at a fixed location on the disk.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_818_0.png)'
