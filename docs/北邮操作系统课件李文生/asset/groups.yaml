    \  while S ≤ 0 ;\n  S--;\nsignal (S):\n  S++;\n```\n\nShared data:\nSemaphore\
    \ synch; // 0\n\nP1:\n  S1;\n  signal(synch);\nP2:\n  wait(synch);\n  S2;\n\n\
