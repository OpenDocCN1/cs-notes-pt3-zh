    # Basic Page Replacement


    +   - **Find the location of the desired page on disk.**

    +   - **Find a free frame:**

    +     - If there is a free frame, use it.

    +     - If there is no free frame, use a page replacement algorithm to select
    a *victim* frame.

    +     - Write the victim frame to the disk; change the page and frame tables accordingly.

    +   - **Read the desired page into the (newly) free frame.** Update the page and
    frame tables.

    +   - **Restart the user process.**'
