  mdcn: "\n\n## 网络设备\n\n- 与块设备和字符设备存在足够大的差异，因此具有自己的接口\n- Unix 和 Windows NT/9x/2000\
    \ 包含套接字接口\n  - 将网络协议与网络操作分离\n  - 套接字接口中的系统调用使应用程序能够\n    - 创建套接字\n    - 将本地套接字连接到远程地址\n\
    \    - 监听远程应用程序接入本地套接字\n    - 通过连接发送和接收数据包\n  - 包含 `select` 功能：管理一组套接字\n- 实现方式差异很大（管道、FIFO、流、队列、邮箱）\n\
    \n## 时钟和定时器\n\n- 提供当前时间、经过时间和定时器\n- 如果使用可编程间隔定时器进行计时，则会产生周期性中断\n- `ioctl`（在 UNIX\
    \ 中）用于处理 I/O 的特殊方面，例如时钟和定时器\n\n## 阻塞和非阻塞 I/O\n\n- **阻塞——进程暂停，直到 I/O 完成**\n  -\
    \ 易于使用和理解\n  - 无法满足某些需求\n- **非阻塞——I/O 调用返回当前可用的数据量**\n  - 用户界面、数据复制（缓冲 I/O）\n\
    \  - 重叠执行；通过多线程实现\n  - 快速返回已读取或写入的字节数\n- **异步——I/O 执行期间进程继续运行**\n  - 使用较为困难\n\
    \  - I/O 子系统在 I/O 完成后向进程发送信号\n\n## 两种 I/O 方法\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_851_0.png)\n\
    \n同步\n\n异步\n\n## 13.4 内核 I/O 子系统\n\n内核 I/O 子系统提供的服务：\n\n- 调度\n- 缓冲\n- 高速缓存\n-\
    \ 假脱机\n- 设备预留\n- 错误处理\n\n## I/O 调度\n\n- 通过每个设备的队列对某些 I/O 请求进行排序\n- 某些操作系统会尽力保证公平性\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_853_0.png)\n\n## Sun Enterprise 6000\
    \ 设备传输速率\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_854_0.png)\n\n## 高速缓存\n\n\
    - 高速缓存——用于保存数据副本的快速存储器  \n  性能的关键\n- 缓冲区与高速缓存之间的区别\n  - 缓冲区可能保存某个数据项唯一存在的副本。\n\
    \  - 高速缓存只是在更快的存储设备上保存位于其他位置的数据项副本。\n- 有时，同一块内存区域可以同时用于这两种用途。\n\n## 假脱机\n\n- **假脱机——为设备暂存输出**\n\
    \  - 如果设备一次只能处理一个请求\n  - 例如打印\n\n## 设备预留\n\n- **设备预留（预约）——为设备提供独占访问**\n  - 用于分配和释放的系统调用\n\
    \  - 注意避免死锁\n\n## 错误处理\n\n- 操作系统可以从磁盘读取错误、设备不可用和暂时性写入失败中恢复\n- 当 I/O 请求失败时，大多数系统会返回错误编号或错误代码\n\
    - 系统错误日志保存问题报告\n\n## I/O 保护\n\n- 用户进程可能会意外或故意尝试通过非法 I/O 指令破坏正常运行\n  - 所有 I/O 指令都被定义为特权指令\n\
    \  - I/O 必须通过系统调用执行\n    - 内存映射区域和 I/O 端口内存位置也必须受到保护\n\n## 使用系统调用执行 I/O\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_861_0.png)\n\
    \n## 内核数据结构\n\n- 内核保存 I/O 组件的状态信息，包括打开文件表、网络连接和字符设备状态\n- 使用大量复杂的数据结构来跟踪缓冲区、内存分配和“脏”块\n\
    - 某些系统使用面向对象的方法和消息传递来实现 I/O\n\n## UNIX I/O 内核结构\n\n用户进程内存\n\n文件描述符\n\n每进程打开文件表\n\
    \n内核内存\n\n系统范围打开文件表\n\n文件系统记录  \ninode 指针  \n指向读写函数的指针  \n指向 `select` 函数的指针  \n\
    指向 `ioctl` 函数的指针  \n指向 `close` 函数的指针\n\n活动 inode 表\n\n网络（套接字）记录  \n指向网络信息的指针 \
    \ \n指向读写函数的指针  \n指向 `select` 函数的指针  \n指向 `ioctl` 函数的指针  \n指向 `close` 函数的指针\n\n\
    网络信息表\n\n"
