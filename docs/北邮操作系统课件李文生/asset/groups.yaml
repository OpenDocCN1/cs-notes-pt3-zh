  mdcn: "\n## 2.1 操作系统服务\n\n- **用户界面**：几乎所有操作系统都有用户界面\n  - 命令行（CLI）、图形用户界面（GUI）\n\
    \  - API（系统调用）\n\n- **程序执行**：系统必须能够将程序加载到内存中并运行该程序，以及正常或异常地结束执行。\n\n- **I/O 操作**：正在运行的程序可能需要\
    \ I/O，这可能涉及文件或 I/O 设备。\n\n- **文件系统操作**：文件系统尤其重要。显然，程序需要读写文件和目录，创建和删除它们，搜索它们，列出文件信息，权限管理。\n\
    \n## 操作系统服务（续）\n\n- **通信**——进程可以在同一台计算机上或通过网络在不同计算机之间交换信息\n  - 通信可以通过共享内存或消息传递（由操作系统移动的数据包）进行\n\
    - **错误检测**——操作系统需要时刻意识到可能的错误\n  - 可能发生在 CPU 和内存硬件、I/O 设备、用户程序中\n  - 对于每种类型的错误，操作系统都应采取适当的措施以确保正确且一致的计算\n\
    \  - 调试工具可以极大地增强用户和程序员高效使用系统的能力\n\n## 操作系统服务（续）\n\n- 另一组操作系统功能用于通过资源共享确保系统本身的高效运行\n\
    \  - **资源分配** - 当多个用户或多个作业并发运行时，必须为每个用户或作业分配资源\n    - 多种类型的资源 - 有些资源（如 CPU 周期、主内存和文件存储）可能有特殊的分配代码，其他资源（如\
    \ I/O 设备）可能有通用的请求和释放代码。\n  - **记账** - 跟踪哪些用户使用了多少以及何种计算机资源\n\n## 操作系统服务（续）\n\n\
    - **保护与安全** - 存储在多用户或网络计算机系统中的信息的所有者可能希望控制该信息的使用，并发进程不应相互干扰\n  - **保护**涉及确保对系统资源的所有访问都受到控制\n\
    \  - 系统对外的**安全**需要用户身份验证，并扩展到防御外部 I/O 设备免受无效访问尝试\n  - 如果要保护系统并确保其安全，必须在整个系统中采取预防措施。链条的强度取决于其最薄弱的环节。\n\
    \n## 2.2 用户操作系统接口\n\n- 命令行（CLI）\n- 图形用户界面（GUI）\n\n## 用户操作系统接口 - CLI\n\n- 允许直接输入命令\n\
    \n- **命令解释器**是用户与操作系统之间的接口。\n\n- 有时在内核中实现，有时由系统程序实现\n\n- 有时实现多种变体——**shell**\n\
    \n- 主要从用户获取命令并执行\n  - 有时命令是内建的，有时只是程序的名称\n    - 如果是后者，添加新功能不需要修改 shell\n\n## 用户操作系统接口\
    \ - GUI\n\n- **用户友好的桌面隐喻界面**\n  - 通常使用鼠标、键盘和显示器\n  - **图标**代表文件、程序、操作等\n  - 在界面中的对象上点击不同的鼠标按钮会引发各种操作（提供信息、选项、执行功能、打开目录（称为**文件夹**））\n\
    \  - 发明于 Xerox PARC（帕洛阿尔托研究中心）\n- **许多系统现在同时包含 CLI 和 GUI 界面**\n  - Microsoft Windows\
    \ 是带有 CLI“命令”shell 的 GUI\n  - Apple Mac OS X 采用“Aqua”GUI 界面，底层是 UNIX 内核，并提供 shell\n\
