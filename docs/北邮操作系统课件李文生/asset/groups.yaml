  mdcn: "\n\n## 交换空间使用\n\n- 取决于所使用的内存管理算法。\n  - 使用交换空间保存整个进程映像\n  - 存储被挤出内存的页面\n-\
    \ 所需交换空间的大小取决于\n  - 物理内存的大小\n  - 其所支持的虚拟内存量\n  - 虚拟内存的使用方式\n\n## 交换空间位置\n\n- 交换空间可以位于以下两个位置之一：\n\
    \  - 从普通文件系统中划分出来，一个大文件\n  - 在单独的磁盘分区中，原始分区\n- 一个大文件\n  - 可以使用普通文件系统例程来创建它、命名它并分配其空间。\n\
    \  - 效率低下\n- 原始分区\n  - 交换空间存储管理器进行分配和释放\n  - 在磁盘分区期间创建固定量的交换空间；添加更多交换空间需要重新分区磁盘。\n\
    \n## 交换空间管理\n\n- 4.3BSD 在进程启动时分配交换空间；保存 *text segment*（程序）和 *data segment*。\n\
    - 内核使用 *swap maps* 来跟踪交换空间的使用情况。\n- Solaris 2 仅在页面被强制移出物理内存时才分配交换空间，而不是在虚拟内存页面首次创建时。\n\
    \n## Linux 系统上交换的数据结构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_825_0.png)\n\
    \n## 作业（第 48 页）\n\n- 12.2\n\n## 思考：\n\n12.1\n\n## 第 13 章 I/O 系统\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_827_0.png)\n\
    \n教学时数：2h\n\n## 重点：\n\n- I/O 硬件\n- 应用 I/O 接口、内核 I/O 子系统\n- 将 I/O 请求转换为硬件操作\n\n\
    ## 章节目标\n\n- 探索操作系统 I/O 子系统的结构\n- 讨论 I/O 硬件的原理及其复杂性\n- 提供 I/O 硬件和软件性能方面的细节\n\n\
    ## 内容\n\n- 13.1 概述\n- 13.2 I/O 硬件\n- 13.3 应用 I/O 接口\n- 13.4 内核 I/O 子系统\n- 13.5\
    \ 将 I/O 请求转换为硬件操作\n- 13.6\\* 流\n- 13.7\\* 性能\n\n## 13.1 概述\n\n- I/O 设备种类繁多\n-\
    \ 两个趋势\n  - 软件和硬件接口的日益标准化\n  - I/O 设备种类日益广泛\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_830_0.png)\n\
    \n## 典型的 PC 总线结构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_831_0.png)\n\n##\
    \ I/O 设备控制\n\n- 处理器向控制器发出命令和数据以完成 I/O 传输。\n- I/O 指令控制设备\n- 设备具有地址，由以下方式使用\n  -\
    \ 直接 I/O 指令\n  - 内存映射 I/O\n\n## PC 上的设备 I/O 端口位置（部分）\n\n| I/O 地址范围（十六进制） | 设备\
    \ |\n|---|---|\n| 000-00F | DMA 控制器 |\n| 020-021 | 中断控制器 |\n| 040-043 | 定时器 |\n\
    | 200-20F | 游戏控制器 |\n| 2F8-2FF | 串行端口（次要） |\n| 320-32F | 硬盘控制器 |\n| 378-37F |\
    \ 并行端口 |\n| 3D0-3DF | 图形控制器 |\n| 3F0-3F7 | 软盘驱动器控制器 |\n| 3F8-3FF | 串行端口（主要） |\n\
    \n## I/O 端口\n\n- **4 个寄存器**\n  - 状态：包含可由主机读取的位。空闲、忙碌、就绪、错误\n  - 控制：可由主机写入以启动命令或更改设备的模式。\n\
    \  - 数据输入：由主机读取以获取输入\n  - 数据输出：由主机写入以发送输出\n\n数据寄存器通常为 1 到 4 字节大小。\n\n一些控制器具有 FIFO\
    \ 芯片以扩展控制器的容量，超出数据寄存器的大小。FIFO 芯片可保存若干字节的输入或输出数据。\n\n## 执行 I/O 的技术\n\n- **程序化 I/O**\n\
    \  - 处理器在操作完成前处于忙等待状态\n- **中断驱动 I/O**\n  - 发出 I/O 命令\n  - 处理器继续执行指令\n  - I/O 模块完成后发送中断\n\
    - **直接内存访问（DMA）**\n  - DMA 模块控制主内存与 I/O 设备之间的数据交换\n  - 整个块传输完成后处理器才会被中断\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_836_0.png)\n\
    \n"
