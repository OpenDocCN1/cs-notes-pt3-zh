  - '[PAGE 674]


    # 9.8 Allocating Kernel Memory


    +   - Treated differently from user memory.

    +   - Kernel memory is often allocated from a free-memory pool different from
    the list used to satisfy ordinary user-mode processes. Reasons are:

    +     - The kernel request memory for data structures of varying sizes, some of
    which are less than a page in size.

    +     - Some kernel memory needs to be contiguous. Certain hardware devices interact
    directly with physical memory, and may require memory residing in physically contiguous
    pages.

    +   - Buddy system

    +   - Slab allocation'
  - '[PAGE 675]


    # Buddy System (伙伴系统)


    +   - Allocates memory from a fixed-size segment consisting of physically contiguous
    pages.

    +   - Memory is allocated by using a **power-of-2 allocator**.

    +   - Entire space available is treated as a single block of \(2^U\).

    +   - If a request of size \(s\) such that \(2^{U-1} < s <= 2^U\), entire block
    is allocated

    +     - Otherwise block is split into two equal buddies

    +     - Process continues until smallest block greater than or equal to \(s\)
    is generated'
  - '[PAGE 676]


    # Example of Buddy System


    1MB block


    A: Request 100KB    B: Request 240KB    C: Request 64KB


    D: Request 256KB    Release B    Release A


    E: Request 75KB    Release C    Release E    Release D


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_676_0.png)'
  - '[PAGE 677]


    # Slab allocation


    +   - A **slab** is made up of one or more physically contiguous pages.

    +   - A **cache** consists of one or more slabs.

    +   - There is a single cache for each unique kernel data structure

    +     - Cache for PCBs

    +     - Cache for file objects

    +     - Cache for semaphores

    +   - Each cache is filled with objects -- instantiations of the kernel data structure
    the cache represents.'
  - '[PAGE 678]


    # The relationship between slabs, caches and objects


    kernel objects


    caches


    slabs


    3 KB objects


    7 KB objects


    physical contiguous pages


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_678_0.png)'
  - '[PAGE 679]


    # Slab allocation


    +   - **When cache created, filled with objects marked as free**

    +     - The number of objects in the cache depends on the size of the associated
    slab.

    +   - **When structures stored, objects marked as used**

    +   - **If slab is full of used objects, next object allocated from empty slab**

    +     - If no empty slabs, new slab allocated

    +   - **Benefits**

    +     - no fragmentation

    +     - fast memory request satisfaction'
  - '[PAGE 680]


    # 9.9 Other Considerations-- Prepaging


    +   - To reduce the large number of page faults that occurs at process startup

    +   - Prepaging all or some of the pages a process will need, before they are
    referenced.

    +   - Prepaging may be an advantage in some cases.

    +     - whether the cost of using prepaging is less than the cost of servicing
    the corresponding page faults.

    +   - Example

    +     - *S* pages are prepaged

    +     - a fraction *α* of these *S* pages is actually used (0<α<1)

    +     - the cost of the *S × α* saved page faults is greater or less than the
    cost of prepaging *S × (1 - α)* unnecessary pages

    +     - if *α* is close to 0, prepaging loses; if *α* is close to 1, prepaging
    wins.'
  - '[PAGE 681]


    # Other Issues --Page size selection


    +   - **size of the page table**

    +     - each active process must have its own copy of the page table, a **large
    page size** is desirable.

    +   - **fragmentation**

    +     - to minimize internal fragmentation, **small page size** is needed.

    +   - **I/O overhead**

    +     - I/O time = seek time + latency time + transfer time

    +     - seek and latency time normally dwarf transfer time

    +     - to minimize I/O time, **large page size** is desired

    +   - **locality**

    +     - with a small page size, locality will be improved, total I/O should be
    reduced

    +     - to minimize the number of page faults, a **large page size** is need.'
