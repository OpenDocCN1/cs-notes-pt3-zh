  - '[PAGE 358]


    # 5.4 Multiple-Processor Scheduling


    +   - CPU scheduling more complex when multiple CPUs are available.

    +   - **Classifications of Multipprocessor Systems**

    +     - Loosely coupled multiprocessor

    +       - Each processor has its own memory and I/O channels

    +     - Tightly coupled multiprocessing

    +       - Processors share main memory

    +       - Controlled by operating system

    +     - Functionally specialized processors

    +       - Such as I/O processor

    +       - Controlled by a master processor

    +   - *Homogeneous processors:* within a multiprocessor, any available processor
    can be used to run any processes in the queue.

    +   - *Heterogeneous system:* only programs compiled for a given processor’s instruction
    set could be run on that processor.'
  - '[PAGE 359]


    # Process Scheduling


    +   - Assignment of processes to processors

    +   - Use of multiprogramming on individual processors

    +   - Actual dispatching of a process


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_359_0.png)'
  - '[PAGE 360]


    <!-- no content -->'
  - '[PAGE 361]


    # Assignment of Processes to Processors


    +   - **Peer architecture (symmetric multiprocessing)**

    +     - Operating system can execute on any processor

    +     - Each processor is self-scheduling

    +   - **Ready queue**

    +     - Each processor has its own private ready queue

    +     - A common ready queue

    +   - **Using private queue, permanently assign process to a processor**

    +     - Possible to provide a dedicated short-term queue for each processor

    +     - Problem: one processor could be idle while another one was very busy

    +   - **Using common queue, must ensure:**

    +     - two processors do not choose the same process

    +     - processes are not lost from the queue'
  - '[PAGE 362]


    # Processor Affinity


    +   - **Processor Affinity(亲和力)**

    +     - A process has an affinity for the processor on which it is currently running

    +     - keep a process running on the same processor


    +   - **Example: high cost of invalidating and re-populating cache memory**


    +   - **Take forms**

    +     - **Soft affinity**

    +       - The OS has a policy of attempting to keep a process running on the same
    processor, but does’t guarantee that it will do so.

    +     - **Hard affinity**

    +       - The OS provides system calls, allowing a process to specify that it
    is not to migrate to other processors'
  - '[PAGE 363]


    # # Load balancing


    +   - Load balancing: keep the workload evenly distributed across all processors
    in an SMP system

    +   - Load balancing is **only necessary** on systems where each processor has
    its own private ready queue

    +   - Two approaches

    +     - Push migration: a **specific task** periodically checks the load on each
    processor, if imbalance, pushing processes from overloaded processor to idle or
    less-busy ones.

    +     - Pull migration: an idle processor pulls a waiting task from a busy processor

    +   - Often counteracts the benefits of processor affinity'
  - '[PAGE 364]


    # Symmetric multithreading (SMT)


    +   - SMP systems allow several threads to run concurrently by providing multiple
    processors

    +   - SMT: provide multiple logical processors

    +     Hyperthreading technology on Intel processors

    +   - Create multiple logical processors on the same physical processor

    +     - presenting a view of several logical processors to the OS, even on a system
    with only a single physical processor.

    +     - Each logical processor has its own architecture state (including general-purpose
    and machine-state registers)

    +     - Each logical processor is responsible for its own interrupt handling

    +     - Each logical processor shares the resources of its physical processor,
    such as cache memory and buses'
  - '[PAGE 365]


    # A typical SMT architecture


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_365_0.png)


    +   - **SMT is a feature provided in hardware**

    +     - Hardware must provide the representation of the architecture state for
    each logical processor and interrupt handling'
  - '[PAGE 366]


    # 5.5 Thread Scheduling


    # Threads


    +   - Executes separate from the rest of the process

    +   - An application can be a set of threads that cooperate and execute concurrently
    in the same address space

    +   - Threads running on separate processors yields a dramatic gain in performance


    # Thread Scheduling


    +   - Local Scheduling – How the threads library decides which user-level thread
    to put onto an available LWP. m:1 and m:n model, process-contention scope (PCS)

    +   - Global Scheduling – How the kernel decides which kernel thread to run next.
    System-contention scope (SCS) 1:1 model uses only SCS.'
