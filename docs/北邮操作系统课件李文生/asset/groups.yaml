    \n## 举例——动态优先级、剥夺式调度\n\n某系统采用基于动态优先级的剥夺式调度算法，并且优先数越大的进程其优先级越高。\n\n系统为所有新建进程赋予优先数0，当一个进程在就绪队列中等待CPU时，其优先数的变化速率为\
    \ α；进程获得CPU后开始执行，执行过程中，其优先数的变化速率为 β。\n\n为参数 α 和 β 设置不同的值，则导致不同的调度算法。\n\n问题：\n\
    - a. 如果 β>α>0，则调度原则是什么？\n- b. 如果 α<β<0，则调度原则是什么？\n\n## 解答a: 如果 β>α>0, 调度原则是FCFS\n\
    \n已知：优先数越大、优先级越高。\n\n分析：\n- 由于新建进程的优先数是0，具有最低优先级。\n- 当它在就绪队列中等待时，进程的优先数不断增加，即优先级不断提高，所以最早进入就绪队列的进程，其优先级也最高。\n\
    - 优先级最高的进程获得调度。\n- 当进程在CPU上执行时，它的优先数以更快的速度增加，故就绪队列中的任何进程不可能具有比执行中进程更高的优先级，执行进程将一直占有CPU，直到它执行结束。\n\
    - 然后，在就绪队列中等待时间最长的进程被调度到CPU上执行。\n\n所以，调度原则是 first-come first-served。\n\n## 解答b：如果\
    \ α<β<0，调度原则是LCFS\n\n已知：优先数越大、优先级越高。\n\n分析：\n- 由于新建进程的优先数是0，一旦它进入就绪队列，它的优先数就开始减少，就绪时间越长，其优先数越小，即优先级越低，所以新建进程具有最高优先级。\n\
    - 由于新建进程优先级最高，所以被调度到CPU上执行。\n- 当进程在CPU上执行时，它的优先数也不断减少，但减少的速度要比就绪进程的慢，故就绪队列中的任何进程不可能具有比执行中进程更高的优先级。\n\
    - 如果进程执行过程中，有新建进程进入就绪队列，则由于新进程的优先级最高，将抢占CPU而执行，原来的执行进程进入就绪队列，它的优先级以更快的速度降低。\n\
    - 如果进程执行过程中，没有新建进程，则执行进程将一直占有CPU，直到它执行结束。\n- 然后，在就绪队列中等待时间最短的进程被调度到CPU上执行。\n\n\
    所以，调度原则是 Last-Come First-Served。\n\n## 5.3.4 Round Robin (RR) Scheduling\n\n-\
    \ Each process gets a small unit of CPU time (*time quantum, or time slice*),\
    \ usually 10–100 milliseconds. After this time has elapsed, the process is **preempted**\
    \ and added to the end of the ready queue.\n- Keep the ready queue as a FIFO queue\
    \ of processes.\n- Set a timer to interrupt after 1 time quantum.\n- Two cases:\
    \ CPU burst of the currently running process\n  - less than 1 time quantum. The\
    \ process release the CPU voluntarily.\n  - longer than 1 time quantum. The timer\
    \ will go off and will cause an interrupt to the operating system. A context switch\
    \ will be executed, and the process will be put at the tail of the ready queue\n\
    \n## Example of RR with Time Quantum=20\n\n| Process | Burst Time | arrival time\
    \ |\n|---|---:|---:|\n| $P_1$ | 53 | 0 |\n| $P_2$ | 17 | 0.01 |\n| $P_3$ | 68\
    \ | 0.02 |\n| $P_4$ | 24 | 0.03 |\n\n▪ The Gantt chart is:\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_344_0.png)\n\
    \n- Waiting time for: $P_1=81$; $P_2=20$; $P_3=94$; $P_4=97$\n- Average waiting\
    \ time = $(81 + 20 + 94 + 97)/4 = 73$\n"
