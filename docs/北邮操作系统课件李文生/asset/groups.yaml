    \ i)\n    void test(int i)\n    void init() {\n        for (int i = 0; i < 5;\
    \ i++)\n            state[i] = thinking;\n    }\n}\n```\n\n## Dining Philosophers\
    \ (Cont.)\n\n```\nvoid pickup(int i) {\n    state[i] = hungry;\n    test(i);\n\
