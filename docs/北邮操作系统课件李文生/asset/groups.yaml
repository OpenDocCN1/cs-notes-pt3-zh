  mdcn: "\n\n## 地址绑定\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_516_0.png)\n\n##\
    \ 指令和数据到内存的绑定\n\n指令和数据到内存地址的地址绑定可以在三个不同的阶段进行。\n\n- **编译时：** 如果内存位置事先已知，可以生成绝对代码；如果起始位置改变，必须重新编译代码。\n\
    - **装入时：** 如果编译时不知道内存位置，必须生成*可重定位*代码。\n- **执行时：** 如果进程在执行期间可以从一个内存段移动到另一个内存段，则绑定必须推迟到运行时间。需要硬件支持地址映射，例如\
    \ *基址和界限寄存器*。\n\n## 逻辑地址空间 vs 物理地址空间\n\n- *逻辑地址空间*绑定到独立的*物理地址空间*的概念是正确内存管理的核心。\n\
    \  - *逻辑地址* – 由 CPU 生成；也称为*虚拟地址*。\n  - *物理地址* – 内存单元看到的地址；加载到内存地址寄存器中。\n  - *逻辑地址空间*：程序生成的所有逻辑地址的集合\n\
    \  - *物理地址空间*：对应于这些逻辑地址的所有物理地址的集合。\n- 在编译时和装入时地址绑定方案中，逻辑地址和物理地址是相同的。\n- 在执行时地址绑定方案中，逻辑（虚拟）地址和物理地址不同。\n\
    \n## 内存管理单元（MMU）\n\n- 将虚拟地址映射到物理地址的硬件设备，在运行时进行。\n- 在 MMU 方案中，**重定位寄存器**中的值会在发送到内存时加到用户进程生成的每个地址上。\n\
    - 用户程序处理的是*逻辑*地址；它永远看不到*真实*的物理地址。\n\n## 使用重定位寄存器进行动态重定位\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_520_0.png)\n\
    \n## * 动态加载\n\n- 例程在被调用前不会被加载。\n- 主程序被加载到内存中并执行，所有例程都以可重定位加载格式保存在磁盘上。\n- 需要时，调用可重定位链接装入器。\n\
    - 更好的内存空间利用；未使用的例程永远不会被加载。\n- 当需要大量代码来处理不经常出现的情况时很有用，例如错误例程。\n- 不需要操作系统的特殊支持，通过程序设计实现。\n\
    \n## * 动态链接\n\n- 链接推迟到执行时间。\n- 每个库例程引用在映像中都包含一个*存根*。\n- *存根*，用于定位适当的内存驻留库例程的小段代码，或在例程尚未存在时如何加载库。\n\
    - 执行时，*存根*用例程的地址替换自身，并执行该例程。\n- 动态链接通常需要操作系统的帮助（操作系统需要检查例程是否在进程的内存地址中）。\n- 动态链接对库特别有用。\n\
    \  - 库可以被新版本替换，所有引用该库的程序将自动使用新版本。\n- 共享库\n\n## 8.2 交换\n\n- 进程可以暂时被*交换*到*备份存储*中，然后再被带回内存继续执行。\n\
    - **备份存储** – 足够大的快速磁盘，可容纳所有用户所有内存映像的副本；必须提供对这些内存映像的直接访问。\n- *换出，换入* – 用于基于优先级的调度算法的交换变体；低优先级进程被换出，以便高优先级进程可以被加载和执行。\n\
    - *就绪队列* — 由所有内存映像在备份存储上或在内存中并且准备运行的进程组成。\n- 每当 CPU 调度程序决定执行一个进程时，就会调用**调度器**。\n\
    \n"
