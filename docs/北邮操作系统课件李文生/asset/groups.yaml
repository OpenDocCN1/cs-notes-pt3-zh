  mdcn: "\n\n## 局部性原理\n\n- 进程内的程序和数据引用倾向于聚集\n- 在短时间内只需要进程中的少数部分\n- 可以对未来需要哪些部分做出智能猜测\n\
    - 这表明虚拟内存可能工作高效\n\n## 工作集模型\n\n- Δ ≡ 工作集窗口 ≡ 一个固定的页面引用数\n\n  示例：10,000 条指令\n-\
    \ WSSᵢ（进程 Pᵢ 的工作集大小）= 最近 Δ 中引用的页面总数（随时间变化）\n    - 如果 Δ 太小则无法涵盖整个局部性。\n    - 如果\
    \ Δ 太大则会涵盖多个局部性。\n    - 如果 Δ = ∞ ⇒ 将涵盖整个程序。\n- D = Σ WSSᵢ ≡ 总需求帧数\n- 如果 D > m\
    \ ⇒ 抖动\n- 策略如果 D > m，则挂起其中一个进程。\n\n## 跟踪工作集\n\n- 用间隔计时器 + 参考位近似\n- 示例：Δ = 10,000\
    \ 次引用\n    - 计时器每 5000 个时间单位中断一次。\n    - 为每个页面保留 2 个内存位。\n    - 每当计时器中断时，复制并将所有参考位的值设为\
    \ 0。\n    - 如果内存中的其中一位 = 1 ⇒ 页面在工作集中。\n- 为什么这不完全准确？\n- 改进：10 个历史内存位并每 1000 个时间单位中断一次。\n\
    \n## 缺页频率方案\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_665_0.png)\n\n- 建立“可接受”的缺页率。\n\
