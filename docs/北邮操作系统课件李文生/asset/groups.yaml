    \ bus\n\nI/O bus\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_0.png)\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_1.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_2.png)\n\n## Supplement: I/O Buffering\n\
    \n- **Block-oriented**\n  - Information is stored in fixed sized blocks\n  - Transfers\
    \ are made a block at a time\n  - Used for disks and tapes\n\n- **Stream-oriented**\n\
    \  - Transfer information as a stream of bytes\n  - Used for terminals, printers,\
    \ communication ports, mouse, and most other devices that are not secondary storage\n"
  mdcn: "\n## 复习：1) 程序I/O\n\n- I/O模块执行操作，而不是处理器\n- 在I/O状态寄存器中设置相应的位\n- 无中断发生\n- 处理器检查状态直到操作完成\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_876_0.png)\n\n## 复习：中断驱动I/O（续）\n\n\
    - **同步I/O**----I/O开始后，仅当I/O完成时控制才返回用户程序。\n- **异步I/O**----I/O开始后，控制立即返回用户程序，无需等待I/O完成。\n\
    - **对于同步I/O**，CPU等待I/O完成可使用两种方法：\n  - 等待指令使CPU空闲直到下一个中断\n  - 等待循环（内存访问的竞争）。\n\
    \  - 同一时刻最多只有一个I/O请求未完成，无法同时进行I/O处理。\n- 为了提高CPU和I/O设备的利用率，我们需要：\n  - *系统调用*——请求操作系统允许用户等待I/O完成。\n\
    \  - *设备状态表*包含每个I/O设备的条目，指明其类型、地址和状态。\n  - 操作系统查询I/O设备表以确定设备状态，并修改表条目以包含中断。\n\n\
    ## 复习：两种方法\n\n### 同步\n\n### 异步\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_879_0.png)\n\
    \n## 复习：3) 直接内存访问结构\n\n- 直接在内存与设备之间传输数据块。\n- 用于能够以接近内存速度传输信息的高速I/O设备。\n- 在为I/O设备设置缓冲区、指针和计数器后，设备控制器将数据块直接从缓冲存储器传输到主内存，无需CPU干预。\n\
    - 每个数据块只产生一次中断，而不是每字节一次中断。\n- 任务完成时发送中断。\n- 处理器仅在传输开始和结束时介入。\n\n## 复习：直接内存访问（续）\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_882_0.png)\n\n当设备控制器执行DMA传输时，CPU可以处理其他工作。\n\
    \n## 复习：4) I/O通道控制方式\n\n- 是DMA方式的发展，进一步减少了CPU的干预。\n- 完成一组数据块的读(或写)操作之后产生一次中断。\n\
    - 实现了CPU、通道和I/O设备三者的并行操作。\n- CPU对通道的管理是通过I/O指令实现的。\n  - I/O指令属于特权指令，仅能由操作系统使用。\n\
    \  - 在I/O指令中需指定通道号、设备号、以及通道程序的内存地址。\n- 当CPU要完成一组相关的读(或写)操作及有关控制时，只需向I/O通道发送一条I/O指令，以给出其所要执行的通道程序的首址和要访问的I/O设备，通道接到该指令后，通过执行通道程序便可完成CPU指定的I/O任务。\n\
    \n## 复习：通道指令\n\n- **通道指令**也称为通道命令字（CCW，Channel Command Word）\n  - 对设备进行初始化、读、写、查询、转移等\n\
    \  - 使用CCW可以编写对各种不同设备进行管理和控制的通道程序\n  - 一个通道可以以分时方式同时执行几个通道程序\n  - 通道指令在进程要求数据时自动生成\n\
    \n- **指令格式：** OP P R 计数 内存地址\n  - OP：读、写、或控制\n  - P：通道程序结束标志\n    - P='1'，本条指令为最后一条指令。\n\
    \  - R：记录结束标志\n    - R='0'，本指令与下一条指令所处理的数据属于同一条记录\n    - R='1'，本指令是处理某记录的最后一条指令。\n\
    \  - 计数：本条指令所要处理数据的字节数\n  - 内存地址：\n    - 读操作：数据要写入的内存地址\n    - 写操作：要写出的数据在内存中的起始地址\n\
    \n## 复习：通道程序举例\n\n| OP | P | R | 计数 | 内存地址 |\n|---|---|---|---|---|\n| 读 | 0 |\
    \ 0 | 250 | 1850 |\n| 读 | 1 | 1 | 250 | 720 |\n| 写 | 0 | 0 | 80 | 813 |\n| 写 |\
    \ 0 | 0 | 140 | 1034 |\n| 写 | 0 | 1 | 60 | 5830 |\n| 写 | 0 | 1 | 300 | 2000 |\n\
    | 写 | 0 | 0 | 200 | 1650 |\n| 写 | 1 | 1 | 300 | 2720 |\n\n## 补充：典型DMA框图\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_886_0.png)\n\
    \n## 补充：指令周期\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_887_0.png)\n\n周期窃取导致CPU执行速度变慢。\n\
    \n## 补充：DMA方案\n\n单总线，分离式DMA\n\n单总线，集成DMA-I/O\n\nI/O总线\n\n系统总线\n\nI/O总线\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_0.png)\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_1.png)\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_888_2.png)\n\
    \n## 补充：I/O缓冲\n\n- **面向块**\n  - 信息以固定大小的块存储\n  - 每次传输一个块\n  - 用于磁盘和磁带\n\n- **面向流**\n\
    \  - 以字节流形式传输信息\n  - 用于终端、打印机、通信端口、鼠标以及大多数非辅助存储设备\n\n"
