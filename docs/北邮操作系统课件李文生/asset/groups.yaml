    \ I/O completion.\n  - *Device-status table* contains entry for each I/O device\
    \ indicating its type, address, and state.\n  - Operating system indexes into\
    \ I/O device table to determine device status and to modify table entry to include\
    \ interrupt.\n\n## Review: Two Methods\n\n### Synchronous\n\n### Asynchronous\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_98_0.png)\n\n## Review: Device-Status\
    \ Table\n\n| Device | Status |\n|---|---|\n| keyboard | idle |\n| laser printer\
    \ | busy |\n| mouse | idle |\n| disk unit 1 | idle |\n| disk unit 2 | busy |\n\
    | ⋮ | ⋮ |\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_99_0.png)\n\n## Review:\n\
    \n### 3) Direct Memory Access Structure\n\n- Transfers a block of data directly\
    \ to or from memory.\n- Used for high-speed I/O devices able to transmit information\
    \ at close to memory speeds.\n- After setting up buffers, pointers, and counters\
    \ for the I/O devices, device controller transfers blocks of data from buffer\
    \ storage directly to main memory without CPU intervention.\n- Only one interrupt\
    \ is generated per block, rather than the one interrupt per byte.\n  - An interrupt\
    \ is sent when the task is complete\n  - The processor is only involved at the\
    \ beginning and end of the transfer\n\n## Review: Direct Memory Access (Cont.)\n\
    \nCPU is available to accomplish other work while the device controller is performing\
    \ the DMA transfer\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_101_0.png)\n\n\
    ## Review: 4) I/O通道控制方式\n\n- 是DMA方式的发展，进一步减少了CPU的干预。\n- 完成一组数据块的读（或写）操作之后产生一次中断。\n\
    - 实现了CPU、通道和I/O设备三者的并行操作。\n- CPU对通道的管理是通过I/O指令实现的。\n  - I/O指令属于特权指令，仅能由操作系统使用。\n\
    \  - 在I/O指令中需指定通道号、设备号，以及通道程序的内存地址。\n- 当CPU要完成一组相关的读（或写）操作及有关控制时，只需向I/O通道发送一条I/O指令，以给出其所要执行的通道程序的首址和要访问的I/O设备，通道接到该指令后，通过执行通道程序便可完成CPU指定的I/O任务。\n\
    \n## Review:通道指令\n\n- 通道指令也称为通道命令字(CCW, Channel Command Word)\n  - 对设备进行初始化、读、写、查询、转移等\n\
    \  - 使用CCW可以编写对各种不同设备进行管理控制的通道程序\n  - 一个通道可以以分时方式同时执行几个通道程序\n  - 通道指令在进程要求数据时自动生成\n\
    - 指令格式: OP P R 计数 内存地址\n  - OP: 读、写、或控制\n  - P: 通道程序结束标志\n    P='1'，本条指令为最后一条指令。\n\
    \  - R: 记录结束标志\n    R='0'，本指令与下一条指令所处理的数据属于同一条记录\n    R='1'，本指令是处理某记录的最后一条指令。\n\
    \  - 计数: 本条指令所要处理数据的字节数\n  - 内存地址:\n    读操作: 数据要写入的内存地址\n    写操作: 要写出的数据在内存中的起始地址\n\
    \n## Review:通道程序举例\n\nOP　P　R　计数　内存地址\n\n- `read 0 0 250 1850`\n- `read 1 1 250\
    \ 720`\n\n- `write 0 0 80 813`\n- `write 0 0 140 1034`\n- `write 0 1 60 5830`\n\
    - `write 0 1 300 2000`\n- `write 0 0 200 1650`\n- `write 1 1 300 2720`\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_104_0.png)\n\
    \n## Chapter 2\nOperating-System Structures\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_105_0.png)\n\
    \nTeaching hours: 4h\n\n### Strong point:\n\n- system components\n- operating\
    \ system service and system call\n- system structure\n- virtual machines\n\n##\
    \ Chapter Objectives\n\n- To describe the services an operating system provides\
    \ to users, processes, and other systems\n- To discuss the various ways of structuring\
    \ an operating system\n- To explain how operating systems are installed and customized\
    \ and how they boot\n\n## Contents\n\n- 2.1 Operating System Services\n- 2.2 User\
    \ Operating System Interface\n- 2.3 System Calls\n- 2.4 Types of System Calls\n\
    - 2.5 System Programs\n- 2.6 Operating System Design and Implementation(*)\n-\
    \ 2.7 Operating System Structure\n- 2.8 Virtual Machines\n- 2.9 Operating System\
    \ Generation(*)\n- 2.10 System Boot(*)\n"
  mdcn: "\n\n## Review: Interrupt-Driven I/O (Cont.)\n\n- **Synchronous I/O**----在\
    \ I/O 开始后，只有在 I/O 完成时控制才返回到用户程序。\n- **Asynchronous I/O**----在 I/O 开始后，控制在无需等待\
    \ I/O 完成的情况下返回到用户程序。\n- **对于同步 I/O，CPU 等待 I/O 完成时可以使用两种方法：**\n  - 等待指令使 CPU 空闲直到下一个中断\n\
    \  - 等待循环（竞争（竞争）内存访问）。\n- 同时最多只有一个 I/O 请求处于未完成状态，不能同时进行 I/O 处理。\n- **为了提高 CPU\
