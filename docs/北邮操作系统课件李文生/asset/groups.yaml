  mdcn: "\n\n## 存储设备层次结构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_26_0.png)\n\n\
    - 寄存器\n- 缓存\n- 主存储器\n- 电子磁盘\n- 磁盘\n- 光盘\n- 磁带\n\n易失性\n\n易失性或非易失性\n\n非易失性\n\n##\
    \ 1.2.3 I/O 结构\n\n- 程序化 I/O\n- 中断驱动 I/O\n  - 同步 I/O\n  - 异步 I/O\n- DMA\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_27_0.png)\n\
    \n## I/O 操作\n\n- **设备控制器**\n  - 本地缓冲存储\n  - 一组专用寄存器\n  - 在设备与其本地缓冲存储之间移动数据\n-\
    \ **设备驱动程序**\n  - 每个设备控制器对应一个\n  - 向设备提供统一的接口\n- **I/O 操作**\n  - 设备驱动程序加载控制器内的寄存器\n\
    \  - 控制器检查寄存器的内容以确定要采取什么操作\n  - 控制器开始在设备与其本地缓冲区之间传输数据\n  - 完成后，控制器通过中断通知驱动程序\n\
    \  - 驱动程序将控制权连同数据如果为‘读’则返回给操作系统\n\n## 1.3* 计算机系统架构\n\n- **单处理器系统**\n  - 一个主 CPU\
    \ 执行通用指令集\n  - 专用处理器运行有限的指令集且不运行用户进程，例如控制器、I/O 处理器\n- **多处理器系统/并行系统**\n  - 两个或多个处理器紧密通信，共享计算机总线和时钟、内存及\
    \ I/O 设备\n  - 优点\n    - 吞吐量提高\n    - 规模经济\n    - 可靠性提高\n\n## 多处理器系统\n\n- **对称多处理**\n\
    \  - 每个处理器在操作系统内执行所有任务\n  - 所有处理器都是对等关系\n- **非对称多处理**\n  - 每个处理器被分配特定任务\n  - 一个主处理器控制系统\n\
    \  - 其他从处理器向主处理器寻求指令或具有预定义任务\n  - 主处理器调度并将工作分配给从处理器\n- **多核 CPU**\n  - 单个芯片上多个计算核心\n\
    \  - 双路芯片正成为主流\n\n## 计算机系统架构（续）\n\n### 集群系统\n\n- 集群计算机共享存储并通过局域网或更快的互连如 InfiniBand\
    \ 紧密连接。\n- 用于提供高可用性服务\n- 一层集群软件在集群节点上运行\n- 非对称集群\n  - 一台机器处于热备份模式而另一台运行应用程序\n\
    \  - 热备份主机机器除了监控活动服务器外什么都不做\n- 对称集群\n  - 两个或多个主机正在运行应用程序并相互监控\n\n## 1.4 操作系统结构\n\
    \n- 批处理系统\n- 分时系统\n- 实时系统\n\n## 补充：简单批处理系统的内存布局\n\n常驻监控程序\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_33_0.png)\n\
    \n## 补充：问题与解决方案（续）： spooling\n\n- **S**imultaneous **P**eripheral **O**peration\
    \ **O**n **L**ine\n- 使一个作业的 I/O 与另一个作业的计算重叠。在执行一个作业时，操作系统会\n  - 从卡片阅读机读取下一个作业到磁盘上的存储区域（作业队列）。\n\
    \  - 将前一个作业的打印输出从磁盘输出到打印机。\n- *作业池* – 数据结构，允许操作系统选择下一个运行的作业以提高 CPU 利用率。\n\n##\
    \ 补充：spooling（续）\n\n- 系统/用户进程\n  - 输入请求\n- 卡片阅读机\n- 操作系统\n  - 输入进程\n- 内存\n- 作业池\n\
    - 系统/用户进程\n  - 输出请求\n- 行式打印机\n- 操作系统\n  - 输出进程\n\n## 为提高效率需要多道程序设计\n\n- 单个用户无法始终使\
    \ CPU 和 I/O 设备保持忙碌\n- 多道程序设计组织作业（代码和数据），使 CPU 总是有可执行的作业\n- 系统中总作业的子集保留在内存中\n-\
    \ 通过 **作业调度** 选择并运行一个作业\n- 当它需要等待时（例如等待 I/O），操作系统切换到另一个作业。\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_37_0.png)\n\
    \n"
