    \n### Physical memory address\n\n- two parts: frame number (F), offset (d)\n-\
    \ bits of F: determined by the number of memory frames\n- bits of d: determined\
    \ by the size of the frame/page\n- bits of physical address: n'+m\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_537_1.png)\n\
    \n### Address Translation Architecture\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_538_0.png)\n\
    \n### Paging model\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_539_0.png)\n\n\
    logical memory, page table, frame number, physical memory\n\nThe size of a page\
    \ is typically a power of 2, varying between 512 bytes and 16MB per page.\n\n\
    | page number | page offset |\n|---|---|\n| p | d |\n| m-n bits | n bits |\n\n\
    ### Example of address mapping\n\n- Page size: 1KB, a process can have 8 pages,\
    \ there are 64 memory frames.\n- Length of LA is 13 bits (3+10)\n- Length of PA\
    \ is 16 bits (6+10)\n- LA: 2500\n  = 2 * 1024 + 452 → 010 0111000100\n\nPTLR,\
    \ PTBR\n\nLogical address\n\nPhysical address\n\n- PA: 001000 0111000100 → 8 *\
    \ 1024 + 452 = 8644\n\n### Free Frames\n\n**Before allocation:**\n\nfree-frame\
    \ list: 14, 13, 18, 20, 15\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_542_0.png)\n\
    \n| 页框编号 | 状态 |\n|---|---|\n| 13 | 空闲 |\n| 14 | 空闲 |\n| 15 | 空闲 |\n| 16 | 已占用\
    \ |\n| 17 | 已占用 |\n| 18 | 空闲 |\n| 19 | 已占用 |\n| 20 | 空闲 |\n| 21 | 已占用 |\n\n**After\
    \ allocation:**\n\nfree-frame list: 15\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_542_1.png)\n\
    \nNew process page table:\n\n| 新进程页号 | 页框号 |\n|---|---|\n| 0 | 14 |\n| 1 | 13\
    \ |\n| 2 | 18 |\n| 3 | 20 |\n\n| 页框编号 | 状态 |\n|---|---|\n| 13 | page 1 |\n| 14\
    \ | page 0 |\n| 15 | 空闲 |\n| 16 | 已占用 |\n| 17 | 已占用 |\n| 18 | page 2 |\n| 19 |\
    \ 已占用 |\n| 20 | page 3 |\n| 21 | 已占用 |\n\n### Hardware support\n\n- Page table\
    \ is kept in main memory.\n- *Page-table base register* (**PTBR**) points to the\
    \ page table.\n- *Page-table length register* (**PTLR**) indicates size of the\
    \ page table.\n- In this scheme every data/instruction access requires two memory\
    \ accesses: one for the page table entry and one for the data/instruction.\n-\
    \ The two-memory-access problem can be solved by the use of a special, small,\
    \ fast-lookup hardware cache, called *translation look-aside buffers* (转换后备缓冲区\
    \ **TLBs**), or *associative memory* (联想存储器).\n\n### Translation Look-aside Buffer（转换后备缓冲区）\n\
    \n- Contains the page table entries that have been most recently used.\n- Functions\
    \ the same way as a memory cache.\n- Given a logical address, the processor examines\
    \ the TLB.\n- If the page table entry is found (a **hit**), the frame number is\
    \ retrieved and the physical address is formed.\n- If the page table entry is\
    \ not found in the TLB (a **miss**), the page number is used to index the process\
    \ page table.\n  - First checks if the page is already in main memory\n    - if\
    \ not in main memory, a page fault is issued\n- The TLB is updated to include\
    \ the new page entry.\n"
  mdcn: "\n\n## 8.4 分页\n\n- 进程的逻辑地址空间可以是不连续的；进程在物理内存可用时分配物理内存。\n- 物理内存被划分为固定大小的块，称为\
    \ **帧**（大小为 2 的幂，在 512 字节到 8192 字节之间）。\n- 逻辑内存被划分为相同大小的块，称为 **页**。\n- 后备存储被划分为固定大小的\
    \ **块**，其大小与内存帧相同。\n- 当进程要执行时，其页从后备存储加载到任何可用的内存帧中。\n\n- 跟踪所有空闲帧。\n- 要运行大小为 *n*\
    \ 页的程序，需要找到 *n* 个空闲帧并加载程序。\n- 操作系统为每个进程维护一个 **页表**\n  - 包含进程中每个页的帧位置\n  - 页表用于将逻辑地址翻译为物理地址。\n\
    - 内部碎片。\n- CPU 生成的每个地址被划分为：\n  - *页号 (p)* – 用作页表的索引，页表包含物理内存中每个页的基地址。\n  - *页偏移量\
    \ (d)* – 与基地址组合以定义发送到内存单元的物理内存地址。\n\n### 地址结构\n\n### 逻辑地址\n\n- 两个部分：页号 (P)，偏移量\
    \ (d)\n- P 的位数：由页数决定\n- d 的位数：由页大小决定\n- 逻辑地址的位数：n+m\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_537_0.png)\n\
    \n### 物理内存地址\n\n- 两个部分：帧号 (F)，偏移量 (d)\n- F 的位数：由内存帧数决定\n- d 的位数：由帧/页大小决定\n- 物理地址的位数：n'+m\n\
    \n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_537_1.png)\n\n### 地址转换架构\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_538_0.png)\n\
    \n### 分页模型\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_539_0.png)\n\n逻辑内存，页表，帧号，物理内存\n\
    \n页的大小通常是 2 的幂，每页在 512 字节到 16MB 之间变化。\n\n| page number | page offset |\n|---|---|\n\
    | p | d |\n| m-n bits | n bits |\n\n### 地址映射示例\n\n- 页大小：1KB，一个进程可以有 8 页，有 64 个内存帧。\n\
    - LA 的长度为 13 位 (3+10)\n- PA 的长度为 16 位 (6+10)\n- LA: 2500\n  = 2 * 1024 + 452 →\
    \ 010 0111000100\n\nPTLR, PTBR\n\nLogical address\n\nPhysical address\n\n- PA:\
    \ 001000 0111000100 → 8 * 1024 + 452 = 8644\n\n### Free Frames\n\n**分配前：**\n\n\
    free-frame list: 14, 13, 18, 20, 15\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_542_0.png)\n\
    \n| 页框编号 | 状态 |\n|---|---|\n| 13 | 空闲 |\n| 14 | 空闲 |\n| 15 | 空闲 |\n| 16 | 已占用\
    \ |\n| 17 | 已占用 |\n| 18 | 空闲 |\n| 19 | 已占用 |\n| 20 | 空闲 |\n| 21 | 已占用 |\n\n**分配后：**\n\
    \nfree-frame list: 15\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_542_1.png)\n\
    \n新进程页表：\n\n| 新进程页号 | 页框号 |\n|---|---|\n| 0 | 14 |\n| 1 | 13 |\n| 2 | 18 |\n|\
    \ 3 | 20 |\n\n| 页框编号 | 状态 |\n|---|---|\n| 13 | page 1 |\n| 14 | page 0 |\n| 15\
    \ | 空闲 |\n| 16 | 已占用 |\n| 17 | 已占用 |\n| 18 | page 2 |\n| 19 | 已占用 |\n| 20 | page\
    \ 3 |\n| 21 | 已占用 |\n\n### 硬件支持\n\n- 页表保存在主内存中。\n- *页表基址寄存器* (**PTBR**) 指向页表。\n\
    - *页表长度寄存器* (**PTLR**) 指示页表的大小。\n- 在此方案中，每次数据/指令访问都需要两次内存访问：一次用于页表项，一次用于数据/指令。\n\
    - 双重内存访问问题可以通过使用一种特殊的、小型的、快速查找硬件缓存来解决，称为 *translation look-aside buffers*（转换后备缓冲区\
    \ **TLBs**），或 *associative memory*（联想存储器）。\n\n### Translation Look-aside Buffer（转换后备缓冲区）\n\
    \n- 包含最近使用过的页表项。\n- 其功能与内存缓存相同。\n- 给定一个逻辑地址，处理器会检查 TLB。\n- 如果找到页表项（**命中**），则检索帧号并形成物理地址。\n\
    - 如果在 TLB 中未找到页表项（**未命中**），则使用页号索引进程页表。\n  - 首先检查该页是否已在主内存中\n    - 如果不在主内存中，则会发出页错误\n\
    - TLB 会更新以包含新的页项。\n\n"
