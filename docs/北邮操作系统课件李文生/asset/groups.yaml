  mdcn: "\n# 确定性建模\n\n- 确定性建模——采用特定的预定义工作负载，并定义每种算法在该工作负载下的性能。\n\n- 示例\n  - 假设我们有以下工作负载：\n\
    \  - 考虑 FCFS、SJF、RR(q=10)\n  - 比较它们的平均等待时间\n\n| 进程 | 突发时间 |\n|---|---|\n| P₁ |\
    \ 10 |\n| P₂ | 29 |\n| P₃ | 3 |\n| P₄ | 7 |\n| P₅ | 12 |\n\n- 平均等待时间\n  - FCFS:\
    \ (0+10+39+42+49)/5=28\n  - SJF: (10+32+0+3+20)/5=13\n  - RR: (0+32+20+23+40)/5=23\n\
    \n# 排队模型\n\n- 必须给出进程进入系统的时间分布，即*到达时间分布*。\n- 计算机系统被描述为服务器网络。\n  - 每个服务器都有一个等待进程的队列。\n\
    \  - CPU 是一个带有就绪队列的服务器，I/O 系统也是带有设备队列的服务器。\n- 知道到达率和服务率后，我们可以计算利用率、平均队列长度、平均等待时间。\n\
    - **利特尔公式**：n=λ×W\n  - n：平均队列长度（不包括正在服务的进程）\n  - W：队列中的平均等待时间\n  - λ：队列中新进程的平均到达率\n\
    \n# 模拟\n\n- 模拟涉及对计算机系统模型进行编程\n  - 软件数据结构——系统的主要组件\n  - 变量——时钟\n  - 随着模拟的执行，收集并打印表明算法性能的统计信息。\n\
    - 驱动模拟的数据可以通过使用*随机数生成器*生成。\n- 分布可以用数学方式定义，也可以用*经验性地（根据经验）*定义。\n- 由于真实系统中连续事件之间存在关联，分布驱动的模拟可能不准确。\n\
    \n# 通过模拟评估 CPU 调度程序\n\n实际\n进程\n执行\n\n...\nCPU 10\nI/O 213\nCPU 12\nI/O 112\nCPU\
    \ 2\nI/O 147\nCPU 173\n...\n\n模拟\nFCFS\n\nFCFS 的\n性能\n统计\n\n模拟\nSJF\n\nSJF 的\n\
    性能\n统计\n\n模拟\nRR(q=4)\n\nRR(q=4) 的\n性能\n统计\n\n# 实现\n\n- 将实际算法放入真实系统中，在真实操作系统下进行评估。\n\
    - 困难\n  - *成本*：费用不仅产生于编写算法和修改操作系统以支持算法及其所需数据结构，还产生于用户对不断变化的操作系统的反应。\n  - *环境会改变*：环境不仅会以通常的方式改变（随着新程序的编写和问题类型的变化），而且会因调度程序的性能而改变。\n\
    \n# 作业（第186页）\n\n5.4   5.5   5.9\n\n- 1. 定义抢占式调度与非抢占式调度的区别。\n- 2. 非抢占式调度算法是交互式系统的良好选择吗？简要说明原因。\n\
    - 3. 假设某调度算法（在短期 CPU 调度层面）倾向于最近使用处理器时间最少的进程。为什么该算法会偏向 I/O 密集型程序，但又不会永久饿死 CPU 密集型程序？\n\
    \n4. 假设以下进程在所示时间到达执行，每个进程将运行所列时间。回答问题时要使用非抢占式调度，并在必须做出决策时根据当时所拥有的信息进行所有决策。\n\n\
    | 进程 | 到达时间 | 突发时间 |\n|---|---|---|\n| P1 | 0.0 | 8 |\n| P2 | 0.4 | 4 |\n| P3\
    \ | 1.0 | 1 |\n\na. 对于这些进程，使用 FCFS 调度算法的平均周转时间是多少？\n\nb. 对于这些进程，使用 SJF 调度算法的平均周转时间是多少？\n\
    \nc. SJF 算法理应能改善性能，但请注意，我们在时间 0 选择运行进程 P1，是因为我们不知道两个更短的进程即将到达。假设 CPU 在前 1 个时间单位内保持空闲，然后使用\
