- pgno: 737
  md: '# Supplement:


    # Minimal Set of Requirements


    +   - Each user should be able to **create**, **delete**, **read**, and **change**
    files

    +   - Each user may have **controlled access** to other users’ files

    +   - Each user may control **what type of accesses** are allowed to the users’
    files

    +   - Each user should be able to **restructure** the user’s files in a form appropriate
    to the problem

    +   - Each user should be able to **move data** between files

    +   - Each user should be able to **back up** and **recover** the user’s files
    in case of damage

    +   - Each user should be able to access the user’s files by **using symbolic
    names**'
  merge: -1
