    +   Maintain *wait-for* graph

    +   - Nodes are processes.

    +   - $P_i \rightarrow P_j$ if $P_i$ is waiting for $P_j$ to release a resource
    that $P_i$ needs.


    $P_i \rightarrow P_j$ exists in wait-for graph $\leftrightarrow$ $\exists q$,
