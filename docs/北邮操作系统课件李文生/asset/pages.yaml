    are gathered and printed.

    +   - The data to drive the simulation can be generated by using a *random-number
    generator*.

    +   - The distributions may be defined mathematically or *empirically (根据经验)*.

    +   - A distribution-driven simulation may be inaccurate, due to relationships
    between successive events in the real system.'
