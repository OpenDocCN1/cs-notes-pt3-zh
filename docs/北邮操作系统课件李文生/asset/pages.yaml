- pgno: 874
  md: '# Differences in I/O Devices


    +   - **Data rate**

    +     - May be differences of several orders of magnitude between the data transfer
    rates

    +   - **Application**

    +     - Disk used to store files requires file-management software

    +     - Disk used to store virtual memory pages needs special hardware and software
    to support it

    +     - Terminal used by system administrator may have a higher priority

    +   - **Complexity of control**

    +   - **Unit of transfer**

    +     - Data may be transferred as a stream of bytes for a terminal or in larger
    blocks for a disk

    +   - **Data representation**

    +     - Encoding schemes

    +   - **Error conditions**

    +     - Devices respond to errors differently'
