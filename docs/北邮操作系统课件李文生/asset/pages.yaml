  md: "# Bounded-Buffer procedure-consumer problem\n\n+   - Shared data\n\n```\n```c\n\
    #define BUFFER_SIZE 10\ntypedef struct {\n    ...\n} item;\nitem buffer[BUFFER_SIZE];\n\
    int in = 0;\nint out = 0;\nint counter = 0;\n```\n```"
