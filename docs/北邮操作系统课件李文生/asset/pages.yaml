  md: "# Race Condition\n\n▪ Assume **counter** is initially 5. One interleaving of\
    \ statements is:\n\n+   producer:  $register_1 = counter$    (*$register_1 = 5$*)\
    \  \n+   producer:  $register_1 = register_1 + 1$    (*$register_1 = 6$*)  \n\
    +   consumer:  $register_2 = counter$    (*$register_2 = 5$*)  \n+   consumer:\
    \  $register_2 = register_2 - 1$    (*$register_2 = 4$*)  \n+   producer:  $counter\
    \ = register_1$    (*$counter = 6$*)  \n+   consumer:  $counter = register_2$\
    \    (*$counter = 4$*)\n\n▪ The value of **counter** may be either 4 or 6, where\
    \ the correct result should be 5."
