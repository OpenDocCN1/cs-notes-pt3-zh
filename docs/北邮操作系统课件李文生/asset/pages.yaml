- pgno: 883
  md: "# Review: 4) I/O通道控制方式\n\n+   - 是DMA方式的发展，进一步减少了CPU的干预。\n+   - 完成一组数据块的读(或写)操作之后产生一次中断。\n\
    +   - 实现了CPU、通道和I/O设备三者的并行操作。\n+   - CPU对通道的管理是通过I/O指令实现的。  \n+     - I/O指令属于特权指令，仅能由操作系统使用。\
    \  \n+     - 在I/O指令中需指定通道号、设备号、以及通道程序的内存地址。\n+   - 当CPU要完成一组相关的读(或写)操作及有关控制时，只需向I/O通道发送一条I/O指令，以给出其所要执行的通道程序的首址和要访问的I/O设备，通道接到该指令后，通过执行通道程序便可完成CPU指定的I/O任务。"
  merge: -1
  img_proc: true
- pgno: 884
  md: '# Review:通道指令


    +   - **通道指令**也称为通道命令字（CCW，Channel Command Word）

    +     - 对设备进行初始化、读、写、查询、转移等

    +     - 使用CCW可以编写对各种不同设备进行管理和控制的通道程序

    +     - 一个通道可以以分时方式同时执行几个通道程序

    +     - 通道指令在进程要求数据时自动生成


    +   - **指令格式：** OP　P　R　计数　内存地址

    +     - OP：读、写、或控制

    +     - P：通道程序结束标志

    +       - P=''1''，本条指令为最后一条指令。

    +     - R：记录结束标志

    +       - R=''0''，本指令与下一条指令所处理的数据属于同一条记录

    +       - R=''1''，本指令是处理某记录的最后一条指令。

    +     - 计数：本条指令所要处理数据的字节数

    +     - 内存地址：

    +       - 读操作：数据要写入的内存地址

    +       - 写操作：要写出的数据在内存中的起始地址'
  merge: -1
  img_proc: true
