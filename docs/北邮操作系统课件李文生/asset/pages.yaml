- pgno: 47
  md: '# 1.5 Operating-System Operations


    +   - Interrupt driven by hardware

    +   - Software error or request creates **exception** or **trap**

    +     - Division by zero, request for operating system service

    +   - Other process problems include infinite loop, processes modifying each other
    or the operating system

    +   - **Dual-mode** operation allows OS to protect itself and other system components

    +     - Provide hardware support to differentiate between at least two modes of
    operations.

    +       1. *User mode* – execution done on behalf of a user.

    +       2. *Monitor mode* (also *kernel mode* or *system mode*) – execution done
    on behalf of operating system.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Dual-Mode Operation


    +   - **Mode bit** provided by hardware

    +     - monitor (0) or user (1)

    +     - Provides ability to distinguish when system is running user code or kernel
    code

    +     - Some instructions designated as **privileged**, only executable in kernel
    mode

    +     - System call changes mode to kernel, return from call resets it to user


    When an interrupt or fault occurs hardware switches to monitor mode.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Transition from User to Kernel Mode


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_49_0.png)


    # Timer to prevent infinite loop / process hogging resources


    +   - Set interrupt after specific period

    +   - Operating system decrements counter

    +   - When counter zero generate an interrupt

    +   - Set up before scheduling process to regain control or terminate program
    that exceeds allotted time

    +   - Instructions that modify the content of the timer are privileged.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 1.6 Process Management


    +   - A process is a program in execution. a unit of work within the system. The
    entity that can be assigned to and executed on a processor

    +   - Program is a *passive entity*, process is an *active entity*.

    +   - Process needs resources to accomplish its task

    +     - CPU, memory, I/O, files, Initialization data

    +   - Process termination requires reclaim(归还) of any reusable resources

    +   - Single-threaded process has one *program counter* specifying location of
    next instruction to execute

    +     - Process executes instructions sequentially, one at a time, until completion

    +   - Multi-threaded process has one program counter per thread

    +   - Typically system has many processes, some user, some operating system running
    concurrently on one or more CPUs

    +     - Concurrency by multiplexing the CPUs among the processes / threads'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Process Management Activities


    The OS is responsible for the following activities in connection with process
    management:


    +   - Creating and deleting both user and system processes

    +   - Suspending and resuming processes

    +   - Providing mechanisms for process synchronization

    +   - Providing mechanisms for process communication

    +   - Providing mechanisms for deadlock handling'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 1.7 Memory Management


    +   - Central to the operation of a modern computer system

    +     - All data in memory before and after processing

    +     - All instructions in memory in order to execute

    +   - The only large storage device that CPU is able to address and access directly

    +   - Memory management determines what is in memory when

    +     - Optimizing CPU utilization and computer response to users

    +   - Memory management activities

    +     - Keeping track of which parts of memory are currently being used and by
    whom

    +     - Deciding which processes (or parts thereof) and data to move into and
    out of memory

    +     - Allocating and deallocating memory space as needed'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Supplement: Virtual Memory


    +   - Allows programmers to address memory from a logical point of view

    +   - While one process is written out to secondary store and the successor process
    read in there in no hiatus (裂缝)'
  merge: -1
