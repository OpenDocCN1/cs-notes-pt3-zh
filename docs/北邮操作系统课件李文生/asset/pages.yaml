- pgno: 648
  md: '# LRU Approximation Algorithms


    # ▦ Reference bit algorithm


    +   - With each page associate a bit, initially = 0.

    +   - When page is referenced, the bit is set to 1.

    +   - Replace the one which is 0 (if one exists).

    +   - **Problem:** We do not know the order.'
  merge: -1
  img_proc: true
- pgno: 649
  md: '# LRU Approximation Algorithms


    # Additional-reference-bits algorithm


    +   - Keep an 8-bit byte for each page in a table in memory.

    +   - At regular intervals, a timer interrupts, OS shifts the reference bit for
    each page into the high-order bit of its 8-bit byte, shifting the other bits right
    by 1 bit and discarding the low-order bit

    +   - These 8-bit byte contains the history of page use for the last 8 time periods.

    +   - The page with the lowest number is the LRU page, can be replaced.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_649_0.png)'
  merge: -1
  img_proc: true
- pgno: 650
  md: '# LRU Approximation Algorithms


    # Second chance


    +   - Basic algorithm: FIFO replacement algorithm

    +   - Need reference bit

    +   - Clock replacement

    +   - If page to be replaced (in clock order) has reference bit = 1. then:

    +     - set reference bit 0.

    +     - leave page in memory.

    +     - replace next page (in clock order), subject to same rules.'
  merge: -1
  img_proc: true
