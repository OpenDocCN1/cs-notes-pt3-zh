- pgno: 559
  md: '# Inverted Page Table


    +   Has one entry for each real frame of memory.


    +   Each entry consists of the virtual address of the page stored in that real
    memory location, with information about the process that owns that page.


    +   Often requires an address-space identifier (ASID) stored in each entry of
    the page table. Ensures the mapping of a logical page for a particular process
    to the corresponding physical page frame.


    +   a simplified version of the implementation used in the IBM RT:


    < process-id, page-number, offset >'
  merge: -1
  img_proc: true
