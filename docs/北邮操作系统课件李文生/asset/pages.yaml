- pgno: 404
  md: '# 6.2 The Critical-Section Problem


    +   - *n* processes all competing to use some shared data

    +   - Each process has a code segment, called *critical section*, in which the
    shared data is accessed.

    +   - Problem – ensure that when one process is executing in its critical section,
    no other process is to be allowed to execute in its critical section.

    +   - Need to design a protocol that the processes can use to cooperate.

    +     - Each process must **request** permission to enter its critical section.

    +     - The section of code implementing this request is the **entry section**.

    +     - The critical section may be followed by an **exit section**.

    +     - The remaining code is the remainder section.'
  merge: -1
