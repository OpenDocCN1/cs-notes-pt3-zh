- pgno: 573
  md: '# Pentium segmentation


    +   - Allows a segment to be as large as 4GB, maximum number of segments per process
    is 16K(=16384).

    +   - The logical-address space of a process is divided into two partition

    +     - 1st, up to 8K segments, private to that process

    +     - 2nd, up to 8K segments, shared among all the processes

    +   - Information about the 1st partition is kept in the local descriptor table,
    LDT;

    +     information about the 2nd partition is kept in the global descriptor table,
    GDT.

    +   - Each entry in the LDT and GDT consists of an 8-byte segment descriptor with
    detailed information about a particular segment, including the base location and
    limit of that segment.'
  merge: -1
  img_proc: true
- pgno: 574
  md: '# Pentium segmentation


    +   - **Logical address: (selector, offset)**

    +     - Selector is a 16-bit number, **13-bit s, 1-bit g, and 2-bit p**

    +       - s, the segment number

    +       - g, whether the segment is in the GDT or LDT

    +       - p, deals with protection

    +     - offset, 32-bit number, location of byte within the segment

    +   - The machine has six segment registers, allowing 6 segments to be addressed
    at any time by a process.

    +   - It has six 8-byte microprogram registers to hold the corresponding descriptors
    from either the LDT or GDT. (cache)'
  merge: -1
  img_proc: true
- pgno: 575
