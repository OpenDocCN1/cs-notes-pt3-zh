- pgno: 482
  md: '# Resource-Request Algorithm for Process $P_i$


    +   - **$Request_i$** = request vector for process $P_i$.

    +     - If $Request_i[j] = k$ then process $P_i$ wants $k$ instances of resource
    type $R_j$.


    When a request for resource is made by process $P_i$,


    +   1. If $Request_i \leq Need_i$, go to step 2. Otherwise, raise error condition,
    since process has exceeded its maximum claim.

    +   2. If $Request_i \leq Available$, go to step 3. Otherwise $P_i$ must wait,
    since resources are not available.

    +   3. Pretend to allocate requested resources to $P_i$ by modifying the state
    as follows:

    +      - $Available = Available - Request_i$;

    +      - $Allocation_i = Allocation_i + Request_i$;

    +      - $Need_i = Need_i - Request_i$;

    +   4. If safe $\Rightarrow$ the resources are allocated to $P_i$.

    +      If unsafe $\Rightarrow P_i$ must wait, and the old resource-allocation
    state is restored.'
  merge: -1
  img_proc: true
