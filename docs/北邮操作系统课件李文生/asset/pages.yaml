- pgno: 565
  md: '# Segmentation Architecture


    +   - All segments of all programs do not have to be of the same length

    +   - There is a maximum segment length

    +   - Logical address consist of two parts - a segment number and an offset

    +     <segment-number, offset>

    +   - *Segment table* – maps two-dimensional physical addresses; each table entry
    has:

    +     - *base* – contains the starting physical address where the segments reside
    in memory.

    +     - *limit* – specifies the length of the segment.

    +   - *Segment-table base register* (**STBR**) points to the segment table’s location
    in memory.

    +   - *Segment-table length register* (**STLR**) indicates number of segments
    used by a program;

    +     segment number *s* is legal if *s* < STLR.'
  merge: -1
  img_proc: true
