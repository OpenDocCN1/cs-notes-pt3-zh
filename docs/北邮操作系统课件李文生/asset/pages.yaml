- pgno: 193
  md: '# 3.2.2 Schedulers


    +   - Long-term scheduler (or job scheduler) – selects which processes should
    be brought into the ready queue.

    +   - Short-term scheduler (or CPU scheduler) – selects which process should be
    executed next and allocates CPU.

    +   - Primary distinction: execution frequency.

    +     - Short-term scheduler is invoked very frequently (milliseconds) ⇒ (scheduler
    must be fast).

    +     - Long-term scheduler is invoked very infrequently (seconds, minutes) ⇒
    (scheduler may be slow).

    +     - The long-term scheduler controls the degree of multiprogramming. the number
    of processes in memory.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Schedulers (Cont.)


    +   - **Processes can be described as either:**

    +     - *I/O-bound process* – spends more time doing I/O than computations, many
    short CPU bursts.

    +     - *CPU-bound process* – spends more time doing computations; few very long
    CPU bursts.

    +   - **Select a good process mix.**

    +     - If all processes are I/O-bound, the ready queue will almost always be
    empty, and CPU scheduler will have little to do.

    +     - If all processes are CPU-bound, the I/O waiting queue will almost always
    be empty, devices will go unused.'
  merge: -1
  img_proc: true
