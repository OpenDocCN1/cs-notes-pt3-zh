- pgno: 525
  md: '# Swapping (Cont.)


    Major part of swap time is transfer time; total transfer time is directly proportional
    to the *amount* of memory swapped.


    +   - be useful to know exactly how much memory a user process is using, not simply
    how much it might be using.

    +   - The user must keep the system informed of any changes in memory requirements.


    Ensure the process we want to swap is **completely idle**.


    Solution to pending I/O


    +   - Never swap a process with pending I/O.

    +   - Execute I/O operations only into Operating-System buffers.


    Standard swapping is used in few systems. Modified versions of swapping are found
    on many systems, i.e., UNIX, Linux, and Windows.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_525_0.png)'
  merge: -1
  img_proc: true
- pgno: 526
  md: '# 8.3 Contiguous Memory Allocation


    +   - Main memory is usually divided into two partitions:

    +     - Resident operating system, usually held in low memory with interrupt vector.

    +     - User processes, held in high memory.

    +   - User space is divided into Multiple partitions

    +   - Single-partition allocation for each process

    +   - Relocation-register scheme used to protect user processes from each other,
    and from changing operating-system code and data.

    +     - Relocation register contains the value of the smallest physical address;

    +     - limit register contains the range of logical addresses – each logical
    address must be less than the limit register.'
  merge: -1
