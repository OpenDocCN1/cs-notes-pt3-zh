- pgno: 353
  md: '# 5.3.6 Multilevel Feedback Queue Scheduling


    +   - A process can move between the various queues.

    +   - To separate processes with different CPU-burst characteristics.

    +     - If a process uses too much CPU time, it will be moved to a lower-priority
    queue.

    +     - If a process waits too long in a lower-priority queue, it may be moved
    to a higher-priority queue.

    +   - Leaves I/O-bound and interactive processes in the higher-priority queues.

    +   - This form of aging prevents starvation.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Multilevel Feedback Queue Scheduling


    Multilevel-feedback-queue scheduler is defined by the following parameters:


    +   - the number of queues

    +   - the scheduling algorithms for each queue

    +   - the method used to determine when to upgrade a process to a higher-priority
    queue

    +   - the method used to determine when to demote a process to a lower-priority
    queue

    +   - the method used to determine which queue a process will enter when that
    process needs service'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Example of Multilevel Feedback Queue


    +   Three queues:

    +   - Q₀ – time quantum 8 milliseconds --highest priority

    +   - Q₁ – time quantum 16 milliseconds --lower priority

    +   - Q₂ – FCFS -- lowest priority


    +   Scheduling

    +   - A new process enters queue Q₀ which is served FCFS. When it gains CPU, it
    receives 8 milliseconds. If it does not finish in 8 milliseconds, the process
    is moved to the tail of queue Q₁.

    +   - At Q₁ process is again served FCFS and receives 16 additional milliseconds.
    If it still does not complete, it is preempted and moved to the tail of queue
    Q₂.'
  merge: -1
  img_proc: true
