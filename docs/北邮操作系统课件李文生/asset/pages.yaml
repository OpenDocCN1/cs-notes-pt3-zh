- pgno: 68
  md: '# 1.9 Protection and Security


    +   - **Protection** – any mechanism for controlling access of processes or users
    to resources defined by the OS


    +   - **Security** – defense of the system against internal and external attacks

    +     - Huge range, including denial-of-service, worms, viruses, identity theft,
    theft of service


    +   - **Access control**

    +     - regulate user access to the system


    +   - **Information flow control**

    +     - regulate flow of data within the system and its delivery to users


    +   - **Certification**

    +     - proving that access and flow control perform according to specifications'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Protection and Security (Cont.)


    +   - Systems generally first distinguish among users, to determine who can do
    what

    +     - User identities (**user IDs**, security IDs) include name and associated
    number, one per user

    +     - User ID then associated with all files, processes of that user to determine
    access control

    +     - Group identifier (**group ID**) allows set of users to be defined and
    controls managed, then also associated with each process, file

