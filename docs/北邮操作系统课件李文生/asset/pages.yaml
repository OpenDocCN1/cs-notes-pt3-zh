- pgno: 403
  md: '# Race Condition (Cont.)


    ▪ **Race condition:** The situation where several processes access and manipulate
    shared data concurrently. The final value of the shared data depends upon the
    particular order in which the access takes place.


    +   ▪ **Race conditions in operating systems**

    +     - The code implementing an OS is subject to several possible race conditions.

    +       - System open-file-table

    +       - Structures for maintaining memory allocation, for maintaining process
    lists, and for interrupt handling


    ▪ **To prevent race conditions, concurrent processes must be synchronized.**


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_403_0.png)'
  merge: -1
