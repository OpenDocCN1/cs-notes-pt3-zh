- pgno: 674
  md: '# 9.8 Allocating Kernel Memory


    +   - Treated differently from user memory.

    +   - Kernel memory is often allocated from a free-memory pool different from
    the list used to satisfy ordinary user-mode processes. Reasons are:

    +     - The kernel request memory for data structures of varying sizes, some of
    which are less than a page in size.

    +     - Some kernel memory needs to be contiguous. Certain hardware devices interact
    directly with physical memory, and may require memory residing in physically contiguous
    pages.

    +   - Buddy system

    +   - Slab allocation'
  merge: -1
  img_proc: true
- pgno: 675
  md: '# Buddy System (伙伴系统)


    +   - Allocates memory from a fixed-size segment consisting of physically contiguous
    pages.

    +   - Memory is allocated by using a **power-of-2 allocator**.

    +   - Entire space available is treated as a single block of \(2^U\).

    +   - If a request of size \(s\) such that \(2^{U-1} < s <= 2^U\), entire block
    is allocated

    +     - Otherwise block is split into two equal buddies

    +     - Process continues until smallest block greater than or equal to \(s\)
    is generated'
  merge: -1
  img_proc: true
