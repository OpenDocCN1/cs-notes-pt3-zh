- pgno: 331
  md: '# Prediction of the Length of the Next CPU Burst (*)


    +   - Can only estimate the length.

    +   - Can be done by using the length of previous CPU bursts, using exponential
    averaging.

    +     - tₙ = actual length of nth CPU burst

    +     - τₙ₊₁ = predicted value for the next CPU burst

    +     - α, 0 ≤ α ≤ 1

    +     - define:

    +       τₙ₊₁ = α tₙ + (1 − α) τₙ

    +   τₙ₊₁ = α tₙ + (1-α)α tₙ₋₁ + ... + (1-α)ʲ α tₙ₋ⱼ + ... + (1-α)ⁿ⁻¹ τ₀'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Prediction of the Length of the Next CPU Burst (*)


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_332_0.png)


    $\tau_{n+1}=\alpha\hat{t}_n+(1-\alpha)\tau_n\qquad \alpha=1/2\qquad \tau_0=10$


    |  |  |  |  |  |  |  |  |  |

    |---|---|---|---|---|---|---|---|---|

    | **CPU burst** ($t_i$) | 6 | 4 | 6 | 4 | 13 | 13 | 13 |  |

    | **“guess”** ($\tau_i$) | 10 | 8 | 6 | 6 | 5 | 9 | 11 | 12 |'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Examples of Exponential Averaging


    τₙ₊₁ = α tₙ + (1 − α) τₙ


    +   - α = 0

    +     - τₙ₊₁ = τₙ  Recent history does not count.


    +   - α = 1

    +     - τₙ₊₁ = tₙ  Only the actual last CPU burst counts.


    +   - If we expand the formula, we get:

    +     τₙ₊₁ = α tₙ + (1−α) α tₙ₋₁ + ... + (1−α)ʲ α tₙ₋ⱼ + ... + (1−α)ⁿ⁺¹ τ₀


    +   - Since both α and (1−α) are less than or equal to 1, each successive term
    has less weight than its predecessor.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 5.3.3 Priority Scheduling


    +   - A priority number (integer) is associated with each process

    +   - The CPU is allocated to the process with the highest priority (smallest
    integer = highest priority).

    +   - Equal-priority processes are scheduled in FCFS order.

    +   - Two schemes:

    +     - **Preemptive**: preempt the CPU if the priority of the newly arrived process
    is higher than the priority of the currently running process.

    +     - **Nonpreemptive**: simply put the new process at the head of the ready
    queue.

    +   - Priority can be defined either internally or externally.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Priority Scheduling(Cont.)


    +   - SJF is a priority scheduling where priority is the predicted next CPU burst
    time.

    +   - Problem ≡ Starvation (or indefinite blocking)—low priority processes may
    never execute.

    +   - Solution ≡ Aging – as time progresses increase the priority of the process.

    +   - For example

    +     - If priorities range from 127(low) to 0(high)

    +     - We could decrease the priority number of a waiting process by 1 every
    15 minutes.

    +     - Eventually, even a process with an initial priority of 127 would have
    the highest priority in the system and would be executed.'
  merge: -1
  img_proc: true
