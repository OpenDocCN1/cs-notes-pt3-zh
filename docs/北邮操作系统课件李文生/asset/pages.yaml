- pgno: 835
  md: '# I/O port


    +   - **4 registers**

    +     - Status: contains bits that can be read by the host. Idle, busy, ready,
    error

    +     - Control: can be written by the host to start a command or to change the
    mode of a device.

    +     - Data-in: read by the host to get input

    +     - Data-out: written by the host to send output


    Data registers are typically 1 to 4 bytes in size.


    Some controllers have FIFO chips to expand the capacity of the controller beyond
    the size of the data register.

    FIFO chips can hold several bytes of input or output data'
  merge: -1
  img_proc: true
- pgno: 836
  md: '# Techniques for Performing I/O


    +   - **Programmed I/O**

    +     - Process is busy-waiting for the operation to complete

    +   - **Interrupt-driven I/O**

    +     - I/O command is issued

    +     - Processor continues executing instructions

    +     - I/O module sends an interrupt when done

    +   - **Direct Memory Access (DMA)**

    +     - DMA module controls exchange of data between main memory and the I/O device

    +     - Processor interrupted only after entire block has been transferred


