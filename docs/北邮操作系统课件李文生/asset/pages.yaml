- pgno: 534
  md: '# Fragmentation


    +   - **External Fragmentation** – total memory space exists to satisfy a request,
    but it is not contiguous.

    +   - **Internal Fragmentation** – allocated memory may be slightly larger than
    requested memory; this **size difference** is memory internal to a partition,
    but not being used.

    +   - **Reduce external fragmentation by compaction**

    +     - Shuffle memory contents to place all free memory together in one large
    block.

    +     - Compaction is possible only if relocation is dynamic, and is done at execution
    time.

    +     - **I/O problem**

    +       - Latch job in memory while it is involved in I/O.

    +       - Do I/O only into OS buffers.'
  merge: -1
  img_proc: true
- pgno: 535
  md: '# 8.4 Paging


    +   - Logical address space of a process can be noncontiguous; process is allocated
    physical memory whenever the latter is available.

    +   - Physical memory is divided into fixed-sized blocks called **frames** (size
    is power of 2, between 512 bytes and 8192 bytes).

    +   - Logical memory is divided into blocks of same size called **pages**.

    +   - Backing store is divided into fixed-sized **blocks** that are of the same
    size as the memory frames.

    +   - When a process is to be executed, its pages are loaded into any available
    memory frames from the backing store.'
  merge: -1
  img_proc: true
- pgno: 536
  md: '# Paging (Cont.)


    +   - Keep track of all free frames.

    +   - To run a program of size *n* pages, need to find *n* free frames and load
    program.

    +   - Operating system maintains a **page table** for each process

    +     - contains the frame location for each page in the process

    +     - page table used to translate logical to physical addresses.

    +   - Internal fragmentation.

    +   - Every address generated by the CPU is divided into:

    +     - *Page number (p)* – used as an index into a *page table* which contains
    base address of each page in physical memory.

    +     - *Page offset (d)* – combined with base address to define the physical
    memory address that is sent to the memory unit.'
