- pgno: 528
  md: '# Memory allocation


    # Fixed Partitioning


    +   - Equal-size partitions

    +     - any process whose size is less than or equal to the partition size can
    be loaded into an available partition

    +     - if all partitions are full, the operating system can swap a process out
    of a partition

    +     - a program may not fit in a partition. The programmer must design the program
    with overlays


    +   - Unequal-size partitions


    +   - Main memory use is inefficient. Any program, no matter how small, occupies
    an entire partition. This results in internal fragmentation.'
