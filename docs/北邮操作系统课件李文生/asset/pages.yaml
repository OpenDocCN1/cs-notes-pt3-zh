- pgno: 521
  md: '# * Dynamic Loading


    +   - Routine is not loaded until it is called.

    +   - Main program is loaded into memory and is executed, all routines are kept
    on disk in a relocatable load format.

    +   - When needed, the relocatable linking loader is called.

    +   - Better memory-space utilization; unused routine is never loaded.

    +   - Useful when large amounts of code are needed to handle infrequently occurring
    cases, such as error routines.

    +   - No special support from the operating system is required, implemented through
    program design.'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# * Dynamic Linking


    +   - Linking postponed until execution time.

    +   - A *stub* is included in the image for each library-routine reference.

    +   - *stub*, Small piece of code, used to locate the appropriate memory-resident
    library routine or how to load the library if the routine is not already present.

    +   - When executed, the *stub* replaces itself with the address of the routine,
    and executes the routine.

    +   - Dynamic linking generally requires help from the operating system (Operating
    system needed to check if routine is in processes’ memory address).

    +   - Dynamic linking is particularly useful for libraries.

    +     - A library may be replaced by a new version, and all programs that reference
    the library will automatically use the new version.

    +   - shared libraries'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# 8.2 Swapping


    +   - A process can be *swapped* temporarily out of memory to a *backing store*,
    and then brought back into memory for continued execution.

    +   - **Backing store** – fast disk large enough to accommodate copies of all
    memory images for all users; must provide direct access to these memory images.

    +   - *Roll out, roll in* – swapping variant used for priority-based scheduling
    algorithms; lower-priority process is swapped out so higher-priority process can
    be loaded and executed.

    +   - *ready queue* — Consists of all processes whose memory images are on the
    backing store or in memory and are ready to run.

    +   - **Dispatcher** is called whenever the CPU scheduler decides to execute a
    process.'
  merge: -1
  img_proc: true
