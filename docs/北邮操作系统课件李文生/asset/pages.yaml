- pgno: 454
  md: '# Supplement: Bakery Algorithm


    # Critical section for n processes


    +   - Before entering its critical section, process receives a number. Holder
    of the smallest number enters the critical section.

    +   - If processes $P_i$ and $P_j$ receive the same number, if $i < j$, then $P_i$
    is served first; else $P_j$ is served first.

    +   - The numbering scheme always generates numbers in increasing order of enumeration;
    i.e., 1,2,3,3,3,3,4,5...'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# Supplement: **Bakery Algorithm (Cont.)**


    +   - **Notation** ⇐ lexicographical order (ticket #, pid #)

    +     - $(a,b) < (c,d)$ if $a < c$ or if $a = c$ and $b < d$

    +     - $\max(a_0,\ldots,a_{n-1})$ is a number, $k$, such that $k \geq a_i$ for
    $i = 0,\ldots,n-1$


    +   - **Shared data**

    +     - `boolean choosing[n];`

    +     - `int number[n];`

    +     - Data structures are initialized to false and 0 respectively'
  merge: -1
