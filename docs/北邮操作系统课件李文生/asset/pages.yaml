- pgno: 323
  md: '# 5.3.1 First-Come First-Served (FCFS) Scheduling


    +   - Each process joins the Ready queue

    +   - When the current process ceases to execute, the oldest process in the Ready
    queue is selected

    +   - the FCFS scheduling algorithm is nonpreemptive.


    | Process | Burst Time |

    |---|---:|

    | P₁ | 24 |

    | P₂ | 3 |

    | P₃ | 3 |


    +   - Suppose that the processes arrive in the order: P₁, P₂, P₃

    +     The Gantt Chart for the schedule is:


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_323_0.png)


    +   - Waiting time for P₁ = 0; P₂ = 24; P₃ = 27

    +   - Average waiting time: (0 + 24 + 27)/3 = 17'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# FCFS Scheduling (Cont.)


    Suppose that the processes arrive in the order

    \[P_2, P_3, P_1.\]


    The Gantt chart for the schedule is:


    | $P_2$ | $P_3$ | $P_1$ |

    |---|---|---|

    | 0 | 3 | 6 | 30 |


    +   - Waiting time for $P_1 = 6; P_2 = 0; P_3 = 3$

    +   - Average waiting time: $(6 + 0 + 3)/3 = 3$

    +   - Much better than previous case.

    +   - A short process may have to wait a very long time before it can execute

    +   - Favors CPU-bound processes

    +     - I/O processes have to wait until CPU-bound process completes

    +   - **Convoy effect:** short process behind long process'
  merge: -1
  img_proc: true
