- pgno: 423
  md: '# # Problems: Deadlock and Starvation


    +   - **Deadlock** – two or more processes are waiting indefinitely for an event
    that can be caused by only one of the waiting processes.


    Let S and Q be two semaphores initialized to 1


    ```

    P₀                 P₁

    wait (S);          wait (Q);

    wait (Q);          wait (S);


    …                  …


    signal (Q);        signal (S);

    signal (S);        signal (Q);

    ```


    ```

    P₀: wait (S);

    P₁: wait (Q);

    P₀: wait (Q);

    P₁: wait (S);

    ```


    +   - **Starvation** – indefinite blocking. A process may never be removed from
    the semaphore queue in which it is suspended. ( a LIFO queue )'
