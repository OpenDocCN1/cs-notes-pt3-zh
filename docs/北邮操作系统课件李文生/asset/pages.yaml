- pgno: 796
  md: '# 1. Overview of Mass Storage Structure


    +   - Magnetic disks provide bulk of secondary storage of modern computers

    +     - Drives rotate at 60 to 200 times per second

    +     - Transfer rate is rate at which data flow between drive and computer

    +     - Positioning time (random-access time) is the time to move disk arm to
    desired cylinder (seek time) and the time for desired sector to rotate under the
    disk head (rotational latency)

    +     - Head crash results from disk head making contact with the disk surface

    +       - That’s bad, cannot be repaired, the entire disk must be replaced

    +   - Disks can be removable

    +   - Drive attached to computer via I/O bus

    +     - Busses vary, including EIDE, ATA, SATA, USB, Fiber Channel, SCSI

    +     - Host controller in computer uses bus to talk to disk controller built
    into drive or storage array'
  merge: -1
  img_proc: true
