- pgno: 517
  md: '# Binding of Instructions and Data to Memory


    Address binding of instructions and data to memory addresses can happen at three
    different stages.


    +   - **Compile time:** If memory location known a priori, absolute code can be
    generated; must recompile code if starting location changes.

    +   - **Load time:** Must generate *relocatable* code if memory location is not
    known at compile time.

    +   - **Execution time:** Binding must be delayed until run time if the process
    can be moved during its execution from one memory segment to another. Need hardware
    support for address maps (e.g., *base and limit registers*).'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# Logical vs. Physical Address Space


    +   - The concept of a *logical-address space* that is bound to a separate *physical-address
    space* is central to proper memory management.

    +     - *Logical address* – generated by the CPU; also referred to as *virtual
    address*.

    +     - *Physical address* – address seen by the memory unit; loaded into the
    memory-address register.

    +     - *Logical address space*: The set of all logocal addresses generated by
    a program

    +       *Physical address space*: the set of all physical addresses corresponding
    to these logical addresses.

    +   - Logical and physical addresses are the same in compile-time and load-time
    address-binding schemes.

    +   - logical (virtual) and physical addresses differ in execution-time address-binding
    scheme.'
  merge: -1
  img_proc: true
- pgno: 519
  md: '# Memory-Management Unit (MMU)


    +   - Hardware device that maps virtual to physical address in run-time.

    +   - In MMU scheme, the value in the **relocation register** is added to every
    address generated by a user process at the time it is sent to memory.

    +   - The user program deals with *logical* addresses; it never sees the *real*
    physical addresses.'
  merge: -1
  img_proc: true
