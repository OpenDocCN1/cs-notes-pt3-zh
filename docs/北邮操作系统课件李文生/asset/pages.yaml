- pgno: 841
  md: '# Direct Memory Access


    +   - Used to avoid programmed I/O for large data movement

    +   - Requires DMA controller, a special-purpose processor

    +   - Bypasses CPU to transfer data directly between I/O device and memory

    +     - Host writes a DMA command block into memory

    +     - CPU writes the address of this command block to the DMA controller

    +     - DMA controller operates the memory bus directly, placing address on the
    bus to perform transfers

    +   - DVMA can perform a transfer between two memory-mapped devices without the
    intervention of the CPU or the use of main memory.'
  merge: -1
  img_proc: true
- pgno: 842
  md: '# Six Step Process to Perform DMA Transfer


    5. DMA controller transfers bytes to buffer X, increasing memory address and decreasing
    C until C=0


    1. device driver is told to transfer disk data to buffer at address X


    2. device driver tells disk controller to transfer C bytes from disk to buffer
    at address X


    6. when C=0, DMA interrupts CPU to signal transfer completion


    3. disk controller initiates DMA transfer


    4. disk controller sends each byte to DMA controller


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_842_0.png)'
  merge: -1
  img_proc: true
- pgno: 843
  md: '# Direct Memory Access (Cont.)


    +   - Takes control of the system from the CPU to transfer data to and from memory
    over the system bus

    +   - Cycle stealing (周期挪用) is used to transfer data on the system bus

    +   - The instruction cycle is suspended so data can be transferred

    +   - The CPU pauses one bus cycle

    +   - No interrupts occur

    +     - Do not save context


