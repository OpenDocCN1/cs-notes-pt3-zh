- pgno: 543
  md: '# Hardware support


    +   - Page table is kept in main memory.

    +   - *Page-table base register* (**PTBR**) points to the page table.

    +   - *Page-table length register* (**PTLR**) indicates size of the page table.

    +   - In this scheme every data/instruction access requires two memory accesses.
    One for the page table entry and one for the data/instruction.

    +   - The two memory access problem can be solved by the use of a special, small,
    fast-lookup hardware cache, called *translation look-aside buffers* (转换后备缓冲区 **TLBs**),
    or *associative memory* (联想存储器).'
  merge: -1
  img_proc: true
- pgno: 544
  md: '# Translation Look-aside Buffer（转换后备缓冲区）


    +   - Contains page table entries that have been most recently used

    +   - Functions same way as a memory cache

    +   - Given a logical address, processor examines the TLB

    +   - If page table entry is found (a **hit**), the frame number is retrieved
    and the physical address is formed

    +   - If page table entry is not found in the TLB (a **miss**), the page number
    is used to index the process page table

    +   - First checks if page is already in main memory

    +     - if not in main memory a page fault is issued

    +   - The TLB is updated to include the new page entry'
  merge: -1
  img_proc: true
- pgno: 545
  md: '# Translation Look-aside Buffer (Cont.)


    +   - The TLB is associative, high-speed memory.

    +   - Associative memory – parallel search


    | Page # | Frame # |

    | --- | --- |

    |  |  |

    |  |  |

    |  |  |

    |  |  |


    +   - Address translation (A′, A″)

    +     - If A′ is in associative register, get frame # out.

    +     - Otherwise get frame # from page table in memory'
  merge: -1
  img_proc: true
