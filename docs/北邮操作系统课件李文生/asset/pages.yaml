- pgno: 592
  md: '# Supplement: **Overlays (Cont.)**


    +   - Needed when process is larger than amount of memory allocated to it.

    +   - Implemented by user, no special support needed from operating system, programming
    design of overlay structure is complex

    +     - This task can be a major undertaking, requiring complete knowledge of
    the structure of the program, its code, and its data structures.

    +   - Currently limited to microcomputer and other systems that have limited amounts
    of physical memory and that lack hardware support for more advanced techniques.'
