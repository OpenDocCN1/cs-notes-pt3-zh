- pgno: 283
  md: '# The fork() and exec() system calls


    +   - If one thread in a program calls **fork**, does the new process duplicate
    all threads or is the new process single-threaded?

    +     - Duplicates all threads

    +     - duplicates only the thread that invoked the fork system call.


    +   - If a thread invokes the **exec** system call, the program specified in the
    parameter to exec will replace the entire process, including all threads and LWPs.


    +   - If **exec** is called immediately after forking, duplicating only the calling
    thread is appropriate.


    +   - If the separate process does not call **exec** after forking, the separate
    process should duplicate all threads.'
  merge: -1
