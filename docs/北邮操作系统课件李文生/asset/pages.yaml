- pgno: 345
  md: '# RR Scheduling(Cont.)


    +   - The RR scheduling algorithm is preemptive.

    +   - If there are *n* processes in the ready queue and the time quantum is *q*,
    then each process gets 1/*n* of the CPU time in chunks of at most *q* time units.
    No process waits more than (*n*-1)*q* time units.

    +   - Performance depends on the size of the time quantum

    +     - *q* very large (infinite) ⇒ FCFS

    +     - *q* very small ⇒ processor sharing, *q* must be large with respect to
    context switch, otherwise overhead is too high.'
  merge: -1
  img_proc: true
