- pgno: 148
  md: '# Benefits of a Microkernel Organization


    +   - **Uniform interface on request made by a process**

    +     - All services are provided by means of message passing

    +   - **Extensibility**

    +     - Allows the addition of new services

    +   - **Flexibility**

    +     - New features added

    +     - Existing features can be subtracted

    +   - **Portability**

    +     - Changes needed to port the system to a new processor is changed in the
    microkernel - not in the other services

    +   - **Reliability**

    +     - Modular design

    +     - Small microkernel can be rigorously tested'
  merge: -1
  img_proc: true
