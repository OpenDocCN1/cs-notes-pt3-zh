- pgno: 429
  md: '# The Readers-Writers Problem


    +   - Readers: only read the content of the shared object.

    +   - Writers: may update the content of the shared object.

    +   - The writers have exclusive access to the shared object.

    +   - the first readers-writers problem: reader first

    +     - no reader will be kept waiting unless a writer has already obtained permission
    to use the shared object.

    +     - Writers may starve.

    +   - the second readers-writers problem: writer first

    +     - once a writer is ready, that writer performs its write as soon as possible.

    +     - Readers may starve.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# The Readers-Writers Problem(Cont.)


    +   - Shared data

    +     semaphore mutex, wrt;


    +   - Initially

    +     mutex = 1

    +     wrt = 1

    +     readcount = 0


    +   - Writer process

    +     wait(wrt);

    +     ...

    +     writing is performed

    +     ...

    +     signal(wrt);


    +   - Reader process

    +     wait(mutex);

    +     readcount++;

    +     if (readcount == 1)

    +       wait(wrt);

    +     signal(mutex);

    +     ...

    +     reading is performed

    +     ...

    +     wait(mutex);

    +     readcount--;

    +     if (readcount == 0)

    +       signal(wrt);

    +     signal(mutex);'
  merge: -1
  img_proc: true
