- pgno: 629
  md: '# Performance of Demand Paging


    +   - Page Fault Rate 0 ≤ p ≤ 1.0

    +     - if p = 0, no page faults

    +     - if p = 1, every reference is a fault


    +   - Effective Access Time (EAT)

    +     EAT = (1−p) × memory access time

    +     + p × page fault service time

    +     page fault service time = page fault overhead

    +     + [ swap page out ]

    +     + swap page in

    +     + restart overhead'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# Demand Paging Example


    +   Memory access time = 200 nanoseconds


    +   average page-fault service time ≈ 8 milliseconds

    +   - servicing the page-fault interrupt and restarting the process may be reduced
    to several hundred instructions, and each may take from 1 to 100 microseconds.

    +   - The page-switch time will probably be close to 8 milliseconds

    +     - Hard disk has an average latency of 3 milliseconds;

    +     - hard disk has a seek of 5 milliseconds;

    +     - transfer time of 0.05 milliseconds.


    # Effective Access Time


    EAT = (1 − p) × 200 + p × (8 000 000)

    = 200 + 7 999 800 × p'
  merge: -1
  img_proc: true
- pgno: 631
  md: '# 9.3 Copy-on-Write—process creation


    +   - Copy-on-Write (COW) allows both parent and child processes to initially
    *share* the same pages in memory


    If either process modifies a shared page, only then is the page copied.


    +   - COW allows more efficient process creation as only modified pages are copied.
    (see P.326 Figure9.7-9.8)


    +   - Free pages are allocated from a *pool* of zeroed-out pages.'
  merge: -1
