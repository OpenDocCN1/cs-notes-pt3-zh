- pgno: 377
  md: '# Queuing models


    +   - The distribution of times when processes arrive in the system, the *arrival-time
    distribution*, must be given.

    +   - Computer system is described as a network of servers.

    +     - Each server has a queue of waiting processes.

    +     - The CPU is a server with its ready queue, as is the I/O system with its
    device queues.

    +   - Knowing arrival rates and service rates, we can compute utilization, average
    queue length, average wait time.

    +   - **Little’s formula**: n=λ×W

    +     - n: average queue length excluding the process being serviced

    +     - W: average waiting time in the queue

    +     - λ: average arrival rate for new processes in the queue'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Simulations


    +   - Simulations involve programming a model of the computer system

    +     - software data structures--the major components of the system

    +     - a variable--clock

