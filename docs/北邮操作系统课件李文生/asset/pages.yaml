- pgno: 246
  md: '# Differences between RPCs and RMI


    +   RPCs support procedural programming whereby only remote procedures or functions
    may be called.

    +   RMI is object-based, it supports invocation of methods on remote objects.


    +   The parameters to remote procedures are ordinary data structures in RPC;

    +   with RMI it is possible to pass objects as parameters to remote methods.


    +   RMI implements the remote object using stubs and skeletons, so remote methods
    are transparent to both the client and the server

    +   - A stub is a proxy for the remote object, resides with the client

    +   - The skeleton is responsible for unmarshalling the parameters and invoking
    the desired method on the server'
  merge: -1
  img_proc: true
