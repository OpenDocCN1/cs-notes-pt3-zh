- pgno: 881
  md: '# Review:


    # 3) Direct Memory Access Structure


    +   - Transfers a block of data directly to or from memory.


    +   - Used for high-speed I/O devices able to transmit information at close to
    memory speeds.


    +   - After setting up buffers, pointers, and counters for the I/O devices , device
    controller transfers blocks of data from buffer storage directly to main memory
    without CPU intervention.


    +   - Only one interrupt is generated per block, rather than the one interrupt
    per byte.


    +   - An interrupt is sent when the task is complete


    +   - The processor is only involved at the beginning and end of the transfer'
  merge: -1
  img_proc: true
