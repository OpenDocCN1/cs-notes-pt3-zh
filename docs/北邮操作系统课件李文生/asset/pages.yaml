- pgno: 722
  md: '# 10.4 File System Mounting


    +   - A file system must be **mounted** before it can be accessed.

    +   - **The mount procedure**

    +     - The operating system is given the _name of the device_, and the _location_
    within the file structure at which to attach the file system.

    +     - The operating system _verifies_ that the device contains a valid file
    system by asking the _device driver_ to read the device directory and verifying
    that the directory has the expected format.

    +     - The operating system _notes_ in its directory structure that a file system
    is mounted at the specified **mount point**.'
  merge: -1
  img_proc: true
