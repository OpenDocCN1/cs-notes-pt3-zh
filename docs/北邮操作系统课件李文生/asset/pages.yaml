- pgno: 754
  md: '# Partitions and Mounting


    +   - A disk can be sliced into multiple partitions, or a partition can span multiple
    disks.

    +   - Each partition can either be

    +     - “raw”: containing no file system

    +     - “cooked”: containing a file system.

    +   - Boot information can be stored in a separate partition.

    +     - Boot information is loaded into memory as an image

    +   - A boot loader understands multiple file systems and multiple operating systems
    can occupy the boot space.

    +   - The root partition, which contains the operating-system kernel and potentially
    other system files, is mounted at boot time.

    +   - Mount table – containing information about file systems that has been mounted.'
