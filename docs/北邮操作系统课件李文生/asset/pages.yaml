- pgno: 357
  md: '# Supplemrnt: 高响应比优先(HRRN)算法

    Highest Response-Ratio Next Scheduling


    +   - **Non-preemptive scheduling algorithm.**

    +   - **Response-Ratio :  R=(W+T)/T=1+W/T**

    +     - W: waiting time in ready queue

    +     - T: CPU burst time

    +   - The process with the highest response-ratio will be scheduled next.

    +   - HRRN considers the waiting time and CPU-burst time simultaneously.

    +   - Time consuming, system overhead to calculate the response-ration for each
    processes.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 5.4 Multiple-Processor Scheduling


    +   - CPU scheduling more complex when multiple CPUs are available.

    +   - **Classifications of Multipprocessor Systems**

    +     - Loosely coupled multiprocessor

    +       - Each processor has its own memory and I/O channels

    +     - Tightly coupled multiprocessing

    +       - Processors share main memory

    +       - Controlled by operating system

    +     - Functionally specialized processors

    +       - Such as I/O processor

    +       - Controlled by a master processor

    +   - *Homogeneous processors:* within a multiprocessor, any available processor
    can be used to run any processes in the queue.

    +   - *Heterogeneous system:* only programs compiled for a given processor’s instruction
    set could be run on that processor.'
  merge: -1
