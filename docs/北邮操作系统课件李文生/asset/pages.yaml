- pgno: 23
  md: '# 1.2.2 Storage Structure


    +   - Main memory – only large storage area that the processor can access directly.

    +   - Secondary storage – extension of main memory that provides large nonvolatile
    storage capacity.

    +   - Magnetic disks – rigid metal or glass platters covered with magnetic recording
    material

    +     - Disk surface is logically divided into *tracks*, which are subdivided
    into *sectors*.

    +     - The *disk controller* determines the logical interaction between the device
    and the computer.

    +   - Magnetic tapes - used for backup, for storage of infrequently used information'
  merge: -1
  img_proc: true
