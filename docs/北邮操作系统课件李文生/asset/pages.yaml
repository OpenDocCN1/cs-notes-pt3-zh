- pgno: 697
  md: '# File Attributes


    +   - **Name** – only information kept in human-readable form.

    +   - **Identifier** – non-human-readable name for the file, a unique number that
    identifies the file within the system.

    +   - **Type** – needed for systems that support different types.

    +   - **Location** – a pointer to the location of the file on device.

    +   - **Size** – current size of the file.

    +   - **Protection** – access-control information, controls who can do reading,
    writing, executing.

    +   - **Time, date, and user identification** – data for protection, security,
    and usage monitoring.

    +   - Information about files are kept in the directory structure, which is maintained
    on the disk.'
