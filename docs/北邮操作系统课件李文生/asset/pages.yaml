- pgno: 822
  md: '# Swap-space Use


    +   - Depending on the memory-management algorithms in use.

    +     - Use swap space to hold an entire process image

    +     - Store pages that have been pushed out of memory


    +   - The amount of swap space needed depends on

    +     - the amount of physical memory

    +     - the amount of virtual memory it is backing

    +     - the way in which the virtual memory is used'
  merge: -1
  img_proc: true
- pgno: 823
  md: '# Swap-space Location


    +   - A swap space can reside in one of two places:

    +     - Carved out of the normal file system, a large file

    +     - In a separate disk partition, raw partition


    +   - A large file

    +     - Normal file-system routines can be used to create it, name it, and allocate
    its space.

    +     - Inefficient


    +   - Raw partition

    +     - Swap-space storage manager, allocate and deallocate

    +     - A fixed amount of swap space is created during disk partitioning, adding
    more swap space requires repartitioning the disk.'
  merge: -1
  img_proc: true
- pgno: 824
  md: '# Swap-space management


    +   - 4.3BSD allocates swap space when process starts; holds *text segment* (the
    program) and *data segment*.

    +   - Kernel uses *swap maps* to track swap-space use.

    +   - Solaris 2 allocates swap space only when a page is forced out of physical
    memory, not when the virtual memory page is first created.'
  merge: -1
  img_proc: true
