- pgno: 636
  md: '# # Page Replacement Algorithms


    +   - **Placement Policy**

    +     - Which page is replaced?

    +     - Page removed should be the page least likely to be referenced in the near
    future

    +     - Most policies predict the future behavior on the basis of past behavior


    +   - **Want lowest page-fault rate**


    +   - Evaluate algorithm by running it on a particular string of memory references
    (*reference string*) and computing the number of page faults on that string.


    +   - We can generate reference strings artificially (by a random-number generator)
    or we can trace a given system and record the address of each memory reference.


    +   - In all our examples, the reference strings are

    +     - 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1

    +     - 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5'
  merge: -1
  img_proc: true
