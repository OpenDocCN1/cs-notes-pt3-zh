  md: '# Least Recently Used (LRU) Algorithm


    +   - replaces the page that has not been used for the longest period of time.

    +   - By the principle of locality, this should be the page least likely to be
    referenced in the near future

    +   - Associates with each page the time of that page’s last use. This would require
    a great deal of overhead.

