- pgno: 19
  md: '# Computer Startup


    +   - **bootstrap program** is loaded at power-up or reboot

    +     - Typically stored in ROM or EEPROM, generally known as **firmware**

    +     - Initializes all aspects of system

    +       - From CPU registers to device controllers to memory contents

    +     - Loads operating system kernel and starts execution


    +   - OS starts executing the first process, such as “init” and waits for some
    events to occur

    +     - An interrupt from the hardware

    +       - Sending a signal to CPU by way of the system bus

    +     - An interrupt from the software

    +       - Executing a system call'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.2.1 Computer-System Operation


    +   - I/O devices and the CPU can execute concurrently.

    +   - Each device controller is in charge of a particular device type.

    +   - Each device controller has a local buffer.

    +   - CPU moves data from/to main memory to/from local buffers

    +   - I/O is from the device to local buffer of controller.

    +   - Device controller informs CPU that it has finished its operation by causing
    an *interrupt*.


