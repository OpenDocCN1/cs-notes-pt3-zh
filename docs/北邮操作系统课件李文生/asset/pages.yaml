- pgno: 153
  md: '# 2.8 Virtual Machines (VM)


    +   - A *virtual machine* takes the layered approach to its logical conclusion.
    It treats hardware and the operating system kernel as though they were all hardware.

    +   - A virtual machine provides an interface *identical* to the underlying bare
    hardware.

    +   - The operating system creates the illusion of multiple processes, each executing
    on its own processor with its own (virtual) memory.

    +     - By CPU scheduling

    +     - By virtual memory'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Virtual Machines (Cont.)


    +   - The resources of the physical computer are shared to create the virtual
    machines.

    +     - CPU scheduling can share out the CPU to create the appearance that users
    have their own processors.

    +     - Spooling and a file system can provide virtual card readers and virtual
    line printers.

    +     - A normal user time-sharing terminal serves as the virtual machine operator’s
    console.'
  merge: -1
  img_proc: true
