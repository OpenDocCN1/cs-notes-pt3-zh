- pgno: 478
  md: '# Banker’s Algorithm


    +   - Applicable to a resource-allocation system with multiple instances of each
    resource type.

    +   - Each process must a priori claim maximum use of instances of each resource
    type.

    +   - When a process requests a resource it may have to wait.

    +   - When a process gets all its resources it must return them in a finite amount
    of time.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# Data Structures for the Banker’s Algorithm


    *n* = number of processes

    *m* = number of resources types


    +   - **Available:** Vector of length *m*. If available [*j*] = *k*, there are
    *k* instances of resource type *R_j* available.


    +   - **Max:** *n* × *m* matrix. If *Max* [*i,j*] = *k*, then process *P_i* may
    request at most *k* instances of resource type *R_j*.


    +   - **Allocation:** *n* × *m* matrix. If Allocation[*i,j*] = *k* then *P_i*
    is currently allocated *k* instances of *R_j*.


    +   - **Need:** *n* × *m* matrix. If *Need*[*i,j*] = *k*, then *P_i* may need
    *k* more instances of *R_j* to complete its task.


    *Need* [*i,j*] = *Max*[*i,j*] − *Allocation* [*i,j*]'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# notation


    +   Let X and Y be vectors of length n

    +   X ≤ Y ⟺ X[i] ≤ Y[i] for all i=1,2,...,n


    +   Each row in the matrices *allocation* and *need* can be treated as vectors
    and referred to as *allocation*ᵢ and *need*ᵢ


    +   *Allocation*ᵢ specifies the resources currently allocated to process Pᵢ


    +   *Need*ᵢ specifies the additional resources that process Pᵢ may still reaquest
    to complete its task.'
  merge: -1
  img_proc: true
