- pgno: 435
  md: "# 6.7 Monitors\n\n+   - High-level synchronization construct that allows the\
    \ safe sharing of an abstract data type among concurrent processes.\n+   - Monitor\
    \ is a software module\n+   - Chief characteristics\n+     - Local data variables\
    \ are accessible only by the monitor\n+     - Process enters monitor by invoking\
    \ one of its procedures\n+     - Only one process may be executing in the monitor\
    \ at a time\n\n```\nmonitor monitor-name\n{\n    shared variable declarations\n\
