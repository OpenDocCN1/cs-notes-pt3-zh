- pgno: 9
  md: '# 1.1 What Operating Systems do?


    +   - **OS is a system program that acts as an intermediary between a user of
    a computer and the computer hardware**

    +     - A program that controls the execution of application programs

    +     - An interface between applications/users and hardware


    +   - **Operating system’s objectives:**

    +     - **Convenience**

    +       - Execute user programs and make solving user problems easier.

    +       - Makes the computer system more convenient to use

    +     - **Efficiency**

    +       - use the computer hardware in an efficient manner

    +     - **Ability to evolve**

    +       - Permit effective development, testing, and introduction of new system
    functions without interfering with service'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Computer System Components


    +   1. Hardware

    +   provides basic computing resources, such as CPU, memory, I/O devices.

    +   2. Operating system

    +   controls and coordinates the use of the hardware among the various application
    programs for the various users.

    +   3. Applications programs

    +   define the ways in which the system resources are used to solve user’s computing
    problems (compilers, DBMS, database systems, word processors, video games, business
    programs).

    +   4. Users

    +   people, machines, other computers'
  merge: -1
  img_proc: true
