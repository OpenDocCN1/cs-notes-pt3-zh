- pgno: 240
  md: '# RPCs -- Remote Procedure Calls


    +   - Remote procedure call (RPC) abstracts procedure calls between processes
    on networked systems.

    +   - The semantics of RPCs allow a client to invoke a procedure on a remote host
    as it would invoke a procedure locally.


    By providing a stub on the client side


    +   - **Stubs** – client-side proxy for the actual procedure on the server.

    +   - **The client-side stub** locates port on the server and *marshals* the parameters.

    +   - **The server-side stub** receives this message, unpacks the marshaled parameters,
    and performs the procedure on the server. Return values are passed back to the
    client using the same technique.'
  merge: -1
  img_proc: true
