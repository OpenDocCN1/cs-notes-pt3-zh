- pgno: 683
  md: '# Other Issues -- TLB Reach


    +   - The amount of memory accessible from the TLB.


    +   - **TLB Reach = (TLB Size) × (Page Size)**


    +   - Ideally, the working set of each process is stored in the TLB. Otherwise
    the process will spend a considerable amount of time resolving memory references
    in the page table rather than TLB.


    +   - **Increasing the Size of the TLB reach by**

    +     - **Increase the Page Size.** This may lead to an increase in fragmentation,
    as not all applications require a large page size.

    +     - **Provide Multiple Page Sizes.** This allows applications that require
    larger page sizes to have the opportunity to use them without an increase in fragmentation.'
  merge: -1
  img_proc: true
- pgno: 684
  md: '# Other Issues --Program structure


    +   - Page size = 1024 words

    +   - int A[][] = new int[1024][1024];

    +   - Each row is stored in one page

    +   - The OS allocates fewer than 1024 frames to the entire program

    +   - Program 1:

    +     ```

    +     for (j = 0; j < 1024; j++)

    +       for (i = 0; i < 1024; i++)

    +         A[i,j] = 0;

    +     ```

    +     1024 × 1024 page faults

    +   - Program 2:

    +     ```

    +     for (i = 0; i < 1024; i++)

    +       for (j = 0; j < 1024; j++)

    +         A[i,j] = 0;

    +     ```

    +     1024 page faults'
  merge: -1
  img_proc: true
- pgno: 685
  md: '# Other Issues --I/O Interlock


    +   - Pages must sometimes be locked into memory.

    +   - Consider I/O.

    +   - Never to execute I/O to user memory.

    +     - I/O takes place only between system memory and I/O device.

    +     - Data are copied between system memory and user memory.

    +   - Allow pages to be locked into memory.

    +     - A lock bit is associated with every frames.

    +     - Locked page cannot be replaced, when I/O complete, unlocked.

    +   - Pages that are used for copying a file from a device must be locked from
    being selected for eviction by a page replacement algorithm.'
  merge: -1
  img_proc: true
