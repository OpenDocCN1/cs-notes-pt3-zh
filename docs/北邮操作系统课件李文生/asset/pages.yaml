- pgno: 739
  md: '# Access Rights (1/2)


    +   - **None**

    +     - User may not know of the existence of the file

    +     - User is not allowed to read the user directory that includes the file

    +   - **Knowledge**

    +     - User can only determine that the file exists and who its owner is

    +   - **Execution**

    +     - The user can load and execute a program but cannot copy it

    +   - **Reading**

    +     - The user can read the file for any purpose, including copying and execution

    +   - **Appending**

    +     - The user can add data to the file but cannot modify or delete any of the
    file’s contents'
  merge: -1
  img_proc: true
- pgno: 740
  md: '# Access Rights (2/2)


    +   - Updating

    +     - The user can modify, deleted, and add to the file’s data. This includes
    creating the file, rewriting it, and removing all or part of the data


    +   - Changing protection

    +     - User can change access rights granted to other users


    +   - Deletion

    +     - User can delete the file


    +   - Owners

    +     - Has all rights previously listed

    +     - May grant rights to others using the following classes of users

    +       - Specific user

    +       - User groups

    +       - All for public files'
  merge: -1
