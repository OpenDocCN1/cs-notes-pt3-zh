- pgno: 43
  md: '# Supplement: Timesharing systems


    +   - **Timesharing (multitasking)** is logical extension in which CPU switches
    jobs so frequently that users can interact with each job while it is running,
    creating **interactive** computing

    +     - **Response time** should be < 1 second

    +     - Each user has at least one program executing in memory ⇒ process

    +     - If several jobs ready to run at the same time ⇒ **CPU scheduling**

    +     - If processes don’t fit in memory, **swapping** moves them in and out to
    run

    +     - **Virtual memory** allows execution of processes not completely in memory'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Supplement:

    Timesharing systems (Cont.)


    +   - Using multiprogramming to handle multiple interactive jobs

    +   - The CPU is multiplexed (复用) among several jobs that are kept in memory and
    on disk

    +     - Processor’s time is shared among multiple users

    +     - the CPU is allocated to a job only if the job is in memory.

    +   - A job swapped in and out of memory to the disk.

    +   - Many users share the computer simultaneously.

    +     - On-line communication between the user and the system is provided;

    +     - Multiple users simultaneously access the system through terminals;

    +     - when the operating system finishes the execution of one command, it seeks
    the next “control statement” not from a card reader, but rather from the user’s
    keyboard.

    +   - On-line system must be available for users to access data and code.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# OS Features

    Needed for time-sharing system


    +   - I/O routines supplied by the system.

    +   - Memory management – the system must allocate the memory to several jobs.

    +   - Virtual memory – allows the execution of job not be completely in memory.

    +   - Disk management – file system must be provided, which resides on a collection
    of disks.

    +   - CPU scheduling – mechanisms for concurrent execution, job synchronization
    and communication, avoiding deadlock.

    +   - Allocation of resources.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Supplement:

    Batch Multiprogramming versus Time Sharing


    | | Batch Multiprogramming | Time Sharing |

