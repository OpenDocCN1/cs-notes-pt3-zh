- pgno: 547
  md: "# Effective Access Time\n\n+   - Associative Lookup = ε microsecond\n+   -\
    \ Assume memory cycle time is τ microsecond\n+   - **Hit ratio** – percentage\
    \ of times that a page number is found in the associative registers; ration related\
    \ to number of associative registers.\n+   - Hit ratio = α\n+   - **Effective\
    \ Access Time (EAT)**\n+   \n+     EAT = (ε + τ) α + (ε + 2τ)(1 − α)\n+   \n+\
    \     = 2τ + ε − τα\n+   - ε=20ns, α=0.8, τ=100ns  EAT=140ns\n+   - ε=20ns, α=0.98,\
    \ τ=100ns  EAT=122ns"
  merge: -1
