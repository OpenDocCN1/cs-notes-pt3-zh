    Main Memory


    Main memory consists of a number of fixed-length frames, equals to the size of
    a page. For a program to execute, some or all of its pages must be in main memory.


    Secondary storage (disk) can hold many fixed-length pages. A user program consists
    of some number of pages. Pages for all programs plus the Operating System are
    on disk, as are files.'
