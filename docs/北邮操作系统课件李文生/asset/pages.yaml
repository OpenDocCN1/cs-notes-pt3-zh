  md: "# Fixed Allocation\n\n+   - **Equal allocation** – e.g., if 100 frames and\
    \ 5 processes, give each 20 pages.\n+   - **Proportional allocation** – Allocate\
    \ according to the size of process.\n+     - `s_i` size of virtual memory for\
    \ process `p_i`\n+     - `S = ∑s_i`\n+     - `m` total number of frames\n+   \
    \  - `a_i` allocation for process `p_i`\n+   \n+     `a_i = s_i/S × m`\n+   -\
    \ when a page fault occurs, one of the pages of that process must be replaced.\n\
    +   - **Local replacement**\n\n![](img/9321d6c42b8369e67ceb1f1d7e27b09c_656_0.png)"
  merge: -1
