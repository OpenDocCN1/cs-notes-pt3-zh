  md: '# File Operations (1/2)


    File is an abstract data type


    +   - **Create** – find space, make entry in directory for the file.

    +   - **Write** – file name, information to be written. *write* ptr.

    +   - **Read** – file name, position in memory. *read* pointer.

    +   - **Reposition** within file – file seek, not need I/O.

    +   - **Delete** – name, release file space, erase directory entry.

    +   - **Truncate** – reset length to 0, release file space.

    +   - These primitive operations may be combined to perform other file operations.'
  merge: -1
  img_proc: true
- pgno: 699
  md: '# File Operations (2/2)


    +   - Open-file table

    +   - Open(*Fᵢ*) – search the directory structure on disk for entry *Fᵢ*, and
    move the content of entry to open-file table. Return a pointer to the entry in
    the open-file table

    +   - Close (*Fᵢ*) – move the content of entry *Fᵢ* in open-file table to directory
    structure on disk.

    +   - Several users may open the file at the same time. Two levels of internal
    tables:

    +     - Process open-file table, a per-process table, tracks all files a process
    has open.

    +     - System open-file table, a system-wide table, contains process-independent
    information, such as file location on disk, access dates, file size.

    +   - information associated with an open file: file pointer, file open count,
    disk location of the file, access rights.'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# Information associated with an Open File


    Several pieces of data are needed to manage open files:


    +   - **File pointer**: pointer to last read/write location, per process that
    has the file open

    +   - **File-open count**: counter of number of times a file is open – to allow
    removal of data from open-file table when last processes closes it

    +   - **Disk location of the file**: cache of data access information

    +   - **Access rights**: per-process access mode information'
  merge: -1
  img_proc: true
- pgno: 701
  md: '# Open File Locking


    +   - Provided by some operating systems and file systems

    +   - Mediates(调停) access to a file

    +   - Shared lock and exclusive lock (similar to reader lock, writer lock)

    +   - Mandatory(强制的) or advisory(劝告的):

    +     - Mandatory – access is denied depending on locks held and requested

    +     - Advisory – processes can find status of locks and decide what to do'
