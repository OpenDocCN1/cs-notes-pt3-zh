- pgno: 878
  md: '# Review: Interrupt-Driven I/O (Cont.)


    +   - **Synchronous I/O**----After I/O starts, control returns to user program
    only upon I/O completion.

    +   - **Asynchronous I/O**---- After I/O starts, control returns to user program
    without waiting for I/O completion.

    +   - **For synchronous I/O**, two methods can be used for CPU to wait for I/O
    completion:

    +     - Wait instruction idles the CPU until the next interrupt

    +     - Wait loop (contention (竞争) for memory access).

    +     At most one I/O request is outstanding at a time, no simultaneous I/O processing.

    +   - In order to increase the utilization of CPU and I/O device, We need:

    +     - *System call* – request to the operating system to allow user to wait
    for I/O completion.

    +     - *Device-status table* contains entry for each I/O device indicating its
    type, address, and state.

    +     - Operating system indexes into I/O device table to determine device status
    and to modify table entry to include interrupt.'
  merge: -1
  img_proc: true
