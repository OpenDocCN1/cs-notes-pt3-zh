- pgno: 761
  md: '# Extent-Based Systems


    +   - Many newer file systems (i.e. Veritas File System) use a modified contiguous
    allocation scheme.


    +   - A contiguous chunk of space is allocated initially, and then, when that
    amount is not large enough, another chunk of contiguous space, an extent, is added
    to the initial allocation.


    +   - Extent-based file systems allocate disk blocks in extents.


    +   - An extent is a contiguous block of disks. Extents are allocated for file
    allocation. A file consists of one or more extents.'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# Linked Allocation


    +   - Allocation on basis of individual block

    +   - Each file is a linked list of disk blocks: blocks may be scattered anywhere
    on the disk.

    +   - The directory contains a pointer to the first and last blocks of the file.

    +   - Each block contains a pointer to the next block in the chain

    +   - There is no external fragmentation.

    +   - Any free block on the free-space list can be used to satisfy a request.


    ![](img/9321d6c42b8369e67ceb1f1d7e27b09c_762_0.png)'
