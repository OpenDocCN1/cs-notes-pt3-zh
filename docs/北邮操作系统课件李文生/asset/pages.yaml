- pgno: 557
  md: '# Hashed Page Tables


    +   - Common in address spaces > 32 bits.

    +   - Each entry in the hash table contains a linked list of elements that hashed
    to the same location.

    +   - Each element consists of three fields:

    +     (a) The virtual page number

    +     (b) The value of the mapped page frame (frame number)

    +     (c) A pointer to the next element in the linked list

    +   - The virtual page number is hashed into the hash table.

    +   - The virtual page number is compared to field (a) in this chain searching
    for a match. If a match is found, the corresponding physical frame is extracted.'
  merge: -1
  img_proc: true
