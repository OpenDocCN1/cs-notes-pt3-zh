- pgno: 460
  md: '# # 7.1 System Model


    +   - **Resource types** $R_1, R_2, \ldots, R_m$

    +     - *CPUs, CPU cycles, memory space, files, I/O devices (printers)*

    +   - The resources may be either physical resources or logical resources.

    +   - Each resource type $R_i$ has $W_i$ instances.

    +   - Each process utilizes a resource as follows:

    +     - request

    +     - use

    +     - Release

    +   - A system table records whether each resource is free or allocated, and if
    a resource is allocated, to which process.'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# 7.2 Deadlock Characterization


    +   - **Mutual exclusion:** only one process at a time can use a resource.

    +   - **Hold and wait:** a process holding at least one resource is waiting to
    acquire additional resources held by other processes.

    +   - **No preemption:** a resource can be released only voluntarily by the process
    holding it, after that process has completed its task.

    +   - **Circular wait:** there exists a set {P₀, P₁, …, Pₙ} of waiting processes
    such that P₀ is waiting for a resource that is held by P₁, P₁ is waiting for a
    resource that is held by P₂, …, Pₙ₋₁ is waiting for a resource that is held by
    Pₙ, and Pₙ is waiting for a resource that is held by P₀.


    A deadlock situation can arise if the above four conditions hold simultaneously.'
  merge: -1
  img_proc: true
- pgno: 462
  md: '# Resource-Allocation Graph


    +   - Deadlock can be described in terms of a System resource-allocation graph

    +     - Directed graph

    +     - A set of vertices *V* and a set of edges *E*.


    +   - *V* is partitioned into two different types:

    +     - *P* = {P₁, P₂, …, Pₙ}, the set consisting of all the processes in the
    system.

    +     - *R* = {R₁, R₂, …, Rₘ}, the set consisting of all resource types in the
    system.


    +   - *E* is classed into two different types:

    +     - request edge – directed edge Pᵢ → Rⱼ. Process Pᵢ requested an instance
    of resource type Rⱼ, and is currently waiting for that resource.

    +     - assignment edge – directed edge Rⱼ → Pᵢ. An instance of resource type
    Rⱼ has been allocated to process Pᵢ.'
  merge: -1
  img_proc: true
- pgno: 463
