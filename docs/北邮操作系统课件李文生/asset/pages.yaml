- pgno: 156
  md: '# Advantages/Disadvantages of VM (1/2)


    +   - The virtual-machine concept provides complete **protection of system resources**
    since each virtual machine is isolated from all other virtual machines. This isolation,
    however, permits no direct sharing of resources.

    +   - A virtual-machine system is a perfect **vehicle for operating-systems research
    and development**. System development is done on the virtual machine, instead
    of on a physical machine and so does not disrupt normal system operation.

    +   - VMs are increasing in popularity as a means of **solving system compatibility
    problem**.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Advantages/Disadvantages of VM (2/2)


    +   - The virtual machine concept is **difficult to implement** due to the effort
    required to provide an *exact* duplicate to the underlying machine.

    +     - **Virtual user mode** and **virtual monitor mode**, run in a physical
    user mode.

    +     - Actions that cause a transfer from user mode to monitor mode on a real
    machine must also cause a transfer from virtual user mode to virtual monitor mode
    on a virtual machine.'
  merge: -1
  img_proc: true
