  - 5. 考虑一个实时系统，其中有 4 个实时进程 P1、P2、P3 和 P4，分别旨在及时响应 4 个关键环境事件 e1、e2、e3 和 e4。
- - '####'
  - （1）假设采用基于优先级的抢占式调度
- - '####'
  - （2）假设采用 FCFS 调度
- - '###'
  - 6. 考虑以下进程集合 P1、P2、P3 和 P4。对于 1≤ i ≤4，每个 Pi 的到达时间、每个进程 Pi 的 CPU 爆发时间长度以及每个 Pi 的优先级数字如下所示，优先级数字越小表示优先级越高。
