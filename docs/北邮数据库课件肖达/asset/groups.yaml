    # 模式与表（续）


    +   - 创建基本表（其他数据库对象也一样）时，若没有指定模式，系统根据搜索路径来确定该对象所属的模式


    +   - RDBMS会使用模式列表中第一个存在的模式作为数据库对象的模式名


    +   - 若搜索路径中的模式名都不存在，系统将给出错误


