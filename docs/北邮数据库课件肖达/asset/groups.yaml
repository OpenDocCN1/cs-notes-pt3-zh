  - '[PAGE 216]


    # 2. 笛卡尔积（Cartesian Product）


    +   - 笛卡尔积


    给定一组域 D₁，D₂，…，Dₙ，这些域中可以有相同的。


    D₁，D₂，…，Dₙ 的笛卡尔积为：


    D₁ × D₂ × … × Dₙ =


    { (d₁, d₂, …, dₙ) | dᵢ ∈ Dᵢ, i = 1, 2, …, n }


    +   - 所有域的所有取值的一个组合


    +   - 不能重复'
  - "[PAGE 217]\n\n# 笛卡尔积（续）\n\n+   - **元组（Tuple）**\n+     - 笛卡尔积中每一个元素 `(d₁, d₂,\
    \ ⋯, dₙ)` 叫作一个 n 元组（n-tuple）或简称元组（Tuple）\n+     - （张清玫，计算机专业，李勇）、（张清玫，计算机专业，刘晨）等都是元组\n\
    \n+   - **分量（Component）**\n+     - 笛卡尔积元素 `(d₁, d₂, ⋯, dₙ)` 中的每一个值 `dᵢ` 叫作一个分量\n\
    +     - 张清玫、计算机专业、李勇、刘晨等都是分量\n\n+   - **基数（Cardinal number）**\n+     - 若 `Dᵢ (i=1,\
    \ 2, ⋯, n)` 为有限集，其基数为 `mᵢ (i=1, 2, ⋯, n)`，则 `D₁×D₂×⋯×Dₙ` 的基数 `M` 为：\n+       \n\
    +       `M = ∏ⁿᵢ₌₁ mᵢ`\n\n+   - **笛卡尔积的表示方法**\n+     - 笛卡尔积可表示为一个二维表\n+     -\
    \ 表中的每行对应一个元组，表中的每列对应一个域"
