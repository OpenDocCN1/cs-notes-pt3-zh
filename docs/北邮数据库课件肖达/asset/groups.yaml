    Sdept CHAR(20)\n);\n```\n\n### 属性上的约束条件检查和违约处理\n\n- ◆ 插入元组或修改属性的值时，RDBMS检查属性上的约束条件是否被满足\n\
    - ◆ 如果不满足则操作被拒绝执行\n\n## 用户定义的完整性\n\n- 属性上的约束条件的定义\n- 属性上的约束条件检查和违约处理\n- 元组上的约束条件的定义\n\
    - 元组上的约束条件检查和违约处理\n\n### 元组上的约束条件的定义\n\n- 在 CREATE TABLE 时可以用 CHECK 短语定义元组上的约束条件，即元组级的限制\n\
    - 同属性值限制相比，元组级的限制可以设置不同属性之间的取值的相互约束条件\n\n### 元组上的约束条件的定义(续)\n\n[例9] 当学生的性别是男时，其名字不能以Ms.打头。\n\
