    \ Cartesian Product）\n- R: $n$目关系，$k_1$个元组\n- S: $m$目关系，$k_2$个元组\n- $R \\times\
    \ S$\n  - 列：（$n+m$）列元组的集合\n    - 元组的前$n$列是关系$R$的一个元组\n    - 后$m$列是关系$S$的一个元组\n\
