    # 数据库的类别


    # (1) 物理数据库和逻辑数据库


    物理数据库由构成数据库的物理文件构成。SQL Server 2005的一个物理数据库中至少有一个数据库信息文件和一个数据库事务日志文件。物理数据库由DBA（数据库管理员）负责创建和管理。


    逻辑数据库是数据库中用户可见的表或视图，用户利用逻辑数据库的数据库对象，存储或读取数据库中的数据。


    # (2) 系统数据库和用户数据库


    系统数据库是由系统创建和维护的数据库。系统数据库中记录着SQL Server 2005的配置情况、任务情况和用户数据库的情况等系统管理的信息，它实际上就是我们常说的数据字典。


    用户数据库是根据管理对象要求创建的数据库，用户数据库中保存着用户直接需要的数据信息。'
  - '[PAGE 317]


    # SQL Server 2005的系统数据库


    # 1. Master数据库


    主文件名为Master.mdf，日志文件为Masterlog.ldf。Master中内含许多系统表，用来跟踪和记录SQL Server相关信息。

    如：所有的登录名或用户ID所属的角色、所有的系统配置设置、服务器中的数据库的名称及相关信息、数据库的位置。


    # 2. Msdb数据库


    主文件名为Msdb.mdf，日志文件名为Msdb.ldf。Msdb由SQL Server代理服务器使用。Msdb中记录着任务计划信息、事件处理信息、数据备份及恢复信息和警告及异常信息。


    # 3. Model数据库


    主文件是model.mdf，日志文件为model.ldf。Model数据库是SQL Server 2005为用户数据库提供的样板，新的用户数据库都以model数据库为基础。


    # 4. tempdb数据库


    主文件名和日志文件名分别为tempdb.db f和tempdb.ldf。tempdb是一个共享的工作空间，SQL Server 2005中的所有数据库都可以使用它，它为临时表和其他临时工作提供了一个存储区。'
  - '[PAGE 318]


    # SQL Server 2005的数据库对象


    +   (1) 表和视图：表是在数据库中存放的实际关系。视图是为了用户查询方便或根据数据安全的需求而建立的虚表。

    +   (2) 角色：由一个或多个用户组成的单元，也称职能组。一个用户可以成为多个角色中的成员。

    +   (3) 索引：来加速数据访问和保证表的实体完整性的数据库对象。

    +   (4) 存储过程：通过Transact-SQL编写的程序。包括系统存储过程和用户存储过程：系统存储过程是由SQL Server 2005提供的，用户过程是由用户编写的，它可以自动执行过程中安排的任务。

    +   (5) 触发器：一种特殊类型的存储过程，当表中发生特殊事件时执行。触发器主要用于保证数据的完整性。

    +   (6) 约束：约束规则用于加强数据完整性。'
  - '[PAGE 319]


