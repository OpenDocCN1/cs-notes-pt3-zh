  - '[PAGE 48]


    # 数据结构化


    +   整体数据的结构化是数据库的主要特征之一。


    +   文件系统

    +   > 每个文件内部是有结构的（记录），但记录之间没有联系。


    +   关系数据库

    +   > 不仅数据内部结构化，整体也是结构化的，数据之间具有联系。


    学生文件的记录结构


    | 学号 | 姓名 | 性别 | 年龄 | 院系 | 联系电话 |


    课程文件的记录结构


    | 课程号 | 课程名 | 学时数 | 教材名 |


    选课文件的记录结构


    | 学号 | 课程号 | 成绩 |


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_48_0.png)'
  - '[PAGE 49]


    # 数据的共享性高，冗余度低，易扩展


    +   - 数据库系统从整体角度看待和描述数据，数据面向整个系统，可以被多个用户、多个应用共享使用。

    +   - 数据共享的好处

    +     - 减少数据冗余，节约存储空间

    +     - 避免数据之间的不相容性与不一致性

    +     - 使系统易于扩充


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_49_0.png)'
  - '[PAGE 50]


    # 数据独立性高


    +   - 物理独立性

    +     - 指用户的应用程序与存储在磁盘上的数据库中数据是相互独立的。当数据的物理存储改变了，应用程序不用改变。


    +   - 逻辑独立性

    +     - 指用户的应用程序与数据库的逻辑结构是相互独立的。数据的逻辑结构改变了，用户程序也可以不变。


    +   - 数据独立性是由DBMS的二级映像功能来保证的'
  - '[PAGE 51]


    # 数据由DBMS统一管理和控制


    +   - DBMS提供的数据控制功能


    +   - (1)数据的安全性（Security）保护

    +     保护数据，以防止不合法的使用造成的数据的泄密和破坏。


    +   - (2)数据的完整性（Integrity）检查

    +     将数据控制在有效的范围内，或保证数据之间满足一定的关系。


    +   - (3)并发（Concurrency）控制

    +     对多用户的并发操作加以控制和协调，防止相互干扰而得到错误的结果。


    +   - (4)数据库恢复（Recovery）

    +     将数据库从错误状态恢复到某一已知的正确状态。'
