    \ branch-name, balance)\n- *loan* (_loan-number_, branch-name, amount)\n- *depositor*\
    \ (customer-name, _account-number_)\n- *borrower* (customer-name, _loan-number_)\n\
    \n- 求资产超过2100000的分行个数。\n\n  ```sql\n  select count(*)\n  from branch\n  where\
    \ assets>2100000\n  ```\n\n- 找出每个分行的存款帐户余额平均额\n\n  ```sql\n  select branch-name,\
    \ avg (balance)\n  from account\n  group by branch-name\n  ```\n\n- 存款帐户平均余额大于1200的分行\n\
    \n  ```sql\n  select branch-name\n  from account\n  group by branch-name\n  having\
    \ avg (balance)>1200\n  ```\n\n## 数据库技术与应用\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_377_0.png)\n\
    \n北京邮电大学计算机学院 肖达\n\nxiaoda99@gmail.com\n\n## 数据查询\n\n- 单表查询\n- 集合查询\n- 连接查询\n\
    - 嵌套查询\n- **Select**语句的一般形式\n\n## 集合查询\n\n- 集合操作的种类\n  - 并操作 UNION\n  - 交操作 INTERSECT\n\
    \  - 差操作 EXCEPT\n\n参加集合操作的各查询结果的列数必须相同；对应项的数据类型也必须相同\n\n## 集合查询（续）\n\n[例] 查询计算机科学系的学生及年龄不大于19岁的学生。\n\
    \n方法一：\n\n```\nSELECT *\nFROM Student\nWHERE Sdept= 'CS'\nUNION\nSELECT *\nFROM\
