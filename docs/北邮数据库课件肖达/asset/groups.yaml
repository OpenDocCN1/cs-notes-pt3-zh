  - '[PAGE 234]


    # 2.2.1基本关系操作


    +   - 常用的关系操作

    +     - 查询：选择、投影、连接、除、并、交、差

    +     - 数据更新：插入、删除、修改

    +     - 查询的表达能力是其中最主要的部分

    +     - 选择、投影、并、差、笛卡尔基是5种基本操作

    +   - 关系操作的特点

    +     - 集合操作方式：操作的对象和结果都是集合，一次一集合的方式

    +     - 高度非过程化：只要指出“做什么”，不需要描述“怎么做”'
  - '[PAGE 235]


    # 2.2.2 关系数据库语言的分类


    +   - 关系代数语言

    +     - 用对关系的运算来表达查询要求

    +     - 代表： ISBL

    +   - 关系演算语言： 用谓词来表达查询要求

    +     - 元组关系演算语言

    +       - 谓词变元的基本对象是元组变量

    +       - 代表： APLHA, QUEL

    +     - 域关系演算语言

    +       - 谓词变元的基本对象是域变量

    +       - 代表： QBE

    +   - 关系代数和关系演算是相互等价的

    +   - 具有关系代数和关系演算双重特点的语言

    +     - 代表： SQL（Structured Query Language）'
