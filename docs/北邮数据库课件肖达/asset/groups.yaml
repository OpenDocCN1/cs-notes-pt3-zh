    \n## 1.2 数据模型\n\n- 1.2.1 两大类数据模型\n- 1.2.2 数据模型的组成要素\n- 1.2.3 概念模型\n- 1.2.4 最常用的数据模型\n\
    - 1.2.5 层次模型\n- 1.2.6 网状模型\n- 1.2.7 关系模型\n\n### 1.2.4 最常用的数据模型\n\n- 格式化模型\n  -\
    \ 层次模型（Hierarchical Model）\n  - 网状模型（Network Model）\n- 关系模型（Relational Model）\n\
    - 面向对象模型（Object Oriented Model）\n- 对象关系模型（Object Relational Model）\n\n### 1.2.5\
    \ 层次模型\n\n- 层次模型是数据库系统中最早出现的数据模型\n- 层次数据库系统的典型代表是IBM公司的IMS（Information Management\
    \ System）数据库管理系统\n- 层次模型用树形结构来表示各类实体以及实体间的联系\n\n**一、层次数据模型的数据结构**\n\n层次模型：满足下面两个条件的基本层次联系的集合为层次模型。\n\
    \n- 1. 有且只有一个节点没有双亲节点，这个节点称为根节点。\n- 2. 根以外的其它节点有且只有一个双亲节点。\n\n层次模型中的几个术语：根节点，双亲节点，兄弟节点，叶节点。\n\
