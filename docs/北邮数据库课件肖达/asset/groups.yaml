  - '[PAGE 820]


    # 模式的分解（续）


    +   - 如果一个分解具有无损连接性，则它能够保证不丢失信息。

    +   - 如果一个分解保持了函数依赖，则它可以减轻或解决各种异常情况。

    +   - 分解具有无损连接性和分解保持函数依赖是两个互相独立的标准。具有无损连接性的分解不一定能够保持函数依赖。同样，保持函数依赖的分解也不一定具有无损连接性。'
