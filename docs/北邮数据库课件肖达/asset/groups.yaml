    # 二、删除模式


    +   - `DROP SCHEMA <模式名> <CASCADE | RESTRICT>`

    +     - `CASCADE`（级联）

    +       - 删除模式的同时把该模式中所有的数据库对象全部删除

    +     - `RESTRICT`（限制）

    +       - 如果该模式中定义了下属的数据库对象（如表、视图等），则拒绝该删除语句的执行。

    +       - 当该模式中没有任何下属的对象时才能执行。


    【例4】`DROP SCHEMA ZHANG CASCADE;`


    删除模式`ZHANG`


    同时该模式中定义的表`TAB1`也被删除'
