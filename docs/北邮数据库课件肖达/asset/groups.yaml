  md: "\n## 投影\n\n- 从关系 R 中取若干列组成新的关系（从列的角度）\n\n$\\Pi_A(R)=\\{t[A]\\mid t\\in R\\\
    },\\ A\\subseteq R$\n\n其中 A 为 R 的属性列\n\n- 投影的结果中要去掉相同的行\n\n**R**\n\n| A | B |\
    \ C |\n|---|---|---|\n| a | b | c |\n| d | e | f |\n| c | b | c |\n\n**Π_B,C(R)**\n\
    \n| B | C |\n|---|---|\n| b | c |\n| e | f |\n\n### 投影示例\n\n- 找95001号学生所选修的课程号\n\
    \n$\\Pi_{Cno}(\\sigma_{Sno=95001}(SC))$\n\n**SC**\n\n| Sno | Cno | Grade |\n|---|---|---|\n\
    | 95001 | 1 | 92 |\n| 95001 | 2 | 85 |\n| 95001 | 3 | 88 |\n| 95002 | 2 | 90 |\n\
    | 95002 | 3 | 80 |\n\n**结果**\n\n| Cno |\n|---|\n| 1 |\n| 2 |\n| 3 |\n\n## 连接\n\
    \n- 连接操作是从两个关系的广义笛卡尔积中选择属性间满足一定条件的元组。通常写为：\n\n$R \\bowtie_{A \\theta B} S = \\\
    sigma_{R.A \\theta S.B} (R \\times S)$\n\n- A, B为R和S上度数相等且可比的属性列，θ为关系运算符\n\n**连接示例**\n\
    \n**R**\n\n| A | B | C |\n|---|---|---|\n| 1 | 2 | 3 |\n| 4 | 5 | 6 |\n| 7 | 8\
    \ | 9 |\n\n**S**\n\n| D | E |\n|---|---|\n| 3 | 1 |\n| 6 | 2 |\n\n**R ⋈ S（B <\
    \ D）**\n\n| A | B | C | D | E |\n|---|---|---|---|---|\n| 1 | 2 | 3 | 3 | 1 |\n\
    | 1 | 2 | 3 | 6 | 2 |\n| 4 | 5 | 6 | 6 | 2 |\n\n### 等值连接\n\nθ为“=”的连接运算称为等值连接。\n\
    \n等值连接的含义：从关系R与S的广义笛卡尔积中选取A、B属性值相等的那些元组，即等值连接为：\n\n$R \\underset{A=B}{\\bowtie}\
    \ S = \\{ \\widehat{t_r t_s} \\mid t_r \\in R \\land t_s \\in S \\land t_r[A]\
    \ = t_s[B] \\}$\n\n设有关系 r 和 s：\n\n**r**\n\n| A | B | C |\n|---|---|---|\n| a1\
    \ | b1 | 5 |\n| a1 | b2 | 6 |\n| a2 | b3 | 8 |\n| a2 | b4 | 12 |\n\n**s**\n\n\
    | B | E |\n|---|---|\n| b1 | 3 |\n| b2 | 7 |\n| b3 | 10 |\n| b3 | 2 |\n| b5 |\
    \ 2 |\n\n等值连接结果为：\n\n| A | B | C | B | E |\n|---|---|---|---|---|\n| a1 | b1 |\
    \ 5 | b1 | 3 |\n| a1 | b2 | 6 | b2 | 7 |\n| a2 | b3 | 8 | b3 | 10 |\n| a2 | b3\
    \ | 8 | b3 | 2 |\n\n### 自然连接\n\n若R和S具有相同的属性组（来自相同的域，表示相同的含义），且连接的运算符θ为“=”，并且在连接的结果中去掉重复的属性组，这种连接称为自然连接。\n\
    \n记为：\n\n- R ⋈ S\n- 当R与S无相同属性时，R ⋈ S = R × S\n\n自然连接结果为：\n\n| A | B | C | E |\n\
    |---|---|---|---|\n| a1 | b1 | 5 | 3 |\n| a1 | b2 | 6 | 7 |\n| a2 | b3 | 8 | 10\
    \ |\n| a2 | b3 | 8 | 2 |\n\n### 连接（续）\n\n- 外连接\n  - 如果把舍弃的元组也保存在结果关系中，而在其他属性上填空值(NULL)，这种连接就叫做外连接（OUTER\
    \ JOIN）。\n- 左外连接\n  - 如果只把左边关系R中要舍弃的元组保留就叫做左外连接 (LEFT OUTER JOIN或LEFT JOIN)\n\
    - 右外连接\n  - 如果只把右边关系S中要舍弃的元组保留就叫做右外连接 (RIGHT OUTER JOIN或RIGHT JOIN)。\n\n**r**\n\
    \n| A | B | C |\n|---|---|---|\n| a1 | b1 | 5 |\n| a1 | b2 | 6 |\n| a2 | b3 |\
    \ 8 |\n| a2 | b4 | 12 |\n\n**s**\n\n| B | E |\n|---|---|\n| b1 | 3 |\n| b2 | 7\
    \ |\n| b3 | 10 |\n| b3 | 2 |\n| b5 | 2 |\n\n(a) 外连接\n\n| A | B | C | E |\n|---|---|---|---|\n\
    | a1 | b1 | 5 | 3 |\n| a1 | b2 | 6 | 7 |\n| a2 | b3 | 8 | 10 |\n| a2 | b3 | 8\
    \ | 2 |\n| a2 | b4 | 12 | NULL |\n| NULL | b5 | NULL | 2 |\n\n(b) 左外连接\n\n| A\
    \ | B | C | E |\n|---|---|---|---|\n| a1 | b1 | 5 | 3 |\n| a1 | b2 | 6 | 7 |\n\
    | a2 | b3 | 8 | 10 |\n| a2 | b3 | 8 | 2 |\n| a2 | b4 | 12 | NULL |\n\n(c) 右外连接\n\
    \n| A | B | C | E |\n|---|---|---|---|\n| a1 | b1 | 5 | 3 |\n| a1 | b2 | 6 | 7\
    \ |\n| a2 | b3 | 8 | 10 |\n| a2 | b3 | 8 | 2 |\n| NULL | b5 | NULL | 2 |\n\n###\
    \ 连接示例\n\n- 求李勇同学选修的课程号\n\n$\\Pi_{Cno}(\\sigma_{Sname=李勇}(Student) \\bowtie SC)$\n\
    \n**Student**\n\n| Sno | Sname | Ssex | Sage | Sdept |\n|---|---|---|---|---|\n\
    | 95001 | 李勇 | 男 | 20 | CS |\n| 95002 | 刘晨 | 女 | 19 | IS |\n| 95003 | 王敏 | 女 |\
    \ 18 | MA |\n| 95004 | 张立 | 男 | 19 | IS |\n\n**SC**\n\n| Sno | Cno | Grade |\n\
    |---|---|---|\n| 95001 | 1 | 92 |\n| 95001 | 2 | 85 |\n| 95001 | 3 | 88 |\n| 95002\
    \ | 2 | 90 |\n| 95002 | 3 | 80 |\n\n## 除运算\n\n### 象集的定义\n\n- 象集（Image Set）\n \
    \ - 关系R(X , Z), X, Z是属性组，x是X上的取值，定义x在R中的象集为\n    - $Z_x = \\{ t[Z] | t \\in R\
    \ \\land t[X] = x \\}$\n  - 从R中选出在X上取值为x的元组，去掉X上的分量，只留Z上的分量\n\n### 象集的示例\n\n**R（X,\
    \ Z）**\n\n| 姓名 | 课程 |\n| --- | --- |\n| 张军 | 物理 |\n| 王红 | 数学 |\n| 张军 | 数学 |\n\n\
    张军的象集 $Z_x$（x=张军）：\n\n| 课程 |\n| --- |\n| 数学 |\n| 物理 |\n\n张军同学所选修的全部课程\n\n- 给定关系R（X，Y）和S（Y，Z），其中X，Y，Z为属性组。R中的Y与S中的Y可以有不同的属性名，但必须出自相同的值域。\n\
    - R与S的除运算得到一个新的关系P（X），P是R中满足下列条件的元组在X属性列上的投影：元组在X上分量值x的象集Yx包含S在Y上投影的集合。记作：\n \
    \ - $R \\div S = \\{ t_r[X] | t_r \\in R \\land \\Pi_Y(S) \\subseteq Y_x \\}$\n\
    \n### 除运算示例\n\n**R**\n\n| A | B | C |\n|---|---|---|\n| a1 | b1 | c2 |\n| a2 |\
    \ b3 | c7 |\n| a3 | b4 | c6 |\n| a1 | b2 | c3 |\n| a4 | b6 | c6 |\n| a2 | b2 |\
    \ c3 |\n| a1 | b2 | c1 |\n\n**S**\n\n| B | C | D |\n|---|---|---|\n| b1 | c2 |\
    \ d1 |\n| b2 | c1 | d1 |\n| b2 | c3 | d2 |\n\na1在R上的象集：\n\n| B | C |\n|---|---|\n\
    | b1 | c2 |\n| b2 | c3 |\n| b2 | c1 |\n\na2在R上的象集：\n\n| B | C |\n|---|---|\n|\
    \ b3 | c7 |\n| b2 | c3 |\n\na3在R上的象集：\n\n| B | C |\n|---|---|\n| b4 | c6 |\n\n\
    **R ÷ S**\n\n| A |\n|---|\n| a1 |\n\n如何得到选修了全部课程的学生？\n\n做法：逐个考虑选课关系SC中的元组r，求r在姓名Sname上的分量x，再求x在选课关系中的象集课程C_x，若C_x包含了所有的课程C，则x是满足条件的一个元组\n\
    \n$\\{ x | x = r[Sname] \\land r \\in SC \\land C_x \\supseteq C \\}$\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_270_0.png)\n\
