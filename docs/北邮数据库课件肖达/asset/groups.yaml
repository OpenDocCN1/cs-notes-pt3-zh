    +   - 形式化表示：\n+     - 用P表示谓词“学生200215122选修了课程y”\n+     - 用q表示谓词“学生x选修了课程y”\n+\
    \     - 则上述查询为：(∀y) p → q\n\n## 带有EXISTS谓词的子查询(续)\n\n+   - 等价变换：\n+     \\[(∀y)(p\
