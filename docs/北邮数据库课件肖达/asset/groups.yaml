    \ VIEW |\n|  | 索引 | CREATE INDEX |\n| 数据 | 基本表和视图 | SELECT，INSERT，UPDATE，DELETE，REFERENCES，ALL\
    \ PRIVILEGES |\n\n### GRANT（续）\n\n- 发出GRANT的用户\n  - DBA\n  - 数据库对象创建者（即属主Owner）\n\
    \  - 拥有该权限的用户\n- 接受权限的用户\n  - 一个或多个具体用户\n  - PUBLIC（全体用户）\n\n### 例题\n\n[例1] 把查询Student表权限授予用户U1\n\
    \n```\nGRANT SELECT\nON TABLE Student\nTO U1;\n```\n\n[例2] 把对Student表和Course表的全部权限授予用户U2和U3\n\
    \n```\nGRANT ALL PRIVILEGES\nON TABLE Student, Course\nTO U2, U3;\n```\n\n[例3]\
    \ 把对表SC的查询权限授予所有用户\n\n```\nGRANT SELECT\nON TABLE SC\nTO PUBLIC;\n```\n\n[例4]\
    \ 把查询Student表和修改学生学号的权限授予用户U4\n\n```\nGRANT UPDATE(Sno), SELECT\nON TABLE Student\n\
    TO U4;\n```\n\n对属性列的授权时必须明确指出相应属性列名\n\n[例5] 把对表SC的INSERT权限授予U5用户，并允许他再将此权限授予其他用户\n\
    \n```\nGRANT INSERT\nON TABLE SC\nTO U5\nWITH GRANT OPTION;\n```\n\n### 传播权限\n\
    \n执行例5后，U5不仅拥有了对表SC的INSERT权限，还可以传播此权限：\n\n```\n[例6] GRANT INSERT ON TABLE SC TO\
    \ U6 WITH GRANT OPTION;\n```\n\n同样，U6还可以将此权限授予U7：\n\n```\n[例7] GRANT INSERT ON\
    \ TABLE SC TO U7;\n```\n\n但U7不能再传播此权限。\n\n执行了[例1]到[例7]后，学生-课程数据库的用户权限定义表\n\n|\
