    \n可能存在冗余的数据和冗余的实体间联系\n\n### 冗余\n\n- **冗余的数据**是指可由基本数据导出的数据\n- **冗余的联系**是指可由其他联系导出的联系\n\
    - 冗余数据和冗余联系容易破坏数据库的完整性，给数据库维护增加困难\n- 消除不必要的冗余后的初步E-R图称为基本E-R图\n\n### 消除冗余的方法\n\
    \n**分析方法**\n\n- 根据数据字典中关于数据项之间的逻辑关系\n- Q3 = Q1×Q2，Q4 = ∑Q5，Q3和Q4冗余，“使用”联系冗余\n\n\
    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_906_0.png)\n\n### 消除冗余的方法（续）\n\n- 效率VS冗余信息\n\
    \  - 需要根据用户的整体需求来确定\n- 若人为地保留了一些冗余数据，则应把数据字典中数据关联的说明作为完整性约束条件\n  - Q4 = ∑Q5\n\
    \  - 一旦Q5修改后就应当触发完整性检查，对Q4进行修改\n\n### 消除冗余，设计生成基本E-R图实例\n\n**[实例] 某工厂管理信息系统的视图集成**\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_908_0.png)\n\n工厂物资管理E-R图\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_909_0.png)\n\
    \n劳动人事管理的分E-R图\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_909_1.png)\n\n销售管理子系统的分E-R图\n\
    \n### 系统的基本E-R\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_910_0.png)\n\n## 第七章\
    \ 数据库设计\n\n- 7.1 数据库设计概述\n- 7.2 需求分析\n- 7.3 概念结构设计\n- 7.4 逻辑结构设计\n- 7.5 数据库的物理设计\n\
    - 7.6 数据库的实施和维护\n- 7.7 小结\n\n### 逻辑结构设计\n\n#### 逻辑结构设计的任务\n\n- 把概念结构设计阶段设计好的基本E-R图转换为与选用DBMS产品所支持的数据模型相符合的逻辑结构\n\
    \n#### 逻辑结构设计的步骤\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_913_0.png)\n\n###\
    \ E-R图向关系模型的转换\n\n#### 数据模型的优化\n\n#### E-R图向关系模型的转换要解决的问题\n\n- 如何将实体型和实体间的联系转换为关系模式\n\
    - 如何确定这些关系模式的属性和码\n\n#### 转换内容\n\n将E-R图转换为关系模型：将实体、实体的属性和实体之间的联系转换为关系模式。\n\n####\
    \ E-R图向关系模型的转换（续）\n\n实体型间的联系有以下不同情况：\n\n1. 一个1:1联系可以转换为一个独立的关系模式，也可以与任意一端对应的关系模式合并。\n\
    \   - 与某一端实体对应的关系模式合并\n\n2. 一个1:n联系可以转换为一个独立的关系模式，也可以与n端对应的关系模式合并。\n   - 与n端对应的关系模式合并\n\
    \n3. 一个 m:n 联系转换为一个关系模式。\n\n例，“选修”联系是一个 m:n 联系，可以将它转换为如下关系模式，其中学号与课程号为关系的组合码：\n\
    \n选修（学号，课程号，成绩）\n\n4. 三个或三个以上实体间的一个多元联系转换为一个关系模式。\n\n例，“讲授”联系是一个三元联系，可以将它转换为如下关系模式，其中课程号、教工号和书号为关系的组合码：\n\
    \n讲授（课程号，教工号，书号）\n\n注意：\n\n- 从理论上讲，1:1联系可以与任意一端对应的关系模式合并\n- 但在一些情况下，与不同的关系模式合并效率会大不一样。因此究竟应该与哪端的关系模式合并需要依应用的具体情况而定。\n\
    - 由于连接操作是最费时的操作，所以一般应以尽量减少连接操作为目标。例如，如果经常要查询某个班级的班主任姓名，则将管理联系与教师关系合并更好些。\n\n【例】把图7.30中虚线上部的E-R图转换为关系模型\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_920_0.png)\n\n部门（部门号，部门名，经理的职工号，...）\n\
    \n> 此关系模式已包含了联系“领导”所对应的关系模式\n\n职工（职工号，部门号，职工名，职务，...）\n\n> 该关系模式已包含了联系“属于”所对应的关系模式\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_921_0.png)\n\n产品（产品号，产品名，产品组长的职工号，...）\n\
    \n供应商（供应商号，姓名，...）\n\n零件（零件号，零件名，...）\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_922_0.png)\n\
    \n职工工作（职工号，产品号，工作天数，...）\n\n供应（产品号，供应商号，零件号，供应量）\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_923_0.png)\n\
    \n"
