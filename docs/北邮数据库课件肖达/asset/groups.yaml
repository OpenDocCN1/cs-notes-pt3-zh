  - '[PAGE 287]


    # 实体完整性(续)


    实体完整性规则的说明


    +   (1) 实体完整性规则是针对基本关系而言的。一个基本表通常对应现实世界的一个实体集。\n(2) 现实世界中的实体是可区分的，即它们具有某种唯一性标识。\n(3)
    关系模型中以主码作为唯一性标识。\n(4) 主码中的属性即主属性不能取空值。


    主属性取空值，就说明存在某个不可标识的实体，即存在不可区分的实体，这与第（2）点相矛盾，因此这个规则称为实体完整性'
