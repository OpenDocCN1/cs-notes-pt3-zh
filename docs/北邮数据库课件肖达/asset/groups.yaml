    ## 规范化小结（续）\n\n- 不能说规范化程度越高的关系模式就越好\n- 在设计数据库模式结构时，必须对现实世界的实际情况和用户应用需求作进一步分析，确定一个合适的、能够反映现实世界的模式\n\
