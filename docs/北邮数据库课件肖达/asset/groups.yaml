  - '[PAGE 238]


    # 概述


    +   - 什么是关系代数？

    +     - 关系数据库的一种抽象的查询语言，用对关系的运算来表达查询。

    +     - 代数的要素：运算对象、运算符。

    +       - 运算符连接运算对象和/或表达式形成表达式

    +     - 关系代数

    +       - 运算对象：关系

    +       - 运算符：关系运算符

    +   - 为什么要学关系代数？

    +     - 已不用作商用RDBMS的查询语言，但SQL语言以关系代数作为核心

    +     - RDBMS处理查询时，首先将SQL查询翻译成关系代数或相似的内部表示'
