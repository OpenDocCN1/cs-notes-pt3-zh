    \n### 关系模式的形式化定义\n\n关系模式由五部分组成，即它是一个五元组：\n\n**R(U, D, DOM, F)**\n\n- R：关系名\n-\
    \ U：组成该关系的属性名集合\n- D：属性组U中属性所来自的域\n- DOM：属性向域的映象集合\n- F：属性间数据的依赖关系集合\n\n简化为一个二元组：\n\
    \n**(R, F)**\n\n### 什么是数据依赖\n\n- 客观世界中事物间的联系：\n  - 实体与实体的联系 —— 数据模型\n  - 实体内部属性间的联系\
    \ —— 数据依赖\n- 属性间的联系分为三类：\n  - 一对一\n  - 一对多\n  - 多对多\n\n数据依赖：关系中属性值之间相互依赖相互制约的联系。\n\
    \n- 属性间的数据依赖类型主要有两种：\n  - 函数依赖\n  - 多值依赖\n\n### 一、函数依赖\n\n定义6.1 设R(U)是一个属性集U上的关系模式，X和Y是U的子集。\n\
    \n若对于R(U)的任意一个可能的关系r，r中不可能存在两个元组在X上的属性值相等，而在Y上的属性值不等，则称“X函数确定Y”或 “Y函数依赖于X”，记作X→Y。\n\
    \n### 说明\n\n1. 所有关系实例均要满足\n2. 语义范畴的概念\n3. 数据库设计者可以对现实世界作强制的规定\n\n### 二、平凡函数依赖与非平凡函数依赖\n\
    \n在关系模式R(U)中，对于U的子集X和Y，\n\n如果X→Y，但Y ⊈ X，则称X→Y是非平凡的函数依赖\n\n若X→Y，但Y ⊆ X，则称X→Y是平凡的(trivial)函数依赖\n\
    \n例：在关系SC(Sno, Cno, Grade)中，\n\n非平凡函数依赖： (Sno, Cno) → Grade\n\n平凡函数依赖： (Sno, Cno)\
    \ → Sno\n\n(Sno, Cno) → Cno\n\n### 三、完全函数依赖与部分函数依赖\n\n**定义 6.2** 在 R(U) 中，如果 X→Y，并且对于\
    \ X 的任何一个真子集 X′，都有 X′↛Y，则称 Y 对 X **完全函数依赖**，记作 \\(X \\xrightarrow{F} Y\\)。\n\n\
    若 X→Y，但 Y 不完全函数依赖于 X，则称 Y 对 X **部分函数依赖**，记作 \\(X \\xrightarrow{P} Y\\)。\n\n###\
    \ 四、传递函数依赖\n\n定义6.3 在R(U)中，如果X→Y，(Y ⊈ X)，Y↛X，Y→Z，则称Z对X传递函数依赖。记为：X 传递 → Z\n\n注：如果Y→X，即X←→Y，则Z直接依赖于X。\n\
    \n### 确定函数依赖的方法\n\n属性间的联系决定函数依赖关系\n\n- X、Y有1:1关系，则X→Y，Y→X。可表示成：\n  X←→Y。\n- X、Y有1:m关系，则Y→X,但X↛Y。（如班主任：学生，则学生→班主任，但班主任→学生）\n\
    - X、Y有n:m关系，则X与Y不存在任何函数依赖。\n\n### 举例\n\n[例1]建立一个描述学生的数据库：\n学生的学号（Sno）、所在系（Sdept）\n\
    学生住处（Sloc）、课程号（Cno）\n成绩（Grade）\n\n单一的关系模式：Student <U、F>\n\n\\(U = \\{ Sno, Sdept,\
    \ Sloc, Cno, Grade \\}\\)\n\nF = { Sno → Sdept, Sdept → Sloc, (Sno, Cno) → Grade\
    \ }\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_752_0.png)\n\n\\((Sno,Cno) \\\
    xrightarrow{F} Grade\\) 是完全函数依赖，\n\n\\((Sno,Cno) \\xrightarrow{P} Sdept\\) 是部分函数依赖\n\
    \n因为 Sno → Sdept 成立，且 Sno 是（Sno，Cno）的真子集\n\nF = { Sno → Sdept, Sdept → Sloc, (Sno,\
    \ Cno) → Grade }\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_753_0.png)\n\nSno\
    \ → Sdept, Sdept → Sloc\n\nSloc传递函数依赖于Sno\n\n❖ 把这个单一模式分成3个关系模式：\n\n1. S（Sno，Sdept，Sno\
    \ → Sdept）；\n2. SC（Sno，Cno，Grade，（Sno，Cno）→ Grade）；\n3. DEPT（Sdept，Sloc，Sdept\
    \ → Sloc）；\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_755_0.png)\n\n简单教学管理的实体联系模型\
