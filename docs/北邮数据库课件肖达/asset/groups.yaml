  md: "\n## 相关子查询\n\n+   相关子查询和C语言中的常见循环嵌套类似：\n\n```\nfor (i=0;i<9;i++)\n    {for\
    \ (j=0;j<99;j++)\n        { j=f(i);\n          ……\n        }\n    }\n```\n\n##\
    \ 带有IN谓词的子查询（续）\n\n[例40]查询选修了课程名为“信息系统”的学生学号和姓名\n\n```\nSELECT Sno, Sname\nFROM\
    \ Student\nWHERE Sno IN\n    ( SELECT Sno\n      FROM SC\n      WHERE Cno IN\n\
    \          ( SELECT Cno\n            FROM Course\n            WHERE Cname = ‘信息系统’\n\
    \          )\n    );\n```\n\n+   ① 首先在Course关系中找出“信息系统”的课程号，为3号\n+   ② 然后在SC关系中找出选修了3号课程的学生学号\n\
    +   ③ 最后在Student关系中取出Sno和Sname\n\n## 带有比较运算符的子查询（续）\n\n例：假设一个学生只可能在一个系学习，并且必须属于一个系，则在[例39]可以用\
    \ = 代替 IN：\n\n```\nSELECT Sno, Sname, Sdept\nFROM   Student\nWHERE Sdept =\n \
    \      (SELECT Sdept\n        FROM   Student\n        WHERE Sname=‘刘晨’);\n```\n\
    \n## 带有比较运算符的子查询（续）\n\n【例41】找出每个学生超过他选修课程平均成绩的课程号。\n\n```\nSELECT Sno, Cno\nFROM\
    \ SC x\nWHERE Grade >=( SELECT AVG(Grade)\n                FROM SC y\n       \
    \         WHERE y.Sno=x.Sno );\n```\n\n此查询为相关子查询。\n\n## 带有比较运算符的子查询（续）\n\n###\
    \ 可能的执行过程：\n\n+   1. 从外层查询中取出SC的一个元组x，将元组x的Sno值（200215121）传送给内层查询。\n+   \n+  \
    \    ```sql\n+      SELECT AVG(Grade)\n+      FROM SC y\n+      WHERE y.Sno='200215121';\n\
    +      ```\n+   \n+   2. 执行内层查询，得到值88（近似值），用该值代替内层查询，得到外层查询：\n+   \n+      ```sql\n\
    +      SELECT Sno, Cno\n+      FROM SC x\n+      WHERE Grade >=88;\n+      ```\n\
    \n## 三、带有 ANY（SOME）或 ALL 谓词的子查询\n\n### 谓词语义\n\n+   - **ANY**：任意一个值\n+   - **ALL**：所有值\n\
    \n## 带有ANY（SOME）或ALL谓词的子查询（续）\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_423_0.png)\n\
    \n需要配合使用比较运算符\n\n+   - `> ANY`：大于子查询结果中的某个值\n+   - `> ALL`：大于子查询结果中的所有值\n+   -\
    \ `< ANY`：小于子查询结果中的某个值\n+   - `< ALL`：小于子查询结果中的所有值\n+   - `>= ANY`：大于等于子查询结果中的某个值\n\
    +   - `>= ALL`：大于等于子查询结果中的所有值\n+   - `<= ANY`：小于等于子查询结果中的某个值\n+   - `<= ALL`：小于等于子查询结果中的所有值\n\
    +   - `= ANY`：等于子查询结果中的某个值\n+   - `= ALL`：等于子查询结果中的所有值（通常没有实际意义）\n+   - `!=（或<>）ANY`：不等于子查询结果中的某个值\n\
    +   - `!=（或<>）ALL`：不等于子查询结果中的任何一个值\n\n## 带有ANY（SOME）或ALL谓词的子查询（续）\n\n【例42】查询其他系中比计算机科学某一学生年龄小的学生姓名和年龄\n\
