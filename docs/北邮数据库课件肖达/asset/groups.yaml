    ## 需求分析的任务和重点


    +   - 详细调查现实世界要处理的对象（组织、部门、企业等）

    +     - 充分了解原系统（手工系统或计算机系统）

    +     - 明确用户的各种需求

    +     - 确定新系统的功能

    +     - 充分考虑今后可能的扩充和改变


    +   - 调查的重点是“数据”和“处理”，获得用户对数据库要求

    +     - 信息要求

    +     - 处理要求

    +     - 安全性与完整性要求


