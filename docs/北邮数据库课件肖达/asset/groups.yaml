  md: "\n## 角色管理\n\n- 使用存储过程管理服务器角色的成员\n\n|  | 功能 |  |\n|---|---|---|\n| sp_addsrvrolemember\
    \ | 功能 | 将某一登录者加入到服务器角色中成为该角色的成员 |\n|  | 格式 | sp_addsrvrolemember '登录者名','服务器角色'\
    \ |\n|  | 举例 | 将登录者FirstUser加入到sysadmin 角色中<br>EXEC sp_addsrvrolemember 'FirstUser','sysadmin'\
    \ |\n| sp_dropsrvrolemember | 功能 | 将某一登录者从某一服务器角色中删除使之不再具有该服务器角色所赋予的权限 |\n|  |\
    \ 格式 | sp_dropsrvrolemember '登录者名','服务器角色' |\n|  | 举例 | EXEC sp_dropsrvrolemember\
    \ 'FirstUser','sysadmin' |\n\n## 角色管理\n\n- 数据库角色\n  - 固定数据库角色\n    - SQL Server预定义的、具有所有管理和访问数据库的权限\n\
    \    - SQL Server管理者不能对其所具有的权限进行任何修改\n    - SQL Server中的每一个数据库中都有一组固定数据库角色\n \
    \ - 用户自定义数据库角色\n\n## 角色管理\n\n| 固定数据库角色名 | 角色的权限 |\n|---|---|\n| db_owner | 数据库的所有者，可以执行任何数据库管理工作，可以对数据库内的任何对象进行任何操作，如删除、创建对象、将对象权限指定给其它用户。该角色包含下面各角色的所有权限\
    \ |\n| db_accessadmin | 可增加或删除Windows认证模式下Windows用户或Windows用户组登录者以及SQL Server用户\
    \ |\n| db_datareader | 能且仅能对数据库中所有表执行SELECT操作，以读取所有表数据 |\n| db_datawriter | 能对数据库中所有表执行INSERT、UPDATE、DELETE操作，但不能进行SELECT操作\
    \ |\n| db_ddladmin | 可以新建、删除、修改数据库中任何对象 |\n| db_securityadmin | 管理数据库内权限的GRANT、DENY和REVOKE，主要包括语句和对象权限，也包括对角色权限的管理\
    \ |\n| db_backupoperator | 可以备份数据库 |\n| db_denydatareader | 不能对数据库中任何表执行SELECT\
    \ 操作 |\n| db_denydatawriter | 不能对数据库中任何表执行UPDATE、DELETE和INSERT |\n\n## 数据库技术与应用\n\
    \n## 数据库完整性\n\n## 数据库完整性\n\n- 数据库的完整性\n  - 数据的正确性和相容性\n\n- 数据的完整性和安全性是两个不同概念\n\
    \  - 数据的完整性\n    - 防止数据库中存在不符合语义的数据，也就是防止数据库中存在不正确的数据\n    - 防范对象：不合语义的、不正确的数据\n\
    \  - 数据的安全性\n    - 保护数据库防止恶意的破坏和非法的存取\n    - 防范对象：非法用户和非法操作\n\n## 数据库完整性(续)\n\n\
    ## 例：一条完整性规则\n\n- 在更新“学生成绩”关系中的“成绩”字段时的完整性规则\n- 当更新“学生成绩.成绩”之后，判断“成绩是否>=0”，若不是，则进行相关的“规则违反”处理\n\
    - 该规则规定：更新“学生成绩.成绩”时进行完整性检查，“成绩是否>=0”为检查条件，最后给出错后的处理。\n\n- 完整性规则也称完整性约束条件，用有关的语言进行描述，系统加以编译，放入数据库中，可以进行修改和删除\n\
    \n## 数据库完整性(续)\n\n## 完整性约束的分类\n\n- 完整性约束条件中涉及的约束对象\n- **值约束和结构约束**\n  - 例：在向“学生成绩”关系中插入数据和更新数据时，需检查新的“学号”和“课程号”是否在“学生”关系和“课程”关系中已存在，否则不允许插入和更新。\n\
    - **静态约束与动态约束**\n  - 例：动态约束的例子，在更新“学生”关系中的“年龄”字段时，新值必须大于旧值\n- **立即执行约束和延迟执行约束**\n\
    \  - 例：银行业务中，从账户A转移资金X到账户B，约束条件是总资金不变\n\n## 数据库完整性\n\n- 实体完整性\n- 参照完整性\n- 用户定义的完整性\n\
    - 完整性约束命名子句\n- 触发器\n- 小结\n\n## 实体完整性定义\n\n- 关系模型的实体完整性\n  - CREATE TABLE中用PRIMARY\
