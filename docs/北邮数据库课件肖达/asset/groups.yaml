- raw:
  - '[PAGE 191]


    # Amazon SimpleDB


    Amazon SimpleDB is a web service providing the core database functions of data
    indexing and querying in the cloud.


    +   - **Traditional relational database**

    +     - requires a sizable upfront capital outlay

    +     - is complex to design

    +     - often requires extensive and repetitive database administration


    +   - **Amazon SimpleDB**

    +     - is dramatically simpler, providing a simple API for storage and access.

    +     - requiring no schema, automatically indexing your data.

    +     - eliminates the administrative burden of data modeling, index maintenance,
    and performance tuning.'
  - '[PAGE 192]


    # Example hierarchy of SimpleDB resources


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_192_0.png)'
  - '[PAGE 193]


    # SimpleDB and RDBMS

    One-to-One


    +   - Domain = storage container (table).

    +   - Item = table rows accessed by ID (primary key).

    +   - Attribute = table columns.


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_193_0.png)'
  - '[PAGE 194]


    # Amazon SimpleDB


    | item | description | color | material |

    |------|-------------|-------|----------|

    | 123 | Sweater | Blue, Red |  |

    | 456 | Dress shirt | White, Blue |  |

    | 789 | Shoes | Black | Leather |


    ```

    PUT (item, 123), (description, Sweater), (color, Blue), (color, Red)

    PUT (item, 456), (description, Dress shirt), (color, White), (color, Blue)

    PUT (item, 789), (description, Shoes), (color, Black), (material, Leather)

    ```


    # Query


    Domain = MyStore

    [''description'' = ''Sweater'']'
  - '[PAGE 195]


    # SimpleDB Prons


    +   - Simple

    +   - Flexible (no schemas)

    +   - Scalable - create new domains as

    +     - Your data grows

    +     - Request throughput increases

    +   - Reliable

    +   - Inexpensive'
  - '[PAGE 196]


    # SimpleDB Cons


    +   - Data integrity is not guaranteed.

    +   - Inconsistency.

    +   - Aggregate operations will require more coding and be much slower.

    +   - Complicated reports, and *ad hoc* queries, will require *a lot* more coding.

    +   - Complex data schemas are not supported'
  - '[PAGE 197]


    # Application of Amazon Infrastructure Services


    +   - A Fast Way of Building Web Apps

    +     - EC2 – Application logic

    +     - S3 – Unstructured data storage

    +     - SimpleDB – Structured data storage

    +     - SQS – Message passing'
  - '[PAGE 198]


    # Google Bigtable'
  - '[PAGE 199]


    # Motivation


    +   - Lots of (semi-)structured data at Google

    +     - URLs:

    +       - Contents, crawl metadata, links, anchors, pagerank,...

    +     - Per-user data:

    +       - User preference settings, recent queries/search results, ...

    +     - Geographic locations:

    +       - Physical entities (shops, restaurants, etc.), roads, satellite image
    data, user annotations, ...

    +   - Scale is large

    +     - Billions of URLs, many versions/page (~20K/version)

    +     - Hundreds of millions of users, thousands of q/sec

    +     - 100TB+ of satellite image data

    +     - 450,000 machines (NYTimes estimate, June 14th 2006'
  - '[PAGE 200]


    # Building Blocks


    +   - Google File System (SOSP’03)

    +   - MapReduce (OSDI’04)

    +   - Chubby Lock service (OSDI’06)

    +   - BigTable (OSDI’06)'
  - '[PAGE 201]


    # Why not just use commercial DB ?


    +   - Scale is too large for most commercial databases

    +   - Even if it weren''t, cost would be very high

    +     - Building internally means system can be applied across many projects for
    low incremental cost

    +   - Low-level storage optimizations help performance significantly

    +     - Much harder to do when running on top of a database layer


    *Also fun and challenging to build large-scale systems for Googlers☺*'
  - '[PAGE 202]


    # Data model: a big map


    +   - <Row, Column, Timestamp> triple for key - lookup, insert, and delete API

    +   - Arbitrary “columns” on a row-by-row basis

    +     - Column family:qualifier. Family is heavyweight, qualifier lightweight

    +     - Column-oriented physical store- rows are sparse!

    +   - Does not support a relational model

    +     - No table-wide integrity constraints

    +     - No multirow transactions


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_202_0.png)'
  - '[PAGE 203]


    # API


    +   - Metadata operations

    +     - Create/delete tables, column families, change metadata

    +   - Writes (atomic)

    +     - Set(): write cells in a row

    +     - DeleteCells(): delete cells in a row

    +     - DeleteRow(): delete all cells in a row

    +   - Reads

    +     - Scanner: read arbitrary cells in a bigtable

    +       - Each row read is atomic

    +       - Can restrict returned rows to a particular range

    +       - Can ask for just data from 1 row, all rows, etc.

    +       - Can ask for all columns, just certain column families, or specific columns'
