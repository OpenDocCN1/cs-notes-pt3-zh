    \ |\n| Securityadmin | 管理管理数据库登录 |\n| processadmin | 管理SQL Server进程 |\n| dbcreator\
    \ | 创建数据库并修改数据库 |\n| diskadmin | 管理磁盘文件 |\n| Bulkadmin | 执行BULK INSERT（大容量插入）操作\
    \ |\n"
