    \n[例6] 建立一个“课程”表Course\n\n```\nCREATE TABLE Course\n( Cno    CHAR(4) PRIMARY KEY,\n\
    \  Cname  CHAR(40),\n  Cpno   CHAR(4),\n  Ccredit SMALLINT,\n  FOREIGN KEY (Cpno)\
