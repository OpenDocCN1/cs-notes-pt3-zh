  - "[PAGE 659]\n\n# 事务内部的故障\n\n例子：银行转账事务，把一笔金额从一个账户甲转给另一个账户乙。\n\n```\nBEGIN TRANSACTION\n\
    读账户甲的余额BALANCE;\nBALANCE=BALANCE-AMOUNT;（AMOUNT 为转账金额）\n写回BALANCE;\nIF(BALANCE\
    \ < 0 ) THEN\n{\n    打印金额不足，不能转账；\n    ROLLBACK;（撤销刚才的修改，恢复事务）\n}\nELSE\n{\n \
    \   读账户乙的余额BALANCE1;\n    BALANCE1=BALANCE1+AMOUNT;\n    写回BALANCE1;\n    COMMIT;\n\
    }\n```"
  - '[PAGE 660]


    # 事务内部的故障（续）


    事务内部更多的故障是非预期的，不能由应用程序处理


    +   - 运算溢出

    +   - 并发事务发生死锁

    +   - 违反了某些完整性限制等


    以后，事务故障仅指这类**非预期的故障**


    事务故障的恢复：**撤消事务（UNDO）**'
