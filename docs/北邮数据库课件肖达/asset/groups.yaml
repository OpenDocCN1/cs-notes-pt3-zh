    \n首先建立一个临时关系K：\n\n| Cno |\n| --- |\n| 1 |\n| 3 |\n\n然后求： π_Sno,Cno(SC) ÷ K\n\n\
    | Sno | Cno |\n| --- | --- |\n| 200215121 | 1 |\n| 200215121 | 2 |\n| 200215121\
    \ | 3 |\n| 200215122 | 2 |\n| 200215122 | 3 |\n\n200215121 象集 {1, 2, 3}  \n200215122\
    \ 象集 {2, 3}  \nK={1, 3}  \n于是： π_Sno,Cno(SC) ÷ K = {200215121}\n\n[例8] 查询选修了2号课程的学生学号。\
    \  \nπ_Sno (σ_Cno='2' (SC)) = { 200215121, 200215122 }\n\n[例9] 查询至少选修了一门其直接先行课为5号课程的学生姓名\
    \  \nπ_Sname(σ_Cpno='5'(Course ▷◁ SC ▷◁ Student))  \n或 π_Sname(σ_Cpno='5'(Course)\
    \ ▷◁ SC ▷◁ π_Sno, Sname(Student))  \n或 π_Sname (π_Sno (σ_Cpno='5' (Course) ▷◁\
    \ SC) ▷◁ π_Sno, Sname (Student))\n\n[例10] 查询选修了全部课程的学生号码和姓名。  \nπ_Sno, Cno (SC)\
    \ ÷ π_Cno (Course) ▷◁ π_Sno, Sname (Student)\n\n## 综合举例（续）\n\n- 计算机产品数据库\n  -\
    \ Product(maker, model, type)\n  - PC(model, speed, ram, hd, price)\n  - Laptop(model,\
    \ speed, ram, hd, screen, price)\n  - Printer(model, color, type, price)\n\n###\
    \ Product\n\n| maker | model | type |\n| --- | --- | --- |\n| A | 1001 | pc |\n\
    | A | 1002 | pc |\n| A | 2004 | laptop |\n| B | 1003 | pc |\n| B | 2005 | laptop\
