    \  - 表2全部查找完后，再找表1中第二个元组，然后再从头开始扫描表2，逐一查找满足连接条件的元组，找到后就将表1中的第二个元组与该元组拼接起来，形成结果表中一个元组。\n\
    \  - 重复上述操作，直到表1中的全部元组都处理完毕\n\n## 排序合并法(SORT-MERGE)\n\n常用于等值连接\n\n- 首先按连接属性对表1和表2排序\n\
    - 对表1的第一个元组，从头开始扫描表2，顺序查找满足连接条件的元组，找到后就将表1中的第一个元组与该元组拼接起来，形成结果表中一个元组。当遇到表2中第一条大于表1连接字段值的元组时，对表2的查询不再继续\n\
    - 找到表1的第二条元组，然后从刚才的中断点处继续顺序扫描表2，查找满足连接条件的元组，找到后就将表1中的第一个元组与该元组拼接起来，形成结果表中一个元组。直接遇到表2中大于表1连接字段值的元组时，对表2的查询不再继续\n\
    - 重复上述操作，直到表1或表2中的全部元组都处理完毕为止\n\n## 索引连接法(INDEX-JOIN)\n\n- 对表2按连接字段建立索引\n- 对表1中的每个元组，依次根据其连接字段值查询表2的索引，从中找到满足条件的元组，找到后就将表1中的第一个元组与该元组拼接起来，形成结果表中一个元组\n\
    \n## 连接查询（续）\n\n- 一、等值与非等值连接查询\n- 二、自身连接\n- 三、外连接\n- 四、复合条件连接\n\n## 一、等值与非等值连接查询\n\
    \n- 等值连接：连接运算符为 =\n\n[例33] 查询每个学生及其选修课程的情况\n\n```\nSELECT Student.*, SC.*\nFROM\
    \   Student, SC\nWHERE  Student.Sno = SC.Sno;\n```\n\n查询结果：\n\n| Student.Sno |\
    \ Sname | Sex | Sage | Sdept | SC.Sno | Cno | Grade |\n|---|---|---|---|---|---|---|---|\n\
    | 200215121 | 李勇 | 男 | 20 | CS | 200215121 | 1 | 92 |\n| 200215121 | 李勇 | 男 |\
    \ 20 | CS | 200215121 | 2 | 85 |\n| 200215121 | 李勇 | 男 | 20 | CS | 200215121 |\
    \ 3 | 88 |\n| 200215122 | 刘晨 | 女 | 19 | CS | 200215122 | 2 | 90 |\n| 200215122\
    \ | 刘晨 | 女 | 19 | CS | 200215122 | 3 | 80 |\n\n## 等值与非等值连接查询（续）\n\n### ▪ 自然连接：\n\
    \n【例34】 对[例33]用自然连接完成。\n\n```\nSELECT Student.Sno, Sname, Ssex, Sage, Sdept, Cno,\n\
