    # 6.2.6 BC范式（BCNF）


    定义6.8 关系模式R<U，F>∈1NF，若X→Y且Y⊈X时X必含有码，则R<U，F>∈BCNF。


    等价于：每一个决定属性因素都包含码


    一个BCNF关系模式中,消除了任何属性(包括主属性)对码的传递依赖与部分依赖


    反例：K→R，K为码；若有X→Y，而X不包含K，则

    1、K→X，X→Y，而K→Y，即Y传递依赖于码；

    2、K包含X，而X→Y，K→Y，即Y部分依赖于码；'
  md: "\n## 6.2 规范化\n\n- 6.2.1 函数依赖\n- 6.2.2 码\n- 6.2.3 范式\n- 6.2.4 2NF\n- 6.2.5 3NF\n\
    - 6.2.6 BCNF\n- 6.2.7 多值依赖\n- 6.2.8 4NF\n- 6.2.9 规范化小结\n\n### 6.2.2 码\n\n定义6.4\
    \ 设K为R<U,F>中的属性或属性组合。若K→U，则K称为R的候选码（Candidate Key）。\n\n若候选码多于一个，则选定其中的一个作为主码（Primary\
    \ Key）。\n\n- **主属性与非主属性**\n  - 包含在任何一个候选码中的属性，称为主属性（Prime attribute）\n  - 不包含在任何候选码中的属性称为非主属性（Nonprime\
    \ attribute）或非码属性（Non-key attribute）\n- **全码**\n  - 整个属性组是码，称为全码（All-key）\n\n\
    **例2**\n\n关系模式S(Sno, Sdept, Sage)，单个属性Sno是码；SC(Sno, Cno, Grade)中，(Sno, Cno)是码。\n\
    \n**例3**\n\n关系模式R(P, W, A)\n\n- P：演奏者\n- W：作品\n- A：听众\n\n一个演奏者可以演奏多个作品；某一作品可被多个演奏者演奏；听众可以欣赏不同演奏者的不同作品。\n\
    \n码为(P, W, A)，即All-Key。\n\n**外部码**\n\n定义6.5 关系模式R中属性或属性组X并非R的码，但X是另一个关系模式的码，则称X是R的外部码（Foreign\
    \ key），也称外码。\n\n- 如在SC(Sno, Cno, Grade)中，Sno不是码，但Sno是关系模式S(Sno, Sdept, Sage)的码，则Sno是关系模式SC的外部码。\n\
    - 主码与外部码一起提供了表示关系间联系的手段。\n\n### 6.2.3 范式\n\n- 范式是符合某一种级别的关系模式的集合。\n- 关系数据库中的关系必须满足一定的要求。满足不同程度要求的为不同范式。\n\
    - 范式概念的发展：\n  - 1971~1972年，Codd系统地提出了1NF、2NF、3NF的概念。\n  - 1974年，Codd和Boyce共同提出了BCNF。\n\
    \  - 1976年，Fagin提出了4NF。\n  - 后来又有人提出了5NF。\n\n- 各种范式之间存在联系：\n  - 1NF ⊃ 2NF ⊃ 3NF\
    \ ⊃ BCNF ⊃ 4NF ⊃ 5NF\n- 某一关系模式R为第n范式，可简记为R∈nNF。\n- 一个低一级范式的关系模式，通过模式分解可以转换为若干个高一级范式的关系模式的集合，这种过程就叫规范化。\n\
    \n### 6.2.4 2NF\n\n**1NF的定义**\n\n如果一个关系模式R的所有属性都是不可分的基本数据项，则R∈1NF。\n\n第一范式是对关系模式的最起码的要求。不满足第一范式的数据库模式不能称为关系数据库。\n\
    \n但是满足第一范式的关系模式并不一定是一个好的关系模式。\n\n**例4** 关系模式S-L-C(Sno, Sdept, Sloc, Cno, Grade)\n\
    \n函数依赖包括：\n\n- (Sno, Cno) → Grade\n- Sno → Sdept\n- (Sno, Cno) → Sdept\n- Sno\
    \ → Sloc\n- (Sno, Cno) → Sloc\n- Sdept → Sloc\n\nS-L-C的码为(Sno, Cno)；S-L-C满足第一范式；非主属性Sdept和Sloc部分函数依赖于码(Sno,\
    \ Cno)。\n\n**S-L-C不是一个好的关系模式**\n\nS-L-C(Sno，Cno，Sdept，Sloc，Grade)\n\n- 插入异常：插入一个学生，还未选课。\n\
    - 删除异常：删除一个学生选的唯一课程。\n- 数据冗余度大：一个学生选修k门课，Sdept、Sloc重复存储k次。\n\n**❖ 原因**\n\nSdept、Sloc部分函数依赖于码。\n\
    \n**❖ 解决方法**\n\nS-L-C分解为两个关系模式，以消除这些部分函数依赖：\n\n- SC(Sno，Cno，Grade)\n- S-L(Sno，Sdept，Sloc)\n\
    \n函数依赖图：\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_768_0.png)\n\n- 关系模式SC的码为(Sno，Cno)。\n\
    - 关系模式S-L的码为Sno。\n- 这样非主属性对码都是完全函数依赖。\n\n**2NF的定义**\n\n定义6.6 若R∈1NF，且每一个非主属性完全函数依赖于码，则R∈2NF。\n\
    \n例：\n\n- S-L-C(Sno, Sdept, Sloc, Cno, Grade) ∈ 1NF\n- S-L-C(Sno, Sdept, Sloc,\
    \ Cno, Grade) ∉ 2NF\n- SC(Sno，Cno，Grade) ∈ 2NF\n- S-L(Sno，Sdept，Sloc) ∈ 2NF\n\n\
    采用投影分解法将一个1NF的关系分解为多个2NF的关系，可以在一定程度上减轻原1NF关系中存在的插入异常、删除异常、数据冗余度大、修改复杂等问题。\n\n\
    将一个1NF关系分解为多个2NF的关系，并不能完全消除关系模式中的各种异常情况和数据冗余。\n\n### 6.2.5 3NF\n\n**例**：2NF关系模式S-L(Sno,\
    \ Sdept, Sloc)，修改复杂：一个系换学生宿舍楼。\n\n函数依赖：\n\n- Sno → Sdept\n- Sdept → Sloc\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_772_0.png)\n\
    \nSno传递→Sloc，即S-L中存在非主属性对码的传递函数依赖。\n\n**3NF的定义**\n\n定义6.7 关系模式R<U, F>中若不存在这样的码X、属性组Y及非主属性Z（Z\
    \ ⊈ Y），使得X→Y，Y→Z成立，且Y ⊈ X，则称R<U, F>∈3NF。\n\n若R∈3NF，则每一个非主属性既不部分依赖于码也不传递依赖于码。\n\
    \n- S-L(Sno, Sdept, Sloc) ∈ 2NF\n- S-L(Sno, Sdept, Sloc) ∉ 3NF\n- S-D(Sno, Sdept)\
    \ ∈ 3NF\n- D-L(Sdept, Sloc) ∈ 3NF\n\n### 练习\n\n分析下面关系的函数依赖，是否3NF？并分解。\n\n- 关系W（工号，姓名，工种，定额）\n\
    - 每个工种有一个定额\n- 关系R（材料号、材料名、生产厂）\n\n| 材料号 | 材料名 | 生产厂 |\n|---|---|---|\n| M1 |\
    \ 线材 | 武汉 |\n| M2 | 型材 | 武汉 |\n| M3 | 板材 | 广东 |\n| M4 | 型材 | 武汉 |\n\n### 6.2.6\
