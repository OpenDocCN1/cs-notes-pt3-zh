    \ C3;\nALTER TABLE Student\nADD CONSTRAINT C3 CHECK (Sage < 40);\n```\n\n## 数据库完整性\n\
    \n实体完整性\n\n参照完整性\n\n用户定义的完整性\n\n完整性约束命名子句\n\n触发器\n\n小结\n\n## 触发器\n\n触发器（Trigger）是用户定义在关系表上的一类由事件驱动的特殊过程\n\
    \n- 由服务器自动激活\n- 可以进行更为复杂的检查和操作，具有更精细和更强大的数据控制能力\n\n## 触发器\n\n- 定义触发器\n- 激活触发器\n\
    - 删除触发器\n\n### 定义触发器\n\n### CREATE TRIGGER语法格式\n\n```\nCREATE TRIGGER <触发器名>\n\
    { BEFORE | AFTER } <触发事件> ON <表名>\nFOR EACH { ROW | STATEMENT }\n[WHEN <触发条件>]\n\
    <触发动作体>\n```\n\n### 定义触发器(续)\n\n例如, 假设在TEACHER表上创建了一个AFTER UPDATE触发器。如果表TEACHER有1000行，执行如下语句：\n\
    \n```\nUPDATE TEACHER SET Deptno=5;\n```\n\n- 如果该触发器为语句级触发器，那么执行完该语句后，触发动作只发生一次\n\
    - 如果是行级触发器，触发动作将执行1000次\n\n### 定义触发器(续)\n\n[例19] 定义AFTER行级触发器，当教师表Teacher的工资发生变化后就自动在工资变化表Sal_log中增加一条相应记录\n\
    \n首先建立工资变化表Sal_log\n\n```\nCREATE TABLE Sal_log\n(Eno NUMERIC(4) references teacher(eno),\n\
    Sal NUMERIC(7, 2),\nUsername char(10),\nDate TIMESTAMP\n);\n```\n\n### 定义触发器(续)\n\
    \n[例19]（续）\n\n```\nCREATE TRIGGER Insert_Sal\nAFTER INSERT ON Teacher    /*触发事件是INSERT*/\n\
    FOR EACH ROW\nAS BEGIN\n    INSERT INTO Sal_log VALUES( new.Eno, new.Sal,\n  \
    \                              CURRENT_USER, CURRENT_TIMESTAMP);\nEND;\n```\n\n\
    ```\nCREATE TRIGGER Update_Sal\nAFTER UPDATE ON Teacher    /*触发事件是UPDATE */\n\
    FOR EACH ROW\nAS BEGIN\n    IF (new.Sal <> old.Sal) THEN INSERT INTO Sal_log VALUES(\n\
    \        new.Eno, new.Sal, CURRENT_USER, CURRENT_TIMESTAMP);\n    END IF;\nEND;\n\
    ```\n"
  mdcn: "\n\n## 数据库完整性\n\n- 实体完整性\n- 参照完整性\n- 用户定义的完整性\n- 完整性约束命名子句\n- 触发器\n- 小结\n\
    \n## 用户定义的完整性\n\n- 用户定义的完整性就是针对某一具体应用的数据必须满足的语义要求\n- RDBMS提供，而不必由应用程序承担\n\n##\
    \ 用户定义的完整性\n\n- 属性上的约束条件的定义\n- 属性上的约束条件检查和违约处理\n- 元组上的约束条件的定义\n- 元组上的约束条件检查和违约处理\n\
    \n### 属性上的约束条件的定义\n\n### CREATE TABLE时定义\n\n- 列值非空（NOT NULL）\n- 列值唯一（UNIQUE）\n\
    - 检查列值是否满足一个布尔表达式（CHECK）\n\n### 属性上的约束条件的定义(续)\n\n不允许取空值\n\n[例5] 在定义SC表时，说明Sno、Cno、Grade属性不允许取空值。\n\
    \n```\nCREATE TABLE SC\n(Sno CHAR(9) NOT NULL,\nCno CHAR(4) NOT NULL,\nGrade SMALLINT\
    \ NOT NULL,\nPRIMARY KEY (Sno, Cno),\n/* 如果在表级定义实体完整性，隐含了Sno，Cno不允许取空值，则在列级不允许取空值的定义就不必写了\
    \ */\n);\n```\n\n### 属性上的约束条件的定义(续)\n\n用CHECK短语指定列值应该满足的条件\n\n[例7] Student表的Ssex只允许取“男”或“女”。\n\
    \n```\nCREATE TABLE Student\n(Sno CHAR(9) PRIMARY KEY,\nSname CHAR(8) NOT NULL,\n\
    Ssex CHAR(2) CHECK (Ssex IN('男','女')),\n/*性别属性Ssex只允许取'男'或'女'*/\nSage SMALLINT,\n\
    Sdept CHAR(20)\n);\n```\n\n### 属性上的约束条件检查和违约处理\n\n- ◆ 插入元组或修改属性的值时，RDBMS检查属性上的约束条件是否被满足\n\
    - ◆ 如果不满足则操作被拒绝执行\n\n## 用户定义的完整性\n\n- 属性上的约束条件的定义\n- 属性上的约束条件检查和违约处理\n- 元组上的约束条件的定义\n\
    - 元组上的约束条件检查和违约处理\n\n### 元组上的约束条件的定义\n\n- 在 CREATE TABLE 时可以用 CHECK 短语定义元组上的约束条件，即元组级的限制\n\
    - 同属性值限制相比，元组级的限制可以设置不同属性之间的取值的相互约束条件\n\n### 元组上的约束条件的定义(续)\n\n[例9] 当学生的性别是男时，其名字不能以Ms.打头。\n\
    \n```\nCREATE TABLE Student\n(Sno CHAR(9),\nSname CHAR(8) NOT NULL,\nSsex CHAR(2),\n\
    Sage SMALLINT,\nSdept CHAR(20),\nPRIMARY KEY (Sno),\nCHECK (Ssex='女' OR Sname\
    \ NOT LIKE 'Ms.%')\n/*定义了元组中Sname和 Ssex两个属性值之间的约束条件*/\n);\n```\n\n- ✓ 性别是女性的元组都能通过该项检查，因为Ssex='女'\
    \ 成立；\n- ✓ 当性别是男性时，要通过检查则名字一定不能以Ms.打头\n\n## 用户定义的完整性\n\n- 属性上的约束条件的定义\n- 属性上的约束条件检查和违约处理\n\
    - 元组上的约束条件的定义\n- 元组上的约束条件检查和违约处理\n\n### 元组上的约束条件检查和违约处理\n\n- ◆ 插入元组或修改属性的值时，RDBMS检查元组上的约束条件是否被满足\n\
    - ◆ 如果不满足则操作被拒绝执行\n\n## 数据库完整性\n\n实体完整性\n\n参照完整性\n\n用户定义的完整性\n\n完整性约束命名子句\n\n\
    触发器\n\n小结\n\n### 完整性约束命名子句(续)\n\n【例10】 建立学生登记表Student，要求学号在90000~99999之间，姓名不能为空值，年龄小于30，性别只能是“男”或“女”。\n\
    \n```\nCREATE TABLE Student\n    (Sno NUMERIC(6)\n     CONSTRAINT C1 CHECK (Sno\
    \ BETWEEN 90000 AND 99999),\n     Sname CHAR(20)\n     CONSTRAINT C2 NOT NULL,\n\
    \     Sage NUMERIC(3)\n     CONSTRAINT C3 CHECK (Sage < 30),\n     Ssex CHAR(2)\n\
    \     CONSTRAINT C4 CHECK (Ssex IN ('男', '女')),\n     CONSTRAINT StudentKey PRIMARY\
    \ KEY(Sno)\n    );\n```\n\n- ✓ 在Student表上建立了5个约束条件，包括主码约束（命名为StudentKey）以及C1、C2、C3、C4四个列级约束。\n\
    \n### 完整性约束命名子句(续)\n\n### 修改表中的完整性限制\n\n- 使用ALTER TABLE语句修改表中的完整性限制\n\n### 完整性约束命名子句(续)\n\
    \n[例13] 修改表Student中的约束条件，要求学号改为在900000~999999之间，年龄由小于30改为小于40\n\n- 可以先删除原来的约束条件，再增加新的约束条件\n\
    \n```\nALTER TABLE Student\nDROP CONSTRAINT C1;\nALTER TABLE Student\nADD CONSTRAINT\
    \ C1 CHECK (Sno BETWEEN 900000 AND 999999);\nALTER TABLE Student\nDROP CONSTRAINT\
    \ C3;\nALTER TABLE Student\nADD CONSTRAINT C3 CHECK (Sage < 40);\n```\n\n## 数据库完整性\n\
    \n实体完整性\n\n参照完整性\n\n用户定义的完整性\n\n完整性约束命名子句\n\n触发器\n\n小结\n\n## 触发器\n\n触发器（Trigger）是用户定义在关系表上的一类由事件驱动的特殊过程\n\
    \n- 由服务器自动激活\n- 可以进行更为复杂的检查和操作，具有更精细和更强大的数据控制能力\n\n## 触发器\n\n- 定义触发器\n- 激活触发器\n\
    - 删除触发器\n\n### 定义触发器\n\n### CREATE TRIGGER语法格式\n\n```\nCREATE TRIGGER <触发器名>\n\
    { BEFORE | AFTER } <触发事件> ON <表名>\nFOR EACH { ROW | STATEMENT }\n[WHEN <触发条件>]\n\
    <触发动作体>\n```\n\n### 定义触发器(续)\n\n例如, 假设在TEACHER表上创建了一个AFTER UPDATE触发器。如果表TEACHER有1000行，执行如下语句：\n\
    \n```\nUPDATE TEACHER SET Deptno=5;\n```\n\n- 如果该触发器为语句级触发器，那么执行完该语句后，触发动作只发生一次\n\
    - 如果是行级触发器，触发动作将执行1000次\n\n### 定义触发器(续)\n\n[例19] 定义AFTER行级触发器，当教师表Teacher的工资发生变化后就自动在工资变化表Sal_log中增加一条相应记录\n\
    \n首先建立工资变化表Sal_log\n\n```\nCREATE TABLE Sal_log\n(Eno NUMERIC(4) references teacher(eno),\n\
    Sal NUMERIC(7, 2),\nUsername char(10),\nDate TIMESTAMP\n);\n```\n\n### 定义触发器(续)\n\
    \n[例19]（续）\n\n```\nCREATE TRIGGER Insert_Sal\nAFTER INSERT ON Teacher    /*触发事件是INSERT*/\n\
    FOR EACH ROW\nAS BEGIN\n    INSERT INTO Sal_log VALUES( new.Eno, new.Sal,\n  \
    \                              CURRENT_USER, CURRENT_TIMESTAMP);\nEND;\n```\n\n\
    ```\nCREATE TRIGGER Update_Sal\nAFTER UPDATE ON Teacher    /*触发事件是UPDATE */\n\
    FOR EACH ROW\nAS BEGIN\n    IF (new.Sal <> old.Sal) THEN INSERT INTO Sal_log VALUES(\n\
    \        new.Eno, new.Sal, CURRENT_USER, CURRENT_TIMESTAMP);\n    END IF;\nEND;\n\
    ```\n\n"
