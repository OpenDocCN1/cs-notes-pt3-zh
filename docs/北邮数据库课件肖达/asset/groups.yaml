  - '[PAGE 314]


    # SQL Server 2005平台主要部分


    +   - 数据库引擎

    +     - 即传统意义上的数据库，用于存储、处理和保护数据的核心服务。

    +   - 分析服务: Analysis Services

    +     - 为商业智能应用程序提供了联机分析处理（OLAP）和数据挖掘功能。

    +   - 集成服务: Integration Services

    +     - 可从不同的数据源提取、转换和合并数据，并转移到目标。

    +   - 复制

    +     - 用于在数据库间复制和分发数据和数据库对象，然后在数据库间进行同步操作以维持一致性。

    +   - 报表服务: Reporting Services

    +     - 用于创建和管理来自关系数据库和多维数据源的数据的报表。

    +   - 通知服务: Notification Services

    +     - 用于开发和部署可生成并发送通知的应用程序。

    +   - 服务代理: Service Broker

    +     - 帮助开发人员生成可可伸缩和安全的分布式异步数据库应用程序

    +   - 全文搜索

    +     - 快速、灵活检索文本数据'
