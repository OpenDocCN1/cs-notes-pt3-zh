    # (1) 比较大小


    [例] 查询计算机科学系全体学生的名单。


    ```

    SELECT Sname

    FROM Student

    WHERE Sdept=''CS'';

    ```


    [例] 查询所有年龄在20岁以下的学生姓名及其年龄。


    ```

    SELECT Sname, Sage

    FROM Student

    WHERE Sage < 20;

    ```


    [例] 查询考试成绩有不及格的学生的学号。


    ```

    SELECT DISTINCT Sno

    FROM SC

    WHERE Grade<60;

    ```'
  - '[PAGE 354]


    # (2) 确定范围


    +   调词： BETWEEN ... AND ...

    +   NOT BETWEEN ... AND ...


    [例] 查询年龄在20~23岁（包括20岁和23岁）之间的学生的姓名、系别和年龄


    ```

    SELECT Sname, Sdept, Sage

    FROM  Student

    WHERE  Sage BETWEEN 20 AND 23;

    ```


    [例] 查询年龄不在20~23岁之间的学生姓名、系别和年龄


    ```

    SELECT Sname, Sdept, Sage

    FROM  Student

    WHERE Sage NOT BETWEEN 20 AND 23;

    ```'
  - '[PAGE 355]


    # (3) 确定集合


    +   谓词： IN <值表>, NOT IN <值表>


    [例]查询信息系（IS）、数学系（MA）和计算机科学系（CS）学生的姓名和性别。


    ```

    SELECT Sname, Ssex

    FROM Student

    WHERE Sdept IN (''IS'', ''MA'', ''CS'');

    ```


    [例]查询既不是信息系、数学系，也不是计算机科学系的学生姓名和性别。


    ```

    SELECT Sname, Ssex

    FROM Student

    WHERE Sdept NOT IN (''IS'', ''MA'', ''CS'');

    ```'
