    \n### 学生表Student\n\n[例5] 建立“学生”表Student，学号是主码，姓名取值唯一。\n\n```\nCREATE TABLE Student\n\
    (Sno CHAR(9) PRIMARY KEY, /* 列级完整性约束条件 */\nSname CHAR(20) UNIQUE, /* Sname取唯一值\
