    \n## 二、模式／内模式映象\n\n- 模式／内模式映象定义了数据全局逻辑结构与存储结构之间的对应关系。\n  - 例如，说明逻辑记录和字段在内部是如何表示的\n\
    - 数据库中模式／内模式映象是唯一的\n- 该映象定义通常包含在模式描述中\n\n## 模式 / 内模式映射（续）\n\n保证数据的物理独立性\n\n> 当数据库的存储结构改变了（例如选用了另一种存储结构），数据库管理员修改模式\
