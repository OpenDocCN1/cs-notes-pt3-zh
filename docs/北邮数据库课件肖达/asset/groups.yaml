  md: "\n## 数据库镜像的用途\n\n- 出现介质故障时\n  - 可由镜像磁盘继续提供使用\n  - 同时DBMS自动利用镜像磁盘数据进行数据库的恢复\n\
    \  - 不需要关闭系统和重装数据库副本(如下图所示)\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_710_0.png)\n\
    \n## 数据库镜像（续）\n\n没有出现故障时\n\n- 可用于并发操作\n\n- 一个用户对数据加排他锁修改数据，其他用户可以\n\n读镜像数据库上的数据，而不必等待该用户释放锁\n\
    \n## 数据库镜像（续）\n\n频繁地复制数据自然会降低系统运行效率\n\n- 在实际应用中用户往往只选择对关键数据和日志文件镜像，而不是对整个数据库进行镜像\n\
    \n## 第十章 数据库恢复技术\n\n- 10.1 事务的基本概念\n- 10.2 数据库恢复概述\n- 10.3 故障的种类\n- 10.4 恢复的实现技术\n\
    - 10.5 恢复策略\n- 10.6 具有检查点的恢复技术\n- 10.7 数据库镜像\n- 10.8 小结\n\n## 10.8 小结\n\n- 如果数据库只包含成功事务提交的结果，就说数据库处于一致性状态。保证数据一致性是对数据库的最基本的要求。\n\
    \n- 事务是数据库的逻辑工作单位\n\n  - DBMS保证系统中一切事务的原子性、一致性、隔离性和持续性\n\n## 小结（续）\n\n- ◆ DBMS必须对事务故障、系统故障和介质故障进行恢复\n\
    - ◆ 恢复中最经常使用的技术：数据库转储和登记日志文件\n\n## 小结（续）\n\n- ◆ 常用恢复技术\n  - 事务故障的恢复\n    ➤ UNDO\n\
    \  - 系统故障的恢复\n    ➤ UNDO + REDO\n  - 介质故障的恢复\n    ➤ 重装备份并恢复到一致性状态 + REDO\n\n##\
    \ SQL Server的数据库备份和恢复\n\n## 步骤\n\n- 1. 创建备份设备\n- 2. 进行数据库的完整备份、差异备份、日志备份\n- 3.\
    \ 恢复数据库\n\n## SQL Server的数据库备份和恢复\n\n## 备份设备\n\n- 每次执行SQL Server备份时，都会形成一个备份集\n\
    - 备份集必须存储在磁盘和磁带设备上，这些设备称为备份设备\n- SQL Server 使用物理设备名或逻辑设备名来标识备份设备\n\n## 物理设备\n\n\
    - 操作系统用来标识备份设备的名称，如 C:\\Backups\\MyBackup.bak。\n\n## 逻辑设备\n\n- 用来标识物理备份设备的别名或公用名称\n\
    - 逻辑设备名永久地存储在 SQL Server 内的系统表中，以相对简单的方式引用物理设备\n- 如物理设备名C:\\Backups\\MyBackup.bak的逻辑设备名可以是\
    \ MyBackup\n\n## SQL Server的数据库备份和恢复\n\n## ◆ 使用系统存储过程管理备份设备\n\n- **sp_addumpdevice**\n\
    \  - 功能：创建备份设备\n  - 格式：`sp_addumpdevice '设备类型','设备逻辑名','设备实际名'`\n  - 说明：使用不同的备份介质其名称格式不同\n\
    \  - 举例：`sp_addumpdevice 'disk','MyBackup1','c:\\Mybackup1.bak'`\n\n- **sp_dropdevice**\n\
    \  - 功能：删除备份设备\n  - 格式：`sp_dropdevice '备份设备逻辑名'['delfile']`\n  - 说明：要删除实际物理设备文件时，delfile\
    \ 必须给出，否则备份设备相对应的实体文件仍旧存在\n  - 举例：`sp_dropdevice 'MyBackup1','delfile'`\n\n##\
    \ SQL Server的数据库备份和恢复\n\n## 数据库恢复模式\n\n- 可为SQL Server中的每个数据库选择3种恢复模型中的一种\n- 以确定如何备份数据以及能承受何种程度的数据丢失\n\
    - **三种模型**\n  - **简单恢复（Simple Recovery）**\n    - 仅使用数据库备份或差异备份而不涉及事务日志备份\n   \
    \ - 可使数据库恢复到上一次备份的状态，无法恢复到失败点状态\n    - 选择该模式的常用备份策略是先进行数据库备份，再进行差异备份\n\n## SQL\
    \ Server的数据库备份和恢复\n\n- 批日志恢复（Bulk-logged Recovery）\n  - 性能上优于简单恢复和完全恢复模式，能尽可能减少批操作所需要的日志存储空间。\n\
    - 说明\n  - 数据库在创建时具有与 model 数据库相同的恢复模型\n  - 若要更改默认恢复模型，可使用ALTER DATABASE 更改 model\
    \ 数据库的恢复模型或使用企业管理器和 ALTER DATABASE命令修改数据库的恢复模型\n\n## SQL Server的数据库备份和恢复\n\n-\
    \ 例：备份“学生-课程数据库”\n  - 创建备份设备\n    ```sql\n    sp_addumpdevice 'disk', 'MyBackup1','c:\\\
    Mybackup1.bak'\n    ```\n  - 备份数据库\n    ```sql\n    BACKUP DATABASE StudentCourse\
    \ TO MyBackup1\n    ```\n  - 创建事务日志备份设备\n    ```sql\n    sp_addumpdevice 'disk',\
    \ 'MyBackupLog1','c:\\MybackupLog1.bak'\n    sp_addumpdevice 'disk', 'MyBackupLog2','c:\\\
    MybackupLog2.bak'\n    ```\n  - 备份事务日志1\n    ```sql\n    BACKUP LOG StudentCourse\
    \ TO MyBackupLog1\n    ```\n  - 备份事务日志2\n    ```sql\n    BACKUP LOG StudentCourse\
    \ TO MyBackupLog2\n    ```\n\n## SQL Server的数据库备份和恢复\n\n## 恢复事务日志\n\n- RESTORE\
    \ LOG <数据库名>|<@数据库名变量>\n- [FROM <备份设备> [...n]]\n- [WITH <NORECOVERY>|<RECOVERY>]\n\
    - [STOPAT = <日期时间>|<@日期时间变量>]\n- 其中\n  - <日期时间>表示将数据库恢复到该设定时间以前的状态\n  - 只有在该时间以前的事务日志才会被恢复\n\
    \  - 但若使用了NORECOVERY选项，则不能选定此选项\n\n## SQL Server的数据库备份和恢复\n\n- 例：恢复“学生-课程数据库”至2009年4月1日前的状态\n\
    \  - 恢复数据库\n  - 恢复事务日志1\n  - 恢复事务日志2\n\n```\nRESTORE DATABASE StudentCourse\n\
    FROM MyBackup1\nWITH NORECOVERY\n```\n\n```\nRESTORE LOG StudentCourse\nFROM MyBackupLog1\n\
    WITH NORECOVERY\n```\n\n```\nRESTORE LOG StudentCourse\nFROM MyBackupLog2\nWITH\
    \ RECOVERY, STOPAT = '4/1/2009'\n```\n\n## 实验内容3：备份和恢复\n\n用Transact-SQL完成以下操作\n\
    \n- (1) 创建一个备份设备。\n- (2) 完整备份“学生-课程数据库”到备份设备。\n- (3) 向Student表插入一条记录。\n- (4) 备份数据库事务日志到备份设备。\n\
    - (5) 利用第2步所得的完整备份，恢复到插入记录前的状态。\n- (6) 利用第4步所得的事务日志，恢复到插入记录后的状态。\n\n## 实验3提交\n\
    \n- 提交内容\n  - 实验内容1（安全性）+ 实验内容2（完整性）+ 实验内容3（备份和恢复）\n\n- 12月15日晚12:00前发到助教邮箱\n\
    \  - xiaoping2367@yahoo.com.cn\n\n命名格式： 学号+姓名+实验N.rar\n"
