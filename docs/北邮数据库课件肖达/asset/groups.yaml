  - '[PAGE 33]


    # # DBMS的主要功能


    +   - **数据定义功能**

    +     - 提供数据定义语言(DDL)，及其翻译处理程序

    +     - 定义数据库中的数据对象

    +   - **数据操纵功能**

    +     - 提供数据操纵语言(DML)，及其编译程序

    +     - 操纵数据实现对数据库的基本操作(查询、插入、删除和修改)

    +   - **数据组织、存储和管理**

    +     - 分类组织、存储和管理各种数据

    +     - 确定组织数据的文件结构和存取方式

    +     - 实现数据之间的联系

    +     - 提供多种存取方法提高存取效率'
  - '[PAGE 34]


    # DBMS的主要功能


