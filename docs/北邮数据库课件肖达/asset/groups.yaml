    \ | 关系Course | ALL | 不能 |\n| DBA | U3 | 关系Student | ALL | 不能 |\n| DBA | U3 | 关系Course\
    \ | ALL | 不能 |\n| DBA | PUBLIC | 关系SC | SELECT | 不能 |\n| DBA | U4 | 关系Student\
