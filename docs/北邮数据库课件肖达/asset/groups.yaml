    # 数据库完整性


    +   数据库的完整性

    +     - 数据的正确性和相容性


    +   数据的完整性和安全性是两个不同概念

    +     - 数据的完整性

    +       - 防止数据库中存在不符合语义的数据，也就是防止数据库中存在不正确的数据

    +       - 防范对象：不合语义的、不正确的数据

    +     - 数据的安全性

    +       - 保护数据库防止恶意的破坏和非法的存取

    +       - 防范对象：非法用户和非法操作'
