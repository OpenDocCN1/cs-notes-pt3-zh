    \ Sname | Sage |\n|---|---:|\n| 王敏 | 18 |\n| 张立 | 19 |\n\n执行过程：\n\n+   1. RDBMS执行此查询时，首先处理子查询，找出CS系中所有学生的年龄，构成一个集合(20，19)\n\
    +   2. 处理父查询，找所有不是CS系且年龄小于20或19的学生\n\n## 用聚集函数实现[例42]\n\n```\nSELECT Sname, Sage\n\
    FROM   Student\nWHERE  Sage <\n       (SELECT MAX(Sage)\n        FROM Student\n\
    \        WHERE Sdept = 'CS')\nAND    Sdept <> 'CS';\n```\n\n## 带有EXISTS谓词的子查询(续)\n\
    \n+   - 用嵌套查询\n+   \n+     ```sql\n+     SELECT Sname\n+     FROM Student\n+ \
    \    WHERE EXISTS\n+           (SELECT *\n+            FROM SC\n+            WHERE\
