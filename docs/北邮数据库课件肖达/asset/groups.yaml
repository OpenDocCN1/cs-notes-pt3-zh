  - "[PAGE 220]\n\n# 3. 关系（Relation）\n\n+   - $D_1, D_2, \\ldots, D_n$ 的笛卡尔积的某个子集才有实际含义\n\
    \n例：表2.1的笛卡尔积没有实际意义\n\n取出有实际意义的元组构造关系\n\n关系：SAP(SUPERVISOR，SPECIALITY，POSTGRADUATE)\n\
    \n假设：导师与专业：1:1，导师与研究生：1:n\n\n主码：POSTGRADUATE（假设研究生不会重名）\n\nSAP关系可以包含三个元组\n\n{（张清玫，计算机专业，李勇），\n\
    \  （张清玫，计算机专业，刘晨），\n  （刘逸，信息专业，王敏）}"
  - '[PAGE 221]


    # 关系（续）


    1) 关系

    D₁ × D₂ × … × Dₙ 的子集叫做在域 D₁，D₂，…，Dₙ 上的关系，表示为

    R（D₁，D₂，…，Dₙ）


    +   - R: 关系名

    +   - n: 关系的目或度（Degree）


    2) 元组

    关系中的每个元素是关系中的元组，通常用 t 表示。


    3) 单元关系与二元关系

    当 n=1 时，称该关系为单元关系（Unary relation）或一元关系

    当 n=2 时，称该关系为二元关系（Binary relation）'
  - '[PAGE 222]


    # 关系（续）


    4) 关系的表示


    关系也是一个二维表，表的每行对应一个元组，表的每列对应一个域


    表 2.2　SAP 关系


    | SUPERVISOR | SPECIALITY | POSTGRADUATE |

    |---|---|---|

    | 张清玫 | 信息专业 | 李勇 |

    | 张清玫 | 信息专业 | 刘晨 |

    | 刘逸 | 信息专业 | 王敏 |


    5) 属性


    关系中不同列可以对应相同的域

    为了加以区分，必须对每列起一个名字，称为属性（Attribute）

    n目关系必有n个属性'
  - '[PAGE 223]


    # 关系（续）


    6) 码


    # 候选码（Candidate key）


    若关系中的某一属性组的值能唯一地标识一个元组，则称该属性组为候选码


    简单的情况：候选码只包含一个属性


    # 全码（All-key）


    最极端的情况：关系模式的所有属性组是这个关系模式的候选码，称为全码（All-key）


    # 主码


    若一个关系有多个候选码，则选定其中一个为主码（Primary key）


    # 主属性


    候选码的诸属性称为主属性（Prime attribute）


    不包含在任何候选码中的属性称为非主属性（Non-Prime attribute）或非码属性（Non-key attribute）'
  - '[PAGE 224]


    # 关系（续）


    7) 三类关系


    基本关系（基本表或基表）


    实际存在的表，是实际存储数据的逻辑表示


    查询表


    查询结果对应的表


    视图表


    由基本表或其他视图表导出的表，是虚表，不对应实际存储的数据'
  - '[PAGE 225]


    # 关系（续）


    8)基本关系的性质


    +   ① 列是同质的（Homogeneous）

    +   ② 不同的列可出自同一个域

    +     - 其中的每一列称为一个属性

    +     - 不同的属性要给予不同的属性名

    +   ③ 列的顺序无所谓，列的次序可以任意交换

    +   ④ 任意两个元组的候选码不能相同

    +   ⑤ 行的顺序无所谓，行的次序可以任意交换

    +   ⑥ 分量必须取原子值

    +     这是规范条件中最基本的一条'
