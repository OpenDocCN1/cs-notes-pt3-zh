    - R与S的除运算得到一个新的关系P（X），P是R中满足下列条件的元组在X属性列上的投影：元组在X上分量值x的象集Yx包含S在Y上投影的集合。记作：\n \
    \ - $R \\div S = \\{ t_r[X] | t_r \\in R \\land \\Pi_Y(S) \\subseteq Y_x \\}$\n\
