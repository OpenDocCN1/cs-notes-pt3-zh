  - '[PAGE 480]


    # 索引


    +   - RDBMS中索引一般采用B+树、HASH索引来实现

    +     - B+树索引具有动态平衡的优点

    +     - HASH索引具有查找速度快的特点

    +   - 采用B+树，还是HASH索引 则由具体的RDBMS来决定

    +   - 索引是关系数据库的内部实现技术，属于内模式的范畴

    +   - CREATE INDEX语句定义索引时，可以定义索引是唯一索引、非唯一索引或聚簇索引'
  - '[PAGE 481]


    # 一、建立索引


    +   语句格式


    ```

    CREATE [UNIQUE] [CLUSTER] INDEX <索引名>

    ON <表名>(<列名>[<次序>][,<列名>[<次序>]]...);

    ```


    [例13] CREATE CLUSTER INDEX Stusname

    ON Student(Sname);


