  - '[PAGE 161]


    # 外模式（续）


    +   - 外模式的地位：介于模式与应用之间

    +     - 模式与外模式的关系：一对多

    +       - 外模式通常是模式的子集

    +       - 一个数据库可以有多个外模式。反映了不同的用户的应用需求、看待数据的方式、对数据保密的要求

    +       - 对模式中同一数据，在外模式中的结构、类型、长度、保密级别等都可以不同

    +     - 外模式与应用的关系：一对多

    +       - 同一外模式也可以为某一用户的多个应用系统所使用

    +       - 但一个应用程序只能使用一个外模式


    +   - 外模式的用途

    +     - 保证数据库安全性的一个有力措施

    +     - 每个用户只能看见和访问所对应的外模式中的数据'
  - '[PAGE 162]


    # 三、内模式（Internal Schema


    +   - 内模式（也称存储模式）

    +     - 是数据物理结构和存储方式的描述

    +     - 是数据在数据库内部的表示方式

    +     - 记录的存储方式（顺序存储，按照B树结构存储，按hash方法存储）

    +     - 索引的组织方式

    +     - 数据是否压缩存储

    +     - 数据是否加密

    +     - 数据存储记录结构的规定


    +   - 一个数据库只有一个内模式'
