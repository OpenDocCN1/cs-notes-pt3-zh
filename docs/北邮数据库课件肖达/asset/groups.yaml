    New Zealand  \nZealand  \nScenic Tours\n\n休息一会儿。。。\n\nDarling.  \nWe were meant\
    \ to be !\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_935_1.png)\n\n## 要求的章节\n\
    \n- 第一章\n- 第二章\n  - 不含2.5节\n- 第三章\n- 第四章\n  - 不含4.1、4.2.6、4.4、4.5、4.6节\n- 第五章\n\
    \  - 不含5.5、5.6节\n- 第六章\n  - 不含6.3、6.4.2、6.4.3节\n- 第七章\n  - 不含7.5、7.6节\n- 第十章\n\
    - *实验\n\n## 重点\n\n- 理解和简单应用\n  - 基本概念（第一章为主、第二、四、五、十章）\n- 综合应用\n  - 关系代数（第二章）\n\
    \  - SQL（第三章）\n  - 规范化（第六章）\n  - 概念结构和逻辑结构设计（第七章）\n\n## 基本概念\n\n- 数据管理技术的3个阶段\n\
    - 数据库系统的特点\n- 实体型之间的联系\n- 三种逻辑数据模型的特点\n- 三级模式和二级映像\n- 关系的三类完整性约束\n- 事务\n- 数据库恢复的实现技术\n\
    \n## 综合应用\n\n- 关系代数\n  - 难点：重命名运算\n- SQL\n  - 难点：相关子查询、用EXIST谓词表示全称量词\n- 规范化\n\
