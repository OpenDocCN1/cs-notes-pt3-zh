  - "[PAGE 741]\n\n# 关系模式的形式化定义\n\n关系模式由五部分组成，即它是一个五元组：\n\n**R(U, D, DOM, F)**\n\n\
    +   R：关系名\n+   \n+   U：组成该关系的属性名集合\n+   \n+   D：属性组U中属性所来自的域\n+   \n+   DOM：属性向域的映象集合\n\
    +   \n+   F：属性间数据的依赖关系集合\n\n简化为一个二元组：\n\n**(R, F)**"
  - '[PAGE 742]


    # 什么是数据依赖


    +   客观世界中事物间的联系：

    +   - 实体与实体的联系 —— 数据模型

    +   - 实体内部属性间的联系 —— 数据依赖


    +   属性间的联系分为三类：

    +   - 一对一

    +   - 一对多

    +   - 多对多


    数据依赖：关系中属性值之间相互依赖相互制约的联系。


    +   属性间的数据依赖类型主要有两种：

    +   - 函数依赖

    +   - 多值依赖'
