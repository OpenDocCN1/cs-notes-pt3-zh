    | --- | --- | --- | --- | --- | --- |\n| 2004 | 2.00 | 512 | 60 | 13.3 | 1150\
    \ |\n| 2005 | 2.16 | 1024 | 120 | 17.0 | 2500 |\n\n查询至少出现在两种PC中的硬盘容量。\n\n```\n\
    π_PC1.hd (ρ_PC1(PC) ▷◁_PC1.hd = PC2.hd ∧ PC1.model ≠ PC2.model ρ_PC2(PC))\n```\n\
