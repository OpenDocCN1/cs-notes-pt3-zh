    # 一、定义基本表


    CREATE TABLE <表名>


    ```

    （<列名> <数据类型>[ <列级完整性约束条件> ]

    [, <列名> <数据类型>[ <列级完整性约束条件> ]]...

    [, <表级完整性约束条件> ]）；

    ```


    如果完整性约束条件涉及到该表的多个属性列，则必须定义在表级上，否则既可以定义在列级也可以定义在表级。'
