  - "[PAGE 630]\n\n# 定义触发器(续)\n\n[例19]（续）\n\n```\nCREATE TRIGGER Insert_Sal\nAFTER\
    \ INSERT ON Teacher    /*触发事件是INSERT*/\nFOR EACH ROW\nAS BEGIN\n    INSERT INTO\
    \ Sal_log VALUES( new.Eno, new.Sal,\n                                CURRENT_USER,\
    \ CURRENT_TIMESTAMP);\nEND;\n```\n\n```\nCREATE TRIGGER Update_Sal\nAFTER UPDATE\
    \ ON Teacher    /*触发事件是UPDATE */\nFOR EACH ROW\nAS BEGIN\n    IF (new.Sal <> old.Sal)\
    \ THEN INSERT INTO Sal_log VALUES(\n        new.Eno, new.Sal, CURRENT_USER, CURRENT_TIMESTAMP);\n\
    \    END IF;\nEND;\n```"
  md: "\n## 数据库完整性\n\n- 实体完整性\n- 参照完整性\n- 用户定义的完整性\n- 完整性约束命名子句\n- 触发器\n- 小结\n\n##\
