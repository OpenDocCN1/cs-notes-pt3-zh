  mdcn: "\n\n## Amazon SimpleDB\n\nAmazon SimpleDB 是一种 Web 服务，提供云中数据索引和查询的核心数据库功能。\n\
    \n- **传统关系型数据库**\n  - 需要大量的前期资本投入\n  - 设计复杂\n  - 通常需要大量且重复的数据库管理\n\n- **Amazon\
    \ SimpleDB**\n  - 极其简单，提供简单的存储和访问 API。\n  - 无需模式，自动索引您的数据。\n  - 消除了数据建模、索引维护和性能调优的管理负担。\n\
    \n### SimpleDB 资源示例层次结构\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_192_0.png)\n\
    \n### SimpleDB 和 RDBMS\n\n一对一\n\n- Domain = 存储容器（表）。\n- Item = 通过 ID（主键）访问的表行。\n\
    - Attribute = 表列。\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_193_0.png)\n\n###\
    \ Amazon SimpleDB\n\n| item | description | color | material |\n|------|-------------|-------|----------|\n\
    | 123 | Sweater | Blue, Red |  |\n| 456 | Dress shirt | White, Blue |  |\n| 789\
    \ | Shoes | Black | Leather |\n\n```\nPUT (item, 123), (description, Sweater),\
    \ (color, Blue), (color, Red)\nPUT (item, 456), (description, Dress shirt), (color,\
    \ White), (color, Blue)\nPUT (item, 789), (description, Shoes), (color, Black),\
    \ (material, Leather)\n```\n\n### Query\n\nDomain = MyStore\n['description' =\
    \ 'Sweater']\n\n### SimpleDB 优点\n\n- 简单\n- 灵活（无模式）\n- 可扩展 - 随着以下情况创建新域\n  - 您的数据增长\n\
    \  - 请求吞吐量增加\n- 可靠\n- 价格低廉\n\n### SimpleDB 缺点\n\n- 数据完整性无法保证。\n- 不一致。\n- 聚合操作需要更多编码且会慢得多。\n\
    - 复杂的报表和 *ad hoc* 查询需要 *a lot* 更多编码。\n- 不支持复杂的数据模式。\n\n### Amazon 基础设施服务的应用\n\n\
    - 快速构建 Web 应用的方式\n  - EC2 – 应用逻辑\n  - S3 – 非结构化数据存储\n  - SimpleDB – 结构化数据存储\n\
    \  - SQS – 消息传递\n\n## Google Bigtable\n\n### 动机\n\n- Google 拥有大量（半）结构化数据\n  -\
    \ URL：\n    - 内容、抓取元数据、链接、锚点、pagerank，...\n  - 每用户数据：\n    - 用户偏好设置、最近查询/搜索结果、...\n\
    \  - 地理位置：\n    - 物理实体（商店、餐馆等）、道路、卫星图像数据、用户注释、...\n- 规模很大\n  - 数十亿个 URL，每个页面多个版本（~20K/版本）\n\
    \  - 数亿用户，每秒数千次查询\n  - 100TB+ 卫星图像数据\n  - 450,000 台机器（《纽约时报》估计，2006 年 6 月 14 日）\n\
    \n### 构建块\n\n- Google 文件系统 (SOSP’03)\n- MapReduce (OSDI’04)\n- Chubby 锁服务 (OSDI’06)\n\
    - BigTable (OSDI’06)\n\n### 为什么不直接使用商业数据库？\n\n- 规模对于大多数商业数据库来说过大\n- 即使不是，成本也会非常高\n\
    \  - 内部构建意味着系统可以以低增量成本应用于多个项目\n- 低级存储优化对性能有显著帮助\n  - 在数据库层之上运行要实现起来困难得多\n\n*为\
    \ Google 员工构建大规模系统也很有趣且具有挑战性☺*\n\n### 数据模型：一个大地图\n\n- <Row, Column, Timestamp>\
    \ 三元组作为键 - 查找、插入和删除 API\n- 按行任意“列”\n  - 列族：限定符。族是重量级的，限定符是轻量级的\n  - 列式物理存储 - 行是稀疏的！\n\
    - 不支持关系模型\n  - 无表级完整性约束\n  - 无多行事务\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_202_0.png)\n\
    \n### API\n\n- 元数据操作\n  - 创建/删除表、列族、更改元数据\n- 写入（原子）\n  - Set(): 写入行中的单元格\n  -\
    \ DeleteCells(): 删除行中的单元格\n  - DeleteRow(): 删除行中的所有单元格\n- 读取\n  - Scanner: 读取\
    \ Bigtable 中的任意单元格\n    - 每次行读取都是原子的\n    - 可以将返回的行限制为特定范围\n    - 可以请求仅 1 行的数据、所有行等。\n\
    \    - 可以请求所有列、仅特定列族或特定列\n\n"
