    - ◆ 如果不满足则操作被拒绝执行\n\n## 数据库完整性\n\n实体完整性\n\n参照完整性\n\n用户定义的完整性\n\n完整性约束命名子句\n\n\
    触发器\n\n小结\n\n### 完整性约束命名子句(续)\n\n【例10】 建立学生登记表Student，要求学号在90000~99999之间，姓名不能为空值，年龄小于30，性别只能是“男”或“女”。\n\
