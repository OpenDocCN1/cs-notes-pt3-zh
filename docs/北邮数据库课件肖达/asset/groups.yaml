    # 4. 笛卡尔积（Cartesian Product）


    +   - 严格地讲应该是广义的笛卡尔积（Extended Cartesian Product）

    +   - R: $n$目关系，$k_1$个元组

    +   - S: $m$目关系，$k_2$个元组

    +   - $R \times S$

    +     - 列：（$n+m$）列元组的集合

    +       - 元组的前$n$列是关系$R$的一个元组

    +       - 后$m$列是关系$S$的一个元组

    +     - 行：$k_1 \times k_2$个元组

    +       - $R \times S = \{t_r t_s | t_r \in R \land t_s \in S\}$'
