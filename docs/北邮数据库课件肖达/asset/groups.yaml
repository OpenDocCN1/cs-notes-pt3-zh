    \n遵循两个准则，进行如下调整：\n\n- 订单与订单细节是1：n的关系，订单细节上升为实体\n- 原订单和产品的联系实际上是订单细节和产品的联系。\n-\
    \ 工厂对大宗订货给予优惠\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_866_0.png)\n\n得到分E-R图\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_867_0.png)\n\n分E-R图的框架\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_867_1.png)\n\
    \n销售管理子系统的分E-R图\n\n对每个实体定义的属性如下：\n\n- 顾客：{顾客号，顾客名，地址，电话，信贷状况，账目余额}\n\n- 订单：{订单号，顾客号，订货项数，订货日期，交货日期，工种号，生产地点}\n\
    \n- 订单细则：{订单号, 细则号, 零件号, 订货数, 金额}\n\n- 应收账款：{顾客号, 订单号, 发票号, 应收金额, 支付日期, 支付金额,\
    \ 当前余额, 贷款限额}\n\n- 产品描述：{产品号, 产品名, 单价, 重量}\n\n- 折扣规则：{产品号, 订货量, 折扣}\n\n## 视图的集成\n\
    \n各个局部视图即分E-R图建立好后，还需要对它们进行合并，集成为一个整体的数据概念结构即总E-R图。\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_869_0.png)\n\
    \n## 合并分E-R图，生成初步E-R图\n\n- 各分E-R图存在冲突\n  - 各个分E-R图之间必定会存在许多不一致的地方\n- 合并分E-R图的主要工作与关键\n\
    \  - 合理消除各分E-R图的冲突\n- 冲突的种类\n  - 属性冲突\n  - 命名冲突\n  - 结构冲突\n\n## 2. 命名冲突\n\n###\
    \ 两类命名冲突\n\n- 同名异义：不同意义的对象在不同的局部应用中具有相同的名字\n- 异名同义（一义多名）：同一意义的对象在不同的局部应用中具有不同的名字\n\
    \n## 3. 结构冲突\n\n### 三类结构冲突\n\n- 同一对象在不同应用中具有不同的抽象\n- 同一实体在不同分E-R图中所包含的属性个数和属性排列次序不完全相同\n\
    - 实体之间的联系在不同局部视图中呈现不同的类型\n\n## 消除不必要的冗余，设计基本E-R图\n\n- 基本任务\n  - 消除不必要的冗余，设计生成基本E-R图\n\
    \n可能存在冗余的数据和冗余的实体间联系\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_874_0.png)\n\n\
    ## 冗余\n\n- **冗余的数据**是指可由基本数据导出的数据\n- **冗余的联系**是指可由其他联系导出的联系\n- 冗余数据和冗余联系容易破坏数据库的完整性，给数据库维护增加困难\n\
    - 消除不必要的冗余后的初步E-R图称为基本E-R图\n\n## 消除冗余的方法\n\n### 分析方法\n\n- 根据数据字典中关于数据项之间的逻辑关系\n\
    \n- `Q3 = Q1 × Q2，Q4 ≥ ∑Q5，Q3和Q4冗余，“使用”联系冗余`\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_876_0.png)\n\
    \n## 消除冗余的方法（续）\n\n- 效率VS冗余信息\n  - 需要根据用户的整体需求来确定\n- 若人为地保留了一些冗余数据，则应把数据字典中数据关联的说明作为完整性约束条件\n\
    \  - Q4=∑Q5\n  - 一旦Q5修改后就应当触发完整性检查，对Q4进行修改\n\n## 消除冗余，设计生成基本E-R图实例\n\n### [实例]\
    \ 某工厂管理信息系统的视图集成\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_878_0.png)\n\n工厂物资管理E-R图\n\
    \n## 系统的基本E-R\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_880_0.png)\n\n## 第七章\
    \ 数据库设计\n\n- 7.1 数据库设计概述\n- 7.2 需求分析\n- 7.3 概念结构设计\n- 7.4 逻辑结构设计\n- 7.5 数据库的物理设计\n\
    - 7.6 数据库的实施和维护\n- 7.7 小结\n\n## 逻辑结构设计\n\n### 逻辑结构设计的任务\n\n- 把概念结构设计阶段设计好的基本E-R图转换为与选用DBMS产品所支持的数据模型相符合的逻辑结构\n\
    \n### 逻辑结构设计的步骤\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_883_0.png)\n\n## E-R图向关系模型的转换（续）\n\
    \n### E-R图向关系模型的转换要解决的问题\n\n- 如何将实体型和实体间的联系转换为关系模式\n- 如何确定这些关系模式的属性和码\n\n### 转换内容\n\
    \n- 将E-R图转换为关系模型：将实体、实体的属性和实体之间的联系转换为关系模式。\n\n## E-R图向关系模型的转换（续）\n\n实体型间的联系有以下不同情况：\n\
    \n(1)一个1:1联系可以转换为一个独立的关系模式，也可以与任意一端对应的关系模式合并。\n\n- 转换为一个独立的关系模式\n- 与某一端实体对应的关系模式合并\n\
    \n(2)一个1:n联系可以转换为一个独立的关系模式，也可以与n端对应的关系模式合并。\n\n- 转换为一个独立的关系模式\n- 与n端对应的关系模式合并\n\
    \n## E-R图向关系模型的转换（续）\n\n(3) 一个 m:n 联系转换为一个关系模式。\n\n例，“选修”联系是一个 m:n 联系，可以将它转换为如下关系模式，其中学号与课程号为关系的组合码：\n\
    \n选修（学号，课程号，成绩）\n\n(4) 三个或三个以上实体间的一个多元联系转换为一个关系模式。\n\n例，“讲授”联系是一个三元联系，可以将它转换为如下关系模式，其中课程号、职工号和书号为关系的组合码：\n\
    \n讲授（课程号，职工号，书号）\n\n## E-R图向关系模型的转换（续）\n\n注意：\n\n- 从理论上讲，1:1联系可以与任意一端对应的关系模式合并\n\
    - 但在一些情况下，与不同的关系模式合并效率会大不一样。因此究竟应该与哪端的关系模式合并需要依应用的具体情况而定。\n- 由于连接操作是最费时的操作，所以一般应以尽量减少连接操作为目标。例如，如果经常要查询某个班级的班主任姓名，则将管理联系与教师关系合并更好些。\n\
    \n## E-R图向关系模型的转换（续）\n\n【例】把图7.30中虚线上部的E-R图转换为关系模型\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_889_0.png)\n\
    \n## E-R图向关系模型的转换（续）\n\n部门（部门号，部门名，经理的职工号，...）\n\n> 此关系模式已包含了联系“领导”所对应的关系模式\n\n\
    职工（职工号、部门号，职工名，职务，...）\n\n> 该关系模式已包含了联系“属于”所对应的关系模式\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_890_0.png)\n"
