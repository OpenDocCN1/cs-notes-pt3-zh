  - "[PAGE 126]\n\n+   - Product(maker,model, type)\n+   - Laptop(model, speed, ram,\
    \ hd, screen, price)\n\n查询所有这样的制造商：对于制造商B生产的笔记本所含的内存容量，该制造商所生产的笔记本中都有。\n\n思路：寻找这样的制造商x：不存在这样的内存容量y，制造商B生产的笔记本含有容量y，而制造商x生产的笔记本不含有容量y。\n\
    \n```\nselect DISTINCT x.maker\nfrom Product x\nwhere not exists\n    (select\
    \ *\n    from Laptop y\n    where B in\n        (select P1.maker\n        from\
    \ Product P1, Laptop L1\n        where P1.model=L1.model and L1.ram=y.ram) and\n\
    \        x.maker not in\n        (select P2.maker\n        from Product P2, Laptop\
    \ L2\n        where P2.model=L2.model and L2.ram=y.ram));\n```"
  - "[PAGE 127]\n\n+   - Product(maker, **model**, type)\n+   - Laptop(**model**,\
