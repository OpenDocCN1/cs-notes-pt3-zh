    \n# 三、介质故障\n\n介质故障\n\n称为硬故障，指外存故障\n\n- 磁盘损坏\n- 磁头碰撞\n- 操作系统的某种潜在错误\n- 瞬时强磁场干扰\n\
    \n# 介质故障的恢复\n\n- ◆ 装入数据库发生介质故障前某个时刻的数据副本\n- ◆ 重做自此时始的所有成功事务，将这些事务已提交的结果重新记入数据库\n\
    \n# 四、计算机病毒\n\n- 计算机病毒\n  - 一种人为的故障或破坏，是一些恶作剧者研制的一种计算机程序\n  - 可以繁殖和传播\n- 危害\n\
    \  - 破坏、盗窃系统中的数据\n  - 破坏系统文件\n\n# 故障小结\n\n各类故障，对数据库的影响有两种可能性\n\n- 一是数据库本身被破坏\n\
    - 二是数据库没有被破坏，但数据可能不正确，这是由于事务的运行被非正常终止造成的。\n\n# 10.4 恢复的实现技术\n\n- 恢复操作的基本原理：冗余\n\
    \n利用存储在系统其它地方的冗余数据来重建数据库中已被破坏或不正确的那部分数据\n\n- 恢复机制涉及的关键问题\n\n1. 如何建立冗余数据\n   -\
    \ 数据转储（backup）\n   - 登录日志文件（logging）\n2. 如何利用这些冗余数据实施数据库恢复\n\n# 一、什么是数据转储\n\n\
    - ◆ 转储是指DBA将整个数据库复制到磁带或另一个磁盘上保存起来的过程，备用的数据称为后备副本或后援副本\n\n- ◆ 如何使用\n  - 数据库遭到破坏后可以将后备副本重新装入\n\
    \  - 重装后备副本只能将数据库恢复到转储时的状态\n\n# 二、转储方法\n\n- 1. 静态转储与动态转储\n- 2. 海量转储与增量转储\n\n#\
    \ 静态转储\n\n- 在系统中无运行事务时进行的转储操作\n- 转储开始时数据库处于一致性状态\n- 转储期间不允许对数据库的任何存取、修改活动\n- 优点\n\
    \  - 实现简单\n  - 得到的一定是一个数据一致性的副本\n- 缺点：降低了数据库的可用性\n  - 转储必须等待正运行的用户事务结束\n  - 新的事务必须等转储结束\n\
    \n# 动态转储\n\n- 转储操作与用户事务并发进行\n- 转储期间允许对数据库进行存取或修改\n- 优点\n  - 不用等待正在运行的用户事务结束\n\
    \  - 不会影响新事务的运行\n- 动态转储的缺点\n  - 不能保证副本中的数据正确有效\n  \n  [例]在转储期间的某个时刻Tc，系统把数据A=100转储到磁带上，而在下一时刻Td，某一事务将A改为200。转储结束后，后备副本上的A已是过时的数据了\n\
    \n# 动态转储\n\n利用动态转储得到的副本进行故障恢复\n\n- 需要把动态转储期间各事务对数据库的修改活动登记下来，建立日志文件\n- 后备副本加上日志文件才能把数据库恢复到某一时刻的正确状态\n\
    \n# 2. 海量转储与增量转储\n\n- ◆ 海量转储（完全转储）：每次转储全部数据库\n- ◆ 增量转储：只转储上次转储后更新过的数据\n- ◆ 海量转储与增量转储比较\n\
    \n- 从恢复角度看，使用海量转储得到的后备副本进行恢复往往更方便\n- 但如果数据库很大，事务处理又十分频繁，则增量转储方式更实用更有效\n\n# 10.4\
    \ 恢复的实现技术\n\n# 10.4.1 数据转储\n\n# 10.4.2 登记日志文件\n\n# 一、日志文件的格式和内容\n\n- 什么是日志文件\n\
    \n日志文件(log)是用来记录事务对数据库的更新操作的文件\n\n- 日志文件的格式\n\n- 以记录为单位的日志文件\n- 以数据块为单位的日志文件\n\
    \n# 日志文件的格式和内容（续）\n\n以数据块为单位的日志文件，每条日志记录的内容\n\n- 事务标识（标明是那个事务）\n- 被更新的数据块\n\n\
    # 二、日志文件的作用\n\n- 进行事务故障恢复\n- 进行系统故障恢复\n- 协助后备副本进行介质故障恢复\n\n# 利用静态转储副本和日志文件进行恢复\n\
    \n正常运行\n\n静态转储\n\n运行事务\n\nTa\n\nTb\n\n登记日志文件\n\nTf\n\n恢复\n\n重装后备副本\n\n利用日志文件恢复\n\
    \n继续运行\n\n# 利用静态转储副本和日志文件进行恢复\n\n上图中：\n\n- 系统在 $T_a$ 时刻停止运行事务，进行数据库转储\n- 在 $T_b$\
    \ 时刻转储完毕，得到 $T_b$ 时刻的数据库一致性副本\n- 系统运行到 $T_f$ 时刻发生故障\n- 为恢复数据库，首先由 DBA 重装数据库后备副本，将数据库恢复至\
    \ $T_b$ 时刻的状态\n- 重新运行自 $T_b\\sim T_f$ 时刻的所有更新事务，把数据库恢复到故障发生前的一致状态\n\n# 三、登记日志文件\n\
    \n# 基本原则\n\n- 登记的次序严格按并行事务执行的时间次序\n\n- 必须先写日志文件，后写数据库\n  - 写日志文件操作：把表示这个修改的日志记录写到日志文件\n\
    \  - 写数据库操作：把对数据的修改写到数据库中\n\n# 登记日志文件（续）\n\n# 为什么要先写日志文件\n\n- 写数据库和写日志文件是两个不同的操作，在这两个操作之间可能发生故障\n\
    - 如果先写了数据库修改，而在日志文件中没有登记下这个修改，则以后就无法恢复这个修改了\n- 如果先写日志，但没有修改数据库，按日志文件恢复时只不过是多执行一次不必要的UNDO操作，并不会影响数据库的正确性\n\
    \n"
