    \ | b₃ | c₂ |\n| a₂ | b₂ | c₁ |\n\n**R∪S**\n\n| A | B | C |\n|---|---|---|\n|\
    \ a₁ | b₁ | c₁ |\n| a₁ | b₂ | c₂ |\n| a₂ | b₂ | c₁ |\n| a₁ | b₃ | c₂ |\n\n## 2.\
    \ 差（Difference）\n\n- **R和S**\n  - 具有相同的目 *n*\n  - 相应的属性取自同一个域\n- **R - S**\n \
    \ - 仍为 *n* 目关系，由属于 *R* 而不属于 *S* 的所有元组组成\n    - $R - S = \\{ t | t \\in R \\land\
    \ t \\notin S \\}$\n\n**R**\n\n| A | B | C |\n|---|---|---|\n| $a_1$ | $b_1$ |\
    \ $c_1$ |\n| $a_1$ | $b_2$ | $c_2$ |\n| $a_2$ | $b_2$ | $c_1$ |\n\n**S**\n\n|\
