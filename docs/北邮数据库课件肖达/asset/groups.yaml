    # 10.4 恢复的实现技术


    +   恢复操作的基本原理：冗余


    利用存储在系统其它地方的冗余数据来重建数据库中已被破坏或不正确的那部分数据


    +   恢复机制涉及的关键问题


    +   1. 如何建立冗余数据

    +     - 数据转储（backup）

    +     - 登录日志文件（logging）

    +   2. 如何利用这些冗余数据实施数据库恢复'
