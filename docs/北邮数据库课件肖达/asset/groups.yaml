    Zuppa.com/menu.html\n\n“语言”\n\n“内容”\n\nEN\n\n“<html>…”\n\n## 服务器\n\n- 平板服务器管理平板，每个服务器多个平板。每个平板为\
    \ 100-200 兆\n  - 每个平板仅存在于一个服务器上\n  - 平板服务器拆分过大平板\n\n- 主服务器负责负载均衡和容错\n  - 使用 Chubby\
    \ 监控平板服务器健康状况，重启失败服务器\n  - GFS 复制数据。优先在数据已存在机器上启动平板服务器\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_205_0.png)\n\
