  - '[PAGE 796]


    # 多值依赖的性质


    +   (1) 多值依赖具有对称性

    +   若 X →→ Y，则 X →→ Z，其中 Z = U − X − Y


    +   (2) 多值依赖具有传递性

    +   若 X →→ Y，Y →→ Z，则 X →→ Z − Y


    +   (3) 函数依赖是多值依赖的特殊情况。

    +   若 X → Y，则 X →→ Y。


    +   (4) 若 X →→ Y，X →→ Z，则 X →→ Y ∪ Z。


    +   (5) 若 X →→ Y，X →→ Z，则 X →→ Y ∩ Z。


    +   (6) 若 X →→ Y，X →→ Z，则 X →→ Y - Z，X →→ Z - Y。'
