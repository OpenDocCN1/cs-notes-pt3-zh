    # 删除基本表（续）


    DROP TABLE时，SQL99 与 3个RDBMS的处理策略比较


    | 序号 | 依赖基本表的对象 | 标准及主流数据库的处理方式 | SQL99 |  | Kingbase ES |  | ORACLE 9i |  | MS
    SQL SERVER 2000 |

    |---|---|---|---|---|---|---|---|---|---|

    |  |  |  | R | C | R | C |  | C |  |

    | 1 | 索引 |  | 无规定 |  | √ | √ | √ | √ | √ |

    | 2 | 视图 |  | × | √ | × | √ | √

    保留 | √

    保留 | √

    保留 |

    | 3 | DEFAULT, PRIMARY KEY, CHECK（只含该表的列）NOT NULL 等约束 |  | √ | √ | √ | √ | √ |
    √ | √ |

    | 4 | Foreign Key |  | × | √ | × | √ | × | √ | × |

    | 5 | TRIGGER |  | × | √ | × | √ | √ | √ | √ |

    | 6 | 函数或存储过程 |  | × | √ | √

    保留 | √

    保留 | √

    保留 | √

    保留 | √

    保留 |


    R表示RESTRICT，C表示CASCADE

    ''×''表示不能删除基本表，''√''表示能删除基本表，''保留'' 表示删除基本表后，还保留依赖对象'
