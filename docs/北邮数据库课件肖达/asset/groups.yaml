    - 假设关系代数表达式E是n元的，则表达式：\n\n  `ρₓ(A₁,A₂,…,Aₙ)(E)`\n\n  返回表达式E的结果，并赋给它名字x，同时将E的各属性更名为A₁,\
    \ A₂, …, Aₙ。\n\n## 综合举例：学生-课程数据库\n\n- Student(Sno, Sname, Ssex, Sage, Sdept)\n\
