    # SQL Server的数据库备份和恢复


    +   - 批日志恢复（Bulk-logged Recovery）

    +     - 性能上优于简单恢复和完全恢复模式，能尽可能减少批操作所需要的日志存储空间。

    +   - 说明

    +     - 数据库在创建时具有与 model 数据库相同的恢复模型

    +     - 若要更改默认恢复模型，可使用ALTER DATABASE 更改 model 数据库的恢复模型或使用企业管理器和 ALTER DATABASE命令修改数据库的恢复模型'
  - '[PAGE 724]


