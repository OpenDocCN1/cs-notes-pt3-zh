    \n# 教材及参考书(1)\n# 教材\n- 王珊，萨师煊.\n数据库系统概论(第四版).\n高等教育出版社，2006.5\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_5_0.png)\n\
    \n# 教材及参考书（2）\n# \U0001F4D6 参考书\n- Jeffrey.D.Ullman, Jennifer Widom.  \n  **A\
    \ First Course in Database Systems (3rd Ed).**  \n  机械工业出版社, 2008.8\n- Abraham\
    \ Silberschatz.  \n  **Database System Concepts (5th Ed).**  \n  杨冬青, 唐世渭译. **数据库系统概念(第5版).**\
    \  \n  机械工业出版社, 2006.10\n\n# \U0001F4D6 上机软件\n- Microsoft SQL Server 2005\n- 参考资料：图书馆\
    \ + Google\n\n# 教学大纲\n# 基础与应用\n- 绪论（第一章）\n- 关系数据库（第二章）\n- 关系数据库标准语言SQL（第三章）\n\
    - 数据库保护（第四、五、十章）\n- SQL Server 2005介绍\n\n# 理论与设计\n- 关系数据理论（第六章）\n- 数据库设计（第七章）\n\
    \n# 考核方法\n- 平时成绩 60%\n  - 实验(交实验报告) 40%\n  - 作业+课堂表现 20%\n- 期末开卷考试 40%\n\n# 数据库技术与应用\n\
    # 第一章 绪论\n\n# 第一章 绪论\n## 1.0 引言\n### 1.0.1 数据库技术的发展历史及趋势\n### 1.0.2 当前流行的数据库产品\n\
    \n# 数据库技术的发展历史\n- 产生于上世纪60年代中期，40余年间经历了三代演变：\n  - 第一代：层次、网状数据库技术\n  - 第二代：关系数据库技术\n\
    \  - 第三代：面向新一代应用的数据库技术\n\n# 第一代数据库技术\n- 1969年，Rockwell公司与IBM公司合作研制了基于层次模型的数据管理系统IMS(Information\
    \ Management System)。\n  - 运行在IBM 360系列机上，用于帮助美国国家航空航天局(NASA)管理宏大的“阿波罗登月计划”中的繁琐资料。\n\
    \  - 阿波罗飞船由大约200万个零部件所组成，分散在世界各地制造生产。\n  - IMS目前在NASA仍然在使用。\n\n# 第一代数据库技术(续)\n\
    几乎同时，通用电气公司的Charles Bachman主持设计与实现了网状模型的数据库管理系统IDS(Integrated Data System)。\n\
    IDS于1964年推出后，成为最受欢迎的数据库产品之一，而且它的设计思想和实现技术被后来的许多数据库产品所仿效。\n\n1971年，美国数据系统语言委员会CODASYL下属的数据库任务组DBTG提出的网状数据库模型以及数据定义和数据操纵语言即DDL和DML的规范说明，推出了DBTG报告，成为数据库历史上具有里程碑意义的文献。\n\
    1971年报告之后，又出现了一系列新的版本，如1973、1978、1981年和1984年的修改版本。\nDBTG提出很多重要的基本概念（如三级模式、DBMS、DBA），对后来产生和发展的关系数据库技术有很重要的影响。\n\
    \n# 第二代数据库技术\n- 1970年，IBM公司San Jose实验室的研究员Edgar F.Codd发表了题为“*A Relational Model\
    \ of Data for Large Shared Data Banks*”的论文，提出了**关系数据模型**，开创了关系数据库理论，为关系数据库技术奠定了理论基础。\n\
    \  - 关系数据库以二维表的形式存储数据，而层次和网状数据库采用的是上级指针指向下一级的方式。\n  - 关系模型简单明了，具备坚实的数学基础。对数据库的使用和开发推动很大，使数据库从实验室走向了商用产品。Codd因此获得1981年图灵奖。\n\
    - 70年代是关系数据库理论研究和原型系统开发的时代，代表有：\n  - IBM公司San Jose实验室开发的System R\n  - Berkeley加利福尼亚大学研制的INGRES\n\
    \n# 第二代数据库技术(续)\n- 70年代，关系数据库系统的研究取得了一系列的成绩，主要包括：\n  - 莫定了关系模型的理论基础\n  - 提出了关系数据语言，如关系代数、关系演算、SQL语言、QBE等等。\n\
    \  - 研制了大量的关系数据库系统原型，攻克了系统实现中查询优化、并发控制、故障恢复等一系列关键技术\n- 70年代后期，关系数据库从实验室走向了社会\n\
    \  - 80年代几乎所有新开发的数据库系统均是关系型的。这些商用数据库系统的运行，特别是微机RDBMS的使用，使数据库技术日益广泛地应用到企业管理、情报检索、辅助决策等各个方面。\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_16_0.png)\n\n# 当前主流数据库产品\n# Oracle\n\
    - Oracle公司的产品。Oracle成立于1977年，由Bob Miner、Ed Oates和Larry Ellison共同创建，总部设在加州，是世界第二大的计算机软件供应商。ORACLE系列产品在数据库领域一直居领先地位，在全球的销售份额约占50%。\n\
    - 最新版本：Oracle 11g 系列\n- “软件开发实验室”和Larry Ellison。\n\n# DB2\n- IBM公司的主要产品。80年代初DB2的发展重点放在大型的主机平台,80年代中期后DB2已发展到适用于各种硬件平台。DB2\
    \ 最适于海量数据。在企业级的应用最为广泛，在全球的500家最大的企业中,几乎85%以上用DB2数据库。\n- 最新版本：DB2 V9.7。\n- IBM\
    \ System R vs Oracle\n\n"
