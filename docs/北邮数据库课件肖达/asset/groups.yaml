  - '[PAGE 303]


    # SQL Server发展历程


    +   - 1988年 SQL Server

    +     - 与Sybase共同开发的、运行于OS/2上

    +   - 1993年 SQL Server 4.2

    +     - 一种功能较少的桌面数据库，能够满足小部门数据存储和处理的需求。

    +     - 这是支持Windows NT的第一个服务器版本

    +   - 1994年

    +     - 微软与Sybase终止合作关系

    +   - 1995年 SQL Server 6.05

    +     - 对核心数据库引擎做了重大的改写。

    +   - 1996年 SQL Server 6.5

    +     - SQL Server逐渐显现实力，以至于Oracle推出了运行于NT平台上的7.1版本作为直接的竞争

    +   - 1998年 SQL Server 7.0

    +     - 再一次对核心数据库引擎进行了重大改写。

    +   - 2005年 SQL Server 2005

    +     - 对SQL Server的许多地方进行了改写，例如通过名为集成服务（Integration Service）的工具来加载数据，引入了.NET
    Framework。

    +   - 2008年 SQLServer 2008'
  - '[PAGE 304]


    # SQL Server vs Oracle


    +   - 可扩展性和灵活性

    +     - Oracle有许多部件，非常适宜为大型公司提供大型解决方案。Oracle还非常灵活，允许使用者按需要添加工具，比SQL Server具有更强的适应性。

    +     - 例如，无论用户是否需要使用新的.NET特性，SQL Server 2005都要求用户必须在服务器上安装.NET Framework。

    +   - 使用和开发难度

    +     - 从开发者的角度看来，Oracle在许多方面都算不上是用户友好的，例如它专门的SQL Query工具、XML和Web技术工具

    +     - Oracle比SQL Server安装配置复杂。

    +   - 成本

    +     - SQL Server向来是一次性购买的解决方案，如果购买了正确版本的SQL Server，那么用于分析数据或从一个数据源（如Excel）向SQL
    Server中复制数据的所有工具都将包含于其中。而对于Oracle，必须额外购买所需要的每一个附加特性。'
  - '[PAGE 305]


    # # SQL Server vs Sybase


    +   - Sybase没有图形用户界面前端。


    +   - 虽然Sybase有用于Windows 2000的版本，但它主要还是用在UNIX上。


    +   - 它没有SQL Server那样丰富的命令和特性。SQL Server有更加强大的编程语言，功能也比Sybase强大。'
