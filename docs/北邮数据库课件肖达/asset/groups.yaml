    \ 2 | 数学 |  | 2 |\n| 3 | 信息系统 | 1 | 4 |\n| 4 | 操作系统 | 6 | 3 |\n| 5 | 数据结构 | 7\
    \ | 4 |\n| 6 | 数据处理 |  | 2 |\n| 7 | PASCAL语言 | 6 | 4 |\n\n### SECOND表（Course表）\n\
    \n| Cno | Cname | Cpno | Ccredit |\n|---|---|---|---|\n| 1 | 数据库 | 5 | 4 |\n|\
