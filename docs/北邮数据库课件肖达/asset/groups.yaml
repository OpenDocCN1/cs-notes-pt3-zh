  md: "\n# 删除基本表（续）\n\nDROP TABLE时，SQL99 与 3个RDBMS的处理策略比较\n\n| 序号 | 依赖基本表的对象 | 标准及主流数据库的处理方式\
    \ | SQL99 |  | Kingbase ES |  | ORACLE 9i |  | MS SQL SERVER 2000 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    |  |  |  | R | C | R | C |  | C |  |\n| 1 | 索引 |  | 无规定 |  | √ | √ | √ | √ | √\
    \ |\n| 2 | 视图 |  | × | √ | × | √ | √ 保留 | √ 保留 | √ 保留 |\n| 3 | DEFAULT, PRIMARY\
    \ KEY, CHECK（只含该表的列）NOT NULL 等约束 |  | √ | √ | √ | √ | √ | √ | √ |\n| 4 | Foreign\
    \ Key |  | × | √ | × | √ | × | √ | × |\n| 5 | TRIGGER |  | × | √ | × | √ | √ |\
    \ √ | √ |\n| 6 | 函数或存储过程 |  | × | √ | √ 保留 | √ 保留 | √ 保留 | √ 保留 | √ 保留 |\n\nR表示RESTRICT，C表示CASCADE\n\
    '×'表示不能删除基本表，'√'表示能删除基本表，'保留' 表示删除基本表后，还保留依赖对象\n\n# 索引\n\n- RDBMS中索引一般采用B+树、HASH索引来实现\n\
    \  - B+树索引具有动态平衡的优点\n  - HASH索引具有查找速度快的特点\n- 采用B+树，还是HASH索引 则由具体的RDBMS来决定\n- 索引是关系数据库的内部实现技术，属于内模式的范畴\n\
    - CREATE INDEX语句定义索引时，可以定义索引是唯一索引、非唯一索引或聚簇索引\n\n# 一、建立索引\n\n- 语句格式\n\n```\nCREATE\
    \ [UNIQUE] [CLUSTER] INDEX <索引名>\nON <表名>(<列名>[<次序>][,<列名>[<次序>]]...);\n```\n\n\
    [例13] CREATE CLUSTER INDEX Stusname\nON Student(Sname);\n\n在Student表的Sname（姓名）列上建立一个聚簇索引\n\
    \n- 在最经常查询的列上建立聚簇索引以提高查询效率\n- 一个基本表上最多只能建立一个聚簇索引\n- 经常更新的列不宜建立聚簇索引\n\n# 建立索引（续）\n\
    \n[例14]为学生-课程数据库中的Student， Course， SC三个表建立索引。\n\n```\nCREATE UNIQUE INDEX Stusno\
    \ ON Student(Sno);\nCREATE UNIQUE INDEX Coucno ON Course(Cno);\nCREATE UNIQUE\
    \ INDEX SCno ON SC(Sno ASC, Cno DESC);\n```\n\nStudent表按学号升序建唯一索引\n\nCourse表按课程号升序建唯一索引\n\
    \nSC表按学号升序和课程号降序建唯一索引\n\n# 二、删除索引\n\n- `DROP INDEX <索引名>;`\n\n删除索引时，系统会从数据字典中删去有关该索引的描述。\n\
    \n[例15] 删除Student表的Stusname索引\n\n```\nDROP INDEX Stusname;\n```\n\n# 第三章 关系数据库标准语言SQL\n\
    \n- SQL概述\n- 数据查询\n- 数据定义\n- 数据更新\n- 视图\n\n# 数据更新\n\n- 1. 插入数据\n- 2. 修改数据\n- 3.\
    \ 删除数据\n\n# 一、插入元组\n\n- 语句格式\n  INSERT\n  INTO <表名> [(<属性列1>, <属性列2>...)]\n  VALUES\
    \ (<常量1> [, <常量2>] ... )\n\n- 功能\n- 将新元组插入指定表中\n\n# 插入元组（续）\n\n- INTO子句\n  - 属性列的顺序可与表定义中的顺序不一致\n\
    \  - 没有指定属性列\n  - 指定部分属性列\n- VALUES子句\n  - 提供的値必须与INTO子句匹配\n    - 値的个数\n    -\
    \ 値的类型\n\n# 插入元组（续）\n\n[例1] 将一个新学生元组（学号：200215128；姓名：陈冬；性别：男；所在系：IS；年龄：18岁）插入到Student表中。\n\
    \n```\nINSERT\nINTO Student (Sno, Sname, Ssex, Sdept, Sage)\nVALUES ('200215128',\
    \ '陈冬', '男', 'IS', 18);\n```\n\n[例2] 将学生张成民的信息插入到Student表中。\n\n```\nINSERT\nINTO\
    \ Student\nVALUES ('200215126', '张成民', '男', 18, 'CS');\n```\n\n# 插入元组（续）\n\n[例3]\
    \ 插入一条选课记录('200215128', '1')。\n\n```\nINSERT\nINTO SC(Sno, Cno)\nVALUES ('200215128',\
    \ '1');\n```\n\nRDBMS将在新插入记录的Grade列上自动地赋空值。\n\n或者：\n\n```\nINSERT\nINTO SC\nVALUES\
    \ ('200215128', '1', NULL);\n```\n\n# 二、插入子查询结果\n\n- 语句格式\n  INSERT\n  INTO <表名>\
    \ [(<属性列1> [, <属性列2>...])]\n  子查询;\n- 功能\n  将子查询结果插入指定表中\n\n# 插入子查询结果（续）\n\n-\
    \ INTO子句(与插入元组类似)\n- 子查询\n  - SELECT子句目标列必须与INTO子句匹配\n    - 值的个数\n    - 值的类型\n\
    \n# 插入子查询结果（续）\n\n[例4] 对每一个系，求学生的平均年龄，并把结果存入数据库。\n\n第一步：建表\n\n```\nCREATE TABLE\
    \ Dept_age\n    (Sdept CHAR(15)          /* 系名 */\n     Avg_age SMALLINT);   \
    \   /* 学生平均年龄 */\n```\n\n第二步：插入数据\n\n```\nINSERT\nINTO Dept_age(Sdept, Avg_age)\n\
    \    SELECT Sdept, AVG(Sage)\n    FROM Student\n    GROUP BY Sdept;\n```\n\n#\
    \ 插入子查询结果（续）\n\nRDBMS在执行插入语句时会检查所插元组是否破坏表上已定义的完整性规则\n\n- 实体完整性\n- 参照完整性\n- 用户定义的完整性\n\
    \  - NOT NULL约束\n  - UNIQUE约束\n  - 值域约束\n\n# 数据更新\n\n插入数据\n\n修改数据\n\n删除数据\n\n\
    # 修改数据\n\n- 语句格式\n  UPDATE <表名>\n  SET <列名>=<表达式>[, <列名>=<表达式>]...\n  [WHERE <条件>];\n\
    \n- 功能\n  - 修改指定表中满足WHERE子句条件的元组\n    的指定列值\n\n# 修改数据（续）\n\n[例5] 将学生200215121的年龄改为22岁\n\
    \n```\nUPDATE Student\nSET Sage=22\nWHERE Sno='200215121';\n```\n\n[例6] 将所有学生的年龄增加1岁\n\
    \n```\nUPDATE Student\nSET Sage= Sage+1;\n```\n\n[例7] 将计算机科学系全体学生的成绩置零。\n\n```\n\
    UPDATE SC\nSET Grade=0\nWHERE 'CS'=\n(SELECT Sdept\nFROM Student\nWHERE Student.Sno\
    \ = SC.Sno);\n```\n\n# 修改数据（续）\n\nRDBMS在执行修改语句时会检查修改操作是否破坏表上已定义的完整性规则\n\n- 实体完整性\n\
    - 主码不允许修改\n- 用户定义的完整性\n  - NOT NULL约束\n  - UNIQUE约束\n  - 值域约束\n\n# 数据更新\n\n插入数据\n\
    \n修改数据\n\n删除数据\n\n# 删除数据\n\n- 语句格式\n\n```\nDELETE\nFROM    <表名>\n[WHERE <条件>];\n\
    ```\n\n- 功能\n  - 删除指定表中满足WHERE子句条件的元组\n\n- WHERE子句\n  - 指定要删除的元组\n  - 缺省表示要删除表中的全部元组，表的定义仍在字典中\n"
