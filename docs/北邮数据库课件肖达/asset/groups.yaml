    \  - 数据库安全性、完整性控制等\n- 用户数据库投入运行后，可根据需要随时逐步修改模式，不影响数据的运行。\n- 数据操作符统一\n\n### 2.高度非过程化\n\
    \n- 非关系数据模型的数据操纵语言 “面向过程”，必须指定存取路径\n- SQL只要提出 “做什么”，无须了解存取路径。\n- 存取路径的选择以及SQL的操作过程由系统自动完成。\n\
    \n### 3.面向集合的操作方式\n\n- 非关系数据模型采用面向记录的操作方式，操作对象是一条记录\n- SQL采用集合操作方式\n  - 操作对象、查找结果可以是元组的集合\n\
    \  - 一次插入、删除、更新操作的对象可以是元组的集合\n\n### 4.多种使用方式\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_331_0.png)\n\
    \n- 交互式SQL\n  - 一般DBMS都提供联机交互工具\n  - 用户可直接键入SQL命令对数据库进行操作\n  - 由DBMS来进行解释\n- 嵌入式SQL\n\
    \  - 能将SQL语句嵌入到高级语言（宿主语言）\n  - 使应用程序充分利用SQL访问数据库的能力、宿主语言的过程处理能力\n  - 一般需要预编译，将嵌入的SQL语句转化为宿主语言编译器能处理的语句\n\
    \n### 5.语言简洁，易学易用\n\n- SQL功能极强，完成核心功能只用了9个动词。\n\n### 表 3.1 SQL 语言的动词\n\n| SQL\
    \ 功能 | 动词 |\n| --- | --- |\n| 数据查询 | SELECT |\n| 数据定义 | CREATE, DROP, ALTER |\n\
    | 数据操纵 | INSERT, UPDATE, DELETE |\n| 数据控制 | GRANT, REVOKE |\n\n### SQL数据库的体系结构\n\
    \nSQL支持关系数据库三级模式结构\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_334_0.png)\n\n\
    ### SQL的基本概念\n\n- 基本表\n  - 本身独立存在的表\n  - SQL中一个关系就对应一个基本表\n  - 一个(或多个)基本表对应一个存储文件\n\
    \  - 一个表可以带若干索引\n- 存储文件\n  - 逻辑结构组成了关系数据库的内模式\n  - 物理结构是任意的，对用户透明\n- 视图\n  - 从一个或几个基本表导出的表\n\
    \  - 数据库中只存放视图的定义而不存放视图对应的数据\n  - 视图是一个虚表\n  - 用户可以在视图上再定义视图\n\n## 第三章 关系数据库标准语言SQL\n\
    \n- SQL概述\n- 数据查询\n- 数据定义\n- 数据更新\n- 视图\n\n### 数据查询\n\n- 数据查询是数据库应用的核心功能\n- 一个典型的SQL查询表达式的基本结构为\n\
    \  - select 属性名表\n  - from 关系名表\n  - where (条件表达式)\n\nπA₁, A₂, ..., Aₙ(σₚ(r₁ ×\
    \ r₂ × ... × rₘ))\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_337_0.png)\n\n###\
    \ SQL查询表达式的含义\n\n- 对 From 子句中的各关系，作笛卡尔积（×）\n- 对 Where 子句中的逻辑表达式进行选择（σ）运算，找出符合条件的元组\n\
    - 根据 Select 子句中的属性列表，对上述结果作投影（π）操作\n- 结果集：查询操作的对象是关系，结果也是一个关系，是一个动态数据集。\n\n###\
    \ 数据查询\n\n**语句格式**\n\n```\nSELECT [ALL|DISTINCT] <目标列表达式>\n                  \
    \       [, <目标列表达式>] ...\nFROM <表名或视图名>[, <表名或视图名>] ...\n[ WHERE <条件表达式> ]\n[\
    \ GROUP BY <列名1> [ HAVING <条件表达式> ] ]\n[ ORDER BY <列名2> [ ASC|DESC ] ];\n```\n\
    \n### 数据查询\n\n- 单表查询\n- 集合查询\n- 连接查询\n- 嵌套查询\n- Select语句的一般形式\n\n### 单表查询\n\n\
    - 查询仅涉及一个表：\n- 一、选择表中的若干列\n- 二、选择表中的若干元组\n- 三、ORDER BY子句\n- 四、聚集函数\n- 五、GROUP\
    \ BY子句\n\n### 一、 选择表中的若干列\n\n**1、查询指定列**\n\n【例】查询全体学生的学号与姓名。\n\n```\nSELECT Sno,\
    \ Sname\nFROM Student;\n```\n\n【例】查询全体学生的姓名、学号、所在系。\n\n```\nSELECT Sname, Sno,\
    \ Sdept\nFROM Student;\n```\n\n### 2. 查询全部列\n\n- 选出所有属性列：\n  - 在SELECT关键字后面列出所有列名\n\
    \  - 将<目标列表达式>指定为 *\n\n【例】查询全体学生的详细记录。\n\n```\nSELECT Sno, Sname, Ssex, Sage,\
    \ Sdept\nFROM Student;\n```\n\n或\n\n```\nSELECT *\nFROM Student;\n```\n\n### 3.\
    \ 查询经过计算的值\n\nSELECT子句的<目标列表达式>可以为：\n\n- 算术表达式\n- 字符串常量\n- 函数\n- 列别名\n\n### 查询经过计算的值（续）\n\
    \n【例】查全体学生的姓名及其出生年份。\n\n```\nSELECT Sname, 2009-Sage /*假定当年的年份为2009年*/\nFROM Student;\n\
    ```\n\n输出结果：\n\n| Sname | 2009-Sage |\n|---|---:|\n| 李勇 | 1987 |\n| 刘晨 | 1988\
    \ |\n| 王敏 | 1989 |\n| 张立 | 1988 |\n\n"
