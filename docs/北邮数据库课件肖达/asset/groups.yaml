  - '[PAGE 232]


    # 2.1.3 关系数据库


    +   - 关系数据库

    +     - 在一个给定的应用领域中，所有关系的集合构成一个关系数据库

    +   - 关系数据库的类型与值

    +     - 关系数据库的类型: 关系数据库模式

    +       对关系数据库的描述。

    +     - 关系数据库模式包括

    +       - 若干域的定义

    +       - 在这些域上定义的若干关系模式

    +     - 关系数据库的值: 关系模式在某一时刻对应的关系的集合，简称为关系数据库


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_232_0.png)'
