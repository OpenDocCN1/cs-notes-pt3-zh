    ```


    ESCAPE ''\\'' 表示“\\”为换码字符'
  - '[PAGE 360]


    # (5) 涉及空值的查询


    +   谓词： IS NULL 或 IS NOT NULL


    +   “IS” 不能用 “=” 代替


    [例] 某些学生选修课程后没有参加考试，所以有选课记录，但没有考试成绩。查询缺少成绩的学生的学号和相应的课程号。


    ```

    SELECT Sno, Cno

    FROM SC

    WHERE Grade IS NULL

    ```


    [例] 查所有有成绩的学生学号和课程号。


    ```

    SELECT Sno, Cno

    FROM SC

    WHERE Grade IS NOT NULL;

    ```'
