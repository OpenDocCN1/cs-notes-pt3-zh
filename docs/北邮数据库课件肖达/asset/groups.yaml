    +   - 数据的完整性约束条件

    +     - 一组完整性规则的集合。

    +     - 完整性规则：给定的数据模型中数据及其联系所具有的制约和储存规则，用以限定符合数据模型的数据库状态以及状态的变化，以保证数据的正确、有效、相容。


    +   - 数据模型对完整性约束条件的定义

    +     - 反映和规定本数据模型必须遵守的基本的通用的完整性约束条件。

    +       - 例如，关系模型中，任何关系必须满足实体完整性和参照完整性两个条件。

    +     - 提供定义完整性约束条件的机制，以及反映具体应用所涉及的数据必须遵守的特定的语义约束条件。

