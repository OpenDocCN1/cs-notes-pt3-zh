  md: "\n## 1. 并（Union）\n\n- **R和S**\n  - 具有相同的目 n（即两个关系都有 n 个属性）\n  - 相应的属性取自同一个域\n\
    \n- **R∪S**\n  - 仍为 n 目关系，由属于 R 或属于 S 的元组组成\n\n$R∪S=\\{t\\mid t∈R∨t∈S\\}$\n\n\
    **R**\n\n| A | B | C |\n|---|---|---|\n| a₁ | b₁ | c₁ |\n| a₁ | b₂ | c₂ |\n| a₂\
