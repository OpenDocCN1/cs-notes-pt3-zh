    \ |\n| SMALLINT | 短整数 |\n| NUMERIC(p, d) | 定点数，由p位数字（不包括符号、小数点）组成，小数后面有d位数字 |\n\
    | REAL | 取决于机器精度的浮点数 |\n| Double Precision | 取决于机器精度的双精度浮点数 |\n| FLOAT(n) | 浮点数，精度至少为n位数字\
    \ |\n| DATE | 日期，包含年、月、日，格式为YYYY-MM-DD |\n| TIME | 时间，包含一日的时、分、秒，格式为HH:MM:SS |\n\
