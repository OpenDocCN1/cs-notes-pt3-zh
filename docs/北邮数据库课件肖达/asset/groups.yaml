  - "[PAGE 404]\n\n# 嵌套查询\n\n# 嵌套查询概述\n\n+   一个SELECT-FROM-WHERE语句称为一个**查询块**\n\n\
    +   将一个查询块嵌套在另一个查询块的WHERE子句或HAVING短语的条件中的查询称为**嵌套查询**\n\n```\nSELECT Sname  /*外层查询/父查询*/\n\
    FROM Student\nWHERE Sno IN\n      (SELECT Sno     /*内层查询/子查询*/\n       FROM SC\n\
    \       WHERE Cno='2');\n```"
  - '[PAGE 405]


    # 嵌套查询(续)


    +   - 子查询的限制

    +     - 不能使用 ORDER BY 子句

    +   - 层层嵌套方式反映了 SQL 语言的结构化

    +   - 有些嵌套查询可以用连接运算替代'
  - '[PAGE 406]


    # 嵌套查询求解方法


    +   - 不相关子查询：

    +     - 子查询的查询条件不依赖于父查询

    +     - 由里向外逐层处理。即每个子查询在上一级查询处理之前求解，子查询的结果用于建立其父查询的查找条件。

    +   - 相关子查询：子查询的查询条件依赖于父查询

    +     - 首先取外层查询中表的第一个元组，根据它与内层查询相关的属性值处理内层查询，若WHERE子句返回值为真，则取此元组放入结果表

    +     - 然后再取外层表的下一个元组

    +     - 重复这一过程，直至外层表全部检查完为止'
