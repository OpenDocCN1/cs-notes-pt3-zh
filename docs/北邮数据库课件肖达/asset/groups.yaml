    ```\n\n# 数据库安全性控制\n\n用户标识与鉴别\n\n存取控制\n\n授权与回收\n\n数据库角色\n\n## 数据库角色\n\n- 数据库角色：被命名的一组与数据库操作相关的权限\n\
