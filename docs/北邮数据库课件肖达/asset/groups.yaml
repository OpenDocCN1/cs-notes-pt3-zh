  - '[PAGE 727]


    # SQL Server的数据库备份和恢复


    # 恢复事务日志


    +   - RESTORE LOG <数据库名>|<@数据库名变量>

    +   - [FROM <备份设备> [...n]]

    +   - [WITH <NORECOVERY>|<RECOVERY>]

    +   - [STOPAT = <日期时间>|<@日期时间变量>]

    +   - 其中

    +     - <日期时间>表示将数据库恢复到该设定时间以前的状态

    +     - 只有在该时间以前的事务日志才会被恢复

    +     - 但若使用了NORECOVERY选项，则不能选定此选项'
  - '[PAGE 728]


    # SQL Server的数据库备份和恢复


    +   - 例：恢复“学生-课程数据库”至2009年4月1日前的状态

    +     - 恢复数据库

    +     - 恢复事务日志1

    +     - 恢复事务日志2


    ```

    RESTORE DATABASE StudentCourse

    FROM MyBackup1

    WITH NORECOVERY

    ```


    ```

    RESTORE LOG StudentCourse

    FROM MyBackupLog1

    WITH NORECOVERY

    ```


    ```

    RESTORE LOG StudentCourse

    FROM MyBackupLog2

    WITH RECOVERY, STOPAT = ''4/1/2009''

    ```'
