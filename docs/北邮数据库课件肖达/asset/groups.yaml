    # 规范化小结（续）


    关系模式规范化的基本步骤


    消除决定属性集非码的非平凡函数依赖


    +   1NF

    +   ↓ 消除非主属性对码的部分函数依赖

    +   2NF

    +   ↓ 消除非主属性对码的传递函数依赖

    +   3NF

    +   ↓ 消除主属性对码的部分和传递函数依赖

    +   BCNF

    +   ↓ 消除非平凡且非函数依赖的多值依赖

    +   4NF'
