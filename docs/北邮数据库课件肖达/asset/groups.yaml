    - 子查询不允许含有ORDER BY子句和DISTINCT短语\n- RDBMS执行CREATE VIEW语句时只是把视图定义存入数据字典，并不执行其中的SELECT语句。\n\
    - 在对视图查询时，按视图的定义从基本表中将数据查出。\n\n### 建立视图（续）\n\n【例1】建立信息系学生的视图。\n\n```sql\nCREATE\
    \ VIEW IS_Student\nAS\nSELECT Sno, Sname, Sage\nFROM Student\nWHERE Sdept= 'IS';\n\
    ```\n\n【例2】建立信息系学生的视图，并要求进行修改和插入操作时仍需保证该视图只有信息系的学生。\n\n```sql\nCREATE VIEW IS_Student\n\
    AS\nSELECT Sno, Sname, Sage\nFROM Student\nWHERE Sdept= 'IS'\nWITH CHECK OPTION;\n\
    ```\n\n### 建立视图（续）\n\n- 带WITH CHECK OPTION选项时对IS_Student视图的更新操作：\n  - 修改操作：自动加上Sdept=\
    \ 'IS'的条件\n  - 删除操作：自动加上Sdept= 'IS'的条件\n  - 插入操作：自动检查Sdept属性值是否为'IS'\n    - 如果不是，则拒绝该插入操作\n\
    \    - 如果没有提供Sdept属性值，则自动定义Sdept为'IS'\n\n### 建立视图（续）\n\n基于多个基表的视图\n\n【例3】建立信息系选修了1号课程的学生视图。\n\
    \n```sql\nCREATE VIEW IS_S1(Sno, Sname, Grade)\nAS\nSELECT Student.Sno, Sname,\
    \ Grade\nFROM Student, SC\nWHERE Sdept= 'IS' AND\nStudent.Sno=SC.Sno AND\nSC.Cno=\
    \ '1';\n```\n\n### 建立视图（续）\n\n基于视图的视图\n\n【例4】建立信息系选修了1号课程且成绩在90分以上的学生的视图。\n\n\
    ```sql\nCREATE VIEW IS_S2\nAS\nSELECT Sno, Sname, Grade\nFROM IS_S1\nWHERE Grade>=90;\n\
    ```\n\n### 建立视图（续）\n\n带表达式的视图\n\n【例5】定义一个反映学生出生年份的视图。\n\n```sql\nCREATE VIEW BT_S(Sno,\
    \ Sname, Sbirth)\nAS\nSELECT Sno, Sname, 2007-Sage\nFROM Student;\n```\n\n###\
    \ 建立视图（续）\n\n分组视图\n\n【例6】将学生的学号及他的平均成绩定义为一个视图。假设SC表中“成绩”列Grade为数字型。\n\n```sql\n\
    CREATE VIEW S_G(Sno, Gavg)\nAS\nSELECT Sno, AVG(Grade)\nFROM SC\nGROUP BY Sno;\n\
    ```\n\n### 建立视图（续）\n\n不指定属性列\n\n【例7】将Student表中所有女生记录定义为一个视图。\n\n```sql\nCREATE\
    \ VIEW F_Student(F_Sno, name, sex, age, dept)\nAS\nSELECT *\nFROM Student\nWHERE\
    \ Ssex='女';\n```\n\n缺点：修改基表Student的结构后，Student表与F_Student视图的映射关系被破坏，导致该视图不能正确工作。\n\
    \n### 二、删除视图\n\n语句的格式：\n\n```sql\nDROP VIEW <视图名>;\n```\n\n- 该语句从数据字典中删除指定的视图定义\n\
    - 如果该视图上还导出了其他视图，使用 CASCADE 级联删除语句，把该视图和由它导出的所有视图一起删除\n- 删除基表时，由该基表导出的所有视图定义都必须显式地使用\
    \ DROP VIEW 语句删除\n\n### 删除视图（续）\n\n【例8】删除视图BT_S：\n\n```sql\nDROP VIEW BT_S;\n\
    ```\n\n删除视图IS_S1：\n\n```sql\nDROP VIEW IS_S1;\n```\n\n- 拒绝执行\n- 级联删除：\n\n```sql\n\
    DROP VIEW IS_S1 CASCADE;\n```\n\n### 定义视图\n\n### 查询视图\n\n### 更新视图\n\n### 查询视图（续）\n\
    \n【例9】在信息系学生的视图中找出年龄小于20岁的学生。\n\n```sql\nSELECT Sno, Sage\nFROM IS_Student\nWHERE\
    \ Sage<20;\n```\n\nIS_Student视图的定义（参见视图定义例1）\n\n视图消解转换后的查询语句为：\n\n```sql\nSELECT\
    \ Sno, Sage\nFROM Student\nWHERE Sdept= 'IS' AND Sage<20;\n```\n\n### 查询视图（续）\n\
    \n- 视图消解法的局限\n  - 有些情况下，视图消解法不能生成正确查询。\n\n### 查询视图（续）\n\n【例11】在S_G视图中查询平均成绩在90分以上的学生学号和平均成绩。\n\
    \n```sql\nSELECT *\nFROM S_G\nWHERE Gavg>=90;\n```\n\nS_G视图的子查询定义：\n\n```sql\n\
    SELECT Sno, AVG(Grade)\nFROM SC\nGROUP BY Sno;\n```\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_520_0.png)\n\
    \n### 查询转换\n\n错误：\n\n```sql\nSELECT Sno, AVG(Grade)\nFROM SC\nWHERE AVG(Grade)>=90\n\
    GROUP BY Sno;\n```\n\n正确：\n\n```sql\nSELECT Sno, AVG(Grade)\nFROM SC\nGROUP BY\
    \ Sno HAVING AVG(Grade)>=90;\n```\n\n### 定义视图\n\n### 查询视图\n\n### 更新视图\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_522_0.png)\n\
    \n### 更新视图\n\n【例12】将信息系学生视图 IS_Student 中学号 200215122 的学生姓名改为“刘晨”。\n\n```sql\n\
    UPDATE IS_Student\nSET Sname='刘晨'\nWHERE Sno='200215122';\n```\n\n转换后的语句：\n\n\
    ```sql\nUPDATE Student\nSET Sname='刘晨'\nWHERE Sno='200215122' AND Sdept='IS';\n\
    ```\n\n### 更新视图（续）\n\n【例13】向信息系学生视图IS_Student中插入一个新的学生记录：200215129，赵新，20岁。\n\n\
    ```sql\nINSERT\nINTO IS_Student\nVALUES ('200215129', '赵新', 20);\n```\n\n转换为对基本表的更新：\n\
    \n```sql\nINSERT\nINTO Student(Sno, Sname, Sage, Sdept)\nVALUES ('200215129',\
    \ '赵新', 20, 'IS');\n```\n\n"
