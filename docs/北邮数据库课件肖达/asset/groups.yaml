    +     - 空值，表示尚未给该学生分配专业

    +     - 非空值，这时该值必须是专业关系中某个元组的“专业号”值，表示该学生不可能分配一个不存在的专业


    +   - 例2：选修（学号，课程号，成绩）

    +     “学号”和“课程号”可能的取值：

    +     - 选修关系中的主属性，不能取空值

    +     - 只能取相应被参照关系中已经存在的主码值'
