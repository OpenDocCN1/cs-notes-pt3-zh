  - '[PAGE 228]


    # 1. 什么是关系模式


    +   - 关系模式（Relation Schema）是型

    +     - 对关系的描述，是静态的、稳定的

    +   - 关系是值

    +     - 关系模式在某一时刻的状态或内容

    +   - 关系模式是对关系的描述

    +     - 元组集合的结构

    +       属性构成

    +       属性来自的域

    +       属性与域之间的映射关系

    +     - 元组语义以及完整性约束条件

    +     - 属性间的数据依赖关系集合'
  - '[PAGE 229]


    # 2. 定义关系模式


    关系模式可以形式化地表示为：


    +   - **R (U, D, DOM, F)**

    +   - *R* 关系名

    +   - *U* 组成该关系的属性名集合

    +   - *D* 属性组*U*中属性所来自的域

    +   - DOM 属性向域的映射集合

    +   - *F* 属性间的数据依赖关系集合


    例：导师和研究生出自同一个域——人，

    取不同的属性名，并在模式中定义属性向域的映射，即说明它们分别出自哪个域：


    DOM（SUPERVISOR-PERSON） = DOM（POSTGRADUATE-PERSON） = PERSON'
  - '[PAGE 230]


    # 定义关系模式（续）


    关系模式通常可以简记为


    $R(U)$ 或 $R(A_1, A_2, \ldots, A_n)$


    +   - $R$：关系名

    +   - $A_1, A_2, \ldots, A_n$：属性名


    注：域名及属性向域的映象常常直接说明为


    属性的类型、长度'
