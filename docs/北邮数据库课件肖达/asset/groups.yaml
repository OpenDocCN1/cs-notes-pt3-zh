    - 完整性约束命名子句\n- 触发器\n- 小结\n\n## 实体完整性定义\n\n- 关系模型的实体完整性\n  - CREATE TABLE中用PRIMARY\
    \ KEY定义\n- 单属性构成的码有两种说明方法\n  - 定义为列级约束条件\n  - 定义为表级约束条件\n- 对多个属性构成的码只有一种说明方法\n\
    \  - 定义为表级约束条件\n\n## 实体完整性定义(续)\n\n[例2] 将SC表中的Sno, Cno属性组定义为码\n\n```\nCREATE TABLE\
    \ SC\n(Sno  CHAR(9) NOT NULL,\nCno  CHAR(4) NOT NULL,\nGrade  SMALLINT,\nPRIMARY\
    \ KEY (Sno, Cno)  /*只能在表级定义主码*/\n);\n```\n\n## 实体完整性检查和违约处理\n\n插入或对主码列进行更新操作时，RDBMS\
    \ 按照实体完整性规则自动进行检查。包括：\n\n- 检查主码值是否唯一，如果不唯一则拒绝插入或修改\n- 检查主码的各个属性是否为空，只要有一个为空就拒绝插入或修改\n\
    \n## 实体完整性检查和违约处理(续)\n\n检查记录中主码值是否唯一的一种方法是进行全表扫描\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_594_0.png)\n\
    \n## 实体完整性检查和违约处理(续)\n\n❖ 另一个是索引\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_595_0.png)\n\
    \n## 数据库完整性\n\n- 实体完整性\n- 参照完整性\n- 用户定义的完整性\n- 完整性约束命名子句\n- 触发器\n- 小结\n\n## 参照完整性定义\n\
    \n关系模型的参照完整性定义\n\n- 在 CREATE TABLE 中用 FOREIGN KEY 短语定义哪些列为外码\n- 用 REFERENCES 短语指明这些外码参照哪些表的主码\n\
    \n## 参照完整性定义(续)\n\n例如，关系SC中一个元组表示一个学生选修的某门课程的成绩，（Sno，Cno）是主码。Sno，Cno分别参照引用Student表的主码和Course表的主码\n\
    \n## [例3] 定义SC中的参照完整性\n\n```\nCREATE TABLE SC\n(Sno  CHAR(9) NOT NULL,\nCno  CHAR(4)\
    \ NOT NULL,\nGrade  SMALLINT,\nPRIMARY KEY (Sno, Cno),  /*在表级定义实体完整性*/\nFOREIGN\
    \ KEY (Sno) REFERENCES Student(Sno),\n/*在表级定义参照完整性*/\nFOREIGN KEY (Cno) REFERENCES\
    \ Course(Cno)\n/*在表级定义参照完整性*/\n);\n```\n\n## 参照完整性检查和违约处理\n\n可能破坏参照完整性的情况及违约处理\n\
    \n| 被参照表（例如Student） | 参照表（例如SC） | 违约处理 |\n|---|---|---|\n| 可能破坏参照完整性 ← 插入元组 |\
    \ 拒绝 |\n| 可能破坏参照完整性 ← 修改外码值 | 拒绝 |\n| 删除元组 → 可能破坏参照完整性 | 拒绝/级连删除/设置为空值 |\n| 修改主码值\
    \ → 可能破坏参照完整性 | 拒绝/级连修改/设置为空值 |\n\n## 违约处理\n\n参照完整性违约处理\n\n- 拒绝(NO ACTION)执行\n\
    \  - 默认策略\n- 级联(CASCADE)操作\n- 设置为空值（SET-NULL）\n  - 对于参照完整性，除了应该定义外码，还应定义外码列是否允许空值\n\
    \n## 违约处理(续)\n\n【例4】 显式说明参照完整性的违约处理示例\n\n```\nCREATE TABLE SC\n    (Sno  CHAR(9)\
    \  NOT NULL,\n     Cno  CHAR(4)  NOT NULL,\n     Grade  SMALLINT,\n     PRIMARY\
    \ KEY (Sno, Cno),\n     FOREIGN KEY (Sno) REFERENCES Student(Sno)\n         ON\
    \ DELETE CASCADE    /*级联删除SC表中相应的元组*/\n         ON UPDATE CASCADE,   /*级联更新SC表中相应的元组*/\n\
    \     FOREIGN KEY (Cno) REFERENCES Course(Cno)\n         ON DELETE NO ACTION\n\
    \         /*当删除course表中的元组造成了与SC表不一致时拒绝删除*/\n         ON UPDATE CASCADE\n    \
    \     /*当更新course表中的cno时，级联更新SC表中相应的元组*/\n    );\n```\n\n"
