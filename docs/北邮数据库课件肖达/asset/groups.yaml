    # 10.2 数据库恢复概述


    +   - 故障是不可避免的

    +     - 系统故障：计算机软、硬件故障

    +     - 人为故障：操作员的失误、恶意的破坏等。


    +   - 数据库的恢复


    把数据库从错误状态恢复到某一已知的正确状态(亦称为一致状态或完整状态)


    恢复子系统是DBMS的一个重要组成部分，而且相当庞大'
