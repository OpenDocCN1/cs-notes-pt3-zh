  - '[PAGE 170]


    # 一、外模式 / 模式映射


    +   - 模式：描述的是数据的全局逻辑结构

    +   - 外模式：描述的是数据的局部逻辑结构

    +   - 同一个模式可以有任意多个外模式

    +   - 每一个外模式，数据库系统都有一个外模式 / 模式映射，定义外模式与模式之间的对应关系

    +   - 映射定义通常包含在各自外模式的描述中'
  - '[PAGE 171]


    # 外模式 / 模式映射（续）


    保证数据的逻辑独立性


    +   > 当模式改变时，数据库管理员修改有关的外模式 / 模式映射，使外模式保持不变


    +   > 应用程序是依据数据的外模式编写的，从而应用程序不必修改，保证了数据与程序的逻辑独立性，简称数据的逻辑独立性。'
  - '[PAGE 172]


    # 二、模式／内模式映象


    +   - 模式／内模式映象定义了数据全局逻辑结构与存储结构之间的对应关系。

    +     - 例如，说明逻辑记录和字段在内部是如何表示的

    +   - 数据库中模式／内模式映象是唯一的

    +   - 该映象定义通常包含在模式描述中'
  - '[PAGE 173]


    # 模式 / 内模式映射（续）


    保证数据的物理独立性


    +   > 当数据库的存储结构改变了（例如选用了另一种存储结构），数据库管理员修改模式 / 内模式映射，使模式保持不变


    +   > 应用程序不受影响。保证了数据与程序的物理独立性，简称数据的物理独立性。'
