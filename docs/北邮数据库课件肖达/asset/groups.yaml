  md: "\n## 三、数据库系统阶段\n\n- 时期\n  - 20世纪60年代末以来\n- 产生的背景\n  - 应用背景 大规模管理\n  - 硬件背景\
    \ 大容量磁盘、磁盘阵列\n  - 软件背景 有数据库管理系统\n  - 处理方式 联机实时处理,分布处理,批处理\n\n## 1.1 数据库系统概述\n\n\
    ### 1.1.1 四个基本概念\n\n### 1.1.2 数据管理技术的产生和发展\n\n### 1.1.3 数据库系统的特点\n\n## 1.1.3 数据库系统的特点\n\
    \n- 数据结构化\n- 数据的共享性高，冗余度低，易扩充\n- 数据独立性高\n- 数据由DBMS统一管理和控制\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_47_0.png)\n\
    \n## 数据结构化\n\n- 整体数据的结构化是数据库的主要特征之一。\n\n- 文件系统\n  > 每个文件内部是有结构的（记录），但记录之间没有联系。\n\
    \n- 关系数据库\n  > 不仅数据内部结构化，整体也是结构化的，数据之间具有联系。\n\n学生文件的记录结构\n\n| 学号 | 姓名 | 性别 | 年龄\
    \ | 院系 | 联系电话 |\n课程文件的记录结构\n\n| 课程号 | 课程名 | 学时数 | 教材名 |\n选课文件的记录结构\n\n| 学号 | 课程号\
    \ | 成绩 |\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_48_0.png)\n\n## 数据的共享性高，冗余度低，易扩展\n\
    \n- 数据库系统从整体角度看待和描述数据，数据面向整个系统，可以被多个用户、多个应用共享使用。\n- 数据共享的好处\n  - 减少数据冗余，节约存储空间\n\
    \  - 避免数据之间的不相容性与不一致性\n  - 使系统易于扩充\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_49_0.png)\n\
    \n## 数据独立性高\n\n- 物理独立性\n  - 指用户的应用程序与存储在磁盘上的数据库中数据是相互独立的。当数据的物理存储改变了，应用程序不用改变。\n\
    \n- 逻辑独立性\n  - 指用户的应用程序与数据库的逻辑结构是相互独立的。数据的逻辑结构改变了，用户程序也可以不变。\n\n- 数据独立性是由DBMS的二级映像功能来保证的\n\
    \n## 数据由DBMS统一管理和控制\n\n- DBMS提供的数据控制功能\n\n- (1)数据的安全性（Security）保护\n  保护数据，以防止不合法的使用造成的数据的泄密和破坏。\n\
    \n- (2)数据的完整性（Integrity）检查\n  将数据控制在有效的范围内，或保证数据之间满足一定的关系。\n\n- (3)并发（Concurrency）控制\n\
    \  对多用户的并发操作加以控制和协调，防止相互干扰而得到错误的结果。\n\n- (4)数据库恢复（Recovery）\n  将数据库从错误状态恢复到某一已知的正确状态。\n\
    \n## 数据库技术与应用\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_52_0.png)\n\n北京邮电大学计算机学院\
    \ 肖达\n\nxiaoda99@gmail.com\n\n## 上节课内容回顾\n\n- **1.0 引言**\n  - 1.0.1 数据库技术的发展历史及趋势\n\
    \  - 1.0.2 当前流行的数据库产品\n\n- **1.1 数据库系统概述**\n  - 1.1.1 四个基本概念\n    - Data、DB、DBMS、DBS\n\
    \  - 1.1.2 数据管理技术的产生和发展\n    - 人工管理 → 文件系统 → 数据库系统\n  - 1.1.3 数据库系统的特点\n    -\
    \ 数据结构化、共享性高、独立性高、由DBMS统一管理\n\n## 1.2 数据模型\n\n### 1.2.1 两大类数据模型\n\n### 1.2.2 数据模型的组成要素\n\
    \n### 1.2.3 概念模型\n\n### 1.2.4 最常用的数据模型\n\n### 1.2.5 层次模型\n\n### 1.2.6 网状模型\n\n\
    ### 1.2.7 关系模型\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_54_0.png)\n\n## 数据模型\n\
    \n- 在数据库中用数据模型这个工具来抽象、表示和处理现实世界中的事物。\n- 通俗地讲数据模型就是现实世界的模拟。\n- 数据模型应满足三方面要求\n \
    \ - 能比较真实地模拟现实世界\n  - 容易为人所理解\n  - 便于在计算机上实现\n\n## 1.2.1 两大类数据模型\n\n- 数据模型分为两类（分属两个不同的层次）\n\
    \  1. **概念模型**：也称信息模型，它是按用户的观点来对数据和信息建模，用于数据库设计。\n  2. **逻辑模型和物理模型**：按计算机系统的观点对数据建模，用于\
    \ DBMS 的实现。\n     - **逻辑模型**主要包括网状模型、层次模型、关系模型、面向对象模型等，按计算机系统的观点对数据建模，用于 DBMS\
    \ 实现。\n     - **物理模型**是对数据最底层的抽象，描述数据在系统内部的表示方式和存取方法，在磁盘或磁带上的存储方式和存取方法。\n\n##\
