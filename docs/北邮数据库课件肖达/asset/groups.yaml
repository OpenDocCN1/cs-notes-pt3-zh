    \ */\n);\n```\n\n### 属性上的约束条件的定义(续)\n\n用CHECK短语指定列值应该满足的条件\n\n[例7] Student表的Ssex只允许取“男”或“女”。\n\
    \n```\nCREATE TABLE Student\n(Sno CHAR(9) PRIMARY KEY,\nSname CHAR(8) NOT NULL,\n\
