  - "[PAGE 694]\n\n# 介质故障的恢复（续）\n\n# ❖ 恢复步骤\n\n+   1. 装入最新的后备数据库副本（离故障发生时刻最近的转储副本），使数据库恢复到最近一次转储时的一致性状态。\n\
    +   \n+   - 对于静态转储的数据库副本，装入后数据库即处于一致性状态\n+   \n+   - 对于动态转储的数据库副本，还须同时装入转储时刻的日志文件副本，利用与恢复系统故障的方法（即\
    \ REDO+UNDO），才能将数据库恢复到一致性状态。"
