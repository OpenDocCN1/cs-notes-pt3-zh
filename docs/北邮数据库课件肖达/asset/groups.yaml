    \ | $b_1$ | $c_1$ |\n\n## 3. 交（Intersection）\n\n- **R和S**\n  - 具有相同的目 n\n  - 相应的属性取自同一个域\n\
    \n- **R∩S**\n  - 仍为 n 目关系，由既属于 R 又属于 S 的元组组成\n\nR∩S = { t | t ∈ R ∧ t ∈ S }\n\n\
