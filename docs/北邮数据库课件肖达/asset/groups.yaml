    # 数据模型


    +   - 在数据库中用数据模型这个工具来抽象、表示和处理现实世界中的事物。

    +   - 通俗地讲数据模型就是现实世界的模拟。

    +   - 数据模型应满足三方面要求

    +     - 能比较真实地模拟现实世界

    +     - 容易为人所理解

    +     - 便于在计算机上实现'
  - '[PAGE 56]


    # 1.2.1 两大类数据模型


    +   - 数据模型分为两类（分属两个不同的层次）

    +     1. **概念模型**：也称信息模型，它是按用户的观点来对数据和信息建模，用于数据库设计。

    +     2. **逻辑模型和物理模型**：按计算机系统的观点对数据建模，用于 DBMS 的实现。

    +        - **逻辑模型**主要包括网状模型、层次模型、关系模型、面向对象模型等，按计算机系统的观点对数据建模，用于 DBMS 实现。

    +        - **物理模型**是对数据最底层的抽象，描述数据在系统内部的表示方式和存取方法，在磁盘或磁带上的存储方式和存取方法。'
