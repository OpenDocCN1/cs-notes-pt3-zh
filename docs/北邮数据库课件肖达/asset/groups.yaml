    # 具有无损连接性的模式分解


    +   关系模式R<U,F>的一个分解 ρ={ R1<U1,F1>, R2<U2,F2>, ..., Rn<Un,Fn>}

    +   若R与R1、R2、...、Rn自然连接的结果相等，则称关系模式R的这个分解ρ具有无损连接性（Lossless join）


    +   具有无损连接性的分解保证不丢失信息


    +   无损连接性不一定能解决插入异常、删除异常、修改复杂、数据冗余等问题'
