    \ − X − Y\n\n- (2) 多值依赖具有传递性\n若 X →→ Y，Y →→ Z，则 X →→ Z − Y\n\n- (3) 函数依赖是多值依赖的特殊情况。\n\
    若 X → Y，则 X →→ Y。\n\n- (4) 若 X →→ Y，X →→ Z，则 X →→ Y ∪ Z。\n\n- (5) 若 X →→ Y，X →→\
