  - '[PAGE 123]


    # 四、关系数据模型的优缺点


    +   - **优点**

    +     - 建立在严格的数学概念的基础上

    +     - 可以描述一对一、一对多和多对多的联系

    +     - 概念单一

    +       - 实体和各类联系都用关系来表示

    +       - 对数据的检索结果也是关系

    +     - 存取路径对用户透明

    +       - 用户只要指出“干什么”，不必详细说明“怎么干”

    +       - 具有更高的数据独立性，更好的安全保密性

    +       - 简化了程序员的工作和数据库建立的工作

    +   - **缺点**

    +     - 存取路径对用户透明导致查询效率往往不如非关系数据模型

    +     - 为提高性能，必须对用户的查询请求进行优化增加了开发DBMS的难度'
