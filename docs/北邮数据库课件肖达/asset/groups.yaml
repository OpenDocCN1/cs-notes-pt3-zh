    # 带有ANY（SOME）或ALL谓词的子查询（续）


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_423_0.png)


    需要配合使用比较运算符


    +   - `> ANY`：大于子查询结果中的某个值

    +   - `> ALL`：大于子查询结果中的所有值

    +   - `< ANY`：小于子查询结果中的某个值

    +   - `< ALL`：小于子查询结果中的所有值

    +   - `>= ANY`：大于等于子查询结果中的某个值

    +   - `>= ALL`：大于等于子查询结果中的所有值

    +   - `<= ANY`：小于等于子查询结果中的某个值

    +   - `<= ALL`：小于等于子查询结果中的所有值

    +   - `= ANY`：等于子查询结果中的某个值

    +   - `= ALL`：等于子查询结果中的所有值（通常没有实际意义）

    +   - `!=（或<>）ANY`：不等于子查询结果中的某个值

    +   - `!=（或<>）ALL`：不等于子查询结果中的任何一个值'
