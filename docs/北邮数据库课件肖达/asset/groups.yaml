    # 数据库应用系统（DBAS）


    +   - DBAS是在DBMS支持下的一类计算机应用系统，是由数据库系统和各种用户应用程序结合而成的。

    +   - 数据库公司以自己的数据库管理系统为平台，针对不同的应用，开发相应的应用程序。

    +   - 例如Oracle的软件产品包括：

    +     - 财务软件（Financial）

    +     - 制造业软件（Manufacturing）

    +     - 人力资源软件（Human Resources）

    +     - 自动控制软件（Oracle Automotive）

    +     - 商业交易系统（Exchange）等。'
