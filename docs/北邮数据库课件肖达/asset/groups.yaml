    \n图1.28 数据库系统的三级模式结构\n\n## 数据库系统结构（续）\n\n## 1.3.1 数据库系统模式的概念\n\n## 1.3.2 数据库系统的三级模式结构\n\
    \n## 1.3.3 数据库的二级映像功能与数据独立性\n\n## 1.3.3 数据库的二级映像功能与数据独立性\n\n- 三级模式是对数据的三个抽象级别\n\
