    \ Search | 4 | 47% | 6 | 93 | 11 | 5% | Yes |\n\n## 数据库技术与应用\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_209_0.png)\n\
    \n北京邮电大学计算机学院 肖达\n\nxiaoda99@gmail.com\n\n## 关系数据库简介\n\n- 1962年CODASYL发表“信息代数”\n\
    - 1968年David Child在IBM 7090机上实现的集合论数据结构\n\n- 系统地、严格地提出关系模型的是美国IBM公司的 **E. F. Codd**\n\
    \  - 1970年提出关系数据模型\n\n    > E.F.Codd, “A Relational Model of Data for Large Shared\
    \ Data Banks”, Communication of the ACM, 1970\n\n  - 之后，提出了关系代数和关系演算的概念\n  - 1972年提出了关系的第一、第二、第三范式\n\
    \  - 1974年提出了关系的BC范式\n\n- Codd生平\n  - 牛津大学主攻数学，毕业后进入IBM，主持多道程序设计系统和流水线计算机研制。\n\
    \  - 年近40岁重返大学，42岁获得博士学位，47岁发表关系数据库论文，58岁获得图灵奖。\n\n## 第二章 关系数据库\n\n- **2.1 关系数据结构及形式化定义**\n\
    - **2.2 关系操作**\n- **2.3 关系代数**\n- **2.4 关系的完整性**\n\n### 2.1 关系数据结构及形式化定义\n\n-\
    \ 2.1.1 关系\n- 2.1.2 关系模式\n- 2.1.3 关系数据库\n\n### 2.1.1 关系\n\n- 单一的数据结构—关系\n\n  现实世界的实体以及实体间的各种联系均用关系来表示\n\
    \n- 逻辑结构—二维表\n\n  从用户角度，关系模型中数据的逻辑结构是一张二维表\n\n- 建立在集合代数的基础上\n\n### 关系 (续)\n\n\
    1. 域（Domain）\n2. 笛卡尔积（Cartesian Product）\n3. 关系（Relation）\n\n### 1. 域（Domain）\n\
    \n域是一组具有相同数据类型的值的集合。例：\n\n- 整数\n- 实数\n- 介于某个取值范围的整数\n- 指定长度的字符串集合\n- {'男'， '女'}\n\
    - ……\n\n### 2. 笛卡尔积（Cartesian Product）\n\n- 笛卡尔积\n\n给定一组域 D₁，D₂，…，Dₙ，这些域中可以有相同的。\n\
    \nD₁，D₂，…，Dₙ 的笛卡尔积为：\n\nD₁ × D₂ × … × Dₙ =\n\n{ (d₁, d₂, …, dₙ) | dᵢ ∈ Dᵢ, i =\
    \ 1, 2, …, n }\n\n- 所有域的所有取值的一个组合\n\n- 不能重复\n\n### 笛卡尔积（续）\n\n- **元组（Tuple）**\n\
    \  - 笛卡尔积中每一个元素 `(d₁, d₂, ⋯, dₙ)` 叫作一个 n 元组（n-tuple）或简称元组（Tuple）\n  - （张清玫，计算机专业，李勇）、（张清玫，计算机专业，刘晨）等都是元组\n\
    \n- **分量（Component）**\n  - 笛卡尔积元素 `(d₁, d₂, ⋯, dₙ)` 中的每一个值 `dᵢ` 叫作一个分量\n  - 张清玫、计算机专业、李勇、刘晨等都是分量\n\
    \n- **基数（Cardinal number）**\n  - 若 `Dᵢ (i=1, 2, ⋯, n)` 为有限集，其基数为 `mᵢ (i=1, 2,\
    \ ⋯, n)`，则 `D₁×D₂×⋯×Dₙ` 的基数 `M` 为：\n\n    `M = ∏ⁿᵢ₌₁ mᵢ`\n\n- **笛卡尔积的表示方法**\n\
    \  - 笛卡尔积可表示为一个二维表\n  - 表中的每行对应一个元组，表中的每列对应一个域\n\n### 笛卡尔积（续）\n\n例：设\n\nD₁为教师集合（T）={t₁,\
    \ t₂}\n\nD₂为学生集合（S）={s₁, s₂, s₃}\n\nD₃为课程集合（C）={c₁, c₂}\n\n则D₁×D₂×D₃是个三元组集合，元组个数为2×3×2，是所有可能的（教师，学生，课程）元组集合\n\
    \n| T | S | C |\n|---|---|---|\n| t₁ | s₁ | c₁ |\n| t₁ | s₁ | c₂ |\n| t₁ | s₂\
    \ | c₁ |\n| ... | ... | ... |\n| t₂ | s₃ | c₂ |\n\n**表 2.1 D₁， D₂， D₃ 的笛卡尔积**\n\
    \n| SUPERVISOR | SPECIALITY | POSTGRADUATE |\n|---|---|---|\n| 张清玫 | 计算机专业 | 李勇\
    \ |\n| 张清玫 | 计算机专业 | 刘晨 |\n| 张清玫 | 计算机专业 | 王敏 |\n| 张清玫 | 信息专业 | 李勇 |\n| 张清玫 |\
    \ 信息专业 | 刘晨 |\n| 张清玫 | 信息专业 | 王敏 |\n| 刘逸 | 计算机专业 | 李勇 |\n| 刘逸 | 计算机专业 | 刘晨 |\n\
    | 刘逸 | 计算机专业 | 王敏 |\n| 刘逸 | 信息专业 | 李勇 |\n| 刘逸 | 信息专业 | 刘晨 |\n| 刘逸 | 信息专业 | 王敏\
    \ |\n\n"
