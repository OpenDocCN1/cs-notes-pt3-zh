    \  - 方法三：设置所属的模式，在创建表时表名中不必给出模式名。\n\n### 模式与表（续）\n\n- 创建基本表（其他数据库对象也一样）时，若没有指定模式，系统根据搜索路径来确定该对象所属的模式\n\
