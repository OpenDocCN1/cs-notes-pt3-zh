    +     - 保证数据的安全性、完整性

    +     - 多用户对数据的并发使用

    +     - 发生故障后的系统恢复

    +   - 数据库的建立和维护功能(实用程序)

    +     - 数据库数据批量装载

    +     - 数据库转储

    +     - 介质故障恢复

    +     - 数据库的重组织

    +     - 性能监视等'
