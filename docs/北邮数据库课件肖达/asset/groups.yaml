    +   - 每一个基本表都属于某一个模式

    +   - 一个模式包含多个基本表

    +   - 定义基本表所属模式

    +     - 方法一：在表名中明显地给出模式名

    +       ```sql

    +       Create table “S-T”.Student（……）； /*模式名为 S-T*/

    +       Create table “S-T”.Cource（……）；

    +       Create table “S-T”.SC（……）；

    +       ```

    +     - 方法二：在创建模式语句中同时创建表

    +     - 方法三：设置所属的模式，在创建表时表名中不必给出模式名。'
