    \ 为预防介质故障，DBA必须周期性地转储数据库\n\n+   提高数据库可用性的解决方案\n+   - 数据库镜像（Mirror）\n\n### 数据库镜像（续）\n\
    \n# 数据库镜像\n\n+   - DBMS自动把整个数据库或其中的关键数据复制到另一个磁盘上\n+   - DBMS自动保证镜像数据与主数据库的一致性\n\
    \n每当主数据库更新时，DBMS自动把更新后的数据复制过去（如下图所示）\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_709_0.png)\n\
