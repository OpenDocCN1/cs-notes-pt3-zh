    +     - 安全性与完整性要求


    ## 需求分析的方法


    结构化分析方法（Structured Analysis，简称SA方法）


    +   - 从最上层的系统组织机构入手

    +   - 自顶向下、逐层分解分析系统


    1. 首先把任何一个系统都抽象为：


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_834_0.png)


    ## 进一步分析和表达用户需求（续）


    +   2. 分解处理功能和数据

    +   (1)分解处理功能

    +     ➢ 将处理功能的具体内容分解为若干子功能

    +   (2)分解数据

    +     ➢ 处理功能逐步分解同时，逐级分解所用数据，形成若干层次的数据流图

    +   (3)表达方法

    +     ➢ 处理逻辑：用判定表或判定树来描述

    +     ➢ 数据：用数据字典来描述

    +   3. 将分析结果再次提交给用户，征得用户的认可


    ## 数据字典


    ## 数据字典的用途


    +   - 进行详细的数据收集和数据分析所获得的主要结果


    ## 数据字典的内容


    +   - 数据项

    +   - 数据结构

    +   - 数据流

    +   - 数据存储

    +   - 处理过程


    ## 数据字典举例


    数据项是不可再分的数据单位


    学生学籍管理子系统 以“学号”为例：


    +   数据项： 学号

    +   含义说明： 唯一标识每个学生

    +   别名： 学生编号

    +   类型： 字符型

    +   长度： 8

    +   取值范围： 00000000至99999999

    +   取值含义： 前两位标别该学生所在年级，后六位按顺序编号


    ## 数据字典举例


    数据结构反映了数据项之间的组合关系。


    以“学生”为例。“学生”是该系统中的一个核心数据结构：


    数据结构： 学生


    含义说明： 是学籍管理子系统的主体数据结构，定义了一个学生的有关信息


    组成： 学号，姓名，性别，年龄，所在系，年级


    ## 数据字典举例


    数据流是数据结构在系统内传输的路径。


    “体检结果”可如下描述：


    +   数据流： 体检结果

    +   说明： 学生参加体格检查的最终结果

    +   数据流来源： 体检

    +   数据流去向： 批准

    +   组成： ……

    +   平均流量： ……

    +   高峰期流量： ……


    ## 数据字典举例


    数据存储是数据结构停留或保存的地方


    “学生登记表”可如下描述：

    数据存储： 学生登记表

    说明： 记录学生的基本情况

    流入数据流： ……

    流出数据流： ……

    组成： ……

    数据量： 每年3000张

    存取方式： 随机存取


    ## 第七章 数据库设计


    +   7.1 数据库设计概述

    +   7.2 需求分析

    +   7.3 概念结构设计

    +   7.4 逻辑结构设计

    +   7.5 数据库的物理设计

    +   7.6 数据库实施和维护

    +   7.7 小结


    ## 概念结构


    ## 什么是概念结构设计


    +   - 将需求分析得到的用户需求抽象为信息结构即概念模型的过程就是概念结构设计

    +   - 概念结构是各种数据模型的共同基础，它比数据模型更独立于机器、更抽象，从而更加稳定

    +   - 概念结构设计是整个数据库设计的关键


    ## 概念结构（续）


    ## 概念结构设计的特点


    +   (1) 能真实、充分地反映现实世界

    +   (2) 易于理解

    +   (3) 易于更改

    +   (4) 易于向关系、网状、层次等各种数据模型转换


    ## 描述概念模型的工具


    +   - E-R模型


    ## 概念结构设计的方法与步骤


    ❖ 设计概念结构的四类方法


    +   - 自顶向下

    +     - ➤ 首先定义全局概念结构的框架，然后逐步细化


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_845_0.png)


    ## 概念结构设计的方法与步骤


    +   自底向上


    首先定义各局部应用的概念结构，然后将它们集成起来，得到全局概念结构


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_846_0.png)


    ## 概念结构设计的方法与步骤（续）


    ## 逐步扩张


    ➢ 首先定义最重要的核心概念结构，然后向外扩充，以滚雪球的方式逐步生成其他概念结构，直至总体概念结构


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_847_0.png)


    逐步扩张策略


    ## 概念结构设计的方法与步骤（续）


    ## 混合策略


    +   将自顶向下和自底向上相结合，用自顶向下策略设计一个全局概念结构的框架，以它为骨架集成由自底向上策略中设计的各局部概念结构。


    ## 概念结构设计的方法与步骤（续）


    常用策略


    +   - 自顶向下地进行需求分析、自底向上地设计概念结构


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_849_0.png)


    ## 概念结构设计的方法与步骤（续）


    ## 自底向上设计概念结构的步骤


    +   第1步：抽象数据并设计局部视图

    +   第2步：集成局部视图，得到全局概念结构


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_850_0.png)


    ## 数据抽象


    抽象是对实际的人、物、事和概念中抽取所关心的共同特性，忽略非本质的细节，并把这些特性用各种概念精确地加以描述。


    +   概念结构是对现实世界的一种抽象


    ## 数据抽象（续）


    三种常用抽象


    ## 1. 分类（Classification）


    +   - 定义某一类概念作为现实世界中一组对象的类型

    +   - 抽象了对象值和型之间的 “is member of”的语义


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_852_0.png)


    ## 数据抽象（续）


    ## 2. 聚集（Aggregation）


    +   - 定义某一类型的组成成分

    +   - 抽象了对象内部类型和成分之间“is part of”的语义


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_853_0.png)


    ## 数据抽象（续）


    ## 3. 概括（Generalization）


    +   - 定义类型之间的一种子集联系

    +   - 抽象了类型之间的“is subset of”的语义

    +   - 继承性


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_854_0.png)


    ## 局部视图设计


    设计分E-R图的步骤：


    +   1. 选择局部应用

    +   2. 逐一设计分E-R图


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_855_0.png)


    ## 1. 选择局部应用


    +   在多层的数据流图中选择一个适当层次的数据流图，作为设计分E-R图的出发点


    +   通常以中层数据流图作为设计分E-R图的依据


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_856_0.png)


    ## 2. 逐一设计分E-R图


    ## 任务


    +   - 将各局部应用涉及的数据分别从数据字典中抽取出来

    +   - 参照数据流图，标定各局部应用中的实体、实体的属性、标识实体的码

    +   - 确定实体之间的联系及其类型（1:1，1:n，m:n）


    ## 逐一设计分E-R图


    +   如何抽象实体和属性

    +     - 实体

    +       - 现实世界中一组具有某些共同特性和行为的对象就可以抽象为一个实体。对象和实体之间是 “is member of” 的关系。

    +       - 例：在学校环境中，可把张三、李四等对象抽象为学生实体。

    +     - 属性

    +       - 对象类型的组成成分可以抽象为实体的属性。组成成分与对象类型之间是 “is part of” 的关系。

    +       - 例：学号、姓名、专业、年级等可以抽象为学生实体的属性。其中学号为标识学生实体的码。


    '
