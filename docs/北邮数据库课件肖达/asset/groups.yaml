  - '[PAGE 292]


    # 2. 外码（Foreign Key）


    +   设*F*是基本关系*R*的一个或一组属性，但不是关系*R*的码。如果F与基本关系S的主码Kₛ相对应，则称F是基本关系*R*的外码


    +   基本关系*R*称为参照关系（Referencing Relation）


    +   基本关系S称为被参照关系（Referenced Relation）或目标关系（Target Relation）'
  - '[PAGE 293]


    # 外码(续)


    +   - 例1：学生关系的“专业号”与专业关系的主码“专业号”相对应

    +     - “专业号”属性是学生关系的外码

    +     - 专业关系是被参照关系

    +       学生关系 → 专业关系

    +       (a)


    +   - 例2：选修关系的“学号”与学生关系的主码“学号”相对应

    +   - 选修关系的“课程号”与课程关系的主码“课程号”相对应

    +     - “学号”和“课程号”是选修关系的外码

    +       学生关系 ← 学号 选修关系 课程号 → 课程关系

    +       (b)

    +   - 学生关系和课程关系均为被参照关系'
  - '[PAGE 294]


    # 外码(续)


    +   - 例3： “班长” 与本身的主码 “学号” 相对应

    +     - “班长” 是外码

    +     - 学生关系既是参照关系也是被参照关系


    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_294_0.png)'
  - '[PAGE 295]


    # 外码(续)


    +   - 关系R和S不一定是不同的关系

    +   - 目标关系S的主码Kₛ和参照关系的外码F必须定义在同一个（或一组）域上

    +   - 外码并不一定要与相应的主码同名


    当外码与相应的主码属于不同关系时，往往取相同的名字，以便于识别'
  - '[PAGE 296]


    # 3. 参照完整性规则


    # 规则2.2 参照完整性规则


    若属性（或属性组）F是基本关系R的外码，它与基本关系S的主码Kₛ相对应（基本关系R和S不一定是不同的关系），则对于R中每个元组在F上的值必须为：


    +   - 或者取空值（F的每个属性值均为空值）

    +   - 或者等于S中某个元组的主码值'
