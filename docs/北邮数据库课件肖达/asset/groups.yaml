  md: "\n## E-R图向关系模型的转换\n\n## 数据模型的优化\n\n- 得到初步数据模型后，还应该适当地修改、调整数据模型的结构，以进一步提高数据库应用系统的性能，这就是数据模型的优化。\n\
    - 关系数据模型的优化通常以规范化理论为指导。\n\n### 优化数据模型的方法\n\n- 确定数据依赖\n  - 按需求分析阶段所得到的语义，分别写出每个关系模式内部各属性之间的数据依赖以及不同关系模式属性之间数据依赖\n\
    - 消除冗余的联系\n  - 对于各个关系模式之间的数据依赖进行极小化处理，消除冗余的联系。\n\n### 确定所属范式\n\n- 按照数据依赖的理论对关系模式逐一进行分析\n\
    - 考查是否存在部分函数依赖、传递函数依赖、多值依赖等\n- 确定各关系模式分别属于第几范式\n\n按照需求分析阶段得到的各种应用对数据处理的要求，分析对于这样的应用环境这些模式是否合适。\n\
    \n- 确定是否要对它们进行合并或分解。\n\n注意：并不是规范化程度越高的关系就越优，一般说来，第三范式就足够了。\n\n例：在关系模式\n\n学生成绩单(学号,英语,数学,语文,平均成绩)\n\
    \n中存在下列函数依赖：\n\n- 学号→英语\n- 学号→数学\n- 学号→语文\n- 学号→平均成绩\n- (英语, 数学, 语文)→平均成绩\n\n\
    显然有：\n\n学号→(英语,数学,语文)\n\n因此该关系模式中存在传递函数依赖，是2NF关系。\n\n虽然平均成绩可以由其他属性推算出来，但如果应用中需要经常查询学生的平均成绩，为提高效率，仍然可保留该冗余数据，对关系模式不再做进一步分解。\n\
    \n## 第七章 数据库设计\n\n- 7.1 数据库设计概述\n- 7.2 需求分析\n- 7.3 概念结构设计\n- 7.4 逻辑结构设计\n- 7.5\
    \ 数据库的物理设计\n- 7.6 数据库的实施和维护\n- 7.7 小结\n\n### 7.7 小结：数据库的设计过程\n\n- 需求分析\n- 概念结构设计\n\
    - 逻辑结构设计\n- 物理设计\n- 实施和维护\n\n## 作业\n\n1. 教材第7章习题19\n2. 对本课程和教师授课的感受、意见和建议\n\n\
    **提交**\n\n- 时间：2010年1月6日（下周三）\n- 地点：各班课代表收齐后交到主楼1116（助教实验室）\n- 可同时补交之前的作业和实验报告\n\
