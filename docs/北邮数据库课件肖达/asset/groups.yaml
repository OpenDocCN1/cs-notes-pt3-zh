    # 连接查询


    +   - 连接查询：同时涉及多个表的查询

    +   - 连接条件或连接谓词：用来连接两个表的条件

    +     一般格式：

    +   - [<表名1>.]<列名1> <比较运算符> [<表名2>.]<列名2>

    +   - [<表名1>.]<列名1> BETWEEN [<表名2>.]<列名2> AND [<表名2>.]<列名3>

    +   - 连接字段：连接谓词中的列名称

    +   - 连接条件中的各连接字段类型必须是可比的，但名字不 necessarily 相同的'
  - '[PAGE 387]


    # 连接查询：例子


    +   - 查询每个学生及其选修课程的情况


    ```

    SELECT Student.*, SC.*

    FROM Student, SC

    WHERE Student.Sno = SC.Sno;

