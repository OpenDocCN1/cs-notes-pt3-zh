    \n## 10.5 恢复策略\n\n+   - 10.5.1 事务故障的恢复\n+   - 10.5.2 系统故障的恢复\n+   - 10.5.3 介质故障的恢复\n\
    \n### 10.5.1 事务故障的恢复\n\n+   事务故障：事务在运行至正常终止点前被终止\n\n+   恢复方法\n\n+   由恢复子系统应利用日志文件撤消（UNDO）此事务已对数据库进行的修改\n\
