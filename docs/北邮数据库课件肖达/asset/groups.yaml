  mdcn: "\n\n## 一、信息世界中的基本概念\n\n- 1. **实体（Entity）**\n  客观存在并可相互区别的事物称为实体。可以是具体的人、事、物或抽象的概念。\n\
    \n- 2. **属性（Attribute）**\n  实体所具有的某一特性称为属性。一个实体可以由若干个属性来刻画。\n\n- 3. **码（Key）**\n\
    \  唯一标识实体的属性集称为码。\n\n- 4. **域（Domain）**\n  属性的取值范围称为该属性的域。\n\n- 5. **实体型（Entity\
    \ Type）**\n  用实体名及其属性名集合来抽象和刻画同类实体称为实体型。例子：学生（学号、姓名、性别、出生年月）\n\n- 6. **实体集（Entity\
    \ Set）**\n  同一类型实体的集合称为实体集。\n\n| 学号 | 姓名 | 性别 | 出生日期 |\n|---|---|---|---|\n| 20021001\
    \ | 张三 | 男 | 1978-5-6 |\n| 20021003 | 李四 | 女 | 1980-1-24 |\n| 20021004 | 王五 |\
    \ 男 | 1979-11-12 |\n\n- 7. **联系（Relationship）**\n  - 现实世界中事物内部以及事物之间的联系在信息世界中反映为实体内部的联系和实体之间的联系。\n\
    \  - 实体内部的联系通常是指组成实体的各属性之间的联系。\n  - 实体之间的联系通常是指不同实体集之间的联系。\n\n## 二、两个实体型之间的联系\n\
    \n用图形来表示两个实体型之间的这三类联系\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_68_0.png)\n\n\
    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_68_1.png)\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_68_2.png)\n\
    \n### 一对一联系（1:1）\n\n- 实例\n  - 一个班级只有一个正班长\n  - 一个班长只在一个班中任职\n- 定义：如果对于实体集A中的每一个实体，实体集B中至多有一个（也可以没有）实体与之联系，反之亦然，则称实体集A与实体集B具有一对一联系，记为1:1。\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_69_0.png)\n\n### 一对多联系（1:n）\n\n- 实例\n\
    \  - 一个班级中有若干名学生，每个学生只在一个班级中学习。\n- 定义：如果对于实体集A中的每一个实体，实体集B中有n个实体（n≥0）与之联系，反之，对于实体集B中的每一个实体，实体集A中至多只有一个实体与之联系，则称实体集A与实体集B有一对多联系，记为1:n。\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_70_0.png)\n\n### 多对多联系（m:n）\n\n- 实例\n\
    \  - **课程与学生之间的联系：**一门课程同时有若干个学生选修；一个学生可以同时选修多门课程。\n- 定义：如果对于实体集A中的每一个实体，实体集B中有n个实体（n≥0）与之联系，反之，对于实体集B中的每一个实体，实体集A中也有m个实体（m≥0）与之联系，则称实体集A与实体集B具有多对多联系，记为m:n。\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_71_0.png)\n\n## 二、两个以上实体型之间的联系\n\n\
    ### 两个以上实体型之间一对多联系\n\n若实体型 E₁，E₂，…，Eₙ 存在联系，对于实体型 Eⱼ（j=1，2，…，i-1，i+1，…，n）中的给定实体，最多只和\
    \ Eⱼ 中的一个实体相联系，则我们说 Eᵢ 与 E₁，E₂，…，Eᵢ₋₁，Eᵢ₊₁，…，Eₙ 之间的联系是一对多的。\n\n- 实例：课程、教师与参考书三个实体型。每一个教师可以讲授若干门课程，每门课程可以使用若干本参考书。\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_72_0.png)\n\n- 两个以上实体型间的一对一联系\n- 两个以上实体型间的多对多联系\n\
    \  - 实例：供应商、项目、零件三个实体型。一个供应商可以供给多个项目多种零件；每个项目可以使用多个供应商供应的零件；每种零件可由不同供应商供给。\n\n\
    ![](img/ef3eda0c8c755c94cf60f8794999a1a7_73_0.png)\n\n两个以上实体型间m:n联系\n\n## 四、单个实体型内的联系\n\
    \n- 同一实体集内的各实体之间的关系\n- 一对多联系\n  - 实例\n    - 职工实体型内部具有领导与被领导的联系\n    - 某一职工（干部）“领导”若干名职工\n\
    \    - 一个职工仅被另外一个职工直接领导\n    - 这是一对多的联系\n- 一对一联系和多对多联系\n\n请举例。\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_74_0.png)\n\
    \n## 五、概念模型的一种表示方法\n\n实体—联系方法（E-R方法）\n\n- Peter Chen于1976年提出\n- 用E-R图来描述现实世界的概念模型\n\
    - E-R方法也称为E-R模型\n\n### E-R图\n\n- 实体型：用矩形表示，矩形框内写明实体名。\n- 属性：用椭圆形表示，并用无向边将其与相应的实体连接起来。\n\
    - 联系：联系本身用菱形表示，菱形框内写明联系名，并用无向边分别与有关实体连接起来，同时在无向边旁标上联系的类型（1:1、1:n或m:n）。\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_76_0.png)\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_76_1.png)\n\n### 联系的表示方法\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_77_0.png)\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_77_1.png)\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_77_2.png)\n\
    \n### 联系的表示方法示例\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_78_0.png)\n\n### 一个实例\n\
    \n![](img/ef3eda0c8c755c94cf60f8794999a1a7_81_0.png)\n\n(c) 完整的实体-联系图\n\n### 练习：画ER图\n\
    \n- 练习1：某工厂生产若干种产品，每种产品由不同零件组成，有的零件可用在不同的产品上。这些零件由不同的原料制成，不同零件所用的材料可以相同。这些零件按所属的不同产品分别放在不同的仓库中，原来按照类别放在不同的仓库中。\n\
    - 练习2：学校有若干个系，每个系有若干个教研室，每个教研室有若干教师。同时每个系有若干学生。（不需要画出学校）\n\n![](img/ef3eda0c8c755c94cf60f8794999a1a7_83_0.png)\n\
