    # 关系代数运算符


    | 运算符 | 符号 | 含义 | 键盘格式 | 示例 |

    |---|---|---|---|---|

    | 集合运算符 | ∪ | 并 | UNION | R∪S, 或 R UNION S |

    |  | ∩ | 交 | INTERSECT | R∩S, 或 R INTERSECT S |

    |  | − | 差 | MINUS | R−S, 或 R MINUS S |

    |  | × | 乘 | TIMES | R×S, 或 R TIMES S |

    | 专门关系运算符 | σ | 选择 | R where C | σ 姓名="张三" (S) 或 S where 姓名=‘张三’ |

    |  | π | 投影 | R[ ] | π 考号, 姓名 (S) 或 S[考号, 姓名] |

    |  | ∞ | 连接 | JOIN | R∞S, 或 R JOIN S |

    |  | ÷ | 除 | DIVIDEBY | R÷S, 或 R DIVIDEBY S |


    关系代数中,这些运算经有限次复合后形成的式子称为关系代数表达式。'
  - '[PAGE 44]


    # 1.2.1 传统的集合运算


    +   - 传统的集合运算是二目运算，包括并、差、交、广义笛卡尔积。

    +   - 定义1.2.1 设关系R和关系S具有相同的目n(即两个关系都有n个属性)，且相应的属性取自同一个域，则可以定义并、差、交运算如下：

    +     - 并 (Union)：关系R与关系S的并记作：R∪S={t|t∈R∨t∈S}

    +       其结果仍为n目关系，由属于R或属于S的元组组成。

    +     - 差 (Difference)：关系R与关系S的差记作：R−S={ t | t∈R∧t!∈S }

    +       其结果仍为n目关系，由属于R而不属于S的所有元组组成。'
  - '[PAGE 45]


    # 1.2.1传统的集合运算


    +   - 交 (Intersection): 关系R与关系S的交记作：

    +     R∩S={ t | t∈R∧t∈S }

    +     其结果仍为n目关系，由既属于R又属于S的元组组成。关系的交可以用差来表示，即R∩S=R-(R-S)。

    +   - 广义笛卡尔积 (Extended Cartesian Product): 两个分别为n目和m目的关系R和S的广义笛卡尔积是一个(n+m)列的元组的集合。元组的前n列是关系R的一个元组，后m列是关系S的一个元组。若R有k1个元组，S有k2个元组，则关系R和关系S的广义笛卡尔积有k1×k2个元组。记作：

    +     R×S={trts | tr∈R∧ts∈S }'
  - '[PAGE 46]


