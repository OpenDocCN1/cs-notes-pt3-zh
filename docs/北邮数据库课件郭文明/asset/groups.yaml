  md: "\n## 2.2.1.5 资源管理\n\n- PROFILE为用户规定了动态资源限制，如果创建用户时不指定资源限制文件，则采用一个叫做DEFAULT文件的配置（缺省配置）。资源限制文件可以限制一个单独的调用或整个会话所需要的资源。\n\
    \n```sql\nCREATE PROFILE filename LIMIT\n  SESSIONS_PER_USER n|UNLIMITED  --用户可同时进行几个会话\n\
    \  CPU_PER_SESSION n|UNLIMITED  --每个会话用多少1%秒CPU\n  CONNECT_TIME n|UNLIMITED  --连接数据库时间(分钟)\n\
    \  LOGICAL_READS_PER_SESSION n|UNLIMITED  --会话中读取块数\n  ........ ;\n```\n\n- 限制用户动态资源的目的是为了安全，分配给用户的动态资源应与用户的正常业务相当。如果用户资源占用超越分配值，意味着用户在干“份外”的工作了。系统阻止这类行为通常是结束会话，回退当前事务，返回错误信息。\n\
    \n## 2.2.1.6 审计\n\n- DBA需要了解用户对表作了哪些操作，用户登录多少次等数据库使用情况，以便对系统进行管理。审计是DBMS用于监控用户活动，保障系统安全的重要方法。ORACLE将审计记录写在审计痕迹(Audit\
    \ trail)表，可以查看此表审查数据库的活动。\n\n- 审计用户：`AUDIT 语句选项 [BY 用户] [BY ACCESS|SESSION] [WHENEVER\
    \ [NOT] SUCCESSFUL];`\n  - BY 用户 对指定用户审计，缺省为对所有用户审计；\n  - BY ACCESS 审计全部SQL，BY\
    \ SESSION 一次会话中相同SQL只审计一次（节约），缺省为全部审计；\n  - WHENEVER [NOT] SUCCESSFUL 审计成功或不成功的，缺省为不管成功不成功均审计。\n\
    \n- 例：`AUDIT select table, update table BY user1`\n  对用户user1的查询或修改表和视图操作进行审计。\n\
    \n- 审计对象：`AUDIT 选项 | ALL ON [模式.]对象 [BY ACCESS | SESSION] [WHENEVER [NOT] SUCCESSFUL];`\n\
    \n- 例：`AUDIT insert, update ON user1.student`\n  审计在用户user1的student表上的插入修改操作。\n\
    \n- 审计查看：\n  - `USER_AUDIT_TRAIL` - 定义的审计信息\n  - `DBA_AUDIT_TRAIL` - 审计结果\n  -\
    \ `AUDIT_ACTIONS` - 可审计的命令\n\n- 撤销审计：`NOAUDIT...`\n\n## 2.2.2 完整性约束\n\n- 数据库应用设计者和DBA可以事先为每个数据项确定一些规矩，要求进入数据库的数据必须符合规矩，这些规矩即为完整性约束。\n\
    \n- 实现数据完整性的方法有三种：应用接口编程、表定义时定义约束、触发器编程描述完整性。后两种方法由DBMS提供，与客户端无关，可降低网络负担。\n\n\
    - 2.2.2.1 Create table的完整性约束\n- 2.2.2.2 Alter table修改完整性约束\n- 2.2.2.3 触发器(Trigger)\n\
    \n### 2.2.2.1 Create table的完整性约束\n\n- `CREATE TABLE [schema.]tablename (colname\
    \ datatype [DEFAULT 值|NULL] [列级约束|表级约束][,colname...]);`\n\n- 列级约束：`NOT NULL 或\
    \ [CONSTRAINT 约束名] UNIQUE|PRIMARY KEY|CHECK(条件)|REFERENCES 表[(col,...)][ON DELETE\
    \ CASCADE]`\n\n- 表级约束：`[CONSTRAINT 约束名] UNIQUE(col,col...)|PRIMARY KEY (col,col...)|CHECK(条件)|FOREIGN\
    \ KEY (col,col...) REFERENCES 表[(col,...)][ON DELETE CASCADE]`\n\n- 为了修改约束，可用此子句为列或表约束定一名字。\n\
    \n- 没有此说明时，参照表的主键。\n\n- 通过not null、unique、primary key可实现实体完整性，通过foreign key references可定义参照完整性，on\
    \ delete cascade表示连带删除。\n\n- 例：\n\n```sql\ncreate table orders (ordno integer\
    \ not null, month char(2),\n  cid char(4) not null,aid char(4) not null, pid char(4)\
    \ not null,\n  qty integer not null constraint qck check(qty>=0),\n  dollars float\
    \ default 0.0 constraint dck check(dollars>=0.0),\n  primary key (ordno),\n  constraint\
    \ cidref foreign key (cid) references customers,\n  constraint aidref foreign\
    \ key (aid) references agents,\n  constraint pidref foreign key (pid) references\
    \ products);\n```\n\n### 2.2.2.2 Alter table修改完整性约束\n\n- ALTER TABLE语句允许DBA改变表的结构，加入或改变列，加入或删除各种约束。（注意权限）\n\
    \n```sql\nALTER TABLE tablename\n  [ADD (col 类型 [DEFAULT 值|NULL] [列级约束|表级约束][,\
    \ colname...])]\n  [DROP COLUMN col|(col, col...)]\n  [MODIFY (col 类型 [DEFAULT\
    \ 值|NULL])]\n  [DROP CONSTRAINT 约束名]\n  [DROP PRIMARY KEY];\n```\n\n- 如果表约束被命名，可以用该名字DROP该约束，用ADD子句加一个新的表约束。注意加入新列影响行的物理存储，可能使它们不能存储在磁盘的当前位置。\n\
    \n### 2.2.2.3 触发器(Trigger)\n\n- 触发器类似于过程和函数，**是一个程序块**，但过程是被显式调用，而触发器是当事件发生时，被自动调用（触发），且触发器不接受参数。\n\
    \n- 触发器能引起一个动作的执行，它可以用来实现**过程性约束**。建表时创建的约束称为**非过程性约束**。\n\n- Sybase数据库最早支持触发器，现在Oracle、DB2\
    \ UDB、Informix、SQL Server都支持，但Core SQL-99不支持。\n\n- 定义触发器动作时，各个产品用自己的过程性语言。以下以Oracle为例说明。\n\
    \n```sql\nCREATE [OR REPLACE] TRIGGER trigname\n  BEFORE|AFTER|INSTEAD OF    \
    \            --触发时间\n  INSERT|DELETE|UPDATE [OF col,...]--触发事件\n  ON tabname \
    \                            --只能对表\n  FOR EACH ROW|STATEMENT                \
    \ --行级触发\n  [WHEN (条件)] BEGIN ..PL/SQL块.. END;\n```\n\n触发时间说明事件前或后或只触发不执行事件；\n\
    \n触发事件可以是增删改或三者的组合；\n\n行级触发对满足WHEN条件的每一行都单独执行触发体，语句级触发只在事件发生时触发一次；\n\n行级触发器中可以区分新值和旧值，事件之前的值为old，事件之后的值为new，old和new之前必须有冒号(:)；\n\
    \n触发器中可使用inserting、deleting、updating三个逻辑变量，如果INSERT行为发生，则inserting变量为真，否则为假。\n\
    \n- 例：\n\n```sql\ncreate or replace trigger t_c\n  after update on customers\n\
    \  for each row when (new.discnt>15.0)\n  declare v1 number;\n    v2 number;\n\
    \  begin\n    v1 := :old.discnt;\n    v2 := :new.discnt;\n    dbms_output.put_line('old:'||to_char(v1)\n\
    \      ||'new:'||to_char(v2));\n  end;\n```\n\n说明：对表customers的修改操作发生后，把折扣率大于15的旧折扣率和新折扣率列出。\n"
  mdcn: "\n\n## 2.2.1.5 Resource Management\n\n- PROFILE specifies dynamic resource\
    \ limits for users. If no resource limit file is specified when creating a user,\
    \ a configuration file called DEFAULT (the default configuration) is used. A resource\
    \ limit file can limit the resources required by an individual call or by an entire\
    \ session.\n\n```sql\nCREATE PROFILE filename LIMIT\n  SESSIONS_PER_USER n|UNLIMITED\
    \  --Number of concurrent sessions allowed for each user\n  CPU_PER_SESSION n|UNLIMITED\
    \  --Amount of CPU time used by each session, in 1% seconds\n  CONNECT_TIME n|UNLIMITED\
    \  --Time connected to the database (minutes)\n  LOGICAL_READS_PER_SESSION n|UNLIMITED\
    \  --Number of blocks read during a session\n  ........ ;\n```\n\n- The purpose\
    \ of limiting users' dynamic resources is security. The dynamic resources allocated\
    \ to a user should be commensurate with the user's normal business activities.\
    \ If a user's resource consumption exceeds the allocated limit, it indicates that\
    \ the user is performing “unauthorized” work. The system usually prevents such\
    \ behavior by terminating the session, rolling back the current transaction, and\
    \ returning an error message.\n\n## 2.2.1.6 Auditing\n\n- The DBA needs to know\
    \ what operations users have performed on tables, how many times users have logged\
    \ in, and other database usage information in order to manage the system. Auditing\
    \ is an important method used by the DBMS to monitor user activities and ensure\
    \ system security. ORACLE writes audit records to the Audit trail table, which\
    \ can be viewed to examine database activity.\n\n- Audit users: `AUDIT statement\
    \ option [BY user] [BY ACCESS|SESSION] [WHENEVER [NOT] SUCCESSFUL];`\n  - BY user\
    \ audits the specified user; by default, all users are audited;\n  - BY ACCESS\
    \ audits every SQL statement, while BY SESSION audits the same SQL statement only\
    \ once during a session (to save resources); by default, all statements are audited;\n\
    \  - WHENEVER [NOT] SUCCESSFUL audits successful or unsuccessful operations; by\
    \ default, both successful and unsuccessful operations are audited.\n\n- Example:\
    \ `AUDIT select table, update table BY user1`\n  \n  Audits query or table/view\
    \ modification operations performed by user1.\n\n- Audit objects: `AUDIT option\
    \ | ALL ON [schema.]object [BY ACCESS | SESSION] [WHENEVER [NOT] SUCCESSFUL];`\n\
    \n- Example: `AUDIT insert, update ON user1.student`\n  \n  Audits insert and\
    \ update operations on the student table of user1.\n\n- Viewing audit information:\n\
    \  - `USER_AUDIT_TRAIL` - Defined audit information\n  - `DBA_AUDIT_TRAIL` - Audit\
    \ results\n  - `AUDIT_ACTIONS` - Auditable commands\n\n- Revoke auditing: `NOAUDIT...`\n\
    \n## 2.2.2 Integrity Constraints\n\n- Database application designers and DBAs\
    \ can establish rules for each data item in advance, requiring that data entered\
    \ into the database comply with these rules. These rules are called integrity\
    \ constraints.\n\n- There are three ways to implement data integrity: application\
    \ interface programming, defining constraints when defining tables, and describing\
    \ integrity through trigger programming. The latter two methods are provided by\
    \ the DBMS and are independent of the client, which can reduce the network burden.\n\
    \n- 2.2.2.1 Integrity Constraints in Create table\n- 2.2.2.2 Modifying Integrity\
    \ Constraints with Alter table\n- 2.2.2.3 Triggers\n\n### 2.2.2.1 Integrity Constraints\
    \ in Create table\n\n- `CREATE TABLE [schema.]tablename (colname datatype [DEFAULT\
    \ value|NULL] [column-level constraint|table-level constraint][,colname...]);`\n\
    \n- Column-level constraints: `NOT NULL or [CONSTRAINT constraint_name] UNIQUE|PRIMARY\
    \ KEY|CHECK(condition)|REFERENCES table[(col,...)] [ON DELETE CASCADE]`\n\n- Table-level\
    \ constraints: `[CONSTRAINT constraint_name] UNIQUE(col,col...)|PRIMARY KEY (col,col...)|CHECK(condition)|FOREIGN\
    \ KEY (col,col...) REFERENCES table[(col,...)] [ON DELETE CASCADE]`\n\n- To modify\
    \ constraints, this clause can be used to assign a name to a column or table constraint.\n\
    \n- If this specification is omitted, the primary key of the referenced table\
    \ is used.\n\n- `NOT NULL`, `UNIQUE`, and `PRIMARY KEY` can implement entity integrity;\
    \ `FOREIGN KEY REFERENCES` can define referential integrity; `ON DELETE CASCADE`\
    \ indicates cascading deletion.\n\n- Example:\n\n```sql\ncreate table orders (ordno\
    \ integer not null, month char(2),\n  cid char(4) not null,aid char(4) not null,\
    \ pid char(4) not null,\n  qty integer not null constraint qck check(qty>=0),\n\
    \  dollars float default 0.0 constraint dck check(dollars>=0.0),\n  primary key\
    \ (ordno),\n  constraint cidref foreign key (cid) references customers,\n  constraint\
    \ aidref foreign key (aid) references agents,\n  constraint pidref foreign key\
    \ (pid) references products);\n```\n\n### 2.2.2.2 Modifying Integrity Constraints\
    \ with Alter table\n\n- The ALTER TABLE statement allows the DBA to change the\
    \ structure of a table, add or modify columns, and add or delete various constraints.\
    \ (Pay attention to privileges.)\n\n```sql\nALTER TABLE tablename\n  [ADD (col\
    \ type [DEFAULT value|NULL] [column-level constraint|table-level constraint][,\
    \ colname...])]\n  [DROP COLUMN col|(col, col...)]\n  [MODIFY (col type [DEFAULT\
    \ value|NULL])]\n  [DROP CONSTRAINT constraint_name]\n  [DROP PRIMARY KEY];\n\
    ```\n\n- If a table constraint has been named, that name can be used to DROP the\
    \ constraint, and a new table constraint can be added with the ADD clause. Note\
    \ that adding a new column affects the physical storage of rows and may prevent\
    \ them from being stored in their current locations on disk.\n\n### 2.2.2.3 Triggers\n\
    \n- A trigger is similar to a procedure or function and **is a program block**,\
    \ but a procedure is called explicitly, whereas a trigger is called automatically\
    \ when an event occurs. A trigger does not accept parameters.\n\n- A trigger can\
    \ cause an action to be executed and can be used to implement **procedural constraints**.\
    \ Constraints created when a table is defined are called **nonprocedural constraints**.\n\
    \n- The Sybase database was the first to support triggers. Oracle, DB2 UDB, Informix,\
    \ and SQL Server now support them, but Core SQL-99 does not.\n\n- When defining\
    \ trigger actions, each product uses its own procedural language. The following\
    \ example uses Oracle for illustration.\n\n```sql\nCREATE [OR REPLACE] TRIGGER\
    \ trigname\n  BEFORE|AFTER|INSTEAD OF                --Trigger timing\n  INSERT|DELETE|UPDATE\
    \ [OF col,...]--Triggering event\n  ON tabname                             --Tables\
    \ only\n  FOR EACH ROW|STATEMENT                 --Row-level trigger\n  [WHEN\
    \ (condition)] BEGIN ..PL/SQL block.. END;\n```\n\nTrigger timing specifies whether\
    \ the trigger fires before or after the event, or only fires without executing\
    \ the event;\n\nThe triggering event can be an insert, delete, update, or a combination\
    \ of the three;\n\nA row-level trigger executes the trigger body separately for\
    \ each row satisfying the WHEN condition, while a statement-level trigger fires\
    \ only once when the event occurs;\n\nIn a row-level trigger, new and old values\
    \ can be distinguished. The value before the event is `old`, and the value after\
    \ the event is `new`. A colon (`:`) must precede `old` and `new`;\n\nThe logical\
    \ variables `inserting`, `deleting`, and `updating` can be used in a trigger.\
    \ If an INSERT operation occurs, the `inserting` variable is true; otherwise,\
    \ it is false.\n\n- Example:\n\n```sql\ncreate or replace trigger t_c\n  after\
    \ update on customers\n  for each row when (new.discnt>15.0)\n  declare v1 number;\n\
    \    v2 number;\n  begin\n    v1 := :old.discnt;\n    v2 := :new.discnt;\n   \
    \ dbms_output.put_line('old:'||to_char(v1)\n      ||'new:'||to_char(v2));\n  end;\n\
    ```\n\nExplanation: After a modification operation occurs on the `customers` table,\
    \ the old and new discount rates whose values are greater than 15 are displayed.\n\
    \n"
