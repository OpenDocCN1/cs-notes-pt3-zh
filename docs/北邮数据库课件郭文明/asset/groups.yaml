  - '[PAGE 151]


    # 1.4.3.1 对象联系


    +   - 嵌套关系和复合对象类型定义时不能允许递归, 否则可能造成无穷嵌套, 语义混乱. 采用 ‘引用’ 技术(Reference)可解决类型定义中的递归问题.
    在属性类型中有基本类型、结构类型、关系类型和引用类型. 引用类型相当于程序设计中指针概念.

    +   - 数据的泛化和细化引出对象类型的层次. 较高层对象类型为超类, 较低层对象类型为子类, 子类型继承超类型的特征. 而子类型又有本身的其他特征.'
