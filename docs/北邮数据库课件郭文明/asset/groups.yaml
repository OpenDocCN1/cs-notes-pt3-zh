    \ X→Y在关系模式R(U)中成立。X→Y读作‘X函数决定Y’，或‘Y函数依赖于X’。\n\n- 函数依赖举例：\n  \n  工资管理模式2中的函数依赖：\n\
    \  \n  工号→姓名；工号→级别；级别→基本；\n  \n  级别→津贴；工号，扣款项目→扣款金额。\n  \n  以上函数依赖是根据实际语义，分析数据项之间相关性性得出的。\n\
    \n- 通常并不根据表的内容得出函数依赖，而是通过理解数据项和企业的规则来决定函数依赖。\n\n- 定义：设F是在关系模式R(U)上成立的函数依赖集，X和Y是属性集U的子集。如果从F推导出X→Y也在R(U)上成立，那么称F逻辑蕴涵X→Y。\n\
    - 定义：设F是在关系模式R(U)上成立的函数依赖集，被F逻辑蕴涵的函数依赖集合，称为F的闭包，记为F⁺。\n- Armstrong公理：\n  - 包含规则\
    \ (Inclusion rule)：如果Y⊂X，那么X→Y。\n  - 传递规则 (Transitivity rule)：如果X→Y且Y→Z，那么X→Z。\n\
    \  - 增广规则 (Augmentation rule)：如果X→Y，那么XZ→YZ。\n\n- Armstrong公理的一些逻辑蕴涵:\n  - 合并规则\
    \ (Union rule) : 如果 X→Y 且 X→Z, 那么 X→YZ。\n  - 分解规则 (Decomposition rule) : 如果 X→YZ,\
    \ 那么 X→Y 且 X→Z。\n  - 伪传递规则 (Pseudoransitivity rule) : 如果 X→Y 且 WY→Z, 那么 XW→Z。\n\
    \  - 集合累积规则 (Set accumulation rule) : 如果 X→YZ 且 Z→W, 那么 X→YZW。\n\n在实际使用中，经常要判断能否从已知的FD集\
    \ F 推导出 X→Y (比如在决定候选键的过程中)，那么可以先求出 F 的闭包 F⁺，然后再看 X→Y 是否在 F⁺ 中。\n\n- 求解F的逻辑蕴涵问题是一个算法问题。\n\
    \n- Armstrong公理是函数依赖的一个正确的和完备的推理规则集，正确性是指‘从FD集F使用推理规则集推出的FD必定在F⁺中’，完备性是指‘F⁺中的FD都能从F集使用推理规则集导出’。\n\
    \n- 函数依赖集F中的FD很多，我们应该从F中去掉平凡的FD、无关的FD、FD中无关的属性，以求得F的最小依赖集Fₘᵢₙ。\n\n- 从F求出F⁺是一个复杂的困难的算法问题(见参考资料1)。引入属性集的闭包概念将使该问题简化。\n\
    \n- 建立在属性集的闭包的基础上，使得F的最小依赖集Fₘᵢₙ的求解算法变得简化可行(见参考资料1)。\n\n注：得到函数依赖的逻辑蕴涵的目的是建立在函数依赖基础上进行关系的规范化。\n\
    \n- 定义：给定表T的函数依赖集F和属性集X，X函数决定的最大属性集合Y称为属性X的闭包X⁺， X⁺={属性Y | X→Y在F⁺中}。从X求出X⁺并不难。\n\
    \n例：工资管理模式2中的属性闭包（推导过程见后页）：\n\n工号⁺={工号, 姓名, 级别, 基本, 津贴}；\n\n级别⁺={级别, 基本, 津贴}；\n\
    \n{工号, 扣款项目}⁺={工号, 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}。\n\n- 例：工资管理模式2中，因为{工号, 扣款项目}+={工号,\
    \ 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}，所以它的候选键是：{工号, 扣款项目}。\n\n证明：按照Armstrong公理，\n工号⊂{工号,\
    \ 扣款项目} ⇒ {工号, 扣款项目}→工号，\n又：工号→姓名 ⇒ {工号, 扣款项目}→姓名 ①\n同理有：\n{工号, 扣款项目}→级别 ②\n级别→基本\
    \ ⇒ {工号, 扣款项目}→基本 ③\n级别→津贴 ⇒ {工号, 扣款项目}→津贴 ④\n{工号, 扣款项目}→扣款项目 ⑤\n{工号, 扣款项目}→扣款金额\
    \ ⑥\n综合① ② ③ ④ ⑤ ⑥有以上结论。证毕\n"
  mdcn: "\n\n## 5.3 关系规范化\n\n规范化是关系数据库逻辑设计的另一种方法，它和ER模型的出发点不一样，但是一个基于规范化的关系设计和一个由ER模型转换成的关系设计几乎得到相同的结果。两种方法具有互补性。规范化方法中，从一个将被建模的现实世界的情形出发，分析数据项之间的相互影响，通过无损分解使数据库的逻辑设计趋于合理，把低一级的关系模式分解为若干个高一级的关系模式。\n\
    \n- 5.3.1 关系模式的设计问题\n- 5.3.2 函数依赖\n- 5.3.3 关系模式的分解特性\n- 5.3.4 范式和关系模式规范化\n\n###\
    \ 5.3.1 关系模式的设计问题\n\n- 关系模型要求关系必须是规范化的，即要求数据库表中不允许含有多值属性和含有内部结构，关系的每一个分量必须是一个不可分的数据项，不允许表中还有表。遵守这样规则的表称为第一范式。这是关系数据库设计过程中的一个最基本的约束(见第一章)。\n\
    - 满足第一范式不能保证数据库模式是良好的数据库模式。所谓良好的数据库模式的标准是什么？如何实现？这就是关系模式的设计问题。\n\n- 存在大量数据冗余的数据库模式不是良好的数据库模式。因为大量的数据冗余不仅造成存储空间的浪费，存取效率的低下，而且使得数据信息的更新变得繁琐复杂，另外还隐藏着破坏数据一致性完整性的危险。\n\
    \n- 良好的数据库模式不存在数据冗余、插入异常、删除异常和更新异常等问题。重新分配数据项到不同的表中，能够消除这些问题，这恰是规范化过程将实现的任务。\n\
    \n- 更新异常 (Update Anomaly)：如果更改表所对应的某个实体实例或者关系实例的单个属性时，需要将多行更新，那么就说这个表存在更新异常。数据冗余引起更新异常。\n\
    - 删除异常 (Delete Anomaly)：如果删除表的某一行来反应某个实体实例或者关系实例消失时，会导致丢失另一个不同实体实例或者关系实例的信息，而这是我们不希望丢失的，那么就说这个表存在删除异常。\n\
    - 插入异常 (Insert Anomaly)：如果某个实体或者实例信息随着另一个实体或实例信息的存在而存在，在缺少另一个实体或实例信息时，无法表示这个实体或者实例信息，而这是我们不希望看到的，那么就说这个表存在插入异常。\n\
    \n- 异常情况举例：\n  - 下图模式1是管理职工工资的一个常见的简化的关系模式。\n\n工资管理模式1\n\n| 工号 | 姓名 | 级别 | 基本\
    \ | 津贴 | 考勤扣款 | 违纪扣款 | 实发额 |\n|------|------|------|------|------|----------|----------|--------|\n\
    | 001  | 张三 | 一级 | 800  | 2000 | 120      | 10       | 2670   |\n| 002  | 李四 |\
    \ 三级 | 1200 | 4000 | 20       |          | 5180   |\n\n说明：应发工资额为基本工资和津贴之和，应发工资减去扣款项目为实发工资额，基本工资和津贴的额度由级别决定，扣款额根据实际情况决定。\n\
    \n工资管理模式1存在以下问题：\n\n- 1）扣款项目不是每个职工都发生，数据冗余，浪费空间。\n  \n- 2）当公司出现其他扣款项目时，必须修改模式结构。\n\
    \  \n- 3）应发工资额由级别决定，当没有职工级别是二级时，二级的基本工资和津贴无法添加，插入异常。删除张三信息时，把一级与应发工资额的对应规则也删除了，删除异常。修改级别与应发工资额的对应规则时，必须修改多行，更新异常。\n\
    \n- 下图模式2是改进后的职工工资管理关系模式。\n\n工资管理模式2\n\n| 工号 | 姓名 | 级别 | 基本 | 津贴 | 扣款项目 | 扣款金额\
    \ |\n|---|---|---|---|---|---|---|\n| 001 | 张三 | 一级 | 800 | 2000 | 考勤 | 120 |\n\
    | 001 | 张三 | 一级 | 800 | 2000 | 违纪 | 10 |\n| 002 | 李四 | 三级 | 1200 | 4000 | 考勤 |\
    \ 20 |\n\n说明：该模式解决了问题2，当公司出现其他扣款项目时，无须修改模式结构，比模式1合理。\n\n工资管理模式2仍然存在问题：\n\n- 1）职工信息和应发项目随扣款项目重复，数据冗余。\n\
    \n- 2）应发工资额由级别决定，当没有职工级别是二级时，二级的基本工资和津贴无法添加，插入异常。删除张三信息时，把一级与应发工资额的对应规则也删除了，删除异常。修改级别与应发工资额的对应规则时，必修改多行，更新异常。\n\
    \n- • 为了给模式2进一步优化，需对模式2做进一步分析。\n\n### 5.3.2 函数依赖\n\n- 函数依赖(FD)定义了数据库系统中数据项之间相关性性质最常见的类型。建立在函数依赖的基础之上，作模式的进一步规范化。\n\
    \n- 定义：设有关系模式R(U)，X和Y是属性集U的子集，函数依赖(Functional Dependency, FD)是形为X→Y的一个命题，对任意R中两个元组t和s，都有t[X]=s[X]蕴涵t[Y]=s[Y]，那么FD\
    \ X→Y在关系模式R(U)中成立。X→Y读作‘X函数决定Y’，或‘Y函数依赖于X’。\n\n- 函数依赖举例：\n  \n  工资管理模式2中的函数依赖：\n\
    \  \n  工号→姓名；工号→级别；级别→基本；\n  \n  级别→津贴；工号，扣款项目→扣款金额。\n  \n  以上函数依赖是根据实际语义，分析数据项之间相关性性得出的。\n\
    \n- 通常并不根据表的内容得出函数依赖，而是通过理解数据项和企业的规则来决定函数依赖。\n\n- 定义：设F是在关系模式R(U)上成立的函数依赖集，X和Y是属性集U的子集。如果从F推导出X→Y也在R(U)上成立，那么称F逻辑蕴涵X→Y。\n\
    - 定义：设F是在关系模式R(U)上成立的函数依赖集，被F逻辑蕴涵的函数依赖集合，称为F的闭包，记为F⁺。\n- Armstrong公理：\n  - 包含规则\
    \ (Inclusion rule)：如果Y⊂X，那么X→Y。\n  - 传递规则 (Transitivity rule)：如果X→Y且Y→Z，那么X→Z。\n\
    \  - 增广规则 (Augmentation rule)：如果X→Y，那么XZ→YZ。\n\n- Armstrong公理的一些逻辑蕴涵:\n  - 合并规则\
    \ (Union rule) : 如果 X→Y 且 X→Z, 那么 X→YZ。\n  - 分解规则 (Decomposition rule) : 如果 X→YZ,\
    \ 那么 X→Y 且 X→Z。\n  - 伪传递规则 (Pseudoransitivity rule) : 如果 X→Y 且 WY→Z, 那么 XW→Z。\n\
    \  - 集合累积规则 (Set accumulation rule) : 如果 X→YZ 且 Z→W, 那么 X→YZW。\n\n在实际使用中，经常要判断能否从已知的FD集\
    \ F 推导出 X→Y (比如在决定候选键的过程中)，那么可以先求出 F 的闭包 F⁺，然后再看 X→Y 是否在 F⁺ 中。\n\n- 求解F的逻辑蕴涵问题是一个算法问题。\n\
    \n- Armstrong公理是函数依赖的一个正确的和完备的推理规则集，正确性是指‘从FD集F使用推理规则集推出的FD必定在F⁺中’，完备性是指‘F⁺中的FD都能从F集使用推理规则集导出’。\n\
    \n- 函数依赖集F中的FD很多，我们应该从F中去掉平凡的FD、无关的FD、FD中无关的属性，以求得F的最小依赖集Fₘᵢₙ。\n\n- 从F求出F⁺是一个复杂的困难的算法问题(见参考资料1)。引入属性集的闭包概念将使该问题简化。\n\
    \n- 建立在属性集的闭包的基础上，使得F的最小依赖集Fₘᵢₙ的求解算法变得简化可行(见参考资料1)。\n\n注：得到函数依赖的逻辑蕴涵的目的是建立在函数依赖基础上进行关系的规范化。\n\
    \n- 定义：给定表T的函数依赖集F和属性集X，X函数决定的最大属性集合Y称为属性X的闭包X⁺， X⁺={属性Y | X→Y在F⁺中}。从X求出X⁺并不难。\n\
    \n例：工资管理模式2中的属性闭包（推导过程见后页）：\n\n工号⁺={工号, 姓名, 级别, 基本, 津贴}；\n\n级别⁺={级别, 基本, 津贴}；\n\
    \n{工号, 扣款项目}⁺={工号, 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}。\n\n- 例：工资管理模式2中，因为{工号, 扣款项目}+={工号,\
    \ 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}，所以它的候选键是：{工号, 扣款项目}。\n\n证明：按照Armstrong公理，\n工号⊂{工号,\
    \ 扣款项目} ⇒ {工号, 扣款项目}→工号，\n又：工号→姓名 ⇒ {工号, 扣款项目}→姓名 ①\n同理有：\n{工号, 扣款项目}→级别 ②\n级别→基本\
