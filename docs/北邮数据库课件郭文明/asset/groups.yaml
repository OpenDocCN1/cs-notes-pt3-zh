    \  - 定理：若所有事务均遵循两段锁协议，则这些事务的所有并行调度都是可串行化的。\n\n### 3.2.4 ORACLE事务控制-回退段\n\n- ORACLE为了适应事务控制设置了回退段这一数据库对象。系统利用回退段来确保诸如读一致性、数据库恢复等管理功能。\n\
    - ORACLE在缺省情况下，读数据不加锁，通过回退段(Rollback Segment)保证用户不读脏数据和可重复读。\n- 表空间中的数据按段来组织，数据段、索引段、暂存段和回退段。回退段是一块磁盘存储区域，回退段可以由用户创建，但只能由系统进程使用。\n\
    - 回退段中的数据是为事务服务的，每执行事务时，系统先在指定回退段上记录将要对数据进行的变化，以事务为单位，各个事务的回退信息链接在一起。\n- 当事务要回退时，利用回退信息将数据块中的数据恢复到先前的状态。\n\
    - 事务成功提交后，回退信息逐渐失效(在提交之前申请的查询需要这些信息保证读一致性，事务提交前对数据的变动不会为其他用户所知晓)。回退段可以循环使用。\n\n\
    用回退段保证读一致性(不读脏数据和可重复读)：\n\n例：有5个事务并发：事务 Ts1、Ts2、Ts3为查询事务，Tu1、Tu2为更新事务。\n\n```sql\n\
    Tu1: UPDATE customers\nSET discnt=discnt*1.1\nWHERE cid='c001';\n```\n\n```sql\n\
    Tu2: UPDATE customers\nSET discnt=15 WHERE cid='c001';\n```\n\n事务开始和完成时间段如右上图：\n\
    \n事务对回退段影响如右下图：\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_256_0.png)\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_256_1.png)\n\
    \n- 事务的开始顺序和基准时间为：Ts1=0 – Tu1=3 – Ts2=4 – Tu2=5 – Ts3=6；\n- 事务的完成顺序和基准时间为：Tu1=4\
    \ – Tu2=6 – Ts1>6 – Ts2>6 – Ts3>6；\n- 数据缓冲区的内容是最新更改的结果，回退段按时间顺序记录了每次更改以前的数据；\n\
    - 尽管Tu1和Tu2两次更改了discnt的值，但Tu1开始之前Ts1已开始，所以在时间4结束的Tu1回退信息并不马上消失，保证Ts1从回退段中查得discnt为10，Tu2开始之前Ts2已开始，所以在时间6结束的Tu2回退信息并不马上消失，保证Ts2从回退段中查得discnt为11，Ts3基准时间是6，从缓冲区中查得discnt为15。\n\
    - Ts1和Ts2结束后才清除回退段信息。\n\n"
