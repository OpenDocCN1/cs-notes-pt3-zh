    \ np)与叶子层中的项相等，估算每一目录层的块数？eid的值从1到200000连续，每秒可进行80块磁盘操作，估算在没有聚簇和有聚簇情况下执行下列查询所需时间？\n\
    \   `select * from emp where eid between 10000 and 20000;`\n\n3. 解释散列簇。\n\n##\
    \ 2.2 数据管理\n\n数据库运行过程中，有一系列工作要做：我们希望没有授权的用户不能操纵数据库，此为数据库的安全性；我们希望被授权的用户在出现更新错误时能保持数据的完整性，此为数据库的完整性控制；我们希望了解数据库的整体情况，可以查询系统目录；我们希望数据库遇到故障时，把损失降低到最小程度，此为数据库恢复。\n\
    \n- 2.2.1 安全性\n- 2.2.2 完整性约束\n- 2.2.3 系统目录\n- 2.2.4 数据库恢复\n\n### 2.2.1 安全性\n\n\
    - 安全性控制保护数据库以防止不合法的使用所造成的数据泄露和破坏。其基本措施是存取控制：确保只授权给有资格的用户访问数据库的权限，同时令所有未被授权的人员无法接近数据。\n\
    - GRANT语句是表所有者授予一个或一类用户访问表的各种权利的SQL命令。访问列的安全性可通过视图实现。REVOKE语句撤消对一个表的权限。\n- 表的所有者自动拥有所有权限，而且不能被取消。\n\
    \n- 2.2.1.1 用户管理    2.2.1.4 权限授予\n- 2.2.1.2 权限管理    2.2.1.5 资源管理\n- 2.2.1.3 角色\
    \         2.2.1.6 审计\n\n#### 2.2.1.1 用户管理\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_190_0.png)\n\
    \n- 数据库应用系统有合法的用户名单，为了访问一个数据库，用户须用该数据库确认有效的用户名和口令运行应用程序，连接到数据库中。对不同用户可以授予不同权限，每个用户只能在自己权限范围内活动。不同用户有不同的权限，责任明确，保障安全。\n\
    \n- 用户数：同一时刻登录到数据库的用户数（ORACLE中初始化参数LICENSE_MAX_SESSIONS）；数据库可容纳的不同的用户名总数（ORACLE中初始化参数LICENSE_MAX_USERS）。\n\
    \n```\nCREATE USER username\nIDENTIFIED BY password\n[DEFAULT TABLESPACE tsname]\n\
    [TEMPORARY TABLESPACE tsname]\n[QUOTA [n [K|M]] [UNLIMITED] ON tsname]\n[PROFILE\
    \ profile_name];\n```\n\nDEFAULT TABLESPACE 指定用户创建的对象所在的表空间，TEMPORARY TABLESPACE\
    \ 指定用户暂存段表空间，缺省为 SYSTEM 表空间；QUOTA 指定表空间的限制配额。每个用户可以设置一个配置文件，表明自己的操作范围，PROFILE\
    \ 用来指定用户配置文件。\n\n- `ALTER USER username ...;` 修改用户\n- `DROP USER username [CASCADE];`\
    \ 删除用户[及所属对象]。\n\nORACLE初始系统的用户：\n\n| 用户名 | 口令 |\n| --- | --- |\n| SYS | CHANGE_ON_INSTALL\
    \ |\n| SYSTEM | MANAGER |\n| INTERNAL | ORACLE (DBA用户) |\n\n- 一个系统中用户名唯一，各个用户的信息可以在DBA_USERS数据字典中查到。\n\
    \n#### 2.2.1.2 权限管理\n\n- 权限分为两大类：系统权限和对象权限。\n- 系统权限用于划分DBA的职责（多个DBA），有：CREATE对象，ALTER对象，DROP对象等80余种。如果将系统权限授予某一用户，则该用户应当被看作DBA。\n\
    - 对象权限是为控制用户使用数据库对象而设立的，数据库对象主要有表、视图、序列、过程/函数和快照等，权限有ALTER、INSERT、DELETE、UPDATE、SELECT、INDEX、EXECUTE、REFERENCES，对象权限与SQL语句有直接的对应关系，在某个数据库对象上拥有某种权限，往往意味着可以执行相应的SQL语句。\n\
    \n#### 2.2.1.3 角色\n\n- 角色介于权限和用户之间，是一组系统权限和对象权限的集合，把它们组合在一起赋予一个名字，就使得授予权限变得简单。用户被授予某个角色，则拥有该角色的所有权限。引入角色的概念可减轻DBA的负担。\n\
    - 数据库应用设计者可以不再理会各个工作站的具体用户是谁，只以抽象的角色代替。\n- ORACLE 8预先定义了8种角色，用来限制系统权限，数据库应用设计者可以以此为基础规划和定义一般用户。\n\
    - **CREATE ROLE** rolename [NOT IDENTIFIED] [IDENTIFIED [BY password|EXTERNALLY]]\n\
    \  如果角色有口令，用户要知道口令才可扮演该角色，EXTERNALLY表示由操作系统检验口令。\n\n- ORACLE预先定义的8种角色：\n  - CONNECT：连接到数据库，最终用户角色。\n\
    \  - RESOURCE：申请资源创建对象，开发人员角色。\n  - DBA：具有全部系统权限，可以创建用户。\n  - IMP_FULL_DATABASE：装入全部数据库内容。\n\
    \  - EXP_FULL_DATABASE：卸出全部数据库内容。\n  - DELETE_CATALOG_ROLE：能删除审计表中记录。\n  - SELECT_CATALOG_ROLE：查询数据字典。\n\
    \  - EXECUTE_CATALOG_ROLE：执行过程和函数。\n\n#### 2.2.1.4 权限授予\n\n- GRANT [系统权限|角色]\n\
    \  TO [用户|PUBLIC|角色]\n  [WITH ADMIN OPTION];\n  WITH ADMIN OPTION允许权限复制给其他用户。\n\
    - GRANT [ALL |对象权限[,对象权限...]|角色]\n  ON [TABLE] tablename|viewname\n  TO [PUBLIC|username[,username...]|角色]\n\
    \  [WITH GRANT OPTION];\n- 系统权限、对象权限和角色均可用相应的 REVOKE语句收回。\n"
  mdcn: "\n\n## 2.1.4 散列(HASH)簇存储\n\n- HASH与聚簇都是把若干有共用列的表聚簇在一起，但聚簇建立专用索引，用索引确定各聚簇键对应行的存储位置；HASH不建索引，通过HASH函数生成HASH值，由HASH值确定键值对应行的存储位置，一步到位。\n\
    \n- CREATE CLUSTER clustername ...\n  (colname datatype [,col...]) SIZE n\n  [SINGLE\
    \ TABLE] HASHKEYS n [HASH IS expr];\n  SINGLE TABLE表示只供一张表优化用。\n  HASHKEYS说明该散列簇至少包含的键数（应该使INITIAL的值大于SIZE*HASHKEYS，从而使初始区域放下该散列簇，避免碎片）。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_185_0.png)\n\n- expr是计算数字值的表达式，称为HASH函数。HASH函数负责键值与空间存储位置的转换，HASH函数的优劣决定散列存储方式的成败。HASH函数有两种表达方式：\n\
    \  1. 缺省方式（没有HASH IS子句）：系统自动转换。\n  2. expr可以为：函数(列名,...)。函数应保证得到唯一性较好的HASH值。\n\
    \n例：\n```\ncreate cluster deptemp (deptno int) size 2000 hashkeys 10000 hash is\
