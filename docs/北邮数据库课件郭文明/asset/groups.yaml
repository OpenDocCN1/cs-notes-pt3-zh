    \ {*|<目标列表达式[[as]别名]>[, <目标列表达式[[as]别名]>]...}\nFROM<表名或视图名>[, <表名或视图名>]...\n[WHERE<条件表达式>]\n\
    [GROUP BY<列名>[, <列名>][HAVING<条件表达式>]]\n[ORDER BY<列名>[ASC|DESC][, <列名>[ASC|DESC]]\
    \ ...];\n```\n\n## 1.3.3 数据查询\n- Select语句的执行过程可以理解为：\n  首先，对FROM子句中的所有表做关系乘积\n\
