    \ sidALRT.log（sid是数据库系统的标识符），存储在由 init.ora 参数 BACKGROUND_DUMP_DEST 指定的位置。\n\n\
    当调查数据库故障时，应首先查看该文件，关键的错误总是在这里被记载。\n\n后台进程和用户进程也建立它们自己的追踪文件，记载出现故障的信息。后台进程追踪文件贮存在\
    \ BACKGROUND_DUMP_DEST 所指定的位置，用户进程追踪文件贮存在由 USER_DUMP_DEST 参数设置所指定的目录里。\n\n后台进程追踪文件被命名为sidPROC.trc，PROC是后台进程的名字。用户会话追踪文件带有一个ora前缀，后面是一系列带有.trc文件扩展名的唯一标识数字。\n\
