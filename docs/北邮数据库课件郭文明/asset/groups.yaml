  md: "\n## 1.4.2.3 PL/SQL、用户定义函数和方法\n\n- 例：对象关系数据库中利用对象类型定义表、利用用户定义函数定义对象的方法。\n-\
    \ 1) 定义对象点(point_t)和矩形(rectangle_t)及其方法inside(point_t)(点是否在矩形对象内)和area()(矩形面积)。\n\
    \n定义点对象\n\n```\ncreate type point_t as object (x int,y int);\n```\n\n定义包含方法的矩形对象\n\
    \n```\ncreate type rectangle_t as object (pt1 point_t, pt2 point_t, member function\
    \ inside(p point_t) return int, member function area return int);\n```\n\n成员函数，实际是对象的方法\n\
    \n```\ncreate type body rectangle_t as\n  member function area return int is begin\
    \ --成员函数area定义\n    return (self.pt2.x-self.pt1.x)*(self.pt2.y-self.pt1.y);\n\
    \  end;\n                          --成员函数area没有参数,返回长乘宽.\n  member function inside(p\
    \ in point_t) return int is begin\n    if (p.x>=self.pt1.x) and (p.x<=self.pt2.x)\
    \ and\n       (p.y>=self.pt1.y) and (p.y<=self.pt2.y) then return 1;\n    else\
    \ return 0;\n    end if;\n  end; --成员函数inside参数为点类型的p,当p在矩形中时返回1,否则返回0.\nend;\n\
    ```\n\n- 2) 创建point_t和rectangle_t类型的对象表。\n\n```\ncreate table points of point_t\
    \ (primary key (x,y));\ncreate table rects of rectangle_t (primary key (pt1.x,pt1.y,pt2.x,pt2.y));\n\
    ```\n\n插入两个矩形：\n\n```\ninsert into rects values (point_t(1,2),point_t(3,4));\n\
    insert into rects values (point_t(1,1),point_t(6,6));\n```\n\n插入三个点：\n\n```\n\
    insert into points values (2,3);\ninsert into points values (1,4);\ninsert into\
    \ points values (4,4);\n```\n\n- 3) 使用方法area和inside。\n\n计算rects表中矩形面积：\n\n```\n\
    select value(x),x.area() from rects x;\n```\n\n判断点(4,2)是否在每个矩形中：\n\n```\nselect\
    \ value(x),x.inside(point_t(4,2)) from rects x;\n```\n\n查询在所有矩形内的所有点：\n\n```\n\
    select value(p) from points p where not exists\n(select * from rects r where r.inside(p)=0);\n\
    ```\n\n计算覆盖各点的最小矩形的面积：\n\n```\nselect p.x,p.y,min(r.area()) from rects r,points\
    \ p\nwhere r.inside(value(p))>0 group by p.x,p.y;\n```\n\n将面积小于24的矩形的pt2横纵坐标加1：\n\
    \n```\nupdate rects r set pt2=point_t(r.pt2.x+1,r.pt2.y+1) where r.area()<24;\n\
    ```\n\n- 定义包含方法的对象\n\n```\nCREATE TYPE typename AS OBJECT\n(attrname datatype\
    \ [,attrname datatype...]\nMEMBER FUNCTION methodname\n[(param type [,param type...])]\n\
    RETURN datatype,\n[,MEMBER FUNCTION methodname\n[(param type [,param type...])]\n\
    RETURN datatype,...]);\n```\n\n在前面对象类型的基础上增加了MEMBER FUNCTION语句，定义对象的成员函数，即方法。\n\
    \n- 对象成员函数的定义\n\n```\nCREATE [OR REPLACE] TYPE BODY typename [AS|IS]\n  MEMBER\
    \ FUNCTION methodname [(param type...)]\n    RETURN type IS\n    BEGIN    --PL/SQL语句开始\n\
    \      statements\n    END;    --PL/SQL语句结束\n  [MEMBER FUNCTION methodname [(param\
    \ type...)]\n    RETURN type is\n    BEGIN......]\nEND;\n```\n\n对于不同的DBMS，对象成员函数的处理过程使用的语句可能不同，带来移植的通用问题。\n\
    \n## 1.4.3 对象关系数据库\n\n- 对象关系数据库系统除具有原来关系数据库的各种特点外，还应该提供以下特点：\n- 1）扩充数据类型：允许用户根据自己应用需求定义自己的数据类型、函数和操作符。例如可以定义数组、向量、矩阵、集合以及这些数据类型上的操作。\n\
    - 2）支持复杂对象：复杂对象指由多种基本类型或用户定义类型构成的对象。\n- 3）支持继承：支持子类、超类的概念，支持属性数据和函数及过程的继承。\n-\
    \ 4）提供通用的规则系统：规则在DBMS及其应用中十分重要，传统DBMS中的触发器可以看作规则的一种形式。\n\n### 1.4.3.1 对象联系\n\n\
    - 关系模型中基本的数据结构层次是关系-元组-属性，属性类型是基本类型。\n- 嵌套关系模型是平面关系模型的扩展，允许关系的属性又是一个关系。\n- 嵌套关系模型进一步扩展，出现复合对象模型。关系中的属性可以是基本类型，也可以是结构类型或集合类型。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_150_0.png)\n\n- 嵌套关系和复合对象类型定义时不能允许递归，否则可能造成无穷嵌套，语义混乱。采用\
    \ ‘引用’ 技术(Reference)可解决类型定义中的递归问题。在属性类型中有基本类型、结构类型、关系类型和引用类型。引用类型相当于程序设计中指针概念。\n\
    - 数据的泛化和细化引出对象类型的层次。较高层对象类型为超类，较低层对象类型为子类，子类型继承超类型的特征。而子类型又有本身的其他特征。\n\n### 1.4.3.2\
    \ 对象关系数据定义\n\n- 对象关系模型中，属性可以是复合类型：\n  - 1) 结构类型：不同类型元素的有序集合；\n  - 2) 数组类型：同类元素的有序集合；\n\
    \  - 3) 集合类型：同类元素的无序集合。\n  - 数据类型可以嵌套。\n- 继承性表现在类型的继承和表的继承。子类型继承超类型的特征；子表继承父表的特征。\n\
    - 数据类型可以嵌套定义，但要实现递归，就要采用‘引用’类型。\n\n### 1.4.3.3 对象关系数据查询\n\n- 当属性值为单值或结构值时，属性的引用方式在层次间加圆点\
    \ ‘.’。\n- 聚集函数(max、min、count等)可以应用于任何以关系为值的表达式中，以关系作为参数，返回单个值。\n- 当属性值为一个集合时，应当将嵌套的集合转换为常规的表的形式(解除嵌套)。\n\
    - 在数据更新时，充分注意数据定义的格式，利用 ‘对象构造器’。也可以利用将常规关系转换为嵌套集合形式的函数完成(解除嵌套的逆过程)。\n\n### 1.4.3.4\
    \ 三种产品的对象关系特征\n\n| | ORACLE | INFORMIX | DB2 UDB |\n|---|---|---|---|\n| 用户定义类型(UDT)\
    \ | 有，结构化的‘对象类型’ | 有，结构化的‘行类型’ | 有，结构化的 UDT |\n| 继承 | 无 | 有 | 有 |\n| UDT引用 | 有\
    \ | 无 | 有 |\n| 集合类型 | 有，嵌套表、VARRAY | 有，集合，多集合，列表 | 无 |\n| 用户定义函数(UDF) | 有，PL/SQL，C，Java\
    \ | 有，SPL，C，Java | 有，C，Java |\n| 封装的UDT | BLOB(Binary Large Object)对象 | BLOB对象\
    \ | BLOB对象 |\n| 打包UDT | Cartridge | DataBlade | Extender |\n| BLOB尺寸 | 4GB-1 |\
    \ 4TB | 2GB-1 |\n| BLOB子串 | UDF访问 | UDF访问 | UDF访问 |\n"
  mdcn: "\n\n## 1.4.2.3 PL/SQL、用户定义函数和方法\n\n- 例：对象关系数据库中利用对象类型定义表、利用用户定义函数定义对象的方法。\n\
    - 1) 定义对象点(point_t)和矩形(rectangle_t)及其方法inside(point_t)(点是否在矩形对象内)和area()(矩形面积)。\n\
    \n定义点对象\n\n```\ncreate type point_t as object (x int,y int);\n```\n\n定义包含方法的矩形对象\n\
    \n```\ncreate type rectangle_t as object (pt1 point_t, pt2 point_t, member function\
    \ inside(p point_t) return int, member function area return int);\n```\n\n成员函数，实际是对象的方法\n\
    \n```\ncreate type body rectangle_t as\n  member function area return int is begin\
    \ --成员函数area定义\n    return (self.pt2.x-self.pt1.x)*(self.pt2.y-self.pt1.y);\n\
    \  end;\n                          --成员函数area没有参数,返回长乘宽.\n  member function inside(p\
    \ in point_t) return int is begin\n    if (p.x>=self.pt1.x) and (p.x<=self.pt2.x)\
    \ and\n       (p.y>=self.pt1.y) and (p.y<=self.pt2.y) then return 1;\n    else\
    \ return 0;\n    end if;\n  end; --成员函数inside参数为点类型的p,当p在矩形中时返回1,否则返回0.\nend;\n\
    ```\n\n- 2) 创建point_t和rectangle_t类型的对象表。\n\n```\ncreate table points of point_t\
    \ (primary key (x,y));\ncreate table rects of rectangle_t (primary key (pt1.x,pt1.y,pt2.x,pt2.y));\n\
    ```\n\n插入两个矩形：\n\n```\ninsert into rects values (point_t(1,2),point_t(3,4));\n\
    insert into rects values (point_t(1,1),point_t(6,6));\n```\n\n插入三个点：\n\n```\n\
    insert into points values (2,3);\ninsert into points values (1,4);\ninsert into\
    \ points values (4,4);\n```\n\n- 3) 使用方法area和inside。\n\n计算rects表中矩形面积：\n\n```\n\
    select value(x),x.area() from rects x;\n```\n\n判断点(4,2)是否在每个矩形中：\n\n```\nselect\
    \ value(x),x.inside(point_t(4,2)) from rects x;\n```\n\n查询在所有矩形内的所有点：\n\n```\n\
    select value(p) from points p where not exists\n(select * from rects r where r.inside(p)=0);\n\
    ```\n\n计算覆盖各点的最小矩形的面积：\n\n```\nselect p.x,p.y,min(r.area()) from rects r,points\
    \ p\nwhere r.inside(value(p))>0 group by p.x,p.y;\n```\n\n将面积小于24的矩形的pt2横纵坐标加1：\n\
    \n```\nupdate rects r set pt2=point_t(r.pt2.x+1,r.pt2.y+1) where r.area()<24;\n\
    ```\n\n- 定义包含方法的对象\n\n```\nCREATE TYPE typename AS OBJECT\n(attrname datatype\
    \ [,attrname datatype...]\nMEMBER FUNCTION methodname\n[(param type [,param type...])]\n\
    RETURN datatype,\n[,MEMBER FUNCTION methodname\n[(param type [,param type...])]\n\
    RETURN datatype,...]);\n```\n\n在前面对象类型的基础上增加了MEMBER FUNCTION语句，定义对象的成员函数，即方法。\n\
    \n- 对象成员函数的定义\n\n```\nCREATE [OR REPLACE] TYPE BODY typename [AS|IS]\n  MEMBER\
    \ FUNCTION methodname [(param type...)]\n    RETURN type IS\n    BEGIN    --PL/SQL语句开始\n\
    \      statements\n    END;    --PL/SQL语句结束\n  [MEMBER FUNCTION methodname [(param\
    \ type...)]\n    RETURN type is\n    BEGIN......]\nEND;\n```\n\n对于不同的DBMS，对象成员函数的处理过程使用的语句可能不同，带来移植的通用问题。\n\
    \n## 1.4.3 对象关系数据库\n\n- 对象关系数据库系统除具有原来关系数据库的各种特点外，还应该提供以下特点：\n- 1）扩充数据类型：允许用户根据自己应用需求定义自己的数据类型、函数和操作符。例如可以定义数组、向量、矩阵、集合以及这些数据类型上的操作。\n\
    - 2）支持复杂对象：复杂对象指由多种基本类型或用户定义类型构成的对象。\n- 3）支持继承：支持子类、超类的概念，支持属性数据和函数及过程的继承。\n-\
    \ 4）提供通用的规则系统：规则在DBMS及其应用中十分重要，传统DBMS中的触发器可以看作规则的一种形式。\n\n### 1.4.3.1 对象联系\n\n\
    - 关系模型中基本的数据结构层次是关系-元组-属性，属性类型是基本类型。\n- 嵌套关系模型是平面关系模型的扩展，允许关系的属性又是一个关系。\n- 嵌套关系模型进一步扩展，出现复合对象模型。关系中的属性可以是基本类型，也可以是结构类型或集合类型。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_150_0.png)\n\n- 嵌套关系和复合对象类型定义时不能允许递归，否则可能造成无穷嵌套，语义混乱。采用\
    \ ‘引用’ 技术(Reference)可解决类型定义中的递归问题。在属性类型中有基本类型、结构类型、关系类型和引用类型。引用类型相当于程序设计中指针概念。\n\
    - 数据的泛化和细化引出对象类型的层次。较高层对象类型为超类，较低层对象类型为子类，子类型继承超类型的特征。而子类型又有本身的其他特征。\n\n### 1.4.3.2\
    \ 对象关系数据定义\n\n- 对象关系模型中，属性可以是复合类型：\n  - 1) 结构类型：不同类型元素的有序集合；\n  - 2) 数组类型：同类元素的有序集合；\n\
    \  - 3) 集合类型：同类元素的无序集合。\n  - 数据类型可以嵌套。\n- 继承性表现在类型的继承和表的继承。子类型继承超类型的特征；子表继承父表的特征。\n\
    - 数据类型可以嵌套定义，但要实现递归，就要采用‘引用’类型。\n\n### 1.4.3.3 对象关系数据查询\n\n- 当属性值为单值或结构值时，属性的引用方式在层次间加圆点\
    \ ‘.’。\n- 聚集函数(max、min、count等)可以应用于任何以关系为值的表达式中，以关系作为参数，返回单个值。\n- 当属性值为一个集合时，应当将嵌套的集合转换为常规的表的形式(解除嵌套)。\n\
    - 在数据更新时，充分注意数据定义的格式，利用 ‘对象构造器’。也可以利用将常规关系转换为嵌套集合形式的函数完成(解除嵌套的逆过程)。\n\n### 1.4.3.4\
    \ 三种产品的对象关系特征\n\n| | ORACLE | INFORMIX | DB2 UDB |\n|---|---|---|---|\n| 用户定义类型(UDT)\
    \ | 有，结构化的‘对象类型’ | 有，结构化的‘行类型’ | 有，结构化的 UDT |\n| 继承 | 无 | 有 | 有 |\n| UDT引用 | 有\
    \ | 无 | 有 |\n| 集合类型 | 有，嵌套表、VARRAY | 有，集合，多集合，列表 | 无 |\n| 用户定义函数(UDF) | 有，PL/SQL，C，Java\
    \ | 有，SPL，C，Java | 有，C，Java |\n| 封装的UDT | BLOB(Binary Large Object)对象 | BLOB对象\
    \ | BLOB对象 |\n| 打包UDT | Cartridge | DataBlade | Extender |\n| BLOB尺寸 | 4GB-1 |\
    \ 4TB | 2GB-1 |\n| BLOB子串 | UDF访问 | UDF访问 | UDF访问 |\n\n"
