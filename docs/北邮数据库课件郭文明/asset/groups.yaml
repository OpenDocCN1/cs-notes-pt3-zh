    select * from agents where a.city=''北京''  and not exists

    (select * from orders x where x.cid=c.cid and x.aid=a.aid)

    ```


    +   2. 反例不存在： not exists (反例)


    +   3. 最终： select c.cid from customers where  not exists


    ```

    (select * from agents where a.city=''北京''  and not exists

    (select * from orders x where x.cid=c.cid and x.aid=a.aid));

    ```'
