  - '[PAGE 21]


    # 1.1.2关系数据模型


    +   - 单一的数据结构——关系

    +     关系模型的数据结构非常单一。在关系模型中，现实世界的实体以及实体间的各种联系均用关系来表示。在用户看来，关系模型中数据的逻辑结构是一张二维表。


    +   - 关系操作

    +     关系模型给出了关系操作的能力，但不对RDBMS语言给出具体的语法要求。关系模型中常用的关系操作包括：选择(Select)、投影(Project)、连接(Join)、除(Divide)、并(Union)、交(Intersection)、差(Difference)等查询(Query)操作和增加(Insert)、删除(Delete)、修改(Update)操作两大部分。查询的表达能力是其中最主要的部分。

    +     关系操作的特点是集合操作方式，即操作的对象和结果都是集合。'
  - "[PAGE 22]\n\n# 1.1.2 关系数据模型\n\n+   - 关系的三类完整性约束\n+   \n+     关系模型允许定义三类完整性约束：实体完整性、参照完整性和用户定义的完整性。其中实体完整性和参照完整性是关系模型必须满足的完整性约束条件，应该由关系型数据库管理系统自动支持。用户定义的完整性是应用领域需要遵循的约束条件，体现了具体领域中的语义约束。\n\
    \n+   - 关系模型与以往的模型（层次模型、网状模型）不同，它是建立在严格的数学概念的基础上的。在用户观点下，关系模型中数据的逻辑结构是一张二维表，它由行和列组成。关系模型中称为关系、属性、元组。数据库中有两套术语：表、列、行；关系、属性、元组。"
  - '[PAGE 23]


    # 1. 1. 2. 1域和数据类型


    +   - 在目前的DBMS产品中（ACCESS、FOX、ORACLE、DB2 UDB、INFORMIX），创建数据库首先确定该数据库有多少表，每一表的名称是什么，表中包含哪些列，表的列必须确定类型。比如说，表CUSTOMERS中的discnt列的类型是real(实型)，city列的类型为char(20)（字符串）。

    +   - 为什么在定义表的时候，必须给表的列加一个特定的类型呢？我们知道，在C或者Java等编程语言中，对于程序中使用的变量或常量等数据，事先应当申明其类型，具有相同类型的数据才可以进行一系列的比较和运算。数据库中给表的列加一个特定类型的原因也在于此。'
  - '[PAGE 24]


    # 1.1.2.1域和数据类型


    +   - 在数据库原理或理论性文献中，一般地说，一个表的列的取值范围是在一集合D上，我们称D为域(Domain)。

    +   - 定义1.1.1域(Domain) 域是一组具有相同数据类型的值的集合。


    例如：自然数、整数、实数、字符串、日期、时间、{0, 1}、{‘男’，‘女’}、{民族名 | 中国56个民族的名字}等等，都可以是域。'
  - '[PAGE 25]


    # 1.1.2.2表和关系


    +   - 定义1.1.2 笛卡尔积(Cartesian Product)

    +     给定一组域D1，D2，...，Dn，这些域中可以有相同的。D1，D2，...，Dn 的笛卡尔积为：

    +     D1×D2×...×Dn= {(d1, d2, ..., dn) | di∈Di, i=1, 2, ..., n}

    +     其中每一个元素(d1, d2, ..., dn)叫作一个n元组(n-tuple)或简称元组(Tuple)。元素中的每一个值di叫作一个分量(Component)。

    +     若Di (i=1, 2, ..., n)为有限集，其基数为mi (i=1, 2, ..., n)，则D1×D2×...×Dn的基数M为：

    +     m1×m2×...×mn


    +   - 笛卡尔积可表示为一个二维表。表中的每行对应一个元组，表中的每列对应一个域。'
  - "[PAGE 26]\n\n# 1. 1. 2. 2表和关系\n\n+   - 定义1. 1. 3关系(Relation) D1×D2×...×Dn的子集叫做在域D1，D2，...,\
    \ Dn 的关系，表示为\n+   \n+     R(D1, D2, ..., Dn)\n+   \n+     R这里只表示关系的名字，n是关系的目或度(Degree)。\n\
    \n+   - 关系是笛卡尔积的有限子集，所以关系也是一个二维表，表的每行对应一个元组，表的每列对应一个域。由于域可以相同，为了加以区分，必须对每列起一个名字，称为属性(Attribute)。n目关系必有n个属性。"
  - '[PAGE 27]


    # 1.1.2. 2表和关系


    +   - 若关系中的某一属性组的值能唯一地标识一个元组，则称该属性组为候选码(Candidate key)。若一个关系有多个候选码，则选定其中一个为主码(Primary
    key)。主码的诸属性称为主属性(Prime attribute)。不包含在任何候选码中的属性称为非码属性(Non-key attribute)。

    +   - 笛卡尔积中的许多元组是无实际意义的，从中取出有实际意义的元组来构造关系。在域的笛卡尔积中，我们称那些符合条件的元素为相关的，由此得到数学上的术语——关系。'
  - '[PAGE 28]


    # 1.1.2. 2表和关系


    +   - 表的列相对是稳定的，它描述表的结构。增加或删除列都不是常见的，我们也不希望在日常业务中这样。设计表的列布局就是数据库的逻辑设计。另一方面，表的內容是经常变化的，新的行被添加或被删除在日常业务中随时可能发生。数据库是关系的集合。组成关系的属性（列）的集合称为关系模式。数据库所有关系模式的集合构成数据库模式。

    +   - 关系可以有三种类型：基本关系(基本表或基表)、查询表和视图表。基本表是实际存在的表，它是实际存储数据的逻辑表示。查询表是查询结果对应的表。视图表是由基本表或其他视图表导出的表，是虚表，不对应实际存储的数据。'
  - '[PAGE 29]


    # 1. 1. 2. 3关系规则


    +   - 基于笛卡尔积的子集的关系定义，在各种不同的商业数据库产品中又有一些规则，这些规则告诉我们在表结构中哪些变化是允许的，哪些检索操作是受限的，这些规则也是我们在进行数据库设计时需要充分考虑的。

    +   - 关系规则是在关系模型的发明者E.F.Codd的一系列论文中提出，这些规则反映了特定的数学假设，目的是为了建立一个良好的关系结构。

    +   - 出现新的对象-关系模型是因为人们认为从数学出发的关系规则有点太严格，无法容纳一些有价值的思想，特别是面向对象的系统分析思想出现之后。'
  - '[PAGE 30]


    # 规则1 列是同质的


    +   - 每一列中的分量是同一类型的数据，来自同一个域。每一列为一个属性，要给与不同的属性名。\n  该规则对应：设计表时，确定了表名之后，给每一个字段命名，并确定字段类型、长度。


    +   - 注：不同的DBMS所支持的数据类型，能够处理的数据长度不一定相同。不同的DBMS当字段类型发生变化时，对已有数据的处理规则也不相同。例如：字段学号原来是字符型，现在该为数值型，那末已存在的字符型学号是否直接变成数值型。不同DBMS下的数据进行移动交换时，处理规则也不相同，数据导入导出时要特别注意此问题。对于来自于枚举型数值域的列，可通过参照表和被参照表的方式实现。'
  - '[PAGE 31]


    # 规则2 第一范式规则


    +   - 关系模型要求关系必须是规范化的，即要求关系中不允许含有多值属性和含有内部结构，遵守这样规则的表称为第一范式。关系的每一个分量必须是一个不可分的的数据项，不允许表中还有表。

    +   - 第一范式规则是关系模型的基本规则，但在对象-关系数据库系统中，这一规则将不再是数据库设计的一个约束。以后我们会讨论对象-关系模型时知道，打破第一范式规则的途径是该模型中允许表中对象列的值是包含复杂类型的集合。用户可以自定义数据类型，某一字段可以是用户定义的复杂类型。'
