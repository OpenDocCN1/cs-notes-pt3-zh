    \n- 数据在分布式数据库的存储途径\n\n- 复制\n\n系统维护关系的几个完全相同的副本，这些副本存储在不同的结点上。\n\n- 分片\n\n关系被划分为几个片段，各个片段存储在不同的结点上。分片方式\n\
    \n- 水平分片：将关系r按行分为若干子集r1，r2，...，rn，每个子集ri称为一个水平片段。一个水平片段可以看成是关系上的一个选择。\n\n- 垂直分片：将关系r按列分为若干属性子集r1，r2，...，rn，每个子集ri称为一个垂直片段。一个垂直片段可以看成是关系上的一个投影。\n\
    \n- 分布（网络）透明性\n  - 分片透明性：用户或应用程序只对全局关系进行操作而不必考虑关系的分片。如果分片模式改变了，通过调整全局模式与分片模式之间的映射关系来保持全局模式不变。\n\
    \  - 位置透明性：用户或应用程序不必了解片段的存储位置。\n  - 局部数据模型透明性：用户或应用程序不必了解局部场地上使用的是哪种数据模型。\n\n\
    - 分布式数据库系统(DDBS)的组成:全局用户、局部用户；全局数据库(GDB)、局部数据库(LDB)；全局数据库管理系统(GDBMS)、局部数据库管理系统(LDBMS)；全局数据分配(GDD)、局部数据分配(LDD)。\n\
    \n## 3.4 中间件\n\n- 在分布式计算环境中，有两层的C/S模式、三层的C/S模式、三层的B/S模式以及多层的计算模式，不同层次之间需要相互通信。\n\
    - 在两层系统中，关系数据库开发商提供一些专用库和驱动程序来访问数据库。由这些专用程序对不同网络协议进行抽象，在写客户应用程序时无需考虑数据库的实际位置，客户层应用程序可以链接适当的动态或静态库与数据层进行通信，这些动态或静态库保证了请求和数据格式的一致、访问优化、分布式服务管理，称为中间件(如ODBC)。\n\
    \n- 中间件作用：保证网络中各部件之间透明地连接，即隐藏网络部件的异构性，保证不同网络、不同DBMS和某些访问语言的透明性。\n  - 网络透明性：能支持所有类型网络。\n\
    \  - 服务器透明性：不管服务器的DBMS是何种型号，一个好的中间件都能通过SQL语言连接起来。\n  - 语言透明性：客户机可用任何语言进行请求和接受回答，并保证数据类型的相互转换。\n\
    \n- 由于用途不同，存在不同种类的中间件，主要有数据访问中间件、远程过程调用中间件、分布式事务处理中间件、对象调用以及面向消息的中间件等。\n- 不同种类的中间件基于不同的通信模型。\n\
    \n为了满足不同客户实现（编程语言）的需要，中间件技术在近10年中得到极大发展。第一个获得广泛认可的中间件技术是远程调用中间件（RPC）。使用远程过程调用，客户可以在远程计算机上执行C语言函数。对于远程过程调用体系结构来说，ONCRPC(Open\
    \ Network Computing RPC)和DCE(Open Group’s Distributed Coputing Environment)是主流标准。\n\
    \n- 随着面向对象语言的流行，分布式中间件也朝面向对象方向发展，OMG(对象管理组织)提出了CORBA(Common Object Request Broker\
    \ Architecture)，微软提出了COM(Component Object Model)，都是规范分布式对象体系结构的尝试。许多开发商推出了基于这些规范的中间件。\n\
    \nIBM早在20世纪90年代初就提出了系统对象模型SOM(System Object Model)。为了避开与微软竞争，IBM也转向了CORBA。\n\n\
    - ODBC (Open Database Connect)它是由Microsoft公司于1991年提出的一个用于访问数据库的统一界面标准，是应用程序和数据库系统之间的中间件。它通过使用相应应用平台上和所需数据库对应的驱动程序与应用程序的交互来实现对数据库的操作，避免了在应用程序中直接调用与数据库相关的操作，从而提供了数据库的独立性。\n\
    \n传统的数据库编程方式是‘主语言+DML’。由于各厂商的SQL版本不同，不同厂商的DBMS在客户机与服务器之间使用的通信协议不同，使得特定的前端应用不能访问不同的数据库。因此有必要建立一个公共的、与数据库无关的应用程序设计接口(Application\
    \ Programming Interface, API)。最先推出的公共API是微软的ODBC。它以C/S结构为设计基础。\n"
  mdcn: "\n\n## 3.3.5 浏览器/服务器模式\n\n- 基于浏览器/服务器计算模式的系统应运而生，它继承了C/S模式的优点，十分容易地实现了不同网络间的连接。\n\
    - 目前应用广泛的浏览器/服务器计算模式主要是浏览器以超文本的形式向Web服务器提出访问数据库的请求，Web服务器接到客户请求后，激活对应的CGI程序将超文本HTML语言转化为SQL语法，将这个请求交给数据库，数据库服务器得到请求后，验证其合法性，并进行数据处理，然后将处理结果集返回CGI程序。CGI再将结果集转化为HTML，并由Web服务器转发给请求方的浏览器。\n\
    \n- 在浏览器/服务器模式中，客户端的标准配置是浏览器，业务处理功能处理从C/S代码中分离出来，由独立的应用服务器处理，Web服务器成为应用处理的标准配置，数据处理仍然由数据库服务器处理。浏览器/服务器模式是三层分布结构，即浏览器-Web服务器-数据库服务器。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_290_0.png)\n\n- 浏览器/服务器的三种工作方式：\n \
    \ - 简单式：Web浏览器需要一个HTML页面时就提交一个URL地址到Web服务器，Web服务器从Internet上检索到所需的本地或远程的网页，并将页面返回到浏览器。也可使用Java\
    \ Applet、ActiveX和Java Bean来加强表达。\n    该模型只限于使用HTTP协议进行通信。\n  - 交互式：在打开与服务器连接及传输数据以前，HTML获取用户输入的表单、文本域、按钮，通过这些内容取得与用户的交互。HTTP服务器将输入信息传递服务器程序或某个脚本进行处理，Web服务器再从DBMS服务器中检索数据，然后返回浏览器，最后中断浏览器和服务器连接。\n\
    \    该模型已经是三层结构，但每一个浏览器和服务器间的通信都要建立一个连接，造价昂贵。\n\n**— 分布式：** 客户程序是由可下载的Java编写，当HTTP服务器将含有Java小应用程序（Java\
    \ Applet）的页面下载到浏览器时，小应用程序在浏览器中运行并通过构件与传输服务器上的小服务程序（Servlet）通信会话，小服务程序收到信息后，经过JDBC、ODBC或本地方法向数据库服务器发出请求，数据库服务器接到命令后，再将结果传给Servlet，最后送至浏览器。\n\
    \n这种方式引入了分布式计算构件概念，使得函数也可以在网络上传递。这样，在网络环境下，不同电脑、不同操作系统之间的应用程序就可以彼此沟通，达到“平台无关”。\n\
    \n该模型已不再局限于Web服务器和HTTP协议，还有DCOM、CORBA协议等。\n\n- 浏览器/服务器模式引发了另外一个专门的技术领域Web数据库。\n\
