  - '[PAGE 229]


    # 3.1.2 游标


    +   - SQL与主语言之间操作方式的协调

    +     SQL：一次一集合。

    +     C语言：一次一记录。

    +     - 游标：在查询结果的记录集合中移动的指针。

    +     若一个SQL语句返回单个元组，则不用游标。

    +     若一个SQL语句返回多个元组，则使用游标。

    +     - 不需要游标的数据操作

    +   - 结果是一个元组的select语句


    ```

    exec sql select came,discnt

    into :cust_name,:cust_discnt

    from customers where cid=:cust_id;

    ```'
  - '[PAGE 230]


    # 3.1.2 游标


    – 需要游标的数据操作


    当select语句的结果中包含多个元组时，使用游标可以逐个存取这些元组。


    活动集： select语句返回的元组的集合。


    当前行： 活动集中当前处理的那一行。游标即是指向当前行的指针。


    游标分类：


    +   - 滚动游标：游标的位置可以来回移动，可在活动集中取任意元组。


    +   - 非滚动游标：只能在活动集中顺序地取下一个元组。


    +   - 更新游标：数据库对游标指向的当前行加锁，当程序读下一行数据时，本行数据解锁，下一行数据加锁。'
  - "[PAGE 231]\n\n# 3.1.2 游标\n\n+   - 定义一个游标，使之对应一个select语句\n+   \n+     **DECLARE**\
    \ 游标名 [**SCROLL**] **CURSOR**\n+     **FOR** select语句 [**for update [of列表名]**]\n\
    +   \n+     for update任选项，表示该游标可用于对当前行的修改与删除。\n\n+   - 打开一个游标，执行游标对应的查询，结果集合为该游标的活动集。\n\
    +   \n+     **OPEN** 游标名\n+   \n+     在游标被声明之后,它仍然不是活动状态,在程序开始检索信息之前,执行SQL的OPEN语句打开这个游标，游标被打开之后，可使用取（fetch）操作从游标中每次检索一行，程序完成检索后，应关闭游标。"
  - '[PAGE 232]


    # 3.1.2 游标


    +   - 在活动中将游标移到特定的行，并取出该行数据放到相应的宿主变量中。

    +     FETCH [NEXT | PRIOR | FIRST | LAST | CURRENT | RELETIVE n | ABSOLUTE n]
    游标名 INTO [宿主变量表]

    +   - 关闭游标，释放活动集及其所占资源。需要再使用该游标时，执行open语句。

    +     CLOSE 游标名

    +   - 删除游标，以后便不能再对该游标执行open语句了。

    +     FREE 游标名'
