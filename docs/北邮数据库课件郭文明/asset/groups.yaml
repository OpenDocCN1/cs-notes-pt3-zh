    # 1.3.3.4 高级SQL语法


    +   • 以下介绍的高级SQL运算符不是Entry SQL-92的部分，但几乎都属于SQL-99，目前产品中不一定支持，但可能出现在未来的数据库产品中。


    +   • 1) INTERSECT (∩) 和 EXCEPT (−) 运算符


    ```

    Subquery [UNION [ALL]] INTERSECT [ALL] EXCEPT [ALL] Subquery

    ```


    注：Core SQL-99只有EXCEPT而没有EXCEPT ALL。


