  - '[PAGE 243]


    # 3.2 事务处理技术


    +   - 保证数据的一致性和数据库的并行性，是衡量一个数据库的最基本和最重要的指标之一。


    一致性：以一致性规则为基础的数据逻辑关系。如转账任务不能造成账户金额的不平衡。


    并行性：各个用户能够实现对数据库资源的共享。


    数据并发是多用户系统的基本要求，数据一致是因为有数据并发存在，为了适应多用户系统，协调管理数据库中的数据，保证各个用户的任务能够顺利准确地完成。


    事务处理是实现数据库一致性和并行性的重要手段。在保证一致性的前提下最大限度地提高并发度。'
  - '[PAGE 244]


    # 3.2 事务处理技术


    +   - 数据操纵以SQL为基础，但单条SQL语句不一定能完成所有的用户请求，许多用户请求需要若干条SQL语句，而且这些语句有关联，要么全做，要么全不做。

    +   - 如果许多用户的众多SQL语句不加控制，随意执行，必然破坏数据的一致完整，出现丢失修改、不可重复读、读脏数据的错误。

    +   - 数据库系统要对用户的操作进行控制(事务控制和封锁技术)，保证并发的同时保证数据的一致。'
  - '[PAGE 245]


    # 3.2.1 事务概念


    +   - 事务是由一系列操作序列构成的程序执行单元，这些操作要么都做，要么都不做，是一个不可分割的工作单位。


    事务是数据库提供的一种手段，应用程序员将一系列操作组合在一起作为一个整体以便数据库系统提供保证。事务才是对数据库系统进行操作的最小合法单位。DBMS在事务级而不是在语句级确保数据的一致性。


    +   - 事务以Begin transaction开始，以Commit work或Rollback work结束。


    嵌入式SQL: EXEC SQL COMMIT WORK;

    EXEC SQL ROLLBACK WORK;'
  - '[PAGE 246]


    # 3.2.1 事务概念


    +   - Commit work表示提交，事务正常结束。


    Rollback work表示事务非正常结束，撤销事务已做的操作，回滚到事务开始时状态。


    事务的内容只限于数据更新操作(增删改),不包含其他SQL命令。


    在标准SQL中，没有Begin transaction语句，上一条Commit或Rollback或SQL修改命令即为事务的开始。


    有的DBMS使用Begin transaction作为事务的开始。'
  - '[PAGE 247]


    # 3.2.1 事务概念


    +   - 事务特性(ACID)

    +     - 原子性(Atomicity)

    +     - 一致性(Consistency)


    事务的更新操作必须作为一个整体，其中包含的所有操作要么全做，要么全不做。原子性由系统恢复机制实现。


    事务的成功完成将数据库从一个一致状态转变到另一个一致状态。事务开始前，数据库处于一致性的状态；事务结束后，数据库必须仍处于一致性状态。数据库的一致性状态由用户来负责。'
  - '[PAGE 248]


    # 3.2.1 事务概念


    +   - 事务特性(ACID)


    +   - 隔离性(Isolation)


    系统必须保证事务不受其它并发执行事务的影响。


    对任何一对事务T₁，T₂，在T₁看来，T₂要么在T₁开始之前已经结束，要么在T₁完成之后再开始执行。


    隔离性通过并发控制机制实现。


    +   - 持久性(Durability)


    一个事务一旦提交之后，它对数据库的影响必须是永久的，无论发生何种系统故障。


    持久性通过恢复机制实现。


    事务的原子性、隔离性、持久性由数据库系统加以保证，一致性一般由程序员在编写程序中予以保证。'
  - "[PAGE 249]\n\n# 3.2.2 事务的调度\n\n+   - 事务的调度：DBMS在处理用户提交事务时的策略，即事务调度。事务的执行顺序称为一个调度，表示事务的指令在系统中执行的时间顺序。\
    \  \n+     - 一组事务的调度必须保证\n+       - 包含了所有事务的操作指令\n+       - 一个事务中指令的顺序必须保持不变。\n\
    +     - 串行调度\n+       - 在串行调度中，属于同一事务的指令紧挨在一起。\n+       - 对于有n个事务的事务组，可以有n！个有效调度。\n\
    +     - 并行调度\n+       - 在并行调度中，来自不同事务的指令可以交叉执行。\n+       - 当并行调度等价于某个串行调度时，则称它是正确的。"
  - '[PAGE 250]


    # 3.2.2 事务的调度


    +   - ANSI SQL-99标准中，一致性级别(隔离级别)的定义

    +     - serializable: 一个调度的执行必须等价于一个串行调度的结果。

    +     - repeatable read: 只允许读取已提交的记录，并要求一个事务对同一记录的两次读取之间，其它事务不能对该记录进行更新。

    +     - read committed: 只允许读取已提交的记录，但不要求可重复读。

    +     - read uncommitted: 允许读取未提交的记录。

    +   - 在SQL-99的语法中允许在启动事务的SQL语句之前设置隔离级别。'
  - '[PAGE 251]


    # 3.2.3 事务的数据封锁


    +   - 数据库管理系统采用数据锁定技术和事务技术解决并发性和一致性问题.数据锁定有两种锁定模式:

    +     专用锁:当一个事务以专用方式锁定某个资源时,只有此事务可以改变其中的内容,在该事务结束或释放其资源后,其它事务才能使用;

    +     共享锁:允许已锁定的资源被其它事务适度共享,多个事务可以在同一资源上申请共享锁。


    +   - 根据锁定的类型、持锁时间、何时释放的规则,将锁定协议分为一级锁定协议、二级锁定协议、三级锁定协议。不同锁定协议在不同程度上保证数据一致性和系统并发性。'
  - '[PAGE 252]


    # 3.2.3 事务的数据封锁


    +   - 在SQL语句执行时,所有必要的锁定均由DBMS自动完成(也可显式加锁),事务中所有为执行SQL语句建立的锁定均要延续到事务结束时才能释放,否则一个数据库对象在同一时间段内被多个事务交替操作,可能造成对数据库数据的破坏。


    +   - 当参与封锁的事务较多,而每个事务封锁的资源也较多时,可能出现‘死锁’情况。


    +   - 预防死锁的方法有一次封锁法、顺序封锁法。


    +   - 死锁的诊断有超时法、有向图法。死锁发生后,DBMS通常选择一个处理死锁代价最小的事务将其撤消,并恢复该事务。'
  - '[PAGE 253]


    # 3.2.3 事务的数据封锁


    +   - 两段锁协议(Two-phase Locking)

    +     - 内容：

    +       ① 在对任何数据进行读写之前，事务首先要获得对该数据的封锁。

    +       ② 在释放一个封锁之后，事务不再获得任何其它封锁。

    +       即事务分为两个阶段：

    +       生长阶段：获得锁。

    +       收缩阶段：释放锁。

