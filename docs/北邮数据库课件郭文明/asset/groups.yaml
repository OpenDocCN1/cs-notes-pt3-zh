  - "[PAGE 86]\n\n# 1.3.2.5 视图的创建和删除\n\n+   - 视图是关系数据库系统提供给用户以多种角度观察数据库中数据的重要机制。视图一经定义，就可以和基本表一样被查询、被删除，我们也可以在一个视图之上再定义新的视图，但对视图的更新（增加、删除、修改）操作则有一定的限制。\n\
