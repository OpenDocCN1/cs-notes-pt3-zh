    # 4.2 ORACLE数据库实例管理


    +   - Oracle服务器就是数据库管理系统(DBMS)，由数据库(Oracle database)和实例(Oracle instance)组成。

    +   - 实例是一系列复杂的内存结构和操作系统进程，它为Oracle客户提供所期望的不同程度的服务。一个实例只能打开一个数据库，或者说一个数据库被唯一的一个实例装载。


