    \ 浏览器/服务器模式\n- 3.3.6 分布式数据库体系结构\n\n## 3.3.1 简介\n\n- 早期数据库系统是集中式的体系结构，所有访问数据库的应用程序以及用户终端发送并接受数据的通信都在一个宿主计算机\
    \ (UNIX大型或小型机) 上运行。\n- 随着PC机的兴起，单用户的DBMS出现，DBMS的功能和数据库应用功能结合在一个应用程序中，数据库应用处理用户输入和屏幕输出的同时，也处理对数据库中数据的访问。\n\
    - 基于PC的单用户DBMS不支持事务处理和回退恢复，不能保证数据的安全和完整，但查询速度并不一定慢。\n\n- 基于PC的多用户DBMS建立在文件服务器前提下，客户端运行服务器的应用程序，文件服务器将客户申请的文件传送给客户机器，数据处理过程在客户机器上进行。这种方式网络传输的是数据文件，传输量大，数据锁定在解决并发时存在困难。\n\
    - 事务处理的性质使数据库系统从集中式、PC系统过渡到客户机/服务器系统，并使分布式系统成为可能。\n- 客户机/服务器系统最本质的特点在于：客户PC运行数据库应用（界面处理），数据库服务器运行全部或大部分DBMS（数据处理）。服务器运行SQL，将查询结果传送到客户端，减少了网络信息的传输，系统采用数据锁定、事务技术、存储过程等数据库技术保证数据完整一致准确。\n\
    \n## 3.3.2客户机/服务器结构\n\n- 客户机/服务器(Client/Server)结构可以指硬件结构，也可以指软件结构。\n  - 硬件结构指某项任务在两台或多台计算机之间进行分配,\
    \ 客户机来运行提供用户接口和前端处理的应用程序, 服务器提供可供客户机使用的各种资源和服务。\n\n客户机在完成某一项任务时，通常要利用服务器上的共享资源和服务器提供的服务。在一个客户机/服务器体系结构中可以有多台客户机、多台服务器。\n\
    \n- **软件结构**指把一个应用系统按照逻辑功能分成四个组成部分:用户界面、应用表示逻辑、事务逻辑、数据管理，按照其相对角色的不同区分为客户端和服务器端软件。客户软件能够请求服务器软件的服务。客户软件和服务器软件可以分布在网络中不同的计算机节点上，也可以放置在同一台计算机上。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_272_0.png)\n"
  mdcn: "\n\n## 3. 2. 4 ORACLE事务控制-回退段\n\n- 在数据库创建时SYSTEM表空间中建立了SYSTEM回退段。每个数据库可以有一个或多个回退段，最好只将SYSTEM回退段用于系统事务，将用户事务分配在其他回退段上，以提高资源利用率。\n\
    - 创建回退段时可同时设定其存储参数，回退段至少要包括两个区间(MINEXTENTS)，回退段的区间总数受到回退段存储参数MAXEXTENTS的限制。\n\
    - 一个事务的回退信息按顺序在指定的回退段中写入。创建多少个回退段及给每个回退段分配多少区间，要考虑可能出现的最大并发事务数，每个回退段所能同时服务的事务数。\n\
    \n事务的执行过程（采用日志和回退段双重记录事务活动）：\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_259_0.png)\n\
    \n## 3. 2. 5 ORACLE事务控制-语句\n\n- ORACLE事务控制语句:\n  - **COMMIT [WORK];**\n    清除本事务的全部保留点,清除为执行事务建立的锁定机制,结束本事务,提交数据.\n\
    \  - **SAVEPOINT 保留点名;**\n    保留点是一事务范围内的中间标志,经常用于将长事务划分为短小的部分,保留点可标志在长事务的任何点,允许回退该点之后的工作.保留点主要作为一种调试手段使用.在一个事务中如果用相同的保留点名创建第二个保留点,则前一个保留点被删除掉,每个事务最大的活动保留点由初始化参数文件中的参数\
    \ SAVEPOINTS设定,极限值为255.\n\nROLLBACK [WORK] [TO] [SAVEPOINT] 保留点名;\n\n清除本事务的全部保留点,清除为执行事务建立的封锁机制,结束本事务,回退数据.\n\
    \n数据定义语句CREATE、DROP总触发提交，系统正常关闭时，未提交事务将隐式提交，一个进程或例程非正常终止，未提交事务将隐式回退。\n\nSET TRANSACTION\
    \ [READ ONLY] [READ WRITE] [USE ROLLBACK SEGMENT 回退段名];\n\n设置事务是对事务的一种控制，建立当前事务为只读事务或读写事务，控制事务使用指定的回退段空间。只读事务不生成回退信息，所以不必分配回退段。缺省状态下事务为读写事务。\n\
    \n## 3.2.6 ORACLE事务控制-数据锁\n\n- ORACLE提供了各种类型的封锁机制保证并发操作时数据的一致，对数据库对象的封锁由系统自动完成。数据库应用设计者可以干预自动封锁过程以提高整体效率。\n\
    \n- ORACLE主要封锁类型有：\n  - 数据锁：目的是保护数据,用于封锁表和表中的某些行；\n  - 字典锁：目的是保护数据库对象的结构,用于表对象的定义；\n\
    \  - 内部锁：用于保护数据库的内部结构,如文件等。\n\n- 数据锁有两种级别的封锁方式：\n  - 表封锁:封锁表中的所有行,数据并行度低.\n  -\
    \ 行封锁:行级封锁在对应表上加字典锁.\n\nORACLE表上的数据锁类型有：\n\n- RS:行共享,用于让事务封锁表中的部分行,以便于数据修改,但在建立封锁时并不立即修改数据。当事务在一表持有行共享锁时,允许其他事务并行查询、插入、修改、删除。\n\
    \n- RX:行专有,事务可对表中部分行建立专有锁，使事务可以在以后的操作中多次修改这些行。具有行专有锁的表允许其他事务并行查询、插入、修改、删除。\n\n\
    - S:共享,共享锁将阻止其他事务修改表中的内容，具有共享锁的表拒绝其他事务插入、修改、删除。\n\n- SRX:共享行专有,每个表上的共享行专有锁只能由一个事务建立，有这种类型锁的表只能允许其他事务查询。\n\
    \n| SQL语句 | 封锁 | 允许模式 RS | RX | S | SRX | X |\n|---|---|---|---|---|---|---|\n\
    | Select | 无 | Y | Y | Y | Y | Y |\n| Insert | RX | Y | Y | N | N | N |\n| Delete\
    \ | RX | Y | Y | N | N | N |\n| Update | RX | Y | Y | N | N | N |\n| Select for\
    \ update of | RS | Y | Y | Y | Y | N |\n| Lock table in row share mode | RS |\
    \ Y | Y | Y | Y | N |\n| Lock table in row exclusive mode | RX | Y | Y | N | N\
    \ | N |\n| Lock table in share mode | S | Y | N | Y | N | N |\n| Lock table in\
    \ share row exclusive mode | SRX | Y | N | N | N | N |\n| Lock table in exclusive\
    \ mode | X | N | N | N | N | N |\n\n- 数据库设计者应该利用各种方法减少数据对象的封锁时间，以提高系统并发能力：\n \
    \ 在事务中尽可能晚地发出封锁申请；\n  在备份的数据库对象上操作以减少封锁时间；\n  利用索引减少封锁时间，查询操作可以根本不访问索引关联的表，而直接给出查询结果。\n\
    \n- 数据库设计者应该按照约定顺序封锁表减少出现死锁的可能性，以提高系统并发能力。\n\n## 作业：\n\n- 1. 解释游标。\n- 2. 针对CAP数据库,\
    \ 编写一应用程序: 给出任一产品的pid, 列出购买该产品的前5名顾客 (cid, cname) 及其购买数量, 即这些顾客购买该产品的数量最大。\n-\
    \ 3. 说明数据库管理系统保证数据一致性和并发性的机制。\n- 4. ORACLE为什么设置回退段？\n- 5. 数据库设计者在保证数据一致性和并发性方面可以有哪些措施？\n\
