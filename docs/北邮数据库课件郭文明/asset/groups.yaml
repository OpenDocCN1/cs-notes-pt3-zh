    # 5.2 实体联系模型


    实体联系模型 (Entity Relationship Model) 是 P. P. Chen 于 1976 年首先提出的，此后此模型不断扩展和完善，成为被广泛采用的概念模型设计方法。这个模型直接从现实世界中抽象出实体类型及实体间联系，然后用实体联系图
    (ER 图) 表示数据的抽象和数据的联系。设计 ER 图的方法称为 ER 方法。


    +   - 5.2.1 ER 模型的概念

    +   - 5.2.2 ER 图的绘制

    +   - 5.2.3 ER 模型的转换

    +   - 5.2.4 数据库设计工具 (CASE)

    +   - 5.2.5 ER 模型实例分析'
  md: "\n### 5.1.3 概念设计\n\n概念模型评审\n\n评审分为用户评审与DBA及应用开发人员评审两部分。用户评审重点放在确认全局概念模式是否准确完整反映了用户的信息需求和现实世界事物的属性间的固有联系，DBA和应用开发人员评审侧重于完整性、一致性。被评审的文档资料应包括局部概念结构描述、全局概念模式描述、数据清单和业务功能清单。\n\
    \n没有概念模型的评审过程，数据库设计人员和开发人员可能承担过多的责任。\n\n### 5.1.4 逻辑设计\n\n概念设计的结果是得到一个与DBMS无关的概念模式。而逻辑设计的目的是把概念模式设计阶段的全局ER模式转换成与选用的具体机器上的DBMS所支持的数据模型相符合的逻辑结构。\n\
    \n逻辑结构即数据库模式，包括内模式、模式和外模式。逻辑设计主要设计模式和外模式，关系数据库可以说是数据库表和视图等。（例如Oracle的逻辑结构包括表空间及数据库对象）。\n\
    \n逻辑设计可表示如下示意形式：\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_544_0.png)\n\n逻辑设计的步骤：\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_545_0.png)\n\n**ER模式向关系模式转换**\n\n一个实体型转换为一个关系模式，实体的属性即为关系模式的属性，实体的标识符即为关系模式的键。\n\
    \n联系类型的转换，根据不同情况做不同的处理：\n\n1. 若实体间的联系是一对一的，可以在两个实体类型转换成的两个关系模式中的任意一个关系模式的属性中加入另一个关系模式的键和联系类型的属性。也可能做合并关系模式处理。\n\
    \n例：学院与院长之间是一对一，在学院关系模式中加入院长关系模式的键。\n\n2. 若实体间的联系是一对多的，则在多端实体类型转换成的关系模式中加入一端实体类型转换成的关系模式的键和联系类型的属性。\n\
    \n例：学院与教师之间是一对多，在教师关系模式中加入学院关系模式的键。\n\n3. 若实体间的联系是一对多的，而且在多端实体类型为弱实体，转换成的关系模式中将一端实体类型(父实体)的键作为外键放入多端的弱实体(子实体)中。弱实体的主键由父实体的主键与弱实体本身的候选键组成。也可以为弱实体建立新的标识ID。\n\
    \n例：学生与社会关系之间是一对多，社会关系是弱实体，在社会关系关系模式中加入学生关系模式的键学号，由学号和称呼两属性组成社会关系关系模式的主键。\n\n\
    4. 若实体间的联系是多对多的，则将联系类型也转换成关系模式，其属性为与该联系相连接的各个实体的码以及联系的属性，而键是与该联系相连的各个实体的码的组合，或者是与该联系相连的各个实体的码和联系的附加属性的组合。\n\
    \n例：学生与课程之间是多对多，建立学生课程联系关系模式，学号和课程号组成学生课程联系关系模式的键。CAP数据库中Orders的码由顾客实体、代理商实体、产品实体的码和日期组成。\n\
    \n**规范化处理**\n\n规范化处理的目的是减少乃至消除关系模式中存在的各种异常，改善完整性、一致性和存储效率。\n\n对于有经验的数据库设计人员而言，在进行ER图的建立和关系模式转换时，已经考虑到规范化的要求，专门的规范化步骤往往指不能确定的实体类型、联系的关系转换。\n\
    \n一般的规范化过程是基于3NF或BCNF的标准进行的。在规范化模式合并和模式分解过程中，要特别注意保持依赖和无损连接要求（规范化内容参见5.3）。\n\n\
    **模式评价**\n\n模式评价的目的是检查已给出的数据库模式是否完全满足用户的功能要求，是否具有较高的效率。并确定需要加以修改的部分。\n\n**模式修正**\n\
    \n根据模式评价结果对已生成的模式进行修改。\n\n在逻辑设计阶段，还要设计出子模式，子模式体现各个用户对数据库的不同观点。\n\n### 5.1.5 物理设计\n\
    \n数据库物理设计主要指数据库的存储记录格式、存储记录安排和存取方法，包括索引机制、空间大小、块的大小等，物理设计的目的是以合适的存储空间得到用户事务的快速响应（时间和空间的效率）。\n\
    \n- 是在计算机的物理设备上确定应采取的数据存储结构和存取方法，以及如何分配存储空间等问题。\n- 物理设计与特定硬件系统、DBMS等相关，难以形成统一的设计方法。\n\
    \n**索引选择**\n\n索引文件对存储记录进行内部链接，从逻辑上改变了记录的存储位置。\n\n**记录聚簇**\n\n不改变逻辑数据库的模式结构，根据不同的使用要求，将属性记录或文件集中存放在不同的位置。\n\
    \n第四章Oracle中探讨了许多的数据存储问题，即物理设计问题。\n\n**物理设计的过程：**\n\n- 使用DBMS的可用功能完成基表的设计和完整性约束和业务规则。\n\
    - DBMS为数据提供了许多可选择的文件组织方式，基于对事务的分析，选择合适的文件组织方式，何时选择索引。\n- 考虑放宽规范化约束，改善系统性能。怎样处理派生数据，历史数据。考虑重复列或连接表。\n\
    - 设计安全措施来避免对数据未经授权的访问，如何实现每个用户的视图，以及表上需要的访问控制。\n- 不断通过监听操作系统来标识和解决由设计引起的性能问题，并实现新的或改变的需求。\n\
    \n### 5.1.6 数据库应用程序开发\n\n数据库应用程序开发即应用程序的设计、编码、调试和试运行过程。其中应用程序设计是对用户界面和使用数据库的程序的设计。应用程序设计是数据库应用程序开发的重要环节。\n\
    \n功能分析的结果是应用程序设计的重要依据。\n\n根据逻辑设计和物理设计的结果，在计算机系统上建立起实际的数据库结构，装入部分实验数据，应用程序的开发建立在实验数据基础上，实验数据应尽量采用实际数据，并尽可能覆盖现实世界的各种情况。\n\
    \n应用程序开发的主要工作：\n\n- 应用程序设计：应用程序设计主要包括事务设计和用户界面设计。\n  - 事务代表了现实世界的事件，事务设计包括事务使用什么数据，事务要做什么，事务的输出，事务的使用频度。事务有检索事务、更新事务、混合事务之分。\n\
    \  - 用户界面设计要易于掌握、操作直观。界面设计可考虑：\n    - 有意义的标题\n    - 可视化空间布局与边界\n    - 常用字段标签\n\
    \    - 不可接受的错误信息提示\n    - 便利的游标活动\n    - 一致性的术语和缩略语\n    - 一致的颜色和字体\n    - 一致的操作快捷方式（尽可能地非鼠标化操作）\n\
    \    - 一致的鼠标操作方式\n- 应用程序编写\n- 组织数据入库\n- 应用程序的调试与试运行\n- 整理文档\n\n应用程序开发完成后，要进行装入实际数据的试运行，试运行的过程是进一步检测系统功能的过程。对于重要系统的试运行过程中，原系统(可能是手工方式)的运行应当平行进行，以防止由于系统错误带来用户不可弥补的损失。\n\
    \n数据库系统正式运行，标志着数据库设计与应用开发工作的结束和维护阶段的开始，运行维护阶段的任务包括：\n\n- 维护数据库的安全性和完整性：检查系统安全性是否受到侵犯，及时调整授权和密码，实施系统转储与后备，发生故障及时恢复。\n\
    - 监测并改善数据库性能：对数据库的存储空间状况及响应时间进行分析评价，结合用户反应确定改进措施。\n- 必要时对数据库进行重新组织和重新构造。\n- 根据用户要求对数据库现有功能进行扩充。\n\
    \n数据库运行和维护的工作就是DBA的工作。\n\n### 作业：\n\n1. 数据库系统设计人员应具备哪些知识？\n2. 数据库系统设计的方法有哪些？\n\
    3. 需求分析的内容是什么？\n4. 简述概念模型评审的必要性。\n5. 结合第四章内容说明逻辑设计和物理设计的内容。\n\n## 5.2 实体联系模型\n\
    \n实体联系模型 (Entity Relationship Model) 是 P. P. Chen 于 1976 年首先提出的，此后此模型不断扩展和完善，成为被广泛采用的概念模型设计方法。这个模型直接从现实世界中抽象出实体类型及实体间联系，然后用实体联系图\
    \ (ER 图) 表示数据的抽象和数据的联系。设计 ER 图的方法称为 ER 方法。\n\n- 5.2.1 ER 模型的概念\n- 5.2.2 ER 图的绘制\n\
    - 5.2.3 ER 模型的转换\n- 5.2.4 数据库设计工具 (CASE)\n- 5.2.5 ER 模型实例分析\n"
