- raw:
  - '[PAGE 607]


    # 5.3.3 关系模式的分解特性


    +   - 规范化过程是建立在模式分解基础上的，将表分解成为两个或更多较小的表，可以通过把分解出的表连接起来重新获得原始表的详细信息。

    +   - 定义：对于任何表R(U)，R的一个分解是一个表的集合{R₁(U₁), R₂(U₂), ..., Rₖ(Uₖ)}，该集合具有性质：Uᵢ是U的一个子集且U=U₁∪U₂∪...∪Uₖ。

    +   - R分解成R₁, R₂, ..., Rₖ的目的是为了消除数据冗余和操作异常现象。如果分解后的表表示了不同的内容，分解就没有什么意思。'
  - '[PAGE 608]


    # 5.3.3 关系模式的分解特性


    +   - 可以从两个角度来考虑模式的分解：

    +     1. 无损分解：分解后的表能够通过连接运算恢复分解前表的内容，保证分解前表的内容没有损失。

    +     2. 保持依赖：在模式 R 上有一个 FD 集 F，在 Rᵢ 上有一个 FD 集 Fᵢ，那么 {F₁, F₂, …, Fₖ} 与 F 应该等价，即
    {F₁, F₂, …, Fₖ}⁺ = F⁺。

    +   - 不是无损分解或没有保持依赖的分解很难说是一个好的模式设计。'
  - '[PAGE 609]


    # 5.3.4 范式和关系模式规范化


    +   - 范式(Normal Forms, NF)是与函数依赖有直接联系的，评价模式好坏的衡量标准。建立在函数依赖基础上的范式有1NF, 2NF, 3NF,
    BCNF。经常称某一关系模式为第几范式，表明该关系模式是符合某一种范式级别的关系模式。


    +   - 一个低一级范式的关系模式，通过模式分解可以转换为若干个高一级范式的关系模式的集合，这种过程就叫关系模式规范化。


    +   - 第一范式(1NF)：如果关系模式R的每个关系r的属性都是不可分的数据项，那么就称R是第一范式的模式。1NF是关系模式应具备的最起码的条件。关系数据库设计研究的关系规范化是在1NF之上进行的。'
  - '[PAGE 610]


    # 5.3.4 范式和关系模式规范化


    +   - 只符合1NF标准的关系模式不是好的数据库模式。前而介绍的工资管理模式2即为1NF。


    +   - 第二范式(2NF)：

    +     - 定义：对于FD W→A，如果存在X⊂W有X→A成立，那么称W→A是局部依赖(A局部依赖于W)；否则称W→A是完全依赖。

    +     - 定义：如果关系模式R是1NF，且每个非主属性完全函数依赖于候选键，那么就称R是第二范式。

    +     - 工资管理模式2属于1NF，但不属于2NF，因为非主属性‘姓名’、‘级别’、‘基本’、‘津贴’是部分函数依赖于候选键{工号, 扣款项目}的，1NF存在数据冗余、操作异常。'
  - '[PAGE 611]


    # 5.3.4 范式和关系模式规范化


    +   - 1NF模式通过分解可以达到2NF，方法是消除非主属性对候选键的部分依赖，把部分依赖的属性单独组建关系。

    +   - 工资管理模式2分解成模式3(如下表)，模式3属于2NF。


    工资管理模式3

    表1

    | 工号 | 姓名 | 级别 | 基本 | 津贴 |

    |------|------|------|------|------|

    | 001 | 张三 | 一级 | 800 | 2000 |

    | 002 | 李四 | 三级 | 1200 | 4000 |


    表2

    | 工号 | 扣款项目 | 扣款金额 |

    |------|----------|----------|

    | 001 | 考勤 | 120 |

    | 001 | 违纪 | 10 |

    | 002 | 考勤 | 20 |'
  - '[PAGE 612]


    # 5.3.4 范式和关系模式规范化


    +   - **第三范式**（3NF）：

    +     - 定义：如果 X→Y，Y→A 且 Y!→X 和 A!⊂Y，那么称 X→A 是**传递依赖**（A 传递依赖于 X）。

    +     - 定义：关系模式 R 中不存在这样的候选键 X、属性组 Y 和非主属性 Z（Z!⊂Y）使得 X→Y，(Y!→X) Y→Z 成立，即非主属性既不部分依赖也不传递依赖于
    R 的候选键，则称 R 是**第三范式**。

    +     - 工资管理模式 3 属于 2NF，但不属于 3NF，因为表1中非主属性“基本”、“津贴”是传递依赖于候选键{工号}的，2NF 存在数据冗余、操作异常。

    +     - **2NF 模式通过分解可以达到 3NF**，方法是消除非主属性对候选键的传递依赖，把传递依赖的属性单独组建关系。'
