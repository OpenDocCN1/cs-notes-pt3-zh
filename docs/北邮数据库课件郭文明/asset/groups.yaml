  - '[PAGE 599]


    # 5.3.2 函数依赖


    +   - 函数依赖(FD)定义了数据库系统中数据项之间相关性性质最常见的类型。建立在函数依赖的基础之上，作模式的进一步规范化。


    +   - 定义：设有关系模式R(U)，X和Y是属性集U的子集，函数依赖(Functional Dependency, FD)是形为X→Y的一个命题，对任意R中两个元组t和s，都有t[X]=s[X]蕴涵t[Y]=s[Y]，那么FD
    X→Y在关系模式R(U)中成立。X→Y读作‘X函数决定Y’，或‘Y函数依赖于X’。'
  - "[PAGE 600]\n\n# 5.3.2 函数依赖\n\n+   - 函数依赖举例：\n+   \n+     工资管理模式2中的函数依赖：\n+  \
    \ \n+     工号→姓名；工号→级别；级别→基本；\n+   \n+     级别→津贴；工号，扣款项目→扣款金额。\n+   \n+     以上函数依赖是根据实际语义，分析数据项之间相关性性得出的。\n\
    \n+   - 通常并不根据表的内容得出函数依赖，而是通过理解数据项和企业的规则来决定函数依赖。"
  - '[PAGE 601]


    # 5.3.2 函数依赖


    +   - 定义：设F是在关系模式R(U)上成立的函数依赖集，X和Y是属性集U的子集。如果从F推导出X→Y也在R(U)上成立，那么称F逻辑蕴涵X→Y。

    +   - 定义：设F是在关系模式R(U)上成立的函数依赖集，被F逻辑蕴涵的函数依赖集合，称为F的闭包，记为F⁺。

    +   - Armstrong公理：

    +     - 包含规则 (Inclusion rule)：如果Y⊂X，那么X→Y。

    +     - 传递规则 (Transitivity rule)：如果X→Y且Y→Z，那么X→Z。

    +     - 增广规则 (Augmentation rule)：如果X→Y，那么XZ→YZ。'
  - '[PAGE 602]


    # 5.3.2 函数依赖


    +   - Armstrong公理的一些逻辑蕴涵:

    +     - 合并规则 (Union rule) : 如果 X→Y 且 X→Z, 那么 X→YZ。

    +     - 分解规则 (Decomposition rule) : 如果 X→YZ, 那么 X→Y 且 X→Z。

    +     - 伪传递规则 (Pseudoransitivity rule) : 如果 X→Y 且 WY→Z, 那么 XW→Z。

    +     - 集合累积规则 (Set accumulation rule) : 如果 X→YZ 且 Z→W, 那么 X→YZW。


    在实际使用中，经常要判断能否从已知的FD集 F 推导出 X→Y (比如在决定候选键的过程中)，那么可以先求出 F 的闭包 F⁺，然后再看 X→Y 是否在 F⁺
    中。'
  - '[PAGE 603]


    # 5.3.2 函数依赖


    +   求解F的逻辑蕴涵问题是一个算法问题。


    +   Armstrong公理是函数依赖的一个正确的和完备的推理规则集，正确性是指‘从FD集F使用推理规则集推出的FD必定在F⁺中’，完备性是指‘F⁺中的FD都能从F集使用推理规则集导出’。


    +   函数依赖集F中的FD很多，我们应该从F中去掉平凡的FD、无关的FD、FD中无关的属性，以求得F的最小依赖集Fₘᵢₙ。


    +   从F求出F⁺是一个复杂的困难的算法问题(见参考资料1)。引入属性集的闭包概念将使该问题简化。


    +   建立在属性集的闭包的基础上，使得F的最小依赖集Fₘᵢₙ的求解算法变得简化可行(见参考资料1)。


    注：得到函数依赖的逻辑蕴涵的目的是建立在函数依赖基础上进行关系的规范化。'
  - '[PAGE 604]


    # 5.3.2 函数依赖


    +   定义：给定表T的函数依赖集F和属性集X，X函数决定的最大属性集合Y称为属性X的闭包X⁺， X⁺={属性Y | X→Y在F⁺中}。从X求出X⁺并不难。


    例：工资管理模式2中的属性闭包（推导过程见后页）：


    工号⁺={工号, 姓名, 级别, 基本, 津贴}；


    级别⁺={级别, 基本, 津贴}；


    {工号, 扣款项目}⁺={工号, 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}。'
  - '[PAGE 605]


