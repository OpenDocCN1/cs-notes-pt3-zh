    # 4. 2. 1. 1 ORACLE内存结构


    +   - ORACLE的内存结构主要有两个内存区域组成：

    +     SGA(System Global Area):系统全局区，是ORACLE实例的基础，是一个共享区域，存放最近使用的SQL语句、最近使用的数据、最近使用的数据字典等信息，供各个进程调用。

    +     PGA(Program Global Area):程序全局区，该区域是一非共享区域，存放会话、排序、游标、主变量等信息，被服务器进程调用，保证谁的请求处理结果给谁，谁的排序给谁，用户声明的、打开的、使用的、关闭的游标是私有的，用户的变量不被其他用户干扰。'
