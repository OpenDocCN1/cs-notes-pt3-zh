    # 4.2.3 ORACLE数据库监控实例


    +   - 使用诊断追踪文件管理实例


    后台进程失败经常在数据库的alert.log文件中写入一项，或者写到它们各自的追踪文件，当一个后台进程被终止或者非正常中断一个操作时，通常产生一个追踪文件，包含导致失败的错误信息、当前进程堆栈的转储、当前执行的游标和与问题有关的其它信息。


