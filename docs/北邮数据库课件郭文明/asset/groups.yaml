  md: "\n## 3.4 中间件\n\n- 使用ODBC开发数据库应用程序时,在应用程序中调用标准的ODBC函数和SQL语句,通过加载的驱动程序将逻辑结构映射到具体的DBMS,即连接数据库和存取数据库的底层操作由驱动程序驱动各个数据库完成。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_305_0.png)\n\n- 驱动程序管理器是一个动态连接库(DLL)，用于连接各种DBMS的DBMS驱动程序，管理应用程序和DBMS驱动程序之间的交互作用。驱动程序也是一个动态连接库(DLL)，当应用程序调用SQLConnect时，驱动程序管理器加载驱动程序。\n\
    \n- ODBC规范定义的驱动程序有两种类型：单层驱动程序和多层驱动程序。\n\n- 单层驱动程序：单层驱动程序不仅要处理ODBC函数调用，还要解释执行SQL语句，执行DBMS功能。单层驱动程序本身是一个数据库引擎，尽管该数据库可能位于网络的任何地方，但由它直接可完成对数据库的操作，Xbase\
    \ DBMS的驱动就属于这种。应用程序把存放数据库的服务器作为文件服务器使用，在网络中传输的是整个数据库文件。\n\n- 多层驱动程序：多层驱动程序只处理应用程序的\
    \ ODBC函数调用和数据转换，它将SQL语句传递给数据源服务器，由DBMS解释执行SQL语句。SQL Server等数据库的DBMS就属于这种。使用多层驱动程序，在数据库服务器上实现对数据库的各种操作，在网络中只传输用户请求和数据库处理结果。\n\
    - 应用程序的主要功能是:调用ODBC函数，递交SQL语句给DBMS，检索出结果并进行处理。应用程序的操作可包括：连接数据库；向数据库发送SQL语句；为SQL语句执行结果分配存储空间，定义所读取数据的格式；处理错误；向用户提交处理结果；请求事务的提交和回退操作；断开与数据源的连接。\n\
    \n### 作业：\n\n- 1. 一个典型的数据库应用程序有哪四部分组成？\n- 2. 客户机和服务器的任务各是什么？\n- 3. 从C/S的结构看，其发展趋势如何？\n\
    - 4. 举例说明C/S系统开发中的并发控制、安全控制等管理问题。\n- 5. 分布式数据库系统的优点缺点是什么？\n- 6. 结合实际谈谈B/S模式中的中间件。\n\
    \n## 4. ORACLE数据库\n\n- Oracle公司1977年在加利福尼亚的Redwood成立，在IBM的System/R(关系模型)的基础上，推出了第一个使用IBM的结构化查询语言SQL的RDBMS。今天，Oracle\
    \ RDBMS可用于几乎所有的操作环境，包括IBM大型机、DEC VAX小型机、基于UNIX系统的小型机、Windows NT以及一些专用硬件操作系统平台；该公司是世界上最大的RDBMS供应商，也是世界上最主要的信息处理软件供应商，是仅次于微软公司的世界第二大软件公司，在信息高速公路中扮演着一个重要的角色。\n\
    \n本章介绍ORACLE数据库管理系统。\n\n- 4.1 ORACLE数据库体系结构\n- 4.2 ORACLE数据库实例管理\n- 4.3 ORACLE数据库存取管理\n\
    - 4.4 ORACLE数据库规划和实施\n\n### 4.1 ORACLE数据库体系结构\n\n- ORACLE产品结构：\n\n- **Oracle纵向产品**：例如\
    \ Oracle DBMS、Oracle应用服务器。另外，Oracle还提供了许多可用的开发工具，这些工具包括Designer/2000计算机辅助系统工程(CASE)工具和Developer/2000\
    \ 开发包。随着INTERNET的发展，这些工具正逐渐变得基于Web。\n\n- **Oracle横向产品**：Oracle的应用软件为Oracle带来了大量收益。这些产品包括：\n\
    \n- Oracle财务软件 (Oracle Financial)；\n- Oracle制造业软件 (Oracle Manufacturing)；\n- Oracle人力资源软件\
    \ (Oracle Human Resources)；\n- Oracle自动控制软件 (Oracle Automotive)；\n- Oracle保健系统；\n\
    - Oracle基于不同客户环境的Oracle RDBMS服务器工具，包括 Discoverer、Express及其他软件。\n\n- ORACLE产品结构:\n\
    1. 数据库：Oracle数据库服务器(对象选件、分区、空间、分布式、并行、多媒体)。\n2. 开发工具:\n   1) C/S: developer2000（对应微软VB）\n\
    \   2) B/S: 服务器：IAS（对应微软IIS）\n      开发工具：PL/SQL、Portal\n      Jdeveloper (Java开发工具)\n\
    \   3) CASE: Designer(可生成60%以上的Form和Report)\n   4) 数据仓库：Discoverer(关系数据库)\n  \
    \    Express(多维数据库)\n3. ORACLE应用：ERP:财务管理、企业内部管理\n   CRM:客户关系管理、企业外部管理\n\n- Oracle信息技术的显著特征:\n\
    \n- **决策支持系统(DSS)**: 以Oracle Server为基础数据仓库，使用Express及Oracle Discoverer等决策支持工具，Oracle确立了其在DSS领域的地位。\n\
    \n- **海量数据管理**: Oracle对海量数据的管理非常重视，版本7.3中采用了数据分区的办法。采用数据分区后，海量数据分成很多可管理的块，当系统操作或用户会话处理查询时又能透明地将分块的数据组织起来。\n\
    \n- **保密机制**: Oracle的高级保密机制通过各种各样的特权，控制对敏感数据的存取。用这些机制来保证某些用户能查看敏感数据，而有的用户被禁止。\n\
    \n- **备份与恢复**: Oracle提供了高级备份和恢复的子例程。备份创建Oracle数据的一个副本，恢复把备份的数据恢复出来。Oracle的备份和恢复把数据丢失的可能性降到最小，并使出现故障时的排错时间最少。\n\
    \n- Oracle信息技术的显著特征：\n\n- 空间管理: Oracle提供了灵活的空间管理。用户可以为存放数据分配所需磁盘空间，也可以通过指示Oracle为以后的需求留下多少空间来控制后继的分配。\n\
    \n- 开放式联接: Oracle提供和其他软件联接的开放式接口。使用Oracle Access Manager，用户很容易就能将别的软件商开发的软件所运行的系统集成起来。\n\
    \n- 开发工具: Oracle Form和Oracle report是Oracle提供开发工具的核心。与Web相连进行发布，Oracle企业开发套件中捆绑了一些组件，使得发布灵活、操作性强、易于维护，很容易开发出不同层次的应用。套件中有如下四个主要组件：\n\
    \  Oracle Designer;      Oracle Developer;\n  Oracle Developer Server;      Oracle\
    \ Application Server。\n\n• DBA应当了解ORACLE数据库是如何工作的和为什么要那样工作，只有这样，DBA才能自如地调整ORACLE数据库的对象，满足不同工作的需要。首先介绍ORACLE数据库的体系结构。\n\
