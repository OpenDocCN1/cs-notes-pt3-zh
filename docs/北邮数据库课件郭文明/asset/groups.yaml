    ### 索引


    索引(index)是为了加速对特定表数据的访问而创建的数据段。一个索引拥有表的一列或多列的值以及与这些列值相对应的行内部地址(ROWID)。当Oracle服务器需要在表中查找某一指定行时，它在索引中查找ROWID，然后直接从表中提出数据。


    在Oracle中有几种可用的索引类型。最常用的是B-树索引。簇索引是在簇中被表共享的列的索引，不同于常规的索引，簇索引在索引中只存储一次索引键值，而不管索引键在表中重复多少次。在簇上能够执行任何数据操作语言前，必须在簇上创建簇索引。


    最新的索引类型是位映射(bitmap)索引，在基数较低(不同值数量较小)的列中，位映射索引可以比传统的B-树索引更小，更有效。


    DBA_INDEXES和DBA_IND_COLUMNS含有关于数据库中全部索引的信息。


    ### 回滚段


    回滚段（rollback segment）是存储在数据库事务中发生改变的原始数据块的数据库对象。它们用于提供数据的已经改变但尚未提交的读一致性视图。


    多个用户会话可以共享一个回滚段，每个回滚段至少由两个区间组成。当一个事务开始时，用户会话在一个可用回滚段中得到一个可用区间的专用锁，如果事务填满了第一个区间，它会被分配另一个区间。如果另一个区间不可用，回滚段会自动地给自己分配其他的区间，叫回滚段扩展（rollback
    segment extension）。


    如果回滚段不能分配其他的区间（因为已经达到回滚段最大区间数，或者在回滚段表空间上没有更多的自由区间），那么就会出现错误，而且事务将被回滚。


    回滚段区间的分配影响数据库的性能，因此尽可能在没有分配新区间的情况下，使所有事务能够执行。


    DBA_ROLLBACK_SEGS视图中含有关于回滚段的信息。


    ### 表簇


    表簇（table cluster）是一个数据库对象，它可以**将那些经常在相同数据块中一起使用的表进行物理分组**。当处理那些经常连接在一起进行查询的表时，表簇是特别有效的。一个表簇存储簇键以及簇表中的列值。


    ### 哈希簇


    哈希簇（hash cluster）是数据库存储的最后选项。**在一个哈希簇中，表是基于哈希值组织的，在表的主键值上使用哈希函数可以得到这个哈希值**。在从哈希簇中提取数据时，哈希函数被用于要求的键值上，结果值给出Oracle哈希簇中的存储数据的块。


    '
