  - "[PAGE 119]\n\n# 1.4.1 面向对象数据模型\n\n+   - 面向对象数据库系统（Object Oriented Database System,\
    \ OODBS）是数据库技术与面向对象程序设计方法相结合的产物；面向对象程序设计方法的主要活动在建立对象和对象之间的联系；面向对象数据库系统一般依赖于一个面向对象的程序设计语言。一个面向对象数据库系统是一个持久的、可共享的对象库的存储和管理者；而一个对象库是由一个OO模型所定义的对象集合体。\n\
    +   \n+     面向对象程序设计语言中建立的对象自动保存在磁盘上即OODBS\n\n+   - 面向对象数据模型是用面向对象观点来描述现实世界实体的逻辑组织、对象间限制、联系。\n\
    +   \n+     面向对象数据库的用户主要是应用软件系统软件开发专业程序员"
  - '[PAGE 120]


    # 1.4.1 面向对象数据模型


    +   - 面向对象数据模型的主要观点：


    对象：对象是基本的数据结构，现实世界的任一实体都被统一模型化为一个对象，每个对象有一个永久标识；对象可以被指定为一个给定类型，还可以定义为其它对象的子类型；


    封装：每一个对象是其状态与行为的封装。封装的状态为属性，行为为方法。对象与外部通信一般只能通过显式的消息传递。


    继承：子类型继承父类型的所有特性和行为。


    面向对象的核心观点构成OO模型的基础，没有像关系模型那样的规范说明。

    如果与面向对象数据库相比,RDBMS可以称为面向表的数据库。'
