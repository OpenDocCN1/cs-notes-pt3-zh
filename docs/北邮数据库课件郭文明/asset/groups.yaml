  - '[PAGE 305]


    # 3.4 中间件


    +   - 使用ODBC开发数据库应用程序时,在应用程序中调用标准的ODBC函数和SQL语句,通过加载的驱动程序将逻辑结构映射到具体的DBMS,即连接数据库和存取数据库的底层操作由驱动程序驱动各个数据库完成。


    ![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_305_0.png)'
  - '[PAGE 306]


    # 3.4 中间件


    +   - 驱动程序管理器是一个动态连接库(DLL)，用于连接各种DBS的DBMS驱动程序，管理应用程序和DBMS驱动程序之间的交互作用。驱动程序也是一个动态连接库(DLL)，当应用程序调用SQLConnect时，驱动程序管理器加载驱动程序。


    +   - ODBC规范定义的驱动程序有两种类型：单层驱动程序和多层驱动程序。


    +   - 单层驱动程序：单层驱动程序不仅要处理ODBC函数调用，还要解释执行SQL语句，执行DBMS功能。单层驱动程序本身是一个数据库引擎，尽管该数据库可能位于网络的任何地方，但由它直接可完成对数据库的操作，Xbase
    DBS的驱动就属于这种。应用程序把存放数据库的服务器作为文件服务器使用，在网络中传输的是整个数据库文件。'
  - '[PAGE 307]


    # 3.4 中间件


    +   - 多层驱动程序：多层驱动程序只处理应用程序的 ODBC函数调用和数据转换，它将SQL语句传递给数据源服务器，由DBMS解释执行SQL语句。SQL
    Server等数据库的DBS就属于这种。使用多层驱动程序，在数据库服务器上实现对数据库的各种操作，在网络中只传输用户请求和数据库处理结果。

    +   - 应用程序的主要功能是:调用ODBC函数，递交SQL语句给DBMS，检索出结果并进行处理。应用程序的操作可包括：连接数据库；向数据库发送SQL语句；为SQL语句执行结果分配存储空间，定义所读取数据的格式；处理错误；向用户提交处理结果；请求事务的提交和回退操作；断开与数据源的连接。'
