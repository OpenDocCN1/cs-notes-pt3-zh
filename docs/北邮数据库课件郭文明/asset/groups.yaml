    +     - 懂计算机、数据库原理和熟悉DBMS，同时又具备企业业务知识和实际经验的人很少。

    +     - 企业或组织的数据应用系统的目标和需求缺少明确的规定。

    +     - 缺乏完善的设计工具、方法和理论。

