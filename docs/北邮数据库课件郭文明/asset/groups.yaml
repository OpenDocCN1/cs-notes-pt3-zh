  mdcn: "\n\n## 1.2.3 关系代数综合例子\n\n**例1.1** 列出通过以下代理商订购的商品的pid：代理商从以下的顾客处接受订单，而这些顾客从一个接受过顾客c001订单的代理商处订购了至少一个商品。\n\
    \n接受顾客c001订单的代理商：\n\n$\\pi_{aid}(\\sigma_{cid='c001'}(O))$\n\n从这些代理商处订购过商品的顾客：\n\
    \n$\\pi_{cid}(\\pi_{aid}(\\sigma_{cid='c001'}(O)) \\bowtie O)$\n\n从这些顾客处接受过订单的代理商：\n\
    \n$\\pi_{aid}(\\pi_{cid}(\\pi_{aid}(\\sigma_{cid='c001'}(O)) \\bowtie O) \\bowtie\
    \ O)$\n\n通过上述代理商订购的商品pid：\n\n$\\pi_{pid}(\\pi_{aid}(\\pi_{cid}(\\pi_{aid}(\\sigma_{cid='c001'}(O))\
    \ \\bowtie O) \\bowtie O) \\bowtie O)$\n\n## 作业\n\n- 1. 如果关系R和S没有共同的列属性，根据定义说明表R×S等于表R⋈S。\n\
    - 2. 对CAP数据库，用关系代数完成下列查询。\n  - 1）找出顾客、代理商和商品都在同一个城市的三元组（cid, aid, pid）。\n  - 2）找出顾客、代理商和商品两两不在同一个城市的三元组（cid,\
    \ aid, pid）。\n  - 3）列出所有在同一个城市代理商的aid对。\n  - 4）找出折扣率最大和最小的顾客cid。\n  - 5）取出销售过所有曾被顾客c002订购过的商品的代理商的名字。\n\
    \  - 6）找出只从一家代理商处订购过商品的顾客cid。\n\n## 1.3 SQL\n\n- 自从20世纪80年代以来，SQL就是一个通用的、功能极强的关系数据库语言。现在，SQL语言正从关系形式（ANSI\
    \ SQL-92标准）转向对象-关系形式（ANSI SQL-99标准，1999年颁布）。\n- SQL语言是1974年由Boyce和Chamberlin提出。1986年10月美国国家标准局(ANSI)批准了SQL作为关系数据库语言的美国标准。同年公布了SQL标准文本(简称SQL-86)。1987年6月国际标准化组织(ISO)也采纳了此标准。1989年，美国国家标准局（ANSI）采纳了新的规范SQL-89标准，取代SQL-86，同时SQL-89标准也被国际标准化组织(ISO)采纳。1992年，ANSI/ISO颁布了SQL2版本，标准的名称为SQL-92。SQL-92分成几个顺序级别：从代表SQL-89最小扩展集的“Entry”到“Intermediate”和“Full”，完成于1999年的SQL-99具有更加高级的特征（包括对象-关系特性），亦称SQL3。\n\
    - 主要的几个数据库生产厂商并不可能完全遵守 SQL-99（以及更老的SQL-92）。我们一般更加关注在产品中已经实现的SQL-99特征。\n- 1.3.1\
    \ SQL特点\n- 1.3.2 数据定义\n  - 1.3.2.1 SQL模式的创建和删除\n  - 1.3.2.2 SQL提供的基本数据类型\n  -\
    \ 1.3.2.3 定义、删除与修改基本表\n  - 1.3.2.4 建立与删除索引\n  - 1.3.2.5 视图的创建和删除\n- 1.3.3 数据查询\n\
    \  - 1.3.3.1 简单查询\n  - 1.3.3.2 子查询\n  - 1.3.3.3 UNION运算和FOR ALL条件\n  - 1.3.3.4\
    \ 高级SQL语法\n  - 1.3.3.5 集合函数\n  - 1.3.3.6 行分组\n- 1.3.4 数据更新\n  - 1.3.4.1 插入数据\n\
    \  - 1.3.4.2 修改数据\n  - 1.3.4.3 删除数据\n\n### 1.3.1 SQL特点\n\n- 1)综合统一\n- 2)高度非过程化\n\
    - 3)面向集合的操作方式\n- 4)以同一种语法结构提供两种使用方式\n- 5)语言简洁，易学易用\n\n和关系代数相比，就查询能力而言，SQL并没有根本的改进，在关系代数查询方面的经验可以成为用SQL来实现查询的良好借鉴。在构造查询时SQL的SELECT语句比关系代数要灵活。\n\
    \n### 1.3.2 数据定义\n\n- SQL的数据定义功能包括对模式（Schema）、表（关系，Table）、视图（View）和索引（Index）的创建、删除和修改操作。如下表所示。\n\
    \n| 操作对象 | 操作方式 |  |  |\n| --- | --- | --- | --- |\n|  | 创建 | 删除 | 修改 |\n| 模式\
    \ | `CREATE SCHEMA` | `DROP SCHEMA` |  |\n| 表 | `CREATE TABLE` | `DROP TABLE`\
    \ | `ALTER TABLE` |\n| 视图 | `CREATE VIEW` | `DROP VIEW` |  |\n| 索引 | `CREATE INDEX`\
    \ | `DROP INDEX` |  |\n\n### 1.3.2.1 SQL模式的创建和删除\n\n- 在SQL-99中，模式是表、索引及其他数据库对象的集合。模式名通常是一个用户名。在Core\
    \ SQL-99和当前大多数产品中，当用户的数据库帐户建立时，其模式在用户名之后给出，他们不能再建立其他模式。SQL-99的扩展特性允许用户建立附加模式，一个SQL模式由模式名和模式拥有者的用户名或账号来确定。\n\
    - SQL模式的创建可用CREATE语句实现，其语法如下：\n\n  ```\n  CREATE SCHEMA <模式名> AUTHORIZATION <用户名>\n\
    \  ```\n\n  目前只有DB2 UDB允许用户建立附加模式。其它产品中模式用用户名替代。\n\n- 在SQL中还有一个“目录”概念。目录是SQL环境中所有模式的集合。包含数据库中定义的对象的信息的表，由系统维护。ORACLE叫数据字典，DB2\
    \ UDB叫目录表，INFORMIX叫系统目录。目录表在建立数据库时建立，用户不能更新，但DBA可以用SELECT获取这些信息。\n- 当一个SQL模式及其所属的基本表、视图等元素都不需要时，可以用DROP语句撤消这个SQL模式。DROP语句的语法如下：\n\
    \n  ```\n  DROP SCHEMA <模式名> [CASCADE|RESTRICT]\n  ```\n\n#### 1.3.2.2 SQL提供的基本数据类型\n\
    \n| SQL-99 | ORACLE | INFORMIX | DB2 UDB | 说明 | C |\n| --- | --- | --- | --- |\
    \ --- | --- |\n| char(n) | char(n) n<=4000 | char(n) n<=32767 | char(n) n<=254\
    \ | 定长字符型 | char array[n+1] |\n| varchar(n) | varchar(n) varchar2(n) | varchar(n)\
    \ | varchar(n) | 变长字符型 | char array[n+1] |\n| numeric(p,d) decimal(p,d) | numeric(p,d)\
    \ decimal(p,d) number(p,d) | numeric(p,d) decimal(p,d) | numeric(p,d) decimal(p,d)\
    \ | 定点数，由p位数字（不包括符号、小数点），小数点后有d位数字 | 无 |\n| smallint | smallint | smallint | smallint\
    \ | 短整数 | short int |\n| integer | integer | integer | integer | 长整数 | int,long\
    \ int |\n| real | real | real | real | 浮点数 | float |\n| double precision, float,\
    \ float(n) | double precision, number, float, float(n) | double precision, float\
    \ | double precision, double,float, float(n) | 取决于机器精度的双精度浮点数 至少为n位精度 | double\
    \ |\n\n#### 1.3.2.3 定义、删除与修改基本表\n\n- 建立数据库最重要的一步就是定义一些基本表。SQL语言使用CREATE TABLE语句定义基本表，一般格式如下：\n\
    \n  ```\n  CREATE TABLE <表名>\n  (<列名><数据类型>[列级完整性约束条件]\n  [, <列名><数据类型>[列级完整性约束条件]]...\n\
    \  [, <表级完整性约束条件>]);\n  ```\n\n- 例：CREATE TABLE Student\n\n  ```\n  CREATE TABLE\
    \ Student\n  (Sno CHAR(5) PRIMARY KEY,\n  Sname CHAR(8) NOT NULL,\n  Sage SMALLINT\
    \ CHECK(Sage BETWEEN 17 AND 22),\n  Ssex CHAR(2) CHECK(Ssex IN('男','女')),\n  Sdept\
    \ CHAR(20) DEFAULT('软件学院'));\n  ```\n\n创建学生表：Sno为主键（非空唯一），Sname非空，Sage在17到22之间取值，Ssex只能取‘男’或‘女’，Sdept默认值为‘软件学院’。\n\
    \n"
