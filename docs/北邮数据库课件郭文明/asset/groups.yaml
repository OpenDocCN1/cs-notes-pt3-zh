  - '[PAGE 222]


    # 3.1 嵌入式SQL


    +   - 为什么使用嵌入式SQL？

    +     —有些数据访问任务对于交互式的非过程的SQL是无法完成的任务。

    +     —使用交互式SQL，必须知道表名、列名并且能够写出符合语法的SQL语句。

    +     —实际的应用系统是非常复杂的，数据库访问只是其中一个部件。有些动作如与用户交互、图形化显示数据等只能用高级语言实现。


    +   - 嵌入到过程性主语言中使用的SQL称为嵌入式SQL。主语言可以是C或Java(不一定是Windows环境).也可以是Visual Basic, Delphi
    (Windows环境)等。


    +   - ORACLE的Pro*C即是使用嵌入式SQL的平台。'
  md: "\n## 2.2.2.3 触发器(Trigger)\n\n- Create table定义的非过程性约束的种类是有限的,而过程性约束留出程序接口,可以实现任何想法的约束。\n\
    - 完整性约束是为了防止错误的SQL意外地破坏数据完整性.当约束不满足时,非过程性约束只是简单地拒绝接受数据,而通过过程性约束还能实现应该做什么。\n- 显然非过程性约束比过程性约束更容易理解,非过程性约束没有过程性约束那样灵活,相对更成熟稳定。\n\
    - 触发器还可用于面向对象的想法的实现。\n\n## 2.2.3 系统目录\n\n- 所有的关系数据库都有系统目录,它包含数据库中定义的对象的信息,这些对象有用户、表、列、索引、视图、权限、约束等等,它是由系统自动维护,用户不能直接更新,但可以查询。\n\
    - ORACLE的数据字典即为系统目录.根据前缀可分为三种不同形式:\n  - USER_... 用户视图(当前用户的,不列所有者)\n  - ALL_...\
    \ 扩展的用户视图(列所有者)\n  - DBA_... DBA视图\n- ORACLE数据字典的另一种形式是动态性能视图, V$...\n\n- ALL_TABLES\
    \ 表信息\n- ALL_TAB_COLUMNS 表的列信息\n- ALL_CONSTRAINTS 表的约束信息\n- ALL_TAB_COMMENTS 表的描述信息\n\
    - ALL_COL_COMMENTS 列的描述信息\n- ALL_TAB_GRANTS 表的权限信息\n- USER_INDEXES 索引信息\n- USER_IND_COLUMNS\
    \ 索引的列信息\n- USER_CLUSTERS 聚簇信息\n- USER_VIEWS 视图信息\n\n- USER_SEQUENCE 同义词信息\n-\
    \ ALL_USERS 用户信息\n- USER_SYS_PRIVS 用户系统权限信息\n- USER_TAB_PRIVS 用户对象权限信息\n- DBA_ROLES\
    \ 角色信息\n- ROLE_SYS_PRIVS 角色的权利信息\n- DBA_PROFILES 用户资源配置文件信息\n- USER_TRIGGERS 触发器信息处理\n\
    - ............\n\n- DICTIONARY可列出所有数据字典表和视图的名字及描述信息,DICT_COLUMNS列出这些字典表和视图的所有列及描述信息。\n\
    \n- 通过对数据字典的查看,可以了解整个数据库的组成.数据库对象本身就是一对一、一对多、多对多的关系,我们可进一步体会关系数据库的特点。\n\n- 面向对象的目录表:\
    \ 当用户在数据库中创建用户定义类型和用户定义函数时, 不仅要记录这些类型和函数的存在, 还要记录它们的相互依赖关系。\n\n- ORACLE中对象关系的目录表:\n\
    \  - USER_OBJECT_TABLES\n  - USER_TYPES\n  - USER_DEPENDENCIES\n\n## 2.2.4 数据库恢复\n\
    \n- 事务是数据库的基本工作单位,每个运行事务对数据库的影响要么在数据库中,要么不反映在数据库中.这样才能保证数据库的一致完整.\n\n- 数据库运行过程中的故障可能破坏数据的完整一致,故障类型有：\n\
    \  - 事务故障:违反完整性约束引起事务夭折.\n  - 系统故障:软硬件错误断电引起事务夭折.\n  - 介质故障:磁盘损坏部分或全部数据丢失.\n\n\
    - 恢复的技术:数据转储(备份)和日志.\n\n- 为了提高效率,对数据库对象的操作的结果不是立刻写入磁盘,而是保留在缓冲区中,从而可以被不同事务一次又一次地使用,如果它变得不常用,则写入磁盘并清出缓冲区。缓冲区采用最少使用算法(LRU)决定最长时间内未被使用的缓冲区被写入磁盘的数据文件中。缓冲区是否写入磁盘数据文件与其中的数据是否提交无关,也即未提交的数据有可能被先期写入磁盘上。后台进程DBWR只服从于LRU,不服从于事务。\n\
    - 为了防止因故障原因使留在缓冲区但已提交的数据反映不到磁盘上,或者写入磁盘的数据没有提交,利用日志来记录对数据库的更新操作。日志项记录更新操作的足够信息(事务开始、更新前更新后的值、事务结束)。\n\
    \n- 日志记录首先保存在日志缓冲区中,在合适的时刻被写入磁盘上的日志文件中,该文件包括了在过去某个时段中的所有日志项。\n- 数据缓冲区和日志缓冲区各自向数据文件和日志文件转移数据,系统采用先写日志原则协调这两项行为:\n\
    \  - 数据库系统通常在日志缓冲区创建一个日志序列号(LSN),LSN_BUFFMIN为日志缓冲区被写回到磁盘后的最小序列号。\n  - 每个数据缓冲区页面记录该页最近一次更新操作的日志序列号,记为LSN_PGMAX。\n\
    \  - 数据缓冲区页面只有当LSN_PGMAX比LSN_BUFFMIN小时,才能被LRU到磁盘。\n\n- 先写日志原则保证了写入磁盘的更新操作肯定在日志文件中作了记录,没有写入磁盘的更新操作在日志文件中也可能作了记录(事务提交和日志缓冲区满也会引起日志缓冲区写入日志文件)。\n\
    - 对事务故障和系统故障的恢复需要根据日志文件作两种不同类型的处理：\n  - 前滚(ROLL FORWARD):对已提交(已结束)的事务重新运行并提交,保证已提交的事务的数据更改正确地写入数据库中。\n\
    \  - 回退(ROLLBACK):对未提交(未结束)的事务做撤销处理,用日志记录中更新前值依次替换数据库中的数据,使数据库回到该事务执行之前的状态。\n\n\
    - 恢复过程的时间和 ROLLBACK 和 ROLL FORWARD 过程中要读取的日志文件的长度成正比。为了减少恢复过程的时间，记录系统经过一段合理时间之后的一个一致状态，恢复操作即可不用在此之前发生的日志数据项。\n\
    \n- 将所有已修改过的数据缓冲区均写入数据文件的特定操作称为**检查点**。\n\n- 一个检查点的规则：检查点操作开始，新的事务不能开始，现有事务继续执行直到提交并写入磁盘，系统写入一个特殊的日志文件项(CKPT)到日志文件中，检查点操作结束。\n\
    \n- 以上规则可能消耗很多时间，阻塞系统操作。不同系统实现检查点的规则不一定相同，使用复杂的检查点规则的系统能够维护一个平稳的事务输出。\n\n- 触发检查点出现的方式有两种：\n\
