    \ 中选取 R 关系在 A 属性组上的值与 S 关系在 B 属性组上值满足比较关系 θ 的元组。"
  - '[PAGE 56]


    # 连接 (Join)


    +   - 连接运算中有两种最为重要也最为常用的连接，一种是等值连接（equi join），另一种是自然连接（Natural join）。另外还有外连接、左连接、右连接等。

    +   - θ 为“=”的连接运算称为等值连接。它是从关系 R 与 S 的广义笛卡尔积中选取 A，B 属性值相等的那些元组。

    +   - 自然连接（Natural join）是一种特殊的等值连接，它要求两个关系中进行比较的分量必须是相同的属性组，并且在结果中把重复的属性列去掉。'
