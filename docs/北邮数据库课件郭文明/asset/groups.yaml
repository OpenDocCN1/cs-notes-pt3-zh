  md: "\n## 5.3.3 关系模式的分解特性\n\n- 规范化过程是建立在模式分解基础上的，将表分解成为两个或更多较小的表，可以通过把分解出的表连接起来重新获得原始表的详细信息。\n\
    - 定义：对于任何表R(U)，R的一个分解是一个表的集合{R₁(U₁), R₂(U₂), ..., Rₖ(Uₖ)}，该集合具有性质：Uᵢ是U的一个子集且U=U₁∪U₂∪...∪Uₖ。\n\
    - R分解成R₁, R₂, ..., Rₖ的目的是为了消除数据冗余和操作异常现象。如果分解后的表表示了不同的内容，分解就没有什么意思。\n\n- 可以从两个角度来考虑模式的分解：\n\
    \  1. 无损分解：分解后的表能够通过连接运算恢复分解前表的内容，保证分解前表的内容没有损失。\n  2. 保持依赖：在模式 R 上有一个 FD 集 F，在\
    \ Rᵢ 上有一个 FD 集 Fᵢ，那么 {F₁, F₂, …, Fₖ} 与 F 应该等价，即 {F₁, F₂, …, Fₖ}⁺ = F⁺。\n- 不是无损分解或没有保持依赖的分解很难说是一个好的模式设计。\n\
    \n## 5.3.4 范式和关系模式规范化\n\n- 范式(Normal Forms, NF)是与函数依赖有直接联系的，评价模式好坏的衡量标准。建立在函数依赖基础上的范式有1NF,\
    \ 2NF, 3NF, BCNF。经常称某一关系模式为第几范式，表明该关系模式是符合某一种范式级别的关系模式。\n\n- 一个低一级范式的关系模式，通过模式分解可以转换为若干个高一级范式的关系模式的集合，这种过程就叫关系模式规范化。\n\
    \n- 第一范式(1NF)：如果关系模式R的每个关系r的属性都是不可分的数据项，那么就称R是第一范式的模式。1NF是关系模式应具备的最起码的条件。关系数据库设计研究的关系规范化是在1NF之上进行的。\n\
    \n- 只符合1NF标准的关系模式不是好的数据库模式。前而介绍的工资管理模式2即为1NF。\n\n- 第二范式(2NF)：\n  - 定义：对于FD W→A，如果存在X⊂W有X→A成立，那么称W→A是局部依赖(A局部依赖于W)；否则称W→A是完全依赖。\n\
