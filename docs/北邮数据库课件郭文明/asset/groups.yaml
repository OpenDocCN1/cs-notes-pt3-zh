  - '[PAGE 223]


    # 3.1 嵌入式SQL


    把SQL嵌入主语言使用时必须解决的三个问题：


    +   1. 区分 SQL语句与主语言语句,用EXEC SQL开始。

    +   2. 数据库工作单元和程序工作单元之间的通信。

    +      SQL语句可以使用主语言的程序变量(简称主变量),这些变量名字加冒号(:)作标志，以区别于字段名。这些变量由BEGIN DECLARE SECTION与END
    DECLARE SECTION语句之间说明。

    +      主语言中不能引用数据库中的字段变量。

    +      SQL语句执行后，系统要反馈给应用程序若干信息,这些信息送到SQL的通信区SQLCA。SQLCA用语句EXEC SQL INCLUDE加以定义。

    +   3. 一个SQL语句原则上可产生或处理一组记录，而主语言一次只能处理一个记录，为此必须协调两种处理方式。这是游标来解决的。'
  - '[PAGE 224]


    # 3.1 嵌入式SQL


    +   - 嵌入式SQL的执行


    预处理器把嵌入的SQL语句从主程序命令中分离出来,转换成相应的主语言语句. 例:


    +   1. UNIX环境下,程序员创建包含SQL的main.pc的源程序.


    +   2. Oracle程序员调用预编译器:

    +   proc iname=main.pc

    +   生成main.c,其中SQL语句被纯c语句(Orcale运行期库函数)替换.


    +   3. 主语言编译

    +   cc -c main.c,生成main.o目标文件.


    +   4. 连编生成可执行文件.


    ![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_224_0.png)'
  - "[PAGE 225]\n\n# 3.1.1 C语言中嵌入式SQL\n\n```\n#include <stdio.h>\n#include \"prompt.h\"\
    \nexec sql include sqlca;  /*声明通讯区*/\nchar cid_prompt[]=\"请输入顾客号:\";\nint main()\n\
    {\n    exec sql begin declare section;\n        char cust_id[5],cust_name[14];\n\
    \        float cust_discnt;\n        char user_name[20],user_pwd[20];\n    exec\
    \ sql end declare section;\n    /*声明变量*/\n    exec sql whenever sqlerror goto\
    \ report_error;\n    exec sql whenever not found goto notfound;\n    /*出错处理*/\n\
    \    strcpy(user_name,\"mytest\");\n    strcpy(user_pwd,\"test\");\n    exec sql\
    \ connect :user_name\n        identified by :user_pwd; /*连接*/\n    while((prompt(cid_prompt,1,cust_id,4))>=0)\n\
    \    {\n        exec sql select cname,discnt\n            into :cust_name,:cust_discnt\n\
    \            from customers where cid=:cust_id;\n        exec sql commit work;\n\
    \        printf(\"顾客名: %s 折扣率: %5.1f\\n\",\n            cust_name,cust_discnt);\n\
    \        continue;\n    notfound: printf(\"没找到 %s,继续\\n\",cust_id);\n    }  /*根据输入的顾客ID查询顾客信息*/\n\
    \    exec sql commit release; /*正常释放连接*/\n    return 0;\n\n    report_error:\n\
    \        print_dberror(); /*出错信息*/\n        exec sql rollback release; /*释放连接*/\n\
    \        return 1;\n}\n```"
