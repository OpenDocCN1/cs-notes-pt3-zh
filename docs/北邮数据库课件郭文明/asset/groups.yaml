  - '[PAGE 347]


    # 4.1.6 ORACLE其它对象


    - 序列 (Sequence)：序列是用于产生唯一数码的数据库对象。序列创建时带有初始值、增量值以及最大值。每次从序列中返回一个数字，当前序列值是一个一个递增的，每个序列产生的数字可达到38位长度。


    可以通过选择来自序列的NEXTVAL或CURRVAL伪列使用序列。例如：一个名为EMP_SEQ的序列，


