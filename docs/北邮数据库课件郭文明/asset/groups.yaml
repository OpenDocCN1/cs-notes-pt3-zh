  md: '

    ## 4.3.1.2 ORACLE数据库碎片


    - DBA面对的最常见问题就是处理数据库对象的碎片。碎片浪费空间，导致性能问题，并给数据库对象的管理带来困难。数据库碎片通常是行被插入、修改和删除以及对象被建立和删除的结果，一个新建立的数据库不会有碎片。只有当在数据库上运行了一个或更多的活动应用程序后，才开始看到数据库碎片的迹象。

    - 数据库碎片包括分裂成碎片的数据库对象，分裂成碎片的表空间、链接行和转移行。DBA应该注意数据库应用程序是如何执行任务的，尽量避免数据库应用程序运行过程中产生碎片，并且监测数据库运行状态，对产生的碎片进行必要的处理。


    ### 分裂成了碎片的表空间


    表空间变成碎片是由于运行错误或者表空间中的数据库对象的无计划撤消和重建造成的。表空间不会由于任何行级动作而变成碎片。


    Oracle尽力帮助DBA进行空间分配和管理。例如假设一开始表空间有四个10MB表段，现在删除其中的两个表，这两个表都位于表空间的“中间”位置，SMON后台进程自动地把两个10MB的区间聚合为一个20MB区间。如果要删除的两个表不是位于表空间的“中间”位置，则形成表空间碎片。


    表空间碎片会导致：表空间中的空间被分离且不能有效地使用。


    通过查询DBA_FREE_SPACE和DBA_EXTENTS数据字典，可以查询数据库的每个表空间中有多少自由空间是可用的、最大自由区间的容量以及每个表空间中自由区间的数目。


    ### 处理分裂成碎片的表空间


    处理表空间碎片的最好方法是避免它，这需要仔细地计划和管理。避免碎片的几种提示方法：


    1. 把对象用相似的空间和增长特性聚合在一起。

    2. 如果可能，把它们的区间设成相同的容量，这样所有的对象可以共享释放对象回收的区间。

    3. 使每个段的PCTINCREASE保持为0（注意Oracle7.3后，设置PCTINCREASE比0大会导致SMON自动聚合相邻的自由区域）。


    对确实需要整理的分裂成碎片的表空间，简单的方法是在表空间中导出损坏了的对象，删除该对象，再把它们导入回来。这不仅能够聚合自由空间，而且导出操作也可以把数据库对象聚合到一个区域中。


    ### 对象碎片


    碎片问题可能发生在对象级。对象碎片会导致：由于在表和索引块中的自由空间空洞导致空间的浪费；读性能下降，因为数据不再被紧紧地排在一起，物理磁盘驱动器必需从一个比需要的大的磁盘表面区域中搜寻和读数据。


    对象碎片的三个特殊碎片类型：行转移、行链接和过分扩展的段。


    DELETE操作可能会产生稀疏的块，因为这些块不满足PCTUSED条件，以至没有成为自由空间。处理对象碎片的操作也会处理这类稀疏的块问题。


    DBA在一个经常改变的表空间中发现空间分配问题，并重建了表空间和它的所有对象，随后数据库性能提高了。这种在性能上的提高是消除表空间碎片的结果，但也可能是消除对象级碎片带来的性能的提高。


    ### 行转移


    行转移在对行的修改引起行的长度比块中可利用空间大时发生。当发生行转移时，行的一部分转移到一个新的数据块中，这个新数据块的地址存储在原始行单元中。当Oracle需要读这个行时，它首先读原始单元并找到一些数据和指向另一个块的指针，再在这个块中找到剩下的行数据。


    为什么Oracle执行行转移而不是把整个行移到一个新块中？因为移动一个行的单元会引发ROWID的变化，而ROWID的变化引发一系列的变动，代价太大。


    行转移存在两个问题：


    1. Oracle必须读每一个包括行数据的一部分或者是指向另一个包含着行数据的块的指针的块，无疑这会导致相当大的系统额外开销。

    2. Oracle必须和行数据一起存储额外的指针来供给行转移机制，浪费了一些磁盘空间。


    ### 行链接


    行链接在行太长以致于不能放入任何一个数据块时发生。这导致该行被存储在一个或多个数据块的链中。行链接伴随着包含LONG、LONG RAW或者LOB数据类型的大行时发生。


    ### 消除链接和转移的行


    链接和转移的行会对数据库的整体性能造成一系列的问题。可以通过下面的SQL语句检查链接和转移的行：


    ```sql

    ANALYZE TABLE customer LIST CHAINED ROWS INTO cha;

    ```


    这个命令把数据库中所有链接和转移行的ROWID和所在表存储到cha表中。直接查询cha表，即可找出行和表的特定信息。


    **消除转移的行的方法**是直接查询cha表，把转移的行从表中移出放入一临时表中，然后再集中将临时表中数据添加进表，即可消除转移的行，该方法可能使原来相邻存放的数据变得不再相邻，并不一定能提高性能；另一个方法是使用全表导出，删除表，之后使用导入重建该表，该方法最简单、最全面，肯定会消除行转移引起的性能问题，但无疑是消耗时间最长的。


    **行链接**是非常难调整的。唯一的**解决办法是缩短表的行长或者增加数据库块的大小**。选择前一种方法通常需要对表结构进行重新设计，但是后一种方法需要导出整个数据库，重新创建数据库然后全部导入，因为块的大小调整必须重构数据库。


    ## 4.3.1.3 管理回退段


    ### 回滚段操作


    事务可以通过显式或者隐式方式被指定到一个特殊的回滚段中。Oracle用扩展（存储子句）和循环（释放的空间可以重用）的方式使用回滚段。如果达到了一个回滚段的maxextents，或者表空间中没有更多的空间分配给回滚段的话，扩展就失败了。应该给回滚段分配预留扩展的表空间。


    包含在任何给定的表空间中的所有回滚段应该被精确地分配成相同的大小，如果设置了不匹配的区间大小，那么可能出现前面讨论过的碎片问题。也即尽量为活动时间大致相同的事务创建一个回滚段，这样可以使回滚段的区间利用率达到最好水平。


    特殊回滚段是为特殊事务类（如DSS和OLTP）创建的，这些可能被设置为不同大小的回滚段，它们应该存储在它们自己的表空间中以使碎片减到最小。


    ### 设定回滚段大小


    数据库设计者对回滚段通常考虑如下问题：


    1. 使用多少个回滚段；

    2. 给每个回滚段分配多少空间；

    3. 各个回滚段是专用的还是共享的；

    4. 各个回滚段分别驻留在哪些表空间中。


    当设定回滚段大小时，应该被设置得足够大，这样系统就不必马上重新使用刚被一个已完成的事务释放的块，同时有足够的空间来存储非活动的或者被提交的数据事务，而这些数据事务可能是其他长时间运行的查询所需要的（读一致性）。


    使用 `SET TRANSACTION USE ROLLBACK SEGMENT` 语句在事务开始时明确地使用某个回滚段。可以建立一个只被长时间运行的批量工作使用的大回滚段。


    ### 使用OPTIMAL参数


    当建立回滚段时，回滚段的目标容量可以用存储参数OPTIMAL定义。OPTIMAL参数指定了回滚段要缩小到的尺寸。


    例：


    ```sql

    create rollback segment r05 tablespace rbs storage (initial 10M next 10M optimal
    20M minextents 2 maxextents 100);

    ```


    Oracle尽力把回滚段的尺寸维持在指定的最佳值20MB上。当回滚段开始写入另一个区间时，Oracle总是检查段是否比OPTIMAL的尺寸大，如果大，并且下一个区域是完全空闲的，Oracle就释放该区间。


    如果回滚段的尺寸设置不适当，回滚段会由于OPTIMAL子句的缘故持续地收缩，这种不断的区间分配和释放会影响到性能。


    ### 进行装载测试以获得回滚段估算


    为了正确地设置回滚段的尺寸，需要对将由较大事务产生的撤消信息的数量有个了解。可以在样本事务中执行一个装载测试：


    1. 建立两个表保存统计信息：undo_begin和undo_end。

    2. 在与数据库连接后，发出一系列事务处理命令，使用动态性能视图v$rollstat把写入指定回滚段的原始数据捕获到表undo_begin中。

    3. 在事务处理结束后，再把写入指定回滚段的数据放到表undo_end中。

    4. 在表undo_begin和undo_end中已经有了开始和结束值，将这两个值相减便可得到写入指定回滚段的数据。这些值可以用于确定你的回滚段的尺寸需求。

