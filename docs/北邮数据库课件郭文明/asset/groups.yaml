    +     - 数据库必须正确反映现实世界，能为某个 DBMS 所接受。

    +     - 应用系统有良好的性能，有利于实施和维护。

    +     - 数据库能满足当前和今后相当长时期内的数据需求，使数据库有较长的使用寿命。

    +     - 当软件和硬件环境发生变化时容易修改和移植。

    +     - 能满足安全性要求，当系统发生故障时，容易恢复数据库。

    +     - 数据库存取效率、查询效率要高。'
