    \n  3）编辑所产生的追踪文件。除了CREATE CONTROLFILE语句外，删除追踪文件中的所有行，设置新的参数值。\n\n  4）正常关闭（SHUTDOWN\
    \ NORMAL）数据库。将旧的控制文件移放到备份目录里，确保Oracle在数据库启动时，不能在目录中找到控制文件的任何副本。\n\n  5）执行STARTUP\
    \ NOMOUNT命令启动数据库，运行你所编辑的CREATE CONTROLFILE追踪文件，这将重建带有新参数值的控制文件。\n\n  6）执行ALTER\
    \ DATABASE OPEN命令。\n\n- 在数据库创建时，把数据库参数值设为比你所需要的值高一些，可以避免重建你的控制文件。可配置的系统控制文件参数：\n\
    \n  - MAXLOGFILES：联机重做日志文件的最大数；\n  - MAXLOGMEMBERS：每个重做日志文件的最大成员数；\n  - MAXDATA\
    \ FILES：数据文件的最大数；\n  - MAXINSTANCES：能够安装到这个数据库上的最大实例数（并行服务器）；\n  - MAXLOGHISTORY：用于恢复实例的归档重做日志文件组的最大数（并行服务器）；\n\
    \n注意要改变数据库名，要像前面所描述的那样重新创建控制文件。\n\nV$CONTROLFILE视图列出了Oracle服务器当前正在读写 的控制文件。\n\n\
    ### 4.1.2.3 联机重做日志文件\n\n- 联机重做日志文件：日志写后台进程（LGWR）将重做日志缓冲区的內容写入联机重做日志文件中，重做日志贮存了数据库的所有变化信息，并在数据库的恢复期间被Oracle使用。联机重做日志文件为二进制文件，结构不公开。\n\
    \n联机重做日志文件至少由两组重做日志文件组成，并且按照一种循环的特性写入。\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_327_0.png)\n\
    \n- 联机重做日志文件：\n\n当前日志组被填满时，LGWR进程停止对它的写入而转到下一个日志组。当日志切换发生时，前面写入的重做日志组被归档(ARCH)进程锁定，并被拷贝到磁盘或磁带上。\n\
    \n如果LGWR追上ARCH进程，并且需要实时写入由ARCH正在写入的组时，所有的数据库活动将被挂起，直到ARCH进程写完日志。日志组不够用则影响数据库性能。\n\
    \n每个日志组可由多个成员组成，日志组的每个成员是其他成员的精确镜像，并且重做日志项被并行地写入每个成员中。通过在每个组中使用多个成员，能防止数据库由于丢失重做日志而导致失效。只要组里有一个成员是可用的，数据库就能继续工作。\n\
    \nV$LOG和V$LOGFILE视图保存联机重做日志文件的信息。\n\n### 4.1.2.4 追踪文件\n\n- 追踪文件：所有的Oracle数据库都至少有一个文件用于记录系统信息、错误及主要事件。这个文件叫做\
    \ sidALRT.log（sid是数据库系统的标识符），存储在由 init.ora 参数 BACKGROUND_DUMP_DEST 指定的位置。\n\n\
    当调查数据库故障时，应首先查看该文件，关键的错误总是在这里被记载。\n\n后台进程和用户进程也建立它们自己的追踪文件，记载出现故障的信息。后台进程追踪文件贮存在\
    \ BACKGROUND_DUMP_DEST 所指定的位置，用户进程追踪文件贮存在由 USER_DUMP_DEST 参数设置所指定的目录里。\n\n后台进程追踪文件被命名为sidPROC.trc，PROC是后台进程的名字。用户会话追踪文件带有一个ora前缀，后面是一系列带有.trc文件扩展名的唯一标识数字。\n\
    \n可以在V$PARAMETER视图中获得BACKGROUND_DUMP_DEST和USER_DUMP_DEST参数的当前设置。\n"
  mdcn: "\n\n## 4.1.1 ORACLE数据库\n\n## 4.1.2 ORACLE系统数据库对象\n\n- 数据库对象分两种类型：一类是由RDBMS内部使用的对象，称为系统数据库对象\
    \ (system database object)，另一类是可以通过任何程序访问的对象，称为用户数据库对象 (user database object)。\n\
    - 系统数据库对象：是指RDBMS用于支持内部数据库功能的数据对象。这些对象是由数据库系统管理员或服务器本身配置和创建的，并且不显式地用于用户数据库事务。系统数据库对象有：\n\
    \  - 初始化参数文件\n  - 控制文件\n  - 联机和归档重做日志文件\n  - 追踪文件\n  - ROWID（行内部地址）\n  - Oracle\
    \ 块\n\n### 4.1.2.1 初始化参数文件\n\n- 初始化参数文件：也称为启动参数文件，文件缺省名为 init.ora，是 DBMS 主要的配置点，包括定义名称的参数、设置静态限制的参数、影响动态性能的参数，控制或修改数据库和实例操作的某个方面。当数据库启动时，在创建实例或读取控制文件之前，先读取\
    \ init.ora 文件。\n\ninit.ora 文件中的值决定着数据库和实例的特性，例如共享池、高速缓存、重做日志缓存分配、后台进程的自动启动、控制文件的读取、自动联机回滚段等等。直到数据库被关闭并重新启动，对\
    \ init.ora 文件中参数的更改才被承认。\n\ninit.ora 是一个 ASCII 文本文件，默认条件下，文件的名字为 init SID.ora，SID\
    \ 相当于它所控制的数据库的标识符。每个 Oracle 数据库和实例都有它自己唯一的 init.ora 文件。\n\n- 初始化参数文件：\n\n在Oracle\
    \ RDBMS中，缺省的init.ora文件位于UNIX服务器上的$ORACLE_HOME/dbs目录下或NT服务器上的$ORACLE_HOME/database目录下。当创建新数据库和实例时，这个文件可被复制和重新命名。\n\
    \n通过查询V$PARAMETER视图，可以从数据库内部观察init.ora文件中的配置参数集。V$PARAMETER视图把所有的init.ora 参数和它们的值都列出来，并且每一个值都有一个标记符，用以指明参数值是否为服务器默认值。\n\
    \n通过调整初始化参数可以改善数据库系统的整体性能。\n\n下表是init.ora参数的一些表述，详细的参数设置可参看使用手册。\n\n| 参数 | 缺省\
    \ | 范围 | 说明 |\n|---|---|---|---|\n| `audit_trail` | none | none, DB | 使得写入审计跟踪接通或断开；\
    \ |\n| `background_dump_dest` |  |  | Oracle后台进程LGWR、DBWR所使用的追踪文件的路径； |\n| `control_files`\
    \ |  | 文件名... | 数据库的控制文件； |\n| `db_block_buffers` | 32 | 4..无限 | 包含在高速缓存中的数据库块数目；\
    \ |\n| `db_block_size` | 2048 | 依赖OS | Oracle 数据库块的大小。在数据库建立起来后，这个值就不能改变了； |\n\
    | `db_files` |  |  | 能够打开的数据库文件的最大数目； |\n| `db_name` | 空值 | 库名 | 可选择的数据库的名字。如果使用该参数，它必须与用在CREATEDATABASE语句中的数据库名称相一致；\
    \ |\n| `db_file_multiblock_read_count` |  |  | 在顺序扫描中，一次I/O操作所能读取数据库块的最大数。 这是用于顺序搜索的，是非常重要的；\
    \ |\n| `dml_locks` |  |  | DML封锁的最大数； |\n| `log_archive_dest` |  |  | 归档重做日志文件的最终位置；\
    \ |\n| `log_buffer` |  |  | 分配给重做日志缓冲区的字节数； |\n| `log_checkpoint_interval` | \
    \ |  | 触发一个检测点需要填充的重做日志文件块数； |\n\n### 4.1.2.2 控制文件\n\n- 控制文件：控制文件是数据库的心脏，存储着数据库的结构信息，它包含以下信息：属于数据库的数据文件和重做日志文件的位置信息、数据库中的数据应该以何种字符集存储的信息、数据库中每个数据文件的状态和版本信息、检查点信息、表空间信息、回退段信息、以及其他的重要信息。\n\
    \n包含在控制文件中的大部分参数是在数据库创建过程中设定的，相对来说是静态的，它们不是经常改变的。控制文件采用二进制格式，并且是不可读或手工编辑的。\n\n\
    数据库可以操作多个控制文件。特定控制文件的创建是在init.ora参数CONTROL_FILES中指定的。\n\n- 控制文件：\n\n如果没有正确的控制文件或控制文件损坏，数据库将无法启动，并且存储在数据库中的数据信息将无法访问。正是由于这个原因，控制文件的镜像备份功能是被Oracle服务器内部支持的，并且也是大力推荐的。\n\
    \n如果要将控制文件镜像备份到一个新的数据库中，只需要在发出CREATE DATABASE命令之前，为CONTROL_FILES指定一个以上的参数值即可。\n\
    \n如果要将控制文件镜像备份到一个现有数据库中，必须关闭数据库，将当前的控制文件拷贝到你想要备份的目录当中，编辑init.ora中的CONTROL_FILES参数，以指定新的控制文件的位置，然后启动数据库。\n\
    \n注意：应至少提供两个控制文件，并存放在不同的磁盘上。\n\n- 改变任何控制文件参数，必须重新创建控制文件。重新创建控制文件的步骤如下：\n\n  1）备份数据库。修改控制文件过程中，出现的任何一个错误都会破坏数据库，使之无法恢复。\n\
    \n  2）执行ALTER DATABASE BACKUP CONTROLFILE TO TRACE命令，建立一个用户追踪文件（位于USER_DUMP_DEST），该文件带有重建当前控制文件所必须的命令。\n\
    \n  3）编辑所产生的追踪文件。除了CREATE CONTROLFILE语句外，删除追踪文件中的所有行，设置新的参数值。\n\n  4）正常关闭（SHUTDOWN\
