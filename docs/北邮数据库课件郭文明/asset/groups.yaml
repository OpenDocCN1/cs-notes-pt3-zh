  - '[PAGE 89]


    # 1.3.3 数据查询


    +   - Select语句的执行过程可以理解为：

    +     首先，对FROM子句中的所有表做关系乘积

    +     接着，删除不满足WHERE子句的行

    +     根据GROUP BY子句对剩余的行进行分组

    +     然后删除不满足HAVING子句的组

    +     求出SELECT子句选择列表的表达式的值

    +     若有关键词DISTINCT存在，则删除重复的行

    +   - Select中的标识符：一般的SQL标识符是大小写无关的。实际上SQL在解释以前会把它们转化为大写形式。一个标识符必须以一个字母打头，Entry
