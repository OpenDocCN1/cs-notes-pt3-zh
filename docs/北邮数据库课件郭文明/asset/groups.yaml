  md: "\n## 4.2.1.2 ORACLE进程\n\n- 锁进程(LCKn)：在并行服务器环境中，多个实例安装在同一个数据库上，锁进程(LCKn)负责管理和协调每个实例占有的锁。\n\
    - 并行查询进程(Pnnn)：根据数据库的活动和并行查询选项的配置，Oracle服务器启动和停止查询进程。这些进程涉及并行索引的创建、表的创建及查询。启动的进程的数量与参数PARALLEL_MIN_SERVERS指定的数量相同，但决不能超过参数PARALLEL_MAX_SERVERS指定的进程数。\n\
    \n## 4.2.1 ORACLE数据库实例组成\n\n- 为更好地理解前面讨论的实例组件是如何相互交互的，看一个典型的事务在实例结构中的移动。\n- 当一个用户会话使用SQL*Net驱动程序连接到服务器会话时，开始一个事务。这个连接可以使用它自己的一个服务进程进行专用连接，或通过调度进程处理的一个共享连接。服务器会话对传递给它的SQL语句与已经保存在共享SQL区中的语句进行比较，如果在共享池中发现有完全一样的语句，使用该语句早已存储的做过语法分析的形式与执行计划。如果在共享池中没有发现匹配语句，服务器进程对这些语句进行语法分析。\n\
    - 接下来，服务器会话查看在数据库缓冲区中是否已经存储了完成该事务所必须的数据块。如果在缓冲区中没有，服务器会话就从数据文件中读取必要的数据，将它们拷贝到缓冲区中。如果事务是一个查询，服务器会话将查询的结果返回给用户进程（执行必要次数的数据块读和拷贝以返回所有数据）。\n\
    - 对一个修改数据的事务，有更多的步骤需要做。例如，假设事务是一个更新。在将必要的数据块读入缓冲区高速缓存中之后，修改内存中的数据块。修改的缓存块标记为脏的，并把它们放入脏列表中。还产生重做信息，并将重做信息存储在重做日志缓存中。\n\
    \n如果事务是相对短期的，事务完成，用户提交，发出信号给LGWR进程让它将重做日志缓冲区刷新到联机重做日志文件。如果事务相对持续时间很长和很复杂，下列事情有可能发生：\n\
    \n1）产生的重做引起重做日志缓冲区写满三分之一的空间，这会触发LGWR进程刷新重做日志缓冲区。\n2）放入脏列表中的块数达到限定的长度，这会触发DBWR进程将数据库缓冲区所有脏列表项刷新写入到数据文件中，它反过来也使LGWR进程向磁盘刷新重做日志缓冲区。\n\
    3）遇到一个数据库检查点，这将触发数据库缓冲区高速缓存和重做日志高速缓存刷新。\n\n4）可获得的缓冲区高速缓存中的自由缓存空间下降到规定的门限以下，这也会引起数据库高速缓存缓冲区的刷新。\n\
    \n5）产生一个不可恢复的数据库错误，这迫使该事务中断、回滚并向服务器会话报告错误。\n\n- 当事务正在处理向重做缓存生成的重做并刷新时，联机重做日志逐渐被填满。当前日志被填满后，LGWR进程开始写入下一个日志组；与此同时，归档进程将重做日志复制到磁盘或磁带。因为直到所有重做日志信息从重做缓冲区写入到联机重做日志之后，事务才被记录为执行成功的，所以LGWR和ARCH必须各自有能力在无错误的情况下完成自己的任务。\n\
    \n## 4.2.2 ORACLE数据库实例创建\n\n通过前面介绍，我们知道ORACLE数据库服务器的启动事实上是创建实例的过程。打开一个Oracle数据库的过程具体包括以下三步：\n\
    \n1）创建一个Oracle实例（非安装阶段）\n2）由实例安装数据库（安装阶段）\n3）打开数据库（打开阶段）\n\nOracle实例在数据库启动的非安装阶段创建。当数据库经过非安装阶段时，读取init.ora参数文件，启动后台进程，初始化系统全局区（SGA）。init.ora文件定义了实例的配置，包括内存结构的大小和启动后台进程的数量和类型等。\n\
    \n- 下一阶段称为安装阶段。init.ora文件中的控制文件参数值决定数据库的安装实例。在安装阶段，读取控制文件并使其成为可访问的，可以对控制文件内存储的数据进行查询和修改。\n\
    \n最后的阶段就是打开数据库。在这一阶段，存储在控制文件中的数据库文件以排它使用方式被实例锁定，使数据库能够被普通用户访问。打开是数据库的正常操作状态，在数据库打开之前，只有DBA能访问数据库，且只能通过服务器管理器对其进行访问。\n\
    \n| Oracle启动进程 | 0 开始状态 |  | SHUTDOWN |\n|---|---|---|---|\n|  | 1 启动实例 | 读参数文件；分配SGA；启动后台进程；打开跟踪文件和警告。\
    \ | NOMOUNT (Start up nomount;) |\n|  | 2 装载数据库 | 打开控制文件(控制文件的位置在参数文件中约定)。 | MOUNT\
    \ (Alter database mount;) |\n|  | 3 打开数据库 | 打开数据文件；打开日志文件；(数据库包含的文件名及位置信息在控制文件中约定)。\
    \ | OPEN (Alter database open;) |\n\n- 为了改变数据库的操作状态，必须拥有SYSDBA特权。当数据库从关闭状态到打开状态时，可以单步调试数据库的每一个操作状态，例如，可以在服务器管理器工具中执行STARTUP\
    \ NOMOUNT命令，使数据库处在非安装阶段，接下可以运行ALTER DATABASE MOUNT或者ALTER DATABASE OPEN命令以单步调试到操作阶段。\n\
    \n无论是在何种操作状态下，如果执行SHUTDOWN命令，将完全关闭数据库。当关闭数据库时，只能从当前运行状态转到完全关闭状态，数据库不能从打开状态转到安装状态。\n\
    \n- 没有安装数据库的实例称为空闲的——它使用内存，但不做任何工作。一个实例只能唯一地与一个数据库连接，而且对一个数据库也只分配一个实例(使用并行服务器除外)。\n\
    - 启动数据库命令：\n  STARTUP [FORCE] [RESTRICT] [PFILE=filename] [OPEN [RECOVER] | MOUNT\
    \ | NOMOUNT];\n  FORCE 强制关闭数据库，然后正常启动，\n  RESTRICT 启动数据库，只允许具有特权的用户访问，\n  RECOVER\
    \ 启动数据库同时开始介质恢复，\n  PFILE 说明启动实例使用的参数文件及其位置。\n\n关闭数据库过程与启动相反，关闭数据文件，关闭日志文件，关闭控制文件，关闭实例并释放资源。关闭数据库命令：\n\
    \n```\nSHUTDOWN\n[NORMAL | TRANSACTIONAL | IMMEDIATE | ABORT];\n```\n\n| SHUTDOWN\
    \ | ABORT | IMMEDIATE | TRANSACTIONAL | NORMAL |\n|---|---|---|---|---|\n| 允许新的连接\
    \ | NO | NO | NO | NO |\n| 等待用户结束会话 | NO | NO | NO | YES |\n| 等待事务结束 | NO | NO\
    \ | YES | YES |\n| 产生检查点并关闭数据文件 | NO | YES | YES | YES |\n\n- 关闭数据库的方式中可以看出，\n\
    \  对于NORMAL、IMMEDIATE、\n  TRANSACTIONAL的关闭数据库方式，\n  下次启动数据库时不需做例程恢复；\n  对于ABORT的关闭方式，下次启动要\n\
    \  做例程恢复。\n\n## 4.2.3 ORACLE数据库监控实例\n\n- 使用诊断追踪文件管理实例\n\n后台进程失败经常在数据库的alert.log文件中写入一项，或者写到它们各自的追踪文件，当一个后台进程被终止或者非正常中断一个操作时，通常产生一个追踪文件，包含导致失败的错误信息、当前进程堆栈的转储、当前执行的游标和与问题有关的其它信息。\n\
    \nDBA应当收集这些追踪文件，将它们提供给Oracle全球范围客户支持顾问，他们会帮助你诊断问题。\n\n- 通过操作系统追踪管理实例\n\n后台进程也能通过使用操作系统命令进行追踪。在UNIX环境中，每一个后台进程是一个分立的任务，可以分立追踪。通过查看操作系统进程的内存和CPU的使用（通过使用sar、ps、vms\
    \ tat和top等工具）指明性能问题和失控的查询。有时解决挂起、中断服务器进程或用户进程的唯一方法是在操作系统级中断它们。但只能对有十足经验的用户使用。\n\
