    \ 还有散列聚簇（Hash Cluster）。\n\n### 2.1.2.1 B树（B+树）结构\n\n### 2.1.2.2 索引节点布局和可用空间\n\n\
    ### 2.1.2.3 ORACLE 和 DB2 UDB 的 Create Index\n\n### 2.1.2.4 ORACLE 位图索引\n\n## 2.1.2.1\
    \ B树（B+树）结构\n\n例：假设表中有一百万条记录要建索引，假设索引项占 8 个字节（ROWID 占 4 个字节，键值占 4 个字节），一个 2KB\
    \ 的块可存放 2048/8=256 个索引项，共需 1000000/256=3907 个数据块。\n\n二分法查找：3907 个数据块顺序存放，第一次读入第\
    \ 3907/2=1954 块数据，检查 keyval；第二次读入 1954 块数据中的第 1954/2=977 块数据，检查 keyval，……，第 12\
    \ 次 I/O 操作才能将包含所找键值的数据块调入内存。再根据 ROWID 去提取数据，再加一次 I/O 操作。\n\n二分法查找不停地进行 I/O 操作，挺费劲！\n\
    \n## 2.1.2.1 B树（B+树）结构\n\nB树结构：np 为指向下层节点块的指针，sepkeyval 为分隔符键值，假定目录项所需空间与叶子相同。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_174_0.png)\n\nB树结构存储索引：一百万个索引项建起了三层的\
    \ B 树（叶节点的层号称为 B 树的深度），第一次调入根块，比较后第二次调入第 2 层目录的某一块，第 3 次 I/O 操作即可找到键值数据块。当然，根据\
    \ ROWID 去提取数据，还得再加一次 I/O 操作。\n\nB树结构存储索引使查找变得：好多啦！\n\n## 2.1.2.1 B树（B+树）结构\n\n\
    B树（B+树）结构是从根到叶多个扇出的树形结构，具有下列属性：\n\n1. 每一节点和磁盘块大小一致，存在磁盘上。\n2. 目录层包含目录项（有 n-1 个分隔符键值和\
    \ n 个指向下一层 B 树节点的磁盘指针）。\n3. 叶节点包含形式为（keyval，ROWID）的项。\n4. 根节点以下节点不能是满的（备插入用），但至少是半满的（删除后合并节点）。\n\
    5. 根节点至少有两个项（只有一行记录时除外）。\n\nB树结构随数据的增加而增长，随数据减少而降低。这一过程由系统自动完成，但不同系统采用不同的策略。\n\
    \n许多数据库产品提供对 B 树进行重组织的实用程序，整理数据更新后的 B 树索引结构。\n\n## 2.1.2.2 索引节点布局和可用空间\n\n- B树的深度就近似于要访问到叶节点的\
    \ I/O 操作次数。B树的深度和行的数目是对数关系：\n\n  K = CEIL(logₙ M)\n\n  K 为 B 树的层数，M 为行数，n 为每层的扇出数，CEIL(s)\
    \ 函数返回大于等于 s 的最小整数。\n- 一般经常使用的 B 树的上面层都是放在内存缓冲区中，以减少磁盘访问次数，提高效率。\n- 建索引过程是首先取出索引项，然后按键值排序，最后顺序加到\
    \ B 树叶子层中。实际使用中应当先装数据，再建索引，这样才能保证数据是连续分布的。\n\n## 2.1.2.3 ORACLE 和 DB2 UDB 的 Create\
    \ Index\n\n```sql\nCREATE [UNIQUE|BITMAP] INDEX indexname\n  ON tablename (col[ASC|DESC][,\
    \ col...])\n  [TABLESPACE tsname][STORAGE(...)]\n  [PCTFREE n] [NOSORT];\n```\n\
    \n以上为 ORACLE 创建索引的语句。\n\nPCTFREE 决定索引第一次创建时 B 树节点块将不被填充的百分比，用于插入新行时的索引项，其缺省值为\
    \ 10；对以后不更新的表索引可以设为 0。\n\nNOSORT 表明表中的行已经按索引键值排序并按此顺序存放在磁盘上（建索引省时间）。如果有此子句但表中行没有排序，将报错。\n\
    \n## 2.1.2.3 ORACLE 和 DB2 UDB 的 Create Index\n\n```sql\nCREATE [UNIQUE] INDEX\
    \ indexname\n  ON tablename(col [ASC|DESC] [, col...])\n  [INCLUDE(col [ASC |\
    \ DESC] [, col...])]\n  [CLUSTER]\n  [PCTFREE n] [MINPCTUSED n]\n  [ALLOW REVERSE\
    \ SCANS];\n```\n\nDB2 中索引的表空间与表的表空间一样。\n\nINCLUDE 指定索引中存储的其他非索引列。\n\nMINPCTUSED\
    \ 设置一个阈值，删除行达到该阈值后，块自动合并。\n\nALLOW REVERSE SCANS 创建双向叶子指针（快）。\n\n## 2.1.2.4 ORACLE\
    \ 位图索引\n\n- 如果有重复键值，ORACLE 中可以使用位图索引（bitmap index）。\n- 想想 DB2 中重复键值的块结构。\n- 位图索引的思想：在块中不存放重复键的\
    \ ROWID，而存放 ROWID 转换成的位图（表中有 n 条记录则使用 n 位的 0 和 1 序列，第 k 条记录在 n 位位图的第 k 位置为 1）。例如：5\
    \ 个职员，键值“男”的位图 01001 说明第 2 个和第 5 个职员为男性。\n- 位图索引有很好的 I/O 性能，压缩后的位图占空间少；位图索引在 WHERE\
    \ 后有多个谓词时很有效。\n- 当频繁更新时，位图须先解压，再修改，使得更新费时。频繁更新时，不要使用位图索引。\n\n## 2.1.3 聚簇索引与非聚簇索引\n\
    \n- 根据索引键值把记录行存放在磁盘上称为聚簇（clustering），所引用的行和键值顺序一样的索引称为聚簇索引（clustered index）。\n\
    - B树中，如果叶子节点上直接存放行的信息而不是行的 ROWID，则称索引为主索引（primary index）。如果叶子节点上存放行的 ROWID，则称索引为辅助索引（secondary\
    \ index）。显然，B树主索引就是聚簇索引。\n- 当所查询行彼此很靠近时，使用聚簇索引很有效；非聚簇索引则不能节省 I/O 操作。\n- 一张表只能有一个聚簇索引。DBA\
    \ 和程序员商量决定应该如何使用聚簇索引。\n\n## 2.1.3 聚簇索引与非聚簇索引\n\n```sql\nCREATE [UNIQUE] INDEX\
    \ indexname ON tab... [CLUSTER] [PCTFREE n] [MINPCTUSED n];\n```\n\nDB2 UDB 创建索引时用\
    \ CLUSTER 子句说明该索引为聚簇索引（一张表只能有一个聚簇索引）。\n\n```sql\nCREATE TABLE tablename (...)\
    \ [ORGANIZATION HEAP|ORGANIZATION INDEX]\n```\n\nORACLE 用 ORGANIZATION INDEX 创建\
    \ B 树主索引，但 B 树键值必须为表的主键（primary key）；ORGANIZATION HEAP 为缺省值，表示行可随便放，不一定是 B 树主索引。\n\
    \n## 2.1.3 聚簇索引与非聚簇索引\n\n- ORACLE 中的聚簇是包含了在某些特定列上进行连接的多张表中的行的结构，进行连接的列称为聚簇键。两张表中具有相同聚簇键值的行在磁盘上是存放在一起的。\n\
    - \n\n```sql\nCREATE CLUSTER clustername\n  (colname datatype [,col...])\n  [PCTFREE\
    \ n][PCTUSED n][STORAGE(...)]\n  [SIZE n [K|M]][TABLESPACE tsname]\n  [INDEX|\n\
    \  [SINGLE TABLE]HASHKEYS n[HASH IS exp]];\n```\n\nSIZE 为聚簇键值对应行的空间大小（缺省为 1 块）。\n\
    \n## 2.1.3 聚簇索引与非聚簇索引\n\n- 聚簇创建好后，可以在该聚簇上建表。例：\n\n```sql\ncreate cluster deptemp\
    \ (deptno int) size 2000;\ncreate table emps(empno int primary key,\n    ename\
    \ varchar(10),deptno int)\n    cluster deptemp(deptno);\ncreate table depts (deptno\
    \ int primary key,\n    dname varchar(9)) cluster deptemp(deptno);\n```\n\n- 聚簇上还要创建索引，这样即可按聚簇索引键访问行了。索引聚簇使相同列只存储一次，节约空间；索引聚簇使连接运算更加快捷；聚簇上的索引适用于其中各个表，减少开销。\n\
    \n"
