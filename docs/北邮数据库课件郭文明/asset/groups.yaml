    # 4.4.1 数据库应用程序类型


    规划和配置数据库，需要知道将要操作数据库的事务有什么，这些事务访问数据库的频率有多大。针对不同的事务访问情形，对内存的要求不同，磁盘I/O操作情形也不同。只有设置合适的ORACLE实例，才能使数据库应用系统获得快速、准确、可靠的事务响应。ORACLE既可以设置成处理长的密集型事务的系统，也可以设置成处理大量的小型快速事务的系统。有三种通用的数据库设置类型：


    +   - 联机事务处理（OLTP）

    +   - 决策支持系统（DSS）

    +   - 批量作业系统

    +   - 混合系统'
  - '[PAGE 465]


    # 4.4.1 数据库应用程序类型


    - 联机事务处理（OLTP）


    OLTP系统是一个包含繁重DML的应用，其面向事务的活动主要包括更新，但也包括一些插入和删除。典型的例子是用于航空公司和旅馆的预定系统。OLTP系统可以允许有很高的并发性。


    OLTP的特点是有大量短的事务高频率地访问数据库，每一个事务操作的数据量不是很多，但事务比较频繁，而且要求数据库响应事务的速度快。


    一般来说OLTP系统需要24*7地响应对数据库的请求。根据这些要求，我们应该从以下几方面考虑：


