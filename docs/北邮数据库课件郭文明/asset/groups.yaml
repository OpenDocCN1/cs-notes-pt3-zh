    # 5.1 数据库设计过程


    +   - 数据库系统设计是在现成的DBMS上建立数据库应用系统的过程。其特点是：数据量大、保存时间长，数据关联复杂，用户要求多样化。

    +   - 从系统开发角度来看，数据库系统具有结构特性和行为特性两个方面。


    +   - **结构特性设计**（数据库设计）

    +     1. 是与数据模型所反映的实体及实体之间的联系的静态模型的设计。

    +     2. 设计各级数据库模式，决定数据库系统的信息内容。

    +   - **行为特性设计**（数据库应用软件的开发）

    +     1. 与数据库状态转换有关，是改变实体特性的操作。

    +     2. 决定数据库系统的功能，是事务处理等应用程序的设计。'
