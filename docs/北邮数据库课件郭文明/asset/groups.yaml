    # 4. 3. 1. 4 鉴别存储问题


    +   - 表检查


    表检查包括估计总的容量以及实际使用的空间。

    一个已用空间与分配空间的比值很低的区间意味着INITIAL和NEXT区域值可能被设置得太高了。可以在DBA_EXTENTS表中找到区间信息。


    +   - 优化簇存储和检查索引


    理想情况下，每个簇刚好有一个区间。可以查询DBA_EXTENTS计算每个簇的区间数目。可能的情况下，重新计算最佳的存储参数，并重建一个簇。

    同簇一样，理想情况下每个索引刚好有一个区间。


    +   - 监控临时表空间


    排序、链接和GROUP BY子句等操作要使用临时表空间。要监控临时段，可以检查DBA_SEGMENTS中类型为TEMPORARY的所有段信息。'
  - '[PAGE 441]


    # 4. 3. 2 ORACLE安全管理


    Oracle安全模型原理是基于最小特权原则。此原则认为用户应该仅有完成他的任务所必需的特权。ORACLE的安全性主要通过用户(USER)管理、权限(PRIVILEGE)管理、角色(ROLE)管理来实现。ORACLE的安全管理在第二章中已经作过介绍，下面的内容是第二章的继续。


    # 4. 3. 2. 1 用户验证


    # 4. 3. 2. 2 权限管理


    # 4. 3. 2. 3 审计'
  - '[PAGE 442]


    # 4.3.2.1 用户验证


    - 数据库验证


    当创建用户时，可以为其选择资源限制文件。


    资源限制文件 (profile) 可以使用企业管理器 (OEM) 或SQL*Plus创建环境资源文件，使资源限制文件生效需在init.ora中设置resource_limit=TURE。


    资源限制文件可以做到口令限制和资源限制。


    资源限制包括会话级限制 (当达到限制要求时则断开会话) 和调用级限制 (当达到限制要求时回退语句)。


    具体有：限制会话的数量、每个会话使用CPU时间 (100秒为单位)、CPU调用的次数、逻辑读的次数、每次调用的逻辑读的次数、空闲时间以及连接时间等等。'
  - '[PAGE 443]


    # 4.3.2.1 用户验证


    - 数据库验证


    # 口令限制包括


    用户帐户的锁定：当一个用户多次注册失败后，该帐户能够被锁定一段指定的时间；


    口令使用期与到期：一个给定的口令在使用一段时间后过期，此时必须修改该口令；


    口令历史：口令历史选项检查每一个新近设定的口令以确保口令在指定长度的时间内或指定次数的口令修改中未重复使用；


    口令复杂性验证：复杂性验证检查口令的长度以使它更难被计算机破坏者所破解（长度上至少为4个字符，不要与用户标识相同，至少包含一个字母字符、一个数字字符和一个标点符号，不要与简单单词的一个内部列表上的任何单词匹配，与以前的口令至少有3个字符不同）。'
  - "[PAGE 444]\n\n# 4.3.2.1 用户验证\n\n+   - 数据库验证\n\n```\n例： CREATE PROFILE d_prof\
    \ LIMIT\n  SESSIONS_PER_USER 2  --限制会话的数量\n  CPU_PER_SESSION 10000 --会话使用CPU时间\n\
    \  (100秒为单位)\n  IDLE_TIME 60 --空闲时间\n  CONNECT_TIME 480; --连接时间\n```\n\n```\n\
    例： CREATE PROFILE grace LIMIT\n  FAILED_LOGIN_ATTEMPTS 3  --3次失败则锁定\n  PASSWORD_LIFT_TIME\
    \ 30  --可以使用30天\n  PASSWORD_GRACE_TIME 5;  --30天到期后再提示5天\n```"
  - '[PAGE 445]


    # 4.3.2.1 用户验证


    +   - 外部验证


    外部验证依赖于操作系统或网络验证服务。此类登录不需要数据库口令。要使用外部验证，init.ora 参数REMOTE_OS_AUTHENT必须被设置为TRUE（缺省值是FALSE）。另外在init.ora文件中设置
    OS_AUTHENT_PREFIX参数表示任何同此值有相同前缀的用户将在外部得到验证。比如，该值被设置为ops 那么所有以ops打头的用户将在外部得到验证。


    +   - 企业验证


    企业验证启用一个中央资源用于口令管理，该用户被称为全局用户（global user）并且必须在每个使用全局口令的数据库中创建。假如口令得到验证，用户便能够访问Oracle数据库。Oracle安全服务与
    Oracle企业管理器的接口集中了安全角色管理和企业验证。这使得当前正在被管理的用户具有全局同一性。'
  - '[PAGE 446]


    # 4. 3. 2. 2 权限管理


    +   - ORACLE权限有系统权限和对象权限，通过将权限直接授予用户或通过将角色（一定权限的集合）赋予用户完成用户的权限管理（见第二章）。

    +   - 两种特权：


    | Category | Examples |

    |---|---|

    | SYSOPER | STARTUP

    SHUTDOWN

    ALTER DATABASE OPEN|MOUNT

    ALTER DATABASE BACKUP CONTROLFILE TO

    RECOVER DATABASE

    ALTER DATABASE ARCHIVELOG |

    | SYSDBA | 不仅具有SYSOPER权限，而且

    CREATE DATABASE

    ALTER DATABASE BEGIN/END BACKUP

    RESTRICTED SESSEION

    RECOVER DATABASE UNTIL |'
  - '[PAGE 447]


    # 4. 3. 2. 3 审计


    +   - Oracle能够审计并记录数据库中发生的活动。可以​使用AUDIT命令允许审计操作或使用NOAUDIT命令禁止审计操作。有三种类型的审计操作：登录尝试、对象存取(具体对象上的具体语句)和数据库操作(具体的系统特权和语句，不考虑对象)。

    +   - 任何一条命令，不管是成功的还是不成功的都可以进行审计。要创建审计系统视图，以用户SYS的身份运行CATAUDIT.SQL文件脚本，并设置init.ora参数AUDIT_TRAIL，该参数可以设置为写入数据库或一个操作系统文件：

    +     AUDIT_TRAIL=DB 写入数据库，所有已审计的活动被写入SYS.AUD$表中； AUDIT_TRAIL=OS 写入一个操作系统文件。'
  - '[PAGE 448]


    # 4.3.3 ORACLE备份与恢复


    +   - 数据丢失分为物理丢失和逻辑丢失两类。


    物理数据丢失是指操作系统级的数据库组件的丢失，例如数据文件、控制文件、重做日志以及存档日志。


    逻辑数据丢失是诸如表、索引或表记录的数据库级组件的丢失。


    Oracle能够实现物理数据备份与逻辑数据备份。有效的备份计划必须把两种方案都包含在内才能完全避免数据丢失。'
  - '[PAGE 449]


    # 4.3.3 ORACLE备份与恢复


    +   - 物理数据备份即为数据文件、控制文件、归档重做日志的拷贝。


    物理备份应用于相同的Oracle版本以及引起物理备份的实例上的恢复，因此，物理备份被认为是不可能移植的，它们通常仅用于保护同一台机器和实例中的数据免遭数据丢失。物理备份通常按照预定的时间间隔运行以防止数据库的物理丢失。


    物理备份可以进一步分为冷备份(脱机备份offline backup)与热备份(联机备份online backup)。'
  - '[PAGE 450]


    # 4.3.3 ORACLE备份与恢复


    +   - 逻辑数据备份通常是SQL语句的集合，这些SQL语句重新创建数据库对象(表、索引、授权、角色等)和记录。


    当需要在不同实例之间移动指定的数据，或者需要在不同的系统结构、操作系统版本或Oracle版本之间拷贝一个实例的全部数据时可以使用Oracle的逻辑备份系统。逻辑备份用于实现数据库对象的恢复，用来保证数据库能够从无意中的修改(例如DELETE、DROP等)中恢复出来。


    在开发者环境中，应该设计一个逻辑备份策略。一般存在两个数据库拷贝，一个是成品数据库，另一个由开发者使用，用来调试他们的程序。开发数据库将与成品数据库定期地保持同步。'
  - '[PAGE 451]


    # 4.3.3.1 ORACLE逻辑备份


    +   - Oracle提供了逻辑备份工具EXP（IMP用于逻辑恢复）。命令格式如下：


    ```

    EXP [keyword=value[, keyword=value...]]

    ```


    # — 完全逻辑备份


    EXP可用于完全逻辑数据库备份。但条件是必须有EXP_FULL_DATABASE权限和足够的存储空间。


    写入缺省输出文件中的完全逻辑备份的例子：


    ```

    exp USERID=SYSTEM/MANAGER FULL=Y

    ```


    # — 指定用户模式的逻辑备份


    EXP支持指定用户模式的备份。导出一个指定的用户组会导出用户定义的所有表、索引等相关的数据。


    把TGASPER模式导出到标准输出文件中的示例：


    ```

    exp USERID=SYSTEM/MANAGER OWNER=TGASPER

    ```'
  - '[PAGE 452]


    # 4.3.3.1 ORACLE逻辑备份


    +   - 指定表的逻辑备份


    导出一组表的处理方法与用户导出的方法一样。用TABLES关键字列举表的名字，可以导出一个或一组表。


    下面的例子把ABC表与XYZ表从BGE模式中导出到缺省输出文件中：


    ```

    exp USERID=SYSTEM/MANAGER OWNER=BGE TABLES =XYZ, ABC

    ```


    注意EXP缺乏一些主要的功能，EXP使你不能导出一条基于SQL WHERE子句的信息。Oracle的导出文件实际上是一种专有格式。市场上有很多第三方的工具提供了这些缺少的功能。


    运行exp HELP=Y会显示EXP的所有关键字及其描述。


    ORACLE逻辑备份工具EXP的对应恢复工具是IMP，其用法可以参照EXP。'
