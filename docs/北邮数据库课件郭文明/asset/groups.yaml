    |  | a1 b3 c2 |

    | S | R ∩ S |

    | A B C | A B C |

    | a1 b2 c2 | a1 b2 c2 |

    | a1 b3 c2 | a2 b2 c1 |

    | a2 b2 c1 |  |'
