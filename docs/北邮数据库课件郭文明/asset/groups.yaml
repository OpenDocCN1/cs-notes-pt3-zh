    # 1. 4. 2. 2 ORACLE汇集类型


    +   - 子表的数据只能通过父表来访问。


    检索0001号职工的家属：


    对象列必须加限定非对象列不加


    ```

    select dependents from employees where eid=''0001'';

    ```


    检索有2个家属以上的职工eid：


    ```

    select eid from employees e where 2<(select count(*) from table(e.dependents));

    ```


    Table()将e.dependents转换为一表


    检索0003号职工的家属数目：


    错误:select count(*) from (select e.dependents from employees e where e.eid=''0003'');


    错误:select count(*) from (select table(e.dependents) from employees e where e.eid=''0003'');


    正确:select count(*) from table (select e.dependents from employees e where e.eid=''0003'');'
  - "[PAGE 139]\n\n# 1. 4. 2. 2 ORACLE集合类型\n\n+   - 利用表的乘积可以消除表的嵌套。\n\n显示职工号及其家属名：\n\
    \n```\nselect e.eid,d.name from employees e,\n    table(e.dependents) d;\n```\n\
    \n没有家属的eid不显示\n\n```\nselect e.eid,d.name from employees e,\n    table(e.dependents)\
    \ (+) d;\n```\n\n(+)表示外连，没有家属的eid也显示\n\n显示具有最大家属名的职工号及其家属名：\n\n```\nselect e.eid,d1.name\
    \ from employees e,\n    table(e.dependents) d1 where d1.name=\n    (select max(d2.name)\n\
    \        from table(e.dependents) d2);\n```"
