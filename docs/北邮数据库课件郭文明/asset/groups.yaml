    # 3.1.4 错误处理


    +   - 没有WHEN EVER语句时缺省动作是Continue.

    +   - 如果SQLCODE为负,则SQLERROR为真,如果SQLCODE为100或SQLSTATE为02000,则NOT FOUND为真。抽取错误信息的确切代码依赖于所使用的数据库系统。

    +   - WHENEVER语句的主要价值在于减少处理错误的代码行数，另外WHEN EVER的语法可以在不同数据库系统之间进行最大限度的移植。例如利用检测条件NOT
    FOUND在不同数据库产品中可能有不同的sqlca.sqlcode值，但NOT FOUND却始终表示没有发现记录这一错误。'
