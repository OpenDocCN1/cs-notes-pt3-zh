    | 001 | 张三 | 一级 | 800 | 2000 |\n| 002 | 李四 | 三级 | 1200 | 4000 |\n\n表2\n| 工号 |\
    \ 扣款项目 | 扣款金额 |\n|------|----------|----------|\n| 001 | 考勤 | 120 |\n| 001 | 违纪\
    \ | 10 |\n| 002 | 考勤 | 20 |\n\n- **第三范式**（3NF）：\n  - 定义：如果 X→Y，Y→A 且 Y!→X 和 A!⊂Y，那么称\
    \ X→A 是**传递依赖**（A 传递依赖于 X）。\n  - 定义：关系模式 R 中不存在这样的候选键 X、属性组 Y 和非主属性 Z（Z!⊂Y）使得\
    \ X→Y，(Y!→X) Y→Z 成立，即非主属性既不部分依赖也不传递依赖于 R 的候选键，则称 R 是**第三范式**。\n  - 工资管理模式 3 属于\
    \ 2NF，但不属于 3NF，因为表1中非主属性“基本”、“津贴”是传递依赖于候选键{工号}的，2NF 存在数据冗余、操作异常。\n  - **2NF 模式通过分解可以达到\
    \ 3NF**，方法是消除非主属性对候选键的传递依赖，把传递依赖的属性单独组建关系。\n\n- 工资管理模式3分解成模式4（如上表），模式4属于3NF。\n\
    \n### 工资管理模式4\n\n| 表1 | 工号 | 姓名 | 级别 |\n|---|---|---|---|\n|  | 001 | 张三 | 一级\
    \ |\n|  | 002 | 李四 | 三级 |\n\n| 表3 | 级别 | 基本 | 津贴 |\n|---|---|---|---|\n|  | 一级\
    \ | 800 | 2000 |\n|  | 三级 | 1200 | 4000 |\n\n| 表2 | 工号 | 扣款项目 | 扣款金额 |\n|---|---|---|---|\n\
    |  | 001 | 考勤 | 120 |\n|  | 001 | 违纪 | 10 |\n|  | 002 | 考勤 | 20 |\n\n- BC范式 (BCNF)：\n\
    \  - 3NF模式中讨论非主属性，并未排除主属性对候选键的传递依赖，任有可能存在冗余和异常。\n  - 定义：如果关系模式R是1NF，且每个属性都不部分依赖于候选键也不传递依赖于候选键，那么称R是BC范式。\n\
    \  - 属于BCNF的模式一定属于3NF，但属于3NF的模式不一定是BCNF。\n  - 例： R(Bno, Bname, Author)的属性表示书号、书名和作者名。调查实际情况后有如下规则：每个书号只有一个书名，不同书号可以有相同书名；每本书可以有多个作者合作，但每个作者参与编著的书名应该互不相同。这样得到两个FD：\n\
    \    Bno→Bname和{Author, Bname}→Bno\n\n- 例（续）：\n\n根据逻辑蕴涵可以推出R的候选键为{Bname, Author}或{Bno,\
    \ Author}, R的属性都是主属性，R显然是3NF。但Bname传递依赖于候选键{Author, Bname}，所以R不是BCNF。\n\nR存在冗余和操作异常：一本书由多个作者编写时，其书名与书号间的联系在关系中将多次出现，数据冗余；修改由多个作者编写的书的书名时必须修改多条记录，更新异常。\n\
    \n把R分解成R1{Bno, Bname}和R2{Bno, Author}，能解决上述问题，且都是BCNF。但这个分解把{Author, Bname}→Bno的函数依赖丢失了。\n\
    \n- 对于排除主属性对候选键的传递依赖或部分依赖的问题，模式分解不能保证保持函数依赖。\n\n- 关系规范化盘点：\n  - 不好的数据库设计存在数据冗余、操作异常。函数依赖的分析提供了很好的数据库设计思路。\n\
    \  - 对数据库设计过程中初始函数依赖关系的采集是通过理解数据项和企业的规则来决定函数依赖的。\n  - 函数依赖存在大量的蕴涵逻辑，通过 Armstrong\
    \ 公理可以得出许多蕴涵的函数依赖，根据所有这些函数依赖找出关系的候选码、主属性、非主属性。\n  - 不好的数据库模式的原因是表达函数依赖的方式不妥，通过模式的分解，在保证无损连接的同时更好地表达函数依赖。研究并消除属性之间的部分依赖、传递依赖即可得到高级别范式的模式。\n\
    \n关系规范化盘点：\n\n- 模式好坏的评价标准是范式，范式的高低不是规范化的步骤。从不同角度的分解都可以得到高级别的范式，一般不是从1NF到2NF，2NF到3NF的。\n\
    \n- 实际使用时，一般是基于3NF进行，但根据实际情况，不达3NF的情况也很常见。\n\n- 有的数据库设计工具(CASE)支持基于函数依赖的规范化方法的算法，从函数依赖集合生成有效的ER图来反映数据的规则。\n\
    \n- ER方法和基于函数依赖的规范化方法都有各自缺点，ER方法过分依赖于设计者的直觉，规范化方法又更多地基于数学方法，在应用时显得过分机械。结合两种方法，ER图从实体联系角度，规范化从函数依赖角度，一般能得到较好的数据库模式。\n\
    \n- 以上规范化过程是建立在函数依赖基础上进行的。除函数依赖之外，还有其它的数据依赖（见参考资料5）。数据库设计的规范化问题研究是数据库领域的一个重要研究方向。\n\
