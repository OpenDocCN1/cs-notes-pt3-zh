  - '[PAGE 157]


    # 2.1 数据存储


    数据存储技术的重要目标就是尽可能减少读写数据所需的磁盘访问(I/O操作)次数，尽可能使数据驻留在内存中。


    均衡负载,提高效率！


    +   - 2.1.1 数据的磁盘存储

    +   - 2.1.2 索引

    +   - 2.1.3 聚簇索引与非聚簇索引

