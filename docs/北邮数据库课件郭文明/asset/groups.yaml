    # 选择 (Selection)


    +   - 定义 1.2.2 选择　选择又称为限制 (Restriction)，它是在关系 R 中选择满足给定条件的诸元组，记作：


    σ_F(R) = { t | t ∈ R ∧ F(t) = ‘真’ }


    其中 F 表示选择条件，它是一个逻辑表达式，取逻辑值‘真’或‘假’。逻辑表达式 F 由逻辑运算符 ¬、∧、∨ 连接各算术表达式组成。算术表达式的基本形式为：X1
    θ Y1，其中 θ 表示比较运算符，它可以是 >、≥、<、≤、= 或 ≠；X1、Y1 等是属性名，或为常量，或为简单函数；属性名也可以用它的序号来代替。'
