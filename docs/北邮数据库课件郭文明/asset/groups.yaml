    # 3.1.5 指示变量


    +   - 如果一个宿主变量所对应的数据库字段允许空值，或字符串类型的宿主变量的长度可能小于所对应的数据库字段的长度，则需要一个指示变量来指明数据库访问的返回状态。

    +   - 指示变量: 是一个C变量，用来指示返回给宿主变量的值是否为null值，以及返回给宿主变量的字符串是否发生了截断。


    指示变量的返回值：


    +   - = 0: 取到主变量的值不空，没有发生截断。

    +   - = -1: 取到主变量的值为空值。

    +   - > 0: 取到主变量的值发生了截断，指示变量的值是截断前的字符串的实际长度。'
