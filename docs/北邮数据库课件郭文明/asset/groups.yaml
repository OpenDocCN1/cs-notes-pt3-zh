    \n当ARCH正在复制归档重做日志时，没有其他进程能够写入这个重做日志。重做日志是按顺序循环使用的，如果数据库需要转换重做日志，但是ARCH还正在按其顺序复制下一个日志，所有数据库的活动将终止，直到ARCH完成。如果归档由于某些原因不能完成复制日志，它将等待直到引起不能写入的错误得到解决为止。\n\
    \n在init.ora文件中ARCHIVE_LOG_START参数必须设置为TRUE，当数据库启动时，才会自动开始归档。如果设置了归档模式，但不自动启动ARCH，当所有联机重做日志写满时，数据库将会挂起，等待你手工归档联机日志。\n\
    \n### 检查点进程(CKPT)\n\nCKPT是可选的后台进程，执行LGWR进程通常会执行的检查点任务——即用当前版本信息更新数据文件和控制文件头。\n\
    \nCHECKPOINT_PROCESS参数设置为TRUE可以启用CKPT进程。注意在Oracle 8.x中，该已被集成入RDBMS中并设置为TRUE。如果在Oracle\
    \ 8.x的init文件中包括这个参数，实例启动将会失败。\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_389_0.png)\n\
    \n### 恢复进程(RECO)\n\n负责在分布式数据库中恢复失败的事务。分布式事务配置数据库时(设置DISTRIBUTED_TRANSACTIONS值大于0)，RECO会自动启动。\n\
    \n### 快照进程(SNPn)\n\n处理数据库快照的自动刷新，并运行预定的数据库过程。参数 JOB_QUEUE_PROCESS设置启动的快照进程数，参数JOB_QUEUE_INTERVAL决定快照进程在被唤醒以处理挂起的作业或事务之前休眠的时间(以秒为单位)。\n"
  mdcn: "\n\n## 4.2.1.2 ORACLE进程\n\n- Oracle后台进程有：\n  - 系统监控（SMON）\n  - 进程监控进程（PMON）\n\
    \  - 数据库写进程（DBWR）\n  - 日志写进程（LGWR）\n  - 调度进程（Dnnn）\n  - 归档进程（ARCH）\n  - 检查点（CKPT）\n\
    \  - 恢复进程（RECO）\n  - 快照进程（SNPn）\n  - 锁进程（LCKn）\n  - 并行查询进程（Pnnn）\n\n### 系统监控 (System\
    \ Monitor, SMON)\n\n进程监控 (Process Monitor, PMON)：\n\n由于种种原因，对Oracle数据库的连接可能会发生崩溃、挂起或其他非正常终止。例如，网络断线、用户提出不合理的要求遭到系统拒绝，操作系统出错等等，都会引起连接中断或系统挂起，Oracle服务器必须有能力去处理由于各种原因而引起的失败。\n\
    \n系统监控和进程监控都是自动解决数据库系统问题的后台进程。\n\n进程监控(PMON) 自动清除中断或失败的进程，包括清除非正常中断的进程留下的孤儿会话、回滚未提交事务、释放被断开连接的进程占有的锁、释放被失败进程占有的系统全局区(SGA)资源，它同时监控服务器和调度进程，如果它们失败则自动重启它们。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_376_0.png)\n\n系统监控(SMON)作为恢复自动实例的过程，回滚尚未提交的事务或前卷重做日志。SMON也是管理某些数据库段的过程，收回不再使用的临时段空间，并自动合并在数据文件中相邻的自由空间块。\n\
    \nSMON仅当创建表空间或表时的缺省存储参数 pctincrease不是0时，合并表空间中的自由空间。如果想让SMON自动地处理这个操作，至少将 pctincrease设置为1。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_377_0.png)\n\n### 数据库写进程\n\n(Database\
    \ Writer, DBWR)：\n负责将缓冲区中脏的数据块写入到数据文件中。\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_378_0.png)\n\
    \n数据库写进程 (Database Writer, DBWR)\n\nDBWR等到下列情况发生时，才成批地读脏列表，并将在脏列表中发现的所有块刷新写入数据文件。\n\
    \n1） 发生一个检查点。\n2） 脏列表的长度达到init.ora文件中 DB_BLOCK_WRITE_BATCH参数值的一半。\n3） 使用的缓冲区数量达到init.ora参数\
    \ DB_BLOCK_MAX_SCAN。\n4） DBWR后台进程发生超时（大约每3秒）。\n\n数据库写进程 (Database Writer, DBWR)\n\
    \n在大多数安装中，有一个DBWR进程处理所有数据库的所有写入活动。但是当发现这个DBWR进程不能满足数据库要求时，可以启动一个以上的DBWR进程。\n\n\
    init.ora文件中DB_WRITES参数可以设置在启动时创建的DBWR进程数(缺省值是1)。建议使用与存储数据文件的物理磁盘一样多的DBWR进程或者将这个数量设为与数据库中数据文件的数量相等。\n\
    \n数据库写进程(Database Writer, DBWR)\n\n另一个参数是DB_BLOCK_CHECKPOINT_BATCH，设置在每个检查点DBWR写入的块的最大量（参看检查点进程）。增大该参数，可以减少DBWR刷新缓冲区的次数。但将这个数值增得过大，当DBWR最终刷新缓冲区时，可能产生不能接受的延迟。\n\
    \n第三个参数是DB_BLOCK_CHECKSUM，这是个布尔参数，启用这个参数时，导致每个数据库块被写入时附加一个校验和值。当随后读取该块时，计算校验和值并与存储在数据库中的数值进行比较，如果值不同，将产生错误。当查找数据毁坏问题时，这是一个有价值的参数，但是在全部时间都启用这个值也会有代价。\n\
    \n### 日志写（Log Writer, LGWR）\n\nLGWR 是将在系统全局区中重做日志缓冲区的重做日志条目写入到联机重做日志文件的进程。\n\n\
    LGWR执行写入操作的条件是：发生提交、重做日志缓冲区满度达到三分之一、超时（3秒）、DBWR进程开始之前。\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_382_0.png)\n\
    \n日志写（Log Writer，LGWR）：\n\n检查点导致LGWR和DBWR。检查点间隔时间越短，发生数据库故障时需要的恢复时间越短，同时减少了必须执行每一检查点所需的工作。当决定正确的检查点间隔时，必须权衡所有这些因素。\n\
    \nLOG_CHECKPOINT_INTERVAL参数即一定数量的操作系统块（不是Oracle块）写入重做时，引起数据库中的一个检查点被触发。LOG_CHECKPOINT_TIMEOUT参数指定的时间间隔（以秒为单位）发生一个检查点。\n\
    \n日志写（Log Writer, LGWR）：\n\n另外当一个重做日志组写满时，一个检查点被触发。要注意不要设置不必要的检查点，或者迫使不需要的检查点发生。例如，如果一个重做日志组大小为3MB，而LOG_CHECKPOINT_INTERVAL设置为2.5MB。当有2.5MB的数据写入重做日志时，导致发生一个检查点。另外，当重做日志组写满时（仅在又写入0.5MB的数据后），发生另一个检查点。事实上，这两个检查点将相继发生。频繁的检查点将浪费大量的进程活动和I/O次数以执行相关的检查点。\n\
    \n最后一个参数是布尔值LOG_CHECKPOINTS_TO_ALERT。每当检查点发生时，它为数据库在alert.log文件中设置一个标记，并用于试图指出确切的检查点间隔。\n\
    \n### 调度进程\n\n正如前面所提到的，服务器进程既可以是一个用户进程专有的，也可以 在多个用户进程之间共享。使用共享服务器要求配置多线程服务器。当使用共享服务器进程时，至少必须存在一个调度进程（Dnnn），在环境需要时也可能有多个调度进程。调度进程将用户请求传送到系统全局区的请求队列，并将服务器的响应信息返回给正确的用户进程。\n\
    \n参数MTS_DISPATCHERS指定调度进程使用的协议及开始使用该协议的调度进程的数量。\n\n参数MTS_MAX_DISPATCHERS控制RDBMS允许的调度进程的最大数量。\n\
    \n### 归档进程(Archiver, ARCH)\n\nARCH负责将全部联机重做日志复制到归档重做日志文件。这仅在数据库运行在归档模式（ARCHIVELOG）下才发生。\n\
    \n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_387_0.png)\n\n归档进程(Archiver, ARCH)：\n\
    \n当ARCH正在复制归档重做日志时，没有其他进程能够写入这个重做日志。重做日志是按顺序循环使用的，如果数据库需要转换重做日志，但是ARCH还正在按其顺序复制下一个日志，所有数据库的活动将终止，直到ARCH完成。如果归档由于某些原因不能完成复制日志，它将等待直到引起不能写入的错误得到解决为止。\n\
    \n在init.ora文件中ARCHIVE_LOG_START参数必须设置为TRUE，当数据库启动时，才会自动开始归档。如果设置了归档模式，但不自动启动ARCH，当所有联机重做日志写满时，数据库将会挂起，等待你手工归档联机日志。\n\
    \n### 检查点进程(CKPT)\n\nCKPT是可选的后台进程，执行LGWR进程通常会执行的检查点任务——即用当前版本信息更新数据文件和控制文件头。\n\
    \nCHECKPOINT_PROCESS参数设置为TRUE可以启用CKPT进程。注意在Oracle 8.x中，该已被集成入RDBMS中并设置为TRUE。如果在Oracle\
    \ 8.x的init文件中包括这个参数，实例启动将会失败。\n\n![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_389_0.png)\n\
    \n### 恢复进程(RECO)\n\n负责在分布式数据库中恢复失败的事务。分布式事务配置数据库时(设置DISTRIBUTED_TRANSACTIONS值大于0)，RECO会自动启动。\n\
    \n### 快照进程(SNPn)\n\n处理数据库快照的自动刷新，并运行预定的数据库过程。参数 JOB_QUEUE_PROCESS设置启动的快照进程数，参数JOB_QUEUE_INTERVAL决定快照进程在被唤醒以处理挂起的作业或事务之前休眠的时间(以秒为单位)。\n\
    \n"
