  - '[PAGE 197]


    # 2.2.1.5 资源管理


    +   - PROFILE为用户规定了动态资源限制,如果创建用户时不指定资源限制文件,则采用一个叫做DEFAULT文件的配置(缺省配置).资源限制文件可以限制一个单独的调用或整个会话所需要的资源.

    +   - CREATE PROFILE filename LIMIT

    +     SESSIONS_PER_USER n|UNLIMITED  --用户可同时进行几个会话

    +     CPU_PER_SESSION n|UNLIMITED  --每个会话用多少1%秒CPU

    +     CONNECT_TIME n|UNLIMITED  --连接数据库时间(分钟)

    +     LOGICAL_READS_PER_SESSION n|UNLIMITED  --会话中调用块数

    +     ........ ;

    +   - 限制用户动态资源的目的是为了安全,分配给用户的动态资源应与用户的正常业务相当.如果用户资源占用超越分配值,意味着用户在干‘份外’的工作了.系统阻止这类行为通常是结束会话,回退当前事务,返回错误信息.'
  - '[PAGE 198]


    # 2.2.1.6 审计


    +   - DBA需要了解用户对表作了那些操作,用户登录多少次等数据库使用情况,以便对系统进行管理。审计是DBMS用于监控用户活动,保障系统安全的重要方法。ORACLE将审计记录写在审计痕迹(Audit
    trail)表,可以查看此表审查数据库的活动。

    +   - 审计用户： AUDIT 语句选项 [BY 用户]

    +     [BY ACCESS| SESSION]

    +     [WHENEVER [NOT] SUCCESSFUL];

    +     BY 用户 对指定用户审计,缺省为对所有用户审计;

    +     BY ACCESS审计全部SQL, BY SESSION一次会话相同SQL只审计一次(节约), 缺省为全部审计;

    +     WHENEVER [NOT] SUCCESSFUL审计成功或不成功的, 缺省为不管成功不成功均审计。'
  - '[PAGE 199]


    # 2.2.1.6 审计


    +   - 例: AUDIT select table, update table BY user1

    +     对用户user1的查询或修改表和视图操作审计。

    +   - 审计对象： AUDIT 选项 | ALL ON [模式.]对象

    +     [BY ACCESS | SESSION]

    +     [WHENEVER [NOT] SUCCESSFUL];

    +   - 例: AUDIT insert, update ON user1.student

    +     审计在用户user1的student表上的插入修改操作。

    +   - 审计查看： USER_AUDIT_TRAIL  - 定义的审计信息

    +     DBA_AUDIT_TRAIL  - 审计结果

    +     AUDIT_ACTIONS  - 可审计的命令

    +   - 撤销审计： NOAUDIT...'
  - '[PAGE 200]


    # 2.2.2 完整性约束


    +   - 数据库应用设计者和DBA可以事先为每个数据项确定一些规矩,要求进入数据库的数据必须符合规矩,这些规矩即为完整性约束.

    +   - 实现数据完整性的方法有三种:应用接口编程、表定义时定义约束、触发器编程描述完整性.后两种方法由DBMS提供,与客户端无关,可降低网络负担.


    +   - 2.2.2.1 Create table的完整性约束

    +   - 2.2.2.2 Alter table修改完整性约束

    +   - 2.2.2.3 触发器(Trigger)'
  - '[PAGE 201]


    # 2.2.2.1 Create table的完整性约束


    +   - CREATE TABLE [schema.]tablename

    +   (colname dadatype [DEFAULT 值|NULL]

    +   [列级约束|表级约束][,colname...]);


    列级约束:NOT NULL 或 [CONSTRAINT 约束名] UNIQUE|PRIMARY KEY|CHECK(条件) |REFRENCES 表[(col,...)][ON
    DELETE CASCADE]]


    表级约束:[CONSTRAINT 约束名] UNIQUE(col,col...) |PRAMARY KEY (col,col...)|CHECK(条件) |FOREIGN
    KEY (col,col...) REFRENCES 表 [(col,...)] [ON DELETE CASCADE]


    为了修改约束,可用此子句为列或表约束定一名字


    没有此说明时,参照表的主键'
  - "[PAGE 202]\n\n# 2. 2. 2. 1 Create table的完整性约束\n\n+   - 通过not null,unique,primary\
    \ key可实现实体完整性,通过发foreign key refrences可定义参照完整性,on delete cascade表示连带删除.\n\n+ \
    \  - 例：\n\n```\ncreate table orders (ordno integer not null, month char(2),\n\
    \  cid char(4) not null,aid char(4) not null, pid char(4) not null,\n  qty integer\
    \ not null constraint qck check(qty>=0),\n  dollars float default 0.0 constraint\
    \ dck check(dollars>=0.0),\n  primary key (ordno),\n  constraint cidref foreign\
    \ key (cid) references customers,\n  constraint aidref foreign key (aid) references\
    \ agents,\n  constraint pidref foreign key (pid) references products);\n```"
  - '[PAGE 203]


    # 2.2.2.2 Alter table修改完整性约束


    +   - Alter Table语句允许DBA改变表的结构,加入或改变列,加入或删除各种约束.(注意权限)

    +   - ALTER TABLE tablename

    +     [ADD (col 类型 [DEFAULT 值|NULL] [列级约束|表级约束][, colname...])]

