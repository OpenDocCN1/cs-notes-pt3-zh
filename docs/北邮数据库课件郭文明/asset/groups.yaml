    ## 5.2.1 ER模型的概念


    实体 (entity) 就是具有公共性质的可区别的现实世界对象的集合。例如CAP数据库中的客户、代理商、产品都为实体，分别表示不同对象的集合。数学表述中通常用一个大写字母代表一个实体，一个实体E由一个现实世界对象的集合构成，使用小写字母加下标表示这些对象：

    E={e₁, e₂, …, eₙ}。


    属性 (attribute) 是描述实体或者联系的性质的数据项。在实体的定义中说，属于一个实体的所有实体实例具有共同性质，这些性质就是属性。在一个实体中，能够唯一标识实体的实例的属性或属性集合称为实体标识符（主键）。属性域是属性的可能取值范围，也称为属性的值域。


    ### 属性的分类

    - 基本属性和复合属性

    - 单值属性和多值属性

    - 导出属性和空值属性


    ### 基本属性和复合属性


    基本属性是不可再分割的属性，复合属性是可再分解为其他属性的属性。例如性别、年龄为基本属性；地址属性为复合属性，因为地址可以分解为邮编、省(市)、县(区)、街道等子属性。


    ### 单值属性和多值属性


    单值属性指的是同一实体的属性只能取一个值，多值属性指同一实体的某些属性可能取多个值。例如年龄属性只能取一个值，是单值属性；学位是多值属性，可以取学士、硕士、博士多个值，爱好也是多值属性。


    ### 导出属性和空值属性


    通过具有相互依赖的属性推导而产生的属性称为导出属性，例如年龄可以由出生年份导出；当实体的实例在某个属性上没有值时应使用空值(Null)，Null还可用于值未知，可以使用Null的属性称为空值属性。


    ### 联系 (relationship)


    给定m个实体的有序列表： E₁, E₂, ..., Eₘ (列表中同一个实体可以出现多次)，一个联系R定义了这些实体实例之间的对应规则。联系表示一个或多个实体之间的关联关系，联系是实体之间的一种行为，一般用动词(英语用动名词)来命名联系。


    ### 联系的元数


    一个联系涉及到的实体个数，称为该联系的元数或度数(degree)。同一个实体的实例之间的联系称为一元联系，也称递归联系；两个不同实体的实例之间的联系称为二元联系；三个不同实体实例之间联系称为三元联系；依此类推。


    ### 联系的属性


    联系也可以有附加的属性。经常先不考虑 ER图中联系的属性，集中精力考虑实体的联系。


    ### 联系中实体的基数


    两个有联系R的实体E和F，E中每个实例可能与F中的实例联系，(联系实例数目大于0)，也可能没有与F中的实例联系(联系实例数目等于0)，E中每个实例与F中有联系实例数目的最小值和最大值，称为E的基数。记作mincard(E,
    R)和maxcard(E, R)。同理有mincard(F, R)和maxcard(F, R)。


    例如学生实体E和课程实体F有选修联系R，每位学生至少选1门课，最多选10门课；每门课程最多有100人选，最少可以没人选。则有：


    mincard(E, R)=1, maxcard(E, R)=10。

    mincard(F, R)=0, maxcard(F, R)=100。


    一个实体E参与联系R，并且 mincard(E, R)=x, maxcard(E, R)=y，那么在ER图中，E和R之间的连接线可以用标记： card(E,
    R)=(x, y)表示实体的基数。


    ### 联系的方式


    联系涉及到实体之间实例的对应方式，二元联系的联系方式有四种：1:1, 1:N, M:N, M:1。由于M:1是1:N的反面，通常不单独提及。


    如果实体E和F在联系R中有maxcard(E, R)=1, maxcard(F, R)=1，那么E和F联系是1:1的。


    如果实体E和F在联系R中有maxcard(E, R)=N, maxcard(F, R)=1，那么E和F联系是1:N的。


    如果实体E和F在联系R中有maxcard(E, R)=M, maxcard(F, R)=N，那么E和F联系是M:N的。


    当一个联系R中的实体E具有 mincard(E, R)=1 时，E称为强制参与R（mandatory participation），或简单称E在R中是强制的。一个实体F在R中不是强制的，则称为可选的（optional
    participation）。


    类似地，可以给出一元联系、三元联系的一对一、一对多、多对多定义。特别注意多元联系的多对多联系方式。


    ### 属性的基数


    仿照联系中实体的基数概念，有实体中属性的基数，给定一个实体E和隶属于它的属性A，

    - 当mincard(A, E)=0时，表示属性A是可选的；

    - 当mincard(A, E)=1时，表示属性A是强制的；

    - 当maxcard(A, E)=1时，表示属性A是单值的；

    - 当maxcard(A, E)=N时，表示属性A是多值的。


    一个属性A参与实体E，并且mincard(A, E)=x，maxcard(A, E)=y，那么在ER图中，A和E之间的连接线可以用标记：card(A, E)=(x,
    y)表示属性的基数。


    ### 弱实体


    如果实体的所有实例都通过一个联系 R 依赖于另一个实体的实例而存在，而且该实体标识码的部分或全部从其依赖的实体（父实体）中获得，那末这个实体就称为弱实体，而另一个实体称为强实体。


    例如人事系统中，社会关系实体是以职工实体存在为前提，社会关系实体是弱实体。


    ### 泛化层次


    泛化层次（generalization hierarchy）也称泛化联系（generalization relationship），是对对应于对象关系模型继承特性一个概念。其思想是多个有公共属性的实体可以泛化为一个更高层次的超类型实体，相反一个一般化实体可以分解成低层次的子类型实体。


    泛化层次：例：


    学生和教师都是人，学生实体和教师实体泛化出超类实体人。子类一个重要性质是继承性：子类继承其超类上定义的所有属性，其本身还可以包含其他另外的属性。子类型实体和超类型实体之间的联系经常称为ISA联系。


    关系模型没有为泛化层次概念提供支持，关系模型中有两种方法支持泛化：可以保留超类型实体和所有子类型实体并创建显式联系来表示这个ISA联系；也可以把子类型实体的属性加入到超类型实体中并加入一个附加属性来区别这些不同的子类型。


    ## 5.2.2 ER图的绘制


    前面介绍的ER模型中的概念可以采用以下图例表示：


