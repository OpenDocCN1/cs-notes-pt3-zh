    # 3.1.3 通讯区


    +   - SQLCODE：SQLCODE是SQLCA的结构一个成员。它是一个每次执行完SQL语句都被更新的整型变量。  - 如果执行成功，SQLCODE为0；  -
    如果语句没有产生错误，但遇到了没有数据，SQLCODE为100；  - 除去成功返回0或没有数据返回100的情况，其他都是某种错误并返回一个负数。


    +   - SQL-99和X/OpenSQL等标准提倡用SQLSTATE取代SQLCODE检测SQL的执行情况，并将SQLSTATE设置为标准，但在产品中还不一定支持。例如ORACLE中，预处理程序运行时必须设置MODE=ANSI才能支持SQLSTATE。'
  - '[PAGE 236]


    # 3.1.3 通讯区


    +   - SQLSTATE：SQLSTATE作用与SQLCODE作用相同，但在标准方式下起作用。SQLCODE是一个整数，SQLSTATE是一个长度为5的只能由A到Z字符和0到9数字组成的字符串。5个字符分为两组，前两个为类码，后三个为子类码。SQL标准规定：分类码的第一个字符可为A到H或0到4，这样分类主要为了统一，第一个字符为I到Z或5到9的分类码留给软件开发者去定义。


    分类码00指成功,01指成功但产生一个警告,02指没有数据,等价于SQLCODE的100,非00、01和02指语句没有成功完成。可以查阅数据库系统产品的嵌入式SQL参考指南得到SQLSTATE、SQLCODE、SQLCA，确定主要的出错条件，以它们的报告方式。'
