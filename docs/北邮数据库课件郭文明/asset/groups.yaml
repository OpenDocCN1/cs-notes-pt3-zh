    # 1.2 关系代数


    +   - 关系模型的重要部分是关系操纵，关系代数是一种抽象的查询语言，是关系数据操纵语言的一种传统表达方式，它是用对关系的运算来表达查询的。利用关系代数可以演示一个查询语言从关系数据库系统中检索信息的潜力，可以用最简单的形式来表达所有关系数据库查询语言必须完成的运算的集合，这些基本的运算对解释标准查询语言SQL如何被执行很有帮助，同时也有利于培养关系运算的思维能力。'
  - '[PAGE 42]


    # 1.2 关系代数


    +   - 关系代数的运算对象是关系，运算结果亦为关系。关系代数用到的运算符包括四类；集合运算符、专门的关系运算符、算术比较符和逻辑运算符。关系代数的运算按运算符的不同可分为传统的集合运算和专门的关系运算两类。其中传统的集合运算将关系看成元组的集合，其运算是从关系的“水平”方向即行的角度来进行。而专门的关系运算不仅涉及行而且涉及列。比较运算符和逻辑运算符是用来辅助专门的关系运算符进行操作的。'
