  - '[PAGE 606]


    # 5.3.2 函数依赖


    +   - 例：工资管理模式2中，因为{工号, 扣款项目}+={工号, 姓名, 级别, 基本, 津贴, 扣款项目, 扣款金额}，所以它的候选键是：{工号,
    扣款项目}。


    证明：按照Armstrong公理，

    工号⊂{工号, 扣款项目} ⇒ {工号, 扣款项目}→工号，

    又：工号→姓名 ⇒ {工号, 扣款项目}→姓名 ①

    同理有：

    {工号, 扣款项目}→级别 ②

    级别→基本 ⇒ {工号, 扣款项目}→基本 ③

    级别→津贴 ⇒ {工号, 扣款项目}→津贴 ④

    {工号, 扣款项目}→扣款项目 ⑤

    {工号, 扣款项目}→扣款金额 ⑥

    综合① ② ③ ④ ⑤ ⑥有以上结论。证毕'
