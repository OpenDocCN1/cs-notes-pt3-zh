    |---|---|---|---|---|

    |  |  |  | 关系 | 姓名 |

    | 0001 | 张家口 | 职员 | 妻子 | 李小玖 |

    |  |  |  | 儿子 | 张冠李 |

    | 0002 | 柴米油 | 经理 | 妻子 | 陆续琴 |

    | 0003 | 郝成功 | 职员 | 妻子 | 朱那亚 |

    |  |  |  | 儿子 | 郝乃军 |

    |  |  |  | 女儿 | 郝佳欣 |


    ![](img/ffd1e1f008d7fcbd0b52f1e6bcb7a952_127_1.png)


    ## 1.4.2.1 ORACLE中对象类型


    - 一个对象类型有多个类型属性, ORACLE中对象类型由Create type语句创建。


    ```

    例: create type namesex_t as object

    (name char(8),sex char(2));/

    create table employees (eid char(4),

    ename namesex_t,job char(6));

    insert into employees value(''0001'',

    namesex_t(''赵子龙'',''男''),''经理'');

    select e.eid,e.ename.name,e.ename.sex

    from employees e

    where e.job=''业务员'';

    ```


    SQL*plus中创建对象必须有/

    typename(属性值)称为对象构造函数

    前面‘表名.’不能省略


    ## 1.4.2.1 ORACLE中对象类型


    - 创建对象的一般格式：

    - **CREATE TYPE typename AS OBJECT**

    - （属性名 类型 [,属性名 类型...]）;

    - 可以是其他用户已经定义的类型,由此形成对象的嵌套和依赖

    - (informix中用create row type rowname(),行类型)


    - 若ORACLE中表的行包含对象类型,则称为对象表(informix中称类型表).采用如下形式定义表：

    - **CREATE TABLE tablename OF typename**

    - [( [属性名 NOT NULL][,属性名 NOT NULL...]

    - [,PRIMARY KEY (属性名[,属性名...])])];

    - typename 对象中属性即成为表中属性


    - **DROP TYPE typename [FORCE];**

    - **DROP TABLE tablename;**


    ## 1.4.2.1 ORACLE中对象类型


    - 例: create type employee_t as object (eid char(4),ename namesex_t,job char(6));

    - create table employees of employee_t (primary key(eid));

    - 对象表(包含行对象employee_t和列对象ename)


    | 无名顶层列 | employees |  |  |

    |---|---|---|---|

    | 顶层属性 | eid | ename | Job |

    | ename属性 |  | ename. name | ename.sex |  |

    | 行1 | 0001 | 赵子龙 | 男 | 经理 |

    | 行2 | 0002 | 张翌德 | 男 | 职员 |

    | 行3 | 0003 | 孟可飞 | 女 | 职员 |


