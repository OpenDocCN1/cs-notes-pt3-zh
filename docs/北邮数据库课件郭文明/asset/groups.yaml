    # 1. 4. 3. 1 对象联系


    +   - 关系模型中基本的数据结构层次是关系-元组-属性, 属性类型是基本类型。

    +   - 嵌套关系模型是平面关系模型的扩展, 允许关系的属性又是一个关系。

    +   - 嵌套关系模型进一步扩展, 出现复合对象模型。关系中的属性可以是基本类型, 也可以是结构类型或集合类型。


