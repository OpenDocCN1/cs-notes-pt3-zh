    # 6.1 树的结构及基本操作


    树是一类重要的非线性数据结构，是以分支关系定义的层次结构。


    # [树的定义]


    树是由 n(n≥0) 个结点组成的有限集合 T，非空树满足：


    +   1) 有一个称之为根(root)的结点。


    +   2) 除根以外的其余结点被分成 m(0≤m<n) 个互不相交的集合 T₁，T₂，…，Tₘ，其中每一个集合本身又是一棵树，且称为根的子树。'
  - '[PAGE 234]


    # [树的特征]


    ![](img/808bb2589300c03793be19c880a932f9_234_0.png)


    特点 除根节点外，每个节点都仅有一个前趋(父)节点。


    ![](img/808bb2589300c03793be19c880a932f9_234_1.png)'
  - '[PAGE 235]


    # [基本术语]


    节点的度 节点拥有的子树数目。


    叶子(终端)结点 度为0的结点。


    分支(非终端)结点 度不为0的结点。


    树的度 树的各结点度的最大值。


    内部结点 除根结点之外的分支结点。


    双亲与孩子(父与子)结点 结点的子树的根称为该结点的孩子；该结点称为孩子的双亲。


    兄弟 属于同一双亲的孩子。


    结点的祖先 从根到该结点所经分支上的所有结点。


    结点的子孙 该结点为根的子树中的任一结点。'
  - '[PAGE 236]


    # 节点的层次


    表示该节点在树中的相对位置。根为第一层，其它的节点依次下推；若某节点在第L层上，则其孩子在第L+1层上。


    # 堂兄弟


    双亲在同一层的节点互为堂兄弟。


    # 树的深(高)度


    树中节点的最大层次。


    # 有序树


    树中各节点的子树从左至右是有次序的，不能互换。否则，称为无序树。


    # 路径长度


    从树中某节点Nᵢ出发，能够“自上而下地”通过树中节点到达节点Nⱼ，则称Nᵢ到Nⱼ存在一条路径，路径长度等于这两个节点之间的分支数。


    # 树的路径长度


    从根到每个节点的路径长度之和。


    # 森林


    是m(m≥0)棵互不相交的树的集合。'
  - '[PAGE 237]


    # [树的 basic 操作]


    +   1) 初始化操作  initiate(T)

    +   2) 求根函数  root(T) / root(x)

    +   3) 求双亲函数  parent(T,x)

    +   4) 求孩子结点函数  child(T,x,i)

    +   5) 求右兄弟函数  right_sibling(T,x)

    +   6) 建树函数  crt_tree(x,F)

    +   7) 插入子树操作  ins_child(y,i,x)

    +   8) 删除子树操作  del_child(x,i)

    +   9) 遍历操作  traverse(T)

    +   10) 清除结构操作  clear(T)'
  - '[PAGE 238]


    # 6.2 二叉树的定义与性质


    # [二叉树的概念]


    **二叉树的定义**　

    二叉树是 n(n≥0) 个结点的有限集合，它或者为空树(n=0)，或由一个**根结点**和两棵互不相交的**左子树**和**右子树**的二叉树组成。


    # 二叉树的特点


    +   - 定义是递归的

    +   - 0≤结点的度≤2

    +   - 是有序树


