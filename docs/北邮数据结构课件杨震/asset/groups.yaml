    Phi_M}{M}\n\\]\n\n而 \\((\\Phi_0-\\Phi_M)/M\\) 较小，或为负。\n\n因此：\n\n\\[\nA(n)=O(\\\
    beta)\n\\]\n\n即：\n\n\\[\n\\text{分摊复杂度}=\\text{操作实际代价}+\\text{势函数变化}\n\\]\n\n以\
    \ [例4] 为例：\n\n将区间 \\([0,n)\\) 中每个数视为一个状态，其势函数为\n\n\\[\n\\Phi_i=pop(i)=(i\\text{\
    \ 的二进制表示中 1 的个数})\n\\]\n\n而\n\n\\[\n\\Phi_{i+1}=\\Phi_i-od(i)+1\n\\]\n\n从而有\n\n\
    \\[\nA(n)=\\frac{\\sum_{i=0}^{n-1}od(i)}{n}=1+\\frac{\\Phi_0-\\Phi_n}{n}=1-\\\
    frac{pop(n)}{n}\n\\]\n\n由于 \\(pop(n)/n\\) 是无穷小量，因此：\n\n\\[\nA(n)=\\Theta(1)\n\\\
    ]\n\n### 捐款记账法\n\n按照操作代价进行捐款，用总捐款额来度量操作的代价总和。\n\n假设操作 \\(O_i\\) 的代价为 \\(C_i\\\
    )，所捐款额为 \\(D_i\\)，要求 \\(C_i\\le D_i\\)，使得：\n\n\\[\n\\sum_{i=1}^{M}C_i\\le\\sum_{i=1}^{M}D_i\n\
    \\]\n\n现实中的两种做法：\n\n- 捐款额大于代价，但设置上界；\n- 将操作分类，对不同类型操作捐不同的货币。\n\n### 分摊复杂度约定\n\n\
    若操作次数 \\(M\\) 与问题规模 \\(n\\) 有关，则约定：\n\n\\[\nM=\\Omega(n)\n\\]\n\n即：\n\n存在常数 \\\
    (c\\ (c>0)\\)，使得 \\(M\\ge cn\\)。\n\n若操作次数 \\(M\\) 与问题规模 \\(n\\) 无关，则分摊复杂度与时间复杂度等同。\n\
    \n## 1.7 算法分析技术——空间复杂度\n\n### 算法的存储空间\n\n- 输入数据所占空间\n- 程序本身所占空间\n- 辅助变量所占空间\n\n\
    ### 空间复杂度\n\n\\[\nS(n)=O(f(n))\\quad\\text{或}\\quad S(n)=\\Theta(f(n))\n\\]\n\n\
    表示随着问题规模 \\(n\\) 的增大，算法运行所需存储量的增长率与 \\(f(n)\\) 的增长率相同。\n\n### 原地算法\n\n当某个算法空间复杂度为\
    \ \\(O(1)\\) 时，称该算法为原地算法。\n\n### 存储密度\n\n\\[\nd=\\frac{\\text{数据本身存储量}}{\\text{实际所占存储量}}\n\
    \\]\n\n## 本章作业\n\n- 1. 设 n 是偶数，试计算运行下列程序段后 m 的值，并给出该程序段的时间复杂度。\n\n```c\nm = 0;\n\
    for (i = 1; i <= n; i++)\n    for (j = 2 * i; j <= n; j++)\n        m = m + 1;\n\
    ```\n\n- 2. 下列算法对一 n 位二进制数加 1，假如无溢出，该算法在最坏情况下时间复杂度是什么？并分析它的平均时间复杂度。\n\n```c\n\
    void func(int A[n]) // A[n]中每个元素取值0或1\n{\n    int i = n;\n    while (A[i] == 1)\n\
    \    {\n        A[i] = 0;\n        i--;\n    }\n    A[i] = 1;\n}\n```\n\n- 3.\
    \ 调用下列函数 f(n)，回答下列问题：\n  （1）试给出 f(n) 值的大小，并写出 f(n) 值的推导过程；\n  （2）假定 n=5，试指出 f(5)\
    \ 值的大小和执行 f(5) 时的输出结果。\n\n```c\nint f(int n)\n{\n    int i, j, k, sum = 0;\n \
    \   for (i = 1; i < n + 1; i++)\n    {\n        for (j = n; j > i - 1; j--)\n\
    \            for (k = 1; k < j + 1; k++)\n                sum++;\n        printf(\"\
    sum=%d\\n\", sum);\n    }\n    return (sum);\n}\n```\n"
