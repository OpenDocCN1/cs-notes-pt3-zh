  - "[PAGE 576]\n\n# [最佳归并树的构造]\n\n最佳归并树即义（阶）哈夫曼树。\n\n设初始归并段为m个，进行k-路归并\n\n+   1)\
    \ 若 $(m-1)\\bmod(k-1)\\ne0$\n+   \n+      则需附加 $(k-1)-(m-1)\\bmod(k-1)$ 个长度为0的虚段，以使每次归并都可以对应k个段\n\
    +   \n+   2) 按照哈夫曼树的构造原则（权值越小的结点离根结点越远）构造最佳归并树。\n\n思考：为什么？如何求得的？"
  - '[PAGE 577]


    # 虚段的补法的证明


    解：在 k 路平衡归并时，它的归并树的模型是一棵度为 k 的树。在这棵树上的结点要么是叶子，要么是具有 k 个孩子的内部结点。设具有 k 个孩子的内部结点共有
    n_k 个


    。初始归并段的个数为 m 个。


    设 n = n_k + m，故：


    从结点出发的枝条，共计有：k × n_k 根


    若从进入结点结点的角度进行考虑，则共有：n_k + m − 1


    注意：没有枝条进入根结点。


    所以，k × n_k = n_k + m − 1


    于是：n_k = (m − 1) / (k - 1)


    这就意味着，若 (m − 1) MOD (k - 1) = 0，无需增加虚段。否则，要增加虚段，其


    数目为：（k−1）− (m − 1) MOD (k - 1)。'
