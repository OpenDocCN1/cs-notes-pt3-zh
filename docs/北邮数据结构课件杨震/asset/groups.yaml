    # 定义1：无穷大的阶 O


    若存在正常数 c，使得当 n 充分大（即存在 n₀，使得当 n > n₀ 时），有：


    t(n) ≤ c f(n)


    则，称 t(n) 趋于无穷大的阶 ≤ f(n) 趋于无穷大的阶，记为：


    t(n) = O(f(n))'
