    v′属于V-U。删去边(u′，v′)，得到另一棵生成树T′；因为边(u, v)的代价小于边（u′，v′）的代价，所以新的生成树T′将是代价最小的树。和原假设矛盾。


    注：新的生成树T′是树的理由：连通且无回路。'
