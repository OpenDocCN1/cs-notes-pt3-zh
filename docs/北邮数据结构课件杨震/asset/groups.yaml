    # 2. 最小生成树


    # 【概述】


    +   - 由一个网络（带权图）生成的各边的权数总和最小的生成树称为**最小生成树**，记为MST。


    +   - **MST性质：**设N=(V,{E})是一个连通的带权图，U是V的真子集，若边(u,v)[u∈U，v∈V-U]是E中所有一个端点在U内、一个端点不在U内的边中权值最小的一条边(轻边)，则一定存在G的一棵生成树包括此边。


