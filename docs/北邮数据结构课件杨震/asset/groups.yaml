    \ 层开始进行删除。\n\n+   A、不动：若删除关键字后，该结点的关键字个数仍处于 ⌈m/2⌉-1 和 m-1 之间，则结束。\n+   B、借：若被删除关键字所在结点的关键字个数原为\
    \ ⌈m/2⌉-1，而其左右兄弟结点的关键字个数 > ⌈m/2⌉-1；则借一个关键字过来，结束。\n+   C、并：若该结点的左右兄弟结点的关键字个数均为\
    \ ⌈m/2⌉-1；则执行合并结点的操作。\n\n如结点原为：\n\n( ............ (Kᵢ, Aᵢ), (Kᵢ₊₁, Aᵢ₊₁), ............\
    \ )\n( A₀', (K₁, A₁') ........ )\n( A₀'', (K₁'', A₁'') ........ )\n........ K₁\
    \ ........ → 第 L 层：找到了被删结点的替身。\n\n## 例如：3 阶 B_树的删除操作。\n\n![](img/808bb2589300c03793be19c880a932f9_468_0.png)\n\
    \n借：向被删结点方向旋转\n\n被删关键字\n\n![](img/808bb2589300c03793be19c880a932f9_468_1.png)\n\
    \n假定再删除该关键字\n\n![](img/808bb2589300c03793be19c880a932f9_468_2.png)\n\n并\n\n假定再删除该关键字\n\
    \n![](img/808bb2589300c03793be19c880a932f9_468_3.png)\n\n并\n\n![](img/808bb2589300c03793be19c880a932f9_468_4.png)\n\
    \n并\n\n> 注：和父结点的一个关键字合并。有可能进行到根，使 B_树的深度降低一层！\n\n## [B+树]\n\nB+树是一种 B-树的变形树。应用于索引顺序文件系统。\n\
    \n## 1. m 阶 B+树与 B-树的不同之处\n\n+   1) 有 n 棵子树的结点中有 n 个关键字；\n+   2) 非叶结点可以看成是索引部分\
    \ 索引集\n      Aᵢ：第 i 个子结点的指针\n      Kᵢ：第 i 个子结点的最大（或最小）关键字\n+   3) 所有叶子结点中包含了全部关键字的信息及指向这些关键字记录的指针，且叶子结点以关键字大小自小至大顺序链接；数据集\n\
    \n## [结点结构]\n\n+   - 非叶结点（A₁, K₁, …, Aᵢ, Kᵢ, …, Aₙ, Kₙ）索引集\n+     Aᵢ：第 i 个子结点的指针\n\
    +     Kᵢ：第 i 个子结点的最大（或最小）关键字\n+   - 叶结点\n+     全部关键字及指向关键字记录的指针 数据集\n\n![](img/808bb2589300c03793be19c880a932f9_470_0.png)\n\
    \n## 2. B+树上的基本运算\n\n## 1) 查找\n\n+   - 方式1：从根结点开始，利用索引集结构，向下查找直到叶子结点\n+   - 方式2：从最小关键字开始，沿叶结点数据集的链结构顺序查找\n\
    \n## 2) 插入\n\n仅在叶子结点上进行，关键字个数大于 m 则分裂\n\n## 3) 删除\n\n也仅在叶子结点上进行，关键字个数小于「m/2」时，需进行合并\n\
    \n## 8.8 哈希表\n\n## [哈希表的基本思想]\n\n在记录的存储地址和它的关键字之间建立一个确定的对应关系；这样，理想状态不经过比较，一次存取就能得到所查元素。\n\
    \n## [术语]\n\n哈希表 一个有限的连续的地址空间，用以容纳按哈希地址存储的记录。\n\n哈希函数 记录的存储位置与它的关键字之间存在的一种对应关系。Loc(rᵢ)=H(keyᵢ)\n\
    \n冲突 对于 keyᵢ≠keyⱼ，i≠j，出现的 H(keyᵢ)=H(keyⱼ) 的现象。\n\n同义词 在同一地址出现冲突的各关键字。\n\n哈希（散列）地址\
    \ 根据设定的哈希函数 H(key) 和处理冲突的方法确定的记录的存储位置。\n\n装填因子 表中填入的记录数 n 和哈希表表长 m 之比。\nα=n/m\n\
    \n## [设计哈希表的过程]\n\n+   1) 明确哈希表的地址空间范围。即确定哈希函数的值域。\n+   2) 选择合理的哈希函数。该函数要保证所有可能的记录的哈希地址均在指定的值域内，并使冲突的可能性尽量小。\n\
    +   3) 设定处理冲突的方法。\n\n![](img/808bb2589300c03793be19c880a932f9_473_0.png)\n\n##\
    \ [3. 平方取中法]\n\n取关键字平方后的中间几位作为哈希地址。\n\n例如：(4731)² = 223 82 361；选取 82（假设 m = 100）。\n\
    \n## [4. 随机数法]\n\nH(key) = random(key)\n\n特点：较适于关键字长度不等时的情况。\n\n## [5. 折叠法]\n\n\
    将关键字分割成位数相同的几部分（最后一部分的位数可以不同），然后取这几部分的叠加和（舍去进位）作为哈希地址。\n\n例如：key = 381, 412, 975\n\
    \n选取 768 或 570 作为散列地址（假设 m = 1000）。\n\n## [6. 除留余数法]\n\nH(key) = key MOD p   \
    \ (p≤m)\n\nm：哈希表的表长；    p：最好为素数\n\n最常用，余数总在 0 ～ p-1 之间。通常 p 选 < m 的最大质数\n\n如：m\
    \ = 1024，则 p = 1019。\n\n例如：选取 p 为质数的理由：\n\n设 key 值都为奇数，选 p 为偶数；\n\n则 H(key) =\
    \ key MOD p，结果为奇数，一半单元被浪费掉。\n\n设 key 值都为 5 的倍数，选 p 为 95；\n\n则 H(key) = key MOD\
    \ p，结果为：0、5、10、15、……\n\n90 奇数。4/5 的单元被浪费掉。\n\n## [处理冲突的常用方法]\n\n## [1. 开放定址法（空缺编址法）]\n\
    \n```\nHᵢ = ( H(key)+dᵢ ) MOD m\n```\n\ni=1,2, ..., k (k≤m-1)\n\nm：哈希表的表长； dᵢ：增量序列\n\
    \n![](img/808bb2589300c03793be19c880a932f9_477_0.png)\n\n## 1) 线性探测再散列\n\ndᵢ =\
    \ 1,2, ..., m-1\n\n缺陷：有聚集（堆积）现象——非同义词地址冲突。\n\n例如：假定采用的哈希函数为：H(key) = key MOD 11，假定的关键字序列为：17、60、29、38......；它们的散列过程为：\n\
    \nH(17) = 6\nH(60) = 5\nH(29) = 7\nH(38) = 5\n\n冲突：\n初级冲突：不同关键字值的结点得到同一个散列地址。\n\
    二次聚集：不同散列地址的结点争夺同一个单元。\n结果：冲突加剧，最坏时可能达到 O(n) 级代价。\n\n当散列 38 时发生冲突，\n同 60 争夺第 5\
    \ 个单元\n解决办法：探测下一个\n空单元\nH_i = ( H(key)+d_i ) MOD 11\n\n思考：假定有 k 个关键字互为同义词，若用线性探测再散列法把这\
    \ k 个关键字存入散列表中，至少要进行多少次探测？\nk(k+1)/2\n\n哈希表\n0\n1\n2\n3\n4\n5 60 38\n6 17\n7 29\n\
    8 38\n9\n10\n\n## 2) 二次探测再散列\n\ndᵢ = 1², -1², 2², -2², 3², ..., ±k²\n\nk ≤ m/2\n\
    \n缺陷：不易探查到整个散列空间。\n\n## 3) 伪随机探测再散列\n\ndᵢ = 伪随机数序列\n\n## 4) 双重散列函数探查法\n\ndᵢ =\
    \ i*h1(key)      0 < i ≤ m - 1\n\n要求：h1(key) 的值与 m 互素。\n\nm 为素数时，h1(key) 可取 1\
    \ 到 m-1 之间的任何数，\n\n建议：\n\nh1(key)=key mod (m-2) +1\n\nm 为 2 的方幂时，h1(key) 可取 1\
    \ 到 m-1 之间的任何奇数\n\n注意：开放定址法不宜执行删除操作\n\n## [2. 再哈希法]\n\nHᵢ = RHᵢ(key)        i=1,2,\
    \ ..., k\n\n出现冲突时，采用多个哈希函数计算散列地址，直到找到空单元为止。\n\n如：H₁(key) = key MOD 11\n\nH₂(key)\
    \ = (key+ MOD 9) + 1\n\nH₃(key) = ........\n\n....................\n\nH₁₀(key)\
    \ = .........\n\n## [4. 建立公共溢出区]\n\n将发生冲突的结点都存放在一个公共溢出区内。通常用于组织存在于外存设备上的数据文件。哈希表（基本区）只存放一个记录。发生冲突的记录都存放在公共溢出区内。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_482_0.png)\n"
