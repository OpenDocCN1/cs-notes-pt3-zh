    ## 8.7 B+树与B-树


    ### [采用B+与B-树的意义]

    大量数据存放在外存中，由于是海量数据，不可能一次调入内存。因此，要多次访问外存，速度慢。所以，主要矛盾变为减少访外次数。


    ![](img/808bb2589300c03793be19c880a932f9_457_0.png)


    内存


    用二叉树组织文件，需访问外存次数太多。

    如：当文件的记录个数为 100, 000时，要找到给定关键字的记录，需访问外存17次（log100,000）,太长了！


    ![](img/808bb2589300c03793be19c880a932f9_458_0.png)


    文件访问示意图：索引文件存在内存、数据文件存在盘上


    文件头，可常驻内存


    索引文件


    数据文件


    ### [B-树]

    B-树是一种平衡的多路查找树。应用于文件系统。


    #### 1. 定义

    一棵 $m$ 阶B树，或为空树，或为满足下列特性的 $m$ 叉树：


    - 1. 树中每个结点最多有 $m$ 棵子树；

    - 2. 若根结点不是叶子结点，则最少有两棵子树；

    - 3. 除根之外的所有非终端结点至少有 $\lceil m/2 \rceil$ 棵子树；

    - 4. 所有非终端结点包含（$n,A_0,K_1,A_1,K_2,\ldots,K_n,A_n$）信息数据；其中 $n$ 为结点中关键字个数，$A_i$
    为指向子树的指针，$K_i$ 为关键字。

    - 5. 所有叶子结点在同一层上，且不带信息。


    #### 2. B-树节点结构

    (n, A₀, K₁, A₁, K₂, A₂, ..., Kₙ, Aₙ)


    - n: 关键字的个数

    - A₀: <K₁ 的节点的地址（指在该 B- 树中）

    - K₁: 关键字

    - A₂: > K₁ 且 < K₂ 的节点的地址（指在该 B- 树中）

    - 其余类推 ........

    - Aₙ: > Kₙ 的节点的地址（指在该 B- 树中）

    - K₁ <=K₂ <= ...... <= Kₙ


    127阶B-树中每个结点最多有126个关键字；除根结点外所有非终端结点至少有64棵子树；65阶B+树中除根结点外所有结点至少有33个关键字；最多有65棵子树。


    高度为5（除叶子层之外）的三阶B-树至少有31个结点。


    思考：高度为h的m阶B-树（除叶子层）至少有多少个结点？


    #### 3.B-树查找过程

    类似于二叉树的查找。如查找关键字为 KEY 的记录。


    - 从根开始查找，如果 Kᵢ = KEY 则查找成功。

    - 若 Kᵢ < KEY < Kᵢ₊₁; 查找 Aᵢ 指向的结点

    - 若 KEY < K₁; 查找 A₀ 指向的结点

    - 若 KEY > Kₙ; 查找 Aₙ指向的结点

    - 若 找到叶子，则查找失败。


    设关键字的总数为 N，求 m 阶 B- 树的 最大层次 L。


    | 层次 | 节点数 | 关键字的个数（最少） |

    |---|---|---|

    | 1 | 1 | 1 |

    | 2 | 2 | 2(⌈m/2 -1⌉) |

    | 3 | 2(⌈m/2⌉) | 2(⌈m/2⌉)(⌈m/2 -1⌉) |

    | 4 | 2(⌈m/2⌉)² | 2(⌈m/2⌉)²(⌈m/2 -1⌉) |

    | ... | ... | ... |

    | L | 2(⌈m/2⌉)^{L-2} | 2(⌈m/2⌉)^{L-2}(⌈m/2 -1⌉) |

    | L+1 | 2(⌈m/2⌉)^{L-1} |  |


    所以，N = 2(⌈m/2⌉)^{L-1} - 1


    故：L = log_{⌈m/2⌉}((N+1)/2) + 1


    设 N =1000, 000 且 m=256 ，

    则 L <= 3; 最多 3 次访问外存可找到所有的记录。


    #### 4.B-树插入过程

    - 1、确定插入位置，将结点插入到第 L 层（注意：第 L+1 层为叶子结点）

    - 2、找到插入位置，将关键字和其它信息按序插入。

    - 3、若被插入结点的关键字个数 >m-1，则该结点满。必须分裂成两个结点。否则不满结束。


    如结点原为：


    (m-1, A₀, K₁, A₁, K₂, A₂, ... Kₘ₋₁, Aₘ₋₁)


    插入一个关键字之后变为：(m, A₀, K₁, A₁, K₂, A₂, ... Kₘ, Aₘ)


    该结点以K⌈m/2⌉为界，进行分裂：


    …………(K⌈m/2⌉, p'')……………


    (K⌈m/2⌉ , p'') 数据项插入上层结点之中


    P → (⌈m/2-1⌉,A₀,(K₁,A₁)…(K⌈m/2-1⌉,A⌈m/2-1⌉)) (m-⌈m/2⌉,A⌈m/2⌉,K⌈m/2⌉+1 … Kₘ,Aₘ)


    生成新结点 p''，将原结点的后半部分复制过去。若分裂一直进行到根结点，树可能长高一层。

