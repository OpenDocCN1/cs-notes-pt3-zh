    # 7.4 图的连通性


    # 1 无向图的连通分量和生成树


    # [连通图的生成树]


    +   - 生成树是图G的一个子图，该子图是包含G的所有顶点的树(或者是自由树—未确定根结点)。

    +   - 若图G有n个顶点，则其生成树必具有n-1条边。

    +   - 生成树是包含图中所有顶点的极小连通子图。

    +   - 生成树可以通过对图的深度/广度优先遍历而得到，称之为深度/广度优先生成树。


    在算法中，访问一个结点时v_j，同时记录它的父结点v_i，(v_i , v_j)是生成树的一条边。'
