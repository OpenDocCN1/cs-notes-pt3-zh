    # [VSAM文件上的操作]


    1) 查找


    +   - 方法1：随机查找。

    +   - 方法2：顺序查找。


    # 2) 插入


    分为三种情况：


    +   - 所插入的控制区间未满

    +     将待插记录插入合适的位置

    +   - 所插入的控制区间已满，但其所在的控制区域有空闲控制区间

    +     分裂该控制区间，将近乎一半的记录移到全空的控制区间，并修改顺序集中的相应索引

    +   - 所插入的控制区域已满

    +     分裂控制区域，一般控制区域较大，此情况很少'
  - '[PAGE 621]


    在一个控制区间内，被删记录之后的记录前移。若该控制区间变空，回收为空间，并删除顺序集中的相应索引


    # 【和ISAM文件相比的优点】


    +   - 能保持较高的查找效率

    +   - 动态地分配和释放空间

    +   - 不必随记录的变动对文件进行再组织'
