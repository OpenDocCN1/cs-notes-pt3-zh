    对于两个数x和y，经一次比较可得到最大值和最小值；对于三个数x,y,z，最多经3次比较可得最大值和最小值；对于n(n>3)个数，将分成长为n-2和2的前后两部分A和B，分别找出最大者和最小者：MaxA、MinA、MaxB、MinB，最后Max={MaxA,MaxB}和Min={MinA,MinB}。对A使用同样的方法求出最大值和最小值，直到元素个数不超过3。设C(n)是所需的最多比较次数，根据上述原则，当n>3时有如下关系式：
    C(n)=C(n-2)+3


    通过逐步递推，可以得到：C(n)=⌈3n/2⌉-2。显然，当n>=3时，2n-3>3n/2-2。事实上，⌈3n/2⌉-2是解决这一问题的比较次数的下限。'
