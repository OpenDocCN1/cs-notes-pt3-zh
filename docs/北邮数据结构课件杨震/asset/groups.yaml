  md: "\n## 堆结构存储的特点：\n\n- 通过串名存储映射访问串值\n- 动态分配存储空间，对串长没有限制\n- 要使可利用空间的使用更加有效，回收废弃的旧串和申请新串空间需进行动态存储管理。\n\
    \n## 4.3 串的模式匹配\n\n[定义] 在主串中寻找子串（第一个字符）在主串中的位置\n在模式匹配中，子串称为模式串，主串称为目标串。\n记模式串为：\
