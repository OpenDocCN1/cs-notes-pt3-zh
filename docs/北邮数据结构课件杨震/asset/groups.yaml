    # [堆排序基本思想]


    将初始文件R[1..n]建成一个小根堆(大根堆);


    第1趟： 将关键字最小(最大)的记录(堆顶)R[1]与无序区的最后一个记录R[n]交换； 再将新的无序区R[1..n-1]调整为堆；


    第2趟： 将R[1]与R[n-1]交换； 再将新的无序区R[1..n-2]调整为堆；


    ......

    第i趟： 将R[1]与R[n-i+1]交换；

    再将新的无序区

    R[1..n-i]调整为堆；

    ......直到执行完第(n-1)趟为止。


