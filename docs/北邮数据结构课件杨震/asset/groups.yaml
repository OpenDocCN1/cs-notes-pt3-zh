  - '[PAGE 587]


    # 第11章 动态存储管理'
  - '[PAGE 588]


    # 11.1 概述


    # [动态存储管理]


    指系统随机地根据用户程序申请空间的大小，进行分配空间和回收不用空间所进行的内存管理。


    # [动态存储管理的一种方法]


    建立可利用空间表(自由空间表/存储池)，将所有可利用的空闲内存块链接起来。


    ![](img/808bb2589300c03793be19c880a932f9_588_0.png)'
  - '[PAGE 589]


    # 二种基本分配策略


    +   - **首次拟合法**：分配找到的第一个不小于 n 的空闲块的 一部分。**操作方便，查找快捷**

    +   - **最佳拟合法**：分配不小于 n 且最接近 n 的空闲块的一部分。**尽可能将大的空闲块留给大程序使用**

    +   - **最差拟合法**：分配不小于 n 且是最大的空闲块的一部分。**尽可能减少分配后无用碎片**'
  - '[PAGE 590]


    # 11.2.1 可利用空间表的结点结构


    header

    (块头)


    llink


    tag


    size


    rlink


    space


    uplink


    tag


    footer

    (块尾)


    size


    标志位：

    tag= 1 占用块

    0 空闲块


    块尾的作用：

    简化回收算法'
