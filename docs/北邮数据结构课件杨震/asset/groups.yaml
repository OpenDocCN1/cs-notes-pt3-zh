  - "[PAGE 527]\n\n# [算法描述]\n\n```\nvoid heapsort (SqList &r) {\n    for (i = n /\
    \ 2; i>=1;i--) sift ( r , i , n );\n    for (i = n; i>=2)\n    {   r[1] <-> r[i];\
    \    sift ( r , 1 , i - 1 ); }\n}\nvoid sift (SqList & r ; int k , m) {\n    i\
    \ = k;    j = 2 * i;    x = r[k].key;    finished = false;    t = r[k];\n    While\
    \ ((j <= m ) && !finished)\n    {   If ((j < m) && ( r[j].key > r[j + 1].key ))\
    \ j++;\n        If (x <= r[j].key) finished = TRUE;\n        else\n        { \
    \  r[i]=r[j];    i = j;    j = 2 * i; }\n    }\n    r[i] = t;\n}\n```"
  - '[PAGE 528]


    # [算法分析]

    时间性能分析


    # 总时间=建堆的时间耗费 + 堆调整(排序)的时间耗费


    建堆的时间耗费：设树根处于第 1 层，该堆共有 h=⌊log₂n⌋+1 层。建堆从第 h-1 层开始进行。只要知道了每一层的结点数（建的小堆的个数），和每建一个小堆所需的比较次数，就可以求得建堆的时间耗费。


    建的小堆的性质：第 i 层上小堆的个数 = 第 i 层上结点的个数 = 最多 2^{i-1}


    第 i 层上小堆的高度 = h-i+1


    建第 i 层上每个小堆最多所需的比较次数 = 2×(h-i)'
  - '[PAGE 529]


    # 建堆的时间耗费：


    S(n) <= Σ_{i=h-1}^{1} 2^{i-1} × (h - i) = Σ_{j=1}^{h-1} 2^{h-j} × j


    将 h = ⌊log₂n⌋ + 1 代入有


    则建堆的时间复杂度为 <= 4n = O(n)


    # 堆调整的时间耗费：


    | 节点个数 | 高度 | 比较次数最多 |

    |---|---|---|

    | j=2 | log2 + 1 | <= 2 × log2 |

    | j=3 | log3 + 1 | <= 2 × log3 |

    | ... | ... | ... |

    | j=n | logn + 1 | <= 2 × logn |


    所以： T(n) <= 2( log2 + log3 + ...... + logn ) = 2log(n!)


    T(n) = O ( nlogn )'
  - '[PAGE 530]


    # 最坏情况 O(nlog₂n)


    +   - 建初始堆时，比较次数≤4n

    +   - 反复调整堆时，比较次数<nlog2n


    # 空间复杂度


    +   - 辅助空间： O(1)


    # 稳定性


    +   - 不稳定排序


    # 思考：若有N个元素已构成一个小根堆，那么如果增加一个元素为Kₙ₊₁，如何在log₂n 的时间内将其重新调整为堆？


    K₁到Kₙ是堆，在Kₙ₊₁加入后，将K₁..Kₙ₊₁调成堆。

    设c=n+1,f=⌊c/2⌋,若K_f<=K_c，则调整完成。

    否则，K_f与K_c交换；之后，c=f,f=⌊c/2⌋,

    继续比较，直到K_f<=K_c，或f=0，即为根结点，调整结束'
