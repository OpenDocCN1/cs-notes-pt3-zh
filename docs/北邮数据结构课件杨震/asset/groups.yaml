    \n## [结论]\n\n由Th6.8知：如果一棵树有n个结点，则一次find操作的时间最多为O(logn)。\n\n执行u−1次merge操作和f次find操作组成的混合序列的分摊复杂度是O(u\
    \ + f log u)，因为每棵树的结点数不超过u。\n\n初始化n棵树的森林需要O(n)时间。\n\n## 折叠查找的实现\n\n```\nint Sets::CollapsingFind\
    \ (int i) { // 找含元素的树的根,\n    for (int r = i; parent[r] >= 0; r = parent[r]);\
    \ // 找到根\n    while ( i != r ) {\n        int s = parent[i];\n        parent[i]\
    \ = r;\n        i = s; }\n    return r;\n}\n```\n\n## [WeightedMerge和CollapsingFind的复杂度分析]\n\
    \n假设开始时森林是由一组只含单个结点的树构成的，且u≥n/2，并令T(f, u)为执行u次WeightedMerge操作和f次CollapsingFind操作组成的混合序列的最长时间，那么对于正常数k1和k2，有\n\
    \nk1(n + f α(f + n, n)) ≤ T(f, u) ≤ k2(n + f α(f + n, n))\n\nα(p, q)函数增长非常缓慢，其定义为：\n\
    \nα(p, q) = min{z≥1 | A(z, ⌊p/q⌋) > log₂q}, p≥q≥1\n\n其中，Ackerman函数A(i, j)定义为：\n\
    \n+   A(1, j) = 2j 当j≥1\n+   A(i, 1) = A(i − 1, 2) 当i≥2\n+   A(i, j) = A(i − 1,\
    \ A(i, j − 1)) 当i, j≥2\n\n对于任何实际可行的p和q，α(p, q)≤4。\n\nA(i, j) 增长非常迅速，例如，\n\nA(1,\
    \ 2) = 2²\nA(3, 1) = A(2, 2) = A(1, A(2, 1)) = A(1, A(1, 2)) = 2^{A(1, 2)}\n \
    \   = 2^{2²} = 16\nA(4, 1) = A(3, 2) = A(2, A(3, 1)) = A(2, 16)\n    = A(1, A(2,\
    \ 15)) = 2^{A(2, 15)}\n    = 2^{2^{A(2, 14)}} = ... = 2^{2^{2^{...²}}} } 16 个\n\
    \nA(3, 1) = 16，当 q < 2^16 且 p≥q，α(p, q)≤3。而A(4, 1)是一个非常大的数，且在本应用中，q是集合元素个数n，p是n\
    \ + f（f是find操作的次数），因此，对于任何实际可行的p和 q，α(p, q)≤4。\n\n虽然函数α(f, u)增长非常缓慢，但求解并查集问题的时间复杂度仍然不是并和查操作次数的线性函数。\n\
