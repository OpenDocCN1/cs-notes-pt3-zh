    也仅在叶子结点上进行，关键字个数小于「m/2」时，需进行合并'
  - '[PAGE 472]


    # 8.8 哈希表


    # [哈希表的基本思想]


    在记录的存储地址和它的关键字之间建立一个确定的对应关系；这样，理想状态不经过比较，一次存取就能得到所查元素。


    # [术语]


    哈希表 一个有限的连续的地址空间，用以容纳按哈希地址存储的记录。


    哈希函数 记录的存储位置与它的关键字之间存在的一种对应关系。 Loc(rᵢ)=H(keyᵢ)


    冲突 对于keyᵢ≠keyⱼ， i≠j，出现的H(keyᵢ)=H(keyⱼ)的现象。'
  - '[PAGE 473]


    同义词 在同一地址出现冲突的各关键字。


    哈希(散列)地址 根据设定的哈希函数H(key)和处理冲突的方法确定的记录的存储位置。


    装填因子 表中填入的记录数n和哈希表表长 m之比。

    α=n/m


    # [设计哈希表的过程]


    +   1) 明确哈希表的地址空间范围。即确定哈希函数的值域。


    +   2) 选择合理的哈希函数。该函数要保证所有可能的记录的哈希地址均在指定的值域内，并使冲突的可能性尽量小。


    +   3) 设定处理冲突的方法。


    ![](img/808bb2589300c03793be19c880a932f9_473_0.png)'
  - '[PAGE 474]


    <!-- no content -->'
  - '[PAGE 475]


    # [3. 平方取中法]


    取关键字平方后的中间几位作为哈希地址。


    e.g: (4731)² = 223 82 361；选取 82（假设 m = 100）。


    # [4. 随机数法]


    H(key) = random(key)


    特点：较适于关键字长度不等时的情况。


    # [5. 折叠法]


    将关键字分割成位数相同的几部分(最后一部分的位数可以不同)，然后取这几部分的叠加和(舍去进位)作为哈希地址。


    e.g: key = 381, 412, 975


    选取 768 或 570 作为散列地址（假设 m =1000）。'
  - '[PAGE 476]


    # [6. 除留余数法]


    H(key) = key MOD p    (p≤m)


    m: 哈希表的表长；    p: 最好为素数


    最常用，余数总在 0 ～ p-1 之间。通常 p 选 < m 的最大质数


    如： m = 1024, 则 p = 1019。


    e.g: 选取 p 为质数的理由：


    设 key 值都为奇数，选 p 为偶数；


    则 H(key) = key MOD p ，结果为奇数，一半单元被浪费掉。


    设 key 值都为 5 的倍数，选 p 为 95；


    则 H(key) = key MOD p ，结果为：0、5、10、15、……


    90 奇数。4/5 的单元被浪费掉。'
  - '[PAGE 477]


    # [处理冲突的常用方法]


    # [1. 开放定址法 (空缺编址法)]


    ```

    Hᵢ = ( H(key)+dᵢ ) MOD m

    ```


    i=1,2, ..., k (k≤m-1)


    m:哈希表的表长； dᵢ:增量序列


    ![](img/808bb2589300c03793be19c880a932f9_477_0.png)


    # 1)线性探测再散列


    dᵢ= 1,2, ..., m-1


    缺陷： 有聚集(堆积)现象—非同义词地址冲突。'
  - '[PAGE 478]


    e.g: 假定采用的 hashing 函数为： H(key) = key MOD 11 假定的关键字序列为： 17、60、29、38 ......； 它们的散列过程为：


    H(17) = 6

    H(60) = 5

    H(29) = 7

    H(38) = 5


    冲突：

    初级冲突： 不同关键字值的结点得到同一个散列地址。

    二次聚集： 同不同散列地址的结点争夺同一个单元。

    结果：冲突加剧，最坏时可能达到 O(n)级代价。


    当散列 38 时发生冲突，

    同 60 争夺第 5 个单元

    解决办法：探测下一个

    空单元

    H_i = ( H(key)+d_i ) MOD 11


    思考： 假定有k个关键字互为同义词，若用线性探测再散列法把这k个关键字存入散列表中，至少要进行多少次探测？

    k(k+1)/2


    Hashing 表

    0

    1

    2

    3

    4

    5 60 38

    6 17

    7 29

    8 38

    9

    10'
  - '[PAGE 479]


    # 2)二次探测再散列


    dᵢ = 1², -1², 2², -2², 3², ..., ±k²


    k ≤ m/2


    缺陷：不易探查到整个散列空间。


    # 3)伪随机探测再散列


    dᵢ = 伪随机数序列


    # 4) 双重散列函数探查法


    dᵢ = i*h1(key)      0 < i ≤ m - 1


    要求：h1(key)的值与m互素。


    m为素数时，h1(key)可取1到m-1之间的任何数，


    建议：


    h1(key)=key mod (m-2) +1


    m为2的方幂时，h1(key)可取1到m-1之间的任何奇数


    注意：开放定址法不宜执行删除操作'
  - '[PAGE 480]


    # [2. 再哈希法]


    Hᵢ = RHᵢ(key)        i=1,2, ..., k


