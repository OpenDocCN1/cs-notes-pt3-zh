    # 分摊复杂度分析方法：


    +   - 累计法

    +   - 势函数法

    +   - 捐款记账法'
  - '[PAGE 57]


    # [累计法]


    将M个运算的时间代价相加再求平均。


    以[例4]为例：


    假设n=2^q.


    +   在区间[0,n)，有2^{q-1}个偶数，其奇度为0；

    +   在区间[0,n)，有2^{q-2}个为***01，其奇度为1；

    +   在区间[0,n)，有2^{q-k}个为***01...1，其奇度为k-1(k=1,...,q)

    +   k=2^{q-1}时，其奇度为q


    ```

    S(n) = Σ_{k=0}^{n-1} od(k) = Σ_{k=1}^{q} (k - 1)2^{q-k} + q = n - 1

    ```'
  - '[PAGE 58]


    当$n$为一般形式时，假设$2^q \le n < 2^{q+1}$，则：


    $n/2-1 \le 2^q-1 = S(2^q)$

    $\le S(n)$

    $S(n) \le S(2^{q+1}) = 2^{q+1}-1 < 2n-1$


    即：

    $n/2-1 \le S(n) < 2n-1 \longrightarrow S(n)=\Theta(n)$

    计算一个$od(i)$的分摊复杂度为：

    $A(n)= S(n)/n = \Theta(1)$'
  - '[PAGE 59]


    # [势函数法]


    将操作O看出是将事物从一个状态变成另一状态： S_{i-1} O S_i


    M个操作和M+1个状态可看成是一个序列：


    S_0 O_1 S_1 O_2 …… O_M S_M


    对每个状态S_i，定义值Φ_i，称其为状态S_i的势函数，称ΔΦ_i为势函数增量：


    ΔΦ_i = Φ_i − Φ_{i-1}


    ΔΦ_i是由操作引起的势函数的变化。


    对势函数要求：


    C_i + ΔΦ_i ≤ β


    其中，β与运算的次数i无关，C_i为操作O_i的代价。'
  - '[PAGE 60]


    此时有：


    $$A(n)=\frac{\sum_{i=1}^{M} C_i}{M}\leq \beta+\frac{\Phi_0-\Phi_M}{M}$$


    而，$(\Phi_0-\Phi_M)/M$较小，或为负。


    因此：


    $$A(n)=O(\beta)$$


    即：


    分摊复杂度=操作实际代价+势函数变化'
  - '[PAGE 61]


    以[例4]为例

    将区间[0,n)中每个数视为一个状态，其势函数为：

    Φ₀ = pop(i) = (i的二进制表示中1的个数)

    而：

    Φ₀ = Φ₀ − od(i) + 1

    从而有

    A(n) = (∑_{i=0}^{n−1} od(i))/n = 1 + (Φ₀ − Φₙ)/n = 1 − pop(n)/n

    由于pop(n)/n是无穷小量，因此：

    A(n) = Θ(n)'
  - '[PAGE 62]


    # [捐款记账法]


    按照操作代价进行捐款，用总捐款额度量操作的代价总和。


    假设操作 O_i 的代价为 C_i，所捐款额为 D_i，要求 C_i ≤ D_i，使得：


    ∑_{i=1}^M C_i ≤ ∑_{i=1}^M D_i


    现实中的两种做法：


    +   - 捐款额大于代价，但设置上届；

    +   - 将操作分类，对不同类型操作捐不同的货币；'
