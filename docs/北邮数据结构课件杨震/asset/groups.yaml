    ## 逆邻接表：边表采用入边表


    ![](img/808bb2589300c03793be19c880a932f9_334_0.png)


    ## [两种常用存储结构的比较]


    |  | 邻接矩阵 |  | 邻接表 |  |

    |---|---|---|---|---|

    |  | 无向图 | 有向图 | 无向图 | 有向图 |

    | 空间 | 顶点表结点 n n |  | 顶点表结点 n n |  |

    |  | 邻接矩阵 n²/2 n² |  | 边表结点 2e e |  |

    |  | 适合稠密图 |  | 适合稀疏图 |  |

    |  | 求顶点的度 | 扫描矩阵行/列 O(n) | 扫描某个边表 最坏 O(n) | 求出度同无向图; 求入度 (n+e) |

    | 时间 | 判定边是否存在 | O(1) | 扫描某个边表 最坏 O(n) |  |

    |  | 求边的数目 | 检测矩阵 O(n²) | 检测每个边表 O(n+2e) |  |


