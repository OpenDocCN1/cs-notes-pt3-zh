    \ (38) (65) (97) (76) (49) (13)\n\n<第1趟> (38 49) (65 97) (49 76) (13)\n\n<第2趟>\
    \ (38 49 65 97) (13 49 76)\n\n<第3趟> (13 38 49 49 65 76 97)\n\n## [性能分析]\n\n- ◆\
    \ 任何情况时间复杂度 O(nlog₂n)\n- ◆ 空间复杂度 O(n)\n- ◆ 很少用于内部排序\n\n## 【算法描述】\n\n```\nvoid\
    \ mergesort ( SqList &r) {\n    len = 1;\n    While (len < n)\n    {\n       \
    \ s1 = 1;    q = 1;\n        While (s1 + len <= n)\n        {\n            s2\
    \ = s1 + len;    t1 = s2 - 1;\n            t2 = s2 + len - 1;\n            if\
    \ (t2 > n) t2 = n;\n            merge (r, t, s1, t1, s2, t2, q);\n           \
    \ s1 = q;\n        }\n        for (i = 1; i <= q - 1) r[i] = t[i];\n        len\
    \ = len*2;\n    }\n}\n```\n\n![](img/808bb2589300c03793be19c880a932f9_533_0.png)\n\
    \n```\nvoid merge (SqList r, &t ; int s1, t1, s2, t2, int &q) {\n    while ((s1\
    \ <= t1) && (s2 <= t2))\n    {\n        If (r[s1] <= r [s2])\n        { t[q] =\
    \ r[s1]; s1 = s1 + 1; }\n        else\n        { t[q] = r[s2]; s2 = s2 + 1; }\n\
    \        q = q + 1;\n    }\n    while (s1 <= t1)\n    { t[q] = r[s1]; s1 = s1\
    \ + 1; q = q + 1; }\n    while (s2 <= t2)\n    { t[q] = r[s2]; s2 = s2 + 1; q\
    \ = q + 1 }\n}\n```\n\n![](img/808bb2589300c03793be19c880a932f9_534_0.png)\n"
