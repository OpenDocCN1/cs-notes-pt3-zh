    ## 森林与二叉树的转换


    ### 树转换为二叉树


    - 1) 在兄弟间加一连线

    - 2) 对每一结点，去掉它与孩子的连线(最左子除外)

    - 3) 以根为轴心将整棵树顺时针转45⁰


