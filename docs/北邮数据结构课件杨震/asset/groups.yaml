    # 代价(cost): 任一运算只要能在固定时间内完成，就可视作单位时间来考虑。为区别于时间，称其为代价单位。


    假设执行操作Oᵢ的代价为Cᵢ，则分摊复杂度可记为:


    ```

    A(n) = Σᵢ=1ᴹ C(i) / M

    ```'
  - '[PAGE 55]


    对[例4]而言：


    *od(k)*的准确运算时间 *T*：


    *T*=循环执行次数*执行一次S1的时间+δ

    =od(k)*执行一次S1的时间+δ


    执行一次S1的时间是常数，视为代价；故：

    计算*od(k)*的代价=*od(k)*+δ


    计算{od(k) | k=0,1,...,n-1}，其中一个操作的分摊复杂度为：


    $A(n) = \frac{\sum_{i=1}^{M} C(i)}{M} = \frac{\sum_{k=0}^{n-1} od(k)}{n}$'
