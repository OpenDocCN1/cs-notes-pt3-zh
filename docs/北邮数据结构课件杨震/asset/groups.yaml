  md: "\n## 7.4 图的连通性\n\n### 1 无向图的连通分量和生成树\n\n**连通图的生成树**\n\n- 生成树是图 G 的一个子图，该子图是包含\
    \ G 的所有顶点的树（或者是自由树——未确定根结点）。\n- 若图 G 有 n 个顶点，则其生成树必具有 n-1 条边。\n- 生成树是包含图中所有顶点的极小连通子图。\n\
    - 生成树可以通过对图的深度/广度优先遍历而得到，称之为深度/广度优先生成树。\n\n在算法中，访问一个结点 v_j 时，同时记录它的父结点 v_i，(v_i,\
    \ v_j) 是生成树的一条边。\n\n一般情况下，BFS（广度优先搜索）生成树的树高小于 DFS（深度优先搜索）生成树的高度。\n\n一个图的生成树是不唯一的：\n\
    \n- 从不同的顶点出发\n- 采用不同的存储结构和存储顺序\n\n**无向图 G**\n\n![](img/808bb2589300c03793be19c880a932f9_355_0.png)\n\
    \n**无向图 G 的生成树**\n\n![](img/808bb2589300c03793be19c880a932f9_355_1.png)\n\n###\
    \ 2 有向图的强连通分量的求法\n\n- 强连通图：有向图 G 的任意两点之间都是连通的，则称 G 是强连通图。\n- 强连通分量：极大连通子图。\n\n\
    **有向图 G**\n\n![](img/808bb2589300c03793be19c880a932f9_357_0.png)\n\n**有向图 G 的两个强连通分量**\n\
    \n![](img/808bb2589300c03793be19c880a932f9_357_1.png)\n\n**强连通分量的求法**\n\n1. 对有向图\
    \ G 进行深度优先搜索，按回溯次序给结点进行编号。最先出现回溯的结点的编号为 1，其它结点的编号按回溯次序逐次增大 1。\n2. 将有向图 G 的所有有向边进行倒置，构造新的有向图记为\
    \ Gr。\n3. 根据步骤 1 对结点进行的编号，选取最大编号的结点。从该结点出发，在有向图 Gr 上进行深度优先遍历。如果没有访问到所有的结点，则从剩余的那些结点中选取编号最大的结点再进行深度优先遍历。直至所有的结点都被访问到为止。\n\
    4. 在最后得到的生成森林中的每一棵生成树，都是有向图 G 的强连通分量顶点集。\n\n```\n在主程序中置：count = 0\n\nDFS(vertex\
    \ v)\n{\n    1、mark[v] = visited\n    2、for（v 的邻接表中的每一个邻接结点 w）\n    3、{ if（mark[w]\
    \ == unvisited）\n    4、    DFS(w); }\n    5、count++;\n    6、finished[v] = count;\n\
    }\n```\n\n**实例**\n\n![](img/808bb2589300c03793be19c880a932f9_359_0.png)\n\n**第一步**\n\
    \n![](img/808bb2589300c03793be19c880a932f9_359_1.png)\n\n**第二步**\n\n![](img/808bb2589300c03793be19c880a932f9_359_2.png)\n\
    \n**第三步**\n\n![](img/808bb2589300c03793be19c880a932f9_359_3.png)\n\n**第四步**\n\n\
    ![](img/808bb2589300c03793be19c880a932f9_359_4.png)\n\n两棵生成树的结点是有向图 G 的两个强连通分量的顶点集：{A、C、D}\
    \ 及 {B}。\n\n**断言：**有向图 G 中的强连通分量中的顶点和深度优先搜索 Gr 时得到的生成森林中的生成树中的结点精确对应。\n\n**证明要点：**相互直达的\
    \ v、w 肯定在同一生成树之中。不管是 G 还是 Gr，假定在 Gr 中的根为 x。\n\n在 Gr 中，存在着由 x 至 v 的路径，那么在 G 中存在一条由\
    \ v 至 x 的路径。在 G 中，由于 x 序号大，而 v 序号小，所以存在着一条 x 至 v 的路径。x、v 直达。\n\n同理：在 Gr 中，存在着由\
    \ x 至 w 的路径，那么在 G 中存在一条由 w 至 x 的路径。在 G 中，由于 x 序号大，而 w 序号小，所以存在着一条 x 至 w 的路径。x、w\
    \ 直达。\n\n所以，Gr 中的任意两点 v、w 之间，相互可以直达。\n\n![](img/808bb2589300c03793be19c880a932f9_360_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_360_1.png)\n\n编写利用深度优先遍历算法求以邻接表存储的无向图的所有连通分量算法，要求输出每一连通分量的顶点值。\n\
    \n```\nvoid dfs(v)\n{\n    visited[v] = true;\n    printf(\"%3d\", v); // 输出连通分量的顶点。\n\
    \    p = g[v].firstarc; // g[v] 顶点表\n    while (p != null)\n    {\n        if\
    \ (visited[p->adjvex] == false)\n            dfs(p->adjvex);\n        p = p->next;\n\
    \    }\n}\n\nvoid Count() // 求图中连通分量的个数\n{\n    int k = 0;\n    static AdjList\
    \ g; // 设无向图 g 有 n 个结点\n    for (i = 1; i <= n; i++)\n        if (visited[i] ==\
    \ false)\n        {\n            printf(\"\\n第%d个连通分量:\\n\", ++k);\n         \
    \   dfs(i);\n        }\n}\n```\n\n设无向图 G 已用邻接表结构存储，试用“广度优先搜索”方法，写出求图 G 中各连通分量算法。\n\
    \n```\nvoid bfs(AdjList GL, vertype v)\n{\n    visited[v] = true;\n    printf(\"\
    %3d\", v); // 输出第一个遍历的顶点。\n    InitQueue(Q);\n    EnQueue(Q, v); // 先置空队列，然后第一个顶点\
    \ v 入队\n    while (!QueueEmpty(Q))\n    {\n        v = DeQueue(Q);\n        p\
    \ = G[v].firstarc; // g 是全局变量，v 入队列。\n        while (p != null)\n        {\n \
    \           if (visited[p->adjvex] == false)\n            {\n                printf(\"\
    %3d\", p->adjvex);\n                visited[p->adjvex] = true;\n             \
    \   EnQueue(Q, p->adjvex);\n            }\n            p = p->next;\n        }\n\
    \    }\n}\n\nvoid BFSCOM()\n{\n    // 广度优先搜索，求无向图 G 的连通分量。\n    int count = 0;\
    \ // 记录连通分量个数。\n    for (i = 1; i <= n; i++) visited[i] = false;\n    for (i =\
    \ 1; i <= n; i++)\n        if (visited[i] == false)\n        {\n            printf(\"\
    \\n第%d个连通分量:\\n\", ++count);\n            bfs(i);\n        }\n} // BFSCOM\n```\n\
    \n### 2. 最小生成树\n\n**概述**\n\n- 由一个网络（带权图）生成的各边的权值总和最小的生成树称为**最小生成树**，记为 MST。\n\
    - **MST 性质：**设 N=(V,{E}) 是一个连通的带权图，U 是 V 的真子集，若边 (u,v) [u∈U，v∈V-U] 是 E 中所有一个端点在\
    \ U 内、一个端点不在 U 内的边中权值最小的一条边（轻边），则一定存在 G 的一棵生成树包括此边。\n\n![](img/808bb2589300c03793be19c880a932f9_363_0.png)\n\
    \n**证明**\n\n假定存在一棵不包括边 (u,v) 在内的最小代价生成树，设其为 T。将边 (u,v) 添加到树 T，则形成一条包含 (u,v) 的回路。因此，必须存在另一条边\
    \ (u′,v′)，且 u′ 属于 U，v′ 属于 V-U。删去边 (u′,v′)，得到另一棵生成树 T′；因为边 (u,v) 的代价小于边 (u′,v′)\
    \ 的代价，所以新的生成树 T′ 将是代价最小的树。和原假设矛盾。\n\n注：新的生成树 T′ 是树的理由：连通且无回路。\n\n**示例（n=6）**\n\
    \n5 条候选边\n\n4 条候选边\n\n3 条候选边\n\n2 条候选边\n\n1 条候选边\n\n**算法数据结构**\n\n![](img/808bb2589300c03793be19c880a932f9_367_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_367_1.png)\n\n![](img/808bb2589300c03793be19c880a932f9_367_2.png)\n\
    \n带权邻接矩阵 `gn[n][n]`——记录图。\n\n注意：\n- `closedge[0].Lowcost = 0`\n- `closedge[2].Lowcost\
    \ = 0`，表示顶点 1、3 已在 U 中\n- `lowcost` 表示最小距离\n- `adjvex` 表示相应结点\n\n数组：`closedge[6]`\n\
    \n|   | lowcost | adjvex |\n|---|---------|--------|\n| 1 | 0       |        |\n\
    | 2 | 6       | 1      |\n| 3 | 1       | 1      |\n| 4 | 5       | 1      |\n\
    | 5 | ∞       |        |\n| 6 | ∞       |        |\n\n数组：`closedge[6]`\n\n|  \
    \ | lowcost | adjvex |\n|---|---------|--------|\n| 1 | 0       |        |\n|\
    \ 2 | 5       | 3      |\n| 3 | 0       |        |\n| 4 | 5       | 1      |\n\
    | 5 | 6       | 3      |\n| 6 | 4       | 3      |\n"
