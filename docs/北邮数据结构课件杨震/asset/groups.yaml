    \    rnum： 记录所属归并段号\n\n+   - 辅： ls[0.. w-1]——不含外部结点的败者树\n+     存放最后胜出的外部结点编号（ls[0]）以及所记录的败者的外部结点编号\n\
    \n## [置换-选择排序的效果]\n\n+   ◆ 所得初始排序段的长度不等\n+   ◆ 当输入文件记录的关键字大小随机分布时，初始归并段的长度为内存工作区大小w的两倍\
    \ 思考：为什么？\n\n## [缓冲区及并行操作]\n\n使输入、输出和内部归并三种操作同时进行，也能提高总的外部排序时间。但应综合考虑缓冲区数目、工作区大小等参数的设置。\n\
    \n|  |  |\n|---|---|\n| 内存 | k个输入缓冲区 | 1个输出缓冲区 |\n\n## 思考：假设m是所用缓冲区的长度，置换-选择排序法产生文件\
    \ F（长度为 n）的初始归并段的长度至少为多少？最多为多少？\n\n第一个归并段中第一个元素是缓冲区中最小的元素，以后每选一个元素都不应小于前一个选出的元素，故当产生第一个归并段时（即初始归并段），缓冲区中m个元素中除最小元素之外，其他m-1个元素均大于第一个选出的元素，即当以后读入元素均小于输出元素时，初始归并段中也至少能有原有的m个元素。\n\
    \n初始归并段长度最长为n。\n\n平均长度分析：设内存可以存放 m 个记录，则首先从文件读入 m 记录到内存。这 m 个记录肯定可以归入本初始合并段内。这样，再从文件中读入\
    \ m 个记录。这 m 个记录中大约平均有一半可以归入本合并段，一半归入下一合并段。因此，合并段的平均长度大约为：\n\nm + m/2 + m/4 + ............\
    \ = 2m\n\n## [最佳归并树的引入]\n\n进行k路归并时，初始归并段的不同搭配，会导致归并过程中I/O的次数不同。\n\n设有9个初始归并段，记录个数(长度)分别为：\n\
    \n9, 30, 12, 18, 3, 17, 2, 6, 24\n\n![](img/808bb2589300c03793be19c880a932f9_575_0.png)\n\
    \n(9+30+12+18+3+17+2+6+24)×2 +(51+38+32)×2 = 484\n\n[(2+3+6)×3+(9+12+17+18+24)×2+30×1]×2\
    \ = 446\n\n所有叶结点加权外通路长度的2倍\n\n## [最佳归并树的构造]\n\n最佳归并树即义（阶）哈夫曼树。\n\n设初始归并段为m个，进行k-路归并\n\
    \n+   1) 若 $(m-1)\\bmod(k-1)\\ne0$\n+   \n+      则需附加 $(k-1)-(m-1)\\bmod(k-1)$\
    \ 个长度为0的虚段，以使每次归并都可以对应k个段\n+   \n+   2) 按照哈夫曼树的构造原则（权值越小的结点离根结点越远）构造最佳归并树。\n\n\
    思考：为什么？如何求得的？\n\n## 虚段的补法的证明\n\n解：在 k 路平衡归并时，它的归并树的模型是一棵度为 k 的树。在这棵树上的结点要么是叶子，要么是具有\
    \ k 个孩子的内部结点。设具有 k 个孩子的内部结点共有 n_k 个\n\n。初始归并段的个数为 m 个。\n\n设 n = n_k + m，故：\n\n\
    从结点出发的枝条，共计有：k × n_k 根\n\n若从进入结点结点的角度进行考虑，则共有：n_k + m − 1\n\n注意：没有枝条进入根结点。\n\n\
    所以，k × n_k = n_k + m − 1\n\n于是：n_k = (m − 1) / (k - 1)\n\n这就意味着，若 (m − 1) MOD\
    \ (k - 1) = 0，无需增加虚段。否则，要增加虚段，其\n\n数目为：（k−1）− (m − 1) MOD (k - 1)。\n\n## 磁带排序\n\
    \n+   - 只有在顺序存取磁带上的数据时，其效能才能充分发挥\n+   - 本节研究为提高读取信息块的效率，初始归并段在磁带上如何合理分布\n+   -\
    \ 若干初始归并段 一趟归并的结果 果 ... 一条带的情况\n+   - 两种常用的磁带文件排序法\n+     - 多路平衡归并排序\n+      \
    \ 每一趟归并都是文件中的全部记录参加\n+     - 多步归并排序\n+       每一 步归并不一定需要文件中的全部记录都参加\n\n## 多路平衡归并排序\n\
    \n## [方法]\n\n使用2k条磁带进行k路归并。开始时，将待归并的 m个初始归并段均匀的分布在k条磁带上。\n\n## [示例]\n\n设文件的记录数n=4500，\n\
    每个物理块250个记录，\n内存工作区可容纳750个记录(3块)，\n实现k=2路归并使用四台磁带机T1、T2、T3、T4，\n原数据文件在T4上\n\n\
    排序过程：\n\n+   1) 内排序生成4500/750=6个初始归并段，轮流写在T1和T2上\n+   \n+   2) T1和T2上的归并段两路合并，产生的归并段轮流写在T3和T4上\n\
    +   \n+   3) T3和T4合并，轮流写在T1和T2上\n+   \n+   4) 最后合并为一路\n\n![](img/808bb2589300c03793be19c880a932f9_581_0.png)\n\
    \n## 多步归并排序\n\n## [方法]\n\n使用k+1条磁带进行k路归并。巧妙地进行初始分布，使得任何一步开始的时候，总有一条且仅有一条磁带是空着的，可以用它作为本步的输出带。\n\
    \n## [示例]\n\n设有17个初始归并段，进行k=3路归并。\n\n第四步归并\nT1 E\nT2\nT3\nT4\n\n## 方法二：利用 k-阶广义斐波那契序列\n\
    \n当初始归并段的总数为 k-阶广义斐波那契序列中的第 j 项 f_j^(k) 时，在 k 条磁带上分布的归并段的数目应为：\n\n```\n$$\\begin{aligned}\n\
    t_1^{(k)} &= f_{j-1}^{(k)} + f_{j-2}^{(k)} + \\cdots + f_{j-k}^{(k)} \\\\\nt_2^{(k)}\
    \ &= f_{j-1}^{(k)} + f_{j-2}^{(k)} + \\cdots + f_{j-k+1}^{(k)} \\\\\n\\cdots \\\
    \\\nt_{k-1}^{(k)} &= f_{j-1}^{(k)} + f_{j-2}^{(k)} \\\\\nt_k^{(k)} &= f_{j-1}^{(k)}\n\
    \\end{aligned}$$\n```\n\n**注：**若由内部排序得到的初始归并段的总数有不足时，需加“虚段”补充。虚段可以集中在一条带上，也可以分布在多条带上。\n\
    \n```\n$$F_j^{(k)}=1\\quad(0\\leq j\\leq k-1)$$\n\n$$F_j^{(k)}=F_{j-k}^{(k)}+F_{j-k+1}^{(k)}+\\\
    cdots+F_{j-1}^{(k)}\\quad(j\\geq k)$$\n```\n"
