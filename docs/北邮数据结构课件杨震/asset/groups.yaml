    \n[特点] 在n×n的矩阵a中，满足如下性质：\n\naᵢⱼ = aⱼᵢ (1 ≤ i, j ≤ n)\n\n[存储方法] 只存储下(或者上)三角(包括主对角线)的数据元素。共占用n(n+1)/2个元素空间。\n\
