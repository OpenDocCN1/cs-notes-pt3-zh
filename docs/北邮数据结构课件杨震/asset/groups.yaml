  - "[PAGE 500]\n\n# [算法描述]\n\n```\nvoid BInsertSort ( SqList &L )\n{\n    for ( i\
    \ = 2; i <= L.length ; ++i )\n    {\n        L.r[0] = L.r[i]; low = 1 ; high =\
    \ i-1 ;\n        while ( low <= high )\n        {\n            m = ( low + high\
    \ ) / 2 ;\n            if ( L.r[0].key < L.r[m].key ) high = m -1 ;\n        \
    \    else low = m + 1;\n        }\n        for ( j=i-1; j>=high+1; --j )\n   \
    \         L.r[j+1] = L.r[j];\n        L.r[high+1] = L.r[0];\n    }\n}\n```"
  - '[PAGE 501]


    # 改进措施1：2-路插入排序


    算法思想：设置与 r 同样大小的辅助空间 d，将 r[1] 赋值给 d[1]，将 d 看作循环向量。对于 r[i]（2≤i≤n），若 r[i]≥d[1]，则插入
    d[1] 之后的有序序列中，反之则插入 d[1] 之前的有序序列中。（避免 r[1] 关键字最小/最大）


    效果：减少记录的移动次数'
