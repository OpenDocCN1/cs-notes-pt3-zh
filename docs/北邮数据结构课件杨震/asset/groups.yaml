    \n## KMP算法描述\n\n```\nInt KMP-index(char const *t, char const *p, int const *next)\n\
    {\n    int i=1; j=1;\n    int n=strlen(t);m=strlen(p);\n    while((i<=n) && (j<=m))\n\
