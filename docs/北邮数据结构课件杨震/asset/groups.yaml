    ## 第九章 外部排序\n\n杨震　计算机科学与技术学院\n\n### 9.1 基本概念与术语\n\n排序是根据记录关键字的值的递增(递减)的关系将文件记录的次序重新排列。\n\
    \n#### [定义]\n\n设有含n个记录的序列 {R₁, R₂, ..., Rₙ}，对应的关键字序列为 {K₁, K₂, ..., Kₙ}，一个置换 p1,p2,...,pn\
    \ 使记录序列按关键字有序 {Rₚ₁, Rₚ₂, ..., Rₚₙ}，满足 Kₚ₁ ≤ Kₚ₂ ≤ ... ≤ Kₚₙ （正序）或 Kₚ₁ ≥ Kₚ₂ ≥\
    \ ... ≥ Kₚₙ （逆序）。\n\n### 排序的分类\n\n- 1. 根据排序时文件记录的存放位置\n  - 内部排序：排序过程中将全部记录放在内存中处理。\n\
    \  - 外部排序：排序过程中需在内外存之间交换信息。\n- 2. 根据排序前后相同关键字记录的相对次序\n  - 稳定排序：设文件中任意两个记录的关键字值相同，即\
    \ K_i = K_j (i≠j)，若排序之前记录 R_i 领先于记录 R_j，排序后这种关系不变(对所有输入实例而言)。\n  - 不稳定排序：只要有一个实例使排序算法不满足稳定性要求。\n\
    \n### 评价排序算法的主要标准\n\n#### [时间开销]\n\n考察算法的两个基本操作的次数：\n\n- 比较关键字\n- 移动记录\n\n算法时间还与输入实例的初始状态有关时，分情况：\n\
    \n- 最好\n- 最坏\n- 平均\n\n#### [空间开销]\n\n所需的辅助空间\n\n### 约定\n\n顺序方式存储时，结构如下\n\n```c\n\
    #define MAXSIZE 最大记录个数\ntypedef int KeyType;\n\ntypedef struct {\n    KeyType\
    \ key;\n    InfoType otherinfo;\n} RedType;\n\ntypedef struct {\n    RedType r[MAXSIZE\
    \ + 1]; // r[0] 空或作哨兵\n    int length;\n} SqList;\n```\n\n### [算法步骤]\n\n![](img/808bb2589300c03793be19c880a932f9_495_0.png)\n\
    \n循环(n-1)次，初值 i=2，r[0]用作哨兵。\n\n- 1) 把第i个记录取出保存在r[0]中，j=i-1\n- 2) 若r[0] < r[j]，则r[j]后移一位，j=j-1，转2)；否则r[0]放在r[j+1]处，i=i+1，转1)\n\
    \n### [哨兵/监视哨的作用]\n\n简化边界条件的测试，提高算法时间效率。\n\n### [性能分析]\n\n- 最好情况(原始数据按正序即非递减序列)：Cₘᵢₙ=n-1，Mₘᵢₙ=2(n-1)\n\
    - 最坏情况(原始数据按逆序即非递增序列)：Cₘₐₓ=(n+2)(n-1)/2，Mₘₐₓ=(n+4)(n-1)/2\n- 随机情况：Cₐᵥg=(Cₘᵢₙ +\
    \ Cₘₐₓ)/2≈n²/4，Mₐᵥg≈n²/4\n- 时间复杂度O(n²)\n- 辅助空间复杂度O(1)\n\n### 改进措施1：折半插入排序\n\n\
    算法思想：将循环中每一次在有序区 [1,i-1] 上为确定 r[i] 插入位置的顺序查找操作改为折半查找操作。\n\n效果：减少关键字间的比较次数。\n\n\
    ![](img/808bb2589300c03793be19c880a932f9_498_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_499_0.png)\n\
    \nmid=⌊(low+high)/2⌋\n\n插入位置\n\n### [算法描述]\n\n```c\nvoid BInsertSort ( SqList\
    \ &L )\n{\n    for ( i = 2; i <= L.length ; ++i )\n    {\n        L.r[0] = L.r[i];\
    \ low = 1 ; high = i-1 ;\n        while ( low <= high )\n        {\n         \
    \   m = ( low + high ) / 2 ;\n            if ( L.r[0].key < L.r[m].key ) high\
    \ = m -1 ;\n            else low = m + 1;\n        }\n        for ( j=i-1; j>=high+1;\
    \ --j )\n            L.r[j+1] = L.r[j];\n        L.r[high+1] = L.r[0];\n    }\n\
    }\n```\n\n### 改进措施1：2-路插入排序\n\n算法思想：设置与 r 同样大小的辅助空间 d，将 r[1] 赋值给 d[1]，将 d 看作循环向量。对于\
    \ r[i]（2≤i≤n），若 r[i]≥d[1]，则插入 d[1] 之后的有序序列中，反之则插入 d[1] 之前的有序序列中。（避免 r[1] 关键字最小/最大）\n\
    \n效果：减少记录的移动次数\n\n### 希尔排序\n\n#### [算法思想的出发点]\n\n- 直接插入排序在待排序列的关键字基本有序时，效率较高\n\
    - 在待排序的记录个数较少时，效率较高\n\n#### [算法思想]\n\n先选定一个记录下标的增量d，将整个记录序列按增量d从第一个记录开始划分为若干组，对每组使用直接插入排序的方法；然后减小增量d，不断重复上述过程，如此下去，直到d=1(此时整个序列是一组)。\n\
    \n#### [示例]\n\n<初态>\nd₁=5\n46 82 52 40 67 31 40 73 53 76\n31\n40\n46\n82\n52\n\
    73\n40\n53\n67\n76\n\n<第一趟结果>\nd₂=3\n31 40 52 40 67 46 82 73 53 76\n31\n40\n76\n\
    82\n40\n67\n73\n46\n52\n53\n\n<第二趟结果>\nd₃=1\n31 40 46 40 67 52 76 73 53 82\n31\
    \ 40 40 46 52 53 67 73 76 82\n\n不稳定排序\n\n程序实现：类似于直接插入排序的程序。\n注意修改步长。\n"
