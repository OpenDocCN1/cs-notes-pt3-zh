    # 2.1 无前趋的顶点优先算法


    # [算法原理]


    在一个拓扑序列中，每个顶点必定出现在它的所有前趋顶点之后。


    # [算法思想]


    +   1. 选择一个入度为0的顶点(无前趋的顶点)，输出它

    +   2. 删除该顶点及其关联的所有出边


    重复上述两步，直至图中不再有入度为0的顶点为止。


    若所有顶点均被输出，则排序成功，否则图中存在有向环。


    若该有向图不是无环图，则不存在拓扑排序。可以来判断一个有向图是否存在回路。'
