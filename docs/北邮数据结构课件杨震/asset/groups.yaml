    ![](img/808bb2589300c03793be19c880a932f9_495_0.png)


    循环(n-1)次，初值 i=2， r[0]用作哨兵。


    +   1) 把第i个记录取出保存在r[0]中， j=i-1

    +   2) 若r[0]< r[j]，则r[j]后移一位， j=j-1，转2);

