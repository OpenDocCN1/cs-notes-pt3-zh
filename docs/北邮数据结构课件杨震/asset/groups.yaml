    # [B-树]


    B-树是一种平衡的多路查找树。应用于文件系统。


    # 1. 定义


    一棵 $m$ 阶B树，或为空树，或为满足下列特性的 $m$ 叉树：


    +   1. 树中每个结点最多有 $m$ 棵子树；

    +   2. 若根结点不是叶子结点，则最少有两棵子树；

    +   3. 除根之外的所有非终端结点至少有 $\lceil m/2 \rceil$ 棵子树；

    +   4. 所有非终端结点包含（$n,A_0,K_1,A_1,K_2,\ldots,K_n,A_n$）信息数据；其中 $n$ 为结点中关键字个数，$A_i$
    为指向子树的指针，$K_i$ 为关键字。

    +   5. 所有叶子结点在同一层上，且不带信息。'
