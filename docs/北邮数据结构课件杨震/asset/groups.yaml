    \ ) ;\n// 对各顶点求入度，建立入度为零的栈 S,\nInitstack ( T ) ; count = 0;\nve [ 1 .. G.vexnum\
    \ ] = 0;\nwhile ( ! StackEmpty ( S ) )\n{  Pop ( S, j ) ;Push ( T, j ) ; ++count;\n\
    \    for ( p=G.vertices[j]. firstarc; p; p=p->nextarc ) ;\n    {  k = p->adjnexr;\n\
    \        if ( ! ( -- indegree [ k ] ) ) Push ( S, k ) ;\n        if ( ve[ j ]\
    \ + * ( p->info ) > ve[ k ] )\n            ve[ k ] = ve[ j ] + * ( p->info ) ;}\n\
    \    }\nif ( count < G.vexnum ) return ERROR;\nelse return OK;\n} // 栈 T 为求事件的最迟发生时间的时候用。\n\
    ```\n\n## 实例\n\n![](img/808bb2589300c03793be19c880a932f9_397_0.png)\n\nVI(1)=0\
    \  \nVI(2)=3  \nVI(3)=4  \nVI(4)=5  \nVI(5)=6  \nVI(6)=8\n\n利用逆向拓扑排序算法求事件结点的最迟发生时间的执行步骤：\n\
    \n- 1. 设每个结点的最迟发生时间为汇点的最早发生时间。\n- 2. 将栈中的结点 V 取出。\n- 3. 根据逆邻接表找到结点 V 的所有的起始结点，将结点\
