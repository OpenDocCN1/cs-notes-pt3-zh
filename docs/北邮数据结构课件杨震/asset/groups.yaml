    \    int n=strlen(t); m=strlen(p);\n    while ((i<=n) && (j<=m))\n    {\n    \
    \    if (t[i]==p[j])\n        {\n            i=i+1;\n            j=j+1;\n    \
    \    }\n        else\n        {\n            i=i-j+2;\n            j=1;\n    \
    \    }\n    }\n    if (j==m+1)\n        return (i-m);\n    else\n        return(0);\n\
    }\n```\n\n> 最坏情况字符比较次数为：(n-m+1)*m\n> \n> 算法复杂度：O(m*n)\n> \n> 原因在于每趟重新比较时，目标串的检测指针要回退。改进的模式匹配算法可使目标串的检测指针每趟不回退。\n\
    \n## 4.4 KMP算法\n\n### 改进之处\n\n在比较过程中，主串的下标i只增不减，不回溯，可使算法复杂度提高到O(m+n)。\n\n### 分析\n\
