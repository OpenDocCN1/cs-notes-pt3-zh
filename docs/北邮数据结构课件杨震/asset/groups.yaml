    ```\nk = {\n  (i-1)×(2n-i+2)/2+j+1   i≤j\n  n(n+1)/2+1              i>j\n}\n```\n\
    \n```\nk = {\n  i×(i-1)/2+j            i≥j\n  n(n+1)/2+1              i<j\n}\n\
    ```\n\n### 5.3.3 带状矩阵（对角矩阵）\n\n[特点] 在n×n的方阵中，非零元素集中在主对角线及其两侧共L(奇数)条对角线的带状区域内 —\
