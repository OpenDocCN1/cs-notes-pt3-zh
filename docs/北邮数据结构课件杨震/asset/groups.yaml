    思考：一个有n个结点的有向图，最少有（1）个强连通分量，最多有（n）个强连通分量。


    ## 生成树


    包含图中全部顶点的极小连通子图。


    ![](img/808bb2589300c03793be19c880a932f9_325_0.png)


    ![](img/808bb2589300c03793be19c880a932f9_325_1.png)


    包含图的所有 n 个结点，但只含图的 n-1 条边。在生成树中添加一条边之后，必定会形成回路或环。


