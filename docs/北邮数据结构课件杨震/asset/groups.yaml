    \n## 判定树（描述查找过程的二叉树）\n\n![](img/808bb2589300c03793be19c880a932f9_425_0.png)\n\n\
    成功查找时的平均查找长度（等概率）：\n\n$$ASL_s=\\frac{1}{n}\\sum_{j=1}^{h}j\\cdot2^{j-1}=\\frac{n+1}{n}\\\
    log_2(n+1)-1\\approx\\log_2(n+1)-1$$\n\n例：$ASL_s=(1*1+2*2+3*4+4*4)/11=3$\n\n不成功查找时的查找长度：h-1或h次\n\
    \n+   1. 具有12个关键字的有序表，在等概率情况下，折半查找的平均查找长度（A）\n+      - A. 3.1\n+      - B. 4\n\
    +      - C. 2.5\n+      - D. 5\n+   2. 折半查找的时间复杂度为（D）\n+      - A. O（n²）\n+  \
    \    - B. O（n）\n+      - C. O（nlogn）\n+      - D. O（logn）\n+   3. 用二分（对半）查找表的元素的速度比用顺序法（D）\n\
    +      - A. 必然快\n+      - B. 必然慢\n+      - C. 相等\n+      - D. 不能确定\n4. 在顺序表（8,11,15,19,25,26,30,33,42,48,50）中，用二分（折半）法查找关键码值20，需做的关键字比较次数为4。\n\
    \n在有序表A[1..12]中，采用二分查找算法查找等于A[12]的元素，所比较的元素下标依次为6,9,11,12。\n\n## 8.4 静态树表的查找\n\
    \n## [问题出发点]\n\n讨论有序表中各记录查找概率不等于时，查找成功时的ASLₛ。\n\n|  | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|\n\
    | 关键字 | 15 | 19 | 36 | 42 | 67 |\n| 查找概率 | 0.1 | 0.2 | 0.1 | 0.4 | 0.2 |\n\n##\
    \ 折半查找\n\nASLₛ=2.3\n\n## 高概率为根 +折半\n\nASLₛ=1.8\n\n## 静态最优查找树\n\n**定义：** 查找性能最佳的判定树。\n\
    \n**性质：** 带权内路径长度之和 PH 为最小值。\n\n$$PH=\\sum_{i=1}^{n} w_i h_i$$，与 $ASL_s$ 成正比\n\
    \n其中 n：二叉树上结点的个数（有序表长度）\n\n$h_i$：第 $i$ 个结点在二叉树上的层次数\n\n$w_i=cp_i$：$c$ 为某个常量；\n\
    \n$p_i$：第 $i$ 个结点的查找概率\n\n## 最优查找树体现的原则：\n\n+   1. 最先访问的结点应是访问概率最大的结点；\n+   2.\
    \ 每次访问应使结点两边尚未访问的结点的被访问概率之和尽可能相等。\n\n"
