  md: "\n# 二叉树的五种基本形态\n\n![](img/808bb2589300c03793be19c880a932f9_239_0.png)\n\n##\
    \ 两种特殊的二叉树\n\n### 满二叉树\n\n每一层上的结点数都是最大结点数。\n\n### 完全二叉树\n\n只有最下面两层结点的度可小于2，而最下一层的叶结点集中在左边若干位置上。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_239_1.png)\n\n![](img/808bb2589300c03793be19c880a932f9_239_2.png)\n\
    \n## 二叉树的性质\n\n性质1 二叉树的第i层上至多有2^{i-1}(i≥1)个结点。\n\n性质2 深度为k的二叉树至多有2^{k}-1个结点(k≥1)。\n\
    \n性质3 对任何一棵二叉树T，如果其终端结点数为n₀，度为2的结点数为n₂，则n₀ = n₂ + 1。\n\n性质4 具有n个结点的完全二叉树的深度为⌊log₂n⌋+1。\n\
    \n性质5 一棵具有n个结点的完全二叉树(又称顺序二叉树)，对其结点按层从上至下(每层从左至右)进行1至n的编号，则对任一结点i(1≤i≤n)有：\n\n\
    - (1)若i>1，则i的双亲是⌊i/2⌋；若i=1，则i是根，无双亲。\n- (2)若2i≤n，则i的左孩子是2i；否则，i无左孩子。\n- (3)若2i+1≤n，则i的右孩子是2i+1；否则，i无右孩子。\n\
    \n## 6.3 二叉树的存储结构\n\n### 顺序存储结构\n\n[完全二叉树：按完全二叉树编号存放]\n\n| A | B | C |  | D |\
    \  | E |\n| 1 | 2 | 3 |  | 6 |  | 13 |\n\n[三元组：存储节点数据和左、右孩子在向量中的序号]\n\n| 0 | 1\
    \ | 2 | 3 | 4 |\n| data | A | B | C | D | E |\n| lc | 1 | -1 | 3 | -1 | -1 |\n\
    | rc | 2 | -1 | -1 | 4 | -1 |\n\n[双亲：存储节点数据和其父节点的序号]\n\n| 1 | 2 | 3 | 4 | 5 |\n\
    | data | A | B | C | D | E |\n| parent | 0 | 1 | -1 | 3 | -4 |\n\n![](img/808bb2589300c03793be19c880a932f9_241_0.png)\n\
    \n## 二叉链表\n\n## 二叉链表/带双亲的二叉链表\n\n结论: 若一个二叉树含有n个结点，则它的二叉链表中必含有2n个指针域，其中必有n+1个空的链域。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_242_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_242_1.png)\n\
    \n## 二叉链表的类型定义\n\n```\ntypedef\nstruct btnode{\n    btnode *lc,rc;\n    elemtp\
    \ data;\n} *BiTree;\n```\n\n## 三叉链表的类型定义\n\n```\ntypedef\nstruct btnode{\n   \
    \ btnode *lc,rc;\n    btnode *parent;\n    elemtp data;\n} *BiTree;\n```\n\n##\
    \ 6.4 二叉树的遍历\n\n[遍历的目的] 非线性结构⇒线性结构\n\n[遍历的概念] 指按某条搜索路线走遍二叉树的每个结点，使得树中每个结点都被访问一次，且仅被访问一次。\n\
    \n## 典型的遍历方法\n\n- 先(根)序遍历 DLR\n- 中(根)序遍历 LDR\n- 后(根)序遍历 LRD\n- 层序遍历\n\n上述逆序方式很少使用\n\
    \n![](img/808bb2589300c03793be19c880a932f9_244_0.png)\n\n先序遍历：ABDEC\n中序遍历：DBEAC\n\
    后序遍历：DEBCA\n\n## 利用遍历结果确定二叉树\n\n先序序列+中序序列\n中序序列+后序序列\n先序序列+后序序列 ×\n思考：层序+先序/中序/后序\n\
    能否确定？如何做？\n\n先序序列: ABCDEFGH\n中序序列: BDCEAFHG\n\n![](img/808bb2589300c03793be19c880a932f9_245_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_245_1.png)\n\n![](img/808bb2589300c03793be19c880a932f9_246_0.png)\n\
    \n先序序列：a b c d e f g\n\n中序序列：c b d a e g f\n\n## 消除尾递归的递归算法\n\n```\nvoid Preorder3\
    \ (BiTree T,\n    void (*visit)( BiTree ))\n{\n    while (T)\n    {\n        visit(T);\n\
    \        Preorder3(T->lc,visit);\n        T = T->rc;\n    }\n}\n```\n\n## 非递归算法\n\
    \n```\nvoid Preorder4 (BiTree T,void (*visit)( BiTree ))\n{\n    instack(s);\n\
    \    p=bt;\n    push(s,NULL);\n    while (p)\n    {\n        visit(p);\n     \
    \   if (p->rc)\n            push(s, p->rc);\n        if (p->lc)\n            p=p->lc;\n\
    \        else\n            p=pop(s);\n    }\n}\n```\n\n## 中序遍历算法\n\n```\nvoid\
    \ Inorder (BiTree T,\n    void(*visit)( BiTree ))\n{\n    if (T)\n    {\n    \
    \    Inorder(T->lc,visit);\n        visit(T);\n        Inorder(T->rc,visit);\n\
    \    }\n}\n```\n\n## 后序遍历算法\n\n```\nvoid Postorder(BiTree T,\nvoid(*visit)( BiTree\
    \ ))\nif (T)\n{\n    Postorder(T->lc,visit);\n    Postorder(T->rc,visit);\n  \
    \  visit(T);\n}\n```\n\n## 按层次遍历算法\n\n```\nvoid Levelorder (BiTree T);\n{\n  \
    \  iniqueue( q);\n    if (T) enqueue( q, T);\n    while (!empty( q))\n    {\n\
    \        x= dequeue( q);\n        visit( x );\n        if (x->lchild) enqueue(\
    \ q, x->lc );\n        if (x->lchild) enqueue( q, x->lc );\n    }\n}\n```\n\n\
    对用二叉链表表示的二叉树，设计一个算法，求其后序遍历的第一个结点。\n\n```\ntypedef struct node {\netype data;\n\
    node *left, *right;\n} node, *bitptr;\n```\n\n```\nbitptr firstnode( bitptr root\
    \ )\n```\n\n```c\nbitptr firstnode( bitptr root )\n{\n    if ( !root ) return\
    \ NULL;        // 空树不存在此结点\n    while ( root->left || root->right )  // 尚未找到叶子结点\n\
    \    {\n        if ( root->left )\n            root = root->left;\n          \
    \  // 若有左子树，则沿左分枝向下查找最左下的叶子结点\n        else\n            root = root->right;\n\
    \            // 若无左子树，则沿右分枝向下查找最左下的叶子结点\n    }\n    return root;             \
    \        // 返回后序遍历的第一个结点\n}\n```\n\n算法思想：\n\n- （1）若树根有左子树，则树根的左子树上最左下的叶子结点即为所求；\n\
    - （2）若树根无左子树，仅有右子树，则树根右子树上最左下的叶子结点即为所求。\n\n1. 设树T的度为4，其中度为1，2，3和4的结点个数分别为4，2，1，1\
    \ 则T中的叶子数为（ ）D\nA. 5      B. 6      C. 7      D. 8\n\n2.在下述结论中，正确的是（ D ）①只有一个结点的二叉树的度为0；②二叉树的度为2；③二叉树的左右子树可任意交换；④深度为K的完全二叉树的结点个数小于或等于深度相同的满二叉树。\n\
    A. ①②③      B. ②③④      C. ②④      D. ①④\n"
