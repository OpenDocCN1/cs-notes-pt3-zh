    # 2 磁盘信息的存取


    属于直接存取设备，适用于各类存储形式的文件


    # [工作原理]


    磁盘可以是单片的，或有若干个盘片组成盘组


    +   - 磁道：盘片上的同心圆

    +   - 柱面：各盘面上半径相同的磁道合在一起

    +   - 扇区：每个磁道等分为若干扇区(块)


