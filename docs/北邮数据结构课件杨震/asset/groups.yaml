    \      }\n    }\n}\n```\n\n## 5.3.4.2 十字（正交）链表\n\n[特点] 在行、列两个方向上，将非零元素链接在一起。克服三元组表在矩阵的非零元素位置或个数经常变动时的使用不便。\n\
    \n[结构]\n\n| row | col | val/next |\n| --- | --- | -------- |\n| down | right |\
    \  |\n\n## [算法示例] 从终端接收信息建立稀疏矩阵的十字链表\n\n算法思想：\n\n- 1）读入矩阵的行数m和列数n\n- 2）建立hm头结点，建立max(m,n)个H头结点，并建立上述结点的循环链表\n\
