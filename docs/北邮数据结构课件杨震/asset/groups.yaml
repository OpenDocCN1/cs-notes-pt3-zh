  md: "\n## [相关概念和术语]\n\n源点 入度为0的顶点，即工程的开始点\n\n汇点 出度为0的顶点，即工程的完成点\n\n关键路径 从源点到汇点的最长路径\n\
    \n关键路径长度=最短工期\n\n关键活动 关键路径上的活动 e(i)=l(i)\n\n关键活动的加快可以缩短工期\n\n## [确定关键路径时涉及的几个变量]\n\
    \n- e(i):活动aᵢ的最早开始时间\n- l(i):活动aᵢ的最迟开始时间\n- ve(j):事件vⱼ的最早发生时间\n- vl(j):事件vⱼ的最迟发生时间\n\
    \n![](img/808bb2589300c03793be19c880a932f9_392_0.png)\n\n## [关键路径的确定]\n\n### 1)\
