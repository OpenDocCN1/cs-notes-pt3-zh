  - '[PAGE 489]


    # 9.1 基本概念与术语


    排序是根据记录关键字的值的递增(递减)的关系将文件记录的次序重新排列。


    # [定义]


    设有含n个记录的序列 {R₁, R₂, ..., Rₙ},


    对应的关键字序列为 {K₁, K₂, ..., Kₙ},


    一个置换 p1,p2,...,pn


    使记录序列按关键字有序 {Rₚ₁, Rₚ₂, ..., Rₚₙ},


    满足 Kₚ₁ ≤ Kₚ₂ ≤ ... ≤ Kₚₙ （正序）


    或 Kₚ₁ ≥ Kₚ₂ ≥ ... ≥ Kₚₙ （逆序）'
  - '[PAGE 490]


    # 排序的分类


    +   [1. 根据排序时文件记录的存放位置]

    +   内部排序：排序过程中将全部记录放在内存中处理。

    +   外部排序：排序过程中需在内外存之间交换信息。


    +   [2. 根据排序前后相同关键字记录的相对次序]

    +   稳定排序：设文件中任意两个记录的关键字值相同，即 K_i = K_j (i≠j)，若排序之前记录 R_i 领先于记录 R_j，排序后这种关系不变(对所有输入实例而言)。

    +   不稳定排序：只要有一个实例使排序算法不满足稳定性要求。'
