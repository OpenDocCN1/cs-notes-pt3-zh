  - '[PAGE 157]


    存储队列的数组被当作首尾相接的表处理。为解决如何判断队列的满与空问题：牺牲一个存储单元。


    队头、队尾指针加1时从maxSize -1直接进到0，可用语言的取模(余数)运算实现。


    出队： front = (front + 1) % maxSize;


    入队： rear = (rear + 1) % maxSize;


    队列初始化： front = rear = 0;


    队空条件： front == rear;


    队满条件： (rear + 1) % maxSize == front


    思考：循环队列中当前元素的个数为多少？


    当前元素个数n=(rear-front+maxsize)%maxsize'
