  - "[PAGE 6]\n\n# 例【人口问题】\n\n已知：\n每个人的净生殖率为r（净生殖率=出生率-死亡率）；\n时间t；\nt=0时的人口为N(0)；\n\
    求：\nt时间的人口数。\n\n+   1. 所求量  N(t).\n+   2. 模型  1/N dN/dt = r.\n+   3. 求解模型的算法 \
    \ N(t) = N(0)e^{rt}.\n+   4. 编制计算机程序\n\n```\n#include <cmath>  //for std::exp()\n\
    int population(int ini, double birth_rate,\n               double time_at)\n{\n\
    \    return ini*std::exp(birth_rate*time_at);\n}\n```"
