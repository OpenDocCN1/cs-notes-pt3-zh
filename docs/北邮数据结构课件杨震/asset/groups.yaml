    Qsort (L, low, pivotloc-1);\nQsort (L, pivotloc+1, high )\n}\n} // QSort\n```\n\
    \n```\nint Partition ( SqList &L, int low, int high )\n{ L.r[0] = L.r[low]; pivotkey\
    \ = L.r[low].key;\n    while ( low < high )\n    { while ( low < high && L.r[high].key\
    \ >= pivotkey ) --high;\n        L.r[low] = L.r[high];\n        while ( low <\
    \ high && L.r[low].key <= pivotkey ) ++low;\n        L.r[high] = L.r[low];\n \
    \   }\n    L.r[low]=L.r[0]; return low;\n} // Partition\n```\n\n## [性能分析]\n\n\
    最坏情况(原始数据正/逆序排列)\n\nC_max=n(n-1)/2      M_max ≤ C_max      O(n²)\n\n最好情况：每次划分的结果是基准的左、右两个无序子区间的长度大致相等\n\
    \nC_min ≤ O(nlgn)      M_min ≤ C_min      O(nlog₂n)\n\n平均时间性能    T_avg(n)=kn ln(n)\n\
    \nk: 某个常数； n: 待排序序列中记录个数\n\n就平均时间而言，快速排序是目前被认为最好的一种内部排序方法。\n\n辅助空间复杂度  最好情况 O(log₂\
    \ n)\n\n最坏情况 O(n)\n\n快速排序的最大递归深度是多少？最小递归深度是多少？\n\n![](img/808bb2589300c03793be19c880a932f9_514_0.png)\n\
    \n## [算法的改进]\n\n合理选择枢轴记录可改善性能。例如，\n\n- 三者取中\n- 随机产生\n\n## [算法的稳定性]\n\n是非稳定排序\n\
    \n反例 [2, 2, 1]: {1 2} 2 { }\n\n思考：分别用单链表、双向链表存储记录，快排算法如何实现？？\n\n## 9.4 选择排序\n\n\
    ## 1 简单选择排序(直接选择排序)\n\n## [算法步骤]\n\n第1趟：从n个记录中选关键字最小的记录，与第1个记录交换；\n\n第2趟：从剩余的n-1个记录中选关键字最小的记录，与第2个记录交换；\n\
    \n......\n\n第i趟：从剩余的n-i+1个记录中选关键字最小的记录，与第i个记录交换；\n\n......\n\n直到第n-1趟执行完为止。\n\n\
    ## [算法描述]\n\n```\nvoid SelectSort ( SqList &L )\n{ for ( i =1; i < L.length; ++i\
    \ )\n    { j = SelectMinKey ( L, i );\n        if ( i != j ) r[i] <=> r[j];\n\
    \    }\n} // SelectSort\n\nint SelectMinKey (SqList L; int i)\n{\n    k = i;\n\
    \    for ( j = i + 1; j <= n; j-- )\n        if (r [ j ] .key < r [ k ].key) k\
    \ = j;\n    return k;\n}\n```\n\n## [示例] （n=8）\n\n<初态>  49  38  65  97  76  49\
    \  13  27\n<第1趟> 13  38  65  97  76  49  49  27\n<第2趟> 13  27  65  97  76  49\
    \  49  38\n<第3趟> 13  27  38  97  76  49  49  65\n<第4趟> 13  27  38  49  76  97\
    \  49  65\n<第5趟> 13  27  38  49  49  97  76  65\n<第6趟> 13  27  38  49  49  65\
    \  76  97\n<第7趟> 13  27  38  49  49  65  76  97\n（每趟排序使有序区增加一个记录）\n\n不稳定排序\n\n\
    ## [性能分析]\n\n- 总的比较次数与记录排列的初始状态无关\n- C=(n-1)+(n-2)+...+2+1=n(n-1)/2\n\n- 移动次数\n\
    - 初始记录逆序时： M_max = 3(n-1)\n- 初始记录正序时： M_min = 0\n\n- 平均时间复杂度O(n²)\n- 辅助空间复杂度O(1)\n\
    \n"
