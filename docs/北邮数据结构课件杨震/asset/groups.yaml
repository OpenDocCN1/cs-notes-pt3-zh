  - "[PAGE 513]\n\n```\nint Partition ( SqList &L, int low, int high )\n{ L.r[0] =\
    \ L.r[low]; pivotkey = L.r[low].key;\n    while ( low < high )\n    { while (\
    \ low < high && L.r[high].key >= pivotkey ) --high;\n        L.r[low] = L.r[high];\n\
    \        while ( low < high && L.r[low].key <= pivotkey ) ++low;\n        L.r[high]\
    \ = L.r[low];\n    }\n    L.r[low]=L.r[0]; return low;\n} // Partition\n```"
