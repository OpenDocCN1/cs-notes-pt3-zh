    \n![](img/808bb2589300c03793be19c880a932f9_380_3.png)\n\n**AOE 网络**：定义顶点为事件，单位是时刻。有向边定义为活动，它的权值定义为活动进行所需要的时间。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_380_4.png)\n\n**思考：**有向无环图以邻接矩阵存储，按照何种规律对顶点进行编号就能使其邻接矩阵成为下三角矩阵？\n\
    \n编号规则：让弧尾顶点的编号大于弧头顶点的编号。\n\n## 2 拓扑排序\n\n### [问题目标]\n\n当一个任务可以划分为若干个子任务/子活动/子事件，其中的任何子任务可能又以另外的一些子任务作为先决条件时，如何排定子任务的执行顺序，以达到整体任务的完成。\n\
    \n### [示例]\n\n![](img/808bb2589300c03793be19c880a932f9_382_0.png)\n\n课程之间的依赖关系。其中，1\
    \ 代表数学，2 代表程序设计，3 代表离散数学，4 代表汇编程序设计，5 代表数据结构，6 代表结构程序设计，7 代表编译原理。\n\n![](img/808bb2589300c03793be19c880a932f9_382_1.png)\n\
    \nAOV 网（顶点活动网络）——顶点表示活动，弧表示活动间的优先关系。\n\n### 2.1 无前驱的顶点优先算法\n\n**[算法原理]**\n\n在一个拓扑序列中，每个顶点必定出现在它的所有前驱顶点之后。\n\
    \n**[算法思想]**\n\n1. 选择一个入度为 0 的顶点（无前驱的顶点），输出它。\n2. 删除该顶点及其关联的所有出边。\n\n重复上述两步，直至图中不再有入度为\
    \ 0 的顶点为止。若所有顶点均被输出，则排序成功，否则图中存在有向环。若该有向图不是无环图，则不存在拓扑排序。可以用来判断一个有向图是否存在回路。\n\n\
    ### [例]\n\n![](img/808bb2589300c03793be19c880a932f9_384_0.png)\n\nV₁  \nV₁ V₂\
    \  \nV₁ V₂ V₅  \nV₁ V₂ V₅ V₃  \nV₁ V₂ V₅ V₃ V₄  \n\n有向无环图的拓扑序列不唯一。\n\n### [算法（使用邻接矩阵）]\n\
    \n算法的执行步骤：\n\n1. 找到全为零的第 j 列，输出 j。\n2. 将第 j 行的全部元素置为零。\n3. 找到全为零的第 k 列，输出 k。\n\
    4. 将第 k 行的全部元素置为零。\n\n反复执行 3、4；直至所有元素输出完毕。\n\n![](img/808bb2589300c03793be19c880a932f9_385_0.png)\n\
    \n### [算法（使用邻接表）]\n\n![](img/808bb2589300c03793be19c880a932f9_386_0.png)\n\n算法的执行步骤：\n\
    \n1. 用一个数组记录每个结点的入度。将入度为零的结点进栈。\n2. 将栈中入度为零的结点 V 输出。\n3. 根据邻接表找到结点 V 的所有的邻接结点，并将这些邻接点的入度减一。如果某一个结点的入度变为零，则进栈。\n\
    4. 反复执行 2、3；直至栈空为止。\n\n…………………\n\n拓扑排序执行结束，如果输出结点数等于图的结点总数，则有向图无环，否则有向图有环。\n\n\
    | 结点 | indegree |\n|---|---:|\n| 1 | 0 |\n| 2 | 1 |\n| 3 | 1 |\n| 4 | 1 |\n| 5\
    \ | 2 |\n| 6 | 1 |\n| 7 | 3 |\n\n| 结点 | 邻接表 |\n|---:|---|\n| 1 | 2 → 3 → null\
    \ |\n| 2 | 4 → 5 → 6 → null |\n| 3 | 5 → 7 → null |\n| 4 | null |\n| 5 | 7 → null\
    \ |\n| 6 | 7 → null |\n| 7 | null |\n\n```c\n//邻接表存储\nStatus TopologicalSort(ALGraph\
    \ G) {\n    FindInDegree(G, indegree); // O(n+e)\n    InitStack(S);\n    for (i\
    \ = 1; i <= G.vexnum; ++i)\n        if (!indegree[i]) Push(S, i);\n    count =\
    \ 0;\n    while (!StackEmpty(S)) { // O(n+e)\n        Pop(S, i);\n        printf(\"\
    %s\", G.vertices[i].data);\n        ++count;\n        for (p = G.vertices[i].firstarc;\
    \ p; p = p->nextarc) {\n            k = p->adjvex;\n            if (!(--indegree[k]))\
    \ Push(S, k);\n        }\n    }\n    if (count < G.vexnum) return ERROR;\n   \
    \ else return OK;\n} // end\n```\n\n### 2.2 无后继的顶点优先\n\n**[算法原理]**\n\n在一个拓扑序列中，每个顶点必定出现在它的所有后继顶点之前。\n\
    \n**[方法一 算法思想]**\n\n（按逆拓扑次序生成顶点序列）\n\n1. 选择一个出度为 0 的顶点（无后继的顶点），输出它。\n2. 删去该顶点及其关联的所有入边。\n\
    \n重复上述两步，直至图中不再有出度为 0 的顶点为止。若所有顶点均被输出，则排序成功，否则图中存在有向环。\n\n### 【方法二 算法思想】\n\n![](img/808bb2589300c03793be19c880a932f9_390_0.png)\n\
    \n（利用深度优先遍历）\n\n1. 访问顶点 v，并记录 v 已被访问。\n2. 依次从 v 的未访问的邻接点出发，深度优先遍历图 G。\n3. （递归返回时）输出顶点\
    \ v（此时 v 相当于无后继的顶点）。\n\n结论：用 DFS 遍历一个无环有向图，并在 DFS 算法退栈返回时打印相应的顶点，则输出的顶点序列是逆拓扑序列。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_390_1.png)\n\n### 【方法二适用范围】\n\n有向无环图\n\
    \n（此算法不能检测出有向环，得到虚假拓扑序列）\n\n## 3 关键路径\n\n### [问题目标]\n\n当一个任务可以划分为若干个子工程，其中的任何子工程可能又以另外的一些子工程作为先决条件时，如何安排整个工程中哪些活动？\n\
    \n### AOE 网（边活动网）\n\n![](img/808bb2589300c03793be19c880a932f9_391_0.png)\n\n###\
    \ [AOE网的性质]\n\n- 进入 Vᵢ 的活动都结束，Vᵢ 所代表的事件才能发生。\n- 顶点 Vᵢ 所代表的事件发生，从 Vᵢ 出发的活动才能开始。\n"
  mdcn: "\n\n用“破圈法”求解带权连通无向图的一棵最小代价生成树。所谓“破圈法”就是“任取一圈（环），去掉圈上权最大的边”，反复执行这一步骤，直到没有圈为止。请给出用“破圈法”求解给定的带权连通无向图的一棵最小代价生成树的详细算法。\n\
    \n```c\nvoid SpnTree(AdjList g)\n{\n    typedef struct { int i, j, w; } EDGE;\
    \  // 该顶点信息就是顶点编号，权是整数\n    EDGE edge[];\n    scanf(\"%d%d\", &e, &n);  // 输入边数和顶点数。\n\
    \    for (i = 1; i <= e; i++)      // 输入 e 条边：顶点，权值。\n        scanf(\"%d%d%d\"\
    , &edge[i].i, &edge[i].j, &edge[i].w);\n    for (i = 2; i <= e; i++)      // 按边上的权值大小，对边进行逆序排序。\n\
    \    {\n        edge[0] = edge[i]; j = i - 1;\n        while (edge[j].w < edge[0].w)\n\
    \            edge[j + 1] = edge[j--];\n        edge[j + 1] = edge[0];\n    }\n\
    \    k = 1; eg = e;\n    while (eg >= n)               // 破圈，直到边数 e = n - 1。\n\
    \    {\n        if (connect(k))           // 删除第 k 条边若仍连通。\n        {\n      \
    \      edge[k].w = 0; eg--;  // 测试下一条边 edge[k]，权值置 0 表示该边被删除\n        }\n    \
    \    k++;                      // 下条边\n    }\n}\n```\n\n## 7.5 有向无环图的应用\n\n###\
    \ 1、何为有向无环图（DAG 图）\n\n**[实例]**\n\n![](img/808bb2589300c03793be19c880a932f9_380_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_380_1.png)\n\n![](img/808bb2589300c03793be19c880a932f9_380_2.png)\n\
    \n有向树  \nDAG 图  \n有向图（含环）\n\n**[用途]**：描述工程项目或系统进行的工具\n\n**AOV 网络**：定义顶点为活动，有向边的指向表示活动执行的次序。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_380_3.png)\n\n**AOE 网络**：定义顶点为事件，单位是时刻。有向边定义为活动，它的权值定义为活动进行所需要的时间。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_380_4.png)\n\n**思考：**有向无环图以邻接矩阵存储，按照何种规律对顶点进行编号就能使其邻接矩阵成为下三角矩阵？\n\
    \n编号规则：让弧尾顶点的编号大于弧头顶点的编号。\n\n## 2 拓扑排序\n\n### [问题目标]\n\n当一个任务可以划分为若干个子任务/子活动/子事件，其中的任何子任务可能又以另外的一些子任务作为先决条件时，如何排定子任务的执行顺序，以达到整体任务的完成。\n\
    \n### [示例]\n\n![](img/808bb2589300c03793be19c880a932f9_382_0.png)\n\n课程之间的依赖关系。其中，1\
    \ 代表数学，2 代表程序设计，3 代表离散数学，4 代表汇编程序设计，5 代表数据结构，6 代表结构程序设计，7 代表编译原理。\n\n![](img/808bb2589300c03793be19c880a932f9_382_1.png)\n\
    \nAOV 网（顶点活动网络）——顶点表示活动，弧表示活动间的优先关系。\n\n### 2.1 无前驱的顶点优先算法\n\n**[算法原理]**\n\n在一个拓扑序列中，每个顶点必定出现在它的所有前驱顶点之后。\n\
    \n**[算法思想]**\n\n1. 选择一个入度为 0 的顶点（无前驱的顶点），输出它。\n2. 删除该顶点及其关联的所有出边。\n\n重复上述两步，直至图中不再有入度为\
    \ 0 的顶点为止。若所有顶点均被输出，则排序成功，否则图中存在有向环。若该有向图不是无环图，则不存在拓扑排序。可以用来判断一个有向图是否存在回路。\n\n\
    ### [例]\n\n![](img/808bb2589300c03793be19c880a932f9_384_0.png)\n\nV₁  \nV₁ V₂\
    \  \nV₁ V₂ V₅  \nV₁ V₂ V₅ V₃  \nV₁ V₂ V₅ V₃ V₄  \n\n有向无环图的拓扑序列不唯一。\n\n### [算法（使用邻接矩阵）]\n\
    \n算法的执行步骤：\n\n1. 找到全为零的第 j 列，输出 j。\n2. 将第 j 行的全部元素置为零。\n3. 找到全为零的第 k 列，输出 k。\n\
    4. 将第 k 行的全部元素置为零。\n\n反复执行 3、4；直至所有元素输出完毕。\n\n![](img/808bb2589300c03793be19c880a932f9_385_0.png)\n\
    \n### [算法（使用邻接表）]\n\n![](img/808bb2589300c03793be19c880a932f9_386_0.png)\n\n算法的执行步骤：\n\
    \n1. 用一个数组记录每个结点的入度。将入度为零的结点进栈。\n2. 将栈中入度为零的结点 V 输出。\n3. 根据邻接表找到结点 V 的所有的邻接结点，并将这些邻接点的入度减一。如果某一个结点的入度变为零，则进栈。\n\
    4. 反复执行 2、3；直至栈空为止。\n\n…………………\n\n拓扑排序执行结束，如果输出结点数等于图的结点总数，则有向图无环，否则有向图有环。\n\n\
    | 结点 | indegree |\n|---|---:|\n| 1 | 0 |\n| 2 | 1 |\n| 3 | 1 |\n| 4 | 1 |\n| 5\
    \ | 2 |\n| 6 | 1 |\n| 7 | 3 |\n\n| 结点 | 邻接表 |\n|---:|---|\n| 1 | 2 → 3 → null\
    \ |\n| 2 | 4 → 5 → 6 → null |\n| 3 | 5 → 7 → null |\n| 4 | null |\n| 5 | 7 → null\
    \ |\n| 6 | 7 → null |\n| 7 | null |\n\n```c\n//邻接表存储\nStatus TopologicalSort(ALGraph\
    \ G) {\n    FindInDegree(G, indegree); // O(n+e)\n    InitStack(S);\n    for (i\
    \ = 1; i <= G.vexnum; ++i)\n        if (!indegree[i]) Push(S, i);\n    count =\
    \ 0;\n    while (!StackEmpty(S)) { // O(n+e)\n        Pop(S, i);\n        printf(\"\
    %s\", G.vertices[i].data);\n        ++count;\n        for (p = G.vertices[i].firstarc;\
    \ p; p = p->nextarc) {\n            k = p->adjvex;\n            if (!(--indegree[k]))\
    \ Push(S, k);\n        }\n    }\n    if (count < G.vexnum) return ERROR;\n   \
    \ else return OK;\n} // end\n```\n\n### 2.2 无后继的顶点优先\n\n**[算法原理]**\n\n在一个拓扑序列中，每个顶点必定出现在它的所有后继顶点之前。\n\
    \n**[方法一 算法思想]**\n\n（按逆拓扑次序生成顶点序列）\n\n1. 选择一个出度为 0 的顶点（无后继的顶点），输出它。\n2. 删去该顶点及其关联的所有入边。\n\
    \n重复上述两步，直至图中不再有出度为 0 的顶点为止。若所有顶点均被输出，则排序成功，否则图中存在有向环。\n\n### 【方法二 算法思想】\n\n![](img/808bb2589300c03793be19c880a932f9_390_0.png)\n\
    \n（利用深度优先遍历）\n\n1. 访问顶点 v，并记录 v 已被访问。\n2. 依次从 v 的未访问的邻接点出发，深度优先遍历图 G。\n3. （递归返回时）输出顶点\
    \ v（此时 v 相当于无后继的顶点）。\n\n结论：用 DFS 遍历一个无环有向图，并在 DFS 算法退栈返回时打印相应的顶点，则输出的顶点序列是逆拓扑序列。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_390_1.png)\n\n### 【方法二适用范围】\n\n有向无环图\n\
    \n（此算法不能检测出有向环，得到虚假拓扑序列）\n\n## 3 关键路径\n\n### [问题目标]\n\n当一个任务可以划分为若干个子工程，其中的任何子工程可能又以另外的一些子工程作为先决条件时，如何安排整个工程中哪些活动？\n\
    \n### AOE 网（边活动网）\n\n![](img/808bb2589300c03793be19c880a932f9_391_0.png)\n\n###\
    \ [AOE网的性质]\n\n- 进入 Vᵢ 的活动都结束，Vᵢ 所代表的事件才能发生。\n- 顶点 Vᵢ 所代表的事件发生，从 Vᵢ 出发的活动才能开始。\n\
    \n"
