  md: "\n# 外部排序作业\n\n+   1. 假设一次I/O的物理块大小为150，每次可对750个记录进行内部排序，那么对含有150000个记录的磁盘文件进行4-路平衡归并排序时，共需进行多少次I/O？\n\
    +   2. 已知某文件经过置换-选择排序之后，得到长度分别为47，9，31，18，4，12，23和7（单位均为物理块）的8个初始归并段。试为3-路平衡归并设计一个读写外存次数最少的归并方案，并求出读写外存的次数。\n\
    \n# 第11章 动态存储管理\n\n# 11.1 概述\n\n# [动态存储管理]\n\n指系统随机地根据用户程序申请空间的大小，进行分配空间和回收不用空间所进行的内存管理。\n\
    \n# [动态存储管理的一种方法]\n\n建立可利用空间表(自由空间表/存储池)，将所有可利用的空闲内存块链接起来。\n\n![](img/808bb2589300c03793be19c880a932f9_588_0.png)\n\
    \n# 二种基本分配策略\n\n+   - **首次拟合法**：分配找到的第一个不小于 n 的空闲块的 一部分。**操作方便，查找快捷**\n+   - **最佳拟合法**：分配不小于\
    \ n 且最接近 n 的空闲块的一部分。**尽可能将大的空闲块留给大程序使用**\n+   - **最差拟合法**：分配不小于 n 且是最大的空闲块的一部分。**尽可能减少分配后无用碎片**\n\
    \n# 11.2.1 可利用空间表的结点结构\n\nheader\n(块头)\n\nllink\n\ntag\n\nsize\n\nrlink\n\nspace\n\
    \nuplink\n\ntag\n\nfooter\n(块尾)\n\nsize\n\n标志位：\ntag= 1 占用块\n0 空闲块\n\n块尾的作用：\n\
    简化回收算法\n\n```\nTYPE blkptr=^blk;\n    blk=RECORD\n        header:RECORD\n    \
    \        llink,rllink:blkptr;\n            tag:0..1;\n            size:integer\n\
    \        END;\n            space:ARRAY[1..size-2] OF\ndatatype;\n        footer:RECORD\n\
    \            uplink:blkptr;\n            tag:0..1\n        END\nEND;\n```\n\n\
    # 11.2.2 分配算法 （申请容量为n的存储空间）\n\n+   假设采用首次分配法，为避免过多碎片，设一常数e\n+   m-n ≤ e 将大小为m的块全部分出\n\
    +   > e 分出n大小，剩余留下\n\n+   为使分配后剩余的小块均匀分布在链表中，可利用空间链表的头指针pav在每次分配之后，指向被分配块的后继块\n\
    \n+   假设header和footer各占一个字的空间\n\n[例] 教材205页图8.6\n\n# [算法思想]\n\n从p=pav开始查找一块容量≥n的空闲块，结果有三种情况\n\
    \n+   1) p^.size ≥n且p^.size -n≤e ： 分配p整块\n\n+   置tag=1\n\n+   从可利用空间表中删除此块\n\n\
    +   pav指向被分配块的后继块\n\n# 2) p^.size ≥ n 且 p^.size - n > e : 分配 p 块高地址部分大小为 n 的块\n\
    \n+   - 修改剩余块的头部\n+   - 设置剩余块的尾部\n+   - 设置占用块的头部\n+   - 修改占用块的尾部\n+   - pav 指向被分配块的后继块\n\
    \n3) 未找到，无法分配\n\n![](img/808bb2589300c03793be19c880a932f9_593_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_593_1.png)\n\
    \n# [伙伴系统原理]\n\n+   - 伙伴系统的空闲块大小以2^k（k=0,1,2,...,m）标定。按k值不同组织成多个双循环链表。\n+   -\
    \ 系统起始时只有一个空闲块，大小为 2^m。\n+   - 用户申请内存时，就将刚好满足用户需求的 2^k 大小的空闲块分配给用户；若不存在 2^k 大小的空闲块，就找到k值更大的空闲块，将其分为两半（互称伙伴），按此直至分出2^k大小给用户，被分出的其它空闲块加入对应的循环链表中。\n\
    +   - 回收时，只有伙伴才合并，并将合并后的新空闲块加入上一级大小的空闲块链表中。\n\n# [“伙伴”的概念]\n\n当把一个存储块分为大小相等的两半时，则它们互为伙伴。\n\
    \n# [大小为2^k的伙伴的首地址之间的关系]\n\n![](img/808bb2589300c03793be19c880a932f9_597_0.png)\n\
    \n起始地址为p，大小为2^k的内存块，其伙伴的起始地址为：\n\n```\nbuddy(p, k) = \n{ p + 2^k = xx..x100...0\
    \ 当 p mod 2^{k+1} = 0\n  p - 2^k = xx..x000...0 当 p mod 2^{k+1} = 2^k }\n```\n\
    \n# 11.3.1 可利用空间表的结点结构\n\n![](img/808bb2589300c03793be19c880a932f9_598_0.png)\n\
    \n**[存储管理方式]**  按 k 值索引，相同 k 值的块构成子表（双链表）\n\n**[例]** 教材209页图8.8\n\n```\nTYPE freeptr\
    \ =^freenode\nfreenode=RECORD\n    header:RECORD\n        llink,rlink:freeptr;\n\
    \        tag:0..1;\n        kval:integer\n    END;\n    space:ARRAY[1..nodesize-1]OF\n\
    datatype;\n    END;\nheadnode=RECORD\n    nodesize:integer;\n    first:freeptr;\n\
    \    END;\nfreelist=ARRAY[0..m] OF headnode;\n```\n\n# 11.3.2 分配算法（申请容量为n的存储空间）\n\
    \n# [算法思想]\n\n+   1) 计算k值： k=⌈log₂n⌉\n+   2) 从子表k开始找可用的块\n+     2.1) k子表有，取出分配，结束；\n\
    +     2.2) 否则，若从k向下找到i (i>k)子表有可用块 (起始地址为p)，则取出2ᵏ分配，剩余的块\n\n| 大小 | 2^{i-1} | 2^{i-2}\
    \ | ... ... | 2^{k} |\n| 起始地址 | p+2^{i-1} | p+ 2^{i-2} | ... ... | p+2^{k} |\n\
    \n插入相应的子表。\n\n![](img/808bb2589300c03793be19c880a932f9_600_0.png)\n\n假设利用边界标识法首次匹配策略分配，已知在某个时刻的可利用空间表如下：\n\
    （1）请画出当系统回收一个起始地址为559、大小为45的空闲块之后的链表状态；\n（2）请画出系统在之后接受大小为100的请求后又回收地址为515、大小为44的空闲块后的链表状态。\n\
    注：存储块头部中大小域的值和申请分配的存储量均包含头尾的存储空间。\n\n![](img/808bb2589300c03793be19c880a932f9_602_0.png)\n\
    \n# 第12章 文件\n\n# 数据项（字段/属性）文件可使用的最小单位\n\n主键字项 其值能唯一标识一个记录的数据项或数据项的组合；该值称为主键字。\n\
    \n次关键字项 其值不能唯一标识一个记录的数据项；该值称为次关键字。\n\n单关键字文件 文件的记录只有主键字\n\n多关键字文件 文件的记录除有主键字，还含有若干个次关键字\n\
    \n定长记录文件 文件中每个记录包含的信息长度相同（所有数据项定长）\n\n不定长记录文件 文件中每个记录包含的信息长度不一定相同\n\n# [文件中记录之间的逻辑关系]\
    \ 一般看作是线性关系\n\n# [文件上的主要操作]\n\n# (1)检索\n\n+   - 顺序检索：存取下一个逻辑记录\n+   - 直接检索：存取第i个逻辑记录\n\
    +   - 按关键字检索\n\n简单询问：查询单个关键字等于给定值的记录\n\n范围询问：查询单个关键字属于某个范围的所有记录\n\n函数询问：规定单个关键字的某个函数，查询函数的值\n\
    \n布尔询问：以上三种询问用布尔运算(与、或、非)组\n\n# (2)修改\n\n对记录的插入、删除，对记录某些数据项的更新等\n\n# [文件操作的处理方式]\n\
    \n+   - 实时\n+   - 批量\n\n# 12.1.3 文件的存储结构(物理结构)\n\n# [物理记录(页块)和逻辑结构之间可能存在的关系]\n\
    \n+   - 一个物理记录存放一个逻辑记录\n+   - 一个物理记录存放多个逻辑记录\n+   - 多个物理记录存放一个逻辑记录\n\n# [文件的常用存储结构]\n\
    \n+   - 顺序组织\n+   - 索引组织\n+   - 散列组织\n+   - 链组织\n\n# 12.1.4 文件操作实现的基本方法\n\n内外存交换以物理记录为单位\n\
    \n![](img/808bb2589300c03793be19c880a932f9_607_0.png)\n"
