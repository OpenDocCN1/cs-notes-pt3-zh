    \n### [修改]\n\n◆ 插入：将插入的记录置于数据区的末尾，并在索引表中插入索引项\n◆ 删除：删去相应的索引项\n◆ 更新：若主关键字被修改，则需修改对应的索引表项\n\
    \n- 为减少访问外存次数，应尽量减少索引表深度\n- 各级索引均为顺序表，结构简单；但修改不便，每次更新操作，可能都要重组索引，因此多级索引适合于静态索引\n\
    - 当文件记录变动较多时，可采用适合于动态索引的树表结构，如二叉排序树、B-树等形式\n\n## 12.4 索引顺序文件\n\n索引顺序文件是最常用的一种文件组织形式\n\
    \n- 主文件按关键字有序，可以有较高的检索效率\n- 采用稀疏索引，索引占用空间较少\n\n### 12.4.1 ISAM(索引顺序存取方法)文件\n\n\
    - 专为磁盘存取文件设计的文件组织方式\n- 静态索引结构\n\n### [ISAM文件的组织方式]\n\n多级主索引+柱面索引+磁道(盘面)索引+主文件\n\
    \n主索引 柱面索引 磁道索引 主文件\n\n柱面C₁\n磁道索引\nT₁\nR₁₄ R₂₁ R₄₅\nT₂\nR₅₀\nT₈\nR₇₉\nT₉\n60 ^\
    \ 53 T₉₁\n溢出区\nT₁₀\n\n柱面C₂\n磁道索引\nT₁\nR₈₄ R₈₈ R₉₀\nT₂\nR₉₁\nT₈\nR₁₃₀\nT₉\n溢出区\n\
    T₁₀\n\n![](img/808bb2589300c03793be19c880a932f9_616_0.png)\n\n### 1) 查找 让主索引常驻内存\n\
    \n1) 从主索引出发，确定相应的柱面索引\n2) 读入柱面索引，确定记录所在柱面的磁道索引地址\n3) 读入磁道索引，确定记录所在的磁道\n4) 在该磁道上查找\n\
    从磁道索引项的溢出索引项中得到溢出链表的头指针查找\n\n### 2) 插入\n\n1) 利用查找确定记录应插入的柱面和磁道\n2) 该磁道不满，则插入该磁道的适当位置上，结束\n\
    3) 该磁道已满，视插入记录的关键字\n   - 插入磁道，调整溢出链表和磁道索引\n   - 直接插入溢出链表，调整磁道索引\n\n### 3）删除\n\n\
    1) 查找待删除的记录\n2) 在基本区时，在其存储位置上作删除标记\n   在溢出区时，可从链表中取消\n   周期性地集中整理ISAM文件，以保证空间利用率和存取效率。\n\
    \n### [ISAM小结]\n\n- ISAM文件是一种多叉树形的索引顺序文件\n  - 叶节点存放数据记录，组成文件的数据区\n  - 非叶节点组成文件的索引区\n\
    - 文件在记录插入和删除时，索引结构不变，是静态索引结构\n- 主索引和柱面索引在每次检索时都需查找，宜放在文件所占的几个柱面的居中的柱面上，使磁头平均移动距离最小。\n\
    \n## 12.4.2 VSAM(虚拟存储存取方法)文件\n\n- 此存取方法与存储设备无关\n- B+树(B-树的变型)动态索引结构\n- 大型索引顺序文件的标准\n\
    \n### [VSAM文件的组织方式]\n\nroot\n\n索引集\n\nB+树\n\n顺序集\n\nsq t\n\n控制区间(道)\n\n控制区域(面)\n\
    \n数据集\n\n### [VSAM文件上的操作]\n\n1) 查找\n\n- 方法1：随机查找。\n- 方法2：顺序查找。\n\n2) 插入\n\n分为三种情况：\n\
    \n- 所插入的控制区间未满\n  将待插记录插入合适的位置\n- 所插入的控制区间已满，但其所在的控制区域有空闲控制区间\n  分裂该控制区间，将近乎一半的记录移到全空的控制区间，并修改顺序集中的相应索引\n\
    - 所插入的控制区域已满\n  分裂控制区域，一般控制区域较大，此情况很少\n\n在一个控制区间内，被删记录之后的记录前移。若该控制区间变空，回收为空间，并删除顺序集中的相应索引\n\
    \n### 【和ISAM文件相比的优点】\n\n- 能保持较高的查找效率\n- 动态地分配和释放空间\n- 不必随记录的变动对文件进行再组织\n\n## 12.5.1\
    \ 散列文件的组织方式\n\n- 类似于散列表\n- 处理冲突主要采用拉链法\n- 桶：一个存储单位(一块/多块)，可以存放若干个记录\n  ■ 基桶\n\
    \  ■ 溢出桶\n\n装载因子：\nα=n/(bm)\nn: 记录数\nb: 桶数\nm: 桶容量\n\n![](img/808bb2589300c03793be19c880a932f9_622_0.png)\n\
    \n## 12.5.2 散列文件上的操作\n\n### [查找]\n\n1) 由散列函数求出基桶地址\n2) 将基桶读入内存顺序查找\n3) 若未查到，读入溢出桶继续查找\n\
    \n### [插入]\n\n1) 由散列函数求出基桶地址\n2) 读入基桶，若基桶未满，直接插入\n3) 若基桶已满，但溢出桶有空，插入溢出桶\n   否则，指定溢出桶空间，插入\n\
    \n### [删除]\n\n在被删记录上作删除标记\n\n### [优点]\n\n- 文件记录不必排序\n- 便于插入、删除记录\n- 存取速度快\n- 节省存储空间\n\
    \n### [缺点]\n\n- 只能按关键字存取，询问方式限于简单询问\n- 多次插入、删除记录会造成文件结构不合理，需重组文件\n\n### [目的]\n\
    \n方便对次关键字的查询\n\n### [多关键字文件的概念]\n\n包含有多个次关键字索引的文件\n\n### [两种主要的组织方式]\n\n- 多重表文件\n\
    - 倒排文件\n\n## 12.6.1 多重表文件\n\n### [组织方式]\n\n主文件(主关键字有序顺序文件，含有一个或多个次关键字链表)\n+主关键字非稠密索引+一个或多个次关键字索引表\n\
    \n### [例]\n\n次关键字 头指针 链长\n\n物理记录号 学号 姓名 成绩 性别 主关键字 头指针\n\n100 01 78 男 101\n100\
