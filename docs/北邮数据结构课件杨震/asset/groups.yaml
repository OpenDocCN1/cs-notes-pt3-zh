    # 9.3 交换排序


    # 起泡排序(冒泡排序)


    # [算法思想]


    将两个相邻记录的关键字进行比较，若为逆序则交换两者位置，小者往上浮，大者往下沉。


    # [算法步骤]


    记录1和2、2和3、……、(n-1)和n的关键字比较(交换);


    记录1和2、2和3、……、(n-2)和(n-1)的关键字比较(交换);


    ……


    直到某一趟不出现交换操作为止。'
