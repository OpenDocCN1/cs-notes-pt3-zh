    \n- (1) 直接插入排序\n- (2) 希尔排序(d[1]=5, d[2]=3, d[3]=1)\n- (3) 快速排序(第一个记录为基准记录)\n-\
    \ (4) 堆排序\n- (5) 归并排序\n- (6) 基数排序\n\n## 第十章 外部排序\n\n## [外部排序的应用对象]\n\n保存在外存储器上的信息量很大的数据记录文件。\n\
    \n## [外排序与内排序的差别]\n\n内部排序充分利用内存可以随机存取的特点，如\n\n- 希尔排序中，相隔dᵢ的记录关键字可作比较；\n- 堆排序中，完全二叉树中的父R[i]与子R[2i]、R[2i+1]可比；\n\
    - 快速排序中，需正向和逆向访问记录序列\n\n外存信息的定位和存取受其物理特性的限制\n\n## [外部排序的实现手段]\n\n在排序过程中，进行多次内外存之间的数据交换\n\
    \n## 外部信息的存取\n\n## 1 磁带信息的存取\n\n属于顺序存取设备，只适用于存储顺序文件\n\n[工作原理]\n\n磁带不是连续运转设备，而是启停设备\n\
    \nI/O操作以块为单位\n\n|  | 块1 | 块2 | 块3 | ...... |\n|---|---|---|---|---|\n| IBG(块间隙)\
    \ |  |  |  |  |\n\n1K~8KB/块\n\n读写一块信息的时间 T_IO = t_a + n t_w\n\nt_a： 用于磁头定位在物理块起始位置的时间\n\
    \nt_w： 传输一个字符的时间\n\n磁带机走向\n\n原始盘\n\n读出头\n\n写入头\n\n接收盘\n\n记录 1\n\n记录 2\n\n记录 3\n\
    \n![](img/808bb2589300c03793be19c880a932f9_555_0.png)\n\n## 2 磁盘信息的存取\n\n属于直接存取设备，适用于各类存储形式的文件\n\
    \n## [工作原理]\n\n磁盘可以是单片的，或有若干个盘片组成盘组\n\n- 磁道：盘片上的同心圆\n- 柱面：各盘面上半径相同的磁道合在一起\n- 扇区：每个磁道等分为若干扇区(块)\n\
    \n读取信息的过程：\n\n- 柱面号 移动磁头\n- 盘面号(磁道号) 选定所用磁头\n- 扇区/块号 磁盘一直高速旋转，磁头等待开始位置\n\n读写一块信息的时间\
    \ T_IO = t_seek + t_la + n t_w\n\n- t_seek：磁头定位到磁道的时间()\n- t_la：等待时间\n\n![](img/808bb2589300c03793be19c880a932f9_556_0.png)\n\
    \n## 外部排序的基本方法—归并排序法\n\n## [步骤]\n\n- 1) 生成若干初始归并串/顺序(文件预处理)\n\n把含有n个记录的文件，按内存缓冲区大小分成若干长度为L的子文件/段；\n\
    \n分别调入内存用有效的内排序方法排序后送回外存；\n\n- 2) 多路合并\n\n对初始归并串逐趟合并，直至最后在外存上得到整个有序文件为止\n\n##\
    \ [例]某文件共10000个记录，设每个物理块可以容纳200个记录，内存缓冲区可以容纳5个物理块\n\n- 1) 经过10次内排序后得到10个初始归并段R1~R10\n\
    - 2) 采用两路归并，需四趟可以得到排好序的文件\n\nR1 R2 R3 R4 R5 R6 R7 R8 R9 R10\n2000 2000 2000 2000\
    \ 2000 2000\n4000 4000\n8000\n10000\n\n外排序总时间：\n内排序：10tIS\n\nI/O操作：100tIO(排序)+(100+80+80+100)tIO(归并)=460tIO\n\
    \n内部归并：(10000+8000+8000+10000)tmg=46000 tmg\n\n## 提高外排序效率的途径\n\n减少合并趟数s，以减少I/O次数\n\
    \ns = ⌈log_k m⌉\n\n- 扩大初始归并段长度，从而减少初始归并段个数m\n- 进行多路(k路)归并\n\n## 多路(k路)平衡归并\n\n\
    ## [通过简单比较进行归并存在的问题]\n\n设记录总数为n，初始归并段的个数为m，\n\n从k个记录中选择一个关键字最小的记录时的比较次数为c\n\n\
    则s趟内部归并总的比较次数为：\n\nC=s×c(n-1)=⌈logₖm⌉×c×(n-1)=⌈log₂m/ log₂k⌉×c×(n-1)\n\n矛盾\n\n\
    - k↑， s↓， 可减少I/O次数；\n- k↑， c=(k-1)↑， 归并效率↓\n\n![](img/808bb2589300c03793be19c880a932f9_561_0.png)\n\
    \n## [解决矛盾的方法]\n\n——利用“败者树”选关键字最小的记录\n\n此时c= log₂k\n\n则 C=⌈log₂m⌉(n-1)， 与k无关\n\
    \n## [胜者树(树形选择排序)的缺陷]\n\n7路合并胜者树\n\n重构后的胜者树\n\n重构胜者树时，从根结点至新补入记录的叶结点的路径上的所有结点都必须更新。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_562_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_562_1.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_563_0.png)\n\n败者树的特点：记录败者，胜者参加下一轮比赛\n\
    \n败者树的优点：重构时修改结点较少。\n\n## [数据结构] (依据：败者树为完全二叉树)\n\n- 主： b[0.. k]\n  b[0.. k-1]——k个叶结点□，存放k个输入归并段中当前参加归并的记录\n\
    \  b[k]——虚拟记录，该关键字取可能最小值minkey\n\n- 辅： ls[0.. k-1]——不含叶结点的败者树\n  存放最后胜出的编号（ls[0]）以及所记录的败者编号\n\
    \n## [处理步骤]\n\n- 1) 建败者树 ls[0.. k-1]\n- 2) 重复直至k路归并完毕\n  2.1) 将 b[ls[0]] 写至输出归并段\n\
    \  2.2) 补充记录(某归并段变空时,补∞), 调整败者树\n\n## 以在b[4]补充15为例\n\n![](img/808bb2589300c03793be19c880a932f9_565_0.png)\n\
    \n调整败者树的方法: 将新补充的结点与其双亲结点比较, 败者留在该双亲结点,胜者继续向上直至树根的双亲\n\n## 调整b[0]\n\n![](img/808bb2589300c03793be19c880a932f9_566_0.png)\n\
    \n建败者树的过程\n\n## [k-路归并对内存的要求]\n\n至少要有k个输入缓冲区和一个输出缓冲区\n\n## 败者树的程序实现\n\n```\ntypedef\
    \ int LoserTree[k];\n\ntypedef struct { KeyType key;\n                 } Exnode,\
    \ External[k+1];\n```\n\n```\nVoid K_Merge ( LoserTree &ls,  External & b)\n{\n\
    \  for ( i = 0; i < k; ++i) input(b[i].key);\n\n  CreateLoserTree(s);\n\n  { while\
    \ ( b[ls[0]].key != MAXKEY)\n      { q = ls[0]; output(q); input(b[q].key); Adjust(\
    \ ls, q ); }\n      output( ls[0]);\n  }\n} // K_Merge\n```\n\n"
