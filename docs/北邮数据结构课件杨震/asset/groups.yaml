    # 2.1 线性表定义


    形式定义：由n (n≥0) 个数据元素组成的 有序序列。

    Linear_list = (D, S)

    其中： D={a_i | a_i ∈ D_0 , i=0,1,..., n-1    n ≥0}

    R={N} N={<a_{i-1}, a_i>| a_{i-1}, a_i ∈ D_0 , i=1,2,..., n-1 }

    D_0 为某个数据对象

    或者简记为： (a_0, a_1, ..., a_i, ... a_{n-1} ) n≥0

    （n为表长。当n=0，称为 空表）


    # 线性表的特点：在数据元素的非空有限集中


    +   数据元素间是线性关系，数据元素在表中的位置只取决于其序号


    +   存在唯一的一个被称作“第一个”的数据元素和唯一的一个被称作“最后一个”的数据元素


    +   除第一个外，每个数据元素均只有一个前驱；除最后一个外，每个数据元素均只有一个后继'
