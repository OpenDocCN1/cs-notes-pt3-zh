  - '[PAGE 510]


    # 快速排序(分划交换排序/分治法)


    # [分治算法原理]


    +   1) 分解： 将原问题分解为若干子问题

    +   2) 求解： 递归地解各子问题，若子问题的规模足够小，则直接求解

    +   3) 组合： 将各子问题的解组合成原问题的解


    # [快速排序算法思想]


    指定枢轴/支点/基准记录r[p](通常为第一个记录)，通过一趟排序将其放在正确的位置上，它把待排记录分割为独立的两部分，使得


    左边记录的关键字 ≤ r[p].key ≤ 右边记录的关键字


    对左右两部分记录序列重复上述过程，依次类推，直到子序列中只剩下一个记录或不含记录为止。(可以用递归方法实现)'
