    +   - 扇区/块号 磁盘一直高速旋转，磁头等待开始位置


    读写一块信息的时间 T_IO = t_seek + t_la + n t_w


    +   - t_seek：磁头定位到磁道的时间()

    +   - t_la：等待时间


