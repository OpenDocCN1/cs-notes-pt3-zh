  - '[PAGE 497]


    # [哨兵/监视哨的作用]


    简化边界条件的测试，提高算法时间效率。


    # [性能分析]


    +   - 最好情况(原始数据按正序即非递减序列)

    +     Cₘᵢₙ=n-1    Mₘᵢₙ=2(n-1)

    +   - 最坏情况(原始数据按逆序即非递增序列)

    +     Cₘₐₓ=(n+2)(n-1)/2    Mₘₐₓ=(n+4)(n-1)/2

    +   - 随机情况

    +     Cₐᵥg=(Cₘᵢₙ + Cₘₐₓ)/2≈n²/4    Mₐᵥg≈n²/4

    +   - 时间复杂度O(n²)

    +     辅助空间复杂度O(1)'
