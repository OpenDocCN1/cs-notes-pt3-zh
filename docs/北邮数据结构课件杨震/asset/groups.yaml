    # 一般用法的顺序存储结构之缺陷


    出队列操作后大量移动数据或存在“假上溢”现象：即存在空闲空间但无法入队。


    # 解决方法


    +   - 平移元素法，当发生假溢出时，就把整个队列的元素平移到存储区的首部，然后再插入新元素。这种方法需移动大量的元素，因而效率是很低的。

    +   - 循环队列


