  - '[PAGE 33]


    # 定义3：无穷大的阶 Θ


    若满足：


    t(n)= O(f(n)) 且 t(n)= Ω(f(n))


    则，称 t(n)趋于无穷大的阶 = f(n)趋于无穷大的阶，记为：


    t(n)= Θ(f(n))


    结论：由 Θ 确定的关系为等价关系。

    举例

    若 f(n) 分别为 n, 3n, n+logn,

    则 Θ(n)=Θ(3n)=Θ(n+logn)'
