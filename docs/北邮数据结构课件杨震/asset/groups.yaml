    # 8.6 二叉排序树BST(二叉查找/搜索树)


    # [定义]


    二叉排序树或者是空树，或者是满足如下性质的二叉树：


    +   1) 若其左子树非空，则左子树上所有节点的值均小于根节点的值；

    +   2) 若其右子树非空，则右子树上所有节点的值均大于等于根节点的值；

    +   3) 其左右子树本身又各是一棵二叉排序树


    # [性质]


    中序遍历一棵二叉排序树，将得到一个以关键字递增排列的有序序列


    ![](img/808bb2589300c03793be19c880a932f9_435_0.png)


    判别给定二叉树是否为二叉排序树的算法如何实现？？（用二叉链表存储）'
  - "[PAGE 436]\n\n方法1：根据二叉排序树中序遍历所得结点值为增序的性质，在遍历中将当前遍历结点与其前驱结点值比较，即可得出结论。\n\n```\n\
    void JudgeBST(BTree t,int flag)\n{ //全局指针pre，初值为NULL；调用时变量flag=TRUE\n    if (t!=NULL\
    \ && flag)\n    {\n        JudgeBST(t->lc,flag);  // 中序遍历左子树\n        if(pre==NULL)\n\
    \            pre=t;  // 中序的第一个结点不判断\n        else if(pre->data<t->data)\n    \
    \        pre=t;  // 前驱指针指向当前结点\n        else\n            flag=FLASE;    //不是完全二叉树\n\
    \        JudgeBST(t->rc,flag);  // 中序遍历右子树\n    }\n}\n```"
  - "[PAGE 437]\n\n方法2：照定义，二叉排序树的左右子树都是二叉排序树，根结点的值大于左子树中所有值而小于右子树中所有值，即根结点大于左子树的最大值而小于右子树的最小值。\n\
    \n```\nbool  JudgeBST(BTree t)\n{\n    if(t==NULL) return TRUE;\n    if (JudgeBST(t->lc)\
    \ && JudgeBST(t->rc))\n    {\n        m=max(t->llink);\n        n=min(t->rlink);\
    \  //左子树中最大值和右子树中最小值\n        return (t->data>m && t->data<n);\n    }\n    else\
    \ return FALSE;  //不是\n}\n```\n\n```\nint  max(BTree p)//求左子树的最大值\n{\n    if (p==NULL)\
    \ return  -maxint;       //返回机器最小整数\n    else{\n        while(p->rc!=null) p=p->rc;\n\
    \        return  p->data;  }\n}\n```\n\n```\nint  min(BTree p)//求右子树最小值\n{\n \
    \   if (p==NULL) return  maxint;\n    else{\n        while(p->lc!=NULL) p=p->lc;\n\
    \        return  p->data;  }\n}\n```"
