  - "[PAGE 358]\n\n# 强连通分量的求法：\n\n+   1. 对有向图 G 进行深度优先搜索，按回溯次序给结点进行编号。最先出现回溯的结点的编号为\
    \ 1，其它结点的编号按回溯次序逐次增大 1。\n+   \n+   2. 将有向图 G 的所有的有向边进行倒置，构造新的有向图记为 Gr。\n+   \n\
    +   3. 根据步骤 1 对结点进行的编号，选取最大编号的结点。从该结点出发，在有向图 Gr 上进行深度优先遍历。如果没有访问到所有的结点，则从剩余的那些结点中选取编号最大的结点再进行深度优先遍历。直至所有的结点都被访问到为止。\n\
    +   \n+   4. 在最后得到的生成森林中的每一棵生成树，都是有向图 G 的强连通分量顶点集。\n\n```\n在主程序中置：count = 0\n\n\
    DFS（vertex v）；\n{\n  1、mark[v] = visited\n  2、for（v 的邻接表中的每一个邻接结点 w）\n  3、{ if（mark[w]\
    \ == unvisited）；\n  4、  DFS（w）；}\n  5、count++；\n  6、finished[v] = v;\n}\n```"
