    \ |\n| D=(a, D)=(a, (a, (a, ...))) | 2 | ∞ | a | (D) |\n\n表的长度  表中的元素（第一层）个数。\n\
    \n表的深度  表中元素的最深嵌套层数。\n\n表头  表中的第一个元素。\n\n表尾  除第一个元素外，剩余元素构成的广义表。\n\n任何一个非空广义表\
    \ LS = ( α1, α2, ..., αn ) 均可分解为\n表头 Head(LS) = α1 和\n表尾 Tail(LS) = ( α2, ...,\
    \ αn ) 两部分。\n\n例如： D = ( E, F ) = ( (a, (b, c)), F )\nHead( D ) = E      Tail(\
    \ D ) = ( F )\n\nHead( E ) = a      Tail( E ) = ( ( b, c ) )\n\nHead( ( ( b, c\
    \ ) ) ) = ( b, c )  Tail( ( ( b, c ) ) ) = ( )\n\nHead( ( b, c ) ) = b      Tail(\
    \ ( b, c ) ) = ( c )\n\nHead( ( c ) ) = c      Tail( ( c ) ) = ( )\n\n## 广义表的图形表达方法\n\
    \nA=(a,b)\n\nB=(A,c)\n\nD=(a,D)\n\nL=(A,B)\n\n○ 表\n□ 原子\n\n![](img/808bb2589300c03793be19c880a932f9_215_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_215_1.png)\n\n![](img/808bb2589300c03793be19c880a932f9_215_2.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_215_3.png)\n\n## 规定所有表都有名字时，广义表的表示方法\n\
    \n例 A(a,b)\nB(A(a,b), c)\nL(A(a,b), B(A(a,b),c))\nD(a, D(a, D(...)))\n\n递归表的深度是无穷值，长度是有限值。\n\
    \n## 广义表结构的分类\n\n- 纯表：与树型结构对应的广义表。\n- 再入表：允许结点共享的广义表。\n- 递归表：允许递归的广义表。\n\n递归表⊃再入表⊃纯表⊃线性表\n\
