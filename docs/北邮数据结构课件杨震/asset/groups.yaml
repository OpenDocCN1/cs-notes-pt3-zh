    # 12.3.1 索引文件的组织方式


    主文件 + 索引表(按主关键字有序)


    索引项的结构：关键字 物理块号


    +   索引文件只能是磁盘文件


    +   索引顺序文件：主文件中的记录按主关键字有序


    +   索引非顺序文件：主文件中的记录按主关键字无序


    +   稠密索引：主要用于索引非顺序文件

    +   主文件中的每个记录对应一个索引项


