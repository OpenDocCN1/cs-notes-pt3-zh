    # 12.2 顺序文件


    # 12.2.1 顺序文件的组织方式和特点


    # [组织方式]


    记录在物理结构中的排列顺序与逻辑顺序一致。


    +   - 连续文件： 连续相继的两个物理记录的存储位置是相邻的

    +   - 串联文件： 物理记录之间次序由指针相链表示


    # [特点]


    根据记录的序号或记录的相对位置进行存取。顺序存取时效率较高。'
  - '[PAGE 609]


    # [查找]


    +   - 顺序存取存储器(磁带)上的顺序文件

    +     - 顺序查找

    +       为提高效率，适合于批量检索。


    +   - 直接存取存储器(磁盘)上的顺序文件

    +     - 顺序查找

    +     - 折半查找

    +       适合于较小的有序定长记录文件的检索。查找很大的文件时(多个柱面)，磁头频繁移动，降低时效。

    +     - 分块查找

    +       先确定待查关键字所在的块，进而在该块中顺序扫描。'
