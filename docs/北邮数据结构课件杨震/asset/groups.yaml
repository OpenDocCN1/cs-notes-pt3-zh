    \ [组织方式]\n\n主文件 (主关键字有序顺序文件，含有一个或多个次关键字链表) +主关键字非稠密索引+一个或多个次关键字倒排表(索引表)\n\n次关键字\
    \ 物理地址(或主关键字)序列\n\n### [例]\n\n物理记录号 学号 姓名 成绩 性别\n\n| 物理记录号 | 学号 | 成绩 | 性别 |\n\
    | 100 | 01 | 78 | 男 |\n| 101 | 02 | 86 | 男 |\n| 102 | 03 | 89 | 女 |\n| 103 | 04\
    \ | 72 | 男 |\n| 104 | 05 | 65 | 女 |\n| 105 | 06 | 94 | 女 |\n| 106 | 07 | 83 |\
    \ 男 |\n\n成绩倒排表\n\n|  | 60 | 104 |\n|  | 70 | 100, 103 |\n|  | 80 | 101, 102, 106\
    \ |\n|  | 90 | 105 |\n\n性别倒排表\n\n| 男 | 100, 101, 103 |\n| 女 | 102, 104, 105 |\n\
    \n"
