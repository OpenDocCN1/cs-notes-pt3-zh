    # [删除]（思路同插入）


    +   将删除结点q转化为q最多有一个孩子情形，即若q有两个孩子，则以其中序前驱/后继结点r取代它，删除r；


    +   若树的平衡性被破坏，利用单一/双重旋转恢复。


    # [性能]


    定理：一个具有n个结点的平衡二叉树形，其高度h为


    log₂(n+1) ≤ h ≤ 1.4404log₂(n+2)-0.328


    结论：最坏情况下，AVL树的高度约为1.44log₂n，而完全平衡的二叉树高度约为log₂n，因此AVL树是接近最优的，其平均查找长度与log₂n同数量级。'
