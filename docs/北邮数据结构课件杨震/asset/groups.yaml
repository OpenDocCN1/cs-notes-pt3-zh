    \ 4\n105 06 94 女 ^ 70 103 2 女\n\n03\n06\n\n09\n成绩\n60\n性別\n男\n\n### [操作]\n\n###\
    \ 1）查找\n\n- 根据次关键字的索引，得到次关键字表头指针\n- 若多个次关键字的布尔“与”，应选较短的链表进行查找\n\n### 2）插入\n\n\
