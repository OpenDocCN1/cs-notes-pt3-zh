    \n建堆的时间耗费：设树根处于第 1 层，该堆共有 h=⌊log₂n⌋+1 层。建堆从第 h-1 层开始进行。只要知道了每一层的结点数（建的小堆的个数），和每建一个小堆所需的比较次数，就可以求得建堆的时间耗费。\n\
    \n建的小堆的性质：第 i 层上小堆的个数 = 第 i 层上结点的个数 = 最多 2^{i-1}\n\n第 i 层上小堆的高度 = h-i+1\n\n建第\
