    # [B+树]


    B+树是一种B-树的变形树。应用于索引顺序文件系统。


    # 1. m阶B+树与 B-树的不同之处


    +   1) 有 n 棵子树的节点中有 n 个关键字；


    +   2) 非叶节点可以看成是索引部分 索引集

    +      Aᵢ： 第i个子节点的指针

    +      Kᵢ： 第i个子节点的最大（或最小）关键字


    +   3) 所有叶子节点中包含了全部关键字的信息及指向这些关键字记录的指针，且叶子节点以关键字大小自小至大顺序链接； 数据集'
  - '[PAGE 470]


    # [节点结构]


    +   - 非叶节点（A₁, K₁, …, Aᵢ, Kᵢ, …, Aₙ, Kₙ）索引集

    +     Aᵢ： 第i个子结点的指针

    +     Kᵢ： 第i个子结点的最大（或最小）关键字


    +   - 叶节点

    +     全部关键字及指向关键字记录的指针 数据集


