    # 1.6 算法的基本概念


    # 算法的概念


    建立在数据结构基础上的、求解问题的一系列确切的步骤。


    # 一个算法必须满足以下五个重要特性


    +   - 有穷性：对任何合法输入执行有穷步后能结束。\n- 确定性：每条指令必须有确切的含义。\n- 可行性：算法的每一条指令均能执行。\n- 输入：有零个或多个输入。\n-
    输出：有一个或多个输出。'
