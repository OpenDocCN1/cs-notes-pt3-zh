  - "[PAGE 24]\n\n# 顺序搜索（Sequential Search）\n\n```\nint seqsearch ( int a[], const\
    \ int n,\n                 const int x )    //a[0],...,a[n-1]\n{\n    int i =\
    \ 0;\n    while ( i < n && a[i] != x )\n        i++;\n    if ( i == n ) return\
    \ -1;\n    return i;\n}\n```"
  - "[PAGE 25]\n\n# 插装\\(time()\\)的计时程序\n\n```\nvoid TimeSearch()\n{\n    //在1..1000中搜索0,10,...,90,100,200,...,1000\n\
    \    int a[1001], n[20];\n    for (int j=1; j<=1000; j++)\n        a[j] = j; \
    \       //a[1]=1, a[2]=2, …\n    for (j=0; j<10; j++) {\n        n[j] = 10*j;\
    \     //n[0]=0, n[1]=10, n[2]=20\n        n[j+10] = 100*(j+1);\n    }        \
    \            //n[10]=100, n[11]=200, n[12]=300 …\n    cout << \"n   time\" <<\
    \ endl;\n}\n```"
