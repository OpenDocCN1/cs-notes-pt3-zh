    # 3.B-树查找过程


    类似于二叉树的查找。如查找关键字为 KEY 的记录。


    +   - 从根开始查找，如果 Kᵢ = KEY 则查找成功。

    +   - 若 Kᵢ < KEY < Kᵢ₊₁; 查找 Aᵢ 指向的结点

    +   - 若 KEY < K₁; 查找 A₀ 指向的结点

