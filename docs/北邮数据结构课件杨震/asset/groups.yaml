    - 改写递归调用语句：入栈处理；\n  - 确定调用的参数值；\n  - 转至调用的开始语句\n- 改写所有递归出口：退栈还原参数；转至返回地址处\n\n\
    ```c\nvoid fact(int n, int & f)\n{\n    init_stack(s);\n    0: if (n==0) f=1;\n\
    \    { 1: top=top+1;\n        s[top].rd=2;\n        s[top].n=n;\n        s[top].f=f;\n\
    \        n=n-1; goto 0;\n        2: f = n*f }\n    if (top!=0)\n    {  s[top].f=f;\n\
    \        top=top-1;\n        n=s[top+1].n;\n        f=s[top+1].f;\n        goto\
    \ s[top+1].rd; }\n}\n```\n\n```c\nvoid fact(int n,int &f)\n{\n    init_stack(s);\n\
    \    while (n!=0)\n    {  top=top+1;\n        s[top].n=n;\n        n=n-1;}\n \
    \   f=1;\n    while (top!=0)\n    {  top=top-1;\n        n=s[top+1].n;\n     \
    \   f=n*f; }\n}\n```\n\n注：此时可确定栈中只存放n值即可。\n\n## 栈的应用2-整型数简单表达式求值\n\n[前提假设] 表达式语法正确；表达式结束符为‘#’\n\
    \n### [算法思想]\n\n- OPTR栈——寄存运算符　OPND栈——寄存操作数\n- 1) 放入起始符‘#’作为OPTR栈底元素\n- 2) 依次读入表达式字符，\n\
    \  - 操作数：进OPND栈；\n  - 运算符：与OPTR.top元素比较优先级后做相应操作；\n  - 直至读入‘#’且OPTR栈只剩‘#’\n- 3)\
    \ OPND栈底所留元素即为所求\n\n[例] 5+3*(7-2)+11#\n\n![](img/808bb2589300c03793be19c880a932f9_145_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_145_1.png)\n\n## 第三章（第二部分）队列\n\n###\
    \ 3.5 队列的定义\n\n队列是一种特殊的线性表，限定插入和删除操作分别在表的两端进行。具有先进先出(FIFO—First In First Out)的特点。\n\
    \n![](img/808bb2589300c03793be19c880a932f9_148_0.png)\n\n### 定义在队列结构上的基本运算\n\n\
    - (1) 构造空队列操作\n- (2) 判队空否函数\n- (3) 元素入队操作\n- (4) 元素出队函数\n- (5) 取队头元素函数\n- (6)\
    \ 队列置空操作\n- (7) 求队中元素个数函数\n\n### 队列的进队和出队\n\n![](img/808bb2589300c03793be19c880a932f9_150_0.png)\n\
    \n- 进队时队尾指针先进一 rear = rear + 1，再将新元素按 rear 指示位置加入。\n- 出队时队头指针先进一 front = front\
    \ + 1，再将 front 指示的元素取出。\n- 队满时再进队将溢出出错；队空时再出队将队空处理。\n\n> 思考：可否用两个栈实现一个队列？如何实现？\n\
    \n### 利用两个栈s1、s2（等容量）模拟一个队列，实现队列的插入，删除以及判队空运算\n\n- 栈的特点是后进先出，队列的特点是先进先出。初始时设栈s1和栈s2均为空。\n\
    - （1）用栈s1和s2模拟队列的输入：设s1和s2容量相等。分以下三种情况讨论：若s1未满，则元素入s1栈；若s1满，s2空，则将s1全部元素退栈，再压栈入s2，之后元素入s1栈；若s1满，s2不空（已有出队列元素），则不能入队。\n\
    - （2）用栈s1和s2模拟队列出队（删除）：若栈s2不空，退栈，即是队列的出队；若s2为空且s1不空，则将s1栈中全部元素退栈，并依次压入s2中，s2栈顶元素退栈，这就是相当于队列的出队。若栈s1为空并且s2也为空，队列空，不能出队。\n\
    - （3）判队空　若栈s1为空并且s2也为空，才是队列空。\n\n讨论：s1和s2容量之和是队列的最大容量。其操作是，s1栈满后，全部退栈并压栈入s2（设s1和s2容量相等）。再入栈s1直至s1满。这相当于队列元素“入队”完毕。出队时，s2退栈完毕后，s1栈中元素依次退栈到s2，s2退栈完毕，相当于队列中全部元素出队。\n\
    \n在栈s2不空情况下，若要求入队操作，只要s1不满，就可压入s1中。若s1满和s2不空状态下要求队列的入队时，按出错处理。\n\n### 用单循环链表定义的队列\n\
    \n类型定义：队尾指针\n\n![](img/808bb2589300c03793be19c880a932f9_153_0.png)\n\n### 一般用法的顺序存储结构之缺陷\n\
    \n出队列操作后大量移动数据或存在“假上溢”现象：即存在空闲空间但无法入队。\n\n### 解决方法\n\n- 平移元素法，当发生假溢出时，就把整个队列的元素平移到存储区的首部，然后再插入新元素。这种方法需移动大量的元素，因而效率是很低的。\n\
    - 循环队列\n\n![](img/808bb2589300c03793be19c880a932f9_154_0.png)\n\n### 循环队列的进队和出队实例\n\
    \n![](img/808bb2589300c03793be19c880a932f9_156_0.png)\n\n空队列\n\n![](img/808bb2589300c03793be19c880a932f9_156_1.png)\n\
    \nA 进队\n\n![](img/808bb2589300c03793be19c880a932f9_156_2.png)\n\nB C 进队\n\n![](img/808bb2589300c03793be19c880a932f9_156_3.png)\n\
    \nA 出队\n\n![](img/808bb2589300c03793be19c880a932f9_156_4.png)\n\nD E F G H 进队\n\
    \n存储队列的数组被当作首尾相接的表处理。为解决如何判断队列的满与空问题：牺牲一个存储单元。\n\n队头、队尾指针加1时从maxSize -1直接进到0，可用语言的取模(余数)运算实现。\n\
    \n出队： front = (front + 1) % maxSize;\n\n入队： rear = (rear + 1) % maxSize;\n\n队列初始化：\
    \ front = rear = 0;\n\n队空条件： front == rear;\n\n队满条件： (rear + 1) % maxSize == front\n\
    \n思考：循环队列中当前元素的个数为多少？\n\n当前元素个数n=(rear-front+maxSize)%maxSize\n\n"
