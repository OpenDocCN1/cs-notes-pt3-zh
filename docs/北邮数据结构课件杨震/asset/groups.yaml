  - '[PAGE 428]


    # 静态最优查找树


    **定义：** 查找性能最佳的判定树。


    **性质：** 带权内路径长度之和 PH 为最小值。


    $$PH=\sum_{i=1}^{n} w_i h_i$$，与 $ASL_s$ 成正比


    其中 n：二叉树上结点的个数（有序表长度）


    $h_i$：第 $i$ 个结点在二叉树上的层次数


    $w_i=cp_i$：$c$ 为某个常量；


    $p_i$：第 $i$ 个结点的查找概率


    # 最优查找树体现的原则：


    +   1. 最先访问的结点应是访问概率最大的结点；

    +   2. 每次访问应使结点两边尚未访问的结点的被访问概率之和尽可能相等。'
