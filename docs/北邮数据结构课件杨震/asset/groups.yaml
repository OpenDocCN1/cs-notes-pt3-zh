    断言：有向图 G 中的强连通分量中的顶点和深度优先搜索 Gr 时得到的生成森林中的生成树中的结点精确对应。


    证明要点：相互直达的 v、w；肯定在同一生成树之中。不管是 G 还是 Gr，假定在 Gr 中的根为 x。


    在 Gr 中，存在着由 x 至 v 的路径，那么在 G 中存在一条由 v 至 x 路径。在 G 中，由于 x 序号大，而 v 序号小；所有存在着一条 x 至
    v 的路径。x、v 直达。


    同理：在 Gr 中，存在着由 x 至 w 的路径，那么在 G 中存在一条由 w 至 x 路径。G 中，由于 x 序号大，而 w 序号小；所有存在着一条 x
    至 w 的路径。x、w 直达。


    所以，Gr 中的任意二点 v、w 之间，相互可以直达。


