  md: "\n## [栈的顺序存储结构]\n\n一个栈独占一组地址连续的存储单元\n\n[类型定义] 数组(栈空间)+栈顶指示\n\n栈空条件  S.top==-1\
    \    （此时退栈则下溢）\n\n栈满条件  S.top==max-1 (此时进栈则上溢)\n\n![](img/808bb2589300c03793be19c880a932f9_123_0.png)\n\
    \n## 进栈示例\n\ntop→ 空栈\n\ntop→ a 进栈\n\ntop→ b 进栈\n\ntop→ k 进栈\n\ntop→ l 进栈溢出\n\n\
    ...\n\n...\n\n![](img/808bb2589300c03793be19c880a932f9_125_0.png)\n\n## 退栈示例\n\
    \nk退栈\n\ne退栈\n\nd退栈\n\na退栈\n\n空栈\n\n有5 个元素，其入栈次序为：A，B，C，D，E，在各种可能的出栈次序中，以元素C，D最先出栈（即C第一个且D第二个出栈）的次序有哪几个？\n\
    \nCDEBA，CDBEA，CDBAE\n\n## 思考： n个元素依次入栈，可得到多少个合法的出栈序列\n\n(2n)!/[(n+1)!*n!]\n\n\
    不同的出栈序列实际上对应着不同的入栈出栈操作，以1记为入栈，0为出栈。则问题实际上是求n个1和n个0构成的全排列，其中任意一个位置，它及它此前的数中，1的个数要大于等于0的个数。\n\
    n个1和n个0构成的全排列数为：(2n)!/[n!*n!]\n\n在n个0和n个1构成的2n个数的序列中，假设第一次出现0的个数大于1个个数的（即0的个数比1的个数大一）的位置为k，则k为奇数，k之前有相等数目的0和1，各为(k-1)/2。若把这k个数，0换成1，1换成0，则原序列唯一对应上一个n+1个1和n-1个0的序列。反之，任意一个由n+1个1和n-1个0构成的序列也唯一地对应一个这样不合要求的序列。由于一一对应，故这样不合要求的序列数实际上等于有n+1个1和n-1个0构成的排列数，即(2n)!/(n+1)!(n-1)！。\n\
    \n因此合法的个数为：(2n)!/[n!*n!] - (2n)!/[(n+1)!(n-1)!]\n\n=(2n)!/[(n+1)!*n!]\n\n## [例]两个栈共享一组地址连续的存储单元\n\
    \n## [类型定义] 数组(栈空间) + 两个栈顶指示\n\n栈满条件： s.top[0]+1==s.top[1]\n\n栈空条件： s.top[0]==-1（栈0）\n\
    \ns.top[1]==m （栈1）\n\n![](img/808bb2589300c03793be19c880a932f9_128_0.png)\n\n\
    ## 多栈处理 栈浮动技术\n\nn栈共享一个数组空间 V[m]\n\n设立栈顶指针数组 t[n+1] 和栈底指针数组 b[n+1]\n\nt[i]和b[i]分别指示第i个栈的栈顶与栈底\n\
    \nb[n]作为控制量，指到数组最高下标\n\n各栈初始分配空间 s = ⌊m / n⌋\n\n指针初始值 t[0] = b[0] = -1，b[n] =\
    \ m-1\n\nt[i] = b[i] = b[i-1] + s，i = 1, 2, …, n-1\n\n## 插入新元素时的栈满处理 StackFull\
    \ ()\n\n![](img/808bb2589300c03793be19c880a932f9_130_0.png)\n\n```\ntemplate <class\
    \ Type>\nvoid Push( const int i, const Type & item ) {\n    if ( t[i] == b[i+1]\
    \ ) StackFull(i);\n    else V[++t[i]] = item;      //第i 个栈进栈\n}\n\ntemplate <class\
    \ Type> Type *Pop( const i ) {\n    if ( t[i] == b[i] )\n        { StackEmpty(i);\
    \ return 0; }\n    else return & V[t[i]--];    //第i 个栈出栈\n}\n```\n\n## 3.4.栈的应用\n\
    \n## 栈与递归过程\n\n## [递归的含义]\n\n函数、过程或者数据结构的内部又直接或者间接地由自身定义。\n\n## [适合于应用递归的场合]\n\
    \n- 规模较大的问题可以化解为规模较小的问题，且二者处理(或定义)的方式一致；\n- 当问题规模降低到一定程度时是可以直接求解的(终止条件)\n\n例1.\
    \ 阶乘 n! = { 1          n=0\n  n·(n-1)!   n>0 }\n\n## 例2. n阶Hanoi塔问题\n\n![](img/808bb2589300c03793be19c880a932f9_134_0.png)\n\
    \n## [写递归算法应注意的问题]\n\n- 递归算法本身不可以作为独立的程序运行，需在其它程序中设置调用初值，进行调用；\n- 递归算法应有出口(终止条件)\n\
    \n例1. 求n!\n\n```\nint Factorial(int n)\n{\n    if (n==0)\n        return(1);\n\
    \    return(n*Factorial(n-1));\n}\n```\n\n## 例2. Hanoi塔问题\n\n## PROCEDURE hanoi(\
    \ )\n\n```\nvoid Hanoi(int n, int x, int y, int z)\n{\n    if (n==1)\n       \
    \ Move (x, 1, z)  { 出口条件\n    else{\n        Hanoi (n-1, x, z, y);\n        Move\
    \ (x, n, z);\n        Hanoi (n-1, y, x, z);\n    }\n}\n```\n\n![](img/808bb2589300c03793be19c880a932f9_136_0.png)\n\
    \n```\nvoid hanoi(3,a,b,c){\n    if (3==1)\n        move(a,1,c);\n    else\n \
    \   {\n        hanoi(2,a,c,b);\n        move(a,3,c);\n        hanoi(2,b,a,c);\n\
    \    }\n}\n```\n\n```\nvoid hanoi(2,a,c,b){\n    if (2==1)\n        move(a,1,b);\n\
    \    else\n    {\n        hanoi(1,a,b,c);\n        move(a,2,b);\n        hanoi(1,c,a,b);\n\
    \    }\n}\n```\n\n```\nvoid hanoi(1,a,b,c){\n    if 1==1\n        move(a,1,c);\n\
    \    else {......}\n}\n```\n\n```\nvoid hanoi(1,c,a,b){\n    if (1==1)\n     \
    \   move(c,1,b);\n    else {......}\n}\n```\n\n```\nvoid hanoi(2,b,a,c) {\n  \
    \  if (2==1)\n        move(b,1,c);\n    else\n    {\n        hanoi(1,b,c,a);\n\
    \        move(b,2,c);\n        hanoi(1,a,b,c);\n    }\n}\n```\n\n```\nvoid hanoi(1,b,c,a)\
    \ {\n    if (1==1)\n        move(b,1,a);\n    else {......}\n}\n```\n\n```\nvoid\
    \ hanoi(1,a,b,c) {\n    if (1==1)\n        move(a,1,c);\n    else {......}\n}\n\
    ```\n\n![](img/808bb2589300c03793be19c880a932f9_137_0.png)\n\n## [递归算法的实现原理]\n\
    \n![](img/808bb2589300c03793be19c880a932f9_138_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_138_1.png)\n\
    \n- 利用栈，栈中每个元素称为工作记录，分成三个部分：\n- 返回地址 实在参数表(变参和值参) 局部变量\n- 发生调用时，保护现场，即当前的工作记录入栈，然后转入被调用的过程\n\
    - 一个调用结束时，恢复现场，即若栈不空，则退栈，从退出的返回地址处继续执行下去\n\n## 递归时系统工作原理示例\n\n```c\nint Factorial(int\
    \ n){\n        L1:      if (n==0)\n        L2:          return(1);\n        L3:\
    \      return(n*Factorial(n-1));\n        }\n```\n\n```c\nvoid main()\n{\n\n \
    \       ......\n\n        L0: N=Factorial(3);\n\n        ......\n\n}\n```\n\n\
    ![](img/808bb2589300c03793be19c880a932f9_139_0.png)\n\n返回地址  n  Factorial  N\n"
