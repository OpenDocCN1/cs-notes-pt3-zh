  - "[PAGE 182]\n\n```\n```c\nint index(char const *t, char const *p) //蛮力搜索\n{\n\
    \    int i=1; j=1; //假设字符数组的下标从1算起\n    int n=strlen(t); m=strlen(p);\n    while\
    \ ((i<=n) && (j<=m))\n    {\n        if (t[i]==p[j])\n        {\n            i=i+1;\n\
    \            j=j+1;\n        }\n        else\n        {\n            i=i-j+2;\n\
    \            j=1;\n        }\n    }\n    if (j==m+1)\n        return (i-m);\n\
    \    else\n        return(0);\n}\n```\n```\n\n> 最坏情况字符比较次数为：(n-m+1)*m\n> \n> 算法复杂度：O(m*n)\n\
    > \n> 原因在于每趟重新比较时，目标串的检测指针要回退。改进的模式匹配算法可使目标串的检测指针每趟不回退。"
