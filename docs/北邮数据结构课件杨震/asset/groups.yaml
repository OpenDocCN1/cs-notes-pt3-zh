  - '[PAGE 617]


    # 1) 查找 让主索引常驻内存


    +   1) 从主索引出发，确定相应的柱面索引

    +   2) 读入柱面索引，确定记录所在柱面的磁道索引地址

    +   3) 读入磁道索引，确定记录所在的磁道

    +   4) 在该磁道上查找

    +   从磁道索引项的溢出索引项中得到溢出链表的头指针查找


    # 2) 插入


    +   1) 利用查找确定记录应插入的柱面和磁道

    +   2) 该磁道不满，则插入该磁道的适当位置上，结束

    +   3) 该磁道已满，视插入记录的关键字

    +     - 插入磁道，调整溢出链表和磁道索引

    +     - 直接插入溢出链表，调整磁道索引'
  - '[PAGE 618]


    # 3）删除


    +   1) 查找待删除的记录

    +   2) 在基本区时，在其存储位置上作删除标记

    +      在溢出区时，可从链表中取消

    +      周期性地集中整理ISAM文件，以保证空间利用率和存取效率。


    # [ISAM小结]


    +   - ISAM文件是一种多叉树形的索引顺序文件

    +     - 叶节点存放数据记录，组成文件的数据区

    +     - 非叶节点组成文件的索引区

    +   - 文件在记录插入和删除时，索引结构不变，是静态索引结构

    +   - 主索引和柱面索引在每次检索时都需查找，宜放在文件所占的几个柱面的居中的柱面上，使磁头平均移动距离最小。'
