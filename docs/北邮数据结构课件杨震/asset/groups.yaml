    内查找 整个查找过程都在内存中进行。


    外查找 在查找过程中需要访问外存。


    # 平均查找长度ASL——查找方法时效的度量


    为确定记录在查找表中的位置，需将关键字和给定值比较次数的期望值。


    查找成功时的ASL计算方法：ASL = Σᵢ₌₁ⁿ pᵢ cᵢ


    +   n：记录的个数


    +   pᵢ：查找第i个记录的概率，（不特别声明时认为等概率 pᵢ =1/n）


    +   cᵢ：找到第i个记录所需的比较次数


