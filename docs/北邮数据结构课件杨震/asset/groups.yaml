    \ [4,5,25]\n- [2,3,12] [1,6,14] [1,2,16] [4,6,24] [4,5,25] [3,4,22] [3,6,18] [0,1,28]\n\
    - [1,6,14] [4,6,24] [1,2,16] [0,1,28] [4,5,25] [3,4,22] [3,6,18]\n- [1,2,16] [4,6,24]\
    \ [3,6,18] [0,1,28] [4,5,25] [3,4,22]\n- [3,6,18] [4,6,24] [3,4,22] [0,1,28] [4,5,25]\n\
    - [3,4,22] [4,6,24] [4,5,25] [0,1,28]\n- [4,6,24] [0,1,28] [4,5,25]\n- [4,5,25]\
    \ [0,1,28]\n- [0,1,28]\n\n```\nvoid Graph<string, float>::\nKruskal ( MinSpanTree\
    \ &T) {\n    MSTEdgeNode e;                    //边结点辅助单元\n    MinHeap<MstEdgeNode>\
    \ H(CurrentEdges);\n    int NumVertices = VerticesList.last;    //顶点个数\n    UFsets\
    \ F (NumVertices);             //并查集F 并初始化\n    for ( int u = 0; u < NumVertices;\
    \ u++ ) //邻接矩阵\n        for ( int v = u+1; v < NumVertices; v++ )\n        if\
    \ ( Edge[u][v] != MAXINT ) { //检出所有边\n            e.tail = u; e.head = v;\n  \
    \          e.cost = Edge[u][v]; H.Insert (e);      //插入最小堆\n        }\n}\n```\n\
    \n在建立最小堆时需要检测邻接矩阵，计算的时间代价为 O(n²)。且做了 e 次堆插入操作，每次插入调用了一个堆调整算法 SiftUp() 算法，因此堆插入需要的时间代价为\
    \ O(e log₂ e)。\n\n在构造最小生成树时，最多调用了 e 次出堆操作 RemoveMin()，2e 次并查集的 Find() 操作，n-1 次\
    \ Union() 操作，计算时间分别为 O(e log₂ e)，O(e log₂ n) 和 O(n)。\n\n总的计算时间为 O(e log₂ e + e\
    \ log₂ n + n)\n\n下面是求无向连通图最小生成树的一种方法。\n\n将图中所有边按权重从大到小排序为（e1,e2,...,em）\ni=1\n\
    WHILE (所剩边数 >=顶点数)\n{\n从图中删去ei;\n若图不再连通，则恢复ei;\ni=i+1;\n}\n\n试证明这个算法所得的图是原图的最小代价生成树。\n\
    \n证明：无向连通图的生成树包含图中全部n个顶点，以及足以使图连通的n-1条边。而最小生成树则是各边权值之和最小的生成树。从算法中WHILE（所剩边数>=顶点数）来看，循环到边数比顶点数少1（即n-1）停止，这符合n个顶点的连通图的生成树有n-1条边的定义；由于边是按权值从大到小排序，删去的边是权值大的边，结果的生成树必是最小生成树；算法中“若图不再连通，则恢复ei”，含义是必须保留使图连通的边，这就保证了是生成树，否则或者是含有回路，或者成了连通分量，均不再是生成树。\n\
    \n"
