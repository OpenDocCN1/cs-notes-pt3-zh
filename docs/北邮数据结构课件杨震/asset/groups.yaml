    \ T, int i, int j )\n{\n    while ( i != j )\n        if ( i > j )\n         \
    \   i = i / 2; // 下标为i的结点的双亲结点的下标\n        else\n            j = j / 2;   // 下标为j的结点的双亲结点的下标\n\
    \    return i;           //返回最近祖先结点的下标\n}\n```\n\n## [引入线索二叉树的意义]\n\n利用二叉链表的空指针域，建立指向该节点的前驱/后继(某种遍历方式下)节点的指针，方便二叉树的线性化使用。(n个节点的二叉树含有n+1空指针域)\n\
    \n## [线索二叉树的存储结构]\n\n| lc | ltag | data | rtag | rc |\n\n左特征位 ltag= { 0  lc域指示节点的左孩子\n\
    \ 1  lc域指示节点的前驱节点 }\n\n右特征位 rtag= { 0  rc域指示节点的右孩子\n 1  rc域指示节点的后继节点 }\n\n## [查找节点p->在指定次序下的前驱/后继结点]\n\
    \n中序线索二叉树\n\n- p的后继\n  若p->rtag=1，则p->rc即为所求；\n  若p->rtag=0，则从其右子沿着左链走到lTag=1的那个节点就是。\n\
    \n- p的前驱\n  若p->ltag=1，则p->lc即为所求；\n  若p->ltag=0，则从其左子沿着右链走到rtag=1的那个节点就是。\n\n\
    ![](img/808bb2589300c03793be19c880a932f9_267_0.png)\n\n## 【算法描述】\n\n```\nvoid\
    \ **inthread**(BiThrTree p)\n    if (p!=NULL)\n    {\n        inthread(p->lc);\n\
    \        if (p->lc ==NULL) { p->ltag=1; p->lc=pre};\n        if (pre !=NULL)\n\
    \            if (pre->rc==NULL)\n            {\n                pre->rtag=1;\n\
    \                pre->rc=p;\n            }\n        pre=p;\n        inthread(p->rc)\n\
    \    }\n```\n\n```\n{……\n    pre=NULL; {全局变量}\n    inthread(bt);\n    ……\n}\n\
    ```\n\n## 为使用方便，可以为线索二叉树建立头结点，构成双向线索链表（空线索指向该头结点）\n\n![](img/808bb2589300c03793be19c880a932f9_271_0.png)\n\
    \n中序序列：BCAED\n带头结点的中序线索二叉树\n\n## [线索二叉树的更新操作]\n\n## [问题]\n\n在线索二叉树上插入或删除一棵子树或者结点时，指针和线索都需作相应的改动。\n\
    \n## [解决方法]\n\n+   1) 还原为普通二叉树，再重新将其线索化。\n+   2) 讨论可能出现的各种情况，寻找规律。\n\n## [示例1]\n\
    \n在中序线索二叉树中，插入结点t，使其成为结点s的右孩子。\n\n+   ◆ s无右孩子\n+   s的后继成为t的后继；\n+   s成为t的前驱；\n\
    +   t成为s的右孩子\n\n![](img/808bb2589300c03793be19c880a932f9_272_0.png)\n\n"
