    # 3.5 队列的定义


    队列是一种特殊的线性表，限定插入和删除操作分别在表的两端进行。具有先进先出(FIFO—First In First Out)的特点。


    ![](img/808bb2589300c03793be19c880a932f9_148_0.png)'
