    # 7.3 图的遍历


    # 两种遍历方式


    +   - 深度优先遍历（树的先根遍历的推广）

    +   - 广度优先遍历（树的按层次遍历的推广）


    # 1. 深度优先遍历


    **注意：** 每个顶点只能被访问一次，因为一个顶点可以和其它的任何顶点相邻接，为了避免对一个顶点的重复访问，必须对访问过的顶点加以标记。顶点的邻接顶点的次序是任意的，因此深度优先搜索的序列可能有多种。


    # [遍历过程]


    +   - 1、选中第一个被访问的顶点。

    +   - 2、对顶点作已访问过的标志。

    +   - 3、依次从顶点的未被访问过、邻接顶点出发，进行深度优先遍历。转向2。

    +   - 4、如果还有顶点未被访问，则选中一个起始顶点，转向2。

    +   - 5、所有的顶点都被访问到，则结束。'
