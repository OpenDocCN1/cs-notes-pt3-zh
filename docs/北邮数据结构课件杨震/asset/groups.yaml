    \ 在求拓扑排序的过程中进行。\n\n辅助数据结构: ve(1..n) {n为顶点个数}\n\n- 1) 初值ve[j]=0 1≤j≤n\n- 2) 每输出一个无前驱的顶点j后，修正j的所有后继结点k的ve[k]:\
    \ ve[k]=max{ve[k], ve[j]+dut(<j,k>)}\n\n![](img/808bb2589300c03793be19c880a932f9_393_0.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_393_1.png)\n\n## 实例\n\nVe(1)=0\nVe(2)=1\n\
    Ve(3)=3\nVe(4)=5\nVe(5)=6\nVe(6)=8\n\n正向拓扑排序：\n\n![](img/808bb2589300c03793be19c880a932f9_394_0.png)\n\
