    \n## [堆排序需解决的两个问题]\n\n- 如何由一个无序序列建成一个小（大）根堆？\n- 如何在输出堆顶元素之后，调整剩余元素，使之成为一个新的堆？\n\
    \n# 1）调整堆的方法——筛选\n\n![](img/808bb2589300c03793be19c880a932f9_525_0.png)\n\n![](img/808bb2589300c03793be19c880a932f9_525_1.png)\n\
    \n![](img/808bb2589300c03793be19c880a932f9_525_2.png)\n\n# 2）将初始记录序列R[1..n]建成小(大)根堆\n\
    \n依次把以i=⌊n/2⌋，⌊n/2⌋-1，⌊n/2⌋-2，……，1为根的子树调整为小(大)根堆，则完成了整个建堆的过程。\n\n（49，38，65，97，76，13，27，50）\n\
