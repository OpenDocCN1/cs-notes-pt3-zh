    ## 图的相關術語


    顶点 数据元素所构成的结点。


    无向图 边的顶点偶对是无序的。


    (vᵢ, vⱼ)和(vⱼ, vᵢ)代表同一条边(i≠j)。


    有向图 边的顶点偶对是有序的。


    有向边 < vᵢ, vⱼ > 也称为弧。


    vᵢ是弧尾/初始点； vⱼ是弧头/终端点。


    (无向)完全图 每个顶点与其余顶点都有边的无向图。


    顶点数为n时，边数e=n(n-1)/2


    有向完全图 每个顶点与其余顶点都有弧的有向图。


    顶点数为n时，弧数e=n(n-1)


    思考：一无向图的顶点个数为n，则该图最多有（ n(n-1)/2 ）条边。


    稀疏图 有很少边或弧的图。


    稠密图 有较多边或弧的图。


    权 图中的边或弧具有一定的大小的概念。


    网 边/弧带权的图。


    邻接 有边/弧相连的两个顶点之间的关系。


    存在(vᵢ, vⱼ)，则称vᵢ和vⱼ互为邻接点；


    存在<vᵢ, vⱼ>，则称vᵢ邻接到vⱼ，vⱼ邻接于vᵢ


    关联(依附) 边/弧与顶点之间的关系。


    存在(vᵢ, vⱼ)/<vᵢ, vⱼ>，则称该边/弧关联于vᵢ和vⱼ


    子图 对于图G=(V,E)和G''=(V'',E'')，如果V''⊆V，E''⊆E，且E''关联的顶点都在V''中，则称G''是G的子图。


    生成子图 由图的全部顶点和部分边组成的子图称为原图的生成子图。


    ## 路径


    接续的边构成的顶点序列。


    ## 路径长度


    路径上边或弧的数目/权值之和。


    ## 回路(环)


    第一个顶点和最后一个顶点相同的路径。


    ## 简单路径


    除路径起点和终点可以相同外，其余顶点均不相同的路径。


    ## 简单回路(简单环)


    除路径起点和终点相同外，其余顶点均不相同的路径。


    ## 思考：


    n个顶点的无向完全图中,两个顶点之间简单路径数目为多少？


    ```

    1 + A(n-2,1) + A(n-2,2) + ... + A(n-2,n-2)

    其中A(m,n)是m取n的排列数。

    ```


