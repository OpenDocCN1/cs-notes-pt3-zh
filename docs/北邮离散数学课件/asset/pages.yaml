- pgno: 1454
  md: '# Connectedness


    +   - An undirected graph is *connected* iff there is a path between every pair
    of distinct vertices in the graph.

    +   - **Theorem:** There is a *simple* path between any pair of vertices in a
    connected undirected graph.

    +   - *Connected component*: connected subgraph

    +   - A *cut vertex* or *cut edge* separates 1 connected component into 2 if removed.'
