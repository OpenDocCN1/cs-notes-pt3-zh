  md: '# Equivalence Classes


    +   - Let $R$ be any equiv. rel. on a set $A$.

    +   - The *equivalence class* of $a$,

    +     $[a]_R := \{b \mid aRb\}$  (optional subscript $R$)

    +     - It is the set of all elements of $A$ that are “equivalent” to $a$ according
    to the eq.rel. $R$.

    +     - Each such $b$ (including $a$ itself) is called a *representative* of $[a]_R$.

    +   - Since $f(a)=[a]_R$ is a function of $a$, any equivalence relation $R$ can
    be defined using $aRb :=$ “$a$ and $b$ have the same $f$ value”, given $f$.'
