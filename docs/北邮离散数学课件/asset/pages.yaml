  md: '# Guidelines:

    Mathematical Induction Proofs


    # Template for Proofs by Mathematical Induction


    +   1. Express the statement that is to be proved in the form “for all n ≥ b,
    P(n)” for a fixed integer b.

    +   2. Write out the words “Basis Step.” Then show that P(b) is true, taking care
    that the correct value of b is used. This completes the first part of the proof.

    +   3. Write out the words “Inductive Step.”

    +   4. State, and clearly identify, the inductive hypothesis, in the form “assume
    that P(k) is true for an arbitrary fixed integer k ≥ b.”

    +   5. State what needs to be proved under the assumption that the inductive hypothesis
    is true. That is, write out what P(k + 1) says.

    +   6. Prove the statement P(k + 1) making use of the assumption P(k). Be sure
    that your proof is valid for all integers k with k ≥ b, taking care that the proof
    works for small values of k, including k = b.

    +   7. Clearly identify the conclusion of the inductive step, such as by saying
    “this completes the inductive step.”

    +   8. After completing the basis step and the inductive step, state the conclusion,
    namely that by mathematical induction, P(n) is true for all integers n with n
    ≥ b.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# Second Principle of Induction


    A.k.a. “Strong Induction”


    +   - Characterized by another inference rule:

    +     $P(0)$

    +     $P$ is true in *all* previous cases

    +     $\forall n\ge0: (\forall 0\le k\le n\ P(k)) \rightarrow P(n+1)$

    +     $\therefore \forall n\ge0: P(n)$


    +   - The only difference between this and the 1st principle is that:

    +     - the inductive step here makes use of the stronger hypothesis that $P(k)$
    is true for *all* smaller numbers $k<n+1$, not just for $k=n$.'
