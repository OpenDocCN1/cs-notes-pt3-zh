- pgno: 534
  md: '# § 5.3: Recursive Definitions


    +   - In induction, we *prove* all members of an infinite set satisfy some predicate
    *P* by:

    +     - proving the truth of the predicate for larger members in terms of that
    of smaller members.

    +   - In *recursive definitions*, we similarly *define* a function, a predicate,
    a set, or a more complex structure over an infinite domain (universe of discourse)
    by:

    +     - defining the function, predicate value, set membership, or structure of
    larger elements in terms of those of smaller ones.

    +   - In *structural induction*, we inductively prove properties of recursively-defined
    objects in a way that parallels the objects’ own recursive definitions.'
  merge: -1
  img_proc: true
- pgno: 535
  md: '# Recursion


    +   - *Recursion* is the general term for the practice of defining an object in
    terms of *itself*

    +     - or of part of itself

    +     - This may seem circular, but it isn’t necessarily.

    +   - An inductive proof establishes the truth of *P(n+1)* recursively in terms
    of *P(n)*.

    +   - There are also recursive *algorithms, definitions, functions, sequences,
    sets*, and other structures.'
