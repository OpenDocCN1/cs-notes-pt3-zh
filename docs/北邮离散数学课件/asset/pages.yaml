- pgno: 1593
  md: '# Finding the shortest path between any two vertices


    +   - Distance Matrix: Let G is a graph with n vertices. The distance matrix of
    G is D=(d_ij)_{n×n}

    +     - d_ij represent the the weights of the edge (v_i, v_j)

    +     - If there’s no edge between v_i and v_j then d_ij=∞

    +     - Let D²=D*D= (d_ij²)_{n×n}

    +     - d_ij²=min{d_i1+d_1j, d_i2+d_2j, …, d_in+d_nj}

    +       - d_ij² is the shortest length of the path from v_i to v_j with two edges.

    +     - As the same D^k=D^{k-1}*D= (d_ij^k)_{n×n}

    +       - d_ij^k is the shortest length of the path from v_i to v_j with k edges.'
  merge: -1
  img_proc: true
