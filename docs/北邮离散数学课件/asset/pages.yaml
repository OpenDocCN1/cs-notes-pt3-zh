    since I<sub>s</sub>*f = I<sub>s</sub> f = f I<sub>s</sub> = f * I<sub>s</sub>
    for any element f ∈ S<sup>s</sup> , we see that S<sup>s</sup> is a monoid.


    The semigroup A<sup>∗</sup> defined in Example 6 has the identity Λ , the empty
    sequence, since α• Λ = Λ •α = α for all α ∈ A<sup>∗</sup> .


    The set of all relations on set A is a monoid under the operation of composition.
