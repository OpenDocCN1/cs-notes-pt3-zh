- pgno: 2051
  md: '# Fermat’s “Last Theorem”


    +   - **Theorem:** $x^n+y^n=z^n$ has no solutions in integers $xyz \neq 0$ with
    integer $n>2$.

    +     - In the 1600s, Fermat famously claimed in a marginal note that he had a
    “wondrous proof” of the theorem.

    +       - But unfortunately, if he had one, he never published it!

    +     - The theorem remained a publicly unproven conjecture for the next ~400
    years!

    +     - Finally, a proof that requires hundreds of pages of advanced mathematics
    was found by Wiles at Princeton in 1990.

    +       - It took him 10 years of work to find it!

    +   - **Challenge:** Find a *short, simple* proof of Fermat’s last theorem, and
    you will become instantly famous!'
