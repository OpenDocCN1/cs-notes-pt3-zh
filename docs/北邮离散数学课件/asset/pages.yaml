- pgno: 1700
  md: '# Chromatic Polynomials


    +   - If $G$ is a graph and $n \ge 0$ is an integer, let $P_G(n)$ be the number
    of ways to color $G$ properly using $n$ or fewer colors.

    +   - $P_G$ is called the *chromatic polynomial*(着色多项式) of $G$.'
  merge: -1
  img_proc: true
- pgno: 1701
  md: '# Linear graph L4


    +   - Suppose we have x colors

    +   - P_{L_4} = x(x-1)^3

    +   - P_{L_4}(0) = 0

    +   - P_{L_4}(1) = 0

    +   - P_{L_4}(2) = 2

    +   - P_{L_4}(3) = 24

    +   - So, χ(L_4) = 2


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1701_0.png)'
  merge: -1
  img_proc: true
- pgno: 1702
  md: '# Complete graph $K_n$


    +   - Suppose we have $x$ colors, if $x<n$, no proper coloring is possible. So
    let $x\ge n$.

    +     - $P_{K_5}(x)=x(x-1)(x-2)\ldots(x-n+1)$

    +     - $P_{K_5}(5)=5!$

    +     - So, $\chi(K_5)=5$


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1702_0.png)


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1702_1.png)'
  merge: -1
  img_proc: true
- pgno: 1703
  md: '# Theorem 1


    +   - If $G$ is a disconnected graph with components $G_1$, $G_2$, . . . . $G_m$,
    then $P_G(x)$ is the product of the chromatic polynomials for each component

    +     $P_G(x) = P_{G_1}(x) P_{G_2}(x) \dots P_{G_m}(x)$'
  merge: -1
  img_proc: true
- pgno: 1704
  md: "# Theorem 2\n\n+   - Let G = (V, E, γ) be a graph with no multiple edges, and\
    \ let e ∈ E, say e = {a, b}.\n+   \n+     - G_e : subgraph of G obtained by deleting\
    \ e,\n+   \n+     - G^e : the quotient graph of G obtained by merging the end\
    \ points of e.\n\n+   - Then with x colors:\n+   \n+     P_G(x) = P_{G_e}(x) -\
    \ P_{G^e}(x)."
  merge: -1
  img_proc: true
- pgno: 1705
  md: '# Proof


    +   - Consider all the proper colorings of $G_e$

    +     - $a$ and $b$ have different colors

    +     - $a$ and $b$ have the same color

    +   - A coloring of the first type is also a proper coloring for $G$

    +     - since $a$ and $b$ are connected in $G$, and this coloring gives them different
    colors.'
  merge: -1
  img_proc: true
- pgno: 1706
  md: '# Proof


    +   - a and b have different colors

    +   - a and b have the same color

    +   - A coloring of $G_e$ of the second type corresponds to a proper coloring
    of $G^e$.

    +     - In fact, since $a$ and $b$ are combined in $G^e$, they must have the same
    color there. All other vertices of $G_e$ have the same connections as in $G$.
    Thus

    +     - $P_{Ge}(x) = P_G(x) + P_G^e(x)$

    +       - or

    +     - $P_G(x) = P_{Ge}(x) - P_G^e(x)$

    +   - Q.E.D'
  merge: -1
  img_proc: true
