- pgno: 2169
  md: '# Cardinality: Formal Definition


    +   - For any two (possibly infinite) sets *A* and *B*, we say that *A* and *B*
    have the same cardinality (written |A|=|B|) iff there exists a bijection (bijective
    function) from *A* to *B*.

    +   - When *A* and *B* are finite, it is easy to see that such a function exists
    iff *A* and *B* have the same number of elements *n*∈**N**.'
  merge: -1
  img_proc: true
- pgno: 2170
  md: '# Countable versus Uncountable


    +   - For any set $S$, if $S$ is finite or if $|S|=|\mathbf{N}|$, we say $S$ is
    *countable*. Else, $S$ is *uncountable*.

    +   - Intuition behind “**countable**:” we can *enumerate* (sequentially list)
    elements of $S$ in such a way that *any* individual element of $S$ will eventually
    be *counted* in the enumeration. Examples: $\mathbf{N}$, $\mathbf{Z}$.

    +   - **Uncountable** means: *No series of elements of $S$ (even an infinite series)
    can include all of $S$’s elements.* Examples: $\mathbf{R}$, $\mathbf{R}^2$, $\mathcal{P}(\mathbf{N})$'
  merge: -1
  img_proc: true
- pgno: 2171
  md: '# Countable Sets: Examples


    +   - **Theorem:** The set **Z** is countable.

    +     - **Proof:** Consider $f:\mathbf{Z}\to\mathbf{N}$ where $f(i)=2i$ for $i\ge0$
    and $f(i)=-2i-1$ for $i<0$. Note $f$ is bijective.


    +   - **Theorem:** The set of all ordered pairs of natural numbers $(n,m)$ is
    countable.

    +     - Consider listing the pairs in order by their sum $s=n+m$, then by $n$.
    Every pair appears once in this series; the generating function is bijective.'
  merge: -1
  img_proc: true
