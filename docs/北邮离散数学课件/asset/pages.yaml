- pgno: 916
  md: '# # Note


    The associative property holds in any subset of a semigroup so that a subsemigroup
    \( (T, *) \) of a semigroup \( (S, *) \) is itself a semigroup.


    Similarly, a submonoid of a monoid is itself a monoid.'
  merge: -1
