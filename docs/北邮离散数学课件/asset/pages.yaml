- pgno: 83
  md: '# Pseudoprimes


    +   - Given a positive integer $n$, such that $2^{n-1} \equiv 1 \pmod n$:

    +     - If $n$ does not satisfy the congruence, it is composite.

    +     - If $n$ does satisfy the congruence, it is either prime or a pseudoprime
    to the base 2.

    +   - Doing similar tests with additional bases $b$, provides more evidence as
    to whether $n$ is prime.

    +   - Among the positive integers not exceeding a positive real number $x$, compared
    to primes, there are relatively few pseudoprimes to the base $b$.

    +     - For example, among the positive integers less than $10^{10}$ there are
    455,052,512 primes, but only 14,884 pseudoprimes to the base 2.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Carmichael Numbers

    (optional)


    ![](img/c25dfd82fc242c2db53bc942dcad6885_84_0.png)


    Robert Carmichael

    (1879-1967)


    +   - There are composite integers n that pass all tests with bases b such that
    gcd(b,n) = 1.

    +   - Even though there are infinitely many Carmichael numbers, there are other
    tests (described in the exercises) that form the basis for efficient probabilistic
    primality testing. (see Chapter 7)


    Definition: A composite integer n that satisfies the congruence b^{n-1} ≡ 1 (mod
    n) for all positive integers b with gcd(b,n) = 1 is called a Carmichael number.


    Example: The integer 561 is a Carmichael number. To see this:


    +   - 561 is composite, since 561 = 3 · 11 · 13.

    +   - If gcd(b, 561) = 1, then gcd(b, 3) = 1, then gcd(b, 11) = gcd(b, 17) =1.

    +   - Using Fermat’s Little Theorem: b² ≡ 1 (mod 3), b¹⁰ ≡ 1 (mod 11), b¹⁶ ≡ 1
    (mod 17).

    +   - Then

    +     b⁵⁶⁰ = (b²)²⁸⁰ ≡ 1 (mod 3),

    +     b⁵⁶⁰ = (b¹⁰)⁵⁶ ≡ 1 (mod 11),

    +     b⁵⁶⁰ = (b¹⁶)³⁵ ≡ 1 (mod 17).

    +   - It follows (see Exercise 29) that b⁵⁶⁰ ≡ 1 (mod 561) for all positive integers
    b with gcd(b,561) = 1. Hence, 561 is a Carmichael number.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Primitive Roots


    **Definition**: A primitive root modulo a prime $p$ is an integer $r$ in $\mathbf{Z}_p$
    such that every nonzero element of $\mathbf{Z}_p$ is a power of $r$.


    **Example**: Since every element of $\mathbf{Z}_{11}$ is a power of 2, 2 is a
    primitive root of 11.


    Powers of 2 modulo 11: $2^1 = 2$, $2^2 = 4$, $2^3 = 8$, $2^4 = 5$, $2^5 = 10$,
    $2^6 = 9$, $2^7 = 7$, $2^8 = 3$, $2^{10} = 2$.


    **Example**: Since not all elements of $\mathbf{Z}_{11}$ are powers of 3, 3 is
    not a primitive root of 11.


    Powers of 3 modulo 11: $3^1 = 3$, $3^2 = 9$, $3^3 = 5$, $3^4 = 4$, $3^5 = 1$,
    and the pattern repeats for higher powers.


    **Important Fact**: There is a primitive root modulo $p$ for every prime number
    $p$.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Discrete Logarithms


    Suppose p is prime and r is a primitive root modulo p. If a is an integer between
    1 and p −1, that is an element of Z_p, there is a unique exponent e such that
    r^e = a in Z_p, that is, r^e mod p = a.


    Definition: Suppose that p is prime, r is a primitive root modulo p, and a is
    an integer between 1 and p −1, inclusive. If r^e mod p = a and 1 ≤ e ≤ p − 1,
    we say that e is the discrete logarithm of a modulo p to the base r and we write
    log_r a = e (where the prime p is understood).


    Example 1: We write log_2 3 = 8 since the discrete logarithm of 3 modulo 11 to
    the base 2 is 8 as 2^8 = 3 modulo 11.


    Example 2: We write log_2 5 = 4 since the discrete logarithm of 5 modulo 11 to
    the base 2 is 4 as 2^4 = 5 modulo 11.


    There is no known polynomial time algorithm for computing the discrete logarithm
    of a modulo p to the base r (when given the prime p, a root r modulo p, and a
    positive integer a ∈ Z_p). The problem plays a role in cryptography as will be
    discussed in Section'
