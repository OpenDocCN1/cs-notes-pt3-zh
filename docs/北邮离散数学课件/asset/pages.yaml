- pgno: 1267
  md: '# Principle of correspondence

    （对应性原理）


    +   - Suppose that $f$: $A \to A''$ is an isomorphism from a poset $(A, \leqslant)$
    to a poset $(A'', \leqslant'')$. Suppose also that $B$ is a subset of $A$, and
    $B'' = f(B)$ is the corresponding subset of $A''$. Then


    +   - If the elements of $B$ have any property relating to one another or to other
    elements of $A$, and if this property can be defined entirely in terms of the
    relation $\leq$, then the elements of $B''$ must possess exactly the same property,
    defined in terms of $\leq''$.


    +   - two finite isomorphic posets must have the same Hasse diagram.'
  merge: -1
  img_proc: true
