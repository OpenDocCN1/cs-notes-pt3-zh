- pgno: 959
  md: '# # Proof


    Define a relation \(\bar{f} = \{([a], f(a)) \mid [a] \in S/R\}\) from \(S/R\)
    to \(T\), then


    # ### \(\bar{f}\) is a function.


    Suppose that \([a] = [a'']\).

    \(a R a''\), so \(f(a) = f(a'')\), which implies that \(\bar{f}\) is a function.

    write \(\bar{f}: S/R \to T\), where \(\bar{f}([a]) = f(a)\) for \([a] \in S/R\).


    # ### \(\bar{f}\) is one to one.


    Suppose that \(\bar{f}([a]) = \bar{f}([a''])\).

    \(f(a) = f(a'')\), so \(a R a''\), which implies that \([a] = [a'']\).

    Hence \(\bar{f}\) is one to one.


    # ### \(\bar{f}\) is onto.


    Suppose that \(b \in T\).

    \(f(a) = b\) for some element \(a\) in \(S\), since \(f\) is onto,

    \(\bar{f}([a]) = f(a) = b\), so \(\bar{f}\) is onto.'
  merge: -1
  img_proc: true
