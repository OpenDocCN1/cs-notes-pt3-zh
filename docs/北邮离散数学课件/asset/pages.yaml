  md: '# Compute $f_2^*g_2$ algebraically


    $f_1=\begin{pmatrix}1&2&3\\1&2&3\end{pmatrix},\quad f_2=\begin{pmatrix}1&2&3\\2&3&1\end{pmatrix},\quad
    f_3=\begin{pmatrix}1&2&3\\3&1&2\end{pmatrix},\quad g_1=\begin{pmatrix}1&2&3\\1&3&2\end{pmatrix},\quad
    g_2=\begin{pmatrix}1&2&3\\3&2&1\end{pmatrix},\quad g_3=\begin{pmatrix}1&2&3\\2&1&3\end{pmatrix}$


    To compute $f_2^*g_2$ algebraically, we compute $f_2\; g_2$.


    $\begin{pmatrix}1&2&3\\2&3&1\end{pmatrix}\circ\begin{pmatrix}1&2&3\\3&2&1\end{pmatrix}=\begin{pmatrix}1&2&3\\1&3&2\end{pmatrix}=g_1$


    So $f_2^*g_2=g_1$.'
