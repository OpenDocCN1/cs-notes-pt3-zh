- pgno: 2210
  md: "# Linear Search Algorithm\n\n+   - The linear search algorithm locates an item\
    \ in a list by examining elements in the sequence one at a time, starting at the\
    \ beginning.\n+     - First compare x with a₁. If they are equal, return the position\
    \ 1.\n+     - If not, try a₂. If x = a₂, return the position 2.\n+     - Keep\
    \ going, and if no match is found when the entire list is scanned, return 0.\n\
    \n```\nprocedure linear search(x:integer,\n    a₁, a₂, ...,aₙ: distinct integers)\n\
    i := 1\nwhile (i ≤ n and x ≠ aᵢ)\n    i := i + 1\nif i ≤ n then location := i\n\
    else location := 0\nreturn location{location is the subscript of the term that\
    \ equals x, or is 0 if x is not found}\n```"
  merge: -1
  img_proc: true
- pgno: 2211
  md: '# Binary Search


    +   - Assume the input is a list of items in increasing order.

    +   - The algorithm begins by comparing the element to be found with the middle
    element.

    +     - If the middle element is lower, the search proceeds with the upper half
    of the list.

    +     - If it is not lower, the search proceeds with the lower half of the list
    (through the middle position).

    +   - Repeat this process until we have a list of size 1.

    +     - If the element we are looking for is equal to the element in the list,
    the position is returned.

    +     - Otherwise, 0 is returned to indicate that the element was not found.

    +   - In Section 3.3, we show that the binary search algorithm is much more efficient
    than linear search.'
  merge: -1
  img_proc: true
- pgno: 2212
  md: "# Binary Search\n\n+   - Here is a description of the binary search algorithm\
    \ in pseudocode.\n\n```\nprocedure binary search(x: integer, a₁,a₂,...,aₙ: increasing\
    \ integers)\ni := 1 {i is the left endpoint of interval}\nj := n {j is the right\
    \ endpoint of interval}\nwhile i < j\n    m := ⌊(i + j)/2⌋\n    if x > aₘ then\
    \ i := m + 1\n    else j := m\nif x = aᵢ then location := i\nelse location :=\
    \ 0\nreturn location {location is the subscript i of the term aᵢ equal to x,\n\
    \                 or 0 if x is not found}\n```"
  merge: -1
  img_proc: true
- pgno: 2213
  md: "# Binary Search\n\n**Example:** The steps taken by a binary search for 19 in\
    \ the list:\n\n1 2 3 5 6 7 8 10 12 13 15 16 18 19 20 22\n\n+   1. The list has\
    \ 16 elements, so the midpoint is 8. The value in the 8th position is 10. Since\
    \ 19 > 10, further search is restricted to positions 9 through 16.\n+   \n+  \
    \ 1 2 3 5 6 7 8 10 12 13 15 16 18 19 20 22\n\n+   2. The midpoint of the list\
    \ (positions 9 through 16) is now the 12th position with a value of 16. Since\
    \ 19 > 16, further search is restricted to the 13th position and above.\n+   \n\
    +   1 2 3 5 6 7 8 10 12 13 15 16 18 19 20 22\n\n+   3. The midpoint of the current\
    \ list is now the 14th position with a value of 19. Since 19 ≠ 19, further search\
    \ is restricted to the portion from the 13th through the 14th positions.\n+  \
    \ \n+   1 2 3 5 6 7 8 10 12 13 15 16 18 19 20 22\n\n+   4. The midpoint of the\
    \ current list is now the 13th position with a value of 18. Since 19 > 18, search\
    \ is restricted to the portion from the 18th position through the 18th.\n+   \n\
    +   1 2 3 5 6 7 8 10 12 13 15 16 18 19 20 22\n\n+   5. Now the list has a single\
    \ element and the loop ends. Since 19=19, the location 16 is returned."
  merge: -1
  img_proc: true
- pgno: 2214
  md: '# # Sorting


    To sort the elements of a list is to put them in increasing order (numerical order,
    alphabetic, and so on).


    Sorting is an important problem because:


    +   - A nontrivial percentage of all computing resources are devoted to sorting
    different kinds of lists, especially applications involving large databases of
    information that need to be presented in a particular order (e.g., by customer,
    part number etc.).

    +   - An amazing number of fundamentally different algorithms have been invented
    for sorting. Their relative advantages and disadvantages have been studied extensively.

    +   - Sorting algorithms are useful to illustrate the basic notions of computer
    science.


    A variety of sorting algorithms are studied in this book; binary, insertion, bubble,
    selection, merge, quick, and tournament.


    In Section 3.3, we''ll study the amount of time required to sort a list using
    the sorting algorithms covered in this section.'
  merge: -1
  img_proc: true
- pgno: 2215
  md: "# # Bubble Sort\n\n+   - Bubble sort makes multiple passes through a list.\
    \ Every pair of elements that are found to be out of order are interchanged.\n\
    \n```\nprocedure bubblesort(a1,...,an: real numbers with n ≥ 2)\n\nfor i := 1\
    \ to n-1\n\n  for j := 1 to n - i\n\n    if aj > aj+1 then interchange aj and\
    \ aj+1\n\n{a1,...,an is now in increasing order}\n```"
  merge: -1
  img_proc: true
