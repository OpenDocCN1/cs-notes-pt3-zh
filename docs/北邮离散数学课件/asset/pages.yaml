- pgno: 654
  md: '# Generating $r$-combinations


    +   - How do we list all $r$-combinations of the set $\{1, ..., n\}$?

    +   - Since the order of elements in a combination doesn’t matter, we can always
    list them from smallest to largest.

    +   - We can thus do it by enumerating the possible smallest items, then for each,
    enumerating the possible next-smallest items, etc.'
  merge: -1
  img_proc: true
