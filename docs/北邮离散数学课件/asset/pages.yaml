- pgno: 251
  md: '# Key Logical Equivalences


    +   - Identity Laws:

    +     $p \land T \equiv p$      $p \lor F \equiv p$

    +   - Domination Laws:

    +     $p \lor T \equiv T$      $p \land F \equiv F$

    +   - Idempotent laws:

    +     $p \lor p \equiv p$      $p \land p \equiv p$

    +   - Double Negation Law:

    +     $\lnot(\lnot p) \equiv p$

    +   - Negation Laws:

    +     $p \lor \lnot p \equiv T$      $p \land \lnot p \equiv F$'
  merge: -1
