- pgno: 517
  md: '实数是在有理数基础上定义的，有理数又是在整数的基础上定义的，而整数又是在自然数的基础上定义的，那么自然数如何定义呢？


    有两个集合 A 和 B，我们称它们为等价的，如果存在一个从 A 到 B 的映射 f，它是 1-1 的，又是满的。这时我们说 A 和 B 具有相同的势。我们首先承认空集
    φ 是存在的，考虑一个集合 {φ}，它不是空集，凡与 {φ} 等价的集合都有相同的势，我们把 {φ} 简写为 1。再考虑集合 {φ, {φ}}，它与 1 =
    {φ} 是不等价的，我们把它简写为 2。一般地如果有了 n 之后，可以定义它的跟随 {φ, n}，简写为 n+1。这样我们就得到了自然数 N = {1, 2,
    3, …, n, …}。


    在 N 上可以定义加法：n + m = n + 1 + 1 + ⋯ + 1，还可以证明加法满足结合律和交换律：n + (m + p) = (n + m) +
    p，n + m = m + n。这样我们就从空集出发，定义出自然数 N。


    这是一个最抽象的定义，比如说 2，它不指两个人，也不指二个物，而是指一个集合 {φ, {φ}}，这个集合有两个不同的元素 {φ} 和 φ。凡是与它等价的集合，都与它有相同的势，于是二个人，二个物……，都具有相同的势，按我们的理论，用
    {φ, {φ}} 作为它们的代表。'
  merge: -1
