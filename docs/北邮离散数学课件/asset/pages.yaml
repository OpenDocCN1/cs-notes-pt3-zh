- pgno: 2043
  md: '# A Constructive Existence Proof


    Example 7


    +   - **Theorem:** For any integer *n*>0, there exists a sequence of *n* consecutive
    composite integers.

    +   - Same statement in predicate logic:

    +     ∀*n*>0 ∃*x* ∀*i* (1≤*i*≤*n*)→(*x*+*i* is composite)

    +   - Proof follows on next slide...'
  merge: -1
  img_proc: true
- pgno: 2044
  md: '# The proof...


    +   - Given $n>0$, let $x = (n + 1)! + 1$.

    +   - Let $i \ge 1$ and $i \le n$, and consider $x+i$.

    +   - Note $x+i = (n + 1)! + (i + 1)$.

    +   - Note $(i+1)|(n+1)!$, since $2 \le i+1 \le n+1$.

    +   - Also $(i+1)|(i+1)$. So, $(i+1)|(x+i)$.

    +   - $\therefore$ $x+i$ is composite.

    +   - $\therefore$ $\forall n \exists x \forall 1\le i\le n : x+i$ is composite.
    Q.E.D.'
  merge: -1
  img_proc: true
- pgno: 2045
  md: '# Nonconstructive Existence Proof


    +   - **Theorem:** There are infinitely many prime numbers.

    +     - Any finite set of numbers must contain a maximal element, so we can prove
    the theorem if we can just show that there is no *largest* prime number.

    +     - *I.e.,* show that for any prime number, there is a larger number that
    is *also* prime.

    +     - More generally: For *any* number, ∃ a larger prime.

    +     - Formally: Show ∀n ∃p>n : p is prime.'
  merge: -1
  img_proc: true
- pgno: 2046
  md: '# The proof, using *proof by cases*...


    +   - Given $n>0$, prove there is a prime $p>n$.

    +   - Consider $x = n!+1$. Since $x>1$, we know that ($x$ is prime)$\vee$($x$
    is composite).

    +   - **Case 1:** Suppose $x$ is prime. Obviously $x>n$, so let $p=x$ and we’re
    done.

    +   - **Case 2:** $x$ has a prime factor $p$. But if $p\le n$, then $p \mod x
    = 1$. So $p>n$, and we’re done.'
  merge: -1
  img_proc: true
