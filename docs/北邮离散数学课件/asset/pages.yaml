- pgno: 2282
  md: "# # Computing the Closest Pair of Points by Brute-Force\n\n+   - Algorithm\
    \ for finding the closest pair in a set of n points.\n\n```\n```\nprocedure closest\
    \ pair((x₁,y₁), (x₂,y₂), …, (xₙ,yₙ): xᵢ, yᵢ real numbers)\nmin = ∞\nfor i := 1\
    \ to n\n  for j := 1 to i\n    if (xⱼ - xᵢ)² + (yⱼ - yᵢ)² < min\n    then min\
    \ := (xⱼ - xᵢ)² + (yⱼ - yᵢ)²\n    closest pair := (xᵢ, yᵢ), (xⱼ, yⱼ)\nreturn closest\
    \ pair\n```\n```\n\n+   - The algorithm loops through n(n−1)/2 pairs of points,\
    \ computes the value (xⱼ−xᵢ)²+(yⱼ−yᵢ)² and compares it with the minimum, etc.\
    \ So, the algorithm uses Θ(n²) arithmetic and comparison operations.\n\n+   -\
    \ We will develop an algorithm with O(log n) worst-case complexity in Section\
    \ 8.3."
