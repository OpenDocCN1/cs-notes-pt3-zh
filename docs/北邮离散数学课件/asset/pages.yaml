  md: '# Proof by Examples?


    +   - A universal statement can **never** be proven by using examples, **unless**
    the universe can be validly reduced to only finitely many examples, and your proof
    covers all of them!


    +   - **Theorem:** ¬∃x,y∈ℤ: x²+3y² = 8.

    +     - **Proof:** If |x|≥3 or |y|≥2 then x²+3y² > 8. This leaves x²∈{0,1,4} and
    3y²∈{0,3}. The largest pair sum to 4+3 = 7 < 8.


