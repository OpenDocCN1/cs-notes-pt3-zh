- pgno: 2265
  md: '# The Complexity of Algorithms


    +   - Given an algorithm, how efficient is this algorithm for solving a problem
    given input of a particular size? To answer this question, we ask:

    +     - How much time does this algorithm use to solve a problem?

    +     - How much computer memory does this algorithm use to solve a problem?

    +   - When we analyze the time the algorithm uses to solve the problem given input
    of a particular size, we are studying the *time complexity* of the algorithm.

    +   - When we analyze the computer memory the algorithm uses to solve the problem
    given input of a particular size, we are studying the *space complexity* of the
    algorithm.'
  merge: -1
  img_proc: true
- pgno: 2266
  md: '# The Complexity of Algorithms


    +   - In this course, we focus on time complexity. The space complexity of algorithms
    is studied in later courses.

    +   - We will measure time complexity in terms of the number of operations an
    algorithm uses and we will use big-O and big-Theta notation to estimate the time
    complexity.

    +   - We can use this analysis to see whether it is practical to use this algorithm
    to solve problems with input of a particular size. We can also compare the efficiency
    of different algorithms for solving the same problem.

    +   - We ignore implementation details (including the data structures used and
    both the hardware and software platforms) because it is extremely complicated
    to consider them.'
  merge: -1
  img_proc: true
- pgno: 2267
  md: '# Time Complexity


    +   - To analyze the time complexity of algorithms, we determine the number of
    operations, such as comparisons and arithmetic operations (addition, multiplication,
    etc.). We can estimate the time a computer may actually use to solve a problem
    using the amount of time required to do basic operations.

    +   - We ignore minor details, such as the “house keeping” aspects of the algorithm.

    +   - We will focus on the *worst-case time* complexity of an algorithm. This
    provides an upper bound on the number of operations an algorithm uses to solve
    a problem with input of a particular size.

    +   - It is usually much more difficult to determine the *average case time complexity*
    of an algorithm. This is the average number of operations an algorithm uses to
    solve a problem over all inputs of a particular size.'
  merge: -1
  img_proc: true
- pgno: 2268
  md: '# Complexity Analysis of Algorithms


    Example: Describe the time complexity of the algorithm for finding the maximum
    element in a finite sequence.


    ```

    procedure max(a1, a2, ..., an; integers)

    max := a1

    for i := 2 to n

    if max < ai then max := ai

    return max

    {max is the largest element}

    ```


    Solution: Count the number of comparisons.


    +   - The max < ai comparison is made n − 2 times.

    +   - Each time i is incremented, a test is made to see if i ≤ n.

    +   - One last comparison determines that i > n.

    +   - Exactly 2(n − 1) + 1 = 2n − 1 comparisons are made.


    Hence, the time complexity of the algorithm is Θ(n).'
  merge: -1
  img_proc: true
- pgno: 2269
  md: "# Worst-Case Complexity of Linear Search\n\n# Example: Determine the time complexity\
    \ of the linear search algorithm.\n\n```\nprocedure linear search(x:integer,\n\
    \    a₁, a₂, ..., aₙ: distinct integers)\n    i := 1\n    while (i ≤ n and x ≠\
    \ aᵢ)\n        i := i + 1\n    if i ≤ n then location := i\n    else location\
    \ := 0\n    return location{location is the subscript of the term that equals\
    \ x, or is 0 if x is not found}\n```\n\n# Solution: Count the number of comparisons.\n\
    \n+   - At each step two comparisons are made; i ≤ n and x ≠ aᵢ.\n+   - To end\
    \ the loop, one comparison i ≤ n is made.\n+   - After the loop, one more i ≤\
    \ n comparison is made.\n\nIf x = aᵢ, 2i + 1 comparisons are used. If x is not\
    \ on the list, 2n + 1 comparisons are made and then an additional comparison is\
    \ used to exit the loop. So, in the worst case 2n + 2 comparisons are made. Hence,\
    \ the complexity is Θ(n)."
  merge: -1
  img_proc: true
- pgno: 2270
  md: '# Average-Case Complexity of Linear Search


    **Example:** Describe the average case performance of the linear search algorithm.
    (Although usually it is very difficult to determine average-case complexity, it
    is easy for linear search.)


    **Solution:** Assume the element is in the list and that the possible positions
    are equally likely. By the argument on the previous slide, if $x = a_i$, the number
    of comparisons is $2i + 1$.


    $$\frac{3+5+7+...+(2n+1)}{n} = \frac{2(1+2+3+...+n)+n}{n} =$$


    $$\frac{2\left[\frac{n(n+1)}{2}\right]}{n} + 1 = n + 2$$


    Hence, the average-case complexity of linear search is $\Theta(n)$.'
  merge: -1
  img_proc: true
- pgno: 2271
  md: "# Worst-Case Complexity of Binary Search\n\n# Example: Describe the time complexity\
    \ of binary search in terms of the number of comparisons used.\n\n```\nprocedure\
    \ binary search(x: integer, a₁,a₂,...,aₙ: increasing integers)\n i := 1 {i is\
    \ the left endpoint of interval}\n j := n {j is right endpoint of interval}\n\
    \ while i < j\n  m := ⌊(i + j)/2⌋\n  if x > aₘ then i := m + 1\n  else j := m\n\
    \ if x = aᵢ then location := i\n else location := 0\n return location{location\
    \ is the subscript i of the term aᵢ equal to x, or 0 if x is not found}\n```\n\
    \nSolution: Assume (for simplicity) n = 2ᵏ elements. Note that k = log n.\n\n\
    +   - Two comparisons are made at each stage; i < j, and x > aₘ.\n\n+   - At the\
    \ first iteration the size of the list is 2ᵏ and after the first iteration it\
    \ is 2ᵏ⁻¹. Then 2ᵏ⁻² and so on until the size of the list is 2¹ = 2.\n\n+   -\
    \ At the last step, a comparison tells us that the size of the list is the size\
    \ is 2⁰ = 1 and the element is compared with the single remaining element.\n\n\
    +   - Hence, at most 2k + 2 = 2 log n + 2 comparisons are made.\n\n+   - Therefore,\
    \ the time complexity is Θ(log n), better than linear search."
  merge: -1
  img_proc: true
- pgno: 2272
  md: "# Worst-Case Complexity of Bubble Sort\n\n**Example:** What is the worst-case\
    \ complexity of bubble sort in terms of the number of comparisons made?\n\n```\n\
    procedure bubblesort(a₁,...,aₙ: real numbers\nwith n ≥ 2)\n  for i := 1 to n−1\n\
    \    for j := 1 to n − i\n      if aⱼ > aⱼ₊₁ then interchange aⱼ and aⱼ₊₁\n{a₁,...,\
    \ aₙ is now in increasing order}\n```\n\n**Solution:** A sequence of n−1 passes\
    \ is made through the list. On each pass n − i comparisons are made.\n\n(n − 1)\
    \ + (n − 2) + ... + 2 + 1 = n(n−1)/2\n\nThe worst-case complexity of bubble sort\
    \ is Θ(n²) since n(n−1)/2 = ½ n² − ½ n."
  merge: -1
  img_proc: true
- pgno: 2273
  md: '# Worst-Case Complexity of Insertion Sort


    Example: What is the worst-case complexity of insertion sort in terms of the number
    of comparisons made?


    Solution: The total number of comparisons are: 2 + 3 + ⋯ + n = n(n-1)/2 - 1


    Therefore the complexity is Θ(n²).


    ```

    procedure insertion sort(a1,...,an: real numbers with n ≥ 2)

    for j := 2 to n

    i := 1

    while aj > ai

    i := i + 1

    m := aj

    for k := 0 to j - i - 1

    a_{j-k} := a_{j-k-1}

    ai := m

    ```'
  merge: -1
  img_proc: true
- pgno: 2274
  md: "# Matrix Multiplication Algorithm\n\n+   - The definition for matrix multiplication\
    \ can be expressed as an algorithm; **C = AB** where **C** is an *m × n* matrix\
    \ that is the product of the *m × k* matrix **A** and the *k × n* matrix **B**.\n\
    +   - This algorithm carries out matrix multiplication based on its definition.\n\
    \n```\nprocedure matrix multiplication(A, B: matrices)\n    for i := 1 to m\n\
    \        for j := 1 to n\n            cᵢⱼ := 0\n            for q := 1 to k\n\
    \                cᵢⱼ := cᵢⱼ + aᵢq bqⱼ\n    return C {C = [cᵢⱼ] is the product\
    \ of A and B}\n\nA = [aᵢⱼ] is a m × k matrix\nB = [bᵢⱼ] is a k × n matrix\n```"
  merge: -1
  img_proc: true
- pgno: 2275
  md: '# # Complexity of Matrix Multiplication


    **Example:** How many additions of integers and multiplications of integers are
    used by the matrix multiplication algorithm to multiply two $n \times n$ matrices.


    **Solution:** There are $n^2$ entries in the product. Finding each entry requires
    $n$ multiplications and $n - 1$ additions. Hence, $n^3$ multiplications and $n^2(n
    - 1)$ additions are used.


    Hence, the complexity of matrix multiplication is $O(n^3)$.'
  merge: -1
  img_proc: true
- pgno: 2276
  md: '# Boolean Product Algorithm


    +   - The definition of Boolean product of zero-one matrices can also be converted
    to an algorithm.


    ```

    procedure Boolean product(A,B: zero-one matrices)

    for i := 1 to m

    for j := 1 to n

    c_ij := 0

    for q := 1 to k

    c_ij := c_ij V (a_iq ∧ b_qj)

    return {C = [c_ij] is the Boolean product of A and B}

    ```'
  merge: -1
  img_proc: true
- pgno: 2277
  md: '# Complexity of Boolean Product Algorithm


    **Example:** How many bit operations are used to find $A \odot B$, where $A$ and
    $B$ are $n \times n$ zero-one matrices?


    **Solution:** There are $n^2$ entries in the $A \odot B$. A total of $n$ ORs and
    $n$ ANDs are used to find each entry. Hence, each entry takes $2n$ bit operations.
    A total of $2n^3$ operations are used.


    Therefore the complexity is $O(n^3)$'
  merge: -1
  img_proc: true
- pgno: 2278
  md: '# Matrix-Chain Multiplication


    How should the matrix-chain A₁A₂⋯Aₙ be computed using the fewest multiplications
    of integers, where A₁, A₂, ⋯, Aₙ are m₁×m₂, m₂×m₃, ⋯ mₙ×mₙ₊₁ integer matrices.
    Matrix multiplication is associative (exercise in Section 2.6).


    Example: In which order should the integer matrices A₁A₂A₃ - where A₁ is 30×20
    A₂ 20×40, A₃ 40×10 - be multiplied to use the least number of multiplications.


    Solution: There are two possible ways to compute A₁A₂A₃.


    +   A₁(A₂A₃): A₂A₃ takes 20·40·10 = 8000 multiplications. Then multiplying A₁
    by the 20×10 matrix A₂A₃ takes 30·20·10 = 6000 multiplications. So the total number
    is 8000 + 6000 = 14,000.


    +   (A₁A₂)A₃: A₁A₂ takes 30·20·40 = 24,000 multiplications. Then multiplying the
    30×40 matrix A₁A₂ by A₃ takes 30·40·10 = 12,000 multiplications. So the total
    number is 24,000 + 12,000 = 36,000.


    So the first method is best.


    An efficient algorithm for finding the best order for matrix-chain multiplication
    can be based on the algorithmic paradigm known as dynamic programming. (see Ex.
    57 in Section 8.1)'
  merge: -1
  img_proc: true
