- pgno: 400
  md: '# EXAMPLE 22


    +   Let Q(x, y) denote "x + y = 0." What are the truth values of the quantifications


    +   ∃ y ∀ x Q(x, y) and ∀ x ∃ y Q(x, y)?


    "There is a real number y such that for every real number x, Q(x, y) is true."

    No matter what value of y is chosen, there is only one value of x for which x
    + y = 0. Since there is no real number y such that x + y = 0 for all real numbers
    x, the statement is false.


    "For every real number x there is a real number y such that Q(x, y) is true."

    Given a real number x, there is a real number y such that x + y = 0; namely, y
    = −x. Hence, the statement is true.'
  merge: -1
  img_proc: true
