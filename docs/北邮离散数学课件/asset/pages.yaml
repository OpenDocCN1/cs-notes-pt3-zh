  md: '# Partitions


    +   - A *partition* of a set $A$ is the set of all the equivalence classes $\{A_1,
    A_2, ...\}$ for some equivalence relation on $A$.

    +     - The $A_i$’s are all disjoint and their union = $A$.

    +   - They “partition” the set into pieces. Within each piece, all members of
    that set are equivalent to each other.'
