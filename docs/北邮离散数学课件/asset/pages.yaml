- pgno: 404
  md: '# Table1


    # TABLE 2 Quantifications of Two Variables.


    | Statement | When True? | When False? |

    |---|---|---|

    | ∀ x ∀ y P(x,y)

    ∀ y ∀ x P(x,y) | P(x, y) is true for every pair x, y. | There is a pair x, y for
    which P(x, y) is false. |

    | ∀ x ∃ y P(x,y) | For every x there is a y for which P(x, y) is true. | There
    is an x such that P(x, y) is false for every y. |

    | ∃ x ∀ y P(x,y) | There is an x for which P(x, y) is true for every y. | For
    every x there is a y for which P(x, y) is false. |

    | ∃ x ∃ y P(x,y)

    ∃ y ∃ x P(x,y) | There is a pair x, y for which P(x, y) is true. | P(x, y) is
    false for every pair x, y. |'
  merge: -1
  img_proc: true
