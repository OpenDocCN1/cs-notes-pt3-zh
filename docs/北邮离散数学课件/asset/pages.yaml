- pgno: 2107
  md: '# Function: Formal Definition


    +   - For any sets *A*, *B*, we say that a *function* *f* from (or “mapping”)
    *A* to *B* (*f*:*A*→*B*) is a particular assignment of exactly one element *f*(*x*)∈*B*
    to each element *x*∈*A*.

    +   - Some further generalizations of this idea:

    +     - A *partial* (non-total) function *f* assigns *zero* or *one* elements
    of *B* to each element *x*∈*A*.

    +     - Functions of *n* arguments; relations (ch. 6).'
  merge: -1
  img_proc: true
