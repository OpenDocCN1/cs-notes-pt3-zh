  md: '# Theorem 3 - Proof


    If \([a] \in \text{S/R}\), then

    \(f_R(a) = [a]\),

    so \(f_R\) is an onto function.


    if \(a\) and \(b\) are elements of S, then

    \(f_R(a*b) = [a*b] = [a] \odot [b] =\)

