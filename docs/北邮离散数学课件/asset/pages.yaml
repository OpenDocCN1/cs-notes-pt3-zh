- pgno: 28
  md: '# Conversion Between Binary, Octal, and Hexadecimal Expansions


    Example: Find the octal and hexadecimal expansions of (11 1110 1011 1100)₂.


    # Solution:


    +   - To convert to octal, we group the digits into blocks of three (011 111 010
    111 100)₂, adding initial 0s as needed. The blocks from left to right correspond
    to the digits 3,7,2,7, and 4. Hence, the solution is (37274)₈.


    +   - To convert to hexadecimal, we group the digits into blocks of four (0011
    1110 1011 1100)₂, adding initial 0s as needed. The blocks from left to right correspond
    to the digits 3,E,B, and C. Hence, the solution is (3EBC)₁₆.'
  merge: -1
  img_proc: true
