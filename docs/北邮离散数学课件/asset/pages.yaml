- pgno: 1408
  md: '# Complete Graphs


    +   For any $n \in \mathbb{N}$, a *complete graph* on $n$ vertices, $K_n$, is
    a simple graph with $n$ nodes in which every node is adjacent to every other node:
    $\forall u, v \in V: u \neq v \leftrightarrow \{u, v\} \in E$.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1408_0.png)


    > Note that $K_n$ has $\sum_{i=1}^{n-1} i = \frac{n(n-1)}{2}$ edges.'
  merge: -1
  img_proc: true
- pgno: 1409
  md: '# Cycles


    +   For any $n\ge 3$, a *cycle* on $n$ vertices, $C_n$, is a simple graph where
    $V=\{v_1,v_2,\dots ,v_n\}$ and $E=\{\{v_1,v_2\},\{v_2,v_3\},\dots ,\{v_{n-1},v_n\},\{v_n,v_1\}\}.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1409_0.png)


    How many edges are there in $C_n$?'
  merge: -1
  img_proc: true
- pgno: 1410
  md: '# # Wheels


    +   - For any \(n\ge 3\), a **wheel** \(W_n\), is a simple graph obtained by taking
    the cycle \(C_n\) and adding one extra vertex \(v_{\mathrm{hub}}\) and \(n\) extra
    edges \(\{\{v_{\mathrm{hub}},v_1\},\{v_{\mathrm{hub}},v_2\},\ldots,\{v_{\mathrm{hub}},v_n\}\}\).


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1410_0.png)


    How many edges are there in \(W_n\)?'
  merge: -1
  img_proc: true
- pgno: 1411
  md: '# $n$-cubes (hypercubes)


    +   - For any $n\in\mathbb{N}$, the hypercube $Q_n$ is a simple graph consisting
    of two copies of $Q_{n-1}$ connected together at corresponding nodes. $Q_0$ has
    1 node.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1411_0.png)


    *Number of vertices:* $2^n$.  *Number of edges:* Exercise to try!'
  merge: -1
  img_proc: true
- pgno: 1412
  md: '# n-cubes (hypercubes)


    +   - For any $n \in \mathbf{N}$, the hypercube $Q_n$ can be defined recursively
    as follows:

    +     - $Q_0 = \{\{v_0\}, \varnothing\}$ (one node and no edges)

    +     - For any $n \in \mathbf{N}$, if $Q_n = (V, E)$, where $V = \{v_1, ...,
    v_a\}$ and $E = \{e_1, ..., e_b\}$, then $Q_{n+1} = (V \cup \{v_1'', ..., v_a''\},
    E \cup \{e_1'', ..., e_b''\} \cup \{\{v_1, v_1''\}, \{v_2, v_2''\}, ..., \{v_a,
    v_a''\}\})$ where $v_1'', ..., v_a''$ are new vertices, and where if $e_i = \{v_j,
    v_k\}$ then $e_i'' = \{v_j'', v_k''\}$.'
  merge: -1
  img_proc: true
- pgno: 1413
  md: '# Bipartite Graphs


    +   - **Def’n.:** A graph $G=(V,E)$ is *bipartite* (two-part) iff $V = V_1 \cap
    V_2$ where $V_1 \cup V_2=\varnothing$ and $\forall e \in E:$ $\exists v_1 \in
    V_1, v_2 \in V_2:$ $e=\{v_1,v_2\}$.

    +   - **In English:** The graph can be divided into two parts in such a way that
    all edges go between the two parts.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1413_0.png)


    This definition can easily be adapted for the case of multigraphs and directed
    graphs as well.


    Can represent with zero-one matrices.'
  merge: -1
  img_proc: true
- pgno: 1414
  md: '# Complete Bipartite Graphs


    +   - For *m,n* ∈ **N**, the *complete bipartite graph* K_{m,n} is a bipartite
    graph where |V₁| = *m*, |V₂| = *n*, and E = {{v₁,v₂}|v₁ ∈ V₁ ∧ v₂ ∈ V₂}.

    +     - That is, there are *m* nodes in the left part, *n* nodes in the right
    part, and every node in the left part is connected to every node in the right
    part.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1414_0.png)


    K_{m,n} has _____ nodes and _____ edges.'
  merge: -1
  img_proc: true
- pgno: 1415
  md: '# Subgraphs


    +   - A subgraph of a graph $G=(V,E)$ is a graph $H=(W,F)$ where $W\subseteq V$
    and $F\subseteq E$.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1415_0.png)'
  merge: -1
  img_proc: true
- pgno: 1416
  md: '# Graph Unions


    +   - The *union* $G_1 \cup G_2$ of two simple graphs $G_1=(V_1, E_1)$ and $G_2=(V_2,E_2)$
    is the simple graph $(V_1 \cup V_2, E_1 \cup E_2)$.


