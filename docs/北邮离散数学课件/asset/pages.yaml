  md: '# Propositions in Propositional Logic


    +   - Atoms: *p*, *q*, *r*, ...

    +     (Corresponds with simple English sentences, e.g. ‘I had salad for lunch’)

    +   - Complex propositions : built up from atoms using operators: *p*∧*q*

    +     (Corresponds with compound English sentences, e.g., “I had salad for lunch
    and I had steak for dinner.”)'
