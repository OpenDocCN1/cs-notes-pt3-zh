  md: '# 偏序关系


    # 半序关系


    [定义]：半序关系（偏序关系）

    R 是 A 上的二元关系，如果 R 满足：


    +   (1) 自反的

    +   (2) 反对称的

    +   (3) 传递的


    则称 R 是 A 上半序关系。'
  merge: -1
  img_proc: true
- pgno: 1325
  md: '# 例：


    A = { 1, 2, 3, 4, 5, 6, 7, 8, 9 }


    B = { a, b, c }


    R₁ = { ( a, b ) | a ≤ b, a, b ∈ A }


    R₂ = { ( a, b ) | a | b, a, b ∈ A }


    R₃ = { ( s₁, s₂ ) | s₁ ⊆ s₂, s₁, s₂ ∈ p ( B ) }


    # 记号：


    R = { ( a, b ) | a ≤_R b, a, b ∈ A } 其中 ≤_R 可为 ≤, |, ⊆'
