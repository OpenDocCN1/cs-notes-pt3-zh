    +   - For example, consider an ordering on **N× N**, ordered pairs of nonnegative
    integers. Specify that $(x_1 ,y_1)$ is less than or equal to $(x_2,y_2)$ if either
    $x_1 < x_2$, or $x_1 = x_2$ and $y_1 < y_2$. This is called the *lexicographic
    ordering*.

    +   - Strings are also commonly ordered by a *lexicographic ordering*.

    +   - The next example uses generalized induction to prove a result about ordered
    pairs from **N× N**.'
