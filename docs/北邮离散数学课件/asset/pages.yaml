- pgno: 1319
  md: '# Proof


    +   - Let $a''$ and $a''''$ be complements of the element $a \in L$. Then

    +     - $a \vee a'' = I$, $a \vee a'''' = I$, $a \wedge a'' = 0$, $a \wedge a''''
    = 0$.

    +   - Using the distributive laws, we obtain

    +     - $a'' = a'' \vee 0 = a'' \vee (a \wedge a'''') = (a'' \vee a) \wedge (a''
    \vee a'''') = I \wedge (a'' \vee a'''') = a'' \vee a''''$

    +   - Also

    +     - $a'''' = a'''' \vee 0 = a'''' \vee (a \wedge a'') = (a'''' \vee a) \wedge
    (a'''' \vee a'') = I \wedge (a'''' \vee a'') = a'' \vee a''''$

    +   - Hence $a'' = a''''$.'
  merge: -1
  img_proc: true
