- pgno: 2106
  md: '# On to section 2.3... Functions


    +   - From calculus, you are familiar with the concept of a real-valued function
    *f*, which assigns to each number *x*∈**R** a particular value *y*=*f*(*x*), where
    *y*∈**R**.

    +   - But, the notion of a function can also be naturally generalized to the concept
    of assigning elements of *any* set to elements of *any* set. (Also known as a
    *map*.)'
  merge: -1
