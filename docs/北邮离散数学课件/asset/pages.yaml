- pgno: 2077
  md: '# Cartesian Products of Sets

    迪卡尔集


    +   - For sets *A*, *B*, their *Cartesian product* *A*×*B* := {(*a*, *b*) | *a*∈*A*
    ∧ *b*∈*B*}.

    +   - *E.g.* {a,b}×{1,2} = {(a,1),(a,2),(b,1),(b,2)}

    +   - Note that for finite *A*, *B*, |*A*×*B*|=|*A*||*B*|.

    +   - Note that the Cartesian product is *not* commutative: *i.e.*, ¬∀*A B*: *A*×*B*=*B*×*A*.

    +   - Extends to *A*₁ × *A*₂ × ... × *A*ₙ...


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2077_0.png)


