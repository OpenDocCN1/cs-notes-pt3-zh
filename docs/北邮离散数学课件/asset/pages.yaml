- pgno: 2114
  md: '# Range versus Codomain


    +   - The range of a function might *not* be its whole codomain.

    +   - The codomain is the set that the function is *declared* to map all domain
    values into.

    +   - The range is the *particular* set of values in the codomain that the function
    *actually* maps elements of the domain to.'
  merge: -1
  img_proc: true
- pgno: 2115
  md: '# Images of Sets under Functions


    +   - Given $f:A\to B$, and $S\subseteq A$,

    +   - The *image* of $S$ under $f$ is simply the set of all images (under $f$)
    of the elements of $S$.

    +     $f(S) := \{f(s) \mid s\in S\}$

    +     $:= \{b \mid \exists s\in S: f(s)=b\}$.

    +   - Note the range of $f$ can be defined as simply the image (under $f$) of
    $f$''s domain!'
  merge: -1
  img_proc: true
- pgno: 2116
  md: '# Range vs. Codomain - Example


    +   - Suppose I declare to you that: “f is a function mapping students in this
    class to the set of grades {A,B,C,D,E}.”

    +   - At this point, you know f’s codomain is: {A,B,C,D,E}, and its range is unknown!.

    +   - Suppose the grades turn out all As and Bs.

    +   - Then the range of f is {A,B}, but its codomain is still {A,B,C,D,E}!'
  merge: -1
  img_proc: true
- pgno: 2117
  md: '# Operators (general definition)


    +   - An *n*-ary *operator over* (or *on*) the set *S* is any function from the
    set of ordered *n*-tuples of elements of *S*, to *S* itself.

    +   - *E.g.*, if *S*={**T**,**F**}, ¬ can be seen as a unary operator, and ∧,∨
    are binary operators on *S*.

    +   - Another example: ∪ and ∩ are binary operators on the set of all sets.'
