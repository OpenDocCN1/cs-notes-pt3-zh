  md: '# Questions on Propositional Satisfiability


    **Example**: Determine the satisfiability of the following compound propositions:


    (p ∨ ¬q) ∧ (q ∨ ¬r) ∧ (r ∨ ¬p)


    **Solution**: Satisfiable. Assign **T** to p, q, and r.


    (p ∨ q ∨ r) ∧ (¬p ∨ ¬q ∨ ¬r)


    **Solution**: Satisfiable. Assign **T** to p and **F** to q.


    (p ∨ ¬q) ∧ (q ∨ ¬r) ∧ (r ∨ ¬p) ∧ (p ∨ q ∨ r) ∧ (¬p ∨ ¬q ∨ ¬r)


    **Solution**: Not satisfiable. Check each possible assignment of truth values
    to the propositional variables and none will make the proposition true.'
