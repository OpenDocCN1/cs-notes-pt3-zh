- pgno: 2252
  md: '# # Combinations of Functions


    +   - If $f_1(x)$ is $O(g_1(x))$ and $f_2(x)$ is $O(g_2(x))$ then

    +     $$(f_1+f_2)(x)\text{ is }O(\max(|g_1(x)|,|g_2(x)|)).$$


    +   - By the definition of big-O notation, there are constants $C_1,C_2,k_1,k_2$
    such that

    +     $$|f_1(x)|\le C_1|g_1(x)|\text{ when }x>k_1\text{ and }f_2(x)\le C_2|g_2(x)|\text{
    when }x>k_2.$$


    +   - $$|(f_1+f_2)(x)|=|f_1(x)+f_2(x)|$$

    +     $$\le |f_1(x)|+|f_2(x)|$$


    by the triangle inequality $|a+b|\le |a|+|b|$


    +   - $$|f_1(x)|+|f_2(x)|\le C_1|g_1(x)|+C_2|g_2(x)|$$

    +     $$\le C_1|g(x)|+C_2|g(x)|$$

    +     $$=(C_1+C_2)|g(x)|$$

    +     $$=C|g(x)|$$


    where $g(x)=\max(|g_1(x)|,|g_2(x)|)$


    where $C=C_1+C_2$


    +   - Therefore $|(f_1+f_2)(x)|\le C|g(x)|$ whenever $x>k$, where $k=\max(k_1,k_2)$.'
  merge: -1
  img_proc: true
- pgno: 2253
  md: '# Ordering Functions by Order of Growth


    +   - Put the functions below in order so that each function is big-O of the next
    function on the list.

    +   - $f_1(n) = (1.5)^n$

    +   - $f_2(n) = 8n^3 + 17n^2 + 111$

    +   - $f_3(n) = (\log n)^2$

    +   - $f_4(n) = 2^n$

    +   - $f_5(n) = \log (\log n)$

    +   - $f_6(n) = n^2 (\log n)^3$

    +   - $f_7(n) = 2^n (n^2 + 1)$

    +   - $f_8(n) = n^3 + n(\log n)^2$

    +   - $f_9(n) = 10000$

    +   - $f_{10}(n) = n!$


    We solve this exercise by successively finding the function that grows slowest
    among all those left on the list.


    +   - $f_9(n) = 10000$ (constant, does not increase with $n$)

    +   - $f_5(n) = \log (\log n)$ (grows slowest of all the others)

    +   - $f_3(n) = (\log n)^2$ (grows next slowest)

    +   - $f_6(n) = n^2 (\log n)^3$ (next largest, $(\log n)^3$ factor smaller than
    any power of $n$)

    +   - $f_2(n) = 8n^3 + 17n^2 + 111$ (tied with the one below)

    +   - $f_8(n) = n^3 + n(\log n)^2$ (tied with the one above)

    +   - $f_1(n) = (1.5)^n$ (next largest, an exponential function)

    +   - $f_4(n) = 2^n$ (grows faster than one above since $2 > 1.5$)

    +   - $f_7(n) = 2^n (n^2 + 1)$ (grows faster than above because of the $n^2 +
    1$ factor)

    +   - $f_{10}(n) = 3^n$ ($n!$ grows faster than $c^n$ for every $c$)'
