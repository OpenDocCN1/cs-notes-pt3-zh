  md: '# The Intersection Operator交


    +   - For sets *A*, *B*, their *intersection* *A*∩*B* is the set containing all
    elements that are simultaneously in *A* **and** (“∧”) in *B*.

    +   - Formally, ∀*A*,*B*: *A*∩*B*={*x* | *x*∈*A* ∧ *x*∈*B*}.

    +   - Note that *A*∩*B* is a **subset** of both A and B (in fact it is the largest
    such subset):

    +     ∀*A*, *B*: (*A*∩*B* ⊆ *A*) ∧ (*A*∩*B* ⊆ *B*)'
