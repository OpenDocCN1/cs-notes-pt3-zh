- pgno: 2041
  md: '# Proof by Cases Example


    Example 3


    > **Theorem:** ∀n∈Z ¬(2|n ∨ 3|n) → 24|(n²-1)


    – Proof: Since 2·3=6, the value of n mod 6 is sufficient to tell us whether 2|n
    or 3|n. If (n mod 6)∈{0,3} then 3|n; if it is in {0,2,4} then 2|n. Thus (n mod
    6)∈{1,5}.


    +   **Case #1:** If n mod 6 = 1, then (∃k) n=6k+1. n²=36k²+12k+1, so n²-1=36k²+12k
    = 12(3k+1)k. Note 2|(3k+1)k since either k or 3k+1 is even. Thus 24|(n²-1).


    +   **Case #2:** If n mod 6 = 5, then n=6k+5. n²-1 = (n-1)·(n+1) = (6k+4)·(6k+6)
    = 12·(3k+2)·(k+1). Either k+1 or 3k+2 is even. Thus, 24|(n²-1).'
