- pgno: 303
  md: '# Quantifiers


    ![](img/c25dfd82fc242c2db53bc942dcad6885_303_0.png)


    Charles Peirce (1839-1914)


    +   - We need *quantifiers* to express the meaning of English words including
    *all* and *some*:

    +     - “All men are Mortal.”

    +     - “Some cats do not have fur.”

    +   - The two most important quantifiers are:

    +     - *Universal Quantifier*, “For all,” symbol: ∀

    +     - *Existential Quantifier*, “There exists,” symbol: ∃

    +   - We write as in ∀x P(x) and ∃x P(x).

    +   - ∀x P(x) asserts P(x) is true for *every* x in the *domain*.

    +   - ∃x P(x) asserts P(x) is true for *some* x in the *domain*.

    +   - The quantifiers are said to bind the variable x in these expressions.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Universal Quantifier


    ∀x P(x) is read as “For all x, P(x)” or “For every x, P(x)”


    # Examples:


    +   1. If P(x) denotes “x > 0” and U is the integers, then ∀x P(x) is false.

    +   2. If P(x) denotes “x > 0” and U is the positive integers, then ∀x P(x) is
    true.

    +   3. If P(x) denotes “x is even” and U is the integers, then ∀x P(x) is false.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Existential Quantifier


    ∃x P(x) is read as “For some x, P(x)”, or as “There is an x such that P(x),” or
    “For at least one x, P(x).”


    # Examples:


    +   1. If P(x) denotes “x > 0” and U is the integers, then ∃x P(x) is true. It
    is also true if U is the positive integers.

    +   2. If P(x) denotes “x < 0” and U is the positive integers, then ∃x P(x) is
    false.

    +   3. If P(x) denotes “x is even” and U is the integers, then ∃x P(x) is true.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Uniqueness Quantifier (optional)


    +   ∃!x P(x) means that P(x) is true for one and only one x in the universe of
    discourse.


    +   This is commonly expressed in English in the following equivalent ways:

    +   "There is a unique x such that P(x)."

    +   "There is one and only one x such that P(x)"


    +   Examples:

    +   1. If P(x) denotes "x + 1 = 0" and U is the integers, then ∃!x P(x) is true.

    +   2. But if P(x) denotes "x > 0," then ∃!x P(x) is false.


    The uniqueness quantifier is not really needed as the restriction that there is
    a unique x such that P(x) can be expressed as:

    ∃x (P(x) ∧ ∀y (P(y) → y = x))'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Thinking about Quantifiers


    +   When the domain of discourse is finite, we can think of quantification as
    looping through the elements of the domain.


    +   To evaluate ∀x P(x) loop through all x in the domain.

    +     - If at every step P(x) is true, then ∀x P(x) is true.

    +     - If at a step P(x) is false, then ∀x P(x) is false and the loop terminates.


    +   To evaluate ∃x P(x) loop through all x in the domain.

    +     - If at some step, P(x) is true, then ∃x P(x) is true and the loop terminates.

    +     - If the loop ends without finding an x for which P(x) is true, then ∃x
    P(x) is false.


    +   Even if the domains are infinite, we can still think of the quantifiers this
    fashion, but the loops will not terminate in some cases.'
  merge: -1
  img_proc: true
