- pgno: 2048
  md: '# Conjecture and Proof


    Example 6


    +   - We know that some numbers of the form 2^p−1 are prime when p is prime.

    +     - These are called the Mersenne primes.

    +   - Can we prove the inverse, that a^n−1 is composite whenever either a>2, or
    (a=2 but n is composite)?

    +     - All we need is to find a factor greater than 1.

    +   - Note a^n−1 factors into (a−1)(a^{n−1}+...+a+1).

    +     - When a>2, (a−1)>1, and so we have a factor.

    +     - When n is composite, ∃r,s>1: n=rs. Thus, given a=2, a^n = 2^n = 2^{rs}
    = (2^r)^s, and since r>1, 2^r > 2 so 2^n − 1 = b^s−1 with b = 2^r > 2, which now
    fits the first case.'
  merge: -1
  img_proc: true
- pgno: 2049
  md: '# Conjecture & Counterexamples


    Example 8


    +   - **Conjecture:** ∀ integers *n*>0, *n*²−*n*+41 is prime.

    +     - Hm, let’s see if we can find any counter-examples:

    +       - 1²−1+41 = 41 (prime)

    +       - 2²−2+41 = 4−2+41 = 43 (prime)

    +       - 3²−3+41 = 9−3+41 = 47 (prime) Looking good so far!!

    +     - Can we conclude after showing that it checks out in, say, 20 or 30 cases,
    that the conjecture must be true?


    +   - **NEVER NEVER NEVER NEVER NEVER!**

    +     - Of course, 41²−41+41 is divisible by 41!!'
  merge: -1
