- pgno: 2145
  md: '# Strings, more formally


    +   - Let Σ be a finite set of *symbols*, *i.e.* an *alphabet*.

    +     - A *string* s over alphabet Σ is any sequence {s_i} of symbols, s_i ∈ Σ,
    normally indexed by N or N−{0}.

    +   - If a, b, c, ... are symbols, the string s = a, b, c, ... can also be written
    abc... (*i.e.*, without commas).

    +   - If s is a finite string and t is any string, then the *concatenation* of
    s with t, written just st,

    +     - is simply the string consisting of the symbols in s, in sequence, followed
    by the symbols in t, in sequence.'
  merge: -1
  img_proc: true
- pgno: 2146
  md: '# More Common String Notations


    +   - The length |s| of a finite string s is its number of positions (i.e., its
    number of index values i).

    +   - If s is a finite string and n∈N,

    +     - Then sⁿ denotes the concatenation of n copies of s.

    +   - ε or "" denotes the empty string, the string of length 0.

    +     - This is fairly common, but the book uses λ instead.

    +   - If Σ is an alphabet and n∈N,

    +     Σⁿ := {s | s is a string over Σ of length n}, and

    +     Σ* := {s | s is a finite string over Σ}.'
