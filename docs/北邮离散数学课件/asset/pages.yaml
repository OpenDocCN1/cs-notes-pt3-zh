- pgno: 5
  md: '# Division


    **Definition:** If *a* and *b* are integers with *a* ≠ 0, then *a* divides *b*
    if there exists an integer *c* such that *b* = *ac*.


    +   - When *a* divides *b* we say that *a* is a *factor* or divisor of *b* and
    that *b* is a multiple of *a*.

    +   - The notation *a* ∣ *b* denotes that *a* divides *b*.

    +   - If *a* ∣ *b*, then *b*/*a* is an integer.

    +   - If *a* does not divide *b*, we write *a* ∤ *b*.


    **Example:** Determine whether 3 ∣ 7 and whether 3 ∣ 12.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Properties of Divisibility


    # Theorem 1: Let a, b, and c be integers, where a ≠ 0.


    +   i. If a | b and a | c, then a | (b + c);

    +   ii. If a | b, then a | bc for all integers c;

    +   iii. If a | b and b | c, then a | c.


    # Proof: (i) Suppose a | b and a | c, then it follows that there are integers
    s and t with b = as and c = at. Hence,


    b + c = as + at = a(s + t). Hence, a | (b + c)


    (Exercises 3 and 4 ask for proofs of parts (ii) and (iii).)


    # Corollary: If a, b, and c be integers, where a ≠ 0, such that a | b and a |
    c, then a | mb + nc whenever m and n are integers.


    Can you show how it follows easily from from (ii) and (i) of Theorem 1?'
  merge: -1
