  md: "# Fermat’s Little Theorem\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_81_0.png)\n\
    \n**Pierre de Fermat**  \n(1601-1665)\n\n**Theorem 3:** *(Fermat’s Little Theorem)*\
    \ If \\(p\\) is prime and \\(a\\) is an integer not divisible by \\(p\\), then\
    \ \\(a^{p-1} \\equiv 1 \\pmod p\\)  \nFurthermore, for every integer \\(a\\) we\
    \ have \\(a^p \\equiv a \\pmod p\\)  \n*(proof outlined in Exercise 19)*\n\nFermat’s\
    \ little theorem is useful in computing the remainders modulo \\(p\\) of large\
    \ powers of integers.\n\n**Example:** Find \\(7^{2222} \\bmod 11\\).\n\nBy Fermat’s\
    \ little theorem, we know that \\(7^{10} \\equiv 1 \\pmod{11}\\), and so \\((7^{10})^k\
    \ \\equiv 1 \\pmod{11}\\), for every positive integer \\(k\\). Therefore,\n\n\\\
    [7^{2222} = 7^{22\\cdot 10+2} = (7^{10})^{222}7^2 \\equiv (1)^{222}\\cdot 49 \\\
    equiv 5 \\pmod{11}.\\]\n\nHence, \\(7^{2222} \\bmod 11 = 5\\)."
