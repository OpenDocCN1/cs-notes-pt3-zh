- pgno: 148
  md: '# Questions for you to think about


    3. Explain why ¬ and ∧ together are sufficient to express any Boolean truth table


    +   - Suppose precisely two rows give T.

    +     *For example, the rows where*


    +   - P=T, Q=T, R=F. This is P ∧ Q ∧ ¬R


    +   - P=T, Q=F, R=T. This is P ∧ ¬Q ∧ R'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Table as a disjunction of T-rows


    Suppose precisely two rows give T.


    *For example, the rows where*


    +   - P=T, Q=T, R=F. This is P ∧ Q ∧ ¬R

    +   - P=T, Q=F, R=T. This is P ∧ ¬Q ∧ R


    We’ve proven our claim if we can express the disjunction of these two rows:

    (P ∧ Q ∧ ¬R) ∨ (P ∧ ¬Q ∧ R)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Disjoining rows of the table


    +   - We’ve arrived if we can express their disjunction:

    +     (P ∧ Q ∧ ¬R) ∨ (P ∧ ¬Q ∧ R)

    +   - But we’ve seen that disjunction can be expressed using ∧ and ¬:

    +     p ∨ q ⇔ ¬(¬p ∧ ¬q)

    +   - So we’re there!'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# About this proof ...


    +   - We’ve been a bit casual, e.g., assuming that there were either 0 or 2 rows
    resulting in T

    +   - But the case with 1 or 3 or 4 or .... rows goes in the same way. (And there
    are always only finitely many rows.)

    +   - So, the proof can easily be made precise

    +   - (There are lots of interesting related questions, but we won’t go there
    now ...)'
  merge: -1
