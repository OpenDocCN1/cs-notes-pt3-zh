- pgno: 1531
  md: '# Hamiltonian Path Theorems


    +   - **Dirac’s theorem:** If (but not only if) $G$ is connected, simple, has
    $n\geq3$ vertices, and $\forall v\ \text{deg}(v)\geq n/2$, then $G$ has a Hamilton
    circuit.

    +     - **Ore’s corollary:** If $G$ is connected, simple, has $n\geq3$ nodes,
    and $\text{deg}(u)+\text{deg}(v)\geq n$ for every pair $u,v$ of non-adjacent nodes,
    then $G$ has a Hamilton circuit.'
  merge: -1
  img_proc: true
- pgno: 1532
  md: '# HAM-CIRCUIT is NP-complete


    +   - Let HAM-CIRCUIT be the problem:

    +     - Given a simple graph *G*, does *G* contain a Hamiltonian circuit?


    +   - This problem has been proven to be *NP-complete*!

    +     - This means, if an algorithm for solving it in polynomial time were found,
    it could be used to solve *all* NP problems in polynomial time.'
  merge: -1
  img_proc: true
- pgno: 1533
  md: '# 【定理3】：设 $G=(V,E)$ 是 $n$ 个顶点的简单图，如果任何一对顶点的次之和 $\ge n-1$，则 $G$ 中一定有 $H$ 道路。


    # 证明：


    1、$G$ 一定连通，否则 $G$ 分为二个不连通的分图 $G_1$，$G_2$，其中 $G_1$ 有 $n_1$ 个顶点，$G_2$ 有 $n_2$ 个顶点，$G_1$
    中每个顶点次 $\le n_1-1$，$G_2$ 中每个顶点次 $\le n_2-1$，从 $G_1$ 中取一个顶点，从 $G_2$ 中取一个顶点，这一对顶点之和
    $\le n_1-1+n_2-1=n_1+n_2-2=n-2<n-1$，与定理的假设矛盾。'
  merge: -1
  img_proc: true
- pgno: 1534
  md: '# 2、用逐步递推构造法证明G中存在H道路：


    +   (1) 任取一条边（V₁，V₂），是含 2 个顶点的基本道路。


    +   (2) 如果已有 p 个顶点的基本道路

    +   （V₁，V₂，...，Vₚ），（p ≤ n − 1）

    +   必能构造 p + 1 个顶点的基本道路。


    +   a）如果在 V − { V₁，V₂，... Vₚ } 中存在与 V₁ 或 Vₚ 相邻的顶点，则基本道路自然可以扩充一个顶点。


    +   b）如果 V₁，Vₚ 仅与 { V₁，V₂，...，Vₚ } 中顶点相邻，则 { V₁，V₂，...，Vₚ } 必可适当排列，形成回路。'
  merge: -1
  img_proc: true
- pgno: 1535
  md: '如果V₁与Vₚ相邻，显然成了环。不然，由于V₁，Vₚ仅与{V₁，V₂，...，Vₚ}中顶点相邻，V₁，Vₚ的次≤p−1。不妨设V₁的次为k≤p−1，分别记相邻顶点为Vᵢ₁，Vᵢ₂，...，Vᵢₖ，它们前面的顶点（指在基本道路{V₁，V₂，...，Vₚ}中的序）为
    Vᵢ₁₋₁,Vᵢ₂₋₁,...,Vᵢₖ₋₁，Vₚ必与 Vᵢ₁₋₁,Vᵢ₂₋₁,...,Vᵢₖ₋₁中某顶点相邻，否则Vₚ的次≤p−1−k，V₁与Vₚ的次之和≤k+p−1−k=p−1<n−1，与任一对顶点次之和≥n−1矛盾。


    不妨Vₚ与Vⱼ₋₁相邻，V₁与Vⱼ相邻。将V₁与Vⱼ连起来，Vₚ与Vⱼ₋₁连起来，并将Vⱼ₋₁到Vⱼ的边去掉，就形成一个环，如下图所示。'
  merge: -1
  img_proc: true
- pgno: 1536
  md: '![](img/c25dfd82fc242c2db53bc942dcad6885_1536_0.png)


    又由 $G$ 的连通性，总可在 $V-\{V_1，V_2，…，V_p\}$ 中找到一个点 $V_x$，与 $\{V_1，V_2，…，V_p\}$ 中某一顶相邻，不妨与
    $V_k$ 相邻，$V_k\ne V_1$，$V_k\ne V_p$，连上 $V_x$ 与 $V_k$ 的边，去掉 $V_{k-1}$ 到 $V_k$ 的边，可以从
    $V_{k-1}$ 为起点，一直走到 $V_k$，再到 $V_x$，这是一条 $p+1$ 个顶点的基本道路。'
  merge: -1
  img_proc: true
