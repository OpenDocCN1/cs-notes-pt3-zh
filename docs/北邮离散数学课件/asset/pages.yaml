- pgno: 1071
  md: '# How many relations are there?


    +   - Relations on a set $A$ with $n$ elements

    +   - $A^2$ has $n^2$ elements. We know that the number of subsets of a set with
    $m$ elements is $2^m$, so the desired number is $2^{n^2}$.

    +   - The number of functions from $A$ to $A$ is $n^n$

    +   - Is this asymptotically the same?

    +   - $n^n = (2^{\log n})^n = 2^{n\log n}$ which grows slower than $2^{n^2}$.'
  merge: -1
  img_proc: true
