- pgno: 1634
  md: '# [定理1]（欧拉公式/Euler’s formula）


    对任何一个连通平面简单图，有v−e+γ=2，其中v为顶点数，e为边数，γ是区域数。


    证明：


    对 e 归纳：


    +   (1) e = 1，只有两种情况


    a）__________，v = 2，γ = 1，v − e + γ = 2 − 1 + 1 = 2


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1634_0.png)


    b）[手绘闭合曲线]，v = 1，γ = 2，v − e + γ = 1 − 1 + 2 = 2'
