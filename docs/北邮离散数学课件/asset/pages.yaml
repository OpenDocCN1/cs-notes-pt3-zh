- pgno: 2228
  md: '# Halting Problem


    **Example**: Can we develop a procedure that takes as input a computer program
    along with its input and determines whether the program will eventually halt with
    that input.


    +   - **Solution**: Proof by contradiction.

    +   - Assume that there is such a procedure and call it H(P,I). The procedure
    H(P,I) takes as input a program P and the input I to P.

    +     - H outputs “halt” if it is the case that P will stop when run with input
    I.

    +     - Otherwise, H outputs “loops forever.”'
  merge: -1
  img_proc: true
- pgno: 2229
  md: '# Halting Problem


    +   - Since a program is a string of characters, we can call H(P,P). Construct
    a procedure K(P), which works as follows.

    +     - If H(P,P) outputs “loops forever” then K(P) halts.

    +     - If H(P,P) outputs “halt” then K(P) goes into an infinite loop printing
    “ha” on each iteration.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2229_0.png)'
  merge: -1
