- pgno: 141
  md: '# Conjunction Truth Table


    +   - Note that a conjunction $p_1 \land p_2 \land \dots \land p_n$ of $n$ propositions
    will have $2^n$ rows in its truth table.


    | Operand columns |  |  |

    |---|---|---|

    | $p$ | $q$ | $p \land q$ |

    | F | F | F |

    | F | T | F |

    | T | F | F |

    | T | T | T |


    +   - Also: ¬ and ∧ operations together are sufficient to express *any* Boolean
    truth table!'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# The Disjunction析取 Operator


    The binary *disjunction operator* “∨” (OR) combines two propositions to form their
    logical *disjunction*.


    p=“My car has a bad engine.”

    q=“My car has a bad door.”

    p∨q=“Either my car has a bad engine, or my car has a bad door.”


    Meaning is like “and/or” in English.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Disjunction Truth Table


    +   - Note that $p \vee q$ means that $p$ is true, or $q$ is true, or **both**
    are true!

    +   - So, this operation is also called *inclusive or*, because it **includes**
    the possibility that both $p$ and $q$ are true.

    +   - “¬” and “∨” together are also universal.


    | $p$ | $q$ | $p \vee q$ |

    | --- | --- | --- |

    | F | F | F |

    | F | T | **T** |

    | T | F | **T** |

    | T | T | T |


    Note difference from AND'
  merge: -1
