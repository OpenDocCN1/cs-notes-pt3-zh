- pgno: 162
  md: '# Converse, Contrapositive, and Inverse

    逆命题 逆否命题 否命题


    From $p \to q$ we can form new conditional statements.


    +   - $q \to p$ is the **converse** of $p \to q$

    +   - $\lnot q \to \lnot p$ is the **contrapositive** of $p \to q$

    +   - $\lnot p \to \lnot q$ is the **inverse** of $p \to q$


    **Example**: Find the converse, inverse, and contrapositive of “It raining is
    a sufficient condition for my not going to town.”


    # **Solution:**


    **converse**: If I do not go to town, then it is raining.


    **inverse**: If it is not raining, then I will go to town.


    **contrapositive**: If I go to town, then it is not raining.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Contrapositive


    Some terminology, for an implication $p \rightarrow q$:


    +   - Its *converse* is: $q \rightarrow p$.

    +   - Its *contrapositive*: $\neg q \rightarrow \neg p$.

    +   - One of these has the *same meaning* (same truth table) as $p \rightarrow
    q$. Can you figure out which?


    原命题为： p-->q

    converse 逆命题为： q-->p

    inverse 否命题为： 非p-->非q

    逆否命题为： 非q-->非p


    ![](img/c25dfd82fc242c2db53bc942dcad6885_163_0.png)'
  merge: -1
  img_proc: true
