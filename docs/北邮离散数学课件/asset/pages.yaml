  md: '# # Binary operations(二元运算)


    +   - A binary operation on a set A is an **everywhere** defined function \( f:A
    \times A \rightarrow A \).


    +   - A binary operation must satisfy:


    +   - \( f \) assigns an element \( f(a,b) \) of \( A \) to each ordered pair
    \( (a,b) \) in \( A \times A \).


    +   - Since a binary operation is a function. Only one element of \( A \) is assigned
    to each ordered pair.'
  merge: -1
  img_proc: true
