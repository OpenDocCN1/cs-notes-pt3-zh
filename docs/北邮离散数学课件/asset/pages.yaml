- pgno: 2157
  md: '# Symbolic Derivation of Trick


    For case where $n$ is even...


    $\sum_{i=1}^{n} i = \sum_{i=1}^{2k} i = \left(\sum_{i=1}^{k} i\right) + \sum_{i=k+1}^{n}
    i = \left(\sum_{i=1}^{k} i\right) + \sum_{i=0}^{n-(k+1)} \left(i + (k+1)\right)$


    $= \left(\sum_{i=1}^{k} i\right) + \sum_{i=0}^{n-(k+1)} \left(\left(n-(k+1)-i\right)+(k+1)\right)$


    $= \left(\sum_{i=1}^{k} i\right) + \sum_{i=0}^{n-(k+1)} (n-i) = \left(\sum_{i=1}^{k}
    i\right) + \sum_{i=1}^{n-k} (n-(i-1))$


    $= \left(\sum_{i=1}^{k} i\right) + \sum_{i=1}^{n-k} (n+1-i) = \left(\sum_{i=1}^{k}
    i\right) + \sum_{i=1}^{k} (n+1-i) = ...$'
  merge: -1
  img_proc: true
- pgno: 2158
  md: '# Concluding Euler’s Derivation


    ∑ᵢ₌₁ⁿ i = (∑ᵢ₌₁ᵏ i) + ∑ᵢ₌₁ᵏ (n + 1 − i) = ∑ᵢ₌₁ᵏ (i + n + 1 − i)

    = ∑ᵢ₌₁ᵏ (n + 1) = k(n + 1) = n/2 (n + 1)

    = n(n + 1)/2


    +   - So, you only have to do 1 easy multiplication in your head, then cut in
    half.


    +   - Also works for odd n (prove this at home).'
  merge: -1
  img_proc: true
