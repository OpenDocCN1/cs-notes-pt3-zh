- pgno: 314
  md: '# Thinking about Quantifiers as Conjunctions and Disjunctions


    +   - If the domain is finite, a universally quantified proposition is equivalent
    to a conjunction of propositions without quantifiers and an existentially quantified
    proposition is equivalent to a disjunction of propositions without quantifiers.

    +   - If \(U\) consists of the integers 1, 2, and 3:


    \(\forall x P(x) \equiv P(1) \land P(2) \land P(3)\)


    \(\exists x P(x) \equiv P(1) \lor P(2) \lor P(3)\)


    +   - Even if the domains are infinite, you can still think of the quantifiers
    in this fashion, but the equivalent expressions without quantifiers will be infinitely
    long.'
