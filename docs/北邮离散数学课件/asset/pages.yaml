- pgno: 1442
  md: '# Graph Isomorphism


    +   - Formal definition:

    +     - Simple graphs $G_1=(V_1, E_1)$ and $G_2=(V_2, E_2)$ are *isomorphic* iff
    $\exists$ a bijection $f:V_1\to V_2$ such that $\forall a,b\in V_1$, $a$ and $b$
    are adjacent in $G_1$ iff $f(a)$ and $f(b)$ are adjacent in $G_2$.

    +     - $f$ is the “renaming” function between the two node sets that makes the
    two graphs identical.

    +     - This definition can easily be extended to other types of graphs.'
  merge: -1
  img_proc: true
- pgno: 1443
  md: '# Graph Invariants under Isomorphism


    *Necessary* but not *sufficient* conditions for $G_1=(V_1, E_1)$ to be isomorphic
    to $G_2=(V_2, E_2)$:


    +   - We must have that $|V1|=|V2|$, and $|E1|=|E2|$.

    +   - The number of vertices with degree $n$ is the same in both graphs.

    +   - For every proper subgraph $g$ of one graph, there is a proper subgraph of
    the other graph that is isomorphic to $g$.'
  merge: -1
  img_proc: true
