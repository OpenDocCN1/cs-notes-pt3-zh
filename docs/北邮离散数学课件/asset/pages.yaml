- pgno: 104
  md: '# Block Ciphers


    +   - Ciphers that replace each letter of the alphabet by another letter are called
    *character* or *monoalphabetic* ciphers.

    +   - They are vulnerable to cryptanalysis based on letter frequency. *Block ciphers*
    avoid this problem, by replacing blocks of letters with other blocks of letters.

    +   - A simple type of block cipher is called the *transposition cipher*. The
    key is a permutation σ of the set {1,2,...,m}, where m is an integer, that is
    a one-to-one function from {1,2,...,m} to itself.

    +   - To encrypt a message, split the letters into blocks of size m, adding additional
    letters to fill out the final block. We encrypt p₁,p₂,...,pₘ as c₁,c₂,...,cₘ =
    pσ(1),pσ(2),...,pσ(m).

    +   - To decrypt the c₁,c₂,...,cₘ transpose the letters using the inverse permutation
    σ⁻¹.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Block Ciphers


    **Example:** Using the transposition cipher based on the permutation σ of the
    set {1,2,3,4} with σ(1) = 3, σ(2) = 1, σ(3) = 4, σ(4) = 2,


    +   a. Encrypt the plaintext PIRATE ATTACK

    +   b. Decrypt the ciphertext message SWUE TRAEOEHS, which was encrypted using
    the same cipher.


    # Solution:


    +   a. Split into four blocks PIRA TEAT TACK.

    +   Apply the permutation σ giving IAPR ETTA AKTC.

    +   b. σ⁻¹: σ⁻¹(1) = 2, σ⁻¹(2) = 4, σ⁻¹(3) = 1, σ⁻¹(4) = 3.

    +   Apply the permutation σ⁻¹ giving USEW ATER HOSE.

    +   Split into words to obtain USE WATER HOSE.'
