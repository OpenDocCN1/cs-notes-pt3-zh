- pgno: 2111
  md: '# Still More Functions


    +   - A *set* S over universe U can be viewed as a function from the elements
    of U to {T, F}, saying for each element of U whether it is in S. S={3} ⇒ S(0)=F,
    S(3)=T.


    +   - A *set operator* such as ∩, ∪, or complement can be viewed as a function
    from pairs of sets to sets.

    +     - Example: ∩({{1,3},{3,4}}) = {3}'
  merge: -1
