- pgno: 234
  md: '# Equivalence Laws - Examples


    +   - *Identity:* $p \land T \Leftrightarrow p$    $p \lor F \Leftrightarrow p$

    +   - *Domination:* $p \lor T \Leftrightarrow T$    $p \land F \Leftrightarrow
    F$

    +   - *Idempotence:* $p \lor p \Leftrightarrow p$    $p \land p \Leftrightarrow
    p$

    +   - *Double negation:* $\lnot \lnot p \Leftrightarrow p$

    +   - *Commutativity:* $p \lor q \Leftrightarrow q \lor p$    $p \land q \Leftrightarrow
    q \land p$

    +   - *Associativity:* $(p \lor q) \lor r \Leftrightarrow p \lor (q \lor r)$

    +     $(p \land q) \land r \Leftrightarrow p \land (q \land r)$'
