- pgno: 2007
  md: '# Common Fallacies


    +   - A *fallacy* is an inference rule or other proof method that is not logically
    valid.

    +     - A fallacy may yield a false conclusion!

    +   - Fallacy of *affirming the conclusion*:

    +     - “*p*→*q* is true, and *q* is true, so *p* must be true.” (No, because
    **F**→**T** is true.)

    +   - Fallacy of *denying the hypothesis*:

    +     - “*p*→*q* is true, and *p* is false, so *q* must be false.” (No, again
    because **F**→**T** is true.)'
  merge: -1
  img_proc: true
- pgno: 2008
  md: '# Circular Reasoning


    +   The fallacy of (explicitly or implicitly) assuming the very statement you
    are trying to prove in the course of its proof. Example:


    +   Prove that an integer $n$ is even, if $n^2$ is even.


    +   **Attempted proof:** “Assume $n^2$ is even. Then $n^2=2k$ for some integer
    $k$. Dividing both sides by $n$ gives $n = (2k)/n = 2(k/n)$. So there is an integer
    $j$ (namely $k/n$) such that $n=2j$. Therefore $n$ is even.”


    +   Circular reasoning


    > Begs the question: How do you show that $j=k/n=n/2$ is an integer, without first
    assuming that $n$ is even?'
  merge: -1
  img_proc: true
- pgno: 2009
  md: '# A Correct Proof


    We know that $n$ must be either odd or even. If $n$ were odd, then $n^2$ would
    be odd, since an odd number times an odd number is always an odd number. Since
    $n^2$ is even, it is not odd, since no even number is also an odd number. Thus,
    by modus tollens, $n$ is not odd either. Thus, by disjunctive syllogism, $n$ must
    be even. ■


    This proof is correct, but not quite complete, since we used several lemmas without
    proving them. Can you identify what they are?'
  merge: -1
  img_proc: true
- pgno: 2010
  md: '# A More Verbose Version


    Uses some number theory we haven’t defined yet.


    Suppose n² is even ∴ 2|n² ∴ n² mod 2 = 0. Of course n mod 2 is either 0 or 1.
    If it’s 1, then n≡1 (mod 2), so n²≡1 (mod 2), using the theorem that if a≡b (mod
    m) and c≡d (mod m) then ac≡bd (mod m), with a=c=n and b=d=1. Now n²≡1 (mod 2)
    implies that n² mod 2 = 1. So by the hypothetical syllogism rule, (n mod 2 = 1)
    implies (n² mod 2 = 1). Since we know n² mod 2 = 0 ≠ 1, by modus tollens we know
    that n mod 2 ≠ 1. So by disjunctive syllogism we have that n mod 2 = 0 ∴ 2|n ∴
    n is even.'
