- pgno: 110
  md: '# RSA Encryption


    +   - To encrypt a message using RSA using a key (n,e) :

    +     i. Translate the plaintext message M into sequences of two digit integers
    representing the letters. Use 00 for A, 01 for B, etc.

    +     ii. Concatenate the two digit integers into strings of digits.

    +     iii. Divide this string into equally sized blocks of 2N digits where 2N
    is the largest even number 2525...25 with 2N digits that does not exceed n.

    +     iv. The plaintext message M is now a sequence of integers m₁,m₂,...,mₖ.

    +     v. Each block (an integer) is encrypted using the function C = Mᵉ mod n.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# RSA Encryption


    **Example**: Encrypt the message STOP using the RSA cryptosystem with key(2537,13).


    +   - 2537 = 43·59,

    +   - p = 43 and q = 59 are primes and gcd(e,(p-1)(q-1)) = gcd(13, 42·58) = 1.


    **Solution**: Translate the letters in STOP to their numerical equivalents 18
    19 14 15.


    +   - Divide into blocks of four digits (because 2525 < 2537 < 252525) to obtain
    1819 1415.

    +   - Encrypt each block using the mapping C = M^13 mod 2537.

    +   - Since 1819^13 mod 2537 = 2081 and 1415^13 mod 2537 = 2182, the encrypted
    message is 2081 2182.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# RSA Decryption


    +   - To decrypt a RSA ciphertext message, the decryption key $d$, an inverse
    of $e$ modulo $(p-1)(q-1)$ is needed. The inverse exists since gcd$(e,(p-1)(q-1))
    = gcd(13, 42·58) = 1.$

    +   - With the decryption key $d$, we can decrypt each block with the computation
    $M = C^d \mod p·q.$ (see text for full derivation)

    +   - RSA works as a public key system since the only known method of finding
    $d$ is based on a factorization of $n$ into primes. There is currently no known
    feasible method for factoring large numbers into primes.'
  merge: -1
  img_proc: true
