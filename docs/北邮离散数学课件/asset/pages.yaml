- pgno: 2230
  md: '# Halting Problem


    +   - Now we call K with K as input, i.e. K(K).

    +     - If the output of H(K,K) is “loops forever” then K(K) halts.

    +       A Contradiction.

    +     - If the output of H(K,K) is “halts” then K(K) loops forever.

    +       A Contradiction.

    +   - Therefore, there can not be a procedure that can decide whether or not an
    arbitrary program halts. The halting problem is unsolvable.'
  merge: -1
