- pgno: 69
  md: "# Linear Congruences\n\n**Definition:** A congruence of the form\n$a x \\equiv\
    \ b(\\mod m)$, \nwhere $m$ is a positive integer, $a$ and $b$ are integers, and\
    \ $x$ is a variable, is called a *linear congruence*.\n\n+   - The solutions to\
    \ a linear congruence $a x \\equiv b(\\mod m)$ are all integers $x$ that satisfy\
    \ the congruence.\n\n**Definition:** An integer $\\bar{a}$ such that $\\bar{a}\
    \ a \\equiv 1(\\mod m)$ is said to be an *inverse* of $a$ modulo $m$.\n**Example:**\
    \ 5 is an inverse of 3 modulo 7 since $5 \\cdot 3 = 15 \\equiv 1(\\mod 7)$\n\n\
    +   - One method of solving linear congruences makes use of an inverse $\\bar{a}$,\
    \ if it exists. Although we can not divide both sides of the congruence by $a$,\
    \ we can multiply by $\\bar{a}$ to solve for $x$."
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Inverse of a modulo m


    The following theorem guarantees that an inverse of a modulo m exists whenever
    a and m are relatively prime. Two integers a and b are relatively prime when gcd(a,b)
    = 1.


    Theorem 1: If a and m are relatively prime integers and m > 1, then an inverse
    of a modulo m exists. Furthermore, this inverse is unique modulo m. (This means
    that there is a unique positive integer ā less than m that is an inverse of a
    modulo m and every other inverse of a modulo m is congruent to ā modulo m.)


    Proof: Since gcd(a,m) = 1, by Theorem 6 of Section 4.3, there are integers s and
    t such that sa + tm = 1.


    +   - Hence, sa + tm ≡ 1 ( mod m).

    +   - Since tm ≡ 0 ( mod m), it follows that sa ≡ 1 ( mod m)

    +   - Consequently, s is an inverse of a modulo m.

    +   - The uniqueness of the inverse is Exercise 7.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Finding Inverses


    The Euclidean algorithm and Bézout coefficients gives us a systematic approaches
    to finding inverses.


    **Example:** Find an inverse of 3 modulo 7.


    **Solution:** Because gcd(3,7) = 1, by Theorem 1, an inverse of 3 modulo 7 exists.


    +   - Using the Euclidian algorithm: 7 = 2·3 + 1.

    +   - From this equation, we get −2·3 + 1·7 = 1, and see that −2 and 1 are Bézout
    coefficients of 3 and 7.

    +   - Hence, −2 is an inverse of 3 modulo 7.

    +   - Also every integer congruent to −2 modulo 7 is an inverse of 3 modulo 7,
    i.e., 5, −9, 12, etc.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Finding Inverses\n\nExample: Find an inverse of 101 modulo 4620.\n\nSolution:\
    \ First use the Euclidian algorithm to show that gcd(101,4620) = 1.\n\nWorking\
    \ Backwards:\n\n4620 = 45·101 + 75\n101 = 1·75 + 26\n75 = 2·26 + 23\n26 = 1·23\
    \ + 3\n23 = 7·3 + 2\n3 = 1·2 + 1\n2 = 2·1\n\n1 = 3 − 1·2\n1 = 3 − 1·(23 − 7·3)\
    \ = −1·23 + 8·3\n1 = −1·23 + 8·(26 − 1·23) = 8·26 − 9·23\n1 = 8·26 − 9·(75 − 2·26)\
    \ = 26·26 − 9·75\n1 = 26·(101 − 1·75) − 9·75\n  = 26·101 − 35·75\n1 = 26·101 −\
    \ 35·(4620 − 45·101)\n  = −35·4620 + 1601·101\n\nSince the last nonzero remainder\
    \ is 1, gcd(101,4260) = 1\n\nBézout coefficients : −35 and 1601\n\n1601 is an\
    \ inverse of 101 modulo 4620"
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Using Inverses to Solve Congruences


    +   - We can solve the congruence $ax \equiv b \pmod m$ by multiplying both sides
    by $\bar{a}$.


    **Example:** What are the solutions of the congruence $3x \equiv 4 \pmod 7$?


    **Solution:** We found that $-2$ is an inverse of $3$ modulo $7$ (two slides back).
    We multiply both sides of the congruence by $-2$ giving


    $$-2 \cdot 3x \equiv -2 \cdot 4 \pmod 7.$$


    Because $-6 \equiv 1 \pmod 7$ and $-8 \equiv 6 \pmod 7$, it follows that if $x$
    is a solution, then $x \equiv -8 \equiv 6 \pmod 7$.


    We need to determine if every $x$ with $x \equiv 6 \pmod 7$ is a solution. Assume
    that $x \equiv 6 \pmod 7$. By Theorem 5 of Section 4.1, it follows that $3x \equiv
    3 \cdot 6 = 18 \equiv 4 \pmod 7$, which shows that all such $x$ satisfy the congruence.


    The solutions are the integers $x$ such that $x \equiv 6 \pmod 7$, namely, $6,
    13, 20, \ldots$ and $-1, -8, -15, \ldots$.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# The Chinese Remainder Theorem


    +   - In the first century, the Chinese mathematician Sun-Tsu asked:

    +     There are certain things whose number is unknown. When divided by 3, the
    remainder is 2; when divided by 5, the remainder is 3; when divided by 7, the
    remainder is 2. What will be the number of things?

    +   - This puzzle can be translated into the solution of the system of congruences:

    +     x ≡ 2 ( mod 3),

    +     x ≡ 3 ( mod 5),

    +     x ≡ 2 ( mod 7)?

    +   - We’ll see how the theorem that is known as the *Chinese Remainder Theorem*
    can be used to solve Sun-Tsu’s problem.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# The Chinese Remainder Theorem


    **Theorem 2:** *(The Chinese Remainder Theorem)* Let $m_1,m_2,\ldots,m_n$ be pairwise
    relatively prime positive integers greater than one and $a_1,a_2,\ldots,a_n$ arbitrary
    integers. Then the system


    $$\begin{aligned}

    x &\equiv a_1 \pmod{m_1}\\

    x &\equiv a_2 \pmod{m_2}\\

    &\ \vdots\\

    &\ \vdots\\

    &\ \ \vdots\\

    x &\equiv a_n \pmod{m_n}

    \end{aligned}$$


    has a unique solution modulo $m=m_1m_2\cdots m_n$. (That is, there is a solution
    $x$ with $0\leq x<m$ and all other solutions are congruent modulo $m$ to this
    solution.)


    +   - **Proof:** We’ll show that a solution exists by describing a way to construct
    the solution. Showing that the solution is unique modulo $m$ is Exercise 30.


    *continued →*'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# The Chinese Remainder Theorem


    To construct a solution first let $M_k = m / m_k$ for $k = 1,2,...,n$ and $m =
    m_1 m_2 \cdots m_n$.


    Since $\gcd(m_k, M_k) = 1$, by Theorem 1, there is an integer $y_k$, an inverse
    of $M_k$ modulo $m_k$, such that $M_k y_k \equiv 1 \pmod{m_k}$.


    Form the sum $x = a_1 M_1 y_1 + a_2 M_2 y_2 + \cdots + a_n M_n y_n$.


    Note that because $M_j \equiv 0 \pmod{m_k}$ whenever $j \neq k$, all terms except
    the $k$th term in this sum are congruent to 0 modulo $m_k$.


    Because $M_k y_k \equiv 1 \pmod{m_k}$, we see that $x \equiv a_k M_k y_k \equiv
    a_k \pmod{m_k}$, for $k = 1,2,...,n$.


    Hence, $x$ is a simultaneous solution to the $n$ congruences.


    +   x ≡ a₁ ( mod m₁)

    +   x ≡ a₂ ( mod m₂)

    +   .

    +   .

    +   x ≡ aₙ ( mod mₙ)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# The Chinese Remainder Theorem


    Example: Consider the 3 congruences from Sun-Tsu’s problem:


    x ≡ 2 ( mod 3), x ≡ 3 ( mod 5), x ≡ 2 ( mod 7).


    +   - Let m = 3·5·7 = 105, M₁ = m/3 = 35, M₃ = m/5 = 21, M₃ = m/7 = 15.

    +   - We see that

    +     - 2 is an inverse of M₁ = 35 modulo 3 since 35·2 ≡ 2·2 ≡ 1 (mod 3)

    +     - 1 is an inverse of M₂ = 21 modulo 5 since 21 ≡ 1 (mod 5)

    +     - 1 is an inverse of M₃ = 15 modulo 7 since 15 ≡ 1 (mod 7)

    +   - Hence,

    +     x = a₁M₁y₁ + a₂M₂y₂ + a₃M₃y₃

    +     = 2·35·2 + 3·21·1 + 2·15·1 = 233 ≡ 23 (mod 105)

    +   - We have shown that 23 is the smallest positive integer that is a simultaneous
    solution. Check it!'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Back Substitution


    We can also solve systems of linear congruences with pairwise relatively prime
    moduli by rewriting a congruences as an equality using Theorem 4 in Section 4.1,
    substituting the value for the variable into another congruence, and continuing
    the process until we have worked through all the congruences. This method is known
    as back substitution.


    Example: Use the method of back substitution to find all integers x such that
    x ≡ 1 (mod 5), x ≡ 2 (mod 6), and x ≡ 3 (mod 7).


    Solution: By Theorem 4 in Section 4.1, the first congruence can be rewritten as
    x = 5t + 1, where t is an integer.


    +   - Substituting into the second congruence yields 5t + 1 ≡ 2 (mod 6).

    +   - Solving this tells us that t ≡ 5 (mod 6).

    +   - Using Theorem 4 again gives t = 6u + 5 where u is an integer.

    +   - Substituting this back into x = 5t + 1, gives x = 5(6u + 5) + 1 = 30u +
    26.

    +   - Inserting this into the third equation gives 30u + 26 ≡ 3 (mod 7).

    +   - Solving this congruence tells us that u ≡ 6 (mod 7).

    +   - By Theorem 4, u = 7v + 6, where v is an integer.

    +   - Substituting this expression for u into x = 30u + 26, tells us that x =
    30(7v + 6) + 26 = 210u + 206.


    Translating this back into a congruence we find the solution x ≡ 206 (mod 210).'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Although the construction in Theorem 2 provides a general method for solving
    systems of linear congruences with pairwise relatively prime moduli, it can be
    easier to solve a system using a different method. Example 6 illustrates the use
    of a method known as back substitution.


    # EXAMPLE 6


    Use the method of back substitution to find all integers x such that x ≡ 1 (mod
    5), x ≡ 2 (mod 6), and x ≡ 3 (mod 7).


    Solution: By Theorem 4 in Section 4.1, the first congruence can be rewritten as
    an equality, x = 5t + 1 where t is an integer. Substituting this expression for
    x into the second congruence tells us that


    5t + 1 ≡ 2 (mod 6)


    which can be easily solved to show that t ≡ 5 (mod 6) (as the reader should verify).
    Using Theorem 4 in Section 4.1 again, we see that t = 6u + 5 where u is an integer.
    Substituting this expression for t back into the equation x = 5t + 1 tells us
    that x = 5(6u + 5) + 1 = 30u + 26. We insert this into the third equation to obtain


    30u + 26 ≡ 3 (mod 7)


    Solving this congruence tells us that u ≡ 6 (mod 7) (as the reader should verify).
    Hence, Theorem 4 in Section 4.1 tells us that u = 7v + 6 where v is an integer.
    Substituting this expression for u into the equation x = 30u + 26 tells us that
    x = 30(7v + 6) + 26 = 210u + 206. Translating this back into a congruence, we
    find the solution to the simultaneous congruences,


    x ≡ 206 (mod 210)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Computer Arithmetic with large Integers


    # Computer Arithmetic with Large Integers


    Suppose that m₁, m₂, …, mₙ are pairwise relatively prime moduli and let m be their
    product. By the Chinese remainder theorem, we can show (see Exercise 28) that
    an integer a with 0 ≤ a < m can be uniquely represented by the n-tuple consisting
    of its remainders upon division by mᵢ, i = 1, 2, …, n. That is, we can uniquely
    represent a by


    (a mod m₁, a mod m₂, …, a mod mₙ).


    # EXAMPLE 7


    What are the pairs used to represent the nonnegative integers less than 12 when
    they are represented by the ordered pair where the first component is the remainder
    of the integer upon division by 3 and the second component is the remainder of
    the integer upon division by 4?


    Solution: We have the following representations, obtained by finding the remainder
    of each integer when it is divided by 3 and by 4:


    0 = (0, 0)    4 = (1, 0)    8 = (2, 0)

    1 = (1, 1)    5 = (2, 1)    9 = (0, 1)

    2 = (2, 2)    6 = (0, 2)    10 = (1, 2)

    3 = (0, 3)    7 = (1, 3)    11 = (2, 3).'
  merge: -1
  img_proc: true
