- pgno: 2109
  md: '# Functions We’ve Seen So Far


    +   - A *proposition* can be viewed as a function from “situations” to truth values
    `{T,F}`.

    +     - A logic system called *situation theory*.

    +     - p=“It is raining.”; s=our situation here, now

    +     - p(s)∈{T,F}.

    +   - A *propositional operator* can be viewed as a function from *ordered pairs*
    of truth values to truth values: *e.g.*, √((F,T)) = T.


    > Another example: →((T,F)) = F.'
  merge: -1
  img_proc: true
- pgno: 2110
  md: '# More functions so far...


    +   - A *predicate* can be viewed as a function from *objects* to *propositions*
    (or truth values): $P :\equiv$ “is 7 feet tall”;

    +     $P$(Mike) = “Mike is 7 feet tall.” = **False**.

    +   - A *bit string* $B$ of length $n$ can be viewed as a function from the numbers
    {$1,\dots,n$} (bit *positions*) to the *bits* {$0,1$}.

    +     *E.g.,* $B=101$ ➔ $B(3)=1$.'
  merge: -1
