- pgno: 102
  md: '# Cryptanalysis of Affine Ciphers


    +   - The process of recovering plaintext from ciphertext without knowledge both
    of the encryption method and the key is known as *cryptanalysis* or *breaking
    codes*.

    +   - An important tool for cryptanalyzing ciphertext produced with a affine ciphers
    is the relative frequencies of letters. The nine most common letters in the English
    texts are E 13%, T 9%, A 8%, O 8%, I 7%, N 7%, S 7%, H 6%, and R 6%.

    +   - To analyze ciphertext:

    +     - Find the frequency of the letters in the ciphertext.

    +     - Hypothesize that the most frequent letter is produced by encrypting E.

    +     - If the value of the shift from E to the most frequent letter is *k*, shift
    the ciphertext by −*k* and see if it makes sense.

    +     - If not, try T as a hypothesis and continue.'
  merge: -1
  img_proc: true
