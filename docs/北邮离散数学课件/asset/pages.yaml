    注：


    +   （1）同一集合上的两个不同的半序关系，所构成两个半序集，如：


    R₁和R₂都定义在 A = { 1，2，3，4，5，6，7，8，9 } 上，但（A，R₁）与（A，R₂）显然不是一样的半序集。'
