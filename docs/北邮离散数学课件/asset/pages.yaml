- pgno: 1946
  md: '# 常见推理定律


    +   - 附加律  $A \Rightarrow (A \lor B)$

    +   - 化简律  $(A \land B) \Rightarrow A$

    +   - 假言推理  $(A \rightarrow B) \land A \Rightarrow B$

    +   - 拒取式  $(A \rightarrow B) \land \lnot B \Rightarrow \lnot A$

    +   - 析取三段论  $(A \lor B) \land \lnot B \Rightarrow A$

    +   - 假言三段论  $(A \rightarrow B) \land (B \rightarrow C) \Rightarrow (A \rightarrow
    C)$

    +   - 等价三段论  $(A \leftrightarrow B) \land (B \leftrightarrow C) \Rightarrow (A
    \leftrightarrow C)$

    +   - 构造性两难  $(A \rightarrow B) \land (C \rightarrow D) \land (A \lor C) \Rightarrow
    (B \lor D)$

    +   - 构造性两难(特殊形式)  $(A \rightarrow B) \land (\lnot A \rightarrow B) \land (A \lor
    \lnot A) \Rightarrow B$

    +   - 破坏性两难  $(A \rightarrow B) \land (C \rightarrow D) \land (\lnot B \lor \lnot
    D) \Rightarrow (\lnot A \lor \lnot C)$'
  merge: -1
  img_proc: true
