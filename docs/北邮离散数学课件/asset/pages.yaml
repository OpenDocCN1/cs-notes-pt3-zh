  md: '# Selection Operators


    +   - Let A be any n-ary domain A=A₁×...×Aₙ, and let C:A→{T,F} be any condition
    (predicate) on elements (n-tuples) of A.


    +   - Then, the selection operator s_C is the operator that maps any (n-ary) relation
    R on A to the n-ary relation of all n-tuples from R that satisfy C.


    +   - I.e., ∀R⊆A, s_C(R) = {a∈R | s_C(a) = T}'
