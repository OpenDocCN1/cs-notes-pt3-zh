  md: '# Zero-One Reflexive, Symmetric


    +   - Terms: *Reflexive, non-reflexive, irreflexive, symmetric, asymmetric, and
    antisymmetric.*

    +     - These relation characteristics are very easy to recognize by inspection
    of the zero-one matrix.


    Reflexive: all 1’s on diagonal


    Irreflexive: all 0’s on diagonal


    Symmetric: all identical across diagonal


    Antisymmetric: all 1’s are across from 0’s'
