  md: '# linear order（线序关系）


    +   - If (*A*, ≤) is a poset, the elements *a* and *b* are said to be

    +     - *Comparable*（可比的） if *a* ≤ *b* or *b* ≤ *a*.

    +     - *incomparable*（不可比的） if neither *a* ≤ *b* nor *b* ≤ *a*.

    +   - If every pair of elements in a poset *A* is comparable, we say that *A*
    is a *linearly ordered set*（全序集合）, and the partial order is called a *linear order*（全序关系或线序关系）.
    We also say that A is a *chain*（链）.

    +     - (*Z*⁺, ≤)

    +     - (*Z*⁺, |) is not a chain.'
  merge: -1
  img_proc: true
- pgno: 1259
  md: '# Well- ordered（良序关系）


    +   - $(S, \leqslant)$ is a well-ordered set if it is a poset such that $\leqslant$
    is a total ordering and every nonempty subset of $S$ has a least element.'
  merge: -1
  img_proc: true
- pgno: 1260
  md: '# Product partial order

    （乘积偏序）


    If $(A,\leq)$ and $(B,\leq)$ are posets, then $(A\times B,\leq)$ is a poset, with
    partial order $\leq$ defined by

    $(a,b)\leq(a'',b'')$ if $a\leq a''$ in $A$ and $b\leq b''$ in $B.$


    +   - This ordering is called *product partial order*.'
  merge: -1
  img_proc: true
- pgno: 1261
  md: '# Lexicographic order


    # （词典顺序）


    If (A, ≤) and (B, ≤) are poset, then (A × B, ≺) is a poset, with partial order
    ≺ defined by

    (a, b) ≺ (a′, b′) if a < a′ or if a = a′ and b ≤ b′.


    +   - This ordering is called *lexicographic*, or “*dictionary*” order.


    +   - Extended to Cartesian products

    +     A₁×A₂...×Aₙ


    +   - Ordinary alphabet  help≺helping  helper ≺helping'
  merge: -1
  img_proc: true
