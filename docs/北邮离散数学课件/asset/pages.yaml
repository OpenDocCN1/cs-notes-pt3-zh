- pgno: 1608
  md: '# Remarks


    +   - The problem we have been considering has a number of important variations.
    In one case, the edges may have *weights* representing distance, cost, and the
    like. The problem is then to find a Hamiltonian circuit (or path) for which the
    total sum of weights in the path is a minimum. For example, the vertices might
    represent cities, the edges, lines of transportation; and the weight of an edge,
    the cost of traveling along that edge. This version of the problem is often called
    *the traveling salesperson problem*.'
  merge: -1
  img_proc: true
- pgno: 1609
  md: '# 应用问题: 旅行商问题 (TSP)

    Traveling Salesman Problem


    问题: 从某地出发, 恰好一次经过 n 个城市回到原地, 寻找最短的道路。


    实质: 无向简单加权图, 寻找最短 H 回路的的问题。


    # 说明:


    +   (1) 不一定存在, 若无向图是完全图则存在。


    +   (2) 图是连通的, 两个城市间总有路, 若以两城市间交通费用作为边的权, 则是无向图的H回路问题.'
  merge: -1
  img_proc: true
- pgno: 1610
  md: '# 无向加权完全图的最近邻域算法/Approximation:


    +   1. 从任一顶点出发，记为 V₁，找一个与 V₁ 最近的顶点 V₂，（V₁，V₂）为两个顶点的基本道路。

    +   2. 若找出有 p 个顶点的基本道路

    +      （V₁，V₂，...，Vₚ），p < n，在道路外找一个离 Vₚ 最近的顶点，记为 Vₚ₊₁，将其加入则得到具有 P+1 个顶点的基本道路。

    +   3. 若 p + 1 = n，转 4，否则转 2。

    +   4. 闭合 H 回路：即增加一条边（Vₙ，V₁），则（V₁，V₂，...，Vₙ，V₁）为一条近似的最短回路。'
  merge: -1
  img_proc: true
- pgno: 1611
  md: '# 说明：


    +   (1) 找最近一个顶点不唯一时，按序取。

