- pgno: 291
  md: '# Solving Satisfiability Problems


    +   - To solve a Sudoku puzzle, we need to find an assignment of truth values
    to the 729 variables of the form *p(i,j,n)* that makes the conjunction of the
    assertions true. Those variables that are assigned T yield a solution to the puzzle.

    +   - A truth table can always be used to determine the satisfiability of a compound
    proposition. But this is too complex even for modern computers for large problems.

    +   - There has been much work on developing efficient methods for solving satisfiability
    problems as many practical problems can be translated into satisfiability problems.'
