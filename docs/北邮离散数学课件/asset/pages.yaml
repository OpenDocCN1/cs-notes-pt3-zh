- pgno: 7
  md: '# Division Algorithm


    When an integer is divided by a positive integer, there is a quotient and a remainder.
    This is traditionally called the “Division Algorithm,” but is really a theorem.


    **Division Algorithm:** If *a* is an integer and *d* a positive integer, then
    there are unique integers *q* and *r*, with 0 ≤ *r* < *d*, such that *a* = *d
    q* + *r* (*proved in Section 5.2*).


    +   - *d* is called the *divisor*.

    +   - *a* is called the *dividend*.

    +   - *q* is called the *quotient*.

    +   - *r* is called the *remainder*.


    Definitions of Functions

    **div** and **mod**

    *q* = *a* **div** *d*

    *r* = *a* **mod** *d*


    **Examples:**


    +   - What are the quotient and remainder when 101 is divided by 11?

    +     **Solution:** The quotient when 101 is divided by 11 is 9 = 101 **div**
    11, and the remainder is 2 = 101 **mod** 11.

    +   - What are the quotient and remainder when −11 is divided by 3?

    +     **Solution:** The quotient when −11 is divided by 3 is −4 = −11 **div**
    3, and the remainder is 1 = −11 **mod** 3.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Congruence Relation


    **Definition:** If *a* and *b* are integers and *m* is a positive integer, then
    *a* is congruent to *b* modulo *m* if *m* divides *a* − *b*.


    +   - The notation *a* ≡ *b* (mod *m*) says that *a* is congruent to *b* modulo
    *m*.

    +   - We say that *a* ≡ *b* (mod *m*) is a congruence and that *m* is its modulus.

    +   - Two integers are congruent mod *m* if and only if they have the same remainder
    when divided by *m*.

    +   - If *a* is not congruent to *b* modulo *m*, we write

    +     *a* ≢ *b* (mod *m*)


    **Example:** Determine whether 17 is congruent to 5 modulo 6 and whether 24 and
    14 are congruent modulo 6.


    # Solution:


    +   - 17 ≡ 5 (mod 6) because 6 divides 17 − 5 = 12.

    +   - 24 ≢ 14 (mod 6) since 6 divides 24 − 14 = 10 is not divisible by 6.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# More on Congruences


    Theorem 4: Let m be a positive integer. The integers a and b are congruent modulo
    m if and only if there is an integer k such that a = b + km.


    # Proof:


    +   - If a ≡ b (mod m), then (by the definition of congruence) m | a − b. Hence,
    there is an integer k such that a − b = km and equivalently a = b + km.


    +   - Conversely, if there is an integer k such that a = b + km, then km = a −
    b. Hence, m | a − b and a ≡ b (mod m).'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# The Relationship between (mod m) and mod m Notations


    +   - The use of “mod” in a ≡ b (mod m) and a mod m = b are different.

    +     - a ≡ b (mod m) is a relation on the set of integers.

    +     - In a mod m = b, the notation mod denotes a function.

    +   - The relationship between these notations is made clear in this theorem.

    +   - Theorem 3: Let a and b be integers, and let m be a positive integer. Then
    a ≡ b (mod m) if and only if a mod m = b mod m. (Proof in the exercises)'
