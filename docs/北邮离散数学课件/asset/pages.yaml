  md: '# Introduction to Set Theory

    集合论(§ 2.1)


    +   - A *set* is a new type of structure, representing an *unordered* collection
    (group, plurality) of zero or more *distinct* (different) objects.


    +   - Set theory deals with operations between, relations among, and statements
    about sets.


    +   - Sets are ubiquitous in computer software systems.


    +   - *All* of mathematics can be defined in terms of some form of set theory
    (using predicate logic).'
  merge: -1
  img_proc: true
- pgno: 2061
  md: '# # Naïve set theory


    +   - **Basic premise:** Any collection or class of objects (*elements*) that
    we can *describe* (by any means whatsoever) constitutes a set.


    +   - But, the resulting theory turns out to be *logically inconsistent!*


    +     - This means, there exist naïve set theory propositions *p* such that you
    can prove that both *p* and ¬*p* follow logically from the axioms of the theory!

    +     - ∴ The conjunction of the axioms is a contradiction!

    +     - This theory is fundamentally uninteresting, because any possible statement
    in it can be (very trivially) “proved” by contradiction!


    +   - More sophisticated set theories fix this problem.'
  merge: -1
  img_proc: true
