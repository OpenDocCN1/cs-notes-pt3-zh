- pgno: 2134
  md: '# Plots with floor/ceiling


    +   - Note that for $f(x)=\lfloor x \rfloor$, the graph of $f$ includes the point
    $(a, 0)$ for all values of $a$ such that $a\ge0$ and $a<1$, but not for the value
    $a=1$.

    +   - We say that the set of points $(a,0)$ that is in $f$ does not include its
    *limit* or *boundary* point $(a,1)$.

    +     - Sets that do not include all of their limit points are generally called
    *open sets*.

    +   - In a plot, we draw a limit point of a curve using an open dot (circle) if
    the limit point is not on the curve, and with a closed (solid) dot if it is on
    the curve.'
