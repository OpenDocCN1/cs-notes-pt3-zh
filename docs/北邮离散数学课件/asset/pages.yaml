- pgno: 2160
  md: '# Geometric Sum Derivation


    +   - Here we go...


    S = Σ_{i=0}^{n} a r^{i}

    r S = r Σ_{i=0}^{n} a r^{i} = Σ_{i=0}^{n} r a r^{i} = Σ_{i=0}^{n} a r r^{i} =
    Σ_{i=0}^{n} a r^{1} r^{i}

    = Σ_{i=0}^{n} a r^{1+i} = Σ_{i=1}^{n+1} a r^{1+(i-1)} = Σ_{i=1}^{n+1} a r^{i}

    = ( Σ_{i=1}^{n} a r^{i} ) + ( Σ_{i=n+1}^{n+1} a r^{i} ) = ( Σ_{i=1}^{n} a r^{i}
    ) + a r^{n+1} = ...'
  merge: -1
  img_proc: true
- pgno: 2161
  md: '# Derivation example cont...


    rS = (∑_{i=1}^{n} a r^{i}) + a r^{n+1} = (a r^{0} - a r^{0}) + (∑_{i=1}^{n} a
    r^{i}) + a r^{n+1}

    = a r^{0} + (∑_{i=1}^{n} a r^{i}) + a r^{n+1} - a r^{0}

    = (∑_{i=0}^{0} a r^{i}) + (∑_{i=1}^{n} a r^{i}) + a r^{n+1} - a

    = (∑_{i=0}^{n} a r^{i}) + a (r^{n+1} - 1) = S + a (r^{n+1} - 1)'
  merge: -1
  img_proc: true
- pgno: 2162
  md: '# Concluding long derivation...


    rS = S + a(r^{n+1} - 1)


    rS - S = a(r^{n+1} - 1)


    S(r - 1) = a(r^{n+1} - 1)


    S = a\left(\frac{r^{n+1} - 1}{r - 1}\right) \quad \text{when } r \neq 1


    When r = 1, S = \sum_{i=0}^{n} a r^{i} = \sum_{i=0}^{n} a 1^{i} = \sum_{i=0}^{n}
    a \cdot 1 = (n+1)a'
