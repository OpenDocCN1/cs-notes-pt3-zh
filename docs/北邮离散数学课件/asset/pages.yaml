- pgno: 2176
  md: '# Do Uncountable Sets Really Exist?


    +   - The set of objects that can be defined using finite-length strings of symbols
    (“descriptions”) is only *countable*.

    +   - Therefore, any uncountable set must consist primarily of elements which
    individually have *no* finite descriptions.

    +   - Löwenheim-Skolem theorem: No consistent theory can ever *force* an interpretation
    involving uncountables.

    +   - The “constructivist school” asserts that only objects constructible from
    finite descriptions exist. (*e.g.* ¬∃ℝ)

    +   - Most mathematicians are happy to use uncountable sets anyway, because postulating
