- pgno: 2139
  md: '# Sequences


    +   - A *sequence* or *series* {$a_n$} is identified with a *generating function*
    $f:S\to A$ for some subset $S\subseteq\mathbf{N}$ and for some set $A$.

    +     - Often we have $S=\mathbf{N}$ or $S=\mathbf{Z}^+=\mathbf{N}\setminus\{0\}$.

    +     - Sequences may also be generalized to *indexed sets*, in which the set
    $S$ does not have to be a subset of $\mathbf{N}$.

    +       - For general indexed sets, $S$ may not even be a set of numbers at all.


    +   - If $f$ is a generating function for a series {$a_n$}, then for $n\in S$,
    the symbol $a_n$ denotes $f(n)$, also called *term $n$* of the sequence.

    +     - The *index* of $a_n$ is $n$. (Or, often $i$ is used.)


    +   - A series is sometimes denoted by listing its first and/or last few elements,
    and using ellipsis (...) notation.

    +     - E.g., “{$a_n$} = 0, 1, 4, 9, 16, 25, ...” is taken to mean $\forall n\in\mathbf{N}$,
    $a_n = n^2$.'
  merge: -1
  img_proc: true
- pgno: 2140
  md: '# Sequence Examples


    +   - Some authors write “the sequence $a_1$, $a_2$, ...” instead of {$a_n$},
    to ensure that the set of indices is clear.

    +     - Be careful: Our book often leaves the indices ambiguous.

    +   - An example of an infinite series:

    +     - Consider the series {$a_n$} = $a_1$, $a_2$, ..., where $(\forall n\ge1)$
    $a_n = f(n) = 1/n$.

    +     - Then, we have {$a_n$} = 1, 1/2, 1/3, ...'
  merge: -1
  img_proc: true
- pgno: 2141
  md: '# Example with Repetitions


    +   - Like tuples, but unlike sets, a sequence may contain *repeated* instances
    of an element.

    +   - Consider the sequence {b_n} = b_0, b_1, ... (note that 0 is an index) where
    b_n = (-1)^n.

    +     - Thus, {b_n} = 1, -1, 1, -1, ...

    +       - Note repetitions!

    +     - This {b_n} denotes an infinite sequence of 1’s and −1’s, *not* the 2-element
    set {1, −1}.'
