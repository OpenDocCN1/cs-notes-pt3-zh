  md: '# IP Address Example


    Some facts about the Internet Protocol, version 4:


    +   - Valid computer addresses are in one of 3 types:

    +     - A class A IP address contains a 7-bit “netid” ≠ 1?, and a 24-bit “hostid"

    +     - A class B address has a 14-bit netid and a 16-bit hostid.

    +     - A class C addr. Has 21-bit netic and an 8-bit hostid.

    +   - The 3 classes have distinct headers (0, 10, 110)

    +   - Hostids that are all 0s or all 1s are not allowed.


    How many valid computer addresses are there?


    ![](img/c25dfd82fc242c2db53bc942dcad6885_599_0.png)


    e.g., bupt.edu is 123.127.134.30'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# IP address solution


    +   - (# addrs)

    +     = (# class A) + (# class B) + (# class C)

    +     (by sum rule)

    +   - # class A = (# valid netids)·(# valid hostids)

    +     (by product rule)

    +   - (# valid class A netids) = 2⁷ − 1 = 127.

    +   - (# valid class A hostids) = 2²⁴ − 2 = 16,777,214.

    +   - Continuing in this fashion we find the answer is:

    +     3,737,091,842 (3.7 billion IP addresses)'
  merge: -1
