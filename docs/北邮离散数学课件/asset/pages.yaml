- pgno: 228
  md: '# What’s the difference between ↔ and ⇔ ?


    A ⇔ B says that no assignment of truth values to A and B can make A ↔ B false


    So, A ⇔ B can only hold between well-chosen compound A and B. For example, p∨q
    ⇔ ¬(¬p ∧ ¬q).


    A ↔ B says that A and B happen to have the same truth value. For example,


    A=2+2=4. B=I teach at BUPT.


    A=2+2=4. B=I teach at BUPT or BIT.'
