- pgno: 1729
  md: '+   - Let N be a network and let G be the symmetric closure of N.

    +     - Choose a path in G and let an edge (i,j) in this path.

    +     - If (i,j) ∈ N and e_ij = C_ij - F_ij > 0, then we say this edge has positive
    excess capacity.

    +     - If (i,j) is not an edge of N then we are traveling this edge in the wrong
    direction. E_ij = F_ji if F_ji > 0. Increasing flow through edge(i,j) will have
    the effect of reducing F_ji.'
  merge: -1
  img_proc: true
