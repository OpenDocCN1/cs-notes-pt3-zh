- pgno: 1866
  md: '# Preorder search（前序遍历）


    +   - Algorithm preorder

    +     - Step 1　visit **v**.

    +     - Step 2　if v_L exists, then apply this algorithm to (T(v_L), v_L).

    +     - Step 3　if v_R exists, then apply this algorithm to (T(v_R), v_R).

    +     - end of algorithm'
  merge: -1
  img_proc: true
- pgno: 1867
  md: '# Inorder（中序遍历）


    +   - Algorithm inorder

    +     - Step 1 search the left subtree(T(v_L), v_L), if it exists.

    +     - Step 2 visit the root v.

    +     - Step 3 search the right subtree(T(v_R), v_R), if it exists.

    +     - end of algorithm'
  merge: -1
  img_proc: true
- pgno: 1868
  md: '# Postorder（后序遍历）


    +   - **Algorithm postorder**

    +     - Step 1 search the left subtree(T(v<sub>L</sub>), v<sub>L</sub>), if it
    exists.

    +     - Step 2. search the right subtree(T(v<sub>R</sub>), v<sub>R</sub>), if
    it exists.

    +     - Step 3. visit the root *v*.

    +     - end of algorithm'
  merge: -1
  img_proc: true
