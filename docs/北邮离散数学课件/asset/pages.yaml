  md: '由于平面图的区域比较难数（如果已能画成边不相交的图，则已明确是平面图了），对一些特殊的图，欧拉公式有以下推论。


    # [推论一]:


    如果 G = ( V，E ) 是连通的平面简单图且 v 大于等于 3，则有 e ≤ 3 v − 6 。'
