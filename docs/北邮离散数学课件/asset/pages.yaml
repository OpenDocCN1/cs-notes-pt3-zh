- pgno: 2217
  md: "# Insertion Sort\n\n*Insertion sort* begins with the 2nd element. It compares\
    \ the 2nd element with the 1st and puts it before the first if it is not larger.\n\
    \n+   - Next the 3rd element is put into the correct position among the first\
    \ 3 elements.\n+   - In each subsequent pass, the n+1st element is put into its\
    \ correct position among the first n+1 elements.\n+   - Linear search is used\
    \ to find the correct position.\n\n```\nprocedure insertion sort\n(a₁,...,aₙ:\n\
    \    real numbers with n ≥ 2)\nfor j := 2 to n\n    i := 1\n    while aⱼ > aᵢ\n\
    \        i := i + 1\n    m := aⱼ\n    for k := 0 to j − i − 1\n        aⱼ₋k :=\
    \ aⱼ₋k₋1\n    aᵢ := m\n{Now a₁,...,aₙ is in increasing order}\n```"
  merge: -1
  img_proc: true
