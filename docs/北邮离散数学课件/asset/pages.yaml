    +   - Since union & intersection are commutative and associative, we can extend
    them from operating on *ordered pairs* of sets $(A,B)$ to operating on sequences
    of sets $(A_1,...,A_n)$, or even on unordered *sets* of sets, $X=\{A \mid P(A)\}$.'
