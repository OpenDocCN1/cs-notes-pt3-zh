  md: '# Chapter Motivation


    +   - *Number theory* is the part of mathematics devoted to the study of the integers
    and their properties.

    +   - Key ideas in number theory include divisibility and the primality of integers.

    +   - Representations of integers, including binary and hexadecimal representations,
    are part of number theory.

    +   - Number theory has long been studied because of the beauty of its ideas,
    its accessibility, and its wealth of open questions.

    +   - We’ll use many ideas developed in Chapter 1 about proof methods and proof
    strategy in our exploration of number theory.

    +   - Mathematicians have long considered number theory to be pure mathematics,
    but it has important applications to computer science and cryptography studied
    in Sections 4.5 and 4.6.'
