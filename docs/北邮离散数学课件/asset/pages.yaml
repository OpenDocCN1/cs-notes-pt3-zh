  md: '# Proof


    +   - If $a \in A$, then clearly $a$ is in the same block as itself; so $a R a$.

    +   - If $a R b$, then $a$ and $b$ are in the same block; so $b R a$.

    +   - If $a R b$ and $b R c$, then $a$, $b$, and $c$ must all lie in the same
    block of $\boldsymbol{P}$. Thus $a R c$.

    +   - Since $R$ is reflexive, symmetric, and transitive, R is an equivalence relation.

    +   - $R$ will be called the *equivalence relation determined by* $\boldsymbol{P}$.

    +   - QED'
  merge: -1
  img_proc: true
- pgno: 1221
  md: '# Example


    +   - Let $A = \{1, 2, 3, 4\}$ and consider the partition $\mathbf{P} = \{\{1,
    2, 3\}, \{4\}\}$ of $A$. Find the equivalence relation $R$ on $A$ determined by
    $\mathbf{P}$.

    +   - Solution

    +     - The blocks of $\mathbf{P}$ are $\{1, 2, 3\}$ and $\{4\}$.

    +     - Each element in a block is related to every other element in the same
    block and only to those elements.

    +     - Thus $R = \{(1, 1), (1, 2), (1, 3), (2, 1), (2, 2), (2, 3), (3, 1), (3,
    2), (3, 3), (4, 4)\}$.'
