- pgno: 1313
  md: '# Distributive lattice （分配格）


    +   - A lattice is called *distributive* if for any elements *a*, *b*, and *c*
    in *L* we have the following distributive properties.

    +     - $a \land (b \lor c) = (a \land b) \lor (a \land c)$

    +     - $a \lor (b \land c) = (a \lor b) \land (a \lor c)$

    +   - If L is not distributive, we say that *L* is *nondistributive*'
  merge: -1
