- pgno: 497
  md: '# An Incorrect “Proof” by Mathematical Induction


    **Example:** Let P(n) be the statement that every set of n lines in the plane,
    no two of which are parallel, meet in a common point. Here is a “proof” that P(n)
    is true for all positive integers n ≥ 2.


    +   BASIS STEP: The statement P(2) is true because any two lines in the plane
    that are not parallel meet in a common point.


    +   INDUCTIVE STEP: The inductive hypothesis is the statement that P(k) is true
    for the positive integer k ≥ 2, i.e., every set of k lines in the plane, no two
    of which are parallel, meet in a common point.


    +   We must show that if P(k) holds, then P(k + 1) holds, i.e., if every set of
    k lines in the plane, no two of which are parallel, k ≥ 2, meet in a common point,
    then every set of k + 1 lines in the plane, no two of which are parallel, meet
    in a common point.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# An Incorrect “Proof” by Mathematical Induction


    **Inductive Hypothesis:** Every set of k lines in the plane, where k ≥ 2, no two
    of which are parallel, meet in a common point.


    +   Consider a set of k + 1 distinct lines in the plane, no two parallel. By the
    inductive hypothesis, the first k of these lines must meet in a common point p₁.
    By the inductive hypothesis, the last k of these lines meet in a common point
    p₂.


    +   If p₁ and p₂ are different points, all lines containing both of them must
    be the same line since two points determine a line. This contradicts the assumption
    that the lines are distinct. Hence, p₁ = p₂ lies on all k + 1 distinct lines,
    and therefore P(k + 1) holds. Assuming that k ≥2, distinct lines meet in a common
    point, then every k + 1 lines meet in a common point.


    +   There must be an error in this proof since the conclusion is absurd. But where
    is the error?


    +   **Answer:** P(k)→P(k + 1) only holds for k ≥3. It is not the case that P(2)
    implies P(3). The first two lines must meet in a common point p₁ and the second
    two must meet in a common point p₂. They do not have to be the same point since
    only the second line is common to both sets of lines.'
  merge: -1
  img_proc: true
