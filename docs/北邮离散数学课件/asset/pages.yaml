  md: "# Structural Induction and Binary Trees\n\n**Theorem:** If $T$ is a full binary\
    \ tree, then $n(T) \\le 2^{h(T)+1} - 1$.\n\n**Proof:** Use structural induction.\n\
    \n+   - **BASIS STEP:** The result holds for a full binary tree consisting only\
    \ of a root, $n(T)=1$ and $h(T)=0$. Hence, $n(T)=1 \\le 2^{0+1}-1 =1$.\n+   -\
    \ **RECURSIVE STEP:** Assume $n(T_1) \\le 2^{h(T_1)+1}-1$ and also $n(T_2) \\\
    le 2^{h(T_2)+1}-1$ whenever $T_1$ and $T_2$ are full binary trees.\n+   \n+  \
    \ $n(T) = 1 + n(T_1) + n(T_2)$ \\quad\\quad (by recursive formula of $n(T)$)\n\
    +   $\\le 1 + (2^{h(T1)+1}-1) + (2^{h(T2)+1}-1)$ \\quad (by inductive hypothesis)\n\
    +   $\\le 2\\cdot\\max(2^{h(T1)+1},2^{h(T2)+1}) -1$\n+   $= 2\\cdot2^{\\max(h(T1),h(T2))+1}\
    \ -1$ \\quad\\quad $(\\max(2^x,2^y)=2^{\\max(x,y)})$ \n+   $= 2\\cdot2^{h(T)}\
    \ -1$ \\quad\\quad (by recursive definition of $h(T))$\n+   $= 2^{h(T)+1} -1$"
