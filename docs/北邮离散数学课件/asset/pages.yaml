  md: '# 简单析取式和简单合取式


    +   - 仅有有限个命题变元或其否定的析取构成的析取式称为简单析取式，或基本和。  - 例如： ¬P∨Q∨R， ¬P∨¬Q∨P是简单析取式

    +   - 而仅有有限个命题变元或其否定的合取构成的合取式称为简单合取式，或基本积。  - 例如： ¬P∧R， Q∧R∧¬Q是简单合取式。

    +   - P， ¬Q一个变项本身可以看作简单析取式也可以看作简单合取式。

    +   - 而¬P∨（Q ∧ R）， （P∧Q） ∨¬R不是简单析取式。'
