- pgno: 1708
  md: '# Example 8


    +   - By Theorem I

    +     - $P_{G^{e}}(x) = x(x(x-1)(x-2)) = x^{2}(x-1)(x-2)$

    +     - $P_{G^{e}}(x) = x(x-1)(x-2)$

    +   - By Theorem 2,

    +     - $P_{G}(x) = x^{2}(x-1)(x-2) - x(x-1)(x-2)$

    +       $= x(x-1)^{2}(x-2)$

    +   - So, $\chi(G) = 3$


