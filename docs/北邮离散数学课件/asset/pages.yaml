- pgno: 280
  md: '# Disjunctive Normal Form


    **Example:** Show that every compound proposition can be put in disjunctive normal
    form.


    **Solution:** Construct the truth table for the proposition. Then an equivalent
    proposition is the disjunction with *n* disjuncts (where *n* is the number of
    rows for which the formula evaluates to **T**). Each disjunct has *m* conjuncts
    where *m* is the number of distinct propositional variables. Each conjunct includes
    the positive form of the propositional variable if the variable is assigned **T**
    in that row and the negated form if the variable is assigned **F** in that row.
    This proposition is in disjunctive normal form.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Disjunctive Normal Form


    **Example**: Find the Disjunctive Normal Form (DNF) of


    (p ∨ q) → ¬ r


    **Solution**: This proposition is true when r is false or when both p and q are
    false.


    (¬ p ∧ ¬ q) ∨ ¬ r'
