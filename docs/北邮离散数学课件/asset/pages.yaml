- pgno: 2112
  md: '# A Neat Trick


    +   - Sometimes we write $Y^X$ to denote the set $F$ of all possible functions
    $f:X\to Y$.

    +   - This notation is especially appropriate, because for finite $X$, $Y$, we
    have $|F| = |Y|^{|X|}$.

    +   - If we use representations $\mathbf{F}\equiv\mathbf{0}$, $\mathbf{T}\equiv\mathbf{1}$,
    $\mathbf{2}:\equiv\{\mathbf{0},\mathbf{1}\}=\{\mathbf{F},\mathbf{T}\}$, then a
    subset $T\subseteq S$ is just a function from $S$ to $\mathbf{2}$, so the power
    set of $S$ (set of all such fns.) is $\mathbf{2}^S$ in this notation.'
  merge: -1
  img_proc: true
