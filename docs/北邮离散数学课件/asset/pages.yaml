  md: '# [定义]全序集：


    半序集（A，≤₍R₎）中的半序关系≤₍R₎是A上的全序，则此（A，≤₍R₎）称为全序集。


    （A，R₁）是全序集。显然，全序集是半序集的特例。又如：（−∞，+∞）实数全体，在≤下是全序集；平面上点集，也可以规定一种≤₍R₎，模长大的大，模长相等的情况下，以幅角的大小来比大小，因此，平面上点集也是全序集。（N，≤）当然也是全序集。'
