- pgno: 806
  md: '# # Decoding procedure


    Suppose that we compute the syndrome of each coset leader. If the word \(x_t\)
    is received, we also compute \(f_H(x_t)\), the syndrome of \(x_t\). By comparing
    \(f_H(x_t)\) and the syndromes of the coset leaders, we find the coset in which
    \(x_t\) lies. Suppose that a coset leader of this coset is \(\varepsilon\). We
    now compute \(x = x_t \oplus \varepsilon\). If \(x = e(b)\), we then decode \(x_t\)
    as \(b\).'
  merge: -1
  img_proc: true
- pgno: 807
  md: '# # New procedure


    **Step 1**: Determine all left cosets of \( N = e_H(B^m) \) in \( B^n \).


    **Step 2**: For each coset, find a coset leader, and compute the syndrome of each
    leader


    **Step 3**: If \( x_t \) is received, compute the syndrome of \( x_t \) and find
    the coset leader \( \varepsilon \) having the same syndrome. Then \( x_t \oplus
    \varepsilon = x \) is a code word \( e_H(b) \), and \( d(x_t) = b \).'
  merge: -1
