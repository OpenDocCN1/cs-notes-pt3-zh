- pgno: 1303
  md: '# Isomorphic Lattices （同构格）


    +   - If $f: L_1 \to L_2$ is an isomorphism from the poset $(L_1, \le_1)$ to the
    poset $(L_2, \le_2)$

    +     - $L_1$ is a lattice if and only if $L_2$ is a lattice.

    +     - If $a$ and $b$ are elements of $L_1$, then

    +       - $f(a \land b) = f(a) \land f(b)$

    +       - $f(a \lor b) = f(a) \lor f(b)$.

    +   - If two lattices are isomorphic, as posets, we say they are *Isomorphic Lattices*.'
  merge: -1
  img_proc: true
- pgno: 1304
  md: '# Properties of Lattices


    +   - Recall the meaning of $a \vee b$ and $a \wedge b$:

    +     - $a \le a \vee b$ and $b \le a \vee b$; $a \vee b$ is an *upper bound*
    of $a$ and $b$.

    +     - If $a \le c$ and $b \le c$, then $a \vee b \le c$; $a \vee b$ is the *least
    upper bound* of $a$ and $b$.

    +     - $a \wedge b \le a$ and $a \wedge b \le b$; $a \wedge b$ is an *lower bound*
    of $a$ and $b$.

    +     - If $c \le a$ and $c \le b$, then $c \le a \wedge b$; $a \wedge b$ is the
    *greatest lower bound* of $a$ and $b$.'
  merge: -1
  img_proc: true
- pgno: 1305
  md: "# Theorem 2\n\n+   - Let $L$ be a lattice. Then for every $a$ and $b$ in $L$,\
    \  \n+     - $a \\vee b = b$ if and only if $a \\le b$.\n+     - $a \\wedge b\
    \ = a$ if and only if $a \\le b$.\n+     - $a \\wedge b = a$ if and only if $a\
    \ \\vee b = b$"
  merge: -1
  img_proc: true
- pgno: 1306
  md: '# Proof of $a \vee b = b$ if and only if $a \le b$.


    +   - ⇒ only if

    +     - Suppose $a \vee b = b$, so $a \vee b \le b$ (reflexive)

    +     - $a \vee b$ is an upper bound of $a$ and $b$, so $a \le a \vee b$

    +     - So, $a \le b$ (transitive)

    +   - ⇐ if

    +     - Suppose $a \le b$

    +     - $b \le b$ (reflexive), $b$ is an upper bound of $a$ and $b$

    +     - So $a \vee b \le b$ (by definition of lub)

    +     - But, $b \le a \vee b$ (by definition of lub)

    +     - Therefore, $a \vee b = b$ (antisymmetric)'
  merge: -1
  img_proc: true
- pgno: 1307
  md: '# Theorem 3


    +   - Let L be a lattice. Then

    +     - Idempotent Properties（等幂律）

    +       - (a) a ∨ a = a

    +       - (b) a ∧ a = a

    +     - Commutative Properties（交换律）

    +       - (a) a ∨ b = b ∨ a

    +       - (b) a ∧ b = b ∧ a

    +     - Associative Properties（结合律）

    +       - (a) a ∨ (b ∨ c) = (a ∨ b) ∨ c

    +       - (b) a ∧ (b ∧ c) = (a ∧ b) ∧ c

    +     - Absorption Properties（吸收律）

    +       - (a) a ∨ (a ∧ b) = a

    +       - (b) a ∧ (a ∨ b) = a'
  merge: -1
  img_proc: true
