  md: '# Isomorphism – 同构映射


    # Homomorphism – 同态映射


    Let (S, *) and (T, *'') be two semigroups.


    A function f: S→T


    is called an *isomorphism* from (S, *) to (T, *'')


    if it is a one-to-one correspondence from S to T, and f(a*b) = f(a)*''f(b) for
    all a and b in S.'
