- pgno: 1823
  md: '# 前缀码/Prefix Codes


    1. 计算机是用 0 和 1 序列来表示和存储信息。通讯编码也是这样处理的。

    如 26 个英文字母(a-z)，用 v 位则可表示 2^v，由于 2^4=16<26<2^5=32，故要用 5 位二进制才能区分 26 个字母。


    2. 是否能用不同位数的二进制数来表示信息，尽量缩短通讯时序列的长度。这是可行的，但要注意:如 00 表示 A，01 表示 B，0001 表示 z，那么收到
    0001 是代表 A B 还是 z？怎样避免二义性？'
  merge: -1
  img_proc: true
- pgno: 1824
  md: '[定义]前缀： a， b， c 均为二进制序列，如果 b = a 并列 c， c 不是空序列，则称 a 是 b 的前缀/prefix。即 a 是 b
    的前面一部分。


    [定义]前缀码：一个二进制序列集合，如果这些二进制序列互不为前缀，则称此集合为前缀码/prefix code。


    例：二元有序加权树


    每枝点左边对应权为0，右边对应权1，叶对应一个码（即每片叶都有一条从根到叶的路径，路径上的权排成序即为叶的码，也称作叶的名。'
  merge: -1
  img_proc: true
