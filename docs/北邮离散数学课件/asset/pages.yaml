- pgno: 649
  md: '# Next Permutation in Order


    +   - Given an existing permutation $a_1,\dots,a_n$ of $\{1,\dots,n\}$, how do
    we find the *next* one?

    +   - Outline of procedure:

    +     - Find largest $j$ such that $a_j < a_{j+1}$.

    +     - Find the smallest integer in $a_{j+1},\dots,a_n$ that is greater than
    $a_j$. Put it in position $j$.

    +     - Sort the remaining integers in $a_j,\dots,a_n$ from smallest to largest.
    Put them at $j+1$ through $n$.'
  merge: -1
  img_proc: true
- pgno: 650
  md: "# Next-Permutation Procedure\n\n```\nprocedure nextPerm(a₁,...,aₙ: perm. {1,...,n})\n\
    \  j:=n−1; while aⱼ>aⱼ₊₁ and j>0 do j:=j−1\n  if j=0 then return {no more permutations}\n\
    \  k:=n; while aⱼ > aₖ do k:=k−1\n  swap(aⱼ, aₖ); r:=n; s:=j+1\n  while r>s do\
    \ begin\n    swap(aᵣ,aₛ); r:=r−1; s:=s+1 end\n```"
  merge: -1
  img_proc: true
- pgno: 651
  md: '# Combination Generator


    +   - Suppose we want to generate all combinations of the elements of the set
    {1, ..., n}.

    +     - Or any other set with n elements.

    +   - A combination is just a subset.

    +     - And, a subset of n items can be specified using a bit-string of length
    n.

    +       - Each bit says whether the item is in the subset.

    +   - Therefore, we can enumerate all combinations by enumerating all bit-strings
    of length n.'
  merge: -1
  img_proc: true
