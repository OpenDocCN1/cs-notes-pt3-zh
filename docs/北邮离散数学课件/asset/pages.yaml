- pgno: 240
  md: '# Constructing New Logical Equivalences


    +   - We can show that two expressions are logically equivalent by developing
    a series of logically equivalent statements.

    +   - To prove that $A \equiv B$ we produce a series of equivalences beginning
    with A and ending with B.

    +     $A \equiv A_1$

    +     $\vdots$

    +     $A_n \equiv B$

    +   - Keep in mind that whenever a proposition (represented by a propositional
    variable) occurs in the equivalences listed earlier, it may be replaced by an
    arbitrarily complex compound proposition.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Equivalence Proofs


    Example: Show that ¬(p ∨ (¬p ∧ q)) is logically equivalent to ¬p ∧ ¬q


    # Solution:


    ¬(p ∨ (¬p ∧ q)) ≡ ¬p ∧ ¬(¬p ∧ q) by the second De Morgan law


    ≡ ¬p ∧ [¬(¬p) ∨ ¬q] by the first De Morgan law


    ≡ ¬p ∧ (p ∨ ¬q) by the double negation law


    ≡ (¬p ∧ p) ∨ (¬p ∧ ¬q) by the second distributive law


    ≡ F ∨ (¬p ∧ ¬q) because ¬p ∧ p ≡ F


    ≡ (¬p ∧ ¬q) ∨ F by the commutative law for disjunction


    ≡ (¬p ∧ ¬q) by the identity law for F'
  merge: -1
