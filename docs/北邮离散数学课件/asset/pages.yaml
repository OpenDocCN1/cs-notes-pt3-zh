- pgno: 154
  md: '# The Exclusive Or Operator


    The binary *exclusive-or operator* “⊕” (XOR) combines two propositions to form
    their logical “exclusive or”.


    p = “I will earn an A in this course,”


    q = “I will drop this course,”


    p ⊕ q = “I will either earn an A in this course, or I will drop it (but not both!)”'
