- pgno: 24
  md: "# Base Conversion\n\nTo construct the base $b$ expansion of an integer $n$:\n\
    \n+   - Divide $n$ by $b$ to obtain a quotient and remainder.  \n+     $n=bq_0+a_0\\\
    quad 0\\leq a_0<b$\n+   - The remainder, $a_0$, is the rightmost digit in the\
    \ base $b$ expansion of $n$. Next, divide $q_0$ by $b$.  \n+     $q_0=bq_1+a_1\\\
    quad 0\\leq a_1<b$\n+   - The remainder, $a_1$, is the second digit from the right\
    \ in the base $b$ expansion of $n$.\n+   - Continue by successively dividing the\
    \ quotients by $b$, obtaining the additional base $b$ digits as the remainder.\
    \ The process terminates when the quotient is 0.\n\n*continued →*"
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Algorithm: Constructing Base b Expansions\n\n```\nprocedure base b expansion(n,\
    \ b: positive integers with b > 1)\nq := n\nk := 0\nwhile (q ≠ 0)\n    a_k :=\
    \ q mod b\n    q := q div b\n    k := k + 1\nreturn(a_{k-1},..., a_1,a_0){(a_{k-1}\
    \ ... a_1 a_0)_b is base b expansion of n}\n```\n\n+   - q represents the quotient\
    \ obtained by successive divisions by b, starting with q = n.\n+   - The digits\
    \ in the base b expansion are the remainders of the division given by q mod b.\n\
    +   - The algorithm terminates when q = 0 is reached."
  merge: -1
  img_proc: true
