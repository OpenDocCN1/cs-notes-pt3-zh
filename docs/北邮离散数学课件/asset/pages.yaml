  md: "# Binary Addition of Integers\n\n+   Algorithms for performing operations with\
    \ integers using their binary expansions are important as computer chips work\
    \ with binary numbers. Each digit is called a bit.\n\n```\nprocedure add(a, b:\
    \ positive integers)\n{the binary expansions of a and b are (a_{n-1},a_{n-2},...,a_0)_2\
    \ and (b_{n-1},b_{n-2},...,b_0)_2, respectively}\nc := 0\nfor j := 0 to n − 1\n\
    \    d := ⌊(a_j + b_j + c)/2⌋\n    s_j := a_j + b_j + c − 2d\n    c := d\ns_n\
    \ := c\nreturn(s_0,s_1,..., s_n){the binary expansion of the sum is (s_n,s_{n-1},...,s_0)_2}\n\
    ```\n\n+   The number of additions of bits used by the algorithm to add two n-bit\
    \ integers is O(n)."
