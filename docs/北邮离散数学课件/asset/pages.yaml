- pgno: 1723
  md: '# Transport network


    +   - More formally, a *transport network*, or a *network*, is a connected digraph
    *N* with the following properties:

    +     - There is a unique node, the *source* (源端), that has in-degree 0. We generally
    label the source node 1.

    +     - There is a unique node, the *sink* (宿端), that has out-degree 0. If *N*
    has *n* nodes, we generally label the sink as node n.

    +     - The graph *N* is labeled. The label, $C_{ij}$, on edge $(i, j)$ is a nonnegative
    number called the *capacity* of the edge.'
  merge: -1
  img_proc: true
- pgno: 1724
  md: '# Flows


    +   - Mathematically, a *flow* （流量） in a network $N$ is a function that assigns
    to each edge $(i, j)$ of $N$ a nonnegative number $F_{ij}$ that does not exceed
    $C_{ij}$.

    +     - *Conservation of flow* （流量守恒）

    +     - *Value of the flow*'
  merge: -1
  img_proc: true
- pgno: 1725
  md: '# Flows


