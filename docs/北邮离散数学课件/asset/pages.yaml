- pgno: 1762
  md: '# Cut (割集)


    • A cut in a network N is a set K of edges having the property that every path
    from the source to the sink contains at least one edge from K.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1762_0.png)'
  merge: -1
  img_proc: true
- pgno: 1763
  md: '# Capacity of a cut \(K\)


    +   - The *capacity* of a cut \(K\), \(c(K)\), is the sum of the capacities of
    all edges in \(K\).

    +   - If \(F\) is any flow and \(K\) is any cut, then \(-\operatorname{value}(F)
    \le c(K)\).'
  merge: -1
