- pgno: 702
  md: '在实际应用中，往往不仅需要计数，而且要把各种情况都枚举出来。


    # 一、 字典序排列/lexicographic ordering for permutation


    # 定义：


    顺序：排列 a₁， a₂， ...， aₙ 中相邻两数 aᵢ < aᵢ₊₁，称为一个顺序。


    逆序：排列 a₁， a₂， ...， aₙ 中相邻两数 aᵢ > aᵢ₊₁，称为一个逆序。'
  merge: -1
  img_proc: true
- pgno: 703
  md: '# 例：


    排列 1 3 2 6 5 4

    顺序：1 3，2 6，逆序：3 2，6 5，5 4。


    对 n 个对象进行全排列，有 n！个排列，可以对 n 个对象加上标记。


    不失一般性，我们只需对 n 个自然数 { 1，2，...，n } 进行全排列，枚举出所有的情况。


    # 字典序排列算法


    +   1. 给出初始排列： p₁ = 1，2，3，4，...，n


    +   2. 若 pₖ 已定义 （1 ≤ k ≤ n！− 1）

    +      pₖ = a₁，a₂，...，aₘ，...，aₙ'
  merge: -1
  img_proc: true
- pgno: 704
  md: '则按下列规定，定义 p_k 的下一个排列

    p_{k+1} = b_1, b_2, ..., b_m, ..., b_n

    (1) 寻找 a_m： m = max { j | a_j < a_{j+1} }

    即 a_m, a_{m+1} 是最右面的顺序，自 a_{m+1} 开始均为逆序。

    (2) 给出 b_i （ i = 1, 2, ..., n ）

    a）第 m 项之前的项不变：

    b_1 = a_1, b_2 = a_2, ..., b_{m-1} = a_{m-1}

    b）b_m = min { a_p | a_p > a_m, p > m }

    即在 a_m 右面大于 a_m 的项中选取最小的项作为 b_m。

