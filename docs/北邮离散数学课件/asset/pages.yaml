- pgno: 1168
  md: '# Paths in Digraphs/Binary Relations


    +   - A *path* of length *n* from node *a* to *b* in the directed graph *G* (or
    the binary relation *R*) is a sequence $(a,x_1), (x_1,x_2), ..., (x_{n-1},b)$
    of *n* ordered pairs in $E_G$ (or $R$).

    +     - An empty sequence of edges is considered a path of length 0 from *a* to
    *a*.

    +     - If any path from *a* to *b* exists, then we say that *a* is *connected
    to b*. (“You can get there from here.”)

    +   - A path of length *n*≥1 from *a* to itself is called a *circuit* or a *cycle*.

    +   - Note that there exists a path of length *n* from *a* to *b* in *R* if and
    only if $(a,b) \in R^n$.'
