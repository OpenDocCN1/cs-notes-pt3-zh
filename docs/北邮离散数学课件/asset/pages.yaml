- pgno: 2256
  md: '# Big-Theta Notation


    Θ is the upper case version of the lower case Greek letter θ.


    +   - **Definition**: Let $f$ and $g$ be functions from the set of integers or
    the set of real numbers to the set of real numbers. The function $f(x)$ is $\Theta(g(x))$
    if $f(x)$ is $O(g(x))$ and $f(x)$ is $\Omega(g(x))$.

    +   - We say that “f is big-Theta of $g(x)$” and also that “$f(x)$ is of order
    $g(x)$” and also that “$f(x)$ and $g(x)$ are of the same order.”

    +   - $f(x)$ is $\Theta(g(x))$ if and only if there exists constants $C_1$, $C_2$
    and $k$ such that $C_1 g(x) < f(x) < C_2 g(x)$ if $x > k$. This follows from the
    definitions of big-O and big-Omega.'
