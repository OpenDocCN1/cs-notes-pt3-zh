- pgno: 2091
  md: '# Set Identities特性


    +   - Identity: $A \cup \varnothing = A = A \cap U$

    +   - Domination: $A \cup U = U$, $A \cap \varnothing = \varnothing$

    +   - Idempotent: $A \cup A = A = A \cap A$

    +   - Double complement: $\overline{(\overline{A})} = A$

    +   - Commutative: $A \cup B = B \cup A$, $A \cap B = B \cap A$

    +   - Associative: $A \cup (B \cup C) = (A \cup B) \cup C$, $A \cap (B \cap C)
    = (A \cap B) \cap C$'
  merge: -1
  img_proc: true
- pgno: 2092
  md: '# DeMorgan’s Law for Sets


    +   - Exactly analogous to (and provable from) DeMorgan’s Law for propositions.


    overline{A ∪ B} = overline{A} ∩ overline{B}

    overline{A ∩ B} = overline{A} ∪ overline{B}'
