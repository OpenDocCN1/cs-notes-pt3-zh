- pgno: 91
  md: '# Pseudorandom Numbers


    +   - **Example**: Find the sequence of pseudorandom numbers generated by the
    linear congruential method with modulus $m = 9$, multiplier $a = 7$, increment
    $c = 4$, and seed $x_0 = 3$.

    +   - **Solution**: Compute the terms of the sequence by successively using the
    congruence $x_{n+1} = (7x_n + 4) \mod 9$, with $x_0 = 3$.

    +     $x_1 = 7x_0 + 4 \mod 9 = 7\cdot3 + 4 \mod 9 = 25 \mod 9 = 7,$

    +     $x_2 = 7x_1 + 4 \mod 9 = 7\cdot7 + 4 \mod 9 = 53 \mod 9 = 8,$

    +     $x_3 = 7x_2 + 4 \mod 9 = 7\cdot8 + 4 \mod 9 = 60 \mod 9 = 6,$

    +     $x_4 = 7x_3 + 4 \mod 9 = 7\cdot6 + 4 \mod 9 = 46 \mod 9 = 1,$

    +     $x_5 = 7x_4 + 4 \mod 9 = 7\cdot1 + 4 \mod 9 = 11 \mod 9 = 2,$

    +     $x_6 = 7x_5 + 4 \mod 9 = 7\cdot2 + 4 \mod 9 = 18 \mod 9 = 0,$

    +     $x_7 = 7x_6 + 4 \mod 9 = 7\cdot0 + 4 \mod 9 = 4 \mod 9 = 4,$

    +     $x_8 = 7x_7 + 4 \mod 9 = 7\cdot4 + 4 \mod 9 = 32 \mod 9 = 5,$

    +     $x_9 = 7x_8 + 4 \mod 9 = 7\cdot5 + 4 \mod 9 = 39 \mod 9 = 3.$

    +     The sequence generated is 3,7,8,6,1,2,0,4,5,3,7,8,6,1,2,0,4,5,3,...

    +     It repeats after generating 9 terms.

    +   - Commonly, computers use a linear congruential generator with increment $c
    = 0$. This is called a *pure multiplicative generator*. Such a generator with
    modulus $2^{31} - 1$ and multiplier $7^5 = 16,807$ generates $2^{31} - 2$ numbers
    before repeating.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Check Digits: UPCs


    +   A common method of detecting errors in strings of digits is to add an extra
    digit at the end, which is evaluated using a function. If the final digit is not
    correct, then the string is assumed not to be correct.


    Example: Retail products are identified by their Universal Product Codes (UPCs).
    Usually these have 12 decimal digits, the last one being the check digit.


    The check digit is determined by the congruence:


    3x₁ + x₂ + 3x₃ + x₄ + 3x₅ + x₆ + 3x₇ + x₈ + 3x₉ + x₁₀ + 3x₁₁ + x₁₂ ≡ 0 (mod 10).


    +   a. Suppose that the first 11 digits of the UPC are 79357343104. What is the
    check digit?


    +   b. Is 041331021641 a valid UPC?


    # Solution:


    +   a. 3·7 + 9 + 3·3 + 5 + 3·7 + 3 + 3·4 + 3 + 3·1 + 0 + 3·4 + x₁₂ ≡ 0 (mod 10)

    +   21 + 9 + 9 + 5 + 21 + 3 + 12 + 3 + 3 + 0 + 12 + x₁₂ ≡ 0 (mod 10)

    +   98 + x₁₂ ≡ 0 (mod 10)

    +   x₁₂ ≡ 0 (mod 10)  So, the check digit is 2.


    +   b. 3·0 + 4 + 3·1 + 3 + 3·3 + 1 + 3·0 + 2 + 3·1 + 6 + 3·4 + 1 ≡ 0 (mod 10)

    +   0 + 4 + 3 + 3 + 9 + 1 + 0 + 2 + 3 + 6 + 12 + 1 = 44 ≡ 4 ≠ (mod 10)

    +   Hence, 041331021641 is not a valid UPC.'
