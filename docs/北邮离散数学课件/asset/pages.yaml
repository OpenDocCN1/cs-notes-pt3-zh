- pgno: 2220
  md: '# Greedy Algorithms: Making Change


    **Example:** Design a greedy algorithm for making change (in U.S. money) of n
    cents with the following coins: quarters (25 cents), dimes (10 cents), nickels
    (5 cents), and pennies (1 cent), using the least total number of coins.


    **Idea:** At each step choose the coin with the largest possible value that does
    not exceed the amount of change left.


    +   1. If n = 67 cents, first choose a quarter leaving 67−25 = 42 cents. Then
    choose another quarter leaving 42 −25 = 17 cents


    +   2. Then choose 1 dime, leaving 17 − 10 = 7 cents.


    +   3. Choose 1 nickel, leaving 7 − 5 = 2 cents.


    +   4. Choose a penny, leaving one cent. Choose another penny leaving 0 cents.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2220_0.png)'
  merge: -1
  img_proc: true
- pgno: 2221
  md: "# Greedy Change-Making Algorithm\n\n**Solution:** Greedy change-making algorithm\
    \ for n cents. The algorithm works with any coin denominations $c_1, c_2, ...,\
    \ c_r$.\n\n```\nprocedure change($c_1, c_2, ..., c_r$: values of coins, where\
    \ $c_1 > c_2 > ... > c_r$; $n$: a positive integer)\nfor $i := 1$ to $r$\n   \
    \ $d_i := 0$ [$d_i$ counts the coins of denomination $c_i$]\n    while $n \\ge\
    \ c_i$\n        $d_i := d_i + 1$ [add a coin of denomination $c_i$]\n        $n\
    \ = n - c_i$\n[$d_i$ counts the coins $c_i$]\n```\n\n+   - For the example of\
    \ U.S. currency, we may have quarters, dimes, nickels and pennies, with $c_1 =\
    \ 25, c_2 = 10, c_3 = 5,$ and $c_4 = 1.$"
  merge: -1
  img_proc: true
- pgno: 2222
  md: '# Proving Optimality for U.S. Coins


    +   - Show that the change making algorithm for *U.S.* coins is optimal.


    **Lemma 1:** If *n* is a positive integer, then *n* cents in change using quarters,
    dimes, nickels, and pennies, using the fewest coins possible has at most 2 dimes,
    1 nickel, 4 pennies, and cannot have 2 dimes and a nickel. The total amount of
    change in dimes, nickels, and pennies must not exceed 24 cents.


    **Proof:** By contradiction


    +   - If we had 3 dimes, we could replace them with a quarter and a nickel.

    +   - If we had 2 nickels, we could replace them with 1 dime.

    +   - If we had 5 pennies, we could replace them with a nickel.

    +   - If we had 2 dimes and 1 nickel, we could replace them with a quarter.

    +   - The allowable combinations, have a maximum value of 24 cents; 2 dimes and
    4 pennies.'
