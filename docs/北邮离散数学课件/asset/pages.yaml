- pgno: 1908
  md: '# Theorem 1


    +   - Prim’s algorithm produces a minimal spanning tree for the graph G.

    +   - Proof

    +     - Let G have n vertex. Let T be the spanning tree for G produced by Prim’s
    algorithm.

    +     - Suppose that the edges of T are t₁, t₂, ..., tₙ₋₁ in the order of they
    were selected.

    +     - we define Tᵢ (i=1 to n-1) to be the tree with t₁, t₂, ..., tᵢ and T₀={}
    Then T₀ ⊂ T₁ ... ⊂ Tₙ₋₁=T.

    +     - We now proved that each Tᵢ is contained in a minimal spanning tree for
    G by mathematical induction.'
  merge: -1
  img_proc: true
- pgno: 1909
  md: '![](img/c25dfd82fc242c2db53bc942dcad6885_1909_0.png)


    +   - Basis step: Clearly P(0):T₀={} is contained in every minimal spanning tree
    for G

    +   - Induction Step:

    +     - suppose P(k):Tₖ is contained in a minimal spanning tree T′ for G.

    +     - By definition {t₁, t₂, …, tₖ} ⊆ T′ . If tₖ₊₁ also belongs to T′ ,then
    Tₖ₊₁ ⊆ T′ and we have P(k+1) is true.

    +     - If tₖ₊₁ does not belongs to T′ ,then T′ ∪ {tₖ₊₁} must contain a cycle.

    +     - This cycle would be for some edges s₁, s₂, …, sₖ in T′

    +     - The edges of this cycle cannot all be from Tₖ or Tₖ₊₁ would contain this
    cycle.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1909_1.png)'
  merge: -1
  img_proc: true
- pgno: 1910
  md: '+   - Let sₗ be the edge with smallest index l that is not in Tₖ. when tₖ₊₁
    was chosen by Prim ‘s algorithm, sₗ was also available. thus the weight of sₗ
    is at least as large as that of tₖ₊₁.

    +   - The spanning tree (T’ -{sₗ}) ∪{tₖ₊₁} contains Tₖ₊₁. The weight of this tree
    is less than or equal to the weight of T’ , so it is a minimal tree for G.

    +   - P(k+1) is true. So Tₙ₋₁=T is contained in a minimal spanning tree and must
    in fact be that minimal spanning tree.

    +   - Q.E.D'
  merge: -1
  img_proc: true
- pgno: 1911
  md: '# Kruskal’s algorithm


    +   - Let G be a weighted connected undirected graph with n vertices and let S={e₁,
    e₂,..., eₖ} be the set of weighted edges of G.

    +     - Step 1 Choose an edge e₁ in S of least weight. Let E={e₁}. Replace S with
    S-{e₁}.

    +     - Step 2 Choose an edge eᵢ in S of least weight that will not make a cycle
    with members of E. Replace E with E ∪ {eᵢ} and S with S-{eᵢ}.

    +     - Step 3 Repeat step 2 until |E|=n-1.

    +     - End of algorithm'
  merge: -1
  img_proc: true
