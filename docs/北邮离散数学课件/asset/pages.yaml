- pgno: 108
  md: '# Public Key Cryptography


    +   - All classical ciphers, including shift and affine ciphers, are *private
    key cryptosystems*. Knowing the encryption key allows one to quickly determine
    the decryption key.

    +   - All parties who wish to communicate using a private key cryptosystem must
    share the key and keep it a secret.

    +   - In public key cryptosystems, first invented in the 1970s, knowing how to
    encrypt a message does not help one to decrypt the message. Therefore, everyone
    can have a publicly known encryption key. The only key that needs to be kept secret
    is the decryption key.'
  merge: -1
