- pgno: 1229
  md: '# Determining partitions A/ R


    +   - *STEP 1*: Choose any element of A and compute the equivalence class R(a).

    +   - *STEP 2*: if R(a) ≠ A, choose an element *b*, not included in R(a), and
    compute the equivalence class R(b).

    +   - *STEP 3*: If A is not the union of previously computed equivalence classes,
    then choose an element *x* of A that is not in any of those equivalence classes
    and compute R(x).

    +   - *STEP 4*: Repeat step 3 until all elements of A are included in the computed
    equivalence classes. If A is countable, this process could continue indefinitely.
    In that case, continue until a pattern emerges that allows you to describe or
    give a formula for all equivalence classes.'
  merge: -1
  img_proc: true
