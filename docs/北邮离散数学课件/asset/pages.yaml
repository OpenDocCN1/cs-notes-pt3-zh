- pgno: 1731
  md: '# LABELING ALGORITHM


    +   - Let N be a network with n nodes and G be the symmetric closure of N. All
    edges and paths used are in G.

    +     - Begin with all flows set to 0.

    +     - As we proceed, it will be convenient to track the excess capacities in
    the edges and how they change rather than tracking the increasing flows.

    +     - When the algorithm terminates, it is easy to find the maximum flow from
    the final excess capacities.'
  merge: -1
  img_proc: true
- pgno: 1732
  md: '# Step 1


    +   - Let $N_1$ be the set of all nodes connected to the source by an edge with
    positive excess capacity.

    +   - Label each $j$ in $N_1$ with $[E_j, I]$, where $E_j$ is the excess capacity
    $e_{Ij}$ of edge $(I, j)$.

    +   - The I in the label indicates that $j$ is connected to the source, node I.'
  merge: -1
  img_proc: true
- pgno: 1733
  md: '# Step 2


    +   - Let node \(j\) in \(N_1\) be the node with smallest node number and let
    \(N_2(j)\) be the set of all unlabeled nodes, other than the source, that are
    joined to node \(j\) and have positive excess capacity.

    +   - Suppose that node \(k\) is in \(N_2(j)\) and \((j,k)\) is the edge with
    positive excess capacity. Label node \(k\) with \([E_k,j]\), where \(E_k\) is
    the minimum of \(E_j\) and the excess capacity \(e_{jk}\) of edge \((j,k)\).

    +   - When all the nodes in \(N_2(j)\) are labeled in this way, repeat this process
    for the other nodes in \(N_1\). Let

    +     \[

    +     N_2 = \bigcup_{j\in N_1} N_2(j)

    +     \]'
  merge: -1
  img_proc: true
- pgno: 1734
  md: '# Step 3


    +   - Repeat Step 2, labeling all previously unlabeled nodes $N_3$ that can be
    reached from a node in $N_2$ by an edge having positive excess capacity.

    +   - Continue this process forming sets $N_4$, $N_5$. . . until after a finite
    number of steps either

    +     - (i) the sink has not been labeled and no other nodes can be labeled. It
    can happen that no nodes have been labeled; remember that the source is not labeled.
    or

    +     - (ii) the sink has been labeled.'
  merge: -1
  img_proc: true
- pgno: 1735
  md: '# Step 4


    +   - In case (i), the algorithm terminates and the total flow then is a maximum
    flow.'
  merge: -1
  img_proc: true
- pgno: 1736
  md: '# Step 5


    +   - In case (ii) the sink, node n, has been labeled with [$E_n$, $m$] where
    $E_n$ is the amount of extra flow that can be made to reach the sink through a
    path $\pi$.'
  merge: -1
  img_proc: true
- pgno: 1737
  md: '# Step 5


    +   - We examine π in reverse order.

    +     - If edge (i, j) ∈ N, then we increase the flow in (l, j) by E_n and decrease
    the excess capacity e_ij by the same amount. Simultaneously, we increase the excess
    capacity of the (virtual) edge (j, i) by E_n since there is that much more flow
    in (i, j) to reverse.

    +     - If, on the other hand, (i, j) ∉ N, we decrease the flow in (j, i) by E_n
    and increase its excess capacity by E_n. We simultaneously decrease the excess
    capacity in (i, j) by the same amount, since there is less flow in (i, j) to reverse.

    +   - We now have a new flow that is E_n units greater than before and we return
    to Step 1.'
  merge: -1
  img_proc: true
