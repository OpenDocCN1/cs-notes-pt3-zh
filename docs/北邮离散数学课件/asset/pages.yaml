  md: '# Database intension and extension


    +   - The *fields* of the database (the columns) correspond to the domains of
    the relation

    +   - The number of fields is the degree *n*

    +   - The *intension* of the database (or its *schema*) is the permanent part
    of its design, i.e., the fields and the constraints on them

    +   - The *extension* of the database is its current population of records'
