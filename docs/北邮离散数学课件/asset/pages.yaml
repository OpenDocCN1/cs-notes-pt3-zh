- pgno: 2203
  md: '# # Problems and Algorithms


    +   - In many domains there are key general problems that ask for output with
    specific properties when given valid input.

    +   - The first step is to precisely state the problem, using the appropriate
    structures to specify the input and the desired output.

    +   - We then solve the general problem by specifying the steps of a procedure
    that takes a valid input and produces the desired output. This procedure is called
    an *algorithm*.'
  merge: -1
  img_proc: true
- pgno: 2204
  md: '# Algorithms


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2204_0.png)


    Abu Ja''far Mohammed Ibin Musa Al-Khowarizmi

    (780-850)


    **Definition**: An *algorithm* is a finite set of precise instructions for performing
    a computation or for solving a problem.


    **Example**: Describe an algorithm for finding the maximum value in a finite sequence
    of integers.


    **Solution**: Perform the following steps:


    +   1. Set the temporary maximum equal to the first integer in the sequence.

    +   2. Compare the next integer in the sequence to the temporary maximum.

    +      - If it is larger than the temporary maximum, set the temporary maximum
    equal to this integer.

    +   3. Repeat the previous step if there are more integers. If not, stop.

    +   4. When the algorithm terminates, the temporary maximum is the largest integer
    in the sequence.'
  merge: -1
  img_proc: true
- pgno: 2205
  md: '# Specifying Algorithms


    +   - Algorithms can be specified in different ways. Their steps can be described
    in English or in pseudocode.

    +   - Pseudocode is an intermediate step between an English language description
    of the steps and a coding of these steps using a programming language.

    +   - The form of pseudocode we use is specified in Appendix 3. It uses some of
    the structures found in popular languages such as C++ and Java.

    +   - Programmers can use the description of an algorithm in pseudocode to construct
    a program in a particular language.

    +   - Pseudocode helps us analyze the time required to solve a problem using an
    algorithm, independent of the actual programming language used to implement algorithm.'
  merge: -1
  img_proc: true
- pgno: 2206
  md: '# Properties of Algorithms


    +   - *Input*: An algorithm has input values from a specified set.

    +   - *Output*: From the input values, the algorithm produces the output values
    from a specified set. The output values are the solution.

    +   - *Correctness*: An algorithm should produce the correct output values for
    each set of input values.

    +   - *Finiteness*: An algorithm should produce the output after a finite number
    of steps for any input.

    +   - *Effectiveness*: It must be possible to perform each step of the algorithm
    correctly and in a finite amount of time.

    +   - *Generality*: The algorithm should work for all problems of the desired
    form.'
  merge: -1
  img_proc: true
