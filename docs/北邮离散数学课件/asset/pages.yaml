  md: '# String Concatenation


    **Definition**: Two strings can be combined via the operation of *concatenation*.
    Let Σ be a set of symbols and Σ* be the set of strings formed from the symbols
    in Σ. We can define the concatenation of two strings, denoted by ·, recursively
    as follows.

    BASIS STEP: If w ∈ Σ*, then w · λ = w.

    RECURSIVE STEP: If w₁ ∈ Σ* and w₂ ∈ Σ* and x ∈ Σ, then w₁ · (w₂ x) = (w₁ · w₂)
    x.


    +   - Often w₁ · w₂ is written as w₁ w₂.


    +   - If w₁ = abra and w₂ = cadabra, the concatenation w₁ w₂ = abracadabra.'
