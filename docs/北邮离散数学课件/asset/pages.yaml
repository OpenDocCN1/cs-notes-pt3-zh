- pgno: 550
  md: '# Rooted Trees


    +   - Trees will be covered in more depth in chapter 9.

    +     - Briefly, a tree is a graph in which there is exactly one undirected path
    between each pair of nodes.

    +     - An undirected graph can be represented as a set of unordered pairs (called
    *arcs*) of objects called *nodes*.

    +   - Definition of the set of rooted trees:

    +     - Any single node *r* is a rooted tree.

    +     - If *T₁, ..., Tₙ* are disjoint rooted trees with respective roots *r₁,
    ..., rₙ*, and *r* is a node not in any of the *Tᵢ*’s, then another rooted tree
    is {{*r,r₁*},...,{*r,rₙ*}} ∪ *T₁* ∪ ... ∪ *Tₙ*.'
