  md: '# Example To compute 3¹¹


    +   - 11=(1011)₂, So 3¹¹=3⁸ 3² 3¹. First compute 3²=9, and then 3⁴=9²=81, and
    3⁸=(3⁴)²=(81)²=6561, So 3¹¹=6561*9*3=177147

    +   - The algorithm successively finds b mod m, b² mod m, b⁴ mod m, ..., b^(2^{k-1})
    mod m, and multiply together those terms

    +   - To compute 3¹¹ mod 7 177147 mod 7=5

    +   - 3 mod 7=3 3²mod 7=2 (3²)² mod 7= 2*2 mod 7=4

    +   - ((3²)²)² mod 7= 4*4 mod 7=2

    +   - 3¹¹ mod 7=( (3⁸ mod 7) * (3² mod 7) * (3¹ mod 7)) mod 7=2*2*3 mod 7=5'
