- pgno: 1637
  md: '# 【推论二】：


    如果图 G =（V，E）是连通的平面简单图且 v 大于等于 3，，每个区域至少由四边围成，则有 e ≤ 2v − 4。


    用推论 1 和推论 2 易证明三管道图 k₃,₃ 及 5 个顶点完全图 k₅ 一定不是平面图。


    三管道图，每个区域都由 4 条边围成，v = 6，e = 9，2v − 4 = 12 − 4 = 8 < 9 = e。


    k₅ 每个区域至少由三条边围成，v = 5，e = 10，3v − 6 = 15 − 6 = 9 < 10 = e。'
  merge: -1
  img_proc: true
- pgno: 1638
  md: '# Proof:


    +   - By induction on the # of cycles of $G$.

    +   - **Base case:** $G$ has no cycles.

    +   - $G$ is connected so it must be a tree.

    +   - Thus, $e = v - 1$ and $f = 1$.


    $v - e + f = v - [v - 1] + 1$


    $= 1 + 1$


    $= 2$'
  merge: -1
  img_proc: true
- pgno: 1639
  md: "# Inductive step\n\n+   - Suppose $G$ has at least one cycle $C$ containing\
    \ edge $e$.\n+   - Let\n+   \n+   $G' = G - e$\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_1639_0.png)"
  merge: -1
  img_proc: true
- pgno: 1640
  md: '# Inductive step


    +   - $G''$ is connected since $e$ was on a cycle.

    +     - $f'' = f-1$ and $G''$ has fewer cycles than $G$.

    +     - $v'' = v$

    +     - $e'' = e-1$

    +   - By induction hypothesis:


    $v'' - e'' + f'' = 2$

    $v - [e - 1] + [f - 1] = 2$

    $v - e + f = 2$'
  merge: -1
  img_proc: true
