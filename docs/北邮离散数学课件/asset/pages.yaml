- pgno: 1446
  md: '# 计算机理论领域或迎重大突破


    来源：网易 作者： 发布时间：2015年11月30日 浏览量：785


    这几天一直流传所说的“复杂性理论”（complexity theory）领域出现了数年一见的大进展，可能会给互联网领域带来新的曙光。


    这话说错了——因为新的突破与网络之间的比较有关，正可以应用于人与人之间的互联网链接。芝加哥大学的数学家与计算机科学家拉斯洛·鲍勃伊（László Babai）发现了一种数学方法，可以用比之前少得多的步骤来判断两个网络是不是完全相同的，不管这些网络有多复杂或缠结。计算机科学界已经炸开了锅，因为很多难以解决的问题最终都可以归结到比较两个网络是否相同这一任务上。


    > “如果这一方法是的，它可能会成为计算机理论领域十年来最重要的成果。”麻省理工学院的计算机科学家、博客作者斯科特·阿伦森（Scott Aaronson）说。


    所谓复杂性理论，从根本上说就是研究哪些工作可以很容易地用计算机完成，哪些工作不能的理论。在复杂性理论中，最关键的事情是搞清楚随着输入数据的增长，解决一个问题所需的步骤会以什么样的方式增加。举个例子：如果你想知道一个给定的数，比如983或105227是不是素数（即只能被1和它自己整除的数），那计算机所要进行的步骤就随着给定数字位数的增长就相对比较缓慢，大体上以类似n的几次方的速度增长（n为位数）。像n^2这样的表达式被称为多项式（polynomial），因此这个问题就被称为可以在多项式时间内解决，复杂度类别为P。


    首页>>学会活动>>CCF 电子刊>>文章正文'
