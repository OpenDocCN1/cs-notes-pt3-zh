- pgno: 1060
  md: '二元关系：二个对象之间相关的关系


    多元关系：多个对象之间的关系


    多元关系常化成二元关系来研究


    无序的二元关系：方块k与梅花k，谁在前，谁在后都还是同点的


    有序的二元关系：父子关系，不能交换父与子的次序


    又如：


    +   (1) a + b = 偶数，a 与 b 是无序的

    +   用 [a, b] 表示无序对


    +   (2) a ≤ b，a 与 b 是有序的二元关系，叫作 a 相关于 b，记成 a r b，用 (a, b) 表示有序对


    +   (3) 无序的二元关系可用有序的二元关系表示

    +   即 (a, b) 与 (b, a) 都属于这种二元关系'
  merge: -1
  img_proc: true
- pgno: 1061
  md: '# Definition of relations


    +   - Let *A* and *B* be two sets. A *binary relation* *R* from *A* to *B* is
    a subset of *A* × *B*.

    +     - Note that the order of the two sets matters.

    +   - More generally, let *A₁, A₂, ..., Aₙ* be *n* sets. An *n-ary relation* *R*
    on these sets is a subset of *A₁* × *A₂* × ... × *Aₙ*.

    +     - The sets *Aᵢ* are known as the *domains* of the relation, and *n* as its
    *degree*

    +     - Again, the order of the domains matters.'
  merge: -1
  img_proc: true
- pgno: 1062
  md: '# Binary Relations


    +   - Let $A, B$ be any sets. A *binary relation* $R$ from $A$ to $B$, written
    (with signature) $R:A\times B$, or $R:A,B$, is (can be identified with) a subset
    of the set $A\times B$.

    +     - E.g., let $\prec : \mathbb{N}\leftrightarrow\mathbb{N} := \{(n,m)\mid
    n<m\}$

    +   - The notation $aRb$ or $aRb$ means that $(a,b)\in R$.

    +     - E.g., $a\prec b$ means $(a,b)\in\prec$

    +   - If $aRb$ we may say “$a$ is related to $b$ (by relation $R$)”,

    +     - or just “$a$ relates to $b$ (under relation $R$)”.

    +   - A binary relation $R$ corresponds to a predicate function $P_R:A\times B\to\{\mathrm{T},\mathrm{F}\}$
    defined over the 2 sets $A,B$;

    +     - e.g., predicate “eats” $:= \{(a,b)\mid$ organism $a$ eats food $b\}$'
  merge: -1
  img_proc: true
- pgno: 1063
  md: '# 定义： 二元关系/binary relation


    ----按照某种规定，定义了一个有序对（a，b）的集合R，其中 a ∈ A， b ∈ B，称R为A到B的一个二元关系。


    Let A and B be sets. A binary relation from A to B is a subset of A × B.


    R = {（a，b）| a ∈ A， b ∈ B， a r b } 其中 a r b 读作 a 相关于 b。


