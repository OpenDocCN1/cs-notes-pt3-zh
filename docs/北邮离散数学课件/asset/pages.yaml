    x_2, \ldots, x_n)$，其中 $n$ 是该表达式中不同个体变量的数目。$n$ 元谓词也称简单命题函数。


    +   - 复合命题函数 简单命题函数和复合命题函数，统称为命题函数（proposition function）。'
