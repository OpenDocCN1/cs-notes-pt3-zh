- pgno: 542
  md: '# Inductive Proof about Fib. series


    +   - **Theorem:** $f_n < 2^n$.

    +   - **Proof:** By induction. Implicitly for all $n \in \mathbb{N}$


    Base cases: $f_0 = 0 < 2^0 = 1$ $f_1 = 1 < 2^1 = 2$ Note use of base cases of
    recursive defn


    Inductive step: Use 2nd principle of induction (strong induction). Assume $\forall
    k < n,\ f_k < 2^k$. Then $f_n = f_{n-1} + f_{n-2}$ is $< 2^{n-1} + 2^{n-2} < 2^{n-1}
    + 2^{n-1} = 2^n$.'
  merge: -1
  img_proc: true
- pgno: 543
  md: '# A lower bound on Fibonacci series


    +   - **Theorem.** For all integers $n \ge 3$, $f_n > \alpha^{n-2}$, where $\alpha
    = (1+5^{1/2})/2 \approx 1.61803.$

    +   - **Proof.** (Using strong induction.)

    +     - Let $P(n) = (f_n > \alpha^{n-2})$.

    +     - **Base cases:** For $n=3$, note that $\alpha < 2 = f_3$. For $n=4$, $\alpha^2
    = (1+2\cdot5^{1/2}+5)/4 = (3+5^{1/2})/2 \approx 2.61803 < 3 = f_4$.

    +     - **Inductive step:** For $k\ge4$, assume $P(j)$ for $3\le j\le k$, prove
    $P(k+1)$. Note $\alpha^2 = \alpha+1$. Thus, $\alpha^{k-1} = (\alpha+1)\alpha^{k-3}
    = \alpha^{k-2} + \alpha^{k-3}$. By inductive hypothesis, $f_{k-1} > \alpha^{k-3}$
    and $f_k > \alpha^{k-2}$. So, $f_{k+1} = f_k + f_{k-1} > \alpha^{k-2} + \alpha^{k-3}
    = \alpha^{k-1}$. Thus $P(k+1)$. ■'
  merge: -1
  img_proc: true
