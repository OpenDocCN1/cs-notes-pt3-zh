- pgno: 863
  md: '# ≤ is antisymmetric


    +   - \( a \leq b \) if and only if \( a = a^*b \)


    +   - Now suppose that


    +   - \( a \leq b \) and \( b \leq a \).


    +   - Then, by definition and property 2,


    +   - \( a = a^*b = b^*a = b \),


    +   - so \( a = b \).


    +   - Thus \( \leq \) is antisymmetric.'
