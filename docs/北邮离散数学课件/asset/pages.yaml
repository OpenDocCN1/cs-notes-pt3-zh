- pgno: 578
  md: '# Loop Invariants


    +   - For a while loop “**while** *cond S*”, we say that *p* is a loop invariant
    of this loop if (*p* ∧ *cond*){*S*}*p*.

    +     - If *p* (and the continuation condition *cond*) is true before executing
    the body, then *p* remains true afterwards.

    +       - And so *p* stays true through *all* subsequent iterations.

    +   - This leads to the inference rule:

    +     (*p* ∧ *cond*){*S*}*p*

    +     ∴ *p*{**while** *cond S*}(¬*cond* ∧ *p*)'
  merge: -1
