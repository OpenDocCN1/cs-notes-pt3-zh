- pgno: 1673
  md: '# [定理2]库氏定理/kuratowski’s theorem


    平面图判断的充要条件。


    一个图是平面图的充分必要条件是它不含有与k₅和k₃,₃同胚的子图。


    例：6个顶点的完全图必不是平面图。


    图b是图a的子图，图b去掉次为2的顶点V₆，使V₁与V₅直接相邻，就是5个顶点的完全图k₅，图b与k₅同胚，所以图a一定不是平面图。当然，k₅也是图a的子图。


    尽管有了库氏定理，判别一个图是否是平面图还是相当困难。'
  merge: -1
