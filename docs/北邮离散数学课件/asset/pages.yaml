- pgno: 1023
  md: '# Theorem 2


    Let $R$ be a congruence relation on the group $(G, *)$. Then the semigroup $(G/R,
    \odot)$ is a group, where the operation $\odot$ is defined on $G/R$ by $[a] \odot
    [b] = [a*b]$


    # Proof


    Since a group is a monoid, $G/R$ is a monoid.


    Let $[a] \in G/R$.


    Then $[a^{-1}] \in G/R$, and $[a] \odot [a^{-1}] = [a*a^{-1}] = [e]$.


    So $[a]^{-1} = [a^{-1}]$.


    Hence $(G/R, \odot)$ is a group.'
  merge: -1
