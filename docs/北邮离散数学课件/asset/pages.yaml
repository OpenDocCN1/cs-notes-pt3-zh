- pgno: 1996
  md: '# Proof by Contradiction Example


    +   - **Theorem:** √2 is irrational.

    +     - **Proof:** Assume 2^{1/2} were rational. This means there are integers
    i, j with no common divisors such that 2^{1/2} = i/j. Squaring both sides, 2 =
    i²/j², so 2j² = i². So i² is even; thus i is even. Let i=2k. So 2j² = (2k)² =
    4k². Dividing both sides by 2, j² = 2k². Thus j² is even, so j is even. But then
    i and j have a common divisor, namely 2, so we have a contradiction. □


