- pgno: 501
  md: '# The Well-Ordering Property

    良序特性


    +   - Another way to prove the validity of the inductive inference rule is by
    using the *well-ordering property*, which says that:

    +     - Every non-empty set of non-negative integers has a minimum (smallest)
    element.

    +     - ∀ ∅ ⊂ S ⊆ N : ∃ m ∈ S : ∀ n ∈ S : m ≤ n

    +   - This implies that {n | ¬P(n)} (if non-empty) has a min. element m, but then
    the assumption that P(m−1) → P((m−1)+1) would be contradicted.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# The Method of Infinite Descent

    无穷递降法


    +   - A way to prove that *P(n)* is false for all *n*∈**N**.

    +   - Sort of a converse to the principle of induction.

    +   - Prove first that ∀*P(n)*: ∃*k*<*n*: *P(k)*.

    +     - Basically, “For every *P* there is a smaller *P.*”

    +   - But by the well-ordering property of **N**, we know that ∃*P(m)* → ∃*P(n)*:
    ∀*P(k)*: *n*≤*k*.

    +     - Basically, “If there is a *P*, there is a smallest *P.*”

    +   - Note that these are contradictory unless ¬∃*P(m)*,

    +     - that is, ∀*m*∈**N**: ¬*P(m)*. There is no *P*.'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# Infinite Descent Example


    +   - **Theorem:** $2^{1/2}$ is irrational.

    +   - **Proof:** Suppose $2^{1/2}$ is rational, then $\exists m,n\in\mathbf{Z}^+$:
    $2^{1/2}=m/n$. Let $M,N$ be the $m,n$ with the least $n$.


    $\sqrt{2}=\frac{M}{N}\therefore 2=\frac{M^2}{N^2}\therefore 2N^2=M^2.$


    $\frac{2N-M}{M-N}=\frac{(2N-M)N}{(M-N)N}=\frac{2N^2-MN}{(M-N)N}=\frac{M^2-MN}{(M-N)N}=\frac{(M-N)M}{(M-N)N}=\frac{M}{N}$


    $1<\sqrt{2}<2\therefore 1<\frac{M}{N}<2\therefore N<M<2N\therefore 0<M-N<N$


    So $\exists k<N,j$: $2^{1/2}=j/k$ (let $j=2N-M$, $k=M-N$).'
  merge: -1
  img_proc: true
