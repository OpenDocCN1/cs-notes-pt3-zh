  md: '# Backward Reasoning Example


    Example 1


    +   - **Theorem:**

    +     ∀a>0,b>0,a≠b: (a+b)/2 > (ab)^{1/2}.

    +   - **Proof:**

    +     - Notice it is not obvious how to go from the premises *a*>0, *b*>0, *a*≠*b*
    directly forward to the conclusion *(a+b)/2 > (ab)^{1/2}*.

    +     - So, let’s work *backwards* from the conclusion, *(a+b)/2 > (ab)^{1/2}*
    !'
