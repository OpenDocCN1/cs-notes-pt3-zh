- pgno: 1081
  md: '# Properties of relations


    +   - A relation $R$ on a set $A$ is

    +   - *reflexive*, if

    +     - $\forall x \in A, (x, x) \in R$

    +   - *symmetric*, if

    +     - $\forall x \forall y, (x, y) \in R \Rightarrow (y, x) \in R$

    +   - *antisymmetric*, if

    +     - $\forall x \forall y, (x, y) \in R \text{ and } (y, x) \in R \Rightarrow
    x = y$

    +   - *transitive*, if

    +     - $\forall x \forall y \forall z, (x, y) \in R \text{ and } (y, z) \in R
    \Rightarrow (x, z) \in R$'
  merge: -1
  img_proc: true
- pgno: 1082
  md: '# Example


    +   - Consider the “divides” relation on the set of nonnegative integers: x|y
    iff x divides y.

    +   - Reflexive?

    +     - NO. 0 does not divide 0. (Would be reflexive on the set of positive integers)

    +   - Symmetric?

    +     - NO. 2 divides 4, but not the other way around.

    +   - Antisymmetric? YES

    +   - Transitive? YES'
  merge: -1
