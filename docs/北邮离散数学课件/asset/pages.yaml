- pgno: 1296
  md: '# Example


    +   - Let $S$ be a set and let $L = P(S)$.

    +     - As we have seen, $\subseteq$, containment, is a partial order on $L$.
    Let $A$ and $B$ belong to the poset $(L, \subseteq)$.

    +   - $A \vee B$ is the set $A \cup B$.

    +     - To see that, note that $A \subseteq A \cup B$, $B \subseteq A \cup B$,
    and if $A \subseteq C$ and $B \subseteq C$, then it follows that $A \cup B \subseteq
    C$.

    +   - Similarly, $A \wedge B$ is the set $A \cap B$.

    +   - Thus, $L$ is a lattice.'
  merge: -1
  img_proc: true
