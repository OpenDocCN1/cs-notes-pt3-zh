- pgno: 2036
  md: '# Steps of Example


    +   - $(a+b)/2 > (ab)^{1/2} \Leftrightarrow$ (squaring both sides)

    +     - This preserves the “>” since both sides are positive.

    +   - $(a+b)^2/4 > ab \Leftrightarrow$ (multiplying through by 4)

    +   - $(a+b)^2 > 4ab \Leftrightarrow$ (squaring $a+b$)

    +   - $a^2+2ab+b^2 > 4ab \Leftrightarrow$ (subtracting out $4ab$)

    +   - $a^2-2ab+b^2 > 0 \Leftrightarrow$ (factoring left side)

    +   - $(a-b)^2 > 0$

    +   - Now, since $a\neq b$, $(a-b)\neq 0$, thus $(a-b)^2>0$, and we can work our
    way back along the chain of steps...'
  merge: -1
  img_proc: true
- pgno: 2037
  md: '# "Forwardized" version of Example


    +   - **Theorem:** ∀a>0,b>0,a≠b: (a+b)/2 > (ab)^{1/2}.

    +     - **Proof.** If Since a≠b, (a−b)≠0. Thus, (a−b)²>0, i.e., a²−2ab+b² > 0.
    Adding 4ab to both sides, a²+2ab+b² > 4ab. Factoring the left side, we have (a+b)²
    > 4ab, so (a+b)²/4 > ab. Since ab is positive, we can take the square root of
    both sides and get (a+b)/2 > (ab)^{1/2}.


    +   - This is just a simple proof proceeding directly from premises to conclusion,
    but if you don’t realize how it was obtained, it looks “magical."

    +     - A common student reaction: “But how did you know to pick 4ab out of thin
    air, to add to both sides?"

    +     - Answer: By working backwards from the conclusion!'
  merge: -1
  img_proc: true
