- pgno: 328
  md: '# Predicate Logic（§ 1.4）


    谓词逻辑


    +   - 前两节介绍的命题与命题演算是命题逻辑的内容，其基本组成单位是原子命题。一般地，原子命题作为具有真假意义的句子至少由主语和谓语两部分组成。

    +   - 例如，<span style="color:#00a5ad">电子商务是计算机技术的一个应用</span>，这里“电子商务”是主语，而“是……”是谓语。当主语改变为“电子政务”时就得到新的原子命题：<span
    style="color:#00a5ad">电子政务是计算机技术的一个应用</span>。'
  merge: -1
  img_proc: true
- pgno: 329
  md: +   由此可知，主语是独立存在的个体/值/Value，而谓语用来描述该个体的性质或个体间的关系，这里我们称其为谓词/Predicate。用P表示谓词“是......”。则P（电子商务）或P（电子政务）分别等值于前述两个命题的表达。将个体用变量（称为个体变量）x推广，则P（x）表示：x是计算机技术的一个新的应用。这时该语句就不是一个命题，而是一个命题函数。
  merge: -1
  img_proc: true
- pgno: 330
  md: '# DEFINITION 1.


