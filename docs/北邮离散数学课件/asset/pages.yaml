- pgno: 721
  md: '# Coding theory


    In today’s modern world of communication, data items(项目) are constantly being
    transmitted (传输) from point to point. The basic problem in transmission of data
    is that of receiving the data as sent and not receiving a distorted (扭曲的) piece
    of data.


    Coding theory has developed techniques for introducing redundant information(引入冗余信息)
    in transmitted data that help in detecting (检测), and sometimes in correcting,
    errors.'
