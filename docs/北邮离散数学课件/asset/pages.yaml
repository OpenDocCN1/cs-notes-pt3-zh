  md: '# Modular Exponentiation Problem (from § 4.2)P253


    +   - **Problem:** Given large integers *b* (base), *n* (exponent), and *m* (modulus),
    efficiently compute *bⁿ mod m*.

    +     - Note that *bⁿ* *itself* may be completely infeasible to compute and store
    directly.

    +     - *E.g.* if *n* is a 1,000-bit number, then *bⁿ* itself will have far more
    *digits* than there are atoms in the universe!

    +   - Yet, this is a type of calculation that is commonly required in modern cryptographic
    algorithms!'
