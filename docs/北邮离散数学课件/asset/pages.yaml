  md: '# Parity check matrix –

    一致性检验矩阵


    Let $m < n$ and $r = n - m$, the following $n \times r$ Boolean matrix is called
    a *parity check matrix*.


    ```

    H = \begin{bmatrix} H_{m\times r} \\ I_r \end{bmatrix} = \begin{bmatrix} h_{11}
    & h_{12} & \cdots & h_{1r} \\ h_{21} & h_{22} & \cdots & h_{2r} \\ \vdots & \vdots
    &  & \vdots \\ h_{m1} & h_{m2} & \cdots & h_{mr} \\ \hline 1 & 0 & \cdots & 0
    \\ 0 & 1 & \cdots & 0 \\ \vdots & \vdots &  & \vdots \\ 0 & 0 & \cdots & 1 \end{bmatrix}

    ```'
