- pgno: 742
  md: '# Theorem 2


    An (*m*, *n*) encoding function *e*: *B*^m → *B*^n can detect *k* or fewer errors

    if and only if

    its minimum distance is at least *k* + 1.'
  merge: -1
  img_proc: true
- pgno: 743
  md: '# Proof


    ← the minimum distance is at least k + 1


    Let b ∈ B^m, and let x = e(b) ∈ B^n be the code word representing b.


    x is transmitted and is received as x_t. If x_t were a code word different from
    x, then δ(x, x_t) ≥ k+1, so x would be transmitted with k + 1 or more errors.


    Thus, if x is transmitted with k or fewer errors, then x_t cannot be a code word.


    This means that e can detect k or fewer errors.'
  merge: -1
  img_proc: true
- pgno: 744
  md: '# Proof


    *e* can detect *k* or fewer errors ⇒


    Suppose that the minimum distance between code words is *r* ≤ *k*


    Let *x* and *y* be code words with δ(*x*, *y*) = *r*.


    If *x* = *y*, that is, if *x* is transmitted and is mistakenly received as y,
    then *r*≤*k* errors have been committed and have not been detected.


    Thus it contradict with *e* can detect *k* or fewer errors.


    Q.E.D.'
  merge: -1
  img_proc: true
