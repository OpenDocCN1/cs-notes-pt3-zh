- pgno: 864
  md: '# ≤ is transitive


    – a ≤ b if and only if a = a*b


    +   • If a ≤ b and b ≤ c,

    +   – then a = a*b = a*(b*c) = (a*b)*c = a*c,

    +   – so a ≤ c and

    +   – ≤ is transitive.'
