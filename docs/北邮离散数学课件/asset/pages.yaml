- pgno: 19
  md: '# Representations of Integers


    +   - In the modern world, we use *decimal*, or *base 10*, *notation* to represent
    integers. For example when we write 965, we mean 9·10² + 6·10¹ + 5·10⁰.

    +   - We can represent numbers using any base *b*, where *b* is a positive integer
    greater than 1.

    +   - The bases *b* = 2 (*binary*), *b* = 8 (*octal*), and *b*= 16 (*hexadecimal*)
    are important for computing and communications

    +   - The ancient Mayans used base 20 and the ancient Babylonians used base 60.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Base b Representations


    +   - We can use positive integer $b$ greater than 1 as a base, because of this
    theorem:

    +   **Theorem 1:** Let $b$ be a positive integer greater than 1. Then if $n$ is
    a positive integer, it can be expressed uniquely in the form:

    +   $$n = a_k b^k + a_{k-1} b^{k-1} + .... + a_1 b + a_0$$

    +   where $k$ is a nonnegative integer, $a_0, a_1, ..., a_k$ are nonnegative integers
    less than $b$, and $a_k \neq 0$. The $a_j$, $j = 0, ..., k$ are called the base-$b$
    digits of the representation.

    +   (We will prove this using mathematical induction in Section 5.1.)

    +   - The representation of $n$ given in Theorem 1 is called the *base $b$ expansion
    of $n$* and is denoted by $(a_k a_{k-1}....a_1 a_0)_b$.

    +   - We usually omit the subscript 10 for base 10 expansions.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # Binary Expansions


    Most computers represent integers and do arithmetic with binary (base 2) expansions
    of integers. In these expansions, the only digits used are 0 and 1.


    **Example:** What is the decimal expansion of the integer that has (1 0101 1111)₂
    as its binary expansion?


    **Solution:**


    (1 0101 1111)₂ = 1·2⁸ + 0·2⁷ + 1·2⁶ + 0·2⁵ + 1·2⁴ + 1·2³ + 1·2² + 1·2¹ + 1·2⁰
    = 351.


    **Example:** What is the decimal expansion of the integer that has (11011)₂ as
    its binary expansion?


    **Solution:** (11011)₂ = 1·2⁴ + 1·2³ + 0·2² + 1·2¹ + 1·2⁰ = 27'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Octal Expansions


    The octal expansion (base 8) uses the digits {0,1,2,3,4,5,6,7}.


    **Example**: What is the decimal expansion of the number with octal expansion
    (7016)₈?


    **Solution**: 7·8³ + 0·8² + 1·8¹ + 6·8⁰ = 3598


    **Example**: What is the decimal expansion of the number with octal expansion
    (111)₈?


    **Solution**: 1·8² + 1·8¹ + 1·8⁰ = 64 + 8 + 1 = 73'
