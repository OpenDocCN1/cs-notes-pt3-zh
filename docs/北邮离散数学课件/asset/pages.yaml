- pgno: 1888
  md: '充分性：若G是连通的，


    +   (1) 若G无回路，则G本身是树，即生成树。

    +   (2) 若存在回路，去掉回路中任一辺，不影响连通性，也不减少顶点。


    所有回路都移去一条边，剩下的子图包含所有顶点，又是无回路的连通图，即为生成树。


    注： ① 移去边时可随意，故生成树不唯一。


    ② 生成树是G的最小连通生成子图，若将G =（V，E）看成是各顶点间的通讯联络图，则生成树T =（V，E’）即为各顶点间直接或间接联络的最小通讯联络图。'
  merge: -1
  img_proc: true
- pgno: 1889
  md: '# IP Multicasting


    +   - 目前，使用得最为广泛的组播技术是IP Multicast。IP组播技术是一种为优化使用网络资源而产生的技术，通常用于多点工作方式下的应用程序中，它是标准IP网络层协议技术的一个扩展。


    从Steve Deering于1989年提出的IETF的RFC1112"Host Extension for IP Multicast"中的定义我们可以得知：IP组播的核心思想是--通过一个IP地址向一组主机发送数据（UDP包）。发送者仅仅向一个组地址发送信息，接收者只需加入到这个分组就可以接收信息，所有的接收者接收的是同一个数据流，组中成员是动态的，可以根据自己的意愿随时随意加入或退出。每
    一台主机都可以同时加入到多个组中，每一个组播地址可以在不同的端口或者不同的套接字（Socket）上有多个数据流，同时许多实际应用可以共享一个组地址。IP组播技术可以有效地避免重复发送可能引起的广播风暴，并且能够突破路由器的限制，将数据包传送到其它网段。'
  merge: -1
  img_proc: true
