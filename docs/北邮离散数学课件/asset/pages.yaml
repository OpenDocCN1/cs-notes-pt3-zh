- pgno: 761
  md: '# Theorem 5


    Let $m$ and $n$ be nonnegative integers with $m < n$, $r = n - m$, and let $\mathbf{H}$
    be an $n \times r$ Boolean matrix.


    Then the function $f_H: B^n \to B^r$ defined by

    $f_H(x) = x^* \mathbf{H}, \ x \in B^n$;

    is a homomorphism from the group $B^n$ to the group $B^r$.'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# Proof


    If $x$ and $y$ are elements in $B^n$, then

    $f_H(x \oplus y) = (x \oplus y) * \mathbf{H}$

    $= (x * \mathbf{H}) \oplus (y * \mathbf{H}) \quad \text{by Theorem 4}$

    $= f_H(x) \oplus f_H(y)$.

    Hence $f_H$ is a homomorphism from $B^n$ to $B^r$

    Q.E.D.'
  merge: -1
  img_proc: true
- pgno: 763
  md: '# Corollary 1


    Let $m$, $n$, $r$, **H**, and $f_H$ be as in Theorem 5.

    Then

    $N = \{x \in B^n \mid x^* \mathbf{H} = \mathbf{0}\}$

    is a normal subgroup of $B^n$.


    # Proof:


    $N$ is the kernel of the homomorphism $f_H$, so it is a normal subgroup of $B^n$.'
