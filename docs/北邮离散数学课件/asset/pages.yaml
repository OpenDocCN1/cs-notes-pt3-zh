- pgno: 37
  md: "# Modular Exponentiation\n\n```\nprocedure modularExponentiation(b: integer,\
    \ n = (n_{k-1}...n_0)_2, m: positive integers)\n  x := 1    {result will be accumulated\
    \ here}\n  b2i := b mod m    { b^{2^i} mod m; i=0 initially }\n  for i := 0 to\
    \ k-1    {go thru all k bits of n}\n    if n_i = 1 then x := (x·b2i) mod m\n \
    \   b2i := (b2i·b2i) mod m\n  return x\n\nb^{2^{i+1}} = b^{2·2^{i}} = (b^{2^{i}})·(b^{2^{i}})\n\
    ```"
