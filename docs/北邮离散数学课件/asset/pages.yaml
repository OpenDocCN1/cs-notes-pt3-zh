- pgno: 257
  md: '# 范式的存在性定理


    +   - 任意一个命题公式均存在一个与之等值的析取范式和合取范式

    +   - 证明：对于任意公式，可用下面的方法构造出与其等价的析取范式和合取范式

    +     - 第一步：利用等价式，消去公式中的联结符→和↔

    +       - (1) P → Q ⇔ ¬P ∨ Q

    +       - (2) P ↔ Q ⇔ (P → Q) ∧ (Q → P)

    +     - 第二步：利用德摩根律将公式中的联结符¬移到命题变量之前，用双重否定律消去两个连续的联结符¬

    +     - 第三步：用分配律将公式化为基本积的析取或基本和的合取。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 例


    +   - 例2：求公式（P ∨ Q） → R 的析取范式和合取范式

    +   - 解：

    +     - （P ∨ Q） → R ⇔ ¬（P ∨ Q） ∨ R ⇔ （¬P ∧ ¬Q） ∨ R ⇔ （¬P ∨ R） ∧ （¬Q ∨ R） 合取范式

    +     - 原式 ⇔ （¬P ∨ R） ∧ （¬Q ∨ R） ⇔ （（¬P ∨ R） ∧ （¬Q）） ∨ （（¬P ∨ R） ∧ R） ⇔ （¬P ∧
    ¬Q） ∨ （R ∧ ¬Q） ∨ （¬P ∧ R） ∨ R 析取范式

    +     - 原式 ⇔ （¬P ∧ ¬Q） ∨ （R ∧ ¬Q） ∨ R ⇔ （¬P ∧ ¬Q） ∨ R 析取范式

    +     - 析取（合取）范式不唯一！'
