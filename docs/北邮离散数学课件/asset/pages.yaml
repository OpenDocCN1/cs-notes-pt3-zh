  md: '# Theorem 5


    +   - Let $L = \{a_1, a_2, ..., a_n\}$ be a finite lattice. Then $L$ is bounded.

    +   - **Proof**

    +     - The greatest element of L is $a_1 \vee a_2 \vee ... \vee a_n$,

    +     - and its least element is $a_1 \wedge a_2 \wedge ... \wedge a_n$'
