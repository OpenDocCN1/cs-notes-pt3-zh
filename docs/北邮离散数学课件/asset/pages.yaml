- pgno: 601
  md: '# Inclusion-Exclusion Principle

    ( § § 8.5 )


    +   - Suppose that *k ≤ m* of the ways of doing task 1 also simultaneously accomplish
    task 2.

    +     - And thus are also ways of doing task 2.

    +   - Then, the number of ways to accomplish “Do either task 1 or task 2” is *m
    + n − k*.

    +   - Set theory: If *A* and *B* are not disjoint, then |*A* ∪ *B*| = |*A*| +
    |*B*| − |*A* ∩ *B*|.

    +     - If they are disjoint, this simplifies to |*A*| + |*B*|.'
  merge: -1
