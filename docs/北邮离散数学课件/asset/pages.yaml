- pgno: 65
  md: "# Uniqueness of Prime Factorization\n\n+   We will prove that a prime factorization\
    \ of a positive integer where the primes are in nondecreasing order is unique.\
    \ (This part of the fundamental theorem of arithmetic. The other part, which asserts\
    \ that every positive integer has a prime factorization into primes, will be proved\
    \ in Section 5.2.)\n\n**Proof:** *(by contradiction)* Suppose that the positive\
    \ integer $n$ can be written as a product of primes in two distinct ways:\n\n\
    $n = p_1 p_2 \\cdots p_s$ and $n = q_1 q_2 \\cdots q_t$.\n\n+   Remove all common\
    \ primes from the factorizations to get\n+   \n+   $p_{i_1} p_{i_2} \\cdots p_{i_u}\
    \ = q_{j_1} q_{j_2} \\cdots q_{j_v}$.\n\n+   By Lemma 3, it follows that $p_{i_1}$\
    \ divides $q_{j_k}$, for some $k$, contradicting the assumption that $p_{i_1}$\
    \ and $q_{j_k}$ are distinct primes.\n\n+   Hence, there can be at most one factorization\
    \ of $n$ into primes in nondecreasing order."
  merge: -1
  img_proc: true
