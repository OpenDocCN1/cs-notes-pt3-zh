- pgno: 2288
  md: '# Complexity of Problems


    +   - Tractable Problem: There exists a polynomial time algorithm to solve this
    problem. These problems are said to belong to the Class P.

    +   - Intractable Problem: There does not exist a polynomial time algorithm to
    solve this problem

    +   - Unsolvable Problem : No algorithm exists to solve this problem, e.g., halting
    problem.

    +   - Class NP: Solution can be checked in polynomial time. But no polynomial
    time algorithm has been found for finding a solution to problems in this class.

    +   - NP Complete Class: If you find a polynomial time algorithm for one member
    of the class, it can be used to solve all the problems in the class.'
  merge: -1
  img_proc: true
- pgno: 2289
  md: '# # P Versus NP Problem


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2289_0.png)


    +   - The P versus NP problem asks whether the class P = NP? Are there problems
    whose solutions can be checked in polynomial time, but can not be solved in polynomial
    time?


    +   - Note that just because no one has found a polynomial time algorithm is different
    from showing that the problem can not be solved by a polynomial time algorithm.


    +   - If a polynomial time algorithm for any of the problems in the NP complete
    class were found, then that algorithm could be used to obtain a polynomial time
    algorithm for every problem in the NP complete class.


    +   - Satisfiability (in Section 1.3) is an NP complete problem.


    +   - It is generally believed that P≠NP since no one has been able to find a
    polynomial time algorithm for any of the problems in the NP complete class.


    +   - The problem of P versus NP remains one of the most famous unsolved problems
    in mathematics (including theoretical computer science). The Clay Mathematics
    Institute has offered a prize of $1,000,000 for a solution.'
  merge: -1
  img_proc: true
