- pgno: 51
  md: '# Generating Primes


    +   - The problem of generating large primes is of both theoretical and practical
    interest.

    +   - We will see (in Section 4.6) that finding large primes with hundreds of
    digits is important in cryptography.

    +   - So far, no useful closed formula that always produces primes has been found.
    There is no simple function $f(n)$ such that $f(n)$ is prime for all positive
    integers $n$.

    +   - But $f(n) = n^2 - n + 41$ is prime for all integers 1,2,..., 40. Because
    of this, we might conjecture that $f(n)$ is prime for all positive integers $n$.
    But $f(41) = 41^2$ is not prime.

    +   - More generally, there is no polynomial with integer coefficients such that
    $f(n)$ is prime for all positive integers $n$. (See supplementary Exercise 23.)

    +   - Fortunately, we can generate large integers which are almost certainly primes.
    See Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Conjectures about Primes


    +   - Even though primes have been studied extensively for centuries, many conjectures
    about them are unresolved, including:

    +   - *Goldbach’s Conjecture*: Every even integer *n*, *n* > 2, is the sum of
    two primes. It has been verified by computer for all positive even integers up
    to 1.6·10¹⁸. The conjecture is believed to be true by most mathematicians.

    +   - There are infinitely many primes of the form *n*² + 1, where *n* is a positive
    integer. But it has been shown that there are infinitely many primes of the form
    *n*² + 1, where *n* is a positive integer or the product of at most two primes.

    +   - *The Twin Prime Conjecture*: The twin prime conjecture is that there are
    infinitely many pairs of twin primes. Twin primes are pairs of primes that differ
    by 2. Examples are 3 and 5, 5 and 7, 11 and 13, etc. The current world’s record
    for twin primes (as of mid 2011) consists of numbers 65,516,468,355·2³³³³³³ ±1,
    which have 100,355 decimal digits.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Greatest Common Divisor


    **Definition**: Let *a* and *b* be integers, not both zero. The largest integer
    *d* such that *d* | *a* and also *d* | *b* is called the greatest common divisor
    of *a* and *b*. The greatest common divisor of *a* and *b* is denoted by gcd(*a*,*b*).


    One can find greatest common divisors of small numbers by inspection.


    **Example**: What is the greatest common divisor of 24 and 36?


    **Solution**: gcd(24,26) = 12


    **Example**: What is the greatest common divisor of 17 and 22?


    **Solution**: gcd(17,22) = 1'
