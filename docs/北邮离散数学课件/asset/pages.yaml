- pgno: 89
  md: '# Hashing Functions


    **Definition:** A *hashing function* h assigns memory location h(k) to the record
    that has k as its key.


    +   - A common hashing function is h(k) = k mod m, where m is the number of memory
    locations.

    +   - Because this hashing function is onto, all memory locations are possible.


    **Example:** Let h(k) = k mod 111. This hashing function assigns the records of
    customers with social security numbers as keys to memory locations in the following
    manner:


    h(064212848) = 064212848 mod 111 = 14

    h(037149212) = 037149212 mod 111 = 65

    h(107405723) = 107405723 mod 111 = 14, but since location 14 is already occupied,
    the record is assigned to the next available position, which is 15.


    +   - The hashing function is not one-to-one as there are many more possible keys
    than memory locations. When more than one record is assigned to the same location,
    we say a collision occurs. Here a collision has been resolved by assigning the
    record to the first free location.

    +   - For collision resolution, we can use a linear probing function:

    +     h(k,i) = (h(k) + i) mod m, where i runs from 0 to m − 1.

    +   - There are many other methods of handling with collisions. You may cover
    these in a later CS course.'
  merge: -1
  img_proc: true
