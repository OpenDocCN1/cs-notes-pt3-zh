- pgno: 790
  md: '# # Proof


    Let \(aK\) be a left coset of \(K\) in \(G\), where \(a \in G\). Consider the
    function \(f: K \rightarrow aK\) defined by \(f(k) = ak\), for \(k \in K\).

    We show that \(f\) is one to one and onto.

    To show that \(f\) is one to one, we assume that \(f(k_1) = f(k_2)\), \(k_1, k_2
    \in K\).

    Then \(ak_1 = ak_2\)

    Left multiply \(a^{-1}\), we have \(k_1 = k_2\)'
  merge: -1
  img_proc: true
- pgno: 791
  md: '# # Proof


    To show that \( f \) is onto, let \( b \) be an arbitrary element in \( aK \).
    Then \( b = ak \) for some \( k \in K \).

    We now have

    \( f(k) = ak = b \)

    so \( f \) is onto.


    Since \( f \) is one to one and onto, \( K \) and \( aK \) have the same number
    of elements.


    > Q.E.D'
  merge: -1
  img_proc: true
