  md: "# # The RSA Cryptosystem\n\n• A public key cryptosystem, now known as the RSA\
    \ system was introduced in 1976 by three researchers at MIT.\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_109_0.png)\n\
    \n**Clifford Cocks**  \n(Born 1950)\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_109_1.png)\n\
    \nRonald Rivest  \n(Born 1948)\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_109_2.png)\n\
    \nAdi Shamir  \n(Born 1952)\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_109_3.png)\n\
    \nLeonard  \nAdelman  \n(Born 1945)\n\n• It is now known that the method was discovered\
    \ earlier by Clifford Cocks, working secretly for the UK government.\n\n• The\
    \ public encryption key is $(n,e)$, where $n=pq$ (the modulus) is the product\
    \ of two large (200 digits) primes $p$ and $q$, and an exponent $e$ that is relatively\
    \ prime to $(p−1)(q−1)$. The two large primes can be quickly found using probabilistic\
    \ primality tests, discussed earlier. But $n=pq$, with approximately 400 digits,\
    \ cannot be factored in a reasonable length of time."
