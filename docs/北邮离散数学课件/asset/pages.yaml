- pgno: 1833
  md: '设 l_i 为第 i 个字母前缀码长， w_i 为此字母在


    1 0 0 0 个字母中出现次数（频率,概率）， ∑_{i=1}^{26} l_i w_i


    就是 1 0 0 0 个字母所需二进制代码总长。


    目标:构造一个适当的二元有序加权树，使总长达到最小。（对任何标识符及文字的集合均可采用）。


    [定义]树的权：设树 T 有 t 片叶，对应的权为 w_1， w_2，…， w_t（叶以权 w_i 命名），根到叶 w_i 的道路长为 l（w_i）= l_i，则称
    T 为关于权 w_1， w_2，…，


    w_t 的二元树， w（T）= ∑_{i=1}^{t} w_i l_i 称为树 T 的权。'
