- pgno: 155
  md: '# Exclusive-Or Truth Table


    +   - Note that $p \oplus q$ means that $p$ is true, or $q$ is true, but **not
    both**!

    +   - This operation is called *exclusive or*, because it **excludes** the possibility
    that both $p$ and $q$ are true.

    +   - “¬” and “⊕” together are **not** universal.


    | p | q | $p \oplus q$ |

    |---|---|---|

    | F | F | F |

    | F | T | T |

    | T | F | T |

    | T | T | **F** |


    Note difference from OR.'
