- pgno: 1255
  md: '# § 9.6: Partial Orderings


    +   - A relation $R$ on $A$ is called a *partial ordering* or *partial order*
    iff it is reflexive, antisymmetric, and transitive.

    +     - We often use a symbol looking something like $\preceq$ (or analogous shapes)
    for such relations.

    +     - Examples: $\le$, $\ge$ on real numbers, $\subseteq$, $\supseteq$ on sets.

    +     - Another example: the divides relation $|$ on $\mathbf{Z}^+$.

    +       - Note it is not necessarily the case that either $a \preceq b$ or $b
    \preceq a$.

    +   - A set $A$ together with a partial order $\preceq$ on $A$ is called a *partially
    ordered set* or *poset* and is denoted $(A, \preceq)$.'
  merge: -1
  img_proc: true
- pgno: 1256
  md: '# PARTIALLY ORDERED SETS (偏序集合)


    +   - **Partial order（偏序关系）**: A relation $R$ on a set $A$ is called a *partial
    order* if $R$ is reflexive（自反）, antisymmetric（反对称）, and transitive（传递）.

    +   - **Partially ordered set**: The set $A$ together with the partial order $R$
    is called a *partially ordered set*, or simply a *poset*, and we will denote this
    poset by $(A, R)$.'
  merge: -1
  img_proc: true
