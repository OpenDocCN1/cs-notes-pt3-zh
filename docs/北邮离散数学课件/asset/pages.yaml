- pgno: 1111
  md: '# Using Zero-One Matrices


    +   - To represent a binary relation $R:A \times B$ by an $|A| \times |B|$ 0-1
    matrix $\mathbf{M}_R = [m_{ij}]$, let $m_{ij} = 1$ iff $(a_i,b_j)\in R$.

    +   - *E.g.,* Suppose Joe likes Susan and Mary, Fred likes Mary, and Mark likes
    Sally.

    +   - Then the 0-1 matrix representation of the relation Likes:Boys $\times$ Girls
    relation is:


    |        | Susan | Mary | Sally |

    |--------|-------|------|-------|

    | Joe    | 1     | 1    | 0     |

    | Fred   | 0     | 1    | 0     |

    | Mark   | 0     | 0    | 1     |'
