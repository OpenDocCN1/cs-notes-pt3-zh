- pgno: 1720
  md: '# # Directed graph (Digraph)


    +   - An important use of labeled digraphs is to model what are commonly called
    transport networks.

    +   - The label on an edge represents the maximum flow that can be passed through
    that edge and is called the capacity (容量) of the edge. Many situations can be
    modeled in this way.'
