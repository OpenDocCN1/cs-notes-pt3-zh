- pgno: 1035
  md: '# Theorem 4


    Let


    N be a normal subgroup of a group G


    R be the following relation on G


    a R b if and only if a⁻¹b ∈ N.


    Then


    +   (a) R is a congruence relation on G.

    +   (b) N is the equivalence class [e] relative to R, where e is the identity
    of G.'
  merge: -1
  img_proc: true
- pgno: 1036
  md: '# Proof (a)


    R is an equivalence relation

    Let a ∈ G.

    a R a, since a⁻¹a = e ∈ N,

    R is reflexive.


    Suppose that a R b

    a⁻¹b ∈ N.

    (a⁻¹b)⁻¹ = b⁻¹a ∈ N,

    b R a.

    R is symmetric.


    Suppose that a R b and b R c.

    a⁻¹b ∈ N and b⁻¹c ∈ N.

    (a⁻¹b)(b⁻¹c) = a⁻¹c ∈ N,

    a R c.

    R is transitive.'
  merge: -1
  img_proc: true
- pgno: 1037
  md: '# Proof (a)


    *R* is a congruence relation on G.


    Suppose that *a R b* and *c R d*.


    Then $a^{-1}b \in N$ and $c^{-1}d \in N$


    Since *N* is normal, $Nd = dN$


    since $a^{-1}b \in N$, then $a^{-1}bd = dn$ for some $n \in N$.


    $(ac)^{-1}bd = (c^{-1}a^{-1})(bd) = c^{-1}(a^{-1}b)d = (c^{-1}d)n \in N$


    so $ac R bd$.


    Hence *R* is a congruence relation on *G*.'
  merge: -1
  img_proc: true
- pgno: 1038
  md: '# Proof (b)


    Suppose that $x \in N$.


    $x^{-1}e = x^{-1} \in N$


    $x\ R\ e$


    $x \in [e]$


    $N \subseteq [e]$


    Conversely, if $x \in [e]$,


    $x\ R\ e$


    $x^{-1}e = x^{-1} \in N$


    $x \in N$


    $[e] \subseteq N$


    Hence $N = [e]$.'
  merge: -1
  img_proc: true
