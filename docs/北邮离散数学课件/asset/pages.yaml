- pgno: 605
  md: '# Example


    +   - How many different ways are there to seat four people around a circular
    table, where two seatings are considered the same when each person has the same
    left neighbor and the same right neighbor?'
  merge: -1
  img_proc: true
- pgno: 606
  md: '+   - Solution: We arbitrarily select a seat at the table and label it seat
    1. We number the rest of the seats in numerical order, proceeding clockwise around
    the table. Note that are four ways to select the person for seat 1, three ways
    to select the person for seat 2, two ways to select the person for seat 3, and
    one way to select the person for seat 4. Thus, there are 4! = 24 ways to order
    the given four people for these seats.'
  merge: -1
  img_proc: true
- pgno: 607
  md: +   - However, each of the four choices for seat 1 leads to the same arrangement,
    as we distinguish two arrangements only when one of the people has a different
    immediate left or immediate right neighbor. Because there are four ways to choose
    the person for seat 1, by the division rule there are 24/4 = 6 different seating
    arrangements of four people around the circular table.
  merge: -1
  img_proc: true
- pgno: 608
  md: '# Pigeonhole Principle ( § 6.2 )


    +   - A.k.a. the “Dirichlet drawer principle”

    +   - If ≥k+1 objects are assigned to k places, then at least 1 place must be
    assigned ≥2 objects.

    +   - In terms of the assignment function:

    +     - If f:A→B and |A|≥|B|+1, then some element of B has ≥2 preimages under
    f.

    +       - I.e., f is not one-to-one.'
  merge: -1
  img_proc: true
