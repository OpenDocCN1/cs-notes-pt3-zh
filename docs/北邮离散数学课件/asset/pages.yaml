  md: '# Rooted Trees


    **Definition**: The set of *rooted trees*, where a rooted tree consists of a set
    of vertices containing a distinguished vertex called the *root*, and edges connecting
    these vertices, can be defined recursively by these steps:

    BASIS STEP: A single vertex *r* is a rooted tree.

    RECURSIVE STEP: Suppose that *T₁, T₂, ..., Tₙ* are disjoint rooted trees with
    roots *r₁, r₂, ..., rₙ*, respectively. Then the graph formed by starting with
    a root *r*, which is not in any of the rooted trees *T₁, T₂, ..., Tₙ*, and adding
    an edge from *r* to each of the vertices *r₁, r₂, ..., rₙ*, is also a rooted tree.'
