  md: '# The Fundamental Theorem of Arithmetic


    **Theorem:** Every positive integer greater than 1 can be written uniquely as
    a prime or as the product of two or more primes where the prime factors are written
    in order of nondecreasing size.


    # **Examples:**


    +   - 100 = 2 · 2 · 5 · 5 = 2² · 5²

    +   - 641 = 641

    +   - 999 = 3 · 3 · 3 · 37 = 3³ · 37

    +   - 1024 = 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 = 2¹⁰'
