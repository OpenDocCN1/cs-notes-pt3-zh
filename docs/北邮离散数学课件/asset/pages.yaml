- pgno: 445
  md: '# Bonus Topic: Logic Programming


    +   - There are some programming languages that are based entirely on predicate
    logic!

    +   - The most famous one is called `Prolog`.

    +   - A Prolog program is a set of propositions (“facts”) and (“rules”) in predicate
    logic.

    +   - The input to the program is a “query” proposition.

    +     - Want to know if it is true or false.

    +   - The Prolog interpreter does some automated deduction to determine whether
    the query follows from the facts.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# Facts in Prolog


    +   - A fact in Prolog represents a simple, non-compound proposition in predicate
    logic.

    +     - *e.g.*, “John likes Mary”

    +       - can be written Likes(John,Mary) in predicate logic.

    +       - can be written `likes(john,mary).` in Prolog!

    +       - Lowercase symbols must be used for all constants and predicates, uppercase
    is reserved for variable names.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# Rules in Prolog


    +   - A *rule* in Prolog represents a universally quantified proposition of the
    general form

    +     ∀x: [∃y P(x,y)]→Q(x),

    +     where x and y might be compound variables x=(z,w) and P,Q compound propositions.

    +   - In Prolog, this is written as the rule:

    +     q(X) :- p(X,Y).

    +     i.e., the ∀,∃ quantifiers are

    +   - Example: likable(X) :- likes(Y,X).


    ```

    q(X) :- p(X,Y).

    ```


    ```

    likable(X) :- likes(Y,X).

    ```


    Variables must be capitalized'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# Conjunction and Disjunction


    +   - Logical conjunction is encoded using multiple comma-separated terms in a
    rule.

    +   - Logical disjunction is encoded using multiple rules.

    +   - *E.g.,* ∀x [(P(x)∧Q(x))∨R(x)]→S(x) can be rendered in Prolog as:

    +     ```

    +     s (X) :- p (X) , q (X)

    +     s (X) :- r (X)

    +     ```'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# Deduction in Prolog


    +   - When a query is input to the Prolog interpreter,

    +     - it searches its database to determine if the query can be proven true
    from the available facts.

    +     - if so, it returns “yes”, if not, “no” (!)

    +     - If the query contains any variables, all values that make the query true
    are printed.'
  merge: -1
  img_proc: true
