- pgno: 2132
  md: '# A Couple of Key Functions


    +   - In discrete math, we will frequently use the following two functions over
    real numbers:

    +     - The *floor* function ⌊·⌋:R→Z, where ⌊x⌋ (“floor of x”) means the largest
    (most positive) integer ≤ x. I.e., ⌊x⌋ := max({i∈Z | i≤x}).

    +     - The *ceiling* function ⌈·⌉:R→Z, where ⌈x⌉ (“ceiling of x”) means the smallest
    (most negative) integer ≥ x. ⌈x⌉ := min({i∈Z | i≥x})'
  merge: -1
