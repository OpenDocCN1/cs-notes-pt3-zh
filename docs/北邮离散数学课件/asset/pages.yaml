  md: '# § 10.4: Connectivity


    +   - In an undirected graph, a *path of length n from u to v* is a sequence of
    adjacent edges going from vertex *u* to vertex *v*.

    +   - A path is a *circuit* if *u=v*.

    +   - A path *traverses* the vertices along it.

    +   - A path is *simple* if it contains no edge more than once.'
