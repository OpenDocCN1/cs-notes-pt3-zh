- pgno: 2120
  md: "# Function Composition Operator\n\n+   - For functions $g:A\\to B$ and $f:B\\\
    to C$, there is a special operator called *compose* (“$\bigcirc$”).\n+     - It\
    \ _composes_ (creates) a new function out of $f$ and $g$ by applying $f$ to the\
    \ result of applying $g$.\n+     - We say $(f\\bigcirc g):A\\to C$, where $(f\\\
    bigcirc g)(a) := f(g(a))$.\n+     - Note $g(a)\\in B$, so $f(g(a))$ is defined\
    \ and $\\in C$.\n+     - Note that $\\bigcirc$ (like Cartesian $\\times$, but\
    \ unlike $+$, $\\land$, $\\cup$) is non-commuting. (Generally, $f\\bigcirc g \\\
    neq g\\bigcirc f$.)\n\nNote match here."
  merge: -1
  img_proc: true
- pgno: 2121
  md: "# One-to-One Functions\n\n+   - A function is *one-to-one (1-1)*, or *injective*,\
    \ or an *injection*, iff every element of its range has *only* 1 pre-image.\n\
    +     - Formally: given $f:A\\to B$, \n+       “x is injective” $:= (\\neg\\exists\
    \ x,y: x\\neq y \\land f(x)=f(y))$.\n+   - Only _one_ element of the domain is\
    \ mapped _to_ any given _one_ element of the range.\n+     - Domain & range have\
    \ same cardinality. What about codomain?\n+   - Memory jogger: Each element of\
    \ the domain is _injected_ into a different element of the range.\n+     - Compare\
    \ “each dose of vaccine is injected into a different patient.”\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_2121_0.png)"
  merge: -1
  img_proc: true
