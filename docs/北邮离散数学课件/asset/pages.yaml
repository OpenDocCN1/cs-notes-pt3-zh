    +   （2）用简化的关系图表示较适合。


    # 简化的关系图：


    +   （1）自反性：每个顶点都有自回路，省去。


    +   （2）反对称性：两个顶点间只可能有一个箭头

    +   从左→右，或从下→上的方向

    +   从小到大安置顶点，可省略箭头。


    +   （3）传递性：由于有（a，b），（b，c）∈R

    +   则（a，c）∈R

