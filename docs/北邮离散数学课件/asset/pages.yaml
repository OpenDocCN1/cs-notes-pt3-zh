  md: '# Theorem 2


    Let _R_ be a congruence relation on the semigroup (S, *).


    Consider the relation ◦ from S/R × S/R to S/R in which the ordered pair ([_a_],
    [_b_]) is, for _a_ and _b_ in S, related to [_a_*_b_].


    ◦([_a_], [_b_]) = [_a_]◦ [_b_] = [_a_*_b_], is a function from S/R×S/R to S/R


