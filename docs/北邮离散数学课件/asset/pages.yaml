  md: '# Transfinite Numbers 超限数


    +   - The cardinalities of infinite sets are not natural numbers, but are special
    objects called *transfinite cardinal numbers*.

    +   - The cardinality of the natural numbers, ℵ₀ := |N|, is the *first transfinite
    cardinal* number. (There are none smaller.)

    +   - The *continuum hypothesis* claims that |R| = ℵ₁, the second transfinite
    cardinal.'
