- pgno: 1858
  md: '# Traversal Algorithms


    +   - Definition 1: Let $T$ be an ordered rooted tree with root $r$. If T consists
    only of $r$, then $r$ is the preorder traversal of T. Otherwise, suppose that
    $T_1, T_2, ..., T_n$ are subtrees at $r$ from left to right in $T$. The preorder
    traversal begins by visiting r. It continues by traversing $T_1$ in preorder,
    then $T_2$ in preorder, and so on, until $T_n$ is traversed in preorder.'
  merge: -1
  img_proc: true
