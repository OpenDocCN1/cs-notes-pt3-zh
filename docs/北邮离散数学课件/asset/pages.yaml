- pgno: 614
  md: '# Generalized Pigeonhole Principle


    +   - If *N* objects are assigned to *k* places, then at least one place must
    be assigned at least ⌈*N/k*⌉ objects.

    +   - *E.g.*, there are *N*=280 students in this class. There are *k*=52 weeks
    in the year.

    +     - Therefore, there must be at least 1 week during which at least ⌈280/52⌉=⌈5.38⌉=6
    students in the class have a birthday.'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# Proof of G.P.P.


    +   - By contradiction. Suppose every place has < ⌈N/k⌉ objects, thus ≤ ⌈N/k⌉−1.

    +   - Then the total number of objects is at most

    +     $$k\left(\left\lceil\frac{N}{k}\right\rceil-1\right)<k\left(\left(\frac{N}{k}+1\right)-1\right)=k\left(\frac{N}{k}\right)=N$$

    +   - So, there are less than N objects, which contradicts our assumption of N
    objects! □'
  merge: -1
  img_proc: true
