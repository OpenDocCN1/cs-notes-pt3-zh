- pgno: 595
  md: '# Sum and Product Rules ( § 6.1 )


    +   - Let *m* be the number of ways to do task 1 and *n* the number of ways to
    do task 2,

    +     - with each number independent of how the other task is done,

    +     - and also assume that no way to do task 1 simultaneously also accomplishes
    task 2.

    +   - Then, we have the following rules:

    +     - The *sum rule*: The task “do either task 1 or task 2, but not both” can
    be done in *m+n* ways.

    +     - The *product rule*: The task “do both task 1 and task 2” can be done in
    *mn* ways.'
  merge: -1
  img_proc: true
- pgno: 596
  md: '# Set Theoretic Version


    +   - If *A* is the set of ways to do task 1, and *B* the set of ways to do task
    2, and if *A* and *B* are disjoint, then:

    +     - The ways to do either task 1 or 2 are *A*∪*B*, and |*A*∪*B*|=|*A*|+|*B*|

    +     - The ways to do both task 1 and 2 can be represented as *A*×*B*, and |*A*×*B*|=|*A*|·|*B*|'
  merge: -1
  img_proc: true
