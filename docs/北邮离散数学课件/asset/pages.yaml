- pgno: 911
  md: '# # Identity – 单位元、幺元


    An element \( e \) in a semigroup \( (S, *) \) is called an *identity* element
    if \( e*a = a*e = a \) for all \( a \in S \).


    an identity element must be unique.


    # ## Example 8,9


    The number 0 is an identity in the semigroup \( (\mathbb{Z}, +) \).


    The semigroup \( (\mathbb{Z}^+, +) \) has no identity element'
  merge: -1
  img_proc: true
- pgno: 912
  md: '# # Monoid – 独异点、含幺半群


    A _monoid_ is a semigroup (S, *) that has an identity.


    # ## Example 10


    The semigroup _P_(_S_) defined in Example 2 has the identity \(\varnothing\),
    since for any element \(A \in P(S)\).


    \(\varnothing * A = \varnothing \cup A = A = A \cup \varnothing = A * \varnothing\)


    Hence _P_(_S_) is a monoid.'
  merge: -1
  img_proc: true
