- pgno: 2093
  md: '# Proving Set Identities


    To prove statements about sets, of the form $E_1 = E_2$ (where the $E$s are set
    expressions), here are three useful techniques:


    +   1. Prove $E_1 \subseteq E_2$ and $E_2 \subseteq E_1$ separately.

    +   2. Use set builder notation & logical equivalences.

    +   3. Use a *membership table*.'
  merge: -1
  img_proc: true
- pgno: 2094
  md: '# Method 1: Mutual subsets


    Example: Show $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.


    +   - Part 1: Show $A \cap (B \cup C) \subseteq (A \cap B) \cup (A \cap C)$.

    +     - Assume $x \in A \cap (B \cup C)$, & show $x \in (A \cap B) \cup (A \cap
    C)$.

    +     - We know that $x \in A$, and either $x \in B$ or $x \in C$.

    +       - Case 1: $x \in B$. Then $x \in A \cap B$, so $x \in (A \cap B) \cup
    (A \cap C)$.

    +       - Case 2: $x \in C$. Then $x \in A \cap C$, so $x \in (A \cap B) \cup
    (A \cap C)$.

    +     - Therefore, $x \in (A \cap B) \cup (A \cap C)$.

    +     - Therefore, $A \cap (B \cup C) \subseteq (A \cap B) \cup (A \cap C)$.


    +   - Part 2: Show $(A \cap B) \cup (A \cap C) \subseteq A \cap (B \cup C)$. ...'
  merge: -1
  img_proc: true
