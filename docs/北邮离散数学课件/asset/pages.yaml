  md: '# # Closure（封闭）


    +   - A structure is closed with respect to an operation if that operation always
    produces another member of the collection of objects.'
  merge: -1
  img_proc: true
- pgno: 826
  md: '# # Examples


    +   - The structure [\(5 \times 5\) matrices, \(+\), \(*\), \(^T\)] is closed
    with respect to addition because the sum of two \(5 \times 5\) matrices is another
    \(5 \times 5\) matrix.

    +   - The structure [odd integers, \(+\), \(*\)] is not closed with respect to
    addition.

    +     - The sum of two odd integers is an even integer.

    +     - This structure does have the closure property for multiplication, since
    the product of two odd numbers is an odd number.'
