  md: '# # Proof


    It follows from Theorem 4 of Section 9.5 that x and y lie in the same left coset
    of N in B<sup>n</sup> if and only if x ⊕ y = (-x) ⊕ y ∈ N.

    Since N = ker(f<sub>H</sub>),

    x ⊕ y ∈ N

    if and only if

    f<sub>H</sub>(x ⊕ y) = 0<sub>B<sup>r</sup></sub>

    f<sub>H</sub>(x) ⊕ f<sub>H</sub>(y) = 0<sub>B<sup>r</sup></sub>

    f<sub>H</sub>(x) = f<sub>H</sub>(y)


    > Q.E.D.'
