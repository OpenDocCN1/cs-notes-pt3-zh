- pgno: 1570
  md: "# Shortest Path (Dijkstra’s )Algorithm\n\n- **procedure Dijkstra**(G: weighted\
    \ connected simple graph, with all weights positive)\n{G has vertices a = v₀,\
    \ v₁, ..., vₙ = z and weights w(vᵢ, vⱼ) where w(vᵢ, vⱼ)=∞ if {vᵢ, vⱼ} is not an\
    \ edge in G}\n**for** i:=1 to n\n    L(vᵢ) := ∞\nL(a) := 0\nS := ∅\n{the labels\
    \ are now initialized so that the label of a is 0 and all other labels are ∞,\
    \ and S is the empty set}\n**while** z ∉ S\n**begin**\n    u := a vertex not in\
    \ S with L(u) minimal\n    S := S ∪ {u}\n    **for** all vertices v not in S\n\
    \        **if** L(u) + w(u, v) < L(v) **then** L(v) := L(u) + w(u, v)\n    {this\
    \ adds a vertex to S with minimal label and updates the labels of vertices not\
    \ in S}\n**end** {L(z) = length of a shortest path from a to z}"
  merge: -1
  img_proc: true
