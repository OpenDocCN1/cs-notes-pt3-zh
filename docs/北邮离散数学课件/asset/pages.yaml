- pgno: 653
  md: "# Generating the Next Bit String\n\n+   - Note that this is essentially just\
    \ a binary increment (“add 1”) operation.\n\n```\nprocedure nextBitString(bₙ₋₁…b₀:\
    \ bit string)\n  i := 0;                     {start at right end of string}\n\
    \  while bᵢ = 1 and i < n begin    {trailing 1s}\n    bᵢ := 0; i := i + 1 end\
    \       {change to 0s}\n  if i = n then return “no more” else begin\n    bᵢ =\
