  md: '由于枝点才可能是叶的前缀，而枝点不对应一个码，故这样一棵树所有叶对应的码构成前缀码。


    二元完全树的叶只有 2^h 片（h 为树高），用二元树的前缀码，最长码长是树高 h，最多不超过 2^h 片。


    如上例 2 6 个字母，就可构造树高为5的二元树，然后用相应的前缀码分别表示各个字母，将常用的字母用较短的编码表示，可缩短整个通讯序列的长度，提高效率，即：'
