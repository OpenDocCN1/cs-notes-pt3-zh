- pgno: 317
  md: '# De Morgan’s Laws for Quantifiers


    The rules for negating quantifiers are:


    | TABLE 2 De Morgan''s Laws for Quantifiers. |

    | Negation | Equivalent Statement | When Is Negation True? | When False? |

    | ¬∃x P(x) | ∀x ¬P(x) | For every x, P(x) is false. | There is an x for which
    P(x) is true. |

    | ¬∀x P(x) | ∃x ¬P(x) | There is an x for which P(x) is false. | P(x) is true
    for every x. |


    The reasoning in the table shows that:


    ¬∀x P(x) ≡ ∃x ¬P(x)


    ¬∃x P(x) ≡ ∀x ¬P(x)


    These are important. You will use these.'
  merge: -1
  img_proc: true
