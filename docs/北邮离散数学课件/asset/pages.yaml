- pgno: 903
  md: '# # Semigroup – 半群


    A *semigroup* is a *nonempty* set S together with an associative binary operation
    * defined on S.


    Denote the semigroup by (S, *) or S.


    a*b is referred as the product of a and b. The semigroup (S, *) is said to be
    *commutative* if * is a commutative operation.'
  merge: -1
  img_proc: true
- pgno: 904
  md: '# # Examples


    (Z, +) is a commutative semigroup.


    The set P(S), where S is a set, together with

    the operation of union is a commutative

    semigroup.


    The set Z with the binary operation of

    subtraction is not a semigroup, since

    subtraction is not associative.'
  merge: -1
  img_proc: true
- pgno: 905
  md: '# Example 4


    Let S be a fixed nonempty set, and let S<sup>s</sup> be

    the set of all functions f : S→S. If f and g

    are elements of S<sup>s</sup>, we define f *g as f g,

    the composite function.


    +   * is a binary operation on S<sup>s</sup>


    +   * is associative.


    +   (S<sup>s</sup>, *) is a semigroup.


    +   The semigroup S<sup>s</sup> is not commutative.'
