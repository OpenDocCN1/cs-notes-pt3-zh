  md: '# Equivalence classes


    +   - If *R* is an equivalence relation on *A*, then the sets *R(a)* are traditionally
    called *equivalence classes* of *R*, denoted by [*a*]

    +   - The partition ***P*** consists of all equivalence classes of *R* is denoted
