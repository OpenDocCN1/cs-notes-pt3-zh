- pgno: 2156
  md: '# Euler’s Trick, Illustrated


    +   - Consider the sum:

    +     1+2+…+(n/2)+((n/2)+1)+…+(n-1)+n


    +   - We have *n/2* pairs of elements, each pair summing to *n+1*, for a total
    of *(n/2)(n+1)*.'
