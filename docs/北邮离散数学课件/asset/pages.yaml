- pgno: 2238
  md: '# Big-O Notation


    **Definition**: Let f and g be functions from the set of integers or the set of
    real numbers to the set of real numbers. We say that f(x) is O(g(x)) if there
    are constants C and k such that


    |f(x)| ≤ C|g(x)|


    whenever x > k. (illustration on next slide)


    +   - This is read as “f(x) is big-O of g(x)” or “g asymptotically dominates f.”


    +   - The constants C and k are called witnesses to the relationship f(x) is O(g(x)).
    Only one pair of witnesses is needed.'
  merge: -1
  img_proc: true
- pgno: 2239
  md: '# Illustration of Big-O Notation


    ![](img/c25dfd82fc242c2db53bc942dcad6885_2239_0.png)


    f(x) is O(g(x))


    The part of the graph of f(x) that satisfies f(x) < Cg(x) is shown in color.


    f(x) < Cg(x) for x > k'
  merge: -1
  img_proc: true
- pgno: 2240
  md: '# Some Important Points about Big-O Notation


    +   - If one pair of witnesses is found, then there are infinitely many pairs.
    We can always make the k or the C larger and still maintain the inequality |f(x)|
    ≤ C|g(x)|.

    +     - Any pair C'' and k'' where C < C'' and k < k'' is also a pair of witnesses
    since |f(x)| ≤ C|g(x)| ≤ C''|g(x)| whenever x > k'' > k.


    You may see “f(x) = O(g(x))” instead of “f(x) is O(g(x)).”


    +   - But this is an abuse of the equals sign since the meaning is that there
    is an inequality relating the values of f and g, for sufficiently large values
    of x.

    +   - It is ok to write f(x) ∈ O(g(x)), because O(g(x)) represents the set of
    functions that are O(g(x)).


    +   - Usually, we will drop the absolute value sign since we will always deal
    with functions that take on positive values.'
  merge: -1
  img_proc: true
- pgno: 2241
  md: '# Using the Definition of Big-O Notation


    **Example**: Show that $f(x) = x^2 + 2x + 1$ is $O(x^2)$.


    **Solution**: Since when $x > 1$, $x < x^2$ and $1 < x^2$


    $0 \le x^2 + 2x + 1 \le x^2 + 2x^2 + x^2 = 4x^2$


    +   - Can take $C = 4$ and $k = 1$ as witnesses to show that $f(x)$ is $O(x^2)$
    (see graph on next slide)


    +   - Alternatively, when $x > 2$, we have $2x \le x^2$ and $1 < x^2$. Hence,
    $0 \le x^2 + 2x + 1 \le x^2 + x^2 + x^2 = 3x^2$ when $x > 2$.


    +   - Can take $C = 3$ and $k = 2$ as witnesses instead.'
  merge: -1
