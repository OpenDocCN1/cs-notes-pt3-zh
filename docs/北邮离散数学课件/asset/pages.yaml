  md: '# Minimum distance


    The *minimum distance* of an encoding function $e: B^m \to B^n$ is the minimum
    of the distances between all distinct pairs of code words; that is,


    $\min\{\delta(e(x), e(y)) \mid x, y \in B^m\}$'
