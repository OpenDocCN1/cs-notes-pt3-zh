  md: '# Proof: $x^* H = 0 \Rightarrow x = e_H(b)$ for some $b \in B^m$


    Suppose that $x^* H = 0$


    $y_1 \cdot h_{11} + y_2 \cdot h_{21} + ... + y_m \cdot h_{m1} + x_1 = 0$

    $y_1 \cdot h_{12} + y_2 \cdot h_{22} + ... + y_m \cdot h_{m2} + x_2 = 0$

