- pgno: 723
  md: '# Groups


    The set $B$ is a group under the binary operation + (mod 2 addition模2加 )


    It follows that $B^m = B \times B \times ... \times B$ ($n$ factors) is a group
    under the operator $\oplus$ defined by


    $(x_1, x_2, ..., x_m) \oplus (y_1, y_2, ..., y_m)$

    $= (x_1 + y_1, x_2 + y_2, ..., x_m + y_m)$


    An element in $B^m$ will be written as $(b_1,b_2,..., b_m)$ or more simply as
    $b_1b_2...b_m$'
  merge: -1
