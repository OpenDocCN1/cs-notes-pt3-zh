- pgno: 2073
  md: '# The *Power Set* 幂集 Operation


    +   - The *power set* P(S) of a set S is the set of all subsets of S. P(S) :=
    {x | x⊆S}.

    +   - *E.g.* P({a,b}) = {∅, {a}, {b}, {a,b}}.

    +   - Sometimes P(S) is written 2^S.

    +     Note that for finite S, |P(S)| = 2^{|S|}.

    +   - It turns out ∀S:|P(S)|>|S|, e.g. |P(N)| > |N|.

    +     *There are different sizes of infinite sets!*'
  merge: -1
