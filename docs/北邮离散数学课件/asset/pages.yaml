- pgno: 795
  md: '# Procedure


    +   **Step 1:** Determine all the left cosets of $N = e(B^m)$ in $B^n$

    +   **Step 2:** For each coset, find a coset leader (a word of least weight).

    +   **Step 3:** If the word $x_t$ is received, determine the coset of N to which
    $x_t$ belongs.

    +   **Step 4:** Let $\mathcal{E}$ be a coset leader for the coset determined in
    Step 3. Compute $x = x_t \oplus \mathcal{E}$. If $x = e(b)$, we let d($x_t$) =
    $b$. That is, we decode $x_t$ as $b$.'
