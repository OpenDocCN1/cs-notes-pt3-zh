  md: '# Functions


    +   - A function $f: A \to B$ is a special case of a relation from $A$ to $B$

    +     - It satisfies the property: for each $x \in A$, there is exactly one pair
    $(x, f(x))$ in the relation

    +   - Relations are a generalization of functions

    +     - They allow unmapped elements from $A$

    +     - They allow one-to-many mappings where an element from $A$ maps to multiple
    elements from $B$

    +     - They also allow many-to-one and many-to-many mappings'
