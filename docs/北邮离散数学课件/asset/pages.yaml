- pgno: 47
  md: '# Infinitude of Primes


    Euclid

    (325 B.C.E. – 265 B.C.E.)


    **Theorem**: There are infinitely many primes. (Euclid)


    **Proof**: Assume finitely many primes: $p_1, p_2, ..., p_n$


    +   - Let $q = p_1 p_2 \cdots p_n + 1$

    +   - Either $q$ is prime or by the fundamental theorem of arithmetic it is a
    product of primes.

    +     - But none of the primes $p_j$ divides $q$ since if $p_j \mid q$, then $p_j$
    divides $q - p_1 p_2 \cdots p_n = 1$.

    +   - Hence, there is a prime not on the list $p_1, p_2, ..., p_n$. It is either
    $q$, or if $q$ is composite, it is a prime factor of $q$. This contradicts the
    assumption that $p_1, p_2, ..., p_n$ are all the primes.

    +   - Consequently, there are infinitely many primes.


    This proof was given by Euclid *The Elements*. The proof is considered to be one
    of the most beautiful in all mathematics. It is the first proof in *The Book*,
    inspired by the famous mathematician Paul Erdős’ imagined collection of perfect
    proofs maintained by God.


    Paul Erdős

    (1913-1996)


    ![](img/c25dfd82fc242c2db53bc942dcad6885_47_0.png)


    ![](img/c25dfd82fc242c2db53bc942dcad6885_47_1.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Mersenne Primes


    ![](img/c25dfd82fc242c2db53bc942dcad6885_48_0.png)


    Marin Mersenne

    (1588-1648)


    **Definition**: Prime numbers of the form 2^p − 1, where p is prime, are called
    *Mersenne primes*.


    +   - 2² − 1 = 3, 2³ − 1 = 7, 2⁵ − 1 = 37, and 2⁷ − 1 = 127 are Mersenne primes.

    +   - 2¹¹ − 1 = 2047 is not a Mersenne prime since 2047 = 23·89.

    +   - There is an efficient test for determining if 2^p − 1 is prime.

    +   - The largest known prime numbers are Mersenne primes.

    +   - As of mid 2011, 47 Mersenne primes were known, the largest is 2⁴³,¹¹²,⁶⁰⁹
    − 1, which has nearly 13 million decimal digits.

    +   - The *Great Internet Mersenne Prime Search* (*GIMPS*) is a distributed computing
    project to search for new Mersenne Primes.


    http://www.mersenne.org/'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Distribution of Primes


    Mathematicians have been interested in the distribution of prime numbers among
    the positive integers. In the nineteenth century, the *prime number theorem* was
    proved which gives an asymptotic estimate for the number of primes not exceeding
    x.


    **Prime Number Theorem**: The ratio of the number of primes not exceeding x and
    x/ln x approaches 1 as x grows without bound. (ln x is the natural logarithm of
    x)


    +   - The theorem tells us that the number of primes not exceeding x, can be approximated
    by x/ln x.

    +   - The odds that a randomly selected positive integer less than n is prime
    are approximately (n/ln n)/n = 1/ln n.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Primes and Arithmetic Progressions

    (optional)等差数列


    +   - Euclid’s proof that there are infinitely many primes can be easily adapted
    to show that there are infinitely many primes in the following 4k + 3, k = 1,2,...
    (See Exercise 55)

    +   - In the 19th century G. Lejuenne Dirichlet showed that every arithmetic progression
    ka + b, k = 1,2, ..., where a and b have no common factor greater than 1 contains
    infinitely many primes. (The proof is beyond the scope of the text.)

    +   - Are there long arithmetic progressions made up entirely of primes?

    +     - 5,11, 17, 23, 29 is an arithmetic progression of five primes.

    +     - 199, 409, 619, 829, 1039,1249,1459,1669,1879,2089 is an arithmetic progression
    of ten primes.

    +   - In the 1930s, Paul Erdős conjectured that for every positive integer n greater
    than 1, there is an arithmetic progression of length n made up entirely of primes.
    This was proven in 2006, by Ben Green and Terrence Tao.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_50_0.png)'
