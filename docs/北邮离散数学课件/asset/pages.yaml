- pgno: 1635
  md: '(2)若 e = n − 1 时欧拉公式成立


    e = n 时，


    a）若 G 中有有限区域，去掉此区域的一条边，成 G′，只有 n − 1 条边，满足 v′ − e′ + γ′ = 2，而 v = v′， e = e′ +
    1， γ = γ′ + 1，仍有 v − e + γ = v′ − e′ − 1 + γ′ + 1 = v′ − e′ + γ′ = 2。


    b）若 G 不存在有限区域，即 G 中无回路，必有次为 1 的顶点，去掉这个顶点及关联的边，得 G′，顶点和边都减少 1，区域数总为 1，由假设 G′ 中只有
    n − 1 条边，满足 v′ − e′ + γ′ = 2，而 v = v′ + 1， e = e′ + 1， γ = γ′ = 1， v − e + γ =
    v′ + 1 − e′ − 1 + γ′ = v′ − e′ + γ′ = 2。'
