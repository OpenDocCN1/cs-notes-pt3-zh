- pgno: 106
  md: '# Cryptosystems


    **Definition:** A *cryptosystem* is a five-tuple \((\mathcal{P},\mathcal{C},\mathcal{K},\mathcal{E},\mathcal{D})\),
    where


    +   - \(\mathcal{P}\) is the set of plaintext strings.

    +   - \(\mathcal{C}\) is the set of ciphertext strings,

    +   - \(\mathcal{K}\) is the *keyspace* (set of all possible keys),

    +   - \(\mathcal{E}\) is the set of encryption functions, and

    +   - \(\mathcal{D}\) is the set of decryption functions.


    The encryption function in \(\mathcal{E}\) corresponding to the key \(k\) is denoted
    by \(E_k\) and the decryption function in \(\mathcal{D}\) that decrypts cipher
    text encrypted using \(E_k\) is denoted by \(D_k\). Therefore:


    $$D_k(E_k(p)) = p, \text{ for all plaintext strings } p.$$'
  merge: -1
  img_proc: true
