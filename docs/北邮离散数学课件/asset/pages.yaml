  md: '# 最优树问题


    带权二叉树: 每片树叶都带权的二叉树。


    # 带权二叉树的权:


    w(T) = Σᵢ₌₁ᵗ wᵢ L(wᵢ) 其中 L(wᵢ) 为带权 wᵢ 的树叶的通路长度。'
  merge: -1
  img_proc: true
- pgno: 1835
  md: '# 最优树: 在所有带权 w1, w2, …, wt 的二叉树中, w(T) 最小的那棵树。


    定理 T为带权 w1 ≤ w2 ≤ ⋯ ≤ wt 的最优树, 则


    +   a) 带权 w1, w2的树叶 v_w1, v_w2 是兄弟。'
  merge: -1
  img_proc: true
- pgno: 1836
  md: 'b) 以树叶 $v_{w_1}, v_{w_2}$ 为儿子的分枝点,其通路长最长。

    定理 $T$ 为带权 $w_1 \le w_2 \le \cdots \le w_t$ 的最优树,若将以带权 $w_1, w_2$ 的树叶为儿子的分枝点该为带权
    $w_1 + w_2$ 的树叶得到一新树 $T''$,也是最优树。'
  merge: -1
  img_proc: true
