  md: '# # 10.6 Shortest Path Problems


    +   - A weighed graph is one in which weights (numbers) are assigned to all edges
    connecting each two vertices.

    +   - Such numbers can represent, for instance, traveling distance, monthly cost,
    or traveling time between two vertices.

    +   - The length of a path in a weighed graph is the sum of the weights of the
