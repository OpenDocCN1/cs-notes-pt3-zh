- pgno: 922
  md: '# # f⁻¹ is an isomorphism


    Let a'' and b'' be any elements of T.

    Since f is onto, there exist a and b in S such

    that

    f(a) = a'' and f(b) = b''.

    Then a = f⁻¹(a'') and b = f⁻¹(b'').

    f⁻¹(a'' *'' b'') = f⁻¹(f(a)*''f(b))= f⁻¹(f(a*''b)) = (f⁻¹ f) (a*''b)

    = a*''b = f⁻¹(a'') *'' f⁻¹(b'').

    Hence f⁻¹ is an isomorphism.'
