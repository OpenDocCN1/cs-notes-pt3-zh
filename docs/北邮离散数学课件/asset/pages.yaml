  md: '# Biconditional Truth Table


    +   - *p ↔ q* means that *p* and *q* have the same **truth value**.

    +   - Note this truth table is the exact **opposite** of ⊕’s!

    +     Thus, *p ↔ q* means ¬(*p ⊕ q*)

    +   - *p ↔ q* does **not** imply that *p* and *q* are true, or that either of
