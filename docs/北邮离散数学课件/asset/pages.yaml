- pgno: 465
  md: '# § 5.1: Mathematical Induction


    +   - A powerful, rigorous technique for proving that a predicate $P(n)$ is true
    for *every* natural number $n$, no matter how large.


    +   - Essentially a “domino effect” principle.


    +   - Based on a predicate-logic inference rule:

    +     $P(0)$

    +     $\forall n\ge0\ (P(n)\to P(n+1))$

    +     $\therefore \forall n\ge0\ P(n)$


    > “The First Principle of Mathematical Induction”'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# The “Domino Effect”


    +   - **Premise #1:** Domino #0 falls.

    +   - **Premise #2:** For every $n \in \mathbb{N}$, if domino #n falls, then so
    does domino #n+1.

    +   - **Conclusion:** All of the dominoes fall down!


    ![](img/c25dfd82fc242c2db53bc942dcad6885_466_0.png)


    Note: this works even if there are infinitely many dominoes!'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Validity of Induction


    Proof that ∀k≥0 P(k) is a valid consequent:

    Given any k≥0, the 2nd antecedent

    ∀n≥0 (P(n)→P(n+1)) trivially implies that

    ∀n≥0 (n<k)→(P(n)→P(n+1)), i.e., that (P(0)→P(1)) ∧ (P(1)→P(2)) ∧ ... ∧ (P(k−1)→P(k)).
    Repeatedly applying the hypothetical syllogism rule to adjacent implications in
    this list k−1 times then gives us P(0)→P(k); which together with P(0) (antecedent
    #1) and modus ponens gives us P(k). Thus ∀k≥0 P(k). ■'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# Outline of an Inductive Proof


    +   - Let us say we want to prove ∀n P(n)...

    +     - Do the *base case* (or *basis step*): Prove P(0).

    +     - Do the *inductive step*: Prove ∀n P(n)→P(n+1).

    +       - *E.g.* you could use a direct proof, as follows:

    +       - Let n∈N, assume P(n). (*inductive hypothesis*)

    +       - Now, under this assumption, prove P(n+1).

    +     - The inductive inference rule then gives us ∀n P(n).'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# Generalizing Induction


    +   - Rule can also be used to prove ∀ n ≥ c P(n) for a given constant c ∈ Z,
    where maybe c ≠ 0.

    +     - In this circumstance, the base case is to prove P(c) rather than P(0),
    and the inductive step is to prove ∀ n ≥ c (P(n) → P(n+1)).

    +   - Induction can also be used to prove ∀ n ≥ c P(aₙ) for any arbitrary series
    {aₙ}.

    +   - Can reduce these to the form already shown.'
  merge: -1
  img_proc: true
- pgno: 470
  md: "# Induction Example (1st princ.)\n\n+   - Prove that the sum of the first *n*\
    \ odd positive integers is *n*². That is, prove:\n+   \n+     ∀*n* ≥ 1: Σ_{i=1}^{n}\
    \ (2*i* − 1) = *n*²\n\n+   - Proof by induction.\n+     - Base case: Let *n*=1.\
    \ The sum of the first 1 odd positive integer is 1 which equals 1². (Cont…)"
  merge: -1
