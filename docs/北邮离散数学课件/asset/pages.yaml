  md: "# Web spiders\n\n+   - **What is a Spider or Search Engine Spider?**\n+   -\
    \ \n+   - Description: A **Spider** or *Search Engine Spider* is a program that\
    \ automatically traverses the Web and requests documents from URLs. A spider usually\
    \ starts from a historical list of URLs and retrieves referenced documents. As\
    \ it visits new Internet websites it checks to see if the site is already listed\
    \ in its database. If the site is already listed it usually updates any changes\
    \ it finds. Spiders are also commonly known as *Robots or Crawlers*. Other names\
    \ sometimes used: *Webwalkers, Wanderers, or *Worms*\n\n![](img/c25dfd82fc242c2db53bc942dcad6885_1895_0.png)"
