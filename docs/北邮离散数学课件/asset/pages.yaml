- pgno: 622
  md: '# Combinations ( § 6.3)


    +   - An *r*-combination of elements of a set *S* is simply a subset *T* ⊆ *S*
    with *r* members, |*T*| = *r*.

    +   - The number of *r*-combinations of a set with *n* = |*S*| elements is

    +     $C(n, r) = \binom{n}{r} = \frac{P(n, r)}{P(r, r)} = \frac{n!/(n-r)!}{r!}
    = \frac{n!}{r!(n-r)!}$

    +   - Note that $C(n, r) = C(n, n-r)$

    +     - Because choosing the *r* members of *T* is the same thing as choosing
    the *n-r* non-members of *T*.'
  merge: -1
  img_proc: true
