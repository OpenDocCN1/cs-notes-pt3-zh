- pgno: 1995
  md: '# Proof by Contradiction


    +   - A method for proving $p$.

    +   - Assume $\lnot p$, and prove both $q$ and $\lnot q$ for some proposition
    $q$. (Can be anything!)

    +   - Thus $\lnot p \to (q \land \lnot q)$

    +   - $(q \land \lnot q)$ is a trivial contradiction, equal to **F**

    +   - Thus $\lnot p \to \mathbf{F}$, which is only true if $\lnot p = \mathbf{F}$

    +   - Thus $p$ is true.'
  merge: -1
