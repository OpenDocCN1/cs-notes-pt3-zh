  md: '# Directed Multigraphs


    +   - Like directed graphs, but there may be more than one arc from a node to
    another.

    +   - A *directed multigraph* $G=(V,E,f)$ consists of a set $V$ of vertices, a
    set $E$ of edges, and a function $f:E\to V\times V$.

    +   - *E.g.*, $V$=web pages, $E$=hyperlinks. *The WWW is a directed multigraph...*


