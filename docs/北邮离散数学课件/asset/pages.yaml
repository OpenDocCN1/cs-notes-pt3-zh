- pgno: 14
  md: '# Arithmetic Modulo m


    Definitions: Let Zₘ be the set of nonnegative integers less than m: {0,1,....,
    m−1}


    +   The operation +ₘ is defined as a +ₘ b = (a + b) mod m. This is addition modulo
    m.


    +   The operation ·ₘ is defined as a ·ₘ b = (a + b) mod m. This is multiplication
    modulo m.


    +   Using these operations is said to be doing arithmetic modulo m.


    Example: Find 7 +₁₁ 9 and 7 ·₁₁ 9.


    Solution: Using the definitions above:


    +   7 +₁₁ 9 = (7 + 9) mod 11 = 16 mod 11 = 5


    +   7 ·₁₁ 9 = (7 · 9) mod 11 = 63 mod 11 = 8'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Arithmetic Modulo m


    +   - The operations +ₘ and ·ₘ satisfy many of the same properties as ordinary
    addition and multiplication.

    +   - Closure: If a and b belong to Zₘ, then a +ₘ b and a ·ₘ b belong to Zₘ.

    +   - Associativity: If a, b, and c belong to Zₘ, then (a +ₘ b) +ₘ c = a +ₘ (b
    +ₘ c) and (a ·ₘ b) ·ₘ c = a ·ₘ (b ·ₘ c).

    +   - Commutativity: If a and b belong to Zₘ, then a +ₘ b = b +ₘ a and a ·ₘ b
    = b ·ₘ a.

    +   - Identity elements: The elements 0 and 1 are identity elements for addition
    and multiplication modulo m, respectively.

    +     - If a belongs to Zₘ, then a +ₘ 0 = a and a ·ₘ 1 = a.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Arithmetic Modulo *m*


    +   - **Additive inverses:** If *a* ≠ 0 belongs to \(\mathbb{Z}_m\), then \(m-a\)
    is the additive inverse of a modulo m and 0 is its own additive inverse.

    +     - \(a +_m (m-a) = 0\) and \(0 +_m 0 = 0\)

    +   - **Distributivity:** If *a*, *b*, and *c* belong to \(\mathbb{Z}_m\), then

    +     - \(a \cdot_m (b +_m c) = (a \cdot_m b) +_m (a \cdot_m c)\) and

    +     - \((a +_m b) \cdot_m c = (a \cdot_m c) +_m (b \cdot_m c)\).

    +   - Exercises 42–44 ask for proofs of these properties.

    +   - Multiplicative inverses have not been included since they do not always
    exist. For example, there is no multiplicative inverse of 2 modulo 6.

    +   - *(optional)* Using the terminology of abstract algebra, \(\mathbb{Z}_m\)
    with \(+_m\) is a commutative group and \(\mathbb{Z}_m\) with \(+_m\) and \(\cdot_m\)
    is a commutative ring.'
  merge: -1
