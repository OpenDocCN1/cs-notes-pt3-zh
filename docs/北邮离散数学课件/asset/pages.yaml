  md: '# The Conjunction合取 Operator


    The binary *conjunction operator* “∧” (AND) combines two propositions to form
    their logical *conjunction*.


    E.g. If p=“I will have salad for lunch.” and q=“I will have steak for dinner.”,
    then p∧q=“I will have salad for lunch **and** I will have steak for dinner.”'
