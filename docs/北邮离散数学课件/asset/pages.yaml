- pgno: 1064
  md: '# Complementary Relations


    +   - Let $R:A,B$ be any binary relation.

    +   - Then, $\bar{R}:A\times B$, the *complement* of $R$, is the binary relation
    defined by

    +     $\bar{R}:\equiv \{(a,b)\mid (a,b)\notin R\} = (A\times B) - R$

    +   - Note this is just $\bar{R}$ if the universe of discourse is $U = A\times
    B$; thus the name *complement*.

    +   - Note the complement of $\bar{R}$ is $R$.


    **Example:** $\not<$ = $\{(a,b)\mid (a,b)\notin <\} = \{(a,b)\mid \lnot a<b\}
    = \ge$'
  merge: -1
  img_proc: true
