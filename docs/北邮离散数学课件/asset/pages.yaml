  md: '# Pseudographs


    +   - Like a multigraph, but edges connecting a node to itself are allowed. (*R*
    may be reflexive.)

    +   - A *pseudograph* $G=(V, E, f)$ where $f:E\to\{\{u,v\}|u,v\in V\}$. Edge $e\in
    E$ is a *loop* if $f(e)=\{u,u\}=\{u\}$.

    +   - *E.g.*, nodes are campsites in a state park, edges are hiking trails through
    the woods.


