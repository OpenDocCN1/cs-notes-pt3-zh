    +   There are 5 cases where the proposition is true, hence 5 minterms. Rows 1,2,3,
    5 and 7 produce the following disjunction of minterms:

    +   $(P \lor Q) \rightarrow \lnot R$

    +   $\Leftrightarrow (\lnot P \land \lnot Q \land \lnot R) \lor (\lnot P \land
    \lnot Q \land R) \lor (\lnot P \land Q \land \lnot R)$

    +   $\lor (P \land \lnot Q \land \lnot R) \lor (P \land Q \land \lnot R)$


