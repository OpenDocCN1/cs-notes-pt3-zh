  md: "# Implication Truth Table\n\n+   - *p → q* is **false** only when  \n+    \
    \ *p* is true but *q* is **not true**.\n\n+   - *p → q* does **not say**  \n+\
    \     that *p* **causes** *q*!\n\n+   - *p → q* does **not require**  \n+    \
    \ that *p* or *q* **are true**!\n\n+   - *E.g.*, “(1=0) → pigs can fly” is TRUE!\n\
    \n| *p* | *q* | *p → q* |\n|---|---|---|\n| F | F | T |\n| F | T | T |\n| T |\
    \ F | F |\n| T | T | T |\n\n> The only False case!"
