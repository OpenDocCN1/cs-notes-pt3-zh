- pgno: 2075
  md: '# Naïve Set Theory is Inconsistent


    +   - There are some naïve set *descriptions* that lead to pathological structures
    that are not *well-defined.*

    +     - (That do not have self-consistent properties.)

    +   - These “sets” mathematically *cannot* exist.

    +   - *E.g.* let $S = \{x \mid x \notin x\}$. Is $S \in S$?

    +   - Therefore, consistent set theories must restrict the language that can be
    used to describe sets.

    +   - For purposes of this class, don’t worry about it!


