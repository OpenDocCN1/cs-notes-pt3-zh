- pgno: 956
  md: '# # Fundamental Homomorphism Theorem – 同态基本定理


    Let

    f: S→T be a homomorphism of the semigroup

    (S, *) onto the semigroup (T, *'').

    R be the relation on S defined by

    a R b if and only if f(a) = f(b), for a and b in S.


    Then

    R is a congruence relation.

    (T, *'') and the quotient semigroup (S/R, ○ ) are

    isomorphic.'
  merge: -1
  img_proc: true
- pgno: 957
  md: '# # Proof


    # ## R is an equivalence relation


    a R a for every a ∈ S, since f(a) = f(a).


    if a R b, then f(a) = f(b), so b R a.


    if a R b and b R c,


    f(a) = f(b) and f(b) = f(c),


    so f(a) = f(c) and a R c.


    Hence R is an equivalence relation.'
  merge: -1
  img_proc: true
- pgno: 958
  md: '# Proof


    R is a congruence relation.


    Suppose that \(a R a_1\) and \(b R b_1\).


    \(f(a) = f(a_1)\) and \(f(b) = f(b_1)\).


    \(f(a*b) = f(a)*''f(b) = f(a_1)*''f(b_1) = f(a_1*b_1)\), since \(f\) is a homomorphism,


    Hence \((a*b) R (a_1*b_1)\)'
  merge: -1
