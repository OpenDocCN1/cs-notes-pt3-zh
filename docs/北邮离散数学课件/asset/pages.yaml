- pgno: 1401
  md: '# Adjacency


    Let G be an undirected graph with edge set E. Let e∈E be (or map to) the pair
    {u,v}. Then we say:


    +   - u, v are adjacent / neighbors / connected.

    +   - Edge e is incident with vertices u and v.

    +   - Edge e connects u and v.

    +   - Vertices u and v are endpoints of edge e.'
  merge: -1
  img_proc: true
- pgno: 1402
  md: '# Degree of a Vertex


    +   - Let $G$ be an undirected graph, $v \in V$ a vertex.

    +   - The *degree* of $v$, $\deg(v)$, is its number of incident edges. (Except
    that any self-loops are counted twice.)

    +   - A vertex with degree 0 is called *isolated*.

    +   - A vertex of degree 1 is called *pendant*.'
  merge: -1
  img_proc: true
- pgno: 1403
  md: "# Handshaking Theorem\n\n+   - Let $G$ be an undirected (simple, multi-, or\
    \ pseudo-) graph with vertex set $V$ and edge set $E$. Then\n+   \n+     $$\\\
    sum_{v\\in V} \\deg(v) = 2|E|$$\n\n+   - **Corollary:** Any undirected graph has\
    \ an even number of vertices of odd degree."
  merge: -1
  img_proc: true
- pgno: 1404
  md: '# Directed Adjacency


    +   - Let $G$ be a directed (possibly multi-) graph, and let $e$ be an edge of
    $G$ that is (or maps to) $(u,v)$. Then we say:

    +     - $u$ is adjacent to $v$, $v$ is adjacent from $u$

    +     - $e$ comes from $u$, $e$ goes to $v$.

    +     - $e$ connects $u$ to $v$, $e$ goes from $u$ to $v$

    +     - the initial vertex of $e$ is $u$

    +     - the terminal vertex of $e$ is $v$'
  merge: -1
  img_proc: true
- pgno: 1405
  md: '# Directed Degree


    +   - Let G be a directed graph, v a vertex of G.

    +     - The in-degree of v, **deg⁻(v)**, is the number of edges going to v.

    +     - The out-degree of v, **deg⁺(v)**, is the number of edges coming from v.

    +     - The degree of v, **deg(v)** := **deg⁻(v)** + **deg⁺(v)**, is the sum of
    v''s in-degree and out-degree.'
  merge: -1
  img_proc: true
- pgno: 1406
  md: '# # Directed Handshaking Theorem


    +   - Let $G$ be a directed (possibly multi-) graph with vertex set $V$ and edge
    set $E$. Then:


    $$\sum_{v\in V}\deg^-(v)=\sum_{v\in V}\deg^+(v)=\frac{1}{2}\sum_{v\in V}\deg(v)=|E|$$


    +   - Note that the degree of a node is unchanged by whether we consider its edges
    to be directed or undirected.'
  merge: -1
  img_proc: true
