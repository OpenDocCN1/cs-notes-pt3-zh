- pgno: 453
  md: '# A `semantic'' proof

    (to be made precise later)


    ∀x H(x) → M(x) (“Humans are mortal”) and ∀x G(x) → ¬M(x) (“Gods are immortal”).
    Suppose ∃x (H(x) ∧ G(x)). For example, H(a) ∧ G(a). Then By the first premisse,
    we have M(x). By the second premisse, we have ¬M(x). Contradiction! Therefore,
