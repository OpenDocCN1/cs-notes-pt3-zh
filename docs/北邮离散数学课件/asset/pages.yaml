- pgno: 727
  md: '# Encoding function


    If the transmission channel is noiseless, then $x_t = x$ for all $x$ in $B^n$.


    In this case $x = e(b)$ is received for each $b \in B^m$, and since $e$ is a known
    function, $b$ may be identified.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_727_0.png)'
  merge: -1
  img_proc: true
- pgno: 728
  md: '# Encoding function


    In general, errors in transmission do occur.

    We will say that the code word $x = e(b)$ has been transmitted with *k or fewer
    errors* if $x$ and $x_t$ differ in at least 1 but no more than $k$ positions.[k表示Bn里面码字之间的距离]


    ![](img/c25dfd82fc242c2db53bc942dcad6885_728_0.png)'
  merge: -1
  img_proc: true
- pgno: 729
  md: '# Error detect – 误差检测


    Let e: B^m → B^n be an (m, n) encoding function.

    e detects k or fewer errors if whenever x = e(b) is transmitted with k or fewer
    errors, then x_t is not a code word (thus x_t could not be x and therefore could
    not have been correctly transmitted).


    For b ∈ B^n, the number of 1''s in x is called the weight(权) of x and is denoted
    by |x|'
  merge: -1
