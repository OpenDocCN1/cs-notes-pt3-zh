  md: '# Simple Graphs


    +   - Correspond to symmetric, irreflexive binary relations $R$.

    +   - A *simple graph* $G=(V,E)$ consists of:

    +     - a set $V$ of *vertices* or *nodes* ($V$ corresponds to the universe of
    the relation $R$),

    +     - a set $E$ of *edges* / *arcs* / *links*: unordered pairs of [distinct]
    elements $u,v \in V$, such that $uRv$.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1368_0.png)'
  merge: -1
  img_proc: true
- pgno: 1369
  md: '# 10.1 图的概念/Introduction of Graph


    [定义]图


    V是一个非空有限集，E是V上的一个二元关系，有序对（V，E）称为有向图/Directed Graph。


    若将E中的有序对看成是无序的（即将e=(a,b)看成e={a,b}），则称（V，E）为无向图/Undirected Graph。有向图和无向图统称为图/Graph，记为G。


    G = (V, E)'
  merge: -1
  img_proc: true
- pgno: 1370
  md: '# [定义]顶点：


    V中的元素称为顶点，用带标记的点表示，也称为结点/Vertices。


    # [定义]边：


    在有向图G中，若e=( a , b ) ∈ E，e称为G的有向边/directed edge。用由 a 到 b 带箭头的线把 a 和 b 连起来；


    在无向图G中，若e=( a , b ) ∈ E，e称为G的无向边/undirected edge。a、b 间用连线连结，有向边和无向边统称为G的边/edge。'
  merge: -1
  img_proc: true
- pgno: 1371
  md: '# [定义]图的分类


    对图G=（V，E）。若对于任意的（a，b）∈E，a≠b,则称图G为简单图/Simple Graph。


    对图G=（V，E）。若允许E是一个重集，则称图G为重图/Multigraph。其相同的元素称为重边。


    对图G=（V，E）。若G既允许是重图又允许是非简单图，则称图G为拟图/Pseudograph。


    一般的G称为线性图/Linear Graph。'
  merge: -1
  img_proc: true
