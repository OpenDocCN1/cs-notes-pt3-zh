- pgno: 1916
  md: '# Kruskal 算法：


    设 G = (V, E, W) 是连通图


    +   1. 各边以权由小到大排序。

    +   2. 选 E 中最小边 e₁，令 G₁ = (V, S₁)， S₁ = {e₁}， i = 1

    +   3. 设 Sᵢ = {e₁, e₂, ..., eᵢ}， Gᵢ = (V, Sᵢ) 选出 Sᵢ₊₁, 从 E − Sᵢ 中选一条边 eᵢ₊₁， 满足：

    +      (1) Sᵢ ∪ {eᵢ₊₁} 中不含回路；

    +      (2) eᵢ₊₁ 是满足 (1) 的最小权的边。令 Sᵢ₊₁ = {e₁, e₂, ..., eᵢ, eᵢ₊₁}， Gᵢ₊₁ = (V, Sᵢ₊₁)；

    +   4. i = i + 1，若 i = v − 1，则 Gᵢ = Gᵥ₋₁ 为最小生成树，否则转 3 继续。'
  merge: -1
