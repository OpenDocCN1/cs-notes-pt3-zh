- pgno: 335
  md: +   - 为了进一步讨论命题函数P(x)的真值情况，首先需要指定个体变量x可选择的范围，即 个体域（universe of discourse, or
    domain）。每一个个体变量x都有自己的个体域。如果没有特别指定的个体域，则缺省为一个全个体域（total universe of discourse）即任意个体均可以作为常量对x代入。
  merge: -1
  img_proc: true
- pgno: 336
  md: '+   在指定个体变量x的个体域后，该个体域中的每个个体a代入到P(x)中的所有x，就对应一个可以判定真假意义的命题P(a)。不同的个体代入后所对应的命题真值可能不同，也可能相同。


    +   例如,P(x)表示为


    +   x²−1=(x−1)(x+1)      x指定的个体域为全体整数,'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   - 则对任意整数 \(i\)，

    +   - \(i^2-1=(i-1)(i+1)\)

    +   - 恒成立。也就是说，该命题函数的真值无论用什么个体代入总是对应为 T。此类命题函数的真值描述通过一个称为全称量词的特殊符号来量化。'
  merge: -1
