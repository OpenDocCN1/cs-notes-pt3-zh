- pgno: 1486
  md: '# Euler Paths and Circuits


    The town of Königsberg, Prussia (now called Kaliningrad and part of the Russian
    republic), was divided into four sections by the branches of the Pregel River.
    These four sections included the two regions on the banks of the Pregel, Kneiphof
    Island, and the region between the two branches of the Pregel. In the eighteenth
    century seven bridges connected these regions. Figure 1 depicts these regions
    and bridges.


    The townspeople took long walks through town on Sundays. They wondered whether
    it was possible to start at some location in the town, travel across all the bridges
    once without crossing any bridge twice, and return to the starting point.


    The Swiss mathematician Leonhard Euler solved this problem. His solution, published
    in 1736, may be the first use of graph theory. (For a translation of Euler’s original
    paper see [BiLiWi99].) Euler studied this problem using the multigraph obtained
    when the four regions are represented by vertices and the bridges by edges. This
    multigraph is shown in Figure 2.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1486_0.png)


    **FIGURE 1**  The Seven Bridges of Königsberg.


    ![](img/c25dfd82fc242c2db53bc942dcad6885_1486_1.png)


    **FIGURE 2**  Multigraph Model of the Town of Königsberg.'
  merge: -1
  img_proc: true
