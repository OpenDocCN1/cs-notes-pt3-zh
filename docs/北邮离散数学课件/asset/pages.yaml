- pgno: 11
  md: '# Congruences of Sums and Products


    Theorem 5: Let m be a positive integer. If a ≡ b (mod m) and c ≡ d (mod m), then


    a + c ≡ b + d (mod m) and ac ≡ bd (mod m)


    # Proof:


    +   - Because a ≡ b (mod m) and c ≡ d (mod m), by Theorem 4 there are integers
    s and t with b = a + sm and d = c + tm.


    +   - Therefore,

    +     - b + d = (a + sm) + (c + tm) = (a + c) + m(s + t) and

    +     - bd = (a + sm)(c + tm) = ac + m(at + cs + stm).


    +   - Hence, a + c ≡ b + d (mod m) and ac ≡ bd (mod m).


    Example: Because 7 ≡ 2 (mod 5) and 11 ≡ 1 (mod 5), it follows from Theorem 5 that


    18 = 7 + 11 ≡ 2 + 1 = 3 (mod 5)


    77 = 7* 11 ≡ 2 *1 = 2 (mod 5)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Algebraic Manipulation of Congruences


    +   - Multiplying both sides of a valid congruence by an integer preserves validity.

    +     If $a \equiv b \pmod{m}$ holds then $c\cdot a \equiv c\cdot b \pmod{m}$,
    where $c$ is any integer, holds by Theorem 5 with $d = c$.

    +   - Adding an integer to both sides of a valid congruence preserves validity.

    +     If $a \equiv b \pmod{m}$ holds then $c + a \equiv c + b \pmod{m}$, where
    $c$ is any integer, holds by Theorem 5 with $d = c$.

    +   - Dividing a congruence by an integer does not always produce a valid congruence.

    +     **Example:** The congruence $14 \equiv 8 \pmod{6}$ holds. But dividing both
    sides by 2 does not produce a valid congruence since $14/2 = 7$ and $8/2 = 4$,
    but $7 \not\equiv 4 \pmod{6}$.

    +     See Section 4.3 for conditions when division is ok.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Computing the mod m Function of Products and Sums


    +   We use the following corollary to Theorem 5 to compute the remainder of the
    product or sum of two integers when divided by m from the remainders when each
    is divided by m.


    **Corollary:** Let m be a positive integer and let a and b be integers. Then

    (a + b) (mod m) = ((a mod m) + (b mod m)) mod m

    and

    ab mod m = ((a mod m) (b mod m)) mod m.

