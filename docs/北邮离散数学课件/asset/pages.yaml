- pgno: 2004
  md: '# # The Halting Problem (Turing‘36)


    +   - The *halting problem* was the first mathematical function proven to have
    *no* algorithm that computes it!

    +     - We say, it is *uncomputable*.

    +   - The desired function is *Halts(P, I)* := the truth value of this statement:

    +     - “Program P, given input I, eventually terminates.”

    +   - **Theorem:** *Halts* is uncomputable!

    +     - I.e., There does *not* exist *any* algorithm A that computes *Halts* correctly
    for *all* possible inputs.

    +   - Its proof is thus a *non-existence* proof.

    +   - **Corollary:** General impossibility of predictive analysis of arbitrary
    computer programs.


