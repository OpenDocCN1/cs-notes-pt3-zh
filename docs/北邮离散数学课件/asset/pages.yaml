- pgno: 1542
  md: '# Theorem 2


    +   - Let the number of edges of G be m.

    +   - Then G has a Hamiltonian circuit if

    +     - m≥(n²-3n+6)/2.'
  merge: -1
  img_proc: true
- pgno: 1543
  md: '# Proof


    +   - Suppose that $u$ and $v$ are any two vertices of $G$ that are not adjacent.

    +     - We write deg($u$) for the degree of $u$.

    +   - Let $H$ be the graph produced by eliminating $u$ and $v$ from $G$ along
    with any edges that have $u$ or $v$ as end points.

    +   - Then $H$ has $n$-2 vertices and $m$-deg($u$)-deg($v$) edges (one fewer edge
    would have been removed if $u$ and $v$ had been adjacent).'
  merge: -1
  img_proc: true
- pgno: 1544
  md: '# Proof


    +   - The maximum number of edges that $H$ could possibly have is $_{n-2}C_2$.
    This happens when there is an edge connecting every distinct pair of vertices.
    Thus the number of edges of $H$ is at most


    $_{n-2}C_2 = \frac{(n - 2)(n - 3)}{2}$ or $\frac{1}{2}(n^2 - 5n + 6)$.'
  merge: -1
  img_proc: true
- pgno: 1545
  md: '# Proof


    +   - So

    +     $- m - \deg(u) - \deg(v) \leqslant (n^2 - 5n + 6)/2.$

    +   - Therefore

    +     $- \deg(u)+\deg(v) \geq m - (n^2 - 5n + 6)/2.$

    +   - By the hypothesis of the theorem,

    +     $- \deg(u)+\deg(v) \geq (n^2-3n+6)/2 - (n^2-5n+6)/2 = n.$

    +   - Thus the result follows from Theorem I.'
  merge: -1
  img_proc: true
