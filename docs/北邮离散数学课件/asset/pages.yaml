  md: '# 关系的闭包/Closure of Relations


    [定义1]: 称 R ∪ I_A 是 R 的自反闭包/reflexive closure of R, 记为 r(R)。


    [定理1]: 设 R 是 A 上的二元关系, 则 r(R) 是包含 R, 具有自反性的最小关系。


    证明: 对 ∀ x ∈ A, (x, x) ∈ I_A ⊆ R ∪ I_A, 且 R ⊆ R ∪ I_A。


    若 R'' 为包含 R 且具有自反性, 则 I_A ⊆ R'', R ⊆ R'', I_A ∪ R ⊆ R''。即 I_A ∪ R 为最小。


    [推论1]: R 是自反闭包当且仅当 R 是自反的。


    证明:


    +   (1) R 是自反闭包, R = I_A ∪ R ⇒ I_A ⊆ R;

    +   (2) R 具有自反性, I_A ⊆ R, R ∪ I_A = R;'
  merge: -1
  img_proc: true
- pgno: 1165
  md: '[定义2]：称 R ∪ Rᶜ 是 R 的对称闭包/symmetric closure of R，记为 s(R)。

    [定理2]：设 R 是 A 上的二元关系，则 R ∪ Rᶜ 是对称的，包含 R 的最小关系，

    （其中 Rᶜ 是 R 的逆关系）。

    证明：若 (a, b) ∈ R ∪ Rᶜ，则

    (a, b) ∈ R 或 (a, b) ∈ Rᶜ，

    ⇒ (b, a) ∈ Rᶜ 或 (b, a) ∈ R

    故 (b, a) ∈ R ∪ Rᶜ（对称性），

    若 R′ 为包含 R，对称的二元关系，

    则对 ∀ (a, b) ∈ R ∪ Rᶜ，

    若 (a, b) ∈ R ⇒ (a, b) ∈ R′；

    若 (a, b) ∈ Rᶜ ⇒ (b, a) ∈ R，

    ⇒ (b, a) ∈ R′

    又 R′ 具有对称性，(a, b) ∈ R′，

    故 R ∪ Rᶜ ⊆ R′。'
  merge: -1
