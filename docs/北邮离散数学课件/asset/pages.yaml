  md: '# Affine Ciphers


    +   - Shift ciphers are a special case of *affine ciphers* which use functions
    of the form

    +     $f(p) = (ap + b) \mod 26,$

    +     where $a$ and $b$ are integers, chosen so that $f$ is a bijection.

    +     The function is a bijection if and only if gcd$(a,26) = 1.$'
