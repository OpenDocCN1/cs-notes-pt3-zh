- pgno: 610
  md: '# Fun Pigeonhole Proof (Ex. 4, p.401)


    +   - **Theorem:** ∀n∈N, ∃ a multiple m>0 of n ∃ m has only 0’s and 1’s in its
    decimal expansion!

    +   - **Proof:** Consider the n+1 decimal integers 1, 11, 111, ..., 1⋯1. They
    have only n possible residues mod n. So, take the difference of two that have
    the same residue. The result is the answer! □'
