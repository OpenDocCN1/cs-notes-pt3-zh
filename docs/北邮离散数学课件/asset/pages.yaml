- pgno: 1076
  md: '# Symmetry & Antisymmetry


    +   - A binary relation $R$ on $A$ is *symmetric* iff $R = R^{-1}$, that is, if
    $(a,b) \in R \leftrightarrow (b,a) \in R$.

    +     - *E.g.,* $=$ (equality) is symmetric. $<$ is not.

    +     - “is married to” is symmetric, “likes” is not.

    +   - A binary relation $R$ is *antisymmetric* if $\forall a \neq b, (a,b) \in
    R \rightarrow (b,a) \notin R$.

    +     - **Examples:** $<$ is antisymmetric, “likes” is not.

    +     - **Exercise:** prove this definition of antisymmetric is equivalent to
    the statement that $R \cap R^{-1} \subseteq I_A$.'
  merge: -1
  img_proc: true
