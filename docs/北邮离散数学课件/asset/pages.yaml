- pgno: 513
  md: 'Gabriel Lamé

    (1795-1870)


    ![](img/c25dfd82fc242c2db53bc942dcad6885_513_0.png)


    # Lamé’s Theorem


    Lamé’s Theorem: Let a and b be positive integers with a ≥ b. Then the number of
    divisions used by the Euclidian algorithm to find gcd(a,b) is less than or equal
    to five times the number of decimal digits in b.


    Proof: When we use the Euclidian algorithm to find gcd(a,b) with a ≥ b,


    +   n divisions are used to obtain (with a = r₀, b = r₁):


    r₀ = r₁ q₁ + r₂      0 ≤ r₂ < r₁

    r₁ = r₂ q₂ + r₃      0 ≤ r₃ < r₂

    ⋮

    rₙ₋₂ = rₙ₋₁ qₙ₋₁ + rₙ   0 ≤ rₙ < rₙ₋₁

    rₙ₋₁ = rₙ qₙ.


    +   Since each quotient q₁, q₂, ..., qₙ₋₁ is at least 1 and qₙ ≥ 2:


    rₙ ≥ 1 = f₂,

    rₙ₋₁ ≥ 2 rₙ ≥ 2 f₂ = f₃,

    rₙ₋₂ ≥ rₙ₋₁ + rₙ ≥ f₃ + f₂ = f₄,

    ⋮

    r₂ ≥ r₃ + r₄ ≥ fₙ₋₁ + fₙ₋₂ = fₙ,

    b = r₁ ≥ r₂ + r₃ ≥ fₙ + fₙ₋₁ = fₙ₊₁.


    continued →'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# Lamé’s Theorem


    +   - It follows that if $n$ divisions are used by the Euclidian algorithm to
    find gcd$(a,b)$ with $a \ge b$, then $b \ge f_{n+1}$. By Example 4, $f_{n+1} >
    \alpha^{n-1}$, for $n > 2$, where $\alpha = (1 + \sqrt{5})/2$. Therefore, $b >
    \alpha^{n-1}$.

    +   - Because $\log_{10} \alpha \approx 0.208 > 1/5$, $\log_{10} b > (n-1) \log_{10}
    \alpha > (n-1)/5$. Hence, $n-1 < 5 \cdot \log_{10} b$.

    +   - Suppose that $b$ has $k$ decimal digits. Then $b < 10^k$ and $\log_{10}
    b < k$. It follows that $n - 1 < 5k$ and since $k$ is an integer, $n \le 5k$.

    +   - As a consequence of Lamé’s Theorem, $O(\log b)$ divisions are used by the
    Euclidian algorithm to find gcd$(a,b)$ whenever $a > b$.

    +     - By Lamé’s Theorem, the number of divisions needed to find gcd$(a,b)$ with
    $a > b$ is less than or equal to $5 (\log_{10} b + 1)$ since the number of decimal
    digits in b (which equals $[\log_{10} b] + 1$) is less than or equal to $\log_{10}
    b + 1$.'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# Recursively Defined Sets and Structures


    *Recursive definitions* of sets have two parts:


    +   - The *basis step* specifies an initial collection of elements.

    +   - The *recursive step* gives the rules for forming new elements in the set
    from those already known to be in the set.


    +   - Sometimes the recursive definition has an *exclusion rule*, which specifies
    that the set contains nothing other than those elements specified in the basis
    step and generated by applications of the rules in the recursive step.

    +   - We will always assume that the exclusion rule holds, even if it is not explicitly
    mentioned.

    +   - We will later develop a form of induction, called *structural induction*,
    to prove results about recursively defined sets.'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# Recursively Defined Sets and Structures


    # Example : Subset of Integers S:


    BASIS STEP: 3 ∈ S.


    RECURSIVE STEP: If x ∈ S and y ∈ S, then x + y is in S.


    +   - Initially 3 is in S, then 3 + 3 = 6, then 3 + 6 = 9, etc.


    # Example: The natural numbers N.


    BASIS STEP: 0 ∈ N.


    RECURSIVE STEP: If n is in N, then n + 1 is in N.


    +   - Initially 0 is in S, then 0 + 1 = 1, then 1 + 1 = 2, etc.'
