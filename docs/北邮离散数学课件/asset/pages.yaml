  md: '# [定义]顶点的次：


    在无向图G中，与a相邻的顶点的数目称为a的次或度/degree。记为deg(a)或d(a)。


    在有向图G中，以a为终点的边的条数称为a的入次或入度/in-degree。记为deg⁻(a)或d⁻(a)。以a为起点的边的条数称为a的出次或出度/out-degree。记为deg⁺(a)或d⁺(a)。'
