- pgno: 282
  md: '# Conjunctive Normal Form


    +   - A compound proposition is in *Conjunctive Normal Form* (CNF) if it is a
    conjunction of disjunctions.

    +   - Every proposition can be put in an equivalent CNF.

    +   - Conjunctive Normal Form (CNF) can be obtained by eliminating implications,
    moving negation inwards and using the distributive and associative laws.

    +   - Important in resolution theorem proving used in artificial Intelligence
    (AI).

    +   - A compound proposition can be put in conjunctive normal form through repeated
    application of the logical equivalences covered earlier.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Conjunctive Normal Form


    Example: Put the following into CNF:


    ¬(p → q) ∨ (r → p)


    # Solution:


    +   1. Eliminate implication signs:

    +      ¬(¬p ∨ q) ∨ (¬r ∨ p)


    +   2. Move negation inwards; eliminate double negation:

    +      (p ∧ ¬q) ∨ (¬r ∨ p)


    +   3. Convert to CNF using associative/distributive laws

    +      (p ∨ ¬r ∨ q) ∧ (¬q ∨ ¬r ∨ p)'
  merge: -1
  img_proc: true
