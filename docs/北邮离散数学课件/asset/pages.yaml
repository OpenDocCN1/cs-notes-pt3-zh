- pgno: 2254
  md: '# Big-Omega Notation


    **Definition**: Let *f* and *g* be functions from the set of integers or the set
    of real numbers to the set of real numbers. We say that *f(x)* is Ω(*g(x)*) if
    there are constants *C* and *k* such that |*f(x)*| ≥ *C*|*g(x)*| when *x* > *k*.


    +   - We say that “*f(x)* is big-Omega of *g(x)*.”

    +   - Big-O gives an upper bound on the growth of a function, while Big-Omega
    gives a lower bound. Big-Omega tells us that a function grows at least as fast
    as another.

    +   - *f(x)* is Ω(*g(x)*) if and only if *g(x)* is O(*f(x)*). This follows from
    the definitions. See the text for details.


    Ω is the upper case version of the lower case Greek letter ω.'
  merge: -1
  img_proc: true
