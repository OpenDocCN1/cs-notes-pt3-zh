  md: '# Greatest Common Divisor


    **Definition:** The integers *a* and *b* are *relatively prime* if their greatest
    common divisor is 1.


    **Example:** 17 and 22


    **Definition:** The integers *a₁, a₂, ..., aₙ* are *pairwise relatively prime*
    if gcd(*aᵢ, aⱼ*) = 1 whenever 1 ≤ *i* < *j* ≤ *n*.


    **Example:** Determine whether the integers 10, 17 and 21 are pairwise relatively
    prime.


    **Solution:** Because gcd(10,17) = 1, gcd(10,21) = 1, and gcd(17,21) = 1, 10,
    17, and 21 are pairwise relatively prime.


    **Example:** Determine whether the integers 10, 19, and 24 are pairwise relatively
    prime.


    **Solution:** Because gcd(10,24) = 2, 10, 19, and 24 are not pairwise relatively
    prime.'
