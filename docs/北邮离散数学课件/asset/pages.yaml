- pgno: 1226
  md: '# Proof :


    If $R(a) \cap R(b) \neq \varnothing$, then $R(a) = R(b)$


    +   - Let $c \in R(a) \cap R(b)$

    +     - $a R c$, $b R c$

    +     - $c R b$, since $R$ is symmetric

    +     - $a R b$, since $R$ is transitive

    +     - $R(a) = R(b)$ by Lemma I

    +   - So, $\boldsymbol{P}$ is a partition

    +   - $a R b$ iff $a$ and $b$ belong to the same block of $\boldsymbol{P}$, Thus
    $\boldsymbol{P}$ determines $R.$


    - QED'
