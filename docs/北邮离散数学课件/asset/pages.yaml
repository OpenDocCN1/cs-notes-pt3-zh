- pgno: 2142
  md: '# Recognizing Sequences


    +   - Sometimes, you’re given the first few terms of a sequence,

    +     - and you are asked to find the sequence’s generating function,

    +     - or a procedure to enumerate the sequence.


    +   - Examples: What’s the next number?

    +     - 1,2,3,4,...      5 (the 5th smallest number >0)

    +     - 1,3,5,7,9,...   11 (the 6th smallest odd number >0)

    +     - 2,3,5,7,11,...  13 (the 6th smallest prime number)


    +   - 0, 1, 2, 5, 12, 27....'
  merge: -1
  img_proc: true
- pgno: 2143
  md: '# The Trouble with Sequence Recognition


    +   - As you know, these problems are popular on IQ tests, but...

    +   - The problem of finding “the” generating function given just an initial subsequence
    is not a mathematically well defined problem.

    +     - This is because there are *infinitely* many computable functions that
    will generate *any* given initial subsequence.

    +   - We implicitly are supposed to find the *simplest* such function (because
    this one is assumed to be most likely), but,

    +     - how are we to objectively define the *simplicity* of a function?

    +   - We might define simplicity as the reciprocal of complexity, but...

    +     - There are *many* different plausible, competing definitions of complexity,
    and this is an active research area.

    +   - So, these questions really have *no objective right answer*!

    +     - Still, we will ask you to answer them anyway... (Because others will too.)'
  merge: -1
  img_proc: true
- pgno: 2144
  md: '# What are Strings, Really?


    +   - This book says “finite sequences of the form $a_1$, $a_2$, …, $a_n$ are
    called *strings*”,

    +     - but *infinite* strings are also discussed sometimes.

    +   - Strings are normally restricted to sequences composed of *symbols* drawn
    from a finite *alphabet*, and are often indexed from 0 or 1.

    +     - But these are really arbitrary restrictions also.

    +   - Either way, the *length* of a (finite) string is just its number of terms
    (or of distinct indices).'
  merge: -1
