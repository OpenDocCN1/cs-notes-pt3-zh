- pgno: 1810
  md: '# # Some Tree Theorems


    +   - A tree with n nodes has n-1 edges.


    +   - A full m-ary tree with i internal nodes has n=mi+1 nodes, and ℓ=(m-1)i+1
    leaves.


    – Proof: There are mi children of internal nodes, plus the root. And, ℓ = n-i
    = (m-1)i+1. □


    – Thus, given m, we can compute any of i, n, and ℓ from any of the others.'
  merge: -1
  img_proc: true
- pgno: 1811
  md: '# More Theorems


    +   - **Definition:** The *level* of a node is the length of the simple path from
    the root to the node.

    +     - The *height* of a tree is maximum node level.

    +     - A rooted *m*-ary tree with height *h* is *balanced* if all leaves are
    at levels *h* or *h*−1.

    +   - **Theorem:** There are at most *m*^h leaves in an *m*-ary tree of height
    *h*.

    +     - **Corollary:** An *m*-ary tree with *ℓ* leaves has height *h* ≥ ⌈logₘ
    ℓ⌉. If *m* is full and balanced then *h* = ⌈logₘ ℓ⌉'
  merge: -1
  img_proc: true
