  md: '# Theorem 1


    +   - Let $G$ be a connected graph with $n$ vertices, $n > 2$, and no loops or
    multiple edges. $G$ has a Hamiltonian circuit if for any two vertices $u$ and
    $v$ of $G$ that are not adjacent, the degree of $u$ plus the degree of $v$ is
    greater than or equal to $n$.

    +     - $G$ has a Hamiltonian circuit if each vertex has degree greater than or
    equal to $n/2$.'
