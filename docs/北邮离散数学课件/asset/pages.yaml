- pgno: 532
  md: '# Generalized Induction


    **Example:** Suppose that $a_{m,n}$ is defined for $(m,n)\in\mathbb{N}\times\mathbb{N}$
    by $a_{0,0}=0$ and


    $$a_{m,n}=\begin{cases}a_{m-1,n}+1 & \text{if } n=0 \text{ and } m>0\\a_{m,n-1}+n
    & \text{if } n>0\end{cases}.$$


    Show that $a_{m,n}=m+n(n+1)/2$ is defined for all $(m,n)\in\mathbb{N}\times\mathbb{N}$.


    **Solution:** Use generalized induction.


    BASIS STEP: $a_{0,0}=0=0+(0\cdot1)/2$


    INDUCTIVE STEP: Assume that $a_{m'',n''}=m''+n''(n''+1)/2$ whenever $(m'',n'')$
    is less than $(m,n)$ in the lexicographic ordering of $\mathbb{N}\times\mathbb{N}$.


    +   - If $n=0$, by the inductive hypothesis we can conclude $a_{m,n}=a_{m-1,n}+1=m-1+n(n+1)/2+1=m+n(n+1)/2$.

    +   - If $n>0$, by the inductive hypothesis we can conclude $a_{m,n}=a_{m-1,n}+1=m+n(n-1)/2+n=m+n(n+1)/2$.'
  merge: -1
  img_proc: true
