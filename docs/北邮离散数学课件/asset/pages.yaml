- pgno: 739
  md: "# Theorem 1\n\n# properties of distance function\n\nLet x, y, and z be elements\
    \ of B^m. Then\n\n+   (a) δ(x, y) = δ(y, x)\n+   (b) δ(x, y) ≥ 0\n+   (c) δ(x,\
    \ y) = 0 if and only if x = y\n+   (d) δ(x, y) ≤ δ(x, z) + δ(z, y)\n\n# Proof\
    \ of (d)\n\nδ(x, y) = | x ⊕ y | = | x ⊕ 0 ⊕ y |\n    = | x ⊕ z ⊕ z ⊕ y |\n   \
    \ ≤ | x ⊕ z | + | z ⊕ y |"
