  md: '# An Example Problem


    +   - Check using a symbolic derivation whether $(p \land \lnot q) \rightarrow
    (p \oplus r) \Leftrightarrow \lnot p \lor q \lor \lnot r.$


    $(p \land \lnot q) \rightarrow (p \oplus r)$      [Expand definition of →]

    $\Leftrightarrow \lnot(p \land \lnot q) \lor (p \oplus r)$      [Expand defn.
    of ⊕]

    $\Leftrightarrow \lnot(p \land \lnot q) \lor ((p \lor r) \land \lnot(p \land r))$      [DeMorgan’s
