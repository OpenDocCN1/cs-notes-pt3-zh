- pgno: 195
  md: '# Consistent System Specifications


    **Definition:** A list of propositions is *consistent* if it is possible to assign
    truth values to the proposition variables so that each proposition is true.


    **Exercise:** Are these specifications consistent?


    +   - “The diagnostic message is stored in the buffer or it is retransmitted.”

    +   - “The diagnostic message is not stored in the buffer.”

    +   - “If the diagnostic message is stored in the buffer, then it is retransmitted.”


    **Solution:** Let p denote “The diagnostic message is not stored in the buffer.”
    Let q denote “The diagnostic message is retransmitted.” The specification can
    be written as: p ∨ q, ¬p, ¬p. When p is false and q is true all three statements
    are true. So the specification is consistent.


    +   - What if “The diagnostic message is not retransmitted is added.”


    **Solution:** Now we are adding ¬q and there is no satisfying assignment. So the
    specification is not consistent.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Logic Puzzles


    ![](img/c25dfd82fc242c2db53bc942dcad6885_196_0.png)


    Raymond Smullyan

    (Born 1919)


    +   - An island has two kinds of inhabitants, *knights*, who always tell the truth,
    and *knaves*, who always lie.

    +   - You go to the island and meet A and B.

    +     - A says “B is a knight.”

    +     - B says “The two of us are of opposite types.”


    **Example**: What are the types of A and B?


    **Solution:** Let *p* and *q* be the statements that A is a knight and B is a
    knight, respectively. So, then ¬*p* represents the proposition that A is a knave
    and ¬*q* that B is a knave.


    +   - If A is a knight, then *p* is true. Since knights tell the truth, *q* must
    also be true. Then (*p* ∧ ¬*q*)∨ (¬*p* ∧ *q*) would have to be true, but it is
    not. So, A is not a knight and therefore ¬*p* must be true.

    +   - If A is a knave, then B must not be a knight since knaves always lie. So,
    then both ¬*p* and ¬*q* hold since both are knaves.'
  merge: -1
  img_proc: true
