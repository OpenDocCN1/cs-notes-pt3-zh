- pgno: 2123
  md: '# Sufficient Conditions for 1-1ness


    +   - For functions $f$ over numbers, we say:

    +     - $f$ is *strictly* (or *monotonically*) *increasing* iff $x>y$ → $f(x)>f(y)$
    for all $x,y$ in domain;

    +     - $f$ is *strictly* (or *monotonically*) *decreasing* iff $x>y$ → $f(x)<f(y)$
    for all $x,y$ in domain;

    +   - If $f$ is either strictly increasing or strictly decreasing, then $f$ is
    one-to-one. *E.g.* $x^3$

    +     - *Converse is not necessarily true. E.g. 1/x*'
  merge: -1
  img_proc: true
- pgno: 2124
  md: '# Onto (Surjective) Functions


    +   - A function $f:A\to B$ is *onto* or *surjective* or a *surjection* iff its
    range is equal to its codomain ($\forall b\in B,\ \exists a\in A:\ f(a)=b$).

    +   - Think: An *onto* function maps the set $A$ *onto* (over, covering) the *entirety*
    of the set $B$, not just over a piece of it.

    +   - *E.g.*, for domain & codomain $\mathbf{R}$, $x^3$ is onto, whereas $x^2$
    isn’t. (Why not?)'
  merge: -1
  img_proc: true
