- pgno: 2089
  md: '# Set Complements补


    +   - The *universe of discourse* can itself be considered a set, call it $U$.

    +   - When the context clearly defines $U$, we say that for any set $A \subseteq
    U$, the *complement* of $A$, written $\overline{A}$, is the complement of $A$
    w.r.t. $U$, i.e., it is $U - A$.

    +   - *E.g.*, If $U = \mathbf{N}$, $\overline{\{3,5\}} = \{0,1,2,4,6,7,...\}$'
