  md: '# Solution, a typical way


    +   - First

    +     - clearly $a \equiv a \pmod{2}$.

    +     - Thus $R$ is *reflexive*.

    +   - Second

    +     - if $a \equiv b \pmod{2}$, then $a$ and $b$ yield the same remainder when
    divided by 2, so $b \equiv a \pmod{2}$.

    +     - $R$ is *symmetric*.

    +   - Finally

    +     - suppose that $a \equiv b \pmod{2}$ and $b \equiv c \pmod{2}$. Then $a$,
    $b$, and $c$ yield the same remainder when divided by 2.

    +     - Thus, $a \equiv c \pmod{2}$.

    +     - $R$ is *transitive*.

    +   - Hence congruence mod 2 is an equivalence relation.'
  merge: -1
