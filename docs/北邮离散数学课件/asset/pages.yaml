- pgno: 1449
  md: '# 同构判定算法（用邻接矩阵）


    +   1、根据图确定其邻接矩阵（I）


    +   2、计算行次：矩阵每行 1 的个数，（对应于出次）和列次：（对应于入次）


    +   3、不考虑出现的次序不同，若行次与列次不同，则必不同构，否则继续


    +   4、同时交换其一矩阵的 i 行和 j 行， i 列和 j 列。若此矩阵能变成与另一矩阵一样，则同构。对所有顶点的排列都试过，仍不相同，则不同构。Q'
  merge: -1
  img_proc: true
