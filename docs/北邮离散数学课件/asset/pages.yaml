  md: '# Bijections


    +   - A function *f* is said to be a *one-to-one correspondence*, or a *bijection*,
    or *reversible*, or *invertible*, iff it is _both_ one-to-one _and_ onto.

    +   - For bijections *f*:*A*→*B*, there exists an *inverse of f*, written *f*⁻¹:*B*→*A*,
    which is the unique function such that *f*⁻¹ ∘ *f* = *I_A*  – (where *I_A* is
    the identity function on *A*)'
