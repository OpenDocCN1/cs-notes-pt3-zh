- pgno: 1923
  md: '# Definition 1


    +   - An *argument* in propositional logic is a sequence of propositions. All
    but the final proposition in the argument are called ***premises*** and the final
    proposition is called the *conclusion*. An argument is ***valid*** if the truth
    of all its premises implies that the conclusion is true.'
  merge: -1
  img_proc: true
- pgno: 1924
  md: '# Argument form


    +   An argument form in propositional logic is a sequence of compound propositions
    involving propositional variables. An argument form is valid if no matter which
    particular propositions are substituted for the propositional variables in its
    premises, the conclusion is true if the premises are all true.


    +   Corresponding tautology:

    +   ((p 1) ∧ (p 2) ∧ ... ∧ (p n)) → q'
  merge: -1
  img_proc: true
- pgno: 1925
  md: '# Nature & Importance of Proofs


    +   - In mathematics, a *proof* is:

    +     - a *correct* (well-reasoned, logically valid) and *complete* (clear, detailed)
    argument that rigorously & undeniably establishes the truth of a mathematical
    statement.

    +   - Why must the argument be correct & complete?

    +     - *Correctness* prevents us from fooling ourselves.

    +     - *Completeness* allows anyone to verify the result.

    +   - In this course (& throughout mathematics), a very high standard for correctness
    and completeness of proofs is demanded!!'
  merge: -1
  img_proc: true
