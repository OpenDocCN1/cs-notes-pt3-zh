  md: '# Disjunctive Normal Form


    +   - A propositional formula is in *disjunctive normal form* if it consists of
    a disjunction of $(1,\ldots,n)$ disjuncts where each disjunct consists of a conjunction
    of $(1,\ldots,m)$ atomic formulas or the negation of an atomic formula.

    +   - Yes

    +     $(p \land \neg q) \lor (\neg p \lor q)$

    +   - No

    +     $p \land (p \lor q)$'
