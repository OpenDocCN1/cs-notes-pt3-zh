- pgno: 572
  md: '# § 5.5: Program Correctness


    +   - We want to be able to *prove* that a given program meets the intended specifications.

    +     - This can often be done manually, or even by *automated program verification*
    tools.

    +       - One example is PVS (People’s Verification System).

    +   - A program is *correct* if it produces the correct output for every possible
    input.

    +     - A program has *partial correctness* if it produces the correct output
    for every input for which the program eventually halts.'
  merge: -1
  img_proc: true
- pgno: 573
  md: '# Initial & Final Assertions


    +   - A program’s I/O specification can be given using *initial* and *final* assertions.

    +     - The *initial assertion* p is the condition that the program’s input (its
    initial state) is guaranteed (by its user) to satisfy.

    +     - The *final assertion* q is the condition that the output produced by the
    program (its final state) is required to satisfy.

    +   - *Hoare triple* notation:

    +     - The notation p{S}q means that, for all inputs I such that p(I) is true,
    if program S (given input I) halts and produces output O = S(I), then q(O) is
    true.

    +       - That is, S is partially correct with respect to specification p,q.'
  merge: -1
  img_proc: true
- pgno: 574
  md: '# A Trivial Example


    +   - Let S be the program fragment “y := 2; z := x+y”

    +   - Let p be the initial assertion “x = 1”.

    +     - The variable x will hold 1 in all initial states.

    +   - Let q be the final assertion “z = 3”.

    +     - The variable z must hold 1 in all final states.

    +   - Prove p{S}q.

    +     - Proof: If x=1 in the program’s input state, then after running y:=2 and
    z:=x+y, z will be 1+2=3.'
  merge: -1
  img_proc: true
- pgno: 575
  md: "# Hoare Triple Inference Rules\n\n+   - Deduction rules for Hoare Triple statements.\n\
    \n+   - A simple example: *The composition rule:*  \n+     $p\\{S_1\\}q$  \n+\
    \     $q\\{S_2\\}r$  \n+     $\\therefore\\ p\\{S_1;\\ S_2\\}r$\n\n+   - **It\
    \ says:** If program $S_1$ given condition $p$ produces condition $q$, and $S_2$\
    \ given $q$ produces $r$, then the program “$S_1$ followed by $S_2$”, if given\
    \ $p$, yields $r$."
  merge: -1
  img_proc: true
- pgno: 576
  md: '# Inference rule for if statements


    (p ∧ cond){S}q

    (p ∧ ¬cond)→q

    ∴ p{if cond then S}q


    +   - Example: Show that: T {if x>y then y:=x} y≥x.


    +   - Proof: If initially x>y, then the if body is executed, setting y=x, and
    so afterwards y≥x is true. Otherwise, x≤y and so y≥x. In either case y≥x is true.
    So the rule applies, and so the fragment meets the specification.'
