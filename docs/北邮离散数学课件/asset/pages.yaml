- pgno: 30
  md: "# Binary Multiplication of Integers\n\n+   - Algorithm for computing the product\
    \ of two $n$ bit integers.\n\n```\nprocedure multiply(a, b: positive integers)\n\
    {the binary expansions of a and b are $(a_{n-1},a_{n-2},...,a_0)_2$ and $(b_{n-1},b_{n-2},...,b_0)_2$,\
    \ respectively}\nfor j := 0 to n − 1\n    if b_j = 1 then c_j := a shifted j places\n\
    \    else c_j := 0\n{c_0,c_1,...,c_{n-1} are the partial products}\np := 0\nfor\
    \ j := 0 to n − 1\n    p := p + c_j\nreturn p {p is the value of ab}\n```\n\n\
    +   - The number of additions of bits used by the algorithm to multiply two $n$-bit\
    \ integers is $O(n^2)$."
