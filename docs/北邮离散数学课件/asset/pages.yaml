  md: '# Primes


    **Definition**: A positive integer *p* greater than 1 is called *prime* if the
    only positive factors of *p* are 1 and *p*. A positive integer that is greater
    than 1 and is not prime is called *composite*.


    **Example**: The integer 7 is prime because its only positive factors are 1 and
    7, but 9 is composite because it is divisible by 3.'
