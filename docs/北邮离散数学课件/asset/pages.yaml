- pgno: 915
  md: '# # Submonoid – 子独异点


    Let


    (S, *) be a monoid with identity e, and

    T be a nonempty subset of S.


    If T is **closed** under the operation *

    and \( e \in T \), then


    (T, *) is called a **submonoid** of (S, *).'
