  md: '# § 9.5: Equivalence Relations


    +   - An *equivalence relation* (e.r.) on a set $A$ is simply any binary relation
    on $A$ that is reflexive, symmetric, and transitive.

    +     - *E.g.*, $=$ itself is an equivalence relation.

    +     - For any function $f:A\to B$, the relation “have the same $f$ value”, or
    $=_f := \{(a_1,a_2) \mid f(a_1)=f(a_2)\}$ is an equivalence relation,

    +       - *e.g.*, let $m=$“mother of” then $=_m =$ “have the same mother” is an
    e.r.'
