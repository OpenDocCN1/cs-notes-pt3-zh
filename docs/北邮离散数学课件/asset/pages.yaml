- pgno: 1073
  md: '# Reflexivity


    +   - A relation $R$ on $A$ is *reflexive* if $\forall a\in A,\ aRa$.

    +     - *E.g.*, the relation $\geq := \{(a,b)\mid a\geq b\}$ is reflexive.

    +   - A relation $R$ is *irreflexive* iff its *complementary relation* $\overline{R}$
    is reflexive.

    +     - Example: $<$ is irreflexive, because $\geq$ is reflexive.

    +     - Note “*irreflexive*” does **NOT** mean “*not reflexive*”!

    +       - For example: the relation “likes” between people is not reflexive, but
    it is not irreflexive either.

    +         - Since not everyone likes themselves, but not everyone dislikes themselves
    either!'
  merge: -1
  img_proc: true
