- pgno: 321
  md: '# Some Predicate Calculus Definitions (optional)


    +   - An assertion involving predicates and quantifiers is *valid* if it is true

    +     - for all domains

    +     - every propositional function substituted for the predicates in the assertion.


    **Example:** ∀x ¬S(x) ↔ ¬∃x S(x)


    +   - An assertion involving predicates is *satisfiable* if it is true

    +     - for some domains

    +     - some propositional functions that can be substituted for the predicates
    in the assertion.


    Otherwise it is *unsatisfiable*.


    **Example:** ∀x (F(x) ↔ T(x))      not valid but satisfiable


    **Example:** ∀x (F(x) ∧ ¬F(x))      unsatisfiable'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# More Predicate Calculus Definitions (optional)


    The scope of a quantifier is the part of an assertion in which variables are bound
    by the quantifier.


    **Example:** ∀x(F(x) ∨ S(x))      x has wide scope


    **Example:** ∀x(F(x)) ∨ ∀y(S(y))      x has narrow scope'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Logic Programming (optional)


    +   - Prolog (from *Programming in Logic*) is a programming language developed
    in the 1970s by researchers in artificial intelligence (AI).


    +   - Prolog programs include *Prolog facts* and *Prolog rules*.


    +   - As an example of a set of Prolog facts consider the following:


    ```

    instructor(chan, math273).

    instructor(patel, ee2222).

    instructor(grossman, cs301).

    enrolled(kevin, math273).

    enrolled(juan, ee2222).

    enrolled(juana, cs301).

    enrolled(kiko, math273).

    enrolled(kiko, cs301).

    ```


    +   - Here the predicates *instructor(p,c)* and *enrolled(s,c)* represent that
    professor *p* is the instructor of course *c* and that student *s* is enrolled
    in course *c*.'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# Logic Programming (cont)\n\n+   - In Prolog, names beginning with an uppercase\
    \ letter are variables.\n+   - If we have a predicate *teaches(p,s)* representing\
    \ “professor p teaches student s,” we can write the rule:\n+     *teaches(P,S)\
    \ :- instructor(P,C), enrolled(S,C).* \n+   - This Prolog rule can be viewed as\
    \ equivalent to the following statement in logic (using our conventions for logical\
    \ statements).\n+     ∀p ∀c ∀s(I(p,c) ∧ E(s,c)) → T(p,s))"
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Logic Programming (cont)


    +   - Prolog programs are loaded into a *Prolog interpreter*. The interpreter
    receives *queries* and returns answers using the Prolog program.

    +   - For example, using our program, the following query may be given:

    +     ?enrolled(kevin,math273).

    +   - Prolog produces the response:

    +     yes

    +   - Note that the ? is the prompt given by the Prolog interpreter indicating
    that it is ready to receive a query.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Logic Programming (cont)


    The query:

    ?enrolled(X,math273).


    produces the response:

    X = kevin;

    X = kiko;

    no


    The query:

    ?teaches(X,juana).


    produces the response:

    X = patel;

    X = grossman;

    no


    The Prolog interpreter tries to find an instantiation for X. It does so and returns
    X = kevin. Then the user types the ; indicating a request for another answer.
    When Prolog is unable to find another answer it returns no.'
  merge: -1
  img_proc: true
