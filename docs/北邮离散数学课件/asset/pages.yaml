- pgno: 620
  md: '# Permutations ( § 6.3 )


    +   - A *permutation* of a set $S$ of objects is a sequence that contains each
    object in $S$ exactly once.

    +     - An ordered arrangement of $r$ distinct elements of $S$ is called an $r$-permutation
    of $S$.

    +   - The number of $r$-permutations of a set with $n=|S|$ elements is

    +     $P(n,r) = n(n-1)...(n-r+1) = n!/(n-r)!$'
  merge: -1
  img_proc: true
