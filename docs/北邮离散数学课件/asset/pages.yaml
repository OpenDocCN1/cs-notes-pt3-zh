- pgno: 1685
  md: '# Coloring graphs


    +   - Suppose that $G = (V, E, \gamma)$ is a graph with no multiple edges, and
    $C = \{c_1, c_2, ..., c_n\}$ is any set of $n$ “colors”.

    +   - Any function $f: V \to C$ is called *a coloring of the graph G using n colors*
    (or using the colors of $C$).

    +     - For each vertex $v$, $f(v)$ is the color of $v$.'
  merge: -1
  img_proc: true
- pgno: 1686
  md: '# χ(G)


    +   - A coloring is *proper* (合适的) if any two adjacent vertices *v* and *u* have
    different colors.

    +   - The smallest number of colors needed to produce a proper coloring of a graph
    *G* is called the *chromatic number of G* (G的着色数), denoted by χ(G).'
  merge: -1
  img_proc: true
