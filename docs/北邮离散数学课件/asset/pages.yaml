- pgno: 56
  md: "# Finding the Greatest Common Divisor Using Prime Factorizations\n\n+   Suppose\
    \ the prime factorizations of a and b are:\n+   \n+   $a = p_1^{a_1} p_2^{a_2}\
    \ \\dots p_n^{a_n}, \\qquad b = p_1^{b_1} p_2^{b_2} \\dots p_n^{b_n},$ \n+   \n\
    +   where each exponent is a nonnegative integer, and where all primes occurring\
    \ in either prime factorization are included in both. Then:\n+   \n+   $\\gcd(a,\
    \ b) = p_1^{\\min(a_1,b_1)} p_2^{\\min(a_2,b_2)} \\dots p_n^{\\min(a_n,b_n)}.$\n\
    \n+   This formula is valid since the integer on the right (of the equals sign)\
    \ divides both $a$ and $b$. No larger integer can divide both $a$ and $b$.\n+\
    \   \n+   **Example:** $120 = 2^3 \\cdot 3 \\cdot 5 \\quad 500 = 2^2 \\cdot 5^3$\n\
    +   \n+   $\\gcd(120,500) = 2^{\\min(3,2)} \\cdot 3^{\\min(1,0)} \\cdot 5^{\\\
    min(1,3)} = 2^2 \\cdot 3^0 \\cdot 5^1 = 20$\n\n+   Finding the gcd of two positive\
    \ integers using their prime factorizations is not efficient because there is\
    \ no efficient algorithm for finding the prime factorization of a positive integer."
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Least Common Multiple


    **Definition:** The least common multiple of the positive integers *a* and *b*
    is the smallest positive integer that is divisible by both *a* and *b*. It is
    denoted by lcm(*a*,*b*).


    +   - The least common multiple can also be computed from the prime factorizations.


    ```

    lcm(a, b) = p₁^{max(a₁,b₁)} p₂^{max(a₂,b₂)} ... pₙ^{max(aₙ,bₙ)}

    ```


    This number is divided by both *a* and *b* and no smaller number is divided by
    *a* and *b*.


    **Example:** lcm(2³3⁵7², 2⁴3³) = 2^{max(3,4)} 3^{max(5,3)} 7^{max(2,0)} = 2⁴ 3⁵
    7²


    +   - The greatest common divisor and the least common multiple of two integers
    are related by:


    **Theorem 5:** Let a and b be positive integers. Then

    ab = gcd(a,b) · lcm(a,b)

    *(proof is Exercise 31)*'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Euclidean Algorithm


    ![](img/c25dfd82fc242c2db53bc942dcad6885_58_0.png)


    Euclid

    (325 B.C.E. – 265 B.C.E.)


    The Euclidian algorithm is an efficient method for computing the greatest common
    divisor of two integers. It is based on the idea that gcd(a,b) is equal to gcd(a,c)
    when a > b and c is the remainder when a is divided by b.


    # Example: Find gcd(91, 287):


    +   - 287 = 91 · 3 + 14

    +   - 91 = 14 · 6 + 7

    +   - 14 = 7 · 2 + 0


    Divide 287 by 91


    Divide 91 by 14


    Divide 14 by 7


    Stopping condition


    gcd(287, 91) = gcd(91, 14) = gcd(14, 7) = 7'
  merge: -1
  img_proc: true
- pgno: 59
  md: "# Euclidean Algorithm\n\nThe Euclidean algorithm expressed in pseudocode is:\n\
    \n```\nprocedure gcd(a, b: positive integers)\nx := a\nx := b\nwhile y ≠ 0\n \
    \   r := x mod y\n    x := y\n    y := r\nreturn x {gcd(a,b) is x}\n```\n\nIn\
    \ Section 5.3, we’ll see that the time complexity of the algorithm is O(log b),\
    \ where a > b."
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Correctness of Euclidean Algorithm


    Lemma 1: Let a = bq + r, where a, b, q, and r are integers. Then gcd(a,b) = gcd(b,r).


    # Proof:


    +   - Suppose that d divides both a and b. Then d also divides a − bq = r (by
    Theorem 1 of Section 4.1). Hence, any common divisor of a and b must also be any
    common divisor of b and r.

    +   - Suppose that d divides both b and r. Then d also divides bq + r = a. Hence,
    any common divisor of a and b must also be a common divisor of b and r.

    +   - Therefore, gcd(a,b) = gcd(b,r).'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# Correctness of Euclidean Algorithm\n\n+   - Suppose that a and b are positive\
    \ integers with a ≥ b. Let r₀ = a and r₁ = b. Successive applications of the division\
    \ algorithm yields:\n+     r₀ = r₁q₁ + r₂      0 ≤ r₂ < r₁,\n+     r₁ = r₂q₂ +\
    \ r₃      0 ≤ r₃ < r₂,\n+     .   \n+     .   \n+     .   \n+     rₙ₋₂ = rₙ₋₁qₙ₊₁\
    \ + r₂   0 ≤ rₙ < rₙ₋₁\n+     rₙ₋₁ = rₙqₙ .\n\n+   - Eventually, a remainder of\
    \ zero occurs in the sequence of terms: a = r₀ > r₁ > r₂ > ⋯ ≥ 0. The sequence\
    \ can’t contain more than a terms.\n\n+   - By Lemma 1\n+   gcd(a,b) = gcd(r₀,r₁)\
    \ = ⋯ = gcd(rₙ₋₁,rₙ) = gcd(rₙ, 0) = rₙ.\n\n+   - Hence the greatest common divisor\
    \ is the last nonzero remainder in the sequence of divisions."
  merge: -1
  img_proc: true
- pgno: 62
  md: '# gcd s as Linear Combinations


    **Bézout’s Theorem**: If *a* and *b* are positive integers, then there exist integers
    *s* and *t* such that gcd(*a*,*b*) = *s a* + *t b*. (*proof in exercises of Section
    5.2*)


    **Definition**: If *a* and *b* are positive integers, then integers *s* and *t*
    such that gcd(*a*,*b*) = *s a* + *t b* are called *Bézout coefficients* of *a*
    and *b*. The equation gcd(*a*,*b*) = *s a* + *t b* is called *Bézout’s identity*.


    +   - By Bézout’s Theorem, the gcd of integers *a* and *b* can be expressed in
    the form *s a* + *t b* where *s* and *t* are integers. This is a *linear combination*
    with integer coefficients of *a* and *b*.

    +     - gcd(6,14) = (−2)·6 + 1·14'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Finding gcds as Linear Combinations


    **Example:** Express gcd(252,198) = 18 as a linear combination of 252 and 198.


    **Solution:** First use the Euclidean algorithm to show gcd(252,198) = 18


    +   i. 252 = 1·198 + 54

    +    ii. 198 = 3·54 + 36

    +    iii. 54 = 1·36 + 18

    +    iv. 36 = 2·18


    +   Now working backwards, from iii and i above

    +    18 = 54 − 1·36

    +    36 = 198 − 3·54


    +   Substituting the 2nd equation into the 1st yields:

    +    18 = 54 − 1·(198 − 3·54) = 4·54 − 1·198


    +   Substituting 54 = 252 − 1·198 (from i) yields:

    +    18 = 4·(252 − 1·198) − 1·198 = 4·252 − 5·198


    This method illustrated above is a two pass method. It first uses the Euclidian
    algorithm to find the gcd and then works backwards to express the gcd as a linear
    combination of the original two integers. A one pass method, called the *extended
    Euclidean algorithm*, is developed in the exercises.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Consequences of Bézout’s Theorem


    Lemma 2: If a, b, and c are positive integers such that gcd(a, b) = 1 and a |
    bc, then a | c.


    Proof: Assume gcd(a, b) = 1 and a | bc


    +   - Since gcd(a, b) = 1, by Bézout’s Theorem there are integers s and t such
    that sa + tb = 1.

    +   - Multiplying both sides of the equation by c, yields sac + tbc = c.

    +   - From Theorem 1 of Section 4.1:

    +     a | tbc (part ii) and a divides sac + tbc since a | sac and a|tbc (part
    i)

    +   - We conclude a | c, since sac + tbc = c.


    Lemma 3: If p is prime and p | a₁a₂⋯aₙ, then p | aᵢ for some i.

    (proof uses mathematical induction; see Exercise 64 of Section 5.1)


    +   - Lemma 3 is crucial in the proof of the uniqueness of prime factorizations.'
  merge: -1
