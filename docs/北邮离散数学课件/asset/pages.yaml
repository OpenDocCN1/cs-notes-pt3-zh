- pgno: 926
  md: '# # Example 17 - Solution


    Step 1: define the function \( f : \mathbb{Z} \to T \) by

    \( f(a) = 2a \).


    Step 2: \( f \) is one-to-one.

    Suppose that \( f(a_1) = f(a_2) \).

    Then \( 2a_1 = 2a_2 \),

    so \( a_1 = a_2 \).

    Hence \( f \) is one-to-one'
  merge: -1
  img_proc: true
- pgno: 927
  md: '# # Example 17 - Solution


    Step 3: \( f \) is onto.

    Suppose that \( b \) is any even integer.

    Then \( a = b/2 \in \, \mathbb{Z} \) and

    \( f(a) = f(b/2) = 2(b/2) = b \),

    so \( f \) is onto.


    Step 4: \( f(a+b) = 2(a+b) = 2a+2b = f(a)+f(b) \).

    Hence \( (\mathbb{Z}, +) \) and \( (T, +) \) are isomorphic semigroups


    > Q.E.D.'
  merge: -1
  img_proc: true
