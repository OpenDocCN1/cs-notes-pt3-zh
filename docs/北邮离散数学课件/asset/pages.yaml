- pgno: 752
  md: '# Proof of Theorem 3


    Since e is a group code, x ⊕ y is a nonzero code word. Thus

    δ = δ(x, y) = |x ⊕ y| ≥ η.


    On the other hand, since 0 and z are distinct code words,

    η = |z| = |z ⊕ 0| = δ(z, 0) ≥ δ


    Hence η = δ.


    Q.E.D.'
