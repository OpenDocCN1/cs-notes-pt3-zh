- pgno: 1493
  md: '# Euler Path Theorems


    +   - **Theorem:** A connected multigraph has an Euler circuit iff each vertex
    has even degree.

    +     - **Proof:**

    +       - (→) The circuit contributes 2 to degree of each node.

    +       - (←) By construction using algorithm on p. 696

    +   - **Theorem:** A connected multigraph has an Euler path (but not an Euler
    circuit) iff it has exactly 2 vertices of odd degree.

    +     - One is the start, the other is the end.'
  merge: -1
  img_proc: true
- pgno: 1494
  md: '# Theorem 1


    +   - (a)If a graph G has a vertex of odd degree, there can be no Euler Circuit
    in G.

    +   - (b)If G is a connected graph and every vertex has even degree, then there
    is an Euler circuits in G.'
  merge: -1
  img_proc: true
- pgno: 1495
  md: '# Theorem 2


    +   - (a) If a graph G has more than two vertices of odd degree, then there can
    be no Euler path in G.

    +   - (b) If G is connected and has exactly two vertices of odd degree, there
    is an Euler path in G. Any Euler path in G must begin at one vertex of odd degree
    and end at the other.'
  merge: -1
  img_proc: true
- pgno: 1496
  md: '# (a) More than two vertices of odd degree


    +   - Let $v_1$, $v_2$, $v_3$ be vertices of odd degree. And possible Euler path
    must leave(or arrive at) each of $v_1$, $v_2$, $v_3$ with no way to return(or
    leave) since each of these vertices has odd degree. One vertex of these three
    vertices may be the beginning of the Euler path and another the end, but this
    leaves the third vertex at one end of an untraveled edge.

    +   - Thus there is no Euler path.'
  merge: -1
  img_proc: true
- pgno: 1497
  md: '(b) If G is connected and has exactly two vertices of odd degree, there is
    an Euler path in G. Any Euler path in G must begin at one vertex of odd degree
    and end at the other.


    +   - Let u and v be the two vertices of odd degree.

    +   - Add the edge (u,v)

    +   - There is an Euler circuit π

    +   - Omitting (u,v) from π

    +   - Produces a Euler path.'
