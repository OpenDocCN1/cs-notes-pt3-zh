- pgno: 865
  md: '# # a*b = a ∧ b, for all a and b in A


    +   - \( a \leq b \) if and only if \( a = a*b \)


    +   - We have


    +   - \( a*b = a*(b*b) = (a*b)*b \)


    +   - so \( a*b \leq b \).


    +   - In a similar way \( a*b \leq a \).


    +   - so \( a*b \) is a lower bound for \( a \) and \( b \).


    +   - Now, if \( c \leq a \) and \( c \leq b \).


    +   - then \( c = c*a \) and \( c = c*b \) by definition.


    +   - Thus \( c = (c*a)*b = c*(a*b) \).


    +   - so \( c \leq a*b \).


    +   - This shows that \( a*b \) is the greatest lower bound of \( a \) and \(
    b \).'
