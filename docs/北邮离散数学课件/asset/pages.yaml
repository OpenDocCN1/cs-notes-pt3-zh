- pgno: 917
  md: '# # Examples


    If \( T \) is the set of all even integers, then \( (T, *) \) is a subsemigroup
    of the monoid \( (\mathbb{Z}, *) \), where * is ordinary multiplication, but it
    is not a submonoid since the identity of \( \mathbb{Z} \), the number 1, does
    not belong to \( T \).


    If \( (S, *) \) is a semigroup, then \( (S, *) \) is a subsemigroup of \( (S,
    *) \).


    Similarly, let \( (S,*) \) be a monoid, then \( (S, *) \) is a submonoid of \(
    (S, *) \), and


    If \( T = \{e\} \), then \( (T, *) \) is also a submonoid of \( (S, *) \).'
