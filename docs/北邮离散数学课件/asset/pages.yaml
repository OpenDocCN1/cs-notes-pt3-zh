- pgno: 2285
  md: '# Tractable vs. intractable


    +   - A problem or algorithm with at most polynomial time complexity is considered
    *tractable* (or *feasible*). P is the set of all tractable problems.

    +   - A problem or algorithm that has complexity greater than polynomial is considered
    *intractable* (or *infeasible*).

    +   - Note that $n^{1,000,000}$ is *technically tractable*, but really very hard.
    $n^{\log\log\log n}$ is *technically intractable*, but easy. Such cases are rare
    though.'
  merge: -1
  img_proc: true
