- pgno: 2050
  md: '# Even Great Mathematicians Can Propose False Conjectures!


    Example 9


    +   • Euler conjectured that for n>2, the sum of n-1 nth powers of positive integers
    is not an nth power.


    +   – Remained true for all cases checked for 200 years, but no proof was found.


    +   • Finally, in 1966, someone noticed that 27^5 + 84^5 + 110^5 + 133^5 = 144^5.


    +   – Larger counter-examples have also been found for n=4, but none for n>5 yet.'
