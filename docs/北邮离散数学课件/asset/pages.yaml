    # Example: Erdős numbers.


    In a collaboration graph, two people a and b are connected by a path when there
    is a sequence of people starting with a and ending with b such that the endpoints
    of each edge in the path are people who have collaborated.


    In the academic collaboration graph of people who have written papers in mathematics,
    the Erdős number of a person m is the length of the shortest path between m and
