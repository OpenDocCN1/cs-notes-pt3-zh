  md: '# Theorem 2


    +   - Let *R* be an equivalence relation on *A*, and let **P** be the collection
    of all distinct relative sets *R(a)* for *a* in *A*.

    +   - Then **P** is a partition of *A*, and *R* is the equivalence relation determined
    by **P**.


    +   - *R* = {(1, 1), (1, 2), (1, 3), (2, 1), (2, 2), (2, 3), (3, 1), (3, 2), (3,
    3), (4, 4)}

    +   - R(1)=R(2)=R(3)={1,2,3}, R(4)={4}

    +   - **P**={R(1),R(4)}'
