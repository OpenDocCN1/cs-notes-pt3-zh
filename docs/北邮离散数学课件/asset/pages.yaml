- pgno: 2243
  md: '# Big-O Notation


    +   Both $f(x) = x^2 + 2x + 1$ and $g(x) = x^2$ are such that $f(x)$ is $O(g(x))$
    and $g(x)$ is $O(f(x))$. We say that the two functions are of the same order.
    (More on this later)


    +   If $f(x)$ is $O(g(x))$ and $h(x)$ is larger than $g(x)$ for all positive real
    numbers, then $f(x)$ is $O(h(x))$.


    +   Note that if $|f(x)| \le C|g(x)|$ for $x > k$ and if $|h(x)| > |g(x)|$ for
    all $x$, then $|f(x)| \le C|h(x)|$ if $x > k$. Hence, $f(x)$ is $O(h(x))$.


    +   For many applications, the goal is to select the function $g(x)$ in $O(g(x))$
    as small as possible (up to multiplication by a constant, of course).'
  merge: -1
  img_proc: true
