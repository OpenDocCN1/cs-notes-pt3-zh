  img_proc: true
- pgno: 2257
  md: "# # Big Theta Notation\n\n**Example:** Show that the sum of the first *n* positive\
    \ integers is Θ(*n*²).\n\n**Solution:** Let *f(n)* = 1 + 2 + ··· + *n*.\n\n+ \
    \  - We have already shown that *f(n)* is O(*n*²).\n+   - To show that *f(n)*\
    \ is O(*n*²), we need a positive constant *C* such that *f(n)* > *Cn*² for sufficiently\
    \ large *n*. Summing only the terms greater than *n*/2 we obtain the inequality\n\
    +   \n+     1 + 2 + ··· + *n* ≥ ⌈*n*/2⌉ + (⌊*n*/2⌋ + 1) + ··· + *n*\n+   \n+ \
    \    ≥ ⌈*n*/2⌉ + ⌈*n*/2⌉ + ··· + ⌈*n*/2⌉\n+   \n+     = (*n* − ⌈*n*/2⌉ + 1)⌈*n*/2⌉\n\
    +   \n+     ≥ (*n*/2)(*n*/2) = *n*²/4\n+   - Taking *C* = ¼, *f(n)* > *Cn*² for\
    \ all positive integers *n*. Hence, *f(n)* is Ω(*n*²), and we can conclude that\
    \ *f(n)* is Θ(*n*²)."
  merge: -1
  img_proc: true
- pgno: 2258
  md: '# Big-Theta Notation


    **Example**: Show that $f(x) = 3x^2 + 8x \log x$ is $\Theta(x^2)$.


    **Solution:**


    +   - $3x^2 + 8x \log x \le 11x^2$ for $x > 1$, since $0 \le 8x \log x \le 8x^2$.


    +   - Hence, $3x^2 + 8x \log x$ is $O(x^2)$.


    +   - $x^2$ is clearly $O(3x^2 + 8x \log x)$


    +   - Hence, $3x^2 + 8x \log x$ is $\Theta(x^2)$.'
  merge: -1
  img_proc: true
- pgno: 2259
  md: '# Big-Theta Notation


    +   - When $f(x)$ is $\Theta(g(x))$ it must also be the case that $g(x)$ is $\Theta(f(x))$.

    +   - Note that $f(x)$ is $\Theta(g(x))$ if and only if it is the case that $f(x)$
    is $O(g(x))$ and $g(x)$ is $O(f(x))$.

    +   - Sometimes writers are careless and write as if big-O notation has the same
    meaning as big-Theta.'
  merge: -1
  img_proc: true
- pgno: 2260
  md: '# Big-Theta Estimates for Polynomials


    **Theorem:** Let \(f(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_1x+a_0\), where \(a_0,a_1,\ldots,a_n\)
    are real numbers with \(a_n\ne0\). Then \(f(x)\) is of order \(x^n\) (or \(\Theta(x^n)\)).
    (The proof is an exercise.)


    **Example:**


    The polynomial \(f(x)=8x^5+5x^2+10\) is order of \(x^5\) (or \(\Theta(x^5)\)).


    The polynomial \(f(x)=8x^{199}+7x^{100}+x^{99}+5x^2+25\) is order of \(x^{199}\)
    (or \(\Theta(x^{199})\)).'
