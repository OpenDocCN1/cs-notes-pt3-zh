- pgno: 736
  md: '# 本章小结


    各种外围设备的数据传输速率相差很大。如何保证主机与外围设备在时间上同步，则涉及外围设备的定时问题。在计算机系统中，CPU对外围设备的管理方式有：①程序查询方式；②程序中断方式；③DMA方式；④通道方式。每种方式都需要硬件和软件结合起来进行。


    程序查询方式是CPU管理I/O设备的最简单方式，CPU定期执行设备服务程序，主动来了解设备的工作状态。这种方式浪费CPU的宝贵资源。


    程序中断方式是各类计算机中广泛使用的一种数据交换方式。当某一外设的数据准备就绪后，它“主动”向CPU发出请求信号。CPU响应中断请求后，暂停运行主程序，自动转移到该设备的中断服务子程序，为该设备进行服务，结束时返回主程序。中断处理过程可以嵌套进行，优先级高的设备可以中断优先级低的中断服务程序。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_736_0.png)'
  merge: -1
  img_proc: true
- pgno: 737
  md: '# 本章小结


    DMA技术的出现，使得外围设备可以通过DMA控制器直接访问内存，与此同时，CPU可以继续程序。DMA方式采用以下三种方法：①停止CPU访内；②周期挪用；③DMA与CPU交替访内。DMA控制器按其组成结构，分为选择型和多路型两类。


    通道是一个特殊功能的处理器。它有自己的指令和程序专门负责数据输入输出的传输控制，从而使CPU将“传输控制”的功能下放给通道，CPU只负责“数据处理”功能。这样，通道与CPU分时使用内存，实现了CPU内部的数据处理与I/O设备的平行工作。通道有两种类型：①选择通道；②多路通道。'
  merge: -1
  img_proc: true
- pgno: 738
  md: "# 本章小结\n\n+   ○ 标准化是建立开放式系统的基础。CPU、系统总线、I/O总线及标准接口技术近年来取得了重大进步。其中并行I/O接口SCSI与串行I/O接口IEEE\
    \ 1394是两个最具权威性和发展前景的标准接口技术。\n+   \n+   ○ SCSI是系统级接口，是处于主适配器和智能设备控制器之间的并行I/O接口，改进的SCSI可允许连接1～15台不同类型的高速外围设备。SCSI的不足处在于硬件较昂贵，并需要通用设备驱动程序和各类设备的驱动程序模块的支持。\n\
    +   \n+   ○ IEEE 1394是串行I/O标准接口。与SCSI并行I/O接口相比，它具有更高的数据传输速率和数据传送的实时性，具有更小的体积和连接的方便性。IEEE\
    \ 1394的一个重大特点是，各被连接的设备的关系是平等的，不用PC介入也能自成系统。因此IEEE 1394已成为Intel、Microsoft等公司联手制定的新标准。\n\
    \n![](img/3c43175b8c1aba80647f801257e6a5e9_738_0.png)"
  merge: -1
  img_proc: true
