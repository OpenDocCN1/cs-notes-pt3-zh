- pgno: 672
  md: '# 7.6显示设备


    ○假定显示器的分辨率为m×n，需要同时显示k种颜色，那么帧缓冲器的容量v至少要求为： v = m × n × ⌈lg k⌉


    ○或者，假定显示器的分辨率为m×n，帧缓冲器的容量为v，那么，可以同时显示颜色种类数k可表示为： k = 2^(v/(m×n))


    ○通俗地讲：帧缓冲器的容量一定时，分辨率越大，帧缓冲器中每个单元可分配的位长越小，可同时显示的颜色种类也越少。


    ○例如：具有1M字节的帧缓冲器：若分辨率为640×480，则帧缓冲器每单元的位长就为24位；若分辨率为1024×768，则帧缓冲器每单元的位长就为略多于8位'
  merge: -1
