- pgno: 777
  md: '# 3.6.3替换策略


    +   LFU（最不经常使用）

    +     - 被访问的行计数器增加1，换值小的行，不能反映近期cache的访问情况


    +   LRU（近期最少使用）

    +     - 被访问的行计数器置0，其他的计数器增加1，换值大的行，符合cache的工作原理


    +   随机替换

    +     - 随机替换策略实际上是不要什么算法，从特定的行位置中随机地选取一行换出即可。这种策略在硬件上容易实现，且速度也比前两种策略快。缺点是随意换出的数据很可能马上又要使用，从而降低命中率和cache工作效率。但这个不足随着cache容量增大而减小。随机替换策略的功效只是稍逊于前两种策略。'
  merge: -1
  img_proc: true
- pgno: 778
  md: '# 3.6.3替换策略


    ○例子：设cache有1、2、3、4共4个块，a、b、c、d等为主存中的块,访问顺序一次如下：a、b、c、d、b、b、c、c、d、d、a ，下次若要再访问e块。问，采用LFU和LRU算法替换结果是不是相同？


    ![](img/3c43175b8c1aba80647f801257e6a5e9_778_0.png)'
  merge: -1
