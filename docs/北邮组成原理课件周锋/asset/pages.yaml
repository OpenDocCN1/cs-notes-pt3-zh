- pgno: 815
  md: '# 例题


    设某系统采用页式虚拟存储管理，页表存放在内存中。


    (1) 如果一次内存访问使用50ns，访问一次主存需用多少时间？(2) 如果增加TLB，忽略查找页表项占用的时间，并且 75%的页表访问命中TLB，内存的有效访问时间是多少？


    解：


    (1) 若页表存放在主存中，则要实现一次主存访问需两次访问主存：一次是访问页表，确定所存取页面的物理地址；第二次才根据该地址存取页面数据。故访问一次主存的时间为50×2=100(ns)


    (2) 75%×50+(1-75%)×2×50=62.5(ns)'
  merge: -1
  img_proc: true
- pgno: 816
  md: '# 例题


    某计算机的存储系统由cache，主存和磁盘构成。cache的访问时间为15ns；如果被访问的单元在主存中但不在cache中，需要用60ns的时间将其装入cache，然后再进行访问；如果被访问的单元不在主存中，则需要10ms的时间将其从磁盘中读入主存，然后再装入cache中并开始访问。若cache的命中率为90%，主存的命中率为60%，求该系统中访问一个字的平均时间。


    解：被访问的字在cache中的概率为0.9


    不在cache中但在主存中的概率为：(1-0.9)×0.6=0.06


    不在cache也不在主存中的概率为：(1-0.9)×(1-0.6)=0.04


    所以，一个字的访问时间为：


    15×0.9+60×0.06+(60+10×10⁶)×0.04'
  merge: -1
  img_proc: true
- pgno: 817
  md: '# 例题


    +   某页式存储管理，页大小为2KB，逻辑地址空间包含16页，物理空间共有8页，逻辑地址应用多少位？主存物理空间有多大？


    +   解：逻辑地址空间包含16页，页大小为2KB，所以逻辑地址空间为32KB，逻辑地址应用4+11=15位


    +   物理空间共有8页，页大小为2KB，所以主存物理空间16KB'
  merge: -1
  img_proc: true
- pgno: 818
  md: '# 例题


    在一个分页虚存系统中，用户虚地址空间为32页，页长1KB，主存物理为16KB。已知用户程序有10页长，若虚页0、1、2、3已经被调入到主存8、7、4、10页中请问虚地址0AC5和1AC5(十六进制)对应的物理地址是多少？


    解：页长1KB，所以页内地址为10位。


    主存物理页面数：16页，共14位地址码(其中页面号4位，页内地址10位)


    用户虚地址空间：32页，页面号为0~31；共15位地址码(其中页面号5位，页内地址10位)


    0AC5H=00010, 1011000101B，页面号为2，已被调入到主存页4，所以，物理地址中的页面号为4，页内地址与虚地址的页内地址相同，所以是：0100,
    1011000101=12C5H


    1AC5H=00110, 1011000101B，页面号为6，未被调入到主存页中，所以无物理地址，会发生缺页中断。'
  merge: -1
  img_proc: true
