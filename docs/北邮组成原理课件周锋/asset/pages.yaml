- pgno: 212
  md: "# # 浮点数加、减法\n\n设有两个浮点数 \\( x = 2^{E_x} \\cdot M_x \\)  \n\\( y = 2^{E_y} \\\
    cdot M_y \\)  \n\\( x \\pm y = (M_x 2^{E_x - E_y} \\pm M_y) 2^{E_y}, \\quad E_x\
    \ \\leq E_y \\)\n\n# ## 算法\n\n+   - 检查操作数是否为0\n+   - 对阶，求阶差： \\( \\Delta E = E_x\
    \ - E_y \\)，使阶码小的数的尾数右移 \\( |\\Delta E| \\) 位，其阶码取大的阶码值\n+   - 对尾数进行加、减法，求得结果\n\
    +   - 规格化，舍入（可能再次规格化），进行溢出检查（阶码）"
  merge: -1
  img_proc: true
- pgno: 213
  md: '# # 对阶


    # ## 原则： 小阶向大阶看齐 （思考： 为什么？）


    # ## 方法：


    +   逐位移位比较： 小阶的尾数每次右移一位，其阶码加1，直到两数的阶码相等为止


    +   求阶差：


    +   右移的位数等于阶差△E = Ex - Ey


    +   哪个数移位由阶差的正负决定。


    +   若△E = 0,表示两数阶码相等；


    +   若△E > 0,表示Ex > Ey；则y移位；


    +   若△E < 0,表示Ex < Ey；则x移位。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# # 结果规格化


    # ## 左规： 向左规格化


    +   当尾数为原码时，应使结果为x.1xxxxx


    +   当尾数为补码时，应使尾数的最高位与符号位相反。即：若符号位与最高位相等，则应逐次使尾数左移，低位补0，并使阶码减1，直到符合规定。


    +   而对IEEE754浮点格式，应使尾数变为1.M形式


    # ## 右规： 向右规格化


    +   若尾数求和的结果为01.x...x或10.x...x，应将运算结果右移以实现规格化表示


    +   规则： 尾数右移1位,阶码加1'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # IEEE754的舍入处理


    四种舍入（Rounding）方式：

    ■就近舍入（向偶数舍入）：若尾数超出规定的23位的多余位数共3位（形如1.xxyabc），若abc取值为001、010、011，则舍去；若取值为101、110、111，则向最低有效位进位；若取值为中间值100,则进一步判断最低有效位y，若为0，则舍去；否则，向最低有效位进位，最终结果为偶数。

    ■朝0舍入：即朝数轴原点方向舍入，就是把多余的位数简单的截去。截尾使取值的绝对值比原值的绝对值小。

    ■朝+∞舍入：对于正数，当多余位不全为0则向最低有效位进1；而对负数则是简单的截尾。

    ■朝-∞舍入：处理方法正好与朝+∞舍入情况相反。对于正数，当多余位不全为0则简单截尾；而对负数，则向最低有效位进1。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # 溢出判断和处理


    +   - 阶码上溢，一般将其认为是 \( + \infty \) 和 \( - \infty \)

    +   - 阶码下溢，则数值为0

    +   - 尾数上溢，两个同符号位的数相加。处理方法是尾数右移，阶码加1

    +   - 尾数下溢。尾数右移时，最低位从最右端流出。进行要进行舍入处理'
  merge: -1
  img_proc: true
