- pgno: 877
  md: '# 流水线生产


    +   ○ 流水线生产:指劳动对象按一定的工艺路线和统一的生产速度，连续不断地通过各个工作地，按顺序地进行加工并生产出产品的一种生产组织形式。


    +   ○ 它是对象专业化组织形式的进一步发展，是劳动分工较细、生产效率较高的一种生产组织形式。


    +   ○ 亨利.福特(Henry Ford)于1913年在密歇根州的Highland Park，建立的生产系统。


