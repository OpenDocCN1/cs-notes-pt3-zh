- pgno: 334
  md: '# 闪速存储器（1）


    +   - 闪存分为两类

    +     - NOR闪存

    +     - NAND闪存


    1988年Intel公司发明了NOR闪存，擦除写入时间较长，但有完整的地址/数据接口，能随机存取任一可擦除单元。适用于存储那些偶尔需要修改的程序代码。擦除次数为10,000到100,000次。是在EPROM和EEPROM的基础上发展起来的，既有传统的热电子隧道效应的变成机制，又有EEPROM的F-N隧道效应的擦除特点。存储单元比EEPROM小10倍


    1989年Toshiba公司发明了NAND闪存，擦除写入时间较快，与NOR闪存比较具有较高的密度和较低的位成本，10倍的擦除次数。但I/O接口只允许顺序存取数据。适用于高容量存储设备，例如各种存储卡（MMC、Memory
    Stick）、U盘。NAND闪存很少用作计算机的存储器。'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 闪速存储器（2）


    +   - 闪速存储器是目前唯一的具有大容量、非易失性、低价格、可在线改写和较高速度几个特性共存的存储器

    +   - 之所以称为FLASH，是因为擦除速度快，擦除整个存储矩阵所花时间，与EEPROM擦除一个存储单元的时间相同

    +   - Flash比SRAM成本低，比SRAM集成度高，且信息具有不易失性

    +   - 可以取代DRAM吗?

    +     - 擦写次数10⁶ 而DRAM可读写次数为10¹⁵次

    +     - 速度：45ns 而DRAM在10ns以内'
