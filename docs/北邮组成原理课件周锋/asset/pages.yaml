- pgno: 397
  md: '# 1. 指令寻址方式


    # 顺序寻址方式


    +   - 指令地址在内存中按顺序安排，当执行一段程序时，通常是一条指令接一条指令的顺序执行

    +   - 从存储器取出第一条指令，然后执行这条指令；接着从存储器取出第二条指令，在执行第二条指令；接着再取出第三条指令……这种程序顺序执行的过程，称之为指令的顺序寻址方式


    ![](img/3c43175b8c1aba80647f801257e6a5e9_397_0.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# # 顺序寻址方式


    +   - 必须使用程序计数器（又称指令指针寄存器）PC来计数指令的顺序号，该顺序号就是指令在内存中的地址


    +   - 指令顺序寻址方式示意图


    ![](img/3c43175b8c1aba80647f801257e6a5e9_398_0.png)'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 跳跃寻址方式


    +   当程序转移执行顺序时，指令的寻址就采取跳跃寻址方式，所谓跳跃，是指下一条指令的地址码不是由程序计数器给出，而是由本条指令给出


    +   程序跳跃后，按新的指令地址开始顺序执行，指令计数器的内容也必须相应改变，以便及时跟踪新的指令地址


    +   采用指令跳跃寻址方式，可以实现程序转移或构成循环程序，从而能缩短程序长度，或将某些程序作为公共程序引用


    +   指令系统中的各种条件转移、无条件转移和子程序调用指令等，就是为了实现指令的跳跃寻址而设置的'
  merge: -1
  img_proc: true
