- pgno: 30
  md: '# # 计算机的性能指标（1）


    +   - 吞吐量：表征一台计算机在某一时间间隔内能够处理的信息量

    +   - 响应时间：表征从输入有效到系统产生响应之间的时间度量，用时间单位来度量

    +   - 利用率：在给定的时间间隔内系统被实际使用的时间所占的比率，用百分比表示

    +   - 处理机字长：指处理机运算器中一次能够完成二进制数运算的位数。如32位、64位等

    +   - 总线宽度：通常指处理器与存储器之间进行互连的内部总线的位数'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# # 计算机的性能指标（2）\n\n+   - 存储器容量：存储器中所有存储单元的总数。通常用KB、MB、GB和TB表示。B表示Byte。\n+ \
    \  - 存储器带宽：单位时间内从存储器读出的字节数，一般用字节数/秒表示。\n+   - 主频/时钟周期：CPU的工作节拍受主时钟控制，主时钟不断产生固定频率的时钟，主时钟的频率f称为CPU的主频。度量单位是MHz（兆赫兹）、GHz（吉赫兹）。\n\
    +   \n+   主频的倒数称为CPU时钟周期T，T=1/f，度量单位是微秒、纳秒"
  merge: -1
  img_proc: true
- pgno: 32
  md: "# # 计算机的性能指标（3）\n\n+   - CPI（Clock Cycles Per Instruction）：表示每条指令执行所需要的时钟周期数，或执行一条指令所需的平均时钟周期数。\n\
    +   \n+   CPI=程序执行所需的CPU时钟周期总数÷程序的指令总数\n+   \n+   - CPU执行时间：表示CPU执行一段程序所占用的CPU时间\n\
    +   \n+   CPU执行时间=程序的指令数 × CPI × CPU时钟周期时间\n+   \n+   - MIPS：每秒百万指令数\n+   \n+\
    \   MIPS=（指令总数÷程序执行时间） × 10⁻⁶\n+   \n+   - MFLOPS：每秒百万次浮点操作次数\n+   \n+   MIPS=（程序中的浮点运算次数÷程序执行时间）\
    \ × 10⁻⁶"
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # 例题


    某计算机主频为1.2GHz，其指令分为A、 B、 C、 D四类，对应的CPI依次为2、 3、 4、 5，我们可通过运行一基准程序来测定该机的执行速度，已知在这段基准程序中A、
    B、 C、 D这四类指令占所占比例依次为50%、 20%、 10%、 20%，请问该机的MIPS数是多少？


    解：设该基准程序为P，指令条数为n，其平均CPI为：

    CPI= (0.5n × 2+0.2n × 3+0.1n × 4+0.2n × 5) /n=3

    故该机的MIPS数为：

    1.2×10⁹ / 3= 400 MIPS


    ![](img/3c43175b8c1aba80647f801257e6a5e9_33_0.png)'
  merge: -1
  img_proc: true
