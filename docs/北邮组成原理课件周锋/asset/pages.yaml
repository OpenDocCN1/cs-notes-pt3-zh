- pgno: 761
  md: '# 3.6 Cache存储器


    cache基本原理小结：


    +   - cache是介于CPU和主存M2之间的小容量存储器，但存取速度比主存快。主存容量配置几百MB的情况下，cache的典型值是几百KB。cache能高速地向CPU提供指令和数据，从而加快了程序的执行速度。

    +   - 从功能上看，它是主存的缓冲存储器，由高速的SRAM组成。为追求高速，包括管理在内的全部功能由硬件实现，因而对程序员是透明的。

    +   - Cache的设计依据:CPU这次访问过的数据，下次有很大的可能也是访问附近的数据。

    +   - CPU与Cache之间的数据传送是以字为单位,主存与Cache之间的数据传送是以块为单位

    +   - CPU读主存时，便把地址同时送给Cache和主存，Cache控制逻辑依据地址判断此字是否在Cache中，若在此字立即传送给CPU，否则，则用主存读周期把此字从主存读出送到CPU，与此同时，把含有这个字的整个数据块从主存读出送到cache中。'
  merge: -1
  img_proc: true
- pgno: 762
  md: '# 3.6 Cache存储器


    # （3） Cache的命中率


    从CPU来看，增加一个cache的目的，就是在性能上使主存的平均读出时间尽可能接近cache的读出时间。为了达到这个目的，在所有的存储器访问中由cache满足CPU需要的部分应占很高的比例，即cache的命中率应接近于1。


    +   由于程序访问的局部性，实现这个目标是可能的。'
  merge: -1
  img_proc: true
- pgno: 763
  md: '# 3.6 Cache存储器


    在一个程序执行期间，设Nc表示cache完成存取的总次数，Nm表示主存完成存取的总次数，h定义为命中率，则有


    h=Nc/(Nc+Nm)


    若tc表示命中时的cache访问时间，tm表示未命中时的主存访问时间，1-h表示未命中率，则cache/主存系统的平均访问时间ta为：


    ta=h*tc+(1-h)tm'
  merge: -1
  img_proc: true
- pgno: 764
  md: '# 3.6 Cache存储器


    +   - 我们追求的目标是，以较小的硬件代价使带有 cache 的主存系统平均访问时间 ta 越接近 cache 的访问时间 tc 越好。

    +   - 设 r=tm/tc 表示主存慢于 cache 的倍率，e 表示访问效率，则有

    +     $$e=tc/ta=tc/(h*tc+(1-h)*tm)$$

    +     $$=1/(h+(1-h)*r)=1/(r+(1-r)*h)$$

    +   - 由表达式看出，为提高访问效率，命中率 h 越接近 1 越好，r 值以 5—10 为宜，不宜太大。

    +   - 命中率 h 与程序的行为、cache 的容量、组织方式、块的大小有关。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_764_0.png)'
  merge: -1
  img_proc: true
- pgno: 765
  md: '例6 CPU执行一段程序时，cache完成存取的次数为1900次，主存完成存取的次数为100次，已知cache存取周期为50ns，主存存取周期为250ns，求cache/主存系统的效率和平均访问时间。


    ```

    h=Nc/(Nc+Nm)=1900/(1900+100)=0.95

    r=tm/tc=250ns/50ns=5

    e=1/(r+(1-r)h)=1/(5+(1-5)×0.95=83.3%

    t_a=t_c/e=50ns/0.833=60ns

    ```'
  merge: -1
  img_proc: true
