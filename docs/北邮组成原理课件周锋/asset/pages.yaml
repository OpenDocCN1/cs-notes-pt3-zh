  md: '# 特权指令


    特权指令是指具有特殊权限的指令。一般不直接供给用户程序使用，是由系统程序使用的指令。


    这类指令主要完成：


    +   - 系统资源的分配和管理

    +   - 系统工作方式的设置

    +   - 用户访问权限的检测

    +   - 段表、页表的修改

    +   - 任务的创建和切换

