- pgno: 527
  md: '# 5.4.2 微程序设计技术


    # 一、微指令设计


    +   ◆ 设计目标

    +   ❖ 有利于缩短微指令的长度

    +   ❖ 有利于缩小CM的容量

    +   ❖ 有利于提高微程序的执行速度

    +   ❖ 有利于对微指令的修改

    +   ❖ 有利于提高微程序设计的灵活性


    +   ◆ 微指令格式

    +   ❖ 操作控制字段

    +   ❖ 顺序控制字段


    ![](img/3c43175b8c1aba80647f801257e6a5e9_527_0.png)'
  merge: -1
  img_proc: true
- pgno: 528
  md: '# 5.4.2 微程序设计技术


    # 二、微命令的编码方法


    编码有三种方法：直接表示法/编码表示法/混合表示法


    +   1、直接表示法：操作控制字段中的各位分别可以直接控制计算机，不需要进行译码。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_528_0.png)'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# 5.4.2 微程序设计技术


    直接表示法特点：


    +   - 这种方法结构简单，并行性强，操作速度快，但是微指令字太长，若微命令的总数为N个，则微指令字的操作控制字段就要有N位。


    +   - 另外，在N个微命令中，有许多是互斥的，不允许并行操作，将它们安排在一条微指令中是毫无意义的，只会使信息的利用率下降。'
  merge: -1
  img_proc: true
- pgno: 530
  md: '# 5.4.2 微程序设计技术


    ○直接表示法举例，操作控制字段的每一个独立的二进制位代表一个微命令，该位为“1”表示这个微命令有效，为“0”表示这个微命令无效。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_530_0.png)


    微指令格式举例（TEC_5实验平台格式）'
  merge: -1
  img_proc: true
- pgno: 531
  md: '# 5.4.2 微程序设计技术


    2、编码表示法：将操作控制字段分为若干个小段，每段内采用最短编码法，段与段之间采用直接控制法。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_531_0.png)


    ◆编码表示法特点：可以避免互斥，使指令字大大缩短，但增加了译码电路，使微程序的执行速度减慢'
  merge: -1
  img_proc: true
- pgno: 532
  md: '# 5.4.2 微程序设计技术


    3、混合编码法：将前两种结合在一起，兼顾两者特点。一个字段的某些编码不能独立地定义某些微命令，而需要与其他字段的编码来联合定义，如例2：F1与RW


    ![](img/3c43175b8c1aba80647f801257e6a5e9_532_0.png)'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# 5.4.2 微程序设计技术


    编码注意几点：字段编码法中操作控制字段并非是任意的，必须要遵循如下的原则：


    +   ①把互斥性的微命令分在同一段内，兼容性的微命令分在不同段内。这样不仅有助于提高信息的利用率，缩短微指令字长，而且有助于充分利用硬件所具有的并行性，加快执行的速度。


    +   ②应与数据通路结构相适应。


    +   ③每个小段中包含的信息位不能太多，否则将增加译码线路的复杂性和译码时间。


    +   ④一般每个小段还要留出一个状态，表示本字段不发出任何微命令。因此当某字段的长度为三位时，最多只能表示七个互斥的微命令，通常用000表示不操作。


    下面举例说明'
  merge: -1
  img_proc: true
