- pgno: 563
  md: '# 四、总线技术指标


    # 总线带宽（BW）


    总线的带宽指的是单位时间内总线上可传送的数据量，即我们常说的每秒钟传送多少字节。单位是字节/秒（B/s）或兆字节/秒（MB/s）或兆位/秒（Mbps）。（最大传输量）


    与总线带宽密切相关的两个概念是总线宽度和总线的工作频率。


    # 总线宽度（W）


    总线的宽度指的是总线能同时传送的数据位数，即我们常说的16位、32位、64位等总线宽度的概念。


    在工作频率固定的条件下，总线的带宽与总线的宽度成正比。


    # 总线工作频率（f）


    总线的工作频率即总线的时钟频率，以MHz为单位。


    它是指用于协调总线上的各种操作的时钟信号的频率。


    工作频率越高则总线工作速度越快。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_563_0.png)'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# 6.1 总线的概念和结构形态


    总线带宽、总线宽度、总线工作频率三者之间的关系


    +   - 总线带宽取决于总线宽度和工作频率，总线宽度越宽，工作频率越高，则总线带宽越大。

    +   - 单方面提高总线的宽度或工作频率都只能部分提高总线的带宽，并容易达到各自的极限。只有两者配合才能使总线的带宽得到更大的提升。'
  merge: -1
  img_proc: true
- pgno: 565
  md: '# 6.1 总线的概念和结构形态


    ○总线带宽的计算公式如下：


    BW = (W/8) × f/每个存取周期的时钟数


    【例】总线时钟频率为100MHz的32位总线，若每两个时钟周期完成一次总线存取操作，则：


    总线带宽=32/8×100/2=200MB/s。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_565_0.png)'
  merge: -1
  img_proc: true
- pgno: 566
  md: '# 6.1 总线的概念和结构形态


    【例1】（1）某总线在一个总线周期中并行传送4个字节的数据，假设一个总线周期等于一个总线时钟周期，总线时钟频率为33MHz，总线带宽是多少？（2）如果一个总线周期中并行传送64位数据，总线时钟频率升为66MHz，总线带宽是多少？


    解：（1）设总线带宽用BW表示，总线时钟周期用T=1/f表示，一个总线周期传送的数据量（总线宽度）用W表示，根据定义可得：


    BW = W/T = W × (1/T) = W × f = 4B × 33 × 10⁶/s = 132MB/s


    （2）64位=8B


    BW = W/T = 8B × 66 × 10⁶/s = 528MB/s'
  merge: -1
  img_proc: true
