  md: "# 文件指针与位置指针\n\n+   - 比如用FILE *fp定义了一个文件指针，并成功打开一个文件之后，fp只是指向该结构体，而在对文件进行读写操作时，fp的值并不会改变，改变的是结构体中_ptr的值，这个_ptr就是位置指针。\n\
