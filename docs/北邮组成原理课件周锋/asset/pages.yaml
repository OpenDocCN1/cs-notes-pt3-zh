  md: '# 5.4.2 微程序设计技术


    # 三、微指令地址的形成


    +   ○ 入口地址：每条机器指令对应一段微程序，当公用的取指微程序从主存中取出机器指令之后，由机器指令的操作码字段指出各段微程序的入口地址，这是一种多分支(或多路转移)的情況。


    +   ○ 机器指令的操作码转换成初始微地址的方式主要有两种。

    +     ➢ 计数器的方式

    +     ➢ 多路转移的方式


