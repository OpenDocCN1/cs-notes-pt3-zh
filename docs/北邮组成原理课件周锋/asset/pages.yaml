- pgno: 381
  md: '# 地址码（1）


    # 零地址指令


    +   指令字中只有操作码，而没有地址码


    # 一地址指令


    +   称为单操作数指令，指令中只有一个操作数


    +   或者是，指令中默认以运算器中累加寄存器AC中的数为操作数1，而地址码字段所指明的数为操作数2，操作结果又放回累加寄存器AC中


    (AC) OP (A) → AC


    表示累加器AC中的数


    表示操作性质


    表示内存中地址为A的存储单元中的数'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# 地址码（2）


    # 二地址指令常称为双操作数指令


    它的两个地址码字段分别指明参与操作的两个数在内存中或运算器中通用寄存器的地址，A1作存放操作结果的地址

    (A1) OP (A2) → A1


    # 三地址指令


    指令字中有三个操作数地址

    (A1) OP (A2) → A3


    +   A1为被操作数地址，也称源操作数地址；


    +   A2为操作数地址，也称终点操作数地址；


    +   A3为存放结果的地址。


    +   其中，A1、A2、A3可以是内存中的单元地址，也可以是运算器中通用寄存器的地址'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 地址码（3）


    +   - **按照各操作数的物理位置不同，可分为三种类型：**

    +     - **存储器-存储器（SS）型指令**：参与操作的数都放在内存里，因此执行这种指令需多次访问内存。

    +     - **寄存器-寄存器（RR）型指令**：从寄存器中取操作数，把操作结果放到另一寄存器。机器执行寄存器-寄存器型指令的速度很快，因为执行这类指令，不需要访问内存，但需要多个寄存器。

    +     - **寄存器-存储器（RS）型指令**：执行此类指令时，既要访问内存单元，又要访问寄存器。'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# 指令字长度（1）


    +   - 指令字长度：一个指令字中包含二进制代码的位数

    +   - 机器字长：计算机能直接处理的二进制数据的位数，它决定了计算机的运算精度

    +     - 机器字长度通常与寄存器的位数一致

    +   - 指令分类

    +     - 单字长指令：指令字长度等于机器字长度

    +     - 半字长指令：指令字长度等于半个机器字长度

    +     - 双字长指令：指令字长度等于两个机器字长度'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# 指令字长度（2）


    使用多字长指令，目的在于提供更大的地址空间


    +   ◆ 主要缺点是必须两次或多次访问内存以取出一整条指令，降低了 CPU 的运算速度


    +   ▪ **等长指令字结构**：各种指令字长度是相等的。这种指令字结构简单，且指令字长度是不变的


    +   ▪ **变长指令字结构**：各种指令字长度随指令功能而异。结构灵活，代码密度高，能充分利用指令长度，但指令的控制较复杂


    ![](img/3c43175b8c1aba80647f801257e6a5e9_385_0.png)'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# 指令助记符


    +   - 由于硬件只能识别1和0，所以采用二进制操作码是必要的，但不适合人阅读和书写程序

    +   - 因此，每条指令通常用3个或4个英文缩写字母来表示。这种缩写码叫做指令助记符'
  merge: -1
  img_proc: true
