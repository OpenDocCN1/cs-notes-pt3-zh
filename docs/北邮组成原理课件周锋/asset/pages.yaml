- pgno: 878
  md: '# 5.7.1并行处理技术


    # 2、流水技术原理


    +   - 在流水线中必须是连续的任务

    +     - 只有不断的提供任务才能充分发挥流水线的效率

    +   - 把一个任务分解为几个有联系的子任务

    +     - 每个子任务由一个专门的功能部件实现

    +   - 同步或短板效应

    +     - 每个功能部件之后都要有一个缓冲寄存器，或称为锁存器

    +   - 各段的时间应该尽量相等

    +     - 否则将会引起“堵塞”和“断流”的现象

    +   - 需要有装入时间和排空时间

    +     - 只有当流水线完全充满时，才能充分发挥效率


    ![](img/3c43175b8c1aba80647f801257e6a5e9_878_0.png)'
  merge: -1
  img_proc: true
- pgno: 879
  md: '# 5.7.1并行处理技术


    ![](img/3c43175b8c1aba80647f801257e6a5e9_879_0.png)


    设过程段 Sᵢ所需的时间为 τᵢ，缓冲寄存器的延时为 τ₁，线性流水线的时钟周期定义为

    τ = max{ τᵢ } + τ₁ = τₘ + τ₁

    流水线处理的频率为 f = 1 / τ。'
  merge: -1
  img_proc: true
- pgno: 880
  md: '# 5.7.1并行处理技术


    +   ○ 一个具有k 级过程段的流水线处理 n 个任务需要的时钟周期数为Tₖ = k + (n − 1)，

    +   所需的时间为： T = Tₖ × τ

    +   而同时，顺序完成的时间为： T = n × k × τ


    +   ○ k级线性流水线的加速比：

    +   Cₖ = TL / Tk = n·k / k + (n − 1)


    ![](img/3c43175b8c1aba80647f801257e6a5e9_880_0.png)'
  merge: -1
  img_proc: true
