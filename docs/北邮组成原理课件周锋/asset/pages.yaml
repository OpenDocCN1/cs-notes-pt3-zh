- pgno: 8
  md: '# # 处理器内核高危漏洞


    +   - Meltdown（熔断）

    +   - Spectre（幽灵）

    +   - 攻击者利用这两组漏洞，在一定条件下可绕过内存访问的安全隔离机制获取密钥等隐私信息

    +   - 影响面：近20年的Intel、AMD、高通厂家和其它ARM处理器均受到影响

    +   - 攻击原理：现代处理器采用推测执行（Speculative Execution）和间接分支预测（Indirect Branch Prediction）等技术加速程序执行，黑客可通过旁道攻击（Side
    Channel Attack）的方式获取到缓存的敏感内容（由于猜测不正确没有被回滚）


    > 学习完本课程后，可以基本理解该漏洞的原理！


