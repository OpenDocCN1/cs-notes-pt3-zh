- pgno: 742
  md: '# 3.1存储器概述


    # 二、存储器分级结构


    # 1、目前存储器的特点是：


    +   - 速度快的存储器价格贵，容量小；

    +   - 价格低的存储器速度慢，容量大。


    在计算机存储器体系结构设计时，我们希望存储器系统的性能高、价格低，那么在存储器系统设计时，应当在存储器容量，速度和价格方面的因素作折中考虑。


