- pgno: 718
  md: '# 8.4.3 DMA传送一个数据的过程


    ○传送一个数据块可以分为三个阶段。


    +   - 第一阶段是进行初始化，即CPU通过程序I / O的方式给DMA控制器预置初值，取状态和送传送需要的有关参数。

    +   - 第二阶段由DMA控制器控制外设与主存之间的数据交换。

    +   - 第三阶段即CPU中断原程序后进行后处理。若需要继续交换数据，则又要对DMA进行初始化；若不需要交换数据，则停止外设；若为出错，则转错误诊断及处理程序。'
