- pgno: 643
  md: '# 7.2磁盘存储设备


    # 一、磁记录原理


    +   ○ 磁表面存储，是用某些磁性材料薄薄地涂在金属铝或塑料表面作载磁体来存储信息。


    +   ○ 磁盘存储器、磁带存储器均属于磁表面存储器。


    +   ○ 磁表面存储器的优点：

    +   ① 存储容量大，位价格低；

    +   ② 记录介质可以重复使用；

    +   ③ 记录信息可以长期保存而不丢失，甚至可以脱机存档；

    +   ④ 非破坏性读出，读出时不需要再生信息。当然，磁表面存储器也有缺点，主要是存取速度较慢，机械结构复杂，对工作环境要求较高。


    +   ○ 磁表面存储器用途：

    +   ◆ 计算机系统中作为辅助大容量存储器使用，用以存放系统软件、大型文件、数据库等大量程序与数据信息。'
  merge: -1
  img_proc: true
