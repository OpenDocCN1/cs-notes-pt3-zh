- pgno: 607
  md: '# 6.5 典型总线-PCI


    PCI（Peripheral Component Interconnect，外设互连总线的简称）总线是INTEL公司于1992年推出的一种开放性局部总线。其特点如下：


    +   - PCI支持突发性读写操作，可以同时支持多组外围设备。PCI不受处理器的限制，具有广泛的兼容性。

    +   - PCI总线采用一种并行的仲裁机制。仲裁是基于访问而不是基于时间片的，任何主设备使用总线都必须提出仲裁请求。

    +   - 总线仲裁器根据收到的请求信号和各个设备的优先级别以及当前总线的工作状态来决定哪一个主设备获得总线的控制权。取得总线控制权的总线主控制器可以使用总线进行一次总线操作。'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# 6.5 典型总线-PCI


    +   PCI总线采用的是隐含仲裁的方式，一次仲裁可以在上一次使用的同时进行，使得总线的仲裁不必占用总线的周期。


    +   PCI V1.0定义了32位数据总线宽度，可扩展到64位，支持33MHz的时钟频率，最大传输速率可达到133MB / S。


    +   PCI V2.2标准扩展到64位，允许PCI总线以66MHz的速度运行，能提供528MB / S的带宽。


    +   PCI得到广泛应用的原因是因为支持PnP（Plug and Play，即插即用）。PnP能够在加电时，BIOS（Basic Input Output
    System，基本输入输出系统）自动检测机器配置，识别并自动配置各个外围设备，分配中断请求号、存储器的缓冲区等，从而避免了IRQ（中断请求）、DMA和I/O通道之间的冲突。'
  merge: -1
  img_proc: true
