  md: '# # 计算机组成（2）


    +   - Datapath: 完成算术和逻辑运算，通常包括若干寄存器

    +   - Control: CPU的组成部分，它根据程序指令来指挥datapath，memory以及I/O运行，共同完成程序功能

    +   - Memory: 存放运行时程序及其所需要的数据的场所

    +   - Input: 信息进入计算机的设备，如键盘、鼠标等

    +   - Output: 将计算结果展示给用户的设备，如显示器、磁盘、打印机、喇叭等'
