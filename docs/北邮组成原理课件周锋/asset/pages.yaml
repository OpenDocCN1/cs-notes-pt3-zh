    +1101

    ———

    0.10001111


    加符号：1.10001111


    # ## 基本算法描述：


    +   - 若乘数的当前位为1，则将被乘数和部分积求和。

    +   - 若乘数的当前位为0，则跳过。

    +   - 将部分积移位。

    +   - 所有位都完成后，部分积即为最终结果。


    +   - N 位乘数 × M 位被乘数 => N+M 位的积

    +   - 乘法显然比加法更复杂...

