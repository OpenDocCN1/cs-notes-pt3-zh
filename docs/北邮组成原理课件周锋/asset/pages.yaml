  md: '# 8.5 通道方式


    +   - 采用通道方式组织输入输出系统，多使用主机—通道—设备控制器—I/O设备四级连接方式。

    +   - 在CPU启动通道后，通道自动地去内存取出通道指令并执行指令。直到数据交换过程结束向CPU发出中断请求，进行通道结束处理工作。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_724_0.png)'
  merge: -1
