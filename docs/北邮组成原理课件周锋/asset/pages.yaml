  md: '# 闪速存储器的特点


    +   - 按区块 (sector) 或页面 (page) 组织

    +     - 可进行字节、区块、页面或整芯片的擦除和编程


    +   - 具有内部编程控制逻辑

    +     - 内部设有命令寄存器和状态寄存器


    +   - 具有在系统编程能力

    +     - 目前的闪存内部可以自行产生编程电压（VPP）

    +     - 在工作状态下，在系统中就可实现编程操作。


    +   - 具有软件和硬件保护能力


    +   - 采用命令方式可以使闪存进入各种不同工作状态

    +     - 例如整片擦除、页面擦除、整片编程、字节编程、分页编程、进入保护方式、读识别码等'
