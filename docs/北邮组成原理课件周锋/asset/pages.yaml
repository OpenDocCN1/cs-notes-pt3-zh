- pgno: 580
  md: '# 6.3 总线的仲裁


    # 总线操作


    在一方（比如CPU、DMAC等）设备的控制下，通过各级总线进行的信息传送（读、写）操作。


    +   - 连接到总线上的功能模块有主方(主动)和从方(被动)两种形态

    +     - 主方可以启动一个总线周期，而从方只能响应主方请求。

    +     - 每次总线操作，只能有一个主方，但是可以有多个从方。


    +   - 多个主方共享总线，存在争用总线的问题，必须有总线仲裁。


    +   - 总线占用期：主方持续控制总线的时间。


    +   - 按照总线仲裁电路的位置不同，仲裁方式分为

    +     - 集中式

    +     - 分布式'
