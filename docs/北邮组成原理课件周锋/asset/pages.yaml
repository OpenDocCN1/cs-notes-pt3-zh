- pgno: 498
  md: '# 5.3.3 控制方式


    +   ○ 机器指令所包含的CPU周期数反映了指令的复杂程度，不同CPU周期的操作信号的数目和出现的先后次序也不相同。

    +   ○ 控制方式：控制不同操作序列时序信号的方法。

    +   ○ 分为以下几种：

    +     ◆ 同步控制方式

    +     ◆ 异步控制方式

    +     ◆ 联合控制方式'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# 5.3.3 控制方式


    +   ○ 同步控制方式（指令的机器周期和时钟周期数不变）

    +     ◆ 完全统一的机器周期执行各种不同的指令

    +     ◆ 采用不定长机器周期

    +     ◆ 中央控制于局部控制的结合


    +   ○ 异步控制方式

    +     ◆ 每条指令需要多长时间就占多长时间


    +   ○ 联合控制方式

    +     ◆ 大部分指令在固定的周期内完成，少数难以确定的操作采用异步方式

    +     ◆ 机器周期的节拍脉冲固定，但是各指令的机器周期数不固定（微程序控制器采用）'
  merge: -1
  img_proc: true
