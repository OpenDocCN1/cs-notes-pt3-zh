- pgno: 952
  md: '| 字节偏移（十六进制） |  |  |

    |---|---|---|

    | F9H | FF 00 00 00 00 00 | ← 扩展 FCB 起点 |

    | 00H | 文件属性（1） | ← 普通 FCB 起点 |

    | 01H | 驱动器号（1） |  |

    | 02H | 文件名（8）或设备名 | 文件打开前由用户设置 |

    | 09H | 扩展名（3） |  |

    | 0CH | 当前记录号（2） | ← 未打开的 FCB 到此结束 |

    | 0EH | 记录长度（2） | 由 DOS 设置 |

    | 10H | 文件长度（4） |  |

    | 14H | 建立或最后修改的日期（2） | 0CH 和 0EH 域可由用户设置 |

    | 16H | 建立或最后修改的时间（2） |  |

    | 18H | DOS 保留（8） | ← 文件存取前 |

    | 20H | 当前记录号（1） | 由用户设置 |

    | 21H | 相对记录号（4） | ← 打开的 FCB 到此结束 |


    什么是流（stream）？ K&R 《The C Programming Language》 P241 “A stream is a source or destination
    of data that may be associated with a disk or other peripheral.” 译文：流（stream）是与磁盘或其它外围设备关联的数据的源或目的地


    在C语言中，处理文件时，每次的读写操作并不是直接操作存储器上的物理空间的，而是先会读出/写入到一个缓冲区中，实际的编程中，这个缓冲区是隐式的'
