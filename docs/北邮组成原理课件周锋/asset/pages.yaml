- pgno: 1019
  md: '# 格式化读写的不同


    +   - 注意:1)格式化读写和其他几种读写有很大的不同。格式化读写是以我们人所能识别的格式将数据写入文件，即若以ASCII数码方式写入一个整型数值65，则其实是写入的两个数码字符''6''和''5''，即占2字节，而不是4字节，但是若以块写方式写入，则其占4字节。即在使用格式化读写时系统自动进行了一些转换。


    +   - 2)fprintf和fscanf函数一般成对出现，若数据是用fprintf进行写入的，则最好使用fscanf进行读取。'
