  md: '# 二、 随机读写与fseek()函数


    文件既可以顺序读写，也可以随机读写，关键在于控制文件的位置指针。


    所谓顺序读写是指，读写完当前数据后，系统自动将文件的位置指针移动到下一个读写位置上。


    所谓随机读写是指，读写完当前数据后，可通过调用fseek()函数，将位置指针移动到文件中任何一个地方。'
