- pgno: 204
  md: '# # BCD码加法实例


    x=36, y=47, 求x+y


    解：[x]<sub>BCD</sub>=0011 0110, [y]<sub>BCD</sub>=0100 0111


    [x]<sub>BCD</sub> 0011 0110


    +[y]<sub>BCD</sub> 0100 0111


    0111 1101


    + 0110


    [x+y]<sub>BCD</sub> 1000 0011


    所以， x+y=83


    校正逻辑：BCD码完成十进制运算时，当和数大于9时，必须对和数进行加6修正


    北京邮电大学 计算机学院体系结构中心 54'
  merge: -1
