- pgno: 601
  md: '# 6.4总线的定时和数据传送模式


    # 二、总线数据传送模式


    读、写操作：


    +   - 读操作是由从方到主方的数据传送；

    +   - 写操作是由主方到从方的数据传送。


    主方先以一个总线周期发出“命令”和“从方地址”，经过一定的延时再开始数据传送总线周期。为了提高总线利用率，减少延时损失，主方完成寻址总线周期后可让出总线控制权，以使其他主方完成更紧迫的操作。然后再重新竞争总线，完成数据传送总线周期。'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# 6.4总线的定时和数据传送模式


    块传送操作：


    +   ◆ 一次传送一块数据，常称为猝发式传送


    +   ◆ 只需给出块的起始地址，然后对固定块长度的数据一个接一个地读出或写入。


    +   ◆ 对于CPU（主方） 存储器（从方）而言的块传送，块长一般固定为数据线宽度（存储器字长）的4倍。


    +   ◆ 例如一个64位数据线的总线，一次猝发式传送可达256位。'
  merge: -1
  img_proc: true
- pgno: 603
  md: '# 6.4总线的定时和数据传送模式


    写后读、读修改写操作：


    这是两种组合操作，和猝发式操作一样，主方掌管总线直到整个操作完成。


    +   ◆ 只给出地址一次（表示同一地址），进行先写后读操作，用于校验目的。


    +   ◆ 只给出地址一次（表示同一地址），进行先读后写操作。用于多道程序系统中对共享存储资源的保护。'
  merge: -1
  img_proc: true
- pgno: 604
  md: '# 6.4总线的定时和数据传送模式


    ○ 广播、广集操作：


    一般而言，数据传送只在一个主方和一个从方之间进行。


    +   - **广播**：总线允许一个主方对多个从方进行写操作，这种操作称为广播。

    +   - **广集**：它将选定的多个从方数据在总线上完成 AND 或 OR 操作，比如总线仲裁，用以检测多个中断源。


