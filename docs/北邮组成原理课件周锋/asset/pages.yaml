- pgno: 616
  md: '# 6.5 典型总线-PCI


    PCI总线周期的操作过程有如下：


    +   (1) 采用同步时序协议。总线时钟周期以上跳沿开始，半个周期高电平，半个周期低电平。总线上所有事件，即信号电平转换出现在时钟信号的下跳沿时刻，而对信号的采样出现在时钟信号的上跳沿时刻


    +   (2) 总线周期由被授权的主方启动，以帧FRAME#信号变为有效来指示一个总线周期的开始。


    +   (3) 一个总线周期由一个地址期和一个或多个数据期组成。


    在地址期内除给出目标地址外，还在C/BE#线上给出总线命令以指明总线周期类型。


    +   (4) 地址期为一个总线时钟周期，一个数据期在没有等待状态下也是一个时钟周期。


    一次数据传送是在挂钩信号IRD Y#和TRDY#都有效情况下完成，任一信号无效（在时钟上跳沿被对方采样到），都将加入等待状态。'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# 6.5 典型总线-PCI


    （5）总线周期长度由主方确定。


    +   ○ 在总线周期期间FRAME#持续有效，但在最后一个数据期开始前撤除。即以FRAME#无效后，IRD Y#也变为无效的时刻表明一个总线周期结束。


    +   ○ PCI的数据传送以猝发式传送为基本机制，单一数据传送反而成为猝发式传送的一个特例。并且PCI具有无限制的猝发能力，猝发长度由主方确定，没有对猝发长度加以固定限制。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_617_0.png)'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# 6.5 典型总线-PCI


    （6）主方启动一个总线周期时要求目标方确认。


    在FRAME#变为有效和目标地址送上AD线后，目标方在延迟一个时钟周期后必须以DEVSEL#信号有效予以响应。否则，主设备中止总线周期。


    （7）主方结束一个总线周期时不要求目标方确认。


    目标方采样到FRAME#信号已变为无效时，即知道下一数据传送是最后一个数据期。


    目标方传输速度跟不上主方速度，可用TRDY#无效通知主方加入等待状态时钟周期。


    当目标方出现故障不能进行传输时，以STOP#信号有效通知主方中止总线周期。'
  merge: -1
  img_proc: true
