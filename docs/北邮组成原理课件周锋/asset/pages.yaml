- pgno: 110
  md: "# # UNICODE编码\n\n+   Unicode是国际组织制定的可以容纳世界上所有文字和符号的字符编码方案，它为每种语言中的每个字符设定了唯一的二进制编码，以满足跨语言、跨平台进行文本转换、处理的要求\n\
    \n+   Unicode 规划的总空间是17个平面（平面0至16），0x0000 至0x10FFFF。每个平面有 65536 个编码。\n+   \n+\
    \   ◆ 平面2的43253个字符都是汉字\n+   \n+   ◆ 平面0上定义了27973个汉字\n\n+   在Unicode中，汉字的“汉”，其编码是0x6C49。\n\
    \n+   UTF（Unicode Transformation Format）是Unicode字符集转换格式，是一种储存和传送的格式。可理解为Unicode的压缩形式。UTF格式包括UTF-8、UTF-16、UTF-32\n\
    \n+   UTF-8是一种变长字符编码，1~6个字节。"
  merge: -1
