- pgno: 537
  md: '# 5.4.2 微程序设计技术


    # 2、后继微地址形成方法


    # (1) 计数器的方式


    +   方法：

    +   - 微程序顺序执行时，其后继微地址就是现行微地址加上一个增量(通常为1)；

    +   - 当微程序遇到转移或转子程序时，由微指令的转移地址段来形成转移微地址。

    +   - 在微程序控制器中也有一个微程序计数器μPC，一般情况下都是将微地址寄存器μMAR作为μPC


    +   特点：

    +   - 优点是简单、易于掌握，编制微程序容易

    +   - 缺点是这种方式不能实现两路以上的并行微程序转移，因而不利提高微程序的执行速度。'
  merge: -1
  img_proc: true
