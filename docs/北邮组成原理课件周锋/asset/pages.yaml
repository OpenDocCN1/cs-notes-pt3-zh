  md: "# 6.3 总线的仲裁\n\n+   ○ 冲突检测分布式裁决\n+   \n+     每个设备独立地请求总线。\n\n+   ◆ 当某个设备需要使用总线时，首先检测是否有其它设备正在使用总线。如果没有，该设备就置“总线忙”，然后使用总线。\n\
