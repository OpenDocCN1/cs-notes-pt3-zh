  md: '# 74LS181 ALU算术/逻辑运算功能表


    | 工作方式选择输入 |  |  |  | 负逻辑输入与输出 |  | 正逻辑输入与输出 |  |

    |---|---|---|---|---|---|---|---|

    | S3 | S2 | S1 | S0 | 逻辑(M=H) | 算术运算 (Cn=L) | 逻辑 (M=H) | 算术运算 (M=L) (Cn=H) |

    | L | L | L | L | A̅ | A 减 1 | A̅ | A |

    | L | L | L | H | A̅B̅ | AB 减 1 | A̅+B̅ | A+B |

    | L | L | H | L | A̅+B̅ | A B̅ 减 1 | A̅ B̅ | A+ B̅ |

    | L | L | H | H | 逻辑 1 | 减 1 | 逻辑 0 | 减 1 |

    | L | H | L | L | A̅+B̅ | A 加 (A+ B̅) | A̅B̅ | A 加 A B̅ |

    | L | H | L | H | B̅ | AB 加 (A+ B̅) | B̅ | (A+B) 加 A B̅ |

    | L | H | H | L | A⊕B̅ | A 减 B 减 1 | A⊕B̅ | A 减 B 减 1 |

    | L | H | H | H | A+ B̅ | A+ B̅ | A B̅ | A B̅ 减 1 |

    | H | L | L | L | A̅ B | A 加 (A+B) | A̅+A̅ | A 加 A B |

    | H | L | L | H | A⊕B | A 加 B | A⊕B̅ | A 加 B |

    | H | L | H | L | B | A B̅ 加 (A+B) | A B | (A+ B̅) 加 A B |

    | H | L | H | H | A+B | A+B | A B | A B 减 1 |

    | H | H | L | L | 逻辑 0 | A 加 A* | 逻辑 1 | A 加 A* |

    | H | H | L | H | A B̅ | A B 加 A | A+ B̅ | (A+B) 加 A |

    | H | H | H | L | A B | A B̅ 加 A | A+B | (A+ B̅) 加 A |

    | H | H | H | H | A | A | A | A 减 1 |


    说明：(1) H=高电平，L=低电平。(2) *表示每一位均移到下一个更高位，即 A*=2A。'
