- pgno: 113
  md: '# # 汉字的表示方法（1）


    # ## 汉字交换码（国标码）


    +   信息交换用汉字编码字符集，是我国1980年发布，1981年5月1日开始实施的一套国家标准，标准号是GB 2312—1980。


    +   基本集共收入汉字6763个和非汉字图形字符682个


    +   整个字符集分成94个区，每区有94个位。每个区位上只有一个字符，因此可用所在的区和位来对汉字进行编码，称为区位码。这个码是唯一的，不会有重码字。


    +   把换算成十六进制的区位码加上2020H，就得到国标码'
  merge: -1
  img_proc: true
