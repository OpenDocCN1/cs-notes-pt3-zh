- pgno: 249
  md: '# # 内存的主要技术指标（2）


    # ## 存取速度


    # ### 访问时间（存取时间） T<sub>A</sub>：


    +   - 从存储器接收到读/写命令到信息被读出或写入完成所需的时间。


    +   - 决定于存储介质的物理特性和寻址部件的结构。


    # ### 存取周期T<sub>M</sub>：


    在存储器连续读写过程中一次完整的存取操作所需的时间（CPU连续两次访问存储器的最小时间间隔）


    通常：  T<sub>M</sub> >>T<sub>A</sub>'
  merge: -1
  img_proc: true
