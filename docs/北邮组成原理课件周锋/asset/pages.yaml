- pgno: 1109
  md: "# TEC-8 模型计算机的中断处理过程\n\n除指令EI、DI外，每条指令执行过程的最后一条微指令都包含判断位P4，用于判断有无中断发生，根据中断信号INT是否为1决定微程序序分支。如果信号INT为1，则转微地址11H，进入中断处理；如果信号INT为0，则转微地址01H，继续取下一条指令然后执行。\n\
    \n```\nif MF'event and MF = '1' then\nEN_INT <= INTEN or (EN_INT and (not INTDI));\n\
    end if;\n    INT <= EN_INT and PULSE;\nend process;\n```\n\n![](img/3c43175b8c1aba80647f801257e6a5e9_1109_0.png)"
  merge: -1
  img_proc: true
- pgno: 1110
  md: '# # TEC-8 模型计算机的中断处理过程


    +   ◇ INT为1转到微地址11H，该微指令产生INTDI信号，禁止新的中断发生，产生LIAR信号保存当前地址(断点寄存器)，产生STOP信号，等待手动设置中断向量（数据开关SD7~SDO设置中断地址），机器将中断向量读到PC后，转到中断服务程序继续执行。


    +   ◇ 执行指令IRET，从中断地址返回，该指令产生IABUS信号，恢复断点地址，产生信号LPC，将断点从数据总线装入PC，恢复被中断的程序'
  merge: -1
  img_proc: true
- pgno: 1111
  md: '# TEC-8 模型计算机的中断处理过程


    发生中断时，关中断由硬件负责。而中断现场(包括4个寄存器、进位标志C和结果为O标志Z)的保存和恢复由中断服务程序完成。中断服务程序的最后两条指令一般是开中断指令EI和中断返回指令IRET。为了保证从中断服务程序能够返回到主程序，EI指令执行后，不允许立即被中断。因此，EI指令执行过程中的最后一条微指令中不包含P4判别位。'
  merge: -1
  img_proc: true
