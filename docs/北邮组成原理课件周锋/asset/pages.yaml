- pgno: 679
  md: '例4 刷存的重要性能指标是它的带宽。实际工作时显示适配器的几个功能部分要争用刷存的带宽。假定总带宽的50%用于刷新屏幕，保留50%带宽用于其他非刷新功能。


    (1)若显示工作方式采用分辨率为1024×768，颜色深度为3B，帧频（刷新速率）为72Hz，计算刷存总带宽应为多少？


    (2)为达到这样高的刷存带宽，应采取何种技术措施？


    【解】(1)∵ 刷新所需带宽=分辨率×每个像素点颜色深度×刷新速率 ∴ 1024×768×3B×72/s=165888KB/s=162MB/s 刷存总带宽应为162MB/s×100/50=324MB/s


    (2)为达到这样高的刷存带宽，可采用如下技术措施：


    +   ①使用高速的DRAM芯片组成刷存；

    +   ②刷存采用多体交叉结构；

    +   ③刷存至显示控制器的内部总线宽度由32位提高到64位，甚至128位；

    +   ④刷存采用双端口存储器结构，将刷新端口与更新端口分开。'
  merge: -1
  img_proc: true
