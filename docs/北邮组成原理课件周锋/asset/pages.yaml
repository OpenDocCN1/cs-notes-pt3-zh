- pgno: 109
  md: '# # 字符型数据的表示


    字符作为人—机联系的媒介，是最重要的数据类型之一，最常见的是ASCII字符编码，每个字符用7位二进制数表示，可表示 128 个字符。在计算机内部用 1 个字节表示每一个符号，最高位为0，或最高位作校验位。

    通用的两个标准字符集为：


    +   - ASCII 码

    +     - 大小写字母、数字、专用符号、控制字符

    +   - Unicode或 ISO 10646

    +     - 统一码，表示多种语言文字'
