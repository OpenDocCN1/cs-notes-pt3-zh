- pgno: 57
  md: '# # 数据编码与表示


    # ## 计算机中的数据


    +   - 整数、浮点数、字符（串）、逻辑值

    +   - 需要编码进行表示


    # ## 编码原则


    +   - 使用少量简单的基本符号

    +   - 一定的规则

    +   - 表示大量复杂的信息


    # ## 二进制码0、1


    +   - 符号个数最少，物理上容易实现

    +   - 与二值逻辑的“真”“假”两个值对应

    +   - 用二进制码表示数值数据运算规则简单


    ![](img/3c43175b8c1aba80647f801257e6a5e9_57_0.png)'
  merge: -1
