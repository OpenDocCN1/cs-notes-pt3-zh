- pgno: 911
  md: '# 5.7.3流水线中的主要问题


    # 3、数据相关


    +   - RAW(Read After Write)

    +     - 后面指令用到前面指令所写的数据

    +   - WAW(Write After Write)

    +     - 两条指令写同一个单元

    +     - 在简单流水线中没有此类相关，因为不会乱序执行

    +   - WAR(Write After Read)

    +     - 后面指令覆盖前面指令所读的单元

    +     - 在简单流水线中没有此类相关

    +   - 解决办法：

    +     - 可以推后后继指令对相关单元的读操作

    +     - 设置相关的直接通路 (Forwarding)'
