    \ = 2^{n+2} + X\\)\n\n+   下式也同样成立\n+   \n+   \\([x]_\\text{补} + [y]_\\text{补}\
    \ = [x+y]_\\text{补}\\)\n\n+   注意事项\n+   \n+   - 两个符号位均参加运算\n+   - 最高符号位上产生的进位要丢掉"
