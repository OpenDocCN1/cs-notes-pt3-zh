  md: '# 多模块交叉存储器的基本结构


    +   - 主存被分成4个独立、容量相同的模块M0/M1/ M2/M3

    +   - 每个模块均有自己的读写控制电路、地址寄存器和数据寄存器，以相同的方式与CPU传送信息

    +   - CPU同时访问四个模块，由存储器控制部件控制它们分时使用数据总线进行信息的传递


