  md: '# 5.1 CPU的功能和组成


    # 1、CPU的功能


    取指令 → 操作控制、时间控制 → 执行指令


    +   - 指令控制（程序的顺序控制）

    +   - 操作控制（一条指令有若干操作信号实现）

    +   - 时间控制（指令各个操作实施时间的定时）

    +   - 数据加工（算术运算和逻辑运算）


