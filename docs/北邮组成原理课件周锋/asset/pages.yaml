  md: '# 交叉方式


    +   - 设存储器容量为32字，分成四个模块

    +   - 线性地址0、1、2、3依次分配给M0、M1、M2、M3，……

    +   - 地址寄存器5位，低2位选择模块，而高3位选择模块中的字


    特点：


    +   - 地址码的低位字段选择不同的模块，高位字段确定相应模块内的存储字

    +   - 连续地址分布在相邻的不同模块内，同一个模块内的地址都是不连续的

    +   - 对连续字的成块传送可实现多模块流水式并行存取，大大提高存储器的带宽


