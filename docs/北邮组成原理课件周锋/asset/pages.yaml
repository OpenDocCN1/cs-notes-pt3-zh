- pgno: 147
  md: "# # 分析进位链逻辑\n\n+   - 加法器进位链的基本逻辑关系  \n+     \\( C_{i+1} = A_i B_i + (A_i \\\
    oplus B_i) C_i \\)\n\n+   - 令 \\( G_i = A_i B_i \\) 为进位产生函数（本地进位）  \n+     \\\
    ( P_i = A_i \\oplus B_i \\) 为进位传递函数（进位条件）  \n+     即：\\( P_i C_i \\) 为传送进位或条件进位\
    \  \n+     于是，\\( C_{i+1} = G_i + P_i C_i \\)\n\n+   - 只有当 \\( A_i = B_i = 1 \\\
    ) 时，本位才向高位进位\n\n+   - 当 \\( A_i \\neq B_i \\) 时，低一位的进位将向更高位传送\n\n+   - 传送进位和本地进位不可能同时为1"
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # 进位产生和传递函数


    C\(_{i+1} = G_i + P_iC_i = G_i + P_i(G_{i-1} + P_{i-1}C_{i-1})\)


    C\(_1 = G_0 + P_0C_0\)


    C\(_2 = G_1 + P_1C_1 = G_1 + P_1G_0 + P_1P_0C_0\)


    C\(_3 = G_2 + P_2G_1 + P_2P_1G_0 + P_2P_1P_0C_0\)


    ......


    +   - 依此公式递推，所有进位均可从最低进位C\(_0\)直接求得而无需等待低一位进位

    +   - 对任意i，均可得到只含G\(_k\)、P\(_k\)（k=0~i）以及C\(_0\)的C\(_{i+1}\)的表达式

    +   - 先行进位逻辑的总时间延迟为5T = (3T+2T)


    每级与门或或门的延迟为T，每级异或门延迟3T'
  merge: -1
