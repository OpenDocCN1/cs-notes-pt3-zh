- pgno: 71
  md: '# # 反码表示法（3）


    # ## 定点小数


    +   - 负数求补码和反码公式的比较


    [x]_反 = (2 - 2^{-n}) + x


    [x]_补 = 2 + x = [x]_反 + 2^{-n}


    +   - 结论：对一个负数求补码，其方法是符号位置为1，其余各位求反，然后在最末位上加1。也就是说，负数的补码等于其反码加1。


    # ## 0的反码


    +   - [+0]_反 = 00000000


    +   - [-0]_反 = 11111111'
