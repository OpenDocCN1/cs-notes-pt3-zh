  md: '# # 阶的移码表示


    +   - IEEE 754中，浮点数的阶E采用移码表示

    +   - 移码：规格化数，在真正的阶e上加一个规定的值

    +     - 对单精度浮点数： \( E = e + \text{Bias} = e + 127 \)

    +     - 对双精度浮点数： \( E = e + \text{Bias} = e + 1023 \)

    +   - 最小的阶： \( 00000001_2 \) （单精度）

    +   - 最大的阶： \( 11111110_2 \) （单精度）

    +   - 例如：\( 1.0 \times 2^{-1} \) 在机器中的表示如下：


    | 0 | 0111 1110 | 0000 0000 0000 0000 0000 000 |


    真值计算： \( (-1)^S \times (1 + \text{Frac}) \times 2^{(E - \text{Bias})} \)'
