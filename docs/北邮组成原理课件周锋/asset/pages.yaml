- pgno: 595
  md: '# 6.3 总线的仲裁


    并行竞争分布式裁决


    总线上的每个主控设备都有一个唯一的仲裁号。仲裁号越大的设备优先级越高。每个主控设备都有自己的仲裁电路。当一个主控设备需要使用总线时，就把自己的仲裁号通过仲裁电路送到总线上。


    +   - 如果同时有两个或多个主控设备请求总线，则只有仲裁号最大的设备的仲裁号能够建立在仲裁线上。

    +   - 每个发出仲裁号的设备从仲裁线上读入仲裁号，如果与自己的仲裁号相同就赢得了总线使用权。

    +   - N条仲裁线可表示2^N个优先级。'
  merge: -1
  img_proc: true
