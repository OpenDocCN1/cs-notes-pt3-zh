  md: '# 2、有关概念


    +   - 分辨率：显示器所能显示的像素个数。像素越密，分辨率越高，图象越清晰。它取决于显像管荧光粉的粒度，荧光屏的尺寸以及CRT电子束的聚焦能力。

    +   - 灰度级：像素点的亮暗差别（黑白）颜色的不同（彩色）。灰度级越多，图象层次越清楚越逼真。它取决于每个像素对应的刷新存储器的位数以及CRT本身的性能。'
