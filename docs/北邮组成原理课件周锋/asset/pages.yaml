- pgno: 874
  md: '# 5.7.1并行处理技术


    +   - 并行性概念

    +     - 问题中具有可以同时进行运算或操作特性


    +   - （狭义）含义

    +     - 在相同时延的条件下，用n位运算器进行n位并行运算速度几乎是一位运算器进行n位串行运算的n倍


    +   - （广义）含义

    +     - 只要在同一时刻（同时性）或在同一时间间隔内（并发性）完成两种或两种以上性质相同或不同的工作，他们在时间上相互重叠，都体现了并行性'
  merge: -1
  img_proc: true
- pgno: 875
  md: '# 5.7.1并行处理技术


    并行的三种形式


    +   - 时间并行（重叠）：让多个处理过程在时间上相互错开，轮流使用同一套硬件设备的各个部件，以加快硬件周转而赢得速度，实现方式就是采用流水处理部件


    +   - 空间并行（资源重复）：以数量取胜


    +     - 它能真正的体现同时性


    +     - LSI和VLSI为其提供了技术保证


    +   - 时间+空间并行


    +     - Pentium中采用了超标量流水线技术'
  merge: -1
  img_proc: true
- pgno: 876
  md: '# 5.7.1并行处理技术


    1、提高并行性的两个渠道：


    +   ◆ 空间并行性：增加冗余部件，如增加多操作部件处理机和超标量处理机


    +   ◆ 时间并行性：改善操作流程如：流水线技术'
  merge: -1
