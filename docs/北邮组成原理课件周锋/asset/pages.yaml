- pgno: 416
  md: '# 9. 堆栈寻址


    堆栈是一块能存储数据的存储区域，且数据的存取一般只能通过栈顶进行，其特点是“后进先出”，即：LIFO


    ![](img/3c43175b8c1aba80647f801257e6a5e9_416_0.png)'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# 堆栈类型


    +   - 寄存器堆栈

    +     - 存储区域用若干个寄存器组成

    +   - 存储器堆栈

    +     - 存储区域是主存的一部分区域


    ![](img/3c43175b8c1aba80647f801257e6a5e9_417_0.png)'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 寄存器堆栈


    +   - CPU中有一组专门的寄存器，有16个或更多，它们称为串联堆栈，其中每一个寄存器能保存一个字的数据

    +   - 数据的进出是通过栈顶实现的

    +   - CPU通过“进栈”指令把数据送入堆栈，而通过“出栈”指令把数据从堆栈中取出

    +   - 特点

    +     - 入栈和出栈时，栈顶不变，数据移动

    +     - 访问速度快

    +     - 缺点：

    +       - 寄存器的数目有限，所以堆栈大小受限

    +       - 数据的读出是破坏性的'
  merge: -1
  img_proc: true
