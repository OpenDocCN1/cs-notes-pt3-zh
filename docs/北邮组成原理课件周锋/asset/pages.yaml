- pgno: 982
  md: '# 13.4 位置指针与文件定位


    +   1. 用法： int fseek(FILE *stream, 位移量, 参照点);


    +   2. 功能：将指定文件的位置指针，从参照点开始，移动指定的字节数（位移量）。


    +   （1）参照点（3种取值）：

    +   SEEK_SET ——值为0，表示文件头

    +   SEEK_CUR ——值为1，表示当前位置

    +   SEEK_END ——值为2，表示文件尾


    （2）位移量：以参照点为起点，向文件尾方向（位移量>0）或文件头方向（位移量<0）移动的字节数。在ANSI C标准中，要求位移量为long int型数据。


    ```

    fseek(fPtr,10, SEEK_SET)

    ```


    ![](img/3c43175b8c1aba80647f801257e6a5e9_982_0.png)'
