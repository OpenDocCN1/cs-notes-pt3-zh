- pgno: 51
  md: '# # 计算机系统的层次结构


    +   第1级为微程序（或硬布线）级M₁。是一个实际机器层，由硬件直接执行微指令。


    +   第2级为一般机器级M₂。也是一个实际机器层，也称为传统机器级。用M₁的微程序解释并执行每一条机器指令（或硬件直接执行机器指令），即在M₂上直接执行机器语言程序


    +   第3级为操作系统级M₃。用于对计算机系统的软硬件资源进行管理和调度。用M₂的机器语言解释操作系统程序。


    +   第4级为汇编语言级M₄。汇编语言是为了便于编写和阅读程序而设计的语言。用汇编程序翻译成机器语言和操作系统程序广义指令（系统调用）。


    +   第5级为高级语言级M₅。用编译程序翻译成M₄的汇编语言程序。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_51_0.png)


    计算机学院 体系结构中心'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # 推广至n 多层计算机


    第n层 虚拟机Mn，其机器语言为Ln


    第4层 虚拟机M4，其机器语言为L4


    第3层 虚拟机M3，其机器语言为L3


    第2层 虚拟机M2，其机器语言为L2


    第1层 实际的计算机M1，其机器语言为L1


    用Ln编写的程序需经运行在更低级别的机器上的解释器解释执行，或翻译成更低级别机器上语言后执行


    用L3编写的程序需经运行在M2或M1上的解释器解释执行，或翻译成L2或L1语言后执行


    用L2编写的程序需经运行在M1上的解释器解释执行或翻译成L1语言后执行


    用L1编写的程序可直接由电子电路执行


    计算机学院 体系结构中心'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # 软件与硬件的逻辑等价性


    +   - 硬件 – 能实现高速的算术逻辑运算功能，但难以实现较复杂的功能或实现的代价太高。

    +   - 软件 – 易于实现各种复杂的算术逻辑运算功能，但是频繁的访存操作制约了处理速度。

    +   - 从使用者角度看，软件和硬件在功能上是等价的，即理论上讲，任何软件算法都可以用硬件实现，反之亦然

    +   - 对于某一具体功能，采用硬件方案还是软件方案，取决于设计目标、技术水平、器件价格、速度、可靠性、易维护性和变更周期等因素


    |    | 器件价格 | 速度 | 易维护性 | 变更周期 |

    |---|---|---|---|---|

    | 硬件 | 高    | 快   | 低    | 长    |

    | 软件 | 低    | 慢   | 高    | 短    |'
  merge: -1
  img_proc: true
