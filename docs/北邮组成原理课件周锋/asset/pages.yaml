- pgno: 1080
  md: '# 运算器组成实验电路分析


    控制存储器由5片58C65组成。58C65是一种8K×8位的E2PROM器件，TEC-8使用其中64个字节作为控制存储器，微地址μA5~μA0。


    微地址寄存器μAR由D触发器74LS174LS组成。当按下复位按钮CLR时，产生的信号CLR#(负脉冲)使微地址寄存器复位，μA5~μA0为00H，在一条微指令结束时，用T3的下降沿将微地址转移逻辑产生的下条微指令地址NμA5、NμA4-T~NμA0-T写入微地址寄存器。


    微地址转移逻辑由若干与门和或门组成，实现“与~或”逻辑。'
  merge: -1
  img_proc: true
