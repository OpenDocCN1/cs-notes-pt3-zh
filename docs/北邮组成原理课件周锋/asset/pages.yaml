- pgno: 497
  md: '# 五、启停控制逻辑


    +   - 启动、停机是随机的，对读/写时序信号也需要由启停逻辑加以控制。

    +   - 当运行触发器为 “1”时，打开时序电路。当计算机启动时，一定 要从第1个节拍脉冲前沿开始工作。

    +   - 当运行触发器 “0”时，关闭时序产生器。停机时一定要在第4个节拍脉冲结束后关闭时序产生器。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_497_0.png)'
