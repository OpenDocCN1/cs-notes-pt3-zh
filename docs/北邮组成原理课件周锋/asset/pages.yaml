- pgno: 115
  md: '# # 汉字的表示方法（3）


    # ## 汉字机内码（内码）


    +   - 用于在计算机内部存储汉字而设计的一种2字节编码。为了避免ASCII码和国标码一起使用时产生二义性问题，把国标码每个字节的最高位置1，用以区别7位ASCII码，称为汉字机内码


    汉字机内码、国标码和区位码三者之间的关系为：

    区位码（十六进制）的两个字节分别加20H得到对应的国标码；

    汉字交换码（国标码）的两个字节分别加80H得到对应的机内码；'
