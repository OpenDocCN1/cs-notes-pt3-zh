- pgno: 978
  md: '文件中有一个“文件位置指针”，指向下一次读写操作所在字节的相对值。每当读写完一个文件数据后，系统自动将文件位置指针移动到下一个读写位置上。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_978_0.png)


    打开文件时位置指针的起始位置与打开文件的方式有关


    +   - 以“r”、“w”方式打开文件，位置指针指向文件头

    +   - 以“a”方式打开文件，位置指针指向文件尾


    所以文件位置指针并不是真正意义上的指针(变量地址)！'
