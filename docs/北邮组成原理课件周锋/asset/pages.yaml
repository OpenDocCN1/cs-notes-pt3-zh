- pgno: 886
  md: '# 流水线的实现


    一条指令最多需要以下5个时钟周期：


    +   取指令周期（IF）

    +     IR ← Mem[PC]

    +     NPC ← PC+4


    +   指令译码/读寄存器周期（ID）

    +     A ← Regs[rs]

    +     B ← Regs[rt]

    +     Imm ← （（IR₁₆）¹⁶##IR₁₆..₃₁）


    指令的译码操作和读寄存器操作是并行进行的。


    原因：在指令格式中，操作码字段以及rs、rt字段都是在固定的位置。


    这种技术称为固定字段译码技术。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_886_0.png)'
  merge: -1
  img_proc: true
- pgno: 887
  md: '# 流水线的实现


    ◆ 执行/有效地址计算周期（EX）


    不同指令所进行的操作不同：


    +   - 存储器访问指令

    +     `ALU0←A + Imm`


    +   - 寄存器－寄存器ALU指令

    +     `ALU0←A func B`


    +   - 寄存器－立即值ALU指令

    +     `ALU0←A op Imm`


    +   - 分支指令

    +     `ALU0←NPC+（Imm<<2）；`

    +     `cond←（A == 0）`


    ![](img/3c43175b8c1aba80647f801257e6a5e9_887_0.png)'
  merge: -1
  img_proc: true
- pgno: 888
  md: '# 流水线的实现


    存储器访问/分支完成周期（MEM）


    +   所有指令都要在该周期对PC进行更新。

    +   除了分支指令，其他指令都是做PC←NPC


    +   在该周期内处理的指令仅仅有load、store和分支三种指令。


    +   存储器访问指令

    +   LMD←Mem[ALUo] 或者 Mem[ALUo]←B


    +   分支指令

    +   if (cond) PC ←ALUo else PC←NPC'
  merge: -1
  img_proc: true
- pgno: 889
  md: '# 流水线的实现


    # 写回周期（WB）


    不同的指令在写回周期完成的工作也不一样。


    +   - 寄存器—寄存器ALU指令

    +     Regs[rd] ← ALUo

    +   - 寄存器—立即数ALU指令

    +     Regs[rt] ← ALUo

    +   - load指令

    +     Regs[rt] ← LMD'
