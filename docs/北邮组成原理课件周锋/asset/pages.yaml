- pgno: 146
  md: "# # n位行波进位加法器的时间延迟\n\n考虑溢出检测， n位的行波进位加法器的时间延迟  \nn = 2时  \n\\( t_a = 3T + 3T\
    \ + 2T + 2T + 3T \\)  \n\\( = 6T + 2 \\cdot 2T + 3T \\)  \n\nn位时： \\( t_a = 3T\
    \ + 3T + n \\cdot 2T + 3T = (2n + 9)T \\)  \n\n其中T为单级逻辑电路的单位门延迟，每级异或门延迟3T\n\n\
    不考虑溢出检测时， n位的行波进位加法器的时间延迟  \n\\( t_a = 3T + 3T + 2T + 3T \\)  \n\\( = 3T + 3T\
    \ + (n - 1)2T + 3T = 2(n - 1)T + 9T \\)"
  merge: -1
