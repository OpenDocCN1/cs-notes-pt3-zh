- pgno: 504
  md: '# 5.4.1微程序控制原理


    +   1. 微命令：控制部件向执行部件发出的各种控制命令叫作微命令，它是构成控制序列的最小单位。

    +      - 例如：打开或关闭某个控制门的电位信号、某个寄存器的打入脉冲等。

    +      - 微命令是控制计算机各部件完成某个基本微操作的命令。


    +   2. 微操作：是微命令的操作过程。

    +      - 微命令和微操作是一一对应的。

    +      - 微命令是微操作的控制信号，微操作是微命令的操作过程。

    +      - 微操作是执行部件中最基本的操作。'
  merge: -1
  img_proc: true
