- pgno: 125
  md: "# # 加法与减法运算\n\n# ## 补码加法公式\n\n整数  \n\\([x]_\\text{补} + [y]_\\text{补} = [x+y]_\\\
    text{补} \\quad (\\text{mod } 2^{n+1})\\)\n\n小数  \n\\([x]_\\text{补} + [y]_\\text{补}\
    \ = [x+y]_\\text{补} \\quad (\\text{mod } 2)\\)\n\n# ## 补码减法公式\n\n整数  \n\\([x]_\\\
    text{补} - [y]_\\text{补} = [x]_\\text{补} + [-y]_\\text{补} = [x-y]_\\text{补} \\\
    quad (\\text{mod } 2^{n+1})\\)\n\n小数  \n\\([x]_\\text{补} - [y]_\\text{补} = [x]_\\\
    text{补} + [-y]_\\text{补} = [x-y]_\\text{补} \\quad (\\text{mod } 2)\\)"
  merge: -1
  img_proc: true
- pgno: 126
  md: '# # 证明[x]补+[y]补=[x+y]补（1）


    +   - 假设 | x | < 1, | y | < 1, | x + y | < 1

    +   - 现分四种情况来证明

    +     (1) x > 0, y > 0，则 x + y > 0

    +       [ x ]补=x， [ y ]补=y， [ x + y ]补=x+y

    +       所以等式成立。

    +     (2) x > 0， y < 0，则 x + y > 0 或 x + y < 0

    +       [ x ]补=x， [ y ]补=2+y，

    +       [ x ]补+[ y ]补=x+ 2+y

    +       当 x + y > 0 时， 2 + ( x + y ) > 2，进位2必丢失，又因 ( x + y ) > 0

    +       故 [ x ]补+[ y ]补 = x + y = [ x + y ]补

    +       当 x + y < 0 时， 2 + ( x + y ) < 2， 又因 ( x + y ) < 0，

    +       故 [ x ]补+[ y ]补 = 2 + ( x + y ) = [ x + y ]补

    +       所以上式成立'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# # 证明 \([x]_\text{补} + [y]_\text{补} = [x+y]_\text{补}\) （2）


    (3) \(r<0, y>0\)，则 \(r+y>0\) 或 \(r+y<0\)


    这种情况和第2种情况一样，把 \(r\) 和 \(y\) 的位置对调即得证。


    (4) \(r<0\)，\(y<0\)，则 \(r+y<0\)


    相加两数都是负数，则其和也一定是负数。


    \(\therefore [x]_\text{补} = 2 + x\), \([y]_\text{补} = 2 + y\)


    \(\therefore [x]_\text{补} + [y]_\text{补} = 2 + x + 2 + y = \text{2} + (2 + x +
    y)\)


    上式右边分为 “2” 和 \((2 + x + y)\) 两部分。既然 \((x + y)\) 是负数，而其绝对值又小于 1，那么 \((2 + x + y)\)
    就一定是小于 2 而大于 1 的数，进位 “2” 必丢失。又因 \((x + y)<0\)，所以 \([x]_\text{补} + [y]_\text{补}
    = 2 + (x + y) = [x+y]_\text{补}\)'
  merge: -1
