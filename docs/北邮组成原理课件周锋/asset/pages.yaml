  md: '# # 原码除法运算原理


    # ## 设有n位定点小数（定点整数也适用）


    被除数X，其原码为 \([x]_原 = x_f x_{n-1} \cdots x_1 x_0\)


    除数y，其原码为 \([y]_原 = y_f y_{n-1} \cdots y_1 y_0\)


    则其商 \(q = x \div y\)，其原码为


    \([q]_原 = (x_f \oplus y_f) + (0.x_{n-1} \cdots x_1 x_0 \div 0.y_{n-1} \cdots y_1
    y_0)\)'
