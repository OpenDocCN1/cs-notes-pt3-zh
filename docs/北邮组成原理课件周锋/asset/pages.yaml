  md: '# 6.2 总线接口


    # 一、信息的传送方式


    ◆ 计算机系统中，传输信息基本有三种方式：


    +   ◆ 串行传送

    +   ◆ 并行传送

    +   ◆ 分时传送


    ◆ 出于速度和效率上的考虑，系统总线上传送的信息必须采用并行传送方式。分时传送即总线的分时复用。


