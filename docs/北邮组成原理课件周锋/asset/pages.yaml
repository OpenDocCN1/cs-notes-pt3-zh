  md: '# 3.1.2 存储器分级结构


    2、分级结构


    根据局部性原理采用分级存储器结构


    +   - 高速缓冲存储器简称cache，它是计算机系统中的一个高速小容量半导体存储器。


    +   - 主存储器简称主存，是计算机系统的主要存储器，用来存放计算机运行期间的大量程序和数据。


    +   - 外存储器简称外存，它是大容量辅助存储器。


