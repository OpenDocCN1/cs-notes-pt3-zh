- pgno: 753
  md: '例5 设存储器容量为32字，字长64位，模块数m=4，分别用顺序方式和交叉方式进行组织。存储周期T=200ns，数据总线宽度为64位，总线传送周期=50ns。若连续读出4个字，问顺序存储器和交叉存储器的带宽各是多少？


    解：顺序存储器和交叉存储器连续读出m=4个字的信息总量都是：


    q=64b×4=256b


    顺序存储器和交叉存储器连续读出4个字所需的时间分别是：


    t₂=mT=4×200ns=800ns=8×10⁻⁷s


    t₁=T+(m-1)=200ns+(4-1)×50ns=350ns=35×10⁻⁷s


    顺序存储器和交叉存储器的带宽分别是：


    W₂=q/t₂=256b÷(8×10⁻⁷)s=320Mb/s


    W₁=q/t₁=256b÷(35×10⁻⁷)s=730Mb/s'
  merge: -1
  img_proc: true
