- pgno: 516
  md: '# 5.4.1微程序控制原理


    +   - 微指令寄存器(μIR)

    +     - 用来存放从μCM取出的正在执行的微指令，它的位数同微指令字长相等。

    +   - 微地址形成部件

    +     - 用来产生初始微地址和后继微地址，以保证微指令的连续执行。

    +   - 微地址寄存器(μMAR)

    +     - 它接受微地址形成部件送来的微地址，为下一步从μCM中读取微指令作准备。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_516_0.png)'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# 5.4.1微程序控制原理


    ◆微程序控制器的工作过程


    (1)执行取指令的公共操作。取指令的公共操作通常由一段取指微程序来完成，在机器开始运行时，自动将取指微程序的入口微地址送μMAR，并从μCM中读出相应的微指令送入μIR。微指令的操作控制字段产生有关的微命令，用来控制实现取机器指令的公共操作。取指微程序的入口地址一般为μCM的0号单元，当取指微程序执行完后，从主存中取出的机器指令就已存入指令寄存器IR中了。


    (2)由机器指令的操作码字段通过微地址形成部件产生出该机器指令所对应的微程序的入口地址，并送入μMA


    (3)从μCM中逐条取出对应的微指令并执行之，每条微指令都能自动产生下一条微指令的地址。'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# 5.4.1 微程序控制原理


    （4）一条机器指令对应的微程序的最后一条微指令执行完毕后，其下一条微指令地址又回到取指微程序的入口地址，从而继续第(1)步，以完成取下条机器指令的公共操作。


    +   - 以上是一条机器指令的执行过程，如此周而复始，直到整个程序的所有机器指令执行完毕。


