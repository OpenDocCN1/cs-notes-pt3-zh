  md: "# # 浮点数的表示方法（1）\n\n+   - 任意一个十进制数N可以表示成  \n+     \\( N = M \\times 10^E \\\
    )\n\n+   - 一个任意进制数N可以表示成  \n+     \\( N = M \\times R^E \\)\n\n其中，M称为浮点数的尾数，是一个纯小数；E是比例因子的指数，称为浮点数的指数，是一个整数；R为比例因子的基数，在二进制机器中通常规定R为2，8或16\n\
    \n+   - 数的小数点位置随比例因子的不同而在一定范围内可以自由浮动，这种表示法称为浮点表示法\n\n![](img/3c43175b8c1aba80647f801257e6a5e9_88_0.png)"
  merge: -1
