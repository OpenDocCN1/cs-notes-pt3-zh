- pgno: 574
  md: '# 6.1 总线的概念和结构形态


    现代总线结构特点：


    +   - 与处理器无关，通用性强。

    +   - 由地址线、数据线、控制线组成。其结构与简单总线相似，但一般是32条地址线，32或64条数据线。为了减少布线，64位数据的低32位数据线常常和地址线采用多路复用方式。

    +   - 仲裁总线：包括总线请求线和总线授权线。

    +   - 中断和同步总线：用于处理带优先级的中断操作，包括中断请求线和中断认可线。

    +   - 公用线：包括时钟信号线、电源线、地线、系统复位线以及加电或断电的时序信号线等。'
