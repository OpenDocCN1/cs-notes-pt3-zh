- pgno: 807
  md: '# 3.7.3段式虚拟存储器


    # 段式虚拟存储器的优缺点


    +   ◆ 段的分界与程序的自然分界相对应；

    +   ◆ 易于编译、管理、修改和保护，便于多道程序共享；

    +   ◆ 段长动态可变；

    +   ◆ 段长各不相同，起点、终点不定；

    +   ◆ 空间分配困难，容易产生碎片。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_807_0.png)'
  merge: -1
  img_proc: true
- pgno: 808
  md: '# 3.7.4段页式虚拟存储器


    ○是前两种方法结合，它先把程序按逻辑单位分为段，再把每段分成固定大小的页。


    +   - 操作系统对主存的调入调出是按页面进行的，但它又可以按段实现共享和保护，可以兼取页式和段式系统的优点

    +   - 缺点是需要在地址映射过程中多次查表。其地址映射通过一个段表和一组页表来进行。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_808_0.png)'
  merge: -1
  img_proc: true
- pgno: 809
  md: '# 3.7.4段页式虚拟存储器


    在段页式虚拟存储系统中，每道程序是通过一个段表和一组页表来进行定位的。段表中的每个表目对应一个段，每个表目有一个指向该段的页表起始地址及该段的控制保护信息。由页表指明该段各页在主存中的位置以及是否已装入、已修改等状态信息。如果有多个用户在机器上运行，多道程序的每一道需要一个基号,由它指明该道程序的段表起始地址。


    基号 +段号 +页号 +页内地址'
