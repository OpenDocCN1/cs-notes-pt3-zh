- pgno: 243
  md: '# # 多级存储体系的组成


    +   - 外存的引入主要是为解决存储容量的要求

    +   - cache的引入更主要地是要解决速度要求

    +   - 二者的出发点都是提高存储系统的性能-价格比。——“多快好省”

    +   - 整个存储系统在速度上接近cache，而在容量和价格上接近外存。


    +   - 一级（L1）cache + 二级（L2）cache

    +   - 指令cache（I-cache） + 数据cache（D-cache）'
