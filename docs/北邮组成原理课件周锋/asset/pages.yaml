- pgno: 326
  md: '# 举例（2）


    解：根据给定条件，选用EPROM：8K×8位芯片1片。SRAM：8K×8位芯片3片，2K×8位芯片1片。


    地址区间：


    0 - 8191 = 0000 0000 0000 0000 - 0001 1111 1111 1111


    8192 - 32767 = 0010 0000 0000 0000 - 0111 1111 1111 1111


    63488 - 65535 = 1111 1000 0000 0000 - 1111 1111 1111 1111


