- pgno: 66
  md: '# # 补码表示法（1）


    # ## 定点小数


    # ### 定义


    [x]_补 = \begin{cases} x & 1 > x \geq 0 \\ 2 + x = 2 - |x| & 0 \geq x \geq -1 \end{cases}
    \quad (\text{mod } 2)


    # ### 举例


    x = +0.1011 \longrightarrow [x]_补 = 0.1011


    x = -0.1011 \longrightarrow


    [x]_补 = 10 + x = 10 - 0.1011 = 1.0101'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # 补码表示法（2）


    # ## 定点整数


    | X₀ | X₁ | X₂ | ... | Xₙ₋₁ | Xₙ |

    |---|---|---|---|---|---|


    # ### 定义


    [x]_补 = \begin{cases} x & 2^n > x \geq 0 \\ 2^{n+1} + x = 2^{n+1} - |x| & 0 \geq
    x \geq -2^n \end{cases} \quad (\text{mod } 2^{n+1})


    # ### 举例


    x = +0111001 ⟶ [x]_补 = 00111001


    x = -0111001 ⟶


    [x]_补 = 100000000 + x = 100000000 - 0111001 = 11000111'
  merge: -1
