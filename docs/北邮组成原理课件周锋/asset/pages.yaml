- pgno: 1065
  md: '# 双端口存储器实验电路分析


    +   - **IDT7132**的左右两个端口有独立的总线及控制信号：CE#、R/W#和OE#。左端口为读、写端口，当MEMW为1时，在T2上升沿将DBUS上的D₇~₀写入AR₇~₀指定的存储单元；当MBUS信号为1时，指定的存储单元的数送DBUS；右端口为只读方式，从PC₇~₀指定的存储单元读出指令INS₇~₀，送往指令寄存器IR。

    +   - 程序计数器PC由2片**GAL22V10**组成。向RAM的右端口提供存储器地址。当信号LPC为1时，在T3的上升沿，将DBUS上的数D₇~₀写入PC；当信号PCINC为1时，在T3的上升沿，PC加1；当PCADD信号为1时，PC和IR中的转移偏量相加，在T3的上升沿，将相加得到的和写入PC。

    +   - 地址寄存器AR由1片**GAL22V10**组成，向RAM的左端口提供存储器地址AR₇~₀。当信号LAR为1时，在T3的上升沿，数据总线上的数D₇~₀写入AR。当信号ARINC为1时，在T3的上升沿，完成AR加1。'
  merge: -1
  img_proc: true
