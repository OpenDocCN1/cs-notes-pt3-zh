- pgno: 321
  md: '# 光擦可编程只读存储器—编程与读出


    **工作原理：** 存储单元为 MOSFET＋浮空栅，浮空栅被氧化层包裹隔离，可利用雪崩注入（Avalanche Injection）效应向其注入电荷。未注入电荷时存储单元为1，注入负电荷后为0。


    **编程：** 在漏、源极加高压（如＋20V）、控制栅极加高压正脉冲（如50 ms宽、20V）后，电子获得能量变热，穿过氧化层进入浮栅，注入负电荷可长期保存。


    **读出：** 凡注入负电荷的单元，其开启电压 $V_T$ 变高，因此，在正常＋5V电压下不能使其导通。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_321_0.png)


    ![](img/3c43175b8c1aba80647f801257e6a5e9_321_1.png)'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 光擦可编程只读存储器-擦除


    +   - 这种EPROM做成的片子封装上方有一个石英玻璃窗口。

    +   - 在强紫外线光照射下，使氧化层变得具有导电性，且浮栅上的电子变得更活跃，从而穿过氧化层回到衬底中，使电路恢复起始状态，即把原先写入的“0”信息擦去。

    +   - 擦除过程是对所有存储单元进行的。不能实现选择性的擦除。


