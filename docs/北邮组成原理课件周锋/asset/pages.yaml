- pgno: 461
  md: '# 4、操作控制器和时序产生器


    # ② 微程序控制器


    微程序控制器是采用存储逻辑来实现的，也就是把微操作信号代码化，使每条机器指令转化为一段微程序并存入一个专门的存储器(控制存储器)中，微操作控制信号由微指令产生。


    微程序控制器的设计思想和组合逻辑设计思想截然不同。它具有设计规整、调试、维修以及更改、扩充指令方便的优点，易于实现自动化。但是，由于它增加了一级控制存储器，所以指令执行速度比组合逻辑控制器慢。


    # ③ 组合逻辑和存储逻辑结合型


    前两种的综合'
