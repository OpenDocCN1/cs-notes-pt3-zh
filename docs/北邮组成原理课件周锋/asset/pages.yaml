    | 典型指令 | 指令助记符 | 二进制操作码 |

    |---|---|---|

    | 加法 | ADD | 001 |

    | 减法 | SUB | 010 |

    | 传送 | MOV | 011 |

    | 跳转 | JMP | 100 |

    | 转子 | JSR | 101 |

    | 存储 | STR | 110 |

    | 读数 | LDA | 111 |


    注意：在不同的计算机中，指令助记符的规定是不一样的。把人认识的指令助记符转换成与之对应的二进制码后机器才能“理解”。这种转换借助汇编程序自动完成，汇编程序相当于一个“翻译”'
