  md: '# 7.2磁盘存储设备


    # 二、磁盘上信息的分布（磁盘信息记录格式）


    +   1、记录面（磁头）：盘片的上下两面都能记录信息，通常把磁盘片表面称为记录面。

    +   2、磁道：记录面上一系列同心圆称为磁道。每个盘片表面通常有几百到几千个磁道。

    +   3、扇区：每个磁道又分为若干个扇区，通常是一次存取操作信息最小单位。需要注意一点是外面扇区比里面扇区面积要大。

    +   4、柱面：多个磁头，相同磁道号构成磁柱面。'
