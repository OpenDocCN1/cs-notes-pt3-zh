- pgno: 821
  md: '# 3.7.6虚拟存储器实例


    +   ○ Pentium的虚地址模式（保护模式）

    +   ◆ MMU(存储管理部件)分为SU和PU两部分

    +     ✦ SU：分段管理部件

    +     ✦ PU：分页管理部件

    +   ◆ 三种模式

    +     ✦ 分段不分页（64TB）

    +       ‡ 虚拟地址：16位的段地址 + 32位的段内地址

    +       ‡ 虚拟空间：

    +       ‡ 优点：无需访问页目录，地址转换速度快 = 2^46 = 64TB

    +       ‡ 由SU将虚拟地址变成32位的物理地址


    （段地址的最低两位用来做保护用）'
  merge: -1
  img_proc: true
