- pgno: 340
  md: '# 闪存的工作方式


    +   - 上电后，芯片内部的状态机使器件处于读出操作状态

    +   - 在读出状态下，闪存的读出操作与其他的各种ROM芯片相同。

    +   - 只有在执行了特定的命令序列之后，才可进入其它状态，进行芯片擦除、区块擦除、编程写入、软件数据保护或者读标识码等操作。

    +   - 为防止状态机的误动作，闪存的各种命令是以向特定地址写入特定内容的“命令序列”方式定义的。'
  merge: -1
