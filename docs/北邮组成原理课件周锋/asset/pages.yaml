- pgno: 501
  md: '# 5.4 微程序控制器


    # 发展


    +   - 微程序的概念和原理是由英国剑桥大学的M·V·Wilkes威尔克斯教授于1951年在曼彻斯特大学计算机会议上首先提出来的，当时还没有合适的存放微程序的控制存储器的元件。

    +   - 到1964年，IBM公司在IBM 360系列机上成功地采用了微程序设计技术。

    +   - 20世纪70年代以来，由于VLSI技术的发展，推动了微程序设计技术的发展和应用。

    +   - 从大型机到小型机、微型机都采用了微程序设计技术。'
  merge: -1
  img_proc: true
