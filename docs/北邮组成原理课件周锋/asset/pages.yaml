- pgno: 376
  md: '# 基本概念


    +   - 指令字（简称指令）即表示一条指令的机器字

    +   - 指令格式则是指令字用二进制代码表示的结构形式

    +   - 指令的构成


    +   - 操作码字段：表示指令的操作特性与功能

    +   - 操作数地址字段：指定参与操作的操作数的地址


    ![](img/3c43175b8c1aba80647f801257e6a5e9_376_0.png)'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 操作码


    +   - 指令系统的每一条指令都有一个操作码，它表示该指令应进行什么样的操作

    +   - 操作码字段的位数一般取决于计算机指令系统的规模。例如：

    +     - 如果某指令系统只有8条指令，则用3位操作码就可表示

    +     - 如果有32条指令，那么就需要5位操作码

    +   - 对于一个机器的指令系统，指令字中操作码字段长度可以是固定的，也可以是变长的'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# 操作数地址


    按照一条指令中有几个操作数地址，可将该指令称为几操作数指令或几地址指令


    +   - 三地址指令格式

    +   - 二地址指令格式

    +   - 一地址指令格式

    +   - 零地址指令格式


