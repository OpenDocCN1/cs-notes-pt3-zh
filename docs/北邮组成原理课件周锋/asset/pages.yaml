- pgno: 1107
  md: '# TEC-8 模型计算机的中断机制


    TEC-8的中断系统只支持单级中断、单个中断请求，有中断屏蔽功能。系统有2条指令用于允许和屏蔽中断（DI关中断指令、EI开中断指令）。在时序发生器中，设置了一个允许中断触发器EN_INT
    (DI or !EI)，当它为1时，允许中断，当它为0时，禁止中断发生。复位脉冲CLR#使EN_INT复位为0。


    | T1 | T2 | T3 | W1 | W2 | W3 | INTQ |

    | MF | CLR# | QD | STOP | DP | INTEN | INTDI | INTP | SHORT | LONG |


    ![](img/3c43175b8c1aba80647f801257e6a5e9_1107_0.png)'
  merge: -1
  img_proc: true
