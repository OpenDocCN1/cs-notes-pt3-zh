- pgno: 1082
  md: '# 微指令格式


    | 微指令字段 | 含义 |

    |---|---|

    | `$N\mu A5^\sim N\mu A0$` | 下址，在微指令顺序执行的情况下，它是下一条微指令的地址 |

    | `P0` | =1时，根据后继微地址$N\mu A5^\sim N\mu A0$和模式开关SWC、SWB、SWA确定下一条微指令的地址。 |

    | `P1` | =1时，根据后继微地址$N\mu A5^\sim N\mu A0$和指令操作码IR7~IR4确定下一条微指令的地址。 |

    | `P2` | =1时，根据后继微地址$N\mu A5^\sim N\mu A0$和进位C确定下一条微指令的地址。 |

    | `P3` | =1时，根据后继微地址$N\mu A5^\sim N\mu A0$和结果为0标志Z确定下一条微指令的地址。 |

    | `P4` | =1时，根据后继微地址$N\mu A5^\sim N\mu A0$和中断信号INT确定下一条微指令的地址。模型计算机中，中断信号INT由时序发生器在接到中断请求信号后产生。
    |

    | `STOP` | =1时，在T3结束后时序发生器停止输出节拍脉冲T1、T2、T3。 |

    | `LIAR` | =1时，在T3的上升沿，将PC7~PC0写入中断地址寄存器IAR。 |

    | `INTD` | =1时，置允许中断标志（在时序发生器中）为0，禁止TEC-8模型计算机响应中断请求。 |

    | `INTEN` | =1时，置允许中断标志（在时序发生器中）为1，允许TEC-8模型计算机响应中断请求。 |

    | `IABUS` | =1时，将中断地址寄存器中的地址送数据总线DBUS。 |

    | `PCADD` | =1时，将当前的PC值加上相对转移量，生成新的PC。 |'
  merge: -1
  img_proc: true
