  md: '# 5.5 硬布线控制器


    # （3）微操作控制信号产生


    +   - 在微程序控制器中，微操作控制信号由微指令产生，并且可以重复使用。

    +   - 在硬联线控制器中，某一微操作控制信号由布尔代数表达式描述的输出函数产生。

    +   - 设计微操作控制信号的方法和过程是，根据所有机器指令流程图，寻找到产生同一个微操作信号的所有条件，并与适当的节拍电位和节拍脉冲组合，从而写出其布尔代数表达式并进行简化，然后用门电路或可编程器件来实现。'
