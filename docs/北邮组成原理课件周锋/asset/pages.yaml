  md: '文件控制块(FCB)是操作系统为管理文件而设置的数据结构，存放了为管理文件所需的所有有关信息（文件属性）。是文件存在的标志。操作系统要依靠FCB中的数据完成对文件的读或写操作。


    包含内容：文件名，文件号，用户名，文件地址，文件长度，文件类型，文件属性，共享计数，文件的建立日期，保存期限，最后修改日期，最后访问日期，口令，文件逻辑结构，文件物理结构等。'
