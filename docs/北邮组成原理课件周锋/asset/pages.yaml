- pgno: 728
  md: '# 8.5通道方式


    # 通道的种类


    +   - 选择通道

    +     - 选择通道每次只能从所连接的设备中选择一台I/O设备的通道程序，此刻该通道程序独占了整个通道。连接在选择通道上的若干设备，只能依次使用通道与主存传送数据

    +     - 数据传送以成组（数据块）方式进行，每次传送一个数据块，因此，传送速率很高。选择通道多适合于快速设备（磁盘），这些设备相邻字之间的传送空闲时间极短。'
  merge: -1
  img_proc: true
- pgno: 729
  md: '# 8.5 通道方式


    ◆ 字节多路通道（Byte Multiplexor Channel）


    +   ◆ 是一种简单的共享通道，在时间分割的基础上，服务于多台低速和中速面向字符的外围设备。


    +   ◆ 字节多路通道包括多个子通道，每个子通道服务于一个设备控制器，可以独立地执行通道指令。每个子通道都需要有字符缓冲寄存器、I/O 请求标志／控制寄存器、主存地址寄存器和字节计数寄存器。而所有子通道的控制部分是公共的，由所有子通道所共享。通常，每个通道的有关指令和参量存放在主存固定单元中。当通道在逻辑上与某一设备连通时，将这些指令和参量取出来，送入公共控制部分的寄存器中使用。


    +   ◆ 字节多路通道要求每种设备分时占用一个很短的时间片，不同的设备在各自分得的时间片内与通道建立传输连接，实现数据的传送。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_729_0.png)'
  merge: -1
  img_proc: true
