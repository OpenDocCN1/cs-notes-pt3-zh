- pgno: 691
  md: '# 8.3.1中断的概念、功能


    中断源：能够向CPU发出中断请求的事件。常见中断源有：


    +   - 输入、输出设备中断。如键盘、打印机等工作过程中已做好接收或发送准备。

    +   - 数据通道中断。如磁盘、磁带等要同主机进行数据交换等。

    +   - 实时时钟中断。

    +   - 故障中断。例如电源掉电、设备故障等要求CPU进行紧急处理等。

    +   - 系统中断。如运算过程出现溢出、数据格式非法，数据传送过程出现校验错，控制器遇到非法指令等等。

    +   - 为了调试程序而设置的中断。


