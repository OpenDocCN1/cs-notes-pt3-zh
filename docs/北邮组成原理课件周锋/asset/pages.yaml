- pgno: 1032
  md: '# 文件程序问题-文件读出来是乱码


    原因：用 `fprintf` 向二进制文件写记录，然后 `fread` 读。


    +   - `fprintf()` 函数，将指定的数据以“可读”的格式写入文件，与 `printf` 的输出格式相同。因此它只能用于写文本文件！书上例子 P358
    页的 `textfile()` 函数，清楚表明了这点，该函数从一个二进制文件 `fread` 读取“原始”格式的数据，然后以“可读”格式写入文本文件中。

    +   - “可读”格式就是 ASCII 字符形式。'
  merge: -1
  img_proc: true
- pgno: 1033
  md: '# 文件程序问题-对某些数据敏感


    二进制制文件读写记录时遇到11.99浮点数就发生错误，或添加到记录号为10以上的数据会出现乱码，如何避免？


    +   - 读取二进制数据文件的时候你应该用 `rb` 调用 fopen(), 确保不会发生文本文件的解释。类似的, 写二进制文件时, 使用 `wb`。否则,
    你的文件数据中某些数据都要被插入或减少一个字节。'
