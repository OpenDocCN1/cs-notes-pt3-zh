- pgno: 800
  md: '# 3.7.2页式虚拟存储器


    # ○TLB 设计问题


    +   ◆访问频繁:速度是第一位的


    +   ◆TLB 缺失将造成：


    +   流水线停止


    +   通知操作系统


    +   读页表


    +   将表项写入 TLB


    +   返回到用户程序


    +   重新访问


    +   ◆因此，应尽量减少缺失：


    +   多路组相连


    +   再尽量提高TLB的容量


