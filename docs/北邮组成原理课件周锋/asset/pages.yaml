- pgno: 664
  md: '# 7.6显示设备


    +   ○ 刷新：电子束打在荧光粉上引起的发光只能维持几十毫秒的时间。因此必须让电子束反复不断地扫描整个屏幕，该过程称为刷新。刷新频率越高，显示越没有闪烁。


    +   ○ 刷新存储器（视频存储器、显存、帧缓冲器）：为刷新提供信号的存储器。容量取决于分辨率和灰度级。如1024*768，32位真彩色，需要1024*768*32/8B=3MB，其存取周期必须满足刷新频率的要求。设上例中要求刷新频率为75Hz，则刷新存储器的总带宽为75*3MB/s=225MB/s'
