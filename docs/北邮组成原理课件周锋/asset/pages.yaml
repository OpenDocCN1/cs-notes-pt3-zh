- pgno: 401
  md: '# 操作数寻址方式


    +   - 形成操作数的有效地址的方法，称为操作数的寻址方式

    +   - 一种单地址指令的结构如下所示，其中用X，I，A各字段组成该指令的操作数地址


    | 操作码(OP) | 变址(X) | 间址(I) | 形式地址(A) |


    +   - 指令中操作数字段的地址码是由形式地址（也称偏移量）和寻址方式特征位等组合形成。  - 寻址过程就是把操作数的形式地址，变换为操作数的有效地址的过程'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# 1. 隐含寻址


    +   - 在指令中不显式给出而是隐含（默认）给出操作数的地址

    +   - 例如，一种单地址的指令格式，没有在地址字段中指明第2个操作数地址，而是默认累加寄存器AC作为第2个操作数地址，所以AC对单地址指令格式来说是隐含地址'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 2. 立即寻址


    +   - 指令的地址字段指出的不是操作数的地址，而是**操作数本身**。这种方式的特点是指令执行速度较快，取指令的同时就取到了操作数，不需要访问内存取操作数


    +   - 例如：单地址的移位指令格式为


    | OP | 操作数D |

    |---|---|


    +   - 地址字段不是操作数的地址，而是一个操作数


    ![](img/3c43175b8c1aba80647f801257e6a5e9_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# 3. 直接寻址


    +   - 在指令的地址字段中直接指出操作数在内存的地址A

    +   - 用直接寻址方式时，指令字中的形式地址A就是操作数的有效地址EA。因此通常把形式地址A又称为直接地址

    +   - 如果用D表示操作数，那么直接寻址的逻辑表达式为

    +     D = (A)


    ![](img/3c43175b8c1aba80647f801257e6a5e9_404_0.png)'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# 4. 间接寻址（1）


    +   在指令的地址字段中的形式地址A不是操作数的真正地址，而是操作数地址的地址


    +   间接寻址方式是早期计算机中经常采用的方式，但由于两次访存，执行速度慢，现在已不太使用


    ![](img/3c43175b8c1aba80647f801257e6a5e9_405_0.png)'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# 间接寻址（2）


    把直接寻址和间接寻址结合起来，指令格式如下：


    | 操作码 | I | A |

    |---|---|---|


    +   寻址特征位 I = 0，表示直接寻址，有效地址 EA = A


    +   寻址特征位 I = 1，表示间接寻址，有效地址 EA = (A)'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 5. 寄存器寻址


    # 寄存器寻址方式


    在指令的地址字段中给出的操作数地址不是内存的地址，而是CPU中通用寄存器的编号


    ![](img/3c43175b8c1aba80647f801257e6a5e9_407_0.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 6. 寄存器间接寻址


    # ■ 寄存器间接寻址方式


    ◆ 在指令的地址字段中指定的寄存器的内容不是操作数，而是操作数的地址


    ![](img/3c43175b8c1aba80647f801257e6a5e9_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 7. 偏移寻址


    是直接寻址和寄存器间接寻址方式的结合


    EA = (R) + A


    其中：R代表寄存器，A为偏移量（形式地址），是一个有符号数


    +   - 相对寻址

    +   - 基址寻址

    +   - 变址寻址


    ![](img/3c43175b8c1aba80647f801257e6a5e9_409_0.png)'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 相对寻址


    +   - 把程序计数器PC的内容加上指令格式中的偏移量A（有符号数）而形成操作数的有效地址

    +   - 程序计数器的内容就是当前指令的地址，“相对”寻址，就是相对于当前的指令地址而言

    +   - 好处是程序员无须用指令的绝对地址编程，所编程序可以放在内存任何地方


    ![](img/3c43175b8c1aba80647f801257e6a5e9_410_0.png)'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# 基址寻址


    +   - 将CPU中**基址寄存器**的内容加上指令格式中的偏移量A得到的操作数有效地址

    +   - 优点是可以扩大寻址能力。基址寄存器的位数可以设置得很长，从而可以在较大的存储空间中寻址


    ![](img/3c43175b8c1aba80647f801257e6a5e9_411_0.png)'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# 变址寻址


    +   将CPU中变址寄存器的内容加上指令格式中的偏移量A得到的操作数有效地址。与基址寻址方式类似。但变址寄存器的内容自动递增或递减。


    EA = (R) + A

    R ← (R±1或2)


    +   使用变址寻址方式的目的不在于扩大寻址空间，而在于实现程序块的规律性变化（自动加1减1、或加2减2）


    ![](img/3c43175b8c1aba80647f801257e6a5e9_412_0.png)'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# 例


    某机器字长16位，主存按字节编址，转移指令采用相对寻址，由两个字节组成，第一字节为操作码字段，第二字节为相对位移量字段。假定取指令时，每取一个字节PC自动加1。若某转移指令所在主存地址为2000H，相对位移量字段的内容为06H，则该转移指令成功转以后
    的目标地址是


    +   A.2006H

    +   B.2007H

    +   C.2008H

    +   D.2009H


    ![](img/3c43175b8c1aba80647f801257e6a5e9_413_0.png)'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# 例


    某计算机有16个通用寄存器，采用32位定长指令字，操作码字段（含寻址方式位）为8位，Store指令的源操作数和目的操作数分别采用寄存器直接寻址和基址寻址方式，若基址寄存器可使用任一通用寄存器，且偏移量用补码表示，则Store指令中偏移量的取值范围是


    +   A -32768~+32767


    +   B -32767~+32768


    +   C -65536~+65535


    +   D -65535~+65536


    ![](img/3c43175b8c1aba80647f801257e6a5e9_414_0.png)'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# 8. 段寻址方式


    +   - 某微机有20位的地址，可直接寻址1M字节的存储空间

    +   - 将整个1M的存储器以64K为单位划分成若干段

    +   - 寻址时，段寄存器中的16位数会自动左移4位，然后和16位偏移量（逻辑地址）相加，即可形成所需的20位物理地址


    ![](img/3c43175b8c1aba80647f801257e6a5e9_415_0.png)'
