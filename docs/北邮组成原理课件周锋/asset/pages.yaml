- pgno: 558
  md: '# 6.1 总线的概念和结构形态


    # 一、总线


    +   ○ 互连网: 部件之间网络连接

    +   ○ 总线: 计算机的若干功能部件之间不可能采用全互连形式，因此就需要有公共的信息通道，在收、发模块/设备间传送信息的一组公用信号线。


    +   ◆ 总线是构成计算机系统的互连机构，是多个系统功能部件之间进行数据传送的公共通路。借助于总线连接，计算机在各系统功能部件之间实现地址、数据和控制信息的交换，并在争用资源的基础上进行工作。

    +   ◆ 总线的基本组成元件是集电极开路门（OC门）或者三态门。'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# 二、总线分类


    +   ○ 按照总线部署位置的分类


    +   ◆ 内部总线：CPU内部连接各寄存器及运算器部件之间的总线。


    +   ◆ 外部总线


    +   ❖ 系统总线：CPU和计算机系统中其他高速功能部件相互连接的总线。


    +   ❖ I/O总线或外部设备总线：与I/O设备相互连接的总线。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_559_0.png)'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# 6.1 总线的概念和结构形态


    按总线上传输的信息分类


    +   - 地址线AB（Address Bus）： 地址总线

    +     - 单向总线，用来标明发送或接收数据的设备编号和需要访问的设备内部单元的地址


    +   - 数据线DB（Data Bus）： 数据总线

    +     - 双向总线，是总线设备进行数据信息交换的通路


    +   - 控制线CB（Control Bus）： 控制总线

    +     - 有出/有入，用于控制总线设备对总线的使用'
