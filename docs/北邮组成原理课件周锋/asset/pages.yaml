- pgno: 710
  md: '# 8.4.1 DMA方式的一般概念


    +   直接存储器访问（Direct Memory Address）DMA方式是为了在主存储器与I/O设备间高速交换批量数据而设置的。


    +   基本思想是：通过硬件控制实现主存与I/O设备间的直接数据传送，在传送过程中无需CPU的干预。数据传送是在DMA控制器控制下进行的，


    +   优点：速度快。有利于发挥CPU的效率。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_710_0.png)'
  merge: -1
  img_proc: true
- pgno: 711
  md: '# 8.4.1 DMA方式的一般概念


    # ◆ 过程描述：


    +   ◆ 由DMA控制器给出当前正在传送的数据的主存地址，并统计传送数据的个数以确定一组数据的传送是否已结束。在主存中要开辟连续地址的专用缓冲器，用来提供或接收传送的数据。在数据传送前和结束后要通过程序或中断方式对缓冲器和DMA控制器进行预处理和后处理。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_711_0.png)'
  merge: -1
  img_proc: true
- pgno: 712
  md: '# 8.4.2 DMA传送方式


    # 1、CPU暂停方式。


    主机响应DMA请求后，让出存储总线，直到一组数据传送完毕后，DMA控制器才把总线控制权交还给CPU，采用这种工作方式的I/O设备，在其接口中一般设置有小容量存储器，I/O设备先与小容量存储器交换数据，然后由小容量存储器与主机交换数据，这样可减少DMA传送占用存储总线的时间，也即减少了CPU暂停工作的时间。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_712_0.png)'
  merge: -1
  img_proc: true
- pgno: 713
  md: '# 1、CPU暂停方式


    +   优点：控制简单，它适用于数据传输率很高的设备进行成组传送。


    +   缺点：在DMA控制器访内阶段，内存的效能没有充分发挥，相当一部分内存工作周期是空闲的。这是由于，外围设备传送两个数据之间的间隔，一般总是大于内存存储周期，即使高速I/O设备也是如此。'
  merge: -1
  img_proc: true
