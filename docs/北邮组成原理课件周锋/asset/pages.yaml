- pgno: 420
  md: '# 存储器堆栈


    +   - 需要一个堆栈指示器来指示堆栈中栈顶的位置，它通常是CPU中一个专用的寄存器（SP：Stack Point）

    +   - 比串联堆栈灵活

    +   - 栈顶变化，由SP指示，而数据不动

    +   - 优点：

    +     - 堆栈可以根据需要，任何长度

    +     - 堆栈个数可以根据需要而定

    +     - 可以用对存储器寻址的任何一条指令来对堆栈进行寻址'
