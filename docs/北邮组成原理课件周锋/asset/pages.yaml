- pgno: 701
  md: '# 分析


    (1)在中断情况下，CPU的优先级最低。各设备的优先次序是：A→B→C→D→E→F→G→H→I→CPU。


    (2)执行设备B的中断服务程序时IM₂IM₁IM₀=111；执行设备D的中断服务程序时，IM₂IM₁IM₀=011。


    (3)每一级的IM标志不能对某个优先级的个别设备进行单独屏蔽。可将接口中的EI(中断允许)标志清“0”，它禁止设备发出中断请求。


    (4)要使设备C的中断请求及时得到响应，可将设备C从第2级取出来，单独放在第3级上，使第3级的优先级最高，即令IM₃=0即可。'
