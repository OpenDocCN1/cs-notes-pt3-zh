- pgno: 789
  md: '# 3.7.1虚拟存储器的基本概念


    +   ○ 1961年由曼彻斯特大学Kilbrn等提出。

    +   ○ 由主存和联机工作的外存共同组成。

    +     ◆ 模型：外存的容量和价格，主存的速度

    +     ◆ 它以透明的方式给用户提供了一个比实际主存空间大得多的程序地址空间，此时的地址为虚拟地址，空间为虚拟地址空间

    +     ◆ 虚拟地址由编译器生成，受到辅存容量限制，实地址由CPU送出'
  merge: -1
  img_proc: true
- pgno: 790
  md: '# 3.7.1虚拟存储器的基本概念


    +   ○ 虚拟存储器的目的

    +     ◆ 给程序员提供比实际主存大得多的地址空间

    +       ✿ 应用需求

    +         ‡ 海量数据处理：天气预报、地震预测、石油勘探…

    +         ‡ 多媒体信息处理：语音、图形、图象…

    +       ✿ 软件需求

    +         ‡ Nathan软件第一定律：软件是一种可以膨胀到充满整个容器的气体

    +       ✿ 技术需求

    +         ‡ 多进程、多道程序

    +     ◆ 提高存储器容量:较低价格得到较高的容量'
  merge: -1
  img_proc: true
- pgno: 791
  md: '# 3.7.1虚拟存储器的基本概念


    +   - 虚拟存储器的依据

    +     - 程序局部性原理

    +   - 实现形式：

    +     - 软件+辅助硬件

    +   - 地址空间：

    +     - 虚拟地址：编译程序生成，大小受辅助存储器空间的限制

    +     - 虚拟地址空间：虚拟地址的集合

    +     - 存储器地址：物理存储器的地址，也称物理地址或实地址

    +     - 主存空间：地址由CPU确定，用于访问主存的实际地址。

    +     - 逻辑地址：程序员使用的地址'
  merge: -1
