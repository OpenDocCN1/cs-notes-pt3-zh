  md: '# 7.6显示设备


    +   逻辑部件：显示（帧）存储器（Frame Buffer），显示（视频）控制器（Video Controller），显示处理器（Display Processor）


    +   显示存储器/帧缓冲存储器VM,简称显存


    +   作用：存储屏幕上像素的颜色值


    +   工作原理：帧缓冲器中的单元数目与显示器上的像素数相同,单元与像素一一对应,各单元的数值决定了其对应的像素的颜色.


