  md: '# 8.6通用I/O接口标准


    # 串行接口标准IEEE1394


    IEEE 1394是一种高速串行I/O标准接口。各被连接装置的关系是平等的，不用PC介入也能自成系统。这意味着1394在家电等消费类设备的连接应用方面有很好的前景。


