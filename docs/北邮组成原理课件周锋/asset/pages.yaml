- pgno: 350
  md: '# 读写操作


    # 无冲突读写控制


    当两个端口存取的存储单元的地址不相同时，读写操作不会产生冲突


    # 有冲突的读写控制


    当两个端口同时存取存储器同一存储单元时，便发生读写冲突


    为了解决读写冲突，设置了 BUSY 标志线


    由判断选择部件来决定对哪个端口优先进行读写操作，另一个端口的 BUSY 标志有效，读写操作延迟执行。


    判断选择部件的判断方式：


    +   CE判断：如果地址匹配且在CE之前有效，片上的控制逻辑在 CE_L 和 CE_R 之间进行判断来选择端口


    +   地址有效判断：如果 CE 在地址匹配之前变低，片上的控制逻辑在左、右地址间进行判断来选择端口'
  merge: -1
  img_proc: true
