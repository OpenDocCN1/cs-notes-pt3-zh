- pgno: 923
  md: '# 程序设计语言中的文件


    文件是为了某种目的系统地把数据组织起来而构成的数据集合体。


    为了处理的统一和概念的简化，操作系统把外部数据（磁盘文件）、外部设备（输入输出设备）一律作为文件来进行管理。


    程序设计语言中的文件，指的是这些外部数据和外部设备。'
  merge: -1
  img_proc: true
- pgno: 924
  md: '# 文件概述


    +   1. 普通文件（相对于设备文件）与文件名


    普通文件是指存放在外部存储介质上的数据集合，外部存储介质有：硬盘、光盘、U盘、软盘、磁带等。


    数据以二进制形式存储。


    存储介质不关心数据的类型，程序读取数据时，首先要知道数据的类型，才能正确解析出数据。


    如果以类型A的二进制形式存入，却当作类型B读出，就乱套了。所以，读文件前，必须确切知道文件每一字节的确切类型和含义，所以才有标准的mp3、bmp、jpg等文件格式。'
  merge: -1
  img_proc: true
- pgno: 925
  md: '# 文件概述


    为标识一个文件，每个文件都必须有一个文件名，其一般结构是：主文件名[.扩展名]

    文件名规则需遵循操作系统的约定，扩展名代表了文件的类型。




    可以从不同的角度对文件进行分类：


    +   (1) 根据文件的内容，可分为程序文件和数据文件，程序文件又可分为源文件、目标文件和可执行文件。'
  merge: -1
  img_proc: true
- pgno: 926
  md: '# （2）根据文件编码方式，可分为ASCII码文件和二进制文件


    # 一.ASCII码文件


    也称文本文件、TEXT文件，如.txt，.c，.h等


    文件内容是可打印字符。用一个字节来存储一个字符，存放的是对应字符的ASCII码。


    假设内存中有整数234，占据4个内存字节。若用ASCII码文件来存放该整数，则计算机实际是先将该整数转换成字符串“234”（字符2、3、4的ASCII码分别为十进制的50、51、52），再存储到文件中，其存储形式为：


    内存中用4个字节存放整数234


    | 00000000 |

    | 00000000 |

    | 00000000 |

    | 11101010 |


    | 00110010 | 00110011 | 00110100 |

    | ‘2’ | ‘3’ | ‘4’ |


    ASCII码文件中用3个字节存放字符串"234"'
  merge: -1
  img_proc: true
- pgno: 927
  md: '# 13.2 文件概述-


    +   - 缺点：将数据从内存存储到ASCII文件中，需要做转换（耗费时间）。

    +   - 优点：ASCII文件可以在屏幕上按字符显示，人能读懂其内容（需要将二进制数据转换成对应的字符）


    # 二. 二进制文件


    +   - 如.exe，.doc，.mp3，.jpg等文件。

    +   - 优点：1）二进制文件是把内存中的数据，原样输出到磁盘文件中，中间不做任何处理，这样可以节省转换时间。2）比文本文件小很多。3）有些数据不容易被表示为字符

    +   - 缺点：二进制文件虽然也可在屏幕上显示，但其内容人无法读懂。必须使用专用的软件来打开。'
  merge: -1
  img_proc: true
