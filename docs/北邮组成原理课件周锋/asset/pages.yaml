  md: '# 7.2磁盘存储设备


    磁表面存储器的读写原理见图


    +   写操作：当写线圈中通过一定方向的脉冲电流时，铁芯内就产生一定方向的磁通。


    +   读操作：当磁头经过载磁体的磁化元时，由于磁头铁芯是良好的导磁材料，磁化元的磁力线很容易通过磁头而形成闭合磁通回路。不同极性的磁化元在铁芯里的方向是不同的。


