- pgno: 589
  md: '# 6.3 总线的仲裁


    【例3】某CPU采用集中式仲裁方式，使用独立请求与菊花链查询相结合的二维总线控制结构。每一对请求线BRi和授权线BGi组成一对菊花链查询电路。每一根请求线可以被若干个传输速率接近的设备共享。当这些设备要求传送时通过BRi线向仲裁器发出请求，对应的BGi线则串行查询每个设备，从而确定哪个设备享有总线控制权。请分析说明图6.14所示的总线仲裁时序图。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_589_0.png)'
  merge: -1
  img_proc: true
- pgno: 590
  md: '解：从时序图看出，该总线采用异步定时协议。


    +   - 当某个设备请求使用总线时，在该设备所属的请求线上发出申请信号BRi（1）。

    +   - CPU按优先原则同意后给出授权信号BGi作为回答（2）。

    +   - BGi链式查询各设备，并上升从设备回答SACK信号证实已收到BGi信号（3）。

    +   - CPU接到SACK信号后下降BG作为回答（4）。

    +   - 在总线“忙”标志BBSY为“0”情况，该设备上升BBSY，表示该设备获得了总线控制权，成为控制总线的主设备（5）。

    +   - 在设备用完总线后，下降BBSY和SACK（6）

    +   - 释放总线。

    +   - 在上述选择主设备过程中，可能现行的主从设备正在进行传送。此时需等待现行传送结束，即现行主设备下降BBSY信号后（7），新的主设备才能上升BBSY，获得总线控制权。'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# 6.3 总线的仲裁


    # 二、分布式仲裁


    ○分布式仲裁：不需要中央仲裁器，而是多个仲裁器竞争使用总线。当它们有总线请求时，把它们唯一的仲裁号发送到共享的仲裁总线上，每个仲裁器将仲裁总线上得到的号与自己的号进行比较。如果仲裁总线上的号大，则它的总线请求不予响应，并撤消它的仲裁号。最后，获胜者的仲裁号保留在仲裁总线上。显然，分布式仲裁是以优先级仲裁策略为基础。


    ○常用的有：自举分布式裁决，冲突检测分布式裁决，并行竞争分布式裁决，等。'
  merge: -1
  img_proc: true
