- pgno: 931
  md: '# 13.2 文件概述-文件分类


    （3）根据文件的组织形式，可分为顺序存取文件和随机存取文件。


    # 顺序存取文件（Sequential Access File）


    简称“顺序文件”，数据写入文件的方式是后输入的数据放在以前输入数据的后面，按照数据的先后次序一个接一个的放。若要读取数据，也是由第一条记录开始读取。


    这种数据文件每一条记录的长度都可以不一样，虽然比较节约空间，可是每次查询都必须从头开始找起，越在后的数据找寻时间就越久。'
  merge: -1
  img_proc: true
- pgno: 932
  md: '# 随机存取文件 13.2 文件概念 文件分类

    Random Access File


    简称“随机文件”，每一条记录在存储介质中所占的长度都相同。数据存入存储介质的方式没有先后次序的限制；由于每个记录占用的长度固定，查询时只要告知第几个记录便可利用公式算出该记录的位置，快速地存取那个记录。所以不管记录在前还是在后，找寻的时间都大约相同。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_932_0.png)'
  merge: -1
  img_proc: true
- pgno: 933
  md: '# 13.2 文件概述-文件分类


    +   • 随机文件中的记录的长度必须以长度最长的那条记录为基准。


    +   • 因此当每个记录实际长度差异很大时，使用随机文件会比

    +   较浪费存储介质空间。


    +   • 使用顺序存取文件还是随机存取文件？


    +   - 如果要频繁操作文件中的记录(修改、插入、删除)，'
  merge: -1
