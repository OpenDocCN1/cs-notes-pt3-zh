  md: '# 3.6.2主存与Cache的地址映射


    无论选择那种映射方式，都要把主存和cache划分为同样大小的“块”。


    选择哪种映射方式，要考虑：


    +   ◆ 硬件是否容易实现

    +   ◆ 地址变换的速度是否快

    +   ◆ 主存空间的利用率是否高

    +   ◆ 主存装入一块时，发生冲突的概率


    以下我们介绍三种映射方法


