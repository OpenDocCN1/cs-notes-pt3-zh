- pgno: 119
  md: '# # 奇偶校验码


    # ## 设 \( X = (x_0 x_1 \cdots x_{n-1}) \)


    # ### 奇校验


    +   - 加上检验位后，传输的位组中，“1”的个数一定为奇数；否则就发生了错误


    +   - 奇校验位 \( \overline{C} = x_0 \oplus x_1 \oplus \cdots \oplus x_{n-1} \)


    # ### 偶校验


    +   - 加上检验位后，传输的位组中，“1”的个数一定为偶数；否则就发生了错误


    +   - 偶校验位 \( C = x_0 \oplus x_1 \oplus \cdots \oplus x_{n-1} \)


    # ### 奇偶校验能检测奇数个错误，无法检测偶数个错误。'
  merge: -1
  img_proc: true
