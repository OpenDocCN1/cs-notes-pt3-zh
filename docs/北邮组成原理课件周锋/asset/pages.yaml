- pgno: 205
  md: "# # 1位十进制（BCD）加法器设计\n\n令Xi和Yi为两个一位BCD码。\n■设Si为BCD码的和，Ci+1为BCD码的进位输出，Ci为进位输入。\n\
    ■令S'i为修正之前的二进制和，C'i+1为修正之前的进位。\n\n+   1）若0≤Xi + Yi + Ci<10,则C'i+1 = 0, 0≤S'i≤9\
    \  \n+      Si = S'i , Ci+1=0\n\n+   2）若10≤Xi + Yi + Ci≤15, 则C'i+1 = 0, 10≤S'i≤15\
    \  \n+      Si = S'i + 6 (mod 16) , Ci+1=1\n\n+   3）若16≤Xi + Yi + Ci≤19, 则C'i+1\
    \ = 1, 0≤S'i≤3  \n+      Si = S'i + 6 (mod 16) , Ci+1=1\n\n![](img/3c43175b8c1aba80647f801257e6a5e9_205_0.png)"
