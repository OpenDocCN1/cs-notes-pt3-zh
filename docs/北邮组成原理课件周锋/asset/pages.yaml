  md: '# # 存储器的习惯分类


    +   - 易失性半导体存储器统称为RAM

    +   - 非易失性的半导体存储器统称为ROM

    +   - RAM可以分为：

    +     - 静态RAM（SRAM）

    +     - 动态RAM（DRAM）

    +   - ROM可以分为：

    +     - 掩膜ROM（MASK ROM）

    +     - 可编程ROM（PROM）

    +       - 一次性可编程ROM（OTP ROM）

    +       - 可擦除PROM（EPROM）

    +         - 紫外线擦除EPROM（UV EPROM）

    +         - 电擦除EPROM（EEPROM，E²PROM）

    +         - 闪速存储器（FLASH ROM）


    ![](img/3c43175b8c1aba80647f801257e6a5e9_237_0.png)


    > > 早期，可读不可写。


