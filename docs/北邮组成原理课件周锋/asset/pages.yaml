- pgno: 613
  md: '# 6.5 典型总线-PCI


    # PCI总线信号线


    ○PCI总线的基本传输机制是异步式传送，利用桥可以实现总线间的异步式传送。写操作时，桥把上层总线的写周期先缓存起来，以后的时间再在下层总线上生成写周期，即延迟写。读操作时，桥可早于上层总线，直接在下层总线上进行预读。无论延迟写和预读，桥的作用可使所有的存取都按CPU的需要出现在总线上。'
  merge: -1
  img_proc: true
