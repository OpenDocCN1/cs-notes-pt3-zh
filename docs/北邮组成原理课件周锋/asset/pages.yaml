- pgno: 522
  md: '机器采用串行微程序控制方式，其指令周期见上页图（b）。其中ROM是从控存中读出一条微指令的时间，为1μs；ALU工作是加法器做加法运算，为500ns；m1是寄存器脉冲时间，为500ns；m2是写寄存器的工作脉冲宽度，为100ns。


    微指令字长12位，微指令格式如下：


    | RA0RA1 | WA0WA1 | RW | LDSA | LDSB | SB-ALU | SB-ALU | Reset | ~ |

    |---|---|---|---|---|---|---|---|---|


    +   - **RA0RA1**：读R0-R3的选择控制

    +   - **WA0WA1**：写R0-R3的选择控制

    +   - **R**：寄存器读命令

    +   - **W**：寄存器写命令

    +   - **LDSA**：打入SA的控制信号

    +   - **LDSB**：打入SB的控制信号

    +   - **SB-ALU**：传送SB的控制信号

    +   - **SB-ALU**：传送SB的控制信号，并使加法器最低位加1。

    +   - **Reset**：清暂存器SB为零的信号

    +   - **~**：一段微程序结束，转入取机器指令的控制信号'
