- pgno: 58
  md: '# # 无符号数和有符号数


    +   - 无符号数指的是不带符号位的数，例如：

    +   1个16位二进制数，表示范围为0 ~ 65535

    +   在C语言中，用unsigned short int类型进行声明


    +   - 有符号数指的是带符号位的数，最左边的位用作符号位，用“0”表示正，“1”表示负，例如

    +   有符号数+0001001 00000000，表示为0x0900

    +   有符号数-0001001 00000000，表示为0x8900

    +   在C语言中，用short int类型进行声明


    注：在32位机上，int类型通常为32位'
  merge: -1
  img_proc: true
