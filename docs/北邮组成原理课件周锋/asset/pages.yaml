- pgno: 655
  md: '# 7.2磁盘存储设备


    # 三、磁盘存储器的技术指标


    ○磁盘存储器的主要技术指标


    +   - 存储密度：存储密度分道密度、位密度和面密度。

    +     - 道密度：沿磁盘半径方向单位长度上的磁道数，单位为道/英寸。

    +     - 位密度：磁道单位长度上能记录的二进制代码位数，单位为位/英寸。

    +     - 面密度：位密度和道密度的乘积，单位为位/平方英寸。

    +   - 存储容量：一个磁盘存储器所能存储的字节总数，称为磁盘存储器的存储容量。'
  merge: -1
  img_proc: true
- pgno: 656
  md: "# 7.2 磁盘存储设备\n\n+   ○ **存取时间：** 存取时间是指从发出读写命令后，磁头从某一起始位置移动至新的记录位置，到开始从盘片表面读出或写入信息加上传送数据所需要的时间。取决于以下三个因素决定：\n\
    +   \n+   ◆ **寻道时间：** 将磁头定位至所要求的磁道上所需的时间也称为找道时间；\n+   \n+   ◆ **等待时间：** 是找道完成后至磁道上需要访问的信息到达磁头下的时间；\n\
    +   \n+   ❖ 上述两个时间都是随机变化的，因此往往使用平均值来表示，平均找道时间是最大找道时间与最小找道时间的平均值。平均等待时间和磁盘转速有关，它用磁盘旋转一周所需时间的一半来表示。\n\
    +   \n+   ◆ **数据传送时间。**\n\n![](img/3c43175b8c1aba80647f801257e6a5e9_656_0.png)"
  merge: -1
  img_proc: true
- pgno: 657
  md: '# 7.2磁盘存储设备


    数据传输率：磁盘存储器在单位时间内向主机传送数据的字节数，叫数据传输率，传输率与存储设备和主机接口逻辑有关。从主机接口逻辑考虑，应有足够快的传送速度向设备接收/发送信息。从存储设备考虑，假设磁盘旋转速度为r转/秒，每条磁道容量为N个字节，则数据传输率：


    Dr=rN(字节/秒)


    ![](img/3c43175b8c1aba80647f801257e6a5e9_657_0.png)'
  merge: -1
  img_proc: true
- pgno: 658
  md: '# 【例1】磁盘组有6片磁盘，每片有两个记录面，最上最下两个面不用。


    存储区域内径22cm，外径33cm，道密度为40道/cm，内层位密度400位/cm，转速6000转/分。问：


    +   1. 共有多少柱面？

    +   2. 盘组总存储容量是多少？

    +   3. 数据传输率多少？

    +   4. 采用定长数据块记录格式，直接寻址的最小单位是什么？寻址命令中如何表示磁盘地址？

    +   5. 如果某文件长度超过一个磁道的容量，应将它记录在同一个存储面上，还是记录在同一个柱面上？'
  merge: -1
  img_proc: true
- pgno: 659
  md: '解：(1)有效存储区域=16.5-11=5.5(cm)

    因为道密度=40道/cm，所以40×5.5=220道，即220个圆柱面。

    (2)内层磁道周长为2πR=2×3.14×11=69.08(cm)

    每道信息量=400位/cm×69.08cm=27632位=3454B

    每面信息量=3454B×220=759880B

    盘组总容量=759880B×10=7598800B

    (3)磁盘数据传输率Dr=rN,N为每条磁道容量，N=3454B

    r为磁盘转速，r=6000转/60秒=100转/秒

    Dr=rN=100×3454B=345400B/s'
  merge: -1
  img_proc: true
- pgno: 660
  md: '# 7.2磁盘存储设备


    (4)采用定长数据块格式，直接寻址的最小单位是一个记录块(一个扇区)，每个记录块记录固定字节数目的信息，在定长记录的数据块中，活动头磁盘组的编址方式可用如下格式：


    | 台号 | 柱号（磁道）号 | 盘面号/磁头号 | 扇区号 |

    |---|---|---|---|



    此地址格式表示有4台磁盘（2位），每台有16个记录面/盘面（4位），每面有256个磁道（8位），每道有16个扇区（4位）。


    (5)如果某文件长度超过一个磁道的容量，应将它记录在同一个柱面上，因为不需要重新找道，数据读/写速度快。'
  merge: -1
  img_proc: true
