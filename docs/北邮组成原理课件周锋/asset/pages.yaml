- pgno: 1097
  md: '# 控制台操作微程序流程举例


    写存储器(WRM): 按下复位按钮CRL#, 置 SWC=0, SWB=0, SWA=1。①在 SW₇~SW₀中设置存储器地址，采用单拍或连续方式，按QD按钮将此地址打入AR，注意观察AR指示灯。②在SW₇~SW₀置好数据，按QD按钮，将数据写入AR指定的存储器单元，这时AR加1。③返回②。依次进行下去，直到按复位按钮CRL#为止。实现对RAM的手动写入。每一控制台指令操作完毕应使系统复位，然后转换控制台指令。'
  merge: -1
  img_proc: true
- pgno: 1098
  md: '# 控制台操作微程序流程举例


    +   启动程序(PR)：按下复位按钮CRL#后，微地址寄存器清零。置SWC=0，SWB=0，SWA=0，用数据开关SW₇~SW₀设置RAM中的程序首地址，采用单拍或连续方式，按QD按钮后，启动程序执行。


    +   对照微程序流程图，监测微地址指示灯和判别字段指示灯，以判别正在进行的微操作。


    +   注意观察PC和IR指示灯，以判断程序的执行情况，直至程序执行完毕。'
  merge: -1
  img_proc: true
