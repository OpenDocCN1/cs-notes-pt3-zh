- pgno: 584
  md: '# 6.3 总线的仲裁


    (2) 计数器定时查询方式：


    +   - 通过BR线发出总线请求。


    +   - 中央仲裁器接到请求信号以后，在BS线为“0”的情况下让计数器开始计数，计数值通过一组地址线发向各设备。每个设备接口都有一个设备地址判别电路，当地址线上的计数与请求总线的设备地址相一致时，该设备置“1”BS线，获得了总线使用权，此时中止计数查询。


    +   - 方便地改变优先级。


