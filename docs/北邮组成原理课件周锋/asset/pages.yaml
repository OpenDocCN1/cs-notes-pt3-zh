- pgno: 823
  md: '# 3.7.6虚拟存储器实例


    # 分段分页（64TB）


    +   - 分段基础上再增加分页

    +   - 现由SU将地址变成32位线性地址

    +   - PU将这32位地址看成页目录、页表、页内偏移地址，完成二级页表查找，得到物理地址

    +   - 兼顾分页和分段的有点

    +   - 虚拟地址也是64TB


    # 不分段分页（4G）


    +   - SU不工作，PU工作

    +   - 32位地址看成页目录、页表、页内偏移地址，完成二级页表查找，得到物理地址

    +   - 虚拟地址

    +     2³² = 4TB


    ![](img/3c43175b8c1aba80647f801257e6a5e9_823_0.png)'
  merge: -1
  img_proc: true
