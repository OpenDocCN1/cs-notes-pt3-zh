  md: '# 5.3.1时序产生器作用和体制


    # 1. 作用：


    +   - CPU中的控制器用它指挥机器的工作

    +   - CPU可以用时序信号/周期信息来辨认从内存中取出的是指令（取指）还是数据（执行）

    +   - 一个CPU周期中时钟脉冲对CPU的动作有严格的约束

    +   - 操作控制器发出的各种信号是时间（时序信号）和空间（部件操作信号）的函数


