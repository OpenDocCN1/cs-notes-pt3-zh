  md: '# 5.4.1 微程序控制原理


    3、微指令：把在同一CPU周期内并行执行的微操作控制信息，存储在控制存储器里，称为一条微指令（Microinstruction）。


    +   - 它是微命令的集合，决定在一个CPU周期内所需的各种微操作。

    +   - 一条微指令通常由操作控制字段和顺序控制字段组成。

    +     - 操作控制字段：用于产生执行一条机器指令所需的各种微操作控制信号。

    +     - 顺序控制字段，又称微地址码字段，用以控制产生下一条要执行的微指令地址。


