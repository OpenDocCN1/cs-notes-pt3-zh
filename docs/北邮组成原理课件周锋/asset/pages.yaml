- pgno: 89
  md: "# # 浮点数的表示方法（2）\n\n# ## 机器浮点数的组成\n\n+   - 尾数通常为纯小数，常用原码或补码表示。尾数的有效数字的位数决定了浮点数的表示精度\n\
    \n+   - 指数为定点整数，称为阶码，常用移码或补码表示，阶码的位数决定了浮点数的表示范围\n\n| E<sub>s</sub> | E<sub>1</sub>\
    \ E<sub>2</sub> ... E<sub>m</sub> | M<sub>s</sub> | M<sub>1</sub> M<sub>2</sub>\
    \ ... M<sub>n</sub> |\n|---|---|---|---|\n| 阶符 | 阶码 | 数符 | 尾数 |\n\n若尾数和阶码均采用原码，非规格化表示方式，则：\n\
    \n最大正数 \\( (1 - 2^{-n}) \\times 2^{2^{m-1}} \\)  \n最大负数 \\( -2^{-n} \\times 2^{-(2^{m-1})}\
    \ \\)  \n最小正数 \\( 2^{-n} \\times 2^{-(2^{m-1})} \\)  \n最小负数 \\( -(1 - 2^{-n})\
    \ \\times 2^{2^{m-1}} \\)"
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # 浮点数的表示方法（4）


    # ## 浮点数的规格化形式


    +   为了充分利用尾数的有效位数、提高运算精度，规定了浮点数的规格化形式。且对任何一个浮点数其规格化形式是唯一的。


    +   对于阶码的基数为R的规格化浮点数，定义其尾数的绝对值范围：


    +   1/R ≤ |M| < 1


    +   如果R=2，则：


    +   1/2 ≤ |M| < 1


    当尾数用原码表示时，尾数的最高位恒等于1


    因此，最小正数 2⁻ⁿ×2⁻(2ᵐ⁻¹) 规格化形式为 2⁻¹×2⁻(2ᵐ⁻¹)


    最大负数 -2⁻ⁿ×2⁻(2ᵐ⁻¹) 规格化形式为 -2⁻¹×2⁻(2ᵐ⁻¹)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # 原码、补码和反码的规格化数


    | 正数    | 规格化形式    | 负数    | 规格化形式    |

    |---|---|---|---|

    | 真值    | 0.1xxx...xxx    | 真值    | −0.1xxx...xxx    |

    | 原码    | 0.1xxx...xxx    | 原码    | 1.1xxx...xxx    |

    | 补码    | 0.1xxx...xxx    | 补码    | 1.0xxx...xxx    |

    | 反码    | 0.1xxx...xxx    | 反码    | 1.0xxx...xxx    |


    # ## 特例：


    x = − 1/2 = − 0.100 ... 0 ⇒ [x]原=1.100 ... 0


    但， [x]补=1.100 ... 0， 在补码中不是规格化数


    而x = − 1


    [x]补=1.000 ... 0， 是规格化数'
