    | a | 开启可以在文件尾添加数据的文件，若文件不存在，则会创建一个新文件。 |

    | r+ | 开启一个可以读/写数据的文件，若该文件不存在时会返回NULL。 |

    | w+ | 开启一个可以读/写数据的文件，若该文件已存在时其内容会被破坏。 |

    | a+ | 开启一个可以读取和文件尾添加数据的文件，若该文件不存在时会创建一个新文件。 |'
