- pgno: 668
  md: '# 7.6显示设备


    光栅扫描显示器显示图像或画面是由称为像素(pixel, picture element)的小点组成；或者说，每条扫描线是由一系列像素组成。


    图像所有像素的强度值都要存放在一个存储器中：


    +   ◆ 这个存储器称为帧缓冲器(frame buffer)或刷新存储器(refresh buffer)，俗称显示存储器。


    ![](img/3c43175b8c1aba80647f801257e6a5e9_668_0.png)'
  merge: -1
  img_proc: true
- pgno: 669
  md: "# 7.6显示设备\n\n○光栅扫描显示是通过读取帧缓冲器的强度值，并在屏幕的适当位置显示图像\n\n+   ◆ 光栅显示的基本指令如下形式：\n+\
    \   \n+   ❖ `read(l,x,y,z)`读存储器的位置中z的内容\n+   \n+   　⊞ x和y是由l的地址确定的；\n+   \n+ \
    \  　⊞ z中是颜色值或灰度等级值。\n+   \n+   ❖ `write(x,y,z)`指令完成屏幕上对应位置的显示。\n\n+   ◆ 主要的显示循环是：\n\
    +   \n+   ❖ 对所有存储器存储单元，执行：\n+   \n+   　⊞ `read(l,x,y,z)`;\n+   \n+   　⊞ `write(x,y,z)`。\n\
    +   \n+   ❖ 每执行一次循环称为屏幕刷新。\n+   \n+   ❖ 如果N是刷新存储器的大小，那么显示控制器总是执行N对指令。\n\n![](img/3c43175b8c1aba80647f801257e6a5e9_669_0.png)"
  merge: -1
  img_proc: true
- pgno: 670
  md: '# 7.6显示设备


