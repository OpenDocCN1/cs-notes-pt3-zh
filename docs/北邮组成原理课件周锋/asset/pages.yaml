- pgno: 967
  md: '# b / t模式的区别


    以二进制方式和文本方式打开文件有什么区别？在处理某些特殊字符的时候。


    +   以文本方式打开文件，若将数据写入文件，如果遇到换行符''\n''(ASCII 值为10, 0A)，则会转换为回车一换行''\r\n''(ASCII值为13,
    10, 0D0A)存入到文件中，同样读取的时候，若遇到回车一换行，即连续的ASCII值13, 10，则自动转换为换行符。而以二进制方式打开文件时，不会进行这样的处理。


    +   还有如果以文本方式打开文件时，若读取到Ctrl+Z字符(ASCII码为26,1A)，则停止对文件的读取，会默认文件已结束，而以二进制方式读取时不会发生这样的情况。由于正常情况下我们手动编辑完成的文件是不可能出现Ctrl+Z的字符，所以可以用feof函数去检测文件是否结束。


    +   以上所述的两点区别只在windows下存在，在unix下没有区别。'
  merge: -1
  img_proc: true
