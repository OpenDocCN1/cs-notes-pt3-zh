- pgno: 173
  md: "# # 加减交替法（不恢复余数法）\n\n+   - 判断是否够减：被除数或部分余数左移减去除数得新余数 \\( r'_i = 2r_{i-1} -\
    \ y \\)\n+     - 若 \\( r'_i > 0 \\)，则 \\( i \\) 位上商 1，且在下一步，\\( r_i \\) 左移减除数。因为：\n\
    +       - \\( r_i = r'_i \\)\n+       - \\( r_{i+1} = 2r_i - y = 2r'_i - y \\\
    )\n+     - 若 \\( r'_i < 0 \\)，则 \\( i \\) 位上商 0，且在下一步，\\( r_i \\) 左移加除数。因为：\n\
    +       - \\( r_i = r'_i + y \\)\n+       - \\( r_{i+1} = 2r_i - y = 2(r'_i +\
    \ y) - y = 2r'_i + y \\)\n+   \n+   即：将恢复余数与下一步部分余数左移减去除数合并为加余数。\n+   \\( 2r'_i\
    \ + y \\) 也可理解为：商 0 后，\\( 2r'_i \\) 中已多减了 \\( 2y \\)，计算 \\( r_{i+1} \\) 时加 \\\
    ( y \\) 实际取得减除数的作用\n+   \n+   - 如果最终的余数是负数，需“纠余”得到除法运算的余数：\n+     \\( r_n = r'_n\
    \ + y \\)"
  merge: -1
  img_proc: true
