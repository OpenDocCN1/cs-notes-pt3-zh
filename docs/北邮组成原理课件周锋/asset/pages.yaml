  md: '# 7.2磁盘存储设备


    # 二、磁盘的组成和分类


    # 1、磁盘的组成：见图


    写入时，将计算机并行送来的数据取至并串转换寄存器，变为串行数据，然后一位一位地由写电流驱动器作功率放大并加到写磁头线圈上产生电流，从而在盘片磁层上形成按位的磁化存储元。


    读出时，当记录介质相对磁头运动时，位磁化存储元形成的空间磁场在读磁头线圈中产生感应电势，此读出信息经放大检测就可还原成原来存入的数据。由于数据是一位一位串行读出，串并转换。


