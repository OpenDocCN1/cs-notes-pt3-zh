  md: '# # 补码表示法


    将时钟从7点钟调到4点种，有两种调法：


    将时针退3格 -3


    将时针进9格 +9


    -3 = +9 （mod 12）


    对于时钟来说，- 3运算和 + 9运算是等价的，就是说9是（- 3）以12为模的补码


    减法可转换为加法！


