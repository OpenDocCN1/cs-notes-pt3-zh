  md: '# 6. ANSI C的缓冲文件系统


    文件的存储设备通常划分分成若干个大小相等的物理块，每块长为512或1024字节。


    为有效利用存储设备和便于系统管理，一般把文件信息也划分成与物理存储设备的物理块大小相等的逻辑块，从而以块作为分配和传送信息的基本单位。


    文件的存储方式：连续文件、串连文件、索引文件。详见《计算机导论与程序设计基础》第14章。'
