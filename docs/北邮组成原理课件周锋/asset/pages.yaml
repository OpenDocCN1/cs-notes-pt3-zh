  img_proc: true
- pgno: 945
  md: '# 7. 文件类型FILE


    C系统为了处理文件， 给每个打开的文件都在内存中开辟一片区域， 用于存放文件的有关信息（如缓冲区位置、缓冲区大小、缓冲区 中当前所指向的字节位置、文件状态--读还是写、
    是否已经到达文件 结尾等等）。


    为了得到这片内存， 需要在程序中定义一个类型为FILE的结构变量。 FILE类型由系统定义（见< stdio.h>）。


    注意： 结构类型名"FILE"必须大写。'
  merge: -1
