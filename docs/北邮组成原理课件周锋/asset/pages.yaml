- pgno: 792
  md: '# 3.7.1虚拟存储器的基本概念


    主存—外存层次和cache—主存层次用的地址变换映射方法和替换策略是相同的，都基于程序的局部性原则


    +   - 把程序中最常用的那部分放在高速存储器中

    +   - 一旦某部分变得不常用了，就送回到低速存储器

    +   - 换入对用户是透明的（不可见）

    +   - 目的是使性能接近高速存储器，价格和容量接近低速存储器


