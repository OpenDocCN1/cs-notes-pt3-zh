  md: '# # 1. 层次存储器系统


    程序运行的局部性原理：


    +   - 在一个较短的时间间隔内，程序所访问的存储器地址在很大比例上集中在存储器地址空间的很小范围内 ——空间局部性


    +   - 在一小段时间内，最近被访问过的程序和数据很可能再次被访问 ——时间局部性


