  md: '# 13.6 顺序存取文件的操作


    +   - 顺序存取文件特点:

    +     - 是文本文件，使用**fscanf**和**fprintf**函数。

    +     - 文件中的记录可以有不同的长度。

    +     - 不能直接快速地访问文件中的某一记录，而必须从文件中

    +       第一个记录开始访问。

    +     - 新的记录只能插入到文件尾。

    +   - 随机存取文件特点:

    +     - 是二进制文件，使用**fread**和**fwrite**函数

    +     - 文件中的记录具有相同的长度。'
  merge: -1
