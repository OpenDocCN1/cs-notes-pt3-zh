- pgno: 446
  md: '# 复杂指令系统


    # CISC指令系统的特点：


    +   - 指令系统庞大，指令条数200～300条

    +   - 指令长度不固定，指令格式种类多，寻址方式种类多

    +   - 可以访问存储器的指令不受限制

    +   - 各种指令的使用频度相差较大

    +   - 各种指令的执行时间相差很大，不利于流水线处理

    +   - 控制器一般采用微程序控制方式

    +   - 难以用优化编译生成高效的目标代码


    ![](img/3c43175b8c1aba80647f801257e6a5e9_446_0.png)'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# RISC计算机的出现


    +   - RISC思想首先由IBM公司提出，IBM801处理器是公认的体现RISC思想的机器，但那时不叫RISC

    +   - 1980/1年伯克利大学的Patterson教授和斯坦福大学的Hennessy教授各自领导的研究组先后提出了RISC概念，并分别设计了RISC
    I和MIPS处理器芯片

    +   - 推出商业芯片

    +     - SPARC处理器 SUN公司

    +     - MIPS处理器 MIPS公司'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# 精简指令系统（1）


    # RISC指令系统的特点：


    +   - 选取使用频率最高的一些简单指令，指令条数少

    +   - 指令长度固定，指令格式种类少，寻址方式种类少

    +   - 只有取数 / 存数指令访问存储器，其余指令的操作都在寄存器之间进行

    +   - CPU中通用寄存器数量较多，减少访存次数

    +   - 重叠窗口技术，减少过程调用中保护现场和回复现场时间

    +   - 大部分指令都能在一个机器周期内完成，便于采用流水线技术

    +   - 采用硬布线控制逻辑，控制器简单，留出更多芯片面积便于实现大容量Cache

    +   - 注重编译的优化'
  merge: -1
  img_proc: true
