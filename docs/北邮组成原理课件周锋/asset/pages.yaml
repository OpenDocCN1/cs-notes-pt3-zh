- pgno: 1026
  md: '# 缓冲区操作函数


    +   - **int fflush(FILE *fPtr);**

    +     - 清理一个文件的缓冲区。

    +     - 参数fPtr是打开文件时由fopen()函数返回的FILE指针。

    +     - 对于以写方式打开的文件，函数将缓冲区中的数据写入磁盘文件。

    +     - 对于以读方式打开的文件，函数将缓冲区清空。

    +     - 函数如果运行成功则返回0，如果失败则返回EOF（也就是-1）。

    +   - **int flushall(void);**

    +     - 用于清理所有文件的缓冲区。

    +     - 返回打开着的文件个数。'
  merge: -1
  img_proc: true
