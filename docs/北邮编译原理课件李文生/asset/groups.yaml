    # 二、涉及数组元素的赋值语句


    # 1. 计算数组元素的地址


    +   - 数组元素存储在一个连续的存储块中，根据数组元素的下标可以快速地查找每个元素。


    # 一维数组A


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_579_0.png)


    基址： base

    域宽： w

    元素个数： high-low+1


    下界 low


    元素 i


    上界 high


    # 数组元素A[i]的位置：


    ```

    base + ( i-low )×w

    = i×w + base - low×w

    ```'
  - '[PAGE 580]


    # ■ 二维数组A


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_580_0.png)


    # 存储方式：


    按行存放


    按列存放


    每维的下界：$low_1$、$low_2$


    每维的上界：$high_1$、$high_2$


    每维的长度：$n_1=high_1-low_1+1$


    $n_2=high_2-low_2+1$


    域宽：$w$　　基址：$base$


    # 数组元素 A[i,j] 的位置：


    $$base+((i-low_1)\times n_2+(j-low_2))\times w$$


    $$=(i\times n_2+j)\times w+base-(low_1\times n_2+low_2)\times w$$'
