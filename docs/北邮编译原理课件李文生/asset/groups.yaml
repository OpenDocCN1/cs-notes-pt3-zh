    # 布尔表达式的翻译


    +   两遍扫描的翻译技术

    +   1. 生成分析树

    +   2. 为分析树加注释——翻译


    +   一遍扫描的分析和翻译技术

    +   问题：当生成某些转移指令时，目标地址可能还不知道


    解决办法


    回填技术（backpatching）


    +   先产生没有填写目标标号的转移指令；

    +   建立一个链表，把转向这个目标的所有转移指令的标号填入该链表；

    +   目标地址确定后，再把该地址填入该链表中记录的所有转移指令中。'
