    # # 非递归预测分析方法


    +   - 不带回溯、不含递归

    +   - 模型：

    +     - 输入缓冲区：存放输入符号串 $a_1a_2...a_n$

    +     - 符号栈：分析过程中存放文法符号

    +     - 分析表：二维表，每个 $A$ 有一行，每个 $a$ 包括 $\$$ 有一列，表项内容是产生式（关键）

    +     - 控制程序：根据栈顶 $X$ 和当前输入 $a$ 决定分析动作（永恒的核心）

    +     - $X=a=\$$：分析成功

    +     - $X=a\ne\$$：弹出 $X$，扫描指针前移

    +     - $X$ 是非终结符，查分析表：$M[X,a]$

    +     - $M[X,a]=X\rightarrow Y_1Y_2...Y_k$，弹出 $X$，$Y_k、...、Y_2、Y_1$ 入栈

    +     - $M[X,a]=X\rightarrow\varepsilon$，弹出 $X$

    +     - $M[X,a]$ 为空，出错处理

    +     - 输出：对输入符号串进行最左推导所用的产生式序列'
