  mdcn: "\n\n## 设计全局变量和过程（续）\n\n1. C：字符变量，存放当前读进的字符。\n2. iskey：整型变量\n3. token：字符数组，存放单词的字符串。\n\
    4. lexemebegin：字符指针，指向输入缓冲区中当前单词的开始位置。\n5. forward：字符指针，向前扫描指针。\n6. buffer：字符数组，输入缓冲区。\n\
    7. get_char：读字符过程，每调用一次，读进一个字符，并把它放入 char 中，且向前指针 forward 指向下一个字符。\n8. get_nbc：过程，每次调用时，检查\
    \ char 中是否为空字符，若是，则反复调用该过程，直到 char 进入一个非空字符为止。\n9. cat：过程，每次调用把当前 char 中的字符与 token\
    \ 中的字符串连接起来。\n10. letter 和 digit：布尔函数，分别判断 char 中的字符是否为字母或数字，若是则返回 true，否则返回 false。\n\
    11. retract：过程，向前扫描指针 forward 后退一个字符。\n12. reserve：函数，查保留字表，若此函数的返回值为 0，则表示 token\
    \ 中的字符串是标识符，否则为保留字。\n13. DTB：十/二进制的转换过程，它将 token 中的数字串转换成二进制的数值表示。\n14. table_insert：过程，将标识符插入符号表。\n\
    15. error：错误处理函数。\n16. return：返回过程，收集并携带必要的信息返回调用程序。\n\n## 编制词法分析程序 （类C语言描述）\n\
    \n```c\ntoken=\"\";\nget_char;\nget_nbc;\nSWITCH (C)\n{\nCASE 'a'..'z': WHILE\
    \ (letter || digit) {\n    cat; get_char; }\nretract;\niskey=reserve;\nIF iskey==0\
    \ {\n    table_insert;\n    return(ID, 指向该标识符在符号表的入口指针);\n};\nELSE return (关键字的记号,\
    \ -);\nBREAK;\nCASE '0'..'9': ... //识别出无符号数，并存入token\nreturn(num, DTB(token));\n\
    BREAK;\nCASE '<' : get_char;\nIF (C=='=') return(relop, LE);\nELSE IF (C=='>')\
    \ return(relop, NE);\nELSE { retract; return(relop, LT);}\nBREAK;\nCASE '=' :\
    \ return(relop, EQ); BREAK;\nCASE '>' : get_char;\nIF (C=='=') return(relop, GE);\n\
    ELSE { retract; return(relop, GT);}\nBREAK;\nCASE ':': get_char;\nIF (C=='=')\
    \ return(assign-op, -);\nretract; return(':', -);\nBREAK;\nCASE '+' : return('+',\
    \ -); BREAK;\nCASE '-' : return('-', -); BREAK;\nCASE '(' : return('(', -); BREAK;\n\
    CASE ')' : return(')', -); BREAK;\nCASE ';' : return(';', -); BREAK;\nCASE '/':\
    \ get_char;\n    IF (C=='*') {\n    loop_1:   get_char;\n        WHILE (!'*')\
    \ get_char;\n        get_char;\n        IF (C=='/') BREAK;\n        GOTO loop_1;\n\
    \    };\n    ELSE { retract; return('/',-);};\n    BREAK;   // end of case '/'\n\
    DEFAULT: error();\n}   //end of switch\n```\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_125_0.png)\n\
    \n## 小结\n\n- 词法分析器的作用\n- 与语法分析器的关系\n  - 独立、子程序、协同程序\n- 配对缓冲区\n  - 必要性、算法\n- 记号\n\
