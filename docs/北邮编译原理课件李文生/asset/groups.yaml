    # 算法5.2：构造语法制导的预测翻译程序


    输入：基础文法适合于预测分析的语法制导翻译方案


    输出：语法制导翻译程序


    方法：（修改预测分析程序的构造技术）


    +   (1) 为每个非终结符号A建立一个函数(可以是递归函数)

    +   ◆ A的每一个继承属性对应函数的一个形参

    +   ◆ A的综合属性作为函数的返回值

    +   ◆ A产生式中的每个文法符号的每个属性都对应一个局部变量


    (2) A的函数的代码由多个分支组成'
