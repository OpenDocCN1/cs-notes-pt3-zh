    \ ```c\n  #define prompt(s) fprintf(stderr, s)\n  ```\n\n- 宏处理器处理两类语句，即宏定义和宏调用。\n\
    \  - 宏定义通常用统一的字符或关键字表示，如define或macro，宏定义由宏名字及宏体组成，通常宏处理器允许在宏定义中使用形参。\n  - 宏调用由调用宏的命令名（宏名）和所提供的实参组成。宏处理器用实参代替宏体中的形参，再用变换后的宏体替换宏调用本身。\n\
