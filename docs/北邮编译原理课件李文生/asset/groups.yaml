    \  - 常数\n\n## 把语义规则插入到产生式中适当的位置\n\nS→{B.ps=10} B {S.ht=B.ht}\n\nS→ {B.ps=10}\n\
    \    B {S.ht=B.ht}\n\nB→ {B₁.ps=B.ps}\n    B₁ {B₂.ps=B.ps}\n    B₂ {B.ht=max(B₁.ht,B₂.ht)}\n\
    \nB→ {B₁.ps=B.ps}\n    B₁\n    sub {B₂.ps=shrink(B.ps)}\n    B₂ {B.ht=disp(B₁.ht,B₂.ht)}\n\
    \nB→text {B.ht=text.h×B.ps}\n\n作业:\n5.15\n5.16\n\n## 5.2 S-属性定义的自底向上翻译\n\n- S属性定义：\n\
    \  - 只用综合属性的语法制导定义\n- 一、构造表达式的语法树\n- 二、构造表达式的语法树的语法制导定义\n- 三、S属性定义的自底向上实现\n\n\
    ### 一、构造表达式的语法树\n\n- 把语法规则中对语义无关紧要的具体规定去掉，剩下来的本质性的东西称为抽象语法。\n- 如：\n  - 赋值语句： x=y、\
    \ x:=y、 或 y→x\n  - 抽象形式： assignment(variable,expression)\n- 语法树：\n  - 分析树的抽象（或压缩）形式。\n\
    \  - 也称为语法结构树或结构树。\n  - 内部结点表示运算符符号，其子结点表示它的运算分量。\n\n### 构造表达式的语法树\n\n- 表达式的语法树的形式\n\
    \  - 每一个运算符符号或运算分量都对应树中的一个结点\n  - 运算符符号结点的子结点分别是与该运算符的各个运算分量相应的子树的根。\n  - 每一个结点可包含若干个域:\n\
    \    - 标识域、指针域、属性值域等\n- 在运算符结点中\n  - 一个域标识运算符符号\n  - 其它各域包含指向与各运算分量相应的结点的指针\n\
    \  - 称运算符符号为该结点的标号\n\n### 构造函数\n\n- **makenode (op, left, right)**\n  - 建立一个运算符符号结点，标号是op；\n\
    \  - 域left和right是指向其左右运算分量结点的指针。\n- **makeleaf (id, entry)**\n  - 建立一个标识符结点，标号是id；\n\
    \  - 域entry是指向该标识符在符号表中的相应条目的指针。\n- **makeleaf (num, val)**\n  - 建立一个数结点，标号为num；\n\
    \  - 域val用于保存该数的值。\n\n### 建立表达式 a*4+b 的语法树\n\n```\np₁=makeleaf(id,entrya);  \n\
    p₂=makeleaf(num,4);  \np₃=makenode(`*`,p₁,p₂);  \np₄=makeleaf(id,entryb);  \n\
    p₅=makenode(`+`,p₃,p₄);\n```\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_344_0.png)\n\
    \n### 构造表达式语法树的语法制导定义\n\n| 产生式 | 语义规则 |\n| --- | --- |\n| E→E₁ + T | E.nptr =\
    \ makenode('+', E₁.nptr, T.nptr) |\n| E→T | E.nptr = T.nptr |\n| T→T₁ * F | T.nptr\
    \ = makenode('*', T₁.nptr, F.nptr) |\n| T→F | T.nptr = F.nptr |\n| F→(E) | F.nptr\
    \ = E.nptr |\n| F→id | F.nptr = makeleaf(id, id.entry) |\n| F→num | F.nptr = makeleaf(num,\
    \ num.val) |\n\n- 为了记录在构造过程中建立的子树，为每个非终结符号引入一个综合属性nptr。\n- nptr是一个指针，指向语法树中相应非终结符号产生的表达式子树的根结点。\n\
    \n### 表达式a*4+b的语法树的构造\n\n- E→E₁ + T\n- E→T\n- T→T₁ * F\n- T→F\n- F→(E)\n- F→id\n\
    - F→num\n\n符号表中a的入口\n\n符号表中b的入口\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_348_0.png)\n\
    \n### 表达式的有向非循环图(dag)\n\n- **dag与语法树相同的地方：**\n  - 表达式的每一个子表达式都有一个结点\n  - 一个内部结点表示一个运算符符号，且它的子结点表示它的运算分量。\n\
    - **dag与语法树不同的地方：**\n  - **dag**中，对应一个公共子表达式的结点具有多个父结点\n  - 语法树中，公共子表达式被表示为重复的子树\n\
    - **为表达式创建dag的函数makenode和makeleaf**\n  - 建立新结点之前先检查是否已经存在一个相同的结点\n  - 若已存在，返回一个指向先前已构造好的结点的指针；\n\
    \  - 否则，创建一个新结点，返回指向新结点的指针。\n\n### 为表达式 `a+a*(b-c)+(b-c)*d` 构造 dag\n\n### 函数调用\n\
    \n- ➜ `p₁=makeleaf(id,a);`\n- ➜ `p₂=makeleaf(id,a);`\n- ➜ `p₃=makeleaf(id,b);`\n\
    - ➜ `p₄=makeleaf(id,c);`\n- ➜ `p₅=makenode('-',p₃,p₄);`\n- ➜ `p₆=makenode('*',p₂,p₅);`\n\
    - ➜ `p₇=makenode('+',p₁,p₆);`\n- ➜ `p₈=makeleaf(id,b);`\n- ➜ `p₉=makeleaf(id,c);`\n\
    - ➜ `p₁₀=makenode('-',p₈,p₉);`\n- ➜ `p₁₁=makeleaf(id,d);`\n- ➜ `p₁₂=makenode('*',p₁₀,p₁₁);`\n\
    - ➜ `p₁₃=makenode('+',p₇,p₁₂);`\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_350_0.png)\n\
    \n### 三、S-属性定义的自底向上实现\n\n- **已知**\n  - 自底向上的分析方法中，分析程序使用一个栈来存放已经分析过的子树的信息。\n \
    \ - 分析树中某结点的综合属性由其子结点的属性值计算得到\n  - 自底向上的分析程序在分析输入符号串的同时可以计算综合属性\n- **考虑**\n  -\
    \ 如何保存文法符号的综合属性值？\n  - 保存属性值的数据结构怎样与分析栈相联系？\n  - 怎样保证：每当进行归约时，由栈中正在归约的产生式右部符号的属性值计算其左部符号的综合属性值。\n\
    \n"
