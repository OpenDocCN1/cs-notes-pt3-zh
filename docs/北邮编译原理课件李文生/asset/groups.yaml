  - '[PAGE 271]


    # 利用优先级和结合规则解决表达式冲突


    +   - 描述算术表达式集合的二义性文法：

    +     E→E+E|E*E|(E)|id （文法4.11）


    +   - 无二义性的文法：

    +     E→E+T|T

    +     T→T*F|F

    +     F→(E)|id


    +   - 前者具有两个明显的优点：

    +     - 改变运算符符号的优先级或结合规则时，文法本身无需改变，只需改变限制条件。

    +     - LR分析表所包含的状态数比后者少得多'
