  md: "\n## 9.2 基本块与流图\n\n- 基本块\n  - 具有原子性的一组连续语句序列。\n  - 控制从第一条语句流入，从最后一条语句流出，中途没有停止或分支\n\
    \n- 如：\n  t₁ := a * a\n  t₂ := b * b\n  t₃ := t₁ + t₂\n\n- 基本块：\n  t₁ := a * a\n\
    \  t₂ := a * b\n  t₃ := 2 * t₂\n  t₄ := t₁ + t₃\n  t₅ := b * b\n  t₆ := t₄ + t₅\n\
    \n## 基本块的划分方法\n\n- 确定入口语句，下面的语句是入口语句：\n  - 三地址代码的第一条语句\n  - goto语句转移到的语句\n  -\
    \ 紧跟在goto语句后面的语句\n\n- 确定基本块，与每一个入口语句相应的基本块：\n  - 从一个入口语句（含该语句）到下一个入口语句（不含）之间的语句序列\n\
    \  - 从一个入口语句（含该语句）到停止语句（含该语句）之间的语句序列\n\n## Pascal程序片断：\n\n```\ni:=1;\nwhile (i<=10)\
    \ do\nbegin\n    a[i]:=a[i]+b[i];\n    i:=i+1\nend\n```\n\n```\n(1) i:=0  B₁\n\
    (2) if i<=10 goto (4)  B₂\n(3) goto (17)  B₃\n(4) t1:=4*i  B₄\n(5) t2:=a-4\n(6)\
    \ t3:=4*i\n(7) t4:=a-4\n(8) t5:=t4[t3]    /* t5=a[i] */\n(9) t6:=4*i\n(10) t7:=b-4\n\
    (11) t8:=t7[t6]    /* t8=b[i] */\n(12) t9:=t5+t8\n(13) t2[t1]:=t9\n(14) t10:=i+1\n\
    (15) i:=t10\n(16) goto (2)\n(17) ...  B₅\n```\n\n## 流图示例：\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_650_0.png)\n\
    \n## 举例　基本块划分：\n\n→\n(1)　i:=n-1\n(2)　j:=n\n(3)　t₁:=4*n\n(4)　v:=a[t₁]\n\nB₁\n\n\
    →\n(5)　i:=i+1\n(6)　t₂:=4*i\n(7)　t₃:=a[t₂]\n(8)　if t₃<v goto (5)\n\nB₂\n\n→\n(9)　j:=j-1\n\
    (10)　t₄:=4*j\n(11)　t₅:=a[t₄]\n(12)　if t₅>v goto (9)\n\nB₃\n\n→\n(13)　if i>=j goto\
    \ (23)\n\nB₄\n\n→\n(14)　t₆:=4*i\n(15)　x:=a[t₆]\n(16)　t₇:=4*i\n(17)　t₈:=4*j\n(18)　t₉:=a[t₈]\n\
    (19)　a[t₇]:=t₉\n(20)　t₁₀:=4*j\n(21)　a[t₁₀]:=x\n(22)　goto (5)\n\nB₅\n\n→\n(23)　t₁₁:=4*i\n\
    (24)　x:=a[t₁₁]\n(25)　t₁₂:=4*i\n(26)　t₁₃:=4*n\n(27)　t₁₄:=a[t₁₃]\n(28)　a[t₁₂]:=t₁₄\n\
    (29)　t₁₅:=4*n\n(30)　a[t₁₅]:=x\n\nB₆\n\n## 流图：\n\n```\n(1) i:=m-1    (2) j:=n \
    \   (3) t1:=4*n    (4) v:=a[t1]\nB1\n```\n\n```\n(5) i:=i+1    (6) t2:=4*i   \
    \ (7) t3:=a[t2]    (8) if t3<v goto B2\nB2\n```\n\n```\n(9) j:=j-1    (10) t4:=4*j\
    \    (11) t5:=a[t4]    (12) if t5>v goto B3\nB3\n```\n\n```\n(13) if i>=j goto\
    \ B6\nB4\n```\n\n```\n(14) t6:=4*i    (15) x:=a[t6]    (16) t7:=4*i    (17) t8:=4*j\
    \    (18) t9:=a[t8]    (19) a[t7]:=t9    (20) t10:=4*j    (21) a[t10]:=x    (22)\
    \ goto B2\nB5\n```\n\n```\n(23) t11:=4*i    (24) x:=a[t11]    (25) t12:=4*i  \
    \  (26) t13:=4*n    (27) t14:=a[t13]    (28) a[t12]:=t14    (29) t15:=4*n    (30)\
    \ a[t15]:=x\nB6\n```\n\n## 本节内容\n\n- 目标机器概述\n- 下次引用信息的计算\n- 代码生成算法\n\n## 一、目标机器\n\
    \n- 设计代码生成程序的必要条件：熟悉目标机器\n\n- 一般信息\n  - 编址方式：\n    - 按字节编址\n    - 每个字有4个字节\n \
    \ - 寄存器：\n    - n个通用寄存器：R₀、R₁、Rₙ₋₁\n  - 指令形式：\n    - OP S, D\n      其中 OP：MOV、ADD、SUB\n\
    \      S：源操作数\n      D：目的操作数\n\n## 寻址方式\n\n| 地址形式 | 汇编方式 | 地址 | 占用存储空间 |\n|---|---|---|---|\n\
    | 绝对地址 | M | M | 1 |\n| 寄存器 | R | R | 0 |\n| 变址 | c(R) | c+contents(R) | 1 |\n\
    | 间接寄存器 | *R | contents(R) | 0 |\n| 间接变址 | *c(R) | contents(c+contents(R)) | 1\
    \ |\n| 立即数 | #c | 常数c | 1 |\n\n指令开销\n= 指令所占用存储单元字数\n= 1 + S寻址方式占用字数 + D寻址方式占用字数\n\
    \n## 举例\n\n- **MOV R₀, R₁**\n  - 将寄存器R₀的内容复制到R₁中\n  - 开销： 1\n- **MOV R₅, M**\n\
    \  - 将寄存器R₅的内容放到存储单元M中\n  - 开销： 2\n- **ADD #1, R₃**\n  - 将寄存器R₃的内容增加1\n  - 开销：\
    \ 2\n- **SUB 4(R₀), *12(R₁)**\n  - 将地址为(contents(12+contents(R₁))的单元中的值减去contents(4+contents(R₀))，结果仍存放到地址为(contents(12+contents(R₁))的单元中。\n\
    \  - 开销： 3\n\n## 三地址语句a:=b+c的代码\n\n(1) MOV b, R₀\nADD c, R₀\nMOV R₀, a\n指令开销为6\n\
    \n(2) MOV b, a\nADD c, a\n指令开销为6\n\n(3) 假设R₁和R₂中分别包含b和c的值，b的值以后不再需要：\nADD R₂,\
    \ R₁\nMOV R₁, a\n指令开销为3\n\n(4) 假设R₀、R₁和R₂中分别存放了a、b和c的地址：\nMOV *R₁, *R₀\nADD *R₂,\
    \ *R₀\n指令开销为2\n\n## 二、下次引用信息\n\n- 在把三地址代码转换成为目标代码时，遇到的一个重要问题：\n  - 如何充分利用寄存器？\n\
    \n- 基本思路：\n  - 在一个基本块范围内考虑\n  - 把在基本块内还要被引用的变量的值尽可能保存在寄存器中\n  - 把在基本块内不再被引用的变量所占用的寄存器尽早地释放\n\
    \n- 如：翻译语句 `X:=Y op Z`\n  - X、Y、Z在基本块中是否还会被引用？\n  - 在哪些三地址语句中被引用？\n\n## 下次引用信息\n\
    \n三地址语句序列：\n\ni: x := 1\n\n语句i对变量x定值\n\n没有对变量x定值的其他语句\n\nj: y := x op z\n\n语句j引用x在语句i处定的值\n\
    \nj 是三地址语句 i 中 x 的下次引用信息\n\n## 假设\n\n- 讨论在一个基本块内的引用信息\n- 所有的变量在基本块出口处都是活跃的\n-\
    \ 符号表中含有记录下次引用信息和活跃信息的域\n\n## 算法\n\n输入：组成基本块的三地址语句序列\n\n输出：基本块中各名字的下次引用信息\n\n\
    方法：\n\n1. 把基本块中各变量在符号表中的下次引用信息域置为“无下次引用”、活跃信息域置为“活跃”。\n\n2. 从基本块出口到入口由后向前依次处理各语句，对每个三地址语句\
    \ i: x:=y op z，依次执行下述步骤：\n\na) 把当前符号表中变量 x 的下次引用信息和活跃信息附加到语句 i 上；\n\nb) 把符号表中\
    \ x 的下次引用信息和活跃信息分别置为“无下次引用”和“非活跃”；\n\nc) 把当前符号表中变量 y 和 z 的下次引用信息和活跃信息附加到语句 i 上；\n\
    \nd) 把符号表中 y 和 z 的下次引用信息均置为 i，活跃信息均置为“活跃”。\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_661_0.png)\n"
