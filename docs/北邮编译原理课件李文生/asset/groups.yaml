  - "[PAGE 690]\n\n# 删除死代码\n\n+   - 死代码：如果对一个变量x求值之后却不引用它的值，则称对x求值的代码为死代码。\n+   -\
    \ 死块：控制流不可到达的块称为死块。  \n+     - 如果一个基本块是在某一个条件为真时进入执行的，经数据流分析的结果知该条件恒为假，则此块是死块。\n\
    +     - 如果一个基本块是在某个条件为假时才进入执行，而该条件却恒为真，则这个块也是死块。\n+   - 在确定一个基本块是死块之前，需要检查转移到该块的所有转移语句的条件。\n\
    +   - 死块的删除，可能使其后继块成为无控制转入的块，这样的块也成为死块，同样应该删除。"
