  - '[PAGE 210]


    # 分析表


    +   - LR分析程序工作的依据

    +   - goto[Sₘ, X]: 状态Sₘ经X转移的一个状态

    +   - action[Sₘ, aᵢ]: 状态Sₘ面临输入符号aᵢ时应采取的分析动作


    移进：把当前输入符号aᵢ及由Sₘ和aᵢ所决定的下一个状态 S=goto[Sₘ, aᵢ]推进栈，向前扫描指针前移。


    归约：用某产生式A→β进行归约，若β的长度为r，归约的动作从栈顶起向下弹出2r项，使Sₘ₋ᵣ成为栈顶状态，然后把文法符号A及状态S=goto[Sₘ₋ᵣ, A]推进栈。


    接受：宣布分析成功，停止分析。


    出错：调用出错处理程序，进行错误恢复。'
  - '[PAGE 211]


    # LR分析控制程序


    +   核心部分，对所有的LR分析程序都是一样的。


    +   LR分析控制程序的工作过程


    +   - 分析开始时，初始的二元式为：(S₀, a₁a₂...aₙ$)


    +   - 分析过程中每一步的结果，均可表示为如下的二元式：(S₀X₁S₁X₂...XₘSₘ, aᵢaᵢ₊₁...aₙ$)


    +   - 若action[Sₘ, aᵢ]=shift S，并且 S=goto[Sₘ, aᵢ]，则二元式变为：(S₀X₁S₁X₂...XₘSₘaᵢS, aᵢ₊₁...aₙ$)


    +   - 若action[Sₘ, aᵢ]=reduce by A→β，则二元式变为：(S₀X₁S₁X₂...Xₘ₋ᵣSₘ₋ᵣAS, aᵢaᵢ₊₁...aₙ$)


    +   - 若action[Sₘ, aᵢ]=accept（接受），表示分析成功，二元式变化过程终止。


    +   - 若action[Sₘ, aᵢ]=error（出错），表示发现错误，调用错误处理程序。'
  - '[PAGE 212]


    # “活前缀”的概念


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_212_0.png)


    定义：一个规范句型的一个前缀，如果不含句柄之后的任何符号，则称它为该句型的一个活前缀。


    例：右句型aAbcde的句柄是Ab


    该句型的活前缀有ε、a、aA、aAb；


    句型aAcde的句柄是d


    它的活前缀有：ε、a、aA、aAc、aAcd。


    之所以称它们为活前缀，是因为在其右边增加某些终结符号之后，就可以使之成为一个规范句型。


    分析过程中 (S₀X₁S₁X₂...XₘSₘ, aᵢaᵢ₊₁...aₙ$)

    X₁X₂...Xₘaᵢaᵢ₊₁...aₙ是一个右句型，

    X₁X₂...Xₘ是它的一个活前缀。'
