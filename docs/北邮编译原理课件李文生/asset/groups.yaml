  - '[PAGE 208]


    # LR分析技术简介(续)


    +   - **LR分析技术是一种比较完备的技术**

    +     - 可以分析所有能用上下文无关文法书写的程序设计语言的结构；

    +     - 最一般的无回溯的“移进-归约“方法；

    +     - 能分析的文法类是预测分析方法能分析的文法类的真超集；

    +     - 分析过程中，能及时发现错误，快到自左至右扫描输入的最大可能。

    +   - **LR分析方法的不足之处**

    +     - 手工编写LR分析程序的工作量太大

    +     - 需要专门的工具，即LR分析程序生成器（如YACC）'
