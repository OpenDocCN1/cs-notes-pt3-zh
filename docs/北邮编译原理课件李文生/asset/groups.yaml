    begin\n    ... a ...;\n    ... v ...;\n    exchange(i, j);\nend;\nbegin\n    if\
    \ (n>m) then begin\n        k:=partition(m, n);\n        quicksort(m, k-1);\n\
    \        quicksort(k+1, n)\n    end\nend {quicksort};\nbegin\n    a[0]:=-999;\
    \ a[10]:=999;\n    readarray; quicksort(1, 9)\nend {sort}.\n```\n\n### 控制栈的变化举例\n\
    \n![](img/12b57169bd1d5004c5e7193ff0d478d5_510_0.png)\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_510_1.png)\n\
    \n入栈？\n出栈？\n\nk\n\n### 调用序列\n\n- 除局部数据外，活动记录中还有实现过程调用和返回的控制信息\n- 活动记录的入栈，实现了控制从调用过程到被调用过程的转移\n\
    - 控制的转移由一段代码（即调用序列）来实现\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_511_0.png)\n\
    \n### 返回序列\n\n- q把返回值写入自己活动记录的返回值域\n- q恢复断点状态：\n  - 寄存器的值\n  - top_sp和top_ep的值\n\
    \  - 机器状态\n- 根据返回地址返回到p的代码中（goto语句）\n- p把返回值取入自己的活动记录中\n- p继续执行\n\n### 调用序列与活动记录\n\
    \n- 区别：\n  - 活动记录是一块连续的存储区域，保存一个活动所需的全部信息，与活动一一对应。\n  - 调用序列是一段代码，完成活动记录的入栈，实现控制从调用过程到被调用过程的转移。\n\
    \  - 调用序列逻辑上是一个整体，物理上被分成两部分，分属于调用过程和被调用过程。\n- 联系：\n  - 调用序列的实现与活动记录中内容的安排有密切关系\n\
    \n### 可变长数据的处理\n\n- 某些语言允许由实参的值决定被调用过程中局部数组的大小——可变数组\n- 可变数组的大小只有到执行过程调用时才能确定\n\
    - 编译时可以确定数组的个数\n- 活动记录中只设置相应于可变数组的指针，而不包括这些数组的数据空间\n- 可变数组的数据空间放在活动记录之外\n\n###\
    \ 可变数组的空间分配\n\n```text\n调用过程 p 的活动记录\n被调用过程 q 的活动记录\ntop_ep\ntop_sp\n返回值域/参数域\n\
    控制链\n访问链/机器状态域\n局部/临时数据域\n返回值域/参数域\n控制链\n访问链/机器状态域\n局部数据域\npointer to array A\n\
    pointer to array B\n临时数据域\n数组A\n数组B\n```\n\n### 三、堆式存储分配\n\n- 如果具体的存储需求在编译时刻可以确定\n\
    \  - 采取静态存储分配策略\n- 如果某些存储需求在编译时不能确定，但在程序执行期间，在程序的入口点上可以知道\n  - 采用栈式存储分配策略\n- 栈式存储分配策略不能处理的存储需求：\n\
    \  - 程序设计语言中的某些数据结构的存储需求\n  - 活动停止时局部名字的值必须被保存下来\n  - 被调用过程的活动生存期超过调用过程的生存期，这种语言的过程间的控制流不能用活动树正确地描述。\n\
    \n共性：活动记录的释放不需要遵循先进后出的原则\n\n### 堆式存储分配与栈式存储分配的比较\n\n- 相同点：\n  - 动态存储分配\n- 不同点：\n\
    \  - 组织形式：栈、堆\n  - 释放顺序：\n    - 栈：先进后出\n    - 堆：任意\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_518_0.png)\n\
    \n![](img/12b57169bd1d5004c5e7193ff0d478d5_518_1.png)\n\n## 7.3 访问非局部名字\n\n- 对非局部名字的引用取决于作用域规则\n\
    \  - 静态作用域规则：词法作用域规则、最近嵌套规则\n  - 动态作用域规则：由运行时最近的活动决定可应用到一个名字上的声明\n- 对非局部名字的访问通过访问链实现\n\
    - 关键：访问链如何创建、使用、维护\n\n- 一、程序块\n- 二、非嵌套过程的静态作用域\n- 三、嵌套过程的静态作用域\n- 四、动态作用域\n\n\
    ### 一、程序块\n\n- 程序块的基本结构\n\n  ```text\n  begin\n  声明语句\n  语句序列\n  end\n  ```\n\n\
    - 块可以嵌套\n- 块之间的关系\n\n**最近嵌套规则**\n\n```text\nB1\nvar x, y\n\nB2\nvar x, a\n\nB3\n\
    var y\n\nB4\nvar a\n\nref. a, x, y\n```\n\n### 静态作用域举例\n\n```c\nmain()\n{\n  \
    \  int a=0;\n    int b=0;\n    {\n        int b=1;\n        {\n            int\
    \ a=2;\n            printf(\"%d %d\\n\",a,b);\n        }\n        {\n        \
    \    int b=3;\n            printf(\"%d %d\\n\",a,b);\n        }\n        printf(\"\
    %d %d\\n\",a,b);\n    }\n    printf(\"%d %d\\n\",a,b);\n}\n```\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_521_0.png)\n\
    \n| 变量值 |\n| --- |\n| a=0 |\n| b=0 |\n| b=1 |\n| b=3 |\n\n输出：\n\n2，1\n\n0，3\n\n\
    0，1\n\n0，0\n\n### 二、非嵌套过程的静态作用域\n\n- 过程定义不允许嵌套\n  - 独立的\n  - 顺序的\n- 声明语句的位置\n\
    \  - 过程/函数内部\n  - 所有过程之外\n- 在一个过程中引用的名字\n  - 局部的\n  - 全局的\n\n```c\nint a[11];\n\
    readarray()\n{ ... a ... }\nint partition(int y, int z)\n{ ... a ... }\nquicksort(int\
    \ m, int n)\n{ int i; ...\ni=partition(m,n);\nquicksort(m,i-1);\nquicksort(i+1,n);\
    \ }\nmain ()\n{ readarray();\n  quicksort(0,10); }\n```\n\n### 过程作为参数传递、作为结果返回\n\
    \n- 对非局部名字采用静态存储分配\n- 前提（源语言）\n  - 静态作用域规则\n  - 过程定义不允许嵌套\n- 效果\n  - 一个过程的非局部名，对其他过程也是非局部的\n\
    \  - 非局部名字的存储空间由编译程序静态地进行分配\n  - 它的静态地址在所有的过程中都可以引用\n  - 过程对非局部名字的引用与过程是如何激活的无关\n\
    - 结果\n  - 无论过程作为参数传递、还是作为结果返回，其中对非局部名字的引用，都是对静态分配给它的存储单元进行访问。\n\n"
