    # 五、 LALR(1)分析表的构造


    描述LR(1)项目集特征的两个定义


    定义4.18 如果两个LR(1)项目集去掉搜索符号之后是相同的，则称这两个项目集具有相同的心（core），即这两个项目集是同心集。


    定义4.19 除去初态项目集外，一个项目集的核（kernel）是由该项目集中那些圆点不在最左边的项目组成。LR(1)初态项目集的核中有且只有项目 [S''→·S,$]。'
  - '[PAGE 255]


    # 构造LR(1)分析表的基本思想


    +   - 合并LR(1)项目集规范族中的同心集，以减少分析表的状态数。

    +   - 用核代替项目集，以减少项目集所需的存储空间。

    +   - **go(I,X)**仅仅依赖于I的心，因此LR(1)项目集合并后的转移函数可以通过**go(I,X)**自身的合并得到。

    +   - **同心集的合并**，可能导致**归约-归约的冲突**，但不会产生新的移进-归约冲突'
  - '[PAGE 256]


    # 同心集的合并不会引进新的移进-归约冲突


    如果合并后的项目集中存在移进-归约冲突，则意味着：


    项目 **[A→α·,a]** 和 **[B→β·aγ,b]** 处于合并后的同一项目集中


    合并前必存在某个 c，使得 **[A→α·,a]** 和 **[B→β·aγ,c]** 同处于某个项目集中。


