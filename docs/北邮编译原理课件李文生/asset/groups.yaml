  - '[PAGE 280]


    # 七、 LR分析的错误处理与恢复


    +   LR分析程序可采取以下恢复策略：


    +   首先，从栈顶开始退栈，可能弹出0个或若干个状态，直到出现状态S为止，根据S在goto子表中可以找到一个非终结符号A，即它有关于A的转移；


    +   然后，抛弃0个或若干个输入符号，直到找到符号a为止，a∈FOLLOW(A)，即a可以合法地跟在A的后面；


    +   然后，分析程序把状态goto[S,A]压入栈，继续进行语法分析。


    +   在弹栈过程中出现的A可能不止一个，通常选择表示主要结构成分的非终结符号。


    +   实际上是跳过包含错误的一部分终结符号串。'
