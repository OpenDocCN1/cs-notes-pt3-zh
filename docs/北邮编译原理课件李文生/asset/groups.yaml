    # 6.4 类型检查


    +   - 静态类型检查：由编译程序完成的检查

    +   - 动态类型检查：目标程序运行时完成的检查

    +     - 如果目标代码把每个对象的类型和该对象的值一起保存，那么任何检查都可以动态完成。

    +   - 一个健全的类型体制不需要动态检查类型错误

    +   - 如果一种语言的编译程序能够保证它所接受的程序不会有运行时的类型错误，则称这种语言是强类型语言。

    +   - 有些检查只能动态完成

    +     - `char table[20];`

    +     - `int i;`

    +     - 计算table[i]'
