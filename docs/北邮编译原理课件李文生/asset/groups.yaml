    # 二、模拟继承属性的计算


    ■ 要想从栈中取得继承属性，**当且仅当**文法允许属性值在栈中存放的位置可以预测。


    例：属性值在栈中的位置不可预测的语法制导定义


    |  | 产生式 | 语义规则 |

    |---|---|---|

    | (1) | A→aXZ | Z.i=X.s |

    | (2) | **A→bXYZ** | Z.i=X.s |

