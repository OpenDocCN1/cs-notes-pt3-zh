    - 例如：预处理器可以将类似于while或if-then-else语句结构的内部宏提供给用户使用，而这些结构在原来的程序设计语言中是没有的。\n- 当程序中使用了这样的结构时，由预处理器通过宏调用实现语言功能的扩充。\n\
    \n## 二、汇编程序\n\n汇编语言用助记符表示操作码，用标识符表示存储地址。\n\n赋值语句b:=a+2相应的汇编语言程序为：\n\n```\nMOV\
    \ a, R1\nADD #2, R1\nMOV R1, b\n```\n\n最简单的汇编程序对输入作两遍扫描。\n\n### 第一遍\n\n- 找出标志存储单元的所有标识符，并将它们存储到汇编符号表中。\n\
    \  - 汇编符号表独立于编译程序的符号表。\n- 在符号表中指定该标识符所对应的存储单元地址，此地址是在首次遇到该标识符时确定的。\n- 假定一个字包括4个字节，每个变量占一个字，完成第一遍扫描后，得到汇编符号表：\n\
    \n| 标识符 | 地址 |\n|--------|------|\n| a      | 0    |\n| b      | 4    |\n\n###\
