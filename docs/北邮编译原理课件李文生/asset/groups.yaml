    +   • 函数：从定义域类型D到值域类型R的映射

    +   类型由类型表达式 D→R 表示。


    Pascal的内部函数 mod:

    int×int→int


    用户定义的Pascal函数: function f(a,b: char): ↑integer;

    f的类型表达式: char×char→pointer(integer)


    C 语言函数: int square(int x) { return x*x }

    square的类型表达式: integer→integer


    函数g:

    参数是把整数映射成整数的函数

    返回结果是和参数类型相同的另一函数

    g的类型表达式为:

    (integer→integer)→(integer→integer)


    +   – 类型表达式可以包含变量（称为类型变量），变量的值是类型表达式。'
