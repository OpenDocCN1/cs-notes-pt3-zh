    \ E₂.place);\n        E.type=real;\n    };\n    else if (E₁.type==real) && (E₂.type==integer)\
    \ {\n        u=newtemp;\n        emit(u ':=' 'inttoreal' E₂.place);\n        emit(E.place\
    \ ':=' E₁.place 'real+' u);\n        E.type=real;\n    };\n    else E.type=type_error;\
    \ }\n```\n\n```\nE→-E₁ { E.place=newtemp;\nemit(E.place ':=' 'uminus' E₁.place);\n\
    E.type=E₁.type }\n```\n\n```\nE→(E₁) { E.place=E₁.place;\nE.type=E₁.type }\n```\n\
    \n```\nE→id { p= lookup(id.name);\nif (p!=nil) {\n    E.place=p;\n    E.type=gettype(p);\n\
    };\nelse error(); }\n```\n\n## 翻译赋值语句 x:=y+i*j\n\n假设x和y的类型为real，i和j的类型为integer\n\
