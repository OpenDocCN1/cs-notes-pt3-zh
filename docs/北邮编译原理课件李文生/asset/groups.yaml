    # 4. 中间代码生成


    +   中间代码：一种抽象的机器程序


    +   中间代码应具有两个重要的特点：


    +   易于产生


    +   易于翻译成目标代码


    +   中间代码有多种形式


    +   三地址代码具有的特点：


    +   每条指令除了赋值号之外，最多还有一个运算符。


    +   编译程序必须生成临时变量名，以便保留每条指令的计算结果。


    +   有些“三地址”指令少于三个操作数'
