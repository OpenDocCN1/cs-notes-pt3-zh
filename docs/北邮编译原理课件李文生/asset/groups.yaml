    \ `%prec <terminal>` 来限制它的优先级。\n  - 它的优先级和结合性质同这个指定的终结符号的一样。\n  - 这个终结符号可以是一个占位符，不是由词法分析程序返回的记号，仅用来决定一个产生式的优先级。\n\
    \nYACC不报告用这种优先级和结合性质能够解决的移进-归约冲突。\n\n## 三、用LEX建立YACC的词法分析程序\n\n- **LEX编译器将提供词法分析程序\
    \ `yylex()`。**\n- 如果用LEX产生词法分析程序，则YACC说明文件中第三部分的函数 `yylex()` 应由语句 `#include \"\
    lex.yy.c\"` 代替。\n- 使用这条语句，程序 `yylex()` 可以访问YACC中记号的名字，因为LEX的输出是YACC输出文件的一部分，所以每个LEX动作都返回YACC知道的终结符号。\n\
    \n## 四、YACC内部名称\n\n| YACC内部名称 | 说明 |\n| --- | --- |\n| `y.tab.c` | YACC输出文件名 |\n\
    | `y.tab.h` | YACC生成的头文件，包含有记号定义 |\n| `yyparse` | YACC分析程序 |\n| `yylval` | 栈中当前记号的值\
    \ |\n| `yyerror` | 由YACC使用的用户定义的错误信息打印程序 |\n| `error` | YACC错误伪记号 |\n| `yyerrok`\
    \ | 在错误处理之后，使分析程序回到正常操作方式的程序 |\n| `yychar` | 变量，记录导致错误的先行记号 |\n| `YYSTYPE` | 定义分析栈值类型的预处理器符号\
    \ |\n| `yydebug` | 变量，当由用户设置为1时，生成有关分析动作的运行信息 |\n\n## 五、YACC使用方式\n\n- YACC（Yet\
    \ Another Compiler-Compiler）\n- YACC使用方式：\n\n```text\nYACC说明文件 translate.y → YACC编译器\
    \ → Y.tab.c\n%yacc translate.y\n\nY.tab.c → C语言编译程序 → a.out\n%cc y.tab.c -ly -o\
    \ a.out\n\n输入 → a.out → 输出\n```\n\n## 第5章 语法制导翻译技术\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_304_0.png)\n\
    \n知识点：语法制导定义、翻译方案\n\n- S-属性定义、L-属性定义\n- S-属性定义的翻译\n- L-属性定义的翻译\n\n## 语法制导翻译技术\n\
    \n- 语义分析涉及到语言的语义\n- 形式语义学的研究开始于20世纪60年代初\n- 形式语义学可以分为三类\n  - 操作语义学：通过说明程序在一个机器中是如何执行的来定义程序的语义，着重模拟数据加工过程中计算机系统的操作\n\
    \  - 指称语义学：使用数学函数来描述程序和程序的构成，函数通过把语义值联系到正确的语法结构来描述程序的语义，主要描述数据加工的结果\n  - 公理语义学：把数理逻辑应用于语言的语义，语言结构与谓词转换器联系在一起，语言结构的行为以命题刻画，通过描述程序执行对程序断言的影响来定义程序、语句或语言结构的语义，主要用于程序正确性证明\n\
    - 语法制导翻译技术\n  - 多数编译程序普遍采用的一种技术\n  - 比较接近形式化\n\n## 语法制导翻译技术\n\n- 根据翻译目标的要求确定每个产生式所包含的语义；\n\
    - 根据产生式包含的语义，分析文法中每个符号的语义；\n- 把这些语义以属性的形式附加到相应的文法符号上；\n- 根据产生式的语义，给出符号属性的求值规则（即语义规则），从而形成语法制导定义。\n\
    - 在语法分析过程中，当使用该产生式时，根据语义规则对相应的属性进行求值，从而完成翻译。\n\n例如：考虑算术表达式文法\n\n- 总目标：计算表达式的值\n\
    - 产生式 E→E₁+T 的语义：表达式的值由两个子表达式的值相加得到\n- 分析每个符号的语义，并以属性的形式记录：E.val、E₁.val、T.val\n\
    - 求值规则：E.val=E₁.val+T.val\n- 语法制导定义：产生式 语义规则\n\n| 产生式 | 语义规则 |\n| --- | --- |\n\
    | E→E₁+T | E.val=E₁.val+T.val |\n| E→T | E.val=T.val |\n| T→T₁*F | T.val=T₁.val*F.val\
    \ |\n| T→F | T.val=F.val |\n| F→(E) | F.val=E.val |\n| F→digit | F.val=digit.val\
    \ |\n\n## 语法制导翻译技术（续）\n\n- 例如：考虑算术表达式文法\n  - 总目标：检查表达式的类型\n  - 产生式 E→E₁+T 的语义：表达式的类型由两个子表达式的类型综合得到\n\
    \  - 分析每个符号的语义，并以属性的形式记录：E.type、E₁.type、T.type\n  - 求值规则：\n\n```c\nif (E₁.type==integer)&&(T.type==integer)\n\
    \    E.type=integer;\nelse ...\n```\n\n## 翻译结果——取决于翻译目标\n\n- 生成代码\n  - 可以为源程序产生中间代码\n\
    \  - 可以直接生成目标机指令\n- 对输入符号串进行解释执行\n- 向符号表中存放信息\n- 给出错误信息\n- 翻译的结果依赖于语义规则\n  - 使用语义规则进行计算所得到的结果就是对输入符号串进行翻译的结果。\n\
    \  - 如：E→E+T 的翻译结果可以是：计算表达式的值、检查表达式的类型是否合法、为表达式创建语法树、生成代码等等。\n\n## 语法制导翻译技术（续）\n\
    \n- 进一步：\n  - 用一个或多个子程序（称为语义动作）所要完成的功能描述产生式的语义；\n  - 把语义动作插入到产生式中相应位置，从而形成翻译方案。\n\
    \  - 在语法分析过程中使用该产生式时，在适当的时机调用这些动作，完成所需要的翻译。\n- 语法制导定义是对翻译的高层次的说明，它隐藏了一些实现细节，无须指明翻译时语义规则的计算次序。\n\
    - 翻译方案指明了语义规则的计算次序，规定了语义动作的执行时机。\n\n## 语法制导翻译的一般步骤\n\n```text\n输入符号串\n→ 分析树\n\
    → 依赖图\n→ 语义规则的计算顺序\n→ 计算结果\n```\n\n## 语法制导翻译技术\n\n- 5.1 语法制导定义及翻译方案\n- 5.2 S-属性定义的自底向上翻译\n\
    - 5.3 L-属性定义的自顶向下翻译\n- 5.4 L-属性定义的自底向上翻译\n- 小结\n\n## 本节内容安排\n\n- 一、语法制导定义\n- 二、依赖图\n\
    - 三、计算次序\n- 四、S属性定义和L属性定义\n- 五、翻译方案\n\n## 一、语法制导定义\n\n在一个语法制导定义中，对应于每一个文法产生式 A→α，都有与之相联系的一组语义规则，其形式为：\n\
    \nb=f(c₁, c₂, ···, cₖ)\n\n这里，f是一个函数，而且或者\n\n1. b是A的一个综合属性，且c₁、c₂、···、cₖ是产生式右部文法符号的属性，或者\n\
    2. b是产生式右部某个文法符号的一个继承属性，且c₁、c₂、···、cₖ是A或产生式右部任何文法符号的属性。\n\n- 属性b依赖于属性c₁、c₂、···、cₖ。\n\
    - 语义规则函数都不具有副作用的语法制导定义称为属性文法。\n\n## 语义规则\n\n- 一般情况：\n  - 语义规则函数可写成表达式的形式。\n- 某些情况下：\n\
    \  - 一个语义规则的唯一目的就是产生某个副作用，如打印一个值、向符号表中插入一条记录等；\n  - 这样的语义规则通常写成过程调用或程序段。\n  -\
    \ 可以看成是相应产生式左部非终结符号的虚拟综合属性。\n  - 虚属性和符号 ‘=’ 都没有表示出来。\n\n## 简单算术表达式求值的语法制导定义\n\n\
    | 产生式 | 语义规则 |\n| --- | --- |\n| L→E | print(E.val) |\n| E→E₁+T | E.val=E₁.val+T.val\
    \ |\n| E→T | E.val=T.val |\n| T→T₁*F | T.val=T₁.val*F.val |\n| T→F | T.val=F.val\
    \ |\n| F→(E) | F.val=E.val |\n| F→digit | F.val=digit.lexval |\n\n- 综合属性val与每一个非终结符号E、T、F相联系。\n\
    - 表示相应非终结符号所代表的子表达式的整数值。\n- L→E的语义规则是一个过程，打印出由E产生的算术表达式的值，可以认为是非终结符号L的一个虚拟综合属性。\n\
    \n"
