    \n输出：语法制导翻译程序\n\n方法：（修改预测分析程序的构造技术）\n\n1. 为每个非终结符号 A 建立一个函数（可以是递归函数）\n   - A 的每一个继承属性对应函数的一个形参\n\
    \   - A 的综合属性作为函数的返回值\n   - A 产生式中的每个文法符号的每个属性都对应一个局部变量\n2. A 的函数的代码由多个分支组成\n\
    3. 与每个产生式相关的程序代码\n   - 按照从左到右的顺序考虑产生式右部的记号、非终结符号和语义动作\n   - 对带有综合属性 x 的记号 X\n\
    \     - 把属性 x 的值保存于为 X.x 声明的变量中\n     - 产生一个匹配记号 X 的调用\n     - 推进扫描指针\n   - 对非终结符号\
    \ B\n     - 产生一个函数调用语句 c = B(b₁, b₂, …, bₖ)\n       - bᵢ（i = 1, 2, …, k）是对应于 B\
    \ 的继承属性的变量\n       - c 是对应于 B 的综合属性的变量\n   - 对每一个语义动作\n     - 把动作代码复制到分析程序中\n\
    \     - 用代表属性的变量代替翻译方案中引用的属性\n\n### 例：为简单表达式求值的翻译方案\n\n构造翻译程序\n\n- 为每个非终结符号构造一个函数\n\
    \  - `void L(void)`\n  - `int E(void)`\n  - `int M(int in)`\n  - `int T(void)`\n\
    \  - `int N(int in)`\n  - `int F(void)`\n\n### 分别与 E→TM、M→+TM|ε 相应的分析过程\n\n```c\n\
    // E→TM\nvoid proc_E(void) {\n    proc_T();\n    proc_M();\n}\n\n// M→+TM|ε\n\
    void proc_M(void) {\n    if (lookahead == '+') {\n        match('+');\n      \
    \  proc_T();\n        proc_M();\n    }\n}\n```\n\n### 实现翻译方案的函数\n\n```c\nint E(void)\
    \ {\n    int eval, tval, mi, ms;\n    tval = T();\n    mi = tval;\n    ms = M(mi);\n\
    \    eval = ms;\n    return eval;\n}\n```\n\n对应的翻译方案：\n\n`E → T { M.i = T.val\
    \ } M { E.val = M.s }`\n\n### 实现翻译方案的函数\n\n```c\nint M(int in) {\n    int tval,\
    \ i1, s1, s;\n    char addoplexeme;\n    if (lookahead == '+') {   // 产生式 M→+TM\n\
    \        addoplexeme = lexval;\n        match('+');\n        tval = T();\n   \
    \     i1 = in + tval;\n        s1 = M(i1);\n        s = s1;\n    } else\n    \
