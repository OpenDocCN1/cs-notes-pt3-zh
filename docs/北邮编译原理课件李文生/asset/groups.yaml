  - '[PAGE 470]


    # 一、函数和运算符的重载


    +   - 在数学中，加法运算符‘+’是重载的

    +     - 当A和B是整数、实数、复数或矩阵时，表达式A+B中的‘+’具有不同的含义。

    +   - 重载符号的含义依赖于上下文

    +   - 在重载符号的引用点，其含义能够确定到唯一，叫做重载的消除。

    +     - 重载的消除有时也称为算符的辨别，因为它确定了运算符表示哪种运算。

    +   - 大多数语言中，算术运算符是重载的，并且它们的重载可以通过查看其操作对象来消除。'
  - '[PAGE 471]


    # 类型集合


    +   - 仅通过检查函数的参数类型并不一定能消除重载

    +     - 因为一个子表达式可能有不止一个类型，而是有 一个可能的 类型集合

    +     - 上下文要提供足够的信息来缩小这个集合到唯一的类型


    +   - 例：用C++语言描述的三个重载的函数min的定义：

    +     min_1: int min(int x, int y) { return x<y ? x : y; }

    +     min_2: double min(double x, double y) { return x<y ? x : y; }

    +     min_3: int min(int x, int y, int z) { return x<y ? (x<z? x:z) : (y<z ? y:z);
    }


    +   - 调用：

    +     (1) min(3, 7);    // call min_1

    +     (2) min(3.3, 7.7);    // call min_2

    +     (3) min(3, 7, 5);    // call min_3

    +     (4) min(3.3, 7);    // call min_???,


    min(3, 7);    // call min_1

    min(3.3, 7.0); // call min_2

    取决于类型转换规则

    C++，都可以

    Java，后者

    Ada，都不可以'
  - '[PAGE 472]


    增加如下定义后，调用(4)在Ada和C++中均合法：

