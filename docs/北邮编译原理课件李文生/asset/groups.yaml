    \ i int* j\nt3 := inttoreal t1\nt2 := y real+ t3\nx := t2\n```\n\n## 二、涉及数组元素的赋值语句\n\
    \n## 1. 计算数组元素的地址\n\n- 数组元素存储在一个连续的存储块中，根据数组元素的下标可以快速地查找每个元素。\n\n### 一维数组A\n\n\
    ![](img/12b57169bd1d5004c5e7193ff0d478d5_579_0.png)\n\n基址： base\n域宽： w\n元素个数：\
    \ high-low+1\n\n下界 low\n\n元素 i\n\n上界 high\n\n# 数组元素A[i]的位置：\n\n```\nbase + ( i-low\
    \ )×w\n= i×w + base - low×w\n```\n\n## ■ 二维数组A\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_580_0.png)\n\
    \n# 存储方式：\n\n按行存放\n\n按列存放\n\n每维的下界：$low_1$、$low_2$\n\n每维的上界：$high_1$、$high_2$\n\
    \n每维的长度：$n_1=high_1-low_1+1$\n\n$n_2=high_2-low_2+1$\n\n域宽：$w$　　基址：$base$\n\n\
    # 数组元素 A[i,j] 的位置：\n\n$$base+((i-low_1)\\times n_2+(j-low_2))\\times w$$\n\n$$=(i\\\
    times n_2+j)\\times w+base-(low_1\\times n_2+low_2)\\times w$$\n\n## K维数组A\n\n\
    每维的下界： low₁、 low₂、 ...、 lowₖ\n\n每维的长度： n₁、 n₂、 ...、 nₖ\n\n存储方式： 按行存放\n\n数组元素A[i₁,\
    \ i₂, ..., iₖ]的位置：\n\n((...(i₁×n₂+i₂)×n₃+i₃)... )×nₖ+iₖ)×w + base - ((...(low₁×n₂+low₂)×n₃+low₃)...\
    \ )×nₖ+lowₖ)×w\n\n递归计算：\n\ne₁=i₁\n\ne₂=e₁×n₂+i₂\n\ne₃=e₂×n₃+i₃\n\neₖ=eₖ₋₁×nₖ+iₖ\n\
    \n## 2. 涉及数组元素的赋值语句的翻译 ——L属性定义\n\n语句 X:=A [ i, j ] 的分析树\n\n赋值语句的文法：\n\n- (1) S→L:=E\n\
    - (2) E→E₁+E₂\n- (3) E→(E₁)\n- (4) E→L\n- (5) L→id\n- (6) L→id [ Elist ]\n- (7)\
    \ Elist→E\n- (8) Elist→Elist₁ , E\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_582_0.png)\n\
    \n## 属性及函数设计\n\n- **L 综合属性L.place和L.offset**\n  - 简单变量：\n    - L.offset=null \
    \       L.place=符号表入口指针\n  - 数组元素：\n    - L.offset=计算公式第一项        L.place=计算公式第二项\n\
    - **E 综合属性E.place，保存E值的变量在符号表中的位置**\n- **Elist 继承属性array，综合属性ndim，place**\n  -\
    \ Elist.array：数组名在符号表中的位置\n  - Elist.ndim：目前已经识别出的下标表达式的个数\n  - Elist.place：保存递推公式中eₘ值的临时变量在符号表中的位置\n\
    - **函数**\n  - limit(array, j)：返回array指向的数组第 j 维的长度\n  - invariant(array)：返回array指向的数组的地址计算公式中的不变项\n\
    \n## L属性定义翻译方案\n\n```\nS→L:=E { if (L.offset==null) /* L是简单变量 */\n    emit(L.place\
    \ ':=' E.place);\n    else emit(L.place '[' L.offset ']' ':=' E.place) }\n```\n\
    \n```\nE→E₁+E₂ { E.place=newtemp;\n    emit(E.place ':=' E₁.place '+' E₂.place)\
    \ }\n```\n\n```\nE→(E₁) { E.place=E₁.place }\n```\n\n```\nE→L { if (L.offset ==\
    \ null) /* L是简单变量 */\n    E.place=L.place;\n    else {\n        E.place=newtemp;\n\
    \        emit(E.place ':=' L.place '[' L.offset ']'); } \n}\n```\n"
