    # 名字等价把每个类型名看成是一个可区别的类型


    +   - 两个类型表达式名字等价，当且仅当它们完全相同

    +   - 所有的名字被替换后，两个类型表达式成为结构等价的类型表达式，那么这两个表达式结构等价。

    +   - 声明中的变量及其类型表达式：


