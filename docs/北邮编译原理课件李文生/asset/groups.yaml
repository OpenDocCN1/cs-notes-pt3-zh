    x[0]:=0

    x[4]:=0

    ...

    x[36]:=0


    # 循环展开：'
  - "[PAGE 698]\n\n# 二、代码外提/频度削弱\n\n+   - 减少循环中代码总数的一个重要方法\n+   - 对于包含在循环里的基本块，如果其中的某些代码与循环无关，则可把这样的代码移到循环之外以减少其计算频度，通常移到循环的前边。\n\
    +   - 如C语言程序中的语句：\n+     ```c\n+     while (i<=limit-2) {\n+         ...\n+  \
    \   }\n+     ```\n+   - 如果limit的值在循环过程中保持不变，则limit-2的计算与循环无关\n\n```\nt=limit-2;\n\
    while (i<=t) {\n    ...\n}\n```"
  - '[PAGE 699]


