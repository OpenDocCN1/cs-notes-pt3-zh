  - "[PAGE 449]\n\n# 测试两个类型表达式结构等价的算法\n\n输入：两个类型表达式s和t\n\n输出：如果s和t结构等价，则返回true，否则返回false\n\
    \n方法：\n\n```\nbool sequiv(bexpr s, t)\n{\n    if (s和t是同样的基本类型) return 1;\n   \
    \ else if (s==array(s₁,s₂))&&(t==array(t₁,t₂))\n        return sequiv(s₁,t₁) &&\
    \ sequiv(s₂,t₂);\n    else if (s==s₁×s₂)&&(t==t₁×t₂)\n        return sequiv(s₁,t₁)\
    \ && sequiv(s₂,t₂);\n    else if (s==pointer(s₁))&&(t==pointer(t₁))\n        return\
    \ sequiv(s₁,t₁);\n    else if (s==s₁→s₂)&&(t==t₁→t₂)\n        return sequiv(s₁,t₁)\
    \ && sequiv(s₂,t₂);\n    else return 0;\n}.\n```"
