  - '[PAGE 492]


    # 活动的生存期


    +   - 程序执行时, 过程之间的控制流

    +     - 是连续的

    +     - 过程的每一次执行都是从过程体的起点开始, 最后控制返回到直接跟随本次调用点的位置。


    +   - 活动的生存期

    +     - 过程体的执行中, 第一步和最后一步之间的一系列步骤的执行时间

    +     - 过程P的一次活动的生存期, 包括执行过程P所调用的过程的时间, 以及这些过程所调用的过程的时间

    +     - 如果a和b是过程的活动, 那么它们的生存期要么是不重叠, 要么是嵌套的。


    +   - 递归过程:

    +     - 如果一个过程, 它的不同活动的生存期可以嵌套, 则这个过程是递归的

    +     - 直接递归、间接递归'
