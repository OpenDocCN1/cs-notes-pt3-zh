    # # 四、错误处理


    在编译的每个阶段都可能检测到源程序中存在的错误


    +   - 词法分析程序可以检测出非法字符错误。

    +   - 语法分析程序能够发现记号流不符合语法规则的错误。

    +   - 语义分析程序试图检测出具有正确的语法结构，但对所涉及的操作无意义的结构。

    +   - 代码生成程序可能发现目标程序区超出了允许范围的错误。

    +   - 由于计算机容量的限制，编译程序的处理能力受到限制而引起的错误。


