    \n- LR分析控制程序的工作过程\n\n  - 分析开始时，初始的二元式为：(S₀, a₁a₂...aₙ$)\n\n  - 分析过程中每一步的结果，均可表示为如下的二元式：(S₀X₁S₁X₂...XₘSₘ,\
    \ aᵢaᵢ₊₁...aₙ$)\n\n  - 若action[Sₘ, aᵢ]=shift S，并且 S=goto[Sₘ, aᵢ]，则二元式变为：(S₀X₁S₁X₂...XₘSₘaᵢS,\
    \ aᵢ₊₁...aₙ$)\n\n  - 若action[Sₘ, aᵢ]=reduce by A→β，则二元式变为：(S₀X₁S₁X₂...Xₘ₋ᵣSₘ₋ᵣAS,\
    \ aᵢaᵢ₊₁...aₙ$)\n\n  - 若action[Sₘ, aᵢ]=accept（接受），表示分析成功，二元式变化过程终止。\n\n  - 若action[Sₘ,\
    \ aᵢ]=error（出错），表示发现错误，调用错误处理程序。\n\n## “活前缀”的概念\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_212_0.png)\n\
    \n定义：一个规范句型的一个前缀，如果不含句柄之后的任何符号，则称它为该句型的一个活前缀。\n\n例：右句型aAbcde的句柄是Ab\n\n该句型的活前缀有ε、a、aA、aAb；\n\
    \n句型aAcde的句柄是d\n\n它的活前缀有：ε、a、aA、aAc、aAcd。\n\n之所以称它们为活前缀，是因为在其右边增加某些终结符号之后，就可以使之成为一个规范句型。\n\
    \n分析过程中 (S₀X₁S₁X₂...XₘSₘ, aᵢaᵢ₊₁...aₙ$)\nX₁X₂...Xₘaᵢaᵢ₊₁...aₙ是一个右句型，\nX₁X₂...Xₘ是它的一个活前缀。\n\
    \n## 例：对输入符号串id+id*id的分析过程\n\n| 栈 | 输入 | 分析动作 |  |\n|---|---|---|---|\n| 0 | id+id*id$\
    \ | shift 5 |  |\n| 0id5 | +id*id$ | reduce by F→id | goto[0,F]=3 |\n| 0F3 | +id*id$\
    \ | reduce by T→F | goto[0,T]=2 |\n| 0T2 | +id*id$ | reduce by E→T | goto[0,E]=1\
    \ |\n| 0E1 | +id*id$ | shift 6 |  |\n| 0E1+6 | id*id$ | shift 5 |  |\n| 0E1+6id5\
    \ | *id$ | reduce by F→id | goto[6,F]=3 |\n| 0E1+6F3 | *id$ | reduce by T→F |\
    \ goto[6,T]=9 |\n| 0E1+6T9 | *id$ | shift 7 |  |\n| 0E1+6T9*7 | id$ | shift 5\
    \ |  |\n| 0E1+6T9*7id5 | $ | reduce by F→id | goto[7,F]=10 |\n| 0E1+6T9*7F10 |\
    \ $ | reduce by T→T*F | goto[6,T]=9 |\n| 0E1+6T9 | $ | reduce by E→E+T | goto[0,E]=1\
    \ |\n| 0E1 | $ | acc |  |\n\n## 三、 SLR(1)分析表的构造\n\n- 中心思想：\n  - 为给定的文法构造一个识别它所有活前缀的DFA\n\
    \  - 根据该DFA构造文法的分析表\n- 构造识别给定文法的所有活前缀的DFA\n- SLR(1)分析表的构造\n\n## 构造识别给定文法所有活前缀的DFA\n\
    \n- 活前缀与句柄之间的关系\n  - 活前缀不含有句柄的任何符号\n  - 活前缀只含有句柄的部分符号\n  - 活前缀已经含有句柄的全部符号\n\n\
