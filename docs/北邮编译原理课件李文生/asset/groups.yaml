  - '[PAGE 385]


    # 解决方法


    +   改写文法，使类型作为标识符表的最后一个元素

    +   D→idL

    +   L→,idL | :T

    +   T→integer | real


    +   改写后：

    +   归约从右向左进行，类型信息从右向左传递

    +   仅用综合属性即可把类型信息和标识符联系起来

    +   D→idL    addtype(id.entry,L.type)

    +   L→,idL₁    L.type=L₁.type; addtype(id.entry,L₁.type)

    +   L→:T      L.type=T.type

    +   T→integer  T.type=integer

    +   T→real     T.type=real


