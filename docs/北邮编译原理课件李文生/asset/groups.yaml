  - '[PAGE 491]


    # 活动


    +   - 活动

    +     - 一个过程的每次执行称为它的一次活动

    +     - 如果一个过程在执行中，则称它的这次活动是活着的

    +   - 过程与活动

    +     - 过程是一个静态概念，活动是一个动态概念

    +     - 过程与活动之间可以是1:1、1:m的关系

    +     - 递归过程，同一时刻可能有若干个活动是活着的

    +     - 每个活动都有自己独立的存储空间/数据空间


