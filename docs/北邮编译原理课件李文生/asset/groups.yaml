    # # 简介


    +   ## 什么是编译？

    +   - 把源程序转换成等价的目标程序的过程即是编译。


    +   ## 编译程序的设计涉及到的知识：

    +   - 程序设计语言

    +   - 形式语言与自动机理论

    +   - 计算机体系结构

    +   - 数据结构

    +   - 算法分析与设计

    +   - 操作系统

    +   - 软件工程等'
