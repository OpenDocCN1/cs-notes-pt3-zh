  - '[PAGE 10]


    # # 一、程序设计语言


    # ## 低级语言


    +   - 机器语言

    +   - 符号语言 汇编语言


    # ## 高级语言


    +   - 过程性语言—面向用户的语言 如： C、Pascal

    +   - 专用语言—面向问题的语言 如： SQL

    +   - 面向对象的语言 如： Java、C++'
  - '[PAGE 11]


    # # 高级语言的优点


    +   - 高级语言独立于机器。所编程序移植性比较好。

    +   - 不必考虑存储单元的分配问题，数据的外部形式转换成机器的内部形式等细节。

    +     - 用变量描述存储单元

    +   - 具有丰富的数据结构和控制结构。

    +     - 数据结构：数组、记录等

    +     - 控制结构：循环、分支、过程调用等。

    +   - 更接近于自然语言。

    +     - 可读性好，便于维护。

    +   - 编程效率高。'
  - '[PAGE 12]


    # ## 二、翻译程序


    翻译程序扫描所输入的源程序，并将其转换为目标程序，或将源程序直接翻译成结果。


    源程序 → 翻译程序 → 目标程序或执行结果


    翻译程序分为两大类：


    +   - 编译程序（即编译器）：把源程序翻译成目标程序的翻译程序。


    +   - 解释程序（即解释器）：直接执行源程序的翻译程序。'
  - '[PAGE 13]


    # # 编译程序


    +   - 源程序是用高级语言或汇编语言编写的，目标程序是用目标语言表示的。

    +   - 两类编译程序：

    +     - 汇编程序

    +     - 编译程序


    汇编语言程序 → 汇编程序 → 机器语言程序


    高级语言程序 → 编译程序 → 低级语言程序'
  - '[PAGE 14]


    # # 编译和执行阶段


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_14_0.png)


    +   - 编译时间：实现源程序到目标程序的转换所占用的时间。

    +   - 源程序和数据是在不同时间（即分别在编译阶段和运行阶段）进行处理的。'
  - '[PAGE 15]


    # # 解释程序


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_15_0.png)


    +   - 解释程序解释执行源程序，不生成目标程序

    +   - 同时处理源程序和数据

    +   - 一种有效的方法：先将源程序转换为某种中间形式，然后对中间形式的程序解释执行。'
  - '[PAGE 16]


    # total:=total+rate*4 的解释过程


    +   解释程序先将源程序转换成一棵树


    +   遍历该树，执行结点上所规定的动作。


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_16_0.png)'
  - "[PAGE 17]\n\n# # Java语言处理器\n\n+   结合了编译和解释过程\n+   \n+   - 编译： 一个Java源程序首先被编译成一个称为字节码（bytecode）的中间表示形式。\n\
    +   - 解释： Java虚拟机对字节码解释执行。\n\n+   即时（Just-in-time）编译\n+   \n+   - Java即时编译器在运行中间程序处理输入的前一刻首先把字节码翻译成为机器语言，然后再执行程序。"
