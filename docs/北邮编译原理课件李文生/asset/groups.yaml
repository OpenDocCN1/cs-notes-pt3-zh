  - '[PAGE 467]


    # 五、类型转换


    +   例如：

    +   int x=5;

    +   x=2.1+x/2;


    +   等价于： x=int(2.1+double(x/2))， 结果： x=4


    +   如果从一种数据类型转换成另一种数据类型可以由编译程序自动完成，则这种类型转换是隐式的，隐式转换也叫做强制转换。


    +   如果转换必须由程序员显式地写在源程序中，则这种转换叫做显式转换。


    +   显式的类型转换对类型检查程序来说好像函数调用'
