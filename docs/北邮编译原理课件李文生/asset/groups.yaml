    \ | Lᵢ |\n|  | Vᵢ₁ | Lᵢ₁ |\n|  | ... | ... |\n|  | Vᵢⱼ | Lᵢⱼ |\n|  | Vᵢⱼ₁ | Lᵢⱼ₁\
