  - '[PAGE 216]


    # 构造识别给定文法所有活前缀的DFA


    +   - 活前缀与句柄之间的关系

    +     - 活前缀不含有句柄的任何符号

    +     - 活前缀只含有句柄的部分符号

    +     - 活前缀已经含有句柄的全部符号


    +   - 分析过程中，分析栈中出现的活前缀

    +     - 第一种情况，期望从剩余输入串中能够看到由某产生式 A→α 的右部 α 所推导出的终结符号串；

    +     - 第二种情况，某产生式 A→α₁α₂ 的右部子串 α₁ 已经出现在栈顶，期待从剩余的输入串中能够看到 α₂ 推导出的符号串；

    +     - 第三种情况，某一产生式 A→α 的右部符号串 α 已经出现在栈顶，用该产生式进行归约。'
  - '[PAGE 217]


    # LR(0)项目


    +   - 右部某个位置上标有圆点的产生式称为文法G的一个LR(0)项目

    +   - 产生式A→XYZ对应有4个LR(0)项目

    +     - A→·XYZ

    +     - A→X·YZ

    +     - A→XY·Z

    +     - A→XYZ·


    移进-待约项目


    归约项目


    +   - **归约项目**：圆点在产生式最右端的LR(0)项目

    +   - **接受项目**：对文法开始符号的归约项目

    +   - **待约项目**：圆点后第一个符号为非终结符号的LR(0)项目

    +   - **移进项目**：圆点后第一个符号为终结符号的LR(0)项目


    产生式A→ε，只有一个LR(0)归约项目 A→·。'
  - '[PAGE 218]


    # 拓广文法


    +   任何文法G=(V_T,V_N,S,φ)，都有等价的文法 G''=(V_T,V_N ∪ {S''},S'',φ ∪ {S''→S})，称G''为G的拓广文法。


    +   拓广文法G''的接受项目是唯一的(即S''→S·)'
  - '[PAGE 219]


    # 定义4.10：LR(0)有效项目


    项目 A→β₁·β₂ 对活前缀 γ=αβ₁ 是有效的，如果存在一个规范推倒导：


    S ⇒* αAω ⇒* αβ₁β₂ω。


    +   - **推广：** 若项目 A→α·Bβ 对活前缀 γ=δα 是有效的，并且 B→η 是一个产生式，则项目 B→·η 对活前缀 γ=δα 也是有效的。


    +   - LR(0) 项目 S′→·S 是活前缀 ε 的有效项目

    +     （这里取 γ=ε，β₁=ε，β₂=S，A=S′）'
  - '[PAGE 220]


    # 定义4.11：LR(0)有效项目集

    和LR(0)项目集规范族


    文法G的某个活前缀γ的所有LR(0)有效项目组成的集合称为γ的LR(0)有效项目集。


    文法G的所有LR(0)有效项目集组成的集合称为G的LR(0)项目集规范族。'
  - '[PAGE 221]


    # 定义4.12：闭包(closure)


    设I是文法G的一个LR(0)项目集合，closure(I)是从I出发，用下面的方法构造的项目集：


    +   (1) I中的每一个项目都属于closure(I);


    +   (2) 若项目A→α·Bβ属于closure(I)，且B→η是G的一个产生式，若B→·η不属于closure(I)，则将B→·η加入closure(I);


    +   (3) 重复规则(2)，直到closure(I)不再增大为止。'
  - '[PAGE 222]


    # 定义4.13：转移函数go


    若I是文法G的一个LR(0)项目集，X是一个文法符号，定义


    go(I,X)=closure(J)


    其中：J={ A→αX·β | 当 A→α·Xβ 属于 I 时 }


    go(I,X)称为转移函数


    项目A→αX·β称为A→α·Xβ的后继


    直观含义：若I中的项目A→α·Xβ是某个活前缀γ=δα的有效项目，J中的项目A→αX·β是活前缀δαX（即γX）的有效项目。'
  - "[PAGE 223]\n\n# 算法4.4 构造文法G的LR(0)项目集规范族\n\n输入： 文法G\n\n输出： G的LR(0)项目集规范族C\n\n\
    方法：\n\n```\nC={closure({S'→·S})};\ndo\n    for (对C中的每一个项目集I和每一个文法符号X)\n      \
    \  if (go(I,X)不为空，且不在C中)\n            把go(I,X)加入C中;\nwhile (没有新项目集加入C中);\n```\n\
    \n这里closure({S'→·S})是活前缀 ε 的有效项目集"
