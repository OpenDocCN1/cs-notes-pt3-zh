  md: "\n## 一、传值调用\n\n- 最一般、最简单的参数传递方法\n- 先计算出实参的值，然后将其右值传递给被调用过程，参数值在过程执行时如同常数。\n\
    - 如：有函数声明：\n\n```cpp\nint max(int x, int y) { return x>y? x:y; }\n```\n- `max(5,\
    \ 3+4)`：\n  - 将x替换为5，y替换为7，得到：5>7? 5:7。\n\n- 用相应的实参的值替代过程体中出现的所有形参。\n- 是C++和Pascal语言的内置机制，本质上，也是C语言和Java语言参数传递的唯一机制。\n\
    - 在这些语言中，参数被看作是过程的局部变量，初值由调用时的实参给出。\n- 在过程中，参数和局部变量一样可以被赋值，但其结果不影响过程体之外的变量的值。\n\
    \n## 2021年第5期 中国远程教育\n\n## 智能家居\n\n智能家居是以住宅为平台，利用综合布线技术、网络通信技术、安全防范技术、自动控制技术、音视频技术将家居生活有关的设施集成，构建高效的住宅设施与家庭日程事务的管理系统。\n\
    \n智能家居系统的主要功能包括：\n\n- 智能灯光控制\n- 智能电器控制\n- 智能安防监控\n- 智能环境监测\n- 智能影音娱乐\n\n智能家居的发展经历了三个阶段：智能单品阶段、互联互通阶段和系统智能化阶段。随着人工智能和物联网技术的快速发展，智能家居正朝着更加智能化、个性化和主动服务的方向演进。\n\
    \n> 科技让生活更美好\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_543_0.png)\n\n| 设备类型\
    \ | 功能描述 |\n| -------- | -------- |\n| 智能门锁 | 远程开锁、指纹识别 |\n| 智能摄像头 | 实时监控、移动侦测\
    \ |\n| 智能窗帘 | 定时开关、光线感应 |\n| 智能音箱 | 语音控制、音乐播放 |\n\n在未来，智能家居将与智慧社区、智慧城市深度融合，为用户提供更加便捷、舒适、安全的居住体验。\n\
    \n## 参数是指针类型的情况\n\n- 传值调用并不意味着参数的使用一定不会影响过程体外变量的值。\n- 如果参数的类型为指针或引用，参数的值就是一个地址\n\
    \  - 通过它可以改变过程体外部的内存值。如，有C语言函数\n    ```c\n    void init_ptr(int* p)\n    { *p=3;\
    \ }\n    ```\n  - 对参数p的直接赋值不会改变过程体外的实参的值。如：\n    ```c\n    void init_ptr(int*\
    \ p)\n    { p=(int*) malloc(sizeof(int)); }\n    ```\n- 在一些语言中，某些值是隐式指针或引用\n \
    \ - 如C语言中的数组是隐式指针（指向数组的第一个位置）\n  - 可以使用数组参数来改变存储在数组中的值。如：\n    ```c\n    void\
    \ init_array_0(int p[])\n    { p[0]=0; }\n    ```\n\n## 二、引用调用\n\n- 原则上要求：实参必须是已经分配了存储空间的变量。\n\
    - 调用过程把一个指向实参存储单元的指针传递给被调用过程的相应形参\n- 在目标代码中，被调用过程通过传递给形参的指针间接地引用实参，因此，可以把形参看成是实参的别名，任何对形参的引用就是对相应实参的引用。\n\
    - Fortran语言中唯一的参数传递机制。\n- 在Pascal语言中，通过在形参前加关键字var来指定采用引用调用机制。\n  ```\n  procedure\
    \ inc_1(var x: integer);\n  begin x:=x+1 end;\n  ```\n- 在C++中，通过在形参的类型关键字后加符号\
    \ ‘&’来指明采用引用调用机制，如：\n  ```\n  void inc_1(int& x) { x++; }\n  ```\n\n## 引用调用\n\n\
    - C语言可以通过传递引用或显式指针来实现引用调用的效果\n- C语言使用 ‘&’指示变量的地址，使用操作 ‘*’ 撤销引用指针。\n- 如：\n  ```c\n\
    \  void inc_1(int* x)    // C 模拟引用调用\n  { (*x)++; }\n  ......\n  int a;\n  ......\n\
    \  inc_1(&a);\n  ```\n\n## 引用调用的实现\n\n- 调用过程对实参求值，并把实参的左值写入被调用过程活动记录的形式参存储单元中。\n\
    \n- 若实参是表达式，计算表达式的值，并把它存入临时存储单元，然后传递这个单元的地址。\n\n- 被调用过程通过形参间接地引用实参\n\n- 执行结果\n\
    \  \n  a=2    b=1\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_547_0.png)\n\n##\
    \ 三、复制恢复\n\n- 传值调用和引用调用的一种混合形式\n\n- 调用过程计算实参，实参的右值被传递到被调用过程中。要求在调用之前求出实参的左值。\n\
    \n- 从被调用过程返回时，把形参的现行右值复制到相应实参的左值中。只有具有左值的实参被复制下来\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_548_0.png)\n\
    \n- 执行结果\n  a=2   b=1\n\n## 引用调用与复制恢复的区别\n\n```\nprogram copyout(input,output);\n\
    var a: integer;\nprocedure app_based(var x:integer);\n  begin  x:=2;  a:=0 end;\n\
    begin  a:=1; app_based(a); writeln(a)  end.\n```\n\n## 引用调用情况\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_549_0.png)\n\
    \n## 复制恢复情况\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_549_1.png)\n\n## 引用调用与复制恢复的区别\n\
    \n```\nprogram cmp_example(input, output);\nvar a: integer;\nprocedure inc_1(x,\
    \ y: integer);\n    begin x:=x+1; y:=y+1 end;\nbegin\na:=1;\ninc_1(a, a);\nend.\n\
    ```\n\n- 引用调用情况： a=3\n- 复制恢复： a=2\n\n## 四、传名调用\n\n- ALGOL60所定义的一种特殊的传递方式\n- 宏扩展：\n\
    \  - 把过程当作宏，用被调用过程的过程体替换调用语句\n  - 用实参的字面形式替换相应的形参\n- 注意：\n  - 被调用过程中的局部名字不能与调用过程中的名字重名\n\
    \  - 在做宏扩展之前，对被调用过程中的每一个名字都系统地重新命名\n  - 为了保持实参的完整性，可以用括号把实参括起来。\n\n## 实现传名调用方式的基本方法\n\
    \n## 展开结果\n\n```\nbegin\n  a:=1; b:=2;\n  temp:=a;\n  a:=b;\n  b:=temp;\n  writeln('a=',\
    \ a);\n  writeln('b=', b)\nend.\n```\n\n- 进入被调用过程之前不对实参求值\n- 在过程体中，当用到相应的形参时，才求值。\n\
    - 实现\n  - 结果程序中对每个实参都需要编制一个单独的子程序，称为参数子程序。\n  - 每当过程体中用到相应的形参时，就调用这个程序。\n  - 调用时，若实参不是变量，形参替换程序就计算实参，并返回此值所在的地址。过程体中每当引用形参时，就调用参数子程序，利用所送回的地址去引用该值。\n\
    \n## 例：\n\n```\nint i;\nint B[2];\nvoid P(int v)\n{\n    i=0;  v=v+10;  B[i]=10;\n\
    \    i=1;  v=v+10;  B[i]=10;\n}\nmain()\n{\n    B[0]=10;    B[1]=20;\n    i=0;\
    \    P(B[i]);\n    cout<<B[0]<<' '<<B[1];\n}\n```\n\n- 传值调用\n- 引用调用\n- 复制恢复\n\
    - 传名\n\n## 小 结（续）\n\n- 非局部名字的访问\n  - 静态作用域规则\n  - 非嵌套过程的作用域规则、存储分配策略\n  - 嵌套过程的作用域规则\n\
    \    - 嵌套深度\n    - 访问链的指向\n    - 访问链的使用\n    - 访问链的建立\n\n- 动态作用域\n  - 访问链的指向\n\
    \  - 深访问\n  - 浅访问\n"
