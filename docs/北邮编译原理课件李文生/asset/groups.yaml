    ## 一、前端和后端\n\n- 前端主要由与源语言有关而与目标机器无关的那些部分组成\n- 词法分析、语法分析、符号表的建立、语义分析和中间代码生成\n-\
    \ 与机器无关的代码优化工作\n- 相应的错误处理工作和符号表操作\n- 后端由编译程序中与目标机器有关的部分组成\n- 与机器有关的代码优化、目标代码的生成\n\
    - 相应的错误处理和符号表操作\n- 把编译程序划分成前端和后端的优点：\n- 便于移植、便于编译程序的构造。\n\n### 二、遍\n\n- “遍”是指对源程序或其中间形式从头到尾扫描一遍，并作相关的加工处理，生成新的中间形式或目标程序。\n\
    - 编译程序的结构受“遍”的影响\n- 遍数\n- 分遍方式\n\n一遍扫描的编译程序\n多遍编译程序\n\n## 一遍扫描的编译程序\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_44_0.png)\n\
    \n## 多遍编译程序\n\n编译程序总控\n词法分析器\n语法分析器\n语义分析器\n中间代码生成\n代码优化\n目标代码生成\n源程序\n中间语言1，表\n\
    中间语言2，表\n中间语言3，表\n中间语言4，表\n优化代码，表\n目标代码\n符号表管理\n错误处理\n\n## 编译程序分遍的优缺点\n\n- 分遍的主要好处：\n\
    \  - 可以减少对主存容量的要求\n  - 可使各遍编译程序功能独立、单纯，相互联系简单，编译程序结构清晰。\n  - 能够实现更充分的优化工作，获得高质量目标程序。\n\
    \  - 通过分遍将编译程序的前端和后端分开，可以为编译程序的移植创造条件。\n\n- 分遍的缺点：\n  - 增加了不少重复性的工作。\n\n## 1.4\
    \ 编译程序的伙伴工具\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_47_0.png)\n\n## 编译程序的前后处理器\n\
