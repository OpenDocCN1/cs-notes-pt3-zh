    ![](img/12b57169bd1d5004c5e7193ff0d478d5_127_0.png)\n\n## 作业\n\n- 3.2 （1）（4）\n\
    - 3.4\n- 3.8\n- 3.9\n- 程序设计1\n  - 方法1（必做）\n  - 方法2（选作）\n\n## 第3章 词法分析——LEX\n\n\
    ![](img/12b57169bd1d5004c5e7193ff0d478d5_129_0.png)\n\n- 使用LEX的流程\n- LEX 源文件格式\n\
    - LEX 工作原理\n\n### 一、使用LEX的流程\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_130_0.png)\n\
    \n### 二、LEX源程序\n\n一个LEX源程序由三部分组成：\n\n1. 说明部分\n2. 翻译规则\n3. 辅助过程\n\n```\n说明部分\n\
    %%\n翻译规则\n%%\n辅助过程\n```\n\n### 2. 翻译规则\n\n形式：\n\n```\nP1    { 动作1 }\nP2    { 动作2\
    \ }\n...\nPn    { 动作n }\n```\n\nPi 是一个正则表达式，描述一种记号的模式。\n\n动作i 是C语言的程序语句，表示当一个串匹配模式\
    \ Pi 时，词法分析器应执行的动作。\n\n### 3. 辅助过程\n\n- **对翻译规则的补充**\n- 翻译规则部分中某些动作需要调用的过程，如果不是C语言的库函数，则要在此给出具体的定义。\n\
    - 这些过程也可以存入另外的程序文件中，单独编译，然后和词法分析器连接装配在一起。\n\n### LEX源程序举例\n\n正规定义式：\n\n```\nif\
    \ → if\nthen → then\nelse → else\nrelop → < | <= | = | <> | > | >=\nid → letter(letter|digit)*\n\
    num → digit+(.digit+)?(E(+|-)?digit+)?\n```\n\n### 相应的 LEX 源程序 框架\n\n```c\n/*\
    \ 说明部分 */\n%{\n#include <stdio.h>\n/* C语言描述的标识符常量的定义，如 LT、LE、EQ、NE、GT、\n    GE、IF、THEN、ELSE、ID、NUMBER、RELOP\
    \ */\nextern yylval;\n%}\n    /* 正规定义式 */\ndelim  [ \\t\\n]\nws     {delim}+\n\
    letter [A-Za-z]\ndigit  [0-9]\nid     {letter}({letter}|{digit})*\nnum    {digit}+(\\\
    .{digit}+)?(E[+\\-]?{digit}+)?\n%%\n\n/* 规则部分 */\n{ws}    {/* 没有动作，也不返回 */}\n\
    if      { return(IF); }\nthen    { return(THEN); }\nelse    { return(ELSE); }\n\
    {id}    { yylval=install_id(); return(ID); }\n{num}   { yylval=install_num();\n\
    \          return(NUMBER); }\n\"<\"    { yylval=LT; return(RELOP); }\n\"<=\" \
    \  { yylval=LE; return(RELOP); }\n\"=\"    { yylval=EQ; return(RELOP); }\n\"<>\"\
    \   { yylval=NE; return(RELOP); }\n\">\"    { yylval=GT; return(RELOP); }\n\"\
    >=\"   { yylval=GE; return(RELOP); }\n%%\n```\n\n如果没有return语句，则处理整个输入之后才会返回！！\n\
    \n"
