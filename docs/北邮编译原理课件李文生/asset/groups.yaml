    +     - 一个名字所需存储空间的大小由其类型决定

    +     - 需多个字节表示的数据对象，存放在连续字节的存储块中，第一个字节的地址作为它的地址


    +   - 局部数据的安排

    +     - 局部数据区是在编译过程中检查声明语句时安排的

    +     - 长度可变的数据对象，放在该区域之外


    +   - 数据对象的存储安排受目标机器编址限制的影响'
