    +   - 删除冗余的公共表达式，用第一次出现时的求值结果代替重复求值的结果。\n\n```\n(1) a := b + c\n(2) b := a - d\n\
    (3) c := b + c\n(4) d := b\n```\n\n# 举例\n\n```\nB₄\n(4) t₁:=4*i\n(5) t₂:=a-4\n\
    (6) t₃:=4*i\n(7) t₄:=a-4\n(8) t₅:=t₄[t₃]\n(9) t₆:=4*i\n(10) t₇:=b-4\n(11) t₈:=t₇[t₆]\n\
    (12) t₉:=t₅+t₈\n(13) t₂[t₁]:=t₉\n(14) t₁₀:=i+1\n(15) i:=t₁₀\n(16) goto B₂\n```\n\
    \n```\n(4) t₁:=4*i\n(5) t₂:=a-4\n(6') t₃:= t₁\n(7') t₄:= t₂\n(8) t₅:=t₄[t₃]\n\
    (9') t₆:= t₁\n(10) t₇:=b-4\n(11) t₈:=t₇[t₆]\n(12) t₉:=t₅+t₈\n(13) t₂[t₁]:=t₉\n\
    (14) t₁₀:=i+1\n(15) i:=t₁₀\n(16) goto B₂\n```\n\n# 删除死代码\n\n+   - 死代码：如果对一个变量x求值之后却不引用它的值，则称对x求值的代码为死代码。\n\
    +   - 死块：控制流不可到达的块称为死块。  \n+     - 如果一个基本块是在某一个条件为真时进入执行的，经数据流分析的结果知该条件恒为假，则此块是死块。\n\
    +     - 如果一个基本块是在某个条件为假时才进入执行，而该条件却恒为真，则这个块也是死块。\n+   - 在确定一个基本块是死块之前，需要检查转移到该块的所有转移语句的条件。\n\
    +   - 死块的删除，可能使其后继块成为无控制转入的块，这样的块也成为死块，同样应该删除。\n\n# 删除死代码举例\n\n```\n(4) t₁:=4*i\n\
    (5) t₂:=a-4\n(6') t₃:= t₁\n(7') t₄:= t₂\n(8') t₅:=t₂[t₁]\n(9') t₆:= t₁\n(10) t₇:=b-4\n\
    (11') t₈:=t₇[t₁]\n(12) t₉:=t₅+t₈\n(13) t₂[t₁]:=t₉\n(14) t₁₀:=i+1\n(15) i:=t₁₀\n\
    (16) goto B₂\n```\n\n```\n(4) t₁:=4*i\n(5) t₂:=a-4\n(8') t₅:=t₂[t₁]\n(10) t₇:=b-4\n\
    (11') t₈:=t₇[t₁]\n(12) t₉:=t₅+t₈\n(13) t₂[t₁]:=t₉\n(14) t₁₀:=i+1\n(15) i:=t₁₀\n\
    (16) goto B₂\n```\n\n```\n(4) t₁:=4*i\n(5) t₂:=a-4\n(8') t₅:=t₂[t₁]\n(10) t₇:=b-4\n\
    (11') t₈:=t₇[t₁]\n(12) t₉:=t₅+t₈\n(13) t₂[t₁]:=t₉\n(15') i:=i+1\n(16) goto B₂\n\
    ```\n\n# 四、削弱计算强度\n\n+   - 对基本块的代数变换：对表达式用代数上等价的形式替换，以便使复杂的运算变换成为简单的运算。\n+   \
    \  - `x:=y**2`\n+     - 可以用代数上等价的乘式（如：`x:=y*y`）代替\n\n+   - `x:=x+0` 和 `x:=x*1`\n\
    +     - 执行的运算没有任何意义\n+     - 应将这样的语句应从基本块中删除。\n\n# 五、改变计算次序\n\n+   - **考虑语句序列：**\n\
    +     - `t₁:=b+c`\n+     - `t₂:=x+y`\n+     - 如果这两个语句是**互不依赖**的，即 x、y 均不为 t₁，b、c\
    \ 均不为 t₂，则交换这两个语句的位置不影响基本块的值。\n+   - 对基本块中的临时变量重新命名不会改变基本块的值，如：语句 `t:=b+c` 改成语句\
    \ `u:=b+c`。\n+   - 把块中出现的所有 t 都改成 u，不改变基本块的值。\n\n# 10.3 循环优化\n\n+   - 对循环结构所生成的中间代码可划分为如下几个部分：\n\
    +   - 初始化部分：循环控制变量被赋予一个初值，此部分组成一个基本块，它在循环体中的语句开始之前执行一次。\n+   - 调节部分：循环控制变量增加或减少一个特定的量，可把这部分视为构成该循环的最后一个基本块。\n\
    +   - 测试部分：测试循环控制变量以判定终止条件是否满足。这部分的位置依赖于循环语句的性质，若循环语句允许循环体执行0次，则在执行循环体之前进行测试，若循环语句要求循环体至少执行1次，则在执行循环体之后进行测试。\n\
    +   - 循环体：由需要重复执行的语句构成的一个或多个基本块组成。\n+   - 循环结构中的调节部分和测试部分也可以与循环体中的其他语句一起出现在基本块中。\n\
    \n# 循环优化的主要技术\n\n+   - 一、循环展开\n+   - 二、代码外提/频度削弱\n+   - 三、削弱计算强度\n+   - 四、删除归纳变量\n\
    \n# 一、循环展开\n\n+   将构成循环体的代码（不包括调节和测试部分）重复产生多次，而不仅一次。产生的次数可以在编译时确定。\n\n+   以空间换时间的优化过程\n\
    \n+   要进行循环展开，必须：\n+     - 必须识别出循环结构，而且循环的初值、终值、以及步长的值都必须能够在编译时确定。\n+     - 作出空间与时间的权衡，是否可接受，如不可接受，则将此循环作为一个循环结构继续编译。\n\
    +     - 如果可以接受，则重复产生循环体直到所需要的次数，\n\n+   在重复产生代码时，必须确保每次重复产生时，都对循环变量进行了正确的合并。\n\
    \n# 考虑C语言的循环语句：\n\n```\nfor (i=0;i<10;i++)\nx[i]=0;\n```\n\n# 生成三地址代码：\n\n100:\
    \ i:=0\n101: if i<10 goto 103\n102: goto 107\n103: t:=4*I\n104: x[t]:=0\n105:\
    \ i:=i+1\n106: goto 101\n107:\n\nx[0]:=0\nx[4]:=0\n...\nx[36]:=0\n\n# 循环展开：\n\n\
    # 二、代码外提/频度削弱\n\n+   - 减少循环中代码总数的一个重要方法\n+   - 对于包含在循环里的基本块，如果其中的某些代码与循环无关，则可把这样的代码移到循环之外以减少其计算频度，通常移到循环的前边。\n\
    +   - 如C语言程序中的语句：\n+     ```c\n+     while (i<=limit-2) {\n+         ...\n+  \
    \   }\n+     ```\n+   - 如果limit的值在循环过程中保持不变，则limit-2的计算与循环无关\n\n```\nt=limit-2;\n\
    while (i<=t) {\n    ...\n}\n```\n\n# 三、削弱计算强度\n\n+   - 将一种类型的运算代之以另一种类型的需要较少执行时间的运算。\n\
    +   - 大多数计算机上乘法运算比加法运算需要更多的执行时间。\n+   - 如可用‘+’代替‘*’，则可节省许多时间，特别是当这种替代发生在循环中时更是如此。\n"
