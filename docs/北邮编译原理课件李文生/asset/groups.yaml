    # 综合属性


    +   - 分析树中，如果一个节点的某一属性由其子节点的属性确定，则这种属性为该节点的综合属性。

    +   - 如果一个语法制导定义仅仅使用综合属性，则称这种语法制导定义为 S-属性定义。

    +   - 对于 S-属性定义，通常采用 自底向上 的方法对其分析树加注释，即从树叶到树根，按照语义规则计算每个节点的属性值。

    +   - 简单台式计算机的语法制导定义是 S-属性定义'
