  - '[PAGE 494]


    # 二、控制栈与活动记录


    +   - 控制栈：用于保存控制信息的栈。

    +     - 程序执行过程中使用控制栈来保存活动的生存踪迹及活动的运行环境。

    +   - 活动记录：一个连续的存储块

    +     - 记录过程在一次执行中所需要的信息

    +   - 通常，活动记录分配在控制栈中（像Pascal、C）

    +     - 当一个过程被调用时，被调用过程的一次新的活动被激活，在栈顶为该活动创建一个新的活动记录来保存其环境信息；

    +     - 当活动结束，控制从被调用过程返回时，释放该活动记录，使调用过程的活动记录成为栈顶活动记录，即恢复调用过程的执行环境。'
  - '[PAGE 495]


    # 活动记录的内容


    +   - 返回值

    +   - 实参区域

    +   - 控制链

    +   - 访问链

    +   - 机器状态域

