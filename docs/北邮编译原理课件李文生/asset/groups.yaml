    \ \n  `t₄ := b*t₃`\n  \n  `t₅ := t₂+t₄`\n  \n  `a := t₅`\n\n- ▪ **对应 DAG 的代码**\n\
    \  \n  `t₁ := -c`\n  \n  `t₂ := b*t₁`\n  \n  `t₅ := t₂+t₂`\n  \n  `a := t₅`\n\n\
    ## 三地址语句的实现——四元式\n\n四元式\n（op, arg1, arg2, result）\n（op, arg1, , result）\n（param,\
    \ arg1, , ）\n（goto, , , 语句标号）\n\n赋值语句a:=b*-c+b*-c的四元式表示\n\n|  | op | arg1 | arg2\
    \ | result |\n|---|---|---|---|---|\n| (14) | uminus | c |  | t₁ |\n| (15) | *\
    \ | b | t₁ | t₂ |\n| (16) | uminus | c |  | t₃ |\n| (17) | * | b | t₃ | t₄ |\n\
    | (18) | + | t₂ | t₄ | t₅ |\n| (19) | := | t₅ |  | a |\n\n## 三地址语句的实现——三元式\n\n\
    - 三元式：（op, arg1, arg2）\n  - 为避免把临时变量名也存入符号表，可不引入临时变量\n  - 把由一个语句计算出来的中间结果直接提供给引用它的语句\n\
    \  - 用计算中间结果的语句的指针代替存放中间结果的临时变量\n\n赋值语句a:=b*-c+b*-c的三元式表示\n\n|  | op | arg1 |\
    \ arg2 |\n|---|---|---|---|\n| (14) | uminus | c |  |\n| (15) | * | b | (14) |\n\
    | (16) | uminus | c |  |\n| (17) | * | b | (16) |\n| (18) | + | (15) | (17) |\n\
    | (19) | := | a | (18) |\n\n## 语句 x[i] := y 和 x := y[i] 的三元式序列\n\n## 语句 x[i] :=\
    \ y\n\n|  | op | arg1 | arg2 |\n|---|---|---|---|\n| (0) | []= | x | i |\n| (1)\
    \ | assign | (0) | y |\n\n## 语句 x := y[i]\n\n|  | op | arg1 | arg2 |\n|---|---|---|---|\n\
    | (0) | =[] | y | i |\n| (1) | assign | x | (0) |\n\n## 三地址语句的实现——间接三元式\n\n- 间接三元式\n\
    \  - 间接码表：为三元式序列建立的一个指针数组，其每个元素依次指向三元式序列中的一项\n- 赋值语句a:=b*-c+b*-c的间接三元式表示\n\n##\
