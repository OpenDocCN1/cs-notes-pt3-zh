    # K维数组A


    每维的下界： low₁、 low₂、 ...、 lowₖ


    每维的长度： n₁、 n₂、 ...、 nₖ


    存储方式： 按行存放


    数组元素A[i₁, i₂, ..., iₖ]的位置：


    ((...(i₁×n₂+i₂)×n₃+i₃)... )×nₖ+iₖ)×w + base - ((...(low₁×n₂+low₂)×n₃+low₃)...
    )×nₖ+lowₖ)×w


