    # 7.2 存储分配策略


    运行时刻存储空间的划分，除目标代码外，其余三种数据空间采用的存储分配策略是不同的。


    +   - 静态存储分配：编译时对所有数据对象分配存储空间

    +   - 栈式存储分配：运行时把存储器作为栈进行管理，数据对象分配在栈中

