    # 语义检查


    +   - **动态检查**：目标程序运行时进行的检查

    +   - **静态检查**：读入源程序、但不执行源程序的情况下进行的检查


    +   - 类型检查

    +     - 对访问数据的操作和被访问数据的类型进行检查，检查操作的合法性和数据类型的相容性。


    +   - 控制流检查

    +     - 检查控制语句是否使控制转移到一个合法的位置。


    +   - 唯一性检查

    +     - 一个标识符在同一程序块中必须而且只能被说明一次

    +     - CASE语句中用于匹配选择表达式的常量必须各不相同

    +     - 枚举类型定义中的各元素不允许重复


    +   - 关联名字的检查'
