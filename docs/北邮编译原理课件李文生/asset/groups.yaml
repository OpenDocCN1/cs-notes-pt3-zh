  - '[PAGE 473]


    # C++语言中，大多数运算符都是重载的


    +   ■ 对于运算符 “+”：

    +     - 作用于两个整型数，结果仍为整型；

    +     - 也可以作用于两个实型数，结果仍为实型；

    +     - 用于连接两个字符串。


    +   ■ 因此，“+”的类型表达式有：

    +     integer × integer → integer

    +     float × float → float

    +     string × string → string'
  - '[PAGE 474]


