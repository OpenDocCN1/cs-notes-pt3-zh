    # 为什么采用最左推导？


    +   因为对输入串的扫描是自左至右进行的，只有使用最左推导，才能保证按扫描的顺序匹配输入串。


    # 递归下降分析方法的实现


    +   文法的每一个非终结符号对应一个递归过程，即可实现这种带回溯的递归下降分析方法。


    +   每个过程作为一个布尔过程，一旦发现它的某个产生式与输入串匹配，则用该产生式展开分析树，并返回 true，否则分析树不变，返回 false。


    # 实践中存在的困难和缺点


    +   左递归的文法，可能导致分析过程陷入死循环。


    +   回溯


    +   工作的重复


    +   效率低、代价高：穷尽一切可能的试探法。'
