  - '[PAGE 607]


    # 函数说明


    +   - **makelist(i):**

    +     - 建立新链表，其中只包括四元式指令在数组中的下标i;

    +     - 返回所建链表的指针。


    +   - **merge(p₁,p₂):**

    +     - 合并由指针p₁和p₂所指向的两个链表

    +     - 返回结果链表的指针。


    +   - **backpatch(p,i):**

    +     - 用目标地址i回填 p所指链表中记录的每一条转移指令。


    +   - **emit(S)**

    +     - 产生一条三地址语句S，并写入输出数组中

    +     - 该函数执行完后，变量 nextquad 加 1'
