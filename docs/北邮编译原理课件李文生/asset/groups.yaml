    # 浅访问方式


    +   - 动态作用域下，名字可以采用“浅访问”方式进行存储分配

    +   - 做法：

    +     - 为每个名字在静态分配的存储空间中保存它的值

    +     - 当控制进入过程p时，p的活动记录入栈，p中的局部名字a接管静态分配给该名字的存储单元，而将该名字的当前值保存在p的活动记录中。

    +     - 控制在活动p中时，对名字a的访问总是对静态分配给a的存储单元进行存取操作。

    +     - 当p的活动结束时，再用保存的值恢复a的存储单元。'
