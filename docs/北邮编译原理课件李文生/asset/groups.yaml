    \ 48 | 1 | 0 | 5 | 10, 11, 13 | 1 |\n| 5 | able_n | 52 | 1 | 0 | 5 | 11, 23, 25\
    \ | 4 |\n| 6 | mlist | 56 | 6 | 0 | 6 | 17, 21 | 2 |\n| 7 | flag | 64 | 1 | 0\
    \ | 7 | 28, 29 | 3 |\n\n## 变量名\n\n- 变量名必须常驻内存\n- 问题：\n  - 标识符长度是可变的\n- 解决办法：\n\
    \  - 标识符长度有限制：设置一个长度固定的域，它的长度为该语言允许的标识符最大长度。\n  - 标识符长度没有限制：设置一个长度固定的域，域内存放一个串描述符，包含位置指针和长度两个子域，指针域指示该标识符在总的串区内的开始位置，长度域记录该标识符中的字符数。\n\
    \n存取速度较高，\n存储空间利用率较低\n\n存取速度较慢，\n节省存储空间。\n\n## 使用串描述符表示变量\n\n| 变量名 | 其他属性 |\n\
    |---|---|\n| 位置 | 长度 |\n| 1 | 5 |\n| 6 | 7 |\n| 13 | 6 |\n| … | … | … |\n\n```\n\
    `countx_totallb_loop`\n```\n\n## 目标地址\n\n- 指示运行时变量值存放的相对位置\n- 对于静态存储分配的语言（如Fortran），目标地址按连续的顺序分配，从0开始到m（m是分配给一个程序的数据区的最大值）。\n\
    - 对于块结构的语言（如Pascal），通常采用二元地址<BL, NO>\n  - BL：块的嵌套深度，用于确定分配给声明变量的块的数据区的基址。\n  -\
    \ NO：变量的目标地址偏移量，指示该变量的存储单元在数据区中相对于基址的位置。\n\n## 数据类型\n\n- 当所编译的语言有数据类型（隐式或显式的）时，必须把类型属性存放到符号表中。\n\
    - 对于无类型的语言，可删除该域。\n- 变量的类型属性用于：\n  - 类型检查\n  - 生成代码\n  - 空间分配\n- 变量的类型以一种编码形式存在于符号表中。\n\
    \n## 数组的维数/参数的个数\n\n- 数组引用时，其维数应当与数组声明时定义的维数一致。\n  - 类型检查阶段必须对这种一致性（维数、每维的长度）进行检查\n\
    \  - 维数用于数组元素地址的计算。\n- 过程调用时，实参必须与形参一致。\n  - 实参的个数与形参的个数一致\n  - 实参的类型与相应形参的类型一致\n\
    - 在符号表组织中：\n  - 把参数的个数看作它的维数是很方便的，因此，可将这两个属性合并成一个。\n  - 这种方法也是协调的，因为对这两种属性所做的类型检查是类似的。\n\
    \n## 链接\n\n- 为了便于产生按字母顺序排列的交叉引用表\n- 如果编译程序不产生交叉引用表，则链接以及语句的行号属性都可以从符号表中删除。\n\n\
    ## 三、符号表操作\n\n- 最常执行的操作： 插入和检索\n- 要求变量显式声明的强类型语言：\n  - 编译程序在处理声明语句时调用两种操作\n  \
    \  - 检索：查重、确定新表目的位置\n    - 插入：建立新的表目\n  - 在程序中引用变量名时，调用检索操作\n    - 查找信息，进行语义分析、代码生成\n\
    \    - 可以发现未定义的名字\n- 允许变量隐式声明的语言：\n  - 标识符的每次出现都按首次出现处理\n  - 检索：\n    - 已经声明，进行类型检查，...\n\
    \    - 首次出现，插入操作，从其作用推测出该变量的全部属性\n\n## 定位和重定位操作\n\n对于块结构的语言，在建立和删除符号表时还要使用两种附加的操作，即定位和重定位。\n\
    \n当编译程序识别出块的开始时，执行定位操作。\n\n当编译程序遇到块的结束时，执行重定位操作。\n\n定位操作：\n- 建立一个新的子表（包含于符号表中），在该块中声明的所有变量的属性都存放在此子表中。\n\
    \n重定位操作：\n- “删除”存放该块中局部变量的子表\n- 这些变量的作用域局部于该块，出了该块后这些变量不能再被引用。\n\n## 读入数据，并进行排序的PASCAL程序\n\
    \n```\nprogram sort (input,output);\nvar a : array[0..10] of integer;\n    x :\
    \ integer;\nprocedure readarray;\n    var i : integer;\n    begin\n        for\
    \ i:=1 to 9 do read(a[i])\n    end;\nprocedure exchange (i,j:integer)\n    begin\n\
    \        x:=a[i]; a[i]:=a[j];  a[j]:=x\n    end;\nprocedure quicksort (m,n:integer);\n\
    \    var k,v : integer;\nfunction partition (y,z :integer):integer;\n    var i,j\
    \ : integer;\n    begin    ...a...;    ...v...;\n        exchange(i,j);      ......\n\
    \    end;\nbegin ......\n        k=partition(m,n);\n        quicksort(m,k-1);\n\
    \        quicksort(k+1,n);  ......\nend;{quicksort}\nbegin readarray; quicksort(1,9)\n\
    end. {sort }\n```\n"
