    # 一、常数合并及常数传播


    +   - **常数合并**：将在编译时计算出值的表达式用其相应的值替代

    +     - `x=2+3+y` 可代之以：`x=5+y`

    +   - **常数传播**：用在编译时已知的变量值代替程序正文中对这些变量的引用

    +     - `PI:=3.14;`

    +     - `D-to-R:=0.01744`


    ```

    i:=0

    10: i:=i+1

    ...

    if i<10 goto 10

    ```


    ```

    i:=0

    10: i:=0+1

    ...

    if i<10 goto 10

    ```


    ```

    ...

    a[i]=9.0

    ...

    a[j]=3.0

    b:=a[i]

    ```


    ![](img/12b57169bd1d5004c5e7193ff0d478d5_685_0.png)'
  - '[PAGE 686]


    # 常数合并的实现


    +   - 在符号表中增加两个信息域

    +     - 标志域：指示当前是否存在与该变量相关的常数。

    +     - 常数域：如果常数存在，则该域存放的即是与该变量相对应的当前常数值。

    +   - 常数合并时，注意事项：

    +     - 不能将结合律与交换律用于浮点表达式，因为浮点运算的精度有限，这两条定律并非是恒真的。

    +     - 不应将任何附加的错误引入'
  - '[PAGE 687]


    # 二、删除冗余的公共表达式


    +   - 在一个基本块中，当第一次对表达式E求值之后，如果其中的变量都没有改变，再次对E求值，则除E的第一次出现之外，其余的E都是冗余的公共表达式。

    +   - 删除冗余的公共表达式，用第一次出现时的求值结果代替重复求值的结果。


    ```

    (1) a := b + c

    (2) b := a - d

    (3) c := b + c

    (4) d := b

    ```'
