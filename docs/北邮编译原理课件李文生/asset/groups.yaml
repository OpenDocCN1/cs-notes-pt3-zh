    # (3) 与每个产生式相关的程序代码


    +   - 按照从左到右的顺序考虑产生式右部的记号、非终结符号和语义动作

    +   - 对带有综合属性x的记号X

    +     - 把属性x的值保存于为X.x声明的变量中

    +     - 产生一个匹配记号X的调用

    +     - 推进扫描指针

    +   - 对非终结符号B

    +     - 产生一个函数调用语句c=B(b₁,b₂,...,bₖ)

    +     - bᵢ(i=1,2,...,k)是对应于B的继承属性的变量

    +     - c是对应于B的综合属性的变量

    +   - 对每一个语义动作

    +     - 把动作代码复制到分析程序中

    +     - 用代表属性的变量代替翻译方案中引用的属性'
