    Pascal、C语言报告中关于类型的描述：


    +   - 如果算术运算符加、减和乘的两个运算对象都是整型，那么结果是整型。

    +   - 一元运算符&的结果是指向运算对象所代表的实体的指针，如果运算对象的类型是‘…’，结果类型就是指向‘…’的指针。


    暗示的概念：


    +   - 每一个表达式有一个类型

    +   - 类型有结构'
