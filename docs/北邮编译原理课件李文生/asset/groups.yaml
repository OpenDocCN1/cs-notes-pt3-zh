    - **折叠法：** 标识符被分成若干段，可能除最后一段外，每一段与所需地址具有同样长度，然后各段加起来，忽略最后的进位，以构成一个地址。\n- **长度相关法：**\
    \ 变量名的长度和名字的某个部分一起用来直接产生一个表地址，或更普遍的方法是产生一个有用的中间字，然后用除法产生一个最终的表地址。\n\n## 解决冲突的方法\n\
    \n- 冲突：变量名被映射到一个存储单元d中，而这个单元已被占用\n- 开放地址法\n  - 按照顺序d, d+1, ..., m, 1, 2, ...,\
    \ d-1进行扫描，直到找到一个空闲的存储单元为止，或者在扫描完m个单元之后搜索停止\n  - 在查找一个记录时，按同样的顺序扫描，或找到要找的记录、或找到一个空闲单元（从未使用过）为止\n\
    - 分离链表法\n  - 将发生冲突的记录链到一个专门的溢出区，该溢出区与主区相分离\n  - 为每一组冲突的记录设置一个链表，主区和溢出区的每一个记录都必须有一个链接字段。\n\
    \  - 为节省存储空间，建立一个中间表（散列表），所有记录都存入溢出区，而主区（散列表）只有链域\n\n## 开放地址、分离链表示意图\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_419_0.png)\n\
    \n## 2. 块结构语言的符号表组织\n\n- 块结构语言：\n  - 模块中可嵌套子块\n  - 子块中可以定义局部变量\n  - 每个块应有一个子表\n\
    - 符号表组织\n  - 栈式符号表\n    - 当遇到变量声明时，将包含变量属性的记录入栈\n    - 当到达块结尾时，将该块中声明的所有变量的记录出栈\n\
    \    - 因为这些变量是局部于该块的，在块外已不可用的。\n\n## 栈式符号表\n\n|  | 变量名 | 属性 |\n|---|---|---|\n\
    | 10 | j |  |\n| 9 | i |  |\n| 8 | partition |  |\n| 7 | v |  |\n| 6 | k |  |\n\
    | 5 | quicksort |  |\n| 4 | exchange |  |\n| 3 | readarray |  |\n| 2 | x |  |\n\
    | 1 | a |  |\n\n栈式符号表\n\ntop\n\n块索引表\n9\n6\n1\n\n## 操作\n\n- 插入\n  - 检查子表中是否有重名变量\n\
    \    - 无，将新记录推入栈顶单元\n    - 有，报告错误\n- 检索\n  - 从栈顶到栈底线性检索\n    - 在当前子表中找到，局部变量\n\
    \    - 在其他子表中找到，非局部名字\n  - 根据最近嵌套作用域原则，选择变量的记录\n\n## 定位\n\n- 将下一个可用的栈顶单元的地址压入块索引表的顶端\n\
    \n- 块索引表的元素是指针，指向相应块的子表中第一个记录在栈中的位置\n\n## 重定位\n\n- 有效地清除刚刚被编译完的块在栈式符号表中的所有记录\n\
    \n- 用块索引表顶端元素的值恢复栈顶指针top，完成重定位操作\n\n- top指示符号表栈顶第一个空闲的记录存储单元。\n\n## 栈式散列符号表\n\n\
    假设散列表的大小为11，散列函数执行如下变换：\n\n| 名字 | 映射到地址 |\n| --- | --- |\n| a、quicksort | 1 |\n\
    | x、v、j | 3 |\n| partition | 4 |\n| i | 5 |\n| k、readarray | 8 |\n| exchange |\
    \ 11 |\n\n## 栈式散列符号表示意图\n\nHash表\n\n|  | 变量名 | 属性 | 链 |\n|---|---|---|---|\n|\
    \ 1 | j |  |  |\n| 2 | i |  |  |\n| 3 | partition |  |  |\n| 4 | v |  |  |\n|\
    \ 5 | k |  |  |\n| 6 | quicksort |  |  |\n| 7 | exchange |  |  |\n| 8 | readarray\
    \ |  |  |\n| 9 | x |  |  |\n| 10 | a |  |  |\n\n栈式符号表\n\n块索引表\n\n- a 1\n- x 3\n\
    - readarray 8\n- exchange 11\n- quicksort 1\n- k 8\n- V 3\n- partition 4\n- i\
    \ 5\n- j 3\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_425_0.png)\n\n## 操作\n\n\
    - 插入\n  - 散列函数将变量名映射到散列表单元\n  - 是否存在冲突？该表单元是否为空？\n    - 无冲突:\n      - 将栈指针的值记入该散列表单元\n\
    \      - 将新记录推入栈顶\n    - 有冲突\n      - 检查冲突链中是否有同名变量\n        - 没有：将新记录插入冲突链的链头\n\
    \        - 有：检查同名变量是否属于当前子表\n          同名变量在栈中的位置 >= 块索引表顶端元素的值？\n          >=：在当前子表中，报告错误\n\
    \          <: 不在当前子表中，将新记录插入冲突链的链头\n\n## 名字引用时\n\n- 检索\n  - 散列函数将变量名映射到散列表单元\n\
    \  - 该散列表单元是否为空？\n    - 空：名字未定义，报告错误\n    - 不空：沿冲突链检索\n      - 未找到：名字未定义，报告错误\n\
    \      - 找到：名字在栈中的位置 >= 块索引表顶端元素的值\n        - >=：局部名字\n        - <: 非局部名字\n\n\
    ## 定位与重定位\n\n## ■ 定位\n\n- 当识别到一个新块时，要为之创建子表\n- 将下一个可用的栈顶单元的地址压入块索引表的顶端\n- 标识新块符号表的开始位置\n\
    \n## ■ 重定位\n\n- 当一个块编译完成时，它的有关记录必须逻辑上或物理上从符号表中除去。\n- 用块索引表顶端单元的值确定要删除的栈单元\n- 依次取出栈单元中的名字\n\
    \  - 通过散列函数将该名字映射到散列表单元\n  - 从链中把链头记录删除\n  - 重复，直到新链头在栈中的位置 < 块索引表顶端单元的值\n- 用块索引表顶端单元的值设置栈顶指针\
    \ TOP\n\n## 6.3 符号表的建立\n\n- 处理声明语句时，编译程序的任务\n  - 分离出每一个被声明的实体，并将它的名字填入符号表中\n \
    \ - 尽可能多地将有关该实体的信息填入符号表\n- 声明语句的形式\n  - 类型关键字的位置\n    - 标识符表的面前\n    - 标识符表的后面\n\
    \  - 标识符表\n    - 单一实体\n    - 多个同类型的实体\n    - 不同种类的实体\n\n"
