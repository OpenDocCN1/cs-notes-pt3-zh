    \n– 类型表达式可以包含变量（称为类型变量），变量的值是类型表达式。\n\n## 类型表达式的有向图\n\n- 利用语法制导翻译技术为类型表达式构造树或dag\n\
    - - 内部结点：类型构造器\n- - 叶结点：基本类型、类型名、或类型变量\n\n- 如：\n- char×char →pointer(integer)\n\
    \n树：\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_445_0.png)\n\ndag：\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_445_1.png)\n\
    \n## 二、类型等价\n\n关键：\n精确地定义什么情况下两个类型表达式等价\n\n- 问题：\n- - 类型表达式可以命名，且这个名字可用于随后的类型表达式中\n\
    - - 名字代表它自己？代表另一个类型表达式？\n- - 新的名称是一个类型表达式，这个表达式与名称所代表的类型表达式是否总是等价的？\n\n## 1. 结构等价\n\
    \n- - 如果类型表达式仅由类型构造器作用于基本类型组成，则两个类型表达式等价的自然概念是结构等价\n- - 两个类型表达式要么是同样的基本类型\n- -\
    \ 要么是同样的构造器作用于结构等价的类型表达式。\n- - 两个类型表达式结构等价当且仅当它们完全相同\n\n例如：\n\ninteger 仅等价于 integer\n\
    pointer(integer) 仅等价于 pointer(integer)\n\n## 例： 考虑如下Pascal声明\n\n| A: record i:\
    \ integer f: real end; | B: record i: integer f: real end; | C: record f: real\
    \ i: integer end; | D: record x: real y: integer end; |\n|---|---|---|---|\n\n\
    ## 考虑如下C语言声明：\n\n| struct recA { int i; char c; } a; | typedef struct { int i;\
    \ char c; } recB; recB b; | struct { int i; char c; } c; |\n|---|---|---|\n\n\
    ## 测试两个类型表达式结构等价的算法\n\n输入：两个类型表达式s和t\n\n输出：如果s和t结构等价，则返回true，否则返回false\n\n方法：\n\
    \n```\nbool sequiv(bexpr s, t)\n{\n    if (s和t是同样的基本类型) return 1;\n    else if\
    \ (s==array(s₁,s₂))&&(t==array(t₁,t₂))\n        return sequiv(s₁,t₁) && sequiv(s₂,t₂);\n\
    \    else if (s==s₁×s₂)&&(t==t₁×t₂)\n        return sequiv(s₁,t₁) && sequiv(s₂,t₂);\n\
    \    else if (s==pointer(s₁))&&(t==pointer(t₁))\n        return sequiv(s₁,t₁);\n\
    \    else if (s==s₁→s₂)&&(t==t₁→t₂)\n        return sequiv(s₁,t₁) && sequiv(s₂,t₂);\n\
    \    else return 0;\n}.\n```\n\n## 实际应用中结构等价概念的修改\n\n- 当数组作为参数传递时，数组的界不作为类型的一部分\n\
    \n- 算法调整\n- else if (s==array(s₁,s₂))&&(t==array(t₁,t₂))\n- return sequev(s₂,t₂);\n\
    \n## 2. 名字等价\n\n- - 有些语言(如Pascal、C等)允许用户定义类型名\n- - C类型定义和变量声明（6.1）\n  ```\n  typedef\
    \ struct {\n      int age;\n      char name[20];\n  } recA;\n  typedef recA *recP;\n\
    \  recP a;\n  recP b;\n  recA *c, *d;\n  recA *e;\n  ```\n\n问题：a、b、c、d和e是否具有相同的类型？\n\
    \n关键：类型表达式recP和pointer(recA)是否等价\n\n回答：依赖于具体的实现系统\n\n原因：C语言报告中没有定义“类型等价”这个术语\n\
    \n## 名字等价把每个类型名看成是一个可区别的类型\n\n- - 两个类型表达式名字等价，当且仅当它们完全相同\n- - 所有的名字被替换后，两个类型表达式成为结构等价的类型表达式，那么这两个表达式结构等价。\n\
    - - 声明中的变量及其类型表达式：\n\n| 变量 | 类型表达式 |\n| --- | --- |\n| a | recP |\n| b | recP\
    \ |\n| c | pointer(recA) |\n| d | pointer(recA) |\n| e | pointer(recA) |\n\n结构等价\n\
    \n名字等价\n\n名字不等价\n\n名字等价\n\n- - 考虑名字等价的情形\n- - 考虑结构等价的情形\n\n## 类型等价实例\n\n- C语言使用介于名字等价和结构等价之间的一种类型等价形式，即对于struct和union采用名字等价，其他则采用结构等价。\n\
    \n- 有如下C语言声明：\n\n```\nstruct {\n    short j;\n    char c;\n} x, y;\nstruct {\n\
    \    short j;\n    char c;\n}b;\n```\n\nx、y 名字等价\nx、y与b名字不等价\n\nPascal语言采用了与C语言类似的规则，几乎所有类型构造器（如记录、数组、指针等）的应用都将建立一个新的不等价类型。\n\
    \n## 与声明6.1等效的声明6.2：\n\n```\ntypedef struct {\n    int age;\n    char name[20];\n\
    } recA;\ntypedef recA *recP;\ntypedef recA *recD;\ntypedef recA *recE;\nrecP a;\n\
    recP b;\nrecD c, d;\nrecE e;\n```\n\n- 名字等价\n- - a和b具有等价的类型\n- - c和d具有等价的类型\n\
    - - a、c、和e具有不同的类型\n\n## 类型图\n\n- - 类型图表示类型\n- - 构造方法:\n- - 每当出现一个类型构造器或基本类型，就建立一个新的节点；\n\
    - - 每当出现一个新的类型名时，就建立一个叶节点；\n- - 要跟踪该名字所代表的类型表达式。\n- - 在类型图中，如果两个类型表达式用相同的结点表示，则它们是名字等价的。\n\
    \n## 与声明6.2对应的类型图\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_456_0.png)\n\n##\
    \ 3. 类型表示中的环\n\n- 指针和结点的类型定义用 Pascal语言描述如下：\n- type ptr=↑row;\n- row=record\n\
    - i:integer;\n- next:ptr\n- end;\n\n- row的类型表达式：\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_457_0.png)\n\
    \n![](img/12b57169bd1d5004c5e7193ff0d478d5_457_1.png)\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_457_2.png)\n\
    \n## C 采用结构等价\n\n考虑声明：\n\n```\ntypedef struct cell_1 *link_1;\ntypedef struct\
    \ cell_2 *link_2;\nstruct cell_1 {\n    int info;\n    link_1 next;\n};\nstruct\
    \ cell_2 {\n    int info;\n    link_2 next;\n};\n```\n\n- 如果开始的时候就假定 link_1和link_2是结构等价的，那么就很容易地得出\
    \ cell_1和cell_2是结构等价的，并且可以得出 link_1和link_2它们本身是等价的。\n\n- 结构名是其类型的一部分，于是，在测试结构等价时，当遇到结构构造符struct时，测试停止，结果被比较的类型或者由于它们有同样的命名结构类型而等价，或者不等价。\n"
