  - '[PAGE 296]


    # 一、YACC说明文件


    由说明部分、翻译规则部分和辅助过程三部分组成，各部分之间用双百分号分隔。


    # 说明部分：有任选的两节


    +   - 第一节是处于%{和%}之间的部分，在这里是一些普通的C语言的声明。


    +   - 第二节是文法记号的声明，一般


    +   - 以 %start S 的形式说明文法的开始符号


    +   - 用 %token IF、DO、...、ID、... 的形式说明记号。


    +   - 记号被YACC赋予了不会与任何字符值冲突的数字值'
  - '[PAGE 297]


    # 翻译规则部分


    # 每条规则由一个产生式和有关的语义动作组成


    +   产生式 A→α₁|α₂|…|αₙ，在 YACC 说明文件中写成

    +   A : α₁ { 语义动作1 }

    +   | α₂ { 语义动作2 }

    +   …

    +   | αₙ { 语义动作n }

    +   ;


    +   用单引号括起来的单个字符，如 ‘c’ ，是由终止符号 c 组成的记号


    +   没有用引号括起来、也没有被说明成 token 类型的字母数字串是非终结符号


    +   语义动作是用 C 语言描述的语句序列

    +   - ‘$$’ 表示和产生式左部非终结符号相关的属性值， ‘$i’ 表示和产生式右部第 i 个文法符号相关的属性值。'
  - '[PAGE 298]


    # 辅助过程部分


    用C语言书写一些语义动作中用到的辅助程序


    +   - 名字为 yylex() 的词法分析程序必须提供


    +   - 函数 main

    +   ```

    +   main()

    +   {

    +       return yyparse();

    +   }

    +   ```


    +   - YACC 生成的 yyparse 过程调用一个扫描过程 yylex


    +   - yyparse 每次调用 yylex() 时，得到一个二元式的记号：<记号，属性值>。

    +     - 返回的记号必须事先在 YACC 说明文件的第一部分中用 %token 声明

    +     - 属性值必须通过 YACC 定义的变量 yylval 传给分析程序'
