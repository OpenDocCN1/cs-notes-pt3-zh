    - 期中测试：20 %\n- 期末测试：60 %\n\n## 第1章 编译概述\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_6_0.png)\n\
    \n知识点：翻译和解释的概念<br>编译的阶段、任务、及典型结构<br>编译程序的伙伴工具\n\n## 编译概述\n\n### 简介\n\n- 1.1 翻译和解释\n\
    - 1.2 编译的阶段和任务\n- 1.3 编译有关的其他概念\n- 1.4 编译程序的伙伴工具\n- 1.5 编译原理的应用\n- 小结\n\n### 简介\n\
    \n#### 什么是编译？\n\n- 把源程序转换成等价的目标程序的过程即是编译。\n\n#### 编译程序的设计涉及到的知识：\n\n- 程序设计语言\n\
    - 形式语言与自动机理论\n- 计算机体系结构\n- 数据结构\n- 算法分析与设计\n- 操作系统\n- 软件工程等\n\n### 1.1 翻译和解释\n\
    \n- 一、程序设计语言\n- 二、翻译程序\n\n#### 一、程序设计语言\n\n**低级语言**\n\n- 机器语言\n- 符号语言 汇编语言\n\n\
    **高级语言**\n\n- 过程性语言—面向用户的语言 如： C、Pascal\n- 专用语言—面向问题的语言 如： SQL\n- 面向对象的语言 如： Java、C++\n\
    \n#### 高级语言的优点\n\n- 高级语言独立于机器。所编程序移植性比较好。\n- 不必考虑存储单元的分配问题，数据的外部形式转换成机器的内部形式等细节。\n\
    \  - 用变量描述存储单元\n- 具有丰富的数据结构和控制结构。\n  - 数据结构：数组、记录等\n  - 控制结构：循环、分支、过程调用等。\n- 更接近于自然语言。\n\
    \  - 可读性好，便于维护。\n- 编程效率高。\n\n#### 二、翻译程序\n\n翻译程序扫描所输入的源程序，并将其转换为目标程序，或将源程序直接翻译成结果。\n\
    \n源程序 → 翻译程序 → 目标程序或执行结果\n\n翻译程序分为两大类：\n\n- 编译程序（即编译器）：把源程序翻译成目标程序的翻译程序。\n- 解释程序（即解释器）：直接执行源程序的翻译程序。\n\
    \n#### 编译程序\n\n- 源程序是用高级语言或汇编语言编写的，目标程序是用目标语言表示的。\n- 两类编译程序：\n  - 汇编程序\n  - 编译程序\n\
    \n汇编语言程序 → 汇编程序 → 机器语言程序\n\n高级语言程序 → 编译程序 → 低级语言程序\n\n#### 编译和执行阶段\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_14_0.png)\n\
    \n- 编译时间：实现源程序到目标程序的转换所占用的时间。\n- 源程序和数据是在不同时间（即分别在编译阶段和运行阶段）进行处理的。\n\n#### 解释程序\n\
    \n![](img/12b57169bd1d5004c5e7193ff0d478d5_15_0.png)\n\n- 解释程序解释执行源程序，不生成目标程序\n\
    - 同时处理源程序和数据\n- 一种有效的方法：先将源程序转换为某种中间形式，然后对中间形式的程序解释执行。\n\n#### 对 total:=total+rate*4\
    \ 的解释过程\n\n- 解释程序先将源程序转换成一棵树\n- 遍历该树，执行结点上所规定的动作。\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_16_0.png)\n\
    \n#### Java语言处理器\n\n- 结合了编译和解释过程\n  - 编译： 一个Java源程序首先被编译成一个称为字节码（bytecode）的中间表示形式。\n\
    \  - 解释： Java虚拟机对字节码解释执行。\n- 即时（Just-in-time）编译\n  - Java即时编译器在运行中间程序处理输入的前一刻首先把字节码翻译成为机器语言，然后再执行程序。\n\
    \n### 1.2 编译的阶段和任务\n\n#### 一、分析阶段\n\n根据源语言的定义， 分析源程序的结构\n\n- 1. 词法分析\n- 2. 语法分析\n\
    - 3. 语义分析\n\n#### 二、综合阶段\n\n根据分析结果构造出所要求的目标程序\n\n- 4. 中间代码生成\n- 5. 代码优化\n- 6.\
    \ 目标代码生成\n\n#### 三、符号表的管理\n\n#### 四、错误诊断和处理\n\n#### 编译程序的典型结构\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_19_0.png)\n\
    \n#### 一、分析阶段\n\n任务： 根据源语言的定义，对源程序进行结构分析和语义分析，从而把源程序正文转换为某种内部表示。\n\n分析阶段是对源程序结构的静态分析。\n\
    \n任务划分：\n\n- 1. 词法分析\n- 2. 语法分析\n- 3. 语义分析\n\n#### 1. 词法分析\n\n- 扫描，线性分析\n- 词法分析器：\n\
    - 依次读入源程序中的每个字符，对构成源程序的字符串进行分解，识别出每个具有独立意义的字符串（即单词），将其转换成记号（token），并组织成记号流。\n\
    - 把需要存放的单词放到符号表中，如变量名，标号，常量等。\n- 形成记号的字符串叫做该记号的单词(lexeme)。\n- 工作依据：源语言的构词规则(即词法)，也称为模式(pattern)。\n\
    - C语言的标识符的模式是：以字母或下划线开头，由字母、数字或下划线组成的符号串。\n\n#### 对 total:=total+rate*4 的词法分析\n\
    \n- (1) 标识符 total\n- (2) 赋值号 :=\n- (3) 标识符 total\n- (4) 加号 +\n- (5) 标识符 rate\n\
    - (6) 乘号 *\n- (7) 整常数 4\n\n#### 空格、注释的处理及其他\n\n- 分隔记号的空格：被删去\n- 源程序中的注释：被跳过\n\
    - 识别出来的标识符要放入符号表。\n- 某些记号还要具有“属性值”\n- 如发现标识符total时，词法分析器不仅产生一个单词符号的类别标记如id，还把它的单词total填入符号表（如果total在表中不存在的话），则total的记号就包括两部分：单词符号的类别标记id、属性值（即指向符号表中该条目的指针）。\n\
    \n#### 2. 语法分析\n\n- 层次结构的分析\n- 把记号流按语言的语法结构层次地分组，以形成语法短语。\n- 源程序的语法短语常用分析树表示\n\
    - 工作依据： 源语言的语法规则\n- 程序的层次结构通常由递归的规则表示，如表达式的定义如下：\n- （1）任何一个标识符是一个表达式\n- （2）任何一个数是一个表达式\n\
    - （3）如果expr<sub>1</sub>和expr<sub>2</sub>是表达式，expr<sub>1</sub>+expr<sub>2</sub>、expr<sub>1</sub>*expr<sub>2</sub>、（expr<sub>1</sub>）也都是表达式。\n\
    \n"
