    \    - 或这些地址的一个集合\n  - 这些信息可以存放在符号表中，用来确定对一个名字的存取方式\n\n## 代码生成算法\n\n输入：基本块的三地址语句\
    \ 输出：基本块的目标代码\n\n方法：对基本块中每个三地址语句x:=y op z执行以下操作\n\n- (1) L:=getreg(i: x:=y op\
    \ z)\n- (2) 查看y的地址描述器，以确定y的值存放的当前位置y′\n  - 若y的值同时存在存储器和寄存器中，那么选择寄存器作为y′\n  - 如果y的值在寄存器L中，更新y的地址描述器（y不在L中）和L的寄存器描述器（L中不含y的值），转(3)。\n\
    \  - 如果y的值不在L中，则生成指令：MOV y′, L\n- (3) 生成指令：op z′, L\n  - 更新x的地址描述器（x的值在L中），如果L为寄存器，更新L的寄存器描述器（L中只含x的值）\n\
    - (4) 若y/z的当前值没有下次引用，在块的出口非活跃，并且在寄存器中，则更新寄存器描述器及y/z的地址描述器（此后，这些寄存器不再包含y和/或z的值）\n\
    \n## 代码生成算法（续1）\n\n- 若三地址语句是 `x := op y`\n  - 与 `x := y op z` 类似\n- 若三地址语句是 `x\
    \ := y`\n  - 若 y 的值在 R 中，更新 R 的寄存器描述器和 x 的地址描述器，以记录 x 的值仅在保存 y 的那个寄存器中。\n    -\
    \ 若 y 没有下次引用，且在块的出口非活跃，则该寄存器不再保留 y 的值。\n  - 若 y 的值在存储器 My 中，则调用函数 `getreg` 找一个存放\
    \ x 值的地址 L。\n    - 若 L 是寄存器，生成指令 `MOV y, L`，并更新 L 的寄存器描述器和 x、y 的地址描述器。\n    -\
    \ 若 L 是内存地址，生成指令 `MOV My, Mx`，更新 x 的地址描述器。\n\n## 代码生成算法（续2）\n\n- 在基本块的出口，使用MOV指令把那些在块出口是活跃的，且当前值还不在存储单元中的名字的值存储到它们的存储器地址中。\n\
    \  - 使用寄存器描述器确定哪些名字的当前值仍保留在寄存器中\n  - 使用地址描述器确定其中哪些名字的当前值还不在存储单元里\n  - 使用活跃变量信息来确定是否需要存储其当前值\n\
    \n## 举例\n\n- 考虑赋值语句 x:=a+b*c\n- 三地址语句序列:\n  - t:=b*c\n  - u:=a+t\n  - x:=u\n-\
    \ 假定在基本块的出口x是活跃的\n- 有两个寄存器R₀和R₁\n\n## 为数组元素赋值语句生成目标代码\n\n- 考虑两种语句形式： a:=b[i] 和\
    \ a[i]:=b\n- 假设数组采用静态存储分配\n  - 基址已知\n  - 下标i存放的位置不同，生成的目标代码也不同\n\n| i的位置 | a:=b[i]\
    \ | a[i]:=b |\n|---|---|---|\n| i在Rᵢ中 | MOV b(Rᵢ), R 2 | MOV b, a(Rᵢ) 3 |\n| i在Mᵢ中\
    \ | MOV Mᵢ, R<br>MOV b(R), R 4 | MOV Mᵢ, R<br>MOV b, a(R) 5 |\n| i在栈中 | MOV Sᵢ(A),\
    \ R<br>MOV b(R), R 4 | MOV Sᵢ(A), R<br>MOV b, a(R) 5 |\n\n## 为指针赋值语句生成目标代码\n\n\
    - 考虑两种语句形式： a:=*p 和 *p:=a\n- P存放的位置不同，生成的目标代码也不同\n\n| p的位置 | a:=*p | *p:=a |\n\
    |---|---|---|\n| p在Rₚ中 | MOV *Rₚ, R 1 | MOV a, *Rₚ 2 |\n| p在Mₚ中 | MOV Mₚ, R<br>MOV\
    \ *R, R 3 | MOV Mₚ, R<br>MOV a, *R 4 |\n| p在栈中 | MOV Sₚ(A), R<br>MOV *R, R 3 |\
    \ MOV a, R<br>MOV R, *Sₚ(A) 4 |\n\n## 为条件语句生成目标代码\n\n- if a<b goto L\n\n实现：\n\n\
    - a-b的结果送入寄存器R\n- 判断R的值为正、负、还是零\n- 若为负，则转移到L\n- 利用条件码表示计算结果或存入寄存器R的值为正、负、还是零\n\
    \n如： if a<b goto L\n\n目标代码：\n\n```\nCMP a, b\n```\n\n```\nCJ< L\n```\n\n语句序列\n\
    \n```\nx:=a+b\n```\n\n```\nif x<0 goto L\n```\n\n目标代码：\n\n```\nMOV a, R₀\n```\n\
    \n```\nADD b, R₀\n```\n\n```\nMOV R₀, x\n```\n\n```\nCJ< L\n```\n\n## 小结\n\n-\
    \ 设计代码生成程序时要考虑的问题\n  - 输入、输出\n  - 存储管理、寄存器分配\n  - 目标机器相关问题（指令、寄存器、编址方式、寻址能力、寻址模式等）\n\
    \  - 指令选择、计算顺序选择\n- 基本块和流图\n  - 基本块：具有原子性的语句序列\n  - 基本块的划分：入口语句的确定\n  - 流图：有向图，结点：基本块，边：控制流\n\
    \n## 小结（续）\n\n- 下次引用信息\n  - 作用\n  - 计算方法\n- 代码生成程序\n  - 寄存器描述器\n  - 地址描述器\n  -\
