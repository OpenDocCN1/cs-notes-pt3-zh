    \ (2)、 power (2.5)、 power (x)等都是合法的。\n+   - 函数模板只是对函数的描述，编译程序并不为其产生任何可执行代码，只有当遇到函数调用时，编译程序自动将模板中的类型参数T用实参的类型来替换，生产一个重载函数，该重载函数称为模板函数。\n\
    +   - 如当遇到函数调用power (2.5)时，将函数模板中出现T的地方用double替换，生成如下的一个模板函数：\n+     double power(double\
    \ x)\n+     { return x*x; }\n\n## 用C++语言描述的对n个数按递增顺序排序的多态函数\n\n```\n#include \"\
    iostream.h\"\n/* 定义函数模板 */\ntemplate <class T>\nvoid sort (T a[], int n) {\nint\
    \ i, j, k;\nT x;\nfor(i=0; i<n-1; i++) {\n    k=i;\n    for(j=i+1; j<n; j++)\n\
    \        if (a[k]>a[j]) k=j;\n    if (i!=k) { x=a[i]; a[i]=a[k];\n    a[k]=x;\
    \ }\n}\n}\n```\n\n```\nvoid main()\n{\nint i, a[8]={4, 6, 1, 3, 8, 2, 7, 5};\n\
    double d[5]={5.5, 8.8, 2.2, 7.7, 3.3};\n/* 对int型数组排序 */\nsort(a, 8);\nfor (i=0;\
    \ i<10; i++) cout << a[i] <<endl;\n/* 对double型数组排序 */\nsort(d, 5);\nfor (i=0;\
    \ i<5; i++) cout << d[i] <<endl;\n}\n```\n\n## 2. 类型变量与类型推导\n\n+   - 为便于讨论未知类型，可以引入变量来表示类型表达式，这样的变量称为类型变量。\n\
    +   - 用希腊字母 α、β、…等来表示类型变量\n+   - 在不要求标识符的声明先于使用的语言中，类型变量的一个重要应用是检查标识符前后使用的一致性\n\
    +   - 检查程序跟踪未声明的程序变量的使用情况\n+   - 从语言结构的使用方式推导其类型称为类型推导\n+   - 例如：推导表达式 `a[i]+i`\
    \ 中各名字的类型\n\n+   - 如分别为 a、i 分配类型变量 α 和 β。\n+   - 类型检查程序在扫描到 `[]` 时，可以知道，a 是数组类型\n\
    +   - 由于 i 出现在数组下标的位置，可以推断 i 是整数，所以：β=int。\n+   - 再根据表达式是一个加法表达式，算符‘+’要求两个运算分量必须有相同的类型，因此可知数组元素也是整数类型。\n\
    +   - 所以：α=array（int，int）\n\n## 从函数体推导函数类型\n\n```\ntype link=↑cell;\ncell=record\n\
    \    info:integer;\n    next:link\nend;\nprocedure example (nptr: link; proc:\
    \ procedure);\nbegin\n    while nptr<>nil do\n    begin\n        proc(nptr);\n\
    \        nptr:=nptr↑.next\n    end\nend;\n```\n\n> proc是一个过程\n> 变元的个数？\n> 变元的类型？\n\
    \n> proc用于链表的每个元素\n> 可以为表元中的整型变量\n> 置初值、或打印其值等\n> proc的类型必是link→void\n\n## 类型推导\n\
    \n+   - 从语言结构的使用方法推导出其类型\n+   - 例：\n\n```\nfunction def(p);\nbegin\nreturn p↑\n\
    end;\n```\n\n对P的类型一无所知，用β表示\n\nP是指向某类型α的指针类型，β=pointer(α)\n\n函数def的返回值的类型：\nα\n\
    \ndef的类型表达式：\n对任何类型α，pointer(α)→α\n\n## 三、错误恢复\n\n+   - 类型错误不直观\n+   - 出错处理会影响类型检查的规则\n\
    +   - 包含出错处理可能使类型体制超出说明正确程序所需要的类型体制\n+   - 类型检查程序必须应付缺少信息的局面\n+   - 使用的技术类似于支持变量隐式声明的语言所需要的技术\n\
    \n## 小结\n\n+   - 语义分析的概念\n+     - 编译的一个重要任务、检查语义的合法性\n+     - 符号表的建立和管理\n+   \
    \  - 语义检查\n+   - 符号表\n+     - 何时创建\n+     - 内容\n+     - 操作\n+       - 检索、插入\n\
    +       - 定位、重定位\n+     - 组织形式\n+       - 非块结构语言\n+       - 块结构语言\n\n## 小 结（续）\n\
    \n+   - 静态语义检查\n+     - 类型检查\n+     - 控制流合法性检查\n+     - 同名变量检查\n+     - 关联名字检查\n\
    +     - 利用语法制导的翻译技术实现\n+   - 类型体制\n+     - 语法结构、类型概念、把类型指派给语言结构的规则\n+     - 类型表达式的定义\n\
    +     - 类型表达式的等价\n+       - 结构等价\n+       - 名字等价\n+       - 类型表达式结构等价的测试算法\n\n\
    ## 小 结（续）\n\n+   - 简单类型检查程序的说明\n+     - 声明语句的类型检查\n+     - 表达式的类型检查\n+     - 语句的类型检查\n\
    +     - 类型转换\n+   - 类型检查有关的其他主题\n+     - 函数和运算符的重载\n+     - 多态函数\n+     - 类型推导\n\
    \n## 作业 (P. 216)\n\n+   - 6. 2\n+   - 6. 3\n+   - 6. 9\n+   - 6. 10\n+   - 6.\
    \ 12\n+   - 6. 13\n+   - 程序设计 3\n\n## 第7章 运行环境\n\n![](img/12b57169bd1d5004c5e7193ff0d478d5_486_0.png)\n\
    \n知识点：\n\n+   - 活动记录、控制栈\n+   - 栈式存储分配\n+   - 非局部名字的访问\n+   - 参数传递方式\n\n## 运行环境\n\
    \n+   - 程序运行时刻的环境，即运行中程序的信息是怎样存储和访问的。\n+   - 执行过程中，程序中数据的存取是通过对应的存储单元来进行的。\n+\
    \   - 存储组织与管理\n+     - 早期的计算机上，存储管理工作是由程序员自己来完成\n+     - 有了高级语言之后，程序中使用的存储单元都由标识符来表示，它们对应的内存地址由编译程序在编译时或由其生成的目标程序在运行时进行分配。\n\
    +   - 存储的组织及管理是编译程序要完成的一个复杂而又十分重要的工作。\n\n## 7.1 程序运行时的存储组织\n\n概念：过程与活动\n\n+  \
    \ 一、程序运行空间的划分\n+   二、控制栈与活动记录\n+   三、作用域及名字绑定\n\n## 概念：过程与活动\n\n+   - 过程的定义\n\
    +     - 一个声明语句\n+     - 把一个标识符和一个语句联系起来\n+     - 标识符是过程名，语句是过程体。\n+   - 过程的分类\n\
    +     - 过程：没有返回值的过程\n+     - 函数：有返回值的过程\n+     - 也可以把函数、一个完整的程序看作过程\n+   - 过程引用：过程名出现在一个可执行语句中\n\
    +   - 参数：\n+     - 形参、实参\n\n"
