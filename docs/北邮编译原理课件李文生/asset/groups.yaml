    +         int age;

    +         char name[20];

    +     } recA;

    +     typedef recA *recP;

    +     recP a;

    +     recP b;

    +     recA *c, *d;

    +     recA *e;

    +     ```


    问题：a、b、c、d和e是否具有相同的类型？


    关键：类型表达式recP和pointer(recA)是否等价


