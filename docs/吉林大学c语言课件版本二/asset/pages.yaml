- pgno: 659
  md: '# 局部量和全局量


    +   由作用域规则可知

    +   - 一个函数或复合语句引入的标识符只在本函数或复合语句内有效，

    +   - 在本函数或复合语句外，便失去了它的意义

    +   - 称它们是局部于声明它们的函数或复合语句

    +   - 或称该标识符相对于声明它们的函数或复合语句来讲是局部量。'
  merge: -1
  img_proc: true
- pgno: 660
  md: '+   - 任何顶层声明的标识符在所有函数内部以及复合语句都可以使用，条件是在函数内部和复合语句中没有与它同名的其它声明

    +   - int x=1;

    +   - void f(int v){ int x=v;}

    +   - void g(int x){x=3;}

    +   - void h(int v){int  x=4;}'
  merge: -1
  img_proc: true
- pgno: 661
  md: '+   - 称顶层声明的标识符相对于函数和复合语句来讲是全局量

    +   - 若一个复合语句嵌套在一个函数或另一个复合语句之内

    +     - 且某一个标识符在函数或其外层复合语句中声明

    +     - 而且在内层复合语句中没有与相应标识符同名的声明

    +     - 则函数或外层复合语句中关于这个标识符的声明在内层复合语句中仍然有效

    +     - 即在内层复合语句中仍可使用这个标识符

    +   - 称在函数或外层复合语句中声明的标识符相对于其内层复合语句来讲是全局量'
  merge: -1
  img_proc: true
- pgno: 662
  md: '+   - 全局量和局部量是一个相对概念。

    +     - 某标识符相对于某复合语句是局部的，相对于其内层复合语句却是全局的；

    +     - 反之某标识符相对于里层某复合语句是全局的，但是相对于声明它本身的那个复合语句来讲却是局部的。


    +   - 全局量在内层具有外层同样的意义

    +     - 在内层对全局量的操作直接反应在外层程序中'
