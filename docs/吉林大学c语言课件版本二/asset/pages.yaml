    \  // s为结果多项式链首；r 始终指向结果多项式s的最低次幕项。\n    /* 申请一个哨兵变量，以便算法统一 */\n    s = (polynome)malloc(\
    \ sizeof(struct item) );\n    r = s;\n    while ( (p!=NULL)&&(q!=NULL) )     \
    \ /* 相加 */\n        if ( p->exp > q->exp ) {\n            adds( p->exp , p->coef\
    \ , r );\n            p = p->next;\n        }else if ( p->exp < q->exp ) {\n \
    \           adds( q->exp , q->coef , r );\n            q = q->next;\n        }else{\n\
    \            adds( p->exp , p->coef+q->coef , r );\n            q = q->next; \
    \     p = p->next;\n        }\n    r=r->next;\n```"
