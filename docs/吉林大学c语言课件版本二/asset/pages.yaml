- pgno: 552
  md: '# C数组的存储分配方式


    在C中，按“行优先”原则分配数组元素的存储空间。也就是说，对数组a来说，它的各个成分被分配的内存空间的顺序是：


    +   - 首先分配第0行元素；

    +   - 然后分配第1行元素；

    +   - ...；

    +   - 最后再分配第n-1行元素，如此等等。


    每行元素按下标值从小到大进行。'
  merge: -1
  img_proc: true
