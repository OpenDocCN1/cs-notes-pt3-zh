- pgno: 782
  md: '# 八皇后 穷举法


    本方法思路是，按某种顺序枚举出全部排列或组合。每当枚举出一种排列或组合之后，便用给定条件判断该种排列或组合是否符合条件。


    +   ● 若符合条件，则本种排列或组合被选中，可以输出或记录下来。

    +   ● 若不符合条件，则把本种排列或组合舍掉。


    八个皇后的排列问题，最简单的方法是八重循环，可以编出如下穷举法程序。


    在下述算法中，用到检验函数check与输出函数out。为简单起见，先省略它们的具体实现细节。'
  merge: -1
  img_proc: true
- pgno: 783
  md: "```\nint main(void){\n    int a[9] ,  i1,i2,i3,i4,i5,i6,i7,i8 ;\n    for (\
    \ i1=1; i1<=8; i1++ )\n        for ( i2=1; i2<=8; i2++ )\n            for ( i3=1;\
    \ i3<=8; i3++ )\n                for ( i4=1; i4<=8; i4++ )\n                 \
    \   for ( i5=1; i5<=8; i5++ )\n                        for ( i6=1; i6<=8; i6++\
    \ )\n                            for ( i7=1; i7<=8; i7++ )\n                 \
    \               for ( i8=1; i8<=8; i8++ ) {\n                                \
    \    a[1] = i1 ;   a[2] = i2 ;\n                                    a[3] = i3\
    \ ;   a[4] = i4 ;\n                                    a[5] = i5 ;   a[6] = i6\
    \ ;\n                                    a[7] = i7 ;   a[8] = i8 ;\n         \
    \                           if ( check() ) out();\n                          \
    \      }\n}\n```"
