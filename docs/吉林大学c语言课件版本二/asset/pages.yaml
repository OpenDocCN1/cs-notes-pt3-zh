    \ farleipointer fn , r , r0 , p ;\n    if( n<1 )                //如果n<=0,则没有法雷序列\n\
    \        return NULL;\n    /* 0/1 , 1/1 送入序列， fn指向链首 */\n    fn = (farleipointer)malloc(sizeof(struct\
