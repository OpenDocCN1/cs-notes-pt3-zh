- pgno: 1005
  md: "```\npt sort(pt base) {          /* 链表排序，base 为链首 */\n    pt p, p0, r, r0,\
    \ q;\n    p0 = NULL;\n    p = base;\n    while (p!=NULL) {   /* 逐项处理，把p加入到子序列中，并保持\
    \ “base--p”递增 */\n        r = base;       /* 寻找位置 */\n        while ((r->key <\
    \ p->key) && (r!=p)) {\n            r0 = r;\n            r = r->next;\n      \
    \  }\n        if (r!=p) {     /* p插入到r0、r之间 */ /* 若 r==p，在链尾，则不用插入 */\n      \
    \      q = p;      /* 把 p 独立出来，令 q 指向它 */\n            p0->next = p->next;\n \
    \           p = p0;\n            if (r == base) {    /* 插入 */    /* 插在链首 */\n\
    \                q->next = base;\n                base = q;\n            } else\
    \ {    /* 插在链中r0、r之间 */\n                q->next = r;\n                r0 -> next\
    \ = q;\n            }\n        }\n        p0 = p;     /* 前进一项 */\n        p =\
    \ p->next;\n    }\n    return base;\n} /* sort */\n```"
  merge: -1
  img_proc: true
