- pgno: 762
  md: '# ## 三个齿轮啮合问题


    设有三个齿轮互相衔接，求当三个齿轮的的某两对齿互相衔接后到下一次这两对齿再互相衔接，每个齿轮最少各转多少圈。


    解:这是求最小公倍数的问题。每个齿轮需转圈数是三个齿轮齿数的最小公倍数除以自己的齿数。


    +   设

    +   - 三个齿轮的齿数分别为:na、nb、nc ；

    +   - 啮合最小圈数分别为:ma、mb、mc ；

    +   - 三齿轮齿数的最小公倍数为k3 。'
  merge: -1
  img_proc: true
