- pgno: 833
  md: '# 文件概述


    +   - 文件是为了某种目的系统的把数据组织起来而构成的数据集合体

    +   - 从实现角度看：文件往往与外部设备、磁盘上的文件联系在一起，也就是与计算机操作系统的文件联系在一起

    +   - 人们往往需要加工处理各式各样的数据，连接各种各样的外部设备。这些数据和设备是千差万别的。

    +   - 为了处理的统一与概念的简化，操作系统把这些外部数据、外部设备一律作为文件来管理。

    +   - 程序设计语言中管理的文件，就是计算机操作系统中的文件。'
  merge: -1
  img_proc: true
- pgno: 834
  md: '# 文件分类


