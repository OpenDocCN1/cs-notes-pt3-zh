- pgno: 243
  md: '# 例5.5　编一个函数，求自然对数底 e 的近似值。


    e的计算公式


    $$e=1+\sum_{i=1}^{\infty}\frac{1}{i!}$$


    由于不能进行无穷项的计算，所以只能进行近似计算，


    当余项


    $$r=\frac{1}{n!}<\varepsilon$$


    余项计算可利用前后项之间的递推关系


    $$r_n=r_{n-1}*\frac{1}{n}$$'
