- pgno: 166
  md: '```

    void main(){

    ```


    p0 = p(x)


    p2 = p(x+2)


    p5 = p(x+5)


    f((x+5)×0.3,(x+5)+(x+5)) = [(x+5)×0.3 + (x+5) + (x+5)] / [7×(x+5)×0.3]


    ```

    f=((x+(x+5))+((x+5)*0.3))/(7*((x+5)*0.3));

    ```


    ```

    p5=(f+(x+5)/2)/(2*x);

    ```


    ```

    y=((p0*p0+5*x)/(p5-sqrt(x)))*p2;

    ```


    ```

    printf ("y(x)=%8.4f\n",y);

    ```


    ```

    }

    ```'
