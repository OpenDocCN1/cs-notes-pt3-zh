- pgno: 461
  md: '# 请读者注意：一定要把类型名与变量名区别开。


    +   - 一个类型可以有名字，它只是表示一种数据结构的一个框架，而不存在一个实体，不给它分配存储空间。

    +   - 只有变量才是一个实体，它具有一块存储空间，并且该块存储空间的结构是相应数据类型的。任何一个类型可以有多个变量，每个变量都具有一块存储空间。

    +   - 类型定义只定义一个标识符是某类型的名字，只定义了相应框架的一个同义词。即所定义的标识符具有相应类型表示的框架结构。但它没有一个实体，没有一块存储空间，亦即没有具体表示一个变量。

    +     变量在变量声明中声明。'
