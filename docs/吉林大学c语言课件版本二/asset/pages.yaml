- pgno: 683
  md: '![](img/e9111c49b068ca3c37fc762f47ecac61_683_0.png)


    按这个想法，移动 64 片金片的问题可以被分解成：


    +   1. 把a针上63片金片，从a针移到c针上，移动过程中b针可用；

    +   2. 把a针上一片金片移到b针上；

    +   3. 把c针上63片金片，从c针移到b针上，移动过程中a针可用。


    设若有一函数


    ```

    move( n , x , y , z )

    ```


    能够完成：“把 x 针上的 n 片金片，移动到 y 针上，移动过程中可以利用 z 针。”，则上述原始问题可以描述成对 move 的调用：


    ```

    move( 64 , a , b , c )

    move( 63 , a , c , b )

    move( 63 , c , b , a )

    ```'
