    +   - 从操作角度看

    +     - 顺序文件

    +     - 随机文件


    +   - 从用户角度看

    +     - 普通文件

    +     - 设备文件


    +   - 从文件内部编码方式看

    +     - ASCII文件

    +     - 二进制文件'
  merge: -1
