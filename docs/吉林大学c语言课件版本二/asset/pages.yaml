- pgno: 658
  md: '+   - 有关存储类别的概念我们不在这里介绍，有兴趣的读者可以查阅第14章或有关资料。目前我们使用它们的省缺存储类别。

    +   - 所有复合语句中声明的变量、函数形式参数全部具有本地生存期，全部为自动变量；

    +   - 所有顶层声明的变量具有静态生存期，全部为静态变量；

    +   - 所有函数都具有静态生存期。'
