- pgno: 728
  md: '主程序中说明变量 n、r；输入 n、r 后以语句 combination(1,r) 调用该函数就是我们的分析算法，也就得到前边的 r 重循环程序。该程序无法在第
    r 层递归调用时，访问（打印）前边诸层调用时的局部量 i。


    显然每层的 i 必须：


    +   - 或者在本层调用时打印；

    +   - 或者用一全局数组变量，每层保存它，最后打印。


    用全局数组变量 a 保存每层的 i 最后打印

    解该问题的完整程序如下：'
