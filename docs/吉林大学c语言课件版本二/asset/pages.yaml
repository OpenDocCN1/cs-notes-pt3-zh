  md: "把该算法抽象化，并考虑递归出口（当j=1时，不必再继续递归，只需打印已经形成的组合），得到函数：\n\n```\nvoid combination (\
    \ int s, int j ){\n    int i ;\n    for ( i=s ; i<=n-j+1 ; i++ )\n        if (\
    \ j>1 )\n            combinatien( i+1 , j-1 )\n        else 打印每层递归进入本函数时的 i\n\
    }\n```"
