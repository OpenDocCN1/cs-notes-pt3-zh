  md: '# ■ sizeof 运算符


    — 单目运算符 sizeof 的


    +   - **操作数**是类型。

    +   - **运算结果**是求得相应类型的尺寸，即存储相应类型数据所需要的字节数。


    +   - `sizeof(int)`　/* 结果是2 */

    +   - `sizeof(char)`　/* 结果是1 */

    +   - `sizeof(struct date)`　/* 若 struct date 是第十一章定义的日期类型，结果是6 */'
