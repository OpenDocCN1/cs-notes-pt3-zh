  md: '# 带子程序的C程序


    编程计算


    $y(x) = \frac{p^2(x) + 5x}{p(x + 5) - \sqrt{x}} \cdot p(x + 2)$


    其中


    $p(u) = \frac{f(u \times 0.3, x + u) + u / 2}{2x}$


    $f(v, w) = \frac{w + v}{7v}$'
  merge: -1
