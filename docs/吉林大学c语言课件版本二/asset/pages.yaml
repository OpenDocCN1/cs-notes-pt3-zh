- pgno: 147
  md: '# 算术赋值转换规则


    | v的类型 | e的类型 | 转换规则 |

    |---|---|---|

    | 整数类型 | 整数类型 | • 适应v的长度，按补码方式直接转换e的值为v类型。

    • 若v的长度>e的长度，则e扩展到v的长度

    • 若v的长度<e的长度，从e的尾部截取合适的长度数据，保持数值e的符号，送入v中 |

    | 整数类型 | 浮点类型 | 把e的值截尾取整，转换成整数类型；在按照v和e都是整数类型的规则进行转换。 |

    | 浮点类型 | 整数类型 | 把e的值直接转换成v的浮点类型，送入v中。 |

    | 浮点类型 | 浮点类型 | 适应v的长度（精度）把e的值转换成v的类型 |'
  merge: -1
  img_proc: true
