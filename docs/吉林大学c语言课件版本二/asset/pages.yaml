- pgno: 941
  md: '# free函数


    +   - 动态申请的内存如果不再使用，应当适时释放这样可以提高程序运行效率。free函数用来释放经过malloc申请的动态空间。free的函数

    +   - 原型

    +     `void free( void *ptr );`

    +   - 功能

    +     释放由malloc申请的内存区域。free的参数ptr是一个指针，指向以前由malloc申请的一个内存区域。'
  merge: -1
  img_proc: true
- pgno: 942
  md: '# 例


    +   - 申请

    +     ```

    +     float *p;

    +     p = (float*)malloc( sizeof(float) );

    +     struct date *pdate;

    +     pdate=(struct date*)malloc(sizeof(struct date));

    +     ```

    +   - 释放

    +     ```

    +     free(p);

    +     free(pdate);

    +     ```'
  merge: -1
  img_proc: true
- pgno: 943
  md: '+   - free(ptr)

    +     /* 释放ptr所指向由malloc申请的内存空间 */


    一块存储区域一经释放，便不能再使用。使用free特别注意，操作不当会产生不可预料的结果。如下情况下使用free都会造成灾难性后果。


    +   - ptr无值;

    +   - ptr的值为NULL;

    +   - ptr所指向的空间不是经过malloc申请来的;

    +   - 对一次申请的存储区进行多次释放（实际可能是ptr无值或值为NULL）。'
  merge: -1
