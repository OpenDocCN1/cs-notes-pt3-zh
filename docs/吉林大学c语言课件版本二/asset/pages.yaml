- pgno: 680
  md: '这里讲的只是一般规律和程序设计思想。实际使用时，设计递归函数要复杂得多。编写递归程序要注意：


    +   - 递归程序漂亮、好看、好读、风格优美，但执行效率低。

    +   - 计算 n！的函数即可以写成循环形式，也可以写成递归形式。但是有些循环程序写成递归很困难。反之，有些递归程序写成循环也很困难，甚至是不可能的。

    +   - 终结条件。程序一定要能终止，不能无限递归下去。

    +   - 使用全局量要特别小心。用不好，单元发生冲突，将导致程序出错。'
