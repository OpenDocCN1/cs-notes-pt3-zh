- pgno: 957
  md: '实际上前边讲的栈，队列都是单向链表，但是栈和队列只是单向链表的两种特殊应用——操作只在头尾进行。下边介绍单向链表的一般操作：


    # 创建单向链表：


    创建单向链表，是指用一项一项的数据逐步建立、形成一个链表。可以分成向链表加入数据和向链尾加入数据两种方式。


    创建单向链表可以分成向链表加入数据和向链尾加入数据两种方式。新项加入链表就是压栈的算法；新项加入链尾就是队列中入队的算法。只要反复调用那里的函数或将函数体放在循环语句中即可，这里不赘述。'
  merge: -1
  img_proc: true
- pgno: 958
  md: "# 遍历单向链表：\n\n遍历是指从头到尾将链表上数据全部加工一遍。可如下左端的算法。但实用中，经常用如下右端的算法来遍历单向链表。\n\n```\n\
    p = base;\nwhile (p != NULL) {\n    加工 p ->\n    p = p-> next;\n}\n```\n\n```\n\
    p0 = NULL;\np = base;\nwhile (p != NULL) {\n    加工 p ->\n    p0 = p;\n    p =\
    \ p-> next;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 959
  md: "# 在单向链表上检索：\n\n检索是指在单向链表上查找关键字等于某给定值的节点，若找到则带回相应节点的指针；否则带回NULL。设关键字域域名为key；欲检索的关键字值为key0。如下算法实现检索：\n\
    \n```\np0 = NULL;\np = base ;\nwhile (p != NULL && p->key !=key0 ) {\n    p0 =\
    \ p;\n    p = p-> next;\n}\n```"
  merge: -1
