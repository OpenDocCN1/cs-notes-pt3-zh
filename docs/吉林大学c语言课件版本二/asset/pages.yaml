    +   - 函数


    # 经常简称 “指向T类型变量的指针变量v”


    +   - “v指向T类型”

    +   - “T类型的指针v”


    # 例如


    ```

    int *iptr1, *iptr2 ; /* 说明指向int类型变量的指针变量 iptr1和iptr2 */

    char * cptr ;     // 说明指向char类型变量的指针变cptr

    int x , y ;

