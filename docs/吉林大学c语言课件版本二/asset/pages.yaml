- pgno: 856
  md: '# 读字符串


    函数原型：


    ```

    char *fgets( char *str, int num, FILE * fpointer );

    ```


    | 返回值 = { str所指的字符数组首地址 | 操作成功 |

    | NULL | 否则 |


    +   - 字符串的自然结束符是 “换行符” 和 “文件结束符”。


    +   - 若读到 num-1 个字符后还没遇到结束符，则也强制结束，这时把 num-1 个读入的字符送入数组 str 中。


    +   - 读入结束后，在数组 str的字符串末尾加字符串终止字符 NULL;


    +   - 并将文件读写位置指针向前移动实际读取的字节个数'
  merge: -1
  img_proc: true
- pgno: 857
  md: '# 写字符串


    函数原型


    ```

    int *fputs( char *str , FILE * fpointer );

    ```


    功能：


    把str所指字符串（不包括字符串结束符NULL）写入fpointer指向的文件，同时将读写位置指针向前移动num（字符串长度）个字节。


