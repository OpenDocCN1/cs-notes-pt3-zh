- pgno: 57
  md: '# # C标识符分成两大类


    +   - 标准标识符


    +     - 标准库中使用的标识符


    +     - 这些标识符的含义已经由C预先定义好了，也称预定义标识符。


    +     - 不允许程序员在程序中使用它们。


    +   - 用户自定义标识符


    +     - 用户依据需要给自己使用的类型、变量、函数等对象起的名字，它类似于数学中的符号名。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - 任何标识符只有声明后才有意义

    +   - C规定不允许使用无定义的标识符

    +   - 因此程序中出现的一切标识符都必须给以声明，指出该标识符的具体意义。

    +   - 所有标识符必须先声明再使用'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# # 保留字


    +   - <保留字> → auto | bool | break | case | char

    +   - | _Complex | const | continue

    +   - | default | restrict | do | double | else

    +   - | enum | extern | float | for | goto

    +   - | if | _Imaginary | inline | int | long

    +   - | register | return | short | signed

    +   - | sizeof | static | struct | switch | typedef

    +   - | union | unsigned | void | volatile | while'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 在使用自定义标识符时需要注意以下几点


    +   ① 不能与保留字重名

    +   ② 不能与标准标识符重名

    +   ③ 必须声明且必须先声明后使用

    +   ④ 不允许重复声明

    +   ⑤ 拼写完全一致的两个标识符是相同的

    +   ⑥ 字母是区分大小写的

