- pgno: 797
  md: '从上例可以看出，穷举法与试探法的着眼点及主要区别在于：


    穷举法是举出全部可能的格局，对每种格局进行检验，使合格者入选，不合格者淘汰。


    试探法是从初始满足条件的格局开始，逐步前进。每前进一步都判断子格局是否合适。


    +   - 若当前子格局合适则进入下一级；

    +   - 若当前子格局不合适则选同一级的下一个子格局；但是若同级子格局已全部试探完毕，则回溯到上一级

    +   - 直到当前子格局够长为止。'
  merge: -1
  img_proc: true
- pgno: 798
  md: '显然穷举法的运算量比试探法要大的多。因为它要考虑一切情况的排列，而试探法可以在中间丢掉大量的不合格排列。


    事实上许多问题的穷举法是不适用的, 八皇后问题穷举法有8^8种排列，把每一种情况都排出来，并检验其是否合格显然是不可能的。


    在上述算法中, 不论是穷举法还是试探法, 都是用循环迭代的方式给出的解法。循环程序可以用递归来表示。


