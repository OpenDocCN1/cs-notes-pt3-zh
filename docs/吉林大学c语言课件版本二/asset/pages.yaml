- pgno: 651
  md: '# C 标识符作用域


    | 类别 | 声明的作用域 |

    | --- | --- |

    | 顶层标识符 | 从声明点到本源程序编译单位文本结束 |

    | 函数定义中的形参 | 从声明点到函数体结束 |

    | 函数原型中的形参 | 从声明点到函数原型结束 |

    | 复合语句中声明的标识符 | 从复合语句中声明点到复合语句结束 |

    | 语句标号 | 相应标号声明所在的整个函数体 |

    | 预处理器的宏 | 从相应宏定义的#define命令到本源程序编译单位文本结束，或第一个取消相应宏定义的#undef命令 |'
  merge: -1
  img_proc: true
- pgno: 652
  md: '+   - C中，每个源程序编译单位，每个函数定义、函数原型、复合语句都各自构成一个作用域区域。

    +     - 在嵌套结构中，若里层区域的一个标识符与外层区域的某标识符同名，则外层标识符的作用域不包括里层那个同名标识符的作用域区域。

    +     - 程序中使用的任意一个标识符必须声明；并且必须先声明后使用；在同一区域内任何标识符不得重复声明。'
