    \ printf(\"please input x: \");\n    scanf(\"%f\",&x);\n    y=(p(x)*p(x)+(5*x))/(p(x+5)-sqrt(x));\n\
    \    printf(\"y(x)=%8.4f\\n\",y)\n}\n```\n\nReturn: 表达式的值作为函数值返回\n\n函数定义说明符, 小括号()为形式参数表\n\
    \n{}内为函数p的函数体, 具体规定的操作和计算\n\nP(x)称为函数调用\n\n执行顺序:11→12→13（分别以x, x+5, x+2为实参调用函数p）→14"
