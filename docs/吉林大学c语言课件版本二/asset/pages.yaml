    - 然后在合理的排列从n-(r-1)+1开始的后部的r-1个元素。


    步骤1 “在第n-r+1位上排列一个合格的元素”，即是把8个元素顺次的排列在第n-r+1位上,并对每个元素检验是否合格,使合格者入选。


    步骤2 “合理的排列后部的r-1个元素” 显然与 “合理的排列后部的r个元素” 具有相同的特征属性,只是排列的元素个数减少了,也就是说它表现为对queen的递归调用。'
