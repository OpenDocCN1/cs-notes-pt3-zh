- pgno: 784
  md: '# 八皇后 试探法


    +   - 按规律，从一满足条件的初始状态出发，逐步生成满足条件的子排列，不断增加子排列长度。

    +   - 增加子排列长度过程中，每增加一位，生成一个子排列后，便检验它是否满足条件。

    +     - 不满足条件，则换一个子排列—即修改当前位置

    +     - 满足条件，则延长子排列，增加子排列长度。

    +   - 子排列的长度满足要求长度，便找到一个解。

    +   - 若要求找一个解即可，这时便可以结束。

    +   - 若要求找所有解，这时可以输出或记录本解，然后按前述思路，继续修改排列，继续试探，找下个解'
  merge: -1
  img_proc: true
- pgno: 785
  md: '# 在上述试探过程中，修改当前位置时：


    +   - 若当前位置上还有没被试探过的元素，则应该取下一个没被试探过的元素进行试探

    +   - 若当前位置上所有元素都被试探过了，则在当前位置上没办法再修改了


    +   - 这说明前边的某个位置有问题，放置的元素不对，显然应该向回退一位。


    +   - 回溯后，原来的上一个位置变成了当前位置，则又变成修改当前位置的问题了。


    +   - 这时，同样还应该考虑取下一个没被试探过的元素进行试探，以及是否所有元素在当前位置上都被试探过了并回溯的问题。'
  merge: -1
