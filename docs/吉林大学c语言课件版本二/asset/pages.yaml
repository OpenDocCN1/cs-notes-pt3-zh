  img_proc: true
- pgno: 729
  md: "```\n#include \"stdio.h\"\n#define nn 10\nint n, r;\nint a[ nn ], k;\nvoid\
    \ combination( int s, int j ) {\n    int i;                 /* △ */\n    for (\
    \ i=s; i<=n-j+1; i++ ) {\n        a[r-j]=i;           /* r-j不能用s */   /* ◇ */\n\
    \        if ( j>1 )\n            combination( i+1 , j-1 ); /* ☆ */\n        else\
    \ {\n            for (k=0;k<r;k++)\n                printf(\"%6d\", a[k]);\n \
    \           printf(\"\\n\");\n        } /* □ */\n    } /* $ */\n}\nint main (void)\
    \ {          /* ◎ */\n    printf(\"Enter n,r:\");\n    scanf(\"%d%d\", &n, &r\
    \ ); /* ◎ */\n    combination( 1,r );      /* ※ */\n}\n```"
