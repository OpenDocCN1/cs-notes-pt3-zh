- pgno: 695
  md: '# 间接递归


    +   - 前边讲的递归程序，都是在函数本身的函数体内调用自己。

    +   - 而递归的动态含义是在调用函数进入函数后，没有退出之前，又再一次调用本函数。

    +   - 可能存在下图所示情况，这显然也是进入P后，没退出P之前又再一次调用P，这种情况称“间接递归”。

    +   - 相应前边讲的“在P中直接调用P”称“直接递归”。


    | | |

    |---|---|

    | 调用函数 P | |

    | P 调用 P₁ | |

    | P₁ 调用 P₂ | |

    | ... | |

    | ... | |

    | Pₙ₋₁ 调用 Pₙ | |

    | Pₙ 调用 P | |'
  merge: -1
  img_proc: true
- pgno: 696
  md: "显然，在间接递归情况下，各函数之间的位置关系不论怎样排列都有违背C的标识符必须先声明后使用的原则。例下述左端程序片段，不论怎样排列 p 与 q 的位置，都解决不了问题。\n\
    为了解决这个问题必须使用函数原型，对一个函数进行提前声明。\n下述右端程序片段，第一行说明函数标识符 q 及其特性，但具体有关 q 的算法部分在后边给出。解决了该问题。\n\
    \n```\nint p(...) {\n    ...\n    ... q(...) ...\n    ...\n}\nint q(...) {\n \
    \   ...\n    ... p(...) ...\n    ...\n}\n```\n\n```\nint q(...) ;\nint p(...)\
    \ {\n    ...\n    ... q(...) ...\n    ...\n}\nint q(...) {\n    ...\n    ... p(...)\
    \ ...\n    ...\n}\n```"
