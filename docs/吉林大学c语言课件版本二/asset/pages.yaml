  md: '# 需要注意的问题


    +   - 运算

    +     - C 没有定义施于数组类型上的运算

    +     - 数组类型的运算都是通过其成分实现

    +     - 例子


    求整型数组 t0、t1 的差送入整型数组 w 中，应如下：


    ```

    for ( m=0；m<=9；m++)

    w[m] = t0[m]-t1[m]；

    ```


