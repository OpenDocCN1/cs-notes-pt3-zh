- pgno: 837
  md: '# 顺序文件和随机文件


    +   - 顺序文件的特点：文件分成两种模式

    +     - 读模式    写模式

    +   - 在任意时刻，一个顺序文件只能处于两种模式之一。当一个顺序文件处于读模式时，只能从该文件读数据。

    +   - 反之，当一个顺序文件处于写模式时，只能向该文件写数据。

    +   - 从操作角度看，顺序文件只能顺序操作。

    +   - 对于读来讲，顺序文件只能从文件第一成分开始顺序的，一个成分接一个成分的读数据。

    +   - 对于写来讲，顺序文件只能在文件尾一个成分接一个成分的向文件里写数据，每次写进的成分都放在文件末尾'
  merge: -1
  img_proc: true
- pgno: 838
  md: '+   - 随机文件的特点是：对文件的操作是随机

    +   - 在同一时刻，即可以向文件中写，也可以从文件中读（文件没有读写模式之分）。

    +   - 读写操作可以针对文件中任意成分进行。

    +   - 例如

    +     - 第一次读了第100个成分

    +     - 然后再读第3个成分

    +     - 然后再用一个新数据修改第50成分

    +     - 将其写入第50个成分中

    +     - 然后又读第200个成分..., 等等。

    +   这是允许的，并且是正确的。'
  merge: -1
  img_proc: true
- pgno: 839
  md: '# 普通文件和设备文件


    +   - 普通文件是指驻留在磁盘或其它外部介质上的一个有序数据集，可以是源程序文件、目标程序文件、可执行程序文件；也可以是一组待输入处理的原始数据，或者是一组输出的结果。

    +   - 设备文件是指与主机相联的各种外部设备，如显示器、打印机、键盘等。

    +   - 在操作系统中，把外部设备也作为文件来进行管理，把它们的输入、输出等同于对磁盘文件的读写。通常显示器定义为标准输出文件，键盘是标准输入文件'
  merge: -1
  img_proc: true
- pgno: 840
  md: '# ASCII文件和二进制文件


    +   - ASCII文件就是ASCII码文件，也称为文本文件、TEXT文件。这种文件每个字符对应一个字节，用于存放相应字符的ASCII码，也就是存放字符的存储形态的编码。


    +   - 字符1、2、3、4的ASCII码分别为49、50、51、52（十六进制的31、32、33、34），字符串“1234”的存储形式为：


    ![](img/e9111c49b068ca3c37fc762f47ecac61_840_0.png)


    +   - 共占用4个字节。ASCII文件可以在屏幕上按字符显示，例如源程序文件就是ASCII文件，用DOS命令TYPE可以显示文件的内容。由于是按字符显示，因此能读懂文件内容。'
  merge: -1
  img_proc: true
- pgno: 841
  md: "+   - 二进制文件就是二进制码文件，它把数据按二进制编码方式存放到文件中。例如，数1234的存储形式为：\n+   \n+     0000010011010010\n\
    +   \n+     只占二个字节。\n\n+   - 用TYPE命令显示二进制文件是无意义的，其内容无法读懂。"
  merge: -1
  img_proc: true
- pgno: 842
  md: '# 流式文件


    +   C系统的文件操作，不区分文件类别。不论顺序文件还是随机文件、普通文件还是设备文件、ASCII文件还是二进制文件。


    +   C把文件一律都看成是“字节流”，以字节（每个字节可能是一个字符，也可能是一个二进制代码）为单位进行操作处理。


    +   对字节流的操作；输入输出的开始和结束都由程序控制，不受物理符号(如回车符)的影响。把这种文件操作方式称作“流式文件”。'
  merge: -1
  img_proc: true
- pgno: 843
  md: "# 文件指针\n\n+   - C 系统为了处理文件，为每个文件在内存中开辟一个区域，用来存放文件的有关信息，如文件名、文件状态以及文件当前位置等。\n\
    \n+   - 这个区域被作成一个称为 FILE 类型的结构体。FILE 的类型由系统定义，保存在头文件 stdio.h 中，其具体结构我们暂时不用关心。\n\
    \n+   - C 程序中用指向 FILE 类型变量的指针变量(简称“文件指针”)来标识具体文件。变量声明\n+   \n+     FILE *fp;\n\
    \n+   - 声明了一个文件指针变量 fp，以后 fp 可以用来标识具体文件。"
  merge: -1
  img_proc: true
- pgno: 844
  md: '# 标记


    +   - C文件是一个流式文件，在该字节流上有一个隐含的暗标记，该标记总是指向文件中正要操作的字节，即下一个字节，称该标记为文件读写位置指针。


    +   - 例如：

    +     □□□ ... □ ...  指向文件首，即指向第一个字节

    +     ↑

    +     □□□□ ... □ ...  指向第四个字节；

    +     ↑

    +     □□□ ... □□.  指向文件尾；

    +     ↑'
  merge: -1
  img_proc: true
- pgno: 845
  md: '# 几个常量


    C系统引进几个常量标志文件处理状态。最常用的是 EOF 和 NULL，它们是 stdio.h 中预定义的常量。


    +   - **EOF**: 值为 “-1”

    +     习惯上表示文件结束，或文件操作出错；


    +   - **NULL**: 值为 “0”

    +     习惯上表示打开文件失败等。'
  merge: -1
  img_proc: true
- pgno: 846
  md: '# 文件操作


    +   - C没有文件操作语句，C文件操作全部通过系统定义的库函数来实现。

    +   - “库函数”是指系统已经定义好的，存放在“函数库”文件内的，可以被用户直接调用的函数。这些库函数根据其功能的不同，存放在不同的函数库中。

    +   - 库函数本身并不属于语言，它是系统根据需要提供给用户使用的函数。C标准定义了常用的函数库和每个函数库中常用的库函数。但是不同的编译系统提供的函数库不同，不同编译系统在每个函数库中提供的库函数也不同。为了提高程序的可移植性，用户应该只使用C标准定义的函数库和库函数。'
  merge: -1
  img_proc: true
- pgno: 847
  md: '+   - 对应每个函数库，有一个头文件，在头文件中包含相应函数库中所有函数的函数原型。用户使用库函数时，需要把相应的头文件用 `#include`
    命令括入到自己的程序文件中。

    +   - 文件操作函数库的头文件是 “`stdio.h`”，在用户程序中只要涉及文件操作，即只要涉及输入输出就应该把该文件括入程序中，使用的程序行是：

    +     `#include "stdio.h"`

    +   - 这就是为什么前述各个章节的程序都含有这一行的原因。'
