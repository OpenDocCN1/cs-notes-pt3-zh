- pgno: 863
  md: '# 文件定位


    C文件是一个流式文件，在该字节流上有一个隐含的暗标记（文件读写位置指针），该标记总是指向文件中正要操作的字节。


    +   - 当以读模式（“r”）打开文件时，文件读写位置指针指向文件开始；

    +   - 当以写模式（“w”）打开文件时，文件读写位置指针指向文件开始；

    +   - 当以追加写模式（“a”）打开文件时，文件读写位置指针指向文件尾；

    +   - 当以各种随机模式（“a+”、“w+”、“a+”）打开文件时，文件读写位置指针指向文件开始。'
  merge: -1
  img_proc: true
