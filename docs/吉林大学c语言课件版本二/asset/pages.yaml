- pgno: 768
  md: '# 验证三角形外心定理


    三角形三条边的垂直平分线交于一点，该点是三角形外接圆的圆心。


    解：不失一般性，假设三角形的任意一条边都不平行于任意一个坐标轴。依据平面几何知识，该问题的验证步骤应该是：


