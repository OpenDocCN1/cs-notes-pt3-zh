- pgno: 948
  md: "如下实现栈的操作：\n\n```\nvoid stackinitial(void) {\n    top = NULL ;\n}\nvoid stackpush\
    \ ( items x ) {\n    pstacktype  p ;\n    p = (pstacktype)malloc(sizeof(stackcelltype));\n\
    \    p->data = x ;\n    p->prodocessor = top ;\n    top = p ;\n}\nvoid stackpop\
    \ ( items *x ) {\n    pstacktype p ;\n    if ( top != NULL ) {\n        *x = top->data\
    \ ;\n        p = top ;\n        top = top->predecessor ;\n        free(p);\n \
    \   } else printf(\"栈下溢\\n\");\n}\n```"
