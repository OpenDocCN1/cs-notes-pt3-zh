  md: '# 格式化读写


    +   - 读/写多个含格式的数据时选用 fscanf() 和 fprintf() 函数。

    +   - 函数 fscanf() 和 fprintf() 与函数 scanf() 和 printf() 的功能相似，

    +   - 区别在于函数 fscanf() 和 fprintf() 操作对象是一般文件，而 scanf() 和 printf() 操作对象是标准输入输出文件。

    +   - 格式化读写是把数据按 fscanf() 和 fprintf() 函数中格式控制字符串中控制字符的要求进行转换，然后再进行读/写。

