- pgno: 964
  md: '# 树——tree


    二叉树，二叉树的每个数据项附带两个指针，分别指向它的两个分支。二叉树的定义：


    +   - 空是树；

    +   - 一个结点连接两个不相交的树,仍为树；

    +   - 所有结点具有相同的数据类型。


    ( a + b / c ) * ( d - e * f )


    ![](img/e9111c49b068ca3c37fc762f47ecac61_964_0.png)'
  merge: -1
  img_proc: true
- pgno: 965
  md: '![](img/e9111c49b068ca3c37fc762f47ecac61_965_0.png)


    设 ti 为二叉树的一个结点，一般 ti 由两部分组成：


    +   - 基本数据部分------保存本结点上的基本数据；

    +   - 指针部分连------接本结点以下的其它结点。


    结点 ti 的指针连接的结点称为 ti 的子结点，相应 ti 称为其子结点的父结点。


    ti的指针部分有两个指针：左指针、右指针。称 ti 的左指针连接的部分为 ti 的左子树，ti 的右指针连接的部分为 ti 的右子树。若左、右子树均空，则称
    ti 为叶结点。'
  merge: -1
  img_proc: true
- pgno: 966
  md: '为了检索操作方便，一般把两叉树组织成两叉检索树。两叉检索树的定义是：


    +   - 设树中每个结点的数据部分有一个数据项 **key** 是有序的，称该数据项为关键字。

    +   - 一个两叉树称为检索树，

    +   - 如果对每个结点 **ti** ，它的左子树中所有结点的 **key** 值都小于 **ti** 的 **key** 值；

    +   - **ti** 的右子树中所有结点的 **key** 值都大于 **ti** 的 **key** 值。


    ![](img/e9111c49b068ca3c37fc762f47ecac61_966_0.png)'
  merge: -1
  img_proc: true
