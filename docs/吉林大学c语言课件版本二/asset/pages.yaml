- pgno: 932
  md: '# 如图的链式结构可以满足要求：


    +   - 当增加一张卡片时，只需要向计算机系统申请一块空间，联到链的适当位置上。例如，要增加一张卡片 50 插入到 2、3 之间，则只需要如下修改指针：

    +   - 若删除一节，只需要将其从链上摘下来即可。例删除2节得链上已经没有2节了，删掉的节所占的存储空间还可以还回计算机系统，以便作其它用途。


    ![](img/e9111c49b068ca3c37fc762f47ecac61_932_0.png)'
  merge: -1
  img_proc: true
- pgno: 933
  md: '+   - 这就是一种动态数据结构中的——链表。动态数据结构上的一项是一个动态变量，指针是标识动态变量的有力手段。动态变量与静态变量的区别在于：

    +   - 静态变量是程序中由程序员“显式”说明的变量。它有一个名字，在编译时，编译程序已经给它分配存储空间。这块存储空间用变量的名字来标识。'
  merge: -1
  img_proc: true
- pgno: 934
  md: '+   - 动态变量在程序中没有“显式”说明，它没有名字

    +   - 在编译时编译程序不知道有该变量，不给（也不可能给）它分配空间。

    +   - 动态变量是在程序运行时

    +     - 随程序存储数据的需要，申请空间函数（例如 malloc，当然也是由程序员安排的）随机的动态的申请来的空间。它没有名字，一般动态变量都由指针标识。

    +     - 当使用完毕后，由释放空间函数（例如 free）释放，还回计算机存储管理系统，以备它用。'
  merge: -1
  img_proc: true
- pgno: 935
  md: 注意：这里所说的静态变量不是C语言中由静态存储类别static声明的变量；动态变量也不是C语言中由自动存储类别auto声明的变量。而是一般程序设计概念中的静态变量、动态变量
  merge: -1
