  md: "# 例7-7 编函数，求m*n个元素的给定float型数组各个元素之乘积。\n\n```\nfloat arrmul(int m , int n ,\
    \ float *arr){\n    int u, v;\n    float mul;\n    mul = 0;\n    for( u=0; u<m;\
    \ u++)\n        for( v=0; v<n; v++)\n            mul = mul * (*(arr+u*n+v));\n\
    \    return  mul ;\n```\n\n设有声明\nfloat a[10][15];\n则可以用如下任何一种形式调用该函数：\narrmul(10,15,&(a[0][0]))\n\
    arrmul(10,15,a[0])\narrmul(10,15,*a)\n\n在本例中，形式参数是一个指向float类型的指针变量，实在参数把a数组第一个元素a[0][0]的指针（地址）送入形式参数arr之中。&(a[0][0])、a[0]、*a都是a[0][0]的地址。实际上本例是把二维数组作为一维数组对待的，地址计算是采用一维方式进行的。"
