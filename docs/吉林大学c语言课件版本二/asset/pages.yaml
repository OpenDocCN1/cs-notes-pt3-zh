- pgno: 654
  md: '# 生存期


    +   - 生存期是一个动态概念

    +   - 描述当程序运行起来后，一个对象（标识符）是否有效存在

    +   - 所谓对象主要是指变量和函数

    +   - 对于类型不同的变量和函数在程序运行时要分配存储空间，也就是具有存在性。

    +   - 对象的生存期是保持所分配存储空间的那段程序的运行期间。

    +   - 如果变量有一个初始化语句，则每次进入它的生存期创建它的同时，对它重新初始化。'
  merge: -1
  img_proc: true
- pgno: 655
  md: '# 静态生存期


    如果所分配的存储空间在程序执行前开始，并保持到程序执行终止，则称此对象具有静态生存期。C语言中


    +   - 所有函数都具有静态生存期；

    +   - 所有顶层声明的变量都具有静态生存期；

    +   - 复合语句中声明的变量是否具有静态生存期，取决于存储类别；

    +   - 函数形式参数是否具有静态生存期，取决于具体声明的存储类别


    具有静态生存期的对象（变量、函数）在程序的整个运行期间全都存在。


    程序开始运行，它的生存期开始，并创建它；直到程序运行结束，它的生存期结束并删除它。'
  merge: -1
  img_proc: true
- pgno: 656
  md: '# 本地生存期


    +   - 如果对象在进入复合语句或函数时生成，在退出复合语句或函数时删除，则称为具有本地生存期。


    +   - 具有本地生存期的对象

    +     - 当程序运行进入复合语句或函数时创建它，并且它的生存期开始

    +     - 当程序运行退出复合语句或函数时删除它，并且它的生存期结束

    +     - C语言中把具有本地生存期的变量称为自动变量。


    +   - 复合语句中声明的变量是否具有本地生存期，取决于具体声明的存储类别；


    +   - 函数形式参数是否具有本地生存期，取决于具体声明的存储类别。'
  merge: -1
  img_proc: true
- pgno: 657
  md: '# 动态生存期


    +   - C中的数据对象还可以具有动态生存期

    +   - 可以随意显式地创建和删除。

    +   - 动态对象的创建和释放，通过动态存储分配函数 (malloc、free等)显式实现。

    +   - 复合语句中声明的变量、函数形式参数具有本地生存期还是具有静态生存期依赖于它的存储类别。'
  merge: -1
