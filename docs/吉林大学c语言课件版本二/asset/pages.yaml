- pgno: 554
  md: '# 使用成分类型指针


    设有声明：


    ```

    int *aptr, a[m][n] ,x ;

    ```


    则可以直接用aptr访问a的成分。使用方法：


    +   - 首先使aptr指向a的某个成分a[i][j]，

    +   - 然后以该成分的地址为基点，计算所要访问的数组成分的相对地址，并进行访问。

    +   - 最常用的地址基点是a数组的第一个成分a[0][0]，例如

    +     ap tr = &(a[0][0])

    +   - 由于a[0]指向a[0][0]，所以这个运算还可以写成

    +     ap tr = a[0]'
  merge: -1
  img_proc: true
- pgno: 555
  md: '+   - 在上述赋值运算的前提下，a的成分a[u][v]的地址为

    +     aptr+u*n+v

    +   - 若想把a[u][v]的值送入变量x中，可以使用赋值运算：

    +     x = *(aptr+u*n+v)

    +   - 这个运算等价于

    +     x = a[u][v]

    +   - 若想把某表达式e的值送入数组a的成分a[u][v]中，可以使用赋值运算：

    +     *(aptr+u*n+v) = e

    +   - 这个运算等价于

    +     a[u][v] = e'
  merge: -1
  img_proc: true
