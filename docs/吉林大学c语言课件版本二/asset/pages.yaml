- pgno: 504
  md: '# 指针变量


    意义


    +   - 指针变量简称指针

    +   - 是一种特殊的变量

    +   - 它里面存储的“值”被解释成为一个变量的地址，确切的说是计算机内存的一个地址。


    声明指针变量


    说明指向T类型变量的指针变量使用形式：


    ```

    T    *p, *p, ... *p;

    ```


    其中，每个p都是标识符，是被说明的指针类型的变量，确切的说是“指向T类型变量的指针变量”。'
  merge: -1
