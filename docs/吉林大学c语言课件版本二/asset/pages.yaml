  md: "解本题的一般想法是使用 r 重循环\n\n```\nfor ( i1 = 1 ; i1 <= n-r+1 ; i1 ++ )\n    for ( i2\
    \ = i1+1 ; i2 <= n-r+2 ; i2 ++ )\n        ...\n        ...\n    for ( ir = ir-1+1\
    \ ; ir <= n ; ir ++ )\n        印( i1 , ... , ir )\n```\n\n但是，由于 r 是可变的，所以循环嵌套层数亦是可变的，因此不知道应该用多少个\
