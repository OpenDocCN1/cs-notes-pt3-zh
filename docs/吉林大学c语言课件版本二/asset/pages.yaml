- pgno: 600
  md: "```\nvoid sort(int col,int row,int *p){\n    int i,j,k,r;\n    for(i=0;i<col*row-1;i++){\n\
    \        j=i;\n        for(k=i+1;k<col*row;k++)\n            if(*(p+k)<*(p+j))\n\
    \                j=k;\n        r=*(p+i);\n        *(p+i)=*(p+i);\n        *(p+j)=r;\n\
    \    }\n}\n```"
