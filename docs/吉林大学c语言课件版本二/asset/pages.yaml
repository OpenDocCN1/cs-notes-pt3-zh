    +   - 求取不同类型变量或常量地址的表达方式不同：

    +     - 基本类型变量、数组成员、结构体变量、联合体变量等，用求地址运算符“&”获取变量的地址；

    +     - 数组的地址与其第一个元素（成员）的地址相同，用数组名字本身表示；

    +     - 函数的地址为函数的入口地址，用函数名字表示'
