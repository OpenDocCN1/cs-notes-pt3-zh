    # 取出数据时


    当已经到达缓冲区末尾时，下一个数据便从缓冲区首部第一个位置上取出。


    # 显然


    +   - 当送入数据时，缓冲区应有空位置才能送入

    +   - 当取出数据时，缓冲区应有数据才能取出'
