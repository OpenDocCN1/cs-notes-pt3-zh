- pgno: 725
  md: '# 从前 n 个自然数


    1, 2, 3, ..., n


    中取 r 个数作组合的问题可以分解成：


    +   1. 先分别取这 n 个数中的一个数 i，只需要在前 n-r+1 个数中取 i；


    +   2. 然后从该 i 后边的 n-i 个数中取 r-1 个数作组合 i+1, i+2, ..., n


    +   3. 最后把每组 r-1 个数的组合与前边的 i 合并，从而构成 r 个数的组合。


    当然，从 i 后取 r-1 个数作组合的问题还可以用同样的方法来分解。'
  merge: -1
  img_proc: true
- pgno: 726
  md: '我们设想，若有一个函数


    combination ( s , j )


    能够完成从自然数序列中，取 j 个数作组合


    s , s+1 , s+2 , ... , n


    则我们的原始问题可以写成函数调用：


    combination ( 1 , r )


    而我们的分析算法则可以写成：


    ```

    for i = 1 TO n-r+1 DO

    ```


    ```

    combination ( i+1 , r-1 )

    ```'
