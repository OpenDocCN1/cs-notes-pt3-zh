- pgno: 587
  md: '# 命令行参数


    到目前为止，我们编的一切程序都没有涉及与操作系统之间的联系。考虑问题：编程序实现操作系统的copy命令。命令格式是：


    copy 文件名1 文件名2


    copy命令把一个文件的内容拷贝到另一个文件中，当然要针对一切可能的文件名。比如：


    copy jilin.dat changchun.dat


    把文件jilin.dat的内容复制到文件changchun.dat中，问题是如何把两个文件名传入我们的程序。


    使用命令行参数可以解决该问题。'
