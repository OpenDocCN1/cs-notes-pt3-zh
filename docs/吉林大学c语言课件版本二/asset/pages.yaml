- pgno: 364
  md: '# 排序思想


    +   - 未排序

    +   - 在a[0]、a[1]、...、a[n-1]中选一最小a[j]，a[j]与a[0]交换

    +   a[0]排好序

    +   - 在a[1]、a[2]、...、a[n-1]中选一最小a[j]，a[j]与a[1]交换

    +   a[0]、a[1]排好序

    +   - 在a[2]、a[3]、...、a[n-1]中选一最小a[j]，a[j]与a[2]交换

    +   a[0]、a[1]、a[2]排好序

    +   - ... ... ... ... ... ... ...

    +   a[0]、a[1]、a[2]、...、a[n-2]排好序

    +   - 在a[n-2]、a[n-1]中选一个最小a[j]，把a[j]与a[n-2]交换

    +   a[0]、a[1]、a[2]、...、a[n-2]、a[n-1]排好序

    +   - 排序结束'
