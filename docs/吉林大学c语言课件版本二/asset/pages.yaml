- pgno: 803
  md: '# 八皇后 试探法的递归实现


    试探方法的思路是，按一定规律，从某一满足条件的初始状态出发，逐步试探生成满足条件的子排列，不断增加子排列长度，直到子排列的长度满足问题的要求长度n为止，便找到一个解。设想，如果有一个函数

    queen(r)

    能够“合理的排列数组A后部的r个(从第n-r+1到n)元素”并保证序列满足给定条件，则八皇后问题便是对queen的调用

    queen(8)'
