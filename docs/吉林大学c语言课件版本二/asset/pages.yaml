  md: "# 检索\n\n检索是按给定关键字值 c 在树上找一个结点 ti ，且 ti 的关键字值 key 恰好等于 c 。若检索到，函数将带回相应结点指针；否则若没检索到，函数将带回\
    \ NULL 。下述检索算法的前提条件是， p 是检索树。\n\n```\ntreepointer search( typekey c , treepointer\
    \ p ) {\n\tif ( ( p-> key == c ) || ( p == NULL ) )\n\t\treturn p ;\n\telse if\
    \ ( c < p-> key )\n\t\treturn search( c , p-> left ) ;\n\telse\n\t\treturn search(\
    \ c , p-> right ) ;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 974
  md: "# 插入一个结点\n\n插入是指将一个数据项插入到树中某一恰当位置，使树仍保持检索树的性质。显然，首先要按key值查出应该插入的位置，然后再插入。\n\
    \n```\nvoid insert( keytype c , datatype d , treepointer *p ) {\n    if ( *p ==\
    \ NULL ) {\n        *p = (treepointer)malloc(sizeof(struct tree));\n        (*p)\
    \ -> key = c;\n        (*p) -> data = d;\n        (*p) -> left = NULL;\n     \
    \   (*p) -> right = NULL;\n    }else if ( c < (*p) -> key )\n        insert( c\
    \ , d , &((*p)->left) );\n    else  insert( c , d , &((*p)->right) );\n}\n```"
  merge: -1
  img_proc: true
