- pgno: 678
  md: '# 递归程序设计的思想体现在：


    +   - 用逐步求精原则，先把一个问题分解成若干子问题

    +   - 这些子问题中有问题的与原始问题具有相同的特征属性，至多不过是某些参数不同，规模比原来小了

    +   - 此时，就 可以对这些子问题实施与原始问题同样的分析算法，直到规模小到问题容易解决或已经解决时为止。

    +   - 也就是说，若将整个问题的算法设计成一个函数，则解决这个子问题的算法就表现为对相应函数的递归调用。'
