  md: '# 程序设计


    +   - 第一层循环确定排第几小的元素


    +   - 循环次数 0..n-2，用i标识


    +   - a[ 0 ]...a[ i-1 ]已经排好序


    +   - 第二层循环确定a[ i ]...a[ n-1 ]中最小元素a[j]


