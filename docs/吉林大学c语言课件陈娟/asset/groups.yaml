  md: "\n## goto和标号\n\n- goto 语句是强制改变程序正常执行顺序的手段。但是我们事先声明\n    - 频繁使用goto语句不是好的程序设计习惯，不符合结构化程序设计原则\n\
    \    - 除有特殊需要外，尽量不要使用goto语句和标号\n\n- 标号的语句\n    - 标号：语句\n    - label1: statement;\n\
    \n## goto 语句\n\n## goto 标号\n\n```\ngoto label1;\n```\n\n- 标号就是带标号语句中用的标号，是一个标识符；\n\
    \n- goto 是保留字，表示转向。\n\ngoto 语句的意义是中断正常的程序执行顺序，转到本函数内标号标出的语句处，并从其开始继续向下执行\n\ngoto\
    \ 语句与带标号语句配合使用，达到改变程序正常执行顺序的目的。\n\n## 【例9-1】前述第5章例5-8中迭代法求解方程根的问题，不改造流程图，可以用如下右端的程序片段表示\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_874_0.png)\n\n```\nx0=0.9;        \
    \         /* 1 */\nr1:x1=f(x0);             /* 2 */\nif ( abs(x1-x0)<1e-5 ) /*\
    \ 3 */\ngoto r2 ;               /* 4 */\nx0=x1;                  /* 5 */\ngoto\
    \ r1;                /* 6 */\nr2: ;                   /* 7 */\n*/\n```\n\n虽然C允许使用\
    \ goto 语句转向本函数内任何语句，但是下述转向是极其不好的程序设计习惯。它使程序逻辑混乱，同时也给编译优化带来麻烦。\n\n- 从if语句外转入if语句的\
    \ “then”或 “else”子句之中；\n- 在if语句的 “then”或 “else”子句之间转向；\n- 从switch语句之外转入switch语句之内；\n\
    - 从循环语句之外转入循环语句之内；\n- 从复合语句之外转入复合语句之内。\n\n## 空语句\n\n空语句（empty-statement）只由一个分号“；”组成，表示没有任何操作动作。其语法是：\n\
    \n```\n<空语句> → ;\n```\n\n空语句也是一种语句。只不过在程序正文上看它只有一个分号。在语义上看它没有任何操作动作，其作用只是占据一个语句的位置。\n\
    \n空语句有时起很大作用，例：\n\n```\nfor ( ... ) {\n    ...\n    goto r0 ;\n    ...\n    r0:\
    \ ;\n}\n```\n\n## 结构化程序设计原则\n\n- 由于计算机硬件技术的不断发展，以及计算机的广泛应用，计算机软件系统也日益发展\n- 软件在计算机系统中所占比重也越来越大\n\
    - 使得作为软件主要组成部分的程序系统越来越庞大，复杂度越来越高，造价也越来越昂贵，同时出错率也不断增加，系统的可靠性越来越难以保证，维护也越来越困难。\n\
    - 最后终于在20世纪60年代中期引起了一场所谓的软件危机。在该背景下，1968 年 Dijkstra 提出了结构化程序设计思想。这种思想的基点是：\n\n\
    \    > “清晰，易懂地书写程序逻辑，使程序结构表现得简单、明快”\n\n从这点出发，人们经过艰苦实践，总结出了一套结构化程序设计原则。这套原则要求程序员写出的程序应该是结构良好的，即：\n\
    \n- 易于保证和验证程序的正确性\n- 易于阅读、维护和调试。\n\n这种良好结构的程序具体体现在：对任意程序段来讲\n\n- 仅有一个入口，一个出口\n\
    - 没有死循环\n- 没有死码区。\n\n为了达到上述目的，强调程序员在写程序时应该：\n\n- 利用自顶向下、逐步求精的技术设计程序\n- 具有良好的程序设计风格\n\
    - 尽量利用标准的顺序、分支、重复控制结构。保证程序仅有一个入口、一个出口。\n- 限制使用 GOTO 语句。可能一个坏程序的缺点都是由 GOTO 语句引起的。\n\
    \n结构化程序设计的发展，使程序设计从技艺走向工程，为软件工程学发展奠定了有力基础。使软件生产由个体作坊式的艺术创作方式发展成为千千万万人参加的工程方式，达到了“系列化、产品化、工程化、标准化”。“软件工程”也从这一时期开始逐步发展起来。\n\
    \n能够反映结构化程序设计要求，便于书写结构化程序的程序设计语言，称结构化程序设计语言。可以认为C是结构化程序设计语言。\n\n结构化程序设计方法是20世纪60年代末70年代初逐渐发展起来的，目前程序设计领域的热点是“面向对象程序设计”和“基于构件的程序设计”等。但是它们的主要特长在于程序的组织、信息封装、软件重用等，而最终对于足够小程序模块的编码，它们没有给人们带来益处。\n\
    \n结构化程序设计方法针对每个小模块的设计起着十分关键的作用。所以尽管目前面向对象程序设计技术和基于构件的程序开发技术受到人们广泛关注与重视，但是结构化程序设计技术仍然是十分重要和不可缺少的。可以说结构化程序设计是一切程序设计技术的基础，是任何软件工作者必须掌握的技术。\n\
    \n## 程序风格\n\n- 程序风格是指程序的书写格式等与易读性、清晰性、相互交流有关的，而与程序执行无关或关系不大的一些问题。\n- 写程序不仅仅是为了与计算机进行交流，而且也是为了与人进行交流，进一步还为了给自己或别人阅读，同时程序员自己也需要不断地查阅自己编出的程序，更何况程序的维护很可能由别人来做。\n\
    - 在写程序时要考虑到：程序既是为了在计算机上运行，也是为了今后的交流和阅读，同时还是为了留下有用的参考文件。\n- 为此，程序必须是宜于阅读的，也就是必须是结构良好或风格优美的。\n\
    - 程序设计风格不好不利于产生正确、高效、易读、易维护的程序。风格不好的程序会使程序维护费用与时间增加，甚至导致整个编程过程失败。\n- 程序设计风格是程序员必须的修养。良好的程序设计风格是程序员在长期的编程实践中逐步发展，积累和提炼出来的。它是产生正确、高效、易读、易维护程序的一种重要的手段。\n\
    - 程序风格主要涉及程序的行文格式、注释和空白的合适用法、尽量使用合适的助记名来命名标识符、明白地表示出程序结构和数据结构等。\n\n## 良好的行文格式\n\
    \n- 程序的行文格式不好直接影响程序的可读性、清晰性和外观。如下完全相同的程序写成 **A** 和 **B** 的格式显然都没有写成 **C** 的格式好。因为**C**的格式层次分明，格式清晰，意义明确。\n\
    \n```\n/* A */\n#include <stdio.h>\nint i;main (){i=25+38;printf(\"25+38=%d\"\
    ,i);}\n```\n\n```\n/* B */\n#include <stdio.h>\nint i;main ()\n{\n    i = 25+38;\
    \        printf (\n    \"25+38=%d\",      \n    i                 );\n}\n```\n\
    \n```\n/* C */\n#include <stdio.h>\nint i;                     /* 声明整型变量i */\n\
    int main (void) {          /* 主函数 */\n    i = 25+38;             /* 求和运算 */\n\
    \    printf ( \"25+38=%d\" , i );   /* 打印 */\n}\n```\n\n## 下面给出“适当使用空行、空格”一般方法的建议：\n\
    \n- 在 #编译预处理命令、typedef类型定义、变量声明之前加一个空行，并把这些部分分别集中写在一起；\n- 在运算符的两边、赋值运算符“=”的两边，可以各加一个空格。\n\
    - 在函数定义之前加两个或更多的空行。\n- 每个常量定义占一行。\n- 每个类型声明均另起一新行。\n- 每个变量声明均另起一新行。并注意一个变量声明中的每个变量说明符之间的排列。\n\
    - 在结构和联合声明中，各成员声明向右缩进几列。\n- 复合语句的\n    - 左花括号 “{” 放在函数定义说明符、 if、 else、 switch、\
    \ while、 for、 do、 struct、 union 的起始行末尾；\n    - 右花括号 “}” 与相应语句或声明引导词的第一个字符对齐，并以注释标明，例：\
    \ “/* if */”；\n    - 各成分语句或声明向右缩进几列并对齐\n- 函数定义中，函数定义说明符另起一行，函数体部分各个语句和声明向右缩进几列。呈图1格式。\n\
    - IF语句把if、else对齐，并且内含的子语句向右缩进几列。呈图2格式。\n- SWITCH语句内部各个case标号分别占一行，\" : \"互相相对齐，并比switch缩进几列；\"\
    \ : \"后的语句开始符对齐。呈图3格式。\n\n```\nint main ( void ) {\n    DS\n    DS\n    ...\n\
    } /* main */\n```\n\n```\nif ( b )\n        S₁\nelse\n        S₂\n```\n\n```\n\
    switch ( expr ) {\n    case a₁: S;\n    case a₂: S₂\n    ...\n    case aₙ: sₙ\n\
    } /* switch */\n```\n\n图1 函数定义\n\n图2 IF语句\n\n图3 SWITCH语句\n"
