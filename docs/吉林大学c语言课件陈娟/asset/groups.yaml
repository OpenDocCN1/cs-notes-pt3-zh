  - '[PAGE 891]


    # 用合适的助记名来命名标识符


    +   - 标识符是程序员给自己引进的常量、类型、变量、函数等起的名字。程序设计语言对如何命名标识符没有限制，标识符也没有固定的含义。

    +   - 但是从使用角度看，标识符表记的每个对象都有具体的含义。为了提高可读性和有助于记忆，应该使标识符在拼写上尽量和它所标记对象的物理、数学等含义相一致，并且要避免与系统预定义的标准标识符重名。'
