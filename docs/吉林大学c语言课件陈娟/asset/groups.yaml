    # 程序设计语言（2）


    汇编语言


    ```

    MOV AX ,X

    CMP AX ,Y

    JL  S1

    SUB AX ,15

    JMP S2

    S1: ADD AX ,15

    S2: MOV Y ,AX

    ... ... ... ... ... ...

    X DW ?

    Y DW ?

    ```'
  - '[PAGE 11]


    # # 程序设计语言（3）


    # ## 高级语言


    ```

    if (X<Y)

    Y=X+15;

    else

    Y=X-15;

    ```


    # ## 注意


    高级语言并不单单指C语言，如VC,BASIC 等语言也属于高级语言范畴。'
