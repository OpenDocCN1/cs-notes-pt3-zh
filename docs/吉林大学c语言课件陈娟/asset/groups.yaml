    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1196_0.png)\n\n这就是一种动态数据结构中的——链表。动态数据结构上的一个项是一个动态变量，指针是标识动态变量的有力手段。动态变量与静态变量的区别在于：\n\
    \n静态变量是程序中由程序员“显式”说明的变量。它有一个名字，在编译时，编译程序已经给它分配存储空间。这块存储空间用变量的名字来标识。\n\n- 动态变量在程序中没有“显式”说明，它没有名字\n\
    - 在编译时编译程序不知道有该变量，不给（也不可能给）它分配空间。\n- 动态变量是在程序运行时\n  - 随程序存储数据的需要，申请空间函数（例如 malloc，当然也是由程序员安排的）随机的动态的申请来的空间。它没有名字，一般动态变量都由指针标识。\n\
    \  - 当使用完毕后，由释放空间函数（例如 free）释放，还回计算机存储管理系统，以备它用。\n\n- 注意：这里所说的静态变量不是C语言中由静态存储类别static声明的变量；动态变量也不是C语言中由自动存储类别auto声明的变量。而是一般程序设计概念中的静态变量、动态变量\n\
    \n# 管理动态变量\n\n动态变量在程序运行时，随程序存储数据的需要，向计算机系统申请；使用完后返回计算机系统。\n\n- 本节介绍\n- 申请计算机存储空间函数malloc\n\
    - 释放存储空间函数free\n\n## 内存\n\n程序运行时，涉及用户程序的内存存储结构如右图所示，首先是目标代码区；然后是静态存储区，用于存放那些可用绝对地址标识的，主要是具有静态存储类别的数据和变量；接着是目标代码运行时用到的库程序代码区；最后剩余空间是栈区和堆区，栈区和堆区从剩余空间的两端，动态的向中间增长。栈区用来存储程序中声明的函数的局部变量等具有自动存储类别的数据和变量；堆区用来存储经过动态申请空间函数申请的变量。\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1201_0.png)\n\n# sizeof 运算符\n\n- 单目运算符\
    \ sizeof 的\n- 操作数是类型。\n- 运算结果是求得相应类型的尺寸，即存储相应类型数据所需要的字节数。\n- sizeof(int) /* 结果是2\
    \ */\n- sizeof(char) /* 结果是1 */\n- sizeof(struct date) /* 若 struct date 是第十一章定义的日期类型，结果是6\
    \ */\n\n# malloc 函数：\n\n- 原型\n  `void *malloc(unsigned long size);`\n- 功能\n  申请足够大内存区域用来存储长度为size的数据对象，返回该区域的首指针，并保证该区域符合任何数据类型对存储区域开始地址和对齐的要求。\n\
    \  返回指针是void类型的，调用者必须使用显示强制类型转换，把该指针转换成所需要类型的指针。\n\n# 例：\n\n```\nfloat *p ;\n\
    p = (float*)malloc( sizeof(float) );\nstruct date *pdate;\npdate=(struct date*)malloc(sizeof(struct\
    \ date));\n```\n\n# free函数\n\n- 动态申请的内存如果不再使用，应当适时释放这样可以提高程序运行效率。free函数用来释放经过malloc申请的动态空间。free的函数\n\
    - 原型\n  `void free ( void *ptr );`\n- 功能\n  释放由malloc申请的内存区域。free的参数ptr是一个指针，指向以前由malloc申请的一个内存区域。\n\
    \n# 例\n\n- 申请\n  ```c\n  float *p;\n  p = (float*)malloc( sizeof(float) );\n \
    \ struct date *pdate;\n  pdate=(struct date*)malloc(sizeof(struct date));\n  ```\n\
    - 释放\n  ```c\n  free(p);\n  free(pdate);\n  ```\n\n# 实用问题：\n\n- 若指针变量指向的用malloc申请来的动态变量，是孤立的不能与其它变量相联系，显然作用不大。\n\
