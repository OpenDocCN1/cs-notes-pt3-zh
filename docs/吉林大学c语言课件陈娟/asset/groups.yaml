    没被试探过的元素\n\n回溯\n\n取下一个没被试探过的元素\n\n结束\n\n延长\n\n下一个位置变成当前位置\n( m=m+1 )\n\n当前位置赋值第一个元素\n\
    \n返回\n\n## 程序如下：\n\n```\nint A[9], m ;\nbool check( int m ) ; /*检查某格局是否合格的函数 */\n\
