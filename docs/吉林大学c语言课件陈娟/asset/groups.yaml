  - "[PAGE 1334]\n\n# ■ 插入一个结点\n\n插入是指将一个数据项插入到树中某一恰当位置，使树仍保持检索树的性质。显然，首先要按key值查询出应该插入的位置，然后再插入。\n\
    \n```\nvoid insert(keytype c, datatype d, treepointer *p) {\n if (*p == NULL)\
    \ {\n *p = (treepointer)malloc(sizeof(struct tree));\n (*p)->key = c;\n (*p)->data\
    \ = d;\n (*p)->left = NULL;\n (*p)->right = NULL;\n }else if (c < (*p)->key)\n\
    \ insert(c, d, &((*p)->left));\n else insert(c, d, &((*p)->right));\n }\n```"
