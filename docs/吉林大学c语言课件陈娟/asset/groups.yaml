    # 例12-5 找路径


    已知一个网g=(v,e)。其中，


    +   - v=(v1 ,v2 , ... ,vn) 为网g的结点集合,

    +   - vi为网中结点。

    +   - e={ (vi , vj)} 是网中边的集合,

    +   - (vi ,vj)表示连接结点vi到结点vj的边。


    找路径是指求从结点m到结点n的所有路径。


    ![](img/2c9b154d61523ac3dc02daf316966b8e_1258_0.png)'
  - '[PAGE 1259]


    解:这样想该问题,


    +   1. 从m点出发沿所有可能的路向前走一步;

    +   2. 然后再站在新的点上，再向前走一步; ...


    如此重复，直到走到结点n为止。

    在走的过程中，保证不走重复点，可以得到下图的算法:


    route


    m:开始点； n:终结点； r:路迹数组p尾标


    p[r] = m


    m==n


    输出p[0~r]


    结束


    m点的所有后继结点 i


    i∈p[0~r]


    route(i,n,r+1)'
