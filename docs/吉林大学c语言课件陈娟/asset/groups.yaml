    - 作业\n\n## 程序设计语言（1）\n\nY = { X + 1 5 若 X < Y X − 1 5 若 X ≥ Y\n\n### 机器语言\n\n\
    1010 1001 0001 0110 0000 0001 0011 1100 0001 1000 0000 0001 ... ... ... ... ...\
    \ ... ... ... 0000 0000 0000 0000 0000 0000 0000 0000\n\n# 程序设计语言（2）\n\n汇编语言\n\
