    \nroot:\n\np:\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1337_0.png)\n\n## 2.3)\
    \ 形参p(指针的指针): 数据项5的右指针的地址\nc>(*p)->key，递归调用 insert(8,&((*p)->right))\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1338_0.png)\n\
