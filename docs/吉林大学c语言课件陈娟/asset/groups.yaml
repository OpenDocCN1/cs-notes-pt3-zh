    # 基本概念


    +   - 指针是高级程序设计语言中一个重要的概念

    +   - 正确灵活运用指针

    +     - 可有效地表示和使用复杂的数据结构

    +     - 可动态分配内存空间，节省程序运行空间，提高运行效率

    +   - 不正确理解和使用指针，指针将是程序中最危险的成分，由此带来的后果可能是无法估量的。'
  - '[PAGE 615]


    # 数据在内存中的存储和访问方式


    +   - 每个变量

    +     - 在计算机内存占用一块存储区

    +     - 该存储区的地址就是相应变量的地址

    +     - 变量可能有值

    +     - 该存储区保存的内容就是相应变量的值


