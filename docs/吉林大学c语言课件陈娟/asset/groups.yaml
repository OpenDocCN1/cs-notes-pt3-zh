    \    p->data = x ;\n    p->predecessor = top ;\n    top = p ;\n}\nvoid stackpop\
    \ ( items *x ) {\n    pstacktype p ;\n    if ( top != NULL ) {\n        *x = top->data\
    \ ;\n        p = top ;\n        top = top->predecessor ;\n        free(p);\n \
    \   } else printf( \"栈下溢\\n\" );\n}\n```\n\n### 看一下这三个操作：\n\n- 1. 初始化后（调用 stackinitial）得。\n\
    - 2. 调用一次 stackpush(1) 得。\n- 3. 再调用一次 stackpush(2) 得。\n- 4. 调用一次 stackpop(&b)\
    \ 得。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1306_0.png)\n\n## 队列\n\n如图可用单向链表实现队列，现在要用两个指针变量，一个指向队头（front），一个指向队尾（rear）。队列的操作有\n\
    \n- ① 初始化（queueinitial）\n- ② 进队——排在队尾（inqueue）\n- ③ 出队——从队头删一项（outqueue）\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1307_0.png)\n\
    \n设有如下说明：\n\n```c\ntypedef ... items ;\ntypedef struct queue {\n\titems data ;\n\
    \tstruct queue *next ;\n} queuetype ;\ntypedef queuetype *pqueuetype ;\npqueuetype\
    \ front,rear ;\n```\n\n操作：\n\n```c\nvoid queueinitial(void) {\n\tfront = NULL\
    \ ;\n\trear = NULL ;\n}\n\nvoid inqueue (item x) {\n    pqueuetype p;\n    p =\
    \ (pqueuetype)malloc(sizeof(queuetype));\n    p-> data = x ;\n    p-> next = NULL\
    \ ;\n    if ( rear==NULL ) {\n        rear = p ;\n        front = p ;\n    } else\
    \ {\n        rear-> next = p ;\n        rear = p ;\n    }\n}\n\nvoid outqueue\
    \ ( item *x ) {\n    pqueuetype p;\n    if ( front==NULL )\n        printf( \"\
    队空\\n\" );\n    else {\n        *x = front-> data ;\n        p = front ;\n   \
    \     front = front-> next;\n        if ( front==NULL )\n            rear = NULL\
    \ ;\n        free( p );\n    }\n}\n```\n\n### 看一下这三个操作：\n\n- 1. 调用初始化后（调用一次 queueinitial）得；\n\
    - 2. 调用一次 inqueue(1)得；再调用一次 inqueue(2)得；再调用一次 inqueue(3)得；\n- 3. 调用一次 outqueue(&a)\
    \ 得；再调用一次 outqueue(&b) 得；再调用一次 outqueue(&a) 得。\n\na: 3\n\nb: 2\n\nrear: NULL\n\
    \nfront: NULL\n\np:\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1311_0.png)\n\n\
    ## 链表——linkage table\n\nbase: 单向链\n\nbase: 双向链\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1312_0.png)\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1312_1.png)\n\nbase: 环形链\n\nbase: 双向环形链\n\
    \n### 创建单向链表：\n\n创建单向链表，是指用一项一项的数据逐步建立、形成一个链表。可以分成向链头加入数据和向链尾加入数据两种方式。\n\n创建单向链表可以分成向链头加入数据和向链尾加入数据两种方式。新项加入链头就是压栈的算法；新项加入链尾就是队列中入队的算法。只要反复调用那里的函数或将函数体放在循环语句中即可，这里不赘述。\n\
    \n### 遍历单向链表:\n\n遍历是指从头到尾将链表上数据全部加工一遍。\n可用如下左端的算法。但实用中，经常用如下右端的算法来遍历单向链表。\n\n\
    ```c\np = base ;\nwhile (p != NULL ) {\n加工 p ->\np = p-> next;\n}\n```\n\n```c\n\
    p0 = NULL;\np = base ;\nwhile (p != NULL ) {\n加工 p ->\np0 = p ;\np = p-> next;\n\
    }\n```\n\n### 在单向链表上检索：\n\n检索是指在单向链表上查找关键字等于某给定值的节点，若找到则带回相应节点的指针；否则带回NULL。设关键字域名为key；欲检索的关键字值为key0。如下算法实现检索：\n\
    \n```c\np0 = NULL;\np = base ;\nwhile (p != NULL && p->key !=key0 ) {\n    p0\
    \ = p;\n    p = p-> next;\n}\n```\n\n### 向单向链表插入一项：\n\n设有下图的链表，现在要把 r 所指示的数据项插入到\
    \ p0、p 所指两项之间。操作是：\n\n```c\nr-> next = p;\np0-> next = r;\np0 = r    /*使 p0 仍为\
    \ p 的前一项*/\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1317_0.png)\n\n###\
    \ 从单向链表上删除一项：\n\n设有下图的链表，现在要删除 p 所指项。删除算法是：\n\n```c\nq = p;\np = p-> next ;\n\
    p0-> next = p ;\nfree(q);\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1318_0.png)\n\
    \n### 交换单向链表上两项:\n\n设有如图所示链表。现在要把 p 所指的项与 q 所指的项交换。\n为了表示操作方便，我们把该链表分两段画出。\n\n\
    ![](img/2c9b154d61523ac3dc02daf316966b8e_1319_0.png)\n\n```c\n/*交换 p-> next 、\
    \ q-> next */\n    g = p-> next;          /* 1 */\n    p-> next = q-> next;  \
    \ /* 2 */\n    q-> next = g;          /* 3 */\n/*交换 p0-> next 、 q0-> next */\n\
    \    p0-> next = q;         /* 4 */\n    q0-> next = p;         /* 5 */\n/*交换\
    \ p 、 q */\n    p = p0-> next ;        /* 6 */\n    q = q0-> next ;        /*\
    \ 7 */\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1320_0.png)\n\n## 树——tree\n\
    \n二叉树，二叉树的每个数据项附带两个指针，分别指向它的两个分支。二叉树的定义：\n\n- 空树是树；\n- 一个结点连接两个不相交的树，仍为树；\n- 所有结点具有相同的数据类型。\n\
    \n( a + b / c ) * ( d - e * f )\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1321_0.png)\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1322_0.png)\n\n设 ti 为二叉树的一个结点，一般 ti\
    \ 由两部分组成：\n\n- ● 基本数据部分------保存本结点上的基本数据；\n- ● 指针部分------连接本结点以下的其它结点。\n\n结点 ti\
    \ 的指针连接的结点称为 ti 的子结点，相应 ti 称为其子结点的父结点。\n\nti 的指针部分有两个指针：左指针、右指针。\n\n称 ti 的左指针连接的部分为\
    \ ti 的左子树，ti 的右指针连接的部分为 ti 的右子树。\n\n若左、右子树均空，则称 ti 为叶结点。\n"
