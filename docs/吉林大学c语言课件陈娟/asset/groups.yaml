    程序运行若输入：\nabcdef\n则输出结果为\nThe string length is 6\n\n## 指针与数组\n\n- 密切的关系\n  - 数组名是数组的首地址，即a[0]的地址；\n\
    \  - 指针值也是一个地址如果一个指针p指向数组a的首地址即指向a[0]，则p与a表示的是同一个对象。\n- 事实上，在C中把指针和数组当作同一个概念看待，数组名是指针，指针也是数组。\n\
