  - '[PAGE 954]


    # 八皇后 试探法


    本方法的思路是，按一定规律，从某一满足条件的初始状态（初始排列）出发，逐步生成满足条件的子排列，不断增加子排列长度。在增加子排列长度过程中，每增加一位，生成一个子排列后，便检验它是否满足条件。若该子排列不满足条件，则换一个子排列(即修改当前位置——在当前位置上换一个元素)；若该子排列满足条件，则延长子排列，增加子排列长度。直到子排列的长度满足问题的要求长度为止，便找到一个解。


    若要求找到一个解即可，这时便可以结束。若要求找到所有解，这时可以输出或记录本解，然后按前述思路，继续修改排列，继续试探，找下一个解。'
  - '[PAGE 955]


    # 在上述试探过程中, 修改当前位置时要考虑:


    +   - 若当前位置上还有没被试探过的元素, 则应该取下一个没被试探过的元素进行试探。

    +   - 若当前位置上所有元素都被试探过了(例如八皇后问题中, 某一列的八个位置都已经考虑过了), 则在当前位置上没办法再修改了。这说明前边的某个位置有问题,
    放置的元素不对, 显然应该向回退一位(即回溯到上一个位置上)。回溯后, 原来的上一个位置变成了当前位置, 则又变成修改当前位置的问题了。这时, 同样还应该考虑取下一个没被试探过的元素进行试探,
    以及是否所有元素在当前位置上都被试探过了并回溯的问题。'
  md: "\n最后，分别计算嗨合的最小圈数可以被求精确成下图。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_937_0.png)\n\
    \n## 验证三角形外心定理\n\n三角形三条边的垂直平分线交于一点，该点是三角形外接圆的圆心。\n\n解：不失一般性，假设三角形的任意一条边都不平行于任意一个坐标轴。依据平面几何知识，该问题的验证步骤应该是：\n\
    \n- 读入三点a,b,c的坐标(x1,y1)、(x2,y2)、(x3,y3);\n- 检验三点是否构成一个三角形;\n- 若三点构成三角形，则验证外心定理。\n\
