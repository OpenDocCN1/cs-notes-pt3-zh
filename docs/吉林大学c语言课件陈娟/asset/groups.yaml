  - '[PAGE 13]


    # C语言的历史背景


    +   - 70年代初，C 语言在美国贝尔实验室诞生。它的前身可以追溯到ALGOL60、CPL、BCPL、B。

    +   - 1982年C标准化工作开始。

    +   - 1989年ISO公布ISO/IEC 9899:1990，简称“C89”。

    +   - 1995年对C89作修改和补充，称为“C95”。

    +   - 1999对C进行更大的修订后，公布 ISO/IEC 9899:1999，简称“C99”。

    +   - 我国于1994年12月4日公布了“中华人民共和国国家标准 GB/T 15272-94 程序设计语言 C”。'
  - '[PAGE 14]


    <!-- no content -->'
  - '[PAGE 15]


    # C语言的缺点


    +   1. 语法不严格

    +   2. 类型机制不严密，比如字符类型与整数类型没有区别、不检查下标超界

    +   3. 程序设计自由度太大，不利于保证程序的正确性

    +   4. 若程序与计算机硬件联系太密切，则可移植性不好

    +   5. 有些语言成分太复杂，比如运算符

    +   6. 语言本身不能保证程序设计的结构化。'
  - '[PAGE 16]


    # 程序设计语言形式化描述


    +   - 组成

    +     - 语法——规则

    +       - 巴克斯-脑尔范式(BNF)

    +     - 语义——意义

    +       - if (X<Y)

    +         Y=X+15;

    +       - else

    +         Y=X-15;'
  - '[PAGE 17]


    # BNF


    +   - 自然语言

    +     - 字 → 单词 → 句子 → 语言


    +   - 计算机语言

    +     - 字符 → 词法单位(token) → 程序 → 语言


    词法　　　　　　　　　文法


    +   - BNF

    +     - 一种形式化描述语法的工具，一种表示方法'
