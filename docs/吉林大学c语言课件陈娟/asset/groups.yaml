  md: "\n## 字符转义符\n\n- 源程序中无法或很难直接输入的字符，如回车符，空白符等。\n- 可在字符型和字符串型常量中使用**字符转义符**\n-\
    \ 形式\n- 反斜杠后跟一个八进制或十六进制整数，表示的字符是ASCII码值为相应整数的字符\n- 反斜杠后跟一个特殊字符，代表特殊意义\n\n### 反斜杠后跟一个八进制或十六进制整数，表示的字符是：ASCII码值为相应整数的字符。例如\n\
    \n| 看作字符 | * |\n|---|---|\n| \\101 | 看作字符 A |\n| \\141 | 看作字符 a |\n| \\x41 | 看作字符\
    \ A |\n| \\x61 | 看作字符 a |\n| \\0 | 看作字符 null |\n\n### 反斜杠后跟一个特殊字符，代表的符号含义\n\n\
    | 转义符 | ASCII码值（十进制） | 含义 |\n|---|---|---|\n| \\\\a | 7 | 警报，如铃声， |\n| \\\\b |\
    \ 8 | 退格符 |\n| \\\\t | 9 | 水平制表符 |\n| \\\\n | 10 | 换行符 |\n| \\\\v | 11 | 垂直制表符\
    \ |\n| \\\\f | 12 | 换页符 |\n| \\\\r | 13 | 回车符 |\n| \\\\\" | 34 | 双引号 |\n| \\\\\
    ' | 39 | 单引号 |\n| \\\\? | 63 | 问号 |\n| \\\\\\\\ | 92 | 反斜杠 |\n\n## 间隔符\n\n任何由标识符、保留字、字面常量组成的两个相邻词法单位之间至少应有一个间隔符。多个间隔符一起连用相当于一个。\n\
    \n- 空格\n- 行结束符\n- 水平制表符\n- 垂直制表符\n- 换页符\n\n317 写成 3 1 7\n<= 写成 < =\n\n## 注释\n\n\
    ### 分类\n\n- 由 “/**”和 “*/”，括起来的任意一串字符\n- 由 “//”开始，直到该对斜线所在文本行结束\n\n### 功能\n\n注释是给程序加注解用的，对程序的实际意义没有任何影响，只增加程序的可读性\n\
    \n### 意义\n\n适当利用间隔符和注释组织程序的印刷格式，使得一个程序在行文上看清晰，易读。是良好的程序设计习惯。\n\n```\n/********************************************************************\n\
    函数int MAX(int x, int y)\n形参x, y分别是整数类型\n返回值是整数类型\n函数MAX用来求参数x, y中的最大值\n********************************************************************/\n\
    int MAX(int x, int y){\n    if (x>y)\n        return x;    //x较大，返回x\n    else\n\
    \        return y;    //否则y较大，返回y\n}\n```\n\n```\n#include <stdio.h>\nint i;\n\
    void main () {\n    i = 25+38;\n    printf ( \"25+38=%od\" , i );\n}\n```\n\n\
    这不是一个好习惯。读者在书写程序以及向计算机录入程序时，应尽量使程序看起来结构清晰，层次分明。\n\n```\n#include\n<stdio.h>\n\
    int i;main (\n)\n{\n    i = 25+38;    printf\n\"25+38=%od\" ,\n    i );\n}\n```\n\
    \n## 数据\n\n- 数据是计算机处理的对象，类型是数据的一种属性\n- 数据类型的含义\n- 确定一个值集合，该类型的数据能够取值的范围\n- 确定一个运算集合，能够施于该类型数据上进行的运算\n\
    \n## 数据类型\n\n- 标量类型\n  - 算术类型\n    - 浮点类型\n      - 整型\n      - 字符型\n    - 整数类型\n\
    \      - 布尔型\n      - 枚举型\n  - 指针类型\n- 组合类型\n  - 数组类型\n  - 结构体类型\n- 共用体类型\n- 函数类型\n\
    - void类型\n\n## 浮点类型\n\n- C中浮点类型包括：\n  - 各种长度的浮点类型（float, double, long double）\n\
    \  - 各种长度的复数类型（float _complex, double _complex）\n  - 各种长度的虚数类型（float _imaginary）\n\
    - 含义\n  - 抽象 float 类型对应实数\n  - 实际 float 类型 是实数的一个子集\n\n### 封闭于浮点类型的运算包括：\n\n-\
    \ * / 等\n\n### 注意\n\n- 两个几乎相等的值相减，会引起很大的误差。\n- 若除数的绝对值很小，结果很可能引起溢出。\n- 在比较X、Y两个浮点值是否相等使用|X-Y|<ε\n\
    \n## 整数类型\n\n- 在C中整数类型包括各种长度的带符号与不带符号的整数类型（short、int、long、unsigned、signed等以及它们的组合）。\n\
    - 封闭于整数类型的运算（运算分量和结果都是整数类型）包括：\n  - * / %\n\n## 字符类型\n\n- 字符类型就是单个字符\n- 在C中把字符类型看成整数类型，其整数值是在计算机系统字符集中的编码，也就是我们所说的相应字符存储形态的编码值。\n\
    - 由于C把字符类型看成整数类型，还定义了带符号和不带符号的字符类型。\n- 在C中，所有关于在整数类型的运算定义，自然也都适用于字符类型。\n\n## 布尔类型(bool)\n\
    \n### bool类型\n\n- false（假）、true（真）\n- C中把bool类型看成整数类型分别用0，1表示false 和 true\n\n\
    ### 运算\n\n!（非） &&（与） ||（或）\n\n| b₁ | b₂ | ! b₁ | b₁ && b₂ | b₁ || b₂ |\n|---|---|---|---|---|\n\
    | false | false | true | false | false |\n| false | true |  | false | true |\n\
    | true | false | false | false | true |\n| true | true |  | true | true |\n\n\
    ## 枚举类型\n\n- 更直观的表示一些分类\n  - 一周有七天\n  - 一年有十二个月\n  - 一个学期有哪些课程\n- 枚举类型通过枚举表记值的标识符确定一个类型的值的有序集合\n\
    \n### 最基本的枚举类型说明符形式是：\n\n– enum { id , id , id , ... , id }\n– enum id_tag { id\
    \ , id , id , ... , id }\n\n其中每个id是一个标识符，也是相应枚举类型中的一个值，称枚举常量。\n\n全部标识符集合构成相应枚举类型的值域\n\
    \nenum { Sun, Mon, Tue, Wed, Thu, Fri, Sat}\n\nenum month { Jan, Feb, Mar, Apr,\
    \ May,\nJun, Jul, Aug, Sep, Oct, Nov, Dec}\n\nenum color { red, green, blue }\
    \ // 红、绿、蓝\n\n## 枚举类型与整数类型\n\n- 在C中仍然把枚举类型看成整数类型，每个枚举常量对应一个整数值。一般情况下，枚举表的第一个标识符对应整数值**0**，其它标识符对应前一个标识符整数值**+1**。上述例子中\n\
    \nred 对应 0\ngreen 对应 1\nblue 对应 2\n\n- 还可以在在声明枚举类型时，在枚举常量标识符后标识上该常量对应的整数值，例如：\n\
    \n```\nenum color { red = 10, yellow = red+2, green = 15, blue }\n```\n\n### 表示\n\
    \n| red | 对应 | 10 |\n| --- | --- | --- |\n| yellow | 对应 | red+2 即 12 |\n| green\
    \ | 对应 | 15 |\n| blue | 对应 | green+1 即 16 。|\n\n在C中，所有关于在整数类型的运算定义，自然也都适用于枚举类型。\n\
    \n### 使用枚举类型应注意：\n\n- 括在花括号中的枚举常量表中的标识符都是常量\n- 枚举常量表中的标识符不可重复\n\n```\nenum{ab,cd,ab,if};\n\
    ```\n\n- 枚举常量表中的标识符不能与其它标识符重复\n\n```\nint x;\nenum {x,y,z,c};\n```\n\n- 不能用保留字作枚举常量\n\
    \n```\nenum{while,I,j};\n```\n\n- 尽管C把枚举类型看作整数类型，枚举常量也与整数对应，\n但我们还是建议读者区别开枚举常量和整数。\n"
