    - 终结条件。程序一定要能终止，不能无限递归下去。\n- 使用全局量要特别小心。用不好，单元发生冲突，将导致程序出错。\n\n## 例8-17 汉诺（Hanoi）塔游戏\n\
    \n该问题又称世界末日问题。相传，古印度布拉玛婆罗门神庙的僧侣们，当时作一种被称为 Hanoi塔的游戏。该游戏是：\n\n请编程，打印金片的移动顺序。\n\n\
    的金片的上面；\n\n- 移动过程中，三根钻石针都可以利用，但是金片不许放在除钻石针以外的任何地方。\n\n不论白天黑夜都有一个僧侣在移动。据说当64片金片全部从一根钻石针移到另一根钻石针上那天，就是世界的末日。到那时他们的虔诚信徒可以升天，而其他人则要下地狱。\n\
    \n解：不妨设三根钻石针顺次编号为 a、b、c；开始所有 64 片金片全部在 a 针上；现在要把它们移动到 b 针上；移动过程中 c 针可以利用。如图所示\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_807_0.png)\n\n1. 试想，若能够把 a 针上的 64 片金片全部移动到\
    \ b 针上，必须能够怎样把除最上面的 63 片金片移到 c 针上。\n\n2. 既然遇到把... 设最... 63 片... 下的 63 片金片... 重新观察上述过程：\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_808_0.png)\n\n按这个想法，移动 64 片金片的问题可以被分解成：\n\
    \n- 1. 把 a 针上 63 片金片，从 a 针移到 c 针上，移动过程中 b 针可用；\n- 2. 把 a 针上 一片金片移到 b 针上；\n- 3.\
    \ 把 c 针上 63 片金片，从 c 针移到 b 针上，移动过程中 a 针可用。\n\n设若有一函数\nmove( n , x , y , z )\n能够完成：\
    \ “把 x 针上的 n 片金片，移动到 y 针上，移动过程中可以利用 z 针。” ，\n则上述原始问题可以描述成对 move 的调用：\n\n```\n\
    move( 64 , a , b , c )\nmove( 63 , a , c , b )\nmove( 63 , c , b , a )\n```\n\n\
    ## 考虑move函数：\n\n按分解移动 64 片金片问题的思路，问题：\n“把x针上的n片金片，移动到y针上，移动过程中z针可用”可被分解成：\n\n\
    - 1. 把 x 针上 n-1 片金片，从 x 针移到 z 针，\n  移动过程中 y 针可用\n\n- 2. 把 x 针上一片金片移到 y 针上；\n\n\
    - 3. 把 z 针上 n-1 片金片，从 z 针移到 y 针，\n  移动过程中 x 针可用\n\n按该分解算法，并考虑递归出口 (显然，当移动金片的片数为\
