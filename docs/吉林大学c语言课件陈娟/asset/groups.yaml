    \ 括起来，构成复合语句。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_321_0.png)\n\n## 例5.3\
    \ 求方程 ax² + bx + c = 0 的根\n\n```\nx = (-b ± √(b² - 4ac)) / 2a\n```\n\n- ① 是一元二次方程(a≠0)\n\
    \  - 有实根(Δ≥0)\n    - 两个不同的实根(Δ>0)\n    - 两个相同的实根(Δ=0)\n  - 有虚根(Δ<0)\n- ② 是一元一次方程(a=0,\
    \ b≠0)\n- ③ 是恒等式(a=0, b=0)\n  - 恒等式成立(c=0)\n  - 恒等式不成立(c≠0)\n\n解二次方程\n\n读入 a,b,c\n\
    \n计算Δ\n\n二次方程\nΔ>0\n\n二实根:x1,x2\n\n两实根:x1=x2\n\nΔ=零则\n\n两虚根:x1,x2\n\n求解 x1, x2\n\
    \n一次方程\nb≠0\n\nx为c加程\n\n常数0方程\n\n退化0=0\n\n矛盾c=0\n\n输出 x1,x2\n\n结束\n\n```\nif(a!=0){\n\
    \    delta=b*b-4*a*c;\n    if(delta>0)\n        printf(\"x1=%g ,x2=%g\\n\", (-b+sqrt(delta))/(2*a),(-b-sqrt(delta))/(2*a));\n\
    \    else\n        if(delta==0)\n            printf(\"x1=x2=%f\\n\",-b/(2*a));\n\
    \        else\n            printf(\"x1=%g+%gi , x2=%g-%gi\\n\", -b/(2*a),sqrt(-delta)/(2*a),\n\
    \                -b/(2*a),sqrt(-delta)/(2*a) );\n}else{ // 以下处理a==0的情况\n    if(b!=0)\n\
    \        printf(\"x=%g\\n\",-c/b);\n    else\n        if(c==0)\n            printf(\"\
    0=0!\\n\");\n        else\n            printf(\"%g=0\\n\",c);\n}\n```\n\n## 演示例5.3程序\n\
    \n## 算术值控制多分支结构\n\n```\nswitch ( e ) {\ncase C1 : S1\n    break;\ncase C2 : S2\n\
    \    break ;\n... ... ...\ncase Cn : Sn\n    break ;\ndefault : S0\n}\n```\n\n\
    第一种形式多分支\n\n```\nswitch ( e ) {\ncase C1 : S1\ncase C2 : S2\n... ... ...\ncase\
