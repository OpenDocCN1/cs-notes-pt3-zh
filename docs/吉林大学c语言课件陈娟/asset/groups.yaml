    \n解:这样想该问题,\n\n- 1. 从m点出发沿所有可能的路向前走一步;\n- 2. 然后再站在新的点上，再向前走一步; ...\n\n如此重复，直到走到结点n为止。\n\
    在走的过程中，保证不走重复点，可以得到下图的算法:\n\nroute\n\nm:开始点； n:终结点； r:路迹数组p尾标\n\np[r] = m\n\n\
    m==n\n\n输出p[0~r]\n\n结束\n\nm点的所有后继结点 i\n\ni∈p[0~r]\n\nroute(i,n,r+1)\n\n在该算法中，关键在于找出m点的所有后继点。\n\
    \n### (一) 邻接链表方法\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1346_0.png)\n\n设有如下声明：\n\
    \n```\n#define h 10\nstruct node {\n    int no;\n    struct node *link;\n};\n\
    int p[h];                 /* 踪迹数组 */\nstruct node *g[h];        /* 网的邻接链表 */\n\
    void printp( int,int );   // 函数原型：输出\nbool iinp( int,int,int ); // 函数原型：判断\n//点i是否已经走过（在P中）\n\
    ```\n\n```\nvoid route ( int m, int n, int r ) {\n // 开始结点、终结点、路迹数组p的尾\nstruct\
    \ node *hh;\nint i;\np[r]=m;\nif ( m==n )\nprintp(0,r);\nelse {\nhh = g[m];\n\
    while ( hh!=NULL ) {\ni = hh->no;\nif ( !iinp(i,0,r) )\nroute(i,n,r+1);\nhh =\
    \ hh->link;\n}\n}\n}\n```\n\n```\nbool iinp( int ii,int u,int v ) {\n    int j;\n\
    \    for ( j=u; j<=v; j++ )\n        if ( ii==p[j] )\n            return true;\n\
    \    return false ;\n}\nvoid printp( int e,int f ) {\n    int j;\n    for (j=e;\
    \ j<=f; j++)\n        printf(\"%4d\", p[j] );\n    printf(\"\\n\");\n}\n```\n\n\
    ## 程序设计实例\n\n- 一个排序算法\n- 法雷序列\n- 多项式加法\n\n## 例12-2 排序算法\n\n数组排序已经很熟悉，而且有各种各样的算法。下面用逐步增加递增子序列的方法实现链表排序。设有说明：\n\
    \n```\ntypedef ... datatype ;\nstruct item {\n    datatype data ;\n    int key\
    \ ;\n    struct item *next ;\n};\ntypedef struct item *pt\n```\n\n以base为链首的链表如下图所示。该算法的思想是：\n\
    \n- 1. 开始假设空序列是递增的\n- 2. 若i个元素子序列已经递增，则加一个元素，把插入到序列中一个适当位置使i+1个元素的子序列也递增\n- 3.\
    \ 直到i=n为止\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1352_0.png)\n\n## 开始\n\n\
    p = base\n\np!=NULL\n\n使base~p递增\n\n```\np0 = p；\np = p->next\n```\n\nreturn base\n\
    \n## 结束\n\n## 使base~p递增\n\n寻找p应该插入的位置r0,r\n\np插入到r0、r之间\n\n## 结束\n\n## 寻找位置\n\n\
    def\n\n```\nr = base\n```\n\n```\nr->key<p->key\n∧ r!=p\n```\n\n```\nr0 = r;\n\
    r = r->next\n```\n\n## 结束\n\n## p插入到\nr0、r之间\n\ndef\n\n```\nr≠p\n```\n\n```\n\
    把p独立出来=>q ;\np指向p0\n```\n\n```\nr ==\nbase\n```\n\n```\n插入到链头:\nq->next = base\
    \ ; base = q\n```\n\n```\n插入到r0,r之间:\nq->next = r ; r0->next = q\n```\n\n## 结束\n\
    \n考察程序运行中各个参数、变量、链表的变化状态。如图所示：\n设从base到p0之间的子链表已经递增，现在加入p所指示的节；\n在base~p0之间查找合适位置，设应该把p所指的节插入到r0,r所之间；\n\
    把p独立出来=>q， p指向p0：\n    q = p ;\n    p0->next = p->next ;\n    p = p0 ;\n把p（现在由q指示）插入到r0,r之间：\n\
    \    q->next = r ;\n    r0->next = q;\n现在链表结构是：\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1355_0.png)\n\
    \n```\npt sort(pt base ) {        /* 链表排序，base 为链首 */\n    pt p ,p0 ,r ,r0 ,q\
    \ ;\n    p0 = NULL ;\n    p = base ;\n    while ( p!=NULL ) {  /* 逐项处理，把p加入到子序列中，并保持\
    \ “base--p”递增 */\n        r = base ;      /* 寻找位置 */\n        while ( ( r->key\
    \ < p->key ) && ( r!=p ) ) {\n            r0 = r ;\n            r = r-> next ;\n\
    \        }\n        if (r!=p) {  /* p插入到r0、r之间 */ /* 若 r==p ，在链尾，则不用插入 */\n  \
    \          q = p ;      /* 把 p 独立出来，令 q 指向它 */\n            p0->next = p->next\
    \ ;\n            p = p0 ;\n            if ( r == base ) {      /* 插入 */      /*\
    \ 插在链首 */\n                q->next = base ;\n                base = q ;\n    \
    \        } else {      /* 插在链中r0、r之间 */\n                q->next = r ;\n     \
    \           r0 -> next = q ;\n            }\n        }\n        p0 = p ;     \
    \ /* 前进一项 */\n        p = p->next ;\n    }\n    return base ;\n} /* sort */\n\
    ```\n"
