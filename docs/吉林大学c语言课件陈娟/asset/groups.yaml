    \n每条边的垂直平分线方程\n\n求边L12的垂直平分线：\nvline(ax,ay,bx,by,&a_a,&a_b)\n\n求边L23的垂直平分线：\n\
    vline(bx,by,cx,cy,&b_a,&b_b)\n\n求边L13的垂直平分线：\nvline(cx,cy,ax,ay,&c_a,&c_b)\n\n\
