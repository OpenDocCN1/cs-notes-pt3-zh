    # 指针运算


    +   - 求地址 &

    +     “&”运算符用来求被操作对象的地址。

    +   - 例子

    +     &x表示变量x在内存中的存放地址

    +     若x的地址为ABD0，则&x的值为ABD0,

    +     “&”的优先级为15。'
  - '[PAGE 639]


    +   - 取内容 *

    +     “*”与“&”互为逆运算

    +     “*”运算访问地址表达式所指变量。

    +   - 例子：

    +     “x=*p”是将指针p所指变量的值送入变量x中；

    +     “*p=5”是将5送入指针p所指变量中。

    +     “*”的优先级也为15。'
  - '[PAGE 640]


    # 赋值 =


    可以把一个指针值赋值给某个指针变量。所谓指针值是指向某变量指针（变量的地址）或函数的指针。


    # 例子：


    ```

    int *px , x;

    px=&x;      /* 指针px指向变量x*/

    px=NULL;    /* 为px赋空指针*/

    px=(int*)4800;    /* 将地址4800赋给px,

    而不是整数类型4800 */

    ```'
  - '[PAGE 641]


    +   - 加 + （++）

    +     如果指针值指向数组的一个成分，C允许对相应指针值加上一个整数表达式。

    +   - 设指针p指向数组变量a的一个成分

    +   - 把指针p与一个整数k相加，得到的结果值仍然是个指针值；

