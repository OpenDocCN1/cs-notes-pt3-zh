    C中，每个源程序编译单位，每个函数定义、函数原型、复合语句都各自构成一个作用域区域。

    - 在嵌套结构中，若里层区域的一个标识符与外层区域的某标识符同名，则外层标识符的作用域不包括里层那个同名标识符的作用域区域。

    - 程序中使用的任意一个标识符必须声明；并且必须先声明后使用；在同一区域内任何标识符不得重复声明。'
