  mdcn: "\n## 例6-6 用“逐步增加递增子序列”法对整数数组 A 进行排序\n\n- 排序思想\n  - 把数组A看成一个序列\n    a[0]、a[1]、...、a[i-1]、a[i]、...、a[n-1]\n\
    \  - 假设下面子序列已经是递增\n    a[0]、a[1]、...、a[i-1]\n  - 给上述子序列再加一个元素a[i]\n    若有办法使子序列\n\
    \    a[0]、a[1]、...、a[i-1]、a[i]\n    仍是递增的便可以完成对A的排序。\n\n- 当子序列只有一个元素a[0]时，它自然递增\n\
    - 这样，一个个向该子序列加元素，每加一个元素后，都使新的子序列仍保持递增；\n- 直到将最后一个元素a[n-1]加入子序列为止，便完成了对序列A的排序\n\
    \n开始\n```\nfor(i=1;i<n;i++)\n```\n使 a[0]、...、a[i] 递增\n结束\n\n- 使 a[0]、a[1]、...、a[i-1]、a[i]\
    \ 递增\n- a[0]、a[1]、...、a[i-1]递增\n- 需要在其中找到一个适当位置来放a[i]\n- 则应该首先找到一个j，使 a[j]<=a[i]<a[j+1]\n\
    - 然后，把a[i]插到序列 a[0]、...、a[j]、a[i]、a[j+1]、...、a[i-1]\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_489_0.png)\n\
    \n## 为a[i] 寻找适当位置使a[j]<=a[i]<a[j+1]\n\n只要从a[i-1]开始向前，用a[i]与序列上的元素逐一进行比较，直到找到满足条件的位置为止（当然j不能超过序列A的第一个位置）\n\
    \n开始\n结束\n```\nfor(i=1;i<n;i++)\n```\nj=i-1\n(a[j]>a[i])&&(j>=0)\nj=j-1\n把 a[i]\
    \ 插到 a[j] 和 a[j+1] 之间\n\n把 a[j] 插到 a[j] 和 a[j+1] 之间”：\na[j+1]、a[j+2]、...、a[i-1]\
    \ 顺序向后串\n分别送入 a[j+2]、a[j+3]、...、a[i] 中\n然后把 a[i] 送入 a[j+1] 中即可\n为了向后串，必须先记录 a[i]\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_491_0.png)\n\n```\nvoid sort ( int\
