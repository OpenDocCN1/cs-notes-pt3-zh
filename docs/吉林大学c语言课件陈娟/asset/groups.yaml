  - '[PAGE 618]


    # 访问变量


    +   - 直接访问： 直接使用变量v的名字


    ```

    int v=10;

    v=v*10;

    ```


    +   - 间接访问： 使用指向相应变量的指针


    比如访问变量 v 可以用下面方式来实现：


    *p


    算式 (*p)*10 同样得到值100。它通过指向 v 的指针变量 p，采用间接访问的方式实现对变量 v 的访问，取出变量 v 的值参与运算。


    地址与指针是同意语。变量的指针就是变量的地址，存放变量地址（指针）的变量是指针变量'
  - '[PAGE 619]


    # 指针类型


    +   指针类型和基类型


    +   - 在C++中，任何一个类型都伴随着一个指向本类型变量的指针类型


    +   - 表现形式

    +   设有类型T，则指向T类型变量的指针类型用：

    +   T *

    +   表示，T称为该指针类型的基类型。'
  - '[PAGE 620]


    # 指针变量


    意义


    +   - 指针变量简称指针

    +   - 是一种特殊的变量

    +   - 它里面存储的“值”被解释成为一个变量的地址，确切的说是计算机内存的一个地址。


    声明指针变量


    说明指向T类型变量的指针变量使用形式：


    ```

    T    *p, *p, ... *p;

    ```


    其中，每个p都是标识符，是被说明的指针类型的变量，确切的说是“指向T类型变量的指针变量”。'
