    # 八皇后问题


    这是一个古老而有趣的游戏。高斯(C.F.Gauss)最早在1850年提出并研究过这个问题，但是没有完全解决。该问题是：


    在一个8*8格的国际象棋棋盘上放置八个皇后，使任意两个皇后都不能互相攻击。


    按国际象棋规则，两个皇后可以互相攻击。若


    +   - 在同一行上，

    +   - 或在同一列上，

    +   - 或在同一条斜线上（包括左高右低、右高左低）'
