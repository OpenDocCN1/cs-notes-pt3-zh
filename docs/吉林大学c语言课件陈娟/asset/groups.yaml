    \ninsert 的形式参数 p 指向 root，而 root 值为 NULL。\n转插入功能，执行\n\n```\n*p=(treepointer)malloc(sizeof(struct\
    \ tree))\n```\n\n得：\n再执行后边的几个赋值语句，得：\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1335_0.png)\n\
