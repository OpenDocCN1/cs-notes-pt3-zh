    \ search_card( typecardperson current_card ){\n    int r=0;\n    while ( r<n ){\n\
    \        if (current_card.name==\n            card_arr[r].name&&\n           \
    \ current_card.birthdate.year==\n            card_arr[r].birthdate.year&&\n  \
    \          current_card.birthdate.month==\n            card_arr[r].birthdate.month&&\n\
    \            current_card.birthdate.day==\n            card_arr[r].birthdate.day&&\n\
    \            current_card.sex==card_arr[r].sex )\n            return r ;\n   \
    \     r++;\n    }\n    return -1 ;\n}\n```\n\n在主程序中可能有如下程序片段：\n\n```\ntypecardperson\
    \ card;\nint i ;\n\n... ... ... ...\ncard.name = ...\ncard.birthdate.year = ...\n\
    card.birthdate.month = ...\ncard.birthdate.day = ...\ncard.sex = ...\nif ( i=search_card(card)\
