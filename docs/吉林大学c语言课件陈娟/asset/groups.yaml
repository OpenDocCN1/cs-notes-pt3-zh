    间接成员选择表达式针对指向结构体变量的指针变量

    形式是


    ```

    p->w

    ```


    +   - p 是后缀表达式，最终计算出一个指向结构体变量的指针变量；

    +   - w 是 p 所指向结构体变量所属类型中的一个成员名字

    +   - 下述成员选择表达式是合法的：


    ```

    pointer_preson -> name

    p_east -> weight

    p_east -> lounchdate

