    # 下标表达式


    +   - **干什么？**

    +     - 具体标明（访问）数组变量的某一个成分


    +   - **什么样？**

    +     - `<下标表达式> → <后缀表达式>[<表达式>]`

    +     - 后缀表达式最终表现为一个数组变量，指出访问哪个数组的成分；

    +     - 方括号中的表达式的类型必须是**整数类型**，它具体指明访问的是数组的哪一个成分'
  - '[PAGE 444]


