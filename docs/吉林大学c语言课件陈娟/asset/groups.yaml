  mdcn: "\n如图所示，设要生成一个 n 位的串 A；在每个位置上可选择的符号有 K 个；A 应该满足条件 r；m 表示当前试探位置。试探法的算法描述为：\n\
    \n+   1. 初始时，从第一个位置开始试探，令 m=1；\n+   2. 然后在第 m 位依次取可选符号：B[1],B[2],..., B[k]。对某一个\
    \ B[i] 有两种可能：\n![](img/2c9b154d61523ac3dc02daf316966b8e_956_0.png)\n\n① 若B[i]使A[1],A[2],...,A[m]满足r,则进入A的下一个位置。\n\
    m=m+1\n\n②若B[i]不能使A[1],A[2],...,A[m]满足r,则还有两种情况：\ni<k，取B中下一个符号继续试探,即作 i=i+1。\n\
