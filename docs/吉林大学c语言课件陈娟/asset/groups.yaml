    *(a+v) 基址+位移 | 指针变量值可变，可以通过各种运算改变值。例如：

    p=... 赋值

    p=p+i 与整数运算 |

    | 联系 | 指针变量可以指向数组。 | 指针变量可以指向数组。 |

    | 函数参数 | 数组名作实在参数，其对应形式参数必须是指针或数组名。参数结合时传递实在参数数组首地址。不能把整个数组全部传入函数。 | 指针变量作实在参数，把指针变量值送入形式参数变量中。其对应形式参数可以是指针或数组名。
