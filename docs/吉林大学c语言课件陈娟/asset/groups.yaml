    为了检索操作方便，一般把二叉树组织成二叉检索树。二叉检索树的定义是：


    +   - 设树中每个节点的数据部分有一个数据项 key 是有序的, 称该数据项为关键字。

    +   - 一个二叉树称为检索树，

    +   - 如果对每个节点 ti，它的左子树中所有节点的 key 值都小于 ti 的 key 值；

    +   - ti 的右子树中所有节点的 key 值都大于 ti 的 key 值。


