    \ 、 *(*(ptr1+2)+7) 、 *(*(ptr2+2)+7\n```\n\n```\n*ptr1 = c1;\n*(ptr1+1) = c2;\n\
    aptr[2] = c3;\nptr1[3] = c4;\nptr2 = &(aptr[0]);\n```\n\n下图描述了上述程序片段产生的结果，\n\n\
    - 数组aptr是一个指针数组，它的每个元素值是一个指针，指向一个char型变量，数组名aptr是一个指向指针的指针（指针常量）；\n- 变量ptr1,ptr2\
    \ 也是指向指针的指针（指针变量）；\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_702_0.png)\n"
