    \n## 使用p访问v内容的形式是\n\n```\n**p\nv = 300;\n```\n\n这个间接寻址运算的意义是：\n\n- ● 可以使指针变量s实现的值也\n\
    - ● 可以使用指针“指向int的指针的指针变量”p实现，下述三个语句等价。\n- ● **p的内容，得到一个指针值；该指针值“指向int类型变量”\n-\
