    \ { /*中序遍历*/\n    if ( p!=NULL ) {\n        inorder( p-> left );\n        printf(\"\
    %c\" , p-> data );\n        inorder( p-> right )\n    }\n}\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1235_0.png)\n\
    \na + b / c * d - e * f\n\n## 后序遍历过程是：\n\n得到表达式的表达式的逆波兰表示式（运算符在两个运算分量之后）。\n\n\
    后序遍历算法是：\n\n```\nvoid postorder (treepointer p){ /*后序遍历*/\n    if ( p!=NULL )\
    \ {\n        postorder( p-> left );\n        postorder( p-> right )\n        printf(\"\
    %c\" , p-> data );\n    }\n}\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1236_0.png)\n\
    \na b c / + d e f * - *\n\n## 检索\n\n检索是按给定关键字值 c 在树上找一个结点 ti，且 ti 的关键字值 key 恰好等于\
    \ c。若检索到，函数将带回相应结点指针；否则若没检索到，函数将带回 NULL。下述检索算法的前提条件是，p 是检索树。\n\n```\ntreepointer\
    \ search( typekey c , treepointer p ) {\n    if ( ( p-> key == c ) || ( p == NULL\
    \ ) )\n        return p ;\n    else if ( c < p-> key )\n        return search(\
    \ c , p-> left ) ;\n    else\n        return search( c , p-> right ) ;\n}\n```\n\
    \n## ■ 插入一个结点\n\n插入是指将一个数据项插入到树中某一恰当位置，使树仍保持检索树的性质。显然，首先要按key值查询出应该插入的位置，然后再插入。\n\
    \n```\nvoid insert(keytype c, datatype d, treepointer *p) {\n if (*p == NULL)\
    \ {\n *p = (treepointer)malloc(sizeof(struct tree));\n (*p)->key = c;\n (*p)->data\
    \ = d;\n (*p)->left = NULL;\n (*p)->right = NULL;\n }else if (c < (*p)->key)\n\
    \ insert(c, d, &((*p)->left));\n else insert(c, d, &((*p)->right));\n }\n```\n\
    \n由于 insert 的参数 p 是指向指针的指针类型，在 insert 内 p 指向指针类型的实在参数。所以在执行\n*p=(treepointer)malloc(sizeof(struct\
    \ tree))\n时，将使实在参数指针变量指向新申请来的结点。\n\n2) 若调用insert时，root非空，在中间某一个节点查到空指针，如图；设查到该节点后，应该继续向右查，以\n\
    \n&((*p)->right)\n\n作实参递归调用insert，即执行\n\ninsert(c,d, &((*p)->right) )\n\ninsert\
    \ 的形式参数 p 指向本步的 (*p)-> right，而 (*p)-> right 值为 NULL。\n\n转插入功能，执行 *p=(treepointer)malloc(sizeof(struct\
    \ tree))\n\n再执行后边的几个赋值语句，得：\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1241_0.png)\n\
    \n## 删除一结点\n\n设欲删除结点为 r，则可能有如下几种情况。针对不同情况删除算法不同。\n\nr 是叶结点:简单删掉 r 结点，并把 r 的父结点连接处改成NULL\
    \ 即可。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1242_0.png)\n\nr 只有一个子树: 把 r\
    \ 以下部分接入 r 的父结点连接 r 处。然后删掉r结点 。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1243_0.png)\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1243_1.png)\n\nr 两个方向都有子树: 在 r 的左子树上找到关键字\
    \ key 值最大的结点 s，把 s 结点的数据 data 及关键字 key 复制到 r 结点上，然后删除掉 s 结点。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1244_0.png)\n\
    \n当然也可以在r的右子树上找到关键字key值最小的结点s，把s结点的数据data及关键字key复制到r结点上，然后删除掉s结点。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1245_0.png)\n\
    \n图3的情况 r 两个方向都有子树: 在 r 的左子树上找到关键字 key 值最大的结点 s, 把 s 结点的数据 data 及关键字 key 复制到 r\
    \ 结点上, 然后删除掉 s 结点。\n\n使用在左子树上找最大结点的方法, 按如下步骤进行:\n\n- ① 沿 r 左子树的右方向, 向下找一个没有右子树的结点\
    \ s, 图中结点 (9)。\n- ② 把该结点 s 的值复制到结点 r (即欲删除的结点。\n- ③ 把 s 的左子树连在 s 的父结点 (图中为结点(5))\
    \ 的右链上, 在图中即连到(5)结点的右链上。\n- ④ 删除 s 结点, 即图中的(9)结点。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1246_0.png)\n\
    \n综合上述三种情况，下述函数deletenode 完成删除一个结点。deletenode的调用形式是：\n\n```\ndeletenode( valueofkey\
    \ , &root )\n```\n\n其中\n\n- value_of_key是欲删除结点的关键字值；\n- root是指针类型（treepointer）变量，指向树根。这里用指向指针的指针作参数。\n\
    \n```\ntreepointer del( treepointer * , treepointer * ); /* 处理第三种情况的函数的函数原型 */\n\
    void deletenode( keytype c , treepointer *p ) { /* 删除关键字值等于 c 的结点 */\n    treepointer\
    \ r;\n    if ( *p == NULL )\n        printf( \"not found:%d\\n\" , c );\n    else\
    \ if ( c < (*p) -> key )\n        /* c< 当前结点的 key 值，被删结点在左子树上 */\n        deletenode(\
    \ c , &((*p) -> left) );\n    else if ( c > (*p) -> key )\n        /* c> 当前结点的\
    \ key 值，被删结点在右子树上 */\n        deletenode( c , &((*p) -> right) );\n```\n\n```\n\
    else{\n    r = *p;\n    if ( r->right == NULL )\n        *p = r-> left\n     \
    \       /* 右子树空，接左分支 */\n    else  if ( r->left == NULL )\n        *p = r-> right\
    \ ;\n            /* 左子树空，接右分支 */\n    else\n        r=del( &(r->left),p ) ;\n\
    \            /* 左右均非空 */\n    free( r ) ;\n            /* 释放 r */\n}\n};\n```\n\
    \ndeletenode( 4 , &root )\n\nroot:\n\np:\n\nr:\n\nr 只有一个左子树\n\n图3的情况 p 两个方向都有子树：在\
    \ p 的左子树上找到关键字 key 值最大的结点 s，把 s 结点的数据 data 及关键字 key 复制到 r 结点上，然后删除掉 s 结点。\n\n\
    使用在左子树上找最大结点的方法，按如下步骤进行：\n\n- ①沿 p 左子树的右方向，向下找一个没有右子树的结点 s，图中结点（9）。\n- ②把该结点 s\
