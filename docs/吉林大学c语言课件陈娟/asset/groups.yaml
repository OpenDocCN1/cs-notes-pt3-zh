    - 两个相容的指针则可以进行相减运算，所得结果是整型值，即两指针值间的距离。\n- 例如\n  ```\n  int *p ,*q ,*r ,a[100];\n\
    \  p=&(a[10]);\n  q=&(a[15]);\n  ```\n  则\n  ```\n  p-q得-5;\n  ```\n  而\n  ```\n\
    \  q-p得5。\n  ```\n\n## 指针加减运算限制：\n\n- 若指针p指向的不是数组成分，或p+k、p-k后超出数组定义范围，则其行为是未定义的，将产生不可预料的结果\n\
