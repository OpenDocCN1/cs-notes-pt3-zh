    \n- 绝对不能直接使用赋值运算符 =\n\n## 类型定义\n\n- C提供了丰富的数据类型，包括简单数据类型、构造型数据类型等。这些数据类型有些是基本数据类型，有些是用户自定义的数据类型。\n\
