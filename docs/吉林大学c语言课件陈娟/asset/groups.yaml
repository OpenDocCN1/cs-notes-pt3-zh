  - "[PAGE 849]\n\n解本题的一般想法是使用 r 重循环\n\n```\nfor ( i1 = 1 ; i1 <=n-r+1 ; i1 ++ )\n\
    \    for ( i2 = i1+1 ; i2 <= n-r+2 ; i2 ++ )\n        ...\n        ...\n     \
    \   for ( ir = ir-1+1 ; ir <= n ; ir ++ )\n            印( i1 , ... , ir )\n```\n\
    \n但是，由于 r 是可变的，所以循环嵌套层数是可变的，因此不知道应该用多少个 i。好从另一个角度上想问题，自然想到递归。"
  - '[PAGE 850]


    从前 n 个自然数

    1, 2, 3, ..., n

    中取 r 个数作组合的问题可以分解成：


    +   1. 先分别取这 n 个数中的一个数 i，只需要在前 n-r+1 个数中取 i；

    +   2. 然后从该 i 后边的 n-i 个数中取 r-1 个数作组合 i+1, i+2, ..., n

    +   3. 最后把每组 r-1 个数的组合与前边的 i 合并，从而构成 r 个数的组合。


    当然，从 i 后取 r-1 个数作组合的问题还可以用同样的方法来分解。'
