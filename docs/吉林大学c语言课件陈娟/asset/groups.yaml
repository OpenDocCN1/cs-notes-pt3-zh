    # 数组类型（array-type）


    +   - 一种数据结构

    +   - 变量的一个有序结合

    +   - 所有变量具有同一类型

    +   - 例子

    +     - 一句话 由 若干个 字符 组成的一个数组

    +     - 一个向量 由 若干个 实数 组成的一个数组

    +     - 一个矩阵 由 若干个 向量 组成的一个数组'
  - '[PAGE 440]


    # 回答前面的三个问题


    +   - 基础类型（成分类型）

    +     - 任意类型

    +   - 构造方法

    +     - 把固定数目的同一成分类型的数据顺序排成一个表。

    +     - 每个数据是成分类型的一个值。

    +     - 所有成分顺序排成的总值表是数组类型的一个值。

    +   - 成分的存取和使用

    +     - 每个成分都有唯一的一个下标

    +     - 下标从0开始顺序增加

    +       - 第一个成分 下标为0

    +       - 第二个成分 下标为1

    +     - 下标表达式'
  - '[PAGE 441]


    # 数组声明


    +   一般形式

    +   T id[e];

    +   T id[e], id[e],...,id[e];

    +   - id是要声明的数组（数组变量）的名字

    +   - e暂时看作常量表达式 它是要声明的数组的尺寸，也就是相应数组由多少个成分组成

    +   - id[e] 称为数组声明符'
