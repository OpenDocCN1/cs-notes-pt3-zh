    \n打印表头可以求精成先输出一个“*”；再顺序输出各个字符。\n顺序输出各个字符是一个循环。\n\noutone\n\nbeginch ,endch\n\n\
    输出字符表头\n\nfor( c1=beginch;\n顺序输出各个字符;\nc1++)\n\n输出(c1)\n\n输出(\"\\n\")\n\n打印表体\n\
    \n结束\n\n打印表体应该一行一行的打印，\n每行应该先打印行头，再打印本行各个元素；\n打印本行各个元素，应该一个元素一个元素的打印，是一个循环\n\n\
    outone\n\nbeginch ,endch\n\n输出('*')\n\nfor( c1=beginch;\nc1<=endch;\nc1++)\n\n\
    输出(c1)\n\n输出(\"\\n\")\n\nfor( c1=cha;\nc1<=chz;\nc1++)\n\n打印表体\n\n输出(c1)\n\nfor(c2=beginch;\n\
    c2<=endch;\nc2++)\n\n输出\nconmat[c1][c2]\n\n输出(\"\\n\")\n\n结束\n\n# 三个齿轮啮合问题\n\n\
    设有三个齿轮互相啮接，求当三个齿轮的某两对齿互相啮接后到下一次这两对齿再互相啮接，每个齿轮最少各转多少圈。\n\n解:这是求最小公倍数的问题。每个齿轮需转圈数是三个齿轮齿数的最小公倍数除以自己的齿数。设\n\
    \n+   - 三个齿轮的齿数分别为:na、 nb、 nc ；\n+   - 啮合最小圈数分别为:ma、 mb、 mc ；\n+   - 三齿轮齿数的最小公倍数为k3\
    \ 。\n\n# 计算步骤表示为：\n\n开始\n\n读入三齿轮齿数\n\n求三齿数的最小公倍数 k3\n\n分别计算啮合的最小圈数\n\n输出结果\n\n\
    结束\n\n读入三齿轮齿数和输出结果，分别只是一次调用读或写函数，不必求精。\n\n求精计算三齿数的最小公倍数k3。可以把该问题分解成\n\n先求两个齿数na与nb的最小公倍数k2，\n\
    \n然后再求k2与第三个齿数 nc 的最小公倍数k3，\n\nk3即为na、 nb、 nc三个齿轮齿数的最小公倍数。\n\n设已经有求两个数的最小公倍数的函数\n\
    \n```\nint lowestcm( int x, int y )\n```\n\n则该求精过程可表示成。\n\n求三齿数的最小公倍数\n\n```\n\
    k3=lowestcm( lowestcm(na,nb), nc )\n```\n\n结束\n\n# 采用展转相除法求两个数的最大公约数，函数\nint gcd(int\
    \ x, int y)\n\n定义如下\n\ngcd(x, y) = { x                     y = 0\n           \
    \    gcd(y, x%y)          y ≠ 0 }\n\n函数gcd是一个递归函数，先采用分支求精过程、再采用递归求精过程，可以求精成下图\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_936_0.png)\n"
  mdcn: "\n# 自顶向下逐步求精的程序设计技术\n\n+   自顶向下、逐步求精\n\n若想让计算机解题必须用清晰而无两义性的方式给它提供算法。要求：\n\
    \n+   - 找出一个算法，它能提供所解问题的从输入到输出的所需的映射。\n+   - 选择一种程序语言写出程序，用计算机能接受的方式表述算法。\n\n\
    关键是如何找出算法。因为写出程序，只是表述算法，应该没有困难。\n\n+   - 向下再一个个的具体考虑下一层的各个子问题，针对每个子问题，仍采用对待整体问题解的思路，继续对其进行分解（求精），得到该子问题解法的分解步骤，即更低一层次的子问题。\n\
    +   - 如此下去，直到最低层的每个子问题都能够用计算机语言的一个语句表示出来或都能明显写出解法为止。便找到解决整体问题的解题算法了。\n\n上述的求精过程中的每一步，主要用到如下四种求精技术：\n\
    \n+   - 顺序连接的求精\n+   - 分支、选择的求精\n+   - 循环的求精\n+   - 递归的求精\n\n+   - 当问题的子解具有前后关系时，采用第一种顺序连接的求精技术，将问题分解成互不相交的几个子问题的顺序执行。\n\
    +   - 当问题是分别不同情况而应该进行不同处理时，采用第二种分支、选择的求精技术，构造分支。这时要注意分支的条件一定要正确\n\n+   - 当问题的子解具有特性：如果有向解的方向前进一步的方法，且不断重复该步骤，即能解决问题，最终达到完全解。则应该采用循环的求精技术。这时要弄清循环的初始条件、结束条件和有限进展的一步都是什么。\n\
    +   - 当问题的某步解法与前边高层次的某步解法具有相同性质，只是某些参数不同时，可采用递归的求精技术。这时应注意递归的参数变化规律以及递归出口。\n\n\
    所谓自顶向下，逐步求精的分析技术实质上是下图所示过程的反复。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_918_0.png)\n\
    \n# 采用自顶向下、逐步求精方法构造程序有如下优点：\n\n+   - 程序的层次分明、结构清晰。\n+   - 便于集体开发程序。对于大型程序来讲，可以每组负责一个模块（一个子部分），在一个组内又可以每个人负责一个子模块（更小的子部分）等等。而各个模块之间以及各个子模块之间相对独立，互相之间没有制约，各个模块的负责人员可以独立的进行程序设计。\n\
    +   - 便于调试。若程序有错误，可以很容易的将错误局部于某一子部分，找出错误，同时每一部分的错误是独立的，也不至于影响其它的部分。\n\n# 求精过程的表示\n\
    \n有各种方法表示上述求精过程，比较常见的是\n\n+   - 传统的流程图方法：把每步求精过程用流程图表示。优点是直观，以二维图表示程序的流程；缺点是不能体现结构化程序设计思想。\n\
    +   - 函数方法：在求精过程中，每个子问题都以一个函数调用表示，然后再具体求精相应的函数本身。不画框图，而直接书写程序。优点是：直接写出程序，程序的层次分明，能体现结构化程序设计思想。缺点是：以一维方式表示逻辑结构，逻辑结构和算法不直观。\n\
    \n# **PAD 方法：** 用二维树形结构图描述程序的逻辑，直观、清楚。具有上述两种方法的共同优点，同时又摒弃了上述两种方法的缺点。\n\n+   -\
    \ 处理的概括性：与一条纵线相连的处理可以作为一个概括。在流程图和程序中，没有特别的表示处理概括的记法。\n+   - 执行顺序的表示：从上至下用纵线连接处理顺序。在流程图中用箭头表示处理流向；在程序中则没有表示处理顺序的方法。\n\
    +   - 嵌套层次的表示：PAD的树结构可以清楚地表示嵌套层次。流程图没有表示嵌套的记号；程序则是靠的是语句嵌套；都没有PAD清晰、明了。\n\n# 求精实例\n\
    \n+   - 测定字母偶的出现频率\n+   - 三个齿轮啮合问题\n+   - 验证三角形外心定理\n\n# 编程序，测定字母偶的出现频率\n\n测定小写字符串中相邻字母偶出现频率。\n\
    例如，针对\nthe cat\n对\nth、he、ca、at\n计数。设有说明：\nint conmat[26][26];\n字母偶 he 的出现次数存入下标变量\n\
    conmat['h'-'a']['e'-'a']\n\n首先把该问题分解成如下几步：\n\n1) 初始化计数器数组conmat ;\n2) 统计每个字母偶的出现频率;\n\
    3) 输出统计结果。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_924_0.png)\n\n求精上述PAD中的每一个步骤：\n\
    初始化数组conmat ,显然应该一行一行的初始化；\n对于每行又应该一个元素一个元素的初始化。\n\ninitial 初始化\ndef\nfor( i=0;\n\
    i<26;\ni++ )\nfor( j=0;\nj<26;\nj++ ) 初始化第i行\nconmat[i][j] = 0\n结束\n\n# 考虑统计部分：\n\
    \n假设被统计的字符串是从终端输入的，则显然我们应该把该字符串全部读入，并在读入的过程中边读边统计。用下图表示。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_926_0.png)\n\
    \n再考虑具体统计算法，为统计字母偶的出现频率，显然在读入字符字符串的过程中应该始终保存两个字符 prevchar、thischar，并且当该两个字符都是字母时，相应计数单元加1；最后在读入下一个字符之前还应该把保存的两个字符向前串。\n\
    \n统计一次\nthischar, prevchar 都是字母\nconmat[ prevchar][ thischar ] ++\nprevchar =\
    \ thischar\n结束\n\n最后考虑输出部分，我们把结果输出成两个 26×13 的表，每个表元素是相应字母偶的出现次数：\n\n* a b c d\
    \ e ... m\na\nb\n...\nz\n\n* n o p q r ... z\na\nb\n...\nz\n\nout 输出\ndef\noutone('a','m')\
    \ 输出a..m部分\noutone('n','z') 输出n..z部分\n结束\n\n打印一个表（第一个表），显然应该先打印表头再打印下边各行\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_929_0.png)\n\
    \n打印表头可以求精成先输出一个“*”；再顺序输出各个字符。\n顺序输出各个字符是一个循环。\n\noutone\n\nbeginch ,endch\n\n\
    输出字符表头\n\nfor( c1=beginch;\n顺序输出各个字符;\nc1++)\n\n输出(c1)\n\n输出(\"\\n\")\n\n打印表体\n\
    \n结束\n\n打印表体应该一行一行的打印，\n每行应该先打印行头，再打印本行各个元素；\n打印本行各个元素，应该一个元素一个元素的打印，是一个循环\n\n\
    outone\n\nbeginch ,endch\n\n输出('*')\n\nfor( c1=beginch;\nc1<=endch;\nc1++)\n\n\
    输出(c1)\n\n输出(\"\\n\")\n\nfor( c1=cha;\nc1<=chz;\nc1++)\n\n打印表体\n\n输出(c1)\n\nfor(c2=beginch;\n\
    c2<=endch;\nc2++)\n\n输出\nconmat[c1][c2]\n\n输出(\"\\n\")\n\n结束\n\n# 三个齿轮啮合问题\n\n\
    设有三个齿轮互相啮接，求当三个齿轮的某两对齿互相啮接后到下一次这两对齿再互相啮接，每个齿轮最少各转多少圈。\n\n解:这是求最小公倍数的问题。每个齿轮需转圈数是三个齿轮齿数的最小公倍数除以自己的齿数。设\n\
    \n+   - 三个齿轮的齿数分别为:na、 nb、 nc ；\n+   - 啮合最小圈数分别为:ma、 mb、 mc ；\n+   - 三齿轮齿数的最小公倍数为k3\
    \ 。\n\n# 计算步骤表示为：\n\n开始\n\n读入三齿轮齿数\n\n求三齿数的最小公倍数 k3\n\n分别计算啮合的最小圈数\n\n输出结果\n\n\
    结束\n\n读入三齿轮齿数和输出结果，分别只是一次调用读或写函数，不必求精。\n\n求精计算三齿数的最小公倍数k3。可以把该问题分解成\n\n先求两个齿数na与nb的最小公倍数k2，\n\
    \n然后再求k2与第三个齿数 nc 的最小公倍数k3，\n\nk3即为na、 nb、 nc三个齿轮齿数的最小公倍数。\n\n设已经有求两个数的最小公倍数的函数\n\
    \n```\nint lowestcm( int x, int y )\n```\n\n则该求精过程可表示成。\n\n求三齿数的最小公倍数\n\n```\n\
    k3=lowestcm( lowestcm(na,nb), nc )\n```\n\n结束\n\n# 采用展转相除法求两个数的最大公约数，函数\nint gcd(int\
    \ x, int y)\n\n定义如下\n\ngcd(x, y) = { x                     y = 0\n           \
    \    gcd(y, x%y)          y ≠ 0 }\n\n函数gcd是一个递归函数，先采用分支求精过程、再采用递归求精过程，可以求精成下图\n\
