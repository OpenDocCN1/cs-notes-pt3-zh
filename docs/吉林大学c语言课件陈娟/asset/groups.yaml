    # 有时可能不小心生成无效指针 invalid pointer


    +   - 无效指针是指一个指针变量无值，它既没有指向确定的变量或函数，也不是NULL。

    +   - 程序中存在无效指针，不是好的程序设计风格

    +   - 产生无效指针的原因很多，例如

    +     - 说明指针变量后还没有给它赋值；

    +     - 把整型变量转换成指针；

    +     - 回收为指针所指对象分配存储空间；

    +     - 指针运算超出数组范围。'
  - '[PAGE 635]


    # 通用指针


    +   - 通用指针类型的值是一个指针值，但是该值不属于任何类型。

    +   - 具体讲，通用指针所指向的内存空间没有被作为任何一个数据类型 的变量。

    +   - 实际应用当中，对事先无法确定类型的空间，可以先使用通用指针标识，然后在具体使用之前，对其进行强制类型转换，得到相应类型的变量，再对其进行操作。

    +   - 通用指针所指向的空间可以转换成任何类型的变量'
  - '[PAGE 636]


    +   - 通用指针说明符是：

    +     void *

    +   - 通用指针变量可以通过类型强制转换后赋值给任何一个指针类型的值

    +   - 任何类型指针变量也可以被赋值通用指针值。

    +     void * general_ptr;    /* 声明通用指针变量 */

    +     int * int_ptr;         /* 声明int类型指针变量 */

    +     char * char_ptr;       /* 声明char类型指针变量 */

    +     general_ptr=int_ptr;   /*OK*/

    +     int_ptr=(int*)general_ptr; /*OK*/

    +     general_ptr=char_ptr;  /*OK*/

    +     char_ptr=(char*)general_ptr; /*OK*/

    +     int_ptr=char_ptr;      /*错误，类型不一致*/

    +     char_ptr=int_ptr;      /*错误，类型不一致*/

    +     int_ptr=(int *)char_ptr; /*OK*/'
