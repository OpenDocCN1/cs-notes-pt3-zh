    # 结构体与函数


    +   - 结构体与函数的关系

    +     - 返回结构体值的函数

    +     - 函数的结构体参数

    +   - 在C中允许函数类型为结构体类型，即函数可以返回一个结构体值；

    +   - 还允许结构体作为函数的参数，用参数的方式向函数传递结构体类型的值。'
  - '[PAGE 1180]


    # 返回结构体值的函数


    函数的计算结果可能是一个结构体值。在C中，有两种途径能够把该结构体值通过函数调用带回调用函数的主程序。


    +   - 使用指针

    +     函数的结果类型是指向结构体类型变量的指针类型


    +   - 直接使用结构体类型

    +     函数的结果类型是结构体类型，直接把一个结构体值带回调用函数的主程序'
