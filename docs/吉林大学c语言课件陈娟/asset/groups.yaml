    \n不论穷举法还是试探法都可以写成递归形式:\n\n## 八皇后 穷举法的递归实现\n\n+   用穷举法实现八皇后问题，可以抽象的描述为：在数组A的8个位置上分别排列一个1到8的整数。设想，如果有一个函数\n\
