  - "[PAGE 1355]\n\n考察程序运行中各个参数、变量、链表的变化状态。如图所示：\n设从base到p0之间的子链表已经递增，现在加入p所指示的节；\n\
    在base~p0之间查找合适位置，设应该把p所指的节插入到r0,r所之间；\n把p独立出来=>q， p指向p0：\n    q = p ;\n    p0->next\
    \ = p->next ;\n    p = p0 ;\n把p（现在由q指示）插入到r0,r之间：\n    q->next = r ;\n    r0->next\
