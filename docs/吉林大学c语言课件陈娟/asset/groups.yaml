    \ -n+1 , i);\n            if test_b( k , b , v )      return  false ;\n      \
    \      b[v] = k ;      v++;\n        }\n    }\n    return true;      /* 检验结果值\
    \ */\n}\n```\n\n## 本章小结\n\n- 本章讲述不太重要的两种 C 语句以及极其重要的结构化程序设计思想，最后讲述一类问题的程序设计方法。\n\
    - 重点掌握自顶向下逐步求精的程序设计技术。穷举法和试探法。\n\n## 作业\n\n- ① 9.1\n- ② 9.20\n\n## 第十章 文件\n\n\
    - 文件概述\n- 文件操作\n- 文件操作实例\n- 本章小结\n\n## 文件概述\n\n- 文件是为了某种目的系统的把数据组织起来而构成的数据集合体\n\
    - 从实现角度看：文件往往与外部设备、磁盘上的文件联系在一起，也就是与计算机操作系统的文件联系在一起\n- 人们往往需要加工处理各式各样的数据，连接各种各样的外部设备。这些数据和设备是千差万别的。\n\
    - 为了处理的统一与概念的简化，操作系统把这些外部数据、外部设备一律作为文件来管理。\n- 程序设计语言中管理的文件，就是计算机操作系统中的文件。\n\n\
    ## 文件分类\n\n文件是程序设计中的一个重要概念，从不同的角度看文件可以分成不同的\n\n- 从操作角度看\n  - 顺序文件\n  - 随机文件\n\
    - 从用户角度看\n  - 普通文件\n  - 设备文件\n- 从文件内部编码方式看\n  - ASCII文件\n  - 二进制文件\n\n- 文件名\n\
    \  文件名是文件的唯一标识，它的结构是\n  主文件名.扩展名\n  其中的扩展名可以省略，但通常都保留。\n\n- 因为通过扩展名，可以判断文件类型。例如.\n\
    \n- .c  C语言的源程序文件\n- .txt  文本文件\n- .doc  word文档文件\n\n## 文件名分为\n\n- 绝对文件名\n  从磁盘盘符开始描述的文件名\n\
    - 相对文件名\n  从计算机操作系统中文件系统的某个节点开始描述的文件名\n\n# 例如：\n\nE:\\doc\\programing\\test.c\n\
    表示绝对文件名\n\ntest.c\n表示相对于节 E:\\doc\\programing 的相对文件名\n\n## 顺序文件和随机文件\n\n- 顺序文件的特点：文件分成两种模式\n\
    \  - 读模式    写模式\n- 在任意时刻，一个顺序文件只能处于两种模式之一。当一个顺序文件处于读模式时，只能从该文件读数据。\n- 反之，当一个顺序文件处于写模式时，只能向该文件写数据。\n\
    - 从操作角度看，顺序文件只能顺序操作。\n- 对于读来讲，顺序文件只能从文件第一成分开始顺序的，一个成分接一个成分的读数据。\n- 对于写来讲，顺序文件只能在文件尾一个成分接一个成分的向文件里写数据，每次写进的成分都放在文件末尾\n"
