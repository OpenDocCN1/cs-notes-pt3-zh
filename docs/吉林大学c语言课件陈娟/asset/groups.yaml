  - '[PAGE 1229]


    设 ti 为二叉树的一个结点，一般 ti 由两部分组成：

    ● 基本数据部分------保存本结点上的基本数据；

    ● 指针部分连------接本结点以下的其它结点。

    结点 ti 的指针连接的结点称为 ti 的子结点，

    相应 ti 称为其子结点的父结点。

    ti的指针部分有两个指针：左指针、右指针。

    称 ti 的左指针连接的部分为 ti 的左子树，

    ti 的右指针连接的部分为 ti 的右子树。

    若左、右子树均空，则称 ti 为叶结点。


    ![](img/2c9b154d61523ac3dc02daf316966b8e_1229_0.png)'
