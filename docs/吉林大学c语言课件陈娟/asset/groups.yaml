  md: "\n# 例12-3 法雷序列\n\n对任意给定的自然数 n，把所有如下形式的不可约分数\n\\(\\frac{j}{i}\\)  \\(\\left(0\
    \ < i <= n ; 0 <= j <= i\\right)\\)\n\n按递增顺序排列起来，称该序列为 n 级法雷序列 Fn。\n例如F8 为：\n\n\
    0/1, 1/8, 1/7, 1/6, 1/5, 1/4, 1/7, 2/3, 1/8, 3/5, 2/7, 3/2, 1/4, 3/7, 5/8, 2/3,\
    \ 5/7, 3/4, 5/5, 6/7, 7/8, 1/1\n\n编函数，对任意给定的正整数 n，求 n 级法雷序列，并带回 n 级法雷序列链指针。\n\n\
    # 分析：\n\n法雷序列的每项是个分数，不能用实数精确的表示，而且这些数的排列顺序是不规则的。用下图形式的链表来表示它。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1358_0.png)\n\
    \n```\nstruct farlei_item {\n\tint numerator , denominator ;\n\tstruct farlei_item\
    \ *next ;\n};\n\ntypedef struct farlei_item *farleipointer ;\n\nint gcd(int x,\
    \ int y) { /* 求最大公约数 */\n\tif ( y==0 )\n\t\treturn x ;\n\telse return gcd(y ,\
    \ x % y ) ;\n}\n```\n\n```\n/*构造法雷序列,并返回序列头指针*/\nfarleipointer farlei(int n) {\n\
    \    int i,j;\n    farleipointer fn , r , r0 , p;\n    if( n<1 )             \
    \   //如果n<=0,则没有法雷序列\n        return NULL;\n    /* 0/1 , 1/1 送入序列， fn指向链首 */\n\
    \    fn = (farleipointer)malloc(sizeof(struct farlei_item));\n               \
    \             //构造0/1\n    fn->numerator = 0;\n    fn->denominator = 1;\n    fn->next\
    \ = (farleipointer)\n                malloc(sizeof(struct farlei_item)); //构造1/1\n\
    \    fn->next->numerator = 1;\n    fn->next->denominator = 1;\n    fn->next->next\
    \ = NULL;\n```\n\n```\n/* 生成序列 */\nfor ( i=2; i<=n; i++ )\n    for (j=1; j<i;\
    \ j++)\n        if ( gcd(i,j) == 1 ) { /* 查 j/i 位置 r0,r */\n            r = fn\
    \ ;\n            while ( j*r->denominator > i*r->numerator ) {\n             \
    \   r0 = r ;\n                r = r->next ;\n            }\n            /* j/i\
    \ 插入到 r0,r 之间 */\n            p = (farleipointer)malloc(sizeof(struct farlei_item));\n\
    \            p->numerator = j ;\n            p->denominator = i ;\n          \
    \  r0->next = p ;\n            p->next = r ;\n        }\n    return fn ;\n}\n\
    ```\n\n# 例12-4 多项式加法\n\np(x) = 6.5X⁵ + 3.4X² + X + 0.5\n\n多项式可以用如下形式的链表来存储；\n\n\
    ![](img/2c9b154d61523ac3dc02daf316966b8e_1363_0.png)\n\n# 例如多项式\n\np(x) = 6.5\
    \ X^5 + 3.4 X^2 + X + 0.5\n\n可以表示成如下形式：\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1364_0.png)\n\
    \n编一个函数，实现多项式加法: p(X)+q(X) => s(X) 。\n\n设有类型说明：\n\n```\nstruct item {\n    float\
    \ coef;\n    int exp;\n    struct item *next;\n};\ntypedef struct item *polynome;\n\
    ```\n\n解:在本程序的算法中，在链表上利用了一个哨兵项。所谓哨兵是在链表的链首多加一节，该节不存储有效的链表项的值，而保存一个边界值或空值，本程序的哨兵项是空值。由于利用了哨兵变量，所以处理统一了。多项式加法的算法如下图：\n\
    \n开始\n\n(p!=NULL)\n&&\n(q!=NULL)\n\np ->exp\n>\nq ->exp\n\np => s ; p = p->next\n\
    \np->exp\n<\nq->exp\n\nq=>s; q = q->next\n\np+q=>s;\nq = q->next;\np = p->next\n\
    \np!=NULL\n\np=>s; p = p->next\n\nq!=NULL\n\nq=>s; q = q->next\n\n结束\n\n程序如下：\n\
    \n```\nvoid adds( int exp0 , float coef0 , polynome r ) {\n    /* 向s加入一项 */\n\
    \    polynome r0;\n    r0 = ( polynome)malloc( sizeof(struct item) );\n    r0->exp\
    \ = exp0;\n    r0->coef = coef0;\n    r0->next = NULL;\n    r->next=r0;\n}\n```\n\
    \n```\npolynome addpolynome(polynome p, polynome q) {\npolynome s , r\n\n// s为结果多项式链首;\
    \ r 起始指向结果多项式s的最低次幂项。\n/* 申请一个哨兵变量，以便算法统一 */\ns = (polynome)malloc( sizeof(struct\
    \ item) );\nr = s;\nwhile ( (p!=NULL)&&(q!=NULL) ) /* 相加 */\nif ( p->exp > q->exp\
    \ ) {\n\tadds( p->exp , p->coef , r);\n\tp = p->next;\n}else if ( p->exp < q->exp\
    \ ) {\n\tadds( q->exp , q->coef , r);\n\tq = q->next;\n}else{\n\tadds( p->exp\
    \ , p->coef+q->coef , r);\n\tq = q->next; p = p->next;\n}\n}\nr=r->next;\n}\n\
    ```\n\n```\n/* p 多项式尾 */\nwhile (p!=NULL) {\n    adds( p->exp , p->coef , r );\n\
    \    p = p->next;\n    r=r->next;\n}\n/* q 多项式尾 */\nwhile (q!=NULL) {\n    adds(\
    \ q->exp , q->coef , r );\n    q = q->next;\n    r=r->next;\n}\n/* 释放哨兵变量 */\n\
    r = s;\ns = s->next;\nfree(r);\nreturn s ;\n}\n```\n\n# 本章小结\n\n+   - 本章讲述十分重要的动态数据结构\n\
    +     - 动态数据结构概念\n+     - 各种简单的动态数据结构\n+       - 栈\n+       - 队列\n+       - 链表\n\
    +       - 树\n+       - 图\n\n重点掌握动态数据结构的操作\n\n# 作业\n\n+   ① 12.1\n+   ② 12.2\n\
    +   ③ 12.3\n+   ④ 12.9\n+   ⑤ 12.45\n"
