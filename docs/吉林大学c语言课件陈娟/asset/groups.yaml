  - '[PAGE 779]


    # 生存期


    +   - 生存期是一个动态概念

    +   - 描述当程序运行起来后，一个对象（标识符）是否有效存在

    +   - 所谓对象主要是指变量和函数

    +   - 对于类型不同的变量和函数在程序运行时要分配存储空间，也就是具有存在性。

    +   - 对象的生存期是保持所分配存储空间的那段程序的运行期间。

    +   - 如果变量有一个初始化语句，则每次进入它的生存期创建它的同时，对它重新初始化。'
  - '[PAGE 780]


    # 静态生存期


    如果所分配的存储空间在程序执行前开始，并保持到程序执行终止，则称此对象具有静态生存期。C语言中


    +   - 所有函数都具有静态生存期；

    +   - 所有顶层声明的变量都具有静态生存期；

    +   - 复合语句中声明的变量是否具有静态生存期，取决于存储类别；

    +   - 函数形式参数是否具有静态生存期，取决于具体声明的存储类别


    具有静态生存期的对象（变量、函数）在程序的整个运行期间全都存在。


    程序开始运行，它的生存期开始，并创建它；直到程序运行结束，它的生存期结束并删除它。'
  - '[PAGE 781]


    # 本地生存期


    如果对象在进入复合语句或函数时生成，在退出复合语句或函数时删除，则称为具有本地生存期。


    具有本地生存期的对象


    +   - 当程序运行进入复合语句或函数时创建它，并且它的生存期开始

    +   - 当程序运行退出复合语句或函数时删除它，并且它的生存期结束

    +   - C语言中把具有本地生存期的变量称为自动变量。


    复合语句中声明的变量是否具有本地生存期，取决于具体声明的存储类别；


    函数形式参数是否具有本地生存期，取决于具体声明的存储类别。'
  - '[PAGE 782]


    # 动态生存期


    +   - C中的数据对象还可以具有动态生存期

    +   - 可以随意显式地创建和删除。

    +   - 动态对象的创建和释放，通过动态存储分配函数 (malloc、free等)显式实现。

    +   - 复合语句中声明的变量、函数形式参数具有本地生存期还是具有静态生存期依赖于它的存储类别。'
  - '[PAGE 783]


    有关存储类别的概念我们不在这里介绍，有兴趣的读者可以查阅第14章或有关资料。目前我们使用它们的省略存储类别。


    +   - 所有复合语句中声明的变量、函数形式参数全部具有本地生存期，全部为自动变量；

    +   - 所有顶层声明的变量具有静态生存期，全部为静态变量；

    +   - 所有函数都具有静态生存期。'
  - '[PAGE 784]


    # 局部量和全局量


    +   由作用域规则可知

    +   - 一个函数或复合语句引入的标识符只在本函数或复合语句内有效，

    +   - 在本函数或复合语句外，便失去了它的意义

    +   - 称它们是局部于声明它们的函数或复合语句

    +   - 或称该标识符相对于声明它们的函数或复合语句来讲是局部量。'
  - '[PAGE 785]


    +   - 任何顶层声明的标识符在所有函数内部以及复合语句都可以使用，条件是在函数内部和复合语句中没有与它同名的其它声明

    +   - int x=1;

    +   - void f(int v){ int x=v;}

    +   - void g(int x){x=3;}

    +   - void h(int v){int  x=4;}'
  - '[PAGE 786]


    +   称顶层声明的标识符相对于函数和复合语句来讲是全局量


    +   若一个复合语句嵌套在一个函数或另一个复合语句之内


    +   - 且某一个标识符在函数或其外层复合语句中声明


    +   - 而且在内层复合语句中没有与相应标识符同名的声明


    +   - 则函数或外层复合语句中关于这个标识符的声明在内层复合语句中仍然有效


    +   - 即在内层复合语句中仍可使用这个标识符


    +   称在函数或外层复合语句中声明的标识符相对于其内层复合语句来讲是全局量'
  - '[PAGE 787]


    +   - 全局量和局部量是一个相对概念。

    +     - 某标识符相对于某复合语句是局部的，相对于其内层复合语句却是全局的；

    +     - 反之某标识符相对于里层某复合语句是全局的，但是相对于声明它本身的那个复合语句来讲却是局部的。


    +   - 全局量在内层具有外层同样的意义

    +     - 在内层对全局量的操作直接反应在外层程序中'
