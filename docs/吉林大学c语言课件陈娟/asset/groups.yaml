    # 例6-10 队列


    +   - 在数据管理上，队列的特点是 “先进先出”

    +     - 最后进入队列的数据元素最后取出使用

    +     - 而最先进入队列的数据元素也最先取出使用

    +     - 数据的进入在队尾进行（排在队尾）；而取出在队头进行。

    +   - 队列经常用于组织各种缓冲区（如打印缓冲区）。

    +     - 由于数据总是不断产生送入缓冲区，并不断的被取出使用，所以经常把缓冲区组织成一个环形，即把缓冲区的首尾接起来'
  - '[PAGE 508]


    +   ■ 送入数据时

    +   当已经到达缓冲区末尾时，下一个数据便送到缓冲区首部第一个位置上

    +   ■ 取出数据时

    +   当已经到达缓冲区末尾时，下一个数据便从缓冲区首部第一个位置上取出。

    +   ■ 显然

    +   - 当送入数据时，缓冲区应有空位置才能送入

    +   - 当取出数据时，缓冲区应有数据才能取出'
