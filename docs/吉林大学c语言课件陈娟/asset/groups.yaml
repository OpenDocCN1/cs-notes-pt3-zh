    \    printf ( \"%c -> %c\\n\" , u , v );\n}\nvoid move ( int n, char x, char y,\
    \ char z ) {\n    if ( n>0 ) {\n        move( n-1 , x,z,y );\n        moveone(\
    \ x,y );\n        move( n-1 , z,y,x )\n    }\n}\nint main(void) {\n    int  n\
