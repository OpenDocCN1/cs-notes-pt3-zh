    x0=0.9;                 /* 1 */

    r1:x1=f(x0);             /* 2 */

    if ( abs(x1-x0)<1e-5 ) /* 3 */

    goto r2 ;               /* 4 */

    x0=x1;                  /* 5 */

    goto r1;                /* 6 */

    r2: ;                   /* 7 */

    */

