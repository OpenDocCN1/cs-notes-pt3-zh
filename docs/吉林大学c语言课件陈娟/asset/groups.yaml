    \ ;\n        a[j+1]=r;\n    }\n}\n```\n\n## 例6-7 顺序检索\n\n- “检索”与“分类”是互相联系在一起的，也是计算机科学中研究的一类重要课题。\n\
    - 我们仍以整数数组 A 为背景介绍两种较常见的算法\n- A 已经按递增排序。\n\n## 检索思想\n\n顺次用欲检索的关键字值key与数组A中元素 a[0]、a[1]、...、a[n-1]逐一进行比较。\n\
    \n- 找到一个j使key==a[j]:\n  位置为j，函数search带着j返回；\n- 直到结束，没有使key==a[j]的存在:\n  未找到，函数search带回值\
