    +   1. 从m点出发沿所有可能的路向前走一步;

    +   2. 然后再站在新的点上，再向前走一步; ...


    如此重复，直到走到结点n为止。

    在走的过程中，保证不走重复点，可以得到下图的算法:


    route


    m:开始点； n:终结点； r:路迹数组p尾标


    p[r] = m


    m==n


    输出p[0~r]


    结束


