    vline\n\nx1,y1,x2,y2： 两点\n*a,*b： 垂线方程\n\n直线方程: line(x1,y1,x2,y2,&ta,&tb)\n\n中点:\
    \ x = (x1+x2)/2 ; y = (y1+y2)/2\n\n垂直平分线方程:\n*a = -1/ta ; *b = y - (*ta)*x\n\n\
    结束\n\n## 验证该三条直线是否交于一点编成一个函数 isOnePoint ，可以\n\n先求两条直线的交点，\n然后再判断第三条直线是否过该点。\n\n\
    ## 三条直线交于一点\n\n```\n求L12与L23交点:*x = (b1-b2)/(a1-a2) ;\n*y = a1*( *x)+b1\n```\n\
    \n```\nfabs( a3*( *x ) +b3-y )\n<eps\n```\n\n- return false\n- return true\n\n\
    结束\n\n设有一个函数\n\n## distance (x1,y1,x2,y2)\n\n可以计算两点间距离，验证三条垂直平分线的交点到三角形各顶点距离是否相等，是一个布尔表达式。\n\
    \ndistance\n\nx1,y1,x2,y2: 两点坐标\n\n```\nreturn\nsqrt( (x2-x1)²+(y2-y1)² )\n```\n\
    \n结束\n\n## 受限排列组合——穷举法与试探法\n\n有这样一类问题，从若干元素的所有排列（或组合）中选取符合某种条件的一些排列（或组合）。\n\n\
    - 八皇后问题\n- Debruijn 问题\n\n## 八皇后问题\n\n这是一个古老而有趣的游戏。高斯(C.F.Gauss)最早在1850年提出并研究过这个问题，但是没有完全解决。该问题是：\n\
    \n在一个8*8格的国际象棋棋盘上放置八个皇后，使任意两个皇后都不能互相攻击。\n\n按国际象棋规则，两个皇后可以互相攻击。若\n\n- 在同一行上，\n\
    - 或在同一列上，\n- 或在同一条斜线上（包括左高右低、右高左低）\n\n如图所示放置的八个皇后便不能互相攻击。编程序，求出所有符合要求的布局。\n共有92种满足条件的布局，若除去对称的等类同布局，完全不同者有12种。这里不考虑剔除类同布局，求出全部92种布局。\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_949_0.png)\n\n解这类问题有两条途径：\n\n- 1. 穷举法；\n\
    - 2. 试探法。\n\n下边以八皇后问题为例，分别介绍这两种方法。\n\n在具体介绍这两种方法之前，先考虑八皇后问题的表示方法。用一个一维数组表示棋盘。A[i]表示棋盘的第i列，若A[i]中存放有数k表示第i列中第k行上放置了皇后。例：\n\
    \nA[3]=6\n\n表示在棋盘的第3列第6行上放置一个皇后。A[0]是根据下边算法的需要，多设的一个元素。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_951_0.png)\n\
    \n## 八皇后 穷举法\n\n本方法思路是，按某种顺序枚举出全部排列或组合。每当枚举出一种排列或组合之后，便用给定条件判断该种排列或组合是否符合条件。\n\
    \n- 若符合条件，则本种排列或组合被选中，可以输出或记录下来。\n- 若不符合条件，则把本种排列或组合舍掉。\n\n八个皇后的排列问题，最简单的方法是八重循环，可以编出如下穷举法程序。\n\
    \n在下述算法中，用到检验函数check与输出函数out。为简单起见，先省略它们的具体实现细节。\n\n```\nint main(void){\n   \
    \ int a[9] ,  i1,i2,i3,i4,i5,i6,i7,i8 ;\n    for ( i1=1; i1<=8; i1++ )\n     \
    \   for ( i2=1; i2<=8; i2++ )\n            for ( i3=1; i3<=8; i3++ )\n       \
    \         for ( i4=1; i4<=8; i4++ )\n                    for ( i5=1; i5<=8; i5++\
    \ )\n                        for ( i6=1; i6<=8; i6++ )\n                     \
    \       for ( i7=1; i7<=8; i7++ )\n                                for ( i8=1;\
    \ i8<=8; i8++ ) {\n                                    a[1] = i1 ;   a[2] = i2\
    \ ;\n                                    a[3] = i3 ;   a[4] = i4 ;\n         \
    \                           a[5] = i5 ;   a[6] = i6 ;\n                      \
    \              a[7] = i7 ;   a[8] = i8 ;\n                                   \
    \ if ( check() ) out();\n                                }\n}\n```\n\n## 八皇后 试探法\n\
    \n本方法的思路是，按一定规律，从某一满足条件的初始状态（初始排列）出发，逐步生成满足条件的子排列，不断增加子排列长度。在增加子排列长度过程中，每增加一位，生成一个子排列后，便检验它是否满足条件。若该子排列不满足条件，则换一个子排列(即修改当前位置——在当前位置上换一个元素)；若该子排列满足条件，则延长子排列，增加子排列长度。直到子排列的长度满足问题的要求长度为止，便找到一个解。\n\
    \n若要求找到一个解即可，这时便可以结束。若要求找到所有解，这时可以输出或记录本解，然后按前述思路，继续修改排列，继续试探，找下一个解。\n\n## 在上述试探过程中,\
    \ 修改当前位置时要考虑:\n\n- 若当前位置上还有没被试探过的元素, 则应该取下一个没被试探过的元素进行试探。\n- 若当前位置上所有元素都被试探过了(例如八皇后问题中,\
    \ 某一列的八个位置都已经考虑过了), 则在当前位置上没办法再修改了。这说明前边的某个位置有问题, 放置的元素不对, 显然应该向回退一位(即回溯到上一个位置上)。回溯后,\
    \ 原来的上一个位置变成了当前位置, 则又变成修改当前位置的问题了。这时, 同样还应该考虑取下一个没被试探过的元素进行试探, 以及是否所有元素在当前位置上都被试探过了并回溯的问题。\n"
