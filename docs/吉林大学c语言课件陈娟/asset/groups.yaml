  md: "\n## ② T *p[n]\n\n- “int *p[5]” 相当于 “int *(p[5])”。\n- “p[5]”表示p是5个元素的数组，元素类型为int*，即指向int类型变量的指针类型。这个声明，声明了一个指针数组p，如图所示。\n\
    - 下标变量p[2]是数组p的编号为2（第三个）的成分，它是一个指针，可以指向一个int类型变量。\n\n## 5个元素指针数组\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_685_0.png)\n\
    \n## ④ T *(p[n])\n\n- 声明 “int *(p[5])” 与 “int *p[5]”等价。\n- p是5个元素的指针数组，p本身是一个指针常量。\n\
    \n## 指针与字符串\n\n- 字符串实质上是常量字符数组，同时还可以使用字符数组变量保存字符串。\n- 指针与数组有着密切的关系，数组名是指针，指针也可以指向数组。\n\
    - 显然指针与字符串有着密切的关系。\n- 在C中，除了用字符数组保存并标识字符串外，还可以使用字符类型指针指向一个字符串，\n- 从而使用指针访问它所指的字符串。该字符串既可能是字符数组，也可能是字符串常量。\n\
    \n```\nchar *sp = \"I love china\", *sv;\nchar string[] = \"I am a student\";\n\
    ```\n\n- 定义两个字符指针变量sp、sv 以及一个字符数组变量string；\n- 并对变量作初始化，使sp指向字符串 “I love china”，\n\
    - 而string初始化为 “I am a student”。\n- 设变量从A000开始分配内存空间，常量从AA00开始分配内存空间，这个声明产生下图的内存分配结果。\n\
    \n## 从使用角度看：\n\n- 不论字符串指针还是字符数组，访问整个字符串要十分小心，有些操作是正确的，有些操作是错误的。\n- 举例如下，请从中深刻体会字符串指针和字符数组的各种用法。\n\
    \n```\n(1) char str[20]=\"I am a teacher\";\n// 正确，初始化数组str\n```\n\n```\n(2) char\
    \ str0[20], str[20]=\"I am a teacher\";\nstr0=str;\n// 错误，给指针常量赋值，数组不能整体赋值\n```\n\
    \n```\n(3) char str[20];\nstr=\"I am a teacher\";\n// 错误，给指针常量赋值，数组不能整体赋值\n```\n\
    \n```\n(4) char str[20];\nstr[]=\"I am a teacher\";\n// 错误，给指针常量赋值；\n// \"str[]\"\
    出现在 \"=\"左端，意义不明确。\n```\n\n```\n```c\n(5) char *str;\n    str=\"I am a teacher\"\
    ;\n    // 正确，给指针变量赋值，str指向常量字符串\n```\n```\n\n```\n```c\n(6) char str[20];\n  \
    \  scanf(\"%s\",str);\n    // 正确，输入字符串\n```\n```\n\n```\n```c\n(7) char *str;\n\
    \    scanf(\"%s\",str);\n    // 错误，str不指向任何变量，输入字符串无处放\n```\n```\n\n```\n(8) char\
    \ *str , str0[20];\nstr=str0;\nscanf ( “%s”,str);\n// 正确，输入字符串数据从str0[0]开始存放\n\
    ```\n\n```\n(9) char *str , str0[20];\nstr=str0+5;\nscanf ( “%s”,str);\n// 正确，输入数据将从str0[5]开始存放\n\
