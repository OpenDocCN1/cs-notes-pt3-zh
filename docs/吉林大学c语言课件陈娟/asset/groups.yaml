    # 例6-9 栈


    栈和队列都是线性表，是两种重要的数据结构，应用中经常使用数组实现这两种线性表。下边分别介绍这两种数据结构。


    +   在数据管理上，栈的特点是“后进先出”

    +   - 即最后进入栈的数据元素应最先取出使用。

    +   - 数据的进入（称“压入”）退出（称“弹出”）均在栈顶进行。'
