    \n## 关系运算包括：\n\n- 判断两个指针值是否相等或不相等 ==、!=；\n- 比较两个指针值的大小关系 >、>=、<、<=\n\n## 例子\n\n\
    - px<py 判断px所指向的存储单元地址是否小于py所指向的存储单元地址。\n- px==py 判断px与py是否指向同一个存储单元\n- px==0、px!=0、px==NULL、px!=NULL\
    \ 都是判断px是否为空指针。\n\n一定要注意，参与关系运算的指针值是否是兼容类型的，如果p指向一个int类型变量，而q指向一个 float 类型变量，进行p与q的比较是错误的。\n\
    \n## 例7-4 指针运算实例\n\n```\n#include <stdio.h>\nvoid main(){\n    char str[255],\
    \ *p;\n    int v;\n    scanf(\"%s\",str);\n    p=str;\n    while( *p!='\\0' )\n\
