  mdcn: "\n为了检索操作方便，一般把二叉树组织成二叉检索树。两叉检索树的定义是：\n\n- 设树中每个结点的数据部分有一个数据项 key 是有序的，称该数据项为关键字。\n\
    - 一个二叉树称为检索树，\n- 如果对每个结点 ti ，它的左子树中所有结点的 key 值都小于 ti 的 key 值；\n- ti 的右子树中所有结点的\
    \ key 值都大于 ti 的 key 值。\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1323_0.png)\n\
    \n## 二叉检索树的操做：\n\n- 遍历\n- 检索\n- 插入一个结点\n- 删除一个结点\n\n由于树是递归定义的，所以树的操作用递归算法十分简洁。\n\
    \n```\n设有说明部分:\ntypedef ... keytype ;\ntypedef ... datatype ;\ntypedef struct\
    \ tree {\n    keytype key ;\n    datatype data ;\n    struct tree *left ;\n  \
    \  struct tree *right ;\n}treetype;\ntypedef treetype * tree pointer ;\ntree pointer\
    \ root ;\n```\n\n## 遍历\n\n遍历二叉树是指按一定规律走遍树的每个结点，使每一结点被访问一次，而且只被访问一次。在访问一个结点时，可以做任何信息加工工作。下例打印结点的data域，并设该域为char型的。\n\
    \n遍历算法可分为前序，中序，后序遍历三种。\n\n- 前序遍历：对任意一个结点 ti 来讲，先访问及处理该结点的数据域；然后遍历左子树；最后遍历右子树。\n\
    - 中序遍历：对任意一个结点 ti 来讲，先遍历左子树；然后访问及处理该结点的数据域；最后遍历右子树。\n- 后序遍历：对任意一个结点 ti 来讲，先遍历左子树；然后遍历右子树；最后访问及处理该结点的数据域。\n\
    \n## 【例12-1】设有下图所示树,这是由表达式 (a+b/c)*(d-e*f) 生成的树，这棵树反映了表达式的结构，同时也反映了表达式的运算顺序。\n\
    \n- 前序遍历过程是：得到表达式的波兰表示式（运算符在两个运算分量前）。\n- 前序遍历算法是：\n\n```\nvoid preorder (treepointer\
    \ p) {\n    if ( p!=NULL ) {\n        printf(\"%c\", p-> data );\n        preorder(\
    \ p-> left );\n        preorder( p-> right )\n    }\n}\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1327_0.png)\n\
    \n* + a / b c - d * e f\n\n中序遍历过程是：\n得到表达式的原形式，只是没有括号。\n中序遍历算法是：\n\n```\nvoid\
    \ inorder (treepointer p) { /*中序遍历*/\n    if ( p!=NULL ) {\n        inorder( p->\
    \ left );\n        printf(\"%c\" , p-> data );\n        inorder( p-> right )\n\
    \    }\n}\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1328_0.png)\n\na +\
    \ b / c * d - e * f\n\n## 后序遍历过程是：\n\n得到表达式的表达式的逆波兰表示式（运算符在两个运算分量之后）。\n\n后序遍历算法是：\n\
    \n```\nvoid postorder (treepointer p){ /*后序遍历*/\n    if ( p!=NULL ) {\n      \
    \  postorder( p-> left );\n        postorder( p-> right )\n        printf(\"%c\"\
    \ , p-> data );\n    }\n}\n```\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1329_0.png)\n\
    \na b c / + d e f * - *\n\n## 检索\n\n检索是按给定关键字值 c 在树上找一个结点 ti，且 ti 的关键字值 key 恰好等于\
    \ c。若检索到，函数将带回相应结点指针；否则若没检索到，函数将带回 NULL。下述检索算法的前提条件是，p 是检索树。\n\n```\ntreepointer\
    \ search( typekey c , treepointer p ) {\n    if ( ( p-> key == c ) || ( p == NULL\
    \ ) )\n        return p ;\n    else if ( c < p-> key )\n        return search(\
    \ c , p-> left ) ;\n    else\n        return search( c , p-> right ) ;\n}\n```\n\
    \n1. 主函数中调用 search( 2 , root )\n形参 c: 2\n形参 p: 指向数据项5\nc<p->key  return search(c,\
    \ p->left)\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1331_0.png)\n\n2. 形参 c:\
    \ 2\n形参 p: 指向数据项 4\nc<p->key return search(c, p->left);\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1332_0.png)\n\
