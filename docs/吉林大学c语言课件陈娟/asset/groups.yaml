    # 采用自顶向下、逐步求精方法构造程序有如下优点：


    +   - 程序的层次分明、结构清晰。

    +   - 便于集体开发程序。对于大型程序来讲，可以每组负责一个模块（一个子部分），在一个组内又可以每个人负责一个子模块（更小的子部分）等等。而各个模块之间以及各个子模块之间相对独立，互相之间没有制约，各个模块的负责人员可以独立的进行程序设计。

