  - '[PAGE 1167]


    # 直接成员选择


    直接成员选择表达式针对一般的结构体变量。

    形式是：


    ```

    r.w

    ```


    r 是后缀表达式，最终计算出一个结构体变量；


    w 是 r 所属结构体类型中的一个成员名字


    下述成员选择表达式是合法的：


    ```

    zhang.name

    ```


    ```

    programming_pascal.author

    ```'
