    - 该结构必须用结构体类型描述，链表上一节的类型定义形式。\n\n1\n\n2\n\n3\n\nn\n\n...\n\n基本数据部分\n\n指针部分\n\n\
    一个数据项\n\n```\nstruct t {\n\n基本数据部分;\n\nstruct t *next ;\n}\n```\n\n类型定义形式\n\n\
    # 栈 — stack\n\n在第六章已经用数组实现过栈和队列，但是，数组有一定的局限性。如图可以用单向链表实现栈，指针变量top指向栈顶。栈的操作有：\n\
    \n- ① 初始化： stackintial\n- ② 压栈： stackpush\n- ③ 弹栈： stackpop\n\n设有声明：\n\n```\n\
    typedef ... items ;\ntypedef struct stackcell {\n    items data ;\n    struct\
    \ stackcell *predocessor ;\n} stackcelltype ;\ntypedef stackcelltype *pstacktype\
    \ ;\npstacktype top ;\n```\n\ntop:\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1211_0.png)\n\
    \n栈\n\n如下实现栈的操作：\n\n```\nvoid stackinitial(void) {\n    top = NULL ;\n}\nvoid\
    \ stackpush ( items x ) {\n    pstacktype  p ;\n    p = (pstacktype)malloc(sizeof(stackcelltype));\n\
    \    p->data = x ;\n    p->prodocessor = top ;\n    top = p ;\n}\nvoid stackpop\
    \ ( items *x ) {\n    pstacktype p ;\n    if ( top != NULL ) {\n        *x = top->data\
    \ ;\n        p = top ;\n        top = top->predecessor ;\n        free(p);\n \
    \   } else printf( \"栈下溢\\n\" );\n}\n```\n\n# 看一下这三个操作：\n\n- 1. 初始化后(调用stackinitail)得。\n\
    - 2. 调用一次 stackpush(1) 得。\n- 3. 再调用一次stackpush(2)得。\n- 4. 调用一次stackpop(&b)得。\n\
    \n![](img/2c9b154d61523ac3dc02daf316966b8e_1213_0.png)\n\n# 队列\n\n如图可用单向链表实现队列，现在要用两个指针变量，一个指向队头（front），一个指向队尾（rear）。队列的操作有\n\
    \n- ① 初始化（queueinitial）\n- ② 进队——排在队尾（inqueue）\n- ③ 出队——从队头删一项（outqueue）\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1214_0.png)\n\
    \n# 设有如下说明：\n\n```\ntypedef ... items ;\ntypedef struct queue {\n\titems data\n\
    \tstruct queue *next ;\n} queuetype ;\ntypedef queuetype *pqueuetype ;\npqueuetype\
    \ front,rear ;\n```\n\n操作：\n\n```\nvoid queueinitial(void) {\n\tfront = NULL ;\n\
    \trear = NULL ;\n}\n```\n\n```\nvoid inqueue (item x) {\n    pqueuetype p;\n \
    \   p = (pqueuetype)malloc(sizeof(queuetype));\n    p-> data = x ;\n    p-> next\
    \ = NULL ;\n    if ( rear==NULL ) {\n        rear = p ;\n        front = p ;\n\
    \    } else {\n        rear-> next = p ;\n        rear = p ;\n    }\n}\n```\n"
