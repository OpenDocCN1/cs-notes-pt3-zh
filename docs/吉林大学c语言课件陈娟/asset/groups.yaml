    - 第八章再论函数\n  - 进一步介绍函数，讲述参数、递归程序设计\n- 第九章程序开发和结构化程序设计\n  - 程序风格、自顶向下逐步求精的程序设计技术、程序的文档，以及穷举法和试探法；\n\
