  - '[PAGE 774]


    # 作用域


    +   - 作用域

    +     - 是程序中声明的标识符有定义的区域。

    +     - 在一个标识符的作用域内，使用它是合法的；

    +     - 且所使用的就是相应声明的标识符。


    +   - 作用域是一个静态概念

    +     - 描述从程序静态行文上看，程序中一个被声明的标识符起作用的范围（一段程序行文）

    +     - 本节所涉及的内容都是从程序的静态行文上看'
  - '[PAGE 775]


    # 声明点


    +   - C 程序中出现的每一个标识符都有一个声明点，

    +   - 标识符的声明点就是“包含相应标识符词法记号的声明符的结尾处”。


    ```

    int x      /* 此处为x的声明点 */

    int u[10][20] /* 此处为u的声明点 */;

    ```


    # 作用域规则


    +   - 每个声明点都有作为程序正文的一部分的一个区域，称为声明的作用域。

    +   - 声明的作用域是“相应声明有效的程序文本区域”，下表列出各种C标识符的作用域'
  - '[PAGE 776]


    # C 标识符作用域


    | 类别 | 声明的作用域 |

    | --- | --- |

    | 顶层标识符 | 从声明点到本源程序编译单位文本结束 |

    | 函数定义中的形参 | 从声明点到函数体结束 |

    | 函数原型中的形参 | 从声明点到函数原型结束 |

    | 复合语句中声明的标识符 | 从复合语句中声明点到复合语句结束 |

    | 语句标号 | 相应标号声明所在的整个函数体 |

    | 预处理器的宏 | 从相应宏定义的#define命令到本源程序编译单位文本结束，或第一个取消相应宏定义的#undef命令 |'
