    \n- 函数的名称\n- 每个形式参数的名称、作用、特性、及其对实在参数的要求\n- 编写和调试人员的姓名\n- 版本编号\n- 完成时间或最后一次修改时间\n\
    - 该函数功能，用到的主要算法\n- 该函数产生的结果、及该结果对主程序的影响\n- 使用注意事项\n\n… …\n\n- 可以对一个程序段、一个语句、一个声明等加注释，以注明某程序段的功能、一个语句的作用、一个常量或变量的意义等。\n\
    \n- 当修改有注释的程序时，若程序内容被修改，则相应的注释也必须作修改。错误的注释往往比没有注释效果更坏。\n\n## 对程序说明的建议\n\n- 程序中使用的全部常量都要引入一个常量标识符，在程序中不应该出现除了0、1等极其简单的常量以外的其它字面常量。并且常量应该是全程的。在程序一开始用宏定义把本程序中用的全部常量定义，并加注释标明每个常量的意义、使用位置等。而在每个函数中一般不应该再包含常量定义。\n\
    \n- 大多数情况下，**类型名**也应该是全程的。但是，对类型的要求要比对常量宽，也可以把类型说明成局部的。\n\n- 应该按照作用和用途来选择**变量**的说明位置，并且应该尽量把变量说明成局部的。\n\
    \n- **函数**一般应该只访问它的形式参数和局部量。如果必须访问全局量，应该加必要的注释。\n\n## 错误种类\n\n一个程序没有产生正确的结果，可能存在有各式各样的原因。这些错误可大致分成如下三类：\n\
    \n- 语法错误\n\n- 写出的程序不符合C语言的语法，称有语法错误。比如标识符未说明、语句结构不对、标识符重复说明、... 等等。\n\n- 避免这类错误的一个根本办法是精确掌握C语言的严格语法定义（BNF表示式），严格的按语法写程序\n\
    \n## 语义错误\n\n- 解释程序语义时发现的错误称语义错误。比如：以零作除数、运算分量类型不匹配、死循环、形式参数与实在参数不匹配、变量没赋值之前就使用其值...\
    \ 等等。\n\n- 这类错误中的一部分可由编译程序查出来，有一部分错误编译程序检查不出来。\n\n## 逻辑错误\n\n- 逻辑错误是程序没有真实反映算法、或算法本身就有错误没有反映所求的问题。例如：错误的应用全局量、错写运算符、...\
    \ 等等。\n\n- 这类错误是最大量出现也是最难对付的。程序的调试和查错主要是查这\n\n## 程序测试和验证\n\n- 语义错误的一部分以及逻辑错误都要靠本节介绍的方法来排除。计算机程序在投入使用之前，一定要保证它正确。看程序是否正确有两条途径：\n\
    - 证明 —— 若能证明一个程序正确，是最理想的。目前在软件领域内有一个研究分支“程序正确性证明”，专门研究程序正确性证明的理论和方法。不过这已超出本课的范围，我们不涉及它。\n\
    - 测试 —— 给定一切可能的数据运行程序，看结果是否正确，若结果正确，则说明相应程序是正确的\n\n给出一切可能的数据运行程序，事实上是不可能的。有效并实用的方法是：选取若干组有代表性的数据进行测试。这些数据的组合，能代表整个数据的全貌。\n\
    \n所谓有代表性的若干组数据，大致应考虑如下情况：\n- 正确的数据，应能得到正确的结果；\n- 错误的数据，应能报告数据出错，或得到错误结果；\n- 边界上的数据，也能按数据特性，取得合理的结果。\n\
    \n若从程序逻辑上看，选取的数据组应能遍历程序的一切分支和循环。应能达到PAD图最右端的一切可执行框。\n\n不论验证还是测试，只能发现错误，不能证明或说明程序正确没有错误。\n\
    \n- 自顶向下的方法是从程序的最顶层开始，先假设底层模块正确，调试顶层的整体逻辑，使之正确；然后下到低一层次的各模块，再假设更低层次中的模块正确，调试本层各模块，每一模块都保证达到其上层的要求；然后再调试更底一层的模块；…如此等等。直到最底层的每个模块都调试正确为止。\n\
    \n- 自顶向下方法可以有效的定位错误，不致因为底层错误而影响整个程序逻辑，比较合理。而且这种方法与算法分析及程序设计时采用的自顶向下、逐步求精技术有紧密的对应关系。所以应该使用这种方法来调试程序。\n\
    \n- 当然这不是绝对的，事实上经常使用的也比较有效的手段是两种方法互相结合。\n\n## 可移植性\n\n- 如果一个程序在任何计算机上以及在任何编译系统中都能运行，则说这个程序是可移植的。\n\
    - 如果有可能应该尽量使用不依赖于具体计算机和具体编译系统的方式写程序。\n- 不幸的是标准C中有若干处“由实现定义的”和“依赖于实现的”地方；\n  -\
    \ 各个编译系统也在不同程度上对C进行了扩充；\n  - 有些编译系统又在不同程度上对标准C进行了一些限制。\n\n## 为了使程序具有可移植性，建议编程时注意以下诸点（但它们并不能完全保证可移植性）：\n\
    \n- 尽量避免“依赖于实现的”和“由实现定义的”部分造成的影响；\n\n- 不要依赖字符集合的各种性质，可靠的特性只有 ‘a’<'b'< ... <'z'\
    \ 和 ‘0’<'1'< ... <'9'；\n\n- 不论何时输出整数和浮点类型值时，一定包括宽度和精度参数；\n\n- 不要为浮点类型计算假设不现实的精度；\n\
    \n- 尽量不使用具体编译系统对标准C进行的扩充部分；\n\n- 同样尽量不使用那些可能被某编译系统限制的部分；\n\n- 用文件仔细说明程序中可能依赖于机器的部分。\n\
    \n## 文档\n\n程序文档详细记录程序的一切资料。按照我国国家标准，软件产品文档应包括：\n\n- 可行性报告：一般应该在项目开始前，进行可行性论证时提出。\n\
    - 开发计划：一般应该在项目开始实施前，做工作计划时提出。\n- 需求说明书：一般应该在项目刚开始进行，做需求分析后提出。\n\n- 数据要求说明书：给出本系统对数据的要求。\n\
    - 概要设计说明书：给出本系统的总体设计。\n- 详细设计说明书：给出本系统的详细设计说明，包括每个程序的功能、输入输出、算法、流程逻辑（流程图、 PAD\
    \ 图等）、... 等。\n- 数据设计说明：给出本系统使用的数据结构。\n- 用户手册：包括本系统的功能、支撑环境、支持软件、安装及初始化、使用方法步骤、输入输出数据说明、操作说明、出错处理、...\
    \ 等。\n- 操作手册：包括本系统的运行说明、操作说明、操作步骤等。\n\n- 模块开发卷宗：每个模块的标题、功能说明、设计说明、测试说明等。\n- 测试计划：包括测试内容、测试条件、测试数据、应得结果等。\n\
    - 测试分析报告：包括测试概要、测试结果、测试结论等。\n- 总结报告。\n\n文档是操作人员的“指南”，维护人员的“参考手册”，必须严格正确，当修改程序时，必须随着修改相应文档。一个与程序不匹配的文档比没有文档更坏。\n\
    \n编程并不难，只要有算法，会程序设计语言，任何人都可以编出程序，但是不同人编出的程序却大不相同。针对同一个问题：\n\n- 有人编的程序风格好、易读、易维护、易重用、可靠性高、运行得既快又节省存储空间；\n\
    - 有人编的程序风格差、晦涩难懂、难于维护、冗长、正确性和可靠性极低、运行起来既慢又占用空间。\n\n## 编程易，编好程序难\n\n- 要想编出一个风格优美、正确可靠、各方面均优秀的好程序，必须按照现代软件工程的规范进行\n\
    - 同时也必须遵循好的程序设计原则和使用好的程序设计方法。\n- 本章介绍程序开发、结构化程序设计。\n"
