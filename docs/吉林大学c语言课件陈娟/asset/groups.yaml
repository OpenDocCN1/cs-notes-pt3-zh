    # 求两数最大公因数


    +   编程器，输入两个正整数u 、v ，用欧几里德辗转相除法求它们的的最大公因数并输出


    +   欧几里德辗转相除法


    +   - u % v → R₁

    +   - v % R₁ → R₂

    +   - R₁ % R₂ → R₃

    +   - R₂ % R₃ → R₄

    +   - … … …

    +   - R_{n-1} % R_n → R_{n+1}=0

    +   - R_n 为正整数u 、v的最大公因数'
