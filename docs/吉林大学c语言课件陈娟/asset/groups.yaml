    # 八皇后 试探法


    +   - 按规律，从一满足条件的初始状态出发，逐步生成满足条件的子排列，不断增加子排列长度。

    +   - 增加子排列长度过程中，每增加一位，生成一个子排列后，便检验它是否满足条件。

    +     - 不满足条件，则换一个子排列—即修改当前位置

    +     - 满足条件，则延长子排列，增加子排列长度。

    +   - 子排列的长度满足要求长度，便找到一个解。

    +   - 若要求找一个解即可，这时便可以结束。

    +   - 若要求找所有解，这时可以输出或记录本解，然后按前述思路，继续修改排列，继续试探，找下个解'
