  mdcn: "\n• 随机文件的特点是：对文件的操作是随机的\n\n• 在同一时刻，即可以向文件中写，也可以从文件中读（文件没有读写模式之分）。\n\n• 读写操作可以针对文件中的任意成分进行。\n\
    \n• 例如\n  - 第一次读了第100个成分\n  - 然后再读第3个成分\n  - 然后再用一个新的数据修改第50个成分\n  - 将其写入第50个成分中\n\
    \  - 然后又读第200个成分..., 等等。\n  - 这是允许的，并且是正确的。\n\n## 普通文件和设备文件\n\n- 普通文件是指驻留在磁盘或其它外部介质上的一个有序数据集，可以是源程序文件、目标程序文件、可执行程序文件；也可以是一组待输入处理的原始数据，或者是一组输出的结果。\n\
    - 设备文件是指与主机相联的各种外部设备，如显示器、打印机、键盘等。\n- 在操作系统中，把外部设备也作为文件来进行管理，把它们的输入、输出等同于对磁盘文件的读和写。通常显示器定义为标准输出文件，键盘是标准输入文件\n\
    \n## ASCII文件和二进制文件\n\nASCII文件就是ASCII码文件，也称为文本文件、TEXT文件。这种文件每个字符对应一个字节，用于存放相应字符的ASCII码，也就是存放字符的存储形态的编码。\n\
    \n字符1、2、3、4的ASCII码分别为49、50、51、52（十六进制的31、32、33、34），字符串“1234”的存储形式为：\n\n![](img/2c9b154d61523ac3dc02daf316966b8e_1104_0.png)\n\
    \n共占用4个字节。ASCII文件可以在屏幕上按字符显示，例如源程序文件就是ASCII文件，用DOS命令TYPE可以显示文件的内容。由于是按字符显示，因此能读懂文件内容。\n\
    \n- 二进制文件就是二进制码文件，它把数据按二进制编码方式存放到文件中。例如，数1234的存储形式为：\n  \n  0000010011010010\n\
    \  \n  只占二个字节。\n\n- 用TYPE命令显示二进制文件是无意义的，其内容无法读懂。\n\n## 流式文件\n\n- C系统的文件操作，不区分文件类别。不论顺序文件还是随机文件、普通文件还是设备文件、ASCII文件还是二进制文件。\n\
    - C把文件一律都看成是“字节流”，以字节（每个字节可能是一个字符，也可能是一个二进制代码）为单位进行操作处理。\n- 对字节流的操作；输入输出的开始和结束都由程序控制，不受物理符号(如回车符)的影响。把这种文件操作方式称作“流式文件”。\n\
    \n## 文件指针\n\n- C 系统为了处理文件，为每个文件在内存中开辟一个区域，用来存放文件的有关信息，如文件名、文件状态以及文件当前位置等。\n- 这个区域被作成一个称为\
    \ FILE 类型的结构体。FILE 的类型由系统定义，保存在头文件 stdio.h 中，它的具体结构我们暂时不用关心。\n- C 程序中用指向 FILE\
    \ 类型变量的指针变量(简称“文件指针”)来标识具体文件。变量声明\n  \n  FILE *fp ;\n\n- 声明了一个文件指针变量 fp，以后 fp\
    \ 可以用来标识具体文件。\n\n## 标记\n\nC文件是一个流式文件，在该字节流上有一个隐含的暗标记，该标记总是指向文件中正要操作的字节，即下一个字节，称该标记为文件读写位置指针。\n\
    \n例如：\n\n> □□□ ... □ ...  指向文件首，即指向第一个字节\n> ↑\n> □□□ ... □ ...  指向第四个字节；\n> ↑\n\
    > □□□ ... □□ .  指向文件尾；\n> ↑\n\n## 几个常量\n\nC系统引进几个常量标志文件处理状态。最常用的是 **EOF** 和 **NULL**，它们是\
    \ `stdio.h` 中预定义的常量。\n\n- **EOF**：值为 “-1”\n  - 习惯上表示文件结束，或文件操作出错；\n- **NULL**：值为\
    \ “0”\n  - 习惯上表示打开文件失败等。\n\n## 文件操作\n\n- C没有文件操作语句，C文件操作全部通过系统定义的库函数来实现。\n- “库函数”是指系统已经定义好的，存放在“函数库”文件内的，可以被用户直接调用的函数。这些库函数根据其功能的不同，存放在不同的函数库中。\n\
    - 库函数本身并不属于语言，它是系统根据需要提供给用户使用的函数。C标准定义了常用的函数库和每个函数库中常用的库函数。但是不同的编译系统提供的函数库不同，不同编译系统在每个函数库中提供的库函数也不同。为了提高程序的可移植性，用户应该只使用C标准定义的函数库和库函数。\n\
    \n- 对应每个函数库，有一个头文件，在头文件中包含相应函数库中所有函数的函数原型。用户使用库函数时，需要把相应的头文件用 `#include` 命令插入到自己的程序文件中。\n\
    - 文件操作函数库的头文件是 **“stdio.h”**，在用户程序中只要涉及文件操作，即只要涉及输入输出就应该把该文件包括入程序中，使用的程序行是：\n\n\
    ```\n#include \"stdio.h\"\n```\n\n- 这就是为什么前述各个章节的程序都含有这一行的原因。\n\n任何高级语言，对文件操作都应该遵循：\n\
    打开文件 → 操作文件 → 关闭文件\n这样的过程。\n下面就遵循这个规则对文件的操作进行说明\n\n## 打开文件\n\n- 函数原型\n  `FILE*\
    \ fopen ( const char* filename, const char* mode );`\n- 调用方式\n  `fp = fopen( filename\
    \ , mode );`\n- **filename** 是一个字符串，具体给出要打开的文件的文件名；\n- **mode** 也是一个字符串，具体给出文件的打开模式，表12-1列出各种打开模式；\n\
    - **fp** 是文件指针变量，以后程序中使用该指针变量标识由文件名给出的文件。\n\nfopen 根据 mode 指定的模式，打开由 filename\
    \ 指定的文件。\n\n返回值 = { 指向文件 filename 的文件指针   操作成功\nNULL   出错 }\n\n例如：\n\n```\nfp\
    \ = fopen( \"c:\\user\\file.txt\" , \"r\" );\n```\n\n以“只读”方式，打开 c 盘 user 节点下的\
    \ file.txt 文件。如果成功则 fp 就是文件 file.txt 的文件指针变量，并且只允许对文件进行读操作；否则 fp 的值是 NULL。\n\n\
    ## 下表给出文件打开模式 mode 及其含义。\n\n| 序号 | mode | 含义 |\n| --- | --- | --- |\n| 1 | “r”\
    \ | 以只读方式打开一个ASCII文件 |\n| 2 | “w” | 以只写方式打开或新建一个ASCII文件，原有文件内容全部删除 |\n| 3 | “a”\
    \ | 同 “w”，但是不删除原有文件内容 |\n| 4 | “r+” | 以可读可写方式打开一个ASCII文件 |\n| 5 | “w+” | 以可读可写方式打开或新建一个ASCII文件，原有文件内容全部删除\
    \ |\n| 6 | “a+” | 同 “w+”，但是不删除原有文件内容 |\n| 7 | \"rb\" | 以只读方式打开一个二进制文件 |\n| 8 |\
    \ \"wb\" | 以只写方式打开或新建一个二进制文件，原有文件内容全部删除 |\n| 9 | \"ab\" | 同 \"wb\"，但是不删除原有文件内容\
    \ |\n| 10 | \"rb+\" | 以可读可写方式打开一个二进制文件 |\n| 11 | \"wb+\" | 以可读可写方式打开或新建一个二进制文件，原有文件内容全部删除\
    \ |\n| 12 | \"ab+\" | 同 \"wb+\"，但是不删除原有文件内容 |\n\n## 关闭文件\n\n- 函数原型\n  `int fclose(\
    \ FILE * stream );`\n- 调用方式\n  `fclose( fp );`\n\n返回值 = { 0 操作成功\nEOF 出错 }\n\n\
    ## 写字符\n\n- 函数原型\n  `int fputc( int ch, FILE * fp );`\n- 功能\n  把字符ch写入fp指向的文件，同时将读写位置指针向前移动1个字节。\n\
    \n返回值 = { 所写字符的ASCII码   操作成功\n  EOF                     出错 }\n\n## 读字符串\n\n函数原型：\n\
    \n```\nchar *fgets( char *str, int num, FILE * fpointer );\n```\n\n| 返回值 = { |\
    \ str所指的字符数组首地址 | 操作成功 |\n| | NULL | 否则 |\n\n- 字符串的自然结束符是 “换行符” 和 “文件结束符”。\n-\
