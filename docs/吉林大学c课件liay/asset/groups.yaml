    # 传统的错误处理方式：


    +   1 遇到错误，终止运行，低级粗暴

    +   2 遇到错误，返回给上层函数一个错误值，程序规模加倍，同时将正常逻辑与错误处理的逻辑混在一起，错误处理程序将子程序的正常逻辑淹没。

    +   3 遇到错误，改变全局错误变量的值，并函数返回，破坏了程序结构

    +   4 遇到错误，调用事先设计好的下层错误处理函数，可惜错误往往不是自己所能解决的了的！'
