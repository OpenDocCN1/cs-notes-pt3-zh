  md: "\n## 9. 引入虚函数支持多态\n\n```\nclass Automobile{\npublic:\n//...\nvirtual void Run(){\n\
    \    cout<< \"机械变速\" <<endl;\n}\n};\n\nclass Car:public Automobile{\npublic:\n\
    //...\nvirtual void Run(){\n    cout<< \"自动变速\" <<endl;\n}\n};\n```\n\n```\nvoid\
