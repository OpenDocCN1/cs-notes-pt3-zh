  md: "\n## 多继承的构造顺序：\n\n- （1）任何虚拟基类的构造函数按照他们被继承的顺序构造\n- （2）任何非虚拟基类的构造函数按照他们被继承的顺序构造\n\
    - （3）任何成员对象的构造函数按照他们被声明的顺序构造\n- （4）类自己的构造函数\n\n## 多重继承\n\n虚拟继承和虚函数(多态、抽象类)没有关系\n\
    \n多重继承使用起来困难\n\n实际问题基本可以避免多重继承\n\n## 多态(Polymorphism)\n\n| 对象 a 的操作 | 改为操作对象 b\
    \ |\n|---------------|---------------|\n| Student a, b; | Student a, b; |\n| FuncA(a);\
    \ | FuncA( b ); |\n| FuncB(a); | FuncB( b ); |\n| ……； | ……； |\n| ……； | ……； |\n\
    | FuncAX(a); | FuncAX( b ); |\n\n## 1. 对象的管理者（2）\n\n| 对象 a 的操作 | 改为操作对象 b |\n\
    |---|---|\n| Student a, b; | Student a, b; |\n| Student * p; <br> p = &a; | Student\
    \ * p; <br> p = &b; |\n| FuncA(*p); <br> FuncB(*p); <br> ... ...; <br> ... ...;\
    \ <br> FuncAX(*p); | FuncA(*p); <br> FuncB(*p); <br> ... ...; <br> ... ...; <br>\
