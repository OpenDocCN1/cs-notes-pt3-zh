    # 为对象申请动态空间：


    Malloc 和对应的free函数不能调用构造函数和析构函数，这破坏了：空间分配、初始化的功能。所以引入了new和delete。


    因为空间不确定才使用堆空间；是大多数情况


    函数内部的申请空间要及时释放，否则容易造成内存重复申请和内存迷失；'
