  md: "\n# C++程序设计\n\n吉林大学 软件学院\n\n- 教师邮箱： liay@jlu.edu.cn\n- 参考书：\n  C++程序设计教程 钱能\n\
    \  清华大学出版社 第2版\n- 课堂纪律：\n- 上机：\n\n## 第一章：概述\n\n- 1-1 培养目标\n- 理解和掌握c++语言的基本语义和语法，初步理解面向对象的思想，初步掌握面向对象的程序设计方法。\n\
    - 提高编程能力和调试程序的能力，为后面的学习打好基础。\n\n### 1-2 C语言与C++语言\n\n#### C语言回顾：\n\n1972年 bell实验室研制\n\
    \n#### C语言特点：\n\n- 高度灵活性、实现上的高效性（比FORTRAN）\n- 简捷和高效 （比Pascal）\n\n#### C语言局限：\n\
    \n程序达到一定规模时，模块之间的协调性存在问题，程序的重用性也存在问题，程序员难以控制程序的复杂性。\n\n#### C++产生：\n\n- 1980年\
    \ 贝尔实验室 Bjarne Stroustrup 对C 改进与扩充\n- 最初称为“带类的C”， （c with classes）.\n- 1983年正式命名为C++\n\
    - 3次修订后\n- 1994 年制定了 ANSI c++草案\n- 1998年11月，ISO标准被批准。\n\n- C++是C的改进与扩充\n- C++包括C的全部属性、特征、优点，是在C的基础上的改进与扩充\n\
    - C++是C语言改进的基础上，添加了对面向对象程序设计部分的支持\n- C++包括过程性语言和类部分\n- C++是C的超集，C是C++的子集\n- C++是混合型语言，即是过程型的，又是面向对象型的\n\
    \n## 1-3 面向过程的程序设计\n\n“面向过程”是一种以事件为中心的编程思想。\n\n就是分析出解决问题所需要的步骤，然后用函数把这些步骤一步一步实现，使用的时候一个一个依次调用就可以了。\n\
    \n## 1-4 面向对象程序设计的基本特征\n\n- 1. 对象\n\n一个对象是客观世界的一个实体\n\n数据与数据处理过程作为一个整体——对象\n\n\
    C++采用“类”来支持对象，同类对象抽象出其共性，形成类，类封装了数据与处理数据的过程（函数）\n\n## 1-5：举例比较面向对象和面向过程 程序设计\n\
    \n- 例如五子棋，\n- 面向过程的设计思路就是首先分析问题的步骤：\n\n1、开始游戏，\n2、黑子先走，\n3、绘制画面，\n4、判断输赢，\n5、轮到白子，\n\
    6、绘制画面，\n7、判断输赢，\n8、返回步骤2，\n9、输出最后结果。\n\n而面向对象的设计则是从另外的思路来解决问题。整个五子棋可以分为：\n\n\
    1、黑白双方，这两方的行为是一模一样的，\n2、棋盘系统，负责绘制画面，\n3、规则系统，负责判定诸如犯规、输赢等。\n\n第一类对象（玩家对象）负责接受用户输入，并告知第二类对象（棋盘对象）棋子布局的变化，同时利用第三类对象（规则系统）来对棋局进行判定。\n\
    \n- 把上面每个步骤用分别的函数来实现，问题就解决了\n\n## 面向过程和面向对象不是对立的\n\n## 面向过程和面向对象将长期并存\n\n从程序机构上，c++的单一程序体本质上是基于过程的，因为运行程序时，总是启动过程。\n\
    \n## 1-6 C++的程序结构\n\n```\n/* this is\na simple c++ program*/\n#include <iostream>\n\
    using namespace std;\n// #include <iostream.h>\nint main()\n{\n    int a,b,result;\n\
    \    cout <<\"please input two numbers:\\n\";\n    cin>>a>>b;\n    result=3*a-2*b+1;\n\
    \    cout<<\"result is \"<<result<<endl;\n    return 0;\n}\n```\n\n- 1. 预处理命令：\n\
    \  宏定义命令、文件包含命令和条件编译命令\n- 2. 输入和输出：\n- 3. 函数：\n- 4. 语句： 是组成程序的基本单元。以分号结束。\n- 5.\
    \ 变量：\n- 6. 其他： 如符号常量和注释信息。\n  C++中尽量把常量定义为符号常量\n  #define PI 3.1415\n  const\
    \ double PI=3.1415;\n\n## 1-7 C++程序的实现\n\n编辑、编译、运行\n\n- 1. 编辑：将编写好的C++源程序输入到计算机中，生成磁盘文件的过程。磁盘文件的文件名要用扩展名.cpp。\n\
    \n- 2. 编译：C++程序的实现必须使用某种C++语言的编译器对程序进行编译。功能是：将程序的源代码转换成为机器代码的形式，称为目标代码（.obj），然后，再使目标代码进行连接，生成可执行文件（.exe）。\n\
    \n编译过程可分为三个子过程：预处理过程、编译过程、连接过程\n\n（1）预处理过程：执行预处理命令\n\n（2）编译过程：\n进行词法分析和语法分析的过程，又称源程序分析的过程。\n\
    \n符号表：又称字典。映射程序中的各种符号以及其他们的属性。是在进行词法分析和语法分析是生成的，在生成中间代码和可执行的机器代码时使用。\n\n错误处理程序：\n\
    \n生成目标代码：.OBJ为扩展名的磁盘文件，机器可识别文件内容，却不能执行。\n\n（3）连接过程：编译器对每个源文件单独进行编译，多个源程序的目标代码以及库文件(.Lib)连接在一起，才能形成可执行文件(.exe)。由连接器完成。\n\
    \n3.运行：\n\n- 上机环境：\n  Visual c++ 6.0\n  Visual studio 2010\n\n## 第二章 函数\n\n- 一个C++程序有一个主函数，主函数是程序执行的开始点。\n\
    - C++ 不允许函数定义嵌套。\n- 函数有两种：标准库函数和用户自定义函数。\n\n### 2-1 内联函数\n\n内联函数也称内嵌或内置函数，它的语法格式与普通函数一样，只是在函数原型或函数定义标题头之前加上关键字\
    \ inline。\n\n```\ninline int isnumber(char);\ninline int isnumber(char ch)\n{\n\
    \    return(ch>='0' && ch<='9')?1:0;\n}\n```\n\n编译器为内联函数创建一段源代码，每遇到一次该函数的调用都用相应的一段代码来代替。\n\
    \n内联函数主要是解决运行效率的问题。使用内联函数可以省去函数调用所需的建立栈内存环境，进行参数传递，产生程序转移的时间开销\n\n内联函数应是使用频率高，代码却很短的函数。\n\
    \n内联函数必须在调用之前声明或定义。\n\n```\n#include <iostream>\nusing namespace std;\ninline\
    \ int isnumber(char);  // int isnumber(char);(则正常函数调用)\nint main(){\n    char\
    \ c;\n    while (cin>>c && c!='\\n')\n    {\n        if (isnumber(c ))\n     \
    \       cout<<\"you entered a digit\\n\";\n        else\n            cout<<\"\
    you entered a non-digit\\n\";\n    }\n    return 0;\n}\nint isnumber(char ch)\
    \ //inline int isnumber(char ch)\n{    return(ch>='0' && ch<='9')?1:0;    }\n\
    ```\n\n此处inline可省略\n\n- 内联函数的函数体限制：\n  内联函数中，不能含有switch和while。\n  递归函数不能用来做内联函数。\n\
    \  内联函数中不能说明数组。\n  否则，按普通函数调用那样产生调用代码。\n  （内联函数是建议性，不是指令性）\n- 内联函数只适合于1-5行的小函数\n\
    - 类结构中所有在类内部定义的函数，都是内联函数。\n\n### 2-2 重载函数\n\n```cpp\nint abs(int);\nlong l_abs(long);\n\
    double d_abs(double);\n```\n\n**重载函数：**\n\n```cpp\nint abs(int);\nlong abs(long);\n\
    double abs(double);\n```\n\nC++用一种函数名技术可准确的判断出应使用那一个函数。\n\n```cpp\nabs(-10); \
    \      //调用int abs(int);\nabs(-1000000);  //调用long abs(long);\nabs(12.3);    \
    \  //调用double abs(double);\n```\n"
