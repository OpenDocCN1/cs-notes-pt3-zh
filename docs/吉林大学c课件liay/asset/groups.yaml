    \n根据一个流类定义的对象也时常被称为流，每一个流类对象称为一个数据流，在内存中为每一个数据流开辟一个内存缓冲区，用来存放流中的数据。\n\n凡是数据从一个地方传输到另一个地方的操作都是流的操作。因此一般意义下的读操作（输入）在流数据抽象中被称为（从流中）提取，写操作（输出）被称为（向流中）插入。\n\
    \nC++语言系统为实现数据的输入和输出定义了一个庞大的类库，它包括的类主要有：\n\n- `ios`：抽象基类\n- `iostream`：输入流类 `istream`，输出流类\
    \ `ostream`，输入输出流类 `iostream`\n- `fstream`：输入文件流类 `ifstream`，输出文件流类 `ofstream`，输入输出文件流类\
    \ `fstream`\n- `strstream`：输入字符串流类 `istrstream`，输出字符串流类 `ostrstream`，输入输出字符串流类\
    \ `strstream`\n\n## ios类的派生关系\n\n```text\nios\nistream\nfstreambase\nstrstreambase\n\
    ostream\nifstream\nistrstream\nofstream\nostrstream\niostream\nfstream\nstrstream\n\
    istream_withassign\niostream_withassign\nostream_withassign\n```\n\n## 标准I/O\n\
    \nC++不仅定义有现成的I/O类库供用户使用，而且还为了用户进行标准I/O操作，在 `iostream`（输入、输出类的头文件）中定义了四个全局对象，它们分别是\
    \ `cin`、`cout`、`cerr` 和 `clog`。\n\n```cpp\nostream cout;  // 标准输出流，默认屏幕，可以重定向\n\
    istream cin;   // 标准输入流，默认键盘\nostream cerr;  // 标准错误流，默认屏幕，不能重定向，不经过缓冲区\nostream\
    \ clog;  // 标准错误流，默认屏幕（与 cerr 唯一区别就是经过缓冲区）\n```\n\nC++ 为 `cout` 流对象开辟一个缓冲区：\n\n\
    ```cpp\ncout << \"c++\" << 10 << 2.5 << endl;\nostream &operator<<(ostream &out,\
    \ char *p);\nostream &operator<<(ostream &out, int p);\nostream &operator<<(ostream\
