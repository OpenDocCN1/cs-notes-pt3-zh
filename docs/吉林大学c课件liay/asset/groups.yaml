    \ Student{\n    int n3;\npublic: int n1;\nvoid y(){m1=1,m2=2,n1=1,n2=2,n3=3;}\n\
    protected:  int n2;\n};\nvoid f(Student &a){}\nvoid main()\n{\n    Master a;\n\
    \    a.x();\n    f(a);\n    Student *p=&a;\n}\n```\n\n> protected继承和private继承得到的类都不是子类\n\
    > \n> “凡是父类对象可以出现的地方，可以用子类对象代替”，不再适用"
