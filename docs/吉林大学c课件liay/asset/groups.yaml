    ### 公共成员（公共接口、对外接口）\n\n需要让外界调用的成员函数指定为公共的，外界通过公共的函数来实现对数据的操作。\n\n外界与类的唯一联系就是调用公共的成员函数。\n\
    \n在类外不能访问私有数据成员，但是可以通过公共成员函数来修改私有数据成员的值。\n\n```cpp\n//point.h\nclass point{\n\
    public:  //外部接口\n    void Set(double ix,double iy);\n    double xOffset();\n \
    \   double yOffset();\n    double angle();\n    double radius();\nprotected: \
    \ //内部数据\n    double x;\n    double y;\n    // double a;\n    // double r;\n};\n\
    ```\n\n```cpp\n//point.cpp（类的内部实现）\n#include \"point.h\"\n#include <math.h>\n\
    void point::Set(double ix,double iy)\n{ x=ix;y=iy; }\ndouble point::xOffset()\n\
    { return x; }\ndouble point::yOffset()\n{ return y; }\ndouble point::angle() //计算极坐标\n\
    { return\n(180/3.14159)*atan2(y,x); }\ndouble point::radius()\n//取极坐标半径\n{ return\
    \ sqrt(x*x+y*y); }\n```\n\n保护成员不是外部接口部分，但为了类定义的整体描述，只好把它放在头文件中。对于面向对象程序设计之严格的内外界面描述来说，是C++类机制中尴尬奈何的一面。但它不妨碍类的外部接口的有效性。\n\
    \n### class point\n\n- xOffset\n- yOffset\n- Set\n- angle\n- radius\n\n外部成员函数\n\
    \n![](img/2a27c9e9d8641bba50c8f3e0109e4e84_100_0.png)\n\n内部数据成员\n\n### 屏蔽类的内部实现\n\
    \n```cpp\n//Point.h （公用接口）\nclass Point{\npublic:\n    void Set(double ix,double\
    \ iy);\n    double xOffset();\n    double yOffset();\n    double angle();\n  \
    \  double radius();\nprotected:\n    double x;\n    double y;\n    // double a;\n\
    \    // double r;\n};\n```\n\n```cpp\n//Point.cpp\n#include \"Point.h\"\n#include\
    \ <math.h>\n\nvoid Point::Set(double ix,double iy)\n{ x=ix;y=iy; }\n\ndouble Point::xOffset()\n\
    { return x; }\n\ndouble Point::yOffset()\n{ return y; }\n\ndouble Point::angle()\
    \ //计算极坐标\n{ return (180/3.14159)*atan2(y,x); }\n\ndouble Point::radius() //取极坐标半径\n\
    { return sqrt(x*x+y*y); }\n```\n\n```cpp\n//main.cpp\n#include \"Point.h\"\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{Point p;\n    double x,y;\n \
    \   for(;;)\n    { cout<<\"Enter x and y:\\n\";\n        cin>>x>>y;\n        if(x<0)\
    \ break;\n        p.Set(x,y);\n        cout<<\"angle=\"<<p.angle()<<\" \"\n  \
    \          <<\"radius=\"<<p.radius()<<\" \"\n            <<\"xOffset=\"<<p.xOffset()<<\"\
    \ \"\n            <<\"yOffset=\"<<p.yOffset()<<\" \"\n            <<endl;\n  \
    \  } }\n```\n\n```cpp\n//Point.h\nclass Point{\npublic:\nvoid Set(double ix,double\
    \ iy);\ndouble xOffset();\ndouble yOffset();\ndouble angle();\ndouble radius();\n\
    protected:\n//double x;\n//double y;\ndouble a;\ndouble r;\n};\n```\n\n```cpp\n\
    //Point.cpp (私有实现)\n#include \"Point.h\"\n#include <math.h>\nvoid Point::Set(double\
    \ ix,double iy)\n{ a=atan2(ix,iy);\n r=sqrt(ix*ix+iy*iy); }\ndouble Point::xOffset()\n\
    { return r*cos(a); }\ndouble Point::yOffset()\n{ return r*sin(a); }\ndouble Point::angle()\n\
    { return (180/3.14159)*a; }\ndouble Point::radius()\n{ return r; }\n```\n\n结论：类很好地屏蔽了内部数据表示，所以由类负责的内部实现上的维护不影响程序的开发，这大大减轻了开发应用程序的强度。\n\
    \n## 10.作用域\n\n### (1) 变量的作用域——{} 内或其后的全部内容\n\n```cpp\nint a = 1;\nmain(){\nvoid\
    \ f();\ncout<<a;\nint a = 2;\ncout<<a;\n{int a =3;cout<<a;}\ncout<<a;\nf();\n\
    cout<<a;\n}\nvoid f(){cout<<a;int a = 4;cout<<a;}\n```\n\n### (2) 类的作用域\n\n类作用域包括类定义作用域和类实现作用域。\n\
    \n类的定义作用域是指类定义和相应的成员函数定义范围。在该范围内，一个类的成员函数对同一类的数据成员具有无限制的访问权。\n\n私有成员和受保护成员只能被类内部的成员函数访问；\n\
    \n公有成员是类提供给外部的接口，可以在类外部被访问。这种技术实现了信息的隐藏和封装。\n\n类的实现作用域通过类的对象体现，对象有全局对象、局部对象等作用范围。\n\
    \n### (3) 可见性\n\n可见性与作用域是一致的。可见性从另一角度表现标识符的有效性，标识符在某个位置可见，表示该标识符可以被引用。\n\n可见性在分析两个同名标识符作用域嵌套的特殊情况时非常有用。当内层的变量和外层的变量同名时，在内层里，外层的变量暂时地失去了可见性。\n\
    \n//例子\n\n```cpp\nint a = 0; // <-- 全局变量,并且初始化为0\nvoid func()\n{ int a; a = 100;\n\
    \  cout << a << endl;\n  cout<<::a<<endl;\n}\nvoid main()\n{ cout << a << endl;\
    \ }\n```\n\n> “不能在同一作用范围内有同名变量”。\n\n上面的代码中，定义了两个a，但并不违反这一规则。因为二者处于不同的作用范围内。\n\n"
