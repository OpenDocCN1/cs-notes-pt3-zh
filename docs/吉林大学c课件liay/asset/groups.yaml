    }\nnamespace ls{\nusing zhs::age;\nvoid a();\n}\nvoid ls::a(){cout<<age<<endl;}\n\
    \nint main()\n{ ls::a(); return 0;}\n```\n\n## 名字空间\n\n```\nnamespace zhs{\nclass\
