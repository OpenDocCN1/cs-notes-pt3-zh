    # 对象构造顺序


    局部和静态局部对象（文件作用域）以文本定义顺序为顺序，（类成员属于此种情况）


    静态对象在首次定义时构造一次；程序结束析构


    全局对象在main之前构造；程序结束时析构


    全局对象如果分布在不同文件中，则构造顺序随机'
