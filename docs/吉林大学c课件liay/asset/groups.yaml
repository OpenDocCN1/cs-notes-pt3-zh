  mdcn: "\n\n## 类名与其它变量名或函数名相同的情况\n\n类名允许与其它变量名或函数名相同，通过如下方法来正确访问：\n\n+   1) 如果一个非类名隐藏了类名，则类名通过加前缀即可。\n\
    \n```\nclass Sample\n{/.....};\nvoid fun(int Sample)\n{\nclass Sample s; //定义一个对象要加前缀\n\
    Sample++;\n//...\n}\n```\n\n+   2) 如果一个类名隐藏了非类名，则用一般作用域规则即可。\n\n```\nint s=0;\n\
    void func()\n{\nclass s{...};\ns a;\n::s=3;} // class作用域到此结束\nint g=s;\n```\n\n\
    在函数中定义的类称为局部类，不多见。\n作用域在定义该类的函数内。\n\n局部类的成员函数必须在类定义内部定义。\n\n## （3）生命期（生存期）\n\n\
    指一个对象产生后，存活时间的度量。\n\n在生存期内，对象保持它的状态。\n\n整个程序的生命期：全局（静态）数据\n\n静态生命期：静态局部数据\n\n\
    局部生命期：\n\n动态生命期：由new申请到内存空间之后，该空间实体开始有效，直到delete释放该内存空间。\n\n```\n//动态生命周期\n#include\
    \ <iostream.h>\nint * fn(){\n    int* ap=new int;//ap指向的内存空间开始有效\n    return ap;\n\
    }\nint main()\n{\n    int* bp=fn();\n    *bp=15;\n    cout<<*bp<<\"\\n\";\n  \
    \  delete bp;//bp 即ap所指，空间释放。\n    return 0;}\n```\n\n## 二\n名字空间\n\n名字空间的作用是建立一些互相分隔的作用域，把一些全局实体分隔开来，避免产生名字冲突。\n\
    \n```\nnamespace zhs{\nclass aa {\npublic:\nvoid aa1(int a=1){id=a;}\nint id;\n\
    };\nint age;\ndouble score;\n}\nnamespace ls{\nclass aa {\npublic:\nint age;\n\
    };\n}\n```\n\n```\nvoid main(){\nls::aa a;\nzhs::score=90.1;\nzhs::aa b;\nb.aa1(8);\n\
    a.age=5;\nzhs::age=6;\ncout<<a.age<<b.id<<endl;\n}\n```\n\n## 名字空间\n\n不同人编写的程序组合时会遇到名字冲突的危险\n\
    \n可以包含：变量&对象；常量；函数定义；\n类型（结构）定义；名字空间的定义\n\n不能包含：预处理命令；\n\n可以开放定义；可以 {} 外定义\n\n\
    ## 名字空间\n\n```\nnamespace zhs{\nclass aa;\n}\nclass zhs:: aa {\npublic:\nvoid\
    \ aa1(int a=1){id=a;}\nint id;\n};\nnamespace zhs{\nint age;//仍然是全局变量，隐藏在指定的名字空间而已\n\
    double score;\n}\nint main()\n{\nzhs::aa a;zhs::age=4;\nzhs::score=90.5; a.id=3;\n\
    cout<<a.id<<zhs::score<<zhs::age<<endl;\nreturn 0;}\n```\n\n{} 外定义\n\n合并定义\n\n\
    ## 名字空间\n\n```\nnamespace zhs{\nclass aa {\npublic:\n    void aa1(int a=1){id=a;}\n\
    \    int id;\n};\nint age;\ndouble score;\n}\nnamespace ls{\nvoid a(){cout<<\"\
    Computer\"<<endl;};\n}\nInt main()\n{zhs::score=90.1;\ncout<<zhs::score<<endl;\n\
    ls::a();\nreturn 0;}\n```\n\n包含函数\n\n## 名字空间\n\n```\n```cpp\nnamespace zhs{\n\
    class aa {\npublic:\n    void aa1(int a=1){id=a;}\n    int id;\n};\nint age;\n\
    double score;\nvoid f(){age=1;score=80.5;}\n}\nnamespace ls{\n    void a();\n\
    }\nvoid ls::a(){cout<<zhs::age<<endl;}\nint main()\n{ zhs::f();  ls::a();\n  \
