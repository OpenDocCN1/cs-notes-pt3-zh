    # 1-7 C++程序的实现


    编辑、编译、运行


    +   1. 编辑：将编写好的C++源程序输入到计算机中，生成磁盘文件的过程。磁盘文件的文件名要用扩展名.cpp。


    +   2. 编译：C++程序的实现必须使用某种C++语言的编译器对程序进行编译。功能是：将程序的源代码转换成为机器代码的形式，称为目标代码（.obj），然后，再使目标代码进行连接，生成可执行文件（.exe）。


    编译过程可分为三个子过程：预处理过程、编译过程、连接过程'
