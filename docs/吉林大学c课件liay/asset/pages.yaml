  md: "# 异常处理\n\n```\n#define MAX 10\nint f(int * a,int j)\n{\n    if(j>=0&&j<MAX)\n\
    \        return(a[j]);\n    else\n        throw \"aaaa\";\n}\nvoid main()\n{ int\
    \ j;\nint a[MAX]={0};\n    try{\n    cout<<f(a,15)<<endl;}\n    catch(string s){\n\
    \        cout<<s<<endl;\n    }\n}\n```\n\n（1）定义异常（try语句块）\n将那些有可能会产生错误的语句放在try块中\n\
    \n（2）抛掷异常（throw语句）\n检测是否产生异常，若是，则抛掷异常。\n\n（3）捕捉异常,定义异常处理（catch语句块）\n将异常处理语句放在catch块中,以便异常被传递过来时就处理它。\n\
    \nC++只理会受监控的异常。\nTry块之后必须紧跟一个或多个catch语句。\nCatch括号中只能容纳一个形参，与throw抛掷的异常类型匹配时，便捕获了异常。\n\
    避免把正常逻辑淹没在错误处理代码中，从而使程序更易于阅读。"
