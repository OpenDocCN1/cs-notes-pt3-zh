  md: '# 3.与地址相关的运算 * 和 &


    “ * ” 称为指针运算符（间接访问运算符），表示指针所指向的变量的值。一元运算符


    ```

    int a;    int *p=&a;  *p=5;

    ```


    “ & ” 称为取地址运算符，用来得到一个对象的地址。一元运算符。


    * 和 &是两个互逆的操作，当这两个操作符碰到一起时，其作用相互抵消，例如


    ```

    *&k=3    与

    k=3

    ```


    效果完全相同'
