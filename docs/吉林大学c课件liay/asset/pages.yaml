  md: '# 使用运算符重载,需注意：


    +   (1) 在C++中几乎所有的运算符（除“.”（成员选择符）、“.*”（成员对象选择符）、“->*（成员指针选择符）”、“::”、“?:”、“sizeof”外）都可以被重载。

    +   只能重载C++中已有的运算符,不允许创建新的运算符.


    +   (2) 运算符的重载既不会改变原运算符的优先级和结合性。


    +   (3) 至少有一个操作对象是自定义类型,参数都是基本类型时不能重载。


    +   (4) 不提倡改变参数个数、运算符含义。


    +   (5) 重载运算符的函数不能有默认的参数。'
