  md: '# 9.类的封装


    # 类的封装的概念


    首先是数据与算法（操作）结合，构成一个不可分割的整体。


    其次是在这个整体中一些成员是保护的，他们被有效地屏蔽，以防外界的干扰和误操作。


    另一些成员是公共的，他们作为接口提供给外界使用。'
