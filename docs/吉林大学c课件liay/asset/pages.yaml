    类型名 operator 运算符\n（形参表）\n{函数体}\n其中operator是关键字，类型名为重载运算符的返回类型，即运算结果类型。\n\n重载:用户根据自己的需要对C++已提供的运算符进行重载，赋予新的含义。\n\
    \n实现时，首先把指定的运算表达式转化为对运算符函数的调用，这个过程是在编译中完成的。\n\n运算符重载不是必需的，为了编程的人性化描述。"
