- pgno: 97
  md: "# 保护（私有）成员\n\n类的成员可以声明为被保护的（protected、private），从类的外部（指在普通函数或其它类的成员函数中）不能对他们访问\n\
    \n一般将所有的数据成员指定为保护。\n\n+   1. 保护类的内部数据不被肆意侵犯\n+   \n+   2. 是类对它本身内部实现的维护负责，因为只有类自己才能访问该类的保护数据，所以对一切保护数据的维护只有靠类自己。\n\
    +   \n+   3. 限制类与外部世界的接口。\n+      保护成员对使用者不可见。\n+   \n+   4. 减少类与其它代码的关联程度。类的功能是独立的，不依赖于应用程序的运行环境。"
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 公共成员（公共接口、对外接口）


    需要让外界调用的成员函数指定为公共的，外界通过公共的函数来实现对数据的操作。


    外界与类的唯一联系就是调用公共的成员函数。


    在类外不能访问私有数据成员，但是可以通过公共成员函数来修改私有数据成员的值。'
