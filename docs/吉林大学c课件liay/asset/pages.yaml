  md: "# 嵌套类\n\n```\n```cpp\nclass A{\n    int a;\npublic:\n    class B{\n       \
    \ int b;\n    public:\n        B(int i);\n    };\n    void f(){ pb->b=5;//error\n\
    \    }\n    B* pb;\n};\nA::B::B(int i):b(i){}//成员可以在体外定义\nint main(){\n    A a;\n\
    \    A::B b(10);\n}\n```\n```\n\n在一个类中定义的类称为嵌套类，定义嵌套类的类称为外围类。\n\n定义嵌套类的目的在于隐藏类名，减少全局的标识符，从而限制用户能否使用该类建立对象。这样可以提高类的抽象能力，并且强调了两个类(外围类和嵌套类)之间的主从关系。"
  merge: -1
  img_proc: true
- pgno: 373
  md: "嵌套类中说明的成员不是外围类中对象的成员，反之亦然。嵌套类的成员函数对外围类的成员没有访问权，反之亦然。因此，在分析嵌套类与外围类的成员访问关系时，往往把嵌套类看作非嵌套类来处理。这样，上述的嵌套类可写成如下格式：\n\
    \n```\nclass A{\n  int a;\n  public:\n      void f(){}\n  B* pb;\n};\nclass B{\n\
    \    int b;\n  public:\n      B(int i);\n};\n```\n\n由引可见，嵌套类仅仅是语法上的嵌入。在嵌套类中说明的友元对外围类的成员没有访问权。"
  merge: -1
  img_proc: true
