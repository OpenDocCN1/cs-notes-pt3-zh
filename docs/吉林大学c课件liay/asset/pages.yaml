  md: '# 默认参数的顺序规定：


    一个函数中可以有多个默认参数，默认参数应从右至左逐渐定义，当调用函数时，从左向右匹配参数。


    例： void foo(int a, int b, bool c);


    ```

    void foo(int a, int b, bool c = false); //ok,c是最后一个参数

    ```


    ```

    void foo(int a, int b = 0, bool c);   //fail,b不是最后一参数

    ```'
