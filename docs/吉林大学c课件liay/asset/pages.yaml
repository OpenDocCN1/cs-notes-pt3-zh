    模板参数表中的参数可以有多个，可以是类型形参，也可以是表达式形参。多个参数间用逗号间隔。


    模板参数若是代表一个类型，模板类型参数形式如下：


    ```

    class 类型参数名 （或 typename 类型参数名）

    ```


    函数模板的定义可以看作由两部分组成，

    一是模板类型的定义，template<class 模板形参表>

    二是函数定义，它与普通函数的定义类似。


    函数模板只是对函数的描述，编译系统不为其产生任何执行代码。'
