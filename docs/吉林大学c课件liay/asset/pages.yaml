  md: '派生类构造函数执行的一般顺序是：

    （1）基类构造函数，

    （2）派生类对象成员类的构造函数（如果有的话）。

    （3）派生类构造函数体中的内容。


    释放派生类对象时，析构函数的执行顺序是：

    先执行派生类的析构函数，

    再执行对象成员类的析构函数（如果派生类有对象成员的话），

    最后执行基类的析构函数，其顺序与执行构造函数时的顺序正好相反。'
