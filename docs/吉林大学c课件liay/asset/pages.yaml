  md: '# # 文件流类


    文件的概念：存储在外部介质上的数据集合。


    二类：程序文件和数据文件。


    程序中输入输出 的对象是数据文件。


    数据文件的组织形式分为：ASCII文件和二进制文件


    ASCII文件（文本文件或字符文件）：每一个字节放一个ASCII代码，代表一个字符。直接显示或打印。


    二进制文件（内部文件或字节文件）：把内存中的数据按其在内存中的存储形式原样输出到磁盘上保存。


    对于字符信息二者是一样的，数值数据二者是不同的。'
