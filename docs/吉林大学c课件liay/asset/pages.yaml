  md: '# 2-4： 程序运行时的内存布局


    +   (1) 代码区(code area)：存放程序的代码（各个函数的代码块）

    +   (2) 全局变量区(data area)：存放程序的全局数据和静态数据

    +   (3) 堆区(heap area)：存放程序的动态数据

    +       可以用malloc()与free()以及new和delete 来申请与释放堆内存，也称动态内存、动态数据区。

    +   (4) 栈区(stack area)：存放程序的局部数据（各个函数中的数据）'
