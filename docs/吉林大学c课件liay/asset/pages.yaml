- pgno: 10
  md: '# 1-5：举例比较面向对象和面向过程 程序设计


    +   - 例如五子棋，

    +   - 面向过程的设计思路就是首先分析问题的步骤：


    +   1、开始游戏，

    +   2、黑子先走，

    +   3、绘制画面，

    +   4、判断输赢，

    +   5、轮到白子，

    +   6、绘制画面，

    +   7、判断输赢，

    +   8、返回步骤2，

    +   9、输出最后结果。


    而面向对象的设计则是从另外的思路来解决问题。整个五子棋可以分为：


    +   1、黑白双方，这两方的行为是一模一样的，

    +   2、棋盘系统，负责绘制画面，

    +   3、规则系统，负责判定诸如犯规、输赢等。


    第一类对象（玩家对象）负责接受用户输入，并告知第二类对象（棋盘对象）棋子布局的变化，同时利用第三类对象（规则系统）来对棋局进行判定。


    +   - 把上面每个步骤用分别的函数来实现，问题就解决了'
  merge: -1
  img_proc: true
