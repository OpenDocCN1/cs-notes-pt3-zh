    C++ 编译器在遇到调用用模板方式定义的函数时，会根据调用函数的参数类型构造出一个个具体的函数。这个过程称为函数模板的实例化（instantiation）。


    同一个模板生成的不同的模板函数是不同名字的函数，不是重载函数。函数模板反映的是不同函数的函数族。使用模板实现了代码重用。'
