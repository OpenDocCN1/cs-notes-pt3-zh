  md: '+   - 构造函数是特殊的类成员函数。

    +   - C++规定与类同名的成员函数是构造函数，在该类的对象创建时，自动被调用。

    +   - 构造函数负责对象的初始化

    +   - 可拥有多个参数。可以重载。

    +   - 构造函数不返回具体的值，不指定函数的返回类型。

    +   - 可内置定义，也可以在类外定义。

    +   - 通常是Public的'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   - 析构函数也是一个特殊的成员函数；

    +   - 作用与构造函数相反；在对象的生命周期结束时自动被调用。

    +   - 名字是类名前加一个~；

    +   - 不返回任何值；没有函数类型，没有函数参数，因此不能被重载。

    +   - 一个类可以由多个构造函数，只能有一个析构函数。

    +   - 可内置定义，也可以在类外定义。

    +   - 用于清理和释放资源的工作。

    +   - 通常是Public的'
