- pgno: 105
  md: '# (2)类的作用域


    类作用域包括类定义作用域和类实现作用域。


    类的定义作用域是指类定义和相应的成员函数定义范围。在该范围内，一个类的成员函数对同一类的数据成员具有无限制的访问权。


    私有成员和受保护成员只能被类内部的成员函数访问；


    公有成员是类提供给外部的接口，可以在类外部被访问.这种技术实现了信息的隐藏和封装。


    类的实现作用域通过类的对象体现，对象有全局对象、局部对象等作用范围。'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# (2)可见性\n\n可见性与作用域是一致的。可见性从另一角度表现标识符的有效性，标识符在某个位置可见，表示该标识符可以被引用。\n\n可见性在分析两个同名标识符作用域嵌套的特殊情况时非常有用。当内层的变量和外层的变量同名时，在内层里，外层的变量暂时地失去了可见性。\n\
    \n//例子\n\n```\nint a = 0; // <-- 全局变量,并且初始化为0\nvoid func()\n{ int a; a = 100;\n\
    \  cout << a << endl;\n  cout<<::a<<endl;\n}\nvoid main()\n{ cout << a << endl;\
    \ }\n```\n\n> “不能在同一作用范围内有同名变量”。\n\n上面的代码中，定义了两个a，但并不违反这一规则。因为二者处于不同的作用范围内。"
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 类名与其它变量名或函数名相同的情况


    类名允许与其它变量名或函数名相同，通过如下方法来正确访问：


    +   1) 如果一个非类名隐藏了类名，则类名通过加前缀即可。


    ```

    class Sample

    {/.....};

    void fun(int Sample)

    {

    class Sample s; //定义一个对象要加前缀

    Sample++;

    //...

    }

    ```


    +   2) 如果一个类名隐藏了非类名，则用一般作用域规则即可。


    ```

    int s=0;

    void func()

    {

    class s{...};

    s a;

    ::s=3;} // class作用域到此结束

    int g=s;

    ```


    在函数中定义的类称为局部类，不多见。

    作用域在定义该类的函数内。


    局部类的成员函数必须在类定义内部定义。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# （3）生命期（生存期）


    指一个对象产生后，存活时间的度量。


    在生存期内，对象保持它的状态。


    整个程序的生命期：全局（静态）数据


    静态生命期：静态局部数据


    局部生命期：


    动态生命期：由new申请到内存空间之后，该空间实体开始有效，直到delete释放该内存空间。'
  merge: -1
  img_proc: true
