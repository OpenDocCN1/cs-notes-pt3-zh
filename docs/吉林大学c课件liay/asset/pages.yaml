  md: '# 4、引用的使用一参数传递


    ```

    void swap(int&, int&);

    void swap1(int *,int *);

    void swap2(int ,int );

    int main()

    {

    int a=1,b=2;

    swap2(a,b);cout<<a<<b;

    swap1(&a,&b);cout<<a<<b;

    swap(a,b); cout<<a<<b;

    return 0;

    }

    ```


    ```

    void swap(int &a1,int &b1)

    { int c;

    c=a1; a1=b1; b1=c;}

    ```


    ```

    void swap1(int *a1,int *b1)

    { int c;

    c=*a1; *a1=*b1; *b1=c;}

    ```


    ```

    void swap2(int a1,int b1)

    { int c;

    c=a1; a1=b1; b1=c;}

    ```


    形参和实参结合规则：

    形参为引用时，形参(引用)接收实参(对象)的地址。

    或表述为：

    形参为引用时，凡遇到形参(引用)的地方，全部用实参(对象)来代替。


    传递引用给函数与传递指针的效果相同。


    可读性比指针传递好（传值方式的调用与可读性，性能却强于传值方式）


    参数结合符合初始化标准


    可使用引用传递从函数返回多个值

    （指针和引用都可以）'
