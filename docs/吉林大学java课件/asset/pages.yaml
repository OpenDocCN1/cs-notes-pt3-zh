- pgno: 487
  md: '# Object类对线程的支持 —— 等待与唤醒


    Object类是所有类的父类，在此类中有以下几个方法是對线程操作有所支持的。


    | No. | 方法 | 类型 | 描述 |

    |---|---|---|---|

    | 1 | public final void wait() throws InterruptedException | 普通 | 线程等待 |

    | 2 | public final void wait(long timeout) throws InterruptedException | 普通 |
    线程等待，并指定等待的最长时间，以毫秒为单位 |

    | 3 | public final void wait(long timeout,int nanos) throws InterruptedException
    | 普通 | 线程等待，并指定等待的最长毫秒及纳秒 |

    | 4 | public final void notify() | 普通 | 唤醒第一个等待的线程 |

    | 5 | public final void notifyAll() | 普通 | 唤醒全部等待的线程 |'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# notify()和notifyAll()


    对于唤醒的操作有两个：notify()、notifyAll()。一般来说，所有等待的线程会按照顺序进行排列，如果现在使用了notify()方法的话，则会唤醒第一个等待的线程执行，而如果使用了notifyAll()方法，则会唤醒所有的等待线程，那个线程的优先级高，那个线程就有可能先执行。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_488_0.png)'
