- pgno: 206
  md: '# 泛化关系（Generalization）


    +   泛化关系(Generalization)也就是继承关系，也称为 “is-a-kind-of”关系或者 “is a”关系，泛化关系用于描述父类与子类之间的关系，父类又称作基类或超类，子类又称作派生类。在UML中，泛化关系用带空心三角形的直线来表示。


    +   在代码实现时，使用面向对象的继承机制来实现泛化关系，如在Java语言中使用extends关键字、在C++/C#中使用冒号 “:” 来实现。


