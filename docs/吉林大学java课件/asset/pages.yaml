- pgno: 1012
  md: "# 简单工厂模式（Simple Factory）\n\n简单工厂模式存在的目的很简单：定义一个用于创建对象的工厂，以便将创建对象的具体过程屏蔽隔离起来，达到提高灵活性的目的。\n\
    \n先来看看它的组成：\n\n+   1) **工厂类角色**：这是本模式的核心，含有一定的商业逻辑和判断逻辑。在java中它往往由一个具体类实现。\n+\
    \   \n+   2) **抽象产品角色**：它一般是具体产品继承的父类或者实现的接口。在java中由接口或者抽象类来实现。\n+   \n+   3)\
    \ **具体产品角色**：工厂类所创建的对象就是此角色的实例。在java中由一个具体类实现。"
  merge: -1
  img_proc: true
- pgno: 1013
  md: '# # 一个例子


    话说十年前，有一个暴发户，他家有三辆汽车——Benz 奔驰、BMW宝马、Audi 奥迪，还雇了司机为他开车。


    不过，暴发户坐车时总是怪怪的：上 Benz车后跟司机说 “开奔驰车！”，坐上 BMW后他说 “开宝马车！”，坐上Audi说 “开奥迪车！”。你一定说：这个人有病！直接说开车不就行了？！


    而当把这个暴发户的行为放到我们程序设计中来时，会发现这是一个普遍存在的现象。幸运的是，这种有病的现象在OO（面向对象）语言中可以避免了。'
  merge: -1
  img_proc: true
- pgno: 1014
  md: "# 简单工厂模式怎么来使用呢？\n\n我们就以简单工厂模式来改造暴发户坐车的方式——现在暴发户只需要坐在车里对司机说句：“开车”就可以了。\n\n```\n\
    //抽象产品角色\npublic abstract class Car{\n    public abstract void drive();\n}\n//具体产品角色\n\
    \    public class Benz extends Car{\npublic void drive() {\nSystem.out.println(\"\
    Driving Benz \");\n}\n}\n    public class Bmw extends Car{\npublic void drive()\
    \ {\nSystem.out.println(\"Driving Bmw \");\n}\n}\n...（奥迪我就不写了:P）\n```"
  merge: -1
  img_proc: true
