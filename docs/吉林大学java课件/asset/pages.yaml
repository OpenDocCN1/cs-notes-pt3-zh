  md: '# this与super的区别


    | No. | 区别点 | this | super |

    |---|---|---|---|

    | 1 | 属性访问 | 访问本类中的属性，如果本类没有此属性则从父类中继续查找 | 访问父类中的属性 |

    | 2 | 方法 | 访问本类中的方法，如果本类中没有此方法，则从父类中继续查找 | 直接访问父类中的方法 |

    | 3 | 调用构造 | 调用本类构造，必须放在构造方法的第一行 | 调用父类构造，必须放在子类构造方法的第一行 |

    | 4 | 特殊 | 表示当前对象 | 无此概念 |'
