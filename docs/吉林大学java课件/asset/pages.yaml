- pgno: 827
  md: '# 一维数组


    +   ▫ 一维数组可以存放上千万个数据，并且这些数据的类型是完全相同的。

    +   ▫ 要使用Java的数组，必须经过两个步骤：（1）声明数组、（2）分配内存给该数组。这两个步骤的语法如下：

    +     ✦ 声明形式一：

    +       ✧ 声明一维数组：数据类型 数组名[] = null；

    +       ✧ 分配内存给数组：数组名 = new 数据类型[长度]；

    +     ✦ 声明形式二：

    +       ✧ 声明一维数组：数据类型[] 数组名 = null；'
  merge: -1
  img_proc: true
- pgno: 828
  md: '# 声明一维数组


    +   ▫ 数组的声明格式里，“数据类型”是声明数组元素的数据类型，常见的类型有整型、浮点型与字符型等。

    +   ▫ “数组名”是用來统一这组相同数据类型的元素的名称，其命名规则和变量的相同，建议使用有意义的名称为数组命名。

    +   ▫ 数组声明后实际上是在栈内存中保存了此数组的名称，接下来便要在堆内存中配置数组所需的内存，其中“长度”是告诉编译器，所声明的数组要存放多少个元素，而“new”则是命令编译器根据括号里的长度开辟空间。'
  merge: -1
  img_proc: true
- pgno: 829
  md: '# 声明及开辟数组空间


    +   声明数组：

    +     int score[] = null ;

    +     → null表示指针未指向具体空间

    +     int score[] ;

    +     score尚未指向具体的空间，所以score内容未知，无法直接使用


    +   为数组开辟空间：

    +     score = new int[3];

    +     int score[] = new int[3];

    +     堆内存 0 score[0] 0 score[1] 0 score[2]'
