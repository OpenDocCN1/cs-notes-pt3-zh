- pgno: 950
  md: '# 面向对象设计原则概述


    # 软件的可维护性和可复用性


    软件工程和建模大师 Peter Coad 认为，一个好的系统设计应该具备如下三个性质：


    +   - 可扩展性(Extensibility): 有了新的需求，新的功能很容易加到系统中，并且不影响原有的功能，也不带来新的缺陷。

    +   - 灵活性(Flexibility): 代码修改容易（系统某一部分代码需要修改时不会破坏系统现有的结构，也不会影响到其它部分）。

    +   - 可插入性(Pluggability): 可以将系统中某些类替换为相同接口的其它类，并且系统不受影响。'
  merge: -1
  img_proc: true
- pgno: 951
  md: '✓ 使系统满足上述性质，关键在于提高系统的可维护性与可复用性。


    +   • 可维护性：软件可维护性即维护人员对该软件进行维护的难易程度,具体包括理解、改正、改动和改进该软件的难易程度。

    +     - 可维护性可通过7个质量特性来衡量:

    +       » 可理解性

    +       » 可测试性

    +       » 可修改性

    +       » 可靠性

    +       » 可移植性

    +       » 可使用性

    +       » 效率


    Peter Coad


    ![](img/b706331eacf49a62651c2c9b2de81ca5_951_0.png)


    ![](img/b706331eacf49a62651c2c9b2de81ca5_951_1.png)'
  merge: -1
  img_proc: true
- pgno: 952
  md: '# 可复用性


    +   软件的复用(Reuse)或重用拥有众多优点，如可以提高软件的开发效率，提高软件质量，节约开发成本，恰当的复用还可以改善系统的可维护性。


    +   这里强调的复用是支持可维护性的复用。


    面向对象技术已经具备支持可维护性复用的基础：抽象、继承、封装、多态。


    +   抽象、继承支持类的定义可以复用；多态支持类的实现复用；抽象封装支持可维护性。


    在面向对象的设计里面，人们已经发现了一些设计原则，遵循这些设计原则可以有效提高系统的复用性，同时提高系统的可维护性。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_952_0.png)'
