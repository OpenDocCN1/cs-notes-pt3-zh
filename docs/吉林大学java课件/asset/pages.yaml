  md: '# 接口隔离原则（ISP）


    接口隔离原则讲的是：\n使用多个专门的接口比使用单一的接口要好。


    从客户的角度来说：一个类对另外一个类的依赖性应当是建立在最小的接口上的。如果客户端只需要某一些方法的话，那么就应当向客户端提供这些需要的方法，而不要提供不需要的方法。提供接口意味着向客户端作出承诺，过多的承诺会给系统的维护造成不必要的负担。'
