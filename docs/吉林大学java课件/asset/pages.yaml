- pgno: 297
  md: '# 如何选择接口和抽象类


    Java语言中对于抽象类定义进行支持的两种机制：


    +   1 abstract class

    +   2 interface


    正是由于这两种机制的存在，才赋予了Java强大的面向对象能力。abstract class和interface之间在对于抽象类定义的支持方面具有很大的相似性，甚至可以相互替换，因此很多开发者在进行抽象类定义时对于abstract
    class和interface的选择显得比较随意。其实，两者之间还是有很大的区别的，对于它们的选择甚至反映出对于问题领域本质的理解、对于设计意图的理解是否正确、合理。'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# 如何选择接口和抽象类


    abstract class和interface在Java语言中都是用来进行抽象类（注：此处抽象类并非从abstract class翻译而来，它表示的是一个抽象体，而abstract
    class为Java语言中用于定义抽象类的一种方法，请注意区分）定义的。


    那么使用抽象类能为我们带来什么好处呢？'
