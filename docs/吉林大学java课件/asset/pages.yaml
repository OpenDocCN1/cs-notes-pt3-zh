- pgno: 306
  md: '# 解决方案一


    简单的在Door的定义中增加一个alarm方法，如下：


    ```

    abstract class Door {

    abstract void open();

    abstract void close();

    abstract void alarm();

    }

    ```


    那么具有报警功能的

    AlarmDoor的定义方式如下：


    ```

    class AlarmDoor extends Door {

    void open() { ... }

    void close() { ... }

    void alarm() { ... }

    }

    ```


    或者


    ```

    interface Door {

    void open();

    void close();

    void alarm();

    }

    ```


    或者


    ```

    class AlarmDoor implements Door {

    void open() { ... }

    void close() { ... }

    void alarm() { ... }

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 解决方案一后果


    在Door的定义中把Door概念本身固有的行为方法和另外一个概念“报警器”的行为方法混在了一起。这样引起的一个问题是那些仅仅依赖于Door这个概念的模块会因为“报警器”这个概念的改变（比如：CommonDoor本来不需要alarm）而改变，反之依然。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_307_0.png)'
