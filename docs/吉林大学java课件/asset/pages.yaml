- pgno: 984
  md: '# 什么是接口


    +   - 对象声明的每一个方法所指定的方法名、参数和返回值构成了对象的方法签名(signature)。

    +   - 对象方法所定义的所有方法签名的集合被称为该对象的接口（interface），它描述了该对象所能接受的全部请求的集合。

    +   - 在面向对象系统中，对象只通过接口与外部交流。对象接口与其功能实现是分离的，两个有相同接口的对象可以有完全不同的实现。

    +   - 对应程序设计语言中interface/abstract class。'
  merge: -1
  img_proc: true
- pgno: 985
  md: '# # 接口隔离原则




    ✓ 接口隔离原则是指使用多个专门的接口，而不使用单一的总接口。每一个接口应该承担一种相对独立的角色，不多不少，不干不该干的事，该干的事都要干。


    +   1. 一个接口就只代表一个角色，每个角色都有它特定的一个接口，此时这个原则可以叫做“角色隔离原则”。

    +   2. 接口仅仅提供客户端需要的行为，即所需的方法，客户端不需要的行为则隐藏起来，应当为客户端提供尽可能小的单独的接口，而不要提供大的总接口。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_985_0.png)'
