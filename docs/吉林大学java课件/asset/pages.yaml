  md: "# 实现WindowListener\n\n```\npublic class MyWindowEventHandle implements WindowListener\
    \ { // 实现窗口监听\n    public void windowActivated(WindowEvent arg0) {      // 设置为活动窗口时触发\n\
    \        System.out.println(\"windowActivated --> 窗口被选中。\");\n    }\n    public\
    \ void windowClosed(WindowEvent arg0) {      // 窗口被关闭窗口时触发\n        System.out.println(\"\
