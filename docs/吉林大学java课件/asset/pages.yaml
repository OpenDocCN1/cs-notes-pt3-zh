- pgno: 554
  md: '# 流


    在程序中所有的数据都是以流的方式进行传输或保存的，程序需要数据的时候要使用输入流读取数据，而当程序需要将一些数据保存起来的时候，就要使用输出流完成。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_554_0.png)'
