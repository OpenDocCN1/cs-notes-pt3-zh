  md: '# 布局管理器


    +   - 使用布局管理器可以管理组件的显示位置，每当需要重新调整屏幕大小或重新绘制屏幕上任一项目时，都要用到布局管理器。

    +   - 在Swing中使用的所有布局管理器都实现 LayoutManager接口，在Swing中主要使用以下五种常见的布局管理器： FlowLayout、BorderLayout、GridLayout、CardLayout、绝对定位。'
  merge: -1
