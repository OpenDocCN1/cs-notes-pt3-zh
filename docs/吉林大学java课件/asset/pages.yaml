  md: '# 什么是复用


    +   - 复用： Reuse，使用已有资源来促进产品开发的过程。

    +   - 软件复用

    +     - Software reuse，在两次或多次不同的软件开发过程中重复使用相同或相似软件成分的过程。

    +   - 可复用的软件成分称为软件构件，软件生产过程中任何活动所产生的制品均可复用

    +     - 项目计划

    +     - 可行性报告

    +     - 需求得以

    +     - 分析模型

    +     - 设计模型

    +     - 详细说明

    +     - 源程序

    +     - 测试用例


