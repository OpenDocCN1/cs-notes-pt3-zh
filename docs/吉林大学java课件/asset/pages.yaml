  md: '# 接口隔离原则


    # 接口隔离原则定义


    +   接口隔离原则(Interface Segregation Principle, ISP)的定义如下：

    +   - 客户端不应该依赖那些它不需要的接口。


    +   其英文定义为：

    +   - Clients should not be forced to depend upon interfaces that they do not
    use.


    +   注意，在该定义中的接口指的是所定义的方法。


    +   另一种定义方法如下：

    +   - 一旦一个接口太大，则需要将它分割成一些更细小的接口，使用该接口的客户端仅需知道与之相关的方法即可。


    +   其英文定义为：

    +   - Once an interface has gotten too ''fat'' it needs to be split into smaller
    and more specific interfaces so that any clients of the interface will only know
    about the methods that pertain to them.'
