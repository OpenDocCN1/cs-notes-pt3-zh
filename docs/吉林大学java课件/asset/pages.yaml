- pgno: 47
  md: '# # 关于“&&”与“&”、 “||”与“|”的说明


    +   - **“&&”与“&”**

    +   - &&表示短路与

    +   - 对于“与”来说，要求所有的条件都判断，而如果使用“短路与”如果第一个条件为false，则后面的条件将不再判断。


    +   - &&表示短路与


    +   - 对于“与”来说，要求所有的条件都判断，而如果使用“短路与”如果第一个条件为false，则后面的条件将不再判断。


    +   - **“||”与“|”**

    +   - ||表示短路或

    +   - 对于“或”来说，要求所有的条件都判断，而如果使用“短路或”如果第一个条件为true，则后面的条件将不再判断。


    +   - ||表示短路或


    +   - 对于“或”来说，要求所有的条件都判断，而如果使用“短路或”如果第一个条件为true，则后面的条件将不再判断。'
