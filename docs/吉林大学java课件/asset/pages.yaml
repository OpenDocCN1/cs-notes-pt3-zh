- pgno: 513
  md: '# 受限泛型


    在引用传递中，泛型操作中也可以设置一个泛型对象的范围上限和范围下限。范围上限使用extends关键字声明，表示参数化的类型可能是所指定的类型，或者是此类型的子类，而范围下限使用super进行声明，表示参数化的类型可能是所指定的类型，或者是此类型的父类型，直至Object类。


    +   设置上限:

    +   声明对象：类名称<? extends 类> 对象名称

    +   定义类：[访问权限]类名称<泛型标识 extends 类>{}

    +   设置下限:

    +   声明对象：类名称<? super 类> 对象名称

    +   定义类：[访问权限]类名称<泛型标识 extends 类>{}'
  merge: -1
  img_proc: true
- pgno: 514
  md: "# 泛型的上限\n\n```\n```java\npublic class GenericsDemo17 {\n    public static void\
    \ main(String[] args) {\n        Info<Integer> i1 = new Info<Integer>(); // 声明Integer的泛型对象\n\
    \        Info<Float> i2 = new Info<Float>();     // 声明Integer的泛型对象\n        i1.setVar(30);\
    \                          // 设置整数，自动装箱\n        i2.setVar(30.1f);           \
    \            // 设置小数，自动装箱\n        fun(i1);                                //\
    \ 是数字，可以传递\n        fun(i2);                                // 是数字，可以传递\n    }\n\
    \    // 接收Info对象，范围上限设置为Number，所以只能接收数字类型\n    public static void fun(Info<? extends\
    \ Number> temp){\n        System.out.print(temp + \" \");\n    }\n}\n```\n```"
