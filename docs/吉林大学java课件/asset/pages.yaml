  md: '# 抽象类的思考


    +   □ 问题1：一个抽象类可以使用final关键字声明吗？

    +   □ 问题2：一个抽象类中可以定义构造方法吗？'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 回答


    +   - 问题一：

    +     - 一个类如果使用了 final 关键字声明，则此类不能被子类继承，而抽象类又必须被子类覆盖，所以很明显，第一个问题的答案是：“一个抽象类不能使用
    final 关键字声明”。

    +   - 问题二：

    +     - 实际上在一个抽象类中是允许存在构造方法的，因为抽象类依然使用的是类的继承关系，而且抽象类中也存在各个属性，所以子类在实例化之前肯定是先要对父类进行实例化的。'
  merge: -1
  img_proc: true
