- pgno: 303
  md: '# abstract class是继承关系


    +   - **abstract class**在**Java**语言中体现了一种继承关系，要想使得继承关系合理，父类和派生类之间必须存在 “is a”关系，即父类和派生类在概念本质上**应该是相同的**。


    +   - 对于**interface** 来说则不然，**并不要求interface** 的实现者和**interface**定义在概念本质上是一致的，仅仅是实现了**interface**定义的契约而已，它们之间存在
    “like a”。为了使论述便于理解，下面将通过一个简单的实例进行说明。'
  merge: -1
  img_proc: true
- pgno: 304
