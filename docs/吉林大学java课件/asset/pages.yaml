    \ arg0) {      // 窗口关闭时触发，按下关闭按钮\n        System.out.println(\"windowClosing -->\
    \ 窗口关闭。\");\n        System.exit(1) ;                         // 系统退出\n    }\n\
    \    public void windowDeactivated(WindowEvent arg0) {      // 设置为非活动窗口时触发\n \
    \       System.out.println(\"windowDeactivated --> 取消窗口选中。\");\n    }\n    public\
    \ void windowDeiconified(WindowEvent arg0) {      // 窗口从最小化还原时触发\n        System.out.println(\"\
