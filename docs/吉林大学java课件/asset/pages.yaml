  md: '# 单例模式(Singleton)


    单例模式有以下的特点：


    +   - 单例类只可有一个实例。

    +   - 单例类必须自己创建自己这惟一的实例。

    +   - 单例类必须给所有其他对象提供这一实例。


    一个例子： Windows 回收站


    Windows 9x 以后的视窗系统中都有一个回收站，下图就显示了 Windows 2000 的回收站。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_1025_0.png)


    在整个视窗系统中，回收站只能有一个实例，整个系统都使用这个惟一的实例，而且回收站自行提供自己的实例。因此，回收站是单例模式的应用。'
  merge: -1
