- pgno: 141
  md: '# 构造方法的重载


    p1=new Person("Tom",18);语句，会做这样几件事：


    +   1. 创建指定类的新实例对象，在堆内存中为实例对象分配内存空间；

    +   2. 为实例对象的属性分配初始值；

    +   3. 并调用指定类的构造方法；

