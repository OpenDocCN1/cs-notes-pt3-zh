- pgno: 81
  md: '# do...while循环


    do...while循环也是用于未知循环执行次数的时候，而while循环及 do...while循环最大不同就是进入while循环前，while语句会先测试判断条件的真假，再决定是否执行循环主体，而do...while循环则是“先做再说”，每次都是先执行一次循环主体，然后再测试判断条件的真假，所以无论循环成立的条件是什么，使用do...while循环时，至少都会执行一次循环主体，语句格式：


    ```

    do{

    语句1；

    语句2；

    ...

    语句n；

    循环条件改变；

    }while (循环条件判断);

    ```


    ![](img/b706331eacf49a62651c2c9b2de81ca5_81_0.png)'
  merge: -1
