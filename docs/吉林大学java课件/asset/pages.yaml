- pgno: 662
  md: '# Collection子接口的定义


    Collection接口虽然是集合的最大接口，但是如果直接使用Collection接口进行操作的话，则表示的操作意义不明确，所以在JAVA开发中已经不提倡直接使用Collection接口了，主要的子接口如下：


    +   - List接口：可以存放重复的内容。

    +   - Set接口：不能存放重复的内容，所有的重复内容是靠hashCode()和equals()两个方法区分的。

    +   - Queue：队列接口。

    +   - SortedSet接口：可以对集合中的数据进行排序。'
