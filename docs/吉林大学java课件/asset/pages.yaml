    +   每当一个按钮按下时，实际上按钮的状态就发生了改变，那么此时就会产生一个事件，而如果要想处理此事件，则就需要事件的监听者不断的监听事件的变化，并根据这些事件进行相应的处理。


    +   在Swing编程中，依然使用了最早AWT的事件处理方式，所有的事件类（基本上任意的一个组件都有对应的事件）都是EventObject类的子类


