  md: '# 开闭原则


    # 开闭原则定义


    ✓ 开闭原则(Open-Closed Principle, OCP)定义如下：


    +   - 一个软件实体应当对扩展开放，对修改关闭。也就是说在设计一个模块的时候，应当使这个模块可以在不被修改的前提下被扩展，即实现在不修改源代码的情况下改变这个模块的行为。


    ✓ 其英文定义为：


    +   - Software entities should be open for extension, but closed for modification.'
