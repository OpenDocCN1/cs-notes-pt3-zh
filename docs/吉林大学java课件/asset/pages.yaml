  md: '# Set接口的定义


    +   - Set接口也是Collection接口的子接口，但是与Collection或List接口不同的是，Set接口中不能加入重复的元素。

    +   - Set接口的定义：

    +     - `public interface Set<E> extends Collection<E>`

    +   - 实现数学上集合（Set）数据结构

    +   - 最大的特点就是不允许保存重复的元素

    +   - 元素之间不要求有顺序，元素无索引

    +   - 常用的实现类：**HashSet**'
