- pgno: 1097
  md: '# Java与Internet——网络基本概念


    TCP/IP网络参考模型包括五个层次：

    应用层、传输层、网络层、链路层、物理层。


    大多数基于Internet的应用程序被看作TCP/IP网络的最上层，如： ftp， http， smtp， pop3， telnet等。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_1097_0.png)'
  merge: -1
  img_proc: true
- pgno: 1098
  md: '# Java与Internet——网络基本概念


    ![](img/b706331eacf49a62651c2c9b2de81ca5_1098_0.png)


    传输层：在TCP/IP网络中，不同的机器之间进行通信时，数据的传输是由传输层控制的，这包括数据要发往的目标机器及应用程序、数据的质量控制等。TCP/IP网络中最常用的传输协议就是TCP（Transport
    Control Protocol）和UDP（User Datagram Protocol）。


    网络层：对TCP/IP网络中的硬件资源进行标识。连接到网络中的每台计算机（或其他设备）都有唯一的地址，这就是IP地址。IP地址实质上是一个32位的整数，通常以“d.d.d.d”的形式表示，每个d是一个8位整数。'
  merge: -1
  img_proc: true
- pgno: 1099
  md: '# 传输层中两类传输协议


    +   - **TCP (Transport Control Protocol )**

    +     面向连接的能够提供可靠的流式数据传输的协议。类似于打电话的过程。

    +     **URL, Socket, ServerSocket**等类都使用TCP协议进行网络通讯。


    +   - **UDP (User Datagram Protocol )**

    +     非面向连接的提供不可靠的数据包式的数据传输的协议。类似于从邮局发送信件的过程。

    +     **DatagramPacket, DatagramSocket**等类使用UDP协议进行网络通讯。


    注：当对所传输的数据具有时序性和可靠性等要求时，应使用TCP协议；当传输的数据比较简单、对时序等无要求时，UDP协议能发挥更好的作用。'
  merge: -1
  img_proc: true
- pgno: 1100
  md: '# Java与Internet ——网络基本概念


    一台机器只通过一条链路连接到网络上，但一台机器中往往有很多应用程序需要进行网络通信，如何区分呢？这就要靠网络端口号（port）了。


    端口号是一个标记机器的逻辑通信信道的正整数，端口号不是物理实体。IP 地址和端口号组成了所谓的 Socket，Socket 是网络上运行的程序之间双向通信链路的最后终结点。


    IP与端口号组合而得出的Socket，可以完全分辨 Internet上运行的程序。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_1100_0.png)'
  merge: -1
  img_proc: true
- pgno: 1101
  md: '# Java与Internet ——端口号


    端口号是用一个16位的整数来表达的，其范围为0～65535，其中0～1023为系统所保留，专门给那些通用的服务（well-known services），如http服务的端口号为80，telnet服务的端口号为21，ftp服务的端口为23，...因此，当我们编写通信程序时，应选择一个大于1023的数作为端口号，以免发生冲突。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_1101_0.png)'
  merge: -1
  img_proc: true
- pgno: 1102
  md: '# Java与Internet —— Java中的网络支持


    针对网络通信的不同层次，Java提供的网络功能有四大类：InetAddress、URL、Socket、Datagram。


    +   - InetAddress面向的是IP层，用于标识网络上的硬件资源。

    +   - URL面向的应用层，通过URL，Java程序可以直接送出或读入网络上的数据。

    +   - Socket和Datagram面向的是传输层。Sockets使用的是TCP协议，这是传统网络程序最常用的方式，可以想象为两个不同的程序通过网络的通信信道进行通信。Datagram则使用UDP协议，是另一种网络传输方式，它把数据的目的地纪录在数据包中，然后直接放在网络上。'
  merge: -1
  img_proc: true
- pgno: 1103
  md: '# 使用InetAddress


    类InetAddress可以用于标识网络上的硬件资源，它提供了一系列方法以描述、获取及使用网络资源。


    InetAddress类实例通常是用它提供的静态方法来获取：


    ```

    public static InetAddress getByName(String host)

    ```


    host可以是一个机器名，也可以是一个形如 “%d.%d.%d.%d”的IP地址或一个DNS域名。


    ```

    public static InetAddress getLocalHost()

    ```


    这两个方法通常会产生UnknownHostException例外，应在程序中捕获处理。


    以下是InetAddress类的几个主要方法：


    ```

    public String getHostAddress(): 获得本对象的IP地址 “%d.%d.%d.%d”。

    ```


    ```

    public String getHostName(): 获得本对象的机器名。

    ```'
