- pgno: 1077
  md: '# 类之间耦合关系


    +   - 零耦合（Nil Coupling）

    +     两个类没有耦合关系

    +   - 具体耦合（Concrete Coupling）

    +     两个具体的（可实例化的）类之间，经由一个类对另一个具体类的直接引用造成的耦合关系

    +   - 抽象耦合（Abstract Coupling）

    +     一个具体类和一个抽象类（或接口）之间的耦合关系'
