- pgno: 230
  md: '# 方法的覆盖


    +   - 在继承的关系中也存在着方法覆盖的概念，所谓的方法覆盖就是指子类定义了与父类中同名的方法，但是在方法覆盖时必须考虑到权限，即： 被子类覆盖的方法不能拥有比父类方法更加严格的访问权限。


    +   - 已学习过的三种访问权限：

    +     - 关于访问权限，实际上前几章读者已经见过三种访问权限了： private、default、public，这三种访问权限的具体作用本书后面会有介绍，读者现在只需要记住大小关系即可：
    private < default < public。


    +   - 所以，如果在父类中使用public定义的方法，子类的访问权限必须是public，否则程序会无法编译。'
