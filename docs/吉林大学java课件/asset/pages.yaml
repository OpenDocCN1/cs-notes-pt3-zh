  md: "# 匹配任意类型的通配符\n\n在开发中对象的引用传递是最常见的，但是如果在泛型类的操作中，在进行引用传递的时候泛型类型必须匹配才可以传递，否则是无法传递的。\n\
    \n```\npublic class GenericsDemo12 {\n    public static void main(String[] args)\
    \ {\n        Info<String> i = new Info<String>();    // 指定Object为泛型类型\n      \
