- pgno: 150
  md: "```\npublic class Test {\n    public static void main (String[] args) {\n \
    \       String s1 = \"hello\";\n        String s2 = \"world\";\n        String\
    \ s3 = \"hello\";\n        System.out.println(s1 == s3); //true\n        s1 =\
    \ new String (\"hello\");\n        s2 = new String (\"hello\");\n        System.out.println(s1\
    \ == s2); //false\n        System.out.println(s1.equals(s2)); //true\n    }\n\
    }\n```\n\n这里我们可以看到，两次用等号判断“hello”是否相等，得到了不同的结果，第二次用equals()方法得到了相等的结果，这是因为用引号和构造方法生成的字符串对象存储的位置不同。我们用引号生成的字符串对象是字符串常量，存储在常量池当中，用构造方法生成的对象存储在堆当中，因此得到了不同的结果"
  merge: -1
