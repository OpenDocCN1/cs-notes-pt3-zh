    +     - public class DataOutputStream extends FilterOutputStream implements DataOutput

    +   - 此类继承自FilterOutputStream类（FilterOutputStream是OutputStream的子类）同时实现了DataOutput接口，在DataOutput接口定义了一系列的写入各种数据的方法。'
