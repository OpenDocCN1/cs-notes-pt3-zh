  md: '# 生成器(Builder)


    # 为何使用？


    +   - 是为了将构建复杂对象的过程和它的部件解耦。注意：是解耦过程和部件。


    +   - 因为一个复杂的对象,不但有很多大量组成部分,如汽车,有很多部件:车轮 方向盘 发动机还有各种小零件等等,部件很多,但远不止这些,如何将这些部件装配成一辆汽车,这个装配过程也很复杂(需要很好的组装技术),Builder模式就是为了将部件和组装过程分开。'
