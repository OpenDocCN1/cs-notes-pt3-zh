- pgno: 658
  md: '# 容器


    # 集合


    +   动态的容量


    +   Collection（类集）：一组单独元素集合


    +   List：保存的对象有顺序，按照元素的索引位置检索对象。允许重复元素。


    +   Set：不允许保存重复的元素。元素之间没有顺序。靠元素值检索对象。


    +   Map（映射）：一组键值对


    +   元素包括“键”对象和“值”对象。键必须是唯一的，值可以重复。'
