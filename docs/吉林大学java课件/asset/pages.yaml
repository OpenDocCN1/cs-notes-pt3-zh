  md: '# 注意：方法命名规范要求


    +   定义类的时候，类的命名规范是：“全部单词的首字母必须大写”。那么在定义方法的时候也是有命名规范要求的：“第一个单词的首字母小写，之后每个单词的首字母大写”，那么这就是方法的命名规范，之前的printInfo()方法也是按此规范定义的。这一点希望读者在日后的开发中一定要养成好的习惯。'
