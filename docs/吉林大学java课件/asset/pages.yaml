  md: '# Socket通信


    无论一个Socket通信程序的功能多么齐全、程序多么复杂，其基本结构都是一样的，都包括以下四个基本步骤：


    +   1、在客户端和服务器方创建 Socket/ServerSocket。

    +   2、打开连接到Socket的输入/输出流。

    +   3、利用输入/输出流，按照一定的协议对Socket进行读/写操作。

    +   4、关闭输入/输出流和Socket。


    通常，我们的主要工作是针对所要完成的功能在第3步进行编程，第1、2、4步对所有的通信程序来说几乎都是一样的。'
