- pgno: 628
  md: "# 将订单数据写入到文件order.txt之中\n\n```\npackage org.lxh.demo12.datademo;\nimport java.io.DataOutputStream;\n\
    import java.io.File;\nimport java.io.FileOutputStream;\npublic class DataOutputStreamDemo\
    \ {\n    public static void main(String[] args) throws Exception {\n        DataOutputStream\
    \ dos = null;                // 声明数据输出流对象\n        File f = new File(\"D:\" +\
    \ File.separator + \"order.txt\");    // 指定文件的保存路径\n        dos = new DataOutputStream(new\
    \ FileOutputStream(f));    // 实例化数据输出流对象\n        String names[] = { \"衬衣\", \"\
    手套\", \"围巾\" };          // 商品名称\n        float prices[] = { 98.3f, 30.3f, 50.5f\
    \ };               // 商品价格\n        int nums[] = { 3, 2, 1 };                \
    \               // 商品数量\n        for (int i = 0; i < names.length; i++) {    \
    \            // 循环写入\n            dos.writeChars(names[i]);                  \
    \         // 写入字符串\n            dos.writeChar('\\t');                        \
    \       // 加入分隔符\n            dos.writeFloat(prices[i]);                     \
    \    // 写入小数\n            dos.writeChar('\\t');                              \
    \ // 加入分隔符\n            dos.writeInt(nums[i]);                             //\
    \ 写入整数\n            dos.writeChar('\\n');                               // 换行\n\
    \        }\n        dos.close();                                            //\
    \ 关闭输出流\n    }\n}\n```"
