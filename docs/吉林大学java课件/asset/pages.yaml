  md: '# 数据类型的转换


    +   - Java的数据类型在定义时就已经确定了，因此不能随意转换成为其它的数据类型，但Java允许用户有限度地做类型转换处理。数据类型的转换方式可分为“自动类型转换”及“强制类型转换”两种。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# # 数据类型的自动转换


    在程序中已经定义好了数据类型的变量，若是用另一种数据类型表示时，Java会在下列条件皆成立时，自动做数据类型的转换：


    +   1. 转换前的数据类型与转换后的类型兼容。


    +   2. 转换后的数据类型的表示范围比转换前的类型大。'
  merge: -1
  img_proc: true
