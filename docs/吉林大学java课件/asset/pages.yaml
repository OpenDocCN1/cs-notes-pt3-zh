- pgno: 465
  md: '# 同步


    +   一个多线程的程序，如果是通过Runnable接口实现的，则意味着类中的属性将被多个线程共享，那么这样一来就会造成一种问题，如果这多个线程要操作同一资源的时候就有可能出现资源的同步问题。例如：以之前的卖票程序来讲，如果多个线程同时操作的时候就有可能出现卖出票为负数的问题。'
  merge: -1
  img_proc: true
- pgno: 466
  md: "# 问题的引出\n\n```\nclass MyThread implements Runnable{        // 实现Runnable接口\n\
    \    private int ticket = 5 ;                // 一共5张票\n    public void run(){\
    \                      // 覆盖run()方法\n        for(int i=0;i<100;i++){         \
    \    // 超出票数的循环\n            if(ticket>0){                   // 判断是否有剩余票\n   \
    \             try {\n                    Thread.sleep(300) ; // 加入延迟\n       \
    \         } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
    \                }\n                System.out.println(\"实票: ticket = \" + ticket--)\
    \ ;\n            }\n        }\n    }\n};\npublic class SyncDemo01 {\n    public\
    \ static void main(String[] args) {\n        MyThread mt = new MyThread() ;  \
    \        // 定义线程对象\n        Thread t1 = new Thread(mt) ;            // 定义Thread对象\n\
    \        Thread t2 = new Thread(mt) ;            // 定义Thread对象\n        Thread\
    \ t3 = new Thread(mt) ;            // 定义Thread对象\n        t1.start() ;       \
    \                     // 启动线程\n        t2.start() ;                          \
    \  // 启动线程\n        t3.start() ;                            // 启动线程\n    }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 467
  md: '# 程序的问题


    +   从运行结果可以发现，程序中加入了延迟操作，所以在运行的最后出现了负数的情况，那么为什么现在会产生这样的问题呢？


    +   从上面的操作代码可以发现对于票数的操作步骤如下：

    +     1、 判断票数是否大于0，大于0则表示还有票可以卖

    +     2、 如果票数大于0，则卖票出去


    +   但是，在上面的操作代码中，在第1步和第2步之间加入了延迟操作，那么一个线程就有可能在还没有对票数进行减操作之前，其他线程就已经将票数减少了，这样一来就会出现票数为负的情况


    ![](img/b706331eacf49a62651c2c9b2de81ca5_467_0.png)'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# 问题的解决


    如果想解决这样的问题，就必须使用同步，所谓的同步就是指多个操作在同一个时间段内只能有一个线程进行，其他线程要等待此线程完成之后才可以继续执行。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_468_0.png)


    ![](img/b706331eacf49a62651c2c9b2de81ca5_468_1.png)'
