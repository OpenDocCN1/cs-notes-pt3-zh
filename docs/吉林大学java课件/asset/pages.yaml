  md: '# Externalizable接口与Serializable接口实现序列化的区别


    | No. | 区别 | Serializable | Externalizable |

    | --- | --- | --- | --- |

    | 1 | 实现复杂度 | 实现简单, Java对其有内建支持 | 实现复杂, 由开发人员自己完成 |

    | 2 | 执行效率 | 所有对象由JAVA统一保存, 性能较低 | 开发人员决定那个对象保存, 可能的速度提升 |

    | 3 | 保存信息 | 保存时占用空间大 | 部分存储, 可能的空间减少 |'
