- pgno: 471
  md: "# 使用同步代码块解决以上的同步问题\n\n```\nclass MyThread implements Runnable{        // 实现Runnable接口\n\
    \    private int ticket = 5 ;                // 一共5张票\n    public void run() {\
    \                     // 覆写run()方法\n        for(int i=0;i<100;i++){          \
    \   // 超出票数的循环\n            synchronized (this) {           // 设置需要同步的操作\n   \
    \             if(ticket>0){               // 判断是否有剩余票\n                    try\
    \ {\n                        Thread.sleep(300) ;     // 加入延迟\n               \
    \     } catch (InterruptedException e) {\n                        e.printStackTrace();\n\
