  md: '# 对象序列化


    +   对象序列化，就是把一个对象变为二进制的数据流的一种方法，通过对象序列化可以方便的实现对象的传输或存储。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_642_0.png)


    +   如果一个类的对象想被序列化，则对象所在的类必须实现 java.io.Serializable接口。此接口定义如下：


    ```

    public interface Serializable{}

    ```'
