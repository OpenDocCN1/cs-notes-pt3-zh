- pgno: 116
  md: '# 垃圾产生的内存关系


    栈内存

    per1

    per2

    Person per1 = null;

    Person per2 = null;


    堆内存

    name = null;

    age = 0;

    name = null;

    age = 0;

    per1 = new Person();

    per2 = new Person();


    栈内存

    per1

    per2

    per1.name = "张三";

    per1.age = 30;


    堆内存

    name = "张三";

    age = 30;

    name = "李四";

    age = 33;

    per2.name = "李四";

    per2.age = 33;


    栈内存

    per1

    per2

    per2 = per1;


    堆内存

    name = "张三";

    age = 30;

    name = "李四";

    age = 33;


    因为per2本身有堆内存的空间指向，所以如果想要再指向per1对应的空间，则必须先断开已有的连接


    因为此空间没有任何的栈内存空间所引用，就形成了垃圾空间，等待垃圾收集机制进行回收'
