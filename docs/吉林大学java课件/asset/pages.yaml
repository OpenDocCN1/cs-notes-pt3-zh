- pgno: 1060
  md: '# 结论


    +   第一，要改，只需更改要改的字，此为**可维护**；

    +   第二，这些字并非用完这次就无用，完全可以在后来来的印刷中重复使用，此乃**可复用**；

    +   第三，此诗若要加字，只需另刻字加入即可，这是**可扩展**；

    +   第四，字的排列其实有可能是竖有可能是横排，此时只需将活字移动就可做到满足排列需求，这是**灵活性好**。


    软件开发经历了过程式开发，转变为面向对象开发，就出现了活字印刷术一样的道理。通过封装、继承、多态把程序的耦合度降低（传统印刷术的问题就在于所有的字都刻在同一版面上造成耦合度太高所制），用设计原则与模式使得程序更加的灵活，容易修改，并且易于复用。'
  merge: -1
  img_proc: true
