- pgno: 364
  md: "# 对象的比较操作\n\n```\nclass Person {\n    private String name ;               \
    \  // 定义name属性\n    private int age ;                     // 定义age属性\n    public\
    \ Person(String name,int age){\n        this.name = name ;                // 为name属性赋值\n\
    \        this.age = age ;                  // 为age属性赋值\n    }\n    public boolean\
    \ equals(Object obj){\n        if(this==obj){\n            return true ;\n   \
    \     }\n        if(!(obj instanceof Person)){\n            return false ;\n \
    \       }\n        Person per = (Person)obj ;         // 将传进来的对象向下转型\n       \
    \ if(per.name.equals(this.name)\n            &&per.age==this.age){\n         \
    \   return true ;                 // 对象内容相等\n        }else{\n            return\
    \ false ;                // 对象内容不等\n        }\n    }\n    public String toString(){\n\
    \        return \"姓名:\" + this.name + \"; 年龄:\" + this.age ;\n    }\n}\n// 定义Person类\n\
    // 通过构造函数设置属性内容\n// 覆盖Object类中的equals()方法\n// 如果两个对象的地址相等，则肯定是同一个对象\n// 判断传进来的对象是否是Person的实例\n\
    // 如果不是，则直接返回false\n// 逐个属性比较，看是否相等\n// 此处覆写toString()方法\n```"
  merge: -1
