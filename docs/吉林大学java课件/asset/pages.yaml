  img_proc: true
- pgno: 470
  md: '# 同步代码块


    +   - 在代码块上加上 “synchronized”关键字的话，则此代码块就称为同步代码块。

    +   - 同步代码块格式:

    +     - `synchronized(同步对象){`

    +       需要同步的代码；

    +     `}`'
