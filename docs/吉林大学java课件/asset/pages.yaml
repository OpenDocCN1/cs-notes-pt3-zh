  md: '# 浮点数类型与双精度浮点数类型


    在日常生活中经常会使用到小数类型的数值，如身高、体重等需要精确的数值时，整数就不能满足程序设计者的要求了。在数学中，这些带有小数点的数值称为实数，在Java里，这种数据类型称为浮点数类型（float），其长度为32个字节，有效范围为-3.4E1038
    到 3.4E1038。当浮点数的表示范围不够大的时候，还有一种双精度（double）浮点数可供使用。双精度浮点数类型的长度为64个字节，有效范围为-1.7E10308
    到1.7E10308。'
