  md: '# 事件与事件处理


    JFrame

    Test

    Exit

    事件源

    ActionEvent

    actionPerformed(ActionEvent e)

    监听器（ButtonListener）


    首先，对于某种类型的事件XXXEvent，要想接收并处理该类事件，必须定义相应的事件监听器类，这个类需要实现针对该类事件的特定接口XXXListener。


    其次，事件监听器类要实现该接口XXXListener中对事件处理的方法。


    第三，对于事件源，必须使用

    addXXXListener(XXXListener)注册事件监听器类，以便当事件产生时，能够被监听器接收和处理。'
