  md: "# 程序的问题\n\n+   - 在不同的操作系统中，路径的分隔符表示是不一样的，例如：\n+     - Windows中使用反斜杠表示目录的分隔符：“\\\
    ”；\n+     - Linux中使用正斜杠表示目录的分隔符：“/”。\n+   - 那么，既然Java程序本身具有可移植性的特点，则在编写路径的时候最好可以根据程序所在的操作系统可以进行自动使用符合本地操作系统要求分隔符，这样才能达到可移植性的目的，想想实现这样的功能，则就需要观察File类中提供的两个常量。\n\
