- pgno: 555
  md: '# 字节流与字符流


    +   在java.io包中操作文件内容的主要有两大类：字节流、字符流，两类都分为输入和输出操作。在字节流中输出数据主要是使用OutputStream完成，输入使的是InputStream，在字符流中输出主要是使用Writer类完成，输入主要是使用Reader类完成。'
  merge: -1
  img_proc: true
- pgno: 556
  md: '# 操作流程


    在JAVA中IO操作也是有相应步骤的，以文件操作为例，主要的操作流程如下：


    +   A、使用File类打开一个文件

    +   B、通过字节流或字符流的子类，指定输出的位置

    +   C、进行读/写操作

    +   D、关闭输入/输出'
  merge: -1
  img_proc: true
- pgno: 557
  md: '# 字节流


    字节流主要是操作byte类型数据，以byte数组为准，主要操作类就是 OutputStream、InputStream。


    +   - 字节输出流：OutputStream

    +   - 字节输入流：InputStream'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# OutputStream类


    +   OutputStream是整个io包中字节输出流的最大父类，此类的定义如下：

    +     public abstract class OutputStream extends Object implements Closeable,
    Flushable


    +   从以上的定义中可以发现，此类是一个抽象类，如果要想使用此类的話，则首先必须通过子类实例化对象，那么如果现在要操作的是一个文件，则可以使用：FileOutputStream类。通过向上转型之后，可以为
    OutputStream实例化'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# OutputStream类的常用方法


    | No. | 方法或常量 | 类型 | 描述 |

    |---|---|---|---|

    | 1 | public void close() throws IOException | 普通 | 关闭输出流 |

    | 2 | public void flush() throws IOException | 普通 | 刷新缓冲区 |

    | 3 | public void write(byte[] b) throws IOException | 普通 | 将一个byte数组写入数据流 |

    | 4 | public void write(byte[] b,int off,int len) throws IOException | 普通 | 将一个指定范围的byte数组写入数据流
    |

    | 5 | public abstract void write(int b) throws IOException | 普通 | 将一个字节数据写入数据流
    |


    要想使用以上方法，必须使用子类实例化，此时使用FileOutputStream子类，此类的构造方法如下：


    ```

    public FileOutputStream(File file) throws FileNotFoundException

    ```'
