- pgno: 701
  md: '# AWT/Swing/SWT比较


    +   1、 SWT(Standard Widget Toolkit)

    +   2、 初始开发者： IBM的一个部门独立研发

    +   3、 目的： 替代AWT/Swing，外观和本地操作系统一样，并且性能优异。

    +   4、 原理： 调用操作系统本地库，达到外观一样和提高运行速度问题。

    +   5、 缺点： 每一种操作系统都需要有匹配的本地库供SWT调用。'
