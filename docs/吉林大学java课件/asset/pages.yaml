- pgno: 412
  md: '# Java命名规范


    读者通过本书或者从JDK的文档中可以发现，声明类、方法、属性等都是有一定的规范的，此规范如下所示：


    +   类：所有单词的首字母大写，如： TestJava


    +   方法：第一个单词的首字母小写，之后每个单词的首字母大写，如： getInfo()


    +   属性：第一个单词的首字母小写，之后每个单词的首字母大写，如： studentName


    +   包：所有单词的字母小写，如：： org.lxh.demo


    +   常量：所有单词的字母大写，如： FLAG'
