- pgno: 308
  md: '# 设计层面区分接口、抽象类


    既然 open、close 和 alarm 属于两个不同的概念，应该把它们分别定义在代表这两个概念的抽象类中。定义方式有：


    +   1. 两个概念都使用 abstract class 方式定义；

    +   2. 两个概念都使用 interface 方式定义；

    +   3. 一个概念使用 abstract class 方式定义，另一个概念使用 interface 方式定义。


    显然，由于 Java 语言不支持多重继承，所以两个概念都使用 abstract class 方式定义是不可行的。后面两种方式都是可行的，但是对于它们的选择却反映出对于问题领域中的概念本质的理解、对于设计意图的反映是否正确、合理。我们一一来分析、说明。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 使用interface方式来定义


    如果两个概念都使用interface方式来定义，那么就反映出两个问题：


    +   1、我们可能没有理解清楚问题领域，AlarmDoor在概念本质上到底是Door还是报警器？（注：接口是 “like a”,抽象类是 “is a”）


    +   2、如果我们对于问题领域的理解没有问题，比如：我们通过对于问题领域的分析发现AlarmDoor在概念本质上和Door是一致的，那么我们在实现时就没有能够正确的揭示我们的设计意图，因为在这两个概念的定义上（均使用interface方式定义）反映不出上述含义。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 解决方案二


    如果我们对于问题领域的理解是：

    AlarmDoor在概念本质上是Door，同时它有具有报警的功能，即它 “like a”报警器。


    我们该如何来设计、实现来明确的反映出我们的意思呢？前面已经说过，abstract class在Java语言中表示一种继承关系，而继承关系在本质上是"is a"关系。所以对于Door这个概念，我们应该使用abstract
    class方式来定义。另外，AlarmDoor又具有报警功能，说明它又能够完成报警概念中定义的行为，所以报警概念可以通过interface方式定义。如下所示：'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# 解决方案二\n\n```\nabstract class Door {\n    abstract void open();\n    abstract\
    \ void close();\n}\n```\n\n```\ninterface Alarm {\n    void alarm();\n}\n```\n\
    \n```\nclass AlarmDoor extends Door implements Alarm {\n    void open() { ...\
    \ }\n    void close() { ... }\n    void alarm() { ... }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 解决方案二结论


    这种实现方式基本上能够明确的反映出我们对于问题领域的理解，正确的揭示我们的设计意图。


    +   1 abstract class表示的是 “is a”关系

    +   2 interface表示的是 “like a”关系


    大家在选择时可以作为一个依据，当然这是建立在对问题领域的理解上的，比如：如果我们认为 AlarmDoor在概念本质上就是报警器，同时又具有 Door的功能，那么上述的定义方式就要反过来了。'
