  md: '# 面向对象设计原则概述


    # 软件的可维护性和可复用性


    知名软件大师 Robert C.Martin 认为一个可维护性 (Maintainability) 较低的软件设计，通常由于如下 4 个原因造成：


    +   - 过于僵硬(Rigidity)：添加功能难

    +   - 过于脆弱(Fragility)：易出故障

    +   - 复用率低(Immobility)：效率

    +   - 黏度过高(Viscosity)：影响复用


    ![](img/b706331eacf49a62651c2c9b2de81ca5_947_0.png)'
