- pgno: 955
  md: '# 面向对象设计原则概述


    # 面向对象设计原则简介


    ✓ 常见的面向对象设计原则包括7个，这些原则并不是孤立存在的，它们相互依赖，相互补充。


    | 设计原则名称 | 设计原则简介 | 重要性 |

    |---|---|---|

    | 单一职责原则 (Single Responsibility Principle, SRP) | 类的职责要单一，不能将太多的职责放在一个类中 | ★★★★☆
    |

    | 开闭原则 (Open-Closed Principle, OCP) | 软件实体对扩展是开放的，但对修改是关闭的，即在不修改一个软件实体的基础上去扩展其功能
    | ★★★★★ |

    | 里氏代换原则 (Liskov Substitution Principle, LSP) | 在软件系统中，一个可以接受基类对象的的地方必然可以接受一个子类对象
    | ★★★★☆ |

    | 依赖倒转原则 (Dependency Inversion Principle, DIP) | 要针对抽象编程，而不要针对具体类编程 | ★★★★★ |

    | 接口隔离原则 (Interface Segregation Principle, ISP) | 使用多个专门的接口来取代一个统一的接口 | ★★☆☆☆
    |

    | 合成复用原则 (Composite Reuse Principle, CRP) | 在系统中应该尽量多使用组合和聚合关联关系，尽量少使用甚至不使用继承关系
    | ★★★★☆ |

    | 迪米特法则 (Law of Demeter, LoD) | 一个软件实体对其他实体的引用越少越好，或者说如果两个类不必彼此直接通信，那么这两个类就不应当发生直接的相互作用，而是通过引入一个第三者发生间接交互
    | ★★★★☆ |'
  merge: -1
  img_proc: true
- pgno: 956
  md: '# 单一职责原则


    # 单一职责原则定义


    +   ✓ 单一职责原则(Single Responsibility Principle, SRP)定义如下：

    +     • 一个对象应该只包含单一的职责，并且该职责被完整地封装在一个类中。


    +   ✓ 其英文定义为：

    +     • Every object should have a single responsibility, and that responsibility
    should be entirely encapsulated by the class.


    +   ✓ 另一种定义方式如下：

    +     • 就一个类而言，应该仅有一个引起它变化的原因。


    +   ✓ 其英文定义为：

    +     • There should never be more than one reason for a class to change.


    ![](img/b706331eacf49a62651c2c9b2de81ca5_956_0.png)'
  merge: -1
  img_proc: true
- pgno: 957
  md: '# 单一职责原则


    # 单一职责原则分析


    +   ✓ 一个类（或者大到模块，小到方法）承担的职责越多，它被复用的可能性越小，而且如果一个类承担的职责过多，就相当于将这些职责耦合在一起，当其中一个职责变化时，可能会影响其他职责的运作。

    +   ✓ 类的职责主要包括两个方面：数据职责和行为职责，数据职责通过其属性来体现，而行为职责通过其方法来体现。

    +   ✓ 单一职责原则是实现高内聚、低耦合的指导方针，在很多代码重构手法中都能找到它的存在，它是最简单但又最难运用的原则，需要设计人员发现类的不同职责并将其分离，而发现类的多重职责需要设计人员具有较强的分析设计能力和相关重构经验。'
  merge: -1
  img_proc: true
