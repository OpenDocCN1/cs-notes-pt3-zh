- pgno: 299
  md: '# 类型隐藏


    在面向对象领域，抽象类主要用来进行类型隐藏。

    我们构造出一个固定的一组行为的抽象描述，但是这组行为却能够有任意个可能的具体实现方式(即规定了“做什么”，没有规定“怎么做”，因为“怎么做”在当时还不能确定)。这个抽象描述就是抽象类，而这一组任意个可能的具体实现则表现为所有可能的派生类。类型隐藏就是把这些派生类隐藏起来。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 语法定义区分接口、抽象类


    使用abstract class的方式定义Demo抽象类的方式如下：


    ```

    abstract class Demo {

    abstract void method1();

    abstract void method2();

    ...

    }

    ```


    使用interface的方式定义Demo抽象类的方式如下：


    ```

    interface Demo {

    void method1();

    void method2();

    ...

    }

    ```


    在abstract class方式中，Demo可以有自己的数据成员，也可以有非abstract的成员方法，而在interface方式的实现中，Demo只能有静态的不能被修改的数据成员（也就是必须是public
    static final的，不过在interface中一般不定义数据成员），所有的成员方法都是abstract的。从某种意义上说，interface是一种特殊形式的abstract
    class。'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 编程层面区分接口、抽象类


    从编程的角度来看，abstract class和interface都可以用来实现抽象类的思想。但是在具体的使用上面还是有一些区别的。


    首先，abstract class在Java语言中表示的是一种继承关系，一个类只能使用一次继承关系。但是，一个类却可以实现多个interface。可能这是Java语言的设计者在考虑Java对于多重继承的支持方面的一种折中考虑。'
