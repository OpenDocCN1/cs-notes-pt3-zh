- pgno: 966
  md: '# 里氏代换原则


    # 里氏代换原则定义


    +   里氏代换原则(Liskov Substitution Principle, LSP)有两种定义方式，第一种定义方式相对严格，其定义如下：

    +   - 如果对每一个类型为S的对象o1，都有类型为T的对象o2，使得以T定义的所有程序P在所有的对象o1都代替成o2时，程序P的行为没有变化，那么类型S是类型T的子类型。


    +   其英文定义为：

    +   - If for each object o1 of type S there is an object o2 of type T such that
    for all programs P defined in terms of T, the behavior of P is unchanged when
    o1 is substituted for o2 then S is a subtype of T.


    +   第二种更容易理解的定义方式如下：

    +   - 所有引用基类（父类）的地方必须能透明地使用其子类的对象。


    +   其英文定义为：

    +   - Functions that use pointers or references to base classes must be able to
    use objects of derived classes without knowing it.'
  merge: -1
  img_proc: true
- pgno: 967
  md: '# 里氏代换原则


    # 里氏代换原则分析


    里氏代换原则由2008年图灵奖得主、美国第一位计算机科学女博士、麻省理工学院教授 Barbara Liskov 和卡内基梅隆大学 Jeannette Wing
    教授于1994年提出。其原文如下： Let q(x) be a property provable about objects x of type T. Then
    q(y) should be true for objects y of type S where S is a subtype of T.


    周以真（Jeannette M. Wing），美国计算机科学家，卡内基梅隆大学教授，美国国家自然基金会计算与信息科学工程部助理部长，ACM和IEEE会士。


    芭芭拉·利斯科夫（Barbara Liskov），美国计算机科学家，2008年图灵奖得主，2004年约翰·冯诺依曼奖得主，美国工程院院士，美国艺术与科学院院士，美国计算机协会会士。现任麻省理工学院电子电气与计算机科学系教授。她是美国第一个计算机科学女博士。


    ![](img/b706331eacf49a62651c2c9b2de81ca5_967_0.png)


    ![](img/b706331eacf49a62651c2c9b2de81ca5_967_1.png)'
