    \ + \"test.txt\");        // 声明File对象\n        // 第2步：通过子类实例化父类对象\n        Reader\
    \ reader = null;                                        // 准备好一个输入的对象\n      \
    \  reader = new FileReader(f);                                  // 通过对象多态性，进行实例化\n\
    \        // 第3步：进行读操作\n        int len = 0;                                  \
    \               // 用于记录读取的数据个数\n        char b[] = new char[1024];           \
    \                        // 所有的内容读到此数组之中\n        int temp = 0;              \
    \                                  // 接收读取的每一个内容\n        while ((temp = reader.read())\
    \ != -1) {\n            // 将每次的读取内容给temp变量，如果temp的值不是-1，则表示文件没有读完\n          \
    \  b[len] = (char) temp;\n            len++;\n        }\n        // 第4步：关闭输入流\n\
    \        reader.close();                                              // 关闭输入流\n\
