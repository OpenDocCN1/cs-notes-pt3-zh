    \ false;                               // 修改标志位\n    }\n}\npublic class StopDemo\
    \ {\n    public static void main(String[] args) {\n        MyThread my = new MyThread();\
    \                    // 实例化Runnable接口对象\n        Thread t = new Thread(my, \"\
    线程\");               // 建立线程对象\n        t.start();\n        try(Thread.sleep(10);\n\
    \        }\n        catch(Exception e){}\n        // 启动线程\n        my.stop();\
