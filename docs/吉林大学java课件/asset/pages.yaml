  md: "# 修改Person类并实现Externalizable接口\n\n```\npublic class Person implements Externalizable\
    \ {    // 此类的对象可以被序列化\n    private String name;                         // 声明name属性\n\
    \    private int age;                             // 声明age属性\n    public Person(){}\
    \                            // 必须定义无参构造\n    public Person(String name, int age)\
