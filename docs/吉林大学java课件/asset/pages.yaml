- pgno: 1028
  md: '# 单例模式(Singleton)


    在这个类被加载时，静态变量 m_instance 会被初始化，此时类的私有构造子会被调用。这时候，单例类的惟一实例就被创建出来了。


    Java 语言中单例类的一个最重要的特点是类的构造子是私有的，从而避免外界利用构造子直接创建出任意多的实例。值得指出的是，由于构造方法是私有的，因此，此类不能被继承。'
