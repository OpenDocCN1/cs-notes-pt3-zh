  md: "# 简单工厂模式怎么来使用呢？\n\n```\n//工厂类角色\npublic class Driver{\n//工厂方法。注意:返回类型为抽象产品角色\n\
    \    public static Car driverCar(String s)throws Exception {\n//判断逻辑，返回具体的产品角色给Client\n\
