    \                 lab.setText(text.getText()); // 将文本文字设置到标签\n               \
    \ }\n            }\n        });    // 此处加入动作监听\n        frame.addWindowListener(new\
    \ WindowAdapter(){    // 加入窗口监听, 覆写窗口关闭的方法\n            public void windowClosing(WindowEvent\
    \ arg0){\n                System.exit(1);    // 系\n            }\n        });\n\
