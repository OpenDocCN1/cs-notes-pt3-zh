    # SOAP HTTP Binding


    +   - SOAP 方法指的是遵守 SOAP 编码规则的 HTTP 请求/响应：

    +     HTTP + XML = SOAP

    +   - SOAP 请求可能是 HTTP POST 或 HTTP GET 请求。

    +   - SOAPAction字段： 用于指示SOAP HTTP请求的目的

    +   - SOAP遵从用于在HTTP中表示通讯状态的语义

    +   - HTTP扩展框架： SOAP消息可以与HTTP Extension Framework一起使用来标识SOAP HTTP请求'
