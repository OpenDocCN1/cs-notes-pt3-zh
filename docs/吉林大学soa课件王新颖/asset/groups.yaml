  - '[PAGE 14]


    # SOA解析


    +   - SOA: Service-Oriented Architecture

    +     - S: 服务（Service）

    +       反应消息的终点

    +     - SO: 面向服务（Service-Orientation）

    +       一种体系框图

    +     - SOA: 面向服务的体系架构

    +       一种反应面向服务原则的体系架构'
  - '[PAGE 15]


    # What is SOA?


    +   - Just like *object* a generation ago, *services* is now the killer buzzword.
    However, SOA is a often misu


    > "My a... pers insist... should be m... t isn’t what..."


    ![](img/431d4828d5c6073b7e23d9eca159cdeb_15_0.png)


    +   - "In computing, service-oriented architecture (SOA) provides a set of principles
    of governing concepts used during phases of systems development and integration."'
