    # 案例剖析


    +   - 搭建并开发定制了基础数据服务、数据信息服务总线和业务流程管理平台等应用集成平台。


    +   - 在全省实现了办公自动化、专卖、营销、客户关系管理、财务、烟叶系统的单点登录、用户体验层面的集成和数据服务统一集成，以及与国家局重点项目的互联互通。


    +   - 满足国家局行业平台的技术要求：集成平台采用省、市两级部署，与国家局生产经营决策管理系统平台一致；应用基础架构符合《烟草行业信息化建设统一技术平台要求》


    +   - 信息系统初步体现集成整合优势。信息系统按统一的标准建设，系统可定制性增强，可适应一定程度的业务变化，系统生命周期有效延长，总体降低了信息化建设的成本'
  - '[PAGE 360]


    # 青岛市网上审批系统案例


    +   - 案例特点

    +     - 建设类型：逐级建设，从易到难，分步实施

    +     - 解决问题：集成青岛“451”架构，连接市内各纵向部门，解决在没有审批大厅情况下的部门间并联审批

    +     - 关注点：同时关注资源共享与业务协同

    +     - 建设层次：多层次建设

    +   - 业务背景

    +     - 网上审批系统包括审批系统和监察系统两部分青岛市没有建立统一行政服务大厅，申请人需要多次往返政府各相关部门'
  - '[PAGE 361]


    # 业务剖析


    +   - 原有技术框架

    +     - 2002年开始实施电子政务工程，已初步建成由四个平台、五个中心、一套资源目录构成的“451”技术体系

    +     - 在此基础上，市网上审批系统提出了如下要求:

    +       - 在内、外网物理隔离的条件下，实现“外网受理—内网办理—外网反馈”的工作模式

    +       - 网上受理和现场受理相结合

    +       - 实现“一站式”服务

    +       - 对部门已有审批管理系统应具有较强的整合能力

    +       - 充分利用已有电子政务技术设施，并与其紧密集成'
  - '[PAGE 362]


    # 流程划分及服务提取


    +   服务抽象原则：

    +   - 省市区都独立部署一套审批应用

    +   - 业务原型涉及到多个委办局，各委办局私有有一个独立的异构系统来支撑其内部的流转

    +   - 审批过程需要在公网上进行材料和信息的传递

    +   - 工作流引擎支持对审批的流程架构的BPEL4People标准转换，工作流可以按照步骤、组、流程来抽象Web服务接口，业务流程按照其审批的逻辑业务过程划分为服务单元。'
  - '[PAGE 363]


