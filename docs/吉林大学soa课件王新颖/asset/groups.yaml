  mdcn: "\n## SOA in Five Slides(4): SOA实践\n\n在理论上，理论和实践是一致的。在实践中则并非如此\n\nL.Berra\n\
    \n- 在SOA付诸实施时，需要考虑性能、安全等因素\n- SOA是针对出于维护中的现有系统的策略\n- 从IT角度看，所有的系统都不一样\n- 是否引入SOA并不重要，重要的是对于上下文环境和用户需求来说，引入到IT解决方案是否合适！！\n\
    \n## SOA in Five Slides(5): SOA的监管★★\n\n- 正确的监管方法和恰当的监管力度是SOA需要重要考虑的问题。\n  - 需要在集中化和分散化之间找到正确的平衡点\n\
    \  - 需要合适的人员作为“服务基础设施”的服务提供者\n  - 首先解决重要的事情，不要力图解决所有服务或提供所有的基础设施，“SOA系统是可以成长的！”\n\
    \  - SOA是影响公司整体战略的决策，需要公司管理层的支持，配以足够的时间和经费以支持长期的调研和开发\n\n## SOA设计的基础概念\n\n###\
    \ Lecture 1\n\n### 服务（Service）\n\n### 服务的故事\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_41_0.png)\n\
    \n农业时代，咖啡是自给自足的\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_41_1.png)\n\n工业时代，咖啡馆，每杯2元\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_41_2.png)\n\n星巴克，体验经济的咖啡，每杯25元\n\n\
    > 星巴克卖的不是咖啡，是‘寂寞’！\n\n### 服务的定义\n\n- 能通过URL识别的软件程序，通过互联网协议用以支持网络间不同机器的互动操作(W3C)\n\
    - 服务独立于其运行的硬件平台、编程语言和操作系统，是由一系列自包含、可复用的软件模块组成。一个服务定义了一个与业务功能或业务数据相关的接口，在不同的系统中服务可以以一种统一的方式进行交互、相互理解(IBM)。\n\
    \n### 服务规范\n\n- 服务规范有三个规范要素，根据服务的建模类型可对它们进行选择：\n  - 结构规范：定义了可以调用的操作和由这些操作销毁或创造出的消息。\n\
    \  - 行为规范：表示服务客户和所指定服务之间的任意预期的有意义的协议或会话。\n  - 策略规范：表示服务的策略主张和约束。策略主张可能包括安全性、可管理性等等。\n\
    \n### SOA服务的基本特征\n\n- 1. 服务的封装(encapsulation)\n- 2. 服务的重用(reuse)\n- 3. 服务的互操作(interoperability)\n\
    - 4. 服务是自治的(Autonomous)功能实体\n- 5. 服务之间的松耦合度(Loosly Coupled)\n- 6. 服务是位置透明的(location\
    \ transparency)\n- 7. 明确定义的接口(well defined interface)\n\n### 服务构成\n\n### 策略是规则集\n\
    \n- 在这些条件和规则之下，服务提供者可以使服务可用于使用者，在功能和服务质量两个部分中都有策略功能。\n\n### 安全性是规则集\n\n- 用于验证服务使用者的身份验证、授权和访问控制。\n\
    \n### 事务是属性集\n\n- 用于一组服务，以提供一致的结果。使用一组服务来完成一项业务功能时，要么所有的服务必须都完成，或者没有一个完成。\n\n\
    ### 管理是属性集\n\n- 应用于管理提供的服务或使用的服务。\n\n## SOA设计的基础概念\n\n### Lecture 2\n\n### Web\
    \ Service vs. Web Services\n\n### Web Services和Web Service\n\n- Web Services(Web服务技术)是整个架构Web服务的技术框架，包括\n\
    \  - XML\n  - SOAP\n  - WSDL\n  - UDDI\n- Web Service是指使用Web Services而架构出来的Web服务实例，简称Web服务。\n\
    \n### Web服务产生的背景\n\nlog (people per computer)\n\nyear\n\nMainframe\n\nMinicomputer\n\
    \nWorkstation\n\nPC\n\nLaptop\n\nPDA\n\nMotes\n\nRFID\n\nNumber Crunching\nData\
    \ Storage\n\nProductivity\nInteractive\n\nStreaming information to/from physical\
    \ world\n\n### Web服务发展简史\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_49_0.png)\n\
    \n### Web服务的定义\n\n- IBM的定义\n  - Web服务是一种接口，它描述了一组操作，可以使用标准的XML消息传递技术，经由网络访问这些操作。\n\
    - Microsoft的定义\n  - Web服务是一个向其他应用提供数据和服务的应用逻辑单元。应用程序通过无处不在的Web协议和数据格式访问Web服务，如HTTP、XML和SOAP，而无需关心每个Web服务是如何实现的。\n\
    - SUN定义\n  - Web服务是软件构件。这类构件具有被发现、可组合和重组合的特性，用于解决用户的问题或要求，Java语言和XML是Web服务的最重要技术。\n\
    \n### Web服务开发的生命周期\n\n- 开发\n  - 开发和测试 Web 服务实现、定义服务接口描述和定义服务实现描述\n  - 通过创建新的 Web\
    \ 服务、把现有的应用程序变成 Web 服务\n  - 由其它 Web 服务和应用程序组成新的 Web 服务提供 Web 服务的实现\n- 部署\n  -\
    \ 向服务请求者或服务注册中心发布服务接口和服务实现的定义\n  - 把Web 服务的可执行文件部署到执行环境 (Web 服务器) 中\n- 运行\n  -\
    \ 调用 Web 服务\n  - Web 服务完全部署、可操作并且服务提供者可以通过网络访问服务\n- 管理\n  - 持续的管理和经营 Web 服务应用程序。安全性、可用性、性能、服务质量和业务流程\n\
    \n### 基础Web服务协议栈\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_53_0.png)\n\n###\
    \ Web服务的实现\n\n- 机密性\n- 授权\n- 数据完整性\n- 原始性证明\n\n- 服务描述\n- 服务实现\n- 服务发布、发现和绑定\n\
    - 服务调用和执行\n\n### Web服务管理的衡量标准\n\n- 性能：吞吐量和延迟\n- 可用性：服务是否存在或已就绪可供立即使用\n- 可靠性：能够维持服务和服务质量的程度\n\
    - 完整性：指 Web 服务如何维护交互的正确性\n- 安全性：消息加密以及访问控制\n- 常规性：遵循标准和已建立的服务级别协议\n- 可访问性：能够为Web服务请求提供服务的程度\n\
    - 可伸缩性：始终如一地为请求提供服务的能力\n\n### Web服务的技术挑战\n\n- 异构性\n- 开放性\n- 安全性\n- 并发性\n- 透明性\n\
    - 可扩展性\n- 故障与容错\n\nSOA\n\n## SOA设计的基础概念\n\n### Lecture 3\n\n### 服务计算及其形式化表示方法\n\
    \n### 关于计算\n\n- 分布式计算\n- 并行计算\n- 普遍计算\n- 移动计算\n- 网格计算\n- 效用计算\n\n- 云计算\n- 虚拟计算\n\
    - 栅计算\n- 服务计算\n- ……\n\n### 服务计算的产生及发展\n\n- 2001年， IBM倡导动态电子商务向Web Services转型\n\
    - 2002年6月，美国拉斯维加斯举行国际互联网计算会议\n- 2003年6月，美国拉斯维加斯举行第一届Web服务国际会议\n- 2003年11月， IEEE成立服务计算技术社区\n\
    - 2004年5月， 改名为服务计算技术指导委员会\n- 2004年9月， 服务计算技术指导委员会在上海召开第一届服务计算专题国际会议\n\n### 服务科学\n\
    \n- 服务计算理论\n  - 模型\n  - 理论\n  - 实验\n  - 行为\n  - 规则\n\n### 服务工程\n\n- 服务系统的工程开发\n\
    \  - 规范、技术\n  - 方法、工具\n  - 自动化\n  - 度量性\n\n### 服务管理\n\n- 服务质量和性能\n  - 优化\n  -\
