    - 完整性：指 Web 服务如何维护交互的正确性\n- 安全性：消息加密以及访问控制\n- 常规性：遵循标准和已建立的服务级别协议\n- 可访问性：能够为Web服务请求提供服务的程度\n\
    - 可伸缩性：始终如一地为请求提供服务的能力\n\n### Web服务的技术挑战\n\n- 异构性\n- 开放性\n- 安全性\n- 并发性\n- 透明性\n\
    - 可扩展性\n- 故障与容错\n\nSOA\n\n## SOA设计的基础概念\n\n### Lecture 3\n\n### 服务计算及其形式化表示方法\n\
