    ```\n\n## XML文档定义\n\n- XML有两种方法定义数据元素：\n  - DTD\n  - XML Schema\n- 文档类型定义(Document\
    \ Type Definition， DTD)\n  - 元素(Element)的定义规则\n  - 元素之间的关系规则\n  - 属性(Attribute)的定义规则\n\
    - XML Schema： 是一种以XML语言为基础的，用于可替代DTD。\n\n## XML Schema\n\n- XML SCHEMA是W3C推荐的XML规范(2001.5)，是以XML语言为基础的，用于可替代DTD\n\
