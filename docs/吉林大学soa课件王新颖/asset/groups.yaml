  - '[PAGE 22]


    # Service-Orientation的优势


    +   - 技术角度

    +     - 一种新的应用软件的建模方式

    +     - 松耦合，对以往紧的系统进行解耦

    +     - 基于标准的互操作性，微软、IBM、Oracle等互操作

    +   - IT行业管理

    +     - 拓扑图独立，SO允许各系统的拓扑进行更新和变化

    +     - 利用异构资源，独立的进行部署和管理

    +   - 商业角度

    +     - 提高业务的敏捷性，减少产品上市时间

    +     - 通过重用提高效率'
