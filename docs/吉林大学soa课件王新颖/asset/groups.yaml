  md: "\n## Web service invoke - Ajax\n\n## What is Ajax?\n\n- AJAX (shorthand for\
    \ asynchronous JavaScript and XHTML) is a group of interrelated web development\
    \ techniques used on the client-side to create interactive web applications or\
    \ rich Internet applications.\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_275_0.png)\n\
    \n```html\n<input type=button value=\"ajaxcall\" onClick=\"Ajax_Call ('http://xyz.com/a.jsp?id=123'\
    \ );\" />\n```\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_276_0.png)\n\n```javascript\n\
    function Ajax_Call(myurl, callfunc){\n    if (window.XMLHttpRequest) {\n     \
    \   req = new XMLHttpRequest();\n    } else if (window.ActiveXObject) {\n    \
    \    req = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }\n    if( req ) {\n\
    \        var localurl;\n        var isrefresh=true;\n        if(isrefresh) {\n\
    \            localurl = addTimeStamp1(myurl);\n        } else{\n            localurl\
    \ = myurl;\n        }\n        req.open(\"GET\", localurl, true);\n        req.onreadystatechange\
    \ = callfunc;\n        req.send(null);\n    }\n}\n```\n\n```javascript\n<script\
    \ type=\"text/javascript\" src=\"scripts/prototype.js\"></script>\n<script type=\"\
    text/javascript\" src=\"scripts/ws.js\"></script>\n<script type=\"text/javascript\"\
    >\nfunction sayHello(name, container) {\n\tvar call = new WS.Call('/AjaxWS/services/HelloWorld');\n\
    \tvar nsuri = 'http://example';\n\tvar qn_op = new WS.QName('sayHello',nsuri);\n\
    \tvar qn_op_resp = new WS.QName('sayHelloResponse',nsuri);\n\tcall.invoke_rpc(\n\
    \t\tqn_op,\n\t\tnew Array( {name:'name',value:name} ),\n\t\tnull,\n\t\tfunction(call,envelope)\
    \ {\n\t\t\tvar ret = envelope.get_body().get_all_children()[0].get_all_children()[0].get_value();\n\
    \t\t\tcontainer.innerHTML = ret;\n\t\t\t$('soap').innerHTML = arguments[2].escapeHTML();\n\
    \t\t}\n\t);\n}\n</script>\n```\n\n## Ajax Web Services (2)\n\n- Then calling the\
    \ sayHello function\n\n```html\n<body>\n<input name=\"name\" id=\"name\" />\n\
    <input value=\"Invoke the Web Service\" type=\"button\" onclick=\"sayHello($('name').value,$('result'))\"\
    \ />\n<div id=\"container\">Result:\n<div id=\"result\"></div>\n<div id=\"soap\"\
    ></div>\n</div>\n</body>\n```\n\nPlease refer to the source code: ws-ajax-web-service-code.zip\
    \ OR\n\n- http://www.simple-talk.com/dotnet/asp.net/calling-cross-domain-web-services-in-ajax/\n\
    \n## Ajax is not just Web Service\n\n```javascript\n<script type=\"text/javascript\"\
    >\n    document.write(unescape(\"%3Cscript src='http://arnetminer.org/js/arnet.js'\
    \ type='text/javascript'%3E%3C/script%3E\"));\n</script>\n```\n\n```javascript\n\
    <script type=\"text/javascript\">\n    arnet_socialGraph(\"jie tang\",900,650);\n\
    </script>\n```\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_279_0.png)\n\n## Representational\
    \ State Transfer (REST)\n\n## Two Camps on Web Services\n\n- Two Camps\n  - SOAP,\
    \ WS-* / XML-RPC\n  - REST (Representational State Transfer)\n- What is REST?\n\
    \  - Discussed in a PhD thesis by Roy Fielding\n  - When client traverses link,\
    \ accesses new resource (i.e., transfers state)\n  - Uses existing standards,\
    \ e.g., HTTP\n\n## Detailed REST methods\n\n- HTTP provides a simple set of operations.\
    \ Amazingly, all Web exchanges are done using this simple HTTP API:\n  - GET =\
    \ \"give me some info\" (Retrieve)\n  - POST = \"here's some update info\" (Update)\n\
    \  - PUT = \"here's some new info\" (Create)\n  - DELETE = \"delete some info\"\
    \ (Delete)\n- The HTTP API is CRUD (Create, Retrieve, Update, and Delete)\n\n\
    ## Difference between GET/POST\n\n- GET:\n  - For information retrieval\n  - Data\
    \ will be attached in URL\n    - Example: login.action?name=hyddd&password=idontknow\n\
    \    - Length Limit: IE (2083bytes), depends on OS/Browser\n- POST:\n  - Anything\n\
    \  - Data will be in the body of HTTP package\n\n## Process of RESTful involving\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_285_0.png)\n\n## JSON Example\n\n###\
    \ XML\n\n```xml\n<menu id=\"file\" value=\"File\">\n<popup>\n<menuitem value=\"\
    New\" onclick=\"CreateNewDoc()\" />\n<menuitem value=\"Open\" onclick=\"OpenDoc()\"\
    \ />\n<menuitem value=\"Close\" onclick=\"CloseDoc()\" />\n</popup>\n</menu>\n\
    ```\n\n### JSON\n\n```json\n{\"menu\": { \"id\": \"file\", \"value\": \"File\"\
    ,\n\"popup\": {\n\"menuitem\": [\n{\"value\": \"New\", \"onclick\": \"CreateNewDoc()\"\
    },\n{\"value\": \"Open\", \"onclick\": \"OpenDoc()\"},\n{\"value\": \"Close\"\
    , \"onclick\": \"CloseDoc()\"}\n]\n}\n}}\n```\n"
