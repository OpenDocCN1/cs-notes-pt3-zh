  md: "\n## 整体解决方案——实施模式\n\n- 结合“自顶向下和自底向上”两种策略\n- 同时实现长期和短期的需求\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_364_0.png)\n\
    \n## 整体解决方案——技术方案\n\n应用\n\n审批服务网站\n\n网上审批系统\n\n电子监察系统\n\n扩展应用\n\n开发工具和SOA服务建模\n\
    \n业务框架\n\nGSP业务服务平台（组织机构服务、业务权限服务身份认证服务、工作日志……）\n\nGPM业务流程服务管理\n\nGEM业务实体服务管理\n\
    \n应用集成服务（适配器）\n\nWSEngine（WEB服务引擎）\n\nSOA服务架构\n\n技术框架\n\n服务注册与管理\n\n业务组件\n\n内容管理\n\
    \n消息平台\n\n模型驱动\n\n企业服务总线（ESB）\n\n系统平台层（数据库、操作系统、应用中间件、消息中间件）\n\n## 整体解决方案——实施方案\n\
    \n- 青岛市网上审批项目组是由浪潮和微软共同组成\n- SOA架构师 Service Modeling, Architecture Design\n- 项目经理\
    \ Project Management\n- 产品专家 Design, Process Choreography, Product Support\n-\
    \ 业务专家 Business Analysis, Coding\n- 程序员 Programmer Coding\n\n## 整体解决方案——实施步骤\n\
    \n- 服务建模：通过分析业务需求定义出需要的业务服务，建立服务模型。\n- 架构设计：确定服务的实现架构、关键技术的实现方式。\n- 服务组装：对已确定实现的业务服务进行组装，以实现企业业务流程。\n\
    - 服务、服务中介等的实现：具体的业务服务的开发，包括服务接口定义、业务服务代码的编写、组件装配等。\n\n## 采纳标准\n\n- 行业标准\n  - 电子政务相关标准\n\
    - 技术标准和规范\n  - 组件规范方面使用了 WCF\n  - 流程管理方面使用了 XPDL/BPEL\n  - 安全方面使用了 WS_Security、\
    \ XACML2.0\n  - 消息传递方面使用了 SOAP\n  - 数据描述方面使用了 XML、 XML Schema\n  - 服务描述和注册方面使用了\
    \ WSDL、 UDDI\n\n## 成果\n\n- 2005年，青岛市网上审批平台工程启动，349项审批事项已经全部上网，其中一部分能够实现网上受理、内部流转的功能\n\
    - 2006年10月，开始建设市级网上审批系统，切实提高区市级政府的服务水平，提高政府的办公效率，改善投资环境\n- 截至到2008年，全市12区市已经完成审批平台的搭建，实现了全程审批信息化的目标，取得了很好的社会效益\n\
    - 2006年6月开始建设行政审批电子监察系统，并在全市进行推广，截至到2008年初，全市已形成了一网流转，同步监察，全程监控的应用模式，提大的提高了整个青岛市电子政务的应用水平，改善了政府公共服务的能力。\n\
    \n## 食品安全检测监控信息系统\n\n### 案例特点\n\n- 建设类型：中心扩展法\n- 解决问题：系统集成\n- 建设层次：多层次\n\n###\
    \ 业务背景\n\n- 食品安全法制、食品安全标准、食品安全检验检测、食品安全市场准入和食品安全社会信用五大体系的建设\n- 食品安全卫生与安全涉及领域广，监管体系、标准体系与检验检测体系滞后，检测资源整合度不高。\n\
    - 各部门系统间没有进行业务协作和数据共享\n\n## 业务剖析——监管检测业务流程\n\n监管部门（卫生监督所）\n\n发布食品安全通告\n\n现场抽样\n\
