    # The SOA Layers--2


    +   - Layer 2: Enterprise components layer

    +     - Enterprise components that are responsible for realizing functionality
    and maintaining the QoS of the exposed services.

    +     - Managed, governed set of enterprise assets that are funded at the enterprise
    or the business unit level.

