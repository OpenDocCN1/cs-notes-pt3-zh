  md: "\n## Lecture 2\n### SOA用户案例\n\n### 按建设范围划分\n\n- 组织内部\n  - 指在某个公司或单位内部各部门应用之间的IT互联互通，包括纵向应用集成，如集团企业各级子公司及分支机构的IT系统建设。\n\
    - 组织之间\n  - 主要是解决不同组织之间的业务系统协同及数据交换问题，如供应链协作及跨委办局的政府服务，此类集成涉及范围更广、复杂性更高。\n\n###\
    \ 按建设层次划分\n\n- 单层次\n  - 解决某个用户自己的IT建设需求，如单个企业内部项目、或政府同一级别的多个单位之间的项目。\n- 多层次\n\
    \  - 解决大型集团用户或者政府国家部委的集中式信息化建设需求，涉及从总部到下属分支机构之间的信息资源及业务系统互联互通。\n\n### SOA项目实施团队\n\
    \n| 项目角色 | 职责 | 合作对象 | 技能要求 | 支持工具 |\n| --- | --- | --- | --- | --- |\n| SOA 架构师\
    \ | 方案设计，需求分析，架构确定，服务构件建模，运维建模，业务与服务构件转换 | 任何其他项目团队成员，包括业务处室代表 | 通常的IT架构能力，J2EE技术，XML，XML\
    \ schema，Web services，SOA概念，平台，项目实践经验，业务知识 | UML编辑器，Office套件 |\n| 服务建模工程师 | 接口设计，WSDL编辑\
    \ | 业务分析师，SOA架构师，服务开发工程师 | WSDL，XML schema，J2EE命名空间技术 | WSDL编辑器，Java-to-WSDL generators\
    \ |\n| 流程设计师 | 业务建模，服务链组装 | 服务建模工程师，业务分析师，SOA架构师，业务代表 | BPEL4WS，WSDL | 图形化流程设计工具，实时通讯支持\
    \ |\n| 服务开发工程师 | 服务提供方编程，服务需求方编程，SOAP消息包的解析，文档编程 | 服务建模工程师，业务分析师，SOA架构师，测试工程师\
    \ | J2EE，XML，SOAP，WSDL | Web services wizards in IDEs，WSDL-to-Java generators\
    \ |\n| 互操作性测试工程师 | WSDL检查，SOAP封装跟踪，性能测试，问题定位 | 服务开发工程师 | SOAP，WSDL，WS-I profiles\
    \ | TCP/IP tunnels and monitors，WSI测试工具 |\n\n### SOA典型行业和领域\n\n- 金融行业\n- 电信行业\n\
    - 烟草行业\n- 交通行业\n- 电子政务行业\n- 医疗卫生行业\n- 物流行业\n- 钢铁行业\n- B2B领域\n\n### 行业、特点及成功案例\n\
    \n| 行业/案例 | 特点 | 建设类型 | 实施切入点 | 实施类型 | 解决问题 | 关注点 | 实施范围 | 建设层次 |\n| --- | ---\
