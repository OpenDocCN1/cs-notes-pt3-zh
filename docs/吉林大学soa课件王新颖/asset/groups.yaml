    # 案例剖析


    +   - 采用标准

    +     - J2EE、、 web service、 http、 xml、 WfMC等

    +   - 价值

    +     - 项目建设的周期大大缩短，一期只花了4人3个月的时间，工作量节省了40%左右

    +     - 同一个项目在不同期中引入了不同的开发团队，实现增量开发，提升了项目实施的控制能力

