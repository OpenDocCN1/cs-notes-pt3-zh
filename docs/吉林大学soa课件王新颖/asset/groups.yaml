    \ \"give me some info\" (Retrieve)\n  - POST = \"here's some update info\" (Update)\n\
    \  - PUT = \"here's some new info\" (Create)\n  - DELETE = \"delete some info\"\
    \ (Delete)\n- The HTTP API is CRUD (Create, Retrieve, Update, and Delete)\n\n\
    ## Difference between GET/POST\n\n- GET:\n  - For information retrieval\n  - Data\
    \ will be attached in URL\n    - Example: login.action?name=hyddd&password=idontknow\n\
    \    - Length Limit: IE (2083bytes), depends on OS/Browser\n- POST:\n  - Anything\n\
    \  - Data will be in the body of HTTP package\n\n## Process of RESTful involving\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_285_0.png)\n\n## JSON Example\n\n###\
    \ XML\n\n```xml\n<menu id=\"file\" value=\"File\">\n<popup>\n<menuitem value=\"\
    New\" onclick=\"CreateNewDoc()\" />\n<menuitem value=\"Open\" onclick=\"OpenDoc()\"\
    \ />\n<menuitem value=\"Close\" onclick=\"CloseDoc()\" />\n</popup>\n</menu>\n\
    ```\n\n### JSON\n\n```json\n{\"menu\": { \"id\": \"file\", \"value\": \"File\"\
    ,\n\"popup\": {\n\"menuitem\": [\n{\"value\": \"New\", \"onclick\": \"CreateNewDoc()\"\
    },\n{\"value\": \"Open\", \"onclick\": \"OpenDoc()\"},\n{\"value\": \"Close\"\
    , \"onclick\": \"CloseDoc()\"}\n]\n}\n}}\n```\n"
