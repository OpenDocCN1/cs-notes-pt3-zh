  md: "\n## Service-Oriented Modeling & Analysis\n\nModeling, analysis, design techniques\
    \ and activities to define the foundations of a SOA.\n\n- Define the **elements**\
    \ in each of the SOA layers\n- Make **critical architectural decisions** at each\
    \ level.\n- Hybrid approach\n  - Top-down: business driven\n  - Bottom-up: leverage\
    \ legacy investments\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_173_0.png)\n\n\
    ## Why OOAD, BPM, EA are not enough\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_174_0.png)\n\
    \n## Service-Oriented\n\nBusiness Layer  \nService Layer  \nComponent Layer  \n\
    \nFunctional Domain  \nBusiness Process  \nBusiness Services  \nSoftware Services\
    \  \nSoftware Component  \n\nHuman Resources  \nManage Employees  \nRecruitment\
    \  \nEmployee  \nRecruitment Service  \nEmployee Service  \nVacancy Component\
    \  \nApplication Component  \nEmp. Record Component  \nCareer Component  \n\n\
    ![](img/431d4828d5c6073b7e23d9eca159cdeb_175_0.png)\n\n## SOA Design Principles\n\
    \n- Service categorization and aggregation  \n  服务分类和聚合\n- Specification  \n \
    \ 服务规范制定\n- Process: meet-in-the-middle  \n  中间过程结合\n\n## SOA: Method & Process\n\
    \n- Identification\n  - Domain Decomposition\n  - Goal-Service Modeling\n  - Existing\
    \ System Analysis\n- Specification\n  - Component Flow specification\n  - Subsystem\
    \ Analysis\n  - Service specification\n  - Service Flow specification\n  - Information\
    \ specification\n  - Component specification\n  - Message & event specification\n\
    - Realization\n  - Service realization decisions\n  - Service allocation to components\n\
    \  - Component layer\n\n## Service Identification\n\nIdentifies services through\n\
    \n- Domain decomposition (Top down analysis)\n- Existing system analysis (Bottom\
    \ up analysis)\n- Goal service modeling\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_178_0.png)\n\
    \nIdentification Specification Realization\n\n## Service Specification\n\n- Service\
    \ categorization\n- Service flow specification\n- Message and events specification\n\
    - Subsystem analysis\n- Component specification\n\n## Service Realization\n\n\
    - Decision making of service realization approach\n- Allocation services to components\n\
    - Allocation components to SOA layers\n\n## SOA的分析与建模\n\n## BPM & BPEL\n\n## 基于SOA的业务流程管理\n\
    \n- 业务流程建模与分析\n- 业务流程模拟及优化\n- 业务流程快速装配和部署实施\n- 业务流程绩效管理\n- 业务创新和流程持续优化\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_182_0.png)\n\
    \n## 业务流程\n\n按业务流程之间的协作方式可以分为单工作流模式和多工作流模式：\n\n- 单工作流模式把一组相关的服务按一定顺序和条件组合执行，完成某项业务，流程执行过程中涉及的服务不属于其他业务流程；\n\
    - 多工作流模式是两个或两个以上的工作流程并行执行并进行交互的业务流程模式，多工作流模式侧重于业务流程之间的交互。\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_183_0.png)\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_183_1.png)\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_183_2.png)\n\
    \n## BPM Example\n\nExample:\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_185_0.png)\n\
    \n## What is BPEL\n\n- Business Process Execution Language (BPEL)\n  - BPEL is\
    \ an OASIS standard executable language for specifying interactions with Web Services.\n\
    - WS-BPEL extends the Web Services interaction model and enables it to support\
    \ business transactions.\n- WS-BPEL provides a language for the specification\
    \ of Executable and Abstract business processes.\n\n## WS-BPEL Process\n\n- Made\
    \ up of “Activities” – the individual steps of a process\n- Activities are implemented\
    \ by Web Services\n- WS-BPEL process is itself represented as Web Services\n-\
    \ Specifies order in which participating Web Services should be invoked\n- Error\
    \ handling\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_188_0.png)\n\n## BPEL Process\
    \ for Business Travels\n\n## BPEL的基本结构\n\n```xml\n<process name=\"ncname\" targetNamespace=\"\
    uri\"\n    queryLanguage=\"anyURI\"?\n    expressionLanguage=\"anyURI\"?\n   \
    \ suppressJoinFailure=\"yes|no\"?\n    enableInstanceCompensation=\"yes|no\"?\n\
    \    abstractProcess=\"yes|no\"?>\n    <partnerLinks>? ... </partnerLinks>\n \
    \   <partners>? ... </partners>\n    <variables>? ... </variables>\n    <correlationSets>?\
    \ ... </correlationSets>\n    <faultHandlers>? ... </faultHandlers>\n    <compensationHandlers>?\
    \ ... </compensationHandlers>\n    <eventHandlers>? ... </eventHandlers>\n   \
    \ activity\n</process>\n```\n"
