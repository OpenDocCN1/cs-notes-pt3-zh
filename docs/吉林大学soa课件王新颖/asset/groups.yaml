    \ | 厂商、用户主导 | 集成、新应用、创新变革 | 资源共享、业务协同 | 跨组织 | 多层次 |\n| 业务 | 国家税务总局SOA整合平台 | 一步到位\
    \ | 流程 | 用户主导 | 系统集成 | 业务协同 | 跨组织 | 多层次 |\n| 业务 | 交通部海事局应急辅助指挥系统 | 逐级建设 | 信息 |\
    \ 用户主导 | 集成、新系统开发 | 资源共享、业务协同 | 组织内 | 单层次 |\n| 物流 | 中国航天科技集团“航天型号物资管理信息平台” | 逐级建设\
