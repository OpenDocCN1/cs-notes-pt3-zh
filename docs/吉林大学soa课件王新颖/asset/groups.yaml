    \n- 企业通过Internet这样松散的环境进行控制，其结构会面临严重的稳定性问题\n- SOA非常强调架构中提供服务的功能实体完全独立自主的能力，强调实体自我管理和恢复能力\n\
    \n2、大数据量低频率访问\n\n- SOA采用大数据量的方式一次性进行信息交换\n\n3、基于文本的消息传递\n\n- 基于文本的消息本身不包含任何处理逻辑和数据类型，保证异构系统间信息的兼容性\n\
    \n# SOA的相关标准\n\n- XML & XML Schema\n- WSDL\n- SOAP\n- UDDI\n- QoS\n\nWeb Service三要素\n\
    \n# SOA的优劣\n\n- SOA通过互联网发布，突破企业内网限制，实现与供应链上下游伙伴业务的紧密结合；\n- SOA的平台无关性，减少了业务应用实现的限制；\n\
    - SOA具有低耦合性特点，增加和减少业务伙伴对整个业务系统的影响较低；\n- SOA具有可按模块分阶段进行实施的优势；\n- SOA的实施可能并不具有成本显著性。\n\
    \n# SOA的切实效益\n\n- 改良的集成及内在互操作性\n- 内在的复用\n- 改进的架构与方案\n- 保护遗产系统\n- 建立标准的XML数据表示\n\
    - 聚焦通信基础设施投资\n- “最优供给”可替代\n- 组织敏捷性\n\n# SOA的发展趋势\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_32_0.png)\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_32_1.png)\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_32_2.png)\n\
    \n# SOA在中国\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_33_0.png)\n\n在中国，接受调查的企业中，有40.7%表示将会不同程度地部署SOA。\n\
    \n# 基于SOA的方法与设计\n\n## SOA设计的基础概念\n\n王新颖\n\nxinying@jlu.edu.cn\n\n# SOA in Five\
    \ Slides (1): SOA\n\n- 面向服务的架构（SOA）是一个范式，其目的是实现和维护跨越大部分分布式系统的业务流程\n- SOA基于三个主要技术和概念\n\
    \  - 服务：一项自足的业务功能，集中关注接口的业务价值，填补“业务/IT”鸿沟。\n  - 企业服务总线：SOA基础设施，使得分布式系统和服务之间的高互操作性成为可能，简化了分布式业务在不同平台和技术的众多系统间的工作流程。\n\
    \  - 松耦合：减少系统间的相互依赖，将个别系统的修改和故障对系统的影响降至最低。\n\n# SOA in Five Slides (2): 政策和过程\n\
    \n- 分布式处理不仅仅是个技术细节，系统引入新功能，涉及多个系统和团队，必须协作。\n- 构建一个SOA系统，需要清晰地定义角色、政策和过程。\n\n>\
    \ 做一个编程系统产品比做一个简单的程序的成本高9倍  \n> Fred Brooks，1974\n\n# SOA in Five Slides (3):\
    \ Web Service\n\n- Web Service是实现SOA的有效技术手段之一\n- Web Service自身的问题\n  - 标准不够成熟，不能保证互操作性\n\
    \  - 无法形成程度适当的松耦合\n- 设计SOA系统，不能掉进过于Web Service化的陷阱。Web Service不会是系统集成的终极标准，因此只有当Web\
    \ Service对特定的基础设施考量确实重要时，才应把它加进来发挥作用。\n"
