  md: "\n## SOA的形式化表示\n\n- 三个角色\n  - 提供者\n  - 使用者\n  - 注册中心\n- 三个操作\n  - Publish\n\
    \  - Find\n  - Bind & invoke\n- SoaRole = `<Provider, Registry, Consumer>`\n\n\
    ![](img/431d4828d5c6073b7e23d9eca159cdeb_78_0.png)\n\n## 面向服务视图\n\n- WSDL2JAVA\n\
    - JAVA2WSDL\n- UDDI\n- 发现与定位\n- 发布\n- XML\n- XML\n- 浏览器AJAX\n- 发现与定位\n- 客户端（机器）\n\
    - 运行时\n- 操作服务\n- 资源\n\n## SOA设计的基础概念\n\n### Lecture 4\n\n### SOA方法学\n\n- 广义上讲，SOA方法学贯穿于IT生命周期的各个阶段和各个方面：IT系统项目的规划、系统分析和设计、系统的实施、系统的部署和维护，以及整个过程中的监控和管理等。\n\
    - 从实践角度说，已经出现的SOA方法学：\n  - 面向服务的分析和设计（SOAD）\n  - 面向服务的开发过程\n  - SOA的成熟度分析和迁移路线图\n\
    \  - SOA监管\n\n### 传统方法学\n\n- 流程建模（BPM）\n- 企业架构（EA）和方案架构（SA）\n- 面向对象的分析和设计（OOAD）\n\
    \n![](img/431d4828d5c6073b7e23d9eca159cdeb_82_0.png)\n\n### SOA方法学\n\n- 面向服务的分析和设计贯穿项目开发的三个阶段和IT系统的三个领域\n\
    - 在操作层面，OOAD与其他方法学紧密相联。\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_83_0.png)\n\
    \n## 面向服务的建模和架构（SOMA）概述\n\n- 服务发现\n  - 域分解\n  - 目标服务建模\n  - 现有系统分析\n- 服务规约\n \
    \ - 组件动态模型规约\n  - 子系统分析\n  - 服务流规约\n  - 信息模型规约\n  - 组件规约\n  - 服务规约\n  - 消息和事件规约\n\
    - 服务实现\n  - 服务实现决策\n  - 服务分配到组件\n  - 组件层次化\n\n## 第3章 SOA基本技术\n\n王新颖  \nxinying@jlu.edu.cn\n\
    \n### Lecture 1\n\n### Web Evolution（Web技术的演化）\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_86_0.png)\n\
    \n- HTML/XHTML\n- 超链接\n- 表现技术：Blog、TAG、SNS、RSS、Wiki等\n- 依据XML、AJAX、REST等新理论和技术实现\n\
    - Web Services\n- Web Science\n\n## Web1.0：以静态、单向阅读为主\n\n- Web1.0以编辑为特征，网站提供给用户的内容是网站编辑处理后提供的，这个过程是网站到用户的单向行为。\n\
    - 该时期的代表站点：新浪、搜狐、网易三大门户网站\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_88_0.png)\n\
    \n## Web2.0：以分时为特征的实时网络\n\n- Web2.0加强了网站与用户之间的互动，实现了网站与用户之间的双向交流与参与\n- Web1.0是一个图书馆，Web2.0是一个社交圈\n\
    - 这个时期的典型代表：baidu、google、博客中国、中华英才网、人人网、校内网等\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_89_0.png)\n\
    \n## Web2.0的特征\n\n- 访问者可以对网页进行修改（如亚马逊网站 Amazon）\n- 通过页面将用户联系起来（如 Facebook 和 MySpace\
    \ 等社交网络）\n- 高效的分享内容（如 YouTube、MetaCafe）\n- 获取信息的有效途径（如 RSS，Really Simple Syndication）\n\
    - 除计算机外，人们还可以利用其它设备上网（如手机、视频游戏机、电视机……）\n\n## 语义网 Web3.0\n\n- Web3.0的最大价值不是提供信息，而是提供基于不同需求的过滤器，每一种过滤器都是基于一个市场需求。\n\
    - Web2.0解决了个性解放的问题，Web3.0则是解决信息社会机制的问题，即最优化信息聚合的问题。\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_91_0.png)\n\
    \n## Web3.0特征分析\n\n- Web3.0是建立在Web2.0基础上的，实现了更加“智能化的人与人、人与机器的交流”功能的互联网模式。\n- 从广播电视媒体网络化角度，划分其四大特征：\n\
    \  - 微内容（Widget）的自由整合与有效聚合\n  - 适合多种终端平台，实现信息服务的普适性\n  - 良好的个性化用户体验，以及基础性的个性化配置\n\
    \  - 有效和有序的数字新技术\n- Web3.0以网络化和个性化为特征，提供更多人工智能服务。\n\n## Web3.0的发展趋势\n\n- 基于用户的一个需求点，力图在一个平台上整合所有的互联网服务\n\
    \  - 例如博客中国向综合阵营的靠拢，腾讯转型为综合性门户等\n- 在用户个别需求点上进行深度挖掘，纵深发展\n  - 淘宝、奇虎、Donews等公司仅就业务领域进行划分，并没有依据人群进行细分，其运作模式还是Web2.0的延续，信息散乱\n\
    - Web3.0关键在于提供用户偏好的个性化聚合服务\n\n## Web4.0展望\n\n- Web1.0——信息共享；Web2.0——信息共建；Web3.0——知识传承；Web4.0——知识分配。\n\
    - Radar Networks公司的Nova Spivack绘制了一份未来25年的网络进化图，他没有明确指出Web4.0具体的来临日期和所需技术，但每个阶段的发展以10年为期限是真实而可信的。\n\
    - 互联网下一次显著进化将使其成为一个包含语义网络的平台，这一理念是合情理的。\n\n### Lecture 1\n\n### 软件体系结构\n\n- 分层体系结构\
    \ layers\n- 管道和过滤器体系结构 pipes and filters\n- 模型-视图-控制器（MVC）\n- 微内核体系结构 micro kernel\n\
    - Service Oriented Architecture\n\n### SOA\n\n| 视角 | 说明 |\n|---|---|\n| 业务模型 |\
    \ 企业向其客户暴露的一系列业务——“服务” |\n| Roles | 一种体系结构风格，包括服务的提供者、服务的使用者与服务中介。 |\n| 体系结构 |\
    \ 一组体系结构设计原则与模式，强调模块化、封装、松散耦合、分离关注点、可复用、可组合性、接口与实现分离等特性。 |\n| 软件实现方式 | 一种编程模式，包括一系列的标准、开发工具、开发过程指南、运行时基础架构。\
    \ |\n\n### SOA参考架构层次图\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_98_0.png)\n\n\
    | 英文/组件 | 中文 |\n|---|---|\n| Consumers | 消费者层 |\n| Business Process<br>Composition,\
    \ choreography, business state machines | 业务流程层 |\n| Services<br>atomic and composite\
    \ | 服务层 |\n| Service Components | 服务组件层 |\n| Existing Application Assets | 现有应用资产层\
    \ |\n| Channel |  |\n| B2B |  |\n| Packaged Application |  |\n| Custom Application\
    \ |  |\n| OO Application |  |\n| Service Consumer |  |\n| Service Provider | \
    \ |\n| Integration (Enterprise Service Bus) | 集成服务层 |\n| QoS (Security, Management\
    \ & Monitoring Infrastructure & Services) | 服务质量层 |\n| Data Architecture (meta-data)\
    \ & Business Intelligence | 数据架构层 |\n| Governance | 治理层 |\n\n## 企业服务总线（Enterprise\
    \ Service Bus）\n\n- Portal Service\n- Collaboration Tools\n- B2B Interactions\n\
    - Process Orchestration\n- Business Intelligence Services\n- Applications & Data\n\
    - Service Registry\n- Common Runtime Environment\n"
