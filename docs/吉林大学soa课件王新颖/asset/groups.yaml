  - '[PAGE 28]


    # SOA的基本特征


    +   1、独立的功能实体

    +   - 企业通过Internet这样松散的环境进行控制，其结构会面临严重稳定性问题

    +   - SOA非常强调架构中提供服务的功能实体的完全独立自主的能力，强调实体自我管理和恢复能力

    +   2、大数据量低频率访问

    +   - SOA采用大数据量的方式一次性进行信息交换

    +   3、基于文本的消息传递

    +   - 基于文本的消息本身是不包含任何处理逻辑和数据类型，保证异构系统间信息的兼容性'
