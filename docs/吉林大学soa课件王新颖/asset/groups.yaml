    \ | 核心扩展 | 信息 | 厂商主导 | 系统集成 | 资源共享 | 组织内 | 多层次 |\n| 其他 | 华电对标系统 | 逐级建设 | 流程 |\
    \ 用户主导 | 新应用建设 | 业务协同 | 组织内 | 多层次 |\n| 其他 | 阿里巴巴信息系统 | 逐级建设 | 流程 | 用户、厂商主导 | 系统集成\
    \ | 业务协同 | 组织内 | 多层次 |\n\n### 交通银行管理系统统一应用平台\n\n- 案例特点\n  - 建设类型：一步到位法\n  - 实施类型：用户主导\n\
    \  - 建设范围：组织内\n- 业务背景\n  - 交通银行于2005年成功完成大集中工程，标志着IT建设迈入了新的阶段\n  - 各个业务部门的MIS系统建设需求源源不断涌现，开发部门无法完全自主开发来响应业务部门的需求\n\
    \n### 业务剖析\n\n- 原有技术框架问题\n  - 如何有效的保证系统实施的速度和质量？\n  - 如何改变IT部门被动满足业务要求的局面？\n \
    \ - 如何能够通过建立更加灵活的IT架构，以更好的适应这种不断变化的要求？\n  - 如何保证各个系统之间良好的整合能力？\n  - 如何通过IT模式的转变，提升操作用户体验和工作效率？\n\
    \  - 如何形成有效的IT资产沉淀，使得新应用开发时，可以最大限度复用已有的构件、框架、模型？\n\n### 整体解决方案——项目组织结构\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_344_0.png)\n"
