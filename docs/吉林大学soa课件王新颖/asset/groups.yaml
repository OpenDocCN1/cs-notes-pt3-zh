    SOA服务总线\n\nSOA方案\n\n## 两种方案的比较\n\n## 传统数据交换解决方案\n\n## SOA解决方案\n\n局限性在于：相对于两两应用系统之间，如果实现数据交换，则需要在两系统之间单独建立接口适配器。这样的话，如果有N个系统需要进行数据交换、资源整合的话，则需要建立(N-1)^2个适配器，需要花费大量的资源进行此项工作；并且，各个适配器不能兼容，通过甲适配器发出的数据完全不能被乙适配器接收\n\
    \n优势在于：通过业界公认的标准体系，建立标准的适配器，每个系统都可以通过SOA适配器发布标准的SOA服务，然后发布到服务总线上，这样，这个服务就是共有的，任何系统只要有SOA服务的需求，都可以在服务总线上寻找到相应的服务。对于SOA方案，每个系统在建设时，只要按照标准调用SOA适配器，大大节省了建立不同适配器的资源\n\
    \n## 航天集团 “航天型号物资管理信息平台”\n\n- 案例特点\n  - 建设类型： 逐级建设法\n  - 切入点： 从流程切入\n  - 解决问題：\
    \ 业务创新变革\n  - 实施范围： 跨组织\n- 业务背景\n  - 型号物资管理信息化是集团信息化建设的重要组成部分，用于规范采购、存储、产品生产的全过程管理\n\
    \  - 本项目由神舟软件公司承担项目咨询、实施和交付服务工作，炎黄盈动公司提供基于BPM和SOA架构的业务基础平台\n\n## 业务剖析\n\n- 军工物资管理的特点\n\
    \  - 具有贯穿全系统的质量主线\n  - 严格的物资管理计划协调\n    - 军工产品研制任务具有严格的时间点要求\n    - 物资配套工作是根据整体研制节点和生产情况而制定配套计划，研制周期的紧迫性和强制性对采购供应的准确性、及时性提出了高要求\n\
    \  - 强调战略协作伙伴关系\n    - 军工企业与供应商之间是战略协作伙伴关系\n  - 对物资选用实行目录管理\n    - 超出优选目录范围的物资严格进行管控\n\
    \n## 业务剖析 (cont.)\n\n- 研制背景\n  - 信息标准不统一\n  - 各单位物资管理信息化功能相对较为单一、建设水平不平衡\n  -\
    \ 技术实现方式差别大，改进整合困难\n- 总体定位\n  - 强化基础标准，形成统一业务语言，强制执行\n  - 形成自动化的软件机制，把正确的信息在正确的时刻送给正确的人\n\
    \  - 完成信息服务、业务支撑、决策支持三大功能\n\n## 整体解决方案\n\n- 信息化目标\n  - 提供供应商及其产品信息、价格信息和质量问题通报等相关基础信息的快速反应和查询服务\n\
    \  - 支撑所有军工物资采购供应业务全过程\n  - 分析决策是指对物资的全生命周期的信息进行分析与综合，为决策提供数据支持\n- 功能框架\n  - 物资业务区和综合管理区\n\
    \  - 物资标准区\n  - 系统接口区\n\n## 整体解决方案——功能框架\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_382_0.png)\n\
    \n## 整体解决方案——技术架构\n\n吉林大学\n\ncsw.jlu.edu.cn\n\nSZ-Portal 工具（界面集成、单点登录、用户统一管理）\n\
    \n门户系统\n\n电子商务管理\n\n设计选用管理\n\n新型物资管理\n\n采购供应管理\n\n供应商管理\n\n物资数据管理\n\n分析决策管理\n\n\
    物资业务\n\n综合管理\n\n物资标准管理\n\n业务系统\n\n系统接口\n\nSZ-BPM ENGINE 业务流程管理引擎\n\nSZ-SEARCH\
    \ ENGINE 搜索引擎\n\nSZ-DS ENGINE 数据同步引擎\n\nSZ-FI ENGINE 文件接口引擎\n\nSZ-REPORT ENGINE\
    \ 报表引擎\n\nSZ-BI ENGINE 商业智能引擎\n\nJ2EE XML OR Mapping、XML Engine、Webservice、JMS、SOAP、Java\
    \ Mail\n\n业务集成平台\n\n技术基础\n\n基础软件（防病毒、备份、数据库、J2EE Web 服务器）\n\n操作系统（Windows 2003\
    \ Server）\n\n硬件环境（网络环境、防火墙、服务器）\n\n基础环境\n\n## 采纳或参考的标准\n\n- 与XML相关的XML、XSL、XML\
    \ Schema等标准；\n- 与SOA架构相关的WS-*系列、SCA、SDO等标准；\n- 与BPM相关的BPEL、BPMN、XPDL等标准\n- 与MDA架构相关的UML、OMG相关标准及EMF建模工具标准。\n"
