    \  - 具有贯穿全系统的质量主线\n  - 严格的物资管理计划协调\n    - 军工产品研制任务具有严格的时间点要求\n    - 物资配套工作是根据整体研制节点和生产情况而制定配套计划，研制周期的紧迫性和强制性对采购供应的准确性、及时性提出了高要求\n\
    \  - 强调战略协作伙伴关系\n    - 军工企业与供应商之间是战略协作伙伴关系\n  - 对物资选用实行目录管理\n    - 超出优选目录范围的物资严格进行管控\n\
    \n## 业务剖析 (cont.)\n\n- 研制背景\n  - 信息标准不统一\n  - 各单位物资管理信息化功能相对较为单一、建设水平不平衡\n  -\
    \ 技术实现方式差别大，改进整合困难\n- 总体定位\n  - 强化基础标准，形成统一业务语言，强制执行\n  - 形成自动化的软件机制，把正确的信息在正确的时刻送给正确的人\n\
    \  - 完成信息服务、业务支撑、决策支持三大功能\n\n## 整体解决方案\n\n- 信息化目标\n  - 提供供应商及其产品信息、价格信息和质量问题通报等相关基础信息的快速反应和查询服务\n\
    \  - 支撑所有军工物资采购供应业务全过程\n  - 分析决策是指对物资的全生命周期的信息进行分析与综合，为决策提供数据支持\n- 功能框架\n  - 物资业务区和综合管理区\n\
    \  - 物资标准区\n  - 系统接口区\n\n## 整体解决方案——功能框架\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_382_0.png)\n\
