    \n王新颖\n\nxinying@jlu.edu.cn\n\n## Lecture 1\n\n## SOA项目实施准备\n\n## SOA效益分析\n\n\
    - 提高业务效率和用户满意度\n  - 依托松耦合性和重用性，减少利用现有服务和IT资产组装新业务应用的时间，提高上市速度和开发效率\n  - 创建与具体技术和最终用户设备无关的服务，以保证一致的用户体验，提高用户的满意度。\n\
    - 提高互操作性和可用性\n  - 遵循开放的标准化协议、应用于厂商多样性的环境\n- 提高投资回报率\n  - 服务的松耦合及平台中立降低了集成和维护成本\n\
    \n## SOA标准体系\n\n应用\n\n应用标准\n\n架构\n\n集成开发标准\n\n表示层标准\n\n业务流程标准\n\n服务描述和发现标准\n\n\
    消息传递标准\n\n交互操作标准\n\n安全性标准\n\n事务性标准\n\n可靠性标准\n\n质量保证标准\n\n服务管理标准\n\n基础\n\nXML及相关标准\n\
    \n网络传输标准\n\n## SOA项目实施需求来源\n\n- 系统整合驱动\n  - 应用系统之间的数据整合\n  - 功能整合\n  - 流程整合\n\
    - 新系统建设驱动\n  - 管理上：新业务的变换使现有系统远远不能满足需求\n  - 技术上：手工编码、缺乏总体架构的设计，注定无法全面适应系统需求变更的需要\n\
    \n## SOA项目的实施\n\n- 战略规划阶段\n  - 企业或组织的决策部门需要进行**业务规划**\n  - IT管理团队对当前IT系统的功能、性能、问题、基础架构、平台、标准以及需要满足的需求等各方面进行**IT规划**，确定IT整体的建设策略、建设路线以及组织结构。\n\
    - 项目实施阶段\n  - 服务规划与设计\n  - 服务开发\n  - 服务测试\n  - 服务发布\n  - 服务组装运行\n  - 管理流程变化\n\n\
    ![](img/431d4828d5c6073b7e23d9eca159cdeb_322_0.png)\n\n## 战略规划过程\n\n## 项目实施过程\n\
    \n## SOA项目实施关键要素\n\n![](img/431d4828d5c6073b7e23d9eca159cdeb_323_0.png)\n\n##\
    \ SOA的项目分析\n\n- 组织角度\n  - 分析SOA的目标、SOA的范围、用户SOA的经验度、各业务部门的参与程度\n- 业务角度\n  - 分析业务的规范性、业务优化的要求、业务协作性需求、业务的时限要求、业务变更需求\n\
    - 系统角度\n  - 分析原有系统的组件化程度、系统安全性要求、系统扩展性要求\n\n## SOA的项目视角(cont.)\n\n- 按建设类型来划分\n\
    - 按切入点划分\n- 按实施组织类型划分\n- 按解决问题划分\n- 按业务关注点划分\n- 按建设范围划分\n- 按建设层次划分\n\n## 按建设类型来划分\n\
    \n- 一步到位法\n  - 组织规范：建立战略机构，统一优化业务\n  - 服务建模：以业务优化思想为主导；\n  - 平台选择：需选择全功能且包括开发的能力的平台\n\
    - 核心扩展法\n  - 组织规范：以调整核心业务的组织和规范为主\n  - 服务建模：以核心业务改造为主导，逐步建立其他服务\n  - 平台选择：选择适用平台\n\
    - 逐级建设法\n  - 组织规范：先不涉及组织调整，后期逐步调整组织，并定规范\n  - 服务建模：以公共业务重用为主导，逐步建立其他服务\n  - 平台选择：选择简单平台\n\
    \n## 按切入点划分\n\n- 从流程切入\n  - 对于基于流程来设置组织及管理机制的用户，业务流程是最核心的，以流程为中心切入SOA将更加合适\n-\
    \ 从信息切入\n  - 组织内部的营运管理需要大量而实时的商业信息，通过信息流需求来整合原有部门级的应用\n- 从客户体验需求切入\n  - 对于关注于直接客户服务的部分企业或政府用户而言，终端服务能力是推进用户信息化的重要驱动力；提升对客户的个性化及多渠道服务能力，是用户的核心关注点。\n\
    \n## 按实施组织类型划分\n\n- 用户主导\n  - 由用户方所建立的实施团队来主导IT总体规划及项目目标，用户业务决策层、IT信息部门及所涉及的业务部门主管来共同推动项目实施\n\
    - 厂商主导\n  - 由咨询公司帮助用户梳理业务、并提出信息化及项目招标要求，由具体的集成商，选择SOA的方法及技术进行项目实施\n\n## 按解决问题划分\n\
    \n- 系统集成\n  - 在组织内部多个IT系统之间的互联互通需求，使SOA已逐渐成为许多用户整合项目的重要技术路线\n- 新应用建设\n  - 在构建新系统时，对原系统资源进行再利用，基于新功能需求进行服务化开发，从而降低成本、缩减周期\n\
    - 业务创新变革\n  - 业务的调整及改变，原有多个异构系统的整合和复用，难以满足业务需求，重新规划系统，利用SOA构建新的需求，从长远角度满足业务发展及变化\n\
    \n## 按业务关注点划分\n\n- 资源共享需求\n  - 实现单个组织内不同部门之间或者不同组织之间的信息资源及应用资源的共享\n  - 通过服务化的方式，对数据进行更灵活的共享\n\
    - 业务协同需求\n  - 业务协同的核心是流程，流程中涉及到多个复杂的异构系统\n  - 鉴于SOA的松耦合、标准化、灵活性等特性，基于服务的方式来实现IT系统之间的协同，已成为主流\n"
