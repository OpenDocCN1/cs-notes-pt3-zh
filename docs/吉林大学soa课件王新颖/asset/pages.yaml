- pgno: 166
  md: '# The SOA Layers--2


    +   - Layer 2: Enterprise components layer

    +     - Enterprise components that are responsible for realizing functionality
    and maintaining the QoS of the exposed services.

    +     - Managed, governed set of enterprise assets that are funded at the enterprise
    or the business unit level.

    +     - Typically uses container-based technologies such as application servers
    to implement the components, workload management, high-availability, and load
    balancing.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# The SOA Layers--3


    ![](img/431d4828d5c6073b7e23d9eca159cdeb_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# The SOA Layers--3


    +   - Layer 3: Services layer.

    +     - The services that the business chooses to find and expose

    +     - Can be *discovered* or be statically bound and then invoked, or possibly,
    choreographed into a composite service.

    +     - Mechanism to take enterprise scale components, business unit specific
    components, and in some cases, project-specific components, and externalizes a
    subset of their interfaces in the form of service descriptions.

    +     - Provide service realization at runtime using the functionality provided
    by their interfaces.

    +     - Exist in isolation or as a composite service.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# The SOA Layers--4


    ![](img/431d4828d5c6073b7e23d9eca159cdeb_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# The SOA Layers--4


    +   - Level 4: Business process composition or choreography layer

    +     - Services are bundled into a flow through orchestration or choreography,
    and thus act together as a single application.

    +     - These applications support specific use cases and business processes.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# The SOA Layers—5、6、7


    ![](img/431d4828d5c6073b7e23d9eca159cdeb_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# The SOA Layers—5、6、7


    +   - Layer 5: Access or presentation layer.

    +     - SOA decouples the user interface from the components, the layer provides
    an access channel to a service or composition of services.

    +   - Level 6: Integration (ESB).

    +     - Enables the integration of services through the introduction of a reliable
    set of capabilities, such as intelligent routing, protocol mediation, and other
    transformation mechanisms, often described as the ESB.

    +   - Level 7: QoS.

    +     - The capabilities required to monitor, manage, and maintain QoS such as
    security, performance, and availability.

    +     - A background process through sense-and-respond mechanisms and tools that
    monitor the health of SOA applications.'
  merge: -1
  img_proc: true
