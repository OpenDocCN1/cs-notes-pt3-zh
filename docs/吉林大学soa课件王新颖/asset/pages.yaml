- pgno: 123
  md: '# What is SOAP


    +   - SOAP 指 简易对象访问协议

    +   - SOAP 是一种 通信协议

    +   - SOAP 用于 应用程序之间的通信

    +   - SOAP 是一种用于 发送消息的格式

    +   - SOAP 被设计用来 通过因特网进行通信

    +   - SOAP 独立于平台

    +   - SOAP 独立于语言

    +   - SOAP 基于 XML

    +   - SOAP 很简单并可扩展

    +   - SOAP 允许您 绕过防火墙'
  merge: -1
