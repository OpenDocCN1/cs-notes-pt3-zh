- pgno: 130
  md: '# SOAP 的请求与响应


    ```

    POST /InStock HTTP/1.1

    Host: www.xxxxx.net

    Content-Type: application/soap+xml; charset=utf-8

    Content-Length: XXX


    <?xml version="1.0"?>

    <soap:Envelope

    xmlns:soap="http://www.w3.org/2001/12/soap-envelope"

    soap:encodingStyle="http://www.w3.org/2001/12/soap-encoding">

    <soap:Body xmlns:m="http://www.xxxxx.com/stock">

    <m:GetStockPrice>

    <m:StockName>IBM</m:StockName>

    </m:GetStockPrice>

    </soap:Body>

    </soap:Envelope>

    ```


    请求


    ```

    HTTP/1.1 200 OK

    Content-Type: application/soap+xml; charset=utf-8

    Content-Length: XXX


    <?xml version="1.0"?>

    <soap:Envelope

    xmlns:soap="http://www.w3.org/2001/12/soap-envelope"

    soap:encodingStyle="http://www.w3.org/2001/12/soap-encoding">

    <soap:Body xmlns:m="http://www.xxxxx.net/stock">

    <m:GetStockPriceResponse>

    <m:Price>34.5</m:Price>

    </m:GetStockPriceResponse>

    </soap:Body>

    </soap:Envelope>

    ```


    响应'
  merge: -1
  img_proc: true
