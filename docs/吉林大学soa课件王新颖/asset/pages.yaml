- pgno: 317
  md: '# SOA效益分析


    +   - 提高业务效率和用户满意度

    +     - 依托松耦合性和重用性，减少利用现有服务和IT资产组装新业务应用的时间，提高上市速度和开发效率

    +     - 创建与具体技术和最终用户设备无关的服务，以保证一致的用户体验，提高用户的满意度。

    +   - 提高互操作性和可用性

    +     - 遵循开放的标准化协议、应用于厂商多样性的环境

    +   - 提高投资回报率

    +     - 服务的松耦合及平台中立降低了集成和维护成本'
  merge: -1
  img_proc: true
