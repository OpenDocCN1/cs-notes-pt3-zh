- pgno: 118
  md: '# XPath


    | 表达式 | 描述 |

    |---|---|

    | nodename | 选取此节点的所有子节点。 |

    | / | 从根节点选取。 |

    | // | 从当前节点选择文档中的节点，而不考虑它们的位置。 |

    | . | 选取当前节点。 |

    | .. | 选取当前节点的父节点。 |

    | @ | 选取属性。 |

    | [] | 查找某个特定的节点或者包含某值的节点 |

    | * | 通配符，匹配任何元素节点 |'
