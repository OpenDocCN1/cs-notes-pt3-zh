- pgno: 419
  md: '# 利用SOA方案进行系统整合的优势


    +   - 标准、开放、先进

    +     - SOA集成架构独立于ERP建设之外

    +     - 不干扰，不加重ERP建设负担

    +   - 对ERP系统的认知度高

    +     - Oracle SOA 方案提供了针对SAP系统，OracleEBS系统的适配器，直接识别ERP系统数据的业务意义

    +     - 大大减少了对ERP系统接口集成的开发量

    +   - 在企业内建立了EAI的接口集成管理规范

    +     - EAI平台服务规范：描述已定义的服务接口

    +     - EAI平台接入规范：描述接入EAI平台所需要的条件

    +   - 为IT运维建立标准管理规范

    +   - 在企业内构建的服务总线为SOA蓝图建设奠定了基础设施'
  merge: -1
  img_proc: true
