    \n@WebService\npublic class LoanApprover {\n    @WebMethod\n    public boolean\
    \ approve(String name) {\n        return name.equals(\"Mike\");\n    }\n    public\
    \ static void main(String[] args){\n        LoanApprover la = new LoanApprover();\n\
    \        Endpoint endpoint =\n            Endpoint.publish(\"http://localhost:8080/loanservice\"\
    , la);\n    }\n}\n```"
