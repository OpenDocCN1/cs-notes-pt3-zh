- pgno: 51
  md: '# Web服务的定义


    +   - IBM的定义

    +     - Web服务是一种接口，它描述了一组操作，可以使用标准的XML消息传递技术，经由网络访问这些操作。

    +   - Microsoft的定义

    +     - Web服务是一个向其他应用提供数据和服务的应用逻辑单元。应用程序通过无处不在的Web协议和数据格式访问Web服务，如HTTP、XML和SOAP，而无需关心每个Web服务是如何实现的。

    +   - SUN定义

    +     - Web服务是软件构件。这类构件具有被发现、可组合和重组合的特性，用于解决用户的问题或要求，Java语言和XML是Web服务的最重要技术。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Web服务开发的生命周期


    +   - 开发

    +     - 开发和测试 Web 服务实现、定义服务接口描述和定义服务实现描述

    +     - 通过创建新的 Web 服务、把现有的应用程序变成 Web 服务

    +     - 由其它 Web 服务和应用程序组成新的 Web 服务提供 Web 服务的实现

    +   - 部署

    +     - 向服务请求者或服务注册中心发布服务接口和服务实现的定义

    +     - 把Web 服务的可执行文件部署到执行环境 (Web 服务器) 中

    +   - 运行

    +     - 调用 Web 服务

    +     - Web 服务完全部署、可操作并且服务提供者可以通过网络访问服务

    +   - 管理

    +     - 持续的管理和经营 Web 服务应用程序。安全性、可用性、性能、服务质量和业务流程'
  merge: -1
  img_proc: true
