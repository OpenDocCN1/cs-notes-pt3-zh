- pgno: 320
  md: '# SOA项目实施需求来源


    +   - 系统整合驱动

    +     - 应用系统之间的数据整合

    +     - 功能整合

    +     - 流程整合

    +   - 新系统建设驱动

    +     - 管理上：新业务的变换使现有系统远远不能满足需求

    +     - 技术上：手工编码、缺乏总体架构的设计，注定无法全面适应系统需求变更的需要'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# SOA项目的实施


    +   - 战略规划阶段

    +     - 企业或组织的决策部门需要进行**业务规划**

    +     - IT管理团队对当前IT系统的功能、性能、问题、基础架构、平台、标准以及需要满足的需求等各方面进行**IT规划**，确定IT整体的建设策略、建设路线以及组织结构。

    +   - 项目实施阶段

    +     - 服务规划与设计

    +     - 服务开发

    +     - 服务测试

    +     - 服务发布

    +     - 服务组装运行

    +     - 管理流程变化'
  merge: -1
  img_proc: true
