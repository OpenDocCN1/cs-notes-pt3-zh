  md: '# 潍柴动力售后服务系统挑战


    +   - 信息孤岛

    +     - 现有的售后服务系统是对其它系统是封闭的

    +   - 多组织，多语言挑战

    +     - 只能为潍柴厂服务，不能为其它主机厂服务

    +     - 不能服务于国外客户

    +   - 不具备扩展性

    +     - 新增的需求难以实现

    +     - 集团内部各个授权主机厂的售后服务系统不统一

    +   - 系统职责不清

    +     - 内外部用户使用同一个遗留的售后服务系统'
