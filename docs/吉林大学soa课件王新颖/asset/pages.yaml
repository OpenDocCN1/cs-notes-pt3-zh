  md: '+   - JAX-WS is a Java programming language API for creating web services.

    +   - Latest version JAX-WS 2.0

    +   - Part of Java EE.

    +   - New in Java SE 6.

    +   - API stack for web services.

    +   - Replaces JAX-RPC.

    +   - **JAXM**（JAVA API For XML Message）

    +   - **SAAJ**（SOAP With Attachment API For Java）

    +   - **JAX-RS**'
