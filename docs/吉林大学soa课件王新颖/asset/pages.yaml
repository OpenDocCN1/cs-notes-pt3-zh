- pgno: 5
  md: '# What is Service?


    +   - *Services* may mean different things to different people:

    +     - A piece of business logic accessible via the *Internet* using *open standards*
    (Microsoft).

    +     - Encapsulated, *loosely coupled*, contracted software functions, offered
    via *standard protocols* over the *Web* (DestiCorp).

    +     - *Loosely coupled* software components that interact with one another *dynamically*
    via *standard Internet* technologies (Gartner).

    +     - A software application identified by a URI, whose interfaces and binding
    are capable of being defined, described, and discovered by XML artifacts and supports
    direct interactions with other software applications using XML-based messages
    via *Internet-based protocols* (W3C).'
  merge: -1
  img_proc: true
