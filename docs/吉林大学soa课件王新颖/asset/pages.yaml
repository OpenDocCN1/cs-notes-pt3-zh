- pgno: 92
  md: '# Web3.0特征分析


    +   - Web3.0是建立在Web2.0基础上的，实现了更加“智能化的人与人、人与机器的交流”功能的互联网模式

    +   - 从广播电视媒体网络化角度，划分其四大特征

    +     - 微内容(Widget)的自由整合与有效聚合

    +     - 适合多种终端平台，实现信息服务的普适性

    +     - 良好的个性化用户体验，以及基础性的个性化配置

    +     - 有效和有序的数字新技术

    +   - Web3.0以网络化和个性化为特征，提供更多人工智能服务'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Web3.0的发展趋势


    +   - 基于用户的一个需求点，力图在一个平台上整合所有的互联网服务

    +     - 例如博客中国向综合阵营的靠拢，腾讯转型为综合性门户等

    +   - 在用户个别需求点上进行深度挖掘，纵深发展

    +     - 淘宝、奇虎、Donews等公司仅就业务领域进行划分，并没有依据人群进行细分，其运作模式还是Web2.0的细微，信息散乱

    +   - Web3.0关键在于提供用户偏好的个性化聚合服务'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Web4.0展望


    +   - Web1.0——信息共享； Web2.0——信息共建；

    +     Web3.0——知识传承； Web4.0——知识分配。

    +   - Radar Networks公司的Nova Spivack绘制了一份未来25年的网络进化图，他没有明确指出Web4.0具体的来临日期和所需技术，但每个阶段的发展以10年为期限是真是而可信的。

    +   - 互联网下一次显著进化将使其成为一个包含语义网络的平台，这一理念是合情理的。'
  merge: -1
  img_proc: true
