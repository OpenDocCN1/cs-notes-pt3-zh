- pgno: 108
  md: '# XML文档定义


    +   - XML有两种方法定义数据元素：

    +     - DTD

    +     - XML Schema

    +   - 文档类型定义(Document Type Definition， DTD)

    +     - 元素(Element)的定义规则

    +     - 元素之间的关系规则

    +     - 属性(Attribute)的定义规则

    +   - XML Schema： 是一种以XML语言为基础的，用于可替代DTD。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# XML Schema


    +   - XML SCHEMA是W3C推荐的XML规范(2001.5)，是以XML语言为基础的，用于可替代DTD

    +   - XML Schema内容比DTD丰富，功能也更强

    +     - 基于XML语法，可以用处理XML文档的工具来处理

    +     - 支持广泛的数据类型，支持自定义数据类型

    +     - 支持开放内容模型和命名空间集成

    +     - 支持元素的继承

    +     - 支持属性组

    +   - XML Schema也被称为XML Schema Definition (XSD)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# XML Schema结构


    +   - 注释

    +   - 声明

    +     - 元素声明

    +     - 属性声明

    +     - 表示法声明

    +   - 类型定义

    +     - 简单类型

    +     - 复杂类型

    +   - 属性组

    +   - 模型组


    ```

    <?xml version="1.0"?> (1)

    <xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema" targetNamespace="http://www.w3schools.com"
    xmlns="http://www.w3schools.com" elementFormDefault="qualified"> (2)

    <xs:element name="note"> (3)

    <xs:complexType> (4)

    <xs:sequence> (5)

    <xs:element name="to" type="xs:string"/> (6)

    <xs:element name="from" type="xs:string"/> (7)

    <xs:element name="heading" type="xs:string"/> (8)

    <xs:element name="body" type="xs:string"/>

    </xs:sequence>

    </xs:complexType>

    </xs:element>

    </xs:schema>

    ```


    <!ELEMENT Note (to, from, heading, body)>

    <!ELEMENT to (#PCDATA)>

    <!ELEMENT from (#PCDATA)>

    <!ELEMENT heading (#PCDATA)>

    <!ELEMENT body (#PCDATA)>'
  merge: -1
  img_proc: true
