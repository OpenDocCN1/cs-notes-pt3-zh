- pgno: 9
  md: '# OO～SO的演化


    +   - 80年代： Object-Oriented

    +     - 特点： 多态性、封装性、子类化

    +     - 缺点： 多态实现的代价高，封装粒度详细——类爆炸

    +   - 90年代： Component-Based

    +     - 特点： 接口化、动态加载、原数据，如dll动态库

    +     - 缺点： 不同的系统、旧有的系统的加载比较麻烦，动态加载和数据交换缺乏统一的标准

    +   - 2000年： Service-Orientation

    +     - 特点： 基于消息、基于Schema和Contract、基于Policy实现绑定'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# SO vs. OO


    | Service-Orientation | Object-Orientation |

    | --- | --- |

    | Loose coupling between units of processing logic. | Based on predefined class
    dependencies, resulting in more tightly bound objects. |

    | Coarse-grained interfaces (service description)<br>Message-based communication
    | Fine-grained interfaces (APIs), Communication based on RPC or local API calls.
    |

    | Large unit of processing logic (service), May vary significantly in scope. |
    Unit of logic (object) tend to be smaller and More specific in scope. |

    | Promotes the creation of activity-agnostic units of processing logic (services)
    that are driven into action by intelligent units of communication (message). |
    Encourages the binding of processing logic with data, resulting in highly intelligent
    units (object). |

    | Prefers that units of processing logic (services) be designed to remain as stateless
    as possible. | Promotes binding of data and logic, resulting in the creation of
    more stateful units (objects). |'
  merge: -1
  img_proc: true
