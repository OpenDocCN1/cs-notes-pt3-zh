- pgno: 125
  md: '# SOAP的主要功能


    +   - 定义通信单元的机制

    +   - 错误处理机制

    +   - 可扩展件机制

    +   - 灵活的数据表示机制

    +   - 支持以文档为中心的方法

    +   - 将SOAP消息绑定到HTTP

