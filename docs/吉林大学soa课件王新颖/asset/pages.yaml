- pgno: 42
  md: '# 服务的定义


    +   - 能通过URL识别的软件程序，通过互联网协议用以支持网络间不同机器的互动操作(W3C)


    +   - 服务独立于其运行的硬件平台、编程语言和操作系统，是由一系列自包含、可复用的软件模块组成。一个服务定义了一个与业务功能或业务数据相关的接口，在不同的系统中服务可以以一种统一的方式进行交互、相互理解(IBM)。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # 服务规范


    +   - 服务规范有三个规范要素，根据服务的建模类型可对它们进行选择：

    +     - 结构规范：定义了可以调用的操作和由这些操作销毁或创造出的消息。

    +     - 行为规范：表示服务客户和所指定服务之间的任意预期的有意义的协议或会话。

    +     - 策略规范：表示服务的策略主张和约束。策略主张可能包括安全性、可管理性等等。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# SOA服务的基本特征


    +   1. 服务的封装(encapsulation)

    +   2. 服务的重用(reuse)

    +   3. 服务的互操作(interoperability)

    +   4. 服务是自治的(Autonomous)功能实体

    +   5. 服务之间的松耦合度(Loosly Coupled)

    +   6. 服务是位置透明的(location transparency)

    +   7. 明确定义的接口(well defined interface)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 服务构成


    # 策略是规则集


    +   - 在这些条件和规则之下，服务提供者可以使服务可用于使用者，在功能和服务质量两个部分中都有策略功能。


    # 安全性是规则集


    +   - 用于验证服务使用者的身份验证、授权和访问控制。


    # 事务是属性集


    +   - 用于一组服务，以提供一致的结果。使用一组服务来完成一项业务功能时，要么所有的服务必须都完成，或者没有一个完成。


    # 管理是属性集


    +   - 应用于管理提供的服务或使用的服务。'
  merge: -1
  img_proc: true
