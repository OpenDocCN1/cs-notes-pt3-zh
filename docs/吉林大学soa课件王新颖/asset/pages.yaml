- pgno: 342
  md: '# 交通银行管理系统统一应用平台


    +   - 案例特点

    +     - 建设类型：一步到位法

    +     - 实施类型：用户主导

    +     - 建设范围：组织内

    +   - 业务背景

    +     - 交通银行于2005年成功完成大集中工程，标志着IT建设迈入了新的阶段

