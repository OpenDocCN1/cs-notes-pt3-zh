- pgno: 35
  md: '# SOA in Five Slides(1): SOA


    +   - 面向服务的架构（SOA）是一个范式，其目的是实现和维护跨越了大部分分布式系统的业务流程

    +   - SOA基于三个主要技术和概念

    +     - 服务：一项自足的业务功能，集中关注借口的业务价值，填补“业务/IT”鸿沟。

    +     - 企业服务总线：SOA基础设施，使得分布式系统和服务之家的高互操作性成为可能，简化了分布业务在不同平台和技术的众多系统间的工作流程。

    +     - 松耦合：减少系统间的相互依赖，将个别系统的修改和故障对系统的影响降至最低。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# SOA in Five Slides(2): 政策和过程


    +   • 分布式处理不仅仅是个技术细节，系统引入新功能，涉及到多个系统和团队的必须协作。


    +   • 构建一个SOA系统，需要清晰的定义角色、政策和过程。


    > 做一个编程系统产品比做一个简单的程序的成本高9倍

    > Fred Brooks 1974'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# SOA in Five Slides(3): Web Service


    +   - Web Service 是实现SOA的有效技术手段之一

    +   - Web Service自身的问题

    +     - 标准不够成熟，不能保证互操作性

    +     - 无法形成程度适当的松耦合

    +   - 设计SOA的系统，不能掉进过于Web Service化的陷阱。 Web Service不会是系统集成的终极标准，因此只有当Web Service对特定的基础设施考量确实重要时，才应把它加进来发挥作用。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# SOA in Five Slides(4): SOA实践


    在理论上，理论和实践是一致的。在实践中则并非如此


    L.Berra


    +   - 在SOA付诸实施时，需要考虑性能、安全等因素

    +   - SOA是针对出于维护中的现有系统的策略

    +   - 从IT角度看，所有的系统都不一样

    +   - 是否引入SOA并不重要，重要的是对于上下文环境和用户需求来说，引入到IT解决方案是否合适！！'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# SOA in Five Slides(5): SOA的监管★★


    +   - 正确的监管方法和恰当的监管力度是SOA需要重要考虑的问题。

    +     - 需要在集中化和分散化之间找到正确的平衡点

    +     - 需要合适的人员作为“服务基础设施”的服务提供者

    +     - 首先解决重要的事情，不要力图解决所有服务或提供所有的基础设施，“SOA系统是可以成长的！”

    +     - SOA是影响公司整体战略的决策，需要公司管理层的支持，配以足够的时间和经费以支持长期的调研和开发'
  merge: -1
  img_proc: true
