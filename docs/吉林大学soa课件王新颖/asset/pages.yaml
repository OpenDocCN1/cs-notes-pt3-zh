- pgno: 186
  md: '# What is BPEL


    +   - Business Process Execution Language (BPEL)

    +     - BPEL is an OASIS standard executable language for specifying interactions
    with Web Services.

    +   - WS-BPEL extends the Web Services interaction model and enables it to support
    business transactions.

    +   - WS-BPEL provides a language for the specification of Executable and Abstract
    business processes.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# WS-BPEL Process


    +   - Made up of “Activities” – the individual steps of a process

    +   - Activities are implemented by Web Services

    +   - WS-BPEL process is itself represented as Web Services

    +   - Specifies order in which participating Web Services should be invoked

    +   - Error handling'
  merge: -1
  img_proc: true
