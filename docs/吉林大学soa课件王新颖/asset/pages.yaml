- pgno: 30
  md: '# SOA的优劣


    +   - SOA通过互联网发布，突破企业内网限制，实现与供应链上下游伙伴业务的紧密结合；

    +   - SOA的平台无关联性，减少了业务应用实现的限制；

    +   - SOA具有低耦合性特点，增加和减少业务伙伴对整个业务系统的影响较低。

    +   - SOA具有可按模块分阶段进行实施的优势；

    +   - SOA的实施可能并不具有成本显著性。'
  merge: -1
  img_proc: true
