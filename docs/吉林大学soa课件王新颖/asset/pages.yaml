- pgno: 55
  md: '# # Web服务管理的衡量标准


    +   - 性能：吞吐量和延迟

    +   - 可用性：服务是否存在或已就绪可供立即使用

    +   - 可靠性：能够维持服务和服务质量的程度

    +   - 完整性：指 Web 服务如何维护交互的正确性

    +   - 安全性：消息加密以及访问控制

    +   - 常规性：遵循标准和已建立的服务级别协议

    +   - 可访问性：能够为Web服务请求提供服务的程度

    +   - 可伸缩性：始终如一地为请求提供服务的能力'
