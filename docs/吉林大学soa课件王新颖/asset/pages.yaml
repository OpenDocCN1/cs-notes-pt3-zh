- pgno: 310
  md: '# Compile the Web Service


    Create a myservice directory.


    From the directory just above loanservice, run Java’s Annotation Processing Tool
    (APT):


    ```

    C:\>apt -d myservice loanservice/LoanApprover.java

    ```


    This populates a directory named myservice.

    The directory holds the compiled package as well as a new directory (package)
    called jaxws.

    The new jaxws package holds classes associated with the parameters to and from
    each web service method.

    Use the -s switch to generate the source code.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Publish the Service


    From a directory just above myservice:


    ```

    C:\>java -cp myservice loanservice/LoanApprover

    ```


    To view the WSDL, visit the service with a browser at http://localhost:8080/loanapprover?wsdl'
  merge: -1
