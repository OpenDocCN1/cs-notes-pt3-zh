- pgno: 263
  md: '# Assert methods I


    An assert method is a JUnit method that performs a test, and throws an AssertionFailedError
    if the test fails


    – JUnit catches these Errors and shows you the result


    ```

    static void assertTrue(boolean test)

    ```


    ```

    static void assertTrue(String message, boolean test)

    ```


    – Throws an AssertionFailedError if the test fails


    – The optional message is included in the Error


    ```

    static void assertFalse(boolean test)

    ```


    ```

    static void assertFalse(String message, boolean test)

    ```


    – Throws an AssertionFailedError if the test fails'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Example: Counter class


    +   - For the sake of example, we will create and test a trivial “counter” class

    +     - The constructor will create a counter and set it to zero

    +     - The increment method will add one to the counter and return the new value

    +     - The decrement method will subtract one from the counter and return the
    new value

    +   - We write the test methods before we write the code

    +     - This has the advantages described earlier

    +     - Depending on the JUnit tool we use, we may have to create the class first,
    and we may have to populate it with stubs (methods with empty bodies)

    +   - Don’t be alarmed if, in this simple example, the JUnit tests are more code
    than the class itself'
  merge: -1
  img_proc: true
- pgno: 265
  md: "```\n```java\npublic class CounterTest extends junit.framework.TestCase {\n\
    \    Counter counter1;\n\n    public CounterTest() { }  // default constructor\n\
    \n    protected void setUp() {  // creates a (simple) test fixture\n        counter1\
    \ = new Counter();\n    }\n\n    protected void tearDown() { } // no resources\
    \ to release\n\n    public void testIncrement() {\n        assertTrue(counter1.increment()\
    \ == 1);\n        assertTrue(counter1.increment() == 2);\n    }\n\n    public\
    \ void testDecrement() {\n        assertTrue(counter1.decrement() == -1);\n  \
    \  }\n}\n```\n```\n\n> Note that each test begins with a *brand new* counter\n\
    \n> This means you don’t have to worry about the order in which the tests are\
    \ run"
  merge: -1
  img_proc: true
- pgno: 266
  md: "# The Counter class itself\n\n```\npublic class Counter {\n    int count =\
    \ 0;\n\n    public int increment() {\n        return ++count;\n    }\n\n    public\
    \ int decrement() {\n        return --count;\n    }\n\n    public int getCount()\
    \ {\n        return count;\n    }\n}\n```\n\n+   - Is JUnit testing overkill for\
    \ this little class?\n+   - The Extreme Programming view is: If it isn’t tested,\
    \ assume it doesn’t work\n+   - You are not likely to have many classes this trivial\
    \ in a real program, so writing JUnit tests for those few trivial classes is no\
    \ big deal\n+   - Often even XP programmers don’t bother writing tests for *simple*\
    \ getter methods such as getCount()\n+   - We only used assertTrue in this example,\
    \ but there are additional assert methods"
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Assert methods II


    +   - `assertEquals(expected, actual)`

    +     `assertEquals(String message, expected, actual)`

    +     - This method is heavily overloaded: *expected* and *actual* must be both
    objects or both of the same primitive type

    +     - For objects, uses your equals method, *if you have defined it properly*,
    as `public boolean equals(Object o)`—otherwise it uses ==

    +   - `assertSame(Object expected, Object actual)`

    +     `assertSame(String message, Object expected, Object actual)`

    +     - Asserts that two objects refer to the same object (using ==)

    +   - `assertNotSame(Object expected, Object actual)`

    +     `assertNotSame(String message, Object expected, Object actual)`

    +     - Asserts that two objects do not refer to the same object'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Assert methods III


    +   - assertNull(Object object)

    +     assertNull(String message, Object object)

    +     - Asserts that the object is null

    +   - assertNotNull(Object object)

    +     assertNotNull(String message, Object object)

    +     - Asserts that the object is null

    +   - fail()

    +     fail(String message)

    +     - Causes the test to fail and throw an AssertionFailedError

    +     - Useful as a result of a complex test, when the other assert methods aren’t
    quite what you want'
  merge: -1
