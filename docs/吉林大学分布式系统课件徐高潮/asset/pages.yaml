- pgno: 295
  md: '# 第六章 分布式系统中的死锁


    # 6.2 死锁的预防


    # ◆ 预防死锁的一般方法


    死锁预防算法是通过限制进程的资源请求来达到预防死锁的目的，都是通过打破四个死锁条件中的一个条件来实现的。


    +   1) 进程在开始执行之前同时获得所有所需资源。这种方法打破了占有并等待的条件。


    +   2) 所有的资源都要被赋予一个唯一的数字编号。一个进程可以请求一个有唯一编号i的资源，条件是该进程没有占用编号小于或等于i的资源。这样，就打破了循环等待的条件。


    +   3) 每个进程被赋予一个唯一的优先级标识。优先级标识决定了进程Pᵢ是否应该等待进程Pⱼ，从而打破了不可剥夺的条件。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# # 第六章 分布式系统中的死锁


    # ## 6.2 死锁的预防


    # ◆基于时间戳的预防死锁方法


    包括两种死锁预防方案。这两种方案相互补充，这种方法常用于分布式数据库系统中。


    +   1) 等待—死亡方案（wait-die scheme）。该方案是基于非剥夺方法。当进程 P_i 请求的资源正被进程 P_j 占有时，只有当 P_i
    的时间戳比进程 P_j 的时间戳小时，即 P_i 比 P_j 老时，P_i 才能等待。否则 P_i 被卷回（roll-back），即死亡。


    +   2) 伤害—等待方案（wound-wait scheme）。它是一种基于剥夺的方法。当进程 P_i 请求的资源正被进程 P_j 占有时，只有当进程
    P_i 的时间戳比进程 P_j 的时间戳大时，即 P_i 比 P_j 年轻时，P_i 才能等待。否则 P_j 被卷回（roll-back），即死亡。'
  merge: -1
  img_proc: true
