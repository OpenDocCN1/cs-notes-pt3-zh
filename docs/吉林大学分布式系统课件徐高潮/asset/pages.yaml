- pgno: 500
  md: '# # 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    +   ❖ NFS中的命名


    +   ➤ 文件柄 :


    • 文件柄: 文件柄是文件系统本身用来标识一个文件的，一个文件只有一个文件柄。只要这个文件存在，它就一直存在。文件柄的不变特性使得顾客能够使用名字查找该文件并在本地保存文件的文件柄。


    • 顾客在本地保存所访问文件的文件柄好处: 第一个好处是能够改善性能，对文件进行一系列操作时，可以通过文件柄对文件进行操作而不是通过名字，这样避免了对于文件的每一个访问操作都要通过名字查找文件;
    另一个好处是对一个文件的访问可以不依赖于它当前的名字。'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆NFS中的命名


    # 文件句柄：


    +   - NFS v3中，顾客可以实际地安装一个远程文件系统，安装完成后，被安装的远程文件系统的根文件句柄被传递给顾客，这个根文件句柄就作为查找远程文件的起点。


    +   - 在NFS v4中，通过一个特殊的操作putrootfh告诉服务员对某个文件系统的根进行解析获得其文件句柄，从这个根文件句柄开始，就可以得到对应文件系统中的所有文件的文件句柄。这种方案的好处是不需要一个独立的安装协议，当一个顾客要求服务员对其上的某个文件系统的根对应的名字进行解析时，该文件系统就在顾客方安装了。'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆NFS中的命名


    # 文件参数：


    一个NFS文件有一系列参数与其相对应。在NFS v3中，参数数目是固定的，每个NFS都期望支持这些参数。在NFS v4中，文件参数被分成三组：


    +   - 第一组是强制性的参数，所有的NFS实现必须支持这些参数；

    +   - 第二组是推荐参数，这组参数应该尽量得到支持；

    +   - 第三组参数是只被命名的参数，只被命名的参数随文件一起存储，NFS提供一些操作对这些参数进行读和写，然而这些参数和其对应的值的意义完全留给应用程序去解释。'
  merge: -1
  img_proc: true
