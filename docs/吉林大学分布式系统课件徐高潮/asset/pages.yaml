- pgno: 241
  md: "# 第五章 同步和互斥\n\n# 5.2 同步机构\n\n❖ 物理时钟\n\n# ➤分布式物理时钟\n\n时间值校正方法：\n\n+   (1) 计算所有节点的平均值，把这个值作为当前时间。这种方法可能会产生不准确的结果，因为某些报文由于重发超出了通常的网络延迟。\n\
    +   \n+   (2) 设定一个容错门限延迟，这个门限为单次发送的最大网络延迟，任何超过这个门限延迟的值被认为是错误的并被丢弃。其他未被丢弃的值进行平均，平均值作为当前时间。\n\
    +   \n+   (3) 丢弃m个最大的时间值和m个最小的时间值，这些值被认为是不准确的。剩下的进行平均，平均值作为当前时间。"
