- pgno: 568
  md: '# 第十章 分布式调度


    # 10.5 进程转移和远程执行


    # ◆进程转移和远程执行的目的和方法


    进程转移的主要目的是使由个人工作站组成的系统的计算资源容易共享：用户在执行若干相对独立的任务时，可把它们从某些重负载工作站移到另外一些轻负载工作站上加快完成。


    进程转移的形式有两种：抢先方式和非抢先方式，非抢先方式又称为进程放置，抢先方式又称为进程迁移。进程放置是为进程选择一个执行节点，在此节点上启动此进程。进程迁移是把进程转移到一个较好的执行节点继续执行。'
  merge: -1
  img_proc: true
