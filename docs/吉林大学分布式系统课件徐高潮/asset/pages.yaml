- pgno: 102
  md: '# 第三章 分布式程序设计语言


    # 3.1 分布式程序设计语言概述


    # 分布式程序设计语言的分类


    +   > 按通信模型来分

    +   1) 在物理分布的硬件上运行逻辑上分布的软件。相互使用SEND和RECEIVE原语通信，在网络上发送报文。

    +   2) 在物理非分布的硬件上运行逻辑上分布的软件。用共享主存方法实现报文传递来模拟物理报文传递通信。

    +   3) 在物理分布的硬件上运行逻辑上非分布的软件。使用分布式共享存储器通信。

    +   4) 在物理非分布的硬件上运行逻辑上非分布的软件。使用物理共享存储器通信。'
