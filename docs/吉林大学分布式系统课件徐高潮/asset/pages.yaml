    # 命名系统实例--DNS


    +   2) 域(domain)：DNS名字空间中的一个子树称为一个域(domain)，到达这个子树的根节点的路径名称为这个域的域名(domain name)。正如路径名有绝对路径名和相对路径名一样，域名也可以是绝对域名和相对域名。


