    # 远程过程调用


    远程过程的调用者发出远程过程调用后被阻塞等待返回值，而不象阻塞的报文传递那样等待的仅仅是一个应答。设计和实现远程过程调用主要考虑的问题包括以下方面：


    +   1) 参数类型。RPC中有三种参数传递类型：第一种是输入参数，这种参数只用于顾客向服务员传递信息；第二种是输出参数，这种参数只用于服务员向顾客传递信息，顾客不能使用它向服务员发送信息；第三种既作输入又作输出的参数，顾客能用这种类型的参数向服务员传递信息，服务员同样能用这个参数向顾客传递信息。'
