- pgno: 553
  md: '# 第十章 分布式调度


    # 10.2 静态调度


    # 基于任务相互关系图的任务调度


    嵌入：设想任务相互关系图和处理器图被各自看作Gₜ和Gₚ。为了通过Gₜ得到对Gₚ的有效模拟(emulation)，也就是在Gₚ中嵌入Gₜ。


    嵌入的不同代价指标：


    +   (1) Gₜ的边的膨胀。Gₜ的边的膨胀定义为被映射成Gₜ里的一条边的Gₚ中对应的路径的长度。嵌入的膨胀为Gₜ中的最大边膨胀。


    +   (2) 嵌入的扩大。嵌入的扩大定义为Gₜ里的节点数对Gₚ里的节点数的比率。


    +   (3) 嵌入的拥塞。嵌入的拥塞定义为包含Gₚ中的一条边的最大路径数，Gₚ中的每条路径表示Gₜ中的一条边。


    +   (4) 嵌入的负载。嵌入的负载是Gₜ分配给Gₚ中任意处理器的进程的最大数目。'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# # 第十章 分布式调度


    # 10.3 动态调度


    # ◆动态调度的组成要素


    动态调度算法有六个策略：启动策略、转移策略、选择策略、收益性策略、定位策略和信息策略。


    +   1. 启动策略的职责是决定谁应该激活负载均衡活动。

    +   2. 转移策略决定一个节点是否在合适的状态参与负载转移。

    +   3. 选择策略选择最适合转移最能起平衡作用的任务，并发送给合适的目标处理器。

    +   4. 收益性策略量化系统中负载不平衡程度，并且作为系统负载平衡潜在受益的估计，评估系统负载平衡是否有收益。

    +   5. 定位策略是寻找合适的节点共享负载。

    +   6. 信息策略决定收集系统中其他节点状态信息的时机、收集的方法和收集的信息。'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# 第十章 分布式调度


    # 10.3 动态调度


    # ◆动态负载平衡算法的分类、设计决策和使用的参数


    动态负载平衡算法可以分成以下几类：


    +   (1) 全局的和局部的。局部负载平衡算法在相邻的节点间转移工作负载。全局负载平衡算法不仅在相邻节点间转移负载，还在全系统内计算负载，根据全局情况调整处理器负载。


    +   (2) 集中控制的和分散控制的。在集中控制算法中，中心控制器收集状态信息，做出负载平衡决策。分散控制算法把控制机制分散到全系统的各个节点。混合式负载平衡算法是集中控制和分散控制算法的折衷。'
  merge: -1
  img_proc: true
- pgno: 556
  md: '# 第十章 分布式调度


    # 10.3 动态调度


    ◆动态负载平衡算法的分类、设计决策和使用的参数


    动态负载平衡算法可以分成以下几类：


    +   (3) 不协作的和协作的。在不协作方法中，各个节点不知道系统中其他节点的状态，独立决定自己的定位和负载转移规则。在协作算法中，节点间相互配合来决定负载平衡决策。


    +   (4) 适应性的和非适应性的。在适应性算法中，负载平衡策略根据系统状态变化而改变；而非适应性方法中，这些策略是不变的。'
