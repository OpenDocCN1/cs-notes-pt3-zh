  md: '# 第八章 分布式数据管理


    # 8.4 多副本更新和一致性管理


    # ◆分布式系统中的系统数据库


    数据库一致性包含两个方面：冗余副本的相互一致性和每个副本的内部一致性。


    +   - 相互一致性是指整个数据库或其一部分的各副本是相同的。

    +   - 分布式数据库的内部一致性是指该数据的信息内容而言，包含两个概念：


    （1）语义完整性：所存储的数据精确地反映该数据库所模拟的客观世界。这要求检验对数据库内容进行修改操作的每个事务处理在提交任何修改前不违背语义完整性的约束。这实际上就是我们前面所提到的一致性约束条件。


    （2）原子事务处理：作为一个事务处理的结果，要求在数据库中和提供给外界的信息中反映出该事务处理产生的活动，要么全部产生，要么一个也不产生。'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# 第八章 分布式数据管理


    # 8.4 多副本更新和一致性管理


    # ◆兼容可串行化


    兼容串行化：设并发事务处理T₁和T₂分别使存储处理机P和Q产生活动A₁(P)、A₁(Q)和A₂(P)、A₂(Q)，如果A₁(P)→A₂(P)在P处是正确的串行顺序，则在Q处的兼容串行化应为A₁(Q)→A₂(Q)。


    复制控制算法用来保证兼容可串行化，保持数据库多副本间的相互一致性。复制控制算法分为两大类：表决法和非表决法。


    表决法是在控制者之间交换报文，对分布式数据库要进行的各事务处理的整个次序达成一致意见。


    +   • 在同步表决方案中，各控制者对一个给定事务处理进行表决，一旦取得一致意见就共同执行此事务处理的各步骤。

    +   • 在异步表决方案中，允许各控制者和存储处理机并发地对不同事务处理的请求和执行进行表决。'
  merge: -1
