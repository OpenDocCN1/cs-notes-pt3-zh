- pgno: 1
  md: '# 第一章 绪论


    # 1.1 为什么需要分布式计算系统？


    +   ❖ 促进分布式计算系统发展的两大技术：

    +     ➢ 计算机硬件技术和软件技术的发展；

    +     ➢ 计算机网络技术的发展。


    +   ❖ 两大技术改变了人们使用计算机的方式：

    +     ➢ 50年代，预约上机，占用全部资源；

    +     ➢ 60年代，批处理技术；

    +     ➢ 70年代，分时系统，多用户同时使用一台计算机；

    +     ➢ 80年代，个人计算机，每个用户有专用计算机；

    +     ➢ 90年代至今，通过计算机网络使用多台计算机。'
  merge: -1
