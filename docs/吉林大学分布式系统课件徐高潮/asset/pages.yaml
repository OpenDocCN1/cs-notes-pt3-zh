  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆NFS中的文件封锁


    分布式文件系统中的文件一般来说需要被多个顾客共享，文件的共享需要有一致性的同步机构。


    +   - 在NFS v4以前的版本中，文件封锁是由一个附加的独立协议处理的，在NFS协议之外提供了一个有状态的锁管理员。

    +   - 在NFS v4中，文件封锁被集成到NFS的文件访问协议中，顾客使用这种封锁机制要比使用NFS v3中的封锁机制要简单。'
