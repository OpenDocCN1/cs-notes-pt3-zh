  md: '# 第七章 分布式系统中容错技术


    # 7.5 拜占庭故障的恢复


    错误屏蔽和进程复制


    利用进程组屏蔽错误：进程组是构造容错系统问题的一部分。特别是，如果用相同的进程来构成一个进程组，那么就能够屏蔽进程组中一个或多个出错的进程。也就是说，我们可以用多个相同的进程构造一个进程组，用这个容错的进程组取代相对脆弱的单个进程。


    利用进程组进行容错需要多少个进程副本：


    +   1) 故障—停止型故障：如果进程组中有k+1个进程，那么就足以提供k故障容错。


    +   2) 拜占庭式故障：那么为了取得k故障容错，那么至少需要2k+1个进程。'
