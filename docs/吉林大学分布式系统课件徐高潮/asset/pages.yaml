  md: '# # 第五章 同步和互斥


    # 5.2 同步机制




    逻辑时钟可以给分布计算系统中的事件一个唯一的排序。逻辑时钟的本质是基于Lamport定义的“在先发生关系” 。




    +   1) 如果a和b均为同一进程中的两个事件，并且a在b之前出现，则a→b;

    +   2) 若a代表“一个进程发送一个报文”这个事件，b代表“另一个进程接收这个报文”这个事件，则a→b;

    +   3) 如果a→b，且b→c，则a→c。


    两个不同的事件a和b，如果a→b，或b→a，则事件a和b是因果关联的。如果a→b和b→a均不成立，则称事件a和b是并发的。'
