  md: '# 第十二章 基于对象的分布式系统


    # 12.3 DCOM


    ◆DCOM的通信


    ➤报文


    +   - 当打包的调用到达目的地之后，QC子系统对每个请求进行拆包然后调用对象。不保证请求的处理顺序和它们的请求顺序是一致的，除非这些调用请求是一个事务处理的一部分。


    +   - MSMQ同大多数报文队列系统一样，提供事务处理队列。事务处理队列中的报文要么全部处理，要么一个也不会处理。另外当出现失效的时候，队列中的报文能够恢复。'
