- pgno: 405
  md: '# 第八章 分布式数据管理


    # 8.1 一致性模型


    不同一致性模型的主要特性


    | 一致性模型 | 特性 |

    |---|---|

    | 严格一致性 | 所有对共享数据的访问操作按照绝对时间的顺序排序。 |

    | 线性一致性 | 所有对共享数据的访问操作在每个进程看来是按照同样的顺序执行的，它们的 是按照全局时间戳来排序的。 |

    | 顺序一致性 | 所有对共享数据的访问操作在每个进程看来是按照同样的顺序执行的，但它们 的排序不依赖于时间。 |

    | 相关一致性 | 所有因果相关的对共享数据的访问操作在每个进程看来是按照同样的顺序执 行的。 |

    | FIFO 一致性 | 一个进程内部的所有写操作以它们在该进程中执行顺序被所有其他进程看见。 不同进程的写操作在不同进程看来具有不同的顺序。 |

    | 弱一致性 | 只有在一个同步操作执行以后，才可以认为共享数据是一致的。 |

    | 释放一致性 | 当从一个临界区中退出后，共享数据才获得一致。 |

    | 进入一致性 | 当进入一个临界区时，与这个临界区对应的共享数据项获得一致 |'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # ◆ 并发控制的目标与事务处理


    ▸ 并发控制的目的是在多个用户的情况下允许每个用户像单个用户那样访问共享资源，多个用户同时访问时互相不干扰。并发控制要解决多个用户的活动之间的切换，保护一个用户的活动不受另一个用户的活动的影响，以及对相互依赖的若干活动进行同步等问题。


    ▸ 事务处理: 数据库中的事务处理(transaction)是施加在共享数据上的一组操作，这些操作是结合在一起的，被当作单个活动看待。'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # ◆ 并发控制的目标与事务处理


    在无并发控制的情况下，两个并发的事务处理可能会相互干扰：


    +   (1) 丢失更新。多个事务处理同时对一个共同的数据对象进行写操作时，就会有丢失更新的现象发生，并且使数据库处于不一致状态。


    +   (2) 检索的不一致。检索的不一致发生在 一个事务处理读取数据库中的某些数据对象，但是另一个事务处理对其中一些数据对象的修改还没有完成。'
  merge: -1
  img_proc: true
