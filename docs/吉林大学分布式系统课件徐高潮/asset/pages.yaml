    # ◆组通信的设计问题


    +   b) 由发送进程实现的方法。由发送进程维持一张表，该表明确指出接收进程组的所有进程的目的地址。


    +   c) 预测寻址 (predicate addressing) 的实现方法。每个报文包含一个预测表达式，它是一个布尔表达式，这个布尔表达式涉及到接收者的机器号码、局部变量或其它因素，接收的机器如果计算得到表达式的值为真，则接收此报文，否则丢弃此报文。'
