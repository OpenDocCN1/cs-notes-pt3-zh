- pgno: 573
  md: '# 第十章 分布式调度


    # 10.5 进程转移和远程执行


    ❖ Sprite的进程迁移和远程执行设备


    Sprite系统的进程迁移包括以下几个步骤：


    +   (1) 向目的的节点发送一个RPC，确认是否允许迁移该进程。

    +   (2) 当要迁移该进程时，使用标准信号中断该进程的执行。

    +   (3) 传送该进程的“进程状态”，包括各寄存器的内容、用户标识符和小组标识符、信号处理信息、基地节点和该进程标识符。

    +   (4) 传送虚拟地址空间。把所有重写的页送到文件服务器，把对应的交换文件的页表和说明符送到目的的节点。

    +   (5) 将该进程已打开的文件的说明符和当前工作目录打包并传送。

    +   (6) 发送一个RPC结束迁移，允许被迁移的进程在目的的节点上恢复执行。'
