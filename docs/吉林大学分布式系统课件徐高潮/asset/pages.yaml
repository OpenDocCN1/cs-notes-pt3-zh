- pgno: 195
  md: '# 第四章 命名与保护


    # 4.3 保护


    # 使用报文摘要实现数字签名


    +   1) 报文摘要：使用单向散列(hash)函数可以从一段很长的明文中计算出固定长度的比特串。这个比特串通常被称为该报文的摘要(message digest)。

    +   2) 报文摘要具有三个重要的属性：

    +      a) 给出报文P就很容易计算出其报文摘要MD(P)。

    +      b) 只给出MD(P)，几乎无法推导出P。

    +      c) 无法生成这样的两条报文，它们具有同样的报文摘要。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 第四章 命名与保护


    # 4.3 保护


    # 使用报文摘要实现数字签名


    3) 报文摘要实现数字签名的过程：


    +   a) A首先计算P的报文摘要MD(P)；

    +   b) A用自己的保密密钥对MD(P)进行加密以达到签名的目的；

    +   c) A将报文摘要的签名形式Dₐ(MD(P))连同明文P一起发送给B；

    +   d) B用A的公开密钥解密Dₐ(MD(P))，从而得到MD(P)，验证是否是A发送的；

    +   e) B通过明文P重新计算MD(P)，发现是否有非法用户修改报文P。'
  merge: -1
  img_proc: true
