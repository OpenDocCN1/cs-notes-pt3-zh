- pgno: 454
  md: '# 第八章 分布式数据管理


    # 8.4 多副本更新和一致性管理


    # ◆活动复制控制方法


    在每个时刻维护相互一致性是不可能做到的，一般的复制控制算法只要求顺序一致性，在这里顺序一致性表现为：每个控制者经历同样顺序的修改操作，同时，如果没有新操作时它们的值应该相等。活动复制方法类似于Lamport时间戳互斥算法。每个本地更新加上时间戳后广播到所有其他控制者。每个控制者i有一个队列Q_i[j]，包含有从控制者j发送来的报文。因为每个队列中的报文是按照它们的发送顺序排列的，所以按顺序查看报文时只需要检查队列头。'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# 第八章 分布式数据管理


    # 8.4 多副本更新和一致性管理


    # ◆法定数方法


    设具有某文件副本的服务员数目为N。要读取一个文件，必须要得到N_R(读定额)个服务员同意。要修改一个文件，需要得到N_W(写定额)个服务员同意。N_R和N_W应满足：
    N_R+N_W>N。只有当通过询问知道了有足够多的服务员愿意参加并同意之后，才能进行某种操作。


    一般说来，N_r取值小一些可使读操作易于得到满足，但是写操作的执行就难一些，反之亦然。N_R，N_W的最佳选择取决于读、写操作哪个更频繁。'
