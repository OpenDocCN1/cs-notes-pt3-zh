- pgno: 637
  md: '# 第十二章 基于对象的分布式系统


    # 12.1 分布式对象


    # 对象的概念


    对象的接口和对象对接口的实现：


    通过对象的接口调用对象的方法，从而可对对象的状态进行访问或操作，除此之外，无任何对对象的状态进行访问和操作的合法手段。一个对象可以实现多个接口；同样，给定一个接口的定义，多个对象可能对这一定义提供实现。接口和对象对接口的实现是独立的。


    # 分布式对象:


    在一个机器上设置一个接口，而对象本身驻留在另一个机器上，这通常被称为分布式对象。'
