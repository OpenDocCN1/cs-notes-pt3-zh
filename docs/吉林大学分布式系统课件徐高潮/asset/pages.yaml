  md: '# 第八章 分布式数据管理


    # 8.1 一致性模型


    # 进入一致性


    进入一致性模型的数据存储必须符合以下条件：


    +   (1) 被保护数据的所有更新完成之前，一个进程对相应同步变量的acquire操作不能执行。


    +   (2) 如果有其他进程持有某个同步变量，即使是以非互斥的方式持有这个同步变量，一个进程以互斥的方式对这个同步变量的访问不能执行。


    +   (3) 当一个对同步变量的互斥方式访问完成以后，其他进程对这个同步变量的非互斥方式的访问也不能立即执行，除非在这个同步变量的所有者的访问完成之后。'
