- pgno: 2
  md: '# 第一章 绪论


    # 1.1 为什么需要分布式计算系统？


    +   ◆ 多计算机系统环境带来的新问题：

    +     ➢ 在使用上，用户必须知道本地对象和远程对象的区别；

    +     ➢ 在管理上，管理人员不能四处奔走进行文件备份等操作。


    +   ◆ 解决上述新问题的方法是实现分布式操作系统

    +     ➢ 在分布式计算系统中，多台计算机构成一个完整的系统，其行为类似一个单机系统。分布式操作系统是实现分布式计算系统的核心。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# 第一章 绪论


    # 1.2 分布计算系统的相关概念


    +   ◆ 什么是分布式计算系统


    +   > Andrew S. Tanenbaum教授给出的定义：分布式计算系统是由多个独立的计算机系统相互连接而成的计算系统，从用户的角度来看它好像是一个集中的单机系统。


    +   > 本文总结的定义：分布式计算系统是由多个相互连接的处理资源组成的计算系统，它们在整个系统的控制下可合作执行一个共同的任务，最少依赖于集中的程序、数据和硬件。这些处理资源可以是物理上相邻的，也可以是在地理上分散的。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 第一章 绪论


    # 1.2 分布计算系统的相关概念


    分布计算系统定义的说明：


    +   1) 系统是由多个处理器或计算机系统组成。


    +   2) 两类结构：这些计算资源可以是物理上相邻的、由机器内部总线或开关连接的处理器，通过共享主存进行通信；这些计算资源也可以是在地理上分开的、由计算机通信网络（远程网或局域网）连接的计算机系统，使用报文（message）进行通信。


    +   3) 这些资源组成一个整体，对用户是透明的，即用户使用任何资源时不必知道这些资源在哪里。


    +   4) 一个程序可分散到各个计算资源上运行；


    +   5) 各个计算机系统地位平等，除了受全系统的操作系统控制外，不存在主从控制和集中控制环节。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 第一章 绪论


    # 1.2 分布计算系统的相关概念


    # ◆紧密耦合与松散耦合分布计算系统


    +   > 紧密耦合分布计算系统

    +   1) 连接方式：内部总线或机器内互连网络；

    +   2) 处理资源间距离：物理上分散，相距很近；

    +   3) 处理资源：处理机；

    +   4) 通信方式：共享存储器。


    +   > 松散耦合分布计算系统

    +   1) 连接方式：通信网络；

    +   2) 处理资源间距离：地理上分散，相距很远；

    +   3) 处理资源：计算机系统；

    +   4) 通信方式：报文交换。'
  merge: -1
  img_proc: true
