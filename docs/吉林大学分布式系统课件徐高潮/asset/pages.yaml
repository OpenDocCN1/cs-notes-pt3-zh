  md: '# 第八章 分布式数据管理


    # 8.3 原子事务处理


    两阶段提交协议 (2PC)


    +   - 参加者的准备提交阶段：

    +     (1) 等待协调者的PREPARE报文；

    +     (2) 完成自己的工作，将运行记录项写入运行记录；

    +     (3) 如果成功，则将COMPLETE项记入运行记录，并向协调者发送PREPARED报文；否则发送ABORT报文。


    +   - 参加者的提交阶段：

    +     (1) 等待协调者的裁决报文；

    +     (2) 向协调者发送回答。如果裁决是ABORT则将事务处理作废，同时将ABORT项写入运行记录中，释放锁，发送夭折承认报文ACK-ABORT；如果裁决是COMMIT，在运行记录上写入一个COMMIT项，释放锁，发送提交承认报文ACK-COMMIT。'
