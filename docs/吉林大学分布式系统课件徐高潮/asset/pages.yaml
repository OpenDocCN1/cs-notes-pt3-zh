    容错系统中的一致性算法


    分布式一致算法的正确性条件：


    +   (1) 一致性。所有正确的进程取得一致的结果，而且是最后的结果；

    +   (2) 合法性。所有进程同意的结果必须来自某个正确的进程的输入；

    +   (3) 有限性。每个进程在有限的步骤内取得一致的结果。'
