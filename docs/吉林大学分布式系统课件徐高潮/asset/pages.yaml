    # ◆Clouds的对象


    +   - 一个Clouds对象由以下部分组成：

    +     (1) 用户定义的代码；

    +     (2) 永久性数据；

    +     (3) 一块被临时分配的内存；

    +     (4) 一块被长久分配的内存。'
