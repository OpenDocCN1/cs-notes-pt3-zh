- pgno: 419
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # 基于锁的并发控制


    # 静态封锁和动态封锁：


    在静态封锁方式中，事务处理在执行操作前，对所有需要的数据对象封锁。这个方法相对简单，然而它限制了并发性，因为有冲突的事务处理必须串行执行。在动态封锁方式中，事务处理在执行的不同阶段对不同对象封锁。


    # 封锁范围：


    封锁范围是一个很重要的设计问题。显然，既可以对整个文件进行封锁，也可以对特定的记录进行封锁。封锁的范围越小，并发性越好。如果两个用户要修改同一个文件，并且它们是对这个文件的两个不同部分进行修改的话，则可以让他们同时进行。'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # 基于锁的并发控制


    两阶段封锁：两阶段封锁可以保证一致性，实现正确的并发控制。两阶段封锁的主要内容如下：访问一个对象前先封锁它，为此必须先获得锁；对所有要访问的对象封锁前不对任何对象进行解锁；不要封锁已经被封锁的对象，为此不同的事务处理不可同时获得冲突的锁；事务处理执行结束前，为每个被它封锁的对象解锁；一旦一个事务处理释放一个锁，该事务处理就不能再获得另外的锁。每个事务处理锁的过程可分成两个阶段：锁的增长阶段和锁的收缩阶段。增长阶段中事务处理获得所有的锁而不释放任何锁；收缩阶段释放所有的锁而不取得另外的锁。'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    基于锁的并发控制


    两阶段封锁的问题：


    问题1：在锁的增长阶段会出现死锁的问题。发生死锁是因为在加锁机制中，锁是一种竞争的资源。死锁问题可以用第六章讨论的办法来解决。


    问题2：在锁的收缩阶段容易出现层叠回退（cascaded aborts）的问题。层叠回退的问题发生在 一个事务处理操作失败后回退，在回退前由于该进程已经释放了某些数据对象上的锁，所以其他事务处理可能已经读取了被这个事务处理修改过的数据对象，这些事务处理也必须回退。'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    基于锁的并发控制


    层叠回退的问题可以用严格的两阶段封锁方案来解决：在这种方案中，事务处理一直占有所有获得的锁直到操作完成，然后在一个单一的原子操作中释放所有的锁，但是它降低了并发程度。


