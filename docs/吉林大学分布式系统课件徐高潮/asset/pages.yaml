  md: '# 第四章 命名与保护


    # 4.2 加密技术


    公开密钥加密方法：


    +   3) RSA 加密：

    +   a) 确定密钥的算法：

    +   (1) 选择两个素数，p和q。

    +   (2) 计算n=p×q和z=(p-1)×(q-1)。

    +   (3) 选择一个与z互质的数d。

    +   (4) 找出e，使得e×d=1 mod z。

    +   确定公开密钥和保密密钥：公开密钥由(e, n)构成，保密密钥由(d, n)构成。

    +   b) 加密的过程：设X是明文，计算Y=Xᵉ(mod n)，则Y就是密文。

    +   c) 解密的过程：设Y是密文，计算X=Yᵈ(mod n)，则X就是明文。'
  merge: -1
  img_proc: true
