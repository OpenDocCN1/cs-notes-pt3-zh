  md: '# 第三章 分布式程序设计语言


    # 3.1 分布式程序设计语言概述


    # ◆分布式应用程序的分类


    +   并行、高性能应用程序。通过并行性达到加速是在分布计算系统上运行应用程序的最主要的原因。


    +   容错应用程序。而分布式计算系统具有允许部分失效的特性，即由于各处理机具有自治性，一个处理机的故障不影响其他处理机的正常工作，所以可靠性高。程序和数据也可在若干处理机上复制而进一步增加可靠性。


    +   具有专用功能的应用程。一些应用程序可以被构造成为一组专用的服务程序。例如文件服务、打印服务、进程服务、终端服务、时间服务等。


    +   固有的分布式应用程序。有些应用程序本身就是分布的，在这种情况下，可以把工作站的集合看成一个分布式计算系统，这种应用程序必须在分布式硬件上运行。'
  merge: -1
  img_proc: true
