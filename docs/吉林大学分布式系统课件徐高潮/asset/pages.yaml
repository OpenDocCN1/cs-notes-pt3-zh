  md: '# 第十一章 分布式共享存储器


    # 11.3 使用目录的DSM


    # ◆链式目录


    缓存器块的替换：假设从C₁到Cₙ都有单元X的副本，并且单元X和单元Y都直接映射到缓存器同一行上。如果处理机Pᵢ读单元Y，必须从它的缓存器中先驱逐单元X。在这种情况下，有两种可能性：


    +   (1) 沿着链路向Cᵢ₋₁发送一个报文，将Cᵢ₋₁的指针指向Cᵢ₊₁，将Cᵢ从链路中脱离开。

    +   (2) 使从Cᵢ到Cₙ中的单元X无效。'
