- pgno: 471
  md: '# 第九章 分布式文件系统


    # 9.4 缓存


    ◆缓存的粒度 and 地点


    缓存的粒度：缓存单位愈大，则下次访问的数据在顾客方的本地找到的可能性愈大，即命中率愈高，但传送数据的时间和一致性问题也增加了。大缓存单位的一个优点是减少网络开销。


    从缓存的地点：使用磁盘缓存具有可靠性的优点。但是使用主存作缓存器也有若干优点。首先，它可支持无盘工作站；其次，从主存缓存器中访问数据要比从磁盘缓冲器中访问数据要快；第三，服务器缓存器（用于加速磁盘输入输出操作）是设在主存中，如果顾客缓存器也使用主存，就可以构造一个单一的缓存机构，服务器和顾客均可使用。两种缓存地点强调的功能不一样，主存缓存器主要减少访问时间，磁盘缓存器主要提高可靠性和单个机器的自治性。'
  merge: -1
  img_proc: true
- pgno: 472
  md: '# 第九章 分布式文件系统


    # 9.4 缓存


    ◆更新策略、缓存有效性检验和一致性


    立即写:最简单的策略是一旦数据写到缓存器中就把此数据写到服务器磁盘上，这种策略叫做立即写(write-through)。它的优点是可靠性，当顾客崩溃时丢失的信息很少。但是write性能很差。这种缓存方法等效于使用远程服务进行write访问，仅对read访问使用缓存。


    延迟写:另一个写策略是延迟对原本的更新。延迟写策略把修改先写到缓存器中，晚些时候再写到服务器磁盘上。这个方法的优点有两个：第一，因为写是对缓存进行的，所以write访问完成比较快；第二，对一个数据的多次重复写，只有最后一次有效并被写到服务器的原本上。但是，延迟写的方法会产生可靠性的问题，因为顾客崩溃时尚未写到服务器原本上的数据将丢失。'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# 第九章 分布式文件系统


    # 9.4 缓存


    ◆更新策略、缓存有效性检验和一致性


    几种延迟写策略：


    +   - 驱逐时写：当被修改过的数据块要被从缓存器中驱逐出去时，该数据块被发送到原本；


    +   - 周期性写：周期地扫描缓存器，把从上次扫描以来已被修改过的块发送给原本；


    +   - 关闭时写：当文件关闭时把数据写回到服务员。在文件打开很短时间或很少修改的情况下，这种方法不会很大地减少网络通信。


    “关闭时写”适合“对话语义”；“立即写”方法比较适合 UNIX语义。'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# 第九章 分布式文件系统


    # 9.4 缓存


    # ◆更新策略、缓存有效性检验和一致性


    判定本地缓存的数据副本是否与原本一致，有两个基本方法验证其有效性：


    +   (1) 顾客发动的方法。顾客与服务员联系，检查本地数据与原本是否一致。这个方法的关键是有效性检验的频率。


    +   (2) 服务员发动的方法。服务员为每个顾客登记被该顾客缓存的文件或文件的某个部分。当服务员检测出可能不一致时，必须做出反应。服务员发动方法的一个问题是违背顾客/服务员模型。'
  merge: -1
