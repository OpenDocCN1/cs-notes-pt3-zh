- pgno: 158
  md: '# 第四章 命名与保护


    # 4.1 分布式系统中的命名


    ◆名字解析


    在名字空间中，根据节点的路径名，就可以寻找到这个节点所存储的任何信息，这个查找的过程就称为名字解析。


    +   1) 名字解析过程： N:<label-1, label-2, ..., label-n>


    这个路径名的解析是从命名图中节点N开始的，首先在节点N的目录表中查找名字label-1，得到label-1所代表的节点的标识符；然后在label-1所代表的节点的目录表中查找名字label-2，得到label-2所代表的节点的标识符；此过程一直进行下去，如果N:<label-1,
    label-2, ..., label-n>在命名图中是实际存在的，就能够得到label-n所代表的节点的标识符，从而得到该节点的内容。'
  merge: -1
  img_proc: true
