    +   ➢ 报文队列


    CORBA的支持持久性通信的模型称为报文排队 (message-queuing) 模型，CORBA使用了一个附加的报文服务 (messaging service)
    来支持这种通信模型。在报文服务的情况下，有两种附加的异步的方法请求方式，一种是回调 (callback) 模式，另一种是收集 (polling) 模式。


    为了支持持久性通信，ORB的底层通信系统应该能够保存报文，直至它们被接收为止。'
