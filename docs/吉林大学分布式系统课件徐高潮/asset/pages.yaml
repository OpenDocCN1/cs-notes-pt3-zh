    # ◆弱一致性


    弱一致性模型是使用同步变量实现的一个一致性模型，他有如下三个特性：


    +   (1) 访问与数据存储有关的同步变量时，必须遵守顺序一致性模型；


    +   (2) 以前的所有写操作在每个副本上没有完成之前，对同步变量进行的操作不允许执行；


    +   (3) 以前的所有对同步变量的操作完成之前，对数据项进行任何读或写操作不允许执行。'
