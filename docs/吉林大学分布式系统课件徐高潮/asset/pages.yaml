  md: '# 第一章 绪论


    # 1.6 分布计算系统的体系结构与设计


    # ◆ 分布计算系统的分层体系结构


    分布计算系统可以分成若干逻辑层，层与层之间称为接口，每层有两个接口。层所提供的功能还可进一步分割成若干模块，模块之间也有接口。接口由以下三部分组成：


    +   1) 一套可以见到的抽象对象(资源)以及对这些对象所要求的

    +   操作和参数。


    +   2) 一套控制这些操作的合法顺序的规则。


    +   3) 操作和参数所需要的编码和格式化约定。'
