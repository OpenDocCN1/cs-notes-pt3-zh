  md: '# 第十二章 基于对象的分布式系统


    # 12.3 DCOM


    DCOM的服务


    # DCOM 服务和 CORBA 服务的对应关系


    | CORBA 服务 | DCOM/COM+服务 |

    |---|---|

    | 收集 | ActiveX 数据对象 |

    | 查询 | 无 |

    | 并发 | 线程并发 |

    | 事务处理 | COM+的自主(Automatic)事务处理 |

    | 事件 | COM+事件 |

    | 通告 | COM+事件 |

    | 外观化 | 打包设施 |

    | 生存周期 | 类工厂，JIT 激活 |

    | 许可 | 特殊的类工厂 |

    | 命名 | 名字(monikers) |

    | 性质 | 无 |

    | 交易 | 无 |

    | 持久性 | 结构化存储 |

    | 关系 | 无 |

    | 安全性 | 授权(Authorization) |

    | 时间 | 无 |'
