- pgno: 509
  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆缓存和复制


    NFS v4的两种缓存方案：简单方案和委派方案


    简单方案：当顾客打开一个文件时，就将该文件的数据取到本地的缓存中，然后对该文件的读和写操作就在该缓存中进行。当关闭该文件时，缓存中被修改过的数据要被传回给文件服务器，对文件服务器上文件的原本进行刷新。NFS要求无论何时当一个顾客打开以前关闭的文件，而且这个文件在顾客方被缓存，那么顾客需要马上激活缓存中的数据。在激活缓存中的数据时，需要检查缓存中的数据是否是最新的，当缓存中的数据是过时的就使其无效。'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆缓存和复制


    NFS v4的两种缓存方案：简单方案和委派方案


    委派方案：允许NFS服务员将它的一部分权力委派给顾客。如果一个服务员将一个打开文件的权利委派给某个机器上的一个顾客，并且这个顾客得到了写权限，那么来自同一个机器上的其他顾客的文件加锁请求可以在本地得到处理。很明显服务员应该在随后能够对其委派出的权利进行收回。收回委派的权利要求服务员能够向顾客发送反向的调用。由于反向调用要求服务员能够追踪那些它向其委派过文件的顾客，所以在这里NFS服务员不再是无状态的。'
  merge: -1
  img_proc: true
