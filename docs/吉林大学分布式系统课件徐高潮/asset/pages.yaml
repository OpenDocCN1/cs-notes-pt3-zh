  md: '# 第七章 分布式系统中容错技术


    # 7.6 可靠的组通信


    ◆可靠的组播通信中的可扩充性


    ▸层级式反馈控制


    +   • 在层级式可靠的组播方案中，进程组被划分成多个子进程组，这些子进程组被组织成树型结构，包含有发送者的子进程组是树的根。在一个子进程组内，可以采用任何一种可靠的组播技术。


    +   • 每个子进程组任命一个本地协调者，负责处理该子进程组内的接收者的重发请求。本地协调者有自己的历史缓冲区。如果协调者本身丢失了报文m，它会要求它的父亲子进程组的协调者重发报文m。'
