  md: '# 第十一章 分布式共享存储器


    # 11.4 DSM系统的实现


    # 结构和粒度


    1) DSM的硬件实现方法典型地支持了较小的粒度。


    2) 页的大小：较大的页能够减少分页的开销，但是是可能引起共享可能性越大。另一个影响页大小选择的因素是必须保留该系统中有关页的目录信息：页越小，则目录越大。


    3) 结构化共享存储器的一个实现方法是根据数据类型进行共享。这种方法是把共享存储器作为面向对象的分布式系统中的对象而进行构造。


    4) 另一个方法是把共享存储器构造成为像一个数据库。Linda就是一个这种模式的系统。它把它的共享存储器安排成为一个相联存储器，叫做元组(tuple)空间。'
