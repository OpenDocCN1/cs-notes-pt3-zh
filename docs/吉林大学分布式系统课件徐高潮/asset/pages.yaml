    准确时间值的获取和物理时钟的同步


    物理时钟的同步过程：


    +   1) A通过网络向B发送请求；

    +   2) B读取本地时钟值；

    +   3) B的时钟值通过网络传递给A；

    +   4) 按照网络所需的传输延迟对B的时钟值进行校正；

    +   5) 比较A的时钟值和B的时钟值。


    物理时钟的同步方式：集中式、分布式。'
