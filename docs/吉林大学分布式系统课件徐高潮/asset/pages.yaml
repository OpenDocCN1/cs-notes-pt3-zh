  md: '# 第三章 分布式程序设计语言


    # 3.6 分布式控制描述语言DCDL


    ◆选择语句：


    一个选择语句表示为：

    [G₁→C₁ □ G₂→C₂ □...□ Gₙ→Cₙ]


    选择语句选择其组成的被保护的命令之一执行。如果多余一个命令可被选择，选择将是不确定的。如下的选择语句


    [x ≥ y → m:=x □ y ≥ x → m:=y]


    表示如果 x ≥ y，将 x 赋予 m；如果 y ≥ x，将 y 赋予 m；如果 x ≥ y 并且 y ≥ x，则将 x 或 y 之一赋予 m。'
