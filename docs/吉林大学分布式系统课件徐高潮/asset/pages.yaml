  md: '# 第十一章 分布式共享存储器


    # 11.4 DSM系统的实现


    # ◆一致性协议


    两类一致性协议：写无效协议和写更新协议


    在写无效协议中，一块数据可能有很多个只读副本，但是，只有一个是可写副本。这种协议之所以被称作写无效协议，是因为在开始一次写操作之前，除了将被写的那个副本之外，其他副本均变成无效。


    在写更新方式中，一次写操作将更新所有副本。'
