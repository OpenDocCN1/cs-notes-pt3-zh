- pgno: 426
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # 基于时间戳的并发控制


    实例：假设数据对象x的最近一次读和写的时间戳分别为ts_RD(x)=4和 ts_WR(x)=6，对数据对象x有下列读写操作顺序：


    read(5, x, 5), write(6, x, 7), read(7, x, 9), read(8, x, 8), write(9, x, 8)


    +   (1) read(5, x, 5)操作请求被拒绝，对应的事务处理5被取消，因为 ts=5<ts_WR(x)=6；


    +   (2) write(6, x, 7)操作请求被接受，对应的事务处理6继续执行，ts_WR(x)更新为7；


    +   (3) read(7, x, 9)被接受，对应的事务处理7继续执行，ts_RD(x)更新为9；


    +   (4) read(8, x, 8)也被接受，对应的事务处理8继续执行，但是ts=8<ts_RD(x)=9，所以ts_RD(x)=9保持不变；


    +   (5) write(9, x, 8)操作请求被拒绝，对应的事务处理9被取消，因为'
