  md: '# 第一章 绪论


    # 1.2 分布计算系统的相关概念


    分布计算系统的异构性 的表现：


    +   分布计算系统的异构性

    +     计算机系统的异构性

    +       硬件异构性

    +         指令系统不同

    +         数据表示方法不同

    +         机器的配置不同

    +       操作系统异构性

    +         操作系统功能不同

    +         系统调用不同

    +         文件系统不同

    +       程序设计语言的异构性

    +     通信网络的异构性

    +       硬件异构性：接口硬件不同、连接方法不同、通信方法不同。

    +       软件异构性：通信协议不同。'
