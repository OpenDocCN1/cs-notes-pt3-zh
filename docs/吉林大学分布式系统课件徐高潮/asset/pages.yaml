    4） 检查点原子更新的实现：


    假设库A和库B现在保存的检查点是C1，现在要用检查点C2取代库A和库B的内容。在取代前，假设Tₐ₁=Tₐ₂=Tᵦ₁=Tᵦ₂=1，检查点的更新过程如下：（1）为了更新库A，先置Tₐ₁=2；（2）将库A的内容用检查点C2取代；（3）库A更新完毕，置Tₐ₂=2；（4）为了更新库B，先置Tᵦ₁=2；（5）将库B的内容用检查点C2取代；（6）库B更新完毕，置Tᵦ₂=2；'
