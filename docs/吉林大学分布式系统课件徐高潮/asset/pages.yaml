- pgno: 496
  md: '# 第九章 分布式文件系统


    # 9.7 SUN网络文件系统(NFS)


    # ◆NFS服务员


    NFS v4以前的版本同许多其他分布式文件系统的区别是，其文件服务员是无状态的。但是，NFS v4放弃了这种方案，其服务员是有状态的。


    # NFS v4服务员采用有状态方案的原因：


    +   • 对文件进行加锁和需要进行访问认证；


    +   • 希望NFS v4运行在广域网上，由于性能上的需要，要求顾客方有效地利用缓存技术，从而需要一个有效的缓存一致性协议。


    +   • NFS v4支持回叫过程(callback procedure)，即服务员可以向顾客发送一个远程过程调用，很明显地，这要求服务员保持对其顾客状态的追踪。'
  merge: -1
  img_proc: true
