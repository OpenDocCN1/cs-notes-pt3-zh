- pgno: 240
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    +   ◆ 物理时钟

    +   ➢ 分布式物理时钟


    每个节点计算机以预先定义好的时间间隔定期地广播它的当前时间。由于时钟存在漂移，假定广播报文并不是很准确地在同一时刻发出。一旦一个节点广播了它的当前时间，就立即启动一个定时器，在定时期内接收其它节点的报文，每个报文标明了当地的当前时间，然后分别按对应的网络延迟对其它节点的时间值进行校正。'
  merge: -1
