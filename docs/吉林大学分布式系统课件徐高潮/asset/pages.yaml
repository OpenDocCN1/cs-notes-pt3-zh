  md: '# 第十一章 分布式共享存储器


    # 11.1 基本概念


    # ◆什么是分布式共享存储器系统


    ▶分布式共享存储器系统是分布式操作系统中的一个资源管理部件，它在没有物理上共享的存储器的分布式操作系统中实现了共享存储器模式。这种共享存储器模式在分布式系统中提供了一个可供系统内所有节点所共享的虚拟地址空间。程序设计者可以像使用传统的存储器一样使用该虚拟地址空间。这种物理上分布逻辑上共享的存储器就叫做分布式共享存储器(Distributed
    Shared Memory—DSM)。

    每一个节点都可以拥有存储在共享空间的数据，数据的所有者也可以跟随数据从一个节点移到另一个节点。当一个进程访问共享地址空间中的数据时，映像管理员就把共享存储器地址变换到本地地址或远程的物理存储器地址。'
