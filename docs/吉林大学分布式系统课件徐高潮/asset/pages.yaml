- pgno: 312
  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # ◆死锁检测的实例


    # ➢OR模型下的Chandy-Misra-Hass算法


    +   1) 使用两类报文：(query, i, j, k)和(reply, i, j, k)，表示这些报文属于由进程Pᵢ发起的并由Pⱼ送往Pₖ的扩散计算。


    +   2) 一个进程的依赖集合包括所有它在等待以便获得报文的进程。如果接收进程Pₖ是活动的，它会忽略所有的查询和回答报文。如果它被阻塞，它会向它的依赖集合中的进程发送查询。


    +   3) 一旦收集到回答报文，接收进程将向发起者发送一个回答报文。发起者以及每个中间进程用一个计数器记录查询和回答的数目。如果这两个数字相同，即发起者的每个查询都得到了回答，就表明发起者处于死锁状态。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # ◆死锁检测的实例


    # ➤OR模型下的Chandy-Misra-Hass算法


    当接收进程Pₖ处于阻塞状态时，会有几种可能：


    +   - 如果这是Pᵢ发起的第一个来自Pⱼ的报文(这个报文的发送者Pⱼ叫做Pₖ关于Pᵢ的结合者)，它将向它的依赖集合中的所有进程发送这个查询，并且将查询数目存储在一个局部变量num(i)中。令局部变量wait(i)表示这一进程从它接收到它的第一个由Pᵢ发起的查询起一直被阻塞这一事实。


    +   - 如果这个查询是Pᵢ发起的但不是第一个来自Pⱼ的报文，即当wait(i)仍然成立时，Pₖ将马上回答。


    +   - 如果从wait(i)变为假的那一时刻Pₖ运行过，那么这个查询就被丢弃。'
  merge: -1
  img_proc: true
