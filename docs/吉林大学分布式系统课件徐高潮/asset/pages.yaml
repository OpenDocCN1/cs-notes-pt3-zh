    # ❖ 系统的全局状态的定义


    2）一致的全局状态和非一致的全局状态：


    +   a) 全局状态 GS 是一致的，当且仅当

    +   \[

    +   \forall i,j,\; inconsistent(LS_i,LS_j)=\phi

    +   \]


    +   b) 全局状态 GS 是非传送中的，当且仅当

    +   \[

    +   \forall i,j,\; transit(LS_i,LS_j)=\phi

    +   \]


    如果一个全局状态是一致的并且是非传送中的，那么它就是强一致的，也就是说，局部状态集是一致的并且没有正在传送中的报文。'
