  md: '# 第七章 分布式系统中容错技术


    # 7.4 分布式检查点算法


    # 一致性检查点


    +   5) 一个强一致 (strongly consistent) 的检查点集合是由一系列的没有孤儿报文和没有丢失报文局部检查点组成。


    +   6) 一个一致的检查点集合是由一系列没有孤儿报文的局部检查点组成。


    显然一个强一致的检查点集合包括一系列局部检查点，在这些检查点之间，进程之间没有报文传送。如果每个进程都在发送一个报文之后生成一个检查点，那么最近的检查点集合将永远是一致的。'
