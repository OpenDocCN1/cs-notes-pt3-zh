  md: '# 第七章 分布式系统中容错技术


    # 7.4 分布式检查点算法


    # 一致性检查点


    +   4） 多米诺效应(domino effect)


    为了解决孤儿报文的问题，进程Pj回卷到上一个检查点时，要清除对孤儿报文的纪录。然而，这样一来有可能出现这样一种情况：在最近的检查点和上一个检查点之间，Pj向Pi发送了一个报文n，假定Pi在当前检查点之前收到了报文n，现在这个报文n成了孤儿报文。这样，Pi需要进一步回卷。这种由于一个进程的回卷导致另外一个或多个进程的回卷的效果叫做多米诺效应。


