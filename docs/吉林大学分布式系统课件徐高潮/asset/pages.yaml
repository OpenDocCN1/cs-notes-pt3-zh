- pgno: 304
  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # 层级式死锁检测


    在层级式死锁检测算法中，站点被分层地放在一个树中。一个站点的死锁检测只涉及到它的下一级站点。例如，设A、B和C是控制器，而C是A和B的最低的公共祖先。假定节点Pᵢ出现在控制器A和B的局部等待图中，那么节点Pᵢ也必定出现在如下控制器的等待图中：


    +   (1) C控制器；

    +   (2) 所有位于从C到A的路径上的控制器；

    +   (3) 所有位于从C到B的路径上的控制器。


    而且，如果Pᵢ和Pⱼ出现在控制器D的等待图中，并且在D的一个下一级控制器（子控制器）的等待图中有条从Pᵢ到Pⱼ的路径，那么边(Pᵢ, Pⱼ)一定存在于D的等待图中。'
  merge: -1
  img_proc: true
- pgno: 305
  md: "# # 第六章 分布式系统中的死锁\n\n# ## 6.3 死锁的检测\n\n◆ 关于死锁检测和恢复的研究方向：\n\n+   1) 算法正确性。严格证明死锁检测算法的正确性是困难的，由于报文的传输延迟是不可预知的，所以得到一致的全局状态是很困难的。\n\
    +   \n+   2) 算法性能。需要在信息流量(监测和恢复算法的复杂性)和死锁持续时间(监测和恢复的速度)之间达成妥协。\n+   \n+   3) 死锁解决。一个好而快的死锁检测算法可能并不能提供足够的死锁信息用于解决死锁。\n\
    +   \n+   4) 假死锁。一个检测程序不仅要满足前进要求，即必须在有限的时间内发现死锁，还要满足安全要求。如果一个死锁被发现，那么这个死锁应该确实存在的。\n\
    +   \n+   5) 死锁概率。检测和恢复算法的设计依赖于给定系统中死锁发生的概率。"
  merge: -1
