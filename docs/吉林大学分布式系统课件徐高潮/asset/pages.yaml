- pgno: 562
  md: '# 第十章 分布式调度


    # 10.4 空闲工作站的调度结构


    # ◆工作站共享问题


    工作站共享问题包括以下一些内容：对工作站使用模式的分析，设计分配远程处理能力的算法和结构，研究远程执行设备。


    # 全局调度机构的主要目标有：


    +   (1) 性能要求：调度机构占用整个系统的开销最小，它们不应该占用不使用此机构的应用程序的时间，也不应使被调度的应用程序的执行产生大的延迟。


    +   (2) 支持的系统规模：应该能支持几百个甚至上千个工作站。


    +   (3) 容错：一个或几个机器崩溃时，系统的远程执行设备应该在几秒钟之后能够继续工作。


    +   (4) 公平性：不管分配作业到哪个机器上，为该作业提供的性能都是同样可接受的。


    +   (5) 自治性：工作站属于个人所有，其他人使用不应影响主人的工作。'
  merge: -1
  img_proc: true
- pgno: 563
  md: '# 第十章 分布式调度


    # 10.4 空闲工作站的调度结构


    # ◆工作站共享问题


    设计全局调度设施在结构上要解决三个主要问题：


    +   (1) 有关负载的信息是如何传递的，使用公布的还是回答查询的办法？即选择哪一种信息策略。


    +   (2) 谁主动发起远程执行的要求，是作业进入的顾客节点(源节点)还是处理此作业的节点(服务员节点)？一个物理节点处理机可以是一个源节点，也可以是一个服务员节点。在服务员主动的情况下，此服务员主动寻找工作。这里所要解决的是选择什么样的启动策略。


    +   (3) 谁来决策为一个作业(程序)选择一个合适的执行主机，请求的发起者还是一个集中的服务员节点？这里要解决的是定位策略的问题。'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# # 第十章 分布式调度


    # 10.4 空闲工作站的调度结构


    +   ◆ 集中式调度


    集中式调度是在系统中有 一个中央调度服务 员，负责搜集状态信息并做出全部调度决策。各机器周期性地向它发送状态更新报文，报告它们的负载信息；顾客向它发送远程执行请求。中央调度服务
    员根据负载情况，建立一个主机候选者的有序表，依次选择主机，对顾客的远程执行请求进行响应。使用中央调度服务 员查询状态会减少报文传送数目。但是是因为机器由于本地活动可以在任何时间改变其负载，所以将产生状态信息过时的问题。


    解决集中式调度的容错问题的典型方法是提供多个备用服务 员。集中调度 的最后一个问题是 在何处运行调度程序。调度程序没有任何特殊要求，可放到任何空闲机器上，并可根据需要迁移。'
  merge: -1
  img_proc: true
- pgno: 565
  md: '# 第十章 分布式调度


    # 10.4 空闲工作站的调度结构


    # ◆分散式调度


    在全分散方案中，每个机器自己进行选择活动。它必须不断地记录整个系统状态或者当需要时查询系统状态信息。在前一种情况下，每个机器(即使是忙碌的机器)要定期地产生更新报文并向其他主机广播(公布)。而每个主机中维持一个主机状态表。在后一种情况下只有对主机选择有兴趣的那些主机才关心状态信息(查询)。采用查询方法，即每个需要获得空闲主机的顾客机发送查询报文请求得到当前状态信息，请求中包括所需资源的说明。该顾客从所有愿意成为候选主机的机器那里得到回答，并从中选取一个最合适的机器。'
