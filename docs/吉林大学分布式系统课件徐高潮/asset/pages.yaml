  md: '# # 第五章 同步和互斥


    # ## 5.3 系统的全局状态


    # ## 一致全局状态的充要条件


    一致性定理：一个检查点集S，其中每个检查点属于不同的进程，它们属于同一个一致性的全局状态当且仅当S中不存在这样的检查点，它有一条到S中任何其他检查点(包括它自身)的Z字形路径。


    推论：


    +   1) 检查点C可以属于一个一致性全局状态当且仅当C不属于一个Z字形循环；


    +   2) 属于不同进程的两个检查点A和B，它们可以属于同一个一致性全局状态当且仅当


    +   a) 没有包括A或B的Z字形循环；


    +   b) 在A和B之间不存在Z字形路径。'
