  md: '# 第十一章 分布式共享存储器




    +   ◆链式目录


    双向链式结构：另外一种解决替换问题的方法是使用双向链。这种方案为每个缓器副本保持一个向前和一个向后的指针，这样当缓器替换时，协议不必遍历整个链。双向链目录优化替换条件是以更大的平均报文长度(由于传送更多的目录指针)、缓器中的指针的存储空间加倍和更为复杂的一致性协议为代价的。'
