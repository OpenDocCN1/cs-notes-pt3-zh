  md: '# 第九章 分布式文件系统


    # 9.4 缓存


    ◆文件的远程访问方法


    文件的远程访问方法有两种：


    +   (1) 远程服务。在远程服务方法中，顾客把访问请求传送给服务员，服务员执行访问，结果回送给顾客。访问请求被变换成对服务员的报文，服务员的回答也打包成报文回送给顾客。


    +   (2) 缓存。如果请求的数据不在本地，则从服务员处取来那些数据的复制件给顾客。通常取来数据量比实际请求的要多得多，例如整个文件或几个页面，所以随后的访问可在顾客所在地的本地副本中进行。'
  merge: -1
