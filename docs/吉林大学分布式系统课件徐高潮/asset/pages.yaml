  md: "# 第八章 分布式数据管理\n\n# 8.1 一致性模型\n\n# ◆释放一致性\n\n释放一致性为用户提供了这两种同步操作：一种是acquire操作，它用于告诉系统调用进程要进入一个临界区，在这种情况下，其他进程对远程副本的修改应该传播到本地，并且要对本地的副本进行更新；另一种是release操作，用于告诉系统调用进程要离开一个临界区，在这种情况下，本地进程对本地数据副本的修改应该传播到所有的远程副本上。\n\
