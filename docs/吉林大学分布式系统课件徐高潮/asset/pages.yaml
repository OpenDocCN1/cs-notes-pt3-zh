- pgno: 583
  md: '# 第十一章 分布式共享存储器


    # 11.1 基本概念


    # 为什么需要分布式共享存储器


    从通信机制来看，DSM与报文传递方式有以下不同：


    +   (1) 访问的透明性。使用报文传递方式访问共享的数据变量时，程序必须明确地使用节点地址信息和通信原语（如SEND和RECEIVE）。而在DSM中系统提供了一种抽象的共享地址空间从而隐匿了物理地址和通信细节，使得程序直接面向共享的数据。


    +   (2) 共享数据结构的复杂性和异构性。使用报文传递方式，由于数据是在不同的地址空间之间传递，从而使得具有复杂数据结构的数据难以在不同类型的计算机及进程之间传递。而在DSM中，可以借助引用机制(reference)去实现上述数据访问，复杂性与异构性的问题由引用机制去处理，从而进一步简化了并行程序设计。'
  merge: -1
  img_proc: true
