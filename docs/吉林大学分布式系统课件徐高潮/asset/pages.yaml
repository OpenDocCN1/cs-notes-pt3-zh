- pgno: 306
  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # ◆ 死锁检测的实例


    +   > AND模型下的Chandy-Misra-Hass算法


    在Chandy-Misra-Hass算法中，分布式死锁检测算法使用一个特殊的报文，在等待图中该报文从一个进程传递到另一个进程，该报文称为探测报文(probe
    message)。如果报文回到发起者，那么就有死锁存在。探测报文包含一个三元组(i, j, k)，表示该报文是一个由进程Pᵢ发起的死锁检测报文，现在由进程Pⱼ所在的站点发往进程Pₖ所在的站点。


    当一个进程接收到一个探测报文时，它首先检查自己是否等待某个(或某些)进程，如果它正在等待某个(或某些)进程，它将向所有它等待的进程转发这个探测报文。'
  merge: -1
  img_proc: true
