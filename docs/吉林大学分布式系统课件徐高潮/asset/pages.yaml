- pgno: 651
  md: '# 第十二章 基于对象的分布式系统


    # 12.2 CORBA


    # 接口库和实现库


    +   1) CORBA提供了一个接口库，里面保存所有接口定义，允许对调用请求的动态解释。在许多CORBA系统中，有一个独立的进程提供了一个标准的接口用于向接口库保存和检索接口定义。当一个接口定义被编译的时候，IDL编译器会赋予这个接口一个库标识符，这个标识符是从库中检索一个接口定义的基本手段。


    +   2) 一个实现库中包含了所有需要实现和激活的对象。对象适配器负责激活一个对象，保证对象能够在一个服务器的地址空间中运行，从而使得对象的方法能够被调用。对一个给定的对象引用，适配器能够与实现库联系从而准确地找到一个对象的实现。例如，实现库应该维持一张表，该表记录了哪一个服务器需要启动，服务器需要为特定的对象监听哪一个端口号。实现库还要提供服务器需要装载和执行哪一个可执行文件等信息。'
  merge: -1
