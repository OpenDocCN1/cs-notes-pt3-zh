    # 11.2 实现DSM的算法


    ◆ 中央服务器算法

    使用一个中央服务器员，负责为所有对共享数据的访问提供服务并保持共享数据唯一的副本。读和写操作都包括由执行该操作的进程向中央服务器员发送请求报文，中央服务器员执行请求并回答，读操作时回答数据项，写操作时回答一个承认。


