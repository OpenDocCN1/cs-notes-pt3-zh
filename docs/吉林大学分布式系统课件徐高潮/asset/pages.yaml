  md: '# 第十一章 分布式共享存储器


    # 11.2 实现DSM的算法


    # ◆全复制算法


    全复制算法允许数据块在进行写时也可以复制，因而它遵循了“多读者/多写者”(MRMW)协议。保持复制数据一致性的一种可能的方法是对所有的写操作进行全局排序，而只对与发生在执行读操作节点上的写操作相关的那些读操作进行排序。


