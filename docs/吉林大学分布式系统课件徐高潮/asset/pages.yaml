  md: '# # 第三章 分布式程序设计语言


    # 3.6 分布式控制描述语言DCDL




    当两个语句并发执行时，可能产生与顺序执行不同的结果。我们先定义两个符号：


    +   1. R(S₁)，S₁的读集，即在S₁中被引用的所有变量的集合。

    +   2. W(S₁)，S₁的写集，即在S₁中被修改的所有变量的集合。


    Bernstein提出了以下三个条件，对于两个并发执行的语句S₁和S₂，必须满足这三个条件才能使它们并发执行的结果与它们以任意次序顺序执行的结果相同。


    +   1. R(S₁) ∩ W(S₂) = Φ

    +   2. R(S₂) ∩ W(S₁) = Φ

    +   3. W(S₁) ∩ W(S₂) = Φ'
