  md: '# 第八章 分布式数据管理


    # 8.1 一致性模型


    一致性模型是进程和数据存储之间一个基本约定。也就是说，如果进程对数据的访问遵守特定的规则，那么数据存储就能够正确地进行。


    # ◆严格一致性


    对于严格一致性模型来说，对一个数据项所进行的任何读操作所返回的值总是对该数据项最近一次进行写操作的结果。


