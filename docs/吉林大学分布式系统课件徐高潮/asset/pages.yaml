- pgno: 559
  md: '# 第十章 分布式调度


    # 10.3 动态调度


    ◆动态负载平衡算法的分类、设计决策和使用的参数


    负载平衡算法使用的参数：


    +   (1) 系统的规模。系统中处理器的数目是影响负载平衡决策的一个参数。


    +   (2) 系统负载情况。需要避免颠簸现象。


    +   (3) 处理器的输入流量。进程可以以任何随机模式到达处理器，如果处理器能够测定自己的输入流量并且和其他处理器比较，它就能比较容易评估系统即时的负载水平，从而对任务转移做出更好的决策。


    +   (4) 转移的负载门限。系统中触发任务转移的负载门限是一个关键参数，因为选择不当会导致系统不平衡和任务转移的连锁反应。'
