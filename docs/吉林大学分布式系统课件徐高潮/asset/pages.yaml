- pgno: 223
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    # ◆分布式系统中同步机构的作用


    +   ▸同步点：为了达到合作，各进程在执行的过程中必须存在若干点，超过这些点时，一个进程在另一个进程执行完某一活动前不能继续执行，这些点称为这两个进程之间的同步点。


    +   ▸分布式计算系统中共享资源的两类：一类是各进程可以同时访问的，如中央处理机（允许多个进程交叠使用一个处理机）、只读文件和不允许修改的存放子程序和数据的主存区域等；另一类是不允许多个进程同时访问的，每次只允许一个进程使用，如大多数外部设备（如打印机）、可写的文件以及主存中可修改的区域等。同步机构在互斥控制中的作用是对活动的执行进行排序。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    # ◆分布式系统中同步机构的作用


    ▸一致状态：一个计算机系统应该在所有时间内满足一定的外部规定或约束，如果一个计算机系统确实在所有时间内满足了一定的外部规定或约束，这时我们称系统状态是一致的。同步机构的目的就是给进程提供某种手段，使系统保持一致状态。


    ▸ 分布计算系统的计算方式分成三种：


    +   1) 完全复制的计算。任何操作所激发的每个活动必须由所有的消费者共同处理，要求所有的活动均应完成。这时同步机构的目的是保证消费者处理活动的次序必须相同。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 第五章 同步和互斥




    ▶ 分发计算系统的计算方式分成三种 ：


    +   2) 完全分割的计算。一个操作所激发的不同活动由不同的消费者分别独自处理。在这种情况下，同步机构的目的是保证所有相互干扰的活动成为有序的，使得该操作保持原子性(要么完成操作，要么干脆不发生)。


    +   3) 分割和部分复制的计算。一个操作所激发的活动中，某些是由不同的消费者独自处理的，某些操作是由一些消费者共同处理的。它兼有前面两种计算形式的特点。对于不同的计算方式，同步机构的目的和要求也是不同的。'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    评价同步机构的标准：


    +   1) 响应时间和吞吐量。各种机构应尽量利用系统的并行性质，以提高吞吐量和缩短响应时间。

    +   2) 恢复能力。同步机构应能使系统从故障中恢复过来。

    +   3) 开销。指使用同步机构的代价，包括额外增加的报文长度、数量和对它们的处理时间，以及用于存放同步信息所需的额外存储空间。

    +   4) 公平性。操作发生冲突时，同步机构应能避免生产者饿死，各生产者具有平等的权利。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# # 第五章 同步和互斥


    # ## 5.2 同步机构


    ➢ 评价同步机构的标准：


    +   5）可扩充性。系统扩充新的处理机时同步机构应不影响其正常运行。


    +   6）连接方式。使用某些同步机构要求生产者在逻辑上全部互连，这样所产生的开销可能很大；有些同步机构只要求一个生产者知道其邻居的情况，开销也较少。


    +   7）初始化。使用同步机构要求系统应容易进行初始化，知道进程何时可以进行生产和消费活动。


    +   8）排序方法。当生产者对一序列操作进行某种指定排序时，必须交换报文，各种同步机构实现效率可能大不相同。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    分布式系统中同步机构：


    同步实体：物理时钟、事件计数器、逻辑时钟、循环令牌和顺序器、进程等。


    # 集中式同步机构和分布式同步机构：


    +   1） 在集中式同步机构中，每个生产者每次发动一个操作时均要访问该同步实体。集中式同步实体有一个为所有必须相互同步的进程都知道的名字，任何时候这些进程的任何一个均可访问这一同步实体。执行每个功能如进程调度、数据访问控制等均要经过集中的同步实体进行控制。


    +   2） 分布式同步机构不存在一个集中的同步实体，执行各种功能时是分散控制的。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    分布式系统中同步机构：


    集中式同步机构和分布式同步机构的优缺点：


    +   1) 集中式同步机构最大的缺点是不可靠，一旦出故障就可能造成全局不工作；另外在性能方面也大大下降，因为集中会产生一个瓶颈。但实现简单。

    +   2) 分布式同步机构在可靠性和性能方面优于集中式同步机构，也有许多种，主要有多重物理时钟、多重逻辑时钟、循环令牌等。但实现复杂。'
  merge: -1
  img_proc: true
