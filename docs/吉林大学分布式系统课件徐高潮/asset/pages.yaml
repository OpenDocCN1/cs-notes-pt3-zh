  md: '# 第五章 同步和互斥


    # 5.4 互斥算法


    # Maekawa互斥算法


    请求子集：在Maekawa互斥算法中，一个进程P在发出申请报文后，不用得到所有其他进程的回答，而只须得到一个进程子集S中的所有进程的回答即可进入临界区。称S是P的请求子集。假设Rᵢ和Rⱼ分别是进程Pᵢ和Pⱼ的请求子集，要求Rᵢ
    ∩ Rⱼ ≠ NULL。


    +   1) 当进程Pᵢ请求进入临界区时，它只向Rᵢ中的进程发送请求报文。


    +   2) 当进程Pⱼ收到一个请求报文时，如果它自上一次临界区释放后还没有发出过回答报文给任何进程，且自己的请求队列中无任何请求，它就给该请求报文一个回答。否则，请求报文被放入请求队列中。


    +   3) 进程Pᵢ只有收到Rᵢ中的所有进程的回答后，才能进入临界区。


    +   4) 在释放临界区时，进程Pᵢ只给Rᵢ中的所有进程发送释放报文。'
