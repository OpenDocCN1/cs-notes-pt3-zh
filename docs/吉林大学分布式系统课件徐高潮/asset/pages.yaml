    按照组播报文的排序规则，组播可以分为如下四类：


    3) 因果关系顺序组播：所有接收进程必须按报文固有的因果关系顺序接收。例如报文m1按因果关系排在报文m2之前，那么所有的接收进程必须先接收报文m1后接收报文m2，不管m1和m2是否是由同一个发送者发送的。如果报文之间不具有因果关系的先后顺序，不同的接收进程可以有不同的接收顺序。


