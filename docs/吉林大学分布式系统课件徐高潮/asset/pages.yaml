- pgno: 379
  md: '# 第七章 分布式系统中容错技术


    # 7.6 可靠的组通信


    # 可靠的组播通信中的可扩充性


    简单方案：接收者收到组播报文后不向发送者发送应答报文，只有在接收者发现丢失一个报文后，才向发送者发送一个反馈报文，指出某个报文丢失了。


    问题1：多个接收者丢失报文时，仍然会出现反馈报文拥塞的情况；


    问题2：在理论上讲，发送者必须在其历史缓冲区中长时间保存它发送的每一个广播报文。'
  merge: -1
