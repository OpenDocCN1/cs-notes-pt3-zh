- pgno: 629
  md: '# # 第十一章 分布式共享存储器


    # ## 11.5 DSM实例: Ivy和MemNet


    # ❖ Ivy存储器管理


    (1) 页替換。 Ivy的虚拟共享存储器的页有五种：可写的、所有者可读的、只读的、空的和不使用的。空的页和不用页都具有最高的被替换优先权，即如果需要一页则先替换它们。由于只读页可被其所有者制造备份，所以可以简单地丢弃。对于所有者读的页和可写页的丢弃当然需要所有权的转让。


    (2) 存储器分配。为了支持动态数据结构，使用动态存储器分配方案是必要的。Ivy有两种方法。第一种是集中式方法，即所有进程向集中的“存储器分配程序”请求存储器和归还存储器。这是个简单的方法。第二个方法，除了集中式分配程序外，每个节点还有它自己的分配子程序。每个节点请求一大块存储器并执行来自本地进程的存储器请求。仅在本地节点用完存储器时才和集中式管理程序联系。'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# # 第十一章 分布式共享存储器


    # ## 11.5 DSM实例：Ivy和MemNet


    # ❖ MemNet——硬件实现的DSM


    在MemNet中，全部主机共享一个公共的地址空间。此地址空间是分页的，这些页可根据要求在系统内迁移。对此地址空间的访问被直接送到主机内的接口部件（作为一个智能存储器模块）。这个部件能缓存一部分共享存储器并和其他主机的这种部件相互作用调进另外的页。


