    CORBA系统的一般组织方式：


    +   - 顾客静态代理： 一个顾客应用程序有一个Proxy代理，Proxy代理将调用请求打包传送给服务员，并且将来自服务员的响应进行拆包传送给顾客程序。需要注意的是，Proxy和ORB之间的接口不必是标准化的，因为CORBA假定所有的接口都是由IDL描述的，CORBA为用户提供了一个IDL编译器，这个编译器能够生成必要的代码用于处理顾客和服务员的ORB之间的通信。'
