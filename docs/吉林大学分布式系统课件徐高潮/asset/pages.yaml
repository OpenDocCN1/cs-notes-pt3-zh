  md: '# 第四章 命名与保护


    # 4.1 分布式系统中的命名


    分布式系统中的名字空间的实现


    大规模分布式计算系统中名字解析


    重复式名字解析和递归式名字解析的比较：


    +   1) 递归式名字解析的主要缺点是要求每个名字服务器具有较高的性能。递归式名字解析要求名字服务器完整地解析它所得到的整个路径名，特别是对于全局层的名字服务器来说，情况更为严重。


    +   2) 递归式名字解析有两个主要优点。第一个优点是如果采用缓存，那么递归式名字解析的缓存效果同重复式名字解析的缓存效果相比更为有效；第二个优点是可以减少通信代价。'
  merge: -1
