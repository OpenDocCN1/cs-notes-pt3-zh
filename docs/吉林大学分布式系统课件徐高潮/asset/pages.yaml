    # 8.4 多副本更新和一致性管理


    # ◆主站点方法


    一个节点被指定是主站点，其他是备份的。所有请求直接发送到主站点。


    +   (1) 读请求。主站点只是简单地读取并返回结果。没有备份站点参与。如果主站点失效，经选举在备份站点中产生一个新的主站点。


    +   (2) 写请求。当主站点完成更新前收到一个写请求，它就向至少k个备份站点发送更新请求。一旦所有站点已经收到请求，主站点完成操作再送回结果。'
