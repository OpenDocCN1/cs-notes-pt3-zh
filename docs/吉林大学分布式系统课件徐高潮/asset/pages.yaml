- pgno: 380
  md: '# 第七章 分布式系统中容错技术


    # 7.6 可靠的组通信


    ◆可靠的组播通信中的可扩充性


    ➢非层级式反馈控制


    +   1) 成功接收到组播报文的接收者不向发送者发送反馈报文，只有在接收者发现有报文丢失的时候才会发送反馈报文，也就是说只有否定应答被当作反馈报文返回给发送者。


    +   2) 如果一个接收者发现它丢失了报文m，它不仅将反馈报文发送给发送者，还将反馈报文组播给组内的所有其他进程。


    +   3) 其他同样丢失了报文m的接收者收到这样的反馈报文后，就不会发送同样的反馈报文。这样就收者只会收到一个反馈报文，从而只重复组播报文m一次。'
  merge: -1
  img_proc: true
