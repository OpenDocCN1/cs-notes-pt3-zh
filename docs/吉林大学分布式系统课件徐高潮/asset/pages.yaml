- pgno: 27
  md: '# 第一章 绪论


    # 1.6 分布计算系统


    ◆分布计算系统的组成


    硬件/固件层(硬核)。该层包括处理器、主存、I/O设备、键盘终端以及用于数据采集和物理过程控制的各种硬件设备。


    内核的最基本最重要的功能是进程通信(IPC)，除此之外，还包括进程的同步机制、进程管理、存储管理和I/O管理等功能。


