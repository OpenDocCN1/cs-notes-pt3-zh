  md: '# 第七章 分布式系统中容错技术


    # 7.5 拜占庭故障的恢复


    容错系统中的一致性算法


    一致性协议对系统的要求：


    同步系统与异步系统：如果所有的处理器都是在可以预料的速度下运行，那么这个系统就是同步的。确切地说，处理器是同步的当且仅当存在一个常量s≥1，每当任何一个处理器运行了s+1步，其它的所有处理器都至少运行了1步；否则这个系统就是异步的。


    用卡诺图描述一致性对系统的要求：


    定义布尔变量


    +   （1）系统是同步的(A=1)还是异步的(A=0)。

    +   （2）通信延迟是有限的(B=1)还是无限的(B=0)。

    +   （3）报文是有序的(C=1)还是无序的(C=0)。

    +   （4）传输机制是广播的(D=1)还是点到点的(D=0)。'
  merge: -1
