- pgno: 21
  md: '# 第一章 绪论


    # 1.5 分布计算系统与计算机网络系统


    # ◆区分计算机网络系统与分布式计算系统


    ➢从文件系统的访问方法上区分：


    +   1) 没有操作系统的访问方法。计算机A上的程序将B上的文件复制到A上来，然后再在A上访问此文件。


    +   2) 有网络操作系统的访问方法。这种方法是把不同的文件系统连接起来，一个机器上的程序可以使用路径名打开另一个机器上的文件，只是这个路径名中包含了另一个机器的信息。


    ```

    或如: open("//machine_name/pathname", READ);

    ```


    +   3) 分布计算系统使用的方法。在这种方法中，所有各子系统的文件系统组成一个整体文件系统。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 第一章 绪论


    # 1.5 分布计算系统与计算机网络系统


    从访问控制方面区分


    UNIX和其他许多操作系统给每个用户赋予一个唯一的内部标识符（UID），以利于访问控制。


    +   1) 没有网络操作系统下的情况。这种办法要求所有要访问机器X上的文件的用户先使用属于机器X的用户名在机器X上登录。


    +   2) 有网络操作系统下的情况。在这种办法中，由网络操作系统对不同机器上的UID进行变换。


    +   3) 在分布式操作系统下的情况。在分布式计算系统中，对每个用户只设一个UID，使用它可以访问任何机器，不必经过变换。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 第一章 绪论


    # 1.5 分布计算系统与计算机网络系统


    是否区分本地执行和远程执行方面判断：


    +   1) 在没有网络操作系统的计算机网络系统中，用户要远程执行一个程序时，该用户先远程登录到一个远程机器上，然后在那里运行作业。


    +   2) 在有网络操作系统的计算机网络系统中，用户在自己的终端上输入一个特殊的命令，指定一个机器运行一个程序。如：remote vax4 who，这个命令是让远程计算机vax4运行程序who。


    +   3) 在分布式系统中，用户执行一个程序时，只需简单的给出要执行的程序的程序名和相关的参数，并不指出在何处执行这个程序，何处执行由操作系统决定。'
