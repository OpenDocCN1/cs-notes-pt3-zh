  md: '# 第八章 分布式数据管理


    # 8.4 多副本更新和一致性管理


    # ◆循环令牌方法


    循环令牌法把全部控制者排成一个虚拟的单向环，给一个控制者分配一个暂时的唯一的控制优先权。使用循环令牌方法可以实现两种不同的多副本更新协议：


    +   (1) 为了在全部控制者/存储处理机上发动执行事务处理，控制者必须等待收到控制令牌。


