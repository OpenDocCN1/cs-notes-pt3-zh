  md: '# 第六章 分布式系统中的死锁


    # 6.1 死锁问题


    # ◆死锁发生的条件


    +   (1) 互斥。正如我们第五章所讨论的，互斥是一种资源分配方式，保证同一个资源在同一时刻最多只能被一个进程占用，它用于防止多个进程同时共享访问不可同时共享访问的资源。


    +   (2) 不可剥夺的资源分配。系统将一个资源的访问权分配给某一个进程后，系统不能强迫该进程放弃对该资源的控制权。


    +   (3) 占有并等待。必然有一个进程占用了至少一个资源，同时在等待获取被其他进程占用的资源。


