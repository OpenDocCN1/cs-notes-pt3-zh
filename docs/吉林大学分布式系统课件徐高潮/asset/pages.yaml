- pgno: 603
  md: '# 第十一章 分布式共享存储器


    # 11.2 实现DSM的算法


    ◆算法性能


    # 四种算法的平均访问代价：


    中央服务员算法： C_c = (1-1/S)·4p


    迁移算法： C_m = f·(2P+4p)


    读复制算法： C_rr = f''·[2P+4p+Sp/(r+1)]


    全复制算法： C_fr = [1/(r+1)]·(S+2)p


    每一个表达式都有两部分，第一部分在“·”的左边，表示访问远程数据项的概率。第二部分在“·”的右边，等于访问远程数据项的平均代价。'
  merge: -1
