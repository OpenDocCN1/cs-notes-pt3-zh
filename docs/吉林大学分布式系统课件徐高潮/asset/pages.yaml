- pgno: 531
  md: '# 第十章 分布式调度


    # 10.1 调度算法概述


    ◆调度算法的目标和有效性评价


    启发式调度算法中常采用的一些启发式规则：


    +   - 相互依赖性较大的进程，由于它们之间常有比较多的进程通信应该分配到比较接近的执行节点上，可能的话，应该在同一个节点上。


    +   - 访问共享文件的进程应该分配到比较接近的执行节点上，可能的话，应该分配在文件服务器节点上。


    +   - 很少有内在关系的进程可以分布在不同的机器上。


    +   - 如果一个节点已经是重负载的，不应该向该节点分配另外一个进程。'
  merge: -1
