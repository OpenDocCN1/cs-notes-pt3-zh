  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # 死锁检测的实例


    +   AND模型下的Mitchell-Merritt算法


    为什么每个进程每次只能请求一个资源？


    在每个进程每次只能请求一个资源的情况下，等待图中的一个循环中的每个节点都等待环内的节点，所以只有进入环内的边。其反向等待图中则没有进入环内的边，就不会有大标识符的进程产生的探测报文进入回路，而不能检测出死锁。'
