  md: '# 第五章 同步和互斥


    # 5.4 互斥算法


    # Maekawa互斥算法


    Maekawa算法的两个极端情况：


    +   (1) 退化为集中式互斥算法。P_c (c∈{1, 2, ..., n})作为协调者，对所有进程P_i，有：

    +   R_i: {P_c}, 1≤i≤n


    +   (2) 完全分布式的互斥算法。对所有进程P_i，有：

    +   R_i: {P_1, P_2, ..., P_n}, 1≤i≤n'
