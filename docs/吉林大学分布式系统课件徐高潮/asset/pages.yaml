- pgno: 302
  md: '# 第六章 分布式系统中的死锁


    # 6.3 死锁的检测


    # ◆分布式死锁检测


    Knapp将分布式死锁检测算法分为以下四类：


    +   1) 路径推动算法(path-pushing algorithm)。先在每个机器上建立形式简单的全局等待图。每当进行死锁检测时，各机器就将等待图的拷贝送往一定数量的邻居节点。局部拷贝更新后又被传播下去。这一过程重复进行直到某个节点获得了足够的信息来构造一个等待图以便做出是否存在死锁的结论。


    +   2) 边跟踪算法(edge-chasing algorithm)。分布式网络结构图中的回路可以通过沿图的边传播一种叫探测器的特殊信息来检测。当一个发起者得到一个与自己发送的探测器相匹配的探测器时，它就知道它在图中的一个回路里。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# # 第六章 分布式系统中的死锁




    # 分布式死锁检测


    Knapp将分布式死锁检测算法分为以下四类：


    +   3) 扩散计算(diffusing computation)。怀疑有死锁发生时，事务管理器通过向依赖于它的进程发送查询启动一个扩散进程。这里不会生成全局等待图。发送查询信息时，扩散计算就增长；接收回答后，扩散计算就缩减。根据所得信息，发起者会检测到死锁的发生。


    +   4) 全局状态检测(global state detection)。这个方法基于Chandy and Lamport 的快照方法。可以通过建立一个一致的全局状态而无需暂停当前的计算来生成一个一致的全局等待图。'
  merge: -1
