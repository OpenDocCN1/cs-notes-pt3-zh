  md: '# 第三章 分布式程序设计语言


    # 3.4 逻辑上分布地址空间的语言


    # 同步式报文传递语言：


    +   1) 创建并行进程：

    +   如CSP提供简单的并行命令创建固定数目的并行进程。进程包含名字、逻辑变量和一系列语句(进程体)。CSP可以创建一组相似的进程，但其数目必须在编译时是个常数。例如并行语句

    +   [writer::X:real;...||reader(i:1..2)::...]

    +   创建三个进程，叫作“writer”、“reader(1)”和“reader(2)”。Writer有一个局部变量X。下标记i可在reader进程的体中使用。


    +   2) 通信：

    +   CSP进程不能使用全局变量相互通信，只能使用同步的receive和send。执行send或receive的进程受阻一直到其对方执行完互补的语句为止。

    +   例如

    +   [X::Y! 3 | | Y::n:integer; X? n]

    +   在进程X的语句中，把值3发送给Y。在进程Y的语句中，从进程X读取输入，并存放到局部变量n中。'
