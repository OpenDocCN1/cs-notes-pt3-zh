- pgno: 45
  md: '# 第二章 进程通信


    # 2.1 同一节点上的进程间通信


    # 共享内存


    使用共享内存技术，不同进程可以同时访问相同的内存区域。能够通过共享它们地址空间的若干部分，然后对存储在共享内存中的数据进行读和写，从而实现彼此直接通信。


    共享内存技术实现 进程通信


    +   1) 由一个进程来创建 / 分配一个共享内存段，其大小和访问权限在其生成时设置。系统调用 shmget 建立一个新的共享内存区或者返回一个已经存在的共享内存区。


    +   2) 进程可挂接此存储段，同时将其映射到自己当前的数据空间中。每个进程通过其挂接的地址访问共享内存段。系统调用 shmat 将一个共享内存区附加到进程的虚拟地址空间上。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 第二章 进程通信


    # 2.1 同一节点上的进程间通信


    共享内存技术实现 进程通信


    +   3) 当一个进程对共享内存段的操作已经结束时，可以从虚拟地址空间中分离该共享内存段。系统调用 shmdt 从进程的虚拟地址空间分离一个共享内存区。


    +   4) 进程对该共享内存段进行操作。系统调用 shmctl 对与共享内存相关联的各种参数进行操作。


    +   5) 当所有进程完成对该共享内存段的操作时，通常由共享内存段的创建进程负责将其删除。'
  merge: -1
  img_proc: true
