- pgno: 138
  md: '# 第三章 分布式程序设计语言




    ❖ 重复语句：

    一个重复语句指定其组成选择语句的交互次数，这些语句带保护或不带保护，它的形式有如下三种：


    +   1. *[带保护的选择语句]

    +   2. *[不带保护的选择语句]

    +   3. (n)[选择语句]


    在第一种情况下，当所有的保护都经过时，重复语句终止。在第二种情况下，执行不终止。第三种是一个特别的重复语句，其重复的次数最多为n。'
