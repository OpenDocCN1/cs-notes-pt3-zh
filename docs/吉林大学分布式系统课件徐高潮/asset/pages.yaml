- pgno: 322
  md: '# 第七章 分布式系统中容错技术


    # 7.2 容错系统的基本构件


    # 故障—停止处理器


    故障—停止处理器的实现：现有 一个可靠的坚固存储器、一个可靠的存储处理器（控制存储媒介的处理器）以及k+1个处理器，将它们转变成为故障—停止处理器的方法如下：k+1个处理器中的每一个都运行同样的程序并通过存储处理器访问同一个坚固存储器。如果任何一个请求是不同的，或者任何一个请求没有在指定的期间到达，则意味着检测到一个失效事件，因而应该丢弃所有请求。因为系统表现为一个故障—停止处理器，这一方法产生一个k—故障—停止处理器，除非系统中k+1个或更多的部件失效。'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 第七章 分布式系统中容错技术






    一个原子操作就是由硬件独立执行的一系列动作。也就是说，每个动作或者被完全彻底地执行，或者所有的动作根本没有执行，系统的状态保持不变。原子操作中的每一个动作都是独立的，当执行这一动作时，在进程中感觉不到外界活动的存在，也意识不到外界状态的变化。与此相似，任何外界的进程均感觉不到一个孤立的原子操作的内在状态的变化。这就是所谓的原子操作的“全有或全无”的性质，即一个原子操作要么全部完成，要么在执行过程中出现错误的时候相当于根本没有执行。


    原子操作失效时，可以通过简单地重做来恢复。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 第七章 分布式系统中容错技术


    # 7.3 节点故障的处理


    向前式恢复和向后式恢复：


    +   1) 在向前式恢复中，假定可以完全准确地得到系统中的故障和损失的性质，这样就有可能去掉这些故障从而使得系统继续向前执行。


    +   2) 向后式恢复适用于系统的故障无法预知和去掉的情况，在这种情况下，要定时地存储系统的状态，这样当失效导致系统处于不一致的状态时，系统可以恢复到从前没有发生故障的状态，在此状态下重新执行。'
  merge: -1
  img_proc: true
