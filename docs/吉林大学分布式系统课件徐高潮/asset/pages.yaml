- pgno: 425
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    基于时间戳的并发控制


    读或写操作的处理方式：


    +   (1) 读请求 read(T, x, ts)。如果 ts < ts_WR(x)，说明有一个对 x 的写操作发生在事务处理 T 启动之后，则读请求被拒绝，事务处理
    T 被取消。反之，让 T 执行该读操作，并把 max{ts_RD(x), ts} 赋给 ts_RD(x)。


    +   (2) 写请求 write(T, x, ts)。如果 ts < ts_WR(x)，或者 ts < ts_RD(x)，说明有一个对 x 的写操作或者有一个对
    x 的读操作发生在事务处理 T 启动之后，则写请求被拒绝，事务处理 T 被取消。反之，让 T 执行该写操作，并把 ts 赋给 ts_WR(x)。'
  merge: -1
