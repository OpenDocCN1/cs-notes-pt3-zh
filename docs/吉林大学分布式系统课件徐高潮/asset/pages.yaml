  md: '# 第十一章 分布式共享存储器


    # 11.1 基本概念


    ◆共享存储器中缓存一致性方法


    有两类基本方法实现缓存一致性：即探听缓存方法和使用目录的方法。


    ▸探听(snooping)缓存方法用于具有广播能力的通信介质中，例如共享总线。每个缓存器为了保持自己数据的一致性要监听共享总线上进行的由其他处理机发出的存储器操作。


    Berkeley是一个典型例子，它是一种写无效协议，它假设通过单总线访问共享的物理存储器。此协议采用一个所有权方案。


    一个数据块的所有者是一个缓存器，是上次对该数据块的修改者，如果该块被其所有者清除，则主存作为其所有者。'
  merge: -1
