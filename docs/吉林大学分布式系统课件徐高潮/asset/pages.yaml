  md: '# 第四章 命名与保护


    # 4.2 加密技术


    # 保护和安全的三个方面：


    +   1) 数据加密：主要研究对数据加密的算法、算法实现的效率等问题。


    +   2) 计算机网络的安全保密：计算机网络的目的是资源共享，同时也是分布式计算系统、网格系统的基础平台，但网络容易产生不安全和失密问题。方便并且行之有效的方法是采用加密技术，实现用户到用户之间的加密，确保数据在网络传输过程中（特别是通信系统中）不丢失和被篡改。


    +   3) 访问控制：像多用户单机系统那样，规定什么人可以访问系统的什么数据，得到何种服务，并对用户进行身份鉴别，对他们的访问权限加以限制（授权）。


    上述三个问题归并成两个：加密技术，访问控制。'
  merge: -1
  img_proc: true
