  md: '# 第十一章 分布式共享存储器


    # 11.1 基本概念


    # ◆DSM的设计与实现问题


    (1) 共享地址空间结构和粒度。共享地址空间的结构指的是存储器中共享数据的布局方法，它依赖于应用程序类型，地址空间可以是平面的，分段的或物理的。粒度是指共享单元的大小，可以是字节、字、页或复杂的数据结构，它也是可用的并行性的度量，依赖于通信开销和应用程序表现的局部性类型。结构和粒度是密切相关的。


    (2) 缓存一致性协议。不同的协议有不同的假设，选择协议依赖于存储器访问模式和支持环境。在写无效协议中，一块共享数据可能有很多人只读副本，但仅有一个可写副本，每进行一次写时，除了一个以外，其他副本均变成无效。在写更新协议中。每次写都要对所有副本进行更新。'
  merge: -1
