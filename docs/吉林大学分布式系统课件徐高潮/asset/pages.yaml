- pgno: 235
  md: '# # 第五章 同步和互斥


    # 5.2 同步机制


    +   ◆ 物理时钟


    +   ▶ 集中式物理时钟


    基于广播的方式2（Berkeley算法）：


    +   1) 顾客收到广播时间之后向集中的时间服务员发送它本地的当前时间值；


    +   2) 每个顾客到时间服务员有不同的平均延迟，这些延迟时间预先存放在时间服务员处。时间服务员根据这些延迟对不同顾客传送来的的本地时间进行校正；


    +   3) 任何校正过的的时间如果同时间服务员上的时间差值超过了对应节点到时间服务员的延迟时间常量，那么这个时间将不被列入考虑之列。因为这个时间可能是由于系统故障导致的，被认为是是不准确的。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 第五章 同步和互斥


    # 5.2 同步机构


    +   ◆ 物理时钟

    +   ➢ 集中式物理时钟


    基于广播的方式2（Berkeley算法）：


    +   4) 剩余被校正的时间值连同时间服务器上的时间值一起进行平均，这个平均值作为当前时间。


    +   5) 时间服务器为每个顾客计算误差，然后将每个误差发送给对应的顾客。


    +   6) 每个顾客校正自己的时钟。同前一个处理方式一样，时钟是不能往回拨的，但是可以按误差值将自己的始终慢下来。'
