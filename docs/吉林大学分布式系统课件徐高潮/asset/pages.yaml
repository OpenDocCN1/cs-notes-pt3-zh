    +   第二种是最多一次语义(At-Most-Once)。

    +   第三种是至少一次语义(At-Least-Once)。

    +   第四种是多次中最后一次语义(Last-of-Many-Call)。

    +   第五种是幂等语义(Idempotent)。'
