  md: '# 第十一章 分布式共享存储器


    # 11.3 使用目录的DSM


    # ◆全映像目录


    写过程：


    +   (1) C₃检测到包含单元X的数据块是有效的，但是该处理机对数据块无写的权限，这由块的允许写位表示。


    +   (2) C₃发出一个对包含单元X的存储模块的写请求，并且停止处理机P₃。


    +   (3) 存储器模块向C₁和C₂发出无效请求。


    +   (4) C₁和C₂收到无效请求后，设置对应的位指出包含单元X的数据块是无效的，并向存储器模块发回一个承认。


    +   (5) 存储器模块收到这个承认，将“重写”位置位，清除指向C₁和C₂的指针，并向C₃发出写允许报文。


    +   (6) C₃收到写允许报文，更新该缓存器中的状态，并且激活处理机P₃。'
