- pgno: 18
  md: '# 第一章 绪论


    # 1.5 分布计算系统与计算机网络系统


    ◆分布计算系统和计算机网络系统有什么区别呢？


    +   > 如果用户能说明他在使用哪一个计算机，则他是在使用一个计算机网络系统而不是分布式系统。一个真正的分布式计算系统的用户不必知道他的程序在哪个机器上运行，他的文件在哪里存放，等等。使分布式计算系统具有这种性质的是它的软件：分布式操作系统。


    +   > 从计算机网络系统上所运行的操作系统软件来分，计算机网络系统的发展可分为三个阶段：无操作系统阶段、运行网络操作系统阶段和运行分布式操作系统阶段。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # 第一章 绪论




    网络操作系统一般具有以下特点：


    +   1) 每个计算机都运行自己的操作系统，而不是运行共同的、全系统范围的操作系统或其一部分。

    +   2) 每个用户通常在自己的计算机上以“远程登录”的方式或其他明确指出的方式使用不同的机器，而不是由系统给用户进程分配计算机，因而不能并行执行某个程序。

    +   3) 用户知道他们的文件存放在哪里，在机器之间移动文件时必须明确地使用“文件传送”命令。

    +   4) 系统没有容错能力，或者仅具有很少的容错能力。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 第一章 绪论


    # 1.5 分布计算系统与计算机网络系统


    分布计算系统应达到的目标：


    +   1) 程序(进程)、终端用户或程序员对全部分布资源应该有一个唯一的连贯的观点，不必明确地知道所需资源是在本地、远程或是分散的，主 机之间的边界应尽可能隐匿。


    +   2) 在性能方面，NOS结构的实现是有效的、可用的。本地用户进程访问本地服务时应象单机操作系统一样有效，不增加额外数目和类型的报文或系统调用。


    +   3) 可扩充性。用户很容易在现存服务上增加新的服务而不必要求系统程序员增加新的驻存程序，正如在单机系统上增加新的服务不必要要求修改现有的操作系统。'
  merge: -1
