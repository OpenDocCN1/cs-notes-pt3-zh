  md: '# 第七章 分布式系统中容错技术


    # 7.5 拜占庭故障的恢复


    容错系统中的一致性算法


    交互一致性算法


    交互一致性：系统中的每个非出错进程都使用来自进程Pᵢ的同样 的值来进行决策。这样，一般的一致性问题就变为系统中的 进程都同意一个特殊的进程(比如P₀)的值。确切地说：


    +   (1) 所有非出错进程都使用进程P₀的同样的值v₀。


    +   (2) 如果发送进程P₀是非出错的，那么所有非出错进程都使用P₀发送的值。


    结论：在有k个出错节点的情况下，只有进程的总数至少为3k+1时才能获得一致。'
