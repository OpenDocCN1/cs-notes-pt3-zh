  md: '# 第七章 分布式系统中容错技术


    # 7.6 可靠的组通信


    # ◆ 原子组播


    原子组播：必须保证一个组播报文要么被进程组内所有的进程接收，要么没有一个进程接收该报文。另外，还要求所有的组播报文应该以同样的顺序被进程组中所有的进程接收。


    +   ▸ 虚同步 (virtual synchrony)


    +   • 组视图：原子组播的实质是一个组播报文m唯一地和需要收到这个报文的一组进程相联系。需要收到这个报文的进程表是包含在这个进程组中所有进程的集合的一个视图，这个视图成为组视图
    (group view)。


    +   • 虚同步：一个进程在发送报文m的进程失效的时候，进程组的其他进程要么都收到报文m，要么所有的其他进程都忽略报文m，具有这种性质的可靠的组播被称为是虚同步的组播。'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# 第七章 分布式系统中容错技术


    # 7.6 可靠的组通信


    +   ◆ 原子组播


    +   ▸ 虚同步 (virtual synchrony)


    虚同步的原理其实就是每一个组播通信发生在视图改变之间。也就是说，一个视图改变扮演者一个栅栏的作用，组播不能跨越栅栏。任何一个组播通信都是发生在 一个视图改变之后，并且在下一个视图改变起效之前完成。'
