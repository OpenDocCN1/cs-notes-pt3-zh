- pgno: 412
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # 可串行化调度


    并发事务处理执行中的两种现象：


    +   (1) 暂时不一致性。在T₁和T₂的第一次写操作之后而在第二次写操作之前，账户存款之和是不一致的。


    +   (2) 冲突。如果事务处理T₂被安排到T₁中的两次写操作之间运行，则账户存款总和为¥400，而不是¥350，它包含一个不一致状态。


    暂时不一致性在所有顺序计算过程中是固有的，因此，在一个事务处理结束前一般不应该要求一致性。为了达到一致性，必须避免冲突。'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# # 第八章 分布式数据管理


    # 8.2 并发控制




    可串行化调度： 并行控制就是控制相互冲突操作的相对执行顺序，完成这种控制的算法也叫同步技术。我们希望使用这样的同步技术，它能使各个非冲突的操作交叠执行，以便进行各事务处理时具有最大的并发性。一组事务处理中各个操作的交叉次序叫做调度。如果一个调度给每个事务处理一个一致的状态观点，则这种调度叫做一致调度。一致调度的充分条件是这种调度执行的结果和所有事务处理串行执行的结果是一样的。满足这个条件的调度叫做可串行化调度或线性化调度。'
  merge: -1
  img_proc: true
