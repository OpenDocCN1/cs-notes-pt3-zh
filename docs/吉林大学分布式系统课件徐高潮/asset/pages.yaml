    分布式文件系统中名字透明和位置透明：


    +   (1) 数据和位置分离为文件提供一个较好的抽象。

    +   (2) 名字透明给用户共享数据提供了一个方便的方法。

    +   (3) 位置透明把命名结构从存储器结构和服务器间的结构分开。'
