- pgno: 348
  md: '# 第七章 分布式系统中容错技术


    # 7.4 分布式检查点算法


    # 混合检查点


    其基本思想是在一个较长的时间段中使用同步检查点，而在较短的时间段内使用异步检查点。也就是说，在一个同步时间段里，会有若干个异步时间段。因此，我们可以有一个可以控制的回卷，从而保证不会在建立检查点的过程中引入过多的开销。


    例如：准同步检查点。这个方法允许每个进程异步地设置检查点，从而保证了进程的独立性。同时，对恢复线的扩展采用发起通信的检查点协调方法，从而可以限制恢复过程中回卷的传播。'
