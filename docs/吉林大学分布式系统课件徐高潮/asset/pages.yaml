- pgno: 652
  md: '# 第十二章 基于对象的分布式系统


    # 12.2 CORBA


    # CORBA的服务


    # CORBA 的服务


    | 服务 | 功能描述 |

    | --- | --- |

    | 收集 | 对象被分组聚集到一个链表中、一个队列中、一个堆栈中或一个集合中 |

    | 查询 | 提供了一种手段构造对象组，使对象可以使用一种声明的方式进行查询 |

    | 并发 | 允许对共享对象进行并发访问 |

    | 事务处理 | 允许顾客在一个事务处理中访问多个对象，支持平面的和嵌套的事务处理 |

    | 事件 | 通过事件支持异步通信 |

    | 通知 | 提供一个高级设备支持基于事件的异步通信 |

    | 外观化 | 处理对对象打包或拆包，使得到对象可以被存储在磁盘上或者通过网络发送。 |

    | 生存周期 | 支持创建、删除、拷贝、和移动对象 |

    | 许可 | 允许对象的开发者将一个许可附加到一个对象 |

    | 命名 | 提供对象名字到对象标识符之间的映射 |

    | 性质 | 使用一些(参数,值)对来对对象的性质进行描述 |

    | 交易 | 提供一些关于该对象的一些广告信息 |

    | 持久性 | 支持对象的持久性存储 |

    | 关系 | 表达对象之间的关系 |

    | 安全性 | 提供诸如认证、权限、安全通信和管理 |

    | 时间 | 在一定的误差范围内提供当前的时间 |'
  merge: -1
