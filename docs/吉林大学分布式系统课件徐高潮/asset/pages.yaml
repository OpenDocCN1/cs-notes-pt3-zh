- pgno: 678
  md: '# 第十二章 基于对象的分布式系统


    # 12.3 DCOM


    # DCOM的Moniker


    +   - 基本的DCOM对象模型只支持暂时性对象，也就是说当一个对象不再被引用时会销毁。为了对一个对象的生命周期进行扩展，使得其生命周期超过调用它的顾客，DCOM提供了一个moniker作为这个对象的持久性引用。这个持久性引用moniker被保存在磁盘上，这个moniker包含了重新构造这个对象所必需的信息，例如这个对象的最后一个顾客退出时，这个对象的状态。

    +   - DCOM提供了各种不同类型的moniker，其中一个重要的类型是文件moniker。对于文件moniker，它包含了一个本地的文件名字，这个文件用于构造对应的对象。另外它还包含一个类对象的标识符CLSID，这个类对象通过对应的类实际创建一个对象。

    +   - 一个文件moniker提供了一个BindToObject操作，顾客通过调用这个操作与这个moniker对应的对象结合。'
  merge: -1
  img_proc: true
