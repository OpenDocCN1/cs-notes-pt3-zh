  md: '# 第三章 分布式程序设计语言


    # 3.6 分布式控制描述语言DCDL


    语句并发(或并行)的条件


    我们可以用来Bernstein条件来寻找语句中可以并行执行的最大子集。为此我们定义了一个无向图，节点集由给定语句集组成，如果 S_i || S_j，则节点
    S_i 和 S_j 相连，可以并行执行最大的语句子集对应于最大的完全子图。


    例如： S1： a:=x+y， S2： b:=x×z， S3： x:=y+z， S4： c:=y-1。显然， S1， S2， S4 形成最大的完全子图，也就是说，
    S1 || S2 || S4。


