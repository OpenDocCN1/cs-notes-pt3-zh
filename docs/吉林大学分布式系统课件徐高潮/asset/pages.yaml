- pgno: 265
  md: '# # 第五章 同步和互斥


    # ## 5.4 互斥算法


    # ◆ Lamport时间戳互斥算法


    Lamport时间戳互斥算法由以下5条规则组成 ：


    +   1) 一个进程P_i如果为了申请资源，它向其它各个进程发送具有时间戳T_m:P_i的申请资源的报文，并把此报文也放到自己的申请队列中；


    +   2) 一个进程P_j如果收到具有时间戳T_m:P_i的申请资源的报文，它把它此报文放到自己的申请队列中，并将向P_i发送一个带有时间戳的承认报文。如果P_j正在临界区或正在发送自己的申请报文，则此承认报文要等到P_j从临界区中退出之后或P_j发送完自己的申请报文之后再发送，否则立即发送；


    +   3) 一个进程P_i如果想释放资源，它先从自己的申请队列中删除对应的T_m:P_i申请报文，并向所有其他进程发送具有时间戳的P_i释放资源的报文；'
  merge: -1
  img_proc: true
