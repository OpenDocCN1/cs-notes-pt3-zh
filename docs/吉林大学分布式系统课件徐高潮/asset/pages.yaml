- pgno: 410
  md: '# 第八章 分布式数据管理


    # 8.2 并发控制


    # 可串行化调度


    并发控制正确性标准有两条：


    +   (1) 用户交给系统的每个事务处理最终将被执行，并最终得到完成；

    +   (2) 多个事务处理并发执行的结果和这多个事务处理串行执行的结果相同。


    事务处理的例子：假设有三个账户(对象)A、B、C，最初各有存款¥200、¥100和¥50。现有两个事务处理T₁和T₂等待执行，T₁是从A取出¥100存入B，T₂是从B中取出¥50存入C。'
