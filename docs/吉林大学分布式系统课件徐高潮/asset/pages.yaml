    # ◆进程转移和远程执行的目的和方法


    ▶进程转移和远程执行的一般要求有以下两点：


    +   (1) 透明性。进程运行的结果与该进程在系统中什么地方执行无关。为了转移此进程不必用特定方式重新编写程序。也就是说，这些进程转移到远程执行环境后必须与在原地一样(名字、操作和数据，但不包括硬件)。


    +   (2) 有效性。迁移一个进程需要时间，支持该进程远程执行也需要时间，这些时间应尽量短。'
