    # 进程通信原语


    两种基本的实现进程通信的方法是：报文传递和远程过程调用 RPC。


    # 报文传递原语： send(b, msg) 和 receive(a, msg);


    +   1) 阻塞原语。阻塞性报文通信原语也称为同步 (Synchronous) 原语。阻塞原语不立即将控制权返回给调用该原语的进程，也就是说 send 一直被阻塞直到发送的信息被接收方收到并得到接收方的应答。同样地，receive
    一直被阻塞，直到要接受的信息到达并被接收。'
