  md: "# 第十二章 基于对象的分布式系统\n\n# 12.3 DCOM\n\n# ◆DCOM的通信\n\n# ➢事件\n\n+   • DCOM通过COM+提供了一个更为成熟的事件模型，这种模型更适合于实现我们所熟知的发布/订阅（publish/subscribe）系统。其基本思想同CORBA的推送风格的事件模型非常类似。\n\
