  md: '# 第三章 分布式程序设计语言






    进程之间的相互作用模式并不总是确定性的，有时还取决于运行时条件。因此，表示和控制非确定性模型被提出。选择语句和保护的( guarded)Horn子句 是两种表示和控制非确定性的模型。


