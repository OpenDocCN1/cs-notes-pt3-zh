  md: '# # 第十一章 分布式共享存储器






    MemNet使用的缓存一致性协议和Ivy使用的相同，即读操作必须总是返回该数据最低的值。每个MemNet部件有一块表，表中每项对应整个共享地址空间中的每一块，还包括下述状态标志：


    +   1. 有效。指出此缓存器对该块是否有 一个有效副本。

    +   2. 独占。指出本主机对该块是否有独占的访问权。

    +   3. 保留。指出该块的保留空间是否在本主机中。

    +   4. 位置。如果块是在本主机内，指出该块副本的位置。'
