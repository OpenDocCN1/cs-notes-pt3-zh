- pgno: 589
  md: '# 第十一章 分布式共享存储器


    # 11.1 基本概念


    # 共享存储器中缓存一致性方法


    目录协议：在共享存储器中设置存储器块的目录。当发生缓存不命中时，先把请求转到此目录。通常目录项中包含所有权、副本集（copyset）和该块的重写位。副本集指出该块数据在哪些缓存器中有副本，可用位向量来实现。发生读未命中时，先检查重写位，如果该块不处于重写状态，则共享存储器中的版本是有效的，于是简单地返回该块，并对副本集信息进行更新；如果该块的重写位置位，则该块的所有者必须修改该块，并且要更新共享存储器中的版本，向读者提供读副本。写未命中或者从读权变成写权时，要求目录的副本集使其其他副本无效。与探听缓存方案不同，读副本的位置都已经知道，因此，可以用顺序方式而不是以广播方式发送“无效”报文。目录方案不要要求广播介质，但在每次缓存未命中时要增加一次查表。'
  merge: -1
