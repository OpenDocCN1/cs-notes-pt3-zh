    2) 有两种类型的固定分布式管理者算法：固定的和广播的。固定算法中，每个处理机预定管理一部分页面。通常一个适当的散列函数用于把页面映射到处理机。广播算法中，访问页面出故障的处理机发出广播确定页面的真正所有者。广播算法性能比较差，因为所有处理机必须处理每个请求，减慢处理机的计算。'
