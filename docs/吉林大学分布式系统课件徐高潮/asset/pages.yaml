- pgno: 8
  md: '# 第一章 绪论


    # 1.2 分布计算系统的相关概念


    # 同构型与异构型分布计算系统


    +   对于同构型分布式系统而言，组成该系统的计算机的硬件和软件是相同的或非常相似的，同时组成该系统的计算机网络的硬件和软件也是相同的或非常相似的。


    +   对于异构型分布式系统而言，组成该系统的计算机的硬件或软件是不同的，或者组成该系统的计算机网络的硬件或软件也是不同的。'
  merge: -1
  img_proc: true
