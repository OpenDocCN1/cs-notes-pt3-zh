    ## 3.6.5 外部裁剪


    前面讨论的仅仅是舍弃窗口外的图形部分，保留窗口内的图形部分的过程。然而，在许多应用中需要保留窗口外部的图形部分，而舍弃窗口内的图形部分，既外部裁剪。


    外部裁剪的典型应用之一是多窗口系统。要正确地显示屏幕窗口，我们既需要内部裁剪又需要外部裁减。窗口内部的对象用内部裁剪，若有优先级更高的窗口覆盖在这些对象上，则对象用覆盖窗口进行外部裁剪。


    外部裁剪也常用于有覆盖图形的情况。例如，在广告或出版

    应用中的页面布局设计或者为图形加上标签和设计图模。外部裁剪技术还可以将图形、图象、简图合成起来。这些应用通过外部裁剪为将它们插入一幅较大的图中提供空间。


    凹多边形窗口的内部裁剪可通过外部裁剪来实现。下面以图图示的方式说明用凹多边形 V₁V₂V₃V₄V₅ 裁剪线段 P₁P₂，分为两步实现：

    - ① 用凸多边形窗口 V₁V₂V₃V₄ 对 P₁P₂ 做内部裁剪，得到裁剪后的线段 P₁''P₂''；

    - ② 用凸多边形 V₁V₅V₄ 对 P₁''P₂'' 做外部裁剪，得到线段 P₁''''P₂''。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_347_0.png)


    内部裁剪


    外部裁剪


    ## 3.7 光栅图形的反走样


    由于我们将物体的坐标点数字化为离散的整数像素位置，因而光栅算法生成的图形显示具有锯齿形或台阶状的外观。这种由于低频采样不充分而造成的信息失真称为走样(aliasing)。对此，可使用校正不充分采样过程的反走样(antialiasing)方法来改善所显示的光栅图形外观。


    增加光栅系统采样率的方法之一是简单地以较高分辨率显示对象。但即使使用当前技术能达到的最高分辨率，锯齿形仍会在一定范围内出现。由于能将帧缓冲器做成多大并仍保持刷新率

    在每秒 30～60 帧方面存在限制，而且要用连续参数精确地表示对象需要任意小的采样间隔。因此，除非硬件技术能发展到做成任意大的帧缓冲器，增加屏幕分辨率还不能完全解决走样问题。


    对于能显示两级以上光亮度的光栅扫描系统，可以用反走样方法来修改像素亮度。通过适当改变沿图元边界的像素亮度，可光顺边界以减少锯齿现象。


    一种直接的反走样方法是把屏幕看成比实际所具有的更细的网格来增加采样率，而后沿这种更细的网格使用采样点来确定每个屏幕像素的合适亮度等级。这种高分辨率计算，低分辨率

    显示的反走样技术称为过采样（Supersampling 或后滤波，因为像素亮度是子像素亮度的组合）。


    代替过采样的另一种反走样方法是通过计算待显示像素在对象上的覆盖区域来确定像素亮度。计算覆盖区域的反走样方法称为区域采样（Area Sampling 或前滤波，因为像素亮度作为一个整体来确定，而不要计算子像素亮度）。像素覆盖区域通过确定对象边界与单个像素边界的相交处而得到。


    光栅对象也可将像素区域显示位置移动而实现反走样，这种技术称为像素移相。它通过与对象几何形状相关的电子束的“微定位”而作用。


    ### 3.7.1 直线段的过采样


    直线段的过采样可以多种方法完成。对于直线段的灰度显示，可以把每个像素分成一定数目的子像素并统计沿线路径的子像素数目，而后将每个像素的亮度等级设置为正比于该子像素数目的值。例如，对下图的线段，每个像素区域被分割成九个子像素。


    因为任何像素中可供选择的子像素最大数目为 3，这种方法提供了零以上三种亮度设置。对于这个具体的例子，像素


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_351_0.png)


    (10, 20) 设置为最高亮度（级别 3）；像素 (11, 21) 和 (12, 21) 被设置为次亮度(级别 2)；(11, 20) 和 (12, 22)
    被设置为零以上最低级别（级别 1）。这样，线亮度分布在较大数目像素上，并且通过在阶梯状台阶附近显示有些模糊的线路径使阶梯形状得到光顺。如果要用更多的亮度等级来反走样，就需要增加每个像素的采样位置数：n²
    个子像素提供零以上 n 个亮度等级。


    在前面的过采样例子中，我们考虑了有限尺寸的像素区域，但把线处理成具有零宽度的数学实体。实际上，显示的线具有约与像素等宽的宽度。如果考虑到线的有限宽度，则可通过将每个像素亮度设置成正比于在表示线区域的多边形内的子

    像素数目来完成过采样。若子像素的左下角在多边形内，那么可把此子像素当作在线内。这种过采样的一个好处是，每个像素可能的亮度等级数等于像素区域内子像素的总数。对上图的线段，可以通过对平行于线段路径的多边形边界定位，来以有限宽度表示这样的线，如图所示，并且每个像素现在可设置成零以上九个亮度级别之一。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_353_0.png)


    用有限宽线过采样的另一个优点是：总的线亮度分布在更多的像素上。同样，如果是彩色显示，我们也可将此方法扩充来将背景色考虑进去。一特定的线可能穿过许多不同的颜色区域，我们可对子像素亮度进行平均来得到像素颜色设置。例如，一特定像素区域内的五个子像素被确定在红线的边界内，而其余四个像素落在蓝色背景区域内，则可将该像素的颜色计算为：


    Pixel_Color = (5*RED+4*BLUE)/9


    由过采样有限宽线得知，鉴别内部子像素比简单地确定沿线

    路径的子像素需要更多的计算。参照线路径定位线边界的计算也是复杂的，这种定位取决于线的斜率。对于 45° 线，线路径在多边形区域的中央；但无论是对水平线还是垂直线，都要求线路径是多边形的边界之一。对斜率
    |m|<1 的线，数学线路径被适当地定位在最接近于下面多边形边界；而对于斜率 |m|>1 的线，数学线路径被定位在最接近于上面多边形边界。


    ### 3.7.2 像素加权掩模


    过采样算法在实现时，经常给接近像素区域中心的子像素赋以更大的权值，因为我们希望这些子像素在确定像素的整体亮

    度中起更重要的作用。例如，对 3×3 的像素分割，采用的加权方案如下图所示。其中，中心子像素的权值是角子像素权值的 4 倍，是其他子像素权值的 2 倍，而后对九个子像素的每个网格所计算的亮度进行平均。


    指定子像素的相对重要性的值数组称为子像素权的“掩模”。也可为较大的子像素网格建立类似的掩模。


    | 1 | 2 | 1 |

    |---|---|---|

    | 2 | 4 | 2 |

    | 1 | 2 | 1 |


    3×3 子像素网格相对权值


    ### 3.7.3 直线段的区域采样


    通过将每个像素亮度设置为正比于像素与有限宽线的重迭区域，可实现对直线的区域采样。将线看成长方形，而在两相邻垂直（或两相邻水平）屏幕网格线间的线区域为四边形，像素的重迭区域就可通过确定在垂直列（或水平行）中每个像素覆盖多少个四边形而计算出。在线边界内子像素的总数近似等于覆盖区域，并且这种判断通过采用更细子像素网格而得到提高。对于彩色显示，则计算被不同颜色区域覆盖的像素区域，最后的像素颜色看作为各覆盖区域的平均颜色。


    ### 3.7.4 过滤技术


    直线反走样更精确的方法是过滤技术。这种方法类似于应用像素加权掩模，只是现在假想一个连续的加权曲面（或过滤函数）覆盖像素。常用的过滤函数有立方体、圆锥和高斯曲面。应用过滤函数的方法类似于应用加权掩模，但现在是在将曲面积分来得到加权的平均亮度。为减少计算量，通常用查表法来求整数值。


    ### 3.7.5 多边形区域边界的反走样


    直线段的反走样概念也可用于多边形区域的边界以消除其锯齿形外观。多边形区域边界的反走样方法，是以像素区域覆盖率为基础来确定每个边界位置处的像素亮度。具体说，当某像素与多边形区域相交时，求出两者相交区域的面积，然后以此面积值来决定该像素的颜色值或灰度值。


    计算一个像素与多边形区域相交区域的面积是很费时间的事。为了提高多边形反走样算法的速度，Pitteway 和 Watkinson 将画直线的 Bresenham
    算法发展成多边形的反走样

    算法。为了简单起见，假定多边形一边的方程是：


    $y = mx,\ 0 \le m \le 1$


    且多边形位于该边的右面（见图）。用 Bresenham 算法画直线时，每一步要计算判定函数 $P_i$ 以确定表示直线的像素点 $(x_i, y_i)$，由
    $P_i$ 的几何意义可知，$P_i$ 越大，像素和多边形相交区域的面积越大，反之亦然。因而可用 $P_i$ 确定像素点 $(x_i, y_i)$ 灰度值。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_360_0.png)


    不难证明


    2*(dy - dx) ≤ P_i < 2*dy, i = 1, 2, 3, …


    令


    d_i = (P_i + 2*(dx - dy)) / (2*dx)


    则易知 0 ≤ d_i < 1。 由于反映了 P_i 的大小，故可直接用于确定像素点(x_i, y_i)的灰度值。那么，用


    d_i = (P_i + 2*(dx - dy)) / (2*dx)


    代替画直线的 Bresenham 算法中的判定函数 P，即可得到多边形反走样算法的程序。

