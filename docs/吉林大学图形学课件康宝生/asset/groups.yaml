    x* = r₁₁·x,  y* = r₂₂·y\n\n可以看到，r₁₁为x方向上的缩放因子，r₂₂为y方向上的缩放因子，它们分别影响两个方向上的缩放效果。这些效果包括：\n\
    \n- - r₁₁ = r₂₂ > 1：图形沿 x、y 两个方向等比例放大；\n- - 0 < r₁₁ = r₂₂ < 1：图形沿两个方向等比例缩小；\n\
    - - r₁₁ ≠ r₂₂：由于图形在两个方向上的缩放系数不相等，所以经过变换后的图形将产生畸变。也能够对图形产生拉伸和压缩的效果。（缩放中心为坐标系原点）\n\
    \n### 2. 镜像（对称）变换\n\n对称变换的结果取决于对称轴的设置。\n\n#### （1）关于 x 轴的对称变换\n\n对于 x 轴的对称变换矩阵为：\n\
    \n```\n[ [1 0 0] [0 -1 0] [0 0 1] ]\n```\n\n变换结果为：\n\n```\n[x* y* 1]^T = [1 0\
    \ 0; 0 -1 0; 0 0 1] · [x y 1]^T = [x -y 1]^T\n```\n\n#### (2) 关于 y 轴的对称变换\n\n\
    对于 y 轴的对称变换矩阵为：\n\n```\n[[-1 0 0]\n [0 1 0]\n [0 0 1]]\n```\n\n变换结果为：\n\n```\n\
    [x*]\n[y*]   [-1 0 0] [x]   [-x]\n[1 ] = [0 1 0]·[y] = [ y ]\n        [0 0 1]\
    \ [1]   [ 1 ]\n```\n\n### （3）关于 45° 线的对称变换\n\n变换矩阵为：\n\n```\n[0 1 0]\n[1 0 0]\n\
    [0 0 1]\n```\n\n变换结果为：\n\n```\n[x*]\n[y*]\n[1] = [0 1 0; 1 0 0; 0 0 1] · [x; y;\
    \ 1] = [y; x; 1]\n```\n\n### （4）关于 −45° 线的对称变换\n\n变换矩阵为：\n\n$$\\begin{bmatrix}0\
    \ & -1 & 0\\\\-1 & 0 & 0\\\\0 & 0 & 1\\end{bmatrix}$$\n\n变换结果为：\n\n$$\\begin{bmatrix}x^*\\\
    \\y^*\\\\1\\end{bmatrix}=\\begin{bmatrix}0 & -1 & 0\\\\-1 & 0 & 0\\\\0 & 0 & 1\\\
    end{bmatrix}\\begin{bmatrix}x\\\\y\\\\1\\end{bmatrix}=\\begin{bmatrix}-y\\\\-x\\\
    \\1\\end{bmatrix}$$\n\n以上四种变换的效果如下图所示。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_539_0.png)\n\
    \n关于两坐标轴的对称变换\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_539_1.png)\n\n关于 -45°\
    \ 线的对称变换\n\n### （5） 关于坐标系原点的对称变换\n\n变换矩阵为：\n\n$$\\begin{bmatrix} -1 & 0 & 0 \\\
    \\ 0 & -1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$$\n\n变换结果为：\n\n$$\\begin{bmatrix}\
    \ x^* \\\\ y^* \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} -1 & 0 & 0 \\\\ 0 & -1\
    \ & 0 \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix} x \\\\ y \\\\ 1 \\\
    end{bmatrix} = \\begin{bmatrix} -x \\\\ -y \\\\ 1 \\end{bmatrix}$$\n\n### 3. 错切变换\n\
    \n沿 x 轴方向的错切变换矩阵为：\n\n| 1 | r_{12} | 0 |\n| 0 | 1 | 0 |\n| 0 | 0 | 1 |\n\n其变换结果为：\n\
    \n```\n\\begin{bmatrix}\n\\begin{bmatrix} x^* \\\\\n y^* \\\\\n 1 \\\\\n\\end{bmatrix}\n\
    \\end{bmatrix} = \\begin{bmatrix}\n1 & r_{12} & 0 \\\\\n0 & 1 & 0 \\\\\n0 & 0\
    \ & 1 \\\\\n\\end{bmatrix} \\begin{bmatrix}\n x \\\\\n y \\\\\n 1 \\\\\n\\end{bmatrix}\
    \ = \\begin{bmatrix}\n x + r_{12} y \\\\\n y \\\\\n 1 \\\\\n\\end{bmatrix}\n```\n\
    \n即： $x^* = x + r_{12}·y$； $y^* = y$。\n\n从以上结果可以看到：新图形各顶点的 $y$ 坐标没有变，而 $x$ 坐标是在原有的值上加一个有关\
    \ $y$ 正比例函数值的增量。所以使得整个图形在等高的前提下发生了倾斜。并且，当： $r_{12}>0$ 时，图形沿 $x$ 正向错切。 $r_{12}<0$\
    \ 时，图形沿 $x$ 负向错切。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_542_0.png)\n"
  mdcn: "\n## 5.1 几何变换的基本原理\n\n下面这张示意图，举例说明了图形的几种常见变换。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_524_0.png)\n\
    \n几种常见的几何变换：放大、压缩、旋转、错切\n\n## 总结以上这些变化后的图形结果，可以得到这样的结论：\n\n- (1) 图形变化了，但原图形的构成规则（拓扑关系）没有改变；\n\
    - (2) 图形发生的变化，是因为其顶点位置（几何关系）的改变决定的。这种通过维持图形的拓扑关系不变，而仅改变图形的几何关系来实现改变图形的方法，我们称之为图形的几何变换。\n\
    \n既然图形的几何变换仅和点的位置变化有关，所以我们首先要讨论一个点在空间的位置及其变化。\n\n由于点可以用一个列向量来表示，那么要改变一个点的位置，就意味着要改变这个向量（大小及方向）。\n\
    \n对向量的运算通常用矩阵运算来实现。假如原顶点坐标为：\n\n```\n[x]\n[y]\n```\n\n经变换后的坐标为：\n\n```\n[x*]\n\
    [y*]\n```\n\n那么用矩阵表示的变换过程为：\n\n$$ \\begin{bmatrix} x^* \\\\ y^* \\end{bmatrix}\
    \ = T \\cdot \\begin{bmatrix} x \\\\ y \\end{bmatrix}$$\n\n这是一个线性变换，其中的 **T**\
    \ 为线性变换矩阵，它是一二阶方阵。一个二维线性变换的一般形式也可以写成如下的代数式：\n\n$$x^* = a_1 \\cdot x + b_1 \\cdot\
    \ y + c_1$$\n\n$$y^* = a_2 \\cdot x + b_2 \\cdot y + c_2$$\n\n转换为矩阵形式，就是：\n\n\
    $$ \\begin{bmatrix} x^* \\\\ y^* \\end{bmatrix} = \\begin{bmatrix} a_1 & b_1 &\
    \ c_1 \\\\ a_2 & b_2 & c_2 \\end{bmatrix} \\cdot \\begin{bmatrix} x \\\\ y \\\\\
    \ 1 \\end{bmatrix}$$\n\n上面所说一个线性变形的矩阵形式和代数形式的统一，必须对点向量的表示法稍作修改，即：\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_528_0.png)\n\
    \n变换的矩阵形式和代数形式是完全可以统一的，只是原来用二维向量表示的点变成了用三维向量来表示。但其第三维是常数 1。\n\n其几何意义为：\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_528_1.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_528_2.png)\n\n两种表示方法，仅从图形上来看是没有实质性差别的。我们可以看下面的图例：\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_529_0.png)\n\n在不同高度水平面上绘的图\n\n这种用三维的形式来表示一个二维向量，进一步推广来说，用一个\
    \ n+1 维的形式来表示 n 维向量的方法，叫做齐次坐标表示法。这一小小的改变，给图形变换的矩阵实现创造了条件。\n\n采用了齐次坐标表示法以后，我们可以把二维的线性变换表示成如下规格化的形式：\n\
    \n```\n[x*]\n[y*]\n[1] = T · [x]\n[y]\n[1] = [a1 b1 c1]\n[a2 b2 c2]\n[0 0 1] ·\
    \ [x]\n[y]\n[1]\n```\n\n三阶方阵 T 称为二维线性变换矩阵。于是，对于任何二维图形的顶点进行几何变换，均可以写成如下形式：\n\n\
    **P*** = T · *P*\n\n其中：*P** 为变换后的新顶点表； *P* 为变换前的顶点表。\n\n矩阵 T 中元素的取值不同，可以形成对顶点的不同变换。\n\
    连接新的顶点，从而构成新的图形（几何变换过程）。\n\n## 5.2 二维图形变换\n\n### 5.2.1 二维基本变换\n\n二维图形变换的一般形式是：\n\
    \n```\n\\begin{bmatrix} r_{11} & r_{12} & t_x \\\\ r_{21} & r_{22} & t_y \\\\\
    \ 0 & 0 & 1 \\end{bmatrix}\n```\n\n对于二维变换矩阵中各元素的不同取值，可以获得对二维图形的不同变换效果，这些变换称为二维图形的基本变换。这些基本变换有以下五种：\n\
    \n### 1. 比例变换\n\n比例变换的变换矩阵为：\n\n[r11 0 0]\n[0 r22 0]\n[0 0 1]\n\n变换结果为：\n\n[x*]\n\
    [y*]\n[1] = [r11 0 0; 0 r22 0; 0 0 1] · [x; y; 1] = [r11 x; r22 y; 1]\n\n即：\n\n\
    x* = r₁₁·x,  y* = r₂₂·y\n\n可以看到，r₁₁为x方向上的缩放因子，r₂₂为y方向上的缩放因子，它们分别影响两个方向上的缩放效果。这些效果包括：\n\
    \n- - r₁₁ = r₂₂ > 1：图形沿 x、y 两个方向等比例放大；\n- - 0 < r₁₁ = r₂₂ < 1：图形沿两个方向等比例缩小；\n\
    - - r₁₁ ≠ r₂₂：由于图形在两个方向上的缩放系数不相等，所以经过变换后的图形将产生畸变。也能够对图形产生拉伸和压缩的效果。（缩放中心为坐标系原点）\n\
    \n### 2. 镜像（对称）变换\n\n对称变换的结果取决于对称轴的设置。\n\n#### （1）关于 x 轴的对称变换\n\n对于 x 轴的对称变换矩阵为：\n\
    \n```\n[ [1 0 0] [0 -1 0] [0 0 1] ]\n```\n\n变换结果为：\n\n```\n[x* y* 1]^T = [1 0\
    \ 0; 0 -1 0; 0 0 1] · [x y 1]^T = [x -y 1]^T\n```\n\n#### (2) 关于 y 轴的对称变换\n\n\
    对于 y 轴的对称变换矩阵为：\n\n```\n[[-1 0 0]\n [0 1 0]\n [0 0 1]]\n```\n\n变换结果为：\n\n```\n\
    [x*]\n[y*]   [-1 0 0] [x]   [-x]\n[1 ] = [0 1 0]·[y] = [ y ]\n        [0 0 1]\
    \ [1]   [ 1 ]\n```\n\n### （3）关于 45° 线的对称变换\n\n变换矩阵为：\n\n```\n[0 1 0]\n[1 0 0]\n\
    [0 0 1]\n```\n\n变换结果为：\n\n```\n[x*]\n[y*]\n[1] = [0 1 0; 1 0 0; 0 0 1] · [x; y;\
    \ 1] = [y; x; 1]\n```\n\n### （4）关于 −45° 线的对称变换\n\n变换矩阵为：\n\n$$\\begin{bmatrix}0\
    \ & -1 & 0\\\\-1 & 0 & 0\\\\0 & 0 & 1\\end{bmatrix}$$\n\n变换结果为：\n\n$$\\begin{bmatrix}x^*\\\
    \\y^*\\\\1\\end{bmatrix}=\\begin{bmatrix}0 & -1 & 0\\\\-1 & 0 & 0\\\\0 & 0 & 1\\\
    end{bmatrix}\\begin{bmatrix}x\\\\y\\\\1\\end{bmatrix}=\\begin{bmatrix}-y\\\\-x\\\
    \\1\\end{bmatrix}$$\n\n以上四种变换的效果如下图所示。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_539_0.png)\n\
    \n关于两坐标轴的对称变换\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_539_1.png)\n\n关于 -45°\
    \ 线的对称变换\n\n### （5） 关于坐标系原点的对称变换\n\n变换矩阵为：\n\n$$\\begin{bmatrix} -1 & 0 & 0 \\\
    \\ 0 & -1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$$\n\n变换结果为：\n\n$$\\begin{bmatrix}\
    \ x^* \\\\ y^* \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} -1 & 0 & 0 \\\\ 0 & -1\
    \ & 0 \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix} x \\\\ y \\\\ 1 \\\
    end{bmatrix} = \\begin{bmatrix} -x \\\\ -y \\\\ 1 \\end{bmatrix}$$\n\n### 3. 错切变换\n\
    \n沿 x 轴方向的错切变换矩阵为：\n\n| 1 | r_{12} | 0 |\n| 0 | 1 | 0 |\n| 0 | 0 | 1 |\n\n其变换结果为：\n\
    \n```\n\\begin{bmatrix}\n\\begin{bmatrix} x^* \\\\\n y^* \\\\\n 1 \\\\\n\\end{bmatrix}\n\
