    $\mathbf{T}$（切矢），$\mathbf{N}$（主法矢）和 $\mathbf{B}$（副法矢）构成了曲线上的活动标架。$\mathbf{N}$和
    $\mathbf{B}$构成的平面称为法平面；$\mathbf{N}$和 $\mathbf{T}$构成的平面称为密切平面；$\mathbf{B}$和 $\mathbf{T}$构成的平面称为从切平面（见图）。


    ### 4. 曲率和挠率


    由于 dT/ds 与 N 平行，若令 T'' = kN，则：


    k = |T''| = lim_{Δs→0} |ΔT|/|Δs| = lim_{Δs→0} (|ΔT|/|Δθ| · |Δθ|/|Δs|) = lim_{Δs→0}
    |Δθ|/|Δs|


    其中，θ 为相邻两切线的夹角。称 k 为曲线的曲率，其几何意义是曲线的单位切矢对弧长的转动率，与主法矢同向。曲率的倒数 ρ = 1/k 称为曲率半径。


    又 B(s)·T(s) = 0，两边对 s 求导，得：


    B''(s)·T(s) + B(s)·T''(s) = 0


    将 T'' = kN 代入上式，并注意到 B(s)·N(s) = 0，得到：


    B''(s)·N(s) = 0


    因为[B(s)]² = 1，所以两边对 s 求导，得到 B''(s)·B(s) = 0，可见 B''(s) 既垂直于 T(s)，有垂直于 B(s)，故：


    B''(s) // N(s)


    再令 B''(s) = -τ N(s)，τ 称为挠率。因为


    |τ| = |dB/ds| = lim |ΔB/Δs| = lim ( |ΔB/Δφ| · |Δφ/Δs| ) = lim |Δφ/Δs|


    所以，挠率的绝对值的概念与副法线方向（或密切平面）对于弧长的转动率。τ 挠率大于0、等于0和小于0分别表示曲线为右旋空间曲线、平面曲线和左旋空间曲线。


    同样，对 N(s)=B(s) × T(s) 两边求导，可以得到：


    N''(s)=−kT(s)+τB(s)


    将 T'', N'', B'' 和 T, N, B 的关系写成矩阵形式，为


    ⎡T''⎤   ⎡ 0   k   0 ⎤ ⎡T⎤

    ⎢N''⎥ = ⎢−k   0   τ ⎥ ⎢N⎥

    ⎣B''⎦   ⎣ 0  −τ   0 ⎦ ⎣B⎦


    对于一般参数 t，曲率 k 和挠率 τ 的计算公式如下：


    ```

    k(s) = |P''(t) × P''''(t)| / |P''(t)|³ ,   τ(s) = (P''(t) × P''''(t)) · P''''''(t)
    / |P''(t) × P''''(t)|²

    ```


    ## 4.2.3 插值、拟合和光顺


    +   1. 插值、拟合和逼近


    给定一组有序数据点 P_i, i=0,1,…,n, 构造一条曲线顺序通过这些数据点，称为对这些数据点的插值，所构造的曲线称为插值曲线。


    +   （1）线性插值


    假设给定函数 f(x) 在两个不同点 x₁ 和 x₂ 的值，用一个线性


    函数：y = φ(x) = ax + b，近似代替 f(x)，称 φ(x) 为 f(x) 的线性插值函数。其中线性函数的系数 a, b，通过条件


    f(x₁) = y₁， f(x₂) = y₂


    确定。


    ### （2）抛物线插值


    抛物线插值又称为二次插值。设已知 f(x) 在三个互异点 x₁, x₂, x₃ 的函数值为 y₁, y₂, y₃，要求构造一函数： y = φ(x) = ax²
    + bx + c，使 φ(x) 在节点 xᵢ(i = 1,2,3) 处与 f(x) 在 xᵢ 处的值相等。由此可构造 φ(xᵢ) = f(xᵢ) = yᵢ(i
    = 1, 2, 3) 的线性方程组，求得 a, b, c，即构造了 f(x) 的二次插值函数 φ(x)。


    构造一条曲线使之在某种意义下最接近给定的数据点（但未必通过这些点），称为对这些数据点进行拟合，所构造的曲线称为拟合曲线。在计算数学中，逼近通常指用一些性质较好的函数近似表示一些性质不好的函数。在计算机图形学中，逼近继承了这方面的含义，因此插值和拟合都可以视为逼近。


    ### 2. 光顺（fairing）


    光顺通俗的含义是指曲线的拐点不能太多，曲线拐来拐去就会不顺眼。对平面曲线而言，相对光顺的条件是：


    +   (1) 具有二阶几何连续（G²）；

    +   (2) 不存在多余拐点和奇异点；


    （3）曲率变化较小。


    ## 4.2.4 参数化


    过三个点 $P_0$, $P_1$ 和 $P_2$ 构造参数表示的插值多项式曲线可以有无数条，这是因为参数 $t$ 在[0, 1]区间的分割可以有无数种，即
    $P_0$, $P_1$ 和 $P_2$ 可对应不同的参数，比如：


    $t_0 = 0$, $t_1 = 1/2$, $t_2 = 1$


    或


    $t_0 = 0$, $t_1 = 1/3$, $t_2 = 1$


    其中，每个参数值称为节点（knot）。


    对于一条插值曲线，型值点 P₀, P₁, …, Pₙ 与其参数域 [t₀, tₙ] 内的节点之间有一种对应关系。对于一组有序的型值点所确定的一种参数分割，称之为这组型值点的参数化。参数化常用的方法有以下四种：


    +   1. 均匀参数化（等距参数化）

    +   使每个节点区间长度 Δᵢ = tᵢ₊₁ − tᵢ, i = 0, 1, …, n−1 为正常数 d，节点在参数轴上呈等距分布： tᵢ₊₁ = tᵢ
    + d。


    +   2. 累加弦长参数化

    +   t₀ = 0, tᵢ = tᵢ₋₁ + |ΔPᵢ₋₁|, i = 1, 2, …, n

    +   其中，ΔPᵢ = Pᵢ₊₁ − Pᵢ 为向前差分矢量，即弦边矢量。这种参数

