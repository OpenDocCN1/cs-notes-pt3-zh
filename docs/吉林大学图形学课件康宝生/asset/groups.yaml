    \n## 3.3 圆的生成算法\n\n圆是最为基本的图形之一，多种场合都用到它。因此，图形软件包都包含有生成圆和圆弧的程序，故生成圆的算法也很多。\n\n\
    圆心在 $(x_c, y_c)$，半径为 $R$ 圆的方程是：\n\n$$(x - x_c)^2 + (y - y_c)^2 = R^2$$\n\n显然，利用该方程沿\
    \ $x$ 轴从 $x_c - R$ 到 $x_c + R$ 以单位步长步进计算出对应的 $y$ 值，即可得到圆周上每点的 $y$ 值：\n\n$$y =\
    \ y_c \\pm \\sqrt{R^2 - (x - x_c)^2}$$\n\n这并非是最好的算法。\n\n该算法的不足之一是每步包含大量的计算，且所画像素位置的间距是不一致的。另外，$|x\
    \ - x_c|$ 越大，对应生成圆周上的点之间的圆周距离也就越大。我们可以在圆的斜率绝对值大于 1 后，交换 $x$ 和 $y$ 来调整间距。这样一来增加了所需的计算量和处理过程。另一种消除不等间距的方法是使用圆的极坐标方程：\n\
    \n$$x = x_c + R \\cos\\theta, \\quad y = y_c + R \\sin\\theta$$\n\n计算圆周上的点，但这又涉及到三角运算，同样增加了计算量。\n\
    \n最为常用的生成圆的有效算法有以下三种：以判定函数的增量计算为基础的 Bresenham 算法、中点法和正负法，以及以画直线为基础的多边形逼近算法。\n\n\
    ### 3.3.1 圆的八方向对称性\n\n由于圆关于坐标轴和对角线对称，因此，在对圆进行扫描转换时，我们只需计算 $0°$ 到 $45°$ 之间的一段圆弧就能得到整个圆。对于圆心为\
    \ $(x_c, y_c)$ 的圆，我们用程序 CirclePoints 显示 8 个相对称的点：\n\n```\nvoid CirclePoints (int\
    \ xc, int yc, int x, int y, int Color)\n{\n    DrawPixel (xc + x, yc + y, Color);\n\
    \    DrawPixel (xc + x, yc - y, Color);\n    DrawPixel (xc - x, yc + y, Color);\n\
    \    DrawPixel (xc - x, yc - y, Color);\n    DrawPixel (xc + y, yc + x, Color);\n\
    \    DrawPixel (xc + y, yc - x, Color);\n    DrawPixel (xc - y, yc + x, Color);\n\
    \    DrawPixel (xc - y, yc - x, Color);\n}\n```\n\n### 3.3.2 生成圆的 Bresenham 算法\n\
    \nBresenham 算法是画圆的最有效的算法之一。不失一般性，设要画的圆的圆心在坐标原点 $(0, 0)$，半径为 $R$。我们这里考虑第一象限的上半部的八分之一圆弧的生成过程，即下图中的圆弧\
    \ $AB$。现在，从点 $(0, R)$ 开始顺时针生成八分之一圆周 $AB$。在这种情况下，$x$ 每步增加 1，相应的 $y_{i+1}$ 则有两种选择：$y_{i+1}=y_i$\
    \ 或 $y_i-1$。选择的原则是考察精确值 $y$ 是靠近 $y_i$ 还是靠近 $y_i-1$。\n\n设 $R_s$ 满足方程：\n\n$$(x_{i+1}^2\
    \ + y_i^2 - R_s^2) + (x_{i+1}^2 + (y_i -1)^2 - R_s^2) = 0$$\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_179_0.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_179_1.png)\n\n以坐标原点为圆心，$R_s$ 为半径做圆弧\
    \ $S$，上式表明点 $(x_{i+1}, y_i)$ 和 $(x_{i+1}, y_{i-1})$ 到圆弧 $S$ 的距离可认为是相等的。因此，$S$\
    \ 可作为一条分界线。当圆在 $S$ 上方时，应选 $y_{i+1}=y_i$；当圆在 $S$ 下方时，应选 $y_{i+1}=y_i-1$。下面建立判断圆是在\
    \ $S$ 上方或下方的判定函数。\n\n令：\n\n$$d_i = (x_{i+1}^2 + y_i^2 - R^2) + (x_{i+1}^2 + (y_i\
    \ - 1)^2 - R^2)$$\n\n显然，$d_i$ 是 $R$ 的递减函数。当 $R = R_s$ 时，$d_i = 0$；当 $R > R_s$\
    \ 时，圆在 $S$ 的上方，此时 $d_i < 0$；当 $R < R_s$ 时，圆在 $S$ 的下方，此时 $d_i > 0$。由此，我们有判定函数 $d_i$。若\
    \ $d_i < 0$，则 $y_{i+1} = y_i$；否则，$y_{i+1} = y_i - 1$。余下的问题是如何快速地计算判定函数 $d_i$？\n\
    \n已知 $x_0 = 0$，$y_0 = R$，所以\n\n$$d_0 = (1 + R^2 - R^2) + (1 + (R - 1)^2 - R^2)\
