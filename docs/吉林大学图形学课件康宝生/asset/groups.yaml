  - '[PAGE 212]


    # 3.3.6 多边形逼近算法稳定性分析


    绘制圆的多边形逼近算法是以递推公式为基础的。用递推公式计算时，要特别注意误差的累积问题。递推公式的每一步结果和以前各步计算结果相关，因而也和以前各步结果的误差有关。用不好的递推公式计算时，累积误差可能掩盖了真解，这种递推公式便无实用价值了。所以，对递推公式要做误差分析。这种分析又可转化为对初始误差的累积的估计，称为对初始误差的稳定性分析。'
  - "[PAGE 213]\n\n现对递推公式作关于初始误差的稳定性分析。设在初始真值 $(x_0, y_0)$ 上附加了误差 $E_0 = (e_x, e_y)$，此真值则成为有误差的初值\
    \ $(\bar{x}_0, \bar{y}_0)$，即：\n\n$(\bar{x}_0, \bar{y}_0) = (x_0, y_0) + (e_x,\
    \ e_y)$\n\n以 $(\bar{x}_0, \bar{y}_0)$ 为初值代入求圆内接多边形顶点的递推公式，求出解 $(\bar{x}_i, \b\
    ar{y}_i)$。在求解过程中，假设计算是精确的，因而满足递推公式，即：\n\n$\begin{bmatrix} \bar{x}_{i+1} \\ \b\
    ar{y}_{i+1} \\end{bmatrix} = A \begin{bmatrix} \bar{x}_i - x_c \\ \bar{y}_i -\
    \ y_c \\end{bmatrix} + \begin{bmatrix} x_c \\ y_c \\end{bmatrix}$"
  - '[PAGE 214]


    令 $E_i = (\bar{x}_i, \bar{y}_i) - (x_i, y_i)$，则有


    $E_i^T = A E_{i-1}^T$, $i=0,1,2,...$


    矩阵


    $A = \begin{bmatrix} \cos\alpha & \sin\alpha \\ \sin\alpha & \cos\alpha \end{bmatrix}$


    的特征值为 $\lambda_1 = \cos\alpha + i\sin\alpha$, $\lambda_2 = \cos\alpha - i\sin\alpha$,
    所以存在二阶方阵 $U$，使得


    $U^{-1} A U = B = \begin{bmatrix} \lambda_1 & \\ & \lambda_2 \end{bmatrix}$'
