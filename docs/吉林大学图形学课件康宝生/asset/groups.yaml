    # # 6.2 三维投影变换


    三维空间中直线的投影仍是直线，因此只要找到直线段端点的投影，再把两投影点连接起来，所得之直线即为原直线段的投影。


    # # 6.2.1 透视投影及其分类


    透视投影变换由投影平面和投影中心所确定。物体投影的大小和投影中心到物体的距离成反比。任何一束不平行于投影平面的平行线，其透视投影后将会聚到一点，该点称之为灭点
    (Vanishing Point)。在三维空间中平行线只会在无穷远点处相交，


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_596_0.png)'
