    ## 第六章 三维观察变换


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_592_0.png)


    三维空间中的物体要在二维屏幕或图纸上表示出来，必须通过投影，这是一种三维空间到二维空间的变换。本章就三维观察变换进行详细地讨论。


    ### 6.1 三维观察步骤


    建立三维景像可以比喻为使用一种人造照相机的概念，我们能够移动照相机到任意位置，用我们希望的任意方法来定向它，而且可以用快门对三维物体获取二维图像的快照。


    虽然人造照相机是一个有用的概念，但从产生一幅图像来看，它比只按一下快门要多点麻烦。事实上，创建我们的“照片”需实现下面的一系列步骤：


    - 确定投影类型；

    - 定义观察坐标系；

    - 在三维空间中裁剪图形；

    - 投影和显示。


    上述观察过程的概念模型可图示如下：


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_595_0.png)


    ### 6.2 三维投影变换


    三维空间中直线的投影仍是直线，因此只要找到直线段端点的投影，再把两投影点连接起来，所得之直线即为原直线段的投影。


    #### 6.2.1 透视投影及其分类


    透视投影变换由投影平面和投影中心所确定。物体投影的大小和投影中心到物体的距离成反比。任何一束不平行于投影平面的平行线，其透视投影后将会聚到一点，该点称之为灭点
    (Vanishing Point)。在三维空间中平行线只会在无穷远点处相交，所以灭点也可看作是无穷远点的透视投影。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_596_0.png)


    在所有灭点中，平行于三个坐标轴之一的直线束的灭点称为主灭点 (Principal Vanishing Point)，主灭点最多有三个。按主灭点数目的多少，透视投影分为一点透视、两点透视和三点透视。


    - 一点透视 投影平面只和一个坐标轴相交，即投影平面与坐标面平行。所生成的物体投影图真实感较差。

    - 两点透视 投影平面和二个坐标轴相交，即投影平面与一个坐标轴平行。所生成的物体投影图具有较好的真实性，比较容易构造。常用于建筑工程、工业设计和广告等领域。

    - 三点透视 投影平面和三个坐标轴相交，这类透视投影的构造较之两点透视难一些，用的较少。


    #### 6.2.2 透视投影的确定


    我们在坐标系 oxyz 中讨论透视投影的确定，假设投影平面为 z = 0 坐标面，投影中心为 C(xc, yc, zc)。


    对于空间中任一点 Q(x, y, z)，连接 C Q 直线方程为：


    ```

    \begin{cases}

    x'' = \bar{x}_c + t(\bar{x} - \bar{x}_c) \\

    y'' = \bar{y}_c + t(\bar{y} - \bar{y}_c) \\

    z'' = \bar{z}_c + t(\bar{z} - \bar{z}_c)

    \end{cases}, 0 \leq t < +\infty

    ```


    令 z'' = 0，得: t = -z_c/(z - z_c)


    ```

    \bar{x}_p = \bar{x}_c + (\bar{x} - \bar{x}_c) \frac{\bar{z}_c}{\bar{z}_c - \bar{z}}
    = \frac{\bar{z}_c \bar{x} - \bar{x}_c \bar{z}}{\bar{z}_c - \bar{z}}

    \bar{y}_p = \bar{y}_c + (\bar{y} - \bar{y}_c) \frac{\bar{z}_c}{\bar{z}_c - \bar{z}}
    = \frac{\bar{z}_c \bar{y} - \bar{y}_c \bar{z}}{\bar{z}_c - \bar{z}}

    ```


    写成矩阵形式，则透视投影变换为：


    ⎡ x̄_q ⎤   ⎡ z̄_c   0   -x̄_c   0 ⎤ ⎡ x̄ ⎤   ⎡ x̄ ⎤

    ⎢ ȳ_q ⎥ = ⎢  0   z̄_c   -ȳ_c   0 ⎥ ⎢ ȳ ⎥ = M_per ⎢ ȳ ⎥

    ⎢ z̄_q ⎥   ⎢  0    0     0    0 ⎥ ⎢ z̄ ⎥       ⎢ z̄ ⎥

    ⎣  q  ⎦   ⎣  0    0    -1   z̄_c ⎦ ⎣  1 ⎦       ⎣  1 ⎦


    投影平面上投影点的非齐次坐标为：


    x̄_p = x̄_q / q, ȳ_p = ȳ_q / q


