    自然界中存在着数不胜数的不规则形体。多少年来，人们都是用传统的几何方法对它们进行描述，采用的主要手段是用规则形体逼近。这种用规则形体描述不规则形体所得到的结果，与现实是有很大差距的，并且这种方法需要大量的数据，'
  - '[PAGE 756]


