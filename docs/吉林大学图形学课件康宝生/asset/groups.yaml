  - '[PAGE 198]


    # 3.3.4 生成圆的正负法


    设要绘制的圆的圆心在 $(x_c, y_c)$ 半径为 $R$，令：


    $F_{circle}(x,\ y) = (x - x_c)^2 + (y - y_c)^2 - R^2$


    则圆将平面分为三个区域：


    $F_{circle}(x,y) = \begin{cases} <0 ,\ (x,y)\ 位于圆周内 \\ =0 ,\ (x,y)\ 位于圆周上 \\ >0
    ,\ (x,y)\ 位于圆周外 \end{cases}$


    我们以第一象限的四分之一圆弧为例，说明正负法的原理。取 $P_0(x_0, y_0) = (x_c, y_c + R)$，求得点 $P_i(x_i, y_i)$
    后，寻找 $P_{i+1}(x_{i+1}, y_{i+1})$'
  - '[PAGE 199]


    的原则是：


    当 $F_{circle}(x_i, y_i) \le 0$ 时， $x_{i+1}=x_i+1$, $y_{i+1}=y_i$；


    当 $F_{circle}(x_i, y_i) > 0$ 时， $x_{i+1}=x_i$, $y_{i+1}=y_i-1$。


    即，当点 $P_i$ 在圆周内或圆周上时，向右走一步，而当点 $P_i$ 在圆周外时，向下走一步。这样用于逼近圆弧的像素点均在圆周的附近，且使判定函数时正时负，这就是正负法名称的由来。


    显然，每找一点都要计算一次判定函数 $F_{circle}(x, y)$。如果直接计算，由于要进行乘法，不仅耗时，而且也不易硬件实现。因此，应建立计算判定函数
    $F_{circle}(x, y)$ 的高效算法以避免乘法。'
  - "[PAGE 200]\n\n显然，$F_{circle}(x_0, y_0)=0$。若 $F_{circle}(x_i, y_i)$ 已经求出，那么 $F_{circle}(x_{i+1},\
    \ y_{i+1})$ 的计算分两种情形：\n\n情形1. $F_{circle}(x_i, y_i) \\le 0$。此时，$x_{i+1}=x_i+1$，$y_{i+1}=y_i$，那么\n\
    \n$F_{circle}(x_{i+1}, y_{i+1}) = (x_{i+1}-x_c)^2 + (y_{i+1}-y_c)^2 - R^2$ \n\
    $= (x_i+1-x_c)^2 + (y_i-y_c)^2 - R^2$ \n$= F_{circle}(x_i, y_i) + 2(x_i - x_c)\
    \ + 1$\n\n情形2. $F_{circle}(x_i, y_i) > 0$。此时，$x_{i+1}=x_i+1$，$y_{i+1}=y_i-1$，那么"
  - "[PAGE 201]\n\nF_{circle}(x_{i+1}, y_{i+1}) = (x_{i+1} - x_c)^2 + (y_{i+1} - y_c)^2\
    \ - R^2\n= (x_i - x_c)^2 + (y_i - 1 - y_c)^2 - R^2\n= F_{circle}(x_i, y_i) - 2(y_i\
    \ - y_c) + 1\n\n因此，由 (x_i, y_i) 求下一点判定函数的递推公式为：\n\nF_{circle}(x_{i+1}, y_{i+1})\
    \ = \n{ F_{circle}(x_i, y_i) + 2(x_i - x_c) + 1,  F_{circle}(x_i, y_i) ≤ 0\n \
    \ F_{circle}(x_i, y_i) - 2(y_i - y_c) + 1,  F_{circle}(x_i, y_i) > 0 }"
  - "[PAGE 202]\n\n# 程序 3.3.5 圆的扫描转换算法\n\n```\nvoid circle_PNM(int xCenter, int yCenter,\
    \ int Radius, int Color)\n{\n    int x = xCenter, y = yCenter + Radius;\n    int\
    \ f = 0;\n    while (y > yCenter) {\n        DrawPixel(x, y, Color);\n       \
    \ if (f > 0) { f += 2*(yCenter - y) + 1; y--; }\n        else { f += 2*(x - xCenter)\
    \ + 1; x++; }\n    }\n    if (y == yCenter) DrawPixel(x, y, Color)\n}\n```"
