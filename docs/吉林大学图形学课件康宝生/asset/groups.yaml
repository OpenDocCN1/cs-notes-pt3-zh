    \ 0 }\n- Step 3. 若 x = y，画像素点 (x, y);\n- Step 4. 算法结束。\n\n**例 3-3-1. 用 Bresenham\
    \ 算法画圆心为 O(0, 0)，半径为 R = 10 的八分之一圆弧。**\n\n| d | x | y |\n|---|---|---|\n| -17\
    \ | 0 | 10 |\n| -11 | 1 | 10 |\n| -1 | 2 | 10 |\n| 13 | 3 | 10 |\n| -5 | 4 | 9\
    \ |\n| 17 | 5 | 9 |\n| 11 | 6 | 8 |\n|  | 7 | 7 |\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_183_0.png)\n\
    \n**程序 3.3.1 圆 Bresenham 扫描转换算法**\n\n```\nvoid Circle_BRES ( int xc, int yc, int\
    \ Radius, int Color )\n{\n    int x = 0, y = Radius, d = 3 - 2*Radius;\n    while\
    \ (x < y) {\n        CirclePoints (xc, yc, x, y, Color);\n        if (d >= 0)\
    \ {\n            d += 4 - 4*y; y--;\n        }\n        d += 4*x + 6; x++;\n \
    \   }\n    if (x == y)\n        CirclePoints (xc, yc, x, y, Color);\n}\n```\n"
