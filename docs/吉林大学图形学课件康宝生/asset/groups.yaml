    Bresenham 算法采用整数运算由点 (x_i, y_i) 计算出 (x_{i+1}, y_{i+1})，算法首先确定线段的斜率，再继续在每一步中，通过判定函数在两个可选像素点中选一。双步算法则在每一步，通过判定函数求得一对像素点而非只是
    一个像素点，如此继续直至到达线段的终点。对当前求得的像素点来说，随后可能出现的一对像素点只有下面四种情况：'
