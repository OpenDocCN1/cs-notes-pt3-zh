    ```


    - (5) 沿 z 轴方向含 x 的错切


    错切平面沿 z 轴方向错移并且离开 x 轴。变换矩阵为：


    ```

    T_zx = [[1, 0, 0, 0], [0, 1, 0, 0], [a_{31}, 0, 1, 0], [0, 0, 0, 1]]

    ```


    变换结果为：


    ```

    [x'', y'', z'', q]^T = T_zx · [x, y, z, 1]^T = [x, y, z + a_{31} x, 1]^T

    ```


    - (6) 沿 z 轴方向含 y 的错切


    错切平面沿 z 轴方向错移并且离开 y 轴。变换矩阵为：


