    )，即\n\n\\[\n\\begin{bmatrix} \\bar{x}_i \\\\ \\bar{y}_i \\end{bmatrix} = T \\\
    begin{bmatrix} x_i \\\\ y_i \\end{bmatrix}\n\\]\n\n则 \\((\\bar{x}_i, \\bar{y}_i)\\\
    ) 仍满足该式。这说明用此式不仅可以求圆的内接多边形的顶点，而且还可以求椭圆的内接多边形的顶点。不同之处是看初始两点是取在圆上，还是取在椭圆上。\n\n上式还可以写成更一般的形式：\n\
    \n\\[\n\\begin{bmatrix} x_{i+1}-x_c \\\\ y_{i+1}-y_c \\end{bmatrix}\n= 2k \\begin{bmatrix}\
    \ x_i-x_c \\\\ y_i-y_c \\end{bmatrix}\n- \\begin{bmatrix} x_{i-1}-x_c \\\\ y_{i-1}-y_c\
    \ \\end{bmatrix}\n\\]\n\n其中 \\(k\\) 为常数。当 \\(k > 1\\) 时，由其求出的点列 \\(\\{(x_i, y_i)\\\
    }\\) 位于一支双曲线上，因而可用于双曲线的绘制。\n\n### 3.3.6 多边形逼近算法稳定性分析\n\n绘制圆的多边形逼近算法是以递推公式为基础的。用递推公式计算时，要特别注意误差的累积问题。递推公式的每一步结果和以前各步计算结果相关，因而也和以前各步结果的误差有关。用不好的递推公式计算时，累积误差可能掩盖了真解，这种递推公式便无实用价值了。所以，对递推公式要做误差分析。这种分析又可转化为对初始误差的累积的估计，称为对初始误差的稳定性分析。\n\
    \n现对递推公式作关于初始误差的稳定性分析。设在初始真值 \\((x_0, y_0)\\) 上附加了误差 \\(E_0 = (e_x, e_y)\\)，此真值则成为有误差的初值\
    \ \\((\\bar{x}_0, \\bar{y}_0)\\)，即\n\n\\[\n(\\bar{x}_0, \\bar{y}_0) = (x_0, y_0)\
    \ + (e_x, e_y)\n\\]\n\n以 \\((\\bar{x}_0, \\bar{y}_0)\\) 为初值代入求圆内接多边形顶点的递推公式，求出解\
    \ \\((\\bar{x}_i, \\bar{y}_i)\\)。在求解过程中，假设计算是精确的，因而满足递推公式，即\n\n\\[\n\\begin{bmatrix}\
    \ \\bar{x}_{i+1} \\\\ \\bar{y}_{i+1} \\end{bmatrix}\n= A \\begin{bmatrix} \\bar{x}_i-x_c\
    \ \\\\ \\bar{y}_i-y_c \\end{bmatrix}\n+ \\begin{bmatrix} x_c \\\\ y_c \\end{bmatrix}\n\
    \\]\n\n令 \\(E_i = (\\bar{x}_i, \\bar{y}_i) - (x_i, y_i)\\)，则有\n\n\\[\nE_i^T =\
    \ A E_{i-1}^T, \\quad i=1,2,\\ldots\n\\]\n\n矩阵\n\n\\[\nA = \\begin{bmatrix} \\\
    cos\\alpha & -\\sin\\alpha \\\\ \\sin\\alpha & \\cos\\alpha \\end{bmatrix}\n\\\
    ]\n\n的特征值为 \\(\\lambda_1 = \\cos\\alpha + i\\sin\\alpha\\)，\\(\\lambda_2 = \\\
    cos\\alpha - i\\sin\\alpha\\)，所以存在二阶方阵 \\(U\\)，使得\n\n\\[\nU^{-1} A U = B = \\\
    begin{bmatrix} \\lambda_1 & 0 \\\\ 0 & \\lambda_2 \\end{bmatrix}\n\\]\n\n\\[\n\
    E_{i+1}^T = A^{i+1}E_0^T = (UBU^{-1})^{i+1}E_0^T = UB^{i+1}U^{-1}E_0^T\n= U\\\
    begin{bmatrix} \\lambda_1^{i+1} & 0 \\\\ 0 & \\lambda_2^{i+1} \\end{bmatrix}U^{-1}E_0^T\n\
    \\]\n\n由于 \\(\\lvert\\lambda_1\\rvert = \\lvert\\lambda_2\\rvert = 1\\)，所以存在一个和\
    \ \\(i\\) 无关的常数 \\(C\\) 作为各元素模的上界。因而，由上式可得：\n\n\\[\n\\|E_{i+1}\\| \\le C\\|E_0\\\
    |\n\\]\n\n其中，\\(\\|\\cdot\\|\\) 是任何一种向量范数，如 \\(\\|E_0\\| = \\max(\\lvert e_{0x}\\\
    rvert, \\lvert e_{0y}\\rvert)\\)，或\n\n\\[\n\\|E_0\\| = \\sqrt{e_{0x}^2 + e_{0y}^2}\n\
    \\]\n\n这说明只要初值误差 \\(E_0 = (e_x, e_y)\\) 足够小，可使 \\(E_{i+1}\\) 足够小。\n\n这就证明了求圆内接多边形顶点的递推公式对初始值的误差是稳定的。类似地，可以证明其它两个递推公式对初始值的误差也是稳定的。利用递推公式求圆的内接多边形的顶点时，为减少计算工作量，可以用近似方式计算三角函数。例如，用\n\
    \n\\[\n\\sin\\alpha \\approx \\alpha, \\quad \\cos\\alpha \\approx 1 - \\frac{\\\
    alpha^2}{2}\n\\]\n\n来代替 \\(\\sin\\alpha\\) 和 \\(\\cos\\alpha\\)。这样一来，递推公式则成为：\n\
    \n\\[\n\\begin{bmatrix} x_{i+1} \\\\ y_{i+1} \\end{bmatrix}\n=\n\\begin{bmatrix}\
    \ 1 - \\dfrac{\\alpha^2}{2} & -\\alpha \\\\ \\alpha & 1 - \\dfrac{\\alpha^2}{2}\
    \ \\end{bmatrix}\n\\begin{bmatrix} x_i-x_c \\\\ y_i-y_c \\end{bmatrix}\n+ \\begin{bmatrix}\
    \ x_c \\\\ y_c \\end{bmatrix}\n\\]\n\n当然，这种方法不能精确地求出圆内接多边形的顶点，\\(\\alpha\\) 取得越小，误差就越小。\n\
