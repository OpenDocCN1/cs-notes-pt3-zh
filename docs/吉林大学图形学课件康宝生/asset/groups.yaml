  - '[PAGE 499]


    B 样条曲线是一种非常灵活的曲线，曲线的局部形状受相应顶点的控制很直观。这些顶点控制技术如果运用得好，可以使整个 B 样条曲线在某些部位满足一些特殊的技术要求。如：可以在曲线中构造一段直线；使曲线与特征多边形相切；使曲线通过指定点；指定曲线的端点；指定曲线端点的约束条件。


    # 4. 6. 6 de Boor - Cox 算法


    现讨论 B 样条曲线的计算问题。对于给定的参数 u*：


    u^* \in [u_j, u_{j+1}), k - 1 \leq j \leq n'
  - "[PAGE 500]\n\n由 B 样条基函数 $N_{ik}(u)$ 的递推公式：\n\n$N_{ik}(u) = \\frac{u - u_i}{u_{i+k-1}\
    \ - u_i} N_{i,k-1}(u) + \\frac{u_{i+k} - u}{u_{i+k} - u_{i+1}} N_{i+1,k-1}(u)$\n\
    \n将 $P(u)$ 化简如下：\n\n$P(u) = \\sum_{i=0}^{n} d_i N_{ik}(u^*) = \\sum_{i=j-k+1}^{j}\
    \ d_i N_{ik}(u^*)$\n\n$= \\sum_{i=j-k+1}^{j} d_i \\left[ \\frac{u^* - u_i}{u_{i+k-1}\
    \ - u_i} N_{i,k-1}(u^*) + \\frac{u_{i+k} - u^*}{u_{i+k} - u_{i+1}} N_{i+1,k-1}(u^*)\
    \ \\right]$ \n\n$= \\sum_{i=j-k+2}^{j} \\left[ \\frac{u^* - u_i}{u_{i+k-1} - u_i}\
    \ d_i + \\frac{u_{i+k-1} - u^*}{u_{i+k-1} - u_i} d_{i-1} \\right] N_{i,k-1}(u^*)$"
  - '[PAGE 501]


    令：


    d_i^{[r]}(u*) = { d_i, r=0; (u* - u_i)/(u_{i+k-r} - u_i) d_i^{[r-1]} + (u_{i+k-r}
    - u*)/(u_{i+k-r} - u_i) d_{i-1}^{[r-1]}, r ≠ 0 }


    i = j - k + r + 1, …, j, r = 1, 2, …, k - 1


    则有：


    P(u*) = Σ_{i=j-k+1}^{j} d_i N_{i,k}(u*) = Σ_{i=j-k+2}^{j} d_i^{[1]} N_{i,k-1}(u*)


    上式是同一条曲线 P(u) 从 k 阶 B 样条表示到 k - 1 阶 B 样条表示的递推公式。反复运用此公式，得到：P(u*) = d_j^{[k-1]}(u*)。'
