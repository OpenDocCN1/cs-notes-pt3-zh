    # 3.6.4 字符的裁剪


    字符的裁剪技术取决于字符的生成方法和具体应用，一般地，图形软件中包含了几种裁剪技术。


    最简单的裁剪字符串的方法是全部保留和全部舍弃字符串，称为串精度裁剪。如果字符串的所有字符都在裁剪窗口内，就全部保留，否则舍弃整个字符串。


    另一种处理方法是，与窗口边界有重叠的字符串是取舍整个字符，既全部保留或全部舍弃一个字符，称为字符精度裁剪。在这种方法中，每一个字符的边界要与窗口比较，凡与窗口'
