    \ Cap）来调整线端点的形状以给出更好的外观（见图）。\n\n  ![](img/dce279c4fd8230bfee452d9f1db7cf9c_370_0.png)\n\
    \n  线帽的一种形式是方帽，它通过调整所构成平行线的端点位置，使粗线的显示具有垂直线段路径的正方形端点。例如，指定线的斜率为 m，那么粗线的方端的线斜率为\
    \ −1/m。另一种线帽是圆帽，它通过对每个方帽添加一个填充的半圆而得到。\n\n  圆的圆心在线的端点，其直径与线宽相等。第三种线帽是突方帽，这里我们简单地将线向两端延伸一半线宽并添加方帽即可。\n\
    \n  生成粗线的其他方法还有将显示线段看作填充长方形，或用选定的笔或刷样式来生成线段。为了得到线边界的长方形表示，可沿垂直于线段路径方向计算长方形顶点的位置，以使顶点坐标与线段端点间距离为线宽的一半。而后可以给填充的长方形添加圆帽或延伸其长度来显示突方帽。\n\
    \n  生成粗折线则需要一些额外的考虑。通常，显示单根线段所用方法不能生成光滑连接的折线段。例如，用水平或垂直段显示粗线会在不同斜率的线段的连接处，水平段变成垂直段或垂直段变成水平段时留下间隙。解决的办法是在线端点进行额外的处理来生成光滑连接的粗折线。下图给出了两线段光滑连接的三种方法。斜角连接\
    \ 通过延伸两条线的外边界直到它们相交；圆角连接 通过用直径等于线宽的圆弧边界将两线段的外边界连接而成；斜切连接 通过用方帽和在两线段处的三角形间隙中填充来完成。\n\
    \n  1   1   1\n  1   1   1\n  1   1   1\n\n  ![](img/dce279c4fd8230bfee452d9f1db7cf9c_374_0.png)\n\
    \n  通过改变模板的尺寸，用笔或刷形状可以生成多种线宽。例如，上图中的长方形笔线可以收缩成 2×2 长方形模板或放大成 4×4 模板。通过将式样值加到笔或刷标记上，也可以按选定的式样显示线段。\n\
    \n- **4. 线颜色**\n\n  当系统提供颜色（或亮度）选择时，给出当前颜色索引的参数包括在系统属性值表中。画线程序以当前颜色显示线段，是通过调用函数\
    \ `setColor` 将这种颜色设置在帧缓冲器中沿线段路径的像素位置处来实现。颜色选择的数目取决于帧缓冲器中每个像素有效值的数目。\n\n### 3.8.2\
    \ 字符属性\n\n字符属性包括字体、大小、颜色、方向等。属性既可对整个字符串设置，也可对定义为标记符号的单个字符设置。\n\n- **1. 文本属性**\n\
    \n  字体是首选的字符属性，用一组预先定义的网格图案或用多边形和样条曲线设计的字符集来确定。设置字体的函数是：`setTextFont(tf)`\n\n\
    \  其中，字体参数 tf 为一整数值，用来选择指定的字体和相应的风格。\n\n  显示文本的颜色设置存储在系统属性表中，并由字符定义装入帧缓冲器中的程序使用。要显示字符串时，按对应的字符形状和位置使用当前颜色来设置帧缓冲器中的像素值。文本颜色由下列函数来控制和管理：`setTextColorIndex(tc)`\n\
    \n  其中，文本颜色参数 tc 指定一个允许的颜色码。\n\n  文本大小通过缩放字符的整体尺寸（高度和宽度）或仅缩放字符的宽度来实现。字符大小按磅 (points)\
    \ 为单位或字号来指定，其中一磅是 1/72 英寸。但是，具有相同磅数的不同字体按其字体设计的不同而有不同的字符大小。在指定大小的一种字体中的所有字符的底线和顶线间的距离是相同的，但字体的宽度可能不同。字符高度定义为字符基线和帽线间的距离。\n\
    \n  用下列函数可以在不改变字符的宽高比的情况下调整文本大小：`setCharacterHeight(ch)`\n\n  参数 ch 被赋予一个大于零的实数值，以设置大写字母的坐标高度，即用户坐标中基线和帽线间的距离。这些设置也影响字符字体大小，其结果是调整字符的宽度和间隔以保持相同的文本比例。\n\
    \n  字符的宽度可用下列函数设置：`setCharacterExpansionFactor(cw)`\n\n  其中，字符宽度参数 cw 是缩放字符宽度的正实数。文本的高度不受这个属性设置的影响。\n\
    \n  字符间间隔用下列函数单独控制：`setCharacterSpacing(cs)`\n\n  其中，字符间隔参数 cs 可设置成任何实数，实际的字符间隔值由\
    \ cs 乘以字符高度来得到。\n"
