    \ t³ − 2t² + t\nG₁(t) = t³ − t²\n\n将 F₀, F₁, G₀, G₁ 代入式（3.3），得到：\n\nP(t) = F₀(t)P₀\
    \ + F₁(t)P₁ + G₀(t)P'₀ + G₁(t)P'₁, t ∈ [0,1]  (4.4)\n\n式（4.4）是三次 Hermite（Ferguson）曲线的几何形式，几何系数是\
    \ P₀, P₁, P'₀ 和 P'₁。F₀, F₁, G₀, G₁ 称为调合函数（或混合函数），即该形式下的三次 Hermite 基，具有如下性质：\n\n\
    ```\n\\begin{bmatrix} F_i(j) & F_i'(j) \\\\ G_i(j) & G_i'(j) \\end{bmatrix} =\
    \ \\begin{bmatrix} \\delta_{ij} & 0 \\\\ 0 & \\delta_{ij} \\end{bmatrix}, \\quad\
    \ i,j=0,1 \\qquad (4.5)\n```\n\nF₀ 和 F₁ 专门控制端点的函数值对曲线的影响，而同端点的导数值无关；G₀ 和 G₁ 则专门控制端点的一阶导数值对曲线形状的影响，同端点的函数值无关。或者说，F₀\
    \ 和 G₀ 控制左端点的影响，F₁ 和 G₁ 控制右端点的影响。\n\n## 4.2.6 连续性\n\n设计一条复杂曲线时，处于设计和制造上的考虑，常常通过多段曲线组合而成，这需要解决曲线段之间如何实现光滑连接的问题。\n\
    \n曲线间连接的光滑度量准则有两种：一种是函数的可微性，使得组合曲线在连接处具有直到 n 阶连续导矢，即 n 阶连续可微，这类光滑度量称之为 C^n 或 n\
    \ 阶参数连续性；另一种称之为几何连续性，组合曲线在连接处满足不同于 C^n 的某一组约束条件，称为具有 n 阶几何连续性，简记为 G^n。曲线光滑性的这两种度量方法并不矛盾，C^n\
    \ 连续包含在 G^n 连续之中。\n\n下面详细介绍两条曲线拼接的连续性问题。首先举例说明引进几何连续的重要性。\n\n### 例 令\n\nΦ(t) =\
    \ { V₀ + (V₁−V₀)/3 t , 0 ≤ t ≤ 1\nV₀ + (V₁−V₀)/3 + (t−1) 2(V₁−V₀)/3 , 1 ≤ t ≤\
    \ 2 }\n\nΦ(t) 在 [0, 2] 上表示一条连接 V₀, V₁ 的直线段，但是\n\nΦ'(1−) = (V₁−V₀)/3 , Φ'(1+) =\
    \ 2(V₁−V₀)/3\n\nΦ(t) 明明是一条直线，却非 C¹ 连续，说明用参数连续描述光滑\n\n## 4.3 抛物样条曲线\n\n用抛物线作为基本曲线，通过一定的数学方法，把一组离散的数据点用一条复合的曲线光滑地连接起来。\n\
    \n## 4.3.1 过三点定义一条抛物线\n\n设有不在一直线上的任意三点： P₁，P₂，P₃。如何定义一条抛物线使其通过该三点。\n\n抛物线参数表达式的一般形式为：\n\
    \n```\nP(t) = A₁ + A₂ t + A₃ t², 0 ≤ t ≤ 1\n```\n\n表达式中的三个系数 A₁、A₂ 和 A₃ 是未知的，所以只要确定该\n\
    \n三个系数的值，则抛物线就能惟一确定。\n\n要求三个未知数，必须设三个独立的条件。因抛物线过该三点，所以，设：\n\n- (1) 抛物线以 P₁ 为始点，即\
    \ t = 0 时，P(0) = P₁;\n- (2) 抛物线以 P₃ 为终点，即 t = 1 时，P(1) = P₃;\n- (3) 当 t = 0.5\
    \ 时，曲线过 P₂ 点，即 P(0.5) = P₂。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_427_0.png)\n\
    \n于是，可列出三个独立的方程为：\n\n```\nA₁ = P₁ (t = 0)\n```\n\n```\nA₁ + A₂ + A₃ = P₃ (t =\
    \ 1)\n```\n\n```\nA₁ + 0.5A₂ + 0.25A₃ = P₂ (t = 0.5)\n```\n\n解以上的联立方程组，可得：\n\n\
    ```\nA₁ = P₁\n```\n\n```\nA₂ = 4P₂ - P₃ - 3P₁\n```\n\n```\nA₃ = 2P₁ + 2P₃ - 4P₂\n\
    ```\n\n故，抛物线的参数表达式就可以唯一确定为：\n\n若将上述方程改写为：\n\n$P(t) = (2t^2 - 3t + 1)P_1 + (4t\
    \ - 4t^2)P_2 + (2t^2 - t)P_3$\n\n$= (1 - t)^2 P_1 + 2t(1 - t)(2P_2 - (P_1 + P_3)/2)\
    \ + t^2 P_3$\n\n则抛物线可由三点：$P_1$、$Q = 2P_2 - (P_1 + P_3)/2$ 和 $P_3$ 来定义。\n\n此时，当\
    \ $t = 0$ 时，抛物线过点 $P_1$，在点 $P_1$ 处与 $P_1 Q$ 相切，当 $t = 1$ 时，抛物线过点 $P_3$，在点 $P_3$\
    \ 处与 $Q P_3$ 相切，在点 $P_2$ 处的切向量为 $P_1 P_3$。构造的抛物线如下图所示。\n"
