    为了正确地裁剪凹多边形，有以下几种方法，其一是将凹多边形分割成若干个凸多边形，然后分别处理各个凸多边形；其二是修改 Sutherland—Hodgeman
    算法，沿着任何一个裁剪窗口边界检查顶点表，正确地连接顶点对；第三种方法就是随后介绍的 Weiler—Atherton 算法。


    # 凹多边形的判定与分解


    在 xy 平面上判定和分解凹多边形的方法有两种。


    +   （1）向量法。沿多边形的边界计算相邻边向量的叉乘可判定凹多边形。如果一些叉乘的 z 分量为正，另一些叉乘的 z 分量'
  - '[PAGE 337]


    为负，则该多边形必为凹多边形，否则为凸多边形。


    # 例 分解凹多边形的向量法


    给定一多边形，其边向量如下：


    E₁ = (1, 0),    E₂ = (1, 1),    E₃ = (1, −1)

    E₄ = (0, 2),    E₅ = (−3, 1),    E₆ = (0, −2)


