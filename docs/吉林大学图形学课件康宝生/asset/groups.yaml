    \ else d = d + 2dy;\n- Step 3. 算法结束。\n\n## 程序 3.2.3 Bresenham 扫描转换算法\n\n```c\n\
    void line_BRES (int xs, int ys, int xe, int ye, int Color)\n{ /* 设 0 ≤ m ≤ 1 */\n\
