    # 7.5.2 de Boor-Cox 算法


    B 样条曲线的 de Boor-Cox 算法，可以推广到 B 样条曲面的情形。若给定 B 样条曲面控制网格的控制顶点 $\boldsymbol{d}_{ij}
    (i = 0, 1, \cdots, m;$ $j = 0, 1, ..., n)$ 和一对参数 $(u, v)$ $(u \in [u_I, u_{I+1})$,
    $u \in [v_J, v_{J+1})$, $k$ $-1 \le I \le m; l-1 \le I \le n)$，则：


    $\boldsymbol{P}(u,v) = \sum_{i=0}^{m} \sum_{j=0}^{n} \boldsymbol{d}_{ij} N_{i,k}(u)
    N_{j,l}(v)$


    $= \sum_{i=I-k+1}^{I} \sum_{j=J-l+1}^{J} \boldsymbol{d}_{ij} N_{i,k}(u) N_{j,l}(v)$


    $= \cdots = \sum_{i=I-k+r+1}^{I} \sum_{j=J-l+s+1}^{J} \boldsymbol{d}_{i,j}^{r,s}
    N_{i,k-r}(u) N_{j,l-s}(v) = \cdots = \boldsymbol{d}_{I,J}^{k-1,l-1}$'
  - '[PAGE 690]


    其中上式中 $d_{i,j}^{0,0}=d_{i,j}$，其他各控制顶点由下列递推关系式：


    $d_{i,j}^{r,s}=\begin{cases}

    \displaystyle\frac{u-u_i}{u_{i+k-r}-u_i}d_{i,j}^{r-1,0}+\frac{u_{i+k-r}-u}{u_{i+k-r}-u_i}d_{i-1,j}^{r-1,0},\quad
    r=1,\cdots,k-1;s=0\\

    \displaystyle\frac{v-v_j}{v_{j+l-s}-v_j}d_{i,j}^{k-1,s-1}+\frac{v_{j+l-s}-v}{v_{j+l-s}-v_j}d_{i,j-1}^{k-1,l-1},\quad
    r=k-1;s=1,\cdots,l-1

    \end{cases}\quad(1)$


    或


    $d_{i,j}^{r,s}=\begin{cases}

    \displaystyle\frac{v-v_j}{v_{j+l-s}-v_j}d_{i,j}^{0,s-1}+\frac{v_{j+l-s}-v}{v_{j+l-s}-v_j}d_{i,j-1}^{0,l-1},\quad
    r=0;s=1,\cdots,l-1\\

    \displaystyle\frac{u-u_i}{u_{i+k-r}-u_i}d_{i,j}^{0,s-1}+\frac{u_{i+k-r}-u}{u_{i+k-r}-u_i}d_{i-1,j}^{0,s-1},\quad
    r=1,\cdots,k-1;s=l-1

    \end{cases}\quad(2)$


    决定，$i=I-k+r+1,\cdots,k-1$；$j=J-l+s+1,\cdots,l-1$。'
