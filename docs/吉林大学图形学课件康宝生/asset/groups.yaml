    \ \\(P_{u0}, P_{u1}, P_{0v}, P_{1v}\\)。\n\n### 7.2 二次曲面和超二次曲面\n\n二次曲面是一类常用的物体，由二次方程描述，包括球面、椭球面、环面、抛物面和双曲面。二次曲面，尤其是球面和椭球面，是最基本的图形物体，经常作为图元用在图形包中，由此可以构造更复杂的物体。\n\
