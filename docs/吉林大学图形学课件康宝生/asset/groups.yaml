- raw:
  - '[PAGE 185]


    # 3.3.3 生成圆的中点算法


    Bresenham 算法是画圆的最有效的算法之一，其效率要高于基于圆的隐式方程和极坐标方程的算法。对于圆心坐标和半径为整数的情况，运用中点准则可建立一个类似的算法，它能产生同样的一组优化的像素。


    我们这里仍然考虑第一象限的上半部的八分之一圆弧的生成过程，并调用 CirclePoints 画出圆上其余的所有点。与画直线的中点算法相似，这里所用的方法是：在
    2 个像素之间的中点处给出—判定函数，并据此在 2 个像素中选择最靠近圆的那个像素。'
  - '[PAGE 186]


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_186_0.png)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_186_1.png)


    设函数 F(x, y) = x² + y² + R²。对于圆上的点，此函数的值为 0；对于圆内的点，函数值为负；对于圆外的点，函数值则是正的。这样，如果像素
    E 和 SE 的中点 M 在圆外，则 SE 更靠近圆。相反，如果中点在圆内，则 E 更靠近圆。'
  - '[PAGE 187]


    与画直线类似，我们选择像素的依据是判定函数 d 的值，即函数 F(x, y) 在中点处的值：


    d_i = F(x_i + 1, y_i - 1/2) = (x_i + 1)^2 + (y_i - 1/2)^2 - R^2


    +   - 如果 d_i < 0，就选择像素 E，并将当前中点的 x 坐标增加一个单位，以得到下一个中点，从而得到：

    +     d_{i+1} = F(x_i + 2, y_i - 1/2) = (x_i + 2)^2 + (y_i - 1/2)^2 - R^2


    显然，d_{i+1} = d_i + (2x_p + 3)，可得增量：Δ_E = 2x_i + 3。


    +   - 如果 d_i ≥ 0，就选择像素 SE，而下一个中点是将当前中点的 x 坐标增加一个单位，y 坐标减少一个单位，从而得'
  - '[PAGE 188]


    到：


    $d_{i+1}=F(x_i+2, y_i-3/2)=(x_i+2)^2+(y_i-3/2)^2-R^2$


    同样有：$d_{i+1}=d_i+(2x_i-2y_i+5)$，得到增量：


    $D_{SE}=2x_i-2y_i+5$


    我们知道，在画直线的中点算法中，增量 $D_E$ 和 $D_{SE}$ 都是常量，但在处理圆这样的二次函数时，$D_E$ 和 $D_{SE}$ 在每一步都要变化，且依赖于上一步所选像素点
    $P$ 的坐标 $x_i$ 和 $y_i$。称 $P$ 为估计点。在每一步，我们直接将上一步所选像素的 $x$ 和 $y$ 坐标值代入增量计算公式，就得到了新的增量。由于计算公式是线性的，所以其直接计算的开销不大。'
  - '[PAGE 189]


    下面，我们还需要确定判定函数 $d$ 的初值。由于限定该算法处理的圆的半径为整数，并只画八分之一圆弧，因此，圆的起始像素是 $(0, R)$，而下一个中点的位置是
    $(1, R - 1/2)$，因此


    $d_{start} = F(1, R - 1/2) = 1 + (R - 1/2)^2 - R^2 = 5/4 - R$


    该算法的实现程序如程序 3.3.2 所示，其结构与画直线的算法很相似。'
  - "[PAGE 190]\n\n# 程序 3.3.2 中点圆扫描转换算法\n\n```\nvoid MidpointCircle(int radius, int\
    \ Color)\n{\n    int x, y;\n    float d;\n    x = 0; y = radius; d = 5.0/4 - radius;\n\
    \    CirclePoints (0, 0, x, y, Color);\n    while(x < y) {\n        if (d < 0)\
    \ {d += x*2.0 + 3;}\n        else {d += (x - y)*2.0 + 5; y-- ;}\n        x++;\n\
    \        CirclePoints (0, 0, x, y, Color);\n    }\n}\n```"
  - '[PAGE 191]


    算法 3.3.2 的不是由于判定函数 $d$ 的初值是浮点数，因此算法必须做浮点数的算术运算。我们希望有一个效率更高的只进行整数运算的算法。为此，我们定义一个新的判定函数：


    $$h=d-1/4$$


    这样在初始化时，$h=1-R$，而条件 $d<0$ 变成了 $h<-1/4$。由于 $h$ 的初值是整数，且其相应的增量也是整数，因此我们可将条件 $h<-1/4$
    改为 $h<0$。这样算法就变成了关于 $h$ 的只进行整数运算的形式。为了与画直线算法保持一致性，我们仍然用 $d$ 表示决策函数。改进后的算法如程序 3.3.3
    所示。'
  - "[PAGE 192]\n\n# 程序 3.3.3 扫描转换圆的整数型中点算法\n\n```\nvoid MidpointCircle(int radius,\
    \ int Color)\n{\n    int x, y, d;\n    x = 0; y = radius; d = 1 - radius;\n  \
    \  CirclePoints (0, 0, x, y, Color);\n    while(x < y){\n        if (d < 0) {\
    \ d += x*2 + 3; }\n        else { d += (x - y)*2 + 5; y--; }\n        x++;\n \
    \       CirclePoints (0, 0, x, y, Color);\n    }\n}\n```"
  - '[PAGE 193]


    # 例 3-3-2. 用中点算法画圆心为 O(0, 0)，半径为 R = 10 的八分之一圆弧。


