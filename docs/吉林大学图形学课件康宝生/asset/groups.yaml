    \n## 7.4 Bézier 曲面\n\n### 7.4.1 Bézier 曲面的定义\n\nBézier 曲面是 Bézier 曲线向曲面的直接推广。给定三维空间\
    \ $(m+1)\\times(n+1)$ 个点 $P_{ij}(x_{ij}, y_{ij}, z_{ij})$, $i=0,1,\\cdots,m$;\
    \ $j=0,1,\\cdots,n$，张量积形式的参数多项式曲面：\n\n$P(u,v)=\\sum_{i=0}^{m}\\sum_{j=0}^{n}P_{ij}B_{i,m}(u)B_{j,n}(v),\\\
    ;0\\le u,\\;v\\le1$\n\n称为 $m\\times n$ 次 Bézier 曲面。$P_{ij}$ 称为 $P(u,v)$ 的控制顶点，由两组多边形\
    \ $P_{i0},P_{i1},\\cdots,P_{in}$ $(i=0,1,\\cdots,m)$ $P_{0j},P_{1j},\\cdots,P_{mj}$\
    \ $(j=0,1,\\cdots,n)$ 组成的网格叫做 $P(u,v)$ 的控制网格，$B_{i,m}(u)$ 和 $B_{j,n}(v)$ 分别为\n\
    \n### n 次和 m 次 Bernstein 多项式：\n\nB_{i,m}(u) = \\binom{m}{i} u^i (1-u)^{m-i}, B_{j,n}(v)\
    \ = \\binom{n}{j} v^j (1-v)^{n-j}\n\n其矩阵表示为：\n\nP(u,v) = [B_{0,m}(u) B_{1,m}(u)\
    \ \\cdots B_{m,m}(u)] \\begin{bmatrix} P_{00} & P_{01} & \\cdots & P_{0n} \\\\\
    \ P_{10} & P_{11} & \\cdots & P_{1n} \\\\ \\vdots & \\vdots & \\ddots & \\vdots\
    \ \\\\ P_{m0} & P_{m1} & \\cdots & P_{mn} \\end{bmatrix} \\begin{bmatrix} B_{0,n}(v)\
    \ \\\\ B_{1,n}(v) \\\\ \\vdots \\\\ B_{n,n}(v) \\end{bmatrix}\n\n## 1. Bézier\
    \ 曲面的性质\n\n- (1) 角点位置 P(u, v) 的四个角点是 P00, P0n, Pm0, Pmn;\n- (2) 边界线位置 P(u, v)\
    \ 的四条边界线 P(0, v)、P(1, v)、P(u, 0) 和 P(u, 1) 分别是以 P00, …, P0n；Pm0, …, Pmn；P00, …,\
    \ P0n 和 P0n, …, Pmn 为控制多边形的 Bézier 曲线；\n- (3) 角点切平面 三角形 ΔP00P10P01；ΔP0nP1nP0n-1；ΔPm0Pm-10Pm1\
    \ 和 ΔPmnPm-1nPmn-1 所在平面分别在角点 P00, P0n, Pm0 和 Pmn 与曲面 P(u,v) 相切；\n- (4) 角点法向量 由切平面可知，向量\
    \ P00P10 × P00P01 是曲\n\n面 $P(u,v)$ 在 $P_{00}$ 处的法向量，其余各角点的法向量类似。\n- (5) 凸包性 曲面\
    \ $P(u,v)$ 位于控制顶点 $P_{ij}, i=0,1,\\cdots,m;$ $j=0,1,\\cdots,n,$ 的凸包内;\n- (6) 几何不变性\
    \ 曲面 $P(u,v)$ 的形状和位置与坐标系的选取无关;\n- (7) 对称性 由控制顶点 $\\{P_{ij}^* = P_{m-i,n-j}\\}$\
    \ 构造出的新 Bézier 曲面 $P^*(u,v)$:\n  \n  $P^*(u,v) = \\sum_{i=0}^{m} \\sum_{j=0}^{n}\
    \ P_{ij}^* B_{i,m}(u) B_{j,n}(v),\\ 0 \\le u,\\ v \\le 1$\n  \n  与原 Bézier 曲面\
    \ $P(u,v)$ 形状相同，但走向相反。\n\n## 2. Bézier 曲面的拼接\n\n设两张 $m\\times n$ 次 Bézier 曲面如图所示，分别由控制顶点\
    \ $P_{ij}$ $(0 \\le i \\le m\\ ;\\ 0 \\le j \\le n)$ 和 $Q_{ij}$ $(0 \\le i \\\
    le m\\ ;\\ 0 \\le j \\le n)$ 定义：\n\n$$P(u,v)=\\sum_{i=0}^{m}\\sum_{j=0}^{n}P_{ij}B_{i,m}(u)B_{j,n}(v),\\\
    \ 0\\le u,v\\le 1$$\n\n$$Q(u,v)=\\sum_{i=0}^{m}\\sum_{j=0}^{n}Q_{ij}B_{i,m}(u)B_{j,n}(v),\\\
    \ 0\\le u,v\\le 1$$\n\n如果要求两曲面片达到 $G^0$ 连续，则它们有公共的边界，即\n\n$$P(1,v)=Q(0,v)\\qquad(1)$$\n\
    \n于是，有：$P_{mj}=Q_{0j},\\ j=0,1,\\cdots,n_0$。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_661_0.png)\n\
    \n如果又要求沿公共边界达到 $G^1$ 连续，则两曲面片在该公共边界上有公共的切平面，因此曲面的法向应当是跨界连续的，即：\n\nQ_u(0, v) ×\
    \ Q_v(0, v) = α(v) P_u(1, v) × P_v(1, v)  (2)\n\n其中，α(v) 为任意非负连续函数。下面讨论满足上式的两种方法。\n\
    \n（1）鉴于 G⁰ 连续，式（2）最简单的解是：\n\nQ_u(0, v) = α(v) P_u(1, v)  (3)\n\n这相当于要求合成曲面上 v\
    \ 为常数的所有曲线，在跨界时有切向的连续性。为了保证式（3）两边关于 v 的多项式次数相同，必须取 α(v) = α (正常数)。于是有：\n\nQ⃗_{1j}\
    \ Q_{0j} = α P⃗_{m,j} P_{m-1,j}  (α > 0, j = 0,1,⋯,n)\n\n即 Q_{1j} - Q_{0j} = a\
    \ (P_{m,j} - P_{m-1,j})，(a > 0, j = 0, 1, ..., n)。\n\n（2）式（3）使得两张去面片在公共边界达到 G¹\
    \ 连续时，只涉及曲面 P(u,v) 和 Q(u,v) 的两列控制顶点，比较容易控制。用这种方法匹配合成曲面的边界，u 向和 v 向是光滑的连续的。但实际上，式（3）的限制是苛刻的。\n\
    \n为了构造合成曲面时有更大的灵活性，Bézier 在 1972 年放弃把式（3）作为 G¹ 连续的条件，而以式（4）\n\nQ_u(0,v) = α(v)\
    \ P_u(1,v) + β(v) P_v(1,v)    (4)\n\n来满足式（2），这只要求 Q_u(0,v) 位于 P_u(1,v) 和 P_v(1,v)\
    \ 所在\n\n的平面内，也就是曲面片 $P(u, v)$ 边界上相应点处的切平面，这样就有了大得多的余地，但跨界切矢在跨越曲面片的边界时就不再连续了。\n\
    \n同样，为了保证式（4）两边关于 $v$ 的多项式次数相同，必须取 $\\alpha(v)$ 为任意正常数，$\\beta$ 为 $v$ 的任意线性函数。\n\
