    的图形功能扩展集，一个典型的例子便是 SGI 设备上的 Open GL 系统。通用图形软件包的基本功能包括生成基本图元(直线、多边形、圆和其他图形)、设置色彩和强度值、选择观察和实施变换。专用应用图形软件包是为非程序员设计的，因此用户可生成显示而毋须担心图形操作是如何进行的。在这些软件包中，与'
