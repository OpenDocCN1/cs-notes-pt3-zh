    # 2. 梁友栋 - Barsky 算法


    三维图形裁剪的梁友栋–Barsky 算法亦是二维的推广。当规范化观察体为立方体时，这种推广是直接的，即：


    Q_L = -Δx,  D_L = x₀

    Q_R = Δx,   D_R = 1 - x₀

    Q_B = -Δy,  D_B = y₀


    Q_T = -Δy,  D_T = 1 - y₀

    Q_F = -Δz,  D_F = z₀

    Q_FB = Δz,  D_FB = 1 - z₀


    当规范化观察体为棱台时，则：'
