    # 以外接圆圆心定位的正多边形


    除了上述构造正多边形的方法外，还可以用另外一种方法，即利用正多边形的外接圆来构造正多边形，这在有些应用场合比上面所讲的构造方法使用起来更方便，如图所示。


    在这种构造方法中，定形参数为：


    +   - 边数 n (n ≥ 3);

    +   - 外接圆半径 R。


    定位参数为：


    +   - 外接圆圆心坐标 P₀(x₀, y₀)

    +   - 起始倾角 α


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_127_0.png)'
  - '[PAGE 128]


    根据以上给定的参数，同样可以得到计算正多边形各顶点坐标的公式如下：


    $$P_i:\begin{cases}x_i = x_0 + R\cos(\alpha + (i-1)\Delta\theta)\\y_i = y_0 +
    R\sin(\alpha + (i-1)\Delta\theta)\end{cases},\ i=1,2,\cdots,n$$


    其中：$\Delta\theta = 2\pi / n$


    # 螺旋图案的绘制


    下面是螺旋图案的例子，看起来似乎很复杂，但它却是由一种图形（正方形）构成的，只是图案中所包含的正方形的大小和位置各不相同。'
  - '[PAGE 129]


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_129_0.png)


    +   - 图形分析


    分析螺旋图案可以得知，图案由 16 个相似的方块拼接而成，每一个方块是由正方形构成的螺旋图案，而每个相邻方块的螺旋方向相反。组成整个图案的每个方块是由正方形旋转和缩小形成的，且经过旋转和缩小的正方形的
    4 个顶点刚好在前一个正'
  - '[PAGE 130]


    方形的 4 条边上。


    下面我们讨论两个相邻正方形之间的几何关系。设两个正方形的外界圆半径分别为 R₁ 和 R₂，相应的边长为 a₁ 和 a₂，旋转角度为 θ。则两个正方形之间的缩小系数为：


    ```

    f = a₂ / a₁

    ```


    因为经过旋转和缩小的正方形的 4 个顶点刚好位于前一正方形的 4 条边上，所以，这个缩小系数 f 和和转角 θ 密切相关。从图可以看出，在直角三角形 PQS
    中：


    ```

    QS = a₂ sin θ, PS = a₂ cos θ, QS + PS = a₂ (sin θ + cos θ) = a₁

    ```'
  - '[PAGE 131]


    # 所以


    f = a₂ / a₁ = 1 / (sin θ + cos θ)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_131_0.png)


    考虑到转角 θ 可以取正值（逆时针旋转）或负值（顺时针旋转），但缩小系数 f 总为正值，所以在求缩小系数 f 时，取转角'
