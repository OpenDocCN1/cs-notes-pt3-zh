    \n由面，张量积曲面没有任何改变，两个直交面的形状也没有改变，但沿着直母线的点的分布发生了改变即参数化变了。因此导致最后叠加得到的 Coons 曲面片的形状发生了变化。\n\
    \n局部双三次混合 Coons 曲面片较之双线性混合 Coons 曲面片的优点在于实现了 C¹ 光滑连接，即当两相邻 Coons 曲面片在公共边界两端点处\
    \ C¹ 连续时，沿公共边界处两跨边界切矢也 C¹ 连续。\n\n### 7.7.3  双三次混合 Coons 曲面片\n\n虽然局部双三次混合 Coons\
    \ 曲面片解决了 C¹ 连接问题，但\n\n新的问题又出现了。采用双三次混合函数的结果，导致了曲面片在角点处的扭矢（混合偏导）为零矢量，从而引起曲面角点处出现“伪平点”。出现这种不良性能的原因在于我们仅仅用了四个一组的三次\
    \ Hermite 基函数中的两个。在区间端点处这两个函数的导数都为零，而传递到曲面角点处引起。为了避免这个问题，必须修改局部双三次混合 Coons 曲面片。\n\
    \n三次 Hermite 插值不仅要求端点位置信息，而且还要求端点切矢信息。由于这里的位置信息是整条曲线，而不是点，相应的切矢信息也应沿整条曲线提供。因此，生成双三次混合\
    \ Coons 曲面片的输入数据应包括：\n\n- - 四条边界曲线： **P(u, 0)**, **P(u, 1)**, **P(0, v)**, **P(1,\
