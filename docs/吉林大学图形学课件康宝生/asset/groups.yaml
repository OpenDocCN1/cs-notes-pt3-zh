    \ 51。实际上，点 P(3,0,2) 恰好为单元 51 的左下角的坐标。\n\n**性质 2.** 给定线性八叉树结点的编码 {q_{n-1}q_{n-2}⋯q_0},\
    \ 则对应的子立方体的前下角的坐标为:\n\n\\begin{cases}\n x = i_{n-1} i_{n-2} \\cdots i_0 \\\\\n\
    \ y = j_{n-1} j_{n-2} \\cdots j_0 \\\\\n z = k_{n-1} k_{n-2} \\cdots k_0\n\\end{cases}\n\
    \n这里， i_l, j_l, k_l 为 q_l 的二进制表示，即：\n\nq_l = k_l j_l i_l, l = 0,1,…,n-1\n\n例如，对\
    \ Q = 51，有 q0 = 1 = (001)_2, q1 = 5 = (101)_2，则：\n\nx = 1×2^0 + 1×2^1 = 3, y =\
    \ 0×2^0 + 0×2^1 = 0, z = 0×2^0 + 1×2^1 = 2\n\n**性质 3.** 若八叉树的结点编码为 {q_{n-1} q_{n-2}\
    \ ⋯ q0}，其中，q0 = q1 = … = q_{i-1} = 0， q_i ≠ 0，则该子立方体单元的边长为 2^i。\n\n## 8.2 分形\n\
    \n分形是最近二十多年来发展起来的新学科。分形的原文是 Fractals，是由著名数学家 B. Mandelbrot 于 1975 年用拉丁词根构造的单词，他创立了独立于欧几里德几何学之外的数学方法：分形几何。\n\
    \n自然界中存在着数不胜数的不规则形体。多少年来，人们都是用传统的几何方法对它们进行描述，采用的主要手段是用规则形体逼近。这种用规则形体描述不规则形体所得到的结果，与现实是有很大差距的，并且这种方法需要大量的数据，所以有时甚至是不可能的。\n\
    \n其实，当用计算机模拟自然景物时，最主要的是所生成的对象确实使人感受到是预期的那一类，而不必非是某个具体的个体。因此，为此目的不必使用大量的数据，是很自然的。\n\
    \n分形几何学的创立，为自然景物的描述和计算机模拟提供了强有力的数学工具。正因为如此，所以人们说，分形是大自然的几何学。\n\n### 8.2.1 分形的定义\n\
    \n满足下述性质的集合称之为分形：\n\n- （1）分形集都具有任意小尺度下的比例细节，或者说它具有精细的结构。\n- （2）分形集不能用传统的几何语言来描述，它既不是满足于某些条件的点的轨迹，也不是某些简单方程的解集。\n\
    - （3）分形集具有某种自相似的形式，能是近似的或统计的自相似。\n- （4）一般说来，分形集的维数是一个分数，所以分形也称为分数维。\n- （5）在大多数令人感兴趣的情形下，分形集由非常简单的方法定义，可以用变换的迭代产生。\n\
    \n### 8.2.2 分形的四种构成方法\n\n- （1）基于 L 系统的分形模型；\n- （2）迭代函数系统（IFS）模型；\n- （3）粒子系统模型；\n\
    - （4）随机插值模型。\n\n### 8.2.3 典型的分形模型\n\n- **Koch 曲线**\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_758_0.png)\n\
    \nKoch 曲线是 Von Koch 于1904 年第一次描述的。它的构造规则是：迭代初始把原线段去掉中间的三分之一，代之以底边在被去线段上的等边三角形的两腰。以后每一步的迭代都是这样的重复。\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_759_0.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_759_1.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_759_2.png)\n\n在 Koch 曲线中，S = 3（缩小系数是1/3）；N\
    \ = 4。所以 Koch 曲线的维数为：\n\nD = ln(4) / ln(3)\n\n依据 Koch 曲线的生成原理，设计不同的生成元，便可以构画出多种多样的分形曲线。\n\
    \n- **Dragon 曲线**\n\nDragon 曲线的生成规则：变换的起始是一条原始直线段。第一步是将该直线段由中点隆起，使其变成一个等腰直角三角形的两腰。接下来再分别对两腰作与前面同样的变换，如此不断进行。\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_762_0.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_762_1.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_762_2.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_762_3.png)\n"
  mdcn: "\n“满”时，算得的体积最大；反之，如果将这些叶结点都算作“空”时，所求得的体积最小。当然，更合理的算法是引入 Monte Carlo 法，即产生随机数，根据随机数来取一部分“部分占有”的叶结点作为“满”结点。\n\
    \n（3）八叉树的数据结构简化了隐藏线隐藏面的消除算法。由于消隐算法的核心是排序，即将待显示物体上的点、线、面按它们离观察点的远近排序，离观察点近的元素遮挡远的元素，而物体的八叉树表示中，物体的各元素已按空间位置排列成一定的顺序。同一层次的八叉树结点组成三维空间中可线性分离的丛，因此很容易建立丛的优先级树。例如，在我们所给\n\
    \n八叉树的缺点有以下几点：\n\n- 占用存储空间大。\n- 物体的坐标变换代价高。当物体旋转一角度后，整个八叉树需要重新生成。对于平移而言，物体的八叉树结点分割保持不变，但沿平移方向的所有结点都需要重新编码。\n\
    - 与 B-rep 表示或 CSG 表示难以统一，而 B-rep 表示或 CSG 表示可以转化成八叉树表示。这种单向转换导致八叉树的表示形式难以集成到已有的基于\
    \ B-rep 表示或 CSG 表示的系统中。\n\n减少八叉树表示所需空间存储量的一种有效措施是线性八叉树。\n\n线性八叉树表示与八叉树表示类似，惟一的区别是存储方式。线性八叉树是用一可变长度的一维数组存储一棵八叉树，数组中仅存储八叉树的终端结点——即描述一个物体的大小相同的小立方体。对于\
    \ 2^N×2^N×2^N 的空间分割，每个结点在八叉树中位置可用一八进制数表示为：\n\nQ = q_{n-1} 8^{n-1} + q_{n-2} 8^{n-2}\
    \ + … + q_1 8 + q_0\n\n式中 q_i， i = 0, 1, …, n - 1 为八进制数，即 q_i ∈ {0, 1, …, 7}。q_0\
    \ 表示该结点在其兄弟结点中的序号, q_1 是它的父结点在同辈中的序号，依次类推。这样一来，从 q₀ 到 qₙ₋₁ 完整地表示了每个叶结点从叶到根的路径。整个八叉树的结构可以紧凑地用一维数组或链表描述，每个结点只占一个存储单元，存放其相应的八进制编码\
    \ {qₙ₋₁qₙ₋₂⋯q₀}。空结点和半满结点不占存储空间，这就大大提高了存储效率，节省了存储空间。\n\n值得指出的是，八叉树结点编码方式具有十分有趣的性质。为方便起见，我们将立方体垂直\
    \ x 轴、y 轴和 z 轴的三个中分面分别称为 x 中分面、y 中分面、z 中分面，那么位于 x 中分面右侧的子结点的编码均比左侧的相邻结点的编码增加 1，位于\
    \ y 中分面后侧的子结点的编码均比前侧的相邻结点的编码增加 2，而位于 z 中分面上侧的子节点的编码均比下侧的相邻节点的编码增加 4。若将子节点的编码以三位二进制数表示，则子节点的编码会更明显地反映出其相应子立方体在空间的位置。以编码6的节点为例，其编码的二进制数表示为(110)₂，那么最末一位0表示该节点在x中分面的左侧，中间一位1表示该节点在y中分面的后侧，首位1表示该立方体在z中分面的上侧，故编码为6的子立方体位于立方体后面的左上角。实际上，若取子立方体的边长为1，则(0,1,1)正是6号子立方体左前下角点的坐标。由此容易建立空间任一点和线性八叉树节点的对应关系。\n\
