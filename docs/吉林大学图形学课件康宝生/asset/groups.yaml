  - '[PAGE 160]


    当 $d_i < 0$ 时，$M$ 在直线的上方，取 $E$ 为下一个像素点；当 $d > 0$ 时，$M$ 在直线的下方，取 $NE$ 为下一个像素点；当
    $d = 0$ 时，两者都可以选，我们约定选 $E$。


    $d_i$ 的计算需要做 4 次加法和两次乘法。因此，为了有效地计算判定函数，我们需要建立关于 $d_i$ 的递推公式。显然，$d_i$ 的变化依赖于下一个像素点选的是
    $NE$ 还是 $E$。


    +   - 当 $d_i < 0$ 时，下一个像素点是 $E$，那么：

    +     $d_{i+1} = 2F(x_i + 2, y_i + 1/2) = 2a(x_i + 2) + 2b y_i + b + 2c = d_i
    + 2a$


    +   - 当 $d_i > 0$ 时，下一个像素点是 $NE$，则：'
  - '[PAGE 161]


    $d_{i+1}=2F(x_i+2,y_i+1+1/2)=2a(x_i+2)+2b(y_i+1)+b+2c$


    $=d_i+2a+2b$


    由此，得到计算判定函数 $d_i$ 的递推公式：


    $d_{i+1}=\begin{cases} d_i+2dy, & d_i\leq 0 \\ d_i+2dy-2dx, & d_i>0 \end{cases}$


    因为直线上的第一个像素点就是直线的起点 $(x_s,y_s)$，所以判定函数 $d_i$ 的初值为：


    $d_0=2a(x_s+1)+2by_s+b+2c=2dy-dx$'
  - '[PAGE 162]


    综上所述，满足条件的直线的 Bresnham 算法的步骤如下：


    Step 1. 初始化


    dx = xe - xs, dy = ye - ys, x = xs, y = ys, d = 2dy - dx;


    Step 2. 当 x < xe 时，执行下述操作：


    2.1 图像素点 (x, y);


    2.2 求下一个像素点：


    x = x + 1;


    if (d > 0) then y = y + 1;


    2.3 计算判定函数 d：


    if (d > 0) then d = d + 2dy - 2dx;


    else d = d + 2dy;


    Step 3. 算法结束。'
  - "[PAGE 163]\n\n# 程序 3.2.3 Bresenham 扫描转换算法\n\n```\nvoid line_BRES (int xs, int\
    \ ys, int xe, int ye, int Color)\n{ /* 设 0 ≤ m ≤ 1 */\n    int dx = xe - xs, dy\
    \ = ye - ys, x = xs, y = ys;\n    int twoDX = 2*dx, twoDY = 2*dy, d = 2*dy - dx;\n\
