    N(u₀, v₀) = ∂P(u, v)/∂u |_{u=u₀}^{v=v₀} × ∂P(u, v)/∂v |_{u=u₀}^{v=v₀}


    4. 角点 将参数 u, v = 0 或 1 代入曲面上的参数方程 P(u, v)，得到曲面的 4 个角点为：P(0, 0), P(0, 1), P(1,
