    \ x_c \\\\ y_c \\end{bmatrix}\n$$\n\n上式是计算圆的内接正多边形的递推公式。因为 $\\sin\\alpha$、$\\\
    cos\\alpha$ 只要在开始时计算一次。这样求一个顶点只需要做 4 次乘法。\n\n上式可用于高速绘图机绘图。用两个微处理器作管道式处理，前一个计算正多边形的顶点，后一个只生成直线。如果不考虑绘图机笔架运动的加速度的限制，绘制半径为\
    \ $R$ 的圆几乎和绘一条长为 $2\\pi R$ 的直线花同样的时间。该方法亦可用于椭圆内接多边形的计算。设椭圆的长短半轴分别为 $a$ 和 $b$，中心点坐标为\
    \ $C(x_c, y_c)$，对称轴平行坐标轴，则该椭圆的参数方程是：\n\n$$\nx - x_c = a \\cos\\theta, \\quad y\
    \ - y_c = b \\sin\\theta\n$$\n\n设椭圆的内接多边形的第 $i$ 个顶点为 $P_i(x_i, y_i)$，$CP_i$ 的幅角是\
    \ $\\theta_i$，其中：\n\n$$\nx_i - x_c = a \\cos\\theta_i, \\quad y_i - y_c = b \\\
    sin\\theta_i\n$$\n\n那么，第 $i+1$ 个顶点 $P_{i+1}(x_{i+1}, y_{i+1})$ 的坐标满足：\n\n$$\n\
    x_{i+1} - x_c = a \\cos(\\theta_i + \\alpha), \\quad y_{i+1} - y_c = b \\sin(\\\
    theta_i + \\alpha)\n$$\n\n由此，可得：\n\n$$\n\\begin{bmatrix} x_{i+1} - x_c \\\\ y_{i+1}\
    \ - y_c \\end{bmatrix} = \\mathbf{M} \\begin{bmatrix} x_i - x_c \\\\ y_i - y_c\
    \ \\end{bmatrix}\n$$\n\n$$\n\\mathbf{M} = \\begin{bmatrix} \\cos \\alpha & -\\\
    dfrac{a}{b}\\sin \\alpha \\\\ \\dfrac{b}{a}\\sin \\alpha & \\cos \\alpha \\end{bmatrix}\n\
    $$\n\n上式便是计算椭圆的内接多边形顶点的递推公式。如果对由此生成的椭圆作旋转 $\\beta$ 角度或缩放变换，则要分别用变换矩阵：\n\n$$\n\
    T_R = \\begin{bmatrix} \\cos\\beta & -\\sin\\beta \\\\ \\sin\\beta & \\cos\\beta\
    \ \\end{bmatrix}\n$$\n\n或\n\n$$\nT_S = \\begin{bmatrix} S_x & 0 \\\\ 0 & S_y \\\
    end{bmatrix}\n$$\n\n如果两个变换都做，则变换矩阵为这两个矩阵的乘积 $T = T_R \\cdot T_S$。这时，只要用 $TMT^{-1}$\
    \ 代替上式中的 $M$，便可得到变换后的椭圆的内接多边形的顶点坐标。事实上，上式可由圆的递推公式经过缩放变换求得。\n\n### 方法 2\n\n设圆的内接多边形的三个相邻顶点是\
    \ $P_{i-1}(x_{i-1}, y_{i-1})$、$P_i(x_i, y_i)$ 和 $P_{i+1}(x_{i+1}, y_{i+1})$，由于下图中的\
    \ $P_{i-1}B$ 平行 $CP_{i+1}$，$P_{i+1}B$ 平行 $CP_{i-1}$，所以：\n\n$$\n\\overrightarrow{CB}\
    \ = \\overrightarrow{CP}_{i-1} + \\overrightarrow{CP}_{i+1} = 2 \\cos\\alpha \\\
    overrightarrow{CP}_i\n$$\n\n即\n\n$$\n\\overrightarrow{CP}_{i+1} = 2 \\cos\\alpha\
    \ \\overrightarrow{CP}_i - \\overrightarrow{CP}_{i-1}\n$$\n\n表示成坐标分量形式，则有：\n\n\
    $$\n\\begin{bmatrix} x_{i+1} - x_c \\\\ y_{i+1} - y_c \\end{bmatrix} = 2 \\cos\\\
    alpha \\begin{bmatrix} x_i - x_c \\\\ y_i - y_c \\end{bmatrix} - \\begin{bmatrix}\
    \ x_{i-1} - x_c \\\\ y_{i-1} - y_c \\end{bmatrix}\n$$\n\n显然，这比方法 1 节省计算量，求一个顶点只要做二次乘法，但开始需要知道圆上相邻的两个内接多边形顶点。\n\
