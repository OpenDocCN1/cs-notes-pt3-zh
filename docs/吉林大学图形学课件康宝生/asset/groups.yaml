    # 3.4 多边形的扫描转换与区域填充


    在通用图形软件包中有一称为实心或图案填充的多边形区域的标准输出图元。也有其他种类的填充区域图元，但由于多边形有线性边界，所以它更容易处理。


    光栅图形系统中有两种基本区域填充方法：一种是通过确定横穿区域的扫描线的覆盖间隔来填充；另一种是从给定的位置开始填充直到指定的边界为止。扫描线方法一般主要用来填充多边形、圆以及其他简单曲线所围的区域。从内点开始的填充方法用在具有复杂形状边界的区域以及交互式填充系统中。'
  - '[PAGE 221]


    # 3. 4. 1 多边形的扫描转换


    # 1. 什么是多边形的扫描转换


    在计算机图形学中，多边形的表示有两种方法：顶点表示和点阵表示。顶点表示是用多边形的顶点序列来表示多边形。这种方法直观、几何意义强、占用内存少、易于进行几何变换。但由于它没有明确指出哪些像素点在多边形内，故不能直接用于面着色。


    点阵表示是用于多边形内的像素点的集合来刻画多边形。这种表示方法虽然失去了许多重要的几何信息，但便于运算。'
  - '[PAGE 222]


    用帧缓冲器表示图形，是面着色所需要的图形表示形式。


    光栅图形系统的基本问题之一就是把多边形的顶点表示转换为点阵表示，也就是从多边形的给定边界出发，求出位于其内部的各像素点，并给帧缓冲器内的各个对应元素设置相应的灰度和颜色，这一转换称为多边形的扫描转换。


    常用的多边形扫描转换算法有逐点判断算法、扫描线算法、边缘填充算法和边界标志算法。


    # 2. 逐点判断算法


    实现多边形扫描转换最简单的方法就是逐点判断，即逐个像素判断以确定它们是否在多边形内，从而给出位于多边形内'
  - '[PAGE 223]


    的像素之集合。如何确定一个点是否在多边形内呢？一般用累计交点的方法。若从一点发出的射线与多边形边界的交点数目为奇数，则该点位于多边形内，否则该点位于多边形外。


    设 $P = P_0 P_1 \cdots P_n P_0$ 为一给定的多边形，序列 $P_0 P_1 \cdots P_n P_0$ 是多边形的顶点表示。设
    inside$(P, x, y)$ 是验证点 $(x, y)$ 是否在多边形 $P$ 内的布尔函数。当从 $(x, y)$ 到 $(+\infty, y)$
    的射线与 $P$ 的交点个数是奇数时，该函数取值 1，否则取值 0。设 PolyColor 是多边形 $P$ 的颜色值，BkColor 为屏幕的背景色。


    运用以上的概念，逐点判断算法的程序框架如下：'
  - "[PAGE 224]\n\n```\nfor (y = Screen_ymin; y <= Screen_ymax; y++)\n    for (x =\
    \ Screen_xmin; x <= Screen_max; x++)\n        if (inside(P, x, y))\n         \
    \   DrwaPixel (x, y, PolyColor);\n        else\n            DrawPixel(x, y, BkColor);\n\
    ```\n\n逐点判断算法程序简单，但不可取，原因是速度太慢。这主要是由于该算法割断了各像素点之间的联系，孤立地考察各个像素与多边形 P 的内外关系，每次判断又要多次求交点。这样将需做大量的乘法运算，因此花费很多时间。"
