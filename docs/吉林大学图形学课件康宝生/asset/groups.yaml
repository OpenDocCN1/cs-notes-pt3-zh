    曲线也将变成无限长。这一点正符合分形曲线的特点。


    下面我们来分析 Dragon 曲线的生成规则：假如我们从线段 1 开始，顺着曲线前进，那么在这个过程中，每到一个线段末端拐角处，就必须向左或向右转 90°。于是待解决的关键问题就是如何确定是向左转还是向右转。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_764_0.png)


    T(1)= 90°; T(2)= 90°

    T(3)= -90°; T(4)= 90°

    T(5)= 90°; T(6)= -90°

    T(7)= -90°


    如果用代码 1 表示向左转 90°，用 3 表示向右转 90°。并且对于第 i 段线段，以 T(i) 来表示其转向代码。则对于上图有：


    T(1) = 1; T(2) = 1; T(3) = 3; T(4) = 1

    T(5) = 1; T(6) = 3; T(7) = 3


    ## Mandelbrot 集和 Julia 集


    Julia 集和 Mandelbrot 集是复动力系统：


    ```

    z_{n+1} = z_n^2 + c

    ```


    生成的典型的分形图形。


    固定迭代初值 z_0 = 0，对于不同的复数 c，上述迭代可能收敛也可能发散。根据迭代次数对复数 c 代表的平面点着不同的颜色，即可得到 Mandelbrot
    集。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_767_0.png)


    如果固定复数 $c$，那么对于不同的迭代初值 $z_0$，迭代过程


    $z_{n+1}=z_n^2 + c$


    也可能收敛也可能发散。根据迭代次数对迭代初值 $z_0$ 代表的平面点着不同的颜色，即可得到 Julia 集。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_768_0.png)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_768_1.png)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_769_0.png)


    c = 0.6+0.5i


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_769_1.png)


    c =0.37+0.27i


    ## 其他分形实例


    用分形可以构造很多自然界的形体，下面是几种常见的例子：


    - (1) 分枝


    Koch 曲线和 Dragon 曲线都是连续的，分枝结构是不连续的，它的生成单元类似于图例所示。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_770_0.png)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_770_1.png)


    ### （2）岩石


    这种分形由平面多边形（三角形、四边形等）用随机插值法迭代生成，可模拟山峦。如图所示：


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_772_0.png)


    以四边形为例：分割原始四边形为四个小四边形，此时时要求出每条边上的中点和四边形的中点共 5 个点。设每条边上的两端点为 P_{0i} (i = 1, 2)，中点为
    P_u，四边形的中心点为 P_v。则可给出计算方法为：


    ```

    $$P_u^n = \frac{P_{01}^{n-1} + P_{02}^{n-1}}{2} + t_r^n$$

    ```


    ```

    $$P_v^n = \frac{1}{4} \sum_{i=1}^{4} P_{ui}^{n-1} + t_r^n$$

    ```


    式中：n 为递归深度。t 为变位系数。r 为呈正态分布的随机数。P_{ui} 为前四条边的中点。

