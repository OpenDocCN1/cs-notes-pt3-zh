    \ & 1 \\\\\n\\end{bmatrix} \\begin{bmatrix}\n x \\\\\n y \\\\\n 1 \\\\\n\\end{bmatrix}\
    \ = \\begin{bmatrix}\n x + r_{12} y \\\\\n y \\\\\n 1 \\\\\n\\end{bmatrix}\n```\n\
    \n即： $x^* = x + r_{12}·y$； $y^* = y$。\n\n从以上结果可以看到：新图形各顶点的 $y$ 坐标没有变，而 $x$ 坐标是在原有的值上加一个有关\
    \ $y$ 正比例函数值的增量。所以使得整个图形在等高的前提下发生了倾斜。并且，当： $r_{12}>0$ 时，图形沿 $x$ 正向错切。 $r_{12}<0$\
    \ 时，图形沿 $x$ 负向错切。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_542_0.png)\n"
