    ## 4.7 NURBS 曲线


    B 样条技术在表示和设计自由型曲线形状时显示了强大的威力，然而在表示与设计初等二次曲线时却遇到了麻烦。因为 B 样条曲线不能精确地表示除抛物线外的二次曲线，只能给出近似表示。近似表示将带来处理上的麻烦，使本来简单的问题复杂化，还带来原来不存在的设计误差问题。为了精确表示二次曲线，就不得不采用另外一套数学描述方法，比如用隐式方程表示。这不仅又重新带来隐式方程表示所存在的问题，而且将导致一个几何设计系统采用并存的两种不同数学方法。


    两种不同数学方法的共存，将使系统变得十分庞杂，是系统研制人员最为忌讳的。解决这个问题的途径显然应该是改造现有的 B 样条技术，在保留它描述自由型曲线的长处的同时，扩充其精确表示二次曲线的能力。人们所寻求的这种数学方法就是有理
    B 样条技术，由于在形状描述实践中，它经常以非均匀类出现，所以习惯上称之为 NURBS 技术。1991 年，国际标准委员会 (ISO) 颁布的关于工业产品数据交换的
    STEP 国际标准，将 NURBS 作为定义工业产品几何形状的唯一数学方法。


    ### 4.7.1 NURBS 曲线的定义


    给定 n+1 (n ≥ k) 个空间点 d_i 和非负实数 ω_i , i = 0,1,…,n,

