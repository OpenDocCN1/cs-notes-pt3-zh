    | 5 | 6 | 8 |

    | 7 | 7 |  |



    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_193_0.png)'
  - '[PAGE 194]


    我们也可以对增量计算方法进一步拓展，由此改善画圆的中点算法效率。我们知道任一个多项式都可以按增量方式进行计算，这就是差分。差分的基本思想是计算函数在其相邻两个点上的值以及这两个值的差。


    对于中点画圆算法来说，在当前的迭代中，如果选择了E，则估计点从 (x_i, y_i) 变化到 (x_i + 1, y_i)。显然，在点 (x_i, y_i)
    处的一阶差分为 Δ_Eold = 2x_i + 3。因此在点 (x_i + 1, y_i) 处的一阶差分为 Δ_Enew = 2(x_i + 1) + 3，其二阶差分为
    Δ_Enew - Δ_Eold = 2。


    类似地，在点(x_i, y_i) 处，Δ_SEold = 2x_i - 2y_i + 5；点 (x_i +1, y_i) 处，'
  - '[PAGE 195]


    Δ_SEnew = 2(x_i +1) - 2y_i + 5，因此二阶差分为 Δ_Enew - Δ_Eold = 2。


    如果在当前的循环中选择了 SE，则估计点从 (x_i , y_i) 变化到 (x_i + 1, y_i - 1)。因此，在点 (x_i + 1, y_i -
    1) 处的一阶差分为 Δ_Enew = 2(x_i + 1) + 3，而二阶差分为 Δ_Enew - Δ_Eold = 2。


    同样，在点(x_i + 1, y_i - 1)处，Δ_SEnew = 2(x_i + 1) - 2(y_i - 1) + 5，而相应的阶差分 Δ_Enew
    - Δ_Eold = 4。


    于是，改进后的算法包括以下几个步骤：（1）根据上次循环所计算的判定函数 d 的值的符号选择一个像素；（2）运用上次循环所计算的相关 Δ_E 或 Δ_SE 对判定函数
    d 的值进行修改；'
  - "[PAGE 196]\n\n（3）根据像素的移动情况，用前面计算的差分常量修改 D_E 或 D_SE；（4）移动像素。D_E 或 D_SE 使用起始像素进行初始化。改进后的程序如程序\
    \ 3.3.4 所示。\n\n# 程序 3.3.4 基于二阶差分的中点圆扫描转换算法\n\n```\nvoid MidpointCircle (int radius,\
    \ int Color)\n{\n    int x, y, d, deltaE, deltaSE;\n    x = 0; y = radius; d =\
    \ 1 - radius; deltaE = 3; deltaSE = 5 - radius*2;\n    CirclePoints (0, 0, x,\
    \ y, Color);\n    while( x < y ) {\n        if (d < 0) {\n```"
  - "[PAGE 197]\n\n```\nd += deltaE; deltaE +=2; deltaSE += 2;\n}\nelse {\n    d +=\
    \ deltaSE; deltaE +=2; deltaSE += 4; y--;\n}\n x ++;\n CirclePoints(0, 0, x, y,\
    \ Color);\n}\n}\n```\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_197_0.png)"
