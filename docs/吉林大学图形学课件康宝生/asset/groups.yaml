  - '[PAGE 507]


    每一内节点的权重≤k），都可选。这样的节点矢量定义了一般非均匀 B 样条基函数，对应的 B 样条曲线称为一般非均匀B样条曲线。由此可见，前三种类型的 B 样条曲线都可作为特例包括在一般非均匀
    B 样条曲线之中。


    关于 B 样条曲线类型的划分是由 ISO STEP 标准规定的。STEP 标准只所以把 B 样条曲线依照上述四种类型处理，而不仅支持统一的一种类型，其原因在于对特殊的类型算法会更简单一些。'
  - '[PAGE 508]


    # 4.6.8 B 样条曲线与 Bézier 曲线的比较


    B 样条曲线与 Bézier 曲线相比较，其差别如下：


    +   对于 Bézier 曲线，基函数的次数等于控制顶点数减 1；对于 B 样条曲线，基函数的次数与控制顶点数无关。


    +   Bézier 曲线的基函数即 Bernstein 基函数是多项式函数，B 样条曲线的基函数即 B 样条基函数则是多项式样条。


    +   Bézier 曲线是一种特殊表示形式的参数多项式曲线，B 样条曲线则是一种特殊表示形式的参数样条曲线。


    +   Bézier 曲线缺少局部性质，B 样条曲线具有局部性质。'
  - '[PAGE 509]


    # 4.7 NURBS 曲线


    B 样条技术在表示和设计自由型曲线形状时显示了强大的威力，然而在表示与设计初等二次曲线时却遇到了麻烦。因为 B 样条曲线不能精确地表示除抛物线外的二次曲线，只能给出近似表示。近似表示将带来处理上的麻烦，使本来简单的问题复杂化，还带来原来不存在的设计误差问题。为了精确表示二次曲线，就不得不采用另外一套数学描述方法，比如用隐式方程表示。这不仅又重新带来隐式方程表示所存在的问题，而且将导致一个几何设计系统采用并存的两种不同数学方法。'
  - '[PAGE 510]


    两种不同数学方法的共存，将使系统变得十分庞杂，是系统研制人员最为忌讳的。解决这个问题的途径显然应该是改造现有的 B 样条技术，在保留它描述自由型曲线的长处的同时，扩充其精确表示二次曲线的能力。人们所寻求的这种数学方法就是有理
    B 样条技术，由于在形状描述实践中，它经常以非均匀类出现，所以习惯上称之为 NURBS 技术。1991 年，国际标准委员会 (ISO) 颁布的关于工业产品数据交换的
    STEP 国际标准，将 NURBS 作为定义工业产品几何形状的唯一数学方法。'
  - '[PAGE 511]


    # 4. 7. 1 NURBS 曲线的定义


    给定 n+1 (n ≥ k) 个空间点 d_i 和非负实数 ω_i , i = 0,1,…,n,

    其中 ω_0 > 0, ω_n > 0, 下列分段有理参数多项式曲线：


    \[ R(u) = \frac{\sum_{i=0}^n \omega_i d_i N_{ik}(u)}{\sum_{i=0}^n \omega_i N_{ik}(u)},
    u \in [u_{k-1}, u_{n+1}] \]


    称为 k 阶 NURBS 曲线。 d_i 叫做控制顶点， ω_i 称为与控制顶点相关的权因子，折线 d_0 d_1 ⋯ d_n 称为 R(u) 的控制多边形，
    N_{ik}(u) 为节点向量 U = {u_0, u_1, ⋯, u_{n+k}} 的 k 阶 B 样条基函数。'
  - '[PAGE 512]


    # 4.7.2 NURBS 曲线的性质


