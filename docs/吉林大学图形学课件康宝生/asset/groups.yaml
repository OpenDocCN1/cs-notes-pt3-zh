    \ l=1,2\\cdots,m \\end{cases}, j=l,l+1,\\cdots,m;\\ i=0,1,\\cdots,n\n\n根据上述递推关系可设计实现\
    \ Bézier 曲面的离散算法。递归对Bézier曲面进行离散，可得到一个收敛于原曲面的控制多体序列，用此可实现 Bézier 曲面的多面体逼近。\n\n\
    ## 7.4.2 三边 Bézier 曲面\n\n与上一节定义在矩形域上的 Bézier 曲面片不同，本节介绍的三边 Bézier 曲面片式定义在三边形域上的，如图所示。为便于区分，把定义在矩形域上的\
    \ Bézier 曲面片称为四边 Bézier 曲面片。三边曲面片能较好地适应不规则与散乱数据的几何造型及适合有限元分析中三边元素的需要。\n\n### 1.\
    \ 三角域内点的表示\n\n三角域内一点可以用面积坐标（或重心坐标）来表示，如下图所示。G 是三角形 ABC 内的任意一点。令三角形 ABC 的面积为 s，三角形\
    \ GBC 的面积为 s_u，三角形 GCA 的面积为 s_v，三角形 GAB 的面积为 s_w，则：\n\nu = s_u / s, v = s_v /\
    \ s, w = s_w / s\n\n这里所指的三角形面积是有向面积，按顶点字母顺序，逆时针为正，顺时针为负。若 A = [a_x, a_y],\n\n\
    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_672_0.png)\n\n三角形内一点的面积坐标\n\nB = [b_x,\
    \ b_y], C = [c_x, c_y]，则：\n\ns = 1/2 | a_x  b_x  c_x |\n          | a_y  b_y \
    \ c_y |\n          | 1    1    1 |\n\n(u, v, w) 即为 G 关于三角形 ABC 的面积坐标，三个坐标分量 u,\
    \ v, w 中只有两个是独立的，因为 u + v + w = 1。ABC 称为域三角形，或称为三角域。\n\n### 2. 三角域上的 Bernstein\
    \ 基\n\n单变量的 n 次 Bernstein 基 B_{i n}(t)(i = 0, 1, ⋯ , n) 由\n\n[t + (1−t)]ⁿ\n\n\
    的二项式展开各项组成。双变量张量积的 Bernstein 基由两个单变量的 Bernstein 基各取其一的乘积组成。而定义在三角域上的双变量 n 次 Bernstein\
    \ 基由 (u + v + w)ⁿ 的展开式的各项组成。由于\n\n(u + v + w)ⁿ = Σ Bᵢ,ⱼ,ₖⁿ (u, v, w)\n i+j+k=n\n\
    \ i,j,k≥0\n\n所以，定义在三角域上的双变量 n 次 Bernstein 基函数为：\n\nBᵢ,ⱼ,ₖⁿ (u, v, w) = n! / (i!\
    \ j! k!) uⁱ vʲ wᵏ , u, v, w ∈ [0,1]\n\n可见，三角域上 $n$ 次 Bernstein 基共包含了 $(n+1)(n+2)/2$\
    \ 个基函数，可以用一个三角阵来排列这些基函数。例如 $n=2$ 时如左图所示，其位于同一条线上的那些基函数实际上是单变量的。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_675_0.png)\n\
    \n三角域按 Bernstein 基的三角阵列相应划分成子三角域，其\n\n中诸直线交点同样地称为节点。节点与基函数一一对应。每个节点也由三个下标确定，如下图所示，它们分别与三参数\
    \ u, v, w 相联系。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_676_0.png)\n\n三角域上\
    \ Bernstein 基同样具有权性、非负性与递推性。\n\n其递推关系为：\n\nB_{i,j,k}^n(u,v,w)=uB_{i-1,j,k}^{n-1}(u,v,w)+vB_{i,j-1,k}^{n-1}(u,v,w)+wB_{i,j,k-1}^{n-1}(u,v,w)\n\
    \n### 3. 三边 Bézier 曲面片的方程\n\n要是一个基函数联系一个控制顶点，一张 n 次三边 Bézier 曲面片必须由构成三角阵列的 (n\
    \ + 1)(n + 2)/2 控制顶点 T_{i,j,k} (i + j + k = n, i, j, k ≥ 0) 定义。由此，可以写出曲面片的方程：\n\
    \nP(u,v,w)= Σ_{i+j+k=n \\ i,j,k≥0} T_{i,j,k} B_{i,j,k}^n(u,v,w),  u,v,w∈[0,1]\n\
    \n按下标顺序用直线连接控制顶点，就形成了曲面的控制网格，\n\n它由三角形组成，网格顶点与三角域的节点一一对应。下图给出了三次三边 Bézier 曲面的实例。\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_678_0.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_678_1.png)\n\
    \nuv 平面\n\n三边 Bézier 曲面\n\n当固定三参数之一时，将得到曲面片上一条等参数线。例如，当 w 固定，让 u 独立地变化，则得到一条 u\
    \ 线；若让 v 独立地变化，则得到 v 线，两者实际上是同一条曲线。因此，曲面片上有三族等参数线。\n\n当三参数之一为零时，则得到曲面片的一条边界线，它由相应那排边界顶点定义，就是一般所指的一条\
    \ n 次 Bézier 曲线。当三参数之一为 1 时，则得到三边曲面片的一个角点，就是控制网格三角顶点之一。可见，三边 Bézier 曲面与四边 Bézier\
    \ 曲面片具有类似的性质，差别在于：\n\n- （1）定义域不同；\n- （2）控制网格不同，后者由呈矩形震裂的控制顶点构成；\n- （3）同样是两个独立参数，但最高次数不同。后者两个参数的最高次数是互相独立的，可以不同。而三边\
    \ Bézier 曲面片的三个参数的最高次数都是相同的；\n- （4）四边 Bézier 曲面片是张量积的，三边 Bézier 曲面片是非张量积的，这是本质差别。\n\
    \n### 4. 三边 Bézier 曲面片与四边 Bézier 曲面片的转换\n\n由于三边 Bézier 曲面与四边 Bézier 曲面有不同的基函数和定义方法，当在同一个系统中使用这两种类型的曲面片时，会带来不相容的问题。下面我们给出这两种曲面片的转换方法。\n"
