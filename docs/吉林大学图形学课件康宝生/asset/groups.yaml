    是实体 Q 的边的集合，V(Q) 是实体 Q 顶点的集合，∂Q 表示 Q 的外壳，则：


    $$\partial Q = \bigcup_{i=1}^{m} f_i, \quad \bigcup_{i=1}^{m} E(f_i) = E(Q), \quad
    \bigcup_{i=1}^{m} V(f_i) = V(Q)$$


    ### 8.1.2 三维实体建模


    三维实体在计算机中建模时，常采用三种模型：线框模型、表面模型、实体模型。


    ### 1. 线框模型（wireframe model）


    线框模型是用顶点和棱边来表示实体的模型。为了确切地表示清楚形体的形状和位置，必须给出顶点集的位置和它们之间的连边规则。


    线框模型结构简单，它是表面模型和实体模型的基础。但用线框模型表示曲面体比较困难，也不能形成明暗和色彩，不能进行立体的物性计算等，而且也会产生二义性，如下图所示。


    实体的线框表示


    ### 2. 表面模型（surface model）


    表面模型是用有向棱边围成的部分来定义形体的表面，再用面的集合来定义形体。


    表面模型是在线框模型的基础上，通过增加面边信息，可以满足面面求交计算和工程分析等需要。但它在特性、棱边的连接线、形成明暗色彩方面仍有困难（如有限元分析）。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_719_0.png)


    ### 3. 实体模型（solid model）


    实体模型即是指实心的立体模型，其主要的几何特征表现为体，它可以更完整准确地表达模型的几何特征，包含的信息也更多。利用实体模型可以计算、分析物体的质量、体积、重心和惯性矩等物理特性，因此它是计算机辅助设计的重要基础。


    实体模型是在表面模型的基础上，再进一步定义实体存在于面的哪一侧而建立的。一般可用三种方法来定义：


    - （1）给出实体存在侧的一点；


    - （2）用表面的外法矢直接指明；


    - （3）用面环方向表示（隐含了法矢）。实体即定义为各面负方向一侧的交集。


    尽管实体模型与前面所说的线框模型、表面模型截然不同，但是在图形显示时，实体模型也是以线框图来表示的，除非对它进行了消隐（Hide）、阴影（Shade）或渲染（Render）处理。


    ### 4. 三种不同模型的简单比较


    | 线框模型 | 表面模型 | 实体模型 |

    | --- | --- | --- |

    | 结构简单<br>处理容易<br>存储量小<br>图形有二义性 | 可生成彩色图像<br>计算面积、体积<br>进行数控加工<br>不能生成实体 | 可进行物性计算<br>工程分析<br>数控加工<br>布尔运算造型
    |

    | 存储量比：1 | 10 | 100 |

    | 市场占有比：5 | 3 | 2 |


    ### 8.1.3 实体的表示方法


    实体的生成和表示方法很多，目前常用的实体表示方法有以下七种：


    - ① 参数化实体及其调用；

    - ② 单元分解法；

    - ③ 扫描变换法（把一维、二维实体经过平移或旋转等变换生成二维、三维实体）；

    - ④ 构造实体几何（CSG法）；

    - ⑤ 边界表示法（B-rep法）；

    - ⑥ 半空间法；

    - ⑦ 线框表示法。


    实体的任何一种表示法都需要回答以下问题：


    - 实体的边界是否提供了足够的信息，能否自动地计算实体的几何性质，包括显示、绘图等所需要的信息。

    - 一个系统或算法如何确定它们操作的数据的有效性。

    - 对一个实体是否有一种以上的表示方法？

    - 相同的实体是否有不同的表示形式？如有，又如何表示之？

    - 实体的某些几何性质是否只能从一种表示形式中求得，而不能从其他的表示形式中求得？

    - 实体是否有最佳表示形式？


    就当代几何造型系统实际应用而言，实体的上述七种表示方法中以 CSG、B-rep 和单元分解法最为重要，我们这里重点就这三种实体表示方法予以讨论。


