    \ P_color 的颜色。而对多边形外的像素点都做了偶数次求余运算，并着上了值为 B_color 的颜色（下图所示）。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_248_0.png)\n\
    \n这样，当对每一条扫描线都实施了以上两步后，则只有着上值为 P_color 的颜色的像素点才在多边形 P 内，其余像素点均在多边形 P 之外。从而完成了多边形的扫描转换。\n\
    \n实际上，Step 2 中的向右求余运算也可以逐边进行，即对多边形 P 的每一条非水平边 P_i P_{i+1} (i = 0, 1, ..., n) 上的各像素点做向右求余。这种多边形的扫描转换方法称为边缘填充算法。\n\
    \n利用多边形的边的连贯性和奇点处理方法，边缘填充算法有以下形式：\n\nStep 1. 初始化。将帧缓冲器的各元素的颜色值一律置为 B_color:\n\n\
    ```\nfor ( y = ymin + 1; y <= ymax; y++ ) {\n    xleft = xleft + dx;\n    for\
    \ ( x = (int)(x + 0.5); x <= Screen_xmax; x++ )\n        framebuffer (x, y) =\
    \ A - framebuffer (x, y);\n}\n}\n```\n\n该算法之所以称为边缘填充算法，是因为它一边画多边形的边界，一边做向右求余运算。当边界画完后，多边形的扫描转换也随之完成。\n\
    \n和扫描线算法相比, 边缘填充算法的数据结构和程序结构都简单的多，其原因是它用求余运算代替了排序。该算法执行时需对帧缓冲器中的大批元素反复赋值，故其速度并不比扫描线算法快。\n\
    \n## 5. 边界标志算法\n\n虽然边缘填充算法的程序和数据结构都较简单，但由于涉及到对帧缓冲器中大量元素的多次赋值而影响了算法的运行效率。为了使这部分的工作量得以减轻，可先画边界后填色。这样可使对帧缓冲器中的每个元素的赋值次数不超过二次。实现这一思想的算法称为边界标志算法。边界标志算法的基本思想是：先用一种特殊的颜色在帧缓冲器中将多边形的边界(水平边边界除外)勾画出来，然后再采用类似扫描线算法的方法将位于多边形内的各区段着上所需颜色，具体步骤如下：\n\
    \n### Step 1. 以值为 B_color 的特殊颜色画多边形的边界。设多边形 P 的顶点为 P_i = (x_i, y_i), i = 0, 1,\
    \ ..., n +1，其中，x_i, y_i 均为整数。令 P_{n+1} = P_0，由于着上这种特殊颜色的点是扫描线与多边形 P 的边界的交点，故每一条扫描线上着这种特殊颜色的点的数目必定为偶数。程序结构如下：\n\
    \n```\nfor ( i = 0; i <= n; i++ ) { dy = y_{i+1} - y_i;\n    if (dy != 0) { dx\
    \ = (x_{i+1} - x_i)/dy;\n    if (dy > 0) {x = x_i; }\n```\n\n```\nelse { x = x_i\
    \ +1; }\n\nymin = min(y_i, y_{i+1}); ymax = max(y_i, y_{i+1});\nfor (y = ymin\
    \ + 1; y <= ymax; y++) {\n    x = x + dx; DrawPixel(x, y, B_color);}\n}\n```\n\
    \nStep 2. 逐条对多边形着色。为此，先将位于当前扫描线上的值为特殊颜色 B_color 的像素点依 x 坐标递增的顺序两两依次配对，再将每一对像素点构成的扫描线段内的所有像素点置上值为\
    \ P_color 的颜色。为了确定当前扫描线上像素点 (x, y) 原有的颜色值，需调用底层函数：\n\n### GetPixel(x, y)\n\n又设\
    \ interior_Point 为布尔变量，在搜索过程中，如果当前像素点位于多边形 P 内，则 interior_Point = 1，需着上值为 P_color\
    \ 的颜色。否则，该像素点在多边形 P 外，需着上值为 B_color 的颜色。这一步的程序框架如下：\n\n```\nfor (y = Screen_ymin;\
    \ y <= Screen_ymax; y++) {\n    interior_Point =0;\n    for (x = Screen_xmin;\
    \ x <= Screen_xmax; x++) {\n        if (GetPixel (x, y) === B_color) interior_Point\
    \ = ! interior_Point;\n        if (interior_Point) DrawPixel (x, y, P_color);\n\
    \    }\n}\n```\n\n```\nelse DrawPixel (x, y, B_color);\n}\n}\n```\n\n当以上两步执行完毕后，多边形\
    \ P 内的像素点都着上了值为 P_color 的颜色，其余像素点则无一着上这种颜色，扫描转换即完成。\n\n较之边缘填充算法，本算法避免了对帧缓冲器中大量元素的多次赋值。但需逐条扫描线对帧缓冲器中的元素进行搜索和比较。用软件实现本算法，其速度与扫描线算法相当。本算法适合于固化，固化后的速度则有很大的提高。\n\
    \n## 3.4.2 区域填充\n\n前述的多边形扫描转换问题，其实质是一种区域填充方法，它是通过确定横越区域的扫描线的覆盖区间来填充。由于其工作原理是基于扫描线和区域边界的相交性计算，因此主要用来填充多边形区域和圆、椭圆及其他简单曲线围成的区域。区域填充的另一种方法是从区域的一个内点开始，由内向外绘点直到区域边界。这种填充方法主要用于具有复杂形状边界的区域填充以及交互式涂描系统中。\n\
    \n### 1. 区域的表示和类型\n\n基于内点扩展的区域填充算法，对待填充的区域有一定的要求，即区域为已表示成点阵形式的像素集合。在光栅图形中，区域有两种表示形式：\n\
    \n内点表示 所给区域的所有像素点具有单一颜色(称为原色)，而边界上的像素点则不具有该种颜色。\n\n边界表示 所给区域的边界上的所有像素点具有单一颜色(称为边界色)，而区域内部的所有像素点不具有该种颜色。\n\
    \n此外，区域填充算法中的区域要具备一定的连通性：4-连通和 8-连通。4-连通区域是指从区域内一点出发，通过上、下左、右四种运动可到达区域内的每一像素点。而\
    \ 8-连通区域则是指从区域内一点出发，通过上、下、左、右以及对角线方向的 8 种运动可到达区域内的每一像素点。需要值得指出的是，4-连通区域可看作是 8-连通区域，但是两者的边界不尽相同。原因是4-连通区域的边界是\
    \ 8-连通区域，而 8-连通区域的边界则为 4-连通区域。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_259_0.png)\n\
    \n用于 8-连通区域的填充算法可以用于 4-连通区域，但用于 4-连通区域的填充算法则不能用于 8-连通区域。\n\n常用的区域填充算法有：边界填充算法、泛填充算法和扫描线填充算法。\n\
    \n### 2. 边界填充算法\n\n设 G 为边界表示的区域, (x, y) 是 G 内一点，称为种子点。 B_Color 是 G 的边界色，填充色为 F_Color。那么，边界填充算法的原理是，先将种子点\
    \ (x, y) 的颜色置为 F_Color，然后，使用 4-连通方法或 8-连通方法检测相邻位置的像素点颜色以确定它们是否为边界色或填充色。若不是边界色和填充色，就置以填\n"
