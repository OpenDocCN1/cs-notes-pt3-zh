    \n多边形 P 的顶点可分为两类：极值点和非极值点。如果\n\n(y_{i-1} - y_i)(y_{i+1} - y_i) < 0\n\n则称顶点 P_i(x_i,\
    \ y_i) 为 P 的非极值点，否则称为 P 的极值点。\n\n为了在算法中统一处理多边形三种形式的连贯性，使每一条扫描线与 P 的边界的交点个数保持为偶数，规定当奇点为\
    \ P 的极值点时，该点按两个交点计算，否则按一个交点计算。\n\n### ⑤ 扫描线算法的数据结构\n\n为了实现多边形 P 的扫描转换，首先对多边形 P\
    \ 的顶点的纵坐标由大到小排序，得到一递减序列：\n\ny_{i_0}, y_{i_1}, …, y_{i_n}\n\n取 d = y_{i_n}，容易求得扫描线\
    \ y = d 上的交点序列：\n\nx_{d j_1}, x_{d j_2}, …, x_{d j_h}\n\n这一序列由位于扫描线 y = d 上的多边形\
    \ P 的顶点组成。\n\n由上述序列开始即可根据多边形的边的连贯性和扫描线的连贯性，按从下到上的顺序求得各扫描线的交点序列，并确定各扫描线上位于多边形 P\
    \ 内的区段，最后将多边形 P 表示成点阵形式。此算法就是对多边形作扫描转换的扫描线算法。\n\n为实现上述思想，算法中采用较灵活的数据结构。它由边的分类表\
    \ ET(Edge Table) 和边的活化链表 AEL(Active Edge List) 两部分组成，这是为了利用区域、扫描线和边的三种形式的连贯性而将多边形的有关信息联系组织在一起的一种特定的数据结构。\n\
    \n边的分类表 ET 和边的活化链表 AEL 中的基本元素为多边形的边。边结点的结构如下：\n\n| x | Δx | ymax | next |\n|---|---|---|---|\n\
    \n其中：\n\n- ymax：边的上端点 y 坐标；\n- x：边的下端点 x 坐标。在 AEL 中表示边与扫描线的交点 x 坐标；\n- Δx：边的斜率的倒数；\n\
    - next：指向下一条边的指针。\n\n边的分类表 ET 是按边的下端点纵坐标 y 对非水平边进行分类的指针数组（Y 桶分类）。下端点的纵坐标 y 值等于\
    \ i 的边归入第 i 类，有多少条扫描线，就设多少类。同一类中，各边按 x 值（x 值相等时，按 Δx 值）递增的顺序排列成行。\n\n例如，对于多边形\
    \ P = [P_1...P_6P_1] = [(2, 2), (5, 1), (11, 3), (11, 8), (5, 5), (2, 7), (2,\
    \ 2)]，其对应的边的分类表 ET 如下图所示。这里已对非极值点 P_1、P_3 做了预处理，即对边 P_6P_1、P_3P_4 而言，下顶点的 y 坐标分别为\
    \ 3 和 4。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_238_0.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_239_0.png)\n\
    \n边的活化链表 AEL 是由与当前扫描线相交的所有多边形的边组成的一个链表。它记录了多边形沿扫描线的交点序列，并且根据边的连贯性（式 (3.4.5)）不断地刷新交点序列。例如，对所给的多边形，对应于不同扫描线，其\
    \ AEL 分别如下：\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_240_0.png)\n\n扫描线 y =\
    \ 6 时 AEL 的状态：\n\nAEL：P6P1 P5P6 P4P5 P3P4\n\n扫描线 y = 7 时 AEL 的状态：\n\nAEL：P6P1\
    \ P5P6 P4P5 P3P4\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_241_0.png)\n\n###\
    \ ⑥ 算法步骤\n\n一旦建立了多边形的分类表 ET，扫描线算法的实现步骤如下：\n\n- Step 1.（扫描线初始化）取扫描线纵坐标 y 的初始值为\
    \ ET 中非空元素的最小序号（对上述的多边形，y = 1）；\n- Step 2.（AEL 初始化）将边的活化链表 AEL 置为空表；\n- Step 3.\
    \ 按从下到上的顺序对纵坐标值为 y 的扫描线执行以下操作，直到边的分类表 ET 和边的活化链表 AEL 为空表为止。\n  - 3.1 若边的分类表 ET\
    \ 中第 y 类元素非空，则将属于该类的所有边从 ET 中取出并插入到边的活化链表 AEL 中。AEL 中的各边按照 x 值（当 x 值相等时，按 Δx 值）递增的顺序排序；\n\
    \  - 3.2 若相对于当前扫描线，边的活化链表 AEL 非空，则将 AEL 中的边两两配对，即第 1、2 边为一对，第 3、4 边为一对，依次类推。每一对边与当前扫描线的交点所构成的区间位于多边形内。依次对这些区间上的像素点按多边形颜色着色；\n\
    \  - 3.3 将边的活化链表 AEL 中满足条件 y = ymax 的边删去；\n  - 3.4 将边的活化链表 AEL 中剩余的每一条边的 x 域累加\
    \ Δx。\n"
  mdcn: "\n## 3. 扫描线算法\n\n扫描线算法是多边形扫描转换的最常用的算法。与逐点判断算法相比，扫描线算法充分利用了相邻像素之间的连贯性，避免了对像素的逐点判断和反复求交的运算，达到了减少计算量和提高速度的目的。\n\
    \n相邻像素之间的连贯性有三种形式：区域的连贯性、扫描线的连贯性和边的连贯性。\n\n### ① 区域的连贯性\n\n设多边形 P 的顶点 P_i = (x_i,\
    \ y_i)，i = 0, 1, …, n，其纵坐标 y 的递减序列如下：\n\ny_{i_0}, y_{i_1}, ..., y_{i_n}　(3.4.1)\n\
    \n即：\n\ny_{i_k} ≥ y_{i_{k+1}}, 0 ≤ k ≤ n-1　(3.4.2)\n\n这样，当 y_{i_k} > y_{i_{k+1}}（0\
    \ ≤ k ≤ n-1）时，屏幕上位于扫描线 y = y_{i_k} 和 y = y_{i_{k+1}} 之间的长方形区域（简记为 {y_{i_k}, y_{i_{k+1}}}）被多边形\
    \ P 的边分割成若干个梯形（三角形看作一底边长为 0 的梯形），它们具有以下性质：\n\n- 梯形的两底边分别在 y = y_{i_k} 和 y = y_{i_{k+1}}\
    \ 两条扫描线上，腰在多边形 P 的边上或在屏幕的边界上。\n- 这些梯形可分为两类：一类位于多边形 P 的内部，另一类位于多边形 P 的外部。\n- 两类梯形在长方形区域\
    \ {y_{i_k}, y_{i_{k+1}}} 内相间排列，即相邻的两个梯形必有一个在 P 内，另一个在 P 外。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_227_0.png)\n\
    \n根据这些性质，实际上只要知道该长方形区域内任一梯形内一点和多边形 P 的内外关系，即可确定长方形区域内所有梯形和 P 的内外关系。\n\n### ② 扫描线的连贯性\n\
    \n设 e 为整数，且 y_{i_0} ≥ e ≥ y_{i_n}，若扫描线 y = e 与多边形 P 的边 P_{i-1}P_i 相交，其交点横坐标记为\
    \ x_{e i}。现设\n\nx_{e i_1}, x_{e i_2}, …, x_{e i_l}　(3.4.3)\n\n是扫描线 y = e 与 P 的边界各交点横坐标的递增序列，称为交点序列。那么，由区域的连贯性可知，交点序列具有下列性质：\n\
    \n- l 是偶数；\n- 在该扫描线上，只有区间 (x_{e i_k}, x_{e i_{k+1}})，k = 1, 3, ⋯, l - 1，位于多边形\
    \ P 内，而其余区间在多边形 P 外。\n\n上述性质称为扫描线的连贯性，它是多边形区域连贯性在一条扫描线上的反映。\n\n### ③ 边的连贯性\n\n\
    设 d = e - 1 满足条件 y_{i_0} ≥ d ≥ y_{i_n}，且位于扫描线 y = d 上的交点序列为：\n\nx_{d i_1}, x_{d\
    \ i_2}, ⋯, x_{d i_h}　(3.4.4)\n\n现考察交点序列 (3.4.4) 和 (3.4.3) 之间的关系。若多边形 P 的边 P_{r-1}P_r\
    \ 与扫描线 y = e、y = d 都相交，那么序列 (3.4.3) 和 (3.4.4) 中对应元素 x_{e r}、x_{d r} 满足下列关系：\n\n\
    x_{e r} = x_{d r} + 1/m_r　(3.4.5)\n\n其中，m_r 为边 P_{r-1}P_r 之斜率。\n\n于是，可利用序列 (3.4.4)\
    \ 计算序列 (3.4.3)，即先运用关系式 (3.4.5) 求得同扫描线 y = e 和 y = d 都相交的所有边上的交点，再求与扫描线 y = d 不相交但与下一条扫描线\
