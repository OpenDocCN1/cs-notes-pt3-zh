    +   - 参数法 这是由于曲线的质量要求决定的。'
  - '[PAGE 395]


    # 4.2 参数曲线


    曲线、曲面可以用显式、隐式和参数表示。由于参数表示的曲线、曲面具有几何不变性等优点，计算机图形学中常用参数形式描述曲线、曲面。本节讨论有关参数曲线表示的基础知识。


    # 4.2.1 曲线的表示


    曲线和曲面的表示方程有参数表示和非参数表示之分，非参数表示又分为显式表示和隐式表示。


    平面曲线的显式表示一般形式为：'
  - '[PAGE 396]


    y = f(x)


    # 显式表示的缺点：


    +   - 不能表示封闭或多值曲线：

    +   - 与坐标系的选取相关；

    +   - 会出现斜率为无穷大的情形，不便于编程。


    平面曲线的隐式表示一般形式为：


    F(x, y) = 0


    # 隐式表示的优点：


    +   - 可表示封闭或多值曲线：

    +   - 便于点和曲线的位置判断。'
  - '[PAGE 397]


    # 隐式表示的缺点：


    +   - 求值困难；

    +   - 与坐标系的选取相关；

    +   - 会出现斜率为无穷大的情形，不便于编程。


    平面曲线的参数表示。假定用 $t$ 表示参数，则平面曲线上任一点 $P$ 可表示为：


    ```

    $P(t) = [x(t), y(t)]$

    ```


    空间曲线上任一点 $P$ 可表示为：


    ```

    $P(t) = [x(t), y(t), z(t)]$

    ```


    在曲线、曲面的表示上，参数表示比显式、隐式表示有更'
  - '[PAGE 398]


    多的优越性，主要表现在以下七个方面：


    +   1. 可以满足几何不变性的要求。

    +   2. 有更大的自由度来控制曲线曲面的形状，例如一条平面三次曲线的显示表示为：


    $y=ax^3+bx^2+cx+d$


    只有4个系数控制此曲线的形状；而平面三次曲线的参数表达式则为：


    $P(t)=\begin{bmatrix}a_1t^3+a_2t^2+a_3t+a_4\\b_1t^3+b_2t^2+b_3t+b_4\end{bmatrix},\
    t\in[0,1]$'
