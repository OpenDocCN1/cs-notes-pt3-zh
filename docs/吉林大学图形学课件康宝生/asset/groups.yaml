  - '[PAGE 766]


    # Mandelbrot 集和 Julia 集


    Julia 集和 Mandelbrot 集是复动力系统：


    ```

    z_{n+1} = z_n^2 + c

    ```


    生成的典型的分形图形。


    固定迭代初值 z_0 = 0，对于不同的复数 c，上述迭代可能收敛也可能发散。根据迭代次数对复数 c 代表的平面点着不同的颜色，即可得到 Mandelbrot
    集。'
