    \ Vanishing Point)，主灭点最多有三个。按主灭点数目的多少，透视投影分为一点透视、两点透视和三点透视。\n\n+   • 一 点透视 投影平面只和一个坐标轴相交，即投影平面与坐标面平行。所生成的物体投影图真实感较差。\n\
    +   \n+   • 两 点透视 投影平面和二个坐标轴相交，即投影平面与一个坐标轴平行。所生成的物体投影图具有较好的真实性，比较容易构造。常用于建筑工程、工业设计和广告"
