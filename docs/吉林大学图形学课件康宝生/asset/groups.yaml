    \ PQR，这样就最终产生四个小三角形：△PQR，△APR，△PBQ 和 △RQC。在这四个小三角形中，只在其中三个位于顶点处的小三角形（即 △APR，△PBQ\
    \ 和 △RQC）中再次连接其三条边的中点形成新的三角形。以后每次分割连线均按这个规则进行，直至达到一定深度。从程序设计的角度来看，可以利用递归调用来编程绘图，这样程序工作量小，且程序清晰。绘制海绵图案的程序如程序\
    \ 3.1.3 所示。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_116_0.png)\n\n### 程序 3.1.3\
    \ 绘制海绵图案\n\n```\n#include<graphics.h>\n#include<stdio.h>\nvoid tria(xa,ya,xb,yb,xc,yc,n)\n\
    int xa,ya,xb,yb,xc,yc,n;\n{int xp,yp,xq,yq,xr,yr;\nif(n>0){\nxp=(xa+xb)/2;yp=(ya+yb)/2;\n\
    xq=(xb+xc)/2;yq=(yb+yc)/2;\nxr=(xc+xa)/2;yr=(yc+ya)/2;\nmoveto(xp,yp);lineto(xq,yq);\n\
    lineto(xr,yr);lineto(xp,yp);\ntria(xa,ya,xp,yp,xr,yr,n-1);\ntria(xb,yb,xq,yq,xp,yp,n-1);\n\
    tria(xc,yc,xr,yr,xq,yq,n-1);\n}\n}\nmain(){\nint n,xa,ya,xb,yb,xc,yc;\nint gdriver=DETECT,gmode;\n\
    printf(\"input three vertex coordinate:\\n\");\nprintf(\"xa=\"); scanf(\"%d\"\
    ,&xa);\nprintf(\"ya=\"); scanf(\"%d\",&ya);\nprintf(\"xb=\"); scanf(\"%d\",&xb);\n\
    printf(\"yb=\"); scanf(\"%d\",&yb);\nprintf(\"xc=\"); scanf(\"%d\",&xc);\nprintf(\"\
    yc=\"); scanf(\"%d\",&yc);\nprintf(\"input recursion depth:\");\nscanf(\"%d\"\
    ,&n);\ninitgraph(&gdriver,&gmode,\"c:\\\\tc\");\ncleardevice();\nsetbkcolor(MAGENTA);\n\
    setcolor(YELLOW);\nmoveto(xa,ya);lineto(xb,yb);\nlineto(xc,yc);lineto(xa,ya);\n\
    tria(xa,ya,xb,yb,xc,yc,n);\ngetch();\nclosegraph();\n}\n```\n\n## 2. 通用程序\n\n\
    在设计和绘图工作中，各专门领域都有自己常用的图形符号和一些通用图形。为了减少重复工作以减轻绘图工作量和方便绘图，一般把这些图形的绘制设计成独立的功能模块，也就是图形子程序或图形函数，供用户在绘图时选择调用。下面我们通过一个简单的例子，即正多边形，来说明通用图形程序的设计过程。\n\
    \n### 构造功能模块的基本原则\n\n功能模块是结构化程序的主要组成部分，所以按照什么样的原则来构造功能模块是一个十分重要的问题。一般来说，这些原则有以下四条：\n\
    \n- （1）独立性 模块的独立性指的是每个模块都要具有其自身独立的含义，模块与模块之间的关系要明确简单，尽量避免隐含的关系。这不仅是为了保证模块的正确与安全，也是为了便于模块之间的组合。\n\
    \n- （2）抽象性 要求模块具有一定的抽象性。最常见的抽象性是参数化。由于模块为一个独立的对象进行构造，可以在多种场合使用，并可与多种其他模块相组合，所以这种抽象性能扩大模块的适应能力，从而发挥更大的作用。\n\
    \n- （3）开放性 模块还应具备开放性，即模块在建立之后，应该能方便地对它的部分属性和功能进行修改、扩充和删除，从而使得模块是可维护的。这种可维护性是延长模块生命周期的重要手段。\n\
    \n- （4）继承性 考虑到软件的兼容性，模块必须具有继承性。即当模块在维护中部分属性发生变化时，不会影响到原模块在软件中的作用。\n\n上述四条原则是在设计一个功能模块时需要加以注意的，这样有利于保证模块的质量和提高模块的可复用性能。\n\
    \n### 图形程序\n\n- 选择绘图参数\n\n  要绘制一个图形，首先要明确绘制这样一个图形需要哪些参数。一般来说，绘制一个惟一确定的图形，需要两种参数：一种是确定图形几何形状的参数，称之为定形参数；另一种是确定图形画在什么地方的数据，称之为定位参数。对于一个任意的正多边形来说，它需要的定形参数为：\n\
    \n  - 边数 n (n≥3);\n  - 边长 a。\n\n- 定位参数为：\n\n  - 定位顶点 $P_0(x_0, y_0)$;\n  - 起始倾角\
    \ $\\alpha$\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_123_0.png)\n\n  给定了这两组参数，就可惟一确定一个任意位置、形状、大小的正多边形。但在绘图程序中，必须把这两组参数转化为具体的绘图用数据。对于正多边形来说，具体的绘图数据就是多边形各顶点的坐标。因为只要确定了各顶点，就可以连点成边绘出多边形图形。根据图形中的几何关系，计算正多边形各顶点坐标的公式如下：\n\
    \n```\nP_i: { x_i = x_{i-1} + a cos(α + (i-1)Δθ) \n      y_i = y_{i-1} + a sin(α\
    \ + (i-1)Δθ) }, i = 1,2,...,n-1\n```\n\n  其中： P_0 = (x_0, y_0), Δθ = 2π / n\n\n\
    - 编写绘图程序\n\n  根据上述分析和数据准备，便可着手编写绘制任意正多边形的通用程序。函数 polygon 为绘制任意正多边形的通用绘图程序，函数中含有\
    \ 5 个形参：\n\n  - $x_0$, $y_0$：定位顶点坐标；\n  - $a$：正多边形边长；\n  - $af$：起始边与 $x$ 轴正向的夹角；\n\
    \  - 正多边形边数 $n$。\n\n  具体源程序代码如程序 3.1.4 所示。\n\n### 程序 3.1.4 绘制任意正多边形\n\n```\n#include<graphics.h>\n\
    #include<math.h>\nvoid polygon();\nmain(){\nint n = 10, i, a, x, y;\nfloat af;\n\
    int gdriver = DETECT, gmode;\nprintf(\"input length of polygon: a=\");\nscanf(\"\
    %d\", &a);\nprintf(\"input position point: \\nx=\");\nscanf(\"%d\",&x);\nprintf(\"\
    y=\");\nscanf(\"%d\",&y);\nprintf(\"input angle of polygon:af=\");\nscanf(\"%f\"\
    ,&af);\ninitgraph(&gdriver,&gmode,\"c:\\\\tc\");\ncleardevice();\nsetbkcolor(9);setcolor(4);\n\
    for(i=3; i<=n; i++)\n    polygon(x,y,a,i,af);\ngetch();\nclosegraph();\n}\nvoid\
    \ polygon(int x0, int y0, int a, int n,\n    float af) {\nint x,y,i;\nfloat dtheta,theta;\n\
    if(n<3) return;\ndtheta=6.28314/n;\ntheta=af*0.0174533;\nmoveto(x0,y0);\nx=x0;y=y0;\n\
    for(i=1;i<n;i++) {\nx=x+a*cos(theta); y=y+a*sin(theta);\nlineto(x,y); theta+=dtheta;\n\
    }\nlineto(x0,y0);\n}\n```\n"
