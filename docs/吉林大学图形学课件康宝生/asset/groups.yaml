    \[ R(u) = \frac{\sum_{i=0}^n \omega_i d_i N_{ik}(u)}{\sum_{i=0}^n \omega_i N_{ik}(u)},
    u \in [u_{k-1}, u_{n+1}] \]


    称为 k 阶 NURBS 曲线。 d_i 叫做控制顶点， ω_i 称为与控制顶点相关的权因子，折线 d_0 d_1 ⋯ d_n 称为 R(u) 的控制多边形，
    N_{ik}(u) 为节点向量 U = {u_0, u_1, ⋯, u_{n+k}} 的 k 阶 B 样条基函数。


    ### 4.7.2 NURBS 曲线的性质


    定义域 NURBS 曲线 R(u) 的定义域为区间 [u_{k-1}, u_{n+1}]；


    强凸包性 R(u) 在区间 [u_j, u_{j+1}], k-1 ≤ j ≤ n, 上的部分位于定义它的控制顶点 d_{j-k+1}, …, d_j 的凸包
    C_j 内。整条曲线 R(u) 则位于各个凸包 C_j 的并集 ∪_{j=k-1}^{n} C_j 之内。


