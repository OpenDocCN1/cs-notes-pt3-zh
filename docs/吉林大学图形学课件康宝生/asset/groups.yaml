    Boor-Cox算法，l-1级递推以后，得到一个点d_{I,J}^{k-1,l-1}，即所求曲面上的点P(u,v)。也可以按式（2）方案执行，先以v参数值对控制网格v向的m+1个多边形执行曲线的de
    Boor-Cox算法，l-1级递推后，得到沿u向的k个顶点d_{i,J}^{0,l-1}(i=I-k+1,…,I)构成的中间多边形。再以u参数值对它执行曲线的de
    Boor-Cox算法，k-1级递推以后，即得所求点。'
