    # 4.5.3 Bézier 曲线的性质


    +   仿射不变性 Bézier 曲线在仿射变换下不变。这表明下述两种操作产生相同的结果： a) 计算 P(t)，然后作仿射变换； b) 对控制多边形作仿射变换，然后求参数为
    t 的点。'
  - '[PAGE 469]


    映射不变性在图形的生成与变换中非常有用。


    +   - 映射参数变换下的不变性

    +   - 凸包性  Bézier 曲线 $P(t)$ 位于控制多边形的凸包之中。凸包性的结果之一是：平面控制多边形生成的 Bézier 曲线是平面曲线；另外的一个重要性在于干涉检查。

    +   - 端点性质

    +     $P(0)=P_0,\ P(1)=P_n$

    +     $P''(0)=n(P_1-P_0),\ P''(1)=n(P_n-P_{n-1})$

    +   - 对称性  保持曲线诸控制顶点位置不变，只是把次序完全'
  - '[PAGE 470]


    颠倒所得的新顶点记为 P̂_i = P_{n-i}，那么得到一条与原曲线一样的 Bézier 曲线，惟一的不同是具有相反的定向，即


    P̂(t) = ∑_{i=0}^{n} P̂_i B_{i,n}(t) = ∑_{i=0}^{n} P_{n-i} B_{i,n}(t) = P(1-t)


    +   - 变差缩减性（VD性质） 任一平面与 Bézier 曲线的交点数目不多于平面与控制多边形的交点数目。

    +   - 保形性 Bézier 曲线的形状酷似控制多边形的形状，特别，若控制多边形为一平面凸多边形，则定义的 Bézier 曲线是一条凸曲线。

    +   - 线性精度 假设控制顶点 P_i, i = 0, 1, ..., n, 均匀分布在连'
  - '[PAGE 471]


    接 **p** 和 **q** 的直线段上，即：


    ```

    **P**_i = (1 - i/n) **p** + i/n **q**, i = 0,1,…,n

    ```


    那么


    ```

    **P**(t) = Σ_{i=0}^{n} P_i B_{i,n}(t) = (1 - t) **p** + t **q**

    ```


    # 4.5.4 Bézier 曲线的求值


    Bézier 曲线是最为广泛采用的参数曲线之一。因此，关于它的快速生成也是研究最多的，广泛采用的生成算法是 de Casteljau 算法。记：'
  - '[PAGE 472]


    P_i^0(t) = P_i,  i = 0, 1, ..., n


    P_i^r(t) = (1 - t) P_i^{r-1}(t) + t P_{i+1}^{r-1}(t),  i = 0, 1, ..., n - r, r
    = 1, 2, ..., n


    那么


    P(t) = P_0^n


    *de Casteljau* 算法的几何意义是：按照 t : 1 - t 的比例递归分割控制多边形的每一条边，直至一个点，即为曲线上参数为 t 的点。'
  - '[PAGE 473]


    通常，我们将中间点 $P_i^r$ 写成三角点阵的形式 — de Casteljau 格式：'
  - '[PAGE 474]


    P₀ ← P₀¹    P₀²    …    P₀ⁿ

    P₁ ← P₁¹    :    :

    :    :    Pₙ₋₂²

    Pₙ₋₁ ← Pₙ₋₁¹

    Pₙ


    这一形式提示我们，在对 de Casteljau 算法编程时，应采用二维数组的数据结构。然而采用二维数组将造成空间的浪费。实际上，只需采用一维数组对其进行改写就足够了。'
  - '[PAGE 475]


    # 4.6. B 样条曲线


    # 4.6.1 从 Bézier 曲线到 B 样条曲线


    Bézier 曲线在应用中的不足有以下几点：


    +   - 缺乏灵活性。一旦确定了特征多边形的顶点数（m 个），也就决定了曲线的阶次（m - 1 次），无法更改；


    +   - 控制性差。当顶点数较多时，曲线的阶次将较高，此时，特征多边形对曲线形状的控制将明显减弱；


    +   - 不易修改。由曲线的混合函数可看出，其值在开区间'
  - '[PAGE 476]


    (0, 1) 内均不为零。因此，所定义之曲线在 (0 < t < 1) 的区间内的任何一点均要受到全部顶点的影响，这使得对曲线进行局部修改成为不可能。（而在外形设计中，局部修改是随时要进行的）


    为了克服 Bézier 曲线存在的问题，Gordon 等人对 Bézier 曲线做了拓展。就外形设计的需求而言，希望新的曲线：


    +   ◆ 易于进行局部修改；

    +   ◆ 更逼近特征多边形；

    +   ◆ 是低阶次曲线。'
  - '[PAGE 477]


    于是，用 n 次 B 样条基函数替换了 Bernstein 基函数，构造了称之为 B 样条曲线的新型曲线。


    # 4.6.2 B 样条基函数


    给定参数 u 轴上的一个分割（节点向量）


    $$U = \{u_i\}_{i=-\infty}^{i=+\infty},\,(u_i \le u_{i+1},\,i=0,\pm1,\pm2,\cdots)$$


    由下列递推公式定义的函数 $N_{ik}(u)$ 称为节点向量 $U$ 上的 $k$ 阶（$k-1$ 次）B 样条基函数：


    $$N_{i1}(u)=\begin{cases}1, & u\in[u_i,\ u_{i+1})\\0, & u\notin[u_i,\ u_{i+1})\end{cases}$$'
  - '[PAGE 478]


