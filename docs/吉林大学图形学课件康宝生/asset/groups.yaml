  md: "\n运用中点法则，我们只需考察中点 M 在直线的哪一侧，即计算：\n\n$$F(M) = F(x_i + 1, y_i + 1/2) = a(x_i\
    \ + 1) + b(y_i + 0.5) + c$$\n\n并确定其正负号。\n\n由于根据函数值 $F(x_i + 1, y_i + 1/2)$ 进行判定，所以我们定义一个判定函数如下：\n\
    \n$$d_i = 2F(x_i + 1, y_i + 1/2)$$\n\n根据定义\n\n$$d_i = 2a(x_i + 1) + 2b y_i + b\
    \ + 2c$$\n\n当 $d_i < 0$ 时，$M$ 在直线的上方，取 $E$ 为下一个像素点；当 $d > 0$ 时，$M$ 在直线的下方，取 $NE$\
    \ 为下一个像素点；当 $d = 0$ 时，两者都可以选，我们约定选 $E$。\n\n$d_i$ 的计算需要做 4 次加法和两次乘法。因此，为了有效地计算判定函数，我们需要建立关于\
    \ $d_i$ 的递推公式。显然，$d_i$ 的变化依赖于下一个像素点选的是 $NE$ 还是 $E$。\n\n- 当 $d_i < 0$ 时，下一个像素点是\
    \ $E$，那么 $d_{i+1} = 2F(x_i + 2, y_i + 1/2) = 2a(x_i + 2) + 2b y_i + b + 2c = d_i\
    \ + 2a$。\n\n- 当 $d_i > 0$ 时，下一个像素点是 $NE$，则 $d_{i+1}=2F(x_i+2,y_i+1+1/2)=2a(x_i+2)+2b(y_i+1)+b+2c\
    \ = d_i+2a+2b$。\n\n由此，得到计算判定函数 $d_i$ 的递推公式：\n\n$$d_{i+1}=\\begin{cases} d_i+2dy,\
    \ & d_i\\leq 0 \\\\ d_i+2dy-2dx, & d_i>0 \\end{cases}$$\n\n因为直线上的第一个像素点就是直线的起点\
    \ $(x_s,y_s)$，所以判定函数 $d_i$ 的初值为：\n\n$$d_0=2a(x_s+1)+2by_s+b+2c=2dy-dx$$\n\n综上所述，满足条件的直线的\
