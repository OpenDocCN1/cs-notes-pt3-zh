    # 3. 法矢量


    对于空间参数曲线上任一点，所有垂直切矢 T 的矢量构成一平面，该平面成为曲线在该点的法平面。


    若曲线上任一点的单位切矢为 T，因为 [T(s)]² = 1，两边对 s 求导矢，得：


    2T(s)·T''(s) = 0


    可见，dT/ds 是一与 T 垂直的向量。与 dT/ds 平行的法矢量称为曲线在该点的主法矢，主法矢的单位矢量称为主法矢量，记为 N。矢量积 B = T×N
