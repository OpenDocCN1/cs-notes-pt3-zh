    $$f(x,y,z)=\sum_k b_k e^{-a_k r_k^2}-T=0$$


    其中，$r_k=\sqrt{x_k^2+y_k^2+z_k^2}$，$T$ 是某个特定临界值，参数 $a_k$、$b_k$ 用来调整单个柔性物体。


