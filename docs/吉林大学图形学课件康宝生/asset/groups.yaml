    # 2. Weiler—Atherton 多边形裁剪算法


    Weiler—Atherton 算法基于修改多边形边界顶点的处理过程来获得凹多边形的正确裁剪。该算法开始是作为识别可见面的方法而提出的，因此可用于任意多边形窗口的裁剪。


    算法的基本思想是：有时沿着多边形边的方向来处理顶点，有时沿着窗口的边界方向处理顶点。采用哪一条路径，要根据多边形处理方向（顺时针或逆时针）和当前处理的多边形顶点是对是由内向外还是是由外到内来决定。若顺时针处理顶点，则采用的规则是：'
  - '[PAGE 341]


    +   - 对由外到内的顶点对，沿多边形边界的方向；

    +   - 对由内向外的顶点对，按顺时针沿窗口边界的方向。


    下图给出了Weiler—Atherton算法的处理方向和被裁剪的多边形。Weiler—Atherton 算法的进一步发展就是 Weiler 算法，用于窗口为任意多边形的多边形裁剪。


