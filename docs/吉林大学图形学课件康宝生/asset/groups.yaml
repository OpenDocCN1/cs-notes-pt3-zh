    # 2. Bézier 曲面的拼接


    设两张 $m\times n$ 次 Bézier 曲面如图所示，分别由控制顶点 $P_{ij}$ $(0 \le i \le m\ ;\ 0 \le j \le
    n)$ 和 $Q_{ij}$ $(0 \le i \le m\ ;\ 0 \le j \le n)$ 定义：


    $$P(u,v)=\sum_{i=0}^{m}\sum_{j=0}^{n}P_{ij}B_{i,m}(u)B_{j,n}(v),\ 0\le u,v\le
    1$$


    $$Q(u,v)=\sum_{i=0}^{m}\sum_{j=0}^{n}Q_{ij}B_{i,m}(u)B_{j,n}(v),\ 0\le u,v\le
    1$$


    如果要求两曲面片达到 $G^0$ 连续，则它们有公共的边界，即


    $$P(1,v)=Q(0,v)\qquad(1)$$'
