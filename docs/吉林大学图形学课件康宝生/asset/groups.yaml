    实体造型的核心问题是如何在计算机内定义、表示一个三维物体。我们知道任何一个三维物体都具有完全封闭的边界表面，而物体的封闭的边界表面由一组面所构成，各个面均有方向，明确地划分出物体的内部和外部。每个面均有单独的数学定义，每个面又由封闭的环确定其边界。每个环由一组边构成，每条边也有单独的数学定义，且由两个端点所界定，一个为边的起点，另一个为边的终点。每个顶点由空间三个坐标值来确定。三维物体的这种内在的层次结构便给出了在计算机内定义实体的拓扑结构，即实体在计算机内通常采用六层拓扑结构来定义。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_712_0.png)


    为了保证所描述三维物体的合法性，各层次的元素均有严格的定义，现简要说明如下：


    - (1) 体 体是由封闭表面围成的维数一致的有限空间。通常把具有良好边界的实体称为正则实体。


    - (2) 壳 壳是方向一致的一组面的集合，形成封闭的单一连通空间。一个三维物体可以有多个壳，其中仅有一个外壳，其余为内壳。外壳就是在观察方向上所能看到的物体的最大外边界，内壳的内部则为空腔。


    - (3) 面 面是形体表面的一部分，是有界、不自交的连续面，且有方向性。面的有效范围由一个外环和若干个内环界定。面可以无内环，但必须有外环。一张面只能属于一个壳。与面对应的几何表面可以是平面、二次曲面、参数曲面。


    - (4) 环 环是由有序、有向边组成的面的封闭边界。环中各边不能自交，即组成环的各条边除了共享端点外不能再有其他交点。环有内环和外环之分，确定面的最大外边界的环是外环。外环按逆时针定向，根据外环的走向按右手法则确定面的外法向量。确定面的内孔或凸台边界的环称为内环，内环按顺时针定向。基于环的这种定向，在面上沿一个环的定向前进时，左侧总是面内，右侧总是面外。


    - (5) 边 边是体两个相邻面的交界。一条边只能为两个相邻面共享。边由一对端点界定，其一是起点，另一是终点。边的定向从起点指向终点。与边相应的几何线段可以是直线、圆弧、二次曲线、参数曲线。


    - (6) 顶点 顶点是边的端点，不允许出现在边的内部，也不能孤立地存在于物体的内部或面内。顶点所对应的几何点在 E³ 中用坐标 (x, y, z) 表示。


