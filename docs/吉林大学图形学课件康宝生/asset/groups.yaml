    **P₀ = (x₀, y₀, z₀) 和 P₁ = (x₁, y₁, z₁)**


    的直线段，其参数方程为：


    ⎧ x = x₀ + (x₁ − x₀) t

    ⎨ y = y₀ + (y₁ − y₀) t, 0 ≤ t ≤ 1

    ⎩ z = z₀ + (z₁ − z₀) t'
