    ## 4.2.2 曲线基本概念


    一条用参数表示的三维曲线是一个有界点集，可写成一个带参数的、连续的、单值的数学函数，其形式为：


    ```

    \[ \left\{ \begin{array}{c} x = x(t) \\ y = y(t), t \in [0, 1] \\ z = z(t) \end{array}
    \right. \]

    ```


    ### 1. 位置矢量


    曲线上任一点的位置矢量可表示为：


    **P**(t) = [x(t), y(t), z(t)]


    其一阶、二阶和 k 阶导数矢量（如果存在的话）分别表示为：


    **P''**(t) = d**P**/dt ,  **P''''**(t) = d²**P**/dt² ,  **P**^k(t) = d^k**P**/dt^k


    ### 2. 切矢量


    曲线上任一点的切矢量，如果存在的话则为：


    **T** = **P''**(t) / |**P''**(t)|


    如果选择弧长 s 作为参数，那么根据弧长微分公式，有：


    $(ds)^2 = (dx)^2 + (dy)^2 + (dz)^2$


    引入参数 t，上式可改写为：


    $\left(\frac{ds}{dt}\right)^2 = \left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2
    + \left(\frac{dz}{dt}\right)^2 = |P''(t)|^2$


    为了方便，t 增加的方向数学上一般取为 s 增加的方向。考虑到向量的模非负，所以有：


    $\frac{ds}{dt} = |P''(t)| \ge 0$


    即弧长 s 是 t 的单调增函数，故其反函数 t(s) 存在，且一一对应。


    由此得：


    **P**(t) = **P**(t(s)) = **P**(s)


    于是


    d**P**/ds = d**P**/dt · dt/ds = **P**''(t) / |**P**''(t)|


    即 **P**(t) 关于弧长 s 的导矢是单位向量。


    ### 3. 法矢量


    对于空间参数曲线上任一点，所有垂直切矢 T 的矢量构成一平面，该平面成为曲线在该点的法平面。


    若曲线上任一点的单位切矢为 T，因为 [T(s)]² = 1，两边对 s 求导矢，得：


    2T(s)·T''(s) = 0


    可见，dT/ds 是一与 T 垂直的向量。与 dT/ds 平行的法矢量称为曲线在该点的主法矢，主法矢的单位矢量称为主法矢量，记为 N。矢量积 B = T×N
    是第三个单位矢量，它垂直于 T 和 N。平行于矢量 B 的法矢称为曲线的副法矢，B 则叫做单位副法矢。


    对于一般参数 $t$，有：


    $$\mathbf{B} = \frac{\mathbf{P}''(t) \times \mathbf{P}''''(t)}{|\mathbf{P}''(t)
    \times \mathbf{P}''''(t)|},\quad \mathbf{N} = \mathbf{B} \times \mathbf{T} = \frac{(\mathbf{P}''(t)
    \times \mathbf{P}''''(t)) \times \mathbf{P}''(t)}{|\mathbf{P}''(t) \times \mathbf{P}''''(t)|\cdot
    |\mathbf{P}''(t)|}$$


    $\mathbf{T}$（切矢），$\mathbf{N}$（主法矢）和 $\mathbf{B}$（副法矢）构成了曲线上的活动标架。$\mathbf{N}$和
    $\mathbf{B}$构成的平面称为法平面；$\mathbf{N}$和 $\mathbf{T}$构成的平面称为密切平面；$\mathbf{B}$和 $\mathbf{T}$构成的平面称为从切平面（见图）。


    ### 4. 曲率和挠率


    由于 dT/ds 与 N 平行，若令 T'' = kN，则：


    k = |T''| = lim_{Δs→0} |ΔT|/|Δs| = lim_{Δs→0} (|ΔT|/|Δθ| · |Δθ|/|Δs|) = lim_{Δs→0}
    |Δθ|/|Δs|


    其中，θ 为相邻两切线的夹角。称 k 为曲线的曲率，其几何意义是曲线的单位切矢对弧长的转动率，与主法矢同向。曲率的倒数 ρ = 1/k 称为曲率半径。


    又 B(s)·T(s) = 0，两边对 s 求导，得：


    B''(s)·T(s) + B(s)·T''(s) = 0


    将 T'' = kN 代入上式，并注意到 B(s)·N(s) = 0，得到：


    B''(s)·N(s) = 0


    因为[B(s)]² = 1，所以两边对 s 求导，得到 B''(s)·B(s) = 0，可见 B''(s) 既垂直于 T(s)，有垂直于 B(s)，故：


    B''(s) // N(s)


    再令 B''(s) = -τ N(s)，τ 称为挠率。因为


    |τ| = |dB/ds| = lim |ΔB/Δs| = lim ( |ΔB/Δφ| · |Δφ/Δs| ) = lim |Δφ/Δs|


    所以，挠率的绝对值的概念与副法线方向（或密切平面）对于弧长的转动率。τ 挠率大于0、等于0和小于0分别表示曲线为右旋空间曲线、平面曲线和左旋空间曲线。


    同样，对 N(s)=B(s) × T(s) 两边求导，可以得到：


    N''(s)=−kT(s)+τB(s)


    将 T'', N'', B'' 和 T, N, B 的关系写成矩阵形式，为


    ⎡T''⎤   ⎡ 0   k   0 ⎤ ⎡T⎤

    ⎢N''⎥ = ⎢−k   0   τ ⎥ ⎢N⎥

    ⎣B''⎦   ⎣ 0  −τ   0 ⎦ ⎣B⎦


    对于一般参数 t，曲率 k 和挠率 τ 的计算公式如下：


    ```

    k(s) = |P''(t) × P''''(t)| / |P''(t)|³ ,   τ(s) = (P''(t) × P''''(t)) · P''''''(t)
    / |P''(t) × P''''(t)|²

    ```


