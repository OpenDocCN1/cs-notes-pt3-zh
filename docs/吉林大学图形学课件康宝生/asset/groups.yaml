    $Q_L = -(\Delta x + \Delta z),\quad D_L = x_0 + z_0$\n$Q_T = \Delta y - \Delta
    z,\quad D_T = z_0 - y_0$\n$Q_R = \Delta x - \Delta z,\quad D_R = z_0 - x_0$\n$Q_F
    = -\Delta z,\quad D_F = z_0 - z_{\min}$\n$Q_B = -(\Delta y + \Delta z),\quad D_B
    = y_0 + z_0$\n$Q_{FB} = \Delta z,\quad D_{FB} = 1 - z_0$\n\n其中：\n\n$\Delta x =
