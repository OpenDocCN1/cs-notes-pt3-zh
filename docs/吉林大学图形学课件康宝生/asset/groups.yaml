    \n## 4. 区域填充的扫描线算法\n\n区域填充的边界算法和泛填充算法均为递归算法，程序简单、表达清晰。但由于多层递归，系统堆栈反复进出，费时费空间。因此许多改进的更有效的算法相继出现，其中以扫描线算法最具代表性。下面以内点表示的\
    \ 4-连通区域填充为例，讨论区域填充的扫描线。\n\n算法基本思想是，首先填充种子点所在扫描线上位于区域内的区段，然后确定与该区段相邻的上下两条扫描线上位于区域内的区段，并依次将各区段的起始位置保存，这些区段分别被用区域边界色显示的像素点所包围。随后，逐步取出一个开始点并重复上述过程，直到所保存各区段都填充完毕为止。\n\
    \n借助于栈结构，区域填充的扫描线算法之步骤如下：\n\n- Step 1. 初始化种子点栈 置种子点栈为空栈，并将给定的种子点入栈；\n- Step 2.\
    \ 出栈 若种子点栈为空，算法结束；否则，取栈顶元素(x, y)为种子点；\n- Step 3. 区段填充 从种子点 (x, y) 开始沿纵坐标为 y 的当前扫描线向左右两个方向逐像素进行填色，其颜色值置为：*F_Color*\
    \ 直至到达区域边界。分别以 xl 和 xr 表示该填充区段两端点的横坐标；\n- Step 4. 新种子点入栈 分别确定当前扫描线上、下相邻的两条扫描线上位于区间\
    \ [xl, xr] 内的区域内的区段。若这些区段内的像素点颜色值为 F_Color 或 B_Color，则转至 Step 2；否则以区段的右端点为种子点入种子点栈，再转至\
    \ Step 2。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_269_0.png)\n\n为具体起见，设种子点栈为\
    \ Seed，允许的操作如下：\n\n- stackpop (): 取栈顶元素；\n- stackpush (): 种子点入栈；\n- setstackempty\
    \ (): 种子点栈置空；\n- isstackempty(): 种子点栈状态检测函数。\n\n利用这些函数，下面给出区域填充的扫描线算法的程序框架。在此基础上，不难给出区域填充的扫描线算法的完整程序。\n\
    \n## 程序 3.4.3 区域填充的边界算法\n\n```c\ntypedef struct { // 记录种子点\n  int x;\n  int y;\n\
    } Seed;\n\nvoid ScanLineFill4 ( int x, int y, int oldcolor, int newcolor)\n{\n\
    \    int xl, xr, i;\n    bool spanNeedFill;\n    Seed pt;\n    setstackempty();\n\
    \    pt.x = x; pt.y = y;\n    stackpush (pt); // 种子点(x, y)入栈\n    while (! isstackempty\
    \ ()){\n        pt = stackpop (); // 取种子点\n        y = pt.y; x = pt.x;\n     \
    \   while (GetPixel (x,y) == oldcolor) // 从种子点开始向右填充\n        {\n            DrawPixel\
    \ (x, y, newcolor);\n            x ++;\n        }\n        xr = x - 1; x = pt.x\
    \ - 1;\n        while (GetPixel (x,y) == oldcolor) { // 从种子点开始向左填充\n         \
    \   DrawPixel (x, y, newcolor); x --;\n        }\n        xl = x + 1;\n      \
    \  x = xl; y = y + 1; // 处理上面一条扫描线\n        while (x < xr) {\n            spanNeedFill\
    \ = FALSE;\n            while (GetPixel (x, y) == oldcolor) {\n              \
    \  spanNeedFill = TRUE; x++;\n            } // 待填充区段搜索完毕\n            if (spanNeedFill)\
    \ { // 将右端点作为种子点入栈\n                pt.x = x - 1; pt.y = y;\n                stackpush\
    \ (pt);\n                spanNeedFill = FALSE;\n            } // 继续向右检查以防遗漏\n\
    \            while ((GetPixel (x, y) != oldcolor) && x < xr) x++;\n        } //\
    \ 上一条扫描线上检查完毕\n        x = xl; y = y - 1; // 处理下面一条扫描线\n        while (x < xr)\
    \ {\n            spanNeedFill = FALSE;\n            while (GetPixel (x, y) ==\
    \ oldcolor) {\n                spanNeedFill = TRUE; x ++;\n            }\n   \
    \         if (spanNeedFill) {\n                pt.x = x - 1; pt.y = y;\n     \
    \           stackpush (pt); spanNeedFill = FALSE;\n            }\n           \
    \ while ((GetPixel (x, y) != oldcolor) && x < xr) x ++;\n        }\n    }\n}\n\
    ```\n\n在上述算法中，对于每一个待填充的区域，只需向种子点栈中压入一个种子点即可。而每取走一个栈顶元素，则填充一个区段。这与采用递归算法时区域内全部像素递归式地入栈、出栈并逐一填充的做法相比，种子像素进出栈的次数大为减少，内存节省多，速度也相应提高。\n\
    \n## 3.4.3 区域的图案填充\n\n前面讨论区域填充时，只用一种颜色，其实现是将该颜色赋给 DrawPixel 函数的参数 Color。本节我们讨论用图案进行填充，其实现方法是在扫描转换算法中最终写像素时增加一些控制即可。\n\
    \n### 1. 填充模式\n\n区域显示有三种模式：具有颜色边界的空心区域、用颜色填充的实心区域和用指定图案或设计填充的区域。在 PHIGS 中用下列函数设置基本填充模式：\n"
  mdcn: "\n充色，并检测其相邻位置的像素点。重复此过程，直至区域边界颜色范围内的所有像素点均置为填充色为止。\n\n## 程序 3.4.1 区域填充的边界算法\n\
    \n```c\nvoid boundaryFill4 (int x, int y, int F_Color, int B_Color)\n{\n    int\
