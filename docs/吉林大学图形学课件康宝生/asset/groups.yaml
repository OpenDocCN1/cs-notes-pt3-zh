    \n以裁剪窗口的四条边界将平面区域分为九个子区域，为每个子区域赋以相应的编码，称为区域码（region code），每个子区域中的点采用同一编码。区域码的各位指出点关于裁剪窗口的四个相对坐标位置：左、右、下、上。将区域码各位从右到左编号，则坐标区域与各位的关系如下（图\
    \ 2）：\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_299_0.png)\n\n这里：位 1：左；位 2：右；位\
    \ 3：下；位 4：上。任何位置赋值为 1，代表点落在相应的位置上，否则为 0。\n\n对于要裁剪的线段的两个端点，根据所在区域确定其相应的编码。各位的值按以下两步确定：①\
    \ 计算端点坐标和裁剪边界之间的差值；② 用各差值的符号位来设置区域码中相应的值。第一位为 $x - x_L$ 的符号位，第二位为 $x_R - x$ 的符号位，第三位为\
    \ $y - y_B$ 的符号位，第四位为 $y_T - y$ 的符号位。\n\n一旦确定了线段两端点的区域码，便可快速判断完全可见和完全不可见的线段。如果线段两端点的编码均为\
    \ 0000，则该线段完全可见；如果线段两端点的编码中同一位都为 1，则该线段完全不可见。如果上述判断不能定论，则需要进行线段与窗口边界的求交计算。按照左、右、下、上的顺序用裁剪边界检查线段的端点，以确定应裁剪掉的线段部分。我们以图3中的线段为例说明\
    \ Sutherland—Cohen 算法的处理过程。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_302_0.png)\n\
    \n对于线段 $P_0P_1$，由下端点 $P_0$ 开始，依次按左、右、下、上边界对 $P_0$ 检查。发现 $P_0$ 位于下边界的下方，然后求线段 $P_0P_1$\
    \ 与下边界的交点 $P_0'$，并舍弃线段 $P_0P_0'$。对于端点 $P_1$ 进行同样的检查，发现 $P_1$ 位于左边界的左侧，求线段 $P_0P_1$\
    \ 与左边界的交点 $P_1'$。但 $P_1'$ 位于上边界之上，因此再求一次交点，计算得到 $P_1''$，并舍弃线段 $P_1P_1''$，该线段的裁剪处理完毕。\n\
    \n在与裁剪边界的求交计算中，直线段采用斜截式方程。对于端点坐标为 $P_i = (x_i, y_i), i = 0, 1$ 的直线，与垂直边界交点 $y$\
    \ 坐标由下述公式计算：\n\n\\[\ny = y_0 + (y_1 - y_0) \\cdot \\frac{x - x_0}{x_1 - x_0}\n\
    \\]\n\n其中，$x$ 值为 $x_L$ 或 $x_R$。\n\n寻找与水平边界交点的 $x$ 坐标的计算公式是：\n\n\\[\nx = x_0 +\
    \ (y - y_0) \\cdot \\frac{x_1 - x_0}{y_1 - y_0}\n\\]\n\n其中，$y$ 值为 $y_B$ 或 $y_T$。\n\
    \n下面给出 Sutherland—Cohen 直线段裁剪算法的程序实现，各端点的编码以字节存储，并按位操作处理。\n\n**算法 3.6.1 Sutherland-Cohen\
    \ 裁剪算法**\n\n```c\n#define LEFT    1\n#define RIGHT   2\n#define BOTTOM  4\n#define\
    \ TOP     8\n\nint encode(float x, float y)\n{\n    int c = 0;\n    if (x < XL)\
    \ c |= LEFT;\n    if (x > XR) c |= RIGHT;\n    if (y < YB) c |= BOTTOM;\n    if\
    \ (y > YT) c |= TOP;\n    return c;\n}\n\nvoid SC_LineClip(x1, y1, x2, y2, XL,\
    \ XR, YB, YT)\nfloat x1, y1, x2, y2, XL, XR, YB, YT; // (x1, y1)、(x2, y2) 为线段端点坐标，其他四个参数定义窗口边界\n\
    {\n    int code1, code2, code;\n    float x, y;\n    code1 = encode(x1, y1);\n\
    \    code2 = encode(x2, y2);\n\n    while (code1 != 0 || code2 != 0)\n    {\n\
    \        if ((code1 & code2) != 0) return;\n        if (code1 != 0) code = code1;\n\
    \        else code = code2;\n        if ((LEFT & code) != 0) { // 点在窗口左边界左侧\n\
    \            x = XL;\n            y = y1 + (y2 - y1) * (XL - x1) / (x2 - x1);\n\
    \        }\n        else if ((RIGHT & code) != 0) { // 点在窗口右边界右侧\n           \
    \ x = XR;\n            y = y1 + (y2 - y1) * (XR - x1) / (x2 - x1);\n        }\n\
    \        else if ((BOTTOM & code) != 0) { // 点在窗口下边界下方\n            y = YB;\n\
    \            x = x1 + (x2 - x1) * (YB - y1) / (y2 - y1);\n        }\n        else\
    \ if ((TOP & code) != 0) { // 点在窗口上边界上方\n            y = YT;\n            x =\
    \ x1 + (x2 - x1) * (YT - y1) / (y2 - y1);\n        }\n        if (code == code1)\n\
    \        { x1 = x; y1 = y; code1 = encode(x, y); }\n        else\n        { x2\
    \ = x; y2 = y; code2 = encode(x, y); }\n    }\n    displaylist(x1, y1, x2, y2);\n\
    }\n```\n\n### 2. 中点分割裁剪算法\n\n与 Sutherland-Cohen 算法一样，中点分割裁剪算法首先对线段端点进行编码，并据此把线段与窗口的关系分为三种情况：全在窗口内、完全不在窗口内、线段与窗口相交。对前两种情况作同样处理。对于第三种情况，用中点分割的方法求出线段与窗口的交点，即从点\
    \ $P_0$ 出发找出距 $P_0$ 最近的可见点 $A$，并从点 $P_1$ 出发找出距 $P_1$ 最近的可见点 $B$，两个可见点之间的连线即为线段\
    \ $P_0P_1$ 的可见部分，如图所示。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_309_0.png)\n\
    \n采用中点分割方法从 $P_0$ 出发找最近可见点：先求出 $P_0P_1$ 的中点 $P_m$。若 $P_0P_m$ 不是显然不可见的，并且 $P_0P_1$\
    \ 在窗口中有可见部分，则距 $P_0$ 最近的可见点一定落在 $P_0P_m$ 上，故用 $P_0P_m$ 代替 $P_0P_1$；否则用 $P_mP_1$\
    \ 代替 $P_0P_1$；再对新的 $P_0P_1$ 求中点 $P_m$。重复上述过程，直到 $P_mP_1$ 的长度小于给定的控制常数为止。求距 $P_1$\
    \ 最近的可见点过程一样，只要把 $P_0$ 和 $P_1$ 交换即可。由于该算法的主要计算过程只用到加法和除 2 运算，所以特别适合硬件实现，同时也适合于并行计算。求距\
    \ $P_0$ 最近的可见点的框图如下。\n\n### 3. 梁友栋—Barsky 算法\n\n该算法基于线段的参数方程的分析，通过减少计算交点的次数，使其速度较之\
    \ Sutherland—Cohen 算法更快。\n\n端点为 $P_i = (x_i, y_i), i = 0, 1$ 的线段，其参数方程为：\n\n\\\
    [\n\\begin{cases}\nx = x_0 + \\Delta x \\cdot u \\\\\ny = y_0 + \\Delta y \\cdot\
    \ u\n\\end{cases},\\quad 0 \\le u \\le 1\n\\]\n\n其中 $\\Delta x = (x_1 - x_0)$，$\\\
    Delta y = (y_1 - y_0)$。直线段 $P_0P_1$ 上点的裁剪条件是：\n\n\\[\n\\begin{cases}\nx_L \\le\
    \ x_0 + \\Delta x \\cdot u \\le x_R \\\\\ny_B \\le y_0 + \\Delta y \\cdot u \\\
    le y_T\n\\end{cases}\n\\]\n"
