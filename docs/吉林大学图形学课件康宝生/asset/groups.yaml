    # 1. Sutherland-Cohen 算法


    三维图形裁剪的 Sutherland–Cohen 算法和二维一样，对窗口的六个面所分的 27 个区域进行编码。每一个区域的点采用同一编码，编码由六位组成。编码规则如下：


    第一位 = { 1: y > 1(y > z), 即点在观察体的上面之上

    0: y ≤ 1(y ≤ z), 即点在观察体的上面之下 }


    第二位 = { 1: y < 0(y < -z), 即点在观察体的下面之下

    0: y ≥ 0(y ≥ -z), 即点在观察体的下面之上 }'
  - '[PAGE 627]


    第二位 = \begin{cases} 1: x > 1(x > z)，即点在观察体的右面之右 \\ 0: x \leq 1(x \leq z)，即点在观察体的右面之左
    \end{cases}


    第三位 = \begin{cases} 1: x < 0(x < -z)，即点在观察体的左面之左 \\ 0: x \geq 0(x \geq -z)，即点在观察体的左面之右
    \end{cases}


    第五位 = \begin{cases} 1: z > 1(z > 1)，即点在观察体的前面之前 \\ 0: z \leq 1(z \leq 1)，即点在观察体的前面之后
    \end{cases}


    第六位 = \begin{cases} 1: z < 0(z < z_{\min})，即点在观察体的后面之后 \\ 0: z \geq 0(z \geq z_{\min})，即点在观察体的后面之前
    \end{cases}'
