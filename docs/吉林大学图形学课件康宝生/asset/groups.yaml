    \        IntersectPt.y = clipBoundary[0].y;\n        IntersectPt.x = S.x + (clipBoundary[0].y\
    \ - S.y)*(P.x - S.x)/(P.y - S.y);\n    }\n}\n```\n\n```\nelse { //垂直裁剪边界\n\n \
    \   IntersectPt.x = clipBoundary[0].x;\n\n    IntersectPt.y = S.y + (clipBoundary[0].x\
    \ - S.x)*(P.y - S.y)/(P.x - S.x);\n\n}\n\n}\n\nboolean Inside(Vertex TestPt, Edge\
    \ ClipBoundary) {\n\n    if(ClipBoundary[1].x > ClipBoundary[0].x) // 裁剪边界为窗口下边界\n\
    \n        if(TestPt.y >= ClipBoundary[0].y) return TRUE;\n\n    if(ClipBoundary[1].x\
    \ < ClipBoundary[0].x) // 裁剪边界为窗口上边界\n\n        if(TestPt.y <= ClipBoundary[0].y)\
    \ return TRUE;\n\n    if(ClipBoundary[1].y > ClipBoundary[0].y) // 裁剪边界为窗口右边界\n\
    ```\n\n```\nif(TestPt.x <= ClipBoundary[0].x) return TRUE;\nif(ClipBoundary[1].y\
    \ < ClipBoundary[0].y) // 裁剪边界为窗口左边界\n    if(TestPt.x >= ClipBoundary[0].x) return\
    \ TRUE;\n    return FALSE;\n}\nvoid Output(Vertex newVertex, int *outLength, Vertex\
    \ *OutVertexArray)\n{\n    (*outLength) ++;\n    OutVertexArray[*outLength - 1].x\
    \ = newVertex.x;\n    OutVertexArray[*outLength - 1].y = newVertex.y;\n}\n```\n\
    \n```\nvoid SutherlandHodgemanClip(VertexArray InVertexArray, VertexArray OutVertexArray,\
    \ Edge ClipBoundary, int inLength, int *outLength )\n{\n    Vertex S, P, ip;\n\
    \    int j;\n    *outLength = 0;\n    S = InVertexArray[inLength - 1]; // 从最后一个顶点开始\n\
    \    for(j = 0; j < inLength; j ++){\n        P = InVertexArray[j];\n        if(Inside(P,\
    \ ClipBoundary)){\n            if(Inside(S, ClipBoundary)) // S， P 在窗口内\n    \
    \        Output(P, outLength, OutVertexArray);\n```\n\n利用 Sutherland-Hodgeman\
    \ 算法对凸多边形进行裁剪时可获得正确的裁剪结果，但是对凹多边形的裁剪将不能得到正确的结果，如下图所示，显示出一条多余的线段。这种情况在裁剪后的多边形有两个以上的分离部分时出现，因为只有一个输出顶点表，所以表中最后一个顶点总是与第一个顶点相连。\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_335_0.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_335_1.png)\n\
    \n多余的线段\n\n## 凹多边形的裁剪\n\n为了正确地裁剪凹多边形，有以下几种方法，其一是将凹多边形分割成若干个凸多边形，然后分别处理各个凸多边形；其二是修改\
    \ Sutherland—Hodgeman 算法，沿着任何一个裁剪窗口边界检查顶点表，正确地连接顶点对；第三种方法就是随后介绍的 Weiler—Atherton\
    \ 算法。\n\n## 凹多边形的判定与分解\n\n在 xy 平面上判定和分解凹多边形的方法有两种。\n\n- （1）向量法。沿多边形的边界计算相邻边向量的叉乘可判定凹多边形。如果一些叉乘的\
    \ z 分量为正，另一些叉乘的 z 分量\n\n为负，则该多边形必为凹多边形，否则为凸多边形。\n\n### 例 分解凹多边形的向量法\n\n给定一多边形，其边向量如下：\n\
    \nE₁ = (1, 0),    E₂ = (1, 1),    E₃ = (1, −1)\nE₄ = (0, 2),    E₅ = (−3, 1),\
    \    E₆ = (0, −2)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_337_0.png)\n\n因\
    \ (E₂×E₃)z = -2 < 0，我们沿 E₂ 的延长线分解多边形，求其和多边形的交点，这样一个多边形分为两个。由于这两个子多边形边向量的叉乘的 z\
    \ 分量均为正，所以它们都是凸多边形。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_338_0.png)\n\n\
    （2）旋转法。沿多边形逆时针前进，将多边形顶点 Vₖ 平移到坐标原点，然后顺时针旋转多边形，使下一顶点 Vₖ₊₁ 在 x 轴上。\n\n如果下一顶点 $V_{k+2}$\
    \ 位于 $x$ 轴下方，即 $V_{k+2,y} < 0$，则该多边形为凹多边形，沿 $x$ 轴将多边形分解为两个子多边形。对两个子多边形重复进行凹多边形测试；否则，继续旋转在\
    \ $x$ 轴上方的顶点，测试顶点的 $y$ 坐标是否 为负。下图说明了分解凹多边形的旋转法。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_339_0.png)\n\
    \n## 2. Weiler—Atherton 多边形裁剪算法\n\nWeiler—Atherton 算法基于修改多边形边界顶点的处理过程来获得凹多边形的正确裁剪。该算法开始是作为识别可见面的方法而提出的，因此可用于任意多边形窗口的裁剪。\n\
    \n算法的基本思想是：有时沿着多边形边的方向来处理顶点，有时沿着窗口的边界方向处理顶点。采用哪一条路径，要根据多边形处理方向（顺时针或逆时针）和当前处理的多边形顶点是对是由内向外还是是由外到内来决定。若顺时针处理顶点，则采用的规则是：\n\
    \n- - 对由外到内的顶点对，沿多边形边界的方向；\n- - 对由内向外的顶点对，按顺时针沿窗口边界的方向。\n\n下图给出了Weiler—Atherton算法的处理方向和被裁剪的多边形。Weiler—Atherton\
    \ 算法的进一步发展就是 Weiler 算法，用于窗口为任意多边形的多边形裁剪。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_341_0.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_341_1.png)\n\n## 3.6.4 字符的裁剪\n\n字符的裁剪技术取决于字符的生成方法和具体应用，一般地，图形软件中包含了几种裁剪技术。\n\
    \n最简单的裁剪字符串的方法是全部保留和全部舍弃字符串，称为串精度裁剪。如果字符串的所有字符都在裁剪窗口内，就全部保留，否则舍弃整个字符串。\n\n另一种处理方法是，与窗口边界有重叠的字符串是取舍整个字符，既全部保留或全部舍弃一个字符，称为字符精度裁剪。在这种方法中，每一个字符的边界要与窗口比较，凡与窗口\n"
