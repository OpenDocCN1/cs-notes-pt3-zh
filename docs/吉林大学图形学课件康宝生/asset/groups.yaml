    \ × [v_{l-1}, v_{n+1}]\n-   (2) 强凸包性 P(u, v) 在区域 [u_i, u_{i+1}] × [v_j, v_{j+1}]\n\
    \n（4）几何不变性 B 样条曲面的形状和位置与坐标系的选取无关。\n\n（5）局部性 P(u, v) 的每一片都受到 k×l 个控制顶点的影响，任一控制顶点最多影响\
    \ k×l 片曲面。\n\n（6）对 Bézier 曲面的包含性\n\n下图是一张双三次 B 样条曲面片的实例。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_688_0.png)\n\
