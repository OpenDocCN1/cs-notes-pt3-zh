    \    }\n}\n```\n\n## 3.8 基本图元的输出属性\n\n任何影响图元显示方式的参数均称为属性参数（Attribute Parameter），如颜色和大小等属性参数确定图元的基本特性，其他则指出在特定条件下怎样显示图元。本节仅讨论控制图元基本显示特性的属性而不考虑特定条件。例如，线段可以是点线、虚线、粗线或细线；区域可用一种颜色或多色图案填充；文本可以从左到右的阅读方式显示、沿屏幕对角线方向显示或按垂直列向显示；也可在对象的边界上应用光亮度变化来光顺台阶效果等等。\n\
    \n将属性选择加入到图形软件包的一种方式是为每个输出图元功能扩充相关的属性表来包含合适的属性。例如，画线功能除包含端点坐标和颜色外，还可包含宽度和其他特性的参数。另一种方法是提供一张系统当前属性值表。用包含在图形软件包中独立的函数来为属性表设置当前值。有些软件包在输出图元命令中为用户提供属性功能参数的组合，而\
    \ GKS 和 PHIGS 标准中，属性的设置用更新系统属性表的独立函数来完成。\n\n### 3.8.1 直线的属性\n\n直线段的基本属性有线型、线宽和颜色。下面我们讨论怎样修改画线程序来实现各种指定的属性。\n\
    \n- **1. 线型**\n\n  线型属性包括实线、虚线、点线、点划线等。通过设置沿线路径显示的实线段的长度和间距来修改画线算法，以生成各类型的线段。虚线可通过在实线之间插入与实线段等长的空白段来显示；划线的长度和空白段长度作为用户的选项来指定；点线可通过生成很短的划线和等于或大于划线长度的空白段来显示。其他线型变化可用类似的方法来生成。\n\
    \n  在 PHIGS 标准中，设置线型属性的函数是：`setLineType(lt)`\n\n  其中，参数 lt 取值为 1、2、3 或 4 来分别生成实线、虚线、点线和点划线。一旦设置了线型参数，其随后的所有画线命令都生成这种类型的线。\n\
    \n  光栅画线算法通过画像素段来显示线型属性。对于各种划线、点线和点划线样式，画线程序沿线路路径输出一些连续像素段。在每两个实心段之间有一个定长度的空白中间段，划段长度和中间空白段的像素数目可用像素掩模（Pixelmask）指定。像素掩模是\
    \ 0 和 1 的串，用来指出沿线路路径哪些位置要画。例如，掩模 1111000 用来显示划线长度为 4 个像素中间空白段为 3 个像素的虚线。\n\n \
    \ 用固定数目的像素来画线会产生在不同方向生成不等长的划线的现象。要精确地绘制，对任何线方向的划线长度应保持近似地相等。为此，一种方法是按照线的斜率来调整实心段和中间空白段的像素数目。另一种方法是将划线看作是单独的线段，确定每条划线的端点坐标，调用沿划线路径计算像素位置的画线程序。\n\
    \n- **2. 线宽**\n\n  线宽选择的实现取决于输出设备的能力。在显示器上的粗线可以用相邻的平行线来显示；而在笔式绘图机上则可能需要换笔。\n\n\
    \  使用线宽命令设置属性表中的线宽值之后，该值被画线算法用来控制随后的输出图元命令所生成的线的粗细。\n\n  在 PHIGS 标准中，设置线宽属性的命令是：\n\
    \n  `setLineWidthScaleFactor(lw)`\n\n  线宽参数 lw 是一个用来指定显示线段的相对线宽的正数，值 1 指标准宽度的线段。\n\
    \n  在光栅实现中，标准线宽是在每个放样位置处用一个像素来生成。其他线宽是作为标准线宽的正整数倍沿相邻平行线路径画额外的像素点而显示的。对于斜率绝对值小于\
    \ 1 的线段，可修改画线程序，通过在沿线的每个 x 位置画像素的垂直段来显示粗线，每段的像素数目等于参数 lw 的整数值。例如，我们通过在原线段路径之上生成一条平行线来画双倍线宽的线段。即在每个放样位置\
    \ x 处，计算对应的 y 坐标，并用屏幕坐标 (x, y) 和 (x, y+1) 画像素。通过交替地在单线宽的上下像素可生成三倍以上的线宽的线段。\n\n\
    \  对于斜率绝对值大于 1 的线段，可以在沿线的每个 x 位置画像素的水平段来显示各种线宽的线段。\n\n  尽管通过绘制水平或垂直段能快速地生成粗线，但线的宽度仍取决于线的斜率。45°\
    \ 线的线宽只有同样长的像素段的水平或垂直线的 1/√2。\n\n  用水平或垂直像素段实现宽度选择的另一个问题是，不管斜率多少，所生成的线段的端点是水平的或垂直的，这对于较粗的线影响更突出。为此，可通过添加“线帽”（Line\
    \ Cap）来调整线端点的形状以给出更好的外观（见图）。\n\n  ![](img/dce279c4fd8230bfee452d9f1db7cf9c_370_0.png)\n\
    \n  线帽的一种形式是方帽，它通过调整所构成平行线的端点位置，使粗线的显示具有垂直线段路径的正方形端点。例如，指定线的斜率为 m，那么粗线的方端的线斜率为\
    \ −1/m。另一种线帽是圆帽，它通过对每个方帽添加一个填充的半圆而得到。\n\n  圆的圆心在线的端点，其直径与线宽相等。第三种线帽是突方帽，这里我们简单地将线向两端延伸一半线宽并添加方帽即可。\n\
    \n  生成粗线的其他方法还有将显示线段看作填充长方形，或用选定的笔或刷样式来生成线段。为了得到线边界的长方形表示，可沿垂直于线段路径方向计算长方形顶点的位置，以使顶点坐标与线段端点间距离为线宽的一半。而后可以给填充的长方形添加圆帽或延伸其长度来显示突方帽。\n\
    \n  生成粗折线则需要一些额外的考虑。通常，显示单根线段所用方法不能生成光滑连接的折线段。例如，用水平或垂直段显示粗线会在不同斜率的线段的连接处，水平段变成垂直段或垂直段变成水平段时留下间隙。解决的办法是在线端点进行额外的处理来生成光滑连接的粗折线。下图给出了两线段光滑连接的三种方法。斜角连接\
    \ 通过延伸两条线的外边界直到它们相交；圆角连接 通过用直径等于线宽的圆弧边界将两线段的外边界连接而成；斜切连接 通过用方帽和在两线段处的三角形间隙中填充来完成。\n\
    \n  1   1   1\n  1   1   1\n  1   1   1\n\n  ![](img/dce279c4fd8230bfee452d9f1db7cf9c_374_0.png)\n\
    \n  通过改变模板的尺寸，用笔或刷形状可以生成多种线宽。例如，上图中的长方形笔线可以收缩成 2×2 长方形模板或放大成 4×4 模板。通过将式样值加到笔或刷标记上，也可以按选定的式样显示线段。\n\
    \n- **4. 线颜色**\n\n  当系统提供颜色（或亮度）选择时，给出当前颜色索引的参数包括在系统属性值表中。画线程序以当前颜色显示线段，是通过调用函数\
    \ `setColor` 将这种颜色设置在帧缓冲器中沿线段路径的像素位置处来实现。颜色选择的数目取决于帧缓冲器中每个像素有效值的数目。\n\n### 3.8.2\
    \ 字符属性\n\n字符属性包括字体、大小、颜色、方向等。属性既可对整个字符串设置，也可对定义为标记符号的单个字符设置。\n\n- **1. 文本属性**\n\
    \n  字体是首选的字符属性，用一组预先定义的网格图案或用多边形和样条曲线设计的字符集来确定。设置字体的函数是：`setTextFont(tf)`\n\n\
    \  其中，字体参数 tf 为一整数值，用来选择指定的字体和相应的风格。\n\n  显示文本的颜色设置存储在系统属性表中，并由字符定义装入帧缓冲器中的程序使用。要显示字符串时，按对应的字符形状和位置使用当前颜色来设置帧缓冲器中的像素值。文本颜色由下列函数来控制和管理：`setTextColorIndex(tc)`\n\
    \n  其中，文本颜色参数 tc 指定一个允许的颜色码。\n\n  文本大小通过缩放字符的整体尺寸（高度和宽度）或仅缩放字符的宽度来实现。字符大小按磅 (points)\
    \ 为单位或字号来指定，其中一磅是 1/72 英寸。但是，具有相同磅数的不同字体按其字体设计的不同而有不同的字符大小。在指定大小的一种字体中的所有字符的底线和顶线间的距离是相同的，但字体的宽度可能不同。字符高度定义为字符基线和帽线间的距离。\n\
