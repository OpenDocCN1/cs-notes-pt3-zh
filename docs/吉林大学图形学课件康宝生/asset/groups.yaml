    # 总结以上这些变化后的图形结果，可以得到这样的结论：


    +   (1) 图形变化了，但原图形的构成规则（拓扑关系）没有改变；


    +   (2) 图形发生的变化，是因为其顶点位置（几何关系）的改变决定的。这种通过维持图形的拓扑关系不变，而仅改变图形的几何关系来实现改变图形的方法，我们称之为图形的几何变换。


    既然图形的几何变换仅和点的位置变化有关，所以我们首先要讨论一个点在空间的位置及其变化。'
  - '[PAGE 526]


    由于点可以用一个列向量来表示，那么要改变一个点的位置，就意味着要改变这个向量（大小及方向）。


    对向量的运算通常用矩阵运算来实现。假如原顶点坐标为：


    ```

    [x]

    [y]

    ```


    经变换后的坐标为：


    ```

    [x*]

    [y*]

    ```


    那么用矩阵表示的变换过程为：'
  - "[PAGE 527]\n\n$$\begin{bmatrix} x^* \\ y^* \\end{bmatrix} = T \\cdot \begin{bmatrix}\
    \ x \\ y \\end{bmatrix}$$ \n\n这是一个线性变换，其中的 **T** 为线性变换矩阵，它是一二阶方阵。一个二维线性变换的一般形式也可以写成如下的代数式：\n\
    \n$$x^* = a_1 \\cdot x + b_1 \\cdot y + c_1$$ \n\n$$y^* = a_2 \\cdot x + b_2 \\\
    cdot y + c_2$$ \n\n转换为矩阵形式，就是：\n\n$$\begin{bmatrix} x^* \\ y^* \\end{bmatrix}\
    \ = \begin{bmatrix} a_1 & b_1 & c_1 \\ a_2 & b_2 & c_2 \\end{bmatrix} \\cdot \b\
    egin{bmatrix} x \\ y \\ 1 \\end{bmatrix}$$"
  - '[PAGE 528]


    上面所说一个线性变形的矩阵形式和代数形式的统一， 必须对点向量的表示法稍作修改，即：


