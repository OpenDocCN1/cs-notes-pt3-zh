    \n# Step 1. 将位于扫描线 y = e 上的所有像素都着上值为 B_color 的颜色：\n\n```\nfor (x = Screen_xmin;\
    \ x <= Screen_xmax; x++)\n    framebuffer (x, e) = B_color;\n```\n\n# Step 2.\
    \ 对于扫描线 y = e 上的横坐标大于 x_i 的像素求余——称为向右求余："
