    - 属性功能 属性是输出图元的特性，即描述一个特定图元是怎样被显示的。它们包括强度和彩色设定、线型、文本类型以及区域填充模式等。

    - 几何变换功能 包括模型变换和视图变换。

    - 观察变换功能 用来指定一种观察和视图在输出显示区域上出现的位置和范围。


    - 图形段功能 定义图形的逻辑部件，并对其进行操作。


    - 输入功能 控制和处理来自交互输入设备的数据流。


    - 通用控制功能 事务任务的处理，如清屏、初始化等。


    ## 3. 图形软件包的性质


    - （1）简单性 图形软件包的概念、使用方法均要求简单，以便程序员的理解和应用。


    - （2）一致性 坐标系的取法、子程序的名字、错误的处理方式等方面均要一致。


    （3）完整性 用户通过图形软件包可以充分利用计算机的各种资源进行绘图，最好能提供某些用户自己实现起来较困难的图形功能。


    （4）友善性 对用户发生在调用软件包时的错误，只要不影响其他程序的执行，则要求能自动纠正。对于只影响局部工作的错误，可以指明存在的错误，程序跳过这个局部，继续执行其余部分。


    ## 4. 图形软件标准


    标准化图形软件的最初目标是可移植性。当软件包在标准图形功能之上设计时，可以方便地从一个硬件系统移植到另一个，并且用于不同的实现和应用。如果没有标准，为一个硬件系统设计的程序，不经过大量的重写，常常不能移植到另一系统。


    国际和许多国家的标准化组织进行了合作，努力开发能被大家接受的计算机图形标准。在进行了相当艰苦地努力之后，推出了GKS (Graphics Kernel System)。这个系统成为国际标准化组织
    ISO 和许多国家标准化组织包括中国标准化组织所接受的第一个图形软件标准。虽然 GKS 最初的设计是一个二维图形软件包，但三维 GKS 扩充随后就开发出来。已开发出来并得到标准化组织批准的第二个图形软件标准是
    PHIGS (Programmer’s Hierarchical Interactive Graphics System)，这是 GKS 的扩充。PHIGS
    增加的功能有对象建模、彩色设定、表面绘制和图形管理。此后，PHIGS 的扩充称为 PHIGS⁺ 被开发出来提供 PHIGS 所没有的三维表面明暗处理能力。


    标准图形函数定义为独立于任何程序设计语言的一组规范，语言联编 (Language binding) 则是为特定的高级程序语言而给出的从该语言去访问各种标准图形函数的语法。


    例如，为指定 n−1 条相连的二维直线段序列，PHIGS 和 GKS 函数的一般形式为：


    ```

    polyline (n, x, y)

    ```


    在 FORTRAN 中，该过程用名为 GPL 的子程序来实现。使用 FORTRAN 的用户，以子程序调用语句 CALL GPL(N, X, Y)来调用该过程。在
    C 中，该过程以 ppolyline(n, pts) 形式调用。每个语言联编定义为对相应语言能力做最好的利用，并处理各种语法问题，如数据类型、参数传递和错误。


    虽然 PHIGS 和 GKS 作为基本图形规范出现，它并不提供对输出设备图形接口的一套标准方法学，也不规定存储和发送图形的方法。这些领域的各自标准已经开发出来。设备接口方法的标准在
    CGI (Computer Graphics Interface) 系统中给出，而 CGM (Computer Graphics Metafile) 系统规定了图形存档和传输标准。


    图形软件标准按其应用分为数据接口标准和子程序接口标准两大类。数据接口标准用来确定各界面之间数据传递和通讯的标准；而子程序接口标准则规定应用程序调用子程序的功能及格式的标准。


