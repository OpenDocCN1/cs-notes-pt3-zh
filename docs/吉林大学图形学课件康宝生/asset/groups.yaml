    ## 第二种连接法


    在第二种连接方式的(n−2)条抛物线中，第 i 条抛物线的方程应为：


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_432_0.png)


    S_i(t_i) = (2t_i^2 - 3t_i + 1)P_i + (4t_i - 4t_i^2)P_{i+1} + (2t_i^2 - t_i)P_{i+2}


    第 i+1 条抛物线的方程应为：


    S_{i+1}(t_{i+1}) = (2t_{i+1}^2 - 3t_{i+1} + 1)P_{i+1} + (4t_{i+1} - 4t_{i+1}^2)P_{i+2}
    + (2t_{i+1}^2 - t_{i+1})P_{i+3}


    (0 ≤ t_i, t_{i+1} ≤ 1)


    一般来说，两段曲线 S_i 和 S_{i+1} 在其重叠区间是不可能完全自然重合的（见图）。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_433_0.png)


    但是，整个点列必须是只能用一条曲线连接起来的。为了做到这一点，在两条曲线的共同区间内，必须想法让它们按照一定的规则结合组成一条曲线。有效的办法就是加权合成。


    所谓的加权合成，就是用权函数来分配原曲线在形成的合成曲线中各自所占的比例。


    设两个权函数分别为：


    $$f_1(T)=1-T,\quad f_2(T)=T\qquad (0\leq T\leq 1)$$


    则加权合成后的曲线为：


    $$P_{i+1}(t)=f_1(T)S_i(t_i)+f_2(T)S_{i+1}(t_{i+1})$$


    在同一个参数方程中，出现了三个参变量：T、t_i 和 t_{i+1}。所以，为了使下面的工作得以进行，首先要统一参变量。对于


    f(T): 0 ≤ T ≤ 1

    S_i(t_i): 0.5 ≤ t_i ≤ 1

    S_{i+1}(t_{i+1}): 0 ≤ t_{i+1} ≤ 0.5


    我们设统一后的参变量为 t，并且使其定义域为：0 ≤ t ≤ 0.5，则有：


    T = 2t,  t_i = 0.5 + t,  t_{i+1} = t


    于是，合成曲线的表达式：


    $P_{i+1}(t)=f_1(T)S_i(t_i)+f_2(T)S_{i+1}(t_{i+1})$


    可以改写成以下形式：


    $P_{i+1}(t)=(1-2t)S_i(t+0.5)+2tS_{i+1}(t)$


    其中：


    $S_i(t+0.5)=(2t^2-t)P_i+(1-4t^2)P_{i+1}+(2t^2+t)P_{i+2}$


    $S_{i+1}(t)=(2t^2-3t+1)P_{i+1}+(4t-4t^2)P_{i+2}+(2t^2-t)P_{i+3}$


    $(0\leq t\leq 0.5)$


    把新的 $S_i$ 和 $S_{i+1}$ 代入 $P_{i+1}(t)$，得到：


    $P_{i+1}(t)=(-4t^3+4t^2-t)P_i+(12t^3-10t^2+1)P_{i+1}$


    $\quad\quad\quad\quad\quad\quad+(-12t^3+8t^2+t)P_{i+2}+(4t^3-2t^2)P_{i+3}$


    0 ≤ t ≤ 0.5,  i = 1, 2, 3, ⋯, n−3


