    \n其中，上式中各控制顶点由下列递推关系式：\n\nP_{i,j}^{k,l}= { P_{i,j}, k=l=0; (1-u)P_{i,j}^{k-1,0}+uP_{i+1,j}^{k-1,0},\
    \ k=1,2,⋯,m; l=0; (1-v)P_{0,j}^{m,l-1}+vP_{0,j+1}^{m,l-1}, k=m; l=1,2,⋯,n } (5)\n\
    \n或\n\nP_{i,j}^{k,l} = { P_{i,j} , k = l = 0 ; (1 - v) P_{i,j}^{0,l-1} + v P_{i,j+1}^{0,l-1}\
    \ , k = 0; l = 1, 2, ⋯, n ; (1 - u) P_{i,0}^{k-1,n} + u P_{i+1,0}^{k-1,n} , k\
    \ = 1, 2, ⋯, m; l = n } (6)\n\n决定， i = 0, 1, ⋯, m; j = 0, 1, ⋯, n。\n\n式（5）和式（6）给出了确定曲面上一点的两种方案。当按式（5）方案执行时，先以\
