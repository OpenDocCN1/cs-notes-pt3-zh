    分量均为正，所以它们都是凸多边形。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_338_0.png)


    （2）旋转法。沿多边形逆时针前进，将多边形顶点 Vₖ 平移到坐标原点，然后顺时针旋转多边形，使下一顶点 Vₖ₊₁ 在 x 轴上。'
