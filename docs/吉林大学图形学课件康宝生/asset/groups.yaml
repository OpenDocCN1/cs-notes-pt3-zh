    \ 和 $D_{SE}$ 在每一步都要变化，且依赖于上一步所选像素点 $P$ 的坐标 $x_i$ 和 $y_i$。称 $P$ 为估计点。在每一步，我们直接将上一步所选像素的\
    \ $x$ 和 $y$ 坐标值代入增量计算公式，就得到了新的增量。由于计算公式是线性的，所以其直接计算的开销不大。\n\n下面，我们还需要确定判定函数 $d$\
    \ 的初值。由于限定该算法处理的圆的半径为整数，并只画八分之一圆弧，因此，圆的起始像素是 $(0, R)$，而下一个中点的位置是 $(1, R - 1/2)$，因此\n\
    \n$d_{start} = F(1, R - 1/2) = 1 + (R - 1/2)^2 - R^2 = 5/4 - R$\n\n该算法的实现程序如程序\
    \ 3.3.2 所示，其结构与画直线的算法很相似。\n\n## 程序 3.3.2 中点圆扫描转换算法\n\n```\nvoid MidpointCircle(int\
    \ radius, int Color)\n{\n    int x, y;\n    float d;\n    x = 0; y = radius; d\
    \ = 5.0/4 - radius;\n    CirclePoints (0, 0, x, y, Color);\n    while(x < y) {\n\
    \        if (d < 0) {d += x*2.0 + 3;}\n        else {d += (x - y)*2.0 + 5; y--\
    \ ;}\n        x++;\n        CirclePoints (0, 0, x, y, Color);\n    }\n}\n```\n\
    \n算法 3.3.2 的不是由于判定函数 $d$ 的初值是浮点数，因此算法必须做浮点数的算术运算。我们希望有一个效率更高的只进行整数运算的算法。为此，我们定义一个新的判定函数：\n\
    \n$$h=d-1/4$$\n\n这样在初始化时，$h=1-R$，而条件 $d<0$ 变成了 $h<-1/4$。由于 $h$ 的初值是整数，且其相应的增量也是整数，因此我们可将条件\
    \ $h<-1/4$ 改为 $h<0$。这样算法就变成了关于 $h$ 的只进行整数运算的形式。为了与画直线算法保持一致性，我们仍然用 $d$ 表示决策函数。改进后的算法如程序\
    \ 3.3.3 所示。\n\n## 程序 3.3.3 扫描转换圆的整数型中点算法\n\n```\nvoid MidpointCircle(int radius,\
    \ int Color)\n{\n    int x, y, d;\n    x = 0; y = radius; d = 1 - radius;\n  \
    \  CirclePoints (0, 0, x, y, Color);\n    while(x < y){\n        if (d < 0) {\
    \ d += x*2 + 3; }\n        else { d += (x - y)*2 + 5; y--; }\n        x++;\n \
    \       CirclePoints (0, 0, x, y, Color);\n    }\n}\n```\n\n## 例 3-3-2. 用中点算法画圆心为\
    \ O(0, 0)，半径为 R = 10 的八分之一圆弧。\n\n| d | x | y |\n|---|---|---|\n| -9 | 0 | 10 |\n\
    | -6 | 1 | 10 |\n| -1 | 2 | 10 |\n| 6 | 3 | 10 |\n| -3 | 4 | 9 |\n| 8 | 5 | 9\
    \ |\n| 5 | 6 | 8 |\n| 7 | 7 |  |\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_193_0.png)\n\
    \n我们也可以对增量计算方法进一步拓展，由此改善画圆的中点算法效率。我们知道任一个多项式都可以按增量方式进行计算，这就是差分。差分的基本思想是计算函数在其相邻两个点上的值以及这两个值的差。\n\
    \n对于中点画圆算法来说，在当前的迭代中，如果选择了E，则估计点从 (x_i, y_i) 变化到 (x_i + 1, y_i)。显然，在点 (x_i, y_i)\
    \ 处的一阶差分为 Δ_Eold = 2x_i + 3。因此在点 (x_i + 1, y_i) 处的一阶差分为 Δ_Enew = 2(x_i + 1) +\
    \ 3，其二阶差分为 Δ_Enew - Δ_Eold = 2。\n\n类似地，在点(x_i, y_i) 处，Δ_SEold = 2x_i - 2y_i +\
    \ 5；点 (x_i +1, y_i) 处，\n\nΔ_SEnew = 2(x_i +1) - 2y_i + 5，因此二阶差分为 Δ_Enew - Δ_Eold\
    \ = 2。\n\n如果在当前的循环中选择了 SE，则估计点从 (x_i , y_i) 变化到 (x_i + 1, y_i - 1)。因此，在点 (x_i\
    \ + 1, y_i - 1) 处的一阶差分为 Δ_Enew = 2(x_i + 1) + 3，而二阶差分为 Δ_Enew - Δ_Eold = 2。\n\n\
    同样，在点(x_i + 1, y_i - 1)处，Δ_SEnew = 2(x_i + 1) - 2(y_i - 1) + 5，而相应的阶差分 Δ_Enew\
    \ - Δ_Eold = 4。\n\n于是，改进后的算法包括以下几个步骤：（1）根据上次循环所计算的判定函数 d 的值的符号选择一个像素；（2）运用上次循环所计算的相关\
    \ Δ_E 或 Δ_SE 对判定函数 d 的值进行修改；\n（3）根据像素的移动情况，用前面计算的差分常量修改 D_E 或 D_SE；（4）移动像素。D_E\
    \ 或 D_SE 使用起始像素进行初始化。改进后的程序如程序 3.3.4 所示。\n\n## 程序 3.3.4 基于二阶差分的中点圆扫描转换算法\n\n```\n\
    void MidpointCircle (int radius, int Color)\n{\n    int x, y, d, deltaE, deltaSE;\n\
    \    x = 0; y = radius; d = 1 - radius; deltaE = 3; deltaSE = 5 - radius*2;\n\
    \    CirclePoints (0, 0, x, y, Color);\n    while( x < y ) {\n        if (d <\
    \ 0) {\n```\n\n```\nd += deltaE; deltaE +=2; deltaSE += 2;\n}\nelse {\n    d +=\
    \ deltaSE; deltaE +=2; deltaSE += 4; y--;\n}\n x ++;\n CirclePoints(0, 0, x, y,\
    \ Color);\n}\n}\n```\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_197_0.png)\n"
