    # (2) 沿 y 轴方向的错切变换


    沿 y 轴方向的错切变换矩阵为：


    ⎡ 1  0  0 ⎤

    ⎢ r₂₁ 1  0 ⎥

    ⎣ 0  0  1 ⎦


    其变换结果为：


    ⎡ x* ⎤   ⎡ 1  0  0 ⎤ ⎡ x ⎤   ⎡   x   ⎤

    ⎢ y* ⎥ = ⎢ r₂₁ 1  0 ⎥ · ⎢ y ⎥ = ⎢ y + r₂₁ x ⎥

    ⎣ 1  ⎦   ⎣ 0  0  1 ⎦ ⎣ 1 ⎦   ⎣   1   ⎦


    即： x* = x； y* = y + r₂₁ x。'
  - '[PAGE 544]


    # 4. 旋转变换


    在二维平面内，如不加说明，则所说旋转变换是指图形绕坐标系原点旋转。且逆时针旋转，角度 θ 取正值；顺时针旋转，角度 θ 取负值。旋转变换矩阵为：


    ```

    \begin{bmatrix} \cos\theta & -\sin\theta & 0 \\ \sin\theta & \cos\theta & 0 \\
    0 & 0 & 1 \end{bmatrix}

    ```


    其变换结果为：


    ```

    \begin{bmatrix} x^* \\ y^* \\ 1 \end{bmatrix} = \begin{bmatrix} \cos\theta & -\sin\theta
    & 0 \\ \sin\theta & \cos\theta & 0 \\ 0 & 0 & 1 \end{bmatrix} \cdot \begin{bmatrix}
    x \\ y \\ 1 \end{bmatrix} = \begin{bmatrix} x \cdot \cos\theta - y \cdot \sin\theta
    \\ x \cdot \sin\theta + y \cdot \cos\theta \\ 1 \end{bmatrix}

    ```'
  - '[PAGE 545]


    如图所示，由于：


    x* = r·cos(α + θ) = r·cos α cos θ − r·sin α sin θ = x cos θ − y sin θ


    y* = r·sin(α + θ) = r·sin α cos θ + r·cos α sin θ = x sin θ + y cos θ


    由此得到旋转变换矩阵。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_545_0.png)


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_545_1.png)'
  - '[PAGE 546]


    # 5. 平移变换


    平移变换矩阵为：


    ```

    [ 1 0 t_x ]

    [ 0 1 t_y ]

    [ 0 0 1 ]

    ```


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_546_0.png)


    其变换结果为：


    ```

    [ x* ]   [ 1 0 t_x ] [ x ]   [ x + t_x ]

    [ y* ] = [ 0 1 t_y ]·[ y ] = [ y + t_y ]

    [ 1  ]   [ 0 0 1   ] [ 1 ]   [ 1      ]

    ```'
  - '[PAGE 547]


    # 5.2.2 二维组合变换


    在前面介绍的五种变换都属于基本变换。但实际应用中，大部分图形的变换是不能仅靠单独的基本变换来实现的，而是需要经多次变换才能实现。这种由多个基本变换组合（级联）而成的复杂变换过程称为组合变换。


    # 1. 对任意直线的对称变换


    前面介绍过五种对称变换，但对称轴都是特殊位置直线。对于对称轴是任意位置直线的对称变换，以上的对称变换矩阵都不能直接应用。'
  - '[PAGE 548]


    例如，设任意直线的方程为：


    $$Ax+By+C=0$$


    该直线在 $x$、$y$ 两轴上的截距分别为 $-C/A$ 和 $-C/B$；直线的斜率为 $\tan\alpha=-A/B$。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_548_0.png)


    那么，如何实现关于该直线的对称变换呢？'
