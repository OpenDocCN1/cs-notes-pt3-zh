  - '[PAGE 204]


    设要绘制的圆的圆心为 C(x_c, y_c)，半径为 R。求圆的内接多边形的常用方法有以下两种。


    # 方法 1.（基于圆的极坐标表示）设圆的内接多边形的第 i 个顶点是 P_i(x_i, y_i)，CP_i 的幅角是 θ_i，则：


    x_i = x_c + R cos θ_i,  y_i = y_c + R sin θ_i


    设多边形每条边所对应的圆心角为 α，那么下一个顶点 P_{i+1} (x_{i+1}, y_{i+1}) 的坐标是：


    x_{i+1} = x_c + R cos(θ_i + α) = x_c + (x_i - x_c) cos α - (y_i - y_c) sin α

    y_{i+1} = y_c + R sin(θ_i + α) = y_c + (x_i - x_c) sin α - (y_i - y_c) cos α'
  - '[PAGE 205]


    采用矩阵表示，则有：


    \begin{bmatrix} x_{i+1} \\ y_{i+1} \end{bmatrix} = \begin{bmatrix} \cos\alpha
    & -\sin\alpha \\ \sin\alpha & \cos\alpha \end{bmatrix} \begin{bmatrix} x_i - x_c
    \\ y_i - y_c \end{bmatrix} + \begin{bmatrix} x_c \\ y_c \end{bmatrix} = A \begin{bmatrix}
    x_i - x_c \\ y_i - y_c \end{bmatrix} + \begin{bmatrix} x_c \\ y_c \end{bmatrix}


    上式是计算圆的内接正多边形的递推公式。因为 sinα, cosα 只要在开始时计算一次。这样求一个顶点只需要做 4 次乘法。


    上式可用于高速绘图机绘图。用两个微处理器作管道式处理，前一个计算正多边形的顶点，后一个只生成直线。如果不考虑绘图机笔架运动的加速度的限制，绘制半径为 R 的圆几乎和'
  - '[PAGE 206]


    绘一条长为 2πR 的直线花同样的时间。该方法亦可用于椭圆内接多边形的计算。设椭圆的长短半周分别为 a 和 b，中心点坐标为 C(x_c, y_c)，对称轴平行坐标轴，则该椭圆的参数方程是：


    x - x_c = a cosθ,    y - y_c = b sinθ


    设椭圆的内接多边形的第 i 个顶点为 P_i (x_i, y_i)，CP_i 的幅角是 θ_i，其中：


    x_i - x_c = a cosθ_i, y_i - y_c = b sinθ_i


    那么，第 i + 1 个顶点 P_{i+1} (x_{i+1}, y_{i+1}) 的坐标满足：


    x_{i+1} - x_c = a cos(θ_i + α), y_{i+1} - y_c = b sin(θ_i + α)'
  - '[PAGE 207]


    由此，可得：


    ```

    \begin{bmatrix} x_{i+1} - x_c \\ y_{i+1} - y_c \end{bmatrix} = \mathbf{M} \begin{bmatrix}
    x_i - x_c \\ y_i - y_c \end{bmatrix}

    ```


    ```

    \mathbf{M} = \begin{bmatrix} \cos \alpha & -\dfrac{a}{b}\sin \alpha \\ \dfrac{b}{a}\sin
    \alpha & \cos \alpha \end{bmatrix}

    ```


    上式便是计算椭圆的内接多边形顶点的递推公式。如果对此由此生成的椭圆作旋转 β 角度或缩放变换，则要分别用变换矩阵：'
  - "[PAGE 208]\n\nT_R = [ cos β  sin β ] 或 T_S = [ S_x  0 ]\n      [ sin β  cos β\
    \ ]       [ 0    S_y ]\n\n如果两个变换都做，则变换矩阵为这两个矩阵的乘积 T = T_R·T_S。这时，只要用 TMT⁻¹ 代替上式中的\
    \ M，便可得到变换后的椭圆的内接多边形的顶点坐标。事实上，上式可由圆的递推公式经过缩放变换求得。\n\n# 方法 2.\n\n设圆的内接多边形的三个相邻顶点是\
    \ P_{i-1}(x_{i-1}, y_{i-1}), P_i(x_i, y_i) 和 P_{i+1}(x_{i+1}, y_{i+1})，由于下图中的\
    \ P_{i-1}B 平行 CP_{i+1}， P_{i+1}B 平行 CP_{i-1}，所以："
  - '[PAGE 209]


    CB⃗ = CP⃗_{i-1} + CP⃗_{i+1} = 2 cos α CP⃗_i


    即


    CP⃗_{i+1} = 2 cos α CP⃗_i − CP⃗_{i-1}


    表示成坐标分量形式，则有：


    [x_{i+1} - x_c; y_{i+1} - y_c] = 2 cos α [x_i - x_c; y_i - y_c] - [x_{i-1} - x_c;
    y_{i-1} - y_c]


    显然，这比方法 1 节省计算量，求一个顶点只要做二次乘法，但开始需要知道圆上相邻的两个内接多边形顶点。


