  md: "\n## 7.6 NURBS 曲面\n\n### 7.6.1 NURBS 曲面的定义\n\n给定 $(n+1)\\times(m+1)\\,(n\\\
    ge k,\\ m\\ge l)$ 个空间点 $d_{ij}$ 和权因子 $\\omega_{ij}$, $i=0,1,\\cdots,n;\\ j=0,1,\\\
    cdots,m$, 张量积参数曲面：\n\n$R(u,v)=\\frac{\\sum_{i=0}^{n}\\sum_{j=0}^{m}\\omega_{ij}d_{ij}N_{ik}(u)N_{jl}(v)}{\\\
    sum_{i=0}^{n}\\sum_{j=0}^{m}\\omega_{ij}N_{ik}(u)N_{jl}(v)},\\ u\\in[u_{k-1},u_{n+1}],v\\\
    in[v_{l-1},v_{m+1}]$\n\n称为 $k\\times l$ 阶的 NURBS 曲面。 $d_{ij}$ 叫做曲面的控制顶点，它们顺序构成的空间四边网格叫做曲面的控制网格。\
    \ $N_{ik}(u)$、$N_{jl}(v)$\n\n分别为节点向量 $U = \\{u0, u1, ..., un+k\\}$ 和 $V = \\{v0,\
    \ v1, ..., vm+l\\}$ 定义。权因子 $\\omega_{ij}$ 满足条件： $\\omega_{00}, \\ \\omega_{0n},\
    \ \\ \\omega_{m0}, \\ \\omega_{mn} > 0$。\n\n$$R_{i,k,j,l}(u,v)=\\frac{\\omega_{ij}N_{ik}(u)N_{jl}(v)}{\\\
    sum_{i=0}^{m}\\sum_{j=0}^{n}\\omega_{ij}N_{ik}(u)N_{jl}(v)}$$\n\n称为双变量有理基函数。\n\
    \n### 7.6.2 NURBS 曲面的性质\n\nNURBS 曲面除具有 B 样条曲面的类似性质之外，还具有下述的重要性质：\n\n### 7.6.3\
    \ NURBS 曲面的求值算法\n\n基于齐次坐标的观点，NURBS 曲面可看作是四维空间的 B 样条曲面在三维空间的中心投影变换下的像。因此，一张 k×l\
    \ 阶的 NURBS 曲面的求值可按以下步骤进行：\n\n- Step1. 由控制顶点 d_ij 和权因子 ω_ij 确定带权控制顶点：\n- D_ij =\
    \ [ω_ij d_ij, ω_ij], i = 0, 1, …, m; j = 0, 1, …, n\n\n- Step2. 用带权控制顶点 D_ij 定义\
    \ k×l 阶 B 样条曲面：\n- D(u, v) = Σ_{i=0}^{m} Σ_{j=0}^{n} D_ij N_i^k(u) N_j^l(v)\n\n\
    Step3. 用 B 样条曲面的 de Boor-Cox 算法计算曲面 D(u, v).\n\nStep4. 以坐标原点为投影中心、超平面 ω = 1 为投影平面，对\
    \ D(u, v) 做投影变换，即得 NURBS 曲面 R(u, v)。\n\n## 7.7 Coons 曲面\n\nCoons 曲面造型方法是由 MIT\
    \ 的 S. A. Coons 于1964 年提出的。Bézier 曲面、B 样条曲面以及 NURBS 曲面的特点是曲面逼近控制网格，而 Coons 曲面的特点是插值，即构造出的曲面满足给定的边界条件，如通过给定边界，具有给定的跨边界导矢等等，所以有时\
    \ Coons 曲面亦称作超限插值曲面。常用的 Coons 曲面有三种。\n\n### 7.7.1 双线性混合 Coons 曲面片\n\n给定由四条参数曲线围成的空间封闭曲边四边形，使两对边\n\
    \n分别定义在 $u\\in[0,1]$ 与 $v\\in[0,1]$，要求构造一张以这四条曲线为边界曲线的曲面：\n\n$$P(u,v),\\quad 0\\\
    leq u,v\\leq 1$$\n\n即，已知曲面 $P(u,v)$ 的四条边界曲线 $P(u,0)$、$P(u,1)$、$P(0,v)$、$P(1,v)$，求该曲面。\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_698_0.png)\n\n这个问题有无穷多解，其中的一种就是双线性混合\
    \ Coons 曲面。在每一对边界曲线间由线性插值构造直纹面，如图所示：\n\n```\n\\left\\{ \\begin{array}{l} q(u,\
    \ v) = (1-u)P(0,v) + uP(1,v) \\\\ r(u, v) = (1-v)P(u,0) + vP(u,1) \\end{array}\
    \ \\right. , \\ 0 \\leq u, v \\leq 1\n```\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_699_0.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_699_1.png)\n\n两张曲面 q(u, v) 与 r(u, v)\
    \ 简单叠加并减去曲面片四个角点决定的一张双线性张量积曲面：\n\ns(u, v) = [1−u  u] [ P(0,0)  P(0,1) ; P(1,0)\
    \  P(1,1) ] [ 1−v ; v ], 0 ≤ u, v ≤ 1\n\n即得到所求的双线性混合 Coons 曲面：\n\nP(u, v) = q(u,\
    \ v) + r(u, v) − s(u, v)\n\nP(u, v) 可进一步改写成矩阵形式：\n\nP(u, v) = −[−1  1−u  u] [\
    \ 0  P(u,0)  P(u,1) ; P(0,v)  P(0,0)  P(0,1) ; P(1,v)  P(1,0)  P(1,1) ] [ −1 ;\
    \ 1−v ; v ], 0 ≤ u, v ≤ 1\n\n上式右端的三阶方阵包含了曲面的全部边界信息，称之为边界信息矩阵。其右下角二阶子块的4个矢量是曲面边界的端点，称之为曲面的角点。\n\
    \n上面已经构造了双线性 Coons 曲面片，可以看出，用它来进行曲面拼合时，可以自动保证整张曲面在边界上的位置连续。\n\n### 7.7.2 局部双三次混合\
    \ Coons 曲面片\n\n双线性混合 Coons 曲面片利用了两对线性混合函数。有许多其他的混合函数也能用来满足插值曲面四条边界的要求，惟\n\n一的限制是每对混合函数之和恒等于\
    \ 1。\n\n采用两对三次混合函数：\n\nF₀(u) = 1 − 3u² + 2u³, F₁(u) = 3u² − 2u³\n\nG₀(v) = 1 −\
    \ 3v² + 2v³, G₁(v) = 3v² − 2v³\n\n则得到局部双三次混合 Coons 曲面片：\n\nP(u, v) = −[−1  F₀(u)\
    \  F₁(u)] [ 0  P(u,0)  P(u,1) ] [−1]  0 ≤ u, v ≤ 1\n                         \
