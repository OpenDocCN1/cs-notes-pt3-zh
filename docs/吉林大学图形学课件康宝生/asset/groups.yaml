  - '[PAGE 643]


    # 7.1 参数曲面的基本概念


    和曲线一样，曲面也有显示表示、隐式表示和参数表示，计算机图形学中最常用的是参数表示。通常采用矩形域作为曲面的参数域。


    一张定义在矩形参数域上的参数曲面可以表示为；


    x = x(u, v)

    y = y(u, v),   (u, v) ∈ [0, 1] × [0, 1]

    z = z(u, v)


    记为 P(u, v) = ( x(u, v), y(u, v), z(u, v) ), (u, v) 称为参数。'
  - "[PAGE 644]\n\n# 参数曲面中常见的基本概念如下：\n\n+   1. 曲面上的点 将参数 u₀, v₀ 代入参数方程，可得曲面上的点 P(u₀,\
    \ v₀)。\n\n+   2. 曲面上一点的切向量（切矢） 对给定的参数 u₀,v₀，曲面上的点 P(u₀, v₀)处的 u 向切矢和 v 向切矢分别为：\n\
    +   \n+   $$\\frac{\\partial P(u,v)}{\\partial u} \\bigg|_{u=u_0, v=v_0}$$\n+\
    \   \n+   $$\\frac{\\partial P(u,v)}{\\partial v} \\bigg|_{u=u_0, v=v_0}$$\n\n\
    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_644_0.png)\n\n+   3. 曲面上一点的法向量（法矢） 对给定的参数\
    \ u₀,v₀，曲面上的点 P(u₀, v₀)处的 法向量为："
