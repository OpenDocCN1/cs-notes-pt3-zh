    Euler 公式给出了形体的点、边、面、体、环、通孔数目之间的关系，在对形体的结构进行修改时，必须要保证扩展 Euler 公式成立，才能保证形体的有效性。由此而构造出一套操作，完成对形体局部几何元素的修改。修改过程中保证各几何元素的数目保持扩展
    Euler 公式成立。这一套操作就是 Euler 操作。


    最为常用的 Euler 操作如下：


    - MEV(v₁, v₂, e)：生成一个新的顶点 v₂，连接到已有的点 v₂，构成一条新边 e；

    - MEF(v₁, v₂, f₁, f₂, e)：连接面 f₁ 上的两个点 v₁, v₂，生成一条新边 e，并产生一个新面 f₂；

    - MV SF(v, f)：生成一个含有点 v 的面 f，并构成一个新体。


    - MEKR(v₁,v₂,e)：连接两个点 v₁,v₂，生成一条新边 e，并删除掉 v₁和 v₂所在面上的一个内环；

    - MFKRH(f₁,f₂)：删除面 f₁上的一个内环，生成一个新的面 f₂，删除体上的一个通孔。


    上述五种 Euler 操作所对应的补操作是：


    - KEV(e,v)：删除一条边 e 和该边一个端点 v；

    - KEF(e,f)：删除一条边 e 和该边一个邻面 f；

    - KVSF(v,f)：删除一个体，该体仅含有一个点 v 的面；

    - KEMR(e)：删除一条边 e，生成该边某一邻面上的一个内环；


    ## Northwest University


    ## 计算机图形学


    KFM RH(f1, f2): 删除与面 f1 相邻接的一个面 f2，生成面 f1 上的一个内环，并形成体上的一个通孔。


    为了方便对形体的修改，还定义了两个辅助操作：


    - ◇ SEMV(e1, v, e2): 将边 e1 分割成两端，生成一个新的点 v 和一条新的边 e2；

    - ◇ JEKV(e1, e2): 合并两条相邻的边 e1, e2，删除它们的公共端点。


    可以证明，Euler 操作是有效的，即用 Euler 操作对形体操作的结果在物理上 是可实现的；Euler 操作是完备的，即任何形体都可用有限步骤的 Euler
    操作构造出来。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_741_0.png)


    以上的 Euler 操作仅适用于正则形体，非正则形体已不再满足 Euler 公式，但是，Euler 操作中对形体点、边、面、体几何元素作局部修改的原理仍然使用。Weiler
    定义了扩展的 Euler 操作来构造非正则形体，我们仍然把那一套操作性提拓扑结构的方法叫做 Euler 操作。


    ## 3. 实体的八叉树表示


    物体的八叉树表示是一种层次数据结构。首先对三维物体定义一个外接立方体，立方体的三组棱边分别与 x、y、z 轴平行，边长为 2^N。如果所表示的物体本身就是该立方体，则物体可用该立方体予以表示。否则将立方体等分为
    8 个子立方体，其边长为原立方体边长的一半。将八个子立方体依次编号为 0，1，…，7，编号规则如下图所示。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_744_0.png)


    若某一个小立方体完全在物体内部，则将此小立方体标识为“满”；若它完全在物体外部，则将其标识为“空”；否则，将其标识为“部分占有”，并继续等分为八块。依次方式，物体在计算机内可表示为一棵八叉树，凡标识为“满”或“空”的立方体均为终端结点，而标识为“部分占有”的立方体为非终端结点。


    最后，当分割生成的每一个小立方体的边长为单位长时，分割结束。此时，应该将每一个标识为“部分占有”的小立方体重 新标识为“满”或“空”。这就是物体的八叉树表示。


    采用八叉树表示物体的优点有：


    - （1） 物体间的集合运算十分简单，此时只需同时遍历表示物体的两棵八叉树，对相应的小立方体结点进行运算即可。

