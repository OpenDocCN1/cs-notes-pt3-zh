    \\\nP_T = \\Delta y, & Q_T = y_T - y_0\n\\end{cases}\n$$\n\n任何平行裁剪边界之一的直线满足条件$P_i\
    \ = 0$，若还满足$Q_i < 0$，则线段完全在边界外，舍弃该线段。若$Q_i \\ge 0$，则线段平行于裁剪边界并在窗口内，需用另外一组边界进行检查。\n\
    \n当 $P_i < 0$ 时，线段从裁剪边界延长线外部延伸到内部；当 $P_i > 0$ 时，线段从裁剪边界延长线内部延伸到外部。当 $P_i \\neq\
    \ 0$ 时，线段与边界 $i$ 的延长线的交点参数为：\n\n$$u = \\frac{Q_i}{P_i}, \\quad i = L,\\ R,\\ B,\\\
    \ T$$\n\n对于每条线段，可计算出参数 $u_1$、$u_2$，它们定义了在窗口内部的线段部分。$u_1$ 的值由线段从外到内遇到的边界 ($P_i\
    \ < 0$) 所决定。对于这些边界，计算：\n\n$$r_i = Q_i / P_i$$\n\n则：\n\n$$u_1 = \\max\\{0,\\ r_i\\\
    }$$\n\nu₂ 的值由线段从内到外遇到的边界 (Pᵢ > 0) 所决定。计算：\n\nrᵢ = Qᵢ / Pᵢ\n\n则：\n\nu₂ = min{1,\
    \ rᵢ}\n\n若 u₁ > u₂，则线段完全落在裁剪窗口之外，舍弃；若 u₁ ≤ u₂，则线段可见部分的两端点由参数 u₁、u₂ 计算而得。\n\n梁友栋-Barsky\
    \ 算法程序描述如下。线段与边界交点的参数初始化为 u₁ = 0，u₂ = 1。计算出各个裁剪边界的 P、Q 值，函数 ClipTest 用 P、Q 来判断是否舍弃线段还是改变交点的参数。当\
    \ P < 0 时，参数 r 用于更新 u₁，当 P > 0 时，参数 r 用于\n\n```\nelse if (p > 0.0){\n    r = q/p;\n\
    \    if (r < *u1) return FALSE;\n    else if (r < *u2)\n        *u2 = r;\n   \
    \     return TRUE;\n    }\n    else if (q < 0.0) return FALSE;\n}\n\nvoid LB_LineClip\
    \ ( x1, y1, x2, y2, XL, XR, YB, YT)\nfloat x1, y1, x2, y2, XL, XR, YB, YT;\n{\n\
    \    float u1 = 0.0, u2 = 1.0, dx = x2 - x1, dy = y2 - y1;\n    if (ClipTest (\
    \ - dx, x1 - XL, &u1, &u2))\n```\n\n```\nif(ClipTest(dx, XR − x1, &u1, &u2))\n\
    \    if(ClipTest(− dy, y1 − YB, &u1, &u2))\n        if(clipTest(dy, YT − y1, &u1,\
    \ &u2)){\n            if(u2 < 1.0){\n                x2 = x1 + u2*dx; y2 = y1\
    \ + u2*dy;\n            }\n            if(u1 > 0.0){\n                x1= x1 +\
    \ u1*dx; y1 = y1 + u1*dy;\n            }\n            displayline(x1, y1, x2,\
    \ y2)\n            return;\n        }\n    }\n```\n\n梁友栋-Barsky 算法比 Sutherland-Cohen\
    \ 算法更有效，因为需要计算的交点数目交少了。更新参数 u₁、u₂ 仅仅需要一次除法；线段与窗口的交点仅计算一次，就计算出 u₁、u₂ 的最后值。相比之下，即使一条完全落在裁剪窗口之外，Sutherland-Cohen\
    \ 算法也要对它反复求交点，而且每次求交都需要进行乘除法运算。Sutherland-Cohen 算法和梁友栋-Barsky 算法都可以扩展为三维裁剪算法。\n\
    \n## 4. Nicholl-Lee-Nicholl 算法\n\n简称 NLN 算法，通过在裁剪窗口周围创建多个区域的途径\n\n来避免对一条直线段的多次裁剪。在\
    \ Sutherland-Cohen 算法中，在找到与裁剪边界的交点之前或完全舍弃该线段之前，必须对一条线段进行多次求交计算；而 NLN 算法在求交计算前进行更多的区域测试来减少求交计算。与梁友栋-Barsky\
    \ 算法和 Sutherland-Cohen 算法相比，NLN 算法的比较次数和除法次数减少了，但该算法仅适用于二维直线段的裁剪，而梁友栋-Barsky 算法和\
    \ Sutherland-Cohen 算法可以很方便地推广到三维裁剪。\n\nNLN 算法的执行分为两步：\n\n（1）对于端点为 P₁、P₂ 的线段，首先决定\
    \ P₁ 相对于裁剪窗口的九个区域的位置，我们这里仅考虑三个区域，如下图所示。对于其他六个区域，可利用对称变换将其变为这三个区域中的任何一个区域。\n\n\
    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_320_0.png)\n\nNLN 裁剪算法中线段端点 P₁ 的三种位置\n\
    \n（2）判断端点 P₂ 相对于 P₁ 的位置，根据 P₁ 的位置在平面上建立新的区域，新区域的边界是由 P₁ 发出的穿过窗口角点的射线，如下图所示。\n\n\
    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_321_0.png)\n\nP₁ 在窗口内\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_321_1.png)\n\
    \nP₁ 在窗口左侧\n\n如果 P₁ 位于窗口内，P₂ 位于窗口外，我们设置四个裁剪区域：L、T、R 和 B。根据点 P₂ 所在区域，决定直线段和窗口边界的求交计算。如果\
    \ P₂ 在窗口内，则为可见线段。\n\n如果 P₁ 位于窗口左边区域，则设定四个区域：L、LT、LR 和 LB。这四个区域决定了裁剪线段的惟一窗口边界。若\
    \ P₂ 在 L 区域，则用左边界裁剪线段，且保存从交点到 P₂ 之间的线段；若在 LT 区域，则保存左边界到上边界之间的线段；若不在这四个区域的任何一个中，则舍弃整个线段。\n\
    \n对于第三种情况，当 P₁ 在窗口的左上方时, 按照 P₁ 相对于窗口左上角的位置，有两种可能（见下图）。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_323_0.png)\n\
    \n## P₁ 在窗口左上方时的裁剪区域\n\n若 P₂ 在区域 L、T、TR、TB、LR 或 LB 中，则决定了求交计算的惟一裁剪窗口边界，否则整个线段被舍弃。\n\
    \n为了确定 P₂ 在何区域，要比较该线段的斜率和裁剪区域边界的斜率。例如，如果在裁剪边界的左边，那么，P₂ ∈ LT 的条件\n\n是\n\n斜率 $p_{1P_T}\
    \ < $ 斜率 $p_{P_2} < $ 斜率 $p_{2P_T}$\n\n或者\n\n$\\frac{y_T-y_1}{x_R-x_1}<\\frac{y_2-y_1}{x_2-x_1}<\\\
    frac{y_T-y_1}{x_L-x_1}$\n\n若满足下列条件：\n\n$(y_T-y_1)(x_2-x_1)<(x_L-x_1)(y_2-y_1)$\n\
    \n则整个直线段不可见。\n\n## 3.6.3 多边形的裁剪\n\n用线段裁剪方法处理多边形时，其裁剪后的多边形边界为一系列不连接的直线段，而真正想显示的则是裁剪后有封闭边界的区域。对于多边形裁剪，需要能产生一个或多个封闭区域，以便能够进行扫描转换实现区域填充。多边形裁剪后的输出应是定义裁剪后多边形边界的顶点序列。\n\
    \n- 1. Sutherland-Hodgeman 多边形裁剪算法\n\nSutherland-Hodgeman 算法将多边形边界作为一个整体用窗口的每一条边界裁剪.\
    \ 这通过依次按照裁剪窗口的各边界处理\n\n所有的多边形顶点来实现。在对多边形顶点集初始化后，首先用窗口左边界裁剪多边形，产生一新的顶点序列。新的顶点集依次传给窗口的右边界、下边界和上边界处理。每一步产生的新的顶点序列作为下一个窗口边界的输入顶点序列。\n\
    \n沿着多边形依次处理顶点时会遇到四种情况。当相邻的一对多边形顶点被传到窗口的边界裁剪程序时，做以下测试：\n\n- ① 若第一点在窗口边界外而第二点在窗口边界内，则多边形的该边与窗口边界的交点和第二点都加入到输出顶点表中；\n\
    - ② 如果两点都在窗口边界内，则只将第二点加入到输出顶点表中；\n\n③ 如果第一点在窗口边界内，而第二点在窗口边界外，则只有该边与窗口边界的交点加入到输出顶点表中；\n\
    \n④ 如果两点都在窗口边界外，输出顶点表中不增加任何顶点。下图给出了多边形相邻两顶点的这四种情况。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_327_0.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_327_1.png)\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_327_2.png)\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_327_3.png)\n\n由此，我们可以将 Sutherland-Hodgeman\
    \ 多边形裁剪算法总结如下：\n"
