    # 4. 边缘填充算法


    在扫描线算法中，虽然避免了反复求交点的运算，然而建立 AEL 和 ET 时，需要对多边形的边进行排序。若采用求余运算的方法，就可免去对边排序的工作量而改用求余运算代替。


    假定 A 为一给定的正数，所谓数 M 的余是指数 A − M，记作 M̅。易知 M̅̅ = M。即对 M 作偶数次求余运算，其结果仍是 M，而对 M 作奇数次求余运算的结果是
    M̅。'
  - '[PAGE 245]


    在光栅图形中，如果某区域已着上值为 M 的颜色，则上述求余运算的性质反映出的现象是：对 M 作偶数次求余运算后，该区域的颜色不变；而作奇数次求余运算后，该区域的颜色则变成值
    M̅ 为的颜色，这一现象可用于多边形的扫描转换。


