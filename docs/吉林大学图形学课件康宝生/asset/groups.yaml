    指错切平面沿 y 轴方向错移并且离开 z 轴。变换矩阵为：


    ```

    T_yz = [[1, 0, 0, 0], [0, 1, a_{23}, 0], [0, 0, 1, 0], [0, 0, 0, 1]]

    ```


    变换结果为：


    ```

