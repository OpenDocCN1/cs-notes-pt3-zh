    \ 4.5.3 Bézier 曲线的性质\n\n- **仿射不变性**：Bézier 曲线在仿射变换下不变。这表明下述两种操作产生相同的结果：a) 计算 \\\
    (P(t)\\)，然后作仿射变换；b) 对控制多边形作仿射变换，然后求参数为 \\(t\\) 的点。\n- **映射不变性（参数变换下的不变性）**：在图形的生成与变换中非常有用。\n\
