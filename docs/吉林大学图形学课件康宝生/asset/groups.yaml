    ## （1）边界表示法表示物体的方式


    用边界表示法定义物体有两种方式，其一是把面组成 CSG 表示中的体素，再通过装配体素形成更复杂的物体；另一种是直接通过连接表面的缝合和相交廓生复杂的物体。


    ## （2）边界表示法的翼边结构


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_731_0.png)


    在边界表示法中，表示面、边和顶点相互邻接关系的信息，属于拓扑信息，表示这些邻接关系的拓扑信息在建立边界模型以及对边界模型进行处理和交互操作中非常重要。

    描述面、边、顶点三种拓扑元素的邻接关系可分为三组共九种表示方式，如图所示：


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_732_0.png)


    在边界表示法中，没有必要包含所有九种邻接拓扑信息，一方面是由于这些邻接关系不全是彼此独立的，而是相互相关的。一些邻接关系可由其他邻接关系演变而来；另一方面是存储量太大，过于累赘和烦琐。经验表明，以边为核心的一组邻接关系是最实用的，这组邻接信息的数据结构通常称之为翼边结构（Winged-edge
    Structure）。


    翼边结构是描述与一条边相邻的两个顶点、四条邻边和两个邻面这些拓扑信息的数据结构，当我们从外面观察多面体的这条边时，可以看到这条边的上、下两个顶点 P₁, P₂，左右两个邻面
    Loop_L, Loop_R，以及上、下、左、右四条邻边 E_rc, E_rcw, E_rcw, E_rcw。


    E_lcc，E_lew。这四条边好像是伸展的翅膀，因此命名为翼边（下图）。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_734_0.png)


    通过这种结构，可以方便地查找各元素之间的邻接关系。例如可以迅速列出一面上所有的边，从一个面出发遍历所有的面等等。在多面体的运算中往往以边作为最基本的运算单元，边与边求交，边与面求交，删除旧边，增加新边，生成新的面环等。因此将边作为建立邻接关系的中心环节在应用上最方便。


    翼边结构的结点结构如下：


    | 边的起点 P₁ | 边的终点 P₂ |

    | --- | --- |

    | 左下邻边 E_lcw | 右上邻边 E_rcw |

    | 左上邻边 E_lcc | 右下邻边 E_rcc |

    | 左面 Loop_L | 右面 Loop_R |


    翼边结构的结点结构


    有时为进一步减少邻接拓扑信息的存储量，可对四条邻边信息在实用中只保留左、右逆时针方向的两条邻边 $E_{lcc}$ 和 $E_{rcc}$，称为简化的翼边结构。


