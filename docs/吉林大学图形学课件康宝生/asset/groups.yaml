    # 4.2.6 连续性


    设计一条复杂曲线时，处于设计和制造上的考虑，常常通过多段曲线组合而成，这需要解决曲线段之间如何实现光滑连接的问题。


    曲线间连接的光滑度量准则有两种：一种是函数的可微性，使得组合曲线在连接处具有直到 n 阶连续导矢，即 n 阶连续可微，这类光滑度量称之为 C^n 或 n 阶参数连续性；另一种称之为几何连续性，组合曲线在连接处满足不同于
    C^n 的某一组约束条件，称为具有 n 阶几何连续性，简记为 G^n。曲线光滑性的这两种度量方法并不矛盾，C^n 连续包含在 G^n 连续之中。'
