    # 4.2.2 曲线基本概念


    一条用参数表示的三维曲线是一个有界点集，可写成一个带参数的、连续的、单值的数学函数，其形式为：


    ```

    \[ \left\{ \begin{array}{c} x = x(t) \\ y = y(t), t \in [0, 1] \\ z = z(t) \end{array}
    \right. \]

    ```'
  - '[PAGE 401]


    # 1. 位置矢量


    曲线上任一点的位置矢量可表示为：


    **P**(t) = [x(t), y(t), z(t)]


    其一阶、二阶和 k 阶导数矢量（如果存在的话）分别表示为：


    **P''**(t) = d**P**/dt ,  **P''''**(t) = d²**P**/dt² ,  **P**^k(t) = d^k**P**/dt^k


    # 2. 切矢量


    曲线上任一点的切矢量，如果存在的话则为：


    **T** = **P''**(t) / |**P''**(t)|'
  - '[PAGE 402]


    如果选择弧长 s 作为参数，那么根据弧长微分公式，有：


    $(ds)^2 = (dx)^2 + (dy)^2 + (dz)^2$


    引入参数 t，上式可改写为：


    $\left(\frac{ds}{dt}\right)^2 = \left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2
    + \left(\frac{dz}{dt}\right)^2 = |P''(t)|^2$


    为了方便，t 增加的方向数学上一般取为 s 增加的方向。考虑到向量的模非负，所以有：


    $\frac{ds}{dt} = |P''(t)| \ge 0$'
  - '[PAGE 403]


    即弧长 s 是 t 的单调增函数，故其反函数 t(s) 存在，且一一对应。


    由此得：


    **P**(t) = **P**(t(s)) = **P**(s)


    于是


    d**P**/ds = d**P**/dt · dt/ds = **P**''(t) / |**P**''(t)|


    即 **P**(t) 关于弧长 s 的导矢是单位向量。'
