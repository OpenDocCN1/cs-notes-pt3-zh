    ## 4.4.1 曲线生成原理


    - 1. 背景


    工程中最常见的数据处理问题是：在平面上给定一组离散的有限点列，要画一条光滑曲线把这些点按次序连接起来。长期以来，绘图员常常常用一根富有弹性的均匀细木条或有机玻璃条，让它依次经过这些点，并在每一点处用“压铁”压住，最后沿着这根称为（样条）的细木条画出一条光滑曲线，如图所示。


    ![](img/dce279c4fd8230bfee452d9f1db7cf9c_445_0.png)


    若把木样条看成弹性细梁，压铁看成作用在梁上的集中载荷，那么按上述方法画出的光滑曲线，在为学上可以模拟为求弹性细梁在外加集中载荷作用下的弯曲变形曲线。在建立平面直角坐标系后，由材料力学知道梁的变形曲线微分方程是：


    $M(x) = EI k(x)$


    其中，$E$ 是杨氏弹性模数，$I$ 是惯性矩，$EI$ 代表梁的刚度系数


    对于均匀木样条来说是一个常数，$M(x)$ 是弯矩，$k(x)$ 是变形曲线 $y = y(x)$ 的曲率。由于梁在两个压铁之间再无外力作用，弯矩 $M(x)$
    是 $x$ 的线性函数，可设为


    $M(x) = a x + b$


    根据微分几何，变形曲线 $y = y(x)$ 的曲率 $k(x)$ 为：


    $k(x) = \frac{y''''}{(1 + y''^2)^{3/2}}$


    因此，$M(x) = E I k(x)$ 是一非线性常微分方程，其解不能用初等函数表示。在细梁的弯曲不大，即


    $|y''| << 1$


    通常称为“小挠度”情况下，可以忽略 y’ 的影响，得到线性近似方程：


    M(x) = E I y''''


    即


    y^(4) = 0


    这时，变形曲线 y = y(x) 为分段三次多项式，且在压铁处的函数值（位移）、一阶导数（转角）和二阶导数（弯矩）都是连续的，而三阶导数（剪力）则有间断。这就是三次样条函数的力学背景。下面我们着手从数学上来表示和研究它。


    ### 2. 数学表达式和连续性方程


    定义 2.1 设在区间 [a, b] 给定一个划分：


    Δ: a = t_0 < t_1 < ⋯ < t_{m-1} < t_m = b


    [a, b] 上的向量函数 S(t) 称为参数三次样条曲线，如果它满足下列条件：


    - (1) 在每个子区间 [t_i, t_{i+1}] 上，S(t) 是三次多项式；

    - (2) 在区间 [a, b] 上，S(t) 为二阶连续可导函数，即在点 t_i (i = 1, 2, ..., m-1) 处成立：


    ```

    S^{(k)}(t_i - 0) = S^{(k)}(t_i + 0), k=0,1,2

    ```

