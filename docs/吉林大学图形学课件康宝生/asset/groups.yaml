    # 3. 2. 3 Bresenham 算法


    1965 年，Bresenham 提出了一个只使用整数运算的经典算法（通常称为 Bresenham 算法），它根据前一个已计算的像素点 $(x_i, y_i)$
    进行增量运算得到下一个像素点 $(x_{i+1}, y_{i+1})$，而不必进行取整操作。该算法也可扩充其浮点数功能以处理端点坐标是任意实数的直线。'
