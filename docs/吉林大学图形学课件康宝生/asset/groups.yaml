    \    if (abs(dy) > abs(dx)) steps = abs(dy);\n    xIncrement = dx /(float) steps;\
    \ yIncrement = dy / (float)steps;\n    DrawPixel((int)(x +0.5), (int)(y +0.5),\
    \ Color);\n    for (i = 1; x <= steps; i++) {\n        x += xIncrement; y += yIncrement;\n\
    \        DrawPixel((int)(x +0.5), (int)(y +0.5), Color);\n    }\n}\n```\n\n##\
    \ 例 3-2-1. 用 DDA 算法画连接 P₀(0, 0) 和 P₁(5, 2) 两点的直线段。\n\n| x | (int)(y + 0.5) | y\
    \ + 0.5 |\n|---|---|---|\n| 0 | 0 | 0.5 |\n| 1 | 0 | 0.4 + 0.5 |\n| 2 | 1 | 0.8\
    \ + 0.5 |\n| 3 | 1 | 1.2 + 0.5 |\n| 4 | 2 | 1.6 + 0.5 |\n| 5 | 2 | 2.0 + 0.5 |\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_154_0.png)\n\n算法 3.2.2 将直线两个端点的像素位置作为输入，其过程可概括为：端点位置的水平和垂直增量赋给参数\
    \ dx 和 dy，其绝对值大者决定参数 steps 的值。从像素位置开始，确定沿直线\n\n生成下一个像素位置每步的所需偏移量，并循环上述过程 steps\
    \ 次。如果 dx 的绝对值大于 dy 的绝对值，那么 x 方向和 y 方向的增量分别为 ±1 和 ±m。如果 dy 的绝对值大于 dx 的绝对值，那么 y\
    \ 向和 x 方向的增量分别为 ±1 和 ±m-1。\n\n利用 DDA 算法，生成一条直线只做两次除法，画线中每一\n点做两次加法，因此，用 DDA 算法生成直线的速度是相当快的。\n\
    \nDDA 算法原理简单、且有效，利用显示器的光栅特性，消除了直线方程中求点的乘法运算，在 x, y 两个方向使用合理的增量沿直线逐步求出各像素的位置。然而,\
    \ 浮点增量的连续迭加\n\n中取整误差的累积会使长线段所计算的像素位置偏离实线段，且程序中的取整操作和浮点运算仍然十分耗时。为此，我们下面讨论生成直线的\
    \ Bresenham 算法。\n\n## 3.2.3 Bresenham 算法\n\n1965 年，Bresenham 提出了一个只使用整数运算的经典算法（通常称为\
    \ Bresenham 算法），它根据前一个已计算的像素点 $(x_i, y_i)$ 进行增量运算得到下一个像素点 $(x_{i+1}, y_{i+1})$，而不必进行取整操作。该算法也可扩充其浮点数功能以处理端点坐标是任意实数的直线。\n\
    \n为了说明算法原理，我们首先考虑斜率非负且不超过1的直线的光栅化过程。设直线的起点坐标为(x_s, y_s)，终点坐标为(x_e, y_e)，则直线的方程为：\n\
    \ny = dy/dx x + B\n\n因此，其隐函数表示为：\n\nF(x, y) = dy·x - dx·y + B·dx = ax + by + c\
    \ = 0\n\n其中\n\na = dy, b = -dx, c = B·dx\n\n显然，对于直线上的点，F(x , y) 等于零；对于直线下方的点，F(x\
    \ , y) 大于零；而对直线上方的点，F(x,y) 小于零。\n\n假设当前选择的像素点是 (x_i , y_i)，那么下一步要选择的像素点可能是 NE\
    \ (x_i+1 , y_i+1)，也可能是 E (x_i+1 , y_i)。选择的原则是看哪一个离直线与 x = x_i+1 的交点最近。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_158_0.png)\n"
  mdcn: "\n## 程序实例 3.1.2\n### 用位图函数设计动画程序\n\n前两种方法的共同不足是，动画中连续相邻的两个画面中的后续画面，都是重新绘制整个图形的。事实上，在运动过程中，连续相邻的两个画面之间，变化是比较小的，发生运动的只是其中的部分内容，而其他部分是不变的，这就是相邻画面之间的“空间相关性”。当然，运动画面之间还存在“时间相关性”。充分利用“空间相关性”和“时间相关性”，便可以实现高速动画。\n\
    \n## 程序设计思路\n\nTurbo C 提供了两个函数： getimage 和 putimage，是用于存取和输出屏幕上的位图。其中 getimage\
    \ 的功能是将屏幕上指定区域中的位图信息取出并存到内存中； putimage 的功能则是将内存中的位图信息按指定方式输出到屏幕上的指定位置。这两个函数的调用格式如下：\n\
    \ngetimage 的调用格式\n\n```\ngetimage(int xl,int yt,int xr,int yb, (int *)bitmap)\n\
    ```\n\n其中： xl, yt, xr, yb 是指定位图所在的矩形区域的对角点坐标；\n\n*bitmap 是内存中存放位图信息的地址。\n\nputimage\
    \ 的调用格式\n\n```\nputimage (int x, int y, (int *)bitmap)\n```\n\n其中： x, y 是指定位图在屏幕上输出位置的定位坐标；\
    \ *bitmap 是内存中存放位图信息的地址。\n\n- 程序实例 3.1.3\n\n## 4. 复杂动画实例\n\n- 自由变形\n- 复杂变形\n\n\
    水平线较 45°线亮。为了使不同长度和方向的直线具有同等亮度，需要进行开方运算，这又使得运算速度变慢。一般采用折中方法，即只计算线段长度的近似值，利用整数运算减少计算量以及用硬件实现运算等等。\n\
    \n- 直线的生成速度要快。\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_147_0.png)\n\n这里(x_i,\
    \ y_i)是直线上一点的坐标值。式（3.2.1）和（3.2.2）表示所求直线 y 值和 x 值关于相应增量的逐次递归关系，递归初值为直线的起点。\n\n\
    DDA (Digital Differential Analyzer) 算法即数字微分分析算法就是基于式（3.2.1）或（3.2.2）对直线进行光栅化的算法。\n\
    \n在一个坐标轴上以单位间隔对直线采样，以决定另一个坐标轴上最靠近直线的对应整数值。\n\n- 当直线斜率 0 ≤ m ≤ 1 时，则按单位 x 间隔（Δx\
    \ = 1）取样并计算每个连续的 y 值：\n\ny_{i+1} = y_i + m\n（3.2.3）\n\n注：由于 $m$ 可以是 0 与 1 之间的任意实数，所以计算出的\
    \ $y$ 值必须取整。\n\n- 当 $-1 \\le m \\le 0$ 时，则仍按单位 $x$ 间隔 $(\\Delta x = -1)$ 取样并计算每个连续的\
    \ $y$ 值：\n\n$$y_{i+1} = y_i - m$$  （3.2.4）\n\n- 当 $m > 1$ 时，则将 $x$ 和 $y$ 交换，这就是说，按单位\
    \ $y$ 间隔 $(\\Delta y = 1)$ 取样并计算每个连续的 $x$ 值：\n\n$$x_{i+1} = x_i + m^{-1}$$  （3.2.5）\n\
    \n- 当 $m < -1$ 时，则同样交换 $x$ 和 $y$ 交换，并按 $\\Delta y = -1$ 间隔\n\n## 取样计算每个连续的 x 值：\n\
    \n$x_{i+1} = x_i - m^{-1}$\n（3.2.6）\n\n应用式（3.2.3）～（3.2.6），可以设计绘制任意斜率的直线光栅扫描算法。程序\
    \ 3.2.1 是斜率在 0 和 1 之间的直线绘制算法，而程序 3.2.2 则是绘制任意斜率的直线的算法。\n\n## 程序 3.2.1 DDA 扫描转换算法\n\
    \n```\nvoid Line_DDA(int x0, int y0, int x1, int y1, int Color)\n{\n    /*设 0\
    \ ≤ m ≤ 1*/\n    int x, dy, dx;\n    float y, m;\n\n    dy = y1 - y0;\n    dx\
    \ = x1 - x0;\n    m = (float)dy / dx;\n    y = y0;\n    for (x = x0; x <= x1;\
    \ x++){\n        DrawPixel(x, (int)(y + 0.5), Color); /*置像素值为 Color*/\n      \
    \  y += m;\n    }\n}\n```\n\n## 程序 3.2.2 DDA 扫描转换算法\n\n```\nvoid Line_DDA (int\
    \ x0, int y0, int x1, int y1, int Color)\n{\n    int dy = y1 - y0, dx = x1 - x0,\
    \ i, steps;\n    float x = x0, y = y0, xIncrement, yincrement;\n    steps = abs(dx);\n\
    \    if (abs(dy) > abs(dx)) steps = abs(dy);\n    xIncrement = dx /(float) steps;\
    \ yIncrement = dy / (float)steps;\n    DrawPixel((int)(x +0.5), (int)(y +0.5),\
    \ Color);\n    for (i = 1; x <= steps; i++) {\n        x += xIncrement; y += yIncrement;\n\
    \        DrawPixel((int)(x +0.5), (int)(y +0.5), Color);\n    }\n}\n```\n\n##\
    \ 例 3-2-1. 用 DDA 算法画连接 P₀(0, 0) 和 P₁(5, 2) 两点的直线段。\n\n| x | (int)(y + 0.5) | y\
    \ + 0.5 |\n|---|---|---|\n| 0 | 0 | 0.5 |\n| 1 | 0 | 0.4 + 0.5 |\n| 2 | 1 | 0.8\
    \ + 0.5 |\n| 3 | 1 | 1.2 + 0.5 |\n| 4 | 2 | 1.6 + 0.5 |\n| 5 | 2 | 2.0 + 0.5 |\n\
    \n![](img/dce279c4fd8230bfee452d9f1db7cf9c_154_0.png)\n\n算法 3.2.2 将直线两个端点的像素位置作为输入，其过程可概括为：端点位置的水平和垂直增量赋给参数\
    \ dx 和 dy，其绝对值大者决定参数 steps 的值。从像素位置开始，确定沿直线\n\n生成下一个像素位置每步的所需偏移量，并循环上述过程 steps\
    \ 次。如果 dx 的绝对值大于 dy 的绝对值，那么 x 方向和 y 方向的增量分别为 ±1 和 ±m。如果 dy 的绝对值大于 dx 的绝对值，那么 y\
    \ 向和 x 方向的增量分别为 ±1 和 ±m-1。\n\n利用 DDA 算法，生成一条直线只做两次除法，画线中每一\n点做两次加法，因此，用 DDA 算法生成直线的速度是相当快的。\n\
    \nDDA 算法原理简单、且有效，利用显示器的光栅特性，消除了直线方程中求点的乘法运算，在 x, y 两个方向使用合理的增量沿直线逐步求出各像素的位置。然而,\
    \ 浮点增量的连续迭加\n\n中取整误差的累积会使长线段所计算的像素位置偏离实线段，且程序中的取整操作和浮点运算仍然十分耗时。为此，我们下面讨论生成直线的\
    \ Bresenham 算法。\n\n## 3.2.3 Bresenham 算法\n\n1965 年，Bresenham 提出了一个只使用整数运算的经典算法（通常称为\
    \ Bresenham 算法），它根据前一个已计算的像素点 $(x_i, y_i)$ 进行增量运算得到下一个像素点 $(x_{i+1}, y_{i+1})$，而不必进行取整操作。该算法也可扩充其浮点数功能以处理端点坐标是任意实数的直线。\n\
    \n为了说明算法原理，我们首先考虑斜率非负且不超过1的直线的光栅化过程。设直线的起点坐标为(x_s, y_s)，终点坐标为(x_e, y_e)，则直线的方程为：\n\
    \ny = dy/dx x + B\n\n因此，其隐函数表示为：\n\nF(x, y) = dy·x - dx·y + B·dx = ax + by + c\
    \ = 0\n\n其中\n\na = dy, b = -dx, c = B·dx\n\n显然，对于直线上的点，F(x , y) 等于零；对于直线下方的点，F(x\
    \ , y) 大于零；而对直线上方的点，F(x,y) 小于零。\n\n假设当前选择的像素点是 (x_i , y_i)，那么下一步要选择的像素点可能是 NE\
