    - **缺乏灵活性**：一旦确定了特征多边形的顶点数（\\(m\\) 个），也就决定了曲线的阶次（\\(m-1\\) 次），无法更改；\n- **控制性差**：当顶点数较多时，曲线的阶次将较高，此时，特征多边形对曲线形状的控制将明显减弱；\n\
    - **不易修改**：由曲线的混合函数可看出，其值在开区间 \\((0,1)\\) 内均不为零。因此，所定义之曲线在 \\(0<t<1\\) 的区间内的任何一点均要受到全部顶点的影响，这使得对曲线进行局部修改成为不可能。（而在外形设计中，局部修改是随时要进行的）\n\
    \n为了克服 Bézier 曲线存在的问题，Gordon 等人对 Bézier 曲线做了拓展。就外形设计的需求而言，希望新的曲线：\n\n- 易于进行局部修改；\n\
    - 更逼近特征多边形；\n- 是低阶次曲线。\n\n于是，用 \\(n\\) 次 B 样条基函数替换了 Bernstein 基函数，构造了称之为 B 样条曲线的新型曲线。\n\
    \n### 4.6.2 B 样条基函数\n\n给定参数 \\(u\\) 轴上的一个分割（节点向量）\n\n\\[\nU=\\{u_i\\}_{i=-\\infty}^{+\\\
    infty},\\quad (u_i\\le u_{i+1},\\ i=0,\\pm1,\\pm2,\\cdots)\n\\]\n\n由下列递推公式定义的函数\
    \ \\(N_{ik}(u)\\) 称为节点向量 \\(U\\) 上的 \\(k\\) 阶（\\(k-1\\) 次）B 样条基函数：\n\n\\[\nN_{i1}(u)=\n\
    \\begin{cases}\n1, & u\\in[u_i,\\ u_{i+1}) \\\\\n0, & u\\notin[u_i,\\ u_{i+1})\n\
    \\end{cases}\n\\]\n\n\\[\nN_{ik}(u)=\\frac{u-u_i}{u_{i+k-1}-u_i}N_{i,k-1}(u)+\\\
    frac{u_{i+k}-u}{u_{i+k}-u_{i+1}}N_{i+1,k-1}(u)\n\\]\n\n在节点向量 \\(U\\) 中，如果有 \\\
    (u_j=u_{j+1}=\\cdots=u_{j+r-1}\\)，则称节点 \\(u_j\\) 为 \\(U\\) 中的 \\(r\\) 重节点。\n\n\
    B 样条基函数的定义有多种等价定义，如差分定义、卷积定义等。上述的递推定义由 Cox-de Boor 给出。下面举例说明 B 样条基函数的递归定义。\n\n\
    ### 一阶 B 样条基函数\n\n### 二阶 B 样条基函数\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_479_0.png)\n\
    \n### 三阶 B 样条基函数\n\n![](img/dce279c4fd8230bfee452d9f1db7cf9c_480_0.png)\n\n###\
    \ 4.6.3 B 样条基函数的性质\n\n- **局部支撑性**\n  \\[\n  N_{ik}(u)\n  \\begin{cases}\n  >0,\
    \ & u_i<u<u_{i+k} \\\\\n  =0, & u\\notin(u_i,\\ u_{i+k})\n  \\end{cases}\n  \\\
    ]\n  区间 \\([u_i,\\ u_{i+k}]\\) 称为 \\(N_{ik}(u)\\) 的支撑区间。\n\n- **归一性（权性）**\n  \\\
    [\n  \\sum_{i=-\\infty}^{+\\infty}N_{ik}(u)\\equiv1,\\quad u\\in(-\\infty,+\\\
    infty)\n  \\]\n  或者\n  \\[\n  \\sum_{i=j-k+1}^{j}N_{ik}(u)\\equiv1,\\quad u\\\
    in[u_j,\\ u_{j+1})\n  \\]\n\n- **分段多项式**：\\(N_{ik}(u)\\) 在每一长度非零的区间 \\([u_j,\\\
    \ u_{j+1})\\) 上都是次数不超过 \\(k-1\\) 的多项式。\n\n- **连续性**：\\(N_{ik}(u)\\) 在区间 \\((u_j,\\\
    \ u_{j+1})\\) 上 \\(C^\\infty\\) 连续，在节点 \\(u_j\\) 处\n"
