    ### 2. 表面模型（surface model）


    表面模型是用有向棱边围成的部分来定义形体的表面，再用面的集合来定义形体。


    表面模型是在线框模型的基础上，通过增加面边信息，可以满足面面求交计算和工程分析等需要。但它在特性、棱边的连接线、形成明暗色彩方面仍有困难（如有限元分析）。


