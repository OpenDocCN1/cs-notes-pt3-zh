    # 1.4 计算机图形学的发展历史回顾


    最早的计算机仅仅是用来进行科学计算，利用计算机进行图形处理的工程应用，应归功于美国的战术防空系统 SAGE (Semi Automatic Ground Environment)。二次世界大战刚结束，美国国防部就开始筹划如何预防远程轰炸机携带核弹头突然袭击美国本土的问题，最后决定建立一个实时信息控制系统，以便监视北美的整个空域和地域，使空军总部的指挥员能清晰地看到空中的目标和地面机场的动态，及时准确地指挥作战.具体的部署是研制计算机通信网和在全国部署一百多个图形'
  - '[PAGE 23]


    工作站，利用19英寸阴极射线管（CRT）显示各个军区的地理边界、雷达搜索目标的位置和航迹、拦截点的位置以及计算机生成的其他信息。指挥员可以用光笔（当时称为光枪）指点屏幕上的某一目标，询问进一步的细节或向计算机发送其他指令。许多公司参与研制了
    SAGE 系统，整个技术方案由麻省理工学院（MIT）林肯实验室负责。SAGE 系统 1957 年投入使用，二十世纪 60 年代中期逐渐淘汰，整个计划并未最终完成。但这一尝试为交互式计算机图形显示技术的发展无疑起到了巨大的带头作用。


    计算机图形学的发展经历了以下五个阶段：'
  - '[PAGE 24]


    # 准备和酝酿时期(1950~1960)


    在 SAGE 计划的推动下，1950 年，MIT 研制了“旋风 I 号”图形设备（Whirlwind I ），类似于示波器，可显示简单图形。

    1952 年，世界上第一台数控铣床的原型在 MIT 的伺服机构实验室诞生。1957 年，美国空军将第一批数控铣床装备到飞机工厂。1958 年，美国的 Calcomp
    公司和 Gerber 公司分别研制出滚筒式绘图仪和平板式绘图仪。其后，MIT 发展了 APT（Automatically Programmed Tools）数控加工自动编程语言，这是目前国际上最为通用的加工编程工具。整个五十年代'
  - '[PAGE 25]


    大多采用电子管计算机，用机器语言编程。计算机仍以科科学计算为主，为之配置的图形设备仅具有输出功能，计算机图形学处于被动式的图形处理阶段。


    # 蓬勃发展和进入应用时期(1960～1970)


    1962 年，第一台光笔交互式图形显示器在 MIT 林肯实验室研制成功，I. E. Sutherland 在这里发表了划时代的博士论文 “Sketchpad：一个人机通讯的图形系统”，首次提出了计算机图形学、交互技术、分层存储符号的数据结构等新思想，为计算机图形学的发展和应用奠定了理论基础。1964
    年，Coons 在'
  - '[PAGE 26]


    MIT 提出了用小块曲面片组合表示自由型曲面时使曲面片在边界上达到任意高次连续阶的理论方法；法国Renault汽车公司的 P. Bézier 提出了自由型曲线、曲面设计的理论方法。这些方法得到了工业界和学术界的极大推崇，分别称之为Coons
    曲面和 Bézier 方法。Coons 和 Bézier 并列被称为现代计算机辅助几何设计技术的奠基人。


    在美国工业界，研制交互式图形显示器的工作亦在平行开展。1964 年，IBM 推出自主设计的图形显示设备 IBM2250 显示器。这是 IBM 计算机上正式提供工业界使用的第一代刷新式随机扫描图形终端，它使用光笔作为交互输入手段，并配有一'
  - '[PAGE 27]


    组32个功能键，以便调用程序中的相应模块。通用汽车公司研制了多路分时图形控制台，实现了各阶段的汽车设计。


    作为IBM2250最早用户的波音、麦克唐纳、洛克希德等飞机公司也先后开发了一系列CAD/CAM系统软件，其中洛克希德公司的CADAM绘图加工系统，自1974年进入市场以来，已成为IBM主机上目前应用最广的CAD/CAM软件之一。到60年代末，美国安装的CAD工作站已达200多台，可供几百人使用。'
  - '[PAGE 28]


    # 广泛应用的时期(1970～1980)


    1970 年，美国 Applicon 公司第一个推出完整的 CAD 系统。此间出现了廉价的固体电路随机存储器、产生逼真图形的光栅扫描显示器、光笔、图形输入板等多种形式的图形输入设备，如美国
    Tektronix 公司发展的基于存储管技术的 4006、4010、4012、4016等图形终端，其分辨率可达4096×3072，而价格还不到 IBM2250
    的一半。因此，出现了面向中小企业的商品化 CAD/CAM 系统。整个 70 年代，CAD/CAM 技术的应用已相当广泛，许多功能强大的大型系统软件相继面世，如英国飞机公司的
    CONSURF 系统、Renault 公司的 UNISURF 系统'
  - '[PAGE 29]


    Rochester 大学的 PADL 系统、Cambridge 大学的BUILD 系统、北海道大学的 TIPS 系统等。到 70 年代末，美国 CAD 工作站的安装数量已超过12000
    台，使用人数超过 2.5万。


    # 飞速发展时期(1980～1990)


    图形系统和 CAD/CAM 工作站的销售量与日俱增。1981年美国实际安装 CAD 系统 5000 套，1983 年超过 12000套，1988 年发展到
