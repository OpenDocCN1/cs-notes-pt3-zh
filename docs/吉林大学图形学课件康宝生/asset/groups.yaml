    ## 4.3.2 抛物样条曲线的表达式


    设有一离散点列 $P_i (i = 1, 2, \cdots, n)$，我们可以上述方法每经相邻的三点作一条抛物线，则由 $n$ 个点最多总共可以作出 $(n
