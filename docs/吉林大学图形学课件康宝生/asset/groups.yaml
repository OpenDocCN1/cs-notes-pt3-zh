    三维图形的裁剪指的是相对于三维观察体的裁剪。由于三维观察体的大小和形状与生成显示的投影类型密切相关，不同类型的投影确定了不同形状和大小的观察体，这将使三维图形的裁剪较之二维图形的裁剪更加复杂费时。为了简化三维裁剪，我们引入规范化观察体。


