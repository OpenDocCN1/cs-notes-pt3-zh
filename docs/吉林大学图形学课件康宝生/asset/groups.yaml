    数值对它执行曲线的 de Casteljau 算法，n 级递推以后，得到一个点 P_{0,0}^{m,n} ，即所求曲面上的点 P(u,v)。也可以按式 (6)
    方案执行，先以 v 参数值对控制网格 v 向的 m+1 个多边形执行曲线的 de Casteljau 算法，n 级递推后，得到沿 u 向的 m+1 个顶点
    P_{i,0}^{0,n}(i=0,1,…,m)构成的中间多边形。再以 u 参数支对它执行曲线的 de Casteljau 算法，m 级递推以后，即得所求点
    P_{0,0}^{m,n} 。'
  - '[PAGE 668]


    # 4. Bézier 曲面的分割


    Bézier 曲面 $P(u, v)$ 可按下列方法分成四块小的 Bézier 曲面片：


    $P(u,\ v)=\begin{cases}\sum\limits_{i=0}^{n}\sum\limits_{j=0}^{m}P_{ij}^{[i][j]}B_{in}(2u)B_{jm}(2v),\
    0\le u,\ v\le\dfrac{1}{2}\\\sum\limits_{i=0}^{n}\sum\limits_{j=0}^{m}P_{im}^{[i][m-j]}B_{in}(2u)B_{jm}(2v-1),\
    0\le u\le\dfrac{1}{2},\ \dfrac{1}{2}\le v\le1\\\sum\limits_{i=0}^{n}\sum\limits_{j=0}^{m}P_{nj}^{[n-i][j]}B_{in}(2u-1)B_{jm}(2v),\
    \dfrac{1}{2}\le u\le1,\ 0\le v\le\dfrac{1}{2}\\\sum\limits_{i=0}^{n}\sum\limits_{j=0}^{m}P_{nm}^{[n-i][m-j]}B_{in}(2u-1)B_{jm}(2v-1),\
    \dfrac{1}{2}\le u,\ v\le1\end{cases}$'
  - '[PAGE 669]


    其中，上式中各控制顶点由下列递推关系式决定：


    P_{ij}^{[r]} = \begin{cases} P_{ij},\ r=0 \\ (P_{ij}^{[r-1]} + P_{i-1j}^{[r-1]})/2,\
    r=1,2\cdots,n \end{cases}, i=r,r+1,\cdots,n;\ j=0,1,\cdots,m


    P_{ij}^{[l]} = \begin{cases} P_{ij}^{[l]},\ l=0 \\ (P_{ij}^{[l-1]} + P_{i,j-1}^{[l-1]})/2,\
    l=1,2\cdots,m \end{cases}, j=l,l+1,\cdots,m;\ i=0,1,\cdots,n


    P_{nj}^{[n-l]} = \begin{cases} P_{nj}^{[n-l]},\ l=0 \\ (P_{nj}^{[n-l-1]} + P_{n,j-1}^{[n-l-1]})/2,\
    l=1,2\cdots,m \end{cases}, j=l,l+1,\cdots,m;\ i=0,1,\cdots,n'
  - '[PAGE 670]


    根据上述递推关系可设计实现 Bézier 曲面的离散算法。递归对Bézier曲面进行离散，可得到一个收敛于原曲面的控制多体序列，用此可实现 Bézier 曲面的多面体逼近。


    # 7.4.2 三边 Bézier 曲面


    与上一节定义在矩形域上的 Bézier 曲面片不同，本节介绍的三边 Bézier 曲面片式定义在三边形域上的，如图所示。为便于区分，把定义在矩形域上的 Bézier
    曲面片称为四边 Bézier 曲面片。三边曲面片能较好地适应不规则与散乱数据的几何造型及适合有限元分析中三边元素的需要。'
