    # 7.2 二次曲面和超二次曲面


    二次曲面是一类常用的物体，由二次方程描述，包括球面、椭球面、环面、抛物面和双曲面。二次曲面，尤其是球面和椭球面，是最基本的图形物体，经常作为图元用在图形包中，由此可以构造更复杂的物体。


    # 7.2.1 球面


    在笛卡儿坐标系中，球心在原点，半径为 r 的球面定义为满足下列方程的点集 (x, y, z):


    ```

    x² + y² + z² = r²

    ```'
  - "[PAGE 647]\n\n我们也可以用参数形式来描述球面，使用球面坐标可得球面的参数方程：\n\n```\nx = r cos φ cos θ\n y\
    \ = r cos φ sin θ,  0 ≤ φ ≤ π, 0 ≤ θ ≤ 2π\n z = r sin φ\n```\n\n# 7.2.2 椭球面\n\n\
    椭球面可以看成是球面的扩展，它的三条相互垂直的主半轴有不同的长度。椭球面中心在原点的笛卡儿表示式为：\n\n```\n(x / r_x)^2 + (y /\
    \ r_y)^2 + (z / r_z)^2 = 1\n```"
  - "[PAGE 648]\n\n相应地，椭球面的参数方程为：\n\n```\n$$\begin{cases} x = r_x \\cos \\varphi \\\
    cos \\theta \\\\ y = r_y \\cos \\varphi \\sin \\theta, \\quad 0 \\le \\varphi\
    \ \\le \\pi, \\ 0 \\le \\theta \\le 2\\pi \\\\ z = r_z \\sin \\varphi \\end{cases}$$\n\
    ```\n\n# 7.2.3 环面\n\n环面是轮胎形状物体，将圆或其他二次曲线绕指定轴旋转而成。在笛卡儿坐标系中，环面的方程是：\n\n```\n$$\\\
    left[ r - \\sqrt{\\left(\\frac{x}{r_x}\\right)^2 + \\left(\\frac{y}{r_y}\\right)^2}\
    \ \\right]^2 + \\left(\\frac{z}{r_z}\\right)^2 = 1$$\n```"
  - '[PAGE 649]


    其中，r 是给定的偏移量。环面的参数方程类似于椭球面，其表示式如下：


    ```

    x = r_x (r + cos φ) cos θ

    y = r_y (r + cos φ) sin θ,  −π ≤ φ ≤ π, −π ≤ θ ≤ π

    z = r_z sin φ

    ```


    # 7.2.4 超二次曲面


    超二次曲面（super quadrics）由二次方程添加参数而成，对调整物体形状增加了方便。增加的参数数目等同于物体的维数：曲线一个参数，曲面二个参数。'
  - '[PAGE 650]


    # • 超椭圆


    在椭圆相应的方程中，允许 $x$ 和 $y$ 的指数是变量，这样可以得到超椭圆的笛卡儿表示式。笛卡儿坐标系下，超椭圆方程的表示形式之一是：


    $$\left(\frac{x}{r_x}\right)^{2/s}+\left(\frac{y}{r_y}\right)^{2/s}=1$$


    其中，参数 $s$ 是任何实数. 当 $s=1$ 时，为一般椭圆的表示式。超椭圆的参数方程是：


    $$\begin{cases}x=r_x\cos^s\theta\\y=r_y\sin^s\theta\end{cases},\quad 0\leq\theta\leq2\pi$$'
  - '[PAGE 651]


    # 超椭球面


    超椭球面的表示式是由椭球面方程增加二个指数参数而得：


    ```

    \left[\left(\frac{x}{r_x}\right)^{2/s_2}+\left(\frac{y}{r_y}\right)^{2/s_2}\right]^{s_2/s_1}+\left(\frac{z}{r_z}\right)^{2/s_1}=1

    ```


    当 $s_1 = s_2 = 1$ 时，得到一般的椭球面。超椭圆的参数方程是：


    ```

    \begin{cases}

    x = r_x \cos^{s_1} \varphi \cos^{s_2} \theta \\

    y = r_y \cos^{s_1} \varphi \sin^{s_2} \theta,\ -\frac{\pi}{2} \le \varphi \le
    \frac{\pi}{2},\ -\pi \le \theta \le \pi \\

    z = r_z \sin^{s_1} \varphi

    \end{cases}

    ```'
  - '[PAGE 652]


    # 7.3 柔性物体


    有些物体不具有固定形状，当处于运动状态或接近其他物体时其表面特征会发生变化，如分子结构、水珠、带状物体、人體肌肉等。这些物体具有“柔性”，称之为柔性物体 (blobby
    objects)，因为这些物体具有一定程度的流动性。


    例如，分子形状在独立存在时可用球面描述，但当分子接近其他分子时，其形状发生改变。电子云形状的变形便是由于两个分子间发生“结合”而产生延伸、分裂和收缩效果。这些特性不能简单地用球面或椭球面来描述。'
  - '[PAGE 653]


