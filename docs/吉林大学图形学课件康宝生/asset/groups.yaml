    和规范化观察体的边界面，例如与平面 $y=1$ 求交时，可由：


    $$y_0+(y_1-y_0)t''=1$$


    求得交点参数：


    $$t''=(1-y_0)/(y_1-y_0)$$


    代入直线段的参数方程，即可求出交点坐标。和平面 $x=y$ 求交点时，其交点参数则为：


    $$t''''=\frac{z_0-x_0}{(x_1-x_0)-(z_1-z_0)}$$


    代入直线段参数方程即可求得交点坐标。'
