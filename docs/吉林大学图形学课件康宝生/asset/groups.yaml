    影线填充用来在区域内显示一组平行线。其填充程序实现单一影线或交叉影线的绘制。影线间的间距和斜率在影线表中以参数形式设定。


    也可以按多种方法将填充图案和背景颜色组合。对于仅包含数字 1 和 0 的位图图案，0 值可用作让背景透过显示的透明指示，也可将 1 和 0 表示为用两种颜色图案填充内部。通常，颜色填充图案可以用几种方法与背景色混合。图案和背景可用布'
