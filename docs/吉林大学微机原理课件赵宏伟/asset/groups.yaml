    # 7.3.5 DAC 1210与CPU的接口


    +   - 1. 8位CPU与超过8位的DAC接口

    +   - 在许多转换精度及分辨率要求更高的场合，往往要用大于8位的D/A转换器，例如10位、12位等等。下面以12位D/A转换器与8位CPU的接口实例来说明大于8位的D/A转换器接口的一般方法。

    +   - 当一个12位的D/A转换器与8位CPU接口时，需把数据宽度分为两段，即用两个数据锁存器分别锁存低8位和高4位数据，计算机向D/A转换器送数据时分为二次操作，即先把低8位送给低8位锁存器，紧接着把高4位送到高4位锁存器。

