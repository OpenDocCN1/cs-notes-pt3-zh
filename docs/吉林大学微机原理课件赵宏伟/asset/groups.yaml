    # 16个端口地址分为两部分


    （1）00H-07H分配给4个通道的相应的16位寄存器，它们的端口地址分配如下：


    基和当前地址寄存器端口  基和当前字节数计数器端口


    +   - 通道0    DMA+0    DMA+1


    +   - 通道1    DMA+2    DMA+3


    +   - 通道2    DMA+4    DMA+5


    +   - 通道3    DMA+6    DMA+7


    由于这几个寄存器都是16位，而8237A只有8位数据线，因此，读/写操作均分两次进行（使用两条I/O指令）。每次读/写前应先用软件命令清除字节指针触发器（即先/后触发器），然后，以先低字节后高字节的顺序进行读/写操作。


    （2）08H-0FH分配给其他寄存器，其中包括3条不使用数据总线而只利用端口地址进行操作的清除命令。'
