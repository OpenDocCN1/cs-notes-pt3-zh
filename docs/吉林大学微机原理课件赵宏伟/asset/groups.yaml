  md: "\n## DAC 0832内部结构\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_414_0.png)\n\n\
    ## 4. DAC 0832的电压输出电路\n\n- DAC 0832为电流输出型的D/A转换器，要获得电压输出，需要外加转换电路。图7.3.3为两极运算放大器组成的模拟输出电压。\n\
    \nVOUT = - ( V_A / R_2 + V_REF / R_1 ) × R_3 = - ( R_3 / R_2 × V_A + R_3 / R_1\
    \ × V_REF ) = - ( 2 V_A + V_REF ) = - [ 2 × ( - V_REF / 2^8 N ) + V_REF ] = N\
    \ / 128 × V_REF - V_REF = ( N - 128 ) / 128 × V_REF\n\n- 如果参考电压VREF为+5V，则（mV），此时\n\
    \n- 若N=00H，V\n\n- 若N=80H，V\n\n- 若N=FFH，V≈+5V\n\n- 可见，从VOUT输出为双极性模拟电压。电压范围是-5V～+5V。\n\
    \n## D/A转换器的输出电路\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_416_0.png)\n\n图 7.3.3\
    \ D/A 转换器的输出电路\n\n## 5. DAC 0832应用\n\n- DAC 0832单缓冲方式应用很广泛，可对生产现场某执行机构进行控制，也可产生各种智能信号。设定DAC\
    \ 0832的地址为78H。当CPU送出00H～0FFH数据，经DAC 0832转换VOUT为0～+5V的模拟电压送至现场执行机构。其VOUT输出模拟电压控制程序段如下：\n\
    - （1）VOUT输出模拟电压0V～+5V程序段\n- MOV    AL, N    ; N为00H～0FFH间的任意数\n- OUT    78H, AL\n\
    \n## (2) 方波发生器程序段\n\n- X1: MOV AL, 00H\n- OUT 78H, AL\n- CALL DELAY ; DELAY为延时子程序\n\
    - MOV AL, 0FFH\n- OUT 78H, AL\n- CALL DELAY\n- JMP X1\n\n## （3）锯齿波发生器程序段\n\n```\n\
    ```asm\nY1: MOV     AL, 00H\n    OUT     78H, AL\nY2: INC     AL\n    OUT    \
    \ 78H, AL\n    MOV     CX, n      ; 延时\nY3: LOOP    Y3\n    JMP     Y2\n```\n\
    ```\n\n## （4）三角波发生器\n\n```\n```asm\nZ1:  MOV    AL, 00H\nZ2:  OUT    78H, AL\n\
    \     CALL   DELAY        ; 调延时子程序\n     INC    AL\n     JNZ    Z2\n     DEC \
    \   AL           ; 使AL=FFH\n     DEC    AL           ; 使AL=FEH，消除平顶\nZ3:  OUT\
    \    78H, AL\n     CALL   DELAY        ; 调延时子程序\n     DEC    AL\n     JNZ    Z3\n\
    \     JMP    Z2\n```\n```\n\n## 6. DAC 0832的典型连接\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_421_0.png)\n\
