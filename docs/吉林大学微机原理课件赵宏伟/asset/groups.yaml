    # 5.1.2 8255A的控制字


    +   8255A有两种控制字。一个是对方式选择控制字，另一个是对C口进行置位或复位的控制字。这两种控制字均为8位。


    # 1. 方式选择控制字


    方式选择控制字用来设置工作方式，8255A有3种基本工作方式：方式0是基本的输入/输出方式，方式1是选通的输入/输出方式，方式2是双向传输方式。


    # 2. 端口C的置位/复位控制字


    端口C的任一位可用这个控制字来置位或复位，而其他位保持不变。


    该控制字用最高位D7=0作为该控制字的标志位。D6-D4不用，一般取0。D3-D1用来进行位选择，即指定对哪一位进行操作。D0用来表示是置位还是复位。该控制字为对C口的按位操作提供了方便。'
