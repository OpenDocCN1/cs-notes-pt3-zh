    # 1. 中断请求寄存器IRR


    +   - 中断请求寄存器IRR用于寄存所有IR输入线输入的中断请求信号，即保存正在请求服务的中断级。


    +   - 中断请求寄存器IRR接收外部的中断请求，IRR有8位，它们分别和引脚IR0-IR7相对应。接收来自某一引脚的中断请求后，IRR寄存器中的对应位置1，也就是对这一中断请求作了锁存。


    +   - 8259A有边沿触发和高电平触发两种触发方式。在边沿触发方式下，8259A将中断请求输入端出现的上升沿作为中断请求信号。中断请求输入端出现上升沿触发信号以后，可以一直保持高电平。在高电平触发方式下，8259A把中断请求输入端出现的高电平作为中断请求信号。在高电平触发方式下，当第一个中断响应信号变为有效之后，输入端必须及时撤除高电平，避免引起不应该有的第二次中断请求。'
