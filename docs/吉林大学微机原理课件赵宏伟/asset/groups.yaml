    ## 方式3（方波发生器方式）


    - （1）结果特点

    - 产生连续方波。方波的重复周期=计数值×CLK脉冲周期。

    - （2）过程特点

    - 1）控制字写入：OUT为高电平（OUT=1）。

    - 2）计数值写入：OUT为高电平（OUT=1）。

    - 3）启动方式：两种。一种是硬件启动。利用GATE的上跳沿启动；另一种是软件启动：写入计数值启动（此时GATE=1）。

    - 4）计数期间：若计数值n为偶数，则在前n/2计数期间，OUT输出高电平（OUT=1），后n/2计数期间，OUT输出低电平（OUT=0）；若计数值n为奇数，则在前（n+1）/2计数期间，OUT输出高电平（OUT=1），后（n-1）/2计数期间，OUT输出低电平（OUT=0）。

    - 5）计数为0时：OUT输出高电平（OUT=1），从而完成一个周期。然后，计数初值寄存器的值自动装入减1计数器，开始下一个周期。

    - 6）计数期间写入新的计数值：不影响当前输出周期，等到计数值减到0后，或GATE有上跳沿后，将把计数初值寄存器的新内容重新装入减1计数器中，开始以新的周期输出方波。

    - 7）GATE作用：GATE=0时，计数停止，OUT=1；GATE=1时，不影响计数器工作，计数进行；GATE有上跳沿时，下一个CLK时钟使计数初值寄存器内容装入减1计数器，开始新的计数。

    - 8）计数值有效期限：计数值重复有效。


