    - STD总线接口缓冲模块靠近STD总线母板，I/O接口靠近用户联接器，功能模块在中间。对于没有用户联接器的模板，如CPU板、存储器板等，I/O模块这部分也用作功能模块。\n\
    - STD总线规范对模板的尺寸、总线连接器和插脚分配、信号定义和电气标准等都做了规定。下面介绍STD总线引脚的分配和电气标准。\n\n## （1）总线引脚分配\n\
    \n- STD总线一共有56根，可分为5个功能组：\n- 逻辑电源线 6根，引脚1～6；\n- 数据总线 8根，引脚7～14；\n- 地址总线 16根，引脚15～30；\n\
    - 控制总线 22根，引脚31～52；\n- 辅助电源线 4根，引脚53～56。\n\n## （2）电气规范\n\n- 逻辑信号特性：STD总线被设计为同工业标准TTL或高速CMOS逻辑电平相兼容。TTL总线模板的VOH和VIH的最小值分别不能低于2.4V和2.0V，VOL和VIL的最大值分别不能高于0.5V和0.8V。\n\
    - CMOS总线模板的VOH和VIH的最小值分别不能低于3.76V和3.85V，VOL和VIL的最大值分别不能高于0.37V和0.9V。\n- 总线驱动和负载特性：在模板上每个总线信号只能有一个负载，总线驱动必须满足IOL=24mA（TTL总线模板）或IOL=6mA（CMOS模板）电流吸收器的要求。\n\
    - 最大额定电压：为+Vcc=+0.5V。超过此值就会损坏板上的元件。\n\n## 4.6 主要外设总线介绍\n\n- 系统开发时，经常要与外部总线打交道，外部总线常常以专用的接插件形式提供给用户使用，有时也称（总线）接口标准。本节对常用的USB总线、IDE总线、SCSI总线、IEEE\
    \ 1394总线、ATA总线、AGP总线、IEEE-488总线、CAN总线、Centronic总线等进行简要介绍。\n\n### 4.6.1 USB总线\n\
    \n- USB（Universal Serial Bus）通用串行总线是外部设备通用的接口标准，由Compaq、HP、Intel、Lucent、Microsoft、NEC和Philips七家公司联合推出。USB总线是一种连接外围设备的机外总线，最多可连接127个设备，为微机系统扩充和配置外部设备提供了方便。\n\
    - USB 1.0标准发布于1996年，但直到1998年USB 1.1标准的颁布和支持USB功能的Windows 98的推出，USB才真正得到广泛应用。USB\
    \ 1.0和USB 1.1标准的最大数据传输速率是12Mb/s，2000年公布了USB 2.0标准，将最大数据传输速率提高了40倍，达到480Mb/s。\n"
