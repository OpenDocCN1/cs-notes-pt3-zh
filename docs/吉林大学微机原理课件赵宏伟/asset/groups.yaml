  - '[PAGE 222]


    # 例3.3.1 8259A单片应用


    +   在某8088系统中扩展一片中断控制器8259A，其端口地址由74LS138译码器译码选择，假设为8CH和8DH。中断源的中断请求线连到IR7输入线上，边沿触发方式，IR7的中断类型码为77H，其它条件保持8259A的复位设置状态。要求：


    +   （1）写出8259A的初始化程序。


    +   （2）写出中断类型码为77H的中断向量设置程序。'
  - '[PAGE 223]


    # 1. 8259A的初始化程序


    +   - 初始化程序包括写入ICW1、ICW2和ICW4（由于单片使用，不需写入ICW3），并且必须按规定的顺序写入。

    +   - （1）ICW1命令字。单片，边沿触发，需要ICW4，故为00010011B=13H，写入偶地址。

    +   - （2）ICW2命令字。IR7的中断类型码为77H，即可作为ICW2命令字写入，写入奇地址。

    +   - （3）ICW4命令字。8088 CPU，一般全嵌套方式，正常EOI结束，非缓冲方式，故命令字的组合为00000001B=01H，写入奇地址。

    +   - （4）OCW1命令字。系统只使用了IR7，为防止干扰，产生误动作，应将IR0-IR6屏蔽掉，屏蔽字为01111111B=7FH，写入奇地址。'
  - "[PAGE 224]\n\n# （5）初始化程序段\n\n+   - CLI\n+   - MOV\t\tAL, 13H\t\t; ICW1\n+   -\
    \ OUT\t\t8CH, AL\n+   - MOV\t\tAL, 77H\t\t; ICW2\n+   - 0UT\t\t8DH, AL\n+   -\
    \ MOV\t\tAL, 01H\t\t; ICW4\n+   - OUT\t\t8DH, AL\n+   - MOV\t\tAL, 7FH\t\t; OCW1\n\
    +   - OUT\t\t8DH, AL\n+   - STI"
  - '[PAGE 225]


    # 2. 中断类型码77H的中断向量设置程序


    +   假设相应中断服务程序名为INTP，该符号地址包含段值属性和段内偏移量属性，将这二者分别存入中断向量地址，中断类型码77H的中断向量地址为77H×4=1DCH，即占用1DCH-1DFH等4个单元，其中1DEH-1DFH存放INTP的段地址，1DCH-1DDH存放INTP的段内偏移量。


    +   用串指令完成中断向量的设置，程序如下：


    +   CLI


    +   MOV    AX, 0


    +   MOV    ES, AX    ; 中断向量表段地址


    +   MOV    DI, 1DCH    ; 中断向量表偏移地址


    +   MOV    AX, OFFSET INTP    ; 中断服务程序偏移地址


    +   CLD


    +   STOSW


    +   MOV    AX, SEG INTP ; 中断服务程序段地址


    +   STOSW


    +   STI'
  md: "\n## （3）ICW3\n\n- ICW3的主要功能是：确定主片、从片的级联状态，即确定主片的连接位和从片的编码。\n- ICW3仅用于8259A的级联方式，它分为主片ICW3和从片ICW3两种格式。\n\
    - 1）主片ICW3的功能是用来表明主片8259A的IRx与从片8259A的INT之间连接关系，其格式及各位的具体定义如图3.3.5所示。图中S0-S7分别与主片8259A的IR0-IR7引脚的连接情况相对应，如果某一个引脚上连有从片，则对应位为1；如果未连从片，则对应位为0。比如当ICW3=0FH（00001111）时，表示在IR3、IR2、IR1、IR0引脚上接有从片，而IR7、IR6、IR5、IR4引脚上没连从片。\n\
