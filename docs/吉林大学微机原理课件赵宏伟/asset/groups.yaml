    ### 6.1 串行通信概述


    - 6.1.1 数字通信系统模型

    - 在数字通信中，首先要解决的问题是数字中的1和0如何表示与传送。有两种常用方法，即基带传输和频带传输。


    ### 1. 数字信号的基带传输系统模型


    - 从数据终端或计算机设备送出的原始数据信号一般包含很低的频率成分，甚至是含有直流分量。这些频率分量的范围就是电信号的基本频带，简称基带。换句话说，当终端设备把数据信息转换为适合传送的电信号时，这个电信号所固有的频带就是基带。相应地，这种原始的电信号就是基带信号。在计算机进行串行数据通信中，计算机或数据设备产生的0和1电信号脉冲序列就是基带信号，或称数据基带信号。


    - 在某种场合的通信中，基带信号不需要调制而直接在某些传输介质中传送。这种直接传输基带信号的系统称为基带系统。基带系统是数据通信系统中的重要组成部分。基带传输是数据通信系统中最基本的传输方式。


    ### 数字信号的基带传输系统框图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_356_0.png)


    图 6.1.1 数字信号的基带传输系统框图


    ### 2. 数字信号的频带传输系统模型


    - 基带传输方式适用于近距离传输数字信号。为进行远距离传输数字信号，可以利用已经广泛建立的双绞线、同轴电缆和光纤等有线信道，也可以利用空间电磁波传播的无线信道构成的通信网。然而，这些线路除光缆外绝大多数是为传输模拟信号而设计的，不能直接用来传输离散的数字基带信号。

    - 为了在模拟信道上间接地传输数字信号，必须对数字基带信号进行某种变换，使变换后的信号频谱落在信道频带之内，以适应于在模拟信道上传输，即实现数字基带信号的频带传输。

    - 字信号的频带传输是借助与高频载波实现的。高频载波是频率和幅值固定的周期信号，通常选用正弦信号。用数字信号控制载波的一个参数的变化，就可以实现数字信号变换成频带信号，这种变换就是调制。高频载波信号称为被调信号。数字信号称为调制信号。经过调制后的信号称为已调信号。已调信号经信道传输到接收端，在接收端通过反变换，将已调信号恢复成数字信号，这一反变换过程称为解调。具有调制和解调两种功能的装置称为调制解调器（Modem）。


    ### 数字信号的频带传输系统框图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_358_0.png)


    图 6.1.2 数字信号的频带传输系统框图


    - 按调制方式，Modem可分三类：调幅、调频和调相。其中，调频方式是常用的一种调制方式。调频时，数字信号1与0被调制成易于鉴别的两个不同频率的模拟信号。这种形式的调制称为频移键控FSK（Frequency
    Shift Keying），其原理如图6.1.3所示。

    - 两个不同频率的模拟信号分别由电子开关控制，在运算放大器的输入端相加，而电子开关由需要传输的数字信号来控制。当信号为1时，控制开关1导通，送出一串频率较高的模拟信号；当信号为0时，控制开关2导通，送出一串频率较低的模拟信号。于是在运算放大器的输出端，就得到了已调制的信号。


    ### 频移键控法调制原理图


    图 6.1.3 频移键控法调制原理图


    ### 6.1.2 串行通信的传送方向


    - 通常串行通信在两个站（或设备）A与B之间传送数据。按通信线路上数据传递的方向和时间的关系，可将通信分成单向、双向不同时和双向同时通信三类，常将它们分别称为单工通信、半双工通信和全双工通信。


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_361_0.png)


    图 6.1.4 三种通信方式


    ### 6.1.3 传输速率


    - 串行通信是一位一位传送的。衡量数字通信系统的一项重要指标是它的传输速率。可从以下两种不同角度来定义。

    - 1. 信息传输速率

    - 信息传输速率又称传信率或比特率，是单位时间（每秒）内通信系统所传送的信息量，记作Rb，其单位为比特/秒（bit/s或bps）。


    ### 2. 码元传输速率


    - 码元传输速率又称传码率，是单位时间（每秒）内通信系统所传送的码元数目，记作RB，其单位为波特（Baud）。每个码元所占有的时间TB叫做码长，则RB=1/TB。由于定义码元传输速率RB并没有限定是几进制码元，实际系统中可能采用不同进制，所以在给出传码率的同时应说明码元是几进制的，如果采用二进制则用RB2表示，M进制用RBM表示。M进制与二进制是可以相互表示的，当M=4时，则M进制的每个符号可用两位二进制符号表示。

    - RBM与RB2有如下关系

    - RB2=RBM×log2M （波特）


    ### 6.1.4 异步通信与同步通信


    - 在串行通信中有两种基本的通信方式：异步通信和同步通信。


    ### 1. 异步通信


    - 在异步通信中，它是以字符为一个独立的整体进行传送的。为了进行同步，用一个起始位表示传送字符的开始，用1～2个停止位表示字符的结束。起始位与停止位之间是数据位（5～8），数据位后面为校验位，校验位可以按奇校验设置，也可以按偶校验设置，不过，校验位也可以不设置。数据的最低位紧跟起始位，其他各位顺序传送。这样构成的一个信息发送单位称为帧。相邻两个字符之间的间隔叫空闲位，它可以是任意长度的高电平，以便处理实时的串行数据。然而，下一个字符的开始，必然以高电平变为低电平的下降沿作为起始位的标志。其结构如图6.1.5所示。图6.1.5(a)示出了最高数据传送率的格式，即在相邻字符之间去除空闲位后的格式，图6.1.5(b)示出了小于最高数据传送率的格式。


    ### # 异步串行通信格式


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_366_0.png)


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_366_1.png)


    图6.1.5 异步串行通信格式


    ### 2. 同步通信


    - 在同步通信中，它是以字符组作为一个独立的整体进行传递的。为了进行同步，每组字符之前必须加上一个或多个同步字符作为一个信息帧的起始位，如图6.1.6所示。同步字符后面是字符组（或称数据块），对每个字符不加附加位。

    - 异步通信是以字符为单位进行通信的，它要求在每个字符前后附加起始位和停止位，常常还需要奇偶校验位，附加信息在传送帧中约占20%，因此传输效率不高。而同步通信附加信息仅占1%，传输效率大大提高。

    - 对于异步通信，允许接收时钟和发送时钟有小的偏差。而对于同步通信，每个字节没有起始位和停止位，若存在偏差，则会积累。因此，接收时钟和发送时钟必须严格保持一致,故硬件电路比较复杂。


    ### 6.2 RS-232-C串行通信接口总线


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_368_0.png)


    图 6.2.1 串行通信系统的结构框图


    ### RS-232-C接口标准


    1. 机械特性


    由于RS-232-C并未定义连接器的物理特性，因此，出现了D25、D15和D9各种类型的连接器，其引脚定义也各不相同，使用时要特别注意。目前，常用的D9型连接器，其外形及信号分配如图6.2.2所示。通常连接器的插座接在DTE上，连接器的插头接在DCE上。


    2. 电气特性


    - RS-232-C的电气特性规定采用负逻辑电平，也就是说，在TXD和RXD数据线上，逻辑0相当于对信号地线有+3V～+15V电压（通常取+12V），而逻辑1相当于对信号地线有-3V～-15V的电压（通常取-12V）。

    - 在RTS、CTS、DSR和DCD等控制线上，信号有效（接通ON状态，正电压）的电平为+3V～+15V；信号无效（断开OFF状态，负电压）的电平为-3V～-15V。

    - 很明显，RS-232-C是用正负电压来表示逻辑状态，与TTL以高低电平表示逻辑状态的规定不同。因此，为了能够同计算机接口或终端的TTL器件连接，必须在RS-232-C与TTL电路之间进行电平和逻辑关系的变换，实现这种变换的方法可用集成电路芯片MC1488和MC1489来完成，如图6.2.3所示。当连接电缆线长度不超过15m时，允许数据传输速率不超过20kbps。

