    ## 1. USB的主要性能特点


    - （1）即插即用。即插即用（Plug and Play）是一种系统的设置方式。通常，指设备可以带电插拔，自动设置。连接外设不必关闭主机电源，USB可自动识别USB上的外围设备，具有自动配置和重新配置外设的能力。


    - （2）接口方便。USB最多可连接127个设备。每个USB系统中有 一个主机，采用“级联”方式，USB总线可连接多个外部设备。每个USB设备用一个USB插头连接到上一个USB设备的USB插座上，而其本身又提供一或多个USB插座供下一个或多个USB设备连接使用。USB电缆长度可达5m，线缆数目为4条（红、黑、绿、白）。


    - （3）传输速度快。USB支持三种速度模式：低速1.5Mb/s，全速12Mb/s，高速480Mb/s。低速适合交互设备：如键盘、鼠标、摄像头、游戏设备、虚拟现实。全速适合音频设备：如电话、声频、麦克风。高速适合影像设备：如视频、存储器、图像等设备。多个USB设备可能分享同一速度的信道，所以，设备越多，传输率越低。


    ## 2. USB的物理接口


    - USB总线的电缆有4根信号线：其中，D+（绿色）和D-（白色）是一对标准尺寸的双绞信号线，Vbus（红色）和GND（黑色）是一对标准尺寸的电源线。D+和D-每个时刻的信号状态（电平）相互相反。USB总线采用半双工传输方式。

    - USB设备的电源供给有两种方式：总线供给方式和自给方式（设备自带电源）。在总线供给方式中，每根USB电缆提供的电源功率是有限的，主机为直接连到它的USB设备提供电源，电压为4.75V～5.25V，最大电流值为500mA，并且当USB设备第一次被主机检测到时，设备吸入的电流值应小于100mA。完全依赖电缆供电的USB设备称做总线供电设备，有后备电源的设备称做自我供电设备。


    ## 4. 总线协议


    - USB是一种查询总线，由主控制器启动所有的数据传输。USB上所连接的外设通过主机基于令牌的调度协议来共享USB带宽。

    - 大部分总线事务涉及3个包的传输。当主控制器发出一个描述事务类型和方向、USB设备地址和端点号的USB包时，就开始发起一个事务，这个包被称为“令牌包”，它指示总线上要执行什么事务，寻址的USB设备及数据传送方向。然后，事务源发送一个数据包，最后，目标一般还要用一个指示传输是否成功的握手包来响应。


    ## 5. USB接口工作原理


    - USB设备最大的特点就是即插即用。USB协议在主机启动或者是USB设备插入系统的时候都要对设备进行配置。所谓配置，就是按照USB协议，在USB主机与USB设备之间进行的一系列“问答”过程。

    - 一个问答过程是通过主机与USB设备的端点0进行通讯来完成的。USB设备在插入USB端口时，主机都通过默认地址0与设备的端点0进行通信。在这个过程中，主机发出一系列试图得到描述符的标准请求，通过这些请求，主机得到所有感兴趣的设备信息，从而知道了设备的情况以及该如何与设备通信。随后主机通过发出Set
    Address请求为设备设置一个惟一的地址。这样，配置过程就完成了，以后主机就通过为设备设定好的地址与设备通信，而不再使用默认地址0。


