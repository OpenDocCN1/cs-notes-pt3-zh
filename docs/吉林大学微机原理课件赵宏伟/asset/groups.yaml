    # 4. 液晶显示的驱动


    +   - 液晶显示的驱动就是调整施加在液晶显示器件电极上的电位信号的相位、峰值、频率等，建立驱动电场。

    +   - 液晶显示的驱动方式有许多种，常用的驱动方法有静态驱动法和动态驱动法。

    +   - 对于TN及STN-LCD一般采用静态驱动法。'
  - '[PAGE 538]


    # 8.3.3 字符和图形显示的基本原理


    +   - 1. 字符显示方法

    +   - 为了叙述方便，以黑白字符显示为例来讲述CRT显示器字符显示的工作原理。图8.3.4是黑白字符显示的原理示意图。它由定时控制电路、显示存储器VRAM、字符发生器ROM、移位寄存器和视频信号合成电路组成。

    +   - 在CRT显示器进行光栅扫描的过程中，当电子束进行水平正程扫描时，图像信号通过控制电子束来控制各点的亮度，以便在CRT屏幕上形成图象。

    +   - 而在字符显示的情况下，只要用视频信号对扫描电子束简单地进行“开”或“关”控制，就可以用点阵在屏幕上组成字符。'
  - '[PAGE 539]


    # 2. 图形显示方法


    +   • 显示图像的最小单位是像素，而像素又以色彩为数据描述对象。图8.3.6所示为三种典型的不同的颜色数下的像素组合形式。

    +   • 如果分辨率为320×200，则共计有64000个像素点。若用1位二进制数据代表一个像素，那么这种模式最多可描述2种颜色，8个像素点占用1个字节，总共占用64000/8=8000个字节的VRAM。

    +   • 若用2位二进制数据代表一个像素，那么这种模式最多可描述4种颜色，4个像素点占用1个字节，总共占用64000/4=16000个字节的VRAM。

    +   • 同理，若用4位二进制数据代表一个像素，那么这种模式最多可描述16种颜色，2个像素点占用1个字节，总共占用64000/2=32000个字节的VRAM。可见，图形方式下，分辨率和像素模式决定了VRAM的大小。像素点越多，VRAM越大。颜色数越多，VRAM越大。'
  - '[PAGE 540]


    # 8.3.4 显示器的主要性能指标


    +   - 1. 像素和点距

    +   - 构成图象的最小单位或构成图象的点叫像素。

    +   - 2. 分辨率

    +   - 分辨率是指整屏可显示的像素的多少。最大分辨率与屏幕尺寸和点距密切相关。例如，15英寸的显示器，当点距是0.28mm时，就可具有1024×768点的最大分辨率。在相同分辨率下，点距越小，图象就越清晰，

    +   - 3. 显示器的尺寸

    +   - CRT显示器的尺寸指显像管的对角线尺寸。最大可视面积就是显示器可以显示图形的最大范围。'
  - '[PAGE 541]


    # 主要性能指标


    +   - 4. 扫描方式

    +   - CRT显示器的扫描方式分为“逐行扫描”和“隔行扫描”两种。隔行扫描是每隔一行显示一行，到底后再返回显示刚刚未显示的行，而逐行扫描是顺序显示每一行。逐行扫描比隔行扫描拥有更稳定的显示效果。目前，只有家用电视仍然采用隔行扫描方式。

    +   - 5. 像素的颜色范围

    +   - 一个像素可显示出多少种颜色，由表示这个像素的二进制位数决定（又称像素的位宽），如果每个像素使用8bit（一个字节）来表示它的颜色，则每个像素可有256色。如使用16bit，有65536种颜色；如用24bit表示，则可有16.8M颜色。'
  - '[PAGE 542]


    # 主要性能指标


    +   - 6. 刷新频率

    +   - 刷新频率就是屏幕刷新的速度。刷新频率越低，图像闪烁和抖动得就越厉害，眼睛疲劳得就越快。当采用70Hz以上的刷新频率时可基本消除闪烁。因此，70Hz的刷新频率是显示器稳定工作的最低要求。如能达到80Hz以上的刷新频率就可完全消除图像闪烁和抖动感，眼睛也不会太容易疲劳。虽然刷新频率越高越好，但是过高的刷新频率会加速CRT显像管的老化，通常85Hz比较合适。

    +   - 7. 视频带宽

    +   - 视频带宽是造成显示器性能差异的一个比较重要的因素。带宽决定着一台显示器可以处理的信息范围，就是指特定电子装置能处理的频率范围。'
  md: "\n## 例8.2.2 LED七段显示器及其接口\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_526_0.png)\n\
    \n图 8.2.6 8 位 7 段 LED 显示器接口电路\n\n## 程序设计\n\n- 下面是8个显示器重复显示（50次）8位十六进制数13579BDF的源程序。\n\
    \n```\nDATA SEGMENT\nTABLE: DB 0C0H    ; 0 的段码，开始设置段码表\n      DB 0F9H    ; 1 的段码\n\
    \      DB 0A4H    ; 2 的段码\n      DB 0B0H    ; 3 的段码\n      DB 99H     ; 4 的段码\n\
    \      DB 92H     ; 5 的段码\n      DB 82H     ; 6 的段码\n      DB 0F8H    ; 7 的段码\n\
    \      DB 80H     ; 8 的段码\n      DB 98H     ; 9 的段码\n      DB 88H     ; A 的段码\n\
    \      DB 83H     ; B 的段码\n      DB 0C6H    ; C 的段码\n      DB 0A1H    ; D 的段码\n\
    \      DB 86H     ; E 的段码\n      DB 8EH     ; F 的段码\nDATA ENDS\n```\n\n## 程序设计\n\
    \n```\nCODE    SEGMENT\n        ASSUME CS:CODE, DS:DATA\nSTART:  MOV     AX, DATA\n\
    \        MOV     DS, AX\n        MOV     AL, 80H\n        MOV     63H, AL    ;\
    \ 送各数据端口方式 0 的输出控制字\n        MOV     DL, 50     ; 设置重复次数，显示 50 次\n        LEA\
    \     SI, TABLE  ; 取段码表首址\n        MOV     BX, 1      ; 欲显示的字形设置为数字 “1”，是最左位显示的数\n\
    \        MOV     AH, 7FH    ; 显示位 7 的位选码，指向最左位（第 7 显示位）\n```\n\n## 8.3 视频系统\n\n\
    - 视频系统是计算机系统的重要组成部分，包括显示器和显示适配器（通常被称为显示控制卡、显示卡、显卡）。用户主要是通过键盘和显示器进行人机对话来实现计算机操作，没有显示器用户无法进行工作。显示器能将计算机的输出信息转换成各种直观的图形、图象和字符，程序、数据也能在屏幕上显示出来。它具有速度快、无噪音、无机械磨损、直观形象、方便可靠等优点。由于显示器屏幕上的信息只能供观察，不能永久地记录，所以又称为软拷贝设备。\n\
    - 显示器的种类很多，按使用的显示器件不同，主要分为两大类：一类是阴极射线管显示器，简称为CRT显示器；另一类是平板显示器，主要包括发光二极管显示器、LCD液晶显示器和等离子体显示器等。\n\
    \n## 8.3.1 CRT显示器\n\n- 1. CRT显示器的基本组成\n\nCRT（Cathode Ray Tube）显示器的基本组成主要包括视频放大驱动电路、行扫描电路、场扫描电路、高压电路、CRT显象管以及机内直流电源等六大部分，如图8.3.1所示。\n\
    \n在图8.3.1中，视频放大驱动电路将主机经显示卡送来的视频信号放大驱动后，送到CRT显象管的阴极，产生电子束轰击屏幕而出现光点。由显示卡送来的水平（行）同步信号与垂直（场）同步信号，分别经行扫描电路和场扫描电路，为CRT显象管的水平（行）偏转线圈和垂直（场）偏转线圈提供具有一定幅度和线性良好的锯齿波电流，产生垂直方向和水平方向的偏转磁场，控制电子束在水平或垂直方向偏转，形成扫描光栅。\n\
    \n## CRT显示器组成框图\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_532_0.png)\n\n图 8.3.1\
    \ CRT 显示器组成框图\n\n### 2. 光栅扫描\n\n- 电子束首先出现在屏幕的左上角，再扫至右上角，这样在屏幕上就留下一条线。这条线就称为光栅线，当电子束到达屏幕右边后，它又以极高的速度重新定位到屏幕左边，这样在第一条轨迹的下面又出现一条线，叫水平回扫。\n\
    - 从这点开始经水平扫描又在屏幕上产生了第二条显示线。这个扫描过程一直持续到水平扫描到达屏幕底部，此时一帧画面扫描完毕。\n- 最后，电子束又以极高的速度回扫到屏幕左上角，称为垂直回扫。\n\
    - 在水平回扫和垂直回扫的过程中，要对电子束进行抑制（消隐），使回扫线不在屏幕上显示出来。\n- 于是在屏幕上就出现了一条条水平的光栅扫描线。\n\n##\
    \ 8.3.2 液晶显示器\n\n- 液晶显示器从结构上说，属于平板显示器件，简称LCD（Liquid Crystal Display）显示器。\n- 1.\
    \ 液晶及其分类\n- LCD显示器的基础材料是液晶。从字面看，液晶就是“液态”的“晶体”，可见，它既具有液体的“流动性”，又具有晶体的“光学各向异性”。奥地利生物学家F.Reinitzer在1888年首先观察到液晶现象，经过进一步确认后，将这种“兼有液体流动性和晶体光学各向异性的液体”，建议称之为“液晶”。可见，液晶是一种介于固态和液态之间的物质，是具有规则性分子排列的有机化合物，如果把它加热会呈现透明状的液体状态，把它冷却则会出现结晶颗粒的混浊固体状态。液晶态物质既具有液体的流动性和连续性，又保留了晶体的有序排列性，物理上呈现各向异性。\n\
    \n### 2. TN液晶显示器的原理\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_535_0.png)\n\n\
    图8.3.3 TN型液晶显示屏结构\n\n## 4. 液晶显示的驱动\n\n- 液晶显示的驱动就是调整施加在液晶显示器件电极上的电位信号的相位、峰值、频率等，建立驱动电场。\n\
    - 液晶显示的驱动方式有许多种，常用的驱动方法有静态驱动法和动态驱动法。\n- 对于TN及STN-LCD一般采用静态驱动法。\n\n## 8.3.3 字符和图形显示的基本原理\n\
    \n- 1. 字符显示方法\n- 为了叙述方便，以黑白字符显示为例来讲述CRT显示器字符显示的工作原理。图8.3.4是黑白字符显示的原理示意图。它由定时控制电路、显示存储器VRAM、字符发生器ROM、移位寄存器和视频信号合成电路组成。\n\
    - 在CRT显示器进行光栅扫描的过程中，当电子束进行水平正程扫描时，图像信号通过控制电子束来控制各点的亮度，以便在CRT屏幕上形成图象。\n- 而在字符显示的情况下，只要用视频信号对扫描电子束简单地进行“开”或“关”控制，就可以用点阵在屏幕上组成字符。\n\
    \n### 2. 图形显示方法\n\n- • 显示图像的最小单位是像素，而像素又以色彩为数据描述对象。图8.3.6所示为三种典型的不同的颜色数下的像素组合形式。\n\
    - • 如果分辨率为320×200，则共计有64000个像素点。若用1位二进制数据代表一个像素，那么这种模式最多可描述2种颜色，8个像素点占用1个字节，总共占用64000/8=8000个字节的VRAM。\n\
    - • 若用2位二进制数据代表一个像素，那么这种模式最多可描述4种颜色，4个像素点占用1个字节，总共占用64000/4=16000个字节的VRAM。\n-\
    \ • 同理，若用4位二进制数据代表一个像素，那么这种模式最多可描述16种颜色，2个像素点占用1个字节，总共占用64000/2=32000个字节的VRAM。可见，图形方式下，分辨率和像素模式决定了VRAM的大小。像素点越多，VRAM越大。颜色数越多，VRAM越大。\n\
    \n## 8.3.4 显示器的主要性能指标\n\n- 1. 像素和点距\n- 构成图象的最小单位或构成图象的点叫像素。\n- 2. 分辨率\n- 分辨率是指整屏可显示的像素的多少。最大分辨率与屏幕尺寸和点距密切相关。例如，15英寸的显示器，当点距是0.28mm时，就可具有1024×768点的最大分辨率。在相同分辨率下，点距越小，图象就越清晰，\n\
    - 3. 显示器的尺寸\n- CRT显示器的尺寸指显像管的对角线尺寸。最大可视面积就是显示器可以显示图形的最大范围。\n\n## 主要性能指标\n\n- 4.\
    \ 扫描方式\n- CRT显示器的扫描方式分为“逐行扫描”和“隔行扫描”两种。隔行扫描是每隔一行显示一行，到底后再返回显示刚刚未显示的行，而逐行扫描是顺序显示每一行。逐行扫描比隔行扫描拥有更稳定的显示效果。目前，只有家用电视仍然采用隔行扫描方式。\n\
    - 5. 像素的颜色范围\n- 一个像素可显示出多少种颜色，由表示这个像素的二进制位数决定（又称像素的位宽），如果每个像素使用8bit（一个字节）来表示它的颜色，则每个像素可有256色。如使用16bit，有65536种颜色；如用24bit表示，则可有16.8M颜色。\n\
    \n## 主要性能指标\n\n- 6. 刷新频率\n- 刷新频率就是屏幕刷新的速度。刷新频率越低，图像闪烁和抖动得就越厉害，眼睛疲劳得就越快。当采用70Hz以上的刷新频率时可基本消除闪烁。因此，70Hz的刷新频率是显示器稳定工作的最低要求。如能达到80Hz以上的刷新频率就可完全消除图像闪烁和抖动感，眼睛也不会太容易疲劳。虽然刷新频率越高越好，但是过高的刷新频率会加速CRT显像管的老化，通常85Hz比较合适。\n\
    - 7. 视频带宽\n- 视频带宽是造成显示器性能差异的一个比较重要的因素。带宽决定着一台显示器可以处理的信息范围，就是指特定电子装置能处理的频率范围。\n"
