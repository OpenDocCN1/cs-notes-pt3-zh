    # 6.1.2 串行通信的传送方向


    +   通常串行通信在两个站（或设备）A与B之间传送数据。按通信线路上数据传递的方向和时间的关系，可将通信分成单向、双向不同时和双向同时通信三类，常将它们分别称为单工通信、半双工通信和全双工通信。


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_361_0.png)


    图 6.1.4 三种通信方式'
  - '[PAGE 362]


    # 6.1.3 传输速率


    +   - 串行通信是一位一位传送的。衡量数字通信系统的一项重要指标是它的传输速率。可从以下两种不同角度来定义。

    +   - 1. 信息传输速率

    +   - 信息传输速率又称传信率或比特率，是单位时间（每秒）内通信系统所传送的信息量，记作Rb，其单位为比特/秒（bit/s或bps）。'
  - '[PAGE 363]


    # 2. 码元传输速率


    +   - 码元传输速率又称传码率，是单位时间（每秒）内通信系统所传送的码元数目，记作RB，其单位为波特（Baud）。每个码元所占有的时间TB叫做码长，则RB=1/TB。由于定义码元传输速率RB并没有限定是几进制码元，实际系统中可能采用不同进制，所以在给出传码率的同时应说明码元是几进制的，如果采用二进制则用RB2表示，M进制用RBM表示。M进制与二进制是可以相互表示的，当M=4时，则M进制的每个符号可用两位二进制符号表示。

    +   - RBM与RB2有如下关系

    +   - RB2=RBM×log2M （波特）'
  - '[PAGE 364]


    # 6.1.4 异步通信与同步通信


    +   - 在串行通信中有两种基本的通信方式：异步通信和同步通信。'
  - '[PAGE 365]


    # 1. 异步通信


    +   - 在异步通信中，它是以字符为一个独立的整体进行传送的。为了进行同步，用一个起始位表示传送字符的开始，用1～2个停止位表示字符的结束。起始位与停止位之间是数据位（5～8），数据位后面为校验位，校验位可以按奇校验设置，也可以按偶校验设置，不过，校验位也可以不设置。数据的最低位紧跟起始位，其他各位顺序传送。这样构成的一个信息发送单位称为帧。相邻两个字符之间的间隔叫空闲位，它可以是任意长度的高电平，以便处理实时的串行数据。然而，下一个字符的开始，必然以高电平变为低电平的下降沿作为起始位的标志。其结构如图6.1.5所示。图6.1.5(a)示出了最高数据传送率的格式，即在相邻字符之间去除空闲位后的格式，图6.1.5(b)示出了小于最高数据传送率的格式。'
  - '[PAGE 366]


    # # 异步串行通信格式


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_366_0.png)


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_366_1.png)


    图6.1.5 异步串行通信格式'
  - '[PAGE 367]


    # 2. 同步通信


    +   - 在同步通信中，它是以字符组作为一个独立的整体进行传递的。为了进行同步，每组字符之前必须加上一个或多个同步字符作为一个信息帧的起始位，如图6.1.6所示。同步字符后面是字符组（或称数据块），对每个字符不加附加位。

    +   - 异步通信是以字符为单位进行通信的，它要求在每个字符前后附加起始位和停止位，常常还需要奇偶校验位，附加信息在传送帧中约占20%，因此传输效率不高。而同步通信附加信息仅占1%，传输效率大大提高。

    +   - 对于异步通信，允许接收时钟和发送时钟有小的偏差。而对于同步通信，每个字节没有起始位和停止位，若存在偏差，则会积累。因此，接收时钟和发送时钟必须严格保持一致,故硬件电路比较复杂。'
  - '[PAGE 368]


