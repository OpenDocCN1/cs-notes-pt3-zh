    ## 1.2.5 中断描述符表及寄存器


    - 同全局描述符表寄存器一样，Pentium微处理器通过中断描述符表寄存器IDTR在内存中定义了一个中断描述符表IDT，中断描述符表是Pentium微处理器进入保护方式后存储器管理系统中的又一个重要组成部分。

    - 同GDTR一样，IDTR是Pentium微处理器中的48位寄存器。该寄存器的低2个字节标识为16位界限，它规定了IDT按字节计算的大小，IDT最大可达64KB（但是Pentium微处理器只能够支持256个中断和异常，最多占用2KB）。IDTR的高4个字节标为32位基地址，指示IDT在存储器中开始的物理地址。

    - 中断描述符表IDT中存放的描述符类型均是门描述符。门提供了一种将程序控制转移到中断服务程序入口的手段。每个门8个字节，包含服务程序的属性和起始地址。


