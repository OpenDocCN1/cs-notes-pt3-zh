    ## 4. RS-232-C接口的连接


    - 在使用RS-232-C实现近距离与远距离通信时，所使用的信号线是不同的。所谓近距离是指传输距离小于15m的通信。在15m以上为远距离。下面分别介绍几种典型的连接方式。

