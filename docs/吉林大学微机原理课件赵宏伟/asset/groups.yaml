    # 8.1.2 线性键盘


    +   - 从按键的连接方式，键盘可以分为线性键盘和矩阵键盘两类。

    +   - 线性键盘采用独立式按键，是最简单的键盘结构，它是指直接用I/O口线构成的单个按键电路。每一按键互相独立地各自接通一条输入I/O口线，每根I/O口线上的按键的工作状态不会影响其它I/O口线的工作状态。如图8.1.2所示为线性键盘的按键电路。通常按键输入都采用低电平有效，上拉电阻保证了按键断开时，I/O口线有确定的高电平。当I/O口内部有上拉电阻时，外电路可以不配置上拉电阻。

    +   - 线性键盘电路配置灵活，软件结构简单。但每个按键必须占用一根I/O口线，在按键数量较多时，I/O口线浪费较大。故在按键数量不多时，常采用这种按键电路。'
