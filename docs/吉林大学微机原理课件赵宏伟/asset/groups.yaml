  - '[PAGE 476]


    # 4. 采样保持器的级联


    +   - 保持电容CH的取值要影响两个相互矛盾的参数：采集时间和电压衰减率，而在实际应用中，常需要高的捕捉速度和长的保持时间。

    +   - 在这种情况下，可用两个采样保持器级联使用。第一级采样保持器电容较小，因此可以迅速在采样点获得模拟信号，第一级的输出作为第二级的输入，而第二级的保持电容较大，且输入信号是来自前级的稳定信号，所以输出电压衰减率很低，从而既取得高捕捉速率，又增加了保持时间，这种级联采样保持电路的总的取样率由两个取样保持器取样率的“和”来决定。'
