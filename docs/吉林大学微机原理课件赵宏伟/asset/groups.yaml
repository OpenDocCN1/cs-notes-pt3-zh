    \   ROL     AH, 1              ; AH循环左移一位，准备扫描下一行\n    LOOP    X2            \
    \     ; 4行未全部扫描完，转\n    MOV     AH, 80H             ; 4行全部扫描完，却未发现有键按下（可能出现\n\
    \                               ; 了干扰，以80H作为这种情况的标志。\n                       \
    \        ; 该指令的设置，主要考虑到程序的完备性，\n                               ; 即可以使程序在任何情况下都能正确执行。\n\
    \n    JMP     XEND\n```\n"
