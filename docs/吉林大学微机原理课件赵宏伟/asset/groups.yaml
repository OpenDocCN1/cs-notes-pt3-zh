    ## 共阴极LED七段显示器的段选码\n\n| 字形 | h D7 | g D6 | f D5 | e D4 | d D3 | c D2 | b D1 |\
    \ a D0 | 段码 (H) |\n|---|---|---|---|---|---|---|---|---|---|\n| 0 | 0 | 0 | 1\
    \ | 1 | 1 | 1 | 1 | 1 | 3F |\n| 1 | 0 | 0 | 0 | 0 | 0 | 1 | 1 | 0 | 06 |\n| 2\
    \ | 0 | 1 | 0 | 1 | 1 | 0 | 1 | 1 | 5B |\n| 3 | 0 | 1 | 0 | 0 | 1 | 1 | 1 | 1\
    \ | 4F |\n| 4 | 0 | 1 | 1 | 0 | 0 | 1 | 1 | 0 | 66 |\n| 5 | 0 | 1 | 1 | 0 | 1\
    \ | 1 | 0 | 1 | 6D |\n| 6 | 0 | 1 | 1 | 1 | 1 | 1 | 0 | 1 | 7D |\n| 7 | 0 | 0\
    \ | 0 | 0 | 0 | 1 | 1 | 1 | 07 |\n| 8 | 0 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 7F |\n\
    | 9 | 0 | 1 | 1 | 0 | 1 | 1 | 1 | 1 | 6F |\n| A | 0 | 1 | 1 | 1 | 0 | 1 | 1 |\
    \ 1 | 77 |\n| B | 0 | 1 | 1 | 1 | 1 | 1 | 0 | 0 | 7C |\n| C | 0 | 0 | 1 | 1 |\
    \ 1 | 0 | 0 | 1 | 39 |\n| D | 0 | 1 | 0 | 1 | 1 | 1 | 1 | 0 | 5E |\n| E | 0 |\
    \ 1 | 1 | 1 | 1 | 0 | 0 | 1 | 79 |\n| F | 0 | 1 | 1 | 1 | 0 | 0 | 0 | 1 | 71 |\n\
    | P | 0 | 1 | 1 | 1 | 0 | 0 | 1 | 1 | 73 |\n| 不显示 | 0 | 0 | 0 | 0 | 0 | 0 | 0\
    \ | 0 | 00 |\n\n## 8.2.2 LED显示器组成与显示方式\n\n- LED显示器通常由若干个LED七段显示器组成，有静态显示与动态显示两种方式。\n\
    - 1. LED显示器静态显示方式\n- 所谓静态显示，就是当显示器显示某一个字符时，相应的发光二极管恒定地导通或截止。LED显示器在静态显示方式下，各显示位的位选线即共阴极点（或共阳极点）连接在一起接地（或接+5V）；各显示位的段选线（a～h）与一个8位并行口相连。\n\
    - 静态显示方式电路每一显示位可独立显示，只要在该位的段选线上保持段选码电平，该位就能保持相应的显示字符。由于每一显示位都由一个相应的8位输出口锁存段选码，故在同一时刻不同的显示位可以显示不同的字符。\n\
    - 2. LED显示器动态显示方式\n- 在多位LED显示时，为了简化电路，降低成本，可采用动态显示方式。所谓动态显示，就是一位一位地轮流点亮各位数显示器（扫描）。对于某一位置显示器来说，每隔一段时间点亮一次。显示器的亮度既与导通电流有关，也与点亮时间和间隔时间的比例有关。\n\
    \n## 8.2.3 LED显示器接口及应用举例\n\n- 从LED显示器的显示原理可知，为了显示字母与数字，必须最终转换成相应的段选码。这种转换可以通过硬件译码器来进行，也可以由软件进行译码。\n\
    \n## 1. 硬件译码显示器接口\n\n- MC14495是Motorola公司生产的CMOS BCD-七段十六进制锁存、译码、驱动芯片。该电路的特点是可显示16进制字符，同时还有译码器输入大于等于10时的指示端（h+i）。当输入数据≥10时，h+i端输出“1”电平。另外还有输入数据为15时，电路输出端为“0”电平（其它输入状态时为高阻）的功能。电路内部还有一个290欧姆的限流电阻，故LED不须外加限流电阻。\n\
    - 当显示数据大于等于10时，h+i端输出“1”电平。注意：若要显示带小数点的数据，则需要在LED七段显示器的h端另加驱动控制，MC14495本身不能完成显示小数点的功能。\n\
    \n## 2. 软件译码显示器接口\n\n- 由于微型机本身具有较强的逻辑控制能力，所以采用软件译码并不复杂。\n- 而且软件译码的译码逻辑可随意编程设定，不受硬件译码逻辑限制。\n\
    - 采用软件译码还能简化硬件电路结构，因此，在微型机和单片机应用系统中，使用最广泛的还是软件译码的显示接口。\n\n## (1) 软件译码静态显示接口\n\n\
    - 例8.2.1 某8086 CPU系统通过8255A与按键开关、LED七段显示器等外部设备相连接，电路原理如图8.2.4所示。\n- 由图可知，8255A的端口A、端口B、端口C、控制端口的地址分别为C4H、C5H、C6H、C7H。8255A工作在方式0，端口A输入，端口B输出，能够正常工作的控制字为10010000B\
    \ (90H)。\n- 电路中的LED七段显示器采用共阳极显示器，静态工作方式。在LED七段显示器段码驱动时，采用了反向驱动，所以要注意正确配置段码表。电路连接了4个按键开关K3~K0。\n\
    - 4个按键开关K3~K0组成了4位二进制数值（K3对应高位，K0对应低位），并对应1位十六进制数。\n\n## 8255A与按键、七段显示器连接电路原理图\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_522_0.png)\n\n图 8.2.4 8255A与按键、七段显示器连接电路原理图\n\
    \n## 程序段\n\n```\nSTART:  MOV   AL, 90H          ; 设置方式控制字，口 A 输入，口 B 输出\n    \
    \    OUT   0C7H, AL\nX1:     IN    AL, 0C4H          ; 输入按键状态\n        AND   AL,\
    \ 0FH           ; 屏蔽掉不用的高 4 位\n        MOV   BX, OFFSET LEDTAB  ; 设置段码表指针\n  \
    \      XLAT                     ; 读取段码\n        OUT   0C5H, AL           ; 输出段码到端口\
    \ B\n        MOV   AX, 200H           ; 延时\nX2:     DEC   AX\n        JNZ   X2\n\
    \        JMP   X1\n        HLT\n```\n\n## 程序段\n\n```\nLEDTAB DB 3FH    ; 0 的段码,\
    \ 设置段码表\n      DB 06H    ; 1 的段码\n      DB 5BH    ; 2 的段码\n      DB 4FH    ; 3\
    \ 的段码\n      DB 66H    ; 4 的段码\n      DB 6DH    ; 5 的段码\n      DB 7DH    ; 6 的段码\n\
    \      DB 07H    ; 7 的段码\n      DB 7FH    ; 8 的段码\n      DB 6FH    ; 9 的段码\n \
    \     DB 77H    ; A 的段码\n      DB 7CH    ; B 的段码\n      DB 39H    ; C 的段码\n  \
    \    DB 5EH    ; D 的段码\n      DB 79H    ; E 的段码\n      DB 71H    ; F 的段码\n```\n\
    \n## （2）软件译码动态显示接口\n\n- 动态显示程序设计中显示程序的要点：\n- 1）解决显示译码问题，因为要显示的数字与其对应的段选码并没有有机联系和转换规律，所以要用查表的方法完成这种译码功能。\n\
    - 2）在进入显示程序之前，为保持显示的数据，专门开辟几个单元作为显示缓冲区，用以存放要显示的数字（十六进制数）。\n- 采用软件译码方法一般有两种表格设置方案：\n\
    - 1）顺序表格排列法，即按一定的顺序排列显示段码。通常显示的字形数据就是该段码在段码表中相对表头的偏移量。\n- 2）数据结构法，即按字形和段码的关系，自行设计一组数据结构。该方法设计灵活，但程序运行速度较慢。\n"
