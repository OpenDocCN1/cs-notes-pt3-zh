    ## 3种形式的特权管理


    + 在实施管理中使用了3种形式的特权管理：当前任务特权CPL、选择符特权RPL和描述符特权DPL。并且规定：特权级为P的段中存储的数据，只能由特权级高于或等于P的段中运行的程序使用；特权级为P的代码段/过程，只能由在低于或等于P的特权级下执行的任务调用。


    ## （1）当前特权级CPL


    + CPL是当前正在执行的代码段所具有的访问特权级，存放在CS段寄存器的最低两位。

    + 每一项任务都是在其代码段描述符所确定的特权级中运行。当前特权级就是任务执行时所处的特权级。例如，一个正在运行的任务的CPL，就是其描述符中访问权限字节的DPL。当前特权级的值一般就是代码段描述符中的DPL。任务执行时当前特权级一般不能改变，如果必须改变，只能通过代码段的门描述符的控制转换才能实现。一般高一级的任务可以访问同级或低级GDT和LDT中定义的数据，显然在第3特权级执行的任务对数据的访问受到的限制最大。


    ## （2）描述符特权级DPL


    + DPL是段被访问的特权级，保存在该段的段描述符的特权级DPL位。


    ## （3）请求特权级RPL


    + RPL是新装入段寄存器的段选择符的特权级，存放在段选择符的最低两位。


