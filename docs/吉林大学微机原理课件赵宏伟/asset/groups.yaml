    - 1.3.1 保护机制的分类

    - 1. 任务间存储空间的保护

    - 任务间的保护是通过每一个任务所专用的LDT描述符实现的。根据LDT描述符，每个任务都有它特定的虚拟空间，因而避免各任务之间的干扰，起到隔离、保护的作用。

    - 2. 段属性和界限的保护

    - 当段寄存器进行加载时，需要进行段存在性检查（属性字节的P位）以及段限检查。

    - 在段描述符中给出了20位的段界限值，每当产生一个逻辑地址时，都要比较偏移量和段限值。一旦偏移地址大于段限值，CPU就终止执行命令，并发出越限异常。由此限制每个程序段只在自己的程序、数据段内运行，不相互干扰。

    - 最后，还要对该段的读写权限进行检查。

    - 3. 特权级与特权级保护

    - 特权级与特权保护是为了支持多用户多任务操作系统，使系统程序和用户的任务程序之间、各任务程序之间互不干扰而采取的保护措施。Pentium微处理器系统提供了一个4级特权管理系统，也就是4级保护系统，如图1.3.1所示。这样可为不同程序规定一个权限，控制特权指令和I/O指令的使用，控制对段和段描述符的访问，从而有效地防止不同程序执行时的相互干扰或非法访问、非法改写GDT和LDT。

    '
