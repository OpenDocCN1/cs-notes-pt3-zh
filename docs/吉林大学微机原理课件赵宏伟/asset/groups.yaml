    # 8.3.5 显示适配器


    +   - 显示适配器又称显示卡、显卡、图像加速卡等，通常以附加卡的形式安装在主板的扩展槽中或集成在主板上。显示适配器是主机CPU与显示器之间的接口，其作用是接受CPU的命令、访问显示存储器VRAM、产生屏幕所需的信号。

    +   - PC机采用了许多不同的视频显示标准，从MDA、CGA、EGA到VGA等每一种视频标准都有相应的显示适配器与之对应。几种视频标准的特点如下：

    +   - MDA（Monochrome Display Adapter）：单色字符显示适配器。MDA是PC机最早使用的显示标准。采用9×14点阵的字符窗口，满屏显示80列×25行字符，对应分辨率为720×350像素。

    +   - CGA（Color Graphics Adapter）：彩色图形与字符显示适配器，可以兼容字符和图形两种显示方式。字符分辨率为40×25或80×25，图形分辨率320×200或640×，前者可选用4种颜色，后者选用两种颜色。'
