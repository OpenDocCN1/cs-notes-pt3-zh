    ## 3.2.2 可屏蔽中断INTR


    - 可屏蔽中断请求线INTR通常由Intel 8259A中断控制器驱动，该控制器可由软件命令来控制其工作方式。8259A的主要任务是：接收与其相连的外部设备的中断请求，确定优先级，向INTR引脚发中断请求，通过数据总线向CPU发中断类型码。

    - 当CPU在INTR引脚上接收到一个高电平的中断请求信号，并且当前的中断允许标志位IF为1时，CPU就会在当前指令执行结束后，响应INTR引脚的中断请求。Pentium要求可屏蔽中断请求信号是一个高电平信号，并且，INTR信号的高电平必须维持到CPU响应中断后才结束。


    ## 中断响应总线周期


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_158_0.png)


    （在第 1 个和第 2 个中断响应总线周期之间插入 4 个空闲状态）


    图 3.2.3 中断响应总线周期


    ## 3.2.4 软件中断


    - 软件中断包括 INTO、INT3、INT n、BOUND 指令。软件中断的特点是：

    - （1）软件中断指令是程序员人为设置在程序中的。

    - （2）中断类型码包含在指令中，所以不执行中断响应总线周期。

    - （3）除 BOUND 指令外，中断返回地址指向软件中断指令的下一条指令。


    - 1. INT n中断指令

    - 执行INT n指令时（n取值为0～255），将使CPU进入中断类型码n所对应的中断服务程序。

    - 2. INT3中断指令

    - INT3是一个单字节的断点中断指令，执行INT3指令时，将使CPU进入类型为3的中断服务程序。

    - 3. INTO中断指令

    - INTO溢出中断指令也是一个单字节的指令。INTO指令通常是跟在有符号数的加法运算或减法运算指令的后面。当运算指令使溢出标志OF为1时，执行INTO指令就会进入类型为4的溢出中断服务程序，此时中断服务程序给出出错标志。如果运算指令使OF为0，那么，接着执行INTO指令时，也会进入中断服务程序，但此时中断处理程序仅仅是对标志进行测试，然后很快返回主程序。

    - 4. BOUND中断指令


    ## 3.2.5 异常简介


    - 异常既不是外部硬件产生的，也不是用软件指令产生的，而是在CPU执行一条指令过程中出现的错误或检测到的异常情况自动产生的。除单步（陷阱）中断外，异常中断返回地址指向程序中发生中断的地方，而不是指向产生中断指令的下一条指令。


    ## 1. 类型0除法出错


    - 在执行除法指令后结果溢出或遇到除数为0的情况，则CPU会自动产生类型为0的中断，转入相应的中断处理程序。


    ## 2. 类型1单步（陷阱）


    - 当标志寄存器中的陷阱标志位TF为1时，每执行一条指令后，就进入一次类型1的中断服务程序，此中断服务程序用来显示出一系列寄存器的值，并且告示一些附带的信息。因此，单步中断一般用在调试程序中逐条执行用户程序。

    - Pentium没有直接对TF标志置“1”或置“0”的指令，可以通过修改存放在堆栈中标志的内容或其他间接方法来改变TF之值。


    ## 3. 类型6无效操作码


    - 在程序中遇到未定义的操作码时发生此中断。


    ## 4. 类型7设备不可用


    - 设备不可用故障会在以下两种条件下产生：

    - （1）Pentium微处理器执行了一条ESC（处理机脱离）指令，且控制寄存器CR0中的EM（模拟协处理器）位被置成“1”。

    - （2）Pentium微处理器执行了一条WAIT指令，且控制寄存器CR0中的（监控协处理器位）MP=1，或执行了一条ESC指令，且控制寄存器CR0的TS（任务切换）位被置为“1”。


    ## 5. 类型8双故障


    - 一般情况下，若Pentium微处理器在调用一个异常处理程序时又检测到了一个异常，则对这两个异常可以进行串行处理。但是，如果处理机不能对它们实施串行处理，则它将发出一个双故障异常信息。


    ## 6. 类型10无效任务状态段


    - 试图把任务转换到一个具有无效任务状态段的段内时，就会产生无效任务状态段故障。


    ## 7. 类型11段不存在


    - 当描述符中的P位（P=0）指示段不存在或无效时发生该中断。


    ## 8. 类型12堆栈段超限


    - 如果堆栈段不存在（P=0）或堆栈段超限，则发生该中断。


    ## 9. 类型13一般保护


    在保护模式下，不会引起另一个异常的发生但却违背了保护规则的所有动作都将引起一个一般保护异常。下面列出一些违背保护规则的情况（不是全部）：


    - （1）描述符表边界超出。

    - （2）违反特权规则。

    - （3）在使用代码段CS、数据段DS、附加数据段ES、FS或GS时超出了段界限。

    - （4）对被保护代码段的写操作。

    - （5）从只能执行的代码段读取数据。


    ## 10. 类型14页面出错


    - 访问页面出错的存储器时发生此中断。


    ## 11. 类型16浮点错


    - 浮点错故障是由浮点算术运算指令产生的一种错误信号，只有当控制寄存器CR0中的NE（数值异常事故）位被置成1时，才可能出现浮点错中断。


    ## 12. 类型17对准检查


    - 对准检查故障是在对非对准的操作数进行访问时产生的。例如，一个存储在奇数字节地址上的字以及一个存储在非4的整数倍的地址上的双字等就是非对准的数。


    ## 13. 类型18机器检查


    - 在Pentium～PentiumII微处理器中激活一个系统存储器管理模式中断。


    ## 3.2.6 实模式中断处理过程


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_175_0.png)


    图3.2.4 实模式下中断的基本过程


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_176_0.png)


    ## 3.2.7 保护模式中断操作


    - 保护模式下的中断与实模式几乎完全相同，但在保护模式下，用中断描述符表IDT来替代中断向量表。

    - 中断描述符表由中断描述符表地址寄存器IDTR定位于系统中任一存储单元。中断描述符表包含的是门描述符，而不是向量。从图3.2.5中可以看到该表最多包含256个门描述符。这些门描述符分别与中断类型码0～255相对应。门描述符可定义为陷阱门、中断门或者任务门。

    - 当Pentium响应一个异常或中断时，以其类型码为依据，指向IDT中的一个门描述符。如果被寻址的门描述符是任务门，则它将以一种与用CALL指令调用一个任务门相同的方式引起一次任务的转换。若是索引指向一个中断门或自陷门，则它将以一种与用CALL指令调用一个调用门相同的方式调用异常或中断服务程序。但对于中断门而言，进入中断服务程序之前会将IF复位为0，陷阱门则不理睬IF标志。


    ## Pentium在保护模式下中断转移的过程示意图


    图 3.2.5 Pentium 在保护模式下中断转移的过程示意图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_178_0.png)


    ## 3.3 可编程中断控制器8259A


    - 在中断控制过程中，中断源的识别和优先权的确定可以用硬件排队电路等实现，Inter 8259A可编程中断控制器就是为完成这些任务而设计的一种器件。

    - 它不是I/O接口，而是一种中断管理芯片，简称PIC（Programmable Interrupt Controller）。8259A可编程中断控制器用来管理8级优先中断，并可将多个8259A级联起来，构成64级中断优先级管理系统，而无须外加电路，它具有多种工作方式，CPU可以通过编程设定或改变它的工作方式，CPU响应中断时，8259A能自动提供中断入口地址，而使CPU转向相应的中断处理程序。


    ## 8259A的主要功能


    - （1）每片8259A可管理8级优先权中断源，在基本不增加其他电路的情况下，通过8259A的级联，最多可管理64级优先权的中断源。

    - （2）对任何一个级别的中断源都可单独进行屏蔽，使该级中断请求暂时被禁止，直到取消屏蔽时为止。

    - （3）向CPU提供可编程的标识码，对于8086～Pentium的CPU来说就是中断类型码。

    - （4）有多种工作方式，可通过编程选择。

    - （5）可与8086～Pentium的CPU直接连接，不需外加硬件电路。


    ## 3.3.1 8259A的内部结构及引脚功能


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_181_0.png)


    ## 1. 中断请求寄存器IRR


    - 中断请求寄存器IRR用于寄存所有IR输入线输入的中断请求信号，即保存正在请求服务的中断级。

    - 中断请求寄存器IRR接收外部的中断请求，IRR有8位，它们分别和引脚IR0-IR7相对应。接收来自某一引脚的中断请求后，IRR寄存器中的对应位置1，也就是对这一中断请求作了锁存。

    - 8259A有边沿触发和高电平触发两种触发方式。在边沿触发方式下，8259A将中断请求输入端出现的上升沿作为中断请求信号。中断请求输入端出现上升沿触发信号以后，可以一直保持高电平。在高电平触发方式下，8259A把中断请求输入端出现的高电平作为中断请求信号。在高电平触发方式下，当第一个中断响应信号变为有效之后，输入端必须及时撤除高电平，避免引起不应该有的第二次中断请求。

