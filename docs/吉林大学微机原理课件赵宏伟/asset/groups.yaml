    \ ; 调用BIOS\n\n### 例8.3.3 在显示页0置光标(2，15)，即第0页第15行第2列字符处\n\n- MOV AH, 2\n- MOV BH,\
    \ 0 ; 0页\n- MOV DL, 2 ; 列号\n- MOV DH, 15 ; 行号\n- INT 10H ; 调用BIOS\n\n### 例8.3.4\
    \ 用BIOS功能调用INT 10H\n\n例8.3.4 用BIOS功能调用INT 10H，AH=0H功能来设置屏幕为640×480彩色图形方式（显示方式AL=12H），并从屏幕第10行画1条有16种颜色像素点组成的线（用功能调用0CH）。程序结束时，显示器仍在12H下。\n\
    \n```\nDATA    SEGMENT\nYS      DB 16                ; 颜色初始值为 16\nDATA    ENDS\n\
    CODE    SEGMENT\n        ASSUME CS:CODE, DS:DATA\nMAIN    PROC\nSTART:  MOV AX,\
    \ DATA\n        MOV DS, AX\n        MOV AH, 0            ; 选择功能调用 0，设置显示方式\n \
    \       MOV AL, 12H          ; 设置显示方式 12H\n        INT 10H\n        MOV CX, 639\
    \          ; 共 640 列\n```\n\n```\nLP1: MOV AH, 0CH ; 写像素点功能调用\nDEC YS ; 颜色号减1\n\
    MOV AL, YS\nJNZ SKIP1 ; 颜色不为0 SKIP1\nMOV YS, 16 ; 恢复 YS 变量为 16\nSKIP1: MOV BH,\
    \ 0 ; 选择 0 页\nMOV DX, 10 ; 在第 10 行显示\nINT 10H\nLOOP LP1 ; 列减1，继续循环显示\nDEC YS ;\
    \ 颜色号减1\nMOV AL, YS\nINT 10H\nMOV AH, 4CH\nINT 21H\nMAIN ENDP\nCODE ENDS\nEND\
    \ START\n```\n\n### 例8.3.5 下列程序将屏幕的第10行复制到20行\n\n例8.3.5 下列程序将屏幕的第10行复制到20行，该程序应在显示器设置成高分辨率图形方式下运行。判断当前显示方式是否为高分辨率，如果不是，则转移到BAD_MODE，并显示“The\
    \ mode must be set high resolution”。\n\n```\nDATA    SEGMENT\nMSG     DB  'The\
    \ mode must be set high resolution'\nN       EQU     $-MSG        ; 显示字符个数\nDATA\
    \    ENDS\n```\n\n```\nCODE SEGMENT\nASSUME CS:CODE, DS:DATA, ES:DATA\nMAIN PROC\n\
    START: MOV AX, DATA\nMOV DS, AX\nMOV AH, 0 ; 选择功能调用 0，设置显示方式\nMOV AL, 10H ; 设置显示方式\
    \ 10H\nINT 10H\nMOV AH, 0FH ; 读显示方式\nINT 10H\nCMP AL, 0EH ; 若小于 0EH 显示方式则转\nJL\
    \ BAD_MODE\nCMP AL, 13H ; 若是 256 色的 13H 显示方式则转\nJZ BAD_MODE\nMOV CX, 639 ; 开始列号\n\
    ```\n\n```\nLP1:    MOV     AH, 0DH     ; 读像素点功能调用\n        MOV     BH, 0    \
    \   ; 0 页\n        MOV     DX, 10      ; 10 行\n        INT     10H\n        MOV\
    \     AH, 0CH     ; 写像素点功能调用\n        MOV     DX, 20      ; 20 行\n        INT\
    \     10H\n        DEC     CX\n        CMP     CX, 0FFFFH\n        JNZ     LP1\n\
    \        MOV     AH, 4CH\n        INT     21H\n```\n\n```\nBAD_MODE: MOV AX, DATA\n\
    MOV ES, AX\nMOV AH, 3 ; 读光标位置功能调用\nMOV BH, 0 ; 0 页\nINT 10H ; DX 中有光标位置\nMOV DL,\
    \ 0 ; 选 0 列\nMOV AX, 1300H ; 写字符串\nMOV BH, 0 ; 0 页\nMOV BL, 3 ; 颜色号为 3\nLEA BP,\
    \ MSG ; 字节的偏移地址\nMOV CX, N ; 字符串长度\nINT 10H\nMOV AH, 4CH\nINT 21H\nMAIN ENDP\n\
    CODE ENDS\nEND START\n```\n\n## 第8章 结 束\n"
