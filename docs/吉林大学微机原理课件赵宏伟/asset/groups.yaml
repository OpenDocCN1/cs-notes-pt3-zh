    +   1） 在异步接收方式，当“允许接收”和“准备好接收数据”有效时，接收缓冲器监视RXD线。在无字符传送时，RXD线上为高电平，当RXD线上出现低电平时，即认为它是起始位，就启动接收控制电路中的一个内部计数器，计数脉冲就是8251A的接收时钟脉冲RXC，当计数器计到一个数据位宽度的一半（若时钟脉冲频率为波特率的16倍，则计数到第8个脉冲）时，又重新采样RXD线，若其仍为低电平，则确认它为起始位，而不是噪声信号。


