  - '[PAGE 227]


    # 第4章 总线技术


    +   - 总线是一组信号线的集合，是一种在各模块间传递信息的公共通路。在微型计算机系统中，利用总线实现芯片内部、印刷电路板各部件之间、机箱内各插件板之间、主机与外部设备之间或系统与系统之间的连接与通信。总线是构成微型计算机应用系统的重要技术，总线设计好坏会直接影响整个微机系统的性能、可靠性、可扩展性和可升级性。由于总线在系统中的重要地位，微机系统的设计和开发人员，先后推出许多种总线标准。


    +   - 总线标准一般以两种方式推出：一种是某公司在开发自己的微机系统时所采用的一种总线，而其它兼容机厂商都按其公布的总线规范开发相配套的产品并进入市场。这种总线被国际工业界广泛支持，有的还被国际标准化组织加以承认并授予标准代号。另一种是由国际权威机构或多家大公司联合制订的总线标准。前一种先有产品后有标准。如IBM
    PC/AT机上使用的ISA总线。后者先有标准后有产品。随着微机系统的更新换代，有的总线仍在发展完善如STD SUB、MULTI BUS等。而有的就逐渐衰亡甚至被淘汰。本章将简要介绍几种流行的标准总线。'
  - '[PAGE 228]


    # 4.1 总线的基本概念


    +   - 4.1.1 总线分类

    +   - 总线按系统传输信息的不同可分为三类：数据总线、地址总线和控制总线。

    +   - 数据总线用来在各功能部件之间传输数据信息，它是双向的传输总线，其位数与机器字长、存储字长有关，一般为8位、16位、32位、64位。数据总线的条数称为数据总线的宽度。

    +   - 地址总线主要用来指出数据总线上源数据或目的数据在主存储单元或I/O端口的地址。地址总线为单向传输，其宽度一般为16位、20位、24位、32位、64位。

    +   - 控制总线是用来传输各种控制信号的传输线。通常一条控制信号线的信号传输是单方向的，当然也有双向的。控制总线还可以起到监视各部件状态的作用，例如查询某个设备是否处于“忙”或“闲”的状态。常见的控制信号有：时钟、复位、总线请求、总线允许、中断请求、中断确认、存储器写、存储器读、I/O写、I/O读、数据确认等。

    +   - 大多数微机采用了分层次的多总线结构。总线按在系统的不同层次位置上分类，可分为片内总线、微处理器总线、系统总线、外部总线4类。'
  - '[PAGE 229]


    # 1. 片内总线


    +   - 片内总线是指一些大规模集成电路内部的总线，是用来连结各功能部件的信息通路。例如CPU芯片中的内部总线，它是ALU寄存器和控制器之间的信息通路。片内总线根据其功能又被分为地址总线、数据总线和控制总线。这种总线是由微处理器芯片生产厂家设计的。对系统的设计者和用户来说关系不大。但是随着微电子学的发展，出现了ASIC（专用集成电路）技术，用户可以按自己的要求借助CAD技术，设计自己的专用芯片，在这种情况下，用户就必须掌握片内总线技术。

    +   - 由于片内总线所连接的部件都在1个硅片上，追求高速度是它的主要目标，所以器件级的总线都采用并行总线。同样为了提高速度，克服1组总线上同一时刻只能有2个部件通信所造成的限制，还采取了多总线的措施。使芯片中可以有1个以上的通信同时进行，实现片内几个部件并行工作，大大地提高了芯片的工作速率。比如，Pentium
    CPU内11个大部件就可以同时操作，使它对指令的处理速度得到极大的提高。'
  - '[PAGE 230]


    # 2. 微处理器总线


    +   - 微处理器总线或称处理器总线、主板局部总线、元件级总线，它是指在印刷电路板上连接各芯片的公共通路。它可能是一台单板计算机或是一块CPU主板上用于芯片一级的连接总线。它是微型机系统的重要总线。它一般是CPU芯片引脚的延伸，与CPU的关系密切。但当板内芯片较多时，往往需增加锁存、驱动等电路，以提高驱动能力。'
  - '[PAGE 231]


    # 3. 系统总线


    +   - 系统总线又称为内总线、板级总线，它用于微型机系统各插件板之间的连接，是微型机系统最重要的一种总线。

    +   - 一般谈到微型机总线，指的就是这一总线。有的系统总线是局部总线经过重新驱动和扩展而成，其性能与某种CPU有关。

    +   - 但有不少系统总线并不依赖于某种型号的CPU，可为多种型号CPU及其配套芯片所使用，在用各种插件板来组成或扩充微型机系统时，就要选用恰当的系统总线，并按总线的规定来制作这些插件板。

    +   - 系统总线一般都做成多个插槽的形式，各插槽相同的引脚都连到一起，总线就连到这些引脚上。'
  - '[PAGE 232]


    # 4. 外部总线


    +   - 外部总线又称为通信总线，它用于微机系统之间，微机系统与仪器或其他设备之间的通信通道。这种总线数据传输方式可以是并行（如打印机）或串行。数据传输速率比内总线低。不同的应用场合有不同的总线标准。

    +   - 例如，串行通信的RS-232-C总线，用于硬盘接口的IDE、SCSI，用于连接仪器仪表的IEEE-488等总线。这种总线并非微机专有，一般是利用工业领域已有的标准。'
  - '[PAGE 233]


    # 4.1.2 总线标准的基本内容


    +   - 1. 物理特性

    +   - 物理特性指的是总线物理连接的方式。包括总线的插头、插座的尺寸及形状，总线的根数和引脚是如何排列的等。

    +   - 2. 功能特性

    +   - 功能特性是确定引脚名称与功能，以及其相互作用的协议。从功能上看，总线分为：地址总线、数据总线、控制总线、备用线、电源和地线。

    +   - 地址总线的宽度指明了总线能够直接访问存储器或外部设备的地址范围。数据总线的宽度指明了访问一次存储器或外部设备最多能够交换数据的位数。控制总线一般包括CPU与外界联系的各种控制命令，如读/写控制逻辑线、时钟线和电源线等；中断机制；总线主控仲裁；应用逻辑，如握手联络线，复位、自启动、休眠维护等。

    +   - 3. 电气特性

    +   - 电气特性规定每一根线上信号的传输速率的设定、驱动能力的限制、信号电平的规定、时序的安排以及信息格式的约定等等。一般规定送入CPU的信号叫输入信号，从CPU送出的信号叫输出信号。'
  - '[PAGE 234]


    # 4.1.3 总线的操作过程


    +   - 为完成一次总线操作周期，一般要分成4个阶段。

    +   - 1. 申请阶段

    +   - 当系统总线上有多个主控模块时，由需要使用总线的主控模块向总线仲裁机构提出使用总线的申请。经总线仲裁机构判别确定，把下一个总线传输周期的总线控制权授予哪个申请者。

    +   - 2. 寻址阶段

    +   - 取得总线使用权的主控模块通过总线发出本次访问的从属模块的地址及有关命令，以启动参与本次操作的从属模块。

    +   - 3. 传数阶段

    +   - 主控模块和从属模块之间进行数据传输，数据由源模块发出经数据总线流入目的模块。在进行读操作时，源模块就是存储器或输入/输出接口，而目的模块则是总线主控模块。在进行写操作时，源模块就是总线主控模块，而目的模块则是存储器或输入/输出接口。

    +   - 4. 结束阶段

    +   - 主从模块的有关信息均从系统总线上撤除，让出总线，以便其它模块能继续使用。'
  - '[PAGE 235]


    # 4.1.4 总线的数据传输方式


    +   - 主控模块和从属模块之间的数据传输方式，可分为同步传送、异步传送、半同步传送三种，它们各有优缺点。'
  - '[PAGE 236]


    # 1. 同步传送


    +   - 同步传送时采用一个“系统时钟”作为各模块动作的基准时间。模块间通过总线进行一次传送所需的时间是固定的，其中每一步骤的起止时刻，也都有严格的规定，都以系统时钟来统一步伐。很多微机系统的基本传送方式都是同步式传送。

    +   - 同步传送的主要优点是简单，数据传送由单一信号控制。由于采用了公共时钟，每个功能模块什么时候发送或接收信息都由统一时钟规定，因此，同步传送具有较高的传输频率。同步传送适用于总线长度较短、各功能模块存取时间比较接近的情况。这是因为同步方式对任何两个功能模块的通信都给予同样的时间安排。由于同步总线必须按最慢的模块来设计公共时钟，当各功能模块存取时间相差很大时，会大大降低总线效率。'
  - '[PAGE 237]


    # 2. 异步传送


