    \  | 不用 |\n| 19~30 | GND |  | 对应1~12引脚的接地线 |\n| 31 | INIT̅ | 输入 | 初始化信号 |\n| 32\
    \ | ERROR̅ | 输出 | 出错信号 |\n| 33 | GND |  | 地 |\n| 34 | NC |  | 不用 |\n| 35 | +5\
    \ (V) |  | 电源 |\n| 36 | SLCTIN̅ | 输入 | 低电平时，打印机处于被选择状态 |\n\n**用Centronic总线接口连接打印机**\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_277_0.png)\n\n图 4.6.1 用 Centronic 总线接口连接打印机\n\
    \n## 第4章 结 束\n\n## 第5章 可编程接口芯片及其应用\n\n随着集成电路技术的发展，接口电路早已集成化，并出现了许多可编程接口芯片。为了具有通用性，这些芯片通常被设计成具有多项功能或多种工作方式，用户在使用时通过编程选择自己所需的功能或工作方式。\n\
    \n尽管早期的可编程接口芯片在现代微机中已不再独立出现，但本章在介绍时，还是以它们为讲解对象，因为这些是理解现代微机所用芯片的基础。此外，在单片机等微机应用系统或输入/输出设备中还常常用到它们。本章的主要内容是介绍可编程并行接口芯片8255A、可编程计数器/定时器8253。\n\
    \n### 5.1 可编程并行输入/输出接口芯片8255A\n\n- Intel 8255A是一种通用的可编程并行I/O接口芯片，是为Intel 8080/8085系列微处理器设计的，也可用于其他系列的微机系统。\n\
    \n#### 5.1.1 8255A的内部结构及引脚功能\n\n- 8255A为40引脚、双列直插封装，其引脚及内部结构如图5.1.1所示。由图可看出，8255A的内部结构由数据端口、组控制电路、数据总线缓冲器、读/写控制逻辑四部分组成。\n\
    - **1. 数据端口**\n  8255A有3个8位数据端口：端口A、端口B和端口C，分别简称为A口、B口和C口。\n- **2. 数据总线缓冲器**\n\
    \  数据总线缓冲器是一个三态8位双向缓冲器，D7-D0同系统数据总线相连。CPU通过执行输入输出指令来实现对缓冲器发送或接收数据。8255A的控制字和状态字也是通过该缓冲器传送的。\n\
    - **3. A组和B组的控制电路**\n  在8255A内部，3个端口分成两组来管理。A口及C口高4位为A组，B口及C口低4位为B组。两组分别设有控制电路，根据CPU发出的方式选择控制字来控制8255A的工作方式，每个控制组都接收来自读/写控制逻辑的“命令”，接收来自内部数据总线的“控制字”，并向与其相连的端口发出适当的控制信号。\n\
    - **4. 读/写控制逻辑**\n  读/写控制逻辑用来管理数据信息、控制字和状态字的传送，它接收来自CPU地址总线和控制总线的有关信号，向8255A的A、B两组控制部件发送命令。\n\
    \n**8255A的引脚及内部结构示意图**\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_282_0.png)\n\
    \n**8255A端口功能选择**\n\n| 操作类型 | CS | A1 | A0 | RD | WR | 功能 |\n|---|---|---|---|---|---|---|\n\
    | 读操作 | 0 | 0 | 0 | 0 | 1 | 数据总线 ← 端口 A |\n|  | 0 | 0 | 1 | 0 | 1 | 数据总线 ← 端口\
    \ B |\n|  | 0 | 1 | 0 | 0 | 1 | 数据总线 ← 端口 C |\n| 写操作 | 0 | 0 | 0 | 1 | 0 | 端口\
    \ A ← 数据总线 |\n|  | 0 | 0 | 1 | 1 | 0 | 端口 B ← 数据总线 |\n|  | 0 | 1 | 0 | 1 | 0 |\
    \ 端口 C ← 数据总线 |\n|  | 0 | 1 | 1 | 1 | 0 | 控制寄存器 ← 数据总线 |\n| 无操作 | 0 | 1 | 1 |\
    \ 0 | 1 | 无意义 |\n| 与总线“脱开” | 1 | × | × | × | × | 数据总线三态 |\n|  | 0 | × | × | 1\
    \ | 1 | 数据总线三态 |\n\n#### 5.1.2 8255A的控制字\n\n8255A有两种控制字。一个是方式选择控制字，另一个是对C口进行置位或复位的控制字。这两种控制字均为8位。\n\
    \n- **1. 方式选择控制字**\n  方式选择控制字用来设置工作方式，8255A有3种基本工作方式：方式0是基本的输入/输出方式，方式1是选通的输入/输出方式，方式2是双向传输方式。\n\
    - **2. 端口C的置位/复位控制字**\n  端口C的任一位可用这个控制字来置位或复位，而其他位保持不变。\n\n  该控制字用最高位D7=0作为该控制字的标志位。D6-D4不用，一般取0。D3-D1用来进行位选择，即指定对哪一位进行操作。D0用来表示是置位还是复位。该控制字为对C口的按位操作提供了方便。\n\
    \n**8255A的方式选择控制字**\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_285_0.png)\n\n\
    图 5.1.2 8255A 的方式选择控制字\n\n**8255A的对C口置位/复位控制字**\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_286_0.png)\n\
    \n图 5.1.3 8255A 的对 C 口置位/复位控制字\n\n#### 5.1.3 8255A的工作方式\n\n**1. 方式0**\n\n方式0为基本的输入/输出方式。在方式0下，C口的高4位和低4位以及A口、B口都可以独立地设置为基本的输入口或输出口。4个口的输入/输出可以有16种组合方式，且均可以由方式控制字确定。8255A在方式0工作时，CPU可以采用无条件输入/输出方式与8255A交换数据。如果把C口的两个部分用作控制和状态口，与外设的控制和状态端相连，CPU也可以通过对C口的读写，实现A口与B口的查询方式工作。\n\
    \nCPU执行一条输入指令，便可从8255A指定端口读入数据。在整个读出期间，地址信号保持有效，输入数据必须保持到读信号结束后才消失（在方式0时，输入数据不作锁存）。\n\
    \n**2. 方式1**\n\n方式1为选通的输入/输出方式（或称应答式输入/输出）。在方式1下将三个端口分成A、B两组，A、B两个口仍作为数据输入/输出口，而C口分成两部分，分别作为A口和B口的联络信号。在8255A中规定三位联络信号，两个数据口共用去C口的六位，剩下的两位可以用作数据传输，用方式控制字的D3位来设置它的输入/输出。在方式1下，输入/输出端口均有锁存功能。\n\
    \n**（1）方式1的输入**\n\n当8255A的A、B两个口均工作在方式1输入时，其逻辑功能结构如图5.1.4所示。由图可见A口用C口的PC3、PC4和PC5引脚作联络信号，而B口则用C口的PC0、PC1和PC2引脚作联络信号。C口剩下的PC6、PC7可以用作数据传输。\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_290_0.png)\n\n图 5.1.4 方式1输入的逻辑功能结构\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_291_0.png)\n\n图 5.1.5 方式1输入时序\n\n**（2）方式1的输出**\n\
    \n当8255A的A、B两个口均工作在方式1输出时，其逻辑功能结构如图5.1.6所示。由图可见A口用C口的PC3、PC6和PC7引脚作联络信号，而B口则用C口的PC0、PC1和PC2引脚作联络信号。C口剩下的PC4、PC5可以用作数据传输。\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_293_0.png)\n\n图 5.1.6 方式1输出的逻辑功能结构\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_294_0.png)\n\n图 5.1.7 方式1输出时序\n"
