    # 8.1.3 矩阵键盘


    +   - 为了减少键盘接口所占用I/O线的数目，在按键数较多时，通常都将按键排列成矩阵形式。矩阵式键盘又叫行列式键盘，用I/O口线组成行、列结构。按键设置在行列的交点上。例如2×2的行列结构可构成4个键的键盘，4×4的行列结构可构成16个键的键盘。利用这种矩阵结构只需N+M条I/O口线，即可连接N×M个按键。

    +   - 在这种矩阵键盘结构中，对按键的识别是对键盘扫描后，通过软件来完成的。键盘扫描方式一般有两种，一种是传统的行扫描法，另一种是速度较快的线反转法。'
