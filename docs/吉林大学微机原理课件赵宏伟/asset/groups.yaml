    # 计数初值的计算


    +   - 计数方式：计数値＝要求的计数次数

    +   - 定时方式：计数値＝定时时间÷时钟脉冲周期

    +   - 各计数器通道的输入脉冲和输出状态之间的关系与门控脉冲（GATE信号）的控制有关，而门控脉冲的作用又依赖于工作方式的选择。'
  - '[PAGE 319]


    # 5.2.3 8253的控制字


    +   - 8253只有一个控制字，主要功能是选择工作方式、读写格式和计数方式，其格式和含义如图5.2.2所示。D7、D6两位用来选择计数器，D5-D0对应每个计数器中的控制寄存器。

    +   - 值得注意的一点是，控制字的D7D6用于选择计数器，地址线的A1A0也用于选择计数器，它们的差别何在？事实上，A1A0=00、01、10选择的是计数器的数据端口，往这些端口中送入的是计数初值，从这些端口读出的是当前计数值。A1A0=11选择的是三个计数器共用的控制端口，往这个端口中送入的是控制字，这个端口禁止读出。而控制字中的D7D6是在送入控制端口的前提下，用于控制后面的D5-D0送给哪一个计数器进行工作环境设置。'
