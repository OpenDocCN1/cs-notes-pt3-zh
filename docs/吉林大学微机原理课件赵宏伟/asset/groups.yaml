    \n图 5.1.11 中断方式的双向并行通信接口电路框图\n\n## 8255A方式2时读出的C口的状态字\n\n| C口 | D7 | D6 | D5 |\
    \ D4 | D3 | D2 | D1 | D0 | B口方式 |\n| --- | --- | --- | --- | --- | --- | --- |\
    \ --- | --- | --- |\n|  | OBF̅ | INTE 出 | IBF | INTE 入 | INTRA | 0/1 | 0/1 | 0/1\
    \ | 0 |\n|  |  |  |  |  |  | INTEB | IBF | INTRB | 1（输入） |\n|  |  |  |  |  | \
    \ | INTEB | OBF̅ | INTRB | 1（输出） |\n\n图 5.1.12 8255A方式2时读出的C口的状态字\n"
