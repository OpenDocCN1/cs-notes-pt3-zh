    ## 6.3 可编程串行通信接口芯片8251A


    - 可编程串行通信接口芯片8251A是Intel公司研制的，通过编程既可实现同步，又可实现异步通信。它是一片使用单一+5V电源、单相时钟脉冲的28脚双列直插式大规模集成电路。

    - 8251A的基本性能如下：

    - （1）通过编程，可以工作在同步方式，也可以工作在异步方式；在同步方式下，波特率为0～64K波特，在异步方式下，波特率为0～19.2K波特。

    - （2）在同步方式时，可以用5、6、7或8位来代表字符，并且内部能自动检测同步字符，从而实现同步。此外，8251A还允许在同步方式下增加奇/偶校验位进行校验。

    - （3）在异步方式时，可以用5、6、7或8位来代表字符，用1位作奇偶校验。此外，能根据编程为每个字符设置1个、1.5个或2个停止位。

    - （4）所有的输入输出电路都与TTL电平兼容。

    - （5）全双工双缓冲的接收/发送器。


    ## 6.3.1 8251A内部逻辑与工作原理


    - 8251A的结构框图如图6.3.1所示，可分五个主要部分：数据总线缓冲器、接收缓冲器、发送缓冲器、读/写控制逻辑电路和调制解调控制电路。


    ## 8251A的结构框图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_379_0.png)


    图 6.3.1 8251A的结构框图


    ### （1）数据总线缓冲器


    - 数据总线缓冲器是三态双向8位缓冲器，它是8251A与微机系统数据总线的接口，数据、控制命令及状态信息均通过此缓冲器传送。它含有命令寄存器、状态寄存器、方式寄存器、两个同步字符寄存器、数据输入缓冲器和数据输出缓冲器。


    ### （2）发送缓冲器


    - 发送缓冲器的功能是接收CPU送来的并行数据，按照规定的数据格式变成串行数据流后，由TXD输出线送出。

    - 1）在异步发送方式时，发送器为每个字符加上一个起始位，并按照规定加上奇偶校验位以及1个、1.5个或者2个停止位。然后在发送时钟TXC的作用下，由TXD脚逐位地串行发送出去。

    - 2）在同步发送方式中，发送缓冲器在准备发送的数据前面先插入由初始化程序设定的一个或两个同步字符，在数据中插入奇偶校验位。然后在发送时钟TXC的作用下，将数据逐位地由TXD引脚发送出去。


    ### （3）接收缓冲器


    - 1） 在异步接收方式，当“允许接收”和“准备好接收数据”有效时，接收缓冲器监视RXD线。在无字符传送时，RXD线上为高电平，当RXD线上出现低电平时，即认为它是起始位，就启动接收控制电路中的一个内部计数器，计数脉冲就是8251A的接收时钟脉冲RXC，当计数器计到一个数据位宽度的一半（若时钟脉冲频率为波特率的16倍，则计数到第8个脉冲）时，又重新采样RXD线，若其仍为低电平，则确认它为起始位，而不是噪声信号。

    - 2） 在同步接收方式下，8251A首先搜索同步字符。具体地说，就是8251A监测RXD线，每当RXD线上出现一个数据位时，就把它接收并移入移位寄存器，然后把移位寄存器的内容与同步字符寄存器的内容进行比较，若两者不相等，则接收下一位数据，并重复上述比较过程。若两个寄存器的内容比较相等时，8251A的SYNDET引脚就变为高电平，表示同步字符已经找到，同步已实现。


    ### （4）读写控制逻辑电路


    - 读/写控制逻辑对CPU输出的控制信号进行译码以实现表6.3.1所示的读/写功能。


