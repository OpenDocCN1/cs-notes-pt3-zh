    # 7.5 功率开关器件及接口


    +   - 在微机测量及控制系统中，被测参数经采样、量化、处理之后，为了达到自动控制的目的，还需要输出控制信息。由于输出设备通常需大电压（或电流）来控制，而微机系统输出的开关量都是通过微机的I/O口输出的。这些I/O口的驱动能力有限。

    +   - 例如标准的TTL门电路在0电平时吸收电流的能力约为16mA，常常不足以驱动一些功率开关（如继电器、电磁开关等），因此，需要一些大功率开关接口电路。

    +   - 常用的功率开关接口器件有功率开关驱动电路及功率型光电耦合器、集成驱动芯片及固体继电器等。'
