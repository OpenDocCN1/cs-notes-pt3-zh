    ## 7.4.2 A/D转换原理


    - A/D转换技术比较多，但只有少数几种技术能以单片集成的形式来实现。本节首先介绍A/D转换的基本过程，然后介绍常用的3种A/D转换的方法：计数式、逐次逼近式和双积分式A/D转换原理。

    - 计数式最简单，但转换速度很低。逐次逼近式A/D转换器的速度较高，比较简单，而且价格适中，可以说，各种指标比较适中，因此是微型机应用系统中最常用的外围接口电路。双积分式A/D转换器精度高，抗干扰能力强，但速度低，一般应用在要求精度高而速度不高的场合，例如仪器仪表等。


    ## 1. A/D转换的基本过程


    - 模拟量是时间上和幅值上都连续的一种信号，模拟量经过采样后得到的信号是时间上离散，幅值上连续的信号，即离散信号，这一过程就是采样过程。

    - 计算机对这种离散信号还不能处理，计算机只能处理数字量，所以还必须把离散信号在幅值上也进一步离散化，这一过程就是量化过程。量化后的信号是时间上和幅值上都离散的数字量，可以直接送到计算机中进行处理。

    - 采样是将模拟量变换为离散量，一般包括采样与保持两个步骤，量化是将离散量变换成数字量，一般包括量化与编码两个步骤。采样与量化是A/D转换的基本过程。


    ### （1）采样


    - 为了把一个连续变化的模拟信号转变成为对应的数字信号，就必须首先把模拟信号在时间上离散化，也就是对模拟信号进行采样。采样的过程一般是：先使用一个采集电路，按等距离时间间隔，对模拟信号进行采集，然后用保持电路将采集来的信号电平保持一段时间，以便模数转换器正确地将其转换成对应的数字量。

    - 采样定理：对一个有限频谱(ω<+ωmax)的连续信号进行采样，当采样频率f≥2fmax时（fmax是输入模拟信号的最高频率），则采样输出信号能无失真地恢复到原来的连续信号。


    ## 信号的采样和量化


    f(t) 原始：模拟信号


    f(t) 采样：离散信号

    f(nT)


    量化：数字信号

    f(t)


    f(t)：模拟信号

    f(nT)：离散信号

    000～111：A/D 转换后的数字信号

    T：采样周期

    t：采样时间

    n：采样次数


    图 7.4.3 信号的采样和量化


    ### （2）量化


    - 模拟量输入信号被采样以后，得到的是时间上离散，幅值上连续的信号，即离散信号，但是要想用计算机处理，就必须把这种信号转换为时间上和幅值上都离散的信号，即数字信号。

    - 这种把离散信号转变为数字信号的过程，就是量化过程。

    - 量化就是把输入模拟信号f(t)的变化范围划分成若干层，每一层都由一个数字来代表，采样值落到哪一层，就由哪一层的数字来代表。

    - 这样，所有的采样值经过“量化”后，就化为了对应的数字量，成为了整数值。


    ## 2. 计数式A/D转换原理


    - 计数式A/D转换器的工作原理是：被测电压和一个均匀增长的斜坡电压不断地作比较，直到二者相等时，比较过程结束，并输出一个代表被测电压值的二进制数值。

    - 图7.4.4为8位计数式A/D转换原理图。给一个启动信号之后，计数器清0，产生的8位数字量经内部的D/A转换输出的模拟电压V0为0伏电压。然后，V0与模拟量输入电压Vi经比较器进行比较，当V0<Vi时，比较器输出端VC为1，使计数器在CLK信号控制下加1计数，使D/A转换后的电压不断上升。当D/A转换后的电压大于等于输入的模拟电压时，比较器输出端VC为0，使计数器停止计数，此时，数据线D7-D0上的数据就是模/数转换的结果。


    ## 8位计数式A/D转换原理图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_439_0.png)


    图 7.4.4 8位计数式A/D转换原理图


    ## 3. 逐次逼近式A/D转换


    - 逐次逼近式A/D转换器的工作原理也是将被测电压和由D/A转换生成的电压进行比较，但这里D/A转换生成的电压不是线性增长去接近被测电压，而是用对分搜索的方法来逐次逼近被测电压。

    - 图7.4.5为8位逐次逼近式A/D转换原理图，它的最大特点是用“逐次逼近寄存器”取代了计数式A/D转换中的“加1计数器”。

    - 当转换器收到启动信号之后，首先，逐次逼近寄存器清0，通过内部D/A转换器使输出电压V0为0，然后开始转换。


    ## 8位逐次逼近式A/D转换原理图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_441_0.png)


    图 7.4.5 8位逐次逼近式A/D转换原理图


    ## 4. 双积分式A/D转换


    - 双积分式A/D转换器的基本原理是，将一段时间内模拟电压通过两次积分，转换成与模拟电压成正比的时间间隔，然后利用时钟脉冲和计数器测出此段时间间隔，所得到的计数结果就是输入电压对应的数字值。

    - 双积分式A/D转换器的工作原理如图7.4.6所示，它是由积分器、过零比较器、计数器和控制电路组成的。

    - 双积分式A/D转换器与逐次逼近式相比，在得到同样精度的情况下，对所采用的元件的精度和质量的要求大为降低，只要求在T1和T2时间内有相对稳定性就行了。

    - 双积分式A/D转换器在工控环境中用于抑制信号中的50Hz工频干扰，一般转换周期在100μs-20ms之间。


    ## 双积分式A/D转换原理图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_443_0.png)


    图 7.4.6 双积分式 A/D 转换原理图


    ## 7.4.3 A/D转换器的主要技术指标


    - 1. 分辨率

    - A/D转换器的分辨率表明了能够分辨最小的量化信号的能力。它是输出数字量变化一个相邻数码所需输入模拟电压的变化量，即数字输出的最低有效位（LSB）所对应的模拟输入电平值。

    - 2. 精度

    - 精度是指A/D转换器的实际变换函数与理想变换函数的接近程度。精度又分为绝对精度和相对精度。

