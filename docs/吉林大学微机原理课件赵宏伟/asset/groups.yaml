    - 另一种适合多任务操作系统进入保护模式的方法是为装载所有的寄存器而建立任务切换。对于多任务操作系统利用任务切换来使Pentium进入到保护模式所需的步骤如下：

    - （1）初始化中断描述符表IDT，以便它用IDT中的至少32个描述符提供有效的中断描述符。

    - （2）初始化全局描述符表GDT，以便使其最少有两个任务状态段TSS描述符和初始化任务所需要的原始代码段及数据段描述符。

    - （3）初始化任务寄存器TR，使它指向一个TSS，当初始任务发生切换并访问新的TSS时，当前寄存器值将保存在这个原始的TSS中。

    - （4）进入保护模式后，执行一条段内近JMP指令清除内部指令队列，切换到保护模式下。将当前的TSS选择符装入到TR寄存器中。

