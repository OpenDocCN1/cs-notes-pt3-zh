    从DMA操作过程的角度，DMA控制器8237A的几种工作方式包括主从模态、传送方式、传送类型、优先级编码、自动初始化方式、存储器到存储器的传送等。


    ## 1. 主从模态


    DMA控制器既可以作为I/O端口接受CPU的读写操作，也可以代替CPU占有总线，控制外设与存储器之间传送数据，它充分体现了DMA控制器的两大特性，即总线的主控性和总线的从属性，按这两大特性，它也就有两种工作模态：主态方式和从态方式。


    ### （1）主态方式


    在主态方式时，DMA控制器是总线的控制者，此时，8237A是主模块，它如同CPU一样，掌握总线的控制权，可对涉及的外设端口或存储器单元进行读写操作。


    在DMA操作时，DMA控制器成为系统的控制核心，为完成DMA操作，它应提供存储器地址，指定外设，发出读写控制信号。由于只有一组地址总线，所以当DMA控制器提供了存储器地址后，就无法再提供外部设备的地址，因此DMA控制器在DMA传送时用DACK来选择外设，代替外设的地址选择逻辑，使申请DMA操作并被接受的外部设备在DMA操作中一直保持被选通状态，仅用或来控制数据的流向和启停。另外，DMA操作在外设和存储器之间建立了直接数据通道，数据传送时不需要经过DMA控制器，加快了数据传送速度，减少了中间环节，这也是DMA方式能高速传送的原因之一。


    ### （2）从态方式


    在从态方式时，CPU是总线的控制者，而DMA控制器不过是普通的一个外部设备，有若干个端口而已，它的地位同一般的I/O接口芯片是一样的，所以，此时8237A是从模块。


    DMA控制器在开始工作之前，要由CPU写入初始化控制字，建立DMA控制器工作的基本条件，如传送方式、传送类型、地址增加还是减少、是否设置自动初始化方式等，CPU还要写入一些数据，以确定DMA方式传送的具体内容，如存储区地址、传送字节数等，在这些操作中，DMA控制器以被规定的端口地址接收数据。另外，在DMA传送后，CPU也往往读取DMA控制器的状态。显然，在这两种情况下，DMA控制器是系统的从属设备。


    ## 2. 传送方式


    8237A通过编程，可选择4种传送方式，分别是单字节传送方式、数据块传送方式、请求传送方式和级联传送方式。


    ### （1）单字节传送方式


    单字节传送方式时，一次只传送一个字节，然后释放总线。若又有外设DMA请求，8237A再向CPU发下一次总线请求HRQ，获得总线控制权后，再传送下一个字节数据。


    在这种传送方式中应注意以下几方面：


    1）在DACK有效之前，DREQ应保持有效。


    2）即使DREQ在传送过程中一直保持有效，在总线响应后HRQ也将变成无效，并在传送一个字节后DMA控制器释放总线，但由于DREQ一直有效，HRQ很快再次变成有效，在芯片接受到新的HLDA后，下一个字节又开始传输。显然，在两次DMA传送之间至少执行一个完整的机器周期，在此期间，完全可能响应另一个高优先级的DMA请求。


    3）每次传送后，当前字节数计数器减1，当前地址寄存器减1或加1，当当前字节数计数器减1由0变成FFFFH时，发出有效信号（产生终止计数TC信号），如果通道编程设为自动初始化方式，则自动地重新装入计数值和地址寄存器。


    ### （2）数据块传送方式


    数据块传送方式时，响应一次DMA请求，将完成设定的字节数的全部传送。当字节数计数器减1由0变为FFFFH时，产生TC有效信号，使8237A将总线控制权交还给CPU从而结束DMA操作方式，外部有效的信号也可以终结DMA传送。


    在DACK变成有效之前，DREQ信号必须保持有效。一旦DACK有效，不管DREQ如何，8237A一直不放弃总线控制权。即便是在传送过程中，DREQ变为无效，8237A也不会释放总线，只是暂停数据的传送，等到通道请求信号再次有效后，8237A又继续进行数据传送，直到整块数据全部传完，才会退出DMA操作，将总线控制权交还CPU。


    PC机不能采用这种方式，否则会影响动态存储器刷新和磁盘驱动器的数据传送，它们都不允许另一个DMA传送长期占用总线。


    ### （3）请求传送方式


    请求传送方式又称查询方式，类似数据块传送，但每传送一个字节后，检测DREQ状态，若无效则停止，若有效则继续DMA传送。在下述情况之一发生时，将停止传送：


    1）DREQ变为无效。


    2）字节数计数器减1由0变为FFFFH，产生TC信号。


    3）外界输入有效信号。


    当DREQ无效时，8237A停止传送，内部的当前地址寄存器和当前字节数计数器还保留当时的数值，一旦外设准备好要传送的新数据，可以再次使DREQ变为有效，就可以使传送继续下去。当DREQ无效时，8237A停止传送，此时释放总线，当DREQ重新有效时，将重新开始一次DMA请求过程。


    ### （4）级连方式


    这种方式允许连接一个以上的芯片来扩展DMA通道的个数。其连接方法是将扩展的DMA芯片的HRQ和HLDA分别连到主片的某个通道的DREQ和DACK。当主片接到扩展芯片的DMA请求并响应后，它仅发出DACK应答，其它的地址信号与控制信号一律禁止，由扩展芯片控制DMA传送。这种情况下，主片的连接通道只起两个作用：一是优先级连接的作用，即将从片的4个DMA通道纳入到主片的优先级管理机制，二是向CPU输出HRQ和传递HLDA。


    ## 3. 传送类型


    DMA系统无论是工作在单片方式，还是多片级联，也不管采用单字节传送、数据块传送、请求传送中的哪种传送方式，都可以对每个通道的方式字寄存器进行设置，采用DMA读、DMA写、DMA校验等三种不同的传送类型。


    （1）DMA读

    8237A输出有效的和信号，把存储器的数据读到I/O设备。


    （2）DMA写

    8237A输出有效的和信号，把I/O设备的数据写到存储器。


    （3）DMA校验

    这是一种伪传输，实际上是校验8237A芯片内部的读写功能，也就是对读传输功能或写传输功能进行检验。在这种传送类型中，8237A芯片的操作如同DMA读和DMA写一样，产生地址信号以及对响应等，但对存储器和I/O设备的控制线（、、、）均处于无效状态，禁止实际传送。DMA校验传输功能是器件测试时才使用的，一般的使用者对这项功能并不感兴趣。


    ## 4. 优先级编码


    8237A芯片可设定为两种优先级编码：固定优先级和循环优先级，这两种优先级编码我们已作介绍。


    固定优先级中4个通道的优先级顺序是固定的，DREQ0最高，DREQ3最低。循环优先级中4个通道的优先级顺序是可变的，但其变化仍有一定的规律。当某一个通道申请DMA请求并被响应服务后，它就被指定为最低优先级，它的下一级就成为最高优先级。值得注意的一点是，无论在任何情况下，DMA请求禁止嵌套服务。当一个通道的DMA请求被响应并服务后，其它3个通道的DMA请求将都被禁止，无论它们的优先级是高还是低。优先权排队只在DMA响应之前有效，DMA响应之后则无效。


    ## 5. 自动初始化方式


    通过对方方式字寄存器的编程，可设置某个通道为自动初始化方式。


    自动初始化方式的功能是，当该通道完成一个数据传送并产生信号时（可能是由内部的TC产生，也可能是外部产生），用基地址寄存器和基字节数计数器的内容，使相应的当前地址寄存器和当前字节数计数器恢复初值。当前地址寄存器和当前字节数计数器的最初值，是由CPU在初始化编程时写入的（这个最初值同时也写入到基地址寄存器和基字节数计数器），但在DMA传送过程中，当前地址寄存器和当前字节数计数器的内容被不断修改，而基地址寄存器和基字节数计数器的内容维持不变（除非重新编程）。在自动初始化以后，通道就作好了进行另一次DMA传送的准备。


    ## 6. 存储器到存储器的传送


    利用这种方式，可以使数据块从一个存储空间传送到另一个存储空间，将程序的影响和传输时间减到最小。


    这种方式需要占用8237A的2个通道。由通道0的地址寄存器提供源地址，通道1的地址寄存器提供目的地址，通道1的字节数计数器编程为传送的字节数，传送由设置一个通道0的软件DREQ启动，8237A按正常方式向CPU发出HRQ，当CPU发出总线响应信号HLDA后，DMA传送即可开始。每次传送需要两个总线周期（8个时钟状态）：第一个总线周期（前4个时钟状态）先将源地址（由通道0指示，传送后地址寄存器做相应修改）的数据读入8237A的暂存器，在第二个总线周期（后4个时钟状态）再将暂存器的内容放到数据总线上，然后在写信号的控制下，将数据总线上的数据写入目的地址（由通道1指示，传送后地址寄存器做相应修改）的存储单元，然后通道1的当前字节数计数器减1。继续这种传送，直到通道1的字节数计数器的值减1由0变为FFFFH时，产生信号，从而终止DMA服务。

    '
