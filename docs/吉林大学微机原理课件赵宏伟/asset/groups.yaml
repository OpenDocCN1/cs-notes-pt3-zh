    # 3.2.2 可屏蔽中断INTR


    +   - 可屏蔽中断请求线INTR通常由Intel 8259A中断控制器驱动，该控制器可由软件命令来控制其工作方式。8259A的主要任务是：接收与其相连的外部设备的中断请求，确定优先级，向INTR引脚发中断请求，通过数据总线向CPU发中断类型码。

