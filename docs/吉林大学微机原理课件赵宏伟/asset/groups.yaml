    ### （3）具有中断屏蔽的接口电路


    - 软件查询确定优先级的优点是，各中断源的优先级灵活，但其缺点是在中断源较多的情况下，由询问到转至相应的中断服务程序的入口时间较长。硬件优先级排队电路确定优先级的优点是速度快，但其缺点是各个中断源的优先级固定不变。

    - 在实际系统中，往往有多个中断源。为了增加控制的灵活性，通常采用一种折衷方案，即在图3.1.3菊花链确定优先级的中断接口电路的基础上，在每一个外设的接口电路中增加一个中断屏蔽触发器。只有当此触发器为“1”时，外设的中断请求才能通过与门送出。把4个外设的中断屏蔽触发器组成一个端口（即中断屏蔽寄存器），用输出指令来控制它们的状态。


