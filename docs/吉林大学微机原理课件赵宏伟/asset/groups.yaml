    ## 方式1（可编程单稳方式）


    - （1）结果特点

    - 输出单拍负脉冲，脉冲宽度可编程设定。

    - （2）过程特点

    - 1）控制字写入： OUT=1。

    - 2）计数値写入： OUT=1（不变）。

    - 3）启动方式： GATE上跳沿。启动后的下一个CLK脉冲使OUT变低电平（OUT=0），即延迟一个时钟周期。

    - 4）计数期间： OUT为低电平（OUT=0）。

    - 5）计数为0时： OUT变为高电平（OUT=1）。

    - 6）计数期间写入新的计数值：不影响原计数，只有当下一个GATE上跳沿到来时，才使用新的计数值。


    - 7）GATE作用：GATE=0或GATE=1时，不影响计数，但若出现上跳沿则重新启动计数器，按最新计数初值开始计数。若在计数尚未结束时，就出现了上跳沿，则重新计数，因此，使输出负脉冲的宽度延长。这种方式常用于工业控制系统中的干扰自动复位电路。


    - 8）计数值有效期限：计数值多次有效。计数初值写入计数初值寄存器后，在没有新的计数值写入计数初值寄存器之前，原计数初值在计数初值寄存器中保持不变。


    ## 方式2（脉冲频率发生器方式）


    - （1）结果特点

    - 产生连续的负脉冲信号，负脉冲宽度等于一个时钟周期。脉冲周期可由软件设定，脉冲周期=计数値×时钟周期。

    - （2）过程特点

    - 1）控制字写入： OUT=1。

    - 2）计数値写入： OUT=1。

    - 3）启动方式：两种。一是硬件启动：GATE上跳沿启动；二是软件启动：写入计数値启动（此时GATE=1）。

    - 4）计数期间： OUT为高电平（OUT=1），但在减1计数器由1到0的计数中，OUT输出一个负脉冲，宽度为一个时钟周期。

    - 5) 计数为0时: OUT为高电平 (OUT=1), 开始下一个周期的计数。

    - 6) 计数期间写入新的计数值: 影响随后的脉冲周期。

    - 7) GATE作用: GATE=0时, OUT=1, 停止计数; GATE上跳沿, 启动计数器, 重新开始; GATE=1时, 不影响计数器工作。

    - 8) 计数值有效期限: 计数值重复有效。在这种方式下, 当计数器的值减到0时, 计数初值寄存器中的计数初值自动重新装入减1计数器, 实现循环计数。


