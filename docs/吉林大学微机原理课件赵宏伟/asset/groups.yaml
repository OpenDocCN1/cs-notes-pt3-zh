    # 第7章 模数转换及数模转换


    +   - 7.1 概述

    +   - 实时控制和测量系统中，被控制或被测量的对象，如温度、压力、时间、流量、速度、电压和电流等都是连续变化的物理量。所谓连续，包括两方面的含义：一方面从时间上来说，它是随时间连续变化的；另一方面从数值上来说，它数值也是连续变化的。这种连续变化的物理量就是模拟量。这种模拟量的数值和极性可以由传感器等进行测量，通常以模拟电压或电流的形式输出。

    +   - 当微型计算机参与控制时，微机要求的输入信号为数字量。这里，“数字”也包含着两方面的意义：一方面，从时间上来说，它是某一物理量在某一时刻的瞬时值；另一方面，从数值上来说，它的数值是按某一最小单位的倍数变化的。显然，不能把温度、压力、时间、电压等这样的模拟量直接送入微机进行运算处理，必须先把它们变换成数字量，才能被微机接受。'
