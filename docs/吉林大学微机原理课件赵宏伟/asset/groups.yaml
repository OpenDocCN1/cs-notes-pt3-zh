    \  - 4）计数期间：OUT输出高电平（OUT=1）。\n  - 5）计数为0：计数器减1到0时，OUT输出端输出一个CLK周期的负脉冲波，然后OUT恢复输出高电平。\n\
    \  - 6）计数期间写入新的计数值：不影响本次计数，但影响GATE上跳沿启动后的计数过程。一旦GATE重新启动，将按新的计数初值开始计数。\n  - 7）GATE作用：无论GATE=0还是GATE=1均不影响计数过程，而当GATE有上跳沿时将重新启动计数过程，按最新计数值开始计数。\n\
