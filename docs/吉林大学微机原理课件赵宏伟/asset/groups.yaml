    # 3. 气敏传感器


    +   - 半导体气敏传感器是利用半导体与某种气体接触时电阻及功率函数变化这一效应来检测气体的成分或浓度的传感器。

    +   - 它可用于家用液化气泄漏报警、城市煤气、煤气爆炸浓度以及CO中毒危险浓度报警等。有的敏感元件对酒精特别敏感，利用这种气敏元件可做酒后开车报警控制。'
  - '[PAGE 403]


    # 4. 压电式和压阻式传感器


    +   - 某些电解质（如石英晶体、压电陶瓷），在沿一定方向上受到外力的作用而变形时，内部会产生极化现象，同时在其表面上产生电荷。当外力去掉后，又重新回到不带电的状态。从而可以将机械能转变成电能，因此可以把压电式传感器看作是一个静电荷发生器，也就是一个电容。利用这些介质可做成压电式传感器。

    +   - 由于固体物理的发展，固体的各种效应已逐渐被人们所发现。固体受到作用力后，电阻率（或电阻）就要发生变化，这种效应称压阻式效应，利用它可做成压阻式传感器。利用压电式或压阻式传感器可测量压力、加速度、载荷等。前者可测量频率从几赫至几十千赫的动态压力，如内燃机气缸、油管、进排气管、枪炮的膛压、航空发动机燃烧室等的压力。'
  - '[PAGE 404]


    # 5. 光纤传感器


    +   - 光纤传感器是70年代迅速发展起来的一种新型传感器。它具有灵敏度高、电绝缘性能好、抗电磁干扰、耐腐蚀、耐高温、体积小、重量轻等优点，可广泛用于位移、速度、加速度、压力、温度、液位、流量、水声、电流、磁场、放射性射线等物理量的测量。

    +   - 功能型光纤传感器不仅起到传导光的作用，它还是敏感元件。它利用了光纤本身的一些特点，这些特点是光纤的传输特性受被测物理量作用会发生变化，从而使光纤中波导光的属性（光强、相位、偏振态、波长等）被调制。因此，这一类光纤传感器又分为光强调制型、相位调制型、偏振态调制型和波长调制型。'
  - "[PAGE 405]\n\n# 6. 位移-数字转换器\n\n+   • (1) 脉冲盘式角度-数字转换器\n+   \n+   脉冲盘式角度-数字转换器是在一个圆盘的边缘上开有相等角距的缝隙，在开缝圆盘两边分别安装光源和光敏元件。当圆盘随工作轴一起转动时，每转过一个缝隙就发生一次光线明暗变化，经过光敏元件，就产生一次电信号的变化。将这电信号整形放大，可得到一定幅度和功率的电脉冲输出信号，脉冲数就等于转过的缝隙数。上述脉冲信号可由计数器计数，计数值就能反映圆盘转过的角度。\n\
    \n+   • (2) 码盘式角度-数字转换器\n+   \n+   上述脉冲盘式输出的是与角度对应的脉冲个数，要经过计数器才能进行数值编码，码盘式则是按角度直接进行编码的转换器，通常把它安装在检测轴上。编码的方式有二进制制和格雷码制，按结构有接触式和光电式等。\n\
