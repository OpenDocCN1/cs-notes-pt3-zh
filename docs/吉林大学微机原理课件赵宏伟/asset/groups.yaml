    # 7.4.3 A/D转换器的主要技术指标


    +   - 1. 分辨率

    +   - A/D转换器的分辨率表明了能够分辨最小的量化信号的能力。它是输出数字量变化一个相邻数码所需输入模拟电压的变化量，即数字输出的最低有效位（LSB）所对应的模拟输入电平值。

    +   - 2. 精度

    +   - 精度是指A/D转换器的实际变换函数与理想变换函数的接近程度。精度又分为绝对精度和相对精度。

    +   - 3. 转换时间

    +   - 转换时间是指ADC完成一次转换所需的时间，即从启动信号开始到转换结束并得到稳定的数字输出量所需的时间。通常为微秒级。一般约定，转换时间大于1ms的为低速，1ms～1μs的为中速，小于1μs的为高速，小于1ns的为超高速。转换时间的倒数称为转换速率。例如ADC
    0809的转换时间为100μs，则转换速率为每秒1万次。

    +   - 4. 量程

    +   - 量程是指ADC所能转换的输入电压范围。'
