    # 5.1.3 8255A的工作方式


    +   1. 方式0


    方式0为基本的输入/输出方式。在方式0下，C口的高4位和低4位以及A口、B口都可以独立地设置为基本的输入口或输出口。4个口的输入/输出可以有16种组合方式，且均可以由方式控制字确定。8255A在方式0工作时，CPU可以采用无条件输入/输出方式与8255A交换数据。如果把C口的两个部分用作控制和状态口，与外设的控制和状态端相连，CPU也可以通过对C口的读写，实现A口与B口的查询方式工作。


    CPU执行一条输入指令，便可从8255A指定端口读入数据。在整个读出期间，地址信号保持有效，输入数据必须保持到读信号结束后才消失（在方式0时，输入数据不作锁存）。'
  - '[PAGE 288]


    # 2. 方式1


    +   - 方式1为选通的输入/输出方式（或称应答式输入/输出）。在方式1下将三个端口分成A、B两组，A、B两个口仍作为数据输入/输出口，而C口分成两部分，分别作为A口和B口的联络信号。在8255A中规定三位联络信号，两个数据口共用去C口的六位，剩下的两位可以用作数据传输，用方式控制字的D3位来设置它的输入/输出。在方式1下，输入/输出端口均有锁存功能。'
