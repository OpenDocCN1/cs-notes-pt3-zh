    ### 1. 程序段描述符


    - 程序段描述符的格式：

    - （1）基地址字段

    Pentium微处理器用这个字段来规定某一个段在4GB物理地址空间中的起始位置。段描述符的第2～4和第7字节组成了32位的基址字段，这个基址可以访问4G（2³²）字节的主存空间。

    - （2）段界限字段

    段描述符中的段界限字段是用来定义段的大小规模。段描述符的第0、1字节和第6字节的低4位是20位的段界限字段，该字段的值决定了段的长度，而该字段的值的单位由“G”位决定。“G”位称作粒度位，用来确定段界限所使用的长度单位。

    - （3）粒位G字段

    段描述符中的这个字段是用来确定段界限所使用的长度单位。段描述符的第6字节的D7位是粒度位G字段。G=0时，段的长度以一个字节为单位。G=1时，段的长度以4K（2¹²）字节为单位。当G=0时，段界限字段值的范围可从1B到1MB（因为段界限为20位）范围。在这种情况下，段界限字段的值可在1B的基础上，每次增值1B。当G=1时，段界限字段值的范围可从4KB到4GB范围。在这种情况下，段界限字段的值可在4KB的基础上，每次增值4KB。

    - （4）分类S字段

    段描述符中的第5字节的D4位“S”字段是用来区分是系统段描述符还是非系统段描述符。当S=0时，是系统段描述符。当S=1时，是非系统段描述符。

    - （5）段存在位P字段

    P字段表示该段是否在内存中。段描述符的第5字节的D7位是P字段。当P=1时，表示该段在内存中。当P=0时，表示该段不在内存中。

    - （6）系统可用位AVL字段

    表示系统软件是否可用本段。段描述符的第6字节的D4位是AVL字段。当AVL=1时，表示系统软件可用本段。当AVL=0时，表示系统软件不能用本段。

    - （7）特权级DPL字段

    这个字段用来定义段的特权级。段描述符的第5字节的D6、D5位是DPL字段。DPL字段占有2位，故有4个特权级：00、01、10、11，称作0级、1级、2级、3级。0级的特权最高，1级次之，3级的特权最低。借助于保护机构，用这个字段定义的特权级去控制对这个段的访问。其访问原则是高特权级的程序段可以访问低特权级程序的数据段，反之则不行。

