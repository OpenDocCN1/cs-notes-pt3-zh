    \        ; 不是单键 K1 按下，转\nMOV    AH, 1\nJMP    XEND\n\nX3:   CMP    AL, 00001011B\n\
    JNZ    X4          ; 不是单键 K2 按下，转\nMOV    AH, 2\nJMP    XEND\n\nX4:   CMP    AL,\
    \ 00000111B\nJNZ    X5          ; 不是单键 K3 按下，转\nMOV    AH, 3\nJMP    XEND\n```\n\
    \n```\nX5:    MOV   AH, 0FFH   ; 此时说明有多个按键同时按下,\n                      ; 用 0FFH\
    \ 表示这种状态\nXEND:  NOP             ; 在此处可加入其他需要处理的程序\n       RET\nKEY    ENDP\n\
    CODE   ENDS\nEND    START\n```\n\n## 8.1.3 矩阵键盘\n\n- 为了减少键盘接口所占用I/O线的数目，在按键数较多时，通常都将按键排列成矩阵形式。矩阵式键盘又叫行列式键盘，用I/O口线组成行、列结构。按键设置在行列的交点上。例如2×2的行列结构可构成4个键的键盘，4×4的行列结构可构成16个键的键盘。利用这种矩阵结构只需N+M条I/O口线，即可连接N×M个按键。\n\
    - 在这种矩阵键盘结构中，对按键的识别是对键盘扫描后，通过软件来完成的。键盘扫描方式一般有两种，一种是传统的行扫描法，另一种是速度较快的线反转法。\n\n\
    ### 1. 行扫描法\n\n- 行扫描法是步进扫描方式，每次向键盘的某一行发出扫描信号，同时通过检查列线的输出来确定闭合键的位置。\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_495_0.png)\n\
    \n- 以图8.1.3的电路连接为例，假设行输出端口1的地址为200H，列输入端口2的地址为201H，采用软件消抖技术（只考虑前沿消抖），编程实现对0键～F键的识别，识别按键后，将按键的键号（即0～F）存到AH寄存器中，若为重键，则将0FFH存到AH寄存器中。有D20ms延时子程序可以调用。\n\
    - 本例中，键的位置码是由行号和列号组合而成的一个字节数据，4位行号占据键位置码的高4位，4位列号占据键位置码的低4位，比如，B键的行号为1011，列号为0111，则B键的位置码为10110111。\n\
    \n### 程序设计\n\n```\nCODE SEGMENT\nASSUME CS:CODE, DS:DATA\n\nKEY PROC FAR\nSTART:\
    \ PUSH DS\nMOV AX, 0\nPUSH AX\nMOV AX, DATA\nMOV DS, AX\n\nX1: MOV DX, 200H  \
