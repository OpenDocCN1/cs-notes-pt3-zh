    \n## 8259A的ICW4格式（A0=1）\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_215_0.png)\n\
    \n图 3.3.8 8259A 的 ICW4 格式（A0=1）\n\n## 2. 操作命令字\n\n- 在初始化命令字写入8259A之后，8259A就准备接收中断请求输入信号了。在8259A工作期间，CPU可以随时通过操作命令字使8259A完成各种不同的工作方式。8259A有三种操作命令字：OCW1、OCW2和OCW3，在写入时，它们与初始化命令字不同，它们不是按一定的顺序写入，而是按设计者的要求写入。\n\
    \n## （1）OCW1\n\n- OCW1的主要功能是：保存中断屏蔽字。\n- 操作命令字OCW1对8259A内的中断屏蔽寄存器IMR中的各位进行动态地设置屏蔽字，其格式及各位的具体定义如图3.3.9所示，图中M0-M7分别与8259A的IR0-IR7相对应。\n\
