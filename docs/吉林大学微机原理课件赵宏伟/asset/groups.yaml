    ```

    LP1: MOV AH, 0CH ; 写像素点功能调用

    DEC YS ; 颜色号减1

    MOV AL, YS

    JNZ SKIP1 ; 颜色不为0 SKIP1

    MOV YS, 16 ; 恢复 YS 变量为 16

    SKIP1: MOV BH, 0 ; 选择 0 页

    MOV DX, 10 ; 在第 10 行显示

    INT 10H

    LOOP LP1 ; 列减1，继续循环显示

    DEC YS ; 颜色号减1

    MOV AL, YS

