    代码段描述符中的类型 TYPE 字段的格式如表1.2.3所示。


    ① E可执行位。当E=1时，是代码段。


    ② C一致性位。所谓一致性检查，就是采用特权级进行控制。当C=0时，表示非一致性代码段，此时忽视段描述符的特权值。当C=1时，表示一致性代码段，需要进行特权级检查。


    ③ R可读位。当R=0时，不允许读。当R=1时，允许读。当然，对程序段来说，通常都是“可执行的”。R位取0可防止用户程序对存储器里的“目标程序代码”做手脚。R位为0的描述符只能加载到CS的描述符寄存器，而R位为1的描述符可加载到CS、DS、ES、FS及GS的描述符寄存器，此时，可以读取段内的数据（程序代码）。


    ④ A访问位。当A=0时，该段尚未被访问；当A=1时，该段已被访问。


    （9）D位/B位字段


    段描述符的第6字节的D6位是D位/B位字段。这个字段在代码段描述符中叫做D位字段，而在数据段和堆栈段描述符中叫做B位字段。该字段可分为下述三种情况。


    1）在代码段描述符中，用来指示代码段中缺省的操作数的长度和有效地址长度。当D=1时，说明采用的是32位操作数和32位有效地址的寻址方式。D=0时，则说明采用的是16位操作数和16位有效地址的寻址方式。


    2）在堆栈段描述符中，用来指示堆栈指针寄存器的大小。当B=1时，使用的是32位的堆栈指针寄存器ESP。当B=0时，使用的是16位的堆栈指针寄存器SP。堆栈段的上界是一个各位均为1的地址。当B=1时，上界地址值为0FFFFFFFH。当B=0时，上界地址值为0FFFFH。


    3）在数据段描述符中，用来指示数据段中操作数的长度。当B=1时，使用的是32位的操作数。当B=0时，使用的是16位的操作数。


    （10）兼容位字段


    段描述符的第6字节的D5位必须是0，以便与将来的处理器兼容。


