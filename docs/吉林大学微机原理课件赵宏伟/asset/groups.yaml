    # 1. 温度传感器


    +   - 热电偶是一种大量使用的温度传感器，它是利用热电势效应应来工作的，室温下的典型输出电压为毫伏数数量级。温度测量范围与热电偶的材料有关，常用的有镍铝-镍硅热电偶和铂铑-铂热电偶。热电偶的热电势-温度曲线一般是非线性的，需要采取措施进行非线性校正。


    +   - 另一种温度传感器为热敏电阻，它是一种半导体新型感温元件，具有负的电阻温度系数，当温度升高时，其电阻值减小，在使用热敏电阻作为温度传感器时，将温度的变化反映在电阻值的变化中，从而改变电压或电流值。'
