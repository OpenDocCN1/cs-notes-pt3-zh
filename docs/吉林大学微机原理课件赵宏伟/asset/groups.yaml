    # 第8章 人机交互接口


    +   • 人机交互接口就是用户与计算机进行交流的接口，即用户如何将信息输入计算机，计算机如何将处理后的信息告诉用户。使用人机交互接口的设备主要有：键盘、鼠标器、扫描仪等常见的输入设备，CRT显示器、液晶显示器、LED七段显示器、打印机、绘图机等常见的输出设备。'
  - '[PAGE 485]


    # 8.1 键盘接口


    +   - 键盘是微机系统上最基本的标准输入设备。用户通过键盘向计算机输入操作命令、程序或数据。尽管目前已有语音输入、手写板输入、图象扫描识别等多媒体输入方式，然而键盘的重要地位还不会被其他输入方式所取代。

    +   - 编码键盘能够由硬件逻辑自动提供与被按键对应的ASCII码或其它编码。编码键盘中的某一键按下后，能够提供与该键相对应的编码信息。如果是ASCII码键盘，就能提供与该键相对应的ASCII码。编码键盘的缺点是硬件设备随着键数的增加而增加。

    +   - 非编码键盘仅仅简单地提供被按键行和列的矩阵，其它工作都靠程序实现，这样，非编码键盘就为系统软件在定义键盘的某些操作上提供了更大的灵活性。目前已有一些专用芯片可以完成其中的一些工作。非编码键盘具有价格便宜、配置灵活的特点。'
  - '[PAGE 486]


    # 8.1.1 消除抖动及重键处理


    +   - 键盘的按键有机械式、电容式、薄膜式等多种，但就它们的作用而言，都是一个使电路“通”或“断”的开关。在对机械式按键进行键盘输入时，一般存在两个问题，即触点弹跳与同时按下一个以上键的问题，也就是所谓的抖动与重键的问题。'
  - '[PAGE 487]


    # 1. 抖动


    +   - 抖动是开关本身的一个最普遍的问题，它的产生是当机械开关的触点闭合时，在达到稳定之前需要短暂抖动或弹跳几下，即反复闭合、断开几次之后，才能达到可靠地闭合在一起。抖动也存在于开关断开时，其情形与开关闭合时相同。抖动产生的尖脉冲情况如图8.1.1所示。

    +   - 根据所用键的不同质量，键的抖动时间可为10～20ms。键的抖动会引起一次按键被读入多次。解决键的抖动可以使用硬件滤波方法或软件延迟方法。硬件滤波是对每一个键加上R-C滤波电路，或加上RS去抖电路。这种方法通常在键数少的情况下使用。而键数较多时，则经常采用软件去抖动技术，这种方法的实质就是采用一个产生20ms左右延迟的子程序，以等待键的输出达到完全稳定后才去读取代码。'
