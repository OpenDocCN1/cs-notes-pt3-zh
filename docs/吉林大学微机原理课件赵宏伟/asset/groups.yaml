    # 7.2 传感器


    +   - A/D转换器是将模拟的电信号转换成数字信号。所以将物理量转换成数字量之前，必须先将物理量转换成电模拟量。传感器是把非电量的模拟量（如温度、压力、流量等）转换成电压或电流信号。


    +   - 因此，传感器一般是指能够进行非电量和电量之间转换的敏感元件。传感器的精度直接影响整个系统的精度，如果传感器误差较大，则测量电路、放大电路以及A/D转换电路和微机的处理都会受到影响。


    +   - 物理量的多样性使得传感器的种类繁多，下面对几种常用的传感器作以简单的介绍。'
  md: "\n### （5）调制解调控制电路\n\n调制解调控制电路用来简化8251A和调制解调器的连接。在进行远程通信时，要用调制器将串行接口送出的数字信号变为模拟信号，再发送出去；接收端则要用解调器将模拟信号变为数字信号。在全双工通信情况下，每个收发端都要连接调制解调器。有了调制解调控制电路，就提供了一组通用的控制信号，使得8251A可以直接和调制解调器连接。\n\
    \n### 6.3.3 8251A的控制字\n\n8251A是可编程的通用同步/异步接收/发送器，在使用前，必须由CPU写入一组控制字来设置它的工作方式、字符的格式和传送的速率等。\n\
    \n8251A有两个控制字，一个是方式选择控制字，一个是操作命令控制字。方式选择控制字在8251A复位之后送入，操作命令控制字在方式选择控制字之后的任何时间均可送入。\n\
    \n8251A方式选择控制字格式\n\n图 6.3.2 8251A 方式选择控制字格式\n\n8251A命令控制字格式\n\n| D7 | D6 | D5\
    \ | D4 | D3 | D2 | D1 | D0 |\n| --- | --- | --- | --- | --- | --- | --- | ---\
    \ |\n| EH<br>1=搜索同步字符 | IR<br>1=内部复位 | RTS<br>1=发送请求有效 | ER<br>1=错误标志复位 | SBRK<br>1=发送中止字符\
    \ | RXE<br>1=接收允许 | DTR<br>1=数据终端准备好 | TXEN<br>1=发送允许 |\n\n图 6.3.3 8251A 命令控制字格式\n\
    \n8251A状态字格式\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n| --- | --- | --- |\
    \ --- | --- | --- | --- | --- |\n| DSR<br>1=数据装置就绪 | SYNDET/BD<br>1=同步检出 | FE<br>1=格式错\
    \ | OE<br>1=溢出错误 | PE<br>1=奇偶错 | TXEMPTY<br>1=发送移位器空 | RXRDY<br>1=接收准备好(输入缓冲器满,读复位)\
    \ | TXRDY<br>1=发送准备好(输出缓冲器空,写复位) |\n\n图 6.3.4 8251A 状态字格式\n\n8251A初始化流程图\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_389_0.png)\n\
    \n图 6.3.5 8251A 初始化流程图\n\n### 例6.3.1 8251A异步方式初始化\n\n设8251A工作在异步方式，波特率因子为16，每个字符7个数据位，采用偶校验，2个停止位，允许发送和接收，设8251A数据端口地址为200H，8251A控制端口地址为201H。试编写8251A的初始化程序。\n\
    \n- 1. 方式选择控制字：根据题意，方式选择控制字为 11111010B（即FAH），写入控制端口，端口地址为201H。\n- 2. 命令控制字：设置为00110111B（即37H），允许发送和接收，写入控制端口，端口地址为201H。\n\
    - 3. 初始化程序：\n\n```\nMOV AL, 0FAH   ; 方式选择控制字，异步方式，7位/字符，\n                ; 偶校验，2个停止位\n\
    MOV DX, 201H   ; 控制端口地址\nOUT DX, AL     ; 传送\nMOV AL, 37H    ; 命令控制字，发送和接收允许，清出错标志\n\
    OUT DX, AL     ; 传送\n```\n\n### 例6.3.2 8251A同步方式初始化\n\n设8251A工作在内同步方式，2个同步字符（设同步字符为3AH），每个字符7个数据位，采用偶校验，允许发送和接收，设8251A数据端口地址为90H，8251A控制端口地址为91H。试编写8251A的初始化程序。\n\
    \n- 1. 方式选择控制字：根据题意，方式选择控制字为 00111000B（即38H），写入控制端口，端口地址为91H。\n- 2. 命令控制字：设置为10010111B（即97H），使8251A进入同步字符检测，出错标志复位，允许发送和接收，置DTR有效，写入控制端口，端口地址为91H。\n\
    - 3. 同步字符：2个同步字符，均为3AH。\n- 4. 初始化程序：\n\n```\nMOV   AL, 38H   ; 方式选择控制字，内同步方式，\n\
    \                  ; 2个同步字符，7位数据，偶校验\nOUT   91H, AL\nMOV   AL, 3AH\nOUT   91H,\
    \ AL   ; 送第一个同步字符 3AH\nOUT   91H, AL   ; 送第二个同步字符 3AH\nMOV   AL, 97H   ; 命令控制字，启动发送器和接收器，\n\
    \                  ; 清出错标志， DTR 有效\nOUT   91H, AL\n```\n\n### 例6.3.3 8251A状态字的使用\n\
    \n设8251A工作在异步方式，波特率因子为16，每个字符7个数据位，采用偶校验，2个停止位，允许接收，设8251A数据端口地址为70H，8251A控制端口地址为71H。试编写8251A输入100个字符的程序段，字符存入DATA开始的存储区。\n\
    \n- 1. 方式选择控制字：根据题意，方式选择控制字为11111010（即FAH），写入控制端口，端口地址为71H。\n- 2. 命令控制字：设置为00110111B（即37H），置RTS、DTR有效，出错标志复位，允许发送和接收（虽然本例只是接收，但8251A作为串行通信接口，通常同时具有发送和接收功能，只是本例仅编写输入部分程序而已），写入控制端口，端口地址为71H。\n\
    - 3. 状态字：检测状态字D1位的RXRDY，若RXRDY=1，说明已接收一个完整字符，可以读取。读取一个字符后，还要确定接收的字符是否正确，方法是检测状态字的D5D4D3位（帧错、溢出错、奇偶错），相应位为1表明出现对应的错误，需要进行错误处理。\n\
    - 4. 初始化程序：\n\n```\nMOV AL, 0FAH   ; 方式选择控制字，异步方式，7位/字符，\n                ; 偶校验，2个停止位\n\
    OUT 71H, AL     ; 送控制口\nMOV AL, 37H     ; 命令控制字，RTS、DTR 有效，\n                ;\
    \ 发送和接收允许，清出错标志\nOUT 71H, AL     ; 送控制口\nMOV DI, OFFSET DATA ; 设置输入字符存储偏移地址\n\
    MOV CX, 100     ; 计数器初值，输入 100 个字符\nX1: IN  AL, 71H   ; 读状态字\nTEST AL, 02H   \
    \ ; RXRDY=1？是，接收字符就绪，准备读取并存储\nJZ   X1         ; RXRDY 不为 1，输入字符未就绪，循环等待\nIN  \
    \ AL, 70H    ; 读取字符\nMOV  [DI], AL   ; 存储\nINC  DI         ; 修改存储指针\nIN   AL,\
    \ 71H    ; 读状态字\nTEST AL, 38H    ; 测试有无帧错、溢出错、奇偶错\n                ; （状态字相应位为\
    \ 1 表明出错）\nJNZ  X2         ; 出错，转错误处理程序\nLOOP X1         ; 正确，接收下一个字符\nJMP  X3\
    \         ; 全部接收完成，转结束\nX2: ......      ; 错误处理程序\nX3: ......      ; 结束处理\n```\n\
    \n## 第6章 结束\n\n## 第7章 模数转换及数模转换\n\n### 7.1 概述\n\n实时控制和测量系统中，被控制或被测量的对象，如温度、压力、时间、流量、速度、电压和电流等都是连续变化的物理量。所谓连续，包括两方面的含义：一方面从时间上来说，它是随时间连续变化的；另一方面从数值上来说，它数值也是连续变化的。这种连续变化的物理量就是模拟量。这种模拟量的数值和极性可以由传感器等进行测量，通常以模拟电压或电流的形式输出。\n\
    \n当微型计算机参与控制时，微机要求的输入信号为数字量。这里，“数字”也包含着两方面的意义：一方面，从时间上来说，它是某一物理量在某一时刻的瞬时值；另一方面，从数值上来说，它的数值是按某一最小单位的倍数变化的。显然，不能把温度、压力、时间、电压等这样的模拟量直接送入微机进行运算处理，必须先把它们变换成数字量，才能被微机接受。\n\
    \n一个完整的微机闭环实时控制系统示意图\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_398_0.png)\n\n\
    图 7.1.1 一个完整的微机闭环实时控制系统示意图\n\n### 7.2 传感器\n\nA/D转换器是将模拟的电信号转换成数字信号。所以将物理量转换成数字量之前，必须先将物理量转换成电模拟量。传感器是把非电量的模拟量（如温度、压力、流量等）转换成电压或电流信号。\n\
    \n因此，传感器一般是指能够进行非电量和电量之间转换的敏感元件。传感器的精度直接影响整个系统的精度，如果传感器误差较大，则测量电路、放大电路以及A/D转换电路和微机的处理都会受到影响。\n\
    \n物理量的多样性使得传感器的种类繁多，下面对几种常用的传感器作以简单的介绍。\n"
