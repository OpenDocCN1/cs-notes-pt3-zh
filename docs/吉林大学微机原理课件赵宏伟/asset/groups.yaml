    ## 第1章 Pentium保护模式存储管理


    ### 1.1 虚拟存储器及其工作原理


    - 虚拟存储器又称为虚拟存储系统。虚拟存储器是为满足用户对存储空间不断扩大的要求而提出的，随着用户程序复杂性的增加，占用存储空间越来越大。其解决办法是，可扩大主存，但是造价高，空间利用率很低，并不是好的途径。采用虚拟存储器，可较好地解决这个问题。

    - 虚拟存储器这个概念是1961年由英国曼彻斯特大学的Kilburn等人提出的，并于20世纪70年代广泛应用于大中型计算机之中，现在的微型计算机也都采用了这种技术。

    - 虚拟存储器是由主存储器、辅助存储器、辅助硬件和操作系统管理软件组成的一种存储体系。它把辅助存储器作为主存储器的扩充，对应用程序员来说，好像计算机系统有一个容量很大的主存。虚拟存储系统的目标是为了增加存储器的存储容量，它的速度接近于主存，单位造价接近于辅存，因此性能价格比很高。


    ### 表1.1.1 虚拟存储器和Cache存储器的比较


    | 存储体系 | 虚拟存储器 | Cache 存储器 |

    |---|---|---|

    | 存储层次 | 主存-辅存 | Cache-主存 |

    | 主要功能 | 主存速度，辅存容量 | CPU 速度，主存容量 |

    | 信息传送单位 | 信息块（比如段、页），有多种划分，长度较大。 | 信息块（比如块、行），长度较小，并且固定。 |

    | 结构差别 | CPU → 主存 → 辅存<br>主存不命中，进行辅存调度，而 CPU 程序换道。 | CPU → Cache → 主存<br>在 CPU
    与主存之间具有直接访问通路。 |

    | 操作过程 | 由部分硬件和操作系统存储管理软件实现，对应用程序员透明，对存储管理软件程序员不透明。 | 全部用硬件实现，对各类程序员透明。 |


    ### 1.1.1 地址空间及地址


    - 在虚拟存储器中有3种地址空间及对应的3种地址。

    - 3种地址空间分别是虚拟地址空间、主存地址空间、辅存地址空间。

    - 虚拟地址空间：又称为虚存地址空间，是应用程序员用来编写程序的地址空间，与此相对应的地址称为虚地址或逻辑地址。

    - 主存地址空间：又称为实存地址空间，是存储、运行程序的空间，其相应的地址称为主存物理地址或实地址。

    - 辅存地址空间：也就是磁盘存储器的地址空间，是用来存放程序的空间，相应的地址称为辅存地址或磁盘地址。


    ### 1.1.2 虚拟存储器工作原理


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_4_0.png)


    图 1.1.1 虚拟存储器工作过程示意图


    ### 存贮管理方式


    - 由于采用的存贮映射算法不同，就形成了不同的存贮管理方式，其中主要有段式、页式和段页式3种。

    - Pentium支持分段存储管理、分页存储管理和段页式存储管理。Pentium微处理器片内存储管理部件负责对物理存储器实施安全可靠且行之有效的存储管理操作。当存储管理部件正常运转时，程序是不能直接对物理存储器进行寻址操作的，只能对一个被称之为虚拟存储器的存储器模型进行寻址操作。

    - Pentium微处理机的存储管理部件由分段部件和分页部件组成。分段部件可以提供多个各自独立的地址空间，而分页部件可以使用少量的随机存储器（RAM）和磁盘存储器去支持一个很大的地址空间模型。由程序提供的地址叫做逻辑地址。分段部件的功能之一就是将逻辑地址转换成一个连续的不分段的地址空间，这个地址空间的地址叫做线性地址。而分页部件的主要功能就是将线性地址转换成物理地址。


    ### 1.2 分段存储管理


    #### 1.2.1 分段存储管理的基本思想


    - 通常，一个程序由多个模块组成，特别是在结构化程序设计思想提出之后，程序的模块性就更强了。一个复杂的大程序总可以分解成多个在逻辑上相对独立的模块，模块间的界面和调用关系是可以清楚定义的。这些模块可以是主程序、各种能赋于名称的子程序或过程，也可以是表格、数组、树、向量等某类数据元素的集合。模块的大小可以各不相同，有的甚至事先无法确定。但每一个模块都是一个特定功能的独立的程序段，都是以该段的起点为0相对编址。

    - 把主存按段分配的存储管理方式就称为段式管理。程序进入内存时，各程序段要求占据相对独立的内存区间。因此，现代微机系统把物理空间分成相对独立的许多内存段，每个内存段放置一个程序段，至此内存段与程序段统一，统称为段。一个程序拥有多个段、不同程序占据不完全相同的几个段。而且管理系统所需要的信息放置在属于系统所有的段中。


    ### 1. 分段存储管理工作过程


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_7_0.png)


    图 1.2.1 分段存储管理的示意图


    ### 2. 虚拟地址和虚拟地址空间


    - Pentium微处理器在保护模式下的存储器管理单元使用48位的存储器指针。

    - 它分为段选择符（或简称为选择符）和偏移量两部分。该48位存储器指针称为虚拟地址，它在程序中用以规定指令或数据的存储器位置。段选择符16位，偏移量32位。

    - 段选择符可放在Pentium微处理器段寄存器中。若要访问存储器中的代码，则段选择符应放在CS中。若要访问存储器中的数据，则段选择符应放在DS、ES、FS、GS、SS中的任意一个。

    - 偏移量放在Pentium微处理器的用户可访问的寄存器中。若要访问存储器中的代码，则偏移量放在EIP寄存器中。若要访问存储器中的数据，则偏移量放在EAX、EBX、ECX、EDX、ESI、EDI等寄存器中。由于偏移量是32位长，所以段大小可达4G字节。我们说段大小可达4G字节是因为段大小实际上可变的，它可从1个字节到4G字节。


    ### 保护模式下的存储器指针及段选择符格式


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_9_0.png)


    图 1.2.2 保护模式下的存储器指针及段选择符格式


    ### 3. 虚实地址转换


    - Pentium微处理机的分段存储管理机制允许将46位虚拟地址映射到硬件所需的32位物理地址。

    - 首先由虚拟地址（也称逻辑地址）段选择符部分的13位索引字段确定段描述符在段表（也称段描述符表）的位置。

    - 然后取出段描述符中的32位基地址并与偏移量相加，得到32位的线性地址。如果不启用分页功能，则线性地址就直接作为物理地址。


    ### 虚实地址转换示意图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_11_0.png)


    段描述符表


    图1.2.3 虚实地址转换示意图


    ### 1.2.2 段描述符


    - 段描述符是Pentium微处理器存储管理部件用以管理64T字节虚拟存储地址空间分段的基本元素。一个段描述符对应于虚拟地址空间中的一个存储器段。

    - 段描述符是位于主存中的一种数据结构，由系统程序创建，它为处理器提供段的基本信息。所有段描述符均由8个字节组成。段描述符内存保存着供处理器使用的有关段的属性、段的大小、段在存储器中的位置以及控制和状态信息。一般来说，各段描述符都是由各种编译程序、各种连接程序、各种装入程序或者是操作系统产生的，而不是由各种应用程序生成的。

    - 段描述符按段的性质可分为程序段描述符、系统段描述符和门描述符，如图1.2.4所示。对于不同的描述符，其格式存在差异。


