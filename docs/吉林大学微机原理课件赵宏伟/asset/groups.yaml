    ## 4.6.5 AGP总线


    - AGP（Accelerated Graphics Port）是加速图形端口，是英特尔开发的局部图形总线技术。

    - 早期的显示接口卡通过ISA总线或者PCI总线与主板连接，但是ISA、PCI显卡均不能满足3D图形/视频技术的发展要求。PCI显卡处理3D图形有两个主要缺点，一是PCI总线最高数据传输速度仅为133MB/s，不能满足处理3D图形对数据传输率的要求。二是需要足够多的显存来进行图像运算，这将导致显示卡的成本很高。

    - AGP接口把显示部分从PCI总线上拿掉，使其它设备可以得到更多的带宽，并为显示卡提供高达1066MB/s（AGP 4X）的数据传输速率。AGP以系统内存为帧缓冲，可将纹理数据存储在其中，从而减少了显存的消耗，实现了高速存取，有效地解决了3D图形处理的瓶颈问题。


    ### 1. AGP的主要特点


    - （1）AGP是一种局部图形总线。AGP把显示芯片直接同芯片组的内存控制器电路相连，实现一种“点对点”的连接，一个系统只能有一个AGP，所以，AGP不会取代PCI总线。

    - （2）可直接对系统主内存中的图像数据进行操作。AGP技术有两个核心内容，一是使用PC的主内存作为显存的扩展延伸，增加了显存的潜在容量。二是使用更高的总线频率，比如66MHz、133MHz等，极大地提高了数据传输率。

    - （3）采用双泵技术。AGP利用时钟信号的两个边沿（即上升沿和下降沿）作数据传输，相当于使工作频率提高了两倍。

    - （4）两种工作方式：DMA和DIME。DMA方式不使用PC机的主内存作为显存的扩展，只是利用AGP总线的高速传输特性进行数据传递。DIME（Direct
    memory execute）方式将主内存的空闲部分映射为显存的扩展（但是，并不能取代显卡的显存，而只是显卡的显存的一种扩展和补充），使之与显卡的显存在操作上成为一体。DIME是AGP的核心技术。

    - （5）AGP标准分为AGP1.0（AGP 1X和AGP 2X）、AGP2.0（AGP 4X）、AGP3.0（AGP 8X）。


    ### 2. AGP与PCI的比较


    - AGP实质上是PCI技术标准的扩充。这也是出于简化开发设计的考虑，使其类似于PCI总线。AGP与PCI总线不同，其地址线和数据线分离（PCI是49根信号，而AGP是65根信号）。地址线和数据线分离，可实现“流水线”处理，提高实际数据传输速率，同时，由于没有切换的“开销”，也提高了随机访问主存时的性能。

    - PCI总线数据宽度一般为32位，以33MHz的速度运行，这样，它能提供的最大带宽就是33MHz×32位÷8=133MB/s。尽管PCI 64/66规范提供了64位的数据宽度和66MHz的工作频率，带宽相应达到了533MB/s，但它面向的是需要极高数据带宽的I/O控制器，比如IEEE
    1394或者千兆位的网卡。AGP同样是32位的数据宽度，但它的工作频率从66MHz开始，AGP 1X规范利用每个时钟周期的下降沿传输数据，能提供266MB/s的带宽，而AGP
    2X同时利用时钟周期的上升沿和下降沿传输数据，可以达到533MB/s的带宽，AGP 8X更是利用单边4次触发技术把带宽提高到了2133MB/s。


    ## 4.6.6 IEEE 488总线


    - 在工业生产、科学研究和实验测量中，往往需要同时使用各种各样的仪器进行测量并需要对其测量结果按照公式进行计算和处理。因此，就需要把许多仪器结合在一起形成一个自动化测量计算系统。但各种仪器仪表的不能兼容性给组成系统造成了困难。IEEE
    488总线就是为了把原来互不兼容的设备连成测量计算系统的一种接口和总线标准。

    - IEEE 488总线是美国HP公司最先提出，到1975年形成标准。又称HP HB，还称GP-IB或IEC-IB。它们是国际标准的通用接口总线。它是一种异步双向总线。专门用于连接系统而不是连接部件或模块的。例如计算机与电压表、信号发生器、程控电源等测量仪器以及各种仪表间的信息通讯。


    ### 1. IEEE 488的主要特点


    - （1）8位数据宽度。

    - （2）采用位并行、字节串行、三线异步传送技术，允许不同速度的装置工作在同一系统内。

    - （3）连接的设备最多不超过15个，电缆最长不超过20米，若超过时，需附加硬件或调制解调装置。

    - （4）信号最大传送速度为1MB/s。

    - （5）有16条信号线，采用负逻辑的TTL电平，低电平+0.8V为“1”，高电平≥+2.0V为“0”。

    - （6）地址容量为听地址31个，讲地址31个，地址可扩展到961个。


    ### 2. IEEE 488总线结构


    从组成部件的功能角度，IEEE 488总线结构包括控制器、接收器、发送器。被连接的设备可以是发送器，可以是接收器，还可以既是发送器又是接收器，但总线中必须有一个设备同时是控制器、发送器和接收器（通常是指计算机）。在IEEE
    488总线系统工作时，任一时刻只能一个发送器工作，但接收器可以是一个也可以是多个，至于哪个设备做发送器，哪个设备做接收器，由控制器根据工作需要确定。因此，连在系统中的设备可以完成如下的一种或多种功能：


    - （1）控制器。可向IEEE 488总线发出控制命令来管理整个系统的通信。例如启动某设备进入受控状态；指定某发送器和某接收器之间进行通信；处理某设备的服务请求等等。一般要求一个系统中不能有两个以上的控制器。

    - （2）接收器。可从控制器获得信息和接收来自其它设备的数据。总线上允许有多个接收器同时工作。

    - （3）发送器。作为信息源，可通过总线发送信息或向其它设备发送数据。总线上不允许有两个发送器同时工作。


    ## 4.6.7 CAN总线


    - CAN总线就是一种现场总线。

    - CAN（Controller Area Network）通常可译为“控制器局域网络”，是BOSCH公司开发的，以多主方式工作，网络上任意一个节点均可以在任意时刻主动地向网络上的其它节点发送信息，当多个节点同时向网上传输信息时只有具有最高优先权的节点可不受影响地继续传输数据。

    - 通过CAN总线，传感器、控制器和执行器由串行数据线连接起来。

    - 它不仅仅是将电缆按树形结构连接起来，其通信协议相当于ISO/OSI参考模型中的数据链路层，网络可根据协议探测和纠正数据传输过程中因电磁干扰而产生的数据错误。


    ### 1. CAN的主要特点


    - （1）低成本。

    - （2）总线利用率高。

    - （3）数据传输距离远（长达1km）。

    - （4）数据传输速率高（高达1Mb/s）。

    - （5）可根据报文的ID决定接收或屏蔽该报文。

    - （6）可靠的错误处理和检错机制。

    - （7）报文不包含源地址或目标地址，仅用标志符来指示功能信息优先级。


    ### 2. CAN的电气特性


    - CAN能够使用多种物理介质进行传输，例如双绞线、光纤等，最常用的就是双绞线。

    - CAN只有两条信号线，称为CAN_H和CAN_L，信号使用差分电压传送，静态时均为2.5V左右，此时的状态表示为逻辑1，也可以叫做“隐性”。

    - 用CAN_H比CAN_L高表示逻辑0，称为“显性”，此时，电压值通常为CAN_H=3.5V，CAN_L=1.5V。

    - 当“显性”位和“隐性”位同时发送的时候，最后总线数值将为“显性”，这种特性，为CAN总线的仲裁奠定了基础。


    ### 3. CAN的工作原理


    - 当CAN总线上的一个节点（站）发送数据时，它以报文形式广播给网络中所有节点。对每个节点来说，无论数据是否发给自己的，都对其进行接收。每组报文开头的11位字符为标识符，定义了报文的优先级，这种报文格式称为面向内容的编址方案。在同一系统中标识符是唯一的，不可能有两个站发送具有相同标识符的报文。当几个站同时竞争总线读取时，这种配置十分重要。

    - 当一个站要向其它站发送数据时，该站的CPU将要发送的数据和自己的标识符传送给本站的CAN芯片，并处于准备状态。当它收到总线分配时，转为发送报文状态。CAN芯片将数据根据协议组织成一定的报文格式发出，这时网上的其它站处于接收状态。每个处于接收状态的站对接收到的报文进行检测，判断这些报文是否是发给自己的，以确定是否接收它。

    '
