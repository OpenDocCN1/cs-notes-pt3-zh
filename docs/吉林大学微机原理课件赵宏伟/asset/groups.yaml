    ## 2. 中断优先级


    - 在实际系统中，常常遇到多个中断源同时请求中断的情况，这时CPU必须确定首先为哪一个中断源服务，以及服务的次序。通常采用中断优先排队的处理方法解决这一问题。这就是根据中断源要求的轻重缓急，排好中断处理的优先次序，即优先级（又称优先权）。先响应优先级最高的中断请求。

    - 有的微处理器有两条或更多的中断请求线，而且CPU已经安排好中断的优先级，如图3.1.1中的INTR0为最高优先级、INTR1为次高优先级、INTR2为最低优先级。但有的微处理器只有一条中断请求线。凡是遇到中断源的数目多于CPU的中断请求线的情况时，就需要采取适当的方法来解决中断优先级的问题。另外，当CPU正在处理中断时，也要能响应优先级更高的中断请求，而屏蔽掉同级或较低级的中断请求，即所谓多重中断的问题。


