    ## 2. USB和IEEE 1394的比较


    - USB和IEEE 1394有许多相似之处，也有一些不同。

    - 在计算机领域，IEEE 1394与USB并列，作为计算机的总线和接口占有重要的地位。USB主要设计用于PC，面向低速PC外设，IEEE 1394则不仅用于计算机，还广泛应用于家电产品，尤其是面向中高端的数码应用。IEEE
    1394有比USB更高的速度，在除键盘和鼠标外的各种连接中都有可能使用。

    - IEEE 1394支持对等传送方式，这点与USB总线不同。在对等总线中，任何一个总线上的设备都可以主动地发出请求。而USB总线上的设备，则都是等待主机发送请求，然后做相应的动作。因而IEEE
    1394设备更加智能化一些，当然也变得复杂一些，成本高一些。这个特性决定了IEEE 1394可以脱离桌面主机，对数字化家电而言尤为重要。

    - IEEE 1394总线的拓朴结构与USB一样，采用树形结构。树形结构就是所有连接在一起的设备不能形成一个环，否则就可能不能正常工作。不过IEEE 1394b提出了一个避免环状结构的方法，在设备连接形成一个圆圈时，也能保证正常工作。


    ## 4.6.5 AGP总线


    - AGP（Accelerated Graphics Port）是加速图形端口，是英特尔开发的局部图形总线技术。

    - 早期的显示接口卡通过ISA总线或者PCI总线与主板连接，但是ISA、PCI显卡均不能满足3D图形/视频技术的发展要求。PCI显卡处理3D图形有两个主要缺点，一是PCI总线最高数据传输速度仅为133MB/s，不能满足处理3D图形对数据传输率的要求。二是需要足够多的显存来进行图像运算，这将导致显示卡的成本很高。

    - AGP接口把显示部分从PCI总线上拿掉，使其它设备可以得到更多的带宽，并为显示卡提供高达1066MB/s（AGP 4X）的数据传输速率。AGP以系统内存为帧缓冲，可将纹理数据存储在其中，从而减少了显存的消耗，实现了高速存取，有效地解决了3D图形处理的瓶颈问题。


    ### 1. AGP的主要特点


    - （1）AGP是一种局部图形总线。AGP把显示芯片直接同芯片组的内存控制器电路相连，实现一种“点对点”的连接，一个系统只能有一个AGP，所以，AGP不会取代PCI总线。

    - （2）可直接对系统主内存中的图像数据进行操作。AGP技术有两个核心内容，一是使用PC的主内存作为显存的扩展延伸，增加了显存的潜在容量。二是使用更高的总线频率，比如66MHz、133MHz等，极大地提高了数据传输率。

    - （3）采用双泵技术。AGP利用时钟信号的两个边沿（即上升沿和下降沿）作数据传输，相当于使工作频率提高了两倍。

    - （4）两种工作方式：DMA和DIME。DMA方式不使用PC机的主内存作为显存的扩展，只是利用AGP总线的高速传输特性进行数据传递。DIME（Direct
    memory execute）方式将主内存的空闲部分映射为显存的扩展（但是，并不能取代显卡的显存，而只是显卡的显存的一种扩展和补充），使之与显卡的显存在操作上成为一体。DIME是AGP的核心技术。

    - （5）AGP标准分为AGP1.0（AGP 1X和AGP 2X）、AGP2.0（AGP 4X）、AGP3.0（AGP 8X）。


    ### 2. AGP与PCI的比较


    - AGP实质上是PCI技术标准的扩充。这也是出于简化开发设计的考虑，使其类似于PCI总线。AGP与PCI总线不同，其地址线和数据线分离（PCI是49根信号，而AGP是65根信号）。地址线和数据线分离，可实现“流水线”处理，提高实际数据传输速率，同时，由于没有切换的“开销”，也提高了随机访问主存时的性能。

    - PCI总线数据宽度一般为32位，以33MHz的速度运行，这样，它能提供的最大带宽就是33MHz×32位÷8=133MB/s。尽管PCI 64/66规范提供了64位的数据宽度和66MHz的工作频率，带宽相应达到了533MB/s，但它面向的是需要极高数据带宽的I/O控制器，比如IEEE
    1394或者千兆位的网卡。AGP同样是32位的数据宽度，但它的工作频率从66MHz开始，AGP 1X规范利用每个时钟周期的下降沿传输数据，能提供266MB/s的带宽，而AGP
    2X同时利用时钟周期的上升沿和下降沿传输数据，可以达到533MB/s的带宽，AGP 8X更是利用单边4次触发技术把带宽提高到了2133MB/s。


    ## 4.6.6 IEEE 488总线


    - 在工业生产、科学研究和实验测量中，往往需要同时使用各种各样的仪器进行测量并需要对其测量结果按照公式进行计算和处理。因此，就需要把许多仪器结合在一起形成一个自动化测量计算系统。但各种仪器仪表的不能兼容性给组成系统造成了困难。IEEE
