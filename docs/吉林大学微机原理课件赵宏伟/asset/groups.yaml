  - '[PAGE 96]


    # 2.4.2 8237A的工作方式


    +   - 从DMA操作过程的角度，DMA控制器8237A的几种工作方式包括主从模态、传送方式、传送类型、优先级编码、自动初始化方式、存储器到存储器的传送等。'
  - '[PAGE 97]


    # 1. 主从模态


    +   - DMA控制器既可以作为I/O端口接受CPU的读写操作，也可以代替CPU占有总线，控制外设与存储器之间传送数据，它充分体现了DMA控制器的两大特性，即总线的主控性和总线的从属性，按这两大特性，它也就有两种工作模态：主态方式和从态方式。'
  - '[PAGE 98]


    # （1）主态方式


    +   - 在主态方式时，DMA控制器是总线的控制者，此时，8237A是主模块，它如同CPU一样，掌握总线的控制权，可对涉及的外设端口或存储器单元进行读写操作。

    +   - 在DMA操作时，DMA控制器成为系统的控制核心，为完成DMA操作，它应提供存储器地址，指定外设，发出读写控制信号。由于只有一组地址总线，所以当DMA控制器提供了存储器地址后，就无法再提供外部设备的地址，因此DMA控制器在DMA传送时用DACK来选择外设，代替外设的地址选择逻辑，使申请DMA操作并被接受的外部设备在DMA操作中一直保持被选通状态，仅用或来控制数据的流向和启停。另外，DMA操作在外设和存储器之间建立了直接数据通道，数据传送时不需要经过DMA控制器，加快了数据传送速度，减少了中间环节，这也是DMA方式能高速传送的原因之一。'
  - '[PAGE 99]


    # （2）从态方式


    +   - 在从态方式时，CPU是总线的控制者，而DMA控制器不过是普通的一个外部设备，有若干个端口而已，它的地位同一般的I/O接口芯片是一样的，所以，此时8237A是从模块。


    +   - DMA控制器在开始工作之前，要由CPU写入初始化控制字，建立DMA控制器工作的基本条件，如传送方式、传送类型、地址增加还是减少、是否设置自动初始化方式等，CPU还要写入一些数据，以确定DMA方式传送的具体内容，如存储区地址、传送字节数等，在这些操作中，DMA控制器以被规定的端口地址接收数据。另外，在DMA传送后，CPU也往往读取DMA控制器的状态。显然，在这两种情况下，DMA控制器是系统的从属设备。'
  - '[PAGE 100]


    # 2. 传送方式


    +   - 8237A通过编程，可选择4种传送方式，分别是单字节传送方式、数据块传送方式、请求传送方式和级联传送方式。'
