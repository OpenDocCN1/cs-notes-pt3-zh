    一条指令执行结束后，CPU检测中断请求输入端INTR是否有中断请求信号，若无中断请求信号，则转取下一条指令，若有中断请求信号，则检测中断允许触发器的状态，若为关中断，则转取下一条指令，若为开中断，则进行中断处理。


    - （2）中断处理

    - 1）关中断。CPU在响应中断后，发出中断响应信号，同时内部自动地关中断，以禁止接受其他的中断请求。

    - 2）保护现场。为了使中断处理程序不影响主程序的运行，故要把断点处的有关各个状态寄存器的内容和标志位的状态，推入堆栈保护起来。

    - 3）保护断点。把断点处的程序计数器PC的内容压入堆栈，以备中断处理完后能正确地返回主程序断点。

    - 4）形成中断服务程序入口地址。CPU要对中断请求进行处理，必须要找到相应的中断服务程序的入口地址。不同类型的微机的中断处理过程基本相似，但主要在形成中断服务程序入口地址方式上有所区别。

    - 5）转入中断服务程序。将中断服务程序入口地址送入程序计数器PC。

    - 需要说明的是，上述过程是微机硬件自动完成的。


    - （3）中断服务程序

    - 1）保护现场。中断服务程序像子程序一样，在执行过程中，要使用CPU中的寄存器。所以，就应该将中断服务程序中要使用的各个寄存器的内容保护起来，即保护现场。

    - 2）中断处理。这是中断服务程序的核心部分，为中断源完成特定的功能。

    - 3）恢复现场。在中断服务程序结束之前，应恢复现场，即把保护现场时所保存的各个寄存器的内容从堆栈弹出，送回原各个寄存器中。

    - 4）开中断。通过指令开中断，在中断服务程序结束时，要开中断，以便CPU能响应新的中断请求。

    - 5）返回断点。在中断服务程序结束的最后要安排一条中断返回指令，将在中断处理中压入堆栈内的保护现场和保护断点的内容弹出，即返回断点执行主程序并能继续准备响应新的中断请求


