    # 2.3.2 程序中断方式


    +   - 无条件传送方式和查询传送方式的缺点是CPU和外设只能串行工作，各外设之间也只能串行工作。为了使CPU和外设以及外设和外设之间能并行工作，提高系统的工作效率，充分发挥CPU高速运算的能力，在微机系统中引入了中断技术，利用中断来实现CPU与外设之间的数据传送，这就是程序中断传送方式。

    +   - 在程序中断传送方式中，通常是在主程序中某一时刻安排启动某一台外设的指令，然后CPU继续执行其主程序，当外设完成数据传送的准备后，向CPU发出“中断请求”信号，在CPU可以响应中断的条件下，中断（即暂停）现行主程序的执行，而转去执行“中断服务程序”，在“中断服务程序”中完成一次CPU与外设之间的数据传送，传送完成后再返回被中断的断点处继续执行主程序。'
  - '[PAGE 87]


    # 2.3.3 DMA方式


    +   - 1. DMA传送方式的提出

    +   - 与程序查询方式相比，利用中断方式进行数据传送可以大大提高CPU的工作效率。但在中断方式中，仍然是通过CPU执行程序来实现数据传送的，每传送一个字节（或一个字）CPU都必须把主程序停下来，转去执行中断服务程序。而每进入一次中断服务程序，CPU都要保护断点和转入中断服务程序，上述几方面的因素造成中断方式下的传输效率仍然不是很高。

    +   - 如果I/O设备的数据传输率较高，那么CPU和这样的外部设备进行数据传输时，即使尽量压缩程序查询方式和中断方式中的非数据传输时间，也仍然不能满足要求。这是因为在这两种方式下，还存在另外一个影响传输速度的原因，即它们都是按字节或字来进行传输的。为了解决这个问题，实现按数据块传输，就需要改变传输方式，为此，提出了在外设和内存之间直接传送数据的方式，这就是直接存储器传输方式，即DMA方式。'
  - '[PAGE 88]


    # 2. DMA操作的基本方法


    +   - （1）CPU停机方式

    +   - 在这种方式下，当要进行DMA传送时，DMA控制器向CPU发出总线请求信号，迫使CPU在现行的总线周期结束后，使其地址总线、数据总线和部分控制总线处于高阻状态，从而让出对总线的控制权，并给出DMA响应信号。DMA控制器接到该响应信号后，就可以对总线进行数据传送的控制工作，直到DMA操作完成，CPU再恢复对总线的控制权，继续执行被中断的程序。

    +   - （2）周期扩展

    +   - 在这种方式下，当需要进行DMA操作时，由DMA控制器发出请求信号给时钟电路，时钟电路把供给CPU的时钟周期加宽，而提供给存储器和DMA控制器的时钟周期不变。用这种方法进行DMA操作，一次只能传送一个字节。

    +   - （3）周期挪用

    +   - 在这种方式下，利用CPU不访问内存的那些周期来实现DMA操作，此时DMA操作使用总线不用通知CPU也不会妨碍CPU的工作。'
  - '[PAGE 89]


    # 3. DMA控制器的功能


    +   - （1）当外设准备就绪，希望进行DMA操作时，会向DMA控制器发出DMA请求信号，DMA控制器接到此信号后，应能向CPU发总线请求信号。

    +   - （2）CPU接到总线请求信号后，如果允许，则会发出DMA响应信号，从而CPU放弃对总线的控制，这时DMA控制器应能实行对总线的控制。

    +   - （3）DMA控制器得到总线控制权以后，要往地址总线发送地址信号，修改所用的存储器的地址指针。

    +   - （4）在DMA传送期间，DMA控制器应能发存储器或接口的读/写控制信号。

    +   - （5）能统计传送的字节数，并且判断DMA传送是否结束。

    +   - （6）能向CPU发出DMA结束信号，将总线控制权交还给CPU。'
