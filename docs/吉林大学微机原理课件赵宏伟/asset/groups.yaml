    ## 1.5.2 分页转换机制


    - 1. 分页转换的工作过程

    - 在分页转换机制中，当要访问一个操作单元时，32位线性地址转换为32位物理地址是通过两级查表来实现的。图1.5.3展示了Pentium微处理器的分页机制。这里，程序中产生的线性地址00C02098H经过分页机构被转换成物理地址00160098H。

    - 分页机制的工作过程如下：

    - （1）4KB长的页目录存储在由CR3寄存器所指定的物理地址。此地址常称为根地址。假设要寻址单元的线性地址为：0000000011 000000010 000010011000B

    - （2）用线性地址中的最高10位（A31-A22）页目录索引，即0000000011B（3号页目录项），乘以4（每个页目录项占4个字节）得到页目录中页目录项的偏移量00CH，从1024个页目录项中确定所访问的页目录项3。图中此页目录项包含着所指向的页表3的起始地址01010000H。

    - （3）用线性地址中的A21-A12这10位页表索引，即0000000010B（2号页表项），乘以4（每个页表项占4个字节）得到页表3中页表项的偏移量008H，从1024个页表项中确定所访问的页表项2，图中此页表项包含了所要访问的物理页的起始地址00160000H。

    - （4）以物理页的起始地址00160000H为基址，再加上线性地址的最低12位（A11-A0）页内偏移量，即000010011000B，就确定了所寻址的物理单元00160098H。


    ## 分页转换机制示意图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_59_0.png)


    ## 1.5.3 转换旁视缓冲存储器TLB


    - 页目录和页表都存放在主存中，当进行地址变换时，处理器要对主存访问两次，这样将极大地降低微机的性能。为了提高由线性地址向物理地址的转换速度，Pentium微处理器设有一个高速转换旁视缓冲存储器TLB。它由4组高速缓冲寄存器组成，每组8个寄存器，每个寄存器可存放一个线性地址（高20位，即A31-A12）和与之对应的页表项，如图1.5.5所示。TLB按照最近频繁使用的原则可存放32项。当32项存满后而又有新的页表项产生时，按照最近最少使用的原则置换其中最少使用的项。

    - TLB中的内容是页表中部分内容的副本。TLB技术采用高速硬件进行地址变换，因而地址变换非常快，所以又称TLB为快表，相对而言，存于主存中的页表称作慢表。


    ## 4MB分页转换机制示意图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_61_0.png)


    图 1.5.4 4MB 分页转换机制示意图


    ## 通过TLB进行地址转换的示意图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_62_0.png)


    图 1.5.5 通过TLB进行地址转换的示意图


    线性地址 31-12 同时在慢表和快表中查找，当在快表中查到命中后，立即停止在慢表中的查找，并将查到的页面基址与页内偏移拼接形成物理地址。


    ## 1.6 段页式存储管理的寻址过程


    - 在段页式存储管理中，要使用到段式存储管理部件和页式存储管理部件。在段页式存储管理的寻址过程中，首先将虚地址通过段式存储管理部件转换为线性地址，然后将线性地址通过页式存储管理部件转换为物理地址。

    - 在保护模式下，存储器的管理具有分段管理模式、分页管理模式、段页式管理模式等3种，这3种模式的特点如下：

    - （1）分段不分页。此时，一个任务拥有的最大空间是64T，由分段管理部件将二维虚地址（段选择符，偏移量）转换成一维的32位线性地址，这个线性地址就是物理地址。不分页的好处是：不用访问页目录和页表，地址转换速度快。缺点是：大容量的段调入调出，比较耗时，不够灵活。

    - （2）分段分页。由分段管理部件和分页管理部件共同管理。

    - （3）不分段分页。此时分段管理部件不工作，分页管理部件工作。程序不提供段选择符，只用32位寄存器地址（作为线性地址）。


    ## 段页式存储管理的寻址过程


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_64_0.png)


    图 1.6.1 段页式存储管理的寻址过程


    ## 1.7 虚拟8086模式


    - 虚拟8086模式是一个特殊运行模式。这种特殊运行模式的设计，使得多个8086实模式的应用软件可以同时运行。

    - Pentium保护模式和虚拟8086模式之间的主要区别在于微处理器对段寄存器的解释方式不同。在虚拟8086模式下，段寄存器与在实模式下的使用方式相同，能寻址从00000H到0FFFFFH的1MB存储空间。程序访问的是1MB以内的存储器，而微处理器可以访问存储系统中4GB范围内的任意物理存储单元。

    - 启动虚拟8086模式有两种方式：

    - （1）通过任务切换给标志寄存器赋值。

    - （2）通过中断返回。在这种情况下标志寄存器的内容从堆栈中重新装入。

