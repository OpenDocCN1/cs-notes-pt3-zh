    # 第1章 Pentium保护模式存储管理


    # 1.1 虚拟存储器及其工作原理


    +   - 虚拟存储器又称为虚拟存储系统。虚拟存储器是为满足用户对存储空间不断扩大的要求而提出的，随着用户程序复杂性的增加，占用存储空间越来越大。其解决办法是，可扩大主存，但是造价高，空间利用率很低，并不是好的途径。采用虚拟存储器，可较好地解决这个问题。

    +   - 虚拟存储器这个概念是1961年由英国曼彻斯特大学的Kilburn等人提出的，并于20世纪70年代广泛应用于大中型计算机之中，现在的微型计算机也都采用了这种技术。

    +   - 虚拟存储器是由主存储器、辅助存储器、辅助硬件和操作系统管理软件组成的一种存储体系。它把辅助存储器作为主存储器的扩充，对应用程序员来说，好像计算机系统有一个容量很大的主存。虚拟存储系统的目标是为了增加存储器的存储容量，它的速度接近于主存，单位造价接近于辅存，因此性能价格比很高。'
  - '[PAGE 2]


    # 表1.1.1 虚拟存储器和Cache存储器的比较


    | 存储体系 | 虚拟存储器 | Cache 存储器 |

    |---|---|---|

    | 存储层次 | 主存-辅存 | Cache-主存 |

    | 主要功能 | 主存速度，辅存容量 | CPU 速度，主存容量 |

    | 信息传送单位 | 信息块（比如段、页），有多种划分，长度较大。 | 信息块（比如块、行），长度较小，并且固定。 |

    | 结构差别 | CPU → 主存 → 辅存

    主存不命中，进行辅存调度，而 CPU 程序换道。 | CPU → Cache → 主存

    在 CPU 与主存之间具有直接访问通路。 |

    | 操作过程 | 由部分硬件和操作系统存储管理软件实现，对应用程序员透明，对存储管理软件程序员不透明。 | 全部用硬件实现，对各类程序员透明。 |'
  - '[PAGE 3]


    # 1.1.1 地址空间及地址


    +   - 在虚拟存储器中有3种地址空间及对应的3种地址。

    +   - 3种地址空间分别是虚拟地址空间、主存地址空间、辅存地址空间。

    +   - 虚拟地址空间：又称为虚存地址空间，是应用程序员用来编写程序的地址空间，与此相对应的地址称为虚地址或逻辑地址。

    +   - 主存地址空间：又称为实存地址空间，是存储、运行程序的空间，其相应的地址称为主存物理地址或实地址。

    +   - 辅存地址空间：也就是磁盘存储器的地址空间，是用来存放程序的空间，相应的地址称为辅存地址或磁盘地址。'
