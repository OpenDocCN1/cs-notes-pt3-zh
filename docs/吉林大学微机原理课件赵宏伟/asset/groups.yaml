    ## 3. 功能特性


    - 功能特性主要是对接口中的各接口线作出功能定义，并说明相互间的操作关系。表6.2.1给出了RS-232-C信号的名称、引脚号及功能。其中9和10引脚为测试保留，11、18和25引脚未定义。

    - 符号中第一个字母表示信号类型：A为地线，B为数据线，C为控制线，D为时钟信号。S表示第二（辅助）通道控制信号，其功能由后面2个字母决定。

    - AA为保护地，与设备的机壳连在一起，必要时可与大地相连。

    - AB为信号地，是所有接口线的参考电位点。

    - C开头的信号线作为控制线，用于实现DTE和DCE之间的握手，这些信号都是从DTE角度来定义的。


