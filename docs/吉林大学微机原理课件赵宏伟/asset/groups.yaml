  md: "\n## 3. 方式2\n\n- 方式2为双向选通输入输出方式。方式2只限于A口使用，用C口的5位进行联络。工作时输入、输出数据都能锁存。当A口在方式2下工作时，B口可以在方式0或方式1工作。双向选通输入输出方式是通过A口8位数据线与外设进行双向通信的方式，既能发送，又能接收数据。工作时可以用中断方式，也可以用查询方式与CPU联系。当8255A的A口工作在方式2时，其逻辑功能结构如图5.1.8所示。\n\
    \n- 图中的5个联络信号与在方式1中的含义基本相同。因为是双向传送，所以INTRA在输入或输出时都可以产生。图中INTE1是与输出相关的中断允许，由对PC6的置位/复位控制。INTE2是与输入相关的中断允许，由对PC4的置位/复位控制。\n\
    \n- 方式2的时序可认为是方式1的输入方式时序和方式1的输出方式时序的组合。为节省篇幅，这里不给出具体的时序图。\n\n## 方式2的逻辑功能结构\n\n\
    ![](img/99c6f63905a40bae1a2423b4a3d2910c_296_0.png)\n\n图 5.1.8 方式2的逻辑功能结构\n\n\
    ## 例5.1.1 利用8255A方式0产生波形\n\n- 利用8255A在方式0下工作，使其在PC0、PC3引脚产生如图5.1.9所示波形，试编写相应程序段。设8255A各端口地址分别设为60H、61H、62H和63H，波形延时时间可调用延时1毫秒(Dlms)子程序实现。\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_297_0.png)\n\n图 5.1.9 8255A产生波形接口电路\n\
    \n## 程序段\n\n```\nSTART:  MOV   AL, 80H      ; 送各口方式 0 输出控制字\n        OUT   63H,\
    \ AL\nX1:     MOV   AL, 01H\n        OUT   62H, AL\n        CALL  D1ms\n     \
    \   MOV   AL, 09H\n        OUT   62H, AL\n        CALL  D1ms\n        MOV   AL,\
    \ 00H\n        OUT   62H, AL\n        CALL  D1ms\n        MOV   AL, 08H\n    \
    \    OUT   62H, AL\n        CALL  D1ms\n        JMP   X1\n```\n\n## 例5.1.2 利用8255A方式1查询方式设计双机并行通信接口\n\
    \n- 1. 要求\n\n在甲乙两台微机之间并行传送1KB数据。甲机发送，乙机接收。甲机一侧的8255A采用方式1工作，乙机一侧的8255A采用方式0工作。两机的CPU与接口之间均采用查询方式交换数据。\n\
    \n- 2. 硬件连接\n\n根据要求，双机均采用可编程并行接口芯片8255A构成接口电路，只是8255A的工作方式不同。\n\n## 双机并行通信接口电路框图\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_300_0.png)\n\n图 5.1.10 双机并行通信接口电路框图\n\
    \n## （1）甲机发送程序\n\n```\nDATA    SEGMENT\nSS1:    DB      1024  DUP (?)\nDATA  \
    \  ENDS\nCODE    SEGMENT\n        ASSUME  CS:CODE, DS:DATA\nSTART:  MOV     AX,\
    \ DATA\n        MOV     DS, AX\n        MOV     AL, 0A0H\n        OUT     66H,\
    \ AL     ; 送 A 口方式 1 输出控制字\n        MOV     AL, 0DH     ; 置发送中断允许 INTEA=1\n  \
    \      OUT     66H, AL     ; PC6=1\n        LEA     BX, SS1    ; 取发送数据内存首址\n \
    \       MOV     CX, 400H   ; 发送字节数, 1K\n        MOV     AL, [BX]   ; 向 A 口写第一个数,\
    \ 产生第一个 OBF 信号\n        OUT     60H, AL    ; 送给对方, 以便获取对方的 ACK 信号\n        INC\
    \     BX         ; 发送数据内存地址加 1\n        DEC     CX         ; 字节数减 1\nXX1:    IN\
    \      AL, 64H      ; 取状态 PC3\n      AND     AL, 08H      ; 查发送中断请求 INTRA=1\n\
    \      JZ      XX1          ; 若无中断请求，则等待\n      MOV     AL, [BX]     ; 从内存取下一个要发送的数据\n\
    \      OUT     60H, AL      ; 通过 A 口向乙机发送下一个数据\n      INC     BX           ; 发送数据内存地址加\
    \ 1\n      LOOP    XX1          ; 字节数减 1\n      MOV     AH, 4CH      ; 已完，退出\n\
    \      INT     21H          ; 返回 DOS\nCODE    ENDS\n      END     START\n```\n\
    \n## （2）乙机接收程序\n\n```\nDATA    SEGMENT\nDD1:    DB      1024  DUP(0)\nDATA   \
    \ ENDS\nCODE    SEGMENT\n        ASSUME  CS:CODE, DS:DATA\nSTART:  MOV     AX,\
    \ DATA\n        MOV     DS, AX\n        MOV     AL, 098H\n        OUT     66H,\
    \ AL      ; 送 A 口方式 0 输入控制字\n        MOV     AL, 01H     ;\n        OUT     66H,\
    \ AL      ; 置 ACK=1（PC0=1）\n        LEA     BX, DD1     ; 取接收数据内存首址\n        MOV\
    \     CX, 400H    ; 接收字节数，1K\nYY1:    IN      AL, 64H      ; 检查甲机的 OBF=0? (PC4=0?)\n\
    \        AND     AL, 10H      ; 即检查甲机是否有数据发来\n        JNZ     YY1          ; 若无数据发来，则等待\n\
    \        IN      AL, 60H      ; 从 A 口读入数据\n        MOV     [BX], AL     ; 存入内存\n\
    \        MOV     AL, 00H\n        OUT     66H, AL      ; PC0 置 0 产生 ACK 信号，并发回给甲机\n\
    \        NOP                  ; 同步\n        NOP\n        MOV     AL, 01H     \
    \ ; PC0 置 1\n        OUT     66H, AL\n        INC     BX           ; 内存地址加 1\n\
    \        LOOP    YY1          ; 字节未完，则继续\n        MOV     AH, 4CH\n        INT\
    \     21H          ; 返回 DOS\nCODE    ENDS\n        END      START\n```\n\n## 例5.1.3\
    \ 利用8255A方式2中断方式设计双向并行通信接口\n\n- 1. 要求\n\n主从两台微机进行并行传送，对主机而言，发送和接收的数据合在一起共256个字节。主机一侧的8255A采用方式2，采用中断方式传送数据。从机一侧8255A工作在方式0，采用查询方式传送数据。\n\
    \n- 2. 硬件设计\n\n硬件设计如图5.1.11所示。为了适应中断的要求，接口电路中采用中断控制器8259A。由图5.1.11可知，主机一侧的8255A的A口作双向传送，既输出又输入，它的中断请求线接到8259A的IR2上。从机一侧的8255A的A口和B口是单向传送，分别作输出和输入。\n\
