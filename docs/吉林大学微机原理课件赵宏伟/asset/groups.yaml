    ### 1.5.1 页目录与页表


    1. 页目录基地址寄存器


    页目录存储在内存中，并通过页目录基地址寄存器CR3来访问。控制寄存器CR3保存着页目录的基地址，该基地址起始于任意4KB的边界。指令MOV CR3, reg用来对CR3寄存器进行初始化。CR2是页故障线性地址寄存器，它保存着检测到的最后引起故障的32位线性地址。


    2. 页目录


    页目录由页目录项组成，页目录项包含下一级页表的基址和有关页表的信息。Pentium微处理器中，页目录最多包含1024个页目录项，每个页目录项为4个字节，所以，页目录自身占用一个4KB的页面（存储页）。


    32位线性地址的最高10位（A31-A22）是页目录的索引，用于在页目录中查找不同的页目录项，而页目录项中保存着下一级所对应的页表的基地址。


    3. 页表


    页表由页表项组成，页表项包含页面（存储页）的基址和有关页面的信息。Pentium微处理器中，页表最多包含1024个页表项，每个页表项为4个字节，所以，页表自身也占用一个4KB的页面（存储页）。


    32位线性地址的10位（A21-A12）是页表的索引，用于在页表中查找不同的页表项，而页表项中保存着所对应的页面（存储页）的基地址，即页面（存储页）的起始地址。


    ## 页目录项格式


    | D31 D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | 页表基址 | AV | AI | L | 0 | 0 | 0 | A | PCD | PWT | U/S | R/W | P |

    | 页表起始地址 | 系统保留位 系统可任意使用 |  |  |  |  | 访问 | 页面 Cache 禁止 | 页面写直达 | 用户/系统 | 读/写
    | 存在 |


    图 1.5.1 页目录项格式


    ## 页表项格式


    | D31 D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | 页面基址 | AV | AI | L | 0 | 0 | D | A | PCD | PWT | U/S | R/W | P |

    | 物理页面起始地址 | 系统保留位 系统可任意使用 |  |  |  |  | 修改 | 访问 | 页面 Cache 禁止 | 页面写直达 | 用户/系统
    | 读/写 | 存在 |


