    ## 第3章 中断


    - 3.1 概述

    - 3.1.1 中断的基本概念

    - 1. 中断和中断源


    中断描述了一种CPU处理程序的过程。CPU在正常执行当前程序时，由某个事件引起CPU暂时停止正在执行的程序，进而转去执行请求CPU暂时停止的相应事件的服务程序，待该服务程序处理完毕后又返回继续执行被暂时停止的程序，这一过程称为中断。常将为实现中断功能而采取的硬件和软件措施，称为中断系统。


    ## 中断的应用


    - （1）实现主机与I/O设备的并行工作

    - （2）利用中断进行实时处理

    当微机用于实时控制时，中断是一个十分重要的功能。所谓实时处理，是指在现场的某个事件或现象出现的实际时间内及时进行处理。如微机在过程控制系统中，监测到压力过大或温度过高时，微机应立即响应并及时处理。防止偶然事故的发生。

    - （3）利用中断方式进行人机对话

    某些程序的执行需要操作人员从键盘或某终端设备提供信息以进行控制。这些信息何时由键盘发出是随机的，因此，可以利用中断方式将信息提供给微机以实现人机对话。

    - （4）故障处理

    微机在运行过程中，往往会出现事先预料不到的情况或出现一些故障：如电源掉电、存储校验出错、运算溢出等等。微机就可以利用中断技术自行处理，而不必停机或报告工作人员。

    - （5）多处理机系统中各处理机之间的协调工作

    在多机系统与计算机网络中，各节点之间需要通信，以交换信息或协同工作。当一个节点要和其它节点通信时，便向它提出中断请求，对方转入中断服务程序，实现通信。


    ## 3.1.2 中断接口电路


    - 1. 最简单的中断接口电路

    一个最简单的中断接口电路包含三个输入设备（A、B、C）和一个电源掉电中断源，CPU中设有一个中断允许触发器，三个可屏蔽中断请求输入端INTR0、INTR1、INTR2和一个非屏蔽中断请求输入端NMI。它们的作用如下。

    - （1）中断请求触发器

    - （2）中断允许触发器

    - （3）可屏蔽中断与非屏蔽中断

    - （4）中断请求与撤消

    - （5）中断请求输入线

