    - 转换时间是指ADC完成一次转换所需的时间，即从启动信号开始到转换结束并得到稳定的数字输出量所需的时间。通常为微秒级。一般约定，转换时间大于1ms的为低速，1ms～1μs的为中速，小于1μs的为高速，小于1ns的为超高速。转换时间的倒数称为转换速率。例如ADC
    0809的转换时间为100μs，则转换速率为每秒1万次。

    - 4. 量程

    - 量程是指ADC所能转换的输入电压范围。


    ## 7.4.4 ADC 0809八位A/D转换器及应用


