    ## 3. 气敏传感器


    - 半导体气敏传感器是利用半导体与某种气体接触时电阻及功率函数变化这一效应来检测气体的成分或浓度的传感器。

    - 它可用于家用液化气泄漏报警、城市煤气、煤气爆炸浓度以及CO中毒危险浓度报警等。有的敏感元件对酒精特别敏感，利用这种气敏元件可做酒后开车报警控制。


    ## 4. 压电式和压阻式传感器


    - 某些电解质（如石英晶体、压电陶瓷），在沿一定方向上受到外力的作用而变形时，内部会产生极化现象，同时在其表面上产生电荷。当外力去掉后，又重新回到不带电的状态。从而可以将机械能转变成电能，因此可以把压电式传感器看作是一个静电荷发生器，也就是一个电容。利用这些介质可做成压电式传感器。

    - 由于固体物理的发展，固体的各种效应已逐渐被人们所发现。固体受到作用力后，电阻率（或电阻）就要发生变化，这种效应称压阻式效应，利用它可做成压阻式传感器。利用压电式或压阻式传感器可测量压力、加速度、载荷等。前者可测量频率从几赫至几十千赫的动态压力，如内燃机气缸、油管、进排气管、枪炮的膛压、航空发动机燃烧室等的压力。


    ## 5. 光纤传感器


    - 光纤传感器是70年代迅速发展起来的一种新型传感器。它具有灵敏度高、电绝缘性能好、抗电磁干扰、耐腐蚀、耐高温、体积小、重量轻等优点，可广泛用于位移、速度、加速度、压力、温度、液位、流量、水声、电流、磁场、放射性射线等物理量的测量。

    - 功能型光纤传感器不仅起到传导光的作用，它还是敏感元件。它利用了光纤本身的一些特点，这些特点是光纤的传输特性受被测物理量作用会发生变化，从而使光纤中波导光的属性（光强、相位、偏振态、波长等）被调制。因此，这一类光纤传感器又分为光强调制型、相位调制型、偏振态调制型和波长调制型。


    ## 6. 位移-数字转换器


    - (1) 脉冲盘式角度-数字转换器


    脉冲盘式角度-数字转换器是在一个圆盘的边缘上开有相等角距的缝隙，在开缝圆盘两边分别安装光源和光敏元件。当圆盘随工作轴一起转动时，每转过一个缝隙就发生一次光线明暗变化，经过光敏元件，就产生一次电信号的变化。将这电信号整形放大，可得到一定幅度和功率的电脉冲输出信号，脉冲数就等于转过的缝隙数。上述脉冲信号可由计数器计数，计数值就能反映圆盘转过的角度。


    - (2) 码盘式角度-数字转换器


    上述脉冲盘式输出的是与角度对应的脉冲个数，要经过计数器才能进行数值编码，码盘式则是按角度直接进行编码的转换器，通常把它安装在检测轴上。编码的方式有二进制制和格雷码制，按结构有接触式和光电式等。


    - (3) 光电码盘角度-数字转换器


    光电码盘是目前用得较多的一种，码盘用透明及不透明区按一定编码构成。码盘上码道的条数就是数码的位数。对应每一 条码道有一个光电元件，当码盘处于不同角度时，光电转换器的输出就呈现出不同的数码。它的优点是没有接触磨损因而允许转速高。


    ## 7.3 D/A转换


    - 7.3.1 D/A转换原理

    - D/A转换是把数字量信号转换成模拟量信号的过程，同时，D/A转换器也是A/D转换器的基本组成部分。我们知道：一个二进制数字是由各位“0”“1”代码组合起来的，每位代码都有一定的权。为了将数字量转换成模拟量，应将每一位代码按权大小转换成相应的模拟输出分量，然后根据叠加原理将各位代码对应的模拟输出分量相加，其总和就是与数字量成正比的模拟量，由此完成D/A转换。

    - D/A转换的方法较多，但常用的方法是加权电阻网和T型电阻网。


    ## 1. 加权电阻网D/A转换


    - 加权电阻网D/A转换就是用一个二进制数字的每一位代码产生一个与其相应权成正比的电压（或电流），然后将这些电压（或电流）叠加起来，就可得到该二进制数所对应的模拟量电压（或电流）信号。

    - 例如，让二进制数的第0位产生一个1V（2⁰）的电压信号，第1位产生2V（2¹）的电压信号，第2位产生4V（2²）的电压信号，第3位产生8V（2³）的电压信号，依此类推，第n位产生2ⁿV的电压信号。

    - 再将这些电压信号加起来，就可以得到与原二进制数成正比的电压信号。这种转换方法就称为加权电阻网络法。


    ## 2. T型电阻网D/A转换


    - T型电阻网D/A转换的组成是：

    - （1）输入数据控制的开关组；

    - （2）R-2R电阻网络；

    - （3）由运算放大器构成的电流-电压转换电路。

    - 这种转换方法与加权电阻网络法的主要区别在于电阻求和网络的形式不同，它采用分流原理来实现对相应数字位的转换。

    - 电路中全部电阻是R和两倍的R两种，阻值通常在100欧姆到1000欧姆之间，整个电路是由相同的电路环节组成的。

    - 每一节电路有两个电阻，一个开关，这一节电路就相当于二进制数的一个位，每一节电路的开关就由二进制数相应的代码来控制，因为电阻是按T型结构来连接的，所以称为T型电阻网。


    ## 7.3.2 D/A转换器的主要参数


    - 1. 分辨率

    - D/A转换器的分辨率定义为：当输入数字发生单位数码变化时，即LSB位产生一次变化时，所对应输出模拟量（电压或电流）的变化量。实际上，分辨率是反映了输出模拟量的最小变化量。

    - 2. 建立时间

    - 建立时间也可以叫做转换时间，是描述D/A转换速率快慢的一个重要参数，一般所指的建立时间是指输入数字量变化后，输出模拟量稳定到相应数值范围内（稳定值±ε）所经历的时间。

    - 3. 线性度

    - 线性度是指，当数字量变化时，D/A转换器输出的模拟量按比例关系变化的程度。


    ## 7.3.3 D/A转换器的输入输出特性


    - 1. 输入缓冲能力

    - DAC是否带有三态输入缓冲器或锁存器来保存输入数字量，这对不能长时间在数据总线上保持数据的微机系统中使用D/A转换器是十分重要。

    - 2. 输入数据的宽度

    - DAC有8位、10位、12位、14位、16位之分。当DAC的位数高于微机系统数据总线的宽度时，需要两次分别输入数字量。

    - 3. 电流型还是电压型

    - 即DAC的输出是电流还是电压。对电流输出型，其电流在几mA到十几mA；对电压输出型，其电压一般在5V～10V之间。有些高电压型可达24V～30V；若需将电流输出转换成电压输出，则采用运放进行转换。

    - 4. 是单极性输出还是双极性输出

    - 对一些需要正负电压控制的设备，就要使用双极性DAC，或在输出电路中采取措施，使输出电压有极性变化。

    - 5. 输入码制

    - DAC能接收哪些码制（如二进制码、BCD码等）的数字输入量。


    ## 7.3.4 DAC 0832转换器及应用


    - DAC 0832是美国数据公司的8位D/A转换器，与微处理器完全兼容，是在8位D/A转换器中使用率最高的一种芯片。

    - 器件采用先进的CMOS工艺，因此功耗低，输出漏电流误差较小。


    ## 1. DAC 0832主要特性


    - 8位分辨率，

    - 电流型输出，

    - 外接参考电压-10V～+10V，

    - 可采用双缓冲、单缓冲或直接输入三种工作方式，

    - 单电源+5V～+15V，

    - 电流建立时间1μs，

    - R-2R T型解码网络，

    - 线性误差0.2%FS（FS为满量程），

    - 非线性误差0.4%FS，

    - 数字输入与TTL兼容。


    ## 2. DAC 0832的内部构造


    - DAC 0832由4个部分组成：一个8位输入寄存器，一个8位 DAC寄存器，一个8位D/A转换器和一组控制逻辑组成，如图7.3.2所示。

    - 在D/A转换器中采用的就是T型R-2R电阻网，DAC 0832是电流型输出，改变参考电压VREF的极性，可以相应地改变输出电流的流向，从而控制输出电压的极性。

    - 8位输入寄存器受控于控制信号ILE、、、，当ILE=1，=0，=0时，该寄存器被选中，允许接收数据线上的信息。当上述控制信号无效时（只要有一个无效即满足条件），锁存该信息。

