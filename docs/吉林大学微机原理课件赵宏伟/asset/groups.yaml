    - 局部描述符表寄存器LDTR也是Pentium微处理器存储器管理部件的一部分，每个任务除了可访问全局描述符表外还可访问它自己的描述符表，这个描述符表称为局部描述符表LDT，它由LDTR定义某个任务用到的局部存储器地址空间。

    - Pentium微处理器中的局部描述符表寄存器LDTR由16位选择符、32位基址、20位界限和12位属性组成。基址、界限和属性不可访问，属于程序不可见的部分，程序只能对16位的段选择符进行访问。

    - 局部描述符表寄存器LDTR中的段选择符是一个指向全局描述符表GDT中LDT描述符的选择符，它还不能直接确定局部描述符表LDT的位置。如果LDTR中装入了段选择符，Pentium微处理器自动地将相应的LDT描述符从全局描述符表GDT中读出来，并装入LDTR中程序不可见部分。也就是说，全局描述符表GDT中的LDT描述符才确定了局部描述符表。


