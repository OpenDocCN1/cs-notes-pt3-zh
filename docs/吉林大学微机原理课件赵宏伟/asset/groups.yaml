    # 2. 湿度传感器


    +   - 湿度传感器大都利用湿度变化引起其电阻值或电容量变化原理制成，即将湿度变化转换成电量变化。

    +   - 热敏电阻湿度传感器利用潮湿空气和干燥空气的热传导之差来测定湿度，而氯化锂湿度传感器利用氯化锂在吸收水分之后，其电阻值发生变化的原理来测量湿度。高分子湿度传感器利用导电性高分子对水蒸汽的物理吸附作用引起电导率变化的特性。'
