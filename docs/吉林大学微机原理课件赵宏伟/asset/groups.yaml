    \n## 8.3.4 显示器的主要性能指标\n\n- 1. 像素和点距\n- 构成图象的最小单位或构成图象的点叫像素。\n- 2. 分辨率\n- 分辨率是指整屏可显示的像素的多少。最大分辨率与屏幕尺寸和点距密切相关。例如，15英寸的显示器，当点距是0.28mm时，就可具有1024×768点的最大分辨率。在相同分辨率下，点距越小，图象就越清晰，\n\
    - 3. 显示器的尺寸\n- CRT显示器的尺寸指显像管的对角线尺寸。最大可视面积就是显示器可以显示图形的最大范围。\n\n## 主要性能指标\n\n- 4.\
    \ 扫描方式\n- CRT显示器的扫描方式分为“逐行扫描”和“隔行扫描”两种。隔行扫描是每隔一行显示一行，到底后再返回显示刚刚未显示的行，而逐行扫描是顺序显示每一行。逐行扫描比隔行扫描拥有更稳定的显示效果。目前，只有家用电视仍然采用隔行扫描方式。\n\
    - 5. 像素的颜色范围\n- 一个像素可显示出多少种颜色，由表示这个像素的二进制位数决定（又称像素的位宽），如果每个像素使用8bit（一个字节）来表示它的颜色，则每个像素可有256色。如使用16bit，有65536种颜色；如用24bit表示，则可有16.8M颜色。\n\
    \n## 主要性能指标\n\n- 6. 刷新频率\n- 刷新频率就是屏幕刷新的速度。刷新频率越低，图像闪烁和抖动得就越厉害，眼睛疲劳得就越快。当采用70Hz以上的刷新频率时可基本消除闪烁。因此，70Hz的刷新频率是显示器稳定工作的最低要求。如能达到80Hz以上的刷新频率就可完全消除图像闪烁和抖动感，眼睛也不会太容易疲劳。虽然刷新频率越高越好，但是过高的刷新频率会加速CRT显像管的老化，通常85Hz比较合适。\n\
    - 7. 视频带宽\n- 视频带宽是造成显示器性能差异的一个比较重要的因素。带宽决定着一台显示器可以处理的信息范围，就是指特定电子装置能处理的频率范围。\n"
