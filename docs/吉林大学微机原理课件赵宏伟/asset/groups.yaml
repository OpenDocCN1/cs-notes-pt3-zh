    ## 1.3.4 任务切换及其特权级检查


    + - 所谓任务切换，是指从执行某一个任务转换到执行另外一个任务的过程。任务切换是多任务/多用户系统的一个非常重要的属性。Pentium微处理器支持多任务，允许多个任务之间通过硬件进行快速切换。任务切换的过程是：保存机器的整个状态（比如所有的寄存器、地址空间、到原来任务的链接等），装入新的执行状态，进行保护检查，开始新任务的执行，执行完毕后回到原来的任务继续执行。

    + - 1. 任务的设定

    + - 在执行某任务以前，必须在存储器中定义GDT、IDT、LDT和TSS，在GDT中登记（写入）所需要的段描述符、门描述符、LDT描述符、TSS描述符，在IDT中登记（写入）所需要的中断门、陷阱门、任务门等，并且还必须对GDTR、IDTR、LDTR、TR设置适当的数值。TR给出TSS段的基址。

    + - 2. TSS描述符和任务门

    + - 在任务切换中，通常用到任务状态段TSS和任务门。TSS描述符和任务门在前面已有说明。

    + - 每一个任务必须有一个任务状态段TSS与其关联。TSS描述符属于系统描述符类（属性字节中S=0），该描述符包含了TSS在内存中的基址和界限。TSS描述符位于GDT中，所以指向TSS描述符的段选择符的TI位应该为0。


    ## 用调用门实现段间间接转移的特权级检查


    图 1.3.7 用调用门实现段间间接转移的特权级检查


    ## 3. 任务切换的方法


    + - 在进行任务切换时，要把新任务的TSS描述符的选择符传送到TR的选择符字段，对TR的选择符字段有两种修改方法：

    + - （1）直接任务切换：直接访问新任务的TSS描述符，从而得到新任务的TSS。在直接任务切换中，段间JMP/CALL指令的操作数的段选择符就是新任务的TSS描述符的选择符，它被直接加载到TR的选择符字段，对于执行IRET指令的情况（必须NT=1），则是把曾经压入到当前执行任务的TSS中的返回链（返回链就是前一个任务的TSS描述符的段选择符，即原来TR中的16位可见部分内容），作为TR选择符字段的修改值。

    + - （2）间接任务切换：新任务的TSS描述符的选择符由任务门加载。通过任务门间接访问新任务的TSS描述符，从而得到新任务的TSS。在间接任务切换中，段间JMP/CALL指令的操作数的段选择符是任务门的选择符，而任务门的内容包含新任务的TSS描述符的选择符，所以，新任务的TSS描述符的选择符将由任务门间接加载到TR的选择符字段，


    ## 3. 任务切换的方法


    + - 这样，对任务的切换，可以采用以下方法：

    + - （1）段间JMP/CALL指令：进行直接任务切换或间接任务切换。

    + - （2）INT指令（包括异常中断和外部中断）：只能进行间接任务切换。访问IDT中的任务门，新任务的TSS描述符的选择符由任务门加载。当中断/异常发生时，如果IDT的目标项是中断门或陷阱门，则执行中断处理程序。如果目标项是任务门，则进行任务切换。

    + - （3）IRET指令（当NT=1时）：只能进行直接任务切换。EFLAGS寄存器的NT位必须为1，表明是处于任务嵌套。NT为0时，执行IRET指令与正常中断处理程序最后执行IRET指令的结果相同，即只完成正常的中断返回，不进行任务切换。


