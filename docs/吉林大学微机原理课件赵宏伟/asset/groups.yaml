    ① E可执行位。当E=1时，是代码段。


    ② C一致性位。所谓一致性检查，就是采用特权级进行控制。当C=0时，表示非一致性代码段，此时忽视段描述符的特权值。当C=1时，表示一致性代码段，需要进行特权级检查。


    ③ R可读位。当R=0时，不允许读。当R=1时，允许读。当然，对程序段来说，通常都是“可执行的”。R位取0可防止用户程序对存储器里的“目标程序代码”做手脚。R位为0的描述符只能加载到CS的描述符寄存器，而R位为1的描述符可加载到CS、DS、ES、FS及GS的描述符寄存器，此时，可以读取段内的数据（程序代码）。


    ④ A访问位。当A=0时，该段尚未被访问；当A=1时，该段已被访问。


    （9）D位/B位字段


    段描述符的第6字节的D6位是D位/B位字段。这个字段在代码段描述符中叫做D位字段，而在数据段和堆栈段描述符中叫做B位字段。该字段可分为下述三种情况。


    1）在代码段描述符中，用来指示代码段中缺省的操作数的长度和有效地址长度。当D=1时，说明采用的是32位操作数和32位有效地址的寻址方式。D=0时，则说明采用的是16位操作数和16位有效地址的寻址方式。


    2）在堆栈段描述符中，用来指示堆栈指针寄存器的大小。当B=1时，使用的是32位的堆栈指针寄存器ESP。当B=0时，使用的是16位的堆栈指针寄存器SP。堆栈段的上界是一个各位均为1的地址。当B=1时，上界地址值为0FFFFFFFH。当B=0时，上界地址值为0FFFFH。


    3）在数据段描述符中，用来指示数据段中操作数的长度。当B=1时，使用的是32位的操作数。当B=0时，使用的是16位的操作数。


    （10）兼容位字段


    段描述符的第6字节的D5位必须是0，以便与将来的处理器兼容。


    ## 程序段描述符的格式


    表1.2.1 程序段描述符的格式


    | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 | 字节 |

    |---|---|---|---|---|---|---|---|---|

    |  |  |  | 段界限 7~0 |  |  |  |  | 0 |

    |  |  |  | 段界限 15~8 |  |  |  |  | 1 |

    |  |  |  | 段基址 7~0 |  |  |  |  | 2 |

    |  |  |  | 段基址 15~8 |  |  |  |  | 3 |

    |  |  |  | 段基址 23~16 |  |  |  |  | 4 |

    | P 存在 | DPL 特权级 | S 分类 | TYPE 类型 |  |  |  |  | 5 |

    | G 粒度 | D/B | 0 | AVL | 段界限 19~16 |  |  |  | 6 |

    |  |  |  | 段基址 31~24 |  |  |  |  | 7 |


    ## 2. 系统段描述符


    表1.2.4 系统段描述符的格式


    | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 | 字节 |

    |---|---|---|---|---|---|---|---|---|

    |  |  |  | 段界限 7～0 |  |  |  |  | 0 |

    |  |  |  | 段界限 15～8 |  |  |  |  | 1 |

    |  |  |  | 段基址 7～0 |  |  |  |  | 2 |

    |  |  |  | 段基址 15～8 |  |  |  |  | 3 |

    |  |  |  | 段基址 23～16 |  |  |  |  | 4 |

    | P 存在 | DPL 特权级 | S 分类 | TYPE 类型 |  |  |  |  | 5 |

    | G 粒度 | 0 | 0 | 0 | 段界限 19～16 |  |  |  | 6 |

    |  |  |  | 段基址 31～24 |  |  |  |  | 7 |


    ## 系统段描述符中的类型 TYPE 字段的格式


    | TYPE | 段的类型（用途） | TYPE | 段的类型（用途） |

    |---|---|---|---|

    | 0000 | 未定义（无效） | 1000 | 未定义（无效） |

    | 0001 | 286 TSS 描述符，非忙 | 1001 | TSS 描述符，非忙 |

    | 0010 | LDT 描述符 | 1010 | 未定义（保留） |

    | 0011 | 286 TSS 描述符，忙 | 1011 | TSS 描述符，忙 |

    | 0100 | 286 调用门描述符 | 1100 | 调用门描述符 |

    | 0101 | 任务门描述符 | 1101 | 未定义（保留） |

    | 0110 | 286 中断门描述符 | 1110 | 中断门描述符 |

    | 0111 | 286 陷阱门描述符 | 1111 | 陷阱门描述符 |


    ## 3. 门描述符


    门描述符用来控制访问的目标代码段的入口点。所谓门是一种关卡，用来控制从一段程序到另一段程序或从一个任务到另一个任务的转移。在转移过程中自动进行保护检查，并控制转移到目的程序的入口。


    门描述符包括调用门、任务门、中断门和陷阱门。这些门为控制转移提供了一个间接的办法，这一办法允许处理器自动地完成保护检查。它也允许系统设计者控制操作系统的入口点。调用门用于改变特权级别，任务门用于任务切换，中断门和陷阱门用于确定中断服务程序。


    门描述符的第0、1、6、7字节是一个32位的偏移地址，第4字节是一个字计数，第2、3字节是一个段选择符，第5字节是门描述符的属性。


    32位的偏移地址指向中断服务程序或其他程序的入口。


    ## 门描述符的格式


    表1.2.6 门描述符的格式


    | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 | 字节 |

    |---|---|---|---|---|---|---|---|---|

    |  |  |  | 偏移地址 7~0 |  |  |  |  | 0 |

    |  |  |  | 偏移地址 15~8 |  |  |  |  | 1 |

    |  |  |  | 段选择符 7~0 |  |  |  |  | 2 |

    |  |  |  | 段选择符 15~8 |  |  |  |  | 3 |

    | 0 | 0 | 0 |  | 字计数 |  |  |  | 4 |

    | P 存在 | DPL 特权级 | S 分类 | TYPE 类型 |  |  |  |  | 5 |

    |  |  |  | 偏移地址 23~16 |  |  |  |  | 6 |

    |  |  |  | 偏移地址 31~24 |  |  |  |  | 7 |


    ## 1.2.3 全局描述符表及寄存器


    全局描述符表由段描述符组成。全局描述符表和段描述符都由系统程序产生。描述符表就是描述符的一个阵列，是存放在主存中的一种数据结构。


    在Pentium微处理器中，全局描述符表寄存器GDTR指定了全局描述符表GDT在内存中的起始地址。全局描述符表是Pentium微处理器进入保护方式后存储器管理系统中的一个重要组成部分。


    GDTR是Pentium微处理器中的48位寄存器。该寄存器的低2个字节标识为16位界限，它规定了GDT按字节进行计算的地址范围的大小。GDTR的高4个字节标为32位基地址，指示GDT在存储器中开始的物理地址。用装全局描述符表寄存器指令LGDT和存全局描述符表寄存器指令SGDT，可以对全局描述符表寄存器GDTR的内容进行装入和保存的操作。


    ## 由GDTR确定GDT存储位置和界限


