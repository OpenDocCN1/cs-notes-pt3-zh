    |---|---|---|---|

    | 同一个特权级 | JMP、CALL、RET、IRET* | 代码段 | GDT/LDT |

    | 同一个特权级，或转移到更高特权级 | CALL | 调用门 | GDT/LDT |

    |  | 中断指令、异常、外部中断 | 陷阱门、中断门 | IDT |

    | 转移到较低特权级 | RET、IRET* | 代码段 | GDT/LDT |


