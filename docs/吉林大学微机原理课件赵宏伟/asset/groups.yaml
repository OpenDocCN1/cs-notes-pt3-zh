    ## 2. 多重中断处理过程


    - 多重中断方式允许在中断服务程序处理过程中响应优先级更高的中断请求。

    - 当正在执行中断服务程序时，又产生了优先级较高的中断请求，这时CPU挂起正在处理的优先级较低的中断，转而响应优先级较高的中断，待具有较高优先级的中断处理完毕后，返回执行优先级较低的中断服务程序。这种处理过程叫做多重中断，也叫做中断嵌套。

    - 例如在图3.1.5中，假定CPU在执行主程序第K条指令时接到设备C的中断请求，经中断处理将断点K+1压栈保存，然后转入设备C的中断服务程序。在执行设备C的中断服务程序第J条指令时，又接到优先级更高的设备B的中断请求，于是CPU暂停执行设备C的中断服务程序，经中断处理将断点J+1压栈保存后，转入设备B的中断服务程序。当执行完设备B的中断服务程序时，从栈中取出返回地址J+1，返回设备C的中断服务程序。在执行完设备C的中断服务程序之后，从栈中取出返回地址K+1返回主程序。


    - （1）CPU响应中断的条件

    - 与单重中断相同。

    - （2）中断处理

    - 与单重中断相同。


    - （3）中断服务程序

    - 1）保护现场。与单重中断相同。

    - 2）保护原中断屏蔽字。保护本次中断的屏蔽字，以便返回主程序时恢复之。

    - 3）送新中断屏蔽字。该屏蔽字将屏蔽掉与本次中断请求同一优先级别以及更低级别的其它请求。例如，在图3.1.5设备C中断服务程序中，其新中断屏蔽字对应A、B、C、D的输出状态为1、1、0、0。

    - 4）开中断。通过指令开中断，因在中断处理中已由硬件关中断，为了能响应新的更高级别请求，中断服务程序需执行开中断指令。

    - 5）中断处理。与单重中断相同，若有新的更高级别的中断请求就在此程序段内响应。

    - 6）关中断。通过指令关中断，在恢复现场和恢复原屏蔽字时不允许被干扰，CPU应处于关中断的状态。

    - 7）恢复原屏蔽字。在中断服务程序结束时，需要恢复原屏蔽字。

    - 8）恢复现场。与单重中断相同。

    - 9）开中断。

    - 10）返回断点。


    ## 3.2 Pentium的中断机制


    - Pentium的 中断机制最多能处理256个中断源，每个中断源都有一个8位二进制数的 中断类型码（0~255），以供CPU进行识别。

    - Pentium的256个中断源可分成四类，即可屏蔽中断（INTR）、非屏蔽中断（NMI）、软件中断（执行INTO、INT3、INT n、BOUND指令引起的
    中断）、异常。


