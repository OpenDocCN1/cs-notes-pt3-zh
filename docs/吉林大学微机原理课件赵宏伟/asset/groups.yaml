    \        ; 未完、继续\nMOV  AH, 4CH     ; 已完, 退出\nINT  21H         ; 返回 DOS\n```\n\n\
    ### 中断服务程序\n\n```\nZZZ2    PROC    FAR\n        MOV     AL, 08H     ; 复位 PC4，禁止输入中断\n\
    \        OUT     66H, AL\n        MOV     AL, 0CH     ; 复位 PC6，禁止输出中断\n      \
    \  OUT     66H, AL\n        IN      AL, 64H     ; 查中断源，读状态字\n        MOV     AH,\
    \ AL      ; 保存状态字\n        AND     AL, 20H     ; 检查状态位 IBF=1，是输入吗？\n        JZ\
    \      ZZZ3        ; 不是，则跳输出程序 ZZZ3\n        IN      AL, 60H     ; 是，则从 A 口读数\n\
    \        MOV     [DI], AL    ; 存入内存区\n        INC     DI          ; 内存地址+1\n \
    \       JMP     ZZZ4\n```\n\n### 中断服务程序\n\n```\nZZZ3:  MOV  AL, [SI]   ; 从内存取发送数据\n\
    \       OUT  60H, AL      ; 输出\n       INC  SI           ; 内存地址+1\nZZZ4:  MOV\
    \  AL, 09H     ; 置位 PC4，输入中断允许\n       OUT  66H, AL\n       MOV  AL, 0DH     \
    \ ; 置位 PC6，输出中断允许\n       OUT  66H, AL\n       MOV  AL, 20H      ; 送 OCW2 中断结束\n\
    \       OUT  20H, AL\n       IRET              ; 中断返回。\nZZZ2  ENDP\nCODE  ENDS\n\
    \       END  BBB1\n```\n\n## 定时和计数方法\n\n- 软件方法：执行一段程序达到延时的目的，利用一个寄存器或一个存储器单元可达到计数目的。优点是容易实现，节约硬件开销，定时时间和计数次数调整灵活；缺点是占用CPU的时间，降低了CPU的工作效率，定时不够精确。\n\
    - 硬件方法：设计一个硬件电路，比如555集成电路外加电阻电容，或者CD4020集成电路，就可完成定时和计数。但是，一旦电路形成，则定时时间和计数次数随之确定，要想改变，就只能重新设计硬件电路。该方法的优点是不占用CPU的时间，缺点是有硬件投资，有些电路定时不很精确，定时时间和计数次数调整麻烦。\n\
    - 上述的两种方法各有优缺点，不能一概而论，应视系统的具体情况，根据CPU的任务处理量来择优选用。但是，当系统要求定时精确，不占用CPU时间，可灵活调整定时时间或计数次数时，则只能采用可编程的计数器/定时器芯片，8253就是这种芯片。\n\
    \n## 5.2.1 8253的基本功能\n\n- 8253的基本功能如下：\n- 1. 含有3个独立的16位计数器，能够进行3个16位的独立计数。\n-\
    \ 2. 每一个计数器具有六种工作方式。\n- 3. 能进行二进制/十进制计数（减法计数）。所谓十进制计数，是指BCD码计数，每个计数器可表示4位十进制数的BCD码，每来一个计数脉冲，按照十进制数减1规律进行计数。例如，当前的计数值为1000\
    \ 0100 0000 0000(8400)，来一个计数脉冲后，变为1000 0011 1001 1001(8399)。\n- 4. 计数频率为0～2MHz。\n\
    - 5. 可作计数器或定时器。\n\n## 5.2.2 8253的引脚信号与内部结构\n\n8253为24引脚，双列直插封装，其内部结构如图5.2.1所示。\n\
    由图可看出，8253的内部结构由数据总线缓冲器、读/写控制逻辑、3个独立的计数器三部分组成。\n\n1. 数据总线缓冲器\n\n数据总线缓冲器是一个三态8位的双向缓冲器，D7-D0同系统数据总线相连。CPU通过执行输入/输出指令来实现对缓冲器发送或接收数据。8253的控制字也是通过该缓冲器传送的。\n\
    \n2. 读/写控制逻辑\n\n读/写控制逻辑用来管理数据信息和控制字的传送，它接收来自CPU地址总线和控制总线的有关信号，向3个独立的计数器的控制部件发送命令。\n\
    \n3. 计数器\n\n### 8253的内部结构\n\n图 5.2.1 8253 的内部结构\n\n## 计数初值的计算\n\n- 计数方式：计数値＝要求的计数次数\n\
    - 定时方式：计数値＝定时时间÷时钟脉冲周期\n- 各计数器通道的输入脉冲和输出状态之间的关系与门控脉冲（GATE信号）的控制有关，而门控脉冲的作用又依赖于工作方式的选择。\n\
    \n## 5.2.3 8253的控制字\n\n- 8253只有一个控制字，主要功能是选择工作方式、读写格式和计数方式，其格式和含义如图5.2.2所示。D7、D6两位用来选择计数器，D5-D0对应每个计数器中的控制寄存器。\n\
    - 值得注意的一点是，控制字的D7D6用于选择计数器，地址线的A1A0也用于选择计数器，它们的差别何在？事实上，A1A0=00、01、10选择的是计数器的数据端口，往这些端口中送入的是计数初值，从这些端口读出的是当前计数值。A1A0=11选择的是三个计数器共用的控制端口，往这个端口中送入的是控制字，这个端口禁止读出。而控制字中的D7D6是在送入控制端口的前提下，用于控制后面的D5-D0送给哪一个计数器进行工作环境设置。\n\
    \n## 8253控制字的格式\n\n| D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |\n|---|---|---|---|---|---|---|---|\n\
    | SC1 | SC0 | RL1 | RL0 | M2 | M1 | M0 | BCD |\n\n| 计数器选择 |\n|---|\n| 00 = 计数器\
    \ 0 |\n| 01 = 计数器 1 |\n| 10 = 计数器 2 |\n| 11 = 非法 |\n\n| 计数方式 |\n|---|\n| 0 = 二进制计数\
    \ |\n| 1 = BCD 码计数 |\n\n| 工作方式 |\n|---|\n| 000 = 方式 0 |\n| 001 = 方式 1 |\n| ×10\
    \ = 方式 2 |\n| ×11 = 方式 3 |\n| 100 = 方式 4 |\n| 101 = 方式 5 |\n\n| 读/写格式 |\n|---|\n\
    | 00 = 锁存命令，计数值锁存 |\n| 01 = 只读/写低 8 位，高 8 位清 0 |\n| 10 = 只读/写高 8 位，低 8 位清 0 |\n\
    | 11 = 先读/写低 8 位，后读/写高 8 位 |\n\n图 5.2.2 8253 控制字的格式\n"
