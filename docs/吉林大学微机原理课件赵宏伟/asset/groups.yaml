    \n#### 1. 程序控制扫描方式\n\n这种方式是利用CPU工作的空余时间，调用键盘扫描子程序，响应键盘的输入请求。\n\n#### 2. 定时扫描方式\n\
    \n这种方式是利用定时器产生定时中断(例如10ms)，CPU响应中断后对键盘进行扫描，并在有键按下时转入键功能处理程序。定时扫描方式在本质上是中断方式，但不是实时响应，而是定时响应。\n\
    \n#### 3. 中断扫描方式\n\n当应用系统工作时，并不经常需要键的输入，因此，无论键盘是工作于程序控制方式还是定时方式，CPU都经常处于空扫描状态。为了进一步提高CPU效率，可以采用中断扫描方式，当键盘上有键闭合时便产生中断请求，CPU响应中断，执行中断服务程序，对闭合键进行识别，并作相应的处理。\n\
    \n### 8.1.5 PC机键盘与接口\n\n- PC系列机都采用非编码键盘，其按键排列为矩阵式。不同时期的PC系列机配有物理上各不相同的键盘。\n- 早期的PC机和PC/XT机使用的是具有83个按键的键盘，这种键盘一般称作标准键盘。\n\
