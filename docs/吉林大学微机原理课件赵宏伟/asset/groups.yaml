    # 第6章 串行通信和可编程串行接口芯片8251A


    +   - 目前，随着微型计算机性能的提高和价格的降低，微型计算机在通信领域中的应用日益增多，它不仅可以作为智能终端同其他计算机进行数据通信，而且微型计算机本身也可以带有若干其他的终端（如CRT显示器终端、打印机终端等），以及在微型计算机和微型计算机之间进行数据通信。

    +   - 基本的通信方式有两种：并行通信和串行通信。并行通信是多位数据同时传送，传送速度快，但需要较多的传输线，通信成本高，适用于近距离的传送。串行通信是数据逐位顺序传送，从单纯传送数据的角度来说只需2～3根线，因而可以大大节省传输线。距离越长，这个优点越突出。虽然串行通信的速度比并行通信慢，但是系统构成的成本低，因此长距离的数据传输都采用串行通信方式。微型计算机内部则是并行数据，因此，在微型计算机系统中，从并行数据到串行数据（或者相反）需要有一定的接口进行转换，而且还需要制定一定的数据格式和规程。'
  - '[PAGE 354]


    # 6.1 串行通信概述


    +   - 6.1.1 数字通信系统模型

    +   - 在数字通信中，首先要解决的问题是数字中的1和0如何表示与传送。有两种常用方法，即基带传输和频带传输。'
  - '[PAGE 355]


    # 1. 数字信号的基带传输系统模型


    +   - 从数据终端或计算机设备送出的原始数据信号一般包含很低的频率成分，甚至是含有直流分量。这些频率分量的范围就是电信号的基本频带，简称基带。换句话说，当终端设备把数据信息转换为适合传送的电信号时，这个电信号所固有的频带就是基带。相应地，这种原始的电信号就是基带信号。在计算机进行串行数据通信中，计算机或数据设备产生的0和1电信号脉冲序列就是基带信号，或称数据基带信号。


    +   - 在某种场合的通信中，基带信号不需要调制而直接在某些传输介质中传送。这种直接传输基带信号的系统称为基带系统。基带系统是数据通信系统中的重要组成部分。基带传输是数据通信系统中最基本的传输方式。'
  - '[PAGE 356]


    # 数字信号的基带传输系统框图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_356_0.png)


    图 6.1.1 数字信号的基带传输系统框图'
  - '[PAGE 357]


    # 2. 数字信号的频带传输系统模型


    +   - 基带传输方式适用于近距离传输数字信号。为进行远距离传输数字信号，可以利用已经广泛建立的双绞线、同轴电缆和光纤等有线信道，也可以利用空间电磁波传播的无线信道构成的通信网。然而，这些线路除光缆外绝大多数是为传输模拟信号而设计的，不能直接用来传输离散的数字基带信号。

    +   - 为了在模拟信道上间接地传输数字信号，必须对数字基带信号进行某种变换，使变换后的信号频谱落在信道频带之内，以适应于在模拟信道上传输，即实现数字基带信号的频带传输。

    +   - 字信号的频带传输是借助与高频载波实现的。高频载波是频率和幅值固定的周期信号，通常选用正弦信号。用数字信号控制载波的一个参数的变化，就可以实现数字信号变换成频带信号，这种变换就是调制。高频载波信号称为被调信号。数字信号称为调制信号。经过调制后的信号称为已调信号。已调信号经信道传输到接收端，在接收端通过反变换，将已调信号恢复成数字信号，这一反变换过程称为解调。具有调制和解调两种功能的装置称为调制解调器（Modem）。'
  - '[PAGE 358]


    # 数字信号的频带传输系统框图


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_358_0.png)


    图 6.1.2 数字信号的频带传输系统框图'
  - '[PAGE 359]


    +   - 按调制方式，Modem可分三类：调幅、调频和调相。其中，调频方式是常用的一种调制方式。调频时，数字信号1与0被调制成易于鉴别的两个不同频率的模拟信号。这种形式的调制称为频移键控FSK（Frequency
    Shift Keying），其原理如图6.1.3所示。

    +   - 两个不同频率的模拟信号分别由电子开关控制，在运算放大器的输入端相加，而电子开关由需要传输的数字信号来控制。当信号为1时，控制开关1导通，送出一串频率较高的模拟信号；当信号为0时，控制开关2导通，送出一串频率较低的模拟信号。于是在运算放大器的输出端，就得到了已调制的信号。'
  - '[PAGE 360]


    # 频移键控法调制原理图


    图 6.1.3 频移键控法调制原理图'
