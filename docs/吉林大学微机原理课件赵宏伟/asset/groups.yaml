    图 1.2.8 TSS 的格式


    - 任务寄存器TR中的32位基址值标识任务状态段在内存中的起始物理地址，20位界限值定义段的大小。

    - 虽然任务状态段TSS描述符和其他任何描述符一样，包含了任务状态段TSS的位置、大小和优先级别。但它们之间的区别在于TSS描述符所描述的TSS段不包含数据和代码，它包含了任务状态和任务间的关联信息，以使任务可以被嵌套（第一个任务可以调用第二个任务，而第二个任务又可以调用第三个任务，依此类推）。

    - TSS描述符由任务寄存器TR寻址。TR的内容由装任务寄存器指令LTR和存任务寄存器指令STR进行装入和保存。TR的内容也可由保护模式下运行程序中的远转移JMP或远调用CALL指令来改变。

    - LTR指令通常用于系统初始化过程中装入第一个任务的选择符。在初始化之后，远调用CALL或远转移JMP指令通常对任务进行切换。


    ## 1.2.7 段选择符及寄存器


    - 在实模式下，段寄存器的16位值是基地址。而在保护模式下，为了加快对存储器的访问，每个段寄存器都有一个程序员不可见的段描述符高速缓冲寄存器与之对应。这样，每一个段寄存器就由两部分组成，一部分为16位的可见部分，另一部分为64位的不可见部分（或称段描述符高速缓冲寄存器）。

    - 对段寄存器的可见部分来说，可用传送指令MOV装入，而不可见部分则只能由处理机装入，用户是不能也不可能进行干预和操作的。段寄存器的可见部分装入的是16位的段选择符。段选择符用于识别（选择）在全局描述符表GDT或局部描述符表LDT内被逐一登记的段描述符。在8字节段描述符中包含有定义段所用的32位的基地址、20位的段界限、12位的属性（其中包括段类型、访问控制以及其他一些信息）。


    ## 1. 段选择符


    - 选择符分为3个字段：13位索引字段INDEX，1位描述符表选择字段TI和2位的请求特权级字段RPL。

    - （1）描述符表选择字段TI

    - 段选择符中的D2位（TI）是描述符表选择字段，这个字段用来说明使用的是全局描述符表GDT，还是局部描述符表LDT。当TI=0时，选择的是全局描述符表GDT。当TI=1时，选择的是局部描述符表LDT。

    - （2）索引字段INDEX

    - 段选择符中的D15～D3位是索引字段，共13位，这就意味着，利用索引字段可以从拥有2^13=8192个段描述符的描述符表中选出任何一个段描述符来。索引值乘以8就是相对于GDT或LDT首址的偏移量，处理机用这个偏移量再加上描述符表的基地址（来自全局描述符表寄存器GDTR，或者局部描述符表寄存器LDTR）就是段描述符在描述符表中的地址。

    - （3）请求特权级字段RPL

    - 段选择符中的D1、D0位是请求特权级字段。RPL字段占有2位，故有4个特权级，00、01、10、11，称作0级、1级、2级、3级。0级的特权最高，1级次之，3级的特权最低。


    ## 2. 段选择符装入段寄存器的操作


    - 段选择符装入段寄存器的操作是通过应用程序中的指令完成的。装段寄存器的指令有2类，即直接的装段寄存器指令和隐含的装段寄存器指令。

    - （1）直接的装段寄存器指令：可使用传送指令MOV、弹出堆栈指令POP、加载段寄存器指令LDS、LSS、LGS、LFS。这些指令都是显式地访问段寄存器。

    - （2）隐含的装段寄存器指令：可使用调用一个过程指令CALL、远转移指令JMP。这种指令更改代码段寄存器CS的内容。

    - 由于绝大多数指令都要涉及段，所以段选择符总是被装在段寄存器内备用。


    ## 1.3 保护模式下的访问操作与保护机制


    - 1.3.1 保护机制的分类

    - 1. 任务间存储空间的保护

    - 任务间的保护是通过每一个任务所专用的LDT描述符实现的。根据LDT描述符，每个任务都有它特定的虚拟空间，因而避免各任务之间的干扰，起到隔离、保护的作用。

    - 2. 段属性和界限的保护

    - 当段寄存器进行加载时，需要进行段存在性检查（属性字节的P位）以及段限检查。

    - 在段描述符中给出了20位的段界限值，每当产生一个逻辑地址时，都要比较偏移量和段限值。一旦偏移地址大于段限值，CPU就终止执行命令，并发出越限异常。由此限制每个程序段只在自己的程序、数据段内运行，不相互干扰。

    - 最后，还要对该段的读写权限进行检查。

    - 3. 特权级与特权级保护

    - 特权级与特权保护是为了支持多用户多任务操作系统，使系统程序和用户的任务程序之间、各任务程序之间互不干扰而采取的保护措施。Pentium微处理器系统提供了一个4级特权管理系统，也就是4级保护系统，如图1.3.1所示。这样可为不同程序规定一个权限，控制特权指令和I/O指令的使用，控制对段和段描述符的访问，从而有效地防止不同程序执行时的相互干扰或非法访问、非法改写GDT和LDT。

