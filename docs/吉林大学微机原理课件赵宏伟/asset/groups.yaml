    ## 2.4.3 8237A的工作时序


    - 8237A的工作时序有正常时序、压缩时序和扩展写时序。对应各种工作时序有两类工作周期：空闲周期和操作周期。操作周期也叫有效周期。全部工作周期分为7种时钟状态（时钟周期）：空闲状态SI、起始状态S0、传送状态S1、S2、S3、S4以及等待状态SW。


    ### 1. 工作周期


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_110_0.png)


    图 2.4.3 8237A 工作时序 7 种状态


    ### 2. 正常时序


    - 8237A DMA控制器可选择正常时序、压缩时序和扩展写时序等操作时序。不同操作时序的实质是在控制读、写脉冲发出的时间与时钟信号CLK的对应关系。

    - 正常时序传送一个字节数据包含4个时钟脉冲周期，即S1-S4状态。产生的读写脉冲信号与这4个状态有确定的对应关系。若是数据块传送中不改变高8位地址，则省去S1，只占用S2、S3、S4三个时钟周期。


    ### 3. 压缩时序


    压缩时序方式所占用的脉冲数将减少。压缩时序操作把读命令的宽度压缩到等于写命令的宽度，省掉了S3，即由S4完成读和写的操作。所以，在压缩时序方式下传送一个字节数据需要占用3个时钟周期，即S1、S2、S4，而在大多数情况下高8位地址并不改变，于是省掉了S1，因此，在数据块传送中大多数情况占用2个时钟周期，即S2和S4。此时用S2状态修改低8位地址值，用S4状态完成读和写的操作，也就是把正常时序中S3和S4两个状态的功能压缩在一个状态中完成。由于压缩时序传送类型只用2个状态完成一个数据字节的传送，因此它具有更高的数据传送速率。


    ### 4. 扩展写时序


    - 在正常时序操作下，可选择扩展写方式，即写命令提前到读命令，从S3状态开始（一般情况下，读为S3、S4状态，写为S4一个状态）。也就是说，写命令同读命令一样，扩展为2个时钟周期。


    ## 2.4.4 8237A的编程


    - 8237A依靠它的可编程特性实现它的各种工作方式的选择和设定。8237A在HLDA信号处于无效的任何时间里，即使HRQ有效，也可以接受CPU对它的编程。CPU对8237A的编程初始化工作是通过8237A的端口进行的。

    - 8237A的端口是用A3A2A1A0低4位地址线编址的，共有16个端口地址，其具体编址情况如表2.4.1所示。假设我们以DMA代表16个端口地址的首地址，那么写通道2基字节数计数器的端口地址可表示为DMA+05H，写方式寄存器的端口地址可表示为DMA+0BH。


    ### 16个端口地址分为两部分


    （1）00H-07H分配给4个通道的相应的16位寄存器，它们的端口地址分配如下：


    基和当前地址寄存器端口  基和当前字节数计数器端口


    - 通道0    DMA+0    DMA+1

    - 通道1    DMA+2    DMA+3

    - 通道2    DMA+4    DMA+5

    - 通道3    DMA+6    DMA+7


    由于这几个寄存器都是16位，而8237A只有8位数据线，因此，读/写操作均分两次进行（使用两条I/O指令）。每次读/写前应先用软件命令清除字节指针触发器（即先/后触发器），然后，以先低字节后高字节的顺序进行读/写操作。


    （2）08H-0FH分配给其他寄存器，其中包括3条不使用数据总线而只利用端口地址进行操作的清除命令。


    - 8237A的初始化编程命令字总共有8个，其中控制命令有5个：方式字、命令字、请求字、屏蔽字、状态字；清除命令有3个：清先/后触发器软件命令、复位软件命令、清屏蔽寄存器软件命令。


    ### 1. 控制命令字


    - 方式字写入端口地址0BH，其主要功能是：选择传送方式和传送类型，设置自动初始化方式和地址增量方向。

    - 命令字写入端口地址08H，其主要功能是：选择DREQ、DACK有效极性，读写时序，优先级编码方式等。

    - 请求字写入端口地址09H，其主要功能是：发生软件DMA请求。

    - 屏蔽字写入端口地址0AH或0FH，其主要功能是：允许或禁止通道的DMA请求。

    - 状态字从端口地址08H读出，其主要功能是：反映通道DMA请求状态和是否有TC信号。


    ### 方式字


    | D7 D6 | D5 | D4 | D3 D2 | D1 D0 |

    |---|---|---|---|---|

    | 传送方式 | 地址增减 | 自动初始化 | 传送类型 | 通道选择 |

    | 00 请求方式<br>01 单字节方式<br>10 数据块方式<br>11 级联方式 | 0=递增<br>1=递减 | 0=禁止<br>1=允许 | 00
    DMA 校验<br>01 DMA 写<br>10 DMA 读<br>11 无效 | 00 通道 0<br>01 通道 1<br>10 通道 2<br>11
    通道 3 |


    ### 命令字


    | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |

    |---|---|---|---|---|---|---|---|

    | DACK 极性 | DREQ 极性 | 写入选择 | 优先级编码 | 读写时序 | 工作允许 | 通道 0 保持 | 存储器传送 |

    | 0 = 低电平有效<br>1 = 高电平有效 | 0 = 高电平有效<br>1 = 低电平有效 | 0 = 滞后写入 (先读后写)<br>1 = 扩展写入
    (同时读写) | 0 = 固定<br>1 = 循环 | 0 = 正常<br>1 = 压缩 | 0 = 允许<br>1 = 禁止 | 0 = 禁止<br>1
    = 允许 | 0 = 禁止<br>1 = 允许 |


    ### 请求字


    ![](img/99c6f63905a40bae1a2423b4a3d2910c_120_0.png)


    ### 一位屏蔽字


    | D7 D6 D5 D4 D3 | D2 | D1 D0 |

    |---|---|---|

    | 不用 | 屏蔽 | 通道选择 |

    | 0=允许<br>1=禁止 DMA | 00 通道 0<br>01 通道 1<br>10 通道 2<br>11 通道 3 |


    ### 状态字


    | D7 | D6 | D5 | D4 | D3 | D2 | D1 | D0 |

    |---|---|---|---|---|---|---|---|

    | 通道 3 | 通道 2 | 通道 1 | 通道 0 | 通道 3 | 通道 2 | 通道 1 | 通道 0 |


    0 = 无 DMA 请求<br>1 = 有尚未处理的 DMA 请求


    0 = 未结束<br>1 = 已接收到终止结束信号


    ### 2. 清除命令


    - 清除命令有3条。这三条命令与数值无关，不需通过数据总线，即执行输出指令时，AL的内容可随便设置，只要对特定的端口地址执行一次写操作，依靠这个地址和控制信号，命令就生效。这就是所谓的“软件命令”。

    - （1）清先/后触发器软件命令（写入端口地址0CH）

    - 即清除字节指针命令，是专为16位寄存器的读/写而设置的。因为数据线是8位，所以16位数据要分两次读/写。而且要使用同一个端口地址。为区分两个高低字节，8237A设置了先/后触发器作为字节指针，为0时对应低字节，为1时对应高字节。而且每次对16位寄存器的读/写操作，都将使字节指针自动翻转一次：由0变1，或由1变0，从而控制高、低字节的读/写。系统复位后，先/后触发器被清0。

    - 清先/后触发器软件命令使字节指针（先/后触发器）被清0。

    - （2）复位软件命令（写入端口地址0DH）

    - 此命令与硬件的RESET信号功能相同，是软件复位命令，除了使屏蔽寄存器各位置1外，其它各寄存器均被清0，使8237A进入空闲状态，准备接收CPU对它的初始化编程，此时8237A处于从态方式。

    - （3）清屏蔽寄存器软件命令（写入端口地址0EH）

    - 其功能是将4个通道的屏蔽位清除，允许它们接受DMA请求。该命令是对屏蔽寄存器操作的第三个命令。


    ### 例2.4.1 8237A数据块传送


    - 设在某8088系统中，用8237A通道1将内存1000H单元开始的24K字节数据转存到软盘之中（暂不考虑20位地址的问题，可认为1000H就是基地址的初值）。采用数据块方式传送，地址增量方式，只传送一遍，设DREQ和DACK低电平有效，当A15-A4=0000
    0000 0111时选中8237A，要求设计8237A通道1的初始化程序。


    - 1. 端口地址

    - A3-A0由8237A芯片内部译码，编码范围是从0000到1111，再与A15-A4组合，则端口地址范围是0070H-007FH。

    - 2. 传送字节数

    - 24K字节对应16进制数为6000H，但写入通道字节数计数器的值应为6000H-1=5FFFH，因为TC的产生不是在计数器由1到0的跳变处，而是在计数器由0到FFFFH的跳变处。所以写入的计数初值应比实际字节数少一个。

    - 3. 方式字

    - 按题目要求，方式字的组合为：1000 1001B

    - 4. 一位屏蔽字

    - 按题目要求，一位屏蔽字的组合为：0000 0001B

    - 5. 命令字

    - 按题目要求，命令字的组合为：0100 0000B

