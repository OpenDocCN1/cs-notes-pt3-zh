    # # 2. 光栅扫描


    +   - 电子束首先出现在屏幕的左上角，再扫至右上角，这样在屏幕上就留下一条线。这条线就称为光栅线，当电子束到达屏幕右边后，它又以极高的速度重新定位到屏幕左边，这样在第一条轨迹的下面又出现一条线，叫水平回扫。

    +   - 从这点开始经水平扫描又在屏幕上产生了第二条显示线。这个扫描过程一直持续到水平扫描到达屏幕底部，此时一帧画面扫描完毕。

    +   - 最后，电子束又以极高的速度回扫到屏幕左上角，称为垂直回扫。

    +   - 在水平回扫和垂直回扫的过程中，要对电子束进行抑制（消隐），使回扫线不在屏幕上显示出来。

    +   - 于是在屏幕上就出现了一条条水平的光栅扫描线。'
  - '[PAGE 534]


    # 8.3.2 液晶显示器


    +   - 液晶显示器从结构上说，属于平板显示器件，简称LCD（Liquid Crystal Display）显示器。

    +   - 1. 液晶及其分类

    +   - LCD显示器的基础材料是液晶。从字面看，液晶就是“液态”的“晶体”，可见，它既具有液体的“流动性”，又具有晶体的“光学各向异性”。奥地利生物学家F.Reinitzer在1888年首先观察到液晶现象，经过进一步确认后，将这种“兼有液体流动性和晶体光学各向异性的液体”，建议称之为“液晶”。可见，液晶是一种介于固态和液态之间的物质，是具有规则性分子排列的有机化合物，如果把它加热会呈现透明状的液体状态，把它冷却则会出现结晶颗粒的混浊固体状态。液晶态物质既具有液体的流动性和连续性，又保留了晶体的有序排列性，物理上呈现各向异性。'
