    | 1 | 0 | 1 | 0 | 数据总线←8251A状态 |

    | 1 | 1 | 0 | 0 | 8251A控制字→数据总线 |

    | × | 1 | 1 | 0 | 高阻 |

    | × | × | × | 1 | 高阻 |

