    - 很明显，RS-232-C是用正负电压来表示逻辑状态，与TTL以高低电平表示逻辑状态的规定不同。因此，为了能够同计算机接口或终端的TTL器件连接，必须在RS-232-C与TTL电路之间进行电平和逻辑关系的变换，实现这种变换的方法可用集成电路芯片MC1488和MC1489来完成，如图6.2.3所示。当连接电缆线长度不超过15m时，允许数据传输速率不超过20kbps。

