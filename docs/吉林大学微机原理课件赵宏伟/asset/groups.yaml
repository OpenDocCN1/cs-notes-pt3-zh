    \ PC总线标准。\n- 与扩展槽相连的62根线组成IBM PC/XT系统总线。62根总线中包括8位双向数据总线、20位地址总线、6根中断请求信号线、3组DMA通道控制线、存储器和I/O读写控制线、存储器刷新控制和时钟信号线、通道检验线、四种电源线以及地线。这些引线均接在62插脚的插座上，双列插脚分别为A1-A31（A面）和B1-B31（B面）。插座的引脚间距为100mil（密尔）。\n\
    \n## 4.3 ISA总线\n\n- ISA（Industry Standard Architecture：工业标准总线）总线是PC机中最基本的总线，是在8位的PC机总线的基础上扩展而成的16位的总线体系结构，其数据宽度为16位，地址宽度为24位，工作频率为8MHz，最大数据传输率为5MB/s。它适用于对速度需求不太高的板卡和外设，如串行口、并行口、声卡等。在PC机中，ISA总线插槽是由两组插座组成，其中长的一组用于插8位的与ISA相兼容的板卡。ISA插槽通常为黑色。\n\
    - ISA总线是在PC/XT总线基础上增加了1个36线插座形成的。实际上，与PC/XT总线相比，ISA总线不仅增加了数据线宽度和寻址空间，还加强了中断处理（新增了7个中断级别）和DMA（新增了3个DMA）传输能力，并且具备了一定的多主功能。故ISA（AT）总线特别适合于控制外设和进行数据通信的功能模块。\n\
    \n## 4.4 PCI总线\n\n- 随着微型计算机技术的广泛应用和不断发展，无论是办公自动化还是工业应用，对微型计算机性能的要求都越来越高。在CPU从80286发展到386、486及目前的Pentium水平的情况下，其数据宽度及工作频率也在不断提高。\n\
    - 可是，传统的ISA总线、EISA总线及VESA总线严重地限制了新型芯片水平的发挥和利用，这就促使微型计算机总线技术也要日趋完善，不断推出新标准。而PCI局部总线既符合当今的技术要求，又能满足未来的需要，是一种较好的局部总线标准。\n\
    - PCI高性能、高效率、与现有标准强大的兼容性和充裕的开发潜力，是其他总线所不及的，因而成为开发当今和未来微型计算机的重要基础。\n\n### 4.4.1\
    \ PCI总线的特点\n\n- 1. 高性能\n- 2. 突发传输模式\n- 3. 不受微处理器限制\n- 4. 采用总线主控和同步操作\n- 5. 减少存取延迟\n\
    - 6. 适用于各种机型\n- 7. 兼容性强\n- 8. 低成本、高效益\n\nPCI的芯片采用超大规模集成电路，节省布线空间，为微机的小型化和多功能化提供了良好的条件。PCI部件采用地址/数据线复用，使PCI部件连接其他部件的引脚数减至50以下。PCI总线引脚线的每2个信号之间都安排了一个地线，以减少信号间的相互干扰以及音频信号的散射问题。PCI到ISA/EISA的转换由芯片厂提供，减少了用户的开发成本。\n\
    \n## PCI总线主要性能指标\n\n- （1）PCI总线时钟频率为33.3MHz或66.6MHz（可达133MHz及更高）。\n- （2）总线数据宽度32位或64位。\n\
    - （3）传输速率为133MB/s（32位）或266MB/s（64位）。\n- （4）支持64位寻址。\n- （5）适应于5V和3.3V两种电源环境。\n\n\
    ### 4.4.2 PCI总线的系统结构\n\n- PCI总线是一种位于微处理器总线与系统总线之间的一种夹层总线。这就意味着PCI总线的控制器（或称桥、桥接器）位于CPU和系统总线之间。也就是说，任何一种CPU都可以使用PCI总线。对总线连线进行标准化处理，可以使CPU总线免受各种约束。扩展总线桥(或称标准总线桥)的设置是为了能在PCI总线上接出一条系统总线，如ISA、EISA等总线，从而可继续使用现有的I/O设备，以增加PCI总线的兼容性和选择范围。\n\
    - 桥也叫桥连器，是一个总线转换部件，其功能是连接两条计算机总线，使总线间相互通讯。它可以把一条总线的地址空间映射到另一条总线的地址空间，可以使系统中每一台总线主设备（Master）能看到同样的一份地址表。\n\
    - 在PCI规范中，提出了三种桥的设计：\n  - （1）主桥，就是CPU至PCI的桥。\n  - （2）标准总线桥，即PCI至标准总线如ISA、EISA、微通道之间的桥。例如INTEL设计的SATUNG芯片组具有ISA标准总线桥路，而为奔腾设计的MERCURY芯片组可选择ISA标准总线桥路，也可选择EISA标准总线桥路。\n\
    \  - （3）PCI桥，在PCI与PCI之间的桥。\n\n## PCI总线示意图\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_245_0.png)\n\
    \n图 4.4.1 PCI 总线示意图\n\n### 4.4.3 PCI总线信号\n\n- PCI标准规定了三种适配卡配置，分别对应不同的电源要求：为传统5V系统规定的5V标准、为3.3V供电的移动系统规定的3.3V标准以及为采用两种电源工作的通用标准。\n\
    - 对于5V PCI标准连接器而言，如果PCI适配卡仅支持32位操作，则只用到管脚B1/A1到B62/A62，管脚B63/A63到B94/A94只用于64位PCI适配卡。\n\
    - PCI局部总线的信号线共有100根，在一个PCI应用系统中，有主设备和从设备。从设备至少需要47根信号线，主设备则需要49根信号线。利用这些信号线可以处理数据、地址，实现接口控制、仲裁及系统功能。下面按功能分组说明5V\
    \ PCI标准连接器的引脚意义。\n\n## 4.5 STD总线\n\n- STD总线（Standard bus）是美国PROLOG公司于1978年宣布的一种工业标准微机总线，它是一种56线的小底板总线。实践证明，STD总线是最可靠的工业标准总线。\n\
    - 1. STD总线的特点\n- （1）高可靠性\n- （2）小板结构，开放式组态\n- （3）兼容式的总线结构\n- （4）产品配套、功能齐全\n- STD总线产品拥有各种工业控制所需的功能模板。如键盘接口、高分辨率图形板、光电隔离脉冲计数板、多路A/D转换板、光隔开关量输入输出板、串行通讯板、调制解调器板等。可与现场的各种机动设备直接连接，如驱动步进电机、交直流电机等。\n\
    \n### 4.5.2 STD总线规范\n\n- STD总线连接器和引出脚可装在一块母板上，该母板允许任何一种模板插在某一插槽上，构成不同的工业控制机。STD的母板用来沟通各模板的数据线、地址线等信息，母板会产生时间延迟和地线环路，也容易造成线间阻抗不匹配，增大并行信号的串扰噪声。为此，STD总线设计了一种高性能母板，一般采用4层印刷板结构，将电源线和地线做在中间两层，使原来信号线的特性阻抗降为60Ω，接近总线驱动阻抗。\n\
    - STD总线接口缓冲模块靠近STD总线母板，I/O接口靠近用户联接器，功能模块在中间。对于没有用户联接器的模板，如CPU板、存储器板等，I/O模块这部分也用作功能模块。\n\
    - STD总线规范对模板的尺寸、总线连接器和插脚分配、信号定义和电气标准等都做了规定。下面介绍STD总线引脚的分配和电气标准。\n\n## （1）总线引脚分配\n\
    \n- STD总线一共有56根，可分为5个功能组：\n- 逻辑电源线 6根，引脚1～6；\n- 数据总线 8根，引脚7～14；\n- 地址总线 16根，引脚15～30；\n\
    - 控制总线 22根，引脚31～52；\n- 辅助电源线 4根，引脚53～56。\n\n## （2）电气规范\n\n- 逻辑信号特性：STD总线被设计为同工业标准TTL或高速CMOS逻辑电平相兼容。TTL总线模板的VOH和VIH的最小值分别不能低于2.4V和2.0V，VOL和VIL的最大值分别不能高于0.5V和0.8V。\n\
    - CMOS总线模板的VOH和VIH的最小值分别不能低于3.76V和3.85V，VOL和VIL的最大值分别不能高于0.37V和0.9V。\n- 总线驱动和负载特性：在模板上每个总线信号只能有一个负载，总线驱动必须满足IOL=24mA（TTL总线模板）或IOL=6mA（CMOS模板）电流吸收器的要求。\n\
    - 最大额定电压：为+Vcc=+0.5V。超过此值就会损坏板上的元件。\n\n## 4.6 主要外设总线介绍\n\n- 系统开发时，经常要与外部总线打交道，外部总线常常以专用的接插件形式提供给用户使用，有时也称（总线）接口标准。本节对常用的USB总线、IDE总线、SCSI总线、IEEE\
    \ 1394总线、ATA总线、AGP总线、IEEE-488总线、CAN总线、Centronic总线等进行简要介绍。\n\n### 4.6.1 USB总线\n\
    \n- USB（Universal Serial Bus）通用串行总线是外部设备通用的接口标准，由Compaq、HP、Intel、Lucent、Microsoft、NEC和Philips七家公司联合推出。USB总线是一种连接外围设备的机外总线，最多可连接127个设备，为微机系统扩充和配置外部设备提供了方便。\n\
    - USB 1.0标准发布于1996年，但直到1998年USB 1.1标准的颁布和支持USB功能的Windows 98的推出，USB才真正得到广泛应用。USB\
    \ 1.0和USB 1.1标准的最大数据传输速率是12Mb/s，2000年公布了USB 2.0标准，将最大数据传输速率提高了40倍，达到480Mb/s。\n"
