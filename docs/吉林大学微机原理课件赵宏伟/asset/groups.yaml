    # （1）等待方式


    +   - 等待方式又称定时采样方式，或无条件传送方式，这种方式是在向A/D转换器发出启动指令（脉冲）后，进行软件延时（等待），此延时时间取决于A/D转换器完成A/D转换所需要的时间（如ADC
    0809在640KHz时为100μs），经过延时后才可读入A/D转换数据。

