    （8）类型 TYPE 字段


    段描述符的第5字节的低4位是类型 TYPE 字段。类型 TYPE 字段在不同的段描述符中有不同的格式。


    1）数据段或堆栈段描述符中的类型 TYPE 字段。数据段或堆栈段描述符中的类型 TYPE 字段的格式如表1.2.2所示。


    ① E可执行位。当E=0时，是数据段或堆栈段。


    ② ED扩展方向位。


    当ED=0时，向上扩展（地址增加方向），通常用于数据段。它指明段的地址范围是从基地址向高位地址方向扩展，可以一直扩展到该数据段的上界，上界的界限值是最大值。在数据段内，段界限字段规定了该数据段的上界，使用时，段的偏移量值必须小于等于界限值。


    当ED=1时，向下扩展（地址减小方向），通常用于堆栈段。它指明从段的最大偏移量处向低位地址方向扩展，可以一直扩展到该堆栈段的下界，下界的界限值是最小值。在向下扩展的堆栈段内，段界限字段规定了该堆栈段的下界，使用时，偏移量的值必须大于界限。在80X86系统中，堆栈向小地址方向生成，堆栈底部的地址最大，随着压入堆栈的数据增多，栈顶的地址越来越小，这就是“向下扩展”的含义。为此，要规定一个界限，使栈顶的偏移量不能小于这个值。


    ③ W可写位。当W=0时，不允许写入。当W=1时，允许写入。


    ④ A访问位。当A=0时，该段尚未被访问。当A=1时，该段已被访问。


