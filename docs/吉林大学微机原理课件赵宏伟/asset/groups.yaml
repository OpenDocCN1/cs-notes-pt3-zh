    ## 方式4（软件触发选通方式）


    - （1）结果特点

    - 计数器减为0时，输出一个时钟周期的负脉冲。

    - （2）过程特点

    - 1）控制字写入： OUT输出高电平（OUT=1）。

    - 2）计数值写入： OUT输出高电平（OUT=1）。

    - 3）启动方式：写入计数値。写入计数値后，再过一个CLK时钟周期，减1计数器获得计数初值，开始减1计数。

    - 4）计数期间： OUT输出高电平（OUT=1）。

    - 5）计数为0时：计数器减到0后，输出一个负脉冲，宽度为1个时钟周期。然后又自动变为高电平，并一直维持高电平。通常将此负脉冲作为选通信号。

    - 6）计数期间写入新的计数値：立即有效。写入新计数値后，在下一个时钟周期时，新计数値被装入减1计数器，开始以新的计数値计数。如果写入的计数値是2个字节，那么写入第一个字节时，计数不受影响，写入第二个字节时的下一个CLK时钟脉冲使计数初值寄存器的新值装入减1计数器，并以新的计数値开始重新计数。

    - 7）GATE作用：GATE=0时禁止计数；GATE=1时允许计数，此时计数器从暂停的地方开始连续计数。GATE信号不影响OUT的状态。

    - 8）计数値有效期限：计数値一次有效。只有在输入新的计数値后，才能开始新的计数过程。


