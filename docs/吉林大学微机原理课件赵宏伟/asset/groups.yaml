    \         ; 拆取 D3~D0 列信号线\nCMP AL, 0FH\nJZ X1               ; 没有任何键按下，继续查询\nCALL\
    \ D20ms          ; 有键按下，延时消抖\n```\n\n```\nMOV   DX, 200H    ; 设置行输出端口地址\nMOV \
    \  AL, 00H\nOUT   DX, AL       ; 行输出 0000，消抖后确定是否有任何键按下\nINC   DX           ;\
    \ 设置列输入端口地址 201H\nIN    AL, DX       ; 输入列线状态\nAND   AL, 0FH      ; 拆取 D3~D0 列信号线\n\
    CMP   AL, 0FH\nJZ    X1           ; 此时，说明延时消抖前的按键判断是源于干扰，\n                  \
    \ ; 或者，延时消抖时间不足，重新查询\n```\n\n```\nX2:\n    MOV     AH, 11111110B    ; 设置行扫描初值，首先扫描第0行\n\
    \    MOV     CX, 4             ; 设置扫描行数计数值，共4行\n    MOV     DX, 200H         \
