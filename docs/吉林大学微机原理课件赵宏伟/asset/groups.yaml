    +   - 2）从片ICW3的功能是用来表明从片8259A的INT引脚是和主片8259A中的哪一个IRx相连接，其格式及各位的具体定义如图3.3.6所示。其中的D7-D3不用，可都取0。D2-D0的值与从片的输出端INT连在主片的哪条中断请求输入引脚有关。比如，某片从片的INT引脚连在主片的IR5引脚上，则此从片的ICW3中的标识码D2-D0应为101。'
