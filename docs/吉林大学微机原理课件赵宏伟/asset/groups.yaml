    在PC/XT微机中使用了一片8253，在PC/AT及以后的系列微机中使用了一片8254（8254兼容8253）。在PC/XT微机中，8253的端口地址设置为40H-43H。\n\
    \n在PC/XT微机中，8253的3个计数器的CLK端接入1.193MHz的时钟信号，周期为838ns。\n\n### 1. 计数器0\n\n- 作用：提供系统电子时钟的时间基准。\n\
    \n计数器0用作系统日历时钟的基本计时电路，它的输出端OUT0连接到8259A的IR0，作为系统的中断源。\n\n计数器0的工作方式初始化为方式3，即方波发生器方式，产生周期的方波信号。计数器0的计数值初始化为0000H，二进制计数方式，这是一个最大的计数值为65536，因此，OUT0输出的方波信号的频率为1.193MHz\
    \ ÷ 65536=18.206Hz。这意味着，计数器0通过8259A的IR0向系统每秒产生18.206次中断请求（即中断周期为54.925ms），这个中断请求用于维护系统的日历时钟。\n\
    \n计数器0的初始化程序：\n\n```asm\nMOV      AL, 36H      ; 控制字\nOUT      43H, AL\nMOV  \
    \    AL, 00H      ; 最大计数值\nOUT      40H, AL      ; 低8位计数值\nOUT      40H, AL  \
    \    ; 高8位计数值\n```\n\n### 2. 计数器1\n\n- 作用：DRAM的刷新定时。\n\nDRAM要求在2ms内对全部128行存储单元完成一次刷新操作。PC机采用分散刷新策略，即每隔一个固定的时间刷新一行，并保证在2ms内刷新所有的128行，这个固定的时间应该不大于2ms\
    \ ÷ 128=15.6μs。\n\n根据这一要求，计数器1的工作方式初始化为方式2，即脉冲频率发生器方式，产生连续的脉冲信号。计数器1的计数值初始化为18，因此，OUT1输出的脉冲信号的周期为18×0.838μs=15.084μs，符合不大于15.6μs的要求。\n\
    \nOUT1输出的脉冲信号连接到一个触发器，由触发器向8237A提出DRAM刷新的DMA请求，DRAM的刷新是在DMA周期中完成的，8253的计数器1只是提供一个产生DRAM刷新DMA请求的定时触发信号。\n\
    \n计数器1的初始化程序：\n\n```asm\nMOV AL, 54H ; 控制字\nOUT 43H, AL\nMOV AL, 18 ; 计数值\nOUT\
    \ 41H, AL\n```\n\n### 3. 计数器2\n\n- 作用：提供驱动机内扬声器的音频信号。\n\n计数器2的输出信号可使扬声器发声，产生伴音或警告音。\n\
    \n计数器2的工作方式初始化为方式3，控制扬声器发出频率为1kHz的声音，为此，计数值初始化为1193。\n\n计数器2的初始化程序：\n\n```asm\n\
    MOV AL, 0B6H ; 控制字\nOUT 43H, AL\nMOV AX, 1193 ; 计数值\nOUT 42H, AL\nMOV AL, AH\n\
    OUT 42H, AL\nIN AL, 61H ; 读8255A的B口（8255A的初始化此前已经完成）\nMOV AH, AL ; 保存\nOR AL,\
    \ 03H ; 使PB0=1，PB1=1\nOUT 61H, AL ; 允许扬声器发声\n……\n……\nMOV AL, AH ; 恢复8255A的B口状态\n\
    OUT 61H, AL\n```\n\n## 例5.2.3 8253应用系统设计\n\n某80×86系统采用8253精确控制一个发光二极管闪亮，系统要求启动8253后使发光二极管点亮2秒，熄灭2秒，亮灭50次后停止闪动，系统工作结束。现有一个时钟脉冲源，频率为2MHz，其他器件任选。试完成下列工作：\n\
    \n- （1）分析该系统接口电路。\n- （2）编写完成上述功能的程序。\n\n### 1. 系统分析\n\n8253与CPU的接线及端口地址译码电路的设计按常规方法进行，这里不再详细讨论，只按接口电路确定地址即可。\n\
    \n系统主要是控制发光二极管的亮灭，亮2秒灭2秒，恰好是一个方波周期，周期为4秒，因此可用8253的方式3。\n\n考虑由两个通道级联来产生最后的方波，其中前一个通道的CLK接2MHz，工作于脉冲频率发生器方式，产生一个脉冲波，假设脉冲波周期为4ms（250Hz），于是它的计数值为4ms\
    \ ÷ 0.5μs = 8000，它的OUT输出接后一个计数器通道的CLK输入，后一个计数器通道工作于方波发生器方式，产生周期为4秒的方波，于是它的计数值为4秒\
    \ ÷ 4ms = 1000。\n\n### 系统的计数器分配\n\n- 计数器0工作于脉冲频率发生器方式，输入CLK0接2MHz脉冲信号源，输出OUT0产生250Hz（周期为4ms）的脉冲序列。\n\
    - 计数器1工作于方波发生器方式，输入CLK1接OUT0的250Hz脉冲信号，输出OUT1产生周期为4秒的方波，经过一个反相驱动器去控制一个发光二极管。\n\
    - 计数器2工作于计数结束中断方式，输入CLK2接OUT1的周期为4秒的方波，输出OUT2通过一个“非门”连GATE1，用于控制计数器1通道的启停。\n\n\
    ### 8253应用系统设计接口电路\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_349_0.png)\n\n\
    图 5.2.9 8253 应用系统设计接口电路\n\n### 2. 计数器0的控制字和计数值\n\n- （1）控制字：00110100B\n- （2）计数值：4ms÷0.5μs=8000\n\
    \n### 3. 计数器1的控制字和计数值\n\n- （1）控制字：01110110B\n- （2）计数值：4s÷4ms=1000\n\n### 4. 计数器2的控制字和计数值\n\
    \n- （1）控制字：10010000B\n- （2）计数值：也就是计满次数50\n\n### 5. 端口地址\n\n本例采用8088微处理器，并假设8253的4个端口地址，由计数器0至控制寄存器依次为80H、81H、82H、83H。\n\
    \n### 6. 工作程序设计\n\n```asm\nMOV    AL, 90H    ; #2 控制字\nOUT    83H, AL\nMOV   \
    \ AL, 50     ; #2 计数值\nOUT    82H, AL\nMOV    AL, 34H    ; #0 控制字\nOUT    83H,\
    \ AL\nMOV    AX, 8000   ; #0 计数值\nOUT    80H, AL\nMOV    AL, AH\nOUT    80H, AL\n\
    MOV    AL, 76H    ; #1 控制字\nOUT    83H, AL\nMOV    AX, 1000   ; #1 计数值\nOUT  \
    \  81H, AL\nMOV    AL, AH\nOUT    81H, AL\n......\n```\n"
