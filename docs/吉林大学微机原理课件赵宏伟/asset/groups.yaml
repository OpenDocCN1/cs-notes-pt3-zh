    ## 1.3.3 任务内的段间转移及其特权级检查


    + - 程序控制转移有2种类型：NEAR类型的段内转移和FAR类型的段间转移。

    + - 段内转移发生在同一个代码段内，段的基址不变，所以不需要重新访问段描述符。转移发生时，只需要进行段限保护检查，即比较偏移量和段限值。

    + - 段间转移发生在不同的代码段之间，不同的代码段，其基址也不同，因此，转移发生时，需要重新访问目标段的段描述符，以便确定目标段的基址。在保护机制方面，除了要进行段限保护检查外，还要进行特权级检查。

    + - 段间转移有2种方法：段间直接控制转移、段间间接控制转移。下面将对这2种方法的实现过程和特权级检查保护进行说明。


    ## 段间转移方法小结


    + - （1）任务内的控制转移可分为同一特权级间的控制转移和不同特权级间的控制转移。

    + - （2）用JMP指令通过代码段描述符，可实现同一特权级间的直接控制转移。

    + - （3）用CALL指令通过代码段描述符，可实现同一特权级间的直接控制转移，通过调用门，可实现同一特权级间或更高特权级的间接控制转移。

    + - （4）用INT指令（包括异常中断和外部中断）通过中断门/陷阱门，可实现同一特权级间或更高特权级的间接控制转移。

    + - （5）将程序控制转移给同一代码段中的另一条指令，只须使用转移或调用指令即可，此时，只需要检查段长界限，以确保转移或调用的目标不会超过当前代码段的边界。


