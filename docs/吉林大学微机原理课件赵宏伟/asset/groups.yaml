    # 1. 计数器0


    +   - 作用：提供系统电子时钟的时间基准。

    +   - 计数器0用作系统日历时钟的基本计时电路，它的输出端OUT0连接到8259A的IR0，作为系统的中断源。

    +   - 计数器0的工作方式初始化为方式3，即方波发生器方式，产生周期的方波信号。计数器0的计数值初始化为0000H，二进制计数方式，这是一个最大的计数值为65536，因此，OUT0输出的方波信号的频率为1.193MHz
    ÷ 65536=18.206Hz。这意味着，计数器0通过8259A的IR0向系统每秒产生18.206次中断请求（即中断周期为54.925ms），这个中断请求用于维护系统的日历时钟。

    +   - 计数器0的初始化程序：


    +   - MOV      AL, 36H      ; 控制字

    +   - OUT      43H, AL

    +   - MOV      AL, 00H      ; 最大计数値

    +   - OUT      40H, AL      ; 低8位计数値

    +   - OUT      40H, AL      ; 高8位计数値'
  - '[PAGE 344]


    # 2. 计数器1


    +   - 作用：DRAM的刷新定时。

    +   - DRAM要求在2ms内对全部128行存储单元完成一次刷新操作。PC机采用分散刷新策略，即每隔一个固定的时间刷新一行，并保证在2ms内刷新所有的128行，这个固定的时间应该不大于2ms
    ÷ 128=15.6μs。

    +   - 根据这一要求，计数器1的工作方式初始化为方式2，即脉冲频率发生器方式，产生连续的脉冲信号。计数器1的计数值初始化为18，因此，OUT1输出的脉冲信号的周期为18×0.838μs=15.084μs，符合不大于15.6μs的要求。

    +   - OUT1输出的脉冲信号连接到一个触发器，由触发器向8237A提出DRAM刷新的DMA请求，DRAM的刷新是在DMA周期中完成的，8253的计数器1只是提供一个产生DRAM刷新DMA请求的定时触发信号。

    +   - 计数器1的初始化程序：

    +   - MOV AL, 54H ; 控制字

    +   - OUT 43H, AL

    +   - MOV AL, 18 ; 计数值

    +   - OUT 41H, AL'
  - '[PAGE 345]


    # 3. 计数器2


    +   - 作用：提供驱动机内扬声器的音频信号。

    +   - 计数器2的输出信号可使扬声器发声，产生伴音或警告音。

    +   - 计数器2的工作方式初始化为方式3，控制扬声器发出频率为1KHz的声音，为此，计数值初始化为1331。

    +   - 计数器2的初始化程序：


    +   - MOV AL, 0B6H ; 控制字

    +   - OUT 43H, AL

    +   - MOV AX, 1331 ; 计数值

    +   - OUT 42H, AL

    +   - MOV AL, AH

    +   - OUT 42H, AL

    +   - IN AL, 61H ; 读8255A的B口（8255A的初始化此前已经完成）

    +   - MOV AH, AL ; 保存

    +   - OR AL, 03H ; 使PB0=1，PB1=1

    +   - OUT 61H, AL ; 允许扬声器发声

    +   - ……

    +   - ……

    +   - MOV AL, AH ; 恢复8255A的B口状态

    +   - OUT 61H, AL'
