    - （2）ICW2命令字。IR7的中断类型码为77H，即可作为ICW2命令字写入，写入奇地址。\n- （3）ICW4命令字。8088 CPU，一般全嵌套方式，正常EOI结束，非缓冲方式，故命令字的组合为00000001B=01H，写入奇地址。\n\
