    - 因此，CPU对8259A编程时，首先要送入初始化命令字。初始化命令字送入8259A时，必须严格按着规定的顺序，因为8259A的内部控制电路，对命令字的识别除了依靠地址信号A0和某些特征位之外，还要根据它先后装入的顺序。ICW1和ICW2是必须设置的，而ICW3和ICW4是由工作方式来选择的。\n\
    \n## 7. 数据总线缓冲器\n\n- 数据总线缓冲器是8位三态双向缓冲器，通常和CPU系统总线中的D7-D0相连接，在读/写逻辑的控制下实现CPU与8259A之间的信息交换。\n\
    - D7-D0：8位数据引脚，在系统中，它们和数据总线相连，从而实现和CPU的数据交换。在较大的系统中，一般使用总线驱动器（即缓冲方式），这时，D7-D0与总线驱动器相连。在小系统中，D7-D0直接与数据总线相连（即非缓冲方式）。\n\
    \n## 8. 读/写逻辑\n\n- 读/写逻辑是根据CPU送来的读/写信号和地址信息，通过数据总线缓冲器有条不紊地完成CPU对8259A的所有写操作和读操作。\n\
    - 读出信号，低电平有效，通知8259A将某个内部寄存器的内容送到数据总线上。\n- 写入信号，低电平有效，通知8259A从数据线上接收数据。这些数据实际上就是CPU往8259A发送的命令字，也就是说，每当8259A接收一个数据，便设置一个命令字。\n\
    - 芯片选通信号，低电平有效，通过地址译码逻辑电路与地址总线相连。\n- A0：指出当前8259A的哪个端口被访问。1片8259A对应两个端口地址，其中一个为偶地址，一个为奇地址，并且要求偶地址较低，奇地址较高。\n\
    \n## 9. 级联控制\n\n- 一片8259A最多构成8级中断（IR7-IR0），要想扩展中断源，必须多片连在一起，叫级联方式。级联控制主要是为实现多片8259A的级联应用而设计的。级联缓冲/比较器的功能有两个，一是提供级联控制，二是提供缓冲控制。\n\
    - 在级联应用中，只有一片8259A为主片，其他均为从片，从片最多不能超过8片。此时各从片8259A的INT将与主片8259A的IRx相连接，而它们的三个级联信号CAS2-CAS0将分别互连起来。此时，主8259A在第一个INTA响应周期内通过CAS2-CAS0送出三位识别码，而和此识别码相符的从8259A将在第二个INTA响应周期内释放中断类型码到数据总线上，使CPU进入相应的中断处理程序。\n\
    \n## 3.3.2 8259A的工作方式\n\n- 8259A是可编程芯片，可以通过程序命令来确定8259A的工作方式。\n- 中断控制器8259A有10种工作方式。\n\
    - 8259A有两种命令，一种是初始化命令，另一种是操作命令，它们用于控制8259A的中断管理。\n\n### 1. 全嵌套方式\n\n这是一种最普通的工作方式。8259A在初始化工作完成后若未设定其它的工作方式，就自动进入全嵌套方式，这种方式的特点是：\n\
    \n- (1) 中断请求的优先级固定，其顺序是IR0最高，依次减小，IR7最低。\n\n- (2) 中断服务寄存器ISR保存优先权电路确定的优先级状态，相应位置“1”，并且一直保持这个服务“记录”状态，直到CPU发出中断结束命令为止。\n\
    \n- (3) 在ISR置位期间，不再响应同级及较低级的中断请求，而高级的中断请求如果CPU开放中断的话仍能够得到中断服务。\n\n- (4) IR7-IR0的中断请求输入可分别由中断屏蔽寄存器IMR的D7-D0的相应位屏蔽与允许，对某一位的屏蔽与允许操作不影响其它位的中断请求操作。\n\
    \n全嵌套工作方式由ICW4的D4=0来确定。\n\n### 2. 循环优先级方式\n\n- 循环优先级方式是8259A管理优先级相同的设备时采用的中断管理方式，它包括两种：自动循环优先级方式和特殊循环优先级方式。\n\
    - （1）自动循环\n  - 各设备优先级相同，当某一个设备受到服务之后，它的优先级就自动地排到最后。所谓各设备优先级相同，是指它们的地位相同，受服务机会均等，但是毕竟各中断源的优先级需要排出一个顺序，否则同时有多个中断源申请中断时计算机无法处理，于是排出这样一个优先级由高到低的顺序。\n\
    - （2）特殊循环\n  - 特殊循环优先级方式与自动循环优先级方式的不同之处在于：在自动循环优先级方式中，某一设备在被服务之后被确定为最低优先权；而在特殊循环优先级方式中，是通过编程来确定某一设备为最低优先级。如IR5被指定为最低优先级，则IR6的优先级最高。\n\
    \n### 3. 特殊屏蔽方式\n\n- 8259A的每个中断请求输入信号都可由中断屏蔽寄存器IMR的相应位进行屏蔽，IMR的D0对应IR0，D1对应IR1，…，D7对应IR7，相应位为“1”则屏蔽中断输入，相应位为“0”则允许中断输入。IMR寄存器由操作命令OCW1进行设置。对中断请求输入信号的屏蔽方式一般有两种：正常屏蔽方式和特殊屏蔽方式。\n\
    \n- 在正常屏蔽方式中，每一个屏蔽位对应一个中断请求输入信号，屏蔽某一个中断请求输入信号对其他请求信号没有影响。未被屏蔽的中断请求输入信号仍然按照设定的优先级顺序进行工作，而且保证当某一级中断请求被响应服务时，同级和低级的中断请求将被禁止，如果CPU允许中断，则高级的中断请求还会被响应，实现中断嵌套。\n\
    \n### 4. 程序查询方式\n\n- 程序查询方式是不使用中断，用软件寻找中断源并为之服务的工作方式。在这种方式下，8259A不向CPU发送INT信号（实际上是8259A的INT信号不连到CPU的INTR信号上），或者CPU关闭自己的中断允许触发器，使IF=0，禁止中断输入。申请中断的优先级不是由8259A提供的中断类型码而是由CPU发出查询命令得到的。\n\
    \n- 查询时，CPU先向8259A发出查询命令，8259A接到查询命令后，就把下一个IN指令（对偶地址端口的读指令）产生的脉冲作为中断响应信号，此时，若有中断请求信号，则在ISR中相应位置“1”，并把该优先级送上数据总线。\n\
    \n### 5. 中断结束方式\n\n- 所谓中断结束方式是指中断如何结束的方法，这里的“结束”不是指中断服务程序的结束，中断服务程序的结束用IRET指令就可完成，这里的“结束”是指如何和何时使8259A中的ISR中的相应位清零。ISR中某位为“1”，表示CPU正在为之服务；某位为“0”表示CPU已经停止（结束）为之服务。而IRET指令主要是恢复程序的断点，它并不能使ISR的相应位清零。\n\
    \n- 8259A的中断结束方式有两种：命令中断结束方式（EOI）和自动中断结束方式（AEOI）。\n"
