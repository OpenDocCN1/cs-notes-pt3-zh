    ## （1）自动结束


    - 在自动中断结束（AEOI）方式下，8259A自动地在最后一个 INT̅A 中断响应脉冲的后沿将中断服务寄存器ISR中的相应位清零。这种方式的过程是：中断请求，CPU响应，发第一个
