    # 第5章  可编程接口芯片及其应用


    随着集成电路技术的发展，接口电路早已集成化，并出现了许多可编程接口芯片。为了具有通用性，这些芯片通常被设计成具有多项功能或多种工作方式，用户在使用时通过编程选择自己所需的的功能或工作方式。


    尽管早期的可编程接口芯片在现代微机中已不再独立出现，但本章在介绍时，还是以它们为讲解对象，因为这些是理解现代微机所用芯片的基础。此外，在单片机等微机应用系统或输入/输出设备中还常常用到它们。本章的主要内容是介绍可编程并行接口芯片8255A、可编程计数器/定时器8253。'
  - '[PAGE 280]


    # 5.1 可编程并行输入/输出接口芯片8255A


    +   - Intel 8255A是一种通用的可程序并行I/O接口芯片，是为Intel 8080/8085系列微处理器设计的，也可用于其他系列的微机系统。'
  - '[PAGE 281]


    # 5.1.1 8255A的内部结构及引脚功能


    +   - 8255A为40引脚、双列直插封装，其引脚及内部结构如图5.1.1所示。由图可看出，8255A的内部结构由数据端口、组控制电路、数据总线缓冲器、读/写控制逻辑四部分组成。

    +   - 1. 数据端口

    +   - 8255A有3个8位数据端口：端口A、端口B和端口C，分别简称为A口、B口和C口。

    +   - 2. 数据总线缓冲器

    +   - 数据总线缓冲器是一个三态8位双向缓冲器，D7-D0同系统数据总线相连。CPU通过执行输入输出指令来实现对缓冲器发送或接收数据。8255A的控制字和状态字也是通过该缓冲器传送的。

    +   - 3. A组和B组的控制电路

    +   - 在8255A内部，3个端口分成两组来管理。A口及C口高4位为A组，B口及C口低4位为B组。两组分别设有控制电路，根据CPU发出的方式选择控制字来控制8255A的工作方式，每个控制组都接收来自读/写控制逻辑的“命令”，接收来自内部数据总线的“控制字”，并向与其相连的端口发出适当的控制信号。

    +   - 4. 读/写控制逻辑

    +   - 读/写控制逻辑用来管理数据信息、控制字和状态字的传送，它接收来自CPU地址总线和控制总线的有关信号，向8255A的A、B两组控制部件发送命令。'
