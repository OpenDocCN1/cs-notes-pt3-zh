    # 例7.4.3 利用AD574进行12位A/D数据采集


    +   - 图7.4.15是AD574与80×86 CPU的单极性接口框图，模拟量信号范围可为10V或20V。CPU通过常规的总线驱动得到三总线信号，通过74LS138译码器进行端口地址的寻址，各端口的地址如表7.4.4所示。引脚接地，表示该芯片在数据输出时，每次输出8位数据。

    +   - AD574的和A0分别接到CPU的A1和A0上，从而用不同的端口地址来实现对AD574的启动转换和数据输出。AD574的工作状态由STS引脚输出，可将STS经三态门电路（比如74LS244）连至数据总线，比如连到D0上，于是可以用查询的方法判断AD574是否转换完成，可否读入数据。'
  md: "\n## 例7.4.1 ADC 0809等待方式接口设计\n\n等待方式下，ADC 0809与微处理器之间的连接如图7.4.10所示。图中译码器的输出作为ADC\
    \ 0809的转换启动地址START（同时通道地址锁存信号ALE有效）和数字量数据输出地址OE，转换结束信号EOC未用，若采集通道IN0的数据，可设计如下程序：\n\
    \n```\nMOV AL, 00H    ; 设置通道号 0\nOUT 84H, AL    ; 启动 0 通道进行 A/D 转换\nCALL DELAY100\
    \  ; 延时 100 μs，等待 A/D 转换结束\nIN  AL, 84H    ; 转换结束，读入 A/D 转换结果\n```\n\n## ADC 0809与微处理器之间的等待方式连接\n\
    \n![](img/99c6f63905a40bae1a2423b4a3d2910c_453_0.png)\n\n图 7.4.10 ADC 0809 与微处理器之间的等待方式连接\n\
    \n## (2) 查询方式\n\n- 所谓程序查询方式，就是先选通模拟量输入通道，发出启动 A/D转换的信号，然后用程序查看 EOC状态，\n- 若 EOC=1，则表示\
    \ A/D转换已结束，可以读入数据；\n- 若 EOC=0，则说明 A/D转换器正在转换过程中，应继续查询，直到 EOC=1为止。\n\n## 例7.4.2\
    \ ADC 0809查询方式接口设计\n\n- ADC 0809与微处理器之间的查询方式连接如图7.4.11所示，利用该接口电路，采用查询方式，对现场8路模拟量输入信号循环采集一次，其数据存入数据缓冲区中。\n\
    \n## ADC 0809与微处理器之间的查询方式连接\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_456_0.png)\n\
    \n图 7.4.11 ADC 0809 与微处理器之间的查询方式连接\n\n## 程序设计\n\n```\nDATA    SEGMENT\nCOUNT \
    \  DB      00H             ; 采样次数\nNUMBER  DB      00H             ; 通道号\nADCBUF\
    \  DB      8 DUP(?)        ; 采样数据缓冲区\nDATA    ENDS\nADCC    EQU     84H      \
    \       ; A/D 控制口地址\nADCS    EQU     88H             ; A/D 状态口地址\nCODE    SEGMENT\n\
    \        ASSUME  CS:CODE, DS:DATA\nSTART:  MOV     AX, DATA\n        MOV     DS,\
    \ AX\n        MOV     BX, OFFSET ADCBUF   ; 设置 A/D 缓冲区\n        MOV     CL, COUNT\
    \           ; 设置采样次数\n        MOV     DL, NUMBER          ; 设置通道号\nX3:     MOV\
    \     AL, DL\n        OUT     ADCC, AL            ; 启动 ADC 0809 相应通道\n```\n\n\
    ## 程序设计\n\n```\nX1:    IN    AL, ADCS      ; 读取状态口\n      TEST  AL, 80H      \
    \ ; 析取 EOC\n      JNZ   X1            ; EOC≠0，ADC 0809 未开始转换，等待\nX2:    IN   \
    \ AL, ADCS      \n      TEST  AL, 80H       \n      JZ    X2            ; EOC≠1，ADC\
    \ 0809 未转换完成，等待\n      IN    AL, ADCC      ; 读数据\n      MOV   [BX], AL      \n\
    \      INC   BX            ; 指向下一个数据缓冲单元\n      INC   DL            ; 指向下一个通道\n\
    \      INC   CL            ; 采样次数加 1\n      CMP   CL, 08H       \n      JNZ  \
    \ X3            \n      MOV   AX, 4C00H     \n      INT   21H           \nCODE\
    \  ENDS                 \nEND    START\n```\n\n## （3）中断方式\n\n- 在前两种方式中，无论CPU暂停与否，实际上对控制过程来说都是处于等待状态，等待A/D转换结束后才读入数据，因此速度慢，为了发挥计算机的效率，有时采用中断方式。在这种方式中，CPU启动A/D转换后，即可转而处理其它事情，比如继续执行主程序的其他任务。一旦A/D转换结束，则由A/D转换器发出转换结束信号，这一信号作为中断请求信号发给CPU，CPU响应中断后，便读入数据。这样，在整个系统中，CPU与A/D转换器是并行工作的，提高了系统的工作效率。\n\
    - 中断方式不需花费等待时间，但若中断后，保护现场、恢复现场等一系列操作过于繁锁，所占用的时间和A/D转换的时间相当，则中断方式就失去了它的优越性。\n\n\
    ## 9.4.5 12位A/D转换器AD574\n\n- AD574型快速12位逐次逼近式A/D转换器是美国AD公司产品，是一种内部由双极型电路组成的28脚双列直插式标准封装的集成A/D转换器，该转换器集成度高，并因其功能完善和性能优异而被广泛采用。\n\
    \n## 1. AD574主要特性\n\n- 12位分辨率，\n- 转换时间25μs（12位）、16μs（8位），\n- 单通道模拟电压输入，无漏码，\n\
    - 采用逐次逼近式原理，\n- 单极性电压输入0～10V、0～20V，\n- 双极性电压输入±5V、±10V，\n- VLOGIC电压+4.5V～+5.5V（+5V），VCC电压+13.5V～+16.5V（+12V，+15V），VEE电压-13.5V～-16.5V（-12V，-15V），参考电压不需外部提供，\n\
    - 芯片内部具有稳定为10.00V±0.1V（max）的参考电压，片内具有输出三态缓冲器，\n- 可与通用的8位或16位微处理器直接接口，低功耗390mW，存放温度-65℃～+150℃。\n\
    \n## 2. AD574内部结构\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_462_0.png)\n\n##\
    \ 3. AD574引脚功能\n\n| CE | CS̅ | R/C̅ | 12/8̅ | A0 | 操作 |\n|---|---|---|---|---|---|\n\
    | 0 | × | × | × | × | 禁止 |\n| × | 1 | × | × | × | 禁止 |\n| 1 | 0 | 0 | × | 0 |\
    \ 12 位转换 |\n| 1 | 0 | 0 | × | 1 | 8 位转换 |\n| 1 | 0 | 1 | 接+5V | × | 输出数据格式为并行\
    \ 12 位 |\n| 1 | 0 | 1 | 接地 | 0 | 输出数据为高 8 位，屏蔽低 4 位 |\n| 1 | 0 | 1 | 接地 | 1 |\
    \ 输出数据为低 4 位，中 4 位输出全为 “0”，屏蔽高 8 位 |\n\n## AD574启动时序\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_464_0.png)\n\
    \n图 7.4.13 AD574 启动时序\n\n## 4. AD574工作方式\n\n- 在转换周期，模拟输入的电流要受DAC的约500KHz试验电流的调制影响，因此要求模拟输入信号源能在动态负载情况下保持稳定的输出电压。\n\
    - 如果信号源达不到此要求，可以加一级宽频带的运算放大器，也可在普通运算放大器的反馈回路中加入三极管或集成缓冲器。\n- AD574有两种工作方式：单极性模拟输入和双极性模拟输入。\n\
    \n## AD574的工作方式--单极性模拟输入\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_466_0.png)\n\
    \n(a) AD574 单极性输入接线图\n\n## AD574的工作方式--双极性模拟输入\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_467_0.png)\n\
    \n(b) AD574 双极性输入接线图\n\n## 例7.4.3 利用AD574进行12位A/D数据采集\n\n- 图7.4.15是AD574与80×86\
    \ CPU的单极性接口框图，模拟量信号范围可为10V或20V。CPU通过常规的总线驱动得到三总线信号，通过74LS138译码器进行端口地址的寻址，各端口的地址如表7.4.4所示。引脚接地，表示该芯片在数据输出时，每次输出8位数据。\n\
    - AD574的和A0分别接到CPU的A1和A0上，从而用不同的端口地址来实现对AD574的启动转换和数据输出。AD574的工作状态由STS引脚输出，可将STS经三态门电路（比如74LS244）连至数据总线，比如连到D0上，于是可以用查询的方法判断AD574是否转换完成，可否读入数据。\n"
