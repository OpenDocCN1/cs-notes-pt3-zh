    # 8.3 视频系统


    +   - 视频系统是计算机系统的重要组成部分，包括显示器和显示适配器（通常被称为显示控制卡、显示卡、显卡）。用户主要是通过键盘和显示器进行人机对话来实现计算机操作，没有显示器用户无法进行工作。显示器能将计算机的输出信息转换成各种直观的图形、图象和字符，程序、数据也能在屏幕上显示出来。它具有速度快、无噪音、无机械磨损、直观形象、方便可靠等优点。由于显示器屏幕上的信息只能供观察，不能永久地记录，所以又称为软拷贝设备。

    +   - 显示器的种类很多，按使用的显示器件不同，主要分为两大类：一类是阴极射线管显示器，简称为CRT显示器；另一类是平板显示器，主要包括发光二极管显示器、LCD液晶显示器和等离子体显示器等。'
  - '[PAGE 531]


    # 8.3.1 CRT显示器


    +   1. CRT显示器的基本组成


    CRT（Cathode Ray Tube）显示器的基本组成主要包括视频放大驱动电路、行扫描电路、场扫描电路、高压电路、CRT显象管以及机内直流电源等六大部分，如图8.3.1所示。


    在图8.3.1中，视频放大驱动电路将主机经显示卡送来的视频信号放大驱动后，送到CRT显象管的阴极，产生电子束轰击屏幕而出现光点。由显示卡送来的水平（行）同步信号与垂直（场）同步信号，分别经行扫描电路和场扫描电路，为CRT显象管的水平（行）偏转线圈和垂直（场）偏转线圈提供具有一定幅度和线性良好的锯齿波电流，产生垂直方向和水平方向的偏转磁场，控制电子束在水平或垂直方向偏转，形成扫描光栅。'
