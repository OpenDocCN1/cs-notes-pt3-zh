    - 4. BOUND中断指令


    ## 3.2.5 异常简介


    - 异常既不是外部硬件产生的，也不是用软件指令产生的，而是在CPU执行一条指令过程中出现的错误或检测到的异常情况自动产生的。除单步（陷阱）中断外，异常中断返回地址指向程序中发生中断的地方，而不是指向产生中断指令的下一条指令。


    ## 1. 类型0除法出错


    - 在执行除法指令后结果溢出或遇到除数为0的情况，则CPU会自动产生类型为0的中断，转入相应的中断处理程序。


    ## 2. 类型1单步（陷阱）


    - 当标志寄存器中的陷阱标志位TF为1时，每执行一条指令后，就进入一次类型1的中断服务程序，此中断服务程序用来显示出一系列寄存器的值，并且告示一些附带的信息。因此，单步中断一般用在调试程序中逐条执行用户程序。

    - Pentium没有直接对TF标志置“1”或置“0”的指令，可以通过修改存放在堆栈中标志的内容或其他间接方法来改变TF之值。


    ## 3. 类型6无效操作码


    - 在程序中遇到未定义的操作码时发生此中断。


    ## 4. 类型7设备不可用


    - 设备不可用故障会在以下两种条件下产生：

    - （1）Pentium微处理器执行了一条ESC（处理机脱离）指令，且控制寄存器CR0中的EM（模拟协处理器）位被置成“1”。

    - （2）Pentium微处理器执行了一条WAIT指令，且控制寄存器CR0中的（监控协处理器位）MP=1，或执行了一条ESC指令，且控制寄存器CR0的TS（任务切换）位被置为“1”。


    ## 5. 类型8双故障


    - 一般情况下，若Pentium微处理器在调用一个异常处理程序时又检测到了一个异常，则对这两个异常可以进行串行处理。但是，如果处理机不能对它们实施串行处理，则它将发出一个双故障异常信息。


    ## 6. 类型10无效任务状态段


    - 试图把任务转换到一个具有无效任务状态段的段内时，就会产生无效任务状态段故障。


    ## 7. 类型11段不存在


    - 当描述符中的P位（P=0）指示段不存在或无效时发生该中断。


    ## 8. 类型12堆栈段超限


    - 如果堆栈段不存在（P=0）或堆栈段超限，则发生该中断。


    ## 9. 类型13一般保护


    在保护模式下，不会引起另一个异常的发生但却违背了保护规则的所有动作都将引起一个一般保护异常。下面列出一些违背保护规则的情况（不是全部）：


    - （1）描述符表边界超出。

    - （2）违反特权规则。

    - （3）在使用代码段CS、数据段DS、附加数据段ES、FS或GS时超出了段界限。

    - （4）对被保护代码段的写操作。

    - （5）从只能执行的代码段读取数据。


    ## 10. 类型14页面出错


    - 访问页面出错的存储器时发生此中断。


    ## 11. 类型16浮点错


    - 浮点错故障是由浮点算术运算指令产生的一种错误信号，只有当控制寄存器CR0中的NE（数值异常事故）位被置成1时，才可能出现浮点错中断。


    ## 12. 类型17对准检查


    - 对准检查故障是在对非对准的操作数进行访问时产生的。例如，一个存储在奇数字节地址上的字以及一个存储在非4的整数倍的地址上的双字等就是非对准的数。


    ## 13. 类型18机器检查


    - 在Pentium～PentiumII微处理器中激活一个系统存储器管理模式中断。


