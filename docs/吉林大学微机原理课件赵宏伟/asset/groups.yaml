    ### 3. 虚实地址转换


    - Pentium微处理机的分段存储管理机制允许将46位虚拟地址映射到硬件所需的32位物理地址。

    - 首先由虚拟地址（也称逻辑地址）段选择符部分的13位索引字段确定段描述符在段表（也称段描述符表）的位置。

    - 然后取出段描述符中的32位基地址并与偏移量相加，得到32位的线性地址。如果不启用分页功能，则线性地址就直接作为物理地址。


