    # 1.5 分页存储管理


    +   - 分页是虚拟存储器多任务操作系统另一种存储器管理方法。段的长度是可变的，而页的长度是固定的，比如每页4KB。

    +   - 分页方法将程序分成若干个大小相同的页，各页与程序的逻辑结构没有直接的关系。分页存储器的这种固定大小页有一个缺点，就是存储管理程序每次分配最少是一个页（即使它们并不全用）。一页中未用的存储器区域称为碎片，碎片导致存储器使用效率降低，但是分页大大简化了存储管理程序的实现。

    +   - Pentium微处理器采用二级页表方法对页面进行管理，第1级页表称作页目录，页目录中的页目录项指明第2级页表中各页表的基址。'
