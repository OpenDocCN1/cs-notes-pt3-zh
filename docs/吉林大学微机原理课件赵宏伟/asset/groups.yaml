    ## 计数值的读出操作


    - 1. 简单读出方式


    一个计数器的现有计数值可以通过读取减1计数器而获得（在未锁存的状态下，输出锁存器的状态跟随减1计数器的状态，即减1计数器的状态可以通过输出锁存器读出）。这种方法的前提条件是利用外部电路禁止CLK，否则，在读操作时可能减1计数器正在改变（处于减1操作的过程中），从而造成结果的不确定性。


    - 2. 锁存读出方式


    锁存读出方式利用一条锁存命令，该命令是控制字中读/写格式的一种组合。


