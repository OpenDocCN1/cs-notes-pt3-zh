    \ 82H         ; 读高 8 位\n        MOV     AH, AL\n        IN      AL, 83H      \
    \   ; 读低 4 位\n        MOV     [DI], AX        ; 存 12 位数据\n        ADD     DI,\
    \ 2           ; 下一个字地址\n        LOOP    X1\n......\n```\n\n### 1. 采样保持原理\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_473_0.png)\n\
    \n图 7.4.16 采样保持原理图及波形\n\n### 2. 采样保持器的主要性能指标\n\n- （1）采集时间  \n  采样保持器不可能是理想器件，当它置于采样方式时，输出跟踪输入需要有一定的时间。采集时间是指从采样开始到输出稳定所需要的时间，一般以采样保持器输出跟踪一个跳变\
    \ 10V 的输入模拟电压时，从采样开始到输出电压与输入电压相差 0.01% 所需要的时间定义为采集时间。\n- （2）直流偏移  \n  指采样保持器输入端接地时，输出端电压的大小。\n\
    - （3）转换速率  \n  指输出电压变化的最大速率，以伏/秒为单位。\n- （4）孔径时间  \n  在采样保持电路中，逻辑控制开关有一定的动作时间。在保持命令发出后直到开关完全断开所需要的时间称孔径时间。即进入保持控制后，实际的保持点会滞后真正要求保持的点一段时间，一般是毫微秒级。\n\
    - （5）下跌率（衰减率）  \n  下跌率即指在保持阶段电容的放电速度，以伏/秒表示，这是由于开关的漏电流及保持电容的其它泄漏通路造成的。一般保持电容的选择应折衷地考虑采集时间和下跌率。\n\
    \n### 3. LF398 采样保持器\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_475_0.png)\n\n\
    图 7.4.17 LF398 内部结构\n\n### 4. 采样保持器的级联\n\n保持电容 C_H 的取值要影响两个相互矛盾的参数：采集时间和电压衰减率，而在实际应用中，常需要高的捕捉速度和长的保持时间。\n\
    \n在这种情况下，可用两个采样保持器级联使用。第一级采样保持器电容较小，因此可以迅速在采样点获得模拟信号，第一级的输出作为第二级的输入，而第二级的保持电容较大，且输入信号是来自前级的稳定信号，所以输出电压衰减率很低，从而既取得高捕捉速率，又增加了保持时间，这种级联采样保持电路的总的取样率由两个取样保持器取样率的“和”来决定。\n\
    \n## 7.5 功率开关器件及接口\n\n在微机测量及控制系统中，被测参数经采样、量化、处理之后，为了达到自动控制的目的，还需要输出控制信息。由于输出设备通常需大电压（或电流）来控制，而微机系统输出的开关量都是通过微机的\
    \ I/O 口输出的。这些 I/O 口的驱动能力有限。\n\n例如标准的 TTL 门电路在 0 电平时吸收电流的能力约为 16mA，常常不足以驱动一些功率开关（如继电器、电磁开关等），因此，需要一些大功率开关接口电路。\n\
    \n常用的功率开关接口器件有功率开关驱动电路及功率型光电耦合器、集成驱动芯片及固体继电器等。\n\n### 7.5.1 光电隔离器\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_478_0.png)\n\
    \n图 7.5.1 光电隔离器原理图\n\n### 7.5.2 功率晶体管驱动电路\n\n- 1. 功率晶体管驱动电路\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_479_0.png)\n\
    \n图 7.5.2 简单的晶体管驱动电路\n\n- 2. 达林顿驱动电路\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_480_0.png)\n\
    \n图 7.5.3 达林顿驱动电路\n\n### 7.5.3 机械继电器及接口\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_481_0.png)\n\
    \n图 7.5.4 继电器接口电路\n\n### 7.5.4 固态继电器\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_482_0.png)\n\
    \n图 7.5.5 直流型 SSR 原理图\n\n## 第7章 结束\n\n## 第8章 人机交互接口\n\n人机交互接口就是用户与计算机进行交流的接口，即用户如何将信息输入计算机，计算机如何将处理后的信息告诉用户。使用人机交互接口的设备主要有：键盘、鼠标器、扫描仪等常见的输入设备，CRT显示器、液晶显示器、LED七段显示器、打印机、绘图机等常见的输出设备。\n\
    \n### 8.1 键盘接口\n\n键盘是微机系统上最基本的标准输入设备。用户通过键盘向计算机输入操作命令、程序或数据。尽管目前已有语音输入、手写板输入、图象扫描识别等多媒体输入方式，然而键盘的重要地位还不会被其他输入方式所取代。\n\
    \n编码键盘能够由硬件逻辑自动提供与被按键对应的ASCII码或其它编码。编码键盘中的某一键按下后，能够提供与该键相对应的编码信息。如果是ASCII码键盘，就能提供与该键相对应的ASCII码。编码键盘的缺点是硬件设备随着键数的增加而增加。\n\
    \n非编码键盘仅仅简单地提供被按键行和列的矩阵，其它工作都靠程序实现，这样，非编码键盘就为系统软件在定义键盘的某些操作上提供了更大的灵活性。目前已有一些专用芯片可以完成其中的一些工作。非编码键盘具有价格便宜、配置灵活的特点。\n\
    \n### 8.1.1 消除抖动及重键处理\n\n键盘的按键有机械式、电容式、薄膜式等多种，但就它们的作用而言，都是一个使电路“通”或“断”的开关。在对机械式按键进行键盘输入时，一般存在两个问题，即触点弹跳与同时按下一个以上键的问题，也就是所谓的抖动与重键的问题。\n\
    \n### 1. 抖动\n\n抖动是开关本身的一个最普遍的问题，它的产生是当机械开关的触点闭合时，在达到稳定之前需要短暂抖动或弹跳几下，即反复闭合、断开几次之后，才能达到可靠地闭合在一起。抖动也存在于开关断开时，其情形与开关闭合时相同。抖动产生的尖脉冲情况如图8.1.1所示。\n\
    \n根据所用键的不同质量，键的抖动时间可为10～20ms。键的抖动会引起一次按键被读入多次。解决键的抖动可以使用硬件滤波方法或软件延迟方法。硬件滤波是对每一个键加上R-C滤波电路，或加上RS去抖电路。这种方法通常在键数少的情况下使用。而键数较多时，则经常采用软件去抖动技术，这种方法的实质就是采用一个产生20ms左右延迟的子程序，以等待键的输出达到完全稳定后才去读取代码。\n"
