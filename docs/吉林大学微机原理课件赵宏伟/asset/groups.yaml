    # 2.3.4 I/O处理机方式


    +   - 为了提高整个系统的工作效率，使CPU完全摆脱管理、控制输入/输出的沉重负担。从20世纪60年代开始又引入了I/O处理机的概念，提出了数据传送的I/O处理机方式。于是，专门用来处理输入输出的I/O处理机IOP应运而生。如Intel
    8089就是一种专门配合8086/8088使用的I/O处理器芯片。


    +   - I/O处理机有自己的指令系统，也能独立地执行程序，能承担原来由CPU处理的全部输入/输出操作。如对外设进行控制、对输入/输出过程进行管理，并能完成字与字之间的装配和拆卸、码制的转换、数据块的错误检测和纠错，以及格式变换等操作。同时它还可以向CPU报告外设和外设控制器的状态，对状态进行分析，并对输入/输出系统出现的各种情况进行处理。上述操作都是同CPU程序并行执行的。为了使CPU的操作与输入/输出操作并行进行，必须使外设工作所需要的各种控制命令和定时信号与CPU无关，由I/O处理机独立形成。'
  - '[PAGE 92]


    # 2.4 DMA控制器8237A


    主要的功能有：


    +   1. 在一片8237A内有4个独立的DMA通道。

    +   2. 每个通道的DMA请求可分别编程允许或禁止。

    +   3. 每个通道的DMA请求有不同的中断优先级（即DMA操作优先权），优先级有两种：固定优先级和循环优先级，由编程决定。固定优先级的顺序是通道0最高，依次是通道1，通道2和通道3。

    +   4. 可在外设与存储器，存储器与存储器之间传送数据，存储器地址寄存器可以加1或减1。

    +   5. 可由软件编程改变DMA读写周期长度。

    +   6. 有四种工作方式：单字节传送方式，数据块传送方式，请求传送方式，级连方式。

    +   7. 可以多片级连，扩展通道数。

    +   8. DMA操作结束有两种方法：一是字节计数器减1由0变为FFFFH，二是外界通过输入负脉冲，强制DMA操作结束。

    +   9. DMA操作启动有两种方法：一是外设输入DMA请求信号DREQ，二是通过软件编程从内部启动。'
