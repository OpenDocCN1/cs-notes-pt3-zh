    \ | 1 | 1 | 1 | 通道3 写：基字节计数器和当前字节计数器<br>通道3 读：当前字节计数器 |\n| 1 | 0 | 0 | 0 | 写：命令寄存器；\
    \ 读：状态寄存器 |\n| 1 | 0 | 0 | 1 | 写：请求寄存器； 读：非法 |\n| 1 | 0 | 1 | 0 | 写：一位屏蔽字寄存器；\
    \ 读：非法 |\n| 1 | 0 | 1 | 1 | 写：方式寄存器； 读：非法 |\n| 1 | 1 | 0 | 0 | 写：清除/后触发软件命令； 读：非法\
