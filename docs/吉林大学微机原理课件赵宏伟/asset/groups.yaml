    # RS-232-C接口标准


    +   1. 机械特性


    由于RS-232-C并未定义连接器的物理特性，因此，出现了D25、D15和D9各种类型的连接器，其引脚定义也各不相同，使用时要特别注意。目前，常用的D9型连接器，其外形及信号分配如图6.2.2所示。通常连接器的插座接在DTE上，连接器的插头接在DCE上。'
  - '[PAGE 370]


    # 2. 电气特性


    +   - RS-232-C的电气特性规定采用负逻辑电平，也就是说，在TXD和RXD数据线上，逻辑0相当于对信号地线有+3V～+15V电压（通常取+12V），而逻辑1相当于对信号地线有-3V～-15V的电压（通常取-12V）。

    +   - 在RTS、CTS、DSR和DCD等控制线上，信号有效（接通ON状态，正电压）的电平为+3V～+15V；信号无效（断开OFF状态，负电压）的电平为-3V～-15V。

    +   - 很明显，RS-232-C是用正负电压来表示逻辑状态，与TTL以高低电平表示逻辑状态的规定不同。因此，为了能够同计算机接口或终端的TTL器件连接，必须在RS-232-C与TTL电路之间进行电平和逻辑关系的变换，实现这种变换的方法可用集成电路芯片MC1488和MC1489来完成，如图6.2.3所示。当连接电缆线长度不超过15m时，允许数据传输速率不超过20kbps。'
