    \n## 显示适配器\n\n- EGA (Enhanced Graphics Adapter)：增强图形适配器，显示标准完全兼容CGA和MDA各种显示方式，在图形方式下分辨率为640×350，16种颜色。\n\
    - VGA (Video Graphics Array)：视频图形阵列适配器，显示标准完全兼容EGA的显示标准，字符窗口为9×16点阵，图形方式下分辨率为640×480，16种颜色，或320×200，256种颜色。\n\
    - SVGA (Super VGA)：该标准除兼容MDA、CGA、EGA、VGA的显示方式外，还支持1280×1024像素，每像素点有224种颜色，刷新频率可达75Hz。\n\
    - MDA、CGA、EGA、VGA的显示方式如表8.3.1所示。MDA、CGA、EGA这三种视频标准目前已基本不用。\n\n## 8.3.6 对显示器的编程\n\
    \n- 对显示器的编程与其他通用硬件编程一样，可以直接对硬件编程，也可以直接调用ROM BIOS中的显示I/O功能程序或有关DOS功能调用，前者，由于必须弄清硬件细节才能有的放矢地编程，而后者只需了解具体调用方法。可通过DOS功能调用中INT\
    \ 21H子功能，即选择AH=1、2、9、0AH等可方便地实现字符和字符串的输出和显示。对于常规图形显示方式，可通过调用BIOS功能就能实现，而且非常简便。下面仅介绍采用BIOS功能调用的方法实现对显示器的编程。\n\
    - BIOS中具有驱动显示适配器功能的程序，它包括16个功能模块，只要给AH装入指定的模块号，再执行一条INT 10H指令，即可调用它的一个功能模块\n\n\
    ### 例8.3.1 设置VGA图形方式\n\n- MOV AH, 00H\n- MOV AL, 12H\n- INT 10H\n\n### 例8.3.2\
    \ 设置VGA文本方式\n\n- MOV AH, 00H ; 0号功能为显示方式选择\n- MOV AL, 03H ; 方式3，彩色字符\n- INT 10H\
    \ ; 调用BIOS\n\n### 例8.3.3 在显示页0置光标(2，15)，即第0页第15行第2列字符处\n\n- MOV AH, 2\n- MOV BH,\
