    ## 1.2.6 任务状态段及寄存器


    - 在多任务系统中，多个任务可以并行执行。当然，这种并行是宏观上的并行。为了实现多个任务同时工作，就要求每个任务都有自己的虚拟存储空间，都有自己的一个局部描述符表LDT，存放该任务私有的描述符。

    - 任务间的转移必然会引起任务切换。任务切换操作要保存现有任务的机器状态（指处理器的工作环境，比如各个寄存器的状态），装入新任务的机器状态。这时的机器状态就是通常操作系统的任务控制块，对于Pentium微处理器，称之为任务状态段TSS（Task
    State Segment）。

    - 任务状态段TSS如同每个任务有自己的一个LDT一样，各任务都有自己的TSS。


