  md: '

    ## 计数值的读出操作


    - 1. 简单读出方式


    一个计数器的现有计数值可以通过读取减1计数器而获得（在未锁存的状态下，输出锁存器的状态跟随减1计数器的状态，即减1计数器的状态可以通过输出锁存器读出）。这种方法的前提条件是利用外部电路禁止CLK，否则，在读操作时可能减1计数器正在改变（处于减1操作的过程中），从而造成结果的不确定性。


    - 2. 锁存读出方式


    锁存读出方式利用一条锁存命令，该命令是控制字中读/写格式的一种组合。


    ## 5.2.4 8253的工作方式


    - 8253有6种工作方式，在不同的方式下，计数器的启动方式、GATE端输入信号的作用以及OUT端的输出波形都有所不同。下面分别说明每一种方式的要点。


    - 在本小节中，表示初始化时执行输出指令所发的写信号，CW表示写控制字，LSB表示写计数初值（一般情况下，写初值应有两个负脉冲，第一个送低8位，第二个送高8位。这里是为了波形简洁，只画了一个，因为只有低8位数据）。


    ## 方式0（计数结束中断方式）


    - （1）结果特点

    - 计数器减1为0时，OUT升高，向CPU发中断请求。

    - （2）过程特点

    - 1）控制字写入。OUT=0。当控制字写入控制字寄存器后，输出端OUT变成低电平。并且在计数値减到0之前一直保持低电平。

    - 2）计数値写入。OUT不变，仍然为低电平（OUT=0）。

    - 3）启动方式。写入计数値。写入计数値后，必须在下一个CLK时钟脉冲到来时，计数初値才由计数初値寄存器传送到减1计数器。这样，如果计数初値为n，若GATE=1，则输出端OUT要在计数初値写入后再过n+1个CLK时钟后，才升为高电平。

    - 4）计数期间。OUT为低电平（OUT=0）。

    - 5）计数为0时。OUT升高（OUT=1），向CPU发中断请求（如果使用中断的话）。直到CPU写入新的控制字或计数数值时，才能使OUT=0。

    - 6）计数期间写入新的计数数值。如果计数值是一个字节，则在写入后的下一个时钟脉冲，新的计数数值由计数初值寄存器送入减1计数器，开始新的计数。

    - 如果计数值是两个字节，则写入第一个字节时中止计数，写入第二个字节后的下一个时钟脉冲时，新的计数数值由计数初值寄存器送入减1计数器，启动计数器按新的计数数值开始计数。

    - 7）GATE作用。GATE=0时，禁止计数，计数器停止；GATE=1时，允许计数，此时计数器从刚才断的地方开始连续计数。

    - 8）计数值有效期限。计数值一次有效。


