    +   - （3）中断服务程序

    +   - 1）保护现场。与单重中断相同。

    +   - 2）保护原中断屏蔽字。保护本次中断的屏蔽字，以便返回主程序时恢复之。

    +   - 3）送新中断屏蔽字。该屏蔽字将屏蔽掉与本次中断请求同一优先级别以及更低级别的其它请求。例如，在图3.1.5设备C中断服务程序中，其新中断屏蔽字对应A、B、C、D的输出状态为1、1、0、0。

    +   - 4）开中断。通过指令开中断，因在中断处理中已由硬件关中断，为了能响应新的更高级别请求，中断服务程序需执行开中断指令。

    +   - 5）中断处理。与单重中断相同，若有新的更高级别的中断请求就在此程序段内响应。

