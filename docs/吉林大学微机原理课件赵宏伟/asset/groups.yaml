  mdcn: "\n## （3）ICW3\n\n- ICW3的主要功能是：确定主片、从片的级联状态，即确定主片的连接位和从片的编码。\n- ICW3仅用于8259A的级联方式，它分为主片ICW3和从片ICW3两种格式。\n\
    - 1）主片ICW3的功能是用来表明主片8259A的IRx与从片8259A的INT之间连接关系，其格式及各位的具体定义如图3.3.5所示。图中S0-S7分别与主片8259A的IR0-IR7引脚的连接情况相对应，如果某一个引脚上连有从片，则对应位为1；如果未连从片，则对应位为0。比如当ICW3=0FH（00001111）时，表示在IR3、IR2、IR1、IR0引脚上接有从片，而IR7、IR6、IR5、IR4引脚上没连从片。\n\
    - 2）从片ICW3的功能是用来表明从片8259A的INT引脚是和主片8259A中的哪一个IRx相连接，其格式及各位的具体定义如图3.3.6所示。其中的D7-D3不用，可都取0。D2-D0的值与从片的输出端INT连在主片的哪条中断请求输入引脚有关。比如，某片从片的INT引脚连在主片的IR5引脚上，则此从片的ICW3中的标识码D2-D0应为101。\n\
    \n## 8259A的ICW3格式\n\nD7 D6 D5 D4 D3 D2 D1 D0\nS7 S6 S5 S4 S3 S2 S1 S0\n\nSx 对应\
    \ IRx 的连接从片的状态\n1 = IR 输入有从片, 0 = IR 输入无从片\n\n图 3.3.5 8259A 的 ICW3 主片格式 (A0=1)\n\
    \nD7 D6 D5 D4 D3 D2 D1 D0\n0 0 0 0 0 ID2 ID1 ID0\n\n高 5 位\n不用\n\n| 与主片的连接位 | ID2\
    \ | ID1 | ID0 |\n|---|---|---|---|\n| IR0 | 0 | 0 | 0 |\n| IR1 | 0 | 0 | 1 |\n\
    | IR2 | 0 | 1 | 0 |\n| IR3 | 0 | 1 | 1 |\n| IR4 | 1 | 0 | 0 |\n| IR5 | 1 | 0 |\
    \ 1 |\n| IR6 | 1 | 1 | 0 |\n| IR7 | 1 | 1 | 1 |\n\n图 3.3.6 8259A 的 ICW3 从片格式 (A0=1)\n\
    \n## （4）ICW4\n\n- ICW4的主要功能是：选择CPU系统、确定中断结束方式、规定是主片还是从片、选择是否采用缓冲方式。\n- ICW4的格式及各位的具体定义如图3.3.8所示，其中D7-D5位无意义，都可取0。\n\
    \n## 8259A的ICW4格式（A0=1）\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_215_0.png)\n\
    \n图 3.3.8 8259A 的 ICW4 格式（A0=1）\n\n## 2. 操作命令字\n\n- 在初始化命令字写入8259A之后，8259A就准备接收中断请求输入信号了。在8259A工作期间，CPU可以随时通过操作命令字使8259A完成各种不同的工作方式。8259A有三种操作命令字：OCW1、OCW2和OCW3，在写入时，它们与初始化命令字不同，它们不是按一定的顺序写入，而是按设计者的要求写入。\n\
    \n## （1）OCW1\n\n- OCW1的主要功能是：保存中断屏蔽字。\n- 操作命令字OCW1对8259A内的中断屏蔽寄存器IMR中的各位进行动态地设置屏蔽字，其格式及各位的具体定义如图3.3.9所示，图中M0-M7分别与8259A的IR0-IR7相对应。\n\
    \n## （2）OCW2\n\n- OCW2的主要功能是：控制8259A的中断循环优先级方式及发送命令中断结束方式。\n- 操作命令字OCW2的格式及各位的具体定义如图3.3.10所示。\n\
    - 在OCW2的格式字中，R位用来设置中断级别的优先级是否采用循环方式。若为1，表示采用优先级循环方式；若为0，则为非循环方式（即固定优先级）。\n\n##\
    \ 8259A的OCW2格式（A0=0）\n\n| 优先级管理方式 | 功能 | R | SL | EOI |\n|---|---|---|---|---|\n\
    | 全嵌套 | 正常 EOI 中断结束命令，使 ISR 中最高的非零位清 0 | 0 | 0 | 1 |\n| 特殊全嵌套 | 特殊 EOI 中断结束命令，使\
    \ ISR 中 L2-L0 对应位清 0 | 0 | 1 | 1 |\n| 全嵌套 | 复位自动循环，返回全嵌套 | 0 | 0 | 0 |\n| 自动循环\
    \ | 设置自动循环 | 1 | 0 | 0 |\n| 自动循环 | 自动循环下中断结束命令，使 ISR 中最高的非零位清 0 | 1 | 0 | 1 |\n\
    | 特殊循环 | 设置特殊循环，使 L2-L0 对应的 IRx 为最低优先级 | 1 | 1 | 0 |\n| 特殊循环 | 特殊循环下中断结束命令，使 ISR\
    \ 中 L2-L0 对应位清 0 | 1 | 1 | 1 |\n| 无 | 无操作 | 0 | 1 | 0 |\n\n| 中断源 | L2 | L1 | L0\
    \ |\n|---|---|---|---|\n| IR0 | 0 | 0 | 0 |\n| IR1 | 0 | 0 | 1 |\n| IR2 | 0 |\
    \ 1 | 0 |\n| IR3 | 0 | 1 | 1 |\n| IR4 | 1 | 0 | 0 |\n| IR5 | 1 | 0 | 1 |\n| IR6\
    \ | 1 | 1 | 0 |\n| IR7 | 1 | 1 | 1 |\n\n图 3.3.10 8259A 的 OCW2 格式（A0=0）\n\n![](img/99c6f63905a40bae1a2423b4a3d2910c_219_0.png)\n\
    \n## （3）OCW3\n\n- OCW3的主要功能是：设定查询方式、特殊屏蔽方式、寄存器读取方式。\n- 操作命令字OCW3的格式及各位的具体定义如图3.3.11所示。\n\
    - 特殊屏蔽方式不仅允许高优先级的中断，也允许低优先级的中断。如果特殊屏蔽方式与全嵌套方式配合使用，可动态地改变中断系统的优先级结构。例如，在执行中断服务程序的某一部分中要求禁止较低级的中断请求，但在执行中断服务程序的另一部分中又允许较低优先级别的中断请求。复位特殊屏蔽方式则回到未设置特殊屏蔽方式时的优先级方式。\n\
    \n## 8259A的OCW3格式（A0=0）\n\n图 3.3.11 8259A 的 OCW3 格式（A0=0）\n\n## 例3.3.1 8259A单片应用\n\
    \n- 在某8088系统中扩展一片中断控制器8259A，其端口地址由74LS138译码器译码选择，假设为8CH和8DH。中断源的中断请求线连到IR7输入线上，边沿触发方式，IR7的中断类型码为77H，其它条件保持8259A的复位设置状态。要求：\n\
    \n- （1）写出8259A的初始化程序。\n\n- （2）写出中断类型码为77H的中断向量设置程序。\n\n## 1. 8259A的初始化程序\n\n-\
    \ 初始化程序包括写入ICW1、ICW2和ICW4（由于单片使用，不需写入ICW3），并且必须按规定的顺序写入。\n- （1）ICW1命令字。单片，边沿触发，需要ICW4，故为00010011B=13H，写入偶地址。\n\
    - （2）ICW2命令字。IR7的中断类型码为77H，即可作为ICW2命令字写入，写入奇地址。\n- （3）ICW4命令字。8088 CPU，一般全嵌套方式，正常EOI结束，非缓冲方式，故命令字的组合为00000001B=01H，写入奇地址。\n\
    - （4）OCW1命令字。系统只使用了IR7，为防止干扰，产生误动作，应将IR0-IR6屏蔽掉，屏蔽字为01111111B=7FH，写入奇地址。\n\n##\
    \ （5）初始化程序段\n\n- CLI\n- MOV\t\tAL, 13H\t\t; ICW1\n- OUT\t\t8CH, AL\n- MOV\t\t\
    AL, 77H\t\t; ICW2\n- OUT\t\t8DH, AL\n- MOV\t\tAL, 01H\t\t; ICW4\n- OUT\t\t8DH,\
    \ AL\n- MOV\t\tAL, 7FH\t\t; OCW1\n- OUT\t\t8DH, AL\n- STI\n\n## 2. 中断类型码77H的中断向量设置程序\n\
    \n- 假设相应中断服务程序名为INTP，该符号地址包含段值属性和段内偏移量属性，将这二者分别存入中断向量地址，中断类型码77H的中断向量地址为77H×4=1DCH，即占用1DCH-1DFH等4个单元，其中1DEH-1DFH存放INTP的段地址，1DCH-1DDH存放INTP的段内偏移量。\n\
    \n- 用串指令完成中断向量的设置，程序如下：\n\n- CLI\n\n- MOV    AX, 0\n\n- MOV    ES, AX    ; 中断向量表段地址\n\
    \n- MOV    DI, 1DCH    ; 中断向量表偏移地址\n\n- MOV    AX, OFFSET INTP    ; 中断服务程序偏移地址\n\
    \n- CLD\n\n- STOSW\n\n- MOV    AX, SEG INTP ; 中断服务程序段地址\n\n- STOSW\n\n- STI\n"
