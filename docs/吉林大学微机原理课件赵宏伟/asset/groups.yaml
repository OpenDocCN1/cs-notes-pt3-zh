    - （2）SCSI设备是对等关系。SCSI设备既可以是启动设备（发出命令的设备），也可以是目标设备（接收命令的设备）。根据操作确定设备性质。

    - （3）SCSI允许在对一个设备传输数据的同时，另一个设备对其进行数据查找。这就可以在多任务操作系统如Linux、WindowsNT中获得更高的性能。

    - （4）SCSI占用CPU极低，在多任务系统中占有优势。由于SCSI卡本身带有CPU，可处理一切SCSI设备的事务，在工作时主机CPU只要向SCSI卡发出工作指令，SCSI卡就会自己进行工作，工作结束后返回工作结果给CPU，在整个过程中，CPU均可以进行自身工作。

    - （5）SCSI有2种数据传输方式：同步方式和异步方式。同步方式是默认方式。

    - （6）SCSI设备具有智能化。SCSI卡自己可对CPU指令进行排队，这样就提高了工作效率。在多任务时硬盘会在当前磁头位置，将邻近的任务先完成，再逐一进行处理。


    ## 2. SCSI的类型


    - SCSI有以下几种类型：SCSI-1、SCSI-2（Fast SCSI、Wide SCSI）、SCSI-3（Ultra SCSI、Ultra Wide
    SCSI、Ultra 2 SCSI、Wide Ultra 2 SCSI、Ultra 160 SCSI、Ultra 320 SCSI）。比较流行的版本是SCSI-2。

    - （1）SCSI-1。SCSI-1是最早的版本，现在基本被淘汰，异步传输的频率为3MB/S，同步传输的频率为5MB/s。

    - （2）SCSI-2。早期的SCSI-2，称为Fast SCSI，通过提高同步传输的频率使数据传输速率从原有的5MB/s提高为10MB/s，支持8位并行数据传输，可连7个外设。

    - （3）SCSI-3。SCSI-3又称为Ultra SCSI，数据传输率达到20MB/s，若使用16位传输的Wide模式，数据传输率可提高至40MB/s。使用68针的接口，主要应用在硬盘上。SCSI-3的典型特点是将总线频率大大提高，并降低信号的干扰，以此来增强其稳定性。


    ## 3. SCSI接口信号


    - 基本SCSI-2使用50芯线缆，其中定义了18个差分驱动信号线，其余的线为电源、地、保留。

    - 而68芯线缆将数据线扩充到了16位。

    - 18个信号线中，有8个数据线、1个奇偶校验线、9个控制/状态线。


    ## 4.6.4 IEEE 1394总线


    - IEEE 1394是一种高性能串行总线标准（IEEE 1394 high performance serial bus standard），具有很高的数据传输速率，十分适合视频影像的传输。作为一种数据传输的开放式技术标准，IEEE
    1394被应用在众多的领域，其应用大致可分为三部分，一是数字录像机、摄录一体机等家电产品，二是打印机、扫描仪等计算机外设，三是硬盘、CD-ROM等微机内部外设。

    - IEEE 1394接口技术由苹果公司率先创立，苹果公司称之为Firewire，很多人习惯称之为火线卡。IEEE协会在1995年正式把它接纳为一个新的工业标准，编号为1394，这就是IEEE
    1394这个名字的由来。不同的公司根据注册的商标，对IEEE 1394接口有不同的叫法，例如Sony称之为i.Link，Texas Instruments称之为Lynx等。


    ## 1. IEEE 1394特点


    - （1）数据速率高。IEEE 1394中规定速率为100Mbit/s到400Mbit/s。IEEE 1394b中更高的速度是800Mbit/s到3.2Gbit/s。现在LSI（大规模集成电路）通常可能达到的物理流速度是200Mbps，所以400Mbps就几乎可以满足所有的要求。

    - （2）实时性好。接口设备对等，速度快，保证了实时性。不分主、从设备，都是主导者和服务者。这样可以不通过计算机而在两台摄像机之间直接传递数据，也可以让多台计算机共享一台摄像机。IEEE
    1394支持同步和异步两种数据传输模式。

    - （3）即插即用。无需设定ID（识别符）或终端负载，主节点可以动态确定。

    - （4）热插拔。系统在全速工作时，IEEE 1394设备也可以插入或拆除。

    - （5）兼容性好。IEEE 1394总线可适应台式个人机用户的全部I / O要求，并可以与SCSI并口、RS232标准串口、Centronics接口等接口兼容。

    - （6）直接提供电源。采用6芯电缆，其中4根信号线和2根电源线，安装简单。设备之间线缆最长4.5米，从主机到终节点线缆可达72米。电源范围8～40V直流，最大耗电1.5A。

    - （7）连接设备多。IEEE1394接口可以同时连接63个不同设备。

