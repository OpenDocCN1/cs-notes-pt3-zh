    - D/A转换的方法较多，但常用的方法是加权电阻网和T型电阻网。


    ## 1. 加权电阻网D/A转换


    - 加权电阻网D/A转换就是用一个二进制数字的每一位代码产生一个与其相应权成正比的电压（或电流），然后将这些电压（或电流）叠加起来，就可得到该二进制数所对应的模拟量电压（或电流）信号。

    - 例如，让二进制数的第0位产生一个1V（2⁰）的电压信号，第1位产生2V（2¹）的电压信号，第2位产生4V（2²）的电压信号，第3位产生8V（2³）的电压信号，依此类推，第n位产生2ⁿV的电压信号。

    - 再将这些电压信号加起来，就可以得到与原二进制数成正比的电压信号。这种转换方法就称为加权电阻网络法。


