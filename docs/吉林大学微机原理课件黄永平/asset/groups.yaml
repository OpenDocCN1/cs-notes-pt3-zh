    \ 4004和Intel 8008为基础。微处理器和存储器采用PMOS工艺，工作速度很慢。微处理器的指令系统不完整；存储器的容量很小，只有几百字节；没有操作系统，只有汇编语言。主要用于工业仪表、过程控制或计算器中。\n\
    \n## 微型计算机的发展\n\n▶ 第二阶段（1974-1977）：8位微处理器的时期。典型的微处理器有Intel 8080/8085、Zilog公司的Z80及Motorola公司的6800。微处理器采用高密度MOS（HMOS）工艺，具有较完整的指令系统和较强的功能。存储器容量达64KB，配有荧光屏显示器、键盘、软盘驱动器等设备，构成了独立的台式计算机。配有简单的操作系统（如CP/M）和高级语言。\n\
