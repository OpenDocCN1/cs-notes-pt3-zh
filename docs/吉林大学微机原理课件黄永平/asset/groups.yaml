    \ = 1) then\njump\nelse\nno jump, continue\n\nY\n\nN\n\n## 3)不等循环指令\n\nLOOPNE\
    \ / LOOPNZ      disp8\n\n;CX←CX-1;\n\n若CX≠0 且Z=0 则IP←IP+disp8 , disp8 = -128~127\n\
    \nCX←循环次数\n\n循环体\n\nLOOPNE/LOOPNZ\ndisp8\n\n最多\nCX次\n\nCX←CX-1\nCX≠0 and Z=0?\n\
    \nCX = CX - 1\nif (CX <> 0) and (ZF = 0) then\n    jump\nelse\n    no jump, continue\n\
