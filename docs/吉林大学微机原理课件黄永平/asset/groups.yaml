    程序如下：\n\n```\nSTACK        SEGMENT STACK\n             DB 200 DUP (0)\nSTACK \
    \       ENDS\nDATA         SEGMENT\nN            DW 5\nRESULT       DW ?\nDATA\
    \         ENDS\nCODE         SEGMENT\n             ASSUME CS: CODE, SS: STACK,\
    \ DS: DATA\n```\n\n```\nSTART:    MOV AX, DATA\n          MOV DS, AX\n       \
    \   MOV AX, N\n          CALL FACT\n          MOV AX, RESULT\n          MOV AH,\
    \ 4CH\n          INT 21H\nFACT PROC\nCMP AX, 0\nJNE L1\n```\n\n```\n```assembly\n\
    MOV RESULT, 1\nJMP EXIT\nL1:\nPUSH AX\nDEC AX\nCALL FACT\nPOP AX\nMOV AX, RESULT\n\
    MOV RESULT, AX\nEXIT:\nRET\nFACT ENDP\nCODE ENDS\nEND START\n```\n```\n\n## 4.6\
    \ 模块化程序设计\n\n1. PUBLIC伪指令\n\n格式: PUBLIC 符号 [, 符号]\n\n功能: 说明其后的符号是全局符号。全局符号能被其他模块引用。\n\
    \n2. EXTRN伪指令\n\n格式: EXTRN 符号: 类型 [, 符号: 类型]\n\n功能: 说明在本模块中需要引用的、由其他模块定义的符号，即外部符号。\n\
    \n## 【例4.17】\n\n【例4.17】用模块化程序设计方法建立两个模块MOD1 ASM和MOD2 ASM的数据通信。\n\n```\nNAME  \
    \      MOD1\nEXTRN       DISP: FAR\nPUBLIC      STR1, N , BUF\nDATA1       SEGMENT\n\
    STR1        DB 'HOW DO YOU DO?'\nN           =$ - STR1\nBUF         DB 'THIS IS\
    \ AN EXAMPLE OF MODULES PROGRAM $'\nDATA1       ENDS\n```\n\n```\nSTACK      \
    \  SEGMENT STACK\n            DB 200 DUP (0)\nSTACK        ENDS\nCODE1       \
    \ SEGMENT\n            ASSUME CS: CODE1, DS: DATA1, SS: STACK\nSTART:       MOV\
    \  AX, DATA1\n            MOV  DS, AX\n            CALL DISP\n            MOV\
    \  AH, 4CH\n            INT  21H\nCODE1        ENDS\n```\n\n```\nEND      START\n\
    NAME     MOD2\nEXTRN    STR1: BYTE, STR2: BYTE, N: ABS\nPUBLIC   DISP\nDATA2 \
    \   SEGMENT\nSTR2     DB 81 DUP (0)\nDATA2    ENDS\nCODE2    SEGMENT\n       \
    \  ASSUME CS: CODE2, ES: DATA2\nDISP     PROC FAR\n         MOV  AX, DATA2\n \
    \        MOV  ES, AX\n```\n\n```\n```assembly\nLEA BX, STR1\nMOV CX, N\nLEA SI,\
    \ STR2\nNEXT:\nMOV AL, [BX]\nMOV ES: [SI], AL\nINC BX\nINC SI\nLOOP NEXT\nLEA\
    \ DX, BUF\nMOV AH, 9\nINT 21H\nRET\nDISP ENDP\nCODE2 ENDS\nEND\n```\n```\n\n##\
    \ 4.7.1 宏指令\n\n在汇编语言程序设计过程中，可以将具有一定功能，需多次重复使用，且比较短的程序段定义成一条宏指令。\n\n使用宏指令语句可以减少程序书写错误，缩短源程序长度，使源程序编写像高级语言一样清晰、简洁。特别是使用宏库后，可以提高编程效率。\n\
    \n## 4.7.2 宏指令的使用过程\n\n- 1. 宏定义\n- 2. 宏调用\n- 3. 宏扩展\n\n## 1. 宏定义\n\n（1）带参宏定义\n\
    \n宏指令名 MACRO 形参1，形参2，......\n\n宏体\n\n```\nENDM\n```\n\n（2）无参宏定义\n\n宏指令 MACRO\n\
    \n宏体\n\n```\nENDM\n```\n\n## 2. 宏调用\n\n格式：\n\n宏指令名 [实参1, 实参2, ……]\n\n例如：对上面的宏定义的三种调用形式为：\n\
    \n```\nPRINT BUF1\n```\n\n```\nPRINT BUF2\n```\n\n```\nPRINT BUF3\n```\n\n## 3.\
    \ 宏扩展\n\n例如：上面三次宏调用，其展开的形式为：\n\n```\n+ LEA  DX, BUF1\n+ MOV  AH, 9\n+ INT  21H\n\
    ```\n\n```\n+ LEA  DX, BUF2\n+ MOV  AH, 9\n+ INT  21H\n```\n\n```\n+ LEA  DX,\
    \ BUF3\n+ MOV  AH, 9\n+ INT  21H\n```\n\n## 4.7.3 宏操作符\n\n- 1. 文本操作符\n\n【例4.19】在程序中定义大小及初值不同的堆栈段。\n\
    \n可用如下宏定义：\n\n```\nDSTACK    MACRO A\nSTACK     SEGMENT STACK\n          DB  \
    \    A\nSTACK     ENDS\nENDM\n```\n\n## 【例4.20】表达符操作%示例。\n\n```\nDATA1      MACRO\
    \      A, B, C, D\n            DW   A, B, C\n            DB   D DUP (0)\n    \
    \        ENDM\n```\n\n如果宏调用为：\n\n```\nX=10\nY=20\nDATA1      %X+2, 5,%X+Y,  %Y-5\n\
    DATA1      X+2, 5, X+Y, Y-5\n```\n\n则相应的宏扩展为：\n- DW      12, 5, 30\n- DB 15 DUP\
    \ (0)\n- DW      X+2, 5, X+Y\n- DB Y-5 DUP (0)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_504_0.png)\n\
    \n## 4.7.4 局部符号伪指令LOCAL\n\n【例4.21】局部符号伪指令LOCAL应用。\n\n```\nSUM          MACRO X,\
    \ Y\n             LOCAL L\n             MOV   CX, X\n             MOV   BX, Y\n\
    \             MOV   AX, 0\nL:           ADD   AX, BX\n             INC   BX\n\
    \             LOOP  L\n             ENDM\n```\n\n如果两次调用宏指令如下：\n\nSUM      100,\
    \ 1\n\nSUM      50, 1\n\n则宏扩展形式为：\n\nMOV  CX, 100\nMOV  BX, 1\nMOV  AX, 0\n\n\
    ```\n? ? 0000;\tADD\tAX, BX\n\tINC\tBX\n\tLOOP ? ? 0000\n\t:\n\tMOV\tCX, 50\n\t\
    MOV\tBX, 10\n\tMOV\tAX, 0\n? ? 0001;\tADD\tAX, BX\n\tINC\tBX\n\tLOOP ? ? 0001\n\
    \t:\n```\n\n返回本节\n\n## 4.7.5 宏库的使用\n\n语句格式: INCLUDE 库文件名\n假设已建立一名为MACRO.LIB的宏库，其内容如下：\n\
    \n```\nINPUT      MACRO A\n           LEA     DX, A\n           MOV     AH, 10\
    \ ; 10号系统功能调用\n           INT     21H\n           ENDM\n\nPRINT      MACRO A\n\
    \           LEA     DX, A\n           MOV     AH, 9  ; 9号系统功能调用\n           INT\
    \     21H\n           ENDM\n```\n\n```\nRETURN      MACRO\n    MOV   AH, 2\n \
    \   MOV   DL, 0AH\n    INT   21H\n    MOV   DL, 0DH      ; 回车换行\n    INT   21H\n\
    \    ENDM\n\nOUT2        MACRO A\n    MOV   DL, A\n    MOV   AH, 2   ; 2号系统功能调用\n\
    \    INT   21H\n    ENDM\n```\n"
