    # 3. 直接寻址方式


    操作数的地址的16位偏移量直接包含在指令中，它与操作码一起在码段区域中，但操作数一般在数据段区域中，它的地址为数据段寄存器DS加上它的16位地址偏移量。


    指令中的16位地址偏移量是低位字节在前，高位字节在后。


    EA=指令中直接给出地址 如 MOV AX, [3000H]


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_170_0.png)'
