    \  |\n|  | 24 |  |\n|  | E0 |  |\n|  | 05 |  |\n|  | 00 |  |\n\n例2：若要传送的不是一个字节，而是一个数据块，（例如内有100个字节），如何实现？\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_192_0.png)\n\n## (2)堆栈操作指令 PUSH s ;stack←s\n\
    POP d ;d←stack\nd,s = Rc16; Rs; M16\n\n堆栈——按照先进后出的原则组织的一段内存区域。8086中规定堆栈设置在堆栈段（SS段）内，堆栈指针SP的初值决定了堆栈的大小。\n\
    \nSP始终指向堆栈的顶部，即始终指向最后推入堆栈的信息所在的单元。\n\nRc16 ——— M16\nRs (CS不可变)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_193_0.png)\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_193_1.png)\n"
