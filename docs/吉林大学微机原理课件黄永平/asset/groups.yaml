    # 直接任务切换


    过程：

    (1) 保存当前任务1运行环境：

    当前任务1的所有R→当前TSS1。

    (2) 切换：

    置TSS2描述符.type.D2=1(忙)；

    CR0.D3=1(切换发生标志)；

