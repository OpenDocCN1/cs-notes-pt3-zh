    \    mov dl, 'A'\n    mov ah, 2\n    INT 21H\n    call disp\n\nloc_end: JMP loc_end\n\
    \ndisp proc near\n    mov dl, 'B'\n    mov ah, 2\n```\n\n在不同编译器下，\n要求源程序的结构不同！\n\
    \n编译器： MASM5.0, MASM32, emu8086\n\n## 六、关于makefile\n\n### MASM5.0下的makefile.bat\n\
    \n;by hyper, http://www.cnblogs.com/hyper99\n\n```\necho 设置文件名,不用扩展名\nset file=my_source_file\n\
    ```\n\n```\nset CC=masm.exe\nset LD=link.exe\n```\n\n```\necho 编译\n%CC% %file%.asm\n\
