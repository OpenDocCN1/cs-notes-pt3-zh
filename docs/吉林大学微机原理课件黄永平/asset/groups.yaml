    （5）返回值运算符：


    +   1) SEG 变量/标号

    +   2) OFFSET 变量/标号

    +   3) TYPE 变量/标号


    对变量：返回变量的字节数，DB为1，DW为2，DD为4，DF为6，DQ为8，DT为10。


    对标号：返回地址的类型，NEAR为-1，FAR为-2。


    +   4) LENGTH 变量

    +   变量中无DUP时，返回1;有DUP时返回由类型所定的单元数。


    +   5) SIZE 变量

