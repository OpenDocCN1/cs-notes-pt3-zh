    \ BUF\n          MOV  CL, 0  ; 计数器为0\nCOPA:     AND  AX, AX\n          JE   EXIT\
    \   ; (AX) =0, 结束循环\n          SHL  AX, 1  ; AX 左移一位\n          JNC  LOPA\n  \
    \        INC  CL      ; 产生进位， (CL) +1→CL\n          JMP  LOPA\nEXIT:     MOV \
    \ COUNT, CL\n          MOV  AH, 4CH\n          INT  21H\nCODE      ENDS\n    \
    \      END  START\n```\n\n## 4.4.3 多重循环程序设计\n\n【例4.10】在以BUF为首址的字存储区中存放有N个有符号数，现需将它们按大到小的顺序排列在BUF存储区中，试编写其程序。\n\
    \n我们采用冒泡排序算法从第一个数开始依次对相邻两个数进行比较，如次序对，则不交换两数位置；如次序不对则使这两个数交换位置。可以看出，第一遍需比较（N-1）次，此时，最小的数已经放到了最后；第二遍比较只需考虑剩下的（N-1）个数，即只需比较（N-2）次；第三遍只需比较（N-3）次，……整个排序过程最多需（N-1）遍。如下面的4个数即是采用冒泡排序比较的例子。\n\
    \n数 10 8 16 90 32\n第一遍 10 16 90 32 8\n第二遍 16 90 32 10 8\n第三遍 90 32 16 10 8\n程序流程图如图4.9所示。\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_467_0.png)\n\n图4.9 排序流程图\n\n程序如下：\n\
    \n```\nDATA        SEGMENT\nBUF         DW 3, -4, 6, 7, 9, 2, 0, -8, -9, -10,\
    \ 20\n            N= ($-BUF)/2\nDATA        ENDS\nSTACK       SEGMENT STACK\n\
    \            DB 200 DUP (0)\nSTACK       ENDS\nCODE        SEGMENT\n         \
    \   ASSUME CS: CODE, DS: DATA, SS: STACK\n```\n\n```\nSTART:      MOV AX, DATA\n\
    \            MOV DS, AX\n            MOV CX, N\n            DEC CX\nLOOP1:   \
    \   MOV DX, CX\n            MOV BX, 0\nLOOP2:      MOV AX, BUF[BX]\n         \
    \   CMP AX, BUF[BX+2]\n            JGE L\n            XCHG AX, BUF[BX+2]\n   \
    \         MOV BUF[BX], AX\n```\n\n```\nL:\n    ADD BX, 2\n    DEC CX\n    JNE\
    \ LOOP2\n    MOV CX, DX\n    LOOP LOOP1\n    MOV AH, 4CH\n    INT 21H\nCODE  \
    \  ENDS\n        END START\n```\n\n程序运行后，BUF区中的内容如下：\n\n20, 9, 7, 6, 3, 2, 0,\
    \ -4, -8, -9, -10\n\n若要对N个无符号数按由大到小的顺序排列，只需将指令“JGE L”改为“JAE L”即可。\n\n返回本节\n\n\
