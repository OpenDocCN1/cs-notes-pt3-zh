  md: "\n## 一.计算机基本结构\n\n### 计算机定义的概略解释\n\n- 1. 算术、逻辑运算（我们在中国就已学完的加减乘除四则运算）\n- 2.\
    \ 信息的数字化（一架冰冷的机器所能听懂的唯一语言）\n- 3. 存贮程序的工作方式（现代化的流水线）\n\n符合以上特征的即被称之为冯·诺依曼体系结构的计算机\n\
    \n### 冯·诺依曼体系结构的计算机（1）\n\n一到目前为止，几乎生产的所有计算机都是冯·诺依曼体系结构的计算机，这也是我们正在使用的诸如奔2奔3之类的微机的体系结构。（但是现在的计算机科学家认为只有打破冯·诺依曼体系，计算机的效率才能得到突破）\n\
    \n### 冯·诺依曼体系结构的计算机（2）\n\n- 采用二进制表示数据和指令。\n- 采用存储程序工作方式，即：\n  - 事先编制程序。\n  - 实现存储程序。\n\
    \  - 自动、连续地执行程序。\n\n### 冯·诺依曼体系结构的计算机（3）\n\n由以下五大部件组成计算机硬件系统：\n\n- 运算器（进行简单四则运算逻辑运算）\n\
    - 控制器（命令自己或外部设备做这做那）\n- 存储器（存储程序和数据）\n- 输入设备（外部的触角，眼，耳...）\n- 输出设备（执行机构，手，脚...）\n\
    \nCPU { 运算器, 控制器 } 脑\n\nHYPer\n\n### 基本结构\n\n微处理器\n(CPU)\n\n存储器\n\n输入/输出\n接口电路\n\
    \n外部设备\n\n地址总线\n\n数据总线\n\n控制总线\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_31_0.png)\n\
    \n### 微机基本组成\n\nHYPer\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_32_0.png)\n\n\
    内存条(RAM)\n\n磁盘驱动\n\nBIOS(ROM)\n\nCPU\n\n电源\n\n风扇\n\n电源口\n\nI/O插口\n\n猫/网卡\n\n声卡\n\
    \n显卡\n\n主板\n\n高速缓存\n\n外设扩展槽 SLOT\n\n### 1. CPU (中央处理器)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_33_0.png)\n\
    \n- 包括运算器和控制器\n- 计算机硬件的核心\n- 型号\n  - Intel: 486、586（奔腾）、PII、PIII、赛扬系列\n  - AMD:\
    \ K6-2、K6-III、K7系列\n- 主频: 66MHz、100MHz、133MHz\n\nHYPer\n\n### CPU基本结构\n\n####\
    \ 控制器\n\n- 程序计数器 PC\n- 指令寄存器 IR\n- 指令译码器 ID\n- 堆栈指示器 SP\n- 处理器状态字PSW\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_34_0.png)\n\
    \n#### 工作寄存器\n\n- 地址寄存器\n- 数据寄存器\n\nI/O\n控制逻辑\n\n微处理器包括运算器、控制器、寄存器组三大部分，一般被集成在一个大规模集成芯片上，如8088、80x86等等，它是计算机的核心部件，具有计算、控制、数据传送、指令译码及执行等重要功能，它直接决定了计算机的主要性能。\n\
    \n- ALU —— 运算器的核心部件是算逻辑单元ALU，所有的算术运算，逻辑运算和移位操作都是由ALU完成的。\n- 控制器 —— CPU的指挥机关，完成指令的读入、寄存、译码和执行。\n\
    - 程序计数器 PC—— 用于保存下一条要执行的指令的地址。\n- 指令寄存器 IR —— 保存从存储器中读入的当前要执行的指令。\n- 指令译码器 ID\
    \ —— 对指令寄存器 IR中保存的指令进行译码分析。\n- 堆栈指示器 SP —— 对堆栈进行操作时提供地址。\n\n### 2. 存储器 用于存放程序代码及有关数据。\n\
    \n- 计算机存取数据的部件，常用半导体做成，存储器中存放二进制单元，每个存储单元有一个编号，称为地址，计算机是根据地址来访问存储器的。\n- 存储器的主要技术指标有存储容量和速度。速度可用存取时间和存储周期来衡量。\n\
    - 存取时间TA是指从启动一次存储器操作（读/写）到完成该操作所需的时间。\n- 存储周期Tm是指连续两次访问存储器所需的最小时间间隔。通常Tm比TA稍大，这是由于存储器的积压部分都必须有一段稳定恢复的时间，所以读出后不能立即进行访问。\n\
    \nHYPer\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_38_0.png)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_38_1.png)\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_38_2.png)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_38_3.png)\n\
    \n外存储器\n\nHYPer\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_39_0.png)\n\n存储器基本原理\n\
    \n存储器由若干存储单元、地址译码器及相应的控制电路组成。\n\n存储单元的内容：存储器由若干个单元组成，每个单元可存放8 位二进制信息（通常也用两位十六进制数表示），这就是它们的内容。\n\
    \n存储单元的地址：为区分不同的单元，对这些单元分别编了号，这些编号即它们的地址。\n\n存储器的读写操作：存储器中的不同存储单元，是由地址总线上送来的地址，经过存储器中的地址译码器译码，选中该单元，然后根据控制总线上的控制命令（或读或写），进行相应的读写操作。\n\
    \n### 容量单位\n\n- 1Byte = 8 bit\n- 1 KB = 2¹⁰ Byte\n- 1 MB = 2¹⁰ KB\n- 1 GB = 2¹⁰\
    \ MB\n- 1 TB = 2¹⁰ GB\n- 1 PB = 2¹⁰ TB\n\n2¹⁰ = 1024≈1000\n\n1个汉字 = 2字节\n\n###\
    \ 3. 输入输出接口电路\n\n由于外部设备如键盘、显示器、软盘、硬盘、打印机等，\n在数据格式、运行速度等方面与 CPU 不匹配，故在连接时，\n需通过\
    \ 输入输出接口电路使外部设备与之相连。\n\nHYPer\n\n输入设备——输入设备是给计算机输入信息的设备。输入住处通过输入设备转换成计算机能识别的二进制代码，送入存储器中保存。常用的输入设备有键盘、鼠标器和光笔。\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_0.png)\n\n扫描仪\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_1.png)\n\
    \n键盘\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_2.png)\n\n鼠标\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_3.png)\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_4.png)\n\n手写笔\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_5.png)\n\
    \n数码相机\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_43_6.png)\n\n摄像头\n\n输出设备—输出设备是输出计算结果的设备。常见的输出设备有显示器、打印机、绘图机等。\n\
    \n显示器\n\n投影仪\n\n音箱\n\n打印机\n\n### 4. 总线\n\n总线是微型计算机中模块到模块之间传输信息的通道，是各种公共信息线的集合，采用总线结构便于部件和设备的扩充。对微机而言，总线可以\n\
    \n#### 分为以下四类：\n\n片内总线——这种总线是微处理器的内总线，在微处理器内用来连接ALU、CU和寄存器组等逻辑功能单元。这种总线没有具体标准，由芯片生产厂家自己确定。\n\
    \n片间总线——微处理器、存储器芯片、I/O接口芯片等之间的连接总线。片间总线通常包括数据总线、地址总线和控制总线。\n\n内总线 —— 内总线是微型计算机系统内连接各插件板的总线。内总线有不同的总线标准，如\
    \ S-100总线(IEEE-696标), STD总线, IBM-PC总线标准等，采用不同总线标准的功能板无法连接在一起。\n\n外总线 —— 用于微型计算机系统之间或者微型计算机与外部设备之间的通信。\n\
    \n外总线技术已经很成熟，各种应用要求皆有标准可遵循。\n\n如并行总线IEEE-488标准，串行总线RS-232标准等。\n\n四类总线之间的关系如图所示。\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_46_0.png)\n"
