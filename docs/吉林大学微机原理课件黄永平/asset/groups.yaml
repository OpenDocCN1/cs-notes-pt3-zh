    \n### 4.5.1 子程序的概念\n\n在程序设计中，我们会发现一些多次无规律重复的程序段或语句序列。解决此类问题一个行之有效的方法就是将它们设计成可供反复调用的独立的子程序结构，以便在需要时调用。在汇编语言中，子程序又称过程。\n\
    \n调用子程序的程序称为主调程序或主程序。\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_473_0.png)\n\
    \n### 4.5.2 子程序的定义\n\n子程序的定义是由过程定义伪指令PROC和ENDP来完成的。其格式如下：\n\n```\n过程名  PROC [NEAR/FAR]\n\
    \  :\n过程名  ENDP\n```\n\n其中PROC表示过程定义开始，ENDP表示过程定义结束。过程名是过程入口地址的符号表示。\n\n一般过程名同标号一样，具有三种属性，即段属性、偏移地址属性以及类型属性。\n\
    \n### 4.5.3 子程序设计方法\n\n- 1. 信息的保护与恢复\n- 2. 主程序与子程序参数传递方式\n\n# 1. 信息的保护与恢复\n\n\
    例如：若子程序PROG中改变了寄存器AX, BX, CX, DX的值，则可采用如下方法保护和恢复现场。\n\n```\nPROG      PROC\n \
    \         PUSH AX\n          PUSH BX\n          PUSH CX      ; 保护现场\n        \
    \  PUSH DX\n          :\n```\n\n```\nPOP DX\nPOP CX\nPOP BX  ; 恢复现场\nPOP AX\n\
    RET  ; 返回断点处\nPROC      ENDP\n```\n\n# 2. 主程序与子程序参数传递方式\n\n- - （1）寄存器法\n- - （2）约定单元法\n\
    - - （3）堆栈法\n\n### 4.5.4 子程序应用举例\n\n【例4.12】将一个给定的二进制数按位转换成相应的ASCII码字符串，送到指定的存储单元并显示。如二进制数10010011转换成字符串为‘10010011’。要求将转换过程写成子程序，且子程序应具有较好的通用性，而必须能实现对8倍和16倍二进制数的转换。\n\
    \n入口参数：DX存放待转换的二进制数\n\nCX存放待转换数的位数（8位或16位）\n\nDI存放ASCII码首地址\n\n出口参数：转换后的字符串存放在以DI作指针的字节存贮区中\n\
    \n程序如下：\n\n```\nDATA SEGMENT\nNUM8 DB 93H\nNUM16 DW 0ABCDH\nASCBUF DB 20 DUP (0)\n\
    DATA ENDS\n```\n\n```\nMOV[DI+2], BYTE PTR '$'\nLEA DX, ASCBUF\nMOV AH, 9\nINT\
    \ 21H\nMOV DX, NUM16\nMOV CX, 16 ; 置位数16\nLEA DI, ASCBUF\nCALL BTASC\nMOV [DL],\
    \ BYTE PTR 0DH\nMOV [DL+1], BYTE PTR 0AH\nMOV [DL+2], BYTE PTR '$' ;\nLEA DX,\
    \ ASCBUF\nMOV AH, 9\nINT 21H\n```\n\n显示转换后的字符串\n\n```\nBTASC          PROC\n \
    \                PUSH  AX      ; 保存AX\n                 MOV   AL, 0\n        \
    \         CMP   CX, 8   ; 比较8位数\n                 JNE   L1      ; 直接转换16位数\n \
    \                MOV   DH, DL  ; 8位数转换送DH\nL1:              ROL   DX, 1   ; DX最高位移入CF\n\
    \                 RCL   AL, 1   ; CF移入AL最低位\n                 ADD   AL, 30H\n\
    \                 MOV   [DI], AL\n```\n\n```\nINC        DI\n           LOOP L1\n\
    \           POP  AX\n           RET\n\nBTASC      ENDP\nCODE       ENDS\n    \
    \       END  START\n```\n\n返回本节\n\n### 4.5.5 子程序的嵌套与递归调用\n\n- 1. 子程序的嵌套\n\n子程序不但可以被主程序调用，而且也可以被其他子程序调用。我们把一个子程序调用另一个子程序称为子程序的嵌套调用。\n\
    \n- 2. 子程序的递归调用\n\n子程序的递归调用是指一个子程序直接或间接地调用自己。递归子程序一般对应于数学上对函数的递归定义，它往往能设计出效率较高的程序，完成相当复杂的计算，因而是很有用的。\n\
    \n# 【例4.15】\n\n【例4.15】试编制计算N！（N≥0）的程序。N!=N*（N-1）*（N-2）*......*1\n\n其递归定义如下：\n\n\
    0!=1\nN!=N*（N-1）！  （N>1）\n\n计算N！的子程序FACT的流程图如图4.10所示。\n"
