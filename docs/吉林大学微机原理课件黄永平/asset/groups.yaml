  md: "\n```\nSTACKO      MACRO A\n```\n\n```\nSTACK        SEGMENT      STACK\n```\n\
    \n```\n    DB      A\n```\n\n```\nSTACK        ENDS\n```\n\n```\n    ENDM\n```\n\
    \n现要从键盘输入一串字符到系统缓冲区，然后将字符按相反顺序打印，采用调用宏库的办法，其程序如下：\n\n```\nINCLUDE           MACRO.LIB\n\
    STACK0 <200        DUP (0) >        ; 定义堆栈段\nDATA               SEGMENT\nINFO1\
    \              DB  ‘INPUT STRING: $’\nINFO2              DB  ‘OUTPUT STRING: $’\n\
    BUFA               DB  81\n                   DB  ?\n                   DB  80\
    \ DUP (0)\n```\n\n```\nBUFB          DB 81 DUP (0)\nDATA          ENDS\nCODE \
    \         SEGMENT\n              ASSUME DS: DATA, SS: STACK, CS: CODE\nSTART:\
    \        MOV   AX, DATA\n              MOV   DS, AX\n              RETURN    \
    \  ; 输出回车换行\n              PRINT INFO1 ; 输出字符变量INFO1 代表的字符\n字符串\n            \
    \  INPUT BUFA  ; 键盘输入字符中到缓冲区；\n              LEA   SI, BUFA+1\n              MOV\
    \   CH, 0\n              MOV   CL, [SI]\n              ADD   SI, CX\n        \
    \      LEA   DI, BUFB\n```\n\n```\nNEXT:\nMOV AL, [SI]\nMOV [DI], AL\nDEC SI\n\
    INC DI\nLOOP NEXT\nMOV BYTE PTR [DI], '$'\nRETURN ; 输出回车换行\nPRINT INFO2 ; 输出的字符串变量INFO2代表\n\
    PRINT BUFB ; 反向输出输入字符串\nMOV AH, 4CH\nINT 21H\nCODE ENDS\nEND START\n```\n\n##\
    \ 4.7.6 重复汇编\n\n- 1. 给定次数的重复汇编伪指令\n  \n  语句格式：`REPT` 表达式\n  \n  重复块\n  \n  `ENDM`\n\
    \  \n  功能：宏汇编程序将重复块连续地汇编表达式给定的次数。\n\n- 2. 不定次数的重复汇编伪指令，有 IRP 和 IRPC 两种伪指令。\n\n\
    ## 【例4.22】\n\n某一源程序需要多次将AX, BX, CX, DX寄存器的内容压入堆栈，则可定义如下宏指令。\n\n```\nPUSHR    \
    \  MACRO\n           IRP  REG,  <AX, BX, CX, DX>\n           PUSH REG\n      \
    \     ENDM\n           ENDM\n```\n\n调用上述宏定义后，将展开成下列语句：\n\n```\n+ PUSH  AX\n+ PUSH\
    \  BX\n```\n\n+ PUSH CX\n+ PUSH DX\n又如：\nIRP W, 〈1122H, 3344H, 5566H, 7788H〉\n\
    DW W\nENDM\n汇编程序在汇编时将产生语句：\n+ DW 1122H, 3344H, 5566H, 7788H。\n（2）IRPC\n语句格式：IRPC\
    \ 形参, 字符串\n重复块\nENDM\n\n## 4.7.7 条件汇编\n\n条件汇编指在汇编期间，宏汇编程序根据条件是否成立决定具体汇编哪一程序段。条件汇编用条件汇编伪指令来定义。如表4.1所示。\n\
    \n语句格式： IF ×× 表达式\n\n```\n条件块1\n[ELSE\n条件块2]\nENDIF\n```\n\n| 伪指令 | 汇编条件 |\n|---|---|\n\
    | IF 表达式 | 表达式≠0，则条件为真 |\n| IFE 表达式 | 表达式=0，则条件为真 |\n| IF 1 | 是第一次扫描则为真 |\n| IF\
    \ 2 |  |\n| IFDEF 符号 | 符号已定义或被说明为外部符号，条件为真 |\n| IFNDEF 符号 | 符号未定义或没被说明为外部符号，条件为真\
    \ |\n| IFB 变量 | 变量为空格，则条件为真 |\n| IFNB 变量 | 变量不为空格，则条件为真 |\n| IFIDN 变量1, 变量2 |\
    \ 字符串变量1与字符串变量2相等，则条件为真 |\n| IFNIDN 变量1, 变量2 | 字符串变量1与字符串变量2不相等，则条件为真 |\n\n•表4.1\
    \ 条件汇编伪指令\n\n## 【例4.25】试用条件汇编编写一宏定义，能完成多种DOS系统功能调用。\n\n源程序如下：\n\n```\nDOSYS  \
    \      MACRO N, BUF\n             IFE     N\n             EXITM\n            \
    \ ENDIF\n             IFDEF  BUF\n             LEA     DX, BUF\n             MOV\
    \     AH, N\n             INT     21H\n             ELSE\n```\n\n```\nMOV AH,\
    \ N\nINT 21H\nENDIF\nENDM\n\n; .......................\nDATA SEGMENT\nMSG DB 'INPUT\
    \ STRING: $'\nBUF DB 81, 0, 80 DUP (0)\nDATA ENDS\n\nSTACK SEGMENT STACK\nDB 200\
    \ DUP (0)\n```\n\n```\nSTACK      ENDS\nCODE       SEGMENT\n           ASSUME\
    \ DS: DATA, CS: CODE, SS: STACK\nBEGIN:     MOV   AX, DATA\n           MOV   DS,\
    \ AX\n           DOSYS 9, MSG\n           DOSYS 10 , BUF\n           DOSYS 4CH\n\
    CODE ENDS\nEND  START\n```\n\n则以上三条宏指令展开后的语句为：\n\n```\n+ LEA    DX, MSG\n+ MOV\
    \    AH, 9\n+ INT    21H\n+ LEA    DX, BUF\n+ MOV    AH, 10\n+ INT    21H\n+ MOV\
    \    AH, 4CH\n+ INT    21H\n```\n\n## 存储器及接口\n\n主讲人：黄永平\n\n## 目录\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_524_0.png)\n\
