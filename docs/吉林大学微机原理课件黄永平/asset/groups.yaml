    EFLAGS. VM=1\n虚拟8086模式是从保护模式进入的。\n\nLINUX内核源代码情景分析(上)--毛德操.浙江大学.pdf 第一章内容\n\n\
    《保护方式下的80386及其编程清华大学出版社周明德主编\n\n## 输入输出接口\n\n## 目录\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_616_0.png)\n\
    \n- 一、接口概述\n- 二、\n- 三、\n- 四、\n\n## 一.接口概述\n\n定义：\n\n- 计算机接口(简称接口，Interface)：两个系统或部件之间的交接部分，包括硬件接口和软件接口。\n\
    - 端口(Port)：一个接口电路中，可寻址的寄存器。一个接口中可以有多个端口。\n\n接口作用：\n\n- 外设种类；\n- 外设速度；\n- 外设信号类型；\n\
    - 外设信息格式。\n\n接口的四个功能：\n\n- 地址译码或设备选择；\n- 数据缓冲和锁存；\n- 信息格式和电平转换；\n- 数据传送协调(握手)。\n\
    \n## 接口分类\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_619_0.png)\n\n## 二.I/O端口地址选择\n\
