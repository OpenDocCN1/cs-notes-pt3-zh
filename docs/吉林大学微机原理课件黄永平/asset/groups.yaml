    # 8088中有几条用于判断有符号数大小的转移指令，如：


    | JG / JNLE | 大于则转移 | 条件为： O^ S = 0 且 Z=0 |

    | JL / JNGE | 小于则转移 | 条件为： O^ S = 1 |


    # 同样有几条用于判断无符号数大小的转移指令，如：


    | JA / JNBE | 高于则转移 | 条件为： C=0 且 Z=0 |

    | JBE / JNA | 低于或等于则转移 | 条件为： C=1 或 Z=1 |'
