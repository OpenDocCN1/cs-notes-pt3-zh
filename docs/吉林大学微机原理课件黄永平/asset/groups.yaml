    \n## 四、8086/8088的总线周期\n\nIBM PC/XT 共有七种总线周期：\n\n1. 存储器读总线周期\n2. 存储器写总线周期\n3. I\
    \ / O读总线周期\n4. I / O写总线周期\n5. 中断响应周期\n6. 存储器读和 I/O 写总线周期\n7. 存储器写和 I/O 读总线周期\n\
    \n8088/8086启动的的总线周期\n\nDMA(直接存储器存取)启动的的总线周期\n\n## 五、8088/8086总线形成\n\n当8088CPU与存储器和外设构成一个计算机系统时，根据所连接的存储器和外设的规模，8088可以有两种不同的组态。\n\
    \n### 1. 最小模式\n\n当所连的存储器容量不大，I/O端口不多时。\n系统的地址总线——CPU的AD₀~AD₇，A₈~A₁₅，A₁₅~A₁₉ 通过地址锁存器8282(3片)构成。\n\
    系统的数据总线——直接由AD₀~AD₇提供，或通过数据收发器8286(1片)供给。\n系统的控制总线——直接由CPU的控制线供给。\n\n### 2. 最大模式\n\
    \n当要构成的系统较大，要求较强的驱动能力时。\n系统的地址总线——CPU的AD₀~AD₇，A₈~A₁₅，A₁₅~A₁₉ 通过地址锁存器8282 (3片)构成。\n\
    系统的数据总线——通过数据收发器8286供给。\n系统的控制总线——通过总线控制器8288供给(***)。\n\n最大模式配置和最小模式配置有一个主要的差别：最大模式下多了一个8288总线控制器。\n\
    \n两种组态通过8088引脚信号MN/MX决定\n\n- 在8086的最小模式中，硬件连接上有如下几个特点：\n- （1）MN/MX引脚接+5V，决定了8086工作在最小模式。\n\
    - （2）有一片8234A，作为时钟发生器。\n- （3）有三片8282或74LS373，用来作为地址锁存器。\n- （4）当系统中所连接的存储器和外设比较多时，需要增加系统数据总线的驱动能力，这时，可选用两片8286或74LS245作为总线收发器。\n\
    \n## 8086CPU的引脚信号\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_83_0.png)\n\n8086CPU采用双列直插式的封装形式，具有40条引脚，见图2-5。它采用分时复用的地址/数据总线，所以有一部分引脚具有双重功能，即在不同时钟周期内，引脚的作用不同。\n\
