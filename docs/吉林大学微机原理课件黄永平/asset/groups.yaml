    ## 5)段内返回指令 RET

    ; IP ← Stack , SP ← SP +2 (IP出栈)


    ## 6)段内带参数返回指令 RET n

    ; IP ← Stack , SP ← SP +2 (IP出栈)

    ; SP ← SP + n


    ## 7)段间返回指令 RETF

    ; IP ← Stack , SP ← SP +2 (IP出栈)

    ; CS ← Stack , SP ← SP +2 (CS出栈)


    ## 8)段间带参数返回指令 RETF n

    ; IP ← Stack , SP ← SP +2 (IP出栈)

    ; CS ← Stack , SP ← SP +2 (CS出栈)

    ; SP ← SP + n


    ## RET n


    在调用子程序时，有时需要传递参数，一种方式是主程序将参数压栈，以便子程序调用。


    而子程序返回后，该参数即无用，若留在堆栈中则占用堆栈空间，故用 RET n 指令将其释放。


    例如： RET 4


    - 不用RET n的方法:

    - • 进入子程序后首先弹出断点并保存到寄存器中;

    - • 弹出参数并使用;

    - • 压入保存的断点.


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_329_0.png)


