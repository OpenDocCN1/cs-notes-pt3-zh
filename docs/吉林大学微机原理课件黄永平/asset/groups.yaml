    # POP AX


    指令分两步执行：


    +   1. 先将SP所指单元内容送至AL,然后

    +      SP+1→SP；


    +   2. 再SP所指单元内容送至AH,然后

    +      SP+1→SP


    例： MOV AX,5678H

    POP AX


