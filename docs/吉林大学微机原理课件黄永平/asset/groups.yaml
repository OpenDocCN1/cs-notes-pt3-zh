    # 六、保护模式下访问操作与保护机制


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_594_0.png)


    # 3类保护机制：


    +   - 任务间存储空间的保护；

    +   - 段属性和界限的保护；

    +   - 特权级保护。


    # 3种形式特权管理：


    +   - 当前任务特权级CPL (CS中最低两位)；

    +   - 请求特权级RPL (请求操作的特权级)；

    +   - 描述符特权级DPL (目标段的特权级)。


    # 保护机制：


    +   - 特权级为P段中的数据，可以由特权级高于或等于P的段中运行的程序使用 (简:高级可访问低级数据)；

    +   - 特权级为P代码段，可以由特权级低于或等于P下的任务调用 (用特殊的方式:CALL, INT) (简:低级程序可调用高级程序)；'
  - '[PAGE 595]


    # 六、保护模式下访问操作与保护机制


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_595_0.png)


