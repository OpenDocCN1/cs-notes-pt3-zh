    DAA调整


    ### (3). 调整指令


    #### (b)压缩BCD码减法调整指令 DAS


    ; AL7 AL6 AL5 AL4 AL3 AL2 AL1 AL0


    > 9 或 CF = 1 - 6


    > 9 或 AF = 1 - 6


    压缩BCD码 - 压缩BCD码 → BCD码


    DAS调整


    Decimal Adjust After Subtraction


    ### (3). 调整指令


