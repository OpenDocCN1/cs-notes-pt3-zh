  - "[PAGE 408]\n\n# 五、汇编语言源程序的结构\n\nHYPer\n\n# 2.EXE源程序结构1\n\nMASM 5.0, Emu8086环境\n\
    \nDS原指向PSP,PSP第1字节位置压栈\n\n指向自己的数据段 DSEG。\n\n```\n或者\nMOV AH, 4Ch\nINT 21h\n```\n\
    \n若用上边的代码结束，主过程开始3个指令可以不用。\n\n```\n;*****1.开始定义数据段**************************\n\
    DSEG SEGMENT 'DATA'\n    X DB ...\n    Y DW ...\nDSEG ENDS\n;*****2.开始定义堆栈段**************************\n\
    SSEG SEGMENT STACK 'STACK'\n    DW 100h DUP(?) ;自己的堆栈,够用就行.\nSSEG ENDS\n;*****3.开始定义代码段**************************\n\
    \nCSEG SEGMENT 'CODE'\n    ASSUME CS:CSEG,DS:DSEG,SS:SSEG\n;------3.0主过程开始----------------------------\n\
    Main PROC FAR\n    PUSH DS ;返回地址入栈，与RET对应\n    MOV AX, 0\n    PUSH AX\n    MOV\
    \ AX, DSEG ;指向自己的数据段DSEG\n    MOV DS, AX\n    ;!主过程代码\n    RETF ;执行PSP头首位置的int\
    \ 20H,返回DOS.\nMain ENDP\n;------3.1子过程开始----------------------------\nP_Name PROC\
    \ NEAR\n    ;!子过程代码\n    RET\nP_Name ENDP\nCSEG ENDS\nEND Main ;开始进程是Main\n```"
