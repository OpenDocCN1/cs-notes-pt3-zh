    # 状态标志寄存器


    |  | O | D | I | T | S | Z |  | A |  | P |  | C |


    状态标志


    进位标志C（Carry Flag）——当结果的最高位产生一个进位或借位，则C=1，否则C=0。


    溢出标志O（Overflow Flag）——在算术运算中，带符号数的运算结果超出了8位或16位带符号数能表达的范围，则O=1，否则O=0。


    8位（字节）运算  -128 —— +127


    16位（字）运算  -32768 —— +32767


    符号标志S（Sign Flag）——结果的最高位（D15或D7）为1，则S=1，否则S=0。


    零标志Z（Zero Flag）——若运算的结果为0，则Z=1，否则Z=1。


    奇偶标志P（Parity Flag）——若结果中‘1’的个数为偶数，则P=1，否则，P=0。


    辅助进位标志A（Auxitiary Flag）——在字节操作时，由低半字节(第3位)向高半字节，字操作时低字节向高字节有进位或借位，则A=1，否则A=0。


    控制标志


    方向标志（Direction Flag）——D=1，串操作时地址自动减量，D=0，串操作时地址自动增量。


    中断允许标志（Interrupt-enable Flag）——I=1，则允许CPU接收外部的中断请求，I=0，则屏蔽外部中断请求。


    追踪标志（Trace Flag）——T=1，使处理机进入单步方式，以便于调试。'
  - '[PAGE 60]


    例：两个带符号数 64 h , 64 h 相加。


    0 1 1 0 0 1 0 0

    + 0 1 1 0 0 1 0 0

    ----------------

    1 1 0 0 1 0 0 0


    +   O=1（运算结果超过127）；

    +   C=0；

    +   Z=0；

    +   S=1；

    +   P=0；

    +   A=0。'
