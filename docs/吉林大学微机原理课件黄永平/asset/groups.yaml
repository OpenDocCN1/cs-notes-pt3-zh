    页式寻址，也可以采用段页式寻址。\n\n逻辑地址\n64TB\n\n分段部件\n段式寻址\nCR0.PE=1\n\n线性地址\n\n分页部件\n页式寻址\n\
    CR0.PG=1\n\n物理地址\n4GB\n\nLinux中，逻辑地址=线性地址\n\n## 从线性地址到物理地址\n\n- 页目录表4kB(1K页，每页4字节);\n\
    - 每个页表4kB(1K页，每页4字节)，共有1k个页表;\n- 每页4KB; 共1M页\n\nCR3\n页目录表基址R\n\n页目录表\n页目录描述符\n\
    \n页表0\n页描述符\n\n页表1\n页描述符\n\n页表1023\n页描述符\n\n存储器\n\n页目录(10)\n页表(10)\n偏移(12)\n线性地址\n\
    \nx4\nx4\n4KB/页\n\n页表基地址\n页基地址\n\n## 页目录描述符&页描述符\n\n32\n页表基址(20)\nAVL 00 D A 00\
    \ V W P\n0\n\n页目录描述符(4字节)\n\n32\n页基地址(20)\nAVL 00 D A 00 V W P\n0\n\n页描述符(4字节)\n\
    \n- AVL=可使用位\n- D=出错/未出错\n- A=该页(页表) 已访问/未访问\n- V=用户/监控 使用\n- W=该页(页表) 允许/不允许写\n\
    - P=该页(页表) 存在/不存在\n\n## 九段页式存储管理\n\n既有段式寻址，也有页式寻址。80386以上CPU采用。\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_612_0.png)\n\
    \n## HYPer\n\n## 段描述符表\nGDT/LDT\n\n表\n基址R\n\n段\n描述符(8)\n\nCR3\n\n页目录表\n基址R\n\n\
