    什么是一致代码段和非一致代码段？


    # 特权级检查：


    (1) 目标是一致代码段 (C=1, 共享)：


    级CPL ≤ DPL时，可转移，否则异常；转移后CPL不变。 RPL不检查。用户可使用内核服务代码。


    (2) 目标是非一致代码段 (C=0, 不共享)：


    级 (CPL=DPL) & (RPL ≥ CPL) 时，可转移，否则异常。转移后CPL不变。用户不可使用内核代码，只是内核内部代码间的转移。


