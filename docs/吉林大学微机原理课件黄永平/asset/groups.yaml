    \n## 5. 寄存器相对寻址\n\n所谓变址寻址即以基准寄存器BX、BP、SI、DI加上给定的8位或16位偏移量作为操作数的有效地址。段地址规则同上。\n\
    \n例：\n\n```\nMOV AX, MASK[SI]\n```\n\n```\nMOV AX, [SI+MASK]\n```\n\nEA = { BP\n\
    BX\nSI\nDI } + Disp8(Disp16)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_176_0.png)\n\
    \n## MOV AL, [BX+5]\n\n例如： MOV AL, [BX+5];\nDS=6000H， BX=2000H，\nBX的内容加上8位位移量05H作为操作数的有效地址。\n\
    传送数据段中的一个字节到AL中。如果使用BP，则隐含地表示操作数存放在堆栈段中。\n\nDS 6000H DS\nBX 2000H BX\nEA=2000H+05H=2005H\n\
    AX AL 9AH\n代码段\n操作码\n操作码\n05H\n数据段\n62005\n9AH\n62005\n\n## 寄存器相对寻址 mov AX, 1000[SI]\n\
    \n## 通用寄存器\n\n## 地址加法器\n\n## 内部暂存器\n\n## 执行部分 : EU\n\n## 总线接口部分 : BIU\n\n## 代码段\
    \ CS\n\n## 数据段 DS\n\n## 堆栈段 SS\n\n## 6. 基址加变址寻址\n\n基址加变址寻址\n即以某一基地址寄存器（通常为BX、BP）的内容，加上某一变址寄存器（通常为SI、DI）的内容，形成操作数的有效地址。\n\
    段地址规则同上。\n\n例：\n\n```\nMOV AX, [BX + SI]\n```\n\n```\nEA = { BP \\\\ BX } + {\
    \ SI \\\\ DI }\n```\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_179_0.png)\n\n\
    ## MOV AX, [BX+SI]\n\n- 例如： MOV AX, [BX+SI]； BX的内容与SI的内容之和作为操作数的有效地址。传送数据段中的一个字。\n\
    \nDS 5000H DS\n\nBX 2000H BX\n\nSI 0006H SI\n\nEA=2000H+06H=2006H\n\nAX ABH 78H\n\
    \n50000H + EA\n\n52000H\n\n78H 52006H\n\n代码段\n\n数据段\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_180_0.png)\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_181_0.png)\n\n## 7. 相对基址加变址寻址\n\n相对基址加变址寻址\
    \ 即以某一基地址寄存器（通常为BX、BP）的内容，加上某一变址寄存器（通常为SI，DI）的内容，再加上给定的8位或16位偏移量，形成了操作数的有效地址。\n\
    \n段地址规则同上。 例：\n\n```\nMOV AX, MASK[BX][SI]\n```\n\n```\nMOV AX, [BX+SI+MASK]\n\
    ```\n\nEA= { BP BX } + { SI DI } + Disp8(Disp16)\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_182_0.png)\n\
    \n## MOV AH, [BX+DI+1234H]\n\n- 例如： MOV AH, [BX+DI+1234H]；\n- BX的内容加上DI的内容再加上位移量1234H作为操作数的有效地址。\n\
    \nDS 4000H DS\n\nBX 0200H BX\n\nDI 0010H DI\n\nEA=0200H+0010+1234H=1444H\n\nAH\n\
    AX 50H AL\n\nEA\n\n4000H + 41444H\n\n代码段\n\n数据段\n\n操作码\n操作码\n34H\n12H\n•\n\n50H\n\
    41444H\n\n## 三、其它寻址方式\n\n- 1. 串操作指令寻址方式\n- 2. I/O端口寻址方式\n- 3. 转移指令寻址方式\n- 4. 堆栈寻址方式\n\
    \n(1)段内相对寻址： JMP short addr8/16/32\n(2)段内间接寻址： JMP BX\nJMP WORD PTR[BX+disp]\n\
    (3)段间直接寻址： JMP FAR PTR addr\naddr = CS:disp\n(4)段间间接寻址： JMP DWORD PTR[SI+disp]\n\
    \n## 指令系统\n\n- 一、 IBM PC(8086/8088) 指令系统\n- 二、 数据传送指令\n- 三、 算术运算指令\n- 四、 逻辑运算指令\n\
    - 五、 串操作指令\n- 六、 控制转移指令\n- 七、 处理机控制指令\n\n## 一、 IBM PC(8086/8088) 指令系统\n\n8086/8088\
    \ 指令系统可分为六组：\n\n- - 数据传送指令\n- - 算术指令\n- - 逻辑指令\n- - 串处理指令\n- - 控制转移指令\n- - 处理机控制指令\n\
    \n隐喻：\n物流部门\n职能部门\n决策部门\n\n## 1. 通用数据传送指令\n\nHYPer\n\n## (1) 基本传送指令 MOV d, s ;d←s\n\
    \n源操作数s——寄存器、存储器、立即数\n\n目的操作数d——寄存器、存储器\n\n执行的操作： d ← s\n\nMove\nCopy from d to\
    \ s\n\n# Data\n\nRc\n\nM\n\nRs (cs不可变)\n\nMea= [BP\nBX] + [SI\nDI] + [Disp8\n\
    Disp16]\n\n等宽传送原则\n\n## 实例：\n\n- - R-R: CPU内部寄存器之间的数据传送\n  MOV AL, BL        MOV\
    \ DX, DI\n  MOV SI, BP        MOV DS, BX\n  MOV AX, DX\n\n- - R←Data: 立即数传送到CPU内部通用寄存器组（AX,\
    \ BX, CX, DX, BP, SP, DI, SI）\n  MOV CL, 4\n  MOV DX, 03FFH\n  MOV DI, 04BFH\n\
    \n- - R-M: CPU内部寄存器(除CS, IP外)与存储器（所有寻址方式）之间的数据传送\n  MOV BX, BUFFER        MOV\
    \ [DI], CX\n  MOV AL, [2000]        MOV SI, BLOCK[BP]\n  MOV AX, [SI]        \
    \  MOV DS, DAT[SI+BX]\n\n- - M←Data: 立即数给存储单元赋值\n  MOV WORD PTR[2000], 10\n  MOV\
    \ BYTE PTR[BX+DI], 30\n\n## 注意事项：\n\n- 1. Rs←X-Data: 立即数不能直接送段寄存器, MOV DS, 3000H\n\
    - 2. Data←X-.. : 目标操作数不允许用立即数方式, MOV 2000H, AL\n- 3. M-X-M: 不允许在两个存储单元间传送数据, MOV\
    \ [2000H], [3000H]\n- 4. Rs-X-Rs: 不允许在两个段寄存器之间传送数据, MOV DS, ES\n- 5. MOV 指令不影响标志位Flags。\n\
    - 6. CS不可变: MOV CS, AX\n\n例1：把地址为AREA1（段内偏移量）的存储单元的内容，传送至同一段内的地址为AREA2的存储单元中。\n\
    \n```\nMov AREA2, AREA1\n```\n\n```\nMov AL, AREA1\nMov AREA2, AL\n```\n\n|  |\
