    # 五、指令执行时间


    +   指令周期 ——执行一条指令所需的时间称为指令周期。


    在8088/8086中，由于它的并行处理的特点，一条指令的执行时间为：


    取操作数+执行指令+传送结果


    进一步说：


    基本时间+计算有效地址的时间+为了读取操作数和存放操作结果而访问内存的时间


    > （但是，在8086/8088中不同的指令的指令周期是不同的，因此我们再将其细化，把一个指令周期划分为一个个总线周期。）


    +   总线周期——CPU从存储器或输入输出端口，存（或取）一个字节所需的时间，即为总线周期。


    +   T状态——每个总线周期通常包含4个T状态。T状态是8088中处理动作的最小时间单位，它就是时钟周期。（8088的时钟频率为5MHz，故时钟周期，也即一个T状态为200ns。）'
