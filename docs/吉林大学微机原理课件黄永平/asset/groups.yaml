    - （2）有一片8234A，作为时钟发生器。\n- （3）有三片8282或74LS373，用来作为地址锁存器。\n- （4）当系统中所连接的存储器和外设比较多时，需要增加系统数据总线的驱动能力，这时，可选用两片8286或74LS245作为总线收发器。\n\
    \n## 8086CPU的引脚信号\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_83_0.png)\n\n8086CPU采用双列直插式的封装形式，具有40条引脚，见图2-5。它采用分时复用的地址/数据总线，所以有一部分引脚具有双重功能，即在不同时钟周期内，引脚的作用不同。\n\
    \n## 8086 最小模式\n\n+5V\n\n8284A\n\nREADY\n\n8086 CPU\n\nREADY CLK RESET TEST HOLD\
    \ HLDA NMI INTR INTA M/IO WR RD\n\nALE BHE A19—A16 AD15—AD0 DT/R DEN\n\nSTB 8282\
    \ OE\n\n8286 T OE\n\n控制总线 CB\n\n系统总线\n\n地址总线 A19～A0 AB\n\n数据总线 D15～D0 DB\n\nALE：地址锁存允许信号。\n\
    BHE：数据总线高位允许信号；与A0合起来选择存储体。\nDT/R：数据发送/接收，数据方向控制。\nDEN：数据有效。\n\nBHE\n"
