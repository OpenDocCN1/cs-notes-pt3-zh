    # 8、替换策略


    问题：替换策略


    # 直接映射


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_567_0.png)


    +   - 只用一个标记来比较地址

    +   - 存储单元A可以精确地存储在某个高速缓存行中


    # N路组相联


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_567_1.png)


    +   - 同时用N个标记来比较地址

    +   - 存储单元A可以精确地存储在某个组中，但N个高速缓存行中的任何一个都属于该组


    # 全相联


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_567_2.png)


    +   - 同时用每个标记来比较地址

    +   - 存储单元A可以存储在任何高速缓存行中'
  - '[PAGE 568]


    # 8、替换策略


    LRU最近最少使用算法：


    +   • 将最经常使用的存储单元保存在高速缓存中；


    Cache每块一个计数器，命中计数器清0，其它计数器增1，最大值换出。


    LFU最不经常使用算法：


    +   • 廉价的选择方案：替换最旧的条目（按访问时间来确定日期）；


    +   • 在每个组中：保持某个计数器来指向被替换的行。


    Cache每块一个计数器，新块建立后，计数器为0,每访问一个，计数器增1，最小的换出。


    随机算法（使用随机的统一分配法来选择替换行）：


    +   • 从特定的块位置随机选取一个块换出。'
  - '[PAGE 569]


    # 9、写操作的处理


    大多数（90%以上）存储器访问都是读操作。我们应该怎样处理写操作呢？


    +   1. 写回法：写Cache时，只修改Cache中内容，而不立即写入主存，在块替换时写回主存。需要一个标志记录曾经写过。


    +   2. 写直达：利用CPU与主存的直达通路，在向Cache写数据时，把数据也写入主存中。这样，在进行块替换时，Cache就不必写主存。存储器总是最新数据。


    +   3. 记入式写：带缓存的写直达。把要写Cache中的数进行缓存中，之后写入主存。'
