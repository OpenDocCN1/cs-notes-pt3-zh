    # 二、汇编语言格式


    汇编语言中有三种基本语句：


    +   - 指令语句——汇编时，产生对应的机器目标代码。

    +   - 伪指令——汇编时，无目标代码，用于定义符号、分配内存、初始化存储器。

    +   - 宏指令——用宏名称来定义的一段指令序列。(如C中#define)'
  - '[PAGE 370]


    # 二、汇编语言格式


    指令语句格式(→机器指令)


    ```

    [标号：] 机器指令助记符 [操作数] [; 注释]

    ```


    标号是机器指令语句存放地址的符号表示，代表该指令目标代码的第一个字节地址，后面必须紧跟冒号“：”。


    汇编指令→机器指令

    指令助记符为语句的核心成分，表示了该语句的操作类型。


    操作数表示指令助记符的操作对象。


    注释均以分号开始，它可占一行或多行，一般放在一条语句的后面。


    ```

    next: MOV AX, BX ; 把BX内容送到AX

    ```'
