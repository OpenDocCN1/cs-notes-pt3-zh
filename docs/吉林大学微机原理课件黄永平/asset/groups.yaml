    ## 3.串扫描指令


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_278_0.png)


    | 名称 | 格式 | 功能 | 状态标志 | 控制标志 |

    | --- | --- | --- | O S Z A P C | D I T |

    | 字节串扫描指令 | SCASB | 字节串扫描 | O S Z A P C | 设置D |

    | 字串扫描指令 | SCASW | 字串扫描 | O S Z A P C | 设置D |

    |  | REPE/REPZ | 当相等/为零重复 | 不影响 |  |

    |  | REPNE/REPNZ | 当不相等/不为零重复 | 不影响 |  |


    -   - D为方向标志（Direction Flag）：

    -     D=1，串操作时地址自动减量，指令 STD； D=0，串操作时地址自动增量。指令 CLD

    -   - REPE和REPZ是同一条指令的两种不同表示形式。

    -   - REPNE和REPNZ是同一条指令的两种不同表示形式。


    ## (1)字节串扫描指令 SCASB


    ```

    ; AL - ES:[DI] （→Flag）

    DI ← DI ±1

    ```


    Compare bytes: AL from ES:[DI].


    ## (2)字串扫描指令 SCASW


    ```

    ; AX - ES:[DI] （→Flag）

    DI ← DI ±2

    ```


    Compare words: AL from ES:[DI].


    * SCAS = SCASB或SCASW


    常用于在某一内存缓冲区中找指定字符


    ## (4)当不相等/不为零重复前缀指令


    REPNE/REPNZ SCASB

    REPNE/REPNZ SCASW


    ; 重复 SCASB 或 SCASW 的操作，直到 CX=0 或 Z=1，每执行一次 SCAS 时，CX ← CX -1。


    CX=0 or Z=1

    (计数结束,或比较相等)时


    CX≠0 and Z=0 ?


    N


    Y


    CX-1→CX


    SCAS


    结束


    循环CX次或Z=1(相等)时退出循环


    -   • CX≠0(计数没结束)且 Z=0(两数不相等)时循环,

    -   • SCAS = SCASB或SCASW


