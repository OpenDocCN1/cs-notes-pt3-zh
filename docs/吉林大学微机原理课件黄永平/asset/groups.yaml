    CX≠0 and Z=0 ?


    N


    Y


    CX-1→CX


    SCAS


    结束


    循环CX次或Z=1(相等)时退出循环


    -   • CX≠0(计数没结束)且 Z=0(两数不相等)时循环,

    -   • SCAS = SCASB或SCASW


