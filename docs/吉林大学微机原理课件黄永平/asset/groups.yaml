    - 平时的记录作为期末成绩的参考。\n\n## 参考资料\n\n- 1. 《微型计算机技术及应用》 李继灿 主编 清华大学出版社\n- 2. 罗云彬 《 Windows环境下32位汇编语言程序设计》\
