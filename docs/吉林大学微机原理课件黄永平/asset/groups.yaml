    \nIBM PC/XT 的控制核心\n\n# 1. 8088/ 8086 CPU\n\n通用寄存器\nAH AL\nBH BL\nCH CL\nDH DL\n\
    SP\nBP\nSI\nDI\n地址加法器\nΣ\n20位\n16位\nCS\nDS\nSS\nES\nIP\n内部暂存器\n输入/输出控制电路\n16位\n\
    执行部分控制电路\nALU\n标志寄存器\n8位\n指令队列缓冲器\n1 2 3 4 5 6\n执行部件（EU）\n总线接口部件（BIU）\n\n# 8086/8088引脚信号\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_95_0.png)\n\n# 2. 总线控制器 8288\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_96_0.png)\n\
    \n| S0 S1 S2 | 8088 的总线周期 | 8288 的命令输出 |\n|---|---|---|\n| 0 0 0 | 中断响应 | INTA\
