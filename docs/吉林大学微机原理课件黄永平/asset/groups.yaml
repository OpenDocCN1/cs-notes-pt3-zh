    \ 暂停 | — |\n| 1 0 0 | 取指令代码 | MRDC |\n| 1 0 1 | 读存储器 | MRDC |\n| 1 1 0 | 写存储器\
    \ | MWTC, AMWC |\n| 1 1 1 | 过渡状态 | — |\n\n| 输入信号 | S0 S1 S2 | 8088的状态信号 |\n|---|---|---|\n\
