    04h 02h ADD AL,02\nF4h HLT\n\n## 五、指令执行时间\n\n- 指令周期 ——执行一条指令所需的时间称为指令周期。\n\n在8088/8086中，由于它的并行处理的特点，一条指令的执行时间为：\n\
    \n取操作数+执行指令+传送结果\n\n进一步说：\n\n基本时间+计算有效地址的时间+为了读取操作数和存放操作结果而访问内存的时间\n\n> （但是，在8086/8088中不同的指令的指令周期是不同的，因此我们再将其细化，把一个指令周期划分为一个个总线周期。）\n\
