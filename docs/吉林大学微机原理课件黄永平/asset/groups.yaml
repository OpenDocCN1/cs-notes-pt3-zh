    \n主讲：黄永平\n辅导：\n\n- 为什么要学习本课程？\n- 本课程与其它课程的关系\n- 我们要学到什么？\n- 学习本课程的要求\n- 参考资料\n\
    - 微处理器发展历史简介\n- 微型计算机的发展\n- 微型机特点\n- 微型机的应用\n\n## 为什么要学习本课程？\n\n### 课程简介：\n\n\
    这门课主要涉及Intel系列微处理器的程序设计以及微型计算机技术，是进一步学习和掌握基于Intel系列微处理器的电子、通信和控制系统的程序设计和接口技术以及芯片开发的入门课程。\n\
    \n## 为什么要学习本课程？\n\n主要内容：\n\n- 汇编语言： 80X86宏汇编语言的程序设计方法及应用。\n- 微机原理： 微处理器结构，存储器原理，中断系统在微机系统中的实现等等。\n\
    - 接口技术： 基本的I/O接口芯片（8253，8255A，8251A，8237A等），常用总线及接口（ISA，EISA，VESA，PCI，USB，AGP）。\n\
    \n## 为什么要学习本课程？\n\nQ:这门课的地位？\n\nA:专业基础课，软硬件的交汇点\n\nQ:这门课的作用？\n\nA:从宏观上把握了计算机的脉络\n\
    \nQ:学好这门课有什么作用？\n\nA:高手必由之路，90%的病毒（除宏病毒外）都是用汇编写的。例如：CIH病毒；操作系统底层；进行硬件设计必须学的课程。\n\
    \n## 本课程与其它课程的关系\n\n计算机网络\n\n计算机系统结构\n\n计算机接口技术\n\n微机原理&汇编语言\n\n计算机组成原理\n\n模拟电路&数字逻辑\n\
    \n高级语言级\n\n操作系统级\n\n汇编语言级\n\n一般机器级\n\n微程序设计级\n\n其它软件技术\n\n高级程序语言\n(C++、Java…)\n\
    \n操作系统\n数据结构\n编译原理\n\n## 我们要学到什么？\n\n### 目标：\n\n通过本课程的学习，使大家掌握在Intel系列微处理器环境下工作和解决问题的能力。同时具备一定的新型接口芯片的设计和开发能力。\n\
    \n- 1. CPU内存结构及引脚特性。\n- 2. 指令系统（寻址方式）\n- 3. 硬件连接（CPU—M； CPU—I/O）（时序）\n\n## 我们要学到什么？\n\
    \nHYPer\n\n### 宗旨：\n\n以8086/8088为基础，以Pentium为核心。\n\n（为掌握其它CPU的学习及设计打下了良好的基础）\n\
    \n## 学习本课程的要求\n\n### 注意学习方式的变化\n\n- 要培养对本课程的兴趣，带着问题学习本课程。（...）\n- 教师只指出要点\n  要通过自学、研读参考书掌握内容。\n\
    - 善于发现问题、提出问题\n  要努力寻求问题的答案。\n\n## 学习本课程的要求\n\n- 每节课随机点名，对缺课的学生进行记录。\n- 按时交作业，作业成绩记录。\n\
    - 平时的记录作为期末成绩的参考。\n\n## 参考资料\n\n- 1. 《微型计算机技术及应用》 李继灿 主编 清华大学出版社\n- 2. 罗云彬 《 Windows环境下32位汇编语言程序设计》\
    \ 第2版\n- 3. 冯博琴、吴宁《微型计算机原理与接口技术（第3版）》\n\n## 微处理器发展历史简介\n\n### 机械时代：\n\n- 中国和古巴比伦的abacus，使用至今。\n\
    - 1642年，法国Blaise Pascal，机械式计算器\n- 1823年，英国Charles Babbage，\n  “Analytical engine”，(分析机)，为海军绘制导航表，采用卡片输入方式。\n\
    \n## 微处理器发展历史简介\n\n### 电子时代：\n\n- 1889，Hollerith，存储数据的穿孔卡片，及电动机驱动的机械式计算器。\n- 1896，Hollerith，Tabulating\
    \ Machine Company，\n  -> International Business Machines Corporation\n- 1942，德国Konrad\
    \ Zuse，第一台电子计算机，Z3\n- 1943，Alan Turing，第一台真正电子计算机，“巨人”，破译密码，不可编程。专用计算机。\n- 1946，ENIAC，宾夕法尼亚大学，第一台通用可编程计算机。\n\
    - 1948，贝尔实验室，晶体管\n- 1958，TI，Jack Kilby，集成电路\n\n## 微处理器发展历史简介\n\n### ■ 微处理器时代：\n\
    \n- 1971，Intel，Marcian E. Hoff，4004 微处理器\n- Intel 4004，8008，8080，8085，80x86，Pentium，Pentium\
    \ pro，Pentium 2,3,4\n- Zilog Z8，Z8000，Z80000...\n- Motorola MC6800，68000，68010，68020，68040...\n\
    - AMD 133，150，K6，K6-II，K6-III，Duron，Athlon\n\n## 微型计算机的发展\n\n▶第一阶段（1971-1973）：4位微处理器和低档8位微处理器的时期。典型的微型机以Intel\
    \ 4004和Intel 8008为基础。微处理器和存储器采用PMOS工艺，工作速度很慢。微处理器的指令系统不完整；存储器的容量很小，只有几百字节；没有操作系统，只有汇编语言。主要用于工业仪表、过程控制或计算器中。\n\
    \n## 微型计算机的发展\n\n▶ 第二阶段（1974-1977）：8位微处理器的时期。典型的微处理器有Intel 8080/8085、Zilog公司的Z80及Motorola公司的6800。微处理器采用高密度MOS（HMOS）工艺，具有较完整的指令系统和较强的功能。存储器容量达64KB，配有荧光屏显示器、键盘、软盘驱动器等设备，构成了独立的台式计算机。配有简单的操作系统（如CP/M）和高级语言。\n\
    \n## 微型计算机的发展\n\n▶ 第三阶段（1978-1981）：以16位和准32位微处理器的时期。如Intel公司的8086、Motorola的68000和Zilog的Z8000。微处理器采用短沟道高性能NMOS工艺。在体系结构方面吸纳了传统小型机甚至大型机的设计思想，如虚拟存储和存储保护。\n\
    \n## 微型计算机的发展\n\n▶ 第四阶段（20世纪80年代）：32位微处理器的时期。80年代初，IBM公司推出开放式的IBM PC，这是微型机发展史上的一个重要里程碑。IBM\
    \ PC采用Intel 80x86（当时为8086/8088、80286、80386）微处理器和Microsoft公司的MS DOS操作系统并公布了IBM\
    \ PC的总线设计。\n\n## 微型计算机的发展\n\n第五阶段（20世纪90年代开始）：\n\nRISC（精简指令集计算机）技术的问世使微型机的体系结构发生了重大变革。\n\
    \nIntel Pentium, Pentium Pro, Pentium MMX, Pentium I, Pentium II, Pentium III.\n\
    \n## 微型机特点\n\n- 体积小，功耗低（发热量低，稳定性高，成本低）\n- 可靠性高\n- 外部芯片配套，配置灵活\n- 性能高，价格低\n\n##\
    \ 微型机的应用\n\n96年统计结果，微机装机量超过2.6亿台，98年统计数据，96%以上的微机安装Windows操作系统。\n\n- 科学计算\n- 信息处理\n\
    - 计算机控制\n- 智能仪器\n- 计算机通信\n- 家用电器\n- CAD/CAM/CAI\n- 娱乐\n\n## 微型机的分类\n\n- 单片机\n\
    - 单板机\n- 个人计算机\n- 多用户系统\n- 微型计算机网络\n\n## 设计过程\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_23_0.png)\n\
    \n## 第一章绪论\n\n主讲人：黄永平\n\n## 目录\n\n- 计算机基本结构\n- 指令系统\n- CPU执行过程\n- 微型计算机系统\n\n\
    ## 一.计算机基本结构\n\n### 什么是计算机？\n\n定义：一种存储事先已经编制好的程序和数据并能连续而自动地取出这些程序来执行，只能对事先已数字化的信息进行算术或逻辑运算的快速工具。\n\
    \nA computer is a programmable machine that receives input, stores and manipulates\
    \ data//information, and provides output in a useful format.\n（ http://en.wikipedia.org\
    \ ）\n"
