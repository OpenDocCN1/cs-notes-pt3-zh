    ## 一.计算机基本结构


    地址、控制、数据总线：


    - 地址总线： 用于传送 CPU 要访问的存储单元的地址或 I/O 端口地址，地址总线的位数决定了 CPU 可以直接寻址的地址范围。

    - 控制总线： 用来传送控制信号。

    - 数据总线： 用于 CPU 与存储器、 CPU 与外设之间传送信息。


    ## 二.指令系统


    上面我们所讲的是计算机的硬件。光有硬件，只是有了计算的可能，计算机要真正能够进行计算，还必须要有软件的配合。例如： 4 + 5 这种简单运算，需要以下几个步骤：


    - ① 把第一个数从它所在的存储单元中取出来,送至运算器；

    - ② 把第二个数从它所在的存储单元中取出来,送至运算器；

    - ③ 相加；

    - ④ 把加完的结果送至存储器中指定的存储单元.


    所有这些取数、送数、相加、存数等等都是一种操作.


    指令--我们把要求计算机执行的各种操作用命令的形式写下来，就是指令。 通常一条指令对应着一种基本操作,但是计算机怎么能够辨别和执行这些操作呢?这是由设计时设计人员赋予它的指令系统决定的.一个计算机能执行什么样的操作,能做多少种操作,是由设计计算机时所规定的指令系统决定的。


    ## 二.指令系统


    指令系统 ------ 一条指令对应着一种基本操作, 计算机所能执行的全部指令, 就是计算机的指令系统．这是计算机所固有的。


    程序 ----- 我们在使用计算机时, 必须把我们要解决的问题编成一条条指令, 这些指令的集合就称为程序. (这些指令必须是 我们所用的计算机能识别和执行的指令,
    也即每一条指令必须 是一台特定的计算机的指令系统中具有的指令.)


    源程序 --- 用户为解决自己的问题所编的程序, 称为源程序.


    指令形式 ----- 指令通常分成操作码 (Opcode) 和操作数 (Operand). 操作码表示计算机执行什么操作, 操作数指明参加 操作的数本身或操作数所在的内存中的位置.


    因为计算机只认得二进制数码, 所以计算机指令系统中的 所有指令, 都必须以二进制编码的形式来表示. 如前面例子.


    ## 二.指令系统


    因为计算机只认得二进制数码,所以计算机指令系统中的所有指令,都必须以二进制编码的形式来表示.如前面例子。


    - ① 把第一个数从它所在的存储单元中取出,送至运算器;

    - ② 把第二个数从它所在的存储单元中取出,送至运算器;

    - ③ 相加;

    - ④ 把加完的结果送至存储器中指定的存储单元.


    ```

    A0  00  20          MOV AL, [2000H]

    A8  1E  01  20      MOV BL, [2001H]

    00  D8              ADD AL, BL

    A2  00  30          MOV [3000H], AL

    ```


    ## 二.指令系统


    机器语言 ---- 计算机发展的初期，就是用指令的机器码直接来编制用户的源程序，这就是机器语言阶段。


    汇编语言 ---- 由于机器码是由一连串的 0 和 1 组成的，不好记忆，容易出错，因而后来人们用一些助记符(Mnemonic)来代替操作码，如上所示。这样，每条指令有明显的特征，易于理解记忆，这便是汇编语言阶段。


    程序的存放 ---- 要求机器能自动执行这些程序，就必须把这些程序存放到存储器的某个区域。计算机在执行时把这些指令一条条取出来加以执行。


    ## 三. CPU执行过程


    操作： 将两个数 7 和 10 相加。


    指令：


    ```

    MOV AL, 07

    ADD AL, 10

    MOV [20h], AL

    HLT

    ```


    机器指令：


    ```

    1011 0000  B0h  (MOV AL, 07)

    0000 0111

    07h

    0000 0100  (ADD AL, 10)

    04h

    0000 1010  (MOV [20h], AL)

    0Ah

    (HLT)

    1010 0010

    ```


