    # 一、汇编语言概述


    # 机器语言


    计算机能够直接识别的数据是由二进制数0和1组成的代码。机器指令就是用二进制代码组成的指令，一条机器指令控制计算机完成一个基本操作。


    用机器语言编写的程序是计算机唯一能够直接识别并执行的程序，而用其他语言编写的程序必须经过翻译才能变换成机器语言程序，所以，机器语言程序被称为目标程序。


    # 一、汇编语言概述


    # 汇编语言


    为了克服机器语言的缺点，人们采用助记符表示机器指令的操作码,用变量代替操作数的存放地址等，这样就形成了汇编语言。所以汇编语言是一种用符号书写的、基本操作与机器指令相对应的、并遵循一定语法规则的计算机语言。


    用汇编语言编写的程序称为汇编源程序。


    汇编语言是一种符号语言，比机器语言容易理解和掌握，也容易调试和维护。但是，汇编语言源程序要翻译成机器语言程序才可以由计算机执行。这个翻译的过程称为“汇编”，这种把汇编源程序翻译成目标程序的语言加工程序称为汇编程序（汇编器，编译器）。


    # 一、汇编语言概述


    - 高级语言


    汇编语言虽然较机器语言直观，但仍然烦琐难懂。于是人们研制出了高级程序设计语言。高级程序设计语言接近于人类自然语言的语法习惯，与计算机硬件无关，易被用户掌握和使用。目前广泛应用的高级语言有多种，如BASIC、FORTRAN、PASCAL、C、C++、Java，C#等等。


    例出你所知道的计算机语言有哪些？


    # 一、汇编语言概述


    # HYPer


    # 汇编语言的特点


    - (1) 汇编语言与处理器密切相关,可移植性差。

    - (2) 汇编语言程序效率高。

    - (3) 编写汇编语言源程序比编写高级语言源程序烦琐。

    - (4) 调试汇编语言程序比调试高级语言程序困难。


    # 一、汇编语言概述


    # 汇编语言的主要应用场合


    - (1) 程序执行占用较短的时间，或者占用较小存储容量的场合。

    - (2) 程序与计算机硬件密切相关，程序直接控制硬件的场合，实时控制。

    - (3) 需提高大型软件性能的场合(选一个好的C编译器可解决)。

    - (4) 没有合适的高级语言的场合。（OS中上下文保存等,如linux）


