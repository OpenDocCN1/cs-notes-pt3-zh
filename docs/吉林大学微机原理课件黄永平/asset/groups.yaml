    | DEN | 数据输出允许信号 |\n| MCE/PDEN | 双功能引脚 |\n\n# 8288时序\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_97_0.png)\n\
    \n# 8288引脚信号\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_98_0.png)\n\n# 表 2-2\
    \ S0、S1、S2 的组合和对应总线操作\n\n| S0 | S1 | S2 | 操作 |\n|---|---|---|---|\n| 0 | 0 | 0\
    \ | 发中断响应信号 |\n| 0 | 0 | 1 | 读 I/O 端口 |\n| 0 | 1 | 0 | 写 I/O 端口 |\n| 0 | 1 | 1\
    \ | 暂停 |\n| 1 | 0 | 0 | 取指令 |\n| 1 | 0 | 1 | 读存储器 |\n| 1 | 1 | 0 | 写存储器 |\n| 1\
    \ | 1 | 1 | 无源状态 |\n\n# 3. 8284时钟信号发生器\n\n8284的结构框图：\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_99_0.png)\n\
    \n# 8284的输出信号：\n\nRESET——复位信号\n\nREADY——准备好信号\n\nCLK——8088系统时钟，将晶振体三分频，产生4.77MHz的频率。\n\
    \nPCLK——外围设备用时钟信号，将CLK二分频，频率为2.387MHz。\n\nOSC——14.318MHz的频率。\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_100_0.png)\n\
    \n# 8284的输入信号：\n\nRES—— 外部复位输入；\n\nX₁,X₂——外接晶振体输入；\n\nF/ C——输入控制信号, F/ C=0时, byX₁,X₂外接晶振体形成8088时钟；\n\
    \ F/ C=1时, byEFI输入外部方波信号形成8088时钟；\n\nOSYNC——同步工作控制信号，当多个8284同时工作时使用；\n\nASYNC——准备好信号的同步控制信号；\n\
    \nRDY1——总线准备好信号；\n\nAEN1——地址允许信号；\n\n8284A在IBM PC/XT中的应用——见IBM PC/XT控制核心\n\nRDY2——总线准备好信号；\n\
    \nAEN2——地址允许信号；\n\n# 8284时序\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_102_0.png)\n\
    \n# 8284引脚信号\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_103_0.png)\n\n# 4. IBM\
    \ PC/XT 的控制核心\n\n来自电源\nPWR GOOD\n\nDMA WAIT\nRDY/WAIT\nAEN1\n\n来自DMA控制器\n来自存储控制器\n\
    \n当DMAWAIT为高，RDY/WAIT为低时，Ready输出为高电平；反之，输出低电平。\n\nU₇、U₅、U₆的存取受AENBRD的控制\n在DMA操作期间，地址只能锁存，不能送至总线。\n\
    \nAENBRD\nAEN\n\n来自系统\nAENBRD低，AEN高时，CPU控制总线，8288工作；反之，进行DMA操作。\n\n系统地址总线\n\n\
    系统数据总线\n\n系统控制总线\n\n![](img/d63acdb9d192b1c4466c984c4275a5a3_104_0.png)\n\n# 5.\
    \ 等待电路\n\nIBM PC/XT规定存储器访问周期不插入等待状态；而在I/O访问周期需插入一个等待状态。DMA操作（非动态RAM刷新）时需插入一个等待状态。\n\
    \nI/O CH RDY信号，送至U70的直接置位端，当其为0时，U70输出保持为0，产生连续请求插入等待状态的控制信号。该信号用于I/O设备在插入一个T_w仍不能完成传输的情况，传输完成后，由I/O设备使其复位。\n\
    \nI/O CH RDY\n\n非动态RAM刷新的DMA操作信号\n\nDACK0 BRD\nAEN BRD\nMEMR\n\n当上述三个信号中任一个为0时，将U70置1。\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_105_0.png)\n\n# 硬件开发过程 《----》 软件开发过程\n\
    \nProtel工具软件\nOrCAD工具软件\n\n原理设计（VHDL）\n原理模拟仿真\nPCB设计\n电磁兼容设计\n\n单板调试（调试程序）\n系统调试\n\
    \n# # 复习题\n\n1. 微型计算机系统的组成；微型计算机的结构特点。\n\n2. 8086的内部逻辑结构——BIU和EU的组成与功能；8086\n\
    微处理器的寄存器及功能；8086逻辑地址、物理地址及转换；8086两种工作方式、配置、特点。\n\n3. 8086中断向量表（以后再讲）。\n\n4. 章节习题：P16—全部习题\n\
    \n# 80x86程序设计模型\n\n# 目录\n\n+   - 程序设计模型\n+   - 实模式存储器寻址\n+   - 保护模式存储器寻址\n+  \
    \ - 页式寻址\n+   - 段页式寻址\n\n# # 一、程序设计模型\n\n程序设计模型: 程序员所需要的计算机模型。\n\n只需要知道：\n\n+\
    \   (1) CPU内部寄存器的设置及功能；\n\n+   (2) CPU与存储器的逻辑地址和物理地址关系。\n\n# # 8086/8088寄存器结构(16位)\n\
    \n![](img/d63acdb9d192b1c4466c984c4275a5a3_111_0.png)\n"
