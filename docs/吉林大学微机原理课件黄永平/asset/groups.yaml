    +   - 汇编语言： 80X86宏汇编语言的程序设计方法及应用。


    +   - 微机原理： 微处理器结构，存储器原理，中断系统在微机系统中的实现等等。


    +   - 接口技术： 基本的I/o接口芯片（8253，8255A，8251A，8237A等），常用总线及接口（ISA，EISA，VESA，PCI，USB，AGP）。'
