  md: "\n## 五、汇编语言源程序的结构\n\nHYPer\n\n### 1.COM源程序结构\n\nMASM.exe\nLink.exe\nEXE2BIN.EXE---把EXE变成COM文件\n\
    \nEmu8086环境\n\nMASM5.0、Emu8086环境\n\n```\n;-----0主程序开始----------\n    org 100h\n\
    \    ;主程序代码\n    RET ;返回DOS\n;-----1 子过程开始----------\nP_Name PROC    NEAR\n  \
    \  ;子过程代码\n    RET\nP_Name ENDP\n;-----2 定义变量----------\nX DB ...\nY DW ...\n\
