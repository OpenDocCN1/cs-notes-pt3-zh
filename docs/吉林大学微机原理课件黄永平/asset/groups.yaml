    # 8086/8088指令格式


    计算机是通过执行指令来管理计算机并完成一系列给定功能的。因此，每种计算机都有一组指令集提供给用户使用，这组指令集叫做计算机的指令系统。不同的计算机指令不同，指令集中指令的数量也不间，大体上在几十种到百余种。指令系统的功能决定了CPU的综合处理能力。8086/8088是可变长指令。


