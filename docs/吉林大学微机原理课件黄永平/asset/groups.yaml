  md: "\n## 三、伪指令\n\n### 4.字长类型(用于386以上，用来说明使用16位寻址方式或32位寻址方式)\n\n- （1） USE16:使用16位寻址方式。\n\
    - （2） USE32： 使用32位寻址方式。\n\n### 5.类别(连接时，连接程序会把类别相同的所有段放在连续的内存区域中)\n\n- `DATA`：段类别是数据段。——DS\n\
    - `CODE`：段类别是代码段。——CS\n- `STACK`：段类别是堆栈段。——SS\n- `EXTRA`：段类别是附加数据段。——ES\n\n对连接程序进行连接后存储区各段相对位置分布。\n\
    \n```\nDATA1      SEGMENT  'DATA'\nCODE       SEGMENT  'CODE'\nSTACK1     SEGMENT\
    \  'STACK'\nDATA2      SEGMENT  'DATA'\nSTACK2     SEGMENT  'STACK'\n```\n\n经连接程序连接后，各段的相对位置如下：\n\
    \n```\nDATA1      SEGMENT  'DATA'\nDATA2      SEGMENT  'DATA'\nSTACK1     SEGMENT\
    \  'STACK'\nSTACK2     SEGMENT  'STACK'\nCODE       SEGMENT  'CODE'\n```\n\n【例】有两个模块，各模块段定义如下：\n\
    \n```\n模块1：\nDATA1    SEGMENT PARA PUBLIC ‘DATA1’\nM1       DB 45H DUP (0)\nDATA1\
    \    ENDS\n\nDATA2    SEGMENT PARA COMMON ‘DATA2’\nN1       DB 102H DUP (0)\n\
    DATA2    ENDS\nEND\n```\n\n模块2:\n\n```\nDATA1      SEGMENT PARA PUBLIC ‘DATA1’\n\
    M2         DB 104H DUP (11H)\nDATA1      ENDS\n```\n\n```\nDATA2      SEGMENT\
    \ PARA COMMON ‘DATA2’\nN2         DB 105H DUP (0)\nDATA2      ENDS\n```\n\n```\n\
    DATA3      SEGMENT\nT1         DB 50 DUP (20H)\nDATA3      ENDS\nEND\n```\n\n\
    模块1、模块2连接后段的定位组合方式示意图\n\n|  |  |  |  |\n|---|---|---|---|\n| DATA1 段 | 0000H :\
    \ 0000H | 0 | M1 |\n|  |  | ↓ |  |\n|  | 0000H : 0044H | 0 |  |\n|  |  | 空 11\
    \ 个字节 |  |\n|  | 0000H : 0050H | 11H | M2 |\n|  |  | ↓ |  |\n|  | 0000H : 0153H\
    \ | 11H |  |\n|  |  | 空 12 个字节 |  |\n| DATA2 段 | 0016H : 0000H | 0 | N1 和 N2 |\n\
    |  |  | ↓ |  |\n|  | 0016H : 0104H | 0 |  |\n|  |  | 空 11 个字节 |  |\n| DATA3 段\
    \ | 0027H : 0000H | 20H | T1 |\n|  |  | ↓ |  |\n|  | 0027H : 004FH | 20H |  |\n\
    \n- 假定伪指令（ASSUME）\n- --段分配伪指令\n\n```\nASSUME 段寄存器: 段名, 段寄存器: 段名, ...\n```\n\n\
    功能：建立段寄存器与段之间的对应关系。该伪指令一般出现在代码段中。\n\n```\nASSUME CS:CODE, DS:DATA1, ES:DATA3,\
    \ SS:DATA2\n```\n\n### 段组定义伪指令（GROUP）\n\n```\n段组名 GROUP 段名，段名，...\n```\n\n功能：将GROUP后段名所指定的段分配在同一个物理存储器段中，分给该段一个段组名。\n\
    \n```\nDATA1      SEGMENT 'DATA'\n... \nDATA1      ENDS\nDATA2      SEGMENT 'DATA'\n\
    ... \nDATA2      ENDS\nAA5        GROUP DATA1, DATA2\nCODE       SEGMENT 'CODE'\n\
    ASSUME CS:CODE, DS:AA5\nSTART:     MOV AX, AA5\n           MOV DS, AX\n... \n\
    CODE       ENDS\nEND START\n```\n\n定义了二个数据段，一个代码段\n\n### 地址计数器伪指令 (ORG,EVEN,ALIGN)\n\
    \n地址计数器(偏移计数器)\n\n- $ :本指令地址 ——MASM5.0, emu8086支持\n- ORG 表达式\n  --设置地址计数器IP\n\
    - EVEN\n  --使下一变量或指令开始于偶数地址。\n- ALIGN n\n  --使下一变量或指令开始于n的整数倍地址。\n  N=2,4,8,16,...\n\
    \n### 数据定义伪指令 (DB,DW,DD,DF,DQ,DT)\n\n```\n[变量名] 操作符 操作数, 操作数, ... [; 注释]\n```\n\
    \n功能：为操作数分配存储单元，并用变量名与存储单元相联系。\n\n- DB --1 字节(字节), 定义字节变量\n- DW --2 字节(字), 定义字\
