    操作数包含在 CPU的内部寄存器中。例如寄存器AX、BX、SI、DI等，虽然操作数可在CPU的内部通用寄存器的任一个中，且它们都能参与算术运算和逻辑运算并存放运算结果。但是AX是累加器，若结果是存放在AX中，则通常指令要更短些，更紧凑些。


