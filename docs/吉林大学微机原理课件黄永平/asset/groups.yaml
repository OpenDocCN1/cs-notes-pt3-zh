    # 6、存储器层次


    # 存储器层次结构


    我们想要的是：一个又大又快的存储器！


    我们想要这样一个存储器系统：


    +   - 性能类似于1GB的静态随机存储器；但是，

    +   - 成本类似于1GB的慢速存储器。


    ！惊奇：我们几乎能够实现我们的愿望！


    关键：利用存储器的层次结构


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_553_0.png)'
  - '[PAGE 554]


    # 6、存储器层次


    # 关键思想


    +   ● 将最常使用的数据保存在既小又快的静态随机存储器中。

    +   ● 对于剩下的数据来说，几乎很少访问主存储器。

    +   ● 这种策略之所以行得通是因为：程序与数据的局部性。


    访问局部性：

    在时间 t 时，对存储单元 X 的访问意味着：在时间 t+Δt 时对存储单元 X+ΔX 的访问很可能会再次被访问，前提是 ΔX 和 Δt 接近于零。'
