    \n```\nDATA3  DW 'AB'\n```\n\n|  |  |  |  |\n|---|---|---|---|\n| DATA1→ | 100H\
    \ | 61H | a |\n|  | 101H | 62H | b |\n|  | 102H | 63H | c |\n|  | 103H | 64H |\
    \ d |\n| DATA2→ | 104H | 41H | A |\n|  | 105H | 42H | B |\n| DATA3→ | 106H | 42H\
    \ | B |\n|  | 107H | 41H | A |\n\n- ?\n\n```\nORG 400H\n\nDATA1  DB 1, 2, ?, 4\n\
    \nDATA2  DW 5, ?, 6\n\nDATA3  DF ?\n\nDATA4  DB 8\n```\n\n|  |  |  |\n|---|---|---|\n\
    | DATA1→ | 400H | 01H |\n|  | 401H | 02H |\n|  | 402H | 原值 |\n|  | 403H | 04H\
    \ |\n| DATA2→ | 404H | 05H |\n|  | 405H | 00H |\n|  | 406H | 原值 |\n|  | 407H |\
    \ 原值 |\n|  | 408H | 06H |\n|  | 409H | 00H |\n| DATA3→ | 40AH | 原值 |\n|  | 40BH\
    \ | 原值 |\n|  | 40CH | 原值 |\n|  | 40DH | 原值 |\n|  | 40EH | 原值 |\n|  | 40FH | 原值\
