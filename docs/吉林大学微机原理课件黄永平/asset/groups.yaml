    \n操作系统\n数据结构\n编译原理\n\n## 我们要学到什么？\n\n### 目标：\n\n通过本课程的学习，使大家掌握在Intel系列微处理器环境下工作和解决问题的能力。同时具备一定的新型接口芯片的设计和开发能力。\n\
    \n- 1. CPU内存结构及引脚特性。\n- 2. 指令系统（寻址方式）\n- 3. 硬件连接（CPU—M； CPU—I/O）（时序）\n\n## 我们要学到什么？\n\
