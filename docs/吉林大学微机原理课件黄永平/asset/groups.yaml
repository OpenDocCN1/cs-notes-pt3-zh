    \n【例4.1】试编写一程序计算以下表达式的值。\n\nw = (v - ( x * y + z -540 )) / x\n\n式中x、y、z、v均为有符号字数据。\n\
    \n设x、y、z、v的值存放在字变量X、Y、Z、V中，结果存放在双字变量W之中，程序的流程图如下图所示。\n\n开始\n\nX*Y→(BX:CX)\n\n\
    将z扩展为双字→(DX:AX)\n\n(BX:CX)+(DX:AX)→(BX:CX)\n\n(BX:CX)-540→(BX:CX)\n\n将V扩展成双字→(DX:AX)\n\
    \n(BX:AX)-(BX:CX)→(DX:AX)\n\n(DX:AX)/X，其商→W，余数→W+2\n\n结束\n\n```\n源程序如下：\nDATA\
    \  SEGMENT\nX  DW  200\nY  DW  100\nZ  DW  3000\nV  DW  10000\nW  DW  2 DUP (\
    \ ? )\nDATA  ENDS\nSTACK SEGMENT STACK\n    DB  200 DUP (0)\nSTACK ENDS\nCODE\
    \  SEGMENT\n    ASSUME DS: DATA, CS: CODE, SS: STACK\n```\n\n```\nSTART:     \
    \ MOV  AX, DATA\nMOV DS, AX; DATA→AX\nMOV AX, X\nIMULY       ; (X) * (Y) →DX:\
    \ AX\nMOV CX, AX\nMOV BX, DX; (DX: AX) → (BX: CX)\nMOV AX, Z\nCWD; (Z) 符号扩展\n\
    ADD CX, AX\nADC BX, DX; (BX: CX) + (DX: AX) → (BX: CX)\nSUB CX, 540\nSBB BX, 0\
    \  ; (BX: CX) -540→ (BX: CX)\nMOV AX, V\n```\n\n```\nCWD   ; （V）符号扩展\n    SUB\
    \ AX, CX\n    SBB DX, BX      ; （DX: AX）-（BX: CX）→（DX: AX）\n    IDIV X       \
    \   ; （DX: AX）/X\n    MOV      W, AX ; 商→W\n    MOV      W+2, DX     ; 余数DX→W+2\n\
    \    MOV      AH, 4CH\n    INT  21H\nCODE ENDS ; 退出DOS 状态\n    END START\n```\n"
