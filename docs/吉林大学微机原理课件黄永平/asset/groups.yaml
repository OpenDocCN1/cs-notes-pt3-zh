    # 3.任务切换


    任务切换：从执行一个任务转移到执行另一个任务。


    +   1. 每个任务有一个TSS和LDT；

    +   2. TSS描述符在GDT中；

    +   3. 任务门是门的一种，用于定位TSS描述符；

    +   4. 选择不同的TSS描述符就可以实现任务的切换；

    +   5. 可以用JMP/CALL/INT/IRET实现任务切换；

    +   6. 任务的切换有两种：

    +      - 直接任务切换；

    +      - 间接任务切换。'
