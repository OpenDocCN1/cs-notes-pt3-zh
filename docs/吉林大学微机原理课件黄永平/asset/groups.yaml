    # 7.2、全相联映射---映射


    Mem中任何数据块可以放到Cache中任何项中。


    Mem块号可以记录到Cache中的标记中。


    Cache

    项号(c位) 标记(m位) 数据块(r位)

    0

    1

    2  A  Mem[A]

    3

    4  B  Mem[B]

    ...  ...

    2^c - 1


