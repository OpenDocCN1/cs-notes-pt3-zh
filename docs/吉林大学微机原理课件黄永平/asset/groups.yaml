    - ■ 输入/输出控制电路：提供系统总线的控制信号，实现数据、地址和状态信息的分时传送。

    - ■ 执行单元控制电路：是控制、定时与状态逻辑电路。用于控制执行单元中各部件按制定的要求协调工作。


