    [符号名] 伪指令助记符 [操作数] [; 注释]

    ```


    +   常量名

    +   变量名

    +   过程名

    +   段名

    +   结构名

    +   记录名


    伪指令符指定汇编程序要完成的具体操作，如数据定义伪指令DB、DW、DD，段定义伪指令SEGMENT，假设伪指令ASSUME等。


    伪指令后面的操作数可以是常数、字符串、变量、表达式等，其个数由具体的伪指令决定，各个操作数之间必须以“逗号”分隔。


    伪指令的注释必须以“；”开始，其作用同指令语句中的注释部分。


    ```

    var1 DW 100 ; 定义一个字变量var1,其值为100

    C中 unsigned integer var1=100;

    ```'
