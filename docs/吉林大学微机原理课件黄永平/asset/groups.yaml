  - '[PAGE 603]


    # 段间间接转移


    选择符→门描述符→代码段描述符→目标代码段


    # 特权级检查：


    +   (1) 访问调用门按访问数据段规则检查特权：

    +   级 (CPL ≥ DPL1) & (RPL1 ≥ DPL1) 时，可继续，否则异常；


    +   (2) RPL2清0，最高级；


    +   (3) 访问代码段按代码段规则检查特权：


    ■目标是一致代码 (C=1, 共享)：

    级 CPL ≤ DPL 时，可转移，否则异常；转移后 CPL 不变。RPL2 不检查。适用于 JMP 和 CALL。

    用户可使用内核服务代码。


    ■目标是非一致代码 (C=0, 不共享)：

    ●JMP 指令：

    CPL = DPL 时，可转移，否则异常。转移后 CPL 不变。

    ●CALL 指令：

    级 CPL ≤ DPL 时，可转移，否则异常；转移后 CPL = DPL。


    *CALL 指令，只有 级 CPL < DPL，非一致代码时，CPL 特权级变高了!!!。


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_603_0.png)'
  - '[PAGE 604]


    # 堆栈


    同一任务内，特权级变化的转移，会引起堆栈的变化；

    特权级0、1，2的堆栈指针在本任务的TSS中；

    用CALL指令发生转移时，新堆栈指针从TSS中取出，原堆栈指针压入新堆栈栈。


    RET指令只返回到小于等于级别CPL的代码段；

    从堆栈中恢复断点CS：EIP；

    返回后的代码段选择符的RPL就是当前CPL，若CPL变化了，则旧的堆栈指针从TSS中弹出。'
