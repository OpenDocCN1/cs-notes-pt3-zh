    # 五、汇编语言源程序的结构


    Windows中可执行文件有：.COM, .EXE, .DLL, .bat, .ocx...


    +   1) COM —可执行二进制代码文件：

    +   程序只占一个段，64KB。PSP+代码 占一个段中。

    +   磁盘文件开始直接就是执行代码。无独立的堆栈段。加载后PSP头长度256字节，

    +   CS=DS=SS,IP=100h,SP=0FFFEh,范围0000~0FFFFH。 PSP最开始有一个INT 20H指令。


    +   2) EXE —可执行的浮动代码文件：

    +   程序占有多个段，DS数据段、CS代码段、ES数据段、SS堆栈段占独立段，程序加载时再定位各段。磁盘中EXE文件有512字节头信息(控制信息块)。加载后PSP头长度256字节，256字节，
    DS=ES指向PSP头; CS、SS指向程序中的段，需要重置DS、ES指向自己的数据段。 PSP最开始有一个INT 20H指令。


    +   3) DLL—动态链接库：

    +   一个EXE可以运行中加载、卸载其它的DLL。(360与TX大战，程序升级...)


    +   4) Bat --批处理文件：

    +   成批运行DOS命令脚本。'
