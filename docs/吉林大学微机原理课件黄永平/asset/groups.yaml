    ## 三、保护模式存储器寻址


    80286以上CPU有实模式和保护模式两种寻址方式。


    保护模式时，用选择符和描述符来寻址存储器。段寄存器放的是选择符，通过选择符到描述符表找到段基地址，段基地址+偏移量为内存中的物理地址。


    选择符 ——> 描述符表(描述符) ——> 存储器


