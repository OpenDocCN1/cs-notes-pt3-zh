    # 一、汇编语言概述


    # 汇编语言


    为了克服机器语言的缺点，人们采用助记符表示机器指令的操作码,用变量代替操作数的存放地址等，这样就形成了汇编语言。所以汇编语言是一种用符号书写的、基本操作与机器指令相对应的、并遵循一定语法规则的计算机语言。


    用汇编语言编写的程序称为汇编源程序。


