    \ CX, 7\nCALL display\nRET ; 返回DOS\n;-----1 子过程开始----------\ndisplay PROC NEAR\n\
    next1: MOV DL,[BX]\nMOV AH, 2\nINT 21H\nINC BX\nLOOP next1\nRET\ndisplay ENDP\n\
    ;----- 2定义变量----------\nBUF DB 0AH, 0DH, 'ABCDE'\nCODE ENDS\nEND START\n```\n\n\
    HYPer\n\n### 2.EXE源程序结构1\n\nMASM 5.0, Emu8086环境\n\nDS原指向PSP,PSP第1字节位置压栈\n\n指向自己的数据段\
    \ DSEG。\n\n```\n或者\nMOV AH, 4Ch\nINT 21h\n```\n\n若用上边的代码结束，主过程开始3个指令可以不用。\n\n\
    ```\n;*****1.开始定义数据段**************************\nDSEG SEGMENT 'DATA'\n    X DB\
    \ ...\n    Y DW ...\nDSEG ENDS\n;*****2.开始定义堆栈段**************************\nSSEG\
    \ SEGMENT STACK 'STACK'\n    DW 100h DUP(?) ;自己的堆栈,够用就行.\nSSEG ENDS\n;*****3.开始定义代码段**************************\n\
