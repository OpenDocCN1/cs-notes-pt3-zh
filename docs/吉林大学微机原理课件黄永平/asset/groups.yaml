  md: "\n## 二、功能结构\n\n8088从功能上来说分成两大部分，总线接口单元 BIU (Bus Interface Unit) 和执行单元 EU (Execution\
    \ Unit).\n\n- BIU:负责与存储器接口,即8088与存储器之间的信息传送,都是由BIU负责进行的,\n即:\n  1. BIU从内存的指定部分取出指令，送至指令队列排队。\n\
    \  2. 从内存的指定部分取出执行指令时所需的操作数，送至EU部分。\n- EU: 负责指令的执行。\n\n特点：将CPU分为两个单元，可以使取指令和执行指令同时进行，减少了CPU为取指令而等待的时间，从而提高了CPU的利用率，提高了系统的运行速度。\n\
    \n## 三、存储器组织\n\n8088有20条地址线，它的直接寻址能力为 2^20=1M，所以在一个8088组成的系统中，可以有多达1M字节的存储器，这1M字节在逻辑上可以组成一个线性矩阵，地址从00000到FFFFF。给定一个20位的地址，就\
    \ 可以从中取出所需的指令和数据。\n\n在8088内部，ALU 能进行16位的运算，有关地址寄存器如：IP、SP、BX、BP、SI、DI等都是16位的，因而对地址的运算也只能是16位。其寻址的范围最多是2^16=64K。\n\
    \n在8088中怎样形成这20位的地址呢？——分段！\n\n将内存的1M字节以64K为范围，分成若干段；在8088中设置4个段寄存器CS、DS、SS、ES，在寻址一个具体的内存单元（物理地址）时，由一个段寄存器中保存的16位基地址，加上由IP（或SP，或BP，或BX，或SI，或DI）中保存的、\n\
    \n16\n\n2¹⁶=FFFF h+1\n\n0FFFF h\n\n0FFFE h\n\n0FFFD h\n\n00001 h\n\n00000 h\n\n\
    20\n\n2²⁰=FFFFF h+1\n\nFFFFF h\n\nFFFFE h\n\nFFFFD h\n\nFFFFC h\n\n0FFFF h\n\n\
