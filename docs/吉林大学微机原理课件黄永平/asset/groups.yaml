  - '[PAGE 636]


    # DMA传送方式——基本过程


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_636_0.png)


    +   (1) I/O接口向DMAC发出DMA传送请求信号(DREQ)。

    +   (2) DMAC向CPU中的总线仲裁机构请求占用总线(HRQ)。

    +   (3) DMAC接到HLDA信号后成为总线的主控者。

    +   (4) DMAC向I/O接口发请求应答(DACK)

    +   (5) 向存储器和进行DMA传送的外设发出读写命令，开始DMA传送。

    +   (6) DMAC撤消对CPU的总线请求，交回系统总线的管理和控制权。'
  - '[PAGE 637]


    # DMA传送方式——M到I/O设备传送过程


    DMA请求过程：CPU←(总线请求)←DMAC←(DMA请求)←I/O接口


    DMA应答过程：CPU→(总线响应)→DMAC→(DMA响应)→I/O接口


    DMA传送过程：(1)DMAC→(R/W控制信号)→I/O接口


    (2)DMAC→(存储器地址、R/W控制信号)→M


    DMA结束：CPU←(总线请求撤消)←DMAC→( DMA请求撤消)→I/O接口


    CPU→(总线响应撤消)→DMAC←( DMA响应撤消)← I/O接口


    ![](img/d63acdb9d192b1c4466c984c4275a5a3_637_0.png)'
  - '[PAGE 638]


    # DMAC 8237A芯片 ——功能


    +   总线控制功能。


    +   具有用于提供交换数据地址的地址寄存器。


    +   具有数据块长度计数器。


    +   具有编程寄存器和状态寄存器。


    +   4个通道可编程DMAC。


    +   4种工作方式：

    +   (1) 单字节传送； (2) 数据块传送； (3) 请求传送； (4) 级联传送。


    +   优先级：

    +   (1) 固定优先级； (2) 循环优先级。'
