    # # 5.14 可复用资源死锁的静态分析


    条件： 已知各个进程有关资源的活动序列；

    判断，有无死锁可能性。


    +   步骤1： 以每个进程占有资源，申请资源作为一个状态，

    +   记作： (pi: aj: ak1,...,akn)=(进程: 请求: 占有);

    +   步骤2： 以每个状态为一个节点；

