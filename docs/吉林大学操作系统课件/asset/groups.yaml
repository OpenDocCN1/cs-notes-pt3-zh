    +       - The other being System Libs


    +   - 主要包括

    +     - Process manipulation

    +     - File manipulation

    +     - Communication

    +     - Others'
  - '[PAGE 941]


    # 13.7.1 有关进程的系统调用命令


    # 相关系统调用


    +   - 创建子进程

    +     - **Pid = fork()**

    +       - 子进程是父进程的复制品

    +       - 返回值：父进程为子进程编号，子进程为 **0**

    +   - 加载并执行新程序

    +     - **execl(prog, arg0,...,argn-1,0)**

    +     - 以 **arg0,...,argn-1** 为参数执行 **prog**

    +     - 覆盖原来程序，从第一条指令开始执行'
  - '[PAGE 942]


    # # 13.7.1有关进程的系统调用命令




    ```

    exit(status)

    ```


