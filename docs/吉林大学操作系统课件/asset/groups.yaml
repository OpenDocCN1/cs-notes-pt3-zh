    \ `while` 循环或第二个 `while` 循环处等待，因而满足互斥性。\n- 进展性（progress）\n    - 当仅有一个进程想进入临界区时，该进程可以立即进入；当有多个进程想进入临界区时，其二元组\
    \ `(number[i], i)` 最小的进程获准进入，因而确定进入临界区进程的决策将在有限时间内确定。\n- 有限等待性（bounded waiting）\n\
    \    - 对任意一个想要进入临界区的进程 Pi，设其抓到号码为 `number[i]`，按二元组 `(number[i], i)` 次序排在 Pi 之前的竞争进程数量是有限的，在最坏情况下\
    \ Pi 将等待 n-1 个排在其前面的进程进入并离开临界区后获得进入临界区的资格，因而满足有限等待性。\n\n## Eisenberg/McGuire算法\n\
    \n```\nenum flag[0,...,n-1] { idle, want_in, in_cs };\nint turn; // 0..n-1，初始化任意\n\
    ```\n\n- `flag[i] == idle`：进程 Pi 不想进入临界区\n- `flag[i] == want_in`：进程 Pi 想进入临界区\n\
    - `flag[i] == in_cs`：进程 Pi 想进入或已进入临界区\n\n![](img/7b6892715d0da57dced81602d7459e7e_276_0.png)\n\
    \nPi 进入：\n\n```\ndo {\n    flag[i] = want_in;\n    j = turn;\n    while (j !=\
    \ i)\n        if (flag[j] != idle) j = turn;\n        else j = (j + 1) % n;\n\
    \    flag[i] = in_cs;\n    j = 0;\n    while (j < n && (j == i || flag[j] != in_cs))\n\
    \        j++;\n} while (j != n);\nturn = i;\n```\n\nCS\n\nPi 离开：\n\n```\nj = (turn\
    \ + 1) % n;\nwhile (flag[j] == idle)\n    j = (j + 1) % n;\nturn = j;\nflag[i]\
    \ = idle;\n```\n\n### 满足临界区管理原则\n\n- 互斥性\n    - 仅当 `flag[i] == in_cs`，且对所有 `j\
    \ != i`，`flag[j] != in_cs` 时，进程 Pi 才进入临界区，因而满足互斥性。\n- 进展性\n    - 临界区空闲时，排在序列 `turn,\
    \ turn+1, ..., n-1, 0, 1, 2, ..., turn-1` 最前面的申请进入临界区的进程获准进入临界区，因而满足进展性。\n- 有限等待性\n\
    \    - 进程离开临界区时，按循环次序 `turn+1, ..., n-1, 0, 1, 2, ..., turn-1` 确定唯一一个竞争进程为其后继，所以一个进程最多等待\
    \ n-1 个进程进入并离开临界区后一定能进入临界区，因而满足有限等待性。\n\n## 4.2.3.2 进程互斥的硬件实现\n\n1. 硬件提供“测试并建立”指令\n\
    \n```\nint test_and_set(int *target) {\n    int temp = *target;\n    *target =\
    \ 1;\n    return temp;\n}\n```\n\n对一组公共变量，`int lock;`（初始 = 0）；\n\nPi 进入：\n\n```\n\
    while (test_and_set(&lock));\n```\n\nPi 离开：\n\n```\nlock = 0;\n```\n\n满足互斥性、进展性，不满足有限等待性。\n\
    \n### 满足有限等待性\n\n全局变量：\n\n```\nint waiting[n];\nint lock;\n```\n\n局部变量：\n\n```\n\
    int j;\nint key;\n```\n\n```\nwaiting[i] = 1;\nkey = 1;\nwhile (waiting[i] &&\
    \ key)\n    key = test_and_set(&lock);\nwaiting[i] = 0;\n```\n\n临界区\n\n```\nj\
    \ = (i + 1) % n;\nwhile ((j != i) && (!waiting[j]))\n    j = (j + 1) % n;\nif\
    \ (j == i) lock = 0;\nelse waiting[j] = 0;\n```\n\n其余部分\n\n2. 硬件提供“交换”指令\n\n```\n\
    void swap(int *a, int *b) {\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n\
    }\n```\n\n对一组公共变量：`int lock`（初始 = 0）；\n\n对一个进程空间：`int key`；\n\nPi 进入：\n\n```\n\
    key = 1;\ndo {\n    swap(&lock, &key);\n} while (key == 1);\n```\n\nPi 离开：\n\n\
    ```\nlock = 0;\n```\n\n**Remarks：**\n\n- (1) `test_and_set` 指令和 `swap` 指令是原子的，不可中断的（在单\
    \ CPU 情况下）。\n- (2) `test_and_set` 实际上是：将内存中一个单元的内容取出，再送一个新值。\n- (3) `swap` 实际上是：交换内存两个单元的内容。\n\
    \n3. 硬件提供“关中断”和“开中断”指令\n\n```\n关中断\n{ Critical Region }\n开中断\n```\n\n**Remarks：**\n\
    \n- (1) 开关中断只在单 CPU 系统中有效（why?）\n- (2) 影响并发性。\n\n## 4.2.4 多处理机环境下互斥\n\n- 单 CPU：指令间交叉，`test_and_set`、`swap`\
