  - '[PAGE 191]


    # 3. 2.1.8 反馈排队算法(FB)


    # Feed-Back:


    +   - 多个就绪队列，进程所属队列可变。


    ![](img/7b6892715d0da57dced81602d7459e7e_191_0.png)'
  - '[PAGE 192]


    # 3.2.1.8 反馈排队算法 (Cont.)


    +   调度效果:

    +   - 短进程优先处理

    +     - 运行时间短的进程在前面几个队列之后就可以执行完，而前面队列优先级高是被优先调度的。

    +   - 设备资源利用率高

    +     - 交互式进程经常进入等待状态(等待用户输入)一旦被唤醒(输入完成),进入最高级队列,可尽快被调度选中,投入运行,可以尽快使用设备;

    +   - 系统开销小

    +     - 计算量大的进程用完前面n-1级时间片,没有处理完,落入底层队列,调度频率下降,但每次获得较长的时间片。'
  - '[PAGE 193]


    # 3.2.2 处理机调度时机


    +   - 运行进程结束；

    +   - 运行进程等待；

    +   - 处理机被剥夺。

    +   - 进程切换

    +   - 中断是进程切换的前提但不是充分条件'
  - '[PAGE 194]


    # 3.2.2 处理机调度时机(Cont.)


    +   - 必然引起进程切换的中断

    +     - 进程自愿结束, exit()

    +     - 进程被强行终止；

    +       - 非法指令，越界，kill

    +     - 进程等待

    +   - 可能引起进程切换的中断

    +     - 时钟

    +     - 系统调用'
  - '[PAGE 195]


    # 3.2.3 处理机调度过程


    +   - dispatcher

    +     - 保存下降进程的现场

    +       - 寄存器(PSW,PC,SP,通用寄存器,地址寄存器)=>PCB

    +     - 选择上升进程

    +       - 按处理机调度算法

    +     - 恢复上升进程的现场

    +       - PCB=>寄存器

    +       - 先恢复通用寄存器和地址寄存器,最后恢复PSW,PC

    +       - PSW和PC必须用一条指令恢复'
  - '[PAGE 196]


    # 3.3 调度级别与多级调度


    +   3.3.1 交换与中级调度

    +   Swapping and mid-level scheduling


    +   3.3.2 作业与高级调度

    +   Job and high-level scheduling


    处理机调度为低级调度

    CPU scheduling = low level scheduling'
  - '[PAGE 197]


    # 3.3.1 交换与中级调度


    +   - 术语

    +     - 交换(swapping)

    +     - 中级调度(mid-level scheduling)

    +     - 并发度(degree of multi-programming)

    +   - 目标：控制并发度

    +     - 并发度过高

    +       - 系统开销大

    +       - 响应速度慢

    +       - 内存等资源紧张

    +       - 进程(线程)频繁进入等待状态

    +       - More deadlocks'
  - '[PAGE 198]


    # 3.3.1 交换与中级调度


    ![](img/7b6892715d0da57dced81602d7459e7e_198_0.png)'
  - '[PAGE 199]


    # UNIX的中级调度（sched #0）


    +   - 移入SRUN状态进程

    +   - 如内存不够，

    +     - 移出SWAIT和SSTOP状态进程；

    +     - 如还不够，移出SSLEEP和SRUN状态进程；

    +       - 条件：

    +         - 待移入进程在外存时间>=3秒；

    +         - 待移出进程在内存时间>=2秒。'
  - '[PAGE 200]


    # 3.3.2 作业与高级调度


    +   作业状态：

    +   - 提交：输入机向输入井传送

    +   - 后备：在输入井,尚未进入内存

    +   - 执行：分解为进程,在内存处理

    +   - 完成：处理完毕,结果在输出井

    +   - 退出：由输出井向打印机传送'
  - '[PAGE 201]


    # 3.3.2 作业与高级调度


    状态转换：


    +   - 提交→后备: 由SPOOLing输入进程完成

    +   - Simultaneous Peripheral Operation On-Line

    +   - 后备→执行: 由作业调度(1)(高级调度)完成

    +   - 高级调度: 系统进程

    +   - 执行→完成: 由作业调度(2)完成

    +   - 完成→退出: 由SPOOLing输出进程完成


    ![](img/7b6892715d0da57dced81602d7459e7e_201_0.png)'
  - '[PAGE 202]


    # 3.3.2 作业与高级调度(Cont.)


    1. 批处理作业调度程序(1):

    在后备作业集合中选择作业，并为其建立作业控制进程来处理该作业。


    ![](img/7b6892715d0da57dced81602d7459e7e_202_0.png)'
  - '[PAGE 203]


    # 3.3.2 作业与高级调度(Cont.)


    # 2. 批处理作业调度程序(2)


    对终止的作业控制进程进行善后处理。


