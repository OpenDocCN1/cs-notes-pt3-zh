  md: "\n## 5.8 死锁的检测\n\n数据结构：\n\n```pascal\nAvailable: array[1..m] of integer;\n\
    Allocation: array[1..n, 1..m] of integer;\nRequest: array[1..n, 1..m] of integer;\n\
    ```\n\n临时变量：\n\n```pascal\nWork: array[1..m] of integer;\nFinish: array[1..n]\
    \ of Boolean;\n```\n\n### 5.8.1 死锁检测算法\n\n```text\nWork := Available;\nFinish\
    \ := false;\nFinish[i] := true，对于 Allocation[i] = 0 的进程 i；\n\nwhile 存在满足条件的 i（Finish[i]\
    \ = false 且 Request[i] ≤ Work）:\n    Finish[i] := true;\n    Work := Work + Allocation[i];\n\
    \n若 ∀i, Finish[i] = true，则无死锁；\n否则，死锁。\n```\n\n### Remarks\n\n1. 上述算法可以检测到参与死锁的全部进程，包括占有资源和不占有资源的进程。\n\
    2. 如果希望只检测占有资源的进程，初始化时：`Finish[i] = true, for Allocation[i] = 0`。\n\n- 令 **P**\
    \ 是所有进程的集合，**P′ ⊆ P** 是所有占有资源的进程集合，则：\n  - **P** 死锁 ⇔ **P′** 死锁。\n- 死锁检测之后是恢复，只考虑\
    \ **P′** 中的进程。\n- 死锁检测不考虑 **P − P′** 中的进程，缩小了检测范围，降低了系统开销。\n\n### 死锁例子\n\n例子：R\
    \ = {A(7), B(3), C(6)}; P = {p0, p1, p2, p3, p4}。\n\n初始状态（p2 的 Request = (0,0,0)）：\n\
    \n| 进程 | Allocation (A B C) | Request (A B C) | Available (A B C) | Work (A B\
    \ C) | Finish |\n|---|---|---|---|---|---|\n| p0 | 0 1 0 | 0 0 0 | 0 1 0 |  |\
    \  |\n| p1 | 2 0 0 | 2 0 2 |  |  |  |\n| p2 | 3 0 3 | 0 0 0 |  |  |  |\n| p3 |\
    \ 2 1 1 | 1 0 0 |  |  |  |\n| p4 | 0 0 2 | 0 0 2 |  |  |  |\n\n此时未死锁。\n\n当 p2\
    \ 的 Request 变为 (0,0,1) 时：\n\n| 进程 | Allocation (A B C) | Request (A B C) | Available\
    \ (A B C) | Work (A B C) | Finish |\n|---|---|---|---|---|---|\n| p0 | 0 1 0 |\
    \ 0 0 0 | 0 1 0 |  |  |\n| p1 | 2 0 0 | 2 0 2 |  |  |  |\n| p2 | 3 0 3 | 0 0 1\
    \ |  |  |  |\n| p3 | 2 1 1 | 1 0 0 |  |  |  |\n| p4 | 0 0 2 | 0 0 2 |  |  |  |\n\
    \n此时死锁，参与死锁进程为 {p1, p2, p3, p4}。\n\n### 5.8.2 死锁检测时刻\n\n考虑因素：\n\n- 死锁发生频率；\n-\
    \ 死锁影响进程数。\n\n检测时机：\n\n1. 等待时检测：发现早，恢复代价小，开销大（overhead）。\n2. 定时检测。\n3. 资源（如 CPU）利用率下降时检测。\n\
    \n## 5.10 鸵鸟算法\n\n- 视而不见\n  - Pro：\n    - 工程师观点（考虑死锁发生的频率、危害、处理代价）\n      - 死锁发生频率\
    \ < 其他故障引起的系统瘫痪的频率\n      - 死锁处理的 constant overhead > 危害\n  - Con：\n    - 数学家观点\n\
    \      - 必须处理，无论代价如何\n- 目前系统实际如此\n  - 例如 UNIX 的 proc 结构（50 and up）\n\n## 5.11\
    \ 有关问题的讨论\n\n- 关于充要性算法\n  - 已知进程关于资源活动序列\n    - 困难：程序中的分支与循环\n  - 复杂度高（NP Complete）\n\
    - 生死资源问题\n  - 消息\n  - 消耗性资源与可重用资源并存\n- 关于可剥夺资源问题\n  - 处理器：可以剥夺，不会引起死锁\n  - 存储器：不可剥夺，当占有一部分内存的过程申请新的内存资源时，有可能发生死锁。但实现虚拟存储后，利用外存实现虚拟存储，当占有内存的过程提出新的存储请求而系统无法满足时，不让进程等待，而是为它分配外存，进程之间不会因为竞争内存资源而发生死锁。但是，若外存空间也不足时也有可能发生死锁，但这一般很罕见，因为外存空间很大。\n\
    - 关于两阶段封锁\n  - 增长阶段有可能死锁\n\n## 5.12 饥饿与活锁\n\n- 饥饿（starvation）：当等待时间给进程推进和响应带来明显影响时，称发生了进程饥饿。饥饿到一定程度的进程所赋予的使命即使完成也不再具有实际意义时，称该进程被饿死（starved\
    \ to death）。\n- 没有时间上界的等待\n  - 排队等待\n  - 忙式等待\n- 忙式等待条件下发生的饥饿，称为活锁（livelock）。\n\
    \n## 死锁与饥饿\n\n- 饥饿 vs 死锁\n  - 死锁进程处于等待状态，忙式等待的进程并非处于等待状态，但却可能被饿死；\n  - 死锁进程等待永远不会释放的资源，饿死进程等待可能被释放、但却不会分给自己的资源，其等待时间没有上界；\n\
    \  - 死锁一定发生了循环等待，饿死则不然；\n  - 死锁至少涉及两个进程，饿死进程可能只有一个。\n\n## 5.13 死锁的例子\n\n过河问题：\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_500_0.png)\n\nDeadlock prevention:\
    \ one direction at any time.\n\n### 过河问题\n\n变量定义：\n\n```pascal\nvar\n    west_crossing,\
    \ east_crossing: integer; {初值 0,0}\n    west_wait, east_wait: integer; {初值 0,0}\n\
    \    wq, eq: semaphore;\n    mutex: semaphore;\n```\n\n西面过河者活动：\n\n```pascal\n\
    P(mutex);\nif east_crossing > 0 then\nbegin\n    west_wait := west_wait + 1;\n\
    \    V(mutex);\n    P(wq);\nend\nelse begin\n    west_crossing := west_crossing\
    \ + 1;\n    V(mutex);\nend;\n\n过河;\n\nP(mutex);\nwest_crossing := west_crossing\
    \ - 1;\nif west_crossing = 0 then\n    while east_wait > 0 do\n    begin\n   \
    \     east_wait := east_wait - 1;\n        east_crossing := east_crossing + 1;\n\
    \        V(eq);\n    end;\nV(mutex);\n```\n\n东面过河者活动：\n\n```pascal\nP(mutex);\n\
    if west_crossing > 0 then\nbegin\n    east_wait := east_wait + 1;\n    V(mutex);\n\
    \    P(eq);\nend\nelse begin\n    east_crossing := east_crossing + 1;\n    V(mutex);\n\
    end;\n\n过河;\n\nP(mutex);\neast_crossing := east_crossing - 1;\nif east_crossing\
    \ = 0 then\n    while west_wait > 0 do\n    begin\n        west_wait := west_wait\
    \ - 1;\n        west_crossing := west_crossing + 1;\n        V(wq);\n    end;\n\
    V(mutex);\n```\n\n### 思考问题\n\n- 对于过河问题，考虑一个没有饿死情况的解法。\n\n### 例2. 过河问题(2)\n\n![](img/7b6892715d0da57dced81602d7459e7e_506_0.png)\n\
    \n要求：\n\n1. 无死锁；\n2. 无饥饿；\n3. 并行度高。\n\n"
