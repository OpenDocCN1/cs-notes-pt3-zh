    - 进程控制块\n- 进程状态与状态转换\n- 进程调度\n- 进程互斥\n- 进程同步\n- 进程通讯\n\n### 13.3.1 进程组成(映像)\n\n\
    常驻内存部分\n\n内外存交换部分\n\n系统空间\n\n系统空间\n\n用户空间\n\nProc 结构\n\nText结构\n\nUser结构\n\n系统栈\n\
    \n进程堆栈\n\n进程数据\n\n进程代码\n\n### 13.3.2 进程控制块\n\n- **Proc结构**\n  - 所保存的信息无论当进程在内存时还是在外存时都是需要的。\n\
    \n- **User结构**\n  - 所保存的信息仅当进程在内存时才是需要的，因而可以与进程的程序一起被移到外存。\n\n```\nstruct proc\n\
    {\n    char p_stat;\n    char p_flag;\n    char p_pri;\n    char p_sig;     //signal\
    \ received\n    char p_uid;     //user id\n    char p_time;    //resident time\
    \ for scheduling\n    char p_cpu;     //cpu usage\n    char p_nice;    //nice\
    \ for scheduling\n    char p_ttyp;    //controlling tty\n    int  p_pid;     //unique\
    \ process id\n    int  p_ppid;    //parent process id\n    int  p_addr;    //address\
    \ of swappable image\n    int  p_size;    //size of swappable image (*64bytes)\n\
    \    int  p_wchan   //event process is waiting\n    int *p_textp;   //pointer\
    \ to text structure\n}\n```\n\n```\nstruct user\n{\n    int     u_rsav[2]\n  \
    \  int     u_fsav[25]\n    .....\n    char    u_uid;          // effective user\
    \ id\n    char    u_gid;          // effective group id\n    char    u_ruid; \
    \        // real user id\n    char    u_rgid;         // real group id\n    int\
    \     u_procp;        // pointer to proc structure\n    int     *u_base;     \
    \   // base address for IO\n    int     *u_count;       // bytes remaining for\
    \ IO\n    int     *u_offset[2];   // offset in file for IO\n    int     *u_cdir;\
    \        // pointer to inode of current dir\n    int     *u_pdir;        // inode\
    \ of parent directory\n    int     u_uisa[16];     // prototype segmentation address\n\
    }\n```\n\n```\nstruct text\n{\n    int x_daddr;    //disk address of segment\n\
    \    int x_caddr;    //core address if loaded\n    int x_size;     //*64\n   \
    \ int *x_iptr;    //inode of prototype\n    char x_count;   //reference count\n\
    \    char x_ccount;  //number of loaded references\n}\n```\n\n### 13.3.3 进程状态及其转换\n\
    \n```\np_state\n    define null      0\n    define SSLEEP    1\n    define SWAIT\
    \     2\n    define SRUN      3\n    define SIDL      4\n    define SZOMB    \
    \ 5\n    define SSTOP     6\n\np_flag\n    define SLOAD     01\n    define SSYS\
    \      02\n    define SLOCK     04\n    define SSWAP     010\n    define STRC\
    \      020\n    define SWTED     040\n```\n\nSubset of : {p_state}×{p_flag}×{system\
    \ mode}\n\n## 进程状态及其转换\n\n![](img/7b6892715d0da57dced81602d7459e7e_881_0.png)\n\
    \n### 13.3.4 进程调度\n\n- 调度策略\n  - Dynamic Priority based（Low number high priority）\n\
    \  - Preemptive\n  - Aging (no starvation)\n- 调度算法\n\np_pri = USER + p_cpu / 16\
    \ + p_nice\n\n- USER: 100\n- p_cpu: 运行进程，每20ms加1; 其它进程，每1200ms减10\n- p_nice: 系统调用nice(n).\
    \ 用户进程: 0~20, 系统进程: -20~20;\n\n## 进程调度实现\n\n进程P(用户态)\n\n中断\n\n进程P(核心态)\n\n中断处理\n\
    调度\n上下文切换\n\n进程Q(核心态)\n\n置PC,PSW\n\n进程Q(用户态)\n\n### 13.3.5 进程互斥\n\n- 经典UNIX系统\n\
    \  - 机制\n    - 关中断互斥(提高处理机优先级)\n  - 特点\n    - 简单\n    - 开销小\n    - 影响并发性\n   \
    \   - 关中断后代码很短\n\n### 13.3.7 进程通讯\n\n- 信号 (signal)\n  - From process to process\n\
    \  - From event to process\n- 管道(pipe)\n  - Unnamed file\n  - Named pipe\n- socket通讯\n\
    \  - Endpoint communication\n  - Suitable for network\n\n![](img/7b6892715d0da57dced81602d7459e7e_886_0.png)\n"
