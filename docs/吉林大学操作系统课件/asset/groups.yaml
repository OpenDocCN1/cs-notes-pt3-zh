    +   - 设备及其分类

    +   - 设备的物理特性

    +   - IO传输方式（查询、中断、通道、DMA）

    +   - 设备分配与去配

    +   - 设备驱动

    +   - 设备调度

    +   - 缓冲技术

    +   - 输入输出进程

    +   - RAID技术

    +   - 虚拟设备


    ## 8.1 设备及其分类


    +   - 用途

    +     - 存储型设备

    +       - 磁盘，磁带，光盘

    +     - IO型设备

    +       - 扫描仪，打印机，mouse，keyboard，monitor,

    +     - 网络设备

    +       - 网卡，交换机，etc.

    +   - 数据传输的基本单位

    +     - 块型设备

    +       - 磁盘，磁带，光盘

    +     - 字符型设备

    +       - 输入输出设备和通信设备

