    # 调度参数


    周转时间：完成时间-进入时间


    $T = t_f - t_s$


    平均周转时间：周转时间的平均值


    $\overline{T} = \frac{1}{n}\left(\sum_{i=1}^{n} T_i\right)$


    带权周转时间：周转时间/运行时间


    $W = \frac{T}{R}$


    平均带权周转时间：带权周转时间的平均值


    $\overline{W} = \frac{1}{n}\left(\sum_{i=1}^{n} W_i\right) = \frac{1}{n}\left(\sum_{i=1}^{n}
    \frac{T_i}{R_i}\right)$'
