    Block 1


    内存空间


    map


    unmap


    文件f1


    ```

    fd=open("f1",''rw'');

    map(fd,1K);

    access

    unmap(fd);

    close(fd).

    ```


    ## 7.11 系统举例


    +   - 7.11.1 Linux文件系统


    +   - VFS(Virtual File System)文件系统


    +   - 并不是一个实际文件系统，而是多种实际文件系统的一个统一界面。


    +   - 为多种文件系统（Ext2fs, FAT）提供统一接口，也为各种外部设备提供统一接口。


    +   - Linux的核心是扩展的快速文件管理系统。


    +   - Ext2fs文件系统


    ## Ext2fs


    一组相邻的柱面


    | 引导块 | 块组 | 块组 | ... | 块组 | ... | 块组 |


    | 超级块 | 组描述 | 位示图 | inode | 文件块 |


    ![](img/7b6892715d0da57dced81602d7459e7e_757_0.png)


    ## Ext2fs与VFS差别


    +   - 存储块管理

    +     - FFS采用大块（large block, up to 8K）+碎块（fragment）

    +     - Ext2fs 采用统一长度块（1kb,2kb,4kb）

    +   - 空闲块管理

    +     - Bit map

    +     - 使一个文件物理块尽量连续或临近

    +     - 预先分配，以确保同一文件所占磁盘块的连续性，未用完磁盘块在文件关闭时释放


    ## 7.12 文件系统效率


    +   - caching

    +     - keep file blocks in core memory, whenever possible

    +       - keep read-in block buffers associated with file blocks

    +       - keep write-out block buffers associated with file blocks

    +   - read ahead

    +     - for sequential access

    +       - current file block #15, next possible #16(read ahead)

    +     - implementation

    +       - access bit for each open file, open set to 0(sequential)

    +       - seek turn over the flag(non sequential)


    ## 7.11 文件系统的效率


    write is postponed until absolutely necessary


    +   - no free buffer

    +   - upon file close (all user close, i_count=0)

    +   - system flush


    allocating contiguous disk blocks to a file


    +   - request to access disk are served in scan order


