    ## 6.6.1 Linux存储管理


    +   - Physical memory-management（物理存储管理）

    +     - Three level page table（三级页表）

    +     - Buddy heap algorithm for managing memory pages (frames)（伙伴堆算法管理内存）

    +   - Virtual Memory management（虚拟存储管理）

    +     - Demand paging（请求调页）

    +       - no pre-paging,（无预调）

    +       - no working set.（无工作集）


    ## 6.6.1 Linux存储管理


    ## Page replacement


    +   - page daemon: *kswapd*, runs once a second , keep enough free pages in memory.（页守护进程）

    +   - flush daemon: *bdflush*, wakes up periodically, “dirty page out”.（刷新守护进程）


    ## Managing Physical Memory


    +   - Allocate ranges of physically-contiguous pages on request. (为进程分配连续存储区)

    +   - The allocator uses a *buddy-heap* algorithm to keep track of available physical
    pages. (Buddy heap算法记载可用存储区)

    +     - Each allocatable memory region is paired with an adjacent partner. (每个可用存储区有一个伙伴)


    ## Managing Physical Memory


    +   - Whenever two allocated partner regions are both freed up they are combined
    to form a larger region.（两个相邻的伙伴被释放时，合并为一个大空闲区）

    +   - If a memory request cannot be satisfied by allocating an existing small
    free region, then a larger free region will be subdivided into two partners to
    satisfy the request.（小区域不能满足时，分割大区域）


