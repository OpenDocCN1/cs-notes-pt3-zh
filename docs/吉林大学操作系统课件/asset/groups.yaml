    # 13.3.4 进程调度


    +   - 调度策略

    +     - Dynamic Priority based（Low number high priority）

    +     - Preemptive

    +     - Aging (no starvation)

    +   - 调度算法


    p_pri = USER + p_cpu / 16 + p_nice


    +   - USER: 100

    +   - p_cpu: 运行进程，每20ms加1; 其它进程，每1200ms减10

    +   - p_nice: 系统调用nice(n). 用户进程: 0~20, 系统进程: -20~20;'
