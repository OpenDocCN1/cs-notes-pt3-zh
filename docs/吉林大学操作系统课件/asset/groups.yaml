  - "[PAGE 425]\n\n# 用管程构造PV操作\n\n```\nTYPE\nsemaphore=MONITOR(init_value)\n    VAR\
    \ c:condition;\n        count: integer;\nDEFINE P,V;\nPROCEDURE P;\n    BEGIN\n\
    \        count:=count-1;\n        IF count<0 THEN\n            wait(c);\n    END;\n\
    \nPROCEDURE V;\n    BEGIN\n        count:=count+1;\n        IF count <=0 THEN\n\
    \            signal(c);\n        END;\n    BEGIN\n        count:=init_value;\n\
