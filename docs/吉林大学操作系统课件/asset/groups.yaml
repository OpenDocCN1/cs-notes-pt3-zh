    \n### 进程方面：\n\n### 中断方面：\n\n申请一空缓冲\n释放空缓冲\n信息⇒缓冲\nF io链空 T\n设备忙\n取一缓冲\n启动设备\n\
    缓冲入io链\n启动设备\n传输完\n\n### 8.7.5 输入输出设备：(磁带、磁盘)\n\n进程空间\nIO设备\n缓冲\n缓冲\n缓冲\nio链\n\
    \n### 块型缓冲区：\n\n缓冲区头\n设备块号\nIO标识\n等待进程\n缓冲区体\n\n![](img/7b6892715d0da57dced81602d7459e7e_814_0.png)\n\
    \n### 进程方面(输入):\n\n申请空缓冲\n填写头部\n设备工作\nF\nT\n启动设备\n入io链尾\n等待\n信息=>进程\n释放缓冲\n\n\
    ### 进程方面(输出):\n\n申请空缓冲\n填写头部\n信息=>缓冲\n设备工作\n启动设备\n入io链\n\n### 中断方面:\n\nT\nF\n\
    输入\n唤醒等待者\n释放空缓冲\nio链空\n取一缓冲\n启动设备\n\n### UNIX缓冲\n\n### 字符型缓冲\n\n- 100个缓冲区，长度8字节(6字符+2指针)\n\
    - 组成公共缓冲池，所有字符型设备公用\n- 缓冲区或属于c freelists，或属于某字符设备(eg. tty,lp)\n\n### 块型缓冲\n\n\
