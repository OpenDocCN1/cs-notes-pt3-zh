- raw:
  - '[PAGE 712]


    # 7.8 文件系统的界面


    +   - 创建文件

    +   - 命令形式:creat(path_name, fcb_args)

    +   - 参数说明

    +     - Path_name: 文件路径名

    +     - Fcb_args: FCB参数

    +   - 执行步骤:

    +     - (1) 为此文件分配一个FCB主部,初始化

    +     - (2) 将文件名和文件号作为FCB次部填到末级目录中

    +     - (3) 以写方式打开

    +     - 例如: creat("/usr/li/d1/f1", mode)'
  - '[PAGE 713]


    # 7.8 文件系统的界面


    +   - 打开文件

    +   - 命令形式: fd=open(path_name, mode)

    +   - 参数说明

    +     - path_name: 文件路径名;

    +     - mode: 打开方式.

    +   - 执行步骤

    +     - (1) 根据文件路径名查目录找到FCB主部;

    +     - (2) 合法性检查(根据打开方式、共享说明、用户身份);

    +     - (3) 根据文件号查系统打开文件表看该文件是否已被打开, 如是共享计数加1; 否则取一个空闲的系统打开文件表项并将外存中 FCB主部等信息填入此表项,
    共享计数置为1;

    +     - (4) 在用户打开文件表中取一空表项, 填写打开方式和读写指针, 并指向系统打开文件表的对应表项.

    +     - 返回信息: fd: 文件描述符(在用户打开文件表中的入口), 它是一个非负整数.'
  - '[PAGE 714]


    # 7.8 文件系统的界面


    +   - 关闭文件

    +   - 命令形式: close(fd)

    +   - 参数说明

    +     - fd: 文件描述符.

    +   - 执行步骤:

    +     - (1) 由fd查用户打开文件表, 找到系统打开文件表入口;

    +     - (2) 系统打开文件表中共享计数减1, 如减1后的值为0且修改标志为1, 则将此FCB 由内存写回外存FCB主部;

    +     - (3) 将fd所对应的用户打开文件表项置为空闲.'
  - '[PAGE 715]


    <!-- no content -->'
  - '[PAGE 716]


    # 7.8 文件系统的界面


    +   - 读文件

    +   - 命令形式: read(fd,nrd,buf)

    +   - 参数说明:

    +     - fd: 文件描述符;

    +     - nrd: 读入记录个数;

    +     - buf: 内存起始位置.

    +   - 步骤:

    +     - (1) 由fd查用户打开文件表，找到对应的入口;

    +     - (2) 合法性检查(用户打开文件表中所记录的打开方式、存取方式);

    +     - (3) 查系统打开文件表，找到文件的地址;

    +     - (4) 计算欲访问起始记录的位置(offset, 物理结构);

    +     - (5) 将文件中由当前读指针所确定的nrd个记录读入内存中由buf起始的区域.'
  - '[PAGE 717]


    # # 7.8 文件系统的界面


    +   - 写文件


    命令形式: **write(fd,nwt,buf)**


    +   参数含义:

    +   - fd: 文件描述符;

    +   - nwt: 写出记录个数;

    +   - buf: 内存起始位置.


    +   执行步骤:

    +   (1) 由fd查用户打开文件表, 找到对应的入口;

    +   (2) 合法性检查(用户打开文件表中所记录的打开方式、存取方式);

    +   (3) 查系统打开文件表, 找到文件的地址;

    +   (4) 计算欲访问起始记录的位置(物理结构, offset);

    +   (5) 如果需要, 申请存储块;

    +   (6) 将内存中由buf起始的nwt个记录写到文件中由当前写指针所确定的区域（可能切换进程）.'
  - '[PAGE 718]


    # # 7.8 文件系统的界面


    +   建立连接


    +   命令形式: link(old_name,new_name)


    +   参数含义:


    +   old_name: 已存在的文件路径名;


    +   new_name: 欲连接的文件路径名.


    +   执行步骤:


    +   (1) 查找目录找到文件old_name的FCB主部, 由此得到文件号;


    +   (2) 查找目录找到文件new_name的末级目录;


    +   (3) 将文件号与new_name中末级名字合起来构成一个新的目录项, 将其填入new_name的末级目录文件中;


    +   (4) 将FCB主部中的连接计数加1.


    +   如: link("/usr/Li/f1", "/usr/Zhang/d2/f2")'
  - '[PAGE 719]


    # # 7.8 文件系统的界面


    +   - 断开连接


    +   - 命令形式: unlink(path_name)


    +   - 参数含义:

    +     - path_name: 文件路径名.


    +   - 执行步骤:

    +     - (1) 查找目录找到文件path_name的FCB主部;

    +     - (2) 将连接计数i_nlink减1;

    +     - (3) 如减1后的值为0, 则归还该文件所占用的全部存储块, 该文件将被撤销;

    +     - (4) 将FCB次部由上级目录中清除.


    +   - 如: unlink("/usr/Zhang/d2/f2")'
