    +     - I/O burst cycle: 进程(线程)使用设备I/O。

    +   - 进程运行行为:

    +     - CPU burst, I/O burst, CPU burst, I/O burst, ......

    +   - CPU调度：考虑处于CPU burst进程集合

    +     - CPU burst时间根据以前行为推定。'
