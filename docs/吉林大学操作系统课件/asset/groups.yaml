    \ arg0,...,argn-1,0)\n    - 以arg0,...,argn-1为参数执行prog\n    - 覆盖原来程序, 从第一条指令开始执行\n\
    \n## UNIX有关进程的系统调用命令\n\n- 进程自我结束\n  - **exit(status)**\n    - **Status**为终止状态\n\
    \    - 唤醒父进程\n- 等待子进程终止\n  - **pid=wait(&status)**\n    - 返回终止子进程编号\n    - 参数为子进程的终止状态\n\
    \n## 2.2.8 进程的创建与撤销\n\n```\n# include <stdio.h>\nvoid main ( int argc, char *\
    \ argv[] )\n{ int pid;\npid=fork ( );\nif ( pid < 0 ) { printf ( stderr, \" fork\
    \ failed\" );\nexit (-1 ); }\nelse if ( pid ==0 ) { execl (\"/ bin /1s\" , \"\
    \ 1s\" , null );}\nelse { wait (null);\nprint (\"child complete\");\nexit (0 );}\n\
    ```\n\n## fork() 创建子进程\n\nproc结构\np_pid=9\np_ppid=5\nuser结构\n\nproc结构\np_pid=12\n\
    p_ppid=9\nuser结构\n\n联系\n\n恒为0\n\n```\npid = fork();\nif(pid == 0) /*不成立*/\n{\n\
    \    /*子进程代码*/\n}else{\n    /*父进程代码*/\n}\n...\n```\n\n```\npid = fork();\nif(pid\
    \ == 0) /*成立*/\n{\n    /*子进程代码*/\n}else{\n    /*父进程代码*/\n}\n...\n```\n\n子进程号\n\
    (>0整数)\n\n复制\n\n父进程\n\n子进程\n\n## exec() 加载并执行新程序\n\nproc结构\np_pid=9\np_ppid=5\n\
