    \ (在磁盘或文件中存放位置)\n\n问题：给定key1≠key2\n\nhash(key1)=addr1;\n\nhash(key2)=addr2;\n\n\
    addr1=addr2 (conflict)\n\n### Conflict resolution: 顺序探查法：\n\n如发生冲突，则在冲突位置开始顺序探查第一个空闲的存储位置。\n\
    \n### 保存记录：\n\n```text\nHash(key)=addr\n\n起始位置\n\n保存记录：\n\n计算addr=hash(key)\n\n\
    对应冲突计数加1\n\n本记录空闲\n\nT\n\nF\n\n标记为占用\n填记录内容\n\n顺取下一个\n\n空闲标志\n冲突计数\n\n记录内容\n\n\
    空闲标志\n冲突计数\n\n记录内容\n\n文件空间\n```\n\n![](img/7b6892715d0da57dced81602d7459e7e_671_0.png)\n\
    \n### 查找记录：\n\n```text\n计算addr=hash(key)\n\n取addr对应记录的冲突计数⇒count\n\ncount=0\n\n\
    T\n\nF\n\n无此记录\n\n本记录空闲\n\nT\n\nF\n\n顺取下一记录\n\nkey相等\n\nT\n\nF\n\n找到\n\nhash(key)相等\n\
    \nT\n\nF\n\ncount:=count-1\n\ncount=0\n\nT\n\nF\n\n无此记录\n\n顺取下一记录\n```\n\n###\
