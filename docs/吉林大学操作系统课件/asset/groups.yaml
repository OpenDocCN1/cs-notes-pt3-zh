    \ 向 rj 画一条申请边，如可满足，改为分配边。\n- 释放： 去掉分配边。\n\n## 例子（无环路，无死锁）\n\n例1. P={p1,p2,p3},\
    \ R={r1(1),r2(2),r3(1),r4(3)}\n\nE={(p1,r1),(p2,r3),(r1,p2),(r2,p1),(r2,p2),(r3,p3),(r4,p3)}\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_460_0.png)\n\n## 例子（有环路，有死锁）\n\n增加边（p3,r2）\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_461_0.png)\n\n## 例子（有环路，无死锁）\n\n![](img/7b6892715d0da57dced81602d7459e7e_462_0.png)\n\
    \n## 例子（有环路，无死锁）\n\n![](img/7b6892715d0da57dced81602d7459e7e_463_0.png)\n\nP2释放占有资源r1，分给P1，(p1,r1)改为(r1,p1)\n\
    \n## 5.5.2 资源分配图的约简\n\n1. 寻找一个非孤立且没有请求边的节点 pi，若无算法结束\n2. 去除 pi 的所有分配边使其成为一个孤立节点；\n\
    3. 寻找所有请求边都可满足的进程 pj，将 pj 的所有请求边全部改为分配边；\n4. 转步骤 1\n\n## 死锁定理\n\n- 若算法结束时,所有节点均为孤点,则称资源分配图是完全可约简的,否则称为不可完全约简的。\n\
    - 死锁定理:\n  - **S**为死锁状态的充分必要条件是**S**的资源分配图不可完全约简。\n\n## 5.6 死锁预防\n\n- 对进程有关资源的活动加限制，所有进程遵循这种限制，即可保证没有死锁发生。\n\
    \  - 优点：简单，系统不需要做什么。\n  - 缺点：对进程的约束，违反约束仍可能死锁。\n- 预防方法：\n  - 预先分配法；\n  - 有序分配法。\n\
    \n## 5.6.1 预先分配法\n\n- 进程：运行前申请所需全部资源；\n- 系统：\n  - 能够满足，全部分配，\n  - 否则，一个也不分配。\n\
