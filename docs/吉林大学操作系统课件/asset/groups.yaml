  md: "\n## 8.7 缓冲技术\n\n### 双缓冲\n\n- 在设备和进程之间设置两个缓冲区\n- 数据交换（如输入）时，信息由设备传到一个缓冲区，第一个缓冲区填满后，后续的信息由设备传到第二个缓冲区，同时处理器将第一个缓冲区的内容复制到进程空间。然后，设备可以重新利用第一个缓冲区，如此往复直到传输完成。\n\
    - 提高了处理器与设备之间的并行性\n\n### 循环缓冲\n\n- 在设备与进程之间设置多个缓冲区，缓冲区链成环状，有两个指针 in 和 out，分别指出当前输入位置和当前取出位置。\n\
    - 进一步提高设备和处理器之间的并行性。\n\n### 8.7.5 缓冲技术实现：输入设备\n\n缓冲\n缓冲\n进程空间\n输入设备\n...\n缓冲\n\
