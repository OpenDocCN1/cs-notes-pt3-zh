    +     - 写出该块，分配下一个缓冲区

    +   - 不在b的链中，av链已空

    +     - 等待任意缓冲区变空闲的事件

    +   - 不在b的链中，在av链上得到空缓冲

    +     - 填写头部，由av链摘除，出旧b链，如新b链，返回缓冲块指针'
