  - '[PAGE 634]


    # 中断处理：


    +   1. 连接中断


    +   (1) 所有进程均未连接(共享段表、段名-段号对照表均无)


    建立页表，由文件读入外存swap，部分页读入内存，分配段号，填段名-段号对照表，如是共享段填共享段表，填段表，形成逻辑地址。


    +   (2) 其它进程连接过，本进程未连接过(共享段表有，段名-段号对照表无)


    分配段号，填段名-段号对照表，填段表(指向共享段表)，共享计数加1,形成逻辑地址。


    +   (3) 本进程连接过(段名-段号对照表有，共享段表有或无)


    形成逻辑地址。'
  - '[PAGE 635]


    # 2. 缺页中断


    调入所需页面，更新页表和总页表。


    # 3. 越界中断


    +   (1) 段号越界：错误处理。

    +   (2) 页号越界：如可扩展，扩展该段(增加页)，修改页表和段表(页表长度)；

    +   如不可扩展，错误处理。


    # 4. 越权中断


    错误处理。'
