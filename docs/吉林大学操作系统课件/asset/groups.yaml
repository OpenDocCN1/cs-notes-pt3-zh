    # 1.5.1 定时装置


    +   - 绝对时钟：记载实际时间，不发中断。

    +     - 系统操作员可以修改

    +     - 一般用户使用


    +   - 间隔时钟：定时发生中断，一般间隔单位为“毫秒”。

    +     - 间隔时钟是实现多道程序的基础—保证操作系统获得控制权。

    +     - 其它中断也进入操作系统，但是是否发生，何时发生没有保障。'
  - '[PAGE 44]


    # 1.5.2 系统栈(system stack)


    +   - 作用

    +     - 保存中断现场

    +     - 保存函数调用返回点、参数、局部变量、返回值

    +   - 数量

    +     - 每个进程一个

    +   - 位置

    +     - 操作系统区域

    +     - UNIX: ppda(user, 系统栈)

    +       - 操作系统最高页(第7页,共8页)是运行进程的ppda


    ![](img/7b6892715d0da57dced81602d7459e7e_44_0.png)'
  - '[PAGE 45]


    # 1.5.3 特权指令与非特权指令


    +   - 特权指令（privileged instruction）

    +     - 只有在管态才能执行的指令(影响系统状态)

    +       - 关中断，置程序状态字，停机， IO， ……


    +   - 非特权指令（non-privileged instruction）所有程序可用(不影响系统状态)

    +     - 取数，四则运算， ……'
  - '[PAGE 46]


    # 1.5.4 处理机状态及状态转换


    +   - 处理机状态

    +     - 系统态（system mode）(管态，核态)

    +     - 用户态（user mode）(目态，常态)

    +   - 状态转换

    +     - 管态 ⇒ 目态(置程序状态字,特权指令)

    +     - 目态 ⇒ 管态(中断， trap)


