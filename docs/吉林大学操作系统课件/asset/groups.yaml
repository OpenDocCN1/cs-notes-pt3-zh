  mdcn: "\n## 4.3.5.6 管程的嵌套调用问题\n\n![](img/7b6892715d0da57dced81602d7459e7e_429_0.png)\n\
    \n问题：\n- 1. 是否允许嵌套；\n- 2. 若允许，如何处理互斥权。\n\n方法：\n- 1. 禁止嵌套（Modula）\n- 2. 允许嵌套，等待时释放当前管程互斥权（CPASCAL）；\n\
    - 3. 允许嵌套，等待时释放所有管程互斥权；\n- 4. 允许嵌套，调用时释放路径管程互斥权\n\n## Java语言中的“管程”\n\n- 类似管程的对象\
    \ object\n  - 每个 object 有一个互斥锁 lock，一般未用；\n  - 说明为 synchronized 的 method 启用互斥锁；\n\
