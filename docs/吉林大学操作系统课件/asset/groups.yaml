  - '[PAGE 489]


    # 5.8.1 死锁检测算法


    Work:=Available;

    Finish:=false;


    Finish[I]=true for allocation[I]=0


    有满足条件的i:

    Finish[i]=false

    Request[i]≤Work


    Finish[i]=true;

    Work:=Work+Allocation[i]


    ∀i ,finish[i]=true


    无死锁


    死锁'
  - '[PAGE 490]


    # Remarks


    +   1. 上述算法可以检测到参与死锁的全部进程，包括占有资源和不占有资源的进程。

    +   2. 如果希望只检测占有资源的进程，初始化时：

    +      Finish[i]=true, for Allocation[I]=0'
  - '[PAGE 491]


    # Remarks


    +   - 令**P**是所有进程的集合，**P′**包含于**P**是所有占有资源的进程集合，则：

    +     - **P**死锁⇔**P′**死锁。

    +   - 死锁检测之后是恢复，只考虑**P′**中的进程。

    +   - 死锁检测不考虑**P-P′**中的进程，缩小了检测范围，降低了系统开销。'
