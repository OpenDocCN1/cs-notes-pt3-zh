  - '[PAGE 215]


    # 3.4.2 速率单调调度


    +   RMS (Rate Monotonic Scheduling)


    +   提出于1973年


    +   面向周期性实时事务，非剥夺式


    +   优先调度发生周期最短（频度最高）的实时任务


    +   可调度条件：


    \sum_{i=1}^n \frac{C_i}{T_i} \leq n(2^{1/n} - 1)'
  - '[PAGE 216]


    # RMS的上限值


    | n | n(2^{1/n} -1) |

    |---|---|

    | 1 | 1.0 |

    | 2 | 0.828 |

    | 3 | 0.779 |

    | 4 | 0.756 |

    | 5 | 0.743 |

    | 6 | 0.734 |

    | ⋮ | ⋮ |

    | ∞ | ln2≈0.693 |


    # RMS vs. EDF


    +   1) RMS可调度条件强于 EDF

    +   2) RMS调度较EDF实现简单'
