    # NFS 存取协议


    +   - 提供一套RPC调用，执行如下操作：

    +     - 查找目录下的文件

    +     - 读取目录项目

    +     - 操作link与目录

    +     - 存取文件属性

    +     - 读写文件'
  - '[PAGE 928]


    # NFS 存取协议


    +   - NFS是无状态的(stateless):

    +     - 文件服务端并不在内存打开文件表中保持文件控制信息

    +     - 每个文件操作命令必须是自包含的(self contained)，即必须提供完整的参数集合

    +     - NFS不提供并发控制机制.'
  - '[PAGE 929]


    # NFS 实现




    +   - 识别本地文件与远程文件

    +   - 对于远程文件，调用NFS协议过程

    +   - 对于本地文件，区分本地文件系统类型，并根据文件类型激活相应文件操作

    +   - VFS保持一个vnode表，记录所有打开文件信息。对于远程打开文件，在NFS中保持一个r_node表，vnode通过把柄与r-node建立联系。




    +   - 实现NFS协议，接受来自客户端的调用并将其传递给本地FS'
  - '[PAGE 930]


    # NFS 实现


    # 对远程文件的操作映射过程


    +   - 客户端通过系统调用发出访问请求

    +   - 操作系统将其映射到对应vnode的一个VFS操作

    +   - VFS层鉴别为远程文件，调用NFS对应的过程

    +   - NFS向远程服务器发出RPC调用

    +   - 远程服务器识别为本地文件，启用对应的文件操作

    +   - 按相同路径将调用结果由服务器反向传给顾客'
