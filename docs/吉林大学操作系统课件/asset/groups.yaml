  - '[PAGE 7]


    # 1.1.1 操作系统地位


    +   - 硬件抽象层（HAL）之上

    +   - 所有其它软件层之下


    ![](img/7b6892715d0da57dced81602d7459e7e_7_0.png)'
  - '[PAGE 8]


    # 运行视图


    +   - 系统库(lib)可调用操作系统，执行硬件指令

    +   - 应用程序可以调用lib和操作系统，执行硬件指令


    ![](img/7b6892715d0da57dced81602d7459e7e_8_0.png)'
  - '[PAGE 9]


    # 1.1.2 操作系统的作用


    +   - 管理系统中软件硬件资源

    +     - CPU: 一个CPU, 多个可运行的程序

    +     - 内存: 进程空间相对独立, 支持共享

    +     - 设备: 分配, 驱动

    +     - 文件: 实现文件系统, 支持文件操作

    +   - 为用户(应用程序)提供良好的服务(界面)

    +     - API

    +     - GUI, 行式命令(ls, cd, cat, vi, rm, mount, ...)

    +     - JCL (Job Control Language)'
  - '[PAGE 10]


    # 1.1.3 操作系统定义


    +   - 操作系统是位于硬件层(HAL)之上，所有其它软件层之下的一個系统软件，是管理系统中各种软硬件资源，方便用户使用计算机系统的程序集合。


    ![](img/7b6892715d0da57dced81602d7459e7e_10_0.png)'
  - '[PAGE 11]


    # 1.2 操作系统的历史


    +   操作系统的产生

    +   - 手工操作阶段

    +   - 成批处理阶段

    +   - 执行系统阶段


    +   操作系统的完善

    +   - 多道批处理系统

    +   - 分时系统

    +   - 实时处理系统

    +   - 通用操作系统


