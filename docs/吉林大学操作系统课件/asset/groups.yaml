  md: "\n## 例10. 寺庙问题\n\n```\nyoung_monk()\n{\n    do{\n        P(empty);\n      \
    \  P(bucket);\n        走到井边;\n        P(mutex_well);\n        井中取水;\n        V(mutex_well);\n\
    \        走到寺庙;\n        P(mutex_bigjar);\n        水入缸中;\n        V(mutex_bigjar);\n\
    \        V(bucket);\n        V(full);\n    } while(1)\n}\n```\n\n```\nold_monk()\n\
    {\n    do{\n        P(full);\n        P(bucket);\n        P(mutex_bigjar);\n \
    \       缸中取水;\n        V(mutex_bigjar);\n        喝水;\n        V(bucket);\n   \
    \     V(empty);\n    }\n}\n```\n\n### 例10. 寺庙问题（死锁分析）\n\n- P操作的顺序不当会引起死锁\n- 上述解法是无死锁解法\n\
    - 若在上述解法中存在多个小和尚、老和尚时，P操作的不当顺序会引起死锁。假设先P(bucket)然后再P(empty)就会出现死锁\n- 死锁一般都是在极限状态的时候判断\n\
    \n## 4.3.4 条件临界区\n\nConditional Critical Region\n\n- 背景\n  - PV操作低级，容易用错\n- 条件临界区形式\n\
    \  - region V when B do S\n- 执行S条件\n  - 没有其它进程处于与V相关的条件临界区中\n  - 进入S时B为true\n\n\
    ### 条件临界区\n\n- 实现互斥\n  - region v when true do s\n- CCR与PV操作的等价性（证明从略）\n  - 用CCR可以实现PV操作\n\
    \  - 用PV操作可以实现CCR\n- P.B.Hansen设计的Edison语言提供了CCR同步机制。\n- CCR的实现效率比较低\n\n### 例4-6\
    \ 简单批处理\n\n由作业读入、执行、打印结果三个相对独立的部分组成，显然三者需要同步，用条件临界区实现的程序如下：\n\n```\nPROGRAM batch;\n\
    TYPE buffer=RECORD\n  slots: ARRAY[0..n-1]of T;\n  head,tail: 0..n-1 initial (0,0);\n\
    \  size: 0..n initial (0);\nEND;\nVAR inbuff: buffer(cardimage);\n  outbuff: buffer(lineimage);\n\
    RESOURCE ib: inbuff; ob: outbuff;\n\nCOBEGIN\n    PROCESS reader;\n        VAR\
    \ card: cardimage\n        LOOP\n            Read card from cardreader;\n    \
    \        REGION ib WHEN inbuff.size<n DO\n                inbuff.slots[inbuff.tail]:=card;\n\
    \                inbuff.size := inbuff.size+1;\n                inbuff.tail :=\
    \ (inbuff.tail+1) MOD n;\n            ENDDO\n        ENDLOOP\n    ENDPROCESS\n\
    \n    PROCESS executer;\n        VAR card:cardimage;\n            line:lineimage;\n\
    \        LOOP\n            REGION ib WHEN inbuff.size>0 DO\n                card\
    \ := inbuff.slots[inbuff.head];\n                inbuff.size := inbuff.size-1;\n\
    \                inbuff.head := (inbuff.head+1)MOD n\n            ENDDO\n    \
    \        Process card and generate line\n            REGION ob WHEN outbuff.size<n\
    \ DO\n                outbuff.slots[outbuff.tail] := line;\n                outbuff.size\
    \ := outbuff.size+1;\n                outbuff.tail := (outbuff.tail+1)MOD n;\n\
    \            ENDDO\n        ENDLOOP\n    ENDPROCESS\n\n    PROCESS printer;\n\
    \        VAR line:lineimage;\n        LOOP\n            REGION ob WHEN outbuff.size>0\
    \ DO\n                line := outbuff.slots[outbuff.head];\n                outbuff.size\
    \ := outbuff.size-1;\n                outbuff.head := (outbuff.head+1)MOD n;\n\
    \            ENDDO\n            Print line on lineprinter;\n        ENDLOOP\n\
    \    ENDPROCESS\nCOEND.\n```\n\n### 条件临界区的实现效率问题\n\n- region r when b do s\n-\
    \ 条件临界区的实现效率是比较低的\n  - 这主要是条件表达式b的计算，由于b中可能包含进程局部信息，每个欲进入条件临界区的进程必须自己计算b的值（而不能由调度程序统一计算）。\n\
    \  - 因为进入条件临界区必须同时满足互斥和b为真两个条件，任何一个条件不满足都将使进程等待，这样在条件临界区的入口处会形成一个等待队列。\n  - 当处于条件临界区内的进程执行完s后，全局变量将发生变化，可能使某些条件临界区语句的b变为真，这时需要唤醒等待进程并由被唤醒的进程重新计算其b的值，而计算结果有可能仍为假，进程将重新回到等待状态。本质上来说，这也是一种忙式等待。\n\
    \n## 4.3.5 管程（Monitor）\n\n- **PV操作：**\n  - 分散式同步机制：共享变量操作，PV操作，散在整个系统中或各个进程中。\n\
    \  - **缺点：**\n    - 可读性差；\n    - 正确性不易保证；\n    - 不易修改。\n  - **优点：**\n    - 高效，灵活。\n\
    - **管程：**\n  - 集中式同步工具：共享变量及其所有相关操作集中在一个模块中。\n  - **优点：**\n    - 可读性好；\n    -\
    \ 正确性易于保证；\n    - 易于修改。\n  - **缺点：**\n    - 不甚灵活，效率略低。\n\n### 4.3.5.1 管程的提出\n\n\
    - 70年代初，由\n  - E.W.Dijkstra, C.A.R.Hoare, P.B.Hansen.\n- 背景：Structured programming\n\
    - 基于管程的语言\n  - Concurrent Pascal (Hansen)\n  - Modula (Wirth)\n  - Mesa\n  - Mod*\n\
    \  - Concurrent Euclid\n  - XCY\n\n![](img/7b6892715d0da57dced81602d7459e7e_383_0.png)\n\
    \n### 4.3.5.1 管程的提出（Cont.）\n\n- 构造操作系统的PCM方法\n  - P: process\n  - C: class\n \
    \ - M: monitor\n- Example system\n  - solo\n\n### 4.3.5.2 管程形式\n\n```\nType monitor_name=MONITOR(形参表)\n\
    共享变量说明\ndefine 本管程内定义，本管程外使用的子程序名表；\nuse 本管程外定义，本管程内使用的子程序名表；\nProcedure 过程名（形参表）；\n\
    局部变量说明\nBegin 语句序列 End;\n.........\n```\n\n### 4.3.5.2 管程形式（Cont.）\n\n```\nFunction\
    \ 函数名（形参表）:返回值类型;\n局部变量说明\nBegin 语句序列 End;\n```\n\n```\nBegin 共享变量初始化语句序列 End;\n\
    ```\n\n语言特点：\n\n- (1) modularized;\n- (2) abstract data type;\n- (3) information\
    \ hiding.\n"
