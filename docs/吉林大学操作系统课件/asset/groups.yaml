  md: "\n## 周期性实时事务\n\n- 周期性实时事务：\n  - 令 $C_i$ 为任务 $P_i$ 处理时间， $T_i$ 为任务 $P_i$ 的发生周期，则任务\
    \ $P_1, ..., P_m$ 可调度的必要条件为：\n    $$\\sum_{i=1}^{m} \\frac{C_i}{T_i} \\le 1$$\n\
    \n## 周期性实时事务\n\n- 例:\n  - T1=100, T2=200, T3=500 (ms)\n  - C1=50, C2=30, C3=100\
    \ (ms)\n  - C1/T1+C2/T2+C3/T3=0.5+0.15+0.2=0.85<1\n  - 满足可调度的必要条件\n\n## 周期性实时事务\n\
    \n| 进程 | 就绪时间 | 处理时间 | 完成截止期 | 发生周期 |\n| --- | --- | --- | --- | --- |\n| A |\
    \ 0 | 10 | 20 | 20 |\n| B | 0 | 25 | 50 | 50 |\n\n10/20 + 25/50 = 1, 可调度(不考虑开销)\n\
    \n## 例子\n\n| Process | Arrival time | Execution time | completion deadline |\n\
    |---|---|---|---|\n| A(1) | 0 | 10 | 20 |\n| A(2) | 20 | 10 | 40 |\n| A(3) | 40\
    \ | 10 | 60 |\n| A(4) | 60 | 10 | 80 |\n| A(5) | 80 | 10 | 100 |\n| ...... | ......\
    \ | ...... | ...... |\n| B(1) | 0 | 25 | 50 |\n| B(2) | 50 | 25 | 100 |\n\n##\
    \ 例子: Earliest Deadline First\n\n![](img/7b6892715d0da57dced81602d7459e7e_214_0.png)\n\
    \n## 3.4.2 速率单调调度\n\n- RMS (Rate Monotonic Scheduling)\n- 提出于1973年\n- 面向周期性实时事务，非剥夺式\n\
    - 优先调度发生周期最短（频度最高）的实时任务\n- 可调度条件：\n\\sum_{i=1}^n \\frac{C_i}{T_i} \\leq n(2^{1/n}\
    \ - 1)\n\n## RMS的上限值\n\n| n | n(2^{1/n} -1) |\n|---|---|\n| 1 | 1.0 |\n| 2 | 0.828\
    \ |\n| 3 | 0.779 |\n| 4 | 0.756 |\n| 5 | 0.743 |\n| 6 | 0.734 |\n| ⋮ | ⋮ |\n|\
    \ ∞ | ln2≈0.693 |\n\n## RMS vs. EDF\n\n- 1) RMS可调度条件强于 EDF\n- 2) RMS调度较EDF实现简单\n\
    \n## RMS例子：\n\n| 进程 | $T_i$ | $C_i$ |\n|---|---|---|\n| A | 100 | 20 |\n| B |\
    \ 150 | 40 |\n| C | 350 | 100 |\n\n$\\frac{C1}{T1} + \\frac{C2}{T2} + \\frac{C3}{T3}\
    \ = 0.2 + 0.267 + 0.286 = 0.753 \\le 3(2^{1/3} - 1) = 0.779$\n\n可调度，具体调度结果：\n\n\
    | A1 | B1 | C1 | A2 | B2 | A3 |  | A4 | B3 | C2 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 0 | 20 | 60 | 160 | 180 | 220 | 240 | 300 | 320 | 360 | 460 |\n\n## 3.5.1 自调度(self\
    \ scheduling)\n\n- 均衡调度(balanced scheduling)\n- 一个就绪队列(多处理机访问互斥)\n  - 优点\n   \
    \ - 不需要专门的处理机从事任务分派工作\n    - 任务分配均衡\n  - 缺点\n    - 当CPU较多时,就绪队列成为瓶颈\n    - 线程两次调度可能处于不同处理机\n\
    \    - 不能保证同组线程同时调度\n\n## 自调度(self scheduling)\n\n![](img/7b6892715d0da57dced81602d7459e7e_220_0.png)\n\
    \n## 自调度(self scheduling)\n\n- 例子:\n  - Mach, 改进的自调度\n    - 全局队列:系统一个\n    - 局部队列:每个CPU一个\n\
    \  - 调度时\n    - 首先考虑局部队列\n    - 然后考虑全局队列\n\n## 3.5.2 组调度(gang scheduling)\n\n\
    - 将一组相关(合作)的线程同时分派到多个处理机上运行\n  - 避免合作线程之间的相互等待\n  - 降低开销,提高运行效率\n- 例子:\n  - Cm*\n\
    \    - Task force (一组相关的计算)\n\n## 3.6 系统举例\n\n- Linux进程调度\n- Windows2000/XP线程调度\n\
    - UNIX进程调度（见第12章）\n\n## 3.6.1 Linux 进程调度\n\n- 在调度级别上考虑三种特征进程\n  - Real-time FIFO\n\
    \  - Real-time Round Robin\n  - Timesharing\n- Goodness-based scheduling\n  -\
    \ priority\n    - 1-40, (缺省值20), 可通过nice系统调用调整, nice(value)中value的取值范围为(-20,20)之间,\
    \ 以与经典UNIX保持兼容, 但在内部对value值进行反向处理, 取priority=20-value.\n  - counter\n    - 进程尚可运行的剩余时间\n\
    \n## Linux 进程调度\n\n## counter\n\n- 对于运行进程来说，每个时钟间隔（10ms，称为一个jiffy），将counter减1\n\
    - 当所有就绪进程的counter配额下降到0时，重新计算所有进程（包括等待进程）的counter值\n  - counter= (counter/2) +\
    \ priority\n\n## goodness\n\n- if(Real-time)goodness=1000+priority\n- if(Timesharing\
    \ && counter=0)goodness=0\n- if(Timesharing && counter>0)goodness=counter+priority\n\
    \n## Linux 进程调度\n\n- **调度发生时刻：**\n  - 运行进程的counter减至0；\n  - 运行进程执行系统调用exit；\n\
    \  - 运行进程因等待I/O、信号灯而被封锁；\n  - 原来具有高goodness的进程被解除封锁。\n- **调度效果：**\n  - 实时优先于分时\n\
    \  - 交互和I/O进程优先于CPU进程\n\n## Linux 对称多处理\n\n- **Linux2.0是支持对称多处理硬件的第一个Linux核心；**\n\
    \  - 进程或线程可以同时运行在多个处理机上。\n- **为保持核心非剥夺同步要求，SMP通过一个唯一的内核自旋锁(spin-lock)来保证任何时刻最多只有一个处理机执行核心代码，**\n\
    \  - 支持真正意义上的SMP：将一个自旋锁分解为若干个相互独立的自旋锁，分别用于保护核心代码不相交的子集。\n\n## 3.6.2 Windows 2000/XP线程调度\n\
    \n- Main Features:\n  - Thread level scheduling;\n  - Real time + foreground +\
    \ background;\n    - real time: no deadline scheduling;\n    - foreground: GUI\
    \ window\n    - background: non-interactive\n  - Preemptive + dynamic priority\
    \ + RR + Feedback;\n  - Symmetric Multi-Processor(SMP) support;\n\n## 优先级别\n\n\
    - **16个实时优先级（16-31）**\n  - 一些内核线程\n  - 应用程序提升为实时优先级需要有权限\n  - 不是真正意义上的实时调度\n-\
    \ **15个可变线程优先级（1-15）**\n  - 基本优先级 vs. 当前优先级\n    - 线程基本优先级继承进程基本优先级，可上下浮动2\n \
    \     - 如: 进程基本优先级4，其线程基本优先级2—6,\n    - 当前优先级在2—15范围内变动.\n    - 可动态提升\n    - 运行完一个quantum之后自动下降，不低于基本优先级\n\
    - **1个系统线程优先级（0）**\n"
