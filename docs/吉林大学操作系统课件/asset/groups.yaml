    ## 7.9日志结构文件系统


    +   在UNIX系统中创建一个文件

    +   (1) 文件名写入目录中；

    +   (2) 新文件inode更新；

    +   (3) 目录文件inode更新；

    +   (4) 写入文件内容.


    +   小量写(small write)

    +   - 一次写修改磁盘块上的一小部分数据

    +   - 假定一次写需要10ms寻道时间, 4ms旋转延迟, 50μs读写, 磁盘访问效率0.36%.


