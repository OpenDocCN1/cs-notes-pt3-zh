    \n## 4.1.5 与时间有关的错误\n\n例：图书借阅系统（x：某种书册数，设当前 x=1）\n\n```\n终端1:\nCYCLE\n  等待借书者;\n\
    \  IF x>=1 Then\n    Begin\n      x:=x-1;\n      借书\n    End\n  Else  无书\nEnd\n\
    ```\n\n```\n终端2:\nCYCLE\n  等待借书者;\n  IF x>=1 Then\n    Begin\n      x:=x-1;\n\
    \      借书\n    End\n  Else  无书\nEnd\n```\n\n![](img/7b6892715d0da57dced81602d7459e7e_251_0.png)\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_251_1.png)\n\n### 关于就绪队列的整队问题\n\n设有\
    \ A、B、C、D 四个就绪进程，优先级依次为 2、10、30、35，分析插队过程中出现的情况。\n\n![](img/7b6892715d0da57dced81602d7459e7e_253_0.png)\n\
    \n分析：\n\n- (1) 若有进程 E，优先级为 25，处于就绪状态，则要求加入就绪队列，调整队列子程序执行。该程序判断 E 应加入 B、C 之间，则执行\
    \ `R:=C; ① B:=E; E:=R`。\n- (2) 若在①时进程 F 因完成 I/O 由等待状态变为就绪，其优先级为 15，调整队列子程序被中断，转入执行中断服务程序，则出现丢失一个进程：`R:=C;\
    \ B:=F; F:=R`。\n\n结论：该错误因共享就绪队列引起，对就绪队列操作不当，也是与时间相关的错误，导致结果不唯一。\n\n### 两进程申请两个独占性资源\n\
    \n设有两个进程 P1、P2，系统中两类独占性资源如打印机和输入机，两进程的活动为：\n\n| P1 | P2 |\n| --- | --- |\n| 申请打印机\
    \ | 申请输入机 |\n| ① | ② |\n| 申请输入机 | 申请打印机 |\n| 执行 | 执行 |\n| 退出 | 退出 |\n\n分析：若 P1\
    \ 推进到①、P2 推进到②，则 P1、P2 均等待对方释放资源，形成永久等待。该错误也与推进速度有关，是与时间相关的错误。\n\n- 错误原因之1：进程执行交叉（interleave）；\n\
    - 错误原因之2：涉及公共变量（x）。\n\nRemarks：\n\n- 某些交叉结果不正确；\n- 必须去掉导致不正确结果的交叉。\n\n## 4.2 进程互斥（mutual\
    \ exclusion）\n\n- 4.2.1 共享变量与临界区\n- 4.2.2 临界区域与进程互斥\n- 4.2.3 进程互斥的实现\n- 4.2.4\
    \ 多处理机环境下的互斥\n\n### 4.2.1 共享变量与临界区域\n\n- 共享变量（shared variable）：多个进程都需要访问的变量。\n\
    - 临界区域（critical region）：访问共享变量的程序段。\n\n![](img/7b6892715d0da57dced81602d7459e7e_259_0.png)\n\
    \n### 表示\n\n```\n共享变量：shared <一组变量>\n临界区域：region <一组变量> do <语句>\n```\n\n例子：`shared\
    \ B: array[0..n-1] of integer;`\n\n```\nregion B do\n  begin\n    ..... (访问B)\n\
    \  end;\n```\n\n```\nregion B do\n  begin\n    ..... (访问B).\n  end;\n```\n\n###\
    \ 4.2.2 临界区域与进程互斥\n\n定义：多个进程不能同时进入关于同一组共享变量的临界区域，否则可能发生与时间有关的错误，这种现象称为进程互斥。\n\n\
    两层含义：\n\n- (1) 任何时刻最多只能有一个进程处于同一组共享变量的相同的临界区域；\n- (2) 任何时刻最多只能有一个进程处于同一组共享变量的不同的临界区域。\n\
    \nRemarks：互斥是相对于公共变量而言的。\n\n### 嵌套临界区域\n\n```\nshared x1,x2;\n\nregion x1,x2 do\n\
    begin\n.....\nregion y1,y2 do\nbegin\n......\nend\nend;\n```\n\n```\nshared y1,y2;\n\
    \nregion y1,y2 do\nbegin\n......\nregion x1,x2 do\nbegin\n......\nend\nend;\n\
    ```\n\n### 4.2.3 进程互斥的实现\n\n**Framework**\n\n```\nRepeat\n    entry section\n\
    \    critical section\n    exit section\n    remainder section\nUntil false\n\
    ```\n\n**Requirements：**\n\n- mutual exclusion（互斥进入）：一次只允许一个进程进入关于同一组公共变量的临界区；\n\
    - Progress（空闲让进）：临界区空闲时，放行一个进入者；\n- bounded waiting（有限等待）：一个想要进入临界区的进程在等待有限个进程进入并离开临界区后获得进入临界区的机会。\n\
    \n### 4.2.3.1 进程互斥的软件实现\n\n- 完全用程序实现，不需特殊硬件指令支持。\n- 可用于单 CPU 和多 CPU 环境中。\n- 有忙式等待问题。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_265_0.png)\n\n### 尝试1\n\n```\nint turn;\n\
    \nP0:\ndo{\n    while (turn==1);\n    临界区代码\n    turn=1;\n    其余代码\n}while(1);\n\
    \nP1:\ndo{\n    while(turn==0);\n    临界区代码\n    turn=0;\n    其余代码\n}while(1);\n\
    ```\n\n不满足进展性：P0 和 P1 必须交替进入临界区。\n\n### 尝试2\n\n```\nboolean flag[2];\n\nP0:\n\
    do{\n    while (flag[1]);\n    flag[0]=true;\n    临界区\n    flag[0]=false;\n  \
    \  其余代码\n}while(1);\n\nP1:\ndo{\n    while (flag[0]);\n    flag[1]=true;\n   \
    \ 临界区\n    flag[1]=false;\n    其余代码\n}while(1);\n```\n\n不满足互斥性：flag[0]=flag[1]=false。\n\
    \n### 尝试3\n\n```\nboolean flag[2]; (false, false)\ndo{\n    flag[0]=true;\n  \
    \  while (flag[1]);\n    临界区代码\n    flag[0]=false;\n    其余代码\n}while(1);\n\ndo{\n\
    \    flag[1]=true;\n    while(flag[0]);\n    临界区\n    flag[1]=false;\n    其余代码\n\
