    \ support 4 modes:\n  - R0（权限最强）\n  - R1\n  - R2\n  - R3（权限最弱）\n\n![](img/7b6892715d0da57dced81602d7459e7e_47_0.png)\n\
    \n### 1.5.5 地址映射机构\n\n- 逻辑地址⇒ 物理地址\n  - 逻辑地址(虚地址)：程序中产生的地址\n  - 物理地址(实地址)：存储器地址\n\
