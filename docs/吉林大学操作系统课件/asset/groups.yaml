    \  - 扩展应用领域。\n- 常见模式:\n  - 分时(前台)+批处理(后台)（eg. DPS/8上的GCOS-8）\n  - 实时(前台)+批处理(后台）\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_30_0.png)\n\n### 1.4.5 单用户操作系统\n\n\
    - 同一时刻仅有一个用户使用的系统\n- 应用领域:\n  - 台式机，笔记本，……\n- 特点:\n  - 单用户，多进程，多线程\n\n不同的程序，不同的进程；\n\
    相同的程序，不同的线程\n\n### 1.4.6 网络操作系统(Network OS)\n\n建立在宿主操作系统之上，提供网络通讯、网络资源共享、网络服务的软件包。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_32_0.png)\n\n#### 网络操作系统的目标\n\n- 相互通讯\n\
    - 资源共享（信息，设备）\n- 提供网络服务\n  - database server\n  - ftp server\n  - e-mail server\n\
    \  - telnet server\n  - etc.\n\n![](img/7b6892715d0da57dced81602d7459e7e_33_0.png)\n\
    \n### 1.4.7 分布式操作系统(Distributed OS)\n\n- 紧耦合：(tightly coupled)\n  - 由多机系统发展而来（多CPU）\n\
    \  - 有公共内存\n  - 多处理机操作系统\n\n![](img/7b6892715d0da57dced81602d7459e7e_34_0.png)\n\
    \n- 松散耦合：(loosely coupled)\n  - 由计算机网络发展而来（多Host）\n  - 无公共内存，无公共时钟\n\n![](img/7b6892715d0da57dced81602d7459e7e_35_0.png)\n\
    \n- 分布式操作系统特征:\n  - 统一的操作系统\n  - 资源的进一步共享\n    - 内存, CPU\n  - 可靠性\n  - 透明性\n\n\
    - 目标：进一步共享资源，使负载均衡，计算加速。\n  - CPU\n  - 内存\n- 途径：迁移（migration）\n  - 作业迁移\n  - 进程迁移（线程一般随同进程迁移）\n\
    - 例子：\n  - Solaris MC\n\n### 1.4.8 多处理机操作系统\n\n- 多处理机系统\n  - 具有公共内存的多CPU系统\n-\
    \ 对称多处理机系统(SMP-symmetric multi-processor)\n  - 没有主从关系的多处理机系统\n- 多处理机操作系统\n  -\
    \ 有效管理和使用多个CPU的操作系统\n  - 特点: 进程与CPU多对多\n  - 新问题:\n    - (1) 调度问题； (2) 并发控制问题\n\
    - 例子:\n  - UNIX, Linux, Windows\n\n### 1.4.9 嵌入式操作系统\n\n- 嵌入在掌上电脑、通讯设备、车载系统、信息家电等非计算机类设施上的操作系统。\n\
    - 特点：微内核结构（Micro-kernel），许多操作系统功能(文件系统,设备驱动)以应用程序模式运行。\n  - 核心小(基本内存管理,CPU管理,通讯程序),\
    \ 适应范围广, 可靠性高\n  - 效率低\n- 例子：\n  - Win CE .NET（维纳斯, 美国微软）\n  - PalmOS\n  - HOPEN（女娲,\
    \ 中科院钟锡昌）\n\n![](img/7b6892715d0da57dced81602d7459e7e_39_0.png)\n\n### 1.4.10\
    \ 多媒体操作系统\n\n#### 定义(百度百科)\n\n- 具有一般操作系统功能;\n- 还具有多媒体底层扩充模块，支持多媒体信息的采集、编辑、播放和传输。\n\
    \n#### Remarks\n\n- 不是一种独立的操作系统类型\n- 是现代操作系统的一种特性\n- 目前许多操作系统开始支持多媒体\n"
  mdcn: "\n## 1.3 操作系统特性\n\n- 并发性\n  - 多个程序在宏观上同时向前推进\n  - 并发(concurrent) vs. 并行 (parallel)\n\
