    \ Iᵢ→Cᵢ→Pᵢ，多个进程的活动也是顺序的。\n\n![](img/7b6892715d0da57dced81602d7459e7e_242_0.png)\n\
    \n##### 4.1.2.2 顺序程序特性\n\n- （1）连续性：指令逐条执行\n- （2）封闭性：不受其它程序及外界因素影响\n- （3）可再现性：结果与推进速度无关\n\
    \n#### 4.1.3 并发程序及其特性\n\n##### 4.1.3.1 程序的并发执行\n\n- （1）内部并发性：指一个程序内部的并发性。例：\n\n\
    \  S1: a:=x+2;\n\n  S2: b:=y+4;\n\n  S3: c:=a+b;\n\n  S4: d:=c+6;\n\n  S5: e:=c-d;\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_244_0.png)\n\n- （2）外部并发性：指多个程序之间的并发性。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_245_0.png)\n\n- 不可再现性的例子\n  - 进程P:\n\
    \    - A1: N:=0;\n    - A2: N:=N+1;\n    - A3: GOTO A2;\n  - 进程Q:\n    - B1: PRINT(N);\n\
    \    - B2: N:=0;\n    - B3: GOTO B1;\n\n此例中进程P累计计数，进程Q将累计的结果打印出来。希望打印出的数是累计数的和。\n\
    \n- 两个进程并发执行时有许多可能的交叉:\n  - 如进程P循环5次进程Q循环1次，然后进程P又循环3次进程Q循环1次，则输出结果是5，3；\n  -\
    \ 如进程P循环2次进程Q循环1次，然后进程P又循环6次进程Q循环1次，则输出结果是2，6。两次执行结果完全不同。\n  - 进程Q执行完B1后被中断，进程P对N执行加1操作，然后进程Q执行B2，在这种情况下进程P的累计数将被丢失。\n\
    \n##### 4.1.3.2 并发程序的特性\n\n- （1）间断性：程序交叉执行。\n- （2）非封闭性：一个进程的运行环境可能被其它进程所改变，从而相互影响。\n\
    - （3）不可再现性：由于交叉的随机性，并发程序的多次执行可能对应不同的交叉，因而不能期望重新运行的程序能够再现上次运行的结果。\n\n#### 4.1.4\
    \ 程序并发执行的条件\n\n- 在失去封闭性的条件下，保持可再现性。\n  - **R(pi)={a1,a2,...,am}** 表示程序 pi 在执行期间所需读取的所有变量的集合，称为“读集”；\n\
    \  - **W(pi)={b1,b2,...,bn}** 表示程序 pi 在执行期间所需改变的所有变量的集合，称为“写集”。\n  - 若有两条语句 **c=a+b**\
    \ 和 **v=c-1**，则它们的“读集”和“写集”分别为：\n    - **R(c:=a+b)={a,b}, R(v:=c-1)={c}**\n  \
    \  - **W(c:=a+b)={c}, W(v:=c-1)={v}**\n\n- 若两个程序p1，p2满足如下条件，则能够保持可再现性，因而可以并发执行。该条件是1966年首先由Bernstein提出的，称为Bernstein条件。\n\
    \  - R(p1)∩W(p2) ∪ R(p2)∩W(p1) ∪ W(p1)∩W(p2)=∅\n"
