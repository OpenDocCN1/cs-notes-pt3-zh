    \  - 延迟写出的块(bdwrite)\n\n```c\nstruct cblock {\n    struct cblock *c_next;\n  \
    \  char info[6];\n}\n\nstruct cblock *cfreelist;  //free c blocks\n\nstruct clist\
    \  //associated with a character device\n{\n    int c_cc;  //character count\n\
    \    int c_cf;  //pointer to first block\n    int c_cl;  //pointer to last block\n\
    };\n```\n\n```c\nstruct buf  //actually a buffer header, shared by all mounted\
    \ disks\n{\n    int      b_flags;          //BUSY, ASYNC, DELWRI, DONE...\n  \
    \  struct buf *b_forw;        //headed by devtab\n    struct buf *b_back;\n  \
    \  struct buf *av_forw;       //position on free list\n    struct buf *av_back;\n\
    \    int      b_dev;\n    int      b_wcount;         //transfer count\n    char\
    \     *b_addr;          //low order core (buffer) address\n    char     *b_xmem;\
    \          //high order core (buffer) address\n    char     *b_blkno;        \
    \ //block # on device\n    char     b_error;\n    char     *b_resid;         //word\
    \ not transferred after error\n} buf[NBUF];\n```\n\n### b_flag:\n\n- B_DELWR\n\
    - B_ASYNC\n- B_RELOC\n- B_WANTED\n- B_BUSY\n- B_ERROR\n- B_DONE\n- B_READ/B_WRITE\n\
    \n```c\nchar buffers[NBUF][512]; //块型缓冲区\nstruct buf bfreelist; //缓冲区头部的链头\n\n\
    struct devtab  //设备IO队列\n{\n    char    d_active;      //busy flag\n    char \
    \   d_errcnt;      //error count\n    struct  buf *b_forw;   //first buffer for\
    \ this dev\n    struct  buf *b_back;   //last buffer for this dev\n    struct\
    \  buf *d_actf;   //head of IO queue\n    struct  buf *d_actl;   //tail of IO\
    \ queue\n};\n```\n\n```c\nstruct devtab{\n    char d_active;\n    char d_errcnt;\n\
    \    struct buf *b_forw;\n    struct buf *b_back;\n    struct buf *d_actf;\n \
    \   struct buf *d_actl;\n};\n```\n\n![](img/7b6892715d0da57dced81602d7459e7e_821_0.png)\n\
    \n### 相关操作：\n\n- getblk(dev,blkno)  //assign a buffer for the given block\n- bread(dev,blkno)\
    \  //read a block(if necessary), return buf pointer\n- breada(dev,blkno,rablkno)\
    \  //read in first block, like read; but also start io on second block\n- bwrite(bp)\
    \  //write the buffer, wait for completion, then release\n- bawrite(bp)  //start\
    \ the io, release buffer, no wait for completion\n- bdwrite(bp) //release buffer,\
    \ mark it so that if it is grabbed for another purpose, it will be written out\
    \ before being given up\n- brelse(bp)  //release the buffer, with no io implied\n\
    \n### getblk(dev,blkno)\n\n参数： dev:设备号， blkno: 设备块号\n\n返回： 缓冲区指针bp\n\n步骤：\n\n\
    - 块在b链中，且当前空闲\n  - 由av链摘除，标记BUSY，返回缓冲块指针\n- 块在b链中，但BUSY(其它进程在用)\n  - sleep(空闲事件发生)，返回缓冲块指针\n\
    - 不在b的链中，在av链上取到延迟写的块\n  - 写出该块，分配下一个缓冲区\n- 不在b的链中，av链已空\n  - 等待任意缓冲区变空闲的事件\n\
    - 不在b的链中，在av链上得到空缓冲\n  - 填写头部，由av链摘除，出旧b链，入新b链，返回缓冲块指针\n\n### brelse(bp)\n\n-\
    \ 参数： **bp**: 缓冲区头指针\n- 返回： 无\n- 步骤：\n  - If 有等待者(b_flag&B_WANTED!=0),唤醒;\n  -\
    \ Else\n    - bfreelist上有等待者,唤醒\n    - bp入av链\n"
