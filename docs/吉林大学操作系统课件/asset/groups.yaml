    # Windows2000/XP互斥同步机制


    +   - Mutex (OS API)

    +     - CreateMutex,    //创建互斥对象，返回句柄

    +     - OpenMutex,      //打开并返回存在对象句柄

    +     - ReleaseMutex;   //释放对互斥对象的占用

    +   - semaphore (OS API)

    +     - CreateSemaphore,   //创建信号量

    +     - OpenSemaphore,     //返回已存在信号量句柄

    +     - ReleaseSemaphore;  //释放对信号量的占用'
