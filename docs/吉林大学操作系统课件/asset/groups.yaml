    \ -- | -- | -- | 快 | -- |\n| 倒排 | 易 | 大 | 大 | -- | -- | -- | -- | 快 | 快 |\n\n\
    ## 7.4 文件目录\n\n### 文件控制块与目录项\n\n- 文件控制块(FCB)\n  - 文件存在的标志，其中保存系统管理文件需要的全部信息\n\
    - 目录项\n  - 目录文件中的一项，内容为FCB\n\n### 文件目录与目录文件\n\n- 文件目录\n  - 用于检索文件的目录\n- 目录文件\n\
    \  - 内容为目录项的文件\n\n### 文件控制块FCB（File Control Block）\n\n- 文件名\n- 文件号\n- 文件主\n- 文件类型\n\
    - 文件属性\n- 共享说明\n- 文件长度\n- 文件地址\n- 建立日期\n- 最后修改日期\n- 最后访问日期\n- 口令\n- 其它\n\nFCB创建：建立文件时\n\
    \nFCB撤销：删除文件时\n\n## 单级目录 (Single-Level Directory)\n\nA single directory for all\
    \ users.\n\n![](img/7b6892715d0da57dced81602d7459e7e_682_0.png)\n\n缺点：\n\n1. Naming\
    \ problem\n2. Grouping problem\n3. Protection problem\n\n## 两级目录 (Two-Level Directory)\n\
    \nSeparate directory for each user.\n\n![](img/7b6892715d0da57dced81602d7459e7e_683_0.png)\n\
    \n特点：\n\n1. Path name\n2. Can have the same file name for different user\n3. Efficient\
    \ searching\n4. No grouping capability\n\n## 多级目录 (Multi-Level Directory as in\
    \ UNIX)\n\n![](img/7b6892715d0da57dced81602d7459e7e_684_0.png)\n\n## 文件目录的改进\n\
    \n### FCB\n\n- 次部：(文件名, 文件号)\n  - (UNIX 16 bytes)\n  - 保存在目录文件中\n- 主部：(其它, 链接计数)\n\
    \  - (UNIX 32 bytes)\n  - 保存在外存inode区域, 打开时读入内存.\n- 改进的好处\n  - 可以提高查找速度(顺序查找)\n\
    \  - 可以实现文件链接(link)\n\n## UNIX 文件目录与连接\n\n- 目录项\n  - 相当FCB次部\n  - 形式为(文件名，文件号)\n\
    - Inode\n  - 相当于FCB主部\n  - 每个inode有一个i_number\n  - 多个文件名对应同一个i_number（连接共享）\n\n\
    ## 连接实现\n\nlink(\"/users/wang/d1/f1\", \"/users/li/f2\")\n\n![](img/7b6892715d0da57dced81602d7459e7e_687_0.png)\n\
    \n## 根目录与当前目录\n\n- 根目录：在树状结构的文件系统中，根节点对应的目录为根目录。\n  - 唯一的\n  - 由它开始可以查找到所有其他目录文件和普通文件\n\
    \  - 在实现时根目录保存于外存空间中的固定位置\n- 当前目录\n  - 目录的层次较深时，如果每次查找文件都从根目录开始，其访问速度会很慢\n  -\
    \ 为了提高文件的查找速度，现代文件系统为用户提供一个目前正在使用的工作目录，称为当前目录。\n  - 查找文件可以从根目录开始，也可以从当前目录开始\n\
    \  - 用户可以随意更改当前目录\n\n## 文件目录的查找\n\n- 查找路径\n  - 由根目录开始查找\n  - 由当前目录开始查找\n- 查找算法\n\
    \  - 顺序查找（UNIX）\n  - hash查找\n  - 对分查找（要求文件名排序）\n"
  mdcn: "\n## 索引结构：\n\n一个文件可存于不连续块中，块号记在索引块中。\n\n优点：速度快，长度变化容易。\n\n缺点：索引块占空间。\n\n\
    磁盘空间\n\n![](img/7b6892715d0da57dced81602d7459e7e_669_0.png)\n\nFCB\n\n索引块=29\n\
    块数=4\n\n索引块29\n\n块18\n块19\n...\n块26\n...\n块30\n...\n\n## Hash结构：\n\n计算地址：\n\n\
    hash(key)=addr (在磁盘或文件中存放位置)\n\n问题：给定key1≠key2\n\nhash(key1)=addr1;\n\nhash(key2)=addr2;\n\
    \naddr1=addr2 (conflict)\n\n### Conflict resolution: 顺序探查法：\n\n如发生冲突，则在冲突位置开始顺序探查第一个空闲的存储位置。\n\
    \n### 保存记录：\n\n```text\nHash(key)=addr\n\n起始位置\n\n保存记录：\n\n计算addr=hash(key)\n\n\
    对应冲突计数加1\n\n本记录空闲\n\nT\n\nF\n\n标记为占用\n填记录内容\n\n顺取下一个\n\n空闲标志\n冲突计数\n\n记录内容\n\n\
    空闲标志\n冲突计数\n\n记录内容\n\n文件空间\n```\n\n![](img/7b6892715d0da57dced81602d7459e7e_671_0.png)\n\
    \n### 查找记录：\n\n```text\n计算addr=hash(key)\n\n取addr对应记录的冲突计数⇒count\n\ncount=0\n\n\
    T\n\nF\n\n无此记录\n\n本记录空闲\n\nT\n\nF\n\n顺取下一记录\n\nkey相等\n\nT\n\nF\n\n找到\n\nhash(key)相等\n\
    \nT\n\nF\n\ncount:=count-1\n\ncount=0\n\nT\n\nF\n\n无此记录\n\n顺取下一记录\n```\n\n###\
    \ 删除记录：\n\n```text\n调用查找过程(key)\n\n找到\n\nF\n\nT\n\n错误返回\n\n置空闲标志\n(找到记录)\n\n冲突计数-1\n\
    对应hash(key)\n```\n\n### 特点：\n\n按关键字检索速度非常快。\n\n### 用途：\n\n常用于目录检索。\n\n### 注意：\n\
    \n文件可循环使用，满时保存失败。\n\n## UNIX文件物理结构(索引+链接)\n\n最大\n=10+256+256²+256³(块)\n\ni_addr[0]\n\
    i_addr[9]\ni_addr[10]\ni_addr[11]\ni_addr[12]\n\ninode\n\n## 倒排结构\n\n- 思想\n  -\
    \ 记录中的域称作键，能够区别所有记录的键称为主键，以键值和记录地址构成的索引结构称为倒排结构。\n  - 键值为主键的索引称作主索引，键值为次键的索引称为次索引。\n\
