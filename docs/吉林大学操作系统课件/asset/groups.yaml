    # 5.10 驼鸟算法


    +   - 视而不见

    +     - Pro:

    +       - 工程师观点(考虑死锁发生的频率,危害,处理代价)

    +         - 死锁发生频率<其它故障引起的系统瘫痪的频率

    +         - 死锁处理 constant overhead > 危害

    +     - Cont:

    +       - 数学家观点

    +         - 必须处理,无论代价如何

    +   - 目前系统实际如此

    +     - Eg. UNIX proc结构(50 and up)'
  - '[PAGE 497]


    # 5.11 有关问题的讨论


    +   - 关于充要性算法

    +     - 已知进程关于资源活动序列

    +       - 困难: 程序中的分枝与循环

    +     - 复杂度高(NP Complete)

    +   - 生死资源问题

    +     - 消息

    +     - 消耗性资源与可重用资源并存

    +   - 关于可剥夺资源问题

    +     - 处理器：可以剥夺，不会引起死锁

    +     - 存储器：不可剥夺，当占有一部分内存的过程申请新的内存资源时，有可能发生死锁。但实现虚拟存储后，利用外存实现虚拟存储，当占有内存的过程提出新的存储请求而系统无法满足时，不让进程等待，而是为它分配外存，进程之间不会因为竞争内存资源而发生死锁。但是，若外存空间也不足时也有可能发生死锁，但这一般很罕见，因为外存空间很大。

    +   - 关于两阶段封锁

    +     - 增长阶段有可能死锁'
  - '[PAGE 498]


    # 5.12 饥饿与活锁


    +   - 饥饿(starvation)：当等待时间给进程推进和响应带来明显影响时,称发生了进程饥饿.饥饿到一定程度的进程所赋予的使命即使完成也不再具有实际意义时称该进程被饿死(starved
    to death).

