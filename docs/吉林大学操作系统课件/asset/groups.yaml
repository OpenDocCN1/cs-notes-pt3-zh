    - 涉及内容\n  - 设备驱动，设备缓冲，文件管理\n- 主要特点\n  - 允许系统管理员动态添加或删除设备，其相应的驱动程序通常以DLL的形式动态加载，设备驱动程序可以采用高级语言编写，移植性好。\n\
    \  - 除NTFS外，支持多种可装卸的文件系统，如FAT32、OS/2、HPFS、CDFS等。支持映像文件I/O。\n  - 设备管理子系统以I/O请求包(I/O\
    \ Request Package, IRP)方式驱动，每个I/O请求均以表示为I/O请求包，I/O管理器负责协调所有各组成部分之间的相互作用。\n  -\
    \ 通过系统进程(线程)提供异步I/O，在I/O请求的进程(线程)不需要等待I/O传输结果的情况下，请求者可以立即返回，具体I/O操作由系统线程负责完成。异步I/O是通过异步过程调用(Asynchronous\
    \ Procedure Call, APC)实现的。\n\n## Windows2000/XP IO子系统\n\n![](img/7b6892715d0da57dced81602d7459e7e_863_0.png)\n\
    \n## 作业\n- 1. P225:18,25\n- 2. 某文件系统为一级目录结构，文件的数据一次性写入磁盘，已写入的文件不可修改，但可多次创建新文件。请回答如下问题：\n\
    \  - （1）在连续、链式、索引三种文件的数据块组织方式中，哪种更合适？要求说明理由。为定位文件数据块，需要在FCB中设计哪些相关描述字段？\n  - （2）为快速找到文件，对于FCB而言，是集中存储好还是与对应的文件数据块连续存储好？说明理由。\n\
    \n## 第十三章 UNIX操作系统\n- 历史回顾 (Historical Perspective)\n- 系统结构 (System Structure)\n\
    - 进程管理 (Process Management)\n- 存储管理 (Memory Management)\n- 文件系统 (File System)\n\
    - 设备管理 (Device Management)\n- 系统调用 (System Calls)\n- 外壳语言 (Shell)\n\n## 13.1 历史回顾\n\
    - 1969年由美国Bell实验室的两名程序员 K.Thompson和 D.M.Ritchie设计；\n  - 最初该系统是采用汇编语言编写的。\n  -\
    \ incorporated features of other operating systems, especially MULTICS.\n- 后来二人专门为UNIX设计了C语言,并用它重新改写了UNIX中的大部分源代码,形成第三版。\n\
    \n## 13.1 历史回顾\n\n在70年代初期, UNIX在Bell实验室及许多大学中获得了广泛的应用, 这也促进了 UNIX系统的进一步发展。\n-\
    \ 1973年推出第五版\n- 1976年推出第六版\n- 1978年第七版正式发行。\n- 由于 UNIX结构良好,并被迅速地移植到 Interdata\
    \ 8/32及VAX等机器上\n"
