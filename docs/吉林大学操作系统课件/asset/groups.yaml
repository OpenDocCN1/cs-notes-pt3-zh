    \n## 13.5.4 文件目录与连接\n\n- 目录项\n  - 相当FCB次部\n  - 形式为(文件名，文件号)\n- Inode\n  - 相当于FCB主部\n\
    \  - 每个inode有一个i_number\n  - 多个文件名对应同一个i_number（连接共享）\n\n## 连接实现\n\n![](img/7b6892715d0da57dced81602d7459e7e_909_0.png)\n\
    \n| 文件 | i_number |\n|---|---:|\n| f2 | 15 |\n\n| 文件 | i_number |\n|---|---:|\n\
    | f1 | 15 |\n\n```\nlink(\"/users/wang/d1/f1\", \"/users/li/f2\")\n```\n\ni_number=15\n\
    \n## 13.5.5 文件系统映射\n\nread(4,...)\n\nread(4,...)\n...\nwrite(2,...)\n\n用户空间\n\n\
    u_ofile\n\nu_ofile\n\nfile\n\ni_node\n\n系统空间\n\n数据块\n\ni_list\n\n磁盘空间\n\n![](img/7b6892715d0da57dced81602d7459e7e_910_0.png)\n\
    \n## 相关表目\n\n### 1. u_ofile（每进程一个）\n\n```\nstruct user\n{\n    ...\n    int u_ofile[NOFILE];\n\
    \    ...\n}\n\n#define NOFILE 15\n```\n\n### 2. file（系统一个）\n\n```\nstruct file\n\
    {\n    char f_flag;   //R,W,PIPE\n    char f_count;\n    int f_inode;\n    char\
    \ *f_offset[2];\n}file[NFILE]\n\n#define NFILE 100\n```\n\n## 相关表目\n\n### 3 inode表(系统一个)\n\
    \n```\nstruct inode {\n    int    i_flag;\n    char   i_count;\n    char   i_dev;\n\
    \    char   i_number;\n    char   i_mode;\n    char   i_nlink;\n    char   i_uid;\n\
    \    char   i_gid;\n    char   i_size0;\n    char   *i_size1;\n    int    i_addr[8];\n\
    \    int    i_lastr;\n} inode[NINODE];\n```\n\n表间联系：\n\nu_ofile → file\n\n(n)\
    \        (1)\n\nfile → inode\n\n(n)        (1)\n\n## 13.5.6 文件卷的安装\n\n- **mount**：用一个文件卷的根目录取代一个已经存在的空目录节点\n\
    \nUNIX文件卷\n\n![](img/7b6892715d0da57dced81602d7459e7e_913_0.png)\n\n## 超级块结构（安装后读入内存，卸下时回写磁盘）\n\
    \n```\nStruct filesys {\nint s_isize;   //size in blocks of i list\nint s_fsize;\
    \   //size in blocks of entire volume\nint s_nfree;   //number of in core free\
    \ blocks\nint s_free[100];   //in core free blocks\nint s_ninode;   //number of\
    \ in core I list\nint s_inode[100];   //in core free I nodes\nchar s_flock;  \
    \ //free list locking\nchar s_ilock;   //i list locking\nchar s_fmod;   //super\
    \ block modified flag\nchar s_ronly;   //mounted read only flag\nchar s_time[2];\
    \   //current date of last update\nint pad[50];\n}\n```\n\n## 13.5.7磁盘空间管理：\n\n\
    100个空闲块为一组，组之间相互链接。\n\n![](img/7b6892715d0da57dced81602d7459e7e_916_0.png)\n\n\
    Super block\n...\ns_nfree=100\ns_free[0]\ns_free[1]\n...\ns_free[99]\n...\n\n\
    特点：速度快，空间省。\n\n## 13.5.8 空闲inode管理：\n\ns_inode最多可以记载100个空闲inode(编号)\n\n申请时：\n\n\
    - (1) s_ninode>0, 取s_inode[--s_ninode];\n- (2) s_ninode=0, 由磁盘inode区顺取100个空闲I节点(i_nlink=0)\
    \ 将其编号填入s_inode表中，修改s_ninode，然后分配。\n\n释放时：\n\n- (1) s_ninode<100, s_inode[s_ninode++]=i_number\
    \ (释放的);\n- (2) s_ninode=100, 丢弃。\n\n## 13.5.9 快速文件系统\n\n- 经典UNIX文件系统\n  - Inode区与内容存储区相分离\n\
    \    - 查找速度慢(引臂在inode区与块存储区之间往复移动，尤其长路径名)\n  - 文件长度大于5120字节：间接寻块\n  - 文件名长度14字节以内\n\
    - Fast File System (FFS)\n  - 1984UC Berkeley\n  - 被许多现代UNIX采用，包括4.3BSD\n  - 效率提高一个数量级\n\
    \n## 13.5.9 快速文件系统\n\n### 快速文件系统\n\n- FFS将磁碟卷划分分为若干个柱面组(cylinder group)，每个柱面组占若干连续的柱面，作为相对独立的文件卷管理\n\
    - FFS采用较大的磁碟块以减少I/O间址并提高I/O效率 (达8KB)\n- FFS打破了文件名称长度最多为14字节的限制，文件名称长度可达255字节\n\
    - FFS支持符号连接(symbolic link)，这种连接可以跨文件卷或主机\n\n## 符号连接(symbolic link)\n\n- 硬连接(hard\
    \ link)局限性:\n  - 只能连接普通文件\n  - 不能跨文件卷\n- 软连接(soft link)\n  - 可以连接目录文件\n  - 可以跨文件卷,\
    \ 或主机\n\n## 符号连接\n\nd1/d2/d4/f1 是一已存在文件\n\n```\nlink(\"d1/d2/d4/f1\",\"d1/d2/d3/f2\"\
    )\n```\n\n建立一个硬连接\n\n```\nln -s d1/d2/d4 d5/s\n```\n\n建立一个软连接，s 的内容为 d1/d2/d4\n\
    \nd5/s/f1 为 i_number=15 的文件\n\n```\n以后执行 unlink(\"d1/d2/d4/f1\")\n```\n\nd5/s/f1\
    \ 自动失效\n\n![](img/7b6892715d0da57dced81602d7459e7e_921_0.png)\n\n## 13.5.9 快速文件系统\n\
    \n### UNIX 4.3BSD柱面组\n\n|  |\n|---|---|\n| 数据块 |\n| Super block |\n| Cylinder\
    \ block |\n| Inode |\n| 数据块 |\n\n## 远程安装\n\nclient1\n\nclient2\n\nserver1\n\n\
    server2\n\n![](img/7b6892715d0da57dced81602d7459e7e_924_0.png)\n\n## NFS安装协议\n\
    \n- 建立client与server之间的初始联系\n- 安装参数包括\n  - 远程待安装目录\n  - 服务器名\n- 安装请求被映射为对应的RPC调用,并传给远程server\n\
    - 服务器端的export list指明可被安装目录列表,以及可对其执行安装操作的clients\n"
