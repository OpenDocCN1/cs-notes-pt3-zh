  md: "\n## 4.3.5.3 管程语义\n\n- 管程的共享变量在管程外部不可见，外部只能通过调用管程中的外部子程序访问共享变量；\n- 为保证对共享变量操作的数据完整性，规定管程互斥进入；\n\
    - 管程中有等待/唤醒机制，等待时释放管程的互斥权，唤醒时（P唤醒Q）：\n  - P紧急等待，Q继续，直到Q退出或等待；(Hoare)\n    - Signal\
    \ and urgent wait\n  - Q等待，P继续，直到P退出或等待；(Java)\n    - Signal and continue\n  \
    \  - 被唤醒进程需要重新检查等待条件,可能再次等待.\n  - 唤醒是管程中可执行的最后一个操作。(Hansen)\n    - Signal and\
    \ leave\n\n## Hoare管程设施\n\n- 入口等待队列：\n  - 每个管程变量一个，用于排队进入；\n- 紧急等待队列：\n  - 每个管程变量一个，用于唤醒等待；\n\
    - 内部等待队列：\n  - var c: condition; 可根据需要定义多个，用于设置等待条件。\n\n## 管程队列\n\n入口队列\n\n紧急队列\n\
    \nMonitor\n\nc1\n\nc2\n\n![](img/7b6892715d0da57dced81602d7459e7e_389_0.png)\n\
    \n## 管理成分\n\n## 入口队列\n\n## 紧急队列\n\n## 共享变量\n\n## c1\n\n## c2\n\n## 操作\n\n## 初始化代码\n\
    \n## 进入与离开\n\n- 进入管程：\n  - 申请管程互斥权。\n- 离开管程：\n  - 如紧急等待队列非空，唤醒第一个等待者；否则开放管程。\n\
    \n## 条件变量操作\n\n- Var c:condition;\n- wait(c):\n  - 如紧急队列非空，唤醒第一个等待者，否则释放管程互斥权;\n\
    \  - 执行此操作的进程（线程）进入c链尾。\n- signal(c):\n  - 如c链空，相当空操作。\n  - 否则唤醒第一个，执行此操作的进程（线程）进入紧急队列。\n\
    \n## 例1.生产消费问题\n\n```\nType producer_consumer = MONITOR\nVar B:Array[0..n-1]Of\
    \ integer;\n    count, in, out: integer;\n    pq, cq:condition;\ndefine put_in,\
    \ get_out;\nProcedure put_in(item:integer);\n    Begin\n        If(count==n)Then\n\
    \            wait(pq);\n        B[in]:=item;\n        in:=(in+1)%n;\n        count++;\n\
    \        signal(cq);\nEnd;\n```\n\n## 例1.生产消费问题\n\n```\nProcedure get_out(Var\
    \ item:integer)\nBegin\n    If(count==0)Then\n        wait(cq);\n    item:=B[out];\n\
    \    out:=(out+1)%n;\n    count--;\n    signal(pq);\nEnd;\n\nBegin\n    in:=0;\
    \ out:=0; count:=0;\nEnd;\n```\n\n## 例1.生产消费问题\n\n生产者进程：\n{生产一个item;\nproducer_consumer.put_in(item);\n\
    }while（1）\n消费者进程：\n{producer_consumer.get_out(item);\n消费一个item;\n}while（1）\n\n\
    ## 例2. 读者/写者问题\n\n写者优先\n\n```\nType readers_writers = Monitor;\nVar rq,wq: condition;\n\
    \    reading_count,write_count:integer;\nDefine start_read,finish_read,\n    start_write,finish_write;\n\
    ```\n\n## 例2. 读者/写者问题\n\n```\nProcedure start_read;\nBegin\n    If write_count>0\
    \ Then\n        wait(rq);\n    reading_count++;\n    signal(rq);\nEnd;\n```\n\n\
    ```\nProcedure finish_read;\nBegin\n    reading_count--;\n    If reading_count=0\n\
    \    Then signal(wq)\nEnd;\n```\n\n## 例2. 读者/写者问题\n\n```\nProcedure start_write\n\
    Begin\n    write_count++;\n    If (write_count>1) or\n        (reading_count>0)\n\
    \    Then\n        wait(wq)\nEnd;\n```\n\n```\nProcedure finish_write;\nBegin\n\
    \    write_count--;\n    If write_count>0\n    Then signal(wq)\n    Else signal(rq)\n\
    End;\n```\n\n## 例2. 读者/写者问题\n\n```\nBegin\n    reading_count:=0;\n    write_count:=0;\n\
    End;\nVar rw:readers_writers;\n```\n\nrw:\n\nreading_count\nwrite_count\nrq\n\
    wq\n\n读者：\n\n```\nrw.start_read;\n{reading}\nrw.finish_read;\n```\n\n写者：\n\n```\n\
    rw.start_write;\n{writing}\nrw.finish_write;\n```\n\n## 例3. 哲学家就餐问题\n\n哲学家活动：\n\
    \n```\nRepeat\n    思考\n    L: 取左叉\n    If 右叉空闲 Then\n        Begin 取右叉，进食，放左叉，放右叉\
    \ end;\n    Else Begin 放左叉, goto L end;\nUntil false\n```\n\n## 例3. 哲学家就餐问题\n\n\
    ```\nType dining-philosophers=MONITOR\n    Var fork:Array[0..4]Of(free,used);\n\
    \        q:Array[0..4]Of condition;\n    define pick_up, try_pick_up, put_down;\n\
    \    Procedure pick_up(I:0..4);\n        Begin\n            If fork[I]=used Then\n\
    \                wait(q[I]);\n            fork[I]:=used\n        End;\n```\n\n\
    ## 例3. 哲学家就餐问题\n\n```\nFunction try_pick_up(I:0..4):boolean;\n\nBegin\n\nIf fork[I]=used\
    \ Then\n\n    try_pick_up:=false\n\nElse Begin\n\n    fork[I]:=used;\n\n    try_pick_up:=true\n\
    \nEnd\n\nEnd;\n```\n\n## 例3. 哲学家就餐问题\n\n```\nProcedure put_down(I:0..4);\n   \
    \ Begin\n        fork[I]:=free;\n        signal(q[I])\n    End;\nProcedure init;\n\
    \    Var I:0..4;\n    Begin\n        For I:=0 to 4 Do fork[I]:=free;\n    End;\n\
    Begin init End;\n```\n\n## 例3. 哲学家就餐问题\n\n```\n{Eating}\nforks.put_down(I);\n\
    forks.put_down((I+1)mod 5)\nUntil false;\n```\n\n## 例4.4. 磁头引臂调度问题\n\n![](img/7b6892715d0da57dced81602d7459e7e_407_0.png)\n\
    \n## 调度算法\n\n- **FCFS (first come first serve)**\n  - 公平\n  - 效率低  (12,190,19,180,11,190...)\n\
    - **SSTF (shortest seek time first)**\n  - 效率高\n  - 磁道歧视\n- **SCAN (elevator algorithm)**\n\
    \  - 效率较高，较公平\n"
