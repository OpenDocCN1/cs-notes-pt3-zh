    \ entry set, 状态改为 runnable。\n- 锁的持有者执行 notifyAll 操作, wait set 上的所有线程出 wait set,\
    \ 入 entry set, 状态改为 runnable。\n\n## 例子：生产/消费问题--Java\n\n```\npublic class Bounded\
