  - '[PAGE 190]


    # 3.2.1.7 分类排队算法(MLQ)


    +   - 多级队列

    +     - 多个就绪队列，进程所属的队列固定。

    +   - 例如：通用系统中：

    +     - 队列1：实时进程就绪队列（HPF）

