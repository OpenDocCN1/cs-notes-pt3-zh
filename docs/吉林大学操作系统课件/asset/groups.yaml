    \  已分配内存, 但不可立即使用;\n  只有显示地解除预定状态才可使用,\n  通常用来存储区的预留;\n\n- **确认(committed)状态:**\n\
    \  已分配内存并且可访问的页面。\n\n## 第七章 文件系统\n\n- 7.1 文件与文件系统\n- 文件\n  具有符号名而且在逻辑上具有完整意义的信息项的序列。\n\
