    +     - 成为系统效率的瓶颈

    +   - 加州大学伯克利分校的研究人员提出了一种全新的文件系统，日志结构文件系统，并采用该结构重新实现UNIX文件系统


    ## 7.9日志结构文件系统


    +   在UNIX系统中创建一个文件

    +   (1) 文件名写入目录中；

    +   (2) 新文件inode更新；

    +   (3) 目录文件inode更新；

    +   (4) 写入文件内容.


    +   小量写(small write)

    +   - 一次写修改磁盘块上的一小部分数据

    +   - 假定一次写需要10ms寻道时间, 4ms旋转延迟, 50μs读写, 磁盘访问效率0.36%.


    +   延迟写

    +   - 发生故障给一致性带来威胁


    ## Log Structured File System


    +   - 日志结构文件系统

    +   - **UC Berkeley**的研究人员提出

    +   - 一种全新的文件系统


    ## 日志结构文件系统


    +   - **LSFS**将整个磁盘看做一个日志，周期性地追加新日志。写操作并非直接反映到磁盘上，而是被暂时存到内存缓冲区中，其中包括新写的数据，也包括更新数据。当积累到一定规模时，作为一个
    **segment**添加到日志的末尾。


    ## 日志结构文件系统


    +   - 当**segment**的平均长度为**1MB**时，磁盘设备的传输带宽可充分利用，得到较高的效率

    +     - 一个**segment**在磁盘上的存放是连续的，节省寻道时间和旋转延迟

    +   - **Inode map:**

    +     - **Inode**存储位置不能由其编号确定，系统维持一个**Inode map**，以实现i-number到磁盘inode的映射。

    +     - 打开文件时由i-number查inode map找到inode，进而找到文件数据块

    +   - 清洁线程(**cleaner**)

    +     - 循环扫描磁盘并对**segment**进行压缩。**Cleaner**首先读入第一个**segment**，舍弃过时内容，仍有用的inode和数据块与内存当前**segment**合并作为新的**segment**写回磁盘，旧**segment**被标记为空闲，然后顺序处理下个**segment**。


    ## 7.10 内存映射文件


    ## 背景


    +   - 文件保存于外存，存取速度慢

    +     - 访问之前需要打开

    +       - 建立文件描述符与内存打开文件表的联系

    +     - 每次访问需要经过“打开文件表”

    +     - 读写需要经过I/O传输

    +       - 缓冲可以提高速度，但首次访问需要I/O

    +   - 内存容量增加，利用率不充分

    +     - 进程虚拟空间大，只使用较小的一部分

    +   - 提示：将文件映射到内存，利用内存加快文件访问速度

    +     - 以访问内存的方式访问文件

    +       - Open, map, 使用, umap, close


    ## 7.10 内存映射文件


    +   - 内存映射文件（Memory Mapped File,MMF），就是将文件映射到内存空间，然后以内存访问方式存取文件。

    +   - 文件管理者将文件的操作转给内存管理者。


    ## Memory Mapped File


    Pi 页表


    0

    1

    2

