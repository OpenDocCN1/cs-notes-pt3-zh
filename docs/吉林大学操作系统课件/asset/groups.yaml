  md: "\n## 7.8 文件系统的界面\n\n### 创建文件\n- 命令形式: creat(path_name, fcb_args)\n- 参数说明\n\
    \  - Path_name: 文件路径名\n  - Fcb_args: FCB参数\n- 执行步骤:\n  - (1) 为此文件分配一个FCB主部, 初始化\n\
    \  - (2) 将文件名和文件号作为FCB次部填到末级目录中\n  - (3) 以写方式打开\n  - 例如: creat(\"/usr/li/d1/f1\"\
    , mode)\n\n### 打开文件\n- 命令形式: fd=open(path_name, mode)\n- 参数说明\n  - path_name:\
    \ 文件路径名;\n  - mode: 打开方式.\n- 执行步骤\n  - (1) 根据文件路径名查目录找到FCB主部;\n  - (2) 合法性检查(根据打开方式、共享说明、用户身份);\n\
    \  - (3) 根据文件号查系统打开文件表看该文件是否已被打开, 如是共享计数加1; 否则取一个空闲的系统打开文件表项并将外存中 FCB主部等信息填入此表项,\
    \ 共享计数置为1;\n  - (4) 在用户打开文件表中取一空表项, 填写打开方式和读写指针, 并指向系统打开文件表的对应表项.\n- 返回信息: fd:\
    \ 文件描述符(在用户打开文件表中的入口), 它是一个非负整数.\n\n### 关闭文件\n- 命令形式: close(fd)\n- 参数说明\n  - fd:\
    \ 文件描述符.\n- 执行步骤:\n  - (1) 由fd查用户打开文件表, 找到系统打开文件表入口;\n  - (2) 系统打开文件表中共享计数减1,\
    \ 如减1后的值为0且修改标志为1, 则将此FCB 由内存写回外存FCB主部;\n  - (3) 将fd所对应的用户打开文件表项置为空闲.\n\n### 读文件\n\
    - 命令形式: read(fd,nrd,buf)\n- 参数说明:\n  - fd: 文件描述符;\n  - nrd: 读入记录个数;\n  - buf:\
    \ 内存起始位置.\n- 步骤:\n  - (1) 由fd查用户打开文件表，找到对应的入口;\n  - (2) 合法性检查(用户打开文件表中所记录的打开方式、存取方式);\n\
    \  - (3) 查系统打开文件表，找到文件的地址;\n  - (4) 计算欲访问起始记录的位置(offset, 物理结构);\n  - (5) 将文件中由当前读指针所确定的nrd个记录读入内存中由buf起始的区域.\n\
    \n### 写文件\n- 命令形式: write(fd,nwt,buf)\n- 参数含义:\n  - fd: 文件描述符;\n  - nwt: 写出记录个数;\n\
    \  - buf: 内存起始位置.\n- 执行步骤:\n  - (1) 由fd查用户打开文件表, 找到对应的入口;\n  - (2) 合法性检查(用户打开文件表中所记录的打开方式、存取方式);\n\
    \  - (3) 查系统打开文件表, 找到文件的地址;\n  - (4) 计算欲访问起始记录的位置(物理结构, offset);\n  - (5) 如果需要,\
    \ 申请存储块;\n  - (6) 将内存中由buf起始的nwt个记录写到文件中由当前写指针所确定的区域（可能切换进程）.\n\n### 建立连接\n- 命令形式:\
    \ link(old_name,new_name)\n- 参数含义:\n  - old_name: 已存在的文件路径名;\n  - new_name: 欲连接的文件路径名.\n\
    - 执行步骤:\n  - (1) 查找目录找到文件old_name的FCB主部, 由此得到文件号;\n  - (2) 查找目录找到文件new_name的末级目录;\n\
    \  - (3) 将文件号与new_name中末级名字合起来构成一个新的目录项, 将其填入new_name的末级目录文件中;\n  - (4) 将FCB主部中的连接计数加1.\n\
    - 如: link(\"/usr/Li/f1\", \"/usr/Zhang/d2/f2\")\n\n### 断开连接\n- 命令形式: unlink(path_name)\n\
    - 参数含义:\n  - path_name: 文件路径名.\n- 执行步骤:\n  - (1) 查找目录找到文件path_name的FCB主部;\n  -\
    \ (2) 将连接计数i_nlink减1;\n  - (3) 如减1后的值为0, 则归还该文件所占用的全部存储块, 该文件将被撤销;\n  - (4) 将FCB次部由上级目录中清除.\n\
    - 如: unlink(\"/usr/Zhang/d2/f2\")\n\n## UNIX文件系统的实现\n\n### 外存空间的管理\n- 空闲块表\n-\
    \ 字位映像图(Linux)\n- 成组连接 (UNIX approach)\n\n### UNIX外存空间管理\n导引块\n超级块\ninode区域\n\
    每块16个inode,\n从0起依次编号\n\n文件存储区域\n(普通文件,目录文件)\n\n### 超级块(super block)\n- (1) 记载文件卷上k+1块到n-1块中所有空闲块,\n\
    - (2) inode区中100个空闲inode. (缓存)\n\n文件安装(mount)后超级块读入内存。\n\n注：占用区域已经记载在各个文件的inode中。\n\
    \n```\nStruct filesys {\n\tint s_isize; //size in blocks of i list\n\tint s_fsize;\
    \ //size in blocks of entire volume\n\tint s_nfree; //number of in core free blocks\n\
    \tint s_free[100]; //in core free blocks\n\tint s_ninode; //number of in core\
    \ I list\n\tint s_inode[100]; //in core free I nodes\n\tchar s_flock; //free list\
    \ locking\n\tchar s_ilock; //i list locking\n\tchar s_fmod; //super block modified\
    \ flag\n\tchar s_ronly; //mounted read only flag\n\tchar s_time[2]; //current\
    \ date of last update\n\tint pad[50];\n}\n```\n\n### 空闲块管理\n申请时：\n- (1) s_nfree>1,\
    \ 取s_free[--s_nfree];\n- (2) s_nfree=1, 将s_free[0]所指连接块读入内存, 分配s_free[0].\n\n\
    释放时：\n- (1) s_nfree<100, s_free[n_free++]=释放块号;\n- (2) s_nfree=100, 将s_nfree和s_free拷贝到释放的块中,\
    \ 将该块号记录到s_free[0], 写回外存.\n\n### 空闲inode管理\ns_inode最多可以记载100个空闲inode(编号)\n\n申请时:\n\
    - 1. s_inode>0, 取s_inode[--s_inode];\n- 2. s_inode=0, 由磁盘inode区顺取100个空闲I节点(i_nlink=0)\n\
    \n将其编号填入s_inode表中，修改s_inode，然后分配。\n\n释放时:\n- 1. s_inode<100, s_inode[s_inode++]\
    \ = i_number (释放的);\n- 2. s_inode=100, 丢弃。\n\n### 文件系统界面(UNIX系统调用)\n- creat\n\
    - open\n- close\n- seek\n- read\n- write\n- link\n- unlink\n- pipe\n- mknode\n\
    - smount\n- sumount\n- chmod\n- chowner\n- state\n- fstate\n- chdir\n\n```\nfd=creat(pathname,mode)\n\
    ```\n\npathname: 路径名；\nmode: 共享说明；\n\n- 1. 分配一个inode, 初始化(i_size=0, i_mode=mode,\
    \ i_nlink=1,i_uid=u_uid, i_gid=u_gid)；\n- 2. 填写目录项(name, i_number)；\n- 3. 以写方式打开(填写inode表、file\
    \ 表和u_ofile表)；\n- 4. 返回文件描述符。\n\n例子：\n\n```\ncreat(\"d1/d2/f1\", mode)\n```\n\n\
    假设分配i_number=15, (f1,15)=>d2中(???????????????, -1)\n"
