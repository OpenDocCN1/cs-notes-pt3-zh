    # 1.9.1 Linux系统


    # 历史


    +   - **1991, 0.01版**

    +     - 运行于intel80386，仅支持Minix文件系统，支持有限的设备驱动程序，无网络支持。


    +   - **1994, 1.0版**

    +     - 支持UNIX标准TCP/IP协议，BSD兼容的socket网络通讯协议，增强的文件系统，SCSI控制器对文件的高效访问，以及其它设备驱动程序。


    +   - **1995, 1.2版**

