    ## 4. 最近不用的先淘汰(not used recently)


    淘汰最近一段时间未用到的。


    实现：每页增加一个访问标志，

    访问置1，定时清0，

    淘汰时取标志为0的。


    ## LRU算法的近似：


    Reference string: 2, 3, 5, 6, 4, 2,5, 6, 7, 5, 6, 8,


    LRU: 3


    NUR: 2, 3, 4任意


    ## 5. 最不经常使用的先淘汰(LFU)


    淘汰使用次数最少的。


    依据: 活跃访问页面应有较大的访问次数.


    Suffer: (1) 前期使用多，但以后不用，难换出;


    (2) 刚调入的页面，引用少，被换出可能大。


    实现: 计数器，调入清0，访问增1，淘汰选取最小者。


    ## 6. 最频繁使用算法(MFU)


    淘汰使用次数最多的。


    依据: 使用多的可能已经用完了。


    Suffer: 程序有些成分是在整个程序运行中都使用的。


    ## 7. 二次机会(second chance)


    - 淘汰装入最久且最近未被访问的页面。

    - 实现时：采用拉链数据结构。


    ![](img/7b6892715d0da57dced81602d7459e7e_595_0.png)


    ## 8. 时钟算法(clock algorithm)


    - 将页面组织成环形，有一个指针指向当前位置。每次需要淘汰页面时，从指针所指的页面开始检查。如果当前页面的访问位为0，即从上次检测到目前，该页没有访问过，则将该页替换。如果当前页面的访问位为1，则将其清0，并顺时针移动指针到下一个位置。重复上述步骤直至找到一个访问位为0的页面。

    - 可以看出，时钟算法与二次机会算法的淘汰效果是基本相同的，差别在于二者所采用的数据结构不同，二次机会使用的是链表，需要额外存储空间，且摘链入链速度很慢。而时钟算法可直接利用页表中的引用位，外加一个指针，速度快且节省空间。


