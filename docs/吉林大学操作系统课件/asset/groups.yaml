    \ /*不成立*/\n{\n exec(\"P\",0);\n}\n}else{\n /*父进程代码*/\n}\n...\n```\n\n```\npid=fork();\n\
    if(pid ==0) /*成立*/\n{\n exec(\"P\",0);\n}\n}else{\n /*父进程代码*/\n}\n...\n```\n\n\
