  - '[PAGE 204]


    # 作业调度算法


    +   - 适合批作业调度的算法

    +     - 先到先服务算法(FCFS)

    +     - 优先数调度算法(HPF)

    +     - 短作业优先调度算法(SJF)

    +     - 最高响应比优先调度算法(HRN)

    +   - 不适合批作业调度的算法

    +     - 时间片轮转算法(RR)

    +     - 最短剩余时间优先(SRTN)

    +     - 反馈排队算法(FB)'
  - '[PAGE 205]


    # 3.4 实时调度(real-time scheduling)


    +   - 实时任务：

    +     - 具有明确时间约束的计算任务。

    +     - Eg.

    +       - 某时刻前必须开始处理

    +       - 某时刻前必须处理完毕

    +   - 实时调度：

    +     - 合理安排就绪实时任务的执行次序，满足每个实时任务时间约束条件的调度。'
  - '[PAGE 206]


    # 实时任务分类


    +   - 硬实时 vs. 软实时

    +     - 硬实时(hard real-time): 必须满足任务截止期要求。

    +     - 软实时(soft real-time): 期望满足截止期要求。


    +   - 周期性 vs. 随机性

    +     - 周期性: 每隔固定时间发生一次

    +     - 随机性: 由随机事件触发，其发生时刻不确定'
  - '[PAGE 207]


    # 术语解释


    +   - Ready time: 就绪时间

    +   - Starting deadline: 开始截止期

    +   - Processing time: 处理时间

    +   - Completion deadline: 完成截止期

    +   - Occurring frequency: 发生频率'
