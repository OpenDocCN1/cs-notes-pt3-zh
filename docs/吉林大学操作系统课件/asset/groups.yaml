    \ 缓冲区头指针\n- 返回： 无\n- 步骤:\n  - bp->b_flag |= B_ASYNC\n  - bwrite(bp)\n- 中断\n  -\
    \ 入av队列\n\n## 8.9 RAID技术\n\n- RAID:\n  - Redundant Array of Inexpensive Disks\n\
    \    - compared with SLEDS (Single Large Expensive Disks)\n  - Redundant Array\
    \ of Independent Disks // 独立磁盘冗余阵列\n- Proposed by researchers at UC Berkeley\n\
    \  - David A. Patterson\n- Background\n  - disk access speed increases slowly\
    \ compared with CPU\n  - solution: multiple parallel component\n- Objective\n\
    \  - enhanced performance\n  - high reliability\n- RAID\n  - RAID is a set of\
    \ physical disks viewed by the operating system as a single logical drive\n  -\
    \ Data are distributed across an array of physical drives\n  - Redundant disk\
    \ capacity is used to store parity information, which guarantees data recoverability\
    \ in case of disk failure\n- Hardware RAID vs. Software RAID\n  - hardware based:\
    \ special controller\n  - Windows NT, 2000, UNIX support software RAID\n- SCSI\
    \ RAID vs. IDE RAID\n  - performance: SCSI outperforms IDE\n  - price: IDE beats\
    \ SCSI\n\n### 8.9.1 RAID级别\n\nHow to organize data across multiple disks? Industry\
    \ standards scheme\n\n- RAID级别：行业标准规定的数据在多个磁盘上的存放方法。\n- 常见RAID级别: level0, ...,\
    \ level5;\n- RAID分条(striping)数据存储方式\n  - 位级分条(bit-level striping)\n  - 块级分条(block-level\
    \ striping)\n- RAID衡量指标\n  - 速度: 是否支持多个访问同时进行;\n  - 可靠性: 是否能够发现和改正错误;\n  - 成本:\
    \ 是否有额外的开销和开销的大小.\n\n#### Level0（数据分条）\n\n数据分条以块为单位，连续的数据条循环存放在多个磁盘上。\n\n- 访问速度快；\n\
    - 经济，空间利用率100%；\n- 无容错能力，可靠性差。\n\n![](img/7b6892715d0da57dced81602d7459e7e_834_0.png)\n\
    \n#### Level1（镜像，mirroring）\n\n数据分条以块为单位,采用分布镜像方式存储,即完全相同的数据重复存放在两个盘上。\n\n![](img/7b6892715d0da57dced81602d7459e7e_835_0.png)\n\
    \n- 访问速度快; 读一个盘、写两个盘;\n- 可靠性(恢复性)高;\n- 费用高,是无镜像磁盘数的2倍,空间利用率50%。\n\n#### Level2（位级汉明纠错码校验与恢复）\n\
    \n- 数据以位(bit)为单位分条，分布存放在多个数据磁盘上，汉明纠错码存放在纠错磁盘上。\n\n![](img/7b6892715d0da57dced81602d7459e7e_836_0.png)\n\
    \n- 纠错能力强，可靠性高；\n  - 发现2个错误, 纠正1个错误.\n- 需要较多纠错盘存放汉明纠错码, 成本较高；\n- 不能同时为多个请求服务,\
    \ 速度较慢:\n  - 读操作：所有磁盘同时访问, 数据与错误校验码被送到磁盘阵列控制器；\n  - 写操作：必须同时访问所有数据盘和纠错盘。\n\n####\
    \ Level3（位级单个奇偶校验）\n\n数据以位(bit)为单位分条，分布存放在多个数据磁盘上；只用一个冗余磁盘存放奇偶校验位。\n\n![](img/7b6892715d0da57dced81602d7459e7e_838_0.png)\n\
    \n- 有一定容错能力；\n- 存储代价较低；\n- 读写需要访问所有盘, 多个读写不能并行。\n\n#### Level4（块级异或校验）\n\n- 数据分条以块为单位,\
    \ 用异或运算产生校验信息,\n- 校验信息保存在单独的磁盘上。\n\n![](img/7b6892715d0da57dced81602d7459e7e_839_0.png)\n\
    \n- 读操作不进行异或校验, 可以并行；\n- 写操作要更新异或校验信息, 都访问校验盘, 不能并行; 写操作时校验信息更新:\n  - P’4~7=(block4\
    \ xor block4’)xor p4~7\n- 异或校验信息用于磁盘发生故障时数据块的恢复。\n\n例如：若block7所在的Disk4发生故障, 要恢复block7。\n\
    \nblock7= p4~7 XOR (block4 XOR block5 XOR block6)\n\n#### Level5（块级分布式异或校验）\n\n\
    数据分条以块为单位, 异或校验信息分散循环保存在各磁盘上。\n\n![](img/7b6892715d0da57dced81602d7459e7e_841_0.png)\n\
    \n- 校验码计算：\n  - p4~7=block4 XOR block5 XOR block6 XOR block7\n- 若block7发生故障，可通过下式恢复\n\
    \  - block7=p4~7 XOR block4 XOR block5 XOR block6\n"
