    \ | `V(s);` |\n\n## Simultaneous P-operation\n\n```\nSP(S₁,t₁,d₁;...;Sₙ,tₙ,dₙ);\n\
    if S₁>=t₁ and ... and Sₙ>=tₙ then\n    for I:=1 to n do Sᵢ:=Sᵢ-dᵢ endfor\nelse\n\
