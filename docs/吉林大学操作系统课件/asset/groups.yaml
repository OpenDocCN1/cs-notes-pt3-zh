    # 例10. 寺庙问题（死锁分析）


    +   - P操作的顺序不当会引起死锁

    +   - 上述解法是无死锁解法

    +   - 若在上述解法中存在多个小和尚、老和尚时，P操作的不当顺序会引起死锁。假设先P(bucket)然后再P(empty)就会出现死锁

    +   - 死锁一般都是在极限状态的时候判断'
