    # 6.5.1 虚拟页式存储系统


    # 基本原理


    +   - 进程运行前：

    +     - 全部装入外存，部分装入内存。


    +   - 进程运行时：

    +     - 访问页不在内存，发生缺页中断，中断处理程序：

