- raw:
  - '[PAGE 230]


    # 优先级提升


    +   - 优先级提升

    +     - **IO**操作完成

    +     - 事件等待结束

    +     - 前台进程中的线程完成一个等待操作

    +     - 由于窗口活动而唤醒**GUI**线程

    +     - 就绪超过一定时限，未获得处理机

    +   - 优先级提升不会超过15'
  - '[PAGE 231]


    # 抢占CPU


    +   - 抢先情形

    +     - 被唤醒线程优先级高于运行线程优先级；

    +     - 某线程的优先级动态变化

    +   - 被抢先线程

    +     - 回到相应就绪队列

    +     - 时间配额

    +       - 实时线程：重新分配完整时间配额

    +       - 其它线程：保持剩余配额'
  - '[PAGE 232]


    # 时间配额(quantum)


    +   - 配额长度： 6--36

    +   - 时钟中断（15ms发生一次）减3， 2--12次时钟中断（30ms--180ms）配额用完

    +   - 配额用完后进入就绪队列，优先级下降'
  - '[PAGE 233]


    # SMP上的线程调度


    +   - 线程与CPU的亲合关系

    +     - 每个进程有一个处理器亲合掩码，缺省为所有处理器的集合

    +     - 线程继承其进程的亲合掩码

    +     - 亲合掩码可以修改

    +       - SetProcessAffinityMask,

    +       - SetThreadAffinityMask;'
  - '[PAGE 234]


    # SMP上的线程调度


    +   - 线程的理想处理器（Ideal processor）

    +     - 首选处理器：

    +     - 第二处理器：（在内核线程控制块中）

    +   - 理想处理器确定

    +     - 线程创建时随机确定，

    +     - 分散各个线程与处理机对应关系。

    +     - 线程可修改SetThreadIdealProcessor'
  - '[PAGE 235]


    # 就绪线程对处理器的选择


    +   - 有空闲处理器

    +     - 首选处理器

    +     - 第二处理器

    +     - 当前执行处理器（正执行调度代码）

    +     - 由高到低顺序找空闲的处理器

    +   - 无空闲处理器，考虑抢先

    +     - 首选处理器

    +     - 第二处理器

    +     - 可运行编号最大处理器

    +   - 不能抢先进入相应的就绪队列'
  - '[PAGE 236]


    # 处理器对就绪线程的选择


