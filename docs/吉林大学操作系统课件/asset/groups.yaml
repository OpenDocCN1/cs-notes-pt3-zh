    - 消耗大量处理机时间。\n\n### 8.3.2 中断驱动方式\n\nCPU：\n- 计算\n- 启动设备\n- 计算\n- …\n- 计算\n- 中断处理\n\
    - 计算\n\n设备：\n- 工作\n\n特点：CPU与设备并行工作\n\n- 设备多时对CPU打扰多\n- 字符型设备对CPU中断打扰多\n\n### 8.3.3\
    \ DMA方式\n\n- 硬件提供DMA控制器，其内部设有若干寄存器，包括操作码寄存器、操作数寄存器、忙碌标志寄存器、状态寄存器等。\n- DMA控制器通过总线与设备、内存相连。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_776_0.png)\n\n### DMA方式的传输步骤\n\n1.\
    \ CPU将操作数送到DMA控制器的操作数寄存器operands中，包括内存起始地址、传输数量等。\n2. CPU将操作码送到DMA控制器的opcode寄存器以启动DMA控制器。DMA控制器将其忙碌寄存器(busy)置位，表明在此期间不再接受新的操作命令。此后，CPU可以执行与该控制器无关的其它操作。\n\
    3. DMA控制器与设备交往，将数据由缓冲区传送到设备或者由设备传送到缓冲区。\n4. DMA控制器将缓冲区内容复制到内存空间，或由内存空间复制到缓冲区。\n\
    5. 计数器值减1。若结果非0（未传送完）则转步骤③继续传输；否则转步骤⑥。\n6. 传输结束时，DMA控制器复位其忙碌寄存器，并向CPU发送中断请求。\n\
    7. CPU读入并检查其DMA状态寄存器，以确认操作是否成功。\n\n### 8.3.4 通道方式\n\n- 通道\n  - 负责IO操作的处理机\n  \
    \  - 指令系统\n      - 基本操作：控制、读、写、转移、结束\n      - 指令格式：（操作码，传输量，特征位，地址）\n    - 运控部件\n\
    \      - CAW，CCW，CSW，CDW\n    - 存储区域（与CPU共用内存，通道内有缓冲区）\n      - 通道程序，IO数据（channel\
    \ does have its buffers）\n\n### 通道程序执行过程：\n\n按CAW取通道命令⇒CCW\n\n(CAW) +1 ⇒CAW\n\n\
    是通道结束命令？\n\n- T：向CPU发中断\n- F：执行此命令\n\n一个通道程序可以控制若干设备进行多次IO传输。\n\n### 通道类型\n\n\
    - 字节多路通道(byte multiplexer channel)\n  - 多个非分配型子通道，连接低速外围设备\n- 数组选择通道(block selector\
    \ channel)\n  - 一个分配型子通道，连接多台高速设备\n- 数组多路通道(block multiplexer channel)\n  - 多个非分配型子通道，连接多台高速设备\n\
    \n### 设备、通道、内存连接\n\n![](img/7b6892715d0da57dced81602d7459e7e_782_0.png)\n\n##\
    \ 8.4 设备的分配与去配\n\n### 数据结构\n\n### 设备控制块(UCB)\n\n- 设备标识\n- 设备状态\n- 相连通道\n- 占有设备进程\n\
    \n### 通道控制块(CCB)\n\n- 通道标识\n- 通道状态\n- 通道类型\n- 占有通道进程\n\n### 系统设备表(SDT)\n\n| 设备类\
    \ | 总数 | 设备等待队列 | UCB表指针 |\n| --- | --- | --- | --- |\n| ... | ... | ... | ...\
    \ |\n| lp | m | Sm |  |\n| ... | ... | ... | ... |\n\n- UCB\n- UCB\n- ...\n- UCB\n\
    \n### 独占型设备的分配与去配\n\n用户使用独占型设备活动：\n\n申请，使用，使用，...，使用，释放\n\n申请：\n1. 根据设备类查SDT表\n\
    2. P(Sm)\n3. 查UCB表找一空闲设备并分配\n\n使用：\n1. 分配通道\n2. IO传输\n3. 去配通道\n\n释放：\n1. 找SDT表对应入口\n\
    2. 查UCB表，去配\n3. V(Sm)\n\n### 共享型设备的分配与去配\n\n- 用户使用共享型设备活动\n  - 使用，使用，...，使用\n\
    - 特征\n  - 来自文件系统；\n  - 每次读（写）一块；\n  - 通常经过缓冲；\n  - 排队优化。\n- 使用\n  - 分配通道； IO操作；\
    \ 释放通道\n"
