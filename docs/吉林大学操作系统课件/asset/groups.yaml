  - '[PAGE 932]


    # 13.6 设备管理


    +   - 打开一个设备文件即相当于申请对应的设备，如该设备已处于打开状态则等待

    +   - 关闭一个设备文件即相当于释放对应的设备，如有等待者则唤醒一个

    +   - 读写一个设备文件就相当于对所对应的设备执行 I/O 操作'
  - '[PAGE 933]


    # # 缓冲与缓存


    +   - 块型设备缓冲


    +   - 用于磁盘、磁带等设备的I/O传输


    +   - 每个缓冲区的长度与块型物理设备中一个块的长度相同, 即为512字节


    +   - 缓冲区为所有块型设备公用, 其总数为15个'
  - '[PAGE 934]


    # 块型设备缓冲


    ```

    struct buf

    {

    int b_flags;        /* see definition below */

    struct buf *b_forw; /* headed by devtab of b_dev */

    struct buf *b_back; /* 设备b链向后指针 */

    struct buf *av_forw; /* av链向前指针 */

    struct buf *av_back; /* av链向后指针 */

    int b_dev;          /* 设备名 */

    int b_wcount;       /* 传送字数 */

    char *b_addr;       /* 内存地址(低位) */

    char *b_xmem;       /* 内存地址(高位) */

    char *b_blkno;      /* 设备物理块号 */

    char b_error;       /* 返回出错信息 */

    char *b_resid;      /* 传送剩余字节 */

    }buf[NBUF];

    ```'
  - '[PAGE 935]


    # 块型设备控制结构


    ```

    struct devtab

    {

    char d_active;    /* busy flag */

    char d_ercnt;    /* error count */

    struct buf *b_forw;    /* first buffer for this dev */

    struct buf *b_back;    /* last buffer for this dev */

    struct buf *d_actf;    /* head of IO queue */

    struct buf *d_actl;    /* tail of IO queue */

    }

    ```'
  - '[PAGE 936]


