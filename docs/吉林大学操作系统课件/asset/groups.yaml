  md: "\n## UNIX文件卷(volume)组织形式：\n\n导引块\n\n特殊块\n\ninode区域\n\n每块16个inode，从0起依次编号\n\n\
    文件存储区域\n(普通文件,目录文件)\n\n![](img/7b6892715d0da57dced81602d7459e7e_690_0.png)\n\n\
    ## 7.5 文件的共享\n\n### 共享目的\n\n- 节省存储空间\n  - (cc,vi,yacc)\n- 进程相互通讯\n  - UNIX pipe()\n\
    - 文件共享模式\n  - 不同时使用\n    - 根据共享说明\n  - 同时使用\n    - 根据共享说明和(relaxed)R/W规则\n\n##\
    \ 文件共享\n\n### 文件共享的实现\n\n- 公共目录\n- 共享说明\n- 连接\n\n```\nlink(\"/usr/users/wang/d1/f1\"\
    ,\n\"/usr/users/li/f2\")\n```\n\n```\nunlink(\"/usr/users/wang/d1/f1\")\n```\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_692_0.png)\n\n## 7.6 文件的保护、保密与安全\n\n\
    - 保护\n  - 防止用户对文件进行非授权的访问\n- 保密\n  - 防止文件内容泄露\n- 安全\n  - 防止文件被破坏\n    - 自然因素\n\
    \    - 人为因素\n\n## 7.6.1文件的保护(Protection)\n\n- File owner/creator should be able\
    \ to control:\n  - what can be done\n  - by whom\n- Types of access\n  - Read\n\
    \  - Write\n  - Execute\n  - Append\n  - Delete\n  - List\n\n## 1. 存取控制矩阵\n\n\
    |  | f1 | …… | fj | …… | fn |\n|---|---|---|---|---|---|\n| u1 | a11 | …… | a1j\
    \ | …… | a1n |\n| … | … | …… | … | …… | … |\n| ui | ai1 | …… | aij | …… | ain\
    \ |\n| … | … | …… | … | …… | … |\n| um | am1 | …… | amj | …… | amn |\n\naij: R\
    \ W E A M D\n\n特点：\n\n权限规定细，过于繁琐，占较多存储空间\n\n## 2. 访问权限说明 (UNIX) i_mode\n\n![](img/7b6892715d0da57dced81602d7459e7e_696_0.png)\n\
    \n文件主类别: 访问进程u_uid==i_uid\n\n同组用户类别: 访问进程u_gid==i_gid\n\ni_mode在创建文件时给出, creat(filename,\
    \ mode)\n\n其后文件主可以修改: chmod(filename, new_mode)\n\n![](img/7b6892715d0da57dced81602d7459e7e_696_1.png)\n\
    \n## 保存时：\n\n- 用一个**key**启动一个随机数发生器，产生一个随机数序列，将其依此加到文件的各个字中。\n\n## 读取时：\n\n- 用同一个**key**启动同一个随机数发生器，产生相同随机数序列，将其依次由文件的各个字中减去。\n\
    \n线性同余法产生伪随机数：\n\n```\nProcedure random(Var key:integer);\nBegin\n    key:=(key*C1+C2)MOD\
    \ C3\nEnd;\n```\n\n## 7.6.3 文件系统的安全\n\n### Backup\n\n- 定期将磁盘上文件复制到磁带上\n- 发生故障时由磁带恢复(limited\
    \ recovery)\n\n### 实现方法\n\n- 海量转储\n  - 定期将磁盘上文件全部复制到磁带上\n- 增量转储\n  - 每次只复制修改部分\n\
    \  - 节省磁盘空间，缩短备份时间\n  - 数据恢复比较麻烦，可靠性差\n\n## 7.6.3 文件系统的安全\n\n- 差分转储\n  - 开始时对系统先进行一次完全转储，以后只将当天与开始第一次备份的内容不同的数据备份到磁带上\n\
    \  - 避免上两种转储的缺点，并综合了他们的优点\n- 磁盘整理\n  - 利用转储和恢复可以对磁盘进行整理(使文件物理块连续，空闲盘块连续)\n\n##\
    \ 7.7 文件系统的实现\n\n- 7.7.1 内存所需表目\n  - 系统打开文件表(系统一个)\n\n| FCB主部 | 文件号 | 共享计数 | 修改标志\
    \ |\n|---|---|---|---|\n|  |  |  |  |\n|  |  |  |  |\n|  |  |  |  |\n\n## UNIX文件系统的实现\n\
    \n- 内存所需表目 (UNIX)\n  - 用户打开文件表\n    - u_ofile (每个进程一个)\n    - file (整个系统一个)\n\
    \  - 系统打开文件表\n    - Inode (整个系统一个)\n\n## UNIX内存表目：\n\n1. u_ofile (每进程一个)\n\n```\n\
    struct user\n{\n    ...\n    int u_ofile[NOFILE];\n    ...\n}\n```\n\n```\n#define\
    \ NOFILE 15\n```\n\n2. file (系统一个)\n\n```\nstruct file\n{\n    char f_flag;  //R,W,PIPE\n\
    \    char f_count;\n    int f_inode;\n    char *f_offset[2];  //读写指针\n}file[NFILE]\n\
    ```\n\n```\n#define NFILE 100\n```\n\n## UNIX系统的FCB\n\n```\nstruct inode(外存)\n\
    {\n    int  i_mode;\n    char i_nlink;\n    char i_uid;\n    char i_gid;\n   \
    \ char i_size0;\n    char *i_size1;\n    int  i_addr[8];\n    int  i_atime[2];\n\
    \    int  i_mtime[2];\n}\n```\n\n```\nstruct inode (内存)\n{\n    int  i_flag;\n\
    \    char i_count;\n    char i_dev;\n    char i_number;\n    char i_mode;\n  \
    \  char i_nlink;\n    char i_uid;\n    char i_gid;\n    char i_size0;\n    char\
    \ *i_size1;\n    int  i_addr[8];\n    int  i_lastr;\n}inode[NINODE];\n```\n\n\
    表间联系：\n\nu_ofile → file\n(n)      (1)\n\nfile → inode\n(n)      (1)\n\n## 表间联系\n\
    \n用户空间\n\n系统空间\n\n磁盘空间\n\nread(4,...)\n\nread(4,...)\n...\nwrite(2,...)\n\nu_ofile\n\
    \nu_ofile\n\nfile\n\ni_node\n\n数据块\n\ni_list\n\n## 外存空间的管理\n\n- 空闲块表\n- 空闲块链\n\
    - 字位映射图\n- UNIX:成组连接\n\n## 空闲块管理(成组连接):\n\n100个空闲块为一组，组之间相互链接，最前面的组缓冲到内存。\n\n\
    s_nfree=66\ns_free[0]\ns_free[1]\n...\ns_free[65]\n...\n\nSuper block\n\n特点：速度快，空间省。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_710_0.png)\n\n## 空闲块管理：\n\n### 申请时：\n\
    \n- 1. s_nfree>1, 取s_free[--s_nfree];\n- 2. s_nfree=1, 将s_free[0]所指连接块读入内存,分配s_free[0].\n\
    \n### 释放时：\n\n- 1. s_nfree<100, s_free[s_nfree++] = 释放块号;\n- 2. s_nfree=100, 将s_nfree和s_free拷贝到释放块中,将该块号记录到s_free[0],写回外存,\
    \ s_nfree=1,\n"
