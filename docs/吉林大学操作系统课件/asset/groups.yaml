    \ space)的分配与去配\n- 设备资源管理\n  - 分配策略\n  - IO控制\n\n## 2.2 进程的引入\n\n- 2.2.1 进程的概念\n\
    - 2.2.2 进程状态及状态转换\n- 2.2.3 进程控制块\n- 2.2.4 进程的组成与上下文\n- 2.2.5 进程的队列\n- 2.2.6 进程的类型与特征\n\
