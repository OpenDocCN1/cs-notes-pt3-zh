    # 3.5.1 自调度(self scheduling)


    +   - 均衡调度(balanced scheduling)

    +   - 一个就绪队列(多处理机访问互斥)

    +     - 优点

    +       - 不需要专门的处理机从事任务分派工作

    +       - 任务分配均衡

    +     - 缺点

    +       - 当CPU较多时,就绪队列成为瓶颈

    +       - 线程两次调度可能处于不同处理机

    +       - 不能保证同组线程同时调度'
