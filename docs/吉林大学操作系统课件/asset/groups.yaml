    \n- 建立管道 pipe(fd)\n  - 分配一个inode, (i_flag标志为PIPE文件, i_count=2)\n  - 分配2个file表目(f_flag分别为R和W,\
    \ 读/写指针为0)\n  - 分配2个u_ofile表目, 分别指向2个file表目\n  - 返回2个文件描述符fd[0],fd[1], 分别为u_ofile中的2个入口\n\
    \n## 有关文件的系统调用命令\n\n- 安装文件卷 smount( )\n  - 检查是否超级用户\n  - 找到 special_pathname 文件的\
    \ inode (用 makenode 建立)\n  - 合法性检查（特殊块型文件）\n  - 找到 directory_pathname 节点的 inode\n\
    \  - 如非目录或引用数大于 1，错返\n  - 读入 super block 到 buf，按 filesys 格式解释\n  - 分配一个 mount\
    \ 表项，填写（m_dev， m_bufp， m_inodep）\n  - 安装节点 inode 的 i_addr[0] = 设备文件 i_addr[0]\n\
    \  - 安装节点 inode 的 i_flag = | IMOUNT\n"
