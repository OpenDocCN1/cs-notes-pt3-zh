    \ 尤晋元, 史美林, 陈向群等. Windows 操作系统原理, 机械工业出版社, 2001.\n\n## 第一章 操作系统概述\n\n- 操作系统的概念\n\
    - 操作系统的历史\n- 操作系统的特性\n- 操作系统的类型\n- 操作系统的运行环境\n- 操作系统的界面形式\n- 操作系统的运行机理\n- 研究操作系统的几种观点\n\
    \n### 1.1 操作系统概念\n\n- 操作系统地位\n- 操作系统作用\n- 操作系统定义\n\n![](img/7b6892715d0da57dced81602d7459e7e_6_0.png)\n\
    \n#### 1.1.1 操作系统地位\n\n- 硬件抽象层（HAL）之上\n- 所有其它软件层之下\n\n![](img/7b6892715d0da57dced81602d7459e7e_7_0.png)\n\
    \n#### 运行视图\n\n- 系统库(lib)可调用操作系统，执行硬件指令\n- 应用程序可以调用lib和操作系统，执行硬件指令\n\n![](img/7b6892715d0da57dced81602d7459e7e_8_0.png)\n\
    \n#### 1.1.2 操作系统的作用\n\n- 管理系统中软件硬件资源\n  - CPU：一个CPU, 多个可运行的程序\n  - 内存：进程空间相对独立,\
    \ 支持共享\n  - 设备：分配, 驱动\n  - 文件：实现文件系统, 支持文件操作\n- 为用户(应用程序)提供良好的服务(界面)\n  - API\n\
    \  - GUI, 行式命令(ls, cd, cat, vi, rm, mount, ...)\n  - JCL (Job Control Language)\n\
    \n#### 1.1.3 操作系统定义\n\n- 操作系统是位于硬件层(HAL)之上，所有其它软件层之下的一个系统软件，是管理系统中各种软硬件资源，方便用户使用计算机系统的程序集合。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_10_0.png)\n\n### 1.2 操作系统的历史\n\n- 操作系统的产生\n\
    \  - 手工操作阶段\n  - 成批处理阶段\n  - 执行系统阶段\n- 操作系统的完善\n  - 多道批处理系统\n  - 分时系统\n  - 实时处理系统\n\
    \  - 通用操作系统\n- 网络操作系统\n- 分布式操作系统\n- 多处理器操作系统\n- 单用户操作系统\n- 面向对象操作系统\n- 嵌入式操作系统\n\
    - 智能卡操作系统\n\nEvolution\n\n### 1.2.1 操作系统的产生\n\n#### 一、手工操作阶段（20世纪40年代，无操作系统）\n\
    \n作业处理步骤：\n\n- (1) (程序、数据)→穿孔机→纸带；\n- (2) 穿孔纸带→光电机→机器内存；\n- (3) 控制台开关启动第一条指令\n\
    \  （出错时显示地址，修改指令）；\n  （如有输入需要安装数据纸带）\n- (4) 运行结果在电传打字机上输出。\n\n缺点：\n\n- (1)资源独占；(2)手工费时。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_12_0.png)\n\n##### 例子\n\n- 一个作业在1000次/s的机器上运行需要\
    \ 1 hour，手动操作时间4min，手动时间与程序运行时间之比为1:15；\n- 如果计算机速度提高到600,000次/s，同样程序运行只需6s，而手动操作时间不变，手动操作与程序运行时间之比为40:1\n\
    \n#### 2、批处理阶段（20世纪50年代，操作系统雏形）\n\n##### (1) 联机批处理：\n\n![](img/7b6892715d0da57dced81602d7459e7e_14_0.png)\n\
    \n- 优点：摆脱了人工干预（作业过渡没有人的干预，一个作业处理过程没有人的干预）\n- 缺点：I/O操作慢，主机等待时间长\n\n##### (2) 脱机批处理：\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_15_0.png)\n\n- 优点：减少了主机等待I/O操作时间\n\
    - 缺点：(1)人工搬动磁带；(2)额外的卫星机\n\n#### 3、执行系统阶段（20世纪60年代初期）\n\n通道：专门用于控制I/O设备的处理机，即I/O处理机。\n\
    \n- 有自己的指令系统和运控部件；\n- 与主机共享内存；\n- 接受主CPU委托执行通道程序，完成I/O；\n- 通道I/O操作与主CPU并行；\n-\
    \ 通道完成I/O时，向主机发中断请求。\n\n操作系统的初级阶段，通道和中断技术的出现。\n\n![](img/7b6892715d0da57dced81602d7459e7e_17_0.png)\n\
    \n非联机，非脱机，假脱机（SPOOLing, Simultaneous Peripheral Operation On-Line）\n\n### 1.2.2\
    \ 操作系统的完善\n\n1. 多道批处理系统（60年代初期）\n   - 执行系统：单道作业，资源利用不充分；\n   - 多道批处理：主机中同时放多个作业，最大限度提高资源利用率；\n\
    \     - 单道到多道：不是量的变化，是质的飞跃\n     - 带来问题：互斥、同步、通讯、死锁、饥饿、饿死\n     - 多道批处理出现，标志操作系统走向成熟\n\
    2. 分时系统（60年代初、中期）\n   - 程序员提出：联机操作的要求；\n   - 一台主机，多个终端，交互式工作。\n3. 实时系统（60年代中期）\n\
    \   - 背景：计算机应用领域扩大：（工业控制、医疗控制、航班订票等）。\n   - 要求：满足时间约束条件\n4. 通用操作系统（60年代后期）\n \
    \  - 上述三类系统的结合，标志操作系统完善。\n\n### 1.2.3 操作系统的发展\n\n1. 计算机体系结构由集中向分散的发展，出现了计算机网络，由此产生网络操作系统和分布式操作系统；\n\
    2. 随着家用和商用微型计算机的普及，出现了单用户多任务的操作系统；\n3. 大型计算任务要求计算机系统具有极强的计算和处理能力，产生了支持多处理器的并行操作系统；\n\
    4. 随着各种处理器芯片和存储介质在控制领域的广泛应用，出现了微内核(micro kernel)操作系统体系结构，产生了嵌入式和智能卡操作系统；\n5. 随着后摩尔时代的到来，提高单处理器速度已近极限，多核技术应运而生。新一代操作系统遇到的问题：多核的并发控制；多核下的进程调度。\n"
