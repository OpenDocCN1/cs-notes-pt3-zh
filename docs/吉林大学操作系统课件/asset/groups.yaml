    | P₁ | 0 | 17 | 0 | 30 | 30 | 1.76 |\n| P₂ | 0 | 10 | 4 | 25 | 25 | 2.5 |\n| P₃\
    \ | 0 | 3 | 8 | 11 | 11 | 3.67 |\n\n平均周转时间 = (30+25+11)/3 = 22\n\n平均带权周转时间 = (1.76+2.5+3.67)/3\
    \ = 2.64\n\n平均等待时间 = (13+15+8)/3 = 12(ms)\n\n## 3.2.1.7 多级队列算法(MLQ)\n\n- 多级队列\n\
    \  - 多个就绪队列，进程所属的队列固定。\n- 例如：通用系统中：\n  - 队列1：实时进程就绪队列（HPF）\n  - 队列2：分时进程就绪队列（RR）\n\
    \  - 队列3：批处理进程就绪队列（HPF）\n\n## 3.2.1.8 反馈排队算法(FB)\n\n### Feed-Back\n\n- 多个就绪队列，进程所属队列可变。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_191_0.png)\n\n调度效果：\n\n- 短进程优先处理\n\
    \  - 运行时间短的进程在前面几个队列之后就可以执行完，而前面队列优先级高是被优先调度的。\n- 设备资源利用率高\n  - 交互式进程经常进入等待状态（等待用户输入），一旦被唤醒（输入完成），进入最高级队列，可尽快被调度选中，投入运行，可以尽快使用设备；\n\
    - 系统开销小\n  - 计算量大的进程用完前面n-1级时间片，没有处理完，落入底层队列，调度频率下降，但每次获得较长的时间片。\n\n## 3.2.2 处理机调度时机\n\
    \n- 运行进程结束；\n- 运行进程等待；\n- 处理机被剥夺。\n- 进程切换。\n- 中断是进程切换的前提，但不是充分条件。\n\n- 必然引起进程切换的中断\n\
    \  - 进程自愿结束，exit()\n  - 进程被强行终止；\n    - 非法指令，越界，kill\n  - 进程等待\n- 可能引起进程切换的中断\n\
    \  - 时钟\n  - 系统调用\n\n## 3.2.3 处理机调度过程\n\n- dispatcher\n  - 保存下降进程的现场\n    - 寄存器（PSW,\
    \ PC, SP, 通用寄存器, 地址寄存器）=> PCB\n  - 选择上升进程\n    - 按处理机调度算法\n  - 恢复上升进程的现场\n   \
    \ - PCB => 寄存器\n    - 先恢复通用寄存器和地址寄存器，最后恢复PSW, PC\n    - PSW和PC必须用一条指令恢复\n\n##\
    \ 3.3 调度级别与多级调度\n\n- 3.3.1 交换与中级调度（Swapping and mid-level scheduling）\n- 3.3.2\
    \ 作业与高级调度（Job and high-level scheduling）\n\n处理机调度为低级调度（CPU scheduling = low level\
    \ scheduling）。\n\n### 3.3.1 交换与中级调度\n\n- 术语\n  - 交换（swapping）\n  - 中级调度（mid-level\
    \ scheduling）\n  - 并发度（degree of multi-programming）\n- 目标：控制并发度\n  - 并发度过高\n \
    \   - 系统开销大\n    - 响应速度慢\n    - 内存等资源紧张\n    - 进程（线程）频繁进入等待状态\n    - More deadlocks\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_198_0.png)\n\n### UNIX的中级调度（sched #0）\n\
    \n- 移入SRUN状态进程\n- 如内存不够，\n  - 移出SWAIT和SSTOP状态进程；\n  - 如还不够，移出SSLEEP和SRUN状态进程；\n\
    \    - 条件：\n      - 待移入进程在外存时间≥3秒；\n      - 待移出进程在内存时间≥2秒。\n\n### 3.3.2 作业与高级调度\n\
    \n作业状态：\n\n- 提交：输入机向输入井传送\n- 后备：在输入井，尚未进入内存\n- 执行：分解为进程，在内存处理\n- 完成：处理完毕，结果在输出井\n\
    - 退出：由输出井向打印机传送\n\n状态转换：\n\n- 提交→后备：由SPOOLing输入进程完成（Simultaneous Peripheral Operations\
    \ On-Line）\n- 后备→执行：由作业调度(1)（高级调度）完成\n- 高级调度：系统进程\n- 执行→完成：由作业调度(2)完成\n- 完成→退出：由SPOOLing输出进程完成\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_201_0.png)\n\n- 1. 批处理作业调度程序(1)：在后备作业集合中选择作业，并为其建立作业控制进程来处理该作业。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_202_0.png)\n\n- 2. 批处理作业调度程序(2)：对终止的作业控制进程进行善后处理。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_203_0.png)\n\n### 作业调度算法\n\n- 适合批作业调度的算法\n\
    \  - 先到先服务算法（FCFS）\n  - 优先数调度算法（HPF）\n  - 短作业优先调度算法（SJF）\n  - 最高响应比优先调度算法（HRN）\n\
    - 不适合批作业调度的算法\n  - 时间片轮转算法（RR）\n  - 最短剩余时间优先（SRTN）\n  - 反馈排队算法（FB）\n\n## 3.4 实时调度（real-time\
    \ scheduling）\n\n- 实时任务：\n  - 具有明确时间约束的计算任务。\n  - e.g.\n    - 某时刻前必须开始处理\n   \
    \ - 某时刻前必须处理完毕\n- 实时调度：\n  - 合理安排就绪实时任务的执行次序，满足每个实时任务时间约束条件的调度。\n\n### 实时任务分类\n\
    \n- 硬实时 vs. 软实时\n  - 硬实时（hard real-time）：必须满足任务截止期要求。\n  - 软实时（soft real-time）：期望满足截止期要求。\n\
    - 周期性 vs. 随机性\n  - 周期性：每隔固定时间发生一次\n  - 随机性：由随机事件触发，其发生时刻不确定\n\n### 术语解释\n\n- Ready\
    \ time：就绪时间\n- Starting deadline：开始截止期\n- Processing time：处理时间\n- Completion deadline：完成截止期\n\
    - Occurring frequency：发生频率\n"
