    # Java语言中的“管程”


    +   - 类似管程的对象object

    +     - 每个object有一个互斥锁lock，一般未用；

    +     - 说明为synchronized的method启用互斥锁；

    +     - 每个object内部有一个等待队列；

    +     - wait() method:

    +       - 释放lock，状态改为blocked，进入wait set.

    +     - notify() method:

    +       - 在wait set中取任意线程，移到entry set,状态改为runnable. (Signal and continue)

    +     - notifyAll() method:

    +       - Wait set所有线程移到entry set，状态改为runnable.'
  - '[PAGE 431]


    # Entry set and wait set


    ![](img/7b6892715d0da57dced81602d7459e7e_431_0.png)'
  - '[PAGE 432]


    # Entry set and wait set


    +   锁的持有者执行wait操作, 状态改为blocked, 释放所持有的锁, 进入wait set; 若entry set非空, 选择其一进入同步方法。


    +   锁的持有者执行notify操作, 任选wait set上的一个线程, 入entry set, 状态改为runnable。


    +   锁的持有者执行notifyAll操作, wait set上的所有线程出wait set, 入entry set, 状态改为runnable。'
