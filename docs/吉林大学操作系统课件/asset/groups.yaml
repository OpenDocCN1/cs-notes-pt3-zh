    p_pid=12\np_ppid=9\nuser结构\n\n```\npid=fork();\nif(pid==0) /*不成立*/\n{\n    execl(\"\
    P\",0);\n}else{\n    /*父进程代码*/\n}\n...\n```\n\n程序P（覆盖原来程序）\n\n父进程\n\n子进程\n\n##\
    \ exit() 进程自我终止\n\nproc结构\np__pid=9\np__ppid=5\nuser结构\n\nproc结构\np__pid=12\n\
    p__ppid=9\nuser结构\n\n```\npid=fork();\nif(pid==0) /*不成立*/\n{\n    execl(\"P\"\
    ,0);\n}else{\n    /*父进程代码*/\n    id=wait(&s)\n}\n...\n```\n\n程序P（覆盖原来程序）\nexit(2)\n\
    \n父进程\n\n子进程\n\n## 2.2.8 进程的创建与撤销\n\n- 在 UNIX 系统中通过系统调用 fork 可创建新进程。\n  - 新进程由原来进程的地址空间的复制组成,\
    \ 这种机制利于父进程与子进程方便进行通信。\n  - 两个进程都继续执行位于系统调用 fork 之后的指令\n    - 新进程返回值为 0\n    -\
    \ 父进程返回值为子进程的进程标识符（一个非 0 正整数）。\n\n## 2.2.8 进程的创建与撤销\n\n- 在**UNIX**系统中通常在系统调用**fork**之后，新进程会使用系统调用**exec1**，来加载新程序。\n\
    - **windows NT**操作系统支持两种方式\n  - 父进程地址空间可以被复制\n  - 或者父进程可以在创建进程时就提供程序名让操作系统把新程序直接装入新进程的地址空间。\n\
    \n例子：设有8个程序，执行次序如下图所示，试用 fork,execl,wait,exit系统调用描述之。\n\n![](img/7b6892715d0da57dced81602d7459e7e_97_0.png)\n\
    \n```\nmain()\n{\n    int pid1,pid2,pid3,pid4,pid5,pid6,pid7,pid8;\n    int end_p1=end_p2=end_p3=end_p4=end_p5=...=end_p8=0;\n\
    \    int pid, status;\n\n    if((pid1=fork())==0) execl(\"P1\",0);\n    wait(&status);\n\
    \    if((pid2=fork())==0) execl(\"P2\",0);\n    if((pid3=fork())==0) execl(\"\
    P3\",0);\n    if((pid4=fork())==0) execl(\"P4\",0);\n    do{    //等待P2结束\n   \
    \     pid=wait(&status);\n        if(pid==pid2) end_p2=1;\n        if(pid==pid3)\
    \ end_p3=1;\n        if(pid==pid4) end_p4=1;\n    }while(end_p2==0);\n```\n\n\
    ```\nif((pid5=fork())==0) execl(\"P5\",0);\nif((pid6=fork())==0) execl(\"P6\"\
    ,0);\ndo{    //等待P3和P6结束\n    pid=wait(&status);\n    if(pid==pid3) end_p3=1;\n\
    \    if(pid==pid4) end_p4=1;\n    if(pid==pid5) end_p5=1;\n    if(pid==pid6) end_p6=1;\n\
    }while(end_p3==0||end_p6==0);\nif((pid7=fork())==0) execl(\"P7\",0);\ndo{    //等待P4,P5,P7结束\n\
    \    pid=wait(&status);\n    if(pid==pid4) end_p4=1;\n    if(pid==pid5) end_p5=1;\n\
    \    if(pid==pid7) end_p7=1;\n}while(end_p4==0||end_p5==0||end_p7==0);\nif((pid8=fork())==0)\
    \ execl(\"P8\",0);\nwait(&status);\nexit(0);\n}\n```\n\n## vfork 与 fork\n\nfork\
    \ 功能\n\n- 复制地址空间(code+data+stack)\n- 复制控制结构(proc,user)\n\n- 特点\n  - 父子进程之间有两个各自独立的数据拷贝\n\
    \n- 问题\n  - 不加载新程序\n    - 不能实现数据共享，不能描述诸如 “有界缓冲区” 问题\n  - 若加载新程序\n    - 复制没有意义，浪费时间和空间\n\
    \n## vfork与fork\n\n- **vfork**\n  - 只复制控制结构(proc+user);\n  - 不复制地址空间(code+data)\n\
    \    - 父子进程共享地址空间\n- **使用**\n  - 父进程使用 **vfork** 创建子进程;\n    - 子进程与父进程共享地址空间;\n\
    \    - 子进程使用 **execve** 改变其虚拟地址空间.\n\n## 考虑生灭的进程状态转换图\n\n![](img/7b6892715d0da57dced81602d7459e7e_102_0.png)\n\
    \n## 2.2.9 进程与程序的联系与差别\n\n- 进程与程序的联系\n  - 进程包括一个程序\n  - 进程存在的目的就是执行这个程序\n- 进程与程序的差别\n\
    \  - 程序静态，进程动态\n  - 程序可长期保存，进程有生存期\n  - 一个程序可对应多个进程，一个进程只能执行一个程序\n"
