    \nlock=0;\n\n## 进程互斥\n\n- 经典UNIX系统\n  - 机制\n    - 关中断互斥(提高处理机优先级)\n  - 特点\n  \
    \  - 简单\n    - 开销小\n    - 影响并发性\n      - 关中断后代码很短\n- 在SMP系统中采用自旋锁\n\n## 作业 #2\n\
    \n```\nConsider the following program:  begin\nvar blocked: array[0..1] of boolean;\
    \  blocked[0]:=false;\nturn:0..1;                         blocked[1]:=false;\n\
    procedure P(id:integer);          turn:=0;\nbegin                            \
    \ parbegin\n  repeat                           P(0); P(1)\n    blocked[id]:=true;\
    \             parend;\n    while turn<>id do              end.\n    begin\n  \
    \    while blocked[1-id] do\n        {nothing}\n      turn:=id\n    end;\n   \
    \ <Critical section>\n    blocked[id]:=false;\n    <Remainder>\n  until false\n\
    end;\n```\n\nThis is a software solution to the mutual exclusion problem proposed\
    \ by Hyman. Find a counter example to demonstrate that this solution is incorrect.\
    \ It is interesting to note that even the Communication of the ACM was fooled\
    \ on this one.\n\n## 4.3 进程同步\n\n### 4.3.1 进程同步的概念\n\n例：司机-售票员问题\n\n司机活动：\n\n\
    ```\ndo {\n启动车辆\n正常行驶\n到站停车\n}while (1)\n```\n\n售票员活动：\n\n```\ndo {\n关车门\n售 票\n\
    开车门\n}while (1)\n```\n\n定义：一组进程，为协调其推进速度，在某些关键点处需要相互等待与相互唤醒，进程之间这种相互制约的关系称为进程同步。\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_292_0.png)\n\n### 4.3.2 进程同步机制\n\n\
    定义：\n\n- 用于实现进程同步的工具称为同步机制（synchronization mechanism）\n- 一组进程，如果它们单独不能正常进行，但并发可以正常进行，称这种现象为进程合作\n\
    - 参与合作的进程称作合作进程\n\n同步机制要求：\n- 描述能力够用；\n- 可实现；\n- 高效；\n- 使用方便。\n\n## 典型同步机制\n\n\
    - 信号量与PV操作(semaphore and PV operations)\n- 管程(monitor)\n- 会合(rendezvous)\n- 条件临界区(conditional\
    \ critical region)\n- 路径表达式(path expression)\n- 事件(event, traditional UNIX)\n\n\
    ### 4.3.3 信号量与PV操作\n\nE.W.Dijkstra, 1965.\n\n#### 4.3.3.1 信号量与PV操作的定义\n\n```\n\
    Typedef semaphore struct{\n    int value;\n    PCBpointer queue;\n};\nsemaphore\
    \ s;\n```\n\nRemarks:\n\n- (1) *semaphore* is pre-defined data type,\n- (2) s\
    \ can be declared as needed, eg. semaphore s1,s2;\n\n## 信号灯变量\n\n```\nVar S:semaphore;\n\
    ```\n\n![](img/7b6892715d0da57dced81602d7459e7e_297_0.png)\n\n![](img/7b6892715d0da57dced81602d7459e7e_297_1.png)\n\
    \n## P操作原语\n\nP操作原语：\n\n```\nvoid P(semaphore*s)\n{ s->value--;\nIf s->value<0\n\
    \    asleep(s->queue)\n}\n```\n\n![](img/7b6892715d0da57dced81602d7459e7e_298_0.png)\n\
    \nasleep(s->queue):\n\n- (1) 执行此操作进程的PCB入s->queue尾（状态改为等待）；\n- (2) 转处理机调度程序。\n\
    \n## V操作原语\n\nV操作原语：\n\n```\nvoid V(semaphore *s)\n{ s->value++;\nif (s->value\
    \ <= 0)\nwakeup(s->queue);\n}\n```\n\nPrimitive: a piece of code un-interruptible\n\
    \nwakeup(s->queue)\n\nS->queue链头PCB出等待队列，进入就绪队列（状态改为就绪）。\n\n## 规定和结论\n\n- 对于信号量变量的规定：\n\
    \  - 必须置一次初值，只能置一次初值，初值 >=0;\n  - 只能执行P操作和V操作，所有其它操作非法。\n- 几个有用的结论：\n  - 当s->value\
    \ >=0时，s->queue为空;\n  - 当s->value <0时，|s->value|为队列s->queue的长度;\n  - 当s->value初=1时，可以实现进程互斥;\n\
    \  - 当s->value初=0时，可以实现进程间的简单同步;\n  - 当s->value为非1的正整数时，可以用来管理同种组合资源，申请资源执行一次P操作，归还资源执行一次V操作;\n\
    \n## 用开关中断实现P、V操作\n\n```\nvoid P(semaphore *s)\n{disable interrupt;\n    s->value--;\n\
    \    if (s->value<0)\n    {asleep(s->queue)\n    enable interrupt;\n    goto CPU\
    \ dispatcher;\n    }else\n        enable interrupt;\n}\n```\n\n```\nvoid V(semaphore\
    \ *s)\n{disable interrupt;\n s->value++;\n if (s->value<=0)\n {wakeup(s->queue)\n\
    \ enable interrupt;\n }else\n enable interrupt;\n }\n```\n\n- asleep(s->queue):set\
    \ this process status to blocked;place this process in s->queue.\n- wakeup(s->queue):remove\
    \ a process from s->queue;place the process in ready list.\n\n## 用TS、swap指令实现P、V操作\n\
    \n```\nvoid P(semaphore *s)\n{while(TS(s->flag));\n    s->value--;\n    if (s->value<0)\n\
    \    {asleep(s->queue)\n    s->flag=0;\n    goto CPU dispatcher;\n    }else\n\
    \    s->flag=0;\n}\n```\n"
