    ## 2010年考研试题


    - （1）逻辑地址13B7H化为二进制数为0001001110110111，其中后10位为页内地址，前6位为逻辑页号，即逻辑页号为4。

    - （2）4号页不在内存，发生缺页中断，按FIFO置换算法，应置换第5页，所得页框号3，形成物理地址0000111110110111，划成16进制为0FB7H。

    - （3）采用CLOCK置换算法，淘汰第0页，得页框5，形成物理地址为0001011110110111，划成16进制为17B7H。


    ## 6.5.1.6 颠簸(thrashing)


    页面在内存与外存之间频繁换入换出。


    - 原因: (1) 分给进程物理页架过少；

    - (2) 淘汰算法不合理。


    - 处理: (1) 增加分给进程物理页架数；

    - (2) 改进淘汰算法。


