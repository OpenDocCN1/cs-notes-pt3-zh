  md: "\n## NFS 存取协议\n\n- 提供一套RPC调用，执行如下操作：\n  - 查找目录下的文件\n  - 读取目录项目\n  - 操作link与目录\n\
    \  - 存取文件属性\n  - 读写文件\n\n## NFS 存取协议\n\n- NFS是无状态的(stateless):\n  - 文件服务端并不在内存打开文件表中保持文件控制信息\n\
    \  - 每个文件操作命令必须是自包含的(self contained)，即必须提供完整的参数集合\n  - NFS不提供并发控制机制.\n\n## NFS\
    \ 实现\n\n- 识别本地文件与远程文件\n- 对于远程文件，调用NFS协议过程\n- 对于本地文件，区分本地文件系统类型，并根据文件类型激活相应文件操作\n\
    - VFS保持一个vnode表，记录所有打开文件信息。对于远程打开文件，在NFS中保持一个r_node表，vnode通过把柄与r-node建立联系。\n\n\
    - 实现NFS协议，接受来自客户端的调用并将其传递给本地FS\n\n## NFS 实现\n\n### 对远程文件的操作映射过程\n\n- 客户端通过系统调用发出访问请求\n\
    - 操作系统将其映射到对应vnode的一个VFS操作\n- VFS层鉴别为远程文件，调用NFS对应的过程\n- NFS向远程服务器发出RPC调用\n- 远程服务器识别为本地文件，启用对应的文件操作\n\
    - 按相同路径将调用结果由服务器反向传给顾客\n\n## NFS实现\n\n![](img/7b6892715d0da57dced81602d7459e7e_931_0.png)\n\
    \n客户端核心\n\n服务器端核心\n\n## 13.6 设备管理\n\n- 打开一个设备文件即相当于申请对应的设备，如该设备已处于打开状态则等待\n- 关闭一个设备文件即相当于释放对应的设备，如有等待者则唤醒一个\n\
    - 读写一个设备文件就相当于对所对应的设备执行 I/O 操作\n\n## 缓冲与缓存\n\n- 块型设备缓冲\n- 用于磁盘、磁带等设备的I/O传输\n-\
    \ 每个缓冲区的长度与块型物理设备中一个块的长度相同, 即为512字节\n- 缓冲区为所有块型设备公用, 其总数为15个\n\n## 块型设备缓冲\n\n\
    ```\nstruct buf\n{\nint b_flags;        /* see definition below */\nstruct buf\
    \ *b_forw; /* headed by devtab of b_dev */\nstruct buf *b_back; /* 设备b链向后指针 */\n\
    struct buf *av_forw; /* av链向前指针 */\nstruct buf *av_back; /* av链向后指针 */\nint b_dev;\
    \          /* 设备名 */\nint b_wcount;       /* 传送字数 */\nchar *b_addr;       /* 内存地址(低位)\
    \ */\nchar *b_xmem;       /* 内存地址(高位) */\nchar *b_blkno;      /* 设备物理块号 */\nchar\
    \ b_error;       /* 返回出错信息 */\nchar *b_resid;      /* 传送剩余字节 */\n}buf[NBUF];\n\
    ```\n\n## 块型设备控制结构\n\n```\nstruct devtab\n{\nchar d_active;    /* busy flag */\n\
    char d_ercnt;    /* error count */\nstruct buf *b_forw;    /* first buffer for\
    \ this dev */\nstruct buf *b_back;    /* last buffer for this dev */\nstruct buf\
    \ *d_actf;    /* head of IO queue */\nstruct buf *d_actl;    /* tail of IO queue\
    \ */\n}\n```\n\n## 块缓冲数据读写\n\n![](img/7b6892715d0da57dced81602d7459e7e_936_0.png)\n\
    \n## 字符型设备缓冲\n\n- 缓冲池\n- 读操作\n- 写操作\n\n```\nstruct cblock\n{\nstruct cblock *c_next;\
    \  /* pointer */\nchar info[6];           /* info container */\n}\n```\n\n## 预先读与延迟写\n\
    \n- **预先读(read ahead)**\n  - 将以后即将使用的块读入缓冲区中\n  - 以后进程需要该块时便可在缓冲区中直接得到，不必等待设备I/O传输\n\
    \  - 基于文件顺序访问的假设\n  - 预先读函数 `breada(dev,blkno,rablkno)`\n    - `rablkno` 链入 d\
    \ 链\n    - IO完成放入 b 链和 av 链\n\n## 预先读与延迟写\n\n- 延迟写(delayed write)\n  - 当一个缓冲块尚未写满时，暂不将其写到外存\n\
    \  - 以后继续写时，不必将该块由外存读入内存\n  - 延迟写函数bdwrite(bp)\n    - 将bp对应的缓冲区链入b链和av链，若以后还需\
    \ 要读写，可在缓冲区中得到。\n    - 缓冲区在av链上取到用作其它用途前，由b链换 到d链，写回外存。\n\n## 13.7 系统调用\n\n- 地位\n\
    \  - 操作 操作系统API\n  - One of Programmer Interface\n    - The other being System\
    \ Libs\n- 主要包括\n  - Process manipulation\n  - File manipulation\n  - Communication\n\
    \  - Others\n\n## 13.7.1 有关进程的系统调用命令\n\n### 相关系统调用\n\n- 创建子进程\n  - **Pid = fork()**\n\
    \    - 子进程是父进程的复制品\n    - 返回值：父进程为子进程编号，子进程为 **0**\n- 加载并执行新程序\n  - **execl(prog,\
    \ arg0,...,argn-1,0)**\n  - 以 **arg0,...,argn-1** 为参数执行 **prog**\n  - 覆盖原来程序，从第一条指令开始执行\n\
    \n## 13.7.1有关进程的系统调用命令\n\n```\nexit(status)\n```\n\n- Status为终止状态\n- 唤醒父进程\n\n\
    ```\npid=wait(&status)\n```\n\n- 返回终止子进程编号\n- 参数为子进程的终止状态\n\n## fork() 创建子进程\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_943_0.png)\n\n联系\n\nproc结构\np_pid=9\n\
    p_ppid=5\nuser结构\n\n```\npid = fork();\n\nif(pid == 0) /*不成立*/\n{\n    /*子进程代码*/\n\
    }else{\n    /*父进程代码*/\n}\n...\n```\n\nproc结构\np_pid=12\np_ppid=9\nuser结构\n\n```\n\
    pid = fork();\n\nif(pid == 0) /*成立*/\n{\n    /*子进程代码*/\n}else{\n    /*父进程代码*/\n\
    }\n...\n```\n\n复制\n\n子进程号\n(>0整数)\n\n恒为0\n\n父进程\n\n子进程\n\n## execl() 加载并执行新程序\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_944_0.png)\n\nproc结构\np_pid=9\np_ppid=5\n\
    user结构\n\n```\npid=fork();\nif(pid == 0) /*不成立*/\n{\n    execl(\"p\",0);\n}else{\n\
    \    /*父进程代码*/\n}\n...\n```\n\n父进程\n\nproc结构\np_pid=12\np_ppid=9\nuser结构\n\n```\n\
    pid=fork();\nif(pid == 0) /*成立*/\n{\n    execl(\"p\",0);\n}else{\n    /*父进程代码*/\n\
    }\n...\n```\n\n子进程\n\n## exec() 加载并执行新程序\n\nproc结构\np_pid=9\np_ppid=5\nuser结构\n\
    \n```\npid=fork();\nif(pid==0) /*不成立*/\n{\n\texec(\"P\",0);\n}\nelse{\n\t/*父进程代码*/\n\
    }\n...\n```\n\nproc结构\np_pid=12\np_ppid=9\nuser结构\n\n程序P（覆盖原来程序）\n\n父进程\n\n子进程\n"
