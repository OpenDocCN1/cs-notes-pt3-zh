    \      p2:read(fd[0],...)\n\n![](img/7b6892715d0da57dced81602d7459e7e_892_0.png)\n\
    \n## 套接字(socket)\n\n- 端-端通讯机制\n  - (endpoint—endpoint)\n- 类型\n  - *Stream sockets*\n\
    \  - *Sequenced packet sockets*\n  - *Datagram sockets*\n  - *Reliably delivered\
    \ message sockets*\n  - *Raw sockets*\n\n## 套接字(socket)\n\n- 地址域\n  - 使用中的socket与一地址相联系\n\
    \    - 地址的形式由通讯域(communication domain)确定.\n  - 同一域中的进程使用相同地址格式\n    - address\
    \ format\n  - 4.3BSD域\n    - UNIX domain (AF_UNIX)\n    - the Internet domain\
    \ (AF_INET)\n    - the XEROX Network Service (NS) domain (AF_NS)\n\n## 13.4 存储管理\n\
    \n- 经典UNIX存储管理\n  - 一个进程两个对界\n    - Text(共享)\n    - Data(私有)\n  - 内外存不同尺寸，同一管理程序(FF算法)\n\
    \    - Core: 64bytes\n    - swap: 512bytes\n  - 交换技术\n    - swapping\n\n### 13.4.1\
    \ 存储管理方式\n\n- 采用界地址存储管理方式\n  - 一个进程由两个对界组成, 即占有两个连续的内存区域\n    - 一个区域用于保存共享代码\n\
    \    - 另一个区域用于保存私有数据及用户堆栈\n  - 存储分配的基本单位是64个字节, 而不是单个字节\n\n### 13.4.2 存储分配算法\n\
    \n- 内存空间及外存交换区的分配均是动态的, 分配算法为最先适应 (FF).\n- 描述内存空间及外存空间分配状况各需有一个数据结构.\n- 内存的分配与外存的分配共用同一个程序.\n\
    \n### 13.4.3 进程空间扩充\n\n- 堆栈分配\n  - 基本长度，避免浪费\n- 堆栈溢出\n  - 动态扩展\n    - 申请一个新的数据区(原区域大小+增加大小)\n\
    \    - 复制\n    - 释放原有区域\n- 内存不够\n  - 交换到外存(同时扩展空间)\n  - 释放所占内存\n  - 再次由sched调入内存时，按新长度\n\
    \n### 13.4.4 交换技术(swapping)\n\n- 交换目标：缓解内存紧张矛盾\n- 交换进程：sched(#0)\n- 交换算法\n  -\
    \ 移入外存中SRUN状态进程\n  - 如内存不够，选择移出\n    - 内存中处于SWAIT或SSTOP状态进程\n  - 如还不够，选择移出\n \
    \   - 内存中处于SSLEEP或SRUN状态进程，条件\n      - 待移入进程在外时间>=3秒\n      - 待移出进程在内时间>=2秒\n\n\
    ### 13.4.5 虚拟页式(Paging)\n\n- 4.3BSD UNIX: *demand-paging* + *swapping*\n  - 主要依赖(first\
    \ paging)\n  - 其次是交换(secondary swapping).\n- 偷页进程(Page stealer process)\n  - 动态跟踪并调整进程页架数\n\
    \  - 基于工作集模型(*working set model*).\n- If the *scheduler* decides that the paging\
    \ system is overloaded, processes will be swapped out *whole* until the overload\
    \ is relieved.\n\n## 页面置换\n\n### pagedaemon process\n\n- Uses a modified *second-chance*\
    \ page-replacement algorithm.\n- *Second chance*: a variant of NUR.\n\nSet page\
    \ 3,4 reference bit to 0, replace page 5\n\n![](img/7b6892715d0da57dced81602d7459e7e_901_0.png)\n\
    \n## 页面置换\n\n### pagedaemon process\n\n- Uses a modified *second-chance* page-replacement\
    \ algorithm.\n- *Second chance*: a variant of NUR.\n\nSet page 3,4 reference bit\
    \ to 0, replace page 5\n\n![](img/7b6892715d0da57dced81602d7459e7e_902_0.png)\n\
    \n## 页面置换\n\n### pagedaemon process\n\n- Uses a modified *second-chance* page-replacement\
    \ algorithm.\n- *Second chance*: a variant of NUR.\n\nSet page 3,4 reference bit\
    \ to 0, replace page 5\n\n![](img/7b6892715d0da57dced81602d7459e7e_903_0.png)\n\
    \n## 13.5 UNIX文件系统\n\n- 文件类型\n- 文件体系\n- 文件结构\n- 文件目录\n- 文件系统映射\n- 文件卷安装\n- 磁盘空间管理\n\
    - Inode区管理\n- 快速文件系统\n- NFS文件系统\n\n### 13.5.1 文件类型\n\n- 普通文件\n  - 内容可以是程序、数据、图象等，保存在磁盘块中\n\
    - 目录文件\n  - (文件名，文件号)序列，保存在磁盘块中\n- 特殊文件\n  - 设备\n    - 设备作为文件管理的好处\n      - 界面统一，使用文件与使用设备命令相同，申请设备open,\
    \ 释放close, 读read, 写write\n      - 利用文件保护功能可以保护设备\n\n### 13.5.2 文件体系\n\n- 基本结构：树型\n\
    \  - 系统目录，系统文件\n  - 用户目录，用户文件\n- 连接(link)\n  - 不是真正的树，而呈格结构\n  - 连接方便文件共享\n"
