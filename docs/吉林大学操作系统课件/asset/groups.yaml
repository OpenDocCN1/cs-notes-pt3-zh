  md: "\n## 程序\n\n```\nBegin\n    S1.value:=k; S2.value:=0;\n    mutex.value:=1;\n\
    \    in:=0; out:=0;\n    Cobegin\n        P1: producer; ...... , Pm: producer;\n\
    \        C1: consumer; ......, Cn: consumer;\n    Coend;\nEnd.\n```\n\n## 并发性提高策略\n\
    \n生产者和消费者：不操作B的相同分量\n\n生产者的共享变量： 消费者的共享变量：\n\nB[in], in                 B[out],\
    \ out\n\nin=out: 满或空,\n\n```\nVar mutex1,mutex2:semaphore; (init 1)\n```\n\n##\
    \ 并发性提高策略\n\n生产者活动：\n\n```\nRepeat\n加工一件物品\nP(S1)\nP(mutex1)\n物品放入箱中\nV(mutex1)\n\
    V(S2)\nUntil false\n```\n\n消费者活动：\n\n```\nRepeat\nP(S2)\nP(mutex2)\n箱中取一物品\nV(mutex2)\n\
    V(S1)\n消耗这件物品\nUntil false\n```\n\n## 例2. 读者/写者问题\n\nP. T. Courtois 1971\n\nCommunication\
    \ of the ACM, Vol.14, 667-669.\n\nACM: Association for Computing Machinery\n\n\
    - 解法1：写者可能饿死\n- 解法2：写者优先\n\n## 例2. 读者/写者问题\n\nProblem Statement:\n\n一组公共数据DB\n\
    \n![](img/7b6892715d0da57dced81602d7459e7e_329_0.png)\n\nR1 ..... Rm W1 .....\
    \ Wn\n\n- 要求：\n- （1）R-R可以同时\n- （2）R-W不可同时\n- （3）W-W不可同时\n\n## Solution1: 不考虑R-R不互斥\n\
    \n```\nVar r_w_w:semaphore; (init value: 1)\n```\n\nReader:\n\n```\nP(r_w_w);\n\
    {读操作}\nV(r_w_w);\n```\n\nWriter:\n\n```\nP(r_w_w)\n{写操作}\nV(r_w_w)\n```\n\n分析：（1）写者活动正确；（2）R-R不能同时。\n\
    \n改进：最先进入的R执行P；最后离开的R执行V；\n\n## Solution2: 考虑R-R不互斥\n\nVar read_count:integer;\
    \ (initial value is 0)\n\nReader:\n\n```\nread_count:=read_count+1;\n```\n\n```\n\
    If read_count=1 Then P(r_w_w);\n```\n\n{读操作}\n\n```\nread_count:=read_count-1;\n\
    ```\n\n```\nIf read_count=0 Then V(r_w_w);\n```\n\n问题：对Read_count操作的互斥问题。\n\n\
    ## Solution3: 正确解法\n\n```\nVar mutex:semaphore; (initial value is 1)\nReader:\n\
    \  P(mutex);\n  read_count:=read_count+1;\n  If read_count=1 Then P(r_w_w);\n\
    \  V(mutex);\n  {读操作}\n  P(mutex);\n  read_count:=read_count-1;\n  If read_count=0\
    \ Then V(r_w_w);\n  V(mutex);\n```\n\n读者等待在何处？\n读者如何被唤醒？\n\n## 程序\n\n```\nProgram\
    \ readers_writers;\nVar r_w_w: semaphore;\n    mutex:semaphore;\n    read_count:\
    \ integer;\n\nprocedure writer;\nbegin\n    P(r_w_w);\n    { write ops }\n   \
    \ V(r_w_w)\nend;\n```\n\n## 程序（Cont.）\n\n```\nProcedure reader;\nbegin\n    P(mutex);\n\
    \    read_count:=read_count+1;\n    If read_count=1 Then P(r_w_w);\n    V(mutex);\n\
    \    { read ops }\n    P(mutex);\n    read_count:=read_count-1;\n    If read_count=0\
    \ Then V(r_w_w);\n    V(mutex);\nend;\n```\n\n## 程序（Cont.）\n\n```\nbegin\n   \
    \ read_count:=0;\n    r_w_w.value:=1;\n    mutex.value:=1;\n    cobegin\n    \
    \    r1: reader; .....; rm: reader;\n        w1: writer; ,,,,,; wn: writer\n \
    \   coend\nend.\n```\n\n## 分析：\n\n问题：读者源源不断， read_count不归0，写者会被饿死。\n\n策略：一旦有写者等待，新到达读者等待，正在读的读者都结束后，写者进入。\n\
