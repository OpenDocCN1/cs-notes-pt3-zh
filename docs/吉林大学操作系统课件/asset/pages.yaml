- pgno: 497
  md: '# 5.11 有关问题的讨论


    +   - 关于充要性算法

    +     - 已知进程关于资源活动序列

    +       - 困难: 程序中的分枝与循环

    +     - 复杂度高(NP Complete)

    +   - 生死资源问题

    +     - 消息

    +     - 消耗性资源与可重用资源并存

    +   - 关于可剥夺资源问题

    +     - 处理器：可以剥夺，不会引起死锁

    +     - 存储器：不可剥夺，当占有一部分内存的过程申请新的内存资源时，有可能发生死锁。但实现虚拟存储后，利用外存实现虚拟存储，当占有内存的过程提出新的存储请求而系统无法满足时，不让进程等待，而是为它分配外存，进程之间不会因为竞争内存资源而发生死锁。但是，若外存空间也不足时也有可能发生死锁，但这一般很罕见，因为外存空间很大。

    +   - 关于两阶段封锁

    +     - 增长阶段有可能死锁'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 5.12 饥饿与活锁


    +   - 饥饿(starvation)：当等待时间给进程推进和响应带来明显影响时,称发生了进程饥饿.饥饿到一定程度的进程所赋予的使命即使完成也不再具有实际意义时称该进程被饿死(starved
    to death).

    +   - 没有时间上界的等待

    +     - 排队等待

    +     - 忙式等待

    +   - 忙式等待条件下发生的饥饿,称为活锁(live lock).'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# 死锁与饥饿


    +   - 饥饿 vs 死锁

    +     - 死锁进程处于等待状态，忙式等待的进程并非处于等待状态,但却可能被饿死；

    +     - 死锁进程等待永远不会释放的资源,饿死进程等待可能被释放,但却不会分给自己的资源,其等待时间没有上界；

    +     - 死锁一定发生了循环等待,饿死不然；

    +     - 死锁至少涉及两个进程,饿死进程可能只有一个。'
  merge: -1
  img_proc: true
