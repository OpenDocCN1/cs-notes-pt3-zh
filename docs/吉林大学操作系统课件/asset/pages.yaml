- pgno: 477
  md: '# 银行家算法(Cont.)


    Banker''s algorithm, E.W. Dijkstra.


    进程：事先申明所需资源最大量（并不分配）


    Claim=Max


    系统：对每个可满足的资源申请命令进行安全性检查。


    安全，分配；不安全：不分配


    ```

    P={p1,p2,...,pn};

    ```


    ```

    R={r1,r2,...,rm};

    ```'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# 银行家算法(Cont.)


    数据结构：


    ```

    Available: array[1..m]of integer;    //系统可用资源

    Claim: array[1..n,1..m]of integer;    //进程最大需求

    Allocation: array[1..n,1..m]of integer;    //当前分配

    Need: array[1..n,1..m]of integer;    //尚需资源

    Request: array[1..n,1..m]of integer;    //当前请求

    ```


    临时变量：


    ```

    Work: array[1..m]of integer;

    Finish: array[1..n]of boolean;

    ```'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# 银行家算法(Cont.)


    设X,Y为下标1..l的一维数组：


    X ≤ Y ⇔ ∀j (1≤j≤l), X[j] ≤ Y[j]

    X := Y ⇔ ∀j (1≤j≤l), X[j] := Y[j]

    X := c ⇔ ∀j (1≤j≤l), X[j] := c

    X ± Y ⇔ ∀j (1≤j≤l), X[j] ± Y[j]'
