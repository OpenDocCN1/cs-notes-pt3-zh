- pgno: 594
  md: '# 5. 最不经常使用的先淘汰(LFU)


    淘汰使用次数最少的。


    依据: 活跃访问页面应有较大的访问次数.


    Suffer: (1) 前期使用多，但以后不用，难换出;


    (2) 刚调入的页面，引用少，被换出可能大。


    实现: 计数器，调入清0，访问增1，淘汰选取最小者。


    # 6. 最频繁使用算法(MFU)


    淘汰使用次数最多的。


    依据: 使用多的可能已经用完了。


    Suffer: 程序有些成分是在整个程序运行中都使用的。'
  merge: -1
  img_proc: true
