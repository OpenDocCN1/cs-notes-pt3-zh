  md: '# 2.2.6 进程的类型与特征


    +   - 进程类型

    +     - 系统进程

    +       - 运行操作系统程序，完成系统管理(服务)功能。

    +       - 例如： UNIX #0 -- sched, #1 -- init

    +     - 用户进程

    +       - 运行用户(应用)程序，为用户服务。

    +       - 例如： UNIX vi, shell, cc'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 2.2.6 进程的类型与特征(Cont.)


    # 进程的特征


    +   - 并发性：可以与其它进程一道向前推进；

    +   - 动态性：动态产生、消亡，生存期内状态动态变化；

    +   - 独立性：一个进程是可以调度的基本单位；

    +   - 交往性：同时运行的进程可能发生相互作用；

    +   - 异步性：进程以各自独立，不可预知的速度向前推进；

    +   - 结构性：每个进程有一个PCB。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 2.7 进程间相互联系与相互作用


    +   - 相互联系

    +     - 相关进程

    +       - 同一家族的进程

    +       - 可以共享文件，需要相互通讯，协调推进速度...

    +       - 父进程可以监视子进程，子进程完成父进程交给的任务。

    +     - 无关进程

    +       - 没有逻辑关系、同时执行的进程。

    +       - 有资源竞争关系，互斥、死锁、饿死。'
  merge: -1
