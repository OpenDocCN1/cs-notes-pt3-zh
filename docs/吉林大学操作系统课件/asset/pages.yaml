- pgno: 617
  md: '# 6.5.2 虚拟段式存储系统(Cont.)


    虚拟段式存储管理地址映射


    指令确定逻辑地址(s,d)


    由s查快表得到b''和l''


    查到


    0≤s≤l''-1


    越界中断


    0≤d≤l''-1


    越界中断


    b''+d 得到物理地址


    0≤d≤l''-1


    越界中断


    ( s, b'',l'' ) ⇒ 快表 如快表满，淘汰一表项


    b''+d 得物理地址


    由b、s查段表


    该段在内存


    缺段中断


    保存现场


    找到该段在外存的位置


    内存可满足


    紧凑够


    选一段淘汰


    紧凑


    该段修改过


    写回外存


    修改段表


    读入该段


    修改段表和快表


    恢复现场


    硬件完成


    软件完成'
  merge: -1
  img_proc: true
