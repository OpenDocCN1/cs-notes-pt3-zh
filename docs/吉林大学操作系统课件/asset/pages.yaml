  md: '# 1.5.1 定时装置


    +   - 绝对时钟：记载实际时间，不发中断。

    +     - 系统操作员可以修改

    +     - 一般用户使用


    +   - 间隔时钟：定时发生中断，一般间隔单位为“毫秒”。

    +     - 间隔时钟是实现多道程序的基础—保证操作系统获得控制权。

    +     - 其它中断也进入操作系统，但是是否发生，何时发生没有保障。'
