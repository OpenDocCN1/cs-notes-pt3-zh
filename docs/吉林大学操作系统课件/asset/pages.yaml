- pgno: 61
  md: '# 1.9.1 Linux系统


    # 历史


    +   - **1991, 0.01版**

    +     - 运行于intel80386，仅支持Minix文件系统，支持有限的设备驱动程序，无网络支持。


    +   - **1994, 1.0版**

    +     - 支持UNIX标准TCP/IP协议，BSD兼容的socket网络通讯协议，增强的文件系统，SCSI控制器对文件的高效访问，以及其它设备驱动程序。


    +   - **1995, 1.2版**

    +     - 最后一个仅在PC平台上运行的Linux。


    +   - **1996, 2.0版**

    +     - 运行于多种平台，支持对称多处理，同时增强了存储管理功能，支持核心级线程，模块动态连接等。可运行于Sun Sparc, PowerMac等硬件平台。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Linux特点：


