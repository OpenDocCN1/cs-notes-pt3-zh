- pgno: 300
  md: '# 规定和结论


    +   - 对于信号量变量的规定：

    +     - 必须置一次初值，只能置一次初值，初值 >=0;

    +     - 只能执行P操作和V操作，所有其它操作非法。

    +   - 几个有用的结论：

    +     - 当s->value >=0时，s->queue为空;

    +     - 当s->value <0时，|s->value|为队列s->queue的长度;

    +     - 当s->value初=1时，可以实现进程互斥;

    +     - 当s->value初=0时，可以实现进程间的简单同步;

    +     - 当s->value为非1的正整数时，可以用来管理同种组合资源，申请资源执行一次P操作，归还资源执行一次V操作;'
  merge: -1
  img_proc: true
