- pgno: 456
  md: '# # 5.3 死锁的条件


    +   - Coffman条件（必要条件）

    +     - 资源独占（mutual exclusion）

    +     - 不可抢占（non preemption）

    +     - 保持申请（hold-while-applying）

    +     - 循环等待（circular wait）


    当每类资源只有一个实例时，充要条件。


    破坏上述任意一个条件可以消除死锁。'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 5.4 死锁的处理


    +   - 死锁预防（deadlock prevention）-静态

    +   - 死锁避免（deadlock avoidance）--动态

    +   - 死锁检测（deadlock detection）

    +   - 死锁恢复（deadlock recovery）'
  merge: -1
