- pgno: 896
  md: '# 13.4.1存储管理方式


    +   - 采用界地址存储管理方式

    +     - 一个进程由两个对界组成, 即占有两个连续的内存区域

    +       - 一个区域用于保存共享代码

    +       - 另个区域用于保存私有数据及用户堆栈

    +     - 存储分配的基本单位是64个字节, 而不是单个字节'
  merge: -1
  img_proc: true
- pgno: 897
  md: '# 13.4.2 存储分配算法


    +   - 内存空间及外存交换区的分配均是动态的, 分配算法为最先适应 (FF).

    +   - 描述内存空间及外存空间分配状况各需有一个数据结构.

    +   - 内存的分配与外存的分配共用同一个程序.'
  merge: -1
  img_proc: true
- pgno: 898
  md: '# 13.4.3 进程空间扩充


    +   - 堆栈分配

    +     - 基本长度，避免浪费

    +   - 堆栈溢出

    +     - 动态扩展

    +       - 申请一个新的数据区(原区域大小+增加大小)

    +       - 复制

    +       - 释放原有区域

    +   - 内存不够

    +     - 交换到外存(同时扩展空间)

    +     - 释放所占内存

    +     - 再次由sched调入内存时，按新长度'
  merge: -1
  img_proc: true
- pgno: 899
  md: '# 13.4.4 交换技术(swapping)


    +   - 交换目标： 缓解内存紧张矛盾

    +   - 交换进程： sched(#0)

    +   - 交换算法

    +     - 移入外存中SRUN状态进程

    +     - 如内存不够，选择移出

    +       - 内存中处于SWAIT或SSTOP状态进程

    +     - 如还不够，选择移出

    +       - 内存中处于SSLEEP或SRUN状态进程，条件

    +         - 待移入进程在外时间>=3秒

    +         - 待移出进程在内时间>=2秒'
  merge: -1
  img_proc: true
- pgno: 900
  md: '# 13.4.5 虚拟页式(Paging)


    +   - 4.3BSD UNIX: *demand-paging* + *swapping*

    +     - 主要依赖(first paging)

    +     - 其次是交换(secondary swapping).

    +   - 偷页进程(Page stealer process)

    +     - 动态跟踪并调整进程页架数

    +     - 基于工作集模型(*working set model*).

    +   - If the *scheduler* decides that the paging system is overloaded, processes
    will be swapped out *whole* until the overload is relieved.'
  merge: -1
  img_proc: true
