- pgno: 508
  md: '# # 5.14 可复用资源死锁的静态分析


    条件： 已知各个进程有关资源的活动序列；

    判断，有无死锁可能性。


    +   步骤1： 以每个进程占有资源，申请资源作为一个状态，

    +   记作： (pi: aj: ak1,...,akn)=(进程: 请求: 占有);

    +   步骤2： 以每个状态为一个节点；

    +   步骤3： 如s1所申请资源为s2所占有，则由s1向s2画一有向弧（相同进程间不画）；

    +   步骤4： 找出所有环路；

    +   步骤5： 判断环路上状态是否能同时到达，如是有死锁可能性，否则无死锁可能性。

    +   (1)环路中有相同进程，不能到达；

    +   (2)环路中有相同被占有资源，不能到达。'
  merge: -1
  img_proc: true
