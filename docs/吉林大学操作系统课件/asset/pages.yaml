- pgno: 69
  md: '# 2.1.2 多道程序设计的提出(Cont.)


    +   - 增加同时运行程序的道数可以提高资源利用率，从而提高系统效率，但道数应与系统资源数量相当。

    +   - 道数过少，系统资源利用率低。

    +   - 道数过多，系统开销(system overhead)增大，程序响应速度下降。'
  merge: -1
