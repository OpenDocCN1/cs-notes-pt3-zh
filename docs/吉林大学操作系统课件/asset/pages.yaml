- pgno: 727
  md: '```

    fd=creat(pathname,mode)

    ```


    pathname: 路径名；


    mode: 共享说明；


    +   1. 分配一个inode, 初始化(i_size=0, i_mode=mode, i_nlink=1,i_uid=u_uid, i_gid=u_gid)；

    +   2. 填写目录项(name, i_number)；

    +   3. 以写方式打开(填写inode表、file 表和u_ofile表)；

    +   4. 返回文件描述符。


    例子：


    ```

    creat("d1/d2/f1", mode)

    ```


    假设分配i_number=15, (f1,15)=>d2中(???????????????, -1)'
  merge: -1
  img_proc: true
- pgno: 728
  md: '```

    fd=open(pathname,mode)

    ```


    pathname: 路径名；


    mode: 打开方式；


    fd: 文件描述符(u_ofile表的入口)


    +   1. 查目录找inode(移入内存i_count=1, 如已在内存i_count++)；


    +   2. 权限检查(mode打开方式, i_mode共享说明, i_uid, i_gid文件主（组）, u_uid, u_gid用户身份)；


    +   3. 在file表中分配一个表项, 指向该内存i_node; 初始化 f_count=1; f_offset=0; f_flag=mode;


    +   4. 在u_ofile中取一空闲表目, 指向file表中对应表目；


    +   5. 返回文件描述符fd(在u_ofile表中的入口)。'
  merge: -1
  img_proc: true
- pgno: 729
  md: '# close(fd)


    fd: 文件描述符;


    +   1. 由fd查u_ofile找到对应入口;

    +   2. 由u_ofile[fd]找到file表对应入口;

    +   3. f_count--, 如为0, 由f_inode找到对应inode;

    +   4. i_count--, 如为0, i_flag标志有修改, 写回外存inode区;

    +   5. u_ofile[fd]=-1(空闲标志)。'
  merge: -1
  img_proc: true
- pgno: 730
  md: 'seek(fd, whence, offset)


    fd: 文件描述符；


    whence: 相对位置(0,1,2,3,4,5)=(头， 当前位置， 尾)


    offset: 移动量；


    +   1. 由u_ofile[fd]找到file表入口；

    +   2. 由f_inode找到内存inode；

    +   3. 检查参数合法性(i_size0, i_size1, f_offset, offset, whence)；

    +   4. 按参数要求调整f_offset指针。'
  merge: -1
  img_proc: true
- pgno: 731
  md: '```

    nrd=read(fd,buf,count)

    ```


    fd: 文件描述符；


    buf: 进程空间接收区地址；


    count: 读字节数；


    +   1. 由u_ofile[fd]，找到file表对应入口；


    +   2. 检查访问权限(f_flag, READ);


    +   3. 由f_inode找到内存inode入口；


    +   4. 由f_offset, count和i_addr计算访问磁盘块号(可能多个块)(bmap函数);


    +   5. 启动IO设备读取盘块到系统缓冲区中(如buffer无,切换进程);


    +   6. 缓冲区信息复制到进程空间(iomove);


    +   7. 返回实际传输字节数nrd。'
  merge: -1
  img_proc: true
- pgno: 732
  md: '```

    nwt=write(fd,buf,count)

    ```


    fd: 文件描述符；


    buf:进程空间发送地址；


    count: 写字节数；


    +   1. 由u_ofile[fd]，找到file表对应入口；

    +   2. 检查访问权限(f_flag, WRITE)；

    +   3. 由f_inode找到内存inode入口；

    +   4. 由f_offset, count和i_addr计算磁盘地址块号(可能分盘块)；

    +   5. 申请系统缓冲区，将buf起始count数据送到缓冲区(可多次)；

    +   6. 缓冲区链到设备IO链上,如设备空闲启动设备；

    +   7. 修改inode中文件长度i_size；

    +   8. 返回实际传输字节数nwt。'
  merge: -1
  img_proc: true
- pgno: 733
  md: '# pipe(fd)


    ```

    int fd[2];

    ```


    +   1. 分配一个inode，(i_count=2);


    +   2. 分配2个file表目(f_flag分别为PipeR和PipeW，读/写指针offset为0)


    +   3. 分配2个u_ofile表目,分别指向2个file表目；


    +   4. 返回2个文件描述符fd[0],fd[1],分别为u_ofile中的2个入口。


    # pipe文件的使用


    读(read)：读指针追上写指针，读者等待；


    写(write)：写指针追上读指针，写者等待；


    关闭：无读者，信号通知写者；无写者，唤醒等待读者；'
  merge: -1
