- pgno: 525
  md: '# 下次适应算法（Next Fit,NF）


    +   - 自上次分配空闲区域的下一个位置开始，选取第一个可满足的空闲区域。

    +   - 实现时，可设置一个循环查找指针，开始时指向表头，每次分配从该指针处开始查找（如找到表尾，则将指针置成表头）第一个遇到的可满足区域。分配后将指针调整为所分配区域的下一个区域。

    +   - 优点：可以减少查找空闲区域所花费的时间开销，并使空闲区域分布更均匀。

    +   - 缺点：可能分割大空闲区域'
