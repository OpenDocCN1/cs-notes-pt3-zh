- pgno: 271
  md: '# Lamport面包店算法


    算法思想：设置一个发号者，按0,1,2,...,发号。想进入临界区的进程抓号，抓到号之后按由小到大的次序依次进入。


    Problem: 两个进程可能抓到相同的号。


    Why? 为保证抓到不同的号，需要互斥机制。


    Resolution: 若抓到相同的号，按进程编号依次进入。


    Definition: (a,b)<(c,d) iff (a<c)or(a==c and b<d)'
  merge: -1
