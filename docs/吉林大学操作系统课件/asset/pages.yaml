  md: '# Linux 对称多处理


    +   - **Linux2.0是支持对称多处理硬件的第一个Linux核心；**

    +     - 进程或线程可以同时运行在多个处理机上。

    +   - **为保持核心非剥夺同步要求，SMP通过一个唯一的内核自旋锁(spin-lock)来保证任何时刻最多只有一个处理机执行核心代码，**

    +     - 支持真正意义上的SMP：将一个自旋锁分解为若干个相互独立的自旋锁，分别用于保护核心代码不相交的子集。'
