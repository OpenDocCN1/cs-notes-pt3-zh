  md: '# 窗口尺寸确定：


    Δ过小：活动页面不能全部装入，页故障率高；


    Δ过大：内存浪费。


    Madnick, Donovan建议： Δ=1万次访内。


    实现：页表中增加访问位：


    |  | 访问位 |

    |---|---|

    | ... |  |

    |  |  |


    页表：


    Δ开始时，全部清0，


    访问：置1，


    Δ结束时(新Δ开始时)访问标志为1的，为该Δ期间工作集，


    τₙ₊₁=αwₙ+(1-α)τₙ'
