  md: '# 6.3.1 界地址管理方式


    +   - 重定位

    +     - 可重定位程序：被换出的进程再次运行之前必须重新装入内存，而再次进入内存时的存放位置与换出之前通常不同，这就要求程序编址与内存存放位置无关，这种程序称为可重定位程序。

    +     - 浮动程序：由0起始编址的程序都满足重定位要求，这样的程序也称为浮动程序。

    +     - 动态重定位：在进程运行时进行

    +     - 静态重定位：在进程运行前编译时或装入时进行'
  merge: -1
  img_proc: true
- pgno: 539
  md: '# 6.3.1 界地址管理方式


    +   - 覆盖技术: 将较大程序装入较小进程空间的技术。

    +   - 只将全局代码和数据静态装入内存，其它部分动态装入。

    +   - 后装入的成分重复使用先装入成分所使用的存储区，即覆盖先装入的成分。'
  merge: -1
