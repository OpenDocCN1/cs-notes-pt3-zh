- pgno: 698
  md: "# 保存时：\n\n+   用一个**key**启动一个随机数发生器，产生一个随机数序列，将其依此加到文件的各个字中。\n\n# 读取时：\n\n+\
    \   用同一个**key**启动同一个随机数发生器，产生相同随机数序列，将其依次由文件的各个字中减去。\n\n线性同余法产生伪随机数：\n\n```\n\
    Procedure random(Var key:integer);\nBegin\n    key:=(key*C1+C2)MOD C3\nEnd;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 699
  md: '# 7.6.3 文件系统的安全


    # Backup


    +   - 定期将磁盘上文件复制到磁带上

    +   - 发生故障时由磁带恢复(limited recovery)


    # 实现方法


    +   - 海量转储

    +     - 定期将磁盘上文件全部复制到磁带上

    +   - 增量转储

    +     - 每次只复制修改部分

    +     - 节省磁盘空间，缩短备份时间

    +     - 数据恢复比较麻烦，可靠性差'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# 7.6.3 文件系统的安全


    +   - 差分转储

    +     - 开始时对系统先进行一次完全转储，以后只将当天与开始第一次备份的内容不同的数据备份到磁带上

    +     - 避免上两种转储的缺点，并综合了他们的优点

    +   - 磁盘整理

    +     - 利用转储和恢复可以对磁盘进行整理(使文件物理块连续，空闲盘块连续)'
  merge: -1
  img_proc: true
