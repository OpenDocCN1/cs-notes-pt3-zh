- pgno: 12
  md: '# 1.2.1 操作系统的产生


    一、手工操作阶段（20世纪40年代，无操作系统）


    作业处理步骤：


    +   (1) (程序、数据)→穿孔机→纸带；

    +   (2) 穿孔纸带→光电机→机器内存；

    +   (3) 控制台开关启动第一条指令

    +   （出错时显示地址,修改指令）；

    +   （如有输入需要安装数据纸带）

    +   (4) 运行结果在电传打字机上输出。


    缺点：


    (1)资源独占；(2)手工费时。


    ![](img/7b6892715d0da57dced81602d7459e7e_12_0.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 例子


    +   - 一个作业在1000次/s的机器上运行需要

    +   1 hour，手动操作时间4min，手动时间与程序运行时间之比为1:15；

    +   - 如果计算机速度提高到600,000次/s，同样程序运行只需6s，而手动操作时间不变，手动操作与程序运行时间之比为40:1'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1.2.1 操作系统的产生(Cont.)


    2、批处理阶段（20世纪50年代，操作系统雏形）


    (1) 联机批处理：


    ![](img/7b6892715d0da57dced81602d7459e7e_14_0.png)


    优点：摆脱了人工干预(作业过渡没有人的干预,一个作业处理过程没有人的干预)


    缺点：I/O操作慢，主机等待时间长'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 1.2.1 操作系统的产生(Cont.)


    # 2、批处理阶段


    (2) 脱机批处理：


    ![](img/7b6892715d0da57dced81602d7459e7e_15_0.png)


    优点：减少了主机等待I/O操作时间


    缺点：(1)人工搬动磁带；(2)额外的卫星机'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 1.2.1 操作系统的产生(Cont.)


    3、执行系统阶段（20世纪60年代初期）


    通道：专门用于控制I/O设备的处理机，即I/O处理机。


    +   - 有自己的指令系统和运控部件；

    +   - 与主机共享内存；

    +   - 接受主CPU委托执行通道程序，完成I/O；

    +   - 通道I/O操作与主CPU并行；

    +   - 通道完成I/O时，向主机发中断请求。


    操作系统的初级阶段，通道和中断技术的出现。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.2.1 操作系统的产生(Cont.)


    # 3、执行系统阶段


    ![](img/7b6892715d0da57dced81602d7459e7e_17_0.png)


    非联机，非脱机，

    假脱机(SPOOLing, Simultaneous Peripheral Operation On-Line )'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.2.2 操作系统的完善


    +   1. 多道批处理系统（60年代初期）

    +     - 执行系统：单道作业,资源利用不充分；

    +     - 多道批处理:主机中同时放多个作业,最大限度提高资源利用率；

    +       - 单道到多道:不是量的变化,是质的飞跃

    +       - 带来问题:互斥、同步、通讯、死锁、饥饿、饿死

    +       - 多道批处理出现,标志操作系统走向成熟


    +   2. 分时系统（60年代初、中期）

    +     - 程序员提出:联机操作的要求；

    +     - 一台主机,多个终端,交互式工作。


    +   3. 实时系统（60年代中期）

    +     - 背景:计算机应用领域扩大:(工业控制、医疗控制、航班订票等)。

    +     - 要求:满足时间约束条件


    +   4. 通用操作系统（60年代后期）

    +     - 上述三类系统的结合,标志操作系统完善。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.2.3 操作系统的发展


    +   1. 计算机体系结构由集中向分散的发展，出现了计算机网络，由此产生网络操作系统和分布式操作系统；

    +   2. 随着家用和商用微型计算机的普及，出现了单用户多任务的操作系统；

    +   3. 大型计算任务要求计算机系统具有极强的计算和处理能力，产生了支持多处理器的并行操作系统；

    +   4. 随着各种处理器芯片和存储介质在控制领域的广泛应用，出现了微内核(micro kernel)操作系统体系结构，产生了嵌入式和智能卡操作系统；

    +   5. 伴随后摩尔时代的到来，提高单处理器速度已近极限，多核技术应运而生。新一代操作系统遇到的问题：多核的并发控制；多核下的进程调度。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.3 操作系统特性


    +   - 并发性

    +     - 多个程序在宏观上同时向前推进

    +     - 并发(concurrent) vs. 并行 (parallel)

    +       - 用户程序与用户程序并发

    +       - 用户程序与OS并发

    +       - OS与OS并发

    +   - 共享性

    +     - 多个程序共用系统中的各种软硬件资源

    +     - 在操作系统的协调和控制下

    +   - 异步性（随机性）

    +     - 多个程序以不可预知的速度向前推进

    +   - 虚拟性

    +     - 把一个实的CPU改造为多个虚的CPU

    +     - 内存+外存→虚存

    +     - 独占设备+共享设备→虚拟设备(数量多,速度快)'
  merge: -1
  img_proc: true
