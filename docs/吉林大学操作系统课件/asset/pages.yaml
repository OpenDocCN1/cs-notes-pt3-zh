  md: '# 8.9 RAID技术


    +   - RAID:

    +     - Redundant Array of Inexpensive Disks

    +       - compared with SLEDS (Single Large Expensive Disks)

    +     - Redundant Array of Independent Disks // 独立磁盘冗余阵列

    +   - Proposed by researchers at UC Berkeley

    +     - David A. Patterson

    +   - Background

    +     - disk access speed increases slowly compared with CPU

    +     - solution: multiple parallel component

    +   - Objective

    +     - enhanced performance

    +     - high reliability'
  merge: -1
  img_proc: true
- pgno: 832
  md: '# RAID技术


    +   - RAID

    +     - RAID is a set of physical disks viewed by the operating system as a single
    logical drive

    +     - Data are distributed across an array of physical drives

    +     - Redundant disk capacity is used to store parity information, which guarantees
    data recoverability in case of disk failure

    +   - Hardware RAID vs. Software RAID

    +     - hardware based: special controller

    +     - Windows NT, 2000, UNIX support software RAID

    +   - SCSI RAID vs. IDE RAID

    +     - performance: SCSI outperforms IDE

    +     - price: IDE beats SCSI'
  merge: -1
  img_proc: true
- pgno: 833
  md: '# 8.9.1 RAID级别


    How to organize data across multiple disks? Industry standards scheme


    +   RAID级别：行业标准规定的数据在多个磁盘上的存放方法。


    +   常见RAID级别: level0, ..., level5;


    +   RAID分条(stripping)数据存储方式


    +   位级分条(bit-level stripping)


    +   块级分条(block-level stripping)


    +   RAID衡量指标


    +   速度: 是否支持多个访问同时进行;


    +   可靠性: 是否能够发现和改正错误;


    +   成本: 是否有额外的开销和开销的大小.'
  merge: -1
  img_proc: true
- pgno: 834
  md: '# Level0(数据分条)


    数据分条以块为单位，连续的数据条循环存放在多个磁盘上。


    +   - 访问速度快；

    +   - 经济，空间利用率100%；

    +   - 无容错能力，可靠性差。


    ![](img/7b6892715d0da57dced81602d7459e7e_834_0.png)'
  merge: -1
  img_proc: true
- pgno: 835
  md: '# Level1 (镜像,mirroring):


    数据分条以块为单位,采用分布镜像方式存储,即完全相同的数据重复存放在两个盘上。


    ![](img/7b6892715d0da57dced81602d7459e7e_835_0.png)


    +   - 访问速度快; 读一个盘、写两个盘;

    +   - 可靠性(恢复性)高;

    +   - 费用高,是无镜像磁盘数的2倍,空间利用率50%。'
  merge: -1
  img_proc: true
- pgno: 836
  md: '# Level2 (位级汉明纠错码校验与恢复):


    +   - 数据以位(bit)为单位分条，分布存放在多个数据磁盘上，汉明纠错码存放在纠错磁盘上。


    ![](img/7b6892715d0da57dced81602d7459e7e_836_0.png)'
  merge: -1
  img_proc: true
- pgno: 837
  md: '# Level2 (位级汉明纠错码校验与恢复):


    +   - 纠错能力强，可靠性高；

    +     - 发现2个错误, 纠正1个错误.

    +   - 需要较多纠错盘存放汉明纠错码, 成本较高；

    +   - 不能同时为多个请求服务, 速度较慢:

    +     - 读操作：所有磁盘同时访问, 数据与错误校验码被送到磁盘阵列控制器；

    +     - 写操作：必须同时访问所有数据盘和纠错盘。'
  merge: -1
  img_proc: true
- pgno: 838
  md: '# Level3（位级单个奇偶校验）


    数据以位(bit)为单位分条，分布存放在多个数据磁盘上；只用一个冗余磁盘存放奇偶校验位。


    ![](img/7b6892715d0da57dced81602d7459e7e_838_0.png)


    +   - 有一定容错能力；

    +   - 存储代价较低；

    +   - 读写需要访问所有盘, 多个读写不能并行。'
  merge: -1
  img_proc: true
- pgno: 839
  md: '# Level4 (块级异或校验):


    +   - 数据分条以块为单位, 用异或运算产生校验信息,

    +   - 校验信息保存在单独的磁盘上。


    ![](img/7b6892715d0da57dced81602d7459e7e_839_0.png)'
  merge: -1
  img_proc: true
- pgno: 840
  md: '# Level 4 (Cont.)


    +   - 读操作不进行异或校验, 可以并行；

    +   - 写操作要更新异或校验信息, 都访问校验盘, 不能并行; 写操作时校验信息更新:

    +     P’4~7=(block4 xor block4’)xor p4~7

    +   - 异或校验信息用于磁盘发生故障时数据块的恢复。


    例如：若block7所在的Disk4发生故障, 要恢复block7。

    block7= p4~7 XOR (block4 XOR block5 XOR block6)'
  merge: -1
  img_proc: true
- pgno: 841
  md: '# Level5（块级分布式异或校验）


    数据分条以块为单位, 异或校验信息分散循环保存在各磁盘上。


    ![](img/7b6892715d0da57dced81602d7459e7e_841_0.png)'
  merge: -1
  img_proc: true
- pgno: 842
  md: '# Level5 (块级分布式异或校验)


    +   - 校验码计算：

    +     - p4~7=block4 XOR block5 XOR block6 XOR block7

    +   - 若block7发生故障，可通过下式恢复

    +     - block7=p4~7 XOR block4 XOR block5 XOR block6'
  merge: -1
  img_proc: true
