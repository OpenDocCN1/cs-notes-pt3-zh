- pgno: 430
  md: '# Java语言中的“管程”


    +   - 类似管程的对象object

    +     - 每个object有一个互斥锁lock，一般未用；

    +     - 说明为synchronized的method启用互斥锁；

    +     - 每个object内部有一个等待队列；

    +     - wait() method:

    +       - 释放lock，状态改为blocked，进入wait set.

    +     - notify() method:

    +       - 在wait set中取任意线程，移到entry set,状态改为runnable. (Signal and continue)

    +     - notifyAll() method:

    +       - Wait set所有线程移到entry set，状态改为runnable.'
  merge: -1
  img_proc: true
