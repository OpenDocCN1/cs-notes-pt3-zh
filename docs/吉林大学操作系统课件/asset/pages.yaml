- pgno: 581
  md: '# 6.5 虚拟存储系统


    +   - 无虚拟问题

    +     - 不能运行比内存大的程序；

    +     - 进程全部装入内存，浪费空间（进程活动具有局部性）。

    +       - 单控制流的进程需要较少部分在内存；

    +       - 多控制流的进程需要较多部分在内存。

    +   - 虚拟存储

    +     - 进程部分装入内存，部分（或全部）装入外存，运行时访问在外存部分动态调入，内存不够淘汰。'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# 6.5.1 虚拟页式存储系统


    # 基本原理


    +   - 进程运行前：

    +     - 全部装入外存，部分装入内存。


    +   - 进程运行时：

    +     - 访问页不在内存，发生缺页中断，中断处理程序：

    +       - 找到访问页在外存的地址；

    +       - 在内存找一空闲页面；

    +         - 如没有，按淘汰算法淘汰一个；

    +         - 如需要，将淘汰页面写回外存，修改页表和总页表；

    +       - 读入所需页面（切换进程）；

    +       - 重新启动中断指令。'
  merge: -1
  img_proc: true
