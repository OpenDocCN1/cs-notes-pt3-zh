- pgno: 246
  md: '# 4.1.3 并发程序及其特性


    +   - 不可再现性的例子

    +     - 进程P:

    +     - A1: N:=0;

    +     - A2: N:=N+1;

    +     - A3: GOTO A2;

    +     - 进程Q:

    +     - B1: PRINT (N) ;

    +     - B2: N:=0;

    +     - B3: GOTO B1;


    此例中进程P累计计数，进程Q将累计的结果打印出来。希望打印出的数是累计数的和。


    +   - 两个进程并发执行时有许多可能的交叉:

    +     - 如进程P循环5次进程Q循环1次，然后进程P又循环3次进程Q循环1次，则输出结果是5，3；

    +     - 如进程P循环2次进程Q循环1次，然后进程P又循环6次进程Q循环1次，则输出结果是2，6。两次执行结果完全不同。

    +     - 进程Q执行完B1后被中断，进程P对N执行加1操作，然后进程Q执行B2，在这种情况下进程P的累计数将被丢失。'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 4.1.3 并发程序及其特性


    # 4.1.3.2 并发程序的特性


    +   - （1）间断性：程序交叉执行。

    +   - （2）非封闭性：一个进程的运行环境可能被其它进程所改变，从而相互影响。

    +   - （3）不可再现性：由于交叉的随机性，并发程序的多次执行可能对应不同的交叉，因而不能期望重新运行的程序能够再现上次运行的结果。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 4.1.4 程序并发执行的条件


    +   - 在失去封闭性的条件下，保持可再现性。

    +     - **R(pi)={a1,a2,...,am}** 表示程序 pi 在执行期间所需读取的所有变量的集合，称为“读集”；

    +     - **W(pi)={b1,b2,...,bn}** 表示程序 pi 在执行期间所需改变的所有变量的集合，称为“写集”。

    +     - 若有两条语句 **c=a+b** 和 **v=c-1**，则它们的“读集”和“写集”分别为:

    +       - **R(c:=a+b)={a,b},  R(v:=c-1)={c}**

    +       - **W(c:=a+b)={c},  W(v:=c-1)={v}**'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 4.1.4 程序并发执行的条件


    +   - 若两个程序p1，p2满足如下条件，则能够保持可再现性，因而可以并发执行。该条件是1966年首先由Bernstein提出的，称为Bernstein条件。

    +     - R(p1)∩W(p2) ∪ R(p2)∩W(p1) ∪ W(p1)∩W(p2)=Φ'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 4.1.4 程序并发执行的条件


    +   - 例如，有如下四条语句：

    +     - S1: a:=x+y

    +     - S2: b:=z+1

    +     - S3: c:=a-b

    +     - S4: w:=c+1


    +   - R(S1)={x,y}， R(S2)={z}， R(S3)={a,b}， R(S4)={c}


    +   - W(S1)={a}， W(S2)={b}， W(S3)={c}， W(S4)={w}


    可见， R(S1)∩W(S2)∪R(S2)∩W(S1)∪W(S1)∩W(S2)=Φ，因而S1和S2可以并发执行；而S1和S3不能并发执行，因为W(S1)∩R(S3)={a}；S2和S3也不能并发执行，因为W(S2)∩R(S3)={b}；同样，S3和S4不能并发执行，因为W(S3)∩R(S4)={c}。'
  merge: -1
  img_proc: true
