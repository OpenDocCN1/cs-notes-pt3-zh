- pgno: 469
  md: '# 5.6.2 有序分配法


    证明无死锁（deadlock free）：


    反证，假设死锁


    时刻t1： p1无限等待r_k1中的资源实例，被p2占有；


    t2： p2无限等待r_k2中的资源实例，被p3占有；


    ...


    tn： pn无限等待r_kn中的资源实例，被p1占有；


    根据有序申请假设：


    F(r_k1)<F(r_k2)<...<F(r_kn)<F(r_k1)


    矛盾。'
  merge: -1
  img_proc: true
