- pgno: 100
  md: '# vfork 与 fork


    fork 功能


    +   - 复制地址空间(code+data+stack)

    +   - 复制控制结构(proc,user)


    +   - 特点

    +     - 父子进程之间有两个各自独立的数据拷贝


    +   - 问题

    +     - 不加载新程序

    +       - 不能实现数据共享，不能描述诸如 “有界缓冲区” 问题

    +     - 若加载新程序

    +       - 复制没有意义，浪费时间和空间'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# vfork与fork


    +   - **vfork**

    +     - 只复制控制结构(proc+user);

    +     - 不复制地址空间(code+data)

    +       - 父子进程共享地址空间

    +   - **使用**

    +     - 父进程使用 **vfork** 创建子进程;

    +       - 子进程与父进程共享地址空间;

    +       - 子进程使用 **execve** 改变其虚拟地址空间.'
  merge: -1
