- pgno: 816
  md: '# UNIX缓冲


    # 字符型缓冲


    +   - 100个缓冲区，长度8字节(6字符+2指针)

    +   - 组成公共缓冲池，所有字符型设备公用

    +   - 缓冲区或属于c freelists，或属于某字符设备(eg. tty,lp)


