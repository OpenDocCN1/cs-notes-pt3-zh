- pgno: 797
  md: '# 磁盘引臂调度(disk head scheduling)


    +   - **N-step SCAN（N步扫描）**

    +     - 将磁盘请求队列分为若干个长度为N的子队列，每个队列内采用SCAN算法

    +     - 例子：磁道由外向内编号0-99,磁头当前位置20,向内移动,N=4

    +       - 12, 5, 7, 30, 60, 77, 13, 26, 61, 80, 53, 66

    +       - 20→30→12→7→5→13→26→60→77→80→66→61→53

    +     - 当N很大时，接近SCAN算法

    +     - 当N=1时，蜕化为FCFS算法'
  merge: -1
  img_proc: true
- pgno: 798
  md: '# 磁盘引臂调度(disk head scheduling)


    +   - **FSCAN（Freezing SCAN，冻结扫描）

    +     - 将磁盘请求分为两个子队列,

    +       - 服务队列

    +       - 请求队列

    +     - 用SCAN算法扫描服务队列，并为请求服务，服务期间新到达的请求入请求队列

    +     - 扫描完成后交换两个队列的地位'
  merge: -1
  img_proc: true
- pgno: 799
  md: '# 8.6.1 磁盘I/O参数


    +   - 首先分析一下读/写一个磁盘块需要多少时间。它一般由如下三个因素确定：

    +     - 寻道时间（seek time）：将磁盘引臂移动到指定柱面所需要的时间；

    +     - 旋转延迟（rotational delay）：指定扇区旋转到磁头下的时间；

    +     - 传输时间（transfer time）：读/写一个扇区的时间。'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# 8.6.1 磁盘I/O参数


    +   - 寻道时间 Ts计算公式如下：

    +     - Ts = m × n + s

    +     - 其中，n为跨越磁道数，m为跨越一个磁道所用时间，s为启动时间。


    +   - 旋转延迟 Tr计算公式如下：

    +     - Tr = 1 / (2r)

    +     - 其中，r为磁盘转速。该公式给出的是平均旋转延迟，它是磁盘旋转一周时间的一半，即旋转半周所花费的时间。'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# 8.6.1 磁盘I/O参数


    传输时间 Tt计算公式如下：


    ```

    Tt=b/(rN)

    ```


    其中，b为读/写字字节数，r为磁盘转速，N 为一条磁道上的字节数。'
  merge: -1
  img_proc: true
- pgno: 802
  md: "# 8.6.1 磁盘I/O参数\n\n+   因此，可将访问时间Ta表示为：\n+   \n+   $T_a = T_s + T_r + T_t =\
    \ m \\times n + s + \\frac{1}{2r} + \\frac{b}{rN}$\n\n+   访问磁盘通常是以扇区（块）为单位的，令M为一个磁道上扇区的个数，则一个扇区的访问时间为：\n\
    +   \n+   $T_a = T_s + T_r + T_t = m \\times n + s + \\frac{1}{2r} + \\frac{1}{rM}$"
  merge: -1
  img_proc: true
- pgno: 803
  md: '# 例题


    例8-1. 设有一个只有一个移动磁头的磁盘，磁道由外向内编号0、1、2、...、199，磁头移动一个磁道所需时间为1ms，每个磁道有100个扇区，磁盘转速6000r/m。采用CLOOK引臂调度算法，当前引臂位置处于第100磁道，当前移动方向由外向内，并规定引臂向内扫描时为路经请求服务。对于如下磁道请求120、85、70、30，每个请求访问对应磁道上的一个扇区，问：


    +   (1)给出引臂移动序列，计算引臂移动量和寻道时间，忽略启动时间；


    +   (2)计算平均旋转延迟时间；


    +   (3)计算传输时间；


    +   (4)计算所有访问处理时间。'
  merge: -1
  img_proc: true
- pgno: 804
  md: '# 例题


    +   - 解答：

    +   - (1)磁盘引臂移动序列为: 100→120→30→70→85, 跨越磁道数: 20+90+40+15=165。共需寻道时间 165×1ms=165ms.

    +   - (2) 1次访盘的旋转延迟为:

    +     Tr=1/(2r)=1/(2×(6000/m))=1/(2×(100/s))

    +     =5ms, 4次访盘的旋转延迟为4×5ms=20ms.

    +   - (3) 1次访盘的传输时间为:

    +     Tt=1/(rM)=1/((6000/m)×100)=1/((100/s)×100)=0.1ms, 4次访盘的传输时间为 4×0.1ms=0.4ms.

    +   - (4)所有访问处理时间=165+20+0.4=185.4(ms)。'
  merge: -1
  img_proc: true
- pgno: 805
  md: '# 8.7 缓冲技术


    +   - 设备处理数据到达与离开速度不一致所采用的技术。

    +     - **Buffering vs. Caching**

    +       - buffering: one data copy

    +       - caching: multiple data copy (slow多, fast少)

    +     - 硬缓冲与软缓冲

    +       - 硬缓冲区通常设在设备中

    +       - 软缓冲区通常设在内存系统空间中

    +     - 私用缓冲与公共缓冲

    +       - 一个缓冲与一个固定设备相联系，不同设备使用不同的缓冲

    +         - 利用率低

    +       - 缓冲区由系统统一管理，按需要动态分派给正在进行I/O传输的设备'
  merge: -1
  img_proc: true
- pgno: 806
  md: '# 8.7 缓冲技术


    +   - 单缓冲、双缓冲、循环缓冲

    +     - 根据系统设计的缓冲区的个数，可将缓冲技术分为单缓冲、双缓冲、多缓冲以及缓冲池

    +     - 单缓冲

    +       - 在设备与进程之间设置一个缓冲区

    +       - 数据交换（如输入）时，信息由设备传到缓冲区，再由缓冲区传给进程，重复传送直到传输完成。

    +       - 设备和处理器对缓冲区的操作是串行的。'
  merge: -1
  img_proc: true
- pgno: 807
  md: '# 8.7 缓冲技术


    # 双缓冲


    +   - 在设备和进程之间设置两个缓冲区

    +   - 数据交换（如输入）时，信息由设备传到一个缓冲区，第一个缓冲区填满后，后续的信息由设备传到第二个缓冲区，同时处理器将第一个缓冲区的内容复制到进程空间。然后，设备可以在重新利用第一个缓冲区，如此往复直到传输完成。

    +   - 提高了处理器与设备之间的并行性'
  merge: -1
  img_proc: true
- pgno: 808
  md: '# 8.7 缓冲技术


    +   - 循环缓冲

    +     - 在设备与进程之间设置多个缓冲区，缓冲区链成环状，有两个指针 in 和 out，分别指出当前输入位置和当前取出位置。

    +     - 进一步提高设备和处理器之间的并行性。'
  merge: -1
  img_proc: true
