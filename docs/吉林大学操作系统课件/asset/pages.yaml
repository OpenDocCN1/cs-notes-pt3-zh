- pgno: 40
  md: '# 1.4.10 多媒体操作系统


    # 定义(百度百科)


    +   - 具有一般操作系统功能;

    +   - 还具有多媒体底层扩充模块，

    +     支持多媒体信息的采集、编辑、播放和传输。


    # Remarks


    +   - 不是一种独立的操作系统类型

    +   - 是现代操作系统的一种特性

    +   - 目前许多操作系统开始支持多媒体'
  merge: -1
