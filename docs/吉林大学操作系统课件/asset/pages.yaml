- pgno: 324
  md: "# 程序\n\n```\nProgram producers_consumers;\nVar B:Array[0,...,k-1]Of item;\n\
    \    S1,S2,mutex:semaphore;\n    in,out:0..k-1;\n```\n\n```\nProcedure producer\n\
    \    cycle\n        produce a product\n        P(S1);\n        P(mutex);\n   \
    \     B[in]:=product;\n        in:=(in+1)mod k;\n        V(mutex);\n        V(S2)\n\
    end\n```\n\n```\nProcedure consumer\n    cycle\n        P(s2);\n        P(mutex);\n\
    \        x:=B[out];\n        out:=(out+1)mod k;\n        V(mutex);\n        V(S1);\n\
    \        consume x;\nend;\n```"
