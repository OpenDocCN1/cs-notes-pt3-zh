- pgno: 205
  md: '# 3.4 实时调度(real-time scheduling)


    +   - 实时任务：

    +     - 具有明确时间约束的计算任务。

    +     - Eg.

    +       - 某时刻前必须开始处理

    +       - 某时刻前必须处理完毕

    +   - 实时调度：

    +     - 合理安排就绪实时任务的执行次序，满足每个实时任务时间约束条件的调度。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 实时任务分类


    +   - 硬实时 vs. 软实时

    +     - 硬实时(hard real-time): 必须满足任务截止期要求。

    +     - 软实时(soft real-time): 期望满足截止期要求。


    +   - 周期性 vs. 随机性

    +     - 周期性: 每隔固定时间发生一次

    +     - 随机性: 由随机事件触发，其发生时刻不确定'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 术语解释


    +   - Ready time: 就绪时间

    +   - Starting deadline: 开始截止期

    +   - Processing time: 处理时间

    +   - Completion deadline: 完成截止期

    +   - Occurring frequency: 发生频率'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 周期性实时事务


    +   - 周期性实时事务：

    +     - 令 $C_i$ 为任务 $P_i$ 处理时间， $T_i$ 为任务 $P_i$ 的发生周期，则任务 $P_1, ..., P_m$ 可调度的必要条件为：

    +       $$\sum_{i=1}^{m} \frac{C_i}{T_i} \le 1$$'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 周期性实时事务


    +   例:

    +   - T1=100, T2=200, T3=500 (ms)

    +   - C1=50, C2=30, C3=100 (ms)

    +   - C1/T1+C2/T2+C3/T3=0.5+0.15+0.2=0.85<1

    +   - 满足可调度的必要条件'
  merge: -1
  img_proc: true
