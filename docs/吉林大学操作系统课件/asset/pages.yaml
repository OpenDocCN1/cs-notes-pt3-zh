- pgno: 224
  md: '# 3.6.1 Linux 进程调度


    +   - 在调度级别上考虑三种特征进程

    +     - Real-time FIFO

    +     - Real-time Round Robin

    +     - Timesharing

    +   - Goodness-based scheduling

    +     - priority

    +       - 1-40, (缺省值20), 可通过nice系统调用调整, nice(value)中value的取值范围为(-20,20)之间, 以与经典UNIX保持兼容,
    但在内部对value值进行反向处理, 取priority=20-value.

    +     - counter

    +       - 进程尚可运行的剩余时间'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Linux 进程调度


    # counter


    +   - 对于运行进程来说，每个时钟间隔（10ms，称为一个jiffy），将counter减1

    +   - 当所有就绪进程的counter配额下降到0时，重新计算所有进程（包括等待进程）的counter值

    +     - counter= (counter/2) + priority


    # goodness


    +   - if(Real-time)goodness=1000+priority

    +   - if(Timesharing && counter=0)goodness=0

    +   - if(Timesharing && counter>0)goodness=counter+priority'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Linux 进程调度


    +   - **调度发生时刻：**

    +     - 运行进程的counter减至0；

    +     - 运行进程执行系统调用exit；

    +     - 运行进程因等待I/O、信号灯而被封锁；

    +     - 原来具有高goodness的进程被解除封锁。

    +   - **调度效果：**

    +     - 实时优先于分时

    +     - 交互和I/O进程优先于CPU进程'
  merge: -1
  img_proc: true
