- pgno: 563
  md: '# 6. 地址映射 σ: (s,d)→(b′+d)∪{Ω}


    逻辑地址(s,d)⇒物理地址(b′+d)


    +   1. 由程序确定逻辑地址(s,d);


    +   2. 由查快表得b′和l′


    如查不到：


    +   3. 由s与l比较判断是否越界

    +      不满足：0≤s≤l-1，越界；


    +   4. 由s和b查段表，得b′和l′


    +   5. 由d与l′比较，判断是否越界

    +      不满足：0≤d≤l′-1，越界；


    +   6. parbegin

    +      (s,b′,l′)⇒快表，如快表满淘汰一个；

    +      由b′+d得物理地址

    +      parend


    +   3. 由d与l′比较，判断是否越界

    +      不满足：0≤d≤l′-1，越界；


    +   4. 由b′+d得物理地址。'
  merge: -1
  img_proc: true
