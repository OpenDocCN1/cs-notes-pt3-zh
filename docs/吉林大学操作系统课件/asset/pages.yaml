- pgno: 279
  md: '# 满足临界区管理原则


    +   - 互斥性

    +     - 仅当flag[i]==in_cs, 且对所有j!=i, flag[j]!=in_cs时, 进程Pi才进入临界区域, 因而满足互斥性.


    +   - 进展性

    +     - 临界区空闲时, 排在序列turn, turn+1, ..., n-1,0,1, 2,...,turn-1最前面的申请进入临界区的进程获准进入临界区,
    因而满足进展性.


    +   - 有限等待性

    +     - 进程离开临界区时,按循环次序turn+1, ..., n-1,0,1, 2,...,turn-1确定唯一一个竞争进程为其后继, 所以一个进程最多等待n-1个进程进入并离开临界区后一定能进入临界区,
    因而满足有限等待性.'
