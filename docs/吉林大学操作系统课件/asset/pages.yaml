  md: "# 1.4.9 嵌入式操作系统\n\n+   - 嵌入在掌上电脑、通讯设备、车载系统、信息家电等非计算机类设施上的操作系统。\n+   - 特点：微内核结构（Micro-kernel），许多操作系统功能(文件系统,设备驱动)以应用程序模式运行。\
