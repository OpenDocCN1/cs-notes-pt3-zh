- pgno: 772
  md: '# 8.3.1 程序控制查询方式


    +   - **探询（polling）** 又称程序控制输入输出，是最早的输入输出控制方式

    +     - 可以采用硬件提供的专用的输入输出指令

    +     - 可以采用内存操作指令完成

