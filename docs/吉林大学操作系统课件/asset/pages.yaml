- pgno: 822
  md: '# 相关操作：


    getblk(dev,blkno)  //assign a buffer for the given block


    bread(dev,blkno)  //read a block(if necessary), return buf pointer


    bread a(dev,blkno,rablkno)  //read in first block, like read; but also start io
    on second block


    bwrite(bp)  //write the buffer, wait for completion, then release


    bawrite(bp)  //start the io, release buffer, no wait for completion


    bdwrite(bp) //release buffer, mark it so that if it is grabbed for another purpose,
    it will be written out before being given up


    brelse(bp)  //release the buffer, with no io implied'
  merge: -1
  img_proc: true
- pgno: 823
  md: '# getblk(dev,blkno)


    参数： dev:设备号， blkno: 设备块号


    返回： 缓冲区指针bp


    步骤：


    +   - 块在b链中，且当前空闲

    +     - 由av链摘除，标记BUSY，返回缓冲块指针

    +   - 块在b链中，但BUSY(其它进程在用)

    +     - sleep(空闲事件发生)，返回缓冲块指针

    +   - 不在b的链中，在av链上取到延迟写的块

    +     - 写出该块，分配下一个缓冲区

    +   - 不在b的链中，av链已空

    +     - 等待任意缓冲区变空闲的事件

    +   - 不在b的链中，在av链上得到空缓冲

    +     - 填写头部，由av链摘除，出旧b链，如新b链，返回缓冲块指针'
  merge: -1
  img_proc: true
- pgno: 824
  md: '# brelse(bp)


    +   - 参数： **bp**: 缓冲区头指针

    +   - 返回： 无

    +   - 步骤：

    +     - If 有等待者(b_flag&B_WANTED!=0),唤醒;

    +     - Else

    +       - bfreelist上有等待者,唤醒

    +       - bp入av链'
  merge: -1
  img_proc: true
- pgno: 825
  md: '# bread(dev,blkno)


    +   参数： dev:设备号， blkno: 设备块号


    +   返回： 载有信息的缓冲区bp


    +   步骤：

    +   - bp=getblk(dev,blkno)

    +   - if (缓冲区数据有效)

    +     - return(bp)    //在cache中得到

    +   - 启动磁盘读(d_actf/d_actl链)

    +   - sleep(等待读盘完成事件)


    +   中断

    +   - 唤醒

    +   - return(bp)'
  merge: -1
  img_proc: true
- pgno: 826
  md: '# bread a(dev,blkno,rablkno)


    参数： dev:设备号， blkno:读块号， rablkno:预读块号


    返回： blk缓冲块指针rbp


    # 步骤：


    +   - rbp=getblk(dev,blkno)


    +   - if(信息无效)

    +     - 启动设备读入(d_actf/d_actl链)


    +   - rabp=getblk(dev,rablkno)


    +   - if (B_DONE) //缓冲区从b链得到

    +     - brelse(rabp) //入av链


    +   - else //缓冲区从av链得到

    +     - 启动设备读入(d_actf/d_actl链) //中断时入av链


    +   - iowait(rbp)


    +   - return(rbp)'
  merge: -1
  img_proc: true
- pgno: 827
  md: '# bwrite(bp)


    参数： bp: 缓冲区指针


    步骤：


    +   - 入设备d_act队列(若设备不忙启动设备)

    +   - if(! B_ASYNC)

    +     - sleep(等待IO完成事件)

    +   - 中断

    +     - 唤醒

    +     - brelse(bp), (bp入av链)'
  merge: -1
  img_proc: true
- pgno: 828
  md: '# bdwrite(bp)


    +   - 参数: bp: 缓冲区指针

    +   - 返回: 无

    +   - 步骤:

    +     - 标记b_flags = | B_DELWRI | B_DONE

    +     - brelse(bp), (bp入av链)'
  merge: -1
  img_proc: true
- pgno: 829
  md: '# bawrite(bp)


    +   - 参数： **bp**: 缓冲区头指针

    +   - 返回： 无

    +   - 步骤:

    +     - bp->b_flag = | B_ASYNC

    +     - bwrite(bp)

    +   - 中断

    +     - 入av队列'
  merge: -1
  img_proc: true
