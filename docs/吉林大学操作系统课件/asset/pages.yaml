- pgno: 449
  md: '# 死锁定义


    +   - 一组进程中的每一个进程，均无限期地等待此组进程中某个其他进程占有的，因而永远无法得到的资源，这种现象称为进程死锁。

    +   - 定义死锁时刻:

    +     - 无限等待发生时；

    +     - 等待发生前（已注定死锁）。'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 由定义得到的结论


    +   几个有用的结论：

    +   - 参与死锁的进程至少有两个；

    +   - 每个参与死锁的进程均等待资源；

    +   - 参与死锁的进程中至少有两个进程占有资源；

    +   - 死锁进程是系统中当前进程集合的一个子集。'
  merge: -1
