- pgno: 38
  md: '# 1.4.8 多处理机操作系统


    +   - 多处理机系统

    +     - 具有公共内存的多CPU系统

    +   - 对称多处理机系统(SMP-symmetric multi-processor)

    +     - 没有主从关系的多处理机系统

    +   - 多处理机操作系统

    +     - 有效管理和使用多个CPU的操作系统

    +     - 特点: 进程与CPU多对多

    +     - 新问题:

    +       - (1) 调度问题； (2) 并发控制问题

    +   - 例子:

    +     - UNIX, Linux, Windows'
  merge: -1
  img_proc: true
