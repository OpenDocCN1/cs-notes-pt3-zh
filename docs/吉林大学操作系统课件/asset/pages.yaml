- pgno: 512
  md: '# 5.15 同种组合资源死锁的必要条件


    M: 资源数量


    N: 使用该类资源进程的数量


    Σ: 所有进程所需要该类资源的总量


    假定死锁，n个进程参与了死锁(2≤n≤N)


    参与死锁的进程所需资源总量≥M+n


    未参与死锁进程所需资源总量≥N-n


    所有进程所需资源总量Σ≥M+n+N-n=M+N


    当Σ<M+N时，一定没有死锁；


    当Σ≥M+N时，至少有一个交叉有死锁。'
  merge: -1
  img_proc: true
