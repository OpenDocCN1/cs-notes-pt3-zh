  md: '# (1) 编译(汇编)时：


    遇到访问外段指令，采用间接寻址，指向一个间接字：


    L

    D

    1: 未连接

    0: 已连接

    符号地址： “[X]|<Y>”

    逻辑地址： (段号,段内地址)


    # (2) 执行时：


    遇到间接指令，且L=1, 发生链接中断，处理程序：


    +   (a) 由D取出符号地址；

    +   (b) 由段名查段名-段号对照表，是否分配段号。'
