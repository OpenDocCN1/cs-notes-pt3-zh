- pgno: 591
  md: '# 3. 最近最少使用算法（LRU）


    淘汰最近一次访问距当前时间最长的。


    Replace page that hasn’t been used for the longest period of time.


    实现： stack


    当一页面被访问时,从栈中取出压到栈顶,


    栈底是: LRU page.


    例子： reference string: 4, 7, 0, 7, 1, 0, 1, 2, 1, 2, 7, 1, 2


    Stack before a

    2

    1

    0

    7

    4


    Stack before b

    7

    2

    1

    0

    4

    a b'
