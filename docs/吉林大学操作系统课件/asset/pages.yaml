  md: '# 4. 最近不用的先淘汰(not used recently)


    淘汰最近一段时间未用到的。


    实现：每页增加一个访问标志，

    访问置1，定时清0，

    淘汰时取标志为0的。


    # LRU算法的近似：


    Reference string: 2, 3, 5, 6, 4, 2,5, 6, 7, 5, 6, 8,


    LRU: 3


    NUR: 2, 3, 4任意'
