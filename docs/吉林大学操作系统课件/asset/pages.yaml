- pgno: 646
  md: '# 6.6.1 Linux 存储管理


    # 1. 伙伴堆存储分配算法


    # (1) Physical memory management


    +   - 页框：静态等长，4KB;


    +   - 块组：连续的 2^i (i = 0, 1, 2, ..., 9)个页框构成一个块组；

    +     共10个块组，长度为2^i 的块组叫作块组 i；


    +   - 空闲区表：free_area[i]表示页框数为2^i的块组，其结构为：


    | 空闲块组指针 | 块组位图指针 |


    +   - 分配/释放：Buddy heap algorithm

    +     以2^i个页框(块组)为分配/释放单位( 2^{i-1}<fn≤2^i )，

    +     fn为要申请的页框数；'
  merge: -1
  img_proc: true
- pgno: 647
  md: '# 6.6.1 Linux 存储管理(Cont.)


    +   ■ 块组位图:

    +     • 对于块组2^i 按前后顺序两两结合成一对Buddy,

    +       如: 2^1块组的0、1页框和2、3页框是一对Buddy;

    +     • 块组位图的 1 位表示对应的一对Buddy页框块组的使用情况;

    +     • 对于一对buddy:

    +       ① 若一个空闲, 另一个全部或部分占用, 则位图相应位置1;

    +       ② 当两个都空闲, 或都被全部或部分占用, 则位图相应位置0。


    +   ■ 伙伴条件:

    +     ① 两个块大小相同, 即具有相同的页框数b;

    +     ② 两个块的物理地址相连;

    +     ③ 位于后面块组的最后页框编号+1必须是2b的整数倍。'
  merge: -1
  img_proc: true
