- pgno: 777
  md: '# 8.3.3 DMA方式的传输步骤


    +   ① CPU将操作量送到DMA控制器的操作数寄存器operands中，包括内存起始地址、传输数量等。


    +   ② CPU将操作码送到DMA控制器的opcode寄存器以启动DMA控制器。DMA控制器将其忙碌寄存器(busy)置位，表明在此期间不再接受新的操作命令。此后，CPU可以执行与该控制器无关的其它操作。


    +   ③ DMA控制器与设备交往，将数据由缓冲区传送到设备或者由设备传送到缓冲区。'
  merge: -1
  img_proc: true
- pgno: 778
  md: '# 8.3.3 DMA方式的传输步骤


    +   - ④ DMA控制器将缓冲区内容复制到内存空间，或由内存空间复制到缓冲区。

    +   - ⑤ 计数器值减1.若结果非0（未传送完）则转步骤③继续传输；否则转步骤⑥。

    +   - ⑥ 传输结束时，DMA控制器复位其忙碌寄存器，并向CPU发送中断请求。

    +   - ⑦ CPU读入并检查其DMA状态寄存器，以确认操作是否成功。'
  merge: -1
  img_proc: true
