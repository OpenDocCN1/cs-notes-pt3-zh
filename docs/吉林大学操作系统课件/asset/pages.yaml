- pgno: 661
  md: '# 6.6.2 Windows Vista 存储管理(Cont.)


    # 5. 页面调度


    +   **闲置(free)状态:**

    +   未分配内存的页面。

    +   对闲置状态页面的访问，将导致缺页中断;


    +   **预定(reserved)状态:**

    +   已分配内存, 但不可立即使用;

    +   只有显示地解除预定状态才可使用,

    +   通常用来存储区的预留;


    +   **确认(committed)状态:**

    +   已分配内存并且可访问的页面。'
