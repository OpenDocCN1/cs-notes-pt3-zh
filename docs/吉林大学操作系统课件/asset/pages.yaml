- pgno: 844
  md: '# 8.9.1 RAID级别(Cont.)


    # 表8-1　RAID 级别的比较


    | Level | 分条粒度 | 读并发性 | 写并发性 | 冗余(容错/开销) |

    |---|---|---|---|---|

    | 0 | 块 | 支持 | 支持 | 无 |

    | 1 | 块 | 支持 | 不支持 | 镜像 |

    | 2 | 位 | 不支持 | 不支持 | 汉明纠错码奇偶校验与恢复 |

    | 3 | 位 | 不支持 | 不支持 | 单个奇偶校验 |

    | 4 | 块 | 支持 | 不支持 | 块级异或校验 |

    | 5 | 块 | 支持 | 支持 | 块级分布式异或校验 |'
  merge: -1
