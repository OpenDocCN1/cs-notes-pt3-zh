- pgno: 112
  md: '# 2.3.5.1 用户级别线程


    +   - 实现方法:

    +     - 基于library函数，系统不可见

    +     - 线程创建、撤销、状态转换在目态完成

    +     - TCB在用户空间，每个进程一个系统栈

    +   - 优点:

    +     - 不依赖于操作系统，调度灵活

    +     - 同一进程中多线程切换速度快(不需进入操作系统)

    +   - 缺点:

    +     - 同一进程中多个线程不能真正并行

    +     - 一个线程进入系统受阻，进程中其它线程不能执行'
  merge: -1
  img_proc: true
