- pgno: 168
  md: '# 调度参数


    周转时间：完成时间-进入时间


    $T = t_f - t_s$


    平均周转时间：周转时间的平均值


    $\overline{T} = \frac{1}{n}\left(\sum_{i=1}^{n} T_i\right)$


    带权周转时间：周转时间/运行时间


    $W = \frac{T}{R}$


    平均带权周转时间：带权周转时间的平均值


    $\overline{W} = \frac{1}{n}\left(\sum_{i=1}^{n} W_i\right) = \frac{1}{n}\left(\sum_{i=1}^{n}
    \frac{T_i}{R_i}\right)$'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# CPU burst vs. I/O burst


    +   - 阵发期：

    +     - CPU burst cycle: 进程(线程)使用CPU计算；

    +     - I/O burst cycle: 进程(线程)使用设备I/O。

    +   - 进程运行行为:

    +     - CPU burst, I/O burst, CPU burst, I/O burst, ......

    +   - CPU调度：考虑处于CPU burst进程集合

    +     - CPU burst时间根据以前行为推定。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# CPU burst vs. I/O burst


    +   下一个CPU burst的长度估算


    +   令Tₙ是估计的第n个CPU阵发期的长度，tₙ的值是进程最近一次CPU阵发期长度，则有如下估算公式：


    +   Tₙ₊₁ = α tₙ + (1-α) Tₙ


    +   参数α(0≤α≤1)控制tₙ和Tₙ在公式中起的作用：当α=0时，Tₙ₊₁=Tₙ；当α=1时，Tₙ₊₁=tₙ。通常α取0.5。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 剥夺式调度与非剥夺式调度


    +   - 剥夺式(preemptive)

    +     - 就绪进程可以从运行进程手中抢占CPU。

    +       - 进程运行,直到结束、等待或被抢先

    +   - 非剥夺式(non-preemptive)

    +     - 就绪进程不可从运行进程手中抢占CPU。

    +       - 进程运行,直到结束或等待'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 3.2.1.1 先到先服务算法


    +   - **FCFS（First Come First Serve）**

    +     - 按进程申请CPU（就绪）的次序。

    +     - Process Arrival time Burst time

    +       - P1 0 27

    +       - P2 1 3

