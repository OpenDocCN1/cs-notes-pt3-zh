- pgno: 739
  md: '# smount(special_pathname, directory_pathname, roflag)


    special_pathname: 特殊文件名


    directory_pathname: 目录文件名（安装节点）


    roflag: 只读标志


    +   1. 检查是否超级用户；

    +   2. 找到special_pathname文件的inode(用mknode建立)；

    +   3. 合法性检查（特殊块型文件）；

    +   4. 找到directory_pathname节点的inode；

    +   5. 如非目录或引用数大于1，错返；

    +   6. 读入super block到buf，按filesys格式解释.

    +   7. 安装节点inode的i_addr[0]=设备文件i_addr[0]; (dev)

    +   8. 分配一个mount表项，填写（m_dev， m_bufp， m_inodep），

    +   9 安装节点inode的i_flag =| IMOUNT.'
  merge: -1
  img_proc: true
- pgno: 740
  md: '# 例子：


    ```

    smount(“/dev/disk1”，“/usr/d1”，0)

    ```


    # 安装之前：


    disk1只能作为特殊文件(块序列文件)访问(raw IO);


    # 安装之后：


    d1成为disk1文件卷的根目录。


    disk1的super block读入内存缓冲区中，按filesys格式解释，根目录inode读入内存inode区中；


    内存中inode区是所有安装文件卷共用的，因而，在内存inode中有i_dev指定inode对应的卷，用于回写。'
  merge: -1
  img_proc: true
- pgno: 741
  md: '# sumount(special_file_name)


    special_file_name: 待卸下卷的特殊文件名；


    +   1. 查目录找到inode，取dev(i_addr[0]);

    +   2. 释放特殊文件的inode;

    +   3. 由dev查mount表(m_dev)找到对应super block;

    +   4. 系统缓冲区延迟写块写回;

    +   5. 该卷所有更新i_node写回;

    +   6. super block写回;

    +   7. 释放super block所占用的缓冲区;

    +   8. 由m_inodep找到安装节点的inode;

    +   9. 安装节点i_flag &= ~IMOUNT;

    +   10. 释放mount表项。'
  merge: -1
  img_proc: true
