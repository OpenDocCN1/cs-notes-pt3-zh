- pgno: 72
  md: '# 2.2 进程的引入(Cont.)


    多道系统中的程序：


    推进，暂停，推进，暂停，……


    暂停：保存现场(PSW+PC，寄存器)


    推进：恢复现场(寄存器，PSW+PC)


    暂停原因：(1)自身原因：等待资源，启动IO


    (2)剥夺CPU—给其它程序运行机会'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 2.2.1 进程的概念


    +   定义：

    +   - 可参与并发执行的程序称为进程。

    +   - 进程是具有一定独立功能的程序关于一个数据集合的一次运行活动。


    +   定义强调两个方面：

    +   - 动态：执行中的程序；

    +   - 并发：可与其他进程同时执行。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 并发 vs. 并行


    +   - 并发： **concurrent**

    +     - 宏观同时，“交替执行”，不要求多个CPU

    +   - 并行： **parallel**

    +     - 微观同时，要求多个CPU

    +     - “并行算法”'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 2.2.2 进程状态及状态转换


    +   - 2.2.2.1 进程状态(基本状态)

    +     - 运行态(RUN): 占有CPU正在向前推进

    +     - 就绪态(READY): 可以运行，但未得到CPU

    +     - 等待态(WAIT): 等待某一事件发生

    +   - 2.2.2.2 状态转换

    +     - 就绪⇒运行：获得处理机

    +     - 运行⇒就绪：剥夺处理机

    +     - 运行⇒等待：申请资源未得到，启动IO

    +     - 等待⇒就绪：得到资源，IO中断'
  merge: -1
  img_proc: true
