- pgno: 199
  md: '# UNIX的中级调度（sched #0）


    +   - 移入SRUN状态进程

    +   - 如内存不够，

    +     - 移出SWAIT和SSTOP状态进程；

    +     - 如还不够，移出SSLEEP和SRUN状态进程；

    +       - 条件：

    +         - 待移入进程在外存时间>=3秒；

    +         - 待移出进程在内存时间>=2秒。'
  merge: -1
