  md: "# 6.5.1.2 内存页框分配策略（静态策略）\n\n+   1. 平均分配\n+   \n+   如内存128页，进程25个，每个进程5个页框\n\
    \n+   2. 按进程长度比例分配\n+   \n+   pi共si个页面；S=Σsi；内存共m个页框\n+   \n+   ai=(si/S)×m\n\n\
    +   3. 按进程优先级比例分配\n\n+   4. 按进程长度和优先级比例分配\n\n静态策略没有反映：\n\n(1)程序结构；\n\n(2)程序在不同时刻的行为特性。"
  merge: -1
  img_proc: true
- pgno: 586
  md: '# 6.5.1.3 外存块的分配策略


    +   1. 静态分配

    +      外存保持进程的全部页面：

    +      优点：速度快--淘汰时不必写回(未修改情况)

    +      缺点：外存浪费


    +   2. 动态分配

    +      外存仅保持进程不在内存的页面：

    +      优点：节省外存

    +      缺点：速度慢--淘汰时必须写回'
  merge: -1
  img_proc: true
- pgno: 587
  md: "# 6.5.1.4 页面调入时机\n\n+   1. **请调(demand paging)**  \n+      **upon page fault**,\
    \ 发生缺页中断时调入。\n+   \n+   2. **预调(prepaging)**  \n+      **before page fault**,\
    \ 将要访问时调入(根据程序顺序行为，不一定准)  \n+      预调必须辅以请调。"
  merge: -1
  img_proc: true
