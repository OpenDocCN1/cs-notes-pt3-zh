- pgno: 619
  md: '# 6.5.2.2 段的动态连接(dynamic linking)


    +   - 动态连接 vs. 静态连接

    +     - 静态连接：运行前连接，由link完成；

    +     - 动态连接：运行时连接，由OS完成.

    +   - 静态连接的缺点

    +     - 连接时间长；

    +     - 目标代码长；

    +     - 连接段可能并不执行(未用到)。'
