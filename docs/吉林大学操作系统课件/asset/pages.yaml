- pgno: 549
  md: '# 6.3.2.2 多级页表


    +   - 提出背景

    +     - 内存空间成倍增长, 进程虚拟空间成倍增加

    +       - 单级页表需要很大连续内存空间

    +     - 例如

    +       - 32位进程地址空间, 页长占12位（4k）, 页号20位, 页表最多可达2^20个入口！

    +     - 多线程设计导致进程虚拟空间不连续(空洞hole)

    +       - 栈的预留空间(没有页架相对应)

    +       - 页表所占内存空间浪费

    +     - 解决策略

    +       - 二级或多级页表'
  merge: -1
  img_proc: true
