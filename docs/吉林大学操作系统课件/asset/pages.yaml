  md: '# 3.2.1 处理机调度算法


    +   - 考虑因素（scheduling criteria）

    +     - CPU利用率；(max)

    +     - 吞吐量；(max)

    +     - 周转时间；(min)

    +     - 响应时间；(min)

    +     - 系统开销；(min)'
  merge: -1
