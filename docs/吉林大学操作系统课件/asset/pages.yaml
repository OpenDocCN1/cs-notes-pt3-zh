- pgno: 960
  md: '# # 有关文件的系统调用命令


    +   - 卸下文件卷 `sumount(special_name)`


    +     - 查目录找到special_pathname的inode, 取 dev(i_addr[0])


    +     - 释放特殊文件的inode


    +     - 由dev查mount表(m_dev)找到对应super block


    +     - 系统缓冲区延迟写块写回


    +     - 该卷所有更新inode写回


    +     - super block写回


    +     - 释放super block所占用的缓冲区


    +     - 由m_inodp找到安装节点的inode


    +     - 安装节点i_flag = & ~IMOUNT


    +     - 释放mount表项'
  merge: -1
  img_proc: true
