- pgno: 950
  md: '# vfork 与 fork


    fork 功能


    +   - 复制地址空间(code+data+stack)

    +   - 复制控制结构(proc,user)


    +   - 特点

    +     - 父子进程之间有两个各自独立的数据拷贝


    +   - 问题

    +     - 不加载新程序

    +       - 不能实现数据共享，不能描述诸如“有界缓冲区”问题

    +     - 若加载新程序

    +       - 复制没有意义，浪费时间和空间'
  merge: -1
  img_proc: true
- pgno: 951
  md: '# vfork与fork


    +   - **vfork**

    +     - 只复制控制结构(proc+user);

    +     - 不复制地址空间(code+data)

    +       - 父子进程共享地址空间

    +   - **使用**

    +     - 父进程使用 **vfork** 创建子进程;

    +       - 子进程与父进程共享地址空间;

    +       - 子进程使用 **execve** 改变其虚拟地址空间.'
  merge: -1
  img_proc: true
- pgno: 952
  md: '# 13.7.2 有关文件的系统调用命令


    +   - 创建文件 `fd=creat(path_name,mode)`

    +     - 分配一个 **inode**

    +     - 填写目录项

    +     - 以写方式打开该文件

    +     - 返回文件描述符

    +   - 打开文件 `fd=open(path_name,mode)`

    +     - 查目录找到 **inode**

    +     - 权限检查(`mode, i_mode, i_uid, i_gid, u_uid, u_gid`)

    +     - 在 **file** 表中分配一个表项，指向该内存 **inode**

    +     - 在 **u_ofile** 中取一表目，指向 **file** 表中对应表目

    +     - 返回文件描述符 **fd**'
  merge: -1
  img_proc: true
- pgno: 953
  md: '# 有关文件的系统调用命令


    +   - 关闭文件 `close(fd)`

    +     - 由 `fd` 查 `u_ofile` 找到对应入口

    +     - 由 `u_ofile[fd]` 找到 `file` 表对应入口

    +     - `f_count--`

    +     - 若 `f_count=0`，`i_count--`

    +     - 若 `i_count=0`，且 `i_node` 修改过，`i_node` 写回外存

    +     - `u_ofile[fd]=-1`（空闲标志）'
  merge: -1
  img_proc: true
- pgno: 954
  md: '# 有关文件的系统调用命令


    +   - 读命令 `n_rd=read(fd, buf, bytes)`

    +     - 由 `u_ofile[fd]`，找到 `file` 表对应入口

    +     - 检查访问权限 (`f_flag`, `READ`)

    +     - 由 `f_inode` 找到内存 `inode` 入口

    +     - 由 `f_offset`、`count` 和 `i_addr` 计算磁盘块号（可能多个块）（`bmap` 函数）

    +     - 启动 I/O 设备读取盘块到系统缓冲区中（如 buffer 无，切换进程）

    +     - 缓冲区信息复制到进程空间（`iomove`）

    +     - 返回实际传输字节数 `nrd`'
  merge: -1
  img_proc: true
- pgno: 955
  md: '# 有关文件的系统调用命令


    +   - 写文件 n_wt=write(fd, buf, bytes)

    +     - 由u_ofile[fd], 找到file表对应入口

    +     - 检查访问权限(f_flag, WRITE)

    +     - 由f_inode找到内存inode入口

    +     - 由f_offset, count和i_addr计算磁盘地址块号(可能分配盘块)

    +     - 申请系统缓冲区，将buf起始count数据送到缓冲区中(可多次)

    +     - 缓冲区链到设备I/O链上,如设备空闲启动设备

    +     - 修改inode中文件长度i_size

    +     - 返回实际传输字节数nwt'
  merge: -1
