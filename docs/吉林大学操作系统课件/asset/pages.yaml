    +   作业状态：

    +   - 提交：输入机向输入井传送

    +   - 后备：在输入井,尚未进入内存

    +   - 执行：分解为进程,在内存处理

    +   - 完成：处理完毕,结果在输出井

    +   - 退出：由输出井向打印机传送'
  merge: -1
