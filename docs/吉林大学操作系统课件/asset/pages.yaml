- pgno: 653
  md: '# 6.6.1 Linux 存储管理(Cont.)


    # Buddy heap algorithm:


    +   - 问题: internal fragmentation.

    +     例如: 申请17个页框, 由于2⁴<17≤2⁵, 按Buddy heap algorithm, 要在块组5的空闲区分配32个页框, 造成15个页框的浪费,
    即internal fragmentation.


    +   - 解决办法:

    +     ① second memory allocator

    +     当实际申请页框数fn<2ⁱ时, 将2ⁱ- fn按2的整数次幂切分(carves slabs), 由second memory allocator单独管理。

    +     ② third memory allocator

    +     进程物理空间不要求连续时, 内存分配由third memory allocator完成。'
  merge: -1
  img_proc: true
