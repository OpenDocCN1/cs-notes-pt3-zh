- pgno: 466
  md: '# 5.6 死锁预防


    +   - 对进程有关资源的活动加限制，所有进程遵循这种限制，即可保证没有死锁发生。

    +     - 优点：简单，系统不需要做什么。

    +     - 缺点：对进程的约束，违反约束仍可能死锁。<|message|>- 预防方法：

    +     - 预先分配法；

    +     - 有序分配法。'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# 5.6.1 预先分配法


    +   - 进程：运行前申请所需全部资源；

    +   - 系统：

    +     - 能够满足，全部分配，

    +     - 否则，一个也不分配。

    +   - 破坏 “hold-and-wait”条件

    +   - 缺点：

    +     - 资源利用效率低；

    +     - 一次提出申请困难。'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# 5.6.2 有序分配法


    资源集： R={r1,r2,...,rn}


    函数： F: R→N


    例如： R={scanner,tape,printer}


    F(scanner)=1; F(tape)=2; F(printer)=3;


    申请次序


