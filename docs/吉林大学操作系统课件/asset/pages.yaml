- pgno: 938
  md: '# 预先读与延迟写


    +   - **预先读(read ahead)**

    +     - 将以后即将使用的块读入缓冲区中

    +     - 以后进程需要该块时便可在缓冲区中直接得到，不必等待设备I/O传输

    +     - 基于文件顺序访问的假设

    +     - 预先读函数 `breada(dev,blkno,rablkno)`

    +       - `rablkno` 链入 d 链

    +       - IO完成放入 b 链和 av 链'
  merge: -1
  img_proc: true
- pgno: 939
  md: '# 预先读与延迟写


    +   - 延迟写(delayed write)

    +     - 当一个缓冲块尚未写满时，暂不将其写到外存

    +     - 以后继续写时，不必将该块由外存读入内存

    +     - 延迟写函数bdwrite(bp)

    +       - 将bp对应的缓冲区链入b链和av链，若以后还需 要读写，可在缓冲区中得到。

    +       - 缓冲区在av链上取到用作其它用途前，由b链换 到d链，写回外存。'
  merge: -1
  img_proc: true
