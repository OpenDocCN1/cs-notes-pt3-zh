- pgno: 841
  md: '# Log Record Buffering


    +   - **Log record buffering**: log records are buffered in main memory, instead
    of of being output directly to stable storage.

    +     - Log records are output to stable storage when a block of log records in
    the buffer is full, or a **log force** operation is executed.


    +   - Log force is performed to commit a transaction by forcing all its log records
    (including the commit record) to stable storage.


    +   - Several log records can thus be output using a single output operation,
    reducing the I/O cost.'
  merge: -1
  img_proc: true
- pgno: 842
  md: '# Log Record Buffering (Cont.)


    The rules below must be followed if log records are buffered:


    +   - Log records are output to stable storage in the order in which they are
    created.


    +   - Transaction $T_i$ enters the commit state only when the log record $<T_i$
    **commit**> has been output to stable storage.


    +   - Before a block of data in main memory is output to the database, all log
    records pertaining to data in that block must have been output to stable storage.


    +     - This rule is called the **write-ahead logging** or **WAL** rule


    +     - Strictly speaking WAL only requires undo information to be output'
  merge: -1
  img_proc: true
- pgno: 843
  md: '# Database Buffering


    +   - Database maintains an in-memory buffer of data blocks

    +     - When a new block is needed, if buffer is full an existing block needs
    to be removed from buffer

    +     - If the block chosen for removal has been updated, it must be output to
    disk

    +   - The recovery algorithm supports the **no-force policy**: i.e., updated blocks
    need not be written to disk when transaction commits

    +     - **force policy**: requires updated blocks to be written at commit

    +       - More expensive commit

    +   - The recovery algorithm supports the **steal policy**: i.e., blocks containing
    updates of uncommitted transactions can be written to disk, even before the transaction
    commits


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_843_0.png)'
  merge: -1
  img_proc: true
- pgno: 844
  md: '# Database Buffering (Cont.)


    +   - If a block with uncommitted updates is output to disk, log records with
    undo information for the updates are output to the log on stable storage first

    +     - (Write ahead logging)

    +   - No updates should be in progress on a block when it is output to disk. Can
    be ensured as follows.

    +     - Before writing a data item, transaction acquires exclusive lock on block
    containing the data item

    +     - Lock can be released once the write is completed.

    +       - Such locks held for short duration are called **latches**.


    +   - **To output a block to disk**

    +     1. First acquire an exclusive latch on the block

    +        1. Ensures no update can be in progress on the block

    +     2. Then perform a **log flush**

    +     3. Then output the block to disk

    +     4. Finally release the latch on the block'
  merge: -1
  img_proc: true
- pgno: 845
  md: '# Buffer Management (Cont.)


    +   - Database buffer can be implemented either

    +     - in an area of real main-memory reserved for the database, or

    +     - in virtual memory


    +   - Implementing buffer in reserved main-memory has drawbacks:

    +     - Memory is partitioned before-hand between database buffer and applications,
    limiting flexibility.

    +     - Needs may change, and although operating system knows best how memory
    should be divided up at any time, it cannot change the partitioning of memory.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_845_0.png)'
  merge: -1
  img_proc: true
- pgno: 846
  md: '# Buffer Management (Cont.)


    Database buffers are generally implemented in virtual memory in spite of some
    drawbacks:


    +   - When operating system needs to evict a page that has been modified, the
    page is written to swap space on disk.

    +   - When database decides to write buffer page to disk, buffer page may be in
    swap space, and may have to be read from swap space on disk and output to the
    database on disk, resulting in extra I/O!

    +     - Known as **dual paging** problem.

    +   - Ideally when OS needs to evict a page from the buffer, it should pass control
    to database, which in turn should

    +     1. Output the page to database instead of to swap space (making sure to
    output log records first), if it is modified

    +     2. Release the page from the buffer, for the OS to use


    Dual paging can thus be avoided, but common operating systems do not support such
    functionality.'
  merge: -1
  img_proc: true
- pgno: 847
  md: '# Fuzzy Checkpointing


    +   - To avoid long interruption of normal processing during checkpointing, allow
    updates to happen during checkpointing

    +   - **Fuzzy checkpointing** is done as follows:

    +     1. Temporarily stop all updates by transactions

    +     2. Write a <**checkpoint** L> log record and force log to stable storage

    +     3. Note list M of modified buffer blocks

    +     4. Now permit transactions to proceed with their actions

    +     5. Output to disk all modified buffer blocks in list M

    +        - blocks should not be updated while being output

    +        - Follow WAL: all log records pertaining to a block must be output before
    the block is output

    +     6. Store a pointer to the **checkpoint** record in a fixed position **last_checkpoint**
    on disk'
  merge: -1
  img_proc: true
- pgno: 848
  md: '# Fuzzy Checkpointing (Cont.)


    When recovering using a fuzzy checkpoint, start scan from the checkpoint record
    pointed to by last_checkpoint


    +   Log records before last_checkpoint have their updates reflected in database
    on disk, and need not be redone.


    +   Incomplete checkpoints, where system had crashed while performing checkpoint,
    are handled safely


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_848_0.png)'
  merge: -1
  img_proc: true
- pgno: 849
  md: '# Failure with Loss of Nonvolatile Storage


    +   - So far we assumed no loss of non-volatile storage

    +   - Technique similar to checkpointing used to deal with loss of non-volatile
    storage

    +     - Periodically **dump** the entire content of the database to stable storage

    +     - No transaction may be active during the dump procedure; a procedure similar
    to checkpointing must take place

    +       - Output all log records currently residing in main memory onto stable
    storage.

    +       - Output all buffer blocks onto the disk.

    +       - Copy the contents of the database to stable storage.

    +       - Output a record **<dump>** to log on stable storage.'
  merge: -1
  img_proc: true
- pgno: 850
  md: '# Recovering from Failure of Non-Volatile Storage


    +   - To recover from disk failure

    +     - restore database from most recent dump.

    +     - Consult the log and redo all transactions that committed after the dump

    +   - Can be extended to allow transactions to be active during dump; known as
    **fuzzy dump** or **online dump**

    +     - Similar to fuzzy checkpointing'
  merge: -1
  img_proc: true
