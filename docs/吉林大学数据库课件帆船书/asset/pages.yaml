- pgno: 734
  md: '# Conflict Serializability (Cont.)


    Schedule 3 can be transformed into Schedule 6 -- a serial schedule where T₂ follows
    T₁, by a series of swaps of non-conflicting instructions. Therefore, Schedule
    3 is conflict serializable.


    | T₁ | T₂ |

    |---|---|

    | read (A) | |

    | write (A) | |

    | | read (A) |

    | | write (A) |

    | read (B) | |

    | write (B) | |

    | | read (B) |

    | | write (B) |


    Schedule 3


    | T₁ | T₂ |

    |---|---|

    | read (A) | |

    | write (A) | |

    | read (B) | |

    | write (B) | |

    | | read (A) |

    | | write (A) |

    | | read (B) |

    | | write (B) |


    Schedule 6'
  merge: -1
