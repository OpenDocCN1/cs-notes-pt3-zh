- pgno: 199
  md: '# Functions and Procedures


    +   - SQL:1999 supports functions and procedures

    +     - Functions/procedures can be written in SQL itself, or in an external programming
    language (e.g., C, Java).

    +     - Functions written in an external languages are particularly useful with
    specialized data types such as images and geometric objects.

    +       - Example: functions to check if polygons overlap, or to compare images
    for similarity.

    +     - Some database systems support **table-valued functions**, which can return
    a relation as a result.

    +   - SQL:1999 also supports a rich set of imperative constructs, including

    +     - Loops, if-then-else, assignment

    +   - Many databases have proprietary procedural extensions to SQL that differ
    from SQL:1999.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_199_0.png)'
