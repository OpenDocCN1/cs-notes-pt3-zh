- pgno: 613
  md: '# Hash-Join algorithm (Cont.)


    +   - The value *n* and the hash function *h* is chosen such that each *sᵢ* should
    fit in memory.

    +     - Typically n is chosen as ⌈bₛ/M⌉ * f where f is a “fudge factor”, typically
    around 1.2

    +     - The probe relation partitions *sⱼ* need not fit in memory

    +   - **Recursive partitioning** required if number of partitions *n* is greater
    than number of pages *M* of memory.

    +     - instead of partitioning *n* ways, use *M − 1* partitions for s

    +     - Further partition the *M − 1* partitions using a different hash function

    +     - Use same partitioning method on *r*

    +     - Rarely required: e.g., with block size of 4 KB, recursive partitioning
    not needed for relations of < 1GB with memory size of 2MB, or relations of < 36
    GB with memory of 12 MB'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Handling of Overflows


    +   - Partitioning is said to be **skewed** if some partitions have significantly
    more tuples than some others

    +   - **Hash-table overflow** occurs in partition sᵢ if sᵢ does not fit in memory.
    Reasons could be

    +     - Many tuples in s with same value for join attributes

    +     - Bad hash function

    +   - **Overflow resolution** can be done in build phase

    +     - Partition sᵢ is further partitioned using different hash function.

    +     - Partition rᵢ must be similarly partitioned.

    +   - **Overflow avoidance** performs partitioning carefully to avoid overflows
    during build phase

    +     - E.g. partition build relation into many partitions, then combine them

    +   - Both approaches fail with large numbers of duplicates

    +     - Fallback option: use block nested loops join on overflowed partitions


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_614_0.png)'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# Cost of Hash-Join


    +   If recursive partitioning is not required: cost of hash join is 3(b_r + b_s)
    +4 * n_h block transfers + 2(⌈b_r / b_b⌉ + ⌈b_s / b_b⌉) seeks


    +   If recursive partitioning required:


    +   number of passes required for partitioning build relation s to less than M
    blocks per partition is ⌈log_{⌊M/b_b⌋-1}(b_s / M)⌉


    +   best to choose the smaller relation as the build relation.


    +   Total cost estimate is: 2(b_r + b_s)⌈log_{⌊M/b_b⌋-1}(b_s / M)⌉ + b_r + b_s
    block transfers + 2(⌈b_r / b_b⌉ + ⌈b_s / b_b⌉)⌈log_{⌊M/b_b⌋-1}(b_s / M)⌉ seeks


    +   If the entire build input can be kept in main memory no partitioning is required


    +   Cost estimate goes down to b_r + b_s.'
  merge: -1
  img_proc: true
- pgno: 616
  md: '# Example of Cost of Hash-Join


    *instructor* ⋈ *teaches*


    +   - Assume that memory size is 20 blocks

    +   - $b_{instructor}=100$ and $b_{teaches}=400$.

    +   - *instructor* is to be used as build input. Partition it into five partitions,
    each of size 20 blocks. This partitioning can be done in one pass.

    +   - Similarly, partition *teaches* into five partitions, each of size 80. This
    is also done in one pass.

    +   - Therefore total cost, ignoring cost of writing partially filled blocks:

    +     - $3(100 + 400) = 1500$ block transfers + $2(\lceil 100/3 \rceil + \lceil
    400/3 \rceil) = 336$ seeks'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# Hybrid Hash–Join


    +   - Useful when memory sized are relatively large, and the build input is bigger
    than memory.

    +   - **Main feature of hybrid hash join:**

    +     **Keep the first partition of the build relation in memory.**

    +   - E.g. With memory size of 25 blocks, *instructor* can be partitioned into
    five partitions, each of size 20 blocks.

    +     - Division of memory:

    +       - The first partition occupies 20 blocks of memory

    +       - 1 block is used for input, and 1 block each for buffering the other
    4 partitions.

    +   - *teaches* is similarly partitioned into five partitions each of size 80

    +     - the first is used right away for probing, instead of being written out

    +   - Cost of 3(80 + 320) + 20 +80 = 1300 block transfers for hybrid hash join,
    instead of 1500 with plain hash-join.

    +   - Hybrid hash-join most useful if $M >> \sqrt{b_s}$'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# Complex Joins


    +   Join with a conjunctive condition:


    r ⋈ θ1 ∧ θ2 ∧ ... ∧ θn s


    +   Either use nested loops/block nested loops, or


    +   Compute the result of one of the simpler joins r ⋈ θi s


    +   final result comprises those tuples in the intermediate result that satisfy
    the remaining conditions


    θ1 ∧ ... ∧ θi-1 ∧ θi+1 ∧ ... ∧ θn


    +   Join with a disjunctive condition


    r ⋈ θ1 ∨ θ2 ∨ ... ∨ θn s


    +   Either use nested loops/block nested loops, or


    +   Compute as the union of the records in individual joins r ⋈ θi s:


    (r ⋈ θ1 s) ∪ (r ⋈ θ2 s) ∪ ... ∪ (r ⋈ θn s)'
  merge: -1
  img_proc: true
- pgno: 619
  md: '# Other Operations


    +   - **Duplicate elimination** can be implemented via hashing or sorting.

    +     - On sorting duplicates will come adjacent to each other, and all but one
    set of duplicates can be deleted.

    +     - *Optimization:* duplicates can be deleted during run generation as well
    as at intermediate merge steps in external sort-merge.

    +     - Hashing is similar – duplicates will come into the same bucket.

    +   - **Projection**:

    +     - perform projection on each tuple

    +     - followed by duplicate elimination.'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# Other Operations : Aggregation


    +   - **Aggregation** can be implemented in a manner similar to duplicate elimination.

    +     - Sorting or hashing can be used to bring tuples in the same group together,
    and then the aggregate functions can be applied on each group.

    +     - *Optimization:* combine tuples in the same group during run generation
    and intermediate merges, by computing partial aggregate values

    +       - For count, min, max, sum: keep aggregate values on tuples found so far
    in the group.

    +         - When combining partial aggregate for count, add up the aggregates

    +       - For avg, keep sum and count, and divide sum by count at the end'
  merge: -1
  img_proc: true
- pgno: 621
  md: '# Other Operations : Set Operations


    +   - **Set operations** (∪, ∩ and —): can either use variant of merge-join after
    sorting, or variant of hash-join.

    +   - E.g., Set operations using hashing:

    +     1. Partition both relations using the same hash function

    +     2. Process each partition *i* as follows.

    +        1. Using a different hashing function, build an in-memory hash index
    on *rᵢ*.

    +        2. Process *sᵢ* as follows

    +           - *r* ∪ *s*:

    +             1. Add tuples in *sᵢ* to the hash index if they are not already
    in it.

    +             2. At end of *sᵢ* add the tuples in the hash index to the result.'
  merge: -1
  img_proc: true
- pgno: 622
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 623
  md: '# Other Operations : Outer Join


    +   - **Outer join** can be computed either as

    +     - A join followed by addition of null-padded non-participating tuples.

    +     - by modifying the join algorithms.

    +   - Modifying merge join to compute r ⟕ s

    +     - In r ⟕ s, non participating tuples are those in r − Π_R(r ⋈ s)

    +     - Modify merge-join to compute r ⟕ s:

    +       - During merging, for every tuple t_r from r that do not match any tuple
    in s, output t_r padded with nulls.

    +     - Right outer-join and full outer-join can be computed similarly.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_623_0.png)'
  merge: -1
  img_proc: true
- pgno: 624
  md: '# Other Operations : Outer Join


    +   - Modifying hash join to compute r ⟕ s

    +     - If r is probe relation, output non-matching r tuples padded with nulls

    +     - If r is build relation, when probing keep track of which r tuples matched
    s tuples. At end of s_i output non-matched r tuples padded with nulls'
  merge: -1
  img_proc: true
- pgno: 625
  md: '# Evaluation of Expressions


    +   - So far: we have seen algorithms for individual operations

    +   - Alternatives for evaluating an entire expression tree

    +     - **Materialization**: generate results of an expression whose inputs are
    relations or are already computed, **materialize** (store) it on disk. Repeat.

    +     - **Pipelining**: pass on tuples to parent operations even as an operation
    is being executed

    +   - We study above alternatives in more detail'
  merge: -1
  img_proc: true
- pgno: 626
  md: "# Materialization\n\n+   - **Materialized evaluation:** evaluate one operation\
    \ at a time, starting at the lowest-level. Use intermediate results materialized\
    \ into temporary relations to evaluate next-level operations.\n+   - E.g., in\
    \ figure below, compute and store\n+   \n+     σ_building=\"Watson\"(department)\n\
    +   \n+     then compute the store its join with instructor, and finally compute\
    \ the projection on name.\n\n![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_626_0.png)"
  merge: -1
  img_proc: true
- pgno: 627
  md: '# Materialization (Cont.)


    +   - Materialized evaluation is always applicable

    +   - Cost of writing results to disk and reading them back can be quite high

    +     - Our cost formulas for operations ignore cost of writing results to disk,
    so

    +       - Overall cost = Sum of costs of individual operations + cost of writing
    intermediate results to disk

    +   - Double buffering: use two output buffers for each operation, when one is
    full write it to disk while the other is getting filled

    +     - Allows overlap of disk writes with computation and reduces execution time'
  merge: -1
  img_proc: true
- pgno: 628
  md: "# Pipelining\n\n+   - **Pipelined evaluation** : evaluate several operations\
    \ simultaneously, passing the results of one operation on to the next.\n\n+  \
    \ - E.g., in previous expression tree, don’t store result of\n+   \n+     σ_building=\"\
    Watson\" (department)\n\n+   - instead, pass tuples directly to the join.. Similarly,\
    \ don’t store result of join, pass tuples directly to projection.\n\n+   - Much\
    \ cheaper than materialization: no need to store a temporary relation to disk.\n\
    \n+   - Pipelining may not always be possible – e.g., sort, hash-join.\n\n+  \
    \ - For pipelining to be effective, use evaluation algorithms that generate output\
    \ tuples even as tuples are received for inputs to the operation.\n\n+   - Pipelines\
    \ can be executed in two ways: **demand driven** and **producer driven**"
  merge: -1
  img_proc: true
- pgno: 629
  md: '# Pipelining (Cont.)


    +   - In **demand driven** or **lazy evaluation**

    +     - system repeatedly requests next tuple from top level operation

    +     - Each operation requests next tuple from children operations as required,
    in order to output its next tuple

    +     - In between calls, operation has to maintain “**state**” so it knows what
    to return next

    +   - In **producer-driven** or **eager** pipelining

    +     - Operators produce tuples eagerly and pass them up to their parents

    +       - Buffer maintained between operators, child puts tuples in buffer, parent
    removes tuples from buffer

    +       - if buffer is full, child waits till there is space in the buffer, and
    then generates more tuples

    +     - System schedules operations that have space in output buffer and can process
    more input tuples

    +   - Alternative name: **pull** and **push** models of pipelining'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# Pipelining (Cont.)


    +   Implementation of demand-driven pipelining

    +   Each operation is implemented as an iterator implementing the following operations

    +   open()

    +   E.g. file scan: initialize file scan

    +   state: pointer to beginning of file

    +   E.g. merge join: sort relations;

    +   state: pointers to beginning of sorted relations

    +   next()

    +   E.g. for file scan: Output next tuple, and advance and store file pointer

    +   E.g. for merge join: continue with merge from earlier state till next output
    tuple is found. Save pointers as iterator state.

    +   close()'
  merge: -1
  img_proc: true
- pgno: 631
  md: '# Evaluation Algorithms for Pipelining


    +   - Some algorithms are not able to output results even as they get input tuples

    +     - E.g. merge join, or hash join

    +     - intermediate results written to disk and then read back

    +   - Algorithm variants to generate (at least some) results on the fly, as input
    tuples are read in

    +     - E.g. hybrid hash join generates output tuples even as probe relation tuples
    in the in-memory partition (partition 0) are read in

    +     - **Double-pipelined join technique**: Hybrid hash join, modified to buffer
    partition 0 tuples of both relations in-memory, reading them as they become available,
    and output results of any matches between partition 0 tuples

    +       - When a new r₀ tuple is found, match it with existing s₀ tuples, output
    matches, and save it in r₀

    +       - Symmetrically for s₀ tuples'
  merge: -1
  img_proc: true
