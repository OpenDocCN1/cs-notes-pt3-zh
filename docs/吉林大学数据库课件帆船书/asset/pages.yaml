- pgno: 641
  md: '# Transformation of Relational Expressions


    +   - Two relational algebra expressions are said to be **equivalent** if the
    two expressions generate the same set of tuples on every *legal* database instance

    +     - Note: order of tuples is irrelevant

    +     - we don’t care if they generate different results on databases that violate
    integrity constraints

    +   - In SQL, inputs and outputs are multisets of tuples

    +     - Two expressions in the multiset version of the relational algebra are
    said to be equivalent if the two expressions generate the same multiset of tuples
    on every legal database instance.

    +   - An **equivalence rule** says that expressions of two forms are equivalent

    +     - Can replace expression of first form by second, or vice versa'
  merge: -1
  img_proc: true
- pgno: 642
  md: "# Equivalence Rules\n\n+   1. Conjunctive selection operations can be deconstructed\
    \ into a sequence of individual selections.\n+   \n+   σ_{θ1 ∧ θ2}(E) = σ_{θ1}(σ_{θ2}(E))\n\
    +   2. Selection operations are commutative.\n+   \n+   σ_{θ1}(σ_{θ2}(E)) = σ_{θ2}(σ_{θ1}(E))\n\
    +   3. Only the last in a sequence of projection operations is needed, the others\
    \ can be omitted.\n+   \n+   Π_{L1}(Π_{L2}(...(Π_{Ln}(E))...)) = Π_{L1}(E)\n+\
    \   4. Selections can be combined with Cartesian products and theta joins.\n+\
    \   \n+   a. σ_θ(E1 X E2) = E1 ⋈_θ E2\n+   b. σ_{θ1}(E1 ⋈_{θ2} E2) = E1 ⋈_{θ1\
    \ ∧ θ2} E2"
  merge: -1
  img_proc: true
- pgno: 643
  md: '# Equivalence Rules (Cont.)


    +   5. Theta-join operations (and natural joins) are commutative.

    +   $E_1 \bowtie_{\theta} E_2 = E_2 \bowtie_{\theta} E_1$


    +   6. (a) Natural join operations are associative:

    +   $(E_1 \bowtie E_2) \bowtie E_3 = E_1 \bowtie (E_2 \bowtie E_3)$


    +   (b) Theta joins are associative in the following manner:

    +   $(E_1 \bowtie_{\theta1} E_2) \bowtie_{\theta2 \wedge \theta3} E_3 = E_1 \bowtie_{\theta1
    \wedge \theta3} (E_2 \bowtie_{\theta2} E_3)$

    +   where $\theta_2$ involves attributes from only $E_2$ and $E_3$.'
  merge: -1
  img_proc: true
- pgno: 644
  md: '# Pictorial Depiction of Equivalence Rules


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_644_0.png)


    Rule 5


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_644_1.png)


    Rule 6a


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_644_2.png)


    Rule 7a


    If θ only has attributes from E1'
  merge: -1
  img_proc: true
- pgno: 645
  md: "# Equivalence Rules (Cont.)\n\n7. The selection operation distributes over\
    \ the theta join operation under the following two conditions:\n\n+   (a) When\
    \ all the attributes in θ₀ involve only the attributes of one of the expressions\
    \ (E₁) being joined.\n+   \n+   σθ₀(E₁ ⋈θ E₂) = (σθ₀(E₁)) ⋈θ E₂\n\n+   (b) When\
    \ θ₁ involves only the attributes of E₁ and θ₂ involves only the attributes of\
    \ E₂.\n+   \n+   σθ₁∧θ₂(E₁ ⋈θ E₂) = (σθ₁(E₁)) ⋈θ (σθ₂(E₂))"
  merge: -1
  img_proc: true
- pgno: 646
  md: '# Equivalence Rules (Cont.)


    8. The projection operation distributes over the theta join operation as follows:


    (a) if θ involves only attributes from L1 ∪ L2:


    Π_{L1 ∪ L2} (E1 ⋈_θ E2) = (Π_{L1} (E1)) ⋈_θ (Π_{L2} (E2))


    (b) Consider a join E1 ⋈_θ E2.


    +   - Let L1 and L2 be sets of attributes from E1 and E2, respectively.


    +   - Let L3 be attributes of E1 that are involved in join condition θ, but are
    not in L1 ∪ L2, and


    +   - let L4 be attributes of E2 that are involved in join condition θ, but are
    not in L1 ∪ L2.


    Π_{L1 ∪ L2} (E1 ⋈_θ E2) = Π_{L1 ∪ L2} ((Π_{L1 ∪ L3} (E1)) ⋈_θ (Π_{L2 ∪ L4} (E2)))'
  merge: -1
  img_proc: true
- pgno: 647
  md: '# Equivalence Rules (Cont.)


    9. The set operations union and intersection are commutative


    E₁ ∪ E₂ = E₂ ∪ E₁

    E₁ ∩ E₂ = E₂ ∩ E₁


    (set difference is not commutative).


    10. Set union and intersection are associative.


    (E₁ ∪ E₂) ∪ E₃ = E₁ ∪ (E₂ ∪ E₃)

    (E₁ ∩ E₂) ∩ E₃ = E₁ ∩ (E₂ ∩ E₃)


    11. The selection operation distributes over ∪, ∩ and −.


    σθ (E₁ − E₂) = σθ (E₁) − σθ(E₂)

    and similarly for ∪ and ∩ in place of −


    Also: σθ (E₁ − E₂) = σθ(E₁) − E₂

    and similarly for ∩ in place of −, but not for ∪


    12. The projection operation distributes over union


    ΠL(E₁ ∪ E₂) = (ΠL(E₁)) ∪ (ΠL(E₂))'
  merge: -1
  img_proc: true
