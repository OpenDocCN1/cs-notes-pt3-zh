- pgno: 408
  md: '# SQL Injection


    +   - Suppose query is constructed using

    +     - "select * from instructor where name = '''' + name + ''''"


    +   - Suppose the user, instead of entering a name, enters:

    +     - X'' or ''Y'' = ''Y


    +   - then the resulting statement becomes:

    +     - "select * from instructor where name = '''' + ''X'' or ''Y'' = ''Y'' +
    ''''"

    +     - which is:

    +       - select * from instructor where name = ''X'' or ''Y'' = ''Y''

    +     - User could have even used

    +       - X''; update instructor set salary = salary + 10000; --


    +   - Prepared statement internally uses:

    +     - "select * from instructor where name = ''X\'' or \''Y\'' = \''Y\''"


    +   - Always use prepared statements, with user inputs as parameters


    +   - Is the following prepared statemen secure?

    +     - conn.prepareStatement("select * from instructor where name = '''' + name
    + ''''")


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# CROSS SITE SCRIPTING


    +   HTML code on one page executes action on another page

    +   - E.g. <img src = http://mybank.com/transfermoney?amount=1000&toaccount=14523>

    +   - Risk: if user viewing page with above code is currently logged into mybank,
    the transfer may succeed

    +   - Above example simplistic, since GET method is normally not used for updates,
    but if the code were instead a script, it could execute POST methods


    Above vulnerability called cross-site scripting (XSS) or cross-site request forgery
    (XSRF or CSRF)


    +   Prevent your web site from being used to launch XSS or XSRF attacks

    +   - Disallow HTML tags in text input provided by users, using functions to detect
    and strip such tags


    +   Protect your web site from XSS/XSRF attacks launched from other sites

    +   - ..next slide'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# CROSS SITE SCRIPTING


    +   - **Protect your web site from XSS/XSRF attacks launched from other sites**

    +     - Use **referer** value (URL of page from where a link was clicked) provided
    by the HTTP protocol, to check that the link was followed from a valid page served
    from same site, not another site

    +     - Ensure IP of request is same as IP from where the user was authenticated

    +       - prevents hijacking of cookie by malicious user

    +     - Never use a GET method to perform any updates

    +       - This is actually recommended by HTTP standard


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_410_0.png)'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# PASSWORD LEAKAGE


    +   - Never store passwords, such as database passwords, in clear text in scripts
    that may be accessible to users

    +     - E.g. in files in a directory accessible to a web server

    +       - Normally, web server will execute, but not provide source of script
    files such as file.jsp or file.php, but source of editor backup files such as
    file.jsp~ or .file.jsp.swp may be served


    +   - Restrict access to database server from IPs of machines running application
    servers

    +     - Most databases allow restriction of access by source IP address'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# APPLICATION AUTHENTICATION


    +   - Single factor authentication such as passwords too risky for critical applications

    +     - guessing of passwords, sniffing of packets if passwords are not encrypted

    +     - passwords reused by user across sites

    +     - spyware which captures password

    +   - Two-factor authentication

    +     - e.g. password plus one-time password sent by SMS

    +     - e.g. password plus one-time password devices

    +       - device generates a new pseudo-random number every minute, and displays
    to user

    +       - user enters the current number as password

    +       - application server generates same sequence of pseudo-random numbers
    to check that the number is correct.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# APPLICATION AUTHENTICATION


    +   - **Man-in-the-middle** attack

    +     - E.g. web site that pretends to be mybank.com, and passes on requests from
    user to mybank.com, and passes results back to user

    +     - Even two-factor authentication cannot prevent such attacks

    +   - Solution: authenticate Web site to user, using digital certificates, along
    with secure http protocol

    +   - **Central authentication** within an organization

    +     - application redirects to central authentication service for authentication

    +     - avoids multiplicity of sites having access to user’s password

    +     - LDAP or Active Directory used for authentication'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# SINGLE SIGN-ON


    +   - **Single sign-on** allows user to be authenticated once, and applications
    can communicate with authentication service to verify user’s identity without
    repeatedly entering passwords

    +   - **Security Assertion Markup Language (SAML)** standard for exchanging authentication
    and authorization information across security domains

    +     - e.g. user from Yale signs on to external application such as acm.org using
    userid joe@yale.edu

    +     - application communicates with Web-based authentication service at Yale
    to authenticate user, and find what the user is authorized to do by Yale (e.g.
    access certain journals)

    +   - **OpenID** standard allows sharing of authentication across organizations

    +     - e.g. application allows user to choose Yahoo! as OpenID authentication
    provider, and redirects user to Yahoo! for authentication'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# # APPLICATION-LEVEL AUTHORIZATION


    +   - Current SQL standard does not allow fine-grained authorization such as “students
    can see their own grades, but not other’s grades”

    +     - Problem 1: Database has no idea who are application users

    +     - Problem 2: SQL authorization is at the level of tables, or columns of
    tables, but not to specific rows of a table


    +   - One workaround: use views such as


    ```

    create view studentTakes as

    select *

    from takes

    where takes.ID = syscontext.user_id()

    ```


    +   - where syscontext.user_id() provides end user identity

    +     - end user identity must be provided to the database by the application

    +   - Having multiple such views is cumbersome'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# APPLICATION-LEVEL AUTHORIZATION (CONT.)


    +   - Currently, authorization is done entirely in application

    +   - Entire application code has access to entire database

    +     - large surface area, making protection harder

    +   - Alternative: **fine-grained (row-level) authorization** schemes

    +     - extensions to SQL authorization proposed but not currently implemented

    +     - Oracle Virtual Private Database (VPD) allows predicates to be added transparently
    to all SQL queries, to enforce fine-grained authorization

    +       - e.g. add *ID= sys_context.user_id()* to all queries on student relation
    if user is a student'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# AUDIT TRAILS


    +   - Applications must log actions to an audit trail, to detect who carried out
    an update, or accessed some sensitive data

    +   - Audit trails used after-the-fact to

    +     - detect security breaches

    +     - repair damage caused by security breach

    +     - trace who carried out the breach

    +   - Audit trails needed at

    +     - Database level, and at

    +     - Application level'
  merge: -1
  img_proc: true
