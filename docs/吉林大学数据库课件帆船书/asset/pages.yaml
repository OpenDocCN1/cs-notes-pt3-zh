- pgno: 574
  md: '# Grid Files


    +   - Structure used to speed the processing of general multiple search-key queries
    involving one or more comparison operators.

    +   - The grid file has a single grid array and one linear scale for each search-key
    attribute. The grid array has number of dimensions equal to number of search-key
    attributes.

    +   - Multiple cells of grid array can point to same bucket

    +   - To find the bucket for a search-key value, locate the row and column of
    its cell using the linear scales and follow pointer'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# Example Grid File for account


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_575_0.png)'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# Queries on a Grid File


    A grid file on two attributes A and B can handle queries of all following forms
    with reasonable efficiency


    +   - $(a_1 \le A \le a_2)$

    +   - $(b_1 \le B \le b_2)$

    +   - $(a_1 \le A \le a_2 \land \ b_1 \le B \le b_2)$.


    E.g., to answer $(a_1 \le A \le a_2 \land \ b_1 \le B \le b_2)$, use linear scales
    to find corresponding candidate grid array cells, and look up all the buckets
    pointed to from those cells.'
  merge: -1
  img_proc: true
- pgno: 577
  md: '# Grid Files (Cont.)


    +   - During insertion, if a bucket becomes full, new bucket can be created if
    more than one cell points to it.

    +     - Idea similar to extendable hashing, but on multiple dimensions

    +     - If only one cell points to it, either an overflow bucket must be created
    or the grid size must be increased

    +   - Linear scales must be chosen to uniformly distribute records across cells.

    +     - Otherwise there will be too many overflow buckets.

    +   - Periodic re-organization to increase grid size will help.

    +     - But reorganization can be very expensive.

    +   - Space overhead of grid array can be high.

    +   - R-trees (Chapter 23) are an alternative'
  merge: -1
  img_proc: true
