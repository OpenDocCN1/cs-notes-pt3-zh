- pgno: 782
  md: '# Recoverability and Cascade Freedom


    +   - Problem with timestamp-ordering protocol:

    +     - Suppose $T_i$ aborts, but $T_j$ has read a data item written by $T_i$

    +     - Then $T_j$ must abort; if $T_j$ had been allowed to commit earlier, the
    schedule is not recoverable.

    +     - Further, any transaction that has read a data item written by $T_j$ must
    abort

    +     - This can lead to cascading rollback --- that is, a chain of rollbacks

    +   - Solution 1:

    +     - A transaction is structured such that its writes are all performed at
    the end of its processing

    +     - All writes of a transaction form an atomic action; no transaction may
    execute while a transaction is being written

    +     - A transaction that aborts is restarted with a new timestamp

    +   - Solution 2: Limited form of locking: wait for data to be committed before
    reading it

    +   - Solution 3: Use commit dependencies to ensure recoverability'
  merge: -1
  img_proc: true
- pgno: 783
  md: '# Thomas'' Write Rule


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_783_0.png)


    +   Modified version of the timestamp-ordering protocol in which obsolete write
    operations may be ignored under certain circumstances.


    +   When Ti attempts to write data item Q, if TS(Ti) < W-timestamp(Q), then Ti
    is attempting to write an obsolete value of {Q}.


    +   Rather than rolling back Ti as the timestamp ordering protocol would have
    done, this {write} operation can be ignored.


    +   Otherwise this protocol is the same as the timestamp ordering protocol.


    +   Thomas'' Write Rule allows greater potential concurrency.


    +   Allows some view-serializable schedules that are not conflict-serializable.'
  merge: -1
  img_proc: true
- pgno: 784
  md: '# Validation-Based Protocol


    +   Execution of transaction T_i is done in three phases.


    +   1. **Read and execution phase**: Transaction T_i writes only to temporary
    local variables


    +   2. **Validation phase**: Transaction T_i performs a "validation test" to determine
    if local variables can be written without violating serializability.


    +   3. **Write phase**: If T_i is validated, the updates are applied to the database;
    otherwise, T_i is rolled back.


    +   The three phases of concurrently executing transactions can be interleaved,
    but each transaction must go through the three phases in that order.


    +   Assume for simplicity that the validation and write phase occur together,
    atomically and serially


    +   I.e., only one transaction executes validation/write at a time.


    +   Also called as **optimistic concurrency control** since transaction executes
    fully in the hope that all will go well during validation'
  merge: -1
  img_proc: true
- pgno: 785
  md: '# Validation-Based Protocol (Cont.)


    +   - Each transaction Tᵢ has 3 timestamps

    +     - Start(Tᵢ) : the time when Tᵢ started its execution

    +     - Validation(Tᵢ): the time when Tᵢ entered its validation phase

    +     - Finish(Tᵢ) : the time when Tᵢ finished its write phase

    +   - Serializability order is determined by timestamp given at validation time;
    this is done to increase concurrency.

    +     - Thus, TS(Tᵢ) is given the value of Validation(Tᵢ).

    +   - This protocol is useful and gives greater degree of concurrency if probability
    of conflicts is low.

    +     - because the serializability order is not pre-decided, and

    +     - relatively few transactions will have to be rolled back.'
  merge: -1
  img_proc: true
- pgno: 786
  md: '# Validation Test for Transaction Tj


    If for all T_i with TS (T_i) < TS (T_j) either one of the following condition
    holds:


    +   - finish(T_i) < start(T_j)

    +   - start(T_j) < finish(T_i) < validation(T_i) and the set of data items written
    by T_i does not intersect with the set of data items read by T_j.


    then validation succeeds and T_j can be committed. Otherwise, validation fails
    and T_j is aborted.


    Justification: Either the first condition is satisfied, and there is no overlapped
    execution, or the second condition is satisfied and


    +   - the writes of T_i do not affect reads of T_j since they occur after T_j
    has finished its reads.

    +   - the writes of T_i do not affect reads of T_j since T_j does not read any
    item written by T_i.'
  merge: -1
  img_proc: true
