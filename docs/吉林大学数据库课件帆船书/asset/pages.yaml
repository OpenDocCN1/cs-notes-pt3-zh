- pgno: 78
  md: '# Duplicates


    +   - In relations with duplicates, SQL can define how many copies of tuples appear
    in the result.

    +   - **Multiset** versions of some of the relational algebra operators – given
    multiset relations $r_1$ and $r_2$:

    +     1. **σ_θ(r₁)**: If there are $c_1$ copies of tuple $t_1$ in $r_1$, and $t_1$
    satisfies selections σ_θ, then there are $c_1$ copies of $t_1$ in σ_θ(r₁).

    +     2. **Π_A(r)**: For each copy of tuple $t_1$ in $r_1$, there is a copy of
    tuple Π_A(t₁) in Π_A(r₁) where Π_A(t₁) denotes the projection of the single tuple
    t₁.

    +     3. **r₁ x r₂**: If there are $c_1$ copies of tuple $t_1$ in $r_1$ and $c_2$
    copies of tuple $t_2$ in $r_2$, there are $c_1$ x $c_2$ copies of the tuple $t_1$.
    $t_2$ in $r_1$ x $r_2$'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# Duplicates (Cont.)\n\n+   - Example: Suppose multiset relations $r_1$ (A,\
    \ B) and $r_2$ (C) are as follows:\n+   \n+     $r_1 = \\{(1, a)\\ (2,a)\\}$ \
    \     $r_2 = \\{(2), (3), (3)\\}$\n\n+   - Then $\\Pi_B(r_1)$ would be $\\{(a),\
    \ (a)\\}$, while $\\Pi_B(r_1) \\times r_2$ would be $\\{(a,2), (a,2), (a,3), (a,3),\
    \ (a,3), (a,3)\\}$\n\n+   - SQL duplicate semantics:\n+   \n+     **select** $A_1,\
    \ A_2, ..., A_n$\n+     **from** $r_1, r_2, ..., r_m$\n+     **where** $P$\n+\
    \   \n+     is equivalent to the *multiset* version of the expression:\n+   \n\
    +     $\\Pi_{A_1,A_2,...,A_n}(\\sigma_P(r_1 \\times r_2 \\times ... \\times r_m))$"
  merge: -1
  img_proc: true
