- pgno: 391
  md: '# Client Side Scripting


    +   - Browsers can fetch certain scripts (client-side scripts) or programs along
    with documents, and execute them in “safe mode” at the client site

    +     - Javascript

    +     - Macromedia Flash and Shockwave for animation/games

    +     - VRML

    +     - Applets


    +   - Client-side scripts/programs allow documents to be active

    +     - E.g., animation by executing programs at the local site

    +     - E.g., ensure that values entered by users satisfy some correctness checks

    +     - Permit flexible interaction with the user.

    +       - Executing programs at the client site speeds up interaction by avoiding
    many round trips to server'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Client Side Scripting and Security


    +   - Security mechanisms needed to ensure that malicious scripts do not cause
    damage to the client machine

    +     - Easy for limited capability scripting languages, harder for general purpose
    programming languages like Java


    +   - E.g., Java’s security system ensures that the Java applet code does not
    make any system calls directly

    +     - Disallows dangerous actions such as file writes

    +     - Notifies the user about potentially dangerous actions, and allows the
    option to abort the program or to continue execution.'
  merge: -1
  img_proc: true
