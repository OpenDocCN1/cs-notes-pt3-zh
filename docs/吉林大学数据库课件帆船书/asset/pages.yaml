- pgno: 4
  md: '# Drawbacks of using file systems to store data


    +   - Data redundancy and inconsistency

    +     - Multiple file formats, duplication of information in different files

    +   - Difficulty in accessing data

    +     - Need to write a new program to carry out each new task

    +   - Data isolation

    +     - Multiple files and formats

    +   - Integrity problems

    +     - Integrity constraints (e.g., account balance > 0) become “buried” in program
    code rather than being stated explicitly

    +     - Hard to add new constraints or change existing ones'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Drawbacks of using file systems to store data (Cont.)


    +   - Atomicity of updates

    +     - Failures may leave database in an inconsistent state with partial updates
    carried out

    +     - Example: Transfer of funds from one account to another should either complete
    or not happen at all

    +   - Concurrent access by multiple users

    +     - Concurrent access needed for performance

    +     - Uncontrolled concurrent accesses can lead to inconsistencies

    +       - Example: Two people reading a balance (say 100) and updating it by withdrawing
    money (say 50 each) at the same time

    +   - Security problems

    +     - Hard to provide user access to some, but not all, data


    # Database systems offer solutions to all the above problems'
  merge: -1
  img_proc: true
