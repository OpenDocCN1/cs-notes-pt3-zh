- pgno: 670
  md: "# Statistical Information for Cost Estimation\n\n+   - $n_r$: number of tuples\
    \ in a relation $r$.\n+   - $b_r$: number of blocks containing tuples of $r$.\n\
    +   - $l_r$: size of a tuple of $r$.\n+   - $f_r$: blocking factor of $r$ — i.e.,\
    \ the number of tuples of $r$ that fit into one block.\n+   - $V(A, r)$: number\
    \ of distinct values that appear in $r$ for attribute $A$; same as the size of\
    \ $\\Pi_A(r)$.\n+   - If tuples of $r$ are stored together physically in a file,\
    \ then:\n+   \n+     $b_r = \\left\\lceil \\frac{n_r}{f_r} \\right\\rceil$"
