  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_83_0.png)


    # Null Values


    +   - It is possible for tuples to have a null value, denoted by *null*, for some
    of their attributes

    +   - *null* signifies an unknown value or that a value does not exist.

    +   - The result of any arithmetic expression involving *null* is *null*

    +     - Example: 5 + null returns null

    +   - The predicate **is null** can be used to check for null values.

    +     - Example: Find all instructors whose salary is null.

    +       ```sql

    +       select name

    +       from instructor

    +       where salary is null

    +       ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Null Values and Three Valued Logic


    +   - Three values – *true*, *false*, *unknown*

    +   - Any comparison with *null* returns *unknown*

    +     - Example: 5 < *null* or *null* <> *null* or *null* = *null*

    +   - Three-valued logic using the value *unknown*:

    +     - OR: (*unknown* or *true*) = *true*, (*unknown* or *false*) = *unknown*,
    (*unknown* or *unknown*) = *unknown*

    +     - AND: (*true* and *unknown*) = *unknown*, (*false* and *unknown*) = *false*,
    (*unknown* and *unknown*) = *unknown*

    +     - NOT: (*not unknown*) = *unknown*

    +     - “*P* is unknown” evaluates to true if predicate *P* evaluates to *unknown*

    +   - Result of **where** clause predicate is treated as *false* if it evaluates
    to *unknown*'
  merge: -1
  img_proc: true
