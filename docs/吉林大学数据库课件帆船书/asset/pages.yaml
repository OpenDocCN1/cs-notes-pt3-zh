- pgno: 202
  md: '# Table Functions


    +   SQL:2003 added functions that return a relation as a result


    +   Example: Return all instructors in a given department

    +   **create function** *instructor_of* (*dept_name* **char**(20))

    +   **returns table** (

    +   *ID* **varchar**(5),

    +   *name* **varchar**(20),

    +   *dept_name* **varchar**(20),

    +   *salary* **numeric**(8,2))

    +   **return table**

    +   (*select ID, name, dept_name, salary*

    +   **from** *instructor*

    +   **where** *instructor.dept_name = instructor_of.dept_name*)


    +   Usage

    +   **select ***

    +   **from table** (*instructor_of* ( ‘Music’ ))'
  merge: -1
  img_proc: true
- pgno: 203
  md: "# SQL Procedures\n\n+   The *dept_count* function could instead be written\
    \ as procedure:\n+   \n+   ```sql\n+   create procedure dept_count_proc (in dept_name\
    \ varchar(20),\n+       out d_count integer)\n+   begin\n+       select count(*)\
    \ into d_count\n+       from instructor\n+       where instructor.dept_name =\
    \ dept_count_proc.dept_name\n+   end\n+   ```\n\n+   Procedures can be invoked\
    \ either from an SQL procedure or from embedded SQL, using the **call** statement.\n\
    +   \n+   ```sql\n+   declare d_count integer;\n+   call dept_count_proc('Physics',\
    \ d_count);\n+   ```\n+   Procedures and functions can be invoked also from dynamic\
    \ SQL\n\n+   SQL:1999 allows more than one function/procedure of the same name\
    \ (called name **overloading**), as long as the number of arguments differ, or\
    \ at least the types of the arguments differ"
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Language Constructs for Procedures & Functions


    +   - SQL supports constructs that gives it almost all the power of a general-purpose
    programming language.

    +     - Warning: most database systems implement their own variant of the standard
    syntax below.

    +   - Compound statement: **begin ... end**,

    +     - May contain multiple SQL statements between **begin** and **end**.

    +     - Local variables can be declared within a compound statements

    +   - **While** and **repeat** statements:

    +     - **while** *boolean expression* **do**

    +       *sequence of statements* ;

    +       **end while**

    +     - **repeat**

    +       *sequence of statements* ;

    +       **until** *boolean expression*

    +       **end repeat**'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Language Constructs (Cont.)\n\n+   - **For loop**\n+     - Permits iteration\
    \ over all results of a query\n+   - Example: Find the budget of all departments\n\
    \n```\ndeclare n integer default 0;\nfor r as\n  select budget from department\n\
    do\n    set n = n + r.budget\nend for\n```"
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Language Constructs (Cont.)


    +   - Conditional statements (if-then-else)

    +     SQL:1999 also supports a case statement similar to C case statement

    +   - Example procedure: registers student after ensuring classroom capacity is
    not exceeded

    +     - Returns 0 on success and -1 if capacity is exceeded

    +     - See book (page 177) for details

    +   - Signaling of exception conditions, and declaring handlers for exceptions

    +     declare out_of_classroom_seats condition

    +     declare exit handler for out_of_classroom_seats

    +     begin

    +     ...

    +     .. signal out_of_classroom_seats

    +     end

    +     - The handler here is exit -- causes enclosing begin..end to be exited

    +     - Other actions possible on exception'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# External Language Routines\n\n+   SQL:1999 permits the use of functions and\
    \ procedures written in other languages such as C or C++\n\n+   Declaring external\
    \ language procedures and functions\n\n```\ncreate procedure dept_count_proc(in\
    \ dept_name varchar(20),\n    out count integer)\nlanguage C\nexternal name '/usr/avi/bin/dept_count_proc'\n\
    ```\n\n```\ncreate function dept_count(dept_name varchar(20))\nreturns integer\n\
    language C\nexternal name '/usr/avi/bin/dept_count'\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "# External Language Routines\n\n+   - SQL:1999 allows the definition of procedures\
    \ in an imperative programming language, (Java, C#, C or C++) which can be invoked\
    \ from SQL queries.\n+   - Functions defined in this fashion can be more efficient\
    \ than functions defined in SQL, and computations that cannot be carried out in\
    \ SQL can be executed by these functions.\n+   - Declaring external language procedures\
    \ and functions\n\n```\ncreate procedure dept_count_proc(in dept_name varchar(20),\n\
    \    out count integer)\nlanguage C\nexternal name '/usr/avi/bin/dept_count_proc'\n\
    ```\n\n```\ncreate function dept_count(dept_name varchar(20))\nreturns integer\n\
    language C\nexternal name '/usr/avi/bin/dept_count'\n```"
  merge: -1
  img_proc: true
- pgno: 209
  md: '# External Language Routines (Cont.)


    +   - Benefits of external language functions/procedures:

    +     - more efficient for many operations, and more expressive power.

    +   - Drawbacks

    +     - Code to implement function may need to be loaded into database system
    and executed in the database system’s address space.

    +       - risk of accidental corruption of database structures

    +       - security risk, allowing users access to unauthorized data

    +     - There are alternatives, which give good security at the cost of potentially
    worse performance.

    +     - Direct execution in the database system’s space is used when efficiency
    is more important than security.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Security with External Language Routines


    +   - To deal with security problems, we can do on of the following:

    +     - Use **sandbox** techniques

    +       - That is, use a safe language like Java, which cannot be used to access/damage
    other parts of the database code.

    +     - Run external language functions/procedures in a separate process, with
    no access to the database process’ memory.

    +       - Parameters and results communicated via inter-process communication

    +   - Both have performance overheads

    +   - Many database systems support both above approaches as well as direct executing
    in database system address space.'
  merge: -1
  img_proc: true
