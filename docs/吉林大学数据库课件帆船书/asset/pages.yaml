- pgno: 816
  md: '# Failure Classification


    +   - **Transaction failure** :

    +     - **Logical errors**: transaction cannot complete due to some internal error
    condition

    +     - **System errors**: the database system must terminate an active transaction
    due to an error condition (e.g., deadlock)

    +   - **System crash**: a power failure or other hardware or software failure
    causes the system to crash.

    +     - **Fail-stop assumption**: non-volatile storage contents are assumed to
    not be corrupted by system crash

    +       - Database systems have numerous integrity checks to prevent corruption
    of disk data

    +   - **Disk failure**: a head crash or similar disk failure destroys all or part
    of disk storage

    +     - Destruction is assumed to be detectable: disk drives use checksums to
    detect failures'
  merge: -1
  img_proc: true
- pgno: 817
  md: "# # Recovery Algorithms\n\n+   - Consider transaction $T_i$ that transfers\
    \ $50 from account A to account B\n+   \n+     - Two updates: subtract 50 from\
    \ A and add 50 to B\n\nTransaction $T_i$ requires updates to A and B to be output\
    \ to the database.\n\n+   - A failure may occur after one of these modifications\
    \ have been made but before both of them are made.\n+   \n+   - Modifying the\
    \ database without ensuring that the transaction will commit may leave the database\
    \ in an inconsistent state\n+   \n+   - Not modifying the database may result\
    \ in lost updates if failure occurs just after transaction commits\n\nRecovery\
    \ algorithms have two parts\n\n+   1. Actions taken during normal transaction\
    \ processing to ensure enough information exists to recover from failures\n+ \
    \  \n+   2. Actions taken after a failure to recover the database contents to\
    \ a state that ensures atomicity, consistency and durability"
  merge: -1
