- pgno: 1079
  md: '# Distributed Query Processing


    +   - For centralized systems, the primary criterion for measuring the cost of
    a particular strategy is the number of disk accesses.

    +   - In a distributed system, other issues must be taken into account:

    +     - The cost of a data transmission over the network.

    +     - The potential gain in performance from having several sites process parts
    of the query in parallel.'
  merge: -1
  img_proc: true
- pgno: 1080
  md: '# Query Transformation


    +   - Translating algebraic queries on fragments.


    +   - It must be possible to construct relation r from its fragments


    +   - Replace relation r by the expression to construct relation r from its fragments


    Consider the horizontal fragmentation of the account relation into


    ```

    account₁ = σ branch_name = "Hillside" (account)

    ```


    ```

    account₂ = σ branch_name = "Valleyview" (account)

    ```


    The query σ branch_name = "Hillside" (account) becomes


    ```

    σ branch_name = "Hillside" (account₁ ∪ account₂)

    ```


    which is optimized into


    ```

    σ branch_name = "Hillside" (account₁) ∪ σ branch_name = "Hillside" (account₂)

    ```'
  merge: -1
  img_proc: true
- pgno: 1081
  md: '# Example Query (Cont.)


    +   - Since *account*₁ has only tuples pertaining to the Hillside branch, we can
    eliminate the selection operation.

    +   - Apply the definition of *account*₂ to obtain

    +     σ<sub>branch_name = “Hillside”</sub> (σ<sub>branch_name = “Valleyview”</sub>
    (*account*))

    +   - This expression is the empty set regardless of the contents of the *account*
    relation.

    +   - Final strategy is for the Hillside site to return *account*₁ as the result
    of the query.'
  merge: -1
  img_proc: true
- pgno: 1082
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1083
  md: '# Possible Query Processing Strategies


    +   - Ship copies of all three relations to site S₁ and choose a strategy for
    processing the entire locally at site S₁.

    +   - Ship a copy of the account relation to site S₂ and compute *temp₁* = *account*
    ⋈ *depositor* at S₂. Ship *temp₁* from S₂ to S₃, and compute *temp₂* = *temp₁*
    ⋈ *branch* at S₃. Ship the result *temp₂* to S₁.

    +   - Devise similar strategies, exchanging the roles S₁, S₂, S₃

    +   - Must consider following factors:

    +     - amount of data being shipped

    +     - cost of transmitting a data block between sites

    +     - relative processing speed at each site'
  merge: -1
  img_proc: true
- pgno: 1084
  md: '# Semijoin Strategy


    +   - Let $r_1$ be a relation with schema $R_1$ stores at site $S_1$

    +     Let $r_2$ be a relation with schema $R_2$ stores at site $S_2$

    +   - Evaluate the expression $r_1 \bowtie r_2$ and obtain the result at $S_1$.

    +     1. Compute $temp_1 \leftarrow \prod_{R1 \cap R2} (r1)$ at S1.

    +   - 2. Ship $temp_1$ from $S_1$ to $S_2$.

    +   - 3. Compute $temp_2 \leftarrow r_2 \bowtie temp1$ at $S_2$

    +   - 4. Ship $temp_2$ from $S_2$ to $S_1$.

    +   - 5. Compute $r_1 \bowtie temp_2$ at $S_1$. This is the same as $r_1 \bowtie
    r_2$.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1084_0.png)'
  merge: -1
  img_proc: true
- pgno: 1085
  md: '# Formal Definition


    +   - The **semijoin** of $r_1$ with $r_2$, is denoted by:

    +     $$r_1 \ltimes r_2$$

    +   - it is defined by:

    +     $$\Pi_{R1} (r_1 \bowtie r_2)$$

    +   - Thus, $r_1 \ltimes r_2$ selects those tuples of $r_1$ that contributed to
    $r_1 \bowtie r_2$.

    +   - In step 3 above, $temp_2 = r_2 \ltimes r_1$.

    +   - For joins of several relations, the above strategy can be extended to a
    series of semijoin steps.'
  merge: -1
  img_proc: true
- pgno: 1086
  md: '# Join Strategies that Exploit Parallelism


    +   - Consider r₁ ⋈ r₂ ⋈ r₃ ⋈ r₄ where relation rᵢ is stored at site Sᵢ. The result
    must be presented at site S₁.


    +   - r₁ is shipped to S₂ and r₁ ⋈ r₂ is computed at S₂: simultaneously r₃ is
    shipped to S₄ and r₃ ⋈ r₄ is computed at S₄


    +   - S₂ ships tuples of (r₁ ⋈ r₂) to S₁ as they produced;

    +   S₄ ships tuples of (r₃ ⋈ r₄) to S₁


    +   - Once tuples of (r₁⋈ r₂) and (r₃⋈ r₄) arrive at S₁ (r₁⋈ r₂)⋈ (r₃ ⋈ r₄) is
    computed in parallel with the computation of (r₁ ⋈ r₂) at S₂ and the computation
    of (r₃ ⋈ r₄) at S₄.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1086_0.png)'
  merge: -1
  img_proc: true
- pgno: 1087
  md: '# Heterogeneous Distributed Databases


    +   - Many database applications require data from a variety of preexisting databases
    located in a heterogeneous collection of hardware and software platforms

    +   - Data models may differ (hierarchical, relational , etc.)

    +   - Transaction commit protocols may be incompatible

    +   - Concurrency control may be based on different techniques (locking, timestamping,
    etc.)

    +   - System-level details almost certainly are totally incompatible.

    +   - A **multidatabase system** is a software layer on top of existing database
    systems, which is designed to manipulate information in heterogeneous databases

    +     - Creates an illusion of logical database integration without any physical
    database integration'
  merge: -1
  img_proc: true
- pgno: 1088
  md: '# Advantages


    +   - Preservation of investment in existing

    +     - hardware

    +     - system software

    +     - Applications

    +   - Local autonomy and administrative control

    +   - Allows use of special-purpose DBMSs

    +   - Step towards a unified homogeneous DBMS

    +     - Full integration into a homogeneous DBMS faces

    +       - Technical difficulties and cost of conversion

    +       - Organizational/political difficulties

    +         - Organizations do not want to give up control on their data

    +         - Local databases wish to retain a great deal of autonomy


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1088_0.png)'
  merge: -1
  img_proc: true
- pgno: 1089
  md: '# # Unified View of Data


    +   - Agreement on a common data model

    +     - Typically the relational model

    +   - Agreement on a common conceptual schema

    +     - Different names for same relation/attribute

    +     - Same relation/attribute name means different things

    +   - Agreement on a single representation of shared data

    +     - E.g. data types, precision,

    +     - Character sets

    +       - ASCII vs EBCDIC

    +       - Sort order variations

    +   - Agreement on units of measure

    +   - Variations in names

    +     - E.g. Köln vs Cologne, Mumbai vs Bombay'
  merge: -1
  img_proc: true
- pgno: 1090
  md: '# # Query Processing


    +   - Several issues in query processing in a heterogeneous database


    +   - Schema translation


    +     - Write a wrapper for each data source to translate data to a global schema


    +     - Wrappers must also translate updates on global schema to updates on local
    schema


    +   - Limited query capabilities


    +     - Some data sources allow only restricted forms of selections


    +       - E.g. web forms, flat file data sources


    +     - Queries have to be broken up and processed partly at the source and partly
    at a different site


    +   - Removal of duplicate information when sites have overlapping information


    +     - Decide which sites to execute query


    +   - Global query optimization'
  merge: -1
  img_proc: true
- pgno: 1091
  md: '# Mediator Systems


    +   - **Mediator** systems are systems that integrate multiple heterogeneous data
    sources by providing an integrated global view, and providing query facilities
    on global view

    +     - Unlike full fledged multidatabase systems, mediators generally do not
    bother about transaction processing

    +     - But the terms mediator and multidatabase are sometimes used interchangeably

    +     - The term **virtual database** is also used to refer to mediator/multidatabase
    systems


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1091_0.png)'
  merge: -1
