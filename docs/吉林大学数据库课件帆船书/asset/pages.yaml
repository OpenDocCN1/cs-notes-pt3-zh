  md: "# Joined Relations\n\n+   - **Join operations** take two relations and return\
    \ as a result another relation.\n+   - These additional operations are typically\
    \ used as subquery expressions in the **from** clause\n+   - **Join condition**\
    \ – defines which tuples in the two relations match, and what attributes are present\
    \ in the result of the join.\n+   - **Join type** – defines how tuples in each\
    \ relation that do not match any tuple in the other relation (based on the join\
    \ condition) are treated.\n\n| Join types |\n|---| \n| inner join |\n| left outer\
    \ join |\n| right outer join |\n| full outer join |\n\n| Join Conditions |\n|---|\
    \ \n| natural |\n| on <predicate> |\n| using (A₁, A₁, …, Aₙ) |"
