- pgno: 1215
  md: '# User Generated Identifiers


    +   - The type of the object-identifier must be specified as part of the type
    definition of the referenced table, and

    +   - The table definition must specify that the reference is user generated

    +     ```

    +     create type Person

    +     (name varchar(20)

    +     address varchar(20))

    +     ref using varchar(20)

    +     create table people of Person

    +     ref is person_id user generated

    +     ```

    +   - When creating a tuple, we must provide a unique value for the identifier:

    +     ```

    +     insert into people (person_id, name, address) values

    +     (''01284567'', ''John'', ''23 Coyote Run'')

    +     ```

    +   - We can then use the identifier value when inserting a tuple into departments

    +     - Avoids need for a separate query to retrieve the identifier:

    +       ```

    +       insert into departments

    +       values(''CS'', ''02184567'')

    +       ```'
  merge: -1
  img_proc: true
- pgno: 1216
  md: "# User Generated Identifiers (Cont.)\n\n+   - Can use an existing primary key\
    \ value as the identifier:\n+     **create type** *Person*\n+     (*name* **varchar**\
    \ (20) **primary key**, \n+     *address* **varchar**(20))\n+     **ref from**\
    \ (*name*)\n+     **create table** *people* **of** *Person*\n+     **ref is**\
    \ *person_id* **derived**\n+   - When inserting a tuple for *departments*, we\
    \ can then use\n+     **insert into** *departments*\n+     **values**('CS','John')"
  merge: -1
  img_proc: true
- pgno: 1217
  md: '# Path Expressions


    +   - Find the names and addresses of the heads of all departments:

    +     **select** head ->name, head ->address

    +     **from** *departments*

    +   - An expression such as “head->name” is called a **path expression**

    +   - Path expressions help avoid explicit joins

    +     - If department head were not a reference, a join of *departments* with
    *people* would be required to get at the address

    +     - Makes expressing the query much easier for the user'
  merge: -1
  img_proc: true
