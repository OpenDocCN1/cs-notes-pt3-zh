- pgno: 243
  md: '# Extended Aggregation (Cont.)


    The **rollup** construct generates union on every prefix of specified list of
    attributes


    E.g.,


    ```

    select item_name, color, size, sum(number)

    from sales

    group by rollup(item_name, color, size)

    ```


    Generates union of four groupings:

    { (item_name, color, size), (item_name, color), (item_name), ( ) }


    Rollup can be used to generate aggregates at multiple levels of a hierarchy.


    E.g., suppose table itemcategory(item_name, category) gives the category of each
    item. Then


    ```

    select category, item_name, sum(number)

    from sales, itemcategory

    where sales.item_name = itemcategory.item_name

    group by rollup(category, item_name)

    ```


    would give a hierarchical summary by item_name and by category.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Extended Aggregation (Cont.)


    +   - Multiple rollups and cubes can be used in a single group by clause

    +     - Each generates set of group by lists, cross product of sets gives overall
    set of group by lists


    +   - E.g.,


    ```

    select item_name, color, size, sum(number)

    from sales

    group by rollup(item_name), rollup(color, size)

    ```


    generates the groupings


    {item_name, ()} X {(color, size), (color), ()}

    = { (item_name, color, size), (item_name, color), (item_name), (color, size),
    (color), () }'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Online Analytical Processing Operations


    +   - **Pivoting:** changing the dimensions used in a cross-tab is called

    +   - **Slicing:** creating a cross-tab for fixed values only

    +     - Sometimes called **dicing**, particularly when values for multiple dimensions
    are fixed.

    +   - **Rollup:** moving from finer-granularity data to a coarser granularity

    +   - **Drill down:** The opposite operation - that of moving from coarser-granularity
    data to finer-granularity data'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# OLAP Implementation


    +   - The earliest OLAP systems used multidimensional arrays in memory to store
    data cubes, and are referred to as **multidimensional OLAP (MOLAP)** systems.

    +   - OLAP implementations using only relational database features are called
    **relational OLAP (ROLAP)** systems

    +   - Hybrid systems, which store some summaries in memory and store the base
    data and other summaries in a relational database, are called **hybrid OLAP (HOLAP)**
    systems.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# OLAP Implementation (Cont.)


    +   - Early OLAP systems precomputed *all* possible aggregates in order to provide
    online response

    +     - Space and time requirements for doing so can be very high

    +       - 2ⁿ combinations of **group by**

    +     - It suffices to precompute some aggregates, and compute others on demand
    from one of the precomputed aggregates

    +       - Can compute aggregate on (*item_name, color*) from an aggregate on (*item_name,
    color, size*)

    +         - For all but a few “non-decomposable” aggregates such as *median*

    +         - is cheaper than computing it from scratch

    +   - Several optimizations available for computing multiple aggregates

    +     - Can compute aggregate on (*item_name, color*) from an aggregate on (*item_name,
    color, size*)

    +     - Can compute aggregates on (*item_name, color, size*), (*item_name, color*)
    and (*item_name*) using a single sorting of the base data'
  merge: -1
  img_proc: true
