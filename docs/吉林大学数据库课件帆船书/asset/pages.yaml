- pgno: 501
  md: '# Index Update: Deletion


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_501_0.png)


    If deleted record was the only record in the file with its particular search-key
    value, the search-key is deleted from the index also.


    # Single-level index entry deletion:


    +   - Dense indices – deletion of search-key is similar to file record deletion.

    +   - Sparse indices –

    +     - if an entry for the search key exists in the index, it is deleted by replacing
    the entry in the index with the next search-key value in the file (in search-key
    order).

    +     - If the next search-key value already has an index entry, the entry is
    deleted instead of being replaced.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# Index Update: Insertion


    +   Single-level index insertion:


    +   Perform a lookup using the search-key value appearing in the record to be
    inserted.


    +   Dense indices – if the search-key value does not appear in the index, insert
    it.


    +   Sparse indices – if index stores an entry for each block of the file, no change
    needs to be made to the index unless a new block is created.


    +   If a new block is created, the first search-key value appearing in the new
    block is inserted into the index.


    +   Multilevel insertion and deletion: algorithms are simple extensions of the
    single-level algorithms'
  merge: -1
  img_proc: true
