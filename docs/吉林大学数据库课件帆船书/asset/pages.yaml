- pgno: 1412
  md: '# Real-Time Transaction Systems


    +   - In systems with real-time constraints, correctness of execution involves
    both database consistency and the satisfaction of deadlines.

    +     - **Hard deadline** – Serious problems may occur if task is not completed
    within deadline

    +     - **Firm deadline** - The task has zero value if it completed after the
    deadline.

    +     - **Soft deadline** - The task has diminishing value if it is completed
    after the deadline.

    +   - The wide variance of execution times for read and write operations on disks
    complicates the transaction management problem for time-constrained systems

    +     - main-memory databases are thus often used

    +     - Waits for locks, transaction aborts, contention for resources remain as
    problems even if data is in main memory

    +   - Design of a real-time system involves ensuring that enough processing power
    exists to meet deadline without requiring excessive hardware resources.'
  merge: -1
  img_proc: true
- pgno: 1413
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1413_0.png)


    # # Long Duration Transactions


    Traditional concurrency control techniques do not work well when user interaction
    is required:


    +   - Long duration: Design edit sessions are very long

    +   - Exposure of uncommitted data: E.g., partial update to a design

    +   - Subtasks: support partial rollback

    +   - Recoverability: on crash state should be restored even for yet-to-be committed
    data, so user work is not lost.

    +   - Performance: fast response time is essential so user time is not wasted.'
  merge: -1
  img_proc: true
- pgno: 1414
  md: '# Long-Duration Transactions


    +   - Represent as a nested transaction

    +     - atomic database operations (read/write) at a lowest level.

    +   - If transaction fails, only active short-duration transactions abort.

    +   - Active long-duration transactions resume once any short duration transactions
    have recovered.

    +   - The efficient management of long-duration waits, and the possibility of
    aborts.

    +   - Need alternatives to waits and aborts; alternative techniques must ensure
    correctness without requiring serializability.'
  merge: -1
  img_proc: true
- pgno: 1415
  md: '# Concurrency Control


    +   - Correctness without serializability:

    +     - Correctness depends on the specific consistency constraints for the databases.

    +     - Correctness depends on the properties of operations performed by each
    transaction.

    +   - Use database consistency constraints as to split the database into subdatabases
    on which concurrency can be managed separately.

    +   - Treat some operations besides read and write as fundamental low-level operations
    and extend concurrency control to deal with them.'
  merge: -1
  img_proc: true
- pgno: 1416
  md: '# Concurrency Control (Cont.)


    A non-conflict-serializable schedule that preserves the sum of A + B


    | T1 | T2 |

    |---|---|

    | read(A) | |

    | A : A − 50 | |

    | write(A) | |

    | | read(B) |

    | | B : B − 10 |

    | read(B) | write(B) |

    | B : B + 50 | |

    | write(B) | |

    | | read(A) |

    | | A : A + 10 |

    | | write(A) |'
