- pgno: 1349
  md: '# Spatial Queries


    +   - **Nearness queries** request objects that lie near a specified location.

    +   - **Nearest neighbor queries**, given a point or an object, find the nearest
    object that satisfies given conditions.

    +   - **Region queries** deal with spatial regions. e.g., ask for objects that
    lie partially or fully inside a specified region.

    +   - Queries that compute intersections or **unions** of regions.

    +   - **Spatial join** of two spatial relations with the location playing the
    role of join attribute.


