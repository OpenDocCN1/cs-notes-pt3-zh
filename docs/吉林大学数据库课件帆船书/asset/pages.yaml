- pgno: 562
  md: "# # Extendable Hashing vs. Other Schemes\n\n+   **Benefits of extendable hashing:**\n\
    +   \n+   - Hash performance does not degrade with growth of file\n+   - Minimal\
    \ space overhead\n\n+   **Disadvantages of extendable hashing**\n+   \n+   - Extra\
    \ level of indirect to find desired record\n+   - Bucket address table may itself\
    \ become very big (larger than memory)\n+     - Cannot allocate very large contiguous\
    \ areas on disk either\n+     - Solution: B+-tree structure to locate desired\
    \ record in bucket address table\n+   - Changing size of bucket address table\
    \ is an expensive operation\n\n+   **Linear hashing is an alternative mechanism**\n\
    +   \n+   - Allows incremental growth of its directory (equivalent to bucket address\
    \ table)\n+   - At the cost of more bucket overflows"
  merge: -1
  img_proc: true
- pgno: 563
  md: '# Comparison of Ordered Indexing and Hashing


    +   - Cost of periodic re-organization

    +   - Relative frequency of insertions and deletions

    +   - Is it desirable to optimize average access time at the expense of worst-case
    access time?

    +   - Expected type of queries:

    +     - Hashing is generally better at retrieving records having a specified value
    of the key.

    +     - If range queries are common, ordered indices are to be preferred

    +   - In practice:

    +     - PostgreSQL supports hash indices, but discourages use due to poor performance

    +     - Oracle supports static hash organization, but not hash indices

    +     - SQLServer supports only B⁺-trees'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# Bitmap Indices


    +   - Bitmap indices are a special type of index designed for efficient querying
    on multiple keys

    +   - Records in a relation are assumed to be numbered sequentially from, say,
    0

    +     - Given a number n it must be easy to retrieve record n

    +       - Particularly easy if records are of fixed size

    +   - Applicable on attributes that take on a relatively small number of distinct
    values

    +     - E.g. gender, country, state, ...

    +     - E.g. income-level (income broken up into a small number of levels such
    as 0-9999, 10000-19999, 20000-50000, 50000-infinity)

    +   - A bitmap is simply an array of bits


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_564_0.png)'
  merge: -1
  img_proc: true
- pgno: 565
  md: '# Bitmap Indices (Cont.)


    In its simplest form a bitmap index on an attribute has a bitmap for each value
    of the attribute


    +   - Bitmap has as many bits as records

    +   - In a bitmap for value v, the bit for a record is 1 if the record has the
    value v for the attribute, and is 0 otherwise


    | record number | ID | gender | income_level |

    |---|---|---|---|

    | 0 | 76766 | m | L1 |

    | 1 | 22222 | f | L2 |

    | 2 | 12121 | f | L1 |

    | 3 | 15151 | m | L4 |

    | 4 | 58583 | f | L3 |


    Bitmaps for gender

    m 10010

    f 01101


    Bitmaps for income_level

    L1 10100

    L2 01000

    L3 00001

    L4 00010

    L5 00000'
  merge: -1
  img_proc: true
- pgno: 566
  md: '# Bitmap Indices (Cont.)


    +   - Bitmap indices are useful for queries on multiple attributes

    +     - not particularly useful for single attribute queries


    +   - Queries are answered using bitmap operations

    +     - Intersection (and)

    +     - Union (or)

    +     - Complementations (not)


    +   - Each operation takes two bitmaps of the same size and applies the operation
    on corresponding bits to get the result bitmap

    +     - E.g. 100110 AND 110011 = 100010

    +       100110 OR 110011 = 110111

    +       NOT 100110 = 011001

    +     - Males with income level L1: 10010 AND 10100 = 10000

    +       - Can then retrieve required tuples.

    +       - Counting number of matching tuples is even faster'
  merge: -1
  img_proc: true
- pgno: 567
  md: '# Bitmap Indices (Cont.)


    +   - Bitmap indices generally very small compared with relation size

    +     - E.g. if record is 100 bytes, space for a single bitmap is 1/800 of space
    used by relation.

    +       - If number of distinct attribute values is 8, bitmap is only 1% of relation
    size

    +   - Deletion needs to be handled properly

    +     - **Existence bitmap** to note if there is a valid record at a record location

    +     - Needed for complementation

    +       - not(A=v):  *(NOT bitmap-A-v) AND ExistenceBitmap*

    +   - Should keep bitmaps for all values, even null value

    +     - To correctly handle SQL null semantics for NOT(A=v):

    +       - intersect above result with *(NOT bitmap-A-Null)*'
  merge: -1
  img_proc: true
- pgno: 568
  md: '# Efficient Implementation of Bitmap Operations


    +   - Bitmaps are packed into words; a single word and (a basic CPU instruction)
    computes and of 32 or 64 bits at once

    +     - E.g. 1-million-bit maps can be and-ed with just 31,250 instruction

    +   - Counting number of 1s can be done fast by a trick:

    +     - Use each byte to index into a precomputed array of 256 elements each storing
    the count of 1s in the binary representation

    +       - Can use pairs of bytes to speed up further at a higher memory cost

    +     - Add up the retrieved counts

    +   - Bitmaps can be used instead of Tuple-ID lists at leaf levels of B⁺-trees,
    for values that have a large number of matching records

    +     - Worthwhile if > 1/64 of the records have that value, assuming a tuple-id
    is 64 bits

    +     - Above technique merges benefits of bitmap and B⁺-tree indices'
  merge: -1
  img_proc: true
