- pgno: 551
  md: '# Use of Extendable Hash Structure


    +   - Each bucket j stores a value i_j

    +     - All the entries that point to the same bucket have the same values on
    the first i_j bits.

    +   - To locate the bucket containing search-key K_j:

    +     1. Compute h(K_j) = X

    +     2. Use the first i high order bits of X as a displacement into bucket address
    table, and follow the pointer to appropriate bucket

    +   - To insert a record with search-key value K_j

    +     - follow same procedure as look-up and locate the bucket, say j.

    +     - If there is room in the bucket j insert record in the bucket.

    +     - Else the bucket must be split and insertion re-attempted (next slide.)

    +       - Overflow buckets used instead in some cases (will see shortly)'
  merge: -1
  img_proc: true
- pgno: 552
  md: '# Insertion in Extendable Hash Structure (Cont)


    To split a bucket j when inserting record with search-key value K_j:


    +   - If i > i_j (more than one pointer to bucket j)

    +     - allocate a new bucket z, and set i_j = i_z = (i_j + 1)

    +     - Update the second half of the bucket address table entries originally
    pointing to j, to point to z

    +     - remove each record in bucket j and reinsert (in j or z)

    +     - recompute new bucket for K_j and insert record in the bucket (further
    splitting is required if the bucket is still full)


    +   - If i = i_j (only one pointer to bucket j)

    +     - If i reaches some limit b, or too many splits have happened in this insertion,
    create an overflow bucket

    +     - Else

    +       - increment i and double the size of the bucket address table.

    +       - replace each entry in the table by two entries that point to the same
    bucket.

    +       - recompute new bucket address table entry for K_j

    +         Now i > i_j so use the first case above.'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# Deletion in Extendable Hash Structure


    +   - To delete a key value,

    +     - locate it in its bucket and remove it.

    +     - The bucket itself can be removed if it becomes empty (with appropriate
    updates to the bucket address table).

    +     - Coalescing of buckets can be done (can coalesce only with a “buddy” bucket
    having same value of i_j and same i_j−1 prefix, if it is present)

    +     - Decreasing bucket address table size is also possible

    +       - Note: decreasing bucket address table size is an expensive operation
    and should be done only if number of buckets becomes much smaller than the size
    of the table'
  merge: -1
  img_proc: true
