- pgno: 684
  md: "# Optimizing Nested Subqueries**\n\n+   - Nested query example:\n+   \n+  \
    \   ```sql\n+     select name\n+     from instructor\n+     where exists (select\
    \ *\n+                       from teaches\n+                       where instructor.ID\
    \ = teaches.ID and teaches.year = 2007)\n+     ```\n\n+   - SQL conceptually treats\
    \ nested subqueries in the where clause as functions that take parameters and\
    \ return a single value or set of values\n\n+     - Parameters are variables from\
    \ outer level query that are used in the nested subquery; such variables are called\
    \ **correlation variables**\n\n+   - Conceptually, nested subquery is executed\
    \ once for each tuple in the cross-product generated by the outer level **from**\
    \ clause\n\n+     - Such evaluation is called **correlated evaluation**\n\n+ \
    \    - Note: other conditions in where clause may be used to compute a join (instead\
    \ of a cross-product) before executing the nested subquery"
  merge: -1
  img_proc: true
- pgno: 685
  md: <!-- no content -->
