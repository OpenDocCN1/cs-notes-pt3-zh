  md: '# Other Operations


    +   - Set intersection: $v = r \cap s$

    +     - when a tuple is inserted in $r$ we check if it is present in $s$, and
    if so we add it to $v$.

    +     - If the tuple is deleted from r, we delete it from the intersection if
    it is present.

    +     - Updates to $s$ are symmetric

