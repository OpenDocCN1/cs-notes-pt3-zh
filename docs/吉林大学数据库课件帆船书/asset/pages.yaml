- pgno: 18
  md: '# Object-Relational Data Models


    +   - Relational model: flat, “atomic” values

    +   - Object Relational Data Models

    +     - Extend the relational data model by including object orientation and constructs
    to deal with added data types.

    +     - Allow attributes of tuples to have complex types, including non-atomic
    values such as nested relations.

    +     - Preserve relational foundations, in particular the declarative access
    to data, while extending modeling power.

    +     - Provide upward compatibility with existing relational languages.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_18_0.png)'
  merge: -1
  img_proc: true
