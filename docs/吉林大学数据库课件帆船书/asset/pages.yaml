- pgno: 286
  md: '# Functional Dependencies


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_286_0.png)


    +   - Constraints on the set of legal relations.

    +   - Require that the value for a certain set of attributes determines uniquely
    the value for another set of attributes.

    +   - A functional dependency is a generalization of the notion of a *key*.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Functional Dependencies (Cont.)


    +   - Let $R$ be a relation schema

    +     $$\alpha \subseteq R \text{ and } \beta \subseteq R$$


    +   - The **functional dependency**

    +     $$\alpha \to \beta$$

    +     **holds on** $R$ if and only if for any legal relations $r(R)$, whenever
    any two tuples $t_1$ and $t_2$ of $r$ agree on the attributes $\alpha$, they also
    agree on the attributes $\beta$. That is,

    +     $$t_1[\alpha] = t_2[\alpha] \Rightarrow t_1[\beta] = t_2[\beta]$$


    +   - Example: Consider $r(A, B)$ with the following instance of $r$.


    | A | B |

    |---|---|

    | 1 | 4 |

    | 1 | 5 |

    | 3 | 7 |


    +   - On this instance, $A \to B$ does **NOT** hold, but $B \to A$ does hold.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Functional Dependencies (Cont.)


    +   - K is a superkey for relation schema R if and only if K → R

    +   - K is a candidate key for R if and only if

    +     - K → R, and

    +     - for no α ⊂ K, α → R

    +   - Functional dependencies allow us to express constraints that cannot be expressed
    using superkeys. Consider the schema:

    +     inst_dept (ID, name, salary, dept_name, building, budget).

    +     We expect these functional dependencies to hold:

    +     dept_name → building

    +     and ID → building

    +     but would not expect the following to hold:

    +     dept_name → salary'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Use of Functional Dependencies


    +   We use functional dependencies to:

    +   - test relations to see if they are legal under a given set of functional
    dependencies.

    +     - If a relation *r* is legal under a set *F* of functional dependencies,
    we say that *r* **satisfies** *F*.

    +   - specify constraints on the set of legal relations

    +     - We say that *F* **holds on** *R* if all legal relations on *R* satisfy
    the set of functional dependencies *F*.

    +   Note: A specific instance of a relation schema may satisfy a functional dependency
    even if the functional dependency does not hold on all legal instances.

    +   - For example, a specific instance of *instructor* may, by chance, satisfy
    *name → ID*.'
  merge: -1
  img_proc: true
