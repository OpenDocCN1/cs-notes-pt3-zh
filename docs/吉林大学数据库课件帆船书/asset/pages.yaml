- pgno: 543
  md: '# Hash Functions


    +   - Worst hash function maps all search-key values to the same bucket; this
    makes access time proportional to the number of search-key values in the file.

    +   - An ideal hash function is **uniform**, i.e., each bucket is assigned the
    same number of search-key values from the set of *all* possible values.

    +   - Ideal hash function is **random**, so each bucket will have the same number
    of records assigned to it irrespective of the *actual distribution* of search-key
    values in the file.

    +   - Typical hash functions perform computation on the internal binary representation
    of the search-key.

    +     - For example, for a string search-key, the binary representations of all
    the characters in the string could be added and the sum modulo the number of buckets
    could be returned.'
  merge: -1
  img_proc: true
- pgno: 544
  md: '# Handling of Bucket Overflows


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_544_0.png)


    +   - Bucket overflow can occur because of

    +     - Insufficient buckets

    +     - Skew in distribution of records. This can occur due to two reasons:

    +       - multiple records have same search-key value

    +       - chosen hash function produces non-uniform distribution of key values

    +   - Although the probability of bucket overflow can be reduced, it cannot be
    eliminated; it is handled by using *overflow buckets*.'
  merge: -1
  img_proc: true
- pgno: 545
  md: '# Handling of Bucket Overflows (Cont.)


    +   - **Overflow chaining** – the overflow buckets of a given bucket are chained
    together in a linked list.

    +   - Above scheme is called **closed hashing**.

    +     - An alternative, called **open hashing**, which does not use overflow buckets,
    is not suitable for database applications.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_545_0.png)'
  merge: -1
  img_proc: true
- pgno: 546
  md: '# Hash Indices


    +   - Hashing can be used not only for file organization, but also for index-structure
    creation.

    +   - A **hash index** organizes the search keys, with their associated record
    pointers, into a hash file structure.

    +   - Strictly speaking, hash indices are always secondary indices

    +     - if the file itself is organized using hashing, a separate primary hash
    index on it using the same search-key is unnecessary.

    +     - However, we use the term hash index to refer to both secondary index structures
    and hash organized files.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_546_0.png)'
  merge: -1
