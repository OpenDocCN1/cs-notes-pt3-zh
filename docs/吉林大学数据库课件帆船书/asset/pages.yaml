- pgno: 140
  md: '# Materialized Views


    +   - **Materializing a view**: create a physical table containing all the tuples
    in the result of the query defining the view

    +   - If relations used in the query are updated, the materialized view result
    becomes out of date

    +     - Need to **maintain** the view, by updating the view whenever the underlying
    relations are updated.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Transactions


    +   - Unit of work

    +   - Atomic transaction

    +     - either fully executed or rolled back as if it never occurred

    +   - Isolation from concurrent transactions

    +   - Transactions begin implicitly

    +     - Ended by **commit work** or **rollback work**

    +   - But default on most databases: each SQL statement commits automatically

    +     - Can turn off auto commit for a session (e.g. using API)

    +     - In SQL:1999, can use: **begin atomic** .... **end**

    +       - Not supported on most databases'
  merge: -1
  img_proc: true
