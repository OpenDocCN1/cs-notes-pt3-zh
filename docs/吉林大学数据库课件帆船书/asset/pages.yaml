- pgno: 48
  md: '# Joining two relations – Natural Join


    Let r and s be relations on schemas R and S respectively. Then, the “natural join”
    of relations R and S is a relation on schema R ∪ S obtained as follows:


    +   - Consider each pair of tuples t_r from r and t_S from s.

    +   - If t_r and t_S have the same value on each of the attributes in R ∩ S, add
    a tuple t to the result, where

    +     - t has the same value as t_r on r

    +     - t has the same value as t_S on s'
  merge: -1
  img_proc: true
