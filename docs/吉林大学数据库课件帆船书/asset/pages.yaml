- pgno: 1353
  md: '# Division of Space by Quadtrees


    # Quadtrees


    +   - Each node of a quadtree is associated with a rectangular region of space;
    the top node is associated with the entire target space.


    +   - Each non-leaf nodes divides its region into four equal sized quadrants


    +     - Correspondingly each such node has four child nodes corresponding to the
    four quadrants and so on


    +   - Leaf nodes have between zero and some fixed maximum number of points (set
    to 1 in example).


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1353_0.png)'
  merge: -1
  img_proc: true
- pgno: 1354
  md: '# Quadtrees (Cont.)


    +   PR quadtree: stores points; space is divided based on regions, rather than
    on the actual set of points stored.


    +   Region quadtrees store array (raster) information.


    +   - A node is a leaf node is all the array values in the region that it covers
    are the same. Otherwise, it is subdivided further into four children of equal
    area, and is therefore an internal node.


    +   - Each node corresponds to a sub-array of values.


    +   - The sub-arrays corresponding to leaves either contain just a single array
    element, or have multiple array elements, all of which have the same value.


    +   Extensions of k-d trees and PR quadtrees have been proposed to index line
    segments and polygons


    +   - Require splitting segments/polygons into pieces at partitioning boundaries


    +   - Same segment/polygon may be represented at several leaf nodes'
  merge: -1
  img_proc: true
- pgno: 1355
  md: '# R-Trees


    +   - **R-trees** are a N-dimensional extension of B⁺-trees, useful for indexing
    sets of rectangles and other polygons.

    +   - Supported in many modern database systems, along with variants like R⁺ -trees
    and R*-trees.

    +   - Basic idea: generalize the notion of a one-dimensional interval associated
    with each B+ -tree node to an N-dimensional interval, that is, an N-dimensional
    rectangle.

    +   - Will consider only the two-dimensional case (*N* = 2)

    +     - generalization for *N* > 2 is straightforward, although R-trees work well
    only for relatively small N'
  merge: -1
  img_proc: true
- pgno: 1356
  md: "# # R Trees (Cont.)\n\n+   A rectangular bounding box is associated with each\
    \ tree node.\n+   \n+   • Bounding box of a leaf node is a minimum sized rectangle\
    \ that contains all the rectangles/polygons associated with the leaf node.\n+\
    \   • The bounding box associated with a non-leaf node contains the bounding box\
    \ associated with all its children.\n+   • Bounding box of a node serves as its\
    \ key in its parent node (if any)\n+   • Bounding boxes of children of a node\
    \ are allowed to overlap\n\n+   A polygon is stored only in one node, and the\
    \ bounding box of the node must contain the polygon.\n+   \n+   • The storage\
    \ efficiency or R-trees is better than that of k-d trees or quadtrees since a\
    \ polygon is stored only once."
  merge: -1
  img_proc: true
