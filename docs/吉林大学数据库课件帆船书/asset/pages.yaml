- pgno: 231
  md: "# Windowing (Cont.)\n\n+   Can do windowing within partitions\n\n+   E.g.,\
    \ Given a relation transaction (account_number, date_time, value), where value\
    \ is positive for a deposit and negative for a withdrawal\n\n+   “Find total balance\
    \ of each account after each transaction on the account”\n\n```\nselect account_number,\
    \ date_time,\n  sum (value) over\n    (partition by account_number\n     order\
    \ by date_time\n     rows unbounded preceding)\n  as balance\nfrom transaction\n\
    order by account_number, date_time\n```"
  merge: -1
