- pgno: 696
  md: '# Handling Expressions


    +   - To handle an entire expression, we derive expressions for computing the
    incremental change to the result of each sub-expressions, starting from the smallest
    sub-expressions.

    +   - E.g. consider $E_1 \bowtie E_2$ where each of $E_1$ and $E_2$ may be a complex
    expression

    +     - Suppose the set of tuples to be inserted into $E_1$ is given by $D_1$

    +       - Computed earlier, since smaller sub-expressions are handled first

    +     - Then the set of tuples to be inserted into $E_1 \bowtie E_2$ is given
    by $D_1 \bowtie E_2$

    +       - This is just the usual way of maintaining joins'
  merge: -1
