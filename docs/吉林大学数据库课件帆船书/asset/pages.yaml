- pgno: 534
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_534_0.png)


    # B-Tree Index Files (Cont.)


    +   Advantages of B-Tree indices:

    +   - May use less tree nodes than a corresponding B+-Tree.

    +   - Sometimes possible to find search-key value before reaching leaf node.


    +   Disadvantages of B-Tree indices:

    +   - Only small fraction of all search-key values are found early

    +   - Non-leaf nodes are larger, so fan-out is reduced. Thus, B-Trees typically
    have greater depth than corresponding B+-Tree

    +   - Insertion and deletion more complicated than in B+-Trees

    +   - Implementation is harder than B+-Trees.


    Typically, advantages of B-Trees do not out weigh disadvantages.'
  merge: -1
  img_proc: true
- pgno: 535
  md: '# Multiple-Key Access


    +   - Use multiple indices for certain types of queries.

    +   - Example:

    +     **select** *ID*

    +     **from** *instructor*

    +     **where** *dept_name* = “Finance” **and** *salary* = 80000

    +   - Possible strategies for processing query using indices on single attributes:

    +     1. Use index on *dept_name* to find instructors with department name Finance;
    test *salary* = 80000

    +     2. Use index on *salary* to find instructors with a salary of $80000; test
    *dept_name* = “Finance”.

    +     3. Use *dept_name* index to find pointers to all records pertaining to the
    “Finance” department. Similarly use index on *salary*. Take intersection of both
    sets of pointers obtained.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_535_0.png)'
  merge: -1
  img_proc: true
