- pgno: 240
  md: '# Extended Aggregation to Support OLAP


    +   The **cube** operation computes union of **group by**’s on every subset of
    the specified attributes


    +   Example relation for this section

    +   *sales(item_name, color, clothes_size, quantity)*


    +   E.g. consider the query

    +   **select** item_name, color, size, **sum**(number)

    +   **from** sales

    +   **group by cube**(item_name, color, size)


    This computes the union of eight different groupings of the *sales* relation:


    { (item_name, color, size), (item_name, color),

    (item_name, size),      (color, size),

    (item_name),           (color),

    (size),                 () }


    where () denotes an empty **group by** list.


    +   For each grouping, the result contains the null value for attributes not present
    in the grouping.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Online Analytical Processing Operations\n\nRelational representation of cross-tab\
    \ that we saw earlier, but with *null* in place of **all**, can be computed by\n\
    \n```\nselect item_name, color, sum(number)\nfrom sales\ngroup by cube(item_name,\
    \ color)\n```\n\nThe function **grouping()** can be applied on an attribute\n\n\
    +   - Returns 1 if the value is a null value representing all, and returns 0 in\
    \ all other cases.\n\n```\nselect item_name, color, size, sum(number),\n    grouping(item_name)\
    \ as item_name_flag,\n    grouping(color) as color_flag,\n    grouping(size) as\
    \ size_flag,\nfrom sales\ngroup by cube(item_name, color, size)\n```"
