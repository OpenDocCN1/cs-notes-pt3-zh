- pgno: 33
  md: '# Attribute Types


    +   - The set of allowed values for each attribute is called the **domain** of
    the attribute

    +   - Attribute values are (normally) required to be **atomic**; that is, indivisible

    +   - The special value *null* is a member of every domain. Indicated that the
    value is “unknown”

    +   - The null value causes complications in the definition of many operations'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Relation Schema and Instance


    +   - *A₁, A₂, ..., Aₙ are attributes*

    +   - *R = (A₁, A₂, ..., Aₙ) is a relation schema*

    +     Example:

    +     *instructor = (ID, name, dept_name, salary)*

    +   - Formally, given sets *D₁, D₂, .... Dₙ* a **relation r** is a subset of *D₁
    x D₂ x ... x Dₙ*

    +     Thus, a relation is a set of *n-tuples (a₁, a₂, ..., aₙ)* where each *aᵢ
    ∈ Dᵢ*

    +   - The current values (**relation instance**) of a relation are specified by
    a table

    +   - An element *t* of *r* is a *tuple*, represented by a *row* in a table'
  merge: -1
  img_proc: true
