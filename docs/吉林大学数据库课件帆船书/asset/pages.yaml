- pgno: 862
  md: '# Recovery Algorithm with Logical Undo


    Basically same as earlier algorithm, except for changes described earlier for
    transaction rollback


    +   1. (Redo phase): Scan log forward from last < checkpoint L > record till end
    of log


    +   1. Repeat history by physically redoing all updates of all transactions,

    +   2. Create an undo-list during the scan as follows

    +      - undo-list is set to L initially

    +      - Whenever <T_i start> is found T_i is added to undo-list

    +      - Whenever <T_i commit> or <T_i abort> is found, T_i is deleted from undo-list


    This brings database to state as of crash, with committed as well as uncommitted
    transactions having been redone.


    Now undo-list contains transactions that are incomplete, that is, have neither
    committed nor been fully rolled back.'
  merge: -1
  img_proc: true
- pgno: 863
  md: "# Recovery with Logical Undo (Cont.)\n\nRecovery from system crash (cont.)\n\
    \n+   2. (**Undo phase**): Scan log backwards, performing undo on log records\
    \ of transactions found in *undo-list*.\n+   \n+   - Log records of transactions\
    \ being rolled back are processed as described earlier, as they are found\n+ \
    \    - Single shared scan for all transactions being undone\n+   - When <T<sub>i</sub>\
    \ **start**> is found for a transaction T<sub>i</sub> in *undo-list*, write a\
    \ <T<sub>i</sub> **abort**> log record.\n+   - Stop scan when <T<sub>i</sub> **start**>\
    \ records have been found for all T<sub>i</sub> in *undo-list*\n+   - This undoes\
    \ the effects of incomplete transactions (those with neither **commit** nor **abort**\
    \ log records). Recovery is now complete."
  merge: -1
  img_proc: true
