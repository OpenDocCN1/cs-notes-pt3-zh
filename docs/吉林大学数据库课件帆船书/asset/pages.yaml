- pgno: 1363
  md: '# Multimedia Databases


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1363_0.png)


    +   - To provide such database functions as indexing and consistency, it is desirable
    to store multimedia data in a database

    +     - rather than storing them outside the database, in a file system

    +   - The database must handle large object representation.

    +   - Similarity-based retrieval must be provided by special index structures.

    +   - Must provide guaranteed steady retrieval rates for continuous-media data.'
  merge: -1
  img_proc: true
- pgno: 1364
  md: '# Multimedia Data Formats


    +   - Store and transmit multimedia data in compressed form

    +     - JPEG and GIF the most widely used formats for image data.

    +     - MPEG standard for video data use commonalties among a sequence of frames
    to achieve a greater degree of compression.

    +   - MPEG-1 quality comparable to VHS video tape.

    +     - stores a minute of 30-frame-per-second video and audio in approximately
    12.5 MB

    +   - MPEG-2 designed for digital broadcast systems and digital video disks; negligible
    loss of video quality.

    +     - Compresses 1 minute of audio-video to approximately 17 MB.

    +   - Several alternatives of audio encoding

    +     - MPEG-1 Layer 3 (MP3), RealAudio, WindowsMedia format, etc.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1364_0.png)'
  merge: -1
  img_proc: true
- pgno: 1365
  md: '# Continuous-Media Data


    +   - Most important types are video and audio data.

    +   - Characterized by high data volumes and real-time information-delivery requirements.

    +     - Data must be delivered sufficiently fast that there are no gaps in the
    audio or video.

    +     - Data must be delivered at a rate that does not cause overflow of system
    buffers.

    +     - Synchronization among distinct data streams must be maintained

    +       - Video of a person speaking must show lips moving synchronously with
    the audio'
  merge: -1
  img_proc: true
- pgno: 1366
  md: '# Video Servers


    +   - Video-on-demand systems deliver video from central video servers, across
    a network, to terminals


    +   - Must guarantee end-to-end delivery rates


    +   - Current video-on-demand servers are based on file systems; existing database
    systems do not meet real-time response requirements.


    +   - Multimedia data are stored on several disks (RAID configuration), or on
    tertiary storage for less frequently accessed data.


    +   - Head-end terminals - used to view multimedia data


    +   - PCs or TVs attached to a small, inexpensive computer called a set-top box.'
  merge: -1
  img_proc: true
- pgno: 1367
  md: '# Similarity-Based Retrieval


    Examples of similarity based retrieval


    +   - Pictorial data: Two pictures or images that are slightly different as represented
    in the database may be considered the same by a user.

    +     - E.g., identify similar designs for registering a new trademark.

    +   - Audio data: Speech-based user interfaces allow the user to give a command
    or identify a data item by speaking.

    +     - E.g., test user input against stored commands.

    +   - Handwritten data: Identify a handwritten data item or command stored in
    the database


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1367_0.png)'
