- pgno: 146
  md: '# Referential Integrity


    +   - Ensures that a value that appears in one relation for a given set of attributes
    also appears for a certain set of attributes in another relation.

    +     - Example: If “Biology” is a department name appearing in one of the tuples
    in the *instructor* relation, then there exists a tuple in the *department* relation
    for “Biology”.

    +   - Let A be a set of attributes. Let R and S be two relations that contain
    attributes A and where A is the primary key of S. A is said to be a **foreign
    key** of R if for any values of A appearing in R these values also appear in S.'
  merge: -1
  img_proc: true
