- pgno: 356
  md: '# Correctness of 3NF Decomposition Algorithm


    +   - 3NF decomposition algorithm is dependency preserving (since there is a relation
    for every FD in $F_c$)

    +   - Decomposition is lossless

    +     - A candidate key ($C$) is in one of the relations $R_i$ in decomposition

    +     - Closure of candidate key under $F_c$ must contain all attributes in $R$.

    +     - Follow the steps of attribute closure algorithm to show there is only
    one tuple in the join result for each tuple in $R_i$'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Correctness of 3NF Decomposition Algorithm (Cont’d.)


    Claim: if a relation $R_i$ is in the decomposition generated by the above algorithm,
    then $R_i$ satisfies 3NF.


    +   - Let $R_i$ be generated from the dependency $\alpha \rightarrow \beta$


    +   - Let $\gamma \rightarrow B$ be any non-trivial functional dependency on $R_i$.
    (We need only consider FDs whose right-hand side is a single attribute.)


    +   - Now, $B$ can be in either $\beta$ or $\alpha$ but not in both. Consider
    each case separately.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Correctness of 3NF Decomposition (Cont’d.)


    +   Case 1: If B in β:

    +   - If γ is a superkey, the 2nd condition of 3NF is satisfied

    +   - Otherwise α must contain some attribute not in γ

    +   - Since γ → B is in F⁺ it must be derivable from F_c, by using attribute closure
    on γ.

    +   - Attribute closure not have used α →β. If it had been used, α must be contained
    in the attribute closure of γ, which is not possible, since we assumed γ is not
    a superkey.

    +   - Now, using α→ (β-{B}) and γ → B, we can derive α →B (since γ ⊆ α β, and
    B ∉ γ since γ → B is non-trivial)

    +   - Then, B is extraneous in the right-hand side of α →β; which is not possible
    since α →β is in F_c.

    +   - Thus, if B is in β then γ must be a superkey, and the second condition of
    3NF must be satisfied.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Correctness of 3NF Decomposition (Cont’d.)


    +   - Case 2: *B* is in *α*.

    +     - Since *α* is a candidate key, the third alternative in the definition
    of 3NF is trivially satisfied.

    +     - In fact, we cannot show that *γ* is a superkey.

    +     - This shows exactly why the third alternative is present in the definition
    of 3NF.


    Q.E.D.'
  merge: -1
  img_proc: true
