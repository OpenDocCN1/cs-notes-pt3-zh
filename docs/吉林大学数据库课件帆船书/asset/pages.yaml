- pgno: 678
  md: '# # Size Estimation for Other Operations


    +   - Projection: estimated size of Π_A(r) = V(A,r)

    +   - Aggregation: estimated size of _A𝒢_(r) = V(A,r)

    +   - Set operations


    +     - For unions/intersections of selections on the same relation: rewrite and
    use size estimate for selections

    +       - E.g. σ_θ1(r) ∪ σ_θ2(r) can be rewritten as σ_θ1 ∨ θ2(r)

    +     - For operations on different relations:

    +       - estimated size of r ∪ s = size of r + size of s.

    +       - estimated size of r ∩ s = minimum size of r and size of s.

    +       - estimated size of r − s = r.

    +       - All the three estimates may be quite inaccurate, but provide upper bounds
    on the sizes.'
  merge: -1
  img_proc: true
- pgno: 679
  md: '# Size Estimation (Cont.)


    +   - **Outer join:**

    +     - Estimated size of $r \mathbin{\triangleright\!\!\triangleleft} s$ = size
    of $r \bowtie s$ + size of $r$

    +       - Case of right outer join is symmetric

    +     - Estimated size of $r \mathbin{\triangleleft\!\!\triangleleft} s$ = size
    of $r \bowtie s$ + size of $r$ + size of $s$'
  merge: -1
  img_proc: true
- pgno: 680
  md: '# Estimation of Number of Distinct Values


    Selections: σθ(r)


    +   - If θ forces A to take a specified value: V(A,σθ(r)) = 1.

    +     - e.g., A = 3

    +   - If θ forces A to take on one of a specified set of values: V(A,σθ(r)) =
    number of specified values.

    +     - (e.g., (A = 1 ∨ A = 3 ∨ A = 4)),

    +   - If the selection condition θ is of the form A op r estimated V(A,σθ(r))
    = V(A.r) * s

    +     - where s is the selectivity of the selection.

    +   - In all the other cases: use approximate estimate of min(V(A,r), nσθ(r))

    +     - More accurate estimate can be got using probability theory, but this one
    works fine generally'
  merge: -1
  img_proc: true
- pgno: 681
  md: "# Estimation of Distinct Values (Cont.)\n\nJoins: r ⋈ s\n\n+   If all attributes\
    \ in A are from r\n+       estimated V(A, r ⋈ s) = min (V(A,r), n_r ⋈ s)\n\n+\
    \   If A contains attributes A1 from r and A2 from s, then estimated V(A,r ⋈ s)\
    \ = \n+       min(V(A1,r)*V(A2 − A1,s), V(A1 − A2,r)*V(A2,s), n_r ⋈ s)\n\n+  \
    \ More accurate estimate can be got using probability theory, but this one works\
    \ fine generally"
  merge: -1
  img_proc: true
- pgno: 682
  md: '# Estimation of Distinct Values (Cont.)


    Estimation of distinct values are straightforward for projections.


    +   They are the same in Π_A(r) as in r.


    The same holds for grouping attributes of aggregation.


    For aggregated values


    +   For min(A) and max(A), the number of distinct values can be estimated as min(V(A,r),
    V(G,r)) where G denotes grouping attributes


    +   For other aggregates, assume all values are distinct, and use V(G,r)'
