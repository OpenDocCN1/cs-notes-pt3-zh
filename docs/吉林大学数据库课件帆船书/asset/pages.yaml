- pgno: 1169
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1169_0.png)


    # Information Retrieval Systems


    +   - **Information retrieval (IR)** systems use a simpler data model than database
    systems

    +     - Information organized as a collection of documents

    +     - Documents are unstructured, no schema

    +   - Information retrieval locates relevant documents, on the basis of user input
    such as keywords or example documents

    +     - e.g., find documents containing the words “database systems”

    +   - Can be used even on textual descriptions provided with non-textual data
    such as images

    +   - Web search engines are the most familiar example of IR systems'
  merge: -1
  img_proc: true
- pgno: 1170
  md: '# Information Retrieval Systems (Cont.)


    +   - Differences from database systems

    +     - IR systems don’t deal with transactional updates (including concurrency
    control and recovery)

    +     - Database systems deal with structured data, with schemas that define the
    data organization

    +     - IR systems deal with some querying issues not generally addressed by database
    systems

    +       - Approximate searching by keywords

    +       - Ranking of retrieved answers by estimated degree of relevance'
  merge: -1
  img_proc: true
- pgno: 1171
  md: '# Keyword Search


    +   - In **full text** retrieval, all the words in each document are considered
    to be keywords.

    +     - We use the word **term** to refer to the words in a document

    +   - Information-retrieval systems typically allow query expressions formed using
    keywords and the logical connectives *and, or, and not*

    +     - *Ands* are implicit, even if not explicitly specified

    +   - Ranking of documents on the basis of estimated relevance to a query is critical

    +     - Relevance ranking is based on factors such as

    +       - Term frequency

    +         - Frequency of occurrence of query keyword in document

    +       - Inverse document frequency

    +         - How many documents the query keyword occurs in

    +           - Fewer ➔ give more importance to keyword

    +       - Hyperlinks to documents

    +         - More links to a document ➔ document is more important


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1171_0.png)'
  merge: -1
  img_proc: true
- pgno: 1172
  md: '# # Relevance Ranking Using Terms


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1172_0.png)


    +   - TF-IDF (Term frequency/Inverse Document frequency) ranking:

    +   - Let n(d) = number of terms in the document d

    +   - n(d, t) = number of occurrences of term t in the document d.

    +   - Relevance of a document d to a term t


    ```

    TF(d, t) = log (1 + n(d,t)/n(d))

    ```


    The log factor is to avoid excessive weight to frequent terms


    +   - Relevance of document to query Q


    ```

    r(d, Q) = \sum_{t \in Q} \frac{TF(d,t)}{n(t)}

    ```'
  merge: -1
  img_proc: true
- pgno: 1173
  md: '# Relevance Ranking Using Terms (Cont.)


    +   Most systems add to the above model


    +   Words that occur in title, author list, section headings, etc. are given greater
    importance


    +   Words whose first occurrence is late in the document are given lower importance


    +   Very common words such as “a”, “an”, “the”, “it” etc. are eliminated


    +   Called **stop words**


    +   **Proximity**: if keywords in query occur close together in the document,
    the document has higher importance than if they occur far apart


    +   Documents are returned in decreasing order of relevance score


    +   Usually only top few documents are returned, not all'
  merge: -1
  img_proc: true
- pgno: 1174
  md: '# Similarity Based Retrieval


    Similarity based retrieval - retrieve documents similar to a given document


    +   - Similarity may be defined on the basis of common words


    +   - E.g., find k terms in A with highest TF (d, t) / n (t) and use these terms
    to find relevance of other documents.


    Relevance feedback: Similarity can be used to refine answer set to keyword query


    +   - User selects a few relevant documents from those retrieved by keyword query,
    and system finds other documents similar to these


    Vector space model: define an n-dimensional space, where n is the number of words
    in the document set.


    +   - Vector for document d goes from origin to a point whose i th coordinate
    is TF (d,t) / n (t)


    +   - The cosine of the angle between the vectors of two documents is used as
    a measure of their similarity.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1174_0.png)'
  merge: -1
  img_proc: true
- pgno: 1175
  md: '# Relevance Using Hyperlinks


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1175_0.png)


    +   - Number of documents relevant to a query can be enormous if only term frequencies
    are taken into account


    +   - Using term frequencies makes “spamming” easy


    +     - E.g., a travel agency can add many occurrences of the words “travel” to
    its page to make its rank very high


    +   - Most of the time people are looking for pages from popular sites


    +   - Idea: use popularity of Web site (e.g., how many people visit it) to rank
    site pages that match given keywords


    +   - Problem: hard to find actual popularity of site


    +     - Solution: next slide'
  merge: -1
  img_proc: true
- pgno: 1176
  md: '# Relevance Using Hyperlinks (Cont.)


    +   - Solution: use number of hyperlinks to a site as a measure of the popularity
    or **prestige** of the site

    +     - Count only one hyperlink from each site (why? - see previous slide)

    +     - Popularity measure is for site, not for individual page

    +       - But, most hyperlinks are to root of site

    +       - Also, concept of “site” difficult to define since a URL prefix like
    cs.yale.edu contains many unrelated pages of varying popularity


    +   - Refinements

    +     - When computing prestige based on links to a site, give more weight to
    links from sites that themselves have higher prestige

    +       - Definition is circular

    +       - Set up and solve system of simultaneous linear equations

    +     - Above idea is basis of the Google **PageRank** ranking mechanism'
  merge: -1
  img_proc: true
- pgno: 1177
  md: '# Relevance Using Hyperlinks (Cont.)


    +   - Connections to **social networking** theories that ranked prestige of people

    +     - E.g., the president of the U.S.A has a high prestige since many people
    know him

    +     - Someone known by multiple prestigious people has high prestige

    +   - Hub and authority based ranking

    +     - A **hub** is a page that stores links to many pages (on a topic)

    +     - An **authority** is a page that contains actual information on a topic

    +     - Each page gets a **hub prestige** based on prestige of authorities that
    it points to

    +     - Each page gets an **authority prestige** based on prestige of hubs that
    point to it

    +     - Again, prestige definitions are cyclic, and can be got by solving linear
    equations

    +     - Use authority prestige when ranking answers to a query'
  merge: -1
  img_proc: true
- pgno: 1178
  md: '# Synonyms and Homonyms


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1178_0.png)


    +   **Synonyms**

    +   - E.g., document: “motorcycle repair”, query: “motorcycle maintenance”

    +     - Need to realize that “maintenance” and “repair” are synonyms

    +   - System can extend query as “motorcycle and (repair or maintenance)”


    +   **Homonyms**

    +   - E.g., “object” has different meanings as noun/verb

    +   - Can disambiguate meanings (to some extent) from the context


    +   **Extending queries automatically using synonyms can be problematic**

    +   - Need to understand intended meaning in order to infer synonyms

    +     - Or verify synonyms with user

    +   - Synonyms may have other meanings as well'
  merge: -1
  img_proc: true
- pgno: 1179
  md: '# Concept-Based Querying


    +   - Approach

    +     - For each word, determine the **concept** it represents from context

    +     - Use one or more **ontologies**:

    +       - Hierarchical structure showing relationship between concepts

    +       - E.g., the ISA relationship that we saw in the E-R model

    +   - This approach can be used to standardize terminology in a specific field

    +   - Ontologies can link multiple languages

    +   - Foundation of the **Semantic Web** (not covered here)'
  merge: -1
  img_proc: true
- pgno: 1180
  md: '# Indexing of Documents


    +   - An inverted index maps each keyword $K_i$ to a set of documents $S_i$ that
    contain the keyword

    +     - Documents identified by identifiers

    +   - Inverted index may record

    +     - Keyword locations within document to allow proximity based ranking

    +     - Counts of number of occurrences of keyword to compute TF

    +   - **and** operation: Finds documents that contain all of $K_1$, $K_2$, ...,
    $K_n$.

    +     - Intersection $S_1 \cap S_2 \cap....\cap S_n$

    +   - **or** operation: documents that contain at least one of $K_1$, $K_2$, ...,
    $K_n$

    +     - union, $S_1 \cap S_2 \cap....\cap S_n$.

    +   - Each $S_i$ is kept sorted to allow efficient intersection/union by merging

    +     - “not” can also be efficiently implemented by merging of sorted lists'
  merge: -1
  img_proc: true
- pgno: 1181
  md: '# # Measuring Retrieval Effectiveness


    +   - Information-retrieval systems save space by using index structures that
    support only approximate retrieval. May result in:

    +     - **false negative (false drop)** - some relevant documents may not be retrieved.

    +     - **false positive** - some irrelevant documents may be retrieved.

    +     - For many applications a good index should not permit any false drops,
    but may permit a few false positives.


    +   - Relevant performance metrics:

    +     - **precision** - what percentage of the retrieved documents are relevant
    to the query.

    +     - **recall** - what percentage of the documents relevant to the query were
    retrieved.'
  merge: -1
  img_proc: true
