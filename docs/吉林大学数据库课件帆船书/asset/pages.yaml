- pgno: 1417
  md: '# Nested and Multilevel Transactions


    +   - A **nested or multilevel transaction** *T* is represented by a set *T* =
    {*t*₁, *t*₂, ..., *t*ₙ} of subtransactions and a partial order *P* on *T*.

    +   - A subtransaction *t*ᵢ in *T* may abort without forcing *T* to abort.

    +   - Instead, *T* may either restart *t*ᵢ, or simply choose not to run *t*ᵢ.

    +   - If *t*ᵢ commits, this action does not make *t*ᵢ permanent (unlike the situation
    in Chapter 15). Instead, *t*ᵢ commits to *T*, and may still abort (or require
    compensation) if *T* aborts.

    +   - An execution of *T* must not violate the partial order *P*, i.e., if an
    edge *t*ᵢ → *t*ⱼ appears in the precedence graph, then *t*ⱼ → *t*ᵢ must not be
    in the transitive closure of *P*.'
  merge: -1
  img_proc: true
- pgno: 1418
  md: '# Nested and Multilevel Transactions (Cont.)


    +   - Subtransactions can themselves be nested/multilevel transactions.

    +     - Lowest level of nesting: standard read and write operations.

    +   - Nesting can create higher-level operations that may enhance concurrency.

    +   - Types of nested/ multilevel transactions:

    +     - **Multilevel transaction**: subtransaction of *T* is permitted to release
    locks on completion.

    +     - **Saga**: multilevel long-duration transaction.

    +     - **Nested transaction**: locks held by a subtransaction *tᵢ* of *T* are
    automatically assign to *T* on completion of *tᵢ*.'
  merge: -1
  img_proc: true
- pgno: 1419
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1419_0.png)


    # Example of Nesting


    +   - Rewrite transaction $T_1$ using subtransactions $T_a$ and $T_b$ that perform
    increment or decrement operations:

    +     - $T_1$ consists of

    +       - $T_{1,1}$, which subtracts 50 from $A$

    +       - $T_{1,2}$, which adds 50 to $B$


    +   - Rewrite transaction $T_2$ using subtransactions $T_c$ and $T_d$ that perform
    increment or decrement operations:

    +     - $T_2$ consists of

    +       - $T_{2,1}$, which subtracts 10 from $B$

    +       - $T_{2,2}$, which adds 10 to $A$


    +   - No ordering is specified on subtransactions; any execution generates a correct
    result.'
  merge: -1
  img_proc: true
- pgno: 1420
  md: '# Compensating Transactions


    +   - Alternative to undo operation; compensating transactions deal with the problem
    of cascading rollbacks.

    +   - Instead of undoing all changes made by the failed transaction, action is
    taken to "compensate" for the failure.

    +   - Consider a long-duration transaction $T_i$ representing a travel reservation,
    with subtransactions $T_{i,1}$, which makes airline reservations, $T_{i,2}$ which
    reserves rental cars, and $T_{i,3}$ which reserves a hotel room.

    +     - Hotel cancels the reservation.

    +     - Instead of undoing all of $T_i$, the failure of $T_{i,3}$ is compensated
    for by deleting the old hotel reservation and making a new one.

    +     - Requires use of semantics of the failed transaction.'
  merge: -1
  img_proc: true
- pgno: 1421
  md: '# Implementation Issues


    +   - For long-duration transactions to survive system crashes, we must log not
    only changes to the database, but also changes to internal system data pertaining
    to these transactions.

    +   - Logging of updates is made more complex by physically large data items (CAD
    design, document text); undesirable to store both old and new values.

    +   - Two approaches to reducing the overhead of ensuring the recoverability of
    large data items:

    +     - Operation logging. Only the operation performed on the data item and the
    data-item name are stored in the log.

    +     - Logging and shadow paging. Use logging from small data items; use shadow
    paging for large data items. Only modified pages need to be stored in duplicate.'
  merge: -1
  img_proc: true
- pgno: 1422
  md: '# Transaction Management in Multidatabase Systems


    +   - Transaction management is complicated in multidatabase systems because of
    the assumption of autonomy

    +     - **Global 2PL** -each local site uses a strict 2PL (locks are released
    at the end); locks set as a result of a global transaction are released only when
    that transaction reaches the end.

    +       - Guarantees global serializability

    +     - Due to autonomy requirements, sites cannot cooperate and execute a common
    concurrency control scheme

    +       - E.g., no way to ensure that all databases follow strict 2PL

    +   - Solutions:

    +     - provide very low level of concurrent execution, or

    +     - use weaker levels of consistency


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1422_0.png)'
  merge: -1
  img_proc: true
- pgno: 1423
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1423_0.png)


    # # Transaction Management


    +   - Local transactions are executed by each local DBMS, outside of the MDBS
    system control.


    +   - Global transactions are executed under multidatabase control.


    +   - Local autonomy - local DBMSs cannot communicate directly to synchronize
    global transaction execution and the multidatabase has no control over local transaction
    execution.


    +     - local concurrency control scheme needed to ensure that DBMS’s schedule
    is serializable


    +     - in case of locking, DBMS must be able to guard against local deadlocks.


    +     - need additional mechanisms to ensure global serializability'
  merge: -1
  img_proc: true
- pgno: 1424
  md: '# Two-Level Serializability


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1424_0.png)


    +   - DBMS ensures local serializability among its local transactions, including
    those that are part of a global transaction.

    +   - The multidatabase ensures serializability among global transactions alone-
    *ignoring the orderings induced by local transactions*.

    +   - 2LSR does not ensure global serializability, however, it can fulfill requirements
    for **strong correctness**.

    +     1. Preserve consistency as specified by a given set of constraints

    +     2. Guarantee that the set of data items read by each transaction is consistent

    +   - **Global-read protocol**: Global transactions can read, but not update,
    local data items; local transactions do not have access to global data. There
    are no consistency constraints between local and global data items.'
  merge: -1
  img_proc: true
- pgno: 1425
  md: '# Two-Level Serializability (Cont.)


    +   - **Local-read protocol**: Local transactions have read access to global data;
    disallows all access to local data by global transactions.

    +   - A transaction has a value dependency if the value that it writes to a data
    item at one site depends on a value that it read for a data item on another site.

    +   - For strong correctness: No transaction may have a value dependency.

    +   - **Global-read-write/local-read protocol**: Local transactions have read
    access to global data; global transactions may read and write all data;

    +   - No consistency constraints between local and global data items.

    +   - No transaction may have value dependency.'
  merge: -1
  img_proc: true
- pgno: 1426
  md: '# Global Serializability


    +   - Even if no information is available concerning the structure of the various
    concurrency control schemes, a very restrictive protocol that ensures serializability
    is available.

    +   - Transaction-graph : a graph with vertices being global transaction names
    and site names.

    +   - An undirected edge ($T_i$, $S_k$) exists if $T_i$ is active at site $S_k$.

    +   - Global serializability is assured if transaction-graph contains no undirected
    cycles.'
  merge: -1
  img_proc: true
- pgno: 1427
  md: '# Ensuring Global Serializability


    +   - Each site $S_i$ has a special data item, called **ticket**

    +   - Every transaction $T_j$ that runs at site $S_k$ writes to the ticket at
    site $S_i$

    +   - Ensures global transactions are serialized at each site, regardless of local
    concurrency control method, so long as the method guarantees local serializability

    +   - Global transaction manager decides serial ordering of global transactions
    by controlling order in which tickets are accessed

    +   - However, above protocol results in low concurrency between global transactions.'
  merge: -1
  img_proc: true
