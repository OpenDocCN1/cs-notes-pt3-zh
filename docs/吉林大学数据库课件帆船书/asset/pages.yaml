- pgno: 326
  md: '# Third Normal Form: Motivation


    +   - There are some situations where

    +     - BCNF is not dependency preserving, and

    +     - efficient checking for FD violation on updates is important

    +   - Solution: define a weaker normal form, called Third Normal Form (3NF)

    +     - Allows some redundancy (with resultant problems; we will see examples
    later)

    +     - But functional dependencies can be checked on individual relations without
    computing a join.

    +     - There is always a lossless-join, dependency-preserving decomposition into
    3NF.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 3NF Example


    +   Relation dept_advisor.

    +   - dept_advisor (s_ID, i_ID, dept_name)

    +     F = {s_ID, dept_name → i_ID, i_ID → dept_name}

    +   - Two candidate keys: s_ID, dept_name, and i_ID, s_ID

    +   - R is in 3NF

    +     - s_ID, dept_name → i_ID  s_ID

    +       - dept_name is a superkey

    +     - i_ID → dept_name

    +       - dept_name is contained in a candidate key'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Redundancy in 3NF


    +   There is some redundancy in this schema


    +   Example of problems due to redundancy in 3NF


    +   R = (J, K, L)

    +   F = {JK → L, L → K}


    | J | L | K |

    |---|---|---|

    | j₁ | l₁ | k₁ |

    | j₂ | l₁ | k₁ |

    | j₃ | l₁ | k₁ |

    | null | l₂ | k₂ |


    +   repetition of information (e.g., the relationship l₁, k₁)


    +   (i_ID, dept_name)


    +   need to use null values (e.g., to represent the relationship l₂, k₂ where
    there is no corresponding value for J).


    +   (i_ID, dept_name1) if there is no separate relation mapping instructors to
    departments'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Testing for 3NF


    +   - Optimization: Need to check only FDs in F, need not check all FDs in F⁺.

    +   - Use attribute closure to check for each dependency α → β, if α is a superkey.

    +   - If α is not a superkey, we have to verify if each attribute in β is contained
    in a candidate key of R

    +     - this test is rather more expensive, since it involve finding candidate
    keys

    +     - testing for 3NF has been shown to be NP-hard

    +     - Interestingly, decomposition into third normal form (described shortly)
    can be done in polynomial time'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# 3NF Decomposition Algorithm\n\n```\nLet F_c be a canonical cover for F;\n\
    \ i := 0;\n for each functional dependency α → β in F_c do\n  if none of the schemas\
    \ R_j, 1 ≤ j ≤ i contains α β\n   then begin\n    i := i + 1;\n    R_i := α β\n\
    \   end\n if none of the schemas R_j, 1 ≤ j ≤ i contains a candidate key for R\n\
    \ then begin\n  i := i + 1;\n  R_i := any candidate key for R;\n end\n /* Optionally,\
    \ remove redundant relations */\n repeat\n  if any schema R_j is contained in\
    \ another schema R_k\n   then /* delete R_j */\n    R_j = R;;\n    i=i-1;\n return\
    \ (R1, R2, ..., R_i)\n```"
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 3NF Decomposition Algorithm (Cont.)


    +   Above algorithm ensures:

    +   - each relation schema $R_i$ is in 3NF

    +   - decomposition is dependency preserving and lossless-join

    +   - Proof of correctness is at end of this presentation (click here)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 3NF Decomposition: An Example


    +   - Relation schema:

    +     *cust_banker_branch = (customer_id, employee_id, branch_name, type)*

    +   - The functional dependencies for this relation schema are:

    +     1. *customer_id, employee_id → branch_name, type*

    +     2. *employee_id → branch_name*

    +     3. *customer_id, branch_name → employee_id*

    +   - We first compute a canonical cover

    +     - *branch_name* is extraneous in the r.h.s. of the 1st dependency

    +     - No other attribute is extraneous, so we get F_C =

    +       *customer_id, employee_id → type*

    +       *employee_id → branch_name*

    +       *customer_id, branch_name → employee_id*'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 3NF Decomposition Example (Cont.)


    +   - The **for** loop generates following 3NF schema:

    +     (customer_id, employee_id, type )

    +     (employee_id, branch_name)

    +     (customer_id, branch_name, employee_id)

    +     - Observe that (customer_id, employee_id, type ) contains a candidate key
    of the original schema, so no further relation schema needs be added


    +   - At end of for loop, detect and delete schemas, such as (employee_id, branch_name),
    which are subsets of other schemas

    +     - result will not depend on the order in which FDs are considered


    +   - The resultant simplified 3NF schema is:

    +     (customer_id, employee_id, type)

    +     (customer_id, branch_name, employee_id)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Comparison of BCNF and 3NF


    +   - It is always possible to decompose a relation into a set of relations that
    are in 3NF such that:

    +     - the decomposition is lossless

    +     - the dependencies are preserved

    +   - It is always possible to decompose a relation into a set of relations that
    are in BCNF such that:

    +     - the decomposition is lossless

    +     - it may not be possible to preserve dependencies.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Design Goals


    Goal for a relational database design is:


    +   - BCNF.

    +   - Lossless join.

    +   - Dependency preservation.


    If we cannot achieve this, we accept one of


    +   - Lack of dependency preservation

    +   - Redundancy due to use of 3NF


    Interestingly, SQL does not provide a direct way of specifying functional dependencies
    other than superkeys. Can specify FDs using assertions, but they are expensive
    to test, (and currently not supported by any of the widely used databases!)


    Even if we had a dependency preserving decomposition, using SQL we would not be
    able to efficiently test a functional dependency whose left hand side is not a
    key.'
  merge: -1
  img_proc: true
