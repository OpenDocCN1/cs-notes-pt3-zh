- pgno: 224
  md: '# Ranking


    +   - Ranking is done in conjunction with an order by specification.

    +   - Suppose we are given a relation

    +     *student_grades(ID, GPA)*

    +     giving the grade-point average of each student

    +   - Find the rank of each student.

    +     **select** *ID*, **rank() over (order by** *GPA* **desc) as** *s_rank*

    +     **from** *student_grades*

    +   - An extra **order by** clause is needed to get them in sorted order

    +     **select** *ID*, **rank() over (order by** *GPA* **desc) as** *s_rank*

    +     **from** *student_grades*

    +     **order by** *s_rank*

    +   - Ranking may leave gaps: e.g. if 2 students have the same top GPA, both have
    rank 1, and the next rank is 3

    +     - **dense_rank** does not leave gaps, so next dense rank would be 2'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Ranking


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_225_0.png)


    +   Ranking can be done using basic SQL aggregation, but resultant query is very
    inefficient


    ```

    select ID, (1 + (select count(*)

    from student_grades B

    where B.GPA > A.GPA)) as s_rank

    from student_grades A

    order by s_rank;

    ```'
  merge: -1
  img_proc: true
- pgno: 226
  md: "# Ranking (Cont.)\n\n+   - Ranking can be done within partition of the data.\n\
    +   - “Find the rank of students within each department.”\n+   - Multiple rank\
    \ clauses can occur in a single select clause.\n+   - Ranking is done after applying\
    \ group by clause/aggregation\n+   - Can be used to find top-n results\n+    \
    \ - More general than the limit n clause supported by many databases, since it\
    \ allows top-n within each partition\n\n```\nselect ID, dept_name,\n  rank() over\
    \ (partition by dept_name order by GPA desc)\n    as dept_rank\nfrom dept_grades\n\
    order by dept_name, dept_rank;\n```"
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Ranking (Cont.)


    +   - Other ranking functions:

    +     - **percent_rank** (within partition, if partitioning is done)

    +     - **cume_dist** (cumulative distribution)

    +       - fraction of tuples with preceding values

    +     - **row_number** (non-deterministic in presence of duplicates)

    +   - SQL:1999 permits the user to specify **nulls first** or **nulls last**

    +     **select** *ID*,

    +     **rank ( ) over (order by** *GPA* **desc nulls last)** as *s_rank*

    +     **from** *student_grades*'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Ranking (Cont.)


    +   - For a given constant *n*, the ranking the function *ntile(n)* takes the
    tuples in each partition in the specified order, and divides them into *n* buckets
    with equal numbers of tuples.

    +   - E.g.,

    +     ```sql

    +     select ID, ntile(4) over (order by GPA desc) as quartile

    +     from student_grades;

    +     ```'
  merge: -1
