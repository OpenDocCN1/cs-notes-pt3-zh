- pgno: 300
  md: '# Functional-Dependency Theory


    +   - We now consider the formal theory that tells us which functional dependencies
    are implied logically by a given set of functional dependencies.

    +   - We then develop algorithms to generate lossless decompositions into BCNF
    and 3NF

    +   - We then develop algorithms to test if a decomposition is dependency-preserving


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Closure of a Set of Functional Dependencies


    +   - Given a set *F* set of functional dependencies, there are certain other
    functional dependencies that are logically implied by *F*.

    +     - For e.g.: If *A* → *B* and *B* → *C*, then we can infer that *A* → *C*


    +   - The set of **all** functional dependencies logically implied by *F* is the
    **closure** of *F*.


    +   - We denote the *closure* of *F* by *F⁺*.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Closure of a Set of Functional Dependencies


    We can find F⁺, the closure of F, by repeatedly applying Armstrong’s Axioms:


    +   - if β ⊆ α, then α → β  (reflexivity)

    +   - if α → β, then γ α → γ β  (augmentation)

    +   - if α → β, and β → γ, then α → γ  (transitivity)


    These rules are


    +   - sound (generate only functional dependencies that actually hold), and

    +   - complete (generate all functional dependencies that hold).'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Example


    +   - R = (A, B, C, G, H, I)

    +     F = { A → B

    +       A → C

    +       CG → H

    +       CG → I

    +       B → H }


    +   - some members of F⁺

    +     - A → H

    +       - by transitivity from A → B and B → H

    +     - AG → I

    +       - by augmenting A → C with G, to get AG → CG and then transitivity with
    CG → I

    +     - CG → HI

    +       - by augmenting CG → I to infer CG → CGI, and augmenting of CG → H to
    infer CGI → HI, and then transitivity


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_303_0.png)'
  merge: -1
  img_proc: true
- pgno: 304
  md: "# Procedure for Computing F⁺\n\nTo compute the closure of a set of functional\
    \ dependencies F:\n\n```\nF⁺ = F\nrepeat\n    for each functional dependency f\
    \ in F⁺\n        apply reflexivity and augmentation rules on f\n        add the\
    \ resulting functional dependencies to F⁺\n    for each pair of functional dependencies\
    \ f₁ and f₂ in F⁺\n        if f₁ and f₂ can be combined using transitivity\n \
    \           then add the resulting functional dependency to F⁺\nuntil F⁺ does\
    \ not change any further\n```\n\nNOTE: We shall see an alternative procedure for\
    \ this task later"
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Closure of Functional Dependencies (Cont.)


    +   Additional rules:

    +   - If α → β holds and α → γ holds, then α → βγ holds (**union**)

    +   - If α → βγ holds, then α → β holds and α → γ holds (**decomposition**)

    +   - If α → β holds and γβ → δ holds, then αγ → δ holds (**pseudotransitivity**)


    The above rules can be inferred from Armstrong''s axioms.'
  merge: -1
  img_proc: true
- pgno: 306
  md: "# Closure of Attribute Sets\n\n![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_306_0.png)\n\
    \n+   - Given a set of attributes α, define the closure of α under F (denoted\
    \ by α⁺) as the set of attributes that are functionally determined by α under\
    \ F\n\n+   - Algorithm to compute α⁺, the closure of α under F\n\n```\nresult\
    \ := α;\nwhile (changes to result) do\n  for each β → γ in F do\n    begin\n \
    \     if β ⊆ result then result := result ∪ γ\n    end\n```"
  merge: -1
  img_proc: true
- pgno: 307
  md: "# Example of Attribute Set Closure\n\n+   - $R = (A, B, C, G, H, I)$\n+   -\
    \ $F = \\{A \\rightarrow B$\n+     $A \\rightarrow C$\n+     $CG \\rightarrow\
    \ H$\n+     $CG \\rightarrow I$\n+     $B \\rightarrow H\\}$\n+   - $(AG)^+$ \n\
    +     1. result = AG\n+     2. result = ABCG  $(A \\rightarrow C \\text{ and }\
    \ A \\rightarrow B)$\n+     3. result = ABCGH  $(CG \\rightarrow H \\text{ and\
    \ } CG \\subseteq AGBC)$\n+     4. result = ABCGHI  $(CG \\rightarrow I \\text{\
    \ and } CG \\subseteq AGBCH)$\n+   - Is AG a candidate key?\n+     1. Is AG a\
    \ super key?\n+        1. Does $AG \\rightarrow R$? == Is $(AG)^+ \\supseteq R$\n\
    +     2. Is any subset of AG a superkey?\n+        1. Does $A \\rightarrow R$?\
    \ == Is $(A)^+ \\supseteq R$\n+        2. Does $G \\rightarrow R$? == Is $(G)^+\
    \ \\supseteq R$"
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Uses of Attribute Closure


    There are several uses of the attribute closure algorithm:


    +   - Testing for superkey:

    +     - To test if α is a superkey, we compute α⁺ and check if α⁺ contains all
    attributes of R.

    +   - Testing functional dependencies

    +     - To check if a functional dependency α → β holds (or, in other words, is
    in F⁺), just check if β ⊆ α⁺.

    +     - That is, we compute α⁺ by using attribute closure, and then check if it
    contains β.

    +     - Is a simple and cheap test, and very useful

    +   - Computing closure of F

    +     - For each γ ⊆ R, we find the closure γ⁺, and for each S ⊆ γ⁺, we output
    a functional dependency γ → S.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_308_0.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Canonical Cover


    +   - Sets of functional dependencies may have redundant dependencies that can
    be inferred from the others

    +     - For example: A → C is redundant in: {A → B,  B → C, A → C}

    +     - Parts of a functional dependency may be redundant

    +       - E.g.: on RHS: {A → B,  B → C,  A → CD} can be simplified to

    +         {A → B,  B → C,  A → D}

    +       - E.g.: on LHS: {A → B,  B → C,  AC → D} can be simplified to

    +         {A → B,  B → C,  A → D}

    +   - Intuitively, a canonical cover of F is a “minimal” set of functional dependencies
    equivalent to F, having no redundant dependencies or redundant parts of dependencies'
  merge: -1
  img_proc: true
