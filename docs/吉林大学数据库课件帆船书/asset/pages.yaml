- pgno: 936
  md: '# Shared Disk


    +   - All processors can directly access all disks via an interconnection network,
    but the processors have private memories.

    +     - The memory bus is not a bottleneck

    +     - Architecture provides a degree of **fault-tolerance** — if a processor
    fails, the other processors can take over its tasks since the database is resident
    on disks that are accessible from all processors.

    +   - Examples: IBM Sysplex and DEC clusters (now part of Compaq) running Rdb
    (now Oracle Rdb) were early commercial users

    +   - Downside: bottleneck now occurs at interconnection to the disk subsystem.

    +   - Shared-disk systems can scale to a somewhat larger number of processors,
    but communication between processors is slower.'
  merge: -1
  img_proc: true
- pgno: 937
  md: '# Shared Nothing


    +   - Node consists of a processor, memory, and one or more disks. Processors
    at one node communicate with another processor at another node using an interconnection
    network. A node functions as the server for the data on the disk or disks the
    node owns.

    +   - Examples: Teradata, Tandem, Oracle-n CUBE

    +   - Data accessed from local disks (and local memory accesses) do not pass through
    interconnection network, thereby minimizing the interference of resource sharing.

    +   - Shared-nothing multiprocessors can be scaled up to thousands of processors
    without interference.

    +   - Main drawback: cost of communication and non-local disk access; sending
    data involves software interaction at both ends.'
  merge: -1
  img_proc: true
- pgno: 938
  md: '# Hierarchical


    +   - Combines characteristics of shared-memory, shared-disk, and shared-nothing
    architectures.

    +   - Top level is a shared-nothing architecture — nodes connected by an interconnection
    network, and do not share disks or memory with each other.

    +   - Each node of the system could be a shared-memory system with a few processors.

    +   - Alternatively, each node could be a shared-disk system, and each of the
    systems sharing a set of disks could be a shared-memory system.

    +   - Reduce the complexity of programming such systems by **distributed virtual-memory**
    architectures

    +     - Also called **non-uniform memory architecture (NUMA)**'
  merge: -1
  img_proc: true
- pgno: 939
  md: '# Distributed Systems


    +   - Data spread over multiple machines (also referred to as **sites** or **nodes**).\n-
    Network interconnects the machines\n- Data shared by users on multiple machines


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_939_0.png)'
  merge: -1
  img_proc: true
- pgno: 940
  md: '# Distributed Databases


    +   - Homogeneous distributed databases

    +     - Same software/schema on all sites, data may be partitioned among sites

    +     - Goal: provide a view of a single database, hiding details of distribution

    +   - Heterogeneous distributed databases

    +     - Different software/schema on different sites

    +     - Goal: integrate existing databases to provide useful functionality

    +   - Differentiate between *local* and *global* transactions

    +     - A **local transaction** accesses data in the *single* site at which the
    transaction was initiated.

    +     - A **global transaction** either accesses data in a site different from
    the one at which the transaction was initiated or accesses data in several different
    sites.'
  merge: -1
  img_proc: true
- pgno: 941
  md: '# Trade-offs in Distributed Systems


    +   - Sharing data – users at one site able to access the data residing at some
    other sites.

    +   - Autonomy – each site is able to retain a degree of control over data stored
    locally.

    +   - Higher system availability through redundancy — data can be replicated at
    remote sites, and system can function even if a site fails.

    +   - Disadvantage: added complexity required to ensure proper coordination among
    sites.

    +     - Software development cost.

    +     - Greater potential for bugs.

    +     - Increased processing overhead.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_941_0.png)'
  merge: -1
  img_proc: true
- pgno: 942
  md: '# Implementation Issues for Distributed Databases


    +   Atomicity needed even for transactions that update data at multiple sites


    +   The two-phase commit protocol (2PC) is used to ensure atomicity


    +   • Basic idea: each site executes transaction until just before commit, and
    the leaves final decision to a coordinator


    +   • Each site must follow decision of coordinator, even if there is a failure
    while waiting for coordinators decision


    +   2PC is not always appropriate: other transaction models based on persistent
    messaging, and workflows, are also used


    +   Distributed concurrency control (and deadlock detection) required


    +   Data items may be replicated to improve data availability


    +   Details of above in Chapter 22'
  merge: -1
  img_proc: true
- pgno: 943
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_943_0.png)


    # # Network Types


    +   - Local-area networks (LANs) – composed of processors that are distributed
    over small geographical areas, such as a single building or a few adjacent buildings.

    +   - Wide-area networks (WANs) – composed of processors distributed over a large
    geographical area.'
  merge: -1
