  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1059_0.png)


    # Availability'
  merge: -1
  img_proc: true
- pgno: 1060
  md: '# Availability


    +   - High availability: time for which system is not fully usable should be extremely
    low (e.g. 99.99% availability)

    +   - Robustness: ability of system to function spite of failures of components

    +   - Failures are more likely in large distributed systems

    +   - To be robust, a distributed system must

    +     - Detect failures

    +     - Reconfigure the system so computation may continue

    +     - Recovery/reintegration when a site or link is repaired

    +   - Failure detection: distinguishing link failure from site failure is hard

    +     - (partial) solution: have multiple links, multiple link failure is likely
    a site failure


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1060_0.png)'
  merge: -1
  img_proc: true
- pgno: 1061
  md: '# Reconfiguration


    +   - Reconfiguration:

    +     - Abort all transactions that were active at a failed site

    +       - Making them wait could interfere with other transactions since they
    may hold locks on other sites

    +       - However, in case only some replicas of a data item failed, it may be
    possible to continue transactions that had accessed data at a failed site (more
    on this later)

    +     - If replicated data items were at failed site, update system catalog to
    remove them from the list of replicas.

    +       - This should be reversed when failed site recovers, but additional care
    needs to be taken to bring values up to date

    +     - If a failed site was a central server for some subsystem, an **election**
    must be held to determine the new server

    +       - E.g. name server, concurrency coordinator, global deadlock detector'
  merge: -1
  img_proc: true
- pgno: 1062
  md: '# Reconfiguration (Cont.)


    +   - Since network partition may not be distinguishable from site failure, the
    following situations must be avoided

    +     - Two ore more central servers elected in distinct partitions

    +     - More than one partition updates a replicated data item

    +   - Updates must be able to continue even if some sites are down

    +   - Solution: majority based approach

    +     - Alternative of “read one write all available” is tantalizing but causes
    problems'
  merge: -1
  img_proc: true
- pgno: 1063
  md: '# Majority-Based Approach


    +   - The majority protocol for distributed concurrency control can be modified
    to work even if some sites are unavailable

    +     - Each replica of each item has a **version number** which is updated when
    the replica is updated, as outlined below

    +     - A lock request is sent to at least ½ the sites at which item replicas
    are stored and operation continues only when a lock is obtained on a majority
    of the sites

    +     - Read operations look at all replicas locked, and read the value from the
    replica with largest version number

    +       - May write this value and version number back to replicas with lower
    version numbers (no need to obtain locks on all replicas for this task)'
  merge: -1
  img_proc: true
- pgno: 1064
  md: '# Majority-Based Approach


    +   - Majority protocol (Cont.)

    +     - Write operations

    +       - find highest version number like reads, and set new version number to
    old highest version + 1

    +       - Writes are then performed on all locked replicas and version number
    on these replicas is set to new version number

    +     - Failures (network and site) cause no problems as long as

    +       - Sites at commit contain a majority of replicas of any updated data items

    +       - During reads a majority of replicas are available to find version numbers

    +       - Subject to above, 2 phase commit can be used to update replicas

    +     - Note: reads are guaranteed to see latest version of data item

    +     - Reintegration is trivial: nothing needs to be done

    +   - Quorum consensus algorithm can be similarly extended'
  merge: -1
  img_proc: true
- pgno: 1065
  md: '# Read One Write All (Available)


    +   - Biased protocol is a special case of quorum consensus

    +     - Allows reads to read any one replica but updates require all replicas
    to be available at commit time (called **read one write all**)


    +   - Read one write all available (ignoring failed sites) is attractive, but
    incorrect

    +     - If failed link may come back up, without a disconnected site ever being
    aware that it was disconnected

    +     - The site then has old values, and a read from that site would return an
    incorrect value

    +     - If site was aware of failure reintegration could have been performed,
    but no way to guarantee this

    +     - With network partitioning, sites in each partition may update same item
    concurrently

    +       - believing sites in other partitions have all failed'
  merge: -1
  img_proc: true
- pgno: 1066
  md: '# Site Reintegration


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1066_0.png)


    +   - When failed site recovers, it must catch up with all updates that it missed
    while it was down

    +     - Problem: updates may be happening to items whose replica is stored at
    the site while the site is recovering

    +     - Solution 1: halt all updates on system while reintegrating a site

    +       - Unacceptable disruption

    +     - Solution 2: lock all replicas of all data items at the site, update to
    latest version, then release locks

    +       - Other solutions with better concurrency also available'
  merge: -1
  img_proc: true
- pgno: 1067
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1068
  md: '# Coordinator Selection


    +   - **Backup coordinators**

    +     - site which maintains enough information locally to assume the role of
    coordinator if the actual coordinator fails

    +     - executes the same algorithms and maintains the same internal state information
    as the actual coordinator fails executes state information as the actual coordinator

    +     - allows fast recovery from coordinator failure but involves overhead during
    normal processing.

    +   - **Election algorithms**

    +     - used to elect a new coordinator in case of failures

    +     - Example: Bully Algorithm - applicable to systems where every site can
    send a message to every other site.'
  merge: -1
  img_proc: true
- pgno: 1069
  md: '# Bully Algorithm


    +   - If site S_i sends a request that is not answered by the coordinator within
    a time interval T, assume that the coordinator has failed S_i tries to elect itself
    as the new coordinator.

    +   - S_i sends an election message to every site with a higher identification
    number, S_i then waits for any of these processes to answer within T.

    +   - If no response within T, assume that all sites with number greater than
    i have failed, S_i elects itself the new coordinator.

    +   - If answer is received S_i begins time interval T, waiting to receive a message
    that a site with a higher identification number has been elected.'
  merge: -1
  img_proc: true
