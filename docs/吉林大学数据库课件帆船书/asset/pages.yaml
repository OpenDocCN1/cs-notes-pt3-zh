- pgno: 466
  md: '# File Organization


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_466_0.png)


    +   - The database is stored as a collection of *files*. Each file is a sequence
    of *records*. A record is a sequence of fields.

    +   - One approach:

    +     - assume record size is fixed

    +     - each file has records of one particular type only

    +     - different files are used for different relations

    +   This case is easiest to implement; will consider variable length records later.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Fixed-Length Records


    +   - Simple approach:

    +     - Store record *i* starting from byte *n * (i − 1)*, where *n* is the size
    of each record.

    +     - Record access is simple but records may cross blocks

    +       - Modification: do not allow records to cross block boundaries


    +   - Deletion of record *i*: alternatives:

    +     - move records *i + 1, …, n* to *i, …, n − 1*

    +     - move record *n* to *i*

    +     - do not move records, but link all free records on a free list


