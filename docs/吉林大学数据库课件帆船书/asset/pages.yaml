- pgno: 916
  md: '# # Server System Architecture


    +   - Server systems can be broadly categorized into two kinds:

    +     - **transaction servers** which are widely used in relational database systems,
    and

    +     - **data servers**, used in object-oriented database systems'
  merge: -1
  img_proc: true
- pgno: 917
  md: '# # Transaction Servers


    +   - Also called query server systems or SQL server systems

    +     - Clients send requests to the server

    +     - Transactions are executed at the server

    +     - Results are shipped back to the client.

    +   - Requests are specified in SQL, and communicated to the server through a
    remote procedure call (RPC) mechanism.

    +   - Transactional RPC allows many RPC calls to form a transaction.

    +   - Open Database Connectivity (ODBC) is a C language application program interface
    standard from Microsoft for connecting to a server, sending SQL requests, and
    receiving results.

    +   - JDBC standard is similar to ODBC, for Java'
  merge: -1
  img_proc: true
- pgno: 918
  md: '# Transaction Server Process Structure


    +   - A typical transaction server consists of multiple processes accessing data
    in shared memory.

    +   - Server processes

    +     - These receive user queries (transactions), execute them and send results
    back

    +     - Processes may be **multithreaded**, allowing a single process to execute
    several user queries concurrently

    +     - Typically multiple multithreaded server processes

    +   - Lock manager process

    +     - More on this later

    +   - Database writer process

    +     - Output modified buffer blocks to disks continually'
  merge: -1
  img_proc: true
- pgno: 919
  md: '# Transaction Server Processes (Cont.)


    +   - Log writer process


    +     - Server processes simply add log records to log record buffer


    +     - Log writer process outputs log records to stable storage.


    +   - Checkpoint process


    +     - Performs periodic checkpoints


    +   - Process monitor process


    +     - Monitors other processes, and takes recovery actions if any of the other
    processes fail


    +     - E.g., aborting any transactions being executed by a server process and
    restarting it'
  merge: -1
  img_proc: true
- pgno: 920
  md: '# Transaction System Processes (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_920_0.png)'
  merge: -1
  img_proc: true
- pgno: 921
  md: '# Transaction System Processes (Cont.)


    +   - Shared memory contains shared data

    +     - Buffer pool

    +     - Lock table

    +     - Log buffer

    +     - Cached query plans (reused if same query submitted again)

    +   - All database processes can access shared memory

    +   - To ensure that no two processes are accessing the same data structure at
    the same time, databases systems implement **mutual exclusion** using either

    +     - Operating system semaphores

    +     - Atomic instructions such as test-and-set

    +   - To avoid overhead of interprocess communication for lock request/grant,
    each database process operates directly on the lock table

    +     - instead of sending requests to lock manager process

    +   - Lock manager process still used for deadlock detection'
  merge: -1
  img_proc: true
- pgno: 922
  md: '# Data Servers


    +   - Used in high-speed LANs, in cases where

    +     - The clients are comparable in processing power to the server

    +     - The tasks to be executed are compute intensive.

    +   - Data are shipped to clients where processing is performed, and then shipped
    results back to the server.

    +   - This architecture requires full back-end functionality at the clients.

    +   - Used in many object-oriented database systems

    +   - Issues:

    +     - Page-Shipping versus Item-Shipping

    +     - Locking

    +     - Data Caching

    +     - Lock Caching'
  merge: -1
  img_proc: true
- pgno: 923
  md: '# Data Servers (Cont.)


    +   - **Page-shipping** versus **item-shipping**

    +     - Smaller unit of shipping ⇒ more messages

    +     - Worth **prefetching** related items along with requested item

    +     - Page shipping can be thought of as a form of prefetching

    +   - Locking

    +     - Overhead of requesting and getting locks from server is high due to message
    delays

    +     - Can grant locks on requested and prefetched items; with page shipping,
    transaction is granted lock on whole page.

    +     - Locks on a prefetched item can be P{called back} by the server, and returned
    by client transaction if the prefetched item has not been used.

    +     - Locks on the page can be **deescalated** to locks on items in the page
    when there are lock conflicts. Locks on unused items can then be returned to server.'
  merge: -1
  img_proc: true
- pgno: 924
  md: '# Data Servers (Cont.)




    +   - Data can be cached at client even in between transactions

    +   - But check that data is up-to-date before it is used (**cache coherency**)

    +   - Check can be done when requesting lock on data item




    +   - Locks can be retained by client system even in between transactions

    +   - Transactions can acquire cached locks locally, without contacting server

    +   - Server **calls back** locks from clients when it receives conflicting lock
    request. Client returns lock once no local transaction is using it.

    +   - Similar to **deescalation**, but across transactions.'
  merge: -1
  img_proc: true
- pgno: 925
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_925_0.png)


    # Parallel Systems


    +   - Parallel database systems consist of multiple processors and multiple disks
    connected by a fast interconnection network.

    +   - A **coarse-grain parallel** machine consists of a small number of powerful
    processors

    +   - A **massively parallel** or **fine grain parallel** machine utilizes thousands
    of smaller processors.

    +   - Two main performance measures:

    +     - **throughput** --- the number of tasks that can be completed in a given
    time interval

    +     - **response time** --- the amount of time it takes to complete a single
    task from the time it is submitted'
  merge: -1
  img_proc: true
- pgno: 926
  md: '# Speed-Up and Scale-Up


    +   - **Speedup**: a fixed-sized problem executing on a small system is given
    to a system which is *N*-times larger.

    +     - Measured by:

    +       speedup = small system elapsed time

    +       -----------------------------

    +       large system elapsed time

    +     - Speedup is **linear** if equation equals N.

    +   - **Scaleup**: increase the size of both the problem and the system

    +     - *N*-times larger system used to perform *N*-times larger job

    +     - Measured by:

    +       scaleup = small system small problem elapsed time

    +       ---------------------------------------------

    +       big system big problem elapsed time

    +     - Scale up is **linear** if equation equals 1.'
  merge: -1
  img_proc: true
