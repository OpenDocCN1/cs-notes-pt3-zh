  merge: -1
  img_proc: true
- pgno: 823
  md: '# Data Access (Cont.)


    +   - Each transaction $T_i$ has its private work-area in which local copies of
    all data items accessed and updated by it are kept.

    +     - $T_i$''s local copy of a data item $X$ is called $x_i$.

    +   - Transferring data items between system buffer blocks and its private work-area
    done by:

    +     - **read**(X) assigns the value of data item $X$ to the local variable $x_i$.

    +     - **write**(X) assigns the value of local variable $x_i$ to data item {$X$}
    in the buffer block.

    +     - **Note:** **output**($B_X$) need not immediately follow **write**(X).
    System can perform the **output** operation when it deems fit.

    +   - Transactions

    +     - Must perform **read**(X) before accessing $X$ for the first time (subsequent
    reads can be from local copy)

    +     - **write**(X) can be executed at any time before the transaction commits'
  merge: -1
  img_proc: true
