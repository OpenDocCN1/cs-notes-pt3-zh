- pgno: 154
  md: '# Large-Object Types


    Large objects (photos, videos, CAD files, etc.) are stored as a large object:


    +   - **blob**: binary large object -- object is a large collection of uninterpreted
    binary data (whose interpretation is left to an application outside of the database
    system)

    +   - **clob**: character large object -- object is a large collection of character
    data

    +   - When a query returns a large object, a pointer is returned rather than the
    large object itself.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_155_0.png)


    # # Authorization


    Forms of authorization on parts of the database:


    +   - **Read** - allows reading, but not modification of data.

    +   - **Insert** - allows insertion of new data, but not modification of existing
    data.

    +   - **Update** - allows modification, but not deletion of data.

    +   - **Delete** - allows deletion of data.


    Forms of authorization to modify the database schema


    +   - **Index** - allows creation and deletion of indices.

    +   - **Resources** - allows creation of new relations.

    +   - **Alteration** - allows addition or deletion of attributes in a relation.

    +   - **Drop** - allows deletion of relations.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Authorization Specification in SQL


    +   - The **grant** statement is used to confer authorization

    +     **grant** <privilege list>

    +     **on** <relation name or view name> **to** <user list>


    +   - <user list> is:

    +     - a user-id

    +     - **public**, which allows all valid users the privilege granted

    +     - A role (more on this later)


    +   - Granting a privilege on a view does not imply granting any privileges on
    the underlying relations.


    +   - The grantor of the privilege must already hold the privilege on the specified
    item (or be the database administrator).'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_157_0.png)


    # Privileges in SQL


    select: allows read access to relation, or the ability to query using the view


    Example: grant users U₁, U₂, and U₃ select authorization on the instructor relation:


    ```

    grant select on instructor to U₁, U₂, U₃

    ```


    insert: the ability to insert tuples


    update: the ability to update using the SQL update statement


    delete: the ability to delete tuples.


    all privileges: used as a short form for all the allowable privileges'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Revoking Authorization in SQL\n\n+   - The **revoke** statement is used to\
    \ revoke authorization.\n+   \n+     **revoke** `<privilege list>`\n+   \n+  \
    \   **on** `<relation name or view name>` **from** `<user list>`\n+   \n+   -\
    \ Example:\n+   \n+     **revoke select on** *branch* **from** *U₁, U₂, U₃*\n\
    +   \n+   - `<privilege-list>` may be **all** to revoke all privileges the revokee\
    \ may hold.\n+   \n+   - If `<revokee-list>` includes **public**, all users lose\
    \ the privilege except those granted it explicitly.\n+   \n+   - If the same privilege\
    \ was granted twice to the same user by different grantees, the user may retain\
    \ the privilege after the revocation.\n+   \n+   - All privileges that depend\
    \ on the privilege being revoked are also revoked."
  merge: -1
  img_proc: true
