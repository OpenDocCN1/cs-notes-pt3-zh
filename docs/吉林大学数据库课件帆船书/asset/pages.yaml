  md: "# Estimation of the Size of Joins (Cont.)\n\n+   - If \\(R \\cap S = \\{A\\\
    }\\) is not a key for \\(R\\) or \\(S\\).\n+     If we assume that every tuple\
    \ \\(t\\) in \\(R\\) produces tuples in \\(R \\bowtie S\\), the number of tuples\
    \ in \\(R \\bowtie S\\) is estimated to be:\n+   \n+     \\[\n+     \\frac{n_r\
    \ \\ast n_s}{V(A,s)}\n+     \\]\n+   \n+     If the reverse is true, the estimate\
    \ obtained will be:\n+   \n+     \\[\n+     \\frac{n_r \\ast n_s}{V(A,r)}\n+ \
    \    \\]\n+   \n+     The lower of these two estimates is probably the more accurate\
    \ one.\n\n+   - Can improve on above if histograms are available\n+     - Use\
    \ formula similar to above, for each cell of histograms on the two relations"
