- pgno: 195
  md: '# Embedded SQL (Cont.)


    The open statement for our example is as follows:


    ```

    EXEC SQL open c ;

    ```


    This statement causes the database system to execute the query and to save the
    results within a temporary relation. The query uses the value of the host-language
    variable credit-amount at the time the open statement is executed.


    The fetch statement causes the values of one tuple in the query result to be placed
    on host language variables.


    ```

    EXEC SQL fetch c into :si, :sn END_EXEC

    ```


    Repeated calls to fetch get successive tuples in the query result'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Embedded SQL (Cont.)


    +   - A variable called SQLSTATE in the SQL communication area (SQLCA) gets set
    to ‘02000’ to indicate no more data is available

    +   - The close statement causes the database system to delete the temporary relation
    that holds the result of the query.


    ```

    EXEC SQL close c ;

    ```


    Note: above details vary with language. For example, the Java embedding defines
    Java iterators to step through result tuples.'
  merge: -1
  img_proc: true
