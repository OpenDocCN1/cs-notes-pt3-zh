- pgno: 1350
  md: '# Spatial Queries (Cont.)


    +   - Spatial data is typically queried using a graphical query language; results
    are also displayed in a graphical manner.

    +   - Graphical interface constitutes the front-end

    +   - Extensions of SQL with abstract data types, such as lines, polygons and
    bit maps, have been proposed to interface with back-end.

    +     - allows relational databases to store and retrieve spatial information

    +     - Queries can use spatial conditions (e.g., contains or overlaps).

    +     - queries can mix spatial and nonspatial conditions


