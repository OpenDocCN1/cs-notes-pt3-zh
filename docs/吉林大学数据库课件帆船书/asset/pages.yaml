  md: '# Server-Side Scripting


    +   - Server-side scripting simplifies the task of connecting a database to the
    Web

    +     - Define an HTML document with embedded executable code/SQL queries.

    +     - Input values from HTML forms can be used directly in the embedded code/SQL
    queries.

    +     - When the document is requested, the Web server executes the embedded code/SQL
    queries to generate the actual HTML document.

