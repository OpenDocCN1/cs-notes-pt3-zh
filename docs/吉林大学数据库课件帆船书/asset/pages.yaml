- pgno: 292
  md: '# Boyce-Codd Normal Form


    A relation schema R is in BCNF with respect to a set F of functional dependencies
    if for all functional dependencies in F+ of the form


    ```

    α → β

    ```


    where α ⊆ R and β ⊆ R, at least one of the following holds:


    +   ■ α → β is trivial (i.e., β ⊆ α)


    +   ■ α is a superkey for R


    Example schema not in BCNF:


    ```

    instr_dept (ID, name, salary, dept_name, building, budget )

    ```


    because dept_name→ building, budget holds on instr_dept, but dept_name is not
    a superkey'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Decomposing a Schema into BCNF


    Suppose we have a schema R and a non-trivial dependency α → β causes a violation
    of BCNF.


    We decompose R into:


    +   - (α U β)

    +   - ( R - ( β - α ) )


    In our example,


    +   - α = dept_name

    +   - β = building, budget

    +   - and inst_dept is replaced by

    +   - (α U β) = ( dept_name, building, budget )

    +   - ( R - ( β - α ) ) = ( ID, name, salary, dept_name )'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# BCNF and Dependency Preservation


    +   - Constraints, including functional dependencies, are costly to check in practice
    unless they pertain to only one relation

    +   - If it is sufficient to test only those dependencies on each individual relation
    of a decomposition in order to ensure that *all* functional dependencies hold,
    then that decomposition is *dependency preserving*.

    +   - Because it is not always possible to achieve both BCNF and dependency preservation,
    we consider a weaker normal form, known as *third normal form*.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Third Normal Form


    A relation schema R is in third normal form (3NF) if for all:


    α → β in F⁺


    at least one of the following holds:


    +   - α → β is trivial (i.e., β ∈ α)

    +   - α is a superkey for R

    +   - Each attribute A in β − α is contained in a candidate key for R.


    (NOTE: each attribute may be in a different candidate key)


    If a relation is in BCNF it is in 3NF (since in BCNF one of the first two conditions
    above must hold).


    Third condition is a minimal relaxation of BCNF to ensure dependency preservation
    (will see why later).'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Goals of Normalization


    +   - Let R be a relation scheme with a set F of functional dependencies.

    +   - Decide whether a relation scheme R is in “good” form.

    +   - In the case that a relation scheme R is not in “good” form, decompose it
    into a set of relation scheme {R1, R2, ..., Rn} such that

    +     - each relation scheme is in good form

    +     - the decomposition is a lossless-join decomposition

    +     - Preferably, the decomposition should be dependency preserving.'
