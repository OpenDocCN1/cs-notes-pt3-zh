  md: '# Domain Relational Calculus


    +   - A nonprocedural query language equivalent in power to the tuple relational
    calculus

    +   - Each query is an expression of the form:


    { < x₁, x₂, ..., xₙ > | P (x₁, x₂, ..., xₙ) }


    +   - x₁, x₂, ..., xₙ represent domain variables

    +   - P represents a formula similar to that of the predicate calculus'
