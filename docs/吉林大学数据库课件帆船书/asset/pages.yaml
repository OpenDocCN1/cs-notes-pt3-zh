- pgno: 1139
  md: '# Data Mining


    +   - Data mining is the process of semi-automatically analyzing large databases
    to find useful patterns

    +   - **Prediction** based on past history

    +     - Predict if a credit card applicant poses a good credit risk, based on
    some attributes (income, job type, age, ..) and past history

    +     - Predict if a pattern of phone calling card usage is likely to be fraudulent

    +   - Some examples of prediction mechanisms:

    +     - **Classification**

    +       - Given a new item whose class is unknown, predict to which class it belongs

    +     - **Regression** formulae

    +       - Given a set of mappings for an unknown function, predict the function
    result for a new parameter value'
  merge: -1
  img_proc: true
- pgno: 1140
  md: '# Data Mining (Cont.)


    # Descriptive Patterns


    +   - **Associations**

    +     - Find books that are often bought by “similar” customers. If a new such
    customer buys one such book, suggest the others too.

    +   - Associations may be used as a first step in detecting **causation**

    +     - E.g., association between exposure to chemical X and cancer,

    +   - **Clusters**

    +     - E.g., typhoid cases were clustered in an area surrounding a contaminated
    well

    +     - Detection of clusters remains important in detecting epidemics'
  merge: -1
  img_proc: true
- pgno: 1141
  md: '# Classification Rules


    +   - Classification rules help assign new objects to classes.

    +     - E.g., given a new automobile insurance applicant, should he or she be
    classified as low risk, medium risk or high risk?

    +   - Classification rules for above example could use a variety of data, such
    as as educational level, salary, age, etc.

    +     - ∀ person P, P.degree = masters and P.income > 75,000

    +       ⇒ P.credit = excellent

    +     - ∀ person P, P.degree = bachelors and

    +       (P.income ≥ 25,000 and P.income ≤ 75,000)

    +       ⇒ P.credit = good

    +   - Rules are not necessarily exact: there may be some misclassifications

    +   - Classification rules can be shown compactly as a decision tree.'
  merge: -1
  img_proc: true
- pgno: 1142
  md: '# Decision Tree


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1142_0.png)'
  merge: -1
  img_proc: true
- pgno: 1143
  md: '# Construction of Decision Trees


    +   - **Training set**: a data sample in which the classification is already known.

    +   - **Greedy** top down generation of decision trees.

    +     - Each internal node of the tree partitions the data into groups based on
    a **partitioning attribute**, and a **partitioning condition** for the node

    +     - **Leaf** node:

    +       - all (or most) of the items at the node belong to the same class, or

    +       - all attributes have been considered, and no further partitioning is
    possible.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1143_0.png)'
  merge: -1
  img_proc: true
- pgno: 1144
  md: "# Best Splits\n\n+   - Pick best attributes and conditions on which to partition\n\
    +   - The purity of a set S of training instances can be measured quantitatively\
    \ in several ways.\n+     - Notation: number of classes = k, number of instances\
    \ = |S|, fraction of instances in class i = p_i.\n+   - The Gini measure of purity\
    \ is defined as\n+     \n+     Gini (S) = 1 - Σ_{i=1}^{k} p_i²\n+     \n+    \
    \ - When all instances are in a single class, the Gini value is 0\n+     - It\
    \ reaches its maximum (of 1 − 1/k) if each class the same number of instances."
  merge: -1
  img_proc: true
- pgno: 1145
  md: '# Best Splits (Cont.)


    Another measure of purity is the entropy measure, which is defined as


    entropy (S) = − Σ_{i-1}^{k} p_i log₂ p_i


    When a set S is split into multiple sets Si, i=1, 2, ..., r, we can measure the
    purity of the resultant set of sets as:


    purity(S₁, S₂, ....., Sᵣ) = Σ_{i=1}^{r} |Sᵢ| / |S| purity (Sᵢ)


    The information gain due to particular split of S into Sᵢ, i = 1, 2, ...., r

    Information-gain (S, {S₁, S₂, ...., Sᵣ}) = purity(S ) − purity (S₁, S₂, ... Sᵣ)'
  merge: -1
  img_proc: true
- pgno: 1146
  md: '# Best Splits (Cont.)


    +   - Measure of “cost” of a split:

    +     Information-content (S, {S₁, S₂, ....., Sᵣ})) = - Σᵢ₌₁ʳ (|Sᵢ|/|S|) log₂
    (|Sᵢ|/|S|)


    +   - Information-gain ratio = Information-gain (S, {S₁, S₂, ......, Sᵣ}) / Information-content
    (S, {S₁, S₂, ....., Sᵣ})


    +   - The best split is the one that gives the maximum information gain ratio'
  merge: -1
  img_proc: true
- pgno: 1147
  md: '# Finding Best Splits


    +   - Categorical attributes (with no meaningful order):

    +     - Multi-way split, one child for each value

    +     - Binary split: try all possible breakup of values into two sets, and pick
    the best

    +   - Continuous-valued attributes (can be sorted in a meaningful order)

    +     - Binary split:

    +       - Sort values, try each as a split point

    +         - E.g., if values are 1, 10, 15, 25, split at ≤1, ≤10, ≤15

    +       - Pick the value that gives best split

    +     - Multi-way split:

    +       - A series of binary splits on the same attribute has roughly equivalent
    effect


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1147_0.png)'
  merge: -1
  img_proc: true
- pgno: 1148
  md: "# Decision-Tree Construction Algorithm\n\n```\nProcedure GrowTree (S)\n   \
    \ Partition (S);\n```\n\n```\nProcedure Partition (S)\n    if ( purity(S) > δₚ\
    \ or |S| < δₛ ) then\n        return;\n    for each attribute A\n        evaluate\
    \ splits on attribute A;\n    Use best split found (across all attributes) to\
    \ partition\n        S into S₁, S₂, ...., Sᵣ\n    for i = 1, 2, ....., r\n   \
    \     Partition (Sᵢ);\n```"
  merge: -1
  img_proc: true
- pgno: 1149
  md: '# Other Types of Classifiers


    +   - Neural net classifiers are studied in artificial intelligence and are not
    covered here

    +   - Bayesian classifiers use **Bayes theorem**, which says

    +     $$p(c_j \mid d) = \frac{p(d \mid c_j)\,p(c_j)}{p(d)}$$ where

    +     $p(c_j \mid d)$ = probability of instance $d$ being in class $c_j$,

    +     $p(d \mid c_j)$ = probability of generating instance $d$ given class $c_j$,

    +     $p(c_j)$ = probability of occurrence of class $c_j$, and

    +     $p(d)$ = probability of instance $d$ occuring


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1149_0.png)'
  merge: -1
  img_proc: true
- pgno: 1150
  md: '# Naïve Bayesian Classifiers


    +   - Bayesian classifiers require

    +     - computation of $p(d \mid c_j)$

    +     - precomputation of $p(c_j)$

    +     - $p(d)$ can be ignored since it is the same for all classes

    +   - To simplify the task, **naïve Bayesian classifiers** assume attributes have
    independent distributions, and thereby estimate

    +     $p(d \mid c_j) = p(d_1 \mid c_j) * p(d_2 \mid c_j) * ... * (p(d_n \mid c_j)$

    +     - Each of the $p(d_i \mid c_j)$ can be estimated from a histogram on $d_i$
    values for each class $c_j$

    +       - the histogram is computed from the training instances

    +     - Histograms on multiple attributes are more expensive to compute and store'
  merge: -1
  img_proc: true
- pgno: 1151
  md: '# Regression


    +   - Regression deals with the prediction of a value, rather than a class.

    +     - Given values for a set of variables, X₁, X₂, ..., Xₙ, we wish to predict
    the value of a variable Y.

    +   - One way is to infer coefficients a₀, a₁, a₁, ..., aₙ such that

    +     Y = a₀ + a₁ * X₁ + a₂ * X₂ + ... + aₙ * Xₙ

    +   - Finding such a linear polynomial is called **linear regression**.

    +     - In general, the process of finding a curve that fits the data is also
    called **curve fitting**.

    +   - The fit may only be approximate

    +     - because of noise in the data, or

    +     - because the relationship is not exactly a polynomial

    +   - Regression aims to find coefficients that give the best possible fit.'
  merge: -1
  img_proc: true
- pgno: 1152
  md: '# Association Rules


    +   - Retail shops are often interested in associations between different items
    that people buy.

    +     - Someone who buys bread is quite likely also to buy milk

    +     - A person who bought the book *Database System Concepts* is quite likely
    also to buy the book *Operating System Concepts*.


    +   - Associations information can be used in several ways.

    +     - E.g., when a customer buys a particular book, an online shop may suggest
    associated books.


    +   - **Association rules:**

    +     *bread ⇒ milk*      *DB-Concepts, OS-Concepts ⇒ Networks*

    +     - Left hand side: **antecedent**, right hand side: **consequent**

    +     - An association rule must have an associated **population**; the population
    consists of a set of **instances**

    +       - E.g., each transaction (sale) at a shop is an instance, and the set
    of all transactions is the population'
  merge: -1
  img_proc: true
- pgno: 1153
  md: '# Association Rules (Cont.)


    +   - Rules have an associated support, as well as an associated confidence.

    +   - **Support** is a measure of what fraction of the population satisfies both
    the antecedent and the consequent of the rule.

    +     - E.g., suppose only 0.001 percent of all purchases include milk and screwdrivers.
    The support for the rule is *milk* ⇒ *screwdrivers* is low.

    +   - **Confidence** is a measure of how often the consequent is true when the
    antecedent is true.

    +     - E.g., the rule *bread* ⇒ *milk* has a confidence of 80 percent if 80 percent
    of the purchases that include bread also include milk.'
  merge: -1
  img_proc: true
- pgno: 1154
  md: '# Finding Association Rules


    +   - We are generally only interested in association rules with reasonably high
    support (e.g., support of 2% or greater)

    +   - Naïve algorithm

    +     1. Consider all possible sets of relevant items.

    +     2. For each set find its support (i.e., count how many transactions purchase
    all items in the set).

    +        - Large itemsets: sets with sufficiently high support

    +     3. Use large itemsets to generate association rules.

    +        1. From itemset A generate the rule A - {b} ⇒ b for each b ∈ A.

    +           - Support of rule = support (A).

    +           - Confidence of rule = support (A) / support (A - {b})'
  merge: -1
  img_proc: true
- pgno: 1155
  md: '# Finding Support


    +   - Determine support of itemsets via a single pass on set of transactions

    +     - Large itemsets: sets with a high count at the end of the pass

    +   - If memory not enough to hold all counts for all itemsets use multiple passes,
    considering only some itemsets in each pass.

    +   - Optimization: Once an itemset is eliminated because its count (support)
    is too small none of its supersets needs to be considered.

    +   - The **a priori** technique to find large itemsets:

    +     - Pass 1: count support of all sets with just 1 item. Eliminate those items
    with low support

    +     - Pass *i*: **candidates**: every set of *i* items such that all its *i-1*
    item subsets are large

    +       - Count support of all candidates

    +       - Stop if there are no candidates'
  merge: -1
  img_proc: true
- pgno: 1156
  md: '# Other Types of Associations


    +   - Basic association rules have several limitations

    +   - Deviations from the expected probability are more interesting

    +     - E.g., if many people purchase bread, and many people purchase cereal,
    quite a few would be expected to purchase both

    +     - We are interested in **positive** as well as **negative correlations**
    between sets of items

    +       - Positive correlation: co-occurrence is higher than predicted

    +       - Negative correlation: co-occurrence is lower than predicted

    +   - Sequence associations / correlations

    +     - E.g., whenever bonds go up, stock prices go down in 2 days

    +   - Deviations from temporal patterns

    +     - E.g., deviation from a steady growth

    +     - E.g., sales of winter wear go down in summer

    +       - Not surprising, part of a known pattern.

    +       - Look for deviation from value predicted using past patterns'
  merge: -1
  img_proc: true
- pgno: 1157
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1157_0.png)


    # Clustering


    Clustering: Intuitively, finding clusters of points in the given data such that
    similar points lie in the same cluster


    Can be formalized using distance metrics in several ways


    +   Group points into k sets (for a given k) such that the average distance of
    points from the centroid of their assigned group is minimized


    Centroid: point defined by taking average of coordinates in each dimension.


    Another metric: minimize average distance between every pair of points in a cluster


    Has been studied extensively in statistics, but on small data sets


    Data mining systems aim at clustering techniques that can handle very large data
    sets


    E.g., the Birch clustering algorithm (more shortly)'
  merge: -1
  img_proc: true
- pgno: 1158
  md: '# # Hierarchical Clustering


    Example from biological classification


    (the word classification here does not mean a prediction mechanism)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1158_0.png)


    Other examples: Internet directory systems (e.g., Yahoo, more on this later)




    +   - Build small clusters, then cluster small clusters into bigger clusters,
    and so on




    +   - Start with all items in a single cluster, repeatedly refine (break) clusters
    into smaller ones'
  merge: -1
  img_proc: true
- pgno: 1159
  md: '# Clustering Algorithms


    +   - Clustering algorithms have been designed to handle very large datasets

    +   - E.g., the **Birch algorithm**

    +     - Main idea: use an in-memory R-tree to store points that are being clustered

    +     - Insert points one at a time into the R-tree, merging a new point with
    an existing cluster if is less than some δ distance away

    +     - If there are more leaf nodes than fit in memory, merge existing clusters
    that are close to each other

    +     - At the end of first pass we get a large number of clusters at the leaves
    of the R-tree

    +       - Merge clusters to reduce the number of clusters'
  merge: -1
  img_proc: true
- pgno: 1160
  md: '# Collaborative Filtering


    +   - Goal: predict what movies/books/... a person may be interested in, on the
    basis of

    +     - Past preferences of the person

    +     - Other people with similar past preferences

    +     - The preferences of such people for a new movie/book/...

    +   - One approach based on repeated clustering

    +     - Cluster people on the basis of preferences for movies

    +     - Then cluster movies on the basis of being liked by the same clusters of
    people

    +     - Again cluster people based on their preferences for (the newly created
    clusters of) movies

    +     - Repeat above till equilibrium

    +   - Above problem is an instance of **collaborative filtering**, where users
    collaborate in the task of filtering information to find information of interest'
  merge: -1
  img_proc: true
