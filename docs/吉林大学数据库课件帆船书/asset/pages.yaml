- pgno: 1135
  md: '# Design Issues


    +   - *When and how to gather data*

    +     - **Source driven architecture**: data sources transmit new information
    to warehouse, either continuously or periodically (e.g., at night)

    +     - **Destination driven architecture**: warehouse periodically requests new
    information from data sources

    +     - Keeping warehouse exactly synchronized with data sources (e.g., using
    two-phase commit) is too expensive

    +       - Usually OK to have slightly out-of-date data at warehouse

    +       - Data/updates are periodically downloaded form online transaction processing
    (OLTP) systems.

    +   - *What schema to use*

    +     - Schema integration'
  merge: -1
  img_proc: true
- pgno: 1136
  md: '# More Warehouse Design Issues


    +   - *Data cleansing*

    +     - E.g., correct mistakes in addresses (misspellings, zip code errors)

    +     - **Merge** address lists from different sources and **purge** duplicates

    +   - *How to propagate updates*

    +     - Warehouse schema may be a (materialized) view of schema from data sources

    +   - *What data to summarize*

    +     - Raw data may be too large to store on-line

    +     - Aggregate values (totals/subtotals) often suffice

    +     - Queries on raw data can often be transformed by query optimizer to use
    aggregate values'
  merge: -1
  img_proc: true
- pgno: 1137
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1137_0.png)


    # Warehouse Schemas


    +   - Dimension values are usually encoded using small integers and mapped to
    full values via dimension tables

    +   - Resultant schema is called a **star schema**

    +     - More complicated schema structures

    +       - **Snowflake schema**: multiple levels of dimension tables

    +       - **Constellation**: multiple fact tables'
  merge: -1
