- pgno: 1336
  md: '# Time Specification in SQL-92


    +   - **date**: four digits for the year (1--9999), two digits for the month (1--12),
    and two digits for the date (1--31).

    +   - **time**: two digits for the hour, two digits for the minute, and two digits
    for the second, plus optional fractional digits.

    +   - **timestamp**: the fields of **date** and **time**, with six fractional
    digits for the seconds field.

    +   - Times are specified in the *Universal Coordinated Time*, abbreviated UTC
    (from the French); supports **time with time zone**.

    +   - **interval**: refers to a period of time (e.g., 2 days and 5 hours), without
    specifying a particular time when this period starts; could more accurately be
    termed a *span*.'
  merge: -1
  img_proc: true
- pgno: 1337
  md: '# # Temporal Query Languages


    +   - Predicates *precedes*, *overlaps*, and *contains* on time intervals.

    +   - *Intersect* can be applied on two intervals, to give a single (possibly
    empty) interval; the union of two intervals may or may not be a single interval.

    +   - A **snapshot** of a temporal relation at time t consists of the tuples that
    are valid at time t, with the time-interval attributes projected out.

    +   - **Temporal selection:** involves time attributes

    +   - **Temporal projection:** the tuples in the projection inherit their time-intervals
    from the tuples in the original relation.

    +   - **Temporal join:** the time-interval of a tuple in the result is the intersection
    of the time-intervals of the tuples from which it is derived. It intersection
    is empty, tuple is discarded from join.'
  merge: -1
  img_proc: true
- pgno: 1338
  md: '# Temporal Query Languages (Cont.)


    +   - Functional dependencies must be used with care: adding a time field may
    invalidate functional dependency

    +   - A **temporal functional dependency** x \xrightarrow{\tau} Y holds on a relation
    schema R if, for all legal instances r of R, all snapshots of r satisfy the functional
    dependency X → Y.

    +   - SQL:1999 Part 7 (SQL/Temporal) is a proposed extension to SQL:1999 to improve
    support of temporal data.'
  merge: -1
  img_proc: true
