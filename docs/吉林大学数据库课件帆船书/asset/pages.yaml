- pgno: 212
  md: '# Triggers


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_212_0.png)


    +   - A **trigger** is a statement that is executed automatically by the system
    as a side effect of a modification to the database.

    +   - To design a trigger mechanism, we must:

    +     - Specify the conditions under which the trigger is to be executed.

    +     - Specify the actions to be taken when the trigger executes.

    +   - Triggers introduced to SQL standard in SQL:1999, but supported even earlier
    using non-standard syntax by most databases.

    +     - Syntax illustrated here may not work exactly on your database system;
    check the system manuals'
  merge: -1
  img_proc: true
- pgno: 213
  md: "# Triggering Events and Actions in SQL\n\n+   - Triggering event can be **insert**,\
    \ **delete** or **update**\n+   - Triggers on update can be restricted to specific\
    \ attributes\n+     - For example, **after update of** *takes* **on** *grade*\n\
    +   - Values of attributes before and after an update can be referenced\n+   \
    \  - **referencing old row as** : for deletes and updates\n+     - **referencing\
    \ new row as** : for inserts and updates\n+   - Triggers can be activated before\
    \ an event, which can serve as extra constraints. For example, convert blank grades\
    \ to null.\n\n```\ncreate trigger setnull_trigger before update of takes\nreferencing\
    \ new row as nrow\nfor each row\nwhen (nrow.grade = ' ')\nbegin atomic\n  set\
    \ nrow.grade = null;\nend;\n```"
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Trigger to Maintain credits_earned value\n\n```\ncreate trigger credits_earned\
    \ after update of takes on (grade)\nreferencing new row as nrow\nreferencing old\
    \ row as orow\nfor each row\nwhen nrow.grade <> 'F' and nrow.grade is not null\n\
    and (orow.grade = 'F' or orow.grade is null)\nbegin atomic\n  update student\n\
    \  set tot_cred= tot_cred +\n    (select credits\n     from course\n     where\
    \ course.course_id= nrow.course_id)\n  where student.id = nrow.id;\nend;\n```"
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Statement Level Triggers


    Instead of executing a separate action for each affected row, a single action
    can be executed for all rows affected by a transaction


    +   - Use **for each statement** instead of **for each row**

    +   - Use **referencing old table** or **referencing new table** to refer to temporary
    tables (called *transition tables*) containing the affected rows

    +   - Can be more efficient when dealing with SQL statements that update a large
    number of rows'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# When Not To Use Triggers


    +   - Triggers were used earlier for tasks such as

    +     - Maintaining summary data (e.g., total salary of each department)

    +     - Replicating databases by recording changes to special relations (called
    change or delta relations) and having a separate process that applies the changes
    over to a replica


    +   - There are better ways of doing these now:

    +     - Databases today provide built in materialized view facilities to maintain
    summary data

    +     - Databases provide built-in support for replication


    +   - Encapsulation facilities can be used instead of triggers in many cases

    +     - Define methods to update fields

    +     - Carry out actions as part of the update methods instead of through a trigger'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# When Not To Use Triggers (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_217_0.png)


    +   - Risk of unintended execution of triggers, for example, when

    +     - Loading data from a backup copy

    +     - Replicating updates at a remote site

    +     - Trigger execution can be disabled before such actions.

    +   - Other risks with triggers:

    +     - Error leading to failure of critical transactions that set off the trigger

    +     - Cascading execution'
  merge: -1
  img_proc: true
