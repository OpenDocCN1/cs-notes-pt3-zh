- pgno: 1118
  md: '# Three Phase Commit (3PC)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1118_0.png)


    +   - No network partitioning

    +   - At any point, at least one site must be up.

    +   - At most K sites (participants as well as coordinator) can fail


    Phase 1: Obtaining Preliminary Decision: Identical to 2PC Phase 1.


    +   - Every site is ready to commit if instructed to do so

    +   - Under 2 PC each site is obligated to wait for decision from coordinator

    +   - Under 3PC, knowledge of pre-commit decision can be used to commit despite
    coordinator failure.'
  merge: -1
  img_proc: true
- pgno: 1119
  md: '# 3PC: Phase 2. Recording the Preliminary Decision


    +   - Coordinator adds a decision record (<abort T> or < precommit T>) in its
    log and forces record to stable storage.

    +   - Coordinator sends a message to each participant informing it of the decision

    +   - Participant records decision in its log

    +   - If abort decision reached then participant aborts locally

    +   - If pre-commit decision reached then participant replies with <acknowledge
    T>'
  merge: -1
  img_proc: true
- pgno: 1120
  md: '# 3PC: Phase 3. Recording Decision in the Database


    +   - Executed only if decision in phase 2 was to precommit

    +   - Coordinator collects acknowledgements. It sends <commit T> message to the
    participants as soon as it receives K acknowledgements.

    +   - Coordinator adds the record <commit T> in its log and forces record to stable
    storage.

    +   - Coordinator sends a message to each participant to <commit T>

    +   - Participants take appropriate action locally'
  merge: -1
  img_proc: true
- pgno: 1121
  md: '# 3PC: Handling Site Failure


    +   - **Site Failure.** Upon recovery, a participating site examines its log and
    does the following:

    +     - Log contains **<commit T>** record: no action

    +     - Log contains **<abort T>** record: no action

    +     - Log contains **<ready T>** record, but no **<abort T>** or **<precommit
    T>** record: site consults Ci to determine the fate of T.

    +       - if Ci says *T* aborted, site executes **undo (T)** (and writes **<abort
    T>** record)

    +       - if Ci says T committed, site executes **redo (T)** (and writes **<commit
    T>** record)

    +       - if *c* says *T* committed, site resumes the protocol from receipt of
    **precommit T** message (thus recording **<precommit T>** in the log, and sending
    **acknowledge T** message sent to coordinator).'
  merge: -1
  img_proc: true
- pgno: 1122
  md: '# 3PC: Handling Site Failure (Cont.)


    +   - Log contains <precommit T> record, but no <abort T> or <commit T>: site
    consults Ci to determine the fate of T.

    +     - if Ci says T aborted, site executes **undo** (T)

    +     - if Ci says T committed, site executes **redo** (T)

    +     - if Ci says T still in precommit state, site resumes protocol at this point

    +   - Log contains no <ready T> record for a transaction T: site executes **undo**
    (T) writes <abort T> record'
  merge: -1
  img_proc: true
