- pgno: 1093
  md: '# Local vs. Global Serializability


    +   - The guarantee of local serializability is not sufficient to ensure global
    serializability.

    +     - As an illustration, consider two global transactions T1 and T2, each of
    which accesses and updates two data items, A and B, located at sites S1 and S2
    respectively.

    +     - It is possible to have a situation where, at site S1, T2 follows T1, whereas,
    at S2, T1 follows T2, resulting in a nonserializable global schedule.

    +   - If the local systems permit control of locking behavior and all systems
    follow two-phase locking

    +     - the multidatabase system can ensure that global transactions lock in a
    two-phase manner

    +     - the lock points of conflicting transactions would then define their global
    serialization order.'
  merge: -1
  img_proc: true
