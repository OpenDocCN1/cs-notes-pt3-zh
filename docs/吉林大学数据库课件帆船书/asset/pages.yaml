- pgno: 798
  md: '# Benefits of SI


    +   - Reading is *never* blocked,

    +     - and also doesn’t block other txns activities

    +   - Performance similar to Read Committed

    +   - Avoids the usual anomalies

    +     - No dirty read

    +     - No lost update

    +     - No non-repeatable read

    +     - Predicate based selects are repeatable (no phantoms)

    +   - Problems with SI

    +     - SI does not always give serializable executions

    +       - Serializable: among two concurrent txns, one sees the effects of the
    other

    +       - In SI: neither sees the effects of the other

    +     - Result: Integrity constraints can be violated'
  merge: -1
  img_proc: true
- pgno: 799
  md: '# Snapshot Isolation


    +   - E.g. of problem with SI

    +     - T1: x:=y

    +     - T2: y:= x

    +     - Initially x = 3 and y = 17

    +       - Serial execution: x = ??, y = ??

    +       - if both transactions start at the same time, with snapshot isolation:
    x = ?? , y = ??


    +   - Called **skew write**


    +   - Skew also occurs with inserts

    +     - E.g:

    +       - Find max order number among all orders

    +       - Create a new order with order number = previous max + 1'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# Snapshot Isolation Anomalies


    +   - SI breaks serializability when txns modify *different* items, each based
    on a previous state of the item the other modified

    +     - Not very common in practice

    +       - E.g., the TPC-C benchmark runs correctly under SI

    +       - when txns conflict due to modifying different data, there is usually
    also a shared item they both modify too (like a total quantity) so SI will abort
    one of them

    +     - But does occur

    +       - Application developers should be careful about write skew

    +   - SI can also cause a read-only transaction anomaly, where read-only transaction
    may see an inconsistent state even if updaters are serializable

    +     - We omit details

    +   - Using snapshots to verify primary/foreign key integrity can lead to inconsistency

    +     - Integrity constraint checking usually done outside of snapshot'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# # SI In Oracle and PostgreSQL


    **Warning:** SI used when isolation level is set to serializable, by Oracle, and
    PostgreSQL versions prior to 9.1


    +   PostgreSQL’s implementation of SI (versions prior to 9.1) described in Section
    26.4.1.3


    Oracle implements “first updater wins” rule (variant of “first committer wins”)


    +   concurrent writer check is done at time of write, not at commit time


    +   Allows transactions to be rolled back earlier


    +   Oracle and PostgreSQL < 9.1 do not support true serializable execution


    PostgreSQL 9.1 introduced new protocol called “Serializable Snapshot Isolation”
    (SSI)


    +   Which guarantees true serializability including handling predicate reads (coming
    up)'
  merge: -1
  img_proc: true
- pgno: 802
  md: '# SI In Oracle and PostgreSQL


    +   - Can sidestep SI for specific queries by using **select .. for update** in
    Oracle and PostgreSQL

    +     - E.g.,

    +       1. **select max**(orderno) **from** orders **for update**

    +       2. read value into local variable maxorder

    +       3. insert into orders (maxorder+1, ...)

    +     - Select for update (SFU) treats all data read by the query as if it were
    also updated, preventing concurrent updates

    +     - Does not always ensure serializability since phantom phenomena can occur
    (coming up)


    +   - In PostgreSQL versions < 9.1, SFU locks the data item, but releases locks
    when the transaction completes, even if other concurrent transactions are active

    +     - Not quite same as SFU in Oracle, which keeps locks until all

    +     - concurrent transactions have completed'
  merge: -1
  img_proc: true
- pgno: 803
  md: '# Insert and Delete Operations


    +   - If two-phase locking is used :

    +     - A **delete** operation may be performed only if the transaction deleting
    the tuple has an exclusive lock on the tuple to be deleted.

    +     - A transaction that inserts a new tuple into the database is given an X-mode
    lock on the tuple

    +   - Insertions and deletions can lead to the **phantom phenomenon**.

    +     - A transaction that scans a relation

    +       - (e.g., find sum of balances of all accounts in Perryridge)

    +       and a transaction that inserts a tuple in the relation

    +       - (e.g., insert a new account at Perryridge)

    +       (conceptually) conflict in spite of not accessing any tuple in common.

    +     - If only tuple locks are used, non-serializable schedules can result

    +       - E.g. the scan transaction does not see the new account, but reads some
    other tuple written by the update transaction'
  merge: -1
  img_proc: true
- pgno: 804
  md: '# Insert and Delete Operations (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_804_0.png)


    The transaction scanning the relation is reading information that indicates what
    tuples the relation contains, while a transaction inserting a tuple updates the
    same information.


    +   The conflict should be detected, e.g. by locking the information.


    One solution:


    +   Associate a data item with the relation, to represent the information about
    what tuples the relation contains.


    +   Transactions scanning the relation acquire a shared lock in the data item,


    +   Transactions inserting or deleting a tuple acquire an exclusive lock on the
    data item. (Note: locks on the data item do not conflict with locks on individual
    tuples.)


    Above protocol provides very low concurrency for insertions/deletions.


    Index locking protocols provide higher concurrency while preventing the phantom
    phenomenon, by requiring locks on certain index buckets.'
  merge: -1
  img_proc: true
- pgno: 805
  md: '# # Index Locking Protocol


    +   - **Index locking protocol:**

    +     - Every relation must have at least one index.

    +     - A transaction can access tuples only after finding them through one or
    more indices on the relation.

    +     - A transaction *Tᵢ* that performs a lookup must lock all the index leaf
    nodes that it accesses, in S-mode.

    +       - Even if the leaf node does not contain any tuple satisfying the index
    lookup (e.g. for a range query, no tuple in a leaf is in the range)

    +     - A transaction *Tᵢ* that inserts, updates or deletes a tuple *tᵢ* in a
    relation *r*

    +       - must update all indices to *r*

    +       - must obtain exclusive locks on all index leaf nodes affected by the
    insert/update/delete

    +     - The rules of the two-phase locking protocol must be observed

    +   - Guarantees that phantom phenomenon won’t occur'
  merge: -1
  img_proc: true
- pgno: 806
  md: '# Next-Key Locking


    +   - Index-locking protocol to prevent phantoms required locking entire leaf

    +     - Can result in poor concurrency if there are many inserts

    +   - Alternative: for an index lookup

    +     - Lock all values that satisfy index lookup (match lookup value, or fall
    in lookup range)

    +     - Also lock next key value in index

    +     - Lock mode: S for lookups, X for insert/delete/update

    +   - Ensures that range queries will conflict with inserts/deletes/updates

    +     - Regardless of which happens first, as long as both are concurrent'
  merge: -1
  img_proc: true
- pgno: 807
  md: '# Concurrency in Index Structures


    +   - Indices are unlike other database items in that their only job is to help
    in accessing data.

    +   - Index-structures are typically accessed very often, much more than other
    database items.

    +     - Treating index-structures like other database items, e.g. by 2-phase locking
    of index nodes can lead to low concurrency.

    +   - There are several index concurrency protocols where locks on internal nodes
    are released early, and not in a two-phase fashion.

    +     - It is acceptable to have nonserializable concurrent access to an index
    as long as the accuracy of the index is maintained.

    +       - In particular, the exact values read in an internal node of a B⁺-tree
    are irrelevant so long as we land up in the correct leaf node.'
  merge: -1
  img_proc: true
- pgno: 808
  md: '# Concurrency in Index Structures (Cont.)


    +   - Example of index concurrency protocol:

    +   - Use **crabbing** instead of two-phase locking on the nodes of the B⁺-tree,
    as follows. During search/insertion/deletion:

    +     - First lock the root node in shared mode.

    +     - After locking all required children of a node in shared mode, release
    the lock on the node.

    +     - During insertion/deletion, upgrade leaf node locks to exclusive mode.

    +     - When splitting or coalescing requires changes to a parent, lock the parent
    in exclusive mode.

    +   - Above protocol can cause excessive deadlocks

    +     - Searches coming down the tree deadlock with updates going up the tree

    +     - Can abort and restart search, without affecting transaction

    +   - Better protocols are available; see Section 16.9 for one such protocol,
    the B-link tree protocol

    +     - Intuition: release lock on parent before acquiring lock on child

    +       - And deal with changes that may have happened between lock release and
    acquire'
  merge: -1
  img_proc: true
- pgno: 809
  md: '# Weak Levels of Consistency


    +   - **Degree-two consistency**: differs from two-phase locking in that S-locks
    may be released at any time, and locks may be acquired at any time

    +     - X-locks must be held till end of transaction

    +     - Serializability is not guaranteed, programmer must ensure that no erroneous
    database state will occur

    +   - **Cursor stability**:

    +     - For reads, each tuple is locked, read, and lock is immediately released

    +     - X-locks are held till end of transaction

    +     - Special case of degree-two consistency'
  merge: -1
  img_proc: true
- pgno: 810
  md: '# Weak Levels of Consistency in SQL


    +   - SQL allows non-serializable executions

    +     - **Serializable**: is the default

    +     - **Repeatable read**: allows only committed records to be read, and repeating
    a read should return the same value (so read locks should be retained)

    +       - However, the phantom phenomenon need not be prevented

    +         - T1 may see some records inserted by T2, but may not see others inserted
    by T2

    +     - **Read committed**: same as degree two consistency, but most systems implement
    it as cursor-stability

    +     - **Read uncommitted**: allows even uncommitted data to be read

    +   - In many database systems, read committed is the default consistency level

    +     - has to be explicitly changed to serializable when required

    +       - **set isolation level serializable**'
  merge: -1
  img_proc: true
- pgno: 811
  md: '# # Transactions across User Interaction


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_811_0.png)


    +   - Many applications need transaction support across user interactions

    +   - Can’t use locking

    +   - Don’t want to reserve database connection per user


    +   - Application level concurrency control

    +   - Each tuple has a version number

    +   - Transaction notes version number when reading tuple

    +     ```

    +     select r.balance, r.version into :A, :version

    +     from r where acctId =23

    +     ```


    +   - When writing tuple, check that current version number is same as the version
    when tuple was read

    +     ```

    +     update r set r.balance = r.balance + :deposit

    +     where acctId = 23 and r.version = :version

    +     ```


    - Equivalent to optimistic concurrency control without validating read set


    - Used internally in Hibernate ORM system, and manually in many applications


    +   - Version numbering can also be used to support first committer wins check
    of snapshot isolation

    +   - Unlike SI, reads are not guaranteed to be from a single snapshot'
  merge: -1
  img_proc: true
