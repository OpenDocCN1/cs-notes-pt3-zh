- pgno: 1271
  md: '# Storage of XML Data


    +   - XML data can be stored in

    +     - Non-relational data stores

    +       - Flat files

    +         - Natural for storing XML

    +         - But has all problems discussed in Chapter 1 (no concurrency, no recovery,
    ...)

    +       - XML database

