- pgno: 1006
  md: '# Distributed Database System


    +   - A distributed database system consists of loosely coupled sites that share
    no physical component

    +   - Database systems that run on each site are independent of each other

    +   - Transactions may access data at one or more sites'
  merge: -1
  img_proc: true
- pgno: 1007
  md: '# Homogeneous Distributed Databases


    +   - In a homogeneous distributed database

    +     - All sites have identical software

    +     - Are aware of each other and agree to cooperate in processing user requests.

    +     - Each site surrenders part of its autonomy in terms of right to change
    schemas or software

    +     - Appears to user as a single system

    +   - In a heterogeneous distributed database

    +     - Different sites may use different schemas and software

    +       - Difference in schema is a major problem for query processing

    +       - Difference in software is a major problem for transaction processing

    +     - Sites may not be aware of each other and may provide only limited facilities
    for cooperation in transaction processing'
  merge: -1
  img_proc: true
- pgno: 1008
  md: '# Distributed Data Storage


    +   - Assume relational data model


    +   - Replication

    +     - System maintains multiple copies of data, stored in different sites, for
    faster retrieval and fault tolerance.


    +   - Fragmentation

    +     - Relation is partitioned into several fragments stored in distinct sites


    +   - Replication and fragmentation can be combined

    +     - Relation is partitioned into several fragments: system maintains several
    identical replicas of each such fragment.'
  merge: -1
  img_proc: true
- pgno: 1009
  md: '# Data Replication


    +   - A relation or fragment of a relation is **replicated** if it is stored redundantly
    in two or more sites.

    +   - **Full replication** of a relation is the case where the relation is stored
    at all sites.

    +   - Fully redundant databases are those in which every site contains a copy
    of the entire database.'
  merge: -1
  img_proc: true
- pgno: 1010
  md: '# Data Replication (Cont.)


    +   - Advantages of Replication

    +     - **Availability**: failure of site containing relation *r* does not result
    in unavailability of *r* is replicas exist.

    +     - **Parallelism**: queries on *r* may be processed by several nodes in parallel.

    +     - **Reduced data transfer**: relation *r* is available locally at each site
    containing a replica of *r*.

    +   - Disadvantages of Replication

    +     - Increased cost of updates: each replica of relation *r* must be updated.

    +     - Increased complexity of concurrency control: concurrent updates to distinct
    replicas may lead to inconsistent data unless special concurrency control mechanisms
    are implemented.

    +       - One solution: choose one copy as **primary copy** and apply concurrency
    control operations on primary copy'
  merge: -1
  img_proc: true
- pgno: 1011
  md: '# Data Fragmentation


    +   - Division of relation r into fragments r₁, r₂, ..., rₙ which contain sufficient
    information to reconstruct relation r.

    +   - **Horizontal fragmentation**: each tuple of r is assigned to one or more
    fragments

    +   - **Vertical fragmentation**: the schema for relation r is split into several
    smaller schemas

    +     - All schemas must contain a common candidate key (or superkey) to ensure
    lossless join property.

    +     - A special attribute, the tuple-id attribute may be added to each schema
    to serve as a candidate key.'
  merge: -1
  img_proc: true
