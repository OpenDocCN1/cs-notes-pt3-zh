- pgno: 689
  md: '# Materialized View Maintenance


    +   - The task of keeping a materialized view up-to-date with the underlying data
    is known as **materialized view maintenance**

    +   - Materialized views can be maintained by recomputation on every update

    +   - A better option is to use **incremental view maintenance**

    +     - **Changes to database relations are used to compute changes to the materialized
    view, which is then updated**

    +   - View maintenance can be done by

    +     - Manually defining triggers on insert, delete, and update of each relation
    in the view definition

    +     - Manually written code to update the view whenever database relations are
    updated

    +     - Periodic recomputation (e.g. nightly)

    +     - Above methods are directly supported by many database systems

    +       - Avoids manual effort/correctness issues'
  merge: -1
  img_proc: true
- pgno: 690
  md: '# Incremental View Maintenance


    +   - The changes (inserts and deletes) to a relation or expressions are referred
    to as its **differential**

    +     - Set of tuples inserted to and deleted from r are denoted **i<sub>r</sub>**
    and **d<sub>r</sub>**

    +   - To simplify our description, we only consider inserts and deletes

    +     - We replace updates to a tuple by deletion of the tuple followed by insertion
    of the update tuple

    +   - We describe how to compute the change to the result of each relational operation,
    given changes to its inputs

    +   - We then outline how to handle relational algebra expressions'
  merge: -1
  img_proc: true
- pgno: 691
  md: '# Join Operation


    +   - Consider the materialized view v = r ⋈ s and an update to r

    +   - Let r^old and r^new denote the old and new states of relation r

    +   - Consider the case of an insert to r:

    +     - We can write r^new ⋈ s as (r^old ∪ i_r) ⋈ s

    +     - And rewrite the above to (r^old ⋈ s) ∪ (i_r ⋈ s)

    +     - But (r^old ⋈ s) is simply the old value of the materialized view, so the
    incremental change to the view is just i_r ⋈ s

    +   - Thus, for inserts v^new = v^old ∪ (i_r ⋈ s)

    +   - Similarly for deletes v^new = v^old − (d_r ⋈ s)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_691_0.png)'
  merge: -1
