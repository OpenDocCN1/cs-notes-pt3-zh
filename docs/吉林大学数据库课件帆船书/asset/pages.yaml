- pgno: 1286
  md: '# Performance Tuning


    +   - Adjusting various parameters and design choices to improve system performance
    for a specific application.

    +   - Tuning is best done by

    +     1. identifying bottlenecks, and

    +     2. eliminating them.

    +   - Can tune a database system at 3 levels:

    +     - **Hardware** -- e.g., add disks to speed up I/O, add memory to increase
    buffer hits, move to a faster processor.

    +     - **Database system parameters** -- e.g., set buffer size to avoid paging
    of buffer, set checkpointing intervals to limit log size. System may have automatic
    tuning.

    +     - **Higher level database design**, such as the schema, indices and transactions
    (more later)'
  merge: -1
  img_proc: true
- pgno: 1287
  md: '# Bottlenecks


    +   - Performance of most systems (at least before they are tuned) usually limited
    by performance of one or a few components: these are called **bottlenecks**

    +     - E.g., 80% of the code may take up 20% of time and 20% of code takes up
    80% of time

    +       - Worth spending most time on 20% of code that take 80% of time

    +   - Bottlenecks may be in hardware (e.g., disks are very busy, CPU is idle),
    or in software

    +   - Removing one bottleneck often exposes another

    +   - De-bottlenecking consists of repeatedly finding bottlenecks, and removing
    them

    +     - This is a heuristic'
  merge: -1
  img_proc: true
- pgno: 1288
  md: "# # Identifying Bottlenecks\n\n+   - Transactions request a sequence of services\n\
    +   \n+     - E.g., CPU, Disk I/O, locks\n\nWith concurrent transactions, transactions\
    \ may have to wait for a requested service while other transactions are being\
    \ served\n\n+   - Can model database as a queuing system with a queue for each\
    \ service\n+   \n+     - Transactions repeatedly do the following\n+   \n+   \
    \    - request a service, wait in queue for the service, and get serviced\n\n\
    +   - Bottlenecks in a database system typically show up as very high utilizations\
    \ (and correspondingly, very long queues) of a particular service\n+   \n+   \
    \  - E.g., disk vs. CPU utilization\n+   \n+     - 100% utilization leads to very\
    \ long waiting time:\n+   \n+       - Rule of thumb: design system for about 70%\
    \ utilization at peak load\n+   \n+       - utilization over 90% should be avoided"
  merge: -1
  img_proc: true
