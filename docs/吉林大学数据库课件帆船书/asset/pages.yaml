- pgno: 1408
  md: '# High-Performance Transaction Systems


    +   - High-performance hardware and parallelism help improve the rate of transaction
    processing, but are insufficient to obtain high performance:

    +     - Disk I/O is a bottleneck — I/O time (10 milliseconds) has no decreased
    at a rate comparable to the increase in processor speeds.

    +     - Parallel transactions may attempt to read or write the same data item,
    resulting in data conflicts that reduce effective parallelism

    +   - We can reduce the degree to which a database system is disk bound by increasing
    the size of the database buffer.'
  merge: -1
  img_proc: true
- pgno: 1409
  md: '# Main-Memory Database


    +   - Commercial 64-bit systems can support main memories of tens of gigabytes.

    +   - Memory resident data allows faster processing of transactions.

    +   - Disk-related limitations:

    +     - Logging is a bottleneck when transaction rate is high.

    +     - Use group-commit to reduce number of output operations (Will study two
    slides ahead.)

    +     - If the update rate for modified buffer blocks is high, the disk data-transfer
    rate could become a bottleneck.

    +     - If the system crashes, all of main memory is lost.'
  merge: -1
  img_proc: true
- pgno: 1410
  md: '# Main-Memory Database Optimizations


    +   - To reduce space overheads, main-memory databases can use structures with
    pointers crossing multiple pages. In disk databases, the I/O cost to traverse
    multiple pages would be excessively high.

    +   - No need to pin buffer pages in memory before data are accessed, since buffer
    pages will never be replaced.

    +   - Design query-processing techniques to minimize space overhead - avoid exceeding
    main memory limits during query evaluation.

    +   - Improve implementation of operations such as locking and latching, so they
    do not become bottlenecks.

    +   - Optimize recovery algorithms, since pages rarely need to be written out
    to make space for other pages.'
  merge: -1
  img_proc: true
- pgno: 1411
  md: <!-- no content -->
  merge: -1
