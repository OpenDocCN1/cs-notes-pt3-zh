- pgno: 12
  md: '# Data Definition Language (DDL)


    +   - Specification notation for defining the database schema

    +     Example:  **create table** *instructor* (

    +       ID          **char**(5),

    +       name        **varchar**(20),

    +       dept_name   **varchar**(20),

    +       salary      **numeric**(8,2))

    +   - DDL compiler generates a set of table templates stored in a *data dictionary*

    +   - Data dictionary contains metadata (i.e., data about data)

    +     - Database schema

    +     - Integrity constraints

    +       - Primary key (ID uniquely identifies instructors)

    +     - Authorization

    +       - Who can access what'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Data Manipulation Language (DML)


    +   - Language for accessing and manipulating the data organized by the appropriate
    data model

    +     - DML also known as query language

    +   - Two classes of languages

    +     - Pure – used for proving properties about computational power and for optimization

    +       - Relational Algebra

    +       - Tuple relational calculus

    +       - Domain relational calculus

    +     - Commercial – used in commercial systems

    +       - SQL is the most widely used commercial language'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# SQL


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_14_0.png)


    +   - The most widely used commercial language

    +   - SQL is NOT a Turing machine equivalent language

    +   - SQL is NOT a Turing machine equivalent language

    +   - To be able to compute complex functions SQL is usually embedded in some
    higher-level language

    +   - Application programs generally access databases through one of

    +     - Language extensions to allow embedded SQL

    +     - Application program interface (e.g., ODBC/JDBC) which allow SQL queries
    to be sent to a database'
