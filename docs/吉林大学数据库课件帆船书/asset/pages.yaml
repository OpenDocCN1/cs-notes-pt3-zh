- pgno: 525
  md: '# # Updates on B+-Trees: Deletion


    Otherwise, if the node has too few entries due to the removal, but the entries
    in the node and a sibling do not fit into a single node, then redistribute pointers:


    +   - Redistribute the pointers between the node and a sibling such that both
    have more than the minimum number of entries.


    +   - Update the corresponding search-key value in the parent of the node.


    The node deletions may cascade upwards till a node which has ⌈n/2⌉ or more pointers
    is found.


    If the root node has only one pointer after deletion, it is deleted and the sole
    child becomes the root.'
  merge: -1
  img_proc: true
- pgno: 526
  md: '# Non-Unique Search Keys


    +   - Alternatives to scheme described earlier

    +     - Buckets on separate block (bad idea)

    +     - List of tuple pointers with each key

    +       - Extra code to handle long lists

    +       - Deletion of a tuple can be expensive if there are many duplicates on
    search key (why?)

    +       - Low space overhead, no extra cost for queries

    +     - Make search key unique by adding a record-identifier

    +       - Extra storage overhead for keys

    +       - Simpler code for insertion/deletion

    +       - Widely used'
  merge: -1
  img_proc: true
- pgno: 527
  md: '# # B+-Tree File Organization


    +   - Index file degradation problem is solved by using B+-Tree indices.


    +   - Data file degradation problem is solved by using B+-Tree File Organization.


    +   - The leaf nodes in a B+-tree file organization store records, instead of
    pointers.


    +   - Leaf nodes are still required to be half full


    +     - Since records are larger than pointers, the maximum number of records
    that can be stored in a leaf node is less than the number of pointers in a nonleaf
    node.


    +   - Insertion and deletion are handled in the same way as insertion and deletion
    of entries in a B+-tree index.'
  merge: -1
  img_proc: true
- pgno: 528
  md: '# B+-Tree File Organization (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_528_0.png)


    Example of B+-tree File Organization


    +   - Good space utilization important since records use more space than pointers.

    +   - To improve space utilization, involve more sibling nodes in redistribution
    during splits and merges

    +     - Involving 2 siblings in redistribution (to avoid split / merge where possible)
    results in each node having at least [2n/3] entries'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# Other Issues in Indexing


    # Record relocation and secondary indices


    +   - If a record moves, all secondary indices that store record pointers have
    to be updated

    +   - Node splits in B⁺-tree file organizations become very expensive

    +   - *Solution:* use primary-index search key instead of record pointer in secondary
    index

    +     - Extra traversal of primary index to locate record

    +       - Higher cost for queries, but node splits are cheap

    +     - Add record-id if primary-index search key is non-unique'
  merge: -1
  img_proc: true
- pgno: 530
  md: '# Indexing Strings


    +   - Variable length strings as keys

    +     - Variable fanout

    +     - Use space utilization as criterion for splitting, not number of pointers

    +   - Prefix compression

    +     - Key values at internal nodes can be prefixes of full key

    +       - Keep enough characters to distinguish entries in the subtrees separated
    by the key value

    +         - E.g. “Silas” and “Silberschatz” can be separated by “Silb”

    +     - Keys in leaf node can be compressed by sharing common prefixes'
  merge: -1
  img_proc: true
- pgno: 531
  md: '# Bulk Loading and Bottom-Up Build


    +   - Inserting entries one-at-a-time into a B⁺-tree requires ≥ 1 IO per entry

    +     - assuming leaf level does not fit in memory

    +     - can be very inefficient for loading a large number of entries at a time
    (bulk loading)

    +   - Efficient alternative 1:

    +     - sort entries first (using efficient external-memory sort algorithms discussed
    later in Section 12.4)

    +     - insert in sorted order

    +       - insertion will go to existing page (or cause a split)

    +       - much improved IO performance, but most leaf nodes half full

    +   - Efficient alternative 2: Bottom-up B⁺-tree construction

    +     - As before sort entries

    +     - And then create tree layer-by-layer, starting with leaf level

    +       - details as an exercise

    +     - Implemented as part of bulk-load utility by most database systems'
  merge: -1
  img_proc: true
- pgno: 532
  md: '# B-Tree Index Files


    +   - Similar to B+-tree, but B-tree allows search-key values to appear only once;
    eliminates redundant storage of search keys.

    +   - Search keys in nonleaf nodes appear nowhere else in the B-tree; an additional
    pointer field for each search key in a nonleaf node must be included.

    +   - Generalized B-tree leaf node


