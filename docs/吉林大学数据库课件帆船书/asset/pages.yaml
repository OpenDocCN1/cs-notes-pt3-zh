- pgno: 56
  md: '# Data Definition Language


    The SQL data-definition language (DDL) allows the specification of information
    about relations, including:


    +   - The schema for each relation.

    +   - The domain of values associated with each attribute.

    +   - Integrity constraints

    +   - And as we will see later, also other information such as

    +     - The set of indices to be maintained for each relations.

    +     - Security and authorization information for each relation.

    +     - The physical storage structure of each relation on disk.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Domain Types in SQL


    +   - **char(n)**. Fixed length character string, with user-specified length *n*.

    +   - **varchar(n)**. Variable length character strings, with user-specified maximum
    length *n*.

    +   - **int**. Integer (a finite subset of the integers that is machine-dependent).

    +   - **smallint**. Small integer (a machine-dependent subset of the integer domain
    type).

    +   - **numeric(p,d)**. Fixed point number, with user-specified precision of *p*
    digits, with *d* digits to the right of decimal point. (ex., **numeric(3,1)**,
    allows 44.5 to be stores exactly, but not 444.5 or 0.32)

    +   - **real, double precision**. Floating point and double-precision floating
    point numbers, with machine-dependent precision.

    +   - **float(n)**. Floating point number, with user-specified precision of at
    least *n* digits.

    +   - More are covered in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Create Table Construct


    An SQL relation is defined using the create table command:


    ```

    create table r(A₁ D₁, A₂ D₂, ..., Aₙ Dₙ,

    (integrity-constraint₁),

    ...,

    (integrity-constraintₖ))

    ```


    +   - r is the name of the relation

    +   - each Aᵢ is an attribute name in the schema of relation r

    +   - Dᵢ is the data type of values in the domain of attribute Aᵢ


    Example:


    ```

    create table instructor (

    ID          char(5),

    name        varchar(20),

    dept_name   varchar(20),

    salary      numeric(8,2))

    ```'
  merge: -1
  img_proc: true
