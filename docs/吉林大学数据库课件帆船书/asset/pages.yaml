- pgno: 148
  md: "# Integrity Constraint Violation During Transactions\n\nE.g.\n\n```\ncreate\
    \ table person (\n  ID char(10),\n  name char(40),\n  mother char(10),\n  father\
    \ char(10),\n  primary key ID,\n  foreign key father references person,\n  foreign\
    \ key mother references person)\n```\n\nHow to insert a tuple without causing\
    \ constraint violation ?\n\n+   - insert father and mother of a person before\
    \ inserting person\n+   - OR, set father and mother to null initially, update\
    \ after inserting all persons (not possible if father and mother attributes declared\
    \ to be not null)\n+   - OR defer constraint checking (next slide)"
