- pgno: 1020
  md: '# Distributed Transactions


    +   - Transaction may access data at several sites.

    +   - Each site has a local transaction manager responsible for:

    +     - Maintaining a log for recovery purposes

    +     - Participating in coordinating the concurrent execution of the transactions
    executing at that site.

    +   - Each site has a transaction coordinator, which is responsible for:

    +     - Starting the execution of transactions that originate at the site.

    +     - Distributing subtransactions at appropriate sites for execution.

    +     - Coordinating the termination of each transaction that originates at the
    site, which may result in the transaction being committed at all sites or aborted
    at all sites.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1020_0.png)'
  merge: -1
  img_proc: true
- pgno: 1021
  md: '# Transaction System Architecture


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1021_0.png)'
  merge: -1
