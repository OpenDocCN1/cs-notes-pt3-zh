- pgno: 219
  md: "# Recursion in SQL\n\n+   - SQL:1999 permits recursive view definition\n+ \
    \  - Example: find which courses are a prerequisite, whether directly or indirectly,\
    \ for a specific course\n\n```\nwith recursive rec_prereq(course_id, prereq_id)\
    \ as (\n    select course_id, prereq_id\n    from prereq\n    union\n    select\
    \ rec_prereq.course_id, prereq.prereq_id,\n    from rec_rereq, prereq\n    where\
    \ rec_prereq.prereq_id = prereq.course_id\n)\nselect *\nfrom rec_prereq;\n```\n\
    \nThis example view, rec_prereq, is called the transitive closure of the prereq\
    \ relation\n\nNote: 1st printing of 6th ed erroneously used c_prereq in place\
    \ of rec_prereq in some places"
  merge: -1
  img_proc: true
- pgno: 220
  md: '# The Power of Recursion


    +   - Recursive views make it possible to write queries, such as transitive closure
    queries, that cannot be written without recursion or iteration.

    +     - Intuition: Without recursion, a non-recursive non-iterative program can
    perform only a fixed number of joins of *prereq* with itself

    +       - This can give only a fixed number of levels of managers

    +       - Given a fixed non-recursive query, we can construct a database with
    a greater number of levels of prerequisites on which the query will not work

    +       - Alternative: write a procedure to iterate as many times as required

    +         - See procedure *findAllPrereqs* in book'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# The Power of Recursion


    +   - Computing transitive closure using iteration, adding successive tuples to
    *rec_prereq*

    +     - The next slide shows a *prereq* relation

    +     - Each step of the iterative process constructs an extended version of *rec_prereq*
    from its recursive definition.

    +     - The final result is called the *fixed point* of the recursive view definition.

    +   - Recursive views are required to be **monotonic**. That is, if we add tuples
    to *prereq* the view *rec_prereq* contains all of the tuples it contained before,
    plus possibly more'
  merge: -1
  img_proc: true
