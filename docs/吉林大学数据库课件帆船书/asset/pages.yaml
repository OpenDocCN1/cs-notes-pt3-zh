- pgno: 341
  md: '# Use of Multivalued Dependencies


    +   - We use multivalued dependencies in two ways:

    +     1. To test relations to **determine** whether they are legal under a given
    set of functional and multivalued dependencies

    +     2. To specify **constraints** on the set of legal relations. We shall thus
    concern ourselves *only* with relations that satisfy a given set of functional
    and multivalued dependencies.


    If a relation r fails to satisfy a given multivalued dependency, we can construct
    a relations r′ that does satisfy the multivalued dependency by adding tuples to
    r.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_341_0.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Theory of MVDs


    +   From the definition of multivalued dependency, we can derive the following
    rule:

    +   - If α → β, then α ⟶⟶ β

    +   That is, every functional dependency is also a multivalued dependency


    +   The closure D⁺ of D is the set of all functional and multivalued dependencies
    logically implied by D.

    +   - We can compute D⁺ from D, using the formal definitions of functional dependencies
    and multivalued dependencies.

    +   - We can manage with such reasoning for very simple multivalued dependencies,
    which seem to be most common in practice

    +   - For complex dependencies, it is better to reason about sets of dependencies
    using a system of inference rules (see Appendix C).


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_342_0.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Fourth Normal Form


    +   - A relation schema *R* is in **4NF** with respect to a set *D* of functional
    and multivalued dependencies if for all multivalued dependencies in *D⁺* of the
    form α ⟶⟶ β, where α ⊆ *R* and β ⊆ *R*, at least one of the following hold:

    +     - α ⟶⟶ β is trivial (i.e., β ⊆ α or α ∪ β = *R*)

    +     - α is a superkey for schema *R*

    +   - If a relation is in 4NF it is in BCNF'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Restriction of Multivalued Dependencies


    +   - The restriction of D to R_i is the set D_i consisting of

    +     - All functional dependencies in D⁺ that include only attributes of R_i

    +     - All multivalued dependencies of the form

    +       α ⟶⟶ (β ∩ R_i)

    +       where α ⊆ R_i and α ⟶⟶ β is in D⁺'
  merge: -1
  img_proc: true
- pgno: 345
  md: "# 4NF Decomposition Algorithm\n\nresult := {R};\ndone := false;\ncompute D+;\n\
    Let Dᵢ denote the restriction of D+ to Rᵢ\n\nwhile (not done)\n  if (there is\
    \ a schema Rᵢ in result that is not in 4NF) then\n    begin\n      let α ⟶⟶ β\
    \ be a nontrivial multivalued dependency that holds on Rᵢ such that α → Rᵢ is\
    \ not in Dᵢ, and α∩β=φ;\n      result := (result - Rᵢ) ∪ (Rᵢ - β) ∪ (α, β);\n\
    \    end\n  else done := true;\n\nNote: each Rᵢ is in 4NF, and decomposition is\
    \ lossless-join"
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Example


    +   R = (A, B, C, G, H, I)

    +   F = { A ⟶ B

    +         B ⟶ HI

    +         CG ⟶ H }


    +   R is not in 4NF since A ⟶ B and A is not a superkey for R


    +   Decomposition

    +   a) R₁ = (A, B)          (R₁ is in 4NF)

    +   b) R₂ = (A, C, G, H, I)  (R₂ is not in 4NF, decompose into R₃ and R₄)

    +   c) R₃ = (C, G, H)       (R₃ is in 4NF)

    +   d) R₄ = (A, C, G, I)    (R₄ is not in 4NF, decompose into R₅ and R₆)


    +   A ⟶ B and B ⟶ HI ⇒ A ⟶ HI, (MVD transitivity), and


    +   and hence A ⟶ I (MVD restriction to R₄)


    +   e) R₅ = (A, I)         (R₅ is in 4NF)

    +   f) R₆ = (A, C, G)       (R₆ is in 4NF)'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Further Normal Forms


    +   - **Join dependencies** generalize multivalued dependencies

    +     - lead to **project-join normal form (PJNF)** (also called **fifth normal
    form**)

    +   - A class of even more general constraints, leads to a normal form called
    **domain-key normal form**.

    +   - Problem with these generalized constraints: are hard to reason with, and
    no set of sound and complete set of inference rules exists.

    +   - Hence rarely used'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Overall Database Design Process


    +   - We have assumed schema *R* is given

    +     - *R* could have been generated when converting E-R diagram to a set of
    tables.

    +     - *R* could have been a single relation containing *all* attributes that
    are of interest (called **universal relation**).

    +     - Normalization breaks *R* into smaller relations.

    +     - *R* could have been the result of some ad hoc design of relations, which
    we then test/convert to normal form.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# ER Model and Normalization


    +   - When an E-R diagram is carefully designed, identifying all entities correctly,
    the tables generated from the E-R diagram should not need further normalization.

    +   - However, in a real (imperfect) design, there can be functional dependencies
    from non-key attributes of an entity to other attributes of the entity

    +     - Example: an *employee* entity with attributes *department_name* and *building*,
    and a functional dependency *department_name → building*

    +     - Good design would have made department an entity

    +   - Functional dependencies from non-key attributes of a relationship set possible,
    but rare --- most relationships are binary'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Denormalization for Performance


    +   - May want to use non-normalized schema for performance

    +   - For example, displaying *prereqs* along with *course_id*, and *title* requires
    join of *course* with *prereq*

    +   - Alternative 1: Use denormalized relation containing attributes of *course*
    as well as *prereq* with all above attributes

    +     - faster lookup

    +     - extra space and extra execution time for updates

    +     - extra coding work for programmer and possibility of error in extra code

    +   - Alternative 2: use a materialized view defined as *course* *prereq*

    +     - Benefits and drawbacks same as above, except no extra coding work for
    programmer and avoids possible errors'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Other Design Issues


    +   - Some aspects of database design are not caught by normalization

    +   - Examples of bad database design, to be avoided:

    +     Instead of *earnings (company_id, year, amount)*, use

    +     - *earnings_2004, earnings_2005, earnings_2006, etc., all on the schema
    (company_id, earnings)*.

    +       - Above are in BCNF, but make querying across years difficult and needs
    new table each year

    +     - *company_year (company_id, earnings_2004, earnings_2005, earnings_2006)*

    +       - Also in BCNF, but also makes querying across years difficult and requires
    new attribute each year.

    +       - Is an example of a **crosstab**, where values for one attribute become
    column names

    +       - Used in spreadsheets, and in data analysis tools'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Modeling Temporal Data


    +   - **Temporal data** have an association time interval during which the data
    are *valid*.

    +   - A **snapshot** is the value of the data at a particular point in time

    +   - Several proposals to extend ER model by adding valid time to

    +     - attributes, e.g., address of an instructor at different points in time

    +     - entities, e.g., time duration when a student entity exists

    +     - relationships, e.g., time during which an instructor was associated with
    a student as an advisor.

    +   - But no accepted standard

    +   - Adding a temporal component results in functional dependencies like

    +     *ID → street, city*

    +     not to hold, because the address varies over time

    +   - A **temporal functional dependency** X → Y holds on schema *R* if the functional
    dependency X → Y holds on all snapshots for all legal instances r (*R*).'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Modeling Temporal Data (Cont.)


    +   - In practice, database designers may add start and end time attributes to
    relations

    +     - E.g., course(course_id, course_title) is replaced by course(course_id,
    course_title, start, end)

    +       - Constraint: no two tuples can have overlapping valid times

    +         - Hard to enforce efficiently

    +   - Foreign key references may be to current version of data, or to data at
    a point in time

    +     - E.g., student transcript should refer to course information at the time
    the course was taken'
  merge: -1
  img_proc: true
