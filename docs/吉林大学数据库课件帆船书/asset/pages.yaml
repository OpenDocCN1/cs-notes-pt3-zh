  merge: -1
  img_proc: true
- pgno: 902
  md: '# Shadow Paging (Cont.)


    +   - To commit a transaction :

    +     1. Flush all modified pages in main memory to disk

    +     2. Output current page table to disk

    +     3. Make the current page table the new shadow page table, as follows:

    +        - keep a pointer to the shadow page table at a fixed (known) location
    on disk.

    +        - to make the current page table the new shadow page table, simply update
    the pointer to point to current page table on disk

    +   - Once pointer to shadow page table has been written, transaction is committed.

    +   - No recovery is needed after a crash — new transactions can start right away,
    using the shadow page table.

    +   - Pages not pointed to from current/shadow page table should be freed (garbage
    collected).'
  merge: -1
  img_proc: true
- pgno: 903
  md: '# Show Paging (Cont.)


    +   - Advantages of shadow-paging over log-based schemes

    +     - no overhead of writing log records

    +     - recovery is trivial

    +   - Disadvantages :

    +     - Copying the entire page table is very expensive

    +       - Can be reduced by using a page table structured like a B⁺-tree

    +         - No need to copy entire tree, only need to copy paths in the tree that
    lead to updated leaf nodes

    +     - Commit overhead is high even with above extension

    +       - Need to flush every updated page, and page table

    +     - Data gets fragmented (related pages get separated on disk)

    +     - After every transaction completion, the database pages containing old
    versions of modified data need to be garbage collected

    +     - Hard to extend algorithm to allow transactions to run concurrently

    +       - Easier to extend log based schemes'
  merge: -1
  img_proc: true
