- pgno: 1239
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1239_0.png)


    # Attributes


    +   - Elements can have **attributes**

    +     ```

    +     <course course_id="CS-101">

    +       <title> Intro. to Computer Science</title>

    +       <dept name> Comp. Sci. </dept name>

    +       <credits> 4 </credits>

    +     </course>

    +     ```

    +   - Attributes are specified by *name=value* pairs inside the starting tag of
    an element

    +   - An element may have several attributes, but each attribute name can only
    occur once

    +     ```

    +     <course course_id = "CS-101" credits="4">

    +     ```'
  merge: -1
  img_proc: true
- pgno: 1240
  md: '# Attributes vs. Subelements


    +   - Distinction between subelement and attribute

    +     - In the context of documents, attributes are part of markup, while subelement
    contents are part of the basic document contents

    +     - In the context of data representation, the difference is unclear and may
    be confusing

    +       - Same information can be represented in two ways

    +         - `<course course_id="CS-101">...</course>`

    +         - `<course>

    +           <course_id>CS-101</course_id>...

    +           </course>`

    +     - Suggestion: use attributes for identifiers of elements, and use subelements
    for contents


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1240_0.png)'
  merge: -1
  img_proc: true
- pgno: 1241
  md: "# Namespaces\n\n+   - XML data has to be exchanged between organizations\n\
    +   - Same tag name may have different meaning in different organizations, causing\
    \ confusion on exchanged documents\n+   - Specifying a unique string as an element\
    \ name avoids confusion\n+   - Better solution: use unique-name:element-name\n\
    +   - Avoid using long unique names all over document by using XML Namespaces\n\
    \n```\n<university xmlns:yale=\"http://www.yale.edu\">\n  ...\n  <yale:course>\n\
    \    <yale:course_id> CS-101 </yale:course_id>\n    <yale:title> Intro. to Computer\
    \ Science</yale:title>\n    <yale:dept_name> Comp. Sci. </yale:dept_name>\n  \
    \  <yale:credits> 4 </yale:credits>\n  </yale:course>\n  ...\n</university>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 1242
  md: '# More on XML Syntax


    +   - Elements without subelements or text content can be abbreviated by ending
    the start tag with a /> and deleting the end tag

    +     - `<course course_id="CS-101" Title="Intro. To Computer Science" dept_name
    = "Comp. Sci." credits="4" />`


    +   - To store string data that may contain tags, without the tags being interpreted
    as subelements, use CDATA as below

    +     - `<![CDATA[<course> ... </course>]]>`

    +     Here, <course> and </course> are treated as just strings

    +     CDATA stands for “character data”'
  merge: -1
  img_proc: true
- pgno: 1243
  md: '# XML Document Schema


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1243_0.png)


    +   - Database schemas constrain what information can be stored, and the data
    types of stored values

    +   - XML documents are not required to have an associated schema

    +   - However, schemas are very important for XML data exchange

    +     - Otherwise, a site cannot automatically interpret data received from another
    site

    +   - Two mechanisms for specifying XML schema

    +     - **Document Type Definition (DTD)**

    +       - Widely used

    +     - **XML Schema**

    +       - Newer, increasing use'
  merge: -1
  img_proc: true
