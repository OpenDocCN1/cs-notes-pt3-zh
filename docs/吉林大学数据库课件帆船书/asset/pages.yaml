  md: '# SQL functions (Cont.)


    +   - **Compound statement: begin ... end**

    +     - May contain multiple SQL statements between **begin** and **end**.

    +   - **returns** -- indicates the variable-type that is returned (e.g., integer)

    +   - **return** -- specifies the values that are to be returned as result of
    invoking the function

    +   - SQL function are in fact **parameterized views** that generalize the regular
    notion of views by allowing parameters.'
