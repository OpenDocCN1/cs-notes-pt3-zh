- pgno: 311
  md: '# Testing if an Attribute is Extraneous


    +   - Consider a set F of functional dependencies and the functional dependency
    α → β in F.

    +   - To test if attribute A ∈ α is extraneous in α

    +     1. compute ({α} − A)+ using the dependencies in F

    +     2. check that ({α} − A)+ contains β; if it does, A is extraneous in α

    +   - To test if attribute A ∈ β is extraneous in β

    +     1. compute α+ using only the dependencies in F′ = (F − {α → β}) ∪ {α → (β
    − A)},

    +     2. check that α+ contains A; if it does, A is extraneous in β'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Canonical Cover


    A **canonical cover** for F is a set of dependencies F_c such that


    +   - F logically implies all dependencies in F_c, and

    +   - F_c logically implies all dependencies in F, and

    +   - No functional dependency in F_c contains an extraneous attribute, and

    +   - Each left side of functional dependency in F_c is unique.


    To compute a canonical cover for F:


    **repeat**


    +   - Use the union rule to replace any dependencies in F

    +     α₁ → β₁ and α₁ → β₂ with α₁ → β₁ β₂

    +   - Find a functional dependency α → β with an

    +     extraneous attribute either in α or in β

    +     /* Note: test for extraneous attributes done using F_c, not F*/

    +   - If an extraneous attribute is found, delete it from α → β


    **until** F does not change


    Note: Union rule may become applicable after some extraneous attributes have been
    deleted, so it has to be re-applied'
  merge: -1
  img_proc: true
- pgno: 313
  md: "# Computing a Canonical Cover\n\n+   - R = (A, B, C)\n+   F = {A → BC\n+  \
    \ B → C\n+   A → B\n+   AB → C}\n\nCombine A → BC and A → B into A → BC\n\nSet\
    \ is now {A → BC, B → C, AB → C}\n\n+   - A is extraneous in AB → C\n+   \n+ \
    \  • Check if the result of deleting A from AB → C is implied by the other dependencies\n\
    +   \n+   › Yes: in fact, B → C is already present!\n+   \n+   • Set is now {A\
    \ → BC, B → C}\n\n+   - C is extraneous in A → BC\n+   \n+   • Check if A → C\
    \ is logically implied by A → B and the other dependencies\n+   \n+   › Yes: using\
    \ transitivity on A → B and B → C.\n+   \n+   - Can use attribute closure of A\
    \ in more complex cases\n\n+   - The canonical cover is:\n+   \n+   A → B\n+ \
    \  \n+   B → C"
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Lossless-join Decomposition


    For the case of R = (R1, R2), we require that for all possible relations r on
    schema R


    r = Π_R1(r) ⋈ Π_R2(r)


    A decomposition of R into R1 and R2 is lossless join if at least one of the following
    dependencies is in F+:


    +   - R1 ∩ R2 → R1

    +   - R1 ∩ R2 → R2


    The above functional dependencies are a sufficient condition for lossless join
    decomposition; the dependencies are a necessary condition only if all constraints
    are functional dependencies'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Example


    +   - R = (A, B, C)

    +     F = {A → B, B → C)

    +     - Can be decomposed in two different ways


    +   - R₁ = (A, B),  R₂ = (B, C)

    +     - Lossless-join decomposition:

    +       R₁ ∩ R₂ = {B} and B → BC

    +     - Dependency preserving


    +   - R₁ = (A, B),  R₂ = (A, C)

    +     - Lossless-join decomposition:

    +       R₁ ∩ R₂ = {A} and A → AB

    +     - Not dependency preserving

    +       (cannot check B → C without computing R₁ ⋈ R₂)'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Dependency Preservation


    Let $F_i$ be the set of dependencies $F^+$ that include only attributes in $R_i$.


    +   - A decomposition is **dependency preserving**, if

    +     $(F_1 \cup F_2 \cup \dots \cup F_n)^+ = F^+$

    +   - If it is not, then checking updates for violation of functional dependencies
    may require computing joins, which is expensive.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Testing for Dependency Preservation


    +   To check if a dependency α → β is preserved in a decomposition of R into R₁,
    R₂, ..., Rₙ we apply the following test (with attribute closure done with respect
    to F)


    +   result = α

    +   while (changes to result) do

    +     for each Rᵢ in the decomposition

    +       t = (result ∩ Rᵢ)⁺ ∩ Rᵢ

    +       result = result ∪ t


    +   If result contains all attributes in β, then the functional dependency α →
    β is preserved.


    +   We apply the test on all dependencies in F to check if a decomposition is
    dependency preserving


    +   This procedure takes polynomial time, instead of the exponential time required
    to compute F⁺ and (F₁ ∪ F₂ ∪ ... ∪ Fₙ)⁺'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Example


    +   - $R = (A, B, C)$

    +     $F = \{A \rightarrow B$

    +     $B \rightarrow C\}$

    +     Key = $\{A\}$

    +   - $R$ is not in BCNF

    +   - Decomposition $R_1 = (A, B),\ R_2 = (B, C)$

    +     - $R_1$ and $R_2$ in BCNF

    +     - Lossless-join decomposition

    +     - Dependency preserving'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Testing for BCNF


    +   To check if a non-trivial dependency α → β causes a violation of BCNF

    +   1. compute α⁺ (the attribute closure of α), and

    +   2. verify that it includes all attributes of R, that is, it is a superkey
    of R.


    +   Simplified test: To check if a relation schema R is in BCNF, it suffices to
    check only the dependencies in the given set F for violation of BCNF, rather than
    checking all dependencies in F⁺.

    +   - If none of the dependencies in F causes a violation of BCNF, then none of
    the dependencies in F⁺ will cause a violation of BCNF either.


    +   However, simplified test using only F is incorrect when testing a relation
    in a decomposition of R

    +   - Consider R = (A, B, C, D, E), with F = { A → B, BC → D }

    +     - Decompose R into R₁ = (A,B) and R₂ = (A,C,D, E)

    +     - Neither of the dependencies in F contain only attributes from (A,C,D,E)
    so we might be mislead into thinking R₂ satisfies BCNF.

    +     - In fact, dependency AC → D in F⁺ shows R₂ is not in BCNF.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Testing Decomposition for BCNF


    +   To check if a relation Rᵢ in a decomposition of R is in BCNF,

    +   - Either test Rᵢ for BCNF with respect to the restriction of F to Rᵢ (that
    is, all FDs in F⁺ that contain only attributes from Rᵢ)

    +   - or use the original set of dependencies F that hold on R, but with the following
    test:

    +     - for every set of attributes α ⊆ Rᵢ, check that α⁺ (the attribute closure
    of α) either includes no attribute of Rᵢ - α, or includes all attributes of Rᵢ.

    +     - If the condition is violated by some α → β in F, the dependency α → (α⁺
    - α) ∩ Rᵢ can be shown to hold on Rᵢ, and Rᵢ violates BCNF.

    +     - We use above dependency to decompose Rᵢ'
  merge: -1
  img_proc: true
- pgno: 321
  md: "# BCNF Decomposition Algorithm\n\n```\nresult := {R};\ndone := false;\ncompute\
    \ F⁺;\nwhile (not done) do\n    if (there is a schema Rᵢ in result that is not\
    \ in BCNF)\n        then begin\n            let α → β be a nontrivial functional\
    \ dependency that\n                holds on Rᵢ such that α → Rᵢ is not in F⁺,\n\
    \                and α ∩ β = ∅;\n            result := (result − Rᵢ) ∪ (Rᵢ − β)\
    \ ∪ (α, β);\n        end\n    else done := true;\n```\n\nNote: each Rᵢ is in BCNF,\
    \ and decomposition is lossless-join."
  merge: -1
  img_proc: true
