- pgno: 740
  md: '# Cascadeless Schedules


    +   - **Cascadeless schedules** — for each pair of transactions $T_i$ and $T_j$
    such that $T_j$ reads a data item previously written by $T_i$, the commit operation
    of $T_i$ appears before the read operation of $T_j$.

    +   - Every cascadeless schedule is also recoverable

    +   - It is desirable to restrict the schedules to those that are cascadeless

    +   - Example of a schedule that is NOT cascadeless


    | $T_{10}$ | $T_{11}$ | $T_{12}$ |

    |---|---|---|

    | read (A) |  |  |

    | read (B) |  |  |

    | write (A) |  |  |

    |  | read (A) |  |

    |  | write (A) |  |

    |  |  | read (A) |

    | abort |  |  |'
  merge: -1
  img_proc: true
- pgno: 741
  md: '# Concurrency Control


    +   - A database must provide a mechanism that will ensure that all possible schedules
    are both:

    +     - Conflict serializable.

    +     - Recoverable and preferably cascadeless

    +   - A policy in which only one transaction can execute at a time generates serial
    schedules, but provides a poor degree of concurrency

    +   - Concurrency-control schemes tradeoff between the amount of concurrency they
    allow and the amount of overhead that they incur

    +   - Testing a schedule for serializability *after* it has executed is a little
    too late!

    +     - Tests for serializability help us understand why a concurrency control
    protocol is correct

    +   - **Goal** – to develop concurrency control protocols that will assure serializability.'
  merge: -1
  img_proc: true
- pgno: 742
  md: '# Weak Levels of Consistency


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_742_0.png)


    +   - Some applications are willing to live with weak levels of consistency, allowing
    schedules that are not serializable

    +     - E.g., a read-only transaction that wants to get an approximate total balance
    of all accounts

    +     - E.g., database statistics computed for query optimization can be approximate
    (why?)

    +     - Such transactions need not be serializable with respect to other transactions

    +   - Tradeoff accuracy for performance'
  merge: -1
  img_proc: true
- pgno: 743
  md: '# Levels of Consistency in SQL-92


    +   - **Serializable** — default

    +   - **Repeatable read** — only committed records to be read, repeated reads
    of same record must return same value. However, a transaction may not be serializable
    – it may find some records inserted by a transaction but not find others.

    +   - **Read committed** — only committed records can be read, but successive
    reads of record may return different (but committed) values.

    +   - **Read uncommitted** — even uncommitted records may be read.

    +   - Lower degrees of consistency useful for gathering approximate information
    about the database

    +   - Warning: some database systems do not ensure serializable schedules by default

    +     - E.g., Oracle and PostgreSQL by default support a level of consistency
    called snapshot isolation (not part of the SQL standard)'
  merge: -1
  img_proc: true
- pgno: 744
  md: '# Transaction Definition in SQL


    +   - Data manipulation language must include a construct for specifying the set
    of actions that comprise a transaction.

    +   - In SQL, a transaction begins implicitly.

    +   - A transaction in SQL ends by:

    +     - **Commit work** commits current transaction and begins a new one.

    +     - **Rollback work** causes current transaction to abort.

    +   - In almost all database systems, by default, every SQL statement also commits
    implicitly if it executes successfully

    +     - Implicit commit can be turned off by a database directive

    +       - E.g. in JDBC, connection.setAutoCommit(false);'
  merge: -1
  img_proc: true
