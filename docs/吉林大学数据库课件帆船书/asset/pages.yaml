- pgno: 724
  md: '# Concurrent Executions


    +   - Multiple transactions are allowed to run concurrently in the system. Advantages
    are:

    +     - **Increased processor and disk utilization**, leading to better transaction
    *throughput*

    +       - E.g. one transaction can be using the CPU while another is reading from
    or writing to the disk

    +     - **Reduced average response time** for transactions: short transactions
    need not wait behind long ones.

    +   - **Concurrency control schemes** – mechanisms to achieve isolation

    +     - That is, to control the interaction among the concurrent transactions
    in order to prevent them from destroying the consistency of the database

    +       - Will study in Chapter 15, after studying notion of correctness of concurrent
    executions.'
  merge: -1
  img_proc: true
- pgno: 725
  md: '# Schedules


    +   - **Schedule** – a sequences of instructions that specify the chronological
    order in which instructions of concurrent transactions are executed

    +     - A schedule for a set of transactions must consist of all instructions
    of those transactions

    +     - Must preserve the order in which the instructions appear in each individual
    transaction.

    +   - A transaction that successfully completes its execution will have a **commit**
    instructions as the last statement

    +     - By default transaction assumed to execute commit instruction as its last
    step

    +   - A transaction that fails to successfully complete its execution will have
    an **abort** instruction as the last statement'
  merge: -1
  img_proc: true
- pgno: 726
  md: '# Schedule 1


    +   - Let $T_1$ transfer $50 from $A$ to $B$, and $T_2$ transfer 10% of the balance
    from $A$ to $B$.

    +   - An example of a **serial** schedule in which $T_1$ is followed by $T_2$
    :


    | $T_1$ | $T_2$ |

    |---|---|

    | read (A) | |

    | $A := A - 50$ | |

    | write (A) | |

    | read (B) | |

    | $B := B + 50$ | |

    | write (B) | |

    | commit | |

    | | read (A) |

    | | $temp := A * 0.1$ |

    | | $A := A - temp$ |

    | | write (A) |

    | | read (B) |

    | | $B := B + temp$ |

    | | write (B) |

    | | commit |'
  merge: -1
  img_proc: true
- pgno: 727
  md: '# Schedule 2


    A serial schedule in which T₂ is followed by T₁ :


    | T₁ | T₂ |

    |---|---|

    | read (A)

    A := A - 50

    write (A)

    read (B)

    B := B + 50

    write (B)

    commit | read (A)

    temp := A * 0.1

    A := A - temp

    write (A)

    read (B)

    B := B + temp

    write (B)

    commit |'
  merge: -1
  img_proc: true
- pgno: 728
  md: '# Schedule 3


    Let T₁ and T₂ be the transactions defined previously. The following schedule is
    not a serial schedule, but it is equivalent to Schedule 1.


    | T₁ | T₂ |

    |---|---|

    | read (A)

    A := A - 50

    write (A) | |

    | | read (A)

    temp := A * 0.1

    A := A - temp

    write (A) |

    | read (B)

    B := B + 50

    write (B)

    commit | |

    | | read (B)

    B := B + temp

    write (B)

    commit |


    Note -- In schedules 1, 2 and 3, the sum “A + B” is preserved.'
  merge: -1
  img_proc: true
- pgno: 729
  md: '# Schedule 4


    The following concurrent schedule does not preserve the sum of “A + B”


    | T₁ | T₂ |

    |---|---|

    | read (A)

    A := A - 50


    write (A)

    read (B)

    B := B + 50

    write (B)

    commit | read (A)

    temp := A * 0.1

    A := A - temp

    write (A)

    read (B)


    B := B + temp

    write (B)

    commit |


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_729_0.png)'
