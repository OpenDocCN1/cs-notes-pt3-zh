- pgno: 1334
  md: '# Time In Databases


    +   - While most databases tend to model reality at a point in time (at the “current”
    time), temporal databases model the states of the real world across time.

    +   - Facts in temporal relations have associated times when they are *valid*,
    which can be represented as a union of intervals.

    +   - The **transaction time** for a fact is the time interval during which the
    fact is current within the database system.

    +   - In a **temporal relation**, each tuple has an associated time when it is
    true; the time may be either valid time or transaction time.

    +   - A **bi-temporal relation** stores both valid and transaction time.'
  merge: -1
  img_proc: true
- pgno: 1335
  md: '# Time In Databases (Cont.)


    Example of a temporal relation:


    | ID | name | dept_name | salary | from | to |

    |---|---|---|---|---|---|

    | 10101 | Srinivasan | Comp. Sci. | 61000 | 2007/1/1 | 2007/12/31 |

    | 10101 | Srinivasan | Comp. Sci. | 65000 | 2008/1/1 | 2008/12/31 |

    | 12121 | Wu | Finance | 82000 | 2005/1/1 | 2006/12/31 |

    | 12121 | Wu | Finance | 87000 | 2007/1/1 | 2007/12/31 |

    | 12121 | Wu | Finance | 90000 | 2008/1/1 | 2008/12/31 |

    | 98345 | Kim | Elec. Eng. | 80000 | 2005/1/1 | 2008/12/31 |


    Temporal query languages have been proposed to simplify modeling of time as well
    as time related queries.'
  merge: -1
