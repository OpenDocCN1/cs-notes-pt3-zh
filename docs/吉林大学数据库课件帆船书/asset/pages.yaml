- pgno: 837
  md: '# Recovery Algorithm


    +   **Logging (during normal operation):**

    +   - `<T_i start>` at transaction start

    +   - `<T_i, X_j, V_1, V_2>` for each update, and

    +   - `<T_i commit>` at transaction end


    +   **Transaction rollback (during normal operation)**

    +   - Let `T_i` be the transaction to be rolled back

    +   - Scan log backwards from the end, and for each log record of `T_i` of the
    form `<T_i, X_j, V_1, V_2>`

    +     - perform the undo by writing `V_1` to `X_j`

    +     - write a log record `<T_i, X_j, V>`

    +       - such log records are called **compensation log records**

    +   - Once the record `<T_i start>` is found stop the scan and write the log record
    `<T_i abort>`'
  merge: -1
  img_proc: true
- pgno: 838
  md: '# Recovery Algorithm (Cont.)


    +   - **Recovery from failure**: Two phases

    +     - **Redo phase**: replay updates of **all** transactions, whether they committed,
    aborted, or are incomplete

    +     - **Undo phase**: undo all incomplete transactions


    +   - **Redo phase:**

    +     1. Find last <**checkpoint** L> record, and set undo-list to L.

    +     2. Scan forward from above <**checkpoint** L> record

    +        1. Whenever a record <T_i, X_j, V_1, V_2> or <T_i, X_j, V_2> is found,
    redo it by writing V_2 to X_j

    +        2. Whenever a log record <T_i **start**> is found, add T_i to undo-list

    +        3. Whenever a log record <T_i **commit**> or <T_i **abort**> is found,
    remove T_i from undo-list'
  merge: -1
  img_proc: true
- pgno: 839
  md: '# Recovery Algorithm (Cont.)


    +   **Undo phase:**

    +   1. Scan log backwards from end

    +      1. Whenever a log record <T_i, X_j, V_1, V_2> is found where T_i is in
    undo-list perform same actions as for transaction rollback:

    +         1. perform undo by writing V_1 to X_j.

    +         2. write a log record <T_i, X_j, V_1>

    +      2. Whenever a log record <T_i start> is found where T_i is in undo-list,

    +         1. Write a log record <T_i abort>

    +         2. Remove T_i from undo-list

    +      3. Stop when undo-list is empty

    +         - i.e. <T_i start> has been found for every transaction in undo-list

    +   - After undo phase completes, normal transaction processing can commence'
  merge: -1
  img_proc: true
