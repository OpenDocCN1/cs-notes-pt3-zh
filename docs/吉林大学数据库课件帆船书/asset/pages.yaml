- pgno: 251
  md: '# Relational Algebra


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_251_0.png)


    +   - Procedural language

    +   - Six basic operators

    +     - select: σ

    +     - project: Π

    +     - union: ∪

    +     - set difference: −

    +     - Cartesian product: x

    +     - rename: ρ

    +   - The operators take one or two relations as inputs and produce a new relation
    as a result.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Select Operation


    +   - Notation: σₚ(r)

    +   - p is called the selection predicate

    +   - Defined as:


    σₚ(r) = { t | t ∈ r and p(t) }


    Where p is a formula in propositional calculus consisting of terms connected by
    : ∧ (and), ∨ (or), ¬ (not)


    Each term is one of:


    <attribute> op <attribute> or <constant>


    where op is one of: =, ≠, >, ≥, <, ≤


    +   - Example of selection:


    σ dept_name="Physics"(instructor)'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Project Operation


    +   - Notation:

    +     \(\prod_{A_1,A_2,...,A_k}(r)\)

    +     where $A_1$, $A_2$ are attribute names and $r$ is a relation name.

    +   - The result is defined as the relation of $k$ columns obtained by erasing
    the columns that are not listed

    +   - Duplicate rows removed from result, since relations are sets

    +   - Example: To eliminate the *dept_name* attribute of *instructor*

    +     \(\prod_{ID, name, salary}(instructor)\)'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# Union Operation\n\n+   - Notation: $r \\cup s$\n+   - Defined as:\n+    \
    \ $$r \\cup s = \\{t \\mid t \\in r \\text{ or } t \\in s\\}$$\n+   - For $r \\\
    cup s$ to be valid.\n+     1. $r$, $s$ must have the *same* arity (same number\
    \ of attributes)\n+     2. The attribute domains must be **compatible** (example:\
    \ 2<sup>nd</sup> column of $r$ deals with the same type of values as does the\
    \ 2<sup>nd</sup> column of $s$)\n+   - Example: to find all courses taught in\
    \ the Fall 2009 semester, or in the Spring 2010 semester, or in both\n+     $$\\\
    Pi_{course\\_id}(\\sigma_{semester=\"Fall\" \\land year=2009}(section)) \\cup$$\
    \ \n+     $$\\Pi_{course\\_id}(\\sigma_{semester=\"Spring\" \\land year=2010}(section))$$"
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Set Difference Operation


    +   - Notation $r - s$

    +   - Defined as:

    +     $r - s = \{ t \mid t \in r \text{ and } t \notin s \}$

    +   - Set differences must be taken between compatible relations.

    +     - $r$ and $s$ must have the same arity

    +     - attribute domains of $r$ and $s$ must be compatible

    +   - Example: to find all courses taught in the Fall 2009 semester, but not in
    the Spring 2010 semester

    +     $\Pi_{course\_id}(\sigma_{semester="Fall" \land year=2009}(section)) -$

    +     $\Pi_{course\_id}(\sigma_{semester="Spring" \land year=2010}(section))$'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Set-Intersection Operation


    +   - Notation: $r \cap s$

    +   - Defined as:

    +   - $r \cap s = \{ t \mid t \in r \text{ and } t \in s \}$

    +   - Assume:

    +     - $r$, $s$ have the *same arity*

    +     - attributes of $r$ and $s$ are compatible

    +   - Note: $r \cap s = r - (r - s)$'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# Cartesian-Product Operation\n\n+   - Notation r x s\n+   - Defined as:\n\
    +     \n+     r x s = {t q | t ∈ r and q ∈ s}\n+   - Assume that attributes of\
    \ r(R) and s(S) are disjoint. (That is, R ∩ S = ∅).\n+   - If attributes of r(R)\
    \ and s(S) are not disjoint, then renaming must be used."
  merge: -1
  img_proc: true
- pgno: 258
  md: "# Rename Operation\n\n+   - Allows us to name, and therefore to refer to, the\
    \ results of relational-algebra expressions.\n+   - Allows us to refer to a relation\
    \ by more than one name.\n+   - Example:\n+   \n+     ρₓ(E)\n+   \n+     returns\
    \ the expression E under the name X\n+   - If a relational-algebra expression\
    \ E has arity n, then\n+   \n+     ρₓ(A₁, A₂, ..., Aₙ)(E)\n+   \n+     returns\
    \ the result of expression E under the name X, and with the attributes renamed\
    \ to A₁, A₂, ..., Aₙ."
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Formal Definition


    A basic expression in the relational algebra consists of either one of the following:


    +   - A relation in the database

    +   - A constant relation


    Let E₁ and E₂ be relational-algebra expressions; the following are all relational-algebra
    expressions:


    +   - E₁ ∪ E₂

    +   - E₁ − E₂

    +   - E₁ × E₂

    +   - σₚ(E₁), P is a predicate on attributes in E₁

    +   - Πₛ(E₁), S is a list consisting of some of the attributes in E₁

    +   - ρₓ(E₁), x is the new name for the result of E₁'
  merge: -1
  img_proc: true
