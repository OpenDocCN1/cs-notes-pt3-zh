- pgno: 233
  md: '# Data Analysis and OLAP


    +   - **Online Analytical Processing (OLAP)**

    +     - Interactive analysis of data, allowing data to be summarized and viewed
    in different ways in an online fashion (with negligible delay)


    Data that can be modeled as dimension attributes and measure attributes are called
    **multidimensional data**.


    +   - **Measure attributes**

    +     - measure some value

    +     - can be aggregated upon

    +     - e.g., the attribute *number* of the *sales* relation


    +   - **Dimension attributes**

    +     - define the dimensions on which measure attributes (or aggregates thereof)
    are viewed

    +     - e.g., attributes *item_name*, *color*, and *size* of the *sales* relation'
  merge: -1
  img_proc: true
