    +   - R = (A, B, C)

    +     F = {A → B

    +       B → C}

    +     Key = {A}

    +   - R is not in BCNF (B → C but B is not superkey)

    +   - Decomposition

    +     - R₁ = (B, C)

    +     - R₂ = (A,B)'
