  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1194_0.png)


    # Object-Relational Data Models


    +   - Extend the relational data model by including object orientation and constructs
    to deal with added data types.

    +   - Allow attributes of tuples to have complex types, including non-atomic values
    such as nested relations.

    +   - Preserve relational foundations, in particular the declarative access to
    data, while extending modeling power.

    +   - Upward compatibility with existing relational languages.'
  merge: -1
  img_proc: true
- pgno: 1195
  md: '# Complex Data Types




    +   - Permit non-atomic domains (atomic ≡ indivisible)


    +   - Example of non-atomic domain: set of integers, or set of tuples


    +   - Allows more intuitive modeling for applications with complex data




    +   - allow relations whenever we allow atomic (scalar) values — relations within
    relations


    +   - Retains mathematical foundation of relational model


    +   - Violates first normal form.'
