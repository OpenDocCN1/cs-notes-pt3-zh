- pgno: 911
  md: '# Centralized Systems


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_911_0.png)


    +   - Run on a single computer system and do not interact with other computer
    systems.

    +   - General-purpose computer system: one to a few CPUs and a number of device
    controllers that are connected through a common bus that provides access to shared
    memory.

    +   - Single-user system (e.g., personal computer or workstation): desk-top unit,
    single user, usually has only one CPU and one or two hard disks; the OS may support
    only one user.

    +   - Multi-user system: more disks, more memory, multiple CPUs, and a multi-user
    OS. Serve a large number of users who are connected to the system vie terminals.
    Often called *server* systems.'
  merge: -1
  img_proc: true
