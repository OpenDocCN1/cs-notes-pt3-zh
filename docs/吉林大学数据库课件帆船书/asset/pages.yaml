- pgno: 746
  md: '# View Serializability


    Let S and S′ be two schedules with the same set of transactions. S and S′ are
    view equivalent if the following three conditions are met, for each data item
    Q,


    +   1. If in schedule S, transaction T_i reads the initial value of Q, then in
    schedule S′ also transaction T_i must read the initial value of Q.

    +   2. If in schedule S transaction T_i executes read(Q), and that value was produced
    by transaction T_j (if any), then in schedule S′ also transaction T_i must read
    the value of Q that was produced by the same write(Q) operation of transaction
    T_j.

    +   3. The transaction (if any) that performs the final write(Q) operation in
    schedule S must also perform the final write(Q) operation in schedule S′.


    As can be seen, view equivalence is also based purely on reads and writes alone.'
  merge: -1
  img_proc: true
- pgno: 747
  md: '# View Serializability (Cont.)


    +   - A schedule S is **view serializable** if it is view equivalent to a serial
    schedule.

    +   - Every conflict serializable schedule is also view serializable.

    +   - Below is a schedule which is view-serializable but *not* conflict serializable.


    | T27 | T28 | T29 |

    |---|---|---|

    | read (Q) |  |  |

    | write (Q) | write (Q) |  |

    |  |  | write (Q) |


    +   - What serial schedule is above equivalent to?

    +   - Every view serializable schedule that is not conflict serializable has **blind
    writes**.'
  merge: -1
  img_proc: true
- pgno: 748
  md: '# Test for View Serializability


    +   - The precedence graph test for conflict serializability cannot be used directly
    to test for view serializability.

    +     - Extension to test for view serializability has cost exponential in the
    size of the precedence graph.

    +   - The problem of checking if a schedule is view serializable falls in the
    class of *NP*-complete problems.

    +     - Thus, existence of an efficient algorithm is *extremely* unlikely.

    +   - However, practical algorithms that just check some **sufficient conditions**
    for view serializability can still be used.'
  merge: -1
  img_proc: true
