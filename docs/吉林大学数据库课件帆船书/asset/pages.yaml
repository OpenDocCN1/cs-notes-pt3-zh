- pgno: 261
  md: '# Tuple Relational Calculus


    +   - A nonprocedural query language, where each query is of the form {t | P(t)}

    +   - It is the set of all tuples t such that predicate P is true for t

    +   - t is a tuple variable, t[A] denotes the value of tuple t on attribute A

    +   - t ∈ r denotes that tuple t is in relation r

    +   - P is a formula similar to that of the predicate calculus'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Predicate Calculus Formula


    +   1. Set of attributes and constants

    +   2. Set of comparison operators: (e.g., <, ≤, =, ≠, >, ≥)

    +   3. Set of connectives: and (∧), or (∨), not (¬)

    +   4. Implication (⇒): x ⇒ y, if x if true, then y is true

    +      x ⇒ y ≡ ¬x ∨ y

    +   5. Set of quantifiers:

    +      ∃ t ∈ r (Q(t)) ≡ "there exists" a tuple in t in relation r such that predicate
    Q(t) is true

    +      ∀ t ∈ r (Q(t)) ≡ Q is true "for all" tuples t in relation r'
  merge: -1
  img_proc: true
