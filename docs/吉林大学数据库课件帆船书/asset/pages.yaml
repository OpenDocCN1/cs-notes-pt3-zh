- pgno: 135
  md: '# Views Defined Using Other Views


    +   - One view may be used in the expression defining another view

    +   - A view relation v₁ is said to *depend directly* on a view relation v₂ if
    v₂ is used in the expression defining v₁

    +   - A view relation v₁ is said to *depend on* view relation v₂ if either v₁
    depends directly to v₂ or there is a path of dependencies from v₁ to v₂

    +   - A view relation v is said to be *recursive* if it depends on itself.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_136_0.png)


    # View Expansion


    +   A way to define the meaning of views defined in terms of other views.


    +   Let view v₁ be defined by an expression e₁ that may itself contain uses of
    view relations.


    +   View expansion of an expression repeats the following replacement step:


    ```

    repeat

    Find any view relation v_i in e_1

    Replace the view relation v_i by the expression defining v_i

    until no more view relations are present in e_1

    ```


    +   As long as the view definitions are not recursive, this loop will terminate'
  merge: -1
  img_proc: true
