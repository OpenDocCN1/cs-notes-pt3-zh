  md: '# Nested Subqueries


    +   - SQL provides a mechanism for the nesting of subqueries. A **subquery** is
    a **select-from-where** expression that is nested within another query.

    +   - The nesting can be done in the following SQL query


    ```

    select A₁, A₂, ..., Aₙ

    from r₁, r₂, ..., rₘ

    where P

    ```


    as follows:


    +   - Aᵢ can be replaced be a subquery that generates a single value.

    +   - rᵢ can be replaced by any valid subquery

    +   - P can be replaced with an expression of the form:

    +     B <operation> (subquery)

    +   Where B is an attribute and <operation> to be defined later.'
