- pgno: 191
  md: '# Embedded SQL


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_191_0.png)


    +   - The SQL standard defines embeddings of SQL in a variety of programming languages
    such as C, C++, Java, Fortran, and PL/1,


    +   - A language to which SQL queries are embedded is referred to as a host language,
    and the SQL structures permitted in the host language comprise embedded SQL.


    +   - The basic form of these languages follows that of the System R embedding
    of SQL into PL/1.


    +   - EXEC SQL statement is used to identify embedded SQL request to the preprocessor


    ```

    EXEC SQL <embedded SQL statement> ;

    ```


    Note: this varies by language:


    +   - In some languages, like COBOL, the semicolon is replaced with END-EXEC


    +   - In Java embedding uses # SQL { .... };'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Embedded SQL (Cont.)


    Before executing any SQL statements, the program must first connect to the database.
    This is done using:


    ```

    EXEC-SQL connect to server user user-name using password;

    ```


    Here, server identifies the server to which a connection is to be established.


    Variables of the host language can be used within embedded SQL statements. They
    are preceded by a colon (:) to distinguish from SQL variables (e.g., :credit_amount
    )


    Variables used as above must be declared within DECLARE section, as illustrated
    below. The syntax for declaring the variables, however, follows the usual host
    language syntax.


    ```

    EXEC-SQL BEGIN DECLARE SECTION

    int credit-amount ;

    EXEC-SQL END DECLARE SECTION;

    ```


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Embedded SQL (Cont.)


    +   - To write an embedded SQL query, we use the

    +     **declare c cursor for <SQL query>**

    +     statement. The variable c is used to identify the query

    +   - Example:

    +     - From within a host language, find the ID and name of students who have
    completed more than the number of credits stored in variable credit_amount in
    the host langue

    +     - Specify the query in SQL as follows:


    ```

    EXEC SQL


    declare c cursor for

    select ID, name

    from student

    where tot_cred > :credit_amount


    END_EXEC

    ```'
  merge: -1
  img_proc: true
