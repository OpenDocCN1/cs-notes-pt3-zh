- pgno: 865
  md: '# ARIES


    +   - ARIES is a state of the art recovery method

    +     - Incorporates numerous optimizations to reduce overheads during normal
    processing and to speed up recovery

    +     - The recovery algorithm we studied earlier is modeled after ARIES, but
    greatly simplified by removing optimizations

    +   - Unlike the recovery algorithm described earlier, ARIES

    +     1. Uses **log sequence number (LSN)** to identify log records

    +        - Stores LSNs in pages to identify what updates have already been applied
    to a database page

    +     2. Physiological redo

    +     3. Dirty page table to avoid unnecessary redos during recovery

    +     4. Fuzzy checkpointing that only records information about dirty pages,
    and does not require dirty pages to be written out at checkpoint time

    +        - More coming up on each of the above ...'
  merge: -1
  img_proc: true
- pgno: 866
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_866_0.png)


    # ARIES Optimizations


    +   - **Physiological redo**

    +     - Affected page is physically identified, action within page can be logical

    +       - Used to reduce logging overheads

    +         - e.g. when a record is deleted and all other records have to be moved
    to fill hole

    +           - Physiological redo can log just the record deletion

    +           - Physical redo would require logging of old and new values for much
    of the page

    +       - Requires page to be output to disk atomically

    +         - Easy to achieve with hardware RAID, also supported by some disk systems

    +         - Incomplete page output can be detected by checksum techniques,

    +           - But extra actions are required for recovery

    +           - Treated as a media failure'
  merge: -1
  img_proc: true
- pgno: 867
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 868
  md: '# ARIES Data Structures: Page LSN


    +   - Each page contains a **PageLSN** which is the LSN of the last log record
    whose effects are reflected on the page

    +     - To update a page:

    +       - X-latch the page, and write the log record

    +       - Update the page

    +       - Record the LSN of the log record in PageLSN

    +       - Unlock page

    +     - To flush page to disk, must first S-latch page

    +       - Thus page state on disk is operation consistent

    +         - Required to support physiological redo

    +     - PageLSN is used during recovery to prevent repeated redo

    +       - Thus ensuring idempotence'
  merge: -1
  img_proc: true
- pgno: 869
  md: '# ARIES Data Structures: Log Record


    +   Each log record contains LSN of previous log record of the same transaction


    | LSN | TransID | PrevLSN | RedoInfo | UndoInfo |


    +   LSN in log record may be implicit


    +   Special redo-only log record called compensation log record (CLR) used to
    log actions taken during recovery that never need to be undone


    +   Serves the role of operation-abort log records used in earlier recovery algorithm


    +   Has a field UndoNextLSN to note next (earlier) record to be undone


    +   Records in between would have already been undone


    +   Required to avoid repeated undo of already undone actions


    | LSN | TransID | UndoNextLSN | RedoInfo |


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_869_0.png)'
  merge: -1
  img_proc: true
- pgno: 870
  md: '# ARIES Data Structures: DirtyPage Table


    +   - **DirtyPageTable**

    +     - List of pages in the buffer that have been updated

    +     - Contains, for each such page

    +       - **PageLSN** of the page

    +       - **RecLSN** is an LSN such that log records before this LSN have already
    been applied to the page version on disk

    +         - Set to current end of log when a page is inserted into dirty page
    table (just before being updated)

    +         - Recorded in checkpoints, helps to minimize redo work'
  merge: -1
  img_proc: true
