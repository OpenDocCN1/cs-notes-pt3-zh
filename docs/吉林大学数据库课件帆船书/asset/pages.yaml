- pgno: 852
  md: '# Recovery with Early Lock Release


    +   - Support for high-concurrency locking techniques, such as those used for
    B⁺-tree concurrency control, which release locks early

    +     - Supports “logical undo”

    +   - Recovery based on “repeating history”, whereby recovery executes exactly
    the same actions as normal processing'
  merge: -1
  img_proc: true
- pgno: 853
  md: '# Logical Undo Logging


    +   - Operations like B⁺-tree insertions and deletions release locks early.

    +     - They cannot be undone by restoring old values (**physical undo**), since
    once a lock is released, other transactions may have updated the B⁺-tree.

    +     - Instead, insertions (resp. deletions) are undone by executing a deletion
    (resp. insertion) operation (known as **logical undo**).

    +   - For such operations, undo log records should contain the undo operation
    to be executed

    +     - Such logging is called **logical undo logging**, in contrast to **physical
    undo logging**

    +       - Operations are called **logical operations**

    +     - Other examples:

    +       - delete of tuple, to undo insert of tuple

    +         - allows early lock release on space allocation information

    +       - subtract amount deposited, to undo deposit

    +         - allows early lock release on bank balance


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_853_0.png)'
  merge: -1
  img_proc: true
- pgno: 854
  md: '# Physical Redo


    +   - Redo information is logged **physically** (that is, new value for each write)
    even for operations with logical undo

    +     - Logical redo is very complicated since database state on disk may not
    be “operation consistent” when recovery starts

    +     - Physical redo logging does not conflict with early lock release'
  merge: -1
  img_proc: true
- pgno: 855
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 856
  md: '# Operation Logging (Cont.)


    +   - If crash/rollback occurs before operation completes:

    +     - the **operation-end** log record is not found, and

    +     - the physical undo information is used to undo operation.

    +   - If crash/rollback occurs after the operation completes:

    +     - the **operation-end** log record is found, and in this case

    +     - logical undo is performed using *U*; the physical undo information for
    the operation is ignored.

    +   - Redo of operation (after crash) still uses physical redo information.'
  merge: -1
  img_proc: true
- pgno: 857
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_857_0.png)


    # Transaction Rollback with Logical Undo


    Rollback of transaction T_i is done as follows:


    +   Scan the log backwards


    +   1. If a log record <T_i, X, V_1, V_2> is found, perform the undo and log a
    al <T_i, X, V_1>.


    +   2. If a <T_i, O_j, operation-end, U> record is found


    +   Rollback the operation logically using the undo information U.


    +   Updates performed during roll back are logged just like during normal operation
    execution.


    +   At the end of the operation rollback, instead of logging an operation-end
    record, generate a record <T_i, O_j, operation-abort>.


    +   Skip all preceding log records for T_i until the record <T_i, O_j, operation-begin>
    is found'
  merge: -1
  img_proc: true
- pgno: 858
  md: '# Transaction Rollback with Logical Undo (Cont.)


    Transaction rollback, scanning the log backwards (cont.):


    +   3. If a redo-only record is found ignore it

    +   4. If a <T_i, O_j> operation-abort> record is found:

    +      skip all preceding log records for T_i until the record <T_i, O_j> operation-begin>
    is found.

    +   5. Stop the scan when the record <T_i, start> is found

    +   6. Add a <T_i, abort> record to the log


    Some points to note:


    +   Cases 3 and 4 above can occur only if the database crashes while a transaction
    is being rolled back.

    +   Skipping of log records as in case 4 is important to prevent multiple rollback
    of the same operation.'
  merge: -1
  img_proc: true
- pgno: 859
  md: '# # Transaction Rollback with Logical Undo


    # ## Transaction rollback during normal operation


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_859_0.png)


    T0 decides to abort




    +   <T0, start>

    +   <T0, B, 2000, 2050>

    +   <T0, O1, operation-begin>

    +   <T0, C, 700, 600>

    +   <T0, O1, operation-end, (C, +100)>

    +   <T1, start>

    +   <T1, O2, operation-begin>

    +   <T1, C, 600, 400>

    +   <T1, O2, operation-end, (C, +200)>


    +   <T0, C, 400, 500>

    +   <T0, O1, operation-abort>

    +   <T0, B, 2000>

    +   <T0, abort>

    +   <T1, commit>


    If T0 aborts before operation O1 ends, undo of update to C will be physical


    T0 has completed operation O1 on C, releases lower-level lock; physical undo cannot
    be done anymore, logical undo will add 100 to C


    T1 can update C since T0 has released lower-level lock on C


    T1 releases lower-level lock on C


    Logical undo of O1 adds 100 to C


    O1 undo complete'
  merge: -1
  img_proc: true
