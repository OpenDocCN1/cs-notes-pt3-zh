- pgno: 654
  md: "# Join Ordering Example (Cont.)\n\n+   - Consider the expression\n+   \n+ \
    \    \\(\\Pi_{name,\\ title}(\\sigma_{dept\\_name = \\text{“Music”}}(instructor)\
    \ \\bowtie teaches \\bowtie \\Pi_{course\\_id,\\ title}(course))\\)\n\n+   - Could\
    \ compute \\(teaches \\bowtie \\Pi_{course\\_id,\\ title}(course)\\) first, and\
    \ join result with\n+   \n+     \\(\\sigma_{dept\\_name = \\text{“Music”}}(instructor)\\\
    )\n+   \n+     but the result of the first join is likely to be a large relation.\n\
    \n+   - Only a small fraction of the university’s instructors are likely to be\
    \ from the Music department\n+     - it is better to compute\n+   \n+       \\\
    (\\sigma_{dept\\_name = \\text{“Music”}}(instructor) \\bowtie teaches\\)\n+  \
    \ \n+       first."
