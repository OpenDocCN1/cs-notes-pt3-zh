- pgno: 686
  md: "# Optimizing Nested Subqueries (Cont.)\n\nIn general, SQL queries of the form\
    \ below can be rewritten as shown\n\n+   - Rewrite: **select ...**\n+     **from**\
    \ *L₁*\n+     **where** *P₁* and exists (**select ***\n+     **from** *L₂*\n+\
    \     **where** *P₂*)\n\n+   - To: **create table** *t₁* as\n+     **select distinct**\
    \ *V*\n+     **from** *L₂*\n+     **where** *P₂¹*\n+   \n+     **select ...**\n\
    +     **from** *L₁, t₁*\n+     **where** *P₁* and *P₂²*\n\n+   - *P₂¹* contains\
    \ predicates in *P₂* that do not involve any correlation variables\n\n+   - *P₂²*\
    \ reintroduces predicates involving correlation variables, with relations renamed\
    \ appropriately\n\n+   - V contains all attributes used in predicates with correlation\
    \ variables"
  merge: -1
