- pgno: 1392
  md: '# Detailed Structure of a TP Monitor


    +   - Queue manager handles incoming messages

    +   - Some queue managers provide **persistent or durable message queueing** contents
    of queue are safe even if systems fails.

    +   - Durable queueing of outgoing messages is important

    +     - application server writes message to durable queue as part of a transaction

    +     - once the transaction commits, the TP monitor guarantees message is eventually
    delivered, regardless of crashes.

    +     - ACID properties are thus provided even for messages sent outside the database

    +   - Many TP monitors provide locking, logging and recovery services, to enable
    application servers to implement ACID properties by themselves.'
  merge: -1
  img_proc: true
- pgno: 1393
  md: '# Application Coordination Using TP Monitors


    +   - A TP monitor treats each subsystem as a **resource manager** that provides
    transactional access to some set of resources.

    +   - The interface between the TP monitor and the resource manager is defined
    by a set of transaction primitives

    +   - The resource manager interface is defined by the X/Open Distributed Transaction
    Processing standard.

    +   - TP monitor systems provide a **transactional remote procedure call (transactional
    RPC)** interface to their service

    +     - Transactional RPC provides calls to enclose a series of RPC calls within
    a transaction.

    +     - Updates performed by an RPC are carried out within the scope of the transaction,
    and can be rolled back if there is any failure.'
  merge: -1
  img_proc: true
