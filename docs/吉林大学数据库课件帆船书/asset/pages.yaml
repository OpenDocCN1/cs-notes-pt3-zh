- pgno: 1398
  md: '# Transactional Workflows


    +   - Must address following issues to computerize a workflow.

    +     - Specification of workflows - detailing the tasks that must be carried
    out and defining the execution requirements.

    +     - Execution of workflows - execute transactions specified in the workflow
    while also providing traditional database safeguards related to the correctness
    of computations, data integrity, and durability.

    +     - E.g.: Loan application should not get lost even if system fails.

    +   - Extend transaction concepts to the context of workflows.

    +   - State of a workflow - consists of the collection of states of its constituent
    tasks, and the states (i.e., values) of all variables in the execution plan.'
  merge: -1
  img_proc: true
- pgno: 1399
  md: "# Workflow Specification\n\n+   **Static specification of task coordination:**\n\
    +   \n+   - Tasks and dependencies among them are defined before the execution\
    \ of the workflow starts.\n+   - Can establish preconditions for execution of\
    \ each task: tasks are executed only when their preconditions are satisfied.\n\
    +   - Defined preconditions through dependencies:\n+     - Execution states of\
    \ other tasks.\n+       \"task t_i cannot start until task t_j has ended\"\n+\
    \     - Output values of other tasks.\n+       \"task t_i can start if task t_j\
    \ returns a value greater than 25\"\n+     - External variables, that are modified\
    \ by external events.\n+       \"task t_i must be started within 24 hours of the\
    \ completion of task t_j\""
  merge: -1
  img_proc: true
- pgno: 1400
  md: '# Workflow Specification (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1400_0.png)


    +   - **Dynamic task coordination**

    +     E.g., Electronic mail routing system in which the text to be schedule for
    a given mail message depends on the destination address and on which intermediate
    routers are functioning.'
  merge: -1
  img_proc: true
- pgno: 1401
  md: '# Failure-Atomicity Requirements


    +   - Usual ACID transactional requirements are too strong/ unimplementable for
    workflow applications.

    +   - However, workflows must satisfy some limited transactional properties that
    guarantee a process is not left in an inconsistent state.

    +   - **Acceptable termination states** - every execution of a workflow will terminate
    in a state that satisfies the failure-atomicity requirements defined by the designer.

    +     - Committed - objectives of a workflow have been achieved.

    +     - Aborted - valid termination state in which a workflow has failed to achieve
    its objectives.

    +   - A workflow must reach an acceptable termination state even in the presence
    of system failures.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1401_0.png)'
  merge: -1
  img_proc: true
- pgno: 1402
  md: '# Execution of Workflows


    Workflow management systems include:


    +   - **Scheduler** - program that process workflows by submitting various tasks
    for execution, monitoring various events, and evaluation conditions related to
    intertask dependencies

    +   - **Task agents** - control the execution of a task by a processing entity.

    +   - Mechanism to query to state of the workflow system.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1402_0.png)'
  merge: -1
  img_proc: true
- pgno: 1403
  md: '# Workflow Management System Architectures


    +   - **Centralized** - a single scheduler schedules the tasks for all concurrently
    executing workflows.

    +     - used in workflow systems where the data is stored in a central database.

    +     - easier to keep track of the state of a workflow.


    +   - **Partially distributed** - has one (instance of a) scheduler for each workflow.


    +   - **Fully distributed** - has no scheduler, but the task agents coordinate
    their execution by communicating with each other to satisfy task dependencies
    and other workflow execution requirements.

    +     - used in simplest workflow execution systems

    +     - based on electronic mail'
  merge: -1
  img_proc: true
- pgno: 1404
  md: '# Workflow Scheduler


    +   - Ideally scheduler should execute a workflow only after ensuring that it
    will terminate in an acceptable state.

    +   - Consider a workflow consisting of two tasks S₁ and S₂. Let the failure-atomicity
    requirement be that either both or neither of the subtransactions should be committed.

    +     - Suppose systems executing S₁ and S₂ do not provide prepared-to-commit
    states and S₁ or S₂ do not have compensating transactions.

    +     - It is then possible to reach a state where one subtransaction is committed
    and the other aborted. Both cannot then be brought to the same state.

    +     - Workflow specification is unsafe, and should be rejected.

    +   - Determination of safety by the scheduler is not possible in general, and
    is usually left to the designer of the workflow.'
  merge: -1
  img_proc: true
- pgno: 1405
  md: '# Recovery of a Workflow


    +   - Ensure that is a failure occurs in any of the workflow-processing components,
    the workflow eventually reaches an acceptable termination state.

    +   - Failure-recovery routines need to restore the state information of the scheduler
    at the time of failure, including the information about the execution states of
    each task. Log status information on stable storage.

    +   - Handoff of tasks between agents should occur exactly once in spite of failure.

    +   - Problem: Repeating handoff on recovery may lead to duplicate execution of
    task; not repeating handoff may lead to task not being executed.

    +     - Solution: Persistent messaging systems'
  merge: -1
  img_proc: true
- pgno: 1406
  md: '# Recovery of a Workflow (Cont.)


    +   - Persistent messages: messages are stored in permanent message queue and
    therefore not lost in case of failure.

    +     - Described in detail in Chapter 19 (Distributed Databases)

    +   - Before an agent commits, it writes to the persistent message queue whatever
    messages need to be sent out.

    +   - The persistent message system must make sure the messages get delivered
    eventually if and only if the transaction commits.

    +   - The message system needs to resend a message when the site recovers, if
    the message is not known to have reached its destination.

    +   - Messages must be logged in stable storage at the receiving end to detect
    multiple receipts of a message.'
  merge: -1
  img_proc: true
- pgno: 1407
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1407_0.png)


