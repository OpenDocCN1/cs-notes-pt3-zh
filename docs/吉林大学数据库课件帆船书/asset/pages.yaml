- pgno: 498
  md: '# Primary and Secondary Indices


    +   - Indices offer substantial benefits when searching for records.

    +   - BUT: Updating indices imposes overhead on database modification --when a
    file is modified, every index on the file must be updated,

    +   - Sequential scan using primary index is efficient, but a sequential scan
    using a secondary index is expensive

    +     - Each record access may fetch a new block from disk

    +     - Block fetch requires about 5 to 10 milliseconds, versus about 100 nanoseconds
    for memory access


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_498_0.png)'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# Multilevel Index


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_499_0.png)


    +   - If primary index does not fit in memory, access becomes expensive.


    +   - Solution: treat primary index kept on disk as a sequential file and construct
    a sparse index on it.

    +     - outer index – a sparse index of primary index

    +     - inner index – the primary index file


    +   - If even outer index is too large to fit in main memory, yet another level
    of index can be created, and so on.


    +   - Indices at all levels must be updated on insertion or deletion from the
    file.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# Multilevel Index (Cont.)


