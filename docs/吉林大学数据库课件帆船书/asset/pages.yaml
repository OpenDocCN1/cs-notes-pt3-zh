- pgno: 283
  md: '# First Normal Form


    +   - Domain is **atomic** if its elements are considered to be indivisible units

    +     - Examples of non-atomic domains:

    +       - Set of names, composite attributes

    +       - Identification numbers like CS101 that can be broken up into parts


    +   - A relational schema R is in **first normal form** if the domains of all
    attributes of R are atomic


    +   - Non-atomic values complicate storage and encourage redundant (repeated)
    storage of data

    +     - Example: Set of accounts stored with each customer, and set of owners
    stored with each account

    +     - We assume all relations are in first normal form (and revisit this in
    Chapter 22: Object Based Databases)'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# First Normal Form (Cont’d)


    ■ Atomicity is actually a property of how the elements of the domain are used.


    • Example: Strings would normally be considered indivisible


    • Suppose that students are given roll numbers which are strings of the form CS0012
    or EE1127


    • If the first two characters are extracted to find the department, the domain
    of roll numbers is not atomic.


    • Doing so is a bad idea: leads to encoding of information in application program
    rather than in the database.'
  merge: -1
