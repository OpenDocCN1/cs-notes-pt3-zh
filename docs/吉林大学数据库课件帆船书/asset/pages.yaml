- pgno: 480
  md: '# Storage Access


    +   - A database file is partitioned into fixed-length storage units called **blocks**.
    Blocks are units of both storage allocation and data transfer.

    +   - Database system seeks to minimize the number of block transfers between
    the disk and memory. We can reduce the number of disk accesses by keeping as many
    blocks as possible in main memory.

    +   - **Buffer** – portion of main memory available to store copies of disk blocks.

    +   - **Buffer manager** – subsystem responsible for allocating buffer space in
    main memory.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_480_0.png)'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# Buffer Manager


    Programs call on the buffer manager when they need a block from disk.


    +   1. If the block is already in the buffer, buffer manager returns the address
    of the block in main memory

    +   2. If the block is not in the buffer, the buffer manager

    +      1. Allocates space in the buffer for the block

    +         1. Replacing (throwing out) some other block, if required, to make space
    for the new block.

    +         2. Replaced block written back to disk only if it was modified since
    the most recent time that it was written to/fetched from the disk.

    +      2. Reads the block from the disk to the buffer, and returns the address
    of the block in main memory to requester.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# Buffer-Replacement Policies


    +   - Most operating systems replace the block **least recently used** (**LRU
    strategy**)


    +   - Idea behind LRU – use past pattern of block references as a predictor of
    future references


    +   - Queries have well-defined access patterns (such as sequential scans), and
    a database system can use the information in a user’s query to predict future
    references


    +   - LRU can be a bad strategy for certain access patterns involving repeated
    scans of data


    +   - For example: when computing the join of 2 relations r and s by a nested
    loops

    +     for each tuple tr of r do

    +     for each tuple ts of s do

    +     if the tuples tr and ts match ...


    +   - Mixed strategy with hints on replacement strategy provided by the query
    optimizer is preferable'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# Buffer-Replacement Policies (Cont.)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_483_0.png)


    +   - **Pinned block** – memory block that is not allowed to be written back to
    disk.

    +   - **Toss-immediate strategy** – frees the space occupied by a block as soon
    as the final tuple of that block has been processed

    +   - **Most recently used (MRU) strategy** – system must pin the block currently
    being processed. After the final tuple of that block has been processed, the block
    is unpinned, and it becomes the most recently used block.

    +   - Buffer manager can use statistical information regarding the probability
    that a request will reference a particular relation

    +     - E.g., the data dictionary is frequently accessed. Heuristic: keep data-dictionary
    blocks in main memory buffer

