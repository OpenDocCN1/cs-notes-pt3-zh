    # Mobile Computing Environments


    +   - A mobile computing environment consists of mobile computers, referred to
    as **mobile hosts**, and a wired network of computers.

    +   - Mobile host may be able to communicate with wired network through a *wireless
    digital communication network*

    +     - Wireless local-area networks (within a building)

    +       - E.g., Avaya’s Orinico Wireless LAN

    +     - Wide areas networks

    +       - Cellular digital packet networks

    +         - 3 G and 2.5 G cellular networks'
  merge: -1
  img_proc: true
- pgno: 1370
  md: '# Mobile Computing Environments (Cont.)


    +   - A model for mobile communication

    +     - Mobile hosts communicate to the wired network via computers referred to
    as **mobile support (or base) stations**.

    +     - Each mobile support station manages those mobile hosts within its **cell**.

    +     - When mobile hosts move between cells, there is a **handoff** of control
    from one mobile support station to another.


    +   - Direct communication, without going through a mobile support station is
    also possible between nearby mobile hosts

    +     - Supported, for e.g., by the Bluetooth standard (up to 10 meters, at up
    to 721 kbps)'
  merge: -1
  img_proc: true
- pgno: 1371
  md: '# Database Issues in Mobile Computing


    +   - New issues for query optimization.

    +     - Connection time charges and number of bytes transmitted

    +     - Energy (battery power) is a scarce resource and its usage must be minimized

    +   - Mobile user’s locations may be a parameter of the query

    +     - GIS queries

    +     - Techniques to track locations of large numbers of mobile hosts

    +   - Broadcast data can enable any number of clients to receive the same data
    at no extra cost

    +     - leads to interesting querying and data caching issues.

    +   - Users may need to be able to perform database updates even while the mobile
    computer is disconnected.

    +     - E.g., mobile salesman records sale of products on (local copy of) database.

    +     - Can result in conflicts detected on reconnection, which may need to be
    resolved manually.'
  merge: -1
  img_proc: true
- pgno: 1372
  md: '# Routing and Query Processing


    +   - Must consider these competing costs:

    +     - User time.

    +     - Communication cost

    +       - Connection time - used to assign monetary charges in some cellular systems.

    +       - Number of bytes, or packets, transferred - used to compute charges in
    digital cellular systems

    +       - Time-of-day based charges - vary based on peak or off-peak periods

    +     - Energy - optimize use of battery power by minimizing reception and transmission
    of data.

    +       - Receiving radio signals requires much less energy than transmitting
    radio signals.'
  merge: -1
  img_proc: true
- pgno: 1373
  md: '# Broadcast Data


    +   - Mobile support stations can broadcast frequently-requested data

    +     - Allows mobile hosts to wait for needed data, rather than having to consume
    energy transmitting a request

    +     - Supports mobile hosts without transmission capability

    +   - A mobile host may optimize energy costs by determining if a query can be
    answered using only cached data

    +     - If not then must either;

    +       - Wait for the data to be broadcast

    +       - Transmit a request for data and must know when the relevant data will
    be broadcast.

    +   - Broadcast data may be transmitted according to a fixed schedule or a changeable
    schedule.

    +     - For changeable schedule: the broadcast schedule must itself be broadcast
    at a well-known radio frequency and at well-known time intervals

    +   - Data reception may be interrupted by noise

    +     - Use techniques similar to RAID to transmit redundant data (parity)'
  merge: -1
  img_proc: true
- pgno: 1374
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1374_0.png)


    # Disconnectivity and Consistency


    +   - A mobile host may remain in operation during periods of disconnection.

    +   - Problems created if the user of the mobile host issues queries and updates
    on data that resides or is cached locally:

    +     - **Recoverability**: Updates entered on a disconnected machine may be lost
    if the mobile host fails. Since the mobile host represents a single point of failure,
    stable storage cannot be simulated well.

    +     - **Consistency**: Cached data may become out of date, but the mobile host
    cannot discover this until it is reconnected.'
  merge: -1
  img_proc: true
- pgno: 1375
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1375_0.png)


    # # Mobile Updates


    +   - Partitioning via disconnection is the normal mode of operation in mobile
    computing.

    +   - For data updated by only one mobile host, simple to propagate update when
    mobile host reconnects

    +     - In other cases data may become invalid and updates may conflict.

    +   - When data are updated by other computers, **invalidation reports** inform
    a reconnected mobile host of out-of-date cache entries

    +     - However, mobile host may miss a report.

    +   - **Version-numbering**-based schemes guarantee only that if two hosts independently
    update the same version of a document, the clash will be detected eventually,
    when the hosts exchange information either directly or through a common host.

    +     - More on this shortly

    +   - Automatic reconciliation of inconsistent copies of data is difficult

    +     - Manual intervention may be needed'
  merge: -1
  img_proc: true
- pgno: 1376
  md: '# Detecting Inconsistent Updates


    +   - Version vector scheme used to detect inconsistent updates to documents at
    different hosts (sites).


    +   - Copies of document *d* at hosts *i* and *j* are **inconsistent** if:

    +     1. the copy of document *d* at *j* contains updates performed by host *k*
    that have not been propagated to host *j* (*k* may be the same as *j*), and

    +     2. the copy of *d* at *j* contains updates performed by host *l* that have
    not been propagated to host *i* (*l* may be the same as *j*).


    +   - Basic idea: each host *i* stores, with its copy of each document *d*, a
    **version vector** - a set of version numbers, with an element \(V_{d,i}[k]\)
    for every other host *k*.


    +   - When a host *j* updates a document *d*, it increments the version number
    \(V_{d,j}[j]\) by 1.'
  merge: -1
  img_proc: true
- pgno: 1377
  md: "# Detecting Inconsistent Updates (Cont.)\n\nWhen two hosts i and j connect\
    \ to each other they check if the copies of all documents d that they share are\
    \ consistent:\n\n+   1. If the version vectors are the same on both hosts (that\
    \ is, for each k, Vd,i[k] = Vd,j[k]) then the copies of d are identical.\n+  \
    \ \n+   2. If, for each k, Vd,i[k] ≤ Vd,j[k], and the version vectors are not\
    \ identical, then the copy of document d at host i is older than the one at host\
    \ j\n+   \n+   ▸ That is, the copy of document d at host j was obtained by one\
    \ or more modifications of the copy of d at host i.\n+   \n+   ▸ Host i replaces\
    \ its copy of d, as well as its copy of the version vector for d, with the copies\
    \ from host j.\n+   \n+   3. If there is a pair of hosts k and m such that Vd,i[k]<\
    \ Vd,j[k], and Vd,i[m] > Vd,j[m], then the copies are inconsistent\n+   \n+  \
    \ ▸ That is, two or more updates have been performed on d independently."
  merge: -1
  img_proc: true
- pgno: 1378
  md: '# Handling Inconsistent Updates


    +   - Dealing with inconsistent updates is hard in general. Manual intervention
    often required to merge the updates.

    +   - Version vector schemes

    +     - were developed to deal with failures in a distributed file system, where
    inconsistencies are rare.

    +     - are used to maintain a unified file system between a fixed host and a
    mobile computer, where updates at the two hosts have to be merged periodically.

    +       - Also used for similar purposes in groupware systems.

    +     - are used in database systems where mobile users may need to perform transactions.

    +       - In this case, a “document” may be a single record.

    +   - Inconsistencies must either be very rare, or fall in special cases that
    are easy to deal with in most cases


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1378_0.png)'
  merge: -1
  img_proc: true
