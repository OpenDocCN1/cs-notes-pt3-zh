- pgno: 1237
  md: '# Motivation for Nesting


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1237_0.png)


    +   - Nesting of data is useful in data transfer

    +     - Example: elements representing *item* nested within an *itemlist* element

    +   - Nesting is not supported, or discouraged, in relational databases

    +     - With multiple orders, customer name and address are stored redundantly

    +     - normalization replaces nested structures in each order by foreign key
    into table storing customer name and address information

    +     - Nesting is supported in object-relational databases

    +   - But nesting is appropriate when transferring data

    +     - External application does not have direct access to data referenced by
    a foreign key'
  merge: -1
  img_proc: true
- pgno: 1238
  md: "# Structure of XML Data (Cont.)\n\n+   - Mixture of text with sub-elements\
    \ is legal in XML.\n+     - Example:\n+     - Useful for document markup, but\
    \ discouraged for data representation\n\n```\n<course>\n    This course is being\
    \ offered for the first time in 2009.\n    <course id> BIO-399 </course id>\n\
    \    <title> Computational Biology </title>\n    <dept name> Biology </dept name>\n\
    \    <credits> 3 </credits>\n</course>\n```"
