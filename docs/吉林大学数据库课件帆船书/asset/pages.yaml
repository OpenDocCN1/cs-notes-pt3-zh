- pgno: 730
  md: "# # Serializability\n\n+   - Basic Assumption – Each transaction preserves\
    \ database consistency.\n+   - Thus, serial execution of a set of transactions\
    \ preserves database consistency.\n+   - A (possibly concurrent) schedule is serializable\
    \ if it is equivalent to a serial schedule. Different forms of schedule equivalence\
    \ give rise to the notions of:\n+   \n+   1. conflict serializability\n+   \n\
    +   2. view serializability"
  merge: -1
  img_proc: true
- pgno: 731
  md: '# Simplified view of transactions


    +   - We ignore operations other than **read** and **write** instructions

    +   - We assume that transactions may perform arbitrary computations on data in
    local buffers in between reads and writes.

    +   - Our simplified schedules consist of only **read** and **write** instructions.'
  merge: -1
  img_proc: true
- pgno: 732
  md: '# Conflicting Instructions


    +   - Let $I_i$ and $I_j$ be two Instructions of transactions $T_i$ and $T_j$
    respectively. Instructions $I_i$ and $I_j$ **conflict** if and only if there exists
    some item Q accessed by both $I_i$ and $I_j$, and at least one of these instructions
    wrote Q.

    +     1. $I_i$ = read(Q), $I_j$ = read(Q). $I_i$ and $I_j$ don''t conflict.

    +     2. $I_i$ = read(Q), $I_j$ = write(Q). They conflict.

    +     3. $I_i$ = write(Q), $I_j$ = read(Q). They conflict

    +     4. $I_i$ = write(Q), $I_j$ = write(Q). They conflict


    +   - Intuitively, a conflict between $I_i$ and $I_j$ forces a (logical) temporal
    order between them.

    +     - If $I_i$ and $I_j$ are consecutive in a schedule and they do not conflict,
    their results would remain the same even if they had been interchanged in the
    schedule.'
  merge: -1
  img_proc: true
