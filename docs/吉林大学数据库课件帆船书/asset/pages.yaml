- pgno: 736
  md: '# Precedence Graph


    +   - Consider some schedule of a set of transactions $T_1$, $T_2$, ..., $T_n$

    +   - **Precedence graph** — a direct graph where the vertices are the transactions
    (names).

    +   - We draw an arc from $T_i$ to $T_j$ if the two transaction conflict, and
    $T_i$ accessed the data item on which the conflict arose earlier.

    +   - We may label the arc by the item that was accessed.

    +   - **Example**


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_736_0.png)'
  merge: -1
  img_proc: true
- pgno: 737
  md: '# Testing for Conflict Serializability


    +   - A schedule is conflict serializable if and only if its precedence graph
    is acyclic.

    +   - Cycle-detection algorithms exist which take order $n^2$ time, where $n$
    is the number of vertices in the graph.

    +     - (Better algorithms take order $n + e$ where $e$ is the number of edges.)

    +   - If precedence graph is acyclic, the serializability order can be obtained
    by a *topological sorting* of the graph.

    +     - That is, a linear order consistent with the partial order of the graph.

    +     - For example, a serializability order for the schedule (a) would be one
    of either (b) or (c)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_737_0.png)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_737_1.png)


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_737_2.png)'
  merge: -1
  img_proc: true
- pgno: 738
  md: '# Recoverable Schedules


    +   - **Recoverable schedule** — if a transaction $T_j$ reads a data item previously
    written by a transaction $T_i$, then the commit operation of $T_i$ **must** appear
    before the commit operation of $T_j$.

    +   - The following schedule is not recoverable if $T_9$ commits immediately after
    the read(A) operation.

    +   - If $T_8$ should abort, $T_9$ would have read (and possibly shown to the
    user) an inconsistent database state. Hence, database must ensure that schedules
    are recoverable.


    | $T_8$ | $T_9$ |

    | --- | --- |

    | read (A) | |

    | write (A) | |

    |  | read (A) |

    |  | commit |

    | read (B) | |'
  merge: -1
  img_proc: true
- pgno: 739
  md: '# Cascading Rollbacks


    Cascading rollback – a single transaction failure leads to a series of transaction
    rollbacks. Consider the following schedule where none of the transactions has
    yet committed (so the schedule is recoverable)


    | T10 | T11 | T12 |

    |---|---|---|

    | read (A) |  |  |

    | read (B) |  |  |

    | write (A) |  |  |

    |  | read (A) |  |

    |  | write (A) |  |

    |  |  | read (A) |

    | abort |  |  |


    If T10 fails, T11 and T12 must also be rolled back.


    +   Can lead to the undoing of a significant amount of work'
  merge: -1
