- pgno: 872
  md: '# ARIES Data Structures: Checkpoint Log


    +   - **Checkpoint log record**

    +     - Contains:

    +       - DirtyPageTable and list of active transactions

    +       - For each active transaction, LastLSN, the LSN of the last log record
    written by the transaction

    +     - Fixed position on disk notes LSN of last completed checkpoint log record


    +   - Dirty pages are not written out at checkpoint time

    +     - Instead, they are flushed out continuously, in the background


    +   - Checkpoint is thus very low overhead

    +     - can be done frequently'
  merge: -1
  img_proc: true
- pgno: 873
  md: '# ARIES Recovery Algorithm


    ARIES recovery involves three passes


    +   - Analysis pass: Determines

    +   - Which transactions to undo

    +   - Which pages were dirty (disk version not up to date) at time of crash

    +   - RedoLSN: LSN from which redo should start


    +   - Redo pass:

    +   - Repeats history, redoing all actions from RedoLSN

    +   - RecLSN and PageLSNs are used to avoid redoing actions already reflected
    on page


    +   - Undo pass:

    +   - Rolls back all incomplete transactions

    +   - Transactions whose abort was complete earlier are not undone

    +   - Key idea: no need to undo these transactions: earlier undo actions were
    logged, and are redone as required'
  merge: -1
  img_proc: true
- pgno: 874
  md: '# Aries Recovery: 3 Passes


    +   - Analysis, redo and undo passes

    +   - Analysis determines where redo should start

    +   - Undo has to go back till start of earliest incomplete transaction


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_874_0.png)'
  merge: -1
  img_proc: true
- pgno: 875
  md: '# ARIES Recovery: Analysis


    # Analysis pass


    +   - Starts from last complete checkpoint log record

    +     - Reads DirtyPageTable from log record

    +     - Sets RedoLSN = min of RecLSNs of all pages in DirtyPageTable

    +       - In case no pages are dirty, RedoLSN = checkpoint record’s LSN

    +     - Sets undo-list = list of transactions in checkpoint log record

    +     - Reads LSN of last log record for each transaction in undo-list from checkpoint
    log record

    +   - Scans forward from checkpoint

    +   - .. Cont. on next page ...'
  merge: -1
  img_proc: true
- pgno: 876
  md: '# ARIES Recovery: Analysis (Cont.)


    # Analysis pass (cont.)


    +   - Scans forward from checkpoint

    +     - If any log record found for transaction not in undo-list, adds transaction
    to undo-list

    +     - Whenever an update log record is found

    +       - If page is not in DirtyPageTable, it is added with RecLSN set to LSN
    of the update log record

    +     - If transaction end log record found, delete transaction from undo-list

    +     - Keeps track of last log record for each transaction in undo-list

    +       - May be needed for later undo

    +   - At end of analysis pass:

    +     - RedoLSN determines where to start redo pass

    +     - RecLSN for each page in DirtyPageTable used to minimize redo work

    +     - All transactions in undo-list need to be rolled back'
  merge: -1
  img_proc: true
- pgno: 877
  md: '# ARIES Redo Pass


    Redo Pass: Repeats history by replaying every action not already reflected in
    the page on disk, as follows:


    +   Scans forward from RedoLSN. Whenever an update log record is found:


    +   1. If the page is not in DirtyPageTable or the LSN of the log record is less
    than the RecLSN of the page in DirtyPageTable, then skip the log record

    +   2. Otherwise fetch the page from disk. If the PageLSN of the page fetched
    from disk is less than the LSN of the log record, redo the log record


    NOTE: if either test is negative the effects of the log record have already appeared
    on the page. First test avoids even fetching the page from disk!'
  merge: -1
  img_proc: true
- pgno: 878
  md: '# ARIES Undo Actions


    +   When an undo is performed for an update log record

    +   - Generate a CLR containing the undo action performed (actions performed during
    undo are logged physically or physiologically).

    +     - CLR for record n noted as n'' in figure below

    +   - Set UndoNextLSN of the CLR to the PrevLSN value of the update log record

    +     - Arrows indicate UndoNextLSN value


    +   ARIES supports partial rollback

    +   - Used e.g. to handle deadlocks by rolling back just enough to release reqd.
    locks

    +   - Figure indicates forward actions after partial rollbacks

    +     - records 3 and 4 initially, later 5 and 6, then full rollback


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_878_0.png)'
  merge: -1
  img_proc: true
- pgno: 879
  md: '# ARIES: Undo Pass


    # Undo pass:


    +   - Performs backward scan on log undoing all transaction in undo-list

    +     - Backward scan optimized by skipping unneeded log records as follows:

    +       - Next LSN to be undone for each transaction set to LSN of last log record
    for transaction found by analysis pass.

    +       - At each step pick largest of these LSNs to undo, skip back to it and
    undo it

    +       - After undoing a log record

    +         - For ordinary log records, set next LSN to be undone for transaction
    to PrevLSN noted in the log record

    +         - For compensation log records (CLRs) set next LSN to be undo to UndoNextLSN
    noted in the log record

    +           - All intervening records are skipped since they would have been undone
    already

    +   - Undos performed as described earlier'
  merge: -1
  img_proc: true
- pgno: 880
  md: '# Recovery Actions in ARIES


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_880_0.png)'
  merge: -1
  img_proc: true
- pgno: 881
  md: '# Other ARIES Features


    +   - Recovery Independence

    +     - Pages can be recovered independently of others

    +       - E.g. if some disk pages fail they can be recovered from a backup while
    other pages are being used


    +   - Savepoints:

    +     - Transactions can record savepoints and roll back to a savepoint

    +       - Useful for complex transactions

    +       - Also used to rollback just enough to release locks on deadlock'
  merge: -1
  img_proc: true
- pgno: 882
  md: '# Other ARIES Features (Cont.)


    +   - Fine-grained locking:

    +     - Index concurrency algorithms that permit tuple level locking on indices
    can be used

    +       - These require logical undo, rather than physical undo, as in earlier
    recovery algorithm

    +   - Recovery optimizations: For example:

    +     - Dirty page table can be used to prefetch pages during redo

    +     - Out of order redo is possible:

    +       - redo can be postponed on a page being fetched from disk, and performed
    when page is fetched.

    +       - Meanwhile other log records can continue to be processed'
  merge: -1
  img_proc: true
- pgno: 883
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_883_0.png)


    # Remote Backup Systems'
  merge: -1
  img_proc: true
- pgno: 884
  md: '# Remote Backup Systems


    +   Remote backup systems provide high availability by allowing transaction processing
    to continue even if the primary site is destroyed.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_884_0.png)'
  merge: -1
  img_proc: true
- pgno: 885
  md: '# Remote Backup Systems (Cont.)


    +   - **Detection of failure**: Backup site must detect when primary site has
    failed

    +     - to distinguish primary site failure from link failure maintain several
    communication links between the primary and the remote backup.

    +     - Heart-beat messages

    +   - **Transfer of control**:

    +     - To take over control backup site first perform recovery using its copy
    of the database and all the long records it has received from the primary.

    +       - Thus, completed transactions are redone and incomplete transactions
    are rolled back.

    +     - When the backup site takes over processing it becomes the new primary

    +     - To transfer control back to old primary when it recovers, old primary
    must receive redo logs from the old backup and apply all updates locally.'
  merge: -1
  img_proc: true
- pgno: 886
  md: '# Remote Backup Systems (Cont.)


    +   - **Time to recover:** To reduce delay in takeover, backup site periodically
    processes the redo log records (in effect, performing recovery from previous database
    state), performs a checkpoint, and can then delete earlier parts of the log.

    +   - **Hot-Spare** configuration permits very fast takeover:

    +     - Backup continually processes redo log record as they arrive, applying
    the updates locally.

    +     - When failure of the primary is detected the backup rolls back incomplete
    transactions, and is ready to process new transactions.

    +   - Alternative to remote backup: distributed database with replicated data

    +     - Remote backup is faster and cheaper, but less tolerant to failure

    +       - more on this in Chapter 19'
  merge: -1
  img_proc: true
- pgno: 887
  md: '# Remote Backup Systems (Cont.)


    +   Ensure durability of updates by delaying transaction commit until update is
    logged at backup; avoid this delay by permitting lower degrees of durability.


    +   **One-safe**: commit as soon as transaction''s commit log record is written
    at primary


    +   Problem: updates may not arrive at backup before it takes over.


    +   **Two-very-safe**: commit when transaction''s commit log record is written
    at primary and backup


    +   Reduces availability since transactions cannot commit if either site fails.


    +   **Two-safe**: proceed as in two-very-safe if both primary and backup are active.
    If only the primary is active, the transaction commits as soon as is commit log
    record is written at the primary.


    +   Better availability than two-very-safe; avoids problem of lost transactions
    in one-safe.'
  merge: -1
  img_proc: true
