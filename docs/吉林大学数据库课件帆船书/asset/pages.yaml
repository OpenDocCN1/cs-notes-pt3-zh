- pgno: 471
  md: '# Variable-Length Records


    +   - Variable-length records arise in database systems in several ways:

    +     - Storage of multiple record types in a file.

    +     - Record types that allow variable lengths for one or more fields such as
    strings (**varchar**)

    +     - Record types that allow repeating fields (used in some older data models).

    +   - Attributes are stored in order

    +   - Variable length attributes represented by fixed size (offset, length), with
    actual data stored after all fixed length attributes

    +   - Null values represented by null-value bitmap


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_471_0.png)'
  merge: -1
  img_proc: true
- pgno: 472
  md: '# Variable-Length Records: Slotted Page Structure


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_472_0.png)


    +   - Slotted page header contains:

    +     - number of record entries

    +     - end of free space in the block

    +     - location and size of each record

    +   - Records can be moved around within a page to keep them contiguous with no
    empty space between them; entry in the header must be updated.

    +   - Pointers should not point directly to record — instead they should point
    to the entry for the record in header.'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# Organization of Records in Files


    +   - **Heap** – a record can be placed anywhere in the file where there is space

    +   - **Sequential** – store records in sequential order, based on the value of
    the search key of each record

    +   - **Hashing** – a hash function computed on some attribute of each record;
    the result specifies in which block of the file the record should be placed

    +   - Records of each relation may be stored in a separate file. In a **multitable
    clustering file organization** records of several different relations can be stored
    in the same file

    +     - Motivation: store related records on the same block to minimize I/O'
  merge: -1
  img_proc: true
