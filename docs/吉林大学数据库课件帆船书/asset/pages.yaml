  md: "# Optimizing Nested Subqueries (Cont.)\n\n+   - In our example, the original\
    \ nested query would be transformed to **create table t₁ as**\n+     **select\
    \ distinct ID**\n+     **from teaches**\n+     **where year = 2007**\n+   \n+\
    \     **select name**\n+     **from instructor, t₁**\n+     **where t₁.ID = instructor.ID**\n\
    \n+   - The process of replacing a nested query by a query with a join (possibly\
    \ with a temporary relation) is called **decorrelation**.\n\n+   - Decorrelation\
    \ is more complicated when\n+     - the nested subquery uses aggregation, or\n\
