- pgno: 1057
  md: '# False Cycles (Cont.)


    +   - Suppose that starting from the state shown in figure,

    +     1. $T_2$ releases resources at $S_1$

    +        - resulting in a message remove $T_1 \rightarrow T_2$ message from the
    Transaction Manager at site $S_1$ to the coordinator)

    +     2. And then $T_2$ requests a resource held by $T_3$ at site $S_2$

    +        - resulting in a message insert $T_2 \rightarrow T_3$ from $S_2$ to the
    coordinator

    +   - Suppose further that the insert message reaches before the **delete** message

    +     - this can happen due to network delays

    +   - The coordinator would then find a false cycle

    +     $T_1 \rightarrow T_2 \rightarrow T_3 \rightarrow T_1$

    +   - The false cycle above never existed in reality.

    +   - False cycles cannot occur if two-phase locking is used.'
  merge: -1
  img_proc: true
- pgno: 1058
  md: '# Unnecessary Rollbacks


    +   - Unnecessary rollbacks may result when deadlock has indeed occurred and a
    victim has been picked, and meanwhile one of the transactions was aborted for
    reasons unrelated to the deadlock.


    +   - Unnecessary rollbacks can result from false cycles in the global wait-for
    graph; however, likelihood of false cycles is low.'
  merge: -1
  img_proc: true
