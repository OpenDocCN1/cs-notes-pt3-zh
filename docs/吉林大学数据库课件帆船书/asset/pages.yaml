    <T₀ commit>

    <T₁ start>

    <T₁, C, 700, 600>

    <T₁ commit>

    (c)

    ```


    Recovery actions in each case above are:


    +   (a) undo (T₀): B is restored to 2000 and A to 1000, and log records <T₀, B,
    2000>, <T₀, A, 1000>, <T₀, abort> are written out

    +   (b) redo (T₀) and undo (T₁): A and B are set to 950 and 2050 and C is restored
    to 700. Log records <T₁, C, 700>, <T₁, abort> are written out.

    +   (c) redo (T₀) and redo (T₁): A and B are set to 950 and 2050 respectively.
    Then C is set to 600'
