- pgno: 831
  md: '# Undo and Redo on Recovering from Failure


    +   - When recovering after failure:

    +     - Transaction $T_i$ needs to be undone if the log

    +       - contains the record <$T_i$ start>,

    +       - but does not contain either the record <$T_i$ commit> or <$T_i$ abort>.

    +     - Transaction $T_i$ needs to be redone if the log

    +       - contains the records <$T_i$ start>

    +       - and contains the record <$T_i$ commit> or <$T_i$ abort>


    +   - Note that If transaction $T_i$ was undone earlier and the <$T_i$ abort>
    record written to the log, and then a failure occurs, on recovery from failure
    $T_i$ is redone

    +     - such a redo redooes all the original actions including the steps that
    restored old values

    +       - Known as repeating history

    +       - Seems wasteful, but simplifies recovery greatly'
  merge: -1
  img_proc: true
- pgno: 832
  md: '# Immediate DB Modification Recovery Example


    Below we show the log as it appears at three instances of time.


    ```

    <T₀ start>

    <T₀, A, 1000, 950>

    <T₀, B, 2000, 2050>

    (a)

    ```


    ```

    <T₀ start>

    <T₀, A, 1000, 950>

    <T₀, B, 2000, 2050>

    <T₀ commit>

    <T₁ start>

    <T₁, C, 700, 600>

