- pgno: 929
  md: '# # Batch and Transaction Scaleup




    +   - A single large job; typical of most decision support queries and scientific
    simulation.


    +   - Use an N-times larger computer on N-times larger problem.




    +   - Numerous small queries submitted by independent users to a shared database;
    typical transaction processing and timesharing systems.


    +   - N-times as many users submitting requests (hence, N-times as many requests)
    to an N-times larger database, on an N-times larger computer.


    +   - Well-suited to parallel execution.'
  merge: -1
  img_proc: true
- pgno: 930
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_930_0.png)


    # Factors Limiting Speedup and Scaleup


    Speedup and scaleup are often sublinear due to:


    +   - **Startup costs**: Cost of starting up multiple processes may dominate computation
    time, if the degree of parallelism is high.

    +   - **Interference**: Processes accessing shared resources (e.g., system bus,
    disks, or locks) compete with each other, thus spending time waiting on other
    processes, rather than performing useful work.

    +   - **Skew**: Increasing the degree of parallelism increases the variance in
    service times of parallelly executing tasks. Overall execution time determined
    by **slowest** of parallelly executing tasks.'
  merge: -1
  img_proc: true
- pgno: 931
  md: "# # Interconnection Network Architectures\n\n+   - **Bus.** System components\
    \ send data on and receive data from a single communication bus;\n+   \n+    \
    \ - Does not scale well with increasing parallelism.\n\n+   - **Mesh.** Components\
    \ are arranged as nodes in a grid, and each component is connected to all adjacent\
    \ components\n+   \n+     - Communication links grow with growing number of components,\
    \ and so scales better.\n+   \n+     - But may require 2√n hops to send message\
    \ to a node (or √n with wraparound connections at edge of grid).\n\n+   - **Hypercube.**\
    \ Components are numbered in binary; components are connected to one another if\
    \ their binary representations differ in exactly one bit.\n+   \n+     - n components\
    \ are connected to log(n) other components and can reach each other via at most\
    \ log(n) links; reduces communication delays."
  merge: -1
  img_proc: true
