- pgno: 1131
  md: '# Decision Support Systems


    +   - **Decision-support systems** are used to make business decisions, often
    based on data collected by on-line transaction-processing systems.

    +   - Examples of business decisions:

    +     - What items to stock?

    +     - What insurance premium to change?

    +     - To whom to send advertisements?

    +   - Examples of data used for making decisions

    +     - Retail sales transaction details

    +     - Customer profiles (income, age, gender, etc.)'
  merge: -1
  img_proc: true
- pgno: 1132
  md: '# Decision-Support Systems: Overview


    +   - **Data analysis** tasks are simplified by specialized tools and SQL extensions

    +     - Example tasks

    +       - For each product category and each region, what were the total sales
    in the last quarter and how do they compare with the same quarter last year

    +       - As above, for each product category and each customer category

    +   - **Statistical analysis** packages (e.g., : S++) can be interfaced with databases

    +     - Statistical analysis is a large field, but not covered here

    +   - **Data mining** seeks to discover knowledge automatically in the form of
    statistical rules and patterns from large databases.

    +   - A **data warehouse** archives information gathered from multiple sources,
    and stores it under a unified schema, at a single site.

    +     - Important for large businesses that generate data from multiple divisions,
    possibly at multiple sites

    +     - Data may also be purchased externally'
  merge: -1
  img_proc: true
- pgno: 1133
  md: '# Data Warehousing


    +   - Data sources often store only current data, not historical data

    +   - Corporate decision making requires a unified view of all organizational
    data, including historical data

    +   - A **data warehouse** is a repository (archive) of information gathered from
    multiple sources, stored under a unified schema, at a single site

    +     - Greatly simplifies querying, permits study of historical trends

    +     - Shifts decision support query load away from transaction processing systems'
  merge: -1
  img_proc: true
