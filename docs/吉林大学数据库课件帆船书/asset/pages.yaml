- pgno: 1230
  md: '# Introduction


    +   - XML: Extensible Markup Language

    +   - Defined by the WWW Consortium (W3C)

    +   - Derived from SGML (Standard Generalized Markup Language), but simpler to
    use than SGML

    +   - Documents have tags giving extra information about sections of the document

    +     - E.g. <title> XML </title> <slide> Introduction ...</slide>

    +   - **Extensible**, unlike HTML

    +     - Users can add new tags, and *separately* specify how the tag should be
    handled for display'
  merge: -1
  img_proc: true
- pgno: 1231
  md: "# XML Introduction (Cont.)\n\n+   The ability to specify new tags, and to create\
    \ nested tag structures make XML a great way to exchange **data**, not just documents.\n\
    +   \n+   Much of the use of XML has been in data exchange applications, not as\
    \ a replacement for HTML\n\n+   Tags make data (relatively) self-documenting\n\
    +   \n+   E.g.\n\n```\n<university>\n  <department>\n    <dept_name> Comp. Sci.\
    \ </dept_name>\n    <building> Taylor </building>\n    <budget> 100000 </budget>\n\
    \  </department>\n  <course>\n    <course_id> CS-101 </course_id>\n    <title>\
    \ Intro. to Computer Science </title>\n    <dept_name> Comp. Sci </dept_name>\n\
    \    <credits> 4 </credits>\n  </course>\n</university>\n```"
  merge: -1
  img_proc: true
