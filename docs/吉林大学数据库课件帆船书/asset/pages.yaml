- pgno: 585
  md: '# Measures of Query Cost (Cont.)


    +   - For simplicity we just use the **number of block transfers** from disk and
    the **number of seeks** as the cost measures

    +     - $t_T$ – time to transfer one block

    +     - $t_S$ – time for one seek

    +     - Cost for b block transfers plus S seeks

    +       $b * t_T + S * t_S$


    +   - We ignore CPU costs for simplicity

    +     - Real systems do take CPU cost into account


    +   - We do not include cost to writing output to disk in our cost formulae'
  merge: -1
  img_proc: true
- pgno: 586
  md: '# Measures of Query Cost (Cont.)


    +   - Several algorithms can reduce disk IO by using extra buffer space

    +     - Amount of real memory available to buffer depends on other concurrent
    queries and OS processes, known only during execution

    +       - We often use worst case estimates, assuming only the minimum amount
    of memory needed for the operation is available

    +   - Required data may be buffer resident already, avoiding disk I/O

    +     - But hard to take into account for cost estimation'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# Selection Operation


    +   - File scan

    +   - Algorithm A1 (linear search). Scan each file block and test all records
    to see whether they satisfy the selection condition.

    +     - Cost estimate = $b_r$ block transfers + 1 seek

    +       - $b_r$ denotes number of blocks containing records from relation $r$

    +     - If selection is on a key attribute, can stop on finding record

    +       - cost = ($b_r$/2) block transfers + 1 seek

    +     - Linear search can be applied regardless of

    +       - selection condition or

    +       - ordering of records in the file, or

    +       - availability of indices

    +   - Note: binary search generally does not make sense since data is not stored
    consecutively

    +     - except when there is an index available,

    +     - and binary search requires more seeks than index search


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_587_0.png)'
  merge: -1
  img_proc: true
- pgno: 588
  md: '# Selections Using Indices


    +   - **Index scan** – search algorithms that use an index

    +     - selection condition must be on search-key of index.


    +   - **A2 (primary index, equality on key)**. Retrieve a single record that satisfies
    the corresponding equality condition

    +     - $Cost = (h_i + 1) * (t_T + t_S)$


    +   - **A3 (primary index, equality on nonkey)** Retrieve multiple records.

    +     - Records will be on consecutive blocks

    +       - Let b = number of blocks containing matching records

    +     - $Cost = h_i * (t_T + t_S) + t_S + t_T * b$'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# Selections Using Indices


    +   - **A4 (secondary index, equality on nonkey)**.

    +     - Retrieve a single record if the search-key is a candidate key

    +       - *Cost = (h_i + 1) * (t_T + t_S)*

    +     - Retrieve multiple records if search-key is not a candidate key

    +       - each of *n* matching records may be on a different block

    +       - *Cost = (h_i + n) * (t_T + t_S)*

    +         - Can be very expensive!'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# Selections Involving Comparisons


    +   - Can implement selections of the form σₐ≤ᵥ(r) or σₐ≥ᵥ(r) by using

    +     - a linear file scan,

    +     - or by using indices in the following ways:


    +   - A5 (**primary index, comparison**). (Relation is sorted on A)

    +     - For σₐ≥ᵥ(r) use index to find first tuple ≥ v and scan relation sequentially
    from there

    +     - For σₐ≤ᵥ(r) just scan relation sequentially till first tuple > v; do not
    use index


    +   - A6 (**secondary index, comparison**).

    +     - For σₐ≥ᵥ(r) use index to find first index entry ≥ v and scan index sequentially
    from there, to find pointers to records.

    +     - For σₐ≤ᵥ(r) just scan leaf pages of index finding pointers to records,
    till first entry > v

    +     - In either case, retrieve records that are pointed to

    +       - requires an I/O for each record

    +       - Linear file scan may be cheaper'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# Implementation of Complex Selections


    Conjunction: σθ1∧ θ2∧... θn(r)


    A7 (conjunctive selection using one index).


    +   - Select a combination of θi and algorithms A1 through A7 that results in
    the least cost for σθi(r).

    +   - Test other conditions on tuple after fetching it into memory buffer.


    A8 (conjunctive selection using composite index).


    +   - Use appropriate composite (multiple-key) index if available.


    A9 (conjunctive selection by intersection of identifiers).


    +   - Requires indices with record pointers.

    +   - Use corresponding index for each condition, and take intersection of all
    the obtained sets of record pointers.

    +   - Then fetch records from file

    +   - If some conditions do not have appropriate indices, apply test in memory.'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# Algorithms for Complex Selections


    +   - **Disjunction:** σ<sub>θ1 ∨ θ2 ∨ … θn</sub>(r).

    +   - **A10 (disjunctive selection by union of identifiers)**.

    +     - Applicable if *all* conditions have available indices.

    +       - Otherwise use linear scan.

    +     - Use corresponding index for each condition, and take union of all the
    obtained sets of record pointers.

    +     - Then fetch records from file

    +   - **Negation:** σ<sub>¬θ</sub>(r)

    +     - Use linear scan on file

    +     - If very few records satisfy ¬θ, and an index is applicable to θ

    +       - Find satisfying records using index and fetch from file'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# Sorting


    +   - We may build an index on the relation, and then use the index to read the
    relation in sorted order. May lead to one disk block access for each tuple.

    +   - For relations that fit in memory, techniques like quicksort can be used.
    For relations that don’t fit in memory, **external sort-merge** is a good choice.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_593_0.png)'
  merge: -1
  img_proc: true
- pgno: 594
  md: '# External Sort-Merge


    Let M denote memory size (in pages).


    +   1. Create sorted runs. Let i be 0 initially.


    Repeatedly do the following till the end of the relation:


    +   (a) Read M blocks of relation into memory


    +   (b) Sort the in-memory blocks


    +   (c) Write sorted data to run R_i; increment i.


    Let the final value of i be N


    +   2. Merge the runs (next slide)......'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# # External Sort-Merge (Cont.)


    2. Merge the runs (N-way merge). We assume (for now) that N < M.


    +   1. Use N blocks of memory to buffer input runs, and 1 block to buffer output.
    Read the first block of each run into its buffer page


    +   2. repeat


    +   1. Select the first record (in sort order) among all buffer pages


    +   2. Write the record to the output buffer. If the output buffer is full write
    it to disk.


    +   3. Delete the record from its input buffer page. If the buffer page becomes
    empty then read the next block (if any) of the run into the buffer.


    +   3. until all input buffer pages are empty:'
  merge: -1
  img_proc: true
- pgno: 596
  md: '# External Sort-Merge (Cont.)


    +   - If $N \ge M$, several merge *passes* are required.

    +     - In each pass, contiguous groups of $M - 1$ runs are merged.

    +     - A pass reduces the number of runs by a factor of $M -1$, and creates runs
    longer by the same factor.

    +       - E.g. If M=11, and there are 90 runs, one pass reduces the number of
    runs to 9, each 10 times the size of the initial runs

    +     - Repeated passes are performed till all runs have been merged into one.'
  merge: -1
  img_proc: true
- pgno: 597
  md: '# Example: External Sorting Using Sort-Merge


    initial relation


    runs

    create

    runs


    merge pass-1


    runs


    merge pass-2


    sorted output


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_597_0.png)'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# External Merge Sort (Cont.)


    +   - Cost analysis:

    +     - 1 block per run leads to too many seeks during merge

    +       - Instead use $b_b$ buffer blocks per run

    +         - ➔ read/write $b_b$ blocks at a time

    +       - Can merge $\lfloor M/b_b \rfloor -1$ runs in one pass

    +     - Total number of merge passes required: $\lceil \log_{\lfloor M/b_b \rfloor
    -1} (b_r / M) \rceil$.

    +     - Block transfers for initial run creation as well as in each pass is $2b_r$

    +       - for final pass, we don’t count write cost

    +         - we ignore final write cost for all operations since the output of
    an operation may be sent to the parent operation without being written to disk

    +       - Thus total number of block transfers for external sorting:

    +         $b_r \left( 2 \lceil \log_{\lfloor M/b_b \rfloor -1} (b_r / M) \rceil
    + 1 \right)$

    +     - Seeks: next slide'
  merge: -1
  img_proc: true
- pgno: 599
  md: '# External Merge Sort (Cont.)


    +   - Cost of seeks

    +     - During run generation: one seek to read each run and one seek to write
    each run

    +       - $2\lceil b_r / M \rceil$

    +     - During the merge phase

    +       - Need $2\lceil b_r / b_b \rceil$ seeks for each merge pass

    +         - except the final one which does not require a write

    +       - Total number of seeks:

    +         $2\lceil b_r / M \rceil + \lceil b_r / b_b \rceil \left(2\lceil \log_{\lfloor
    M / b_b \rfloor -1} (b_r / M) \rceil -1\right)$'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# Join Operation


    +   - Several different algorithms to implement joins

    +     - Nested-loop join

    +     - Block nested-loop join

    +     - Indexed nested-loop join

    +     - Merge-join

    +     - Hash-join

    +   - Choice based on cost estimate

    +   - Examples use the following information

    +     - Number of records of *student*: 5,000    *takes*: 10,000

    +     - Number of blocks of *student*: 100    *takes*: 400'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# Nested-Loop Join


    To compute the theta join  r ⋈θ s

    for each tuple t_r in r do begin

    for each tuple t_s in s do begin

    test pair (t_r, t_s) to see if they satisfy the join condition θ

    if they do, add t_r • t_s to the result.

    end

    end


    r is called the outer relation and s the inner relation of the join.


    Requires no indices and can be used with any kind of join condition.


    Expensive since it examines every pair of tuples in the two relations.'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# Nested-Loop Join (Cont.)


    +   - In the worst case, if there is enough memory only to hold one block of each
    relation, the estimated cost is

    +     $n_r * b_s + b_r$ block transfers, plus

    +     $n_r + b_r$ seeks


    +   - If the smaller relation fits entirely in memory, use that as the inner relation.

    +     - Reduces cost to $b_r + b_s$ block transfers and 2 seeks


    +   - Assuming worst case memory availability cost estimate is

    +     - with *student* as outer relation:

    +       - 5000 * 400 + 100 = 2,000,100 block transfers,

    +       - 5000 + 100 = 5100 seeks

    +     - with *takes* as the outer relation

    +       - 10000 * 100 + 400 = 1,000,400 block transfers and 10,400 seeks


    +   - If smaller relation (*student*) fits entirely in memory, the cost estimate
    will be 500 block transfers.


    +   - Block nested-loops algorithm (next slide) is preferable.'
  merge: -1
  img_proc: true
- pgno: 603
  md: "# Block Nested-Loop Join\n\n+   Variant of nested-loop join in which every\
    \ block of inner relation is paired with every block of outer relation.\n\n```\n\
    for each block B_r of r do begin\n  for each block B_s of s do begin\n    for\
    \ each tuple t_r in B_r do begin\n      for each tuple t_s in B_s do begin\n \
    \       Check if (t_r, t_s) satisfy the join condition\n        if they do, add\
    \ t_r • t_s to the result.\n      end\n    end\n  end\nend\n```\n\n![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_603_0.png)"
  merge: -1
  img_proc: true
- pgno: 604
  md: '# Block Nested-Loop Join (Cont.)


    +   - Worst case estimate: $b_r * b_s + b_r$ block transfers + $2 * b_r$ seeks

    +     - Each block in the inner relation s is read once for each block in the
    outer relation


    +   - Best case: $b_r + b_s$ block transfers + 2 seeks.


    +   - Improvements to nested loop and block nested loop algorithms:

    +     - In block nested-loop, use $M-2$ disk blocks as blocking unit for outer
    relations, where $M$ = memory size in blocks; use remaining two blocks to buffer
    inner relation and output

    +       - Cost = $\lceil b_r / (M-2) \rceil * b_s + b_r$ block transfers + $2
    \lceil b_r / (M-2) \rceil$ seeks

    +     - If equi-join attribute forms a key or inner relation, stop inner loop
    on first match

    +     - Scan inner loop forward and backward alternately, to make use of the blocks
    remaining in buffer (with LRU replacement)

    +     - Use index on inner relation if available (next slide)'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# Indexed Nested-Loop Join


    +   Index lookups can replace file scans if

    +   - join is an equi-join or natural join and

    +   - an index is available on the inner relation’s join attribute

    +     - Can construct an index just to compute a join.


    For each tuple t_r in the outer relation r, use the index to look up tuples in
    s that satisfy the join condition with tuple t_r.


    Worst case: buffer has space for only one page of r, and, for each tuple in r,
    we perform an index lookup on s.


    +   Cost of the join: b_r (t_r + t_s) + n_r * c

    +   - Where c is the cost of traversing index and fetching all matching s tuples
    for one tuple or r

    +   - c can be estimated as cost of a single selection on s using the join condition.


    If indices are available on join attributes of both r and s, use the relation
    with fewer tuples as the outer relation.'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# Example of Nested-Loop Join Costs


    +   - Compute *student* ⨝ *takes*, with *student* as the outer relation.

    +   - Let *takes* have a primary B⁺-tree index on the attribute *ID*, which contains
    20 entries in each index node.

    +   - Since *takes* has 10,000 tuples, the height of the tree is 4, and one more
    access is needed to find the actual data

    +   - *student* has 5000 tuples

    +   - Cost of block nested loops join

    +     - 400*100 + 100 = 40,100 block transfers + 2 * 100 = 200 seeks

    +       - assuming worst case memory

    +       - may be significantly less with more memory

    +   - Cost of indexed nested loops join

    +     - 100 + 5000 * 5 = 25,100 block transfers and seeks.

    +     - CPU cost likely to be less than that for block nested loops join'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# Merge-Join


    +   1. Sort both relations on their join attribute (if not already sorted on the
    join attributes).

    +   2. Merge the sorted relations to join them

    +      1. Join step is similar to the merge stage of the sort-merge algorithm.

    +      2. Main difference is handling of duplicate values in join attribute —
    every pair with same value on join attribute must be matched

    +   3. Detailed algorithm in book


    | a1 | a2 |

    | --- | --- |

    | a | 3 |

    | b | 1 |

    | d | 8 |

    | d | 13 |

    | f | 7 |

    | m | 5 |

    | q | 6 |


    r

    pr →


    | a1 | a3 |

    | --- | --- |

    | a | A |

    | b | G |

    | c | L |

    | d | N |

    | m | B |


    s

    ps →'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# Merge-Join (Cont.)


    +   - Can be used only for equi-joins and natural joins

    +   - Each block needs to be read only once (assuming all tuples for any given
    value of the join attributes fit in memory

    +   - Thus the cost of merge join is:

    +     $b_r + b_s$ block transfers + $\lceil b_r / b_b \rceil + \lceil b_s / b_b
    \rceil$ seeks

    +     - + the cost of sorting if relations are unsorted.

    +   - hybrid merge-join: If one relation is sorted, and the other has a secondary
    B⁺-tree index on the join attribute

    +     - Merge the sorted relation with the leaf entries of the B⁺-tree .

    +     - Sort the result on the addresses of the unsorted relation’s tuples

    +     - Scan the unsorted relation in physical address order and merge with previous
    result, to replace addresses by the actual tuples

    +       - Sequential scan more efficient than random lookup'
  merge: -1
  img_proc: true
- pgno: 609
  md: '# Hash-Join


    +   - Applicable for equi-joins and natural joins.

    +   - A hash function h is used to partition tuples of both relations

    +   - h maps JoinAttrs values to {0, 1, ..., n}, where JoinAttrs denotes the common
    attributes of r and s used in the natural join.

    +     - r0, r1, . . ., rn denote partitions of r tuples

    +       - Each tuple tr ∈ r is put in partition ri where i = h(tr[JoinAttrs]).

    +     - r0, r1. . ., rn denotes partitions of s tuples

    +       - Each tuple ts ∈ s is put in partition si, where i = h(ts[JoinAttrs]).

    +   - Note: In book, ri is denoted as Hri, si is denoted as Hsi and n is denoted
    as nh.'
  merge: -1
  img_proc: true
