- pgno: 788
  md: '# Multiversion Schemes


    +   - Multiversion schemes keep old versions of data item to increase concurrency.

    +     - Multiversion Timestamp Ordering

    +     - Multiversion Two-Phase Locking

    +   - Each successful **write** results in the creation of a new version of the
    data item written.

    +   - Use timestamps to label versions.

    +   - When a **read**(Q) operation is issued, select an appropriate version of
    Q based on the timestamp of the transaction, and return the value of the selected
    version.

    +   - **reads** never have to wait as an appropriate version is returned immediately.'
  merge: -1
  img_proc: true
- pgno: 789
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_789_0.png)


    # Multiversion Timestamp Ordering


    +   Each data item Q has a sequence of versions <Q₁, Q₂,..., Qₘ>. Each version
    Qₖ contains three data fields:


    +   - **Content** -- the value of version Qₖ.


    +   - **W-timestamp(Qₖ)** -- timestamp of the transaction that created (wrote)
    version Qₖ


    +   - **R-timestamp(Qₖ)** -- largest timestamp of a transaction that successfully
    read version Qₖ


    +   When a transaction Tᵢ creates a new version Qₖ of Q, Qₖ''s W-timestamp and
    R-timestamp are initialized to TS(Tᵢ).


    +   R-timestamp of Qₖ is updated whenever a transaction Tⱼ reads Qₖ, and TS(Tⱼ)
    > R-timestamp(Qₖ).'
  merge: -1
  img_proc: true
- pgno: 790
  md: "![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_790_0.png)\n\n# Multiversion Timestamp\
    \ Ordering (Cont)\n\nSuppose that transaction Ti issues a read(Q) or write(Q)\
    \ operation. Let Qk denote the version of Q whose write timestamp is the largest\
    \ write timestamp less than or equal to TS(Ti).\n\n+   1. If transaction Ti issues\
    \ a read(Q), then the value returned is the content of version Qk.\n+   \n+  \
    \ 2. If transaction Ti issues a write(Q)\n+   \n+      1. if TS(Ti) < R-timestamp(Qk),\
    \ then transaction Ti is rolled back.\n+   \n+      2. if TS(Ti) = W-timestamp(Qk),\
    \ the contents of Qk are overwritten\n+   \n+      3. else a new version of Q\
    \ is created.\n\n+   - Reads always succeed\n+   \n+   - A write by Ti is rejected\
    \ if some other transaction Tj that (in the serialization order defined by the\
    \ timestamp values) should read Ti's write, has already read a version created\
    \ by a transaction older than Ti.\n\nProtocol guarantees serializability"
  merge: -1
  img_proc: true
- pgno: 791
  md: '# # Multiversion Two-Phase Locking


    +   - Differentiates between read-only transactions and update transactions


    +   - Update transactions acquire read and write locks, and hold all locks up
    to the end of the transaction. That is, update transactions follow rigorous two-phase
    locking.


    +     - Each successful **write** results in the creation of a new version of
    the data item written.


    +     - Each version of a data item has a single timestamp whose value is obtained
    from a counter **ts-counter** that is incremented during commit processing.


    +   - Read-only transactions are assigned a timestamp by reading the current value
    of **ts-counter** before they start execution; they follow the multiversion timestamp-ordering
    protocol for performing reads.'
  merge: -1
  img_proc: true
- pgno: 792
  md: '# Multiversion Two-Phase Locking (Cont.)


    +   - When an update transaction wants to read a data item:

    +     - it obtains a shared lock on it, and reads the latest version.


    +   - When it wants to write an item

    +     - it obtains X lock on; it then creates a new version of the item and sets
    this version''s timestamp to ∞.


    +   - When update transaction Tᵢ completes, commit processing occurs:

    +     - Tᵢ sets timestamp on the versions it has created to ts-counter + 1

    +     - Tᵢ increments ts-counter by 1


    +   - Read-only transactions that start after Tᵢ increments ts-counter will see
    the values updated by Tᵢ.


    +   - Read-only transactions that start before Tᵢ increments the ts-counter will
    see the value before the updates by Tᵢ.


    +   - Only serializable schedules are produced.'
  merge: -1
  img_proc: true
- pgno: 793
  md: '# MVCC: Implementation Issues


    +   - Creation of multiple versions increases storage overhead

    +     - Extra tuples

    +     - Extra space in each tuple for storing version information

    +   - Versions can, however, be garbage collected

    +     - E.g. if Q has two versions Q5 and Q9, and the oldest active transaction
    has timestamp > 9, than Q5 will never be required again'
  merge: -1
  img_proc: true
- pgno: 794
  md: '# Snapshot Isolation


    +   - Motivation: Decision support queries that read large amounts of data have
    concurrency conflicts with OLTP transactions that update a few rows

    +     - Poor performance results

    +   - Solution 1: Give logical “snapshot” of database state to read only transactions,
    read-write transactions use normal locking

    +     - Multiversion 2-phase locking

    +     - Works well, but how does system know a transaction is read only?

    +   - Solution 2: Give snapshot of database state to every transaction, updates
    alone use 2-phase locking to guard against concurrent updates

    +     - Problem: variety of anomalies such as lost update can result

    +     - Partial solution: snapshot isolation level (next slide)

    +       - Proposed by Berenson et al, SIGMOD 1995

    +       - Variants implemented in many database systems

    +         - E.g. Oracle, PostgreSQL, SQL Server 2005'
  merge: -1
  img_proc: true
- pgno: 795
  md: '# Snapshot Isolation


    A transaction T1 executing with Snapshot Isolation


    +   - takes snapshot of committed data at start

    +   - always reads/modifies data in its own snapshot

    +   - updates of concurrent transactions are not visible to T1

    +   - writes of T1 complete when it commits

    +   - First-committer-wins rule:

    +     - Commits only if no other concurrent transaction has already written data
    that T1 intends to write.


    | T1 | T2 | T3 |

    |---|---|---|

    | W(Y := 1)

    Commit |  |  |

    |  | Start

    R(X) → 0

    R(Y) → 1 |  |

    |  |  | W(X:=2)

    W(Z:=3)

    Commit |

    |  | R(Z) → 0

    R(Y) → 1

    W(X:=3)

    Commit-Req

    Abort |  |


    Concurrent updates not visible

    Own updates are visible

    Not first-committer of X

    Serialization error, T2 is rolled back'
  merge: -1
  img_proc: true
