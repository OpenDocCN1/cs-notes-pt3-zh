  md: '# Spatial and Geographic Databases


    +   - Spatial databases store information related to spatial locations, and support
    efficient storage, indexing and querying of spatial data.

    +   - Special purpose index structures are important for accessing spatial data,
    and for processing spatial join queries.

    +   - **Computer Aided Design (CAD)** databases store design information about
    how objects are constructed E.g.: designs of buildings, aircraft, layouts of integrated-circuits

    +   - Geographic databases store geographic information (e.g., maps): often called
    **geographic information systems or GIS**.'
  merge: -1
