- pgno: 130
  md: '# Views


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_130_0.png)


    +   - In some cases, it is not desirable for all users to see the entire logical
    model (that is, all the actual relations stored in the database.)

    +   - Consider a person who needs to know an instructors name and department,
    but not the salary. This person should see a relation described, in SQL, by

    +   - A view provides a mechanism to hide certain data from the view of certain
    users.

    +   - Any relation that is not of the conceptual model but is made visible to
    a user as a “virtual relation” is called a view.


    ```

    select ID, name, dept_name

    from instructor

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: "# View Definition\n\n+   - A view is defined using the **create view** statement\
    \ which has the form\n+   \n+     **create view v as < query expression >**\n\
    +   \n+     where <query expression> is any legal SQL expression. The view name\
    \ is represented by v.\n\n+   - Once a view is defined, the view name can be used\
    \ to refer to the virtual relation that the view generates.\n\n+   - View definition\
    \ is not the same as creating a new relation by evaluating the query expression\n\
    +     - Rather, a view definition causes the saving of an expression; the expression\
    \ is substituted into queries using the view.\n\n![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_131_0.png)"
  merge: -1
  img_proc: true
