- pgno: 658
  md: '# Choice of Evaluation Plans


    +   - Must consider the interaction of evaluation techniques when choosing evaluation
    plans

    +     - choosing the cheapest algorithm for each operation independently may not
    yield best overall algorithm. E.g.

    +       - merge-join may be costlier than hash-join, but may provide a sorted
    output which reduces the cost for an outer level aggregation.

    +       - nested-loop join may provide opportunity for pipelining


    +   - Practical query optimizers incorporate elements of the following two broad
    approaches:

    +     1. Search all the plans and choose the best plan in a cost-based fashion.

    +     2. Uses heuristics to choose a plan.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_658_0.png)'
  merge: -1
  img_proc: true
- pgno: 659
  md: '# Cost-Based Optimization


    +   - Consider finding the best join-order for $r_1 \bowtie r_2 \bowtie \ldots
    \bowtie r_n$.

    +   - There are $(2(n-1))!/(n-1)!$ different join orders for above expression.
    With $n=7$, the number is 665280, with $n=10$, the number is greater than 176
    billion!

    +   - No need to generate all the join orders. Using dynamic programming, the
    least-cost join order for any subset of $\{r_1, r_2, \ldots r_n\}$ is computed
    only once and stored for future use.'
  merge: -1
  img_proc: true
- pgno: 660
  md: '# Dynamic Programming in Optimization


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_660_0.png)


    +   • To find best join tree for a set of n relations:


    +   • To find best plan for a set S of n relations, consider all possible plans
    of the form: S₁ ⋈ (S – S₁) where S₁ is any non-empty subset of S.


    +   • Recursively compute costs for joining subsets of S to find the cost of each
    plan. Choose the cheapest of the 2^n – 2 alternatives.


    +   • Base case for recursion: single relation access plan


    +     • Apply all selections on R_i using best choice of indices on R_i


    +   • When plan for any subset is computed, store it and reuse it when it is required
    again, instead of recomputing it


    +     • Dynamic programming'
  merge: -1
  img_proc: true
- pgno: 661
  md: "# # Join Order Optimization Algorithm\n\n```\n```pseudocode\nprocedure findbestplan(S)\n\
    if (bestplan[S].cost ≠ ∞)\n    return bestplan[S]\n\n// else bestplan[S] has not\
    \ been computed earlier, compute it now\nif (S contains only 1 relation)\n   \
    \ set bestplan[S].plan and bestplan[S].cost based on the best way of accessing\
    \ S /* Using selections on S and indices on S */\nelse\n    for each non-empty\
    \ subset S1 of S such that S1 ≠ S\n        P1 = findbestplan(S1)\n        P2 =\
    \ findbestplan(S - S1)\n        A = best algorithm for joining results of P1 and\
    \ P2\n        cost = P1.cost + P2.cost + cost of A\n        if cost < bestplan[S].cost\n\
    \            bestplan[S].cost = cost\n            bestplan[S].plan = \"execute\
    \ P1.plan; execute P2.plan; join results of P1 and P2 using A\"\n    return bestplan[S]\n\
    ```\n```\n\n* Some modifications to allow indexed nested loops joins on relations\
    \ that have selections (see book)"
  merge: -1
  img_proc: true
