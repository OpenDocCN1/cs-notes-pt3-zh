  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1313_0.png)


    # # SQL Standards History


    +   - SQL developed by IBM in late 70s/early 80s

    +   - SQL-86 first formal standard

    +   - IBM SAA standard for SQL in 1987

    +   - SQL-89 added features to SQL-86 that were already implemented in many systems

    +     - Was a reactionary standard

    +   - SQL-92 added many new features to SQL-89 (anticipatory standard)

    +     - Defines levels of compliance (*entry, intermediate and full*)

    +     - Even now few database vendors have full SQL-92 implementation'
  merge: -1
  img_proc: true
- pgno: 1314
  md: '# SQL Standards History (Cont.)


    +   - SQL:1999

    +     - Adds variety of new features --- extended data types, object orientation,
    procedures, triggers, etc.

    +     - Broken into several parts

    +       - SQL/Framework (Part 1): overview

    +       - SQL/Foundation (Part 2): types, schemas, tables, query/update statements,
    security, etc.

    +       - SQL/CLI (Call Level Interface) (Part 3): API interface

    +       - SQL/PSM (Persistent Stored Modules) (Part 4): procedural extensions

    +       - SQL/Bindings (Part 5): embedded SQL for different embedding languages'
  merge: -1
  img_proc: true
- pgno: 1315
  md: '# # SQL Standards History (Cont.)


    +   - More parts undergoing standardization process

    +   - Part 7: SQL/Temporal: temporal data

    +   - Part 9: SQL/MED (Management of External Data)

    +     ▶ Interfacing of database to external data sources

    +     – Allows other databases, even files, can be viewed as part of the database

    +   - Part 10 SQL/OLB (Object Language Bindings): embedding SQL in Java

    +   - Missing part numbers 6 and 8 cover features that are not near standardization
    yet'
  merge: -1
  img_proc: true
- pgno: 1316
  md: '# # Database Connectivity Standards


    +   - **Open DataBase Connectivity (ODBC)** standard for database interconnectivity

    +     - based on *Call Level Interface* (CLI) developed by X/Open consortium

    +     - defines application programming interface, and SQL features that must
    be supported at different levels of compliance

    +   - **JDBC** standard used for Java

    +   - **X/Open XA** standards define transaction management standards for supporting
    distributed 2-phase commit

    +   - **OLE-DB**: API like ODBC, but intended to support non-database sources
    of data such as flat files

    +     - OLE-DB program can negotiate with data source to find what features are
    supported

    +     - Interface language may be a subset of SQL

    +   - **ADO (Active Data Objects)**: easy-to-use interface to OLE-DB functionality'
  merge: -1
  img_proc: true
- pgno: 1317
  md: '# # Object Oriented Databases Standards


    +   - **Object Database Management Group (ODMG)** standard for object-oriented
    databases

    +     - version 1 in 1993 and version 2 in 1997, version 3 in 2000

    +     - provides language independent *Object Definition Language* (ODL) as well
    as several language specific *bindings*

    +   - **Object Management Group (OMG)** standard for distributed software based
    on objects

    +     - **Object Request Broker (ORB)** provides transparent message dispatch
    to distributed objects

    +     - **Interface Definition Language (IDL)** for defining language-independent
    data types

    +     - **Common Object Request Broker Architecture (CORBA)** defines specifications
    of ORB and IDL'
