- pgno: 819
  md: '# Stable-Storage Implementation


    +   - Maintain multiple copies of each block on separate disks

    +     - copies can be at remote sites to protect against disasters such as fire
    or flooding.

    +   - Failure during data transfer can still result in inconsistent copies: Block
    transfer can result in

    +     - Successful completion

    +     - Partial failure: destination block has incorrect information

    +     - Total failure: destination block was never updated

    +   - Protecting storage media from failure during data transfer (one solution):

    +     - Execute output operation as follows (assuming two copies of each block):

    +       1. Write the information onto the first physical block.

    +       2. When the first write successfully completes, write the same information
    onto the second physical block.

    +       3. The output is completed only after the second write successfully completes.'
  merge: -1
  img_proc: true
- pgno: 820
  md: '# Stable-Storage Implementation (Cont.)


    +   - Protecting storage media from failure during data transfer (cont.):

    +   - Copies of a block may differ due to failure during output operation. To
    recover from failure:

    +     1. First find inconsistent blocks:

    +        1. *Expensive solution:* Compare the two copies of every disk block.

    +        2. *Better solution:*

    +           - Record in-progress disk writes on non-volatile storage (Non-volatile
    RAM or special area of disk).

    +           - Use this information during recovery to find blocks that may be
    inconsistent, and only compare copies of these.

    +           - Used in hardware RAID systems

    +     2. If either copy of an inconsistent block is detected to have an error
    (bad checksum), overwrite it by the other copy. If both have no error, but are
    different, overwrite the second block by the first block.'
  merge: -1
  img_proc: true
- pgno: 821
  md: '# Data Access


    +   - **Physical blocks** are those blocks residing on the disk.

    +   - **Buffer blocks** are the blocks residing temporarily in main memory.

    +   - Block movements between disk and main memory are initiated through the following
    two operations:

    +     - **input**(B) transfers the physical block B to main memory.

    +     - **output**(B) transfers the buffer block B to the disk, and replaces the
    appropriate physical block there.

    +   - We assume, for simplicity, that each data item fits in, and is stored inside,
    a single block.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_821_0.png)'
  merge: -1
  img_proc: true
