- pgno: 378
  md: '# Web Servers


    +   - A Web server can easily serve as a front end to a variety of information
    services.

    +   - The document name in a URL may identify an executable program, that, when
    run, generates a HTML document.

    +     - When an HTTP server receives a request for such a document, it executes
    the program, and sends back the HTML document that is generated.

    +     - The Web client can pass extra arguments with the name of the document.

    +   - To install a new service on the Web, one simply needs to create and install
    an executable that provides that service.

    +     - The Web browser provides a graphical user interface to the information
    service.

    +   - Common Gateway Interface (CGI): a standard interface between web and application
    server'
