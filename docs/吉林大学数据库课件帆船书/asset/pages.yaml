- pgno: 582
  md: '# # Basic Steps in Query Processing: Optimization


    A relational algebra expression may have many equivalent expressions


    +   - E.g., σ_salary<75000(Π_salary(instructor)) is equivalent to

    +     Π_salary(σ_salary<75000(instructor))


    Each relational algebra operation can be evaluated using one of several different
    algorithms


    +   - Correspondingly, a relational-algebra expression can be evaluated in many
    ways.


    Annotated expression specifying detailed evaluation strategy is called an evaluation-plan.


    +   - E.g., can use an index on salary to find instructors with salary < 75000,


    +   - or can perform complete relation scan and discard instructors with salary
    ≥ 75000'
  merge: -1
  img_proc: true
- pgno: 583
  md: '# Basic Steps: Optimization (Cont.)


    +   - **Query Optimization**: Amongst all equivalent evaluation plans choose the
    one with lowest cost.

    +     - Cost is estimated using statistical information from the database catalog

    +       - e.g. number of tuples in each relation, size of tuples, etc.

    +   - In this chapter we study

    +     - How to measure query costs

    +     - Algorithms for evaluating relational algebra operations

    +     - How to combine algorithms for individual operations in order to evaluate
    a complete expression

    +   - In Chapter 14

    +     - We study how to optimize queries, that is, how to find an evaluation plan
    with lowest estimated cost'
  merge: -1
  img_proc: true
