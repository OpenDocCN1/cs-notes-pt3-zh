- pgno: 693
  md: '# # Aggregation Operations


    count : v = A g_count(B)^{(r)}.


    +   - When a set of tuples i_r is inserted

    +     - For each tuple r in i_r, if the corresponding group is already present
    in v, we increment its count, else we add a new tuple with count = 1


    +   - When a set of tuples d_r is deleted

    +     - for each tuple t in i_r we look for the group t.A in v, and subtract 1
    from the count for the group.

    +     - If the count becomes 0, we delete from v the tuple for the group t.A


    sum : v = A g_sum(B)^{(r)}


    +   - We maintain the sum in a manner similar to count, except we add/subtract
    the B value instead of adding/subtracting 1 for the count


    +   - Additionally we maintain the count in order to detect groups with no tuples.
    Such groups are deleted from v

    +     - Cannot simply test for sum = 0 (why?)


    To handle the case of avg, we maintain the sum and count aggregate values separately,
    and divide at the end'
  merge: -1
