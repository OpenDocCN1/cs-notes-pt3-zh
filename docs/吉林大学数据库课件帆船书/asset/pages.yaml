- pgno: 1256
  md: '# Querying and Transforming XML Data


    +   - Translation of information from one XML schema to another

    +   - Querying on XML data

    +   - Above two are closely related, and handled by the same tools

    +   - Standard XML querying/translation languages

    +     - XPath

    +       - Simple language consisting of path expressions

    +     - XSLT

    +       - Simple language designed for translation from XML to XML and XML to
    HTML

    +     - XQuery

    +       - An XML query language with a rich set of features'
  merge: -1
  img_proc: true
- pgno: 1257
  md: '# Tree Model of XML Data


    +   - Query and transformation languages are based on a **tree model** of XML
    data

    +   - An XML document is modeled as a tree, with **nodes** corresponding to elements
    and attributes

    +     - Element nodes have child nodes, which can be attributes or subelements

    +     - Text in an element is modeled as a text node child of the element

    +     - Children of a node are ordered according to their order in the XML document

    +     - Element and attribute nodes (except for the root node) have a single parent,
    which is an element node

    +     - The root node has a single child, which is the root element of the document'
  merge: -1
  img_proc: true
- pgno: 1258
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 1259
  md: '# XPath (Cont.)


    +   - The initial "/" denotes root of the document (above the top-level tag)

    +   - Path expressions are evaluated left to right

    +     - Each step operates on the set of instances produced by the previous step

    +   - Selection predicates may follow any step in a path, in []

    +     - E.g. /university-3/course[credits >= 4]

    +       - returns account elements with a balance value greater than 400

    +       - /university-3/course[credits] returns account elements containing a
    credits subelement

    +   - Attributes are accessed using "@"

    +     - E.g. /university-3/course[credits >= 4]/@course_id

    +       - returns the course identifiers of courses with credits >= 4

    +     - IDREF attributes are not dereferenced automatically (more on this later)'
  merge: -1
  img_proc: true
- pgno: 1260
  md: '# # Functions in XPath


    XPath provides several functions


    +   - The function count() at the end of a path counts the number of elements
    in the set generated by the path


    ```

    /university-2/instructor[count(./teaches/course) > 2]

    ```


    Returns instructors teaching more than 2 courses (on university-2 schema)


    +   - Also function for testing position (1, 2, ..) of node w.r.t. siblings


    Boolean connectives and and or and function not() can be used in predicates


    IDREFs can be referenced using function id()


    +   - id() can also be applied to sets of references such as IDREFS and even to
    strings containing multiple references separated by blanks


    ```

    /university-3/course/id(@dept_name)

    ```


    returns all department elements referred to from the dept_name attribute of course
    elements.'
  merge: -1
  img_proc: true
- pgno: 1261
  md: '# More XPath Features


    +   - Operator "|" used to implement union

    +     - E.g. /university-3/course[@dept name="Comp. Sci"] | /university-3/course[@dept
    name="Biology"]

    +       - Gives union of Comp. Sci. and Biology courses

    +       - However, "|" cannot be nested inside other operators.

    +   - "//" can be used to skip multiple levels of nodes

    +     - E.g. /university-3//name

    +       - finds any name element anywhere under the /university-3 element, regardless
    of the element in which it is contained.

    +   - A step in the path can go to parents, siblings, ancestors and descendants
    of the nodes generated by the previous step, not just to the children

    +     - "//", described above, is a short from for specifying "all descendants"

    +     - ".." specifies the parent.

    +   - doc(name) returns the root of a named document'
  merge: -1
  img_proc: true
