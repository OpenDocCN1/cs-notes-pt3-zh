- pgno: 656
  md: '# Implementing Transformation Based Optimization


    +   - Space requirements reduced by sharing common sub-expressions:

    +     - when E1 is generated from E2 by an equivalence rule, usually only the
    top level of the two are different, subtrees below are the same and can be shared
    using pointers

    +       - E.g. when applying join commutativity

    +     - Same sub-expression may get generated multiple times

    +       - Detect duplicate sub-expressions and share one copy

    +   - Time requirements are reduced by not generating all expressions

    +     - Dynamic programming

    +       - We will study only the special case of dynamic programming for join
    order optimization


