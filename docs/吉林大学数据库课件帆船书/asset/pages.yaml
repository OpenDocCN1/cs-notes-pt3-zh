- pgno: 1295
  md: '# Tuning the Database Design


    # Schema tuning


    +   - Vertically partition relations to isolate the data that is accessed most
    often -- only fetch needed information.

    +     - E.g., split *account* into two, (*account-number*, *branch-name*) and
    (*account-number*, *balance*).

    +       - Branch-name need not be fetched unless required


    +   - Improve performance by storing a **denormalized relation**

    +     - E.g., store join of *account* and *depositor*; branch-name and balance
    information is repeated for each holder of an account, but join need not be computed
    repeatedly.

    +       - Price paid: more space and more work for programmer to keep relation
    consistent on updates

    +     - Better to use materialized views (more on this later..)


    +   - Cluster together on the same disk page records that would match in a frequently
    required join

    +     - Compute join very efficiently when required.'
  merge: -1
  img_proc: true
- pgno: 1296
  md: '# Tuning the Database Design (Cont.)


    +   - **Index tuning**

    +     - Create appropriate indices to speed up slow queries/updates

    +     - Speed up slow updates by removing excess indices (tradeoff between queries
    and updates)

    +     - Choose type of index (B-tree/hash) appropriate for most frequent types
    of queries.

    +     - Choose which index to make clustered

    +   - Index tuning wizards look at past history of queries and updates (the **workload**)
    and recommend which indices would be best for the workload'
  merge: -1
  img_proc: true
- pgno: 1297
  md: '# Tuning the Database Design (Cont.)


    # Materialized Views


    +   - Materialized views can help speed up certain queries

    +     - Particularly aggregate queries

    +   - Overheads

    +     - Space

    +     - Time for view maintenance

    +       - Immediate view maintenance: done as part of update txn

    +         - time overhead paid by update transaction

    +       - Deferred view maintenance: done only when required

    +         - update transaction is not affected, but system time is spent on view
    maintenance

    +           - until updated, the view may be out-of-date

    +   - Preferable to denormalized schema since view maintenance is systems responsibility,
    not programmers

    +     - Avoids inconsistencies caused by errors in update programs'
  merge: -1
  img_proc: true
- pgno: 1298
  md: '# Tuning the Database Design (Cont.)


    +   - How to choose set of materialized views

    +     - Helping one transaction type by introducing a materialized view may hurt
    others

    +     - Choice of materialized views depends on costs

    +       - Users often have no idea of actual cost of operations

    +     - Overall, manual selection of materialized views is tedious

    +   - Some database systems provide tools to help DBA choose views to materialize

    +     - “Materialized view selection wizards”'
  merge: -1
  img_proc: true
- pgno: 1299
  md: '# Tuning of Transactions


    +   - Basic approaches to tuning of transactions

    +     - Improve set orientation

    +     - Reduce lock contention

    +   - Rewriting of queries to improve performance was important in the past, but
    smart optimizers have made this less important

    +   - Communication overhead and query handling overheads significant part of
    cost of each call

    +     - **Combine multiple embedded SQL/ODBC/JDBC queries into a single set-oriented
    query**

    +       - Set orientation -> fewer calls to database

    +       - E.g., tune program that computes total salary for each department using
    a separate SQL query by instead using a single query that computes total salaries
    for all department at once (using **group by**)

    +     - **Use stored procedures**: avoids re-parsing and re-optimization of query'
  merge: -1
  img_proc: true
- pgno: 1300
  md: '# Tuning of Transactions (Cont.)


    +   - Reducing lock contention

    +   - Long transactions (typically read-only) that examine large parts of a relation
    result in lock contention with update transactions

    +     - E.g., large query to compute bank statistics and regular bank transactions

    +   - To reduce contention

    +     - Use multi-version concurrency control

    +       - E.g., Oracle “snapshots” which support multi-version 2PL

    +     - Use degree-two consistency (cursor-stability) for long transactions

    +       - Drawback: result may be approximate'
  merge: -1
  img_proc: true
- pgno: 1301
  md: "# # Tuning of Transactions (Cont.)\n\n+   - Long update transactions cause\
    \ several problems\n\n+     - Exhaust lock space\n\n+     - Exhaust log space\n\
    \n    and also greatly increase recovery time after a crash, and may even exhaust\
    \ log space during recovery if recovery algorithm is badly designed!\n\n+   -\
    \ Use mini-batch transactions to limit number of updates that a single transaction\
    \ can carry out. E.g., if a single large transaction updates every record of a\
    \ very large relation, log may grow too big.\n\n+     * Split large transaction\
    \ into batch of “mini-transactions,” each performing part of the updates\n\n+\
    \   - Hold locks across transactions in a mini-batch to ensure serializability\n\
    \n  If lock table size is a problem can release locks, but at the cost of serializability\n\
    \n+     * In case of failure during a mini-batch, must complete its remaining\
    \ portion on recovery, to ensure atomicity."
  merge: -1
  img_proc: true
- pgno: 1302
  md: '# Performance Simulation


    +   - **Performance simulation** using queuing model useful to predict bottlenecks
    as well as the effects of tuning changes, even without access to real system

    +   - Queuing model as we saw earlier

    +     - Models activities that go on in parallel

    +   - Simulation model is quite detailed, but usually omits some low level details

    +     - Model **service time**, but disregard details of service

    +     - E.g., approximate disk read time by using an average disk read time

    +   - Experiments can be run on model, and provide an estimate of measures such
    as average throughput/response time

    +   - Parameters can be tuned in model and then replicated in real system

    +     - E.g., number of disks, memory, algorithms, etc.'
  merge: -1
  img_proc: true
- pgno: 1303
  md: '# Performance Benchmarks


    +   - Suites of tasks used to quantify the performance of software systems

    +   - Important in comparing database systems, especially as systems become more
    standards compliant.

    +   - Commonly used performance measures:

    +     - **Throughput** (transactions per second, or tps)

    +     - **Response time** (delay from submission of transaction to return of result)

    +     - **Availability** or mean time to failure


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1303_0.png)'
  merge: -1
  img_proc: true
- pgno: 1304
  md: '# Performance Benchmarks (Cont.)


    +   - Suites of tasks used to characterize performance

    +     - single task not enough for complex systems

    +   - Beware when computing average throughput of different transaction types

    +     - E.g., suppose a system runs transaction type A at 99 tps and transaction
    type B at 1 tps.

    +     - Given an equal mixture of types A and B, throughput is not (99+1)/2 =
    50 tps.

    +     - Running one transaction of each type takes time 1+.01 seconds, giving
    a throughput of 1.98 tps.

    +     - To compute average throughput, use harmonic mean:

    +       n

    +       1/(1/t₁ + 1/t₂ + ... + 1/tₙ)

    +     - Interference (e.g., lock contention) makes even this incorrect if different
    transaction types run concurrently'
  merge: -1
  img_proc: true
- pgno: 1305
  md: '# Database Application Classes


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1305_0.png)


    +   Online transaction processing (OLTP)

    +   requires high concurrency and clever techniques to speed up commit processing,
    to support a high rate of update transactions.


    +   Decision support applications

    +   including online analytical processing, or OLAP applications

    +   require good query evaluation algorithms and query optimization.


    +   Architecture of some database systems tuned to one of the two classes

    +   E.g., Teradata is tuned to decision support


    +   Others try to balance the two requirements

    +   E.g., Oracle, with snapshot support for long read-only transaction'
  merge: -1
  img_proc: true
- pgno: 1306
  md: '# Benchmarks Suites


    +   - The Transaction Processing Council (TPC) benchmark suites are widely used.

    +     - **TPC-A** and **TPC-B**: simple OLTP application modeling a bank teller
    application with and without communication

    +       - Not used anymore

    +     - **TPC-C**: complex OLTP application modeling an inventory system

    +       - Current standard for OLTP benchmarking'
  merge: -1
  img_proc: true
- pgno: 1307
  md: '# Benchmarks Suites (Cont.)


    +   - TPC benchmarks (cont.)

    +     - **TPC-D:** complex decision support application

    +       - Superceded by TPC-H and TPC-R

    +     - **TPC-H:** (H for ad hoc) based on TPC-D with some extra queries

    +       - Models ad hoc queries which are not known beforehand

    +         - Total of 22 queries with emphasis on aggregation

    +       - prohibits materialized views

    +       - permits indices only on primary and foreign keys

    +     - **TPC-R:** (R for reporting) same as TPC-H, but without any restrictions
    on materialized views and indices

    +     - **TPC-W:** (W for Web) End-to-end Web service benchmark modeling a Web
    bookstore, with combination of static and dynamically generated pages'
  merge: -1
  img_proc: true
- pgno: 1308
  md: '![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_1308_0.png)


    # # TPC Performance Measures


    +   - TPC performance measures

    +     - **transactions-per-second** with specified constraints on response time

    +     - **transactions-per-second-per-dollar** accounts for cost of owning system


    +   - TPC benchmark requires database sizes to be scaled up with increasing transactions-per-second

    +     - Reflects real world applications where more customers means more database
    size and more transactions-per-second


    +   - External audit of TPC performance numbers mandatory

    +     - TPC performance claims can be trusted'
