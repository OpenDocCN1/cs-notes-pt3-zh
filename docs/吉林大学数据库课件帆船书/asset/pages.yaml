- pgno: 63
  md: '# Basic Query Structure


    A typical SQL query has the form:


    ```

    select A₁, A₂, ..., Aₙ

    from r₁, r₂, ..., rₘ

    where P

    ```


    +   - Aᵢ represents an attribute

    +   - Rᵢ represents a relation

    +   - P is a predicate.


    The result of an SQL query is a relation.


    ![](img/00bedbdd4ee0b6a84e67d550b5b9ee64_63_0.png)'
