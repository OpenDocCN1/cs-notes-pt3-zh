  img_proc: true
- pgno: 64
  md: "# The select Clause\n\n+   - The **select** clause lists the attributes desired\
    \ in the result of a query\n+     - corresponds to the projection operation of\
    \ the relational algebra\n+   - Example: find the names of all instructors:\n\
    +   \n+     ```sql\n+     select name\n+     from instructor\n+     ```\n+   -\
    \ NOTE: SQL names are case insensitive (i.e., you may use upper- or lower-case\
    \ letters.)\n+     - E.g., *Name* ≡ *NAME* ≡ *name*\n+     - Some people use upper\
    \ case wherever we use bold font."
  merge: -1
  img_proc: true
- pgno: 65
  md: '# The select Clause (Cont.)


    +   - SQL allows duplicates in relations as well as in query results.

    +   - To force the elimination of duplicates, insert the keyword **distinct**
    after select.

    +   - Find the department names of all instructors, and remove duplicates

    +     ```sql

    +     select distinct dept_name

    +     from instructor

    +     ```

    +   - The keyword **all** specifies that duplicates should not be removed.

    +     ```sql

    +     select all dept_name

    +     from instructor

    +     ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# The select Clause (Cont.)


    +   - An asterisk in the select clause denotes “all attributes”

    +     ```sql

    +     select *

    +     from instructor

    +     ```

    +   - An attribute can be a literal with no from clause

    +     ```sql

    +     select ‘437’

    +     ```

    +     - Results is a table with one column and a single row with value “437”

    +     - Can give the column a name using:

    +       ```sql

    +       select ‘437’ as FOO

    +       ```

    +   - An attribute can be a literal with from clause

    +     ```sql

    +     select ‘A’

    +     from instructor

    +     ```

    +     - Result is a table with one column and N rows (number of tuples in the
    instructors table), each row with value “A”'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# The select Clause (Cont.)


    +   - The **select** clause can contain arithmetic expressions involving the operation,
    +, –, *, and /, and operating on constants or attributes of tuples.

    +     - The query:

    +       ```

    +       select ID, name, salary/12

    +       from instructor

    +       ```

    +       would return a relation that is the same as the *instructor* relation,
    except that the value of the attribute *salary* is divided by 12.

    +     - Can rename “salary/12” using the **as** clause:

    +       ```

    +       select ID, name, salary/12 as monthly_salary

    +       ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# The where Clause


    +   - The **where** clause specifies conditions that the result must satisfy

    +     - Corresponds to the selection predicate of the relational algebra.

    +   - To find all instructors in Comp. Sci. dept

    +     ```

    +     select name

    +     from instructor

    +     where dept_name = ''Comp. Sci.''

    +     ```

    +   - Comparison results can be combined using the logical connectives **and,
    or, and not**

    +     - To find all instructors in Comp. Sci. dept with salary > 80000

    +     ```

    +     select name

    +     from instructor

    +     where dept_name = ''Comp. Sci.'' and salary > 80000

    +     ```

    +   - Comparisons can be applied to results of arithmetic expressions.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# The from Clause


    +   - The **from** clause lists the relations involved in the query

    +     - Corresponds to the Cartesian product operation of the relational algebra.


    +   - Find the Cartesian product *instructor X teaches*

    +     ```

    +     select *

    +     from instructor, teaches

    +     ```

    +     - generates every possible instructor – teaches pair, with all attributes
    from both relations.

    +     - For common attributes (e.g., *ID*), the attributes in the resulting table
    are renamed using the relation name (e.g., *instructor.ID*)


    +   - Cartesian product not very useful directly, but useful combined with where-clause
    condition (selection operation in relational algebra).'
  merge: -1
  img_proc: true
