- pgno: 697
  md: '# Query Optimization and Materialized Views


    +   - Rewriting queries to use materialized views:

    +     - A materialized view v = r ⋈ s is available

    +     - A user submits a query r ⋈ s ⋈ t

    +     - We can rewrite the query as v ⋈ t

    +       - Whether to do so depends on cost estimates for the two alternative


    +   - Replacing a use of a materialized view by the view definition:

    +     - A materialized view v = r ⋈ s is available, but without any index on it

    +     - User submits a query σ_A=10(v).

    +     - Suppose also that s has an index on the common attribute B, and r has
    an index on attribute A.

    +     - The best plan for this query may be to replace v by r ⋈ s, which can lead
    to the query plan σ_A=10(r) ⋈ s


    +   - Query optimizer should be extended to consider all above alternatives and
    choose the best overall plan'
  merge: -1
  img_proc: true
- pgno: 698
  md: '# Materialized View Selection


    +   - **Materialized view selection**: “What is the best set of views to materialize?”.

    +   - **Index selection**: “what is the best set of indices to create”

    +     - closely related, to materialized view selection

    +       - but simpler

    +   - Materialized view selection and index selection based on typical system
    **workload** (queries and updates)

    +     - Typical goal: minimize time to execute workload , subject to constraints
    on space and time taken for some critical queries/updates

    +     - One of the steps in database tuning

    +       - more on tuning in later chapters

    +   - Commercial database systems provide tools (called “tuning assistants” or
    “wizards”) to help the database administrator choose what indices and materialized
    views to create'
  merge: -1
  img_proc: true
