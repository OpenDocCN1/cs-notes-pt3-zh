- pgno: 833
  md: '# Checkpoints


    +   - Redoing/undoing all transactions recorded in the log can be very slow

    +     1. processing the entire log is time-consuming if the system has run for
    a long time

    +     2. we might unnecessarily redo transactions which have already output their
    updates to the database.

    +   - Streamline recovery procedure by periodically performing checkpointing

    +     1. Output all log records currently residing in main memory onto stable
    storage.

    +     2. Output all modified buffer blocks to the disk.

    +     3. Write a log record < checkpoint L> onto stable storage where L is a list
    of all transactions active at the time of checkpoint.

    +     - All updates are stopped while doing checkpointing'
  merge: -1
  img_proc: true
- pgno: 834
  md: "# Checkpoints (Cont.)\n\nDuring recovery we need to consider only the most\
    \ recent transaction T_i that started before the checkpoint, and transactions\
    \ that started after T_i.\n\n+   1. Scan backwards from end of log to find the\
    \ most recent <checkpoint> record\n+   \n+   • Only transactions that are in L\
    \ or started after the checkpoint need to be redone or undone\n+   \n+   • Transactions\
    \ that committed or aborted before the checkpoint already have all their updates\
    \ output to stable storage.\n\nSome earlier part of the log may be needed for\
    \ undo operations\n\n+   1. Continue scanning backwards till a record <T_i start>\
    \ is found for every transaction T_i in L.\n+   \n+   • Parts of log prior to\
    \ earliest <T_i start> record above are not needed for recovery, and can be erased\
    \ whenever desired."
  merge: -1
  img_proc: true
