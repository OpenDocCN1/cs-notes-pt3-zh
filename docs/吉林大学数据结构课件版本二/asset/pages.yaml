- pgno: 747
  md: "```\nvoid BInsertSort (SqList &L)\n{\n    for(i=2; i<=n; ++i)\n    {\n    \
    \    L.r[0]=L.r[i];\n        low=1; high=i-1;\n        While(low<=high)\n    \
    \    {\n            mid=(low+high)/2;\n            if (L[0].key<L[mid].key) high=mid-1;\n\
    \            else low=mid+1; }\n        for( j=i-1; j>=high+1; --j )\n       \
    \     L.r[j+1]=L.r[j];\n        L.r[high+1]=L.r[0];\n    }\n}\n```\n\n折半插入排序减少了关键字的比较次数，但记录的移动次数不变，其时间复杂度与直接插入排序相同。\n\
    \n/*折半后的位置*/\n\n//插入点在低半区\n\n/* 记录后移*/\n\n/* 插入*/"
  merge: -1
  img_proc: true
- pgno: 748
  md: '# 10.2.3希尔排序


    # 1. 希尔排序的基本思想


    +   - 先将整个待排元素序列分割成若干个子序列（由相隔某个“增量”的元素组成的）分别进行直接插入排序，待整个序列中的元素基本有序（增量足够小）时，再对全体元素进行一次直接插入排序。

    +   - 因为直接插入排序在元素基本有序的情况下（接近最好情况），效率是很 高，因此希尔排序在时间效率上比前两种方法有较大提高。'
  merge: -1
  img_proc: true
