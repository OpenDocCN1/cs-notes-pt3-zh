- pgno: 131
  md: '# # 顺序表与链表的比较


    # ## 基于空间的比较


    +   • **存储分配的方式**

    +     - 顺序表的存储空间是静态分配的

    +     - 链表的存储空间是动态分配的


    +   • **存储密度** = 结点数据本身所占的存储量 / 结点结构所占的存储总量

    +     - 顺序表的存储密度 = 1

    +     - 链表的存储密度 < 1'
  merge: -1
  img_proc: true
