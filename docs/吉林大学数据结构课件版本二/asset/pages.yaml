- pgno: 203
  md: '# 3.2 栈的应用举例


    # 应用二：括号匹配的检验编程思想


    +   - 设置一个栈st, 用i扫描表达式exp

    +   - 遇到 "("、"{"、"[" 时，将其入栈

    +   - 遇到 ")"、"{"、"]" 时，要判断栈顶元素是不是和它匹配的括号

    +   - 若不是, 则退出扫描过程, 返回0

    +   - 否则栈顶元素出栈,

    +   - 直到exp扫描完毕为止

    +   - 若top==0, 则匹配成功, 返回1'
