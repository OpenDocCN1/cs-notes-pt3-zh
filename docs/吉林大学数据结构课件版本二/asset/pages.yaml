  md: "# 改进的二叉排序树查找的算法实现\n\n```\nStatus SearchBST (BiTree T, KeyType key, BiTree f,BiTree\
    \ &p )\n{\n    if (!T)\n        { p = f; return FALSE; } // 查找不成功\n    else if\
    \ ( EQ(key, T->data.key) )\n        { p = T; return TRUE; } // 查找成功\n    else\
    \ if ( LT(key, T->data.key) )\n        return SearchBST (T->lchild, key, T, p\
    \ );\n        // 在左子树中继续查找\n    else\n        return SearchBST (T->rchild, key,\
    \ T, p );\n        // 在右子树中继续查找\n} // SearchBST\n```"
