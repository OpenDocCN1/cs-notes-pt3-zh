    从逻辑结构看：

    1) 树中只有根结点没有前趋；除根外，其余结点都有且仅有一个前趋；

    2) 树的结点，可以有零个或多个后继；

    3) 除根外的其他结点，都存在唯一一条从根到该结点的路径；'
