  md: "# 堆排序\n\n```\nVoid HeapSort(HeapType &H)\n{\n    for( i=H.length/2; i>0; --i)\n\
    \        HeapAdjust(H, i, H.length);\n    for( i=H.length; i>1; --i)\n    {\n\
