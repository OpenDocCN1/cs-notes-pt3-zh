- pgno: 756
  md: "# 2. 快速排序的算法实现\n\n```\nint partition(sqlist &L,int low,int high)\n{\n    pivotkey=L.r[low].key;\n\
    \    while(low<high)\n    {\n        while(low<high&&L.r[high].key>=pivotkey)\
    \ --high;\n        L.r[low] ↔ L.r[high];\n        while(low<high&&L.r[low].key<=pivotkey)\
    \ ++low;\n        L.r[low] ↔ L.r[high];\n    }\n    return low;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 757
  md: "# 2. 快速排序的算法实现\n\n```\nint partition(sqlist &L,int low,int high)\n{\n    L.r[0]=L.r[low];\n\
    \    pivotkey=L.r[low].key;\n    while(low<high)\n    {\n        while(low<high&&L.r[high].key>=pivotkey)\
    \ --high;\n        L.r[low] = L.r[high];\n        while(low<high&&L.r[low].key<=pivotkey)\
    \ ++low;\n        L.r[low] = L.r[high];\n    }\n    L.r[low]=L.r[0];\n    return\
    \ low;\n}\n```"
