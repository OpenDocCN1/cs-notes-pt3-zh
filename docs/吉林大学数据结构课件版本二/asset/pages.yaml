- pgno: 431
  md: '# 6.3.3线索二叉树


    # 定义：


    +   - 利用二叉链表中的空指针域，存放指向结点在某种遍历次序下的前趋和后继结点的指针（这种附加的指针称为“线索”）。这种二叉链表称为线索链表

    +   - 相应的二叉树称为线索二叉树

    +   - 线索化：对二叉树按某种遍历次序使其变为线索二叉树的过程叫线索化

    +   - 根据线索性质的不同，线索二叉树可分为前序线索二叉树、中序线索二叉树和后序线索二叉树三种'
  merge: -1
  img_proc: true
- pgno: 432
  md: "# # 6.3.3 线索二叉树\n\n+   **实现**\n+   \n+   - 在有n个结点的二叉链表中必定有n+1个空链域\n+   \n+\
    \   - 在线索二叉树的结点中增加两个标志域\n+   \n+     - **ltag** :\n+       - 若 ltag =0, lchild\
