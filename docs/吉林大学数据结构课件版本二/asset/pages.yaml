- pgno: 773
  md: '# 10.4.3 堆排序


    # 2. 堆排序的基本思想


    将排序码k₁, k₂, k₃, …, kₙ表示成一棵完全二叉树，然后从第⌊n/2⌋个排序码(即树的最后一个非终端结点)开始筛选，使由该结点作根结点组成的子二叉树符合堆的定义，然后从第⌊n/2⌋-1个排序码重复刚才操作，直到第一个排序码止。这时候，该二叉树符合堆的定义，初始堆已经建立。'
  merge: -1
