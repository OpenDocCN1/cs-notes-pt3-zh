  md: '# 6.5 二叉树的應用


    # 哈夫曼树(Huffman)——带权路径长度最短的树


    +   定义


    +   路径：从树中一个结点到另一个结点之间的分支构成这两个结点间的路径。


    +   路径长度：路径上的分支数


    +   树的路径长度：从树根到每一个结点的路径长度之和；一般记为PL。在结点数相同的条件下，完全二叉树是路径最短的二叉树。


    ![](img/df7a4356658bc366c52d5e361f054231_464_0.png)


    ![](img/df7a4356658bc366c52d5e361f054231_464_1.png)'
  merge: -1
