- pgno: 706
  md: '# 9.3 哈希表


    # 哈希函数的构造方法


    +   - 平方取中法

    +     - 构造：取关键字平方后中间几位作哈希地址

    +     - 适于不知道全部关键字情况


    +   - 折叠法

    +     - 构造：将关键字分割成位数相同的几部分，然后取这几部分的叠加和（舍去进位）做哈希地址

    +     - 种类

    +       - 移位叠加：将分割后的几部分低位对齐相加

    +       - 间界叠加：从一端沿分割界来回折送，然后对齐相加

    +     - 适于关键字位数很多，且每一位上数字分布大致均匀情况'
  merge: -1
  img_proc: true
