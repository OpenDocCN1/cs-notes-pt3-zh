- pgno: 776
  md: '# 筛选法建立大顶堆


    ```

    Void HeapAdjust(HeapType &H,int s,int m)

    {

    rc=H.r[s];

    for(j=2*s;j<=m;j*=2)

    {

    if(j<m&&LT(H.r[j].key,H.r[j+1].key))

    ++j;

    if(!LT(rc.key,H.r[j].key)) break;

    H.r[s]=H.r[j]; s=j;

    }

    H.r[s]=rc;

    }

    ```'
