- pgno: 469
  md: '# 6.5 二叉树的应用


    +   构造Huffman树的方法——Huffman算法


    +   构造Huffman树步骤


    +   根据给定的n个权值{w1,w2,......wn}，构造n棵只有根结点的二叉树，令其权值为wj


    +   在森林中选取两棵根结点权值最小的树作左右子树，构造一棵新的二叉树，置新二叉树根结点权值为其左右子树根结点权值之和


    +   在森林中删除这两棵树，同时将新得到的二叉树加入森林中


    +   重复上述两步，直到只含一棵树为止，这棵树即哈夫曼树'
  merge: -1
  img_proc: true
