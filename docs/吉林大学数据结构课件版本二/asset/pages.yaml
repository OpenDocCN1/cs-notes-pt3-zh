  md: '# 4 树的基本术语


    ![](img/df7a4356658bc366c52d5e361f054231_372_0.png)


    树的结点：包含一个数据元素及若干指向子树的分支；


    孩子结点：结点的子树的根称为该结点的孩子；


    双亲结点：孩子结点的上层结点叫该结点的双亲；


    兄弟结点：同一双亲的孩子结点；


    堂兄结点：同一层上结点；


    祖先结点：从根到该结点的所经分支上的所有结点


    子孙结点：以某结点为根的子树中任一结点都称为该结点的子孙'
