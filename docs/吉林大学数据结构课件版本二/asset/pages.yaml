- pgno: 24
  md: '# 1.4 算法


    +   - 算法：是为了解决某类问题而规定的一个有限长的操作序列。\n- 一个算法必须满足以下五个重要特性：\n  1. 有穷性\n  2. 确定性\n  3.
    可行性\n  4. 输入\n  5. 输出'
  merge: -1
  img_proc: true
- pgno: 25
  md: '1) 有穷性: 一个算法必须总是（对任何合法的输入值）在执行有穷步之后结束，且每一步都可在有穷时间内被完成。


    2) 确定性: 算法中的每条指令必须有确切的含义，不会产生二义性。在任何条件下，算法只有唯一的执行路径，即相同的输入得到相同的结果。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   3）可行性：即算法中描述的操作都是可以通过已经实现的基本运算执行有限次来实现的。


    +   4）输入：一个算法有零个或多个输入，'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 算法设计的要求


    +   - 一个算法在设计的时候要遵循以下原则

    +     - 1. 正确性

    +     - 2. 可读性

    +     - 3. 健壮性

    +     - 4. 高效率与低存储量需求'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   1. 正确性一般分为一下4个层次:

    +   - 1. 程序不含语法错误。

    +   - 2. 程序对于几组输入数据能够得出满足要求的结果。

    +   - 3. 程序对于精心选择的典型、苛刻而带有刁难性的记住输入数据能够得出满足要求的结果。

    +   - 4. 程序对于一切合法输入都能得出满足要求的结果。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   2. 可读性：算法应该是易于理解。另一方面，晦涩难懂的程序也比较容易隐藏错误而且难以调试。


    +   3. 健壮性：当输入数据非法的时候，算法应当恰当的做出反映或者进行处理，而不是产生莫名其妙的结果或者中断程序。'
  merge: -1
  img_proc: true
- pgno: 30
  md: +   - 4. 高效率和低存储量：效率指算法执行的时间，低存储量是指算法执行过程中所需要的最大存储空间。两者都与问题的规模有关。
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - 算法效率的度量有以下两种方法：

    +   - （1）事后统计

    +     - 缺点：

    +     - 1. 必须执行程序。

    +     - 2. 其他因素容易掩盖算法本身的优劣。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '（2）事前分析估算：一个用高级语言编写的程序在计算机上运行时所消耗的时间取决于下列因素。


    +   - 1. 算法选用何种策略。

    +   - 2. 问题规模。

    +   - 3. 语言级别越高，效率越低。

    +   - 4. 编译程序产生的机器代码的质量。

    +   - 5. 机器执行指令的速度。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - 一个特定算法的“运行工作量”的大小，只依赖于问题的规模（通常用整数量n表示），或者说它是问题规模的函数。


    +   - 算法 = 控制结构 + 原操作

    +     （控制结构:顺序，分支，循环）


    +   - 则算法的时间取决于两者的综合效果。'
  merge: -1
  img_proc: true
- pgno: 34
  md: +   - 为了便于比较同一问题的不同算法，通常做法是从算法中选取一种对于所研究的问题来说是基本操作的原操作，以该基本操作的重复执行次数作为算法的时间量度。
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - 一般情况下，算法中基本操作重复执行的次数是问题规模n的某个函数f(n),算法的时间度量记作

    +   - T(n) = O(f(n))


    当n -> ∞时，把时间复杂度的数量级（阶）称为算法的渐进时间复杂度。'
  merge: -1
  img_proc: true
- pgno: 36
  md: "```\nfor(i=1;i<=n++i)\nfor(j=1;j<=n;++j){\n    c[i][k] = 0;\n    for(k=1;k<=n;++k)\n\
    \    c[i][j] += a[i][k]*b[k][j];\n}\n```\n\n+   - T(n) = O(n³)"
  merge: -1
  img_proc: true
- pgno: 37
  md: "```\nvoid select_sort(int a[],int n){\n    for(i=0;i<n-1;++i){\n        j=i;\n\
    \        for(k=i+1;k<n;++k)\n            if(a[k]<a[j]) j=k;\n        if(j!=i)\
    \ a[j] <->a[i];\n    }\n}\n```\n\n基本操作执行次数为 (n²-n)/2\n\nT(n) = O(n²)\n\n输入数据不影响时间复杂度"
  merge: -1
  img_proc: true
- pgno: 38
  md: "```\nvoid bubble_sort(int a[],int n){\n    for(i=n+1,change=true;i>1&&change;--i){\n\
    \        change=false;\n        for(j=0;j<i;++j)\n            if(a[j]>a[j+1]){\n\
    \                a[j] <-> a[j+1];\n                change=true;\n            }\n\
    \    }\n}\n```\n\n输入数据影响时间复杂度，如果a是递增序列，那么基本操作执行次数为0，如果a是递减序列，则基本操作的执行次数为n(n-1)/2\n\
    一般我们讨论的时间复杂度均指最坏情况。"
  merge: -1
  img_proc: true
