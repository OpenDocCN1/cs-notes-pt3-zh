  md: '# n 维数组


    +   各维元素个数为 b₁, b₂, b₃, ..., bₙ


    +   下标为 i₁, i₂, i₃, ..., iₙ 的数组元素的存储地址：


    LOC(i₁, i₂, ..., iₙ) = Loc(a₀...₀) + (i₁*b₂*b₃*...*bₙ + i₂*b₃*b₄*...*bₙ + + ......
    + iₙ₋₁*bₙ + iₙ) * l

    = Loc(a₀...₀) + (∑_{j=1}^{n-1} i_j * ∏_{k=j+1}^{n} b_k + i_n) * l'
