- pgno: 62
  md: '# 插入算法分析


    +   - 当 i=1 时，结点后移语句将循环执行 n 次

    +   - 当 i=n+1 时，结点后移语句将不进行

    +   - 当 i 是一个随机数时：

    +     需移动元素的平均次数：Eis(n)=∑_{i=1}^{n+1} p_i (n-i+1)

    +     又 p₁=p₂=p₃=...=p_{n+1}=1/(n+1)'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# 插入算法分析\n\nEis = \\frac{1}{n+1} \\sum_{i=0}^{n} (n - i) = \\frac{1}{n+1} (n\
    \ + \\cdots + 1 + 0) \n\n= \\frac{1}{(n+1)} \\frac{n(n+1)}{2} = \\frac{n}{2}\n\
    \n其时间复杂度为 O（n）。"
  merge: -1
