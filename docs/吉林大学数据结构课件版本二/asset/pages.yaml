- pgno: 750
  md: "# 希尔排序的完整算法如下\n\n```\nvoid ShellInsert(sqlist &L, int dk)\n{\n    for(i=dk+1;\
    \ i<=L.length;++i)\n        if(LT(L.r[i].key,L.r[i-dk].key))\n        {\n    \
    \        L.r[0]=L.r[i];\n            for(j=i-dk; j>0&&LT(L.r[0].key,L.r[j].key)\
    \ ;j-=dk)\n                L.r[j+dk]=L.r[j];\n            L.r[j+dk]=L.r[0];\n\
    \        }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 751
  md: '# 10.2.3希尔排序


    # 3. 希尔排序的效率分析


    虽然我们给出的算法是三层循环，最外层循环为log2n数量级，中间的for循环是n数量级的，内循环远远低于n数量级，因为当分组较多时，组内元素较少；此循环次数少；当分组较少时，组内元素增多，但已接近有序，循环次数并不增加。因此，希尔排序的时间复杂度在O（nlog2n）和O（n2）之间，大致为O（n1.3）。


    希尔排序在比较时进行元素移动，有可能改变相同排序码元素的原始顺序，因此希尔排序是不稳定的。'
  merge: -1
  img_proc: true
- pgno: 752
  md: '# 10. 3 交换排序


    # 10.3.1 冒泡排序


    # 1. 冒泡排序的基本思想


    通过对待排序序列从后向前（从下标较大的元素开始），依次比较相邻元素的排序码，若发现逆序则交换，使排序码较小的元素逐渐从后部移向前部（从下标较大的单元移向下标较小的单元），就象水底下的气泡一样逐渐向上冒'
  merge: -1
  img_proc: true
- pgno: 753
  md: '# 10. 3 交换排序


    # 10. 3. 1 冒泡排序


    # 2. 冒泡排序的效率分析


    +   - 若待排序的元素为正序，则只需进行一趟排序，比较次数为（n-1）次，移动元素次数为0；

    +   - 若待排序的元素为逆序，则需进行n-1趟排序，比较次数为(n2-n)/2，因此冒泡排序算法的时间复杂度为O（n2）

    +   - 由于其中的元素移动较多，所以属于内排序中速度较慢的一种。

    +   - 因为冒泡排序算法只进行元素间的顺序移动，所以是一个稳定的算法。'
  merge: -1
  img_proc: true
- pgno: 754
  md: '# 10.3.2 快速排序


    # 1. 快速排序的基本思想


    任取待排序序列中的某个元素作为基准（一般取第一个元素），通过一趟排序，将待排元素分为左右两个子序列，左子序列元素的排序码均小于或等于基准元素的排序码，右子序列的排序码则大于基准元素的排序码，然后分别对两个子序列继续进行排序，直至整个序列有序。'
  merge: -1
  img_proc: true
