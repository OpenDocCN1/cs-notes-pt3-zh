    +     E(G)是有向边（也称弧）的有限集合，弧是顶点的有序对，记为<v,w>，v,w是顶点，v为弧尾，w为弧头

    +   - 无向图——由两个集合V(G)和E(G)组成的

    +     其中：V(G)是顶点的非空有限集

    +     E(G)是边的有限集合，边是顶点的无序对，记为(v,w)或(w,v)，并且(v,w)=(w,v)'
