- pgno: 738
  md: '# 10.1基本概念


    # 1. 排序码（Sort Key）


    作为排序依据的记录中的一个属性。它可以是任何一种可比的有序数据类型，它可以是记录的主关键字，也可以是任何次关键字。


    # 2. 有序表与无序表


    一组记录按排序码的递增或递减次序排列得到的结果被称之为有序表，相应地，把排序前的状态称为无序表。


    # 3. 正序表与逆序表


    若有序表是按排序码升序排列的，则称为升序表或正序表，否则称为降序表或逆序表。不失普遍性，我们一般只讨论正序表。'
  merge: -1
  img_proc: true
