  md: "# Dijkstra算法思想\n\n+   用邻接矩阵arcs存储带权有向图。S为已找到从v出发的最短路径的终点的集合，它的初始态为空集，辅助向量D[i]存储从v出发到图上其余各点可能达到的最短路径长度，初值为\n\
    +   \n+   D[i]=arcs[LocateVex(G,u)][i]\n\n+   选择vj，使得 D[j]=Min{D[i] | vi ∈ V-S}\n\
    +   令 S=S∪{j}\n\n+   如果D[j]+arcs[j][k]<D[k] 则修改D[k]为\n\n+   D[k] =D[j]+arcs[j][k]\n\
    \n+   重复上述操作n-1次"
