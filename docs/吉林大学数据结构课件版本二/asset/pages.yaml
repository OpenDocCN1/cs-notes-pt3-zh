- pgno: 629
  md: '# # 7.6 关键路径


    问题提出


    把工程计划表示为有向图，用顶点表示事件，弧表示活动；每个事件表示在它之前的活动已完成，在它之后的活动可以开始


    例 一个工程有11项活动，9个事件


    事件 V1——表示整个工程开始


    事件 V9——表示整个工程结束


    +   问题：

    +   (1) 完成整项工程至少需要多长时间？

    +   (2) 哪些活动是影响工程进度的关键？


    ![](img/df7a4356658bc366c52d5e361f054231_629_0.png)'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# 7.6 关键路径


    # 定义


    +   AOE网(Activity On Edge)——也叫边表示活动的网。AOE网是一个带权的 有向无环图，其中顶点表示事件，弧表示活动，权表示活动持续时间


    +   路径长度——路径上各活动持续时间之和


    +   关键路径——路径长度最长的路径叫~


    +   Ve(j)——表示事件Vj的最早发生时间


    +   Vl(j)——表示事件Vj的最迟发生时间


    +   e(i)——表示活动ai的最早开始时间


    +   l(i)——表示活动ai的最迟开始时间


    +   l(i)-e(i)——表示完成活动ai的时间余量


    +   关键活动——关键路径上的活动叫~，即l(i)=e(i)的活动'
  merge: -1
  img_proc: true
- pgno: 631
  md: '# 问题分析


    +   如何找e(i)=l(i)的关键活动？


    ![](img/df7a4356658bc366c52d5e361f054231_631_0.png)


    设活动ai用弧<j,k>表示，其持续时间记为：

    dut(<j,k>)

    则有：

    （1）e(i)=Ve(j)


    （2）l(i)=Vl(k)-dut(<j,k>)


    +   如何求Ve(j)和Vl(k)？'
  merge: -1
  img_proc: true
- pgno: 632
  md: '![](img/df7a4356658bc366c52d5e361f054231_632_0.png)


    # • 求Ve(j)和Vl(k)


    (1)从Ve(1)=0开始向前递推


    Ve(j) = Max {Ve(i) + dut(<i, j>) }, <i, j> ∈ T, 2 ≤ j ≤ n


    其中 T是所有以j为头的弧的集合


    (2)从Vl(n)=Ve(n)开始向后递推


    Vl(i) = Min {Vl(j) - dut(<i, j>) }, <i, j> ∈ S, 1 ≤ i ≤ n-1


    其中 S是所有以i为尾的弧的集合'
  merge: -1
  img_proc: true
- pgno: 633
