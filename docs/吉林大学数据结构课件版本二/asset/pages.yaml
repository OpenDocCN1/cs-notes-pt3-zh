  md: '# 3 二路归并排序的效率分析


    +   - 二路归并排序的时间复杂度为 **O(nlog2n)**。

    +   - 利用二路归并排序时，需要利用与待排序数组相同的辅助数组作临时单元，故该排序方法的空间复杂度为 **O(n)**，比前面介绍的其它排序方法占用的空间大。

    +   - 二路归并排序是一种稳定的排序方法。'
