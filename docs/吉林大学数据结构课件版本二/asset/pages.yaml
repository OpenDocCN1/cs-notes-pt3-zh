- pgno: 465
  md: '# 6.5 二叉树的应用


    # 哈夫曼树(Huffman)——带权路径长度最短的树


    +   树的带权路径长度：树中所有叶子结点的带权路径长度之和 —— 树的代价


    记作： wpl = Σₖ=1ⁿ wₖ lₖ


    其中： wₖ —— 权值

    lₖ —— 节点到根的路径长度


    +   Huffman树——设有n个权值{w1,w2,......wn}，构造一棵有n个叶子结点的二叉树，每个叶子的权值为wi,则wpl最小的二叉树叫~


    ![](img/df7a4356658bc366c52d5e361f054231_465_0.png)'
