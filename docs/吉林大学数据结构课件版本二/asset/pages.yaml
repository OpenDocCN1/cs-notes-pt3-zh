  md: '# 5.4 广义表的定义


    从上述定义和例子可推出广义表的三个重要结论：


    +   - 广义表的元素可以是子表，而子表的元素还可以是子表。由此，广义表是一个多层次的结构，可以用图形形象地表示。 P108


    +   - 广义表可为其它表所共享。例如在上述例4中，广义表A，B，C为D的子表，则在D中可以不必列出子表的值，而是通过子表的名称来引用。'
