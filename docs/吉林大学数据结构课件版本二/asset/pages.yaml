  md: '# 7.4 图的连通性问题


    说明


    +   - 一个图可以有许多棵不同的生成树


    +   - 所有生成树具有以下共同特点：

    +     - 生成树的顶点个数与图的顶点个数相同

    +     - 生成树是图的极小连通子图

    +     - 一个有 n 个顶点的连通图的生成树有 n-1 条边

    +     - 生成树中任意两个顶点间的路径是唯一的

    +     - 在生成树中再加一条边必然形成回路


    +   - 含 n 个顶点 n-1 条边的图不一定是生成树


