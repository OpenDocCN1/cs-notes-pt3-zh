- pgno: 722
  md: '# B-树的操作


    # (1) 插入


    首先找到k应插入的结点，将k插入。然后，判断被插入结点是否满足m叉B-树的定义，即插入后结点的分支数是否大于m（结点的关键字数是否大于m-1），若不大于，则插入结束；否则，要把该结点分裂成两个。


    # 方法


    申请一个新结点，由指针p''指向，将插入后的结点按照关键字的大小分成左、中、右三部分，中间只含一项，左边的留在原结点，右边的移入新结点，中间的构成新的插入项，插入到它们的双亲结点中，若双亲结点在插入后也要分裂，则在分裂后再往上插入'
  merge: -1
