- pgno: 594
  md: '# 7.5 拓扑排序


    # 拓扑排序的方法


    +   - 在有向图中选一个没有前驱的顶点且输出之

    +   - 从图中删除该顶点和所有以它为尾的弧

    +   - 重复上述两步，直至全部顶点均已输出，拓扑有序序列形成，拓扑排序完成；或者当图中还有未输出的顶点，但已跳出处理循环。说明图中还剩一些顶点，它们都有直接前驱。这时网络中必存在有向环。'
  merge: -1
  img_proc: true
