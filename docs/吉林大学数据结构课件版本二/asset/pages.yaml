- pgno: 592
  md: '# 7.5 拓扑排序


    +   检测AOV网中是否存在环方法是对AOV网络构造它的拓扑有序序列。


    如果通过拓扑排序能将AOV网络的所有顶点都排入一个拓扑有序的序列中，则该网络中必定不会出现有向环。此AOV网络所代表的工程是可行的。


    如果AOV网络中存在有向环，此AOV网络所代表的工程是不可行的。


    +   拓扑排序——把AOV网络中各顶点按照它们相互之间的优先关系排列成一个线性序列的过程叫做拓扑排序。'
  merge: -1
  img_proc: true
