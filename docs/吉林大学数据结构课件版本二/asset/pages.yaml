- pgno: 582
  md: '# 最小生成树


    # 方法二：克鲁斯卡尔(Kruskal)算法


    +   算法思想：


    设连通网 N=(V,{E})，令最小生成树初始状态为只有 n个顶点而无边的非连通图 T=(V,{Φ})，每个顶点自成一个连通分量


    在E中选取代价最小的边，若该边依附的顶点落在T中不同的连通分量上，则将此边加入到T中；否则，舍去此边，选取下一条代价最小的边


    依此类推，直至T中所有顶点都在同一连通分量上为止'
  merge: -1
  img_proc: true
