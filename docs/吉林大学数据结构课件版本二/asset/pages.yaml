- pgno: 659
  md: '# 第九章：查找


    # 7.1静态查找表


    # 折半查找


    +   - 算法实现


    +   - 设表长为n，low、high和mid分别指向待查元素所在区间的上界、下界和中点,k为给定值

    +   - 初始时，令low=1,high=n,mid=⌊(low+high)/2⌋

    +   - 让k与mid指向的记录比较

    +     - 若k==r[mid].key，查找成功

    +     - 若k<r[mid].key，则high=mid-1

    +     - 若k>r[mid].key，则low=mid+1

    +   - 重复上述操作，直至low>high时，查找失败'
  merge: -1
  img_proc: true
- pgno: 660
  md: '```

    int bin_search (SSTable ST, keytype key)

    {

    low=1; high=ST.length;    //置初值查找范围的低、高端指针

    while (low<=high)

    {

    mid=(low+high)/2;         //计算中间项位置

    if (key==ST.elem[mid].key) return mid;   //找到，结束循环

    else if (key< ST.elem [mid].key)

    high=mid-1;               //给定值k小

    else low=mid+1;          //给定值k大

    }

    return 0 ;               //查找失败

    }

    ```'
  merge: -1
