- pgno: 389
  md: '# 二叉树的性质


    ![](img/df7a4356658bc366c52d5e361f054231_389_0.png)


    性质5 如将一棵有n个结点的完全二叉树自顶向下，同一层自左向右连续给结点编号1, 2, …, n，则有以下关系：


    +   若 i = 1，则 i 无双亲

    +   若 i > 1，则 i 的双亲为 ⌊i/2⌋


    +   若 2*i > n，则结点 i 无左孩子；若 2*i ≤ n，则其左孩子是 2*i


    +   若 2*i+1 > n，则结点 i 无右孩子；若 2*i+1 ≤ n，则其右孩子是 2*i+1'
