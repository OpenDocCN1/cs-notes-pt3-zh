- pgno: 580
  md: "# 用普里姆算法\n\n```\nvoid PRIM( MGrap h G, VertexType u) //从第u个顶点出发\n{\n k=LocateVex(G,u);\n\
    \ for (j=0; j<G.vexnum; j++)\n  if(j!=k) closedge[j]={u, G.arcs[k][j].adj};\n\
    \ closedge[k].lowcost=0;                 //初始U={u}\n\n for (i=1; i<G.vexnum; i++)\
    \             //循环n-1次，每次求出最小生成树的一条边\n  k=minnum(closededge);\n  printf(closededge[k].adjvex,G.vexs[k]);\
    \          //输出生成树的边\n  closedge[k].lowcost=0;              //将k并入U中\n  for (j=0;\
    \ j<G.vexnum; j++)          //修改lowcost[j]和closest[j]\n   if (G.arcs[k][j].adj<\
    \ closededge[j].lowcost)   //新顶点并入后重新选择最小边\n    lowedge[j]={u, G.arcs[k][j].adj};\n\
    \ }\n}\n```"
