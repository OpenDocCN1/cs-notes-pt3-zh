- pgno: 574
  md: '# 最小生成树


    # 问题提出


    要在n个城市间建立通信联络网，

    顶点——表示城市

    权——城市间建立通信线路所需花费代价


    希望找到一棵生成树，它的每条边上的权值之和（即建立该通信网所需花费的总代价）最小——最小代价生成树


    # 问题分析


    n个城市间，最多可设置 n(n-1)/2 条线路

    n个城市间建立通信网，只需 n-1 条线路


    问题转化为：如何在可能的线路中选择n-1条，能把所有城市（顶点）均连起来，且总耗费（各边权值之和）最小


    ![](img/df7a4356658bc366c52d5e361f054231_574_0.png)'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# 最小生成树性质（MST性质）


    +   最小生成树性质：


    设G=(V, E)是一个连通网络，U是顶点集V的一个真子集。若(u, v)是G中所有的一个端点在U(u∈U)里、另一个端点不在U(即v∈V-U)里的边中，并且是具有最小权值的一条边，则一定存在G的一棵最小生成树包括此边(u,
    v)。


    ![](img/df7a4356658bc366c52d5e361f054231_575_0.png)'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# 构造最小生成树方法


    # 方法一：普里姆(Prim)算法


    +   算法思想：


    +   设N=(V,{E})是连通网，TE是N上最小生成树中边的集合


    +   初始令U={u0},(u0∈V), TE=Φ


    +   在所有u∈U,v∈V-U的边(u,v)∈E中，找一条代价最小的边(u0,v0)


    +   将(u0,v0)并入集合TE，同时v0并入U


    +   重复上述操作直至U=V为止，则T=(V,{TE})为N的最小生成树


    注意：

    若候选轻边集中的轻边不止一条，可任选其中的一条扩充到T中。

    连通网的最小生成树不一定是惟一的，但它们的权相等。


    ![](img/df7a4356658bc366c52d5e361f054231_576_0.png)'
  merge: -1
  img_proc: true
