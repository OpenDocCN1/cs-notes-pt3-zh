- pgno: 744
  md: "# 2. 直接插入的算法实现\n\n```\nvoid InsertSort (SqList &L)\n{\n    for ( i=2; i<=L.length;\
    \ i++)\n        if(LT(L.r[i].key,L.r[i-1].key))\n        {\n            L.r[0]=L.r[i];\n\
    \            L.r[i]=L.r[i-1];\n            for(j=i-2; LT(L.r[0].key,L.r[j].key);\
    \ --j)\n                L.r[j+1]=L.r[j];\n            L.r[j+1]=L.r[0];\n     \
    \   }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 745
  md: '# 10. 2 插入排序


    # 3. 直接插入排序的效率分析


    +   - 从空间来看，它只需要一个元素的辅助空间，用于元素的位置交换。

    +   - 从时间分析，首先外层循环要进行n-1次插入，每次插入最少比较一次（正序），移动两次；最多比较i次，移动i+1次（逆序）（i=1, 2, …, n-1）。因此，直接插入排序的时间复杂度为O（n²）。

    +   - 直接插入算法的元素移动是顺序的，该方法是稳定的。'
  merge: -1
  img_proc: true
- pgno: 746
  md: "# 2、折半插入排序\n\n排序过程：用折半查找方法确定插入位置的排序\n\n例：有6个记录，前5个已排序的基础上，对第6个记录排序。\n\n1  \
    \ 2   3   4   5   6\n[ 15  27  36  53  69 ]  42\n↑low   ↑mid ↑low ↑high\n    \
    \  ↑mid\n[ 15  27  36  42  53  69 ]\n\n> (high<low ，查找结束，插入位置为low 或high+1 )"
  merge: -1
