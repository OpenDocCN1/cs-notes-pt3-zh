  md: '# 6.4.5 哈希查找的性能分析


    # 1. 线性探查法的性能分析


    由于线性探查法解决冲突是线性地查找空闲位置的，平均查找长度与表的大小m无关，只与所选取的哈希函数H及装填因子α的值和该处理方法有关，这时的成功的平均查找长度为ASL=1/2（1+1/(1-α)）。


    # 2. 拉链法查找的性能分析


    由于拉链法查找就是在单链表上查找，查找单链表中第一个结点的次数为1，第二个结点次数为2，其余依次类推。它的平均查找长度ASL=1+α/2。'
