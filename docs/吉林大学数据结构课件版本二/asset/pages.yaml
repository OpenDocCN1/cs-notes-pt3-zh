- pgno: 781
  md: '# 10.5.1 二路归并排序


    ```

    ```

    void Merge( RcdType SR[],

    RcdType&TR[],int i, int m, int n)

    {

    //将有序的SR[i..m]和SR[m+1..n]归并为有序的TR[i..n]

    for(j=m+1, k=i; i<=m&&j<=n; ++k)

    {

    if(LQ(SR[i].key, SR[j].key))

    TR[k]=SR[i++];

    else TR[k]=SR[j++];

    }

    if(i<=m) TR[k..n]=SR[i..m];

    if(j<=n) TR[k..n]=SR[j..n];

    }

    ```

    ```'
