  md: "# 双向循环链表删除的算法\n\n```\nStatus ListDelet_Dul ( DulinkList &L, int i ,ElemType\
    \ &e)\n{\n    if (!(p = GetElemP_Dul ( L, i )))\n        return ERROR;    // 指针位于删除结点位置\n\
