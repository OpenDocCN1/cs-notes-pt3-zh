  md: '# # 7.3 图的遍历


    # ## 广度优先遍历(BFS)




    +   - 从图的某一顶点Vo出发，访问此顶点后，依次访问 Vo的各个未曾访问过的邻接点；


    +   - 然后分别按顺序从这些邻接点出发，广度优先遍历图，直至图中所有已被访问的顶点的邻接点都被访问问到；


    +   - 若此时图中尚有顶点未被访问，则另选图中一个未被访问的顶点作起点，重复上述过程，直至图中所有顶点都被访问为止'
