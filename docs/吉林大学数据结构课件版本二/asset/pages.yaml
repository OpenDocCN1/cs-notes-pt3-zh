    # 6.3.1二叉排序树查找


    二叉排序树（Binary Sorting Tree）：它或者是一棵空树，或者是一棵具有如下特征的非空二叉树：


    +   - 若它的左子树非空，则左子树上所有结点的关键字均小于根结点的关键字；

    +   - 若它的右子树非空，则右子树上所有结点的关键字均大于根结点的关键字；

    +   - 左、右子树本身又都是一棵二叉排序树。'
