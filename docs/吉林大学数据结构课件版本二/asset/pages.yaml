- pgno: 787
  md: '# 10. 8 各种内排序方法的比较和选择


    # 7.1 各种内排序方法的比较


    # 从时间复杂度比较


    从平均时间复杂度来考虑，直接插入排序、冒泡排序、直接选择排序是三种简单的排序方法，时间复杂度都为O(n²)，而快速排序、堆排序、二路归并排序的时间复杂度都为O(nlog₂n)，希尔排序的复杂度介于这两者之间。若从最好的时间复杂度考虑，则直接插入排序和冒泡排序的时间复杂度最好，为O(n)，其它的最好情形同平均情形相同。若从最坏的时间复杂度考虑，则快速排序为O(n²)，直接插入排序、冒泡排序、希尔排序同平均情形相同，但系数大约增加一倍，所以运行速度将降低一半，最坏情形对直接选择排序、堆排序和归并排序影响不大。'
  merge: -1
  img_proc: true
- pgno: 788
  md: '# 2. 从空间复杂度比较


    归并排序的空间复杂度最大，为O(n)，快速排序的空间复杂度为O(log₂n)，其它排序的空间复杂度为O（1）。


    # 3. 从稳定性比较


    直接插入排序、冒泡排序、归并排序是稳定的排序方法，而直接选择排序、希尔排序、快速排序、堆排序是不稳定的排序方法。


    # 4. 从算法简单性比较


    直接插入排序、冒泡排序、直接选择排序都是简单的排序方法，算法简单，易于理解，而希尔排序、快速排序、堆排序、归并排序都是改进型的排序方法，算法比简单排序要复杂得多，也难以理解。'
  merge: -1
  img_proc: true
- pgno: 789
  md: '# 7.7.2 各种内排序方法的选择


    # 1. 从时间复杂度选择


    对元素个数较多的排序，可以选快速排序、堆排序、归并排序，元素个数较少时，可以选简单的排序方法。


    # 2. 从空间复杂度选择


    尽量选空间复杂度为O（1）的排序方法，其次选空间复杂度为O(log₂n)的快速排序方法，最后才选空间复杂度为O（n）二路归并排序的排序方法。


    # 3. 一般选择规则


    +   （1）当待排序元素的个数n较大，排序码分布是随机，而对稳定性不做要求时，则采用快速排序为宜。'
  merge: -1
  img_proc: true
- pgno: 790
  md: '(2)当待排序元素的个数n大，内存空间允许，且要求排序稳定时，则采用二路归并排序为宜。


    (3) 当待排序元素的个数n大，排序码分布可能会出现正序或逆序的情形，且对稳定性不做要求时，则采用堆排序或二路归并排序为宜。


    (4)当待排序元素的个数n小，元素基本有序或分布较随机，且要求稳定时，则采用直接插入排序为宜。


    (5)当待排序元素的个数n小，对稳定性不做要求时，则采用直接选择排序为宜，若排序码不接近逆序，也可以采用直接插入排序。冒泡排序一般很少采用。'
  merge: -1
  img_proc: true
