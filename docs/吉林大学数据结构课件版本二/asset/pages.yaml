- pgno: 700
  md: '# 9.3 哈希表


    +   基本思想：

    +   在记录的存储地址和它的关键字之间建立一个确定的对应关系；这样，不经过比较，一次存取就能得到所查元素的查找方法


    +   定义


    +   哈希函数——在记录的关键字与记录的存储地址之间建立的一种对应关系


    +   哈希函数是一种映射，是从关键字空间到存储地址空间的一种映射


    +   哈希函数可写成： addr(ai)=H(ki)


    +   ai是表中的一个记录


    +   addr(ai)是ai的存储地址


    +   ki是ai的关键字


    ![](img/df7a4356658bc366c52d5e361f054231_700_0.png)'
  merge: -1
  img_proc: true
