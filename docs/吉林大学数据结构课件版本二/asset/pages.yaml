  md: '# 2 平衡二叉树查找


    # 1．平衡二叉树


    平衡二叉树(balanced binary tree)是由阿德尔森—维尔斯和兰迪斯(Adelson-Velskii and Landis)于1962年首先提出的，又称为AVL树。


    # 2．平衡二叉树的概念


    平衡二叉树或是一棵空树或是具有下列性质的二叉树：它的左子树和右子树都是平衡二叉树，且左右子树的深度之差的绝对值不超过1。'
  merge: -1
  img_proc: true
- pgno: 687
  md: '# 2平衡二叉树查找


    # 3. 平衡因子的概念


    该结点的左子树的深度减去它的右子树的深度。


    # 平衡二叉树特点：


    树中每个结点的左、右子树深度之差的绝对值不大于1


    > |h_L - h_R| ≤ 1'
