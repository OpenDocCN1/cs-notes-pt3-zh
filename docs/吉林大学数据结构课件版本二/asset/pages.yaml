  md: '# 5.4 广义表的定义


    广义表 (Lists, 又称列表) 是线性表的推广。


    +   • 广义表是n(n> = 0)个元素a1,a2,a3,...,an的有限序列

    +   其中ai或者是原子项，或者是一个广义表。

    +   • 通常记作LS= (a1,a2,a3,...,an)。

    +   • LS是广义表的名字，n为它的长度。

    +   • 若ai是广义表，则称它为LS的子表。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 5.4 广义表的定义


    规定：


    +   - 用圆括号将广义表括起来，用逗号分隔其中的元素。

    +   - 用大写字母表示广义表，用小写字母表示原子。

    +   - n = 0 的广义表为空表。

    +   - 若广义表 LS (n >= 1) 非空，则 a1 是 LS 的表头，其余元素组成的表 (a2, a3, ... an) 称为 LS 的表尾。'
  merge: -1
