- pgno: 441
  md: "# 双向线索链表\n\n对二叉树中序遍历的算法\n\n```\nStatus BiThrNode *InorderTraverse(BiThrNode\
    \ *T)\n{\n    p=T->lchild; //p指向根结点\n    while(p!=T) //空树或遍历结束时p==T\n    {\n \
    \       while (p->ltag==Link)\n        {\n            p=p->lchild; //左子树非空时，沿右链往下查找\n\
    \        }\n        if(!visit(p->data)) return ERROR; //访问其左子树为空的结点\n        while\
    \ (p->rtag==Thread && p->rchild!=T)\n        {\n            //访问后继结点\n       \
    \     p=p->rchild; visit(p->data);\n        }\n        p=p->rchild;\n    }\n \
    \   return OK;\n}\n```"
  merge: -1
