- pgno: 779
  md: '# 10. 5 归并排序


    # 10.5.1 二路归并排序


    +   • 二路归并排序的基本思想是：


    +   • 将两个有序子区间（有序表）合并成一个有序子区间，一次合并完成后，有序子区间的数目减少一半，而区间的长度增加一倍，当区间长度从1增加到n（元素个数）时，整个区间变为一个，则该区间中的有序序列即为我们所需的排序结果。'
  merge: -1
  img_proc: true
