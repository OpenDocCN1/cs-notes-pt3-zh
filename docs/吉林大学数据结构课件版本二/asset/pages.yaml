    +   - 求Ve(i)

    +   - 求Vl(j)

    +   - 求e(i)

    +   - 求l(i)

    +   - 计算l(i)-e(i)


    | 顶点 | Ve | Vl |

    |---|---|---|

    | V1 | 0 | 0 |

    | V2 | 6 | 6 |

    | V3 | 4 | 6 |

    | V4 | 5 | 8 |

    | V5 | 7 | 7 |

