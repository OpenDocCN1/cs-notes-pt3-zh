  md: "# 改进算法:KMP算法\n\n```\nInt index_kmp(sstring S, Sstring T,int pos)\n{\n    i=pos;\
    \ j=1;\n    while(i<=S[0]&&j<=T[0])\n    {\n        if(j==0 || S[i] =T[j]){i++;j++;}\n\
    \        else j=next[j];\n    }\n    if(j>T[0])return  i-T[0];\n    else return\
    \ 0;\n}\n```"
