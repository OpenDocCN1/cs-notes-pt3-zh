- pgno: 578
  md: '# 普鲁姆算法涉及的数据和操作：


    数据： 无向连通网络


    操作： 选择权值最小的边，不妨设为（u,v），（u,v）加入TE，u加入U


    # 有关数据的存储结构


    无向连通网络：采用邻接矩阵


    为选择权值最小的边：置一个一维数组： closedge[ ]，包含adjvex和lowcost


    对 i∈V-U


    closededge[i].adjvex= j （j∈U） （j,i）是一条边，且是 i 到 U 中各顶点“权最小边”


    closededge[i]. lowcost： 用来保存连接 i 到 U 中各顶点“权最小边”的权。


