- pgno: 556
  md: '# 7.3 图的遍历


    # 深度优先遍历(DFS)


    # 方法：


    +   - 首先访问出发点v，并将其标记为已访问过；

    +   - 然后依次从v出发搜索v的每个邻接点w。若w未曾访问过，则以w为新的出发点继续进行深度优先遍历，直至图中所有和源点v有路径相通的顶点(亦称为从源点可达的顶点)均已被访问为止。

    +   - 若此时图中仍有未访问的顶点，则另选一个尚未访问的顶点作为新的源点重复上述过程，直至图中所有顶点均已被访问为止。'
  merge: -1
  img_proc: true
