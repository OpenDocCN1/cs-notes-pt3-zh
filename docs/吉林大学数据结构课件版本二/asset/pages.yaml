- pgno: 513
  md: '# 7.1图的定义和术语


    顶点的度

    在无向图中：

    顶点V的度 = 与V相关联的边的数目TD(V)

    在有向图中：

    顶点V的出度=以V为起点有向边数OD(V)

    顶点V的入度=以V为终点有向边数ID(V)

    顶点V的度= V的出度+V的入度

    设图G的顶点数为n，边或弧数为e

    图的所有顶点的度数和 = 2*e，即：

    $e = \frac{1}{2} \sum_{i=1}^{n} TD(Vi)$


    ![](img/df7a4356658bc366c52d5e361f054231_513_0.png)


    ![](img/df7a4356658bc366c52d5e361f054231_513_1.png)'
  merge: -1
  img_proc: true
