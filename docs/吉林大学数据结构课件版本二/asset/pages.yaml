- pgno: 415
  md: "# 二叉树的中序遍历（L T R）的非递归算法\n\n```\nStatus InorderTraverse(BiTree T)\n{\n    InitStack(S);\n\
    \    Push(S,T);\n    While(!StackEmpty(S))\n    {\n        While(GetTop(S,p)&&p)Push(S,p->lchild);\n\
    \        Pop(S,p);\n        if(!StackEmpty(S))\n        {\n            Pop(S,p);\n\
    \            if(! Visit(p->data))  return ERROR;\n            Push(S,p->rchild);\n\
    \        }\n    }\n}\n```"
