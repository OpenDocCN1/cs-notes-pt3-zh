- pgno: 761
  md: '# 3. 直接选择排序的效率分析


    +   - 在直接选择排序中，共需要进行n-1次选择和交换，每次选择需要进行n-i次比较（1≤i≤n-1），而每次交换最多需3次移动，因此

    +   - 总的比较次数C=∑_{i=1}^{n-1}(n-i)=(n²-n)/2,

    +   - 总的移动次数M=∑_{i=1}^{n-1}3=3(n-1)。由此可知，直接选择

    +   - 排序的时间复杂度为O(n²)数量级,

    +   - 直接选择排序是一种不稳定的排序方法。'
  merge: -1
  img_proc: true
