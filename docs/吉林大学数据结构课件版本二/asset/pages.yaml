- pgno: 204
  md: "# 算法如下：\n\n```\nint match(char *exp)\n{\n\t top=0; //注意：与前面top=-1相比较\n\t i=0;\n\
    \tnomatch=0;\n\tWhile(exp[i]!='\\0'&&nomatch===0){\n\t\tswitch(exp[i]){\n\t\t\
    case '(': st[top]=exp[i]; top++; break;\n\t\tcase '[': st[top]=exp[i]; top++;\
    \ break;\n\t\tcase '{': st[top]=exp[i]; top++; break;\n\t\tcase ')': if (st[top]==='(')\
    \ top--;\n\t\telse nomatch=1; break;\n\t\tcase ']': if (st[top]==='[') top--;\n\
    \t\telse nomatch=1; break;\n\t\tcase '}': if (st[top]==='{' ) top--;\n\t\telse\
    \ nomatch=1; break;\n\t\t}\n\t i++;\n\t}\n\tif (nomatch==0&&top==0) return 1;\n\
    \telse return 0;\n}\n```"
