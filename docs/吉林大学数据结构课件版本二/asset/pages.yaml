  md: '# 10.4.3 堆排序


    # 1．堆的定义


    若有 n 个元素的排序码 k₁，k₂，k₃，…，kₙ，当满足如下条件：


    (1)  { kᵢ ≤ k₂ᵢ\n     kᵢ ≤ k₂ᵢ₊₁ }  或  (2)  { kᵢ ≥ k₂ᵢ\n                                      kᵢ
    ≥ k₂ᵢ₊₁ }


    其中 i=1,2,…,⌊n/2⌋ 则称此 n 个元素的排序码 k₁，k₂，k₃，…，kₙ 为一个堆。'
