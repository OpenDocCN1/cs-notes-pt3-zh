    | 活动 | e | l | l-e |

    |---|---|---|---|

    | a1 | 0 | 0 | 0 ✓ |

    | a2 | 0 | 2 | 2 |

    | a3 | 0 | 3 | 3 |

    | a4 | 6 | 6 | 0 ✓ |

    | a5 | 4 | 6 | 2 |

    | a6 | 5 | 8 | 3 |

    | a7 | 7 | 7 | 0 ✓ |

    | a8 | 7 | 7 | 0 ✓ |

    | a9 | 7 | 10 | 3 |

    | a10 | 16 | 16 | 0 ✓ |

    | a11 | 14 | 14 | 0 ✓ |'
  merge: -1
  img_proc: true
- pgno: 634
  md: '# 求关键路径的算法


    +   - 输入e条弧<j,k>，建立AOE网的存储结构

    +   - 从源点v0出发，令ve[0]=0,按拓扑有序求其余各顶点的最早发生时间ve[i],如果得到的拓扑有序序列中顶点个数小于网中顶点数n，则说明网中存在环，算法终止；否则执行下一步

    +   - 从汇点出发，令vl[n-1]=ve[n-1],按逆拓扑有序求其余各顶点的最迟发生时间vl[i]

    +   - 根据各顶点的ve和vl值，求每条弧s的最早开始时间e(s)和最迟开始时间l(s).若满足e(s)=l(s),则为关键路径'
  merge: -1
  img_proc: true
- pgno: 635
  md: "# 算法\n\n```\nstatus topologicalorder(algraph G, stack &T)\n{\n    //求各顶点事件的最早发生时间ve\n\
    \    findindegree(G, indegree);          //T为拓扑序列顶点栈，S为入度零顶点栈\n    initsack(T);\
    \    count=0;    ve[0...G.vexnum-1]=0\n    initsack(S);\n    for(i=0; i<G.vexnum;\
    \ ++i)\n        if(!indegree[i]) push(s,i);     //入度为零入栈\n    while(!stackempty(s)){\n\
    \        pop(s,j);   push(T,j); count++;\n        for(p=G.vertices[i].firstarc;\
    \ p; p=p->next)\n            k=p->adjvex;\n            if(!--indegree[k]) push(s,k);\n\
    \            if( ve[j]+*(p->info)>ve[k])  ve[k]= ve[j]+*(p->info);\n    }\n  \
    \  if(count<G.vexnum) return ERROR;\n    else return OK;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 636
  md: "# 算法\n\n# status Criticalpath(algraph G)\n\n```\n{\nif(!topologicalorder(G,T))\
    \ return ERROR\nvL[0...G.vexnum-1]= ve[G.vexnum-1]  //初始化顶点事件的最迟发生时间\nwhile(!stackemptyv(T))\
    \  //按拓扑逆序求各顶点的vl值\nfor( pop(T,J), p=G.vertices[i].firstarc ; p; p=p->next)\n\
    {\n k=p->adjvex; dut=*(p->info)\n if(vl[k]-dut < vl[J]) vl[J]= vl[k]-dut ;\n}\n\
    for(j=0; j<G.vexnum; ++j)  //求ee,el和关键路径\nfor(p=G.vertices[j].firstarc; p; p=p->next)\n\
    { k=p->adjvex; dut=*(p->info);\n ee=ve[j]; el=vl[k]-dut;\n tag=(ee==el)?'*':'\
    \ ';\n printf(j,k,dut,ee,el,tag); //输出关键活动\n}\n}\n```"
  merge: -1
  img_proc: true
