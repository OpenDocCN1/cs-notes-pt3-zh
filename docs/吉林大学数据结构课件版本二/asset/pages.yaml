  md: '# 5.4 广义表的定义


    例如


    +   - **A=( )**; //A是一个空表

    +   - **B=(e)**; //表B有一个原子

    +   - **C=(a,(b,c,d))**; //两个元素为原子a和子表(b,c,d)

    +   - **D=(A,B,C)**; //有三个元素均为列表

    +   - **E=(a,E)**; //递归的列表,它的长度为2, E相当于一个无限的广义表 E=(a,(a,(a,(a,...))))'
