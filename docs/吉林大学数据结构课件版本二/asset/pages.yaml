- pgno: 704
  md: '# 9.3 哈希表


    # 哈希函数的构造方法


    # 直接定址法


    +   - 构造：取关键字或关键字的某个线性函数作哈希地址，即 H(key)=key 或 H(key)=a·key+b

    +   - 特点

    +     - 直接定址法所得地址集合与关键字集合大小相等，不会发生冲突

    +     - 实际中能用这种哈希函数的情况很少


    # 数字分析法


    +   - 构造：对关键字进行分析，取关键字的若干位或其组合作哈希地址

    +   - 适于关键字位数比哈希地址位数大，且可能出现的关键字事先知道的情况'
  merge: -1
  img_proc: true
