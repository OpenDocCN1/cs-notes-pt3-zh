- pgno: 673
  md: "# 二叉排序树的插入算法\n\n```\nStatus Insert BST(BiTree &T, ElemType e )\n{\n    if (!SearchBST\
    \ ( T, e.key, NULL, p ))\n    {\n        s = new BiTNode;\n        s->data = e;\n\
    \        s->lchild = s->rchild = NULL;\n        if ( !p ) T = s;\n        else\
    \ if (T(e.key, p->data.key))\n            p->lchild = s;\n        else p->rchild\
    \ = s;\n        return TRUE;\n    }\n    else return FALSE;\n}\n```\n\n// 为新结点分配空间\n\
    \n// 插入 s 为新的根结点\n\n// 插入 s 为 *p 的左孩子\n\n// 插入 s 为 *p 的右孩子\n\n// 插入成功\n\n// Insert\
