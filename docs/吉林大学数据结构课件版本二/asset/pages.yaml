- pgno: 523
  md: '# 生成树


    包含连通图G 所有顶点的的极小连通子图称为G 的生成树


    极小连通子图意思是：该子图是G 的连通子图，在该子图中删除任何一条边，子图不再连通，


    若T是G 的生成树当且仅当T满足如下条件


    +   - T是G 的连通子图

    +   - T包含G 的所有顶点

    +   - T中无回路


