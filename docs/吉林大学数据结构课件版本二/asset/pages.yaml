- pgno: 388
  md: '# 二叉树的性质


    性质4 具有 n (n ≥ 0) 个结点的完全二叉树的深度为⌊log₂(n)⌋+1


    证明：


    设完全二叉树的深度为 h，则根据性质2和完全二叉树的定义有


    2^{h-1} - 1 < n ≤ 2^{h} - 1 或 2^{h-1} ≤ n < 2^{h}


    取对数 h−1 < log₂ n ≤ h，又 h 是整数，


    因此有 h = ⌊log₂(n)⌋+1'
