    应注意的是，命题的谓词形式中的个体出现的次序影响命题的真值，不是随意变动，否则真值会有变化。如上述例子中，P(b,a,c)是假。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 2.原子谓词公式


    原子命题的谓词形式还可以进一步加以抽象，比如在谓词右侧的圆括号内的n个个体常元被替换成个体变元，如x₁,x₂,…,xₙ，这样便得到了一种关于命题结构的新表达形式，称之为n元原子谓词。


    定义2.1.3 由一个谓词(如P)和n个个体变元(如x₁，x₂，…，xₙ)组成的P(x₁，x₂，…，xₙ)，称它为n元原子谓词或n元命题函数，简称n元谓词。而个体变元的论述范围，称为个体域或论域。'
  merge: -1
  img_proc: true
- pgno: 123
  md: '当n=1时，称一元谓词；当n=2时，称为二元谓词，.... 特别地，当n=0，称为零元谓词。


    零元谓词是命题，这样命题与谓词就得到了统一。


    一。'
