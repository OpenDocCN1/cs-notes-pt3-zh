  md: '# 1.6 公式标准型——范式


    # 1. 简单合取式与简单析取式


    定义1.6.1 在一公式中，仅由命题变元及其否定构成的合取式，称该公式为简单合取式，其中每个命题变元或其否定，称为合取项。


    定义1.6.2 在一公式中，仅由命题变元及其否定构成的析取式，称该公式为简单析取式，其中每个命题变元或其否定，称为析取项。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '例如，公式P，|Q，P∧Q和|P∧Q∧P等都是简单合取式，而P，Q和|P为相应的简单合取式的合取项；公式P，|Q，P∨Q，|P∨Q∨P等都是简单析取式，而P，Q和|P为相应简单析取式的析取项。


    注意，一个命题变元或其否定既可以是简单合取式，也可是简单析取式，如例中P，|Q等。'
  merge: -1
