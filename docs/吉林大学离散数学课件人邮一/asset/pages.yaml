- pgno: 141
  md: '# 例2.2.2 将命题“没有最大的自然数”符号化。


    解 命题中“没有最大的”显然是对所有的自然数而言，所以可理解为“对所有的x，如果x是自然数，则一定还有比x大的自然数”，再具体点，即“对所有的x如果x是自然数，则一定存在y，y也是自然数，并且y比x大”。令
    N(x):x是自然数，G(x,y):x大于y，则原命题表示为：(∀x)(N(x)→(∃y)(N(y)∧G(y,x)))。'
