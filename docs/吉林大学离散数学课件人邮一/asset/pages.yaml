- pgno: 139
  md: '# 2. 谓词逻辑的翻译


    把一个文字叙述的命题，用谓词公式表示出来，称为谓词逻辑的翻译或符号化；反之亦然。一般来说，符号化的步骤如下：


    +   ①正确理解给定命题。必要时把命题改叙，使其中每个原子命题、原子命题之间的关系能明显表达出来。'
