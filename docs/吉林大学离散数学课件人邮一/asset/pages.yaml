  md: '# 2.6 谓词公式范式


    # 1. 前束范式


    定义2.9.1 一个合式公式称为前束范式，如果它有如下形式：


    (Q₁x₁)(Q₂x₂)...(Qₖxₖ)B


    其中 Qᵢ (1≤i≤k) 为 ∀ 或 ∃，B 为不含有量词的公式。称 Q₁x₁Q₂x₂...Qₖxₖ 为公式的首标。


    特别地，若 A 中无量词，则 A 也看作是前束范式。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '可见，前束范式的特点是，所有量词均非否定地出现在公式最前面，且它的辖域一直延伸到公式之末。


    例如，(∀x)(∃y)(∀→z)(P(x,y)→Q(y,z)),R(x,y)等都是前束范式，而(∀x)P(x)∧(∃y)Q(y)，(∀x)(P(x)→(∃y)Q(x,y))不是前束范式。


    # 定理2.6.1（前束范式存在定理）Lp中任意公式A都有与之等价的前束范式。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 2. 斯柯林范式


    前束范式的的优点是全部量词集中在公式前面，其缺点是各量词的排列无一定规则，这样当把一个公式化归为前束范式时，其表达形式会显现多种情形，不便应用。1920年斯柯林(Skolem)提出对前束范式首标中量词出现的次序给出规定：每个存在量词均在全称量词之前。按此规定得到的范式形式，称为斯柯林范式。显然，任一公式均可化为斯柯林范式。它的优点是：全公式按顺序可分为三部分，公式的所有存在量词、所有全称量词和辖域。这给Lp的研究提供了一定的方便。'
  merge: -1
  img_proc: true
