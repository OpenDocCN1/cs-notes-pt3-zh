- pgno: 13
  md: '定义1.1.4 设P和Q为两个命题，由命题联结词→把P和Q连接成P→Q，称P→Q为命题P和Q的条件式复合命题，简称条件命题。P→Q读做“P条件Q”或者“若P则Q”。称→为条件联结词。

    当P的真值为真而Q的真值为假时，命题P→Q的真值为假；否则，P→Q的真值为真。条件联结词→的定义由表1.1.4表示之。'
  merge: -1
  img_proc: true
