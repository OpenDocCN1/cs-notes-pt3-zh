  md: '# 定义1.1.3


    设P和Q为两个命题，由命题联结词∨把P和Q连接成P∨Q，称P∨Q为命题P和Q的析取式复合命题，P∨Q读做“P或Q”。称∨为析取联结词。


    当且仅当P和Q的真值同为假，P∨Q的真值为假；否则，P∨Q的真值为真。析取联结词∨的定义由表1.1.3表示之。'
  merge: -1
