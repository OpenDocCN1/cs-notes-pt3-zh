  md: 上面讲了约束变元改名规则和自由变元代入规则。有时在一公式 A(x) 中，也会用项替代个体变元，那么如何做才能不引起量词和辖域间关系发生变化？或者说，替代后结果与替代前在直觉解释上没有区别这就需要引入项对
