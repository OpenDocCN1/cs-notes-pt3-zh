- pgno: 101
  md: '# 2. 推理规则


    在数理逻辑中，从前提推导出结论，要依据事先提供的公认的推理规则，它们是：


    +   ① P规则(也称前提引入规则): 在推导过程中，前提可视需要引入使用。

    +   ② T规则(也称结论引入规则): 在推导过程中，前面已导出的有效结论都可作为后续推导的前提引入。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '此外，在从前提推出的结论为条件式时，还需要下面规则：


    ③ C P规则(也称条件证明引入规则)：若推出有效结论为条件式 R→C 时，只需将其前提 R 加 入到前提中作为附加前提且再去推出后件 C 即可。


    C P规则的正确性可由下面定理得到保证：


    # 定理1.8.2 若 H₁，H₂，...，Hₙ，R⇒C，则 H₁，H₂，...，Hₙ⇒R→C。'
  merge: -1
  img_proc: true
