- pgno: 20
  md: '# 1.2 命题变元和合式公式




    在命题逻辑中，命题又有命题常元和命题变元之分。一个确定的具体的命题，称为命题常元；一个不确定的泛指的任意命题，称为命题变元。显然，命题变元不是命题，只有用一个特定的命题取代才能确定它的真值：真或假。这时也说对该命题变元指派真值。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '命题常元和命题变元均可用字母P等表示。


    由于在命题逻辑中并不关心具体命题的涵义，只关心其真值，因此，可以形式地定义它们如下：


    定义1.2.1　以真或1、假或0为其变域的变元，称为命题变元；真或1、假或0称为命题常元。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 2. 合式公式


    通常把含有命题变元的断言称为命题公式。但这没能指出命题公式的结构，因为不是所有由命题变元、联结词和括号所组成的字符串都能成为命题公式。为此常使用归纳定义命题公式，以便构成的公式有规则可循。由这种定义产生的公式称为合式公式。


    定义1.2.2 单个命题变元和命题常元称为原子命题公式，简称原子公式。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 定义1.2.3 合式公式是由下列规则生成的公式：


    +   ① 单个原子公式是合式公式。

    +   ② 若 A 是一个合式公式，则 (¬A) 也是一个合式公式。

    +   ③ 若 A、B 是合式公式，则 (A ∧ B)、(A ∨ B)、(A → B) 和 (A ↔ B) 都是合式公式。

    +   ④ 只有有限次使用 ①、② 和 ③ 生成的公式才是合式公式。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '当合式公式比较复杂时，常常使用很多圆括号，为了减少圆括号的使用量，可作以下约定：


    +   ①规定联结词的优先级由高到低的次序为：

    +   ∧、∧、∨、→、↔


    +   ②相同的联结词按从左至右次序计算时，圆括号可省略。


    +   ③最外层的圆括号可以省略。


    为了方便计，合式公式也简称公式。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 3. 公式真值表


    定义1.2.4 对于公式中命题变元的每一种可能的真值指派，以及由它们确定出的公式真值所列成的表，称为该公式的真值表。


    定义1.2.5 如果*B*是公式*A*中的一部分，且*B*为公式，则称*B*是公式*A*的子公式。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '用归纳法不难证明，对于含有 n 个命题变元的公式，有 2ⁿ 个真值指派，即在该公式的真值表中有 2ⁿ 行。


    为方便构造真值表，

    特约定如下：


    +   ① 命题变元按字典序排列。


    +   ② 对每个指派，以二进制数从小到大或从大到小顺序列出。


    +   ③ 若公式较复杂，可先列出各子公式的真值(若有括号，则应从里层向外层展开)，最后列出所求公式的真值。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 4. 命题的符号化


    把一个用文字叙述的命题相应地写成由命题标识符、联结词和圆括号表示的合式公式，称为命题的符号化。符号化应该注意下列事项：


    +   ① 确定给定句子是否为命题。

    +   ② 句子中连词是否为命题联结词。

    +   ③ 要正确地表示原子命题和适当选择命题联结词。'
  merge: -1
  img_proc: true
- pgno: 28
  md: 命题符号化是很重要的，一定要掌握好，在命题推理中常常最先遇到的就是符号化一个问题，解决不好，等于说推理的首要前提没有了。
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.3 公式分类与等价公式


    # 1. 公式分类


    定义1.3.1 设 A 为任意公式，则


    +   ① 对应每一个指派，公式 A 均相应确定真值为真，称 A 为重言式，或永真式。


    +   ② 对应每一个指派，公式 A 均相应确定真值为假，称 A 为矛盾式，或永假式。


    +   ③ 至少存在一个指派，公式 A 相应确定真值为真，称 A 为可满足式。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '由定义可知，重言式必是可满足式，反之一

    般不真。


    重点将研究重言式，它最有用，因为它有以

    下特点：


    +   ① 重言式的否定是矛盾式，矛盾式的否定是重言式，这样只研究其一就可以了。


    +   ② 两重言式的合取式、析取式、条件式和双条件式等都仍是重言式。于是，由简单的重言式可构造出复杂的重言式。


    +   ③ 由重言式使用公认的规则可以产生许多有用等价式和蕴涵式。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '判定给定公式是否为永真式、永假式或可满足式的问题，称为给定公式的判定问题。


    在Ls中，由于任何一个命题公式的指派数目总是有限的，所以Ls的判定问题是可解的。其判定方法有真值表法和公式推演法。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 2. 等价公式


    定义1.3.2　设A和B是两个命题公式，如果A、B在其任意指派下，其真值都是相同的，则称A和B是等价的，或逻辑相等，记作A⇔B，读作A等价B，称A⇔B为等价式。


    显然，若公式A和B的真值表是相同的，则A和B等价。因此，验证两公式是否等价，只需做出它们的真值表即可。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '在这里，请读者注意↔和⇔的区别与联系。


    区别：↔是逻辑联结词，属于目标语言中的符号，它出现在命题公式中；⇔不是逻辑联结词，属于元语言中的符号，表示两个命题公式的一种关系，不属于这两个公式的任何一个公式中的符号。


    联系：可用下面定理表明之。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 定理1.3.1　$A \Leftrightarrow B$当且仅当$A \Leftrightarrow B$是永真式。


    有时也称$A \Leftrightarrow B$是永真双条件式。


    等价式有下列性质：


    +   ① 自反性，即对任意公式$A$，有$A \Leftrightarrow A$。


    +   ② 对称性，即对任意公式$A$和$B$，若$A \Leftrightarrow B$，则$B \Leftrightarrow A$。


    +   ③ 传递性，即对任意公式$A$、$B$和$C$，若$A \Leftrightarrow B$、$B \Leftrightarrow C$，则$A \Leftrightarrow
    C$。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 3. 基本等价式—命题定律


    在判定公式间是否等价，有一些简单而又经常使用的等价式，称为基本等价式或称命题定律。牢固地记住它并能熟练运用，是学好数理逻辑的关键之一，读者应该注意到这一点。现将这些命题定律列出如下：


    +   (1) 双否定： ¬¬A ⇔ A。


    +   (2) 交换律： A ∧ B ⇔ B ∧ A， A ∨ B ⇔ B ∨ A， A ↔ B ⇔ B ↔ A。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '(3) 结合律：

    \[(A\land B)\land C\Leftrightarrow A\land(B\land C)，\]

    \[(A\lor B)\lor C\Leftrightarrow A\lor(B\lor C)，\]

    \[(A\leftrightarrow B)\leftrightarrow C\Leftrightarrow A\leftrightarrow(B\leftrightarrow
    C)。\]


    (4) 分配律：

    \[A\land(B\lor C)\Leftrightarrow(A\land B)\lor(A\land C)，\]

    \[A\lor(B\land C)\Leftrightarrow(A\lor B)\land(A\lor C)。\]


    (5) 德·摩根律：

    \[\lnot(A\land B)\Leftrightarrow\lnot A\lor\lnot B，\]

    \[\lnot(A\lor B)\Leftrightarrow\lnot A\land\lnot B。\]


    (6) 等幂律：\[A\land A\Leftrightarrow A，\quad A\lor A\Leftrightarrow A。\]'
  merge: -1
  img_proc: true
- pgno: 37
  md: '(7) 同一律：A∧T⇔A， A∨F⇔A。


    (8) 零 律：A∧F⇔F， A∨T⇔T。


    (9) 吸收律：A∧(A∨B)⇔A， A∨(A∧B)⇔A。


    (10) 互补律：A∧¬A⇔F，（矛盾律）


    A∨¬A⇔T。（排中律）


    (11) 条件式转化律：A→B⇔¬A∨B，


    A→B⇔¬B→¬A。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# （12）双条件式转化律：


    A↔B ⇔ (A→B) ∧ (B→A) ⇔ (A∧B) ∨ (¬A∧¬B)


    ¬A↔B ⇔ ¬(A↔B)


    # （13）输出律：（A∧B）→C ⇔ A→（B→C）。


    # （14）归谬律：（A→B）∧（A→¬B）⇔ ¬A。


    上面这些定律，即是通常所说的布尔代数或逻辑代数的重要组成部分，它们的正确性利用真值表是不难给出证明的。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 4. 代入规则和替换规则


    在定义合成公式时，已看到了逻辑联结词能够从已知公式形成新的公式，从这个意义上可把逻辑联结词看成运算。除逻辑联结词外，还要介绍“代入”和“替换”，它们也有从已知公式得到新的公式的作用，因此有人也将它们看成运算，这不无道理，而且在今后讨论中，它的作用也是不容忽视的。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# (1)代入规则


    定理1.3.2 在一个永真式A中，任何一个原子命题变元R出现的每一处，用另一个公式代入，所得公式B仍是永真式。本定理称为代入规则。


    # (2)替换规则


    定理1.3.3 设A₁是合式公式A的子公式，若A₁⇔B₁，并且将A中的A₁用B₁替换得到公式B，则A⇔B。称该定理为替换规则。


    满足定理1.3.3条件的替换，称为等价替换。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '代入和替换有两点区别：


    +   ① 代入是对原子命题变元而言的，而替换可对命题公式实行。

    +   ② 代入必须处处代入，替换则可部分替换，亦可全部替换。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 1.4 对偶式与蕴涵式


    # 1. 对偶式


    在上节介绍的命题定律中，多数是成对出现的，这些成对出现的定律就是对偶性质的反映，即对偶式。利用对偶式的命题定律，可以扩大等价式的个数，也可减少证明的次数。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 定义1.4.1 在给定的仅使用联结词¬、∧和∨


    的命题公式A中，若把∧和∨互换，F和T互换而得到一个命题公式A*，则称A*为A的对偶式。


    显然，A也是A*的对偶式。可见A与A*互为对偶式。'
  merge: -1
