- pgno: 115
  md: 然而，(P∧Q)→R并不是永真式，故上述推理形式又是错误的。一个推理，得出矛盾的结论，问题在哪里呢？问题就在于这类推理中，各命题之间的逻辑关系不是体现在原子命题之间，而是体现在构成原子命题的内部成分之间，即体现在命题结构的更深层次上。对此，Ls是无能为力的。所以，在研究某些推理时，有必要对原子命题作进一步分析，分析出其中的个体词，谓词和量词，研究它们的形式结构的逻辑关系、正确的推理形式和规则，这些正是谓词逻辑（简称为Lp）的基本内容。
