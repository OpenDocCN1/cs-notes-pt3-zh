- pgno: 49
  md: '# 3. 蕴涵式证明方法


    除真值表外，还有两种方法：


    # ① 前件真导后件真方法


    设公式的前件为真，若能推导出后件也为真，则条件式是永真式，故蕴涵式成立。


    因为欲证 A→B，即证 A→B 是永真式。对于 A→B，除在 A 取真和 B 取假时，A→B 为假外，余下 A→B 皆为真。所以，若 A→B 的前件 A 为真，由此可推出
    B 亦为真，则 A→B 是永真式，即 A⇒B。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# ② 后件假导前件假方法


    设条件式后件为假，若能推导出前件也为假，则条件式是永真式，即蕴涵式成立。


    因为若A→B的后件B取假，由此可推出A取假，即推证了： ¬B⇒¬A。又因A→B⇔¬B→¬A，故A⇒B成立。'
  merge: -1
  img_proc: true
