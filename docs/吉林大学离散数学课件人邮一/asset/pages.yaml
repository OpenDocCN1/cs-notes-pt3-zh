- pgno: 356
  md: '定义6.1.4 设<S, f1, f2, ..., fm>是一代数结构且非空集T⊆S在运算f1, f2, ..., fm作用下是封闭的, 且T含有与S中相同的特异元,
    则称<T, f1, f2, ..., fm>为代数结构<S, f1, f2, ..., fm>的子代数。记为<T, f1, ...>⊆<S, f1, ...>。


    在结束本节时，声明记号<S,f1,f2,⋯,fm>即为一代数结构，除特别指明外，运算符f1f2⋯fm均为二元运算。根据需要对S及f1f2⋯fm可置不同的集合符和运算符。'
  merge: -1
