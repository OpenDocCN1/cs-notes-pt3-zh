- pgno: 91
  md: '主合取范式的求法也有两种，类似于主析取范式的求法。


    # 3.主析取范式与主合取范式之间的关系


    由于主范式是由小项或大项构成，从小项和大项的定义，可知两者有下列关系：


    m_i ↔ M_i      M_i ↔ m_i


    因此，主析取范式和主合取范式有着“互补”关系，即是由给定公式的主析取范式可以求出其主合取范式。'
  merge: -1
  img_proc: true
- pgno: 92
  md: 设命题公式A中含有n个命题变元，且A的主析取范式中含有k个小项 m_{j1}, m_{j2}, ..., m_{j_{2^n - k}}，则¬A的主析取范式中必含有2^n
    - k个小项，不妨含为 m_{j1}, m_{j2}, ..., m_{j_{2^n - k}}，即¬A ⇔ m_{j1} ∨ m_{j2} ∨ ... ∨
    m_{j_{2^n - k}}。于是 A ⇔ ¬¬A ⇔ ¬( m_{j1} ∨ m_{j2} ∨ ... ∨ m_{j_{2^n - k}} ) ⇔ ¬m_{j1}
    ∧ ¬m_{j2} ∧ ... ∧ ¬m_{j_{2^n - k}} ⇔ M_{j1} ∧ M_{j2} ∧ ... ∧ M_{j_{2^n - k}}
  merge: -1
  img_proc: true
- pgno: 93
  md: '由此可知，从A的主析取范式求其主合取范式的步骤为：


    +   - (a) 求出A的主析取范式中设有包含的小项。

    +   - (b) 求出与(a)中小项的下标相同的大项。

    +   - (c) 做(b)中大项之合取，即为A的主合取范式。


    例如，(P→Q)∧Q⇔m₁∨m₃，则(P→Q)∧Q⇔M₀∧M₂。'
  merge: -1
