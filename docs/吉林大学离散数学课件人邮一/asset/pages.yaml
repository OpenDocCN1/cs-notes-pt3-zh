    (c)若A不与T或者F等价，且又不含2^n个小项或者大项，则A为可满足的。


    # （2）证明等价式成立


    由于任一公式的主范式是唯一的，所以将给定的公式求出其主范式，若主范式相同，则给定两公式是等价的。'
