- pgno: 142
  md: '# 例2.2.3 将语句“今天有雨雪，有些人会跌跤”符号化。


    解 本语句可理解为“若今天下雨又下雪，则存在x，x是人且x会跌跤”。令R:今天下雨，S:今天下雪，M(x):x是人，F(x):x会跌跤，则本语句可表示为：R∧S→(∃x)(M(x)∧F(x))。


    由于人们对命题的文字叙述含意理解的不同，强调的重点不同，会影响到命题符号化的形式不同。'
