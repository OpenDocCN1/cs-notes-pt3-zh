    定义5.1.1 设A和B是任意两个集合，且F是从A到B的关系，若对每一个x∈A，都存在唯一的y∈B，使<x,y>∈F，则称F为从A到B的函数，并记作F:A→B。A称为函数F的定义域，即D(F)=A，B称为函数F的陪域，R(F)称为函数F的值域，且R(F)⊆B。有时也用F(A)表示函数F的值域，即'
