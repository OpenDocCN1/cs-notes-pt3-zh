  md: '# 1.5 联结词的扩充与功能完全组


    # 1. 联结词的扩充


    定义1.5.1 设P和Q是任两个原子命题，

    ①由合取非联结词↑和P，Q连接成P↑Q，称它为P和Q的合取非式复合命题，读作“P合取非Q”。P↑Q的真值由命题P和Q的真值确定：当且仅当P和Q均为T时，P↑Q为F，否则P↑Q为T。

    “合取非”又常称为“与非”。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '②由析取非联结词↓和P，Q连接成P↓Q，称它为P和Q的析取非式复合命题，读作“P析取非Q”。P↓Q的真值由P和Q的真值确定：当且仅当P和Q均为F时，P↓Q为T，否则P↓Q为F。“析取非”又常称为“或非”。


    ③由条件非联结词↔和P，Q连接成P↔Q，称它为P和Q的条件非式复合命题，读作“P条件非Q”。P↔Q的真值由P和Q的真值确定：当且仅当P为T而Q为F时，P↔Q为T；否则P↔Q为F。'
