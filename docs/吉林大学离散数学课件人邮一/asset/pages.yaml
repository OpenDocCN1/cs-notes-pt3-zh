  md: 在一公式中，一个n元(n≥0)谓词变元 P(x₁,x₂,⋯,xₙ)可以代至少有n个自由变元的公式 B(y₁,y₂,⋯,yₙ,yₙ₊₁,yₙ₊₂,⋯,yₙ₊ᵣ)，其中r≥0，
    y₁,y₂,⋯,yₙ是分别对应于x₁,x₂,⋯,xₙ的任意选定的 n个自由变元，且对P出现进行处处代入，B中的 r个自由变元不允许在原公式中以约束出现， P中的个体变元也不允许在B中以约束出现。
