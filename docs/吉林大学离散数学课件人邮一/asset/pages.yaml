- pgno: 134
  md: '# 2.2 谓词公式与翻译


    # 1. 谓词公式


    为了方便处理数学和计算机科学的逻辑问题及谓词表示的直观清晰性，将引进项的概念。


    定义2.2.1 项由下列规则形成：


    +   ① 个体常元和个体变元是项；

    +   ② 若f是n元函数，且t1, t2, ..., tn是项，则f(t1, t2, ..., tn)是项；

    +   ③ 所有项都由①和②生成。'
  merge: -1
  img_proc: true
- pgno: 135
  md: 有了项的定义，函数的概念就可用来表示个体常元和个体变元。例如，令f(x,y)表示x+y，谓词N(x)表示x是自然数，那么f(2,3)表示个体自然数5，而N(f(2,3))表示5是自然数。这里函数就是广义而言的，例如P(x):x是教授，f(x):x的父亲，c:张强，那么P(f(c))便是表示“张强的父亲是教授”这一命题。
  merge: -1
  img_proc: true
- pgno: 136
  md: 函数的 使用给谓词表示带来很大方便。例如，用谓词表示命题：对任意整数x，x²-1=(x+1)(x-1)是恒等式。令 I(x):x是整数，f(x)=x²-1，g(x)=(x+1)(x-1)，E(x,y):x=y，则该命题可表示成：(∀x)(I(x)→E(f(x),g(x)))。
  merge: -1
  img_proc: true
