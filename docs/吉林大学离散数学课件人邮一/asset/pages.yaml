- pgno: 3
  md: '# 1.1 命题与联结词


    # 1. 命题的概念


    所谓命题，是指具有非真必假的陈述句。而疑问句、祈使句和感叹句等因都不能判断其真假，故都不是命题。命题仅有两种可能的真值—真和假，且二者只能居其一。真用1或T表示，假用0或F表示。由于命题只有两种真值，所以称这种逻辑为二值逻辑。命题的真值是具有客观性质的，而不是由人的主观决定的。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '如果一陈述句再也不能分解成更为简单的语句，由它构成的命题称为原子命题。原子命题是命题逻辑的基本单位。


    命题分为两类，第一类是原子命题，原子命题用大写英文字母P，Q，R...及其带下标的P_i，Q_i，R_i，...表示。


    第二类是复合命题，它由原子命题、命题联结词和圆括号组成。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 2. 命题联结词


