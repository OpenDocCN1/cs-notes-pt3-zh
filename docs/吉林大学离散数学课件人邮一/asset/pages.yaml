- pgno: 138
  md: '# 定义2.2.3 合式谓词公式当且仅当由下列规则规则形成的符号串


    +   ① 原子公式是合式谓词公式；

    +   ② 若A是合式谓词公式，则(¬A)是合式谓词公式；

    +   ③ 若A, B是合式谓词公式，则(A∧B), (A∨B), (A→B)和(A↔B)都是合式谓词公式；

    +   ④ 若A是合式谓词公式，x是个体变元，则(∀x)A、(∃x)A都是合式谓词公式；

    +   ⑤ 仅有有限项次使用①、②、③和④形成的才是合式谓词公式。'
