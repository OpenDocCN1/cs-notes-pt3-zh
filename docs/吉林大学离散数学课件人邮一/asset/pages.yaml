- pgno: 208
  md: '# 1. 并、交和差运算


    定义3.2.1 设A和B是任意两个集合，


    ① A和B的并是集合，记为A∪B，


    A∪B={x|x∈A∨x∈B}


    ② A和B的交是集合，记为A∩B，


    A∩B={x|x∈A∧x∈B}


    ③ A和B的差，或B关于A的相对补是集合，

    记为A-B，


    A-B={x|x∈A∧x∉B}'
  merge: -1
