- pgno: 350
  md: '# 6.1 代数结构的定义与例


    在正式给出代数结构的定义之前，先来说明什么是在一个集合上的运算，因为运算这个概念是代数结构中不可缺少的基本概念。


    **定义6.1.1** 设$S$是个非空集合且函数


    $f\in S^{S^n}$或$f:S^n\to S$，则称$f$为一个$n$元运算。其中$n$是自然数，称为运算的元数或阶。当$n=1$时，称为一元运算；当$n=2$时，称为二元运算，等等。


    ![](img/9930a122759bb1d4caa15448a3a23336_350_0.png)'
  merge: -1
  img_proc: true
- pgno: 351
  md: 注意，*n*元运算是个闭运算，因为经运算后产生的象仍在同一个集合中。封闭性表明了*n*元运算与一般函数的区别之处。此外，有些运算存在么元或零元，它在运算中起着特殊的作用，称它为*S*中的特异元或常数。
  merge: -1
  img_proc: true
- pgno: 352
  md: 运算的例子很多，例如，在数理逻辑中，否定是谓词集合上的一元运算，合取和析取是谓词集合上的二元运算；在集合论中，并与交是集合上的二元运算；在整数算术中，加、减、乘运算是二元运算，而除运算便不是二元运算，因为它不满足封闭性。
  merge: -1
  img_proc: true
- pgno: 353
  md: '在下面讲座的代数结构中，主要限于一元和二元运算，将用’、`或-等符号表示一元运算符；用⊕、⊗、∘、○、∧、∨、∩、∪等表示二元运算符，一元运算符常常习惯于前置、顶置或肩置，如′、、x′；而二元运算符号习惯于前置、中置或后置，如：+xy，x+y，xy+。


    有了集合上运算的概念后，便可定义代数结构了。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '**定义 6.1.2** 设 $S$ 是个非空集合且 $f$ 是 $S$ 上的 $n$ 元运算，其中 $n=1,2,\ldots,m$。由 $S$ 及
    $f_1,f_2,\ldots,f_m$ 组成的结构，称为代数结构，记作 $\langle S,f_1,f_2,\ldots,f_m\rangle$。


    此外，集合 $S$ 的基数即 $S$ 定义代数结构的基数。如果 $S$ 是有限集合，则说代数结构是有限代数结构；否则便说是无穷代数结构。


    有时，要考察两个或多个代数结构，这里就有个是否同类型之说，请看下面定义：'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 定义6.1.3


    设两个代数结构<S, f₁, f₂, …, fₘ>和<T, g₁, g₂, …, gₘ>，如果fᵢ和gᵢ(1≤i≤m)具有相同的元数，则称这两个代数结构是同类型的。


    可见，判定两个代数结构是否同类型，主要是对其运算进行考察。


    此外，有时还需要在代数结构中集合的某个子集上讨论其性质，这就引出子代数结构的概念。'
  merge: -1
