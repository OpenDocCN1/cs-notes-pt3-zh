- pgno: 1
  md: '# 第一章 命题逻辑


    命题逻辑，也称命题演算，记为Ls。它与谓词逻辑构成数理逻辑的基础，而命题逻辑又是谓词逻辑的基础。数理逻辑是用数学方法即通过引入表意符号研究推理的学问。因此，数理逻辑又名为符号逻辑。


    命题逻辑是研究由命题为基本单位构成的前提和结论之间的可推导关系。'
