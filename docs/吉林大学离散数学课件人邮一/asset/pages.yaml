- pgno: 183
  md: '# 3.1 集合论基础


    # 1. 集合与元素


    所谓集合，是指某些可辨别的不同的对象的全体，将用大写字母A，B，X，Y，…表示之。


    组成集合的对象称为集合的元素或成员，将用小写字母a，b，x，y…表示之。a是A的元素或a属于A，记作a∈A；a不属于A或a不是A的元素，记作a∉A，或者¬(a∈A)。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '集合的元素一旦给定，这一集合便完全确立。这一事实被形式地叙述为外延公理。


    外延公理：两集合A和B相等，当且仅当它们有相同的元素。


    若A与B相等，记为A=B；否则，记为A≠B。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 外延公理可形式表为：


    ```

    A=B↔(∀x)(x∈A↔x∈B)

    ```


    或者


    ```

    A=B↔(∀x)(x∈A→x∈B)∧(∀x)(x∈B→x∈A)

    ```


    顺便指出，在应用外延公理证明集合A与B相等时，只需考察：


    对于任意元素x，应有下式


    ```

    x∈B↔x∈B

    ```


    成立即可。这就是说，证明两集合相等时可按此法行事。'
