- pgno: 112
  md: '# ③间接证法


    间接证法即是反证法，它是把结论的否定作为附加前提，与给定前提一起推证，若能引出矛盾，则说明结论是有效的。


    定义1.8.3 设H₁, H₂, ..., Hₙ为公式，如果对任意公式R，有H₁∧H₂∧...∧Hₙ⇒R∧¬R，则称公式H₁, H₂, ..., Hₙ是不相容的；否则称为是相容的。


    显然，由定理1.8.1，

    H₁∧H₂∧...∧Hₙ⇒R∧¬R可记为H₁, H₂, ..., Hₙ⇒R∧¬R'
