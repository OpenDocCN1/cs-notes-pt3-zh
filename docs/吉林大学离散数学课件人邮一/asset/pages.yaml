- pgno: 15
  md: '在条件命题 P→Q 中，命题 P 称为 P→Q 的前件或前提，命题 Q 称为 P→Q 的后件或结论。


    条件命题 P→Q 有多种方式陈述：


    +   - “如果 P，那么 Q”；

    +   - “P 仅当 Q”；

    +   - “Q 每当 P”；

    +   - “P 是 Q 的充分条件”；

    +   - “Q 是 P 的必要条件”

    +   - 等。'
  merge: -1
  img_proc: true
- pgno: 16
  md: 在日常生活中，用条件式表示前提和结论之间的因果或实质关系，如例1.1.4中的①，这种条件式称为形式条件命题。然而在命题逻辑中，一个条件式的前提并不要求与结论有任何关系，这种条件式称为实质条件命题。采用实质条件式作定义，不单是出于“善意推断”，主要是因为前提与结论间有无因果和实质关系难以区分，而且实质条件式已包含了形式条件式，更便于应用。
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 定义1.1.5


