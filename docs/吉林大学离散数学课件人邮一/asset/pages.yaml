  img_proc: true
- pgno: 124
  md: n元谓词不是命题，只有其中的个体变元用特定个体或个体常元替代时，才能成为一个命题。但个体变元在哪些论域取特定的值，对命题的真值极有影响。例如，令S(x)：x是大学生。若x的论域为某大学的计算机系中的全体同学，则S(x)是真的；若x的论域是某中学的全体学生，则S(x)是假的；若x的论域是某剧场中的观众，且观众中有大学生也有非大学生的其它观众，则S(x)是真值是不确定的。
