- pgno: 176
  md: '# (2) 存在量词消去规则(简称EI或ES规则)


    有两种形式：(∃x)A(x)⇒A(c) 其中c为特定个体常元


    (∃x)A(x)⇒A(y)


    成立充分条件是：①c或y不得在前提中或者居先推导公式中出现或自由出现；②若A(x)中有其它自由变元时，不能应用本规则。


    值得注意的是，A(y)只是新引入的暂时假设，它不是对y的一切值都是成立的。y是一个暂时的、表面上的自由变元。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 量词产生规则：


    # （3）存在量词产生规则（简称EG规则）


    有两种形式：\(A(c)\Rightarrow(\exists y)A(y)\)


    其中c为特定个体常元


    \(A(x)\Rightarrow(\exists y)A(y)\)


    成立充分条件：①取代c的个体变元不在A(c)中出现；②A(x)对y是自由的；③若A(x)是推导行中的公式，且x是由使用EI引入的，那么不能用A(x)中除x外的个体变元作约束变元，或者说，y不得为A(x)中的个体变元。'
  merge: -1
  img_proc: true
