- pgno: 143
  md: '# 2.3 约束变元与自由变元


    定义2.3.1 给定一个谓词公式A，其中有一部分公式形如(∀x)B(x)或(∃x)B(x)，则称它为A的x约束部分，称B(x)为相应量词的作用域或辖域。在辖域中，x的所有出现称为约束出现，x称为约束变元；B中不是约束出现的其它个体变元的出现称为自由出现，这些个体变元称自由变元。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '对于给定的谓词公式，能够准确地判定它的辖域、约束变元和自由变元是很重要的。


    通常，一个量词的辖域是某公式A的一部分，称为A的子公式。因此，确定一个量词的辖域即是找出位于该量词之后相邻接的子公式，具体地讲：'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   ①若量词后有括号，则括号内的子公式就是该量词的辖域；

    +   ②若量词后无括号，则与量词邻接的子公式为该量词的辖域。


    判定给定公式A中个体变元是约束变元还是自由变元，关键是要看它在A中是约束出现，还是自由出现。'
  merge: -1
  img_proc: true
- pgno: 146
  md: 今后常用元语言符号A(x)表示x是其中的一个个体变元自由出现的任意公式，如A(x)可为P(x)→Q(x)， P(x)∨(∃y)Q(x,y)等。一旦在A(x)前加上量词(∀x)或(∃x)，即得公式(∀x)A(x),或(∃x)A(x)。这时，x即是约束出现了。类似地，用A(x,y)表示x和y是自由出现的公式。
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 定义2.3.2


    设A为任意一个公式，若A中无自由出现的个体变元，则称A为封闭的合式公式，简称闭式。


    由闭式定义可知，闭式中所有个体变元均为约束出现。例如，(∀x)(P(x)→Q(x))和(∃x)(∀y)(P(x)∨Q(x,y))是闭式，而(∀x)(P(x)→Q(x,y))和(∃y)(∀z)L(x,y,z)不是闭式。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '从下面讨论可以看出，在一公式中，有的个体变元既可以是约束出现，又可以是自由出现，这就容易产生混淆。为了避免混淆，采用下面两个规则：

    ①约束变元改名规则，将量词辖域中某个约束出现的个体变元及相应指导变元，改成本辖域中未曾出现过的个体变元，其余不变。

    ②自由变元代入规则，对某自由出现的个体变元可用个体常元或用与原子公式中所有个体变元不同的个体变元去代入，且处处代入。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '改名规则与代入规则的共同点都是不能改变约束关系， 而不同点是：


    +   ① 施行的对象不同。改名是对约束变元施行，代入是对自由变元施行。

    +   ② 施行的范围不同。改名可以只对公式中一个量词及其辖域内施行，即只对公式的一个子公式施行；而代入必须对整个公式同一个自由变元的所有自由出现同时施行，即必须对整个公式施行。'
  merge: -1
  img_proc: true
- pgno: 150
  md: ③ 施行后的结果不同。改名后，公式含义不变，因为约束变元只改名为另一个个体变元，约束关系不改变。约束变元不能改名为个体常元；代入，不仅可用另一个个体变元进行代入，并且也可用个体常元去代入，从而使公式由具有普遍意义变为仅对该个体常元有意义，即公式的含义改变了。
  merge: -1
  img_proc: true
