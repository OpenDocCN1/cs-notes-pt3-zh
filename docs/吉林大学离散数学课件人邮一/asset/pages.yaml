  md: '# 2.1 个体、谓词和量词


    在Lp中，命题是具有真假意义的陈述句。

    从语法上分析，一个陈述句由主语和谓语两部分组成。在Lp中，为揭示命题内部结构及其不同命题的内部结构关系，就按照这两部分对命题进行分析，并且把主语称为个体或客体，把谓语称为谓词。'
