- pgno: 153
  md: '# 2.4 公式解释与类型


    # 1. 公式解释


    一般情况下，Lp中的公式含有：个体常元、个体变元（约束变元或自由变元）、函数变元、为谓词变元等，对各种变元用指定的特殊常元去代替，就构成了一个公式的解释。当然在给定的解释下，可以对多个公式进行解释。下面给出解释的一般定义。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 定义2.4.1 一个解释由下面4部分组成：


    +   1. 非空个体域$D_I$。

    +   2. $D_I$中部分特定元素$a''$，$b''$，……。

    +   3. $D_I$上的特定一些函数$f''$，$g''$，……。

    +   4. $D_I$上特定谓词：$P''$，$Q''$，……。


    在一个具体解释中，个体常元、函数符号、谓词符号的数量一般是有限的，并且其解释一旦确定下来就不再改变，只是个体变元的值在个体域$D_I$内变化，量词符号∀或∃仅作用于$D_I$中的元素。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 2. 公式类型


    定义2.4.2 ① 若一公式在任何解释下都是真的，称该公式为逻辑有效的，或永真的。


    ② 若一公式在任何解释下都是假的，称该公式为矛盾式，或永假式。


    ③ 若一公式至少存在一个解释使其为真，称该公式为可满足式。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '从定义可知，逻辑有效式为可满足式，反之未必成立。


    与命题公式中分类一样，谓词公式也分为三种类型，即逻辑有效式（或重言式）、矛盾式（或永假式）和可满足式。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '由于谓词公式的复杂性和解释的多样性，

    至今还没有一个可行的算法判定任何公式的类型。早在1936年，Churen和Turing各自独立地证明了：对于Lp，其判定问题是不可解的。但是，Lp是个半可判定的，即若Lp中公式是重言式，则存在算法在有限步骤内能够验证它。当然，对于一些较为简单的公式，或某些特殊公式，还是可以判定其类型的。'
  merge: -1
