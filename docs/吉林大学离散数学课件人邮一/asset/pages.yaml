- pgno: 357
  md: '# 6.2 代数结构的基本性质


    所谓代数结构的性质即是结构中任何运算所具有的性质。


    # 1.结合律


    给定<S, ⊙>, 则运算“⊙”满足结合律或“⊙”是可结合的，即(∀x)(∀y)(∀z)(x, y, z∈S→(x⊙y)⊙z=x⊙(y⊙z))。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 2.交换律


    给定<S, ⊙>, 则运算“⊙”满足交换律或“⊙”是可交换的，即(∀x)(∀y)(x, y∈S→x⊙y=y⊙x)。


    可见，如果一代数结构中的运算⊙是可结合和可交换的，那么，在计算 a₁⊙a₂⊙…⊙a₀=aₘ。称aₘ为a的m次幂，m称a的指数。下面给出aₘ的归纳定义：'
  merge: -1
  img_proc: true
- pgno: 359
  md: '设有<S, ⊙>且a∈S，对于m∈I₊，其中I₊表示正整数集合，可有：


    +   (1) a¹=a

    +   (2) a^{m+1}=a^{m}⊙a


    由此利用归纳法不难证明指数定律：


    +   (1) a^{m}⊙a^{n}=a^{m+n}

    +   (2) (a^{m})^{n}=a^{mn}


    这里，m,n∈I₊。


    类似地定义某代数结构中的负幂和给出负指数定律。'
  merge: -1
