- pgno: 152
  md: '# 定义2.3.3


    令A是任意合式公式，x为自由出现。如果x不出现在A中项所含的任意个体变元y的量词(∀y)或(∃y)的辖域内，称项对A中的x是自由的。


    例如，取A为(∀x)B(x,y)→(∃z)C(x,z)，则项f(x,w)对y不是自由的，项g(y,z)对y是自由的，项h(x,z)不是自由的，项y对x是自由的。


    由定义可知，对任何公式A和任意个体变元x，不管x在A中是否自由出现，x对A中的x是自由的。'
