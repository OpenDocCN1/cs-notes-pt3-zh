- pgno: 118
  md: '# 1. 个体、谓词和命题的谓词形式


    # 定义2.1.1 在原子命题中，所描述的对象称为个体；用以描述个体的性质或个体间关系的部分，称为谓词。


    个体，是指可以独立存在的事物，它可以是具体的，也可以是抽象的，如张明，计算机，精神等。表示特定的个体，称为个体常元，以a，b，c...或带下标的a_i，b_i，c_i...表示；表示不确定的个体，称为个体变元，以x，y，z...或x_i，y_i，z_i...表示。'
  merge: -1
  img_proc: true
- pgno: 119
  md: 谓词，当与一个个体相联系时，它刻划了个体性质；当与两个或两个以上个体相联系时，它刻划了个体之间的关系。表示特定谓词，称为谓词常元，表示不确定的谓词，称为谓词变量，都用大写英文字母，如P，Q，R，…，或其带上、下标来表示。在本书中，不对谓词变量作更多地讨论。
  merge: -1
  img_proc: true
- pgno: 120
  md: '对于给定的命题，当用表示其个体的 小写字母和表示其谓词的大写字母来表示时，规定把小写字母写在大写字母右侧的圆括号( )内。 例如，在命题“张明是位大学生”中，“张明”是个体，“是位大学生”是谓词，它刻划了“张明”的性质。设
    S: 是位大学生，c: 张明，则“张明是位大学生”可表示为 S(c)，或者写成 S(c): 张明是位大学生。又如，在命题“武汉位于北京和广州之间”中，武汉、北京和广州是三个个体，而“...位于...和...之间”是谓词，它刻划了武汉、北京和广州之间的关系。设
    P: ...位于...和...之间，a: 武汉，b: 北京，c: 广州，则 P(a, b, c): 武汉位于北京和广州之间。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 定义2.1.2 一个原子命题用一个谓词(如P)


