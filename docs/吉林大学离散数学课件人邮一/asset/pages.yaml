- pgno: 46
  md: '# 2. 蕴涵式


    定义1.4.2 设A和B是两个命题公式，若A→B是永真式，则称A蕴涵B，记作A⇒B，称A⇒B为蕴涵式或永真条件式。


    符号→和⇒的区别与联系类似于↔和⇔的关系。区别：→是逻辑联结词，属于对象语言中的符号，是公式中的符号；而⇒不是联结词，属于元语言中的符号，表示两个公式之间的关系，不是两公式中符号。联系：A⇒B成立，其充要条件A→B是永真式。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 蕴涵式有下列性质：


    +   ① 自反性，即对任意公式A，有A⇒A。


    +   ② 传递性，即对任意公式A、B和C，若A⇒B，B⇒C，则A⇒C。


    +   ③ 对任意公式A、B和C，若A⇒B，A⇒C，则A⇒(B∧C)。


    +   ④ 对任意公式A、B和C，若A⇒C，B⇒C，则A∨B⇒C。'
  merge: -1
  img_proc: true
