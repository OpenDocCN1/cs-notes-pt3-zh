    - 1. 机械特性  尺寸、形状、管脚数 及 排列顺序


    - 2. 电气特性  传输方向 和有效的 电平 范围


    - 3. 功能特性  每根传输线的 功能  { 地址 数据 控制 }


    - 4. 时间特性  信号的 时序 关系


    ## 三、总线的性能指标


    - 1. 总线宽度：数据线的根数

    - 2. 总线带宽：每秒传输的最大字节数（MBps）

    - 3. 时钟同步/异步：同步、不同步

    - 4. 总线复用：地址线与数据线复用

    - 5. 信号线数：地址线、数据线和控制线的总和

    - 6. 总线控制方式：并发、自动、仲裁、逻辑、计数

