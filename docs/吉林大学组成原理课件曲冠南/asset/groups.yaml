    # 六、存储器的校验


    # 1．编码的最小距离


    任意两组合法代码之间二进制位数的最少差异，编码的纠错、检错能力与编码的最小距离有关


    $L-1=D+C\ (D\geq C)$


    $L$ —— 编码的最小距离，$L=3$


    $D$ —— 检测错误的位数，具有一位纠错能力


    $C$ —— 纠正错误的位数


    汉明码是具有一位纠错能力的编码'
