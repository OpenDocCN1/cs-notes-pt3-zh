    # 二、 计算机系统结构中并行性的发展


    # 1. 并行性的概念


    +   - 并行性：计算机系统在同一时刻或者同一时间间隔内进行多种运算或操作。（只要在时间上相互重叠，就存在并行性）

    +     - 同时性：两个或两个以上的事件在同一时刻发生。

    +     - 并发性：两个或两个以上的事件在同一时间间隔内发生。'
  - '[PAGE 40]


    # 2. 从执行程序的角度来看，并行性等级从低到高可分为：


    +   - 指令内部并行：单条指令中各微操作之间的并行。

    +   - 指令级并行：并行执行两条或两条以上的指令。

    +   - 线程级并行：并行执行两个或两个以上的线程。

    +     通常是以一个进程内派生的多个线程为调度单位。

    +   - 任务级或过程级并行：并行执行两个或两个以上的过程或任务（程序段）

    +     以子程序或进程为调度单元。

    +   - 作业或程序级并行：并行执行两个或两个以上的作业或程序。'
  - "[PAGE 41]\n\n# # 3. 提高并行性的技术途径\n\n三种途径：\n\n+   - 时间重叠\n+   \n+   引入时间因素，让多个处理过程在时间上相互错开，轮流重叠地使用同一套硬件设备的各个部分，以加快硬件周转而赢得速度。原则上不重复设置硬件设备。\n\
    \n+   - 资源重复\n+   \n+   引入空间因素，以数量取胜。通过重复设置硬件资源，大幅度地提高计算机系统的性能。\n\n+   - 资源共享\n\
    +   \n+   这是一种软件方法，它使多个任务按一定时间顺序轮流使用同一套硬件设备。如，多道程序。"
  - '[PAGE 42]


    # 4 单机系统中并行性的发展


    (1) 在发展高性能单处理机过程中，起主导作用的是时间重叠原理。


    实现时间重叠的基础：部件功能专用化


    +   - 把一件工作按功能分割为若干相互联系的部分；

    +   - 把每一部分指定给专门的部件完成；

    +   - 按时间重叠原理把各部分的执行过程在时间上重叠起来，使所有部件依次分工完成一组同样的工作。'
  - '[PAGE 43]


    例如： 对于解释指令的5个过程，就分别需要5个专用的部件：取指令部件 (IF)、指令译码部件 (ID)、指令执行部件 (EX)、访问存储器部件 (M) 和写结果部件
    (WB)。

    时间

