  - '[PAGE 302]


    # 小数


    $$[x]_{补}=\begin{cases}x, & 1>x\geq 0\\2+x, & 0>x\geq -1\pmod{2}\end{cases}$$


    $x$ 为真值


    如　　$x=+0.1110$　　　　$x=-0.1100000$


    $$[x]_{补}=0.1110$$


    $$[x]_{补}=2+(-0.1100000)$$

    $$=10.0000000$$

    $$\phantom{=} -\ 0.1100000$$

