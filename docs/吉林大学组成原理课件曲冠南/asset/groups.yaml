    # 二、快速进位链


    # 1. 并行加法器


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_409_0.png)


    S_i = \overline{A_i} \overline{B_i} C_{i-1} + \overline{A_i} B_i \overline{C_{i-1}}
    + A_i \overline{B_i} \overline{C_{i-1}} + A_i B_i C_{i-1}


    C_i = \overline{A_i} B_i C_{i-1} + A_i \overline{B_i} C_{i-1} + A_i B_i \overline{C_{i-1}}
    + A_i B_i C_{i-1} = A_i B_i + (A_i + B_i) C_{i-1}


    d_i = A_i B_i 本地进位 与低位无关

    t_i = A_i + B_i 传送条件


    则 C_i = d_i + t_i C_{i-1}'
