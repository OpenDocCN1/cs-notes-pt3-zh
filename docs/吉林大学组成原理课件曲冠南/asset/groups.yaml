    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_215_0.png)\n\n- **（2）磁盘控制器**：\n   \
    \ - 接收主机发来的命令，转换成磁盘驱动器的控制命令\n    - 实现主机和驱动器之间的数据格式转换\n    - 控制磁盘驱动器读写\n\n    磁盘控制器是主机与磁盘驱动器之间的接口：对主机通过总线；对硬盘（设备）。\n\
    \n- **（3）盘片**：由硬质铝合金材料制成\n\n**2. 软盘片**\n\n由聚酯薄膜制成\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_218_0.png)\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_218_1.png)\n\n- 保护套\n- 主轴孔\n- 实际的软盘片\n\
    - 写保护口\n- 读/写磁头访问槽\n- 衬里/清洁材料\n\n### 五、光盘存储器\n\n**1. 概述**\n\n采用光存储技术，利用激光写入和读出。\n\
    \n- 第一代光存储技术：采用非磁性介质，不可擦写\n- 第二代光存储技术：采用磁性介质，可擦写\n\n**2. 光盘的存储原理**\n\n- 只读型和只写一次型：热作用（物理或化学变化）\n\
    - 可擦写光盘：热磁效应\n\n### 六、循环冗余校验码CRC\n\n1. 模2运算\n2. 编码方法\n    - M(x)：待编码信息构成的多项式\n\
    \    - G(x)：校验码产生多项式，k位余数，G(x)为k+1位\n    - R(x)：余数多项式\n\n    即 M(x) * x^k = Q(x)\
    \ * G(x) + R(x)\n\n    即 M(x) * x^k + R(x) = Q(x) * G(x) 应能整除，若不能整除，则余数指出错误。\n\
    \n    例4.5 已知有效信息为1100，G(x)=1011\n3. 纠错，参照书\n\n## 虚拟存储器工作原理（以页式为例）\n\n- 主存、磁盘存储器、虚拟存储器都划分成固定大小的块（页）。\n\
    \    - 主存 -- 实页\n    - 虚存 -- 虚页\n- 主存地址 A：实页号 + 页内偏移\n- 虚存地址 Av：用户号 + 虚页号 + 页内偏移\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_223_0.png)\n\n图 3.17 页式虚拟存储器工作框图\n\n\
    1. 给出虚地址 Av（用户号U、虚页号P、页内偏移D）。\n2. 内部地址变换，得到实页号，若成功，访问主存。\n3. 若不成功，外部地址变换，查外表，得到磁盘存储器实地址；查内表，若有空页，调入；若无空页，页面替换。\n\
    4. 若外部地址变换不成功，继续访问磁带等。\n\n上图取自郑伟民教材\n\n### 地址映像与转换\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_224_0.png)\n\
    \n地址映像：把虚拟地址空间映像到主存地址空间，具体地说，就是把用户用虚拟地址编写的程序按照某种规则装入到主存储器中，并建立多用户虚拟地址与主存实地址之间的对应关系。\n\
    \n地址变换：程序被装入主存后，实际运行时，多用户虚地址转换成实地址（内部地址变换）或者磁盘存储器地址（外部地址变换）。\n\n### 段式虚拟存储器优点\n\
    \n- 程序模块化性能好：对于大的程序，可以分成若干程序段，赋予不同的名字，由多个程序员并行编写、编译和调试；程序段功能上独立，不互相影响。\n- 便于程序和数据共享：程序段按功能划分，如数组段等。在主存中装入一份，可共享主存起始地址和段长等信息，方便实现共享。\n\
    - 便于动态链接。\n- 便于实现信息保护。\n\n### 段式虚拟存储器缺点\n\n- 地址变换复杂：查2次表，做2次加法\n- 主存利用率低：各段长度不等，程序段连续存放，程序段运行过程中动态变化\n\
    - 对辅存管理困难：磁盘存储器按固定块访问。\n\n### 页式虚拟存储器 - 地址映射\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_228_0.png)\n\
    \n图 3.20 页式虚拟存储器的地址映射\n\n1. 一个用户程序分成若干页。最后一页不满会浪费空间；\n2. 每页对应页表一项。\n3. 页表每项对应主存实页号。\n\
    4. 每一页可以映射到主存储器任意一页位置。\n\n上图取自郑伟民教材\n\n### 页式虚拟存储器 - 地址变换\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_229_0.png)\n\
    \n图 3.21 页式虚拟存储器的地址变换\n\n- 给出虚地址：用户号（程序号）+ 虚页号 + 页内偏移。\n- 查找基址寄存器，找到相应程序的页表基地址。\n\
    - 根据基地址和虚页号，查找页表，得到相应页。主存页号拼接页内偏移 = 主存实地址。\n- 段长和访问方式用于保护程序段。\n\n### 段页式虚拟存储器\
    \ - 地址映射\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_231_0.png)\n\n1. 结合段式和页式的优缺点，虚存空间分段管理，主存空间分页管理。\n\
    2. 每一道程序分成若干段，每段分成若干页，如图例，页大小为4k\n3. 每一道程序一个段表，段表中每项指出该段页数和页表地址\n4. 由页表指向主存页地址。\n\
    \n图 3.22 段页式虚拟存储器的地址映射\n\n### 段页式虚拟存储器 - 地址变换\n\n- 给出虚地址：用户号（程序号）+段号+虚页号+页内偏移\n\
    - 查段表，得到页表地址\n- 查页表，得到实页号。\n- 实页号+页内偏移 = 主存地址。\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_232_0.png)\n\
    \n图 3.23 段页式虚拟存储器的地址变换\n\n上图取自郑伟民教材\n"
