    \n（1）当读操作时，第一个时钟周期接收地址，第二、三个为延时周期，另用4个周期传送一个块。读操作的总线传输速率是多少？\n\n（2）当写操作时，第一个时钟周期接收地址，第二个为延时周期，另用4个周期传送一个块，写操作的总线传输速率是多少？\n\
    \n（3）设在全部的传输中，70%用于读，30%用于写，则该总线在本次传输中平均速率是多少？\n\n## 计算机原理与系统结构\n\n## 第四章 存储器\n\
    \n曲冠南\ngnqu@jlu.edu.cn\n\n- 4.1 概述\n- 4.2 主存储器\n- 4.3 高速缓存存储器\n- 4.4 辅助存储器\n\n\
    ### 4.1 概述\n\n### 一、存储器分类\n\n### 1. 按存储介质分类\n\n- (1) 半导体存储器    TTL、MOS    易失\n\
    - (2) 磁表面存储器    磁头、载磁体\n- (3) 磁芯存储器    硬磁材料、环状元件\n- (4) 光盘存储器    激光、磁光材料\n\n非易失\n\
    \n### 2. 按存取方式分类\n\n- 随机存储器 在程序的执行过程中 可读 可写\n- 只读存储器 在程序的执行过程中 只读\n\n- 顺序存取存储器\
    \ 磁带\n- 直接存取存储器 磁盘\n\n### 3. 按在计算机中的作用分类\n\n- 存储器\n  - 主存储器\n    - RAM\n     \
    \ - 静态 RAM\n      - 动态 RAM\n    - ROM\n      - MROM\n      - PROM\n      - EPROM\n\
    \      - EEPROM\n  - Flash Memory\n  - 高速缓冲存储器（Cache）\n  - 辅助存储器\n    - 磁盘、磁带、光盘\n\
    \n### 二、存储器的层次结构\n\n### 1. 存储器三个主要特性的关系\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_92_0.png)\n\
    \n### 2. 缓存—主存层次和主存—辅存层次\n\n10 ns\n\nCPU\n\n20 ns\n\n缓存\n\n200 ns\n\n主存\n\nms\n\
    \n辅存\n\n（速度）\n\n（容量）\n\n缓存 — 主存\n\n主存 — 辅存\n\n主存储器\n\n虚拟存储器\n\n实地址\n\n虚地址\n\n\
