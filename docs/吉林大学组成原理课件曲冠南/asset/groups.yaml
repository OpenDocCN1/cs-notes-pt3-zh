    # 算术类指令除了完成算术过程，还要完成测试操作


    +   - ZF：零标志位，运算结果为零时ZF置1；

    +   - AF：半进位，AF = 1，有半进位；

    +   - PF：偶校验，1的个数为偶数时PF为1；

    +   - SF：结果为负标志，若运算结果为负，则SF为1；

    +   - CF：进位标志，若有进位时，CF为1；

    +   - OF：溢出标志，若溢出时，OF为1。'
