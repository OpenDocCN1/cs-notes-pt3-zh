    +   微指令的 后续地址如何形成


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_638_0.png)


    ## 三、微指令的编码方式（控制方式）


    ## 1. 直接编码（直接控制）方式


    在微指令的操作控制字段中，


    每一位代表一个微操作命令


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_639_0.png)


    速度最快


    某位为 “1” 表示该控制信号有效


    ## 2. 字段直接编码方式


    将微指令的控制字段分成若干 “段”，

    每段经译码后发出控制信号


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_640_0.png)


    每个字段中的命令是 互斥 的


    缩短了微指令 字长， 增加了译码 时间


    ## 3. 字段间接编码方式


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_641_0.png)


    ## 4. 混合编码


    直接编码和字段编码（直接和间接）混合使用


