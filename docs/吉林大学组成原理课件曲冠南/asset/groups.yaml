  - '[PAGE 186]


    # 1. 四个基本问题 – 映射规则


    （1）全相联映像


    +   > 全相联：主存中的任一块可以被放置到Cache中的任意一个位置。


    +   > 特点：空间利用率最高，冲突概率最低，实现最复杂。


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_186_0.png)'
  - '[PAGE 187]


    # （2）直接映射


    +   > 直接映射：主存中的每一块只能被放置到Cache中唯一的一个位置。（循环分配）

    +   > 特点：空间利用率最低，冲突概率最高，实现最简单。

    +   > 对于主存的第 i 块，若它映射到Cache的第 j 块，则：

    +   > j = i mod（M） （M为Cache的块数）


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_187_0.png)


    设M=2^m，则当表示为二进制数时，j实际上就是i的低m位：


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_187_1.png)'
  - '[PAGE 188]


    # （3）组相联映射


    +   - 组相联：主存中的每一块可以被放置到Cache中唯一的一个组中的任何一个位置。

    +   - 组相联是直接映射和全相联的一种折中

    +   - 若主存第 i 块映射到第 k 组，则：k = i mod (G) （G为Cache的组数）


    设 G = 2^g，则当表示为二进制数时，k 实际上就是 i 的低 g 位：


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_188_0.png)


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_188_1.png)'
  - '[PAGE 189]


    （4）三者关系：n 路组相联：

    每组中有n个块(n=M/G)，n 称为相联度。

    相联度越高，Cache空间的利用率就越高，块冲突概率就越低，不命中率也就越低。


    | | n（路数） | G（组数） |

    |---|---|---|

    | 全相联 | M | 1 |

    | 直接映射 | 1 | M |

    | 组相联 | 1<n<M | 1<G<M |'
