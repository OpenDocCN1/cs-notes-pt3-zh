    \n无法达到理论值2.17，是因为操作码必须用整数位表示。\n\n## 扩展Huffman编码\n\n介于固定长度操作码编码和Huffman编码之间的一种编码方式，操作码长度虽不是定长的，但是只有几种码长，但仍然是概率高的指令用短操作码表示，概率低的指令用短操作码表示。仍然符合Huffman压缩的思想。\n\
