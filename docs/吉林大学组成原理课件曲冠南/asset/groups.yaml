    # 2. 串行进位链


    进位链  传送进位的电路


    串行进位链  进位串行传送


    以 4 位全加器为例，每一位的进位表达式为


    C₀ = d₀ + t₀ C₋₁ = \overline{\overline{d₀}·\overline{t₀ C₋₁}}


    C₁ = d₁ + t₁ C₀


    C₂ = d₂ + t₂ C₁


    C₃ = d₃ + t₃ C₂


    设与非门的级延迟时间为 t_y


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_410_0.png)


    4位全加器产生进位的全部时间为 8t_y


    n 位全加器产生进位的全部时间为 2n t_y'
