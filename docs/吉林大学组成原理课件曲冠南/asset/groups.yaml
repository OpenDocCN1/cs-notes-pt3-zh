  - '[PAGE 469]


    # 二、RISC 的主要特征


    +   - 选用使用频率较高的一些 简单指令，复杂指令的功能由简单指令来组合

    +   - 指令 长度固定、指令格式种类少、寻址方式少

    +   - 只有 LOAD / STORE 指令访存

    +   - CPU 中有多个 通用 寄存器

    +   - 采用 流水技术 一个时钟周期 内完成一条指令

    +   - 采用 组合逻辑 实现控制器

    +   - 采用 优化 的 编译 程序'
  - '[PAGE 470]


