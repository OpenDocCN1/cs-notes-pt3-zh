    # (3) 取指阶段 执行取指微程序


    M ⟶ CMAR


    CM ( CMAR ) ⟶ CMDR


    由 CMDR 发命令


    ：


    全部微指令存在 CM 中，程序执行过程中 只需读出


    关键


    +   微指令的操作控制字段如何形成微操作命令


    +   微指令的 后续地址如何形成


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_638_0.png)'
