    \ 地址上，循环执行 10 次。\n\n```asm\nOK:    LD.D      F2, 0(R1)\n       MULT.D    F4, F2,\
    \ F0\n       LD.D      F6, 0(R2)\n       ADD.D     F6, F4, F6\n       SD.D   \
    \   0(R2), F6\n       ADDI      R1, R1, #8\n       ADDI      R2, R2, #8\n    \
    \   SUBI      R3, R3, #1\n       BNEZ      R3, OK\n```\n\n问：\n\n- （1）假设直接映射，每块\
    \ 8B，请给出程序结束时每个 Cache 块所对应的标识，并求出失效率；\n- （2）假设直接映射，每块 16B，请给出程序结束时每个 Cache 块所对应的标识，并求出失效率；\n\
    - （3）假设二路组相联，每块 8B，替换采用 LRU 算法，请给出程序结束时每个 Cache 块所对应的标识，并求出失效率。\n\n## 三、Cache\
    \ 的改进\n\n平均访问时间 = 命中率 × 命中时间 + 不命中率 × 访问主存时间\n\n- 途径一：降低失效率\n- 途径二：降低失效开销\n- 途径三：降低命中时间\n\
    \n此消彼长？\n\n### 三种类型的不命中（3C）\n\n- **强制性不命中（Compulsory miss）**：当第一次访问一个块时，该块不在 Cache\
    \ 中，需从下一级存储器中调入 Cache，这就是强制性不命中。（冷启动不命中，首次访问不命中）\n- **容量不命中（Capacity miss）**：如果程序执行时所需的块不能全部调入\
    \ Cache 中，则当某些块被替换后，若又重新被访问，就会发生不命中。这种不命中称为容量不命中。\n- **冲突不命中（Conflict miss）**：在组相联或直接映射\
    \ Cache 中，若太多的块映射到同一组（块）中，则会出现该组中某个块被别的块替换（即使别的组或块有空闲位置），然后又被重新访问的情况。这就是发生了冲突不命中。（碰撞不命中，干扰不命中）\n\
    \n### 方法一：最直接的方法\n\n- 强制不命中——增加块大小\n- 容量不命中——增加 Cache 容量\n- 冲突不命中——提高相联度\n\n###\
    \ 方法二：伪相联 Cache（列相联 Cache）\n\n多路组相联的低不命中率和直接映射的命中速度。\n\n|  | 优点 | 缺点 |\n|---|---|---|\n\
    | 直接映射 | 命中时间小 | 不命中率高 |\n| 组相联 | 不命中率低 | 命中时间大 |\n\n伪相联 Cache 的优点：\n\n- 命中时间小\n\
    - 不命中率低\n\n**基本思想及工作原理**\n\n在逻辑上把直接映射 Cache 的空间上下平分为两个区。对于任何一次访问，伪相联 Cache 先按直接映射\
    \ Cache 的方式去处理。若命中，则其访问过程与直接映射 Cache 的情况一样。若不命中，则再到另一区相应的位置去查找。若找到，则发生了伪命中，否则就只好访问下一级存储器。\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_202_0.png)\n\n### 方法三：编译器预取\n\n例：对于下面的程序，首先判断哪些访问可能会导致数据\
    \ Cache 失效。然后，加入预取指令以减少失效。最后，计算所执行的预取指令的条数以及通过预取避免的失效次数。假定：\n\n（1）我们用的是容量为 8KB、块大小为\
    \ 16B 的直接映射 Cache，它采用写回法并且按写分配。\n\n（2）a、b 分别为 3×100（3 行 100 列）和 101×3 的双精度浮点数组，每个元素都是\
    \ 8B。当程序开始执行时，这些数据都不在 Cache 内。\n\n```c\nfor ( i = 0; i < 3; i = i + 1 )\nfor (\
    \ j = 0; j < 100; j = j + 1 )\n    a[ i ][ j ] = b[ j ][ 0 ] * b[ j + 1 ][ 0 ];\n\
    ```\n\n**解**\n\n计算过程：\n- 取 a 时 150 次\n- 取 b 时 101 次\n\n失效情况：\n- 总的失效次数 = 251 次\n\
    \n改进后的程序：\n\n假设失效开销很大，预取必须至少提前 7 次循环进行。\n\n```c\nfor ( j = 0; j < 100; j = j +\
    \ 1 ) {\n    prefetch ( b[j + 7][0] );\n    /* 预取 7 次循环后所需的 b ( j , 0 ) */\n \
    \   prefetch ( a[0][j + 7] );\n    /* 预取 7 次循环后所需的 a ( 0 , j ) */\n    a[0][j]\
    \ = b[j][0] * b[j + 1][0];\n    /* a 失效 7/2 = 4; b 失效 7 次 */\n}\nfor ( i = 1;\
    \ i < 3; i = i + 1 ) {\n    for ( j = 0; j < 100; j = j + 1 ) {\n        prefetch\
    \ ( a[i][j + 7] );\n        /* 预取 7 次循环后所需的 a ( i , j ) */\n        a[i][j] =\
    \ b[j][0] * b[j + 1][0];\n    }\n} /* a 失效 7/2 = 4，两次循环共失效 8 次 */\n```\n\n###\
    \ 方法四：编译器优化\n\n基本思想：通过对软件进行优化，提高代码访问的局部性，进而降低不命中率。\n\n- 数组合并：将本来相互独立的多个数组合并成为一个复合数组，以提高访问它们的局部性。\n\
    - 内外循环交换\n- 循环融合：将若干个独立的循环融合为单个的循环。这些循环访问同样的数组，对相同的数据作不同的运算。这样能使得读入 Cache 的数据在被替换出去之前，能得到反复的使用。\n"
