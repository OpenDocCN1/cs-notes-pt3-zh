    # 三、计算机的工作步骤




    +   • 建立数学模型


    +   • 确定计算方法


    ```

    sin x = x - x³/3! + x⁵/5! - x⁷/7! + x⁹/9! - …

    ```


    ```

    √x = 1/2 (yₙ + x/yₙ) (n = 0, 1, 2, …)

    ```


    +   • 编制解题程序


    程序 —— 运算的 全部步骤


    指令 —— 每一个步骤'
  - '[PAGE 20]


    # 编程举例


    计算 ax² + bx + c = (ax + b)x + c


    +   - 取x 至运算器中

    +   - 乘以x 在运算器中

    +   - 乘以a 在运算器中

    +   - 存ax² 在存储器中

    +   - 取b 至运算器中

    +   - 乘以x 在运算器中

    +   - 加ax² 在运算器中

    +   - 加c 在运算器中


    +   - 取x 至运算器中

    +   - 乘以a 在运算器中

    +   - 加b 在运算器中

    +   - 乘以x 在运算器中

    +   - 加c 在运算器中'
  - '[PAGE 21]


    # 指令格式举例


    | 操作码 | 地址码 | 说明 |

    |---|---|---|

    | 取数 α | 000001 0000001000 | [α] → ACC |

    | 存数 β |  | [ACC] → β |

    | 加 γ |  | [ACC] + [γ] → ACC |

    | 乘 δ |  | [ACC] × [δ] → ACC |

    | 打印 σ |  | [σ] → 打印机 |

    | 停机 |  |  |'
  - '[PAGE 22]


    # 计算 $ax^2 + bx + c$ 程序清单


    | 指令和数据存在主存单元的地址 | 指令 |  | 注释 |

    |---|---|---|---|

    |  | 操作码 | 地址码 |  |

    | 0 | 000001 | 0000001000 | 取数$x$至ACC |

    | 1 | 000100 | 0000001001 | 乘$a$得$ax$,存于ACC中 |

    | 2 | 000011 | 0000001010 | 加$b$得$ax+b$,存于ACC中 |

    | 3 | 000100 | 0000001000 | 乘$x$得$(ax+b)x$,存于ACC中 |

    | 4 | 000011 | 0000001011 | 加$c$得$ax^2+bx+c$,存于ACC |

    | 5 | 000010 | 0000001100 | 将$ax^2+bx+c$,存于主存单元 |

    | 6 | 000101 | 0000001100 | 打印 |

    | 7 | 000110 |  | 停机 |

    | 8 |  | $x$ | 原始数据$x$ |

    | 9 |  | $a$ | 原始数据$a$ |

    | 10 |  | $b$ | 原始数据$b$ |

    | 11 |  | $c$ | 原始数据$c$ |

    | 12 |  |  | 存放结果 |'
  - '[PAGE 23]


    # 2. 计算机的解题过程


    # (1) 存储器的主要功能和组成


    +   - 存放程序和数据的装置

    +   - 计算机能够随机的访问这些程序和数据

    +   - 进？   <<== 地址

    +   - 出？   ==> 数'
  - '[PAGE 24]


    # 2. 计算机的解题过程


    # 存储器的基本组成


    存储体 - 存储单元 - 存储元件（0/1）


    大楼 - 房间 - 床位（无人/有人）


    存储单元 存放一串二进制代码


    存储字 存储单元中二进制代码的组合


    存储字长 存储单元中二进制代码的位数


    每个存储单元赋予一个地址号


    按地址寻访


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_24_0.png)'
  - '[PAGE 25]


    # 存储器的基本组成


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_25_0.png)


    MAR 存储器地址寄存器 反映存储单元的个数


    MDR 存储器数据寄存器 反映存储字长


    设 MAR=4位


    MDR=8位


    存储单元个数 16


    存储字长 8


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_25_1.png)'
  - '[PAGE 26]


    # (2)运算器的主要功能和组成


    +   • 完成算数和逻辑运算

    +   • 所有的算数运算都能够通过加法来解决

    +   • 进? === 数

    +   • 出? ==》数'
  - '[PAGE 27]


    # 运算器的基本组成及操作过程


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_27_0.png)'
  - '[PAGE 28]


    # (3)控制器的主要功能


    +   - 整个机器的指挥机构

    +     - 按照规定的操作进行 ==》 取/译/执

    +     - 自动的进行 ==》 PC = PC+1

    +     - 有秩序的进行 ==》 时序，时钟，节拍，脉冲

    +   - 出？ ==》 指令地址

    +   - 进？ 《== 指令

    +   - 出？ ==》 控制信号'
