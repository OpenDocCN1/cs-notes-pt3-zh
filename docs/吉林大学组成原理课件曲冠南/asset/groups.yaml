    ## 辅存容量\n\n字节数 80 GB\n\n1GB = 2^{30b}\n\n## 1.4 计算机硬件和体系结构的发展\n\n## 一、计算机的产生和发展\n\
    \n- 第一台通用电子计算机诞生于1946年\n\n世界上第一台现代电子计算机“埃尼阿克”（LJC32），诞生于1946年2月14日的美国宾夕法尼亚大学，并于次日正式对外公布。ENIAC长30.48米，宽1米，占地面积约170平方米，30个操作台，约相当于10间普通房间的大小，重达30吨，耗电量150千瓦，造价48万美元。它包含了17,468真空管7,200水晶二极管，1,500中转，70,000电阻器，10,000电容器，1500继电器，6000多个开关，每秒执行5000次加法或400次乘法，是继电器计算机的1000倍、手工计算的20万倍。\n\
    \nENIAC于1955年退役。\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_35_0.png)\n\n## 硬件技术对计算机更新换代的影响\n\
    \n| 代 | 时间 | 硬件技术 | 速度 /（次/秒） |\n| --- | --- | --- | --- |\n| 一 | 1946—1957 |\
    \ 电子管 | 40 000 |\n| 二 | 1958—1964 | 晶体管 | 200 000 |\n| 三 | 1965—1971 | 中小规模集成电路\
    \ | 1 000 000 |\n| 四 | 1972—1977 | 大规模集成电路 | 10 000 000 |\n| 五 | 1978—现在 | 超大规模集成电路\
    \ | 100 000 000 |\n\n## IT定律：\n\n- • 摩尔定律\n- IT产品的性能每18个月翻一番。\n\n处理能力：\n\n- 1945年\
    \ ENIAC 每秒5000次定点运算；\n- 2007年 IBM深蓝基因 ENIAC的70倍；\n- 2010年 中国天河1A IBM深蓝的的70倍；\n\
    - 2012年 IBM红杉 天河1A的6倍。\n\n- • 安迪-比尔定律\n- What Andy gives, Bill takes away.\n\n\
    ## 二、 计算机系统结构的发展\n\n1. 输入/输出方式的改进\n\n输入输出方式\n程序控制\n程序等待\n程序中断\nDMA\n成组传递\n周期挪用\n\
    I/O 处理机\n通道\n外围处理机\n\n2. 采用并行处理技术\n\n- 并行数据处理：\n  例如，微操作级、指令级、线程级、进程级、任务级等。\n\
    - 并行存取\n\n3. 存储器组织结构的发展\n\n- 相联存储器与相联处理机\n- 通用寄存器组\n- 存储体系\n- 指令和数据分离\n\n4. 指令集的发展\n\
    \n- 复杂指令集计算机（CISC）\n- 精减指令集计算机（RISC）\n\n## 二、 计算机系统结构中并行性的发展\n\n## 1. 并行性的概念\n\
    \n- 并行性：计算机系统在同一时刻或者同一时间间隔内进行多种运算或操作。（只要在时间上相互重叠，就存在并行性）\n  - 同时性：两个或两个以上的事件在同一时刻发生。\n\
    \  - 并发性：两个或两个以上的事件在同一时间间隔内发生。\n\n## 2. 从执行程序的角度来看，并行性等级从低到高可分为：\n\n- 指令内部并行：单条指令中各微操作之间的并行。\n\
    - 指令级并行：并行执行两条或两条以上的指令。\n- 线程级并行：并行执行两个或两个以上的线程。\n  通常是以一个进程内派生的多个线程为调度单位。\n-\
    \ 任务级或过程级并行：并行执行两个或两个以上的过程或任务（程序段）\n  以子程序或进程为调度单元。\n- 作业或程序级并行：并行执行两个或两个以上的作业或程序。\n\
    \n## 3. 提高并行性的技术途径\n\n三种途径：\n\n- 时间重叠\n  \n  引入时间因素，让多个处理过程在时间上相互错开，轮流重叠地使用同一套硬件设备的各个部分，以加快硬件周转而赢得速度。原则上不重复设置硬件设备。\n\
    \n- 资源重复\n  \n  引入空间因素，以数量取胜。通过重复设置硬件资源，大幅度地提高计算机系统的性能。\n\n- 资源共享\n  \n  这是一种软件方法，它使多个任务按一定时间顺序轮流使用同一套硬件设备。如，多道程序。\n\
    \n## 4 单机系统中并行性的发展\n\n(1) 在发展高性能单处理机过程中，起主导作用的是时间重叠原理。\n\n实现时间重叠的基础：部件功能专用化\n\n\
    - 把一件工作按功能分割为若干相互联系的部分；\n- 把每一部分指定给专门的部件完成；\n- 按时间重叠原理把各部分的执行过程在时间上重叠起来，使所有部件依次分工完成一组同样的工作。\n\
    \n例如： 对于解释指令的5个过程，就分别需要5个专用的部件：取指令部件 (IF)、指令译码部件 (ID)、指令执行部件 (EX)、访问存储器部件 (M)\
    \ 和写结果部件 (WB)。\n时间\n串行执行\n指令 i\n指令 i+1\n指令 i+2\n指令 i+3\n流水执行\nIF ID EX M WB\n\
    指令 i\n指令 i+1\n指令 i+2\n\n（2）在单处理机中，资源重复原理的运用也已经十分普遍。\n\n例如：\n\n- 多体存储器\n- 多操作部件\n\
    \  - 通用部件被分解成若干个专用部件，如加法部件、乘法部件、除法部件、逻辑运算部件等，而且同一种部件也可以重复设置多个。\n  - 只要指令所需的操作部件空闲，就可以开始执行这条指令（如果操作数已准备好的话）。\n\
    \n(3) 在单处理机中，资源共享的概念实质上是用单处理机模拟多处理机的功能，形成所谓**虚拟机**的概念。\n\n- 分时系统\n\n## 5　多机系统中并行性的发展\n\
    \n多机系统遵循时间重叠、资源重复、资源共享原理，发展为3种不同的多处理机：\n\n- 时间重叠 → 功能专用化（实现时间重叠）→ 异构型多处理机系统\n\
    \  由多个不同类型、至少担负不同功能的处理机组成，它们按照作业要求的顺序，利用时间重叠原理，依次对它们的多个任务进行加工，各自完成规定的功能动作。\n \
    \ 例如：专用处理机\n- 资源重复 → 重复设置相同的资源 → 同构型多处理机\n  例如：容错系统\n- 资源共享 → 分布式系统\n\n## 计算机原理与系统结构\n\
