    指令 i+2'
  - '[PAGE 44]


    （2）在单处理机中，资源重复原理的运用也已经十分普遍。


    例如：


    +   - 多体存储器

    +   - 多操作部件

    +     - 通用部件被分解成若干个专用部件，如加法部件、乘法部件、除法部件、逻辑运算部件等，而且同一种部件也可以重复设置多个。

    +     - 只要指令所需的操作部件空闲，就可以开始执行这条指令（如果操作数已准备好的话）。'
  - '[PAGE 45]


    (3) 在单处理机中，资源共享的概念实质上是用单处理机模拟多处理机的功能，形成所谓**虚拟机**的概念。


    +   - 分时系统'
  - '[PAGE 46]


    # 5　多机系统中并行性的发展


    多机系统遵循时间重叠、资源重复、资源共享原理，发展为3种不同的多处理机：


    +   - 时间重叠 → 功能专用化（实现时间重叠）→ 异构型多处理机系统

    +     由多个不同类型、至少担负不同功能的处理机组成，它们按照作业要求的顺序，利用时间重叠原理，依次对它们的多个任务进行加工，各自完成规定的功能动作。

    +     例如：专用处理机

    +   - 资源重复 → 重复设置相同的资源 → 同构型多处理机

    +     例如：容错系统

    +   - 资源共享 → 分布式系统'
