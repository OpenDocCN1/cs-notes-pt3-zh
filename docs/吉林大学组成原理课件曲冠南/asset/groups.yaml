    ### (3) 动态 RAM 时序


    行、列地址分开传送。


    | 读时序 | 写时序 |

    |---|---|

    | 行地址 RAS 有效 | 行地址 RAS 有效 |

    | 写允许 WE 有效（高） | 写允许 WE 有效（低） |

    | 列地址 CAS 有效 | 列地址 CAS 有效 |

    | 数据 D_OUT 有效 | 数据 D_IN 有效 |


    ### (4) 动态 RAM 刷新


    刷新与行地址有关。


    #### ① 集中刷新（存取周期为 0.5 μs）


    以 128 × 128 矩阵为例。


    读/写或维持 → 刷新 → 读/写或维持


    | 阶段 | 读/写或维持 | 刷新 | 读/写或维持 |

    |---|---|---|---|

    | 周期序号 | 0, 1, 2, …, 3871 | 3872, …, 3999 | 0, 1, … |

    | t_c | t_c … t_c | t_c … t_c | t_c … t_c |

    | 地址序号 | X, Y, …, V, W | 0, 1, …, 127 |  |


    - 读/写或维持：3872 个周期（1936 μs）

    - 刷新：128 个周期（64 μs）

    - 刷新时间间隔：2 ms

    - “死区”为 0.5 μs × 128 = 64 μs

    - “死时间率”为 128 / 4 000 × 100% = 3.2%


    #### ② 分散刷新（存取周期为 1 μs）


    以 128 × 128 矩阵为例


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_143_0.png)


    - 刷新间隔：128 个存取周期

    - t_C = t_M + t_R，无“死区”

    - 读/写 + 刷新（存取周期为 0.5 μs + 0.5 μs）


    #### ③ 分散刷新与集中刷新相结合（异步刷新）


    对于 128 × 128 的存储芯片（存取周期为 0.5 μs），若每隔 15.6 μs 刷新一行：


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_144_0.png)


    - 每行每隔 2 ms 刷新一次

    - “死区”为 0.5 μs

    - 将刷新安排在指令译码阶段，不会出现“死区”


    ### 3. 动态 RAM 和静态 RAM 的比较


    |  | DRAM | SRAM |

    |---|---|---|

    | 存储原理 | 电容 | 触发器 |

    | 集成度 | 高 | 低 |

    | 芯片引脚 | 少 | 多 |

    | 功耗 | 小 | 大 |

    | 价格 | 低 | 高 |

    | 速度 | 慢 | 快 |

    | 刷新 | 有 | 无 |


    主存：DRAM；缓存：SRAM

