    # 3. 四个基本问题 – 替换算法


    所要解决的问题：当新调入一块，而Cache又已被占满时，替换哪一块？


    +   - 直接映射Cache中的替换很简单

    +     因为只有一个块，别无选择。

    +   - 在组相联和全相联Cache中，则有多个块供选择。

    +     主要的替换算法有三种

    +     (1) 随机法

    +     (2) 先进先出法FIFO

    +     (3) 最近最少使用法LRU

    +     实现比较困难,实际上选择最久没有被访问过的块作为被替换的块。'
