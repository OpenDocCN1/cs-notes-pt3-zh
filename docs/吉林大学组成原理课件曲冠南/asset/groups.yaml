    +   1. 微指令的下地址字段指出

    +   2. 根据机器指令的操作码形成

    +   3. 增量计数器

    +      (CMAR) + 1 ⟶ CMAR

    +   4. 分支转移


    | 操作控制字段 | 转移方式 | 转移地址 |

    |---|---|---|

    | 转移方式 | 指明判别条件 |  |

    | 转移地址 | 指明转移成功后的去向 |  |


