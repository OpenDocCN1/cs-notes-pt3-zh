    \n#### 三、计算机的工作步骤\n\n- • 建立数学模型\n- • 确定计算方法\n\n```\nsin x = x - x³/3! + x⁵/5!\
    \ - x⁷/7! + x⁹/9! - …\n```\n\n```\n√x = 1/2 (yₙ + x/yₙ) (n = 0, 1, 2, …)\n```\n\
    \n- • 编制解题程序\n\n程序 —— 运算的 全部步骤\n\n指令 —— 每一个步骤\n\n## 编程举例\n\n计算 ax² + bx + c =\
    \ (ax + b)x + c\n\n- 取x 至运算器中\n- 乘以x 在运算器中\n- 乘以a 在运算器中\n- 存ax² 在存储器中\n- 取b 至运算器中\n\
