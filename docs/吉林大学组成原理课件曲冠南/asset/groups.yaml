  - '[PAGE 183]


    # （1）Cache 的命中率


    h = Nc/(Nc+Nm)


    # （2）平均访问时间


    平均访问时间 = 命中率*命中时间+不命中率*访问主存时间


    = h*tc + (1-h)tm


    # （3）Cache -主存系统的效率


    效率 e 与 命中率 有关


    e = 访问 Cache 的时间 / 平均访问时间 × 100%


    设 Cache 命中率为 h，访问 Cache 的时间为 t_c，


    访问 主存 的时间为 t_m


    则 e = t_c / (h × t_c + (1−h) × t_m) ×100%'
