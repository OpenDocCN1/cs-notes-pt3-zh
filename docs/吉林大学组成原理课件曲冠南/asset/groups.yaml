    ## 计算机原理与系统结构\n\n### 第九章 控制单元的功能\n\n曲冠南  \nqugnStu@live.com\n\n## 控制单元 CU\n\n\
    正确的、按顺序完成各种指令的功能\n\n关键词：操作、顺序。\n\n需要解决的问题：\n\n- （1）完成一条指令都需要什么操作？\n- （2）如何控制？\n\
    - （3）如何以正确的时序控制？\n\n## 9.1 操作命令的分析\n\n完成一条指令分 4 个工作周期\n\n- 取指周期\n- 间址周期\n- 执行周期\n\
    - 中断周期\n\n### 二、间址周期\n\n指令形式地址 → MAR\n\nAd(IR) → MAR\n\n1 → R\n\nM(MAR) → MDR\n\
    \nMDR → Ad(IR)\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_579_0.png)\n\n### 三、执行周期\n\
    \n**1. 非访存指令**\n\n- (1) CLA 清A：0 → ACC\n- (2) COM 取反：ACC̅ → ACC\n- (3) SHR 算术右移：L(ACC)\
    \ → R(ACC)，ACC₀ → ACC₀\n- (4) CSL 循环左移：R(ACC) → L(ACC)，ACC₀ → ACCₙ\n- (5) STP\
    \ 停机指令：0 → G\n\n**2. 访存指令**\n\n```\nAd(IR) → MAR\n1 → R\nM(MAR) → MDR\n(ACC) +\
    \ (MDR) → ACC\n```\n\n```\nAd(IR) → MAR\n1 → W\nACC → MDR\nMDR → M(MAR)\n```\n\
    \n**（3）取数指令 LDA X**\n\n- Ad(IR) → MAR\n- 1 → R\n- M(MAR) → MDR\n- MDR → ACC\n\n\
    **3. 转移指令**\n\n**（1）无条件转 JMP X**\n\nAd(IR) → PC\n\n**（2）条件转移 BAN X（负则转）**\n\n\
    A₀·Ad(IR) + Ā₀(PC) → PC\n\n**4. 三类指令的指令周期**\n\n- 非访存：指令周期 = 取指周期 + 执行周期\n- 直接访存：指令周期\
    \ = 取指周期 + 执行周期\n- 间接访存：指令周期 = 取指周期 + 间址周期 + 执行周期\n- 转移：指令周期 = 取指周期 + 执行周期\n-\
    \ 间接转移：指令周期 = 取指周期 + 间址周期 + 执行周期\n\n### 四、中断周期\n\n| 程序断点存入“0”地址 | 程序断点进栈 |\n|\
    \ --- | --- |\n| 0 → MAR | (SP)-1 → MAR |\n| 1 → W | 1 → W |\n| PC → MDR | PC\
    \ → MDR |\n| MDR → M(MAR) | MDR → M(MAR) |\n\n中断识别程序入口地址 M → PC\n\n0 → EINT（置“0”）\n\
    \n## 9.2 控制单元的功能\n\n### 一、控制单元的外特性\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_585_0.png)\n\
    \n**1. 输入信号**\n\n**（1）时钟**\n\nCU 受时钟控制\n\n一个时钟脉冲发一个操作命令或一组需同时执行的操作命令\n\n**（2）指令寄存器\
    \ OP（IR）→ CU**\n\n控制信号与操作码有关\n\n**（3）标志**\n\nCU 受标志控制，如 CPU 当前所处的状态\n\n**（4）外来信号**\n\
    \n| 信号 | 含义 |\n| --- | --- |\n| INTR | 中断请求 |\n| HRQ | 总线请求 |\n\n**2. 输出信号**\n\
    \n**（1）CPU 内的各种控制信号**\n\n- R_i → R_j\n- (PC) + 1 → PC\n- ALU +、-、与、或……\n\n**（2）送至控制总线的信号**\n\
    \n- MREQ：访存控制信号\n- IO/M：访 IO/存储器的控制信号\n- RD：读命令\n- WR：写命令\n- INTA：中断响应信号\n- HLDA：总线响应信号\n\
    \n### 二、控制信号举例\n\n**1. 不采用 CPU 内部总线的方式**\n\n以 ADD @ X 为例\n\n**取指周期**\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_588_0.png)\n\
    \n**ADD @ X 间址周期**\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_589_0.png)\n\n\
    **ADD @ X 执行周期**\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_590_0.png)\n\n**2.\
    \ 采用 CPU 内部总线方式**\n\n**（1）ADD @ X 取指周期**\n\n- PC → MAR → 地址线（PCₒ, MARᵢ）\n- CU\
    \ 发读命令，1 → R\n- 数据线 → MDR\n- MDR → IR（MDRₒ, IRᵢ）\n- OP（IR）→ CU\n- （PC）+ 1 → PC\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_591_0.png)\n\n**（2）ADD @ X 间址周期**\n\
    \n形式地址 → MAR\n\n- MDR → MAR → 地址线（MDRₒ, MARᵢ）\n- 1 → R\n- 数据线 → MDR\n- MDR → IR（MDRₒ,\
    \ IRᵢ）\n\n有效地址 → Ad（IR）\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_592_0.png)\n"
