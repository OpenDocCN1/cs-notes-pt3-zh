    \  WE（低电平写 高电平读）\n\nOE（允许读）  WE（允许写）\n\n### 存储芯片片选线的作用\n\n用 16K × 1位的存储芯片组成 64K\
    \ × 8位的存储器\n\n32片\n\n8片 16K × 1位\n8片 16K × 1位\n8片 16K × 1位\n8片 16K × 1位\n\n当地址为\
