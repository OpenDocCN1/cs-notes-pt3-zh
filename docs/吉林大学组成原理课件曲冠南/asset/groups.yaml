    ## 五、微指令格式


    ## 1. 水平型微指令


    一次能定义并执行多个并行操作


    如 直接编码、字段直接编码、字段间接编码、直接和字段混合编码


    ## 2. 垂直型微指令


    类似机器指令操作码 的方式


    由微操作码字段规定微指令的功能


    ## 3. 两种微指令格式的比较


    +   (1) 水平型微指令比垂直型微指令 并行操作能力强，

    +   灵活性强

    +   (2) 水平型微指令执行一条机器指令所要的

    +   微指令 数目少，速度快

    +   (3) 水平型微指令 用较短的微程序结构换取较长的

    +   微指令结构

    +   (4) 水平型微指令与机器指令 差别大


    ## 六、静态微程序设计和动态微程序设计 10.2


    静态 微程序无需改变，采用 ROM


    动态  通过改变微指令 和 微程序 改变机器指令，


    有利于仿真，采用 EPROM


    ## 七、毫微程序设计


    ## 1. 毫微程序设计的基本概念


    微程序设计 用 微程序解释机器指令


    毫微程序设计 用 毫微程序解释微程序


    毫微指令与微指令 的关系好比 微指令与机器指令 的关系


    ## 2. 毫微程序控制存储器的基本组成


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_648_0.png)


    ## 八、串行微程序控制和并行微程序控制 10.2


    ## 串行 微程序控制


    取第 i 条微指令 执行第 i 条微指令 取第 i+1 条微指令 执行第 i+1 条微指令


    ## 并行 微程序控制


    取第 i 条微指令 执行第 i 条微指令 取第 i+1 条微指令 执行第 i+1 条微指令 取第 i+2 条微指令 执行第 i+2 条微指令


    ## 九、微程序设计举例


    ## 1. 写出对应机器指令的微操作及节拍安排


    假设 CPU 结构与组合逻辑相同


    ## （1）取指阶段微操作分析


    3 条微指令


    | 节拍 | 微操作 | 说明 |

    |---|---|---|

    | $T_0$ | $PC \rightarrow MAR$ | $1 \rightarrow R$ |

    | $T_1$ | $M(MAR) \rightarrow MDR$ | $(PC)+1 \rightarrow PC$ |

    | $T_2$ | $MDR \rightarrow IR$ | $OP(IR) \rightarrow$ 微地址形成部件 |


    若需考虑如何安排这条微指令？


    则取指操作需 3 条微指令


    $Ad(CMAR) \rightarrow CMAR$


    $OP(IR) \rightarrow$ 微地址形成部件 $\rightarrow CMAR$


    ## （2）取指阶段的微操作及节拍安排


    考虑到需要 **形成后续微指令的地址**


    $T_0$　PC → MAR　　　　　　　　　1 → R


    $T_1$　**Ad（CMDR）→ CMAR**


    $T_2$　M（MAR）→ MDR　（PC）+1 → PC


    $T_3$　**Ad（CMDR）→ CMAR**


    $T_4$　MDR → IR　　　　　　　　OP（IR）→ 微地址形成部件


    $T_5$　**OP（IR）→ 微地址形成部件 → CMAR**


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_651_0.png)


    ## (3) 执行阶段的微操作及节拍安排


    考虑到需形成后续微指令的地址


    +   • 非访存指令


    ```

    ① CLA 指令


    T₀ 0 → AC


    T₁ Ad (CMDR) → CMAR

    ```


    ```

    ② COM 指令


    T₀ \overline{AC} → AC


    T₁ Ad (CMDR) → CMAR

    ```


    > 取指微程序的入口地址 M 由微指令下地址字段指出


    ## ③ SHR 指令


    T₀    L(AC) ⟶ R(AC)    AC₀ ⟶ AC₀


    T₁    Ad( CMDR ) ⟶ CMAR


    ## ④ CSL 指令


    T₀    R(AC) ⟶ L(AC)    AC₀ ⟶ ACₙ


    T₁    Ad( CMDR ) ⟶ CMAR


    ## ⑤ STP 指令


    T₀    0 ⟶ G


    T₁    Ad( CMDR ) ⟶ CMAR


    +   - 访存指令


    ⑥ ADD 指令


    $T_0$　Ad (IR) ⟶ MAR　　　1 ⟶ R

    $T_1$　Ad (CMDR) ⟶ CMAR

    $T_2$　M (MAR) ⟶ MDR

    $T_3$　Ad (CMDR) ⟶ CMAR

    $T_4$　( AC ) + ( MDR ) ⟶ AC

    $T_5$　Ad (CMDR) ⟶ CMAR


    ⑦ STA 指令


    $T_0$　Ad (IR) ⟶ MAR　　　1 ⟶ W

    $T_1$　Ad (CMDR) ⟶ CMAR

    $T_2$　AC ⟶ MDR

    $T_3$　Ad (CMDR) ⟶ CMAR

    $T_4$　MDR ⟶ M (MAR)

    $T_5$　Ad (CMDR) ⟶ CMAR


    ## 转移类指令


    +   ⑨ JMP 指令


    T₀    Ad ( IR ) ⟶ PC


    T₁    Ad ( CMDR ) ⟶ CMAR


    +   ⑩ BAN 指令


    T₀    A₀·Ad ( IR ) + Ā₀·( PC ) ⟶ PC


    T₁    Ad ( CMDR ) ⟶ CMAR


    全部微操作  20个


    微指令  38条


    ## （4）微指令字长的确定


    38 条微指令中有 19 条是关于后续微指令地址 → CMAR


    +   其中：

    +   - 1 条：OP（IR）→ 微地址形成部件 → CMAR

    +   - 18 条：Ad（CMDR）→ CMAR


    若用 Ad（CMDR）直接送控存地址线，则省去了输至 CMAR 的时间，省去了 CMAR


    同理，OP（IR）→ 微地址形成部件 → 控存地址线


    可省去 19 条微指令，2 个微操作


    38 − 19 = 19　　　　　　　　　20 − 2 = 18


    下地址字段最少取 5 位　　　操作控制字段最少取 18 位


