    \n图 9.5 单总线计算机结构\n\n## 三、多级时序系统\n\n- 指令周期\n- 机器周期\n- 时钟周期（节拍、状态）\n\n### 多级时序系统\n\
    \n机器周期、节拍（状态）组成多级时序系统\n\n一个指令周期包含若干个机器周期\n\n一个机器周期包含若干个时钟周期\n\nCLK\n\n节拍（状态）\n\
    T0 T1 T2 T3 T0 T1 T2 T3 T0 T1 T2 T3\n机器周期（取指令） 机器周期（取有效地址） 机器周期（执行指令）\n指令周期\n\n\
    节拍（状态）\nT0 T1 T2 T3 T0 T1 T2\n机器周期（取指令） 机器周期（执行指令）\n指令周期\n\n### 机器速度与机器主频的关系\n\
    \n机器的主频 f 越快，机器的速度也越快\n\n在机器周期所含时钟周期数相同的前提下，两机平均指令执行速度之比等于两机主频之比\n\nMIPS₁ / MIPS₂\
    \ = f₁ / f₂\n\n机器速度不仅与主频有关，还与机器周期中所含时钟周期（主频的倒数）数以及指令周期中所含的机器周期数有关\n\n## 四、控制方式\n\
    \n产生不同微操作命令序列所用的时序控制方式\n\n1. 同步控制方式\n\n   任一微操作均由统一基准时标的时序信号控制\n\n   ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_600_0.png)\n\
    \n   (1) 采用定长的机器周期\n\n   以最长的微操作序列和最繁的微操作作为标准\n\n   机器周期内节拍数相同\n\n   (2) 采用不定长的机器周期\n\
