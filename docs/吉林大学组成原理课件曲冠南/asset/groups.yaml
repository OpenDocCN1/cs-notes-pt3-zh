    # 1.2 计算机系统的基本组成


    # 一、冯·诺依曼计算机的特点


    +   1. 计算机由五大部件组成

    +   2. 指令和数据以同等地位存于存储器，可按地址寻访

    +   3. 指令和数据用二进制表示

    +   4. 指令由操作码和地址码组成

    +   5. 存储程序

    +   6. 以运算器为中心'
