    # 9. 相对寻址


    EA = (PC) + A


    A 是相对于当前指令的位移量（可正可负，补码）


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_456_0.png)


    +   - A 的位数决定操作数的寻址范围

    +   - 程序浮动

    +   - 广泛用于转移指令'
  - '[PAGE 457]


    # (1) 相对寻址举例


    ```

    LDA  # 0

    LDX  # 0

    M    ADD  X, D

    M+1  INX

    M+2  CPX  # N

    M+3  BNE  M

    DIV  # N

    STA  ANS

    ```


    * 相对寻址特征


    M 随程序所在存储空间的位置不同而不同


    而指令 BNE *-3 与指令 ADD X, D 相对位移量不变


    指令 BNE *-3 操作数的有效地址为


    ```

    EA = ( M+3 ) - 3 = M

    ```'
