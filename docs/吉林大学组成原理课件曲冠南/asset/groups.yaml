    \ 在组相联和全相联 Cache 中，则有多个块供选择。\n- 主要的替换算法有三种：\n  1. 随机法\n  2. 先进先出法 FIFO\n  3. 最近最少使用法\
    \ LRU\n- LRU 实现比较困难，实际上选择最久没有被访问过的块作为被替换的块。\n\n### 4. 四个基本问题——写策略\n\n（1）“写”访问有可能导致\
    \ Cache 和主存内容的不一致。\n\n（2）命中时，两种写策略。写策略是区分不同 Cache 设计方案的一个重要标志。\n\n- 写直达法（也称存直达法）：执行“写”操作时，不仅写入\
    \ Cache，而且也写入下一级存储器；优点：易于实现，一致性好。\n- 写回法（也称为拷贝回法）：执行“写”操作时，只写入 Cache。仅当 Cache\
    \ 中相应的块被替换时（脏块），才写回主存。（每一块设置“修改位”）优点：速度快，所使用存储器带宽较低。\n\n（3）采用写直达法时，若在进行“写”操作的过程中\
