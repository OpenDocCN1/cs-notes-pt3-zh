    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_143_0.png)


    - 刷新间隔：128 个存取周期

    - t_C = t_M + t_R，无“死区”

    - 读/写 + 刷新（存取周期为 0.5 μs + 0.5 μs）


    #### ③ 分散刷新与集中刷新相结合（异步刷新）


    对于 128 × 128 的存储芯片（存取周期为 0.5 μs），若每隔 15.6 μs 刷新一行：


    ![](img/62645fe4f2a56f5ae4c9e02b9997cbad_144_0.png)


    - 每行每隔 2 ms 刷新一次

    - “死区”为 0.5 μs

    - 将刷新安排在指令译码阶段，不会出现“死区”


    ### 3. 动态 RAM 和静态 RAM 的比较


    |  | DRAM | SRAM |

    |---|---|---|

    | 存储原理 | 电容 | 触发器 |

    | 集成度 | 高 | 低 |

    | 芯片引脚 | 少 | 多 |

    | 功耗 | 小 | 大 |

    | 价格 | 低 | 高 |

    | 速度 | 慢 | 快 |

    | 刷新 | 有 | 无 |


    主存：DRAM；缓存：SRAM

    '
