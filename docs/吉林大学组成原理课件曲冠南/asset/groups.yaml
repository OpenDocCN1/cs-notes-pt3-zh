    \ | 000100 | 0000001000 | 乘$x$得$(ax+b)x$,存于ACC中 |\n| 4 | 000011 | 0000001011 |\
    \ 加$c$得$ax^2+bx+c$,存于ACC |\n| 5 | 000010 | 0000001100 | 将$ax^2+bx+c$,存于主存单元 |\n\
