    # 4. 四个基本问题 – 写策略


    (1) “写”访问有可能导致Cache和主存内容的不一致


    (2) 命中时，两 种写策略


    写策略是区分不同Cache设计方案的一个重要标志。


    +   - 写直达法（也称为存直达法）

    +     执行“写”操作时，不仅写入Cache，而且也写入下一级存储器；

    +     优点：易于实现，一致性好；


    +   - 写回法（也称为拷贝回法）

    +     执行“写”操作时，只写入Cache。仅当Cache中相应的块被替换时（脏块），才写回主存。（每一块设置“修改位”）

    +     优点：速度快，所使用存储器带宽较低；


    (3) 采用写直达法时，若在进行“写”操作的过程中CPU必须等待，直到“写”操作结束，则称CPU写停顿。


    减少写停顿的一种常用的优化技术：


    采用写缓冲器'
