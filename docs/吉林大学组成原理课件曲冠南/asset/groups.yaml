    # 1.4 计算机硬件和体系结构的发展


    # 一、计算机的产生和发展


    +   - 第一台通用电子计算机诞生于1946年


    世界上第一台现代电子计算机“埃尼阿克”（LJC32），诞生于1946年2月14日的美国宾夕法尼亚大学，并于次日正式对外公布。ENIAC长30.48米，宽1米，占地面积约170平方米，30个操作台，约相当于10间普通房间的大小，重达30吨，耗电量150千瓦，造价48万美元。它包含了17,468真空管7,200水晶二极管，1,500中转，70,000电阻器，10,000电容器，1500继电器，6000多个开关，每秒执行5000次加法或400次乘法，是继电器计算机的1000倍、手工计算的20万倍。


    ENIAC于1955年退役。


