    \ DI 寄存器中\n- 指令字中少了一个地址字段，可缩短指令字长\n\n#### 4. 间接寻址\n\n地址指向 地址\n\n寻址特征\n\n主存\n\n\
    一次间址\n\n寻址特征\n\n主存\n\n多次间址\n\n多次访存\n\n- 缺点： 执行指令阶段 2 次访存\n- 优点： 可扩大寻址范围\n  便于编制程序\n\
    \n#### 5. 寄存器寻址\n\nEA = R_i   有效地址即为寄存器编号\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_450_0.png)\n\
    \n优点：执行阶段不访存，只访问寄存器，执行速度快\n\n寄存器个数有限，可缩短指令字长\n\n#### 6. 寄存器间接寻址\n\n寄存器 指向 地址\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_451_0.png)\n\n- 有效地址在寄存器中，操作数在存储器中，执行阶段访存\n\
    - 举例：数组访问\n\n#### 7. 基址寻址\n\n(1) 采用专用寄存器作基址寄存器\n\nEA = ( BR ) + A      BR 为基址寄存器\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_452_0.png)\n\n- 可扩大寻址范围\n- 有利于多道程序\n\
    - BR 内容由操作系统或管理程序确定\n- 在程序的执行过程中 BR 内容不变，形式地址 A 可变\n\n(2) 采用通用寄存器作基址寄存器\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_453_0.png)\n\
    \n- 由用户指定哪个通用寄存器作为基址寄存器\n- 基址寄存器的内容由操作系统确定\n- 在程序的执行过程中 R₀ 内容不变，形式地址 A 可变\n\n\
    #### 8. 变址寻址\n\nEA = (IX) + A    IX为变址寄存器（专用）\n通用寄存器也可以作为变址寄存器\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_454_0.png)\n\
    \n- 可扩大寻址范围\n- IX 的内容由用户给定\n- 在程序的执行过程中 IX 内容可变，形式地址 A 不变\n- 便于处理数组问题\n\n例 设数据块首地址为\
    \ **D**，求 **N** 个数的平均值\n\n7.3\n\n直接寻址\n\n```\nLDA   D\nADD   D + 1\nADD   D +\
    \ 2\n⋮\nADD   D + (N - 1)\nDIV   # N\nSTA   ANS\n```\n\n共 **N + 2** 条指令\n\n变址寻址\n\
    \n```\nLDA   # 0\nLDX   # 0        X 为变址寄存器\nADD   X, D       D 为形式地址\nINX   \
    \            (X) + 1 → X\nCPX   # N        (X) 和 #N 比较\nBNE   M          结果不为零则转\n\
    DIV   # N\nSTA   ANS\n```\n\n共 **8** 条指令\n\n#### 9. 相对寻址\n\nEA = (PC) + A\n\n\
    A 是相对于当前指令的位移量（可正可负，补码）\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_456_0.png)\n\
    \n- A 的位数决定操作数的寻址范围\n- 程序浮动\n- 广泛用于转移指令\n\n(1) 相对寻址举例\n\n```\nLDA  # 0\nLDX  #\
    \ 0\nM    ADD  X, D\nM+1  INX\nM+2  CPX  # N\nM+3  BNE  M\nDIV  # N\nSTA  ANS\n\
    ```\n\n* 相对寻址特征\n\nM 随程序所在存储空间的位置不同而不同\n\n而指令 BNE *-3 与指令 ADD X, D 相对位移量不变\n\n\
    指令 BNE *-3 操作数的有效地址为\n\n```\nEA = ( M+3 ) - 3 = M\n```\n"
