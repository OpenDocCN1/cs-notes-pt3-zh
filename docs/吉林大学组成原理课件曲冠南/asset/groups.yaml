    ### 二、RISC 的主要特征


    - - 选用使用频率较高的一些 简单指令，复杂指令的功能由简单指令来组合

    - - 指令 长度固定、指令格式种类少、寻址方式少

    - - 只有 LOAD / STORE 指令访存

    - - CPU 中有多个 通用 寄存器

    - - 采用 流水技术 一个时钟周期 内完成一条指令

    - - 采用 组合逻辑 实现控制器

    - - 采用 优化 的 编译 程序


    ### 三、CISC 的主要特征


    - > 系统指令 复杂庞大，各类指令使用频率相差大

    - > 指令 长度不固定、指令格式种类多、寻址方式多

    - > 访存 指令 不受限制

    - > CPU 中设有 专用寄存器

    - > 大多数指令需要 多个时钟周期 执行完毕

    - > 采用 微程序 控制器

    - > 难以 用 优化编译 生成高效的目的代码


    ### 四、RISC和CISC 的比较


    - 1. RISC更能 充分利用 VLSI 芯片的面积

    - 2. RISC 更能 提高计算机运算速度


    指令数、指令格式、寻址方式少，

    通用 寄存器多，采用 组合逻辑，

    便于实现 指令流水


    - 3. RISC 便于设计，可 降低成本，提高 可靠性

    - 4. RISC 有利于编译程序代码优化

    - 5. RISC 不易 实现 指令系统兼容


