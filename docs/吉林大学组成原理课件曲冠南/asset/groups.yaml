  - '[PAGE 303]


    # (4) 求补码的快捷方式


    设 $x = -1010$ 时


    则 $[x]_{补} = 2^{4+1} - 1010 = 11111 + 1 -1010$

    $= 100000$

    $- 1010$

    $= 1,0110$

    $= 11111 + 1$

    $- 1010$

    $= 10101 + 1$

    $= 1,0110


    又 $[x]_{原} = 1,1010$


    当真值为负时，补码可用原码除符号位外每位取反，末位加1求得'
