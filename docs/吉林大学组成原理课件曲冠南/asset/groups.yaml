    ### 3. 主存中存储单元地址的分配\n\n高位字节 地址为字地址\n低位字节 地址为字地址\n\n| 字地址 | 字节地址 |\n|--------|----------|\n\
    | 0      | 0 1 2 3  |\n| 4      | 4 5 6 7  |\n| 8      | 8 9 10 11|\n\n| 字地址 |\
    \ 字节地址 |\n|--------|----------|\n| 0      | 1 0      |\n| 2      | 3 2      |\n\
    | 4      | 5 4      |\n\n设地址线 24 根 按字节寻址 2^24 = 16 M\n\n若字长为 16 位 按字寻址 8 M\n\n\
    若字长为 32 位 按字寻址 4 M\n\n### 4. 主存的技术指标\n\n- (1) 存储容量\n  - 主存存放二进制代码的总位数\n  - 也可以用字节数来表示\n\
    - (2) 存储速度\n  - 存取时间\n    - 存储器的访问时间\n    - 读出时间 写入时间\n  - 存取周期\n    - 连续两次独立的存储器操作（读或写）所需的最小间隔时间\n\
    \    - 读周期 写周期\n- (3) 存储器的带宽\n  - 字/秒 字节/秒 位/秒\n\n### 二、半导体存储芯片简介\n\n### 1. 半导体存储芯片的基本结构\n\
