    \n## 存储器的基本组成\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_25_0.png)\n\nMAR 存储器地址寄存器\
    \ 反映存储单元的个数\n\nMDR 存储器数据寄存器 反映存储字长\n\n设 MAR=4位\n\nMDR=8位\n\n存储单元个数 16\n\n存储字长\
    \ 8\n\n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_25_1.png)\n\n(2)运算器的主要功能和组成\n\n\
    - • 完成算数和逻辑运算\n- • 所有的算数运算都能够通过加法来解决\n- • 进? === 数\n- • 出? ==》数\n\n## 运算器的基本组成及操作过程\n\
    \n![](img/62645fe4f2a56f5ae4c9e02b9997cbad_27_0.png)\n\n(3)控制器的主要功能\n\n- 整个机器的指挥机构\n\
    \  - 按照规定的操作进行 ==》 取/译/执\n  - 自动的进行 ==》 PC = PC+1\n  - 有秩序的进行 ==》 时序，时钟，节拍，脉冲\n\
    - 出？ ==》 指令地址\n- 进？ 《== 指令\n- 出？ ==》 控制信号\n"
