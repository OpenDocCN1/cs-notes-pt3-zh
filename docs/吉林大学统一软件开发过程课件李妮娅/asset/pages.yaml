- pgno: 129
  md: '# # 最初运作能力里程碑


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_129_0.png)


    +   - 最初运作能力里程碑要明确软件、场地、用户是否都准备好正常运行而没有将项目暴露在高风险下，这个版本通常被称为 **beta** 版本。

    +   - 评价准则回答以下问题：

    +     - 这个产品版本是否足够成熟稳定，可在用户群中实施？

    +     - 是否所有项目相关人员都准备好将产品向用户群推广？

