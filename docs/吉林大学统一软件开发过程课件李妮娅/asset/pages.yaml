- pgno: 265
  md: '假设建立业务模型的目的 是试图提高或重新设 计某个已存在的业务(情 景3,4,6)，可以同时给当 前业务和新业务建模


    假设建立业务模型的目 的是在一个草稿的基础 上开发一个或多或少的 新业务(情景5)，可以预 想新的业务并给新业务 建模，而跳过“描述当 前业务”


