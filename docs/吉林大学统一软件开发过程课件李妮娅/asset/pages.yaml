- pgno: 101
  md: '# 迭代技术的问题


    +   迭代技术容易说明，但不容易做到：


    +   - 如何将各个迭代阶段的成果聚合合成一个产品


    +   - 如何避免在混乱中开始一个周期


    +   - 每个迭代开发周期中你要选择做什么


    +   - 每个周期中应考虑哪些需求以及有什么样的风险


    +   - 迭代方法如何解决我们以前提出的主要问题


    +   本章剩下的部分及第7章中给出答案'
  merge: -1
  img_proc: true
- pgno: 102
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 103
  md: '迭代过程一般分为四个阶段：初始、细化、构造和移交，简称为I,E,C和T。每个阶段以一个重要的里程碑结束。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_103_0.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 四个阶段的任务(一)


    +   - 初始(Inception)阶段

    +     - 确定最终产品的构想及其业务用例、并定义项目范围

    +     - 初始阶段以生命周期目标(LCO)里程碑为结束点

    +   - 细化(Elaboration)阶段

    +     - 计划出必须完成的活动和需要的资源；详细说明产品特性并设计架构

    +     - 细化阶段以生命周期构架(LCA)里程碑为结束点'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 四个阶段的任务(二)


    +   - 构造(Construction)阶段

    +     - 构造整个产品，逐步完善视图、构架和计划，直到产品(完整的构想)已完全准备好交付给用户。

    +     - 构造阶段以最初运作能力(IOC)里程碑为结束点。

    +   - 移交(Transition)阶段

    +     - 移交产品给用户，包括制造、交付、培训、支持及维护产品，直至用户满意。

    +     - 移交阶段以产品发布版本里程碑为结束点，这也是整个周期的结束点。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   - I,E,C,T这四个阶段构成了开发周期，当周期结束时产生一代软件产品。

    +   - 软件产品重复IECT这个过程，从而发展成为下一代产品。

    +   - 在不同的周期产品开发的重点是不同的。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_106_0.png)'
  merge: -1
  img_proc: true
- pgno: 107
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 108
