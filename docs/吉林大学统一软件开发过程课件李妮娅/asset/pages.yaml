- pgno: 26
  md: '# 1.7 可视化建模


    +   建模帮助开发团队将一个系统构架的结构和行为可视化、具体化、结构化，并写出文档记录。


    模型是现实的简化，它从一个特定的角度完整地描述了一个系统。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '可视化建模可以帮助开发团队提高管理复杂软件的能力。


    +   - 捕获架构和组件的结构和行为

    +   - 展示系统各个要素之间的协作方式

    +   - 维护设计和实现之间的一致性

    +   - 促进清晰的交流


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_27_0.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 可视化建模能够...


    +   - 毫无二义性地说明行为

    +   - 毫无二义性地理解软件设计

    +   - 非模型和不灵活的构架被暴露出

    +   - 必要时可以隐藏细节

    +   - 容易揭示不一致性'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.8 验证软件质量


    +   - 完成软件实施之后再去查找并修改软件问题要比早期进行这项工作多花100到1000倍的费用。因此从功能、可靠性、应用性和系统性能等多方面不断地对软件质量进行评估是非常重要的。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 软件质量验证能够...


    +   - 客观评估项目状况(评价的是检测结果，而非书面文档)

    +   - 揭示出需求、设计和实现中的不一致

    +   - 关注高风险领域，提高这些领域的质量水平和效率

    +   - 提早发现缺陷，从而降低修改成本

    +   - 测试功能、可靠性和性能'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 1.9 控制软件变更


    +   - 迭代开发软件密集型系统面临的最大挑战：

    +     - 安排不同组、不同地点的开发人员同时工作于多个迭代过程、发布版本、产品和平台中。

    +   - 为解决上述问题，要建立用于管理软件变更和其他开发制品变更的循环工作流：

    +     - 根据项目的优先级和风险分配资源

    +     - 根据变更动态地管理工作

    +   - 每次迭代过程结束时应建立并发布一个已检测过的基线'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 控制软件变更能够...


    +   - 定义需求变更的工作流，并不断重复这个工作流

    +   - 变更请求促进了更加清晰的交流

    +   - 为开发人员建立独立的工作空间，减少平行工作之间的干扰

    +   - 变更率为客观评价项目状况提供了很好的度量

    +   - 工作空间包括了所有制品，有益于保持一致性

    +   - 变更的产生和传播是可评价和可控制的

    +   - 可以在一个健壮的定制系统中维护变更'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.10 Rational统一过程


    +   - 软件开发过程的四个行为:

    +     - 为开发小组的活动顺序提供向导

    +     - 详细说明哪些制品将被开发，以及什么时候开发

    +     - 指导每一个开发人员和整个开发组的工作

    +     - 为监控和度量项目的产品和活动提供准则


    Rational统一过程将6大最佳实践活动以一种适当的形式结合起来，从而适应了广泛的项目和开发组织。'
  merge: -1
  img_proc: true
