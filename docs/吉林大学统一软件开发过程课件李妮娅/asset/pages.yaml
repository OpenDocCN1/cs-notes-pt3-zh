- pgno: 217
  md: '# 项目评审员执行


    +   □ 项目计划评审活动


    该工作流细节的目的是制定软件开发计划的构件及其附件，然后针对可行性和项目相关人员的可接受性，对这个计划进行正式评审，并将它作为制定下一个迭代的精细计划的基础


    制作这些制品所需工作量主要集中在初始阶段早期；而后，在每个迭代开始时激发这个工作流细节，根据已完成的迭代中获得的经验，结合下一个迭代的计划，修改软件开发计划'
