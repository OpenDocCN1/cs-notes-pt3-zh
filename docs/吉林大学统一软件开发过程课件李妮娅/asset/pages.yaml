- pgno: 110
  md: '# # 阶段与迭代


    每个阶段都可以迭代地进行开发，每个阶段都包含了一个或几个迭代过程。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_110_0.png)'
  merge: -1
