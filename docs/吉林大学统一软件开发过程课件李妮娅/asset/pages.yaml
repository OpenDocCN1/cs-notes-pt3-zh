- pgno: 224
  md: '# 如何制定一个阶段计划


    +   - 需要对项目有一个大致了解

    +     - 工作量

    +     - 最终版本的发布日期

    +   - 从结束日期往前推移，计划每个重要里程碑的假设日期

    +     - 权衡人员配备、进度和范围

    +     - 橡皮泥剖面图'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/75c19a0b3beca8d57ae1411ebd6944cc_225_0.png)


    典型的项目剖面图显示了每个阶段大致持续时间和工作量


    # 表7-1 一个典型项目各个阶段持续时间和工作量的相对比例


    | 阶段 | 持续时间 | 工作量 |

    | --- | --- | --- |

    | 初始阶段 | 10% | 5% |

    | 细化阶段 | 30% | 20% |

    | 构造阶段 | 50% | 65% |

    | 移交阶段 | 10% | 10% |'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 上述分配比例适用的项目特点


    +   - 中等规模、中等工作量

    +   - 处于最初开发周期

    +   - 没有事先已存在的构架

    +   - 仅存在很少的风险和未知因素'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 迭代的个数


    +   - 在初始化阶段

    +     - 目标是尽快得到所有问题的答案

    +     - 没有实际的迭代，没有软件被开发出来，仅仅是制定计划和做一些市场调查

    +     - 只在要完成下列任务时需要使用迭代方法

    +       - 建立原型，为了验证设想的正确性

    +       - 建立原型，为了缓解主要技术风险

    +       - 通过工具和过程使开发组织加快开发速度

    +   - 初始化阶段有一个迭代，或者根本没有'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 在细化阶段


    +   - 至少要计划一个迭代

    +   - 如果没有现成的构架，而且有很多新的因素要协调(新员工、新工具、新技术、新平台)，那么就要计划2到3个迭代用于处理风险

    +     - 向用户展示原型

    +     - 更改架构中的缺陷


    # 细化阶段需要1到3个迭代'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - 在构造阶段

    +     - 至少要计划一个迭代

    +     - 为了更好的集成和测试工作，2个迭代更合理

    +     - 自动化水平较高和过程较成熟的情况下，为了提高项目水平，也可以3个或更多迭代

    +   - 构造阶段需要1到3个迭代

    +   - 在移交阶段

    +     - 至少要计划一个迭代

    +       - 在beta版本之后发布最终版本

    +     - 市场的现实情况或最初版本的质量问题会导致更多迭代

    +   - 这个阶段需要1到2个迭代'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 在整个开发周期中[IECT],可以分成3种水平


    +   - 低水平:3个迭代[0,1,1,1]

    +   - 一般情况:6个迭代[1,2,2,1]

    +   - 高水平:9个迭代[1,3,3,2]

    +   - “正常的”项目需要6±3个迭代，称之为“6加减3”经验'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 7.8 制定一个迭代计划


    +   - 迭代计划要精确地描述迭代中每个时间段上都有什么事情发生，将活动分配给工作人员(worker)，再将个人分配给工作人员

    +   - 要将迭代的长度和为它分配的资源看作是边界框

    +   - 要根据时间制定计划，而不是根据工作量制定计划'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 制定一个迭代计划必须遵循以下步骤


    +   - 定义迭代成功的目标准则

    +   - 明确要开发或更新哪些具体的、可度量的制品以及要完成的活动

    +   - 从一个典型的迭代工作分解结构开始，并考虑当前必定要发生的实际活动

    +   - 估计每个活动的持续时间和工作量，注意要控制在预算的资源范围之内'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 细化阶段的迭代


    定义细化阶段的迭代目标，有3个主要驱动：


    +   □风险(最重要)


    +   ■尽早缓解或消除风险


    +   □覆盖


    +   ■确保构架涵盖了要开发的软件的所有方面


    +   □关键程度


    +   ■确保系统包含了关键功能和服务，即使没有可察觉到的风险与它们相联系'
  merge: -1
  img_proc: true
- pgno: 234
  md: '对于大多数破坏性的风险，在一个用例中确定一个情景就可以让开发团队注意到这个风险：


    +   1) 假设有一个集成风险，如“数据库D可以在操作系统Y上工作”，即使这是一个合适的数据库，也要确保用况中包括了一个涉及到与数据库交互的情景。

    +   2) 假设有一个性能风险，如“计算飞行器轨道所需的时间过多”。你要确保用况中包含了涉及到这个计算过程的情景，至少要包括那些最明显最频繁发生的情况。


    对于关键程度，要确保用例包含了系统需要提供的最基本的功能和服务。从用例中选择一些情景代表最普遍或发生频率最高的服务和性能的形式'
  merge: -1
  img_proc: true
- pgno: 235
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 236
  md: "# 细化阶段迭代的例子\n\n+   - 在客户工作站创建一个电话用户的记录，并将该记录存储在在服务器端的数据库中。  \n+     - 该情景涉及关键功能和集成风险(数据库和服务端系统)\n\
    +   - 确保至少能创建20000个电话用户，并且访问一个电话用户耗时不超过200毫秒。  \n+     - 该场景处理了主要性能问题（数据量和相应事件），假如没有达到这些要求，可能会严重影响构架\n\
    +   - 撤销对一个电话用户地址的变更。  \n+     - 这个情景选择了一个简单的功能，促使你去思考所有“撤销”功能的涉及。然后与最终用户流\n+\
    \   - 完成与供应链管理相关的所有用例。  \n+     - 细化阶段的目标之一就是捕获需求"
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 构造阶段的迭代


    +   - 构造阶段里，风险仍旧是关键驱动，尤其是那些还未发现的新风险和悬而未决的风险。

    +   - 用例的完成也是驱动。可以一个特性一个特性地计划迭代，尽早地完成比较关键的特性，这样就可以在不只一个迭代中对它进行彻底地测试。

    +   - 构造结束时，主要目标是确保覆盖了所有的用例'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# 构造阶段迭代的例子\n\n+   1) 实现所有呼叫转接的变体，包括错误的变体。这是一系列相互联系的特性。\n+   \n+   2) 完成所有电话拨线员特性，除了夜间服务。这属于另一组特性。\n\
    +   \n+   3) 在两台计算机设备上达到每小时5000次交换。这将提高在前面迭代中达到的实际性能值（2357次交换/小时）。\n+   \n+  \
    \ 4) 集成地理信息系统的新版本。这个目标对构架是一个适当的修改，也可能是由于早先发现的问题做出的必要修改。\n+   \n+   5) 修改所有1级和2级缺陷。修复在前面迭代测试中发现而没有立即改正的缺陷。"
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 移交阶段的迭代


    +   - 此阶段的主要目标是完成这一代产品。

    +   - 每个迭代的目标表述为修复了哪些缺陷，提高了哪些性能或可用性

    +   - 假如之前为按时结束构造阶段曾抛下某个特性，在对当前已完成部分没有危害的情况下，现在可以完成或启动这些特性'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 移交阶段迭代的例子


    +   1) 修改所有在beta客户站点中发现的严重性为I级的问题。这个目标从质量的角度出发，将关系到产品在市场中的信誉度。


    +   2) 消除所有由于数据不匹配产生的系统启动故障。这是另一个从质量角度出发的目标。


    +   3) 达到每分钟2000次交换。这属于性能上的调节和优化：涉及到数据结构的改变、高速缓冲和更聪明的算法。


    +   4) 将不同的对话框的数量减少30%。通过减少视觉混乱以提高可使用性。


    +   5) 完成德文和日文版本。Beta版本仅仅是给英语用户使用的，因为是没有时间完成其它语言版本，也是为了减少对beta版本的重写。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# # 迭代中的工作细节


    当选择好将要开发的情景或成熟的用例(加上要修复的缺陷)并将他们大致描述后，要明确哪些制品将要受到影响：


    +   □哪些类将要重新访问

    +   □哪个子系统会受到影响或要新建哪个子系统

    +   □哪些界面可能要修改

    +   □哪些文档必须更新'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 确定在Rational统一过程中涉及到的活动并将它们包含在计划中。


    +   □ 有些活动要在每个迭代中执行1次(如制定1个迭代计划)，还有些活动则要在每个类、每个用例或每个子系统中都执行1次(如设计1个类)

    +   □ 大多数过程中描述的活动都小到可以在几个小时或几天之内由一个人或一个团队来完成

    +   □ 当发现迭代没有足够的时间完成预定工作时，不要扩展迭代(这样会拖延移交时间或减少迭代数量)，而要降低迭代的目标。根据当时处于什么阶段，简化情景或减少功能'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 7.9 小结


    +   - **Rational**统一过程中的项目管理工作流对于平衡相互竞争的目标、管理风险和克服障碍以交付一个满足客户和最终用户需求的产品是非常有用的

    +   - 在迭代中，开发应该以阶段计划和一系列迭代计划为基础

    +   - 风险是计划的驱动器

    +   - 度量是用于控制项目的关键技术

    +   - 在制定阶段计划时，必须顾及人员配备、进度和项目范围之间的权衡关系

    +   - 每个阶段对于迭代范围定义的准则是不相同的'
  merge: -1
  img_proc: true
