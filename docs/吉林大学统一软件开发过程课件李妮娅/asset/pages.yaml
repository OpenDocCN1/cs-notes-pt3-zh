- pgno: 387
  md: '# 14.1 目的


    +   - 环境工作流的目的是通过使用过程和工具支持开发组织

    +     - 工具的选择和获取

    +     - 安装工具和配置工具、使其适应开发组织

    +     - 过程配置

    +     - 过程改进

    +     - 提供技术服务以支持过程：信息技术基础设施、账户管理和备份工作等'
