- pgno: 9
  md: "# 1.1 软件的价值\n\n+   - 软件以一种前所未有的方式和形式帮助我们产生和获得信息，并使信息可视化。  \n+     - 从全球范围看，软件业的飞速发展推动着世界经济更快地向前发展。\
    \  \n+     - 从个人角度看，软件可以辅助治疗疾病，甚至模拟人类感官。  \n+   - 各种在技术上可行且有社会需求的软件密集型系统在规模、复杂性、分布和重要性上都在不断扩张。\n\
    \n这种扩张带来了一系列的技术问题和组织问题。生产和维护软件产品变得越来越难。"
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 1.2 软件开发问题的症状和根本原因


    +   - 对于最终用户的需要理解得不够精确

    +   - 对需求的改变束手无策

    +   - 程序块不兼容

    +   - 软件不易维护或不易扩展

    +   - 对项目严重缺陷的发现较晚

    +   - 软件质量低劣

    +   - 软件性能无法接受

    +   - 开发人员按各自的方式进行开发，软件很难重组

    +   - 一个不可靠的构造和发布过程


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_10_0.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 造成失败的原因


    +   - 特别的需求管理

    +   - 模糊和不精确的交流

    +   - 脆弱的构架

    +   - 过度复杂

    +   - 未检测出需求、设计和实现之间不一致

    +   - 测试的不足

    +   - 对于项目状况的评估过于主观

    +   - 未解决存在的风险

    +   - 无法控制变化的产生和传播

    +   - 自动控制不足'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.3 最佳的软件实践


    +   - **最佳实践：** 以一种循环的、可预测的方式开发和维护高质量的软件产品。

    +     - 在商业运作中已经证明这是一种能解决软件开发过程中根本问题的方法。

    +   - **软件开发的六大最佳实践**

    +     - 迭代式开发

    +     - 管理需求

    +     - 基于组件的体系结构

    +     - 可视化建模

    +     - 验证软件质量

    +     - 控制软件变更'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # 六大最佳实践的关系


    Manage Requirements


    Develop Iteratively


    Model Visually


    Verify Quality


    Use Component Architectures


    Control Changes'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1.4 迭代式开发

    Develop Software Iteratively


    +   - why

    +     - 随需求变化和理解深入，最初的设计很可能会出现问题。

    +     - 如果设计问题直到后期才被发现，则很有可能导致费用超支，甚至项目失败。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # 瀑布式生命周期

    Waterfall Development: Risk vs. Time


    +   - 需求分析

    +   - 设计

    +   - 编码和单元测试

    +   - 子系统测试

    +   - 系统测试


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_15_0.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 瀑布式方法的问题


    +   - 这种方法最大的问题是，将风险留到后面的阶段。

    +   - 一个早期的设计可能并没有注意到系统的关键需求，而在后期发现设计中的缺陷可能导致巨额的花费，甚至是项目的失败。

    +   - 瀑布式方法会掩饰项目中真正的风险


    > 假如你不积极地解决你的项目中存在的风险，它们就会积极地解决掉你。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 另一个瀑布方法：一个迭代和递增的过程


    这种方法是一个连续地发现、创造和实现的过程。在每个迭代过程中，促使开发小组以一种循环的、可预测的方式驱动项目制品的生产和制作。


    初始计划


    计划


    需求


    分析和设计


    实现


    实施


    测试


    管理环境


    评价


    每个迭代过程产生一个可执行的发布版本


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 迭代开发能够...


    +   及早发现和修正一些错误的的需求理解


    +   鼓励用户反馈信息，以明确系统的真实需求


    +   使开发小组重视项目中最关键的问题


    +   通过不断的迭代测试给出项目状况的客观评价


    +   尽早发现需求、设计和实现中的不一致


    +   更加平均的分配各环节的工作量


    +   在开发中学习和改进


    +   通过具体证据了解项目状况'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.5 管理需求


    > 需求是系统必须达到的条件或性能


    +   - 管理软件密集型系统的需求的难点在于动态性：需求在整个软件生命周期中是变化的。

    +     - 确定一个系统的真正需求是一个连续的过程。

    +     - 一个新系统或升级系统的出现也会改变用户对系统需求的理解。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 动态需求管理包括三项活动：


    +   - 提取、组织系统的功能和约束，并将它们写成文档；

    +   - 估计需求的变化，评估它们会产生的影响；

    +   - 跟踪并记录双方商议的决定。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 管理需求能够...


    +   - 规定原则性的方法

    +   - 人员之间的交流建立在已定义的需求之上

    +   - 区分需求的优先级、对需求进行过滤和跟踪

    +   - 尽可能对功能和性能作出客观评价

    +   - 更容易发现系统中的不一致性

    +   - 借助适当的工具支持，运用到外部文档的自动链接，可以为系统的需求、特性和踪迹提供一个知识库。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.6 基于组件的体系结构


    一个系统的构架决定：


    +   - 软件系统的组织

    +   - 构成系统的结构元素及其界面

    +   - 结构元素的行为，通过这些元素之间的协作来说明

    +   - ...


    > 构架'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 构架要考虑的因素


    +   - **基本因素**：结构、行为

    +   - **其他因素**：用途、功能、性能、弹性、重用、经济和技术限制，美学等等。

    +   - 建立弹性的构架是非常重要的，它的好处在于：

    +     - 大幅度提高重用率

    +     - 使软件和硬件相互独立，从而更加适应变化

    +     - 提高可维护性'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 一个基于组件的软件构架


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_24_0.png)


    购买的


    已有的


    新的


    用户界面


    用户界面


    业务规则


    数据库


    数据库


    +   - 已有的组件

    +   - 已购买的组件

    +   - 新的组件'
  merge: -1
  img_proc: true
