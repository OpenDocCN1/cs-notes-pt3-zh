  md: '仅需要领域建模，则走此路径，领域建模以及模型中的业务实体被认为是业务对象模型的子集


    如果没有必要对业务过程进行重要的改动，只需绘制这些已经存在的过程，并从中寻找系统需求(情景1)。有时可以跳过“描述当前业务”


    [早期的初始]


    评估业务状态


    [业务建模]


    识别业务过程


