  md: '# 4.2 克服困难的方法：迭代式开发


    一个迭代过程


    时间


    R:需求分析

    D:设计

    C:编码，单元测试

    T 集成，测试


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_100_0.png)'
  merge: -1
