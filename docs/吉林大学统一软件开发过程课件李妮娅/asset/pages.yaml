- pgno: 392
  md: '# 为迭代准备环境的目的的是：


    +   ● 完成开发案例,为迭代做好准备

    +   ● 准备在迭代中使用的工具,需要时将其客户化

    +   ● 验证工具是否已经正确地配置和安装

    +   ● 生成一个在迭代中使用的项目专用模板集

    +   ● 培训人员,使他们能够使用并理解工具和开发案例


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_392_0.png)'
  merge: -1
