- pgno: 274
  md: '# # 9.1 目的


    +   - 在系统将做什么以及为什么这样做的问题上与客户和其他项目相关人员达成协议,并维护这个协议

    +   - 给系统开发人员提供对系统需求更好的理解

    +   - 定义系统边界

    +   - 为计划迭代过程中的技术内容提供基础

    +   - 为估计开发系统需要的成本和时间提供基础

    +   - 定义系统的用户界面,主要关注用户需求和目标'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - 为达成这些目的,需求工作流描述了如何定义系统构想并将这个构想转化成用例模型

    +   - 这个用例模型和补充规格说明书定义了详细的系统软件需求

    +   - 需求工作流还描述了如何使用需求属性来帮助管理系统范围和需求的变更'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 9.2 什么是需求


    +   - 需求：系统必须满足的条件或具备的能力。

    +   - 软件系统质量属性分为(FURPS)

    +     - 功能性(功能性)

    +     - 使用性(Usability)

    +     - 可靠性(Reliability)

    +     - 性能(Performance)

    +     - 可支持性(Supportability)


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_276_0.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 功能性需求


    +   - 功能性需求描述了系统必须有能力执行的动作

    +   - 功能性需求通过详细说明所期望的输入和输出条件来描述系统行为'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 非功能性需求


    +   - 非功能需求使最终用户获得期望的系统质量，它们对于用户群来说和功能性需求一样重要

    +   - 使用性(usability)

    +     - 使用性需求是指人为因素(审美学、易学性、易用性等)和用户界面、用户文档、培训资料的一致性。

    +   - 可靠性(reliability)

    +     - 可靠性需求是指失败的频率和失败严重性、可恢复性、可预测性和准确性'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 性能(performance)


    性能需求是指在功能性需求上施加的条件，例如，需求详述了交换率、速度、有效性、准确性、响应时间、恢复时间和内存使用，同时还加上了必须执行某个活动的条件。


    # 可支持性(supportability)


    可支持性需求是指易测性、可维护性和其他在系统发布后维持系统更新需要的质量。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '实际上，争论一个特定需求是使用性需求还是可支持性需求没有任何价值。


    定义需求类型的目的是为找到需求和评估对需求理解的完整性提供一个模板


    一旦理解了这些需求的分类，那么在投入到开发工作之前就能够对关键性需求有了深刻的理解


    某个特定的可靠性需求可能暗含于某个功能性需求中，而发现这个可靠性需求与发现这个功能性需求同样重要


    没有满足隐含的可靠性需求或性能需求的系统与没有满足明显的可靠性需求或性能需求的系统一样不好'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 9.3 需求的种类


    +   - 项目相关人员的需求

    +   - 系统特性的需求

    +   - 软件需求'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 项目相关人员的需求


    +   - **项目相关人员：** 是指对一个工程的结果有投入或有既定兴趣的任何人或组织的代表

    +     - 如最终用户、购买者、订阅人、开发人员、项目经理

    +     - 任何足够关心这个项目的人

    +     - 项目需要满足其需求的人


    +   - **如何获取这类需求？**

    +     - 早期通过访谈、调查问卷和专题讨论会等形式收集

    +     - 收集变更请求、升级请求和缺陷报告

    +     - 这类需求为产品需求提供了关键输入，由此决定什么是系统行为和它为什么是系统行为'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 系统特性的需求


    +   - 系统特性：是指对系统行为高度抽象的描述

    +     - 抽象描述：我希望我的车有自动防滑系统

    +     - 具体描述：我希望我的车能有一个可以控制每个轮子的计算机控制系统

    +     - 抽象描述：需要一个“e-mail自动提示”

    +     - 具体描述：我需要和Joe保持实时交流

    +   - 从技术上说，特性是系统提供的能直接满足用户需求的服务

    +   - 特性的获取要通过自然语言讨论并同项目相关人员进行交流

    +   - 特性上要附加不同的属性——例如风险、工作量、客户优先级，从而增加了对系统的理解和认识'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 软件需求


    +   - 仅仅理解项目相关人员的需求和系统特性都不足以与开发人员交流系统究竟应该做些什么

    +   - 还需要一个附加规格说明，将这些需求和特性翻译成为可以设计、实现和测试的详细说明，从而验证系统的一致性

    +   - 规格说明中必须处理系统的功能性需求和非功能性需求'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 9.4 捕获需求和管理需求


    +   - 在需求表述中寻找共同的结构


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_285_0.png)'
  merge: -1
  img_proc: true
- pgno: 286
  md: '+   1 收集项目相关人员的请求

    +     □ 包括从最终用户、客户和市场及其他项目相关人员处得到的所有请求和希望清单


    +   2 开发构想文档

    +     □ 构想文档中要包括项目相关人员和用户的关键需要，以及系统的高级特性

    +     □ 构想文档中包括的特性取决于对于实现特性所需成本的分析以及对于这项投入所得利润的预测'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 3 细化软件需求


    +   - [ ] 我们可以在用例模型和补充规格说明中捕获详细需求，补充规格说明中应捕获那些不适用于用例的其它需求

    +   - [ ] 详细需求在设计模型和最终用户文档中实现，并在测试模型中验证


    # 需求工作流要以迭代的形式不断重复，直至明确了所有的需求，也考虑了所有反馈，并做出了必然的变更'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 9.5设计以用户为中心的界面


    +   - 用户界面设计指的是至少以下两件事之一：

    +     - 可视化地确定用户界面，以使它可以处理不同使用需求

    +     - 从设计类（和构件，例如ActiveX类和JavaBeans）角度进行用户界面设计，这些设计类与其他处理业务逻辑、一致性等问题的设计类相关联，这样的设计会引导最终用户界面的实现

    +   - 在需求工作流中，我们在以上定义的第1种情况下进行操作，力图完成一个以用例为中心的设计'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 9.6 需求

    工作流


    分析问题


    理解项目相关人员的需要


    定义系统


    管理系统的范围


    精化系统定义


    管理变更需求


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_289_0.png)'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 分析问题


    +   - 对需要解决的问题陈述达成一致；

    +   - 确定项目相关人员；

    +   - 确定系统的边界和约束


    # 理解项目相关人员的需求


    +   - 使用不同的抽取技术，收集项目相关人员的请求

    +   - 清楚地理解系统用户和项目相关人员的真正需求


    # 定义系统


    +   - 根据项目相关人员的输入，明确要交付的一系列系统特性

    +   - 确定用于制定优先级的准则，并与项目相关人员合作来预计要交付的特性

    +   - 确定每一个关键特性需要的参与者和用例。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 管理系统的范围


    +   - [ ] 收集项目相关人员掌握的项目重要信息，将它们作为需求属性，同需求一起进行维护，从而可以根据客户的期望按时、按预算交付产品。


    # 精化系统定义


    +   - [ ] 通过用例模型细化系统软件需求，就系统需要具备什么样的功能这一问题上与客户达成一致

    +   - [ ] 捕获其他重要需求，如非功能性需求、设计约束等。


    # 管理变更需求


    +   - [ ] 应用需求属性和可跟踪性来评估变更需求所产生的影响

    +   - [ ] 应用一个中央控制机制控制需求的变更

    +   - [ ] 维持与客户达成的一致，并预计哪些特性要交付'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 9.7 需求分析中的工作人员


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_292_0.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 系统分析员


    大致描述系统的功能和界定系统，领导并协调需求抽取和用例建模


    # 用例描述员


    通过一个或多个用例描述需求，细化系统的所有功能或部分功能


    # 用户界面设计师


    负责挑选用例，以显示用户和系统之间的基本交互作用。同用户一起工作，将这些用例开发为用例情景板，并开发一个用例界面原型以帮助确定系统的最终需求'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 9.8 需求分析中使用的制品


    +   - 构想文档

    +   - 用例模型

    +   - 补充规格说明

    +   - 术语表

    +   - 用例情景板

    +   - 用户界面原型


    后三个制品是对前三个制品的有益补充'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 构想文档


    +   - 详细说明主要的需求和特性

    +     - 构想文档是从客户角度写成的，关注系统基本特性和可接受的质量水平

    +     - 同时说明操作能力、用户概况以及与系统外部实体交互作用的可应用接口

    +   - 为要开发的软件系统提供了完整的构想，并支持资金筹备方和开发组织之间的契约

    +     - 构想文档提供给项目人员需求可视化的契约性基础'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 用例模型


    +   - 充当交流媒介，在客户、用户和系统开发人员之间充当关于系统功能的契约

    +     - 使客户和用户确定系统向他们所期望的方向发展

    +     - 使系统开发人员开发出所期望的系统

    +   - 用例模型由用例和参与者组成

    +     - 用例显示了系统是如何与参与者进行交互的，以及系统在用例中做了什么

    +     - 在系统分析、设计、实现和测试中还会使用同样的用例模型'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 补充规格说明


    +   - 是用例模型的重要补充，两者相加才能捕获所有需要描述的系统需求(功能性需求和非功能性需求)，才能充当完整的软件需求说明'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# 9.9 工具支持


    +   - **Rational RequisitePro**提供了需求捕获和需求管理支持，以含有重要属性的文档和需求知识库的形式出现，用于管理需求范围和需求变更

    +   - **Rational Rose**在用例模型、用例情景板和边界类中给参与者和用例提供了自动支持

    +   - **Rational SoDA**是一种自动生成文档工具。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 9.10 小结


    +   - 需求管理需要项目相关人员和开发团队在系统应该做什么的问题上达成协议，并由专门团队进行维护

    +   - 对于典型的项目，要考虑几种类型的需求，包括高级特性、详细的功能性需求和非功能性需求以及用例

    +   - 维护需求属性和可跟踪性是在整个项目生命周期中有效地管理项目范围和处理变更需求的关键

    +   - 用户界面设计关注关键需求和用户目标，以建立一个以用户为中心的系统并满足使用性需求

    +   - Rational工具支持捕获需求、可视化建模、需求管理及其属性和可跟踪性'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 第10章 分析和设计

    工作流'
  merge: -1
