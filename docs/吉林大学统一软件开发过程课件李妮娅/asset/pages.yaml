- pgno: 301
  md: '# 目录


    +   - 10.1 目的

    +   - 10.2 分析与设计

    +   - 10.3 到底要设计到什么程度

    +   - 10.4 工作人员和制品

    +   - 10.5 设计模式

    +   - 10.6 分析模型

    +   - 10.7 接口扮演的角色

    +   - 10.8 实时系统的制品

    +   - 10.9 基于构件的设计

    +   - 10.10 工作流

    +   - 10.11 工具支持

    +   - 10.12 小结'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 10.1 目的


    +   - 分析和设计工作流的目的是将需求翻译为规格说明,它描述如何实现系统。

    +   - 即将系统需求转变为一组类和子系统的形式


    在项目的早期，要建立一个强壮的框架，从而可以设计一个易于理解、开发和进化的系统。

    然后调整设计，使之适应实现环境，并设定它的性能、强壮性、可升级性、可测试性以及其他质量特性。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 10.2 分析与设计


    +   - 分析关注的是要确保处理系统的功能性需求。

    +   - 为了简化，在分析时忽略了许多非功能性需求，以及实现环境的约束。

    +   - 分析最终展现的是一幅近乎理想的系统画面

    +   - 设计的目的是使分析的结果适应于非功能性需求、实现环境等带来的约束。

    +   - 设计是分析的精化。

    +   - 设计关注的是要确保完全覆盖需求以及系统设计的优化。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# 10.3 到底要设计到什么程度


    +   - 设计必须正好足够定义该系统，才能无歧义地实现该系统

    +     - “足够”随着项目的不同而不同，随着公司的不同而不同

    +   - 设计可能会细化到使代码完全依赖设计而实现

    +   - 设计也可能仅仅勾画一个草图，即细化到使实现人员了解需要开发哪些构件'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 规格说明的详细程度


    取决于实现人员的专业知识和技能、设计的复杂程度，以及由于可能误解设计而带来的风险


    # 双向工程


    如果设计非常精确，代码就可以完全依赖于设计，就可以采用双向工程的方法使代码与设计保持同步，从而避免了一个转换步骤和一个潜在的错误来源'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# 设计是可执行的


    +   如果设计的完整程度和精确程度都非常高，以至于可以通过解释设计或者从设计快速生成少量代码来直接执行变换，使这种变换对于设计师几乎是不可见的，从而使设计看起来就是“可执行的”'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 10.4 工作人员和制品


    +   - 分析和设计工作流中涉及到的主要工作人员如下：

    +     - 构架师

    +     - 设计师


    +   - 还可能包括以下工作人员：

    +     - 数据库设计师

    +     - 封装设计师

    +     - 构架评审员和设计评审员'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/75c19a0b3beca8d57ae1411ebd6944cc_308_0.png)


    # 构架师


    +   - 构架师在整个项目中领导和协调技术活动和制品。

    +   - 构架师为每个构架视图建立总体结构：视图的分解，元素的分组，以及各主要分组之间的接口的视图

    +   - 构架师的视图要更注重宽度而不是深度'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/75c19a0b3beca8d57ae1411ebd6944cc_309_0.png)


    # 设计师


    +   - 设计师定义了职责、操作、属性、一个或多个类之间的关系，并决定如何调整它们使之适应实现环境。

    +   - 设计师还要负责一个或多个设计包或设计子系统，包括所有属于这些包或这些子系统的类。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   - 数据库设计师

    +     - 当系统中包含数据库时，就需要数据库设计师

    +   - 封装设计师

    +     - 主要任务是通过适当地使用当前的设计工具，确保系统可以及时地对事件做出反应

    +   - 构架评审员和设计评审员

    +     - 负责评审在分析和设计工作流中生产的关键制品


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_310_0.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 分析和设计工作流中的关键制品包括


    +   - 设计模型

    +     - 是在构造阶段的主要系统蓝图

    +   - 软件构架文档

    +     - 涵盖了系统的不同构架视图'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 10.5 设计模型


    +   - 设计模型主要由类的协作组成，这些类的协作可能集成为包和子系统，以帮助组织模型并提供模型中的组合构造块

    +     - 类是一组共享相同职责、关系、操作、属性和语义的对象描述

    +     - 包是对类的逻辑分组，这是为了组织起来方便，以减少系统的复杂程度

    +     - 子系统是包的一种，由作为独立单元、提供特定系统行为的一组类组成'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 10.6 分析模型


    +   - 分析模型描述了系统针对应用的方面，是一个设计的抽象或泛化

    +   - 分析模型忽略系统是如何工作的细节，提供系统功能的概况

    +   - 分析模型和设计模型要保持一致

    +   - 对于某些公司，如果其系统要存在数十年，或者要有很多不同的系统，那么有一个独立的分析模型非常有用'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 10.7 接口扮演的角色


    +   - 接口以一种独立于实现行为的方式描述由类、子系统和构件提供的行为

    +   - 接口描述了一系列由模型元素执行的操作，包括返回的类型和参数的类型和数目

    +   - 提供同样接口的模型元素可以互换

    +   - 接口可以降低系统各部分之间的依赖性，改善设计的灵活性'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 10.8 实时系统的制品


    +   - 实时系统是那些对时间或响应有特殊需求、并通常对最终期限有约束的系统

    +   - RUP介绍了以下几个专门为满足开发实时系统需要的附加制品：

    +     - 封装

    +     - 协议

    +     - 事件

    +     - 信号'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 10.9 基于构件的设计


    +   - 构件是实现模型中的元素，它用来表达通过一系列较小的“块”实现系统的方法

    +   - 构件提供了一个或多个接口，并且仅仅依赖于其它构件的接口

    +   - 与构件相对应的设计模型元素是子系统：子系统是独立的功能单元，允许独立设计和实现系统的不同部分。子系统提供了接口，并依赖于其它模型元素的接口'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 10.10 工作流


    # 分析和设计中的工作流


    +   - 定义候选构架

    +   - 精化构架

    +   - 分析行为

    +   - 设计构件

    +   - 设计实时构件

    +   - 设计数据库


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_317_0.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 定义候选构件


    由构架师执行的构架分析和由设计师执行的用例分析等活动组成。它的目的是：


    +   - 建立一个初始的系统构架草图

    +   - 从重要的构架用例中确定分析类

    +   - 确定分析类之间的交互作用，更新用例实现'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 精化构架


    +   - 由构架师执行的识别设计机制、识别设计元素、合并已有设计元素、描述运行构架和描述分布等活动以及由构架评审员执行的评审构架活动组成。它的目的是：

    +     - 提供从分析活动到设计活动的自然转移

    +     - 保持构架的一致性和完整性

    +     - 描述系统运行的组织和实施构架

    +     - 组织实现模型以便在设计和实现之间实现无缝转移'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 分析行为


    +   - 由设计师执行的用例分析活动、由构架师执行的识别设计元素活动以及由设计评审员执行的评审设计活动等组成。它的目的是：

    +     - 将用例提供的行为描述转变为一系列可作为设计基础的元素


    +   - 在分析行为时，较少关心系统的非功能性需求，而更加注重如何交付需要的应用能力'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 设计构件


    +   - 由设计师执行的用例设计、类设计和子系统设计活动以及由设计评审员执行的评审设计活动所组成。它的目的是：

    +     - 找到设计元素实现要求的行为细节，以精化关于设计元素的定义

    +     - 基于新的设计元素精化并更新用例实现，以确保用例实现总是最新的

    +     - 当设计进化后，评审该设计'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 设计实时构件


    +   - 这个细节应用在实时或交互系统的语境中，

    +   它使用封装制品作为主要的設計元素，还

    +   包括封装設計活动。


    +   - 它的目的与设计构件相似。'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 设计数据库


    +   - 由数据库设计师执行的**设计数据库活动**、设计师执行的**类设计活动**以及设计评审员执行的**评审设计活动**组成。它的目的是：

    +     - ☐ 在该设计中标识永久类

    +     - ☐ 设计合适的数据库结构以存储永久类

    +     - ☐ 定义一种存储和检索永久数据的机制和策略，以满足该系统的性能准则'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 10.11 工具支持


    +   - 用于捕获、管理、展示这些模型的工具是 **Rational Rose**。

    +   - **RUP**还提供了以下工具指南以指导设计师使用**UML**和**Rose**:

    +     - Rose RealTime可以直接执行设计模型

    +     - SoDA可以自动生成文档和报告'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 10.12 小结


    +   - 分析和设计是需求和实现之间的桥梁。分析和设计工作流使用用例来标识一系列后来被精化成为类、子系统和包的对象

    +   - 分析和设计中的职责分配给了构架师(处理蓝图问题)、设计师(处理细节问题)和数据库设计师

    +   - 分析和设计产生设计模型，它可以抽象为3个构架视图。

    +     - 逻辑试图将系统分解为一序列逻辑元素(类、子系统、包和协作)。

    +     - 过程视图将这些元素转变为系统的过程和线程。

    +     - 实施视图将这些过程转变为一组节点

    +   - 在某些情况下，一个独立的分析模型对于表示系统的概况或者系统的抽象是非常有用的'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 第11章 实现工作流'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 目录


    +   - 11.1 目的

    +   - 11.2 构造

    +   - 11.3 集成

    +   - 11.4 原型

    +   - 11.5 工作人员和制品

    +   - 11.6 工作流

    +   - 11.7 工具支持(略)

    +   - 11.8 小结'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 11.1 目的


    +   - 实现工作流有以下四个目的：

    +     - 为了从层次组织实现子系统的角度定义代码组织

    +     - 为了从构件（源文件、二进制文件、可执行文件以及其他文件）的角度实现类和对象

    +     - 为了将要开发的构件看作一个单元进行测试

    +     - 为了将个人或开发团队开发的结果与可执行系统进行集成'
  merge: -1
  img_proc: true
- pgno: 329
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 11.2 构造(build)


    +   - 构造是系统的可操作版本或者是该系统的一部分。

    +   - 每个构造提供一个早期评审点，并帮助在集成问题出现时及时发现问题。

    +   - 构造展示了迄今为止开发完成的功能。

    +   - 假如新加入的功能导致系统的破坏,或者威胁到构造的整体性,这时就需要回到以前的版本,所以每个构造都处于配置控制下。

    +   - 通常,项目每隔一定间隔产生一个构造'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 11.3 集成(Integration)


    +   - 集成是指将几个独立的软件构件结合成一个整体的软件开发活动

    +   - 集成是在实现的不同水平和不同阶段上进行的，其目的如下：

    +     - 在将子系统交给系统集成人员之前，要将在同一个子系统上工作的开发组里的工作成果集成起来

    +     - 将子系统集成一个完整的系统

    +   - 在每一个迭代中要进行的集成是非常重要的。迭代计划中不仅定义了要设计的用例和要实现的类，还定义了集成策略

    +     - 集成策略关注实现和集成类的顺序。'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 集成的种类


    +   - 增量式集成

    +     - 一小块一小块地编写代码并测试代码，然后通过每一次增加一小块将他们结合成一个整体

    +     - **RUP**的集成方法

    +   - 阶段式集成

    +     - 是指同时集成多个(新的和已变更的)构件

    +     - 缺点是很难以对错误进行定位'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 增量式集成的优点


    +   - 容易定位故障

    +   - 更加充分地测试构件

    +   - 系统的某些部分提前运行'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 11.4 原型


    +   - 原型用于以一种直接的方式减少风险。

    +   - 原型可以通过给用户、客户和经理展现一些具体的、可执行的实体，帮助建立对该产品的支持

    +   - 原型必须在它的整个生命周期中保持非常明确的性质和目的

    +   - 为展现用户接口而设计的行为原型很少能发展成为一个强壮的、有弹性的产品'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 原型的种类


    +   根据原型要探测什么，可以将其分为：

    +   - 行为型原型：探测系统的某一特定行为

    +   - 结构型原型：探测构架或者技术上关注的问题


    +   根据原型的进化，或者说进化的结果，可以将其分为：

    +   - 探测型原型：也叫抛弃型原型，在完成之后要将它抛弃

    +   - 进化型原型：将进化成为最终系统'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# 行为型原型


    +   - 这类原型趋向于成为探测型原型，它不是待开发系统构架的复制

    +   - 主要关注于用户看到的系统将要做什么

    +   - 这类原型属于“快速研制但并不精巧”，它并不是按照项目的标准制作的'
  merge: -1
  img_proc: true
- pgno: 337
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 探测型原型与进化型原型


    +   - 探测型原型

    +     - 这类原型用于测试关于功能或技术或两者兼而有之的一个关键假设

    +     - 探测型原型可能非常小，例如一个用来测试软件的关键构件的几百行小程序

    +     - 这类原型也可以用来弄清楚需求(行为型测试)

    +   - 进化型原型

    +     - 这类原型是从一个迭代到另一个迭代中进化形成的'
  merge: -1
  img_proc: true
- pgno: 339
  md: 由于时间的限制，项目组通常会陷入将质量上有缺陷的探测型原型或者抛弃型原型作为最终的系统这个陷阱，他们会将原型一直保持到最后。为了避免这种情况的发生，在开始开发原型时，就必须明确定义原型的目的和范围。
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 11.5 工作人员和制品


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 11.6 工作流


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_341_0.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 构造实现模型


    +   - 构造实现模型的主要工作在细化阶段早期完成。目标是尽可能以一种开发构件和构造过程无冲突的方式来组织实现模型

    +   - 一个组织良好的模型可以预防配置管理问题的出现，并允许不断用更大规模的集成构造来建造该产品'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 对于每一个迭代


    +   - 确定要实现哪一个子系统，并确定在当前迭代中子系统集成的顺序

    +   - 对于每一个子系统，要计划子系统的集成，也就是要定义实现这些类的顺序

    +   - 实现类和对象。如果发现缺陷，要向设计递交返工反馈

    +   - 修改有缺陷的代码，执行单元测试以验证这些变更，而后对代码进行评审'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   若多个实现人员实现同一个子系统，则要有一个人负责把来自其他实现人员的新的和已变更的构件集成为一个新的实现子系统版本。


    +   这种集成产生了一系列构造，每个构造都由集成测试人员进行测试。所发布的最新版本的子系统是系统集成的输入


    +   根据集成构造计划，系统集成人员将发布的那些子系统加入到集成领域并创建一些构造来集成系统。


    +   在最后一个增量交付之后，该构造就是系统，并由系统测试人员来进行测试'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 11.8 小结


    +   - **RUP**的关键特性是在整个生命周期中进行增量式集成

    +   - 在构造阶段，建立一个能够成为最终系统的进化型和结构型原型

    +   - 并行地建立几个可抛弃的行为型原型，以探测一些例如用户界面方面的问题'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 第12章 测试工作流'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 目录


    +   - 12.1 目的

    +   - 12.2 质量

    +   - 12.3 在迭代生命周期中进行测试

    +   - 12.4 测试的层面

    +   - 12.5 测试模型

    +   - 12.6 工作人员和制品

    +   - 12.7 工作流

    +   - 12.8 工具支持(略)

    +   - 12.9 小结


    本章介绍关于质量的概念，描述测试工作流，然后讨论在过程中质量、测试和其他工作流之间的关系。'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# 12.1 目的


    +   - 测试的目的是评估产品质量。

    +   - 测试不仅仅针对最终产品，它开始于项目早期对架构的评估，并一直延续到将最终产品交付给客户

    +   - 测试工作涉及以下几点:

    +     - 验证构件之间的交互作用

    +     - 验证构件集成是否适当

    +     - 验证所有的需求是否已经正确地实现

    +     - 确定并保证所有已发现的缺陷在软件实施之前已经修复'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# 12.2 质量


    +   - 质量是指没有缺陷，并达到了预期的目的

    +   - 测试的最终目标是评估最终产品的质量。为此，还要评估组成这个产品的构件的质量以及构架的质量

    +   - 评估的意义是：根据事先定义好的并被接受的度量和准则进行评估，以确保产品满足或者超出了事先定义并被普遍接受了的需求

    +   - 质量评估通常既要考虑直接产品质量，也要考虑过程质量和组织因素'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# # 产品质量所有权


    +   - 质量要在一开始就设计和建立在产品之中


    +   - 测试的角色不是保证质量， 而是评估质量， 并及时地提供反馈， 以便及时而又经济地解决质量问题


    +   - 测试人员角色的评估质量并提供反馈


    +   - 项目组的角色的生产满足需求和质量期望的制品或工作产品'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 12.3 在迭代生命周期中进行测试


    +   - 测试不是单一的活动，也不是项目中的一个评估质量阶段

    +   - 开发者要在整个生命周期中进行测试

    +     - 测试早期原型的主要功能

    +     - 测试架构的稳定性、覆盖率和性能

    +     - 修复发现的缺陷

    +     - 测试最终产品'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# 12.4 测试的层面


    为了评估产品质量，需要不同类型的测试，每种测试都有不同的重点。这些测试可以分为以下几个角度：


    +   - 质量层面：关注的是主要的质量特征或属性

    +   - 测试阶段：在生命周期中执行测试的点

    +   - 测试类型：单独测试的特定测试目标，通常限制在一个单一的质量层面上'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# 质量层面


    +   - 每一个产品都要对以下几个方面进行评估

    +     - 可靠性。软件对执行失败时所具有的抵抗能力：没有崩溃、不会死机、不会内存泄露等

    +     - 功能性。软件执行了需要的用例或者预期的行为

    +     - 性能。当操作负载、操作强度和操作时间过长时，软件和系统要及时地执行和响应并能继续以用户可接受的方式完成任务

    +   - 此外，还包括可维护性、可延伸性、灵活性等'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 测试阶段


    测试在软件开发的不同阶段具有不同的测试目标。包括以下四个阶段：


    +   - 单元测试：逐一测试系统最小的可测试元素，通常是在实现这些元素的同时测试这些元素

    +   - 集成测试：测试集成单元、构件或子系统

    +   - 系统测试：测试整个应用程序和系统(一个或多个应用程序)

    +   - 接受测试：由最终用户测试整个应用程序(或系统)，其目的是确定是否已经作好实施的准备'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 在生命周期的初始化阶段和细化阶段也要进行测试工作


    +   - 初始化阶段要对用于评估产品构想生存能力的早期概念原型进行接受测试

    +   - 细化阶段要对开发的构架原型进行集成测试和系统测试，以确认构架的整体性和关键构架元素的性能'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 测试类型


    +   - 每一 种测试类型关注一个特定的测试目标，并且只测试软件的一个特性或属性。

    +     - 基准测试： 将测试目标的性能和一个已知标准进行比较

    +     - 配置测试： 验证测试目标的功能在不同配置下(软件或硬件)是否都可以接受

    +     - 功能测试： 验证测试目标功能是否适当地执行了所需要的、期望的用例

    +     - 安装测试： 验证测试目标的安装是否合适，是否可以在不同的配置和不同条件下成功地安装'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   - 整体性测试：验证测试目标的可靠性、健壮性和在执行过程中的抗失败能力

    +   - 加载测试：验证测试目标的性能在配置不变、操作条件不同(如用户数量、处理的业务数量)的情况下的可接受性

    +   - 性能测试：验证测试目标的性能在操作条件不变、而使用不同配置的情况下的可接受性

    +   - 强度测试：验证测试目标的性能当遇到异常或极端条件时(如减少可用资源或用户数量极多等)的可接受性'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 回归测试


    +   - 回归测试是一种测试策略，是对测试目标的新版本再一次执行以前执行过的测试，以确保目标的质量在增加了新的能力的情况下并没有倒退

    +   - 回归测试的目的是保证

    +     - 在上一个测试执行中发现的缺陷已经更正

    +     - 代码的改变没有引入新的缺陷，也没有再次引入老的缺陷'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# 12.5 测试模型


    +   - 测试模型:描述了将要测试什么以及将要如何测试

    +     - 测试模型描述了测试工作本身以及与测试工作量有关的测试目标的各个方面

    +     - 包括测试用例、测试规程、测试脚本和期望的测试结果以及关于它们之间关系的描述'
  merge: -1
  img_proc: true
- pgno: 360
  md: '+   测试用例:为了一个特定的测试目标开发的测试数据、执行条件和期望的测试结果的集合

    +   一个测试用例可以由一个或多个测试规程实现


    +   测试规程:用于测试用例的启动、执行和测试结果的评价的详细指令的集合

    +   一个测试规程实现一个或多个测试用例，也有可能只实现测试用例的一部分'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# **测试脚本:** 自动执行测试规程的计算机可读指令


    +   □ 一个测试脚本自动执行一个或多个测试规程的整体或一部分


    # **测试类和构件:** 实现测试设计的类和构件


    # **测试协作:** 用协作图或时序图表示, 描述了在测试中构件和测试目标之间产生的时间顺序消息流


    # **注释:** 描述了测试模型中的约束和附加信息的文本信息'
  merge: -1
  img_proc: true
