- pgno: 94
  md: '# 4.1 顺序开发过程


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_94_0.png)


    一个看起来很合理的开发过程，却被很多人指责其中存在很多问题与失败之处。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 顺序过程运用失败的原因


    +   - 错误的假设

    +   - 软件开发的语境与其它工程规则不同

    +   - 没有考虑到一些人为因素

    +   - 开发环境的承载能力低于人们的预期

    +   - 当前仍停留在软件工程的探索阶段'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 顺序过程导致软件开发失败的

    两个致命错误假设


    +   - 需求是固定的

    +     - 用户会改变

    +     - 问题会改变

    +     - 技术基础会改变

    +     - 市场会改变

    +     - 不可能得到足够详细和精确的需求

    +   - 在进行实际开发之前做出正确的设计'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 顺序过程不愿改变需求和无法关注最终产品的原因


    在开发周期长的项目中


    +   □ 顺序过程中的每一步骤(除了最后一步)的目标是产生一个中间制品(通常是一些文档)。


    +   □ 当这些中间制品准备作为下一个步骤的初始材料时，要求是确定的、被认可的、冻结了的。


    +   □ 对中间制品的过分重视导致缺乏对以前各阶段工作的反馈，使得工作人员无法系统地考虑工作的。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 顺序过程的适用项目


    +   - 为期几星期到几个月的小型项目

    +   - 能非常清楚地预测事情发展的项目

    +   - 能比较透彻地了解所有困难方面的项目

    +   - 没有新意的项目


    > 假如在项目中要用到新技术、新开发工具或起用新人，顺序过程不能给你任何进行学习或自我提高的空间'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 顺序过程对基于规模的计划和基于时间的计划


    +   - 基于规模的计划：用9个月的时间做出所有我们想做的事

    +   - 基于时间的计划：在前3个月做计划表中的前3件事，接下来的3个月中做后两件事，以此类推。

    +   - 顺序过程不适用于基于时间的计划，而适用于基于规模的计划'
  merge: -1
  img_proc: true
