- pgno: 197
  md: '# 7.1 目的


    +   - 软件项目管理是一门平衡竞争对象、管理风险和克服约束的艺术

    +   - 软件项目管理最终目的是交付一个满足客户(付账人)和最终用户需求的产品

    +   - 项目管理工作流有以下三个目的:

    +     - 为管理软件密集型项目提供框架

    +     - 为计划、执行、监督项目和分配人员提供实际的指南

    +     - 为管理风险提供框架'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - 项目管理工作流不覆盖项目管理的所以方面

    +   - 项目管理工作流不包含以下问题:

    +     - 管理人员：雇用、培训、指导

    +     - 管理预算：详细说明和分配

    +     - 管理供应商和客户之间的契约

    +   - 项目管理工作流主要关注迭代开发过程的某些方面:

    +     - 制定一个整个生命周期的迭代项目计划或某个特定迭代的计划

    +     - 风险管理

    +     - 监督迭代项目和度量元的进展情况'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 7.2 计划迭代项目


    +   项目经理的困惑：

    +   - 需要多少个迭代？

    +   - 每个迭代要有多长？

    +   - 如何确定一个迭代的内容和对象？

    +   - 如何跟踪迭代的进展？


    +   项目计划的目标：

    +   - 在一段时间内给一个团队中的人员分配任务和职责

    +   - 监督计划进展状况，在项目展开过程中发现潜在的问题'
  merge: -1
  img_proc: true
