- pgno: 363
  md: '# 12.6 工作人员和制品


    测试工作流中涉及两个主要的工作人员


    +   - 测试设计师：负责计划、设计、实现和评价测试

    +   - 测试人员：负责执行系统测试


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_363_0.png)'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# 其他工作人员


    +   - 设计师

    +   - 实现人员'
  merge: -1
  img_proc: true
- pgno: 365
  md: <!-- no content -->
  merge: -1
