- pgno: 177
  md: '# 6.1.1 用例和参与者


    +   - 用例(use case)是一个系统执行的动作序列，对特定参与者产生有价值的可见结果。

    +   - 参与者(actor)是系统之外与系统能产生交互作用的人或物

    +   - 动作(action)是一个计算程序或算法程序，在参与者给出系统信号或系统得到一个时间事件时被调用。动作是原子的，一个动作要么全部执行，要么根本不执行。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   - **动作序列(a sequence of actions)**是指贯穿于系统的特定事件流。

    +   - **有价值的可见结果(an observable result of value)**:动作序列一定要产生对系统的参与者有价值的可见测到的结果。

    +   - 用例的定义描述了执行用例时系统要做些什么。

    +     一组用例就可以定义系统的功能，每一个用例代表了一个特定事件流。

    +   - 用例的作用是从用户角度获取系统的功能，当客户和系统开发人员进行交流时，充当共同的语言。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 用例和参与者的示例


    +   - 银行客户可以通过自动取款机(ATM)提款、转帐或检查帐户上的余额。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 6.1.2 事件流


    +   - 事件流(flow of events)描述了参与者和系统之间的动作序列。

    +   - 事件流用自然用语写成，或者用含有精确术语的短语写成。

    +   - 一个关于事件流的示例：《提款》见下一页'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   1. 用例开始于客户将卡插入ATM机。系统读取并验证卡上的信息。

    +   2. 系统提示输入个人标识号(PIN)。客户输入PIN。系统进行验证。

    +   3. 系统询问客户需要哪种操作。客户选择“提款”。

    +   4. 系统询问提款数量。客户输入要提取的金额数。

    +   5. 系统询问账户种类。客户选择账户种类。

    +   6. 系统与ATM网络交换信息，以验证账户ID、PIN以及剩余金额。

    +   7. 系统提问客户是否要收据。这一步只有在可以用纸打印收据时才执行。

    +   8. 系统提示用户取走卡。用户将卡取走。

    +   9. 系统给出客户申请的现金。

    +   10. 假如客户需要，系统打出收据，用例结束。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   - 用例事件流最终要描述所有可能的过程，要考虑所有可相互替换的路线和不同的情景。


    +   - 选择什么样的路径依赖于以下几点：

    +     - 参与者的输入(input from an actor)

    +     - 系统内部状况(the internal state of the system)

    +     - 超时或出错(time-outs and errors)'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 6.1.3 情景


    +   - 情景(scenario)可以理解为是用例的实例

    +   - 用例的实例是一个特定的事件流或一个特定的路径。

    +   - 情景的作用

    +     - 在过程中使用情景的目的是提取并强调一个独特的贯穿于用例的动作序列或“线程”。在定义测试用例时尤其有用。

    +     - 在项目早期寻找用例时，最容易的方法是从一个特定的情景开始，而后将它扩展到更多的事件流，最后总结为成熟的用例。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 6.1.4 用例模型


    +   - 用例模型由整个系统或系统某一部分的所有用例及与这些用例交互的参与者组成，以此来描述整个系统的功能。

    +   - 用例模型提供了系统预期功能模型和外部环境模型，可以将用例模型作为开发人员和客户之间的契约。

    +   - **Rational**统一过程中使用用例图和活动图将用例模型可视化，包括用例之间可能的关系。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 用例建模阶段是否考虑并发性等非功能需求


    +   - 在用例建模阶段，假设所有情景都可以同时运行而不会产生任何问题。在设计阶段时，要确保能正确处理所有非功能性需求。'
  merge: -1
  img_proc: true
- pgno: 186
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 6.3 用例的进化


    +   - 在研究细节之前要先开发一个用例概要

    +   - 用例概要不需要对事件流进行详尽地说明，只要相关人员的理解能够达成一致即可

    +   - 在细化阶段的早期迭代过程中，只有少数用例(对构架非常重要的用例)在概括描述之后进行了详尽的说明

    +   - 在细化阶段结束时，要完成对那些必要用例的详尽描述'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 6.4 用例的组织


    +   - 包：相关的用例放在一个包中

    +   - 用例之间关系：

    +     - 包含

    +     - 扩展

    +     - 泛化/特化

    +   - 包含和扩展的区别：

    +     - 包含关系中，基本事件流在不包含时是不完整的；扩展关系中，基本事件流在不进行扩展之前是完整的


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_188_0.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 6.5 在过程中使用用例


    +   - 用例模型是需求工作流的结果

    +   - 在分析和设计阶段，用例是将需求活动和设计活动连接起来的桥梁，在用例实现中充当基础。通过遍历用例，开发人员会找到对象和类。

    +   - 在实现阶段，设计模型是实现规格说明。用例是设计模型的基础，我们根据设计类实现用例。在设计模型中实现用例可以理解系统的动态性，并确定在哪里来优化系统性能。

    +   - 在测试阶段，用例构成了确定测试用例和测试规程的基础。每一个用例都用来验证系统。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 核心过程工作流


