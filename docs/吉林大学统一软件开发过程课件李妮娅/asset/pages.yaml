- pgno: 111
  md: '# # 4.4 生命周期中焦点的转移


    从一个迭代过程到另一个迭代过程，从一个阶段到另一个阶段，重点关注的活动是不同的


    +   - 初始阶段，焦点主要放在理解所有的需求并决定开发工作量的范围上。

    +   - 细化阶段，焦点放在需求上。一些软件设计和实施的目标是开发构架原型，用来缓解特定技术风险并学习运用特定的工具和技术。此构架原型将作为下一阶段的基线。


    > 基线是一个经过审批通过的制品版本，可以构成进一步演化或开发的一致基础，并只能通过常规的过程(如改变和配置控制)进行变更。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   - 构造阶段，焦点放在产品的设计与实现上。这时，可以在最初的构架原型基础上生产出第一个可以运行的产品。

    +   - 移交阶段，焦点是确保系统保持预期的质量水平；修复缺陷、培训用户、调整特性、增加遗漏掉的元素。至此，交付最终产品。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_112_0.png)'
  merge: -1
  img_proc: true
