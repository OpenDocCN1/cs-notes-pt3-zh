- pgno: 136
  md: '# # Inception Phase


    # □ **Purpose**


    +   - 为开发一个新系统或者变更一个旧系统建立一个商业用例 (*the business case*)

    +   - 确定项目范围 (*the project scope*)


    # □ **Outcome**


    +   - 项目需求总览

    +     - 10-20%的初始用例模型和领域模型

    +   - 初始商业用例

    +     - 成功结项标准（e.g., 收益预计）

    +     - 初始风险评估

    +     - 所需资源评估


    # □ **Lifecycle Objectives Milestone**（生命周期目标里程碑）'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Elaboration Phase


    # Purpose


    +   - 分析问题领域

    +   - 搭建一个稳定的体系结构平台

    +   - 确定项目中的最高风险要素

    +   - 制定一个用于指导项目怎样完成的综合性计划


    # Outcome


    +   - 80%的初始用例模型和领域模型

    +   - 一个可执行的架构体系和相应的技术文档

    +   - 一个被修订的商业用例，包括修订风险评估

    +   - 一个覆盖整个项目的开发计划'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Construction Phase




    +   - 增量式开发一个准备移交给用户的完整的软件产品




    +   - 全部的用例和设计模型


