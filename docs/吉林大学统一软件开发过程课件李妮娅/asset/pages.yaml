- pgno: 141
  md: '# 4.6 迭代方法的好处


    +   - 与传统的瀑布模式相比较，迭代方法有以下优点：

    +     - 风险在早期被降低

    +     - 易管理变更

    +     - 提高了重用的程度

    +     - 在整个过程中项目群组可以不断地进行学习

    +     - 产品整体质量提高'
  merge: -1
  img_proc: true
- pgno: 142
  md: <!-- no content -->
