- pgno: 246
  md: '# 8.1 目的


    +   - 业务建模的目的如下

    +     - 理解将要实施的系统的组织（目标组织）结构和动态特性

    +     - 理解当前在目标组织中的问题，并明确改进的潜力

    +     - 确保客户、最终用户和开发人员对目标组织有统一的理解

    +     - 获取用于支持目标组织的系统需求'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 为了达到以上这些目的


    +   - 业务建模工作流介绍了如何开发一个新目标组织的构想

    +   - 根据这个构想定义业务模型中组织的过程、角色和职责

    +   - 这个模型包括一个业务用例模型和一个业务目标模型'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 8.2 为什么要进行业务建模


    +   - 软件应用程序开发要在进行软件工程项目之前或者同时就要了解业务领域

    +   - 业务模型和系统定义不仅仅是IT行业人员的兴趣所在，还是所有涉及业务的开发人员的焦点

    +   - 并不是每一个软件工程工作都需要进行业务建模。当有很多人直接参与使用系统，并且有很多信息需要系统处理时，业务模型比较实用'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 8.3 在业务建模中使用软件建模技术


    +   - 在业务建模中使用与软件工程技术相似的建模技术会带来许多便利，主要的优势是语言相通。

    +   - 有助于理解在业务领域中描述的事物是如何与软件领域中的事物相联系的

    +   - 它还可以简化对于业务模型中的制品和对应的系统模型中的制品之间关系的描述'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 业务建模的注意事项


    +   - 业务用户(客户、销售者或合作伙伴)表示为业务参与者

    +   - 业务过程表示为业务用例和业务用例实现

    +   - 人们在组织中扮演的角色表示为业务工作人员

    +   - 组织管理或制造的“东西”表示为业务实体'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 业务建模工作流中的工作人员和制品


    业务过程分析员

    业务术语表

    业务规则

    业务用况模型

    业务对象模型

    目标组织评估

    业务构想

    业务架构文档

    补充业务规格说明

    业务设计师

    业务用况

    业务参与者

    业务用况实现

    组织单元

    业务实体

    业务工作人员'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 8.4 业务建模情景


    +   - 业务工程的工作量由于内容和需求的不同而不同

    +   - 情景1：组织图

    +   - 情景2：领域建模

    +   - 情景3：一个业务，多个系统

    +   - 情景4：普通业务建模

    +   - 情景5：新的业务

    +   - 情景6：修订'
  merge: -1
  img_proc: true
- pgno: 253
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 情景2：领域建模


    +   - 希望创建一个主要目的是管理和表示信息的应用程序(如一个订购管理系统或银行系统)


    +   - 这时可以在业务一级上为这些信息建立一个模型，并不用考虑业务工作流，这就是领域建模


    +   - 领域建模通常是软件工程项目的一部分，在工程的初始和细化阶段执行'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 情景3：一个业务，多个系统


    +   - 希望建立一个大的系统，或者一个应用程序族，那么创建一个业务模型就可以充当好几个软件工程项目的输入


    +   - 业务模型将帮助找到业务需求，同时还可以作为应用程序族架构的输入


    +   - 在这种情况下，业务建模工作通常被视为一个独立的项目来处理'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 情景4：普通业务建模


    +   - 希望创建一个供几个组织使用的应用程序(例如，一个支持销售的程序或一个记账程序)，就可以根据各个组织处理业务的方法，在建模时将它们结合起来，从而避免系统过于复杂

    +   - 如果无法将组织结合起来，建模工作可以帮助理解和管理组织使用应用程序的不同方法，并能简化应用程序功能优先级的排列'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 情景5：新的业务


    +   - 一个组织决定开发一个全新的业务线，并且建立一个信息系统来支持它，这时就需要执行业务建模。

    +   - 在这种情况下，建模的目的不仅仅是找到系统需求，还要决定新的业务线的特性。

    +   - 此时，通常把业务建模视作一个独立的项目来处理。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 情景6: 修订


    +   一个组织决定彻底修订处理业务的方法(业务过程再设计), 业务建模本身通常就是几个项目之一。


    +   业务过程再设计通常要经过以下几个阶段: 设想新的业务, 推翻已存在的业务设计, 建立新的业务设计, 安装新的业务'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# # 8.5 工作人员和制品


    业务建模中涉及到的主要工作人员包括：


    +   - 业务过程分析师：


    通过概述和限定被建模的组织，引导和调整业务用例建模。例如，建立一个新业务构想，包括业务参与者和业务用例及它们之间是如何交互作用的


    +   - 业务设计师：


    +   - 通过描述一个或几个业务用例来详述部分功能。他们决定实现业务用例需要哪些业务工作人员和业务实体，以及如何实现业务用例


    +   - 定义一个或多个业务工作人员和业务实体的职责、操作、属性和关系'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 其他人员


    +   - 项目相关人员：

    +     - 代表组织的不同部分，并提供输入和评审

    +   - 业务评审员：

    +     - 评审制品的结果'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 业务建模中的关键制品


    +   - 业务构想文档：定义了业务建模工作的目标

    +   - 业务用例模型：业务预期功能的模型，用做确定组织中的角色和可交付的功能的输入

    +     - 业务用例模型包括业务参与者和业务用例

    +     - 参与者是业务外部的角色(例如客户)

    +     - 业务用例是过程

    +   - 业务对象模型：描述业务用例实现的对象模型

    +     - 业务对象模型从业务工作人员和业务实体交互作用的角度说明了业务用例是如何执行的

    +     - 业务工作人员和业务实体可能被分组为不同的组织单位'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 其他制品


    +   - 目标组织评估：描述了准备实施系统的组织的当前状态

    +   - 业务规则：对相关政策的声明或必须满足的条件

    +   - 补充业务规格说明：业务定义文档，它提出了在业务用例模型和业务对象模型中没有定义的那些业务的定义

    +   - 业务术语表：定义了在业务中用到的重要术语'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 8.6 工作流


    在第一个迭代过程中，评定要实施最终系统的组织的 状态。这时产生的主要制品是目标组织评估和业务构想。


    在评估结果的基础上，决定遵循哪个业务建模情景。然后决定如何继续这个迭代以及接下来如何工作。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_263_0.png)'
  merge: -1
  img_proc: true
