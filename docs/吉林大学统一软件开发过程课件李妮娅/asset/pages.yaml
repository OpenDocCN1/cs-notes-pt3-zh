- pgno: 117
  md: '# 成果和制品


    +   - 一个构想文档——即关于项目核心需求、关键特性和主要限制的构想

    +   - 一个关于用例模型的调查，包括所有在此阶段可以确定的用例和参与者

    +   - 初期的项目术语

    +   - 一个初始的业务用例，包括

    +     - 业务环境

    +     - 关于是否成功的评价标准(项目收入、市场认识等)

    +     - 经济预测

    +   - 一个早期的风险评估

    +   - 一个可以显示阶段和迭代的项目计划'
  merge: -1
  img_proc: true
