- pgno: 46
  md: '# Worker: Test Designer


    The Test Designer is the principal role in testing. This worker is responsible
    for the planning, design, implementation, and evaluation of test, including:


    +   - Generation of the test plan and test model

    +   - Implementation of the test procedures

    +   - Evaluation of test coverage, results, and effectiveness


