- pgno: 52
  md: '# 迭代开发的优点


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_52_0.png)


    +   - 可以使开发者考虑到需求的改变

    +   - 集成工作是逐渐完成的，而不是在最后结尾时的“ 大爆炸”

    +   - 可以在早期降低风险

    +   - 当产品做出战略性改变时，迭代开发提供了相应的变更管理方法

    +   - 迭代开发可以促进重用

    +   - 架构在连续迭代过程中获得不断修正，会变得更加坚固

    +   - 开发人员可以更早的参与到过程中，并不断地学习

    +   - 开发过程本身也在不断提高和精化'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 需求管理的优点


    > 第9章、第13章


    +   - 更好地控制复杂项目

    +   - 提高软件质量和客户满意度

    +   - 降低项目成本和延迟

    +   - 增强群组中的交流'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 构架和构件的使用


    # 第5章


    +   - 软件构件(Component)是软件、模块、包或子系统的一个重要部分，这部分具有一个明确的功能和界限，并且能够集成为一个定义好的构架。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 构件开发的不同目的


    +   - 为了定义一个模块化的构架。

    +     - 要确定、分离、设计、开发和测试已形成的构件。这些构件可以被逐步集成，最终成为一个完整的系统。

    +   - 为了重用解决方案。

    +     - 他们构成了重用基础，提高了整个软件的生产能力和质量。

    +   - 为了构造一个支持软件构件概念的基础平台。

    +     - CORBAR、ActiveX、JavaBeans等在不同领域支持开发人员使用这些现成构件。

    +     - 他们允许开发人员购买并集成构件，而无需自己开发。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# RUP支持以构件为基础的开发，具体体现在以下几个方面：


    +   迭代方法允许开发人员逐渐确定构件，决定哪些构件需要开发、哪些构件可以重用、哪些构件要去购买


    +   将注意力集中在软件构架上，构架列举了构件和集成它们的方法，同时也描述了他们交互作用的基础机制和模式


    +   在分析设计中用到如包、子系统和层这样的概念来组织构件和确定接口


    +   一开始对独立模块进行测试，而后逐渐扩大到对更大的集成构件进行测试'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 建模和UML


    第6章，第8章，第10章，第12章


    +   - 模型帮助使用者理解并找到问题及问题的解决方案。

    +   - 模型是现实的简化，帮助使用者掌握复杂系统

    +   - RUP在开发过程中开发和维护系统模型


    +   - UML是一种图形语言，用来将软件密集型系统的制品可视化、具体化，并构造、记录这些制品

    +   - UML是描述不同模型的通用语言，但它不能告诉我们如何开发软件


    +   - RUP指导使用者如何有效地使用UML建模。

    +   - RUP告诉使用者需要什么样的模型，以及如何建造这样的模型。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 产品质量和过程质量 第12章


    +   - 产品质量

    +     - 生产出的主要产品(如软件或系统)及产品中包含的所有元素(如构件、子系统、构架等)的质量


    +   - 过程质量

    +     - 指产品制造过程中，过程被执行并坚持到的程度。

    +     - 还关注支撑主要产品的制品质量(如迭代计划、测试计划、用例实现、设计模型等)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 配置管理和变更管理


    # 第13章


    +   - 在迭代开发中开发计划和执行过程都允许变更，因此要跟踪这种变更，确保每一个人、每一件事的同步进行。

    +   - 配置管理处理产品结构，重要的制品要受到版本控制。

    +   - 变更管理处理过程结构，一个变更请求是一份需要变更一个或多个制品的文档化建议。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 2.5 Rational统一过程的其它重要特征


    +   - 用例对开发的驱动作用

    +   - 作为过程框架，RUP可以根据需要被裁剪和扩充

    +   - 需要软件开发工具来支持过程'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 用例驱动


    # 第6章


    +   - **Rational**统一过程是一个用例驱动方法，这意味着为系统定义的用例是开发过程的基础。

    +   - 用例是业务建模的关键。

    +   - 用例在过程工作流中扮演着重要的角色，尤其是在确定需求、设计、测试和管理工作流中。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 过程配置


    # 第3章、第17章


    +   - **RUP是一个过程框架，开发人员可以对其进行修改、调整和扩展，以适应自己特殊的需求、特征、约束等。**

    +     - 开发人员不能盲目地遵循一个过程，以至于生产出无附加值的制品。而要尽可能地精简过程，同时很好地完成任务，以最快的速度生产出期望的高质量软件产品。

    +     - 很多过程元素有可能会被修改、客户化、增加或压缩，其中包括制品、活动、工作人员和工作流，以及指南和制品模板。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 工具支持


    # 第3章


    +   - 支持RUP的工具有很多，这些工具能自动完成许多活动中的步骤。

    +   - 这些工具用于生产和维护软件工程过程中的不同制品，包括可视化建模、编程和测试。

    +   - 这些工具对于记录每个迭代过程中的配置管理和变更管理起着重要作用。'
  merge: -1
  img_proc: true
