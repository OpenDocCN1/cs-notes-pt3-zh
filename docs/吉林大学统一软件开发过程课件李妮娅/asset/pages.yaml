- pgno: 37
  md: '# 2.1 什么是Rational统一过程


    +   - **Rational统一过程简称为RUP**

    +     - 是⼀个软件开发过程

    +     - 是⼀个过程产品

    +     - 是⼀个过程框架

    +     - 包含了6个最佳软件开发实践

    +   - 为所有方面和层次的程序开发提供指导、模板和工具指南的支持。


    Provides guidelines, templates and tool mentors for the effective implementation
    of key best practices'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# RUP是一个软件开发过程


    +   - 软件开发过程是一个将用户需求转化为软件系统所需要的活动的集合。

    +     - 按照预先制定的时间计划和经费预算，开发出满足用户需求的高质量的软件产品


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 软件开发过程的四个行为


    +   - 为开发小组的活动顺序提供向导

    +   - 详细说明哪些制品将被开发，以及何时被开发

    +   - 指导每一个开发人员和整个开发组的工作

    +   - 为监控和度量项目的产品和活动提供准则'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Bed Process or Good Process


    +   - **Bed:** 每个成员都以自己的方式在工作，开发成功与否取决于是否有几个具有献身精神的人愿意付出他们的最大努力。

    +   - **Good:** 最佳实践活动被编入过程中，使得开发团队以一种可预测的循环方式来开发复杂系统，开发团队的能力也将获得稳定提高。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# RUP是一个过程产品

    (process product)


    +   - **Rational**软件公司开发并维护这个产品

    +   - 该产品与**Rational**公司的一系列软件开发工具集成到一起'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# RUP是一个过程框架


    +   - **RUP**把开发中面向过程的方面（例如定义的阶段，技术和实践）和开发制品（例如文档，模型，手册以及代码等等）整合在一个统一的框架内。

    +   - 这个框架可以被改造和扩展以适应采纳此方法的组织'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 2.2 作为一个产品的Rational统一过程


    +   - 软件过程也是软件

    +   - **RUP**有着软件产品的共同特征:

    +     - 发布升级版本

    +     - 通过网络技术在线移交**RUP**

    +     - 可以根据开发的需要量体裁衣

    +     - 与多种**Rational**软件开发工具集成，如 **Rational Rose**'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 将这种过程作为一种软件产品有以下好处


    +   - 过程从来不会过时,每隔一段时间,公司就会获得一个版本

    +   - 所有项目成员可以从公司内部网上获得过程的最新版本

    +   - ....'
  merge: -1
  img_proc: true
