- pgno: 402
  md: '+   - Beta测试发布

    +   - <在安装地点>测试产品

    +   - 打包产品

    +   - 提供对下载站点的访问


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_402_0.png)'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# # 计划实施


    +   - □ 制定实施计划要考虑什么时候以及如何开发完整的交付清单，还要确保最终用户可以获得关于新软件交付的必要信息


    +   - □ 整个系统的实施计划需要客户的高度协作和准备


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # 在开发地点测试产品


    +   - 在开发地点测试产品可以帮助确定产品发布是否足够成熟。


    +   - 测试产品活动在开发现场和目标现场中应该是相同的


    # # 创建发布


    目的是确保产品已经完全准备好交付给客户


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_405_0.png)


    计划结果


    开发 支持材料


    [批准]


    创建发布


    <在开发地点>新试产品


    [批准]'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Beta测试发布


    +   - Beta测试提供对于软件性能和可使用性的反馈

    +   - 在迭代开发的语境中，beta测试的目标是确保产品满足了客户的期望，并要确保下一个迭代开发考虑了重要的用户反馈因素


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_406_0.png)'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 在安装现场测试产品


    +   □ 产品进行了充分的内部测试和Beta测试后，就可以在现场进行安装，并由客户进行测试。


    +   □ 基于已经完成了迭代测试并有客户参与，最终现场测试的目的是为了让客户接受该系统


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_407_0.png)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 打包产品


    +   是一组选择性的活动，描述了生产“打包软件”产品时要完成哪些工作。


    +   在这种情况下，发布作为批量生产的母板保存，然后将产品与物料账单一 起打包装箱，并交付给客户。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 提供对下载站点的访问


    +   - 要确保全球市场在任意时间内都可以获得这个产品。

    +   - 实施经理需要知道如何将产品加入到网站提供的产品清单中，并要知道如何在网上交流以满足购买和交付的需求。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_409_0.png)'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 15.4 小结


    +   - 实施工作流必须照顾到将要交付给最终用户或客户以及支持组织的所有制品

    +   - 实施工作流描述了与Beta测试和交付可安装软件相关的活动。安装可以由以下人员来完成

    +     - 卖主：如果是复杂的分布式系统

    +     - 用户：如果软件是打包产品或是通过互联网下载的产品

    +   - 这个工作流与开发产品的种类和业务语境联系紧密'
  merge: -1
  img_proc: true
