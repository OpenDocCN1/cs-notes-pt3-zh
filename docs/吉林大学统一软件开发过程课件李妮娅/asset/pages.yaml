- pgno: 267
  md: '# 业务模型和系统参与者


    为了确定信息系统用例，从业务对象模型中的业务工作人员入手。对于每一个业务工作人员，驱动候选系统参与者。对于每个业务参与者参与的业务用例，建立一个候选的系统用例。


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_267_0.png)'
  merge: -1
