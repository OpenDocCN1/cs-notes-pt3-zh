- pgno: 393
  md: '+   为迭代准备指南是非常必要的，具体内容包括：

    +   - 业务建模

    +   - 用例建模

    +   - 设计

    +   - 程序设计

    +   - 手册风格指南

    +   - 用户界面

    +   - 测试

    +   - 工具


    在迭代期间，开发人员需要在他们使用工具和过程方面提供支持


