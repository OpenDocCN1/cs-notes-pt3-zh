- pgno: 366
  md: '# 12.7 工作流


    +   - 制定测试计划

    +   - 设计测试

    +   - 实现测试

    +   - 在集成测试阶段执行测试

    +   - 在系统测试阶段执行测试

    +   - 评估测试


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_366_0.png)'
  merge: -1
  img_proc: true
- pgno: 367
  md: '■ 制定测试计划：目的是确定并描述要实现和执行的测试。


    +   □ 可以开发一个包含要实现和执行的各种测试类型的单一的测试计划，或者可以针对每种测试类型开发一个测试计划


    ■ 设计测试：目的是确定、描述和生成测试模型以及报告中提到的制品


    +   □ 确保测试软件满足需求，并有良好的结构和组织。测试设计将用例转变为可接受的单元测试用例、集成测试用例和系统测试用例'
  merge: -1
  img_proc: true
- pgno: 368
  md: '+   - 实现测试：目的是实现在设计测试中定义的测试规程


    +   - 测试规程通常在测试自动工具环境或程序设计环境中产生。生成出来的制品是计算机可读的测试规程版本，叫做测试脚本


    +   - 如果需要特定的测试代码，则需要设计师和实现人员与测试设计师共同合作以设计和实现测试代码'
  merge: -1
  img_proc: true
- pgno: 369
  md: '+   在集成测试阶段执行测试：目的是确保在装配过程中系统地构建像预期的那样合作，同时增加的部分具有正确的行为


    +   系统测试人员增量式地编译并连接系统。对于每一个增量，都要测试增加的功能，执行回归测试，产生测试结果


    +   在系统测试阶段执行测试：目的是确保整个系统的功能都像预期的那样完成


    +   评价测试：目的是交付并评估可以计量的测试度量，以确定测试目标的质量和测试过程的质量'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# 12.9 小结


    +   - 测试是对于所生产的产品质量的评估

    +   - 在生命周期各个阶段的迭代过程中都要进行测试，以便在设计和构造过程中就获得关于产品质量的早期反馈,以改善产品质量

    +   - 质量是每一个人的职责。质量不是由质量保证或测试组织产生的。在迭代过程中，测试及时地为开发组织提供了关于质量度量的反馈，从而可以使开发组织提高系统的质量

    +   - 测试工作流为项目提供了反馈机制，可以度量质量并标识缺陷。'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 第13章 配置和变更管理工作流'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# 目录


    +   - 13.1 目的

    +   - 13.2 CCM立方体

    +   - 13.3 工作人员和制品

    +   - 13.4 工作流

    +   - 13.5 工具(略)

    +   - 13.6 小结'
  merge: -1
