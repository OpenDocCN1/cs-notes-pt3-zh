- pgno: 268
  md: '# 自动业务工作人员


    +   假如要建立一个可以使一组业务过程完全自动化的系统，例如电子商务应用系统。这时的业务工作人员的职责将移交给业务参与者,即从职员变为客户


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_268_0.png)'
  merge: -1
