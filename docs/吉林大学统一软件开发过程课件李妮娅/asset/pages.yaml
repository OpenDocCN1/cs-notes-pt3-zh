  md: '# 主要活动


    +   - 系统化地明确表述项目的范围——即捕获项目的语境、需求及限制。

    +   - 计划并准备业务用例，评价风险管理、人员配备、项目计划，权衡成本、进度和利润。

    +   - 合成一个候选构架，评价有关设计因素，评估制作/买进/重用的对策，以估算成本、进度和需要的资源'
  merge: -1
