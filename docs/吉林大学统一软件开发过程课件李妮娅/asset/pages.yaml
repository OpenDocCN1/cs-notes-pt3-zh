- pgno: 83
  md: '# 制品集


    +   - **RUP中的制品分为五个信息集(information set)**

    +     - 管理集：计划制品、版本说明、状态评估等

    +     - 需求集：构想文档、业务模型、用例模型等

    +     - 设计集：设计模型、构架描述、测试模型等

    +     - 实现集：源代码和可执行程序、相关数据文件等

