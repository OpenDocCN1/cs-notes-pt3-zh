  md: '# 8 结束项目


    +   - 包括以下活动

    +     - 项目经理执行

    +       - 项目结束准备

    +     - 项目评审员

    +       - 项目接受评审


    评估项目是否可以接受，如果可以接受，标记出在什么状况下客户正式地接受产品所有权。而后，项目经理在处理了剩余资产并重新分配了剩余工作人员的任务后，就可以将项目结束了


