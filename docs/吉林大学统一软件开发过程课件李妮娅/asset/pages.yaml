- pgno: 373
  md: '# 13.1 目的


    +   - 配置和变更管理工作流的目的是跟踪并维护不断进化的项目资产的整体性

    +   - 项目组必须能够标识和定位制品,选择合适的制品版本,察看它的历史,以理解它当前的情况和它变更的原因,并确定当前对它负责的工作人员

    +   - 项目组必须跟踪产品的进化,捕获并管理对于变更的请求,然后通过一系列制品以一致的方式实现变更'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# 13.2 CCM立方体


    +   - 配置和变更管理(CCM)包含3种相互依赖的功能

    +     - 配置管理(与产品结构有关)

    +     - 变更请求管理(与过程结构有关)

    +     - 状态和度量(与项目控制结构有关)


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_374_0.png)'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# 配置管理


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_375_0.png)


    重要的制品要受到版本控制。当一个制品进化时，就出现了多重版本，必须标识制品、制品的版本以及制品的变更历史'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 配置管理处理产品结构。


    +   - 包括制品的标识和版本、制品之间的相互依赖关系以及配置的标识等问题；

    +   - 还处理提供个人和群组工作空间的问题

    +   - 建立管理的目的是确保组成构造(Build)的构件是可用的，并且根据这些构件之间的依赖层次以正确的顺序集成为这个构造'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 变更请求管理


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_377_0.png)


    +   - 变更请求可以用简单的状态机表示它的生命，状态分为新的、已记录的、已批准的、已赋值的和完成了的等不同状态。

    +   - 当变更请求从一个状态转移到另一个状态，关于变更的信息就会增加。'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# 变更需求管理处理过程结构。


    +   - 一个变更请求是一份需要变更的一个或多个制品的文档化的建议


    +   - 变更请求可能来源于不同原因: 修复缺陷、提高产品质量、增加需求，或记录在一个迭代和下一个迭代之间的增量


    +   - 变更需求管理还对变更带来的潜在影响进行分析，并跟踪变更请求带来的影响，直至变更结束'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 状态和度量


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_379_0.png)


    变更请求具有状态，也具有其他如根本原因、种类(例如缺陷或添加)、严重性、优先级和受影响的领域(如层或子系统)等属性。变更请求的不同状态提供了有用的标记，可以作为度量元报告的基础'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 状态和度量处理项目控制结构。


    状态和度量抽取与项目管理有关的信息，便于质量评估：


    +   - 产品状态、进展、趋势和质量

    +   - 完成了什么，没有完成什么

    +   - 花费

    +   - 需要关注的问题领域'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 13.3 工作人员和制品


    +   - 配置经理负责建立产品结构，供开发人员定义和分配工作空间以及在集成阶段进行相应的操作。配置经理还要向项目经理提交适当的状态和度量元报告


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_381_0.png)'
  merge: -1
  img_proc: true
- pgno: 382
  md: '变更控制经理负责监控变更控制过程。还负责定义变更请求管理过程


    +   - 其他工作人员

    +     - 实现人员：访问他们所需要的合适的工作空间和制品

    +     - 集成人员：在集成工作空间中验收变更并建立产品

    +     - 任何工作人员：都可以提交变更请求

    +     - 构架师：根据实现视图提供产品结构的输入


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_382_0.png)'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 13.4 工作流


    +   - 变更和交付配置条款

    +   - 管理基线和发布

    +   - 监控和报告配置状态

    +   - 管理变更请求


    计划项目配置和变更控制


    建立项目CM环境


    计划项目配置和变更控制


    建立项目CM环境


    变更和交付配置条款


    管理基线和发布


    监控和报告配置状态


    管理变更请求'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# 13.6 小结


    +   - 配置和变更管理工作流的目的是项目制品在响应变更请求而不断进化的情况下维持他们的整体性

    +   - 配置管理处理产品结构，标识元素、版本、有效的配置元素和工作空间

    +   - 变更请求管理包括以一致的方式修改制品的过程

    +   - 从配置和变更管理信息中可以提取状况和度量元，以协助状态评估'
  merge: -1
  img_proc: true
