- pgno: 70
  md: '# 3.1 RUP模型


    +   - 一个模型描述了**谁来做**、**做什么**、**怎么做**和**什么时候做**。

    +   - RUP应用了四种重要的模型元素。

    +     - 工作人员(worker)：谁来做

    +     - 活动(activity)：怎么做

    +     - 制品(artifact)：做什么

    +     - 工作流(workflow)：什么时候做'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 工作人员、活动和制品


    Worker


    Activity


    Artifact


    Use-Case Specifier


    responsible for


    Use Case


    Use-Case Package


    Describe a Use Case


    描述一个需要某个 worker 执行的工作


    表示一个角色，可以由一个人充当，也可以由一个团队来充当


    表示过程产生、修改或使用到的一种信息'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 3.2 工作人员


    +   - 工作人员(worker)定义了个人或一个工作组的行为和职责。


    +   - 行为用活动(activity)表示，每一个 “worker” 都与一组 “内聚” 的活动相联系。  - 内聚是指这些活动最好由一个人来完成。


    +   - 职责的表示通常与某一特定制品(artifact)相联系，这些制品由worker制造、修改和控制。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 常见的工作人员


    +   - **系统分析员**

    +     - 概述系统功能和界定系统

    +     - 引导和协调需求，用例建模

    +   - **设计师**

    +     - 定义一个或多个类的职责、操作、属性和它们之间的关系

    +     - 决定如何调整类以适应实现环境

    +   - **测试设计师**

    +     - 计划、设计、实现和评估测试，包括产生测试计划和测试模型，执行测试规程，评估测试覆盖度、测试结果和测试效率'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# worker与个人之间的关系


    +   - “worker”是角色，每个个人可以充当多种“worker”，一个“worker”也可能由若干个人充当。

    +   - 从个人到“worker”的映射由项目经理来指定


    ![](img/75c19a0b3beca8d57ae1411ebd6944cc_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 3.3 活动


    +   - 活动(activity)定义了worker执行的工作

    +   - 活动有明确的目的，能够产生有意义的结果。通常是生产制品或更新制品(如模型、类或计划)

    +   - 活动时间可以是几个小时到几天

    +   - 一个活动通常涉及一个worker，影响到一个或几个制品

    +   - 多个活动也可能重复作用于一个制品，如从一个迭代过程到另一个迭代过程时'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 常见的活动


    +   - 计划迭代过程

    +     - 项目经理完成

    +   - 寻找用例和参与者

    +     - 系统分析员完成

    +   - 评审设计

    +     - 设计评审员完成

    +   - 执行性能测试

    +     - 性能测试人员完成'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 活动步骤可以分解为三步


    +   - 思考步骤(thinking step)

    +     - 理解任务的性质

    +     - 收集和检验输入制品

    +     - 阐明输出

    +   - 执行步骤(performing step)

    +     - 生产或更新制品

    +   - 评审步骤(reviewing step)

    +     - 根据一些标准检验结果'
  merge: -1
  img_proc: true
