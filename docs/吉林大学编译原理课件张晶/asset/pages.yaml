  md: '例：假设有实在函数调用 f(X+1, Y)，并且 x 是一般整型变量，Y 是变参整型变量，f函数名，同时假设 f 的两个形参第一个是值参、整数类型，第二个是变参、整数类型，则对应的中间代码如下：


    +   - ( ADDI , X , 1 , t₁ )

    +   - ( ValACT , t₁ , Offset₁ , 1 )

    +   - ( VarACT , Y , Offset₁+1 , 1 )

    +   - ( CALL , f , true , t₂ )


