- pgno: 63
  md: '# 状态转换矩阵的实现


    +   1. 当前状态State置为初始状态；

    +   2. 读一个字符 → CurrentChar；

    +   3. 如果CurrentChar≠Eof并且

    +      T(State, CurrentChar)≠error，

    +      则当前状态转为新的状态：

    +      State = T(State, Current)，

    +      读下一字符 → CurrentChar；

    +      重复第3步工作.

    +   4. 如果当前字符为Eof并且当前状态属于终止状态，则接受当前字符串，程序结束；否则报错.'
  merge: -1
  img_proc: true
