- pgno: 584
  md: '# 多寄存器的分配


    为了产生更高效的目标代码，合理利用寄存器资源，需要构造一个寄存器状态表：


    | 名字 | 状态 | 变量名 |

    |------|------|--------|

    | R1   | 0/1  | X      |


    当需要用到一个寄存器时，可以用一个函数查找寄存器表，检查是否存在空闲寄存器，若存在，则将空闲的寄存器分配，然后按寄存器计算操作来操作，同时把相应的寄存器的状态和占用者记录在寄存器状态表'
  merge: -1
  img_proc: true
- pgno: 585
  md: '# 多寄存器的分配


    +   - 当所有寄存器都被占用时，涉及到寄存器的剥夺问题。剥夺算法优劣会影响目标程序的执行效率。

    +   - 对寄存器的剥夺是把寄存器中的内容存入内存中。

    +   - 理论上的最优是最远使用点方法，实现困难

    +   - 局部最优是基本块内最远使用点方法'
  merge: -1
  img_proc: true
- pgno: 586
  md: '# 考虑寄存器分配的(+ ,A,B,t)的代码生成


    | (+, A, B, T) | B不在寄存器且不活跃 | B不在寄存器且活跃 | B在寄存器R_B |

    |---|---|---|---|

    | A不在寄存器 | Load B, R_B

    Add A, R_B | Load A, R_A

    Load B, R_B

    Add R_B, R_A | Load A, R_A

    Add R_B, R_A |

    | A在寄存器R_A | Add B, R_A | Load B, R_B

    Add R_B, R_A | Add R_B, R_A |'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# 对目标程序的评价


    +   - 衡量目标代码质量的标准：

    +     - 在保证语义相等的情况下，生成的目标指令的条数越少越好，目标指令的运行速度越快越好

    +   - 对内存的访问次数总和决定了目标程序的执行效率。

    +   - 指令的执行代价：访问内存一次的代价为 1，例如间接寻址指令的代价较高

    +   - 多利用寄存器中的资源可以达到减少访问内存的效果。'
  merge: -1
  img_proc: true
- pgno: 588
  md: "# 临时变量地址分配\n\n# 临时变量的特点\n\n+   - 数量多，寿命短；\n+   - 不优化，只定义一次，使用一次，且定义点和使用点在同一个基本块内；\n\
    +   - 公共表达式节省，将出现多次引用。\n\n# 临时变量的存储空间\n\n+   - x:=a+b-c+d ，则产生的中间代码为：\n+   \n\
    +     (+, a, b, t1) (-, t1, c, t2) (+, t2, d, t3)\n+   \n+     (:=, t3, x)\n+\
    \   \n+   3个临时变量可共享一个临时单元。"
  merge: -1
  img_proc: true
- pgno: 589
  md: "# 临时变量地址分配\n\n+   • 可以 在中间代码生成或者目标代码生成时做；\n\n+   • 静态分配法（共享法）\n+   \n+   将临时变量的空间安排在AR栈区。计算出临时变量的活动区间，如果两个活动区间不相交，则可以共享同一单元。\n\
    \n+   • 动态分配法（随用随分配法）\n+   \n+   过程调用时分配的AR区中不含临时变量部分，以后每当要保存临时变量的值时，动态分配到栈区。当临时变量所占的空间比较大时，这种方法比较好。"
  merge: -1
  img_proc: true
- pgno: 590
  md: '# 总结


    +   - 目标程序的生成要考虑的问题：

    +   - 目标机的具体形式

    +   - 如何把四元式翻译成目标程序

    +   - 优化，如何高效的生成目标代码。


    +   - 要注意的问题：

    +   符号表一直存在到目标代码生成，目标代码生成之后没有符号表，运行的只是目标程序。'
  merge: -1
  img_proc: true
