- pgno: 180
  md: '# 3.1 提取公共前缀


    +   公共前缀: A的不同产生式的右部具有相同的前缀. 这种情形不满足自顶向下的语法分析条件。


    +   可用提取左因子的方法消除产生式的公共前缀. 假定关于 A 的规则是:


    A→δβ₁ | δβ₂ | … | δβₙ | γ₁ | γ₂ | … | γₘ (其中每个γ不以δ开头)


    则将这些规则写成:


    A→δA′ | γ₁ | γ₂ | … | γₘ


    A′→β₁ | β₂ | … | βₙ


    经过反复提取左因子，就能够使每个非终极符的不同产生式的右部具有不同的前缀。'
  merge: -1
  img_proc: true
