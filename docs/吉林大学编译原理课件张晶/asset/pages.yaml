- pgno: 455
  md: '# 基本块的定义


    基本块是程序中最大限度顺序执行的语句序列，其中只有一个出口和一个入口。


    +   - 入口：基本块的第一条语句；

    +   - 出口：基本块的最后一条语句；


    ![](img/7af61167a39fb64ab49c400b070747c4_455_0.png)'
  merge: -1
  img_proc: true
- pgno: 456
  md: '+   对于一个基本块而言，执行时只能从它的入口进入，从出口退出；


    +   一个基本块内部的语句要么全执行，要么全不执行，不能执行其中的一部分，不能在中间转出，也不能从中间转入。


    +   基本块可以基于源代码、中间代码和目标代码。'
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 基本块的划分原则


    +   - 整个四元式序列的第一个四元式为基本块的入口四元式

    +   - 遇转移性四元式时，结束当前基本块，并把该四元式作为当前基本块的出口，下一条四元式作为新基本块的入口

    +   - 遇标号性四元式时结束当前基本块，四元式本身作为新基本块的入口

    +   - 遇到对地址引用型变量赋值四元式时，结束当前基本块，并作为该块的出口。'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 基本块的划分原则


    ◆ 转移性四元式是指在生成目标代码时一定产生跳转指令的四元式。例如：


    +   - （JMP，—，—，L）

    +   - （JMP1，E，—，L）

    +   - （JMP0，E，—，L）

    +   - （ENDPROC，—，—，—）

    +   - （ENDFUNC，—，—，—）

    +   - （THEN，E，—，—）

    +   - （ELSE，—，—，—）

    +   - （DO，E，—，—）

    +   - （ENDWHILE，—，—，—）'
  merge: -1
