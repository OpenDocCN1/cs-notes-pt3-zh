- pgno: 561
  md: '# 虚拟目标机的指令系统


    目标机指令系统的指令分成如下的形式：


    +   - 存/取指令： ST / LD


    +   - 输入输出： IN / OUT


    +   - 运算型指令： ADD SUB MUL DIV GT GE...


    +   - 转移型指令： JMP JMPT JMPF


    +   - 地址运算指令和块传递指令： LEA MOVEB'
