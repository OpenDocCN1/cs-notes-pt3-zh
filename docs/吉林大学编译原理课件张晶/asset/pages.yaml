- pgno: 131
  md: '# 特殊符号的Token生成


    查保留字、特殊符号表，确定这个特殊符号在表中的类型编码，生成该特殊符号对应的Token。


    特殊符号Token的生成过程和常量Token的生成过程比较相似，但需要注意的是查保留字、特殊符号表的作用是为了确定单词的种类，这个信息填写在单词对应Token的“类别”这一项，当单词为保留字或特殊符号时，对应Token的“内容”这一项不填任何信息；而查标识符索引表和常量索引表的作用为了确定单词的内容，这个信息填写在单词对应Token的“内容”这一项，此时单词的类别已经确定了。'
  merge: -1
  img_proc: true
