- pgno: 39
  md: '# 有限自动机


    输入带 a b c d e ...

    读头

    有限状态控制器

    初态，

    中间态，终态


    +   工作过程：在初始状态下，读头指向输入带的最左单元，准备读入第一个字符，每读入一个字符，从当前状态进入下一状态；当读头读入所有字符后，若状态进入终态，则输入带上的输入串被接受，否则，输入串有错。'
