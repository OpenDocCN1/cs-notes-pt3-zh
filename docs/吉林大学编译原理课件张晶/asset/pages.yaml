  md: '# 声明链和变量访问环境


    +   过程声明链(DeclaChain):过程名序列（M）是过程声明链，M是主程序名；若(M, …, P)是过程声明链，且P中有过程Q的声明，则(M, …,
    P, Q)也是过程声明链；

    +   记为： DeclaChain(Q)=( M, …, P, Q )


    +   当前变量访问环境VarVisitEnv:

    +   若DeclaChain(Q)= [M, …, P, Q] 则

    +   VarVisitEnv(LAR(Q))=[LAR(M), …, LAR(P), LAR(Q)]'
