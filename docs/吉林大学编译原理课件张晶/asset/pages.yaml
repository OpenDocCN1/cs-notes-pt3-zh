- pgno: 422
  md: "# 过程调用和函数调用的动作文法\n\n```\n<ProcFunCall> → id #CallHead#\n        ( <ParamList>\
    \ ) #CallTail#\n```\n\n```\n<ParamList> → ε | <ExpList>\n```\n\n```\n<ExpList>\
    \ → E #ActParam# <NextList>\n```\n\n```\n<NextList> → ε | , <ExpList>\n```\n\n\
    其中\n\n+   CallHead: 当遇到过程 / 函数名 id 时，将其符号表地址压入 Sem 栈，令实参计数器为 0。\n\n+   ActParam:\
    \ 对每个实参 Eᵢ：产生它的中间代码，将结果的类型和语义信息压入 Sem 栈，实参计数器加 1。"
  merge: -1
  img_proc: true
- pgno: 423
  md: '# CallTail:


    ```

    <ProcFunCall> → id #CallHead#

    ( <ParamList> ) #CallTail#

    <ParamList> → ε | <ExpList>

    <ExpList> → E #ActParam#

    <NextList>

    <NextList> → ε | , <ExpList>

    ```


    +   - 取出 id 的所有语义信息。

    +   - 检查形、实参个数是否一致，检查形容；

    +   - 产生送实参信息到形参信息的 Vai Act.

    +   - 根据 f 是实在过程(函数)名或形式过程 的 CALL 代码；

    +   - 删除当前过程 / 函数调用语句所占的语义栈单元，如果 f 是函数，则把返回值的类型和语义信息压入 Sem 栈。


    ```

    Sem

    ( Eₙ . typ , Eₙ 语义信息 )

    ....................

    ( E₁ . typ , E₁ 语义信息 )

    ( — , id )

    ```'
