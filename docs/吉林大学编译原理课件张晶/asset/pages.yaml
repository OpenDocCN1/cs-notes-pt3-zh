- pgno: 328
  md: '# 3.5 符号表的组织


    从符号表的组织方式上看，可分为两大类：一类是局部式，一类是全局式。


    +   > 全局式符号表则把整个程序的符号表作为一个表，即建表和查表单位是整个符号表；


    +   > 局部式符号表是指把每个局部化单位的符号表作为一个独立的表来处理，即把每个局部符号表作为建表和查表单位。'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 一、全局式线性组织的符号表的局部化处理思想


    +   - 每当进入一个局部化区，记住本层符号表的始地址；

    +   - 每当遇到定义性标识符时，构造其语义信息并查本层符号表，若查到同名标识符，则表示有错，否则往符号表里填写标识符及其语义信息。

    +   - 每当遇到使用性标识符时，查整个符号表（从后往前），若查不到同名标识符，则表示有错（因为我们假定声明在前），否则找出相应语义信息并将它传给有关部分。

    +   - 每当结束一个局部化区时，“删除”本层符号表。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '+   > 用一个Scope栈来实现标识符的嵌套作用域，

    +   > Scope[ℓ]指向ℓ层符号表始地址；

    +   > “删除”本层符号表的方法一般有两种：

    +   > 1. 真删除法:当退出一个局部化单位时，删除掉该局部化单位的符号表；

    +   > ℓ表示层数计数器， s表示符号表的最后一项的地址，则删除式的局部化算法如下：

    +   >     s := Scope[ℓ]-1

    +   >     ℓ := ℓ-1;'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 2. 驻留法:不删除表，但采取一定措施不去查那些已无效的符号表部分。算法如下：


    每当退出一个局部化区时，将一个跳转项添加到符号表中：


    ```

    s := s +1 ;

    SymbTab[s]:=( # , Scope(ℓ)-1)

    ```'
