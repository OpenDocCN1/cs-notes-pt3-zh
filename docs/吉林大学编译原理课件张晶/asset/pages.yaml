- pgno: 302
  md: '# 1.1 地址分配原则


    +   - 静态分配

    +     在编译时间即为所有数据对象分配固定的地址单元，且这些地址在运行时间始终保持不变。是一种直观的方法，但不适用于动态申请空间。

    +   - 动态分配

    +     程序中变量分配的地址不是具体的地址，而是一个抽象地址，当程序运行时根据抽象地址分配具体的物理地址。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 1.2 抽象地址的结构


    | 层数 | 偏移 |

    |---|---|


    +   - 抽象地址的形式是一个二元组，由层数和偏移组成。

    +   - 层数主要是针对嵌套式语言，表示的是某个函数所处的嵌套定义层数。

    +   - 偏移是针对过程活动记录的一个相对偏移量'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# 1.3 层数的定义


    +   ◆ 嵌套式语言中：

    +   ❖ 主程序设为0层

    +   ❖ 主程序直接定义的函数和过程定义为1层

    +   ❖ 若某函数为L层，则该函数直接定义的函数为L+1层


    +   ◆ 并列式语言中：

    +   ❖ 全局变量定义为0层，所有函数为0层，函数中定义的变量为1层'
  merge: -1
  img_proc: true
