- pgno: 505
  md: "# 静态存储分配实例\n\n```\nint sum = 0;\nint square(int i)\n{\n    int j;\n    j =\
    \ i * i;\n    return j;\n}\nvoid main()\n{\n    int j;\n    j = square(n);\n \
    \   sum = sum + j;\n}\n```\n\n```\n(ENTRY, L_sqr, 3+off, 1)\n(*, i, i, t₁)\n(assig,\
    \ t₁, _, j)\n(RETURN, _, _, j)\n(ENDFUN, _, _, _)\n(ENTRY, L_main, 3+off, 1)\n\
    (VALACT, n, off_i, 1)\n(call, square, true, t₂)\n(assig, t₂, 1, j)\n(+, sum, j,\
    \ t₃)\n(assig, t₃, 1, sum)\n(ENDFUNC, _, _, _)\n```\n\n| 目标代码 |\n| sum |\n| 常量信息表等...\
    \ |\n| square的控制信息 ... |\n| i |\n| j |\n| t₁ |\n| main的控制信息 ...... |\n| j |\n\
    | t₂ |\n| t₃ |"
  merge: -1
  img_proc: true
- pgno: 506
  md: '# 静态存储分配


    +   完全采用静态分配策略的语言必须满足以下约束条件：

    +   1. 不允许有递归过程/函数。

    +   2. 数据对象的长度和它在内存中位置，必须是在编译时可知。

    +   3. 不允许动态建立的数据结构（如动态数组、指针等），因为没有运行时的存储分配机制。'
  merge: -1
