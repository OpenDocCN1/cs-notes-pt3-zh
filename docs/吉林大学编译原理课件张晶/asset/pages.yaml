- pgno: 449
  md: '# 常见的编译优化的种类


    +   常表达式的节省


    假如在计算过程中有一个表达式是3*3.14，乘法运算的两个操作数都是常量，因此它的结果是可以立即计算出来的。如果在编译的过程中把3*3.14算出来，在目标程序的进行中就不用进行计算了。


    +   公共子表达式节省(消除重复操作)


    +   t = b*c; e = b*c+b*c; c=b*c+10; d=b*c+d;


    +   a[i][j]+a[i][k]'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 常见的编译优化的种类


    +   - 循环不变量式外提

    +     - while (k<10) {a[k] = b*c; k=k+1}

    +     - t = b*c; while(k<10) {a[k]=t; k=k+1;}


    如果有表达式的值在循环中不会改变，就需要把它提到循环体外面，可以大大提高目标程序的运行效率'
