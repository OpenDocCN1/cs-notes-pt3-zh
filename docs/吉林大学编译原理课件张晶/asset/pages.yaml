- pgno: 481
  md: "例如，假设有程序段：\ni :=1; // t=x*y;\nwhile i <=1000 do\n    begin a[i] := x*y //t\
    \ ; i :=i+1 end;\n则x*y是该循环的不变表达式，可以把它提到循环外边\n\n矩阵乘法：有a，b为10*10数组\nfor (i=1~10)\n\
    \    for (j=1~10)\n        for (k=1~10)\n            c[i][j]=c[i][j]+a[i][k]*b[k][j];\n\
    a[i]地址的计算与j、k循环无关，c[i][j]地址的计算与k循环无关"
