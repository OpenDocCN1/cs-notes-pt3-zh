  img_proc: true
- pgno: 314
  md: '# 1、线性组织


    +   录入方式 符号表中表项按符号被扫描到的先后顺序录入；


    +   线性组织的优点 没有空白项，存储空间效率高。


    +   线性组织的缺点 运行效率低，特别当表项数目较大后效率就非常低。对于符号个数无法确定的情况下，无法确定符号表的总长度。但当事先能确定符号个数且个数不大（公认小于20）的情况
    下，使用线性组织是非常合适的。'
