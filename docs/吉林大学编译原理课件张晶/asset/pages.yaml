- pgno: 478
  md: '# 基于值编码的公共表达式节省


    算法流程：从基本块的第一条四元式开始


    +   - 等价变量表PAIR替换

    +   - 对四元式中的分量进行编码

    +   - 值编码表替换，生成编码四元式（当前表达式的映象码）

    +   - 遇到运算型四元式，查当前基本块中已处理过表达式的映象码中是否存在与编码四元式运算符、运算分量都相同的，若存在则说明当前表达式为公共表达式，删去当前四元式，把等价的名字填入等价变量表

    +   - 遇到赋值（=，a，-，b），b的编码赋值为a的编码'
