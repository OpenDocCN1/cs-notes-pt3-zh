    （ω*，Sem[top−1].FORM / tempArg, Sem[top].FORM/tempArg, t）；

    ```


    （5）从语义栈Sem中删除左、右运算分量Sem[top−1]和 Sem[top]，并把运算结果的语义信息压入Sem栈。'
