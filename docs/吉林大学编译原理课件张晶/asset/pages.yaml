- pgno: 366
  md: '# 3. 语法制导方法


    +   - 语法制导技术在处理和规则相关联的任务中有着重要的应用

    +   - 语法制导就是在进行语法分析的同时要完成相应的语义动作，这些语义动作都是由一些程序组成的，要完成和用户的需求相关联的任务

    +   - 编译器对一个串进行语法检查的同时，可以按照语法分析的程序的结构对程序进行我们所需要的操作，从而解决我们想要解决的问题。'
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   - 语法制导方法的种类：语法制导方法依赖于具体的语法分析方法，因此可以分为自顶向下语法制导方法和自底向上语法制导方法。自顶向下语法制导方法中通常采用LL(1)分析方法为基础，而自底向上语法制导方法中通常以LR(1)分析方法为基础。

    +   - LL(1)语法制导方法是在LL(1)文法的基础上加入语义动作符来表示相应的语义子程序，语义动作符可以加在产生式右部的任何位置。在进行LL(1)语法分析的过程中每遇到语义动作符，则调用相应的语义子程序来完成相应的语义处理。

    +   - LR(1)语法制导方法是在LR(1)文法的基础上加入语义动作符来表示相应的语义子程序，每条产生式最多配有一个语义规则，即语义动作符只能加在产生式的最右部。在进行LR(1)语法分析的过程中，每当按照某个产生式的右部进行规约时，就调用该产生式右边的相应的语义子程序来完成相应的语义处理。'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# LL(1)语法制导方法的实例


    +   - 设有如下LL(1)文法：


    ```

    G:


    S → A B

    A → a A | b

    B → b B | c

    ```


    要求：应用语法制导翻译方法完成如下任务：对输入文法 G 的任意句子 L，输出 L 中 b 串的长度。如串 abbbbc 是 G 的句子，则该处理器将输出4。'
  merge: -1
