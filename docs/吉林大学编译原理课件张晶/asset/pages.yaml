- pgno: 565
  md: '# 四元式转化为目标指令


    四元式等价地转换成目标指令需要用到两个栈：


    +   标号定位栈L1：定位性标号是为了某些转移提供地址，需要把暂时没用到的标号存在栈中，例如while四元式可以对应一个嵌套的循环，在定位产生时还没产生跳转指令，它的地址还没用到，为了让后面能用到需要用栈把标号保存下来


    +   目标指令地址栈L2：在有些产生跳转指令的时候，转移地址暂时无法确定，例如do四元式，不知道后面的转移地址，则把当前目标指令地址存到栈里，在知道转移地址以后，回填这个指令地址。回填地址是编译中的一项非常重要的技术'
  merge: -1
  img_proc: true
- pgno: 566
  md: '# 运算型四元式目标代码生成


    运算型四元式（ω，X，Y，T）：对应生成3条指令


    ```

    LD R X;    把X取到R中

    ```


    ```

    ω R Y;    根据运算符对应的运算生成指令，结果存入R

    ```


    ```

    ST T R;    将R中的内容存入T中

    ```


    两点重要的解释：


    +   ◆ 目标指令中X，Y，T对应一个具体的地址，如 sp+offₓ


    +   ◆ 如果X、Y为间接变量，这里的寻址方式为间接，如X为间接变量，用*X表示它是一个间接寻址方式。


    ```

    LD R *offx[sp];

    ω  R *(offy+d[L])[sp];

    ST *offₜ[sp] R;

    ```


    ```

    LD R *X;

    ω  R *Y;

    ST *T R;

    ```'
  merge: -1
  img_proc: true
