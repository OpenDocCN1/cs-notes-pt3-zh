    +   如果对文法G中的任一产生式均限制为形如：

    +   αAβ → αγβ

    +   其中A∈V_N，α，β∈(V_T ∪ V_N)*，

    +   γ∈(V_T ∪ V_N)*，

    +   则称文法G为1型文法或上下文相关文法。


    +   2 型文法（又称上下文无关文法context-free Grammer CFG）

    +   如果对文法G中的任一产生式均限制为形如：

    +   A → α

    +   其中A∈V_N，α∈(V_T ∪ V_N)*，

    +   则称G为2型文法或上下文无关文法。'
