- pgno: 511
  md: '# 栈式管理中的过程活


    +   (1) 临时变量区 用于存放表达式计算 寄存器不足以存放所有这些临时变量 存放在临时变量区中。

    +   (2) 局部变量区 保存过程局部声明的数据。

    +   (3) 形参变量区 用于存放调用过程提供的实在参数。

    +   (4) 返回值 存放一存储空间地址，该存储空间用于存放被调用过程返回给调用过程的值。

    +   (5) 变量访问环境 提供非局部变量的访问环境。


