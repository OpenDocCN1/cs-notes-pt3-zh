- pgno: 67
  md: '# 1.1 非确定有限自动机的定义


    +   - 非确定有限自动机NFA为一个五元组 (Σ, S, S₀, f, Z)，其中：

    +     - Σ是一个有穷字母表，它的每个元素称为一个输入字符；

    +     - S是状态的集合，它的每个元素称为一个状态；

    +     - S₀ ⊆ S，是非确定有限自动机的初始状态集；

    +     - f是一个从S × (Σ ∪ {ε})到S 的子集的映射，即 S × (Σ ∪ {ε}) → 2^S

    +     - Z ⊆ S，是一个终止状态集，又称为接受状态集'
  merge: -1
  img_proc: true
