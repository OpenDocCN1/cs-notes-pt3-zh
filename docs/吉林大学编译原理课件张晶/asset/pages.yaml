  md: '其中：


    +   - Init用来初始化下标计数器 k = 0;

    +   - 遇到变量标识符，则调用PUSH(id)把其语义信息（一般为类型和地址）入栈中;

    +   - 在下标表达式之后，调用AddNext，用于生成地址累加的四元式。它的算法是：'
  merge: -1
