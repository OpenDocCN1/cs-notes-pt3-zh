- pgno: 234
  md: '# 2. 语法分析程序的构造


    +   具体构建流程

    +   给定一个文法G

    +   1. 求每条规则的Predict集

    +   2. 写针对每个非终极符的函数

    +   3. 写主函数


    优点：

    构造简单


    +   缺点：

    +   1. 频繁的函数调用影响效率

    +   2. 程序比较长


    终极符产生匹配命令，而非终极符则产生调用命令。因为文法递归相应子程序也递归，所以称这种方法为递归子程序方法或递归下降法。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '例：假设有文法


    Z → a B a


    B → b B | c


