- pgno: 268
  md: '# 1.5 语义错误检查


    +   标识符声明和使用相关的语义错误


    +   常见的语义错误：

    +   - 每个使用性标识符是否都有声明？在同层内有无标识符被声明多次？

    +   - 标号是否有声明？有无重复声明和重复定位错误？有无非法转入错误？


    +   如何检查？


    +   每当遇到新声明的标识符,查符号表：

    +   - 如果当前有效的所有标识符中有相同名字,则是重复声明错误；

    +   - 否则生成它的属性信息,保存到符号表中；


    +   每当遇到标识符的使用,查符号表

    +   - 如果没有找到,说明该标识符没有声明；

    +   - 如果找到,则可获取该标识符的属性,进行进一步分析；'
  merge: -1
  img_proc: true
