- pgno: 306
  md: '# 1.5 空间分配原则


    +   - 临时变量分配一个单元(这个只是假设，具体情况根据目标机和操作数的类型决定)

    +   - 局部变量按类型大小分

    +   - 形参

    +     - 地址引用型形参：分一个单元

    +     - 值引用型形参：按类型大小分

    +     - 过/函形参：分两个单元（入口地址，Display表信息）'
  merge: -1
