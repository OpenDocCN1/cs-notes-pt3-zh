- pgno: 313
  md: '# 2.2 符号表表项的排列


    +   - 研究符号表项排列的意义：编译过程中，每当遇到一个名字都要查找符号表。如果发现一个新名字，或者发现已有名字的新信息，则要修改符号表，填入新名字和新信息。符号表被频繁地用来建表、查表、填充和引用表的属性，因此表项的排列组织对系统运行的效率起着十分重要的作用。

    +   - 由于符号表的建立是一次性的，符号表的查找是重复性的，因此查表的方法更为重要，对查表效率的要求决定了建表的方法。'
