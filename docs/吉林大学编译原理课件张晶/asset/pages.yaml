- pgno: 251
  md: '# 1.1 LR方法基本思想


    符号栈 #α 有终极符也有非终极符


    输入流 β# 终极符


    +   若要分析的串没有语法错误，则αβ一定是文法的一个句型


    +   LR方法的主要思想是，从输入流依次把符号移入符号栈，直至栈顶出现一个句柄；之后对句柄进行归约，直至栈顶不出现句柄；重复上述过程，直至最终归约为一个开始符，且输入流为空。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 1.2 LR类分析方法的关键问题


    +   - 如何判断分析栈内容是否为可归前缀

    +     - 当分析栈的尾部含且仅含一个句柄（句柄后不再有其他符号）时，分析栈的内容构成一个可归前缀


    +   - 能唯一确定可归前缀中的句柄

    +     - 能根据句柄确定归约动作对应的产生式

    +     - （不同产生式可能有相同右部）'
