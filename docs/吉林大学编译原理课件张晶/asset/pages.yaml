- pgno: 560
  md: '# 目标代码的种类


    实际目标代码


    机器代码


    绝对地址机器代码：绝对机器语言代码即是能够立即执行的机器语言代码，代码中所有地址均已定位，编译后可直接执行。


    可重定位的机器代码：当程序执行时，必须由连接装入程序把它们和一些运行时子程序连接起来，转换成可立即执行的机器语言代码。


    汇编代码必须将汇编语言代码转换成可执行的机器语言代码才可以执行。


    虚拟目标代码：虚拟机上的目标程序。


    在本地机器上具备虚拟机的解释器。'
