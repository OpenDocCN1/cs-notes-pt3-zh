  md: '# 2. 符号表概述


    +   - 符号表在编译的不同阶段都要用到

    +     - 在语义分析中，符号表所登记的内容将用于语义检查（如检查一个名字的使用和先前的声明是否一致）；

    +     - 在产生中间代码中，用于类型检查及转换；

    +     - 在目标代码生成阶段，当对名字进行地址分配时，符号表是地址分配的依据；'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 合理地组织符号表的意义：


    在编译程序工作的过程中，需要对符号表进行频繁的访问（查表和填表等操作），因此合理地组织符号表，并相应地选择好查表和填表的方法，是提高编译程序效率的重要一环。


    # 组织符号表主要解决的问题：


    +   - 符号表的总体组织

    +   - 符号表表项的排列

    +   - 符号表的局部化'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 2.1 符号表的总体组织


    +   - 符号表存储的是标识符的语义信息，包含两部分：标识符的名字；语义字（种类、类型、抽象地址…）

    +   - 不同类别的标识符所包含的信息是不同的。

    +   - 符号表的总体组织既可以采用多表结构，也可以采用单表结构，也可以二者折中。究竟采用哪种结构并没有统一的规定，编译程序可根据实际处理语言的需要进行选择。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 1、多表结构


    +   - 是将属性完全相同的那些符号存放在一张符号表中，从而有常量表、类型表、变量表等。

    +   - 多表结构的优点：每个符号表的属性个数和结构完全相同，各各表项是等长的，并且表项中的每个属性都是有效的，管理起来方便一致，空间效率高。

    +   - 多表结构的缺点：编译程序将同时管理若干个符号表，增加了总体管理的工作量和复杂度。并且对各类标识符的共同属性如类型的管理必须设置重复的运行机制。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 2、单表结构


    是将所有符号都组织在一张符号表中。


    +   ◆ 单表结构的优点：总体管理集中单一，且不同种类符号的共同属性可一致地管理和处理。

    +   ◆ 单表结构的缺点：由于符号属性的不同，为完整表达各类符号的全部属性必将出现不等长的表项，以及表项中属性位置交错重叠的复杂情况，极大地增加了符号表管理的复杂度。

    +   ◆ 可行的解决方法：把所有符号的可能属性作为符号表表项属性。


    +   ■ 优点：有助于降低符号表管理的复杂度；

    +   ■ 缺点：对于某些类具体符号可能增加无用的属性空间，从而增加了空间开销。'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 3、折中方式


    根据符号属性相似程度分类组织成若干张表，每张表中记录的符号都有比较多的相同属性。


    按折中方式重新组织上例中的3类符号，可构成2张符号表，如图所示：


