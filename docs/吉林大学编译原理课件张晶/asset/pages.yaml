- pgno: 89
  md: '# 2.3 自动机的最小化


    +   ♦ 定义：最小(最简)自动机

    +   如果DFA M 没有无关状态，也没有等价状态，则称M 为最小自动机


    +   ♦ 结论：任一DFA都可以化为最简自动机，即任一DFA M都存在DFA M''，使得

    +   L(M)=L(M'')，且M''是最简自动机'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 2.4自动机的化简


    +   状态分离法


    +   状态分离法的目标：

    +   SS = SS₁ ∪ SS₂ ∪ …… ∪ SSₙ 其中：SSᵢ ∩ SSⱼ = Φ（i ≠ j 时），并且每个SSᵢ中的所有状态均等价。


    +   状态集SSᵢ对a（a∈Σ）是不可区分的：若SSᵢ中元素对输入符a都转到相同的状态集中。


    +   状态集SSᵢ对a（a∈Σ）是可区分的：若SSᵢ中元素对输入符a转到不同的状态集中。


    +   状态集SSᵢ对a（a∈Σ）进行划分：若SSᵢ中元素对输入符a转到不同的状态集中，则分别将转到相同集合中的状态组成一个新的状态集。'
  merge: -1
  img_proc: true
