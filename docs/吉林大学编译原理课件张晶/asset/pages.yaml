- pgno: 130
  md: '# 2.4 针对不同的单词生成对应的Token


    +   - 标识符的Token生成

    +     首先查找保留字、特殊符号表，判断这个字符串是否为保留字，若是则生成保留字对应Token，不是则继续查找标识符索引表，确定其在标识符索引表中的位置，生成该标识符对应的Token。

    +   - 常量的Token生成

    +     查找常量索引表，确定其在常量索引表中的位置，生成该常量对应的Token。'
  merge: -1
