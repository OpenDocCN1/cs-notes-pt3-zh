  md: '# GOTO语句和标号定位的中间代码


    有些程序设计语言的标号是用说明语句来声明的（如Pascal），而大多数程序设计语言的标号则是直接在语句前面使用。这两种情形的中间代码生成过程有所不同。'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# 对于用说明语句来定义标号的情形


    标号声明格式: LABELL L₁, L₂, ..., Lₙ


    转向语句: goto Lᵢ


    标号定位: Lᵢ : S


    标号的语义信息:所标识的代码地址，或是指其内部标号（为其分配的一个存储单元，用来存储它所标识的代码地址）。


    标号的处理原则: 设立标号表，其类似于符号表。当进入一个局部化单位时，建立本层标号表，把本层的标号及其语义信息填入表中；当结束一个局部化单位时，删除本层标号表。'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# （1）标号声明格式：


    LABEL\tL₁，\tL₂，\t……，\tLₙ；


    当扫描标号声明部分时用语义子程序


    NewLabel 给每个 Lᵢ 分配一个内部标号 LLᵢ；


    （Lᵢ，LLᵢ）填入标号表。


    +   （2）对转向语句“goto Lᵢ”，产生中间代码（JMP，—，—，LLᵢ）；


    +   （3）对标号定位“Lᵢ：……” ，产生中间代码（LABEL，—，—，LLᵢ）。'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 对于没有说明语句来定义标号的情形


    转向语句： goto Lᵢ


    标号定位： Lᵢ : S


    在处理所有整个程序之前，需要建立一个数组ArrayL来记录当前遇到的所有标号及其语义信息（内部标号及一个用于表示该标号是否已经定位了的标志），初始时为空。


    ArrayL结构：


    | 标号名 | 定位与否标志 | 地址/语义信息/内部标号 |

    |---|---|---|'
  merge: -1
  img_proc: true
- pgno: 430
  md: '| 标号名 | 定位与否标志 | 地址/语义信息/内部标号 |


    （1）每当遇到转向语句“goto Lᵢ”，先查一下ArrayL，如果没有查到该标号：则产生一条缺少（需回填）转移地址的中间代码：

    （ JMP ， — ， — ， — ），

    并把标号Lᵢ、该四元式的地址（作为Lᵢ的语义信息）以及表示该标号为未定位的标记，添加到ArrayL。


    若查到标号Lᵢ：


    +   ① Lᵢ是已经定位的了，则从ArrayL中取出它的地址LLᵢ，然后产生中间代码：

    +   （ JMP ， — ， — ， LLᵢ ）；

    +   ② Lᵢ是未定位的，则从ArrayL中取出它的地址LLᵢ，然后产生需回填转移地址的中间代码：

    +   （ JMP ， — ， — ， LLᵢ ）；

    +   ArrayL（ Lᵢ ）的地址填入上述中间代码编号。'
  merge: -1
  img_proc: true
- pgno: 431
  md: （2）每当遇到标号定位“Lᵢ：…” ，首先给每个 Lᵢ 分配一个内部标号 LLᵢ，产生中间代码：（LABEL，—，—，LLᵢ）；然后查ArrayL，如果没有标号Lᵢ则把该标号及其相应的语义信息加入中ArrayL，并且标记为已定位；如果有标号Lᵢ并标为未定位，则往对应的所有四元式回填地址。
  merge: -1
