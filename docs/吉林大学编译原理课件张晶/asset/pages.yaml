- pgno: 482
  md: '# 循环不变式外提


    +   - 解决两个问题

    +   - 检查循环体中哪些变量的值被改变过

    +   - 根据这个结果来看哪些表达式是不变的表达式

    +   - 途径：建立循环变量定值表 LoopDef，将循环体中值被改变的变量都填到该表里，若某运算型四元式中两个运算分量都不出现在这个表里，就说明其值不发生改变，可以进行外提。'
  merge: -1
