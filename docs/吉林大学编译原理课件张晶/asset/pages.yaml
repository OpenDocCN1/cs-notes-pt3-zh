- pgno: 23
  md: '# 2.2 正则表达式


    单词的本质是字符串，在词法分析中，为了用正则表达式描述单词，我们用语义函数为正则表达式和字符串集合建立一种映射关系，使得正则表达式的语义解释被描述成字符串的形式。


    在词法分析中，正则表达式e根据语义函数解释所得到的字符串集合称为正则表达式e的正则集。'
