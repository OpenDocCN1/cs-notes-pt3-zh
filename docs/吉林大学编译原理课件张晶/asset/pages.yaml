  md: "# while语句的中间代码生成动作文法：\n\n```\n<S> → while #StartWhile# <E> do\n    #DoWhile#\
    \ <S> #EndWhile#\n```\n\n其中动作子程序\n\n# StartWhile:遇 while 时：产生中间代码：\n\n```\n(WHILE\
