- pgno: 142
  md: "# # 基本概念（1）\n\n+   - **直接推导**：如果 A→β 是一个产生式，则有 α₁Aα₂→α₁βα₂，其中⇒表示一步推导。这时称 α₁βα₂\
    \ 是由 α₁Aα₂ 直接推导的，又称 α₁βα₂ 直接归约到 α₁Aα₂。\n+   \n+     ⇒的含义是，使用一条规则，代替⇒左边的符号，产生⇒右端的符号串。\n\
    \n+   - A ⇒⁺ β：表示 A 通过一步或多步可推导出 β\n+   - A ⇒* β：表示 A 通过零步或多步可推导出 β"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 基本概念(1)


    +   - 句型：设有文法G，如果有S⇒* β，则称符号串 β为G的句型。我们用SF(G)表示文法G的所有句型的集合

    +   - 句子：设β为文法G的一个句型，且β只包含终极符，则称β为G的句子

    +   - 语言：L(G)={ u | S ⇒+ u , u ∈ V_T* }。文法G所定义的语言是其所有句子的集合。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 例：对于表达式文法G：

    E→E+E | E*E | (E) | i


    E、 E+E、 i+E、 i + E*E、 i + i*E、 i + i*i 为G的句型。


    E => E+E => i+E => i+E*E => i+i*E => i+i*i


    句型：E


    句型：E+E


    句型：i+E


    句型：i+E*E


    句型：i+i*E


    句型：i+i*i'
