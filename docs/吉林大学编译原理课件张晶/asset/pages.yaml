- pgno: 354
  md: '# 2.1 逆波兰式（后缀表达式）


    将运算对象写在前面，把运算符写在后面，因而也称后缀式。


    | 程序设计语言中的表示 | 逆波兰表示 |

    | --- | --- |

    | a+b | ab+ |

    | a+b*c | abc* + |

    | (a+b)*c | ab+c * |


    逆波兰式的特点：


    +   ① 逆波兰式中的变量的次序与中缀式中的变量的次序完全一致。

    +   ② 逆波兰式中无括号。

    +   ③ 逆波兰式中的运算符已按计算顺序排列。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 后缀式的计算机处理


    +   后缀式的最大优点是易于计算机处理


    +   处理过程：


    从左到右扫描后缀式，每碰到运算对象就推进栈；碰到运算符就从栈顶弹出相应目数的运算对象施加运算，并把结果推进栈。最后的结果留在栈顶。


    例：表达式b+c*d的后缀式 bcd*+的计值过程


    ![](img/7af61167a39fb64ab49c400b070747c4_355_0.png)'
