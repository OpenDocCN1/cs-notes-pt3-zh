- pgno: 139
  md: '# 1.3 文法的定义


    # 文法的定义


    一个文法G是一个四元组： G = ( V_N, V_T, S, P ) 其中：


    +   V_T (Terminal Vocabulary) 是一个非空的有限集合，它的每个元素称为终极符号或终极符，一般用小写字母表示。从语法分析的角度看，终极符号是一个语言不可再分的基本符号。


    +   V_N ( Nonterminal Vocabulary ) 是一个非空的有限集合，它的每个元素称为非终极符号、非终极符或中间符，一般用大写字母表示。非终极符是一个语法范畴，表示一类具有某种性质的符号。注：设V是文法G的符号集，则有：
    V = V_N ∪ V_T, V_N ∩ V_T = ∅


    +   S( Start ) 是特殊的非终极符号，称为文法的开始符号， S ∈ V_N 。


    +   P ( production ) 是产生式的有限集合。所谓的产生式，也称为产生规则（简称为规则），是按照一定格式书写的定义语法范畴的文法规则。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 1.4 上下文无关文法


    产生式的形式为： A → α 的文法。其中：


    +   ① A: 称为产生式的左部(头)， A ∈ V_N；

    +   ② α: 称为产生式的右部(体)， α ∈ (V_T ∪ V_N)*；

    +   ③ “→” 或 “::=” : 读作 “定义为” 或 “由…组成”；

    +   ④ 开始符号 S 必须至少在某个产生式的左部出现一次。

    +   ⑤ 为了书写方便，若干个左部相同的产生式，如：

    +   P → α1    P → α2    ……    P → αn

    +   可合并为一个，缩写为: P → α1 | α2 | … | αn

    +   其中，每个 αi 称为 P 的一个候选式，符号 “|” 读作 “或”。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 1.4 上下文无关文法


    +   - 例子：

    +   - G = {V_N, V_T, P, S}

    +     - V_N = {N, D}

    +     - V_T = {0, 1, 2, ..., 9}

    +     - P = {N→D, N→ND, D→0|1|...|9}

    +     - S = N'
  merge: -1
