- pgno: 24
  md: '# 2.2正则表达式


    若设e、e1、e2为Σ上的正则表达式，则e所对应的正则集L(e)取值如下：


    +   1. 当e=∅时，L(e)=∅；

    +   2. 当e=ε时，L(e)={ε}；

    +   3. 对于Σ中一个字符a，若e=a，则L(e)={a}；

    +   4. 当e=e1·e2 时，L(e)=L(e1)L(e2)；

    +   5. 当e=e1|e2时，L(e)=L(e1)∪L(e2)；

    +   6. L((e))=L(e)

    +   7. L(e*)=L(e)*；

    +   8. L(e+)=L(e)+。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 容易理解的定义形式


    若用RE表示Σ上的正则表达式，L(RE)表示RE的正则集，且A、B都表示正则表达式，a表示字母表中的任意符号。有：


    +   1) ∅∈RE  L(∅)={}      2) ε∈RE  L(ε)={ε}

    +   3) a∈RE   L(a)={a}   4) (A)∈RE  L((A))=L(A)

    +   5) A|B∈RE  L(A|B)=L(A)∪L(B)

    +   6) A·B∈RE  L(A·B)=L(A)L(B)

    +   7) A*∈RE  L(A*)=L(A)*;

    +   8) A+∈RE  L(A+)=L(A)+;'
  merge: -1
  img_proc: true
