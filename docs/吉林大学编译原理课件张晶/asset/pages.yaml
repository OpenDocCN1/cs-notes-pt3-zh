  md: '# 栈式管理中的过程活动记录


    +   • 过程的活动记录：

    +   为管理过程/函数的一次活动所需要的信息，目标程序要在栈区中给被调过程分配一段连续的存储空间，以便存放该过程的局部变量值、控制信息和寄存器内容等，称这段连续的存储空间为过程的活动记录，简称活动记录（Activation
    Record），并记为AR。'
