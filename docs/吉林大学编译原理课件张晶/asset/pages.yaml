- pgno: 514
  md: '# 过程活动记录的申请和释放


    +   - 在遇到call四元式时，要生成相应的目标代码，为新的活动记录申请空间。主要工作有：

    +     - 产生一个新的活动记录，即sp=top，top=top+size

    +     - 保存寄存器内容，填写过程活动记录的管理信息，返回地址、动态链指针等等


    +   - 遇到return或遇到endfunc/endproc时，要生成相应的目标代码，收回活动记录空间。主要工作有：

    +     - 恢复现场，即恢复各寄存器的值

    +     - 释放当前活动记录即top=sp；sp=动态链指针

    +     - 根据返回地址生成跳转指令'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# 过程活动记录的申请和释放


    调用链：调用链是过程名的序列，序列的头是主程序名M（pascal主程序、C语言的main函数）。具体地说：


    +   ◆ (M) 是调用链；

    +   ◆ 若 (M, …, R) 是调用链，并且R中有S的调用，则 (M, …, R, S) 也是调用链。


    对于任一过程（函数）S，其调用链不是唯一的，每个调用链对应于一个动态的过程调用序列。


    用CallChain(S)=(M, …, R, S) 表示S的调用链，表示当前正在执行的是S的过程体，而M, …, R则是已经开始执行但被中断了的过程。'
