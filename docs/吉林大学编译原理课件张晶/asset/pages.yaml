- pgno: 338
  md: '# 2. 处理原则


    **符号表局部化处理的本质：** 在程序的某一个点P上，判断符号表的哪些信息是有效的


    **因此有以下原则：**


    +   1. 每进入一个局部化区，记录本层符号表的首地址

    +   2. 遇到声明性标识符时，构造其语义字，查本层的符号表，检查是否有重名，有则出错，否则就把其语义字填到符号表里。

    +   3. 遇到使用性出现，查符号表，如果查到则读取其语义字，否则出现语义错误。

    +   4. 退出一个局部化区，''作废''本层的符号表。'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# 3. Pascal语言的符号表的管理


    +   - Pascal语言的最大特点就是允许嵌套的过程声明。规定Pascal主程序的层数为0，在主程序中声明的标识符（包括过程/函标识符）的层数为1，在第i层过程/函中声明的标识符（包括形参和局部标识符）的层数为i+1（i≥1）。

    +   - 用一个Scope栈来实现标识符的嵌套作用域。

    +   - Scope栈的每项指向当前仍有效的某层符号表的首项，具体说Scope(0) 指向0层符号表的首项，Scope(i) 指向i层符号表的首项。'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - "删除法"实现符号表的局部化的具体做法是：弹掉Scope栈的栈顶元素，同时释放当前层的符号表，即调整符号表区的指针。

    +   - 假设用ℓ表示层数计数器，用s表示符号表的最后一项的地址，则删除式的局部化实现算法可描述如下：

    +     ```

    +     s := Scope[ℓ]−1

    +     ℓ := ℓ−1 ;

    +     ```'
  merge: -1
  img_proc: true
