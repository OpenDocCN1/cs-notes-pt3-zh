  md: '# 1.4 过程活动记录


    +   - 每次函数被调用时都会给函数分配一片空间，用以存储如图信息，我们把这片存储空间称作过程活动记录(AR)

    +   - 偏移是针对过程活动记录的，通过起始位置+偏移量就可以找到对应的物理位置。

    +   - 过程活动记录中存储的顺序实际上是处理的先后顺序。


