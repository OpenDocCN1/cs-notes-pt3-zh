- pgno: 266
  md: '# 1.4 语义分析的主要任务


    根据声明部分建立符号表


    符号表（symbol table）：是一种供编译器用于保存有关源程序的各种信息的数据结构。符号表的每个条目中包含与一个标识符相关的信息，这些信息全面地反映该名字的属性及它们在编译过程中的特征。


    # 符号表的作用：


    +   - 存储标识符的属性；

    +   - 便于检查语义错误；

    +   - 代码生成阶段作为地址分配的依据。'
  merge: -1
  img_proc: true
