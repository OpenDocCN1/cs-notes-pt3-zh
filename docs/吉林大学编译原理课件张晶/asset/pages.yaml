- pgno: 110
  md: '# 1.2 自动机向正则表达式的转换


    +   构造方法：


    Step1: 在M的状态转换图中加入两个节点，一个是唯一的开始状态节点S, 另一个是唯一的终止状态节点Z . 从S出发用标有 ε 的有向弧连接到M 的所有初始状态节点上,
    从M 的所有终止状态节点用标有 ε 的有向弧连接到Z节点.


    Step2: 反复利用下述的替换规则进行替换, 直到状态转换图中只剩下节点S和Z, 在S指向Z的有向弧上所标记的正则表达式就是所求的结果.'
