  md: '# 2. 文法分类


    1956年，著名的语言学家乔姆斯基（Noam（Chomsky）将文法分为四类，四类文法对应四种类型的语言。


    +   0型文法（短语型文法）


    如果对文法G中的任一产生式α→β不加任何限制，即：α∈(V_T ∪ V_N)^+，并且至少含有一个非终极符，β∈(V_T ∪ V_N)^*，则称G为0型文法或短语型文法。'
