- pgno: 562
  md: '# 虚拟目标机的指令系统


    | 指令名称 | 指令形式 | 指令名称 | 指令形式 |

    | --- | --- | --- | --- |

    | 读 | IN R | 除 | DIV R, A |

    | 写 | OUT R | 条件真转移 | JMPT R, A |

    | 取值 | LD R, A | 条件假转移 | JMPF R, A |

    | 存值 | ST A, R | 无条件转移 | JMP A |

    | 加 | ADD R, A | 取址 | LEA R, A |

    | 减 | SUB R, A | 块传送 | MOVEB A1, A2, S |

    | 乘 | MULT R, A |  |  |'
