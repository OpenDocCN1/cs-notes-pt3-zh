- pgno: 404
  md: '# AddNext算法：


    +   > 下标计数器加1， k := k+1;

    +   > 从语义栈中取出下标表达式计算结果result;

    +   > 生成计算第k维下标需要累加的地址偏移的四元式组：

    +   >   （ SUBI, result, Lₖ, tₙ₊₁）

    +   >   （ MULTI, tₙ₊₁, Sₖ, tₙ₊₂）

    +   > 从语义栈中取出地址累加结果t?；

    +   > 生成地址累加四元式（ AADD, t?, tₙ₊₂, tₙ₊₃）

    +   >   ① pop（2）；

    +   >   ② 把累加后的地址结果tₙ₊₃压入语义栈；'
