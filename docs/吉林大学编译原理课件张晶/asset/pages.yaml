  md: '例：有 NFA A = ({s₀,s₁,s₂}, {a, b}, f, {s₀,s₁}, {s₂}) 其中 f 定义为：


    f(s₀,a)={s₀,s₁}      f(s₀,b)={s₀}


    f(s₁,ε)={s₂}


    f(s₂,a)={s₂}      f(s₂,b)={s₂}


    | | a | b | ε |

    |---|---|---|---|

    | s₀⁺ | {s₀, s₁} | {s₀} | |

    | s₁⁺ | | | {s₂} |

    | s₂* | {s₂} | {s₂} | |'
  merge: -1
