- pgno: 385
  md: "# • 简单表达式的带有动作符的LL(1)文法\n\n+   (1) E → T Eₛ  \n+   (2) Eₛ → ε  \n+   (3) Eₛ\
    \ → +T#GenCode(+)#Eₛ  \n+   (4) Eₛ → −T#GenCode(−)#Eₛ  \n+   (5) T → P Tₛ  \n\
    +   (6) Tₛ → ε  \n+   (7) Tₛ → *P#GenCode(*)#Tₛ  \n+   (8) Tₛ → /P#GenCode(/)#Tₛ\
    \  \n+   (9) P → C#Push(C)#  \n+   (10) P → id#Push(id)#  \n+   (11) P → (E)\n\
    \n+   ◆ 当遇到常量C和简单变量id时，把它们的语义信息压入语义栈；  \n+   ◆ 当处理完一个运算符（+、−、*、/）的右分量时，该运算符的左、右运算分量已经分别存放在语义栈\
    \ Sem 的次栈顶和栈顶的位置，因此可以生成相应的运算符的四元式，并把运算结果的语义信息压入语义栈。"
