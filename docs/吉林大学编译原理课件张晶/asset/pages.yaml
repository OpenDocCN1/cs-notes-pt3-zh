- pgno: 496
  md: '# 目标程序运行时内存空间


    ![](img/7af61167a39fb64ab49c400b070747c4_496_0.png)


    +   - **库代码区（libaray space）**：用于存放函数的目标代码，例如 Pascal 语言中用到的 sin、cos 等等，C 语言中通过
    `#include` 包含进来的库代码；


    +   - **目标代码区（code space）**：用以存放编译生成的目标程序。实际上一个目标程序变成可执行文件需要一个链接-装配的过程，链接装配之后存放在目标代码区。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 目标程序运行时大


    +   堆区空间

    +   栈区空间

    +   静态区空间

    +   目标代码空间

    +   库代码空间


    +   - 静态区(static space)：有些数据对象所占用的空间能在编译时确定，其地址可以编译进目标代码中，这些数据对象通常存放在静态区中，如静态变量和全局变量


    +   - 栈区（stack space）：存放过程活动记录，该存储区被称作一个栈，一个元素是一个过程活动记录，调用函数时压栈，函数结束时退栈'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# 目标程序运行时大


    +   - 堆区空间

    +   - 栈区空间

    +   - 静态区空间

    +   - 目标代码空间

    +   - 库代码空间


    +   - 堆区（heap space）：堆不是一个连续分配的模式，可以进行动态分配的空间管理，主要用于存放动态申请的数据对象（如C, pascal 等语言的malloc,
    free, new, delete）


    +   - 栈区和堆区之间没有事先划好的界线，当目标代码运行时，栈区指针和堆区指针不断地变化，并朝着对方方向不断增长。如果这两个区相交，则表示出现了内存溢出。'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# 语言影响空间分配策略


    +   （1）语言中是否允许函数、过程的递归调用？


    +   允许递归调用，则函数的形参、局部量可能对应是一系列存储单元，不能采用静态的存储分配方式；


    +   不允许有递归出现，则一个函数最多只能分配一个活动记录大小的空间。'
  merge: -1
