- pgno: 40
  md: '# 1. 确定有限自动机的定义


    确定有限自动机M为一个五元组：


    M = ( S , Σ , S₀ , f , Z )，其中：


    +   1. S是一个有穷状态集，它的每个元素称为一个状态；

    +   2. Σ是一个有穷字母表，它的每个元素称为一个输入字符；

    +   3. S₀∈S，是唯一的一个初始状态(开始状态)；

    +   4. f是状态转换函数：S×Σ→ S，且单值函数. f(Sᵢ, a)=Sₖ 表示：当前状态为Sᵢ，遇输入字符a时，自动机将唯一地转换到状态 Sₖ，称Sₖ为
    Sᵢ的一个后继状态；

    +   5. Z⊆S，是终止状态集（可接受状态集、结束状态集），其中的每个元素称为终止状态（可接受状态、结束状态），Z可空。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 1. 确定有限自动机的定义


    DFA的确定性：


    +   1. 初始状态唯一

    +   2. 状态转换函数f： S×Σ→S是一个单值函数，也就是说，对任何状态s∈S，和输入符号 a ∈ Σ， f(S, a)唯一地确定了下一个状态，即至多确定一个状态

    +   3. 转换边上不能标ε，即不接受没有任何输入就进行状态转换的情况'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 1. 确定有限自动机的定义


    +   ◆ 例子

    +   S {0, 1, 2},   Σ={a, b},

