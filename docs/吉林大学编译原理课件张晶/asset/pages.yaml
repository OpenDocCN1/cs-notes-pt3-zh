  md: '# 1.5 LR(0) 文法的限定条件


    定义：在LR(0) 可归前缀图（状态机）中，


    +   - 如果一个状态含有两个或两个以上的归约项目，则称有归约/归约冲突。


    +   - 如果同时含有移入项目和归约项目，称为移入/归约冲突，这类状态统称为二义性状态。


    没有以上二义性状态的文法称为LR（0）文法。'
