  md: '# 基于LL(1)方法


    +   （1）E→T

    +   （2）E→E+T

    +   （3）E→E−T

    +   （4）T→P

    +   （5）T→T*P

    +   （6）T→T/P

    +   （7）P→(E)

    +   （8）P→id

    +   （9）P→C


    +   （1）E→T Eₛ

    +   （2）Eₛ→ε

    +   （3）Eₛ→+T Eₛ

    +   （4）Eₛ→−T Eₛ

    +   （5）T→P Tₛ

    +   （6）Tₛ→ε

    +   （7）Tₛ→*P Tₛ

    +   （8）Tₛ→/P Tₛ

