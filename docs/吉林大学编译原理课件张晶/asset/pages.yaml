- pgno: 474
  md: '# 基于值编码的公共表达式节省


    +   - 编码原理：

    +   - 用到一张值编码表，表示分量当前值的编码

    +   - 若当前考察的代码为 dₖ：(ω, u₁, u₂, u₃)：

    +     - 若值编码表中已有 (uᵢ, mᵢ) 则令 dₖ:uᵢ 的值编码为 mᵢ， i=1, 2, 3

    +     - 否则为 dₖ:uᵢ 创建一个新编码 m 填入编码表

    +   - 若考察代码为 dₖ：(=, u₁, –, u₂)：

    +     - u₁ 的处理与之前相同

    +     - 令 dₖ:u₂ 的编码与 dₖ:u₁ 的编码相同'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# 基于值编码的公共表达式节省


    +   ◆ 值编码性质

    +   1. 不同分量上的相同常量一定具有相同值编码

    +   2. 不同分量上的相同变量未必具有相同编码

    +   3. 不同常量的编码值一定不同，对变量来说并非如此

    +   4. 每当一个变量x被赋值，x将得到一个新的编码，使得后面代码中的x分量取编码值n，直至x再被赋值'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# 基于值编码的公共表达式节省


    +   - 在分析的过程中对应每条四元式还要生成一个编码四元式。


    +   - μ（x）表示任意运算分量x的值编码；


    +   - 把（ω， μ（A）， μ（B）， μ（t））叫作（ω， A， B， t）的映射码；'
  merge: -1
