- pgno: 379
  md: '# 存放中间代码子程序GenCode


    该子程序功能是将一条四元式中间代码存放到中间代码区中，其格式如下：


    ```

    GenCode ( ω , left , right , result )

    ```


    +   该子程序主要用于表达式中间代码生成，其功能是产生一条四元式中间代码。


    +   当执行语义动作子程序GenCode时，四元式操作码的左、右运算分量的语义信息已经在语义栈Sem的次栈顶和栈顶，因此，该子程序的参数只给出操作码 ω
    即可。'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# GenCode(ω)的主要工作


    (1)若Sem[top-1].typ ≠ Sem[top].typ ，

    且Sem [top-1].typ = integer，则ω运算结果类型确定为real型，并且为左分量产生类型转换代码；

    (FLOAT, [top-1].FORM,-, tempArg)


    (2) 若Sem[top-1].typ ≠ Sem[top].typ ，

    且Sem[top].typ = integer，则ω结果运算类型确定为real型，并且为右分量产生类型转换代码；

    (FLOAT, [top].FORM,-, tempArg)


    (3) 若Sem[top-1].typ = Sem[top].typ ，则ω运算结果类型确定为Sem[top-1].typ ，不产生类型转换代码；'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# GenCode（ω）的主要工作（续）


    （4）产生（类型转换后）的中间代码：


