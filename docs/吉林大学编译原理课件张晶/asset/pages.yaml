- pgno: 579
  md: "# 过程函数声明部分的四元式处理：\n(ENDFUNC, -, -, -) / (return, -, -, t)\n\n+   1: 生成一组读取命令，即恢复寄存器的现场信息\n\
    +   \n+   2: 作废当前的活动记录，由两个指令完成，把当前的sp寄存给top，把动态链指针寄存给sp\n+   \n+   ST top , sp\
    \ ; LD sp , *0(top)\n+   \n+   3: 产生一条返回指令，根据返回地址生成一个跳转指令。jmp *1 (top)\n\n如果是返回语句(return,\
    \ -, -, t)，则要增加一个操作，将返回结果存储到活动记录2 (top)中。\n\nLD R , t;\n\nST *(top), R\n\n+  \
    \ 寄存器状态\n+   过程层数\n+   返回值\n+   返回地址\n+   动态链指针"
