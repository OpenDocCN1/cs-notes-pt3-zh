- pgno: 78
  md: '# 2.2 NFA到DFA的转换


    +   ◆ NFA A'' 到DFA A的转换过程(确定化)：

    +   1. 令 I₀= ε_CLOSURE(S₀) 作为DFA的初始状态，其中S₀ 为NFA初始状态集.

    +   2. 若DFA中的每个状态都经过本步骤处理过，则转步骤3；否则任选一个未经本步骤处理的DFA状态Sᵢ，对每一个 a∈Σ，进行下述处理：

    +      ① 计算 Sⱼ = Sᵢa

    +      ② 若 Sⱼ ≠ Φ，则令 f(Sᵢ, a) = Sⱼ，若 Sⱼ 不为当前DFA的状态，则将其作为DFA的一个状态. 转步骤2.

    +   3. 若 S'' = [S₁, ..., Sₙ] 是 A 的一个状态，且存在一个 Sᵢ 是 A'' 的终止状态，则令 S'' 为 A 的终止状态.'
  merge: -1
