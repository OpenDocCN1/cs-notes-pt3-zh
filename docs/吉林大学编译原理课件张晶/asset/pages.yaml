- pgno: 570
  md: '# 条件语句目标代码生成


    （ELSE，-，-，-），else起到定位和转移的作用，因此要产生跳转指令和地址的回填。


    ```

    【m-1】……

    地址回填，从L2栈中取出指令，将m+1作为地址加入该指令：[n+1] JMPF R m+1

    [m] JMP *

    将m压入L2栈

    [m+1]……

    ```


    （ENDIF，—，—，—），定位作用，不产生目标指令，只回填地址'
