- pgno: 347
  md: '# （2）带有分程序结构的C语言符号表


    ●当考虑C语言的分程序语句时，C程序符号表的构造将变得复杂一些。C语言的分程序语句(也称程序块)是由“{”和“}”括起来的程序段，其中可以包含标识符声明，还允许一个块嵌套在另一个块内。


