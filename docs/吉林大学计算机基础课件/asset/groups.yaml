  md: "\n## 存储器的容量\n\n- 存储器的容量是用字节(B)来计算和表示的，除B外，还用KB、MB、GB、TB作为存储容量的单位。它们关系为：\n-\
    \ 1B = 8bit  1KB = 2^10B = 1024B  1MB = 2^10KB = 1024KB\n- 1GB = 2^10MB = 1024MB\
    \  1TB = 2^10GB = 1024GB\n\n## Cache\n\n- Cache采用存取速度较快的SRAM技术，使数据存取的速度适应CPU的处理速度，当CPU处理数据时，先到Cache中去寻找，若所访问的数据已入Cache，则CPU就不需要再从主存中读取数据。\n\
    - Cache基于“程序执行与数据访问的局部性”原理，一定程序执行时间和空间内，被访问的指令集中于一部分。为了充分发挥高速缓存的作用，不仅依靠“暂存刚刚访问过的数据”，还要使用硬件实现的指令预测与数据预取技术，尽可能把将要使用的数据预先从内存中取到Cache中。\n\
    \n## Cache\n\n- Intel 486 CPU有8K的高速缓存， Intel Pentium 有16K的高速缓存。\n- Pentium II有32K\
    \ 一级缓存（L1 Cache）， AMD K6-2中有64K的一级Cache， AMD K6-3中有64K 的一级 Cache和256K 的二级Cache（L2\
    \ Cache）， Cyrix MII 中有64K的Cache。还有CPU配备已比L2高速缓存还要大的L3高速缓存。\n\n## 2.3.3 外存\n\n\
    - 外存储器不能与CPU直接交换信息，CPU需按输入／输出方式访问这部分存储空间。外存一般用来存放暂时不用但又需长期保留的程序或数据。存在外存的程序必须调入内存后才能运行。\n\
    - 外存一般是由磁性介质材料(如磁盘、磁带)或光盘制成，其上存放的信息不会因断电而丢失。与内存相比，外存的存储容量较大，价格也相对便宜，但存取速度较促。常用的外存有硬盘、光盘、闪存等。\n\
    \n## 快速测试\n\n- 1. DRAM与SRAM的区别是什么？\n- 2. ROM包括哪些类型？\n- 3. CD光盘的最大容量是多少？ DVD盘片单面的最大容量是多少？\n\
    - 4. 快闪存储器是什么？有什么特点？\n\n## 常用外部设备\n\n- 输入/输出系统简称I/O系统， I/O系统完成与外部系统的信息交换，进行信息的输入和信息的输出。\n\
    \n1、输入设备\n  - 键盘、鼠标、扫描仪、触摸屏\n2、输出设备\n  - 显示器。\n  - 打印机\n  - 绘图仪\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_65_0.png)\n\
