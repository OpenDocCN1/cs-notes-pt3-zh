    \n## 系统总线标准\n\n- ISA：工业标准体系(Industry Standard Architecture)，它是最早出现的微型计算机总线标准，应用在IBM的AT机上。直到现在，微型计算机主板或工作站主板上还保留有少量的ISA扩展槽。\n\
    - EISA：扩展工业标准体系(Extended Industry Standard Architecture)，主要用于286微机。EISA对ISA完全兼容。\n\
    - PCI：外围设备互联(Peripheral Component Interconnection)，PCI局部总线是高性能的32位或64位总线，它是专门为高集成度的外围部件，扩充插板和处理器/存储器系统而设计的互连机制。\n\
    - AGP：是一种新型的视频接口的技术标准，专用于连接主存和图形存储器。AGP总线宽32位，时钟频率66MHz，能以133MHz工作，最高的传输速率可达533Mbps。\n\
    \n## 快速测试\n\n- 1. 总线一般包括哪几种类型？\n- 2. 控制总线是用来做什么的？\n- 3. 总线标准PCI、USB是指什么？\n\n##\
    \ 作业\n\n- 习题2\n  - 一、 术语解释\n  - 多核处理器 RAM ROM Cache 主板 总线 主频 USB PCI\n  - 二、 选择题\n\
    \  - 三、 判断题\n  - 四、 填充题\n  - 五、 简答题\n\n## 大学计算机基础\n\n## 第二章 Windows 7操作系统\n\n\
