  md: "\n## 4. 时间轴\n\n时间轴窗口可以分为左右两个区域。图层控制区域主要用来进行各图层的操作，帧控制区域主要用来进行各帧的操作。所谓图层就相当于舞台中演员所处的前后位置。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_407_0.png)\n\n## 5. 面板\n\n- Flash中的浮动面板多种多样，其中最常用的有“属性面板”、“颜色面板”、“信息”/“变形”/“对齐面板”、“库面板”，如果设计交互式动画或应用程序，还必须使用“动作面板”。\n\
    \n## 1.3.3 Flash图形绘制\n\n- 基本形状的绘制\n- 元件的绘制\n\n## 7.3.4 Flash动画制作\n\n- **逐帧动画制作**：借助Flash的绘制功能，在每一帧上绘制相应的对象，然后使用Flash的自动播放功能。\n\
