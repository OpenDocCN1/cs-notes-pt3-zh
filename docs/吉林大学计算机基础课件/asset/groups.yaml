  - '[PAGE 41]


    # 2.1 计算机硬件系统组成


    +   - 计算机硬件（Computer Hardware）是指计算机系统中由电子，机械和光电元件等组成的各种物理装置的总称。这些物理装置按系统结构的要求构成一个有机整体为计算机软件运行提供物质基础。

    +   - 计算机硬件的功能是输入并存储程序和数据，以及执行程序把数据加工成可以利用的形式。'
  - '[PAGE 42]


    # 微机的硬件组成


    显示器是计算机的主要输出设备，它将来自计算机显卡的电信号转换为屏幕上的彩色亮点，从而形成图像。


    主机是包含电源、存储设备和电路板的机箱，其中电路板上有计算机的主处理器和内存。


    CD-ROM和DVD驱动器采用激光技术从光盘上读取数据。


    声卡位于系统单元内，提供到扬声器、麦克风和耳机的连接。


    硬盘驱动器一般安装在系统单元内，当其工作时，机箱上的指示灯会亮。


    键盘作为多数计算机的主要输入设备。


    鼠标是一种输入指示设备，帮助用户操作对象并选择菜单项。


    软盘驱动器将数据写到软盘上，当其工作时，其指示灯就亮，警告用户此时不要取出软盘。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_42_0.png)'
  - '[PAGE 43]


    # 机箱内部视图


    ![](img/60882d3e569e0db30f34a44fdc73ab49_43_0.png)'
  - '[PAGE 44]


    # 主板(Main Board)


    +   - 主板，又叫主机板(Main Board)、系统板(System Board)和 motherboard(Mother Board)；它安装在机箱内，是微机最基本也是最主板重要的部件之一。

    +   - 主要组件有：CMOS、基本输入输出系统(Basic Input and Output System，简称BIOS)、高速缓冲存储器(Cache)、内存插槽、CPU插槽、键盘接口、软盘驱动器接口、硬盘驱动器接口、总线扩展插槽(提供ISA、PCI等扩展槽)、串行接口(COM1、(COM2)、并行接口(打印机接口LPT1。

    +   - 主板在整个微机系统中扮演着举足轻重的角色,是计算机各种部件相互连接的纽带和桥梁。'
  - '[PAGE 45]


    # 主板 (Main Board)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_45_0.png)'
  - '[PAGE 46]


    # 计算机的内部逻辑结构


    +   - 计算机本身的内部结构包括有4种主要的结构组件：

    +   - 中央处理器（Central Processing Unit，简称为CPU）：它控制计算机的操作并且执行数据处理功能。

    +   - 主存储器：用来存储程序和数据。

    +   - I/O（Input/Output）设备：用来在计算机及其外部环境之间传输数据。

    +   - 系统互连：为CPU、主存储器和I/O之间提供一些通信机制。系统互连常见的例子是利用系统总线，它由一系列导线组成，所有其他组件连接在导线上。'
  - '[PAGE 47]


    # 计算机的内部逻辑结构


