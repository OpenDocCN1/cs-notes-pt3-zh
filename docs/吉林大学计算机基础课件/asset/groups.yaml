    - ⑦ COUNTIF 函数对区域中满足单个指定条件的单元格进行计数。\n\n## 5.3.6 数据管理与分析\n\n### 一、数据排序\n- 1、 对文本、数字、日期进行排序\n\
    \n选择需要排序的数据→“数据”选项卡→“排序和筛选”组→选择需要进行排序的方式。若要按字母数字的升序排序，单击“升序”按钮。按字母数字的降序排序，单击“降序”。\n\
    \n- 2、对文本区分大小写的排序：\n\n选择需要排序的数据→“数据”选项卡→“排序和筛选”组中→单击“排序”按钮→“排序”对话框中→单击“选项”按钮→“排序选项”对话框→选择“区分大小写”→单击“确定”。\n\
    \n- 3、按单元格颜色、字体颜色或图标进行排序\n\n选择单元格列区域→“数据”选项卡→“排序和筛选”组→单击“排序”按钮→“排序”对话框→中在“列”下选择要排序的列数据→在“排序依据”下选择排序类型（“单元格颜色”、“字体颜色”、“单元格图标”）→在“次序”下选择排列方式（“在顶部”、“在左侧”、“在底端”、“在右侧”）。\n\
    \n### 二、数据筛选\n- 1、自动筛选\n  - 1）选择要筛选的数据→“数据”选项卡→“排序和筛选”组→单击“筛选”按钮。\n  - 2）单击数据列标题中的箭头→筛选器选择列表对话框→设置筛选参数。\n\
    - 2、高级筛选\n  - 1）多列数据中筛选多个条件，条件间为“和”关系的情况。\n    - ① 例如筛选条件布尔逻辑为：（部门 = “销售四部” AND\
    \ 数量 > 800 AND 单价 < 20）\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_260_0.png)\n\
    \n    - ② 单击要筛选数据区域中的任一单元格→“数据”选项卡→“排序和筛选”组→单击“高级”按钮→弹出“高级筛选”对话框→选择筛选方式（“在原有区域显示筛选结果”、“将筛选结果复制到其他位置”）→在“条件区域”框中，输入条件区域的引用→确定。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_260_1.png)\n"
  mdcn: "\n## Excel中涉及的相关概念\n\n1）、**工作簿**：工作簿是指Excel环境中用来储存并处理工作数据的文件，Excel文档就是工作簿。工作簿最多可建立255个工作表。工作簿就像一本书或者一本账册，工作表就像其中的一张或一页。\n\
    \n2）、**工作表**：工作簿中的每一张表格称为工作表。Excel 2010的每张工作表由16384列和1048576行组成。Excel默认一个工作簿有三个工作表（默认名称为Sheet1、Sheet2和Sheet3）\n\
    \n3）、**单元格**：单元格是Excel工作表中行与列的交叉部分地址“B5”指的是“B”列与第5行交叉位置上的单元格。\n\n4）、**区域**：工作表上的两个或多个单元格（可以相邻或不相邻）。\n\
    \n5）、**行与列**：行号相同的所有单元格称为1行。列号相同的所有单元格称为1列。行号使用1, 2, 3, ……表示，列号使用A, B, C, ……表示\n\
    \n## 5.32 工作簿的创建、保存与打开\n\n### 一、工作簿的创建\n- 1、创建新的空白工作簿\n- 2、基于现有工作簿创建新工作簿\n- 3、使用快速访问工具栏\n\
    \n### 二、工作簿的保存\n- 1、鼠标左键单击快速访问工具栏中的“保存”图标按钮。\n- 2、单击“文件”选项卡→“保存”图标按钮。\n- 3、单击“文件”选项卡→“另存为”图标按钮。\n\
    - 4、选中需要保存的工作簿按快捷键“ctrl”+“s”。\n\n### 三、工作簿的打开\n- 1、打开最近使用过的某工作簿步骤：选择Windows的“开始”菜单→“文档”菜单→选择需要打开的工作簿的名称。\n\
    - 2、运行Excel2010软件→选择“文件”选项卡→“打开”或“快速访问工具栏”上的“打开”按钮→“打开”对话框。\n- 3、在磁盘上找到需要打开的工作簿文件，鼠标双击该文件图标\n\
    \n### 四、工作簿的关闭\n- 1、用鼠标单击工作簿窗口中“编辑栏”右下角的“×”按钮。\n- 2、选中所要关闭的工作簿→“文件”选项卡→“关闭”命令。\n\
    - 3、选中所要关闭的工作簿→按快捷键Alt+F4。\n- 4、退出Excel时关闭所有打开的工作簿。\n\n## 5.3.3 数据输入\n- 一、数据输入技巧\n\
    - 1、选择活动单元格和换行\n- 2、将数字作为文本输入\n- 3、输入分数\n- 4、输入当前日期和时间\n- 5、使用填充柄输入数据\n\n## 5.3.4\
    \ 单元格格式化\n- 1、选定单元格\n- 2、单元格、行、列的插入与删除\n- 3、数据格式设置\n  - ① 数字格式设置\n  - ② 单元格中数据自动换行\n\
    \  - ③ 调整单元格的行高与列宽\n  - ④ 表格框线设置\n\n## 3.5 公式与函数\n\n### 一、计算运算符：算术、比较、文本连接、引用\n\
    \n| 类型 | 符号 | 含义 | 示例 |\n|---|---|---|---|\n| 算术运算符 | +（加号） | 加法 | 3+3 |\n|  |\
    \ -（减号） | 减法/负数 | 3-1/-1 |\n|  | *（星号） | 乘法 | 3*3 |\n|  | /（正斜杠） | 除法 | 3/3 |\n\
    |  | %（百分号） | 百分比 | 20% |\n|  | ^（脱字符） | 乘幂 | 3^2 |\n| 比较运算符（结果为 TRUE 或 FALSE。）\
    \ | =（等号） | 等于 | A1=B1 |\n|  | >（大于号） | 大于 | A1>B1 |\n|  | <（小于号） | 小于 | A1<B1\
    \ |\n|  | >=（大于等于号） | 大于或等于 | A1>=B1 |\n|  | <=（小于等于号） | 小于或等于 | A1<=B1 |\n| \
    \ | <>（不等于） | 不等于 | A1<>B1 |\n| 文本运算符 | &（与号） | 将两个值连接或串起来产生一个连续的文本值 | \"North\"\
    &\"wind\" |\n| 引用运算符 | :（冒号） | 区域运算符，生成对两个引用之间所有单元格的引用 | B5:B15 |\n|  | ,（逗号）\
    \ | 联合运算符，将多个引用合并为一个引用 | SUM(B5:B15, D5:D15) |\n|  | （空格） | 交集运算符，生成对两个引用中共同的单元格的引用\
    \ | B7:D7 C6:C8 |\n\n### 运算符优先级\n\n| 优先顺序 | 运算符 | 说明 |\n|---|---|---|\n| 1 | :（冒号）\
    \ （单个空格） ，（逗号） | 引用运算符 |\n| 2 | - | 负数（如 -1） |\n| 3 | % | 百分比 |\n| 4 | ^ | 乘方\
    \ |\n| 5 | * 和 / | 乘和除 |\n| 6 | + 和 - | 加和减 |\n| 7 | & | 连接两个文本字符串 |\n| 8 | =\
    \ < > <= >= <> | 比较运算符 |\n\n### 三、单元格在公式中使用与引用\n- ① 相对地址引用：\n公式中的相对单元格引用（如 A1）是基于包含公式和单元格引用的单元格的相对位置。如果公式所在单元格的位置改变，引用也随之改变。\n\
    - ② 绝对地址引用：\n公式中的绝对单元格引用（如 $A$1）总是是在特定位置引用单元格。如果公式所在单元格的位置改变，绝对引用将保持不变。\n- ③ 混合地址引用：\n\
    混合引用具有绝对列和相对行或绝对行和相对列。绝对引用列采用 $A1、$B1 等形式。绝对引用行采用 A$1、B$1 等形式。\n- ④ 三维引用样式：\n\
    三维引用可以分析同一工作簿中多个工作表上相同单元格或单元格区域中的数据。\n\n=SUM(Sheet2:Sheet13!B5) 将计算 B5 单元格内包含的所有值的和，单元格取值范围是从工作表\
    \ 2 到工作表 13。\n\n### 四、函数的结构\n\nExcel中函数的结构以等号“=”开始，后面紧跟函数名称和在括号，然后以逗号分隔输入该函数的参数列表，最后是右括号。例如：“=SUM（3，6，A2：B4）”。\n\
    \n### 五、输入函数\n- ① 鼠标左键双击要使用函数的单元格，在单元格中按照函数的结构输入函数。\n- ② 选择要使用函数的单元格→单击“编辑栏”上的“插入函数”按钮→“插入函数”对话框→选择函数的名称→设置函数的参数。\n\
    - 图插入函数对话框\n- ③ 左键单击“编辑组”→“求和按钮”右边小箭头→选择“其他函数”→“插入函数”对话框进行选择。\n\n### 六、嵌套函数\n\n\
    Excel公式中可包含多达七级的嵌套函数。如公式MAX（AVERAGE（A1：A10），50），使用了嵌套的AVERAGE函数并将结果与值50进行了比较。\n\
    \n### 七、常用函数应用\n- ① SUM函数，用来求一些单元格中数据元素的和。\n- ② AVERAGE函数，计算一些单元格中数据元素的平均值。\n\
    - ③ COUNT 函数计算包含数字的单元格以及参数列表中数字的个数。使用函数 COUNT 可以获取区域或数字数组中数字字段的输入项的个数。\n- ④ MIN函数返回一组值中的最小值。\n\
    - ⑤ MAX函数返回一组值中的最大值。\n- ⑥ IF函数：如果指定条件的计算结果为 TRUE，IF 函数将返回某个值；如果该条件的计算结果为 FALSE，则返回另一个值。\n\
    - ⑦ COUNTIF 函数对区域中满足单个指定条件的单元格进行计数。\n\n## 5.3.6 数据管理与分析\n\n### 一、数据排序\n- 1、 对文本、数字、日期进行排序\n\
    \n选择需要排序的数据→“数据”选项卡→“排序和筛选”组→选择需要进行排序的方式。若要按字母数字的升序排序，单击“升序”按钮。按字母数字的降序排序，单击“降序”。\n\
    \n- 2、对文本区分大小写的排序：\n\n选择需要排序的数据→“数据”选项卡→“排序和筛选”组中→单击“排序”按钮→“排序”对话框中→单击“选项”按钮→“排序选项”对话框→选择“区分大小写”→单击“确定”。\n\
    \n- 3、按单元格颜色、字体颜色或图标进行排序\n\n选择单元格列区域→“数据”选项卡→“排序和筛选”组→单击“排序”按钮→“排序”对话框→中在“列”下选择要排序的列数据→在“排序依据”下选择排序类型（“单元格颜色”、“字体颜色”、“单元格图标”）→在“次序”下选择排列方式（“在顶部”、“在左侧”、“在底端”、“在右侧”）。\n\
    \n### 二、数据筛选\n- 1、自动筛选\n  - 1）选择要筛选的数据→“数据”选项卡→“排序和筛选”组→单击“筛选”按钮。\n  - 2）单击数据列标题中的箭头→筛选器选择列表对话框→设置筛选参数。\n\
    - 2、高级筛选\n  - 1）多列数据中筛选多个条件，条件间为“和”关系的情况。\n    - ① 例如筛选条件布尔逻辑为：（部门 = “销售四部” AND\
    \ 数量 > 800 AND 单价 < 20）\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_260_0.png)\n\
    \n    - ② 单击要筛选数据区域中的任一单元格→“数据”选项卡→“排序和筛选”组→单击“高级”按钮→弹出“高级筛选”对话框→选择筛选方式（“在原有区域显示筛选结果”、“将筛选结果复制到其他位置”）→在“条件区域”框中，输入条件区域的引用→确定。\n\
