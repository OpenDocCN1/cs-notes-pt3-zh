    +   - 4. 快闪存储器是什么？有什么特点？'
  - '[PAGE 65]


    # 常用外部设备


    +   - 输入/输出系统简称I/O系统， I/O系统完成与外部系统的信息交换，进行信息的输入和信息的输出。


    +   1、输入设备

    +     - 键盘、鼠标、扫描仪、触摸屏

    +   2、输出设备

    +     - 显示器。

    +     - 打印机

