    \n- (2) 批处理操作系统\n\n  批处理操作系统的工作方式是：用户将作业交给系统操作员，系统操作员将许多用户的作业组成一批作业，之后输入到计算机中，在系统中形成一个自动转换的连续的作业流，然后启动操作系统，系统自动、依次执行每个作业。最后由操作员将作业结果交给用户。\n\
    \n- (3) 分时操作系统\n\n  分时操作系统将CPU的时间划分成若干个片段，称为时间片。操作系统以时间片为单位，轮流为每个终端用户服务。每个用户轮流使用一个时间片而使每个用户并不感到有别的用户存在。分时系统具有多路性、交互性、独占性和及时性的特征。\n\
    \n- (4) 实时系统\n\n  实时系统主要分为两类：实时控制系统和实时处理系统。实时操作系统的主要特点在于有严格的时间限制，每个信息的接收、分析处理和发送过程必须在规定的时间范围内做出响应。在这种要求下操作系统的一些活动都必须在一个严格的时间控制程序下运行。实时系统应考虑的问题有实时时钟管理、连续人机对话、过载的防护、处理机调度策略、高可靠性等。\n\
    \n- (5) 网络操作系统\n\n  网络操作系统基于计算机网络的，是在各种计算机操作系统上按网络体系结构协议标准开发的软件，包括网络管理、通信、安全、资源共享和各种网络应用。\n\
    \n- (6) 分布式操作系统\n\n  分布式操作系统的资源分布于系统的不同计算机上，操作系统对用户的资源需求不能像一般的操作系统那样等待有资源时直接分配的简单做法，而是要在系统的各台计算机上搜索，找到所需资源后才可进行分配。对于有些资源，如具有多个副本的文件，还必须考虑一致性。分布式操作系统的特点有系统状态的不精确性、控制机构的复杂性，以及通信开销引起的性能下降等。\n\
    \n## 第二章 Windows 7 操作系统\n\n### 第二节 Windows 7 的基本操作\n\n- 一、Windows 7概述\n- 二、Windows\
    \ 7桌面\n- 三、Windows 7窗口\n- 四、Windows 7菜单\n\n**一、Windows 7 概述**\n\nMicrosoft开发的Windows\
    \ 7是目前世界上用户最多、并且兼容性最强的操作系统。\n\nMicrosoft Windows 7是彩色界面的操作系统，支持键盘和鼠标功能。默认的平台是由任务栏和桌面图标组成的。\n\
    \n任务栏是由显示正在运行的程序、“开始”菜单、时间、快速启动栏、输入法以及右下角的托盘图标组成的。\n\n桌面图标是进入程序的途径。默认的系统图标有“我的电脑”、“我的文档”、“回收站”，另外，还会显示出系统的自带的“IE浏览器”图标。运行\
    \ Windows 7 的程序主要操作都是由鼠标和键盘控制的。\n\n**二、Windows 7 桌面**\n\n桌面就是用户启动计算机登录到系统后看到的整个屏幕区域，它看起来就像一张办公桌面一样，用于显示窗口、图标和对话框等。\n\
    \n桌面由图标和任务栏两部分组成。图标是系统资源的符号表示，包含了对象的相关信息，它由小图像和文字说明两部分构成。\n\n- **1、桌面图标说明**\n\
    \  - ※ “我的电脑”图标：包含了代表当前计算机系统资源的图标。\n  - ※ “网上邻居”图标：用来定位计算机连接到的整个网络上的共享资源。\n  -\
    \ ※ “我的文档”图标：这是由Windows 7提供的、专门存放用户个人文档的默认文件夹，便于用户存放文档、图片、资料等，同时能够快速访问。\n\n  ![](img/60882d3e569e0db30f34a44fdc73ab49_86_0.png)\n\
    \n  - ※ “回收站”图标：是硬盘上的一块区域，用于暂时存放被用户删除的文件或文件夹。直到被清空为止，还可以利用“回收站”还原被用户误删的文件或文件夹。\n\
    \  - ※ “Internet Explorer”：简称IE，用于浏览互联网上的信息，通过双击该图标可以访问网络资源。\n\n- **2、桌面图标的排列**\n\
    \  - ※ 名称：按图标名称开头的字母或拼音顺序排列。\n  - ※ 大小：按图标所代表文件的大小的顺序来排列。\n  - ※ 类型：按图标所代表的文件的类型来排列。\n\
    \  - ※ 修改时间：按图标所代表文件的最后一次修改时间来排列。\n  - ※ 当选择“自动排列”子菜单中的某一项后，在其旁边会出现“√”标志，说明该选项被选中。如果用户选择“自动排列”命令，这时只能在固定的位置将各图标进行位置的互换，而不能拖动图标到桌面上任意位置。当选择了“对齐到网格”命令后，如果调整图标的位置时，它们总是成行成列地排列，也不能移动到桌面上任意位置。\n\
    \n- **3、任务栏**\n\n  任务栏是位于桌面最下方的一个小长条，它显示了系统正在运行的程序和打开的窗口、当前时间等内容。主要分为以下几个区域：\n\
    \n  - “开始”菜单按钮：单击此按钮，可以打开“开始”菜单，在用户操作过程中，要用它打开大多数的应用程序。\n  - 快速启动工具栏：它由一些小型的按钮组成，单击可以快速启动程序。\n\
    \  - 窗口按钮栏：当用户启动某项应用程序而打开一个窗口后，在任务栏上会出现相应的有立体感的按钮。如果有多个窗口，则可以单击各个按钮，来转换到各个窗口。\n\
    \  - 语言栏：在这里可以选择各个输入方法。语言栏可以最小化以按钮的形式在任务栏显示，单击右上角的还原小按钮，它也可以独立于任务栏之外。\n  - 音量控制器：单击它后会出现一个音量控制对话框，用户可以通过拖动上面的小滑块来调整扬声器的音量，当选择“静音”复选框后，扬声器的声音消失。\n\
    \  - 日期和时间指示器：在任务栏的最右侧，显示了当前的时间，把鼠标在上面停留片刻，会出现当前日期。\n\n**三、Windows 7 窗口**\n\n\
    - **1. 窗口的组成**\n  - (1) 标题栏：在窗口顶部有包含窗口名称的标题栏。\n  - (2) 菜单栏：菜单栏位于标题栏的下方，列出了该窗口可以使用的菜单，每个菜单包含一系列的命令，通过这些命令可以完成各种功能。\n\
    \  - (3) “最小化”、“最大化”和“关闭”按钮：这几个按钮在窗口的右上方，用鼠标单击该按钮可以实现窗口的最小化、最大化和关闭窗口的功能。\n  -\
    \ (4) 工具栏：工具栏既可以显示在窗口中，也可以让其隐藏。在工具栏上有许多小图标，单击该小图标可以完成一项指定的功能。\n  - (5) 滚动条：当显示的内容无法在窗口中完全显示时，就可以使用滚动条来查看其他的内容。滚动条分水平滚动条和垂直滚动条两种，水平滚动条使窗口的内容左右滚动，而垂直滚动条使窗口的内容上下滚动。\n\
    \  - (6) 状态栏：它在窗口的最下方，标明了当前有关操作对象的一些基本情况。\n  - (7) 工作区域：它在窗口中所占的比例最大，显示了应用程序界面或文件中的全部内容。\n\
    \n- **2. 窗口的操作**\n  - (1) 打开窗口：当需要打开一个窗口时，可以通过下面两种方式来实现：\n    - 选中要打开的窗口图标，然后双击鼠标左键打开。\n\
    \    - 在选中的图标上单击鼠标右键，在其弹出的快捷菜单中选择“打开”命令。\n  - (2) 移动窗口：移动窗口时用户只需要在标题栏上按下鼠标左键拖动或者在标题栏上右击，在打开的快捷菜单中选择“移动”命令，移动到合适的位置后再松开，即可完成移动的操作。\n\
    \n  ※思考：窗口在什么状态下可以移动，什么状态下不可以移动？\n\n  窗口在不是最大化的状态下可以移动；窗口在最大化的状态下不可以移动。\n\n  -\
    \ (3) 缩放窗口：通常采用把鼠标移到窗口的垂直边框上来改变窗口的大小。\n    - ✓ 改变窗口宽度：当移到窗口的垂直边框上变成双向箭头时，按下鼠标左键并拖动，可以改变窗口的宽度。\n\
    \    - ✓ 改变窗口高度：当移到水平边框上变成双向箭头时，按下鼠标左键并拖动，可以改变窗口的高度。当把鼠标移到边框的任意角上变成双向箭头时，按下鼠标左键并拖动，可以对窗口进行等比缩放。\n\
    \n  ※思考：窗口在什么状态下可以缩放，什么状态下不可以缩放？\n\n  窗口在不是最大化的状态下可以缩放；窗口在最大化的状态下不可以缩放。\n\n  -\
    \ (4) 最大化/还原、最小化和关闭窗口按钮：位置在窗口的右上角，标题栏的最右端。\n    - 最小化按钮：在暂时不需要对窗口操作时，可把它最小化以节省桌面空间，用户直接在标题栏上单击此按钮，窗口会以按钮的形式缩小到任务栏。\n\
    \    - 最大化按钮：窗口最大化时铺满整个桌面，这时不能再移动或者是缩放窗口。用户在标题栏上单击此按钮即可使窗口最大化。\n    - 还原按钮：当把窗口最大化后想恢复原来打开时的初始状态，单击此按钮即可实现对窗口的还原。用户使用鼠标双击标题栏可以在最大化和还原两种状态间切换。\n\
    \    - 关闭按钮：直接单击标题栏上的“关闭”按钮，可以关闭窗口。\n"
