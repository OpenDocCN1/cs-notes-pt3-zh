    - GB 2312 或 GB 2312-80 是《信息交换用汉字编码字符集·基本集》。\n\n## 汉字在计算机中的表示\n\n## 国家标准汉字交换码\n\
    \n“中华人民共和国国家标准信息交换汉字编码” GB2312—80，这种编码又称为国码。在国码的字符集中共收录了一级汉字3 755个，二级汉字3 008个，图形符号682个，三项字符总计7445个。\n\
    \n## 汉字的输入码\n\n汉字的编码类型主要有：数字编码、拼音码、音形结合码和字形码等类型。目前使用得比较多的有区位码、五笔字型码、拼音码、自然码和智能ABC码。\n\
    \n## 汉字的点阵码\n\n汉字的点阵码，就是汉字点阵字形的代码。存储在介质中的全部汉字的点阵码又称为字库。\n\n## 快速测试\n\n- 1. 二进制有几个数码？十六进制有哪几个数码？\n\
    - 2. （100）2、（100）8、（100）16对应的十进制数分别是多少？\n- 3. 常见的字符编码有哪些？\n\n## 计算机发展——巨型化\n\n\
    运算速度可达每秒几百亿次运算的超级计算机\n1975年世界上第一台超级计算机\n“Cray-I”超级计算机应用：天气预报、地震机理研究、石油和地质勘探，卫星图像处理等大量科学计算的高科技领域。\n\
    \n中国超级计算机：\n国防科技大学研制的“银河1号”、“银河2号”和“银河3号”\n国家职能计算机中心推出的“曙光1000”、“曙光200I”和“曙光3000”\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_35_0.png)\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_35_1.png)\n\
    \n## 计算机发展——微型化\n\n计算机不再是单一的计算机器，而是一种信息机器，一种个人的信息机器。\n\nAltair 8800\n\n## 计算机发展——网络化\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_37_0.png)\n\n**计算机网络：**  \n计算机技术与通信技术结合的产物。\n\
    \n**计算机网络的发展动力：**  \n使用远程资源，共享程序、数据和信息资源，网络用户的通讯和合作。\n\n## 计算机发展——智能化\n\n> “总有一天，人类会造出一些举止跟人一样的‘没有灵魂的机械’来”。\n\
    > ——笛卡尔（1637）\n\n- 人类第一个“工业机器人”：\n  一头在纺织机上挑纱的“驴”（1742年）\n- 第一代机器人\n  机械手（1962年出现）\n\
    - 第二代机器人\n  具有“感觉”的机器人\n- 第三代机器人\n  装有启发式计算机的“智能机器人”\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_38_0.png)\n\
