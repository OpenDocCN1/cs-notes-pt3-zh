  md: "\n## 第7章　数据库\n\n- 本章首先简述数据库的基本概念、数据模型、数据库管理系统（DBMS）等数据库的基础知识，着重分析了关系数据库的概念、SQL的查询命令使用等内容，最后介绍了Microsoft\
    \ Access的使用方法，用图示说明了利用Access创建表的方法。\n\n## 7.1 数据库基础知识\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_322_0.png)\n\
    \n- 数据是描述事物所使用的符号，它是计算机加工的“原料”，如图形、声音、文字、数、字符和符号等。\n- 数据库（Data Base，简称DB）是指以一定组织方式储存在一起的，能为多个用户共享的，具有尽可能小的冗余度的、与应用彼此独立的相互关联的数据集合。\n\
    - 数据库管理系统（DataBase Management System，简称DBMS）由一个互相关联的数据的集合和一组用以访问数据库的程序组成。\n\n\
    ## 数据库管理系统\n\n- （1）数据定义语言（DDL）： Data Definition Language DDL，该语言负责数据的模式定义与数据的物理存取构建。\n\
    - （2）数据操纵语言（DML）： Data Manipulation Language DML，该语言负责数据的操纵，包括查询及增加、删除、修改等操作。\n\
    - （3）数据控制语言（DCL）： Data Control Language DCL，该语言负责数据完整性、安全性的定义与检查以及并发控制、故障恢复等功能。\n\
    \n## 目前比较通行的DBMS\n\n- 1. Microsoft Access\n  Access是Microsoft强大的桌面数据库平台。它只具备数据库管理系统的一些简单功能，本章将在下一节介绍Microsoft\
    \ Access 2010的使用方法。\n- 2. Microsoft SQL Server\n  Microsoft SQL Server是一个多关系数据管理系统。\n\
    \n## 数据库系统\n\n- 数据库系统（Database System，简称DBS）是以数据库为核心的完整的运行实体。它包括：数据库（DB）；数据库管理系统（DBMS）；数据库管理员（Database\
    \ Administrator，简称DBA）。\n- 数据库管理员对数据库进行规划、设计、维护和监视等工作的人员。\n- 数据库、数据库管理系统和数据库系统是三个不同的概念，数据库强调的是数据，数据库管理系统是系统软件，而数据库系统强调的是系统。\n\
    \n## 7.1.2 数据库管理技术的发展\n\n- 计算机数据的管理是随着计算机硬件（主要是外存储器）、软件技术和计算机应用范围的发展而不断发展，数据库的发展大致经历了如下四个阶段：\n\
    \  - 人工管理阶段\n  - 文件系统阶段\n  - 数据库系统阶段\n  - 高级数据库阶段\n\n## 7.1.3 数据模型\n\n- 数据库中不仅要存放数据本身，还要存放数据与数据之间联系，可以用不同的方法表示数据与数据之间的联系，把表示数据与数据之间的联系的方法称之数据模型。\n\
    - 传统的数据模型有层次数据模型、网状数据模型和关系数据模型。\n\n## 1. 层次数据模型\n\n- 用树型结构来表示实体之间联系的模型称为层次数据模型。\n\
    - 构成层次模型的树是由结点和连线组成，结点表示实体集，连线表示相连两个实体之间的联系，这种联系只能是一对多的。\n- 通常把表示“一”的实体放在上方，称为父结点；而把表示“多”的实体放在下方，称为子结点。\n\
    \n## 2. 网络数据模型\n\n- 如果取消层次模型中的两点限制，即允许每一个结点可以有多个父结点，便形成了网络。用网络结构表示实体之间联系的数据模型称为网络数据模型，也称为网状数据模型。\n\
    - 由于网络模型没有层次模型的两点限制，所以可以直接表示多对多的联系。但是，多对多联系实现起来太复杂。\n\n## 3. 关系数据模型\n\n- 关系数据模型源于数学，它把数据看成是二维表中的元素，而这个二维表就是关系。用关系（表格数据）表示实体和实体之间联系的模型称为关系数据模型。\n\
    - 关系就是二维表格，表格中的每一行称作是一个元组，它相当于一个记录值，每一列是一个属性值集，列可以命名，称为属性名。\n\n## 快速测试\n\n- 1.\
    \ 什么是数据库管理系统?什么是数据库系统?\n- 2. 传统的数据模型包括哪些?\n\n## 7.2 关系数据库基础\n\n- 关系数据库是建立在关系模型基础上的数据库，借助于集合代数等数学概念和方法来处理数据库中的数据。\n\
    - 现实世界中的各种实体以及实体之间的各种联系用关系模型来表示。\n\n## 7.2.1 基本概念\n\n- 1. 表由行、列组成，表中的一行数据称为记录，一列数据称为字段。\n\
    - 2. 每一列都有一个字段名。\n- 3. 每个字段只能取一个值，不得放入两个或两个以上的数据。\n- 4. 表中行的上下顺序、列的左右顺序是任意的。\n\
    - 5. 表中任意两行记录的内容不应相同。\n- 6. 表中字段的取值范围称为域。\n\n## 主键（primary key）\n\n- 关系型数据库一般不允许在一个表中出现两个完全相同的记录。为了避免上述情况的发生，需要添加一个标识记录的字段，以保证表中每个记录都是互不相同的，该字段被称为主键（primary\
    \ key），也称关键字、主码。\n- 一个关系表只能有一个主键。主键可以是一个字段，也可以由若干个字段组合而成。\n\n## 外键（foreign key）\n\
    \n- 如果两个关系表之间呈“一对多”关系，\n则“一”表的主键字段必然会出现在“多”表中，成为联系两个表的纽带；“多”表中出现的这个字段被称为外键（foreign\
    \ key），也称外码；“一”表称为该外键的参照表。\n\n## 7.2.2 SQL简介\n\n- SQL (Structured Query Language，简称SQL)\
    \ 是一种基于关系数据库的语言，这种语言执行对关系数据库中数据的检索和操作。它是一个通用的、功能极强的关系性数据库语言。\n- 目前，绝大多数流行的关系型数据库管理系统，如Oracle,\
    \ Sybase, Microsoft SQL Server, Access等都采用了SQL语言标准。\n\n## 1. SQL的组成\n\n- 可以把SQL分为两个部分：数据操作语言（DML）和数据定义语言（DDL）。\n\
    - SQL是用于执行查询的语法，但也包含用于更新、插入和删除记录的语法。查询和更新指令构成了SQL的DML部分：\n  1. **SELECT**：从数据库表中获取数据\n\
    \  2. **UPDATE**：更新数据库表中的数据\n  3. **DELETE**：从数据库表中删除数据\n  4. **INSERT INTO**：向数据库中插入数据\n\
    \n## SQL中最重要的DDL语句\n\n- （1） CREATE DATABASE： 创建新数据库\n- （2） ALTER DATABASE： 修改数据库\n\
    - （3） CREATE TABLE： 创建新表\n- （4） ALTER TABLE： 变更（改变）数据库表\n- （5） DROP TABLE： 删除表\n\
    - （6） CREATE INDEX： 创建索引\n\n## SELECT 语句\n\n- SELECT 语句用于从表中选取数据。结果被存储在一个结果表中（称为结果集）。基本格式为：\n\
    \  （1） SELECT 列名称 FROM 表名称\n  （2） SELECT * FROM 表名称\n- 若从表Persons获取名为LastName和FirstName的列的内容，则SELECT\
    \ 语句：\n  SELECT LastName, FirstName FROM Persons\n  SELECT * FROM Persons\n\n\
    ## (3) SQL WHERE 子句\n\nWHERE 子句用于规定选择的标准。如需有条件地从表中选取数据，可将 WHERE 子句添加到 SELECT 语句。语法为：\n\
    \n```\nSELECT 列名称 FROM 表名称 WHERE 列 运算符 值\n```\n\n若只希望选取居住在城市 “Beijing”中的人，则需要向\
    \ SELECT 语句添加 WHERE 子句：\n\n```\nSELECT * FROM Persons WHERE City='Beijing'\n```\n\
    \n## 快速测试\n\n- 1 关系数据库系统的特点是什么？\n- 2 什么是主键、外键？\n- 3 什么是SQL？\n\n## 7.3 ACCESS 2010数据库系统简介\n\
    \n- Access 2010用于构造数据库应用程序并对数据库实行统一管理，该系统简单易用、快捷便利，大部分工作是直观的可视化的操作，以高效地完成各种类型中小型数据库的管理工作，如财务、行政、金融、经济、统计、审计等领域。\n"
