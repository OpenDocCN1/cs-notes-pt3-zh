  - '[PAGE 21]


    # 1.3 软件系统


    +   - 计算机指令是包含有操作码和地址码的一串二进制代码。其中操作码规定了操作的性质(什么样的操作)，地址码表示了操作数和操作结果的存放地址。

    +   - 程序是为解决某一问题而设计的一系列有序的指令或语句(程序设计语言的语句实质包含了一系列指令)的集合。

    +   - 软件是能够指挥计算机工作的程序与程序运行时所需要的数据，以及与这些程序和数据有关的文字说明和图表资料的集合，其中文字说明和图表资料又称文档。'
  - '[PAGE 22]


    # 软件


    +   - 软件系统包括**系统软件**和**应用软件**。


    +   - 系统软件是用来管理计算机资源、操作和控制计算机的软件，通常包括各种**操作系统**、**语言处理系统**以及用以完成计算机监控、诊断和调试功能的服务性程序。


    +   - **操作系统**是计算机正常运行所必需的软件，主要用来管理计算机资源、控制输入/输出和实现用户和系统之间的通信。


    +   - **应用软件**是针对某一个目的而开发的软件，如Word字处理软件、QQ聊天软件、计算机辅助设计软件等。'
  - '[PAGE 23]


    # 计算机软件分类


    系统软件协助计算机执行基本任务。


    应用软件协助人们完成某项任务。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_23_0.png)'
  - '[PAGE 24]


    # 程序设计语言


    +   - 程序设计语言（Programming Language）是一组用来定义计算机程序的语法规则。它是一种被标准化的交流技巧，用来向计算机发出指令。

    +   - 程序设计语言种类多，总的来说可分为机器语言、汇编语言、高级语言三大类。

    +     - 机器语言直接用二进制代码指令表示的计算机语言，是计算机唯一能直接识别、直接执行的计算机语言。

    +     - 汇编语言是用一些助记符表示指令功能的计算机语言，它和机器语言基本上是一一对应的，更便于记忆。

    +     - 高级语言与具体的计算机指令系统无关，其表达方式更接近人们对求解过程或问题的描述方式。这是面向程序的、易于掌握和书写的程序设计语言。'
