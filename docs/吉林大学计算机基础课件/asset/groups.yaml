  md: "\n## 在线拍卖、在线支付\n\n- 在线拍卖是拍卖公司或行业网站在网络上推出的一种在线营销模式，如今在互联网普及的情况下已经很为消费者和收藏者所接受。现在国内在线拍卖的行业很多，知名的有孔夫子旧书网、嘉德拍卖公司、中国书店、腾讯拍拍等网站。\n\
    - 在线支付是指卖方与买方通过因特网上的电子商务网站进行交易时，银行为其提供网上资金结算服务的一种业务。在线支付是一种通过第三方提供的与银行之间的支付接口进行支付的方式，这种方式的好处在于可以直接把资金从用户的银行卡中转账到网站帐户中，汇款马上到帐，不需要人工确认。\n\
    \n## 4.6.5 电子邮件\n\n- 电子邮件（Electronic mail，简称E mail,标志：@）又称电子信箱、电子邮政，它是一种用电子手段提供信息交换的通信方式。\n\
    - 它是Internet上应用最广的服务，通过网络的电子邮件系统，用户可以用非常低廉的价格，以非常快速的方式，与世界上任何一个角落的网络用户联系，这些电子邮件可以是文字、图像、声音等各种方式。同时，用户可以得到大量免费的新闻、专题邮件，并实现轻松的信息搜索。\n\
    \n## 快速测试\n\n- 1. 列举几个著名的浏览器实例。\n- 2. 列举几个著名的搜索引擎实例。\n- 3. 什么是电子商务？\n\n## 4.7\
    \ 网页设计技术\n\n- 网页设计是指使用标识语言（Markup Language），通过一系列设计、建模、和执行的过程将电子格式的信息通过互联网传输，最终以图形用户界面（GUI）的形式被用户所浏览。\n\
    \n## 4.7.1 HTML基础\n\n- HTML（HyperText Markup Language，简称 HTML）是为“网页创建和其它可在网页浏览器中看到的信息”设计的一种标记语言。它是用来描述网页的一种语言，它不是一种编程语言，而是一种标记语言，含有一套标记标签\
    \ (Markup Tag)，HTML使用标记标签来描述网页。\n\n## HTML代码\n\n```\n<html>\n    <head>\n    \
    \    <title>My First Web Page</title>\n    </head>\n<body>\n    <h1>My First Heading</h1>\n\
    \    <p>My first paragraph.</p>\n</body>\n</html>\n```\n\n## 4.7.2 网页制作工具\n\n\
    - 目前常用的网页制作工具有Dreamweaver、SharePoint Designer等，它们都是所见即所得的网页制作工具。\n- Dreamweaver是个原本由Macromedia公司所开发的著名网站开发工具。它使用所见即所得的接口，亦有HTML编辑的功能。它现在有Mac和Windows系统的版本。\n\
    \n## 4.8 网络安全\n\n- 网络安全是指网络系统的硬件、软件及其系统中的数据受到保护，不因偶然的或者恶意的原因而遭受破坏、更改、泄露，系统连续可靠正常地运行，网络服务不中断。\n\
    - 网络安全从其本质上来讲就是网络上的信息安全。从广义来说，凡是涉及到网络上信息的保密性、完整性、可用性、真实性和可控性的相关技术和理论都是网络安全的研究领域。\n\
    \n## 4.8.1 网络安全现状\n\n- 随着计算机技术的飞速发展，信息网络已经成为社会发展的重要保证。有很多是敏感信息，甚至是国家机密。所以难免会吸引来自世界各地的各种人为攻击（例如信息泄漏、信息窃取、数据篡改、数据删添、计算机病毒等）。同时，网络实体还要经受诸如水灾、火灾、地震、电磁辐射等方面的考验。\n\
    \n## 4.8.2 网络安全的威胁与攻击的模式\n\n- （1）计算机病毒(Computer Virus)的扩散\n- 计算机病毒是一种在人为或非人为的情况下产生的、在用户不知情或未批准下，能自我复制或运行的计算机程序；计算机病毒往往会影响受感染计算机的正常运作。\n\
    - 类似生物病毒，它会复制自己并传播到其他宿主，并对宿主造成损害。宿主也是程序，通常是操作系统，从而进一步传染到其他程序、其他的计算机。\n- 主要特征包括：传播性、隐蔽性、感染性、潜伏性、可激发性、表现性或破坏性，通常表现两种以上所述的特征就可以认定该程序是病毒。\n\
    \n## 网络安全的威胁与攻击的模式\n\n- （2） 阻绝服务(Denial of Service, DoS):\n- （3） 后门或特洛伊木马 (Trapdoor/Trojan\
    \ Horse)\n- （4） 伪装(Masquerade)\n- （5） 否认(Repudiation)\n- （6） 网络钓鱼(Phishing)\n\
    - （7） 双面恶魔(Evil Twins)\n- （8） 点击诈骗(Click Fraud)\n\n## 4.8.3 网络安全的特征\n\n- (1)保密性：信息不泄露给非授权用户、实体或过程，或供其利用的特性。\n\
    - (2)完整性：数据未经授权不能进行改变的特性。即信息在存储或传输过程中保持不被修改、不被破坏和丢失的特性。\n- (3)可用性：可被授权实体访问并按需求使用的特性。即当需要时能否存取所需\
    \ 网络安全解决措施的信息。例如网络环境下拒绝服务、破坏网络和有关系统的正常运行等都属于对可用性的攻击；\n- (4)可控性：对信息的传播及内容具有控制能力。\n\
    - (5)可审查性：出现安全问题时提供依据与手段。\n\n## 4.8.4 网络安全措施\n\n- （1）物理措施\n- （2）访问控制\n- （3）数据加密\n\
    - （4）网络隔离\n- （5）隔离卡\n- （6）其他措施\n\n## 4.8.5 Web安全\n\n- 黑客利用网站操作系统的漏洞和Web服务程序的SQL注入漏洞等得到Web服务器的控制权限，轻则篡改网页内容，重则窃取重要内部数据，更为严重的则是在网页中植入恶意代码，使得网站访问者受到侵害。\n\
    - 网络钓鱼（Phishing）攻击者利用欺骗性的电子邮件和伪造的Web站点来进行网络诈骗活动，受骗者往往会泄露自己的私人资料，如信用卡号、银行卡账户、身份证号等内容。诈骗者通常会将自己伪装成网络银行、在线零售商和信用卡公司等可信的品牌，骗取用户的私人信息。\n\
    \n## 快速测试\n\n- 1. 什么是网络钓鱼？\n- 2. 网络安全措施有哪些？\n\n## 习题\n\n- 一、术语解释\n- TCP/IP Internet\
    \ HTTP HTML Web DNS\n- 二、简答题\n- 三、选择题\n\n## 大学计算机基础教程\n\n## 第五章 Office 办公软件\n\n\
