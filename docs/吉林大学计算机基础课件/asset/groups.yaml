    # 第二节 Windows 7 的基本操作


    # 一、Windows 7 概述


    Microsoft开发的Windows 7是目前世界上用户最多、并且兼容性最强的操作系统。


    Microsoft Windows 7是彩色界面的操作系统，支持键盘和鼠标功能。默认的平台是由任务栏和桌面图标组成的。


    任务栏是显示正在运行的程序、“开始”菜单、时间、快速启动栏、输入法以及右下角的托盘图标组成。


    桌面图标是进入程序的途径。默认的系统图标有“我的电脑”、“我的文档”、“回收站”，另外，还会显示出系统的自带的“IE浏览器”图标。运行 Windows 7
    的程序主要操作都是由鼠标和键盘控制的。'
