    \  - (6) 状态栏：它在窗口的最下方，标明了当前有关操作对象的一些基本情况。\n  - (7) 工作区域：它在窗口中所占的比例最大，显示了应用程序界面或文件中的全部内容。\n\
    \n- **2. 窗口的操作**\n  - (1) 打开窗口：当需要打开一个窗口时，可以通过下面两种方式来实现：\n    - 选中要打开的窗口图标，然后双击鼠标左键打开。\n\
    \    - 在选中的图标上单击鼠标右键，在其弹出的快捷菜单中选择“打开”命令。\n  - (2) 移动窗口：移动窗口时用户只需要在标题栏上按下鼠标左键拖动或者在标题栏上右击，在打开的快捷菜单中选择“移动”命令，移动到合适的位置后再松开，即可完成移动的操作。\n\
    \n  ※思考：窗口在什么状态下可以移动，什么状态下不可以移动？\n\n  窗口在不是最大化的状态下可以移动；窗口在最大化的状态下不可以移动。\n\n  -\
    \ (3) 缩放窗口：通常采用把鼠标移到窗口的垂直边框上来改变窗口的大小。\n    - ✓ 改变窗口宽度：当移到窗口的垂直边框上变成双向箭头时，按下鼠标左键并拖动，可以改变窗口的宽度。\n\
    \    - ✓ 改变窗口高度：当移到水平边框上变成双向箭头时，按下鼠标左键并拖动，可以改变窗口的高度。当把鼠标移到边框的任意角上变成双向箭头时，按下鼠标左键并拖动，可以对窗口进行等比缩放。\n\
    \n  ※思考：窗口在什么状态下可以缩放，什么状态下不可以缩放？\n\n  窗口在不是最大化的状态下可以缩放；窗口在最大化的状态下不可以缩放。\n\n  -\
    \ (4) 最大化/还原、最小化和关闭窗口按钮：位置在窗口的右上角，标题栏的最右端。\n    - 最小化按钮：在暂时不需要对窗口操作时，可把它最小化以节省桌面空间，用户直接在标题栏上单击此按钮，窗口会以按钮的形式缩小到任务栏。\n\
    \    - 最大化按钮：窗口最大化时铺满整个桌面，这时不能再移动或者是缩放窗口。用户在标题栏上单击此按钮即可使窗口最大化。\n    - 还原按钮：当把窗口最大化后想恢复原来打开时的初始状态，单击此按钮即可实现对窗口的还原。用户使用鼠标双击标题栏可以在最大化和还原两种状态间切换。\n\
    \    - 关闭按钮：直接单击标题栏上的“关闭”按钮，可以关闭窗口。\n"
