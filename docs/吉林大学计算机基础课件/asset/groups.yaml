    # 1.4.3 字符编码


    +   - 在计算机中不能直接存储英文字母或专用字符。如果想把一个字符存放到计算机内存中，就必须用二进制代码来表示。国际上流行的字符编码有ASCII码、Unicode等。

    +   - ASCII码是美国信息交换标准码(American Standard Code for Information Interchange)的简称。它采用7位二进制编码。附录A

    +   - Unicode（统一码、万国码、单一码、标准万国码）是计算机科学领域里的一项业界标准。它对世界上大部分的文字系统进行了整理、编码，使得电脑可以用更为简化地方式来呈现和处理文字。

    +   - GB 2312 或 GB 2312-80 是《信息交换用汉字编码字符集·基本集》。'
