    \n![](img/60882d3e569e0db30f34a44fdc73ab49_401_0.png)\n\n## 2. 计算机动画的分类\n\n- 按表现空间的维度，可以把动画分为二维（平面）动画和三维（立体）动画。\n\
    - 本章介绍二维动画的制作。\n\n## 1.3.2 Flash简介\n\n- Flash源文件以“.fla”为文件扩展名，动画制作好后，可以将文档发布为.swf文件、.exe文件或.html文件等。\n\
    \n## 1. Flash的功能\n\n- 可以绘制图形、编辑文本、创作动画以及应用程序。\n\n- 可以导入位图、视频和声音信息。\n\n- 支持编程，可以制作交互性很强的动画和应用程序。\n\
    \n- 动画主要由矢量图形组成，文件较小，因此 Flash很适合Web开发，\n\n## 2. Flash界面\n\n整个工作环境主要由菜单栏、工具箱、时间轴、舞台、浮动面板等几个部分组成。\n\
    \n工具箱\n\n标题栏\n\n主要工具栏\n\n菜单栏\n\n面板\n\n时间轴\n\n编辑栏\n\n舞台工作区\n\n“属性”面板 “动作”面板 “库”面板\n\
    \n## 3. 工具箱\n\n- 提供了用于图形绘制和图形编辑的各种工具，从上到下分为4个栏：工具栏、查看栏、颜色栏和选项栏。\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_406_0.png)\n"
  mdcn: "\n## （3）数据压缩技术的性能指标\n\n- 压缩比\n- 图像质量\n- 压缩和解压缩的速度\n\n希望压缩比要大，即压缩前后所需的信息存储量之比要大；恢复效果要好，尽可能地恢复原始数据；实现压缩的算法要简单，压缩、解压缩速度快，尽可能地做到实时压缩解压。\n\
    \n## （4）音频压缩标准\n\n- 音频信号可分为电话质量的语音、调幅广播质量的音频信号和高保真立体声信号。针对不同的音频信号，ITU-T和ISO先后提出了一系列的有关音频压缩编码的建议。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_384_0.png)\n\n## （5）图像和视频压缩标准\n\n-\
    \ 原始的彩色图像，一般由红、绿、蓝3种基色的图像组成。然而人的视觉系统对彩色色度的感觉和亮度的敏感性是不同的，因此产生了不同的彩色空间表示。H、S、I彩色空间比R、G、B彩色空间更符合人的视觉特性，其中H为色调、S为饱和度、I表示光的强度或亮度。\n\
    - 对于静止的图像压缩，已有多个国际标准，如ISO制定的JPEG和ITU-T的G3、G4标准等。\n- 视频编码标准有ITU-T制定的视频编码标准（一般称为建议），表示为H.26x，ISO/IEC制定的标准表示为MPEG-x\
    \ 例如：MPEG-1、MPEG-2和MPEG-4。\n\n## 2. 音频处理技术\n\n- 音频信息：在多媒体技术中，人们通常将声音媒体分为3类：波形声音、语音、音乐。从听觉角度讲，声音媒体具有三个要素，即音调、音强和音色。一般来说，声音的质量与声音的频率范围有关，即频率范围越宽，声音的质量就越好。\n\
    - 声音文件的基本格式： WAV、 MIDI、 MP3、 RA、 WMA等\n- 数字音频信号：音频经过数字化采样和量化得到的时间和幅度都离散的数字信号。\n\
    - 音频信号的获取\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_386_0.png)\n\n## 3. 视频处理技术\n\
    \n- 视频信息：任何动态图像都是由多幅连续的图像序列构成。每一幅图像沿着时间轴保持一个 Δt 时间，以较快的速度（一般为每秒25帧～30帧）顺序更换为另一幅图像，连续不断地显示，就形成了动态图像。\n\
    \n- 动态图像序列根据每一幅图像的产生形式，又分为不同的种类。当每一帧图像是人工或计算机产生的时候，被称为“动画”；当每一帧图像是通过实时获取的自然景物时，被称为“视频”。\n\
    \n- 视频有模拟和数字两种形式。\n\n## 3. 视频处理技术\n\n- 视频文件的基本格式： AVI、 MOV、 MPG、 DAT、 RM、 ASF、\
    \ 3GP和WMV等\n- 视频信息的获取\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_388_0.png)\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_388_1.png)\n\n## 快速测试\n\n- 多媒体技术有哪些特性？\n\
    - 有哪些常用的多媒体存储设备？\n- 为什么要对多媒体信息进行压缩？\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_389_0.png)\n\
    \n## 1.2.1 数字图像\n\n数字图像按照图像元素的组成方式，基本上可以归纳为两大类：位图图像和矢量图形。\n\n- 位图图像：也叫点阵图像，即该图像是由许多不同的颜色的点组成，这些点被称为像素。许多个像素组合在一起便产生了完整的图像。常见的位图图像文件类型有BMP、JPEG、PSD、GIF等。\n\
    \n- 矢量图形：也叫向量图形，它以数学方式来记录图像内容。文件信息量小，由于矢量图形在放大或缩小时，组成图形的点的坐标位置没有改变，因此，图形的清晰度也不会改变。常见的矢量文件类型有SVG、EPS、SWF、DXF等。\n\
    \n## 1.2.2 Photoshop CS3简介\n\n- Photoshop本身文件的扩展名是 .psd\n- Photoshop应用程序窗口由菜单栏、工具箱、工具属性栏、图像窗口、浮动面板等组成\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_392_0.png)\n\n## 1. PhotoShop 工具箱\n\
    \n选取工具  移动工具\n套索工具  魔棒工具\n裁剪工具  薄片工具\n图像修复工具  画笔工具\n橡皮图章工具  历史画笔工具\n橡皮擦工具  清除工具\n\
    涂抹工具  色调处理工具\n路径工具  文字工具\n钢笔工具  多边形工具\n注释工具  吸管工具\n观察工具  放大镜工具\n前景色  前/背景色互换\n\
    默认前景色/背景色  背景色\n标准窗口按钮  显示模式图标按钮\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_393_0.png)\n\
    \n## 1.2.3 Photoshop 的主要操作\n\n- 1、选区操作\n- 选区的创建\n\n规则选区工具\n\n套索工具\n\n魔棒工具\n\n\
    ![](img/60882d3e569e0db30f34a44fdc73ab49_394_0.png)\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_394_1.png)\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_394_2.png)\n\n## 1.2.3 Photoshop 的主要操作\n\
    \n- 1、选区操作\n- 选区的编辑\n  - 选区的移动\n  - 选区的调整\n  - 选区的羽化\n  - 选区的存储和载入\n\n## 2. 图层操作\n\
    \n- **Photoshop**创作的图像一般是由若干个图层构成的，在图层绘图后，上方图层的图像将遮盖下方图层中的图像，没有图像的区域呈透明状态。每个图层以及图层内容都是独立的，图层操作是进行图像处理的重要操作。\n\
    - 图层分为背景图层、普通图层、效果图层、文本图层、矢量图层等。\n\n## 3. 通道操作\n\n- **Photoshop**用通道来存储色彩信息和选择区域，可以分为颜色通道、专用通道和**Alpha**通道**3**种。用户在不同的通道间作图像处理时，可利用通道控制面板来增加、删除或合并通道。\n\
    \n## 4. 路径操作\n\n路径是**Photoshop**提供的精确、灵活确定选区边界或描边的...，路径由锚点和路径线段组成，锚点是路径线段的起点和终点。路径工具可以绘制任意形状的图形，路径可以转换成选区，因此路径可以创建复杂选区。\n\
    \n## 5. 滤镜操作\n\n- 滤镜专门用于对图像进行各种特殊效果处理。图像特殊效果是通过计算机的运算来模拟摄影时使用的偏光镜、柔焦镜及暗房中的曝光和镜头旋转等技术，并加入美学艺术创作的效果而发展起来的。\n\
    \n## 快速测试\n\n- Photoshop的工具栏中有那些工具？\n- Photoshop中有哪些创建选区的方式？\n- Photoshop中的滤镜有能处理哪些特殊效果？\n\
    \n## 1.3 Flash MX基础\n\n### 1.3.1 动画\n\n- 动画是指由一系列的静止画面以一定的速度连续播放时，由于视觉暂留现象产生的连续动态的效果。\n\
    \n- 动画中的静止的画面称为帧。每秒播放静止画面的个数，称为帧频。受视觉暂留时间的限制，一般要形成连续的效果，每秒至少要播放12个连续的画面，即一般动画最低的帧频为12。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_401_0.png)\n\n## 2. 计算机动画的分类\n\n- 按表现空间的维度，可以把动画分为二维（平面）动画和三维（立体）动画。\n\
    - 本章介绍二维动画的制作。\n\n## 1.3.2 Flash简介\n\n- Flash源文件以“.fla”为文件扩展名，动画制作好后，可以将文档发布为.swf文件、.exe文件或.html文件等。\n\
    \n## 1. Flash的功能\n\n- 可以绘制图形、编辑文本、创作动画以及应用程序。\n\n- 可以导入位图、视频和声音信息。\n\n- 支持编程，可以制作交互性很强的动画和应用程序。\n\
    \n- 动画主要由矢量图形组成，文件较小，因此 Flash很适合Web开发，\n\n## 2. Flash界面\n\n整个工作环境主要由菜单栏、工具箱、时间轴、舞台、浮动面板等几个部分组成。\n\
    \n工具箱\n\n标题栏\n\n主要工具栏\n\n菜单栏\n\n面板\n\n时间轴\n\n编辑栏\n\n舞台工作区\n\n“属性”面板 “动作”面板 “库”面板\n\
    \n## 3. 工具箱\n\n- 提供了用于图形绘制和图形编辑的各种工具，从上到下分为4个栏：工具栏、查看栏、颜色栏和选项栏。\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_406_0.png)\n"
