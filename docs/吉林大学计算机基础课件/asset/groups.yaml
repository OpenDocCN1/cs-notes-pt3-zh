    # 6.1.1   C语言简介


    +   - C语言是一种通用的、过程式的编程语言，广泛用于系统与应用软件的开发。具有高效、灵活、功能丰富、表达力强和较高的移植性等特点，在程序员中备受青睐。

    +   - C语言是由UNIX的研制者Dennis Ritchie于1970年在B语言的基础上发展和完善起来的。目前，C语言编译器普遍存在于各种不同的操作系统中，例如UNIX、MS-DOS、Microsoft
    Windows、Linux等。C语言的设计影响了许多后来的编程语言，例如C++、Objective-C、Java、C#等。'
