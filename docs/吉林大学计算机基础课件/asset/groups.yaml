    \ 9.2.2 360系统急救箱\n\n- 360系统急救箱以前又称“顽固木马专杀大全”，是强力查杀木马病毒的系统救援工具，对各类流行的顽固木马查杀效果较好。在计算机需要紧急救援、普通杀毒软件查杀无效，或是电脑感染木马导致杀毒软件无法安装和启动的情况下，360系统急救箱能够强力清除木马和可疑程序，并修复被感染的系统文件，抑制木马再生，是计算机需要急救时强力工具。\n\
    \n## 快速测试\n\n1. 当网络上爆发最新的病毒攻击，用户需及时对杀毒软件进行________。\n2. 安装杀毒软件后，需要注意三个重要点：\n \
    \  一、________和________。\n\n## 9.3 教育学习类\n\n- 在日常学习过程中，常用的文字处理软件包含OFFICE和WPS，但Internet上发布的文档，有很大大部分都是PDF格式，特别是学术文章，几乎全部为PDF格式，且大多为英文。本节介绍PDF文档的读取软件ADOBE\
    \ ACROBAT和词典软件金山词霸，为学生学习打好软件基础。\n\n## 9.3.1 Adobe Acrobat\n\n- ADOBE公司是著名的图形、图像软件公司，其公司产品Adobe\
    \ Photoshop在图像处理领域独霸一方。由Adobe公司推出的PDF（Portable Document Format，便携式文档格式）是一种全新的电子文档格式，由于该格式使用Adobe公司开发的PostScript页面描述语言，使得页面中的文字和图形的质量得到质的飞跃。\n\
    \n## Acrobat Professional\n\n- Acrobat Professional对PDF文档提供了丰富的功能，常用的有：\n- 1）书签：阅读长篇文章时，书签功能使用户可以快速定位上次阅读中断位置。\n\
    - 2）注释：阅读文章遇有不清楚不明白的地方，可以使用注释功能对该处进行详细注解。\n- 3）安全：可以对PDF文档的安全性进行设置。\n"
