    ## 具有以下基本特点


    - 存储文件单一。一个Access 2010数据库文件中包含了该数据库中的全部数据表、查询等与之相关的内容。

    - 可以利用各种图例查询，快速获取数据。

    - 利用报表设计工具，可以非常方便快捷地生成数据报表。

    - 利用OLE技术，可以在数据库中插入各种对象，包含声音、图像、视频等对象。

    - Access为用户提供了强大的向导功能，利用向导，用户可以轻松地创建Access的各种对象，包括表、查询、报表、Web页、宏和模块。

    - 提供了功能强大的编程语言——VBA（Visual Basic For Application），利用它用户可以编写复杂的数据应用程序。


    ## 7.3.1 Access 2010的启动


    （1）使用“开始”菜单启动。单击Windows任务栏左下角“开始”→“程序”→“Microsoft Office”→“Microsoft Office Access
    2010”，就可以启动Access 2010。


    （2）使用快捷方式启动。最简单而直接的启动方法，就是在桌面上建立Access 2010的快捷方式，这样只需要双击桌面上的快捷方式图标，就可以方便、快捷地启动该软件。


    ## 7.3.2 创建数据库


    - 例7.1 建立“教学管理”空数据库，并将建好的数据库存在D盘的database文件夹（事先建好的文件夹）中。

    - 操作步骤如下：

    - 1. 选择“文件”→“新建”，打开“新建”对话框，单击“空数据库”选项，弹出“文件新建数据库”对话框，如图7.1所示。

    - 2. 在该对话框“保存位置”栏中找到D盘database文件夹，并打开。

    - 3. 在“文件名”文本框中输入“教学管理”，选择保存类型为“Microsoft Access 2007数据库（*.accdb）”，单击确定按钮。如图7.2所示。

    - 4. 回到“新建”对话框后，单击“创建”按钮


    ## 7.3.3 表的建立


    - 表是Access数据库的基础，是存储数据的容器。表结构是指数据表的框架，主要包括字段名称、数据类型、字段属性等。每个字段应具有唯一的名字，称为字段名称。在
    Access 2010 中，字段名称的命名规则如下：

    - （1）长度为1-64个字符；

    - （2）可以包含字母、汉字、数字、空格和其他字符，但不能以空格开头；

    - （3）不能包含句号“.”、叹号“！”、方括号“[]”和重音符号“’”；

    - （4）不能使用ASCII为0-32的ASCII字符。


    ## Access常用的数据类型


    - 在关系数据库理论中，一个表中的同一列数据必须具有相同的数据特征，称为字段的数据类型。在设计表时，必须定义表中每个字段应该使用的数据类型。

    - Access常用的数据类型有文本、备注、数字、日期/时间、货币、自动编号、是/否、OLE对象、超链接、查阅向导等。


    ## 数字类型的种类及其取值范围


    表 7.5 数字类型的种类及其取值范围


    | 数字类型 | 值的范围 | 小数位数 | 字段长度 |

    |---|---|---|---|

    | 字节 | 0～255 | 无 | 1 字节 |

    | 整数 | -32768～32767 | 无 | 2 字节 |

    | 长整数 | -2147483648～2147483647 | 无 | 4 字节 |

    | 单精度数 | -3.4×10^38～3.4×10^38 | 7 | 4 字节 |

    | 双精度数 | -1.79734×10^308～1.79734×10^308 | 15 | 8 字节 |


    ## 建立表结构的方法


    - 建立表结构有3种方法：

    - （1）在数据表视图中直接在字段名处输入字段名，但无法对每一字段的数据类型、属性进行设置，一般还需要在设计视图中进行修改；

    - （2）使用设计视图，这是一种最常用的方法；

    - （3）通过表向导创建表结构，其创建方法与使用数据库向导创建数据库的方法类似。


    ## 例7.3


    - 例7.3 建立学生表、教师表和选课成绩表，表结构分别如表7.6～7.9所示。


    ### 表7.6 学生表结构


    | 字段名称 | 数据类型 | 字段名称 | 数据类型 |

    |---|---|---|---|

    | 学号 | 文本 | 入校年份 | 数字 |

    | 姓名 | 文本 | 团员否 | 是 / 否 |

    | 性别 | 文本 | 所在系 | 文本 |


    ### 表7.7 教师表结构


    | 字段名称 | 数据类型 | 字段名称 | 数据类型 |

    |---|---|---|---|

    | 教师号 | 文本 | 工作时间 | 日期 / 时间 |

    | 姓名 | 文本 | 职称 | 文本 |

    | 性别 | 文本 | 学历 | 文本 |


    ### 表7.8 课程表结构


    | 字段名称 | 数据类型 | 字段名称 | 数据类型 |

    |---|---|---|---|

    | 课程编号 | 文本 | 课程类别 | 文本 |

    | 课程名称 | 文本 | 学分 | 数字 |


    ### 表7.9 选课成绩表结构


    | 字段名称 | 数据类型 | 字段名称 | 数据类型 |

    |---|---|---|---|

    | 选课号 | 自动编号 | 课程编号 | 文本 |

    | 学号 | 文本 | 成绩 | 数字 |


    ## 7.3.4 编辑表内容


    - 向表中添加数据记录一般在表的数据表视图下进行，也可以通过SQL语句或者在窗体视图中添加。

    - 在向表中添加记录时，一定要保证输入的数据类型要和设定的各字段的类型保持一致，在对设置了掩码的字段输入数据时，输入的数据格式要和设定的掩码的格式一致。

    - 在列表框中只能从下拉列表中选择相应的值，而不能手动输入。


    ## 例7.4 为教师表中添加记录


    1. 打开教学管理数据库，并切换到“表”对象面板。

    2. 在“导航窗格”中双击“教师表”，进入教师表的数据表视图。

    3. 将光标移动到表的首行，这时，在每一个字段单元格中存在在设计表结构时设置的空白或默认值。

    4. 输入该记录的字段值分别为：101008、赵庆、男、2001-7-20、副教授、博士。


    ## 7.3.5 表间关联的建立与修改


    - 一个数据库中常常包含若干个表，表之间可以相互关联。

    - 通常相互关联的字段是表的主键，它能够对每个记录提供唯一的标识，在另一个相关联的数据表中称为外键。

    - 外键对应的字段的数据应该与关联表中的主键对应的字段的数据匹配。并且在建立表之间的关系之前，每个表必须都设置一个主键，同时要关闭所有打开的表。


    ## 表之间的关联有3种


    - 一对一的关系：指第一个表中的每条记录，在第二个表中有且只有一条相关的记录。

    - 一对多的关系：指第一个表中的每条记录，在第二个表中有多条相关的记录。

    - 一对一的关系：指第一个表中的多条记录与第二个表中多条相关的记录。


    ## 例7.5


    - 例7.5 建立“教师”和“课程”表之间的关系。

    - 在“教学管理”数据库中，“教师”和“课程”两个表之间是多对多的关系。为了将其转换了一对多的关系，在二者之间引进一个“授课”关系作为它们之间的联系：

    - 授课（授课号，教师编号，课程编号）


