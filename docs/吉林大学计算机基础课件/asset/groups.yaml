    # 9.1.1 BIOS设置


    +   - BIOS全称Basic Input Output System，即基本输入输出系统，负责计算机开机时对系统的各种硬件设备进行检测和初始化，确保计算机能正常工作。

    +   - BIOS程序固化在计算机主板的BIOS存储芯片中，断电后程序不会消失，现有的BIOS芯片都采用EEPROM（电可擦除可编程只读存储器）或Flash
    ROM。'
  - '[PAGE 417]


    # BIOS程序


    +   - BIOS程序自身保存有主板厂商预先定义好的计算机运行参数，用户可以通过BIOS程序进行参数设置，也可以直接使用BIOS芯片中预定义参数，设置的参数都保存于主板上的CMOS（Complementary
    Metal-Oxide-Semiconductor Transistor，互补金属氧化物半导体）芯片中，所以也就有了CMOS设置和BIOS设置两种说法。'
  - '[PAGE 418]


    # BIOS设置程序


    +   当计算机启动时，根据屏幕提示按Del键或F2键进入BIOS设置程序。Award 的BIOS设置程序如图9.1所示。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_418_0.png)'
