  mdcn: "\n## 第1章 计算机概述\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_0_0.png)\n\n###\
    \ 1.1 计算机的来源\n\n- 计算机（Computer），全称电子计算机，又称电脑，是一种利用电子学原理根据一系列指令来对数据进行处理的机器。\n-\
    \ 计算机是20世纪最重要的发明之一，它深刻地影响了我们的生活，改变了我们的社会。它是人类进入信息时代的重要标志之一。\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_1_0.png)\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_1_1.png)\n\n## ENIAC与ABC计算机\n\n- 世界上第一台现代电子计算机\
    \ “ENIAC”（发音：/ˈɛni.æk/，是电子数字积分计算机的简称，英文全称为Electronic Numerical Integrator And\
    \ Computer），诞生于1946年2月14日的美国宾夕法尼亚大学。\n- ENIAC是宾夕法尼亚大学的约翰·莫齐利和J·Presper·埃克特构思和设计的。莫齐利对于ENIAC的设计思想部分来源于约翰·阿塔纳索夫和克利福德·贝尔设计的ABC计算机。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_2_0.png)\n\n## “存储程序”(Stored-program)思想\n\
    \n- 被称为计算机之父的是美籍匈牙利数学家冯·诺依曼（Von Neumann），他和他的同事们研制了世界上第二台电子计算机EDVAC，对后来的计算机在体系结构和工作原理上具有重大影响。\n\
    - 在EDVAC中采用了“存储程序”的概念，以此概念为基础的各类计算机统称为冯·诺依曼机。\n- 冯·诺依曼自己也承认，他的关于计算机“存储程序”的想法都来自图灵。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_3_0.png)\n\n## 计算机科学之父-图灵\n\n- 英国数学家艾兰·图灵（Alan\
    \ Mathison Turing, 1912-1954）是世界上公认的计算机科学奠基人。\n\n- 他的主要贡献有两个：一是建立图灵机（Turing Machine,\
    \ TM）模型，奠定了可计算理论的基础；二是提出图灵测试，阐述了机器智能的概念。\n\n- 为纪念图灵对计算机科学的贡献，美国计算机学会ACM在1966年创立了“图灵奖”，每年颁发给在计算机科学领域的领先研究人员，号称计算机业界和学术界的诺贝尔奖。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_4_0.png)\n\n图灵\n\n## 图灵机\n\n计算机是使用相应的程序来完成任何设定好的任务。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_5_0.png)\n\n图灵机是一种思想模型，它由三部分组成：一个控制器，一条可以无限延伸的带子和一个在带子上左右移动的读写头。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_5_1.png)\n\n## 第一台电子计算机（ENIAC,1946）\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_6_0.png)\n\n- 5000次加法/秒\n- 体重28吨\n\
    - 占地170m²\n- 18800只电子管\n- 1500个继电器\n- 功率150KW\n\n注：一说是约翰·阿塔纳索夫的ABC计算机\n\n## 按所采用的电子器件划分\n\
    \n- 第一代 (1946-50s) 电子管\n- 第二代 (1950s-60s) 晶体管\n- 第三代 (1960s-70s) 集成电路\n- 第四代 (1970s-)\
    \ 超大规模集成电路\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_7_0.png)\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_7_1.png)\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_7_2.png)\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_7_3.png)\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_7_4.png)\n\n## 第一代（1946~1958）：电子管\n\
    \n- 基本特征采用电子管作为计算机的逻辑元器件，每秒运算速度仅为几千次，内存容量仅数KB。其数据表示主要是定点数，使用机器语言或汇编语言编写程序。第一代电子计算机体积庞大，造价昂贵，用于军事和科学研究工作。其代表机型有IBM\
    \ 650（小型机）、IBM 709（大型机）。\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_8_0.png)\n\
    \n## 第二代（1959~1964）：晶体管\n\n- 基本特征是采用晶体管作为计算机的逻辑元器件，由于电子技术的发展，运算速度达每秒几十万次，内存容量增至几十KB。与此同时，计算机软件技术也有了较大发展，出现了FORTRAN、COBOL、ALGOL等高级语言。与第一代计算机相比，晶体管电子计算机体积小、成本低、功能强、可靠性大大提高。除了科学计算外，还用于数据处理和事务处理。其代表机型有IBM\
    \ 7094、CDC 7600。\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_9_0.png)\n\n## 第三代（1965~1970）：集成电路阶段\n\
    \n基本特征是采用小规模集成电路作为计算机的逻辑器件，随着固体物理技术的发展，集成电路工艺已可以在几平方毫米的单晶硅集成电路片上集成由十几个甚至上百个电子元器件组成的逻辑电路。它的运算速度每秒可达几十万次到几百万次，体积越来越小，价格越来越低，软件越来越完善，在监控程序的基础上发展形成了操作系统。其代表机型有IBM360。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_10_0.png)\n\n## 第四代（1971年~现在）：大规模/超大规模集成电路阶段\n\
    \n- 基本特征是采用大规模集成电路和超大规模集成电路作为计算机的逻辑元器件，20世纪70年代以来，集成电路制作工艺取得了迅猛的发展，在硅半导体上可集成更多的电子元器件，半导体存储器代替了磁芯存储器，目前，计算机的速度最高可以达到每秒几百万亿次浮点运算。操作系统不断完善，高级程序设计语言功能更加完善，人们的生活与计算机应用息息相关。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_11_0.png)\n\n超大规模集成电路\n\n## 计算机第一定律——摩尔定律\n\
    Gordon Moore\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_12_0.png)\n\n每18个月芯片能力增长一倍。\n\
    \n晶体管数\n\n单位时间执行的指令数\n百万条每秒\n\n## 计算机的分类\n\n- 数字电子计算机(一般) 与 模拟电子计算机(很少)\n- 按设计目的\n\
    \  - 通用计算机、 专用计算机\n- 按用途\n  - 科学计算 工程计算\n  - 工业控制\n  - 数据计算\n- 大小\n  - 巨型机（或称超级计算机）\n\
    \  - 小巨型机、大型机、小型机、工作站\n  - 个人计算机或称微型机（目前家庭和学校普遍使用的就是微型机，即Personal computer）。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_13_0.png)\n\n## 计算机的基本特点\n\n- 1. 记忆能力强\n\
    - 2. 计算精度高与逻辑判断准确\n- 3. 高速的处理能力\n  ——它具有神奇的运算速度，其速度以达到每秒几十亿次乃至上百亿次。\n- 4. 能自动完成各种操作\n\
    \n## 思考与练习\n\n- 1. 世界上第一台电子计算机是什么？\n- 2. 计算机之父是谁？\n- 3. 全球第一个商业微处理器是什么？\n\n##\
    \ 1.2 硬件系统\n\n冯·诺依曼结构的主要思想包括以下几个部分：\n\n- (1) 计算机应由运算器、控制器、存储器、输入设备和输出设备五个基本部件组成。\n\
    \n- (2) 各基本部件的功能是：\n  - 存储器不仅能存放数据，也能存放指令；\n  - 控制器应能自动执行指令；\n  - 运算器应能进行加、减、乘、除四种基本算术运算，并且也能进行一些逻辑运算和附加运算；\n\
    \  - 操作人员可通过输入设备、输出设备和主机进行通信。\n\n- (3) 内部以二进制表示指令和数据。每条指令由操作码和地址码两部分组成。操作码指出操作类型，地址码指出操作数的地址。由一串指令组成程序。\n\
    \n- (4) 采用“存储程序”工作方式。\n\n## 典型的冯·诺依曼硬件框图\n\n![](img/60882d3e569e0db30f34a44fdc73ab49_17_0.png)\n"
