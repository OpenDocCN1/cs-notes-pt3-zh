    # # 第7章　数据库


    +   - 本章首先简述数据库的基本概念、数据模型、数据库管理系统（DBMS）等数据库的基础知识，着重分析了关系数据库的概念、SQL的查询命令使用等内容，最后介绍了Microsoft
    Access的使用方法，用图示说明了利用Access创建表的方法。'
  - '[PAGE 322]


    # 7.1 数据库基础知识


    ![](img/60882d3e569e0db30f34a44fdc73ab49_322_0.png)


    +   - 数据是描述事物所使用的符号，它是计算机加工的“原料”，如图形、声音、文字、数、字符和符号等。


    +   - 数据库（Data Base，简称DB）是指以一定组织方式储存在一起的，能为多个用户共享的，具有尽可能小的冗余度的、与应用彼此独立的相互关联的数据集合。


    +   - 数据库管理系统（DataBase Management System，简称DBMS）由一个互相关联的数据的集合和一组用以访问数据库的程序组成。'
  - '[PAGE 323]


    # 数据库管理系统


    +   - （1）数据定义语言（DDL）： Data Definition Language_DDL，该语言负责数据的模式定义与数据的物理存取构建。

    +   - （2）数据操纵语言（DML）： Data Manipulugge_DML，该语言负责数据的操纵，包括查询及增加、删除及增加、删除、修改等操作。

    +   - （3）数据控制语言（DCL）： Data Control Language_DCL，该语言负责数据完整性、安全性的定义与检查以及并发控制、故障恢复等功能。'
  - '[PAGE 324]


    # 目前比较通行的DBMS


    +   1. Microsoft Access


    +   Access是Microsoft强大的桌面数据库平台。它只具备数据库管理系统的一些简单功能，本章将在下一节介绍Microsoft Access 2010的使用方法。


    +   2. Microsoft SQL Server


    +   Microsoft SQL Server是一个多关系数据管理系统。'
  - '[PAGE 325]


    # 数据库系统


    +   - 数据库系统（Database System，简称DBS）是以数据库为核心的完整的运行实体。它包括：数据库（DB）；数据库管理系统（DBMS）；数据库管理员（Database
    Administrator，简称DBA）。

    +   - 数据库管理员对数据库进行规划、设计、维护和监视等工作的人员。

    +   - 数据库、数据库管理系统和数据库系统是三个不同的概念，数据库强调的是数据，数据库管理系统是系统软件，而数据库系统强调的是系统。'
  - '[PAGE 326]


    # 7.1.2 数据库管理技术的发展


    +   - 计算机数据的管理是随着计算机硬件（主要是外存储器）、软件技术和计算机应用范围的发展而不断发展，数据库的发展大致经历了如下四个阶段：

    +     - 人工管理阶段

    +     - 文件系统阶段

    +     - 数据库系统阶段

    +     - 高级数据库阶段'
  - '[PAGE 327]


    # 7.1.3 数据模型


    +   - 数据库中不仅要存放数据本身，还要存放数据与数据之间联系，可以用不同的方法表示数据与数据之间的联系，把表示数据与数据之间的联系的方法称之数据模型。

    +   - 传统的数据模型有层次数据模型、网状数据模型和关系数据模型。'
  - '[PAGE 328]


    # 1. 层次数据模型


    +   - 用树型结构来表示实体之间联系的模型称为层次数据模型。

    +   - 构成层次模型的树是由结点和连线组成，结点表示实体集，连线表示相连两个实体之间的联系，这种联系只能是一对多的。

    +   - 通常把表示“一”的实体放在上方，称为父结点；而把表示“多”的实体放在下方，称为子结点。'
  - '[PAGE 329]


    # # 2. 网络数据模型


    +   - 如果取消层次模型中的两点限制，即允许每一个结点可以有多个父结点，便形成了网络。用网络结构表示实体之间联系的数据模型称为网络数据模型，也称为网状数据模型。


    +   - 由于网络模型没有层次模型的两点限制，所以可以直接表示多对多的联系。但是，多对多联系实现起来太复杂。'
  - '[PAGE 330]


    # 3. 关系数据模型


    +   - 关系数据模型源于数学，它把数据看成是二维表中的元素，而这个二维表就是关系。用关系（表格数据）表示实体和实体之间联系的模型称为关系数据模型。

    +   - 关系就是二维表格，表格中的每一行称作是一个元组，它相当于一个记录值，每一列是一个属性值集，列可以命名，称为属性名。'
