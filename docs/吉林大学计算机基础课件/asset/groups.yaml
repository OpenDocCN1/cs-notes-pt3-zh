    ## 第四节 Windows 7的菜单和任务栏

    ### 四、了解任务栏


    任务栏是位于屏幕底部的水平长条。与桌面不同的是，桌面可以被打开的窗口覆盖，而任务栏几乎始终可见。它由以下三个主要部分构成：


    +   - “开始”按钮：用于打开“开始”菜单；

    +   - “中间部分”：显示已打开的程序和文件，并可以在它们之间进行快速切换；

    +   - “通知区域”：包括时钟以及一些告知特定程序和计算机设置状态的图标。


    ## 第四节 Windows 7的菜单和任务栏

    ### 五、将程序图标锁定到任务栏


    Windows 7操作系统中，可以将程序直接锁定到任务栏，以便快速方便地打开该程序，而无需在“开始”菜单中查找打开该程序。操作步骤如下：


    +   ① 如果该程序已经在运行，则右键单击任务栏上此程序的图标（或将该图标拖向桌面）来打开此程序的跳转列表，然后单击“将此程序锁定到任务栏”；


    +   ② 如果此程序没有运行，则单击“开始”菜单，查找到此程序的图标，右键单击此图标并单击“锁定到任务栏”。


    注：还可以通过将程序的快捷方式从桌面或“开始”菜单拖动到任务栏来锁定程序。如果要从任务栏中解除某个锁定的程序，则在该程序的图标上单击鼠标右键打开此程序的“跳转列表”，然后单击“将此程序从任务栏解锁”。


