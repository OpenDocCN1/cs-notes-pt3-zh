  md: '

    ## 9.3.2 金山词霸

    - 金山词霸是金山公司推出的一款免费的词典翻译软件，收录了141本版权词典、32万真人语音、17个场景2000组常用对话等内容，当用户通过电脑浏览外文网页或离线阅读英文时，可以轻松地得到文字翻译、读音等帮助。

    - 金山词霸也可以帮助用户进行英文写作、口语练习、单词复习等多种工作。


    ## 屏幕取词

    - 金山词霸最常用的功能就是“屏幕取词”。开启“屏幕取词”功能后，阅读英文文章时遇到不认识的文字时，将鼠标移到该文字上，金山词霸将会自动进行词语识别，给出如图9-7所示的词语简单语音和语义注解，同时会有该词语的真人发音，避免了用户频繁翻阅纸质词典，节省了大量的时间和精力。


    ## 快速测试

    - 1. PDF文档的使用需要安装软件 ______ 或 。

    - 2. 阅读英文电子文献时，可以使用金山词霸的 ______ 功能进行快速翻译。


    ## 9.4.1 WinRAR压缩

    - WinRAR是一个文件压缩管理共享软件，由俄罗斯人Eugene Roshal开发，最初发布于DOS平台，后延伸到Windows平台。

    - WinRAR 采用独创的压缩算法，比其他同类压缩工具拥有更高的压缩率，WinRAR可以解开CAB、ARJ、TAR、ACE、ISO和7Z等多种压缩类型的文件，资源占用相对较少，这使得WinRAR成为Windows平台下的压缩王者。

    - WinRAR是一款共享软件，免费使用40天之后需注册付费使用。


    ## 9.4.2 DAEMON虚拟光驱

    - 有两个原因使得虚拟光驱成为计算机必不可少的软件，一是虚拟光驱频繁读取的是光盘镜像文件，避免了光盘频繁使用造成光盘损坏；二是目前寻求资源的方法通常是网络下载，而相当一部分资源是光盘镜像文件，此类文件的读取都是通过虚拟光驱直接读取。

    - DAEMON是虚拟光驱软件中的佼佼者，全称DAEMON Tools Lite


    ## DAEMON

    - DAEMON支持ccd、ape、iso和nrg等多种格式的光盘镜像文件，同时支持镜像文件的制作。另外，光盘镜像文件也可以使用WinRAR进行解压后使用，但光盘镜像文件一般体积较大，解压需花费相当多时间，并且解压后文件体积更大，占用了更多的主机硬盘空间，所以对光盘镜像文件的读取还是主要依靠虚拟光驱。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_436_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_437_0.png)


    ## 快速测试

    - 1. 通过网络下载的资源，如果为压缩类型，可以使用软件____进行解压缩。

    - 2. ISO格式的文件可以进行解压缩，但通常使用软件______进行使用。


    ## 习题

    - 1. 如何设置BIOS来保证电脑只允许特定用户使用？

    - 2. 请介绍市面上其它较为流行的信息安全类软件。

    - 3. 请阐述电子词典翻译与在线翻译的区别和各自的优缺点。

    '
