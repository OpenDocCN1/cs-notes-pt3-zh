    \ key），也称外码；“一”表称为该外键的参照表。\n\n## 7.2.2 SQL简介\n\n- SQL (Structured Query Language，简称SQL)\
    \ 是一种基于关系数据库的语言，这种语言执行对关系数据库中数据的检索和操作。它是一个通用的、功能极强的关系性数据库语言。\n- 目前，绝大多数流行的关系型数据库管理系统，如Oracle,\
    \ Sybase, Microsoft SQL Server, Access等都采用了SQL语言标准。\n\n## 1. SQL的组成\n\n- 可以把SQL分为两个部分：数据操作语言（DML）和数据定义语言（DDL）。\n\
    - SQL是用于执行查询的语法，但也包含用于更新、插入和删除记录的语法。查询和更新指令构成了SQL的DML部分：\n  1. **SELECT**：从数据库表中获取数据\n\
    \  2. **UPDATE**：更新数据库表中的数据\n  3. **DELETE**：从数据库表中删除数据\n  4. **INSERT INTO**：向数据库中插入数据\n\
    \n## SQL中最重要的DDL语句\n\n- （1） CREATE DATABASE： 创建新数据库\n- （2） ALTER DATABASE： 修改数据库\n\
    - （3） CREATE TABLE： 创建新表\n- （4） ALTER TABLE： 变更（改变）数据库表\n- （5） DROP TABLE： 删除表\n\
    - （6） CREATE INDEX： 创建索引\n\n## SELECT 语句\n\n- SELECT 语句用于从表中选取数据。结果被存储在一个结果表中（称为结果集）。基本格式为：\n\
    \  （1） SELECT 列名称 FROM 表名称\n  （2） SELECT * FROM 表名称\n- 若从表Persons获取名为LastName和FirstName的列的内容，则SELECT\
    \ 语句：\n  SELECT LastName, FirstName FROM Persons\n  SELECT * FROM Persons\n\n\
    ## (3) SQL WHERE 子句\n\nWHERE 子句用于规定选择的标准。如需有条件地从表中选取数据，可将 WHERE 子句添加到 SELECT 语句。语法为：\n\
    \n```\nSELECT 列名称 FROM 表名称 WHERE 列 运算符 值\n```\n\n若只希望选取居住在城市 “Beijing”中的人，则需要向\
    \ SELECT 语句添加 WHERE 子句：\n\n```\nSELECT * FROM Persons WHERE City='Beijing'\n```\n\
    \n## 快速测试\n\n- 1 关系数据库系统的特点是什么？\n- 2 什么是主键、外键？\n- 3 什么是SQL？\n\n## 7.3 ACCESS 2010数据库系统简介\n\
    \n- Access 2010用于构造数据库应用程序并对数据库实行统一管理，该系统简单易用、快捷便利，大部分工作是直观的可视化的操作，以高效地完成各种类型中小型数据库的管理工作，如财务、行政、金融、经济、统计、审计等领域。\n"
