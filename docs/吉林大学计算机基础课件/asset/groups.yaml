    ## 1.1 多媒体技术


    ### 1.1.1 基本概念


    #### 1. 多媒体的发展


    随着存储技术、计算技术、通信技术的发展，基于数字化的多媒体系统在20世纪80年代不断涌现，将系统的交互能力、媒体质量、处理灵活性等性能提高到了一个新的水平。宽带数字网络的发展，使系统的集成性有了基础，不再局限于个人计算机领域，而是向分布综合服务的方向发展。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_364_0.png)


    #### 2. 媒体


    媒体作为信息表示和传播的形式载体，根据信息被人们感知、表示、呈现、存储或传输的载体不同，ITU（International Telecommunication
    Union，国际电信联盟）建议将媒体分为下列5类：感觉媒体、表示媒体、表现媒体、存储媒体和传输媒体。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_365_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_365_1.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_365_2.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_365_3.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_365_4.png)


    - 感觉媒体：指直接作用于人的感觉器官，使人产生直接感觉的媒体。感觉媒体帮助人类来感知环境。

    - 表示媒体：指传递感觉媒体的中介媒体，即用于数据交换的编码。如图形编码、文本编码和声音编码等。

    - 显示媒体：指把媒体信息显示出来。它通常分为两种，一种是输入类显示媒体，如键盘、鼠标、扫描仪、摄像机和话筒等；另一种是输出类显示媒体，如显示器、扬声器、打印机和绘图仪等。

    - 存储媒体：指用于存储表示媒体的物理介质，如磁带、磁盘、光盘等。

    - 传输媒体：指用来将表示媒体从一个地方传输到另外一个地方的物理介质，如电缆、光缆和微波等。


    #### 3. 多媒体


    多媒体（Multimedia），是由多种媒体复合而成的。实际上，多媒体不仅融合了文本、声音、图像、视频和动画等多种媒体信息，同时还包括计算机处理信息的多元化技术和手段。一般来说，“多媒体”指的是一个很大的领域，是和信息有关的所有技术与方法进一步发展的领域。因此，要对多媒体有更准确的理解，更多的是从它的关键特性去考虑。


    #### 多媒体的关键特性


    - 信息载体多样性

    - 交互性

    - 集成性


    #### 4. 多媒体技术


    多媒体技术就是利用计算机把文字、图形、图像、动画、声音及视频等媒体信息进行数字化，并将其整合在一定的交互式界面上，使计算机具有交互展示不同媒体形态的能力。它实际是一种信息处理技术，是把多媒体信息通过计算机进行数字化采集、获取、压缩/解压缩、编辑、存储等加工处理，再以单独或合成形式表现出来的一体化技术。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_369_0.png)


    #### 多媒体技术的特性


    - 多样性

    - 集成性

    - 交互性

    - 实时性

    - 非线性


    ![](img/60882d3e569e0db30f34a44fdc73ab49_370_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_370_1.png)


    ### 1.1.2 多媒体计算机系统


    多媒体计算机系统是指具有多媒体信息处理能力的计算机系统。它主要由多媒体硬件系统和多媒体软件系统组成。


    #### 1. 多媒体硬件系统


    - 多媒体计算机硬件系统、多媒体存储、音频接口、视频接口、多媒体I/O设备等。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_372_0.png)


    #### （1）多媒体计算机硬件系统


    多媒体计算机系统需要交互式地综合处理图、文、声、像等媒体信息，不仅处理的数据量大，而且处理速度要求也较高。因此，多媒体计算机系统要求具有功能强大、速度快的主机，有足够大的存储空间，有高分辨率的显示接口和显示设备，还需要音频、视频处理设备、各种媒体输入/输出设备等。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_373_0.png)


    #### （3）音频卡


    - 处理音频信号的PC插卡是音频卡（Audio Card），又称声音卡，是多媒体技术中最基本的组成部分，是实现声波/数字信号相互转换的一种硬件。

    - **主要性能指标**：采样频率、采样位、声道数


    ![](img/60882d3e569e0db30f34a44fdc73ab49_375_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_375_1.png)


    #### （4）视频卡


    - 电脑通过视频卡对模拟视频信号进行采集、量化处理成数字信号，然后压缩编码成数字视频。大多数视频卡都具备硬件压缩的功能。

    - **主要性能指标**：接口、分辨率、帧速率、功能选择


    ![](img/60882d3e569e0db30f34a44fdc73ab49_376_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_376_1.png)


    #### （5）多媒体信息I/O设备


    - 多媒体计算机在处理信息时，首先必须通过各种信息获取设备将数字、字符、图形、图像和视频等信息转换成计算机能够识别的数字形式存入到计算机存储器中，然后经过计算机软件进行有效的处理，变成如编辑好的文稿、设计好的工程图纸、处理过的图像、计算得到的数据等。

    - 信息获取设备除了我们经常使用的键盘以外，还有数字笔、触摸屏、扫描仪、数码相机、数码摄像机等。

    - 常用的输出设备有以显示器为核心的显示设备、可以为长期保存结果服务的打印机、绘图仪、以及用来输出美妙声音的语音输出系统等。


    #### 2. 多媒体软件系统


    - 多媒体软件系统按功能可分为系统软件、支持软件和应用软件三部分。

    - 系统软件：是多媒体系统的核心，它一方面要控制各种媒体硬件设备协调地工作，如多媒体操作系统；另一方面提供具有综合使用各种媒体、灵活调度多媒体数据进行媒体传输和处理的能力，如多媒体设备驱动程序。

    - 多媒体支持工具软件指多媒体开发工具，通常包括多媒体素材准备软件、多媒体著作工具软件和多媒体编程语言等。

    - 多媒体应用软件是在多媒体硬件平台上设计开发的面向应用的软件系统。


    ### 1.1.3 多媒体信息处理技术


    - 数据压缩技术

    - 音频处理技术

    - 视频处理技术


    ![](img/60882d3e569e0db30f34a44fdc73ab49_379_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_379_1.png)


    #### 1. 数据压缩技术


    - 数字化的视频信号和音频信号的数据量是非常大的。如果不进行处理，计算机系统对它进行存取和交换的代价太大。

    - 视频、图像和声音这些媒体确实又具有很大的压缩潜力，数据的冗余度很大。

    - 因此，在允许一定限度失真的前提下，能够对图像数据进行压缩。


    #### （1）数据冗余的类型


    - 空间冗余

    - 时间冗余

    - 信息熵冗余

    - 视觉冗余

    - 听觉冗余

    - 其他冗余


    #### （2）数据压缩方法分类


    - 针对多媒体数据冗余类型的不同，相应地有不同的压缩方法。

    - 根据解码后数据与原始数据是否完全一致进行分类，压缩方法可以被分为有失真编码和无失真编码两大类。

    - 在此基础上根据编码原理进行分类，大致有：预测编码、变换编码、统计编码、分析—合成编码、混合编码和其他一些编码方法。

