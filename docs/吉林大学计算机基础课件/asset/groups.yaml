  - '[PAGE 256]


    # 三、单元格在公式中使用与引用


    +   ① 相对地址引用：

    +   公式中的相对单元格引用（如 A1）是基于包含公式和单元格引用的单元格的相对位置。如果公式所在单元格的位置改变，引用也随之改变。


    +   ② 绝对地址引用：

    +   公式中的绝对单元格引用（如 $A$1）总是是在特定位置引用单元格。如果公式所在单元格的位置改变，绝对引用将保持不变。


    +   ③ 混合地址引用：

    +   混合引用具有绝对列和相对行或绝对行和相对列。绝对引用列采用 $A1、$B1 等形式。绝对引用行采用 A$1、B$1 等形式。


    +   ④ 三维引用样式：

    +   三维引用可以分析同一工作簿中多个工作表上相同单元格或单元格区域中的数据。


    =SUM(Sheet2:Sheet13!B5) 将计算 B5 单元格内包含的所有值的和，单元格取值范围是从工作表 2 到工作表 13。'
  - "[PAGE 257]\n\n# 四、函数的结构\n\nExcel中函数的结构以等号“=”开始，后面紧跟函数名称和在括号，然后以逗号分隔输入该函数的参数列表，最后是右括号。例如：“=SUN（3，6，A2：B4）”。\n\
    \n# 五、输入函数\n\n+   ① 鼠标左键双击要使用函数的单元格，在单元格中按照函数的结构输入函数。\n+   \n+   ② 选择要使用函数的单元格→单击“编辑栏”上的“插入函数”按钮→“插入函数”对话框→选择函数的名称→设置函数的参数。\n\
    +   \n+   图插入函数对话框\n+   \n+   ③ 左键单击“编辑组”→“求和按钮”右边小箭头→选择“其他函数”→“插入函数”对话框进行选择。\n\
