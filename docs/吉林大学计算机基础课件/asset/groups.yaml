    # 3.5 公式与函数


    # 一、计算运算符：算术、比较、文本连接、引用


    | 类型 | 符号 | 含义 | 示例 |

    |---|---|---|---|

    | 算术运算符 | +（加号） | 加法 | 3+3 |

    |  | -（减号） | 减法/负数 | 3-1/-1 |

    |  | *（星号） | 乘法 | 3*3 |

    |  | /（正斜杠） | 除法 | 3/3 |

    |  | %（百分号） | 百分比 | 20% |

    |  | ^（脱字符） | 乘幂 | 3^2 |

    | 比较运算符（结果为 TRUE 或 FALSE。） | =（等号） | 等于 | A1=B1 |

    |  | >（大于号） | 大于 | A1>B1 |

    |  | <（小于号） | 小于 | A1<B1 |

    |  | >=（大于等于号） | 大于或等于 | A1>=B1 |

    |  | <=（小于等于号） | 小于或等于 | A1<=B1 |

    |  | <>（不等于） | 不等于 | A1<>B1 |

    | 文本运算符 | &（与号） | 将两个值连接或串起来产生一个连续的文本值 | "North"&"wind" |

    | 引用运算符 | :（冒号） | 区域运算符，生成对两个引用之间所有单元格的引用 | B5:B15 |

    |  | ,（逗号） | 联合运算符，将多个引用合并为一个引用 | SUM(B5:B15, D5:D15) |

    |  | （空格） | 交集运算符，生成对两个引用中共同的单元格的引用 | B7:D7 C6:C8 |'
