    # 国家标准汉字交换码


    “中华人民共和国国家标准信息交换汉字编码” GB2312—80，这种编码又称为国码。在国码的字符集中共收录了一级汉字3 755个，二级汉字3 008个，图形符号682个，三项字符总计7445个。


    # 汉字的输入码


    汉字的编码类型主要有：数字编码、拼音码、音形结合码和字形码等类型。目前使用得比较多的有区位码、五笔字型码、拼音码、自然码和智能ABC码。


    # 汉字的点阵码


    汉字的点阵码，就是汉字点阵字形的代码。存储在介质中的全部汉字的点阵码又称为字库。'
