  - '[PAGE 19]


    # 执行一条指令的五个基本操作


    +   - 取指令：从存储器某个地址单元中取出要执行的指令送到CPU内部的指令寄存器暂存；

    +   - 分析指令：或称指令译码，把保存在指令寄存器中的指令送到指令译码器，译出该指令对应的微操作信号，控制各个部件的操作；

    +   - 取操作数：如果需要，发出取数据命令，到存储器取出所需的操作数；

    +   - 执行指令：根据指令译码，向各个部件发出相应控制信号，完成指令规定的各种操作；

    +   - 保存结果：如果需要保存计算结果，则把结果保存到指定的存储器单元中。'
