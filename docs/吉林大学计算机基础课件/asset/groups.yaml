    \n## 第9章 常用工具软件\n\n- 本章介绍几种常用工具软件的使用方法。\n- 首先是系统软件类工具，包括：BIOS设置、Ghost系统备份与恢复。然后是系统安全类工具，包括：金山毒霸杀毒软件和360系统急救箱。还包括教育学习类工具，包括：Adobe\
    \ Acrobat和金山词霸。最后介绍了WinRAR和DAEMON虚拟光驱软件的使用方法。\n\n## 导言\n\n- 娱乐和学习\n- 如何使用计算机帮助学习？\n\
    - 如何保证计算机正常工作？\n\n## 9.1.1 BIOS设置\n\n- BIOS全称Basic Input Output System，即基本输入输出系统，负责计算机开机时对系统的各种硬件设备进行检测和初始化，确保计算机能正常工作。\n\
    - BIOS程序固化在计算机主板的BIOS存储芯片中，断电后程序不会消失，现有的BIOS芯片都采用EEPROM（电可擦除可编程只读存储器）或Flash ROM。\n\
    \n## BIOS程序\n\n- BIOS程序自身保存有主板厂商预先定义好的计算机运行参数，用户可以通过BIOS程序进行参数设置，也可以直接使用BIOS芯片中预定义参数，设置的参数都保存于主板上的CMOS（Complementary\
    \ Metal-Oxide-Semiconductor Transistor，互补金属氧化物半导体）芯片中，所以也就有了CMOS设置和BIOS设置两种说法。\n\
    \n## BIOS设置程序\n\n当计算机启动时，根据屏幕提示按Del键或F2键进入BIOS设置程序。Award 的BIOS设置程序如图9.1所示。\n\n\
    ![](img/60882d3e569e0db30f34a44fdc73ab49_418_0.png)\n\n## 设置选项\n\n- 1. Standard\
    \ CMOS Features（标准CMOS设置）\n- 2. Advanced BIOS Features（高级BIOS特性设置）\n- 3. Integrated\
    \ Peripherals（接口设备设置）\n- 4. Frequency/Voltage Control（频率/电压控制）\n- 5. Load Standard\
    \ Defaults（加载BIOS缺省参数）\n- 6. Load Optimized Defaults（加载优化参数）\n- 7. Set Supervisor\
    \ Password（设置超级用户密码）\n- 8. Set User Password（设置普通用户密码）\n- 9. Save & Exit Setup（保存并退出）\n\
    - 10. Exit Without Saving（不保存退出）\n\n## 9.1.2 Ghost系统备份与恢复\n\n- Ghost（General Hardware\
    \ Oriented System Transfer，面向通用型硬件系统传送器）又名Norton Ghost（诺顿克隆精灵），是美国赛门铁克公司旗下的一款出色的硬盘备份还原工具。\n\
    - Ghost可以实现多种硬盘分区格式的分区及硬盘的数据备份还原，具有操作简单、效率高等优点，广泛用于在Windows和DOS操作系统下数据备份和恢复，相关软件如“一键还原精灵”和“MAXDOS”等，都是以Ghost为基础进行的二次软件开发，使系统备份还原更简便。\n\
    \n## Ghost选项\n\n- 1） Local（本地）：完成本机硬盘或分区的数据备份和恢复。\n- 2） Peer to peer（点对点）：完成在网络环境下，两台计算机之间的数据传输和恢复。\n\
    - 3） GhostCast（网络广播）：完成在网络环境下，对多台计算机进行数据传输和恢复。\n- 4） Options（选项）：完成数据备份和恢复操作时相关选项的设定。\n\
    - 5） Help（帮助）\n- 6） Quit（退出）\n\n## 快速测试\n\n1. 目前市场上BIOS厂商主要有____和____，当计算机启动时，根据屏幕提示按____键或____键进入BIOS设置程序。\n\
    2. GHOST可以对硬盘数据进行____和____，日常使用时操作对象为____分区。\n\n## 9.2 信息安全类\n\n- 计算机病毒自诞生以来，给成千上万的用户和企业带来了相当大的困扰和损失。常见的恶意程序，包含病毒、蠕虫、木马、流氓软件、垃圾邮件，在Internet上肆虐横行，掌握信息安全软件，是保证正常学习和工作的重要手段。\n\
    - 本节简要叙述了金山毒霸杀毒软件和360系统急救箱的使用，在大多数情况下，可以有效阻止恶意程序的传播、恢复崩溃混乱的操作系统，从而保证计算机系统能健壮地持续运行。\n\
    \n## 9.2.1 金山毒霸杀毒软件\n\n- 金山毒霸是金山网络旗下研发的云安全智扫反病毒软件。融合了启发式搜索、代码分析、虚拟机查毒等经业界证明成熟可靠的反病毒技术，使其在查杀病毒种类、查杀病毒速度、未知病毒防治等多方面达到世界先进水平，同时金山毒霸具有病毒防火墙实时监控、压缩文件查毒、查杀电子邮件病毒等多项先进的功能，为个人用户和企事业单位提供完善的反病毒解决方案。\n\
    - 从2010年11月起，金山毒霸个人简体中文版的杀毒功能和升级服务永久免费。\n\n## 三点重要事项\n\n- 1) 全盘扫描：安装后最好能将硬盘所有数据进行扫描，清除计算机中潜伏的病毒。\n\
    - 2) 及时升级病毒库：Internet上的病毒千变万化，每天都有新的病毒变种，为及时获取最新的病毒程序特征代码库，最好开启自动升级功能，及时更新病毒库。\n\
    - 3) 不要随意关闭杀毒软件：过于依赖杀毒软件的智能判断功能，容易引起对正常文件的误杀，多数杀毒软件在进行未知程序判断时，将决定权交由用户。\n\n##\
    \ 9.2.2 360系统急救箱\n\n- 360系统急救箱以前又称“顽固木马专杀大全”，是强力查杀木马病毒的系统救援工具，对各类流行的顽固木马查杀效果较好。在计算机需要紧急救援、普通杀毒软件查杀无效，或是电脑感染木马导致杀毒软件无法安装和启动的情况下，360系统急救箱能够强力清除木马和可疑程序，并修复被感染的系统文件，抑制木马再生，是计算机需要急救时强力工具。\n\
    \n## 快速测试\n\n1. 当网络上爆发最新的病毒攻击，用户需及时对杀毒软件进行________。\n2. 安装杀毒软件后，需要注意三个重要点：\n \
