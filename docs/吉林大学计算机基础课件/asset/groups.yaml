    \n## 2.6 总线\n\n- 总线（bus）是连接两个或多个设备的通信通路。其关键特征是共享传输介质。若将主板比作一座城市，则总线就是其中的公共汽车（bus），能按照固定行车路线，传输来回不停运作的二进制位（bit）。\n\
    - 多个设备连接到总线上，并且任何一个设备发出的信号可以被其它所有连接到总线上的设备所接收。如果两个设备同时发送，它们的信号将会重叠，这样会引起混淆。因此，每次只能有一个设备能够成功地利用总线发送数据。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_67_0.png)\n\n## 总线\n\n总线是微机中各功能部件之间通信的信息通路，主要由地址、数据和控制三大总线组成，每种总线都由若干根信号线（总线宽度）构成。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_68_0.png)\n\n## 总线的分类\n\n- 数据总线DB（Data\
    \ Bus）。数据总线用来传输数据信息，是双向总线。\n- 地址总线AB（Address Bus）。地址总线用于传送CPU发出的地址信息，是单向总线。目的是指明与CPU交换信息的内存单元或I/O设备。\n\
    - 控制总线CB（Control Bus）。控制总线用来传送控制信号、时序信号和状态信息等，其中有的是CPU向内存和外设发出的信息，有的则是内存或外设向CPU发出的信息。\n\
    \n## 系统总线标准\n\n- ISA：工业标准体系(Industry Standard Architecture)，它是最早出现的微型计算机总线标准，应用在IBM的AT机上。直到现在，微型计算机主板或工作站主板上还保留有少量的ISA扩展槽。\n\
    - EISA：扩展工业标准体系(Extended Industry Standard Architecture)，主要用于286微机。EISA对ISA完全兼容。\n\
    - PCI：外围设备互联(Peripheral Component Interconnection)，PCI局部总线是高性能的32位或64位总线，它是专门为高集成度的外围部件，扩充插板和处理器/存储器系统而设计的互连机制。\n\
    - AGP：是一种新型的视频接口的技术标准，专用于连接主存和图形存储器。AGP总线宽32位，时钟频率66MHz，能以133MHz工作，最高的传输速率可达533Mbps。\n\
