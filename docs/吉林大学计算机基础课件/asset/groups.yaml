    # 微机结构示意图


    ![](img/60882d3e569e0db30f34a44fdc73ab49_49_0.png)


    微机的硬件由CPU、存储器、输入/输出设备构成；

    输入/输出设备通过I/O接口与系统相连；

    各部件通过总线连接。'
  - '[PAGE 50]


    # 2.2 中央处理器


    +   - 中央处理器，是计算机的主要设备之一。其功能主要是解释计算机指令以及处理计算机软件中的数据。


    +   - 20世纪70年代以前，由多个独立单元构成，自从1970年第一款微处理器Intel 4004以来，微处理器CPU将复杂的电路可以做成单一微小功能强大的单元。'
  - '[PAGE 51]


    # CPU


    CPU由运算器和控制器组成，分别由运算电路和控制电路实现，CPU与系统总线的关系及CPU的内部结构。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_51_0.png)'
  - '[PAGE 52]


    # 运算器


    +   - 运算器是对数据进行运算的部件，它能快速地对数据进行加、减、乘、除等基本算术运算以及“与”、“或”、“非”等逻辑运算。在运算过程中，运算器不断得到由存储器提供的数据，运算后把结果（含中间结果）送回存储器保存起来。运算过程是在控制器统一指挥下，按程序中编排的操作次序进行的。

    +   - 运算器主要由算术逻辑单元（arithmetic logic unit，简称ALU）、寄存器（包括通用寄存器、暂存寄存器、标志寄存器等）以及一些控制数据传送的电路组成。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_52_0.png)'
  - '[PAGE 53]


    # 控制器


    +   - 控制器（control unit，简称CU）是计算机的控制中心，计算机的工作就是在控制器的控制下有条不紊地协调进行的。控制器通过地址访问内存储器，逐条取出选中单元的指令，然后分析指令，并根据指令产生相应的控制信号作用于其他部件，控制这些部件完成指令所要求的操作。上述过程周而复始，保证了计算机能自动、连续地工作。

    +   - 控制器主要由程序计数器（program counter，简称PC）、指令寄存器（instruction register，简称IR）、指令译码器（instruction
    decoder，简称ID）、时序电路及操作控制器等电路组成。'
  - '[PAGE 54]


    # CPU的性能指标


    +   - 反映CPU品质的最重要指标是主频和数据传送的位数。

    +   - 主频说明了CPU的工作速度，主频越高，CPU的运算速度越快。

    +   - CPU传送数据的位数是指计算机在同一时间能同时并行传送的二进制信息位数。通常所说的32位机和64位机，是指该计算机中的CPU可以同时处理32位和64位的二进制数据。

    +   - 双核处理器是在中央处理器芯片或封装中包含两个处理器核心，一般共用二级缓存。另也有3核、4核处理器、8核处理器等。

    +   - 目前市场上个人计算机的微处理器主要是Intel系列和AMD系列。'
  - '[PAGE 55]


    ![](img/60882d3e569e0db30f34a44fdc73ab49_55_0.png)


    # 快速测试


    +   1. CPU包括哪些组成部分？

    +   2. CPU主要包括哪些性能指标？

    +   3. 控制器中的PC、IR寄存器是用来做什么？'
  - '[PAGE 56]


    # 2.3 存储器


    +   - 计算机系统的一个重要特征是具有极强的“记忆”能力，能够把大量计算机程序和数据存储起来。存储器是计算机系统内最主要的记忆装置，既能接收计算机内的信息（数据和程序），又能保存信息，还可以根据命令读取已保存的信息。

    +   - 存储器按功能可分为内存储器（简称内存或主存）和外部存储器（简称外存或辅存）。

    +   - 内存直接与CPU相连，可由CPU直接读写信息，是CPU能根据地址线直接寻址的储空间。它一般用来存放正在执行的程序或正在处理的数据。'
  - '[PAGE 57]


    # 存储器与存储系统


    存储器是一种具有保存和存取信息（程序、数据）的设备/器件，是计算机系统不可或缺的资源。


    现代微型计算机的存储系统结构：

    高速缓存—主存—外存

    为什么采用这种结构？

    指令执行速度依赖于内存读写速度

    高速CPU需配置高速内存

    大软件需配置大容量内存


    高速度

    大容量

    矛盾

    低成本


    ![](img/60882d3e569e0db30f34a44fdc73ab49_57_0.png)'
  - '[PAGE 58]


    # 随机存储器


    +   半导体存储器可分为随机存储器和只读存储器。随机存取存储器（Random Access Memory，简称RAM），其特点是可以读写，存取任一单元所需的时间相同，通电是存储器内的内容可以保持，断电后，存储的内容立即消失。


    +   RAM可分为动态（Dynamic RAM）和静态（Static RAM）两大类。


    +   动态随机存储器DRAM是用MOS电路和电容作存储元件。由于电容会放电，所以需要定时充电以维持存储内容的正确，如相隔2ms刷新一次，因此称这为动态存储器。


    +   静态随机存储器SRAM是用双极型电路或MOS电路的触发器作存储元件，它没有电容放电造成的刷新问题。只要有电源正常供电，触发器就能稳定地存储数据。


    +   DRAM的特点是集成密度高，主要用于大容量存储器。SRAM的特点是存取速度快，主要用于缓冲存储器。'
  - '[PAGE 59]


    # ROM


    +   - ROM是只读存储器（Read Only Memory），它只能读出原有的内容，不能由用户再写入新内容。

    +     - ROM可分为可编程（Programmable）ROM

    +     - 可擦除可编程（Erasable Programmable）ROM

    +     - 电擦除可编程（Electrically Erasable Programmable）ROM。


    +   - RAM是随机存取存储器（Random Access Memory），其特点是可以读写，存取任一单元所需的时间相同，通电时存储器中的内容可以保持，断电后，存储的内容立即消失。

    +   - RAM可分为动态（DRAM, Dynamic RAM）和静态（SRAM, Static RAM）两大类。'
