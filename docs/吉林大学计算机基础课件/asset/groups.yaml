    \ ACROBAT和词典软件金山词霸，为学生学习打好软件基础。\n\n## 9.3.1 Adobe Acrobat\n\n- ADOBE公司是著名的图形、图像软件公司，其公司产品Adobe\
    \ Photoshop在图像处理领域独霸一方。由Adobe公司推出的PDF（Portable Document Format，便携式文档格式）是一种全新的电子文档格式，由于该格式使用Adobe公司开发的PostScript页面描述语言，使得页面中的文字和图形的质量得到质的飞跃。\n\
    \n## Acrobat Professional\n\n- Acrobat Professional对PDF文档提供了丰富的功能，常用的有：\n- 1）书签：阅读长篇文章时，书签功能使用户可以快速定位上次阅读中断位置。\n\
