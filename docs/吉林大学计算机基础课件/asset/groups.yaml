    # 第1章 计算机概述


    ![](img/60882d3e569e0db30f34a44fdc73ab49_0_0.png)'
  - '[PAGE 1]


    # 1.1 计算机的来源


    +   - 计算机（Computer），全称电子计算机，又称电脑，是一种利用电子学原理根据一系列指令来对数据进行处理的机器。

    +   - 计算机是20世纪最重要的发明之一，它深刻地影响了我们的生活，改变了我们的社会。它是人类进入信息时代的重要标志之一。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_1_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_1_1.png)'
  - '[PAGE 2]


    # ENIAC与ABC计算机


    +   - 世界上第一台现代电子计算机 “ENIAC”（发音：/ˈɛni.æk/，是电子数字积分计算机的简称，英文全称为Electronic Numerical
    Integrator And Computer），诞生于1946年2月14日的美国宾夕法尼亚大学。

    +   - ENIAC是宾夕法尼亚大学的约翰·莫齐利和J·Presper·埃克特构思和设计的。莫齐利对于ENIAC的设计思想部分来源于约翰·阿塔纳索夫和克利福德·贝尔设计的ABC计算机。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_2_0.png)'
  - '[PAGE 3]


    # “存储程序”(Stored-program)思想


    +   - 被称为计算机之父的是美籍匈牙利数学家冯•诺依曼（Von Neumann），他和他的同事们研制了世界上第二台电子计算机EDVAC，对后来的计算机在体系结构和工作原理上具有重大影响。

    +   - 在EDVAC中采用了“存储程序”的概念，以此概念为基础的各类计算机统称为冯•诺依曼机。

    +   - 冯•诺依曼自己也承认，他的关于计算机“存储程序”的想法都来自图灵。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_3_0.png)'
  - '[PAGE 4]


    # 计算机科学之父-图灵


    +   - 英国数学家艾兰·图灵（Alan Mathison Turing, 1912-1954）是世界上公认的计算机科学奠基人。


    +   - 他的主要贡献有两个：一是建立图灵机（TuhngMaChine, TM）模型，奠定了可计算理论的基础；二是提出图灵测试，阐述了机器智能的概念。


    +   - 为纪念图灵对计算机科学的贡献，美国计算机学会ACM在1966年创立了“图灵奖”，每年颁发给在计算机科学领域的领先研究人员，号称计算机业界和学术界的诺贝尔奖。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_4_0.png)


    图灵'
  - '[PAGE 5]


    # 图灵机


    计算机是使用相应的程序来完成任何设定好的任务。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_5_0.png)


    图灵机是一种思想模型，它由三部分组成：一个控制器，一条可以无限延伸的带子和一个在带子上左右移动的读写头。


    ![](img/60882d3e569e0db30f34a44fdc73ab49_5_1.png)'
  - '[PAGE 6]


    # 第一台电子计算机（ENIAC,1946）


    ![](img/60882d3e569e0db30f34a44fdc73ab49_6_0.png)


    +   - 5000次加法/秒

    +   - 体重28吨

    +   - 占地170m²

    +   - 18800只电子管

    +   - 1500个继电器

    +   - 功率150KW


    注：一说是约翰·阿塔诺索夫的ABC计算机'
  - '[PAGE 7]


    # 按所采用的电子器件划分


    +   - 第一代 (1946-50s) 电子管

    +   - 第二代 (1950s-60s) 晶体管

    +   - 第三代 (1960s-70s) 集成电路

    +   - 第四代 (1970s-) 超大规模集成电路


    ![](img/60882d3e569e0db30f34a44fdc73ab49_7_0.png)


    ![](img/60882d3e569e0db30f34a44fdc73ab49_7_1.png)


