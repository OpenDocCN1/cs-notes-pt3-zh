    \n## 第二章 Windows 7 操作系统\n\n- **本章内容：** 主要讲解Windows 7操作系统的基本操作、文件管理、控制面板了解附件中各种小程序的使用。\n\
    - **教学重点：**\n  - Windows 7的基本操作\n  - Windows 7的文件管理\n  - Windows 7的控制面板\n- **教学难点：**\n\
    \  - Windows 7的文件管理\n  - Windows 7的控制面板\n\n## 第二章 Windows 7 操作系统\n\n## 第一节：操作系统的概念\n\
    \n- 一、操作系统简介\n- 二、操作系统的功能及分类\n\n## 第一节 操作系统的概念\n\n## 一、操作系统简介\n\n## 1、操作系统的定义\n\
    \n操作系统 (Operation System, 简称OS) 是控制和管理计算机系统的硬件和软件资源，合理的组织计算机的工作流程，以充分发挥计算机系统的工作效率和方便用户充分有效地使用计算机资源的一种系统软件。是用户和计算机之间的接口。\n\
    \n## 2、操作系统的作用\n\n操作系统的主要作用如下：\n\n- (1) 管理系统中的各种硬件和软件资源;\n- (2) 为用户提供良好的工作界面。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_76_0.png)\n\n## 第一节 操作系统的概念\n\n一、操作系统简介\n\
    \n- 3、 操作系统的层次结构\n- (1) 硬件层\n- (2) 操作系统层\n- (3) 实用程序层\n- (4) 应用层\n- 4、 常见操作系统\n\
    - (1) DOS操作系统\n- (2) Windows 7系列操作系统\n- (3) Linux、 Unix操作系统\n\n## 第一节 操作系统的概念\n\
    \n## 二、操作系统的功能及分类\n\n## 1、操作系统的功能\n\n操作系统对计算机资源进行控制和管理的功能主要分为如下五个方面：\n\n- (1)\
    \ 处理机管理\n第一项工作：处理中断事件。\n第二项工作：处理器调度。\n- (2) 存储管理\n主要工作就是对内部存储器进行分配、保护和扩充，合理利用内存空间方便用户的使用。\n\
    \n## # 第一节 操作系统 的概念\n\n主要任务是管理各类外围设备，完成用户提出的 I/O请求，加快 I/O信息的传送速度，发挥 I/O设备的并行性，提高\
    \ I/O设备的利用率，以及提供各种设备的设备驱动程序和中断处理程序，为用户隐藏硬件细节，提供方便简单的设备使用方法。\n\n对用户文件和系统文件进行有效管理，实现按名存取；实现文件的共享、保护和保密，保证文件的安全性；并提供给用户一套能方便使用文件的操作和命令。\n\
    \n![](img/60882d3e569e0db30f34a44fdc73ab49_79_0.png)\n"
