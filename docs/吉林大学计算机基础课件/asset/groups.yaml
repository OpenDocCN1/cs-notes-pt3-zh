  - '[PAGE 81]


    # 第一节　操作系统的概念


    # 二、操作系统的功能及分类


    # ◆ 2、操作系统的分类


    根据操作系统使用的环境和对作业的处理方式不同，可将操作系统划分为以下几种：


    +   (1) 单用户操作系统


    单用户操作特征是一个计算机系统每次只能支持一个用户程序的执行。


    +   (2) 批处理操作系统


    批处理操作时系统工作方式是：用户将作业交给系统操作员，系统操作员将许多用户的作业组成一批作业，之后输入到计算机中，在系统中形成一个自动转换接的连续的作业流，然后启动操作系统，系统自动、依次执行每个作业。最后由操作员将作业结果交给用户。'
  - '[PAGE 82]


    # 第一节 操作系统的概念


    # (3) 分时操作系统


    分时操作系统将CPU的时间划分成若干个片段，称为时间片。操作系统以时间片为单位，轮流为每个终端用户服务。每个用户轮流使用一个时间片而使每个用户并不感到有别的用户存在。分时系统具有多路性、交互性、独占性和及时性的特征。


    # (4) 实时系统


    实时系统主要分为两类：实时控制系统和实时处理系统。实时操作系统的主要特点在于有严格的时间限制，每个信息的接收、分析处理和发送过程必须在规定的时间范围内做出响应。在这种要求下操作系统的一些活动都必须在一个严格的时间控制程序下运行。实时系统应考虑的问题有实时时钟管理、连续人机对话、过载的防护、处理机调度策略、高可靠性等。'
  - '[PAGE 83]


    # 第一节 操作系统的概念


    # (5) 网络操作系统


    网络操作系统基于计算机网络的，是在各种计算机操作系统上按网络体系结构协议标准开发的软件，包括网络管理、通信、安全、资源共享和各种网络应用。


    # (6) 分布式操作系统


    分布式操作系统的资源分布于系统的不同计算机上，操作系统对用户的资源需求不能像一般的操作系统那样等待有资源时直接分配的简单做法而是要在系统的各台计算机上搜索，找到所需资源后才可进行分配。对于有些资源，如具有多个副本的文件，还必须考虑一致性。分布式操作系统的特点有系统状态的不精确性、控制机构的复杂性，以及通信开销引起的性能下降等。'
