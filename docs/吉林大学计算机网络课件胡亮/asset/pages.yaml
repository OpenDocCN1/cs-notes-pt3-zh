- pgno: 260
  md: '# 4.1.2 轮询/选择模式


    轮询(PoII)/选择(Select)模式的使用场合：


    +   - 多点连接系统。


    +   - 不仅仅要确定设备是否就绪，还要确定哪一个站点有权使用信道。'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 4.1.2 轮询/选择模式


    ①**工作方式**：主设备控制链路，主设备发命令，从设备响应。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_261_0.png)


    ②**地址问题**：在链路上的每个设备都有一个地址来标识自己。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 4.1.2 轮询/选择模式


    ③选择：


    +   - 主设备希望发送数据，用SeL告诉从设备准备接收数据。

    +   - 从设备用ACK同意接收，用NAK拒绝接收。'
