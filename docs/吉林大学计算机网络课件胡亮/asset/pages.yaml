- pgno: 477
  md: '# 5.7.1 拥塞控制


    # ④控制拥塞的方法


    +   (1)预分配缓冲区：常用于虚电路技术中,虚电路的建立会通知该节点为此虚电路预留缓冲区。

    +   (2)丢弃包：节点上收到过多的包而来不及处理或无法发出去时，可丢弃一部分包。

    +   (3)限制网内包数量:限制进入网内的包的数目,达到控制拥塞的目的。可以在网内设置若干个许可证。

    +   (4)流量控制:接收端调节发送端发送数据的速率,防止到达接收端的数据速率超过接收端的处理速率。

    +   (5)阻塞包:每个节点都监视其所有输出链路的使用情况。'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# 5.7.2 流量控制


    流量控制可在如下层次上进行：


    主机-主机间、源节点-目的节点间、主机—源节点间、相邻节点间


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_478_0.png)'
