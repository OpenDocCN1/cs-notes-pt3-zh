- pgno: 320
  md: '# 4.3.2 HDL帧格式


    # （1）标志字段


    +   - 标志字段为一个字节（8位），其比特模式为 **01111110**；

    +   - 表示一个帧的开始和结束，并且为接收方提供同步手段。'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 4.3.2 HDLC帧格式


    # 位填充法


    +   - 发送方发送一个含有五个以上连续1的数据时，它总是在第五个1后面插入一个冗余的0。不管第六个比特是0还是1。


    +   - 接收方接收时作相反的动作(去掉5个1后面的零。'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 4.3.2 HDLC帧格式


    例如：


    要发送的序列是01111101111110，发送时变成：


    0111110 0 111110 10'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 4.3.2 HDLC帧格式


    # （2）地址字段


    +   - 该字段是指从站地址，或者是以从站方式运行的复合站地址。


    +   - 如果帧是由主站发送的，则地址表示接收该帧的从站地址。


    +   - 如果帧是由从站发送的，则地址表示发送该帧的从站地址。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 4.3.2 HDLC帧格式


    # 地址字段的扩展


    +   - 根据网络的规模，地址字段可以有1个或几个字节的长度，如果地址字段只有一个字节，该字节最后一位比特总是1。

    +   - 如果地址字段有多个字节，除最后一个字节外其他所有字节都要以0结尾，最后一个字节要以1结尾。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_324_0.png)'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# # 4.3.2 HDLC帧格式


    # ## （3）控制字段


    +   - 控制字段是用来进行流量管理的。根据控制字段的内容，可以知道一个帧的类型。


    +   - 如果控制字段的第一个比特是0，该帧就是一个信息帧。


    +   - 如果控制字段的前两个比特是10，该帧就是一个监管帧。


    +   - 如果控制字段的前两个比特是11，该帧就是一个无编号帧。'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# ## 4.3.2 HDLC帧格式


    # ### I-帧的控制字段


    | 0 | N(S) | P/F | N(R) |

    |---|---|---|---|


    +   - 控制字段的第一位为0，它是I帧的标志。

    +   - 第2、3、4位是N(S)位，是当前发送帧的编号。

    +   - 第5位是P/F位，P/F(这里是F)表示是否还有要发送的帧，如果P/F=0，表示还有要发送的帧；如果P/F=1，表示没有要发送的帧，发送结束。

    +   - 第6、7、8位是N(R)位，N(R)是期望收到的帧编号。'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 4.3.2 HDLC帧格式


    # • S-帧的控制字段


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_327_0.png)


    +   00,接受就绪帧(RR)

    +   01,接受未就绪帧(RNR)

    +   10,拒绝帧(REJ)

    +   11,选择拒绝帧(SREJ)'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 4.3.2 HDLC帧格式


    +   当不能在一个I-帧上捎带确认信息时，例如它没有数据信息可发时，就要用S-帧来对收到的数据帧进行应答。


    +   N(R) 就是期望收到的帧的编号，它是一个应答域。


    +   同I-帧中的N(R) 一样，如果最近一帧是正确的，N(R)域将是序列中下一帧的序号；如果最近一帧是错误的，N(R) 域是这个损坏帧的序号。'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 4.3.2 HDLC帧格式


    # U-帧的控制字段


    五位编码


    +   U-帧中的P/F位一般都应置1。


    +   其实，无论是I-帧、U-帧、还是S-帧，P/F位置1的数据帧和命令帧都是要立即进行响应的帧。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_329_0.png)'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 4.3.2 HDLC帧格式


    # （4）信息字段


    +   S-帧中没有信息字段。I-帧的信息字段是用户数据信息。U-帧中的信息字段是链路管理信息。


    +   把发送信息和控制信息结合到一帧中的技术称为捎带确认。'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 4.3.2 HDLC帧格式


    # （5）帧校验序列字段


    +   帧校验序列是HDLC协议的错误检测字段。


    +   它含有一个两字节或一个四字节的循环冗余校验(CRC)码。'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# # 4.3.3 监控帧的使用方式


    +   - S-帧尽管没有信息字段，但是每一帧都给接收方带去了某种信息。这些信息的含义需要通过S-帧的类型和传输上下文来获得。

    +   - 共有四类S-帧：

    +     1. 接收就绪（RR）帧

    +     2. 接收未就绪（RNR）帧

    +     3. 拒绝（REJ）帧

    +     4. 选择拒绝（SREJ）帧'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 4.3.3 监控帧的使用方式


    # ①接收就绪（RR）帧（有四种使用方式）：


    +   ■ 应答（ACK）：接收站本身没有数据信息发送时，用一个接收就绪帧作为应答帧来对所接收的数据帧进行应答。（P/F=0）


    +   ■ 查询：主站点询问从站点是否有数据发送，（P/F=1，POLL）。


    +   ■ 对查询的否定应答：从站点用一个P/F位置1的RR帧回答主站点的查询，通知主站点从站点没有数据发送。如果从站点有数据发送，从站点用I-帧来响应查询。（POLL.
    NAK）


    +   ■ 对选择的肯定应答：如果从站点收到了主站点的选择帧，并且从站点准备好从主站接收数据，它用一个P/F位置1的RR帧回答主站点的选择。（SEL. ACK）'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 4.3.3 监控帧的使用方式


    # ②接收未就绪（RNR）帧（有三种使用方式）：


    +   - 应答（ACK）：接收方向发送方返回的RNR帧有两个意思。第一个意思是应答，表示接收方收到了编号在N(R)以前的所有帧。第二个意思是要求发送方暂停发送，直到发送方收到一个RR帧为止。（P/F=0）


    +   - 选择：当主站点想要向某个从站点发送数据时，它通过发送一个P/F位置1的RNR帧来通知从站点。（SEL）


    +   - 对选择的否定应答：当选择的从设备不能接收数据时，它回答一个P/F置1的RNR帧。（SEL. NAK）'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 4.3.3 监控帧的使用方式


    # ③拒绝（REJ）帧


    +   在回退N自动重复请求中，当接收方没有要发送的数据用来捎带应答信息时，返回的一个否定应答帧。


    +   在REJ帧中，N(R)域指明了损坏帧的序号。


    +   损坏帧及其以后所有帧必须重发。'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# # 4.3.3 监控帧的使用方式


    # ## ④选择拒绝（SREJ）帧


    +   - 在选择拒绝自动重复请求中，当接收方收到一个损坏帧时，它用一个选择拒绝帧告诉发送方哪一帧被损坏。


    +   - N(R) 指明了被损坏帧的编号。


    +   - 被损坏的帧需要重发。'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# # 4.3.4 无编号帧的种类及意义


    +   - 无编号帧是用来在互连设备之间交换会话管理信息和控制信息的。


    +   - 无编号帧的控制字段中有5位编码位，这5个编码位可用来表示32种不同类型的无编号帧。'
  merge: -1
  img_proc: true
- pgno: 338
  md: '| 编码 | 名称 | 性质 | 意义 |

    |---|---|---|---|

    | 00 001 | SNRM | 命令 | 设置正常响应模式。 |

    | 11 011 | SNRME | 命令 | 设置扩展正常响应模式。 |

    | 11 000 | SARM | 命令 | 设置异步响应模式。 |

    | 11 010 | SARME | 命令 | 设置扩展异步响应模式。 |

    | 11 100 | SABM | 命令 | 设置异步平衡模式。 |

    | 11 110 | SABME | 命令 | 设置扩展异步平衡模式。 |

    | 00 100 | UP | 命令 | 无序号轮询。从指定站发来的关于对状态信息的轮询。 |

    | 00 000 | UI | 命令/响应 | 无序号信息。通常用来发送状态信息，一般是在UP或SIM信号后发送。 |

    | 00 110 | UA | 响应 | 无序号确认。通常用来确认刚才发送的命令，如设置模式和断开连接。 |

    | 00 010 | RD | 响应 | 请求断开连接。 |

    | 00 010 | DISC | 命令 | 断开连接。初始化两个站之间的断连。当另外一个站用一个UA响应时，断连结束。 |

    | 11 000 | DM | 响应 | 断开连接方式。告诉主站，从站处于断连状态。 |

    | 10 000 | RIM | 响应 | 请求初始化模式。从站请求主站发送一个SIM。 |

    | 10 000 | SIM | 命令 | 设置初始化模式。命令其它的站初始化它们的数据链路控制功能。 |

    | 11 001 | RSET | 命令 | 重启动。 |

    | 11 101 | XID | 命令/响应 | 交换标示。允许两个站交换它们的标示和状态信息。 |

    | 10 001 | FRMR | 响应 | 帧拒绝。通常被用于一个U-帧出现了同步错误。 |'
  merge: -1
