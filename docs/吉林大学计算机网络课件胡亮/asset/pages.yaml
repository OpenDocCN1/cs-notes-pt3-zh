- pgno: 93
  md: '# 网络互连设备-网桥


    网桥是一种存储转发设备。从协议的层次上看，网桥同时作用在OSI的物理层和数据链路层。


    网桥在数据链路层进行数据帧的存储和转发。由于网桥在数据链路层工作，识别物理地址，所以网桥具备寻址功能。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_93_0.png)


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_93_1.png)'
