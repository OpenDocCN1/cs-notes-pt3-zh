- pgno: 8
  md: '# An overview of Computer Network


    – The history about internet


    | 1971 / 1972 | ARPANET has 15 sites, 23 hosts; **FTP** is outlined in 1972; **E-mail**
    is created in 1972 by Ray Tomlinson of BBN, most popular software; **Telnet**
    protocol is proposed in his year. |

    | 1974 | Vinton Cerf, ..., propose the Transmission Control Protocol(**TCP**)
    in the paper, “A Protocol for Packet Network **Internetworking**”, which introduce
    the term **Internet**. |

    | 1977 | The first **wireless** gateway is connected to ARPANET, which transmits
    packet over radio waves. |

    | 1978 | Vinton Cerf, ..., launch the plan for Internet Protocol(**IP**), which
    is proposed as a routing function that is separated from TCP. |

    | 1982 | **TCP and IP** are adopted as the main protocol suite for ARPANET |'
  merge: -1
  img_proc: true
