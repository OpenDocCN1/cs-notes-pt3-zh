- pgno: 10
  md: '# 计算机网络的定义


    # 计算机网络


    +   - 广泛的定义：利用通信设备和线路将地理位置不同的、功能独立的多个计算机系统连接起来，以功能完善的网络软件实现网络的资源共享和信息传递的系统。


    +   - Andrew S. Tanenbaum和David J. Wetherall编著的《计算机网络》一书中定义：“大量互相独立但彼此连接的计算机共同完成计算任务”。


    +   - 连接在网络上的计算机称为主机(host)。'
  merge: -1
  img_proc: true
