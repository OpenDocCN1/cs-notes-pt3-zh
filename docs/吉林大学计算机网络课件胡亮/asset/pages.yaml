- pgno: 448
  md: '# Dijkstra算法总结




    设N表示网络节点集合,先令N={1},对所有不在N中的节点写出:


    S(V) = \begin{cases} L(1,V) ;若节点V与节点1相邻 \\ \infty ;若节点V与节点1不相邻 \end{cases}'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# # Dijkstra算法总结


    ②找出一个不在N中的节点W，使S(W)值为最小，把W加入N中，然后对所有不在N中的节点按下式更新：


    S(V)←min[S(V),S(W)+L(W,V)]


    ③重复步骤(2),直到所有的网络节点都在N中为止。'
  merge: -1
  img_proc: true
