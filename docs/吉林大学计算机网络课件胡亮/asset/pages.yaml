- pgno: 51
  md: '# RFC文档


    +   所有关于Internet网络的正式标准都以RFC（Request for Comment）文档出版。出版的目的只是为了提供相关的信息。RFC文档的每一项都用一个数字来标识，例如RFC983，数字值越大说明RFC文档的内容越新。


    +   所有的RFC文档都可以网络上免费获得。


    +   http://www.cnpaf.net/


    +   中国协议分析网'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 1.5 实体间通信与服务


    在计算机网络中，每层的功能由该层的实体来实现，下层实体为上层实体提供服务。上层通过下层的服务完成自己的功能。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 1.5.1 层间通信与对等层间通信


    +   - 层间通信:同一节点上相邻层次的通信。

    +   - 对等层间通信：不同的网络节点上对等层间的通信。

    +   - 实通信：层间通信和物理层之间的通信

    +   - 虚通信：除物理层之外，对等层间的通信。'
  merge: -1
  img_proc: true
