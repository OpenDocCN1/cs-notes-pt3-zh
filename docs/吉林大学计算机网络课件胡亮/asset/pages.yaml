- pgno: 714
  md: '# ARP高速缓存


    +   - ARP高速运行的关键是由于每个主机上都有一个 **ARP高速缓存**。这个高速缓存存放了最近 Internet地址到硬件地址之间的映射。


    +   - 通过使用ARP高速缓存，可以在高速缓存中自动发现IP地址和硬件地址之间的映射，从而可以避免用广播方式发送ARP请求的开销，**提高效率**。


    +   - ARP高速缓存中的每一个映射地址项目都设置生存时间。'
  merge: -1
  img_proc: true
