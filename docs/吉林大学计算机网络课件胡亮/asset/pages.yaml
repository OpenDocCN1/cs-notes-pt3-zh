- pgno: 402
  md: '# # 5.3 路由选择策略


    +   - 路由选择就是网络中各个节点为到来的数据包选择一条输出链路。


    +   - 如果网络内部使用数据报，那么就必须为每个到来的包作一次路由选择。


    +   - 如果网络内部使用虚电路，则仅在建立一个虚电路时作一次路由选择，以后各数据包都按建立的路由传送。'
  merge: -1
  img_proc: true
