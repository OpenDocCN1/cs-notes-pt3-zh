- pgno: 844
  md: "# 并发服务器框架\n\n```\npid_t pid;\nint listenfd,connfd;\nlistenfd=Socket(...); \
    \ /*  create a socket  */\nBind(listenfd,...);\nListen(listenfd,LISTENQ); /* \
    \ listen from the socket  */\nFor(;;){\n    Connfd=Accept(listenfd,...);\n   \
    \ If((pid=Fork())==0){ /* create  a child process  */\n        Close(listenfd);\
    \  /*  child closes listening socket */\n        Doit(connfd);\n        Close(connfd);\n\
    \    Exit(0);   /*  child terminates  */\n}\nClose(connfd);  /*  parent closes\
    \ connected socket */\n}\n```"
  merge: -1
  img_proc: true
