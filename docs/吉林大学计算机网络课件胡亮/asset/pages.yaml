- pgno: 6
  md: '# An overview of Computer Network


    – The history about internet


    | 1966 | Terms, **packets** and **packet switching**, are coined out. A project
    is funded to create an experimental network. |

    | 1969 | FCC decides that the devices not created by AT&T can be attached to its
    telephone system.

    The project evolves into Advanced Research Projects Agency Network(ARPANET).

    The first **four** nodes of ARPANET are,

    BBN – Bolt Beranek and Newman, a small consulting company

    SRI – Stanford Research Institute

    The Univ. of California at Santa Barbara

    The Univ. of Utah |'
  merge: -1
  img_proc: true
