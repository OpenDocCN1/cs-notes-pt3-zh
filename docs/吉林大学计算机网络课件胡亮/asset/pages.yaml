  md: '# 4.2.2 滑动窗口协议


    窗口是发送方和接收方存放数据帧的缓冲区：


    +   - 发送方窗口用于存放已经发送但未收到应答的数据帧和在收到应答帧之前可以发送的数据帧。

    +   - 接收方窗口用于存放已经被接收但未给应答的数据帧。

    +   - 在接收方，只要窗口未填满就可以在未发送应答帧的情况下继续接收数据帧。'
