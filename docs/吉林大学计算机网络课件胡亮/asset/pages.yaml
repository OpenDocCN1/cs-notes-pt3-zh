- pgno: 253
  md: '# 数据链路层(Data-Link)


    +   - 数据链路层提供两个相邻的网络节点之间的可靠通信。

    +   - 数据链路层将不可靠的物理链路变为可靠的数据链路。


    +   - 数据链路层的主要工作:

    +     ① 线路规程：解决了“现在谁该发送”的问题。

    +     ② 差错控制：通常采用“校验-确认-重发”的模式来纠正错误。

    +     ③ 流量控制：调整在某段时间内可发送的数据量。


    数据链路层传输的数据单元是帧 (Frame) 。'
  merge: -1
  img_proc: true
