- pgno: 166
  md: '# 2.4.2 波分多路复用


    WDM(Wavelength Division Multiplexing)


    波分多路复用是利用多个激光器在单条光纤上同时发送多束不同波长激光的技术。


    它在一定的带宽上将输入的光信号调制到特定的频率上，然后将调制后的信号复用到一根光纤上。'
