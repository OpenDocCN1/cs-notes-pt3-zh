- pgno: 551
  md: '# 7.2.1 以太网访问模式


    +   - 在LAN中，多个用户在没有任何控制的情况下同时访问一条线路时，会存在由于不同信号叠加而相互破坏的情况,这就是冲突。为了使冲突发生的可能性最小，需要有一种机制来协调通信。


    +   - 以太网的媒体访问控制机制称为带有冲突检测的载波侦听多路访问(CSMA/CD)


    +   - CSMA/CD的发展： MA-> CSMA-> CSMA/CD'
  merge: -1
  img_proc: true
- pgno: 552
  md: '# CSMA/CD


    ① 多路访问(MA):不提供通信管制，“不听就说”


    ② 载波帧听多路访问(CSMA)：首先监听链路上是否已经存在通信。“先听后说”。由于存在传输延迟，还是会出现冲突'
  merge: -1
  img_proc: true
- pgno: 553
  md: <!-- no content -->
