- pgno: 464
  md: '# 5.6 虚电路中数据包的传输


    # 虚电路服务：


    +   - 网络层向传输层提供的一种使所有分组按顺序到达目的端系统的可靠的数据传送方式。也是通信子网向端系统提供的网络服务。

    +   - 提供这种虚电路服务的通信子网内部的实际操作可以是虚电路方式，也可以使数据报方式的。

    +   - 以虚电路方式工作的网络一般总是提供虚电路服务。'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# 5.6 虚电路中数据包的传输


    +   - 以数据报方式工作的网络也可以提供虚电路服务，即通信子网内部结点按数据报方式交换数据，而与端系统相连接的网络结点则向端系统提供虚电路服务。


    +   - 对于端系统来说，它的网络层与网络结点间的通信仍像虚电路工作方式一样，先建立连接，再交换数据，最后拆除连接。


    +   - 实际上，每个分组在网络结点分成若干数据报，附上地址，以数据报的方式送到目的结点。目的结点再将数据报排序，送给端系统。从而满足虚电路服务的要求。'
  merge: -1
  img_proc: true
