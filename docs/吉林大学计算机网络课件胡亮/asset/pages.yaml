- pgno: 806
  md: '# 6.2.5 传输层拥塞控制


    TCP采用流量控制方法实现拥塞控制。


    在TCP协议中，每个被传送的字节都有一个序号。每个TCP报文在其报文头中有三个域：序号（SN）、确认号（AN）和窗口大小（W），这三个域与流量控制、差错控制和拥塞控制相关。


    TCP拥塞控制有4种算法：


    +   ① 慢启动

    +   ② 拥塞避免

    +   ③ 快速重传

    +   ④ 快速复位'
  merge: -1
  img_proc: true
- pgno: 807
  md: '# 6.2.5 传输层拥塞控制


    # 术语：


    +   (1) SMSS---发送端最大数据段尺寸


    +   (2) Rwnd---接收端窗口


    +   (3) Cwnd---拥塞窗口：一个TCP状态参量，代表着一个TCP允许发送的最大数据量。在任意一个给定的时刻，TCP不会发送序号大于最大确认序号、cwnd及rwnd三者中较小者的数据量。


    +   (4) Ssthresh---慢启动阈值:被用来确定是用慢启动算法还是用拥塞避免算法来控制数据传送，在传送开始时，或者在数据丢失之后使用慢启动算法来达到此目的。'
  merge: -1
  img_proc: true
- pgno: 808
  md: '# 6.2.5 传输层拥塞控制


    # ①慢启动：


    +   - 在慢启动期间，发送方将初始的cwnd设置为1个SMSS字节；

    +   - 在第1个超时周期内没有丢失报文的情况下，cwnd设置为2个SMSS字节；

    +   - 在第2个超时周期内没有丢失报文的情况下，cwnd设置为4个SMSS字节；

    +   - 在第3个超时周期内没有丢失报文的情况下，cwnd设置为8个SMSS字节；

    +   - 依此方式，cwnd按指数方式增长，直到cwnd超过ssthresh。'
  merge: -1
  img_proc: true
- pgno: 809
  md: '# 6.2.5 传输层拥塞控制


    # ②拥塞避免


    +   - 当cwnd超过ssthresh或者当cwnd大小达到ssthresh的大小，进入拥塞避免期间。

    +   - 在拥塞避免期间，在没有丢失报文的情况下，cwnd按线性方式增长，即每收到一个ACK，cwnd的大小增加1个SMSS字节。

    +   - 当检测到数据段丢失时，则将ssthresh设置为当前cwnd的一半，并重新开始慢启动算法。'
  merge: -1
  img_proc: true
- pgno: 810
  md: '# 慢启动和拥塞避免的工作过程


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_810_0.png)'
  merge: -1
