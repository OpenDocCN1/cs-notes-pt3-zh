- pgno: 677
  md: '# 8.2.2 IP报文格式


    （8）生存时间(8)： TTL字段设置了数据报可以经过的最多路由器数量。


    +   - 经过一个路由器，它的值就减去1。当该字段的值为0时，该数据报被丢弃。

    +   - 通常生存时间的起始值是32、64、128


    （9）协议字段(8)： IP数据报的上层携带的协议。


    +   - 一个IP数据报能封装来自诸如TCP(17)、UDP(6)、ICMP(1),IGMP(2)等较高层协议的数据。'
