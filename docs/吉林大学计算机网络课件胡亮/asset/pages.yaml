- pgno: 479
  md: '# 5.7.2 流量控制


    # ①主机和源节点间的流量控制


    主机和源节点间流量控制本质上是通过控制进入通信子网的信息量，从而防止整个网内的缓冲区产生拥塞。


    它所采用的方法主要有：


    +   (1) 停止等待流量控制

    +   (2) 缓冲区预约

    +   (3) 许可证方案。'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# 5.7.2 流量控制


    # ②源节点和目的节点之间的流量控制


    +   - 源节点和目的节点间的流量控制的任务，是和通信子网的工作方式紧密相关的。

    +   - 如果通信子网采用虚电路工作方式，该层流量控制的任务就比较轻。因为虚电路方式本身要求有基本的缓冲区，包沿固定路径传送，且包按顺序到达目的节点。

    +   - 如果通信子网采用数据报方式工作，而缓冲区分配采用先来先服务且全部分配的方法，则有可能产生存储转发死锁。'
  merge: -1
  img_proc: true
