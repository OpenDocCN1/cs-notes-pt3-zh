- pgno: 814
  md: '# 8.7 IPv6基础


    +   - Internet网络在飞速发展， 32比特的IP地址已经满足不了对IP地址的需求。另外，当前的路由结构没有层次结构，从而导致路由表的规模不断增加。

    +   - 许多组织和研究人员针对当前IP版本存在的问题提出了解决方法，以适应未来IP发展的要求，即IPv6。'
  merge: -1
  img_proc: true
