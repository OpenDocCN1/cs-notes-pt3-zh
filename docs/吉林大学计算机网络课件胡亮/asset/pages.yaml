- pgno: 373
  md: '# 4.4.3 第二层交换机


    # VLAN的好处主要有三个：


    +   端口的分隔。即便在同一个交换机上，处于不同VLAN的端口也是不能通信的。这样一个物理的交换机可以当作多个逻辑的交换机使用。


    +   网络的安全。不同VLAN不能直接通信，杜绝了广播信息的不安全性。


    +   灵活的管理。更改用户所属的网络不必换端口和连线，只更改软件配置就可以了。'
  merge: -1
  img_proc: true
