- pgno: 625
  md: '+   - 每个信元携带的虚通路标示符(VPI)和虚通道标示符(VCI)就是用来识别路径的。

    +   - 在数据交换的过程中，路径本身是固定的，但是标识它的VPI和VCI在不同链路上是不同的。

    +   - VPI和VCI可以由网络管理者来赋予，以便来创建永久虚电路。

    +   - VPI和VCI也可以在传输开始前由信令过程动态分配。称为交换 VPI和VCI。'
  merge: -1
  img_proc: true
