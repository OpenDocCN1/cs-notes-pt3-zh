- pgno: 124
  md: '+   - 数字—>数字编码就是用数字信号来表示数字信息。

    +   - 在这种编码形式下，由计算机产生的0、1比特序列被转换成一串可以在导线上传输的脉冲电压(有两种电压值)。

    +   - 两种常见的数字—>数字编码方式：

    +     ①单极性编码

    +     ②极化编码'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 数字->数字编码


    ①单极性编码


    电压是单极性，高电平表示1、低电平表示0。缺点是有直流电平，要求带宽高，无法同步（需依赖附加线）。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 数字一>数字编码


    ②极化编码


    极化编码采用两个电压：一个正电压，一个负电压。通过使用两个电压，减轻了单极性编码中的直流分量问题。


    极化编码最常见的有三种：


    +   ① 非归零编码（NRZ）

    +   ② 归零编码(RZ)

    +   ③ 双相位码。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 非归零编码


    振幅


    1 0 1 0 0 0 1 0


    非归零电平编码


    振幅


    非归零反相编码


    > 下一比特为1, 发生电平翻转'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 双相位编码


    +   - 双相位编码中，信号在每比特间隙的中间发生改变但并不归零，而是转为相反的一极。

    +   - 各比特中间的跳变可用于同步。

    +   - 双相位编码有两种方式:

    +     - 曼彻斯特编码

    +     - 差异曼彻斯特编码'
  merge: -1
