  md: "# # 5.4 基本的路由算法\n\n+   距离最短的路径是最佳路径\n\n+   距离最短的标准可以是费用最小、传输延迟最小、数据传输速率最大、可靠性最高、以及这些因素的一种组合。\n\
    \n+   有两种最常用的计算最短路径的方法：\n+   ① 距离向量路由  \n+   ② 链路状态路由"
