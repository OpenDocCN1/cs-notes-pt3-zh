- pgno: 119
  md: '# 几个相关的概念：


    +   - **比特间隙**：发送一比特所用时间。

    +   - **比特率**：每秒钟发送的比特数。 单位是Bps

    +   - **有效带宽**：数字信号是由多个频率信号的叠加而成，如果只传输有重要振幅分量的频率信号，而输出端能够以合理的精度恢复信号，则这个上限频率就是有效带宽。

    +   - **介质带宽**：传输介质只能传输某些频率范围内的信号。

    +   - **信道容量**：传输介质可以传输的最大比特率，依赖于编码技术。'
  merge: -1
  img_proc: true
- pgno: 120
