  md: '+   - PSK可以用更多的状态表示二进制位，是调制主要应用的技术。

    +   - 例如，用0相位代表00，用90相位表示01，用180相位代表10，用270相位表示11。这样每种相位的正弦信号可以表示两位二进制信息。'
