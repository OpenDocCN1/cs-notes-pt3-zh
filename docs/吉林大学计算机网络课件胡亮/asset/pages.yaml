- pgno: 382
  md: '# # 5.1 网络层功能和服务


    +   为了实现端到端的传递，网络层提供了两种主要功能：交换和路由


    +   交换和路由需要在原始数据包上附加源和目的地址，这些地址和数据链路层的上、下节点地址不同，网络层地址是信源和信宿。


    +   网络层提供任意两个网络节点的可靠通信。'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# # 5.1.1 网络层的功能


    +   - 信源到信宿的传输：将多条物理链路连接成一条传输路径。


    +   - 逻辑寻址：为了完成从信源到信宿的传输，在数据包的头部加入源地址和目的地址。


    +   - 路由：选择从一点到另一点发送数据包的最佳路经。'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# # 5.1.1 网络层的功能


    +   - 地址转换：将网络层地址翻译成对应的物理地址。


    +   - 复用：同一条物理线路同时传输多个设备间的数据


    +   - 流量和拥塞控制


    +   - 网络互连：解决网络互连的有关问题'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# # 5.1.2 面向连接的网络服务


    +   面向连接的网络服务为数据传输建立一条虚电路，这条电路在整个数据传输过程中都是有效的。


    +   属于这次数据传输过程的所有包都将按顺序沿着这条电路传输。'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# # 5.1.2 面向连接的网络服务


    面向连接的网络服务通过完成一次传输的过程：


    +   1. 发送者发送一个连接请求包


    +   2. 接收者使用一个连接确认包进行确认


    +   3. 发送者传输数据


    +   4. 发送者发送一个连接终止请求包


    +   5. 接收者使用一个连接终止包进行确认'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# # 5.1.2 面向连接的网络服务


    # ## 面向连接网络服务的优点：


    +   1. 允许一个协议包含全面的顺序、差错和流量控制。


    +   2. 允许在流量控制上使用滑动窗口。


    +   3. 数据包中使用了较少的协议控制信息，减少了额外开销。'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# # 5.1.2 面向连接的网络服务


    # ## 面向连接网络服务的缺点：


    +   1. 一旦连接建立以后，路由的灵活性就不存在了。如果一条链路发生阻塞或出现其他问题，后续的包不能使用其他的路径来替代。


    +   2. 它比面向非连接的网络服务速度低。在面向连接的网络服务中，包必须被检查、或者被确认、或者被重传。'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# # 5.1.3 面向无连接的网络服务


    +   - 在面向无连接的网络服务中，一次多包传输中，每个包被当作一个独立的单元。


    +   - 无连接协议不提供逻辑连接。


    +   - 发送者不需要提醒接收者有通信即将到来，它仅仅是发送数据。


    +   - 中间节点根据路由信息和报头地址选择路径。'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# # 5.1.3 面向无连接的网络服务


    # ## 面向非连接网络服务的优点：


    +   ① 如果可靠性和排序可由上层协议来处理的话，CLNS具有速度和开销方面的优势。


    +   ② 如果某一条路径发生阻塞或中断，包可以选择另一条路径。


    +   ③ 单个传输的各个片断可以通过不同的路径传输，从而达到最大的效率。'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# # 5.1.3 面向无连接的网络服务


    面向非连接网络服务的缺点：


    +   ① CLNS不可靠，无法保证数据包顺序到达。


    +   ② 每个包所需的开销较大，每个包必须携带完整的地址信息。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# 两种方式总结


    +   通信子网向端系统提供两种网络服务：

    +   ① 虚电路

    +   ② 数据报


    +   通信子网内部的工作也有虚电路和数据报方式。


    +   提供虚电路服务的通信子网内部的操作可以是虚电路方式、也可以是数据报方式。'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# # 两种方式总结


    +   以虚电路方式操作的网络一般总是提供虚电路服务。


    +   以数据报方式操作的网络也可以提供虚电路服务。


    +   即通信子网内部节点按数据报方式交换数据，而与端系统连接的网络节点向端系统提供虚电路服务。


    +   对于端系统来说，它的网络层与网络节点的通信像虚电路操作方式一样，先建立虚电路，再交换数据，最后拆除连接。


    +   每个分组被网络节点分成若干数据报，附上地址分送到目的地。例如：TCP/IP协议， IP协议是无连接的，但TCP协议是面向连接的。'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# # 两种方式总结


