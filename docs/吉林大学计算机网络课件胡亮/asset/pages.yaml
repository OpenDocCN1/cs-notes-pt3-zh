- pgno: 811
  md: '# 6.2.5 传输层拥塞控制


    # ③快速重传/快速恢复


    快速重传和快速恢复算法常按如下方式一起实现：


    +   (1) 当第三个重复ACK收到时，设置ssthresh=cwnd/2。


    +   (2) 重传丢失的数据段并设置cwnd=ssthresh+3*SMSS。这将人为地按已经离开网络的报文段数目和接收端缓冲数据量来扩充拥塞窗口。


    +   (3) 对每个接收到的附加的重复ACK，将cwnd增大SMSS字节。这将人为地扩充拥塞窗口以反映已经离开网络的附加数据段。


    +   (4) 发送一个数据段，如果cwnd和接收端的通知窗口的值允许的话。


    +   (5) 当下一个确认新数据的ACK到达时，设定cwnd值为ssthresh（步骤1设置的值）。这称作 “deflating”窗口。'
  merge: -1
  img_proc: true
- pgno: 812
  md: '# 6.2.5 传输层拥塞控制


    # 例题


    +   - 假定最大报文段长度是1KB，TCP拥塞窗口是18KB，并发生了超时事件。如果接着4个并发量传输都是成功的，那么该窗口将是多大？

    +   - 答：发生超时后，下一次传输的是1，接着是2，4，8个报文段。所以4次并发后的拥塞窗口是8KB。'
  merge: -1
  img_proc: true
