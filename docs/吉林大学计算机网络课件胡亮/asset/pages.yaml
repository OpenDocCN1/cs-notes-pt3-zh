  md: '# ARP协议的工作原理


    +   - ARP协议的请求包是以广播方式发送的。


    +   - 网段中的所有主机都会接收到这个包，如果一个主机的IP地址和ARP请求中的目的IP地址相同，该主机会对这个请求数据包作出ARP应答，将其MAC地址发送给源端。'
