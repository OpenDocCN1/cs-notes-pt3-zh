- pgno: 171
  md: '# 2.5 数据交换技术


    +   - 当存在多个通信设备时，如何使每两个设备之间能够通信问题。


    +   - 交换技术指使得没有物理链路直接连接的两个或多个设备之间能够通信的技术。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 2.5 数据交换技术


    传统的交换方式有三种：


    +   ① 电路交换 (Circuit Switch)

    +   ② 分组交换 (Packet Switch)

    +   ③ 报文交换 (Message Switch)


    随着交换技术的发展，出现了一些新的交换技术，例如ATM交换（也称信元交换）和帧中继等。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 2.5.1 电路交换


    电路交换是在两个设备之间创建一条临时的物理连接。所以我们可以把电路交换机看作是一个多路开关。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 2.5.1 电路交换


    电路交换的特点是在通信开始之前，要在两个通信设备之间建立起一条完全被通信双方所占用的物理通路。


    其过程包括以下三个步骤：


    +   ① 电路建立

    +   ② 数据传输

    +   ③ 电路拆除'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 电路交换举例


    +   - A 和 B 通话经过四个交换机

    +   - 通话在 A 到 B 的连接上进行


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 2.5.2 报文交换


    报文交换又称为存储转发。它的基本原理是在报文的传输过程中，由网络的中间节点将报文暂时存储起来，检查它的正确性和完整性，然后再发往下一个节点。


    +   - 缺点：在报文交换中，整个报文是作为一个整体来处理，由于报文较长，报文传输的延迟很大。


    +   - 报文交换技术已被淘汰。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 2.5.3 分组交换


    分组交换：较长的报文被分为较短的数据单元，然后每个数据单元被加上一些通信控制信息等内容，形成一个信息包(packet)。


    通信时以包为单位发送、存储和转发。信息包长度一般比报文短得多，因此可以在中间站点的主存队列中存储，而且只要信息包到达后就可以转发，而不必等待很长的报文全部到达。缩短了信息传输过程中的延迟时间。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# ▶分组交换与电路交换的比较：


    +   ① 共享传输链路，提高使用效率


    +   ② 有流量和拥塞控制，不会发生阻塞


    +   ③ 可工作于广播和多播的方式


    +   ④ 具有提供多种通信设备互联'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 2.5.3 分组交换


    分组交换有两种类型：数据报和虚电路


    +   ① 数据报

    +   - 在传输中每个包都将独立于其他包进行处理。任何一条链路可以同时为多对设备之间的通信服务。

    +   - 一次传输的数据报可能不是次序地到达目的地。重新排序的任务由传输层来完成。


    +   ② 虚电路

    +   - 在虚电路方法中，属于同一次通信的所有包之间的关系得以维持。路径是在数据传输的开始之前就被选定。

    +   - 和电路交换的区别是：虚电路可以同时为多个设备提供通信服务，而电路交换是独占的。'
  merge: -1
  img_proc: true
