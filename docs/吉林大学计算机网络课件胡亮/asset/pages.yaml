- pgno: 645
  md: '# 8.1 TCP/IP网络体系结构


    OSI/RM的制定具有十分重大的意义，但是由于TCP/IP协议得到普遍使用，所以在计算机网络领域一般认为TCP/IP是事实上的工业标准，在实际运行的系统中采用OSI模型的并不多。尽管如此，OSI模型仍然对建立计算机网络具有重要的指导意义。'
  merge: -1
  img_proc: true
- pgno: 646
  md: '# 8.1 TCP/IP网络体系结构


    +   - TCP/IP协议是世界上最大的计算机网络Internet运行的基础，是目前应用最广泛的网络通信协议。


    +   - TCP/IP协议由五层构成：物理层、数据链路层、网络层、传输层和应用层。


    +   - TCP/IP中的应用层可以等同于OSI的会话层、表示层和应用层的结合。'
  merge: -1
  img_proc: true
