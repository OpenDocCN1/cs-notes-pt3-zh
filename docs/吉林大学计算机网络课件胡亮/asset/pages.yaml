- pgno: 314
  md: '# 4.3 HDLC通信协议


    +   - 在面向比特的协议中，帧被看作一系列比特。

    +   - 面向比特协议的控制信息可以是一个或多个比特，面向比特的协议可以用较短的比特位表示较丰富的控制信息。

    +   - 面向比特的协议的另一个重要的优点是它不受任何编码系统的制约。

    +   - 1979年，ISO提出了高级数据链路控制(HDLC)协议。'
