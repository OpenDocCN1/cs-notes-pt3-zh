- pgno: 454
  md: '# # 5.5.2 内部网关路由选择协议


    +   OSPF (Open Shortest Path First)开放最短路径优先：1988年IETF开发了OSPF路由算法作为内部网关协议。


    +   OSPF路由协议是典型的链路状态路由协议，是互连网应用最广的路由协议。'
  merge: -1
