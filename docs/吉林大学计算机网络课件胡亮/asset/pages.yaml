- pgno: 32
  md: '# 1.4.1 网络协议和分层


    网络协议：通信双方必须遵守的规则、标准、约定。


    网络协议三要素：


    +   - 语法—数据与控制信息的结构或格式。如:数据的格式、电平等。

    +   - 语义—控制信息的功能及动作。

    +   - 时序—信息的同步,速度匹配。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.4.1 网络协议和分层


    +   体系结构：


    +   计算机网络的各个层次及其协议的集合称为体系结构。


    +   网络体系结构是抽象的，是对功能的精确描述。


    +   其功能的实现是具体的，是真正运行的硬件和软件。'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# 1.4.1 网络协议和分层\n\n+   网络协议分层的优点：\n+   \n+   ① 独立\n+   ② 灵活\n+   ③ 模块化\n+ \
    \  ④ 易于维护\n+   ⑤ 标准化\n\n+   网络协议分层的主要原则：\n+   \n+   ① 功能相近的分在一层\n+   ② 每层的功能明确\n\
    +   ③ 边界信息要尽量少"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 1.4.3 OSI参考模型


    国际标准化组织ISO于1984年制定了开放系统互连参考模型OSI。


    Note


    > ISO is the organization.

    > OSI is the model.


    模型的作用：解决网络之间不能兼容和不能通信的问题。


    模型的内容：分7个层次，每层解决一个问题，共同描述计算机通信的过程。'
  merge: -1
  img_proc: true
