- pgno: 98
  md: '# 1.7 计算机网络的性能


    计算机网络的主要性能参数：


    +   - 吞吐量 (throughput)

    +   - 信道利用率

    +   - 延迟时间'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 性能参数之一：吞吐量


    +   - 吞吐量 (throughput): 表示在单位时间内通过某个网络（或信道、接口）的数据量。

    +   - 吞吐量经常地用于对网络的一种测量，以便知道实际上到底有多少数据量能够通过网络。

    +   - 吞吐量受网络的带宽或网络的额定速率的限制。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 性能参数之二：信道利用率


    信道利用率：


    +   - 除去全部控制信息后的数据率与信道吞吐量之比；

    +   - 或发送数据的时间和信道被占用时间之比。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 性能参数


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_101_0.png)


    +   延迟时间：

    +   1. 排队时间：在发送队列中的等待时间；

    +   2. 访问延迟：等待信道空闲的时间；

    +   3. 发送时延：从发送数据帧的第一个比特算起，到该帧的最后一个比特发送完毕所需的时间。

    +   4. 传输延时：电磁波在信道中需要传播一定的距离而花费的时间。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_101_1.png)


    总时延 = 发送时延 + 传播时延 + 排队时延 + 访问时延。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 性能参数之三：延迟时间


    在结点 A 中产生访问时延和排队时延


    在发 送器产生传输时延 (即发 送时延)


    在链路上产生传播时延


    1011001 ...


    数据


    结点 A


    发 送器


    链路


    结点 B'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 例 题


    +   1. A、B主机距离100米，采用双绞线，计算从A到B的传播时间？

    +   解： 100m ÷ 200m/us=0.5us


    +   2. 主机的发送速率是10Mbps,要发送5000B的文件需要多长时间？

    +   解： 5000×8÷10Mbps=4ms'
  merge: -1
  img_proc: true
