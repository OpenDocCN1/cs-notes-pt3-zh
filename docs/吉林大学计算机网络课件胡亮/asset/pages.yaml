- pgno: 589
  md: '# 7.4.1 令牌环网


    +   - 每个站点只有在轮到自己发送的时候才能发送数据，同时轮到一次只能发送一帧数据。这种机制称为令牌传递。

    +   - 令牌是一个简单的帧，绕着环从一个站点传送到另外一个站点。环上的站点只有在拥有令牌的时候才能发送数据。

    +   - 物理层采用差分曼切斯特编码。'
  merge: -1
