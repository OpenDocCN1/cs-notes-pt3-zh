- pgno: 268
  md: '# 4.2 流量控制与差错控制


    流量控制是一组过程，这组过程是用来告诉发送方在等待接收方的确认信号之前最多可以传送多少数据。


    流量控制有两个要点：


    +   ① 数据流不能使接收方过载

    +   ② 接收方对数据进行确认'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 4.2 流量控制与差错控制


    +   - 差错控制主要指错误检测和重传方法。

    +   - 自动重复请求 (ARQ)：

    +     数据帧在传输中出现错误，接收方就返回一个否定应答帧 (NAK)，出错的帧就会被发送方重新传送。这个过程叫ARQ。'
