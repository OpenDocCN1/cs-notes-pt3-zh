- pgno: 455
  md: "# 5.5.2 内部网关路由选择协议\n\n# OSPF的SPF算法：\n\n+   - SPF算法是OSPF路由协议的基础。SPF算法有时也被称为Dijkstra算法。\n\
    \n+   - 在OSPF路由协议中，最短路径树的树干长度，称为OSPF的Cost，其算法为：\n+   \n+     Cost = 100×10⁶/链路带宽。"
  merge: -1
