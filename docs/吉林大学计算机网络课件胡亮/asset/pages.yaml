- pgno: 698
  md: '# CIDR(无类别域间路由)


    +   - CIDR是开发用于帮助减缓IP地址和路由表增大问题的一项技术。


    +   - CIDR (Classless Inter-Domain Routing, 无类域间路由) 的基本思想是取消IP地址的分类结构，将多个地址块聚合在一起生成一个更大的网络，以包含更多的主机。'
  merge: -1
  img_proc: true
- pgno: 699
  md: '# CIDR(无类别域间路由)


    CIDR支持路由聚合，能够将路由表中的许多路由条目合并为成更少的数目，因此可以限制路由器中路由表的增大，减少路由通告。从而提高整个因特网的性能。


    如果没采用CIDR，在1994和1995年，因特网的一个路由表的路由条目就会超过7万个项目，而使用了CIDR以后，在1996年一个路由表的项目数才3万多个。'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# CIDR(无类别域间路由)


    +   - CIDR，是将路由表中的条目汇总，如将多个C类地址汇总为一个B类地址。


    +   - VLSM，是将一个网划分为多个子网，充分利用网络资源。


    +   - 单直观的说就是，VLSM是把一个IP分成几个连续的IP网段；CIDR是把几个IP地址合并成一个IP在外网显示。'
  merge: -1
  img_proc: true
