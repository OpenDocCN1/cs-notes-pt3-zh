- pgno: 620
  md: '# ATM层信元报头格式


    +   - (GFC) 一般流量控制： 4比特的GFC域在UNI中提供了流量控制。

    +   - (VPI) 虚通路标识： VPI在UNI信元中是8位，而在NNI信元中是12位。

    +   - (VCI) 虚通道标识： VCI在UNI信元和在NNI信元中都是16位。'
