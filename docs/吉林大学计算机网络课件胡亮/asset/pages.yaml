- pgno: 409
  md: '# # 5.3.2 路由选择策略


    # ## (1)孤立的路由选择策略


    +   - 各节点只根据自己的状态决定路由选择，而不与其它节点交换信息。


    +   - 算法非常简单，但并不准确，使用此方法有时效率不高。'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 5.3.2 路由选择策略


    # (2)分布式路由选择策略


    +   每个节点有一个路由表，并周期性地从周围相邻的节点获得网络状态信息，同时，也将本节点做出的路由周期性地通知相邻的各节点。


    +   整个网络的路由选择经常处于动态变化之中。


    +   典型的算法有：RIP协议和OSPF协议。'
  merge: -1
  img_proc: true
- pgno: 411
  md: '# 5.3.2 路由选择策略


    # (3)集中式路由选择策略


    +   - 网络控制中心NCC负责全网状态信息的收集、路由计算、以及路由选择的实现。每个节点定期向网络控制中心报告一些状态信息。


    +   - 优点：各个节点不需要路由选择计算


    +   - 缺点：通信量大、可靠性差、网络的规模受到限制'
  merge: -1
