- pgno: 590
  md: '# 7.4.1 令牌环网


    ①令牌环网访问模式：令牌传递


    +   ■ 每当网络空闲时，它便传播一个令牌，令牌是一个简单的帧，它只有三个字节。


    +   ■ 这个令牌按顺序从一个NIC传送到另一个NIC，直到遇到一个需要发送数据的站点。'
  merge: -1
  img_proc: true
- pgno: 591
  md: '(a) 令牌在环中循环


    (b) A获得令牌，向D发送数据


    (c) D复制数据帧，然后将数据帧发回环中


    (d) 数据帧回到A，A释放令牌'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# 7.4.1 令牌环网


    当数据帧回到它的发送站点时，发送站点发现该帧的源地址和自己的地址相同，于是就检查该数据帧的最后一个域(帧状态域 FS)，如果该帧的最后一个域中的相关信息被设置，发送站点就明白这个帧已经被接收了。发送站点于是就丢弃该帧，同时将令牌释放回环里。'
  merge: -1
  img_proc: true
