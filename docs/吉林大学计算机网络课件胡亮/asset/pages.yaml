- pgno: 755
  md: '# IP多播


    +   - IP多播是指在IP网中将IP报文以尽力传送的形式发送到网络中的某个确定节点子集。这个子集称为多播组。

    +   - 基本思想：源主机只发送一份IP报文，其目的IP地址为IP多播地址，加入到该多播组的主机都可以接收到这个IP报文的拷贝。

    +   - IP多播技术有效地解决了单点发送多点接收的问题。'
  merge: -1
  img_proc: true
- pgno: 756
  md: '# IP多播的的概念性组成部分


    # 多播地址方法


    多播组用D类 IP地址 (224. 0. 0. 0~239. 255. 255. 255) 标识。


    IP首部协议字段值2 (IGMP)


    # 有效的通知和交付机制 (网际组管理协议)


    通知机制: 把自己参与的 多播组通知路由器


    交付机制: 路由器把多播分组传输给主机


    # 有效的网络间转发工具 (多播路由选择协议)


    有效: 希望沿最短路径发送多播分组


    动态: 允许主机任意参与或退出多播群组'
  merge: -1
  img_proc: true
