- pgno: 629
  md: '# 7.6 帧中继


    +   - X.25提供了广泛的差错和流量控制，这样大量的确认和响应信息的传送必然会占用大量的带宽。在早期的传输介质容易出错的情况下是必要的，但现在的传输介质的性能得到提高，像X.25协议中那样严格的差错和流量控制措施就是不必要的。'
  merge: -1
  img_proc: true
- pgno: 630
  md: 'X.25 是针对分组交换网而制定的国际标准。是对公用分组交换网接口的规约。以面向连接的虚电路服务为基础。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_630_0.png)'
  merge: -1
  img_proc: true
- pgno: 631
  md: +   - 今天的数字光纤网比早期的电话网具有低得多的误码率，如果减少节点对每个分组的处理时间，则各分组通过网络的时延亦可减少，同时节点对分组的处理能力也就增大了。
  merge: -1
  img_proc: true
- pgno: 632
  md: +   - 帧中继在操作处理上做了大量的简化。不需要考虑传输差错问题，其中间节点只做帧的转发操作，不需要执行接收确认和请求重发等操作，差错控制和流量均交由高层端系统完成，大大缩短了节点的时延，提高了网内数据的传输速率。
  merge: -1
  img_proc: true
- pgno: 633
  md: '# 7.6.1 帧中继的层次结构


    +   - 帧中继只包含物理层和数据链路层这两个层次。


    | 数据链路层 | 传统数据链路层的简单的核心功能 |

    | 物理层 | 支持可被ANSI识别的任何协议 |'
