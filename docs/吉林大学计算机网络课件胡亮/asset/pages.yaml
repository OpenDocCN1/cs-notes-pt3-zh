- pgno: 256
  md: '# 4.1 线路规程


    线路规程是监视链路的建立，以及在给定时刻分配一个具体设备进行数据传送的权利。


    线路规程可以两种方式实现：


    +   ① 询问/应答（ENQ/ACK）

    +   ② 轮询(Poll)/选择(Select)方式'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 4.1.1 询问/确认模式


    # ①询问/确认模式的使用场合：


    +   - 当两个设备之间存在一条专用链路时，即点对点方式，采用询问/确认模式。

    +   - 只要一条链路两头的设备级别相同，任意一个设备都可以启动一个会话过程。


    # ②询问/确认模式的工作方式


    +   - 启动方首先发送一个询问帧（ENQ）询问接收方是否可以接收数据。

    +   - 接收方如果已经准备好接收，回答一个确认帧（ACK）。如果没有准备好接收，回答一个否认（NAK）'
  merge: -1
  img_proc: true
- pgno: 258
