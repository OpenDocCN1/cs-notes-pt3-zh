- pgno: 774
  md: '# 端口号


    RFC1700 含有 一张由因特网已分配数值权威机构（IANA）定义的端口列表。端口号分成三段：


    +   众所周知的端口为 0—1023。这些端口由 IANA 分配和控制。可能时，相同端口号分配给 TCP 和 UDP 的同一给定服务。


    +   注册的端口（registered ports）为 1024—49151。这些端口不受 IANA 控制。但由 IANA 登记并提供它们的使用情况和清单。可能时，相同端口号分配给
    TCP 和 UDP 的同一给定服务。


    +   49152—65535 是动态的（dynamic）或私有的（private）端口。IANA 不管理这些端口，它们就是我们所说的临时端口。'
  merge: -1
  img_proc: true
- pgno: 775
  md: '# 8.5.1 UDP报头


