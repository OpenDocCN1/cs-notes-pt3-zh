- pgno: 121
  md: '+   - 1924 年，奈奎斯特 (Nyquist) 就推导出了著名的奈氏准则。

    +   - 奈奎斯特给出了无噪声 (理论状态) 情况下码元速率与信道带宽的关系：

    +     B=2×H

    +     其中：H是信道的带宽；

    +     与数据传输率的关系：

    +     C=2×H×log2^N'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - 香农（Shannon）定理：

    +     实际的信道总是要受到噪声的干扰，香农（Shannon）定理描述了有限带宽有随机热噪声信道的最大传输速率与信道带宽和信号噪声功率比之间的关系。

    +   - 香农定理的公式：

    +     C=H×log2(1+S/N)

    +     其中：H是信道带宽，S是平均信号功率，N是平均噪声功率，信噪比（S/N）通常用分贝（dB）表示，

    +   - 分贝数=10×log10（S/N）'
  merge: -1
  img_proc: true
