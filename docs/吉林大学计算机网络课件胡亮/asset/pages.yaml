- pgno: 404
  md: '# # 5.3.2 路由选择策略


    根据路由算法能否随网络的通信量或拓扑结构变化而进行调整来划分，路由选择算法可分为两大类：


    +   1. 非适应性路由选择算法


    +   2. 适应性路由选择算法'
  merge: -1
  img_proc: true
- pgno: 405
  md: "# # 5.3.2 路由选择策略\n\n# ## ①非适应性路由选择\n\n+   - 非适应性路由算法不能随网络的通信量变化而变化，但实现起来容易。\n\
    \n+   - 非适应性路由算法有以下几种方法：\n+     (1)洪泛(flooding)法  \n+     (2)有选择的洪泛法  \n+    \
    \ (3)固定路由法  \n+     (4)随机走动(random walk)法  \n+     (5)分散通信量法"
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # 5.3.2 路由选择策略


    (1)洪泛(flooding)法：某个节点收到一个包时，向所有与此节点相连的链路发送这个包。


    (2)有选择的洪泛法：满足事先确定的条件的链路上转发包。


    (3)固定路由法：按最短路径建立一个表，表上标明每个目的地址的包应当从哪条链路上转发。


    (4)随机走动(random walk)法：随机选择一条链路进行转发。'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# # 5.3.2 路由选择策略


    # ## (5)分散通信量法：


    +   - 每个节点上设置一个表，给出几个可采用的输出链路，并且对每条链路赋予一定的概率，此概率就是利用此链路进行转发的概率。


