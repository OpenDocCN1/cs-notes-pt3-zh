- pgno: 779
  md: '# UDP应用


    +   UDP适用于这样的进程，它需要简单的请求—响应通信，而较少考虑流量控制和差错控制。对于需要传送成块数据的进程，如FTP，则通常不使用UDP。


    +   UDP适用于具有内部流量控制和差错控制机制的进程。


    +   对多播和广播来说，UDP是个合适的运输协议。多播和广播能力已经嵌入在UDP软件中，但没有嵌入在TCP软件中。


    +   UDP可用于管理进程，如SNMP。


    +   UDP可用于某些路由选择更新协议，如路由信息协议（RIP协议）。'
  merge: -1
