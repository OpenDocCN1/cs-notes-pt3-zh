- pgno: 362
  md: '# 4.4.2 网桥路由算法


    # ③源路由网桥：


    +   由发送帧的源站点决定转发路由，而不是由网桥来决定。


    +   路由存储在帧中，由路由指示（Route Designator）序列组成，每个路由指示由一个局域网和一个网桥ID组成。


    | ...... | 目的地址 | ...... | 控制 | 第一个路由指示 | 第二个路由指示 | ...... | 最后一个路由指示 | ......
    |

    |---|---|---|---|---|---|---|---|---|


    控制=路由字段长度、路由类型、路由方向；


    路由指示=局域网号、网桥号'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# 4.4.2 网桥路由算法


    当一个网桥看见一个帧时，它就确定是否有一个路由指示，若有，该路由指示包含该网桥的ID和传输该帧的局域网的ID，网桥接收该帧并将它转发到下一个路由指示指定的局域网上。


    例如:假定A发送一个帧给B，并指定一个路由为L1:B5→L3:B4→L4。连接到L1的两个网桥B5和B6都见到了这个帧，但是在路由指示序列中，B5跟随着L1，所以只有B5接收这个帧，然后B5将这个帧转发给L3。'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# # 4.4.3 第二层交换机


    +   交换机从某一节点收到一个以太网帧后，立即在其内存中的地址表（端口号—MAC地址）进行查找，以确认该目的MAC的网卡连接在哪一个节点上，然后将该帧转发至该节点。


    +   每个端口有自己的带宽，各端口之间并行工作，这就大大提高了网络吞吐量。'
