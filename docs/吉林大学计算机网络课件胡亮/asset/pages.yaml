- pgno: 794
  md: '# TCP报文格式


    +   - TCP无法对一个报文段进行否认。


    +   - 例如，如果收到包含1025~2048字节的报文段，但它的检查和有错误，TCP接收端所能做的就是发回一个确认序号为1025的ACK。'
