- pgno: 651
  md: '# 8.2 网际协议IP


    +   - IP协议是TCP/IP协议族中的核心协议。所有的TCP、UDP、ICMP、IGMP数据都是以IP数据报格式传输。

    +   - IP协议为高层提供不可靠、无连接的数据报通信。'
  merge: -1
  img_proc: true
- pgno: 652
  md: '# 8.2 网际协议IP


    +   - IP协议提供的不可靠服务是指它不能保证IP数据报能成功地到达目的地。任何要求的可靠性必须由上层来提供。

    +   - 无连接是指IP协议并不维护任何关于后续数据报的状态信息。每个数据报的处理是相互独立的，IP数据报可以不按发送顺序接收。'
  merge: -1
  img_proc: true
- pgno: 653
  md: '# 8.2.1 IP地址


    +   - 网络中的每个独立主机的每个接口必须有一个唯一的 Internet 地址，也称为 IP 地址。


    +   - IP 地址长度为 32 位。表示地址空间是 2^32，或 4294967296（超过 40 亿个）。'
  merge: -1
  img_proc: true
- pgno: 654
  md: '# 8.2.1 IP地址


    IP地址的表示方法：


    +   - 二进制表示方法

    +   - 点分十进制表示方法

    +   - 十六进制表示方法。'
  merge: -1
  img_proc: true
- pgno: 655
  md: '# 8.2.1 IP地址


    # 二进制表示方法：


    +   在二进制表示方法中，用一个32位的比特序列表示IP地址，为了使这个地址有更好的可读性，通常在每个字节之间加上一个或多个空格做分隔。


    +   例如： 10000001 00001110 00000110 00011111'
  merge: -1
  img_proc: true
- pgno: 656
  md: '# 8.2.1 IP地址


    # 点分十进制表示方法：


    +   为了使32位地址更加简洁和更容易阅读，因特网的地址通常写成用小数点把各字节分隔开的形式。每个字节用一个十进制数表示，这个数小于256。


    +   例如： 129.14.6.31'
  merge: -1
  img_proc: true
- pgno: 657
  md: '# 8.2.1 IP地址


    # 十六进制表示方法


    +   ♦ 有时我们会见到十六进制表示方法的IP地址。每一个十六进制数字等效于4个位。


    +   ♦ 例如： 0X810E061F'
  merge: -1
  img_proc: true
- pgno: 658
  md: '# 8.2.1 IP地址


    IP地址的分类：


    IP地址按照层次结构划分成五类：A、B、C、D、E类。


    例如，某个系统是一个C类地址，它可以表示为：202.198.155.144'
