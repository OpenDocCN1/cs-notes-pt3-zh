- pgno: 669
  md: '# 8.2.2 IP报文格式


    （1）版本号(4)：目前IP协议的版本号为4；

    它正逐渐地被IPv6版本所替代。


    （2）报头长度(4)：报头长度指的是报头占32位的数量(一般是20字节, 即5行)。'
  merge: -1
  img_proc: true
- pgno: 670
  md: '# 8.2.2 IP报文格式


    （3）服务类型(8)： 4个比特的TOS分别表示：


    +   - 最小延迟

    +   - 最大吞吐量

    +   - 最高可靠性

    +   - 最小费用


    +   - 最新的RFC2474重新定义为区分服务；用来映射一个底层的服务。'
  merge: -1
  img_proc: true
- pgno: 671
  md: '# 8.2.2 IP报文格式


    （4）总长度(16):该字段以字节为单位定义IP数据报的总长度(首部加上数据)。


    （5）标识(16)：标识字段唯一地标识主机发送的每一个数据报。通常每发送一个报文，其值自动加1。


    +   如果数据包被分片以适应小型数据包的网络，那么每一个分片中都设置相同的标识号码。'
  merge: -1
  img_proc: true
- pgno: 672
  md: '# 8.2.2 IP报文格式


    (6)标志(3):


    +   - 第一位没有使用；

    +   - 第二位为DF位，该位被置1表示不要分段，它命令路由器不要将数据报分段，因为目的端不能重组分段；

    +   - 第3位是MF 位，该位被置1表示该分段后还有进一步的分段，最后一个分段MF位为0。


    D: 不分片

    M: 还有分片


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_672_0.png)'
  merge: -1
  img_proc: true
- pgno: 673
  md: '# 8.2.2 IP报文格式


    # （7）偏移量(13)：


    +   ◆ 分段偏移说明该分段在当前数据报的什么位置。


    +   ◆ 分段偏移以 8字节为单位，这样偏移量1对应字节号8，偏移量 2对应字节号16，依此类推。


    +   ◆ 数据报进行分片的主机或路由器必须选择每一个分片的长度能够被8除尽。'
  merge: -1
  img_proc: true
