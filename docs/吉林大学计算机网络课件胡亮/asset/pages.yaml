- pgno: 91
  md: '# 1.6 网络互连


    +   网络互连的根本目的是扩大资源的共享范围。


    +   网络互连主要有“局域网—局域网”、“局域网—广域网”、“广域网—广域网”等几种形式。


    +   网络互连设备被划分为四个大类：

    +   重发器

    +   网桥

    +   路由器

    +   网关


    这四类网络设备的每一种设备分别和OSI模型中不同层中的协议交互作用。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 网络互连设备-中继器 (repeater)


    中继器 (repeater)：通过放大信号,允许我们扩展网络的物理网段,中继器不以任何方式改变网络的功能。因而仅仅运行在OSI模型的物理层上。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_92_0.png)'
  merge: -1
