- pgno: 850
  md: '# Inetd超级服务员


    在典型的Unix/Linux系统中有很多服务器运行，等待用户的请求并进行相应的服务。在4.3BSD版本前的Unix系统中，这些服务都有一个与它对应的进程。这些进程在系统启动时从/etc/rc文件里启动，它们启动时所做的工作基本相同：创建套接口，给它捆绑到服务器的众所周知端口，等待连接（如果是TCP协议）或数据报（如果是UDP协议），然后执行fork。由fork产生的子进程为用户服务，父进程继续等待下一个用户请求。'
  merge: -1
  img_proc: true
- pgno: 851
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 852
  md: '# Inetd超级服务员


    4. 3BSD版本的Unix系统通过提供一个因特网超级服务器：inetd守护进程使这些问题得到简化。之所以称为超级服务器。是因为它能够处理多种网络服务。典型的FTP、Telnet、TFTP、Rlogin等服务都是由这个超级服务器来间接提供的。基于TCP或者UDP的服务器都可以使用这个守护进程。但它不处理其它的协议，如Unix域套接口。'
  merge: -1
  img_proc: true
- pgno: 853
  md: "# /etc/inetd.conf 例子\n\n```\nftp  stream tcp nowait\n  root /etc/ftpd  ftpd\n\
    \ntelnet stream tcp nowait\n  root /etc/telnetd\n  telnetd\n\nlogin  stream tcp\
    \ nowait\n  root /etc/rlogind rlogind\n\ntftp  dgram udp wait\n  nobody /etc/tftpd\
    \ tftp\n```\n\n| 字段 | 描述 |\n| --- | --- |\n| service_name | 必须在/etc/services中\
    \ |\n| socket_type | stream或dgram |\n| protocol | 必须在/etc/protocol（TCP或UDP）中 |\n\
    | wait_flag | Wait或nowait |\n| login_name | 取自/etc/passwd文件中，通常为root |\n| server_program\
    \ | 至exec的完整路径名 |\n| server_program_arguments | 最多五个变元 |"
  merge: -1
  img_proc: true
