    ④ 确认阶段： DHCP服务器收到DHCP客户端回答的DHCP request请求报文之后，它便向DHCP客户端发送一个包含它所提供的IP地址和其他设置的DHCP
    ack确认报文，告诉DHCP客户端可以使用它所提供的IP地址。'
