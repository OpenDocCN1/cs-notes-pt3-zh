  md: '# TCP报文格式


    +   - 例如，如果1～1024字节已经成功收到，下一个报文段中包含序号从2049 ～ 3072的字节，收端并不能确认这个新的报文段，它所能做的就是发回一个确认序号为1025的ACK。'
