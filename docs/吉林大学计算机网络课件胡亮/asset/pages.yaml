- pgno: 342
  md: '# 4.4 数据链路层网络互连


    +   - 网桥是数据链路层上的互连设备。从互连网络的结构上看，网桥属于DCE级的端到端的连接；从协议的层次上看，网桥同时作用在OSI的物理层和数据链路层。


    +   - 网桥在数据链路层上进行数据帧的存贮和转发。


    +   - 网桥常用于局域网的互连。


    +   - 网桥具有隔离通信、错误检测、帧格式转换、帧路由等数据链路层功能。'
  merge: -1
  img_proc: true
