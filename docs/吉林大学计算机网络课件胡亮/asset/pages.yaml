- pgno: 847
  md: '# 9.5 守护进程


    +   守护进程（daemon）是在系统后台运行不受终端控制的进程，只要系统没有关机或者崩溃，守护进程将在系统中不间断地运行。Unix系统中一般有很多守护进程（使用ps
    -ax命令可以看出）在后台运行（20到50个），执行不同的系统任务。


    +   为了保证守护进程正常地工作，必须使守护进程和其它进程运行的环境隔离开，避免由于其它进程的行为影响守护进程的工作。


    +   守护进程要脱离所有的终端的原因是因为守护进程可能是从终端上启动（与从初始化脚本中启动相反），在这之后这个终端可能执行其它的任务。'
  merge: -1
  img_proc: true
- pgno: 848
  md: "# 启动守护进程的方法\n\n+   1. 在系统启动时很多守护程序是由系统初始化脚本启动。这些脚本一般在/etc目录或者以/etc/rc开头的目录下，它们的位置和内容依赖于具体的实现。由这些脚本启动的守护进程在开始时拥有超级用户权限。例如，syslog守护进程、inetd守护进程、Web服务员守护进程等等。\n\
    +   \n+   2. 许多网络服务员是由inetd超级服务员启动的。inetd自身是由上一步中的某个脚本启动的。Inetd监听所有的网络请求，当请求到来时根据请求的类型启动实际的服务员（例如，收到一个FTP请求，inetd就启动一个FTP服务员）。\n\
    +   \n+   3. cron守护进程按规则定期执行一些程序，由它启动的程序也以守护进程的方式运行。cron自身是在系统启动过程中由第一步启动的。"
  merge: -1
  img_proc: true
- pgno: 849
  md: <!-- no content -->
  merge: -1
