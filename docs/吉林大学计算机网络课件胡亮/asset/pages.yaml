- pgno: 370
  md: '# # 两种典型的交换技术


    # ## 一、直通式（Cut Through）


    +   直通方式的以太网交换机可以理解为在各端口间是纵横交叉的线路矩阵电话交换机。


    +   它在输入端口检测到一个数据包时，检查该包的包头，获取包的目的地址，启动内部的动态查找表转换成相应的输出端口，在输入与输出交叉处接通，把数据包直通到相应的端口，实现交换功能。


    +   优点：由于不需要存储，延迟非常小、交换非常快。


    +   缺点：


    +   （1）因为数据包内容并没有被以太网交换机保存下来，所以无法检查所传送的数据包是否有误，不能提供错误检测能力。


    +   （2）由于没有缓存，不能将具有不同速率的输入/输出端口直接接通，而且容易丢包。'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# # 两种典型的交换技术


    # ## 二、存储转发（Store &amp; Forward）


    +   - 存储转发方式是计算机网络领域应用最为广泛的方式。


    +   - 它对输入端口的数据包进行检查，在对错误包处理后才取出数据包的目的地址，通过查找表转换成输出端口送出包。


    +   - 不足：存储转发方式在数据处理时延时大


    +   - 优点：


    +   - （1）它可以对进入交换机的数据包进行错误检测，有效地改善网络性能。


    +   - （2）它可以支持不同速度的端口间的转换，保持高速端口与低速端口间的协同工作。'
  merge: -1
  img_proc: true
