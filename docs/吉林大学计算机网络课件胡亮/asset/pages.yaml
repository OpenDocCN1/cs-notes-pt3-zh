- pgno: 896
  md: '# 10.3.2 FTP的主要命令


    +   - LIST---目录名列出子目录或文件

    +   - RETR---文件从服务器传送到客户

    +   - USER---用户信息

    +   - PASS---用户口令

    +   - QUIT---向系统注销

    +   - STOR---文件从客户传送到服务器'
  merge: -1
  img_proc: true
- pgno: 897
  md: '# 10.4 WEB服务


    万维网(World Wide Web)是一个分布式超文本系统。使Internet中不同计算机的文件相互链接。


    WEB服务器是指服务器及运行在服务器上运行的软件。'
  merge: -1
  img_proc: true
- pgno: 898
  md: '# 10.4.1 超文本


    +   - HTML (Hypertext Markup Language) 超文本标记语言，万维网文档发布和浏览的基本文件格式。

    +   - 特点：

    +   - (1) 独立于平台的格式

    +   - (2) 超文本： 允许文档之间漫游

    +   - (3) 结构化设计'
  merge: -1
  img_proc: true
- pgno: 899
  md: '# URL


    # 统一资源定位器(URL)


    标识网络上资源位置而设计的一种编址方式。一般由3部分组成：


    传输协议：//主机地址/路径和文件名'
  merge: -1
  img_proc: true
- pgno: 900
  md: '# 10.4.2 超文本传输协议


    HTTP (Hypertext Transfer Protocol) 超文本传输协议：


    +   - 协议以普通文本、超文本、音频、视频等格式传输数据。

    +   - HTTP在公认端口80上使用TCP服务'
  merge: -1
  img_proc: true
- pgno: 901
  md: '# 超文本传输协议HTTP


    +   - HTTP是典型的客户/服务器模式。客户是浏览器，服务是WWW服务器。

    +   - HTTP协议定义了这些报文的结构和交换的规范。

    +   - HTTP协议是无状态协议：不保留客户的状态

    +   - HTTP协议有持续连接和非持续连接。'
  merge: -1
  img_proc: true
