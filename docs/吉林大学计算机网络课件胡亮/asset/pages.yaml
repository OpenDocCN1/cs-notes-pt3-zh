- pgno: 39
  md: '# # 数据链路层(Data-Link)


    +   - 帧同步:传输的信息单位是帧(Frame)。

    +   - 差错控制:为上层提供可靠链路。

    +   - 流量控制:处理输入数据的速率。

    +   - 链路管理:链路的建立,维持,拆除。

    +   - 数据链路层处理相邻节点的数据传输,传输的数据单元是Frame。'
  merge: -1
  img_proc: true
