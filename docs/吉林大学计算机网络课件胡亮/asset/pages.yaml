- pgno: 187
  md: '# 2.6 错误检测和控制


    +   - **检错码**：给发送信息加上冗余位，使其具备检错功能。

    +   - **纠错码**：能纠正错误的冗余码。

    +   - **编码效率**：数据信息在整个发送信息的比重。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 2.6.1 奇偶校验码


    +   - **偶校验**：设m位数据单元b1b2b3…bm，则：

    +     r=b1+b2+b3…+bm

    +   - **奇校验**：设m位数据单元b1b2b3…bm，则：

    +     r=b1+b2+b3…+bm+1

    +   - 发送数据时，连同校验位r一起发送。接收方根据结果，判断是否发生差错。'
  merge: -1
  img_proc: true
