- pgno: 430
  md: '# ②Dijkstra算法计算路由表


    +   Dijkstra算法(1959)使用由节点和弧组成的图计算网络中两点之间的最短路径。


    +   节点有两种类型：网络和路由器。


    +   弧也有两类：路由器到网络的链路和网络到路由器的链路。


    +   在Dijkstra算法中，从路由器到网络的链路的费用有效，而从网络到路由器的链路的费用总是为0。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# ②Dijkstra算法计算路由表


    每个路由器在使用Dijkstra算法时，根据下面四个步骤来形成自己的最短路经树：


    (1)选择自己作为树的根，并将根标记为永久性节点，算法接着从根出发连接它的所有邻居节点，这种连接是临时性的。


    (2)算法比较所有的临时连接，找出费用最小的路径，这个路经上的所有弧和节点被标记为最短路经树上的永久部分。


    (3)算法考察链路状态数据库，找出从这个选定的最短路经向外延伸所能连接的所有非永久性节点，将这些节点临时性的加到最短路经树上。


    (4)如果所有的节点已经成为最短路经树上的永久部分，则算法结束，去掉非永久性的弧。否则，转步骤（2）继续执行。'
  merge: -1
  img_proc: true
