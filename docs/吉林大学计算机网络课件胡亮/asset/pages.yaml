- pgno: 889
  md: '# 10.3.1 FTP的工作原理


    +   - **FTP**是一个**客户机/服务器**系统。

    +   - 用户通过一个支持**FTP**协议的客户机程序，连接到在远程主机上的**FTP**服务器程序。

    +   - 用户通过客户机程序向服务器程序发出命令，服务器程序执行用户所发出的命令，并将执行的结果返回到客户机。'
  merge: -1
  img_proc: true
- pgno: 890
  md: '# FTP端口


    当FTP客户端与服务器建立FTP连接时，将与服务器上的两个端口建立联系：


    +   端口21: 控制端口


    +   端口20: 数据端口'
  merge: -1
  img_proc: true
- pgno: 891
  md: '# FTP工作方式


    FTP的两种工作方式：


    +   - 主动 (PORT) 模式

    +   - 被动 (PASV) 模式'
  merge: -1
  img_proc: true
- pgno: 892
  md: '# 主动模式


    客户端


    FTP服务器


    请求建立控制连接 Port:21


    接受请求


    控制连接


    我打开了9999端口，你来连接我


    好的，建立连接 Port:20


    数据连接'
  merge: -1
  img_proc: true
