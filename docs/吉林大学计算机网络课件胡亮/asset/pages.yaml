    +   - 4位首部长度：首部长度指出了首部中32 bit字的数目。正常的TCP首部长度是20字节


    +   - 6个标志字段：在TCP首部中有6个标志比特，U R G 紧急指针；A C K 确认序号；P S H 推标志；R S T 重建连接；S Y N 同步序号；F
    I N 结束标志'
  merge: -1
  img_proc: true
- pgno: 787
  md: '# TCP报文格式


    +   - 16位窗口：TCP协议可以表述为一个没有选择确认或否认的滑动窗口协议，它的窗口大小是可变的。

    +   - 16位检验和：检验和字段覆盖了TCP首部和TCP数据。

    +   - 16位紧急指针：紧急指针是一个正的偏移量，和序号字段中的值相加表示紧急数据最后一个字节的序号。'
  merge: -1
  img_proc: true
- pgno: 788
  md: '# # TCP标志位


    | 标志位 | 含义 |

    |---|---|

    | URG | 紧急指针有效 |

    | ACK | 确认号有效 |

    | PSH | 请求推送 |

    | RST | 连接复位 |

    | SYN | 同步 |

    | FIN | 终止连接 |


    | URG | ACK | PSH | RST | SYN | FIN |

    |---|---|---|---|---|---|

    |  | ✓ |  |  | ✓ | ✓ |


    +   - **SYN同步标志**：该标志仅在三次握手建立TCP连接时有效。

    +   - **ACK确认标志**：TCP报头内的确认编号栏内包含的确认编号为下一个预期的序列编号，同时提示远端系统已经成功接收所有数据。'
  merge: -1
  img_proc: true
- pgno: 789
  md: '# TCP标志位


    +   RST 复位标志 : 对当前通信会话的状态进行复位。


    +   URG紧急标志 : 表明发送设备有一些优先级更高的信息要发送。


    +   PSH推标志: 尽可能快将数据转由应用处理。


    +   FIN结束标志: 带有FIN标志的数据包表明发送设备要结束一个TCP会话。'
  merge: -1
  img_proc: true
- pgno: 790
  md: '# 确认序号


    +   • 在TCP连接中每个传输的字节都被计数，确认序号包含发送确认的一端所期望收到的下一个序号。因此，确认序号应当是上次已经成功收到数据字节序号加1。只有ACK标志为1时，确认序号字段才有效。'
  merge: -1
  img_proc: true
- pgno: 791
  md: '# 确认序号


    +   发送ACK无需任何代价，因为32bit的确认序号字段和ACK标志一样，总是TCP首部的一部分。因此，一旦一个 TCP连接建立起来，ACK标志总是被设置1。'
  merge: -1
  img_proc: true
