- pgno: 309
  md: '# 4.2.2 滑动窗口协议


    # ⑥滑动窗口协议中的回退N的效率


    +   正确传送一帧所需的平均时间为：

    +   $t_{V}=t_{I}+p t_{W}/(1-p)$


    +   系统最大吞吐量：

    +   $\lambda_{max}=1/\ t_{V}=(1-p)/(t_{I}(1+\ p\ (a-1)))$


    +   系统的传输效率：

    +   $\rho=(1-p)/(1+\ p\ (a-1))$

    +   (其中$a=t_{W}/t_{I}$)'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 4.2.2 滑动窗口协议


    例1：若数据帧的差错率为p=0.01，而a=4，则：


    （1）对于停止等待协议，有：

    ρ = (1-p)/a = 0.99/4


    （2）对于滑动窗口协议，则有：

    ρ = (1-p)/(1+(a-1)p) = 0.99/(1+3*0.01)

    = 0.96。


    可见，在此情况下，即使p高达0.01，滑动窗口协议也比停止等待协议好。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 4.2.2 滑动窗口协议


    例2：在一个广域网上，设p=0.01，数据帧长度为1200bit，线路速率为9.6kbps，设线路长度为160km，应答帧长为120bit，则：tI=125ms，
    tP=1ms， tS=12.5ms，所以：a=(tI+2tP+tS)/tI =139.5/125=1.12


    (1) 对于停止等待协议，有：

    ρ = (1-p)/a = 0.99/1.12 = 0.89


    (2) 对于滑动窗口协议，则有：

    ρ = (1-p)/(1+(a-1)p) = 0.989


    两者相差不明显。'
  merge: -1
  img_proc: true
