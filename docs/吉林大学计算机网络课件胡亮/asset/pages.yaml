- pgno: 595
  md: '# ① 数据帧


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |


    数据帧有九个域分别是：

    起始分界符SD、访问控制AC、帧控制FC、目的地址DA、源地址SA、LLC-PDU、CRC、结束分界符ED和帧状态FS。'
  merge: -1
  img_proc: true
- pgno: 596
  md: '起始分界符SD： SD是一个字节长，用来警告接收站点一个帧即将到来，SD的格式为 JK0JK000。


    +   - JK为违法码。

    +   - J:开始和比特中间没跳变。

    +   - K:比特中间没跳变。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    |---|---|---|---|---|---|---|---|---|

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 597
  md: '# 访问控制AC：


    AC域为一个字节长，其比特模式为PPPTMRRR。


    +   PPP是三位优先级；

    +   T是用来指明该帧是令牌帧还是数据帧；

    +   M是监控位，用来防止永久循环的帧在网中存在；

    +   RRR是预留位，由希望对下一个令牌作预留的站点来填写。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 598
  md: '帧控制FC：FC域为一个字节长，其中第一位是类型位,用来指明LLC-PDU域中的信息是数据信息还是控制信息。其他七位是特殊信息,包含了在令牌环逻辑中所使用的信息。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 599
  md: '+   目的地址DA：六个字节的DA域包含了帧的下一个目标的物理地址。


    +   源地址SA：SA为六个字节，包含了发送该帧的站点的物理地址。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 600
  md: '+   LLC—PDU：最大长度为4500字节。


    +   CRC：CRC域为4字节，包含CRC-32差错检测序列。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# # 结束分界符ED：

    ED域是第二个标记域，一个字节长，指定了发送者数据或控制信息的结束。其比特模式为JK1JK1IE。


    +   - E为错误检测位，任何中间站点检测到任何错误，就将该位置位。


    +   - I用于多帧传送中，使用，该位置表示还有后续的帧要传送，此帧不是最后一帧。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# 帧状态FS：帧的最后一个字节是FS域。其比特模式为ACrrACrr，其中r没有定义。


    A和C由接收者来设置，A被置位表示地址被识别，C被置位表示帧被接收者拷贝。


    | SD | AC | FC | 目的地址 | 源地址 | LLC-PDU | CRC | ED | FS |

    |---|---|---|---|---|---|---|---|---|

    | 1字节 | 1字节 | 1字节 | 6字节 | 6字节 | 小于4500字节 | 4字节 | 1字节 | 1字节 |'
  merge: -1
  img_proc: true
- pgno: 603
  md: '# ②令牌帧


    令牌帧只包含了三个域： SD、 AC、 ED。


    +   - SD指明帧即将到来;

    +   - AC除指明此帧是令牌之外，还包括一个优先级域和预留域。

    +   - ED域指明了帧的结束。'
  merge: -1
  img_proc: true
- pgno: 604
  md: '# ③异常终止帧


    异常终止帧只包含了起始和结束分界符: SD 和 ED 。


    +   - 发 送者产生，用于停止自己的传输；


    +   - 由监控站点产生，用来清除线路上传旧的传输。'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 7.4.3 FDDI


    +   - 光纤分布式数据接口（FDDI）是一个由 ANSI和ITU-T(ITU-T X.3)制定的标准化局域网协议。


    +   - FDDI支持100Mbps的数据速率。


    +   - FDDI采用环型拓扑结构。'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# FDDI编码机制


    # FDDI编码机制：


    FDDI使用一种特殊的编码机制，该机制称为4比特/5比特（4b/5b）编码。在这个系统中，数据的每4个比特先编码为5个比特，然后采用NRZ-I编码成信号，NRZ-I在这里使用1反转。'
  merge: -1
  img_proc: true
- pgno: 607
  md: <!-- no content -->
  merge: -1
  img_proc: true
