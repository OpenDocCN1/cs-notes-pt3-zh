- pgno: 37
  md: '# 物理层(Physical)


    功能：规定了机械的、电气的、功能的、规程的4个特性，负责如何将计算机连接到通信媒体上。


    +   机械特性：定义连接头、机械尺寸、通信媒体等。


    +   电气特性：信号电平,编码,数据传输率.


    +   功能特性：信号之间的关系,数据线,控制线等。


    +   规程特性：数据交换的控制步骤。


    物理层数据传输的单位是比特 (Bit)。'
  merge: -1
  img_proc: true
