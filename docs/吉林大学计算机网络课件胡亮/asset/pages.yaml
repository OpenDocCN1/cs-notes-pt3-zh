  md: '# 8.2.2 IP报文格式


    | 1 | 16 | 17 | 32 |

    |---|---|---|---|

    | 4位版本号 | 4位首部长度 | 8位服务类型 (TOS) | 16位总长度 (字节数) |

    | 16位标识 | 3位标志 | 13位片偏移 |

    | 8位生存时间 (TTL) | 8位协议标识 | 16位首部检验和 |

    | 32位源IP地址 |  |  |

