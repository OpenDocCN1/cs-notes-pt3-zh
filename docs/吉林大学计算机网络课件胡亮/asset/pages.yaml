- pgno: 192
  md: '# 2.6.2 循环校验码CRC


    发送方：


    +   ① 通信双方约定一个生成多项式G(x)，最高阶为m；例如：G(x)=X⁴+x³+1=11001，即m=4


    +   ② 设待发送的信息为U(x)；例：1101011


    +   ③ 用U(x)X⁴除以G(x)得4位余数R(x)；即在U(x)后面添m个零后除以G(x)。除法的规则是：1+1=0；1+0=1；0+0=0；0+1=1；没有借位。


    +   ④ 将R(x)放在U(x)之后得循环校验码。'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'x⁶ + x³ + x

    x⁴+x³+1 ) x¹⁰+x⁹ + x⁷ + x⁵+x⁴

    x¹⁰+x⁹ + x⁶

    x⁷+x⁶+x⁵+x⁴

    x⁷+x⁶ + x³

    x⁵+x⁴+x³

    x⁵+x⁴ + x

    x³ + x → 余式


    1001010

    11001 ) 11010110000

    11001

    00111

    00000

    01111

    00000

    11110

    11001

    01110

    00000

    11100

    11001

    01010

    00000

    1010 → 余数


    额外加上的0，其个数比除数位数少1


    将R(x)放在U(x)之后得循环校验码：11010111010'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 2.6.2 循环校验码CRC


    接收方：


    +   接收方用收到的数据除以生成多项式G(x)，如果结果为0，传输没有错误，否则，说明传输产生错误。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 2.6.3 校验和


    发送方：


    +   ① 在发送方，将要发送的整个数据单元分成大小都为n（一般为16）比特的若干段；

    +   ② 然后将这些分段采用反码加法算法加在一起，得到一个n比特长的结果；

    +   ③ 该结果取反后得到一个n比特长的检查和；

    +   ④ 将检查和当作冗余位加在原始数据单元的末尾，随原始数据单元一起发送给接收方。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 2.6.3 校验


    接收方：


    +   ① 接收方按照发送方的⽅法将整个数据块分成⼤⼰为n的若干段⾏，其中最后⼀段为检查和。

    +   ② 然后将这些分段采用反编码加法算法加在一起，得到⼀个n⽐特长的结果。

    +   ③ 如果结果为n个1，则传输正确，反之，则是错误的。'
  merge: -1
  img_proc: true
