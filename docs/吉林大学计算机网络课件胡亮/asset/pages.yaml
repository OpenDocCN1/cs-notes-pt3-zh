  md: '# 2.4.3 码分多路复用


    CDMA (Code-Division Multiple Access)


    码分多路复用时根据码型结构的不同来实现信号分割的多路复用。


    在CDMA系统中，各个用户不是靠频率或时隙来区分，而是码型来区分。用户使用同一频率，占用相同的带宽。'
