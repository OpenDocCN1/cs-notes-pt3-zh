- pgno: 317
  md: '# 4.3.1 HDLC支持的站点类型、链路配置和通信方式


    ③通信方式：


    HDLC协议中的通信方式就是在一次交互中所涉及到的两个设备之间的关系。这种方式描述了由谁控制链路。


    HDLC支持3种不同的工作方式：


    +   1. 正常应答方式(NRM)

    +   2. 异步应答方式(ARM)

    +   3. 异步平衡方式(ABM)'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 4.3.2 HDLC帧格式


    HDLC协议为了支持上述配置下的3种通信方式，定义了三种类型的帧：


    +   - 信息帧（I-帧） 监管帧（S-帧） 无编号帧（U-帧）


    I-帧

    | 标志 | 地址 | 控制 | 数据信息 | 帧校验序列 | 标志 |


    S-帧

    | 标志 | 地址 | 控制 | 帧校验序列 | 标志 |


    U-帧

    | 标志 | 地址 | 控制 | 管理信息 | 帧校验序列 | 标志 |'
  merge: -1
  img_proc: true
- pgno: 319
  md: '| 标志 01111110 | 地址 | 控制 | 信息 | FCS | 标志 01111110 |


    | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |


    | 0 | N(S) | P/F | N(R) | I帧 信息帧 |


    | 1 | 0 | SS类别码 | P/F | N(R) | S帧 监控帧 |


    | 1 | 1 | M类别码 | P/F | M类别码 | U帧 无编号帧 |'
  merge: -1
