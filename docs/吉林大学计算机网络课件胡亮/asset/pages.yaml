- pgno: 744
  md: '# ICMP报文类型之二：差错报文


    # (2) 源点抑制


    +   ICMP源点抑制报文是为了给IP增加一种拥塞控制而设计的。当路由器或主机因拥塞而丢弃数据报时，它就向数据报的发送站发送源点抑制报文。


    +   第一，它通知源端，数据报已被丢弃。


    +   第二，它警告源端，在路径中的某处出现了拥塞，因而源端必须放慢发送过程。'
  merge: -1
