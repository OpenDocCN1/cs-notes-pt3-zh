- pgno: 421
  md: '# # 5.4.2 链路状态路由算法


    # ## 链路状态路由可分为两步完成：


    +   ① 第一步是共享链路状态信息，即每个路由器将它自己和它的所有邻居之间的链路状态信息发送给互连网络中的所有其它路由器。


    +   ② 第二步是每个路由器根据自己所掌握的关于整个网络的链路状态信息计算到每个网路的路由。'
  merge: -1
