- pgno: 523
  md: '# 6.3 OSI传输协议


    +   - 重传通信子网具有潜在的存储能力，这就要求传输层协议具有相应的机制来处理可能出现的问题。

    +   - 数据缓冲和流量控制

    +   - 网络层和传输层的功能要互补

    +   - 网络层服务可分为3类

    +     - A类：可提供完善的服务，不使用N-RESET原语

    +     - B类：很少丢包，由于拥塞等原因，时常发出N-RESET服务原语

    +     - C类：提供的服务完全不可靠，还可能发送N-RESET服务原语'
  merge: -1
  img_proc: true
- pgno: 524
  md: '# 6.3.1 OSI传输协议的类型


    根据网络层提供的服务，ISO/OSI把传输层协议分为5类


    | 传输协议类型 | 网络服务类型 | 协议名称 |

    |---|---|---|

    | TP0 | A | 简单类 |

    | TP1 | B | 基本错误恢复类 |

    | TP2 | A | 复用类 |

    | TP3 | B | 差错恢复和复用类 |

    | TP4 | C | 差错检测和恢复类 |'
  merge: -1
  img_proc: true
- pgno: 525
  md: '# 6.3.1 OSI传输协议的类型


    # 传输层协议类型：


    +   ① TP0： 将传输连接映射到网络连接，无顺序和流量控制

    +   ② TP1： 仅处理由于N-RESET产生的问题

    +   ③ TP2： 与TP0类似，但具有复用功能

    +   ④ TP3： 具有复用和从N-RESET中恢复的功能

    +   ⑤ TP4： 最复杂的传输层协议，必须能处理丢失、重复、差错和N-RESET恢复'
  merge: -1
  img_proc: true
