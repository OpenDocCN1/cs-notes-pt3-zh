- pgno: 764
  md: '# # IGMP工作机制


    +   - **第一阶段：** 当某个主机加入新的多播组时，该主机应向多播组的多播地址发送IGMP报文，声明自己要成为该组的成员。本地的多播路由器收到IGMP报文后，将组成员关系转发给因特网上的其他多播路由器。

    +   - **第二阶段：** 因为组成员关系是动态的，因此本地多播路由器要周期性地探询本地局域网上的主机，以便知道这些主机是否还继续是组的成员。

    +     - 只要对某个组有一个主机响应，那么多播路由器就认为这个组是活跃的。

    +     - 但一个组在经过几次的探询后仍然没有一个主机响应，则不再将该组的成员关系转发给其他的多播路由器。'
  merge: -1
  img_proc: true
- pgno: 765
  md: '# IGMP采用的一些具体措施


    +   - 在主机和多播路由器之间的所有通信都使用IP 多播。

    +   - 多播路由器在探查询组成员关系时，只需要对所有的组发送一个请求信息的询问报文。

    +   - 当同一个网络上连接有几个多播路由器时，它们能够迅速和有效地选择其中的一个来探查询主机的成员关系。

    +   - 在IGMP 的询问报文中有一个数值N，它指明一个最长响应时间（默认值为10秒）。当收到询问时，主机在0 到N 之间随机选择发送响应所需经过的时延。对应于最小时延的响应最先发送。

    +   - 同一个组内的每一个主机都要监听响应，只要有本组的其他主机先发送了响应，自己就可以不再发送响应了。'
  merge: -1
  img_proc: true
