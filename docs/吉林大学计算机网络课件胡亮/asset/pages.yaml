- pgno: 581
  md: '# 7.3 无线局域网


    （1）802.11：在 2.4 GHz 波段中传输速率为 1 Mbps 或 2 Mbps。既支持跳频技术 FHSS 也支持直接序列扩频 DSSS。


    （2）802.11b：又称为 Wi-Fi，在 2.4 GHz波段中传输速率为 11 Mbps。802.11b 只支持直接序列扩展频谱DSSS。其无线功能的不亚于以太网。'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# CSMA/CA协议


    +   CSMA/CA是带有冲突避免的载波侦听多路访问，发送包的同时不能检测到信道上有无冲突，只能尽量“避免”。


    +   CSMA/CA协议的关键在于冲突避免CA。


    +   CSMA/CA与CSMA/CD的区别在于： CSMA/CD是带有冲突检测的载波侦听多路访问，发送包的同时可以检测到信道上有无冲突'
  merge: -1
  img_proc: true
- pgno: 583
  md: '# • IEEE 802.11采用了 CSMA/CA是因为：


    +   (1) 无线网络设备无法在发送数据的同时检测冲突；


    +   (2) 碰撞检测方式不同,CSMA/CD通过电缆中电压的变化来检测,而CSMA/CA采用能量检测(ED)方式。


    +   (3) 在无线局域网中,其刚刚发出的信号强度要远高于其他节点的信号强度,无法通过信号强度的变化来检测是否发生了冲突。'
  merge: -1
  img_proc: true
- pgno: 584
  md: '# IEEE 802.11的冲突避免采用三种机制来实现


    +   ① 预约信道:利用MAC帧的持续字段向其他站点通告，以避免冲突。

    +   ② 正向确认:确认机制。

    +   ③ RTS/CTS机制:请求发送/允许发送。'
  merge: -1
  img_proc: true
