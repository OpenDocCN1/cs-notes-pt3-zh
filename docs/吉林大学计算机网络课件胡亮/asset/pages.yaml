- pgno: 347
  md: '# # 4.4.2 网桥路由算法


    # ## ①固定路由网桥


    +   - 每个网桥中都有一张表，这张表中记录了到某个特定站点的帧应该转发到那个哪个局域网中去的信息，这个表称为路由表。


    +   - 在固定路由网桥中，路由表的生成是由手工配置的，一旦配置完成，路由表不会变动。'
  merge: -1
