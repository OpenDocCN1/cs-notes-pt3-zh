  md: '# 4.2.2 滑动窗口协议


    选择拒绝自动重复请求与回退n自动重复请求有4个不同点：


    +   ①接收设备必须具有排序功能。同时，接收方在发送了NAK帧之后，必须存储收到的所有帧，直到损坏的帧重新收到为止。


    +   ②发送设备必须具有查找机制，以便发现和选择需要重传的帧。


    +   ③所有重传帧被排序和所有重复帧被辨别出来并删除之前，所收到的帧都必须保存。


    +   ④ACK帧的编号指的是被正确接收的帧编号，不是指期望接收的帧编号，而NAK帧的编号指的是错误或丢失的帧。'
  merge: -1
  img_proc: true
