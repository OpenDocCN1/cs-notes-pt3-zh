- pgno: 795
  md: '# 8.6.3 TCP连接的建立和释放


    # ① TCP连接的建立


    +   - TCP是一个面向连接的协议，通信双方在发送数据之前都必须建立一个TCP连接。

    +   - TCP连接的建立过程称为三次握手。'
  merge: -1
  img_proc: true
- pgno: 796
  md: '# TCP连接的建立


    +   - 第一次握手：建立连接时，源主机发送SYN包(本次连接的seq=x)到目的主机，并进入SYN_SEND状态，等待目的主机的确认；'
  merge: -1
  img_proc: true
- pgno: 797
  md: '# TCP连接的建立


    +   - **第二次握手：** 目的主机收到SYN请求包后，如果同意连接，则发送SYN的确认（ack=x+1）给源主机，同时也发送一个自己的SYN包（seq=y），即SYN+ACK包，此时目的主机进入SYN_RECV状态；'
  merge: -1
  img_proc: true
- pgno: 798
  md: '# TCP连接的建立


    +   - **第三次握手：** 源主机收到目的主机的SYN+ ACK包后，向源主机发送确认包

    +     ACK(ack=y+1)，此包发送后，源端和目的端进入ESTABLISHED状态，完成三次握手。'
  merge: -1
  img_proc: true
- pgno: 799
  md: '主机A


    主机B


    发送SYN信息, (seq=x)


    接收SYN信息, (seq=x)


    发送SYN信息, (seq=y, ACK=x+1)


    接收SYN信息 (seq=y, ACK=x+1)


    发送确认 (ACK=y+1)


    接收确认 (ACK=y+1)'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# TCP连接的释放


    # ②TCP连接的释放


    +   建立一个TCP连接需要三次握手，而释放一个TCP连接需要经过四次握手。'
  merge: -1
  img_proc: true
- pgno: 801
  md: '# TCP连接的释放


    应用程序关闭


    发送FIN, seq=x


    接收FIN并应答


    发送ACK x+1


    应用程序关闭


    发送FIN, seq=y


    接收FIN并应答


    发送ACK y+1


    主机A


    主机B'
  merge: -1
  img_proc: true
- pgno: 802
  md: '客户进程

    服务器进程

    (主动打开) SYN_SENT

    SYN.SEQ=x

    LISTEN（被动打开）

    SYN_RCVD

    SYN.SEQ=y, ACK=x+1

    ESTABLISHED

    ACK=y+1

    ESTABLISHED

    (全双工数据传递阶段)

    (主动关闭) FIN_WAIT_1

    FIN.SEQ=u

    CLOSE_WAIT（被动关闭）

    ACK=u+1

    FIN_WAIT_2

    FIN.SEQ=v, ACK=u+1

    LAST_ACK

    TIME_WAIT

    ACK=v+1

    CLOSED'
  merge: -1
