- pgno: 81
  md: '# 1.5.3 服务原语


    +   - 服务用户和服务提供者之间要进行交互，交互的信息称为服务原语。

    +   - 服务原语是引用服务的工具，N+1层实体通过使用N层的服务原语向N层实体请求服务。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 1.5.3 服务原语


    # ①服务原语类型


    +   请求(request): 一个实体请求得到某种服务。由(N+1)向N层发出的,要求N层提供服务。


    +   指示(indication): 把关于某一事件的消息告诉某一实体。由N向(N+1)层发出，表示服务开始。


    +   响应(response): 一个实体愿意响应某一事件.由(N+1)向N层发出，表示对指示的响应。


    +   证实(confirm): 确认一个实体的服务请求。由N向(N+1)层发出，表示请求已完成。'
  merge: -1
  img_proc: true
