- pgno: 720
  md: '# DHCP协议


    DHCP (Dynamic Host Configuration Protocol) 动态主机配置协议，它提供了一种动态指定IP地址和配置参数的机制；是一种用于简化主机
    IP 配置管理的 IP 标准。


    通过采用 DHCP 标准，可以使用 DHCP 服务器为网络上启用了 DHCP 的客户端管理动态 IP 地址分配和其他相关配置细节。'
  merge: -1
  img_proc: true
- pgno: 721
  md: '# DHCP工作原理


    +   - DHCP 使用客户端/服务器模型。网络管理员建立一个或多个维护 TCP/IP 配置信息并将其提供给客户端的 DHCP 服务器。

    +   - HCP 服务器以地址租约的形式将该配置提供给发出请求的客户端。'
  merge: -1
  img_proc: true
- pgno: 722
  md: '# # DHCP工作原理


    ①发现阶段：DHCP客户机以广播方式发送DHCP discover报文来寻找DHCP服务器。


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_722_0.png)'
  merge: -1
  img_proc: true
- pgno: 723
  md: '# DHCP工作原理


    ②提供阶段： DHCP服务器在网络中接收到 DHCP discover报文后会做出响应，它从尚未出租的IP地址中挑选一个分配给DHCP客户机，向DHCP客户机发送一个包含出租的IP地址和其他设置的DHCP
    offer报文。'
  merge: -1
  img_proc: true
