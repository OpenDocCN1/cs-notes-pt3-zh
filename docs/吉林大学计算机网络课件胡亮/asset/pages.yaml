  md: '# 5.4.2 链路状态路由算法


    ■ 在链路状态路由中，每个路由器和互联网络中的所有其它路由器共享关于它邻居的信息：


    +   ①共享关于邻居的信息

    +   ②共享的信息发给所有的路由器

    +   ③信息的共享在有规律的时间间隔内进行（一般30分钟）'
