- pgno: 357
  md: '# # 4.4.2 网桥路由算法


    # ## 步骤一： 选择一个网桥作为根网桥：


    +   - 根网桥是具有最低地址（或标识ID）的那个网桥，根网桥是生成树的根节点。


    +   - 根网桥的选择是通过发送网桥协议数据单元（BPDU）这样的特殊帧来完成的。每个网桥协议数据单元包含一个网桥的ID，帧首次被发送时的端口ID和接收该帧的端口的累计费用。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# # 4.4.2 网桥路由算法


    步骤二：每个网桥确定它的根端口（Root Port）。


    - 这个端口对应于到根网桥的最小费用路径。

    - 随后，每个网桥会使用它的根端口来和根网桥通信。


    | 网桥 | 根端口 | 费用 |

    |---|---|---|

    | B2 | B2→L2 | 6 |

    | B3 | B3→L2 | 2 |

    | B4 | B4→L3 | 8 |

    | B5 | B5→L3 | 3 |

    | B6 | B6→L1 | 6 |'
  merge: -1
  img_proc: true
- pgno: 359
  md: "# # 4.4.2 网桥路由算法\n\n# ## 步骤三： 为每个局域网决定一个指定网桥\n\n+   - 来自这个局域网的帧通过哪一个网桥转发到根网桥的费用最低。\n\
