- pgno: 456
  md: '# 5.5.3 外部网关路由选择协议


    +   - BGPv4是典型的外部网关协议，完成自治系统间的路由选择问题。

    +   - BGP(Border Gateway Protocol)协议是一种距离向量协议。使用增量的、触发性的路由更新，而不是一般的距离向量协议的整个路由表的、周期性的更新。

    +   - BGP使用TCP作为传输协议，传输可靠性由TCP来保证，不需使用差错控制和重传机制。'
  merge: -1
  img_proc: true
