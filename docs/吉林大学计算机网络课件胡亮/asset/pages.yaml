- pgno: 702
  md: '# 路由归纳（也称为路由聚合或超supernetting）


    因为路由表的条目少了，路由归纳可以减少对路由器内存的占用，减少路由选择协议造成的网络流量。网络中的路由归纳能够正确的工作，必须满足下面要求：


    +   - 1: 多个IP地址必须共享相同的高位比特；

    +   - 2: 路由选择协议必须根据32比特的IP地址和高达32比特的前缀长度来作出路由转发决定

    +   - 3: 路由更新必须将前缀长度（子网掩码）与32比特的IP地址一起传输。'
  merge: -1
  img_proc: true
