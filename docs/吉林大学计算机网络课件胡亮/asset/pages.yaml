- pgno: 554
  md: '# CSMA/CD


    (1)非坚持CSMA的算法如下：


    +   - 如果链路是空闲的，则可以发送。

    +   - 如果链路是忙的，则等待一段时间。


    (2)坚持CSMA的算法如下：


    +   - 如果链路是空闲的，则可以发送。

    +   - 如果链路是忙的，则继续侦听，直到检测到链路空闲，立即发送。

    +   - 如果有冲突则等待随机的时间。'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# CSMA/CD


    (3)P-坚持CSMA的算法如下：


    +   ◆ 如果链路是空闲的，则以P的概率发送，而以(1-P)的概率延迟一个时间单位。


    +   ◆ 如果链路是忙的，继续侦听直至链路空闲。'
  merge: -1
  img_proc: true
- pgno: 556
  md: '# CSMA/CD


    +   - ③ CSMA/CD带有冲突检测的载波侦听多路访问：在传输的时候继续监听链路是否发生冲突。“边听边说”'
  merge: -1
  img_proc: true
- pgno: 557
  md: '# CSMA/CD


    # CSMA/CD的算法描述：


    +   (1) 如果链路是空闲的，则可以发送并同时检测冲突。

    +   (2) 如果链路是忙的，则继续侦听，直到检测到链路空闲。

    +   (3) 如果在发送过程中检测到冲突，则停止当前帧的发送，发阻塞信号，等待一段选定的时间。'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# CSMA/CD


    # 退避算法：


    +   (1) 对每一个帧，当第一次发生冲突时，设置参数 L=2；


    +   (2) 退避间隔取 1 到 L 个时间片中的一个随机数。一个时间片等于链路上最大传输延迟的 2 倍。


    +   (3) 当帧重复发生一次冲突时，则将参数 L 加倍。L 的最大值为 1024。即当 L 增加到 1024 时，L 不再增加。


    +   (4) 帧的最大重传次数为 16，超过这个次数，则该帧不再重传，并报告出错。'
  merge: -1
  img_proc: true
- pgno: 559
  md: "# CSMA/CD\n\n+   - 发送站等待的时间：\n+    t=R × 2T \n+    其中：\n+    R是0~2 min(k,10)之间的随机数\n\
    +    K是冲突次数,最大为16"
  merge: -1
  img_proc: true
