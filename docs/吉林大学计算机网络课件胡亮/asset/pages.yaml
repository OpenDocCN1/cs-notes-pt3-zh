  md: '# 8.2.4 IP路由选择


    +   - 路由器的主要功能是转发数据报，内存中维持一个路由表。当收到一个数据报并进行转发时，它都要对该路由表搜索一次，从一个接口转发到另一个接口。

    +   - 路由表的每一行应包含下面信息：

