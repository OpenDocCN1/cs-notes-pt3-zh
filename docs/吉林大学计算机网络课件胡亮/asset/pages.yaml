  md: '# 4.2.2 滑动窗口协议


    # ①滑动窗口协议中的流量控制


    +   - 发送方在收到应答消息前可以发送若干帧。接收方使用一个 ACK帧来对多个数据帧的接收进行确认。具体可以接受多少帧视窗口大小而定。


    # 帧编号：


    +   - 在滑动窗口协议中，数据帧以模n方式编号，也就是说，编号从0到n-1。窗口的大小是n-1。

    +   - 接收方发送的应答帧(ACK)编号是接收方希望收到的下一帧的编号。'
