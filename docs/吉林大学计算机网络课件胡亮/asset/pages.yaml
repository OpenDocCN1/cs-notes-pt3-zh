- pgno: 661
  md: '# 网络号和主机号


    # 二级地址


    ![](img/4ebfc3970286fe7ea98cf4db2323e179_661_0.png)


    +   - A类地址共分为128个地址块，而每一个地址块的net-id都不一样。每个地址块都包含有16777216个地址。(50%)

    +   - B类地址共划分为16384个地址块，每个地址块都包含有65536个地址。(占整个IP 地址空间的25%)

    +   - C类地址共划分为2097152个地址块，每个地址块都包含有256个地址。(占整个IP 地址空间的12.5%)

    +   - D类地址只有一个地址块。它用来进行多播。

    +   - E类地址只有一个地址块。它是保留地址。'
  merge: -1
  img_proc: true
- pgno: 662
  md: '# 8.2.1 IP地址




    (1) 网络地址：主机地址部分为全 “0”的 IP地址不分配给任何主机，而是作为网络本身的标识。


    ◆ 例：主机 202.198.151.136所在网段的网络地址 为202.198.151.0'
  merge: -1
  img_proc: true
- pgno: 663
  md: '# 8.2.1 IP地址


    （2）直接广播地址：主机地址为全“1”的IP地址不分配给任何主机，用作广播地址。


    +   ◆ 例：主机 202.198.151.136所在网段的直接广播地址为202.198.151.255


    （3）有限广播地址：32位为全1的IP地址称为有限广播地址。


    +   ◆ 例：有限广播地址为：255.255.255.255'
  merge: -1
  img_proc: true
- pgno: 664
  md: '# 8.2.1 IP地址


    （4）主机本身地址：32位为全0的IP地址称为主机本身地址。


    例:主机本身地址： 0.0.0.0


    （5）回送地址：网络号为127（主机号为非全0或全1的任何数）的IP地址称为回送地址，常用于本机上软件测试和本机上网络应用程序之间的通信地址。'
  merge: -1
  img_proc: true
