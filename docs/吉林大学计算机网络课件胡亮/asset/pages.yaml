- pgno: 725
  md: '# DHCP工作原理


    ③选择阶段：如果有多台DHCP服务器向DHCP客户机发来的DHCP offer提供报文，则DHCP客户机只接受第一个收到的DHCP offer提供报文，然后它就以广播方式回答一个DHCP
    request请求报文，该报文中包含向它所选定的DHCP服务器请求IP地址的内容。'
  merge: -1
  img_proc: true
