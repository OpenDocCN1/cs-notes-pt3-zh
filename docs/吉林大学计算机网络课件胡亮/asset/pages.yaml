  md: '# ATM层信元报头格式


    +   (PT) 有效数据类型：3比特的PT域中，第一个比特定义了信元中有效数据是用户信息还是管理信息。


    +   (CLP) 信元丢失优先级：1个比特的CLP是实现拥塞控制的。1是高优先级。


    +   (HEC) 报头校验，采用CRC校验。'
