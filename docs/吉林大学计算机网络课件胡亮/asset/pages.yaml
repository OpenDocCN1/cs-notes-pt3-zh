- pgno: 696
  md: '# CIDR(无类别域间路由)


    CIDR用网络前缀代替传统标准分类的IP地址的“网络号+子网号”，形成新的无分类的二级地址结构。因此可以更加有效地分配IPv4地址。


    +   CIDR采用斜线记法，即,<网络前缀>,<主机号>。


    +   例如：202.198.21.0/20,表示在这个32位长度的IP地址中，前20位是网络前缀，后12位是主机号。


    CIDR将网络前缀相同的连续IP地址组成一个CIDR地址块。只要知道地址块中的任何一个地址，就可以知道这个地址块的最小地址和最大地址。'
  merge: -1
  img_proc: true
