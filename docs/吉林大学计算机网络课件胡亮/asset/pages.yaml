- pgno: 860
  md: '# 10.1 DNS服务


    +   - DNS（域名系统）是一种能够完成从域名到IP地址或从IP地址到域名的映射。

    +   - 由于域名具有文字表达的意义，比IP地址更容易记忆。'
  merge: -1
  img_proc: true
- pgno: 861
  md: '# 10. 1. 1 DNS的历史




    ARPANET的域名与IP地址的映射是靠文本文件—HOSTS。HOSTS文件包含了主机的名称到地址的映射。




    HOSTS 文件机制不具备可缩放性，限制了网络规模。1984年USC发布了RFC882-883，定义了DNS，形成了现在的域名系统标准。'
  merge: -1
  img_proc: true
- pgno: 862
  md: '# 10.1.2 DNS的工作原理


    +   - 域名系统是一个**分布式的数据库**，每个子域负责维护整个数据库的一个分段。

    +   - DNS采用**客户/服务器**工作模式。'
  merge: -1
  img_proc: true
- pgno: 863
  md: '# DNS的工作原理


    # ①域名空间


    树状，域即为树状域名空间中的一棵子树。


    域名全称是一个从该域到根的标签序列，以“.”分离这些标签。域名既可以是叶结点的名称，也可以是子树根结点的名称。'
  merge: -1
  img_proc: true
- pgno: 864
  md: '# DNS的工作原理


    # ②命名规则


    +   - 叶结点通常代表主机。

    +   - 最高层的域名由网络信息中心指定。第2层域名小于12个字符且独立，联网之前需注册。第3层域名通常表示组织部门或分支。

    +   - 域名的读取顺序是：结点到根，用“.”分隔。'
  merge: -1
  img_proc: true
- pgno: 865
  md: '# DNS的工作原理


    # ③代理技术


    代理包含2个意思：


    +   - (1) 数据存储分散化

    +   - (2) 管理权分散化'
  merge: -1
  img_proc: true
- pgno: 866
  md: '# DNS的工作原理


    # ④名称服务器


    存储有关域名空间信息的程序称为名称服务器。它是一个在后台的守候程序，监听来自客户机的请求。'
  merge: -1
  img_proc: true
- pgno: 867
  md: '# DNS的工作原理


    # ⑤解释过程


    域名解析器首先查询本地主机的的缓冲区，查看主机是否以前解析过主机名。


    如果主机缓冲区中没有与其IP地址的映射关系，解析器将向本地域名服务器发出请求。


    本地域名服务器首先检查域名与其IP地址的映射关系是否存储在它的数据库中，如果是，本地服务器将该映射关系传送给请求者。'
  merge: -1
  img_proc: true
