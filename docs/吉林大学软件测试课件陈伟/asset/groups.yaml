    # 测试计划参考结构(IEEE829)


    +   1. 测试计划标识

    +      — 项目名称、版本、标识号

    +   2. 项目介绍

    +      — 项目应用背景、目的等的简要概述；

    +      — 参考的文档及标准:如高层次的测试计划、行业标准、国家标准、公司标准、授权合同、规格说明等

    +   3. 测试项

    +      — 测试对象的简单概述

    +      — 测试对象的名称、版本、标识号

    +   4. 需要测试的特性

    +      — 根据级别的不同，确定相应的测试内容

    +   5. 不需要测试的特性

    +      — 根据级别的不同，实际条件(时间、人员、环境等)来具体确定

    +   6. 测试方式

    +      — 根据级别的不同，确定

    +      — 选择测试用例的标准、目的、要求。

    +      — 选择测试用例集的方法

    +   7. 测试通过/失败准则(测试的出口准则)

    +      — 根据级别的不同，测试对象的不同，确定相应的准则

    +      — 根据安全及风险分析，制定出口标准。

    +   8. 挂起准则和恢复准则

    +      — 制定尽早结束无效测试的准则

    +      — 制定恢复测试活动的准则'
