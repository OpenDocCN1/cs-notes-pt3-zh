  - '[PAGE 394]


    # 模块的设计原则


    +   - 模块分解的原则

    +     - 保证模块的相对独立性

    +     - 高聚合、低耦合

    +   - 模块的实现细节对外不可见

    +     - 外部：关心做什么

    +     - 内部：关心怎么做'
  - '[PAGE 395]


    # 模块的设计原则


    +   - 设计好模块接口

    +     - 接口是指罗列出一个模块的所有的与外部打交道的变量等

    +     - 定义好后不要轻易改动

    +     - 在模块开头（文件的开头）进行函数声明

    +   - 开发人员各司其职

    +     - 按模块分配任务，职责明确

    +     - 并行开发，缩短开发时间'
  - '[PAGE 396]


    # 函数间的关系


    +   - 函数生来都是平等和互相独立的，没有高低贵贱之分

    +   - 一个函数并不属于另外一个函数，但是一个函数可以调用另外一个函数

    +     - main()稍微特殊一点点

    +     - C程序的执行从main函数开始，调用其他函数后流程回到main函数，在main函数中结束整个程序运行。'
  - '[PAGE 397]


    # 函数的分类


    +   - 库函数

    +     - ANSI/ISO C定义的标准库函数

    +       - 如：printf, scanf, sin, cos, ...

    +       - 符合标准的C语言编译器必须提供这些函数

    +     - 第三方库函数

    +       - 由其它厂商开发的C语言函数库。不在标准范围内，能扩充C语言的功能（图形、网络、数据库等）

    +       - Exceptions In C http://adomas.org/excc/

    +       - Libtc http://libtc.sourceforge.net/

    +   - 自定义函数

    +     - 自己编写的函数

    +     - 包装后，也可成为函数库，供别人使用(成为第三方库函数)'
  - '[PAGE 398]


    # 函数的好处


    +   - 分而治之

    +     - 把较大任务分解成若干个较小的任务，并提炼出公用任务

    +   - 复用

    +     - 可以在其他函数的基础上构造程序，而不需要从头做起

    +     - 是高质量软件开发的基本方法之一

    +   - 信息隐藏

    +     - 设计得当的函数可以把具体操作细节对外隐藏，保证其安全'
  - '[PAGE 399]


    # 函数的好处


    +   - 如把编程比做制造一台机器，函数就好比其零部件

    +     - 可将这些“零部件”单独设计、调试、测试好，用时拿出来装配，再总体调试。

    +   - 这些“零部件”可以是自己设计制造/别人设计制造的标准产品


