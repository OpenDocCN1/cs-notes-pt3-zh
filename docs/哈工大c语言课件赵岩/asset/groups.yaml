    - 变量必须“先定义，后使用”\n  - 所有变量必须在第一条可执行语句前定义（C语言）\n  - 定义的顺序无关紧要\n  - 一条定义语句可定义若干个同类型的变量，变量名之间用逗号分隔\n\
    \  - 变量定义后，即占用内存，可随时向其存入数据，并可通过变量名使用数据\n\n- 定义变量时，是初始化变量的最好时机\n  - 不被初始化的变量，其值为危险的垃圾（随机）数\n\
    \n```\n1 int i, j;\n2 printf(\"%d\", i); /* i的值到底是多少 */\n```\n\n## 变量定义说明\n\n\
    - 变量必须“先定义，后使用”\n  - 所有变量必须在第一条可执行语句前定义（C语言）\n  - 定义的顺序无关紧要\n  - 一条定义语句可定义若干个同类型的变量，变量名之间用逗号分隔\n\
    \  - 变量定义后，即占用内存，可随时向其存入数据，并可通过变量名使用数据\n- 定义变量时，是初始化变量的最好时机\n  - 不被初始化的变量，其值为危险的垃圾（随机）数\n\
    \n```\n1 int i;\n2 printf(\"%d\", i); /* i的值到底是多少 */\n```\n\n## 常见常量\n\n- 整型常量\n\
    \  - 18, -31\n  - long int型常量123L, 123L, 123456l, 123456L\n  - unsigned int型常量123u,\
    \ 123U\n- 浮点常量\n  - 十进制小数形式123.45, 456.78\n  - 指数形式1e-2, 4.5e3\n  - float型常量123.45f,\
    \ 456.78F, 1e-2f, 4.5e3F\n  - long double型常量123.45l, 456.78L, 4.5e3L\n  - 缺省为double\n\
    \  - 因为字母和数字容易混淆，所以当用l做后缀时，常使用大写形式\n\n## 常见常量\n\n- 整型常量\n  - 18, -31\n  - long\
    \ int型常量123L、123L、123456l、123456L\n  - unsigned int型常量123u、123U\n\n- 浮点常量\n  -\
    \ 十进制小数形式123.45、456.78\n  - 指数形式1e-2、4.5e3\n  - float型常量123.45f、456.78F、1e-2f、4.5e3F\n\
    \  - long double型常量123.45l、456.78L、4.5e3L\n  - 缺省为double\n  - 因为字母和数字容易混淆，所以当用l做后缀时，常使用大写形式\n\
    \n## 整型常量的进制和后缀\n\n- 以数字\"0\"开头(不是字母\"O\")的整型常量是八进制数\n  - 022、-037\n  - 010和10大小不一样\n\
    \  - 因为八进制并不包含8，所以此种表示法比较少见\n\n- 以\"0x\"或\"0X\"开头的整型常量是十六进制数\n  - A~F和a~f用来表示10~15\n\
    \  - 十六进制的形式比较常用\n  - 0x12、-0x1F、-0x1f\n  - 0XFUL 这是一个什么数？\n\n## 整型常量的进制和后缀\n\n\
    - 以数字\"0\"开头(不是字母\"O\")的整型常量是八进制数\n- 022, -037\n- 010和10不一样\n- 因为八进制并不常用，所以此种表示法比较少见\n\
    \n- 以\"0X\"或\"0x\"开头的整型常量是十六进制\n- A-F和a-f用来表示十进制的10-15\n- 十六进制的形式比较常用\n- 0x12,\
    \ -0x1F, -0x1f\n- 0XFUL 这是一个什么数？\n\n## 常量后缀的应用\n\n- 整型后缀\n- 浮点型后缀\n\n```\n1 main()\n\
    2 {\n3     float r;\n4     r = 1.0f+0.2f;\n5     r = r-1.2f;\n6     printf(\"\
    %22.16f\\n\",r);\n7 }\n```\n\n- 去掉后缀后，发生什么？\n\n## 常量后缀的应用\n\n- 整型后缀\n- 浮点型后缀\n\
    \n```\n1 main()\n2 {\n3     float r;\n4     r = 1.0f+0.2f;\n5     r = r-1.2f;\n\
    6     printf(\"%22.16f\\n\",r);\n7 }\n```\n\n- 去掉后缀后，发生什么？\n\n## 常量后缀的应用\n\n-\
    \ 整型后缀\n- 浮点型后缀\n\n```\n1 main()\n2 {\n3     float r;\n4     r = 1.0f+0.2f;\n\
    5     r = r-1.2f;\n6     printf(\"%22.16f\\n\",r);\n7 }\n```\n\n- 去掉后缀后，发生什么？\n\
    \n## 字符型常量\n\n- 字符常数的表示方法\n  - `'a'`, `'A'`, `'5'`, `' '`\n  - 单引号内只能有一个字符，除非以`\\\
    `开头\n- 字符常量就是一个普通整数，也可以参与各种数学运算\n  - 每个字符有一个0-255之间的值，可从ASCII表查出\n  - 注意：`'5'`和整数5的区别\n\
    - 用`\\`开头的字符为转义字符\n  - 例如，`\"\\n\"`，代表1个回车字符\n\n## 字符型常量\n\n- 字符常数的表示方法\n  - 'a',\
    \ 'A', '5', ' '\n  - 单引号内只能有一个字符，除非以'\\'开头\n- 字符常量就是一个普通整数，也可以参与各种数学运算\n  - 每个字符有一个0-255之间的值，可从ASCII表查出\n\
    \  - 注意：'5'和整数5的区别\n- 用'\\'开头的字符为转义字符\n  - 例如：\"\\n\"，代表1个回车字符\n\n## 字符型常量\n\n\
    - 字符常数的表示方法\n  - 'a', 'A', '5', ' '\n  - 单引号内只能有一个字符，除非以'\\'开头\n- 字符常量就是一个普通整数，也可以参与各种数学运算\n\
    \  - 每个字符有一个0~255之间的值，可从ASCII表查出\n  - 注意：'5'和整数5的区别\n- 用'\\'开头的字符为转义字符\n  - 例如，\"\
    \\n\" 代表1个回车字符\n\n## 转义字符\n\n| 转义 | 含义 | 转义 | 含义 |\n|---|---|---|---|\n| \\a |\
    \ 响铃符 | \\\\ | 反斜杠 |\n| \\b | 回退符 | \\? | 问号 |\n| \\f | 换页符 | \\' | 单引号 |\n| \\\
    n | 换行符 | \\\" | 双引号 |\n| \\r | 回车符 | \\ooo | 八进制数 |\n| \\t | 水平制表符 | \\xhh |\
    \ 十六进制数 |\n| \\v | 垂直制表符 |  |  |\n\n## 字符串常量\n\n- 用双引号括住的由0个或多个字符组成的字符序列\n  -\
    \ \"I am a string\"\n  - \"\"表示空字符串\n  - 转义字符也可以在字符串中使用\n  - 引号只作为字符串开始和结束的标志\n\
    \  - 除注释外，是唯一可以出现中文的地方\n- \"x\"和'x'是不同的\n  - C语言内部用\\0表示字符串的结束\n- <string.h>里定义了一系列专门的字符串处理函数\n\
    \  - strlen, strcpy\n\n## 字符串常量\n\n- 用双引号括住的由0个或多个字符组成的字符序列\n  - \"I am a string\"\
    \n  - \"\"表示空字符串\n  - 转义字符也可以在字符串中使用\n  - 引号只作为字符串开始和结束的标志\n  - 除注释外，是唯一可以出现中文的地方\n\
    - \"x\"和'x'是不同的\n  - C语言内部用\\0表示字符串的结束\n- <string.h>里定义了一系列专门的字符串处理函数\n  - strlen,\
    \ strcpy\n\n## 字符串常量\n\n- 用双引号括住的由0个或多个字符组成的字符序列\n  - \"I am a string\"\n  - \"\
    \"表示空字符串\n  - 转义字符也可以在字符串中使用\n  - 引号只作为字符串开始和结束的标志\n  - 除注释外，是唯一可以出现中文的地方\n- \"\
