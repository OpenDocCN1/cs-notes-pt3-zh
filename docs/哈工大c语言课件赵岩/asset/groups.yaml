    # 文件（File）


    +   - 为什么需要文件？

    +     - 要让数据在断电后依然存在，就必须用外部存储设备

    +     - 外存原理迥异，如果必须按其特性使用...杯具！

    +   - 文件哪里来？

    +     - 操作系统有一个模块，叫“文件系统”

    +     - 文件系统封装了外存的特性，让我们可以同一个接口使用不同外存

    +     - 这个接口就是“文件”

    +   - 原理

    +     - 操作系统决定文件在介质上的所有保存细节。

    +   - 使用文件需要知道

    +     - 目录结构，文件结构，命令接口，开发接口'
