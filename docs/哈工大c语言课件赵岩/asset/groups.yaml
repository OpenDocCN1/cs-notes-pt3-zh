    - 电脑就像神一样，有专门的“神坛”，需要专人穿着白大褂的“祭师”来负责交流。

    - DIY (Do It Yourself) 自己组装电脑。


    ![](img/7afade9235e9e9d9b1d009051c946346_68_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_69_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_70_0.png)


    ## 中学的电话

    - 把牛顿星从玩具变成工具需要织女：一种计算机语言。

    - “我可以给牛顿星编写一套计算机语言”，三周后交货


    把牛顿星从玩具变成工具需要织女：一种计算机语言。


    “我可以给牛顿星编写一套计算机语言”，三周后交货


    - 借助于BASIC语言，1975年，微软成立。


    ![](img/7afade9235e9e9d9b1d009051c946346_73_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_74_0.png)


    ## 苹果诞生

    - “我们可以做得更好！”

    - 1977年，乔布斯开发出了Apple II。

    - 企业的基因。

    - 微软的合作，苹果的超越。


    ![](img/7afade9235e9e9d9b1d009051c946346_76_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_76_1.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_77_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_77_1.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_78_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_78_1.png)


    ## 疯狂的苹果

    - 短短5年时间内，苹果营业额跃升10亿美元。

    - 跨进美国最大500家公司的行列。


    FORTUNE

    500


    ## 跳舞的大象——IBM

    - 1978年，IBM利用英特尔8088微处理器推出了IBM PC。

    - 技术规范公开——兼容机。

    - 很快从苹果赢回了一部分的微机市场。


    ![](img/7afade9235e9e9d9b1d009051c946346_81_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_82_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_83_0.png)


    ## 最失败的谈判

    - 1981年，乔布斯雇微软为其图形界面开发应用软件。

    - 给谁看都可以，就是不要给盖茨看。

    - 忽略操作系统的认识，IBM和苹果都犯了致命的错误。

    - 衣着随便，带着厚厚的眼镜的年轻人，几乎毁了苹果的命。


    ![](img/7afade9235e9e9d9b1d009051c946346_87_0.png)


    ## 兼容机厂家

    - 微软生产操作系统。

    - Intel生产CPU。

    - 飞利浦和索尼生产光驱。

    - 3COM生产网卡。

    - 3M生产软盘。

    - IBM生产硬盘。

    - 显示卡、键盘、鼠标。


