    # 结构体和共用体


    +   - 结构体：

    +     - 把关系紧密且逻辑相关的多种不同类型的变量组织到统一的名字之下，也称复合数据类型

    +     - 这种类型的变量占用相邻的一段内存单元

    +   - 共用体：

    +     - 把彼此互斥但又逻辑相关的多种不同类型的变量组织在一起

    +     - 这种类型的变量占用同一段内存单元，因此每一时刻只有一个数据起作用'
