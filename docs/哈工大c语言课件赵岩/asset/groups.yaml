    ## 夏娃—图灵

    - 中文名：艾伦·图灵

    - 英文名：Alan Turing

    - 国籍：英国

    - 生年：1912年—1954年


    ![](img/7afade9235e9e9d9b1d009051c946346_51_0.png)


    ## 贡献——理论方面

    - 图灵机⇒问题的可计算性

    - 图灵假设⇒分辨不出人和机器

    - 图灵预言⇒本世纪末，会有智能的计算机出现


    - 1997年，IBM深蓝击败了象棋大师卡斯帕罗夫

    - 卡斯帕罗夫感觉电脑的决定有“创意”

    - 以前那么“难”的事情，现在那么容易。以前那么“容易”的事情，现在那么难。


    ![](img/7afade9235e9e9d9b1d009051c946346_52_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_53_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_54_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_54_1.png)


    ## 晶体管起源

    - 1947年，贝尔实验室，肖克利、巴丁、布拉顿三人

    - 利用半导体（硅、锗）的单向导电性发明了晶体管。

    - 1956年，肖克利等三人，同时荣获诺贝尔物理学奖。


    ![](img/7afade9235e9e9d9b1d009051c946346_55_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_55_1.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_56_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_56_1.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_57_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_57_1.png)


    ## 八“叛逆”

    - 1955年，晶体管的发明者肖克利回到硅谷，创办肖克利实验室。

    - 以诺依斯（N.Noyce）、摩尔（G.Moore）为首的八位青年科学家，加盟肖克利实验室。

    - 两年后，八人集体叛逃，成立“Fairchild”，中文为“仙童”公司。

    - 诺依斯（N.Noyce）发明了集成电路。

    - 摩尔（G.Moore）发现了摩尔定律：18个月芯片速度翻一番。（价格降一倍）


    ![](img/7afade9235e9e9d9b1d009051c946346_60_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_61_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_62_0.png)


    ## Intel成立

    - 1968年，诺依斯（N.Noyce）、摩尔（G.Moore）创立了一个企业，取名：Moore Noyce

    - 谐音为：More Noise 更多噪音，后改名(Intel)英特尔公司。

    - 1974年：英特尔发布了其第一个微处理器8080。

    - 1978年：英特尔把8088微处理器销售给IBM，IBM利用其开发了自己的微型电脑IBM-PC。

    - 286、386、奔腾、奔腾III、酷睿双核...


    ![](img/7afade9235e9e9d9b1d009051c946346_64_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_65_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_66_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_67_0.png)

