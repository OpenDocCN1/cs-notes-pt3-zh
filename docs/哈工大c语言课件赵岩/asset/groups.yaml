  mdcn: "\n## `#define`的缺点\n\n• 它只是简单的替换，不进行任何语法检查\n\n## Demo 1: An example of define\n\
    \n```c\n#define PI 3.1415;\n#define max(A,B) ((A) > (B) ? (A) : (B))\nvoid main()\n\
    {\n    int i = 4;\n    printf(\"%f\\n\",PI); /* compile error*/\n\n    max(i++,3);\n\
    \    /*((i++)>3?(i++):3); */\n    printf(\"%d\\n\",i);\n}\n```\n\n## `#define`的替换方法\n\
    \n- const 常量\n- 模板内联函数\n\n```cpp\n1 const double PI = 3.1415;\n2 template<class\
    \ T>\n3 inline const T& max(const T& a, const T& b)\n4 { return a > b ? a : b;\
    \ }\n```\n\n## `#include`指令\n\n- 用#include指定文件的内容替换#include所在的的行\n- 也是简单的替换，养成在头文件后面加上分号的习惯。\n\
    - 用<>或者\"\"括上文件名\n  - <>表示在编译器的include目录内查找文件\n  - \"\"表示在当前目录下查找文件\n- 文件名中可以带有路径\n\
    \n## 跨平台\n\n```\n1 #ifdef linux\n2     #include <ext/hash_map>\n3     #include\
    \ <ext/hash_set>\n4 #else\n5     #include <hash_map>\n6     #include <hash_set>\n\
    7 #endif\n```\n\n## 避免重复包含\n\n![](img/7afade9235e9e9d9b1d009051c946346_452_0.png)\n\
    \n## 使用预编译指令的目的\n\n- 增强程序可读性\n- 但是调试时宏可能会带来很多问题\n- 精简源代码，提取变化\n  - 这一重点更多时使用函数的效果更好，但宏也有其不可替代的优势\n\
    - 不编译无用代码，精炼目标代码\n\n## 基本知识之编译器和链接器\n\n- C语言是每个C文件单独编译的\n  - 每次只编译一个C文件，看不到其它的C文件\n\
    - 编译器\n  - 编译器确认每个标识符的类型\n  - 我要认识它\n- 链接器\n  - 链接过程在内存中定位这个标识符\n  - 我要唯一地找到它\n\
    \n## 例子3\n\n- a.c文件\n\n```\n1 int i=5; /* a.c */\n2 foo();\n3 main(){\n4     printf(\"\
    %d\",foo());\n5 }\n```\n\n- b.c文件\n\n```\n1 int i; /*b.c*/\n2 foo(){\n3     i*=2;\n\
    4 };\n```\n\n## 正确例子\n\n- a.c文件\n- b.c文件\n\n```\n1 int i=5; /* a.c */\n2 foo();\n\
    3 main(){\n4     printf(\"%d\",foo());\n5 }\n```\n\n```\n1 extern int i; /*b.c*/\n\
    2 foo(){\n3     i*=2;\n4 };\n```\n\n## a.c文件\n\n```c\n#include \"b.h\" /* * .a\
    \ .c */\nint i=5;\nmain(){\n\tprintf(\"%d\", foo());\n}\n```\n\n## b.c文件\n\n```c\n\
    #include \"b.h\" /* * .b .c */\nfoo (){\n\ti=2;\n};\n```\n\n## 不仅正确，而且优雅！\n\n\
    - b.h文件\n\n```\n1 #ifndef _B_H /* b.h */\n2 #define _B_H\n3 foo();\n4 extern int\
    \ i;\n5 #endif\n```\n\n## 工程-project\n\n工程通常包含：\n\n- 源文件(xxx.c)：一系列相关函数和全局变量的定义\n\
    - 头文件(xxx.h)：函数和全局变量的声明，如：函数声明、外部变量声明、宏定义、类型定义...\n- 可以将模块编译成.o、.a、.obj或.lib文件，从而保护源代码\n\
    \n使用模块的过程\n\n- 建立一个工程(project)\n- 把各模块都加入到工程中\n- #include模块的头文件\n- 开始使用此模块\n\n\
    ## 文件中的变量\n\n- 文件的信息隐藏\n  - 用static定义的函数和变量只在此模块（文件）中有效\n  - （建议采用）\n- 允许被其它文件使用的全局变量\n\
    \  - 在源文件中定义，不加static修饰\n  - 在头文件中进行声明，加extern修饰\n\n```\n#include\"Area.h\"\n\
    void main()\n{\n    double r = 3;\n    double area = Circle_Area(r);\n    area\
    \ = Circle_Area(r);\n    printf(\"area of circle is %f\\n\",area);\n    printf(\"\
    PI is %f\\n\", PI);\n    GetTimes();\n    printf(\"function was called %d times\"\
    ,global_times);\n}\n```\n\n## 多文件工程实例源码-Area.h\n\n```\n#ifndef _AREA_H\n#define\
    \ _AREA_H\n\nextern const double PI;\nextern int global_times;\ndouble Circle_Area(double\
    \ r);\nvoid GetTimes();\n#endif\n```\n\n## 总结\n\n预处理和模块\n\n预处理\n\n- #define\n\
    - #ifndef\n\n模块\n\n- 声明和定义的区别\n- 全局变量的定义和声明\n- 静态变量的定义\n\n谢谢大家，欢迎提问！\n\n## C语言\n\
