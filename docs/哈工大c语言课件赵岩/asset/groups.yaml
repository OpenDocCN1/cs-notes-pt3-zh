    \ Deal(struct CARD *wCard)\n{\n    int i;\n    for (i=0; i<52; i++) /*输出发牌结果*/\n\
    \    {\n        printf(\"%10s%10s\\n\", wCard[i].suit, wCard[i].face);\n    }\n\
    }\n```\n\n## 结构体的嵌套\n\n```\n1 struct STUDENT{\n2 int studentID;\n3 char studentName[10];\n\
