    \ CopyFile(const char* srcName,\n    const char* dstName){\n    FILE* fpSrc =\
    \ NULL;\n    FILE* fpDst = NULL;\n    int ch, rval=1;\n    fpSrc = fopen(srcName,\
    \ \"rb\");\n    if(fpSrc == NULL)\n        goto ERROR;\n    fpDst = fopen(dstName,\
    \ \"wb\");\n    if(fpDst == NULL)\n        goto ERROR;\n    while((ch=fgetc(fpSrc))!=EOF){\n\
    \        if(fputc(ch, fpDst)==EOF)\n            goto ERROR;\n    }\n```\n\n```c\n\
