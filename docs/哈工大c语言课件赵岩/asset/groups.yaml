  md: "\n## C语言的特点\n\n- 是一种高级语言\n  - 高级语言并不是“高级”，只是相对低级语言，在一个更高的级别上进行编程\n- 历史悠久，功勋卓著\n\
    \  - 诞生于上世纪70年代初，成熟于80年代（C89），修订于90年代（C99）\n  - 很多重量级软件都是用C写的\n- 很多流行语言、新生语言都借鉴了它的思想、语法\n\
    \  - 从C++，到Java，再到C#，还有PHP等\n- 现状\n  - 嵌入式领域和系统级编程占主流\n  - 桌面和网络应用不多\n\n## C语言的地盘\n\
    \n- 高级语言的地盘\n  - 应用程序 (Application)\n  - 基于平台应用程序\n  - 应用平台\n- 低级语言的地盘\n  - 操作系统\
    \ (OS)\n  - 硬件 (Hardware)\n\n## C语言的精神\n\n- 信任程序员。\n- 不要阻止程序员做他认为应该做的事。\n- 保持语言的精巧和简单。\n\
    - 对一种操作只提供一种方法。\n- 一定要快，哪怕这么做是不可移植的。\n\n> ——引自《Rationale for C99》\n\n## 学好C语言的方法\n\
    \n- 学习编程最好的方法之一就是阅读源代码。\n- 多读书，积累编程技巧。\n- 善于利用身边的工具与环境。\n- 不怕错误，在错误中成长。\n- 学习编程的秘诀是：编程，再编程，再编程！\n\
    - Dirty your hands\n\n![](img/7afade9235e9e9d9b1d009051c946346_148_0.png)\n\n\
    > REAL Programmers code in BINARY.\n\n## 优秀程序员的素质\n\n- 良好的编程风格。\n- 严谨的思维。\n- 扎实的基础。\n\
    - KISS。（Keep it simple and Stupid）\n- 好奇心。\n\n## 成功者语录\n\n- 永远渴望，大智若愚（Stay Hungry,\
    \ Stay Foolish）\n- 领袖和跟风者的区别就在于创新\n  ——乔布斯（Apple 董事长）\n- 无论公司有多大，18个月后都有可能倒闭\n\
    \  ——比尔·盖茨（Microsoft 董事长）\n- 只有偏执狂才能生存（Only The Paranoid Survive）\n  ——安迪·格鲁夫（Intel前CEO）\n\
    - 这无关比特、字节和协议，而关乎利润和损益\n  ——郭士纳（IBM前CEO）\n"
