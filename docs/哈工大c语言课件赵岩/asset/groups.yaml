    \n## C程序的三种基本结构\n\n- 顺序结构、选择结构、循环结构\n- 已经证明，任何程序均只用这三种结构实现\n- 只用这三种结构的程序，叫结构化程序\n\
    - 程序“必须”符合结构化规则\n\n## 语句块\n\n- {} 括住的若干条语句构成一个语句块\n- 语句块内可以定义变量\n  - 变量必须在语句块的开头定义\n\
    \  - 变量仅在定义它的语句块内(包括下层语句块)有效\n  - 同一个语句块内的变量名不可相同，不同语句块可同名\n    - 各司其职，下层优先\n\
    \    - 避免在下层语句块内定义同名变量。\n- 语句块通常用在判断和循环语句。\n\n## 语句块实例\n\n- 语句块中的变量只在定义它的语句块中有效\n\
    - 避免写出下面的程序\n\nDemo 1: local variable\n\n```\n1 main()\n2 {\n3     int  a = 0;\n\
    4     {\n5         int  a = 1;\n6         printf(\"Inside: a = %d\\n\", a);\n\
    7     }\n8     printf(\"Outside: a = %d\\n\", a);\n9 }\n```\n\n## 顺序结构程序实例\n\n\
    Demo 2: sequence structure\n\n```\n1 int x,b0,b1,b2;\n2 scanf(\"%d\",x);\n3 b2\
    \ = x/100;\n4 b1 = (x-b2*100)/10;\n5 b0 = x%10;\n6 printf(\" %4d  %4d  %4d\",b2,b1,b0);\n\
    ```\n\n# 问题\n\n？100000？有多少位？\n\n## if-else代码\n\n![](img/7afade9235e9e9d9b1d009051c946346_335_0.png)\n\
    \n## if-else定义\n\n- 选择结构的一种常用形式\n- 表达式值非0（真）时，执行语句块1，然后执行后续语句\n- 表达式值为0（假）时，执行语句块2，然后执行后续语句\n\
    - `else`部分可以没有.\n\n```\nif（表达式）\n{\n    语句块1;\n}\nelse\n{\n    语句块2;\n}\n```\n\
    \n## else的配套问题\n\n- x等于零的时候\n  - y等于零,打印both zero\n- x不等于零的时候\n  - z=y/x\n\n```\n\
    1  if (x==0)\n2      if (y==0) printf(\"both zero\");\n3  else\n4  {\n5      z=y/x;\n\
    6  }\n```\n\n## else的配套问题的实际含义\n\n+ else与最近的if匹配\n\n```\n1   if (x==0)\n2   {\n\
    3       if (y==0) printf(\"both zero\");\n4       else\n5       {\n6         \
    \  z=y/x;\n7       }\n8   }\n```\n\n## else的配套问题的解决办法\n\n+ 利用大括号封装第一个if\n\n```\n\
    1   if (x==0)\n2   {\n3       if (y==0) printf(\"both zero\");\n4   }\n5   else\n\
    6   {\n7       z=y/x;\n8   }\n```\n\n## if判断条件简写\n\n- 非零值为真\n- 零值为假\n\n```\n1\
    \   if (x)\n2\n3   if (x!=0)\n```\n\n## 多重选择\n\n```\n1 if (表达式1){\n    语句块1;\n\
    }\n4 else if (表达式2){\n    语句块2;\n}\n7 else if (表达式3){\n    语句块3;\n}\n10 else{\n\
    \    语句块4;\n}\n13 后续语句;\n```\n\n![](img/7afade9235e9e9d9b1d009051c946346_341_0.png)\n\
    \n## 多重选择实例\n\n- 按“体指数”对肥胖程度进行划分：\n- 体指数t = w / h2（体重w单位为公斤，身高h单位为米）\n- 当t < 18时，为低体重；\n\
    - 当18 ≤ t < 25时，为正常体重；\n- 当25 < t < 27时，为超重体重；\n- 当t ≥27时，为肥胖。\n\n![](img/7afade9235e9e9d9b1d009051c946346_342_0.png)\n\
    \n## switch\n\n```\n1 switch (表达式)\n2 {\n3     case 整型常量1:\n4         语句1;\n5\
    \     case 整型常量2:\n6         语句2;\n7     default:\n8         语句3;\n9 }\n```\n\n\
    - default可以没有，但最好不要省略\n\n## Demo 1: break problem\n\n```\nint a;\nscanf(\"%d\"\
    ,&a);\nswitch (a){\ncase 1:\nprintf(\"you input 1\\n\");\ncase 2:\nprintf(\"you\
    \ input 2\\n\");\ncase 3:\nprintf(\"you input 3\\n\");\ndefault:\n;\n}\n```\n\n\
    ## switch实例代码\n\n```\n1 switch (c){\n2     case '\\n'\n3     /* I skip break here\
    \ */\n4     case ','\n5         sub();\n6         break;\n7     case '+'\n8  \
    \       add();\n9         break;\n10    default:\n11    break;\n12    ;\n13 }\n\
    ```\n"
