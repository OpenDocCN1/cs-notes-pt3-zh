    \n![](img/7afade9235e9e9d9b1d009051c946346_596_0.png)\n\n## 二维数组的行指针\n\n- int\
    \ (*p)[3];\n- p = a;//用行地址初始化\n- 先逐行查找元素所在行\n- 再在行内逐列查找元素所在位置\n\n```\n1 for (i=0;\
    \ i<m; i++)\n2 for (j=0; j<n; j++)\n3 printf(\"%d\", *(*(p+i)+j));\n```\n\n![](img/7afade9235e9e9d9b1d009051c946346_597_0.png)\n\
