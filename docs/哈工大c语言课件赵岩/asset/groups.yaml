    int BinSearch(long a[], int n, long x){

    int low=0, high=n-1, mid;

    while (low <= high){

    mid = (high + low) / 2;

    if (x > a[mid]){

    low = mid + 1;

    } else if (x < a[mid]){

    high = mid - 1;

    } else{

    return (mid);

    }

    }

    }

