    \n- 编译器在开始正式编译之前处理的指令，叫预编译指令\n  - 编译器编译的是经过预编译处理后的代码\n  - 预编译过程不进行C语法检查\n\n##\
    \ #define\n\n- #define 宏名字 替换文本\n- 在#define之后，所有独立出现“宏名字”的地方（除了字符串内）都被“替换文本”替换\n\
    - “替换文本”中可以有空格\n- 宏可以有参数\n  - #define max(A,B) ((A) > (B) ? (A) : (B))\n- 定义宏的时候注意替换发生后产生的非预期结果\n\
    \  - 用括号可以避免一些非预期结果\n"
