    \ */\n```\n\n## 二维数组的内存布局\n\n- C语言将二维数组看作一维数组，其每个数组元素又是一个一维数组\n- 按行顺序存放所有元素\n\n\
    ```\nint a[2][3];\n```\n\na\n{a[0] {a[0][0] a[0][1] a[0][2]}\na[1] {a[1][0] a[1][1]\
