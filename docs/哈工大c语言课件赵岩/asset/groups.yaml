    # 两种方式的区别


    +   - open族的功能一般由OS直接提供，其使用方式也比较具有通用性，在各种语言里基本一样

    +   - fopen族的函数系包装了open族的函数，提供更强大的功能，但是效率略微

    +   - open族通常情况下直接反映文件的真实情况，因为它的操作都不假定文件的任何结构

    +   - fopen族比较适合处理文本文件，或者结构单一的文件。会为了以处理的方式而改变一些内容'
