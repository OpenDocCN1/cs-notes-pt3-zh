    +   - 文本文件（Text File）

    +     - 所有内容都是可打印字符的文件

    +     - .txt、.c、.h、.htm

    +   - 二进制文件（Binary File）

    +     - <|message|>地反映数据和文件的真面貌，不做任何处理

    +     - .exe、.bmp、.mp3、.jpg、.doc、.swf……'
