    # 基本文件操作的理论意义


    +   - open、read、write、close这种模式成为使用流的经典模式

    +     - 比如网络流操作就是使用此模式，甚至在一些平台上可以和文件采用完全相同的函数操作

    +   - lseek并不支持网络流

    +   - 对于不能进行“流控”的流

    +     - 如果当前数据不能立即处理

    +     - 后来的数据就可能会冲走当前数据

    +     - 于是当前数据丢失

    +   - 流控成为流处理中的一个专门技术

