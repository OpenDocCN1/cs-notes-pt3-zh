    2  srand(time(NULL));\n3  magic = rand() % 100 + 1;\n```\n\n## 编程实例\n\n- 古印度舍罕王决定赏赐他的的宰相达依尔，这位聪明的宰相指着8×8共64格的象棋盘说：陛下，请您赏给我一些麦子吧，就在棋盘的第一个格子中放1粒，第二格中放2粒，第三格放4粒，以后每一格都比前一格增加一倍，依此放完棋盘上的64个格子，我就感恩不尽了。\n\
