    \n## 共用体的大小\n\n- c、s 和 i 处于同样的地址\n- sizeof(union number)\n- 取决于占空间最多的那个成员变量\n\n\
    ```\nunion number\n{\n    char c;\n    short s;\n    int i;\n};\nsizeof(number);\n\
