    ## Apple

    - 1985年，乔布斯被苹果公司开除。

    - 1998年，苹果董事会请回乔布斯。

    - 发明iPod mp3播放器。

    - 推出智能手机iPhone，平板电脑iPad。

    - 依靠创新，苹果完成从电脑生产厂商到高端时尚电子产品制造商的转型。


    ![](img/7afade9235e9e9d9b1d009051c946346_100_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_100_1.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_101_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_101_1.png)


    ## 温拿

    ![](img/7afade9235e9e9d9b1d009051c946346_102_0.png)


    ## 各自的特点

    - 好的商业模式（google，dell）

    - 创新（apple）

    - 内容为王（yahoo，google）

    - 送我上青天（sicio，nokia）

    - 危机感（microsoft）

    - 专一（IBM）


    ## Unix

    - 一切从一个叫“Space Travel”的电子游戏开始……；

    - 为了让他的游戏能在DEC PDP-7上运行，Ken Thompson用汇编语言给PDP-7写了一个操作系统——UNIX；

    - 他在BCPL基础上，自己设计了一个B语言；

    - UNIX开始发展，B也不够用了；

    - Dennis Ritchie加入，把B改造成C，并开始用C重写UNIX；


    ![](img/7afade9235e9e9d9b1d009051c946346_110_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_111_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_112_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_113_0.png)


    ## 杰出的贡献

    ![](img/7afade9235e9e9d9b1d009051c946346_115_0.png)


    ## Unix的不足

    - Unix was like homer, handed down as oral wisdom.

    - The world''s First computer virus.

    - Unix is user-friendly. It just isn''t promiscuous about which users it''s friendly
    with.

    - Like Russian Roulette with Six Bullets Loaded.


    > ——《The Unix Hater Handbook》


    ## 什么是程序

    - 很像厨师的菜谱，定义了执行某个任务所需的步骤

    - 如果计算机是乐队，程序就是乐谱，你就是音乐家

    - 如果计算机是军队，程序就是作战计划，你就是总司令

    - 但不幸的是，你不能使用你自己的母语来写程序


    ![](img/7afade9235e9e9d9b1d009051c946346_120_0.png)

    ![](img/7afade9235e9e9d9b1d009051c946346_121_0.png)

