    +   - 绝对路径（Absolute Path）表示

    +     - 在Unix/Linux下： /home/zhaoyan/main.c

    +     - 在DOS/Windows下： D:\home\zhaoyan\main.c

    +   - 相对路径（Relative Path）表示

    +     - ../main.c


