    +   - 它们定义在POSIX标准中

    +   - POSIX是Unix/Linux等众多操作系统遵循的标准，Windows也有支持POSIX的环境 (Cygwin)

    +   - 在POSIX的世界里具有可移植性

    +   - VC支持它们，但在标识符前加了一个下划线

    +     - _open(), _O_RDWR

    +   - ANSI C有自己的标准的文件操作函数

