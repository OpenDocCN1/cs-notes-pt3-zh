    # 文件的类型


    +   - 文件在外存储就和数据在内存保存一样

    +     - 都是数据二进制形式的保存

    +     - 介质无关数据格式

    +     - 你把数据当作是什么类型，它就是什么类型

    +     - 如果以类A的二进制形式存入，却当作类B读出，就乱套了


    读取文件前，必须精确知道文件每一个字节的确切类型和含义


    +   - 文件格式分类

    +     - 二进制方式和文本方式'
