    # # 文件访问


    +   - **open**: 打开文件，获得对此文件的指针、引用和句柄，等以后通过它们使用此文件

    +   - **read**: 读文件。参数一般指明要读多少字节，读到哪块内存

    +   - **write**: 写文件。参数一般指明把哪块内存的内容写入文件，要写多少字节

    +   - **close**: 关闭文件，表明操作结束，本程序不再使用此文件。open后要及时关闭。

    +   - **lseek**: 临时调整file position

    +     - 表示距离文件头部的偏移量

    +   - read/write结束后，自动加上读/写的字节数'
