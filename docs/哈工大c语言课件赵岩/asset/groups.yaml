    # 文本文件换行符


    +   - DOS/Windows下：

    +     - 用"\r\n"表示换行

    +     - 按文本文件写入"\n", 会自动写入"\r\n"

    +     - 假设文件中有"\r\n"这样的连续字符

    +     - 按文本文件读, 只能得到"\n"

    +   - Unix/Linux下：

    +     - 用"\n"表示换行

    +   - Mac下：

    +     - 用"\r"表示换行

    +     - 写入"\n", 自动改为"\r"

    +     - 读入"\r", 自动转为"\n"'
