    - **close**: 关闭文件，表明操作结束，本程序不再使用此文件。open后要及时关闭。\n- **lseek**: 临时调整file position\n\
    \  - 表示距离文件头部的偏移量\n- read/write结束后，自动加上读/写的字节数\n\n## 打开文件\n\n- pathname是文件路径。可以是绝对或相对路径\n\
    - flags是打开方式，常用为O_RDONLY、O_WRONLY、O_RDWR 及O_TEXT、O_BINARY的或运算\n- 返回值为文件描述符（File\
    \ Descriptor）也叫文件句柄（File Handle），留待以后使用。如果打开失败，返回值为-1\n\n```\n1 int open(const\
    \ char *pathname, int flags);\n2 int fd = open(\"C:\\\\AUTOEXEC.BAT\",\n3    \
    \         O_RDWR | O_CREAT | O_TEXT );\n```\n\n## 读入文件\n\n- fd是open返回的文件描述符\n\
    - 读入的数据将保存在buf指向的内存\n- count是最大允许读入的字节数\n- 返回值为实际读入的字节数，可能小于count，返回-1表示出错\n\n\
    ```\nint read(int fd, void *buf,\n    unsigned int count);\nint n_read = read(fd,\
    \ buf, BUFSIZE);\n```\n\n## 写入文件\n\n- fd is open returned file handle\n- buf points\
    \ to data written to file\n- count is number of bytes written\n- return value\
    \ is actual bytes written, may be smaller than count. Return -1 means error\n\n\
    ```\n```c\nint write(int fd, const void *buf, unsigned int count);\nint n_write\
    \ = write(fd, buf, BUFSIZE);\n```\n```\n\n## 关闭文件\n\n- fd是open返回的文件句柄\n- 关闭成功返回0，否则返回-1\n\
    \n```\n1 int close(int fd);\n2 int ret;\n3 ret = close(fd);\n```\n\n## 文件位置\n\n\
