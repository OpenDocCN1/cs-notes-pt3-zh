  mdcn: "\n## 缺点\n\n- 分配内存不集中，寻址效率不高\n- 对数组进行赋初值时，容易发生错位\n- 结构显得比较零散，不容易管理\n\n## 希望的内存分配图\n\
    \n| 序号 | 姓名 | 性别 | 入学时间 | 计算机 | 英语 | 数学 | 音乐 |\n|---|---|---|---|---|---|---|---|\n\
    | 1 | 令狐冲 | 男 | 1999 | 90 | 83 | 72 | 82 |\n| 2 | 林平之 | 男 | 1999 | 78 | 92 | 88\
    \ | 78 |\n| 3 | 岳灵珊 | 女 | 1999 | 89 | 72 | 98 | 66 |\n| 4 | 任堂堂 | 女 | 1999 | 78\
    \ | 95 | 87 | 90 |\n\n## 结构体的解决方法\n\n```\n1 struct STUDENT {\n2 int studentID;\
    \        /* 每个学生的序号 */\n3 char studentName[10]; /* 每个学生的姓名 */\n4 char studentSex[4];\
    \   /* 每个学生的性别 */\n5 int timeOfEnter;      /* 每个学生的入学时间 */\n6 int scoreComputer;\
    \    /* 计算机原理成绩 */\n7 int scoreEnglish;     /* 英语成绩 */\n8 int scoreMath;     \
    \   /* 数学成绩 */\n9 int scoreMusic;       /* 音乐成绩 */\n10 };\n```\n\n## struct的大小尺寸\n\
    \n- 一个结构变量的成员变量在内存中是相邻的\n- 整个结构变量的将占用多少内存呢？\n  - 是所有成员变量的内存总和吗？\n  - 事实上，所有数据类型在内存中都是从偶数地址开始存放的，并且结构所占的实际空间一般是按照机器字长对齐的\n\
    \  - 不同的编译器、不同的平台，对齐方式会发生变化，不过一般的编译器都可以设定按照最大对齐\n  - 我们可以用sizeof来获得结构的大小\n\n##\
    \ struct 的尺寸\n\n```\nstruct Number {\nchar c;\nshort s;\nint i;\n} num1;\nprintf(\"\
    %d\", sizeof(num1));\n```\n\n## sizeof\n\n- 它是一个C语言的关键字，并不是函数\n- 可以用两种形式使用\n \
    \ - sizeof(表达式) 常用sizeof(变量名)\n  - sizeof(类型)\n- 求出的结果为表达式值所属类型或者类型占用的字节数，类型size_t\n\
    \n## struct的特点\n\n- 一个普通的类型\n  - 可以定义该类型的变量、数组、指针……\n  - 它的成员可以是任意类型\n    - 基本类型、数组、指针、结构…\n\
    \  - 可以做函数的参数类型和返回值类型\n- struct类型的变量\n  - 可以互相赋值\n  - 可以&（取地址）\n  - 不可以参与运算\n\
    - 它的成员也都是如假包换的变量\n- 面向对象和数据库是struct的思想的发展\n\n## 结构体变量定义-1\n\n- 先定义结构体类型再定义变量名\n\
    - 用typedef为已存在的类型定义新名字\n\n```\n1 typedef struct student\n2 {\n3     int     num;\n\
    4     char    name[20];\n5     char    sex;\n6     int     age;\n7     float \
    \  score;\n8     char    addr[30];\n9 } STUD;\n10 STUD student1,student2;\n```\n\
    \n## 结构体变量定义-2\n\n- 定义类型的同时定义变量\n\n```\nstruct student {\nint num;\nchar name[20];\n\
    char sex;\nint age;\nfloat score;\nchar addr[30];\n} student1,student2;\n\nstruct\
    \ student student3;\n```\n\n## 结构体变量定义-3\n\n- 只定义变量不定义类型\n\n```\nstruct\n{\n \
    \   int      num;\n    char     name[20];\n    char     sex;\n    int      age;\n\
    \    float    score;\n    char     addr[30];\n} student1, student2;\n\nstudent3;\
    \ /*difficult to declare */\n```\n\n## 结构体变量定义思考题\n\n```\n```c\n 1  struct student\n\
    \ 2  {\n 3  ...;\n 4  };\n\n 6  struct student zhaoyan;   /* It works? */\n 7\
    \  student zhaoyan;          /* Can this work? */\n\n 9  typedef struct\n10  {\n\
    11  ...;\n12  }student;\n13  student zhaoyan;   /* It works? */\n```\n```\n\n\
    ## 结构体数组声明\n\n```\n1 struct STUDENT{\n2     int      studentID;\n3     char  \
    \   studentName[10];\n4     char     studentSex[4];\n5     struct   date timeOfEnter;\n\
    6     int      scoreComputer;\n7     int      scoreEnglish;\n8     int      scoreMath;\n\
    9     int      scoreMusic;\n10 };\n11 struct STUDENT students[30];\n12 students[0].studentName;\n\
    13 students[0].studentSex;\n```\n\n## 结构体指针\n\n```\n```c\nstruct point\n{\n  \
    \  int x;\n    int y;\n};\nstruct point  pt;   /*定义结构体变量*/\nstruct point *ppt;\
    \  /*定义结构体指针*/\nppt = &pt;\npt.x = 0;            /*成员运算符*/\n(*ppt).x = 0;\nppt->x\
    \ = 0;          /*指针运算符*/\n```\n```\n\n## 结构体数组和指针\n\n```\n1 struct STUDENT *pt;\
    \ int i;\n2 float sum[4] = {0.0}, average[4] = {0.0};\n3 char *name[] = {\"Computer\"\
    , \"English\",\n4 \"Math\", \"Music\"};\n5 pt = students; /*pt指向结构体数组的第一个元素*/\n\
    6 for (pt=students; pt<students+30; pt++){\n7 sum[0] = sum[0] + pt->scoreComputer;\n\
    8 sum[1] = sum[1] + pt->scoreEnglish;\n9 sum[2] = sum[2] + pt->scoreMath;\n10\
    \ sum[3] = sum[3] + pt->scoreMusic;\n11 }\n12 for (i=0; i<4; i++){\n13 average[i]\
    \ = sum[i]/30;\n14 printf(\"%20s : %4.2f\\n\", name[i], *(average+i))\n```\n\n\
    ## 结构体变量引用-成员运算符\n\n结构体变量.成员名\n\n```\n```c\ntypedef struct student\n{\n    int\
    \    num;\n    char   name[20];\n} STUD;\nSTUD student1,student2;\nstudent1.num\
    \ = 1;\nstrcpy(student2.name,\"zhao yan\");\n```\n```\n\n## 结构体变量引用-箭头运算符\n\n\
