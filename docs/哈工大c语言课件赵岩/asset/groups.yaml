    \n## 递归的定义\n\n- 函数直接或间接调用自己为递归\n- 缺点\n  - 递归太多层易导致栈空间溢出\n- 优点\n  - 简单的思路解决复杂的问题\n\
    \n```\n1 unsigned long func(unsigned int n)\n2 {\n3 if (n == 0)\n4 return 1;\n\
    5 else\n6 return n * func(n-1);\n7 }\n```\n\n## 汉诺塔源码\n\n## Demo 2: Hanoi source\
    \ code\n\n```\nvoid hanoi(int n,char A,char B,char C)\n{\nif(n==1)\n{\nprintf(\"\
    Move disk %d from %c to %c\\n\",n,A,C);\n}\nelse\n{\nhanoi(n-1,A,C,B);\nprintf(\"\
    Move disk %d from %c to %c\\n\",n,A,C);\nhanoi(n-1,B,A,C);\n}\n}\n```\n\n## 存储类型\n\
    \n- 一个完整的变量说明格式如下：\n  - 存储类型　数据类型　变量名\n  - `static int x;`\n\n- C程序的存储类型有：\n \
    \ - `auto`型（自动变量型）\n  - `static`型（静态变量型）\n  - `register`型（寄存器型）\n\n## auto自动变量\n\
    \n- “自动”体现在\n  - 省去的存储类型\n  - 进入语句块时自动申请内存，退出时自动释放内存\n\n- 标准定义格式\n  - auto 类型名\
    \ 变量名;\n  - 不初始化时，值是不确定的\n\n## 自动变量例子\n\n## Demo 3: auto variable example\n\n\
    ```\n1 void Func(void){\n2   int times = 1;\n3   printf(\"Func() was called\n\
    4   %d times.\\n\", times++);\n5 }\n6 main()\n7 {\n8   int i;\n9   for (i=0; i<10;\
    \ i++){\n10    Func();\n11  }\n12 }\n```\n\n## 寄存器变量\n\n- 寄存器是CPU内的高速但容量有限的存储器\n\
    \n- 使用频率比较高的变量声明为register，可以使程序更小、执行速度更快\n  - register 类型名 变量名;\n  - register\
    \ int i;\n\n- 它只是一个建议\n  - 编译器有最终权利决定变量是否是register\n  - 编译器的决定往往更科学，不需要我们人为制定。\n\
    \n## 静态变量\n\n- 静态变量自动初始化为0\n- 变量定义为static，则变量一直保持，不会伴随函数调用时的栈帧消失\n\nDemo 3: static\
    \ variable example\n\n```\n1 main()\n2 {\n3     static int i;\n4     printf(\"\
    %d\",i);  /* output 0 */\n5 }\n```\n\n- 源程序中定义变量的位置及其能被读写访问的范围\n  - 局部变量(Local\
    \ Variable)\n  - 全局变量(Global Variable )\n\n## 局部变量\n\n- 局部变量\n  - 函数内部定义的变量\n\
    \  - 在语句块内定义的变量\n  - 形参也是局部变量\n- 特点\n  - 定义时不会自动初始化，除非程序员指定初值\n  - 进入语句块时获得内存，仅能由语句块内语句访问，退出语句块时释放内存，不再有效\n\
    \  - 并列语句块各自定义的同名变量互不干扰\n\n## 全局变量\n\n- 全局变量\n  - 在所有函数之外定义的变量\n  - 从程序运行起时即占据内存，程序运行过程中可随时访问，程序退出时释放内存\n\
    - 特点\n  - 在程序中定义它的位置以后都有效\n  - 在定义点之前或在其他文件中引用，应该进行如下声明：extern 类型名 变量名;\n  - 使函数之间的数据交换更容易，也更高效\n\
    \  - 但并不能推荐使用，因为谁都可以改写全局变量，封装性差。\n\n## 存储类型总结\n\n- 静态存储区中的变量\n  - 与程序“共存亡”\n-\
    \ 动态存储区中的变量\n  - 与语句块“共存亡”\n- 寄存器中的变量\n  - 动态存储区\n\n![](img/7afade9235e9e9d9b1d009051c946346_438_0.png)\n\
    \n## assert\n\n- 各唤：断言\n- assert(int expression)\n  - expression为真，无声无息；\n  -\
    \ expression为假，中断程序。\n- 用来测试某些可能发生的状态确实不会发生\n  - Debug版有效\n  - Release版失效\n- 只为调试程序用，不可作为程序的功能\n\
    \n## 总结\n\n变量的分类\n存储类型\n作用域\n函数\n函数概述\n结构化设计\n递归调用\n优点\n缺点\n函数基本知识\n声明\n定义\n调用\n\
    \n谢谢大家，欢迎提问！\n\n## C语言\n\n第6讲：预处理指令和模块化编程\n\n赵岩\n\n哈尔滨工业大学软件学院\n\nMarch 6, 2011\n\
