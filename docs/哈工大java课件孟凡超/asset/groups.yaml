    \        \n        Student s3=new Student(\"lisi\");\n        System.out.println(\"\
    name=\"+s3.name+\" age=\"+s3.age);\n    }\n}\n```\n\n## 5.4 子类\n\n一般\n\n具体\n\n\
    ![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_173_0.png)\n\n### “is a” 关系\n\n```\n\
    public class Employee {\n    private String name;\n    private Date hireDate;\n\
    \    private Date dateOfBirth;\n    private String jobTitle;\n    private int\
    \ grade;\n}\n```\n\n```\npublic class Manager {\n    private String name;\n  \
    \  private Date hireDate;\n    private Date dateOfBirth;\n    private int grade;\n\
    \    private String department;\n    private Employee[] subordinates;\n}\n```\n\
    \nManager和Employee之间存在 “is a” 关系，即，Manager is a Employee。\n\n### extends关键字\n\n\
    派生机制：面向对象语言提供了派生机制，它允许用以前的类来定义一个新类，新类称为子类，原来的类称作父类或超类。两类中公共的内容放到父类中，特殊的内容放到子类中。\n\
    \nextends关键字：在Java中，用关键字extends表示派生。其格式如下：\n\n```\npublic class A extends B{\n\
    ......\n}\n```\n\n类A派生于类B，A为子类，B为父类。如果一个类的定义中没有出现extends关键字，则表明这个类派生于Object类，Object类是Java中预定义的任何类的父类。\n\
    \n```\npublic class Employee {\n    private String name;\n    private Date hireDate;\n\
    \    private Date dateOfBirth;\n    private String jobTitle;\n    private int\
    \ grade;\n}\n```\n\n```\npublic class Manager extends Employee{\n    private String\
    \ department;\n    private Employee[] subordinates;\n}\n```\n\n### 单重继承\n\nJava只允许从一个类中扩展类，这种限制称为单重继承。Java规定单重继承的限制，是让代码的可靠性更高。\n\
    \n```\npublic class A {\n    public void f(){\n        ...\n    }\n}\n```\n\n\
    ```\npublic class B{\n    public void f(){\n        ...\n    }\n}\n```\n\n如果类C派生于类A和类B，这样类A和类B中的方法f都可以延伸到类C中，那么哪个才是类C的实例真正调用的方法呢？这显然容易引起混淆。\n\
    \nObject类是Java程序中所有类的直接或间接父类。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_178_0.png)\n\
    \n### Object类中主要方法：\n\n- public final Class getClass(): 获取当前对象所属的类信息。\n- public\
    \ String toString(): 按字符串对象返回当前对象本身的有关信息。\n- public boolean equals(Object obj):\
    \ 比较两个对象是否是一个对象，是返回true，否则返回false。\n- protected Object clone(): 生成当前对象的一个复制，并返回这个复制对象。\n\
    - public int hashCode(): 返回该对象的哈希代码值。\n- protected void finalize() throws Throwable:\
    \ 定义回收当前对象时所需要完成的资源释放工作。\n\n### ■ 多态性\n\n- ➢ 继承关系使一个子类继承父类的特征，并可以附加一些自己的新特征。\n\
    - ➢ 子类是父类的某种专门化，每一个子类的实例都是父类的实例，但是反过来不行。例如，圆是一个对象，但不是每个对象都是圆。因此，对于需要父类类型的参数，总可以传入子类的实例。\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_180_0.png)\n"
