    # ■ 1. 操作数


    # ➢ 常量


    在Java语言中，主要是利用 `final` 关键字来进行常量定义。当常量被定义后，是不允许修改的。

    例如：

    ```java

    final double PI=3.1415926;

    final String USERNAME="mfc";

    ```


    # ✓ 常量定义需要注意内容：


    +   - 在定义常量的时候，就需要对其进行初始化，此后，应用程序中无法再次对这个常量进行赋值。

    +   - `final` 关键字不仅可以用来修饰基本数据类型常量，还可以用来修饰对象的引用或方法。'
