    \ {\n        // 普通雇员\n    }\n}\n```\n\n## 5.5 方法重写\n\n### 方法重写\n\n- 如果子类不需要使用从父类继承来的方法的功能，可以定义自己的方法，这就是**重写**的概念，也称为**方法的隐藏**。\n\
