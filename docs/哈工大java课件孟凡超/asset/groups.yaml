  md: "\n## 4.1 数组\n### 多维数组的引用\n\n在定义并初始化多维数组后，可以使用多维数组中的每个元素。多维数组的引用方式为(以二维为例):\n\
    \n```\narrayName[index1][index2]\n```\n\n```\nint intArray[][]=new int[3][4];\n\
    intArray[0][0]=1;\nintArray[0][1]=2;\nintArray[0][2]=3;\n```\n\n### 数组复制\n\n```\n\
    int elements[]={1,2,3,4,5};\nint hold[]={6,7,8,9,10,11,12};\nSystem.arraycopy(elements,\
    \ 0, hold, 0, elements.length);\nfor(int i=0;i<elements.length;i++){\n    System.out.print(elements[i]+\"\
    \ \");\n}\nSystem.out.print(\"\\n\");\nfor(int j=0;j<hold.length;j++){\n    System.out.print(hold[j]+\"\
    \ \");\n}\n```\n\n将elements中第1个(下标为0)到第elements.length个元素依次放到hold中下标从0开始的各个位置，即第1位到第5位。执行完毕，数组hold的内容为：\n\
    \n1,2,3,4,5,11,12\n\n## 4.2 Vector类\n\nJava中的数组只能保存固定数目的元素，且必须把所有需要的内存单元一次性的申请出来，而不能先创建数组再追加数组元素数量，为了解决这个问题Java中引入了向量类Vector。\n\
    \nVector也是一组对象的集合，但相对于数组，Vector可以追加对象元素数量，可以方便的修改和维护序列中的对象。\n\n➤向量比较适合在如下情况使用：\n\
    \n- ✓需要处理的对象数组不定，序列中的元素都是对象或可以表示为对象。\n- ✓需要将不同类的对象组合成一个数据序列。\n- ✓需要做频繁的对象序列中元素的插入和删除。\n\
    - ✓经常需要定位序列中的对象和其他查找操作。\n- ✓在不同的类之间传递大量的数据。\n- ✓Vector类的局限性是其中的对象不能是简单数据类型。\n\n\
    ### Vector类的构造方法\n\n- ✓ public Vector(): 构造一个空向量。\n- ✓ public Vector(int initialCapacity):\
    \ 以指定的初始存储容量initialCapacity构造一个空向量vector。\n- ✓ public Vector(int initialCapacity,\
    \ int capacityIncrement): 以指定的初始存储容量initialCapacity和容量增量capacityIncrement构造一个空向量vector。\n\
    \n```\n```java\nVector MyVector=new Vector(100,50);\n```\n```\n\n该语句创建的MyVector向量序列初始有100个元素空间，以后一旦空间用尽则以50为单位递增，使序列中元素的个数变化成150，200，….\
    \ 在创建Vector序列时，不需要指明序列中元素的类型，可以在使用时确定。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_144_0.png)\n\
    \n### Vector类对象的操作\n\n元素的添加\n\n- ✓ addElement(Object obj): 将新元素添加到序列尾部。\n- ✓ insertElementAt(Object\
    \ obj, int index): 将指定对象 obj插入指定位置index位置。\n\n```\nVector MyVector=new Vector();\n\
    for (int i=1;i<=10;i++){\n    MyVector.addElement(new Random());\n}\nMyVector.insertElementAt(\"\
    middle\",5);\n```\n\n元素的删除\n\n- setElementAt(Object obj, int index): 将向量序列 index位置处的对象元素设置为obj，如果这个位置原来有元素，则将被新值覆盖。\n\
    - removeElement(Object obj): 删除向量序列中第一个与指定的obj对象相同的元素，同时将后面的元素向前提，补上空位。\n- removeElement(int\
    \ index): 删除index指定位置处的元素，同时将后面的元素向前提。\n- removeAllElements(): 清除向量序列中的所有元素，同时向量的大小置为0。\n\
    \n### 元素的查找\n\n- Object elementAt(int index): 返回指定位置处的元素。这个方法返回值是Object类型的对象，在使用之前通常需要进行强制类型转换，将返回的对象引用转换成Object类的某个具体子类对象。\n\
    - boolean contains(Object obj): 检查向量序列中是否包含指定的对象元素obj。\n- int indexOf(Object obj,\
    \ int start_index): 从指定的 start_index位置开始向后搜索，返回所找到的第一个与指定对象obj相同的元素的下标位置。若指定的对象不存在，则返回-1。\n\
    - int lastIndexOf(Object obj, int start_index): 从指定的 start_index位置开始向前搜索，返回所找到的第一个与指定对象obj相同的元素的下标位置。若指定的对象不存在，则返回-1。\n\
    \n### Vector类中的其他方法\n\n- public final int size()：返回向量中的元素数量。\n- public final boolean\
    \ contains(Object elem)：如果对象elem是向量中的一个元素值，则返回true，否则返回false。\n- public final\
    \ int indexOf(Object elem)：从向量的第一个元素开始查找指定对象，并返回该对象的索引值。\n- capacity()：返回Vector的容量。\n\
    - clone()：建立Vector的备份。\n- copyInto(Object[])：把Vector中的元素复制到一个数组中。\n\n- firstElement():\
    \ 返回第一个元素。\n- lastElement(): 返回最后一个元素。\n- isEmpty(): 判断是否为空。\n- setSize(): 设置Vector的大小。\n\
    - trimToSize(): 将Vector的容量下调至最小值。\n\n## 4.3 字符串类型\n\n字符串是内存中连续排列的一个或多个字符。Java提供的标准包java.lang中封装了类String和StringBuffer，分别用来处理不变字符串和可变字符串。不变字符串是指一旦创建，其内容就不能改变。对于那些需要改变内容并有许多操作的字符串，可以使用StringBuffer。\n\
    \n### 字符串说明及初始化\n\n- > Java中的字符串分为常量和变量两种。\n- > 系统为程序中出现的字符串常量自动创建一个String对象，如：\
    \ System.out.println(\"Hello World!\");将创建\"Hello World!\"对象，这个创建是隐含的。\n- > 对于字符串变量，在使用之前要显式说明，并进行初始化。\n\
    \n```\nString s;\nStringBuffer sb1;\nString s1=new String();\n```\n\n```\nchar\
    \ chars[]={'a','b','c'};\nString s2=new String(chars);\nString s3=\"abc\";\n```\n\
    \n### ■字符串处理\n\nString类中常用的方法：\n\n- ✓ length(): 返回字符串中的字符个数。\n- ✓ charAt(int index):\
    \ 返回字符串中index位置的字符。\n- ✓ toLowerCase(): 将当前字符串中的所有字符转换为小写形式。\n- ✓ toUpperCase():\
    \ 将当前字符串中的所有字符转换为大写形式。\n\n- ✓ subString(int beginIndex)：截取当前字符串中从 beginIndex 开始到末尾的子串。\n\
    - ✓ subString(int beginIndex, int endIndex)：截取当前字符串中从 beginIndex 开始到 endIndex\
    \ 结尾的子串。\n- ✓ replace(char oldChar, char newChar)：将当前字符串中出现的所有 oldChar 转换为 newChar。\n"
