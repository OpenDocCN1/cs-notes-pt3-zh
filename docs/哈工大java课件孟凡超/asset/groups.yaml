    \            byte b[]={65,66,67,68,69,70};\n            System.out.println(\"\\\
    nNow I start work......\\n\");\n            System.out.println(\"transfer data\
    \ to pos. \\n\");\n            pos.write(b);\n            while(pis.available()>0){\n\
    \                System.out.print((char)pis.read()+\" \");\n            }\n  \
    \          pis.close();\n            pos.close();\n        }catch(IOException\
    \ e){\n            System.out.println(\"Error;cannot read from file.\");\n   \
    \     }\n    }\n}\n```\n\n### 对象流\n\n- 能够输入输出对象的流称为对象流。\n- 通过 ObjectInputStream\
    \ 和 ObjectOutputStream 两个类实现对象流。\n\n#### 写对象数据流\n\n```\nCustomer c=new Customer();\n\
    FileOutputStream f=new FileOutputStream(\"D:/java/f.txt\");\nObjectOutputStream\
    \ s=new ObjectOutputStream(f);\ntry{\n    s.writeObject(c);\n    s.close();\n\
    }catch(IOException e){\n    e.printStackTrace();\n}\n```\n\n#### 读对象数据流\n\n```\n\
    Customer c=null;\nFileInputStream f=new FileInputStream(\"D:/java/f.txt\");\n\
    ObjectInputStream s=new ObjectInputStream(f);\ntry{\n    c=(Customer)s.readObject();\n\
    \    s.close();\n}catch(IOException e){\n    e.printStackTrace();\n}\n```\n\n\
    ### 可持续性\n\n- **持续性：** 记录自己的状态以便将来再生的能力，叫做对象持续性。\n- **持续化：** 对象通过写出描述自己状态的数值来记录自己的过程叫做持续化(或串行化)。\n\
    - **Serializable接口：** 当一个对象声明实现Serializable接口时，表明该类加入了对象串行化协议。\n- **对象输出/输入流：**\
    \ 要串行化一个对象，必须与特定的对象输出输入流联系起来，通过对象输出流将对象状态保存下来，之后再通过对象输入流将对象状态恢复，这一功能是通过ObjectOutputStream和ObjectInputStream实现的。\n\
    \n### 对象存储、恢复示例\n\n1. 定义可持久化类：\n\n```java\npackage example.chapter_10;\nimport\
    \ java.io.*;\npublic class Student implements Serializable {\n    int id;\n  \
    \  String name;\n    int age;\n    String department;\n    public Student(int\
    \ id,String name,int age,String department){\n        this.id=id;\n        this.name=name;\n\
    \        this.age=age;\n        this.department=department;\n    }\n}\n```\n\n\
    2. 对象存储程序：\n\n```\npackage example.chapter_10;\nimport java.io.*;\n//对象的存储\npublic\
    \ class ObjectSer {\n    public static void main(String[] args) {\n        Student\
    \ stu1=new Student(981036,\"Zhangsan\",20,\"CS\");\n        Student stu2=new Student(981037,\"\
    Lisi\",21,\"CS\");\n        Student stu3=new Student(981038,\"Wanger\",21,\"CS\"\
    );\n        try{\n            FileOutputStream fo=new FileOutputStream(\"D:/java/stu.ser\"\
    );\n            ObjectOutputStream so=new ObjectOutputStream(fo);\n          \
    \  so.writeObject(stu1);\n            so.writeObject(stu2);\n            so.writeObject(stu3);\n\
    \            so.close();\n        }catch(Exception e){\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n3. 对象恢复程序：\n\n```\npackage example.chapter_10;\n\
    import java.io.*;\n//对象恢复\npublic class ObjectRecov {\n    public static void\
    \ main(String[] args) {\n        Student stu1=null,stu2=null,stu3=null;\n    \
    \    try{\n            FileInputStream fi=new FileInputStream(\"D:/java/stu.ser\"\
    );\n            ObjectInputStream si=new ObjectInputStream(fi);\n            stu1=(Student)si.readObject();\n\
    \            stu2=(Student)si.readObject();\n            stu3=(Student)si.readObject();\n\
    \        }catch(Exception e){\n            e.printStackTrace();\n        }\n \
    \       System.out.println(\"id=\"+stu1.id+\" name=\"+stu1.name+\n           \
    \     \" age=\"+stu1.age+\" department=\"+stu1.department);\n        System.out.println(\"\
    id=\"+stu2.id+\" name=\"+stu2.name+\n                \" age=\"+stu2.age+\" department=\"\
    +stu2.department);\n        System.out.println(\"id=\"+stu3.id+\" name=\"+stu3.name+\n\
    \                \" age=\"+stu3.age+\" department=\"+stu3.department);\n    }\n\
    }\n```\n\n- 串行化只能保存对象的非静态成员变量，而不能保存任何成员方法和静态成员变量，而且保存的只是变量的值，对于变量任何修饰都不能保存。\n\
    - 对于不可持续化的成员变量，用关键字transient标记。\n- 当数据变量是一个对象时，该对象的数据成员也可以被持久化。对象的数据结构或结构树，包括其子树在内，构成了这个对象的结构表。\n"
