    \ String[] list(): 列出符合模式的文件名\n\n## 10.4 文件的处理\n\n- 类 RandomAccessFile 来处理文件中随机内容的输入输出\n\
    - 创建一个随机访问文件\n- 使用文件名\n\n决定是以只读方式（\"r\"）还是以读写方式(\"rw\")访问文件\n\n```\nmyRAFile=new\
    \ RandomAccessFile(String name, String mode);\nmyRAFile=new RandomAccessFile(\"\
    file1.txt\", \"r\");\n```\n\n```\nmyRAFile=new RandomAccessFile(File file, String\
    \ mode);\nFile myFile= new File(\"mymotd\");\nmyRAFile=new RandomAccessFile(myFile,\
    \ \"rw\");\n```\n"
