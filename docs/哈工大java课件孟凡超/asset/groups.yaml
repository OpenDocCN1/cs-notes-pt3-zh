    \    determine its size; //确定文件大小\n    allocate that much memory; //分配适当的内存空间\n\
    \    read-file; //读文件\n    closeTheFile; //关闭文件\n}\n```\n\n> 为了加强程序的鲁棒性，程序设计时必须考虑到可能发生的异常事件并做出相应的处理。\n\
    \n```\n{\n    openTheFile;\n    if(theFileOpen){\n        determine the length\
    \ of the file;\n        if(gotTheFileLength){\n            allocate that much\
    \ memory;\n            if(gotEnoughMemory){\n                read the file into\
    \ memory;\n                if(readFailed) errorCode==-1;\n                else\
    \ errorCode==-2;\n            }else errorCode==-3\n        }else errorCode==-4;\n\
    \    }else errorCode==-5\n}\n```\n\n虽然程序的鲁棒性加强了，但程序的结构臃肿，大量的错误处理代码混杂在其中，可读性差，目标程序也会增大许多。\n\
    \n```\n{\n    try{\n        openTheFile; //打开一个文件\n        determine its size;\
    \ //确定文件大小\n        allocate that much memory; //分配适当的内存空间\n        read-file;\
    \ //读文件\n        closeTheFile; //关闭文件\n    }\n    catch(fileopenFailed){//文件打开失败的处理代码}\n\
    \    catch(sizeDetermineFailed){//不能获得文件大小的处理代码}\n    catch(memoryAllocateFailed){//内存分配失败的处理代码}\n\
    \    catch(readFailed){//读文件失败的处理代码}\n    catch(fileCloseFailed){//关闭文件失败的处理代码}\n\
    \    finally{//需要统一处理的代码}\n}\n```\n\nJava提供了异常处理机制。在编写程序时，不需要像前面的例子书写判断语句，简化了代码的编写。有些常见的异常可以统一处理，提高了效率，代码重用率高。\n\
    \n### 异常机制优点\n\n- > 它可以让程序员把异常处理代码从常规代码中分离出来，增加了可读性，方便修改。\n- > 程序员可以按异常类型和差别进行分组，即从预定义的类Exception中派生出自己的子类，对无法预测的异常也可以进行捕获和处理，克服了传统方法中错误信息有限的问题。\n\
    - > 异常的处理借助于调用堆栈按先近后远的原则进行。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_227_0.png)\n\
    \n### 6.2 异常示例\n\n```\npublic class HelloWorld {\n\n    /**\n     * @param args\n\
    \     */\n    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n        int i=0;\n        String greetings[]={\n            \"\
    abc\",\"def\",\"ghig\",\"lmn\"\n        };\n        while(i<=4){\n           \
    \ System.out.println(greetings[i]);\n            i++;\n        }\n    }\n}\n```\n\
    \n```\nabc\ndef\nghig\nlmn\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\n    at charpter_1.charpter_11.HelloWorld.main(HelloWorld.java:22)\n```\n\n\
    ### 6.3 异常处理\n\n### try, catch和finally语句\n\n```\ntry{\n    //此处为抛出具体异常的代码\n}catch(ExceptionType1\
    \ e){\n    //抛出ExceptionType1异常时要执行的代码\n}catch(ExceptionType2 e){\n    //抛出ExceptionType2异常时要执行的代码\n\
    }\n.....\ncatch(ExceptionTypek e){\n    //抛出ExceptionTypek异常时要执行的代码\n}finally{\n\
    \    //必须要执行的代码\n}\n}\n```\n\n```\npublic class HelloWorld {\n    /**\n     *\
    \ @param args\n     */\n    public static void main(String[] args) {\n       \
    \ // TODO Auto-generated method stub\n        int i=0;\n        String greetings[]={\n\
    \            \"abc\",\"def\",\"ghig\",\"lmn\"\n        };\n        while(i<=4){\n\
    \            try{\n                System.out.println(greetings[i]);\n       \
    \     }catch(ArrayIndexOutOfBoundsException e){\n                System.out.println(\"\
    Resettin Index Value\");\n            }catch(Exception e){\n                System.out.println(e.toString());\n\
    \            }finally{\n                System.out.println(\"This is always printed\"\
    );\n            }\n            i++;\n        }\n    }\n}\n```\n\n```\nabc\nThis\
    \ is always printed\ndef\nThis is always printed\nghig\nThis is always printed\n\
    lmn\nThis is always printed\nResettin Index Value\nThis is always printed\n```\n\
    \n### 公共异常\n\nArithmeticException：整数除法中，如果除数为0，则发生该类异常。下面表达式将引发ArithmeticException异常。\n\
    \n```\nint i=12/0;\n```\n\nNullPointerException：如果一个对象还没有初始化，那么访问该对象或调用它的方法将导致该异常。例如：\n\
    \n```\nimage im[]=new image[4];\nSystem.out.println(im[0].toString);\n```\n\n\
    - > **NegativeException：** 创建数组时，如果元素个数是个负数，则会引发NegativeException异常。\n- > **ArrayIndexOutOfBoundsException：**\
    \ 如果数组下标越界，将会导致ArrayIndexOutOfBoundsException异常。\n- > **ArrayStoreException：**\
    \ 程序试图存取数组中错误的数据类型。\n- > **FileNotFoundException：** 试图存取一个并不存在的文件时发生该异常。\n- >\
    \ **IOException：** 该异常是指通常的I/O错误。\n"
