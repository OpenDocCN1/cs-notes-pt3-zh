    \        m(new Student());\n        m(new Person());\n        m(new Object());\n\
    \    }\n\n    public static void m(Object x) {\n        System.out.println(x.toString());\n\
    \    }\n}\n```\n\n方法 `m` 采用 `Object` 型参数，所以可以用任何对象作为参数调用方法 `m`。\n\n```text\nStudent\n\
