    # 4.2 Vector类


    ➤向量比较适合在如下情况使用：


    +   ✓需要处理的对象数组不定，序列中的元素都是对象或可以表示为对象。

    +   ✓需要将不同类的对象组合成一个数据序列。

    +   ✓需要做频繁的对象序列中元素的插入和删除。

    +   ✓经常需要定位序列中的对象和其他查找操作。

    +   ✓在不同的类之间传递大量的数据。

    +   ✓Vector类的局限性是其中的对象不能是简单数据类型。'
