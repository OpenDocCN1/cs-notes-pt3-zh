  mdcn: "\n## 7.3 布局\n\n### ■ Java平台布局管理器\n\n- ➢ 容器中包含了组件，组件的布局(位置/大小)通常由布局管理器负责安排。\n\
    - ➢ 每个容器(例如，JPanel或者顶层容器的内容窗格)都有一个默认的布局管理器，Java程序的开发者可以通过容器的setLayout()方法改变容器的布局管理器。\n\
    - ➢ Java平台的主要布局管理器包括：FlowLayout、BorderLayout、GridLayout、CardLayout、BoxLayout、SpringLayout等。\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_248_0.png)\n\n## 7.3 布局\n\n### (1)FlowLayout布局管理器\n\
    \n对容器中组件进行布局的方式是将组件逐个地安放在容器中的一行上，一行放满后就另起一个新行。\n\nFlowLayout的构造方法：\n\n```\npublic\
    \ FlowLayout();\npublic FlowLayout(int align);\npublic FlowLayout(int align, int\
    \ hgap, int vgap);\n```\n\nAlign设定组件的对齐方式，取值有FlowLayout.LEFT、FlowLayout.RIGHT和FlowLayout.CENTER三种方式，分别表示左对齐、右对齐、居中。\n\
    \nhgap、vgap设定组件的水平和垂直间距。\n\n```\npackage example;\nimport java.awt.*;\n\npublic\
    \ class FlowLayoutDemo {\n    private JFrame frame;\n    private JButton button1,button2,button3;\n\
    \    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n        FlowLayoutDemo that=new FlowLayoutDemo();\n        that.go();\n\
    \    }\n    public void go(){\n        frame=new JFrame(\"Flow Layout\");\n  \
    \      Container contentPane=frame.getContentPane();\n        //为内容容器设置FlowLayout布局管理器\n\
    \        contentPane.setLayout(new FlowLayout(FlowLayout.LEFT,20,40));\n     \
    \   button1=new JButton(\"Ok\");\n        button2=new JButton(\"Cancel\");\n \
    \       button3=new JButton(\"Close\");\n        contentPane.add(button1);\n \
    \       contentPane.add(button2);\n        contentPane.add(button3);\n       \
    \ frame.setSize(400,200);\n        frame.setVisible(true);\n    }\n}\n```\n\n\
