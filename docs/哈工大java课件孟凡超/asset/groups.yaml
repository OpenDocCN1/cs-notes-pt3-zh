  - '[PAGE 253]


    # 7.3 布局


    # GridLayout布局管理器


    是一种网格式的布局管理器，它将容器空间划分成若干行乘若干列的网格，组件依次放入其中，每个组件占据一格。


    # GridLayout的构造方法：


    ```

    public GridLayout();

    public GridLayout(int rows, int cols);

    public GridLayout(int rows, int cols, int vgap);

    ```


    +   - rows和cols分别指定网格的行数和列数。

    +   - hgap和vgap分别表示网格间的水平间距和垂直间距。'
