    - ✓ 为了创建实例的方便，一个类可以有具有不同参数列表的构造方法，即构造方法可以重载。\n\n```\npublic class Date {\n   \
    \ private int day,month,year;\n    //带参数的构造方法\n    Date(int day,int month,int\
    \ year){\n        this.day=day;\n        this.month=month;\n        this.year=year;\n\
    \    }\n    //构造方法，显式初始化\n    Date(){\n        day=1;\n        month=1;\n    \
    \    year=1998;\n    }\n    //带参数的构造方法\n    Date(Date d){\n        day=d.day;\n\
    \        month=d.month;\n        year=d.year;\n    }\n}\n```\n\n```\nDate d1=new\
    \ Date();\nDate d2=new Date(1,9,2013);\nDate d3=new Date(d2);\n```\n\n### ✓构造方法特性\n\
    \n- 构造方法的名字与类名相同。\n- 没有返回类型。\n- 通常要说明为public类型，即共有的。\n- 必须为所有的变量赋初值。\n- 可以按需要包含所需的参数列表。\n\
