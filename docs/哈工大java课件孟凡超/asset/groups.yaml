    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_205_0.png)\n\n```\npublic class Count\
    \ {\n    int serialNumber;\n    static int counter=0;\n    public Count(){\n \
    \       counter++;\n        serialNumber=counter;\n    }\n}\n```\n\n```\npublic\
    \ class UseStatic {\n    /**\n     * @param args\n     */\n    public static void\
    \ main(String[] args) {\n        // TODO Auto-generated method stub\n        System.out.println(\"\
    Count.counter=\"+Count.counter);\n        Count Tom=new Count();\n        Count\
    \ John=new Count();\n        System.out.println(\"Tom.serialNumber=\"+Tom.serialNumber);\n\
    \        System.out.println(\"John.serialNumber=\"+John.serialNumber);\n     \
    \   System.out.println(\"Now Count.counter=\"+Count.counter);\n    }\n}\n```\n\
    \nCount.counter=0\nTom.serialNumber=1\nJohn.serialNumber=2\nNow Count.counter=2\n\
    \n直接使用类名指向静态变量\n\n### 类方法(静态方法)\n\n在程序设计中，如果需要在尚未创建一个对象实例的时候就去引用它的程序代码，那么标记上关键字static，这样的方法称为类方法或静态方法。\n\
    \n```\npublic class GeneralFunction {\n    public static int addUp(int x,int y){\n\
    \        return x+y;\n    }\n    public static int centigradeToFahrenheit(int\
    \ cent){\n        return (cent*9/5+32);\n    }\n}\n```\n\n```\npublic class UseGeneral\
    \ {\n    int x;\n    /**\n     * @param args\n     */\n    public static void\
    \ main\n    // TODO Auto-generated method stub\n    int a=9,b=10;\n    int c=GeneralFunction.addUp(a,b);\n\
    \    System.out.println(\"c=\"+c);\n    x=10;\n```\n\n由于静态方法在没有定义它所属的类的对象的情况下加以调用，故不存在this值。\n\
    \n一个静态方法只能使用其内部定义的参数或静态变量，如果企图使用非静态变量将引起编译错误。\n\n直接使用类名指向静态方法\n\nCannot make a\
    \ static reference to the non-static field x\n\n## 5.8关键字final\n\n- final可以修饰类或类的成员(成员变量或成员方法)。\n\
    - 用final修饰的类或类成员是不能改变的。如果一个方法被定义为final，则不能被重写，如果一个类被定义为final，它不能有子类。\n\n### 终极类\n\
    \n- 被标记为final的类称为终极类，其声明格式如下：\n\n```\nfinal class finalClassName{\n    ...\n}\n\
    ```\n\n终极类不能被继承\n\n### 终极方法\n\n被标记为final的方法称为终极方法，其声明格式如下：\n\n```\nfinal returnType\
    \ finalMethod ([paramlist]){\n    ...\n}\n```\n\n终极方法不能被重写\n\n```\nclass FinalMehodClass{\n\
    \    final void finalMethod(){\n        //代码\n    }\n}\n\nclass OverloadClass\
    \ extends FinalMehodClass{\n    final void finalMethod(){\n        //代码\n    }\n\
    }\n```\n\nMultiple markers at this line\n- overrides example.chapter_4.chapter_43.FinalMehodClass.finalMethod\n\
    - Cannot override the final method from FinalMehodClass\n\n### 终极变量\n\n- 被标记为final的变量称为终极变量。终极变量是一个常量，企图改变终极变量的取值将会引起编译错误。\n\
    - 如果将一个引用类型的变量标记为final，那么这个变量不能再指向其它引用，但它所指对象的取值仍然是可以改变的。\n\n```\nclass Const{\n\
    \    final float PI=3.14f;\n    final String language=\"Java\";\n    int number=1;\n\
    }\nclass UseConst{\n    public static void\n    Const myConst\n    myConst.PI=3.1415926f;\n\
    \    final Const myConst1=new Const();\n    myConst1.number=2;\n    myConst1=new\
    \ Const();\n}\n```\n\n> Multiple markers at this line\n> - The final field Const.PI\
    \ cannot be assigned\n> - Type mismatch: cannot convert from double to float\n\
    \n> The final local variable myConst1 cannot be assigned. It must be blank and\
    \ not using a compound assignment\n\n## 5.9 抽象类\n\n### 抽象类\n\n- 在Java中可以通过关键字abstract把一个类定义为抽象类。\n\
    - 在抽象类中，每一个未被定义具体实现的方法也标记为abstract，称为抽象方法。\n- 在程序中不能用抽象类作为模板来创建对象，必须生成抽象类的一个非抽象的子类后才能创建实例。\n\
    - 抽象类可以包含抽象方法和非抽象方法，反之，不能在非抽象类中声明抽象方法，即只有抽象类才能具有抽象方法。\n\n### 抽象类定义：\n\n```\n[modifier]\
    \ abstract AbstractClass{\n    ...\n}\n```\n\n### 抽象方法定义：\n\n```\n[modifier] abstract\
    \ <returnType> <methodName>(参数列表);\n```\n"
