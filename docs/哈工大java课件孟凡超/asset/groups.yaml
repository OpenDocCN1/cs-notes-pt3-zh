    # 2.1 Java的基本语法单位


    # 3 标识符


    +   > 标识符是以字母、下划线(_)或美元符($)开头，由字母、数字、下划线(_)或美元符($)组成的字符串。


    +   > 标识符区分大小写，长度一般没有限制。除以上所列几项之外，标识符中不能含有其它符号，也不能插入空格。


    +   > 在程序中，标识符可以用作变量名、方法名、接口名、类名等。


    +   > Java源代码使用Unicode码(16位)，不是ASCII码(8位)。


    # 一些合法的标识符：


    identifier user_name $change _password


    # 一些非法标识符：


    2sun //以数字2开头


    class //是Java关键字


    #myname 它字符#'
