    - JMF(Java Media Framework API) 帮助开发者把音频、视频和其它一些基于时间的媒体放到Java应用程序或applet小程序中去，为播放、回访、编解码等工具，是一个弹性的、跨平台的多媒体框架。\n\
    - Annotation(Java Annotation) 在已经发布的JDK1.5中增加了标注。标注提供了一种机制，将程序的元素如类、方法、属性、参数、本地变量、包和元数据联系起来，这样编译器可以将元数据存储在Class文件中，虚拟机和其它对象可以根据这些元素数据来决定如何使用这些程序元素或改变它们运行的行为。\n\
    - JMX(Java Management Extension, Java管理扩展) 是一个为应用程序、设备、系统等植入管理功能的框架。JMX可以跨越一系列异构的操作系统平台、系统体系结构和网络传输协议，灵活地开发无缝集成的系统、网络和服务管理应用。\n\
    - JPA(Java Persistence API) 通过JDK5.0注释或XML描述对象-关系表的映射关系。并将运行期的实体对象持久化到数据库中。\n\n\
    ## Java语言的特点\n\n- 语法简单、功能强大\n\n完全面向对象语言，语法与C++相似，没有指针、结构和类型定义等概念，没有全局变量，没有多重继承机制，程序员不用自己释放内存空间。\n\
    \n- 分布式与安全性\n\n内置TCP/IP、HTTP、FTP协议类库，便于开发网络应用程序。\n三级代码检查机制(语言定义阶段、字节码检查阶段和程序执行阶段)。\n\
    \n- 与平台无关性。\n\nJava口号“一次编写，到处运行”。采用JVM实现。\n\n- 解释编译两种运行方式。\n\nJava字节码解释执行；将字节码转换成本机代码，以较高速度执行。\n\
    \n## 多线程\n\nJava内置了语言级别多线程功能，提供了现成的类Thread，只要继承这个类就可以编写多线程的程序，可以使用户程序并行执行。C++不显式地支持多线程机制。\n\
    \n## 动态执行\n\nJava执行代码是在运行时动态载入的，程序可以自动进行版本升级。类库中新的方法和其它实例，不会影响原有程序执行。\n\n## 丰富的API文档和类库\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_21_0.png)\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_21_1.png)\n\
    \n## JDK的下载、安装和配置\n\n主要步骤：\n\n- 步骤1：登陆ORACLE公司网页\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/index.html\
    \ ， 目前JDK的最高版本是1.7.0_25(Java SE)，点击如下链接。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_22_0.png)\n\
    \n步骤3：点击已下载的jdk-7u25-windows-i586.exe进行安装。\n\nJava SE Development Kit 7 Update\
    \ 25 已成功安装\n\n单击“后续步骤”访问教程、API 文档、开发人员指南、发布说明及更多内容，帮助您开始使用 JDK。\n\n后续步骤(N)\n\n\
    关闭(C)\n\n步骤4：设置环境变量。\n\n- PATH=D:\\Program Files\\Java\\jdk1.7.0_25\\bin\n- CLASSPATH=.;\
    \ D:\\Program Files\\Java\\jdk1.7.0_25\\lib\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_25_0.png)\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_25_1.png)\n\n步骤5：测试设置环境变量。单击“开始”按钮，在“搜索程序和文件”对话框中输入“cmd”，按【Enter】键进入DOS窗口，在DOS提示符下输入“javac”并按【Enter】键，执行javac命令，此时将显示javac命令帮助信息，显示如下右图所示，这表明系统变量设置已经生效了。\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_26_0.png)\n\n## 一个基本的Java应用程序\n\nJava应用程序\n\
    \n编辑(通过记事本编辑Java程序)\n\n文件目录： D:/java/example/HelloWorld.java\n\n```\npublic class\
    \ HelloWorld{\n    public static void main(String args[]){\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\n### 编译\n\n- 进入目录： D:/java/example/。\n- 输入javac\
    \ HelloWorld.java，点击回车键，进行编译。\n- 生成Java可执行文件HelloWorld.class。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_28_0.png)\n\
    \n### 运行\n\n要运行HelloWorld应用程序，键入如下命令：\njava HelloWorld，点击回车键，运行结果如下：\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_29_0.png)\n\
    \n## 使用Eclipse开发Java应用程序\n\n### Eclipse简介\n\n- Eclipse最初是IBM公司的一个软件产品。Eclipse的中文意思是“日蚀、遮盖”，据说IBM公司之所以选择这个名称，就是为了展示出意欲遮住竞争对手的光芒的动机，现在看来，它确实做到了。\n\
    - Eclipse是一个开放源代码的、基于Java的可扩展开发平台。就其本身而言，它只是一个框架和一组服务，用于通过插件组件构建开发环境。Eclipse附带了一个标准的插件集，包括Java开发工具(JDK)。\n\
    - Eclipse的设计思想是：一切皆插件。Eclipse核心很小，其它所有功能都以插件的形式附加于Eclipse核心之上。Eclipse基本内核包括：图形API(SWT/Jface)，JAVA开发环境(JDT)，插件开发环境(PDE)等。\n\
    \n### Eclipse下载、安装、创建项目\n\n- 步骤1：首先安装JDK，唯有如此，Eclipse方能使用。\n- 步骤2：在Eclipse的官方网站下载Eclipse软件，Eclipse有许多版本，我们可以选择一个版本。\n\
    - 步骤3：双击下载的Eclipse程序文件包，将其解压缩到一个指定文件夹。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_31_0.png)\n\
    \n步骤4：双击Eclipse文件夹中的eclipse.exe，即可启动Eclipse程序。选择希望作为工作空间的文件夹后，系统将打开欢迎画面。单击“欢迎”画面左上角的“关闭”按钮，此时Eclipse的初始工作画面。\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_32_0.png)\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_32_1.png)\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_32_2.png)\n"
