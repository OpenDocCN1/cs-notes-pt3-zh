    \n```\nswitch(表达式){\n    case c1:\n        语句组1;\n        break;\n    case c2:\n\
    \        语句组2;\n        break;\n    ...\n    case ck:\n        语句组k;\n       \
    \ break;\n    [default:\n        语句组;\n        break;]\n}\n```\n\n### 4. 循环语句\n\
    \nJava提供三种循环语句： for语句、 while语句和do语句。\n\nfor语句\n\n```\nfor(初始语句; 逻辑表达式; 迭代语句)\n\
    循环体语句;\n```\n\nfor语句的语义是：先执行初始语句，判断逻辑表达式的值，当逻辑表达式为真时，执行循环体语句，执行迭代语句，然后再去判别逻辑表达式的值。这个过程一直进行下去，直到逻辑表达式的值为假时，循环结束，转到for之后的语句。for语句中定义的循环控制变量只在该块内有效。\n\
    \nwhile 语句\n\n```\nwhile(逻辑表达式)\n循环体语句;\n```\n\nwhile 语句的语义是：计算逻辑表达式，当逻辑表达式为真时，重复执行循环体语句，直到逻辑表达式为假时结束。如果第一次检查时逻辑表达式为假，则循环体语句一次也不执行，如果逻辑表达式始终为真，则循环不会终止。\n\
    \ndo语句\n\n```\ndo\n    循环体语句;\nwhile(逻辑表达式)\n```\n\n**do语句的语义是：** 首先执行循环体语句，然后判定逻辑表达式的值，当表达式为真时，重复执行循环体语句，直到表达式为假时结束。不论逻辑表达式的值是真是假，do循环中的循环体都至少执行一次。\n\
    \nbreak与continue语句\n\nbreak语句： break语句可用于三类语句中，一类是switch语句中，一类是for、while及do等循环语句中，还有一类是块语句中。\n\
    \n- 在switch语句及循环语句中，break的语义是跳过本块中余下的所有语句，转到块尾，执行其后的语句。\n\n```\nint i,j;\nfor(i=0;i<10;i++){\n\
    \    for(j=0;j<8;j++){\n        if(i==5&&j==5)\n            break;\n    }\n  \
    \  System.out.println(\"i=\"+i+\";j=\"+j);\n}\n```\n\n- 在块中和标号配合使用，语法格式为：break\
    \ 标号；其语义是跳出标号所标记的语句块，继续执行其后的语句。\n\n```\nint i, j=0, k=0, h;\nlabel1:for(i=0; i<100;\
    \ i++, j+=2) {\n    switch(i%2) {\n        case 1:\n            h=1;\n       \
    \     break;\n        default:\n            h=0;\n            break;\n    }\n\
    \    if(i==50)\n        break label1;\n}\nSystem.out.println(\"i=\"+i);\n```\n\
    \ncontinue语句\n\n- 在循环语句中，continue可以立即结束当次循环而执行下一次循环。\n\n```\nfor(int i=0;i<10;i++){\n\
    \    if(i==5)\n        continue;\n    System.out.println(\"i=\"+i);\n}\n```\n\n\
    ```\nfor(int i=0;i<10;i++){\n    if(i==5)\n        break;\n    System.out.println(\"\
    i=\"+i);\n}\n```\n\n- continue 语句可以和标号一起使用，其语法格式为：\ncontinue 标号; 它立即结束标号标记的那重循环的当次循环，开始执行下一次循环。\n\
    \n```\nouter:for(int i=0;i<10;i++){\n    for(int j=0;j<20;j++){\n        if(j>i){\n\
    \            System.out.println();\n            continue outer;\n        }\n \
    \       System.out.print(\"*\");\n    }\n}\n```\n\n## Java程序设计\n\n孟凡超\n\n哈尔滨工业大学(威海)计算机科学与技术学院\n\
    \nmfc@hitwh.edu.cn\n\n## 参考资料\n\n- 1. 辛运帏, 饶一梅, 马素霞. Java程序设计(第二版). 清华大学出版社, 2006.\n\
    \n## 课程内容\n\n- 第1章 概述\n- 第2章 标识符和数据类型\n- 第3章 表达式和流程控制语句\n- 第4章 数组、向量和字符串\n- 第5章\
    \ 进一步讨论对象和类\n- 第6章 Java语言中的异常\n- 第7章 Java的图形用户界面设计\n- 第8章 Swing组件\n- 第9章 Java\
    \ Applet\n- 第10章 Java数据流\n- 第11章 线程\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_118_0.png)\n\
    \n## 第4章 数组、向量和字符串\n\n- 4.1 数组\n- 4.2 Vector类\n- 4.3 字符串类型\n\n### 4.1 数组\n\n-\
    \ 数组是一个数据结构，用来存储相同类型的数据。\n- 一个数组是系列的匿名变量，数组中的元素可以通过下标来访问。\n- Java将数组作为对象来处理。类Object中定义的方法都可以用于数组对象。\n\
    - 数组元素可以是基本类型，也可以是类类型，还可以是数组。\n\n### 一维数组的定义\n\n```\ntype arrayName[];\n```\n\n\
    - 在数组定义中不为数组元素分配内存，因此方括号[]中不用指出数组中元素的个数，即数组的长度。\n- 说明并不创建数组，它们只是引用变量，用来指向一个数组。\n\
    \n其中，类型(type)可以为Java中任意的数据类型，包括简单类型和复合类型，数组名称arrayName为一个合法的标识符，[]指明该变量是一个数组类型变量。\n\
    \n```\nchar s[];    //s的每个元素都是char类型的\nint intArray[];    //intArray中的每个元素都是整型的\n\
    Date dateArray[]; //dateArray的每个元素都是复合数据类型Date\n的每个元素都是类Point类型\n```\n"
  mdcn: "\n## 3.2 控制流\n\n句子：句子是Java的最小执行单位，语句间以分号(;)作为分隔符。语句分为简单语句和复合语句，简单语句就是通常意义下的一条语句，即单语句；而复合语句是一对花括号“{”和“}”括起来的语句组，也称为块，块后没有分号。\n\
    \n常见语句：\n- 表达式语句\n- 块\n- 分支语句\n- 循环语句\n\n### 1. 表达式语句\n\n在Java程序中，表达式可以当作一个值，有的表达式也可以当作语句。\n\
    \n```\ncustomer=new Customer();\npoint =new Point();\nx=12;\nx++;\nSystem.out.println(\"\
    hello world!\");\n```\n\n### 2. 块\n\n块是一对花括号 “{” 和 “}” 括起来的语句组。\n\n```\n{\n}\n\
    {\n    Point point=new Point();\n    int x=point.x;\n}\n```\n\n### 3. 分支语句\n\n\
    分支语句根据一定的条件，动态决定程序的流程方向，从程序的多个分支中选择一个或几个来执行。分支语句有两种：if 语句和 switch 语句。\n\nif 语句\n\
    \n基本格式\n\n```\nif(逻辑表达式)\n    语句1;\n[else\n    语句2;\n]\n```\n\nif语句的常见形式\n\n```\n\
    if(逻辑表达式){\n    //逻辑表达式为true时要执行的语句;\n}\n```\n\n```\nif(逻辑表达式){\n    //逻辑表达式为true时要执行的语句;\n\
    }else{\n    //逻辑表达式为false时要执行的语句;\n}\n```\n\n```\nif(逻辑表达式1){\n    //逻辑表达式1为true时要执行的语句;\n\
    }else if(逻辑表达式2){\n    //逻辑表达式2为true时要执行的语句;\n}\n...\nelse{\n    //前面的逻辑表达式全为false时要执行的语句;\n\
    }\n```\n\nswitch语句\n\n注：表达式的计算结果必须是int型或字符型，即int型赋值相容的。Java规定switch语句不允许使用浮点型或long型表达式。c1,c2,...,ck是int型或字符型常量，default子句是可选的，最后一个break语句可以不写。\n\
    \n```\nswitch(表达式){\n    case c1:\n        语句组1;\n        break;\n    case c2:\n\
    \        语句组2;\n        break;\n    ...\n    case ck:\n        语句组k;\n       \
    \ break;\n    [default:\n        语句组;\n        break;]\n}\n```\n\n### 4. 循环语句\n\
    \nJava提供三种循环语句： for语句、 while语句和do语句。\n\nfor语句\n\n```\nfor(初始语句; 逻辑表达式; 迭代语句)\n\
    循环体语句;\n```\n\nfor语句的语义是：先执行初始语句，判断逻辑表达式的值，当逻辑表达式为真时，执行循环体语句，执行迭代语句，然后再去判别逻辑表达式的值。这个过程一直进行下去，直到逻辑表达式的值为假时，循环结束，转到for之后的语句。for语句中定义的循环控制变量只在该块内有效。\n\
    \nwhile 语句\n\n```\nwhile(逻辑表达式)\n循环体语句;\n```\n\nwhile 语句的语义是：计算逻辑表达式，当逻辑表达式为真时，重复执行循环体语句，直到逻辑表达式为假时结束。如果第一次检查时逻辑表达式为假，则循环体语句一次也不执行，如果逻辑表达式始终为真，则循环不会终止。\n\
    \ndo语句\n\n```\ndo\n    循环体语句;\nwhile(逻辑表达式)\n```\n\n**do语句的语义是：** 首先执行循环体语句，然后判定逻辑表达式的值，当表达式为真时，重复执行循环体语句，直到表达式为假时结束。不论逻辑表达式的值是真是假，do循环中的循环体都至少执行一次。\n\
    \nbreak与continue语句\n\nbreak语句： break语句可用于三类语句中，一类是switch语句中，一类是for、while及do等循环语句中，还有一类是块语句中。\n\
    \n- 在switch语句及循环语句中，break的语义是跳过本块中余下的所有语句，转到块尾，执行其后的语句。\n\n```\nint i,j;\nfor(i=0;i<10;i++){\n\
    \    for(j=0;j<8;j++){\n        if(i==5&&j==5)\n            break;\n    }\n  \
    \  System.out.println(\"i=\"+i+\";j=\"+j);\n}\n```\n\n- 在块中和标号配合使用，语法格式为：break\
    \ 标号；其语义是跳出标号所标记的语句块，继续执行其后的语句。\n\n```\nint i, j=0, k=0, h;\nlabel1:for(i=0; i<100;\
    \ i++, j+=2) {\n    switch(i%2) {\n        case 1:\n            h=1;\n       \
    \     break;\n        default:\n            h=0;\n            break;\n    }\n\
    \    if(i==50)\n        break label1;\n}\nSystem.out.println(\"i=\"+i);\n```\n\
    \ncontinue语句\n\n- 在循环语句中，continue可以立即结束当次循环而执行下一次循环。\n\n```\nfor(int i=0;i<10;i++){\n\
    \    if(i==5)\n        continue;\n    System.out.println(\"i=\"+i);\n}\n```\n\n\
    ```\nfor(int i=0;i<10;i++){\n    if(i==5)\n        break;\n    System.out.println(\"\
    i=\"+i);\n}\n```\n\n- continue 语句可以和标号一起使用，其语法格式为：\ncontinue 标号; 它立即结束标号标记的那重循环的当次循环，开始执行下一次循环。\n\
    \n```\nouter:for(int i=0;i<10;i++){\n    for(int j=0;j<20;j++){\n        if(j>i){\n\
    \            System.out.println();\n            continue outer;\n        }\n \
    \       System.out.print(\"*\");\n    }\n}\n```\n\n## Java程序设计\n\n孟凡超\n\n哈尔滨工业大学(威海)计算机科学与技术学院\n\
    \nmfc@hitwh.edu.cn\n\n## 参考资料\n\n- 1. 辛运帏, 饶一梅, 马素霞. Java程序设计(第二版). 清华大学出版社, 2006.\n\
