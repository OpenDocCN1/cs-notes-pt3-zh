    \ 方法的实现，采用哪一种实现由 Java 虚拟机在运行时动态决定，这种能力称为动态绑定。\n\n动态绑定机制：假设对象 `o` 是类 `C₁, C₂, …,\
    \ Cₙ₋₁` 和 `Cₙ` 的实例，其中，`C₁` 是 `C₂` 的子类，`C₂` 是 `C₃` 的子类，…, `Cₙ₋₁` 是 `Cₙ` 的子类，如果对象\
    \ `o` 调用一个方法 `m`，Java 虚拟机依次在类 `C₁, C₂, …, Cₙ₋₁, Cₙ` 中查找方法 `m` 的实现，直到找到为止。\n\n\
    ![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_183_0.png)\n\n`java.lang.Object`\n\n\
    如果 `o` 是 `C₁` 的实例，它也是 `C₂, …, Cₙ₋₁` 和 `Cₙ` 的实例。\n\n### 方法自变量和异类集合\n\n**方法的参量**\n\
    \n```java\npublic TaxRate findTaxRate(Employee e) {\n    // 进行计算并返回 e 的税率\n}\n\
    ```\n\n```java\nManager m = new Manager();\n...\nTaxRate t = findTaxRate(m);\n\
    ```\n\n- **异类集合：** 异类集合是由不同质内容组成的集合，也就是说，集合内所含元素的类型可以不完全一致。\n\n```java\nEmployee[]\
    \ staff = new Employee[1024];\nstaff[0] = new Manager();\nstaff[1] = new Employee();\n\
    ```\n\n### instanceof 运算符\n\n由于类的多态性，类的变量既可以指向本类实例，又可以指向其子类的实例。在程序中，有时需要判明某个引用到底指向哪个实例，这可以通过\
    \ `instanceof` 运算符来实现。\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_186_0.png)\n\
    \n```java\npublic class Employee {\n    public void m(Employee e) {\n        if\
    \ (e instanceof Manager) {\n            // 经理级人士\n        } else if (e instanceof\
    \ Controller) {\n            // 掌握公司机密的高层人士\n        } else {\n            //\
    \ 普通雇员\n        }\n    }\n}\n```\n\n### 转换对象\n\nJava 允许使用对象之父类类型的一个变量指示该对象，称为转换对象（casting）。\n\
    \n```java\nEmployee e = new Manager();\n```\n\n```java\nManager e = new Employee();\n\
