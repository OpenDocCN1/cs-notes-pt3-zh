    \      System.out.println(\"read: \"+s);\n            }\n            dis.close();\n\
    \        }catch(IOException e){\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n## 10.4 文件的处理\n\n### 文件的处理\n\n- File类提供了获得文件基本信息及操作文件的一些工具\n\
