    +   - 第3章 表达式和流程控制语句\n+   - 第4章 数组、向量和字符串\n+   - 第5章 进一步讨论对象和类\n+   - 第6章 Java语言中的异常\n\
    +   - 第7章 Java的图形用户界面设计\n+   - 第8章 Swing组件\n+   - 第9章 Java Applet\n+   - 第10章\
    \ Java数据流\n+   - 第11章 线程\n\n## 第7章 Java的图形用户界面设计\n\n+   - 7.1 AWT与Swing\n+   -\
    \ 7.2 容器\n+   - 7.3 布局\n+   - 7.4 事件处理\n\n## 7.1 AWT与Swing\n\n### Java抽象窗口工具集(AWT)中主要类继承关系\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_240_0.png)\n\n## 7.1 AWT与Swing\n\n\
    ### Swing中主要类继承关系\n\nSwing组件与 AWT组件最大的不同是，Swing组件在实现时不包含任何本地代码，因此Swing组件可以不受硬件平台限制。\n\
    \nJava.awt.Container\njavax.swing.JComponent\nJTextComponent\nJTextArea\nJTextField\n\
    JPasswordField\nJEditorPane\nAbstractButton\nJPanel\nJComboBox\nJLabel\nJLayeredPane\n\
    JList\nJToolBar\nJMenuBar\nJPopupMenu\nJPanel\nJScrollBar\nJScrollPane\nJSlider\n\
    JTable\nJSeparator\nJTree\nJProgressBar\nJRootPane\nJSplitPane\nJToggleButton\n\
    JCheckBox\nJRadioButton\nJButton\nJMenuItem\nJRadioButtonMenuItem\nJCheckBoxMenuItem\n\
    JMenu\n\n## 7.2 容器\n\n### 顶层容器\n\n+   - **JFrame：** 是一个带有标题行和控制按钮(最小化、恢复/最小化、关闭)的独立窗口，创建应用程序时需要使用JFrame。\n\
    +   - **JApplet：** 创建小应用程序时使用JApplet，它被包含在浏览器窗口中。\n+   - **JDialog：** 创建对话框时使用JDialog。\n\
    +   - **JWindow：** 是一个不带有标题行和控制按钮的窗口。\n\n## 7.2 容器\n\n### 使用JFrame创建一个应用程序\n\n\
    ```\npackage example;\nimport java.awt.*;\n\npublic class JFrameDemo {\n\n   \
    \ /**\n     * @param args\n     */\n    public static void main(String[] args)\
    \ {\n        // TODO Auto-generated method stub\n        JFrame frame=new JFrame(\"\
    JFrameDemo\");//创建一个JFrame的实例\n        JButton button=new JButton(\"Press me\"\
    );//创建一个JButton的实例\n\n        frame.getContentPane().add(button, BorderLayout.CENTER);\n\
    \        frame.setSize(300, 200);//设置JFrame的大小\n        frame.setVisible(true);//显示JFrame\n\
    \    }\n}\n```\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_243_0.png)\n\n## 7.2\
    \ 容器\n\n### 内容窗格\n\n每个顶层容器都有一个内容窗格(ContentPane)，顶层容器中除菜单之外的组件都放在这个内容窗格中。\n\n###\
    \ 将组件放入内容窗格方法1：\n\n通过顶层容器的getContentPane()方法获取默认的内容窗格，然后将组件添加到内容窗格中。\n\n```\n\
    Container contentPane=frame.getContentPane();\ncontentPane.add(button, BorderLayout.CENTER);\n\
    ```\n\n```\nframe.getContentPane().add(button, BorderLayout.CENTER);\n```\n\n\
    ## 7.2 容器\n\n✓将组件放入内容窗格方法2：\n\n创建新的内容窗格取代顶层容器默认的内容窗格。\n\n```\nJPanel contentPane=new\
    \ JPanel();\ncontentPane.setLayout(new BorderLayout());\ncontentPane.add(button,\
    \ BorderLayout.CENTER);\nframe.setContentPane(contentPane);\n```\n\n## 7.2 容器\n\
    \n```\npackage example;\nimport java.awt.*;\n\npublic class JFrameDemo {\n   \
    \ /**\n     * @param args\n     */\n    public static void main(String[] args)\
    \ {\n        // TODO Auto-generated method stub\n        JFrame frame=new JFrame(\"\
    JFrameDemo\");//创建一个JFrame的实例\n        JButton button=new JButton(\"Press me\"\
    );//创建一个JButton的实例\n        JPanel contentPane=new JPanel();//创建一个JPanel的实例\n\n\
    \        //为JPanel设置BorderLayout布局管理器\n        contentPane.setLayout(new BorderLayout());\n\
    \n        //将JButton放到JPanel的中央\n        contentPane.add(button, BorderLayout.CENTER);\n\
    \n        //为JFrame设置新的内容窗格\n        frame.setContentPane(contentPane);\n\n  \
    \      frame.setSize(300, 200);//设置JFrame的大小\n        frame.setVisible(true);//显示JFrame\n\
    \    }\n}\n```\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_246_0.png)\n\n## 7.2\
    \ 容器\n\n面板(JPanel)：面板不能独立存在，必须被添加到其他容器内部。\n\n```\npackage example;\nimport java.awt.*;\n\
    \npublic class FrameWithPanel {\n\n    /**\n     * @param args\n     */\n    public\
    \ static void main(String[] args) {\n        // TODO Auto-generated method stub\n\
    \        JFrame frame=new JFrame(\"Frame with Panel\");\n        Container contentPane=frame.getContentPane();\n\
    \        contentPane.setBackground(Color.CYAN);//将JFrame实例的背景设置为蓝绿色\n\n      \
    \  JPanel panel=new JPanel();//创建一个JPanel的实例\n        panel.setBackground(Color.yellow);//将JPanel实例的背景设置为黄色\n\
    \        JButton button=new JButton(\"Press me\");//创建一个JButton的实例\n        panel.add(button);//将JButton实例添加到JPanel中\n\
    \        contentPane.add(panel,BorderLayout.SOUTH);//将JPanel实例添加到JFrame的南侧\n \
    \       frame.setSize(300,200);\n        frame.setVisible(true);\n    }\n}\n```\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_247_0.png)\n"
