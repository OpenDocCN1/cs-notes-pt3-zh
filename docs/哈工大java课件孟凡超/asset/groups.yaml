    ```

    while(逻辑表达式)

    循环体语句;

    ```


    while 语句的语义是：计算逻辑表达式，当逻辑表达式为真时，重复执行循环体语句，直到逻辑表达式为假时结束。如果第一次检查时逻辑表达式为假，则循环体语句一次也不执行，如果逻辑表达式始终为真，则循环不会终止。'
