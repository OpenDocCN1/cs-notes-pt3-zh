    \n## 7.3 布局\n\n### BoxLayout布局管理器\n\n它将容器中的组件按水平方向排成一行或按垂直方向排成一列。当组件排成一行时，每个组件可以有不同的宽度；当组件排成一列时，每个组件可以有不同的高度。\n\
    \n### BoxLayout的构造方法：\n\n```\npublic BoxLayoutLayout(Container target, int axis);\n\
    ```\n\n- target指明是为哪个容器设置此布局管理器；\n- Axis指明组件的排列方向，BoxLayout.X_AXIS、BoxLayout.Y_AXIS分别表示按水平方向排列和按垂直方向排列。\n\
    \n```\npublic class BoxLayoutDemo {\n    private JFrame frame;\n    private JPanel\
    \ pv, ph;\n    public static void main(String[] args) {\n        BoxLayoutDemo\
    \ that = new BoxLayoutDemo();\n        that.go();\n    }\n    void go(){\n   \
    \     frame = new JFrame(\"Box Layout example\");\n        Container contentPane\
    \ = frame.getContentPane();\n        pv = new JPanel();\n        pv.setLayout(new\
    \ BoxLayout(pv, BoxLayout.Y_AXIS));\n        pv.add(new JLabel(\"Monday\"));\n\
    \        pv.add(new JLabel(\"Tuesday\"));\n        pv.add(new JLabel(\"Wednesday\"\
    ));\n        pv.add(new JLabel(\"Thursday\"));\n        pv.add(new JLabel(\"Friday\"\
    ));\n        pv.add(new JLabel(\"Saturday\"));\n        pv.add(new JLabel(\"Sunday\"\
    ));\n        contentPane.add(pv, BorderLayout.CENTER);\n        ph = new JPanel();\n\
    \        ph.setLayout(new BoxLayout(ph, BoxLayout.X_AXIS));\n        ph.add(new\
    \ JButton(\"Yes\"));\n        ph.add(new JButton(\"No\"));\n        ph.add(new\
    \ JButton(\"Cancel\"));\n        contentPane.add(ph, BorderLayout.SOUTH);\n  \
    \      frame.pack();\n        frame.setVisible(true);\n    }\n}\n```\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_257_0.png)\n\
    \n## 7.4 事件处理\n\n### 事件处理模型\n\n### 事件\n\n- 事件是用户在界面上的一个操作（通常使用各种输入设备，如：鼠标、键盘等来完成）。\n\
    - 当一个事件发生时，该事件用一个事件对象来表示。事件对象有对应的事件类。不同的事件类描述不同类型的用户动作。\n- 事件类包含在java.awt.event和javax.swing.event包中。\n\
    \n### 事件源\n\n- 产生事件的组件叫事件源。在一个按钮上单击鼠标时，该按钮就是事件源，会产生一个ActionEvent类型的事件。\n\n## 7.4\
    \ 事件处理\n\n### 事件处理器（事件处理方法）\n\n事件处理器是一个接收事件对象并进行相应处理的方法。事件处理器包含在一个类中，这个类的对象负责检查事件是否发生，若发生就激活事件处理器进行处理。\n\
    \n### 事件监听器类\n\n包含事件处理器，并负责检查事件是否发生，若发生就激活事件处理器进行处理的类叫做事件监听器类。其实例就是事件监听器对象。事件监听器类必须实现事件监听器接口或继承事件监听器适配器类。\n\
    \n事件监听器接口定义了处理事件必须实现的方法。事件监听器适配器类是对事件监听器接口的简单实现。目的\n\n## 7.4 事件处理\n\n### 注册事件监听器\n\
    \n为了能够让事件监听器检查某个组件（事件源）是否发生了某些事件，并且在发生时激活事件处理器进行相应的处理，必须在事件源上注册事件监听器。这是通过使用事件源组件的以下方法来完成的：\n\
    \n```\naddXxxListener（事件监听器对象）\n```\n\nXxx对应相应的事件类。\n\n## 7.4 事件处理\n\n事件监听器类应该包括以下两部分内容：\n\
    \n- 1) 在事件监听器类的声明中指定要实现的监听器接口名，如：\n- public class MyListener implements XxxListener\
    \ {\n- ...\n- }\n\n- 2) 实现监听器接口中的事件处理方法，如：\n- public void 事件处理方法名(XxxEvent e)\
    \ {\n- ...//处理某个事件的代码...\n- }\n\n然后，在一个或多个组件上可以进行监听器类的实例的注册。如：\n\n```\n组件对象.addXxxListener(MyListener对象);\n\
