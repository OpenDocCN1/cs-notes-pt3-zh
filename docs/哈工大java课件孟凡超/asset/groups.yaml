    # 什么是Java语言


    # Java平台的三种版本


    +   微型版-J2ME(Java 2 Platform Micro Edition)/Java ME


    Java ME是为机顶盒、移动电话和PDA之类的嵌入式消费电子设备提供的Java语言平台，包括虚拟机和一系列标准化的Java API。


    与Java SE和Java EE相比，Java ME总体的运行环境和目标更加多样化，但是其中的每一种产品的用途却更为单一，而且资源限制也更加严格。


    开发Java ME程序一般不需要特别的开发工具，开发者只需装上Java SDK及下载免费的Sun Java Wireless Toolkit 2.xx系列开发包，目前主要的集成开发环境IDE(如Eclipse、NetBeans)都支持Java
    ME的开发，个别手机开发商如Android系统，都有自己的SDK，供开发者再开发出兼容于他们平台的程序。


    +   标准版-J2SE(Java 2 Platform Standard Edition)/Java SE


    Java SE用于开发和部署桌面、服务器以及嵌入式设备和实时环境中的Java程序。Java SE包括用于开发Java Web服务的类库，同时Java SE为Java
    EE提供了基础。目前，Java程序设计课程使用的基本都是Java SE。'
