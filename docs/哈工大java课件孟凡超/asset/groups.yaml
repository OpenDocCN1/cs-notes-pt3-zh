    # 4. 循环语句


    Java提供三种循环语句： for语句、 while语句和do语句。


    for语句


    ```

    for(初始语句; 逻辑表达式; 迭代语句)

    循环体语句;

    ```


    for语句的语义是：先执行初始语句，判断逻辑表达式的值，当逻辑表达式为真时，执行循环体语句，执行迭代语句，然后再去判别逻辑表达式的值。这个过程一直进行下去，直到逻辑表达式的值为假时，循环结束，转到for之后的语句。for语句中定义的循环控制变量只在该块内有效。'
