    程序\n(内存)\n\n数据\n\nwrite\n\n输出流\n\nfile2.txt\n\n```\nimport java.io.FileNotFoundException;\n\
    import java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class\
    \ FileStream1 {\n\n    /**\n     * @param args\n     */\n    public static void\
    \ main(String[] args) {\n        // TODO Auto-generated method stub\n        try{\n\
    \            FileOutputStream out=new FileOutputStream(\"file2.txt\");\n     \
    \       out.write('h');\n            out.write('a');\n            out.write('r');\n\
    \            out.write('b');\n            out.write('i');\n            out.write('n');\n\
    \            out.close();\n        }catch(FileNotFoundException e){\n        \
    \    System.out.println(\"Error:cannot open file for waiting.\");\n        }catch(IOException\
    \ e){\n            System.out.println(\"Error:cannot write to file.\");\n    \
    \    }\n    }\n}\n```\n\n### 过滤器数据流\n\n### 缓冲区数据流\n\n- ✓ 包括 **BufferedInputStream**\
    \ 和 **BufferedOutputStream**，它们都是过滤器数据流，都是在数据流上增加了一个缓冲区。\n- ✓ 当读写数据时，数据以 **块**\
    \ 为单位先进入 **缓冲区**（块的大小可以进行设置），其后的读写操作则作用于缓冲区。\n- ✓ 只有缓冲区满时，才会将数据送到输出流。一般在关闭一个缓冲区输出流之前，应使用\
    \ flush() 方法，强制输出剩余数据，以确保缓冲区内的所有数据全部写入输出流。\n- ✓ 提供了对 mark()、reset()、skip() 等方法的支持。\n\
    \n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_326_0.png)\n\n增加缓冲区流，减少访问硬盘的次数，提高效率！\n\
    \n```\npublic static void main(String[] args) {\n    // TODO Auto-generated method\
    \ stub\n    try{\n        FileInputStream in=new FileInputStream(\"file1.txt\"\
    );\n        InputStream bin=new BufferedInputStream(in);\n        FileOutputStream\
    \ out=new FileOutputStream(\"file2.txt\");\n        OutputStream bout=new BufferedOutputStream(out);\n\
    \        int c;\n        while((c=bin.read())!=-1){\n            bout.write(c);\n\
    \        }\n        bout.flush();\n        in.close();\n        bin.close();\n\
    \        out.close();\n        bout.close();\n    }catch(FileNotFoundException\
    \ e){\n        e.printStackTrace();\n    }catch(IOException e){\n        e.printStackTrace();\n\
    \    }\n}\n```\n\n### 数据数据流\n\n- ✓ 文件流和缓冲区流的处理对象是字节或字节数组，利用数据输入输出流可以实现对文件的不同数据类型的读写。\n\
    - ✓ DataInputStream 和 DataOutputStream：一种较为高级的数据输入输出方式，除了字节和字节数组，还可以处理 int、float、boolean\
    \ 等类型。\n- ✓ 还可以用 readLine 方法读取一行信息。\n- ✓ 创建方式：\n\n```\nFileInputStream in=new\
    \ FileInputStream(\"file1.txt\");\nFileOutputStream out=new FileOutputStream(\"\
    file2.txt\");\nDataInputStream din = new DataInputStream(in);\nDataOutputStream\
    \ dout = new DataOutputStream(out);\n```\n\nDataInputStream主要方法：\n\n- byte readByte();\n\
    - long readLong();\n- double readDouble();\n- boolean readBoolean();\n- String\
    \ readUTF();\n- int readInt();\n- float readFloat();\n- short readShort();\n-\
    \ char readChar();\n\nDataOutputStream主要方法:\n- void writeByte();\n- void writeLong();\n\
    - void writeDouble();\n- void writeBoolean();\n- void writeUTF();\n- void writeInt();\n\
    - void writeFloat();\n- void writeShort();\n- void writeChar();\n\n### 数据数据流示例(2)\n\
    \n```java\nDataInputStream in = new DataInputStream(\nnew FileInputStream(\"D:/java/Java2s.txt\"\
    ));\ndouble price;\nint unit;\nString desc;\ndouble total = 0.0;\ntry {\nwhile\
    \ (true) {\nprice = in.readDouble();\nin.readChar(); // throws out the tab\nunit\
    \ = in.readInt();\nin.readChar(); // throws out the tab\ndesc = in.readline();\n\
    System.out.println( desc );\nSystem.out.println( price );\nSystem.out.println(\
    \ unit );\ntotal = total + unit * price;\nSystem.out.println( total );\n}\n} catch\
    \ (EOFException e) {\n}\nin.close();\n```\n\n### 管道数据流\n\n- > 管道数据流主要用于线程间的通信。\n\
    - > 一个线程中的 PipedInputStream 对象从另一个线程中互补的 PipedOutputStream 对象中接收输入。\n- > 类 PipedInputStream\
    \ 必须和类 PipedOutputStream 一起使用，来建立一个通信通道。\n- > 管道数据流必须同时具备可用的输入端和输出端。\n\n创建 一个通信通道\
    \ (方法2):\n\n```\nPipedInputStream pis = new PipedInputStream();\nPipedOutputStream\
    \ pos = new PipedOutputStream(pis);\n```\n\n```\nPipedOutputStream pos = new PipedOutputStream();\n\
    PipedInputStream pis = new PipedInputStream(pos);\n```\n"
