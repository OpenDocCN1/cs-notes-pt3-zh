    ### 关系运算符


    - ✓ 关系运算符是二元运算符，用来比较两个值，其结果是一个逻辑值。

    - ✓ 包括大于(>)、大于等于(>=)、小于(<)、小于等于(<=)、等于(==)、不等于(!=)6种。


    | 名称 | 运算符 | 运算规则 | 运算对象 | 表达式实例 | 运算结果 |

    |---|---|---|---|---|---|

    | 小于 | < | 满足则为真，不满足则为假 | 整型、浮点型、字符型 | 2<3 | true |

    | 小于等于 | <= |  |  | 6<=6 | true |

    | 大于 | > |  |  | ''a''>''b'' | false |

    | 大于等于 | >= |  |  | 7.8>=5.6 | true |

    | 等于 | == |  |  | 9==9 | true |

    | 不等于 | != |  |  | 8!=8 | false |


    ### 逻辑运算符


    逻辑运算符用来连接关系表达式，对关系表达式的值进行逻辑运算，因此逻辑运算符的运算对象必须是逻辑型数据，其表达式的运行结果也是逻辑型数据。


    包括逻辑与(&&)、逻辑或(||)和逻辑非(!)三种，&&和||是二元运算符，！是一元运算符。


    | 对象1 (a) | 对象2 (b) | !a | a&&b | a||b |

    |---|---|---|---|---|

    | false | false | true | false | false |

    | false | true | true | false | true |

    | true | false | false | false | true |

    | true | true | false | true | true |


    □例，要判断一年(year)是否为闰年，其条件是：

    能被4整除但不能被100整除，或者能被400整除。

    逻辑表达式：


    ```

    (year%4==0 && year%100!=0)||year%400==0

    ```


    ### 位运算符


    位运算符用来对二进制位进行操作，包括按位取反(~)、按位与(&)、按位或(|)、异或(^)、右移(>>)、左移(<<)及无符号右移(>>>)，位运算只能对整型和字符型数据进行操作。


    ```

