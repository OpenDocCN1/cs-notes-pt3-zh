    \n- static既可以修饰类的属性(静态属性)，也可以修饰类的方法(静态方法)。\n- 静态成员与类相对应，它可以被类的所有对象共享。\n\n```java\n\
    public class Count{\n    private int serialNumber;\n    private static int counter=0;\n\
    \    public Count(){\n        counter++;\n        serialNumber=counter;\n    }\n\
    }\n```\n\n## 2.5 类和对象的初步介绍\n\n### 与继承有关的关键字\n\n- **extends：** 继承关系用extends表示。\n\
    - **final：** 用final修饰的类不能再派生子类，它已达到类层次中的最底层。\n- **abstract：** 用abstract修饰的类或方法，表示被修饰的成分是抽象的。抽象方法只须给出原型说明，方法体是空的，含有抽象方法的类必须说明为抽象类。\n\
    \n#### this和super\n\n- **this：** 指代本类。\n- **super：** 指代父类。\n\n## 2.5 类和对象的初步介绍\n\
    \n4 类定义示例\n\n```java\npublic abstract class Shape {//抽象类\n    Point position;\n\
    \    abstract void draw();    //抽象方法\n    Shape(Point p){          //构造方法\n  \
    \      position=p;\n    }\n}\nabstract class Round extends Shape{//抽象类\n    final\
    \ double pi=3.14159265;    //最终属性\n    abstract void draw();          //抽象方法\n\
    \    abstract double area();        //抽象方法\n    Round(Point p){              \
    \  //构造方法\n        /*子类不能从父类中继承构造方法，\n        *在子类的构造方法中调用某一父类的构造方法\n        */\n\
    \        super(p);                  //调用父类的构造方法\n    }\n}\nclass Circle extends\
    \ Round{\n    int radius;\n    void draw(){ //具体方法\n        //方法体\n    }\n   \
    \ double area(){//具体方法\n        return pi*radius*radius;\n    }\n    Circle(Point\
    \ p, int radius){\n        super(p);//调用父类构造方法\n        this.radius=radius;\n\
    \    }\n}\n```\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_71_0.png)\n\n## 2.5\
    \ 类和对象的初步介绍\n\nJava对类类型变量的内存分配步骤：\n\n对象引用：在内存中为其建立一个引用，并置初值null，表示不指向任何内存空间。\n\
    \n对象实例化：用new申请相应的内存空间，内存空间的大小依class的定义而定，并将该段内存的首地址赋给刚才建立的引用。\n\n对象引用：\n\n```\n\
    类名 变量名;\n```\n\n```\nPoint p;\nPerson zhanSan;\nPerson liSi;\n```\n\n对象实例化：\n\n\
    ```\n变量名=new 类名(参数列表);\n```\n\n```\np=new Point(10,20);\nzhanSan=new Person();\n\
    liSi=new Person();\n```\n\n对象说明(引用+实例化)：\n\n```\n类名 变量名=new 类名(参数列表);\n```\n\n\
    ```\nPoint p=new Point(10,20);\nPerson zhanSan=new Person();\nPerson liSi=new\
    \ Person();\n```\n"
