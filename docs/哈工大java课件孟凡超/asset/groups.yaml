    \  文件对象是否是目录\n- boolean isAbsolute()\n  文件对象是否是绝对路径\n\n## 10.4 文件的处理\n\n- long\
    \ lastModified()\n  获取文件最后修改时间\n- long length()\n  获取文件长度\n- boolean delete()\n\
    \  删除文件对象指向的文件，成功则返回true，否则返回false\n\n## 10.4 文件的处理\n\n- boolean mkdir(): 创建新目录\n\
