    \ }\n    //出现ActionEvent事件时，输出\"Action occurred\",结束程序运行\n    public void actionPerformed(ActionEvent\
    \ e){\n        System.out.println(\"Action occurred\");\n        System.exit(0);\n\
    \    }\n}\n```\n\n![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_265_0.png)\n\n## 7.4\
    \ 事件处理\n\n### 事件的种类\n\n- 每一类事件有一个相应的事件监听器接口，该接口定义了接收和处理事件的抽象方法。实现该接口的类，就是监听器类。其对象可作为监听器对象向相应的组件注册。\n\
    - 事件的类名通常为： XxxEvent。\n- 对应的事件监听器接口名通常为： XxxListener。\n- 一个监听器接口定义了一种以上的抽象事件处理方法（事件处理器）。\n\
    - 事件监听器类实现事件监听器接口，其类名可以由我们自己取。事件监听器类需要我们自己编写。\n\n## 7.4 事件处理\n\n### ■一个事件处理例子\n\
    \n| 事件类别 | interface名称 | 方法 |\n|---|---|---|\n| Mouse Motion | MouseMotionListener\
    \ | mouseDragged(MouseEvent)<br>mouseMoved(MouseEvent) |\n| Mouse Button | MouseListener\
    \ | mousePressed(MouseEvent)<br>mouseReleased(MouseEvent)<br>mouseEntered(MouseEvent)<br>mouseExited(MouseEvent)<br>mouseClicked(MouseEvent)\
    \ |\n\n## 7.4 事件处理\n\n```\npublic class TwoListener implements MouseMotionListener,\
    \ MouseListener{\n    private JFrame frame;\n    private JTextField tf;\n\n  \
    \  public static void main(String[] args) {\n        // TODO Auto-generated method\
    \ stub\n        TwoListener that=new TwoListener();\n        that.go();\n    }\n\
    \n    public void go(){\n        frame=new JFrame(\"Two listeners example\");\n\
    \        Container contentPane=frame.getContentPane();\n        contentPane.add(new\
    \ Label(\"Click and drag the mouse\"),BorderLayout.NORTH);\n        tf=new JTextField(30);\n\
    \        contentPane.add(tf,BorderLayout.SOUTH);\n        //注册监听程序\n        frame.addMouseMotionListener(this);\n\
    \        frame.addMouseListener(this);\n        frame.setSize(300*300);\n    \
    \    frame.setVisible(true);\n    }\n}\n```\n\n同时实现两个接口\n\n监听多类事件\n\n## 7.4 事件处理\n\
    \n```\n//实现MouseMotionListener接口中的方法\npublic void mouseDragged(MouseEvent e){\n\
    \    System.out.println(\"mouseDragged\");\n}\npublic void mouseMoved(MouseEvent\
    \ e){\n    String s=\"Mouse dragging: X=\"+e.getX()+\"Y=\"+e.getY();\n    tf.setText(s);\n\
    }\n\n//实现MouseListener接口中的方法\npublic void mouseClicked(MouseEvent e){\n}\npublic\
    \ void mouseEntered(MouseEvent e){\n    String s=\"The Mouse entered\";\n    tf.setText(s);\n\
    }\npublic void mouseExited(MouseEvent e){\n    String s=\"The Mouse has left the\
    \ building\";\n    tf.setText(s);\n}\npublic void mousePressed(MouseEvent e){\n\
    }\npublic void mouseReleased(MouseEvent e){\n}\n```\n\n## 7.4 事件处理\n\n### 监听适配器\n\
    \n单击鼠标事件监听器类(实现监听器类)\n\n```\npublic class MouseClickHandler implements MouseListener{\n\
    \    //我们只关心对单击鼠标事件的处理，因此改写mouseClicked()方法\n    public void mouseClicked(MouseEvent\
    \ e){\n        //处理代码\n    }\n    //对于其他方法，仍需要给出实现\n    public void mousePressed(MouseEvent\
    \ e){}\n    public void mouseReleased(MouseEvent e){}\n    public void mouseEntered(MouseEvent\
    \ e){}\n    public void mouseExited(MouseEvent e){ }\n}\n```\n\n## 7.4 事件处理\n\n\
    ### mouseListener接口\n\n```\npublic interface mouseListener extends EventListener{\n\
    \    public void mouseClicked(MouseEvent e);\n    public void mousePressed(MouseEvent\
    \ e);\n    public void mouseReleased(MouseEvent e);\n    public void mouseEntered(MouseEvent\
    \ e);\n    public void mouseExited(MouseEvent e);\n}\n```\n\n### 对应的适配器mouseAdapter\n\
    \n```\npublic abstract class mouseAdapter implements mouseListener {\n    public\
    \ void mouseClicked(MouseEvent e){}\n    public void mousePressed(MouseEvent e){}\n\
    \    public void mouseReleased(MouseEvent e){}\n    public void mouseEntered(MouseEvent\
    \ e){}\n    public void mouseExited(MouseEvent e){}\n}\n```\n"
