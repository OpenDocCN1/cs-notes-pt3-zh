    + □Java中二进制数表示

    + ✓ Java中使用补码来表示二进制数，在补码表示中最高位为符号位，正数的符号位是0，负数的符号位是1。

    + ✓ 正数的补码：与原码相同。

    + ✓ 负数的补码：符号位为1，其余位为该数绝对值的原码各位取反，然后整个数加1。


    + □例如

    + •30(byte型)的补码：00011110。

    + •-30(byte型)的补码是11100010：因为是负数，则符号位为"1"，其它位为30的原码0011110，整个为10011110；10011110按位取反为11100001；再加1，则-30的补码为11100010。


    ✓已知一个数的补码，如何求原码？


    + - 如果补码的符号位为“0”，表示是一个正数，所以补码就是该数的原码。

    + - 如果补码的符号位为“1”，表示是一个负数，求原码的操作可以是：符号位为1，其余各位取反，然后再整个数加1。

    + - 例如，一个数的补码为11100010，则原码为10011110(-30)：因为符号位为“1”，表示是一个负数，所以该位不变，仍为“1”，其余7位1100010取反后为0011101，再加1，所以是10011110。


