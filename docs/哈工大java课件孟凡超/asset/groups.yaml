  - '[PAGE 251]


    # 7.3 布局


    # (2)BorderLayout布局管理器


    是顶层容器中内容窗格的默认布局管理器，每个由BorderLayout管理的容器被划分成北(North)、南(South)、西(West)、东(East)、中(Center)五个区域，在每个区域可以加入一个组件。


    BorderLayout构造方法：


    ```

    public BorderLayout();

    public BorderLayout(int , int);

    ```


    在BorderLayout布局管理器的管理下，组件必须通过add()方法加入到容器中的制定区域下。'
