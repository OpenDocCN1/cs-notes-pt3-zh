    # 6.1 异常


    # 异常分类


    +   非致命错误的，通过某种修正后程序还能继续执行，这类错误称作异常，也称为例外。这类错误可以借助程序员的干涉来恢复。


    +   致命的，程序遇到了非常严重的不正常状态，不能简单地恢复执行，这就是错误。


    ```

    {

    openTheFile; //打开一个文件

    determine its size; //确定文件大小

    allocate that much memory; //分配适当的内存空间

    read-file; //读文件

    closeTheFile; //关闭文件

    }

    ```


    > 为了加强程序的鲁棒性，程序设计时必须考虑到可能发生的异常事件并做出相应的处理。'
  - "[PAGE 225]\n\n# 6.1 异常\n\n```\n{\n    openTheFile;\n    if(theFileOpen){\n  \
    \      determine the length of the file;\n        if(gotTheFileLength){\n    \
    \        allocate that much memory;\n            if(gotEnoughMemory){\n      \
    \          read the file into memory;\n                if(readFailed) errorCode==-1;\n\
    \                else errorCode==-2;\n            }else errorCode==-3\n      \
    \  }else errorCode==-4;\n    }else errorCode==-5\n}\n```\n\n虽然程序的鲁棒性加强了，但程序的结构臃肿，大量的错误处理代码混杂在其中，可读性差，目标程序也会增大许多。"
  - "[PAGE 226]\n\n# 6.1异常\n\n```\n{\n    try{\n        openTheFile; //打开一个文件\n  \
    \      determine its size; //确定文件大小\n        allocate that much memory; //分配适当的内存空间\n\
    \        read-file; //读文件\n        closeTheFile; //关闭文件\n    }\n    catch(fileopenFailed){//文件打开失败的处理代码}\n\
    \    catch(sizeDetermineFailed){//不能获得文件大小的处理代码}\n    catch(memoryAllocateFailed){//内存分配失败的处理代码}\n\
    \    catch(readFailed){//读文件失败的处理代码}\n    catch(fileCloseFailed){//关闭文件失败的处理代码}\n\
    \    finally{//需要统一处理的代码}\n}\n```\n\nJava提供了异常处理机制。在编写程序时，不需要想前面的例子书写判断语句，简化了代码的编写。有些常见的异常可以统一处理，提高了效率，代码重用率高。"
  - '[PAGE 227]


    # 6.1 异常


    # 异常机制优点


    +   > 它可以让程序员把异常处理代码从常规代码中分离出来，增加了可读性，方便修改。

    +   > 程序员可以按异常类型和差别进行分组，即从预定义的类Exception中派生出自己的子类，对无法预测的异常也可以进行捕获和处理，克服了传统方法中错误信息有限的问题。

    +   > 异常的处理借助于调用堆栈按先近后远的原则进行。


    ![](img/ca8bdf2cb3b7905fc97ee695aef3ed57_227_0.png)'
