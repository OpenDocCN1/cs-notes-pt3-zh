    \ ecommerce”\n      搜索结果数量大致相同，不过查询结果顺序略有差别。\n  - “filetype”的另一个强大用处在于图片搜索。后面将对GOOGLE的图片搜索功能作详细说明，此处略提一下。\n\
    \    - 进入 “http://images.google.com/”，查找关于本拉登的JPG图片。\n    - 搜索：“Bin Laden filetype:jpg”\n\
    \      结果：搜索有关 Bin Laden filetype:jpg 的图片（）。\n      （试验版）共约有1,630项查询结果，这是第1-20项。\n\
    \      搜索用时0.14秒。\n\n## 进阶搜索（续）\n\n- 搜索的关键字包含在URL链接中\n  - “inurl”语法返回的网页链接中包含第一个关键字，后面的关键字则出现在链接中或者网页文档中。INURL语法和基本搜索语法的最大区别在于，前者通常能提供非常精确的专题资料。\n\
    \    - 示例：查找微软网站上关于windows2000的安全课题资料。\n      搜索：“inurl:security windows2000 site:microsoft.com”\n\
    \      结果：已在microsoft.com内搜索有关inurl:security windows2000 的网页。共约有188项查询结果，这是第1-10项。搜索用时0.27秒。\n\
    \    - 注意：“inurl:”后面不能有空格，GOOGLE也不对URL符号如“/”进行搜索。例如，会把“cgi-bin/phf”中的“/”当成空格处理。\n\
    \  - “allinurl”语法返回的网页的链接中包含所有作用关键字。这个查询的关键字只集中于网页的链接字符串。\n    - 语法：“allinurl:\"\
    cgi-bin\" phf +com”\n"
