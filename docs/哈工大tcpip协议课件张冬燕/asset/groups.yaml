    \n## 发送邮件服务器\n\n常使用的是SMTP（Simple Mail Transfer Protocol）协议。\n\n## 接收邮件服务器\n\n\
    常使用的是POP3（Post Office Protocol 3）协议。\n"
  mdcn: "\n## 1、网络信息的特点及其分类\n\n### 2、网络信息的分类\n\n- 可以从不同的角度对网络信息进行大致分类：\n- 按信息的提供者分：可分为个人提供的和组织（政府和公司）提供的信息两大类。\n\
    - 按访问者的权限来分：可分为开放信息和保密信息两大类。网上信息绝大多数是开放的。\n- 按信息涉及的领域来分：可分为以下5类：\n  • ①教育类信息；②文化类信息；③科研类信息；④娱乐消遣类信息；⑤政策类信息。\n\
    \n## 3、网络信息的检索工具\n\n网络信息检索工具是指在Internet上提供信息检索服务的一类计算机系统，其检索对象是Internet上的各种网络信息。\n\
    \nWeb检索工具主要可分为以下几种类型：\n\n- （1）目录型检索工具：是按某种主题分类体系编制的一种可供检索的等级结构式目录。用户通过该目录体系的引导，找到有关的信息。如Yahoo！（www.yahoo.com）、搜狐（www.sohu.com）等。\n\
    \n## 1、网络信息的特点及其分类\n\n## 3、网络信息的检索工具\n\n- **搜索引擎：** 使用自动索引软件来发现、收集并标记网页，建立数据库。以Web形式提供给用户一个检索界面，供用户输入关键词之类的检索项，代替用户在数据库中查找出与其匹配的记录并返回结果，且按其相关度排序输出。\n\
    - **多元搜索引擎：** 将多个搜索引擎集成在一块，并提供一个统一的搜索界面，检索时，自动将一个检索提问发给多个搜索引擎同时进行检索。\n\n## 2、搜索引擎的工作原理或过程（续）\n\
    \n### （2）加工：信息索引的建立\n\n信息采集和存储后，要建立索引查询系统，其作用是决定索引的时空比、布尔逻辑操作、表达式匹配、词语匹配、相关性排序等。建立信息索引就是创建文档信息的特征记录，使检索者能快速地检索到所需信息。\n\
    \n## 3、搜索引擎的检索功能\n\n### （1）一般检索功能\n\n这是搜索引擎的最基本的作用。这些功能主要包括：布尔逻辑检索（Boolean）、词组检索（Phrase）、截词检索（Truncation）、字段检索（Fields）等。一般来说，每种搜索引擎并非包含了所有这些检索功能，而且每种搜索引擎对其中某一功能的侧重和表现也不相同。\n\
    \n## 2、搜索引擎（续）\n\n## 3、搜索引擎的检索功能\n\n### （2）特殊检索功能\n\n特殊检索功能包括：\n\n- 自然语言（Natural\
    \ Language）检索\n- 多语种检索\n- 区分大小写的检索\n\n## 2、搜索引擎（续）\n\n## 4、常用搜索引擎介绍\n\n- google（www.google.com）\n\
    - Yahoo！（www.yahoo.com 以及中文站点：cn.yahoo.com）\n- Altavista（www.altavista.digital.com）\n\
    - Lycos（www.lycos.com）\n- Hotbot（www.hotbot.com）\n- Northen Light（www.nlsearch.com）\n\
    - 天网（e.pku.edu.cn）\n- 网络指南针（www.compass.net.edu.cn）\n- 悠游北京（www.goyoyo.com.cn）\n\
    - 百度搜索（www.baidu.com）\n\n## 3、多元搜索引擎\n\n## 什么是多元搜索引擎\n\n多元搜索引擎（Metasearch Engine,\
    \ Megasearch Engine或Unified Search Engine）又称集成式搜索引擎，是将多个搜索引擎集成在一起，向用户提供一个统一的检索界面。并且将一个检索提问同时发给多个搜索引擎同时检索多个数据库，经过聚合、去除重复部分并输出检索结果。使用多元搜索引擎可让用户省时、省力。\n\
    \n## 4、搜索引擎的发展趋势\n\n- （1）使用简单化\n- （2）内容复杂化\n- （3）功能专业化\n- （4）索引智能化\n\n## 第七章\n\
    \n## 电子邮件（E-mail）\n\n## 7.1 电子邮件的基本概念\n\nE-mail is Internet最早的主要应用之一。\n\n大多数用户使用互联网，都是从使用电子邮件（Electronic\
    \ mail，简称E-mail）开始的。\n\nE-mail有着广泛的应用，方便、经济、快捷。\n\n提供Email收发的邮件服务器是各类网站的一个重要组成部分，尤其对于一个独立的企业或机构来说，建立邮件服务器是十分必要的。\n\
    \n## Email的作用和用途\n\n无论是在Internet的发展初期还是在目前，E-mail都是网络中的一个热门的应用。它快速、安全地将各种信息传送到网上的各个节点，与世界上的任何人进行通信和交流。\n\
    \n事实上，所有类型的信息（包括文本、图形、声音及各种程序文件都可以作为E-mail的附件在网络中传输。用户除了可通过Email实现快速的信息交换外，还可通过Email进行项目管理，并根据快速的Email信息进行重要的决策。\n\
    \n## Email的作用和用途\n\n- 接收\n- 制作\n- 发送\n- 管理\n\n多媒体电子信件\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_540_0.png)\n\
    \n## Email的编码标准\n\nE-mail在发送和传输过程中，必须对信息进行编码和解码，才能被正确传送和理解。在Email的传送过程中，涉及到三种编码标准：\n\
    \n- 1、UU编码（Unix to Unix Encoding）\n  这是原来在Unix系统中使用编、解码程序，在早期传送非ASCII文件时，最常用的就是这种UU编码方式。\n\
    - 2、MIME标准（Multipurpose Internet Mail Extensions）\n  其全名是多用途邮件传送扩展模式。它可以在Email中附加各种格式的文件（即附件）一起传送。MIME标准现已成为Email的主流。MIME定义了两种编码方式：QP编码规则和Base64编码规则。\n\
    - 3、Binhex编码\n  此编码方式主要用于Mac机，在X86系列PC中很少使用。\n\n## Email的地址格式\n\n要想在Internet上发送和接收信息必须要有唯一的地址来标识自己，在Internet上Email地址就是某个用户的电子邮件地址，它们都有同样的格式：\n\
    \n用户名（或用户标识符）@域名\n\n其中“域名”是指该用户名所在的邮件服务器的域名\n\n例如：\n\n- `student@hit.edu.cn`\n\
    - `hope@sohu.com`\n\n## Email的信息结构形式\n\nEmail的邮件结构形式由两部分组成：\n\n- 1、头部（Header）\n\
    \n在头部中包含的信息有：发送方和接收方地址、日期、主题、应收到副本的人员列表等信息。\nEmail软件在收发信息时必须使头部保持标准格式。\n\n- 2、主体（Body）\n\
    \n其中包括信息的文本，即邮件的内容。\n\n## Email的结构形式\n\n- 收信人地址\n- 抄送人地址\n- 邮件主题\n- 邮件内容\n- 发信人地址（自动）\n\
    - 发送邮件的时间（自动）\n- 发信人名称（自动）\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_544_0.png)\n\
    \n## Email的结构形式\n\n## 在Email中常用的关键字及其含义：\n\n- From\n  发信人地址（自动）\n- To\n  收信人地址\n\
    - Cc（或抄送）\n  复制副本地址（Carbon copy）\n- Bcc（或密件抄送）\n  盲复制副本地址（Blind Carbon copy）\n\
    - Subject\n  邮件主题\n- Date\n  发送邮件日期时间（自动）\n- Reply To\n  回复地址\n- X-Charset\n \
    \ 使用的字符集（通常为ASCII）\n- X-Mailer\n  发送Email所使用的软件\n- X-Sender\n  发送方地址的副本\n\n##\
    \ 7.2 Email的协议\n\n在Email中采用客户机/服务器（client/server）或浏览器/服务器的工作方式。\n客户端Email的发送和接收都是通过邮件服务器来完成的。按其功能可分为发送邮件服务器和接收邮件服务器，它们各使用不同的协议。\n\
    \n## 发送邮件服务器\n\n常使用的是SMTP（Simple Mail Transfer Protocol）协议。\n\n## 接收邮件服务器\n\n\
    常使用的是POP3（Post Office Protocol 3）协议。\n"
