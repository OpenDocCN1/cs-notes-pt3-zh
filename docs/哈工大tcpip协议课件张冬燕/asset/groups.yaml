  - '[PAGE 0]


    # GOOGLE搜索从入门到精通'
  - '[PAGE 1]


    # 前言


    +   - 以前的学习，一般需要预先在肚子里存储下足够的知识，必要时，就从海量的信息中提取所需的部分。


    +   - 但是，到了信息领域大大超出“四书五经”的新时期，预先无目的的吞下海量信息的学习方式就有些不合时宜了。


    +   - 旧有的学习方式需要变更以适应这个信息爆炸的年代。目的明确的去学习，即先知道要学什么，然后有目的的去寻找答案，这种方式看上去更加有效率。


    +   - 新的学习方式的实施的前提：


    +     - 首先，要求学习者拥有一个包罗万象的信息库，以供随时抽取各种目的信息；


    +     - 其次，需要一个强劲的信息检索工具，以便高效率的从信息库中提取信息。


    +     - 很明显，Internet可以充当那个海量的信息库，而搜索引擎，则正是寻找光明之火的绝好工具。


    +   - 我们非常幸运的有了：GOOGLE'
  - '[PAGE 2]


    # 摘要


    +   - 简要的介绍了 **GOOGLE** 的历史和特点，

    +   - **GOOGLE** 的基本搜索语法和高级搜索语法，

    +   - **GOOGLE** 的特色功能，包括图片搜索、新闻组搜索和集成工具条等，

    +   - 简单的介绍了一些常用搜索技巧和实用个案。

    +   - http://www.google.com/about.html'
  - '[PAGE 3]


    # GOOGLE简介


    +   - Google（www.google.com）是一个搜索引擎，由两个斯坦福大学博士生Larry Page与Sergey Brin于1998年9月发明，Google
    Inc.于1999年创立。2000年7月份，Google替代Inktomi成为Yahoo公司的搜索引擎，同年9月份，Google成为中国网易公司的搜索引擎。98年至今，GOOGLE已经获得30多项业界大奖。


    +   - GOOGLE的成功得益于其强大的功能和独特的特点：

    +     - GOOGLE支持多达132种语言，包括简体中文和繁体中文；

    +     - GOOGLE网站只提供搜索引擎功能，没有花里胡哨的累赘；

    +     - GOOGLE速度极快，据说有10000多台服务器，200多条T3级宽带；

    +     - GOOGLE的专利网页级别技术PageRank能够提供高命中率的搜索结果；

    +     - GOOGLE的搜索结果摘录查询网页的含有关键字的內容，而不仅仅是网站简介；

    +     - GOOGLE智能化的“手气不错”功能，提供可能最符合要求的网站；

    +     - GOOGLE的“网页快照”功能，能从GOOGLE服务器里直接取出缓存的网页。'
