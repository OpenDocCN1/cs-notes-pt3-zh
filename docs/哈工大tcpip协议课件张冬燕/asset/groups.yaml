    # 全球范围Internet的形成


    +   早期的Internet是为了促进科学与教育的发展而建立的，因此被严格地限制在科技与教育领域


    +   由于美国Internet技术的发展，各国也相继发展起来，并开始进行了互连，从而使用户数急剧增加。


    +   1992年，正式成立了Internet协会，届时联机数目已经以百万计。'
  - '[PAGE 63]


    # 1.1 计算机网络的起源与发展


    # Internet的发展经历了三个阶段：


    +   - 1969~1983　研究试验阶段

    +   - 1983~1994　实用阶段，在美国和一些发达国家的大学及研究部门得到广泛应用

    +   - 1994~至今　商业化阶段，除教育科研网外，政府部门、商业企业单位以及个人开始广泛使用Internet'
  - '[PAGE 64]


    # 1.1 计算机网络的起源与发展




    +   - 计算资源共享；

    +   - 互连的计算机是分布在不同地理位置的多台独立的“自治计算机”（autonomous computer）；

    +   - 连网计算机必须遵循共同的网络协议；'
  - '[PAGE 65]


    # 与传输介质有关的概念


    +   - **吞吐量/数据传输率**

    +     - 在一个给定时间内介质能够传输的数据量, bps

    +     - 每种介质都有其潜在的吞吐量

    +   - **带宽**

    +     - 介质能传输的最高和最低频率之差，Hz

    +     - 任何一个物理系统都有其有限带宽

    +   - **带宽与数据传输率的关系**

    +     - 1924, Nyquist定理

    +       - 无噪声信道环境下 max baud rate = 2 * Bandwidth

    +     - 带宽越高数据传输率越大'
