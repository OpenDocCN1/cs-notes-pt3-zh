    # 计算机互联网初期的特点：


    +   - 以通信线路为基础，建立远程终端，构造分时系统。这种具有通信功能的终端便是早期的计算机网络。

    +   - 主要特点是将通信技术与计算机技术相结合，建立了总长度为240万公里的远程终端


