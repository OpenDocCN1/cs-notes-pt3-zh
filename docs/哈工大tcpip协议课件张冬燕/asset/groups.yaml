  - '[PAGE 427]


    # TCP的半关闭


    +   TCP提供了连接的一端在结束它的发送后还能接收来自另一端数据的能力


    +   当收到半关闭的一端在完成它的 数据传送后，将发送一个FIN关闭 这个方向的连接， 当对第二个FIN进行确认后，连接 彻底关闭。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_427_0.png)'
  - '[PAGE 428]


    # TCP的半连通


    +   - 一方已经关闭或异常终止连接而另一方还不知道, 称之为半连通 (half-open)

    +   - 只要不打算在半连通的连接上传输数据, 仍处于连接的一方就不会去监测另一方已经出现异常

    +   - 原因

    +     - 主机异常

    +     - 客户机掉电

    +   - 模拟的例子--服务器异常

    +     - 用telnet连接, 输入字符

    +     - 断开server的电缆, 重新启动

    +     - 客户端继续输入命令, 此时服务器将以复位段应答

    +     - “Conectionclosed by foreign host”'
