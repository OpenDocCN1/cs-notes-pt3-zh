  - '[PAGE 274]


    # 4.3 路由协议—路由器


    # 连接不同类型的网络并完成协议转换


    +   - Internet所面对的是各种不同类型的网络，各网之间需要进行桥接

    +   - 不同的网络运行的是不同的通信协议，需要转换


    # 路由搜索与选择


    +   - 在Internet范围内采用的是网状自由联接，信息发送不能采用广播方式，因此需要进行路由选择。常见的路由搜索方式是距离向量路由协议与链路状态路由协议两种。


    # 网络管理和安全


    +   - 一个网络如果确定一个或有限个出入口，可以通过限制出入的方式对内部网络进行保护。'
