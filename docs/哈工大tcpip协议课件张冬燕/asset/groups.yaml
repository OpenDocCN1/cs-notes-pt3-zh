    - 网络图以数据库的形式表示，库中记录每个节点与其相邻节点的连接情况；\n- 库的更新是以广播的方式实现，即每个节点收到一个路由广播报文，接收后再向其它链路广播。\n\
    - 为防止一个广播路由信息无限制地在网上传送，每个广播报文需要给一个编号，一旦一个节点再次收到一个针对同一个路由信息且编号相同的报文时则销毁而不再对外广播。\n\
    \n## 最短路径算法-SPF\n\n- 网络中的每个路径均按最小成本准则分配相应的权重\n\n- 每个节点有一个标签, 记录了自己到源节点的度量值(初始时为∞)\n\
    \n- 每个节点对其与其相邻节点的关系进行检查, 从源节点开始作为第一个工作节点\n\n- 在下一次迭代运算中, 距离工作节点最近的节点成为新的工作节点,\
    \ 直到检查了数据库中所有节点为止\n\n## 最短路径算法-SPF\n\n## 节点A为源节点\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_288_0.png)\n\
    \n- 通过查阅LSA数据库，节点B和C被加入到当前工作节点集\n- 经过检查链路度量较小的节点将成为新的工作节点，C变为工作节点\n\n## 最短路径算法-SPF\n\
    \n## C成为工作节点\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_289_0.png)\n\n到目前, 已经知道从A到C、B、D、E、I的“最短路径”\n\
    \n但随着工作节点的变化 “最短路径” 也会发生变化\n\n## 最短路径算法-SPF\n\n## D成为工作节点\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_290_0.png)\n\
    \n- 如果某个节点的标签与其邻接节点链路度量之和小于该邻接节点的标签值，则说明找到了一个到达源节点的更短路径\n- 节点A和B之间还有更佳的路径, A->C->D->B,\
    \ 度量值为7\n  - 跳距多不一定意味着链路度量值大\n- 重复上述过程, 最后每个节点标签反映的就是它与源节点之间具有最小成本的路径\n\n## 最短路径算法-SPF\n\
    \n## 节点A的路由拓扑\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_291_0.png)\n\n带括号的数字表示了该节点在生成树中的选择顺序\n\
    \n## 构造生成树的过程\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_292_0.png)\n\n- 所有节点彼此相连\n\
    - 不存在环路\n\n## 路由信息的跨域传播\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_293_0.png)\n\
    \n- Router C的路由表\n- 目标=跳数\n- A=1 经由C\n- B=2 经由C\n- C=0 经由C\n- D=1 经由C\n- E=1 经由C\n\
    - F=2 经由C\n- G=2 经由C\n\n- 路由器C和路由器X分别为路由域1和2的边界路由器\n- 路由器X利用C的路由表获得RD1内各节点的可达性信息\n\
    - 路由器X不关心C如何获得这些信息\n\n## 路由信息的跨域传播\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_294_0.png)\n\
    \nRouter C的路由表\n目标=跳数\nA=1 经由C\nB=2 经由C\nC=0 经由C\nD=1 经由C\nE=1 经由C\nF=∞ 经由C\n\
    G=2 经由C\n\n- 设路由器F和路由器K也可以同时交换路由信息\n- 设E和F之间链路中断, C则更改路由表, 并且将更改之后的消息发给X\n\n##\
    \ 路由信息的跨域传播\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_295_0.png)\n\nRouter C的路由表\n\
    目标=跳数\nA=1,经由C\nB=2 经由C\nC=0 经由C\nD=1 经由C\nE=1 经由C\nF=3,经由C\nG=2 经由C\n\n- 但路由器X通过和K交换信息知道有更好的到达F的路径:X->K->F\n\
    - 该信息从X传回C, C则相应更新自己的路由表\n\n## 因特网主要路由协议\n\n| 协议 | 类型 | 距离矢量 | 链路状态 | 变化 | 聚合\
    \ | 非对称 |\n|---|---|---|---|---|---|---|\n| RIP | D-V |  |  | UDP | 无 | 是 | D/F\
    \ | 是 | 否 |\n| OSPF | L-S |  |  | IP | 有 | 是 | D/P | 是 | 是 |\n| BGP | D-V/L-S\
    \ |  |  | TCP | 有 | 是 | D/P | 是 | 是 |\n| IGRP | I-S |  |  | IP | 无 | 是 | D/P |\
    \ 是 | 否 |\n| EIGRP | D-V |  |  | IP | 有 | 是 | D/P | 是 | 否 |\n| PNNI | L-S |  |\
    \  | ATM | 有 | 否 | D/P | 是 | 是 |\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_296_0.png)\n\
    \n- 类型\n  - D-V 距离向量\n  - L-S 链路状态\n- 路径——通告的路径数值\n- 邻居——发现邻居的能力以及问候（hello）能力\n\
    \n- 变化：对变化的处理能力\n  - D：动态\n  - P：部分通告\n  - F：全路由表通告\n- 聚合——地址聚合能力\n- 非对称——两个方向上度量不同\n\
    \n## 4.4 差错报告机制ICMP\n\n## Internet上的差错\n\n- 可能的差错\n  - 通信线路、处理器、目的主机关机\n  - 数据报生命周期变为0\n\
    \  - Router拥塞 等等\n- 对于同一个网络\n  - 可以利用特殊硬件来报告错误\n- 对于互联网\n  - 发送方很难判断传送失败的原因，如错误发生在哪里\n\
    \  - IP协议本身没有处理错误的机制\n\n## 4.4 差错报告机制ICMP\n\n- Internet Control Message Protocol-ICMP\n\
    - 当出现发送不能进行的网络问题时，提供IP设备交换关于问题信息的服务\n- 用于Router向其他Router或主机发送差错或控制报文\n- IP协议的一部分，二者相互依赖\n\
    \  - ICMP利用IP传递信息\n  - IP利用ICMP发送差错与控制信息\n- 使用者\n  - Router\n  - 主机\n\n## 差错报告与差错改正\n\
    \n- ICMP是一个差错报告机制,但并没有指定对错误所应采取的措施(交给应用程序或其他协议处理)\n\n- ICMP只与源主机进行通信\n  - IP数据报中只有源主机和目的主机IP\n\
    \  - Router没有全局的路由知识,不知道数据报所走过的路径\n  - Router不能悄悄丢弃数据报,而是利用ICMP报告错误,由高层协议或管理员来处理问题\n\
    \n## ICMP报告的错误类型\n\nIP数据报的发送可能失败\n\n根据失败的原因, ICMP决定是否报告\n\n两种失败\n- 暂时性失败\n  -\
    \ 如校验和错误, 发送者可能会发现(根据上层协议的可靠性机制)这个失败, 并重发\n  - 一个包不太可能重复出现同样的问题\n  - 忽略之\n- 半永久性失败\n\
    \  - 如无效的目的IP地址、TTL为0等等\n  - 需要立即向发送源报告, 说明出现了重要问题\n\n## ICMP报文的传送\n\n## 二级封装\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_302_0.png)\n\n## 一些问题\n\n- ICMP报文有没有优先级?是否有特别的可靠措施?\n\
    \n- 如果携带ICMP报文的IP数据报出现差错怎么办?\n\n- 为什么利用IP数据报传递信息而不直接用数据帧?\n"
