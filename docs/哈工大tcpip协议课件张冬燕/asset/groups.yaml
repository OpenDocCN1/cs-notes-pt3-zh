  md: "\n## Serv-U软件配置\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_626_0.png)\n\n\
    ## Serv-U软件配置\n\n### Admin privilege\n\nIf the user should have (remote) administrative\
    \ privileges please select the appropriate level below.\n\nAccount admin privilege\n\
    \nNo Privilege\n\nPrevious\n\nCancel\n\nNext\n\nServer is offline\n\nStop Server\n\
    \nServer is build 4.0.0.4\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_628_0.png)\n\
    \n## 远程登录(Telnet)\n\nTelnet（Telecommunication Network Protocol的缩写，远程登陆）是Internet上用来进行远程访问的重要工具，也是一个仿真终端程序。\n\
    \n- 指用户正在使用的系统，如本地计算机或本地终端。\n- 指本地用户使用Telnet登录到的另一系统。如远程计算机或远程主机。\n- 指本地计算机通过网络连接到另一台远程计算机上进行访问，可以使用该远程计算机的硬件、软件数据甚至全部资源。或者说将本地计算机仿真成远程主机的终端，并运行该机提供的各种程序\n\
    \n## 1、Telnet的使用\n\n### 使用Telnet的前提\n\n- 预先知道远程系统的IP地址或域名、端口号\n- 系统管理员认可的注册过程，即用户名和口令\n\
    \n### 启动Telnet\n\n- Telnet+IP或域名\n- Telnet-->Connect IP或域名、端口号、用户名、口令\n\n### 退出Telnet\n\
    \n- “连接” -->“退出”\n\n## 2、Unix上的TelNet\n\n- 登录到Unix主机\n- 输入用户名和口令\n- 使用telnet\n\
    - telnet ip(或主机名)\n  - telnet 202.112.58.200(清华大学BBS)\n  - telnet bbs.tsinghua.edu.cn\n\
    - 帐号和口令\n- logout返回到本主机\n\n```\nC:\\WINDOWS\\system32\\cmd.exe\nMicrosoft Windows\
    \ XP [版本 5.1.2600]\n(C) 版权所有 1985-2001 Microsoft Corp.\nC:\\Documents and Settings\\\
    zdy>telnet 202.118.236.190\n```\n\n回收站\n我的文档\nAdobe Reader 6.0\nmp3\nMedia Player\
    \ Classic\nMSN Messenger\nRealPlayer\n... \n金山词霸 2005\n中国方式 Internet\n\n## 电子公告牌系统（BBS）\n\
    \n- BBS（Bulletin Board System，电子公告牌系统或电子布告栏系统）\n- 具有信息交流、问题解答、电子邮件的功能。一般的BBS都有各自的主题或兴趣领域，并由个人或组织来管理和维护。\n\
    \n## 1、 BBS的主要功能\n\n- 1、内部通信：企业机构可通过安装BBS来加强职员间的通信，而学校可以用BBS加强与教师和学生之间的联系和交流。\n\
    - 2、顾客服务或支持：通过BBS可以发布新产品及其性能特点之类的信息、发放演示程序和最新的驱动程序、反馈客户意见，加强对客户的支持服务。使客户随时可在BBS上获得问题的答案。\n\
    - 3、讨论区：这是BBS最主要的功能，包括：各类学术专门讨论区、疑难问题解答区、闲聊区等。目前BBS上常设的有数十个各具特色的分类讨论区。\n\n## 3、国内的BBS的发展\n\
    \n- 国内第一个BBS站点\n  - 清华大学的“水木清华”\n- 各入网大学都建立自己的BBS\n- 商业网站的BBS\n- 工大的BBS站点\n  -\
    \ 紫丁香 bbs.hit.edu.cn\n\n## 4、BBS的建立和管理\n\n### 基于Telnet BBS\n\n服务器端\n\n- telnet服务器\n\
    - BBS软件： C++程序\n- 支持英文、中文GB、中文BIG5\n\n客户机端\n\n- telnet软件\n\n### 基于Web BBS\n\n\
    服务器端\n\n- web服务器\n- BBS软件： 网页\n- 支持英文、中文GB、中文BIG5\n\n客户机端\n\n- 浏览器\n\n### BBS站管理\n\
    \n讨论区，版主\n监控文章\n\n## 5、使用BBS--远程终端方式\n\n- 用telnet连接到BBS服务器\n- 登录\n- 选择讨论区\n- 阅读文章\n\
    - 发表文章\n- 实时交谈\n- 在线帮助\n\n## 6、使用BBS--Web方式\n\n- 用浏览器打开BBS网页\n- 登录\n- 选择讨论区\n\
    - 阅读文章\n- 发表文章\n- 实时交谈\n- 在线帮助\n\n## 7、部分著名的BBS站点\n\n### BBS地址\n\n- bbs.hit.edu.cn\n\
    - www.ytht.net\n- bbs.tsinghua.edu.cn\n- bbs.pku.edu.cn\n- www.scut.edu.cn\n-\
    \ www.zsu.edu.cn\n"
