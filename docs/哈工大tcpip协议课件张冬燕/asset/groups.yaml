    # 有关路由表的一些命令


    # Route


    +   - Route print--用于显示路由表中的当前项目

    +   - route add--添加路由。添加目标为10.41.0.0，子网掩码为255.255.0.0，下一个跃点地址为10.27.0.1，跃点数为 7
    的路由：

    +     route add 10.41.0.0 mask 255.255.0.0 10.27.0.1 metric 7

    +   - route change--修改现有路由。将目标为10.41.0.0，子网掩码为255.255.0.0 的路由的下一个跃点地址由10.27.0.1
    更改为10.27.0.25:

