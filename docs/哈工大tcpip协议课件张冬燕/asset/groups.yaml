    \ 如 (128.10.2.3, 25), 也称为套接字(Socket)\n\n- 如两台计算机的TCP连接可以定义成 (18.26.0.36, 1069)\
    \ 和 (128.10.2.3, 25)\n\n- 多个连接可以共享一个端点, 如HTTP服务\n\n- 与UDP的端口多路复用不同, TCP可以通过套接字对区分发送到相同端口的不同连接\n\
    \n## 端口、连接的例子\n\nhost A\n\nserver B\n\nsource port: x\ndest. port: 23\n\nsource\
