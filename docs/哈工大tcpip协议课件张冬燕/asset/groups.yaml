  md: "\n## 3.4 地址解析——免费ARP\n\n- 192.168.10.10发出免费ARP请求广播\n  - 如果有响应则表明有IP地址冲突\n-\
    \ 一些问题\n  - 如果一个配置错误的主机发出免费ARP请求，那么所有其他设备将更新ARP缓存，从而使用了错误的硬件地址，这样客户一直会向配置错误的主机发送信息——鲁莽的更新！\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_227_0.png)\n\n## 有关子网掩码、ARP的一个实验\n\n\
    ![](img/6da04d1fb563df13affe55d3e3f152ec_228_0.png)\n\n### 实验步骤一\n\n设置两台主机的IP地址与子网掩码：\n\
    - A: 10.2.2.2 255.255.254.0\n- B: 10.2.3.3 255.255.254.0\n\n两台主机均不设置缺省网关。\n\n\
    用 `arp -d` 命令清除两台主机上的ARP表。\n\n在A与B上分别用ping命令与对方通信，分别显示：\n- A: Reply from 10.2.3.3:\
    \ bytes=32 time<10ms TTL=128\n- B: Reply from 10.2.2.2: bytes=32 time<10ms TTL=128\n\
    \n用 `arp -a` 命令可以在两台PC上分别看到对方的MAC地址。\n\n分析：由于主机将各自通信目标的IP地址与自己的子网掩码相“与”后，发现目标主机与自己均位于同一网段（10.2.2.0），因此通过ARP协议获得对方的MAC地址，从而实现在同一网段内网络设备间的双向通信。\n\
    \n### 实验步骤二\n\n将A的子网掩码改为：255.255.255.0，其他设置保持不变。\n\n**操作1**：用 `arp -d` 命令清除两台主机上的ARP表，然后在A上“ping”B，在A上显示结果为：`Destination\
    \ host unreachable`\n\n用 `arp -a` 命令在两台PC上均不能看到对方的MAC地址。\n\n**分析1**：A将目标设备的IP地址（10.2.3.3）和自己的子网掩码（255.255.255.0）相“与”得10.2.3.0，和自己不在同一网段（A所在网段为：10.2.2.0），则A必须将该IP分组首先发向缺省网关。由于A的缺省网关没有配置，无法对分组进行正确发送，因此显示“目标主机不可到达”。\n\
    \n**操作2**：接着在B上“ping”A，在B上显示结果为：\n\n```\nRequest timed out\n```\n\n此时用 `arp -a`\
    \ 命令可以在两台PC上分别看到对方的MAC地址。\n\n**分析2**：B将目标设备的IP地址（10.2.2.2）和自己的子网掩码（255.255.254.0）相“与”，发现目标主机与自己均位于同一网段（10.2.2.0），因此，B通过ARP协议获得A的MAC地址，并可以正确地向A发送Echo\
    \ Request报文。但由于A不能向B正确地发回Echo Reply报文（原因见分析1），故B上显示ping的结果为“请求超时”。\n\n在该实验操作中，通过观察A与B的ARP表的变化，可以验证：在一次ARP的请求与响应过程中，通信双方就可以获知对方的MAC地址与IP地址的对应关系，并保存在各自的ARP表中。\n\
    \n### 实验步骤三\n\n用 `arp -d` 命令清除A中的ARP表，在A上ping一台外网段的主机，如202.116.64.8，再用 `arp -a`\
    \ 可观察到A的ARP表中只有缺省网关的MAC地址信息。\n\n分析：当源主机要和外网段的主机进行通信时，它并不需要获取远程主机的MAC地址，而是把IP分组发向缺省网关，由网关完成IP分组的转发过程。如果源主机没有缺省网关MAC地址的缓存记录，则它会通过ARP协议获取网关的MAC地址，因此在A的ARP表中只观察到网关的MAC地址记录，而观察不到远程主机的MAC地址。\n\
    \n## IP 地址与地址解析\n\n内容结束\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_233_0.png)\n\
    \n## 第四章 TCP/IP协议\n\n### 4.1 IP 协议\n\n- IP协议为传输协议提供了基本的（不可靠、无连接）发送服务。所有的TCP、UDP、ICMP数据都以IP数据报格式传输。IP负责获取信息并发送到目的主机和网络。\n\
    - 不可靠（unreliable）：它不保证IP数据报能成功地到达目的地，仅提供最好的传输服务。如发生某种错误时，IP有一个简单的错误处理算法：丢弃该数据报，然后发送ICMP消息报给信源端。任何要求的可靠性必须由上层来提供（如TCP）。\n\
    - 无连接（connectionless）：IP并不维护任何关于后续数据报的状态信息。每个数据报的处理是相互独立的。\n\n**Internet服务的三个层次**\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_236_0.png)\n\n- 分离的层次可以在不干扰其他服务的情况下替换某个服务\n\
    - 底层的无连接包发送服务是基础\n\n**无连接-Connectionless**\n\n- 发送方\n  - 组装数据包发送\n  - 将地址放入数据包中已经定义好的位置\n\
    \  - 将数据包送到网络上传输\n- 网络\n  - 使用目的地址转发数据包\n  - 传输者\n\n**无连接网络的特点**\n\n- 数据包含有确切的目的地址\n\
    - 每个包独立处理\n- 传输数据之前不需要任何 setup\n- 发送数据之后不需要任何 cleanup\n- 不可靠\n  - 数据包可能延迟、丢失、重复、乱序\n\
    - 每个包经过的路径可能不一样\n- Best-effort\n- 类似于发送明信片\n\n**IP包（Internet Packets）**\n\n- 动机\n\
    \  - Router无法在异构网络之间传递数据帧\n  - 必需定义独立于硬件的数据包格式\n- 抽象的\n- 只能被软件创建和识别\n- 包括发送方和接收方地址\n\
    - 大小取决于所传送的数据\n- 称为IP数据报 (IP Datagram)\n\n**IP数据报 (IP Datagram)**\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_240_0.png)\n\
    \n- **头部**\n  - 包括目的地址\n  - 固定字段\n- **数据区**\n  - 最高为64k的可变长度\n  - 没有最小长度限制\n\n\
    **IP数据报和IP包**\n\n- IP数据报“不是”IP发送的东西\n- 作为IP包来发送\n- IP包将IP数据报hop by hop发送到目的系统\n\
    - 很多时候一个IP数据报同时就是一个IP包\n- IP数据报作为主机发送的实体\n- IP包作为数据帧中传送的实体\n\n**IP数据报和IP包一示意图**\n\
    \n到192.168.20.60\n\n192.168.10.10  \n192.168.10.3  \n192.168.20.3  \n192.168.20.60\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_242_0.png)\n\n**IP数据报格式**\n\n- IP头部\n\
    - IP数据区\n- 控制码\n- 源IP地址\n- 目的IP地址\n- 再次分段后本段在原分组的相对位置\n- 允许再次分段标志\n- 版本\n- 头长度\n\
    - 服务类型\n- 校验和\n- 标志\n- 偏移\n\n**IP 数据报字段说明**\n\n**生命期TTL**\n\n- 避免数据报无限制地占用网络资源\n\
    - 以秒为单位或者以执行时间不足一秒的发送行为为单位的度量\n- 一般认为每经过一跳数值减1\n- 缺省值为64\n\n**头部校验和**\n\n- 检查数据报头部是否损坏\n\
    - 数据部分不需要检查\n  - 浪费时间\n  - 高层协议提供了检查机制\n  - 一些应用协议能够处理部分破坏了的数据\n\n**头部长度**\n\n\
    - 说明IP头部大小，以32比特倍数表示，最大值60字节？\n- 大部分IP数据报头部为20字节\n\n**数据服务类型和优先级TOS**\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_245_0.png)\n\
    \n| 优先级 | 定义 |\n| --- | --- |\n| 0 | 常规 |\n| 1 | 优先 |\n| 2 | 立刻 |\n| 3 | 急速 |\n\
    | 4 | 超急速 |\n| 5 | 火急 |\n| 6 | 互联网控制 |\n| 7 | 网络控制 |\n\n- C - Minimize Cost, 最小费用\n\
    - R - Maximize Reliability, 最高可靠性\n- T - Maximize Throughput, 最大吞吐量\n- D - Minimize\
    \ Delay, 最小延迟\n"
