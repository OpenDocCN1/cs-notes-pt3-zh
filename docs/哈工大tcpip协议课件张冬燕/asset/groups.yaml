    - 如：11001010 11000000 00100000 01100100


    ### 点分十进制表示：


    0.0.0.0表示某个未知地址主机，只用于指示源地址，表示本网络中的一个地址。


    255.255.255.255用于目的地址，表示广播至局域网所在的全部机器，该分组不会离开本机所在网络。


    ## IP地址的分类


    IP地址所包含的信息：


    IP地址是采用层次方式按逻辑网络的结构进行划分的，因此在IP地址中包含了两部分信息：


    - 网络地址（Network ID）：标识主机所在的逻辑网络。

    - 主机地址（host ID）：用来识别该网络中的一台主机。


    IP地址的类别：


    为了根据不同的网络规模来合理分配IP地址，通常将IP地址分为三个基本类：A类、B类、C类。还有2个特殊类：D类和E类。


    ## IP地址的分类


    ### IP地址的分类方法：


    ： 网络号； ： 主机号。


    ### A类


    用前7位来标识网络号，后24位标识主机号，最前面一位固定为“0”。这样A类所能表示的网络数范围为：0-127，适用于大型网络的管理。因此，A类地址空间范围为：1.
    x. y. z-126. x. y. z。0. x. y. z表示本网络的指定主机，127. x. y. z固定表示为本机环路地址，发出该地址的分组将不传出本机。A.
    255. 255. 255为直接广播地址，用于向A类地址范围内的全部主机进行广播，A. 0. 0. 0表示本网络中的某个地址。


