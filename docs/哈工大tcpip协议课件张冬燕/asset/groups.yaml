    ## 3.2 子网（subnet）


    - 在现有的三类网络的基础上将网络作进一步划分所得到的网络成为子网。即在内部可以直接通信的IP主机的集合

    - 每一个子网是一个完全独立的网络，子网之间，子网与一般的网络之间必须通过路由器作为网关来实现互联。

    - 划分子网有利于提高地址空间的实际利用率；在以太网的环境下有利于提高子网内的传输带宽。

    - 路由器通过子网掩码识别子网的地址。


    ## C类网络的子网划分


    ![](img/6da04d1fb563df13affe55d3e3f152ec_187_0.png)


    将主机标识位划分出若干位作为子网标识，子网标识位可由子网掩码确定。


    ## 子网掩码（subnet mask）


    ### 子网掩码


    - 是一个32比特的二进制代码，它使接收方很容易从IP 数据包的IP 地址中分出地址的网络标识部分和主机标识部分。


    ### 掩码解释


    - 如果某一位是打开的（“1”），地址中相应的位解释为网络位；如果该位是关闭的（“0”），地址中相应的位解释为主机地址。


    ## 标准子网掩码


    | 类型 | 网络掩码（二进制） | 网络掩码（十进制） |

    | --- | --- | --- |

    | A类 | 11111111000000000000000000000000 | 255.0.0.0 |

    | B类 | 11111111111111110000000000000000 | 255.255.0.0 |

    | C类 | 11111111111111111111111100000000 | 255.255.255.0 |


    - 将某类IP地址的子网掩码与对应的IP地址进行“与”运算，则可获得IP地址中的网络标识部分，以分辨出不同的网络。

    - 将某类IP地址的子网掩码与对应的IP地址进行“或”运算，则可获得IP地址中的主机标识部分，以分辨出不同的主机。


