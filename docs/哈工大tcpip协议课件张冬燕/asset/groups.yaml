  - '[PAGE 371]


    # 第四章


    # TCP/IP协议'
  - '[PAGE 372]


    # TCP/UDP协议


    # 传输层协议


    +   - TCP/IP协议栈中独立的一层

    +   - 在概念上位于应用层和IP层之间


    # 传输层协议的功能


    +   - 标识发送和接收数据的应用程序

    +   - 选择性的提供如下功能

    +     - 可靠性

    +     - 流量控制

    +     - 拥塞控制

    +   - 并不是所有的传输协议都提供上述功能'
  - '[PAGE 373]


    # 网络层协议与传输层协议对比


    ![](img/6da04d1fb563df13affe55d3e3f152ec_373_0.png)'
  - '[PAGE 374]


    ![](img/6da04d1fb563df13affe55d3e3f152ec_374_0.png)


    # TCP/UDP协议


    # 两个传输协议


    +   - Transmission Control Protocol (TCP)

    +   - User Datagram Protocol (UDP)


    # User Datagram Protocol (UDP)


    一种不可靠的、以数据报为中心的传输协议


    # Transmission Control Protocol (TCP)


    为应用程序提供了可靠的面向连接的传输服务'
  - '[PAGE 375]


    # User Datagram Protocol (UDP)


    +   - 用户数据报协议

    +   - 为那些不需要(或不使用)TCP所提供的面向连接服务的应用程序协议提供了低开销的传输服务

    +   - 经常使用广播或多播的应用程序以及那些需要快速的请求和查询周转时间的应用程序使用UDP'
  - '[PAGE 376]


    # User Datagram Protocol (UDP)


    +   一种不可靠的、以数据报为中心的传输协议

    +   - 类似于发明信片


    +   具有最小的

    +   - 费用

    +   - 计算量

    +   - 通信量


    +   可以同时给多个应用程序发送信息

    +   - TCP只能是两个'
  - '[PAGE 377]


    # 有限的可靠性


    # 不可靠的无连接是UDP的“特性”而不是“问题”


    +   - 相对TCP，具有低的开销

    +     - 发送广播信息

    +     - 需要轻便的请求和响应的程序

    +   - 自身不提供任何纠错和重发服务

    +     - 使用UDP的应用程序具有一定的错误纠正功能

    +     - 继承底层协议(数据链路协议)所提供的现有的可靠性

    +     - 目前大部分网络拓扑非常可靠

    +     - 提供了校验和服务(可选的)

    +   - 仍然是不可靠的, 应用层协议需要有相应的可靠性机制, 如TFTP'
