  - '[PAGE 137]


    # 2.2.2 OSI模型 - 链路层


    静态窗口流控：定义一个窗口大小，如4，选择4个帧附上窗口号发出，每收到针对一个窗口号的确认帧，该窗口号即可分配给新的帧。由此，最多未收到的确认帧数不会超过4个。


    动态窗口流控：接收方发阻塞帧来要求降速，发送方收到后则调小窗口；当发送方在长时间未收到阻塞帧时则尝试调大窗口。由此得到最佳速度。


    窗口控制：


    +   - 窗口是指可以放置一定数据帧的缓冲区。

    +   - 窗口流控就是通过控制缓冲区来控制数据传输速度的方法。'
