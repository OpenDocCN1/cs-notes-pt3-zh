    \n## HTTP简介\n\n现在在Internet中使用最广的莫过于HTTP协议了，也就是超文本传输协议，目前版本主要以HTTP/1.1为标准。\n\n\
    在HTTP协议中，服务端是指提供HTTP服务的部分，客户端是指你使用的浏览器或者下载工具等等。\n\n在通讯时，由客户端发出请求连接，服务端建立连接；然后，客户端发出HTTP请求（Request），服务端返回响应信息（Response），由此完成一个HTTP操作。\n\
    \n## HTTP协议的主要特点\n\n- ① 支持客户/服务器模式。\n- ② 简单快速：客户向服务器请求服务时，只需传送请求方法和路径。请求方法常用的有GET、HEAD、POST。每种方法规定了客户与服务器联系的类型不同。\n\
    \  - 由于HTTP协议简单，使得HTTP服务器的程序规模小，因而通信速度很快。\n- ③ 灵活：HTTP允许传输任意类型的数据对象。正在传输的类型由Content-Type加以标记。\n\
    - ④ 无连接：无连接的含义是限制每次连接只处理一个请求。服务器处理完客户的请求，并收到客户的应答后，即断开连接。采用这种方式可以节省传输时间。\n- ⑤\
    \ 无状态：HTTP协议是无状态协议。无状态是指协议对于事务处理没有记忆能力。\n\n### 支持以下三种请求\n\n- 1) GET请求，返回request-URI指出的任意信息。\n\
    - 2) HEAD请求，类似于GET请求，但服务器程序只返回指定文档的首部信息，而不包含实际的文档内容。该请求通常被用来测试超文本链接的正确性、可访问性和最近的修改。\n\
    - 3) POST请求用来发送电子邮件、新闻或发送能由交互用户填写的表格。这是唯一需要在请求中发送body的请求。使用POST请求时需要在报文首部Content-Length字段中指出body的长度。\n\
    \n```\nHTTP/1.0响应的格式是：\n\nstatus-line\n\nheaders（0个或多个）\n\n<blank line>\n\nbody\n\
    \nstatus-line的格式是：\n\nHTTP版本号 response-code response-phrase\n```\n\n## 首部字段\n\n\
    HTTP/1.0的请求和响应报文的首部均可包含可变数量的字段。用一个空行将所有首部字段与报文主体分隔开来。一个首部字段由字段名和随后的冒号、一个空格和字段值组成，字段名不区分大小写。\n\
    \n报文头可分为三类：一类应用于请求，一类应用于响应，还有一类描述主体。有一些报文头（例如：Date）既可用于请求又可用于响应。描述主体的报文头可以出现在POST请求和所有响应中。下图列出了17种不同的报文头。未知的报文头字段将被接收者忽略。\n"
