    \ Echo Request |\n| 11 | 数据报超时 |\n| 12 | 数据报参数出错 |\n| 13 | 时间戳请求 |\n| 14 | 时间戳响应\
    \ |\n| 15 | 信息请求(已废弃) |\n| 16 | 信息响应(已废弃) |\n| 17 | 地址掩码请求 |\n| 18 | 地址掩码响应 |\n\
    \n## Destination Unreachable错误消息\n\n## Network Unreachable\n\n- 报告Router的路由表中找不到通往目的网络的路径\n\
    \  - 试图连接一个私有网络地址\n  - 路由表被破坏\n  - 过时的Router\n- 源系统和目的系统之间所有的Router都会产生该错误\n-\
    \ 只是说明出现了暂时性的路由错误(短期、可修复)\n\n## Port Unreachable\n\n- 目的主机上特定目的端口号不可使用\n  - 客户试图连接某个服务器的应用程序,而服务器没有安装该应用程序或没有使用客户期望的端口号\n\
    - 几乎都由UDP产生\n\n## Destination Unreachable错误消息\n\n- **Host Unreachable**\n  - IP数据报不能发送到最终的目的系统\n\
    - **Protocol Unreachable**\n  - 目的系统的特定传输协议不可达\n- **Source Route Failed**\n  -\
    \ 路由器不能把包发送到该数据报Source Route IP Option字段中指定的下一跳路由器\n- **Destination Network Unknown**\n\
    \  - 目的网络根本不存在(有确切的证据)\n- **Destination Host Unknown**\n  - 目的主机确实不存在(证据)\n\n\
    ## 4.4 差异报告机制ICMP\n\n所有Destination Unreachable错误消息必须发送到引发这个错误的传输层\n\n- “软失败”，如Network\
    \ unreachable，传输层不应该取消该连接，若连接因该错误失败，则错误向上报告给应用层协议进而通知用户\n- “硬失败”，如Network unknown，则取消连接\n\
    \n## 4.4 差错报告机制ICMP\n\n## Exceeded(超时)错误消息\n\n- Time-To-Live Exceeded in Transit\n\
    \  - TTL为0, 而数据报还没有到达最终目的地\n  - Router不能转发TTL为0的数据报\n  - 缺省值为30或更多, 除非出现路由循环一般够用\n\
    \  - Traceroute\n- Fragment Reassembly Time Exceeded\n  - 没有在规定时间内收到所有的分段(Unix,\
    \ 60秒)\n- 所有Time Exceeded错误消息必须报告给引发这个失败的传输层, 但传输层不该取消这个连接\n\n## 4.4 差错报告机制ICMP\n\
    \n## Redirect错误消息\n\n- 如果用户在网络上有一个具有多个Router的路径，如果没有把数据报发送到“更好的”路由器，缺省路由器会用Redirect错误消息把正确的路由告诉发送者\n\
    - To Whom?\n  - 发送者\n- Who?\n  - 和发送者在同一个子网上的“缺省”路由器\n- 只要系统收到一个Redirect消息，并且它和设备处于同一网络，就必须更新自身路由表使用建议的路由器\n\
    \n## 4.4 差异报告机制ICMP\n\n## Redirect的例子\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_312_0.png)\n\
    \n- 192.168.10.10把包发送到缺省路由器192.168.10.3\n- 缺省路由器发现有“更好”的路由器192.168.10.1,并且和源主机在同一个网络\n\
    - 缺省路由器192.168.10.3向源主机发出Redirect错误,同时把源主机发送给它的信息转送给“更好”的路由器192.168.10.1\n- 此后源主机把所有发往192.168.30.10的包送往192.168.10.1\n\
    \n## 4.4 差错报告机制ICMP\n\n## Echo Request/Reply消息\n\n- 是两个最常用的ICMP消息类型。\n- 主机或路由器可以向指定目的主机或路由器发送一个Echo\
    \ Request，收到请求的目的机器向发送端返回一个Echo Reply - 不一定总能实现(安全原因)\n- 每个主机必须安装ICMP Echo服务器以及用于实现Echo消息的应用程序接口\n\
    - Echo Request/Reply模型与ICMP错误消息的单向性设计相反, ICMP错误消息只有发送没有响应\n\n## 4.4 差错报告机制ICMP\n\
    \n## 分段Echo Request/Reply查询消息\n\n192.168.30.10\n(4KB MTU)\n\n192.168.10.10\n(1.5KB\
    \ MTU)\n\n1.发往192.168.10.10\n的2KB Echo Request\n\n2.两个分段\n\n3\n\n4.包含 Echo Reply的两个分段\n\
    \n192.168.10.3\n192.168.30.3\n\nTunneling\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_314_0.png)\n\
    \n## 关于Ping\n\nPing允许用户向目的系统发送一个或多个ICMP Echo Request消息, 计算从探测开始到收到ICMP Echo Reply消息所花费的时间,\
    \ 来测试两个设备之间的网络连接\n\n- 四点\n  - 源主机与目的主机之间的Router工作正常\n  - 源主机为IP数据报选路的软件工作正常\n\
    \  - 目的主机正在运行, IP和ICMP正常工作\n  - 返回路径上Router有正确路由\n\n## 关于Ping\n\n## Ping的一些细节\n\
    \n- 每次会话中, ICMP Echo Request/Reply消息具有相同的ID\n- Ping本网段内的广播地址\n  - 一呼百应?\n  - RFC1122\
    \ “发往IP广播地址的ICMP Echo Request可以丢弃”\n\n## 关于Traceroute\n\n允许用户识别数据报发送往远程设备所经过的路径\n\
    \n## 工作原理：\n\n- 向目的系统发送一系列TTL数值逐渐增加的包, 监听ICMP Time Exceeded错误消息\n- 发送第一个包(TLL为1),\
    \ 本地网络上的第一跳路由器会返回ICMP Time Exceeded错误消息->获得第一跳路由器地址\n- 发送第二个包(TLL为2), 第二跳路由器会返回ICMP\
    \ Time Exceeded错误消息->获得第二跳路由器地址\n- 依此类推, 知道到达最终目的系统\n\n## Traceroute的的不同版本\n\n\
    - 不同版本的tracetoute使用不同类型的数据作为“种子” 数据报,得到的响应会有所不同\n- 大部分UNIX缺省版本使用UDP数据报\n  - 一次性发送3个UDP数据报\
    \ - 每个数据报的目的端口号都在增加\n  - 有可能出现防火墙阻断\n- 其他tracetoute使用ICMP Echo Request查询消息\n \
    \ - 发送TTL不同的请求信息,一旦到达目的地则目的系统返回响应\n  - 也存在被防火墙阻断的可能\n"
