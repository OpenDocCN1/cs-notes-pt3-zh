  - '[PAGE 66]


    # # 与传输介质有关的概念




    利用数字通信通道进行传输的方法称为基带传输。相应的信号称为“数字基带信号”


    +   • 计算机到监视器、打印机等外设的信号就是基带传输的。


    +   • 大多数的局域网使用基带传输，如以太网、令牌环网。




    利用模拟信号来传输数据信号的方法称为频带传输。借助频带传输，可以将链路容量分解成两个或更多的信道，每个信道可以携带不同的信号，这就是宽带传输。


    +   • 宽带传输中的所有信道都可以同时发送信号。如CATV、ISDN等。'
  - '[PAGE 67]


    # 1.2 计算机网络互连


    # 网络互连的必要性


    +   - 网络互连是局域网发展的必然趋势

    +   - 各种通信类型的网络需要长期共存

    +   - 网络的整体性能需要改善

    +   - 大量的异构网需要互连


    # 网络互联的结果


    +   - 由许多不同的异构 (heterogeneous) 网络开始

    +     - 连接这些物理网络

    +     - 使用软件手段使得连接之后的系统看起来是 “同类的” (homogeneous)

    +   - 称之为 internetwork 或 internet'
  - '[PAGE 68]


    # 网络互连的基本方式


    +   - 物理层中继系统（即中继器 Repeater）

    +   通常用于同种网络的物理层上，对所接受的信号进行再生和放大，以便扩大网络的作用范围。

    +   - 数据链路层中继系统（即网桥或桥接器）

    +   通常用于在数据链路层对帧信息进行存储转发。

    +   - 网络层中继系统（即路由器 Router）

    +   通常用于在网络层存储与转发分组数据。

    +   - 最高层中继系统（即网关或Gateway）

    +   这是最复杂的一种，通常用于在网络层以上的各层进行双向或单向的协议的转换，故网关又称为协议转换器。'
  - '[PAGE 69]


    # 1.2 计算机网络互连


    # 网络互连的基本方式（续）


    一般来说，网络互连的方式主要有：


    # （1）通过中继系统实现网络互连


    由于主机和节点是组成网络的基本部分，因此这类互连主要有两种方式：


    +   - 节点级互连（又称为分布式计算环境互连）

    +   - 主机级互连（又称为数据终端设备DTE互连）


    # （2）通过互连网进行网络互连


    当互连网络的数目较多时，通常的做法是：先用网关构成一个互连网，并为其制定一个大家都遵守的数据格式（协议），再把各个网络连接到网关上，这样就形成了互连网络。这种方式在数据从源到目的地时进行了两次协议转换：源网络协议→互连网协议；互连网协议→目的网络协议。'
