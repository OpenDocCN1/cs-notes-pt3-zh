  - '[PAGE 170]


    # 3.1 IP 地址


    主机（host）：


    +   - 连接到Internet上，并且运行了TCP/IP协议的任何计算机。


    主机地址（host address）：


    +   - 由于Internet是一个巨大的网络系统，为了实现数据通信，在其中进行通信或信息交换的基本要求就是网上的每台主机（如计算机、路由器等）都要有一个唯一的可标识的编号或名字，这一标识符称为主机地址。采用“IP地址”和“域名地址”'
  - '[PAGE 171]


    # 3.1 IP 地址


    # 物理地址：


    +   - 即主机的网卡地址。绝大多数物理地址都是以太网卡地址，它有48 位，以16进制的方式表示。例如：02-3f-8d-56-3e-40


    # IP地址：


    +   - 在Internet上为每台主机指定的地址称为IP地址。它是在TCP/IP协议中所规定的Internet 的每个节点都要有的统一格式的地址。是Internet
    主机地址的一种数字型标识，是一个机器可识别的地址。例如：202.118.224.153


    注意：一台计算机可以有多个IP地址，但一个IP地址不能由两台或两台以上计算机共同拥有'
  - '[PAGE 172]


    # IP地址的含义和特点


    # 它是Internet上通用的地址格式


    - 通过IP地址使得网上的计算机能够彼此交换信息，它采用32位二进制地址格式进行编码。IP地址能贯穿于整个网络，而不管每个具体的网络是采用何种技术或结构。


    # Internet上每台主机都必须有IP地址


    - IP地址是识别Internet上每台主机包括计算机、路由器等）的端口地址，凡是上网的计算机都必须分配有IP地址，否则无法进行通信。


    # IP地址是唯一的


    - IP地址是识别Internet上每台主机的身份证，因此每台计算机的IP地址在全网中是唯一的。'
