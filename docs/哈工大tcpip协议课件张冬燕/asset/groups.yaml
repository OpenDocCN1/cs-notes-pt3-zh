  - '[PAGE 284]


    # 4.3 路由协议


    # 路由搜寻协议的类型


    +   - 距离向量协议

    +     - 最小跳距

    +     - 距离→跳距；向量→地址

    +   - 链路状态协议

    +     - 每条链路有一个状态值

    +     - 路由选择的标准是构成该路径的所有链路的度量总和最小'
  - '[PAGE 285]


    # 距离向量路由协议


    # 距离向量路由协议遵循以下几个基本原则：


    +   - 每一个节点具有最基本的永久性信息，用于记录其地址和辨识与之相连接的链路；

    +   - 每个节点都定时向邻接节点广播其自身的路由信息，同时也接收邻接节点广播来的路由信息；

    +   - 接收邻接节点的路由信息后，依据该路由信息更新本地路由信息；更新方法是对没有的节点项则创建一个并在其距离向量之上加一，已存在的节点项则需比较一下两者那个更大，较小的一个将会留下

    +   - 整个计算采用的是分布式算法，几个节点独立计算，直到收敛为止。'
  - '[PAGE 286]


    # 链路状态路由协议


    链路状态路由协议遵循以下规则：


    +   - 每个节点均维持一个网络图的副本，并定时更新；

    +   - 网络图以数据库的形式表示，库中记录每个节点与其相邻节点的连接情况；

