    \n四次握手也不行 最后发出消息的指挥官永远无法确定信息是否安全到达\n\n> 如果连接的双方在的确信对方也准备释放连接之前都不准备断开连接,那么连接永远得不到释放！\n\
    \nZhang Dongyan\nTCP/IP Protocols\n44\n\n## 释放连接的设计 (1)\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_415_0.png)\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_415_1.png)\n\n(a)正常情况\n\n(b)最后的确认丢失\n\
