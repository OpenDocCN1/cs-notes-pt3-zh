  - '[PAGE 19]


    # 进阶搜索（续）


    +   - 搜索的关键字包含在网页标题中

    +     - “intitle”和“allintitle”的用法类似于上面的inurl和allinurl，只是后者对URL进行查询，而前者对网页的标题栏进行查询。网页标题，就是HTML标记语言title中间的部分。网页设计的一个原则就是要把主页的关键内容用简洁的语言表示在网页标题中。因此，只查询标题栏，通常也可以找到高相关率的专题页面。

    +     - 示例：查找日本明星藤原纪香的照片集。

    +       搜索：“intitle:藤原纪香 写真”

    +       结果：已搜索有关intitle:藤原纪香 写真 的中文(简体)网页。

    +       共约有465项查询结果，这是第1-10项。搜索用时0.16秒。'
  - '[PAGE 20]


    # 其他罕用语法


    +   - 搜索所有链接到某个URL地址的网页

    +     - 如果你拥有一个个人网站, 估计很想知道有多少人对你的网站作了链接。而 “link”语法就能让你迅速达到这个目的。

    +     - 示例: 搜索所有含指向华军软件园 “www.newhua.com”链接的网页。

    +       搜索: “link:www.newhua.com”

    +       结果: 搜索所有链接到www.newhua.com的网页。共约有856项查询结果, 这是第1-10项。搜索用时0.17秒。

    +     - 注意: “link”不能与其他语法相混合操作, 所以 “link:”后面即使有空格, 也将被GOOGLE忽略。

    +   - 查找与某个页面结构内容相似的页面

    +     - “related”用来搜索结构内容方面相似的网页。例: 搜索所有与中文新浪网主页相似的页面(如网易首页, 搜狐首页, 中华网首页等), “related:www.sina.com.cn/index.shtml”。'
