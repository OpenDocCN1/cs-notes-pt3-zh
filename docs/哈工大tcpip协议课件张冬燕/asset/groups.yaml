    # 响应代码


    服务器程序响应的第一行叫状态行。状态行以 HTTP 版本号开始，后面跟着3位数字表示响应代码，最后是易读的响应短语。下图列出了3位数字的响应代码的含义。根据第一位可以把响应分成5类。


    | 响应 | 说明 |

    | --- | --- |

    | 1yz | 信息型，当前不用

    成功

    200 OK, 请求成功

    201 OK, 新的资源建立 (post命令)

    202 请求被接受，但处理未完成

    204 OK, 但是没有内容返回 |

    |  | 重定向；需要用户代理执行更多的动作

    301 所请求的资源已被指派为新的固定URL

    302 所请求的资源临时位于另外的URL

    304 文档没有修改(条件GET) |

    |  | 客户差错

    400 错误的请求

    401 未被授权；该请求要求用户认证

    403 不明原因的禁止

    404 没有找到 |

    |  | 服务器差错

    500 内部服务器差错

    501 没有实现

    502 错误的网关；网关或上游服务器来的无效响应

    503 服务暂时失效 |


    # HTTP 3位响应码


    - 在GET请求中指出版本1.0。

    - 发送一个可以被服务器记录的简单的报文头： From。

    - 服务器返回的状态行给出了版本号、响应代码200和响应短语“OK”。

    - Date报文头给出服务器上的时间和日期，通常是格林尼治时间。上例中服务器返回一个老式时间串。推荐的格式应是：缩写的天，日期中不含连字符，4位数的年， 如：

    - Date: Sat, 19 Aug 1995 20:23:52 GMT


    # 其他的典型值是：


    ```

    Content-Type: text/html

    Content-Type: text/plain

    Content-Type: application/postscript

    ```


    如果报文主体是经过编码的，则Content-Encoding报文头也会出现。例如：如果返回的报文中含有经过Unix的compress程序压缩的PostScript文件(通常带有.ps.Z后缀)，下面的两种报文头会同时出现：


    ```

    Content-Type: application/postscript

    Content-Encoding: x-compress

    ```


    ![](img/6da04d1fb563df13affe55d3e3f152ec_446_0.png)


    - Last-Modified 指出了最后一次修改资源的时间。

    - 图象文件的长度(2859字节)在Content-Length报文中指出。


    在最后一个响应报文首部的后面，服务器程序紧跟着图象后发送了一个空行。User-Agent是公有的客户端程序报文头，它用来标识客户端程序的类型。下面是一些公有的报文头的例子：


    ```

    User-Agent: Mozilla/1.1N (Windows; I; 16bit)

    User-Agent: NCSA Mosaic/2.6bl (X11;SunOS 5.4 sun4m) libwww/2.12 modified

    ```


    # 例子：客户端缓存


    许多客户端程序根据获取文件中的日期和时间在硬盘上缓存HTTP文档。如果客户端要获取的文档已存储在客户端程序的缓存中，则客户端程序将发送If-Modified-Since报文首部。


    这样，如果服务器程序发现该文档没有发生任何变化，就无需再发送一次该文档了。这称为条件GET请求。


    ```

    sun % telnet www.aw.com 80

    Trying 192.207.117.2...

    Connected to aw.com.

    Escape character is ''^]''.

    GET /awplogob.gif HTTP/1.0

    If-Modified-Since: Saturday, 08-Aug-95 20:20:14 GMT


    HTTP/1.0 304 Not modified

    ```


