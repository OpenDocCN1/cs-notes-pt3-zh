    \n## 释放连接\n\n### 两种方式\n\n- 对称释放：将连接按照两个独立的单向连接来处理，要求每一方分别释放连接\n- 非对称释放：一方结束后，连接即告中断。类似于打电话。但是可能导致数据丢失。\n\
