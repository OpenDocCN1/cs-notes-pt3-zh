    \  - 响应信息直接发回请求方,不广播\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_218_0.png)\n\n\
    ## 正向地址解析协议工作原理示意图\n\n## 解析 202.118.224.2 的过程\n\n202.118.224.2 收到广播，是本机IP地址\n\n\
    ![](img/6da04d1fb563df13affe55d3e3f152ec_219_0.png)\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_219_1.png)\n\
    \n广播发送ARP请求报文：\n其中包含：1a-Pa，1b\n\n1a-Pa\n\n1b: 202.118.224.2 → 物理地址=?\n\n主机B的：IP:\
    \ 202.118.224.2\nEthernet（物理地址）：\n0800.0020.1111\n\nARP回应报文\n\n## 3.4 地址解析--ARP\n\
    \nARP高效运行的关键是由于每个主机上都有一个ARP高速缓存。这个高速缓存存放了最近Internet地址到硬件地址之间的映射记录。高速缓存中每一项的生存时间一般为20分钟，起始时间从被创建时开始算起。用arp\
    \ -a显示ARP高速缓存中所有的内容。48 bit的以太网地址用6个十六进制的数来表示。\n\n```\nC:\\Documents and Settings\\\
    yin.lh>arp -a\n\nInterface: 219.217.249.15 --- 0x2\n    Internet Address     \
    \     Physical Address      Type\n    219.217.249.126            00-08-e2-83-a0-0a\
    \     dynamic\n```\n\n## 3.4 地址解析--ARP\n\n## ARP缓存原理\n\n- 频繁的网络访问将可能使网络充满ARP广播信息而饱和。\n\
    - 请求方收到ARP响应后,会在本地缓存中保存响应方的硬件地址和IP地址对,以便下次使用时避免进行广播查询。\n- 响应一方也做类似处理。\n- 只有那些已经在缓存中存储了发送系统IP地址的系统才更新缓存的登记项,其他主机忽略ARP广播。\n\
    \n## 3.4 地址解析--ARP\n\n## ARP缓存大小\n\n- 缓存大小有限, 内容会被不断刷新\n  - 如一个客户经常访问不同的服务器并且其ARP缓存小于所连接系统数目，导致不断重写缓存内容\n\
    \  - 若有上百个设备，则理论上网络被ARP广播充斥而饱和\n  - 出现对某一台机器(ARP缓存很小)的过多访问将导致该机器ARP缓存的作用消失\n-\
    \ 大型多用户系统和高端Router一般有大缓存, 几百个登记项\n\n## 3.4 地址解析--ARP\n\n## 缓存的过期问题\n\n- 系统应该在ARP缓存中刷新掉那些已经闲置了一段时间的登记项\n\
    \n- 缓存登记项保留时间太长容易不准确（如机器更换新的IP地址）\n\n- 太短则影响性能（需要太多的广播）\n\n- 不同厂商的ARP过期值不一样\n\n\
    - Windows95, 120秒；\n- 服务器, 10分钟或更多；\n- Router, 4小时\n\n- 出现缓存更新时，时钟重置\n\n## 3.4\
    \ 地址解析--ARP\n\n## 静态缓存\n\n- 许多产品提供了在缓存添加静态登记项的实现\n  - 有的系统重启时清除静态登记项，然后重新加载\n\
    \  - 有的系统则为永久设置，需手动改变\n- 好处\n  - 网络安全策略(IP和硬件地址的绑定)\n  - 避免频繁的查找\n- 缺点\n  - 若系统经常移动或者频繁的重新编号则很麻烦\n\
    \n## 3.4 地址解析--ARP\n\n## ARP代理\n\n如果ARP请求是从一个网络的主机发往另一个网络上的主机，那么连接这两个网络的路由器就可以回答该请求，这个过程称作委托ARP或ARP代理(Proxy\
    \ ARP)。这样可以欺骗发起ARP请求的发送端，使它误以为路由器就是目的主机，而事实上目的主机是在路由器的“另一边”。路由器的功能相当于目的主机的代理，把分组从其他主机转发给它。\n\
    \n## ARP的一些变化（网络变化频繁时，经常采用）\n\n- DHCP ARP\n- Gratuitous ARP\n\n## 3.4 地址解析—免费ARP\n\
    \n设备广播自己的硬件地址和IP地址对，以使其其他设备更新(不是添加)其ARP缓存\n\n- 过程\n  - 发送者在请求信息的源IP和源硬件地址字段放入自己的地址\n\
    \  - 在目的IP字段中放入自己的IP地址\n  - 网络上其他设备听到该广播,若缓存中有该发送者的信息,更新之（重启更新计时器、更换新的硬件地址）\n\n\
    在服务器频繁地与很多不同客户通信时非常有用,使得客户每次同服务器通信时不必重新发送请求\n"
  mdcn: "\n## 一个典型的在以太网中客户与服务器使用 TCP/IP协议的通信。\n\n用户进程 FTP客户 <---------------------------->\
