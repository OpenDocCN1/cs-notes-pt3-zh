    \n“用户邮箱”\n\n“系统邮箱”或“电子邮局”\n\n“邮件/邮路”\n\n“系统邮箱”或“电子邮局”\n\n“用户邮箱”\n\n## 邮局协议第3版（POP3）\n\
    \n### POP3的用途和特点\n\nPOP3是接收Email的基本协议，也是TCP/IP协议组成员之一。它的作用是接收来自SMTP服务器的Email，在Windows平台上的Email客户端软件会与POP3服务器交互，收集由POP3服务器所接收到的用户的Email。基于POP3的Email系统能提供快速、经济和方便的Email接收服务。\n\
    \n### 基于POP3的工作过程\n\n用户通过常用的Email客户端软件（如：Foxmail、Outlook Express等），并经过相应的参数设置（如：POP3服务器的IP地址或域名、用户帐号、密码等），选择“接收（Receive）”操作，就可将所有邮件从远程邮件服务器中下载到用户的本地硬盘中进行阅读。\n\
    \n## 接收Email的新协议IMAP\n\n### IMAP的用途和特点\n\nIMAP（Internet Message Access Protocol：Internet信息接收协议）指从邮件服务器上直接收取邮件的协议，IMAP可以让用户远程拨号连接邮件服务器，并具有智能邮件存储功能，可在下载邮件之前预览信件主题和信件来源，并决定是否下载附件。用户可以在任何地方、任何机器上获取邮件信息。\n\
    \n由于不同厂商对最新版本的IMAP规范的解释有所不同，使得邮件客户机与服务器之间不一致，造成不同厂商产品之间的不兼容，故目前还没有大规模的使用，但IMAP由于其优越性，在将来不可避免地会得到迅速发展。目前IMAP与POP3共存使用。\n\
    \n## 电子邮件的工作原理\n\n- 采用客户机/服务器（client/server）或浏览器/服务器方式\n- 简单邮件传输协议（SMTP）\n  -\
    \ Simple Mail Transfer Protocol\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_552_0.png)\n\
    \n## 系统邮箱和用户邮箱\n\n### 系统邮箱（电子邮局）的特点\n\n- 要收到E-mail，必须有系统邮箱，系统邮箱必须设立在24小时开机的计算机上。该邮箱地址=用户电子邮件地址（用户申请时由管理员设立）\n\
    - 系统邮箱是私有的，任何人可向邮箱发来信件，但只有拥有者可以阅读和处理信件内容\n\n### 用户邮箱\n\n- 用户邮箱通常建立在使用邮件客户软件的计算机上。\n\
    - 邮箱就是一个文件，它的内容就是一段一段接在一起的电子邮件。\n- 用户在接收邮件时，可将系统邮箱中的邮件删除，保存于用户邮箱中。\n\n### 系统邮箱和用户邮箱的区别\n\
    \n用户邮箱\n用户机\n系统邮箱\n电子邮件服务器\n当有邮件发来时\n\n系统邮箱\n用户邮箱\n电子邮件服务器\n用户机\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_556_0.png)\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_557_0.png)\n\n## 电子邮件工作原理示意图\n\n##\
    \ 电子邮箱的进一步认识\n\n任何用户要接收电子邮件，必须要有用户电子邮箱（即用户帐号）和服务器电子邮箱（即邮局）\n\n- 服务器电子邮箱（或称邮局）放在邮件服务器上\n\
    - 用户电子邮箱由系统管理员分配，即服务器上一个文件或目录\n- 如student@hope.hit.edu.cn中的hope即服务器电子邮箱名，有时可省略；\n\
    - 服务器电子邮箱必须建立在24小时开机的计算机上，才能保证邮件不会丢失和及时接收。\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_559_0.png)\n\
    \n## E-mail通信协议\n\n| 发送 | 接收 |\n| --- | --- |\n| SMTP | POP3/IMAP |\n| MIME |\
    \ Internet网络 |\n\n- **SMTP**: Simple Mail Transfer Protocol. 只定义了发送方和接收方之间的连接传输。只能传送ASCII文本文件。\n\
    - **MIME编码标准**: Multipurpose Internet Mail Extensions. 解决了SMTP只能传送ASCII文件的限制，定义了各种类型数据（如声音、图象、表格等）的编码格式。可将它们作为邮件的附件传送。\n\
    - **POP3**: Post Office Protocol Version 3. 用户可以采用POP3协议来访问邮件服务器上的电子邮箱，接收邮件。\n\
    - **IMAP**: （Internet Message Access Protocol: Internet信息接收协议）指从邮件服务器上直接接收邮件的协议。\n\
    \n## E-mail服务器：电子邮局\n\n- 接收服务，发送服务。（二者可共用1台机器）\n- 管理、认证用户帐户\n- 管理用户邮箱\n- 必须24小时×365天开机，保证邮件不会丢失和及时收发\n\
    \nE-mail服务器\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_562_0.png)\n\n邮局\n\n##\
    \ 免费邮箱及其申请\n\n### 免费信箱的申请步骤：\n\n- 在浏览器地址栏输入提供免费邮箱服务的ICP的域名（或IP）地址\n- 点击申请邮箱按钮\n\
    - 要求同意其服务条款\n- 填写个人资料\n- 申请过程完成\n\n申请订阅电子刊物的过程基本类似\n\n## 7.3 E-mail客户端软件\n\n###\
    \ 概述\n\nEmail信息通常保存在邮件服务器中，因此首先应将邮件下载到自己的计算机中才能阅读（基于Web的Email可用WWW方式用浏览器软件进行阅读、编辑、收发、管理电子邮件），这时就需要用到Email的客户端软件。\n\
    \n### 作用\n\n- 接收、阅读、编辑、发送、管理电子邮件。\n\n### E-mail客户端软件的种类\n\n现在有许多种类的邮件客户端软件，常见的有：\n\
    \n- Foxmail：中国人自己开发的，中文处理能力强\n- Microsoft Outlook Express：微软产品\n- Netscape Message\
    \ Center：网景公司产品\n- Eudora：历史悠久，但中文处理能力较差\n- Sun Solaris Mailtool：太阳公司产品\n- The\
    \ Bat!\n- Unix的mail程序（纯字符界面）\n\n### Unix上的E-mail程序的应用\n\n- Telnet ＜邮件服务器地址＞\n\
    - 输入：用户名Username 和口令 Password\n- 在提示符下键入mail命令，进入邮件阅读方式\n- 回车键逐封阅读信件\n- ？命令看帮助信息\n\
    - d命令删除当前阅读邮件\n- q命令退出mail系统\n\n### Microsoft E-mail系统的使用\n\n- MS的Email程序Outlook\
    \ Express\n- 安装Outlook Express\n- Outlook Express窗口界面\n- 配置Outlook Express\n-\
    \ 使用Outlook Express\n\n**微软的Email程序Outlook Express**\n\n- 帐号管理\n- 邮件操作\n  - 编撰、发送、接收、回复、转发\n\
    - 通讯簿（地址簿）管理\n- 邮箱管理\n- 信纸管理\n- 配置（选项）管理\n\n**Outlook Express窗口界面**\n\n收件箱 - Outlook\
    \ Express\n\n- 收件箱\n- 发件箱\n- 已发送邮件\n- 已删除邮件\n- 草稿\n\n发件人: zhhj8@ppp.tppt.zj.cn\
    \ 收件人: asuperman8@163.net 主题: 邀请函\n\n邀请函\n\n为了扩大内需和加强技术合作，中华全国商业信息中心、中国轻工业信息中心、中国技术市场管理促进中心和浙江省台州市人民政府谨定于1999年11月18日至21日在台州市路桥区举行‘99中国日用...\n"
