    \ | NFS | 通常为UDP |\n| 流式多媒体 | 专用 | 通常为UDP |\n| 因特网电话 | 专用 | 通常为UDP |\n| 网络管理 |\
    \ SNMP | 通常为UDP |\n| 路由选择协议 | RIP | 通常为UDP |\n| 域名解析 | DNS | 通常为UDP |\n\n## Transmission\
    \ Control Protocol (TCP)\n\n- 为应用程序提供可靠的面向连接的传输服务\n- 在一个TCP连接中，仅有两方进行彼此通信.\n-\
    \ 两个应用程序通过TCP连接交换8bit字节构成的字节流。TCP不在字节流中插入记录标识符。\n- TCP对字节流的内容不作任何解释。TCP不知道传输的数据字节流是二进制数据、还是ASCII字符或者其他类型数据。\n\
    - 对字节流的解释由TCP连接双方的应用层解释。\n\n## 重发和确认\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_390_0.png)\n\
    \n## 重发和确认的一些问题\n\n### 确认的种类\n\n- 肯定的确认-ACK\n- 否定的确认-NAK\n\n### 重发\n\n- 由延迟引起\n\
    - 数据包和ACK都可能重复！\n  - 需要利用序号加以区分\n\n### 计时器的等待时间\n\n- LAN和WAN延迟不同,延迟始终在变化中\n- 为确定一个包的丢失等待足够长的时间,但决不会比必须等待的时间长\n\
    \n## 重发计时器的动态变化\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_392_0.png)\n\n## 可靠传输服务的特性(1)\n\
    \n- 把两个应用程序之间传输的数据看作字节流\n- 通信的两端建立虚电路\n- 可靠的连接建立\n- 完美的连接终止\n- 与打电话类似\n\n## 可靠传输服务的特性\
    \ (2)\n\n### 带缓冲的传送\n\n- 应用程序可以使用各种大小的数据片来发送\n- 接收端接收次序与发送次序相同\n- 协议软件可以将数据片根据需要分成若干段(与数据片大小无关)并负责组装成合适大小的数据报发送\n\
    - Push机制用来实现强迫的发送\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_394_0.png)\n\n##\
    \ 可靠传输服务的特性 (3)\n\n- 无结构的数据流\n- 全双工的连接\n  - 包括两个独立的、方向相反的数据流\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_395_0.png)\n\
    \n## TCP特性总结\n\n- TCP提供了一个完全可靠的、面向连接的、全双工的流传输服务，允许两个应用程序建立一个连接，并在任何一个方向上发送数据，然后终止连接。\n\
    - 每一个TCP连接可靠地建立、完美地终止，在终止发生前所有数据都会被可靠地传送。\n"
