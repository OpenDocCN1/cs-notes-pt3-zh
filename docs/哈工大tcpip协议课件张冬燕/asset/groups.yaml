    - 诺兰文\n- 爱沙尼亚文\n- 福典文\n- 立陶宛文\n- 简体中文\n- 繁体中文\n\n- 罗马尼亚文\n- 芬兰文\n- 英文\n- 荷文\n\
    - 葡萄牙语\n- 西班牙文\n- 阿拉伯文\n- 韩文\n\n## 结果数量\n\nGoogle的原始设定 (10 项) 最有效且快速。\n每页显示 10\
    \ 项搜索结果。\n\n## 结果预览\n\n开启新视窗以显示查询结果。\n\n## 补充几点\n\n- 几个关于google的常识：\n  - 词典功能。在引擎中填入任何一个字，点击结果中的那个关链字，google自动转到\
    \ www.dictionary.com 显示该字的解释。\n  - yahoo的搜索引擎买的就是google，如果google找不到，就别去yahoo了，也不要去网易。\n\
    \  - google每月更新一次web 数据库，如果google找不到，去更新最勤的 www.alltheweb.com —— 9到12天，或许有收获。google的新闻组数据库号称每天更新数次。\n\
    \  - google的爬虫只爬到每个文档的前110k字节处就停止了，所以长文档里面的部分，google会找不到。\n"
