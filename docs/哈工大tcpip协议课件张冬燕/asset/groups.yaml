    - **Web页或网页：** 若将WWW看成Internet上的大型图书馆，则每个Web站点就是一本书，每个Web页面就是其中的一张书页，是网络文件的组成部分\n\
    - **主页或首页（Homepage）：** 按上面的说法，主页就是该书（Web站点）的封面和目录或是整个网站文件的起始页。可从主页进入整个网站文件，开始对网站进行浏览。主页又代表整个网站文件的地址。\n\
    - **网络文件：** 存在于网络服务器上的完整信息的集合体，包含一个或多个网页。\n\n## 4、HTML语言的基本框架\n\n组成内容：\n\n- *\
    \ 文件的实际文字内容（如字母、数字、空格和标点符号等）\n- * 对该文件的格式和特性进行描述的HTML说明（标记）\n\n常用的标记有：\n\n- *\
    \ <HTML>...文件全部内容...</HTML>；表示HTML文件开始与结束，无属性。\n- * <HEAD>...</HEAD>；Web页面头部标记，其中内容一般是整个文件的序言，除显示<TITLE>中的内容外，其它内容均不显示。无属性。\n\
    \n## 5、HTML的标签\n\n- **HTML**文档由标签和文字组成；\n- 标签是一个用尖括号 <> 括起来的命令词,标签往往成对出现;不同标签之间可以嵌套,\
    \ 但不能交叉;\n- 文件一般以.htm或.html为扩展名;\n- **HTML**标签规定Web文档的逻辑结构, 并且控制文档的显示格式, 大部分HTML标签的形式:\n\
    \  〈标签名〉相应内容〈/ 标签名〉\n- 标签对大小写不敏感。\n\n## 7、HTML的基本结构\n\n```\n<html>\n  <head>\n\
    \    <title>...</title>\n    <meta>\n  </head>\n  <body>\n    ...\n  </body>\n\
    </html>\n```\n\n文档标题\n\n文档的主要内容\n\n## 8、HTML语言的基本框架\n\n- `<TITLE>...Web页面名称...</TITLE>`；用来给Web页面命名。浏览时，这一名称显示在浏览器的标题栏内。每一Web页只能有一个。\n\
    - `<BODY>...Web文件体的内容...</BODY>`；一定要包含在`<HTML>...</HTML>`标记之内。其中可以包含属性，如：`BACKGROUND=“背景图文件名”`；`BGCOLOR=“XXXX（背景颜色码，X为十六进制数）”`；`TEXT=“XXXX（文本颜色码）”`；`LINK=“XXXX（链接颜色码）`；`VLINK=“XXXX（已访问过的超链接颜色码）”`\n\
    - `<H>...</H>`；定义文件中各子标题的等级，以区分不同章节，x=1~6，即共有6级标题。\n\n## 8、HTML语言的基本框架（续）\n\n\
    <A>...</A>；定义超链接，其中可包含属性，属性可以为：HREF=“被链接的对象”，被链接对象可以是另一Web页、另一Web站点的主页、或自己的电子邮件地址、或进一步将图作为链接点\n\
    \n<FORM>...</FORM>；定义表单并可将用户在浏览器端输入的各种数据传送给Server端的CGI（Common Gateway Interface）程序。其中可包含两种属性：METHOD=“GET/POST（选择表单的传输协议）”，以及ACTION=“表单提交时调用的Server端程序”。\n"
