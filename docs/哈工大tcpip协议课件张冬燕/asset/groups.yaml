    # 1.5 Internet的组织管理与相关机构


    Internet 最大的特点是管理上的开放性，它没有集中的管理机构，为了促进Internet 运行所需的标准兼容性并确保Internet的持续发展，先后成立了一些机构自愿承担必需的管理职责，并且遵循自下而上的结构原则。下面介绍几个重要的Internet
    组织：


    # 1、Internet协会 (ISOC) 及其组织机构


    +   - **目的：** ISOC成立于1992年，总部在美国。是作为一个全球Internet协调与合作的国际组织而建立的。

    +   - **任务：** 确保全球Internet发展的有利性和开放性，并通过领导标准、议题和培训工作来发展互联网的相关技术。

    +   - **网址：** www.isoc.org'
