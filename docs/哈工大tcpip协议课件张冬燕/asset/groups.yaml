    Sense Multiple Access/Collision Detection)的共享访问方案。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_205_0.png)'
  - '[PAGE 206]


    # TCP/IP与以太网


    以太网和TCP/IP可以说是相辅相成的。


    +   - 以太网在一二层提供物理上的连线，使用48位的MAC地址

    +   - TCP/IP工作在上层，使用32位的IP地址

    +   - 两者间使用ARP和RARP协议进行相互转换。


    # 载波监听


    +   - 指在以太网中的每个站点都具有同等的权利，在传输自己的数据时，首先监听信道是否空闲，如果空闲，就传输自己的数据，如果信道被占用，就等待信道空闲。'
  - '[PAGE 207]


