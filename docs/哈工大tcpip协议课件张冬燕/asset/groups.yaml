    # 网上资源共享


    在Internet 中除了上述的Web资源外，还有大量的、相互独立的公共文件服务器，其中存储着各种有用的资源，供人们通过FTP（文件传输）手段进行获取。一般通过FTP下载的信息主要有以下三类：


    +   免费软件： 这类软件可供用户免费使用。


    +   共享软件： 这类软件只允许用户免费一段时间，到期后需交纳一定费用才能继续使用。


    +   公共档案文件： 如各国的人口统计资料、期刊杂志、艺术图片、科学实验结果等。'
