    - 若中国（cn）的DNS解析不了，将名字交给根中国教育科研网（edu）的DNS解析；

    - 若教育科研网（edu）的DNS解析不了，将名字交给根北京大学（pku）的DNS解析；

    - 最后由北京大学的DNS 解析出www.pku.edu.cn的IP地址为：202.112.7.12，并将该IP地址返回给用户。


