    - Last-Modified 指出了最后一次修改资源的时间。

    - 图象文件的长度(2859字节)在Content-Length报文中指出。


    在最后一个响应报文首部的后面，服务器程序紧跟着图象后发送了一个空行。User-Agent是公有的客户端程序报文头，它用来标识客户端程序的类型。下面是一些公有的报文头的例子：


    ```

    User-Agent: Mozilla/1.1N (Windows; I; 16bit)

    User-Agent: NCSA Mosaic/2.6bl (X11;SunOS 5.4 sun4m) libwww/2.12 modified

    ```


    # 例子：客户端缓存


    许多客户端程序根据获取文件中的日期和时间在硬盘上缓存HTTP文档。如果客户端要获取的文档已存储在客户端程序的缓存中，则客户端程序将发送If-Modified-Since报文首部。


    这样，如果服务器程序发现该文档没有发生任何变化，就无需再发送一次该文档了。这称为条件GET请求。


    ```

    sun % telnet www.aw.com 80

    Trying 192.207.117.2...

    Connected to aw.com.

    Escape character is ''^]''.

    GET /awplogob.gif HTTP/1.0

    If-Modified-Since: Saturday, 08-Aug-95 20:20:14 GMT


    HTTP/1.0 304 Not modified

    ```


