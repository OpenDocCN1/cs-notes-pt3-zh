    # 1.7 计算机网络发展趋势


    # 网络时代的三大定律


    摩尔定律：

    CPU性能18个月翻番，10年100倍。

    所有电子系统（包括电子通信系统，计算机）都适用


    光纤定律：

    超摩尔定律，

    骨干网带宽9个月翻番，10年10000倍。带宽需求呈超高速增长的趋势


    迈特卡尔夫定律:联网定律，

    网络价值随用户数平方成正比。未联网设备增加N倍，效率增加N倍。联网设备增加N倍，效率增加N²倍'
