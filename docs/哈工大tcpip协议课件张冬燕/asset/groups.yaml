    \n- 交换机是将各端口之间进行逻辑上的直联，因此不仅各端口可以同时进行传输，而且可以将网络划分为多个子段以提高广播效率。\n- 交换机可分为二层交换与三层交换，其中第二层交换作用在链路层，起到广播转发的作用，如以太网交换机。而第三层交换则作用在网络层，支持\
