    ## DNS的报文格式


    这个报文由2字节长的首部和4个长度可变的字段组成。标识字段由客户程序设置并由服务器返回结果。客户程序通过它来确定响应与查询是否匹配。16 bit的标志字段被划分为若干子字段，如下图所示。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_347_0.png)


    从最左位开始依次介绍各子字段：


    - **QR**是1 bit字段：0表示查询报文，1表示响应报文。

    - **opcode**是一个4 bit字段：通常值为0（标准查询），其他值为1（反向查询）和2（服务器状态请求）。

    - **AA**是1 bit标志，表示“授权回答（authoritative answer）”。该名字服务器是授权于该域的。


    ## DNS的报文格式


    - TC是1 bit字段，表示“可截断的（truncated）”。使用UDP时，它表示当应答的总长度超过512字节时，只返回前512个字节。

    - RD是1 bit字段表示“期望递归（recursion desired）”。该比特能在一个查询中设置，并在响应中返回。这个标志告诉名字服务器必须处理这个查询，也称为一个递归查询。如果该位为0，且被请求的名字服务器没有一个授权回答，它就返回一个能解答该查询的其他名字服务器列表，这称为迭代查询。在后面的例子中，我们将看到这两种类型查询的例子。


