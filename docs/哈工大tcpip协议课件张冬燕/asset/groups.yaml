  md: "\n## 与传输介质有关的概念\n\n利用数字通信通道进行传输的方法称为基带传输。相应的信号称为“数字基带信号”。\n\n- 计算机到监视器、打印机等外设的信号就是基带传输的。\n\
    - 大多数的局域网使用基带传输，如以太网、令牌环网。\n\n利用模拟信号来传输数据信号的方法称为频带传输。借助频带传输，可以将链路容量分解成两个或更多的信道，每个信道可以携带不同的信号，这就是宽带传输。\n\
    \n- 宽带传输中的所有信道都可以同时发送信号。如 CATV、ISDN 等。\n\n## 1.2 计算机网络互连\n\n### 网络互连的必要性\n\n-\
    \ 网络互连是局域网发展的必然趋势\n- 各种通信类型的网络需要长期共存\n- 网络的整体性能需要改善\n- 大量的异构网需要互连\n\n### 网络互连的结果\n\
    \n- 由许多不同的异构（heterogeneous）网络开始\n  - 连接这些物理网络\n  - 使用软件手段使得连接之后的系统看起来是“同类的”（homogeneous）\n\
    - 称之为 internetwork 或 internet\n\n### 网络互连的基本方式\n\n- 物理层中继系统（即中继器 Repeater）：通常用于同种网络的物理层上，对所接收的信号进行再生和放大，以便扩大网络的作用范围。\n\
    - 数据链路层中继系统（即网桥或桥接器）：通常用于在数据链路层对帧信息进行存储转发。\n- 网络层中继系统（即路由器 Router）：通常用于在网络层存储与转发分组数据。\n\
    - 最高层中继系统（即网关或 Gateway）：这是最复杂的一种，通常用于在网络层以上的各层进行双向或单向的协议转换，故网关又称为协议转换器。\n\n一般来说，网络互连的方式主要有：\n\
    \n#### （1）通过中继系统实现网络互连\n\n由于主机和节点是组成网络的基本部分，因此这类互连主要有两种方式：\n\n- 节点级互连（又称为分布式计算环境互连）\n\
    - 主机级互连（又称为数据终端设备 DTE 互连）\n\n#### （2）通过互连网进行网络互连\n\n当互连网络的数目较多时，通常的做法是：先用网关构成一个互连网，并为其制定一个大家都遵守的数据格式（协议），再把各个网络连接到网关上，这样就形成了互连网络。这种方式在数据从源到目的地时进行了两次协议转换：源网络协议→互连网协议；互连网协议→目的网络协议。\n\
    \n### 网络互连的常用设备\n\n- (1) 中继器（Repeater）：用来扩展单段网络的长度，作用：对信号进行再生和放大。\n- (2) 路由器（Router）：这是实现异构型网络互连的重要设备。它可将众多不同类型的网络连接成一个大型网络。其功能包括：路由选择、包的存储与转发、网络分段、流量控制、网络管理等。\n\
    - (3) 网关（Gateway）：也是用于异构型网络互连的设备。主要功能是进行协议转换和数据重新分组。通常用于网络层、运输层和应用层，主要有：协议网关、应用网关和安全网关。\n\
    - (4) 集线器（Hub）\n- (5) 交换机（Switch）\n\n### 计算机网络互连——中继器\n\n中继器又称为转发器，工作在物理层，用于连接以太制式的总线式网络。中继器实现网络在物理层上的连接，起到扩展网络连接距离的作用。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_71_0.png)\n\n中继器分为直接放大式和信号再生式两种：\n\n\
