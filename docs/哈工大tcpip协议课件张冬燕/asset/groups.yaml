    # 什么是计算机网络？


    +   - 计算机网络是地理上分散的多台独立自主的计算机遵循约定的通讯协议，通过软、硬件互连以实现交互通信、资源共享、信息交换、协同工作以及在线处理等功能的系统。

    +   - 计算机网络与国际电话系统十分相似 -- 没有人能完全拥有或控制它，但连接以后却能使它象大型网络一样运转。'
