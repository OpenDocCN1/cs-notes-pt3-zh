  - "[PAGE 220]\n\n# 3.4 地址解析--ARP\n\nARP高效运行的关键是由于每个主机上都有一个ARP高速缓存。这个高速缓存存放了最近Internet地址到硬件地址之间的映射记录。高速缓存中每一项的生存时间一般为20分钟，起始时间从被创建时开始算起。用arp\
    \ -a显示ARP高速缓存中所有的内容。48 bit的以太网地址用6个十六进制的数来表示。\n\n```\nC:\\Documents and Settings\\\
    yin.lh>arp -a\n\nInterface: 219.217.249.15 --- 0x2\n    Internet Address     \
    \     Physical Address      Type\n    219.217.249.126            00-08-e2-83-a0-0a\
    \     dynamic\n```"
  - '[PAGE 221]


    # 3.4 地址解析--ARP


    # ARP缓存原理


    +   - 频繁的网络访问将可能使网络充满ARP广播信息而饱和。

    +   - 请求方收到ARP响应后,会在本地缓存中保存响应方的硬件地址和IP地址对,以便下次使用时避免进行广播查询。

    +   - 响应一方也做类似处理。

    +   - 只有那些已经在缓存中存储了发送系统IP地址的系统才更新缓存的登记项,其他主机忽略ARP广播。'
  - '[PAGE 222]


    # 3.4 地址解析--ARP


    # ARP缓存大小


    +   - 缓存大小有限, 内容会被不断刷新

    +     - 如一个客户经常访问不同的服务器并且其ARP缓存小于所连接系统数目，导致不断重写缓存内容

    +     - 若有上百个设备，则理论上网络被ARP广播充斥而饱和

    +     - 出现对某一台机器(ARP缓存很小)的过多访问将导致该机器ARP缓存的作用消失

    +   - 大型多用户系统和高端Router一般有大缓存, 几百个登记项'
  - '[PAGE 223]


    # 3.4 地址解析--ARP


    # 缓存的过期问题


    +   - 系统应该在ARP缓存中刷新掉那些已经闲置了一段时间的登记项


    +   - 缓存登记项保留时间太长容易不准确（如机器更换新的IP地址）


    +   - 太短则影响性能（需要太多的广播）


    +   - 不同厂商的ARP过期值不一样


    +   - Windows95, 120秒；


    +   - 服务器, 10分钟或更多；


    +   - Router, 4小时


    +   - 出现缓存更新时，时钟重置'
  - '[PAGE 224]


    # 3.4 地址解析--ARP


    # 静态缓存


    +   - 许多产品提供了在缓存添加静态登记项的实现

    +     - 有的系统重启时清除静态登记项，然后重新加载

    +     - 有的系统则为永久设置，需手动改变

    +   - 好处

    +     - 网络安全策略(IP和硬件地址的绑定)

    +     - 避免频繁的查找

    +   - 缺点

    +     - 若系统经常移动或者频繁的重新编号则很麻烦'
  - '[PAGE 225]


    # 3.4 地址解析--ARP


    # ARP代理


    如果ARP请求是从一个网络的主机发往另一个网络上的主机，那么连接这两个网络的路由器就可以回答该请求，这个过程称作委托ARP或ARP代理(Proxy ARP)。这样可以欺骗发起ARP请求的发送端，使它误以为路由器就是目的主机，而事实上目的主机是在路由器的“另一边”。路由器的功能相当于目的主机的代理，把分组从其他主机转发给它。


    # ARP的一些变化（网络变化频繁时，经常采用）


    +   - DHCP ARP

    +   - Gratuitous ARP'
  - '[PAGE 226]


    # 3.4 地址解析—免费ARP


    设备广播自己的硬件地址和IP地址对，以使其其他设备更新(不是添加)其ARP缓存


    +   - 过程

    +     - 发送者在请求信息的源IP和源硬件地址字段放入自己的地址

    +     - 在目的IP字段中放入自己的IP地址

    +     - 网络上其他设备听到该广播,若缓存中有该发送者的信息,更新之（重启更新计时器、更换新的硬件地址）


    在服务器频繁地与很多不同客户通信时非常有用,使得客户每次同服务器通信时不必重新发送请求'
