  - '[PAGE 303]


    # ICMP报文的传送


    # 问题的说明


    +   - ICMP消息封装在IP数据报的数据部分，随IP数据报在网上转发的。由于IP数据报是不可靠传输的，因此ICMP消息的传输也是不可靠。

    +   - 为避免出现有关差错报文的差错报文，规定如果包含ICMP报错消息的IP数据报出错，则不再产生新的ICMP消息

    +   - 一般不把ICMP作为高层协议，而只作为IP必须的一个部分，之所以把ICMP消息封装在IP数据报中，只是因为回送ICMP消息需要跨越多个物理网络，因而不可能在物理层传送'
  - '[PAGE 304]


    # ICMP报文格式


    +   - ICMP有一个预先定义好的消息集合,每个消息都提供专用的功能

    +   - 根据报告消息的功能不同,有不同类型的ICMP报文

    +   - 都以相同的如下三个字段开头


    | 8 | 8 | 16 |

    |---|---|---|

    | TYPE | CODE | 校验和 |

    | 具体内容(随消息类型而变) |  |  |


    +   - TYPE-报文类型

    +   - CODE-报文类型的进一步消息'
  - '[PAGE 305]


    # 4.4 差错报告机制ICMP


    # ICMP报文的类别


    +   - 差错报文

    +     - 包含出错的数据报的头部

    +     - 前64bit数据

    +     - 包含这两项的原因是使源主机能更准确地判断该IP报是由哪种上层协议以及哪一个应用程序发送的（因为TCP/IP的上层协议通常把关键信息编码放在前64位，如端口号）

    +   - 信息报文'
  - '[PAGE 306]


    # 4.4 差错报告机制ICMP


    # ICMP消息类型


    | 类型字段 | ICMP 消息类型 |

    | --- | --- |

    | 0 | Echo Reply |

    | 3 | 目的不可达 |

    | 4 | 源站抑制 |

    | 5 | 重定向(改变路由) |

    | 8 | Echo Request |

    | 11 | 数据报超时 |

    | 12 | 数据报参数出错 |

    | 13 | 时间戳请求 |

    | 14 | 时间戳响应 |

    | 15 | 信息请求(已废弃) |

    | 16 | 信息响应(已废弃) |

    | 17 | 地址掩码请求 |

    | 18 | 地址掩码响应 |'
  - '[PAGE 307]


    # Destination Unreachable错误消息


    # Network Unreachable


    +   - 报告Router的路由表中找不到通往目的网络的路径

    +     - 试图连接一个私有网络地址

    +     - 路由表被破坏

    +     - 过时的Router

    +   - 源系统和目的系统之间所有的Router都会产生该错误

    +   - 只是说明出现了暂时性的路由错误(短期、可修复)


    # Port Unreachable


    +   - 目的主机上特定目的端口号不可使用

    +     - 客户试图连接某个服务器的应用程序,而服务器没有安装该应用程序或没有使用客户期望的端口号

    +   - 几乎都由UDP产生'
  - '[PAGE 308]


    # Destination Unreachable错误消息


    +   - **Host Unreachable**

    +     - IP数据报不能发送到最终的目的系统

    +   - **Protocol Unreachable**

    +     - 目的系统的特定传输协议不可达

    +   - **Source Route Failed**

    +     - 路由器不能把包发送到该数据报Source Route IP Option字段中指定的下一跳路由器

    +   - **Destination Network Unknown**

    +     - 目的网络根本不存在(有确切的证据)

    +   - **Destination Host Unknown**

    +     - 目的主机确实不存在(证据)'
  - '[PAGE 309]


    # 4.4 差异报告机制ICMP


    所有Destination Unreachable错误消息必须发送到引发这个错误的传输层


    +   - “软失败”，如Network unreachable，传输层不应该取消该连接，若连接因该错误失败，则错误向上报告给应用层协议进而通知用户

    +   - “硬失败”，如Network unknown，则取消连接'
  - '[PAGE 310]


    # 4.4 差错报告机制ICMP


    # Exceeded(超时)错误消息


    +   - Time-To-Live Exceeded in Transit

    +     - TTL为0, 而数据报还没有到达最终目的地

    +     - Router不能转发TTL为0的数据报

    +     - 缺省值为30或更多, 除非出现路由循环一般够用

    +     - Traceroute

    +   - Fragment Reassembly Time Exceeded

    +     - 没有在规定时间内收到所有的分段(Unix, 60秒)

    +   - 所有Time Exceeded错误消息必须报告给引发这个失败的传输层, 但传输层不该取消这个连接'
  - '[PAGE 311]


    # 4.4 差错报告机制ICMP


    # Redirect错误消息


    +   - 如果用户在网络上有一个具有多个Router的路径，如果没有把数据报发送到“更好的”路由器，缺省路由器会用Redirect错误消息把正确的路由告诉发送者

    +   - To Whom?

    +     - 发送者

    +   - Who?

    +     - 和发送者在同一个子网上的“缺省”路由器

    +   - 只要系统收到一个Redirect消息，并且它和设备处于同一网络，就必须更新自身路由表使用建议的路由器'
  - '[PAGE 312]


    # 4.4 差异报告机制ICMP


    # Redirect的例子


    ![](img/6da04d1fb563df13affe55d3e3f152ec_312_0.png)


    +   - 192.168.10.10把包发送到缺省路由器192.168.10.3

    +   - 缺省路由器发现有“更好”的路由器192.168.10.1,并且和源主机在同一个网络

    +   - 缺省路由器192.168.10.3向源主机发出Redirect错误,同时把源主机发送给它的信息转送给“更好”的路由器192.168.10.1

    +   - 此后源主机把所有发往192.168.30.10的包送往192.168.10.1'
  - '[PAGE 313]


    # 4.4 差错报告机制ICMP


    # Echo Request/Reply消息


    +   - 是两个最常用的ICMP消息类型。

    +   - 主机或路由器可以向指定目的主机或路由器发送一个Echo Request，收到请求的目的机器向发送端返回一个Echo Reply - 不一定总能实现(安全原因)

    +   - 每个主机必须安装ICMP Echo服务器以及用于实现Echo消息的应用程序接口

    +   - Echo Request/Reply模型与ICMP错误消息的单向性设计相反, ICMP错误消息只有发送没有响应'
  - '[PAGE 314]


    # 4.4 差错报告机制ICMP


    # 分段Echo Request/Reply查询消息


    192.168.30.10

    (4KB MTU)


    192.168.10.10

    (1.5KB MTU)


    1.发往192.168.10.10

    的2KB Echo Request


    2.两个分段


    3


    4.包含 Echo Reply的两个分段


    192.168.10.3

    192.168.30.3


    Tunneling


    ![](img/6da04d1fb563df13affe55d3e3f152ec_314_0.png)'
  - '[PAGE 315]


    # 关于Ping


    Ping允许用户向目的系统发送一个或多个ICMP Echo Request消息, 计算从探测开始到收到ICMP Echo Reply消息所花费的时间, 来测试两个设备之间的网络连接


    +   四点

    +   - 源主机与目的主机之间的Router工作正常

    +   - 源主机为IP数据报选路的软件工作正常

    +   - 目的主机正在运行, IP和ICMP正常工作

    +   - 返回路径上Router有正确路由'
  - '[PAGE 316]


    # 关于Ping


    # Ping的一些细节


    +   - 每次会话中, ICMP Echo Request/Reply消息具有相同的ID

    +   - Ping本网段内的广播地址

    +     - 一呼百应?

    +     - RFC1122 “发往IP广播地址的ICMP Echo Request可以丢弃”'
  - '[PAGE 317]


    # 关于Traceroute


    允许用户识别数据报发送往远程设备所经过的路径


    # 工作原理：


    +   - 向目的系统发送一系列TTL数值逐渐增加的包, 监听ICMP Time Exceeded错误消息

    +   - 发送第一个包(TLL为1), 本地网络上的第一跳路由器会返回ICMP Time Exceeded错误消息->获得第一跳路由器地址

    +   - 发送第二个包(TLL为2), 第二跳路由器会返回ICMP Time Exceeded错误消息->获得第二跳路由器地址

    +   - 依此类推, 知道到达最终目的系统'
  - '[PAGE 318]


    # Traceroute的的不同版本


    +   - 不同版本的tracetoute使用不同类型的数据作为“种子” 数据报,得到的响应会有所不同

    +   - 大部分UNIX缺省版本使用UDP数据报

    +     - 一次性发送3个UDP数据报 - 每个数据报的目的端口号都在增加

    +     - 有可能出现防火墙阻断

    +   - 其他tracetoute使用ICMP Echo Request查询消息

    +     - 发送TTL不同的请求信息,一旦到达目的地则目的系统返回响应

    +     - 也存在被防火墙阻断的可能'
