    # 2. 2. 5 OSI模型 - 会话层


    +   - 为会话用户提供一个建立连接及在上按顺序传送数据的方法。

    +   - 负责每一站究竟什么时间可以传送与接收数据。

    +   - 会话连接与传输层有差别，前者需双方同意才可中断连接，后者可单方中断，有如电话。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_146_0.png)'
  - '[PAGE 147]


    # 2.2.5 OSI模型 - 会话层


    # 对话控制


    +   - 单工、半双工，双工

    +   - 原则上，所有OSI连接都是双工的，但是多数情况下高层软件采用半双工形式，要求用户轮流发送数据，目的是方便软件设计。


    # 会话管理


    +   - 帮助在服务请求者与服务提供者之间建立和维护通信

    +   - 建立连接，数据传输，连接释放'
