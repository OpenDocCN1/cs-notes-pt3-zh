  - '[PAGE 139]


    # 2.2.3 OSI模型 - 网络层


    错误控制：分组最后仍需要进行差错校验，已确定是否需要补发分组。分组的丢失也需要补发。由于应答信号的丢失可能造成重发，根据分组号可重发

    分组顺序控制：由于采用分组传送，接收端所收到的分组可能会乱序。就虚电路而言，原则不应出现乱序，但如果出现错误或断电需要重建虚电路，重建的一次寻址过程是先确定IP地址，再确定各分组加上组号，以便
    MAC地址，然后再确定服务地址，即端口号。

    拥塞控制：在...状态恢复出来，并在...口号。

    接节点机速度慢，速度不匹配；另一是线路容量饱和，导致节点机不能及时接收。


    分组交换：以固定长信息包为单位进行传送


    +   - 错误控制，分组顺序控制，拥塞控制


    网络互连：跨网络及多协议的转换


    +   - 中继器，网桥，路由器，交换机，网关'
  - '[PAGE 140]


    # 路由选择算法


    ![](img/6da04d1fb563df13affe55d3e3f152ec_140_0.png)'
  - '[PAGE 141]


    # 路由选择算法


    # 扩散式： 将报文同时向多个路径广播的路由法


    +   - 全扩散：典型的广播方法，可保证以最短的时间到达目的地。有两种方法可以确保不会出现洪泛现象

    +     - 通过设置生命周期控制，即将数据包设为路径长短的生命周期，每通过一个路由器就减一，使得未能到目的地的报文及时丢失掉。在不知路径长度时可设为网络的半径长度。

    +     - 各路由器将接收的每一个报文均记录下来，一旦多次接收便抛弃而不再向外广播。


    +   - 选择扩散：向通往目的节点的部分端口送报文，有两种选择方法

    +     - 向大概方向发送，一般不会出现逆向连接

    +     - 随机选择一些通道发送出去。'
  - '[PAGE 142]


    # 路由选择算法


    # 单路发送：只选择一个端口发送报文的路由法


    +   - 确定性路由算法：典型的静态路由法，事先人为地确定路由信息，可以设置概率路径。


    +   - 自适应路径算法


    +   - 最短路径法：通过纪录实际的报文传输中最短传输时间所对应的路径，即通过接收了带有路径纪录参数的报文后获得出发节点到本节点的路径长度，保留短的纪录。是一种基于全网的全局算法。


    +   - 局部延时法：通过纪录到达各直达邻点的传输时间来确定最短路径，也可以无条件将报文交到排队最少的端口通道。这是一种孤立式路径选择。


    +   - 分布式适应性路由算法：如同距离矢量法一样，将本节点到其它节点的延迟时间传送出去，以便确定哪条路径传输最短，是上两种方法的结合。'
  - '[PAGE 143]


    # 2.2.4 OSI模型 - 传输层


    +   传输层的目的是在源端与目的端之间建立可靠的端到端服务。隔离网络的上下层协议，使得网络应用与下层无关。


    +   在网络中负责相当于链路层的错误控制，流量控制及顺序问题


    +   寻址，段合并，连接服务


    ![](img/6da04d1fb563df13affe55d3e3f152ec_143_0.png)'
  - '[PAGE 144]


    # 2.2.4 OSI模型 - 传输层


    网络服务通常分为三类：

    A类：该服务不存在分组错误，丢失及乱序。这种情况仅存在于局域网中。

    B类：这类分组很少发生单个分组的丢失，丢失的分组可在底层恢复，但由于拥塞的问题及软硬件的缘故仍然会有问题，因此在传输层解决差错问题。如X.25网。

    C类：是一种完全不可靠的服务，分组丢失和重复，顺序也完全无规律，通常不提供连接。因此主要靠传输层来完成差错控制及重发等工作

    C类服务并不一定是最差，通常下层作了大量的工作并不一定是上层所需要的，还需重做。因此数据报类型的传输也有其市场。'
  - '[PAGE 145]


    # 2.2.4 OSI模型 - 传输层


    # TCP/UDP协议


    传输控制层协议(TCP)和用户数据报协议(UDP)是Internet的传输层协议，其支持主机之间的端到端的连接。TCP包括分组排序、流控、差错控制等，UDP不包括差错控制、重排序等，是不可靠的高速协议。


    # SPX协议


    序列分组交换(SPX)协议是Novell的传输层协议，是面向连接的协议，其包括连接控制、数据流控制、差错控制、分组排序。


    # AppleTalk协议


    ATP协议是苹果公司的传输层协议，提供两个主机之间的可靠的不丢失的分组发送技术。'
