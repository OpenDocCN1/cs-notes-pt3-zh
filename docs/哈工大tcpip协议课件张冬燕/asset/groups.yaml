    # # 端口、连接和端点


    +   - TCP使用端口号来标识主机上的多个目的的进程


    # ## TCP连接


    +   - 用一对端点来表示


    +   - 端点：一对整数(IP地址, 端口号), 如 (128. 10. 2. 3, 25), 也称为套接字(Socket)


    +   - 如两台计算机的TCP连接可以定义成 (18. 26. 0. 36, 1069) 和 (128. 10. 2. 3, 25)


    +   - 多个连接可以共享一个端点, 如HTTP服务


    +   - 与UDP的端口多路复用不同, TCP可以通过套接字对区分发送到相同端口的不同连接'
