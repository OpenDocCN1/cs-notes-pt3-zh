    - 大多数的局域网使用基带传输，如以太网、令牌环网。\n\n利用模拟信号来传输数据信号的方法称为频带传输。借助频带传输，可以将链路容量分解成两个或更多的信道，每个信道可以携带不同的信号，这就是宽带传输。\n\
    \n- 宽带传输中的所有信道都可以同时发送信号。如 CATV、ISDN 等。\n\n## 1.2 计算机网络互连\n\n### 网络互连的必要性\n\n-\
    \ 网络互连是局域网发展的必然趋势\n- 各种通信类型的网络需要长期共存\n- 网络的整体性能需要改善\n- 大量的异构网需要互连\n\n### 网络互连的结果\n\
    \n- 由许多不同的异构（heterogeneous）网络开始\n  - 连接这些物理网络\n  - 使用软件手段使得连接之后的系统看起来是“同类的”（homogeneous）\n\
    - 称之为 internetwork 或 internet\n\n### 网络互连的基本方式\n\n- 物理层中继系统（即中继器 Repeater）：通常用于同种网络的物理层上，对所接收的信号进行再生和放大，以便扩大网络的作用范围。\n\
    - 数据链路层中继系统（即网桥或桥接器）：通常用于在数据链路层对帧信息进行存储转发。\n- 网络层中继系统（即路由器 Router）：通常用于在网络层存储与转发分组数据。\n\
    - 最高层中继系统（即网关或 Gateway）：这是最复杂的一种，通常用于在网络层以上的各层进行双向或单向的协议转换，故网关又称为协议转换器。\n\n一般来说，网络互连的方式主要有：\n\
    \n#### （1）通过中继系统实现网络互连\n\n由于主机和节点是组成网络的基本部分，因此这类互连主要有两种方式：\n\n- 节点级互连（又称为分布式计算环境互连）\n\
    - 主机级互连（又称为数据终端设备 DTE 互连）\n\n#### （2）通过互连网进行网络互连\n\n当互连网络的数目较多时，通常的做法是：先用网关构成一个互连网，并为其制定一个大家都遵守的数据格式（协议），再把各个网络连接到网关上，这样就形成了互连网络。这种方式在数据从源到目的地时进行了两次协议转换：源网络协议→互连网协议；互连网协议→目的网络协议。\n\
    \n### 网络互连的常用设备\n\n- (1) 中继器（Repeater）：用来扩展单段网络的长度，作用：对信号进行再生和放大。\n- (2) 路由器（Router）：这是实现异构型网络互连的重要设备。它可将众多不同类型的网络连接成一个大型网络。其功能包括：路由选择、包的存储与转发、网络分段、流量控制、网络管理等。\n\
    - (3) 网关（Gateway）：也是用于异构型网络互连的设备。主要功能是进行协议转换和数据重新分组。通常用于网络层、运输层和应用层，主要有：协议网关、应用网关和安全网关。\n\
    - (4) 集线器（Hub）\n- (5) 交换机（Switch）\n\n### 计算机网络互连——中继器\n\n中继器又称为转发器，工作在物理层，用于连接以太制式的总线式网络。中继器实现网络在物理层上的连接，起到扩展网络连接距离的作用。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_71_0.png)\n\n中继器分为直接放大式和信号再生式两种：\n\n\
    - 直接放大式只是一个简单的放大器，噪音也将一同传递到下一网段。\n- 信号再生式同时具有信号再生功能，其可对信号进行整形后传到下一网段。\n\n### 计算机网络互连——交换机\n\
    \n- 交换机是将各端口之间进行逻辑上的直联，因此不仅各端口可以同时进行传输，而且可以将网络划分为多个子段以提高广播效率。\n- 交换机可分为二层交换与三层交换，其中第二层交换作用在链路层，起到广播转发的作用，如以太网交换机。而第三层交换则作用在网络层，支持\
    \ IP 交换。\n- 第三层交换是路由器的另一种实现模式，用于完成路由控制功能。其与传统的路由器的主要差别一是表现在硬件实现上，二是与交换机合为一体，使得在交换的同时进行路由选择。\n\
    - 可以支持 VLAN。\n\n### 计算机网络互连——路由器\n\n路由器是在多个网络及介质之间对 IP 协议提供网络互连能力。其与网桥的主要差别是可以支持不同底层协议网络的互连，与网关的主要差别在于路由器具有路由功能。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_75_0.png)\n\n## 1.3 计算机网络分类\n\n###\
    \ 按规模大小和地域范围\n\n- 局域网（LAN）：在局部地理位置内建立的网络（1 公里以内）。如一个办公室，一栋大楼等。\n- 广域网（WAN）：跨越远距离（几十至几千公里范围），一般通过远程通信设施（铜线、光缆、无线电）连接起来的网络。行业网，分布在多个地理位置的公司网。\n\
    - 城域网（MAN）：将一个城市中的各部门、各单位的网络连接起来的网络（5-50 公里内）。\n- 子网：网络的一个片段，其内的机器可以直接共享资源和传输数据。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_78_0.png)\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_79_0.png)\n\
    \n### 按拓扑结构（网络中计算机连接起来的结构形态）\n\n- 总线\n- 星型\n- 环状\n- 网状\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_80_0.png)\n\
    \n### 混合拓扑结构\n\n- 层次（树）\n- 总线-星\n- 环-星\n- 网状-星\n\n### 按交换方式\n\n- 电路交换（网络进行数据传输时，在源与目的之间构成一条实际连接的专用物理线路）\n\
    - 报文/分组交换（在源和目的之间不需要建立一条专用的物理线路，而将信息分解成报文/分组，一站一站从源送到目的地，与普通邮政寄信方式类似）\n- 帧中继（呼叫控制信号与用户数据采用分开的逻辑连接，实现多路复用和交换；不采用一步一步地流控和差错控制。可以被认为是虚拟的租用线路）\n\
    - 信元交换（信元是 ATM 数据传送的单位，ATM 对信元信息域不做任何处理，信元在网络中传送期间出现的一切问题（信元丢失、传送出错、信元延时变化）都由终端来处理）\n\
    \n### 按网络协议\n\n- TCP/IP、SNA、DNA、SPX/IPX、AppleTalk 等\n\n### 按应用规模\n\n- Internet\n\
    - Intranet\n- Extranet\n\n## 1.4 Internet 的基本应用\n\n### 计算机联网的主要目的\n\n- 资源共享\n\
    \  - 硬件共享：大型计算机的处理能力，昂贵的外设；\n  - 软件共享：应用软件，系统软件等；\n  - 数据共享：用户数据（市场信息）等。\n- 数据传输\n\
    \  - 支持用户之间的数据传输（如电子邮件、文件传输、IP 电话等）；\n- 提供分布处理和均衡计算机负荷的功能。\n- 对地理上分布的系统进行集中控制；对网络资源进行集中分配和管理。\n\
    - 提高系统的可靠性。\n- 向网络用户提供最佳的性能价格比。\n- 开辟大量新的应用服务项目。\n- ......\n\n### Internet 最基本的应用方式有\n\
    \n- 网上信息交流\n- 网上信息获取\n- 网上资源共享\n- 等等\n\n### 网上信息交流\n\n#### 信息的通信与交流方式\n\n- 非交互式：\n\
    \  - 普通方式：邮寄信件；\n  - Internet 方式：E-mail；信息浏览\n- 交互式：\n  - 普通方式：打电话；\n  - Internet\
    \ 方式：在线文本交谈；语音通信（如 IP 电话）；视频通信（如视频会议）；共享白板系统等。\n\n### 网上信息查找\n\nWWW（环球信息网）是为了方便用户查找和获取\
    \ Internet 信息的一种信息组织方式。用户只需要在本地机（客户）上运行浏览器软件，就可从全球互连的 Web 服务器中获取各种信息。\n\nWeb 浏览器软件尽管各不相同，但都具有如下基本功能：\n\
    \n- 检索查询：可浏览、查询、读入全球范围内任一台 Web 服务器上的信息。\n- 文件服务：可随时对所浏览的文档进行保存、打印，或跟踪感兴趣的链接。\n\
    - 其它服务：如收发电子邮件、FTP、Telnet 等功能。\n"
