    \ FTP（文件传输）手段进行获取。一般通过 FTP 下载的信息主要有以下三类：\n\n- 免费软件：这类软件可供用户免费使用。\n- 共享软件：这类软件只允许用户免费一段时间，到期后需交纳一定费用才能继续使用。\n\
    - 公共档案文件：如各国的人口统计资料、期刊杂志、艺术图片、科学实验结果等。\n\n## Internet上的资源\n\n- 网上图书馆\n- 网上大型专题数据库\n\
    - 新闻组（news group）/邮寄用户清单（mailing list）\n- 电子公告牌\n- 信息获取工具\n- 共享硬件/软件资源：巨型机、大型存储器、公用软件\n\
    - 搜索引擎：Google、Yahoo、Sohu、Sina\n\n## 1.4 Internet 的基本应用\n\n- 健康保健：远程医疗、紧急医疗响应支持\n\
    - 教育：远程、数字图书馆\n- 科学研究：能源、地理系统、气象、生物\n- 国家安全：全球通信、信息传播\n- 环境：检测、警告、响应\n- 政府：传递政府服务和信息给公民和企业\n\
    - 突发事件：灾难响应、危机管理\n- 企业管理、设计和制造、电子商务、军事等多方面应用\n\n- E-mail 服务\n- Web 服务\n- FTP 服务\n\
    - Telnet 服务\n- News 服务\n- Chat 服务\n- BBS 服务\n- ……\n\n## 1.5 Internet 的组织管理与相关机构\n\
    \nInternet 最大的特点是管理上的开放性，它没有集中的管理机构。为了促进 Internet 运行所需的标准兼容性并确保 Internet 的持续发展，先后成立了一些机构自愿承担必需的管理职责，并且遵循自下而上的结构原则。下面介绍几个重要的\
    \ Internet 组织：\n\n### 1、Internet协会（ISOC）及其组织机构\n\n- **目的：** ISOC 成立于1992年，总部在美国，是作为一个全球\
    \ Internet 协调与合作的国际组织而建立的。\n- **任务：** 确保全球 Internet 发展的有利性和开放性，并通过领导标准、议题和培训工作来发展互联网的相关技术。\n\
    - **网址：** www.isoc.org\n\nInternet学会（ISOC）组织机构：\n\n- Education\n- Internet 体系结构委员会\n\
    - CNRI\n- 工程任务组\n- 技术研究组\n- 许可证管理组\n- Internet 编号组\n  - 欧洲地区\n  - 亚太地区\n  - 其它地区\n\
    \n### 2、IAB（Internet体系结构委员会）职责\n\n- 制定 Internet 的技术标准\n- 通过网络发布 Internet 工作文件\n\
    - 规划 Internet 发展战略\n- 就技术问题进行国际协调\n\n### 3、Internet 草案与 RFC\n\nInternet 技术管理的核心是制定网络连接和应用的协议标准。在\
    \ Internet 上，任何一个用户都可以对 Internet 某一领域的问题提出自己的解决方案或规范，作为 Internet 草案（Internet Drafts）提交给\
    \ IETF。最后，由 IESG 确定草案是否能成为 Internet 的标准。\n\n### 4、InterNIC 与域名管理\n\nInternet 网络信息中心（InterNIC：www.internic.net）成立于1993年1月，其主要任务是负责所有以\
    \ .org、.com、.net、.edu 结尾的国际顶级域名的注册与管理（.mil、.gov 由美国政府管理）。各国的顶级域名由各国自己管理。\n\n###\
    \ 5、IAB 下属工作组\n\n- 工程任务组\n- 许可证管理组\n- 技术研究组\n- Internet 编号组：欧洲地区、亚太地区、其它地区\n\n\
    ### 6、WWW 协会（W3C）\n\nWWW 协会（简称：W3C；网址：www.w3.org）是除了 ISOC 以外的另一个国际性的 Internet\
    \ 组织，其任务在于确定和颁布有关 WWW 的应用标准。\n\n### 7、中国互联网络信息中心（CNNIC）\n\n中国互联网络信息中心（简称：CNNIC；网址：www.cnnic.net.cn）是于1997年6月成立的非营利性\
    \ Internet 管理与服务机构，行使中国国家互联网络信息中心的职责。\n\n主要任务是：1）注册服务（包括：域名注册、IP地址分配、自治系统号分配等）；2）目录数据库服务；3）信息服务；4）网站访问流量认证；5）代表我国与\
    \ InterNIC、APNIC（亚太互联网络信息中心）等国际机构进行业务联系。\n\n### 8、Internet 或网络中心的日常管理\n\nInternet\
    \ 或网络中心的日常工作管理由以下部门完成：\n\n- NOC（Network Operations Center）\n  - 职责：确保网络正常运行，监督网络活动。\n\
    - NIC（Network Information Center）\n  - 职责：为用户或用户服务机构提供支持。\n\n## 1.6 Internet 的接入方式\n\
    \n- 接入方式与 ISP 的选择（与谁连？连接到哪？如何连？）\n- 调制解调器（MODEM）\n- 通过电话线拨号接入 Internet\n- 通过局域网接入\
    \ Internet\n- 通过电话线进行数字连接\n- 通过电缆接入 Internet\n\n### ISP（Internet Service Provider）\n\
    \n- 即 Internet 服务提供商的简称。\n- ISP 一般都建立自己的网络中心，使用专线接入 Internet 主干线路，提供 Internet\
    \ 接入服务。\n\n### ICP（Internet Content Provider）\n\n- 即 Internet 网页内容供应商。\n- 提供网页发布服务，一般不提供接入服务。\n\
    \n### IAP（Internet Access Provider）\n\n- 即 Internet 接入供应商。\n- 为用户提供接入服务，与 ISP\
    \ 基本功能相同。\n\n- 国家级接入网\n  - ChinaNet\n  - ChinaGBN\n  - CERNET\n  - CSTNET\n- 接入服务商\n\
    \  - ISP\n  - ICP\n  - IAP\n- 单位/企业网\n- 接入的通信线路\n  - 电话网：PSTN\n  - 非对称数字用户线：ADSL\n\
    \  - 综合业务网：ISDN\n  - 分组交换网：X.25\n  - 专线：DDN、T1、E1\n  - 宽带业务网：CABLE\n  - 光纤、微波、卫星\n\
    \nInternet 的接入可以分为两大类：\n\n- 拨号接入方式（适用于小型子网或个人用户）\n  - 通过 PSTN（公用电话网）拨号接入\n  -\
    \ 通过 ISDN 拨号接入\n  - 通过 ADSL（非对称数字用户线）接入\n- 专线接入方式（适用于中型子网接入）\n  - 通过路由器经 DDN 专线接入\n\
    \  - 通过 FR（帧中继）接入\n  - 通过分组交换网（如 X.25）接入\n  - 通过微波或卫星接入\n\n### 调制解调器连接图（单机）\n\n\
    ```text\n家里/办公室\nMODEM\n串行线\n电话机\n电话线 Line\nMODEM池\n访问服务器\nISP\nInternet\nPSTN/ISDN\n\
    ```\n\n### 局域网接入连接图（通过 MODEM）\n\n- 通过 MODEM 连接\n- 线路：PSTN、ISDN、ADSL\n- 所有机器共享\
    \ 1 个 IP 地址\n- 代理服务器（PROXY）\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_104_0.png)\n\
    \n### 局域网接入连接图（通过路由器）\n\n- 通过路由器连接\n- 使用数据线路：DDN、FR、X.25\n- 形成一个子网\n- 通过网关访问\n\
    - 每台联网计算机各有 1 个 IP 地址\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_105_0.png)\n\
    \n### 各种应用服务器\n\n各种应用服务器：WWW、E-mail、FTP、Telnet、BBS、Gopher、Newsgroup……\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_106_0.png)\n"
