    \ “|”，而不用 “：”\n\n## 相对路径名及其含义\n\n| 相对路径名 | 含义 |\n|---|---|\n| href=\"file.html\"\
    \ | 本地当前路径下的文件 |\n| href=\"files/file.html\" | 本地当前路径下被称为 “files” 的子目录下的名为file.html的文件\
    \ |\n| href=\"file/morefiles/file.html\" | 当前目录下的file子目录下的 “morefiles”子目录下名为 file.html的文件\
    \ |\n| href=\"../file.html\" | 本地当前目录的上一级子目录下名 file.html的文件 |\n| href=\"../../file.html\"\
    \ | 当前目录的上两级子目录下名为 file.html的文件 |\n\n## 绝对路径名及其含义\n\n| 绝对路径名 | 含义 |\n|---|---|\n\
    | HREF=\"/u1/my/file.html\" | file.html放在u1目录下的 my子目录下 |\n| HREF =\"d|/files/file.html\"\
    \ | file.html放在D盘的files目录下的html子目录下 |\n\n- 说明：\n- 1、路径名书写要遵循UNIX操作系统的格式，路径名与目录名要以\
