    ### B类


    用前14位来标识网络号，后16位标识主机号，最前面两位固定为“10”。这样第一段所表示的范围为：128-191。通常B类地址适用于中等规模的网络（如各地区的网络管理中心）。B类地址空间范围为128.0.y.z
    - 191.255.y.z。B.B.255.255为直接广播地址，用于向B类地址范围内的全部主机进行广播，B.B.0.0表示本网络中的某个地址。


    ## IP地址的分类


    ### IP地址的分类方法（续）


    ： 网络号； ： 主机号。


    ### C类 110


    用前21位来标识网络号，后8位标识主机号，最前面三位为“110”。这样第一段所表示的范围为：192-223。通常B类地址的网络号数远大于主机号数，一般适用于校园网等小型网络。


