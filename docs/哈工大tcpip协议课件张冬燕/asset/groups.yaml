  - '[PAGE 48]


    # 互联网的雏形--ARPANet网


    +   分组交换不同于传统的电路交换，是存储转发方式中的一种，将要传送的报文分割成具有同一格式的分组，以此作为传输的单元，进行存储转发。


    +   优点是：线路利用率高、可进行数据速率的转换、不易引起阻塞、可以使用优先权


    +   因此在1976年，国际电报电话咨询委员会（CCITT）制定了用于公用分组交换网的协议标准 X.25。'
  - '[PAGE 49]


    # 互联网的雏形--ARPANet网


    ![](img/6da04d1fb563df13affe55d3e3f152ec_49_0.png)


    +   - 完成了对计算机网络的定义

    +   - 提出了资源子网、通信子网的概念

    +   - 研究了分组交换方法


    首次提出了Internet的概念'
  - '[PAGE 50]


    # 互联网的雏形--NSFnet网


    +   - 1985年美国国家科学基金会（NSF）在ARPANet成功后决定资助建立计算机科学网。

    +   - 1987年建立了一个新的广域网，由13个节点组成，由主干节点下联到各地区网。

    +   - 采用TCP/IP作为统一的通信协议标准，传输速率由56kbps提高到1.544Mbps。'
