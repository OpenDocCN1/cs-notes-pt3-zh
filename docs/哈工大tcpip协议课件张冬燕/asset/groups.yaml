    \ Windows下的FTP命令；\n- 2) Cute-FTP，LeapFTP；\n- 3) Netscape和IE浏览器（网页形式的FTP）。\n\n\
    ## 8、FTP工具介绍-1\n\nCuteFTP界面简洁，支持断点续传、操作简单方便，是一款不可多得的好工具。\n\n- CuteFTP站点管理\n- CuteFTP的上传和下载操作\n\
    - CuteFTP的设置\n\n## 8、FTP工具介绍-2\n\n### Net Vampire\n\n- 网络吸血鬼\n- 最早实现了断点续传的功能\n\
    - 曾经是最为流行、最为高效的下载工具\n\n## 8、FTP工具介绍-3\n\n### NetAnts\n\n- 网络蚂蚁\n- 目前最为流行的下载工具\n\
    - 支持多线程和断点续传\n- 既可以使用FTP协议下载文件，也可以使用HTTP协议下载文件\n- 还具有下载完成后自动断开连接、自动关机等功能\n\n##\
    \ 9、FTP的格式\n\nftp ftp.hit.edu.cn\n\nFTP服务器IP地址或域名\n\nftp命令\n\n或者 ftp\n\nopen ftp.hit.edu.cn\n\
    \n## 10、FTP的使用（一）\n\n### Windows下的FTP\n\n- 1）开始→运行→ftp ftp.hit.edu.cn；\n- 2）开始→程序→MS-DOS方式→ftp\
    \ ftp.hit.edu.cn；\n\n注：改变文件的传输方式：ascii或binary命令。\n\n注：可浏览、上载、下载。\n\n```\nMicrosoft\
    \ Windows XP [版本 5.1.2600]\n(C) 版权所有 1985-2001 Microsoft Corp.\n\nC:\\Documents\
    \ and Settings\\IBM>ftp localhost\nConnected to ibm-mq3kmogrivf.\n220 Serv-U FTP\
    \ Server v4.0 for WinSock ready...\nUser (ibm-mq3kmogrivf:(none)): anonymous\n\
    331 User name okay. please send complete E-mail address as password.\nPassword:\n\
    230 User logged in. proceed.\nftp> _\n```\n\n## 11、FTP的使用（二）\n\n### 启动一个FTP会话\n\
    \n- ftp（-d -i -v 参数）（远程主机IP或域名）\n- -d 打开调试模式（debug）\n- -i 在传送多个文件时，关闭交互提示（prompt）\n\
    - -v 打开“冗长”模式（verbose）\n\n## 12、FTP的使用（三）\n\n- help（子命令）or ?（子命令）\n- 建立/中止FTP连接\n\
    \  - open 远程主机\n  - close\n  - disconnect\n  - bye\n  - quit\n\n## 14、FTP的使用（五）\n\
    \n### 从远程计算机中取文件\n\n- get\n- mget\n- recv\n\n### 把文件传送到远程计算机\n\n- put\n- mput\n\
    - send\n\n## 16、FTP的使用（七）\n\n浏览器下的FTP：\n\n- 1) 打开IE浏览器；\n- 2) 在地址栏输入：ftp://ftp.hit.edu.cn；\n\
    \n注：可浏览、上载、下载，一般适用于匿名FTP。\n\n## 17、FTP的使用（八）\n\n### FTP软件——Cute-FTP\n\n- 1）安装Cute-FTP；\n\
    - 2）启动Cute-FTP程序；\n- 3）设置FTP服务器地址和用户名、密码；\n- 4）按“连接”（connect）开始；\n- 5）会列出服务器上的目录和文件；\n\
    - 6）用拖动鼠标的方法可下载和上载文件；\n\n注：可用于匿名或非匿名FTP服务器。\n\n## GlobalSCAPE - CuteFTP Pro 3.2\
    \ - [American Football - ftp.vnet.net, 状态: 失败, 正在读取已保存的站点]\n\n- 文件\n- 编辑\n- 查看\n\
    - 工具\n- 窗口\n- 帮助\n\n主机：202.118.224.241\n\n用户名：anonymous\n\n端口：21\n\n- General\
    \ FTP Sites\n  - Anonymous Sites\n    - Cryptography\n    - Developer\n    - Gaming\n\
    \    - Government\n    - Graphics\n    - Hardware\n    - Images\n    - Internet\
    \ Help\n    - Literature\n    - Operating Systems\n    - Organizations\n    -\
    \ Software Archives\n    - Sports\n      - American Football\n    - CuteFTP Pro\
    \ Home\n\n| 名称 | 大小 | 类型 | 更新时间 | 属性 | 描述 | 所有者 |\n|------|------|------|----------|------|------|--------|\n\
    \n命令：正在查找列表 \"/pub/football\"...\n命令：正在连接到 ftp.vnet.net...\n命令：连接已关闭。\n\n本地浏览\
    \ 站点管理器\n\n| 项目名称 | 地址 | <> | 大小 | 进程 | 本地 | 远程 | 逝去 | 剩余 | 速度 |\n|----------|------|----|------|------|------|------|------|------|------|\n\
    \n队列窗口 日志窗口\n\n连接到主机 ftp.vnet.net, 0 个对象, 0 字节\n\n## 13、FTP的使用（九）\n\n### 匿名FTP\n\
    \n- 无须成为注册用户就可连接远程主机并下载文件\n- Username: anonymous\n- password:\n\n## 20、FTP的登录\n\
    \nFTP若连接成功，系统将提示用户输入用户名及口令：LOGIN：（输入合法的用户名或者“ANONYMOUS”）；PASSWORD：（输入合法的口令，若以“ANONYMOUS”方式登录，一般不用口令）。进入想要连接的FTP站点后，用户就可以进行相应的文件传输操作了。\n\
    \n## 21、FTP的客户端软件\n\nFTP的客户端软件有很多，常用的有：\n\n- CuteFTP\n- LeapFTP\n- 流星雨\n- LeachFTP\n\
    - ……\n\n### 查找和下载FTP软件常用网址\n\n- ftp.hit.edu.cn\n- e.pku.edu.cn\n- dw.hit.edu.cn\n"
  mdcn: "\n## 3、FTP连接的要点\n\n- 进行连接前，首先要知道目的计算机（即FTP服务器）的名称或地址；\n- 连接上后，要校验用户名和密码，正确才可进入连接；\n\
    - 互联网上有许多FTP服务器都提供匿名FTP服务；\n- 连接的目的是为了上传文件或下载文件；\n- 上传（Upload）把本地计算机上的文件复制到远程计算机；\n\
    - 下载（Download）把远程计算机上的文件复制到本地计算机。\n\n## 4、FTP的主要功能\n\n- 1、把本地计算机的一个或多个文件传送到远程计算机或从远程计算机上获取一个或多个文件（复制功能）。\n\
    - 2、能够传输多种类型、多种结构、多种格式的文件。\n- 3、提供对本地计算机和远程计算机的目录操作功能；\n- 4、能对远程计算机上的文件进行改名、删除、显示文件内容等。\n\
    - 5、用户可以使用FTP访问匿名FTP服务器，从中获取大量免费或共享软件。\n- 6、用户可以非匿名访问专用FTP站点。\n\n## 5、匿名FTP\n\n\
    匿名FTP：无须成为注册用户就可连接远程主机并下载文件。在匿名FTP服务器上都建立有一个公共帐号（anonymous），每个Internet用户都可以以anonymous的身份访问它。用户要想访问匿名服务器，就必须知道它的域名或IP地址。\n\
    \nInternet上可用的资源种类：\n\n- 1）完全免费软件：如Netscape和IE浏览器；\n- 2）试用版软件；\n- 3）付费软件。\n\n\
    ## 6、FTP的文件传送方式\n\n两种传送模式：\n\n- 1) 文本模式（ASCII）——主要传送文本文件；\n- 2) 二进制模式（Binary）——可传送任何格式文件，尤其是图像、声音，一定要用二进制模式。\n\
