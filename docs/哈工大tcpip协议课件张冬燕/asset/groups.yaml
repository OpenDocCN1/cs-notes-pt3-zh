    # 1.5 Internet的组织管理与相关机构


    # 2、 IAB(Internet体系结构委员会)职责


    +   - 制定Internet的技术标准

    +   - 通过网络发布Internet工作文件

    +   - 规划Internet发展战略

    +   - 就技术问题进行国际协调


    # 3、 Internet 草案与RFC


    Internet技术管理的核心是制定网络连接和应用的协议标准。在Internet上，任何一个用户都可以对Internet某一领域的问题提出自己的解决方案或规范，作为Internet草案（
    Internet Drafts）提交给IETF。最后，由IESG确定草案是否能成为Internet的标准。'
  - '[PAGE 96]


    # 4、InterNIC与域名管理


    Internet 网络信息中心（InterNIC： www. InterNIC. net）成立于1993年1月，其主要任务是负责所有以. org、com、net、edu
    结尾的国际顶级域名的注册与管理（.mil、gov 由美国政府管理）各国的顶级域名由各国自己管理。


    # 5、IAB下属工作组


    +   - 工程任务组

    +   - 许可证管理组

    +   - 技术研究组

    +   - Internet编号组： 欧洲地区，亚太地区，其它地区'
  - "[PAGE 97]\n\n# 1.5 Internet的组织管理与相关机构\n\n+   6、WWW协会（W3C）\n+   \n+   WWW协会（简称：W3C；网址：www.w3c.org）是除了ISOC以外的另一个国际性的Internet组织，其任务在于确定和颁布有关WWW的应用标准。\n\
    \n+   7、中国互联网络信息中心（CNNIC）\n+   \n+   中国互联网络信息中心（简称：CNNIC；网址：www.cnnic.net.cn）是于1997年6月成立的非赢利的Internet管理与服务机构，行使中国国家互联网络信息中心的职责。\n\
    +   \n+   主要任务是：1）注册服务（包括：域名注册、IP地址分配、自治系统号分配等）；2）目录数据库服务；3）信息服务；4）网站访问流量认证；5）代表我国与InternNIC、APNIC（亚太互联网络信息中心）等国际机构进行业务联系。"
