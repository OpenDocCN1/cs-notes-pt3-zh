  - '[PAGE 550]


    # 邮局协议第3版（POP3）


    # POP3的用途和特点


    POP3是接收Email的基本协议，也是TCP/IP协议组成成员之一。它的作用是接收来自SMTP服务器的Email，在Windows平台上的Email客户端软件会与POP3服务器交互，收集由POP3服务器所接收到的用户的Email。基于POP3的Email系统能提供快速、经济和方便的Email接收服务。


    # 基于POP3的工作过程


    用户通过常用的Email客户端软件（如：Foxmail、Outlook Express等），并经过相应的参数设置（如：POP3服务器的IP地址或域名、用户帐号、密码等），选择“接收（Receive）”操作，就可将所有邮件从远程邮件服务器中下载到用户的本地硬盘中进行阅读。'
  - '[PAGE 551]


    # 接收Email的新协议IMAP


    # IMAP的用途和特点


    IMAP（Internet Message Access Protocol：Internet 信息接收协议）指从邮件服务器上直接收取邮件的协议，IMAP可以让用户远程拨号连接邮件服务器，并具有智能邮件存储功能，可在下载邮件之前预览信件主题和信件来源，并决定是否下载附件。用户可以在任何地方、任何机器上获取邮件信息。


    由于不同厂商对最新版本的IMAP规范的解释有所不同，使得邮件客户机与服务器之间不一致，造成不同厂商产品之间的不兼容，故目前还没有大规模的使用，但IMAP由于其优越性，在将来不可避免地会得到迅速发展。目前IMAP与POP3共存使用。'
