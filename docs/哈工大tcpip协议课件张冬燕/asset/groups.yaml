    \ SafeSearch Filtering。不过，中文状态下的GOOGLE还没有这个功能。\n\n## 其他杰出功能（续）\n\n- 网页翻译\n\n懂英文，但是是不觉得就懂德文、法文、拉丁文。如果搜索出来的页面是这些语言怎么办？呵呵，GOOGLE提供了网页翻译功能！！虽然目前只支持有限的拉丁语、法语、西班牙语、德语和葡萄牙文，但是是不得不承认，这是个杰出功能。\n\
