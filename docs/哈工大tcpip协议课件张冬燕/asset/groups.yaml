    \n## 21、<A 标签为如下形式：\n\n选择链接时文件运行\n高亮显示的文本\n<A HREF=\"../menu.html\"> 回到主菜单 </A>\n\
    起始标签\n结束标签\n\n其中HREF属性域指定了待链接文件名及其路径。\n使用相对路径时，以链接所在文件为基准，可以包含上层目录名（用..）；也可以使用绝对路径或URL地址。\n\
    \n## 22、显示一个链接并在IE中显示\n\n```\n回到<A HREF=\"../menu.html\">主菜单</A>\n```\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_516_0.png)\n\
