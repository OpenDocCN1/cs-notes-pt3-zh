    ## WWW - 信息海洋


    ### WWW的基本概念


    - 环球信息网

    - Web服务器与浏览器

    - 统一资源定位器


    ### 1、环球信息网（WWW）


    - 1、 WWW（WORLD WIDE WEB, 环球信息网）

    - 2、 超文本

    - 3、 超媒体

    - 4、 WWW的基本特点

    - 5、 WWW的应用领域


    ### 2、环球信息网（WWW）


    - 浏览器/服务器

    - WEB服务器

    - 统一资源定位器（URL: Universal Resource Locator）

    - HTTP（Hyper Text Transport Protocol, 超文本传输协议）

    - IE浏览器


    ### 3、WWW 的特点


    - 采用C/S结构，双向数据通信和信息收集

    - 采用TCP/IP协议

    - 能理解HTML语言

    - 通过URL进行文档和资源的访问

    - 允许客户机程序访问各种多媒体信息系统：文字、图像、声音

    - 信息资源丰富：电子百科全书

    - 广域性：跨越国界的信息系统；

    - 交互性：输入查询条件查询

    - 分散性：信息分散存放；动态性：可随时修改


    ### 5、WWW中的文档


    #### 超文本和超媒体（Hypertext&Hypermedia）


    超文本：是指一种基于计算机的文档，各文档之间互相链接，使信息可以交互查询。采用一种非线性阅读方式


    ![](img/6da04d1fb563df13affe55d3e3f152ec_464_0.png)


    超媒体：是超文本与多媒体的简单组合


    - 浏览器/服务器工作模式（Browser/Server）


    ### 6、WWW工作原理


    #### 浏览器/服务器(Browser/Server)体系结构


    ![](img/6da04d1fb563df13affe55d3e3f152ec_465_0.png)


    网页


    HTTP


    链接请求


    ![](img/6da04d1fb563df13affe55d3e3f152ec_465_1.png)


    Browser


    ### 7、WWW怎样工作？


    #### Web浏览器访问Web服务器


    ![](img/6da04d1fb563df13affe55d3e3f152ec_466_0.png)


    ### 8、Web 浏览器 (Browser)


    指WWW客户软件，指客户端的WWW浏览程序。


    #### 作用


    - 发出用户请求

    - 接收、显示网页


    WWW的客户端软件


    #### 常用的浏览器


    - Internet Explorer: IE (Windows)

    - Netscape (Unix, Windows)

    - Mosaic (Unix, Windows)

    - HotJava


    ### 9、WWW 浏览器软件


    - 用户要访问WWW，必须在它的计算机上运行WWW客户软件。

    - *WWW浏览器软件的执行原理是：* 将WWW上找到的内容在用户计算机上进行解释和显示。

    - 大多数的浏览器具备访问Internet上其它服务器的功能。如FTP，Gopher,WAIS等。

    - 有的浏览器还可以自动调用其他应用程序，以显示特殊类型的文档。


    ### 10、IE浏览器的界面形式


    网页 (WebPage)

    主页 (HomePage)


    ### 11、HTML语言的信息描述方式


    超文本 (HyperText) 和超媒体 (HyperMedia)


    ```

    <html>


    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=gb2312">

    <title>广州大学</title>

    <meta name="GENERATOR" content="Microsoft FrontPage 3.0">

    <base target="_top">

    </head>


    <body>

    <div align="center"><center>


    <table border="0" width="100%" align="top" cellspacing="0" cellpadding="0">

    <tr>

    <td width="100%"><img src="images/50new.jpg" width="800" height="80" alt="庆祝国庆"></td>

    </tr>

    </table>

    </center></div><div align="center"><center>


    <table border="0" width="778" height="475" cellspacing="0" cellpadding="0">

    ```


    ### 12、HTML语言的描述语言


    #### 超文本标记语言HTML:(HyperText Markup Language)


    描述、建立超文本文档的语言。


    ```

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=gb2312">

    <title>哈尔滨工业大学</title>

    <meta name="GENERATOR" content="Microsoft FrontPage 3.0">

    <base target="_top">

    </head>

    <body>

    <table border="0" width="778" height="475" cellspacing="0" cellpadding="0">

    <tr><td width="100%"><p align="center"><font size="2" color="#0000FF" face="仿宋_GB2312"><a
    href="noname.htm">课程设置</a>&nbsp;<a href="xkjs.htm">系科介绍</a><br><a href="noname">重点校外教学基地</a></font></td></tr>

    </table>

    </center></div>

    </body>

    </html>

    ```


    ### 13、WWW使用的通信协议


    超文本传输协议（HTTP：Hypertext Transport Protocol）：用于将WWW服务器的文档传送给浏览器的协议。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_472_0.png)


    ### 14、统一资源定位器URL


    统一资源定位器（URL： Universal Resource Locator）


    Http://www.gdrtvu.edu.cn/index.html


