  md: "\n## 下一跳路由的算法\n\n- 执行：拆开IP数据报，从中抽取目的IP地址：D，通过“位与”运算求出目的地址的网络ID：N\n- if N 和某个与路由器直接相连的网络匹配，则直接转发到该网络中的相应主机（需要执行：从IP地址D\
    \ 解析出目的主机的物理地址，封装IP数据报为帧，帧头包含目的主机的物理地址，发送帧）。\n- else if 路由器的路由表中包含有为该主机D指定的路由，则按路由表中所指定的发送到下一跳（需要执行：解析所指定的下一跳路由的物理地址，封装IP数据报为帧，帧头包含下一跳路由的物理地址，发送帧）。\n\
    - else if 路由器的路由表中包含有到达该网络N的路由，则按路由表中所指定的发送到下一跳（需要执行：同上）。\n- else if 路由器的路由表中包含有默认路由，则发送到路由表中所指定的默认路由（需要执行：解析所指定的默认路由的物理地址，封装IP数据报为帧，帧头包含默认路由的物理地址，发送帧）。\n\
    - else 发回路由出错消息。\n\n## 4.2 IP数据报的转发\n\n### 关于路由表的补充说明\n\n- 为一个网络指定一个路由器，而不必为每个主机指定一个路由器。可以极大地缩小路由表的规模，比如Internet上的路由器只有几千个表目，而不会是超过100万个表目。\n\
    - IP路由选择是逐跳（hop-by-hop）进行的。IP并不知道到达任何目的的完整路径。所有的IP路由选择只为数据报传输提供下一站路由器的IP地址。\n\
    - 只有最后一个Router知道目的主机是否可用，需要为Router安排方法向源主机来报告问题\n- 路由可能不对称\n  - A->B和B->A路径可能不一致\n\
    \n## 4.2 IP数据报的转发\n\n### 数据包处理过程示意图\n\nIP节点\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_269_0.png)\n\
    \n## 有关路由表的一些命令\n\n### Route\n\n- Route print--用于显示路由表中的当前项目\n- route add--添加路由。添加目标为10.41.0.0，子网掩码为255.255.0.0，下一个跃点地址为10.27.0.1，跃点数为\
    \ 7 的路由：\n  route add 10.41.0.0 mask 255.255.0.0 10.27.0.1 metric 7\n- route change--修改现有路由。将目标为10.41.0.0，子网掩码为255.255.0.0\
    \ 的路由的下一个跃点地址由10.27.0.1 更改为10.27.0.25:\n  route change 10.41.0.0 mask 255.255.0.0\
    \ 10.27.0.25\n- route delete--删除路由。删除目标为 10.41.0.0，子网掩码为 255.255.0.0 的路由：\n  route\
    \ delete 10.41.0.0 mask 255.255.0.0\n\n## 有关路由表的一些命令\n\n### Netstat\n\n- 用于显示与IP、TCP、UDP和ICMP协议相关的统计数据，用于检验本机各端口的网络连接情况。\n\
    - 使用时如果不带参数，netstat显示活动的TCP连接\n- netstat -s--能够按各个协议分别显示其统计数据。如果你的应用程序（如Web浏览器）运行速度比较慢，或者不能显示Web页之类的数据，那么你就可以用本选项来查看一下所显示的信息。\n\
    - netstat -a--本选项显示所有有效连接的信息列表，包括已建立的连接（ESTABLISHED），也包括监听连接请求（LISTENING）的那些连接。\n\
    - netstat -n--显示所有已建立的有效连接。\n\n## 有关路由表的一些命令\n\n- 显示当前的TCP/IP配置的设置值。这些信息一般用来检验人工配置的TCP/IP设置是否正确。\n\
    - ipconfig--不带任何参数选项，为每个已经配置了的接口显示IP地址、子网掩码和默认网关值。\n- ipconfig /all--当使用all选项时，IPConfig能为DNS和WINS服务器显示它已配置且所要使用的附加信息（如IP地址等），并且显示内置于本地网卡中的物理地址（MAC）。\n\
    - 显示到达目标的路径，使用很简单，只需要在 tracert后面跟一个IP地址或URL。\n\n## 4.3 路由协议—路由器\n\nInternet可以看作是由许多路由器互连在一起的网络，而每个计算机则连在其中的一个路由器上。因此，对分组信息的分发与捕获功能由路由器来完成。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_273_0.png)\n\n## 4.3 路由协议—路由器\n\n###\
    \ 连接不同类型的网络并完成协议转换\n\n- Internet所面对的是各种不同类型的网络，各网之间需要进行桥接\n- 不同的网络运行的是不同的通信协议，需要转换\n\
    \n### 路由搜索与选择\n\n- 在Internet范围内采用的是网状自由联接，信息发送不能采用广播方式，因此需要进行路由选择。常见的路由搜索方式是距离向量路由协议与链路状态路由协议两种。\n\
    \n### 网络管理和安全\n\n- 一个网络如果确定一个或有限个出入口，可以通过限制出入的方式对内部网络进行保护。\n\n## 4.3 路由协议\n\n\
    ### 路由协议在协议栈中的位置\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_275_0.png)\n\n分层模型\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_275_1.png)\n\n网桥模型\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_275_2.png)\n\
    \n路由器模型\n\n## Internet路由选择的两种形式\n\n### 静态路由选择\n\n- 根据系统启动时初始化的路由表\n- 不再修改\n\n\
    ### 动态路由选择\n\n- 根据系统启动时初始化的路由表\n- 路由选择协议获得路由并更新路由表\n- 路由表可能会不断改变\n\n## Internet路由选择的两种形式\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_277_0.png)\n\n| Net | Mask | Next hop\
    \ |\n|---|---|---|\n| 128.10.0.0 | 255.255.0.0 | direct |\n| default | 0.0.0.0\
    \ | 128.10.0.100 |\n\n(a)\n\n(b)\n\n— 仅用路由协议\n\n## Internet路由选择的两种形式\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_278_0.png)\n\
    \n## 4.3 路由协议\n\n### 路由信息交换的含义\n\n- 每个Router运行路由选择软件\n- 获得其他Routers所能到达的目的地的信息\n\
    - 通知其他Routers自己所能到达的目的地信息\n- 路由选择软件使用获得的信息不断的更新Router的路由选择表\n\n## 4.3 路由协议\n\n\
    ### 自治系统-Autonomous System\n\n- 处于一个管理机构控制下的网络和路由器的集合\n- 灵活可变, 人为定义\n- 直觉上:校园网、医院网等等\n\
    - 需要AS是因为没有一个路由选择协议可以覆盖整个Internet\n- 每个AS选择一个Routing Protocol\n\n## 自治系统(AS)、区域及网络(NW)\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_281_0.png)\n\n- 每个AS都有一个唯一的编号\n- 编号范围1~65535,\
    \ 其中1~64511是注册的编号, 其余的为专用网络编号\n- 一个大的AS经常划分为几个较小的路由域\n\n## 4.3 路由协议\n\n### Internet路由选择协议的分类\n\
    \n- 内部网关协议 (IGP)\n  - 自治系统内的路由协议\n  - 目的地位于AS内部\n- 外部网关协议 (EGP)\n  - 用于自治系统之间的路由选择\n\
    \  - 目的地跨越Internet\n\n### 路由选择协议的准则\n\n- 路由协议能按照不同的路由准则为用户的通信数据选择最适当的传输路径,如最小成本路由等等\n\
    - 以下3个约束条件是所有准则必需考虑的\n  - 时延、吞吐率、连接性\n\n## 4.3 路由协议\n\n### IGP/EGP的使用范围\n\n###\
    \ 路由信息和数据流\n\n外部网关协议 (EGP)：BGP\n\n自治系统号：200\n\n运行内部网关协议 (IGP)：RIP\n\nRoutes for\
    \ customers of ISP\n\nData to customers of ISP\n\n- EIGRP\n- OSPF\n\nISP₁ R₁\n\
    \nR₂ ISP₂\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_283_0.png)\n"
