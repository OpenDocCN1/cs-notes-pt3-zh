    - 我们将看到一个充满虚拟性的新时代


    ## 1.7 计算机网络发展趋势


    ## 下一代互联网的计划


    - 美国白宫的NGI计划（Next-eneration互联网 Initiative, 下一代因特网计划）

    - NSF的VBNS（Very High Bandwidth Network Service, 超高带宽网络服务）

    - Internet2（一个由大学、协会、公司和政府机构共同努力建设的网络）

    - IPng（下一代因特网协议，又名IPv6）

    - 这些计划试图建立新的协议、新的硬件、新的软件、新的知识和新的网络测试环境。


    ## 第二章


    ## Internet分层体系结构


    ![](img/6da04d1fb563df13affe55d3e3f152ec_118_0.png)


    ## 2.1 网络系统结构


    网络系统结构是计算机之间相互通信的层次，以及各层中的协议和层次之间接口的集合。网络协议是计算机网络和分布式系统中互相通信的对等实体间交换信息时所必须遵守的规则的集合。


    协议的关键成分是：


    - 语法(syntax)：包括数据格式、编码及信号电平等

    - 语义(semantics)：包括用于协调和差错处理的控制信息

    - 定时(timing)：包括速度匹配和排序等


    ## 2.1 网络体系结构


    计算机网络是一个复合系统，由于在型号、线路类型、连接方式、同步方法、通信方式不同，尤其就异种机来说其通信极为复杂，因此需要采用分而治之的方式，将非常复杂的网络通信问题化为若干个彼此功能相关的模块来处理，各模块之间呈现明显的层次结构，这就是分层结构。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_120_0.png)


    ## 2.1 网络体系结构 - 基本构成


    ## 资源子网


    REC(1122/3和1009)定义:


    主机：一个主机就是连到1个或多个网络的设备。它可在其中的任意网络上进行收发通信，但不能将分组从一网络传到另一网络。


    参考:


    网关：网关是连到多于1个网络上的设备。它有选择性的将信息从一个网络发到另一个网络。


    - 只完成输入输出及通信工作

    - 可以是简单的输入输出设备


    ![](img/6da04d1fb563df13affe55d3e3f152ec_121_0.png)


    ## 2.1 网络体系结构 - 基本构成


    ## 资源子网


    - 高速线路

    - 低速线路

    - 终端

    - 通讯控制处理器

    - 主计算机


    ## 2.1 网络系统结构 - 基本构成


    ## 通信子网


    - 局域网的通信子网由传输介质与网络接口板组成

    - 广域网的通信子网在以上基础上包括转发部件，通常具有交换功能

    - 路由器、网关、协议转换器均属于这类转发部件


    ![](img/6da04d1fb563df13affe55d3e3f152ec_123_0.png)


    ## 2.1 网络体系结构 - 基本构成


    通讯控制处理器（CCP）

    - 控制本模块与终端设备之间的数据传输，对其通信线路进行控制管理。


    CCP：作为网络中各个模块之间的接口机，负责接口之间的信息传输控制。包括线路传输控制、差错监测与恢复、路由


    集中器：主要负责差错控制、信息缓存、代码转换、电路转接等


    数据通信设备 (DCE)

    - 将数字信号与模拟信号进行相互转换。


