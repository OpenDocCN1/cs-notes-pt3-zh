- raw:
  - '[PAGE 319]


    # 第五章


    # 域名体系与域名系统'
  - '[PAGE 320]


    # 5.1 域名体系与域名系统


    IP地址由一组数据来表示。数字对计算机来说是十分有意义的，但对人类的记忆行为来说，则很不方便，因此需要用具有字面含义的名字来表现。


    > 用名字来代替IP地址,以便于人们的记忆


    ![](img/6da04d1fb563df13affe55d3e3f152ec_320_0.png)


    > mail.hit.edu.cn = 202.118.224.153'
  - '[PAGE 321]


    # 5.1 域名体系与域名系统


    # 域名（domain name）


    在Internet中，采用IP地址可以直接访问网络中的一切主机资源，但是IP地址难于记忆，于是便产生了一套易于记忆的、具有一定意义的用字符来表示的IP地址，这就是域名。


    # 域名的特点


    +   - (1)易于记忆和理解;

    +   - (2)使网络服务更易于管理;

    +   - (3)在应用上与IP地址等效。'
  - '[PAGE 322]


    # 5.1 域名体系与域名系统


    +   - IP地址到名字地址间的映射：便于记忆

    +     - 例：202.118.224.153 = mail.hit.edu.cn = 哈尔滨工业大学 Web Mail服务器


    +   - 名字由DNS服务器解析


    +   - 逆向层次型命名机制

    +     - www.pku.edu.cn = Web服务器.北京大学.教育机构.中国 (162.105.129.12)


    +   - 行业和组织顶级域名：

    +     - com, edu, gov, mil, net, org, int


    +   - 国家和地区顶级域名：

    +     - au, cn, tw, hk, jp, it'
  - '[PAGE 323]


    # 5.1 域名体系与域名系统


    主机名必须满足三条准则：


    +   - 全球唯一性

    +   - 便于管理

    +   - 便于映射，效率高


    单一域名服务器的问题：


    +   - 随着网络数及主机数的增加，重名的可能性变大

    +   - 域名服务器的负担过重

    +   - 跨网段域名服务器为网络负载带来负担

    +   - 管理权限不清晰'
  - '[PAGE 324]


    # 层次型命名机制


    +   - 名字空间分成若干个部分，并授权相应的机构进行管理；

    +   - 各授权机构有权对其所管辖的名字空间进一步划分，并再授权相应的机构进行管理；

    +   - 域名系统构成一个树状分布式数据库，叶节点是主机名，中间节点是相应层次的域名服务器，根节点为空。

    +   - 域名之间用 “.”进行分割： www.hit.edu.cn'
  - '[PAGE 325]


    # 域名系统的命名机制


    域名系统采用层次型命名机制，语法是：

    主机名.第n级子域名......第2级子域名.顶级域名


    域名地址一般包含四部分内容，他们分别是：

    计算机名.机构名.网络分类名.顶级域名

    如：www.pku.edu.cn


    顶级域名(最高级域名:top-level domain)是一种标准化的标号以保证域名系统的通用性。'
