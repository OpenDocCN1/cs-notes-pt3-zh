    neu\n\nwww\n\nmtlib\n\nmllib\n\nvtlib\n\n主机\n\n组\n\n主机名. 组名. 网点名. 顶级域名\n\nwww.hit.edu.cn\n\
    \n主页服务器\n\n哈工大\n\n教育网\n\n中国\n\n### 域名系统的规定\n\n- 域名系统具有特定的保留字，且顶级域名是确定的，由IAHC负责制定；\n\
    - 顶级域名分为三类：通用(组织)、国家(地域)及国际组织；\n- 通用类由三个字母表示，表示组织，特指美国机构，其它国家则出现在二级域名(网络名)中\n\n\
    IAHC在世界的七个大区选择了不超过28个注册中心来接收这七个通用型顶级域名的申请\n\n### 有关顶级域名的规定\n\n（1）一般地，Internet地址的最后部分代表了最大的区域，通常为国家代码。\n\
    \n| 域名 | 国家/地区代码 | 域名 | 国家/地区代码 |\n|---|---|---|---|\n| au | 澳大利亚 | de | 德国 |\n\
    | ca | 加拿大 | uk | 英国 |\n| cn | 中国 | fi | 芬兰 |\n| fr | 法国 | it | 意大利 |\n| jp |\
    \ 日本 | es | 西班牙 |\n| hk | 香港 | dk | 丹麦 |\n| tw | 台湾 | nz | 新西兰 |\n\n### 有关顶级域名的规定\n\
    \n(2) 美国通常不使用国家代码作为地址的最后一部分，而分别以：\n\n| 域名 | 意义 | 例 |\n|------|------|-----|\n\
    | com | 商业组织 | www.microsoft.com |\n| edu | 教育部门 | www.mit.edu |\n| gov | 政府部门\
    \ | www.whitehouse.gov |\n| mil | 军事部门 | www. |\n| net | 网络组织 | www.internic.net\
    \ |\n| org | 非赢利组织 | www.ims.org |\n| int | 国际组织 | www. |\n\n### 有关顶级域名的规定\n\n\
    (3) 新增通用型顶级域名：\n\n| 域名 | 意义 | 例 |\n|------|------|------|\n| firm | 公司、企业 | www.legend.firm\
    \ |\n| store | 销售经营公司 | www.xxx.store |\n| web | WWW 机构 | www.sina.web |\n| arts\
    \ | 文化、娱乐 | www.starco.arts |\n| rec | 消遣、娱乐 | www.internic.rec |\n| info | 信息服务\
    \ | www.mis.info |\n| nom | 个人 | www. |\n\n### 域名命名例子\n\n哈尔滨工业大学校园网内负责收发电子邮件的主机代号为mail，其域名为：\n\
    \nmail.hit.edu.cn\n\n其中，“cn”代表中国（国家名），“edu”代表教育机构的网络分类名，hit代表哈尔滨工业大学（机构名），“mail”则为邮件服务器的主机名（计算机名）。前一个区域被后一个区域包含，是后一个区域子域。\n\
    \n### 中国的顶级域名是cn，下属的二级域名分两类\n\n- ◆ **机构类别域名（最初为6个，1997年后增加为7个）：**\n  - `ac.cn`——用于科研机构\n\
    \  - `com.cn`——用于工、商、金融企业\n  - `edu.cn`——用于教育机构\n  - `org.cn`——用于非赢利组织\n  - `gov.cn`——用于政府部门\n\
    \  - `net.cn`——用于互联网\n\n- ◆ **行政区类别域名（34个）：**\n  适用于各省、市、直辖市，一般取地名前两个汉字的拼音缩写。如：\n\
    \  - `bj.cn`——北京\n  - `sh.cn`——上海\n\n### 5.2 域名系统与域名解析\n\n- 在Internet上，“域名≡ IP地址”的映射或解析工作由一组既独立又协作的服务器来完成，并称为域名服务器（Domain\
    \ Name Server，简称DNS）。\n- 域名服务器也称为名字服务器，相应地完成该映射工作的软件称为域名解析器（Name Resolver）软件。\n\
    \n### 5.2 域名系统与域名解析\n\n### 域名服务器的两种形式：\n\n- 主服务器，用于保存域名解析表，获得结果后发送给请求方。\n- 转发服务器，用于保存转发服务器表，一旦收到不是本地域名服务器解析范围内的地址时则转交到其他域名服务器，如此直至得到肯定的答复（有或没有）为止。\n\
    \n### 域名服务器的链的配置\n\n- 所有服务器必须知道其下一层服务器的位置\n- 所有服务器必须知道根服务器的位置\n\n### 域名解析的含义\n\
    \n在Internet中，当用户使用主机域名进行通信时，系统必须将域名映射为IP地址或反之。这种将域名映射成相应的IP地址的过程称为域名解析（Name Resolution）。\n\
    \n- 域名解析包含两个过程：\n- 正向域名解析：将域名映射成IP地址的过程，或者说从域名得到IP地址的过程。即“域名地址→ IP地址”。\n- 反向域名解析：将IP地址映射成域名的过程，或者说从IP地址找到相应的域名的过程。这种情况一般使用不多。\n\
    \n### 5.2 域名系统与域名解析\n\n### 域名服务器的分布结构\n\n– 与域名的层次结构类似，Internet上众多的域名服务器也是按树型层次结构分布的。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_337_0.png)\n\n### 域名的解析方法\n\n一般来说，按上图中的域名服务器的层次结构，对于任何一个域名只要从根服务器开始，自顶向下进行搜索，通过一次搜索就可找到与之相应的IP地址。域名解析的实际过程中，通常采用以下两种方法：\n\
    \n- 1、递归解析法\n\n从根服务器开始，自顶向下一级一级往下解析，直到找到相应的IP地址为止。（我替你查询）\n\n- 2、重复解析（或反复解析）法\n\
    \n从本地的DNS开始，若在本DNS管理范围内找不到相应的域名，则将请求转向更高一层或最靠近的DNS；若还是找不到，则再向高一层的DNS查询，直至最后找到请求域名及相应的IP地址为止。（我告诉你找谁查询）\n"
