    # # 简单邮件传送协议SMTP


    # ## SMTP的用途


    SMTP是发送Email的基本协议， 也是TCP/IP协议组成员之一。它的作用是解决如何通过一条链路，将邮件从一台机器传送到另一台机器上


    # ## SMTP的特点


    SMTP具有良好的可缩性，既适用于广域网， 也适用于局域网。SMTP本身非常简单，使得它的应用更加灵活。目前在Internet上能够接收Email的服务器都支持SMTP。


    # ## SMTP的工作过程 （见下图）'
