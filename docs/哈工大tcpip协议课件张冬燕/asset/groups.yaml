    \n## 2.2.7 OSI模型 - 应用层\n\n- 文件服务——FTP、NFS等\n- 打印服务——网络打印机\n\n> 将自己的服务名和地址登记在某一目录服务器中，在该目录服务器中形成一张服务表。客户端在需要了解网络能提供哪些服务时不需要接收全部服务器发出的广播包，只要向目录服务器发出请求即可获得服务名及其地址\n\
    \n> 机器型服务公告需要有提供服务者声明，被称为网络服务公告。其内容包括服务地址（我在哪），服务器（我是谁），服务器名（我能为你做什么）\n\n## 2.2.7\
    \ OSI模型 - 应用层\n\n### 服务使用方式\n- 操作系统调用截获(OS Call Interception)\n- 远程操作(Remote Operation)\n\
    - 协同计算(Collaborative)\n\n类似Windows NT这类操作系统是可以看到网络的，这样网络中服务的提供者和请求者可相互“认识”并能共同工作。这样就可把同一任务分布在网上多个实体间共同完成，从而实现协同计算。\n\
    \n## 2.3 与协议分层相对应的网络结构\n\n在计算机网络中，作为资源子网主体的计算机也参与通信操作，因为网络的重要目的是提供用户之间的资源共享，通信只是一种手段。因此，计算机网络可划分为通信服务提供者与通信服务使用者。\n\
    \n通信子网是通信服务提供者，主机则分为两个部分，即两者均包含\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_154_0.png)\n\
    \n## 2.4 TCP/IP协议族\n\nTCP/IP的设计目标是无缝的连接多个网络，使网络不受子网硬件损失的影响，因此要求网络系统结构必须相当灵活，能支持多种服务请求。\n\
    \n### TCP/IP协议的分层模式及组成\n- TCP/IP作为一个协议族,其定义在四个层次上，包括网络接口层、网间网层、传输层及应用层。\n\n##\
    \ TCP/IP参考模型\n\n7 应用层\n6 表示层\n5 会话层\n4 传输层\n3 网络层\n2 链路层\n1 物理层\n\n应用层\n传输层\n\
    Internet层\n网络接口层\n\n报文流\nTCP分组\nIP数据报\n网络帧\n\n应用层\n传输层\nInternet层\n网络接口层\n\n##\
    \ 2.4 TCP/IP协议族\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_158_0.png)\n\n## TCP/IP参考模型-网络接口层\n\
    - 是最低一层，负责与物理网络的连接。\n- 任何可用于IP数据交换的分组传输的链路层协议均包含在其中。\n  - 定义了数据帧及其格式\n  - 基于物理地址的网络寻址\n\
    \  - 为发送到物理网络的数据提供差错控制\n  - Ethernet, Token ring, etc\n\n## TCP/IP参考模型-互连网层\n\n\
    该层负责相同或不同网络中计算机的通信，主要处理来自传输层的分组发送请求和路由选择。\n\n- 提供逻辑寻址\n- 提供路由选择和互联网上的数据发送服务\n\
    - 处理网间网控制报文协议\n- 将物理地址和逻辑地址相关联\n- IP protocol\n\n## TCP/IP参考模型-传输层\n\n提供应用程序(端到端)间的通信，并在IP的基础上提供面向连接的服务。\n\
    \n- 为两个用户进程之间建立、管理和拆除可靠而有效的端到端连接\n- 提供流控制、差错控制和确认机制\n- 与网络应用的接口\n- TCP protocol、UDP\
    \ protocol\n\n## TCP/IP参考模型-应用层\n- 向用户提供一组常用的应用程序。\n- 定义了应用程序使用互联网络的规程\n- 一些具体应用,如网络故障、文件传输、远程控制以及其他互联网应用\n\
    - **Browsers**\n- **FTP**\n- **Telnet**\n- **Email**\n- **SNMP（简单网络管理协议）**\n-\
    \ **RPC（远程过程呼叫等待）等**\n\n## TCP/IP协议数据传输\n\n数据传输基于包交换\n\nISO OSI层次\n\n缓冲区\n\nTCP包头\n\
    \nTCP数据区\n\nIP包头\n\nIP数据包\n\n帧\n\n发出\n\n数据链路层 物理层\n\n## 数据在不同层次的名字\n- Application\
    \ Layer          Message\n- Transport Layer :\n  - TCP Segment\n  - UDP Datagram\n\
    - Internet Layer             Datagram\n- Network Access Layer       Frame\n\n\
    ## TCP/IP协议的功能\n- TCP/IP协议是Internet的主协议， Internet网络系统结构事实上的标准通信协议，是一系列网络协议的总称。\n\
    - TCP/IP主要完成OSI的网络层和传输层功能\n- IP(Internet Protocol, 互连网协议)：\n  节点间的寻址（IP地址），无连接通信\n\
    - TCP(Transmission Control Protocol，传输控制协议)：提供端到端之间的可靠通信，建立通信链路\n- TCP/IP提供异构系统（网络、机器）的互连\n\
    \n## TCP/IP 的发展\n\n70年代 美国国防部高级研究计划署 (ARPA) 逐步推出目前形式的TCP/IP体系结构和协议规范。\n\n80年代\
    \ 在ARPANET上首次安装了TCP/IP模块。UNIX和TCP/IP的成功结合使两者得到了普及和发展。NSF支持TCP/IP的研究与开发并资助建立NSFNET，与APRNET互连。\n\
    \n90年代 以NSFNET, ARPANET和MILNET作为为主干组成了TCP/IP协议集的网络Internet。伴随着其他网络的加入，逐步形成一个统一可互操作的世界范围的计算机互联网络。1992年1月，国际上建立起制定Internet\
    \ 标准和政策的组织Internet协会（ISOC）。由此，各国接入Internet的计算机网络不断增加，Internet 的规模和影响迅速地扩大。\n\n\
    ![](img/6da04d1fb563df13affe55d3e3f152ec_167_0.png)\n\n## Internet 分层体系结构\n\n\
    ## 内容结束\n\n## 第三章\n\n## IP 地址与地址解析\n\n## 本章主要内容\n- 主机、主机地址与IP地址\n- 子网划分与子网掩码\n\
    - IPv6的主要特点\n- 地址解析技术\n\n## 3.1 IP 地址\n\n主机（host）：\n- 连接到Internet上，并且运行了TCP/IP协议的任何计算机。\n\
    \n主机地址（host address）：\n- 由于Internet是一个巨大的网络系统，为了实现数据通信，在其中进行通信或信息交换的基本要求就是网上的每台主机（如计算机、路由器等）都要有一个唯一的可标识的编号或名字，这一标识符称为主机地址。采用“IP地址”和“域名地址”\n\
    \n## 3.1 IP 地址\n\n### 物理地址：\n- 即主机的网卡地址。绝大多数物理地址都是以太网卡地址，它有48 位，以16进制的方式表示。例如：02-3f-8d-56-3e-40\n\
    \n### IP地址：\n- 在Internet上为每台主机指定的地址称为IP地址。它是在TCP/IP协议中所规定的Internet 的每个节点都要有的统一格式的地址。是Internet\
    \ 主机地址的一种数字型标识，是一个机器可识别的地址。例如：202.118.224.153\n\n注意：一台计算机可以有多个IP地址，但一个IP地址不能由两台或两台以上计算机共同拥有\n\
    \n## IP地址的含义和特点\n\n### 它是Internet上通用的地址格式\n- 通过IP地址使得网上的计算机能够彼此交换信息，它采用32位二进制地址格式进行编码。IP地址能贯穿于整个网络，而不管每个具体的网络是采用何种技术或结构。\n\
    \n### Internet上每台主机都必须有IP地址\n- IP地址是识别Internet上每台主机包括计算机、路由器等）的端口地址，凡是上网的计算机都必须分配有IP地址，否则无法进行通信。\n\
    \n### IP地址是唯一的\n- IP地址是识别Internet上每台主机的身份证，因此每台计算机的IP地址在全网中是唯一的。\n"
