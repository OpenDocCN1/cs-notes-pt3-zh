    \n在IPv6的数据报中，最前面是一个基本报头，紧接着可以有多个扩展，也可以没有，然后是数据区，见下图。或者说，一个最小的IPv6数据报可以只含有基本头部和数据区。\n\
    \n| 基本头部 | 扩展头部1 | ...... | 扩展头部N | 数据区 |\n\n由于原来IPv4数据报报头的选项和其它一些固定字段被移到了IPv6的扩展报头里，因此IPv6\
    \ 基本报头中所含信息要比IPv4少\n\n### 1、IP地址的“冒分十六进制”表示法\n\n在IPv6中，每个IP地址占16字节（128位），是IPv4的4倍。如果仍然采用传统的IPv4中的“点分十进制”表示法来描述一个128位的IP地址，无论在阅读、输入还是管理上都会十分不便。\n\
    \n为了减少书写一个IP地址所用的字符数，采用了一种所谓的“冒分十六进制”（Colon Hexadecimal Notation，简写为：Colon Hex）表示法，就是每16位为一组，用十六进制表示，并用冒号分隔，共分8段。如一个128位的IPv6的IP地址可表示为：“69DC：8864：FFFF：FFFF：0：1280：8C0A：FFFF”。\n\
    \n### 2、IP的“零压缩”表示法\n\n在IPv6中，还有一种“零压缩法”（Zero Compression）可进一步减少IP地址的字符个数。就是用两个冒号代表连续的“0”。如：“FDC6：0：0：0：0：0：0：B0CA”可写成：“FDC6：：B0CA”。\n\
    \n### 3、与IPv4地址的兼容\n\n为了与IPv4地址的兼容，IPv6把现有IPv4的IP地址全部映射到了IPv6的地址空间中。IPv6规定：若开始80位是全“0”，接着16位是全“1”，或全“0”，则它的低32位就是一个IPv4的地址。\n\
    \n## 3.4 地址解析\n\n### 网络上的主机地址\n\n在Internet上的每一台主机，都可能同时具备以下3个地址标识：\n\n- ◆ 域名：这是一个具有一定含义又便于记忆的名字，由授权单位认定，在Internet上是唯一的。\n\
    - ◆ IP地址（逻辑地址）：这是一个数字型的地址（32位），由授权单位认定，在Internet上也是唯一的。\n- ◆ 物理地址（网卡地址）：这是安装在主机上的网卡地址，每一块网卡都有一个全球范围内唯一的地址（48位），它存储在网卡的ROM中。\n\
    \n### 第二层协议\n\n已知\n\n- 一个给定的本地网络N\n- 网络N中计算机C的IP地址\n- 求计算机C的硬件地址\n- 协议\n  - ARP—\
    \ Address Resolution Protocol\n- 相关RFC\n  - 826, 903, 1122, 1433, 1868, 2131,\
    \ 2390\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_202_0.png)\n\n协议地址是软件提供的抽象地址；物理网络硬件并不知道如何通过协议地址来定位一台计算机。\n\
    \n### 地址解析的含义\n\n- 将IP地址与物理地址之间建立一个双向的映射关系，称为地址解析（Address Resolution）。\n\nWhen?\n\
    \n- 数据包通过某个物理网络到达目的主机时\n- 数据包被Router转发时\n\nWhere?\n\n- 同一物理网络内\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_203_0.png)\n\
    \n### 1、正向地址解析（IP地址→物理地址）\n\n在互联网中，IP及其以上各层所发出的数据都要使用IP地址进行标识，而物理网络本身不认识IP地址，故必须将IP地址映射成物理地址，才能将数据发往目的地。这一过程就是正向地址解析。\n\
    \n### 2、反向地址解析：（物理地址→IP地址）\n\n此映射主要用于网络中的无盘站，因为无盘站的IP地址和其它各类文件都存放在服务器上，无盘站本身只用到一个物理地址。通过RARP，使无盘站能获取自己的IP地址。也只有无盘站才使用RARP。\n\
    \n## 以太网\n\n以太网最初是由XEROX公司研制而成的，是两个最为流行的网络传输系统之一。以太网的基本特征是采用一种称为载波监听多路访问/冲突检测\
    \ CSMA/CD(Carrier Sense Multiple Access/Collision Detection)的共享访问方案。\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_205_0.png)\n\
    \n## TCP/IP与以太网\n\n以太网和TCP/IP可以说是相辅相成的。\n\n- 以太网在一二层提供物理上的连线，使用48位的MAC地址\n- TCP/IP工作在上层，使用32位的IP地址\n\
    - 两者间使用ARP和RARP协议进行相互转换。\n\n### 载波监听\n\n- 指在以太网中的每个站点都具有同等的权利，在传输自己的数据时，首先监听信道是否空闲，如果空闲，就传输自己的数据，如果信道被占用，就等待信道空闲。\n\
    \n### 冲突检测\n\n- 为了防止发生两个站点同时监测到网络没有被使用时而产生冲突。以太网采用广播机制，所有与网络连接的工作站都可以看到网络上传递的数据。\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_208_0.png)\n\nCSMA/CD过程\n"
