    # 3.2 子网（subnet）


    +   - 在现有的三类网络的基础上将网络作进一步划分所得到的网络成为子网。即在内部可以直接通信的IP主机的集合

    +   - 每一个子网是一个完全独立的网络，子网之间，子网与一般的网络之间必须通过路由器作为网关来实现互联。

    +   - 划分子网有利于提高地址空间的实际利用率；在以太网的环境下有利于提高子网内的传输带宽。

    +   - 路由器通过子网掩码识别子网的地址。'
