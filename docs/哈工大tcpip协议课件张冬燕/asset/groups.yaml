  md: "\n## 8、HTML语言的基本框架（续）\n\n除成对出现的标签外，还有一些是单标记的标签，主要有：\n\n- `<P>`；空行标记。加入P标记后，先空出一行，然后再从下一行继续显示其后的文字。属性有：ALIGN=RIGHT/CENTER/LEFT，分别表示向右/中/左看齐。\n\
    - `<BR>`；换行标记。\n- `<IMG>`；设定显示的图形。其属性有：SRC=图形文件名，ALIGN=LEFT/RIGHT/MIDDLE/TOP/BOTTOM（图形与文字的对齐方式），WIDTH=XXX和HEIGHT=XXX（设定图形的宽度和高度）等。\n\
    - `<META>`；用于记录HTML文件的相关信息，这些信息不会显示在浏览器上。必须放在<HEAD></HEAD>之间。\n\n## 9、简单HTML文件介绍--概述\n\
    \n### 基本概念理解\n\n- HTML文件存放在Web服务器的某个目录里\n- 通过WWW浏览器下载HTML文件，并对文件中的标记进行解释（即浏览）\n\
    \n### 基本成分：标题、段落、列表、表格、图象\n\n### 简单网页形式：\n\n标题\n\n- 内容段落（列表、表格、图象等）\n- 内容段落（列表、表格、图象等）\n\
    \n## 10、简单HTML文件介绍--构成\n\n### 基本构成\n\n- 文件的内容部分\n- HTML的标志部分\n\n### 标志书写格式：\n\n\
    - <标识名>文件内容</标识名>\n- 标识名通常写在<>内\n- 不区分大小写\n- 也有单向标识：<标识名>\n\n## 11、建立简单的HTML文件\n\
    \n### 四个基本标识\n\n- <html></html>标识\n- <head></head>标识\n- <title></title>标识\n- <body></body>标识\n\
    \n## 12、<html></html>标识\n\n- HTML文件起始标识\n- 成对出现\n- 包含文件的全部内容\n\n```\n<html>\n\
    文件的全部内容\n</html>\n```\n\n## 13、<head></head>标识\n\n- 网页头部的标识\n- 写在<head></head>之间的内容，如果又写在“title”标识中，表示该网页的名称，并作为浏览器标题栏的名称，显示在此网页窗口的最上方。如果不写在“title”标识中，则成为正文的头部，显示在文本之前。\n\
    - “head”标识中的文本应当尽量简练。\n\n## 14、<title></title>标识\n\n- 网页名称标识\n- 在浏览器中作为标题栏名称显示在该窗口的上方。\n\
    - 一个网页应只有一个网页名称\n- “title”标识应包含在“head”标识之间\n- “title”标识内应不含任何其他标识\n- “title”标识宜短小\n\
    \n## 15、<body></body>标签\n\n- “body” 标识中放置网页的主体内容\n- 成对出现\n- 文件取名规则：\n  - 以htm或html为后缀\n\
    \  - 文件名中不可有空格和特殊字符\n  - 在UNIX系统中，注意大小写敏感\n  - 取名保存后，可在浏览器中打开\n\n## 16、语言字符集信息\n\
    \n### 语言字符集信息标记\n\n```\n<meta http-equiv=\"content-type\"\ncontent=\"text/html;charset=gb2312\"\
    >\n```\n\n## 17、文件的子标题\n\n- 子标题是用来区分内容的不同章节的，浏览时会显示不同的大小字型\n- HTML定义了六个级别的子标题\n\
    - 书写格式为： <Hn>吉安电大简介 </Hn>\n- n从1到6，字体越来越小\n\n## 18、几个常用的HTML标识\n\n- <pre></pre>---原样显示文本\n\
    - <p></p>---段落标识\n- <br></br>--- 行中断标识\n\n## 19、常用标记小结\n\n- `<html></html>`\n\
