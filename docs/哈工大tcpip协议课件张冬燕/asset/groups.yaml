  - '[PAGE 28]


    # # 其他杰出功能（续）


    +   • 网页翻译


    懂英文，但是是不觉得就懂德文、法文、拉丁文。如果搜索出来的页面是这些语言怎么办？呵呵，GOOGLE提供了网页翻译功能！！虽然目前只支持有限的拉丁语、法语、西班牙语、德语和葡萄牙文，但是是不得不承认，这是个杰出功能。


    试着做以下搜索：“big bang site:fr”。这个表示查找关于宇宙大爆炸的法文网页。看第一条结果：


    > The Big Bang Website - [ Translate this page ]

    > ... A propos de Big Bang. Le dernier numéro en date. Les anciens

    > activités. Concerts progressifs en France. Emissions de radio. Liens.

    > perso.club-internet.fr/calyx/bigbang/ - 3k - Cached - Similar pages


    有点晕。没关系，点击“Translate this page”按钮。再看结果，嗯，大致能看明白，这原来是个叫“big bang”的乐队的网站，与大爆炸无关...


    机器翻译是一个很前沿的人工智能课题，想指望翻译出来的结果跟专门用英语撰写的内容是不可能的。但西文间的互相翻译比中英文机译强得多多了。至少能看明白。'
  - '[PAGE 29]


    # 关键词选择初探


    +   - 关键词的选择在搜索中起到决定性的作用，关键词选择是最基本也是最有效的。


    +   - 例一：查找《镜花缘》一书中淑士国酒保的酸话原文。


    +   - 分析：如果按照一般的思路，找某部小说中的具体段落，就需要用搜索引擎先找到这本书，然后再翻到该段落。这样做当然可以，但是效率很低。如果了解目标信息的构成，用一些目标信息所特有的字词，可以非常迅速的查到所需要的资料。也就是说，高效率的搜索关键字不一定就是目标信息的主题。在上面的例子中，酒保谈到酒的浓淡与贵贱的关系时，之乎者也横飞。因此，可以用特定的词语一下子找到目标资料。


    +   - 搜索：“酒贵贱之”，OK，找到的第一条信息就是镜花缘的这一段落：“先生听者：今以酒醋论之，酒价贱之，醋价贵之。因何贱之？为甚贵之？真所分之，在其味之。酒味淡之，故而贱之；醋味厚之，所以贵之。…”


    +   - 以上的关键字选择技巧可以谓之“特定词法”。'
