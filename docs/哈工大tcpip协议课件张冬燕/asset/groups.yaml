    # 2.2.2 OSI模型 - 链路层


    反馈重发纠错实现方法有两种：


    +   - 停止等待方式

    +     - 等到确认接收方正确无误地收到数据帧后才发送下一个帧。协议简单，系统通信效率低。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_135_0.png)'
