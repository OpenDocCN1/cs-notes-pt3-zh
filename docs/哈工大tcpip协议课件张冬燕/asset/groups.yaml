    多元搜索引擎（Metasearch Engine, Megasearch Engine或Unified Search Engine）又称集成式搜索引擎，是将多个搜索引擎集成在一起，向用户提供一个统一的检索界面。并且将一个检索提问同时发给多个搜索引擎同时检索多个数据库，经过聚合、去除重复部分并输出检索结果。使用多元搜索引擎可让用户省时、省力。'
