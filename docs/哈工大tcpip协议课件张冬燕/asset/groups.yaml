    \ filetype:pdf. 共有25,500项查询结果。搜索用时0.44秒。\n\n- 可以看到，GOOGLE在PDF档前加上了[PDF]的标记，而且，GOOGLE把PDF文件转换成了文字档，点击“一般文字档”，可以粗略的查看该PDF档的大致内容。\n\
