    IP地址是采用层次方式按逻辑网络的结构进行划分的，因此在IP地址中包含了两部分信息：


    +   • 网络地址（Network ID）：标识主机所在的逻辑网络。

    +   • 主机地址（host ID）：用来识别该网络中的一台主机。


    IP地址的类别：


    为了根据不同的网络规模来合理分配IP地址，通常将IP地址分为三个基本类：A类、B类、C类。还有2个特殊类：D类和E类。'
