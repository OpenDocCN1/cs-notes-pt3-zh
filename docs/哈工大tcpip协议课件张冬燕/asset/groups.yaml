  md: "\n## 初阶搜索（续）\n\n- 用“+”和“-”减少冗余信息\n  - “+”和“-”很多时候能够缩小搜索结果的范围，以提高查询结果命中率。\n\
    \  - 例：查阅天龙八部具体是哪八部。分析：如果光用“天龙八部”做关键字，搜索结果有20,300项，而且前面的主要与金庸小说《天龙八部》相关，很难找到所需要的资讯。可以用两个方法减少无关结果。\n\
    \    - 1，如果知道八部中的某一部，比如阿修罗，增加“阿修罗”关键字。“天龙八部 阿修罗”的搜索结果就只有1,050项。\n    - 2，如果不知道八部中的任何一部，但知道这与佛教相关，可以排除与金庸小说相关的记录。“天龙八部\
    \ 佛教 -金庸”的查询结果为1,120项，可以迅速找到需要的资料。\n\n- “+”、“-”和“OR”的混合查询\n  - 混合查询涉及到逻辑操作符的顺序问题。一般而言，搜索引擎按照从左往右的顺序读取操作符号。如果只涉及“与”操作和“非”操作或单纯的“或”操作，则不会产生顺序问题。\n\
    \  - 示例：查询：“所有关于Britney或者Beatles、但是没有Madonna相关信息的中文网页”。\n    - 搜索：“Britney OR\
    \ Beatles -Madonna”\n      结果：已搜索有关Britney OR Beatles -Madonna的中文(简体)网页。共约有16,200项查询结果，这是第1-10项。搜索用时0.23秒。\n\
    \    - 搜索：“-Madonna Britney OR Beatles”\n      结果：已搜索有关-Madonna Britney OR Beatles的中文(简体)网页。共约有16,200项查询结果，这是第1-10项。搜索用时0.13秒。\n\
    \    - 搜索：“Britney -Madonna OR Beatles”\n      结果：找不到和您的查询-Britney -Madonna OR\
    \ Beatles-相符的网页\n    - 搜索：“Britney OR -Madonna Beatles”\n      结果：找不到和您的查询-Britney\
    \ OR -Madonna Beatles-相符的网页\n  - 可见，“或”操作的前后两个关键字必须是默认的“与”查询，否则，搜索引擎将无法完成搜索。\n\
    \n## 辅助搜索\n\n- 通配符问题\n\n很多搜索引擎支持通配符号，如 \"*\" 代表一连串字符， \"?\" 代表单个字符等。GOOGLE不支持通配符号，只能做精确查询，关键字中的\
    \ \"*\" 或者 \"?\" 会被忽略掉。\n\n- 关键字的字母大小写\n\nGOOGLE对英文字符大小写不敏感， \"GOD\"和 \"god\"\
    搜索的结果是一样的。\n\n- 搜索整个句子\n\nGOOGLE的关键词可以是词组（中间没有空格），也可以是句子（中间有空格），但是，用句子做关键词，必须加英文引号。\n\
    \n示例：搜索包含 \"long, long ago\"字符串的页面。\n\n```\n\"long long ago\"\n```\n\n结果：已搜索有关long\
    \ long ago的中文(简体)网页。共有 16,500项查询结果，这是第1-10项 。 搜索用时0.06秒。\n\n## 辅助搜索（续）\n\n- 搜索引擎忽略的字符和词汇\n\
    \nGOOGLE对一些网路上出现频率极高的英文单词，如 “i”、“com”、“www”等，以及一些符号如 “*”、“.” 等，作忽略处理。\n\n示例：搜索关于第一次世界大战的信息\n\
    搜索： “worldwar i”\n结果： “i”太常用，没有被列入搜索范围。已向英特网搜索 “worldwar i”。共约有67,000项符合worldwar\
    \ i的查询结果，这是第1-10项。搜索用时0.07秒。\n\n- 强制搜索\n\n如果要对忽略的关键字进行强制搜索，则需要在该关键字前加上明文的 “+”\
    \ 号。\n\n示例：搜索包含 “Who am I?”的网页。如果用 “ who am i?”， “Who”、“I”、“?”会被省略掉，搜索将只用 “am”作关键字，所以应用强制搜索。\n\
    搜索： “ +who +am +i”\n结果：已向英特网搜索 “+who +am +i”。共约有332,000项查询结果，这是第1-10项。搜索用时3.68秒。\n\
    \n- 注意：大部分常用英文符号（如问号，句号，逗号等）无法成为搜索关键字，加强制也不行。\n\n## 进阶搜索\n\n- 对搜索的网站进行限制\n  -\
    \ “site”表示搜索结果局限于某个具体网站或者网站频道，如 “sina.com.cn”、“edu.sina.com.cn”，或者是某个域名，如 “com.cn”、“com”等。如果是要排除某网站或者域名范围内的页面，只需用\
    \ “-网站/域名”。\n  - 示例：搜索中文教育科研网站（edu.cn）上所有包含“金庸”的页面。\n    搜索： “金庸 site:edu.cn”\n\
    \    结果：已搜索有关金庸 site:edu.cn的中文(简体)网页。 共约有1,730项查询结果，这是第1-10项。 搜索用时0.23秒。\n  -\
    \ 示例：搜索新浪文教频道中关于鲁迅的信息。\n    搜索： “鲁迅 site:edu.sina.com.cn”\n    结果：已在edu.sina.com.cn搜索有关\
    \ 鲁迅的中文(简体)网页。 共约有672项查询结果，这是第1-10项。 搜索用时0.24秒。\n  - 注意： site后的冒号为英文字符，而且，冒号后不能有空格，否则，“site:”将被作为一个搜索的关键字。此外，网站域名不能有任何“/”的目录后缀；网站频道则只局限于“频道名.域名”方式，而不能是“域名/频道名”方式。诸如“金庸\
