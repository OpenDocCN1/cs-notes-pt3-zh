  - '[PAGE 24]


    # 目录内搜索


    +   - 如果不想搜索广泛的网页，而是想寻找某些专题网站，可以访问 GOOGLE 的分类目录“http://directory.google.com/”，中文目录是“http://directory.google.com/Top/World/Chinese_Simplified/”。


    +   - 目前 GOOGLE 使用的分类目录采用了 ODP 的内容。“Open Directory Project”是网景公司所主持的大型公共网页目录。由全世界各地的义务编辑人员审核挑选网页，并依照网页的性质及内容来分门别类。因此，在某一目录门类中进行搜索往往能有更高的命中率。


    +   - 示例：查找关于癌症治疗以及护理方面的中文资料

    +     搜索：先进入中文简体分类目录，再进入“健康”子目录，确定选中“只在健康中搜索”单选项目。在搜索栏内填入“癌症”进行搜索。

    +     结果：在分类健康项中搜索癌症。共约有370项查询结果，这是第1-10项。搜索用时0.05秒。


    +   - 可以看到，上述查询结果比普通的检索更有效，因为在分类中进行搜索剔除了很多不相关的无效信息。


    +     - 对于中文用户而言，最大的问題是志愿的中文目录编辑太少，导致收录站点太少，因此搜索结果范围显得过于狭隘。'
  - '[PAGE 25]


    # # 新闻组（USENET）搜索


    新闻组有详尽的分类主题，某些主题还有专人管理编辑，具有大量有价值信息。由于新闻组包含的信息实在是海量，因此不利用工具进行检索是不大可能的。除了搜索之外，GOOGLE还支持新闻组的WEB方式浏览和张贴功能。


    +   - 进入GOOGLE新闻组 “http://groups.google.com/”，有两种信息查找方式：

    +     - 一层层的点击进入特定主题讨论组

    +     - 直接搜索


    示例：查找新闻组中关于山顶洞人的讨论信息

    搜索：“山顶洞人”

    结果：在各群组内搜索山顶洞人共约有18项查询结果，这是第1-10项。搜索用时0.29秒。


    新闻组中的帖子实在是多，而且又涉及一些普通搜索所没有的语法，所以建议使用“高级群组搜索”。新闻组高级搜索提供留言内容、分类主题、标题、留言者、留言码、语言和发布日期作为条件进行搜索。（作者指发帖所用的唯一识别号电子信箱）'
  - '[PAGE 26]


    # 其他杰出功能


    +   - 集成化的工具条

    +     - 为方便搜索者，GOOGLE提供了工具条，集成于浏览器中，用户无需打开GOOGLE主页就可以在工具条内输入关键字进行搜索。此外，工具条还提供许多其他功能，如显示页面PageRank等。最方便的一点在于用户可以快捷的在GOOGLE主页、目录服务、新闻组搜索、高级搜索和搜索设定之间切换。

    +     - 欲安装GOOGLE的工具条，可以访问 “http://toolbar.google.com/”，按页面提示可以自动下载并安装。

    +     - 对于经常进行网络搜索者而言，GOOGLE工具条实在是必备的东西！！

    +   - 搜索结果过滤

    +     - 网络上的成人内容浩如烟海，而且很多站点具有欺骗或者其他不良企图，浏览者很容易掉入其中的陷阱。为此，GOOGLE设立了成人内容过滤功能，见GOOGLE的设置页面，http://www.google.com/preferences，最底下有一个选项
    SafeSearch Filtering。不过，中文状态下的GOOGLE还没有这个功能。'
