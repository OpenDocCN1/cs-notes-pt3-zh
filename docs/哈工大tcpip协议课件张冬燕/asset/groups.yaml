    # 中国互联网的发展


    +   2000年1月18日CNNIC《中国互联网络发展状况统计报告》：截止至99年12月31日，我国上网用户数达890万（99年上半年为400万），上网计算机主机达350万台，WWW站点15153个


    +   2001年1月17日，CNNIC在京发布了最新的《中国互联网络发展状况统计报告》。统计报告显示：截止到2000年12月31日止，我国上网计算机数有约892万台（拨号751万，专线141万）；域名总数122099个；上网用户数2250万人（拨号1543万，专线与拨号同时343万，其它92万）；2001年，我国上网计算机已接近3000万台。WWW网站约265405个，我国国际线路的总容量为2799M。'
