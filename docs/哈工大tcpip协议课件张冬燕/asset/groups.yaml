    - 创建链接\n- 链接到另一页面\n- 链接到WEB的文件\n- 链接到文档的指定位置\n\n## 23、本地超链接\n\n### 本地连接\n\n- 所有连接文件都在本地磁盘上，不必连接网络\n\
