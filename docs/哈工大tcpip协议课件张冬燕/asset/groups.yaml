    # 网络接口卡


    网络接口卡是使工作站连接到网络，并与网络中其他计算机相互通信的设备。好几家公司（比如3Com、IBM、Intel、SMC和Xircom）都生产网络接口卡。各家生产的网络接口卡规格不一样，但都满足网络和工作站的需求。下图即为一块典型的工作站网络接口卡。


    注意：由于不同的PC和网络需要不同类型的网络接口卡，所以不能想当然地认为某工作站上运行正常的网络接口卡在别的工作站上也能照样运行。


    ![](img/6da04d1fb563df13affe55d3e3f152ec_210_0.png)


    # 网络接口卡'
