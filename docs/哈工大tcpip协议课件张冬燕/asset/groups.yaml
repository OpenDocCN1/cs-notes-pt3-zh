    \n除使用GOOGLE提供的专门图片搜索功能，还可以组合使用一些搜索语法，达到图片搜索之目的。\n\n分析一：专门的图片集合，提供图片的网站通常会把图片放在某个专门目录下，如“gallery”、“album”、“photo”、“image”等。这样就可以使用INURL语法迅速找到这类目录。现在，试着找找小甜甜布兰妮的照片集。\n\
    \n```\n搜索：“\"britey spears\" inurl:photo\"。\n```\n\n分析二：提供图片集合的网页，在标题栏内通常会把注明，这是谁的图片集合。于是就可以用INTITLE语法找到这类网页。\n\
    \n```\n搜索：“intitle:\"britey spears\" picture\"。\n```\n\n分析三：明星的FANS通常会申请免费个人主页来存放他们偶像的靓照。于是用SITE语法指定某免费主页提供站点，是个迅速找到图片的好办法。\n\
    \n```\n搜索：“\"britey spears\" site:geocities.com\"。\n```\n\n## 常用搜索个案（续）\n\n##\
    \ 找MP3\n\n- 分析一：提供MP3的网站，通常会建立一个叫做MP3的目录，目录底下分门别类的存放各种MP3乐曲。所以，可以用INURL语法迅速找到这类目录。现在用这个办法找我老歌“say\
    \ you say me”。\n  搜索：“say you say me” inurl:mp3\n  结果：已向英特网搜索inurl:mp3 \"say you\
    \ say me\"。共约有155项查询结果，这是第1-10项。搜索用时0.17秒。\n\n- 分析二：也可以通过网页标题，找到这类提供MP3的网页。\n\
    \  搜索：“say you say me” intitle:mp3\n  结果：已向英特网搜索\"say you say me\" intitle:mp3。共约有178项查询结果，这是第1-10项。搜索用时0.73秒。\n\
    \n- 当然，如果知道某个网站的下载速度快，而且乐曲全，就可以用SITE语法先到该网站上看看有没有目标乐曲。\n\n## GOOGLE搜索FAQ\n\n-\
    \ Q: 如何全面的了解google.com?\n  A: 查看网站相关页面 “http://www.google.com/about.html”。\n-\
    \ Q: 如何切换google.com的初始语言界面?\n  A: 点击搜索栏右边的 “使用偏好” （Preferences），选择 “界面语言” （Interface\
    \ Language）中你期望的语言，点击最下面的 “设定使用偏好” （Save Preferences）按钮。需要提醒的是，GOOGLE使用cookie记录这个偏好，所以如果把浏览器的cookie功能关掉，就无法进行设定。\n\
    - Q: 如何设定每页搜索结果显示数量?\n  A: 同上，进入使用偏好，在该页的 “查看结果” （Number of Results）选择显示结果数，数目越大，显示结果需要的时间越长，默认是10项。\n\
    \n## GOOGLE搜索FAQ\n\n- Q: 搜索到的链接无法打开怎么办？\n  A: 链接无法打开的原因很多，比如网站当机，或者页面已经死掉等等，可以点击GOOGLE的“网页快照”查看在GOOGLE服务器上的网页缓存。不过，如果该页面是被当地ISP过滤的话，服务器缓存还是无法打开。唯一的办法在于利用代理服务器，然后在URL栏内输入链接的IP地址。\n\
    \n- Q: 打开搜索结果的链接，可是该页面太大，很难找到一下子找到目的资料怎么办？\n  A: 直接打开“网页快照”，GOOGLE会把关键词用不同颜色标记出来，很容易找到。\n\
    \n- Q: 点击每个查询结果的时候，我想单独弹出窗口，这该怎么办？\n  A: 进入“使用偏好”界面，注意底部有个“结果视窗”项目，选中“开启新视窗以显示查询结果”复选框然后存储设置就可以了。\n\
    \n## 使用偏好\n\n继续查询前请储存您的设定。\n\n储存使用偏好\n\n## 语系偏好 (修改将适用于所有的 Google 服务)\n\n界面语言\n\
    \n指示语言 英语\n\n## 搜索语言\n\n所有语言 (建议使用).\n\n只搜寻由以下语言所写的网页：(可多选)\n\n- 丹麦文\n- 俄文\n-\
    \ 保加利亚文\n- 克罗地亚文\n- 冰岛文\n- 加泰罗尼亚文 (西班牙)\n- 哥特利文\n- 印尼文\n- 土耳其文\n\n- 塞尔维亚文\n- 希伯来文\n\
