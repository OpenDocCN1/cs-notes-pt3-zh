    \n- **头部**\n  - 包括目的地址\n  - 固定字段\n- **数据区**\n  - 最高为64k的可变长度\n  - 没有最小长度限制\n\n\
    **IP数据报和IP包**\n\n- IP数据报“不是”IP发送的东西\n- 作为IP包来发送\n- IP包将IP数据报hop by hop发送到目的系统\n\
    - 很多时候一个IP数据报同时就是一个IP包\n- IP数据报作为主机发送的实体\n- IP包作为数据帧中传送的实体\n\n**IP数据报和IP包一示意图**\n\
    \n到192.168.20.60\n\n192.168.10.10  \n192.168.10.3  \n192.168.20.3  \n192.168.20.60\n\
    \n![](img/6da04d1fb563df13affe55d3e3f152ec_242_0.png)\n\n**IP数据报格式**\n\n- IP头部\n\
    - IP数据区\n- 控制码\n- 源IP地址\n- 目的IP地址\n- 再次分段后本段在原分组的相对位置\n- 允许再次分段标志\n- 版本\n- 头长度\n\
    - 服务类型\n- 校验和\n- 标志\n- 偏移\n\n**IP 数据报字段说明**\n\n**生命期TTL**\n\n- 避免数据报无限制地占用网络资源\n\
    - 以秒为单位或者以执行时间不足一秒的发送行为为单位的度量\n- 一般认为每经过一跳数值减1\n- 缺省值为64\n\n**头部校验和**\n\n- 检查数据报头部是否损坏\n\
    - 数据部分不需要检查\n  - 浪费时间\n  - 高层协议提供了检查机制\n  - 一些应用协议能够处理部分破坏了的数据\n\n**头部长度**\n\n\
    - 说明IP头部大小，以32比特倍数表示，最大值60字节？\n- 大部分IP数据报头部为20字节\n\n**数据服务类型和优先级TOS**\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_245_0.png)\n\
    \n| 优先级 | 定义 |\n| --- | --- |\n| 0 | 常规 |\n| 1 | 优先 |\n| 2 | 立刻 |\n| 3 | 急速 |\n\
    | 4 | 超急速 |\n| 5 | 火急 |\n| 6 | 互联网控制 |\n| 7 | 网络控制 |\n\n- C - Minimize Cost, 最小费用\n\
    - R - Maximize Reliability, 最高可靠性\n- T - Maximize Throughput, 最大吞吐量\n- D - Minimize\
    \ Delay, 最小延迟\n"
