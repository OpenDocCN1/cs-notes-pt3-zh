    # 1、 E-mail系统的组成


    E-mail系统一般由以下五部分组成：


    +   - 邮件服务器 (Mail Server)

    +   - 邮件主机 (Mail Host)

    +   - 邮件客户端 (Mail Client)

    +   - 邮件中继 (Mail Reply)

    +   - 邮件网关 (Mail Gateway)'
  - '[PAGE 575]


    # E-mail系统各部分的基本功能


    # 邮件服务器（Mail Server）


    用来保存用户的Email信息，为用户提供登录机会并发送或接收信件。邮件服务器通常需要较大的硬盘保存用户信件，有时还需要双机备份。常见的邮件服务器有：SMTP服务器、POP3服务器以及IMAP服务器等。


    # 邮件主机（ Mail Host）


    负责本域内Email的收发，每一个域必须有一个主机。当邮件服务器发出一个Email时，被送到邮件主机，邮件主机先判断这个Email是否发往本域，若是，则可直接将邮件送目的主机；否则，送邮件中继。'
  - '[PAGE 576]


    # E-mail系统各部分的基本功能


    # 邮件中继（Mail Reply）


    负责向域外的主机发送邮件。邮件中继收到邮件主机送来的邮件后，就送到远处的上一级邮件中继，由上一级邮件中继进行处理。由于大多数邮件服务器软件包中已经包含了邮件主机和邮件中继的功能，因此，一般将邮件服务器、邮件主机和邮件中继安装在同一台服务器上。


    # 邮件网关（Mail Gateway）


    负责在不同协议的网络上传递邮件时进行协议之间的转换。一般采用SMTP和POP3协议的邮件服务器不需要邮件转换网关。'
