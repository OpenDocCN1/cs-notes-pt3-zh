    \nE-mail系统一般由以下五部分组成：\n\n- 邮件服务器 (Mail Server)\n- 邮件主机 (Mail Host)\n- 邮件客户端 (Mail\
    \ Client)\n- 邮件中继 (Mail Relay)\n- 邮件网关 (Mail Gateway)\n\n## E-mail系统各部分的基本功能\n\
    \n### 邮件服务器（Mail Server）\n\n用来保存用户的Email信息，为用户提供登录机会并发送或接收信件。邮件服务器通常需要较大的硬盘保存用户信件，有时还需要双机备份。常见的邮件服务器有：SMTP服务器、POP3服务器以及IMAP服务器等。\n\
    \n### 邮件主机（ Mail Host）\n\n负责本域内Email的收发，每一个域必须有一个主机。当邮件服务器发出一个Email时，被送到邮件主机，邮件主机先判断这个Email是否发往本域，若是，则可直接将邮件送目的主机；否则，送邮件中继。\n\
    \n## E-mail系统各部分的基本功能\n\n### 邮件中继（Mail Relay）\n\n负责向域外的主机发送邮件。邮件中继收到邮件主机送来的邮件后，就送到远处的上一级邮件中继，由上一级邮件中继进行处理。由于大多数邮件服务器软件包中已经包含了邮件主机和邮件中继的功能，因此，一般将邮件服务器、邮件主机和邮件中继安装在同一台服务器上。\n\
    \n### 邮件网关（Mail Gateway）\n\n负责在不同协议的网络上传递邮件时进行协议之间的转换。一般采用SMTP和POP3协议的邮件服务器不需要邮件转换网关。\n\
    \n## E-mail系统各部分的基本功能\n\n- □ 记帐功能：记录用户连机时间和信箱空间占用情况。实现计费功能。\n- □ 限制用户功能：使用户只能进行与Email相关的操作限制用户资源。\n\
    - □ Email过滤功能：阻挡不良信息或病毒Email进入用户系统。\n- □ 提供网络通信的加密功能：防止他人从网络监听或窃取口令。\n- □ 提供信件和文件加密功能：保护用户个人隐私。\n\
    - □ 具有系统安全防御能力：抵抗外来攻击，保护用户信息安全。\n\n## 邮件服务器的解决方案\n\n### 1、企业对Email服务器的要求\n\n对于一个较大的Intranet网络，需要自己安装、设置邮件服务器才能解决企业内部的邮箱需求。一个企业对Email信箱的要求有如下几点：\n\
    \n- E-mail地址应该具有单位的特征\n- 服务器应允许设置大量的Email用户\n- 收发E-mail速度要快，以提高工作效率\n\n## 邮件服务器的解决方案\n\
    \n### 2、企业级邮件服务器的解决方案\n\n针对上述要求，有不同的解决方案，主要有以下几种：\n\n- ISP服务\n- 虚拟主机托管服务\n- 局域网内设立内部邮件服务器\n\
    \n## 邮件服务器的解决方案\n\n### （1） ISP服务\n\n如果用户没有自己的网络或网络规模太小，则采用这种方式。在这种方式下，用户一般是向ISP申请免费或收费的Email帐号，通过拨号（PSTN、ISDN或ADSL）上网来收发Email。\n\
    \n特点：这种Email地址不具有本单位的特征；用户必须与Internet连接才能收发Email，收发速度受连接Internet速度的影响。只适合个人用户或小型企业。\n\
    \n## 邮件服务器的解决方案\n\n虚拟主机托管的方式是用户在ISP的服务器的硬盘上专门开辟了一块区域，用来作为自己的信息发布（Web服务器）和Email服务（邮件服务器）。但全部信息都是存放在ISP的服务器上，即使是内部邮件的交流，也要通过Internet才能完成。这种方式适合于小型企业。\n\
    \n## 邮件服务器的解决方案\n\n### （3）局域网内设立内部邮件服务器\n\n这种方式是在企业内部建立一个邮件服务器，解决内部邮件问题。该方案有两种形式：\n\
    \n### 内部局域网没有通过专线与Internet相连：\n\n- 这时虽然内部局域网可以互相利用内部Email地址收发邮件，但内部Email地址无法和Internet上的Email地址统一，造成每人需要两个互不相干的Email地址。\n\
    \n### 内部局域网通过专线与Internet相连：\n\n- 此时企业内部网上的邮件服务器通过专线与Internet连接，并且单独安装在一台具有合法IP地址的服务器上。这种方案可以很好地解决用户Email的内外收发、传输速度、安全性能等方面的诸多问题。但缺点是需要支付较高的通信费用。\n\
    \n## 邮件服务器软件的选择\n\n为保证邮件服务器的建设质量，选择一个好的邮件服务器软件十分重要。\n\n### 邮件服务器软件的分类\n\n一般按邮件服务器软件是否基于Internet标准，可以分为如下几种：\n\
    \n- (1) 基于Internet的邮件软件包\n- (2) 面向应用机构的Email系统\n\n## 7.5 Email系统的安全与发展\n\n对于一个Email系统来说，其安全性能是邮件系统能够充分发挥作用的基本保证。\n\
    \nEmail系统的发展趋势主要表现在Internet/Intranet一体化以及支持多媒体邮件两方面。\n\n## Email系统的安全性\n\n###\
    \ 1、Email系统安全性的基本内容\n\n一般来说，Email系统的安全性主要包括以下三方面的内容：\n\n- (1) 严格的身份验证：指不允许任何人以假冒的身份发送和冒名窃取别人的邮件。\n\
    - (2) 可靠的加密措施：为防止邮件在传送过程中被非法截阅，在发送方要能进行加密编码，在接收方进行相应的解密（解码）。\n- (3) 收发邮件的不可抵赖性：即要求收发双方均不能修改已经发送和接收的邮件内容和收发记录，从而均不能抵赖相应的责任问题。\n\
    \n## Email系统的安全性\n\n为使Email能安全地传送，通常采取以下方法提高安全性：\n\n1. 设置合适的Email口令：不宜用作口令的有：\n\
    \   ①用户名；\n   ②用户名的变换形式；\n   ③自己或亲友的生日；\n   ④英文单词；\n   ⑤5位或5位以下的字符。\n\n2. 选用安全性好的邮件客户软件：安全性好的Email客户程序一般具有的增强功能：\n\
    \   ①远程邮箱管理；\n   ②能挂接PGP加密签名；\n   ③有开机口令；\n   ④能挂接防邮件炸弹、邮件病毒的工具。\n\n3. 管理好Email信箱：尽量不要用在ISP处正式注册的Email账号来收发邮件；多申请几个不同地址的Email。\n\
    \n## 共享与交流--FTP及其他\n\n## 8.1 文件传输（FTP）\n\n- FTP的工作原理\n- FTP的主要功能\n- 匿名FTP的使用\n\
    - FTP的客户端程序--CuteFTP, leapftp\n- FTP的服务器软件介绍\n\n## 1、FTP的基本概念\n\n1、 FTP---文件传输协议（File\
    \ Transfer Protocol）\n2、 文件传输---通过网络将文件从本地计算机传送到远程计算机（远程→本地：称为“下载”；本地→远程：称为“上传”），即在两台计算机之间复制文件。\n\
    3、 特点：\n   - 跨操作系统平台\n   - 跨网络平台\n   - 所有的FTP程序都遵守FTP协议\n   - 是Internet上文件传送的基础\n\
    4、 用途：主要用来从网络上获取程序和文档\n\n## 2、FTP的工作原理\n\n![](img/6da04d1fb563df13affe55d3e3f152ec_591_0.png)\n\
    \n- (1) 接收用户从键盘或鼠标输入的命令；\n- (2) 分析命令并传送给FTP服务器程序，通知进行如何操作；\n- (3) 接收并在本地屏幕上显示服务器程序回送的信息；\n\
    - (4) 传送或接收文件；\n\n- (1) 接收并执行客户程序发过来的命令；\n- (2) 与客户程序建立TCP/IP连接；\n- (3) 将文件传送给客户机或从客户机接收文件；\n\
    - (4) 将执行命令的状态回送给客户机，并显示在客户机的屏幕上；\n"
