  md: "\n## 关键词选择初探（续）\n\n关键词的选择在搜索中起到决定性的作用，关键词选择是最基本也是最有效的。\n\n例二：“黄花闺女”一词中“黄花”是什么意思。\n\
    \n“黄花闺女”是一个约定的俗语，如果只用“黄花闺女”做关键词，搜索结果将浩如烟海，没什么价值，因此必须要加更多的关键词，约束搜索结果。选择什么关键词好呢？备选的有“意思”、“含义”、“来历”、“由来”、“典故”、“出典”、“渊源”等，可以猜到的是，类似的资料，应该包含在一些民俗介绍性的文字里，所以用诸如“来历”、“由来”、“出典”等词汇的概率更高一些。\n\
    \n搜索：“黄花闺女 黄花 由来”，查到“黄花”原来出典于《太平御览》，与南朝的寿阳公主相关。如果想获得第一手资料，那就可以用“太平御览 寿阳公主”做搜索了。\n\
    \n以上的关键字选择技巧可以谓之“近义词法”。\n\n## 常用搜索个案\n\n- 找人\n  - 分析：一个人在网上揭示的资料通常有：姓名，网名，性别，年龄，毕业学校，工作单位，外号，住址，电话，信箱，BP，手机号码，ICQ号，OICQ号等等。所以，如果要了解一下多年没见过的同学，那不妨用上述信息做关键字进行查询，也许会有大的收获。\n\
    \n- 找书\n  - 分析一：常访问的电子图书馆类网站就那么几个，比如文艺类的“www.shuku.net”。于是可以用SITE语法很简单的找到某本书（如果该网站上有的話）。比如，“旧唐书\
    \ site:shuku.net”，就可以马上找到该书。如果没有，通常别的网站上也很难找到。因此，找书的关键，是了解一大批著名的图书馆网站。\n  - 分析二：上面介绍的第一项关键字选择技巧特定词法，对于迅速找到某书或者文章也是极其有用的，当然，这得建立在你已经读过该书，对书的内容有印象的基础上。比如如果了解堂吉诃德一书战风车的\
    \ 大致内容，就可以用“吉河德风车 桑乔”迅速找到该书。\n\n## 常用搜索个案（续）\n\n- 找软件\n  - 分析一：最简单的搜索当然就是直接以软件名称以及版本号为关键字查询。但是，仅仅有软件名称和目标网站，显然还不行，因为搜索到的可能是软件的相关新闻。考虑到下载页面上常有“点击此处下载”或者“download”的提示语，因此，可以增加“下载”或者“download”为关键字。例：搜索“winzip\
    \ 8.0 下载”。\n  - 分析二：很多网站设有专门的下载目录，而且就命名为“download”，因此，可以用INURL语法直接搜索这些下载目录。例：搜索“winzip\
    \ 8.0 inurl:download”。\n  - 在互联网上随意的下载软件是不安全的，因为供下载的软件有可能带有病毒或者捆绑了木马，所以，对下载网站作一个限定，是一个稳妥的思路。可以用SITE语法达到这个目的。\n\
    \  - 共享软件下载完之后，使用的时候，软件总跳出警示框，或者软件的功能受到一定限制。所以应该再找一个注册码。找注册码，除了软件的名称和版本号外，还需要有诸如“serial\
    \ number”、“sn”、“序列号”等关键字。现在，来搜索一下winzip8.0的注册码。例：搜索“winzip 8.0 sn”。\n\n- 找图片\n\
    \n除使用GOOGLE提供的专门图片搜索功能，还可以组合使用一些搜索语法，达到图片搜索之目的。\n\n分析一：专门的图片集合，提供图片的网站通常会把图片放在某个专门目录下，如“gallery”、“album”、“photo”、“image”等。这样就可以使用INURL语法迅速找到这类目录。现在，试着找找小甜甜布兰妮的照片集。\n\
    \n```\n搜索：“\"britey spears\" inurl:photo\"。\n```\n\n分析二：提供图片集合的网页，在标题栏内通常会把注明，这是谁的图片集合。于是就可以用INTITLE语法找到这类网页。\n\
    \n```\n搜索：“intitle:\"britey spears\" picture\"。\n```\n\n分析三：明星的FANS通常会申请免费个人主页来存放他们偶像的靓照。于是用SITE语法指定某免费主页提供站点，是个迅速找到图片的好办法。\n\
