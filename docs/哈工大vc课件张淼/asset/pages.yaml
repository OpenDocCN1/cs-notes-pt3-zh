  md: '# # 变量的存储分配（生存期）


    变量是**内存空间**的一种抽象，程序中定义的每个变量在程序运行时刻都有与之对应的**内存空间**。


    但是，何时给变量分配空间以及相应空间分配在哪里？这要视变量的性质而定。通常把程序运行时一个变量占有内存空间的时间段称为该**变量的生存期**。


