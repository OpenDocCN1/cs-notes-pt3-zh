- pgno: 364
  md: '用delete或free撤消动态变量后，C++编译程序一般不会把指向它的指针变量的值赋为NULL，这时就会出现“悬浮指针”（dangling pointer）,它指向一个无效空间。这时如果再通过这个“悬浮指针”来使用相应的动态变量会导致程序的语义错误。


    对于一个动态变量，如果没有撤消它，而仅仅是把指向它的指针变量指向了别处，或指向它的指针变量的生存期结束了，这个动态变量就会变成一个“孤儿”，这种现象称为内存泄露。程序中再也访问不到它，而它却一直占据内存空间，从而导致内存空间的浪费。'
  merge: -1
  img_proc: true
