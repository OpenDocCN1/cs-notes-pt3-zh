- pgno: 830
  md: '# 输入/输出


    输入/输出（简称I/O）是程序的一个重要组成部分，程序运行所需要的数据往往要从外设（如键盘、文件等）得到，程序的运行结果通常也要输出到外设（如显示器、打印机、文件等）中去。


    在C++中，输入/输出不是语言所定义的成分，而是由具体的实现（编译程序）作为标准库的功能来实现的。'
  merge: -1
  img_proc: true
- pgno: 831
  md: '# 流


    在C++中，输入/输出操作是一种基于字节流的操作。


    流：字节序列的抽象概念。

    流提供了一种用统一的方法从各种I/O设备中读取和向其中写入字节序列的方法。

    文件是数据的静态存储形式。

    流是指数据传输时的形态。'
