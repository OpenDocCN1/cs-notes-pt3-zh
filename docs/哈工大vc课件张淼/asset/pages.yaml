- pgno: 294
  md: '# 变量的三种生存期


    静态数据区用于全局变量、 **static** 存储类的局部变量。


    代码区用于存放程序的指令，对 **C++** 程序而言，代码区存放的是所有函数代码；


    栈区用于 **auto** 存储类的局部变量、函数的形式参数以及函数调用时的有关信息（如函数返回地址等）的内存分配；


    堆区用于动态变量的内存分配。


    |  |

    |---|---|

    | 静态数据区 |

    | 代码区 |

    | 栈区 |

    | 堆区 |'
