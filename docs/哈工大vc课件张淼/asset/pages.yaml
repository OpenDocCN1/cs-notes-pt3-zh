- pgno: 562
  md: '# 继承方式


    +   - 单继承

    +     - 派生类只从一个基类派生。

    +   - 多继承

    +     - 派生类从多个基类派生。

    +   - 多重派生

    +     - 由一个基类派生出多个不同的派生类。

    +   - 多层派生

    +     - 派生类又作为基类，继续派生新的类。'
