  md: "# 5.2 模块化\n\n+   □ 回顾\n+   \n+   ■ 模块化是处理大而复杂问题的重要手段，同时也是保证软件质量的有力措施。\n+  \
    \ \n+   ■ 模块化能减低程序的复杂度，使得程序容易设计、理解与维护以及能够提高程序的正确性。\n+   \n+   ■ 在过程式程序设计中一个模块通常由一组相关的全局变量和全局函数的定义构成的。\n\
    +   \n+   ■ 相关：这些程序实体实现一个逻辑功能。"
  merge: -1
  img_proc: true
- pgno: 598
  md: '# 模块化


    一个模块一般包含两部分：接口和实现。接口给出在本模块中定义的、提供给其他模块使用的一些程序实体（如函数、全局变量等）的声明；模块的实现给出了模块中实体的定义。


    在 **C++** 中，一个模块通常由两个源文件构成，一个是 **.h** 文件，用于存放模块接口的定义；另一个是 **.cpp** 文件用于存放模块的实现。在一个模块中要用到另一个模块中定义的程序实体时，需要在前者的
    **.cpp** 文件中用文件包含命令把后者的 **.h** 文件包含进来。'
  merge: -1
  img_proc: true
