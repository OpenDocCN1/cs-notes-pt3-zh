- pgno: 332
  md: '# 函数重载


    重载函数的返回类型，即函数类型可以相同，也可以不同。如果仅仅是返回类型不同，而函数名相同、形参表也相同，则是非法的。


    ```

    例如： int fun(int a,int b);

    long fun(int a,int b);

    ```


    不合法的


    ```

    例如 int fun(int a,int b);

    int fun(int x,int y);

    ```


    说明：合法的。但不是重载。它只是对同一函数原型的多次声明。


    函数重载又称函数的多态性。它通过改变形参的个数或类型使多个函数共用一个函数名。'
  merge: -1
  img_proc: true
