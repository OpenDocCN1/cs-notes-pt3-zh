  md: '# 注意：


    ![](img/6d59ef6ebdae7180bd2f8d0def48533b_453_0.png)


    常见编程错误： 删除数组时，用delete代替 delete[] 将导致运行时的逻辑错误。为保证数组中的每个对象都接受一个析构函数调用，数组生成的内存空间要用delete[]运算符删除。类似地，总
    是使用delete运算符将分配给单个元素的内存空间删除。'
