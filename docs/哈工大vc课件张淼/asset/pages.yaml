  md: '| ios_base::internal | 0x0100 | 内部对齐，即符号在最左端，数值数据右对齐 |

    | ios_base::dec | 0x0200 | 整数按十进制输入/输出 |

    | ios_base::oct | 0x0400 | 整数按八进制输入/输出 |

    | ios_base::hex | 0x0800 | 整数按十六进制输入/输出 |

    | ios_base::scientific | 0x1000 | 按科学表示法（指数格式）显示浮点数 |

