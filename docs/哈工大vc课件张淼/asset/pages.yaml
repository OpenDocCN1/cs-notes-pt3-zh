- pgno: 1002
  md: '# 命令更新


    在后台所做的工作是：当要显示一个菜单时，操作系统发出 `WM_INITMENUPOPUP` 消息，然后由 MFC 的基类（如 `CFrameWnd`）接管，它创建一个
    `CCmdUI` 对象，并与第一个菜单项相关联，并调用 `CCmdUI` 对象的一个成员函数 `DoUpdate()`。这个函数发出 `CN_UPDATE_COMMAND_UI`
    消息，这条消息带有指向 `CCmdUI` 对象的指针。如果对这个菜单项捕获了 `CN_UPDATE_COMMAND_UI` 消息，便可以在这个消息的消息响应函数中进行菜单项显示的处理（如可用不可用等）。


    处理完第一个菜单项后同一个 `CCmdUI` 对象就设置为与第二个菜单项相关联，这样顺序进行，直到完成所有菜单项。'
  merge: -1
  img_proc: true
