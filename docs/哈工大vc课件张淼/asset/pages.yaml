  md: '# 成员初始化表（在定义构造函数时）


    成员初始化表中成员初始化的书写顺序并不决定它们的初始化顺序，数据成员的初始化顺序由它们在类定义中的说明顺序来决定。


    当类中有常量数据成员或引用数据成员时，如果类中定义了构造函数，则一定要在定义的所有构造函数的成员初始化表中对它们进行初始化，如果类中没有定义构造函数，则编译程序不会给该类生成一个默认构造函数。因此，这样的类程序是不能用于创建对象的。'
