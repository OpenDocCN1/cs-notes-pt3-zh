- pgno: 419
  md: '# 对象的创建和标识


    +   直接方式


    ```

    类名 对象名;

    ```


    今后，在定义变量时，如果变量的类型为类，则称该变量为对象，用变量名来标识相应的对象。所有在函数外定义的对象称为全局对象。在函数（或复合语句）内定义的对象称为局部对象。关于全局对象和局部对象的生存期和对象标识符的作用域的规定和普通变量相同。成员对象将随着包含它的对象的创建而创建，随其消亡而消亡。成员对象标识符的作用域为它所在的类。'
