- pgno: 974
  md: '# 消息映射原理


    +   - 消息映射表

    +     - 消息映射表定义

    +       - 在每个能处理消息的类（CCmdTarget及其子类）中定义的

    +         消息和消息处理函数的静态对照表

    +     - 工作原理

    +       - 在有消息需要处理时，类搜索自己的消息映射表，查看是否定义了该消息，有则调用对应的处理函数'
  merge: -1
  img_proc: true
- pgno: 975
  md: "# MFC消息映射表\n\n| 消息类型 | 菜单或控件ID | 消息处理函数 |\n|---|---|---|\n| WM_COMMAND | ID_FILE_TEST\
    \ | OnFileTest |\n| … | … | … |\n\n# 传统的switch-case结构\n\n```\nswitch (message)\n\
    {\ncase WM_COMMAND:\n    // Parse the menu selections:\n        break;\n//...\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 976
  md: "# # 消息映射原理\n\n# □ 消息映射表的实现方式\n\n+   - MFC通过宏定义实现在类的静态消息映射表\n\n+   - 在类的定义文件中加入(声明消息映射)\n\
    \n```\nDECLARE_MESSAGE_MAP()\n```\n\n+   - 在类的实现文件中加入(表和表项的定义)\n\n```\nBEGIN_MESSAGE_MAP(theClass,\
    \ baseClass)\n    ......              // 当前类，当前类的父类\n    //\nEND_MESSAGE_MAP()\n\
    ```"
  merge: -1
  img_proc: true
