- pgno: 910
  md: '# 8.3 用类的对象传递异常


    +   - throw语句所传递的异常，可以是各种类型的：整型、实型、字符型、指针，等等。也可以用类对象来传递异常。


    +   - 对象就是既有数据属性，也有行为属性。使用对象来传递异常，就是既可以传递和异常有关的数据属性，也可以传递和处理异常有关的行为或者方法。


    +   - 专门用来传递异常的类称为异常类。异常类可以是用户自定义的，也可以是系统提供的 exception类。'
  merge: -1
