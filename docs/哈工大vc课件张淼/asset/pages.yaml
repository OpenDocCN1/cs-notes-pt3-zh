- pgno: 849
  md: '# 键盘输入




    在输入时，各个数据之间用空白符分开，一般常用空格符、也可用tab键（水平制表符）或换行符。因此，从键盘输入字符时，空白符只用于输入字符的分隔符，而本身不作为从输入流中提取的字符。


    提取符可以从输入流中读取一个字符序列，即一个字符串。在处理这种字符序列时，字符串被认为是一个以空白符结束的字符序列。在从输入流中，每读取一个字符串，系统自动加上‘\0’字符。'
  merge: -1
  img_proc: true
