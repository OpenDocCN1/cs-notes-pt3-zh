  md: '# 模板


    +   □ 模板的含义

    +     ■ 以所处理的数据类型的说明作为参数的函数和类，分别称为函数模板和类模板

    +     ■ 一个模板并非一个实实在在的类或函数，仅仅是一个类或函数的描述

