- pgno: 43
  md: '# Windows API


    操作系统所能够完成的每一个特殊功能通常都有一个函数与其对应，也就是说，操作系统把它所能够完成的功能以函数的形式提供给应用程序使用，应用程序对这些函数的调用就叫做系统调用（System
    call），这些函数的集合就是Windows操作系统提供给应用程序编程的接口(Application Programming Interface),简称Windows
    API。'
  merge: -1
  img_proc: true
