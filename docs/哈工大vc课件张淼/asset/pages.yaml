- pgno: 729
  md: '# 规则和限制（续）


    +   - 经重载的运算符，其操作数中至少应该有一个是自定义类型。

    +   - 在重载运算符()、[]、->或者=时，运算符重载函数必须声明为类的一个成员。对于其他的运算符，运算符重载函数可以是成员函数或者友元函数。

    +   - 但在某些情况下，操作符必须以全局函数来重载，才能满足使用上的要求。'
