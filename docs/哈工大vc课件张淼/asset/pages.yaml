- pgno: 451
  md: '# # 析构函数


    # ## 什么是析构函数


    +   - 在对象将毁灭但未毁灭之前一刻，最后执行（并且是自动执行）的函数。

    +   - 析构函数是“反向”的构造函数，析构函数不允许有返回值，更重要的是析构函数不允许带参数，并且一个类中只能有一个析构函数。

    +   - 析构函数的作用正好与构造函数相反，对象超出其作用范围，对应的内存空间被系统收回或被程序用 `delete` 删除时，析构函数被调用。'
  merge: -1
  img_proc: true
