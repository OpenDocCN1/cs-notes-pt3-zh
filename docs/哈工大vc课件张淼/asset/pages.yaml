  md: '# MFC对象和Windows对象


    所谓**MFC Object (MFC对象)**是C++对象，是一个C++类的实例，这里MFC Object是有特定含义的，指封装Windows Object的C++
    Object，并非指任意的C++ Object。**MFC Object 和Windows Object**是不一样的，但两者紧密联系。'
