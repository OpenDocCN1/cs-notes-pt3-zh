  md: '# 对象指针


    +   和基本数据类型的变量一样，每一个对象在初始化之后会在内存中占据一定空间。对象所占据的内存空间只是用于存放数据成员，函数并不在每个对象中都存储副本。


    +   对象指针就是用于存放对象地址的变量。对象指针遵循一般变量指针的各种规则。

    +   类名 *对象指针名;


    ```

    Point *p_Point;

    Point p1;

    p_Point=&p1;

    ```'
