- pgno: 313
  md: '# 函数作用域与局部作用域的区别


    +   - 函数作用域包括整个函数，而局部作用域是从定义点开始到函数定义或复合语句结束。

    +   - 在函数体中一个语句标号只能定义一次，即使在内层的复合语句中，也不能再定义与外层相同的语句标号。

    +   - C++把语句标号作为一种特殊的标识符看待，它与其他种类的标识符属于不同的范畴，因此，语句标号的作用域可以和同名的其它标识符的作用域重叠。'
  merge: -1
