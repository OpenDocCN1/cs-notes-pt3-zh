  md: '# 拷贝构造函数


    □ 什么是拷贝构造函数


    +   ■ 拷贝构造函数是一种特殊的构造函数， 它的功能是用一个已知的对象来初始化一个被创建的同类对象。


    +   ■ 拷贝构造函数实际上也是构造函数，具有一般构造函数的所有特性，它是在初始化时被调用来将一个已知对象的数据成员的值逐值拷贝给正在创建一个的同类对象。


    +   ■ 默认情况下系统自动创建拷贝构造函数'
