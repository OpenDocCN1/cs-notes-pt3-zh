- pgno: 559
  md: '# 类的继承与派生


    +   - 保持已有类的特性而构造新类的过程称为继承。

    +   - 在已有类的基础上新增自己的特性而产生新类的过程称为派生。

    +   - 被继承的已有类称为基类（或父类）。

    +   - 派生出的新类称为派生类。'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# 继承与派生的目的


    +   - 继承的目的：实现代码重用。

    +   - 派生的目的：当新的问题出现，原有程序无法解决（或不能完全解决）时，需要对原有程序进行改造。'
  merge: -1
