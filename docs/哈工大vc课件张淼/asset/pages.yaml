- pgno: 68
  md: '# 函数调用约定


    函数调用是通过堆栈来实现的。在调用时，将参数值和调用后的返回地址压入所分配的堆栈空间中。函数计算结束以后，或者调用者、或者函数本身修改堆栈，使堆栈恢复原装。在参数传递中，有两个很重要的问题必须得到明确说明：


    +   当参数个数多于一个时，按照什么顺序把参数压入堆栈


    +   函数调用后，由谁来把堆栈恢复原装（堆栈清除）'
  merge: -1
  img_proc: true
