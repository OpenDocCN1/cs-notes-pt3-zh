- pgno: 486
  md: '# 思考


    程序运行的某个时刻，一个对象的所有数据成员的值反映了这个对象在该时刻的状态。在不同时刻，对象的状态可能是不同的，对象状态的改变往往是由于对象处理了一条消息（某个成员函数被调用）。但是并不是每条消息都会导致对象状态的变化。有些消息只是获取对象在某时刻的状态。'
