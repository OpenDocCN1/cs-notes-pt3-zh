- pgno: 173
  md: '# “面向对象” 程序设计的特点


    # 继承与派生


    面向对象程序设计提供了类似的机制：


    当定义了一个类后，又需定义一个新类，这个新类与原来的类相比，只是增加或修改了部分属性和操作，这时可以用原来的类派生出新类，新类中只需描述自己所特有的属性和操作。


    新类称为子类或派生类，原来的类称为基类。派生可以一直进行下去，形成一个派生树。'
  merge: -1
  img_proc: true
