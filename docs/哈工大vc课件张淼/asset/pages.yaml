  md: '# 成员的访问控制：信息隐藏


    +   □ 在C++定义中，可以用访问控制修饰符 public、private或protected来描述对类成员的访问限制。


    +   ■ public: public成员的访问不受限制，在程序中的任何地方都可以访问一个类的public成员。


    +   ■ private: private成员只能在本类（本类的成员函数）和友元中访问。


    +   ■ protected: protected成员只能在本类、派生类和友元中访问。'
  merge: -1
