- pgno: 957
  md: '# MFC对象和Windows对象


    一个MFC窗口对象是一个C++ CWnd类（或派生类）的实例，是程序直接创建的。在程序执行中它随着窗口类构造函数的调用而生成，随着析构函数的调用而消失。


    而Windows窗口则是Windows系统的一个内部数据结构的实例，由一个“窗口句柄”标识，Windows系统创建它并给它分配系统资源。'
  merge: -1
  img_proc: true
- pgno: 958
  md: '# MFC对象和Windows对象


