- pgno: 252
  md: '# 函数的调用


    +   - 函数调用过程的三个步骤

    +   - 调用参数和返回地址（当前EIP）压栈，当前EBP压栈

    +   - 跳转到函数入口，开始执行被调函数

    +   - 恢复调用者原有栈，并跳到堆栈中保存的返回地址


    # Windows系统的栈


    低地址方向

    其他数据，例如被调函数的局部变量

    EBP

    EIP

    被调函数参数

    其他数据，例如上层函数的局部变量

    SHE指针

    高地址方向'
