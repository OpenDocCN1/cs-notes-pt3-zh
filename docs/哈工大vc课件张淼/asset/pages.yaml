- pgno: 288
  md: '# 变量的三种生存期


    +   - **静态**


    内存空间从程序开始执行就进行分配，直到程序结束才收回。**全局变量具有静态生存期。**


    +   - **自动**


    内存空间在程序执行到它们所在的复合语句（函数）时才分配，当定义它们的复合语句执行结束时，它们的空间将会收回。局部变量和函数的参数一般具有自动生存期。


    +   - **动态**


    内存空间用new操作分配、用delete操作收回。'
  merge: -1
  img_proc: true
