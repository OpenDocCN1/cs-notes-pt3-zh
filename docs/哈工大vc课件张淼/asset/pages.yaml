  md: '# RTTI（运行时类型识别）


    通过使用RTTI，程序可以在运行时通过基类的指针或者引用来得到所指对象的实际类型。主要有两个操作：


    +   - **typeid操作符：** 返回指针或者引用所指对象的实际类型。\n- **dynamic_cast操作符：** 将基类类型的指针或引用安全地转换为派生类型的指针或者引用。\n-
    **注意：** 只有当类中至少有一个虚函数时，才能返回我们所需的动态类型信息；否则，只能返回静态类型信息。'
