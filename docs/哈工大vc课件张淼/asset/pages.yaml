  md: '# 6.3 类属（泛型）机制——模板


    无性繁殖并不只是在遗传工程上，对程序员而言它也是一个由来已久的操作。过去，我们只不过是以一个简单而基本的工具，也就是文字编辑器，重制我们的代码。今天 C++提供给我们一个更好的繁殖方法：
    template


    在程序设计中经常需要用到这样的一些程序实体：这些程序实体所完成的功能完全相同，但它们所操作的数据类型不同。'
