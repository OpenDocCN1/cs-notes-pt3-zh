- pgno: 991
  md: '# 9.3 MFC编程—对话框


    +   - 对话框有两种类型：模态对话框和非模态对话框。

    +   - 模态对话框在应用程序能够继续执行之前必须被关闭掉。即当我们显示一个模态对话框时应用程序就会暂停，直到我们关闭对话框我们才能继续执行程序中的其他任务。

    +   - 非模态对话框允许我们在显示对话框时转而执行程序的其他任务而不用关闭对话框。'
  merge: -1
  img_proc: true
