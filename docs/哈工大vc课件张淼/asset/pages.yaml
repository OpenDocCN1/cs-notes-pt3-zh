- pgno: 667
  md: '# 6.1 多态与虚函数


    赋值兼容规则（子类型）：需要基类对象的任何地方都可以使用公有派生类的对象来替代。


    替代包括：


    +   - 派生类的对象可以赋值给基类对象。

    +   - 派生类的对象可以初始化基类的引用。

    +   - 派生类的地址可以赋给指向基类的指针。'
