- pgno: 12
  md: '# Windows应用程序


    Microsoft Windows是一种基于图形用户界面的多任务操作系统。系统中可以同时运行多个应用程序。每个Windows应用程序通过各自的“窗口”与用户进行交互。


    +   - 应用的用户界面

    +     - 单文档用户界面

    +     - 多文档

    +     - 对话框

    +   - 消息驱动的程序结构'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Windows应用程序


    +   - 事件驱动程序与过程驱动程序

    +   - DOS过程驱动程序是顺序的、关联的，程序直接控制程序事件和过程顺序，以某种不可改变的顺序进行工作，交互性差。

    +   - Windows事件驱动程序由事件发生来控制逻辑，事件的发生是随机的不确定的。'
  merge: -1
