- pgno: 916
  md: '# 异常处理中的退栈和对象析构


    +   - 在函数调用时，函数中定义的自动变量将在堆栈中存放。结束函数调用时，这些自动变量就会从堆栈中弹出，不再占用堆栈的空间，这个过程有时被称为“退栈”（Stack
    unwinding）。其他的结束动作还包括调用析构函数，释放函数中定义的对象。


    +   - 但是，如果函数执行时出现异常，并且只是采用简单的显示异常信息，然后退出（exit）程序的做法，则程序的执行就会突然中断，结束函数调用时必须完成的退栈和对象释放的操作也不会进行。这样的结果是很不希望的。'
  merge: -1
  img_proc: true
