- pgno: 671
  md: '# 静态联编和动态联编


    +   - 联编：将一个函数的调用与相应的函数体的代码相连接称为函数联编。

    +   - 静态联编：在编译根据 `CShape* pShape[6]` 的静态类型来决定 `pShape[i]->display()` 属于哪一个类。由于
    `pShape[i]` 的静态类型是 `CShape*`，所以确定 `display()` 是 `CShape::display`。

    +   - 动态联编：在运行时，根据 `pShape[i]` 实际指向的对象类型来确定 `display()` 属于哪一个类。C++规定动态联编是在虚函数的支持下实现的。'
  merge: -1
  img_proc: true
- pgno: 672
  md: '# 虚函数


    +   □ 使用虚函数的注意事项

    +   - 只有类的成员函数才能说明为虚函数

    +   - 静态成员函数不能是虚函数

    +   - 内联(inline)函数不能是虚函数

    +   - 构造函数不能是虚函数

    +   - 析构函数可以是虚函数,而且通常声明为虚函数


    参见工程0106'
  merge: -1
  img_proc: true
- pgno: 673
  md: '# 虚析构函数


    +   □ 如果用动态创建的派生类对象的地址初始化基类的指针，创建的过程不会有问题：仍然是先调用基类构造函数，再执行派生类构造函数。


    +   □ 但是，在用delete运算符删除这个指针的时候，由于指针是指向基类的，通过静态联编，只会调用基类的析构函数。'
  merge: -1
  img_proc: true
- pgno: 674
  md: '# 虚析构函数


    +   - 为了解决派生类对象释放不彻底的问题，必须将基类的析构函数定义为虚析构函数。格式是在析构函数的名称前添加virtual关键字。函数原型如下：

    +     `virtual ~CShape();`

    +   - 此时，无论派生类析构函数是不是用virtual来说明，也都是虚析构函数。

    +   - 再用delete shape来释放基类指针时，就<|message|>会通过动态联编调用派生类的析构函数。


    ```

    virtual ~CShape();

    ```'
  merge: -1
  img_proc: true
