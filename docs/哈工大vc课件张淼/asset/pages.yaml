- pgno: 57
  md: '# 消息结构体


    对于 MSG 这个结构体来说，它里面包含的信息是相当丰富的，它包含了对于一个消息来说，它和哪一个窗口相关，这个消息本身是什么，这个消息的附加参数是什么，消息发生投递的时间是什么。我们拿到这样一个消息就像当全面了。那么我们就知道应该做什么样的处理。'
  merge: -1
