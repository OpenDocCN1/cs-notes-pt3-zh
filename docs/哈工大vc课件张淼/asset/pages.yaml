- pgno: 46
  md: '# 消息响应


    操作系统能够感知输入设备的变化（事件），并且能够知道具体的事件情况，但操作系统并不决定对这一事件如何作出反应，而是将这一事件转交给应用程序，由应用程序决定如何对这一事件作出反应。对事件作出反应的过程就是消息响应。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 消息


    操作系统是怎样将感知到的事件传递给应用程序的呢？这是通过消息机制(Message)来实现的。操作系统将每个事件都包装成一个称为消息的结构体MSG来传递给应用程序。'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# 消息结构体\n\nMSG结构定义如下：\n\n```\ntypedef struct tagMSG{\n  HWND hwnd;        \
    \  //窗口句柄\n  UINT message;       //主消息\n  WPARAM wParam;      //附加消息\n  LPARAM\
    \ lParam;\n  DWORD time;         //送至队列的时间\n  POINT pt;           //消息发送时屏幕光标的位置\n\
    } MSG, *PMSG;\n```"
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 从变量的类型区分变量的用途


    ```

    int x,y;

    x=50;

    y=30;

    //x和y既可以用来表示坐标点，也可以用来表示宽度和高度，还可以用来表示身高和体重等等。

    ```


    ```

    typedef int WIDTH

    typedef int HEIGHT

    WIDTH x;

    HEIGHT y;

    //好处：我们从变量的类型上就可以知道x和y是用来表示宽度和高度。

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# 消息结构体\n\nMSG结构定义如下：\n\n```\ntypedef struct tagMSG{\n    HWND hwnd;      \
    \    // 窗口句柄\n    UINT message;       // 主消息\n    WPARAM wParam;      // 附加消息\n\
    \    LPARAM lParam;\n    DWORD time;         // 送至队列的时间\n    POINT pt;       \
    \    // 消息发送时屏幕光标的位置\n} MSG, *PMSG;\n```"
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Windows对象


    +   - **Windows窗口**是Windows系统的一个内部数据结构的实例，由一个“**窗口句柄**”标识，Windows系统创建它并给它分配系统资源。

    +   - **Windows Object**是Windows系统的内部结构，是Windows的规范部件，包括各种窗口、菜单、按钮、对话框以及程序模块等，通过一个**句柄**来引用。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 句柄（Handle）


    +   - 句柄（HANDLE），Windows用来标识被应用程序建立或使用的Windows对象的一个唯一的整数值。

    +   - 操作系统要管理和操作这些Windows对象（资源），都是通过句柄来找到对应的对象。按Windows对象的类型，又可将句柄细分成图标句柄（HICON），光标句柄（HCURSOR），窗口句柄（HWND），应用程序实例句柄（HINSTANCE）等等各种类型的句柄。

    +   - 操作系统给每一个窗口指定的一个唯一的标识号（整数值）即窗口句柄。'
  merge: -1
  img_proc: true
- pgno: 53
  md: "# 消息结构体\n\n```\ntypedef struct tagMSG{\n    HWND hwnd;          //窗口句柄\n  \
    \  UINT message;       //主消息\n    WPARAM wParam;      //附加消息\n    LPARAM lParam;\n\
    \    DWORD time;         //送至队列的时间\n    POINT pt;           //消息发送时屏幕光标的位置\n}\
    \ MSG, *PMSG;\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 主消息


