  md: '# 规则和限制


    +   - 可以重载 C++ 中除下列运算符外的所有运算符：

    +     - `.`

    +     - `.*`

    +     - `::`

    +     - `?:`


    +   - 只能重载 C++ 语言中已有的运算符，不可膨胀新的。


    +   - 不改变原运算符的优先级和结合性。


    +   - 不能改变操作数个数。'
