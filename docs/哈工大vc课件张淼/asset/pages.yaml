  md: '# 基于资源的程序设计


    Windows程序分为“程序代码”和“用户接口（UI）资源”两大部分。程序代码使用编译器编译，用户接口资源使用资源编译器编译，最后两者使用连接器加上库文件可以生成可执行文件。'
  merge: -1
