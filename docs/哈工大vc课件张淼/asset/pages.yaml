- pgno: 962
  md: '# MFC对象和Windows对象


    3. 从创建上比较


    MFC Object通过构造函数由程序直接创建；

    Windows Object由相应的SDK函数创建。


    MFC中，使用这些MFC Object，一般分两步：首先，创建一个MFC Object，或者在STACK中创建，或者在HEAP中创建，这时，MFC Object的句柄实例变量为空，或者说不是一个有效的句柄。然后，调用MFC
    Object的成员函数创建相应的Windows Object，MFC的句柄变量存储一个有效句柄。'
  merge: -1
  img_proc: true
- pgno: 963
  md: '# MFC对象和Windows对象


    # 3.从创建上比较


    当然，可以在MFC Object的构造函数中创建相应的Windows对象，

    MFC的GDI类就是如此实现的，但从实质上讲，

    MFC Object的创建和

    Windows Object的创建是两回事。'
  merge: -1
  img_proc: true
- pgno: 964
  md: '# MFC对象和Windows对象


    # 4.从销毁上比较


    MFC Object随着析构函数的调用而消失；但 Windows Object必须由相应的Windows系统函数销毁。


    当然，可以在MFC Object的析构函数中完成 Windows Object的销毁，MFC Object的 GDI类等就是如此实现的，但是，应该看到：两者的销毁是不同的。'
  merge: -1
  img_proc: true
