  md: '# 继承方式的调整


    +   □ 在任何继承方式中，除了基类的 private 成员，都可以在派生类中分别调整其访问控制。


    调整时采用：


    ```

    ```text

    [public:|protected:|private:]

    <基类名>::<基类成员名>;

    ```

    ```'
