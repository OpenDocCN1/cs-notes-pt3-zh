  md: '# 派生类作用域


    +   - 派生类成员名的作用域嵌套在基类作用域中。对于基类的一个成员，如果派生类中没有定义与其同名的成员，则该成员名在派生类的作用域内可见。否则，该成员名在派生类的作用域内不可见，如果使用，必须用基类名受限。

    +   - 即使派生类定义了与基类同名但参数不同的成员函数，基类的同名函数在派生类的作用域也是不可见的。'
