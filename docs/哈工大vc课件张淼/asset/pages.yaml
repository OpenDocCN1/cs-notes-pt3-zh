    +   - 为了使C++具有更好的可移植性，美国国家标准局（American National Standards Institute，ANSI）于1990年设立了ANSI
    X3J16委员会专门负责制定C++标准。

    +   - 不久，国际标准化组织ISO也成立了自己的委员会，负责制定C++标准。

    +   - 同年，ANSI和ISO将两个委员会合并，共同合作进行C++标准化工作，委员会称ANSI/ISO。'
