  md: '# 消息的分类


    标准消息


    除WM_COMMAND之外，所有以WM_开头的信息。从CWnd派生的类，都可以接收到这类消息。


    命令消息


    来自菜单、加速键或工具栏按钮的消息。这类消息都以WM_COMMAND呈现。在MFC中，通过菜单项的标识（ID）来区分不同的命令消息；在SDK中，通过消息的wParam参数识别。从CCmdTarget派生的类，都可以接收到这类消息。'
