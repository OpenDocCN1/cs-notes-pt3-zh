- pgno: 632
  md: '# 面向对象分析与设计


    面向对象分析的任务是采用面向对象方法，把问题域和系统的认识理解，正确地抽象为规范的对象（包括类，继承层次）和消息连接关系，形成面向对象模型，为后续的 OOD和OOP提供指导。


    设计是在分析的基础上进一步加工，OOD阶段是对OOA模型的修改和补充，采用一致的概念、原则和表示法，二者没有严格的阶段划分，但设计阶段侧重于考虑与实现有关的细节。'
  merge: -1
