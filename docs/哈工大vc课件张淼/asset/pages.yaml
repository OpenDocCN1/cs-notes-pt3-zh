  md: '# 成员的访问控制


    +   在类定义中可以有多个public、private和protected访问控制说明，它们出现的先后顺序无关。C++的默认访问控制是private。


    良好编程习惯：为了保证程序的清晰性和可读性，每个成员访问说明符在类定义中只能使用一次。请将public成员放在最前面，这样更便于查找。'
