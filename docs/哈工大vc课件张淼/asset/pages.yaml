- pgno: 634
  md: '# UML(Unified Modeling Language)


    +   - 于20世纪90年代中期在三位软件方法学家——Grady Booch,James Rumbaugh和Ivar Jacobson的原创指导下开发出来的。


    +   - 从1989年到1994年，面向对象建模语言的数量从不到10增加到50多种。各位语言的创造者极力推崇自己的语言，并不断地发展完善它。但由于各种建模语言所固有的差异和优缺点，使得使用者不知道该选用哪种语言。'
  merge: -1
  img_proc: true
- pgno: 635
  md: '# UML(Unified Modeling Language)


    +   □ 其中比较流行的有Booch, Rumbaugh(OMT), Jacobson(OOSE), Coad-Yourdon等方法。OMT擅长分析，Booch擅长设计，OOSE擅长业务建模。


    +   □ Rumbaugh于1994年加入Booch所在的Rational公司，他们一起研究一种统一的方法，一年后，Unified Method 0.8诞生，同年，Rational收购了Jacobson所在的Objectory
    AB公司。经过三人的共同努力，UML0.9和UML0.91于1996年相继面世。'
  merge: -1
  img_proc: true
- pgno: 636
  md: '# UML(Unified Modeling Language)


    +   - 此后UML的创始人Booch等邀请计算机软件工程界的著名人士和著名的企业如IBM, HP, DEC, Microsoft, Oracle等对UML进行评论，提出修改意见。

    +   - 1997年1月Rational公司向OMG递交了UML1.0标准文本。1997年11月OMG宣布接受UML，认定为标准的建模语言。UML目前还在不断发展和完善。'
  merge: -1
  img_proc: true
