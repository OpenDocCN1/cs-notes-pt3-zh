- pgno: 662
  md: '# 多态


    +   - 重载多态：通过调用相同名字的函数，表现出不同的行为。运算符重载也是一种重载多态。

    +   - 运行多态：通过基类的指针，调用不同派生类的同名函数，表现出不同的行为。许多面向对象程序设计的书籍中所说的多态性，就是这种多态。

    +   - 模板多态，也称为参数多态：通过一个模板，得到不同的函数或不同的类。这些函数或者类具有不同的特性和不同的行为。'
  merge: -1
