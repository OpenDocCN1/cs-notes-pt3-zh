    +   - bool bad()const: 如果进行了非法操作返回 true，否则返回 false； bad()为true时fail()必为true;


    +   - bool eof()const: 进行输入操作时，若到达流尾返回true，否则返回false，通常只用于输入流； eof()为true时fail()必为true;


