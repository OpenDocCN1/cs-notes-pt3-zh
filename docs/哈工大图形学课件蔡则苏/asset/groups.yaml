    +   - 多边形面的绘制（`GL_POLYGON`）\n\n## 多边形面的绘制\n\n+   - 多边形面的绘制规则\n+     - 所有多边形都必须是平面的。\n\
    +     - 多边形的边缘决不能相交，而且多边形必须\n       是凸的。\n+   - 解决：对于非凸多边形，可以把它分割成几\n     个凸多边形（通常是三角形），再将它绘制\n\
    \     出来。\n\n## 多边形面的绘制\n\n问题：轮廓图形状态会看到组成大表面的所有小三角形。处理OpenGL提供了一个特殊标记来处理这些边缘，称为边缘标记。\n\
    \n```\nglEdgeFlag (True)\n```\n\n```\nglEdgeFlag (False)\n```\n\n## 多边形面的属性\n\n\
    指定顶点时顺序和方向的组合称为“绕法”。绕法是任何多边形图元的的一个重要特性。一般默认情况下，OpenGL认为逆时针绕法的多边形是正对着的。\n\n```\n\
    glFrontFace(GL_CW);\n```\n\n## 多边形面的属性\n\n+   多边形面的颜色\n\nglShadeModel(GL_FLAT)\
    \ 用指定多边形最后一个顶点时的当前颜色作为填充多边形的纯色，唯一例外是GL_POLYGON图元，它采用的是第一个顶点的颜色。\n\nglShadeModel(GL_SMOOTH)\
    \ 从各个顶点给三角形投上光滑的阴影，为各个顶点指定的颜色之间进行插值。\n\n## 多边形面的属性\n\n+   □ 多边形面的显示模式\n\n```\n\
    glPolygonMode(GLenum face, GLenum mode);\n```\n\n+   ■ 参数face用于指定多边形的哪一个面受到模式改变的影响。\n\
    \n+   ■ 参数mode用于指定新的绘图模式。\n\n## 多边形面的属性\n\n# □ 多边形面的填充\n\n多边形既可以用纯色填充，也可以用\n32×32的模板位图来填充。\n\
