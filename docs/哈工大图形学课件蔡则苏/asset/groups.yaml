    ```

    <库前缀><根命令><可选的参数个数><可选的参数类型>

    ```


    例如函数glColor3f(...), gl表示这个函数来自库gl.h, color表示该函数用于颜色设定, 3f表示这个函数采用了三个浮点数参数。'
