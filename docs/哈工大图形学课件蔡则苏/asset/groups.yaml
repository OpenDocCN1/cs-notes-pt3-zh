    \n(a) 裁剪前\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_532_1.png)\n\n(b) Sutherland-Hodgeman\
    \ 算法的裁剪结果\n\n## Weiler-Atherton多边形裁剪\n\n假设按顺时针方向处理顶点，且将用户多边形定义为Ps，窗口矩形为Pw。算法从Ps的任一点出发，跟踪检测Ps的每一条边，当Ps与Pw相交时（实交点），按如下规则处理：\n\
    \n-   (1)若是由不可见侧进入可见侧，则输出可见直线段，转(3);\n\n## Weiler-Atherton多边形裁剪\n\n(2)若是是由可见侧进入不可见侧，则从当前交点开始，沿窗口边界顺时针检测Pw的边，即用窗口的有效边界去裁剪Ps的边，找到Ps与Pw最靠近当前交点的另一交点，输出可见直线段和由当前交点到另一交点之间窗口边界上的线段，然后返回处理的当前交点；\n\
