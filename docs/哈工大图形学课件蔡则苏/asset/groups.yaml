    ## 阴极射线管（CRT）


    ### 电子枪


    - 产生一个沿管轴（Z轴）方向前进的高速的细电子束轰击荧光屏。

    - 具有足够的电流强度。

    - 电流的大小和有无必须是可控的。

    - 具有很高的速度。

    - 在荧光屏上应能聚焦很小的光点，以保证显示器有足够的分辨率。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_81_0.png)


    （a）三极电子枪


    （b）四极电子枪


    图2.7 CRT电子枪的结构


    ### 偏转系统


    为了在荧光屏上显示图形及字符，必须用电子束偏转扫描来实现。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_82_0.png)


    图2.8 磁偏转


    ### 枕形失真的校正


    - 将产生偏转磁场的锯齿形电流预先产生一些失真；

    - 将偏转磁场做成略有不匀性，接近管轴中央处略强，周围略弱。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_84_0.png)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_84_1.png)


    图2.9 枕形失真与桶形失真


    ### 电偏转


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_85_0.png)


    灯丝


    阴极


    控制栅极


    加速极


    聚焦极


    加速极


    水平偏转板


    垂直偏转板


    荧光屏


    图2.10 电偏转


    ### 荧光屏（Phosphor Screen）


    荧光屏是用荧光粉涂敷在玻璃底壁上制成的，常用沉积法涂敷荧光粉。玻璃底壁要求无气泡，表面光学抛光。


    荧光粉的性能要求是：发光颜色满足标准白色、发光效率高、余辉时间合适以及寿命长等。余辉时间：从电子束停止轰击到发光亮度下降到初始值的1%所经历的时间。


    ## 彩色阴极射线管——荫罩式


    - 三基色原则

    - 主要结构：三色荧光屏、三支电子枪、荫罩板


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_87_0.png)


    图2.11 三色荧光屏


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_88_0.png)


    图2.12 三支电子枪


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_89_0.png)


    图2.13 荫罩


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_90_0.png)


    荫罩


    三色荧光屏


    图2.14 原理图


    - 为了避免混色，荧光点的面积比电子束截面要大些。

    - 只有15%左右的电子到达屏幕。

    - 荫罩吸收大量电子，容易发热变形。

    - 管子的亮度低，要提高管子的亮度，则需提高第二阳极的高压。


    ### 色纯、会聚和白平衡


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_91_0.png)


    图2.15 黑底荫罩管


    ## CRT图形显示器


    - 随机扫描的图形显示器

    - 直视存储管图形显示器

    - 光栅扫描的图形显示器


    ### 1) 随机扫描的图形显示器


    - 向量（vector）显示器、笔划（Stroke writing）显示器。

    - 随机扫描（random-scan）的图形显示器中电子束的定位和偏转具有随机性，即电子束的扫描轨迹随显示内容而变化，只在需要的地方扫描，而不必全屏扫描。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_94_0.png)


    图2.16 随机扫描图形显示器的工作原理


    ### 2) 直视存储管图形显示器


    直视存储管DVST（direct-view storage tube）（通过紧贴在屏幕荧光屏层后的电荷分布来存储图形信息），从表面上看直视存储管的特性极像一个有长余辉的荧光屏，一条线一旦画在屏幕上，在一小时之内都将是可见的。


    - 无需刷新；

    - 很复杂的图形都可以在极高的分辨率下无闪烁地显示；

    - 成本较低；


    缺点：


    - 不能显示彩色；

    - 不能局部修改；只能擦除整个屏幕。

    - 擦除和重画过程可能持续较长时间。


    ### 3) 光栅扫描图形显示器（最广泛使用）


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_99_0.png)


    图2.18 光栅扫描原理


    光栅扫描图形显示器（画点设备，需要使用反走样技术减轻锯齿问题）。


    - 被显示的线段、字符、图形及其背景色都按照像素一一存储在刷新缓冲存储器（refresh buffer）或称帧缓冲存储器（frame buffer）。

    - 该类存储器中保存的每单位信息对应屏幕上的一个点，该点称为像素（pixel或pel，是picture element的简写）。

    - 像素信息从应用程序转换并放入帧缓冲区的过程称之为扫描转换过程。系统在垂直回扫期间，把亮度信息放入帧缓存中。


    ## 平板显示器（flat-panel display）


    （CRT的笨重性、高电压和非数字化寻址）


    低电压、轻小型、数字化显示器件。


    平板显示器（flat-panel display）的分类：


    - 非发射显示器（non-emissive display）（如液晶显示器）

    - 发射显示器（emissive display）（如平板CRT、等离子体、薄片光电显示器、发光二极管等）


    - 液晶显示器

    - 等离子体显示板（Plasma Panel）

    - 薄片光电显示器（Thin-Film Electroluminescent Display）

    - 发光二极管（Light-Emitting Diode, LED）


    ### 液晶显示器——原理


    液晶分子（不仅具有液体的流动性，而且兼具晶体的各向异性）的排列在微弱的外部电场、磁场或者应力、温度变化等作用下非常容易改变。当液晶分子的某种排列状态在电场作用下变为另一种状态时，液晶的光学性质随之改变，这种产生光被电场调制的现象称为液晶的电光效应。


    液晶显示的机理是通过能阻塞或传递光的液晶材料，传递来自周围的或内部光源的偏振光。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_105_0.png)


    图2.20 液晶显示原理


    ### 液晶显示器——类型


    - NW（Normal White）型的LCD：在液晶面板不施加电压时，我们所看到的面板是透光的画面，也就是亮的画面。

    - NB（Normal Black）型的LCD：当对液晶面板不施加电压时，面板无法透光。


    背光板提供一个亮度高且分布均匀的光源。


    ### 液晶显示器——彩色


    - 液晶显示器利用在一侧的玻璃基板上加上一个彩色滤光片（CF，Color Filter）实现彩色。

    - 彩色滤光片上均匀分布着红、绿、蓝色小点，每个小点有各自不同的灰度，相邻的一组RGB小点构成一个基本的彩色显示单元，即一个像素。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_108_0.png)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_108_1.png)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_108_2.png)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_108_3.png)


    （条状排列适合桌面和便携式，马赛克或三角形适合电视机）


    像素由亮转暗并由暗转亮所需要的时间称为反应时间


    图2.21 彩色滤光片排列方式


    ### 液晶显示器——分类


    - 扭曲向列型（TN, Twisted Nematic）

    - 超扭曲向列型（STN, Super TN）

    - 双层超扭曲向列型（DSTN, Dual Scan TN）


    缺点：对比度、亮度较差、可视角度小、色彩欠丰富


    - 薄膜晶体管型（TFT, Thin Film Transistor）


    （每个像素位置放置一个薄膜晶体管，控制像素位置的电压，并阻止液晶单元慢性漏电）


    反应速度快、对比度好、亮度高、可视角度大、色彩丰富

