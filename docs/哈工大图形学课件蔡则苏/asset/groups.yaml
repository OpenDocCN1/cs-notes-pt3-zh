    - (1) 使任意方向轴的起点与坐标原点重合，此时进行平移变换。

    - (2) 使方向轴与某一坐标轴重合，此时需进行旋转变换，且旋转变换可能不止一次。

    - (3) 针对该坐标轴完成变换。

    - (4) 用逆旋转变换使方向轴回到其原始方向。

    - (5) 用逆平移变换使方向轴回到其原始位置。


