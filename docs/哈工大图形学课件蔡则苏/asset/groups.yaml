    # 打印机


    +   - 打印机是画点设备。

    +   - 击式打印机主要指针式打印机，它隔着色带将某种点阵图案压在纸上。

    +   - 非撞击式打印机包括激光打印机、喷墨打印机、热转印打印机、染料热升华打印机和静电打印机等。


