    \n- 二阶导数\n\n  \\(p''(0)=n(n-1)((P_2-P_1)-(P_1-P_0))\\)\n\n  \\(p''(1)=n(n-1)((P_{n-2}-P_{n-1})-(P_{n-1}-P_n))\\\
    )\n\n  Bezier曲线在起始点和终止点处的二阶导数分别取决于最开始和最后的三个控制点。\n\n  Bezier曲线在起始点和终止点处的r阶导数分别取决于起始点或终止点和它们的r个邻域的控制多边形顶点来决定。\n\
    \n- 对称性\n\n  保持控制多边形的顶点位置不变，仅仅把它们的顺序颠倒一下，将下标为k的控制点\\(P_k\\)改为下标为\\(n-k\\)的控制点\\\
    (P_{n-k}\\)时，曲线保持不变，只是走向相反而已。\n\n- 凸包性\n\n  \\(BEN_{k,n}(t)=\\dfrac{n!}{k!(n-k)!}t^{k}(1-t)^{n-k}\\\
    ge0\\)\n\n  \\(\\sum_{k=0}^{n}BEN_{k,n}(t)=\\sum_{k=0}^{n}\\dfrac{n!}{k!(n-k)!}t^{k}(1-t)^{n-k}=(1-t+t)^{n}\\\
    equiv1\\)\n\n  Bezier曲线各点均落在控制多边形各顶点构成的凸包之中。任一曲线位置\\(p(t)\\)仅是控制点位置的加权和。\n\n \
    \ Bezier曲线的凸包性保证了曲线随控制点平稳前进而不会振荡。\n\n- 几何不变性：曲线的形状仅与控制多边形各顶点的相对位置有关，而与坐标系的选择无关。\n\
    - 变差减少性\n- 控制顶点变化对曲线形状的影响\n\n## Bezier曲线的生成\n\n- 绘制一段Bezier曲线\n\n  \\(C_n^k=\\\
    dfrac{n!}{k!(n-k)!}=\\dfrac{n-k+1}{k}C_n^{k-1}\\quad(n\\ge k)\\)\n\n  \\(x(t)=\\\
    sum_{k=0}^{n}x_k BEN_{k,n}(t)\\)\n\n  \\(y(t)=\\sum_{k=0}^{n}y_k BEN_{k,n}(t)\\\
    quad t\\in[0,1]\\)\n\n  \\(z(t)=\\sum_{k=0}^{n}z_k BEN_{k,n}(t)\\)\n\n- 在两段三次Bezier曲线间得到G²连续性\n\
    \n  \\(p_2''(0)=\\beta\\cdot p_1''(1)\\)\n\n  \\((Q_0-2Q_1+Q_2)=\\beta\\cdot(P_1-2P_2+P_3)\\\
    )\n\n  ![](img/af544efef4a0944fe7b8b5fa26ed5707_724_0.png)\n\n  图8.7 两段三次Bezier曲线的连接\n\
    \n## Bezier曲面\n\n- 定义\n\n  \\(p(u,v)=\\sum_{i=0}^{m}\\sum_{j=0}^{n}P_{i,j}BEN_{i,m}(u)BEN_{j,n}(v),\\\
    quad(u,v)\\in[0,1]\\times[0,1]\\)\n\n  \\(BEN_{i,m}(u)\\)与\\(BEN_{j,n}(v)\\)是Bernstein基函数。\n\
    \n  ![](img/af544efef4a0944fe7b8b5fa26ed5707_726_0.png)\n\n  ![](img/af544efef4a0944fe7b8b5fa26ed5707_726_1.png)\n\
    \n### 双三次Bezier曲面(m=n=3)\n\n\\(p(u,v)=\\sum_{i=0}^{3}\\sum_{j=0}^{3}P_{i,j}BEN_{i,3}(u)BEN_{j,3}(v),\\\
    quad(u,v)\\in[0,1]\\times[0,1]\\)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_727_0.png)\n\
    \n图8.8 双三次Bezier曲面及其控制网格\n\n## Bezier曲面的性质\n\n- 控制网格的四个角点正好是Bezier曲面的四个角点。\n-\
    \ 控制网格最外一圈顶点定义Bezier曲面的四条边界，这四条边界均为Bezier曲线。\n- 几何不变性、对称性、凸包性等。\n\n## Bezier曲面的拼接\n\
    \n- 0阶连续性只要求在边界上匹配控制点；\n- 1阶连续性则要求在边界曲线上的任何一点，两个曲面片跨越边界的切线矢量应该共线，而且两切线矢量的长度之比为常数。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_731_0.png)\n\n图8.9 Bezier曲面片的拼接\n\n\
    ## 8.4 B样条曲线曲面\n\n- B样条曲线\n- B样条曲线的性质\n- B样条曲面\n\n### B样条曲线\n\n- Bezier曲线的不足\n\
    \  - 控制多边形的顶点个数决定了Bezier曲线的阶数，且当顶点个数较大时，控制多边形对曲线的控制将会减弱；\n  - 不能作局部修改，任何一个控制点位置的变化对整条曲线都有影响。\n\
    \n- 定义\n\n  \\(p(t)=\\sum_{k=0}^{n}P_k B_{k,m}(t)\\)\n\n- de Boor点\n- B样条控制多边形\n\
    - B样条基函数\n\n基函数递推定义：\n\n$$B_{k,1}(t)=\\begin{cases}1 & \\text{若 } t_k\\le t <\
    \ t_{k+1}\\\\0 & \\text{其他}\\end{cases}$$\n\n$$B_{k,m}(t)=\\dfrac{t-t_k}{t_{k+m-1}-t_k}B_{k,m-1}(t)+\\\
    dfrac{t_{k+m}-t}{t_{k+m}-t_{k+1}}B_{k+1,m-1}(t)$$\n\n- 参数说明：m是曲线的阶数，\\((m-1)\\\
    )为B样条曲线的次数，曲线在连接点处具有\\((m-2)\\)阶连续。\n\n当节点沿参数轴均匀等距分布，即 \\(t_{k+1}-t_k=\\text{常数}\\\
    ) 时，所生成的曲线称为均匀B样条曲线。\n\n均匀B样条的基函数呈周期性，即给定n和m，所有的基函数都具有相同的形状，每个后续基函数仅仅是前面基函数在新的位置上的重复：\n\
    \n$$B_{k,m}(t)=B_{k+1,m}(t+\\Delta t)=B_{k+2,m}(t+2\\Delta t)$$\n\n$$B_{k,m}(t)=B_{0,m}(t-k\\\
    Delta t)$$\n\n- 均匀二次（三阶）B样条曲线\n\n取 \\(n=3,m=3\\)，则 \\(n+m=6\\)，不妨设节点向量为 \\(T=(0,1,2,3,4,5,6)\\\
    )：\n\n$$B_{k,1}(t)=\\begin{cases}1 & k\\le t < k+1\\\\0 & \\text{其他}\\end{cases}$$\n\
    \n$$B_{k,m}(t)=\\dfrac{t-k}{m-1}B_{k,m-1}(t)+\\dfrac{k+m-t}{m-1}B_{k+1,m-1}(t)$$\n\
    \n于是：\n\n$$B_{0,3}(t)=\\begin{cases}\\dfrac{1}{2}t^2 & 0\\le t <1\\\\[4pt] \\\
    dfrac{1}{2}t(2-t)+\\dfrac{1}{2}(t-1)(3-t) & 1\\le t <2\\\\[4pt] \\dfrac{1}{2}(3-t)^2\
    \ & 2\\le t <3\\end{cases}$$\n\n$$B_{1,3}(t)=\\begin{cases}\\dfrac{1}{2}(t-1)^2\
    \ & 1\\le t <2\\\\[4pt] \\dfrac{1}{2}(t-1)(3-t)+\\dfrac{1}{2}(t-2)(4-t) & 2\\\
    le t <3\\\\[4pt] \\dfrac{1}{2}(4-t)^2 & 3\\le t <4\\end{cases}$$\n\n$$B_{2,3}(t)=\\\
    begin{cases}\\dfrac{1}{2}(t-2)^2 & 2\\le t <3\\\\[4pt] \\dfrac{1}{2}(t-2)(4-t)+\\\
    dfrac{1}{2}(t-3)(5-t) & 3\\le t <4\\\\[4pt] \\dfrac{1}{2}(5-t)^2 & 4\\le t <5\\\
    end{cases}$$\n\n$$B_{3,3}(t)=\\begin{cases}\\dfrac{1}{2}(t-3)^2 & 3\\le t <4\\\
    \\[4pt] \\dfrac{1}{2}(t-3)(5-t)+\\dfrac{1}{2}(t-4)(6-t) & 4\\le t <5\\\\[4pt]\
    \ \\dfrac{1}{2}(6-t)^2 & 5\\le t <6\\end{cases}$$\n"
