    \  sin(-45°)  0 ] [ S_x  0  0 ] [ cos45°  sin45°  0 ]\n    [ -sin(-45°) cos(-45°)\
    \ 0 ] [ 0  S_y  0 ] [ -sin45° cos45° 0 ]\n    [ 0        0        1 ] [ 0   0\
    \   1 ] [ 0      0      1 ]\n```\n\nP' = P · T\n\n## 坐标系之间的变换\n\n问题：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_484_0.png)\n\
    \n图6-12 坐标系间的变换\n\n分析：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_485_0.png)\n\
    \n图6-13 坐标系间的变换的原理\n\n可以分两步进行：\n\np (xp, yp)\n\np (xp, yp)\n\n(a) 将 x′ y′ 坐标系的原点平移到\
    \ xy 坐标系的原点\n\n(b) 将 x′ 轴旋转到 x 轴上\n\n图6-14 坐标系间的变换的步骤\n\n于是：\n\n$p' = \\begin{bmatrix}\
    \ x'_p & y'_p & 1 \\end{bmatrix} = \\begin{bmatrix} x_p & y_p & 1 \\end{bmatrix}\
    \ \\cdot T$\n$= p \\cdot T = p \\cdot T_t \\cdot T_R$\n\n$T = T_t \\cdot T_r =\
    \ \\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ -x_0 & -y_0 & 1 \\end{bmatrix}\
    \ \\cdot \\begin{bmatrix} \\cos\\theta & -\\sin\\theta & 0 \\\\ \\sin\\theta &\
    \ \\cos\\theta & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n\n## 光栅变换\n\n直接对帧缓存中像素点进行操作的变换称为光栅变换。\n\
