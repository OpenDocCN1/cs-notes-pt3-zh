  - '[PAGE 47]


    # 计算机动画的分类


    +   - 刚体动画（相对运动变化来实现—虚拟漫游）

    +   - 变形动画（一种形状或物体变成另一种形状或物体）

    +   - 基于物理的动画（满足物理规律的运动动画）

    +   - 粒子动画（大量粒子来模拟自然现象，如雨雪烟雾等）

    +   - 关节动画（建立计算机模型来模拟两足或四足动物的运动，关节很主要）

    +   - 行为动画（对物体的行为进行建模，如鸟群的运动）'
  - '[PAGE 48]


    # 计算机图形学的研究动态


    +   - **地理信息系统**（以图形符号化的方式表达特征和现象的关系，空间位置、属性特征、时域特征）


    地理信息系统（GIS，Geographic Information System）是一种用于采集、模拟、处理、检索、分析和表达地理空间数据的计算机信息系统，是社会经济与环境保护协同持续发展中，信息集成和分析的先进工具。'
  - '[PAGE 49]


    # 计算机图形成的研究动态


    +   □ 人机交互


    人机交互学（Human-Computer Interface）

    是一门关于设计、评估和执行交互式计算机系统以及研究由此而发生的相关现象的学科。它是伴随着计算机的出现而出现，伴随着计算机技术发展而发展的。'
  - '[PAGE 50]


    # 计算机图形学的研究动态


    +   - 真实感图形显示（综合利用数学、物理学、计算机科学和其他相关学科知识逼真地表示真实世界的图形显示技术）

    +     真实感图形的生成：

    +     - 场景造型→（点线面体的几何描述）

    +     - 取景变换→（三维到二维的投影变换）

    +     - 视域裁剪→（抽取有用信息）

    +     - 消除隐藏面→（场景消隐）

    +     - 可见面光亮度计算（颜色）'
  md: "\n## 计算机图形学的应用\n\n- 计算机辅助绘图\n- 图形、图表和模型图等的绘制；\n- 商务事务领域分析财政、数学和经济等方面数据。\n-\
    \ 科学计算可视化：有限元分析、分子模型构建、地震数据处理、大气科学、生物信息、生物化学等。\n\n## 计算机图形学的应用\n\n- 计算机辅助教学（CAI）\n\
    \n计算机图形显示与处理技术已广泛地应用于计算机辅助教学系统中，它可以使教学过程，特别是基础学科的教学过程形象、直观和生动。\n\n## 计算机图形学的应用\n\
    \n## 计算机艺术\n\n计算机图形技术已广泛应用于各种图案、花纹、工艺外形及传统的油画、中国国画和书法等艺术品的制作，为创作艺术和商品艺术提供了更为广阔的空间。\n\
    \n> “计算机艺术是科学与艺术相结合的一门新兴的交叉学科，是计算机应用的一个崭新、富有时代气息的领域。\n> 科学和艺术是不可分割的，就像一枚硬币的两面……”\
    \ \n> ——诺贝尔物理学奖 李政道\n\n## 计算机艺术——艺术领域\n\n- 含义很广\n- 以计算机为工具，可以完成多种艺术品的制作和设计，如绘画（平面图形）、雕塑（立体图形）、音乐、平面构成、空间结构，还有体操舞蹈设计等等。\n\
    - 其中，美术作品占比重最大\n- 因此，计算机艺术主要指计算机美术\n- 齐东旭\n- 计算机动画，分形艺术\n- 潘云鹤\n- 智能CAD，纺织CAD\n\
    \n## 计算机艺术——艺术领域\n\n- 计算机平面合成艺术（婚纱影楼，PS）\n\n- 计算机数字图像合成艺术（Computer Image Editing\
    \ and Montage Art）\n\n- 主要指利用电脑对扫描或数字相机导入的图像素材进行编辑和合成，以及进行后期特技处理所产生的新视觉作品\n\n\
    - 软件包括：Corel Painter 或 Adobe Photoshop 等。\n\n- 该类作品接近于传统摄影特技，并带有“蒙太奇艺术”的特点，许多合成图像带有荒诞、刺激、搞笑、离奇和超现实主义风格的效果。\n\
    \n- 优势为：易于掌握和普及、效果丰富、成本较低。\n\n- 广泛应用于影视后期和多媒体创作。和应用美术及广告设计的关系十分密切。\n\n## 非真实感绘制\n\
    \n## NPR Non-Photorealistic Rendering\n\n- 非真实感图形比真实感图形应用更广泛，如文学读物插图，其中儿童读物插图量最大；\n\
    - 用数字方法对传统绘画进行模拟以掌握其规律性的东西；\n- 传统动画都是非真实感的，现在需要用计算机技术再现它们\n\n## 钢笔画效果\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_34_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_34_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_34_2.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_34_3.png)\n\n钢笔素描产生于中世纪，从19世纪开始成为一门艺术，然而用计算机模拟钢笔绘画却是20世纪90年代的事情。\n\
    \n## 铅笔画效果\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_35_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_35_1.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_35_2.png)\n\nFigure 1: Illustrations\
    \ of the Cupid mesh.\n\n## 水彩画效果\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_37_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_37_1.png)\n\n## 手绘图像效果（古装美女）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_38_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_38_1.png)\n\n## 手绘图像效果（日本漫画）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_39_0.png)\n\
    \n## 计算机图形学的应用\n\n- 工业控制及交通（组态王等软件）\n- 在过程控制中，用户利用计算机图形处理和显示技术实现与其控制或管理对象间的相互作用；\n\
    - 用于石油化工、金属冶炼过程中的监视和控制；\n- 铁路系统和公路系统的管制与监视。\n\n## 计算机图形学的应用\n\n- 医疗卫生\n- 显示病历，显示各种药物的剂量、性能；\n\
    - 对某种病的治愈率作统计分析；\n- 医学图像处理技术；\n- 计算机辅助手术（Computer-Aided Surgery）。\n\n## 虚拟手术仿真\n\
    \n应用\n\n将医用CT扫描的数据转化为三维图像，并通过一定的技术生成在人体内漫游的图象，使得医生能够看到并准确地判别病人的体内的患处，然后通过碰撞检测一类的技术实现手术效果的反馈，帮助医生成功完成手术。\n\
    \n## 虚拟手术仿真\n\n台湾pcexpert公司研制的LSVR系统逼真地模拟了腹腔手术，进行过程教学、手术成果检验等（右图：内视鏡虛擬手術模擬及訓練系統)或稱為最小侵入性外科手術模擬系統）\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_44_0.png)\n\n## 计算机图形学的应用\n\n- 图形用户界面（GUI,\
    \ Graphical User Interface）\n\n典型的图形用户界面包含一个窗口管理程序、菜单显示和图符等。\n\n除此以外，计算机图形学在广告、教学、游戏以及商业等方面都有着很好的应用和发展前景。\n\
    \n## 计算机图形学的研究动态\n\n计算机动画：计算机动画是指用程序生成一系列的景物画面，其中当前帧画面是对前一帧画面的部分修改。通过足够快的速度显示这些帧已产生动态的效果\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_1.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_2.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_3.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_4.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_5.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_46_6.png)\n\n## 计算机动画的分类\n\n- 刚体动画（相对运动变化来实现—虚拟漫游）\n\
    - 变形动画（一种形状或物体变成另一种形状或物体）\n- 基于物理的动画（满足物理规律的运动动画）\n- 粒子动画（大量粒子来模拟自然现象，如雨雪烟雾等）\n\
    - 关节动画（建立计算机模型来模拟两足或四足动物的运动，关节很主要）\n- 行为动画（对物体的行为进行建模，如鸟群的运动）\n\n## 计算机图形学的研究动态\n\
    \n- **地理信息系统**（以图形符号化的方式表达特征和现象的关系，空间位置、属性特征、时域特征）\n\n地理信息系统（GIS，Geographic Information\
    \ System）是一种用于采集、模拟、处理、检索、分析和表达地理空间数据的计算机信息系统，是社会经济与环境保护协同持续发展中，信息集成和分析的先进工具。\n\
    \n## 计算机图形成的研究动态\n\n- 人机交互\n\n人机交互学（Human-Computer Interface）\n是一门关于设计、评估和执行交互式计算机系统以及研究由此而发生的相关现象的学科。它是伴随着计算机的出现而出现，伴随着计算机技术发展而发展的。\n\
    \n## 计算机图形学的研究动态\n\n- 真实感图形显示（综合利用数学、物理学、计算机科学和其他相关学科知识逼真地表示真实世界的图形显示技术）\n- 真实感图形的生成：\n\
    - 场景造型→（点线面体的几何描述）\n- 取景变换→（三维到二维的投影变换）\n- 视域裁剪→（抽取有用信息）\n- 消除隐藏面→（场景消隐）\n- 可见面光亮度计算（颜色）\n"
