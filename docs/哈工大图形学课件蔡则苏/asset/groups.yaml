    # 三维数字化仪


    工作原理


    +   - 电磁感应技术

    +   - 由一块数据板和一根触笔组成

    +   - 数据板中布满了金属栅格，当触笔在数据板上移动时，其正下方的金属栅格上就会产生相应的感应电流

    +   - 根据已产生电流的金属栅格的位置，就可以判断出触笔当前的几何位置

    +   - 许多数字化仪提供了多种压感电流，用不同的压力就会有不同的信息传向计算机


