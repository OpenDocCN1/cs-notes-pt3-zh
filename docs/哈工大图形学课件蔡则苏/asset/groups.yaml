    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_70_0.png)\n\n## 图形输入设备\n\n- 跟踪球（Trackball）和\n\
    - 空间球（Spaceball）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_71_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_71_1.png)\n\
    \n图2.4 跟踪球\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_71_2.png)\n\n图2.5 空间球\n\
    \n## 图形输入设备\n\n## 数据手套(Data Glove)\n\n是一种戴在手上的传感器，可以用来抓住“虚拟对象”，它由一系列检测手和手指运动的传感器构成，用来提供关于手的位置和方向的信息。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_72_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_72_1.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_72_2.png)\n\n图 2-23 与虚拟现实环境的交互(伊利诺大学国家超级计算机应用中心提供)\n\
    \n## 三维数字化仪\n\n工作原理\n\n- - 电磁感应技术\n- - 由一块数据板和一根触笔组成\n- - 数据板中布满了金属栅格，当触笔在数据板上移动时，其正下方的金属栅格上就会产生相应的感应电流\n\
    - - 根据已产生电流的金属栅格的位置，就可以判断出触笔当前的几何位置\n- - 许多数字化仪提供了多种压感电流，用不同的压力就会有不同的信息传向计算机\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_73_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_73_1.png)\n\
    \n## 图形输入设备\n\n- 图像扫描仪(Scaner)\n\n图像扫描仪可直接把图纸、图表、照片、广告画等输入到计算机中，在将它们传过一个光学扫描机构时，灰度或彩色等级被记录下来，并按图像方式进行存储。\n\
    \n## 图形输入设备 (7/13)\n\n## 扫描仪工作原理\n\n- - 用光源照射原稿\n- - 投射光线经过一组光学镜头射到CCD器件上，得到元件的颜色信息\n\
    - - 再经过模/数转换器，图象数据暂存器等\n- - 最终输入到计算机\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_75_0.png)\n\
    \n## 图形输入设备\n\n- - 声频输入系统\n- - 视频输入系统\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_76_0.png)\n\
    \n## 2.3 图形显示设备\n\n- - 阴极射线管\n- - 彩色阴极射线管\n- - CRT图形显示器\n- - 平板显示器\n- - 三维观察设备\n\
    \n## 阴极射线管（CRT）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_79_0.png)\n\n图2.6\
    \ CRT的结构\n"
  mdcn: "\n## 计算机图形学的研究动态\n\n虚拟现实（Virtual reality）\n\n由计算机生成的一个实时三维空间。用户在其间可以“自由”地运动，随意观察周围的景物，并可以通过一些特殊的设备与虚拟物体进行交互操作，使用户产生一种身临其境的感觉。\n\
    \n## 虚拟现实技术\n\n- 沉浸（Immersion）：全方位投入，使用户产生身临其境的感觉。\n- 交互（Interaction）：响应用户的各种输入手势、语言命令以及身体动作。\n\
    - 构想（Imagination）：生动形象地反映设计者的思想。\n\n## VIRTUAL REALITY TRIANGLE\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_53_0.png)\n\
    \n## 虚拟现实的关键技术\n\n- 能以实时的速度生成有逼真感的景物图形。\n- 能高精度的跟踪用户的头和手。\n- 头盔显示器能产生高分辨率图象和较大的视角。\n\
    - 能对用户的动作产生力反馈。\n\n## 三维输入设备\n\n虚拟现实技术演示\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_55_0.png)\n\
    \n## 计算机图形学的研究动态\n\n- □ 科学计算可视化\n\n运用计算机图形学和图像处理技术，将科学计算过程中及计算结果的数据转换为图形及图像在屏幕上显示出来并进行交互处理的理论、方法和技术。\n\
    \n- ▸ 科学计算结果数据的后处理\n- ▸ 科学计算结果数据的实时处理与显示\n- ▸ 科学计算结果数据的实时绘制及交互处理\n\n### 并行图形处理\n\
    \n- - 多计算机的并行图形处理\n- - 多图形显示子系统（显卡）实现并行计算\n- - 多GPU/VPU的并行处理\n\nSGI公司的InfiniteReality、HP公司的PixelFlow、斯坦福大学的WireGL（与Intel）、Chromium（与IBM）、浙江大学的AnyGL、MSPR等\n\
    \n## 第一章 绪论（课后习题）\n\n- 1、名词解释：图形、图像、点阵化、参数法\n- 2、什么是计算机图形学？分析计算机图形学、数字图像处理、模式识别和计算机视觉学科之间的关系\n\
    - 3、举例说明计算机图形学有哪些应用范围，解决的问题是什么？\n\n## 第二章 计算机图形系统及图形硬件\n\n- - 计算机图形系统概述(恰当的硬件、合适的软件、必需的数学方法、如何解决图形处理问题)\n\
    - - 图形输入设备\n- - 图形显示设备\n- - 显示子系统\n- - 图形硬拷贝设备\n- - OpenGL图形软件包\n\n## 2.1 计算机图形系统概述\n\
    \n计算机图形系统的功能\n\n- 1）计算功能：包括形体设计、分析的方法程序库和有关描述形体的图形数据库。数据库中应该有坐标的几何变换、曲线/曲面的生成、图形交点的计算以及性能检验等。\n\
    - 2）存储功能：在计算机的内/外存中存放各种图形数据以及图形数据之间的相互关系。\n- 3）交互功能：决定了用户通过图形显示器和图形输入设备进行人机通信的方式。\n\
    \n## 2.1 计算机图形系统概述\n\n计算机图形系统的功能\n\n- 4）输入功能：将设计过程中图形的形状、大小和颜色属性等必要的参数和命令输入到计算机中。\n\
    - 5）输出功能：用于长期保存计算结果或交互需要的图形信息。\n\n## 计算机图形系统的功能\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_62_0.png)\n\
    \n图2.1 计算机图形系统的功能\n\n## 2.1 计算机图形系统概述\n\n- - 计算机图形系统的结构\n- - 图形系统的结构有图形软件与图形硬件构成\n\
    \n## 计算机图形系统的结构\n\n图形系统\n图形软件\n图形硬件\n图形应用数据结构\n图形应用软件\n图形处理软件、图形生成软件、图形用户接口、图形辅助控制、图形工具软件\n\
    图形支撑软件\n图形计算机平台\n微型计算机\n工作站\n计算机网络\n中小型计算机\n图形设备\n图形输入设备\n图形输出设备\n图形显示设备\n图形数据文件\n\
    图形基元模型\n字模字体库\n图案模型\n几何描述数据\n\n图2.2 计算机图形系统的结构\n\n## 图形输入设备的发展\n\n- - 第一阶段：控制开关、穿孔纸等\n\
