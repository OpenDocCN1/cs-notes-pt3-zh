    - **有效边表（Active Edge Table，AET）**：把有效边按与扫描线交点 x 坐标递增的顺序存放在一个链表中，此链表称为有效边表。\n-\
    \ 有效边表的每个结点：\n\n`x   y_max   1/k   next`\n\n## 改进的有效边表算法——构造边表\n\n- 首先构造一个纵向链表，链表的长度为多边形所占有的最大扫描线数，链表的每个结点，称为一个桶，则对应多边形覆盖的每一条扫描线。\n\
