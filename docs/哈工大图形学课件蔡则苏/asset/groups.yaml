    - ■ 当设备被置成事件方式，程序和设备同时工作。\n\n## 3.3 交互式绘图技术\n\n- □ 基本交互绘图技术（回显、约束、网格、引力域、橡皮筋技术、草拟技术、拖动、旋转、形变等）\n\
    \n- □ 三维交互技术（三维图形数据的输入、三维定位、三维定向等）\n\n## 基本交互绘图技术\n\n- 回显\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_180_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_180_1.png)\n\n图2.5 回显\n\n## 基本交互绘图技术\n\
    \n- 约束（在图形绘制的过程中对图形的方向、对齐方式等进行规定和校准）\n\n- 网格（网格对齐）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_181_0.png)\n\
    \n图2.6 约束和网格\n\n## 基本交互绘制图技术\n\n□ 草拟技术（用来实现用户任意意图画图的要求）\n\n（基于距离采样和基于时间采样）\n\n\
    ![](img/af544efef4a0944fe7b8b5fa26ed5707_183_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_183_1.png)\n\
    \n图2.8 草拟技术\n\n## 基本交互绘图技术\n\n- • 拖动（将图形对象在空间的移动过程动态、连续地表示出来，直到满足要求为止）\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_184_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_184_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_184_2.png)\n\
    \n图2.9 拖动技术\n\n## 基本交互绘图技术\n\n- 旋转\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_185_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_185_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_185_2.png)\n\
    \n图2.10 旋转技术\n\n## 基本交互绘图技术\n\n- □ 形变\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_186_0.png)\n\
    \n图2.11 形变技术\n\n## 三维交互技术（无法区分深度值）\n\n- 三维图形数据的输入\n- 三维定位\n- 三维定向\n\n## 3.4 OpenGL实现橡胶筋技术\n\
    \n- 橡胶筋技术的实现方法（两种）\n\n利用颜色的异或操作，对原有图形并不是擦除，而是再绘制一条同样的直线段并与原图形进行异或操作，此时原图形会从屏幕上消失；\n\
    \n利用双缓存技术，绘制图形时分别绘制到两个缓存，交替显示。\n\n## OpenGL实现橡皮筋技术\n\n- 鼠标实现\n  - 鼠标响应函数\n   \
    \ glutMouseFunc\n  - 鼠标移动相应函数\n    glutMotionFunc\n    glutPassiveMotionFunc\n\
    \n## OpenGL实现橡皮筋技术\n\n- 键盘实现\n\n- 键盘相应函数\n\nglutKeyboardFunc\n\n## OpenGL实现拾取操作\n\
    \n- 名字堆栈操作\n  - 初始化名字堆栈（`glInitNames`）\n  - 将一个名字压入堆栈（`glPushName`）\n  - 替换名字堆栈的栈顶元素（`glLoadName`）\n\
    \  - 将栈顶元素弹出（`glPopName`）\n\n## OpenGL实现拾取操作\n\n- □ 设置合适的变换过程\n\n```\ngluPickMatrix(xPick,\
    \ yPick, widthPick, heightPick, *vp);\n```\n\n- □ 为每个图元分配名字并绘制\n\n- □ 切换回渲染模式\n\
    \n- □ 分析选择缓冲区中的数据\n\n## 3.6 OpenGL中的菜单功能\n\n- □ 菜单注册函数\n\n      glutCreateMenu(ProcessMenu);\n\
    \n- □ 在菜单中加入菜单项\n\n      void glutAddMenuEntry(char *name,\n      GLint value);\n\
    \n- □ 将菜单与某个鼠标按键关联\n\n      void glutAttachMenu(button);\n\n## 第四章 图形的表示与数据结构\n\
    \n- 如何在计算机中建立恰当的模型表示不同图形对象。\n\n- 如何组织图形对象的描述数据以使存储这些数据所要的空间最省，检索、处理这些数据的速度较快。\n\
    \n## 图形的表示与数据结构\n\n- 基本概念\n- 三维形体的表示\n- 非规则对象的表示\n- 层次建模\n\n## 4.1 基本概念\n\n- 造型技术\n\
    - 基本图形元素\n- 几何信息与拓扑信息\n- 坐标系\n- 实体的定义\n- 正则集合运算\n- 欧拉公式\n\n## 基本概念——造型技术\n\n把研究如何在计算机中建立恰当的模型表示不同图形对象的技术称为造型技术。\n\
    \n- 有两类图形对象：\n  \n  - 规则对象：几何造型、几何模型(几何信息和拓扑信息)。\n  \n  - 不规则对象：过程式模拟。\n\n## 基本概念——基本图形元素\n\
    \n- 基本图形元素：图素或图元、体素。\n- 图素是指可以用一定的几何参数和属性参数描述的最基本的图形输出元素（包括点、线、面、环、体等）。\n- 在二维图形系统中将基本图形元素称为图素或图元，在三维图形系统中称为体素。\n\
    \n- □ 1、点：为0维几何元素，是形体最基本的元素，自由曲线、曲面或其他形体均可用有序的点集来表示。点集及其连接关系的存储。\n- □ 2、线：一维几何元素，是两个邻面或多个邻面的交界\n\
    - □ 3、面：二维几何元素，是形体上一个有限、非零的区域，由一个外环和若干内环界定其范围。具有方向性，由其外法线矢量方向定义。\n- □ 4、环：有序、有向边组成的面的封闭边界。（外环中其边逆时针排序，内环顺时针排序）\n\
    - □ 5、体：三维几何元素，由封闭表面围成的空间。\n\n## 基本概念——几何信息与拓扑信息\n\n- □ 图形信息与非图形信息\n  - ■ 几何信息：形体在欧氏空间中的位置和大小。\n\
    \  - ■ 拓扑信息：形体各分量（点、边、面）的数目及其相互间的连接关系。\n\n面相邻性 f:{f}\n\n面-顶点包含性\n\n面-边包含性 f:{e}\n\
    \n顶点-面相邻性\n\n顶点相邻性\n\n顶点-边相邻性 v:{e}\n\n边-面相邻性 e:{f}\n\n边-顶点包含性 e:{v}\n\n边相邻性 e:{e:}\n\
    \n# 图4.1 拓扑信息\n\n## 基本概念——几何信息与拓扑信息\n\n- 刚体运动：不改变图形上任意两点间的距离，也不改变图形的几何性质的运动。\n\
    \n- 拓扑运动：允许形体作弹性运动，即在拓扑关系中，对图形可随意地伸张扭曲。但图上各个点仍为不同的点，决不允许把不同的点合并成一个点。\n"
