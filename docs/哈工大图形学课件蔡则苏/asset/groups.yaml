    # 变换的性质


    （平行线不变性和有限点数目不变性）


    二维仿射变换是具有如下形式的二维坐标变换：


    ```

    $$\begin{cases}x''=ax+by+m\\y''=cx+dy+n\end{cases}$$

    ```


    +   - 平移、比例、旋转、错切和反射等变换均是二维仿射变换的特例，反过来，任何常用的二维仿射变换总可以表示为这五种变换的复合。'
  - '[PAGE 493]


    # 变换的性质


    +   □ 仅包含旋转、平移和反射的仿射变换维持角度和长度的不变性；

    +   □ 比例变换可改变图形的大小和形状；

    +   □ 错切变换引起图形角度关系的改变，甚至导致图形发生畸变。

    +   ■ 直线的中点变换后仍然是直线的中点

    +   ■ 平行直线作相同变换后依然平行'
