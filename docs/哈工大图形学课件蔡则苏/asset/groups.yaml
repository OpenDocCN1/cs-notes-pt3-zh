    - 变形动画（一种形状或物体变成另一种形状或物体）\n- 基于物理的动画（满足物理规律的运动动画）\n- 粒子动画（大量粒子来模拟自然现象，如雨雪烟雾等）\n\
    - 关节动画（建立计算机模型来模拟两足或四足动物的运动，关节很主要）\n- 行为动画（对物体的行为进行建模，如鸟群的运动）\n\n## 计算机图形学的研究动态\n\
    \n- **地理信息系统**（以图形符号化的方式表达特征和现象的关系，空间位置、属性特征、时域特征）\n\n地理信息系统（GIS，Geographic Information\
    \ System）是一种用于采集、模拟、处理、检索、分析和表达地理空间数据的计算机信息系统，是社会经济与环境保护协同持续发展中，信息集成和分析的先进工具。\n\
    \n## 计算机图形成的研究动态\n\n- 人机交互\n\n人机交互学（Human-Computer Interface）\n是一门关于设计、评估和执行交互式计算机系统以及研究由此而发生的相关现象的学科。它是伴随着计算机的出现而出现，伴随着计算机技术发展而发展的。\n\
    \n## 计算机图形学的研究动态\n\n- 真实感图形显示（综合利用数学、物理学、计算机科学和其他相关学科知识逼真地表示真实世界的图形显示技术）\n- 真实感图形的生成：\n\
    - 场景造型→（点线面体的几何描述）\n- 取景变换→（三维到二维的投影变换）\n- 视域裁剪→（抽取有用信息）\n- 消除隐藏面→（场景消隐）\n- 可见面光亮度计算（颜色）\n"
