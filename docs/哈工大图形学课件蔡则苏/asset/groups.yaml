    \n## 形状语法\n\n- 形状语法（**shape grammars**）：给定一组产生式规则，形状设计者可以在从给定初始物体到最终物体结构的每一次变换中应用不同的规则。\n\
    - 产生式规则可以用具有图形运算能力的数学式或其他过程性方法结合实现。\n"
  mdcn: "\n## 数学的不规则图形\n\n实际上，在曼德尔勃朗时期问题提出之前，数学家就曾经构造过多种不规则的几何图形，他们具有和海岸线相似的性质。\n\n\
    ## Cantor集\n\nCantor在1883年构造了如下一类集合：取一段欧式长度为1的直线段，将该线段三等分，去掉中间的一段，剩下两段。再将剩下的两段分别三等分，各去掉中间的一段，剩下四段。将这个操作进行下去，直至无穷，可得到一个离散的点集，点数趋于无穷多，而长度趋于零。经无限次操作所得到的离散点集称为Cantor集。\n\
    \n### Koch雪花线\n\n- 瑞典数学家科赫（H.von Koch）在1904年提出了一种曲线，它的生成方法是把一条直线段分成三段，将中间的一段用夹角为60度的两条等长折线来代替，形成一个生成元，然后再把每个直线段用生成元进行代换，经无穷次迭代后就呈现出一条有无穷多弯曲的Koch曲线。\n\
    \n## Koch曲线\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_252_0.png)\n\n## Koch曲线的生成过程\n\
    —第0步、第1步\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_253_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_253_1.png)\n\
    \n## Koch曲线的生成过程\n—第2步、第3步\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_254_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_254_1.png)\n\n## 随机Koch曲线\n——对海岸线的模拟\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_256_0.png)\n\n## Koch曲线的一些基本性质\n\n\
    - Koch曲线具有与Cantor集，Sierpinski垫片类似的性质。\n- 长度等于无穷。\n\n## Sierpinski集\n\n首先，将一个等边三角形四等分，得到四个小等边三角形，去掉中间的一个，保留它的边。将剩下的三个小三角形再分别进行四等分，并分别去掉中间的一个，保留它的边。重复操作直至无穷，得到一个面积为零，线的欧式长度趋于无穷大的图形。这个图形被人们称为谢尔宾斯基垫。\n\
    \n## Sierpinsk垫片的生成过程\n—第0步、第1步\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_259_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_259_1.png)\n\n## Sierpinsk垫片的生成过程\n\
    —第2步、第3步\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_260_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_260_1.png)\n\
    \n## Sierpinsk垫片\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_261_0.png)\n\n##\
    \ Sierpinski地毯\n\n- 其次，将一个正方形九等分，去掉中间的一个，保留四条边，剩下八个小正方形。将这九个小正方形再分别进行九等分，各自去掉中间的一个保留它们的边。重复操作直至无穷。\n\
    \n### Sierpinski地毯\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_263_0.png)\n\n\
    ## Sierpinski海绵\n\n- □ 第三， 对一个正六面体，将它的每条边进行三等分，即对正六面体进行27等分，去掉体心和面心处的7个小正六面体，剩下20个小正六面体，并保留它们的表面，反复操作直无穷大，得到的图形。体积趋于零，而其表面的欧式面积趋于无穷大。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_265_0.png)\n\n## Sierpinski集的共同特点\n\
    \n- 它们都是经典几何无法描述的图形，是一种“只有皮没有肉”的几何集合。\n- 它们都具有无穷多个自相似的内部结构，任何一个分割后的图形放大后都是原来图形的翻版。\n\
    \n## 问题在哪里？\n\n- 以上是一些经典几何意义下的“病态”图形，以Koch曲线为例，以一维来度量它，它的长度趋于无穷，而以二维来度量它，它的面积为零，那么，它究竟是几维图形？1维？\
    \ 2维？ 1.?????维吗？\n- 经典的维度定义有问题吗？\n\n## 经典几何的维度定义\n\n- 在经典几何下，点被定义成0维的，点没有长度；直线被定义成1维，只有长度，没有面积，平面图形被定义成2维的，有面积，没有体积，立体图形是3维的，有体积。\n\
    - 经典几何讨论的维度都是整数，它们的数值与决定几何形状的变量个数及自由度是一致的，这是一个很自然的想法。\n\n## 换一个角度看维度\n\n根据相似性来看线段、正方形和立方体的维数。首先把线段、正方形和立方体的边两等分，这样，线段成为长度一半的两条线段，正方形变成边长为原来边长1/2的四个小正方形，而立方体而成为八个小立方体，边长为原来边长的1/2。原来的线段、正方形和立方体分别由2，4，8个把全体分成1/2的相似形组成。而2，4，8可改写成2的1，2，3次方，这里的1，2，3分别与其图形的经验维数相一致。\n\
    \n## 相似维度的定义\n\n- 一般地，如果某图形是由把全体缩小为1/a的a^D个相似图形构成的，那么此指数D就具有维度的意义。此维度被称为相似维度。\n\
    - 相似维数常用Ds表示，按照定义，Ds完全没有是整数的必要。如某图形是由全体缩小1/a的b个相似形组成，则\n\n```\nDs = (ln b) / (ln\
    \ a)\n```\n\n- □ 我们可以以此计算上述几种图形的相似维度。\n- □ **Koch曲线： (ln4)/(ln3)=1.2618**\n- □\
    \ **Cantor集： (ln2)/(ln3)=0.6309**\n- □ **Sierpinski集：**\n  - 绒垫： (ln3)/(ln2)=1.5850\n\
    \  - 地毯： (ln8)/(ln3)=1.8927\n  - 海绵： (ln20)/(ln3)=2.7268\n\n从以上图形的生成方式来看，大体上有两种方式：第一种是从初始图形E₀按一定原则往下“挖”，得到的新图形的维数小于E₀\
    \ 的欧式维数，常称为降维生成；第二种是在初始图形E₀的基础上增加一些线或面，得到的图形E的维数大于E0的欧式维数，这种生成方式常称为升维生成。\n\n-\
    \ 相似维数的定义具有很大的局限性，因为只用对具有严格的自相似性的分形，才能使用这个维数，定义适用于包括随机图形在内的任意的维数是很必要的。\n- 波恩大学数学家豪斯道夫1919年从测量的角度引入了Hausdorff维数。\n\
    \n## 分形的定义\n\n- 定义1. 如果一个集合在欧式空间中的 Hausdorff维数DH恒大于其拓扑维数DT，则称该集合为分形集，简称分形。\n-\
    \ 由Mandelbrot在1982年提出，四年后，他又提出了一个更是实用的定义：\n- 定义2. 组成部分以某种方式与整体相似的形体叫分形。\n\n###\
    \ 分形理论的应用\n\n- 生物学: 肺（人肺的分形维数为2.17; 血管（血管直径分布的分形维数约为2.3）, 人脑（人脑表面的皱纹的分形维数为2.73-2.79\
    \ ）; 蛋白质。\n- 地球物理学: 海岸线、河流的干流和支流分布 、地震研究。\n- 物理学和化学: 超导; 固体表面; 高分子。\n\n## □ 天文学,\
    \ 材料科学, 计算机构形学, 经济学, 语言学和情报学\n\n## 分形的自然观与世界观\n\n- 递归性，宇宙的创生，生命的生成，思维的生成。\n- 维数与空间，马赫多维原子理论，物理空间的变维性。\n\
    - 变维的中国文化根源。\n\n## 分形山\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_278_0.png)\n\
    \n## 分形树叶\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_279_0.png)\n\n## 分形树叶(续1)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_280_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_280_1.png)\n\
    \n## 形状语法\n\n- 形状语法（**shape grammars**）：给定一组产生式规则，形状设计者可以在从给定初始物体到最终物体结构的每一次变换中应用不同的规则。\n\
    - 产生式规则可以用具有图形运算能力的数学式或其他过程性方法结合实现。\n"
