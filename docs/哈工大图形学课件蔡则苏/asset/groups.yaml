    # Bezier曲线的性质


    端点

    p(0) = Σ_{k=0}^{n} P_k BEN_{k,n}(0)

    = P_0 BEN_{0,n}(0) + P_1 BEN_{1,n}(0) + ⋯ + P_n BEN_{n,n}(0)

    = P_0

    p(1) = Σ_{k=0}^{n} P_k BEN_{k,n}(1)

    = P_0 BEN_{0,n}(1) + P_1 BEN_{1,n}(1) + ⋯ + P_n BEN_{n,n}(1)

    = P_n'
  - '[PAGE 716]


    # # Bezier曲线的性质


    # 一阶导数


    $$BEN''_{k,n}(t)=\frac{n!}{k!(n-k)!}\left(k\cdot t^{k-1}(1-t)^{n-k}-(n-k)(1-t)^{n-k-1}\cdot
    t^k\right)$$


    $$=\frac{n(n-1)!}{(k-1)!((n-1)-(k-1))!}\cdot t^{k-1}\cdot(1-t)^{(n-1)-(k-1)}$$


    $$-\frac{n(n-1)!}{k!((n-1)-k)!}\cdot t^k\cdot(1-t)^{(n-1)-k}$$


    $$=n\left(BEN_{k-1,n-1}(t)-BEN_{k,n-1}(t)\right)$$'
