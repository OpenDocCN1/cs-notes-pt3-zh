    ## 5.1 直线的扫描转换


    ### 直线的绘制要求


    1. 直线要直；

    2. 直线的端点要准确，无定向性无断裂；

    3. 直线的亮度、色泽要均匀；

    4. 画线的速度要快；

    5. 具有不同的色泽、亮度、线型等。


    ## 直线的扫描转换


    - 解决的问题：给定直线两端点P₀(x₀,y₀)和P₁(x₁,y₁)，画出该直线。

    - 数值微分法

    - 中点Bresenham算法

    - 改进的Bresenham算法


    ## 数值微分法(DDA法)


    直线的微分方程：


    dy/dx = Δy/Δx = (y₁ - y₀)/(x₁ - x₀) = k


    x_{i+1} = x_i + ε·Δx


    y_{i+1} = y_i + ε·Δy


    ε = 1/max(|Δx|,|Δy|)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_298_0.png)


    ## max(|Δx|,|Δy|)=|Δx|，即|k|≤1的情况：


    x_{i+1} = x_i + ε·Δx = x_i + 1/|Δx|·Δx = x_i ±1


    y_{i+1} = y_i + ε·Δy = y_i + 1/|Δx|·Δy = y_i ±k


    ## max(|Δx|,|Δy|)=|Δy|，此时|k|≥1：


    x_{i+1} = x_i + ε·Δx = x_i + 1/|Δy|·Δx = x_i ± 1/k


    y_{i+1} = y_i + ε·Δy = y_i + 1/|Δy|·Δy = y_i ±1


    ## 数值微分法(ODA法)——特点


    - 增量算法

    - 直观、易实现

    - 不利于用硬件实现


    ## 中点Bresenham算法


    算法原理：根据直线的斜率确定或选择变量在x或y方向上每次递增一个单位，而另一方向的增量为1或0，它取决于实际直线与相邻象素点的距离，这一距离称为误差项。


    假设0≤k≤1,

    即0≤ Δy/Δ x ≤1，x是最大位移方向


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_303_0.png)


    图5.4 Bresenham算法生成直线的原理


    ## 判别式：


    d = F(x_M,y_M) = F(x_i +1,y_i +0.5) = y_i +0.5 -k(x_i +1)-b


    则有：


    - x_{i+1} = x_i +1

    - y_{i+1} = \begin{cases} y_i +1 (d<0) \\ y_i (d \ge 0) \end{cases}


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_304_0.png)


    ## d的意义：


    d = F(x_M, y_M) = F(x_i +1, y_i +0.5) = y_i +0.5 - k(x_i +1) - b


    d = F(x_M, y_M) - F(x_Q, y_Q)


    = y_M - k x_M - b - (y_Q - k x_Q - b)


    = y_M - y_Q


    - d > 0    y_M > y_Q

    - d < 0    y_M < y_Q

    - d = 0    y_M = y_Q


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_305_0.png)


    ## 误差项的递推 (d≥0)


    ```

    d₁ = F(x_i + 1, y_i + 0.5)

    = y_i + 0.5 - k(x_i + 1) - b

    d₂ = F(x_i + 2, y_i + 0.5)

    = y_i + 0.5 - k(x_i + 2) - b

    d₂ = y_i + 0.5 - k(x_i + 1) - b - k

    = d₁ - k

    ```


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_307_0.png)


    图5.8 误差项递推


    ## 中点Bresenham算法


    初始值d的计算


    d₀ = F(x₀ + 1, y₀ + 0.5)

    = y₀ + 0.5 − k(x₀ + 1) − b

    = y₀ − kx₀ − b − k + 0.5

    = 0.5 − k


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_308_0.png)


    图5.9 计算初值


    ## 中点Bresenham算法——改进


    改进：用2d△x代替d，令D=2d△x 则：

    D₀ = 2△x d₀ = 2△x(0.5 − k) = △x − 2△y

    d₀ < 0    D₀ < 0

    D₁ = 2△x d₁ = 2△x(d₀ + 1 − k)

    = 2△x d₀ + 2△x − 2△y

    = D₀ + 2△x − 2△y

    d₀ ≥ 0    D₀ ≥ 0

    D₁ = 2△x d₁ = 2△x(d₀ − k) = D₀ − 2△y

