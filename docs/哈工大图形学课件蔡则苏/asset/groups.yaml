    # 三次Hermite样条


    通常将T●Mₖ称为Hermite基函数（或称混合函数，调和函数）：

    H₀(t) = 2t³ − 3t² + 1

    H₁(t) = −2t³ + 3t²

    H₂(t) = t³ − 2t² + t

    H₃(t) = t³ − t²

    p(t) = Pₖ H₀(t) + Pₖ₊₁ H₁(t) + Rₖ H₂(t) + Rₖ₊₁ H₃(t)'
