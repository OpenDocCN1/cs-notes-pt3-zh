    # 二、研究内容


    +   - **造型技术:**

    +     - 在计算机中建立所要生成图像的物体的模型

    +     - 即给出表示该物体的几何数据和拓扑关系

    +   - **绘制技术:**

    +     - 按照给定的观察点及观察方向将物体模型在计算机屏幕上显示出来

    +   - **人机交互技术:**

    +     - 为造型和绘制这两个过程提供友好的人机界面'
  - '[PAGE 10]


    # 研究内容


    # 计算机对图形数据处理的硬件和软件


    围绕着生成和表示物体图形的

    准确性->真实性->实时性

    算法可大致分为以下几类：


    +   - 基于图形设备的基本图形元素的生成算法

    +   - 图形的变换和裁剪

    +   - 自由曲线和曲面——计算几何

    +   - 几何造型技术'
  - '[PAGE 11]


    # 1.2、研究内容


    +   - 真实感图形的生成算法

    +   - 自然景物的生成——分形几何

    +   - 颜色科学及其应用

    +   - 计算机动画技术

    +   - 虚拟现实技术——实时交互式三维图形处理

    +   - 热点问题探讨'
  - '[PAGE 12]


    # 1.3 计算机图形学的发展


    +   - 计算机图形学的确立

    +   - 图形硬件的发展

    +   - 图形软件的发展'
  - '[PAGE 13]


    # 计算机图形学的确立


    +   □ 酝酿期（50年代）（“被动”图形学）


    1950年，美国麻省理工学院（MIT）的


    旋风1号(Whirlwind I)计算机配备了阴极射线管(CRT)来显示一些简单的图形。'
  - '[PAGE 14]


    # 计算机图形的确定


    +   □ 萌芽期（60年代）（交互式图形生成技术）


    1962年，美国MIT林肯实验室的Ivan.E. Sutherland发表了一篇题为“Sketchpad:一个人——机通信的图形系统”的博士论文，其中首次使用了“Computer
    Graphics”。'
  - '[PAGE 15]


    # 计算机图形学的确立


    +   发展期（70年代）（显示技术与交互技术）


    +   计算机图形处理技术进入实用化阶段；


    +   出现了区域填充、裁剪、消隐等基本图形概念及算法；


    +   真实感图形学和实体造型技术；


    CADAM：用于飞机设计的交互式图形处理系统，绘制工程图、分析与产生数据加工纸带'
  - '[PAGE 16]


    # 计算机图形学的确立


    +   - 普及期（80年代）（基于图形的应用软件）

    +     - 出现了带有光栅图形显示器的个人计算机和工作站。

    +     - 光线跟踪算法和辐射度算法的提出，标志着计算机真实感图形学的算法已经日渐成熟。

    +   - 提高增强期（90年代）（多学科交叉融合）

    +     - 标准化、集成化、智能化方向发展。

    +     - 发展趋势：结合图形硬件实现实时绘制、基于数据采集进行真实感建模、绘制与建模任务相结合。'
  - '[PAGE 17]


    # 图形硬件的发展


    +   □ 图形显示设备


    +   ■ 60年代中期，随机扫描的显示器；（价格昂贵）


    +   ■ 60年代后期，存储管式显示器；（不能显示动态图形）


    +   ■ 70年代中期，电视技术光栅扫描的图形显示器。


    目前正向着小型化、低电压、数字化方向发展。'
  - '[PAGE 18]


