    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_368_0.png)\n\n图5-26 区域的表示方法\n\n## 区域的分类\n\
    \n4-连通区域，8-连通区域\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_369_0.png)\n\n(a)\
    \ 4-邻接点\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_369_1.png)\n\n(b) 8-邻接点\n\n\
    图5-27 4-邻接点与8-邻接点\n\n## 区域的分类\n\n- □ 4-连通区域：从区域上的一点出发，通过访问已知点的4-邻接点，在不越出区域的前提下，遍历区域内的所有像素点。\n\
    - □ 8-连通区域：从区域上的一点出发，通过访问已知点的8-邻接点，在不越出区域的前提下，遍历区域内的所有像素点。\n\n图5-28 4-连通与8-连通区域\n\
    \n## 4连通与8连通区域的区别\n\n- - 连通性： 4连通可看作8连通区域，但对边界有要求。\n- - 对边界的要求。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_372_0.png)\n\
    \n## 区域填充算法\n\n- - 区域填充算法（边界填充算法和泛填充算法）\n- 是根据区域内的一个已知像素点（种子点）出发，找到区域内其他像素点的过程，所以把这一类算法也成为种子填充算法。\n\
    \n## 区域填充算法——边界填充算法\n\n- - 算法的输入：种子点坐标(x,y)，填充色以及边界颜色。\n- - 利用堆栈实现简单的种子填充算法\n\
    - 算法从种子点开始检测相邻位置是否是边界颜色，若不是就用填充色着色，并检测该像素点的相邻位置，直到检测完区域边界颜色范围内的所有像素为止。\n\n## 区域填充算法——边界填充算法\n\
    \n栈结构实现8-连通边界填充算法的算法步骤为：\n\n种子像素入栈；当栈非空时重复执行如下三步操作：\n\n- (a) 栈顶像素出栈；\n- (b) 将出栈像素置成填充色；\n\
    - (c) 检查出栈像素的8-邻接点，若其中某个像素点不是边界色且未置成多边形色，则把该像素入栈。\n\n## 区域填充算法——边界填充算法\n\n- -\
    \ 可以用于填充带有内孔的平面区域。\n- - 把太多的像素压入堆栈，降低了效率，同时需要较大的存储空间。\n- - 递归执行，算法简单，但效率不高，区域内每一像素都引起一次递归，进/出栈费时费内存。\n\
    - - 通过沿扫描线填充水平像素段，来代替处理4-邻接点和8-邻接点。\n\n## 区域填充算法——边界填充算法\n\n- 扫描线种子填充算法：\n- 扫描线通过在任意不间断扫描线区间中只取一个种子像素的方法使堆栈的尺寸极小化。不间断区间是指在一条扫描线上的一组相邻像素。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_378_0.png)\n\n## 区域填充算法——边界填充算法\n\n\
    基本过程：当给定种子点时，首先填充种子点所在的扫描线上的位于给定区域的一个区段，然后确定与这一区段相通的上下两条扫描线上位于给定区域内的区段，并依次保存下来。反复这个过程，直到填充结束。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_380_0.png)\n\n图5-31 扫描线种子填充算法过程\n\n\
    ## 区域填充算法——泛填充算法\n\n- □ 算法的输入：种子点坐标(x,y)，填充色和内部点的颜色。\n- □ 算法原理：算法从指定的种子(x,y)开始，用所希望的填充颜色赋给所有当前为给定内部颜色的像素点。\n\
    \n## 区域填充算法——泛填充算法\n\n- □ 种子像素入栈；栈非空时重复执行如下三步操作：\n- \n- (1)栈顶像素出栈；\n- \n- (2)将出栈像素置成填充色；\n\
    - \n- (3)检查出栈像素的8-邻接点，若其中某个像素点不是给定内部点的颜色且未置成新的填充色，则把该像素入栈。\n\n## 区域填充算法——泛填充算法\n\
    \n- □ 当以边界表示时，4-连通边界填充算法只能填充4-连通区域，8-连通边界填充算法也只能填充8-连通区域。\n- □ 当以内点表示时，8-连通泛填充算法可以填充8-连通区域也可以填充4-连通区域，当然4-连通泛填充算法还是只能填充4-连通区域。\n\
    \n## 相关概念——内外测试\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_384_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_384_1.png)\n\
    \n图5-32 不自交的多边形与自相交的多边形\n\n## 相关概念——内外测试\n\n奇-偶规则（Odd-even Rule）\n\n从任意位置p作一条射线，若与该射线相交的多边形边的数目为奇数，则p是多边形内部点，否则是外部点。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_385_0.png)\n\n## 相关概念——内外测试\n\n- □\
    \ 首先使多边形的边变为矢量。\n- □ 将环绕数初始化为零。\n- □ 再从任意位置p作一条射线。当从p点沿射线方向移动时，对在每个方向上穿过射线的边计数数，每当多边形的边从右到左穿过射线时，环绕数加1，从左到右时，环绕数减1。\n\
    - □ 处理完多边形的所有相关边之后，若环绕数为非零，则p为内部点，否则，p是外部点。\n\n## 相关概念——曲线边界区域填充\n\n- □ 相交计算中包含了非线性边界。\n\
    - □ 对于简单曲线：\n- （1）计算曲线相对两侧的两个扫描线交点\n- （2）简单填充在曲线两侧上的边界点间的水平像素区间。\n"
