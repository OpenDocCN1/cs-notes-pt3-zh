    # 改进的有效边表算法——算法步骤


    +   (1)初始化：构造边表，AET表置空；


    +   (2)将第一个不空的ET表中的边与AET表合并；


    +   (3)由AET表中取出交点对进行填充。填充之后删除 y=y_max 的边；


    +   (4)y_{i+1}=y_i+1，根据x_{i+1}=x_i+1/k计算并修改AET表，同时合并ET表中y=y_{i+1}桶中的边，按次序插入到AET表中，形成新的AET表；


    +   (5)AET表不为空则转(3)，否则结束。'
  - '[PAGE 361]


    # 边缘填充算法


    +   □ 基本思想：按任意顺序处理多边形的每条边。

    +   处理时，先求出该边与扫描线的交点，再对扫描线上交点右方的所有像素取反。


    +   □ 算法简单，但对于复杂图形，每一像素可能被访问多次'
  - '[PAGE 362]


    # 栅栏填充算法


    +   - 栅栏指的是 一条过多边形顶点且与扫描线垂直的直线。它把多边形分为两半。

    +   - 基本思想：按任意顺序处理多边形的每一条边，但处理每条边与扫描线的交点时，将交点与栅栏之间的像素取反。

    +   - 这种算法尽管减少了被重复访问像素的数目，但仍有一些像素被重复访问。'
  - '[PAGE 363]


    # 边标志算法


    +   □ 基本思想：先用特殊的颜色在帧缓存中将多边形的边界勾画出来，然后将着色的像素点依x坐标递增的顺序配对，再把每一对像素构成的区间置为填充色。


    +   □ 分为两个步骤：打标记；填充。


    +   □ 当用软件实现本算法时，速度与改进的有效边表算法相当，但本算法用硬件实现后速度会有很大提高。'
