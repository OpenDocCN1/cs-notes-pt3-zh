  - '[PAGE 325]


    # 中点Bresenham画圆


    构造判别式：


    d = F(x_M, y_M) = F(x_i+1, y_i − 0.5) = (x_i+1)^2 + (y_i − 0.5)^2 − R^2


    +   □ 当d≤0时，下一点取P_u(x_i +1, y_i);


    +   □ 当d>0时，下一点取P_d(x_i +1, y_i−1)。'
  - '[PAGE 326]


    # 误差项的递推（d≤0）


    d₂ = F(xᵢ + 2, yᵢ − 0.5)

    = (xᵢ + 2)² + (yᵢ − 0.5)² − R²


    d₂ = (xᵢ + 1 + 1)² + (yᵢ − 0.5)² − R²

    = (xᵢ + 1)² + 2xᵢ + 3 + (yᵢ − 0.5)² − R²

    = d₁ + 2xᵢ + 3


