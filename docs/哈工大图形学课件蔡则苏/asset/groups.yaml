  - '[PAGE 298]


    # 数值微分法(DDA法)


    直线的微分方程：


    dy/dx = Δy/Δx = (y₁ - y₀)/(x₁ - x₀) = k


    x_{i+1} = x_i + ε·Δx


    y_{i+1} = y_i + ε·Δy


    ε = 1/max(|Δx|,|Δy|)


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_298_0.png)'
  - '[PAGE 299]


    # max(|Δx|,|Δy|)=|Δx|，即|k|≤1的情况：


    x_{i+1} = x_i + ε·Δx = x_i + 1/|Δx|·Δx = x_i ±1


    y_{i+1} = y_i + ε·Δy = y_i + 1/|Δx|·Δy = y_i ±k


    # max(|Δx|,|Δy|)=|Δy|，此时|k|≥1：


    x_{i+1} = x_i + ε·Δx = x_i + 1/|Δy|·Δx = x_i ± 1/k


    y_{i+1} = y_i + ε·Δy = y_i + 1/|Δy|·Δy = y_i ±1'
