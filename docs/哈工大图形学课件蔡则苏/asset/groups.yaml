    # OpenGL图形软件包


    +   - OpenGL是SGI（Silicon Graphics Inc.）公司对IRIS GL进行改进，扩展可移植性，形成的一个跨平台开放式图形编程接口。


    +   - 目前，OpenGL标准由1992年成立的独立财团 OpenGL Architecture Review Board（ARB）以投票方式产生，并制成规范文档公布。各软硬件厂商以此为基础在各自的系统上予以实现。


    # OpenGL的主要功能


    +   - 模型绘制

    +   - 模型观察

    +   - 颜色模式

    +   - 光照应用

    +   - 图像效果增强

    +   - 位图和图像处理


    # OpenGL的主要功能


    +   - 纹理映射

    +   - 实时动画

    +   - 交互技术


    # OpenGL的绘制流程——流水线


    OpenGL命令将被放在一个命令缓冲区中，这样命令缓冲区中包含了大量的命令、顶点数据和纹理数据。当缓冲区被清空时，缓冲区中的命令和数据都将传递给流水线的下一个阶段。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_146_0.png)


    图2.35 一条简化的OpenGL绘制流水线


    # OpenGL的基本语法——相关库


    +   - OpenGL核心库： gl（115个最基本的命令函数）

    +   - OpenGL实用程序库： glu（43个函数，可实现复杂的操作，如纹理映射、坐标变换、网格化等）

    +   - OpenGL编程辅助库： aux（31个函数）

    +   - OpenGL实用程序工具包（OpenGL utility toolkit，GLUT）： glut（30多个，基于窗口的工具）

    +   - Windows专用库： wgl（6个函数，用于连接OpenGL和Windows NT）


    # OpenGL的基本语法——命名规则


    +   □ OpenGL函数都遵循一个命名约定，即采用以下格式：


    ```

    <库前缀><根命令><可选的参数个数><可选的参数类型>

    ```


    例如函数glColor3f(...), gl表示这个函数来自库gl.h, color表示该函数用于颜色设定, 3f表示这个函数采用了三个浮点数参数。

