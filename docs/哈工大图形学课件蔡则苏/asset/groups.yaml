    \n## Sutherland-Hodgeman多边形裁剪\n\n-   基本思想：将多边形的边界作为一个整体，每次用窗口的一条边界对要裁剪的多边形进行裁剪，体现分而治之的思想。\n\
    \n## Sutherland-Hodgeman多边形裁剪\n\n-   算法实施策略：\n-   - 为窗口各边界裁剪的多边形存储输入与输出顶点表。在窗口的一条裁剪边界处理完所有顶点后，其输出顶点表将用窗口的下一条边界继续裁剪。\n\
    -   - 窗口的一条边以及延长线构成的裁剪线把平面分为两个区域，包含窗口区域的区域称为可见侧；不包含窗口区域的域为不可见侧。\n\n## Sutherland-Hodgeman多边形裁剪\n\
