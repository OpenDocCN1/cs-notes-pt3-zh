    # # 阴极射线管 (CRT)


    +   - 荧光屏 (Phosphor Screen)


    荧光屏是用荧光粉涂敷在玻璃底壁上制成的，常用沉积法涂敷荧光粉。玻璃底壁要求无气泡，表面光学抛光。


    荧光粉的性能要求是：发光颜色满足标准白色、发光效率高、余辉时间合适以及寿命长等。余辉时间：从电子束停止轰击到发光亮度下降到初始值的1%所经历的时间'
