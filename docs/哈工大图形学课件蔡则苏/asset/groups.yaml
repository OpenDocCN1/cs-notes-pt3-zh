    +   ■ 该类作品接近于传统摄影特技，并带有“蒙太奇艺术”的特点，许多合成图像带有荒诞、刺激、搞笑、离奇和超现实主义风格的效果。


    +   ■ 优势为：易于掌握和普及、效果丰富、成本较低。


    +   □ 广泛应用于影视后期和多媒体创作。和应用美术及广告设计的关系十分密切。'
