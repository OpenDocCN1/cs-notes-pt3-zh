  md: "\n+   □ **基于加权模板的过取样**：前面在确定像素的亮度时，仅仅是对所有子像素的亮度进行简单的平均。更常见的做法是给接近像素中心的子像素赋予较大的权值，即对所有子像素的亮度进行加权平均。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_419_0.png)\n\n图5-50 常用的加权模板\n\n## 反走样——简单的区域取样\n\
    \n在整个像素区域内进行采样，这种技术称为区域取样。又由于像素的亮度是作为一个整体被确定的，不需要划分子像素，故也被称为前置滤波。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_420_0.png)\n\
    \n## 反走样——简单的区域取样\n\n如何计算直线段与像素相交区域的面积？\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_421_0.png)\n\
    \n图5-54 重叠区域面积的计算\n\n## 反走样——简单的区域取样\n\n+   - 可以利用一种求相交区域的近似面积的离散计算方法：\n+    \
    \ (1) 将屏幕像素分割成 n 个更小的子像素，\n+     (2) 计算中心落在直线段内的子像素的个数 m，\n+     (3) m/n 为线段与像素相交区域面积的近似值。\n\
    +   - 直线段对一个像素亮度的贡献与两者重叠区域的面积成正比。\n+   - 相同面积的重叠区域对像素的贡献相同。\n\n## 反走样——加权区域取样\n\
    \n+   □ 过取样中，我们对所有子像素的亮度进行简单平均或加权平均来确定像素的亮度。\n\n+   □ 在区域取样中，我们使用覆盖像素的连续的加权函数（Weighting\
    \ Function）或滤波函数（Filtering Function）来确定像素的亮度。\n\n## 加权区域取样原理\n\n加权函数W(x,y)是定义在二维显示平面上的函数。对于位置为(x,y)的小区域dA来说，函数值W(x,y)（也称为在(x,y)处的高度）表示小区域dA的权值。将加权函数在整个二维显示图形上积分，得到具有一定体积的滤波器（Filter），该滤波器的体积为1。将加权函数在显示图形上进行积分，得到滤波器的一个子体，该子体的体积介于0到1之间。用它来表示像素的亮度。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_425_0.png)\n\n滤波器\n\n像素\n\n实际直线\n\n\
