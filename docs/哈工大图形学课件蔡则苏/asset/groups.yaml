    d = F(x_M, y_M) - F(x_Q, y_Q)


    = y_M - k x_M - b - (y_Q - k x_Q - b)


    = y_M - y_Q


    +   d > 0    y_M > y_Q

    +   d < 0    y_M < y_Q

