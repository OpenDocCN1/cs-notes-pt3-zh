  - '[PAGE 248]


    # # 海岸线长度问题


    二十世纪七十年代，法国数学家曼德尔布罗特在他的著作中讨论英国海岸线的长度。他发现，这个问题取决于测量所使用的尺度。采用公里做单位，一些几米和几十米的曲折会被忽略；如果采用米做单位，测得的长度会增加，但厘米以下的量仍然无法反映，测量单位的缩小使测得的长度曾加。由于在自然尺度之间有许多个数量级，这种曾加不会停止，海岸线的长度会趋于无限长。也就是说，长度不是海岸线的定量特征。'
  md: "\n## 构造实体几何法\n\n□ 构造实体几何法 (CSG, Constructive Solid Geometry) 由两个实体间的并、交或差操作生成新的实体。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_229_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_229_1.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_229_2.png)\n\n(a) A,B形体的并 (b) A,B形体的差\
    \ (c) A,B形体的交\n\n图4.13 构造实体几何法\n\n## 构造实体几何法\n\n- 在构造实体几何法中，集合运算的实现过程可以用一棵二叉树（称为CSG树）来描述。\n\
    - 树的叶子是基本体素或是几何变换参数；\n- 树的非终端结点是施加于其子结点的正则集合算子（正则并、正则交和正则差）或几何变换的定义。\n\n### 图4.14\
    \ 由CSG树产生二维形体的实例\n\n(a)\n\n(b)\n\n(c) CSG树\n\n(d) 由CSG树产生的形体\n\n## 构造实体几何法\n\n\
    - 优点：如果体素设置比较齐全，通过集合运算就可以构造出多种不同的符合需要的实体。\n- 缺点一：集合运算的中间结果难以用简单的代数方程表示，求交困难。\n\
    - 缺点二：CSG树不能显式地表示形体的边界，因而无法直接显示CSG树表示的形体。\n\n## 构造实体几何法\n\n□ 解决：光线投射算法\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_233_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_233_1.png)\n\n图4.15 光线投射算法\n\n（实体A∪B取ad，实体A∩B则取cb，实体A-B则取ab）\n\
    \n## 空间位置枚举表示\n\n空间位置枚举表示法将包含实体的空间分割为大小相同、形状规则（正方形或立方体）的体素，然后，以体素的集合来表示图形对象。\n\
    \n- 二维情况，常用二维数组存放。\n- 三维情况下，常用三维数组p[i][j][k]来存放。\n\n## 八叉树\n\n- 八叉树（octrees）又称为分层树结构，它对空间进行自适应划分，采用具有层次结构的八叉树来表示实体。\n\
    \n## 八叉树——四叉树\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_236_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_236_1.png)\n\
    \n图4.16 二维图的四叉树表示\n\n## 八叉树\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_237_0.png)\n\
    \n图4.17 三维空间分成八个卦限及其节点表示\n\n## BSP树\n\n□ 二叉空间分割（Binary Space Partitioning, BSP）树方法是一种类似于八叉树的空间分割方法，它每次将一实体用任一位置和任一方向的平面分为二部分（不同于八叉树方法的每次将实体用平行于笛卡尔坐标平面的三个两两垂直的平面分割）。\n\
    \n## OpenGL中的实体模型函数\n\n### GLUT库中的多面体函数\n\n| 函数 | 说明 |\n|---|---|\n| `glutSolidTetrahedron()`\
    \ | 绘制中心位于世界坐标系原点的实心四面体和线框四面体，四面体的半径为√3。 |\n| `glutWireTetrahedron()` | 绘制中心位于世界坐标系原点的实心四面体和线框四面体，四面体的半径为√3。\
    \ |\n| `glutSolidCube(size)` | 绘制中心位于世界坐标系原点的实心立方体和线框立方体，立方体的半径为size，size是一个双精度浮点值。\
    \ |\n| `glutWireCube(size)` | 绘制中心位于世界坐标系原点的实心立方体和线框立方体，立方体的半径为size，size是一个双精度浮点值。\
    \ |\n| `glutSolidOctahedron()` | 绘制中心位于世界坐标系原点的实心八面体和线框八面体，八面体的半径为1.0。 |\n| `glutWireOctahedron()`\
    \ | 绘制中心位于世界坐标系原点的实心八面体和线框八面体，八面体的半径为1.0。 |\n| `glutSolidDodecahedron()` | 绘制中心位于世界坐标系原点的实心12面体和线框12面体，12面体的半径为√3。\
    \ |\n| `glutWireDodecahedron()` | 绘制中心位于世界坐标系原点的实心12面体和线框12面体，12面体的半径为√3。 |\n\
    | `glutSolidIcosahedron()` | 绘制中心位于世界坐标系原点的实心20面体和线框20面体，20面体的半径为1.0。 |\n| `glutWireIcosahedron()`\
    \ | 绘制中心位于世界坐标系原点的实心20面体和线框20面体，20面体的半径为1.0。 |\n\n## OpenGL中的实体模型函数\n\n- GLUT库中的二、三次曲面\n\
    - 绘制实体或线框球面\n  \n  ```c\n  void glutSolidSphere/glutWireSphere\n  (GLdouble radius,\
    \ GLint slices, GLint stacks);\n  ```\n- 绘制实体或线框圆锥面\n  \n  ```c\n  void glutSolidCone/glutWireCone\n\
    \  (GLdouble radius, GLdouble height, GLint\n  slices, GLint stacks);\n  ```\n\
    \n## OpenGL中的实体模型函数\n\n- 绘制实体或线框圆环\n\n```\nvoid glutSolidTorus/ glutWireTorus(GLdouble\
    \ innerRadius, GLdouble outerRadius, GLint slices,GLint stacks);\n```\n\n- 绘制实体或线框茶壶\n\
    \n```\nvoid glutSolidTeapot/glutWireTeapot\n(GLdouble size);\n```\n\n## OpenGL中的实体模型函数\n\
    \n- GLU二次曲面函数\n  - 定义一个二次曲面\n    `GLUquadricObj *sphere;`\n  - 激活二次曲面绘制器\n   \
    \ `sphere = gluNewQuadric();`\n  - 指定二次曲面的绘制方式\n    `gluQuadricDrawStyle(sphere,\
    \ GLU_LINE);`\n\n## OpenGL中的实体模型函数\n\n- 绘制二次曲面\n\n```\ngluSphere(sphere, radius,\
    \ slices, stacks);\n```\n\n```\ngluCylinder(sphere,baseRadius,topRadius, height,\
    \ slices, stacks);\n```\n\n```\ngluDisk(sphere,innerRadius,outerRadius, slices,\
    \ stacks);\n```\n\n## 非规则对象的表示\n\n- [ ] 分形几何\n- [ ] 形状语法\n- [ ] 粒子系统\n- [ ] 基于物理的建模\n\
    - [ ] 数据场的可见化\n\n## 分形几何(fractal geometry)\n\n- 分形几何物体具有一个基本特征： 无限的自相似。\n- 无限的自相似性是指物体的整体和局部之间细节的无限重现。\n\
    \n## 分形几何(fractal geometry)\n\n□ 分形维数，又称分数维数\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_246_0.png)\n\
    \n4 = 2²\n8 = 2³\nN = Kᴰ\nD=lgN/lgk\nK为边长缩小倍数；\nN为边长缩小后产生的新形体个数。\n\n图4.18 分形维数\n\
    \n## 分形几何(fractal geometry)\n\n- 生成过程：初始生成元（initiator）、生成元（generator）。\n- 实例\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_247_0.png)\n\n图4.19 生成过程\n\n## 海岸线长度问题\n\
    \n二十世纪七十年代，法国数学家曼德尔布罗特在他的著作中讨论英国海岸线的长度。他发现，这个问题取决于测量所使用的尺度。采用公里做单位，一些几米和几十米的曲折会被忽略；如果采用米做单位，测得的长度会增加，但厘米以下的量仍然无法反映，测量单位的缩小使测得的长度曾加。由于在自然尺度之间有许多个数量级，这种曾加不会停止，海岸线的长度会趋于无限长。也就是说，长度不是海岸线的定量特征。\n"
