  - '[PAGE 512]


    # Cohen-Sutherland算法


    （1）判断


    裁剪一条线段时，先求出直线段端点p₁和p₂的编码code1和code2，然后：


    +   a. 若code1|code2=0，对直线段简取之；


    +   b. 若code1&code2≠0，对直线段简弃之；'
  - '[PAGE 513]


    # Cohen-Sutherland算法


    （2）求交


    若上述判断条件不成立，则需求出直线段与窗口边界的交点。


    +   a. 左、右边界交点的计算: y = y₁ + k(x - x₁);


    +   b. 上、下边界交点的计算: x = x₁ + (y-y₁)/k。


    其中，k = (y₂-y₁)/(x₂-x₁)。'
