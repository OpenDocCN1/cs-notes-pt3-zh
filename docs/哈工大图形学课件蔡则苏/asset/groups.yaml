    \n二维仿射变换是具有如下形式的二维坐标变换：\n\n```\n$$\\begin{cases}x'=ax+by+m\\\\y'=cx+dy+n\\end{cases}$$\n\
    ```\n\n- 平移、比例、旋转、错切和反射等变换均是二维仿射变换的特例，反过来，任何常用的二维仿射变换总可以表示为这五种变换的复合。\n\n## 变换的性质\n\
    \n- □ 仅包含旋转、平移和反射的仿射变换维持角度和长度的不变性；\n- □ 比例变换可改变图形的大小和形状；\n- □ 错切变换引起图形角度关系的改变，甚至导致图形发生畸变。\n\
    - ■ 直线的中点变换后仍然是直线的中点\n- ■ 平行直线作相同变换后依然平行\n\n## 二维观察\n\n- □ 基本概念\n- □ 二维观察变换\n\
    - □ 二维裁剪\n- □ OpenGL中的二维观察\n\n## 二维观察——基本概念\n\n- □ 在计算机图形学中，将在用户坐标系中需要进行观察和处理的一个坐标区域称为窗口（Window）。\n\
    - □ 将窗口映射到显示设备上的坐标区域称为视区（Viewport）。\n\n## 图6-17 用户坐标系中旋转的窗口\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_497_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_497_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_497_2.png)\n\
    \n## 二维观察——基本概念\n\n- 观察坐标系(View Coordinate)是依据窗口的方向和形状在用户坐标平面中定义的直角坐标系。\n- 规格化设备坐标系(Normalized\
    \ Device Coordinate)也是直角坐标系，它是将二维的设备坐标系规格化到（0.0，0.0）到（1.0，1.0）的坐标范围内形成的。\n\n##\
    \ 二维观察——基本概念\n\n引入了观察坐标系和规格化设备坐标系后，观察变换分为如下图所示的几个步骤，通常称为二维观察流程。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_499_0.png)\n\
    \n图6-17 二维观察流程\n\n## 二维观察——基本概念\n\n## 变焦距效果\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_500_0.png)\n\
    \n(a) 原图及变化的窗口\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_500_1.png)\n\n(b)与窗口对应的视区1\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_500_2.png)\n\n(c)与窗口对应的视区2\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_500_3.png)\n\
    \n(d)与窗口对应的视区3\n\n图6-18 变焦距效果（窗口变、视区不变）\n\n## 二维观察——基本概念\n\n## □ 整体放缩效果\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_501_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_501_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_501_2.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_501_3.png)\n\n图6-17 整体放缩效果（窗口不变、视窗变）\n\
    \n## □ 漫游效果\n\n## 用户坐标系到观察坐标系的变换\n\n- □ 用户坐标系到观察坐标系的变换分由两个变换步骤合成：\n- ◆ 将观察坐标系原点移动到用户坐标系原点；\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_502_0.png)\n\n## 用户坐标系到观察坐标系的变换\n\n\
    ◆ 绕原点旋转使两坐标系重合\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_503_0.png)\n\n## 窗口到视区的变换\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_504_0.png)\n\n图6-23　窗口到视区的变换\n\n##\
    \ 窗口到视区的变换\n\n- - 要将窗口内的点（$x_w, y_w$）映射到相对应的视区内的点（$x_v, y_v$）需进行以下步骤：\n- 1. 将窗口左下角点移至用户系统系的坐标原点；\n\
    - 2. 针对原点进行比例变换；\n- 3. 进行反平移。\n\n## 裁剪\n\n- 在二维观察中，需要在观察坐标系下对窗口进行裁剪，即只保留窗口内的那部分图形，去掉窗口外的图形。\n\
    - 假设窗口是标准矩形，即边与坐标轴平行的矩形，由上（）下（）左（）右（）四条边描述。\n  \n  $y = y_{w_t} \\quad y = y_{w_b}\
    \ \\quad x = x_{w_l} \\quad x = x_{w_r}$\n\n## 二维线段的裁剪\n\n已知条件：\n\n- （1）窗口边界 $y\
    \ = y_{w_t}$ $y = y_{w_b}$ $x = x_{w_l}$ $x = x_{w_r}$ 的坐标值；\n- （2）直线段端点 $p_1p_2$\
    \ 的坐标值 $x_1, y_1, x_2, y_2$。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_508_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_509_0.png)\n\n□ 实交点：直线段与窗口矩形边界的交点；\n\
    \n□ 虚交点：处于直线段延长线或窗口边界延长线上的交点。\n\n## Cohen-Sutherland算法\n\n编码：对于任一端点(x,y)，根据其坐标所在的区域，赋予一个4位的二进制码D3D2D1D0。\n\
    \n编码规则如下：\n\n- （1）若x<wxl，D0=1，否则D0=0；\n- （2）若x>wxr，D1=1，否则D1=0；\n- （3）若y<wyb，D2=1，否则D2=0；\n\
    - （4）若y>wyt，D3=1，否则D3=0。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_510_0.png)\n\
    \n## Cohen-Sutherland算法\n\n（1）判断\n\n裁剪一条线段时，先求出直线段端点p₁和p₂的编码code1和code2，然后：\n\n\
    - a. 若code1|code2=0，对直线段简取之；\n- b. 若code1&code2≠0，对直线段简弃之；\n\n## Cohen-Sutherland算法\n\
    \n（2）求交\n\n若上述判断条件不成立，则需求出直线段与窗口边界的交点。\n\n- a. 左、右边界交点的计算: y = y₁ + k(x - x₁);\n\
    - b. 上、下边界交点的计算: x = x₁ + (y-y₁)/k。\n\n其中，k = (y₂-y₁)/(x₂-x₁)。\n\n## Cohen-Sutherland算法\n\
    \n1001\n\n1000\n\n1010\n\n0001\n\n0000\n\n0010\n\n0101\n\n0100\n\n0110\n\np₁\n\
    \np₁\n\np₄\n\np₂\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_514_0.png)\n\n##\
    \ Cohen-Sutherland算法\n\n- - 用编码方法实现了对完全可见和不可见直线段的快速接受和拒绝；\n- - 求交过程复杂，有冗余计算，并且包含浮点运算，不利于硬件实现。\n\
    \n## 中点分割算法\n\n- 中点分割算法的核心思想是通过二分逼近来确定直线段与窗口的交点。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_516_0.png)\n"
