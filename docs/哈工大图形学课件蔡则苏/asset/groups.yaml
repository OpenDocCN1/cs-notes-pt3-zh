    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_488_2.png)\n\n□ 90°、180° 和270° 的光栅旋转换：\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_489_0.png)\n\n(a) 逆时针旋转90°\n\n(b) 逆时针旋转180°\n\
    \n图6-15 光栅旋转变换\n"
  mdcn: "\n## 二维图形几何变换的计算\n\n```\n\\[\\begin{bmatrix} x_1' & y_1' & 1 \\\\ x_2' &\
    \ y_2' & 1 \\end{bmatrix} = \\begin{bmatrix} x_1 & y_1 & 1 \\\\ x_2 & y_2 & 1\
    \ \\end{bmatrix} \\cdot \\begin{bmatrix} a & b & p \\\\ c & d & q \\\\ l & m &\
    \ r \\end{bmatrix}\\]\n```\n\n$$\n\\begin{bmatrix} x'_1 & y'_1 & 1 \\\\ x'_2 &\
    \ y'_2 & 1 \\\\ x'_3 & y'_3 & 1 \\\\ \\vdots & \\vdots & \\vdots \\\\ x'_n & y'_n\
    \ & 1 \\end{bmatrix} = \\begin{bmatrix} x_1 & y_1 & 1 \\\\ x_2 & y_2 & 1 \\\\\
    \ x_3 & y_3 & 1 \\\\ \\vdots & \\vdots & \\vdots \\\\ x_n & y_n & 1 \\end{bmatrix}\
    \ \\cdot \\begin{bmatrix} a & b & p \\\\ c & d & q \\\\ l & m & r \\end{bmatrix}\n\
    $$\n\n## 复合变换\n\n- 图形作一次以上的几何变换，变换结果是每次变换矩阵的乘积。\n- 任何一复杂的几何变换都可以看作基本几何变换的组合形式。\n\
    - 复合变换具有形式：\n  $$P' = P \\cdot T = P \\cdot (T_1 \\cdot T_2 \\cdot T_3 \\cdots\
    \ T_n)$$ \n  $$= P \\cdot T_1 \\cdot T_2 \\cdot T_3 \\cdots T_n \\quad (n > 1)$$\n\
    \n## 复合变换——二维复合平移\n\nT_t = T_{t1} · T_{t2} = \\begin{bmatrix} 1 & 0 & 0 \\\\ 0\
    \ & 1 & 0 \\\\ T_{x1} & T_{y1} & 1 \\end{bmatrix} · \\begin{bmatrix} 1 & 0 & 0\
    \ \\\\ 0 & 1 & 0 \\\\ T_{x2} & T_{y2} & 1 \\end{bmatrix}\n\n= \\begin{bmatrix}\
    \ 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ T_{x1}+T_{x2} & T_{y1}+T_{y2} & 1 \\end{bmatrix}\n\
    \n## 复合变换——二维复合比例\n\nT_s = T_{s1} \\cdot T_{s2} = \\begin{bmatrix} S_{x1} & 0\
    \ & 0 \\\\ 0 & S_{y1} & 0 \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix}\
    \ S_{x2} & 0 & 0 \\\\ 0 & S_{y2} & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}\n\n= \\begin{bmatrix}\
    \ S_{x1} \\cdot S_{x2} & 0 & 0 \\\\ 0 & S_{y1} \\cdot S_{y2} & 0 \\\\ 0 & 0 &\
    \ 1 \\end{bmatrix}\n\n## 复合变换——二维复合旋转\n\nT_r = T_{r1} · T_{r2} = \\begin{bmatrix}\
    \ \\cos\\theta_1 & \\sin\\theta_1 & 0 \\\\ -\\sin\\theta_1 & \\cos\\theta_1 &\
    \ 0 \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix} \\cos\\theta_2 & \\\
    sin\\theta_2 & 0 \\\\ -\\sin\\theta_2 & \\cos\\theta_2 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}\n\
    \n= \\begin{bmatrix} \\cos(\\theta_1 + \\theta_2) & \\sin(\\theta_1 + \\theta_2)\
    \ & 0 \\\\ -\\sin(\\theta_1 + \\theta_2) & \\cos(\\theta_1 + \\theta_2) & 0 \\\
    \\ 0 & 0 & 1 \\end{bmatrix}\n\nR = R_{(\\theta_1)} \\bullet R_{(\\theta_2)} =\
    \ R(\\theta_1 + \\theta_2)\n\n## 复合变换\n\nR = \\begin{bmatrix} \\cos\\theta & \\\
    sin\\theta & 0 \\\\ -\\sin\\theta & \\cos\\theta & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}\
    \ = \\begin{bmatrix} \\cos\\theta & 0 & 0 \\\\ 0 & \\cos\\theta & 0 \\\\ 0 & 0\
    \ & 1 \\end{bmatrix} \\cdot \\begin{bmatrix} 1 & tg\\theta & 0 \\\\ -tg\\theta\
    \ & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}\n\n= \\begin{bmatrix} 1 & tg\\theta &\
    \ 0 \\\\ -tg\\theta & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix}\
    \ \\cos\\theta & 0 & 0 \\\\ 0 & \\cos\\theta & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}\n\
    \n## 相对任一参考点的一维几何变换\n\n相对某个参考点(x,y)作二维几何变换，其变换过程为：\n\n- 1. 平移；\n- 2. 针对原点进行二维几何变换；\n\
    - 3. 反平移。\n\n## 相对任意方向的二维几何变换\n\n相对任意方向作二维几何变换，其变换的过程是：\n\n- (1) 旋转变换；\n- (2)\
    \ 针对坐标轴进行二维几何变换；\n- (3) 反向旋转。\n\n例2. 相对直线y=x的反射变换\n\n可能发生的变换：沿（0，0）到（1，1）的比例变换\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_483_0.png)\n\n```\nT = [ cos(-45°)\
    \  sin(-45°)  0 ] [ S_x  0  0 ] [ cos45°  sin45°  0 ]\n    [ -sin(-45°) cos(-45°)\
    \ 0 ] [ 0  S_y  0 ] [ -sin45° cos45° 0 ]\n    [ 0        0        1 ] [ 0   0\
    \   1 ] [ 0      0      1 ]\n```\n\nP' = P · T\n\n## 坐标系之间的变换\n\n问题：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_484_0.png)\n\
    \n图6-12 坐标系间的变换\n\n分析：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_485_0.png)\n\
