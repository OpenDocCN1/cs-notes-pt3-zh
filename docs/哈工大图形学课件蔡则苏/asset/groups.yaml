  - '[PAGE 268]


    # 经典几何的维度定义


    +   - 在经典几何下，点被定义成0维的，点没有长度；直线被定义成1维，只有长度，没有面积，平面图形被定义成2维的，有面积，没有体积，立体图形是3维的，有体积。

    +   - 经典几何讨论的维度都是整数，它们的数值与决定几何形状的变量个数及自由度是一致的，这是一个很自然的想法。'
  - '[PAGE 269]


    # 换一个角度看维度


    根据相似性来看线段、正方形和立方体的维数。首先把线段、正方形和立方体的边两等分，这样，线段成为长度一半的两条线段，正方形变成边长为原来边长1/2的四个小正方形，而立方体而成为八个小立方体，边长为原来边长的1/2。原来的线段、正方形和立方体分别由2，4，8个把全体分成1/2的相似形组成。而2，4，8可改写成2的1，2，3次方，这里的1，2，3分别与其图形的经验维数相一致。'
  - '[PAGE 270]


    # 相似维度的定义


    +   一般地，如果某图形是由把全体缩小为1/a的a^D个相似图形构成的，那么此指数D就具有维度的意义。此维度被称为相似维度。


    +   相似维数常用Ds表示，按照定义，Ds完全没有是整数的必要。如某图形是由全体缩小1/a的b个相似形组成，则


    ```

    Ds = (ln b) / (ln a)

    ```'
  - '[PAGE 271]


    +   □ 我们可以以此计算上述几种图形的相似维度。

    +   □ **Koch曲线： (ln4)/(ln3)=1.2618**

    +   □ **Cantor集： (ln2)/(ln3)=0.6309**

    +   □ **Sierpinski集：**

    +     ■ 绒垫： (ln3)/(ln2)=1.5850

    +     ■ 地毯： (ln8)/(ln3)=1.8927

    +     ■ 海绵： (ln20)/(ln3)=2.7268'
  - '[PAGE 272]


    从以上图形的生成方式来看，大体上有两种方式：第一种是从初始图形E₀按一定原则往下“挖”，得到的新图形的维数小于E₀ 的欧式维数，常称为降维生成；第二种是在初始图形E₀的基础上增加一些线或面，得到的图形E的维数大于E0的欧式维数，这种生成方式常称为升维生成。'
  - '[PAGE 273]


    +   相似维数的定义具有很大的局限性，因为只用对具有严格的自相似性的分形，才能使用这个维数，定义适用于包括随机图形在内的任意的维数是很必要的。


    +   波恩大学数学家豪斯道夫1919年从测量的角度引入了Hausdorff维数。'
