    # 中点Bresenham算法——改进


    改进：用2d△x代替d，令D=2d△x 则：

    D₀ = 2△x d₀ = 2△x(0.5 − k) = △x − 2△y

    d₀ < 0    D₀ < 0

    D₁ = 2△x d₁ = 2△x(d₀ + 1 − k)

    = 2△x d₀ + 2△x − 2△y

    = D₀ + 2△x − 2△y

    d₀ ≥ 0    D₀ ≥ 0

    D₁ = 2△x d₁ = 2△x(d₀ − k) = D₀ − 2△y'
