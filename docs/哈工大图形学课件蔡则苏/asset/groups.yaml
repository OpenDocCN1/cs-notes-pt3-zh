    # Liang-Barsky算法


    由 $u \cdot p_k \le q_k$


    \begin{cases}

    \frac{q_k}{p_k}(p_k < 0) \le u \le \frac{q_k}{p_k}(p_k > 0) & k = 1,2 \\

    \frac{q_k}{p_k}(p_k < 0) \le u \le \frac{q_k}{p_k}(p_k > 0) & k = 3,4 \\

    0 \le u \le 1

    \end{cases}'
