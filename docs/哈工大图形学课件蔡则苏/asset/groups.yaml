    \  - 三维输入设备（如三维鼠标、空间球、数据手套、数据衣）\n  - 智能人机接口：用户的手势、表情、语音等\n\n## 2.2 图形输入设备\n\n\
    - - 键盘（keyboard）\n\n键盘能用来进行屏幕坐标的输入、菜单选择、图形功能选择，以及输入那些如辅助图形显示的图片标记等非图形数据。\n\n##\
    \ 图形输入设备\n\n- 鼠标器（mouse）\n\n当推动鼠标器在平面上移动时，鼠标将记录移动的方向和距离，这个方向和距离被传送给计算机，转换成对应的光标的位移。\n\
