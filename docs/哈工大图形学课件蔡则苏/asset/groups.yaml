    # Liang-Barsky算法


    直线的参数方程


    x = x₁ + u·(x₂ − x₁)      0 ≤ u ≤ 1

    y = y₁ + u·(y₂ − y₁)


    对于直线上一点（x,y）,若它在窗口内则有


    x_wl ≤ x₁ + u·(x₂ − x₁) ≤ x_wr

    y_wb ≤ y₁ + u·(y₂ − y₁) ≤ y_wt'
  - '[PAGE 520]


    u·(x₁−x₂) ≤ x₁−x_{w_l}


    u·(x₂−x₁) ≤ x_{w_r}−x₁


    u·(y₁−y₂) ≤ y₁−y_{w_b}


    u·(y₂−y₁) ≤ y_{w_t}−y₁

    p₁=−(x₂−x₁)      q₁=x₁−x_{w_l}

    p₂=x₂−x₁          q₂=x_{w_r}−x₁

    令

    p₃=−(y₂−y₁)      q₃=y₁−y_{w_b}

    p₄=y₂−y₁          q₄=y_{w_t}−y₁

    则有 u·p_k ≤ q_k'
