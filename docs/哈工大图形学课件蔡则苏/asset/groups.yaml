    # 三维物体表面必须具有以下5条性质：


    +   - 连通性：位于物体表面上的任意两个点都可用实体表面上的一条路径连接起来。


    +   - 有界性：物体表面可将空间分为互不连通的两部分，其中一部分是有界的


    +   - 非自相交性：物体的表面不能自相交


    +   - 可定向性：物体表面的两侧可明确定义出属于物体的内侧或外侧


    +   - 闭合性：物体表面的闭合性是由表面上多边形网格各元素的拓扑关系决定的，即每一条边有且只有两个顶点；每一条边连接来年各个或两个以上的面。'
