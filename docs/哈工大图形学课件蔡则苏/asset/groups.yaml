    - 若共享顶点的两条边在扫描线的同一边，这时交点作为零个或两个。\n\n## X - 扫描线算法 取整规则\n\n实际处理：只要检查\n顶点的两条边的另外\n\
    两个端点的Y值，两个\nY值中大于交点Y值的\n个数是0，1，2，来\n决定取0，1，2个交\n点。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_351_0.png)\n\
    \n## X - 扫描线算法——取整规则\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_352_0.png)\n\n\
    图5.21 与扫描线相交的多边形顶点的交点数\n\n## 改进的有效边表算法（Y连贯性算法）\n\n改进原理：\n\n- 处理一条扫描线时，仅对有效边求交。\n\
    - 利用扫描线的连贯性。\n- 利用多边形边的连贯性。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_353_0.png)\n\
