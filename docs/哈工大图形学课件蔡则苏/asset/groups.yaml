    # 8.2 三次样条


    三次多项式方程是能表示曲线段的端点通过特定点且在连接处保持位置和斜率连续性的最低阶次的方程


    给定 n+1 个点，可得到通过每个点的分段三次多项式曲线：


    ```

    x(t) = a_x t³ + b_x t² + c_x t + d_x

    y(t) = a_y t³ + b_y t² + c_y t + d_y

    z(t) = a_z t³ + b_z t² + c_z t + d_z

    ```


    t ∈ [0,1]'
