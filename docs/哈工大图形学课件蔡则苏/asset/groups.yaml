    □ 实交点：直线段与窗口矩形边界的交点；


    □ 虚交点：处于直线段延长线或窗口边界延长线上的交点。'
  - '[PAGE 510]


    # Cohen-Sutherland算法


    编码：对于任一端点(x,y)，根据其坐标所在的区域，赋予一个4位的二进制码D3D2D1D0。


    编码规则如下：


    +   （1）若x<wxl，D0=1，否则D0=0；

    +   （2）若x>wxr，D1=1，否则D1=0；

    +   （3）若y<wyb，D2=1，否则D2=0；

    +   （4）若y>wyt，D3=1，否则D3=0。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_510_0.png)'
