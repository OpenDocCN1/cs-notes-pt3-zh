  - '[PAGE 323]


    # 中点Bresenham画圆


    给定圆心在原点，半径为整数R的圆，其方程为


    x² + y² = R²


    构造函数F(x,y)=x²+y²-R²。


    +   - 对于圆上的点，有F(x,y)=0;

    +   - 对于圆外的点，F(x,y)>0;

    +   - 而对于圆内的点，F(x,y)<0。'
