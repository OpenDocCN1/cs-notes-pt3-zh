    \n# 误差项的递推（$d>0$）\n\n$$d_2=F(x_i+2,y_i-1.5)$$\n$$=(x_i+2)^2+(y_i-1.5)^2-R^2$$\n\
    \n$$d_2=(x_i+1+1)^2+(y_i-0.5-1)^2-R^2$$\n$$=(x_i+1)^2+2x_i+3+(y_i-0.5)^2-2(y_i-0.5)+1-R^2$$\n\
    $$=(x_i+1)^2+(y_i-0.5)^2+2(x_i-y_i)+5$$\n$$=d_1+2(x_i-y_i)+5$$\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_327_0.png)\n\
    \n图5.15 $d>0$的情况\n\n# 中点Bresenham画圆\n\n判别式的初始值\n\nd₀ = F(x₀ + 1, y₀ − 0.5)\n=\
    \ F(1, R − 0.5)\n= 1 + (R − 0.5)² − R²\n= 1.25 − R\n\n# 改进：用d-0.25代替d\n\n此时有：\n\
    \n$d = d + 2x_i + 3 \\qquad d \\le -0.25$\n$d = d + 2(x_i - y_i) + 5 \\quad d\
    \ > -0.25$\n$d_0 = 1 - R$\n\n$d \\le -0.25 \\quad \\rightarrow \\quad d < 0$\n\
    $d > -0.25 \\quad \\rightarrow \\quad d \\ge 0$\n\n# 中点Bresenham画圆——算法步骤\n\n1.\
    \ 输入圆的半径R。\n2. 计算初始值d=1-R、x=0、y=R。\n3. 绘制点(x,y)及其在八分圆中的另外七个对称点。\n4. 判断d的符号。若d<0，则先将d更新为d+2x+3，再将(x,y)更新为(x+1,y)；否则先将d更新为d+2(x-y)+5，再将(x,y)更新为(x+1,y-1)。\n\
    5. 当x<y时，重复步骤3和4。否则结束。程序演示\n\n# 椭圆的扫描转换\n\n- F(x, y) = b²x² + a²y² − a²b² = 0\n\
    - 椭圆的对称性，只考虑第一象限椭圆弧生成，分上下两部分，以切线斜率为−1的点作为分界点。\n- 椭圆上一点处的法向：\n  \n  N(x, y) = (F)'xᵢ\
    \ + (F)'yⱼ\n  \n  = 2b²xᵢ + 2a²yⱼ\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_331_0.png)\n\
    \n# 椭圆的中点画法\n\n与圆弧中点算法类似：确定一个像素后，接着在两个候选像素的中点计算一个判别式的值，由判别式的符号确定更近的点\n\n先讨论椭圆弧的上部分\n\
    \n(Xp, Yp)中点(Xp+1,Yp-0.5)\n\nd1=F(Xp+1,Yp-0.5)=b²(Xp+1)²+a²(Yp-0.5)²-a²b²\n\n\
    根据d1的符号来决定下一像素是取正右方的那个，还是右上方的那个。\n\n- 若d1<0，中点在椭圆内，取正右方像素，判别式更新为：\n  \n  d1'=F(Xp+2,Yp-0.5)=d1+b²(2Xp+3)\n\
    \  \n  d1的增量为b²(2Xp+3)\n\n- 当d1≥0，中点在椭圆外，取右下方像素，更新判别式：\n  \n  d1'=F(Xp+2,Yp-1.5)=d1+b²(2Xp+3)+a²(-2Yp+2)\n\
    \  \n  d1的增量为b²(2Xp+3)+a²(-2Yp+2)\n"
