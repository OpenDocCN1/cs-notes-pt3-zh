  md: "\n## 中点分割算法\n\n□ 特点：主要计算过程只用到加法或位移运算，易于硬件实现，同时适合于并行计算。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_517_0.png)\n\
    \n## Liang-Barsky算法\n\n分析\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_518_0.png)\n\
    \n## Liang-Barsky算法\n\n直线的参数方程\n\nx = x₁ + u·(x₂ − x₁)      0 ≤ u ≤ 1\ny = y₁\
    \ + u·(y₂ − y₁)\n\n对于直线上一点（x,y）,若它在窗口内则有\n\nx_wl ≤ x₁ + u·(x₂ − x₁) ≤ x_wr\ny_wb\
    \ ≤ y₁ + u·(y₂ − y₁) ≤ y_wt\n\nu·(x₁−x₂) ≤ x₁−x_{w_l}\n\nu·(x₂−x₁) ≤ x_{w_r}−x₁\n\
    \nu·(y₁−y₂) ≤ y₁−y_{w_b}\n\nu·(y₂−y₁) ≤ y_{w_t}−y₁\np₁=−(x₂−x₁)      q₁=x₁−x_{w_l}\n\
    p₂=x₂−x₁          q₂=x_{w_r}−x₁\n令\np₃=−(y₂−y₁)      q₃=y₁−y_{w_b}\np₄=y₂−y₁ \
    \         q₄=y_{w_t}−y₁\n则有 u·p_k ≤ q_k\n\n## Liang-Barsky算法\n\n由 $u \\cdot p_k\
    \ \\le q_k$\n\n\\begin{cases}\n\\frac{q_k}{p_k}(p_k < 0) \\le u \\le \\frac{q_k}{p_k}(p_k\
    \ > 0) & k = 1,2 \\\\\n\\frac{q_k}{p_k}(p_k < 0) \\le u \\le \\frac{q_k}{p_k}(p_k\
    \ > 0) & k = 3,4 \\\\\n0 \\le u \\le 1\n\\end{cases}\n\n## 特殊处理：\n\np₃ = -(y₂\
    \ - y₁)      q₃ = y₁ - wyb\np₄ = y₂ - y₁        q₄ = wyt - y₁\n\n## 求出参数值：\n\n\
    u3 = q₃ / p₃,    u4 = q₄ / p₄\n\nu_A = 0,    u_B = 1,\n\nu_max = max(0, u_k |\
    \ p_k < 0)\nu_min = min(u_k | p_k > 0, 1)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_522_0.png)\n\
    \np₁ = -(x₂ - x₁)      q₁ = x₁ - wx l\np₂ = x₂ - x₁        q₂ = wxr - x₁\n\n##\
    \ 求出参数值：\n\nu₁ = q₁ / p₁,    u₂ = q₂ / p₂\n\nu_A = 0,    u_B = 1,\n\nu_max = max(0,\
    \ u_k | p_k < 0)\nu_min = min(u_k | p_k > 0, 1)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_523_0.png)\n\
    \n(b) 直线段与窗口边界 wyb 和 wyt 平行的情况\n\np₁ = -(x₂ - x₁)      q₁ = x₁ - wxl\np₂ = x₂\
    \ - x₁        q₂ = wxr - x₁\np₃ = -(y₂ - y₁)      q₃ = y₁ - wxb\np₄ = y₂ - y₁\
    \        q₄ = wyt - y₁\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_524_0.png)\n\
    \n## 一般情况：\n\nu_max = max(0, u_k | p_k < 0)\nu_min = min(u_k | p_k > 0, 1)\n\n\
    ## 算法步骤：\n\n-   (1) 输入直线段的两端点坐标：(x₁,y₁)和(x₂,y₂)，以及窗口的四条边界坐标：yWt、ywb、xwl和xwr。\n\
    -   (2) 若Δx=0，则p₁=p₂=0。此时进一步判断是否满足q₁<0或q₂<0，若满足，则该直线段不在窗口内，算法转(7)。否则，满足q₁>0且q₂>0，则进一步计算u₁和u₂。算法转(5)。\n\
    -   (3) 若Δy=0，则p₃=p₄=0。此时进一步判断是否满足q₃<0或q₄<0，若满足，则该直线段不在窗口内，算法转(7)。否则，满足q₁>0且q₂>0，则进一步计算u₁和u₂。算法转(5)。\n\
    -   (4) 若上述两条均不满足，则有pₖ≠0（k=1,2,3,4）。此时计算u₁和u₂。\n-   (5) 求得u₁和u₂后，进行判断：若u₁>u₂，则直线段在窗口外，算法转(7)。若u₁<u₂，利用直线的参数方程求得直线段在窗口内的两端点坐标。\n\
