    -   (3) 若Δy=0，则p₃=p₄=0。此时进一步判断是否满足q₃<0或q₄<0，若满足，则该直线段不在窗口内，算法转(7)。否则，满足q₁>0且q₂>0，则进一步计算u₁和u₂。算法转(5)。\n\
    -   (4) 若上述两条均不满足，则有pₖ≠0（k=1,2,3,4）。此时计算u₁和u₂。\n-   (5) 求得u₁和u₂后，进行判断：若u₁>u₂，则直线段在窗口外，算法转(7)。若u₁<u₂，利用直线的参数方程求得直线段在窗口内的两端点坐标。\n\
    -   (6) 利用直线的扫描转换算法绘制在窗口内的直线段。\n-   (7) 算法结束。\n\n## 多边形的裁剪\n\n问题的提出：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_526_0.png)\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_526_1.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_526_2.png)\n\
    \n## Sutherland-Hodgeman多边形裁剪\n\n-   基本思想：将多边形的边界作为一个整体，每次用窗口的一条边界对要裁剪的多边形进行裁剪，体现分而治之的思想。\n\
    \n## Sutherland-Hodgeman多边形裁剪\n\n-   算法实施策略：\n-   - 为窗口各边界裁剪的多边形存储输入与输出顶点表。在窗口的一条裁剪边界处理完所有顶点后，其输出顶点表将用窗口的下一条边界继续裁剪。\n\
    -   - 窗口的一条边以及延长线构成的裁剪线把平面分为两个区域，包含窗口区域的区域称为可见侧；不包含窗口区域的域为不可见侧。\n\n## Sutherland-Hodgeman多边形裁剪\n\
    \n沿着多边形依次处理顶点会遇到四种情况：\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_529_0.png)\n\
    \n输入： ABCDEFGH\n输出： 12DEFGHA\n(a) 用左边界裁剪\n\n输入： 12DEFGHA\n输出： 34D56FGHA1\n(b)\
    \ 用下边界裁剪\n\n输入：34D56FGHA1\n\n(c) 用右边界裁剪\n\n(d) 用上边界裁剪\n\n## 特点\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_532_0.png)\n\
    \n(a) 裁剪前\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_532_1.png)\n\n(b) Sutherland-Hodgeman\
    \ 算法的裁剪结果\n\n## Weiler-Atherton多边形裁剪\n\n假设按顺时针方向处理顶点，且将用户多边形定义为Ps，窗口矩形为Pw。算法从Ps的任一点出发，跟踪检测Ps的每一条边，当Ps与Pw相交时（实交点），按如下规则处理：\n\
    \n-   (1)若是由不可见侧进入可见侧，则输出可见直线段，转(3);\n\n## Weiler-Atherton多边形裁剪\n\n(2)若是是由可见侧进入不可见侧，则从当前交点开始，沿窗口边界顺时针检测Pw的边，即用窗口的有效边界去裁剪Ps的边，找到Ps与Pw最靠近当前交点的另一交点，输出可见直线段和由当前交点到另一交点之间窗口边界上的线段，然后返回处理的当前交点；\n\
    \n(3)沿着Ps处理各条边，直到处理完Ps的每一条边，回到起点为止。\n\n## 下图示了Weiler-Atherton算法裁剪凹多边形的过程和结果。\n\
    \n(a)裁剪前\n\n(b)Weiler-Atherton算法的裁剪结果\n\n图6-34 Weiler-Atherton算法裁剪凹多边形\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_535_0.png)\n\
    \n## 6.6 OpenGL中的二维观察\n\n-   - 指定矩阵堆栈\n-   - 指定裁剪窗口\n-   - 指定视区\n\n## 指定矩阵堆栈\n\
    \n-   指定当前操作的是投影矩阵堆栈\n-   \n-   `glMatrixMode(GL_PROJECTION)`\n\n-   初始化，即指定当前操作的矩阵堆栈的栈顶元素为单位矩阵。\n\
    -   \n-   `glLoadIdentity();`\n\n## 指定裁剪窗口\n\n-   - 指定视区\n    `glViewPort (xvmin,\
    \ yvmin, vpWidth, vpHeighht);`\n\n-   - **xvmin**和**yvmin**指定了对应于屏幕上显示窗口中的矩形视区的左下角坐标，单位为像素。\n\
    \n-   - 整型值**vpWidth**和**vpHeighht**则指定了视区的宽度和高度。\n\n-   - 默认的视区大小和位置与显示窗口保持一致。\n"
