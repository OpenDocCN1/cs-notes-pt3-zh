    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_213_0.png)\n\n## 基本概念——实体\n\n□ 实体：对于一个占据有限空间的正则形体，如果其表面是二维流形，则该正则形体为实体。\n\
