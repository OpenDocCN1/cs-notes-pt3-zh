    \ 图形的表示（点阵法和参数法）\n\n- □ 点阵法是用具有颜色信息的点阵来表示图形的一种方法，它强调图形由哪些点组成，并具有什么灰度或色彩。\n- □\
    \ 参数法是以计算机中所记录图形的形状参数与属性参数来表示图形的一种方法。\n- □ 通常把参数法描述的图形叫做图形（Graphics）\n- □ 把点阵法描述的图形叫做图象（Image）\n\
    \n## 与计算机图形学相关的学科\n\n- □ 计算机图形学（CG）试图将参数形式的数据描述来生成（逼真的）图象。（图形的综合技术）\n- □ 数字图象处理(Digital\
    \ Image Processing)旨在对图象进行各种加工以改善图象的视觉效果。\n- □ 模式识别 (Pattern Recognition ) 图形学的逆操作，研究如何从图像中提取数据、模型或特征。\n\
