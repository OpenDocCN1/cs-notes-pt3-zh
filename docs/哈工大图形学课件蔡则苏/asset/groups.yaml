    \n## 什么是计算机图形学\n\n## 研究内容\n\n## 与相关学科的关系\n\n## 发展简史\n\n## 应用领域\n\n## 交互式计算机图形处理系统\n\
    \n## 第1章 绪论\n\n### 1.1、 Computer Graphics (CG)\n\n什么是计算机图形学\n\n计算机图形学是研究怎样用计算机生成、处理和显示图形的原理、方法和技术的一门学科。\n\
    \n国际标准化组织(ISO)的定义：\n\n计算机图形学是研究通过计算机将数据转换为图形，并在专门显示设备上显示的原理、方法和技术的学科。\n\n电子与电气工程师协会（IEEE）定义：\n\
    \n计算机图形学是利用计算机产生图形化的图像的艺术和科学\n\n## 图形的构成要素\n\n图形的要素：\n\n几何要素（点、线、面、体等几何属性）和非几何要素（反映物体本身固有的属性——视觉属性，如明暗、灰度、色彩、纹理、透明性、线型、线宽）。\n\
    \n计算机图形学中所研究的图形\n\n从客观世界物体中抽象出来的带有颜色及形状信息的图和形。或者：能够在人的视觉系统中形成视觉印象的客观对象。\n\n##\
    \ 图形的表示（点阵法和参数法）\n\n- □ 点阵法是用具有颜色信息的点阵来表示图形的一种方法，它强调图形由哪些点组成，并具有什么灰度或色彩。\n- □\
    \ 参数法是以计算机中所记录图形的形状参数与属性参数来表示图形的一种方法。\n- □ 通常把参数法描述的图形叫做图形（Graphics）\n- □ 把点阵法描述的图形叫做图象（Image）\n\
    \n## 与计算机图形学相关的学科\n\n- □ 计算机图形学（CG）试图将参数形式的数据描述来生成（逼真的）图象。（图形的综合技术）\n- □ 数字图象处理(Digital\
    \ Image Processing)旨在对图象进行各种加工以改善图象的视觉效果。\n- □ 模式识别 (Pattern Recognition ) 图形学的逆操作，研究如何从图像中提取数据、模型或特征。\n\
    - □ 计算机视觉(Computer Vision)是研究用计算机来模拟生物外显或宏观视觉功能的科学技术。是图像处理、模式识别和计算机图形的综合应用。\n\n\
    ## 图像处理\n\n图像\n\nCAD/CAM\n\n- 计算机艺术\n- 计算机动画\n- 计算机视觉\n\n与相关学科的关系\n\n计算机图形学\n\n\
    模式识别\n\n特征数据\n几何模型\n\n计算几何\n\n一般说来，要在计算机上生成一幅表示物体的图形，有三个要素：\n\n## 二、研究内容\n\n-\
    \ **造型技术:**\n  - 在计算机中建立所要生成图像的物体的模型\n  - 即给出表示该物体的几何数据和拓扑关系\n- **绘制技术:**\n  -\
    \ 按照给定的观察点及观察方向将物体模型在计算机屏幕上显示出来\n- **人机交互技术:**\n  - 为造型和绘制这两个过程提供友好的人机界面\n\n##\
    \ 研究内容\n\n## 计算机对图形数据处理的硬件和软件\n\n围绕着生成和表示物体图形的\n准确性->真实性->实时性\n算法可大致分为以下几类：\n\n\
    - 基于图形设备的基本图形元素的生成算法\n- 图形的变换和裁剪\n- 自由曲线和曲面——计算几何\n- 几何造型技术\n\n### 1.2、研究内容\n\n\
    - 真实感图形的生成算法\n- 自然景物的生成——分形几何\n- 颜色科学及其应用\n- 计算机动画技术\n- 虚拟现实技术——实时交互式三维图形处理\n\
    - 热点问题探讨\n\n### 1.3 计算机图形学的发展\n\n- 计算机图形学的确立\n- 图形硬件的发展\n- 图形软件的发展\n\n## 计算机图形学的确立\n\
    \n- □ 酝酿期（50年代）（“被动”图形学）\n\n1950年，美国麻省理工学院（MIT）的\n\n旋风1号(Whirlwind I)计算机配备了阴极射线管(CRT)来显示一些简单的图形。\n\
    \n## 计算机图形的确定\n\n- □ 萌芽期（60年代）（交互式图形生成技术）\n\n1962年，美国MIT林肯实验室的Ivan.E. Sutherland发表了一篇题为“Sketchpad:一个人——机通信的图形系统”的博士论文，其中首次使用了“Computer\
    \ Graphics”。\n\n## 计算机图形学的确立\n\n- 发展期（70年代）（显示技术与交互技术）\n\n计算机图形处理技术进入实用化阶段；\n\n\
    出现了区域填充、裁剪、消隐等基本图形概念及算法；\n\n真实感图形学和实体造型技术；\n\nCADAM：用于飞机设计的交互式图形处理系统，绘制工程图、分析与产生数据加工纸带\n\
    \n## 计算机图形学的确立\n\n- 普及期（80年代）（基于图形的应用软件）\n  - 出现了带有光栅图形显示器的个人计算机和工作站。\n  - 光线跟踪算法和辐射度算法的提出，标志着计算机真实感图形学的算法已经日渐成熟。\n\
    - 提高增强期（90年代）（多学科交叉融合）\n  - 标准化、集成化、智能化方向发展。\n  - 发展趋势：结合图形硬件实现实时绘制、基于数据采集进行真实感建模、绘制与建模任务相结合。\n\
    \n## 图形硬件的发展\n\n- □ 图形显示设备\n\n  - ■ 60年代中期，随机扫描的显示器；（价格昂贵）\n  - ■ 60年代后期，存储管式显示器；（不能显示动态图形）\n\
    \  - ■ 70年代中期，电视技术光栅扫描的图形显示器。\n\n目前正向着小型化、低电压、数字化方向发展。\n\n## 图形硬拷贝设备（图形绘制）\n\n\
