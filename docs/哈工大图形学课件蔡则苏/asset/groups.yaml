    # 图形软件的发展及软件标准的形成




    +   开放式、高效率、标准化、集成化、智能化、学科交叉。




    与设备无关、与应用无关、具有较高性能。'
  - '[PAGE 22]


    # 图形软件的发展及软件标准的形成


    +   - 近二十年中，国际标准化组织ISO已经批准和正在讨论的与计算机图形有关的标准有：

    +     图形核心系统 GKS、三维图形核心系统GKS-3D、程序员层次交互式图形系统PHIGS、计算机图元文件CGM、计算机图形接口CGI、基本图形转换规范IGES、产品数据转换规范STEP。


    +   - 事实标准

    +     SGI的OpenGL，微软的Direct X，Adobe的Postscript等。'
  - '[PAGE 23]


    # 1.3 计算机图形学的应用


    +   计算机辅助设计与制造（CAD/CAM）


    CAD通过交互式的图形设备对部件进行设计和描述，产生工程略图（线框图）或者更接近实际物体的透视图等，通过迅速地将各种修改信息进行组合，用户可以自由、灵活地对图形进行实验性改动和形体显示。


    CAM技术在各种工业制造业中得到广泛的应用。（Pro/E, UG等）'
  - '[PAGE 24]


    # 图形用户界面


    应


    飞机、汽车、船舶、机电、轻工、服装的外形设计


    +   - 集成电路、印刷电路板的设计

    +   - 建筑设计

    +   - 基于工程图纸的三维形体重建


    用


    在飞机工业中，美国波音飞机公司已用有关的CAD系统实现波音777大型客机的整体设计和模拟，其中包括飞机外型、内部零部件的安装和检验。使其设计制造成本下降30%以上。（无纸化设计，无纸化制造）'
