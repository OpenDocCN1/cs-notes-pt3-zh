    # 光栅扫描图形显示子系统的结构(显卡)


    +   □ 帧缓冲存储器：用来存储像素颜色（灰度）值的存储器。


    +   □ 双缓存：一个缓存用来刷新的同时，另一个写入数据信息，尔后这两个缓存可互换角色。这种方式称为双缓存，它可以使得显示的动画流畅而没有滑动感。


    # 光栅扫描图形显示子系统的结构


    □ 显示控制器（Display Controller），又称视频控制器（Video Controller），主要功能是依据设定的显示工作方式，自主地、反复不断地读取帧缓存中的图像点阵（包括图形、字符文本）数据，将它们转换成R、G、B三色信号并配以同步信号送至显示器，即可刷新屏幕。


    # 光栅扫描图形显示子系统的结构


    +   □ 显示处理器（Display Processor），又称图形控制器（Graphics Controller）或显示协处理器（Display Coprocessor），它把CPU从图形显示处理的事务中解脱出来，其主要任务是扫描转换待显示的图形以及某些附加的操作等。


    # 绘制流水线


    +   - 图形子系统的图形绘制功能常常采用流水线（Pipeline）结构绘制，或者称为管线绘制。


    +   - 绘制流水线的基本结构从概念上包括三个阶段

    +     - 应用程序阶段

    +     - 几何阶段

    +     - 光栅阶段


    # 相关概念


    +   - 分辨率

    +   - 像素与帧缓存

    +   - 颜色查找表

    +   - 显示长宽比

    +   - 屏幕坐标系


    # 相关概念——分辨率


    +   - 光点一般是指电子束打在显示器的荧光屏上，

    +   显示器能够显示的最小的发光点。

    +   - 像素点是指图形显示在屏幕上时候，

    +   按当前的图形显示分辨率所能提供的最小元素点。

    +   像素点可以看做光点的集合，

    +   其最小尺寸等于光点


    # 相关概念——分辨率（屏幕分辨率、显示分辨率和存储分辨率）


    +   □ 屏幕分辨率，也称为光栅分辨率，它决定了显示系统最大可能的分辨率，任何显示控制器所提供的分辨率也不能超过这个物理分辨率。


    +   □ 通常用水平方向上的光点数与垂直方向上的光点数的乘积来表示。


    # 相关概念——分辨率


    +   - 显示分辨率是计算机显示控制器所能够提供的显示模式分辨率，实际应用中简称为显示模式。

    +   - 对于文本显示方式，显示分辨率用水平和垂直方向上所能显示的字符总数的乘积表示。

    +   - 对于图形显示方式，则用水平和垂直方向上所能显示的像素点总数的乘积表示。

    +   - 显示分辨率不同，它所对应的像素点大小也不同。


    # 相关概念——分辨率


    □ 图形的存储分辨率是指帧缓冲区的大小，一般用缓冲区的字节数表示。


    □ 存储分辨率不仅与显示分辨率有关，还与像素点的色彩有关。


    □ 帧缓存大小的计算：

    x方向的像素点数 × y方向的像素点数 × log₂n/8 (BYTE)

    其中：n为颜色数或灰度等级数


    # 相关概念——分辨率


    +   - 屏幕分辨率决定了所能显示的最高分辨率。

    +   - 显示分辨率和存储分辨率对所能显示的图形分辨率有控制作用。

    +   - 显示器中的分辨率


    带宽 = A*水平像素点数*垂直像素点数*刷新频率

    A常取1.344


    # 相关概念——颜色查找表


    颜色查找表也称调色板，是由高速的随机存储器组成，用来储存表达像素色彩的代码。此时帧缓冲存储器中每一像素对应单元的代码不再代表该像素的色彩值，而是作为查色表的地址索引。


    # 2.5 图形硬拷贝设备


