    in [0,1]$$\n```\n\np(t) = [x(t) y(t) z(t)]^T = [t^n ... t 1] · [a_n b_n c_n; ...\
    \ ... ...; a_1 b_1 c_1; a_0 b_0 c_0]\n= T · C = T · M_S · G   t ∈ [0,1]\n\n##\
