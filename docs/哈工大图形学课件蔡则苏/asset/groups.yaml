    \n```\nvoid glNormal3{bsidf} ( TYPE nx, TYPE ny, TYPE nz);\nvoid glNormal3{bsidf}v\
    \ ( const TYPE* v);\n```\n\n## OpenGL中的字符函数\n\n+   □ GLUT位图字符\n   \n       void\
