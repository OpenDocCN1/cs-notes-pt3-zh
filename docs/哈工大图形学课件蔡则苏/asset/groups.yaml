  mdcn: "\n## OpenGL中的反走样\n\n- 颜色混和函数用于计算两个相互重叠的对象的颜色。\n- 在RGBA颜色模式（A表示透明度）中，已知源像素的颜色值为（Sᵣ，S\U0001D4F0\
    ，Sᵦ，Sₐ），目标像素的颜色值为（Dᵣ，D\U0001D4F0，Dᵦ，Dₐ），颜色混合后像素的颜色为：\n  \n  （Rₛ·Sᵣ + Rᴅ·Dᵣ，Gₛ·S\U0001D4F0\
    \ + Gᴅ·D\U0001D4F0，Bₛ·Sᵦ + Bᴅ·Dᵦ，Aₛ·Sₐ + Aᴅ·Dₐ）\n\n## 第六章 二维变换及二维观察\n\n- 如何对二维图形进行方向、尺寸和形状方面的变换。\n\
    - 如何进行二维观察。\n\n## 二维变换及二维观察\n\n- □基本几何变换与基本概念\n\n- □二维图形几何变换的计算\n\n- □复合变换\n\n\
    - □变换的性质\n\n## 6.2 基本几何变换\n\n图形的几何变换是指对图形的几何信息经过平移、比例、旋转等变换后产生新的图形，是图形在方向、尺寸和形状方面的变换。\n\
    \n基本几何变换都是相对于坐标原点和坐标轴进行的几何变换。\n\n## 基本几何变换——平移变换\n\n- 平移是指将p点沿直线路径从一个坐标位置移到另一个坐标位置的重定位过程。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_448_0.png)\n\n图6-1 平移变换\n\n## 基本几何变换——比例变换\n\
    \n推导：\n$x' = S_x \\cdot x$\n$y' = S_y \\cdot y$\n\n矩阵形式：\n\n$[x'\\quad y'] = [x\\\
    quad y] \\cdot \\begin{bmatrix} S_x & 0 \\\\ 0 & S_y \\end{bmatrix}$\n\n## 基本几何变换——比例变换\n\
    \n比例变换是指对p点相对于坐标原点沿x方向放缩Sx倍，沿y方向放缩Sy倍。其中Sx和Sy称为比例系数。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_451_0.png)\n\
    \n图6-2 比例变换(Sx=2,Sy=3)\n\n## 基本几何变换——比例变换\n\n图6-3 比例变换\n\n(a) Sx=Sy比例\n\nSx=Sy<1\n\
    \nSx=Sy>1\n\n(b) Sx<>Sy比例\n\nSx>Sy\n\nSx<Sy\n\n## 基本几何变换——旋转变换\n\n二维旋转是指将p点绕坐标原点转动某个角度（逆时针为正，顺时针为负）得到新的点p'的重定位过程。\n\
    \n![](img/af544efef4a0944fe7b8b5fa26ed5707_453_0.png)\n\n## 基本几何变换——旋转变换\n\n□\
    \ 推导：（极坐标）\n\n$$x=r\\cos\\alpha \\qquad y=r\\sin\\alpha$$\n\n$$x'=r\\cos(\\alpha+\\\
    theta)=x\\cos\\theta-y\\sin\\theta$$\n\n$$y'=r\\sin(\\alpha+\\theta)=x\\sin\\\
    theta+y\\cos\\theta$$\n\n□ 矩阵：逆时针旋转θ角\n\n$$[x'\\ \\ y']=[x\\ \\ y]\\begin{bmatrix}\\\
    cos\\theta & \\sin\\theta\\\\-\\sin\\theta & \\cos\\theta\\end{bmatrix}$$\n\n\
    ## 基本几何变换\n\n平移、缩放、旋转变换的矩阵表示：\n\nP' = P + T\nP' = P · S\nP' = P · R\nP' = P ·\
    \ T₁ + T₂\n\n图形通常要进行一系列基本几何变换，希望能够把二维变换统一表示为矩阵的乘法。\n\n## 基本几何变换——规范化齐次坐标\n\n-\
    \ 齐次坐标表示就是用n+1维向量表示一个n维向量。\n\n(x, y) ↔ (x h, y h, h)      h ≠ 0\n\n- 规范化齐次坐标表示就是h=1的齐次坐标表示。\n\
    \n(x, y) ↔ (x, y, 1)\n\n## 基本几何变换\n\n平移：[x'  y'] = [x  y] + [T_x  T_y]\n\n↓\n\n\
    [x'  y'  1] = [x  y  1] · ⎡1  0  0⎤\n                         ⎢0  1  0⎥\n    \
    \                     ⎣T_x T_y 1⎦\n\n## 基本几何变换\n\n比例：\n[x'  y'] = [x  y] · [S_x\
