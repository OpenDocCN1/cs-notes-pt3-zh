    # 计算机艺术——艺术领域


    +   □ 计算机平面合成艺术（婚纱影楼，PS）


    +   □ 计算机数字图像合成艺术（Computer Image Editing and Montage Art）


    +   ■ 主要指利用电脑对扫描或数字相机导入的图像素材进行编辑和合成，以及进行后期特技处理所产生的新视觉作品


