  md: "\n## OpenGL的基本语法——数据类型\n\n表2.1 OpenGL的数据结构\n\n| OpenGL数据类型 | 内部表示法 | 定义为C类型\
    \ | C字面值后缀 |\n|---|---|---|---|\n| GLbyte | 8位整数 | signed char | B |\n| GLshort\
    \ | 16位整数 | short | S |\n| GLint、GLsizei | 32位整数 | long | L |\n| GLfloat、GLclampf\
    \ | 32位浮点数 | float | F |\n| GLdouble、GLclampd | 64位浮点数 | double | D |\n| GLubyte、GLboolean\
    \ | 8位无符号整数 | unsigned char | Ub |\n| GLshort | 16位无符号整数 | unsigned short | Us\
    \ |\n| GLuint、GLenum、GLbitfield | 32位无符号整数 | unsigned long | Ui |\n\n## OpenGL程序实例——窗口管理\n\
    \n- 初始化（`glutInit`）\n- 创建窗口（`glutCreateWindow`）\n- 设定窗口的显示模式（`glutInitDisplayMode`）\n\
    - 指定窗口的位置和大小（`glutInitWindowPosition`和`glutInitWindowSize`）\n- 指定窗口的显示内容函数（`glutDisplayFunc`）\n\
    - 运行框架（`glutMainLoop`）\n\n## OpenGL程序实例——绘制图形\n\n- 指定窗口背景色（ glClearColor ）\n\n\
    - 颜色管理，使用RGB颜色模型。一种颜色用红、绿、蓝三种颜色成分混合而成，每种颜色成分使用0.0到1.0之间的任意有效浮点数来表示颜色值。\n\n## OpenGL程序实例——绘制图形\n\
    \n表2.2 OpenGL的一些常用混合色\n\n| 混合色 | 红色成分（R） | 绿色成分（G） | 蓝色成分（B） |\n|---|---|---|---|\n\
    | 黑 | 0.0 | 0.0 | 0.0 |\n| 红 | 1.0 | 0.0 | 0.0 |\n| 绿 | 0.0 | 1.0 | 0.0 |\n| 黄\
    \ | 1.0 | 1.0 | 0.0 |\n| 蓝 | 0.0 | 0.0 | 1.0 |\n| 紫 | 1.0 | 0.0 | 1.0 |\n| 青 |\
    \ 0.0 | 1.0 | 1.0 |\n| 深灰 | 0.25 | 0.25 | 0.25 |\n| 浅灰 | 0.75 | 0.75 | 0.75 |\n\
    | 棕 | 0.60 | 0.40 | 0.12 |\n| 南瓜橙 | 0.98 | 0.625 | 0.12 |\n| 粉红 | 0.98 | 0.04\
    \ | 0.70 |\n| 紫红 | 0.60 | 0.40 | 0.70 |\n| 白 | 1.0 | 1.0 | 1.0 |\n\n## OpenGL程序实例——绘制图形\n\
    \n- 刷新窗口的缓冲区（ glClear）\n- 设定投影参数\n  ```\n  glMatrixMode(GL_PROJECTION);\n  gluOrtho2D(0.0,200.0,0.0,150.0);\n\
    \  ```\n- 绘制图形\n  ```\n  glRectf(50.0f, 100.0f, 150.0f, 50.0f);\n  ```\n\n## 课后第一次作业\
    \ (请交电子版, caizesu@sina.com)\n\n1、名词解释：\n鼠标、光笔、数据手套、液晶显示器、像素点 、屏幕分辨率、显示分辨率、存储分辨率\n\
    \n2、试列出你所知道的图形输入与输出设备\n\n3、简述液晶显示器的基本显示原理\n\n4、实验作业： 在Visual C++环境下利用 OpenGL给出\
    \ 一个特定名称命名的窗口 ，并在窗口中绘制一个有简单二维图形组合而成的图案。\n\n## 第三章 用户接口与交互技术\n\n- 用户接口设计\n- 逻辑输入设备与输入处理\n\
    - 交互式绘图技术\n- OpenGL实现橡皮筋技术\n- OpenGL实现拾取操作\n- OpenGL中的菜单功能\n\n### 3.1 用户接口设计\n\
    \n一个好的图形用户接口应具备以下特点：\n\n- 易于被用户理解并接受；\n- 易于操作、使用；\n- 高效率、可靠性和实用性。\n\n## 用户模型\n\
    \n- 用户模型（User Mode）是用户接口设计的基础，它提供给用户有关它所处理的的对象以及作用于这些对象的处理过程的一个概念性模型。\n\n- 用户模型依照定义对象和对对象进行的操作来定义图形系统。\n\
    \n- 用户模型应尽可能地使用用户熟悉的概念而回避一些计算机专业术语。\n\n## 反馈\n\n□ 反馈是计算机与用户交互的一个基本成分，计算机图形终端给出反馈信息，用来帮助用户对系统进行操作。\n\
    \n□ 反馈要求系统在接收到每次输入以后给出某种类型的反应。\n\n□ 反馈信息通常应足够简捷清晰，引人注目，但这些信息也不能过分突出，以至于干扰用户的注意力。\n\
    \n□ 实现反馈必须考虑的因素是速度。\n\n## 一致性原则\n\n- 一致性原则是指在设计系统的各个环节时，应遵从统一和简单的规则，保证不出现例外和特殊的情况，无论信息显示还是命令输入都应如此。\n\
    \n- 按用户认为最正常、最合乎逻辑的方式去做，这比保持单纯的一致性更重要。\n\n## 减少记忆量\n\n- 用户接口的操作应该组织得容易理解和记忆。\n\
    - 重要的原则是唤醒用户的识别而不是记忆。\n\n## 回退和出错处理\n\n- 回退（Undo）机制，它指绘图系统允许用户沿着进行的操作步骤，一步步倒退，并删除已做的操作。\n\
    - 对操作过程中的任何错误或失误，无论在何级别，都应有一定的改错、取消和修复措施。\n- 设计一些好的诊断程序和提供出错信息可帮助确定发生错误的原因。\n\n\
    ## 视觉效果设计\n\n- 视觉效果设计涉及用户接口的各个方面，如屏幕的布局、色彩的使用、信息的安排等等，这里强调的是色彩的使用。\n- 通常在选择色彩对比时以色调对比为主。\n\
    - 为减轻视觉疲劳，还应该在视野范围内保持均匀的色彩明亮度。\n\n## 适应不同的用户\n\n- 针对同一交互任务，交互式图形接口通常提供\n  多种交互方式以适应不同的用户。\n\
    \n## 逻辑输入设备\n\n表2.1 图形输入设备的逻辑分类\n\n| 名称 | 基本功能 |\n|------|----------|\n| 定位设备\
    \ (Locator) | 指定一个点的坐标位置 (x, y) |\n| 笔划设备 (Stroke) | 指定一系列点的坐标 |\n| 数值设备 (Valuator)\
    \ | 输入一个整数或实数 |\n| 字符串设备 (String) | 输入一串字符串 |\n| 选择设备 (Choice) | 选择某个菜单项 |\n|\
    \ 拾取设备 (Pick) | 选择显示着的图形的组成部分 |\n\n□ 图形输入设备从逻辑上分为六种 (PHIGS、GKS)。\n\n## 逻辑输入设备\n\
    \n- **定位设备**有鼠标器、操纵杆、跟踪球、空间球、数字化仪的触笔或手动光标等。（在屏幕上交互地指定一个点的坐标位置）\n\n- 定位设备的三种分类\n\
    \  - 绝对坐标设备（数字化仪和触摸屏）和相对坐标设备（鼠标器、跟踪球和操纵杆等）\n  - 直接设备（触摸屏）和间接设备（鼠标等）\n  - 连续设备（鼠标、操纵杆、数字化仪等）和离散设备（键控光标）\n\
    \n## 逻辑输入设备\n\n□ 笔划设备： 笔划设备的输入等于多次调用定位设备，产生一系列的坐标值，根据产生的坐标值可产生多边形和曲线等。（交互式指定多个点的坐标位置）\n\
    \n□ 定值设备： 定值设备常用来输入各种参数和数据。\n\n## 逻辑输入设备\n\n□ 字符串设备：即进行字符串输入。包括键盘、语音、笔画（手写）等输入。\n\
    \n□ 选择设备\n\n- 选择设备用来选择菜单选项、属性选项和用于构图的对象形状等。\n\n- 常用的选择设备有功能键、热键和定位设备等等。\n\n##\
    \ 逻辑输入设备——拾取设备\n\n## 冲突问题的解决\n\n- 在图形对象生成时就对每一个对象确定其拾取优先级。\n\n- 依次对拾取图形设立标志。\n\
    \n- 找距离最近的对象优先拾取。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_173_0.png)\n\n图2.2\
    \ 距离最近原则\n"
