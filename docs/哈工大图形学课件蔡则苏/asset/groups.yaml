    # 空间位置枚举表示


    空间位置枚举表示法将包含实体的空间分割为大小相同、形状规则（正方形或立方体）的体素，然后，以体素的集合来表示图形对象。


    +   二维情况，常用二维数组存放。


    +   三维情况下，常用三维数组p[i][j][k]来存放。'
