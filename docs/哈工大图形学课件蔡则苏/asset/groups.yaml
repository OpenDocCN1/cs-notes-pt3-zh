    \n二十世纪七十年代，法国数学家曼德尔布罗特在他的著作中讨论英国海岸线的长度。他发现，这个问题取决于测量所使用的尺度。采用公里做单位，一些几米和几十米的曲折会被忽略；如果采用米做单位，测得的长度会增加，但厘米以下的量仍然无法反映，测量单位的缩小使测得的长度曾加。由于在自然尺度之间有许多个数量级，这种曾加不会停止，海岸线的长度会趋于无限长。也就是说，长度不是海岸线的定量特征。\n"
