    \ 为：\n\n$r\\cdot A=c\\cdot i\\cdot A$\n\n- 正则运算即为先对物体取内点再取闭包的运算。\n\n$r\\text{-}A$\
    \ 称为 $A$ 的正则集。\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_211_0.png)\n\n![](img/af544efef4a0944fe7b8b5fa26ed5707_211_1.png)\n\
