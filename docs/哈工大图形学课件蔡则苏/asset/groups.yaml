    ## 5.5 字符处理


    - ASCII码：“美国信息交换用标准代码集”(American Standard Code for Information Interchange)，简称ASCII码。

    - 国际码：“中华人民共和国国家标准信息交换编码，简称为国际码，代号GB2312-80。

    - 字库：字库中储存了每个字符的图形信息。

    - 矢量字库和点阵字库。


    ## 字符处理——点阵字符


    - 在点阵表示中，每个字符由一个点阵位图来表示。

    - 显示时：形成字符的像素图案。


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_390_0.png)


    图5-33 字符A的点阵表示


    ## 字符处理——点阵字符


    - 定义和显示直接、简单。

    - 存储需要耗费大量空间。

    - 从一组点阵字符生成不同尺寸和不同字体的其他字符。

    - 采用压缩技术。


    ## 字符处理——矢量字符


    轮廓字型法采用直线或二、三次曲线的集合来描述一个字符的轮廓线，轮廓线构成了一个或若干个封闭区域，显示时只要填充这些区域就可产生相应的字符。


    显示时可以“无极放缩”。


    占用空间少，美观，变换方便。


    ## 5.6 属性处理


    - 图素或图段的外观由其属性决定。

    - 图形软件中实现属性选择的方法是提供一张系统当前属性值表，通过调用标准函数提供属性值表的设置和修改。进行扫描转换时，系统使用属性值表中的当前属性值进行显示和输出。


    ## 属性处理


    - 线型与线宽

    - 区域填充属性


    ![](img/af544efef4a0944fe7b8b5fa26ed5707_397_0.png)


    图5-35 相同数目像素显示的不等长划线


    □ 可根据线的斜率来调整实心段和中间空白段的像素数目。


    ## 线型与线宽——线型


    - 实现简单、效率高。

    - 斜线与水平(或垂直)线不一样粗。

