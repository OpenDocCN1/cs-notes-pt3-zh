- pgno: 295
  md: '# LRU近似实现 – 将时间计数变为是和否


    +   - 每个页加一个引用位(reference bit)


    +   - 每次访问一页时，硬件自动设置该位


    +   - 选择淘汰页：扫描该位，是1时清0，并继续扫描；是0时淘汰该页


    > SCR这一实现方法称为 Clock Algorithm


    ![](img/365fc74cce32b405409a65a7e8830bec_295_0.png)


    ![](img/365fc74cce32b405409a65a7e8830bec_295_1.png)


    > 再给一次机会(Second Chance Replacement)


    ![](img/365fc74cce32b405409a65a7e8830bec_295_2.png)'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Clock算法的分析与改造


    如果缺页很少，会？ 所有的R=1


    +   - hand scan一圈后淘汰当前页，将调入页插入hand位置，hand前移一位


    +   - 原因: 记录了太长的历史信息... 怎么办？


    退化为FIFO!


    +   - 定时清除R位... 再来一个扫描指针!


    用来清除R位，移动速度要快!


    用来选择淘汰页，移动速度慢!


    更像Clock吧!'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# 置换策略有了，还需要解决一个问题


    +   给进程分配多少页框(帧frame)


    +   分配的多，请求调页导致的内存高效利用就没用了！


    +   那分配的太少呢？


    解释：系统内进程增多 ⇒ 每个进程的缺页率增大 ⇒ 缺页率增大到一定程度，进程总等待调页完成 ⇒ CPU利用率降低 ⇒ 进程进一步增多，缺页率更大...


    看下面的现象: 横轴是进程个数


