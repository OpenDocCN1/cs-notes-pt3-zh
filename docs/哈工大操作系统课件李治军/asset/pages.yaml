- pgno: 80
  md: '# 引入“进程”概念


    +   - 运行的程序和静态程序不一样!

    +     - 需要描述这些不一样…

    +     - 程序 + 所有这些不一样 ➜ 一个概念


    +   - 进程是进行（执行）中的程序

    +     - 进程有开始、有结束，程序没有

    +     - 进程会走走停停，走停对程序无意义

    +     - 进程需要记录 ax,bx,…，程序不用

    +     - …………


    > 这些不一样就成了进程概念的外延


    > 所有的不一样都表现在PCB中…'
