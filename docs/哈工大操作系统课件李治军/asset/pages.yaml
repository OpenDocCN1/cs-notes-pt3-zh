- pgno: 218
  md: '# 死锁的成因


    +   - 资源互斥使用，一旦占有别人无法使用

    +   - 进程占有了一 些资源，又不释放，再去申请其他资源

    +   - 各自占有的资源和互相申请的资源形成了环路等待


    ![](img/365fc74cce32b405409a65a7e8830bec_218_0.png)


    ![](img/365fc74cce32b405409a65a7e8830bec_218_1.png)


    ![](img/365fc74cce32b405409a65a7e8830bec_218_2.png)'
