- pgno: 337
  md: "# 多个进程共同使用磁盘\n\n```\nstatic void make_request()\n{\n ... .req->sector=bh->b_blocknr<<1;\n\
    \ add_request(major+blk_dev,req); }\n```\n\n```\nstatic void add_request(struct\
    \ blk_dev_struct *dev, struct request *req)\n{\n struct request *tmp=dev->current_request;\n\
    \ req->next=NULL; cli(); //关中断(互斥)\n for(;tmp->next;tmp=tmp->next)\n if ((IN_ORDER(tmp,\
    \ req) || !IN_ORDER(tmp, tmp->next)) && IN_ORDER(req, tmp->next)) break;\n req->next=tmp->next;\
    \ tmp->next=req; sti(); }\n```\n\n```\n#define IN_ORDER(s1, s2) \\\n ((s1)->dev<(s2)->dev\
    \ || ((s1)->dev == (s2)->dev\\\n && (s1)->sector<(s2)->sector))\n```\n\nsector\
    \ = Cx(Heads×Sectors) + HxSectors + S\n\n![](img/365fc74cce32b405409a65a7e8830bec_337_0.png)"
  merge: -1
