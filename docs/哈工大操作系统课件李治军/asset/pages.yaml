- pgno: 49
  md: "# int 0x80中断的处理\n\n```\nvoid sched_init(void)\n{\n    set_system_gate(0x80,\
    \ &system_call);\n}\n```\n\n■ 显然，set_system_gate用来设置0x80的中断处理\n\n```\n在linux/include/asm/system.h中\n\
    #define set_system_gate(n, addr) \\\n_set_gate(&idt[n],15,3,addr); //idt是中断向量表基址\n\
    #define _set_gate(gate_addr, type, dpl, addr)\\\n__asm__(\"movw %%dx,%%ax\\n\\\
    t\" \"movw %0,%%dx\\n\\t\"\\\n\"movl %%eax,%1\\n\\t\" \"movl %%edx,%2\"::\\\n\"\
    i\" ((short)(0x8000+(dpl<<13)+type<<8)),\"o\"(*((\\\nchar*)(gate_addr))),\"o\"\
    (*(4+(char*)(gate_addr))),\\\n\"d\"((char*)(addr)),\"a\"(0x00080000))\n```\n\n\
    |  | 处理函数入口点偏移 | P | DPL | 01110 |  |\n|---|---|---|---|---|---|\n|  | 段选择符 |\
    \ 处理函数入口点偏移 |  |  |  |"
  merge: -1
  img_proc: true
- pgno: 50
  md: "# 中断处理程序: system_call\n\n```\n在linux/kernel/system_call.s中\nnr_system_calls=72\n\
    .globl _system_call\n_system_call: cmpl $nr_system_calls-1,%eax\n\tja bad_sys_call\n\
    \tpush %ds  push %es  push %fs\n\tpushl %edx  pushl %ecx  pushl %ebx  //调用的参数\n\
    \tmovl $0x10,%edx  mov %dx,%ds  mov %dx,%es  //内核数据\n\tmovl $0x17,%edx  mov %dx,%fs\
    \  //fs可以找到用户数据\n\tcall _sys_call_table(, %eax,4)  //a(, %eax,4)=a+4*eax\n\tpushl\
    \ %eax //返回值压栈, 留着ret_from_sys_call时用\n\t... //其他代码\nret_from_sys_call: popl %eax,\
    \ 其他pop, iret\n```\n\neax中存放的是系统调用号\n\n__asm__ volatile(\"int 0x80\":\"=a\"(__res)\n\
    \n__sys_call_table+4*%eax就是相应系统调用处理函数入口"
