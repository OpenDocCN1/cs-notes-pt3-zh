- pgno: 259
  md: '# TLB得以发挥作用的原因


    TLB命中时效率会很高，未命中时效率降低


    有效访问时间 = HitR×(TLB+MA) + (1-HitR)×(TLB+2MA)


    命中率！


    内存访问时间！


    TLB时间！


    有效访问时间=98%×(20ns+100ns) + 2%×(20ns+200ns)=122ns


    有效访问时间=10%×(20ns+100ns) + 90%×(20ns+200ns)=210ns


    +   要想真正实现“近似访存1次”， TLB的命中率应该很高


    +   TLB越大越好，但TLB很贵，通常只有[64, 1024]'
  merge: -1
  img_proc: true
