- pgno: 16
  md: '# 可以打开电源了...


    计算模型⇒我们要关注指针IP及其指向的内容


    +   - 计算机刚打开电源时， IP=?

    +   - 由硬件设计者决定!


    > 和保护模式对应，实模式的寻址CS:IP(CS左移4位+IP)，和保护模式不一样!


    看看x86 PC


    +   (1) x86 PC刚开机时CPU处于实模式

    +   (2) 开机时， CS=0xFFFF; IP=0x0000

    +   (3) 寻址0xFFFF0(ROM BIOS映射区)

    +   (4) 检查RAM，键盘，显示器，软硬磁盘

    +   (5) 将磁盘0磁道0扇区读入0x7c00处

    +   (6) 设置cs=0x07c0， ip=0x0000


    ![](img/365fc74cce32b405409a65a7e8830bec_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 0x7c00处存放的代码


    +   ■ 就是从磁盘引导扇区读入的那512个字节


    +   ■ 引导扇区就是启动设备的第一个扇区


    +   ■ 启动设备信息被设置在CMOS中...


    > 开机时按住del键可进入启动设备设置界面，可以设置为光盘启动！


    > CMOS: 互补金属氧化物半导体(64B-128B)。用来存储实时时钟和硬件配置信息。


    +   ■ 因此，硬盘的第一个扇区上存放着开机后执行的第一段我们可以控制的程序。


    +   ■ 操作系统的故事从这里开始...'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# 引导扇区代码：bootsect.s\n\n```\n.globl begtext,begdata,begbss,endtext,enddata,endbss\n\
    .text  //文本段\nbegtext:\n.data  //数据段\nbegdata:\n.bss   //未初始化数据段\nbegbss:\nentry\
    \ start //关键字entry告诉链接器 “程序入口”\nstart:\n    mov ax, #BOOTSEG      mov ds, ax\n\
    \    mov ax, #INITSEG      mov es, ax\n    mov cx, #256\n    sub si, si      \
    \      sub di,di\n    rep  movsw\n    jmp  go, INITSEG\n```\n\n.text等是伪操作符，告诉编译器产生文本段，.text用于标识文本段的开始位置。\n\
    此处的.text、.data、.bss表明这3个段重叠，不分段！\n\n此条语句就是0x7c00处存放的语句！\n\n将0x07c0:0x0000处的256个字移动到0x9000:0x0000处\n\
    \nBOOTSEG = 0x07c0\nINITSEG = 0x9000\nSETUPSEG = 0x9020"
  merge: -1
  img_proc: true
- pgno: 19
  md: "# jmp i go, INITSEG\n\njmp i (jump intersegment段间跳转): cs=INITSEG, ip=go\n\n\
    ```\ngo: mov ax,cs //cs=0x9000\n    mov ds,ax  mov es,ax  mov ss,ax  mov sp,#0xfff0\n\
    load_setup: //载入setup模块\n    mov dx,#0x0000  mov cx,#0x0002  mov bx,#0x0200\n\
    \    mov ax,#0x0200+SETUPLEN  int 0x13 //BIOS中断\n    jnc ok_load_setup\n    mov\
    \ dx,#0x0000\n    mov ax,#0x0000 //复位\n    int 0x13\n    j load_setup //重读\n```\n\
    \n为call做准备!\n\n0x13是BIOS读磁盘扇区的中断: ah=0x02-读磁盘, al=扇区数量(SETUPLEN=4), ch=柱面号, cl=开始扇区,\
    \ dh=磁头号, dl=驱动器号, es:bx=内存地址\n\n![](img/365fc74cce32b405409a65a7e8830bec_19_0.png)\n\
    \n启动盘\n\nboot扇区\n\nsetup的4个扇区\n\nsystem模块(OS代码)\n\nOperating System"
  merge: -1
  img_proc: true
- pgno: 20
  md: "# 读入setup模块后：ok_load_setup\n\n```\nok_load_setup:   //载入setup模块\n    mov dl,#0x00\
    \   mov ax,#0x0800  //ah=8获得磁盘参数\n    int 0x13       mov ch,#0x00    mov sectors,cx\n\
    \    mov ah,#0x03   xor bh,bh       int 0x10 //读光标\n    mov cx,#24     mov bx,#0x0007\n\
    \    mov bp,#msg1    mov ax,#1301     int 0x10 //显示字符\n    mov ax,#SYSSEG  //SYSSEG=0x1000\n\
    \    mov es,ax\n\n    call read_it //读入system模块\n\n    jmpi 0,SETUPSEG\n```\n\n\
    > 显示这24个字符将是大家的第一个“创举”！\n\n> 7是显示属性！\n\n> 转入0x9020:0x0000\n> 执行setup.s\n\n+  \
    \ - boot工作:读setup，\n+     读system...\n\n```\nbootsect.s中的数据  //在文件末尾\nsectors:\
    \ .word 0  //磁道扇区数\nmsg1:.byte 13,10\n      .ascii “Loading system...”\n     \
    \ .byte 13,10,13,10\n```\n\n![](img/365fc74cce32b405409a65a7e8830bec_20_0.png)"
  merge: -1
  img_proc: true
- pgno: 21
  md: "# read_it //读入system模块\n\n+   为什么读入system模块还需要定义一个函数？\n\n```\nread_it:  mov\
    \ ax,es      cmp ax,#ENDSEG      jb ok1_read\n          ret\nok1_read:\n    mov\
    \ ax,sectors\n    sub ax,sread //sread是当前磁道已读扇区数,ax未读扇区数\n    call read_track\
    \ //读磁道...\n```\n\nsystem模块可能很大，要跨越磁道！\n\nENDSEG=SYSSEG+SYSSIZE\nSYSSIZE=0x8000\
    \ //该变量可根据Image大小设定(编译操作系统时)\n\n+   引导扇区的末尾 //BIOS用以识别引导扇区\n\n```\n.org 510\n\
    .word 0xAA55 //扇区的最后两个字节\n```\n\n否则会打出非引导设备\n\n+   可以转入setup执行了，jmp 0, SETUPSEG"
  merge: -1
  img_proc: true
