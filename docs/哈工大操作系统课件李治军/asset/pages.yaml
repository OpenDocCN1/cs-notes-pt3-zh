- pgno: 184
  md: "# 找到哪些地方要停，什么时候再走？\n\n需要让“进程走走停停”来保证多进程合作的合理有序\n\n# 这就是进程同步\n\n```\nwhile (true)\
    \ {\n while(counter== BUFFER_SIZE)\n 缓存区满，生产者要停;\n buffer[in] = item;\n in = (in\
    \ + 1) % BUFFER_SIZE;\n counter++;\n }\n```\n\n```\nwhile (true) {\n while(counter==\
    \ 0)\n 缓存区空，消费者要停;\n item = buffer[out];\n out = (out + 1) % BUFFER_SIZE;\n counter--;\n\
    \ }\n```\n\n> 发信号让消费者再走...\n\n> 发信号让生产者再走...\n\n![](img/365fc74cce32b405409a65a7e8830bec_184_0.png)"
