- pgno: 23
  md: '# setup模块，即setup.s


    根据名字就可以想到: setup将完成OS启动前的设置


    ```

    start: mov ax,#INITSEG      mov ds,ax      mov ah,#0x03

    xor bh,bh  int 0x10//取光标位置dx  mov [0],dx

    mov ah,#0x88  int 0x15  mov [2],ax ...

    cli ///不允许中断

    mov ax,#0x0000  cld

    do_move: mov es,ax  add ax,#0x1000

    cmp ax,#0x9000  jz end_move

    mov ds,ax  sub di,di

    sub si,si

    mov cx,#0x8000

    rep movsw

    jmp do_move

    ```


    取出光标位置(包括其他硬件参数)到0x90000处


    扩展内存大小


    SYSSEG = 0x1000


    将system模块移到0地址


    | 内存地址 | 长度 | 名称 |

    |---|---|---|

    | 0x90000 | 2 | 光标位置 |

    | 0x90002 | 2 | 扩展内存数 |

    | 0x9000C | 2 | 显卡参数 |

    | 0x901FC | 2 | 根设备号 |'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# 将setup移到0地址处...\n\n+   - 但0地址处是有重要内容的\n+   - 以后不调用int指令了吗？\n+   - 因为操作系统要让硬件进入保护模式了...\n\
    +   - 保护模式下int n和cs:ip解释不再和实模式一样\n\n前面的int指令才可以使用！\n\n用GDT将cs:ip变成物理地址\n\n又一个函数表\n\
    \n进入保护模式的命令...\n\n```\nend_move: mov ax,#SETUPSEG    mov ds,ax\n    lidt idt_48\
    \    lgdt gdt 48//设置保护模式下的中断和寻址\nidt_48:.word 0  .word 0,0 //保护模式中断函数表\ngdt_48:.word\
    \ 0x800  .word 512+gdt,0x9\ngdt: .word 0,0,0,0\n    .word 0x07FF, 0x0000, 0x9A00,\
    \ 0x00C0\n    .word 0x07FF, 0x0000, 0x9200, 0x00C0\n```\n\n| 地址 | 描述 |\n|------|------|\n\
    | 0xFFFFFFFF | ROM BIOS |\n| 0x100000 | ROM BIOS映射区 |\n| 0xF0000 |  |\n| 0x00000000\
    \ | 中断向量表 |\n\n![](img/365fc74cce32b405409a65a7e8830bec_24_0.png)"
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 保护模式下的地址翻译和中断处理


    保护模式下的地址翻译


    即gdt的作用


    cs:ip


    GDT


    物理内存地址


    t是table，所以实模式下:cs左移4+ip。保护模式下:根据cs查表+ip


    保护模式下中断处理函数入口


    即idt的作用


    int n


    IDT


    中断处理函数入口


    t仍是table，仿照gdt，通过int n的n进行查表'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 进入保护模式


    ```

    call empty_8042    mov al,#0xD1    out #0x64,al

    //8042是键盘控制器，其输出端口P2用来控制A20地址线

    call empty_8042    mov al,#0xDF    out #0x60,al

    //选通A20地址线    call empty_8042

    初始化8259（中断控制） //一段非常机械化的程序

    mov ax,#0x0001    mov cr0,ax

    jmpI 0,8

    ```


    D1表示写数据到8042的P2端口


    cr0一个非常酷的寄存器


    ![](img/365fc74cce32b405409a65a7e8830bec_26_0.png)


    PE=1启动保护模式，PG=1启动分页


    ```

    empty_8042:

    .word 0x00eb,0x00eb

    in al,#0x64

    test al,#2

    jnz empty_8042

    ret

    ```


    jmpI 0,8 //cs=8用来查gdt'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# jmpl 0,8 //gdt中的8


    jmp到内存0x0000处

    是system模块!


    ```

    gdt: .word 0,0,0,0

    .word 0x07FF, 0x0000, 0x9A00, 0x00C0

    .word 0x07FF, 0x0000, 0x9200, 0x00C0

    ```


    两个gdt项, 都是0x0000, 一个只读(代码), 一个读写(数据)


    | 4 | 段基址31..24 | G | 段限长19..16 | P | DPL | 段基址23..16 |

    | 0 | 段基址15.0 |  | 段限长15.0 |  |  |  |


    ![](img/365fc74cce32b405409a65a7e8830bec_27_0.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: "# 跳到system模块执行...\n\n+   - system模块(目标代码)中的第一部分代码？ head.s\n\n+   - system由许多文件编译而成，为什么是head.s？\n\
    \n```\ndisk: Image\n  dd bs=8192 if=Image of=/dev/PS0\nImage: boot/bootsect  boot/setup\
