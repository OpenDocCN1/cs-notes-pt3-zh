- pgno: 197
  md: '# 临界区代码的保护原则


    基本原则：互斥进入：如果一个进程在临界区中执行，则其他进程不允许进入


    +   这些进程间的约束关系称为互斥(mutual exclusion)


    +   这保证了是临界区


    好的临界区保护原则


    +   2. 有空让进：若干进程要求进入空闲临界区时，应尽快使一进程进入临界区


    +   3. 有限等待：从进程发出进入请求到允许进入，不能无限等待


