  md: '# 从OS/360到MULTICS(1965-1980)


    计算机进入多个行业，使用人数增加


    +   - 如果每个人启动一个作业，作业之间快速切换

    +   - 分时系统(timesharing)

    +   - 代表： MIT MULTICS (MULTiplexed Information and Computer Service)

    +   - 核心仍然是任务切换，但是资源复用的思想对操作系统影响很大，虚拟内存就是一种复用


