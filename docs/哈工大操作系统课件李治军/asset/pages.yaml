    \n```\nsys_setup(void * BIOS)//在kernel/hd.c中\n{ hd_info[drive].head = *(2+BIOS);\n\
    \  hd_info[drive].sect = *(14+BIOS);\n  mount_root(); ... }\n```\n\n```\nvoid\
    \ mount_root(void)//在fs/super.c中\n{\n  mi=iget(ROOT_DEV,ROOT_INO));\n  current->root\
    \ = mi;\n}\n```\n\n```\n#define ROOT_INO 1\n```\n\n![](img/365fc74cce32b405409a65a7e8830bec_370_0.png)"
