  md: "# 开始目录解析 — find_entry(&inode,name,...,&de)\n\nde: directory entry(目录项)\n\n\
    ```\nstruct dir_entry{\n  unsigned short inode; //i节点号\n  char name[NAME_LEN];\
    \ //文件名 }\n```\n\n```\n#define NAME_LEN 14\n```\n\n```\n在fs/namei.c中\nstatic struct\
    \ buffer_head *find_entry(struct m_inode **dir, char *name, ..., struct dir_entry\
    \ ** res_dir)\n{ int entries=(*dir)->i_size/(sizeof(struct dir_entry));\nint block=(*dir)->i_zone[0];\n\
    *bh=bread((*dir)->i_dev, block);\nstruct dir_entry *de =bh->b_data;\nwhile(i<entries)\
    \ {\n  if(match(namelen,name,de))\n  {*res_dir=de; return bh;}de++; i++;} }\n\
    ```\n\n![](img/365fc74cce32b405409a65a7e8830bec_372_0.png)"
