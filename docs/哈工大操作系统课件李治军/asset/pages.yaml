- pgno: 167
  md: '# 面对诸多场景，如何设计调度算法？


    我们的算法应该让什么更好？


    +   - 面对客户: 银行调度算法的设计目标应该是 用户满意

    +   - 面对进程: CPU调度的目标应该是 进程满意


    那怎么才能让进程满意呢？ 时间...


    +   - 尽快结束任务: 周转时间(从任务进入到任务结束)短

    +   - 用户操作尽快响应: 响应时间(从操作发生到响应)短

    +   - 系统内耗时时间少: 吞吐量(完成的任务量)


    总原则: 系统专注于任务执行，又能合理调配任务...


    ![](img/365fc74cce32b405409a65a7e8830bec_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
