  md: '# 临界区 (Critical Section)


    临界区：一次只允许一个进程进入的该进程的那一段代码


    生产者 P₁


    ```

    empty--;

    ```


    生产者 P₂


    ```

    empty--;

    ```


    这就是临界区


    +   - 一个非常重要的工作：找出进程中的临界区代码


    > 读写信号量的代码一定是临界区…


    | 进程代码结构 |

    |---|

    | 剩余区 |

    | 进入区 |

    | 临界区 |

    | 退出区 |

    | 剩余区 |


    这是我们要解决的核心'
