  md: "# 处理中断page fault\n\n```\n//在linux/mm/page.s中\n.globl _page_fault\n    xchgl\
    \ %eax, (%esp)\n    pushl %ecx\n    pushl %edx\n    push %ds\n    push %es\n \
    \   push %fs\n    movl $0x10, %edx\n    mov %dx, %ds\n    mov %dx, %es\n    mov\
    \ %dx, %fs\n    movl %cr2, %edx\n\n注释：错误码被压到了栈中\n注释：页错误线性地址\n```\n\n```\npushl\
    \ %edx\npushl %eax\ntestl $1, %eax\njne 1f\ncall _do_no_page\njmp 2f\n1: call\
    \ _do_wp_page //保护\n2: add $8, %esp\npop %fs\npop %es\npop %ds\npop %edx\npop\
    \ %ecx\npop %eax\niret\n\n注释：压入参数\n注释：测试标志P\n```"
