- pgno: 189
  md: "# 什么是信号量？信号量的定义...\n\n信号量: 1965年，由荷兰学者Dijkstra提出的一种特殊整型变量，量用来记录，信号用来sleep和wakeup\n\
    \n```\nstruct semaphore\n{\n    int value; //记录资源个数\n    PCB *queue;\n    //记录等待在该信号量上的进程\n\
    }\nP(semaphore s);    //消费资源\nV(semaphore s);    //产生资源\n```\n\n```\nP(semaphore\
    \ s)\n{\n    s.value--;\n    if(s.value < 0) {\n        sleep(s.queue); }\n}\n\
    ```\n\n问题: 写出V(s)的代码？\n\nP的名称来源于荷兰语的proberen，即test\nV的名称也来源于荷兰语verhogen(increment)"
  merge: -1
  img_proc: true
