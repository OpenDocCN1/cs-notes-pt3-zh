  md: '# fd=1的filp从哪里来？


    因为是被current指向，所以是从fork中来


    ```

    int copy_process(...){\n*p = *current;\nfor (i=0; i<NR_OPEN;i++)\n    if ((f=p->filp[i]))
    f->f_count++;

    ```


