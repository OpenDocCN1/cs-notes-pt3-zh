- pgno: 221
  md: '# 死锁预防的方法例子


    +   - 在进程执行前，**一次性申请所有需要的资源**，不会占有资源再去申请其它资源

    +     - 缺点1: 需要预知未来，编程困难

    +     - 缺点2: 许多资源分配后很长时间后才使用，资源利用率低


    +   - 对资源类型进行排序，**资源申请必须按序进行**，不会出现环路等待

    +     - 缺点: 仍然造成资源浪费


    问题: 为什么使用这两种方法，一定不会死锁？


    ![](img/365fc74cce32b405409a65a7e8830bec_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 死锁避免：判断此次请求是否引起死锁？


    +   如果系统中的所有进程存在一个可完成的执行序列P₁，...Pₙ，则称系统处于安全状态


    都能执行完成当然就不死锁


    +   安全序列：上面的执行序列P₁，...Pₙ


    如何找？


    | Allocation | Need | Available |

    | A B C | A B C | A B C |

    | P0 | 0 1 0 | 7 4 3 | 2 3 0 |

    | P1 | 3 0 2 | 0 2 0 | |

    | P2 | 3 0 2 | 6 0 0 | |

    | P3 | 2 1 1 | 0 1 0 | |

    | P4 | 0 0 2 | 4 3 1 | |


    问题：下面哪个是安全序列( )？


    +   A. P1, P3, P2, P4, P0

    +   B. P0, P1, P2, P3, P4

    +   C. P3, P0, P1, P2, P4

    +   D. P3, P4, P1, P2, P0


    ![](img/365fc74cce32b405409a65a7e8830bec_222_0.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: "# 找安全序列的银行家算法(Dijkstra提出)\n\n```\nint Available[1..m]; //每种资源剩余数量\nint Allocation[1..n,1..m];\
    \ //已分配资源数量\nint Need[1..n,1..m];//进程还需的各种资源数量\nint Work[1..m]; //工作向量\nbool Finish\
    \ [1..n]; //进程是否结束\n```\n\n```\nWork = Available; Finish[1..n] = false;\nwhile(true){\n\
    \    for(i=1; i<=n; i++){\n        if(Finish[i]==false && Need[i]<=Work){\n  \
    \          Work = Work + Allocation[i];\n            Finish[i] = true; break;}\n\
    \        else {goto end;}\n    }\n}\nEnd: for(i=1;i<=n;i++)\n    if(Finish[i]==false)\
    \ return \"deadlock\";\n```\n\n![](img/365fc74cce32b405409a65a7e8830bec_223_0.png)"
  merge: -1
  img_proc: true
