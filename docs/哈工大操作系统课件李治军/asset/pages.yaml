- pgno: 204
  md: '# Peterson算法的正确性


    +   满足互斥进入：

    +   如果两个进程都进入，则 flag[0]=flag[1]=true, turn==0==1，矛盾！


    +   满足有空让进：

    +   如果进程P₁不在临界区，则 flag[1]=false，或者turn=0，都P₀能进入！


    +   满足有限等待：

    +   P₀要求进入，flag[0]=true; 后面的P₁不可能一直进入，因为P₁执行一次就会让turn=0。


    ```

    flag[i] = true;

    turn = j;

    while (flag[j] && turn == j) ;

    ```


    临界区


    ```

    flag[i] = false;

    ```


    剩余区


    进程Pᵢ'
