- pgno: 220
  md: '# 死锁处理方法概述


    ![](img/365fc74cce32b405409a65a7e8830bec_220_0.png)


    +   死锁预防 “no smoking”, 预防火灾


    +   破坏死锁出现的条件


    +   死锁避免 检测到煤气超标时，自动切断电源


    +   检测每个资源请求，如果造成死锁就拒绝


    +   死锁检测+恢复 发现火灾时，立刻拿起灭火器


    +   检测到死锁出现时，让一些进程回滚，让出资源


    +   死锁忽略 在太阳上可以对火灾全然不顾


    +   就好像没有出现死锁一样


    ![](img/365fc74cce32b405409a65a7e8830bec_220_1.png)'
