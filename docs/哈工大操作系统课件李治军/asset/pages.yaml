  md: "# 从纸上到实际：生产者-消费者实例\n\n共享数据\n\n```\n#define BUFFER_SIZE 10\ntypedef struct {\
    \ ... } item;\nitem buffer[BUFFER_SIZE];\nint in = out = counter = 0;\n```\n\n\
    注意：这些都是用户态程序！\n\n生产者进程\n\n```\nwhile (true) {\n  while(counter== BUFFER_SIZE)\n\
    \    ;\n  buffer[in] = item;\n  in = (in + 1) % BUFFER_SIZE;\n  counter++;\n}\n\
    ```\n\n消费者进程\n\n```\nwhile (true) {\n  while(counter== 0)\n    ;\n  item = buffer[out];\n\
    \  out = (out + 1) % BUFFER_SIZE;\n  counter--;\n}\n```"
