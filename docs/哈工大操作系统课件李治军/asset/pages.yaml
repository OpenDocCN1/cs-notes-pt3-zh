- pgno: 338
  md: "# 生磁盘(raw disk)的使用整理\n\n![](img/365fc74cce32b405409a65a7e8830bec_338_0.png)\n\
    \n+   (1) 进程“得到盘块号”，算出扇区号(sector)\n\n+   (2) 用扇区号make req，用电梯算法add_request\n\n\
