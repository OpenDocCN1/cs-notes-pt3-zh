  md: '# # 内核(用户)态，内核(用户)段


    +   ■ 将内核程序和用户程序隔离!!!


    +   ■ 区分内核态和用户态：一种处理器 “硬件设计”


    ![](img/365fc74cce32b405409a65a7e8830bec_44_0.png)


    当前程序执行在什么态(哪层环)?由于CS:IP是当前指令,所以用CS的最低两位来表示: 0是内核态, 3是用户态


    +   ■ 内核态可以访问任何数据，用户态不能访问内核数据


    +   ■ 对于指令跳转也一样实现了隔离...


    访问的数据段DS的最低两位


    > CPL(CS)

    > RPL(DS)

    > DPL


    > DPL≥CPL

    > DPL≥RPL


    ![](img/365fc74cce32b405409a65a7e8830bec_44_1.png)


    ![](img/365fc74cce32b405409a65a7e8830bec_44_2.png)'
