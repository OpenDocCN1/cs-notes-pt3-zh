  md: '# 硬件提供了“主动进入内核的方法”


    +   对于Intel x86，那就是中断指令int


    +   int指令将使CS中的CPL改成0，“进入内核”


    +   这是用户程序发起的调用内核代码的唯一方式


    此时，CPL=3而 DPL=0


    +   系统调用的核心：


