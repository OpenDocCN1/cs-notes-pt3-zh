    # 4.7 关键路径算法


    # AOE网（Activity On Edge Network）


    +   在带权的 有向图中，用结点表示事件，用边表示活动，边上权表示活动的开销（如持续时间），则称此有向图为边表示活动的网络，简称AOE网。


    +   下图是有11项活动，9个事件的AOE网，每个事件表示在它之前的活动已经完成，在它之后的活动可以开始。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_448_0.png)'
  - '[PAGE 449]


    # 第4章图结构及其应用算法


    # 4.7 关键路径算法(cont.)


    # AOE网的性质


    +   - 只有在某个顶点所代表的事件发生后，从该顶点出发的各有向边代表的活动才能开始；

    +   - 只有在进入某一顶点的各有向边代表的活动已经结束，该顶点所代表的事件才能发生；

    +   - 表示实际工程计划的AOE网应该是无环的，并且存在唯一的入度为0的开始顶点（源点）和唯一的出度为0的结束点（汇点）。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_449_0.png)'
  - '[PAGE 450]


    # 4.7 关键路径算法(cont.)


    # AOE网研究的主要问题：


    如果用AOE 网表示一项工程，那么仅仅考虑各个子工程之间的优先关系还不够，更多地是关心整个工程完成的最短时间是多少，哪些活动的延迟将影响整个工程进度，而加速这些活动能否提高整个工程的效率，因此AOE网有待研究的问题是：


    +   (1)完成整个工程至少需要多少时间？


    +   (2)哪些活动是影响工程进度的关键活动？


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_450_0.png)'
  - '[PAGE 451]


    # 4.7 关键路径算法(cont.)


    路径长度、关键路径、关键活动：


    +   路径长度：是指从源点到汇点路径上所有活动的持续时间之和。


    +   关键路径：在AOE网中，由于有些活动可以并行，所以完成工程的最短时间是从源点到汇点的最大路径长度。因此，把从源点到汇点具有最大长度的路径称为关键路径。


    +   一个AOE中，关键路径可能不只一条。


    +   关键活动：关键路径上的活动称为关键活动。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_451_0.png)'
