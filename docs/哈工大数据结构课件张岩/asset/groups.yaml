    任意两个顶点之间的最短路径


    问题描述：已知一个带权的有向图G=（V，E），对每一对顶点v_i，v_j ∈ V，（i≠j），要求求出v_i与v_j之间的最短路径和最短路径长度。限制条件：不允许有负长度的环路。


    Floyd算法的基本想法：动态规划算法


    +   如果v_i与v_j之间有有向边，则v_i与v_j之间有一条路径，但不一定是最短的；也许经过某些中间点会使路径长度更短。


    +   经过哪些中间点会使路径长度缩短呢？经过哪些中间点会使路径长度最短呢？


    +   只需尝试在原路径中间加入其它顶点作为中间顶点。


    +   如何尝试？


    +   系统地在原路径中间加入每个顶点，然后不断地调整当前路径(长度)'
  md: "\n## 4.5 最短路径算法\n\n### 最短路径(Shortest Path)问题\n\n+ 如果图中从一个顶点可以到达另一个顶点，则称这两个顶点间存在一条路径。\n\
    + 从一个顶点到另一个顶点间可能存在多条路径，而每条路径上经过的边数并不一定相同。\n+ 如果图是一个带权图，则路径长度为路径上各边的权值的总和，两个顶点间路径长度最短的那条路径称为两个顶点间的最短路径，其路径长度称为最短路径长度。\n\
    + 如何找到一条路径使得沿此路径上各边上的权值总和达到最小？\n+ 集成电路设计、GPS导航、路由选择、铺设管线等\n\n## 4.5 最短路径算法(cont.)\n\
    \n+ - 边上权值非负情形的单源最短路径问题\n  — Dijkstra算法 √\n+ - 边上权值为任意值的单源最短路径问题\n  — Bellman和Ford算法\
