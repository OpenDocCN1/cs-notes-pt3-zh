    \ v_i 和顶点 v_j，若存在边(v_i，v_j)，则称顶点 v_i 和顶点 v_j 相邻，互为邻接点，同时称边(v_i，v_j)依附于顶点 v_i 和顶点\
    \ v_j。\n\n如：v2 的邻接点： v1，v3，v5\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_366_1.png)\n\
    \n在有向图中，对于任意两个顶点 v_i 和顶点 v_j，若存在有向边<v_i，v_j>，则称顶点 v_i 邻接到顶点 v_j，顶点 v_j 邻接于顶点 v_i，同时称弧<v_i，v_j>依附于顶点\
    \ v_i 和顶点 v_j。\n\n如：v1 的邻接到 v2， v1 邻接于 v4\n\n## 4.1 基本定义(cont.)\n\n### 定义2 度(Degree)\n\
