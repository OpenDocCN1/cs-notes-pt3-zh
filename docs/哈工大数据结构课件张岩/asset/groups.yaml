    # ◆ 连通图与连通分量


    +   - **顶点的连通性：** 在无向图中，若从顶点 $v_i$ 到顶点 $v_j$（$i\ne j$）有路径，则称顶点 $v_i$ 与 $v_j$ 是连通的。

    +   - **连通图：** 如果一个无向图中任意一对顶点都是连通的，则称此图是连通图。

    +   - **连通分量：** 非连通图的极大连通子图叫做连通分量。


