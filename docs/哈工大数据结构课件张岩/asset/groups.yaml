  - '[PAGE 649]


    # 7.3 磁盘文件的归并排序


    # 多路归并——减少归并遍数


    在K路归并时，从K个关键字中选择最小记录时，要比较K-1次。若记录总数为n，每遍要比较n*(K-1)次，⌈log_K m⌉遍要比较的次数为：


    n*(K-1)⌈log_K m⌉ = n*(K-1)⌈log₂m/log₂K⌉


    可以看出，随着K增大，(K-1)/log₂K也增大，当归并路数多时，CPU处理的时间也随之增多。当K值增大到一定程度时，可能使CPU处理时间大于因K值增大而减少归并遍数所节省的时间。


    为此可以


    +   - (1) 选择好的排序方法，以减少排序中比较次数;

    +   - (2) 选择好的初始归并段形成方法，增大归并段长度提高排序的效率。'
