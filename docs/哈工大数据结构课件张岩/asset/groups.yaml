    \n**栈的操作的实现**\n\n**① void MakeNull(STACK &S)**\n\n```c\nvoid MakeNull(STACK &S)\n\
    {\n    S.top = -1;\n}\n```\n\n**② Boolean Empty(STACK S)**\n\n```c\nBoolean Empty(STACK\
    \ S)\n{\n    if (S.top < 0)\n        return TRUE;\n    else\n        return FALSE;\n\
    }\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_109_0.png)\n\n**③ ElemType\
    \ Top(STACK S)**\n\n```c\nElemType Top(STACK S)\n{\n    if (Empty(S))\n      \
    \  return NULL;\n    else\n        return (S.elements[S.top]);\n}\n```\n\n**④\
    \ void Pop(STACK &S)**\n\n```c\nvoid Pop(STACK &S)\n{\n    if (Empty(S))\n   \
    \     cout << \"栈空\";\n    else\n        S.top = S.top - 1;\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_110_0.png)\n\
    \ntop\n\nmax-1\n\n**⑤ void Push(ElemType x, STACK &S)**\n\n```c\nvoid Push(ElemType\
    \ x, STACK &S)\n{\n    if (S.top == max - 1)\n        cout << \"栈满\";\n    else\n\
    \    {\n        S.top = S.top + 1;\n        S.elements[S.top] = x;\n    }\n}\n\
    ```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_111_0.png)\n\n#### 2.3.2 栈的指针实现——链栈\n\
    \n栈的链接存储结构及实现\n\n- 链栈：栈的链接存储结构\n\n如何改造链表实现栈的链接存储？\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_112_0.png)\n\
    \n将哪一端作为栈顶？将链表首端作为栈顶，方便操作。\n\n链栈需要加头结点吗？表头结点的作用与链表相同。\n\n**栈的链式存储结构定义**\n\n```c\n\
    struct node {\n    ElemType data;\n    node *next;\n}; // 结点的\"型\"\ntypedef node\
    \ *STACK; // 栈的\"型\"\n```\n\n两种示意图在内存中对应同一种状态\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_113_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_113_1.png)\n\n**栈的操作的实现**\n\n**① STACK\
    \ MakeNull()**\n\n```c\nSTACK MakeNull()\n{\n    STACK s;\n    s = new node;\n\
    \    /* s = (node *)malloc(sizeof(node)); */\n    s->next = NULL;\n    return\
    \ s;\n}\n```\n\n**② Boolean Empty(STACK stk)**\n\n```c\nBoolean Empty(STACK stk)\n\
    {\n    if (stk->next)\n        return FALSE;\n    else\n        return TRUE;\n\
    }\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_114_0.png)\n\n**④ void Pop(STACK\
    \ stk)**\n\n```c\nvoid Pop(STACK stk)\n{\n    STACK s;\n    if (stk->next) { /*\
    \ stk->next != NULL */\n        s = stk->next;\n        stk->next = s->next;\n\
    \        delete s;  /* free(s) */\n    }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_116_0.png)\n\
    \n#### 2.3.3 栈与递归调用\n\n**递归调用的定义**\n\n子程序（或函数）直接调用自己或通过一系列调用语句间接调用自己。是一种描述问题和解决问题的基本方法。\n\
    \n**递归的基本思想**\n\n把一个不能或不好求解的大问题转化为一个或几个小问题，再把这些小问题进一步分解成更小的小问题，直至每个小问题都可以直接求解。\n\
    \n**递归的要素**\n\n- 递归边界条件：确定递归到何时终止，也称为递归出口；\n- 递归模式：大问题是如何分解为小问题的，也称为递归体\n\n**递归调用举例**\n\
    \n**求阶乘的函数**\n\n```text\nn! = { 1 当 n=1 时\n       n * (n - 1)! 当 n≥1 时 }\n```\n\
    \n**递归算法**\n\n```c\nlong fact(int n)\n{\n    if (n == 0) return 1;\n    else return\
    \ n * fact(n - 1);\n}\n```\n\n**求解阶乘 n! 的过程**\n\n```text\n递归调用\n计算 fact(4)\n计算\
    \ 4*fact(3)\n计算 3*fact(2)\n计算 2*fact(1)\n计算 fact(1)\n\n回求值\n返回 24\n返回 6\n返回 2\n\
    返回 1\n```\n\n- 递归过程在实现时，需要自己直接或间接调用自己。\n- 层层向下递归，返回次序正好相反：\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_121_0.png)\n"
