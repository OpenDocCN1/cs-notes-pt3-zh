  md: "\n# 5.7 B-树和B+树（Cont.）\n\n## B-树高度h与关键字个数N之间的关系\n\n+ 设 m 阶B-树的高度为h，失败结点位于第\
    \ h+1 层，在这棵B-树中关键字个数 N 最小能达到多少？\n+ 从B-树的定义知，\n+ 1层 1 个结点\n+ 2层 至少 2 个结点\n+ 3层\
    \ 至少 2⌈m / 2⌉ 个结点\n+ 4层 至少 2⌈m / 2⌉² 个结点\n+ 如此类推，……\n+ h 层 至少有 2⌈m / 2⌉^{h-2}\
    \ 个结点。\n+ 上述的所有结点都不是失败结点。\n\n+ 设 m 阶 B-树中关键字有 N 个，则失败结点数为 N + 1，即 N + 1 = 失败结点数\
    \ = \n= 位于第 h + 1 层的结点数 ≥ 2⌈m / 2⌉^{h - 1}\nN ≥ 2⌈m / 2⌉^{h - 1} - 1\n- 反之，如果在一棵\
    \ m 阶 B-树中有 N 个关键字，则\nh - 1 ≤ log_{⌈m / 2⌉}((N + 1) / 2)\n- 例，若 B-树的阶数 m = 199，关键字总数\
    \ N = 1999999，则 B-树的高度 h 不超过\nlog_{⌈199 / 2⌉}((1999999 + 1) / 2) + 1 = log_{100}\
    \ 1000000 + 1 = 4\n- 若 B-树的阶数 m = 3，高度 h = 4，则关键字总数至少为\nN = 2⌈3 / 2⌉^{4 - 1} -\
    \ 1 = 15\n\n## B-树的阶 m 值的选择\n\n+ 如果提高 B-树的阶数 m，可以减少树的高度，从而减少读入结点的次数，因而可减少读磁盘的次数。\n\
    + 但是，m 受到内存可使用空间的限制。当 m 很大超出内存工作区容量时，结点不能一次读入到内存，增加了读盘次数，也增加了结点内查找的难度。\n+ m 值的选择：应使得在\
    \ B-树中找到关键字 x 的时间总量达到最小\n+ 这个时间由两部分组成：\n  - 从磁盘中读入结点所用时间\n  - 在结点中查找 x 所用时间\n\n\
    ## B-树的查找操作\n\n+ B-树的查找过程是一个**顺指针查找结点**和**在结点中查找交替**进行的过程。\n+ 因此，B-树的**查找时间**与\n\
    \  - B-树的**阶数**$m$和\n  - B-树的**高度**$h$\n  直接有关，必须加以权衡。\n+ 在B-树上进行查找，\n  - **查找成功**所需的时间取决于**关键字值所在的层次**；\n\
    \  - **查找不成功**所需的时间取决于**树的高度**。\n\n## B-树的插入操作与建立\n\n+ B-树是从空树起，逐个插入关键字而生成的。\n\
    + 在B-树，每个非失败结点的关键字个数都在 [⌈m/2⌉-1, m-1] 之间。\n+ 插入操作，首先执行查找操作以确定可以插入新关键字的终端结点 p；\n\
    + 如果在关键字插入后，结点中的关键字个数超出了上界 m-1，则结点需要“分裂”，否则可以直接插入。\n+ 实现结点“分裂”的原则是：设结点 p 中已经有\
    \ m-1 个关键字，当再插入一个关键字后结点中的状态为： (m, A0, K1, A1, K2, A2, …… , Km, Am) 其中 Ki < Ki+1,\
    \ 1 ≤ i < m\n\n此时必须把结点 p 分裂成两个结点 p 和 q，它们包含的信息分别为：\n\n结点 p：\n（⌈m/2⌉-1 A₀, K₁,\
