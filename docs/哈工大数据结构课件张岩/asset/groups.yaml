  - "[PAGE 495]\n\n# 5.5 二叉查找树BST（Cont.）\n\n二叉查找树的查找操作：\n\n```\nBSTNode * SearchBST(\
    \ keytype k, BST F )\n{  BSTNode * p = F;\n    if( p == NULL || k == p->data.key\
    \ ) /* 递归终止条件 */\n        return  p;\n    if( k < p->data.key )\n        return\
    \ ( SearchBST ( k, p->lchild ) ); /* 查找左子树 */\n    else\n        return ( SearchBST\
    \ ( k, p->rchild ) ); /* 查找右子树 */\n}\n```"
  - "[PAGE 496]\n\n# 5.5 二叉查找树BST（Cont.）\n\n二叉查找树的插入操作\n\n+   - 若二叉排序树为空树，则新插入的结点为根结点；\n\
    +   - 否则，新插入的结点必为一个新的叶结点。\n\n新插入的结点一定是查找不成功时，查找路径上最后一个结点的左儿子或右儿子。\n\n```\nvoid\
    \ InsertBST(records R, BST F)\n{ if( F ==NULL ){\n    F = new BSTNode ;\n    F->data\
    \ = R ;\n    F->lchild = NULL ;\n    F->rchild = NULL ;\n}else if( R.key < F->data.key\
    \ )\n    InsertBST( R , F->lchild );\nelse if( R.key > F->data.key )\n    InsertBST(\
    \ R , F->rchild );\n} //若R.key==F->data.key,则返回\n```"
