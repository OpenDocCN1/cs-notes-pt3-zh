    # 5.1 基本概念和术语（Cont.）


    # 查找的性能


    # 平均查找长度：


    +   把给定值与关键字进行比较的次数的期望值称为查找算法在查找成功时的平均查找长度--ASL(Average Search Length)。


    +   计算公式：假设查找集合中的记录个数为n，p_i为查找表中第i个记录的概率，Σ p_i =1，c_i为查找第i个记录所进行的比较次数，则 AS L =
    Σ_{i=1}^{n} p_i c_i


    +   在等概率情况下，即 p_i = 1/n 时， AS L = (1/n) Σ_{i=1}^{n} c_i'
