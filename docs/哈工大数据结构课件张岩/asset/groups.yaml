    # 普里姆（Prim）算法


    # 基本思想


    +   ① 首先从集合V中任取一顶点(如顶点v₁)放入集合U中。这时U={v₀}， TE={}


    +   ② 然后找出权值最小的边(u，v)，且u∈U，v∈(V-U)，将边加入TE，并将顶点v加入集合U


    +   ③ 重复上述操作直到U=V为止。这时TE中有n-1条边，T=(U，TE)就是G的一棵最小生成树


