    +   插入排序的主要操作是插入，其基本思想是：每次将一个待排序的记录按其关键字的大小插入到一个已经排好序的有序序列中，直到全部记录排好序为止。


    +   经过i-1遍处理后，A[1...i-1]已排好序。第i遍处理仅将A[i]插入A[1...i-1,i]的适当位置，使得A[1...i]又是排好序的序列。要达到这个目的，可以用顺序比较的方法。首先比较A[i]和A[i-1]的关键字，如果A[i-1].key
    ≤ A[i].key，由于A[1...i]已排好序，第i遍处理就结束了；否则交换A[i]与A[i-1]的位置，继续比较A[i-1]和A[i-2]的关键字，直到找到某一个位置j(1
    ≤ j ≤ i-1)，使得A[j].key ≤ A[j+1].key时为止。'
