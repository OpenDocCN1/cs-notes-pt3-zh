    # 4.3 图的搜索（遍历） (cont.)




    +   - 在图中，如何选取遍历的起始顶点？

    +     **解决办法：** 从编号小的顶点开始。


    +   - 从某个起点始可能到达不了所有其它顶点，怎么办？

    +     **解决办法：** 多次调用从某顶点出发遍历图的算法。


    +   - 图中可能存在回路，且图的任一顶点都可能与其它顶点“相通”，在访问完某个顶点之后可能会沿着某些边又回到了曾经访问过的顶点。如何避免某些顶点可能会被重复访问？

    +     **解决办法：** 附设访问标志数组visited[n] 。


    +   - 在图中，一个顶点可以和其它多个顶点相连，当这样的顶点访问过后，如何选取下一个要访问的顶点？

    +     **解决办法：** 深度优先搜索（Depth First Search）和广度优先搜索（Breadth First Search）。'
  - '[PAGE 396]


    # 4.3 图的搜索（遍历）(cont.)


    深度优先遍历----类似于树结构的前序遍历


    +   设图G的初态是所有顶点都“未访问过（False）”，在G中任选一个顶点 v 为初始出发点(源点)，则深度优先搜索可定义为：


    +   ①首先访问出发点 v，并将其标记为“访问过（True）”；


    +   ②然后，从 v 出发，依次考察与 v 相邻（邻接于或邻接到 v）的顶点 w；若 w “未访问过（False）”，则以 w 为新的出发点递归地进行深度优先搜索，直到图中所有与源点
    v 有路径相通的顶点（亦称从源点可到达的顶点）均被访问为止；


    +   ③若此时图中仍有未被访问过的顶点，则另选一个“未访问过”的顶点作为新的搜索起点，重复上述过程，直到图中所有顶点都被访问过为止。'
