    # 5.7 B-树和B+树（Cont.）


    m-路查找树：


    一棵 m-路查找树或者是一棵空树，或者是满足如下性质的树：


    +   - 根结点最多有 m 棵子树，并具有如下的结构：

    +     n, A₀, (K₁, A₁), (K₂, A₂), ..., (Kᵢ, Aᵢ), ..., (Kₙ, Aₙ)

    +     其中，Aᵢ是指向子树的指针，0 ≤ i ≤ n < m；Kᵢ是关键字值，1 ≤ i ≤ n < m。Kᵢ < Kᵢ₊₁, 1 ≤ i < n。


    +   - 子树 Aᵢ 中所有的关键字值都小于 Kᵢ₊₁ 而大于 Kᵢ。0 < i < n。


    +   - 子树 Aₙ 中所有的关键字值都大于 Kₙ；


    +   - 子树 A₀ 中的所有关键字值都小于 K₁。


    +   - 每棵子树 Aᵢ 也是 m-路查找树，0 ≤ i ≤ n


