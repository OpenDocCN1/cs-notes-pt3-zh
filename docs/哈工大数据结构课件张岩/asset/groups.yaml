  - '[PAGE 573]


    # 6.1 基本概念


    # 排序（sorting）也称分类：


    假设给定一组n个记录序列{r₁, r₂, ......, rₙ}，其相应的关键字序列为{k₁, k₂, ......, kₙ}。排序是将这些记录排列成顺序为{rₛ₁,
    rₛ₂, ......, rₛₙ}的一个序列，使得相应的关键字的

    值满足kₛ₁ ≤ kₛ₂ ≤ ...... ≤ kₛₙ（称为升序）或

    kₛ₁ ≥ kₛ₂ ≥ ...... ≥ kₛₙ（称为降序）。


    # 排序的目的：方便查询和处理。


    # 排序算法的稳定性：


    假设在待排序的记录集中，存在多个具有相同关键字值的记录，若经过排序，这些记录的相对次序仍然保持不变，即在原序列中，kᵢ=kⱼ且rᵢ在rⱼ之前，而在排序后的序列中，rᵢ仍在rⱼ之前，则称这种排序算法是稳定的；否则称为不稳定的。'
  - '[PAGE 574]


    # 6.1 基本概念（cont.）


    # 排序分类：


    +   按照排序时排序对象存放的设备，分为，


    +   内部排序: 排序过程中数据对象全部在内存中的排序。


    +   外部排序: 排序过程数据对象并非完全在内存中的排序


    +   按照排序是的基本操作是否基于关键字的比较？分为，


    +   基于比较：基本操作——关键字的比较和记录的移动，其最差时间下限已经被证明为 Ω（nlog₂n）。


    +   交换排序（气泡、快速排序）；选择排序（直接选择、堆排序）；插入排序（直接插入、折半插入、希尔排序）、归并排序（二路归并排序）。


    +   不基于比较：根据根据组成关键字的的分量及其分布特征，如基数排序。'
