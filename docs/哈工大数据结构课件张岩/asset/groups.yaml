    # 5.5 二叉查找树BST


    二叉查找树——二叉搜索树、二叉分类（排序）树


    二叉查找树或者是空树，或者是满足下列性质的二叉树：


    +   - 若它的左子树不空，则左子树上所有结点的关键字的 值都小于根结点关键字的 值；

    +   - 若它的右子树不空，则右子树上所有结点的关键字的 值都大于根结点关键字的 值；

    +   - 它的左、右子树本身又是一个二叉查找树。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_491_0.png)


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_491_1.png)'
  - '[PAGE 492]


    # 5.5 二叉查找树BST（Cont.）


    # 二叉查找树的结构特点：


    +   - 任意一个结点的关键字，都大于(小于)其左(右)子树中任意结点的关键字，因此各结点的关键字互不相同


    +   - 按中序遍历二叉查找树所得的中序序列是一个递增的有序序列，因此，二叉查找树可以把无序序列变为有序序列。


    +   - 同一个数据集合，可按关键字表示成不同的二叉查找树，即同一数据集合的二叉查找树不唯一；但中序序列相同。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_492_0.png)'
  - "[PAGE 493]\n\n# 5.5 二叉查找树BST（Cont.）\n\n# 二叉查找树的结构特点：\n\n每个结点X的右子树的最左结点Y，称为X的继承结点。有如下性质：\n\
    \n+   1. 在此右子树中，其关键字值最小，但大于X的关键字\n+   2. 最多有一个右子树，即没有左子树。\n\n# 二叉查找树的存储结构：\n\n\
