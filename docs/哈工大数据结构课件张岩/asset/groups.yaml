    # 5.3 折半查找（Cont.）


    +   折半查找的判定树高度

    +   $ASL_{bs}=\sum_{i=1}^{n} p_i \cdot c_i \quad /* p_i=1/n */$

    +   $= 1/n \cdot \sum_{j=1}^{h} j \cdot 2^{j-1} \quad /* S=2S - S */$

    +   $= (n+1)/n \cdot \log_2(n+1)-1$


    当n 很大时，$ASL_{bs} \approx \log_2(n+1)-1$作为查找成功时的平均查找长度。


    在查找不成功和最坏情况下查找成功所需关键字的比较次数都不超过判定树的高度。


    因为判定树的中度小于2 的结点只能出现在下面两层上，所以n 个结点的判定树高度和n 个结点的完全二叉树的高度相同，即$\lceil \log_2(n+1)
    \rceil$。由此可见，折半查找的最坏性能与平均性能相当接近。


