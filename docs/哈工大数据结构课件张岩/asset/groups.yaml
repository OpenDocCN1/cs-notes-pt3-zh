  mdcn: "\n## 1.4 算法及算法分析(Cont.)\n\n算法分析——各种语句和模块分析应遵循的规则\n\n- (5) 函数调用语句：\n- ① 若程序中只有非递归调用，则从没有函数调用的被调函数开始，计算所有这种函数的运行时间。然后考虑有函数调用的任意一个函数P，在P调用的全部函数的运行时间都计算完之后，即可开始计算P的运行时间。\n\
    - ② 若程序中有递归调用，则令每个递归函数对应于一个未知的开销函数T(n)，其中n是该函数参数的大小，之后列出关于T的递归方程并求解之。\n\n## 1.4\
    \ 算法及算法分析(Cont.)\n\n算法分析----例:分析下述“气泡”排序程序的时间复杂度。\n\n```\nvoid BubbleSort( int\
    \ A[], int n )\n{\n    int i, j, temp;\n    for (i=0; i<n-1; i++)\n        for\
    \ (j=n-1; j>=i+1; j--)\n            if (A[j-1]>A[j]) {\n                temp=A[j-1];\n\
    \                A[j-1]=A[j];\n                A[j]=temp;\n            }\n}\n\
    ```\n\nO(∑_{i=0}^{n-2} (n - i - 1)) ≤ O(n(n - 1)/2) = O(n²)\n\n## 1.4 算法及算法分析(Cont.)\n\
    \n算法分析——例：编写求 n! 的程序，并分析其时间复杂性。\n\n### 求 n! 的递归算法\n\n```\nlong fact ( int n)\n\
    {\n    if ( n==0 || ( n ==1 )\n        return( 1 );\n    else\n        return(\
    \ n * fact(n-1));\n}\n```\n\n### 时间复杂性的递归方程\n\n$$T(n)=\\begin{cases} C, & \\text{当\
    \ } n=0,\\ n=1 \\\\ G+T(n-1), & \\text{当 } n>1 \\end{cases}$$\n\n### 解递归方程：\n\n\
    $$T(n)=G+T(n-1)$$\n$$T(n-1)=G+T(n-2)$$\n$$T(n-2)=G+T(n-3)$$\n……\n$$T(2)=G+T(1)$$\n\
    $$+\\ T(1)=C$$\n因此：\n$$T(n)=G(n-1)+C$$\n\n取 $f(n)=n$\n∴ $T(n)=O(f(n))$\n　　 $=O(n)$\n\
    \n## 1.4 算法及算法分析(Cont.)\n\n### 算法分析---空间复杂性\n\n- 算法的空间复杂性是指算法在执行过程中的存储量需求\n- 一个算法的存储量需求除了存放算法本身所有的指令、常数、变量和输入数据外，还包括对数据进行操作的工作单元和存储实现计算所需信息的辅助空间\n\
    - 算法的存储量需求与输入的规模、表示方式、算法采用的数据结构、算法的设计以及输入数据的性质有关\n- 算法的执行的不同时刻，其空间需求可能是不同的\n-\
    \ 算法的空间复杂性是指算法在执行过程中的最大存储量需求\n\n### 空间复杂性的渐近表示---空间复杂度\n\n```\nT(n) = O(f(n))\
    \ 其中，n为问题的输入规模\n```\n\n## 1.5 逐步求精的程序设计方法\n\n- 1. 模型化（建模）\n  - 对实际问题进行分析，选择适当的模型来描述问题，即建模；\n\
    - 2. 确定算法\n  - 根据模型，找出解决问题的办法，即算法；\n- 3. 逐步求精\n  - 对用自然语言等描述的算法逐步细致化、精确化和形式化，这一阶段可能包括多步求精。\n\
    \  - 当逐步求精到某一步时，根据程序中所使用的数据形式，定义若干 ADT，并且用 ADT 中的操作代替对应的非形式语句。\n- 4. ADT 的实现\n\
    \  - 对每个 ADT，选择适当的数据结构表示数学模型，并用相应的函数实现每个操作。\n\n## 1.5 逐步求精的程序设计方法(Cont.)\n\n例:交叉路口的交通安全管理问题\n\
    \n问题描述：\n\n一个具有多条通路的交叉路口，当允许某些通路上的车辆在交叉路口“拐弯”时，必须对其他一些通路上面的车辆加以限制，不允许同时在交叉路口“拐弯”，以免发生碰撞。所有这些可能的“拐弯”组成一个集合。\n\
    \n基本要求：\n\n把这个集合分成尽可能少的组，使得每组中所有的“拐弯”都能同时进行而不发生碰撞。这样，每组对应一个指挥灯，因而实现了用尽可能少的指挥灯完成交叉路口的\
    \ 管理。\n\n实例：\n\n有一5条路组成的交叉路口，其中有2条路是单行道，把从一条路到另一条路的通称为“拐弯”，有的“拐弯”可以同时通过，有的“拐弯”不能同时通过，共有13个“拐弯”。要求：\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_40_0.png)\n\n- 1. 设置一组交通灯，实现安全管理；\n\
    - 2. 使交通灯的数目最少。\n\n## 1.5 逐步求精的程序设计方法(Cont.)\n\n例:交叉路口的交通安全管理问题\n\n- 1.模型化:\n\
    \  - 用图作为交叉路口的数学模型;\n  - 每个“拐弯”对应图中的一个顶点;\n  - 若两个“拐弯”不能同时进行,则用用一条边把这两个“拐弯”所对应的两个结点连接起来,并且说这两个顶点是相邻的。\n\
    \n## 1.5 逐步求精的程序设计方法(Cont.)\n\n1 模型化：\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_42_0.png)\n\
    \n## 1.5 逐步求精的程序设计方法(Cont.)\n\n- (1)穷举法;(2)试探法;(3)贪心法\n\n“贪心”算法的思想是首先用第一种颜色对图中尽可能多的顶点着色(尽可能多表现出“贪心”),然后用第二种颜色对余下的顶点中尽可能多的顶点着色\
    \ 如此等等, 直至所有的顶点都着完色。\n\n## 1.5 逐步求精的程序设计方法(Cont.)\n\n### 2.确定算法：\n\n贪心法\n\n##\
    \ 1.5 逐步求精的程序设计方法(Cont.)\n\n用C语言描述的\"贪心\"算法如下：\n\n```\nvoid greedy(GRAPH G, SET\
    \ newclr)\n/*把G中可以着同一色的顶点放入newclr*/\n{\n(1)    newclr=Φ\n(2)    while (G中有未着色的顶点v)\n\
    (3)        if(v不与newclr中的任何顶点相邻){\n(4)            对v着色;\n(5)            将v放入newclr;\
    \ }\n}\n```\n\n其中，G是被着色的图，newclr的初值为空，算法执行的结果形成可以着相同颜色的顶点的集合newclr。只要重复调用greedy算法，直到图中的所有顶点都被着色为止，即可求出问题的解。\n\
    \n## 1.5 逐步求精的程序设计方法(Cont.)\n\n```\nvoid greedy(GRAPH G, SET newclr)\n{ newclr=0\
    \ ; int found;\n v=G中第一个未着色的顶点;\n while (v!=0){ /*G中还有未着色的顶点v*/\n found=0;\n w=newclr中的第一个顶点;\
    \ /*newclr中的顶点还没取尽*/\n while(w!=0){ /*newclr中的顶点还没取尽*/\n if(v和w相邻)\n found=1;\n\
    \ w=newclr中的下一个顶点;\n }\n if(found==0){\n 对v着色;\n 将v放入newclr;\n }\n v=G中下一个未着色的顶点;\n\
    \ }\n}\n```\n\n## 1.5 逐步求精的程序设计方法(Cont.)\n\n- 3.逐步求精：第三步求精：\n\n由上一步求精的结果可见，算法中大部分操作都归结为对图和集合的操作。设G和S分别是抽象数据类型GRAPH和SET的实例，我们在G上规定如下操作：\n\
    \n- (1)FIRSTG(G)返回G中的第一个未加标记的（未着色的）元素；若G中没有这样的元素存在，则返回NULL。\n- (2)EDGE(v,w,G)若v和w在G中相邻，则返回true，否则返回false\n\
    - (3)MARK(v,G)标记G中的元素v。\n- (4)ADDG(v,G)将元素v放入G中。\n- (5)NEXTG(G)返回G中下一个未标记得元素，若G中没有这样的元素存在，则返回NULL。\n\
    \n在S上规定如下操作：\n\n- (1)MAKENULL(S)将集合S置空。\n- (2)FIRSTS(S)返回S中的第一个元素；若S为空集，则返回NULL。\n\
    - (3)NEXTS(S)返回S中的下一个元素；若S中没有下一个元素，则返回NULL。\n- (4)ADDS(v,S)将v放入S中。\n\n## 1.5 逐步求精的程序设计方法(Cont.)\n\
    \n- 3.逐步求精：第三步求精：\n\n```\nvoid greedy(GRAPH G, SET newclr)\n/*类型GRAPH和SET有待说明*/\n\
    {\n    int found;\n    elementtype v,w;/*elementtype可以自定义*/\n    MAKENULL(newclr);\n\
    \    v=FIRSTG(G);\n    while(v!=NULL){\n        found=0;\n        w=FIRSTS(newclr);\n\
    \        while(w!=NULL){\n            if(EDGE(v,w,G))\n                found=1;\n\
    \            w=NEXTS(newclr);\n        }\n        v=NEXTG(G);\n    }\n}\n```\n\
    \n### 4.ADT的实现：\n\n按上述函数，最后一步工作就是给出类型elementtype的定义和实现抽象数据类型GRAPH及SET。此后，上述函数就是可执的程序了。\n"
