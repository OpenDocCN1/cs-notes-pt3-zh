  md: "\n## 第6章 内部排序\n\n### 6.8 （二路）归并排序\n\n怎样完成一趟归并？\n\n```c\n/*把A中长度为 h 的相邻序列归并成长度为\
    \ 2h 的序列*/\nvoid MergePass(int n, int h, LIST A, LIST B)\n{\n    int i, t;\n \
    \   for (i = 1; i + 2 * h - 1 <= n; i += 2 * h)\n        Merge(i, i + h - 1, i\
    \ + 2 * h - 1, A, B); // 归并长度为 h 的两个有序子序列\n    if (i + h - 1 < n) /* 尚有两个子序列，其中最后一个长度小于\
    \ h */\n        Merge(i, i + h - 1, n, A, B); /* 归并最后两个子序列 */\n    else /* 若 i\
    \ <= n 且 i + h - 1 >= n 时，则剩余一个子序列轮空，直接复制 */\n        for (t = i; t <= n; t++)\n\
    \            B[t] = A[t];\n} /* Mpass */\n```\n\n（二路）归并排序算法：如何控制二路归并的结束？\n\n```c\n\
    void MergeSort(int n, LIST A)\n{\n    /* 二路归并排序 */\n    int h = 1; /* 当前归并子序列的长度，初始为\
    \ 1 */\n    LIST B;\n    while (h < n) {\n        MergePass(n, h, A, B);\n   \
    \     h = 2 * h;\n        MergePass(n, h, B, A); /* A、B互换位置 */\n        h = 2\
    \ * h;\n    }\n} /* MergeSort */\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_618_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_618_1.png)\n\n#### （二路）归并排序算法性能分析\n\
    \n- 时间性能：\n\n一趟归并操作是将 A[1]~A[n] 中相邻的长度为 h 的有序序列进行两两归并，并把结果存放到 B[1]~B[n] 中，这需要\
    \ O(n) 时间。整个归并排序需要进行 ⌈log₂ n⌉ 趟，因此，总的时间代价是 O(n log₂ n)。这是归并排序算法的最好、最坏、平均的时间性能。\n\
    \n- 空间性能：\n\n算法在执行时，需要占用与原始记录序列同样数量的存储空间，因此空间复杂度为 O(n)。\n\n#### （二路）归并排序分治算法\n\
    \n- 分解：将当前待排序的序列 A[low], ..., A[high] 一分为二，即求分裂点 mid = (low + high) / 2；\n- 求解：递归地对序列\
    \ A[low], ..., A[mid] 和 A[mid+1], ..., A[high] 进行归并排序；\n- 组合：将两个已排序子序列归并为一个有序序列。\n\
    - 递归出口是子序列长度为 1，因为一个记录自然有序。\n\n```c\nvoid MergeSort(LIST A, LIST B, int low, int\
    \ high)\n/* 用分治法对 A[low], ..., A[high] 进行二路归并 */\n{\n    int mid = (low + high)\
    \ / 2;\n    if (low < high) { /* 区间长度大于 1，high - low > 0 */\n        MergeSort(A,\
    \ B, low, mid);\n        MergeSort(A, B, mid + 1, high);\n        Merge(low, mid,\
    \ high, A, B);\n    }\n} /* MergeSort */\n```\n\n### 6.9 基数排序——多关键字排序\n\n理论上可以证明，对于基于关键字之间比较的排序，无论用什么方法都至少需要进行\
    \ log₂(n!) 次比较。\n\n由 Stirling 公式可知，log₂(n!) ≈ n log₂ n - 1.44n + O(log₂ n)。所以基于关键字比较的排序时间的下界是\
    \ O(n log₂ n)。因此不存在时间复杂度低于此下界的基于关键字比较的排序！\n\n只有不通过关键字比较的排序方法，才有可能突破此下界。\n\n**基数排序（时间复杂度可达到线性级\
    \ O(n)）**\n\n- 不比较关键字大小，而根据构成关键字的每个分量的值，排列记录顺序的方法，称为分配法排序（基数排序）。\n- 而把关键字各个分量所有可能取值范围的最大值称为基数或桶或箱，因此基数排序又称为桶排序。\n\
    \n#### 基数排序的适用范围\n\n- 显然，要求关键字分量的取值范围必须是有限的，否则可能要无限个箱。\n\n#### 算法的基本思想\n\n设待排序的序列的关键字都是位数相同的整数（不同时，取位数的最大值），其位数为\
    \ `figure`，每个关键字可以含有 `figure` 个分量，每个分量的取值范围为 0, 1, ..., 9，即基数为 10。依次从低位考查每个分量。\n\
    \n首先把全部数据装入一个队列 A，然后按下列步骤进行：\n\n1. **初态**：设置 10 个队列，分别为 Q[0], Q[1], ..., Q[9]，并且均为空。\n\
    2. **分配**：依次从队列 A 中取出每个数据 `data`；第 `pass` 遍处理时，考查 `data.key` 右起第 `pass` 位数字，设其为\
    \ `r`，把 `data` 插入队列 `Q[r]`；取尽 A，则全部数据被分配到 Q[0], Q[1], ..., Q[9]。\n3. **收集**：从\
    \ Q[0] 开始，依次取出 Q[0], Q[1], ..., Q[9] 中的全部数据，并按照取出顺序，把每个数据插入队列 A。\n4. **重复步骤 1、2、3**，对关键字中有\
    \ `figure` 位数字的数据进行 `figure` 遍处理，即可得到按关键字有序的序列。\n\n- 321 986 123 432 543 018 765\
    \ 678 987 789 098 890 109 901 210 012\n\n| Q | Numbers |\n| --- | --- |\n| Q[0]\
