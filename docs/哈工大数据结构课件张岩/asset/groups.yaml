  md: "\n## 第2章 线性表\n\n### 2.6（多维）数组（Cont.）\n\n#### 数组的基本操作\n\n- 初始化：`Create()`\n\
    \  - 建立一个空数组；\n  - `int A[][]`\n- 存取：`Retrieve(array, index)`\n  - 给定一组下标，读出对应的数组元素；\n\
    \  - `A[i][j]`\n- 修改：`Store(array, index, value)`\n  - 给定一组下标，存储或修改与其相对应的数组元素；\n\
    \  - `A[i][j] = 8`\n\n无需插入和删除操作。\n\n#### 数组的存储结构\n\n数组没有插入和删除操作，所以不用预留空间，适合采用顺序存储。\n\
    \n#### 数组的顺序存储\n\n- 用一组连续的存储单元来实现（多维）数组的存储。\n- 高维数组可以看成是由多个低维数组组成的。\n\n#### 二维数组的存储与寻址\n\
    \n常用的映射方法有两种：\n\n- 按行优先：先行后列，先存储行号较小的元素，行号相同者先存储列号较小的元素。\n- 按列优先：先列后行，先存储列号较小的元素，列号相同者先存储行号较小的元素。\n\
    \n#### 按行优先存储的寻址——二维数组\n\n每行元素个数为 n，整行数为 i，本行中 $a_{ij}$ 前面的元素个数为 j。\n\n$a_{ij}$\
    \ 前面的元素个数 = 整行数 × 每行元素个数 + 本行中 $a_{ij}$ 前面的元素个数 = $i \\times n + j$\n\n$$Loc(a_{ij})\
    \ = Loc(a_{00}) + (i \\times n + j) \\times c$$\n\n#### 按行优先存储的寻址——多维数组\n\nn（n>2）维数组一般也采用按行优先和按列优先两种存储方法。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_192_0.png)\n\n$$Loc(a_{ijk}) = Loc(a_{000})\
    \ + (i \\times m_2 \\times m_3 + j \\times m_3 + k) \\times c$$\n\n#### 特殊矩阵的压缩存储\n\
    \n- 特殊矩阵：矩阵中很多值相同的元素，并且它们的分布有一定的规律。\n- 稀疏矩阵：矩阵中有很多零元素。\n\n压缩存储的基本思想是：\n\n- 为多个值相同的元素只分配一个存储空间；\n\
    - 对零元素不分配存储空间。\n\n#### 对称矩阵的压缩存储\n\n- 对称矩阵特点：$a_{ij}=a_{ji}$；\n- 只存储下三角部分的元素。\n\
    \n$$A = \\begin{pmatrix} 3 & 6 & 4 & 7 & 8 \\\\ 6 & 2 & 8 & 4 & 2 \\\\ 4 & 8 &\
    \ 1 & 6 & 9 \\\\ 7 & 4 & 6 & 0 & 5 \\\\ 8 & 2 & 9 & 5 & 7 \\end{pmatrix}$$\n\n\
    ![](img/ad2aee679abbcf477936d4ee2701e2d3_194_0.png)\n\n$a_{ij}$ 在一维数组中的序号为 $i\
    \ \\times (i+1)/2 + j + 1$。\n\n因为一维数组下标从 0 开始，所以 $a_{ij}$ 在一维数组中的下标为：\n\n$$k =\
    \ i \\times (i+1)/2 + j \\quad (i \\ge j)$$\n\n$$k = j \\times (j+1)/2 + i \\\
    quad (i < j)$$\n\n#### 三角矩阵的压缩存储——下三角矩阵\n\n- 只存储下三角部分的元素。\n- 对角线上方的常数只存一个。\n\n\
    $$A = \\begin{pmatrix} 3 & c & c & c & c \\\\ 6 & 2 & c & c & c \\\\ 4 & 8 & 1\
    \ & c & c \\\\ 7 & 4 & 6 & 0 & c \\\\ 8 & 2 & 9 & 5 & 7 \\end{pmatrix}$$\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_195_0.png)\n\
    \n矩阵中任意一个元素 $a_{ij}$ 在一维数组中的下标 $k$ 与 $i$、$j$ 的对应关系：\n\n$$k = i \\times (i+1)/2\
    \ + j \\quad (i \\ge j)$$\n\n$$k = n \\times (n+1)/2 \\quad (i < j)$$\n\n####\
    \ 稀疏矩阵的压缩存储——三元组顺序表\n\n如何只存储非零元素？\n\n- 稀疏矩阵中的非零元素的分布没有规律。\n- 将稀疏矩阵中的每个非零元素表示为：\n\
    \  - （行号，列号，非零元素值）——三元组表\n\n```c\ntypedef struct {\n    int i, j;\n    ElemType\
    \ v;\n} Triple;\n\ntypedef struct {\n    Triple data[MaxSize+1];\n    int mu,\
    \ nu, tu;\n} TSMatrix;\n```\n\n如何存储三元组表？\n\n按行优先的顺序排列成一个线性表。\n\n$$A = \\begin{pmatrix}\
    \ 15 & 0 & 0 & 22 & 0 & -15 \\\\ 0 & 11 & 3 & 0 & 0 & 0 \\\\ 0 & 0 & 0 & 6 & 0\
    \ & 0 \\\\ 0 & 0 & 0 & 0 & 0 & 0 \\\\ 91 & 0 & 0 & 0 & 0 & 0 \\end{pmatrix}$$\n\
    \n| row | col | item |\n|-----|-----|------|\n| 0   | 0   | 15   |\n| 0   | 3\
    \   | 22   |\n| 0   | 5   | -15  |\n| 1   | 1   | 11   |\n| 1   | 2   | 3    |\n\
    | 2   | 3   | 6    |\n| 4   | 0   | 91   |\n\n表中未列出的 data 数组位置为空闲，直至 M-1。\n\n\
    - 7（非零元个数）\n- 5（矩阵的行数）\n- 6（矩阵的列数）\n\n#### 稀疏矩阵的压缩存储——十字链表\n\n采用链接存储结构存储三元组表，每个非零元素对应的三元组存储为一个链表结点，结构为：\n\
    \n| row | col | item |\n|:---:|:---:|:----:|\n| down | right |      |\n\n- row：存储非零元素的行号\n\
    - col：存储非零元素的列号\n- item：存储非零元素的值\n- right：指针域，指向同一行中的下一个三元组\n- down：指针域，指向同一列中的下一个三元组\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_199_0.png)\n\n$$M = \\begin{pmatrix}\
    \ 3 & 0 & 0 & 5 \\\\ 0 & 1 & 0 & 0 \\\\ 2 & 0 & 0 & 0 \\end{pmatrix}$$\n\n###\
    \ 2.7 广义表\n\n广义表：n（n≥0）个数据元素的有限序列，记作：\n\n$$LS = (a_1, a_2, \\ldots, a_n)$$\n\n\
    其中：LS 是广义表的名称，$a_i$（1≤i≤n）可以是单个的数据元素，也可以是一个广义表，分别称为 LS 的单元素（或原子）和子表。\n\n- 长度：广义表\
    \ LS 中的直接元素的个数；\n- 深度：广义表 LS 中括号的最大嵌套层数；\n- 表头：广义表 LS 非空时，称第一个元素为 LS 的表头；\n- 表尾：广义表\
    \ LS 中除表头外其余元素组成的广义表。\n\n#### 广义表示例\n\n- $A = (a, (b, a, b), (), c, (((2))))$\n\
    - $B = ()$\n- $C = (e)$\n- $D = (A, B, C)$\n- $E = (a, E)$\n\n#### 广义表性质\n\n-\
    \ 广义表的元素可以是子表，子表的元素还可以是子表，……，广义表是一个多层次的结构（层次性）；\n- 一个广义表可以被其他广义表所共享（共享性）；\n- 广义表可以是其本身的子表（递归性）。\n\
    \n#### 广义表基本操作\n\n1. **Car(L)**：返回广义表 L 的第一个元素\n2. **Cdr(L)**：返回广义表 L 除第一个元素以外的所有元素\n\
    3. **Append(L, M)**：返回广义表 L + M\n4. **Equal(L, M)**：判广义表 L 和 M 是否相等\n5. **Length(L)**：求广义表\
    \ L 的长度\n\n#### 广义表存储结构\n\nA = (a, (b, c))\n\nB = (A, A, ())\n\n```c\nstruct listnode\
    \ {\n    listnode *link;\n    boolean tag;\n    union {\n        char data;\n\
    \        listnode *dlink;\n    };\n};\ntypedef listnode *listpointer;\n```\n\n\
    C = (a, C)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_203_0.png)\n"
