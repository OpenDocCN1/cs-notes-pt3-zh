  - "[PAGE 626]\n\n# 6.9 基数排序---多关键字排序（cont.）\n\n# 算法的改进：\n\n由于每个桶（箱）存放多少个关键字分量相同的记录个数无法预料，即队列Q[0]，Q[1]，...,\
    \ Q[9]长度很难确定，故桶一般设计成链式排队，两个排队链在一起的方法如下：\n\n```\nvoid Concatenate(QUEUE Q1, QUEUE\
    \ Q2)\n{\n    if (!EMPTY(Q2)) {\n        Q1.rear->next=Q2.front->next;\n     \
    \   Q1.rear=Q2.rear;\n    }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_626_0.png)"
  - '[PAGE 627]


    # 6.9 基数排序---多关键字排序（cont.）


    # 算法性能分析


    +   - n----记录数，d----关键字（分量）个数，r----基数


    +   - 时间复杂度：分配操作：O（n）,收集操作O(r)，需进行d趟分配和收集。时间复杂度：O(d(n+r))


    +   - 空间复杂度：所需辅助空间为队首和队尾指针2r个，此外还有为每个记录增加的链域空间n个。空间复杂度O((n+r))


    # 算法的推广


    +   - 若被排序的数据关键字由若干域组成，可以把每个域看成一个分量按照每个域进行基数排序。


    +   - 若关键字各分量不是整数，则把各分量所有可以取值与一组自然数对应。'
