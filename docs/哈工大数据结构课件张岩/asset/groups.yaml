    # 模式匹配：


    给定主串 S="s₁s₂…sₙ" 和模式 T="t₁t₂…tₘ"，在 S 中寻找 T 的过程称为模式匹配。如果匹配成功，返回 T 在 S 中的位置 如果匹配失败，返回
    0。


    假设串采用顺序存储结构，串的长度存放在数组的 0 号单元，串值从 1 号单元开始存放。


    # 朴素模式匹配算法(Brute-Force算法)：枚举法


    # 基本思想


    从主串 S 的第一个字符开始和模式 T 的第一个字符进行比较，若相等，则继续比较两者的后续字符；否则，从主串 S 的第二个字符开始和模式 T 的第一个字符进行比较，重复上述过程，直到
    T 中的字符全部比较完毕，则说明本趟匹配成功；或 S 中字符全部比较完，则说明匹配失败。'
