  - "[PAGE 500]\n\n# 5.5 二叉查找树BST（Cont.）\n\n# 二叉查找树的删除操作的实现\n\n```\nrecords deletemin(BST\
    \ &F)\n{ records tmp ; BST p ;\n    if ( F->lchild == NULL ) {\n        p = F\
    \ ;\n        tmp = F->data ;\n        F = F->rchild ;\n        delete p ;\n  \
    \      return tmp ;\n    }\n    else\n        return(deletemin( F->lchild ) ;\n\
    }\n```\n\n```\nvoid DeleteB( keytype k, BST &F )\n{ if ( F != NULL )\n    if (\
