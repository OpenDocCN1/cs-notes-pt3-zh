    # 二叉树的遍历操作


    遍历的定义：根据某种策略，按照一定的次序访问二叉树中的每一个结点，使每个结点被访问一次且只被访问一次。这个过程称为二叉树的遍历。


    二叉树

    根结点D

    左儿子L

    右儿子R


    三个结点的可能顺序：

    DLR   LDR   LRD

    DRL   LRD   RLD


    遍历的结果是二叉树结点的线性序列。非线性结构线性化。


    +   策略：左孩子结点一定要在右孩子结点之前访问


    +   次序：先序（根）遍历、中序（根）遍历、后序（根）遍历和层序（次）遍历


