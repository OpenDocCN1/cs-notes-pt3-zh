    ## 4.2 图的存储结构(cont.)\n\n### 邻接矩阵（Adjacency Matrix）表示（数组表示法）\n\n存储结构定义：假设图G有n个顶点e条边，则该图的存储需求为O(n+n²)=O(n²)，与边的条数e无关。\n\
    \n```\ntypedef struct {\n    VertexData vertex[NumVertices]; //顶点表\n    EdgeData\
    \ edge[NumVertices][NumVertices];\n    //邻接矩阵—边表，可视为边之间的关系\n    int n, e; //图的顶点数与边数\n\
    } MTGraph;\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_379_0.png)\n\nvertex\
    \ v1 v2 v3 v4 v5\n\nedge =\n\n|   | v1 | v2 | v3 | v4 | v5 |   |\n|---|----|----|----|----|----|---|\n\
    | v1 | 0 | 1 | 0 | 0 | 0 | v1 |\n| v2 | 0 | 0 | 1 | 0 | 0 | v2 |\n| v3 | 0 | 0\
    \ | 0 | 1 | 1 | v3 |\n| v4 | 1 | 0 | 1 | 0 | 1 | v4 |\n| v5 | 0 | 1 | 0 | 1 |\
    \ 0 | v5 |\n\n## 4.2 图的存储结构(cont.)\n\n存储结构的建立---算法实现步骤：\n\n- 1. 确定图的顶点个数n和边数；\n\
    - 2. 输入顶点信息存储在一维数组vertex中；\n- 3. 初始化邻接矩阵；\n- 4. 依次输入每条边存储在邻接矩阵edge中；\n  - 4.1\
    \ 输入边依附的两个顶点的序号i, j；\n  - 4.2 将邻接矩阵的第i行第j列的元素值置为1；\n  - 4.3 将邻接矩阵的第j行第i列的元素值置为1。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_380_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_380_1.png)\n\
