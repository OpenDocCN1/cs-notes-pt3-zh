  - '[PAGE 644]


    # 7.3 磁盘文件的归并排序


    外部排序归并方法的一般过程：分两个阶段




    +   - 首先，将文件中的数据分段输入到内存，在内存中采用内部排序方法对其进行排序（排序完的文件，称为归并段run），


    +   - 然后将有序段写回外存。


    +   - 整个文件经过在内存逐段排序又逐段写回外存，这样在外存中形成多个初始的归并段。




    +   - 对这些初始归并段采用某种归并排序方法，进行多遍归并，最后形成整个文件的单一归并段（整个文件有序）。'
  - '[PAGE 645]


    # 7.3 磁盘文件的归并排序


    示例：设有一个包含4500个记录的输入文件。现用一台其内存最多可容纳750个记录的计算机对该文件进行排序。输入文件放在磁盘上，磁盘每个页块可容纳250个记录，这样全部记录可存储在
    4500 / 250 = 18 个页块中。输出文件也放在磁盘上，用以存放归并结果。


    由于内存中可用于排序的存储区域能容纳750个记录，因此内存中恰好能存3个页块的记录。


    在外排序一开始，把18块记录，每3块一组，读入内存。利用某种内排序方法进行内排序，形成初始归并段，再写回外存。总共可得到6个初始归并段。然后一趟一趟进行归并排序。


