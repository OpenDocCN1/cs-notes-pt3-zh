    # 4.3 图的搜索（遍历）(cont.)


    +   深度优先遍历特点：

    +     - 是递归的定义，是尽可能对纵深方向上进行搜索，故称先深或深度优先搜索。


    +   先深或深度优先编号。

    +     - 搜索过程中，根据访问顺序给顶点进行的编号，称为先深或深度优先编号。


    +   先深序列或DFS序列：

    +     - 先深搜索过程中，根据访问顺序得到的顶点序列，称为先深序列或DFS序列。


    +   生成森林（树）：

    +     - 有原图的所有顶点和搜索过程中所经过的边构成的子图。


    +   先深搜索结果不唯一

    +     - 即图的DFS序列、先深编号和生成森林不唯一。'
