  - '[PAGE 658]


    # 本章小结


    +   - 内部排序过程中不涉及数据的内、外存交换，待排序的记录全部存放在内存中；

    +   - 若待排序的文件很大，就无法将整个文件的所有记录同时调入内存进行排序；

    +   - 外部排序的实现，主要是依靠数据的内、外存交换和“内部归并”。

    +   - 外部排序基本上包括相对独立的两个阶段：初始归并段的形成；多路归并。

    +   - 外部排序主要研究的技术问题是：

    +     - 如何进行多路归并以减少文件的归并遍数；

    +     - 如何运用内存的缓冲区使I/O和CPU尽可能并行工作；

    +     - 根据外存的特点选择较好的产生初始归并段的方法。'
