    \ //令pre 是下一个访问的中序前驱\nInOrderTh( p->rchild ); //右子树线索化\n}\n}\n```\n\n## 3.2 二叉树（Cont.）\n\
    \n## 二叉树的复制\n\n- 两株二叉树具有相同结构指：\n- （1）它们都是空的；\n- （2）它们都是非空的，且左右子树分别具有相同结构。\n\n\
