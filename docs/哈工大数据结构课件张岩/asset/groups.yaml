    # 1.1 数据结构的兴起和发展(Cont.)


    +   - 程序设计的实质是什么？

    +     - 数据表示：将数据存储在计算机中

    +     - 数据处理：处理数据，求解问题

    +     - 数据结构问题起源于程序设计


    +   - 数据结构随着程序设计的发展而发展

    +     - 1. 无结构阶段：在简单数据上作复杂运算

    +     - 2. 结构化阶段：数据结构＋算法＝程序

    +     - 3. 面向对象阶段：（对象＋行为）＝程序


    数据结构的发展并未终结……'
