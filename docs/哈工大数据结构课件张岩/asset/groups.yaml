  - "[PAGE 29]\n\n# 1.4 算法及算法分析(Cont.)\n\n算法分析---大O符号\n\n+   - 定理：若 A(n)=a_m n^m +\
    \ a_{m-1} n^{m-1} + ... + a_1 n + a_0 是一个 m 次多项式，则 A(n)=O(n^m)。\n+   - 说明：在计算算法时间复杂度时，可以忽略所有低次幂（低阶）项和最高次幂（最高阶）项的系数。\n\
    +   - 例：\n\n```\nfor (i=1; i<=n; ++i)\n    for (j=1; j<=n; ++j)\n    {\n     \
    \   c[i][j]=0;\n        for (k=1; k<=n; ++k)\n            c[i][j]+=a[i][k]*b[k][j];\n\
    \    }\n```\n\n问题规模： n\n基本语句： *\n复杂度： O(n³)"
