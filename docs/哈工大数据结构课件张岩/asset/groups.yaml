  - '[PAGE 413]


    # 4.4 最小生成树算法(cont.)


    # MST性质的证明


    [反证]假设G的任何一棵最小生成树都不包含(u,v)，设T是连通网上的一棵最小生成树，当将边(u,v)加入到T中时，由生成树的定义，T中必包含一条(u,v)的回路。另一方面，由于T是生成树，则在T上必存在另一条边(u'',v'')，且u和u''、v和v''之间均有路径相通。删去边(u'',v'')便可消去上述回路，同时得到另一棵最小生成树T''。但因为(u,v)的代价不高于(u'',v'')，则T''的代价亦不高于T，T''是包含(u,v)的一棵最小生成树。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_413_0.png)'
