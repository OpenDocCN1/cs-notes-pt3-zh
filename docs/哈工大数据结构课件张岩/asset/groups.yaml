    # 第4章图结构及其应用算法


    # 4.5 最短路径算法(cont.)


    # Floyd算法的基本思想：


    +   假设求顶点 v_i 到顶点 v_j 的最短路径。如果从 v_i 到 v_j 存在一条长度为 C[i][j] 的路径，该路径不一定是最短路径，尚需进行
    n 次试探。


    +   首先考虑路径 (v_i, v_0, v_j) 是否存在。如果存在，则比较 (v_i, v_j) 和 (v_i, v_0, v_j) 的路径长度取长度较短者为从
    v_i 到 v_j 的中间顶点的序号不大于 0 的最短路径。


    +   假设在路径上再增加一个顶点 v_1，也就是说，如果 (v_i, ..., v_1) 和 (v_1, ..., v_j) 分别是当前找到的中间顶点的序号不大于
    0 的最短路径，那么 (v_i, ..., v_1, ..., v_j) 就是有可能是从 v_i 到 v_j 的中间顶点的序号不大于 1 的最短路径。将它和已经得到的从
    v_i 到 v_j 中间顶点序号不大于 0 的最短路径相比较，从中选出中间顶点的序号不大于 1 的最短路径，再增加一个顶点 v_2 继续进行试探。


    +   一般情况下，若 (v_i, ..., v_k) 和 (v_k, ..., v_j) 分别是从 v_i 到 v_k 和从 v_k 到 v_j 的中间顶点序号不大于
    k-1 的最短路径，则将 (v_i, ..., v_k, ..., v_j) 和已经得到的从 v_i 到 v_j 且中间顶点序号不大于 k-1 的最短路径相比较，其长度较短者便是从
    v_i 到 v_j 的中间顶点的序号不大于 k 的最短路径。'
