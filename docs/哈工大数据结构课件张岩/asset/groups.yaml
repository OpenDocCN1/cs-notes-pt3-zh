    \n- ④ 活动 aᵢ 的最迟允许开始时间 L(i)\n\n是指在不会引起工期延迟的前提下，活动 aᵢ 允许的最迟开始时间。\n\n因为事件 Vₖ 发生表明以\
    \ Vₖ 为终点的入边所表示的所有活动均已完成，所以事件 Vₖ 的最迟发生时间 VL(k) 也是所有以 Vₖ 为终点的入边 < Vⱼ, Vₖ > 所表示的活动\
    \ aᵢ 可以最迟完成时间。\n\n显然，为不推迟工期，活动 aᵢ 的最迟开始时间 L(i) 应该是 aᵢ 的最迟完成时间 VL(k) 减去 aᵢ 的持续时间，即\n\
    \n- L(i) = VL(k) - ACT[j][k] ..............(2)\n\n其中，ACT[j][k] 是活动 aᵢ 的持续时间（<\
    \ Vⱼ, Vₖ > 上的权）。\n\n## 4.7 关键路径算法(cont.)\n\n关键路径和关键活动性质分析------与计算关键活动有关的量\n\n\
    - ⑤时间余量 L(i) - E(i)\n\nL(i) - E(i)表示活动 aᵢ 的最早可能开始时间和最迟允许开始时间的时间余量。\n\n- 关键路径上的活动都满足：\
    \ L(i) = E(i) ............( 3 )\n\n- L(i) = E(i)表示活动是没有时间余量的关键活动。\n\n- 由上述分析知，为找出关键活动，需要求各个活动的E(i)与\
    \ L(i)，以判别一个活动aᵢ是否满足L(i) = E(i)。\n\n- E(i)和L(i)可有公式 (1)和(2)计算得到。而VE(k) 和VL(k)可由拓扑分类算法得到。\n\
    \n关键路径和关键活动分析计算示例：\n\n## 4.7 关键路径算法(cont.)\n\n源点 起始点\n\n汇点 结束点\n\n| 顶点 | VE[j]\
    \ | VL[k] | 活动 | E[i] | L[i] | L[i] - E[i] |\n|---|---|---|---|---|---|---|\n\
    | V₁ | 0 | 0 | a₁ | 0 | 0 | 0 |\n| V₂ | 6 | 6 | a₂ | 0 | 2 | 2 |\n| V₃ | 4 | 6\
    \ | a₃ | 0 | 3 | 3 |\n| V₄ | 5 | 8 | a₄ | 6 | 6 | 0 |\n| V₅ | 7 | 7 | a₅ | 4 |\
    \ 6 | 2 |\n| V₆ | 7 | 10 | a₆ | 5 | 6 | 1 |\n| V₇ | 16 | 16 | a₇ | 7 | 7 | 0 |\n\
    | V₈ | 14 | 14 | a₈ | 7 | 7 | 0 |\n| V₉ | 18 | 18 | a₉ | 7 | 10 | 3 |\n|  |  |\
    \  | a₁₀ | 16 | 16 | 0 |\n|  |  |  | a₁₁ | 14 | 14 | 0 |\n| 事件的最早发生时间 |  | 事件的最迟发生时间\
    \ | 活动的最早开始时间 |  | 活动的最晚开始时间 | 时间余量 |\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_455_0.png)\n\
    \n## 4.7 关键路径算法(cont.)\n\n利用拓扑排序算法求关键路径和关键活动\n\n（1）前进阶段：从源点 V₁ 出发，令 VE(1) = 0，按拓扑序列次序求出其余各顶点事件的最早发生时间：\n\
    \n$$VE(k)=\\max_{j\\in T}\\{VE(j)+ACT[j][k]\\}$$\n\n- 其中 T 是以顶点 Vₖ 为尾的所有边的头顶点的集合（2≤k≤n）\n\
    \n- 如果网中有回路，不能求出关键路径则算法中止；否则转（2）\n\n（2）回退阶段：从汇点 Vₙ 出发，令 VL(n) = VE(n)，按逆拓扑有序求其余各顶点的最晚发生时间：\n\
    \n$$VL(j)=\\min_{k\\in S}\\{VL(k)+ACT[j][k]\\}$$\n\n- 其中 S 是以顶点 Vⱼ 为头的所有边的尾顶点的集合（2≤j≤n-1）\n"
