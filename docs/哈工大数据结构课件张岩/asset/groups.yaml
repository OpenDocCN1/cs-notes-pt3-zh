    删除某节点，并保持二叉排序树特性，分三种情况处理：


    +   1）如果删除的是叶节点，则直接删除；


    +   2）如果删除的节点只有一株左子树或右子树，则直接继承：将该子树移到被删结点位置；


    +   3）如果删除的节点有两株子树，则用继承节点代替被删结点，这相当于删除继承节点——按1）或2）处理继承节点。


