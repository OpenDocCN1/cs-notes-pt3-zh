    - 同一个数据集合，可按关键字表示成不同的二叉查找树，即同一数据集合的二叉查找树不唯一；但中序序列相同。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_492_0.png)\n\
    \n## 5.5 二叉查找树BST（Cont.）\n\n## 二叉查找树的结构特点：\n\n每个结点X的右子树的最左结点Y，称为X的继承结点。有如下性质：\n\
    \n- 1. 在此右子树中，其关键字值最小，但大于X的关键字\n- 2. 最多有一个右子树，即没有左子树。\n\n## 二叉查找树的存储结构：\n\n```\n\
    typedef struct celltype {\n    records data ;\n    struct celltype *lchild,*rchild\
    \ ;\n} BSTNode;\n\ntypedef BSTNode * BST;\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_493_0.png)\n\
    \n## 5.5 二叉查找树BST（Cont.）\n\n二叉查找树的查找操作：\n\n在F 中查找关键字为k 的记录如下：\n\n- 若F = NULL，则查找失败；否则，\n\
    - k ==F->data.key，则查找成功；否则，\n- k < F->data.key，则递归地在F 的左子树查找k；否则\n- k > F->data.key，则递归地在F\
    \ 的右子树查找k。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_494_0.png)\n\n## 5.5 二叉查找树BST（Cont.）\n\
    \n二叉查找树的查找操作：\n\n```\nBSTNode * SearchBST( keytype k, BST F )\n{  BSTNode * p\
    \ = F;\n    if( p == NULL || k == p->data.key ) /* 递归终止条件 */\n        return \
    \ p;\n    if( k < p->data.key )\n        return ( SearchBST ( k, p->lchild ) );\
    \ /* 查找左子树 */\n    else\n        return ( SearchBST ( k, p->rchild ) ); /* 查找右子树\
    \ */\n}\n```\n\n## 5.5 二叉查找树BST（Cont.）\n\n二叉查找树的插入操作\n\n- 若二叉排序树为空树，则新插入的结点为根结点；\n\
    - 否则，新插入的结点必为一个新的叶结点。\n\n新插入的结点一定是查找不成功时，查找路径上最后一个结点的左儿子或右儿子。\n\n```\nvoid InsertBST(records\
    \ R, BST F)\n{ if( F ==NULL ){\n    F = new BSTNode ;\n    F->data = R ;\n   \
    \ F->lchild = NULL ;\n    F->rchild = NULL ;\n}else if( R.key < F->data.key )\n\
    \    InsertBST( R , F->lchild );\nelse if( R.key > F->data.key )\n    InsertBST(\
    \ R , F->rchild );\n} //若R.key==F->data.key,则返回\n```\n\n## 5.5 二叉查找树BST（Cont.）\n\
    \n二叉查找树的建立\n\n```\nBST CreateBST ( void )\n{ BST F = NULL; /*初始时F为空*/\n    keytype\
    \ key;\n    cin>>key>>其他字段;/*读入一个记录*/\n    while( key ) { /*假设key=0是输入结束标志*/\n\
    \        InsertBST( R , F ); /* 插入记录R */\n        cin>>key>>其他字段 ;/*读入下个记录*/\n\
    \    }\n    return  F;/*返回建立的二叉查找树的根*/\n}\n```\n\n注意：在建立二叉查找树时，若按关键字有序顺序输入各记录，则产生退化的二叉查找树—单链表\n\
    \n如何防止？\n随机输入各结点\n在建立、插入和删除各结点过程中平衡相关结点的左、右子树。\n\n## 5.5 二叉查找树BST（Cont.）\n\n二叉查找树的删除操作\n\
    \n删除某节点，并保持二叉排序树特性，分三种情况处理：\n\n- 1）如果删除的是叶节点，则直接删除；\n- 2）如果删除的节点只有一株左子树或右子树，则直接继承：将该子树移到被删结点位置；\n\
    - 3）如果删除的节点有两株子树，则用继承节点代替被删结点，这相当于删除继承节点——按1）或2）处理继承节点。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_498_0.png)\n\
    \n## 5.5 二叉查找树BST（Cont.）\n\n## 二叉查找树的删除操作的实现\n\n```\nrecords deletemin(BST &F)\n\
    { records tmp ; BST p ;\n    if ( F->lchild == NULL ) {\n        p = F ;\n   \
    \     tmp = F->data ;\n        F = F->rchild ;\n        delete p ;\n        return\
    \ tmp ;\n    }\n    else\n        return(deletemin( F->lchild ) ;\n}\n```\n\n\
    ```\nvoid DeleteB( keytype k, BST &F )\n{ if ( F != NULL )\n    if ( k < F->data.key\
    \ )\n        DeleteB( k, f->lchild ) ;\n    else if ( k > F->data.key )\n    \
    \    DeleteB( k, f->rchild );\n    else\n        if ( F->rchild == NULL )\n  \
    \          F = F->lchild ;\n        else if( F->lchild == NULL )\n           \
    \ F = F->rchild ;\n        else\n            F->data =deletemin(F->rchild);\n\
    }\n```\n\n## 5.5 二叉查找树BST（Cont.）\n\n## 二叉查找树的查找性能\n\n- 二叉排序树的查找性能取决于二叉排序树的形态，在\
    \ O(log₂n) 和 O(n) 之间。\n- 在最坏情况下，二叉查找树是通过把有序表的 n 个结点依次插入而生成的，此时所得到的二叉查找树退化为一株高度为\
    \ n 的单支树，它的平均查找长度和单链表上的顺序查找相同，(n+1)/2。\n- 在最好情况下，二叉查找树的形态比较均匀，最终得到一株形态与折半查找的判定树相似，此时的平均查找长度约为\
    \ log₂ n。\n- 二叉查找树的平均高度为 O(log₂ n)。因此平均情况下，三种操作的平均时间复杂度为 O(log₂ n)\n- 就平均性能而言，二叉查找树上的查找和二分查找差不多\n\
    - 就维护表的有序性而言，二叉查找树更有效。\n"
