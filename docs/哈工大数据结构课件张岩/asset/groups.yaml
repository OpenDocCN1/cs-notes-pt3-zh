    \  - 联系方式：电话13845139350\n  - email: zhangy@hit.edu.cn\n\n## 第1章 绪论\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_2_0.png)\n\
    \n## 学习目标\n\n- 了解数据结构的基本概念、研究对象以及数据结构课程的发展历史，对数据结构与算法课程有一个宏观的认识\n- 掌握贯穿全书的重要概念----抽象数据类型，包括其概念的定义和实现方法，初步掌握抽象技术方法\n\
