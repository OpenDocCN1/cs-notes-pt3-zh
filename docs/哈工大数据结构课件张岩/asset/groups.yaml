  - "[PAGE 204]\n\n# 2.7 广义表(Cont.)\n\n# 广义表操作的实现\n\n```\nbool Equal( listpointer\
    \ S, listpointer T )\n{ boolean x, y;\n    y = FALSE ;\n    if ( ( S == NULL )\
    \ && ( T == NULL ) )\n        y = TRUE ;\n    else if ( ( S != NULL ) && ( T !=\
    \ NULL ) )\n        if ( S→tag == T→tag )\n        { if ( S→tag == FALSE\n   \
    \         { if ( S→element.data == T→element.data )\n                x = TRUE\
    \ ;\n            else\n                x = FALSE ;\n        else\n           \
    \ x = Equal( S→element.data, T→element.data );\n        if ( x== TRUE )\n    \
    \        y = Equal( S→link, T→link ) ;\n        }\n    return y ;\n} //S和T均为非递归的广义表\n\
    ```"
