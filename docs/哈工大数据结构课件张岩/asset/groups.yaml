    \ ;\n    } return ( Q );\n}\n```\n\n## 3.2 二叉树（Cont.）\n\n## 线索二叉树的若干算法\n\n算法4：中序线索二叉树的插入算法\n\
    \n分析：如将结点 R 插入作为结点 S 的右孩子结点。\n- （1）若 S 的右子树为空，直接插入；\n- （2）若 S 的右子树非空，则 R 插入后，原来\
