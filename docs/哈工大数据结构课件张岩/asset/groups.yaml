    \n## 4.1 基本定义(cont.)\n\n无向完全图：在无向图中，如果任意两个顶点之间都存在边，则称该图为无向完全图。\n\n有向完全图：在有向图中，如果任意两个顶点之间都存在方向相反的两条弧，则称该图为有向完全图。\n\
