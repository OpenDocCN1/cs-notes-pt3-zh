    # 4.7 关键路径算法(cont.)


    关键路径和关键活动性质分析------与计算关键活动有关的量


    +   ① 事件 Vj 的最早可能发生时间 VE(j)

    +     ● 是从源点 V1 到顶点 Vj 的最长路径长度：…→ Vj — a_i → Vk


    +   ② 活动 a_i 的最早可能开始时间 E(k)

    +     ● 设活动 a_i 在边 < Vj , Vk > 上，则 E(i) 也是从源点 V1 到顶点 Vj 的最长路径长度。这是由于事件 Vj 发生表明以
    Vj 为起点的所有活动 ai 可以立即开始。因此，

    +     ● E(i) = VE(j) ............ (1)


