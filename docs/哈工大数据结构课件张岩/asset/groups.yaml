  - "[PAGE 186]\n\n# 2.5.3 模式匹配(Cont.)\n\n# KMP算法的实现\n\n```\nint Index_KMP(char* S,\
    \ char* T, int pos=1)\n{ /*S为主串T为模式，串的第0位置存放串长度；串采用顺序存储结构*/\n    i = pos;   j\
    \ = 1;                     // 从第一个位置开始比较\n    while (i<=S[0] && j<=T[0]) {\n \
    \       if (S[i] == T[j]) {++i; ++j;}      // 继续比较后继字符\n        else j = Next[j];\
    \                 // 模式串向右移\n    }\n    if (j > T[0]) return i-T[0];         \
    \ // 返回与模式第一字符相等\n    else return 0;    // 匹配不成功          // 的字符在主串中的序号\n}\n```"
