    # 实现步骤：


    +   1. 队列Q初始化；

    +   2. 如果二叉树非空，将根指针入队；

    +   3. 循环直到队列Q为空

    +      3.1 q=队列Q的队头元素出队；

    +      3.2 访问结点q的数据域；

    +      3.3 若结点q存在左孩子，则将左孩子指针入队；

    +      3.4 若结点q存在右孩子，则将右孩子指针入队；


