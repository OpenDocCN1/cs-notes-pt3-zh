    # 3.1 树与二叉树的基本术语


    树的构造性递归定义：


    +   一个节点 X 组成的集合{ X }是一棵树，这个节点 X 称为这棵树的根（root）。


    +   假设 X 是一个节点，T₁，T₂，…，Tₖ是 k棵互不相交的树，可以构造一棵新树：令 x 为根，并有k 条边由 X 指向树T₁，T₂，…，Tₖ。这些边也叫做分支，T₁，T₂，…，Tₖ称作根
    为X 的树之子树（SubTree）。


    说明：


    +   递归定义，但不会产生循环定义；


    +   构造性定义便于树型结构的建立；


    +   一株树的每个节点都是这株树的某株子树的根；


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_214_0.png)'
