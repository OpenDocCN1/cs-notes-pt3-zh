    # 2.4.3 队列的数组实现(Cont.)


    队列的链接存储结构及实现


    +   如何区分队空、队满的判定条件？


    +   方法一：增设一个存储队列中元素个数的计数器count，当front==rear 且count==0时，队空；当且count==MaxSize时，队满；


    +   方法二：设置标志flag，当front==rear且flag==0时为队空；当front==rear且flag==1时为队满。


