    # 4.2 图的存储结构


    # 是否可以采用顺序存储结构存储图？


    +   图的特征：顶点之间的关系是 m:n，即任何两个顶点之间都可能存在关系（边），无法通过存储位置表示这种任意的逻辑关系，所以，图无法采用顺序存储结构。


    # 如何存储图？


    +   考虑图的定义，图是由顶点和边组成的；

    +   分别考虑如何存储顶点、如何存储边----顶点之间的关系。


