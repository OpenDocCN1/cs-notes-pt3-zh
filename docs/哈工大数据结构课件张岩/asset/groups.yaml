    - 根据性质5，如已知某结点的层序编号i,则可求得该结点的双亲结点、左孩子结点和右孩子结点，然后检测其值是否为虚设的特殊结点$。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_248_0.png)\n\
    \n### 一般二叉树的顺序存储结构\n\n- 一棵斜树的顺序存储会怎样呢？\n- 高度为 k 的右斜树， k 个结点需分配 2^k − 1 个存储单元。\n\
    - 需增加很多空结点，造成存储空间的浪费。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_249_0.png)\n\
    \n### 二叉树的左右链存储结构---动态二叉链表\n\n- 二叉树左右链表示：每个节点除了存放节点数据信息外，还设置两个指示左、右孩子的指针，如果该节点没有左或右孩子，则相应的指针为空。并用一个指向根节点的指针标识这个二叉树。\n\
    \n### 节点结构：\n\n| lchild | data | rchild |\n\n- data：数据域，存放该节点的数据信息；\n- lchild：左指针域，存放指向左孩子的指针；\n\
    - rchild：右指针域，存放指向右孩子的指针。\n\n二叉树的左右链存储结构---动态二叉链表\n\n示例：\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_251_0.png)\n\
    \n具有n个结点的二叉链表中，有多少个空指针？有多少指向孩子结点的指针？\n\n二叉树的左右链存储结构---动态二叉链表\n\n### 存储结构定义：\n\n\
    ```\nstruct node {\n    struct node *lchild;\n    struct node *rchild;\n    datatype\
    \ data;\n};\ntypedef struct node * BTREE;\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_252_0.png)\n\
    \n### 二叉树的左右链存储结构(二叉链表)的建立\n\n- 方法1:\n\n```\nBTREE CreateBT(datatype v, BTREE\
    \ ltree , BTREE rtree )\n{\n    BTREE root ;\n    root = new node ;\n    root\
    \ → data = v ;\n    root → lchild = ltree ;\n    root → rchild = rtree ;\n   \
    \ return root ;\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_253_0.png)\n\
    \n方法2：按先序序列建立二叉树的左右链存储结构。\n\n- 如由图所示二叉树,输入:ABDH##I##E##CF#J##G##\n- 其中：#表示空\n\n\
    ```\nvoid CreateBT(BTREE & T)\n{ cin >> ch ;\n    if ( ch == ‘#’ ) T = NULL ;\n\
    \    else{\n        T → data = ch ;\n        CreateBT ( T → lchild ) ;\n     \
    \   CreateBT ( T → rchild ) ;\n    }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_254_0.png)\n"
