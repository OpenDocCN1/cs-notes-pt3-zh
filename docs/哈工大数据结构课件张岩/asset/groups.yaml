  - "[PAGE 600]\n\n# 6.5 堆排序（cont.）\n\n堆排序的实现：\n\n```\nvoid HeapSort ( int n , LIST\
    \ A )\n{\n    int i;\n    for( i=n/2; i<=1; i++ ) /*初始建堆，从最右非叶结点开始*/\n       \
    \ PushDown( i, n ); /*整理堆，把以i为根，最大下标的叶为n*/\n    for( i=n; i<=2; i-- ) {\n    \
