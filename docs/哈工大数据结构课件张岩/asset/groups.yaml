    # 第5章 查找


    # 5.1 基本概念和术语


    +   - 查找表：由同一类型的数据元素(或记录)构成的集合(文件)。

    +   - 关键字：可以标识一个记录的某个数据项或数据项组合。

    +   - 键值：关键字的取值。

    +   - 主键：可以唯一地标识一个记录的关键字。

    +   - 次关键字：不能唯一地标识一个记录的关键字。

    +   - 查找：在查找表中找出（确定）一个关键字值等于给定值的数据元素（或记录）。

    +   - 查找结果：若在查找集合中找到了与给定值相匹配的数据元素记录，则称查找成功；否则，称查找失败。


