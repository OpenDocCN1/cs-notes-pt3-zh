    # 6.2 气泡排序


    # 算法的基本思想：


    +   将待排序的记录看作是竖着排列的“气泡”，关键字较小的记录比较轻，从而要往上浮。


    +   对这个“气泡”序列进行n-1遍（趟）处理。所谓一遍（趟）处理，就是自底向上检查一遍这个序列，并注意两个相比较的关键字顺序是否正确。如果发现顺序不对，即“轻”的记录在下面，就交换它们的位置。


    +   显然，处理1遍之后，“最轻”的记录就浮到了最高位置；处理2遍之后，“次轻”的记录就浮到了次高位置。在作第二遍处理时，由于最高位置上的记录已是“最轻”的，所以不必检查。一般地，第i遍处理时，不必检查第i高位置以上的记录的关键字，因为经过前面i-1遍的处理，它们已正确地排好序。'
  - "[PAGE 578]\n\n# 6.2 气泡排序（cont.）\n\n算法的实现：\n\n```\nvoid BubbleSort( int n , LIST\
