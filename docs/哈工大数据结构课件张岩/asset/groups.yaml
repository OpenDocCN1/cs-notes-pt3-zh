    \ QUEUE Q );\n{\n    if( Empty( Q ) )\n        cout<< \"空队列\" <<endl;\n    else\n\
    \        Q.front = (Q.front+1)%MaxSize ;\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_164_0.png)\n\
    \n## 2.4.4 队列的应用\n\n+ - 队列使用的原则\n+ - 凡是符合先进先出原则的\n+ - 服务窗口和排号机、打印机的缓冲区、分时系统、树型结构的遍历、图的广度优先搜索等等\n\
    \n+ - 举例\n+ - 约瑟夫出圈问题：n个人排成一圈，从第一个开始报数，报到m的人出圈，剩下的人继续开始从1报数，直到所有人都出圈为止。\n+ - 舞伴问题：假设在周末舞会上，男士们和女士们进入舞厅时，各自排成一队。跳舞开始时，依次从男队和女队的队头上各出一人配成舞伴。若两队初始人数不相同，则较长的那一队中未配对者等待下一轮舞曲。现要求写算法模拟上述舞伴配对问题。\n\
    \n## 2.5.1 串的逻辑结构\n\n## 串的操作\n\n+ - string MakeNull();\n+ - bool IsNull ( S );\n\
    + - void In( S, a );\n+ - int Len( S );\n+ - void Concat( S1, S2 );\n+ - string\
    \ Substr( S, m, n );\n+ - bool Index( S, S1 );\n\n与其他线性结构相比，串的操作对象有什么特点？\n\n+\
    \ - 串的操作通常以 串的整体 作为操作对象。\n\n## 2.5.2 串的存储结构\n\n## 顺序串：\n\n用数组来存储串中的字符序列。\n\n##\
    \ 非压缩形式\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_168_0.png)\n\n## 压缩形式\n\n\
    ![](img/ad2aee679abbcf477936d4ee2701e2d3_168_1.png)\n\n## 2.5.2 串的存储结构(Cont.)\n\
    \n如何表示串的长度？\n\n+ - 方法一： 用一个变量来表示串的实际长度， 同一般线性表\n+ - 方法二： 在串尾存储一个不会在串中出现的特殊字符作为串的终结符，表示串的结尾。\n\
    \n| 0 | 1 | 2 | 3 | 4 | 5 | 6 | ... ... | Max-1 |\n|---|---|---|---|---|---|---|---|---|\n\
    | c | h | i | n | e | s | e | 空闲 | 7 |\n\n| 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | ...\
    \ ... | Max- |\n|---|---|---|---|---|---|---|---|---|---|\n| c | h | i | n | e\
    \ | s | e | \\0 | 空闲 |\n\n## 2.5.2 串的存储结构(Cont.)\n\n## 链接串：\n\n用链接存储结构来存储串。\n\n\
    ## 非压缩形式\n\n## 压缩形式\n\n假设地址值4四个字节，每个字符一个字节。\n\n## 2.5.3 模式匹配\n\n## 模式匹配：\n\n给定主串\
    \ S=\"s₁s₂…sₙ\" 和模式 T=\"t₁t₂…tₘ\"，在 S 中寻找 T 的过程称为模式匹配。如果匹配成功，返回 T 在 S 中的位置 如果匹配失败，返回\
    \ 0。\n\n假设串采用顺序存储结构，串的长度存放在数组的 0 号单元，串值从 1 号单元开始存放。\n\n## 朴素模式匹配算法(Brute-Force算法)：枚举法\n\
    \n## 基本思想\n\n从主串 S 的第一个字符开始和模式 T 的第一个字符进行比较，若相等，则继续比较两者的后续字符；否则，从主串 S 的第二个字符开始和模式\
    \ T 的第一个字符进行比较，重复上述过程，直到 T 中的字符全部比较完毕，则说明本趟匹配成功；或 S 中字符全部比较完，则说明匹配失败。\n\n## 2.5.3\
    \ 模式匹配(Cont.)\n\n设主串S= “abab cabcacbab”，模式串T= “abcac”\n\n第1趟匹配 主串 ababcabcacbab\
    \ i=3\n模式串 abc j=3 匹配失败\n\n第2趟匹配 主串 ababcabcacbab i=2\n模式串 abc j=1 匹配失败\n\n第3趟匹配\
    \ 主串 ababcabcacbab i=7\n模式串 abcac j=5 匹配失败\n\n第4趟匹配 主串 ababcabcacbab i=4\n模式串\
    \ abc j=1 匹配失败\n\n第5趟匹配 主串 ababcabcacbab i=5\n模式串 abc j=1 匹配失败\n\n第6趟匹配 主串 ababcabcacbab\
    \ i=6\n模式串 abcac j=6 匹配成功\n\n特点:主串指针需回溯，模式串指针需复位。\n\n## 2.5.3 模式匹配(Cont.)\n\n\
    ## BF算法实现的详细步骤：\n\n+ 1. 在串S和串T中设比较的起始下标i和j;\n+ 2. 循环直到S或T的所有字符均比较完;\n+ 2.1 如果S[i]=T[j]，继续比较S和T的下一个字符;\n\
    + 2.2 否则，将i和j回溯，准备下一趟比较;\n+ 3. 如果T中所有字符均比较完，则匹配成功，返回匹配的起始比较下标；否则，匹配失败，返回0;\n"
