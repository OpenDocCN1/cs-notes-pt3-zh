    # 2.5.3 模式匹配(Cont.)




    主串S长n，模式串T长m。可能匹配成功的位置 (1~n-m+1)。


    ①最好的情况下，模式串的第1个字符失配


    设匹配成功在S的第i个字符，则在前i-1趟匹配中共比较了 i-1次，第i趟成功匹配共比较了 m次，总共比较了 (i-1+m)次 。所有匹配成功的可能共有 n-m+1种，所以在等概率情况下的平均比较次数数：


    \sum_{i=1}^{n-m+1} p_i (i-1+m) = \frac{1}{n-m+1} \sum_{i=1}^{n-m+1} (i-1+m) =
    \frac{1}{2} (m+n)


    最好情况下算法的平均时间复杂度 O(n+m)。'
  - '[PAGE 176]


    # 2.5.3 模式匹配(Cont.)


    # Brute-Force算法的时间复杂度


    主串S长n, 模式串T长m。可能匹配成功的位置（1~n-m+1）。


    ②最坏的情况下，模式串的最后一个字符失配


    设匹配成功在S的第i个字符，则在前i-1趟匹配中共比较了 (i-1)*m次，第i趟成功匹配共比较了m次，总共比较了(i*m)次。共需要n-m+1趟比较，所以在等概率情况下的平均比较次数：


    ∑_{i=1}^{n-m+1} p_i (i×m) = m/(n−m+1) ∑_{i=1}^{n-m+1} i = 1/2 m(n−m+2)


    设n>>m，最坏情况下的平均时间复杂度为O(n*m)。'
