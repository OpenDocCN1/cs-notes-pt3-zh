    - 一种数据的逻辑结构可以用多种存储结构来存储，而采用不同的存储结构，其数据处理的效率往往是不同的。\n\n### 数据结构与算法的学习内容\n\n- 数据对象的结构形式,各种数据结构的性质(逻辑结构);\n\
    - 数据对象和“关系”在计算机中的表示(物理结构/存储结构);\n- 数据结构上定义的基本操作(算法)及其实现;\n- 算法的效率（时间和空间）;\n- 数据结构的应用,如数据分类,检索等.\n"
