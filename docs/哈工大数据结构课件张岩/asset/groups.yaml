    # 3.5 树


    # 树的基本操作


    +   - **Parent( n , T )** 求结点 n 的双亲

    +   - **LeftMostChild( n , T )** 返回结点 n 的最左儿子

    +   - **RightSibling( n , T )** 返回结点 n 的右兄弟

    +   - **Data( n , T )** 返回结点 n 的信息

    +   - **CreateK k (v , T1 , T2 , ...... , Tk ) , k = 1 , 2 , ......**

    +     - 建立 data 域值为 v 的根结点 r , 有 k 株子树 T1 , T2 , ...... , Tk ，且自左至右排列；返回 r 。

    +   - **Root( T )** 返回树 T 的根结点


    # 树的遍历操作


    从根结点出发，按照某种次序访问树中所有结点，使得每个结点被访问一次且仅被访问一次。'
