    \n## 哈夫曼树的构造方法：\n\n+   1. **初始化**：由给定的$n$个权值$\\{w_1，w_2，…，w_n\\}$构造$n$棵只有一个根结点、左右子树均为空的二叉树，从而得到一个二叉树集合$F=\\\
