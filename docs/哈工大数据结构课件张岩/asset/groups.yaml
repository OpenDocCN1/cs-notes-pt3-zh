  - '[PAGE 372]


    # 4.1 基本定义(cont.)


    # 图的操作


    设图G=(V,E)，图上定义的基本操作如下：


    +   - **NEWMODE ( G )**: 建立一个新顶点， V=V∪{v}

    +   - **DELNODE ( G, v )**: 删除顶点v以及与之相关联的所有边

    +   - **SETSUC C ( G, v1, v2 )**: 增加一条边， E = E∪(v1,v2), V=V

    +   - **DELSUCC ( G, v1, v2 )**: 删除边（v1,v2）,V不变

    +   - **SUCC ( G, v1, v2 )**: 求出v的所有直接后继结点

    +   - **PRED ( G, v )**: 求出v的所有直接前导结点

    +   - **ISEEDGE ( G, v1, v2 )**: 判断（v1,v2）∈E

    +   - **FirstAdjVex( G , v )**: 顶点v 的第一个邻接顶点

    +   - **NextAdjVex( G, v, w )**: 顶点v 的某个邻接点w的下一个邻接顶点。'
