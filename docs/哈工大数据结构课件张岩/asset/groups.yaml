    \n存储结构的建立算法的实现：\n\n```\nvoid CreateMGraph (MTGraph *G) //建立图的邻接矩阵\nint i,j,k,w;\n\
    cin>>G->n>>G->e; //1.输入顶点数和边数\nfor (i=0; i<G->n; i++) //2.读入顶点信息，建立顶点表\nG->vexlist[i]=getchar();\n\
    for (i=0; i<G->n; i++)\nfor (j=0;j<G->n;j++)\nG->edge[i][j]=0; //3.邻接矩阵初始化\nfor\
    \ (k=0; k<G->e; k++) //4.读入e条边建立邻接矩阵\ncin>>i>>j>>w; // 输入边 (i,j) 上的权值w\nG-> edge[i][j]=w;\
    \ G-> edge[j][i]=w;\n} //时间复杂度: T = O( n+ n² +e) 。 当e < n, T = O( n² )\n```\n\n\
