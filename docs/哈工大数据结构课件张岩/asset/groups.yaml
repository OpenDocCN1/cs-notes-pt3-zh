    $$VL(j)=\min_{k\in S}\{VL(k)+ACT[j][k]\}$$


    +   其中 S 是以顶点 Vⱼ 为头的所有边的尾顶点的集合（2≤j≤n-1）'
  md: "\n## 4.6 拓扑排序算法(cont.)\n\n## 关于广度优先拓扑排序的几点说明\n\n- 与先广搜索的差别：\n  - 搜索起点是入度为0的顶点；\n\
    \  - 需判断是否有环路；\n  - 需对访问并输出的顶点计数（引入计数器nodes）。\n  - 需删除邻接于 v 的边（引入数组indegree[]或在顶点表中增加一个属性域indegree）。\n\
    \n- 也可以采用栈数据结构进行广度优先拓扑排序。\n\n- 亦可采用无后继顶点优先的拓扑排序算法\n\n- 也可以利用DFS遍历进行拓扑排序\n\n##\
    \ 4.6 拓扑排序算法(cont.)\n\n利用栈结构进行拓扑排序\n\n输入：有向图的邻接表，输出：所有顶点组成的拓扑序列\n\n算法实现步骤：（使用栈）\n\
    \n- 1. 建立入度为零的顶点栈\n- 2. 扫描顶点表，将入度为0的顶点栈；\n- 3. while（栈不空）{\n- 输出队头结点；\n- 记下输出结点的数目；\n\
    - 删去与之关联的出边；\n- 若有入度为0的结点，入栈\n- }\n- 4. 若输出结点个数小于n，则输出有环路；否则拓扑排序正常结束。\n\n## 4.6\
    \ 拓扑排序算法(cont.)\n\n## 基于DFS的拓扑排序\n\n```\nvoid topodfs ( v )\n{ PUSH( v ,S );\n\
    mark[v]=TRUE;\nfor ( L[v] 中的每一个顶点w )\n    if ( mark[w] = FALSE )\n        topodfs\
    \ ( w );\nprintf ( top( S ) );\nPOP ( S );\n}\n```\n\n```\nvoid dfs-topo ( GRAPH\
    \ L )\n{ MAKENULL( S );\nfor( u=1;u<=n;u++ )\n    mark[u]=FALSE;\nfor( u=1;u<=n;u++\
    \ )\n    if ( !mark[u] )\n        topodfs( u );\n}\n```\n\n思想：借助栈，在DFS中，把第一次遇到的顶点入栈，到达某一顶点递归返回时，从栈中弹出顶点并输出。\n\
    \n## 4.7 关键路径算法\n\n## AOE网（Activity On Edge Network）\n\n- 在带权的 有向图中，用结点表示事件，用边表示活动，边上权表示活动的开销（如持续时间），则称此有向图为边表示活动的网络，简称AOE网。\n\
    \n- 下图是有11项活动，9个事件的AOE网，每个事件表示在它之前的活动已经完成，在它之后的活动可以开始。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_448_0.png)\n\
    \n## 第4章图结构及其应用算法\n\n## 4.7 关键路径算法(cont.)\n\n## AOE网的性质\n\n- - 只有在某个顶点所代表的事件发生后，从该顶点出发的各有向边代表的活动才能开始；\n\
    - - 只有在进入某一顶点的各有向边代表的活动已经结束，该顶点所代表的事件才能发生；\n- - 表示实际工程计划的AOE网应该是无环的，并且存在唯一的入度为0的开始顶点（源点）和唯一的出度为0的结束点（汇点）。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_449_0.png)\n\n## 4.7 关键路径算法(cont.)\n\
    \n## AOE网研究的主要问题：\n\n如果用AOE 网表示一项工程，那么仅仅考虑各个子工程之间的优先关系还不够，更多地是关心整个工程完成的最短时间是多少，哪些活动的延迟将影响整个工程进度，而加速这些活动能否提高整个工程的效率，因此AOE网有待研究的问题是：\n\
    \n- (1)完成整个工程至少需要多少时间？\n\n- (2)哪些活动是影响工程进度的关键活动？\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_450_0.png)\n\
    \n## 4.7 关键路径算法(cont.)\n\n路径长度、关键路径、关键活动：\n\n- 路径长度：是指从源点到汇点路径上所有活动的持续时间之和。\n\n\
    - 关键路径：在AOE网中，由于有些活动可以并行，所以完成工程的最短时间是从源点到汇点的最大路径长度。因此，把从源点到汇点具有最大长度的路径称为关键路径。\n\
    \n- 一个AOE中，关键路径可能不只一条。\n\n- 关键活动：关键路径上的活动称为关键活动。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_451_0.png)\n\
    \n## 4.7 关键路径算法(cont.)\n\n关键路径和关键活动性质分析------与计算关键活动有关的量\n\n- ① 事件 Vj 的最早可能发生时间\
    \ VE(j)\n  ● 是从源点 V1 到顶点 Vj 的最长路径长度：…→ Vj — a_i → Vk\n\n- ② 活动 a_i 的最早可能开始时间 E(k)\n\
    \  ● 设活动 a_i 在边 < Vj , Vk > 上，则 E(i) 也是从源点 V1 到顶点 Vj 的最长路径长度。这是由于事件 Vj 发生表明以 Vj\
    \ 为起点的所有活动 ai 可以立即开始。因此，\n  ● E(i) = VE(j) ............ (1)\n\n- ③ 事件 Vk 的最迟发生时间\
    \ VL(k)\n  ● 是在保证汇点 Vn 在 VE(n) 时刻完成的前提下，事件 Vk 的允许的最迟开始时间。\n  ● 在不推迟工期的情况下，一个事件最迟发生时间\
    \ VL(k) 应该等于汇点的最早发生时间 VE(n) 减去从 Vk 到 Vn 的最大路径长度。\n\n## 4.7 关键路径算法(cont.)\n\n关键路径和关键活动性质分析------与计算关键活动有关的量\n\
    \n- ④ 活动 aᵢ 的最迟允许开始时间 L(i)\n\n是指在不会引起工期延迟的前提下，活动 aᵢ 允许的最迟开始时间。\n\n因为事件 Vₖ 发生表明以\
    \ Vₖ 为终点的入边所表示的所有活动均已完成，所以事件 Vₖ 的最迟发生时间 VL(k) 也是所有以 Vₖ 为终点的入边 < Vⱼ, Vₖ > 所表示的活动\
    \ aᵢ 可以最迟完成时间。\n\n显然，为不推迟工期，活动 aᵢ 的最迟开始时间 L(i) 应该是 aᵢ 的最迟完成时间 VL(k) 减去 aᵢ 的持续时间，即\n\
    \n- L(i) = VL(k) - ACT[j][k] ..............(2)\n\n其中，ACT[j][k] 是活动 aᵢ 的持续时间（<\
    \ Vⱼ, Vₖ > 上的权）。\n\n## 4.7 关键路径算法(cont.)\n\n关键路径和关键活动性质分析------与计算关键活动有关的量\n\n\
    - ⑤时间余量 L(i) - E(i)\n\nL(i) - E(i)表示活动 aᵢ 的最早可能开始时间和最迟允许开始时间的时间余量。\n\n- 关键路径上的活动都满足：\
    \ L(i) = E(i) ............( 3 )\n\n- L(i) = E(i)表示活动是没有时间余量的关键活动。\n\n- 由上述分析知，为找出关键活动，需要求各个活动的E(i)与\
    \ L(i)，以判别一个活动aᵢ是否满足L(i) = E(i)。\n\n- E(i)和L(i)可有公式 (1)和(2)计算得到。而VE(k) 和VL(k)可由拓扑分类算法得到。\n\
    \n关键路径和关键活动分析计算示例：\n\n## 4.7 关键路径算法(cont.)\n\n源点 起始点\n\n汇点 结束点\n\n| 顶点 | VE[j]\
    \ | VL[k] | 活动 | E[i] | L[i] | L[i] - E[i] |\n|---|---|---|---|---|---|---|\n\
    | V₁ | 0 | 0 | a₁ | 0 | 0 | 0 |\n| V₂ | 6 | 6 | a₂ | 0 | 2 | 2 |\n| V₃ | 4 | 6\
    \ | a₃ | 0 | 3 | 3 |\n| V₄ | 5 | 8 | a₄ | 6 | 6 | 0 |\n| V₅ | 7 | 7 | a₅ | 4 |\
    \ 6 | 2 |\n| V₆ | 7 | 10 | a₆ | 5 | 6 | 1 |\n| V₇ | 16 | 16 | a₇ | 7 | 7 | 0 |\n\
    | V₈ | 14 | 14 | a₈ | 7 | 7 | 0 |\n| V₉ | 18 | 18 | a₉ | 7 | 10 | 3 |\n|  |  |\
    \  | a₁₀ | 16 | 16 | 0 |\n|  |  |  | a₁₁ | 14 | 14 | 0 |\n| 事件的最早发生时间 |  | 事件的最迟发生时间\
    \ | 活动的最早开始时间 |  | 活动的最晚开始时间 | 时间余量 |\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_455_0.png)\n\
    \n## 4.7 关键路径算法(cont.)\n\n利用拓扑排序算法求关键路径和关键活动\n\n（1）前进阶段：从源点 V₁ 出发，令 VE(1) = 0，按拓扑序列次序求出其余各顶点事件的最早发生时间：\n\
    \n$$VE(k)=\\max_{j\\in T}\\{VE(j)+ACT[j][k]\\}$$\n\n- 其中 T 是以顶点 Vₖ 为尾的所有边的头顶点的集合（2≤k≤n）\n\
    \n- 如果网中有回路，不能求出关键路径则算法中止；否则转（2）\n\n（2）回退阶段：从汇点 Vₙ 出发，令 VL(n) = VE(n)，按逆拓扑有序求其余各顶点的最晚发生时间：\n\
    \n$$VL(j)=\\min_{k\\in S}\\{VL(k)+ACT[j][k]\\}$$\n\n- 其中 S 是以顶点 Vⱼ 为头的所有边的尾顶点的集合（2≤j≤n-1）\n"
