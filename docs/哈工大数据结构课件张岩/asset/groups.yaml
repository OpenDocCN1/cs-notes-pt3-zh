    # 定义4 图的连通性


    # 强连通图与强连通分量


    顶点的强连通性：在有向图中，若对于每一对顶点 vᵢ 和 vⱼ (i≠j)，都存在一条从 vᵢ 到 vⱼ 和从 vⱼ 到 vᵢ 的有向路径，则称顶点 vᵢ 与
    vⱼ 是强连通的。


    强连通图：如果一个有向图中任意一对顶点都是强连通的，则称此有向图是强连通图。


    强连通分量：非强连通图的极大强连通子图叫做强连通分量


