    \n1950年，哈夫曼在MIT的信息理论与编码研究生班学习。Robert Fano教授让学生们自己决定是参加期末考试还是做一个大作业。哈夫曼选择了后者，原因很简单，因为解决一个大作业可能比期末考试更容易通这个大作业促使了哈夫曼算法的诞生。\n\
    \n## David Huffman\n\n## 3.7 树型结构的应用（Cont.）\n\n## 哈夫曼（Huffman）树及其应用\n\n相关术语：\n\
    \n## 叶子节点的权值：\n\n+   对叶子节点赋予的一个有意义的数值量。\n\n## 二叉树的带权路径长度：\n\n设二叉树具有 n 个带权值的叶子节点，从根节点到各个叶子节点的路径长度与相应叶子节点权值的乘积之和。记为：\n\
    \nWPL = Σ (k=1 to n) w_k l_k\n\n从根节点到第 k 个叶子的路径长度\n\n第 k 个叶子的权值；\n\n## 3.7 树型结构的应用（Cont.）\n\
    \n相关术语：\n\n例：给定4个叶子结点，其权值分别为{2，3，4，7}，可以构造出形状不同的二叉树\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_332_0.png)\n\
    \n哈夫曼树：给定一组具有确定权值的叶子结点，带权路径长度最小的二叉树，亦称最优二叉树。\n\n## 3.7 树型结构的应用（Cont.）\n\n## 哈夫曼树的特点：\n\
    \n+   - 权值越大的叶子节点越靠近根节点，而权值越小的叶子节点越远离根节点。（构造哈夫曼树的核心思想）\n\n+   - 只有度为0（叶子节点）和度为2（分支节点）的节点，不存在度为1的节点。\n\
    \n+   - n个叶节点的哈夫曼树的节点总数为2n-1个。\n\n+   - 哈夫曼树不唯一，但WPL唯一。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_333_0.png)\n\
