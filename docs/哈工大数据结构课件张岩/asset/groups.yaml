    令 k = next[ j ]，则：


    next[ j ] = { 0 当 j = 1 时 //不比较 max { k | 1<k<j 且 T1…Tk-1 = Tj-(k-1)…Tj-1 } 1
    其他情况 }


    k = next[ j ] 实际上是找 T1 T2 … Tj-1 中的最长相同的 前缀 (T1 T2 … Tk-1) 和 后缀 (Tj-(k-1) Tj-(k-2)
    … Tj-1)。


    模式中相似部分越多，则 next[] 函数越大


