  md: "\n## 1.3 抽象数据类型\n\n## 抽象数据类型（Abstract Data Type）\n\n定义：一个数学模型和在该模型上定义的操作集合的总称\n\
    \n- ADT是程序设计语言中数据类型概念的进一步推广和进一步抽象。\n- 例4： ADT int=({x|x∈Z}, {+,-,*,/,% ,≤,==})\n\
    - 同一数学模型上定义不同的操作集，则它们代表不同的 ADT;\n\n实现：用适当的数据结构来表示ADT中的数学模型,并用一组函数（方法）来实现该模型上的各种操作。\n\
    \n## 1.3 抽象数据类型(Cont.)\n\n## 数据类型、数据结构和ADT\n\n## 各自含义：\n\n- 数据类型是一组值的集合\n- 数据结构则是数据元素之间的抽象关系；\n\
    - 抽象数据类型是一个数学模型及在该模型上定义的操作集合的总称。\n\n## 相互关系\n\n- 数据型是根据数据结构分类的,同类型的数据元素的数据结构相同。\n\
    - 数据结构则是抽象数据类型中数学模型的表示；\n- ADT是数据类型的进一步推广和进一步抽象。\n\n## 1.4 算法及算法分析\n\n## 算法的相关概念\n\
    \n- 算法（Algorithm）：是对特定问题求解步骤的一种描述，是指令的有限序列。\n- 算法的五大特性：\n  - 输入：一个算法有零个或多个输入。\n\
    \  - 输出：一个算法有一个或多个输出。\n  - 有穷性：一个算法必须总是在执行有穷步之后结束，且每一步都在有穷时间内完成。\n  - 确定性：算法中的每一条指令必须有确切的含义，对于相同的输入只能得到相同的输出。\n\
    \  - 可行性：算法描述的操作可以通过已经实现的基本操作执行有限次来实现。\n\n## 1.4 算法及算法分析(Cont.)\n\n例5：欧几里德算法——辗转相除法求两个自然数\
    \ *m* 和 *n* 的最大公约数。\n\n- 自然语言描述\n  - ①输入*m* 和 *n*；\n  - ②求*m*除以*n*的余数*r*；\n  -\
    \ ③若*r*等于0，则*n*为最大公约数，算法结束；否则执行第④步；\n  - ④将*n*的值放在*m*中，将*r*的值放在*n*中；\n  - ⑤重新执行第②步。\n\
    - 优点：容易理解\n- 缺点：冗长、二义性\n\n## 1.4 算法及算法分析(Cont.)\n\n例5: 欧几里德算法——辗转相除法求两个自然数 m 和\
    \ n 的最大公约数。\n\n```\n1. r = m % n;\n2. 循环直到 r 等于0\n   2.1 m = n;\n   2.2 n = r;\n\
    \   2.3 r = m % n;\n3. 输出 n ;\n```\n\n表达能力强，抽象性强，容易理解\n\n## 1.4 算法及算法分析(Cont.)\n\
    \n评价算法效率的方法\n\n- 事后统计：将算法实现，测算其时间和空间开销。\n- 优点：准确的实测值\n- 缺点：\n  - 编写程序实现算法将花费较多的时间和精力；\n\
    \  - 所得实验结果依赖于计算机的软、硬件等环境因素。\n- 事前分析：对算法所消耗资源的一种估算方法。\n\n算法分析：对算法所需要的计算机资源——时间和空间进行估算。\n\
    \n- 时间复杂度（Time Complexity）\n- 空间复杂度（Space Complexity）\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_25_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_25_1.png)\n\n## 1.4 算法及算法分析(Cont.)\n\
    \n算法分析----时间复杂度分析\n\n算法的执行时间=每条语句执行时间之和\n\n每条语句执行次数之和\n\n基本语句的执行次数\n\n执行次数×执行一次的时间\n\
    \n单位时间\n\n指令系统、编译的代码质量\n\n```\n例： for (i=1; i<=n; i++)\n    for (j=1; j<=n; j++)\n\
    \        x++;\n```\n\n## 1.4 算法及算法分析(Cont.)\n\n## 算法分析----算法的时间复杂度（性）\n\n算法的执行时间，是基本（操作）语句重复执行的次数，它是问题规模的一个函数。我们把这个函数的渐近阶称为该算法的时间复杂度。\n\
    \n- 问题规模：输入量的多少。\n- 基本语句：是执行次数与整个算法的执行次数成正比的操作指令。\n\n```\n例：for (i=1; i<=n; i++)\n\
    \        for (j=1; j<=n; j++)\n            x++;\n```\n\n- 问题规模： n\n- 基本语句： x++\n\
    - 时间复杂性： O（n²）\n\n## 1.4 算法及算法分析(Cont.)\n\n算法分析---大O符号\n\n定义 若存在两个正的常数c和n₀，对于任意n≥n₀，都有\
    \ T(n)≤c×f(n)，则称T(n)=O(f(n))\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_28_0.png)\n\
    \n当问题规模充分大时在渐近意义下的阶\n\n## 1.4 算法及算法分析(Cont.)\n\n算法分析---大O符号\n\n- 定理：若 A(n)=a_m\
    \ n^m + a_{m-1} n^{m-1} + ... + a_1 n + a_0 是一个 m 次多项式，则 A(n)=O(n^m)。\n- 说明：在计算算法时间复杂度时，可以忽略所有低次幂（低阶）项和最高次幂（最高阶）项的系数。\n\
    - 例：\n\n```\nfor (i=1; i<=n; ++i)\n    for (j=1; j<=n; ++j)\n    {\n        c[i][j]=0;\n\
    \        for (k=1; k<=n; ++k)\n            c[i][j]+=a[i][k]*b[k][j];\n    }\n\
    ```\n\n问题规模： n\n基本语句： *\n复杂度： O(n³)\n\n## 1.4 算法及算法分析(Cont.)\n\n算法分析---最好情况、最坏情况、平均情况\n\
    \n例：在一维整型数组A[n]中顺序查找与给定值k相等的元素（假设该数组中有且仅有一个元素值为k）。\n\n```\nint Find(int A[], int\
    \ n)\n{\n    for (i=0; i<n; i++)\n        if (A[i]==k) break;\n    return i;\n\
    }\n```\n\n- 基本语句的执行次数是否只和问题规模有关？\n- 结论：如果问题规模相同，时间代价与输入数据（的分布）有关，则需要分析最好情况、最坏情况、平均情况\n\
    \n## 1.4 算法及算法分析(Cont.)\n\n算法分析---常见的时间复杂度\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_31_0.png)\n\
    \n程序运行时间比较 T(n)=O(f(n))\n\n- 常见阶的比较:\n- O(1) < O(log₂n) < O(n) < O(n log₂n) <\
    \ O(n²) < O(n³) < ... < O(2ⁿ) < O(n!)\n\n## 1.4 算法及算法分析(Cont.)\n\n算法分析——时间复杂性分析的基本方法\n\
    \n- 时间复杂性的运算规则\n  设 T₁(n)=O( f(n) )，T₂(n)=O( g(n) )，则\n  - ①加法规则: T₁(n)+T₂(n)=\
    \ O(max{ f(n), g(n) })\n  - ②乘法规则: T₁(n)*T₂(n)= O( f(n) · g(n) )\n- 时间复杂性的分析方法\n\
    \  - 首先求出程序中各语句、各模块的运行时间，\n  - 再求整个程序的运行时间。\n  - 各种语句和模块分析应遵循的规则是：\n\n## 1.4 算法及算法分析(Cont.)\n\
    \n算法分析----各种语句和模块分析应遵循的规则\n\n- (1) 赋值语句或读/写语句：\n  - 运行时间通常取O(1)。有函数调用的除外，此时要考虑函数的执行时间。\n\
    - (2) 语句序列：\n  - 运行时间由加法规则确定，即该序列中耗时最多的语句的运行时间。\n- (3) 分支语句：\n  - 运行时间由条件测试（通常为O(1)）加上分支中运行时间最长的语句的运行时间\n\
    - (4) 循环语句：\n\n## 1.4 算法及算法分析(Cont.)\n\n算法分析——各种语句和模块分析应遵循的规则\n\n- (4) 循环语句：\n\
    - 运行时间是对输入数据重复执行n次循环体所耗时间的总和\n- 每次重复所耗时间包括两部分：一是循环体本身的运行时间；二是计算循环参数、测试循环终止条件和跳回循环头所耗时间。后一部分通常为O(1)。\n\
    - 通常，将常数因子忽略不计，可以认为上述时间是循环重复次数n和m的乘积，其中m是n次执行循环体当中时间消耗最多的那一次的运行时间(乘法规则)\n- 当遇到多重循环时，要由内层循环向外层逐层分析。因此，当分析外层循环的运行时间是，内层循环的运行时间应该是已知的。此时，可以把内层循环看成是外层循环的循环体的一部分。\n"
