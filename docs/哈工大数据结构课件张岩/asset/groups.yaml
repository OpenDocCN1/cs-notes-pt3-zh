    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_225_0.png)\n\n### 二叉树的基本形态\n\n- Φ 空二叉树\n\
    - 只有一个根结点\n- 根结点只有右子树\n- 根结点只有左子树\n- 根结点同时有左右子树\n\n### 具有3个结点的树和二叉树的不同构形态\n\n\
    ![](img/ad2aee679abbcf477936d4ee2701e2d3_227_0.png)\n\n树的**不同构形态**\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_227_1.png)\n\
    \n二叉树的**不同构形态**\n\n### 特殊的二叉树——斜树\n\n- 左斜树：所有结点都只有左子树的二叉树称为左斜树；\n- 右斜树：所有结点都只有右子树的二叉树称为右斜树；\n\
    - 斜树：左斜树和右斜树统称为斜树。\n\n**斜树的结构特点：**\n\n- 在斜树中，每一层只有一个结点；\n- 斜树的结点个数与其高度相同。\n\n\
    ![](img/ad2aee679abbcf477936d4ee2701e2d3_228_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_228_1.png)\n\
    \n### 特殊的二叉树——满二叉树\n\n**定义：** 高度为K且有2^K-1个结点的二叉树称为满二叉树。\n\n**结构特点：**\n\n- 分支结点都有两棵子树\n\
    - 叶子结点都在最后一层\n\n满二叉树在相同高度的二叉树中，结点数、分支结点数和叶子结点数都是最多的。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_229_0.png)\n\
    \n### 特殊的二叉树——完全二叉树\n\n**定义：** 称满足下列性质的二叉树(假设高度为k)为完全二叉树：\n\n1. 所有的叶都出现在k或k-1层；\n\
    2. k-1层的所有叶都在非终结结点的右边；\n3. 除了k-1层的最右非终结结点可能有一个（只能是左分支）或两个分支之外，其余非终结结点都有两个分支。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_230_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_230_1.png)\n\
    \n**结构特点：**\n\n1. 叶子结点只能出现在最下两层，且最下层的叶子结点都集中在二叉树的左部；\n2. 完全二叉树中如果有度为1的结点，只可能有一个，且该结点只有左孩子。\n\
    3. 深度为k的完全二叉树在k-1层上一定是满二叉树。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_231_0.png)\n\
    \n### 二叉树的性质\n\n**性质1：**\n\n二叉树的第 i 层最多有 2^{i-1} 个结点。(i ≥ 1)\n\n证明(数学归纳法):\n\n\
    当 i=1 时，第1层只有一个根结点，而 2^{i-1}=2^{0}=1，结论成立。\n\n假定 i=k (1≤k<i) 时结论成立，即第 k 层上至多有\
    \ 2^{k-1} 个结点，则 i=k+1 时，因为第 k+1 层上的结点是第 k 层上结点的孩子，而二叉树中每个结点最多有 2 个孩子，故在第 k+1 层上最大结点个数为第\
    \ k 层上的最大结点个数的二倍，即 2×2^{k-1}=2^{k}。结论成立。\n\n**性质2：**\n\n高度为 k (k ≥ 1) 的二叉树最多有\
    \ 2^k - 1 个结点，最少有 k 个结点。\n\n证明：由性质1可知，高度为k的二叉树中结点个数最多 = Σ_{i=1}^{k} (第i层上结点的最大个数)\
    \ = 2^0 + 2^1 + 2^2 + ... + 2^{k-1} = 2^k -1；另外，每一层至少要有一个结点，因此，高度为k的二叉树，至少有k个结点。\n\
    \n- 高度为k且具有2^k-1个结点的二叉树一定是满二叉树。\n- 高度为k且具有k个结点的二叉树不一定是斜树。\n\n**性质3：**\n\n在非空二叉树中，如果叶子结点数为\
    \ $n_0$，度为2的结点数为 $n_2$，则有：$n_0 = n_2 + 1$，而与度数为1的结点数 $n_1$ 无关。\n\n证明：设 $n$ 为二叉树的结点总数，则有：\n\
    \n$n = n_0 + n_1 + n_2$\n\n在 $n$ 个结点的二叉树中，共有 $n - 1$ 条分支(边)；在这些分支中，度为1和度为2的结点分别提供1条和2条分支。所以有：\n\
    \n$n - 1 = n_1 + 2n_2$\n\n因此可以得到：$n_0 = n_2 + 1$。与度数1的结点数 $n_1$ 无关。\n\n在有 $n$\
    \ 个结点的满二叉树中，有多少个叶子结点？\n\n**性质4：**\n\n具有 n(n≥0) 个结点的完全二叉树的高度为 ⌈log₂(n+1)⌉ 或 ⌊log₂\
    \ n⌋+1\n\n证明：设完全二叉树的高度为 k，则根据性质2有：\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_235_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_235_1.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_235_2.png)\n\
    \n### 完全（满）二叉树的性质\n\n**完全二叉树的顺序存储结构：**\n\n如果把一棵完全二叉树的具有 n 个结点自顶向下，同一层自左向右连续编号：1,\
    \ 2, ..., n，且使该编号对应于数组的下标，即编号为 i（1≤i≤n）的结点存储在下标为 i 的数组单元中，则这种存储表示方法称为完全（满）二叉树的顺序存储结构。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_236_0.png)\n\n### 完全二叉树的顺序存储结构的性质\n\
    \n- 若 i = 1, 则 i 是根结点，无父结点；若 i > 1, 则 i 的父结点为 ⌊i/2⌋\n- 若 2*i ≤ n, 则 i 有左儿子且为 2*i;\
    \ 否则，i 无左儿子。\n- 若 2*i+1 ≤ n, 则 i 有右儿子且为 2*i+1; 否则，i 无右儿子\n- 若 i 为偶数, 且 i ≤ n,\
    \ 则其右兄弟为 i + 1。\n- 若 i 为奇数, 且 i ≤ n && i != 1, 则其左兄弟为 i-1\n\n|   | A | B | C |\
