    # 5.7 B-树和B⁺树（Cont.）


    当符号表的大小超过内存容量时，由于必须从磁盘等辅助存储设备上去读取这些查找树结构中的结点，每次只能根据需要读取一个结点 因此，AVL树性能就不是很高


    在AVL树在结点高度上采用相对平衡的策略，使其平均性能接近于BST的最好情况下的性能。


    如果保持查找树在高度上的绝对平衡，而允许查找树结点的子树个数（分支个数）在一定范围内变化，能否获得很好的查找性能呢？


    基于这样的想法，人们设计了许多在高度上保持绝对平衡，而在宽度上保持相对平衡的查找结构


    如B-树及其各种变形结构，这些查找结构不再是二叉结构而是m-路查找树（m-way search tree），且以其子树保持等高为其基本性质，在实际中都有着广泛的应用。'
