    # # 6.4 直接选择排序


    算法的基本思想


    +   - 选择排序的主要操作是选择，其主要思想是：每趟排序在当前待排序序列中选出关键字值最小（最大）的记录，添加到有序序列中。


    +   - 直接选择排序，对待排序的记录序列进行n-1遍的处理，1遍处理是将A[1...n]中最小者与A[1]交换位置，第2遍处是将A[2...n]中最小者与A[2]交换位置，......，第i遍处理是将A[i...n]中最小者与A[i]交换位置。这样，经过i遍处理之后，前i个记录的位置就已经按照从小到大的顺序排列好了。


    +   - 直接选择排序与气泡排序的区别在：气泡排序每次比较后，如果发现顺序不对立即进行交换，而选择排序不立即进行交换，而是找出最小关键字记录后再进行交换。'
