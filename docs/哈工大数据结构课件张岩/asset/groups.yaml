    # 分治法的基本思想


    +   分解(划分): 将原问题分解为若干个与原问题相似的子问题;


    +   求解: 递归地求解子问题。若子问题的规模足够小，则直接求解


    +   组合: 将每个子问题的解组合成原问题的解。'
