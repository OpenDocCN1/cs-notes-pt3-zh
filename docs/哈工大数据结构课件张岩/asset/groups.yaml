    \ 012 018 |\n| Q[2] | 321 123 |\n| Q[3] | 432 |\n| Q[4] | 543 |\n| Q[5] |  |\n\
    | Q[6] | 765 |\n| Q[7] | 678 |\n| Q[8] | 986 987 789 |\n| Q[9] | 890 098 |\n\n\
    - 901 109 210 012 018 321 123 432 543 765 678 986 987 789 890 098\n\n| Q | Numbers\
    \ |\n| --- | --- |\n| Q[0] | 012 018 098 |\n| Q[1] | 109 123 |\n| Q[2] | 210 |\n\
    | Q[3] | 321 |\n| Q[4] | 432 |\n| Q[5] | 543 |\n| Q[6] | 678 |\n| Q[7] | 765 789\
    \ |\n| Q[8] | 890 |\n| Q[9] | 901 986 987 |\n\n- 012 018 098 109 123 210 321 432\
    \ 543 678 765 789 890 901 986 987\n\n#### 算法实现\n\n```c\nvoid RadixSort(int figure,\
    \ QUEUE &A)\n{\n    QUEUE Q[10];\n    record data;\n    int pass, r, i;\n    for\
    \ (pass = 1; pass <= figure; pass++) {\n        for (i = 0; i <= 9; i++) /* 置空队列\
    \ */\n            MAKENULL(Q[i]);\n        while (!EMPTY(A)) { /* 分配 */\n    \
    \        data = FRONT(A);\n            DEQUEUE(A);\n            r = Radix(data.key,\
    \ pass);\n            ENQUEUE(data, Q[r]);\n        }\n        for (i = 0; i <=\
    \ 9; i++) /* 收集 */\n            while (!EMPTY(Q[i])) {\n                data =\
    \ FRONT(Q[i]);\n                DEQUEUE(Q[i]);\n                ENQUEUE(data,\
    \ A);\n            }\n    }\n}\n```\n\n```c\n/* 求整数 k 的第 p 位 */\nint Radix(int\
    \ k, int p)\n{\n    int power = 1;\n    for (int i = 1; i <= p - 1; i++)\n   \
