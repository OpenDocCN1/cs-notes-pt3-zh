    # 1.3 抽象数据类型(Cont.)


    # 数据类型、数据结构和ADT


    # 各自含义：


    +   - 数据类型是一组值的集合

    +   - 数据结构则是数据元素之间的抽象关系；

    +   - 抽象数据类型是一个数学模型及在该模型上定义的操作集合的总称。


