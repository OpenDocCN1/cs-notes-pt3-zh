  - '[PAGE 32]


    # 1.4 算法及算法分析(Cont.)


    算法分析——时间复杂性分析的基本方法


    +   - 时间复杂性的运算规则

    +     设 T₁(n)=O( f(n) )，T₂(n)=O( g(n) )，则

    +     - ①加法规则: T₁(n)+T₂(n)= O(max{ f(n), g(n) })

    +     - ②乘法规则: T₁(n)*T₂(n)= O( f(n) · g(n) )


    +   - 时间复杂性的分析方法

    +     - 首先求出程序中各语句、各模块的运行时间，

    +     - 再求整个程序的运行时间。

    +     - 各种语句和模块分析应遵循的规则是：'
  - '[PAGE 33]


    # 1.4 算法及算法分析(Cont.)


    算法分析----各种语句和模块分析应遵循的规则


    +   - (1) 赋值语句或读/写语句：

    +     - 运行时间通常取O(1)。有函数调用的除外，此时要考虑函数的执行时间。

    +   - (2) 语句序列：

    +     - 运行时间由加法规则确定，即该序列中耗时最多的语句的运行时间。

