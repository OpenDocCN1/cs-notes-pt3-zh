  - "[PAGE 429]\n\n# 4.5 最短路径算法(cont.)\n\n# Dijkstra算法的实现\n\n```\nvoid Dijkstra(GRAPH\
    \ C, costtype D[n+1], int P[n+1], bool S[n+1])\n{\n  for ( i=1 ; i<=n; i++ )\n\
    \  {\n    D[i]=C[1][i]; S[i]=FALSE ;}\n  S [1]= TRUE ;\n  for( i=1; i<n; i++)\n\
    \  { w=MinCost ( D, S );\n    S[w]=TRUE ;\n    for ( v=2 ; v<= n ; n++ )\n   \
    \   if ( S[v]!=TRUE )\n      {  sum=D[w] + C[w][v] ;\n        if (sum < D[v]){D[v]\
    \ = sum ; P[v]=w;}}\n  }\n}// 时间复杂度： O (n²)\n```\n\n```\ncosttype MinCost (D,\
    \ S)\n{\ntemp = INFINITY ;\nw = 2 ;\nfor ( i=2 ; i<=n ; i++ )\n  if (!S[i]&&D[i]<temp)\n\
    \  { temp = D[i] ;\n    w = i ;\n  }\nreturn w ;\n}\n```"
