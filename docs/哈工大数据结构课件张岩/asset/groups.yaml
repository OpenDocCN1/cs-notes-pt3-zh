  - '[PAGE 438]


    # 4.6 拓扑排序算法(cont.)


    偏序关系：若集合X上的关系R是自反的、反对称的和传递的


    +   - 自反性：任意x∈X, (x, x) ∈R


    +   - 反对称性：任意x、y∈X，若(x, y)∈R且(y, x)∈R，则x=y


    +   - 传递性：任意x, y, z∈X, (x, y)∈R且(y, z)∈R，则(x, z)∈R


    则称R是集合X上的偏序关系。


    全序关系：


    +   - 设R是集合X上的偏序关系，如果对每个x、y∈X，必有(x, y)∈R或(y, x)∈R，则称R是集合X上的全序关系


    直观上，偏序指集合上只有部分元素之间可比较，而全序是指全体元素均可比较。'
