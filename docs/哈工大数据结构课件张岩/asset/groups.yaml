  - '[PAGE 467]


    # 5.1 基本概念和术语（Cont.）


    # 查找表的操作


    +   - **SEARCH（k，F）：**

    +     - 在数据集合（查找表、文件）F 中查找关键字值等于 k 的数据元素（记录）。若查找成功，则返回包含 k 的记录的位置；否则，返回一个特定的值。

    +   - **INSERT（R，F）：**

    +     - 在动态环境下的插入操作。在 F 中查找记录 R，若查找不成功，则插入 R；否则不插入 R。

    +   - **DELETE(k，F)：**

    +     - 在动态环境下的删除操作。在 F 中查找关键字值等于 k 的数据元素（记录）。若查找成功，则删除关键字值等于 k 的记录，否则不删除任何记录。'
