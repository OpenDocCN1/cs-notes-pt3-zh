    \    w = InNext( R ) ;\n    w->lchild = R ; }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_287_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_287_1.png)\n\n## 3.2 二叉树（Cont.）\n\n\
