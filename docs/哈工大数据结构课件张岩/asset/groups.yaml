  - '[PAGE 232]


    # 3.2 二叉树（Cont.）


    # 二叉树的性质


    # 性质1:


    二叉树的第 i 层最多有 2^{i-1} 个结点。(i ≥ 1)


    证明(数学归纳法):


    当 i=1 时，第1层只有一个根结点，而 2^{i-1}=2^{0}=1，

    结论成立。


    假定 i=k (1≤k<i) 时结论成立，即第 k 层上至多有 2^{k-1} 个结点，则 i=k+1 时，因为第 k+1 层上的结点是第 k 层上结点的孩子，而二叉树中每个结点最多有
    2 个孩子，故在第 k+1 层上最大结点个数为第 k 层上的最大结点个数的二倍，即 2×2^{k-1}=2^{k}。结论成立。'
  - '[PAGE 233]


    # 3.2 二叉树（Cont.）


    # 二叉树的性质


    # 性质2：


    高度为 k (k ≥ 1) 的二叉树最多有 2^k - 1 个结点，最少有 k 个结点。


    证明：由性质1可知，高度为k的二叉树中结点个数最多 = Σ_{i=1}^{k} (第i层上结点的最大个数) = 2^0 + 2^1 + 2^2 + ...
    + 2^{k-1} = 2^k -1；

    另外，每一层至少要有一个结点，因此，高度为k的二叉树，至少有k个结点。


    +   高度为k且具有2^k-1个结点的二叉树一定是满二叉树，

    +   高度为k且具有k个结点的二叉树不一定是斜树。'
