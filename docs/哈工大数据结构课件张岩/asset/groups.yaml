    \ 指示当前正在访问的结点。显然，结点*pre是结点*p 的前驱，而 *p是结点*pre 的后继。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_288_0.png)\n\
    \n二叉树\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_288_1.png)\n\n动态二叉链表\n\n## 3.2\
    \ 二叉树（Cont.）\n\n算法5：二叉树的（中序）线索化算法------递归算法\n\n实现步骤：\n- 1 如果二叉链表root为空，则返回；否则，\n\
    - 2 对root的左子树建立线索；\n- 3 对根节点root建立线索；\n- 4 对root的右子树建立线索。\n- 3.1 若root没有左孩子，则为root加上前驱线索；\n\
    - 3.2 若root没有右孩子，则将root右标志置为FALSE；\n- 3.3 若节点pre右标志为FALSE，则为pre加上后继线索；\n- 3.4\
    \ 令pre指向刚刚访问的节点root；\n\n## 3.2 二叉树（Cont.）\n\n```\nBTREE *pre=NULL; //全局量\nvoid\
    \ InOrderTh(BTREE *p)//将二叉树 p 中序线索化\n{ if( p ){ //p 非空时，当前访问的结点是 p\nInOrderTh(\
