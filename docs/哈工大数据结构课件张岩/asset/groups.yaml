    # 孩子链表表示法（邻接表表示）


    +   - 把每个结点的孩子看成是一个线性表，且以单链表存储，则 n 个结点共有 n 个孩子链表。


    +   - 再把每个单链表的表首结点指针，组织成一个线性表，为了便于进行查找采用顺序存储。


