    # 克鲁斯卡尔（Kruskal）算法


    # 基本思想：


    +   设无向连通网为G=(V, E)，令G的最小生成树为T=(U, TE)，其初态为U=V， TE={ }，


    +   然后，按照边的权值由小到大的顺序，依次考察G的边集E中的各条边。


    +   若被考察的边连接的是两个不同连通分量，则将此边作为最小生成树的边加入到T中，同时把两个连通分量连接为一个连通分量；


    +   若被考察的边连接的是同一个连通分量，则舍去此边，以免造成回路，


    +   如此下去，当T中的连通分量个数为1时，此连通分量便为G的一棵最小生成树。'
