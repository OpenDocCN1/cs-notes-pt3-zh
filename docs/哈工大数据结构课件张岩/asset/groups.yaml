  - '[PAGE 501]


    # 5.5 二叉查找树BST（Cont.）


    # 二叉查找树的查找性能


    +   二叉排序树的查找性能取决于二叉排序树的形态，在 O(log₂n) 和 O(n) 之间。


    +   在最坏情况下，二叉查找树是通过把有序表的 n 个结点依次插入而生成的，此时所得到的二叉查找树退化为一株高度为 n 的单支树，它的平均查找长度和单链表上的顺序查找相同，(n+1)/2。


    +   在最好情况下，二叉查找树的形态比较均匀，最终得到一株形态与折半查找的判定树相似，此时的平均查找长度约为 log₂ n。


    +   二叉查找树的平均高度为 O(log₂ n)。因此平均情况下，三种操作的平均时间复杂度为 O(log₂ n)


    +   就平均性能而言，二叉查找树上的查找和二分查找差不多


    +   就维护表的有序性而言，二叉查找树更有效。'
