    # 6.8 （二路）归并排序


    # 归并排序


    +   - 归并：将两个或两个以上的有序序列合并成一个有序序列的过程。


    +   - 归并排序的主要操作是归并，其主要思想是：将若干有序序列逐步归并，最终得到一个有序序列。


    # 如何将两个有序序列合成一个有序序列？（二路归并基础）


    +   - 设相邻的按关键字有序序列为A[s] ~ A[m]和A[m+1] ~ A[t]，归并成一个按关键字有序序列B[s] ~ B[t]


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_614_0.png)'
  - "[PAGE 615]\n\n# 6.8 （二路）归并排序（cont.）\n\n```\nvoid Merge (int s , int m , int t\
    \ , LIST A , LIST B)\n/*将有序序列A[s],...,A[m]和A[m+1],...,A[t]合并为一个有序序列 B[s],...,B[t]*/\n\
    { int i = s; j = m+1 , k = s;//置初值\n    /* 两个序列非空时，取小者输出到B[k]上 */\n    while (\
    \ i <= m && j <= t )\n        B[k++] = ( A[i].key <= A[j].key ) ? A[i++] : A[j++]\
    \ ;\n    /* 若第一个子序列非空(未处理完)，则复制剩余部分到B */\n    while ( i <= m )  B[k++] = A[i++]\
    \ ;\n    /* 若第二个子序列非空(未处理完)，则复制剩余部分到B */\n    while ( j <= t )  B[k++] = A[j++]\
    \ ;\n}/*时间复杂度： O(t−s+1)；    空间复杂度： O(t−s+1) */\n```"
