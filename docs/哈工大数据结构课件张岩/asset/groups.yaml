    # 3.1 树与二叉树的基本术语（Cont.）


    # 基本术语：


    +   - **节点的度：** 节点所具有的子树的个数。


    +   - **树的度：** 树中各节点度的最大值。


    +   - **叶子节点：** 度为0的节点，也称为终端节点。


    +   - **分支节点：** 度不为0的节点，也称为非终端节点。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_219_0.png)'
  - '[PAGE 220]


    # 3.1 树与二叉树的基本术语（Cont.）


    基本术语：


    +   - **节点孩子、双亲：** 树中某节点子树的根节点称为这个节点的孩子节点（子节点、儿子），这个节点称为它孩子节点的双亲节点（父节点）；

    +   - **兄弟：** 具有同一个双亲的孩子节点互称为兄弟。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_220_0.png)'
  - '[PAGE 221]


    # 3.1 树与二叉树的基本术语（Cont.）


    # 基本术语：


    路(径)和路(径)长度：如果树的结点序列 n₁, n₂, ..., nₖ 有如下关系：结点 nᵢ 是 nᵢ₊₁ 的双亲（1<=i<k），则把 n₁, n₂,
    ..., nₖ 称为一条由 n₁ 至 nₖ 的路径；路径上经过的边的个数称为路径长度。


    祖先、子孙：在树中，如果有一条路径从结点 x 到结点 y，那么 x 就称为 y 的祖先，而 y 称为 x 的子孙。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_221_0.png)'
  - '[PAGE 222]


    # 3.1 树与二叉树的基本术语（Cont.）


    基本术语：


    +   - **节点的层数：** 根节点的层数为1；对其余任何节点，若某节点在第k层，则其孩子节点在第k+1层。

    +   - **树的深度：** 树中所有节点的最大层数，也称高度。


