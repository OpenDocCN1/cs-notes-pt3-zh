    \ 到 vᵢ 的有向路径，则称顶点 vᵢ 与 vⱼ 是强连通的。\n\n强连通图：如果一个有向图中任意一对顶点都是强连通的，则称此有向图是强连通图。\n\n\
    强连通分量：非强连通图的极大强连通子图叫做强连通分量\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_371_0.png)\n\
    \n## 4.1 基本定义(cont.)\n\n### 图的操作\n\n设图G=(V,E)，图上定义的基本操作如下：\n\n- **NEWNODE ( G\
    \ )**: 建立一个新顶点， V=V∪{v}\n- **DELNODE ( G, v )**: 删除顶点v以及与之相关联的所有边\n- **SETSUCC\
    \ ( G, v1, v2 )**: 增加一条边， E = E∪(v1,v2), V=V\n- **DELSUCC ( G, v1, v2 )**: 删除边（v1,v2）,V不变\n\
    - **SUCC ( G, v1, v2 )**: 求出v的所有直接后继结点\n- **PRED ( G, v )**: 求出v的所有直接前导结点\n- **ISEEDGE\
    \ ( G, v1, v2 )**: 判断（v1,v2）∈E\n- **FirstAdjVex( G , v )**: 顶点v 的第一个邻接顶点\n- **NextAdjVex(\
    \ G, v, w )**: 顶点v 的某个邻接点w的下一个邻接顶点。\n\n## 4.1 基本定义(cont.)\n\n### 不同逻辑结构之间的比较\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_373_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_373_1.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_373_2.png)\n\n- 在 线性结构中，数据元素之间仅具有线性关系(1:1);\n\
    - 在 树型结构中，结点之间具有层次关系(1:m);\n- 在 图型结构中，任意两个顶点之间都可能有关系(m:n)。\n\n## 4.1 基本定义(cont.)\n\
    \n### 不同逻辑结构之间的比较\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_374_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_374_1.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_374_2.png)\n\n- 在线性结构中，元素之间的关系为前驱和后继；\n\
    - 在树型结构中，节点之间的关系为双亲和孩子；\n- 在图型结构中，顶点之间的关系为邻接。\n\n## 4.2 图的存储结构\n\n### 是否可以采用顺序存储结构存储图？\n\
    \n- 图的特征：顶点之间的关系是 m:n，即任何两个顶点之间都可能存在关系（边），无法通过存储位置表示这种任意的逻辑关系，所以，图无法采用顺序存储结构。\n\
    \n### 如何存储图？\n\n- 考虑图的定义，图是由顶点和边组成的；\n- 分别考虑如何存储顶点、如何存储边----顶点之间的关系。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_375_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_375_1.png)\n"
  mdcn: "\n## 4.1 基本定义\n\n### 定义1 图(Graph)\n\n图是由顶点（vertex）的有穷非空集合和顶点之间边（edge）的集合组成的一种数据结构，通常表示为：\n\
    \n```\nG = (V, E)\n```\n\n其中： G表示一个图， V是图G中顶点的集合， E是图G中顶点之间的边的集合。\n\n顶点表示数据对象；\
