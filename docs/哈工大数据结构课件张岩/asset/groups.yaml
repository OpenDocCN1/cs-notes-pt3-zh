    void CreateHuffmanEncoding (HuffmanT T, HuffmanCode H)\n{\n    /*根据Huffman树T 求Huffman编码表H*/\n\
    \    int c, p, i;          /* c和p分别指示T中孩子和双亲的位置 */\n    char cd[n+1];        \
