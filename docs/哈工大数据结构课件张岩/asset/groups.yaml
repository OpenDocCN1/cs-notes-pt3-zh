  - '[PAGE 25]


    # 1.4 算法及算法分析(Cont.)


    评价算法效率的方法


    +   - 事后统计：将算法实现，测算其时间和空间开销。

    +   - 优点：准确的实测值

    +   - 缺点：

    +     - 编写程序实现算法将花费较多的时间和精力；

    +     - 所得实验结果依赖于计算机的软、硬件等环境因素。

    +   - 事前分析：对算法所消耗资源的一种估算方法。


    算法分析：对算法所需要的计算机资源——时间和空间进行估算。


    +   - 时间复杂度（Time Complexity）

    +   - 空间复杂度（Space Complexity）


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_25_0.png)


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_25_1.png)'
  - "[PAGE 26]\n\n# 1.4 算法及算法分析(Cont.)\n\n算法分析----时间复杂度分析\n\n算法的执行时间=每条语句执行时间之和\n\n\
    每条语句执行次数之和\n\n基本语句的执行次数\n\n执行次数×执行一次的时间\n\n单位时间\n\n指令系统、编译的代码质量\n\n```\n例： for\
    \ (i=1; i<=n; i++)\n    for (j=1; j<=n; j++)\n        x++;\n```"
  - "[PAGE 27]\n\n# 1.4 算法及算法分析(Cont.)\n\n# 算法分析----算法的时间复杂度（性）\n\n算法的执行时间，是基本（操作）语句重复执行的次数，它是问题规模的一个函数。我们把这个函数的渐近阶称为该算法的时间复杂度。\n\
    \n+   - **问题规模：**输入量的多少。\n+   - **基本语句：**是执行次数与整个算法的执行次数成正比的操作指令。\n\n```\n例：for\
    \ (i=1; i<=n; i++)\n        for (j=1; j<=n; j++)\n            x++;\n```\n\n+ \
    \  - **问题规模：** n\n+   - **基本语句：** x++\n+   - **时间复杂性：** O（n²）"
  - '[PAGE 28]


