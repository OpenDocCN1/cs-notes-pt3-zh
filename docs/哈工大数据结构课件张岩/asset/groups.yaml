    \ max { k | 1<k<j 且 T1…Tk-1 = Tj-(k-1)…Tj-1 } 1 其他情况 }\n\nk = next[ j ] 实际上是找\
    \ T1 T2 … Tj-1 中的最长相同的 前缀 (T1 T2 … Tk-1) 和 后缀 (Tj-(k-1) Tj-(k-2) … Tj-1)。\n\n\
    模式中相似部分越多，则 next[] 函数越大\n\n- 表示模式 T 字符之间的相关度越高，\n- 模式串向右滑动得越远，\n- 与主串进行比较的次数越少，时间复杂度就越低。\n\
    \n仍是一个模式匹配的过程, 只是主串和模式串在同一个串 T 中\n\n## 2.5.3 模式匹配(Cont.)\n\n计算next[j]的方法：\n\n\
    - 当j=1时， next[j]=0;\n  //next[j]=0表示根本不进行字符比较\n\n- 当j>1时， next[j]的值为：模式串的位置从1到j-1构成的串中所出现的首尾相同的子串的最大长度加1。\n\
    \n- 当无首尾相同的子串时next[j]的值为1。\n  //next[j]=1表示从模式串头部开始进行字符比较\n\n## 2.5.3 模式匹配(Cont.)\n\
    \n函数k=next[]的实现\n\n```\nvoid GetNext(char* t, int Next[])\n{\n    int j= 1,k=\
    \ 0; Next[1]= 0;\n    while ( j < t[0] )\n        if (k==0||T[j]==T[k]){\n   \
    \         j++; k++;  Next[j]= k;\n        }\n        else k=Next[k];\n}\n//时间复杂度：\
    \ O(m)\n```\n\n## 2.5.3 模式匹配(Cont.)\n\n计算next[j]的方法：\n\n模式串 T: a b a a b c a c\n\
    可能失配位 j: 1 2 3 4 5 6 7 8\n新匹配位 k=next[j]: 0 1 1 2 2 3 1 2\n\nj=1时, next[j] = 0;\n\
    \nj=2时, next[j] = 1;\n\nj=3时, T₁≠T₂, 因此, k=1;\n\nj=4时, T₁=T₃, 因此, k=2;\n\nj=5时,\
    \ T₁=T₄, 因此, k=2;\n\n以此类推。\n\n## 2.5.3 模式匹配(Cont.)\n\nKMP算法实现步骤：\n\n- 1. 在串S和串T中分别设比较的起始下标i和j；\n\
    - 2. 循环直到S中所剩字符长度小于T的长度或T中所有字符均比较完毕\n  - 2.1 如果S[i]=T[j]，继续比较S和T的下一个字符；否则\n  -\
    \ 2.2 将j向右滑动到next[j]位置，即j=next[j]；\n  - 2.3 如果j=0，则将i和j分别加1，准备下趟比较；\n- 3. 如果T中所有字符均比较完毕，则返回匹配的起始下标；否则返回0；\n\
    \n## 2.5.3 模式匹配(Cont.)\n\n### KMP算法的实现\n\n```\nint Index_KMP(char* S, char* T,\
    \ int pos=1)\n{ /*S为主串T为模式，串的第0位置存放串长度；串采用顺序存储结构*/\n    i = pos;   j = 1;    \
    \                 // 从第一个位置开始比较\n    while (i<=S[0] && j<=T[0]) {\n        if\
    \ (S[i] == T[j]) {++i; ++j;}      // 继续比较后继字符\n        else j = Next[j];     \
    \            // 模式串向右移\n    }\n    if (j > T[0]) return i-T[0];          // 返回与模式第一字符相等\n\
    \    else return 0;    // 匹配不成功          // 的字符在主串中的序号\n}\n```\n\n## 2.6 (多维)数组\n\
    \n### 数组：\n\n- 是由下标（index）和值（value）组成的序对（index, value）的集合。\n- 也可以定义为是由相同类型的数据元素组成有限序列。\n\
