    # 5.5 二叉查找树BST（Cont.）


    二叉查找树的查找操作：


    在F 中查找关键字为k 的记录如下：


    +   - 若F = NULL，则查找失败；否则，

    +   - k ==F->data.key，则查找成功；否则，

    +   - k < F->data.key，则递归地在F 的左子树查找k；否则

    +   - k > F->data.key，则递归地在F 的右子树查找k。


