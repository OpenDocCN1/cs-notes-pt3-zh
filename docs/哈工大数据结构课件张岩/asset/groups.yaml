    } //以vₖ为出发点时对用邻接矩阵表示的图G进行先广搜索\n```\n\n### 4.4 最小生成树算法\n\n#### 生成树的代价\n\n- 设 G=(V,E)\
    \ 是一个无向连通网，E 中每一条边 (u,v) 上的权值 c(u,v)，称为 (u,v) 的边长。\n- 图 G 的生成树上各边的权值（边长）之和称为该生成树的代价。\n\
    \n#### 最小生成树(Minimum-Cost Spanning Tree, MST)\n\n- 在图 G 所有生成树中，代价最小的生成树称为最小生成树。\n\
    \n最小生成树的概念可以应用到许多实际问题中。\n\n- 例如，在 n 个教室之间建造局域网络，至少要架设 n-1 条通信线路，而每两个教室之间的距离可能不同，从而架设通信线路的造价也是不一样的，那么如何设计才能使得总造价最小？\n\
