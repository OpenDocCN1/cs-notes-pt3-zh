  md: "\n# 6.9 基数排序---多关键字排序（cont.）\n\n## 算法的改进：\n\n由于每个桶（箱）存放多少个关键字分量相同的记录个数无法预料，即队列Q[0]，Q[1]，...,\
    \ Q[9]长度很难确定，故桶一般设计成链式排队，两个排队链在一起的方法如下：\n\n```\nvoid Concatenate(QUEUE Q1, QUEUE\
