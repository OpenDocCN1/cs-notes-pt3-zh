    # 4.1 基本定义


    # 定义1 图(Graph)


    图是由顶点（vertex）的有穷非空集合和顶点之间边（edge）的集合组成的一种数据结构，通常表示为：


    ```

    G = (V, E)

    ```


    其中： G表示一个图， V是图G中顶点的集合， E是图G中顶点之间的集合。


    顶点表示数据对象； 边表示数据对象之间的关系。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_363_0.png)


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_363_1.png)'
