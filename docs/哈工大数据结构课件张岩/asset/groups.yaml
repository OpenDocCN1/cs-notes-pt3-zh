    \   Q1.rear=Q2.rear;\n    }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_626_0.png)\n\
    \n# 6.9 基数排序---多关键字排序（cont.）\n\n## 算法性能分析\n\n- n----记录数，d----关键字（分量）个数，r----基数\n\
    - 时间复杂度：分配操作：O（n）,收集操作O(r)，需进行d趟分配和收集。时间复杂度：O(d(n+r))\n- 空间复杂度：所需辅助空间为队首和队尾指针2r个，此外还有为每个记录增加的链域空间n个。空间复杂度O((n+r))\n\
    \n## 算法的推广\n\n- 若被排序的数据关键字由若干域组成，可以把每个域看成一个分量按照每个域进行基数排序。\n- 若关键字各分量不是整数，则把各分量所有可以取值与一组自然数对应。\n\
    \n# 本章小结--各种排序方法的比较\n\n→ 对排序算法应该从以下几个方面综合考虑：\n(1)时间复杂度;\n(2)空间复杂度;\n(3)稳定性;\n\
