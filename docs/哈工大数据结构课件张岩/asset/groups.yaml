    # 3.6 森林(树)与二叉树间的转换（Cont.）


    二叉树转换成森林(树)


    +   连线：

    +   若某个结点 k 是其双亲结点的左孩子，则将该结点 k 的右孩子以及（当且仅当）连续地沿着右孩子的右链不断搜索到的所有右孩子，都分别与结点 k 的双亲结点相连；


    +   抹线：

    +   把二叉树中的所有结点与其右孩子的连线以及（当且仅当）连续地沿着右孩子的右链不断搜索到的所有右孩子的连线全部抹去；


    +   旋转：

    +   按逆时针旋转45度角（即把结点按层次排列）'
