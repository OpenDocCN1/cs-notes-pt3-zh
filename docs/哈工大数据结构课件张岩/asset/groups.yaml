    # 6.9 基数排序----多关键字排序


    理论上可以证明，对于基于关键字之间比较的排序，无论用什么方法都至少需要进行log₂n!次比较。


    由Stirling公式可知，log₂n! ≈ nlog₂n -1.44n + O(log₂n)。所以基于关键字比较的排序时间的下界是O(nlog₂n)。因此不存在时间复杂度低于此下界的基于关键字比较的排序！


    只有不通过关键字比较的排序方法，才有可能突破此下界。


    基数排序（时间复杂度可达到线性级O(n)）


    +   不比较关键字大小，而根据构成关键字的每个分量的值，排列记录顺序的方法，称为分配法排序（基数排序）。


    +   而把关键字各个分量所有可能取值范围的最大值称为基数或桶或箱，因此基数排序又称为桶排序。


    基数排序的适用范围：


    +   显然，要求关键字分量的取值范围必须是有限的，否则可能要无限的箱。'
