    # 6.7 希尔排序----分组插入排序


    希尔排序是对直接插入排序的改进，改进的着眼点：


    +   - 若待排序记录按关键字值基本有序时，直接插入排序的效率可以大大提高；

    +   - 由于直接插入排序算法简单，则在待排序记录数量 n 较小时效率也很高。


    希尔排序的基本思想：


    +   - 将整个待排序记录分割成若干个子序列，在子序列内分别进行直接插入排序，待整个序列中的记录基本有序时，对全体记录进行直接插入排序。


    需解决的关键问题？


