    ## 5.6 AVL树 (Cont.)


    ### AVL树的插入操作与建立


    - ■ 对于一组关键字的输入序列，从空开始不断地插入结点，最后构成AVL树

    - ■ 每插入一个结点后就应判断从该结点到根的路径上有无结点点发生不平衡

    - ■ 如有不平衡问题，利用旋转方法进行树的调整，使之平衡化

    - ■ 建AVL树过程是不停插入结点和必要时进行平衡化的过程


    ### AVL树的性能分析


    - 令 N_h 是高为 h 的 AVL 树中结点个数的最小值，在最稀疏情况下，这棵 AVL 树的一棵子树的高度为 h-1，而另一棵子树的高度为 h-2，这两棵子树也都是
    AVL 树。

    - 因此， N_h = N_{h-1} + N_{h-2} + 1，其中 N_0 = 0， N_1 = 1， N_2 = 2。

    - 可以发现， N_h 的递归定义与 Fibonacci 数的定义 F_n = F_{n-1} + F_{n-2}（其中 F_0 = 0， F_1 = 1）相似

    - 可以用数学归纳法证明， N_h = F_{h+2} - 1 （h ≥ 0）

    - F_h ≈ φ^h / √5, 其中 φ = (1 + √5)/2，所以， N_h ≈ φ^{h+2} / √5 - 1

    - 所以，一棵包含 n 个结点的 AVL 树，其高度 h 至多为 log_φ((n+1)) - 2

    - 因此，对于包含 n 个结点的 AVL 树，其最坏情况下的插入时间为 O(log n)


    ## 5.7 B-树和B⁺树（Cont.）


    当符号表的大小超过内存容量时，由于必须从磁盘等辅助存储设备上去读取这些查找树结构中的结点，每次只能根据需要读取一个结点 因此，AVL树性能就不是很高


    在AVL树在结点高度上采用相对平衡的策略，使其平均性能接近于BST的最好情况下的性能。


    如果保持查找树在高度上的绝对平衡，而允许查找树结点的子树个数（分支个数）在一定范围内变化，能否获得很好的查找性能呢？


    基于这样的想法，人们设计了许多在高度上保持绝对平衡，而在宽度上保持相对平衡的查找结构


    如B-树及其各种变形结构，这些查找结构不再是二叉结构而是m-路查找树（m-way search tree），且以其子树保持等高为其基本性质，在实际中都有着广泛的应用。


    ### m-路查找树：


    一棵 m-路查找树或者是一棵空树，或者是满足如下性质的树：


    - 根结点最多有 m 棵子树，并具有如下的结构：

    - n, A₀, (K₁, A₁), (K₂, A₂), ..., (Kᵢ, Aᵢ), ..., (Kₙ, Aₙ)

    其中，Aᵢ是指向子树的指针，0 ≤ i ≤ n < m；Kᵢ是关键字值，1 ≤ i ≤ n < m。Kᵢ < Kᵢ₊₁, 1 ≤ i < n。

    - 子树 Aᵢ 中所有的关键字值都小于 Kᵢ₊₁ 而大于 Kᵢ。0 < i < n。

    - 子树 Aₙ 中所有的关键字值都大于 Kₙ；

    - 子树 A₀ 中的所有关键字值都小于 K₁。

    - 每棵子树 Aᵢ 也是 m-路查找树，0 ≤ i ≤ n


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_518_0.png)


