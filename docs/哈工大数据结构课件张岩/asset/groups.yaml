    # 算法性能分析


    +   PutDown函数中，执行一次while循环的时间是一个常数。因为r每次至少为原来的两倍，假设while循环执行次数为i，则当r从first变为first*2^i时循环结束。此时r=first*2^i
    >last/2，即 i > log₂(last/first)-1。所以while循环体最多执行log₂(last/first)次，即PushDown时间复杂度
    O(log(last/first))=O(log₂n)。


    +   所以，HeapSort时间复杂度： O(log₂n)。


    +   这是堆排序的最好、最坏和平均的时间代价。


    +   HeapSort空间复杂度： O(1)。'
