    艾兹格·W·迪科斯彻 (Edsger Wybe Dijkstra，1930年5月11日~2002年8月6日)荷兰人。计算机科学家，毕业就职于荷兰Leiden大学，早年钻研物理及数学，而后转为计算学。曾在1972年获得过素有计算机科学界的诺贝尔奖之称的图灵奖，之后，他还获得过1974年
    AFIPS Harry Goode Memorial Award、1989年ACM SIGCSE计算机科学教育教学杰出贡献奖、以及2002年ACM PODC最具影响力论文奖。


    +   1 提出“goto有害论”;结构程序设计之父

    +   2 提出信号量和PV原语;

    +   3 解决了有趣的“哲学家聚餐”问题;

    +   4 最短路径算法（SPF）的创造者;

    +   5 第一个Algol 60编译器的设计者和实现者;

    +   6 THE操作系统的设计者和开发者;

    +   7 提出银行家算法，解决操作系统中资源分配问题

    +   与D. E. Knuth并称为我们这个时代最伟大的计算机科学家。


