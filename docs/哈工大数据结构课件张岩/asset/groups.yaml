    # 第7章 文件与外排序


    # 7.3 磁盘文件的归并排序


    # K 路平衡归并与败者树----过程&分析：


    +   第一次建立选择树的比较所花时间为：

    +   O(K-1) = O(K)


    +   而后每次重新建造选择树所需时间为：O(log₂K)


    +   n 个记录处理时间为初始建立选择树的时间加上 n-1 次重建选择树的时间

    +   O((n-1)·log₂K)+O(K) = O(n·log₂K)


    +   这就是 K 路归并一遍所需的 CPU 处理时间。归并遍数为 logₖm，总时间为

    +   O(n·log₂K·logₖm) = O(n·log₂m)


    (K 路归并 CPU 时间与 K 无关---选择树太好了)


