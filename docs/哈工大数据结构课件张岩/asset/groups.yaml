    \t\tlowindex = i ;\n\t\tlowkey = A[i].key ;\n\t\tfor ( j = i+1; j<=n; j++)\n\t\
    \t\tif (A[j].key<lowkey) { //用当前最小关键与每个关键比较\n\t\t\t\tlowkey=A[j] ;\n\t\t\t\tlowindex\
    \ = j ;\n\t\t\t}\n\t\tswap(A[i], A[lowindex]) ;\n\t}\n}\n```\n\n### 性能分析\n\n-\
    \ 移动次数：\n  - 最好情况（正序）：0次\n  - 最坏情况：3(n−1)次\n- 比较次数：\n  $$\\sum_{i=1}^{n}(n-i)=\\\
    frac{1}{2}n(n-1)=O(n^2)$$\n- 时间复杂度为$O(n^2)$。\n- 空间复杂度为$O(1)$。\n\n## 6.5 堆排序\n\n\
    堆排序是对直接选择排序的改进，改进的着眼点：\n\n如何减少关键字之间的比较次数。若能利用每趟比较后的结果，也就是在找出关键值最小记录的同时，也找出关键值较小的记录，则可减少后面选择中所用的比较次数，从而提高整个排序过程的效率。\n\
    \n> 减少关键字之间的比较次\n\n> 查找最小的同时，找出较小\n\n把具有如下性质的数组A表示的完全二叉树称为（最小）堆：\n\n- ■ (1) 若2*i\
    \ < n ，则A[i].key ≤ A[2*i].key ；\n- ■ (2) 若2*i+1 < n ，则A[i].key ≤ A[2*i+1].key\
    \ 。\n\n把具有如下性质的数组A表示的完全二叉树称为（最大）堆：\n\n- ■ (1) 若2*i < n ，则A[i].key ≥ A[2*i].key\
    \ ；\n- ■ (2) 若2*i+1 < n ，则A[i].key ≥ A[2*i+1].key 。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_596_0.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_596_1.png)\n\n### 堆的性质\n\n- 对于任意一个非叶结点的关键字，都不大于其左、右孩子结点的关键字。即\
    \ A[i/2].key ≤ A[i].key  1 ≤ i/2 < i ≤ n。\n\n- 在堆中，以任意结点为根的子树仍然是堆。特别地，每个叶结点也可视为堆。每个结点都代表(是)一个堆。\n\
    \n- 以堆（的数量）不断扩大的方式进行初始建堆。\n\n- 在堆中（包括各子树对应的堆），其根结点的关键字是最小的。去掉堆中编号最大的叶结点后，仍然是堆。\n\
    \n- 以堆的规模逐渐缩小的方式进行堆排序。\n\n### 堆排序的基本思想：\n\n- 首先将待排序的记录序列用完全二叉树表示；\n- 然后完全二叉树构造成为一个堆，此时，选出了堆中所有记录关键字的最小者；\n\
    - 最后将关键字最小者从堆中移走，并将剩余的记录再调整成堆，这样又找出了次小的关键字记录，以此类推，直到堆中只有一个记录。\n\n待排序记录序 表\n\n\
    完全二叉树 整\n\n堆(初建堆) 排\n\n按关键字有的记录序列\n\n### 堆排序的实现步骤：\n\n- 把待排序的记录序列用完全二叉树的数组存储结构A表示\n\
    \n- 初始建堆：把数组所对应的完全二叉树以堆不断扩大的方式整理成堆。令 i = n/2,...,2,1 并分别把以 n/2 ,...,2,1 为根的完全二叉树整理成堆，即执行算法\
    \ PushDown(i , n)。\n\n- 堆排序：令 i = n, n-1 ,..., 2\n\n  1. 交换：把堆顶元素(当前最小的)与位置 i(当前最大的叶结点下标)的元素交换，即执行\
    \ swap(A[1],A[i]);\n\n  2. 整理：把剩余的 i-1 个元素整理成堆，即执行 PushDown(1 , i-1);\n\n  3.\
    \ 重复执行完这一过程之后，则 A[1],A[2],...,A[n] 是按关键字不增顺序的有序序列。\n\n### 堆排序的实现：\n\n```\nvoid\
    \ HeapSort ( int n , LIST A )\n{\n    int i;\n    for( i=n/2; i<=1; i++ ) /*初始建堆，从最右非叶结点开始*/\n\
    \        PushDown( i, n ); /*整理堆，把以i为根，最大下标的叶为n*/\n    for( i=n; i<=2; i-- ) {\n\
    \        swap(A[1],A[i]); //堆顶与当前堆中的下标最大的叶结点交换\n        PushDown( 1, i-1 );\n\
    \        /*整理堆把以1为根，最大叶下标为i-1的完全二叉树整理成堆*/\n    }\n}\n```\n\n### 整理堆算法： PushDown(\
    \ first , last )\n\n把以A[first]为根，以A[last]为最右边叶结点的完全二叉树整理成堆。根据堆的定义，它要完成的功能是，把完全二叉树中的关键字最小的元素放到堆顶，而把原堆顶元素下推到适当的位置，使(A[first],...,A[last])成为堆。\n\
    \n那么，怎样把关键字最小的元素放到堆顶，把堆顶元素下推到适当位置呢？\n\n具体操作(要点)如下：\n\n+ 把完全二叉树的根或者子树的根与其左、右儿子比较\
    \ 如果它比其左/右儿子大，则与其中较小者交换（若、右儿子相等，则与其左儿子交换）。重复上述过程 直到以A[ first]为根的完全二叉树是堆为止。\n\n\
    PushDown( first , last)算法实现如下：\n\n```\nvoid PushDown(int first,int last)\n{\n\
    \    /*整理堆:A是外部数组,把A[first]下推到完全二叉树的适当位置*/\n    int r=first; /* r是被下推到的适当位置, 初始值为根first*/\n\
    \    while(r<=last/2) /* A[r]不是叶, 否则是堆 */\n        if((r==last/2) && (last%2==0))\
    \ {/* r有一个孩子在2*r上且为左孩子*/\n            if(A[r].key>A[2*r].key)\n              \
    \  swap(A[r],A[2*r]);/*下推*/\n            r=last; /*A[r].key小于等于A[2*r].key或者\"\
    大于\", 交换后到叶, 循环结束*/\n        } else if((A[r].key>A[2*r].key)&&(A[2*r].key<=A[2*r+1].key))\
    \ {\n            /*根大于左孩子, 且左孩子小于或等于右孩子*/\n            swap(A[r],A[2*r]);    /*与左孩子交换*/\n\
    \            r=2*r;               /*下推到的位置也是下次考虑的根*/\n        } else if((A[r].key>A[2*r+1].key)&&(A[2*r+1].key<A[2*r].key))\
    \ {\n            /*根大于右孩子, 且右孩子小于左孩子*/\n            swap(A[r],A[2*r+1]);  /*与右孩子交换*/\n\
    \            r=2*r+1;             /*下推到的位置也是下次考虑的根*/\n        } else /*A[r]符合堆的定义,\
    \ 不必整理, 循环结束*/\n            r=last;\n}/*PushDown*/\n```\n"
