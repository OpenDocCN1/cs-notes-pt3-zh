    ```\ng = i + move[2, 1] = i + 1;\nh = j + move[2, 2] = j + 1;\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_132_0.png)\n\
    \n## 2.3.4 栈的应用(Cont.)\n\n为避免时时监测边界状态，可把二维数组maze[1:m, 1:n]扩大为maze[0:m+1, 0:n+1]，且令0行和0列、m+1行和n+1列的值为1。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_133_0.png)\n\n迷宫示例\n\n## 2.3.4 栈的应用(Cont.)\n\
    \n采用试探的方法，当到达某个位置且周围八个方向走不通时需要回退到上一个位置，并换一个方向继续试探；为解决回退问题，需设一个栈，当到达一个新位置时将（v,\
    \ i, j）进栈，回退时退栈。\n\n每次换方向寻找新位置时，需测试该位置以前是否已经经过，对已到达的位置，不能重复试探，为此设矩阵 mark，其初值为0，一旦到达位置(i,\
    \ j)时，置 mark[i, j] = 1;\n\n## 2.3.4 栈的应用(Cont.)\n\n### 算法描述\n\n+   (1) 耗子在(1,\
    \ 1)进入迷宫，并向正东（v=1）方向试探\n+   (2) 监测下一方位(g, h)。若(g, h)=(m, n)且maze[m, n]=0，则耗子到达出口，输出走过的路径；程序结束。\n\
    +   (3) 若(g, h) ≠ (m, n)，但(g, h)方位能走通且第一次经过，则记下这一步，并从(g, h)出发，再向东试探下一步。否则仍在(i,\
