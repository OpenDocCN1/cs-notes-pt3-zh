    \ 和 CLOSEST[n] 表示候选最短边集？\n  - LOWCOST[i]=w 表示顶点 v_i 和顶点 v_k 之间的权值为 w，其中：v_i ∈\
    \ V-U 且 v_k ∈ U\n  - CLOSEST[i]=k\n- 如何更新？\n  - LOWCOST[j]=min { cost (v_k, v_j)\
    \ | v_k ∈ U }\n  - CLOSEST[j]=k\n\n##### 实现步骤\n\n- 1. 初始化两个辅助数组 LOWCOST 和 CLOSEST；\n\
