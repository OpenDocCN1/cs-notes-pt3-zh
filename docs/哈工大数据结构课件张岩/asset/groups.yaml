    \ S2={2, 5, 10 }, S3={3, 4, 6}, 则S1 ∪ S2={1, 2, 5, 7, 8, 9, 10}\n\n## 第3章 树与二叉树\n\
    \n## 3.7 树型结构的应用（Cont.）\n\n## 用树结构表示集合\n\n## ADT集合MFSET的实现\n\n## 集合的树结构表示（父链表示）\n\
    \n- - 集合的元素对应于数组的下标，\n- - 而相应的元素值表示其父结点所对应的数组单元下标。\n- - “并”：把其中之一当成另一棵树的子树即可。\n\
