  mdcn: "\n# 6.9 基数排序---多关键字排序（cont.）\n\n## 算法的改进：\n\n由于每个桶（箱）存放多少个关键字分量相同的记录个数无法预料，即队列Q[0]，Q[1]，...,\
    \ Q[9]长度很难确定，故桶一般设计成链式排队，两个排队链在一起的方法如下：\n\n```\nvoid Concatenate(QUEUE Q1, QUEUE\
    \ Q2)\n{\n    if (!EMPTY(Q2)) {\n        Q1.rear->next=Q2.front->next;\n     \
    \   Q1.rear=Q2.rear;\n    }\n}\n```\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_626_0.png)\n\
    \n# 6.9 基数排序---多关键字排序（cont.）\n\n## 算法性能分析\n\n- n----记录数，d----关键字（分量）个数，r----基数\n\
    - 时间复杂度：分配操作：O（n）,收集操作O(r)，需进行d趟分配和收集。时间复杂度：O(d(n+r))\n- 空间复杂度：所需辅助空间为队首和队尾指针2r个，此外还有为每个记录增加的链域空间n个。空间复杂度O((n+r))\n\
    \n## 算法的推广\n\n- 若被排序的数据关键字由若干域组成，可以把每个域看成一个分量按照每个域进行基数排序。\n- 若关键字各分量不是整数，则把各分量所有可以取值与一组自然数对应。\n\
    \n# 本章小结--各种排序方法的比较\n\n→ 对排序算法应该从以下几个方面综合考虑：\n(1)时间复杂度;\n(2)空间复杂度;\n(3)稳定性;\n\
    (4)算法简单性;\n(5)待排序记录个数n的大小;\n(6)记录本身信息量的大小;\n(7)关键字值的分布情况。\n\n# 本章小结--各种排序方法的比较(Cont.)\n\
    \n(2)空间复杂度比较和(3)稳定性比较：\n\n| 排序方法 | 辅助空间 | 稳定性/不稳定举例 |\n|---|---|---|\n| 直接插入排序\
    \ | O(1) | 是 |\n| 希尔排序 | O(1) | 否/3,2,2'(d=2,d=1) |\n| 起泡排序 | O(1) | 是 |\n| 快速排序\
    \ | O(log₂n)~O(n) | 否/2,2',1 |\n| 直接选择排序 | O(1) | 否/2,2',1 |\n| 堆排序 | O(1) | 否/1,2,2'(最小堆)\
    \ |\n| (二路)归并排序 | O(n) | 是 |\n| 基数排序 | O(n+r) | 是 |\n\n# 本章小结--各种排序方法的比较(Cont.)\n\
    \n(4)算法简单性比较：从算法简单性看，\n\n- 一类是简单算法，包括直接插入排序、直接选择排序和起泡排序；\n- 另一类是改进后的算法，包括希尔排序、堆排序、快速排序和归并排序，这些算法都很复杂。\n\
    \n(5)待排序的记录个数比较：从待排序的记录个数n的大小看，\n\n- n越小，采用简单排序方法越合适；\n- n越大，采用改进的排序方法越合适。\n-\
    \ 因为n越小，O(n²)同O(nlog₂n)的差距越小，并且输入和调试简单算法比输入和调试改进算法要少用许多时间。\n\n# 本章小结--各种排序方法的比较(Cont.)\n\
    \n(6)记录本身信息量比较：\n\n记录本身信息量越大，移动记录所花费的时间就越多，所以对记录的移动次数较多的算法不利。\n\n| 排序方法 | 最好情况\
    \ | 最坏情况 | 平均情况 |\n|---|---|---|---|\n| 直接插入排序 | O(n) | O(n²) | O(n²) |\n| 起泡排序\
    \ | O | O(n²) | O(n²) |\n| 直接选择排序 | O | O(n) | O(n) |\n\n# 本章小结--各种排序方法的比较(Cont.)\n\
    \n## (7)关键字值的分布情况比较：\n\n当待排序记录按关键的值有序时，\n\n- 插入排序和起泡排序能达到 $O(n)$ 的时间复杂度；\n- 对于快速排序而言，这是最坏的情况，此时的时间性能蜕化为\
    \ $O(n^2)$；\n- 选择排序、堆排序和归并排序的时间性能不随记录序列中关键字的分布而改变。\n\n# 数据结构与算法\n\n# Data Structures\
    \ and Algorithms\n\n张岩\n\n哈工大计算机科学与技术学院\n\n# 第7章 文件与外排序\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_635_0.png)\n\
    \n# 学习目标\n\n- 掌握文件的相关概念；文件的各种组织方法及特点；查询、更新操作及其算法。\n- 掌握外部排序的一般过程，熟练掌握适合外存特点的归并排序的相关技术。\n\
    \n# 本章主要内容\n\n- 7.1 文件及文件操作\n- 7.2 文件组织\n- 7.3 磁盘文件的归并排序\n- 7.4 磁带文件的归并排序\n- 本章小结\n\
    \n# 7.1 文件及文件操作\n\n- 文件的逻辑结构和物理结构\n- 逻辑结构：呈现给用户，描述记录间的逻辑关系；\n- 物理结构：存储结构，记录在存储器中的组织，连续，链式等\n\
    - 文件操作\n- 操作： INSERT  DELETE  MODIFY  RETRIEVE\n- 检索方式：实时 or 成批\n- 更新方式：实时 or\
    \ 成批\n- 查询方式：\n- Q1:简单查询    Q2:范围查询\n- Q3:函数查询    Q4:布尔查询\n\n# 7.2 文件的组织\n\n-\
    \ 文件的组织方式\n- 顺序方式、索引方式、散列方式、链接方式\n- 顺序方式：\n- 文件的各个记录按逻辑顺序存放在外存的连续区内\n- 记录的顺序往往是按主关键字的大小排列的\n\
    - 适合于Q1型查询，且检索与更新是成批进行的\n- 适合磁带或磁盘\n- 磁盘文件：\n- 由柱面和磁道组成\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_640_0.png)\n\
    \n# 7.2 文件的组织\n\n## 索引方式：\n\n- “索引”指的是记录的关键字值与记录驻留在外存的地址组成数对的集合。每个数对称为一个索引项。\n\
    - 索引文件在存储器上分两区：索引区和数据区\n- 查找记录：分两步进行\n- 删除记录：只删除索引\n- 插入记录：先存数据，然后登记索引并重新排序\n\
    - 建立文件：按数据存入先后顺序建立索引，最后索引排序\n\n## 示例：\n\n人事档案示意文件\n\n| 序号 | 姓名 | 记录内容 | 记录位置 |\
    \  |\n|---|---|---|---|---|\n|  |  |  | 柱面号 | 盘面号 |\n| 1 | An Cai | ... | 1 |\
    \ 1 |\n\n柱面索引\n\n| 柱面的最大关键字 | 柱面号 |\n|---|---|\n| Cai Long | 1 |\n\n盘面索引\n\n|\
    \ 盘面的最大关键字 | 盘面号 |\n|---|---|\n| Pi Hong | 1 |\n\n# 7.2 文件的组织\n\n## 散列方式：\n\n\
    用散列（HASH）法组织的文件。特点是用一个散列函数 H(key)，将关键字 key 映射为记录的地址，即\n记录地址 = HASH(key)\n\n##\
    \ 基本步骤：\n\n- 确定记录数\n- 存储单位（桶）记录数\n- 确定桶数\n- 设计 HASH(key) 函数\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_642_0.png)\n\
    \n链接方式：多重索引，在记录中保存链接\n\n倒排方式：在索引中保存链接\n\n# 7.3 磁盘文件的归并排序\n\n## 外部排序的概念\n\n- 是指在排序的过程中，数据的主要部分存在外存储器上，借助内存储器(作为工作单元)，来调整外存储器上数据的位置。\n\
    \n## 外部归并排序重点研究的问题\n\n- 如何进行多路归并以减少文件的归并遍数；\n- 如何巧妙地运用内存的缓冲区使I/O和CPU尽可能并行工作\n\
    - 根据外存的特点选择较好的产生初始归并段的方法。\n\n## 分类：\n\n- 磁盘和磁带归并排序\n- 磁盘是随机存储设备；磁带是顺序存储设备\n\n\
    # 7.3 磁盘文件的归并排序\n\n外部排序归并方法的一般过程：分两个阶段\n\n- 首先，将文件中的数据分段输入到内存，在内存中采用内部排序方法对其进行排序（排序完的文件，称为归并段run），\n\
    - 然后将有序段写回外存。\n- 整个文件经过在内存逐段排序又逐段写回外存，这样在外存中形成多个初始的归并段。\n- 对这些初始归并段采用某种归并排序方法，进行多遍归并，最后形成整个文件的单一归并段（整个文件有序）。\n\
    \n# 7.3 磁盘文件的归并排序\n\n示例：设有一个包含4500个记录的输入文件。现用一台其内存最多可容纳750个记录的计算机对该文件进行排序。输入文件放在磁盘上，磁盘每个页块可容纳250个记录，这样全部记录可存储在\
    \ 4500 / 250 = 18 个页块中。输出文件也放在磁盘上，用以存放归并结果。\n\n由于内存中可用于排序的存储区域能容纳750个记录，因此内存中恰好能存3个页块的记录。\n\
    \n在外排序一开始，把18块记录，每3块一组，读入内存。利用某种内排序方法进行内排序，形成初始归并段，再写回外存。总共可得到6个初始归并段。然后一趟一趟进行归并排序。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_645_0.png)\n"
