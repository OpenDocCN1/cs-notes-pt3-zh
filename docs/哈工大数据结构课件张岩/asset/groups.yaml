    # 4.2 图的存储结构(cont.)


    # 邻接矩阵（Adjacency Matrix）表示（数组表示法）


    # 基本思想：


    +   用一个一维数组存储图中顶点的信息，用一个二维数组（称为邻接矩阵）存储图中各顶点之间的邻接关系。


    +   假设图G=(V, E)有n个顶点，则邻接矩阵是一个n×n的方阵，定义为：

    +   edge[i][j] = { 1 若 (i,j)∈E 或 <i,j>∈E

    +   0 否则 }


