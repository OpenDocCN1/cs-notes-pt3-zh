    # 4.1 基本定义(cont.)


    # 定义3 路径（Path）和路径长度、简单路和简单回路


    +   在无向图G=(V,E)中，若存在一个顶点序列v_p, v_i1, v_i2, ... v_im, v_q，使得 (v_p, v_i1), (v_i1,
    v_i2), ..., (v_im, v_q) ∈ E(G)，则称顶点v_p路到v_q有一条路径。


    +   在有向图G=(V,E)中，若存在一个顶点序列v_p, v_i1, v_i2, ..., v_im, v_q，使得有向边<v_p, v_i1>, <v_i1,
    v_i2>, ..., <v_im, v_q> ∈ E(G)，则称顶点v_p路到v_q有一条有向路径。


    +   非带权图的路径长度是指此路径上边的条数。


    +   带权图的路径长度是指路径上各边的权之和。


    +   简单路径：若路径上各顶点 v1, v2, ..., vm 均互不相同，则称这样的路径为简单路径。


    +   简单回路：若路径上第一个顶点 v1 与最后一个顶点 vm 重合，则称这样的简单路径为简单回路或环。'
