    # 4.1 基本定义(cont.)


    # 定义1 图


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_364_0.png)


    # 无向图:


    +   - 若顶点 $v_i$ 和 $v_j$ 之间的边没有方向，则称这条边为无向边，表示为 $(v_i, v_j)$。

    +   - 如果图的任意两个顶点之间的边都是无向边，则称该图为无向图。


    ![](img/ad2aee679abbcf477936d4ee2701e2d3_364_1.png)


    # 有向图:


    +   - 若顶点 $v_i$ 和 $v_j$ 之间的边都有方向，则称这条边为有向边(弧)，表示为 $\langle v_i, v_j \rangle$。

    +   - 如果图的任意两个顶点之间的边都是有向边，则称该图为有向图。'
