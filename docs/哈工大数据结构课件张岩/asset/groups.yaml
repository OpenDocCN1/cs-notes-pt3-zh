  - "[PAGE 59]\n\n# 2.1 线性表的逻辑结构（Cont.）\n\nADT应用举例：\n\n+   设计函数 DeleteVal（LIST &L,\
    \ ElemType d），其功能为删除 L 中所有值为 d 的元素。\n\n```\nvoid DeleteVal( LIST &L, ElemType\
    \ d )\n{\n    position p;\n    p = First( L );\n    while ( p != End( L ) )\n\
