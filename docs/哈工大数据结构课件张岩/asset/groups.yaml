    # 2.5.3 模式匹配(Cont.)


    KMP算法实现步骤：


    +   1. 在串S和串T中分别设比较的起始下标i和j；

    +   2. 循环直到S中所剩字符长度小于T的长度或T中所有字符均比较完毕

    +      - 2.1 如果S[i]=T[j]，继续比较S和T的下一个字符；否则

