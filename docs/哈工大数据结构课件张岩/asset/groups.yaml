    # 5.4 分块查找（Cont.）


    # 分块查找性能分析


    +   设长度为n 的表分成b 块，每块长度为L，则b=⌈n / L⌉，又设表中每个元素的查找概率相等，则每块查找的概率为1/b，块中每个元素的查找概率为1/L。于是，


    +   索引表的ASL_ix = Σᵢ=1ᵇ pᵢ·cᵢ = 1/b Σᵢ=1ᵇ i


    +   块内的平均查找长度：ASL_blk = Σⱼ=1ᴸ pᵢ·cᵢ = 1/L Σⱼ=1ᴸ j


    +   所以分块查找平均长度为：

    +   ASL(L)=ASL_ix + ASL_blk = (b+1)/2 + (L+1)/2 = (n/L + L)/2 + 1

    +   令ASL’(L)=0，知当L= n 时，ASL(L)= n + 1（最小值）。'
