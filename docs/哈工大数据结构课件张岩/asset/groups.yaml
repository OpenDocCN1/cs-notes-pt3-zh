    # 5.6 AVL树 (Cont.)


    # AVL树的插入操作与建立


    +   ■ 对于一组关键字的输入序列，从空开始不断地插入结点，最后构成AVL树


    +   ■ 每插入一个结点后就应判断从该结点到根的路径上有无结点点发生不平衡


