    \ E. Knuth\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_5_0.png)\n\n1938年出生，25岁毕业于加州理工学院数学系，博士毕业后留校任教，28岁任副教授。30岁时，加盟斯坦福大学计算机系，任教授。从31岁起，开始出版他的历史性经典巨著：\n\
    \n*The Art of Computer Programming*\n\n他计划共写7卷，然而出版三卷之后，已震惊世界，使他获得计算机科学界的最高荣誉图灵奖，此时，他年仅36岁。\n\
    \n## 1.1 数据结构的兴起和发展\n\n### 客观世界与计算机世界的关系\n\n- 计算机科学是研究信息表示和信息处理的科学。\n- 信息在计算机内是用数据表示的。\n\
    - 用计算机解决实际问题的实质可以用下图表示：\n\n客观世界\n（客观问题）\n映射\n抽象\n概念世界\n（逻辑模型）\n映射\n实现\n机器世界\n\
    （存储表示）\n映射\n模拟\n客观世界与计算机的关系\n\n## 1.1 数据结构的兴起和发展(Cont.)\n\n- 程序设计的实质是什么？\n  -\
    \ 数据表示：将数据存储在计算机中\n  - 数据处理：处理数据，求解问题\n  - 数据结构问题起源于程序设计\n\n- 数据结构随着程序设计的发展而发展\n\
    \  - 1. 无结构阶段：在简单数据上作复杂运算\n  - 2. 结构化阶段：数据结构＋算法＝程序\n  - 3. 面向对象阶段：（对象＋行为）＝程序\n\
    \n数据结构的发展并未终结……\n\n## 1.2 研究对象与基本概念\n\n例1 学籍管理问题——表结构\n\n完成什么功能？各表项之间是什么关系？\n\n\
    | 学号 | 姓名 | 性别 | 出生日期 | 政治面貌 |\n|------|------|------|----------|----------|\n\
    | 0001 | 王晓东 | 男 | 1990/09/02 | 团员 |\n| 0002 | 李明远 | 男 | 1989/12/25 | 党员 |\n|\
    \ 0003 | 张蕾薇 | 女 | 1991/03/26 | 团员 |\n| ... | ... | ... | ... | ... |\n\n## 1.2\
    \ 研究对象与基本概念(Cont.)\n\n### 例2 人机对弈问题——树结构\n\n如何实现对弈？各格局之间是什么关系？\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_9_0.png)\n\
    \n## 1.2 研究对象与基本概念(Cont.)\n\n### 例3 教学计划编排问题——图结构\n\n如何表示课程之间的先修关系？\n\n| 编号 |\
    \ 课程名称 | 先修课 |\n|------|----------|--------|\n| C₁ | 高等数学 | 无 |\n| C₂ | 计算机导论\
    \ | 无 |\n| C₃ | 离散数学 | C₁ |\n| C₄ | 程序设计 | C₁, C₂ |\n| C₅ | 数据结构 | C₃, C₄ |\n\
    | C₆ | 计算机原理 | C₂, C₄ |\n| C₇ | 数据库原理 | C₄, C₅, C₆ |\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_10_0.png)\n\
    \n## 1.2 研究对象与基本概念(Cont.)\n\n### 数据结构的基本概念\n\n- 数据：一切能输入到计算机中并能被计算机程序识别和处理的符号集合。\n\
    \  - 数值数据：整数、实数等\n  - 非数值数据：图形、图象、声音、文字等\n\n- 数据元素：数据的基本单位，在计算机程序中通常作为一个整体进行考虑和处理。\n\
    \n- 数据项：构成数据元素的不可分割的最小单位。\n\n- 数据对象：具有相同性质的数据元素的集合。\n\n- 结点：数据元素在计算机内的位串表示。\n\n\
    - 域（字段）：数据元素中数据项在计算机内的表示\n\n- 信息表：是数据对象在计算机内的表示。\n\n## 1.2 研究对象与基本概念(Cont.)\n\n\
    ### 数据结构\n\n- 数据元素之间的相互关系，这种关系是抽象的，即并不涉及数据元素的具体内容。是数据元素及其相互间的关系的数学描述。\n- 相互之间存在一定关系的数据元素的集合。\n\
    - 按照视点的不同，数据结构分为逻辑结构和存储结构。\n\n### 数据的逻辑结构\n\n- 数据元素之间的抽象关系，数据元素之间逻辑关系的整体\n  -\
    \ 学籍管理问题中，表项之间的逻辑关系指的是什么？\n  - 人机对弈问题中，格局之间的逻辑关系指的是什么？\n  - 教学计划编排问题中，课程之间的逻辑关系指的是什么？\n\
    - 数据的逻辑结构是从具体问题抽象出来的数据模型。\n\n## 1.2 研究对象与基本概念(Cont.)\n\n### 数据的存储结构\n\n- 又称物理结构，是数据及其逻辑结构在计算机中的表示。\n\
    - 实质上是内存分配，以确定元素及元素之间关系的表示。\n- 在具体实现时，依赖于计算机语言。\n\n## 1.2 研究对象与基本概念(Cont.)\n\n\
    数据结构从逻辑上分为四类：\n\n即四种基本的逻辑结构\n\n- 集合：数据元素之间就是“属于同一个集合”；\n- 数据线性结构：数据元素之间存在着一对一的线性关系；\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_15_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_15_1.png)\n\
    \n## 1.2 研究对象与基本概念(Cont.)\n\n数据结构从逻辑上分为四类：\n\n即四种基本的逻辑结构\n\n- 集合：数据元素之间就是“属于同一个集合”；\n\
    - 数据线性结构：数据元素之间存在着一对一的线性关系；\n- 树型结构：数据元素之间存在着一对多的层次关系；\n- 图结构：数据元素之间存在着多对多的任意关系。\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_16_0.png)\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_16_1.png)\n\
    \n![](img/ad2aee679abbcf477936d4ee2701e2d3_16_2.png)\n\n## 1.2 研究对象与基本概念(Cont.)\n\
    \n两种基本的存储结构\n\n顺序存储结构\n\n用一组连续的存储单元依次存储数据元素，数据元素之间的逻辑关系由元素的存储位置来表示。\n\n例：（bat,\
    \ cat, eat）\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_17_0.png)\n\n## 1.2 研究对象与基本概念(Cont.)\n\
    \n- 两种基本的存储结构\n  - 顺序存储结构\n    - 用一组连续的存储单元依次存储数据元素，数据元素之间的逻辑关系由元素的存储位置来表示。\n\
    \  - 链接存储结构\n    - 用一组任意的存储单元存储数据元素，数据元素之间的逻辑关系用指针来表示。\n\n![](img/ad2aee679abbcf477936d4ee2701e2d3_18_0.png)\n\
    \n## 1.2 研究对象与基本概念(Cont.)\n\n### 逻辑结构与存储结构的关系\n\n- 数据的逻辑结构属于用户视图，是面向问题的，反映了数据内部的构成方式；数据的存储结构属于具体实现的视图，是面向计算机的。\n\
    - 一种数据的逻辑结构可以用多种存储结构来存储，而采用不同的存储结构，其数据处理的效率往往是不同的。\n\n### 数据结构与算法的学习内容\n\n- 数据对象的结构形式,各种数据结构的性质(逻辑结构);\n\
