    # 问题的定义


    定义

    设G=(V,E)是一个连通和加权图, G的生成树是指一个子图T=(V,E''), E''⊆E.

    设W: E→R+是边的权值函数, 则T的权值定义为W(T)=Σ_{e∈E''} W(u,v).

    最小生成树

    G的最小生成树是指W(T)最小的G的子树.

    问题定义

    输入: 无向连通图G=(V,E), 及其权W

    输出: G的最小生成树'
