    \n## 5.5 0/1 Knapsack Problem\n\n## 问题定义\n\n你发现n种物品有一个背包，物品i的重量是w_i，价值v_i，背包重量为C，向内所能装入背包的物品，装入背包中的物品的总价值最大？\n\
