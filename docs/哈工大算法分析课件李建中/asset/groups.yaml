  - '[PAGE 28]


    # Correctness Proof


    # Loop Invariant


    At the start of the loop of lines 3-6 for any k

    1. if p ≤ k ≤ i, then A[k] ≤ x.

    2. if i < k ≤ j, then A[k] > x.

    3. if k = r, then A[k] = x.


    # Initialization:


    Prior the first iteration, i = p-1, j = r, condition 1 and 2 are trivially satisfied.
    Line 1 make condition 3 true.


    ```

    Partition(A, p, r)

    x ← A[r];

    i ← p - 1;

    for j ← p to r - 1

    do if A[j] ≤ x

    i ← i + 1;

    exchange A[i] ↔ A[j];

    exchange A[i + 1] ↔ A[r];

    return i + 1;

    ```


    Running time: Θ(n)


    # Maintenance:


    # Termination


    At termination, i = r. We have three sets:

    1. those less than or equal to x.

    2. those greater than x.

    3. a singleton set containing x.


    After finishing the algorithm

    The final two steps move the pivot into its position in the middle of the array
    by swapping it with the leftmost element that is greater than x.


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_0.png)


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_1.png)


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_2.png)


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_3.png)


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_4.png)'
  - '[PAGE 29]


    # Performance analysis


    +   - Time complexity of PARTITION: Θ(n)

    +   - Best case time complexity of Quicksort

    +     - Array in partition into 2 equal sets

    +     - T(n)=2T(n/2)+Θ(n)

    +     - T(n)=Θ(nlogn)


    # Worst case time complexity of Quicksort


    +   - Worst Case

    +     - |A[p..q]|=1, |A[q+1..r]|=n-1

    +     - The worst case happens in call to Partition Algorithm

    +   - Time complexity

    +     - T(1)=Θ(1)

    +     - T(n)=T(n-1)+Θ(n)=Θ(n²)


    # Average time complexity of Quicksort


    +   - Average time complexity is near Θ(nlogn) rather than Θ(n²)

    +   - Why? See an example

    +     - Assume PARTITION always generates 9:1 partition

    +     - Run time of QUICKSORT is

    +       T(n)=T(9n/10)+T(n/10)+Θ(n)=Θ(nlogn)

    +   - The process of Partitioning is as followwing


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_29_0.png)


    +   - 当每一层 log₁₀ n = Θ(logn) 时，高度是 Θ(logn)

    +   - 当 log₁₀ n/1 和 log₁₀ n/9 = Θ(logn) 时，每层总和是 Θ(n)

    +   - 9:1 划分不会导致最坏情况，运行时间仍为 Θ(nlogn)


    # 3.3 Sorting in Linear Time


    +   - Lower bounds for sorting

    +   - Counting Sort Algorithm

    +   - Radix Sort Algorithm

    +   - Bucket Sort Algorithm


    # Lower bounds for sorting


    +   - Decision-tree model

    +     - Comparison sort

    +       - Use only comparisons between elements to gain order information about
    input sequence

    +       - Comparison sort can be viewed as decision-tree

    +     - Decision-tree model

    +       - Is a full binary tree to express the comparisons of a sort algorithm
    by ignoring the other aspects of the algorithm

    +       - All permutations of the input elements must be the leaves

    +       - A inter node of the tree is a comparison aᵢ < ? aⱼ'
