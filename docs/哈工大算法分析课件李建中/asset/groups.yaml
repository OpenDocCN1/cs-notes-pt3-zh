    - 问题越复杂，越难对 Ratio Bound 做出较好的估计。\n\n## 近似模式\n\n定义4（近似模式）：一个优化问题的近似模式是一个算法族，其性能比为一个关于输入规模的函数。一个近似模式可以是一个(1+ε)-近似算法。定义5：一个近似模式\
