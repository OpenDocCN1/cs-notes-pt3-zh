    \ 的最小代价方法\n\n矩阵乘法代价/乘积性质：乘法次数\n若 A 是 p×q 矩阵，B 是 q×r 矩阵，则 A×B 乘积代价 O(pqr)\n\n##\
    \ Motivation\n\n- 链乘法就是实现\n  - 矩阵乘法是链乘法\n- 链乘一个问题有多种可行的计算方法。\n  例如，(A1×A2×A3×A4)\n\
    \  = (A1×A2)×(A3×A4)\n  = ((A1×A2)×(A3×A4))\n  = ((A1×A2)×(A3×A4))\n  ...\n  =\
    \ ((A1×A2)×A3)×A4\n\n- 链乘法计算的计算代价与顺序有关\n  - 设 A1=10×100 矩阵，A2=100×5 矩阵，A3=5×50\
    \ 矩阵\n  T((A1×A2)×A3)=10×100×5+10×5×50=7500\n  T(A1×(A2×A3))=100×5×50+10×100×50=75000\n\
    \n结论：采用不同的顺序会导致代价差异\n\n- 链乘法设计问题解空间\n  - p(n)=计算 n 个矩阵链乘法的方案数\n  - p(n)随 n 增长\n\
    \    (A1×...×An) 有 (A1×...×An) 种划分\n\n由此可见的解空间是无法用枚举方法穷举最优解的！\n p(n)=C(n-1)=Catalan数=\
    \ 1/(n) * C(2n-2, n-1) = Ω(4^n / n^{3/2})\n"
