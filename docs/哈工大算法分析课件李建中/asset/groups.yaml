    \ Line 1 make condition 3 true.\n\n```\nPartition(A, p, r)\nx ← A[r];\ni ← p -\
    \ 1;\nfor j ← p to r - 1\ndo if A[j] ≤ x\ni ← i + 1;\nexchange A[i] ↔ A[j];\n\
    exchange A[i + 1] ↔ A[r];\nreturn i + 1;\n```\n\nRunning time: Θ(n)\n\n### Maintenance\n\
    \n### Termination\n\nAt termination, i = r. We have three sets:\n\n1. those less\
    \ than or equal to x.\n2. those greater than x.\n3. a singleton set containing\
    \ x.\n\nAfter finishing the algorithm, the final two steps move the pivot into\
    \ its position in the middle of the array by swapping it with the leftmost element\
    \ that is greater than x.\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_0.png)\n\
    \n![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_1.png)\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_28_2.png)\n\
