    # Greedy算法 (Q为min-heap, 见黑皮书)


    ```

    Huffman(C, F)

    1. n ← |C|; Q ← 根据F构造C; T为一个空树;

    2. FOR i ← 1 To n-1 Do

    3. z ← Allocate-Node();

    4. left[z] ← x ← Extract-min(Q) /* 从Q删除x */;

    5. right[z] ← y ← Extract-min(Q) /* 从Q删除y */;

    6. f(z) ← f(x)+f(y);

    7. Insert(Q, z, f(z));

    8. Return Extract-min(Q) /* 返回树根 */

    ```


    # 复杂度分析


    +   - 第1步: O(nlogn)

    +   - 每次循环: O(logn), 循环n-1次: O(nlogn)

    +   - T(n)=O(nlogn)


    # 正确性证明


    定理3. Huffman算法产生一个优化前缀编码树

