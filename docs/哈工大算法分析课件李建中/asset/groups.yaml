    \  ②对所有输入都终止, 并且对每一个输入产生正确的结果\n- 什么称为算法/就算法的正确性?\n  ①算法对所有输入终止\n  ②产生正确的输出/产生更多的正确解\n\
    \n- 什么要素进行正确性证明?\n  - 正确性证明=终止性证明?\n    终止证明, 正确证明两者皆有!\n    只证明终止就无意义!!\n- 如何证明算法的正确性?\n\
    \  - 证明算法对所有输入都终止\n  - 证明对每个输入产生正确结果\n- 近似算法的正确性分析?\n  - 证明算法对所有输入都终止\n  - 分析算法的误差/提供正确性概率\n\
    \n### 算法的复杂性分析\n\n- 目的\n  - 分析算法对不同输入所需资源量\n- 表现资源\n  - 时间, 空间, I/O等\n  - 输入大小最易量\n\
    - 用途\n  - 衡量一个问题或程序算法, 性能比较\n- 复杂性分析要素\n  - 各种数据, 算法结构, 变量, 代价等\n- 复杂性分析能力\n \
    \ - 递推关系式和递推模型\n  - 复杂性优化\n\n定义6(输入大小).设Input是问题的输入集合, P的输入大小是一个函数 F: Input→N,\
    \ N是正整数集合。\n\n- 例子:\n  - 排序问题的输入大小?\n  - 排序问题的输入大小?\n  - 图论问题的输入大小?\n\n定义7(时间复杂性).一个算法对特定输入的时间复杂性是该算法对该输入产生结果所需的最少基本操作“步”数\n\
    \n- 说明\n  - 时间复杂性是输入大小的函数\n  - 我们假设一步操作所需时间都相同, 实际上下一步所需时间可能不同。\n\n定义8(空间复杂性).一个算法对特定输入空间复杂性是该算法对该输入产生结果所需实际的存储空间大小。\n\
    \n定义9 (最坏情况). 设Input是问题P的输入集合, Complexity(Y)是算法A解决P实例X的复杂度, Y=Size(X)是确定P实例X的大小的函数.\
    \ A的最坏复杂度是 Max{Complexity(size(y)) | y∈Input}\n定义10 (最好情况). Min{Complexity(size(y))\
    \ | y∈Input}\n定义11 (平均情况). 设y∈Input, y作为算法A的输入出现概率是p_y, A的平均复杂度是 Σ_{y∈Input} p_y\
    \ × complexity(size(y))\n\n## 1.4 Designing Algorithms\n\n- 算法设计方法\n- 算法分析方法\n\
    \n### 算法设计方法\n\n- Divide-and-Conquer\n- Dynamic Programming\n- Greedy Algorithms\n\
