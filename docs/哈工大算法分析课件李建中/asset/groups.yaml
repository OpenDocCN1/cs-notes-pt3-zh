    \ heap property\n- Building a heap\n- Heapsort Algorithm\n\n## Heap\n\n- A heap\
    \ is an array object that can be viewed as a nearly complete binary tree.\n\n\
    A\n6 5 3 2 4 1\n\n- length[A]=size of the array A.\n- Heap-size[A]=number of elements\
    \ in the heap\n- Heap-size[A] ≤ length[A]\n- Parent(i)=⌊i/2⌋\n- Left(i)=2i\n-\
    \ Right(i)=2i+1\n\nA\n6 5 3 2 4 1\n\n## Two kinds of Heap\n\n- Max-Heap\n\nIn\
    \ a max-heap, every node i other than the root satisfies the following property\
    \ : A[Parent(i)] ≥ A[i].\n\nThe largest element is at the root.\n\n## Min-Heap\n\
    \nIn a min-heap, every node i other than the root satisfies the following property\
    \ : A[Parent(i)] ≤ A[i].\n\nThe smallest element is at the root.\n\n## Maintaining\
    \ the heap property\n\n- Max-Heapify(A, i)\n- Input: array A and index i into\
    \ A\n- Output: makes the subtree rooted at A[i] become a max-heap\n- Assume:\n\
    \  - two subtrees rooted at Left(i) and Right(i) are max-heaps, but A[i] may not\
    \ satisfy the max-heap property.\n\n## Basic Idea\n\nMax-Heapify(A, 2)\n\n## Algorithm\n\
    \n```\nMax-Heapify(A,i)\nlargest ← i\nl ← Left(i)\nr ← Right(i)\nif l ≤ heap-size[A]\
    \ and A[l] > A[i]\n    then largest ← l\n    else largest ← i\nif r ≤ heap-size[A]\
    \ and A[r] > A[largest]\n    then largest ← r\nif largest ≠ i\n    then begin\
    \ exchange A[i] ↔ A[largest]\n    Max-Heapify(A,largest);\n```\n\n## Time Complexity\n\
    \nLet h = height. Then h is the largest integer satisfying 1 + 2 + … + 2^{h-1}\
    \ ≤ n, that is, 2^{h} ≤ n. Hence, h = ⌊lg n⌋.\n\nheight = ⌈lg n⌉ where n = heap-size[A]\
    \ Hence, Max-Heapify runs in time O(lg n).\n\n## Building a heap\n\n- Lemma. Let\
    \ n=length[A], then the elements in the subarray A[(⌊n/2⌋+1) .. n] are all leaves\
    \ of the three.\n- Proof: Homework\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_21_0.png)\n\
    \n- Idea of the algorithm\n  - The elements in A[(⌊n/2⌋+1) .. n] are 1-element\
    \ heap\n  - The algorithm goes through the rest nodes of the tree and runs Max-Heapify\
    \ on each one.\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_21_1.png)\n\n- Algorithm\n\
    \n```\nBuild-Max-Heap(A)\nheap-size[A] ← length[A];\nfor i ← ⌊length[A]/2⌋ downto\
    \ 1\ndo Max-Heapify(A, i);\n```\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_21_2.png)\n\
