    - 形式化\n  问题\n  max Σ_{k≤n} v_k x_k\n  Σ_{k≤n} w_k x_k ≤ j\n  x_k∈{0,1}, 1≤k≤n\n\
    \  称最优解价值为m(i,j)。\n\n## 递推方程\n\nm(i, j) = m(i+1, j) 0≤j < w_i\nm(i, j) = max{m(i+1,\
    \ j), m(i+1, j-w_i)+v_j} j ≥ w_i\nm(n, j) = 0 0 ≤ j < w_n\nm(n, j) = v_n j ≥ w_n\n\
    \n## 自底向上计算顺序\n\nm(i, j) = m(i+1, j), 0≤j < w_i\nm(i, j) = max{m(i+1, j), m(i+1,\
    \ j-w_i)+v_j}, j ≥ w_i\nm(n, j) = 0, 0 ≤ j < w_n\nm(n, j) = v_n, j ≥ w_n\n\n令\
