    # 2.1.1 同阶函数


    定义2.1.1. 设f(n)和g(n)是正值函数。如果存在c1, c2>0, n0, ∀n>n0, c1g(n)≤f(n)≤c2g(n), 则称f(n)与g(n)同阶,
    记作f(n)=Θ(g(n))。


    Θ(g(n))可记为如下集合:

    { f(n) | ∃c1, c2>0, n0, ∀n>n0, c1g(n)≤f(n)≤c2g(n) }

    即所有与g(n)同阶函数的集合


    # 思考题


    用定义证明下列结论：


    +   1. f(n)=an²+bn+c=Θ(n²)

    +   2. Θ(n²)=Θ(n²+1)

