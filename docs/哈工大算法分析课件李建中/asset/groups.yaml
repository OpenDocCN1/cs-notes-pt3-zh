    定理1. 设 T 是 G 唯一的最小生成树，而 T 也含有 T1 和 T2，T 是 G 的子图或 G 的生成树，则 T 是 G 的最小生成树，而 T1 是
    G1 的最小生成树，T2 是 G2 的最小生成树。证。


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_64_3.png)


