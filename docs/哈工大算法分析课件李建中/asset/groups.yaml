    # Divide:


    3. 用Q中点坐标中位数m把Q划分为两个大小相等的集合

    Q1 = {x∈Q | x≤m}, Q2 = {x∈Q | x>m}


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_37_1.png)


    Conquer:


    4. 递归地求Q1,Q2中最近点对或近点

    (p1 p2) (q1 q2)


    Merge:


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_37_2.png)


    +   5. 考虑(p1 p2)、(q1 q2)之间的点(p3 q3)可能将产生更近的点对(x,y)。若p3是Q1中最大点,q3是Q2中最小点。(x,y)Q中最近点对。


    +   - 时间复杂性


    --Divide所需要量O(n)时间

    --Conquer所需要量2T(n/2)时间

    --Merge所需要量O(n)时间


    递推方程

    T(n)= O(1)      n=2

    T(n)=2T(n/2)+O(n)   n≥3


    --用Master定理求解T(n)

    T(n)=O(nlogn)


