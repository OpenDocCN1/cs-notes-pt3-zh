    # 类似 Graham-Scan(Q)


    /*S为栈,类似 Graham-Scan 构造凸包的顺序为 CH(Q) 的顶点*/


    +   1. 若 Q 中 y 坐标最小的点为 p0；

    +   2. 按极角 p0(或逆时针) 方向对 Q 中除去 p0 的点排序，得到 <p1 p2 ... pn>；

    +   3. Push(p0, S); Push(p1, S); Push(p2, S);

    +   4. FOR i=3 TO n DO

    +   5. While Next-to-top(S), Top(S)与 p0 的形成左转 Do

    +   6. Pop(S);

    +   7. Push(pi, S);

    +   8. Rerurn S.


    +   • 时间复杂性

    +     — 第1步 O(n) 排序

    +     — 第2步 O(n log n) 排序

    +     — 第3步 O(1) 时间

    +     — 第4-7步 每次 O(1) 时间

    +     — 总时间复杂度 T(n) = O(n log n)


    # 正确性分析


    假设 n 个不同的点构成 Q 是 Graham-Scan 算法输入，|Q|≥3, 其性质类似，则 S 自身即为凸包 CH(Q) 的顶点（按逆时针顺序）。


    证明： See pp. 88-90.


    # Divide-and-conquer 算法


    Preprocess: (时间复杂度 O(1))


    +   1. 若 |Q|<3, 直接输出；

    +   2. 若 |Q|=3, 直接按逆时针方向输出 CH(Q) 的顶点；


    Divide: 使用 O(n) 算法递归中值


    +   1. 找到一个点集子集 Q_L 和 Q_R 使得 Q 与其合并后形成凸包的点集 Q_L 和 Q_R, Q_L 为左半, Q_R 为右半；


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_41_1.png)


    Conquer: (时间复杂度 2T(n/2))


    +   1. 递归地求 Q_L 和 Q_R 的 CH(Q_L) 和 CH(Q_R)；'
