    # 直观地：我们用 f(n) 与 n^{log_b a} 比较


    (1). 若 f(n) 大，则 T(n) = Θ(f(n)) (2). 若 f(n) 大，则 T(n) = Θ(f(n)) (3). 若 f(n) 与 n^{log_b
    a} 同阶，则 T(n) = Θ(n^{log_b a} lg n) = Θ(f(n) lg n)


