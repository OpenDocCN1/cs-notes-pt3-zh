  - "[PAGE 20]\n\n# Two kinds of Heap\n\n+   - Max-Heap\n\nIn a max-heap, every node\
    \ i other than the root satisfies the following property : A[Parent(i)] ≥ A[i].\n\
    \nThe largest element is at the root.\n\n# Min-Heap\n\nIn a min-heap, every node\
    \ i other than the root satisfies the following property : A[Parent(i)] ≤ A[i].\n\
    \nThe smallest element is at the root.\n\n# Maintaining the heap property\n\n\
    +   - Max-Heapify(A, i)\n+   - Input: array A and index i into A\n+   - Output:\
    \ makes the subtree rooted at A[i] become a max-heap\n+   - Assume:\n+     - two\
    \ subtrees rooted at Left(i) and Right(i) are max-heaps, but A[i] may not satisfy\
    \ the max-heap property.\n\n# Basic Idea\n\nMax-Heapify(A, 2)\n\n# Algorithm\n\
    \n```\nMax-Heapify(A,i)\nlargest ← i\nl ← Left(i)\nr ← Right(i)\nif l ≤ heap-size[A]\
    \ and A[l] > A[i]\n    then largest ← l\n    else largest ← i\nif r ≤ heap-size[A]\
    \ and A[r] > A[largest]\n    then largest ← r\nif largest ≠ i\n    then begin\
    \ exchange A[i] ↔ A[largest]\n    Max-Heapify(A,largest);\n```\n\n# Time Complexity\n\
    \nLet h = height. Then h is the largest integer satisfying 1 + 2 + … + 2^{h-1}\
    \ ≤ n, that is, 2^{h} ≤ n. Hence, h = ⌊lg n⌋.\n\nheight = ⌈lg n⌉ where n = heap-size[A]\
    \ Hence, Max-Heapify runs in time O(lg n)."
