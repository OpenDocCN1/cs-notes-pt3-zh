    \n- 三角剖分问题具有优化子结构\n  设 P={v1,v2,...,vn} 是 n+1 个顶点组成的多边形, 而 T 是 P 的优化三角剖分, 也包含顶点\
    \ v1,v2,...,vn 的三角剖分, 则 T = T(v1,...,vk) ∪ T(vk,...,vn) ∪ {v1vk, vkv1}\n  (1).\
    \ T(v1,...,vk) 是 P(v1,...,vk) 的优化三角剖分。\n  (2). T(vk,...,vn) 是 P(vk,...,vn) 的优化三角剖分。\n\
