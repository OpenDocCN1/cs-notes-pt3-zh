    \ |\n| B | 0 | ↑1 | ↑1 | ↑2 | ↑2 | ←3 | ←3 |\n| D | 0 | ↑1 | ↑2 | ↑2 | ↑2 | ↑3\
    \ | ↑3 |\n| A | 0 | ↑1 | ↑2 | ↑2 | ←3 | ↑3 | ←4 |\n| B | 0 | ↑1 | ↑2 | ↑2 | ↑3\
    \ | ←4 | ↑4 |\n\n- C[i,j]=0, i=0 或 j=0\n- C[i,j]=C[i-1,j-1]+1, x_i=y_j\n- C[i,j]=Max(C[i-1,j],C[i,j-1]),\
    \ x_i≠y_j\n\n```\nLCS-length(X, Y)\n m←length(X); n←length(Y);\n For i←1 To m\
    \ Do C[i,0]←0;\n For j←1 To n Do C[0,j]←0;\n For i←1 To m Do\n   For j←1 To n\
