    \ A 具有 ratio bound p(n)，当且仅当 max{C/C', C'/C} ≤ p(n)。\n\n- 对于问题规模为 n 的问题，max(C/C',\
    \ C'/C)=C/C'\n- 对于问题规模为 n 的问题，max(C/C', C'/C)=C/C'\n- 若存在 C' 使得 C/C' > 1，Ratio\
    \ Bound 为 4 个字节？\n- Ratio Bound 越大，越高效\n\n## 相对误差\n\n定义2（相对误差）：对于给定解，定义所求解问题的最优解长度与\
    \ |C-C'|/C' 的关系。定义3（相对误差）：一个近似算法的相对误差是 ε(n)，如果 |C-C'|/C' ≤ ε(n)。\n\n定理1：ε(n) ≤\
    \ p(n)-1。\n证明：对于最坏情况，ε(n)=|C-C'|/C'=C/C'-1=p(n)-1；对于一般情况，ε(n)=|C-C'|/C'=(C-C')/C'=(C/C'-1)/(C'/C)=p(n)-1。\n\
