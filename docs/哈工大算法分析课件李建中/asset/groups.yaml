    一个物品至多装入一次。


    +   - 输入：C>0, w_i>0, v_i>0, 1≤i≤n

    +   - 输出：(x_1, x_2, ..., x_n), x_i∈{0,1}, 确定 Σ_{i=1..n} w_i x_i ≤ C, Σ_{i=1..n}
    v_i x_i 最大


    零件背包规划问题

    max Σ_{i=1..n} v_i x_i

    Σ_{i=1..n} w_i x_i ≤ C

    x_i∈{0,1}, 1≤i≤n


