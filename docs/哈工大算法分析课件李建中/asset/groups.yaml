    \ If C[i-1,j]≥C[i,j-1]\n       Then C[i,j]←C[i-1,j]; B[i,j]←\"↑\";\n       Else\
    \ C[i,j]←C[i,j-1]; B[i,j]←\"←\";\n Return C and B.\n```\n\n## 构造化解\n\n- 基本思想\n\
    \  - 从B[m,n]出发循着指针找到\n  - 若B[i,j]=\"↖\", 则x_i=y_j, LCS有一个后缀\n  - 如此递归地\"LCS\"\
    等于X的LCS的Inverse\n\n```\nPrint-LCS(B, X, i, j)\n IF i=0 or j=0 THEN Return;\n IF\
    \ B[i,j]=\"↖\"\n   THEN Print-LCS(B, X, i-1,j-1); Print x_j;\n   ELSE IF B[i,j]=\"\
    ↑\"\n     THEN Print-LCS(B, X, i-1,j);\n     ELSE Print-LCS(B, X, i,j-1).\n\n\
    Print-LCS(B, X, length(X), length(Y))\n可打印出X与Y的LCS。\n```\n\n## 算法复杂性\n\n- 时间复杂性\n\
    \  - 计算最长公共子序列时间\n    - (i,j)遍历矩阵, i跨m步, j跨n步\n    - O(mn)\n  - 构造最长公共子序列时间: O(m+n)\n\
    \  - 最长公共子序列总时间: O(mn)\n- 空间复杂性\n  - 需要存储矩阵C和B\n  - 需要空间 O(mn)\n\n## 5.4 Optimal\
    \ Polygon Triangulation\n\n## 问题定义\n\n- 多边形\n  多边形表示顶点序列被表示为 P={v1,v2,...,vn}\
    \ 或顶点序列 v1,v2,...,vn,v1\n- 简单多边形\n  除了顶点外没有其它顶点在多边形边上\n- 多边形方向, 逆时针方向\n  一平面凸多边形可被定义为其所有边是凸多边形角线,\n\
    \  一平面凸多边形顶点序列若多边形是凸的\n  一平面凸多边形若其内部和外部顶点序列都是多边形角线\n\n- 设P为多边形\n  多边形P上任意两个相邻顶点\
    \ vi, vi+1 所对应的边称为 vi, vi+1 弦或边\n- 正则划分\n  一个多边形P的正则是划分是把P划分为若干个相邻正三角形组成的集合\n\
    - 绝对三角剖分问题\n  给定一个多边形P和代价函数W\n  一剖分, 若P的正三角剖分T, 使其代价 Σ_{T∈T} W(T) 最小, 其中 S_T 是所对应的正三角形集合\n\
    \n## 优化解的动态分析\n\n- 设\n  P={v1,v2,...,vn} 是 n+1 个顶点组成的多边形\n  T_P 为多边形的优化三角剖分, 包含顶点\
