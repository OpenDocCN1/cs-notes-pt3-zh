  - '[PAGE 115]


    # 1. SONET 电话负载问题


    输入：含有 n 个顶点的环（其中所有顶点按照顺时针方向列得到 0, 2, 3, ..., n-1）。一个电话呼叫集合 C，其中 (i, j)∈C 表示节点
    i 呼叫节点 j。任意电话的路由既可以按照顺时针方向进行也可以按照逆时针方向进行。对 C 中电话的路由策略，边 (i, i+1 mod n) 的负载为通过该边的电话个数
    L_i。环的总负载为 max_{1≤i≤n} L_i。


    输出：C 中电话的一个路由策略，使得环的总负载最小。


    问题：设计一个 2-近似算法求解 SONET 电话负载问题。


    # 2. 匹配问题


    Consider the maximum weight matching problem in a (non-bipartite) graph G = (V,E).
    More precisely, given a non-negative weight w_i for every edge (i,j)∈ E, the problem
    is to find a matching of maximum total weight.


    Consider the following greedy algorithm: start from an empty matching and repeatedly
    add an edge of maximum weight among all edges which do not meet any of the edges
    chosen previously. Stop as soon as the matching is maximal (i.e., no other edge
    can be added). Let M_G denote the greedy matching and Z_G its cost. In this problem
    you are asked to show that the greedy algorithm is a 2-approximation algorithm.


    +   (a) Show that the following linear program gives an upper bound Z_up on the
    optimal value Z_opt of the maximum weight matching problem

    +   min Σ_{i∈V} x_i

    +   s.t. x_i + x_j ≥ w_{ij} for all (i:j) ∈ E

    +   x_i ≥ 0 for all i ∈ V


    +   (b) From the greedy matching M_G, construct a feasible solution x to the above
    linear program and show that its value is 2Z_G. Conclude that 2Z_G ≥ Z_opt.


    # 3. 装箱问题


    输入：长度为 C 的箱子（数量不限），长度分别为 0 ≤ w1, w2, ..., wn ≤ C 的 n 个不可分割的物品。


    输出：物品的装箱策略，使得所用箱子的个数最少。


    # First-Fit 算法：


    依次考察每个物品。对于当前物品 i，在以前用过的箱子 B1, ..., Bk 中找到下标最小的能够容纳 i 的箱子，将物品 i 放入找到的箱子中；如果找不到这样的箱子，则新开一个箱子
    Bk+1 将 i 放入。


    问题：证明 first-fit 算法的近似比为 2。'
