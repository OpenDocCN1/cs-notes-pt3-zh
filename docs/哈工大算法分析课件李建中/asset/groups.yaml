    +   - 输入：Euclidean 空间上有 n 个点组成的集合 Q

    +   - 输出：Pᵢ, Pⱼ ∈ Q

    +     Dist(Pᵢ, Pⱼ)=Min{Dist(X, Y) | X, Y ∈ Q}

    +   - Dist(X, Y) Euclidean 距离：

    +     假设 X=(x₁, y₁), Y=(x₂, y₂)，则

    +     Dist(X,Y)=√[(x₁ - x₂)² + (y₁ - y₂)²]


    # 一维空间算法


    +   - 利用排序算法

    +     - 排序

    +     - 如 Q 中点排序

    +     - 递归地求解两半的最近点对

    +     - 时间复杂度

    +       - T(n)=O(n log n)'
