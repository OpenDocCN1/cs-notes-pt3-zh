    \ T(n)=2T(n/2)+Θ(n)\n  - T(n)=Θ(nlogn)\n\n## Worst case time complexity of Quicksort\n\
    \n- Worst Case\n  - |A[p..q]|=1, |A[q+1..r]|=n-1\n  - The worst case happens in\
    \ call to Partition Algorithm\n- Time complexity\n  - T(1)=Θ(1)\n  - T(n)=T(n-1)+Θ(n)=Θ(n²)\n\
    \n## Average time complexity of Quicksort\n\n- Average time complexity is near\
    \ Θ(nlogn) rather than Θ(n²)\n- Why? See an example\n  - Assume PARTITION always\
    \ generates 9:1 partition\n  - Run time of QUICKSORT is\n    T(n)=T(9n/10)+T(n/10)+Θ(n)=Θ(nlogn)\n\
    - The process of Partitioning is as following\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_29_0.png)\n\
    \n- 当每一层 log₁₀ n = Θ(logn) 时，高度是 Θ(logn)\n- 当 log₁₀ n/1 和 log₁₀ n/9 = Θ(logn)\
    \ 时，每层总和是 Θ(n)\n- 9:1 划分不会导致最坏情况，运行时间仍为 Θ(nlogn)\n\n## 3.3 Sorting in Linear Time\n\
    \n- Lower bounds for sorting\n- Counting Sort Algorithm\n- Radix Sort Algorithm\n\
    - Bucket Sort Algorithm\n\n### Lower bounds for sorting\n\n- Decision-tree model\n\
    \  - Comparison sort\n    - Use only comparisons between elements to gain order\
