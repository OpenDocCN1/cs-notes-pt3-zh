    \n# Lower bound for the worst case\n\nIn a comparison sort, the (worst case) running\
    \ time is the depth (or height) of the decision tree T(n).\n\nSince the decision\
    \ tree has n! leaves, its depth T(n) satisfies 2^{T(n)} ≥ n!. Thus, T(n) = Ω(n\
    \ log n).\n\nAre there sort algorithm with complexity O(n)?\n\n# Counting Sort\n\
    \n+   - Input: A[1..n], 0 ≤ A[i] ≤ k for 1 ≤ i ≤ n\n+   - Output: B[1..n]=sorted\
    \ A[1..n]\n+   - Idea\n+     - Use C[0..k] to compute the position of each A[i]\n\
    +     - Put each A[i] for i=n to 1 into B[1..n]\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_30_1.png)\n\
    \n# Algorithm\n\n```\nfor i ← 1 to k\n  do C[i] ← 0;\nfor j ← 1 to length[A]\n\
    \  do C[A[j]] ← C[A[j]] + 1;\nfor i ← 2 to k\n  do C[i] ← C[i] + C[i-1];\nfor\
    \ j ← length[A] downto 1\n  do begin\n    B[C[A[j]]] ← A[j];\n    C[A[j]] ← C[A[j]]\
    \ - 1;\n  end\n```\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_30_2.png)\n\n#\
    \ Time complexity\n\n```\nfor i ← 1 to k\n  do C[i] ← 0;\nfor j ← 1 to length[A]\n\
    \  do C[A[j]] ← C[A[j]] + 1;\nfor i ← 2 to k\n  do C[i] ← C[i] + C[i-1];\nfor\
    \ j ← length[A] downto 1\n  do begin\n    B[C[A[j]]] ← A[j];\n    C[A[j]] ← C[A[j]]\
    \ - 1;\n  end\n```\n\nTime Complexity=O(n+k)"
