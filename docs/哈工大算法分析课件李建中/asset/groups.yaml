    # 递推方程


    m(i, j) = m(i+1, j) 0≤j < w_i

    m(i, j) = max{m(i+1, j), m(i+1, j-w_i)+v_j} j ≥ w_i

    m(n, j) = 0 0 ≤ j < w_n

    m(n, j) = v_n j ≥ w_n


    # 自底向上计算顺序


    m(i, j) = m(i+1, j), 0≤j < w_i

    m(i, j) = max{m(i+1, j), m(i+1, j-w_i)+v_j}, j ≥ w_i

    m(n, j) = 0, 0 ≤ j < w_n

    m(n, j) = v_n, j ≥ w_n


    令 w_i 整集, n=4


