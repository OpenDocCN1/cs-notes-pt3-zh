    \ To C Do\nm[n, j] = v_n;\nFor i=n-1 To 2 Do\nFor j=0 To min(w_i-1, C) Do\nm[i,\
    \ j] = m[i+1, j];\nFor j=w_i To C Do\nm[i, j]=max{m[i+1, j], m[i+1, j-w_i]+v_j};\n\
    If C < w_i Then m[i, C]=max[m[2, C], m[2, C-w_i]+v_j]; Else m[i, C]=max[m[2, C],\
    \ m[2, C-w_i]+v_j];\n\n## 构造优化解\n\n- 1. m(1, C) 是优化解的值, 构造解计算如下:\n  If m(1, C)\
