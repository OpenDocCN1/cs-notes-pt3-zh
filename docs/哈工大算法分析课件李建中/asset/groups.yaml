    )，若 \\(\\mathrm{rand}>1-x_S\\)，则 \\(C=C\\cup\\{S\\}\\)；/* \\(S\\) 以概率 \\(x_S\\\
    ) 被选中 */\n  4. 输出 \\(C\\)。\n\n**定理 7.** 对于集合覆盖的 LP-随机舍入算法，每个集合以概率 \\(x_S\\) 被选入\
    \ \\(C\\)，因此其期望成本等于 LP 最优值：\n\\[\n\\mathbb E[\\mathrm{cost}(C)]=\\sum_{S\\in\\\
    mathcal S}\\Pr[S\\text{ 被选入 }C]\\,c(S)=\\sum_{S\\in\\mathcal S}x_S c(S)=\\mathrm{OPT}_{LP}.\n\
    \\]\n\n**定理 8.** 对于集合覆盖的 LP-随机舍入算法，\\(\\forall e\\in U\\)，\\(e\\) 被覆盖的概率至少 \\\
    (1-1/e\\)。\n\n证明：设包含 \\(e\\) 的集合为 \\(S_1,\\dots,S_k\\)，令 \\(x_i=x_{S_i}\\)。由于\
    \ \\(\\sum_{i=1}^k x_i\\ge 1\\)，\n\\[\n\\Pr[e\\text{ 未被覆盖}]=\\prod_{i=1}^k(1-x_i)\n\
    \\le \\left(1-\\frac{\\sum_{i=1}^k x_i}{k}\\right)^k\n\\le \\left(1-\\frac1k\\\
    right)^k\n\\le \\frac1e.\n\\]\n因此 \\(\\Pr[e\\text{ 被覆盖}]\\ge 1-\\frac1e\\)。\n\n\
    ## Primal-dual schema\n\n- 集合覆盖的 Primal-dual Schema 算法\n  1. \\(x_S=0\\)；/* 对每个集合\
    \ \\(S\\in\\mathcal S\\) 有一个变量 \\(x_S\\) */\n  2. \\(y_e=0\\)；/* 对每个元素 \\(e\\\
    in U\\) 有一个变量 \\(y_e\\) */\n  3. \\(F=\\emptyset\\)；/* \\(F\\) 为已覆盖元素的集合 */\n\
    \  4. while \\(F\\neq U\\) do\n     - 取 \\(e\\in U\\setminus F\\)；\n     - 增大\
    \ \\(y_e\\)，直到存在某个 \\(S\\in\\mathcal S\\)（\\(e\\in S\\)）满足 \\(\\sum_{e'\\in S}y_{e'}=c(S)\\\
    )；\n     - 将上一步中满足 \\(\\sum_{e'\\in S}y_{e'}=c(S)\\) 的集合 \\(S\\) 选中：\\(x_S=1\\\
    )，\\(F=F\\cup S\\)；\n  5. 输出所有满足 \\(x_S=1\\) 的集合 \\(S\\)。\n\n**引理 2.** 在上述算法中，while\
    \ 循环结束后，\\(x_S\\) 是原始可行解，\\(y_e\\) 是对偶可行解。\n\n**引理 3.** 上述算法中，while 循环结束后，\\(x_S\\\
    ) 与 \\(y_e\\) 满足如下两个条件：\n\n1. 对 \\(\\forall S\\in\\mathcal S\\)，\\(x_S>0\\Rightarrow\
    \ \\sum_{e\\in S}y_e=c(S)\\)；\n2. 对 \\(\\forall e\\in U\\)，\\(y_e>0\\Rightarrow\
    \ 1\\le \\sum_{S\\ni e}x_S\\le f\\)，其中 \\(f=\\max_{e\\in U}|\\{S\\in\\mathcal\
    \ S:e\\in S\\}|\\) 是元素被集合覆盖的最大频率。\n\n**定理 9.** 若在 primal-dual schema 的增量过程中，变量\
    \ \\(x,y\\) 满足上述两个条件，则其增量系数为 \\((\\alpha,\\beta)=(1,f)\\)。\n\n证明：由引理 3，执行增量过程后，其对应变量\
    \ \\(x,y\\) 满足上面两个条件；这两种情况对应增量系数 \\((\\alpha=1,\\beta=f)\\)。由定理 4，\n\\[\n\\mathrm{cost}(C)=\\\
    sum_{S\\in\\mathcal S}x_S c(S)\n=\\sum_{e\\in U}y_e\\left(\\sum_{S\\ni e}x_S\\\
    right)\n\\le f\\sum_{e\\in U}y_e.\n\\]\n又由 \\(y\\) 的对偶可行性，\\(\\sum_{e\\in U}y_e\\\
    le \\mathrm{OPT}_{LP}\\)，因此取得增量系数 \\((\\alpha=1,\\beta=f)\\)。其过程与此类似，具体细节略。\n\n\
    ## 1. SONET 电话负载问题\n\n输入：含有 \\(n\\) 个顶点的环（其中所有顶点按照顺时针方向排列为 \\(0,1,2,\\dots,n-1\\\
