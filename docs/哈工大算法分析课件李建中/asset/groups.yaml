    # 4.5 Finding the convex hull


    # 问题定义


    输入：平面上给n个点集合Q

    输出：CH(Q): Q的convex hull


    Q的convex hull是一个最小凸多边形 P, Q均在其内部或边界上P向


    凸多边形P是有其下所有顶点连形：连接P的任意两点的都包含P内


    # Graham-Scan算法


    +   - 基本思想

    +   - 首先求Convex hull的初始顶点，最低点坐标

    +   - 点按极角顺序从小到大排列，然后逆时针方向的遍历点。去除Convex hull顶点的点。

    +   - 结束。


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_39_0.png)


    # 第1步


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_39_1.png)


    # 第2步


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_39_2.png)


    # 第3步


    ![](img/9e822ee25d7fb44c33253ed3ff372fc1_39_3.png)'
