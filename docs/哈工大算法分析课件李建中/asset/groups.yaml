    +   定义1. 若图 G=(V, E) 有一个割 (S, V-S)

    +   定义2. 若 u∈S, v∈V-S, 则 (u, v) 被称作割 (S, V-S) 的一条边。

    +   定义3. 若割 (S, V-S) 的一条边 (u, v) 权重最小，则 (u, v) 被称作割 (S, V-S) 的最小边，

    +   则该边 (S, V-S) 属于 A。

    +   定义4. 若 (S, V-S) 的最小边 (u, v) 被称作该割所含所有 (S, V-S) 的最小边，则 (u, v) 属于 A。


