    \n零件背包规划问题\nmax Σ_{i=1..n} v_i x_i\nΣ_{i=1..n} w_i x_i ≤ C\nx_i∈{0,1}, 1≤i≤n\n\
    \n## 优化解结构分析\n\n定理(优化子结构) 假设(y_1, y_2, ..., y_n)是0-1背包问题的优化解，则(y_2, ..., y_n)是以下子问题的优化解：\n\
