  - '[PAGE 44]


    # What?


    # Dynamic Programming 直译


    +   - 把原问题分解成一系列子问题

    +   - 解决每个子问题仅一次，并将结果保存起来供以后使用。一个子问题可能被解决多次，但只需计算一次，节省计算时间

    +   - 自底而上地计算

    +   - 适用范围

    +     - 某些优化问题：可分解为多个子问题，子问题解被重复使用


    # How?


    # 使用 Dynamic Programming 的条件


    +   - Optimal substructure（最优子结构）

    +     某个问题的最优解包含其子问题的最优解。

    +     针对同一个问题可以有不同的最优解。

    +   - Subproblems（重叠子问题）

    +     在问题的解剖过程中，某些子问题被反复使用


    # Dynamic Programming 的实例


    +   - 最短路径问题

    +   - Dynamic Programming 求解过程


    # 1: 对各 d(S,T) 同源有 5 个子问题


    从 S 到 T 的最短路径长度为： d(S,T)=min{1+d(A,T), 2+d(B,T), 5+d(C,T)}


    # 2: 对各 d(A,T), d(B,T), d(C,T) 各有 6 个子问题


    # 3: 求解各子问题


    d(A,T)=min{4+d(D,T), 11+d(E,T)}=min{22,24}=22 <A,D,T>

    d(B,T)=min{9+d(D,T), 5+d(E,T), 16+d(F,T)}=min{27,18,18}=18 <B,E,T>

    d(C,T)=min{2+d(F,T)}=4 <C,F,T>


    # 4: 求最后从 S 到 T 的最短路径


    d(S,T)=min{1+d(A,T), 2+d(B,T), 5+d(C,T)}=min{23,20,9}=9 <S,C,F,T>'
  - "[PAGE 45]\n\n# Dynamic Programming 典型的四步骤\n\n+   - 一开始把复杂问题分解：划分为子问题\n+   - 逐步地从最简单问题开始\n\
    +     d(S,T)=min{1+d(A,T), 2+d(B,T), 5+d(C,T)}\n+   - 逐步地把子问题，重复不可避免\n+   - 每个子问题只做一次向后\n\
    +     - 只与前代问题相关\n+     - 其它问题无关的信息\n+   - 根据最优子结构信息构造最优解\n\n![](img/9e822ee25d7fb44c33253ed3ff372fc1_45_0.png)\n\
    \n# 5.2 Matrix-chain Multiplication\n\n# 问题定义\n\n+   - 给定：<A1, A2, ..., An>, Ai\
    \ 为 p_{i-1}×p_i 矩阵\n+   - 问题：计算 A1×A2×...×An 的最小代价方法\n\n矩阵乘法代价/乘积性质：乘法次数\n若 A\
    \ 是 p×q 矩阵，B 是 q×r 矩阵，则 A×B 乘积代价 O(pqr)\n\n# Motivation\n\n+   - 链乘法就是实现\n+  \
    \   - 矩阵乘法是链乘法\n+   - 链乘一个问题有多种可行的计算方法。\n+     例如，(A1×A2×A3×A4)\n+     = (A1×A2)×(A3×A4)\n\
    +     = ((A1×A2)×(A3×A4))\n+     = ((A1×A2)×(A3×A4))\n+     ...\n+     = ((A1×A2)×A3)×A4\n\
    \n+   - 链乘法计算的计算代价与顺序有关\n+     - 设 A1=10×100 矩阵，A2=100×5 矩阵，A3=5×50 矩阵\n+    \
    \ T((A1×A2)×A3)=10×100×5+10×5×50=7500\n+     T(A1×(A2×A3))=100×5×50+10×100×50=75000\n\
    \n结论：采用不同的顺序会导致代价差异\n\n+   - 链乘法设计问题解空间\n+     - p(n)=计算 n 个矩阵链乘法的方案数\n+     -\
    \ p(n)随 n 增长\n+       (A1×...×An) 有 (A1×...×An) 种划分\n\n由此可见的解空间是无法用枚举方法穷举最优解的！\n\
