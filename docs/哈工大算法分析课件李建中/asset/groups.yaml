- raw:
  - '[PAGE 4]


    # # 第一章 算法设计与分析 overview


    李建中

    数据与知识工程研究中心

    计算机科学与技术学院


    # ## 提要


    +   1.1 Role of Algorithms in Computer Science

    +   1.2 Concepts of Algorithms

    +   1.3 Analyzing Algorithms

    +   1.4 Designing Algorithms


    # ## 1.1 Role of Algorithms in Computer Science


    +   - 算法是计算机科学的主題

    +   - 计算机科学体系

    +   - 算法设计与分析的地位

    +   - 算法设计与分析的意义


    +   解决一个计算问题的过程

    +   可计算

    +   ↓

    +   可计算理论

    +   ↓

    +   能行可计算否

    +   ↓

    +   计算复杂性理论

    +   ↓

    +   设计与分析算法

    +   ↓

    +   算法设计与分析

    +   ↓

    +   用计算机语言实现算法

    +   ↓

    +   数据结构与程序设计

    +   ↓

    +   软件系统

    +   ↓

    +   编译、OS、...


    # ## 算法是计算机科学的重要主题


    +   - 70年代前

    +     - 计算机科学基础的主要问题被清晰地认清

    +     - Knuth出版了《The Art of Computer Programming》

    +     - 以算法研究为主线确立了算法为计算机科学基础的重要主题

    +     - 1974年获得图灵奖

    +   - 70年代后

    +     - 算法作为计算机科学核心推动了计算机科学技术的飞速发展


    +   - 可计算理论

    +     - 计算模型

    +     - 可计算问题/不可计算问题

    +     - 计算模型的等价性--图灵/Church命题

    +   - 计算复杂性理论

    +     - 在给定的计算模型下研究问题的复杂性

    +     - 固有复杂性

    +     - 算法性下界

    +     - 平均复杂性

    +     - 复杂性问题的分类: P=NP?

    +     - 抽象复杂性研究'
  - '[PAGE 5]


    +   - 算法设计和分析

    +     - 设计算法的理论、方法和技术

    +     - 分析算法的理论、方法和技术

    +     - 具体问题算法设计与分析

    +   - 计算机软件

    +     - 系统软件

    +     - 工具软件

    +     - 应用软件


    # 1.2 Concepts of Algorithms


    +   - 算法的定义

    +   - 问题定义

    +   - 算法的实例


    # 算法定义


    定义1 (计算) 可由一个修复计算模型机械地执行的规则或算法步骤序列则称为被计算模型的一个计算。


    +   - 注意

    +     - 一个计算和模型是一个计算 (计算模型是计算如)

    +     - 计算可能永远不停止……不是算法


    定义2(算法)算法是一个满足下列条件的计算：

    有限性：有步骤必须停止。

    确定性：每步都是严格定义和明确的动作。

    有效性：每个操作都是被精确地执行。

    输入：具有清楚定义的输入和输出的输入。

    输出：产生满足给定条件要求的输出。


    算法帮助我们解决间题。

    什么是问题？


    定义3 (问题) 设Input和Output是两个集合。一个问题就是一个集合P, Input×Output, Input为问题P的输入集合, Input的每个元素都是问题P的一个输入。Output称为问题P的输出集合,
    Output的每个元素都是问题P的一个输出。


    +   - 注意

    +     - 问题定义了输入和输出的关系


    例: SORT问题定义如下

    输入: Input= {<a1,...,an>|ai是整数}

    输出: Output= {<b1,...,bn>|bi是整数, b1≤...≤bn}

