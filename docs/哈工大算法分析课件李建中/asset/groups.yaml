    # 5.6 The Optimal Binary Search Trees


    # 问题的定义


    +   - 二叉搜索树 T

    +     - 特征：

    +       - K={k1,k2,...,kn}

    +       - D={d0,d1,...,dn}

    +       - d_i 处于 k_i 与 k_{i+1} 之间, d0 处于 k1 左侧, dn 处于 kn 右侧

    +     - 附加信息：

    +       - 设关键字 k_i 搜索概率为 p_i

    +       - 设 d_i 搜索概率为 q_i

    +       - Σ_{i=1}^n p_i + Σ_{i=0}^n q_i = 1


    # 搜索树的期望代价


    E(T)= Σ_{i=1}^n (DEP_T(k_i)+1)p_i + Σ_{i=0}^n (DEP_T(d_i)+1)q_i


    # 问题的定义


    输入：K={k1,k2,...,kn}, k1<k2<...<kn

