    \ 差错报告报文\n\n- 几种 ICMP 报文已不再使用\n  - 信息请求与应答报文\n  - 子网掩码请求和应答报文\n  - 路由器询问和通告报文\n\
    \n## ICMP报文的格式\n\n❖ ICMP报文封装到IP数据报中传输\n\n![](img/b7a9324545f24cd4f1f7132598005229_416_0.png)\n\
