  - '[PAGE 534]


    # 随机访问MAC协议


    +   ◆ 当结点要发送分组时：

    +   ▪ 利用信道全部数据速率R发送分组

    +   ▪ 没有事先的结点间协调


    +   ◆ 两个或多个结点同时传输： → “冲突”


    +   ◆ 随机访问MAC协议需要定义：

    +   ▪ 如何检测冲突

    +   ▪ 如何从冲突中恢复 (e.g., 通过延迟重传)


    +   ◆ 典型的随机访问MAC协议：

    +   ▪ 时隙(sloated)ALOHA

    +   ▪ ALOHA

    +   ▪ CSMA、CSMA/CD、CSMA/CA'
  - '[PAGE 535]


    # 时隙ALOHA协议


    +   假设：

    +   - 所有帧大小相同

    +   - 时间被划分为等长的时隙（每个时隙可以传输1个帧）

    +   - 节点只能在时隙开始时刻发送帧

    +   - 节点间时钟同步

    +   - 如果2个或2个以上节点在同一时隙发送帧，节点即检测到冲突


    +   运行：

    +   - 当节点有新的帧时，在下一个时隙(slot)发送

    +     - 如果无冲突：该节点可以在下一个时隙继续发送新的帧

    +     - 如果冲突：该节点在下一个时隙以概率p重传该帧，直至成功'
  - '[PAGE 536]


    # 时隙ALOHA协议


    ![](img/b7a9324545f24cd4f1f7132598005229_536_0.png)


    +   优点：

    +   - 单个结点活动时，可以连续以信道全部速率传输数据

    +   - 高度分散化：只需同步时隙

    +   - 简单


    +   缺點：

    +   - 冲突，浪费时隙

    +   - 空闲时隙

    +   - 结点也许能以远小于分组传输时间检测到冲突

    +   - 时钟同步'
  - '[PAGE 537]


    # 时隙ALOHA协议


    效率(efficiency): 长期运行时，成功发送帧的时隙所占比例 (很多结点，有很多帧待发送)


    +   假设: N个结点有很多帧待传输，每个结点在每个时隙均以概率p发送数据


    +   对于给定的一个结点，在一个时隙将帧发送成功的概率 = p(1-p)^{N-1}


    +   对于任意结点成功发送帧的概率 = Np(1-p)^{N-1}


    +   最大效率: 求得使Np(1-p)^{N-1}最大的p*


    +   对于很多结点，求Np*(1-p*)^{N-1}当N趋近无穷时的极限，可得:


    最大效率 = 1/e = 0.37


    最好情况: 信道被成功利用的时间仅占37%!'
