  - '[PAGE 539]


    # ALOHA协议


    P(给定结点成功发送帧) = P(该结点发送) · P(无其他结点在[t₀−1, t₀]期间发送帧) · P(无其他结点在[t₀, t₀+1]期间发送帧)
    = p · (1−p)^(N−1) · (1−p)^(N−1) = p · (1−p)^(2(N−1))


    ...n选取最优的p，并令n→∞


    = 1/(2e) = 0.18


    比时隙ALOHA协议更差！'
