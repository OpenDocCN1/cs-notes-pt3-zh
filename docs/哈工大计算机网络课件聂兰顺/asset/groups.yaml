    # 谢谢！\n\n# 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n# Web应用\n\n# Web与HTTP\n\n# World Wide Web:\
    \ Tim Berners-Lee\n\n+   - 网页\n+   - 网页互相链接\n\n# 网页(Web Page)包含多个对象(objects)\n\
    \n+   - 对象：HTML文件、JPEG图片、视频文件、动态脚本等\n+   - 基本HTML文件：包含对其他对象引用的链接\n\n# 对象的寻址(addressing)\n\
    \n+   - URL (Uniform Resource Locator)：统一资源定位器 RFC1738\n+   - Scheme://host:port/path\n\
    \n```\nwww.someschool.edu/someDept/pic.gif\n```\n\nhost name\n\npath name\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_33_0.png)\n\n# HTTP协议概述(1)\n\n+   ◆ 万维网应用遵循什么协议？\n\
    +   ◆ 超文本传输协议\n+     - HyperText Transfer Protocol\n+   ◆ C/S结构\n+     - 客户—Browser:\
    \ 请求、接收、展示Web对象\n+     - 服务器—Web Server: 响应客户的请求，发送对象\n+   ◆ HTTP版本:\n+     -\
    \ 1.0: RFC 1945\n+     - 1.1: RFC 2068\n\n![](img/b7a9324545f24cd4f1f7132598005229_34_0.png)\n\
    \n# HTTP概述（2）\n\n# ◆ 使用TCP传输服务\n\n+   - 服务器在80端口等待客户的请求\n+   - 浏览器发起到服务器的TCP连接(创建套接字Socket)\n\
    +   - 服务器接受来自浏览器的TCP连接\n+   - 浏览器(HTTP客户端)与Web服务器(HTTP服务器)交换HTTP消息\n+   - 关闭TCP连接\n\
    \n# ◆ 无状态(stateless)\n\n+   - 服务器不维护任何有关客户端过去所发请求的信息\n\n![](img/b7a9324545f24cd4f1f7132598005229_35_0.png)\n\
    \n> 有状态的协议更复杂：\n> \n> ➢ 需维护状态(历史信息)\n> \n> ➢ 如果客户或服务器失效，会产生状态的不一致，解决这种不一致代价高\n\
    \n# 哈尔滨工业大学\n\nHARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n# 谢谢！\n\
    \n# 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n# HTTP连接\n\n# HTTP连接的两种类型\n\n# 非持久性连接(Nonpersistent\
    \ HTTP)\n\n+   - 每个TCP连接最多允许传输一个对象\n+   - HTTP 1.0版本使用非持久性连接\n\n# 持久性连接(Persistent\
    \ HTTP)\n\n+   - 每个TCP连接允许传输多个对象\n+   - HTTP 1.1版本默认使用持久性连接\n\n![](img/b7a9324545f24cd4f1f7132598005229_39_0.png)\n\
    \n# 非持久性连接(1)\n\n假设用户在浏览器中输入URL\nwww.someSchool.edu/someDepartment/home.index\n\
    \n包含文本和指向10个jpeg图片的链接\n\n1a. HTTP客户端向地址为 www.someSchool.edu 的服务器上的HTTP服务器进程(端口80)\
    \ 发起TCP连接请求。\n\n1b. HTTP服务器在端口80等待TCP连接请求，接受连接并通知客户端。\n\n2. HTTP客户端将HTTP请求消息(包含URL地址)通过TCP连接的套接字发出，消息中所含的URL表明客户端需要对象\
    \ someDepartment/home.index\n\n3. HTTP服务器收到请求消息，解析，产生包含所需要对象的响应消息，并通过套接字发给客户端。\n\
    \n时间\n\n# 非持久性连接(2)\n\n+   4. HTTP服务器关闭TCP连接。\n\n+   5. HTTP客户端收到响应消息，解析html文件，显示html文件，发现有10个指向jpeg对象的超连接。\n\
    \n+   6. 为每个jpeg对象重复步骤1-5。\n\n时间\n\n# 响应时间分析与建模\n\n# RTT(Round Trip Time)\n\n\
    +   从客户端发送一个很小的数据包到服务器并返回所经历的时间\n\n# 响应时间(Response time)\n\n+   发起、建立TCP连接：1个RTT\n\
    \n+   发送HTTP请求消息到HTTP响应消息的前几个字节到达：1个RTT\n\n+   响应消息中所含的文件/对象传输时间\n\n+   Total=2RTTs+文件发送时间\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_42_0.png)\n\n# 持久性HTTP\n\n# 非持久性连接的问题\n\
    \n+   - 每个对象需要2个RTT\n+   - 操作系统需要为每个TCP连接开销资源(overhead)\n+   - 浏览器会怎么做？\n+   \
    \  - 打开多个并行的TCP连接以获取网页所需对象\n+     - 给服务器端造成什么影响呢？\n\n# 持久性连接\n\n+   - 发送响应后，服务器保持TCP连接的打开\n\
    +   - 后续的HTTP消息可以通过这个连接发送\n\n# 无流水(pipelining)的持久性连接\n\n+   - 客户端只有收到前一个响应后才发送新的请求\n\
    +   - 每个被引用的对象耗时1个RTT\n\n# 带有流水机制的持久性连接\n\n+   - HTTP 1.1的默认选项\n+   - 客户端只要遇到一个引用对象就尽快发出请求\n\
    +   - 理想情况下，收到所有的引用对象只需耗时约1个RTT\n\n# 哈尔滨工业大学\n\nHARBIN INSTITUTE OF TECHNOLOGY\n\
    \n立足航天，服务国防，面向国民经济主战场\n\n# 谢谢！\n\n![](img/b7a9324545f24cd4f1f7132598005229_45_0.png)\n\
    \n# 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n# HTTP消息格式\n\n# HTTP请求消息\n\n+   HTTP协议有两类消息\n+  \
    \ - 请求消息(request)\n+   - 响应消息(response)\n\n+   请求消息\n+   - ASCII：人直接可读\n\nrequest\
    \ line (GET, POST, HEAD commands)\n\nheader lines\n\n```\nGET /somedirectory/page.html\
    \ HTTP/1.1\nHost: www.someschool.edu\nUser-agent: Mozilla/4.0\nConnection: close\n\
    Accept-language: fr\n```\n\nCarriage return line feed indicates end of message\n\
    \n(extra carriage return, line feed)\n\n# HTTP请求消息的通用格式\n\n![](img/b7a9324545f24cd4f1f7132598005229_48_0.png)\n\
    \n# 上传输入的方法\n\n+   POST方法\n+   - 网页经常需要填写表格(form)\n+   - 在请求消息的消息体(entity body)中上传客户端的输入\n\
    \n+   URL方法\n+   - 使用GET方法\n+   - 输入信息通过request行的URL字段上传\n\nwww.somesite.com/animalsearch?monkeys&banana\n\
    \n# HTTP响应消息\n\n```\nHTTP/1.1 200 OK\nConnection: close\nDate: Thu, 06 Aug 1998\
    \ 12:00:15 GMT\nServer: Apache/1.3.0 (Unix)\nLast-Modified: Mon, 22 Jun 1998 12:00:15\
    \ GMT\nContent-Length: 6821\nContent-Type: text/html\n\ndata data data data data\
    \ ...\n```\n\nstatus line (protocol status code status phrase)\n\nheader lines\n\
    \ndata, e.g., requested HTML file\n\n# HTTP响应状态代码\n\n响应消息的第一行\n\n示例\n\n+   - 200\
    \ OK\n+   - 301 Moved Permanently\n+   - 400 Bad Request\n+   - 404 Not Found\n\
    +   - 505 HTTP Version Not Supported\n\n# 404 Not Found\n\nnginx\n\n![](img/b7a9324545f24cd4f1f7132598005229_52_0.png)\n"
