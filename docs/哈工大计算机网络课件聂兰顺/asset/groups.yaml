    ## 802.11无线局域网简介（1）


    ## IEEE 802.11无线局域网


    + 802.11b

    + - 2.4-2.5GHz免费频段 (unlicensed spectrum)

    + - 最高速率：11 Mbps

    + - 物理层采用直接序列扩频 (DSSS)技术

    + - 所有主机使用相同的码片序列


    + 802.11a

    + - 5-6 GHz频段

    + - 最高速率：54 Mbps


    + 802.11g

    + - 2.4-2.5 GHz频段

    + - 最高速率：54 Mbps


    + 802.11n: 多天线(MIMO)

    + - 2.4-2.5 GHz频段

    + - 最高速率：600 Mbps


    + - 均使用CSMA/CA多路访问控制协议

    + - 均有基础设施(基站)网络模式和特定网(自组网)网络模式


    ## IEEE 802.11体系结构


    Internet


    集线器(hub)、交换机或路由器


    BSS 1


    BSS 2


    + 无线主机与基站通信

    + - 基站(base station) = 访问点(access point-AP)


    + 基本服务集BSS(Basic Service Set)，也称为单元(cell)

    + - 基础设施网络模式:

    + - 无线主机

    + - AP: 基站

    + - 自组网(ad hoc)模式:

    + - 只有主机


    ## 802.11：信道与AP关联


    802.11b: 2.4GHz-2.485GHz频谱划分为11个不同频率的信道


    + - 每个AP选择一个频率(信道)

    + - 存在干扰可能: 相邻的AP可能选择相同的信道！


    主机: 必须与某个AP关联(associate)


    + - 扫描信道，监听包含AP名称(服务集标识符-SSID)和MAC地址的信标(beacon)帧

    + - 选择一个AP进行关联

    + - 可能需要进行身份认证

    + - 典型情形：运行DHCP获取IP地址等信息


