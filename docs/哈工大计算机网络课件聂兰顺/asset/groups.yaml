    \  - 应用层协议：完成名字的解析\n    - Internet核心功能，用应用层协议实现\n    - 网络边界复杂\n\n![](img/b7a9324545f24cd4f1f7132598005229_96_0.png)\n\
    \n## DNS\n\n### DNS服务\n\n- 域名向IP地址的翻译\n- 主机别名\n- 邮件服务器别名\n- 负载均衡：Web服务器\n\n###\
