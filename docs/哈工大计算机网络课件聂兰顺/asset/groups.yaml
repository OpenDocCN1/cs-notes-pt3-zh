    ```\nS: 128.119.40.186, 80\nD: 10.0.0.1, 3345\n```\n\n4: NAT路由器修改数据报的目的地址与目的端口号为：10.0.0.1,\
    \ 3345，并向内网转发\n\n![](img/b7a9324545f24cd4f1f7132598005229_405_0.png)\n\n## 网络地址转换(NAT)\n\
    \n- ❖ 16-bit端口号字段:\n  - 可以同时支持60,000多并行连接！\n- ❖ NAT主要争议:\n  - 路由器应该只处理第3层功能\n\
    \  - 违背端到端通信原则\n    - 应用开发者必须考虑到NAT的存在，e.g., P2P应用\n  - 地址短缺问题应该由IPv6来解决\n\n##\
