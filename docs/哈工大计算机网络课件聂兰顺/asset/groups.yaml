    \n## 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n## Email消息格式与POP3协议\n\n## Email消息格式\n\n- SMTP：email消息的传输/交换协议\n\
    - RFC 822：文本消息格式标准\n\n- 头部行(header)\n  - To\n  - From\n  - Subject\n- 消息体(body)\n\
    \  - 消息本身\n  - 只能是ASCII字符\n\n与SMTP命令不同\n\n![](img/b7a9324545f24cd4f1f7132598005229_86_0.png)\n\
    \n## 邮件访问协议\n\n![](img/b7a9324545f24cd4f1f7132598005229_88_0.png)\n\n### 邮件访问协议：从服务器获取邮件\n\
    \n- POP: Post Office Protocol [RFC 1939]\n  - 认证/授权(客户端←→服务器)和下载\n- IMAP: Internet\
    \ Mail Access Protocol [RFC 1730]\n  - 更多功能\n  - 更加复杂\n  - 能够操纵服务器上存储的消息\n- HTTP:\
    \ 163, QQ Mail等。\n\n## POP协议\n\n- 认证过程\n  - 客户端命令\n    - User：声明用户名\n    - Pass：声明密码\n\
    \  - 服务器响应\n    - +OK\n    - -ERR\n- 事务阶段\n  - List：列出消息数量\n  - Retr：用编号获取消息\n\
    \  - Dele：删除消息\n  - Quit\n\n```\nS: +OK POP3 server ready\nC: user bob\nS: +OK\n\
