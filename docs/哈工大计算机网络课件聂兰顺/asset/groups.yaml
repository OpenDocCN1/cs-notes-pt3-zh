    \ | yes | yes |\n| 广播域隔离 | no | no | no | yes |\n| 即插即用 | yes | yes | yes | no\
    \ |\n| 优化路由 | no | no | no | yes |\n| 直通传输（Cut through） | yes | yes | yes | no\
    \ |\n\n## 谢谢！\n\n## 计算机网络之探幽索隐\n\n主讲人：李全龙\n\n## 虚拟局域网(VLAN)\n\n## VLANs: 动机\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_605_0.png)\n\n考虑一下情形：\n\n- CS用户迁移到EE，但是希望连接至CS交换机，怎么办？\n\
    - 单一广播域：\n  - 所有第2层广播流量(ARP, DHCP, 未知目的MAC地址位置)必须穿越整个LAN\n  - 安全/隐私、效率问题\n\n##\
    \ VLANs\n\n虚拟局域网(Virtual Local Area Network)\n\n支持VLAN划分的交换机，可以在一个物理LAN架构上配置、定义多个VLAN\n\
    \n基于端口的VLAN: 分组交换机端口(通过交换机管理软件)，于是，单一的物理交换机 ……\n\n...就像多个虚拟交换机一样运行\n\nElectrical\
    \ Engineering\n(VLAN ports 1-8)\n\nComputer Science\n(VLAN ports 9-15)\n\nElectrical\
    \ Engineering\n(VLAN ports 1-8)\n\nComputer Science\n(VLAN ports 9-16)\n\n![](img/b7a9324545f24cd4f1f7132598005229_606_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_606_1.png)\n\n## 基于端口的VLAN\n\n流量隔离(traffic\
    \ isolation):\n去往/来自端口1-8的帧只到达端口1-8\n\n- 也可以基于MAC地址定义VLAN, 而不是交换端口\n\n动态成员: 端口可以动态分配给不同VLAN\n\
    \n在VLAN间转发: 通过路由(就像在独立的交换机之间)\n实践中，厂家会将交换机与路由器集成在一起\n\n![](img/b7a9324545f24cd4f1f7132598005229_607_0.png)\n\
    \n## 跨越多个交换机的VLAN\n\n![](img/b7a9324545f24cd4f1f7132598005229_608_0.png)\n\nElectrical\
    \ Engineering\n(VLAN ports 1-8)\n\nComputer Science\n(VLAN ports 9-15)\n\nPorts\
    \ 2,3,5 belong to EE VLAN\nPorts 4,6,7,8 belong to CS VLAN\n\n# 多线缆连接\n\n- 每个线缆连接一个VLAN\n\
    \n# 中继端口(trunk port): 在跨越多个物理交换机定义的VLAN 承载帧\n\n- 为多VLAN转发802.1帧容易产生歧义(必须携带VLAN\
    \ ID信息)\n- 802.1q协议为经过中继端口转发的帧增加/去除额外的首部域\n\n## 802.1Q VLAN帧格式\n\n802.1帧\n\n802.1Q帧\n\
    \npreamble\n\ndest. address\n\nsource address\n\ntype\n\ndata (payload)\n\nCRC\n\
    \npreamble\n\ndest. address\n\nsource address\n\ntype\n\ndata (payload)\n\nCRC\n\
    \n2字节的标记协议ID (Tag Protocol Identifier) (固定值: 0x8100)\n\n2字节的标记控制信息(Tag Control\
    \ Information) (12bit VLAN ID字段; 3bit优先级字段, 类似于 IP的TOS)\n\n重新计算的CRC\n\n![](img/b7a9324545f24cd4f1f7132598005229_609_0.png)\n"
