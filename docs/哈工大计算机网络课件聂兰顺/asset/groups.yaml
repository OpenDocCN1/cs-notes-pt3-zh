    S: <message 2 contents>\nS: .\nC: dele 2\nC: quit\nS: +OK POP3 server signing\
    \ off\n```\n\n## POP协议\n\n- “下载并删除”模式\n  - 用户如果换了客户端软件，无法重读该邮件\n- “下载并保持”模式：不同客户端都可以保留消息的拷贝\n\
