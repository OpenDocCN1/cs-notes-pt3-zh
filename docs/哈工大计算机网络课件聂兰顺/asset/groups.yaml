    ## 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## 本讲主题\n\n## OSPF协议简介\n\n## OSPF优点(RIP不具备)\n\
    \n- 安全(security): 所有OSPF报文可以被认证\n- (预防恶意入侵)\n- 允许使用多条相同费用的路径 (RIP只能选一条)\n- 对于每条链路，可以针对不同的TOS设置多个不同的费用度量\
    \ (e.g., 卫星链路可以针对“尽力”(best effort) ToS设置“低”费用；针对实时ToS设置“高”费用)\n- 集成单播路由与多播路由：\n\
    \  - 多播OSPF协议(MOSPF) 与OSPF利用相同的网络拓扑数据\n- OSPF支持对大规模AS分层(hierarchical)\n\n## 分层的OSPF\n\
    \n两级分层：局部区(Area)，主干区(Backbone).\n\n- 链路状态通告只限于区内\n- 每个路由器掌握所在区的详细拓扑\n- 只知道去往其他区网络的“方向”(最短路径)\n\
