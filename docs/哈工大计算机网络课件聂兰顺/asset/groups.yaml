    \n## 谢谢！\n\n## 计算机网络之探幽索隐\n\n主讲人：李全龙\n\n## 交换机（1）\n\n## 以太网交换机(switch)\n\n- 存储-转发以太网帧\n\
    - 检验到达帧的目的MAC地址，选择性(selectively) 向一个或多个输出链路转发帧\n- 利用CSMA/CD访问链路，发送帧\n- 主机感知不到交换机的存在\n\
    - 交换机无需配置\n\n## 交换机: 多端口间同时传输\n\n- 主机利用独享(dedicated)链路直接连接交换机\n- 交换机缓存帧\n- 交换机在每段链路上利用\
    \ CSMA/CD 收发帧，但无冲突，且可以全双工\n  - 每段链路一个独立的冲突域\n- **交换(switching)：**A-A’ 与 B-B’ 的传输可以同时进行，没有冲突\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_589_0.png)\n\n6个接口交换机\n(1,2,3,4,5,6)\n\
    \n## 交换机转发表：交换表\n\nQ: 交换机怎么知道A’ 可以通过接口4到达，而B’ 可以通过接口5到达？\n\nA: 每个交换机有一个交换表 (switch\
    \ table), 每个入口(entry):\n\n- (主机的MAC地址, 到达主机的接口, 时间戳)\n- 看起来很像路由表！\n\nQ: 交换表入口信息如何创建和维护的呢？\n\
    \n- 类似于路由协议？\n\n![](img/b7a9324545f24cd4f1f7132598005229_590_0.png)\n\n6个接口交换机\
    \ (1,2,3,4,5,6)\n\n## 交换机：自学习\n\n交换机通过自学习，获知到达主机的接口信息\n\n- 当收到帧时，交换机“学习”到发送帧的主机（通过帧的源MAC地址），位于收到该帧的接口所连接的LAN网段\n\
    - 将发送主机MAC地址/接口信息记录到交换表中\n\n# 交换表\n(初始为空)\n\n| MAC地址 | 接口 | TTL |\n|---|---|---|\n\
    | A | 1 | 60 |\n\n![](img/b7a9324545f24cd4f1f7132598005229_591_0.png)\n\n## 交换机：帧过滤/转发\n\
    \n当交换机收到帧：\n\n1. 记录帧的源MAC地址与输入链路接口\n2. 利用目的MAC地址检索交换表\n3. if 在交换表中检索到与目的MAC地址匹配的入口(entry)\n\
    \   then {\n      if 目的主机位于收到帧的网段\n      then 丢弃帧\n      else 将帧转发到该入口指向的接口\n\
    \   }\n   else 泛洪(flood) /* 向除收到该帧的接口之外的所有接口转发 */\n\n## 谢谢！\n\n## 计算机网络之探幽索隐\n\
    \n主讲人：李全龙\n\n## 交换机 (2)\n\n## 自学习与转发过程举例\n\n- ◆ 目的MAC地址A’，位置未知：\n  泛洪\n- ◆ 目的MAC地址A，位置已知：\n\
