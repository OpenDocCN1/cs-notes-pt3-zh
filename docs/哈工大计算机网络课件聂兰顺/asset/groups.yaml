    \  if (base == nextseqnum)\n    start_timer\n  nextseqnum++\n}\nelse\n  refuse_data(data)\n\
    ```\n\nΛ\nbase=1\nnextseqnum=1\n\nrdt_rcv(rcvpkt)\n&& corrupt(rcvpkt)\n\n![](img/b7a9324545f24cd4f1f7132598005229_211_0.png)\n\
    \n```\ntimeout\nstart_timer\nudt_send(sndpkt[base])\nudt_send(sndpkt[base+1])\n\
    ...\nudt_send(sndpkt[nextseqnum-1])\n```\n\n```\nrdt_rcv(rcvpkt) &&\nnotcorrupt(rcvpkt)\n\
    base = getacknum(rcvpkt)+1\nIf (base == nextseqnum)\n  stop_timer\nelse\n  start_timer\n\
    ```"
