    # 距离向量(Distance Vector)路由算法


    # Bellman-Ford方程(动态规划)


    令：


    dₓ(y):=从x到y最短路径的费用（距离）


    则：


    dₓ(y) = minᵥ {c(x,v) + dᵥ(y)}


    从邻居v到达目的y的费用（距离）


    x到邻居v的费用


    在x的所有邻居v中取最小值'
