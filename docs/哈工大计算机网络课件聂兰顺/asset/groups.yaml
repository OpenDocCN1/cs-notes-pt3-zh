    \ 长期运行时，成功发送帧的时隙所占比例 (很多结点，有很多帧待发送)\n\n+   假设: N个结点有很多帧待传输，每个结点在每个时隙均以概率p发送数据\n\
    \n+   对于给定的一个结点，在一个时隙将帧发送成功的概率 = p(1-p)^{N-1}\n\n+   对于任意结点成功发送帧的概率 = Np(1-p)^{N-1}\n\
    \n+   最大效率: 求得使Np(1-p)^{N-1}最大的p*\n\n+   对于很多结点，求Np*(1-p*)^{N-1}当N趋近无穷时的极限，可得:\n\
    \n最大效率 = 1/e = 0.37\n\n最好情况: 信道被成功利用的时间仅占37%!\n\n## ALOHA协议\n\n+   - 非时隙(纯)Aloha：更加简单，无需同步\n\
    +   - 当有新的帧生成时\n+     - 立即发送\n+   - 冲突可能性增大：\n+     - 在t₀时刻发送帧，会与在[t₀-1, t₀+1]期间其他节点发送的帧冲突\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_538_0.png)\n\nP(给定结点成功发送帧) = P(该结点发送)\
    \ · P(无其他结点在[t₀−1, t₀]期间发送帧) · P(无其他结点在[t₀, t₀+1]期间发送帧) = p · (1−p)^(N−1) · (1−p)^(N−1)\
    \ = p · (1−p)^(2(N−1))\n\n...n选取最优的p，并令n→∞\n\n= 1/(2e) = 0.18\n\n比时隙ALOHA协议更差！\n\
    \n## 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## 随机访问MAC协议 (2)\n\n## CSMA协议\n\n+   载波监听多路访问协议\n\
    +   CSMA (carrier sense multiple access)\n\n+   发送帧之前，监听信道(载波):\n\n+   - 信道空闲：发送完整帧\n\
    +   - 信道忙：推迟发送\n+     - 1-坚持CSMA\n+     - 非坚持CSMA\n+     - P-坚持CSMA\n\n+   冲突可能仍然发生：\n\
    +   信号传播延迟\n\n载波监听多路访问协议\n\nCSMA (carrier sense multiple access)\n\n发送帧之前，监听信道(载波)：\n\
    \n+   - 信道空闲：发送完整帧\n+   - 信道忙：推迟发送\n+     - 1-坚持CSMA\n+     - 非坚持CSMA\n+     -\
    \ P-坚持CSMA\n\n冲突可能仍然发生：\n信号传播延迟\n\n继续发送冲突帧：浪费信道资源\n\n节点空间布局\n\n![](img/b7a9324545f24cd4f1f7132598005229_544_0.png)\n\
    \ntime\nt₀\nt₁\n\n## CSMA/CD协议\n\n![](img/b7a9324545f24cd4f1f7132598005229_546_0.png)\n\
    \n网络带宽： R bps\n\n数据帧最小长度： L_min (bits)\n\n信号传播速度： V (m/s)\n\nL / R ≥ 2d_max /\
    \ V\n\nL_min / R = 2d_max / V\n\nL_min / R = RTT_max\n\n## CSMA/CD效率\n\n+   T_prop\
    \ = LAN中2个结点间的最大传播延迟\n\n+   t_trans = 最长帧传输延迟\n\n效率 = 1 / (1 + 5 t_prop / t_trans)\n\
    \n+   t_prop 趋近于0或者t_trans 趋近于∞时，效率趋近于1\n\n+   远优于ALOHA，并且简单、分散！\n\n## 谢谢！\n\n\
