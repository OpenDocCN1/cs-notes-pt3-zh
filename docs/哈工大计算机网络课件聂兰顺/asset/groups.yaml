    \ http://[3FFE:1:800:200C:417A]:8000\n\n## # IPv6基本地址类型\n\n单播(unicast)：\n\n一对一通信\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_469_0.png)\n\n多播(multicast)：\n\n一对多通信\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_469_1.png)\n\n任意播(anycast)：\n\n一对一组之一\n\
    （最近一个）通信\n\n![](img/b7a9324545f24cd4f1f7132598005229_469_2.png)\n\n## IPv4向IPv6过渡\n\
    \n不可能在某个时刻所有路由器同时被更新为IPv6\n\n- - 不会有“标志性的日期”\n  - IPv4和IPv6路由器共存的网络如何运行？\n\n隧道(tunneling):\
    \ IPv6数据报作为IPv4数据报的载荷进行封装，穿越IPv4网络\n\n![](img/b7a9324545f24cd4f1f7132598005229_470_0.png)\n\
    \n## 隧道（tunneling）\n\n逻辑视角：\n\n利用IPv4隧道连接IPv6路由器\n\n物理视角：\n\nA IPv6 B IPv6 E IPv6\
    \ F IPv6\n\nA IPv6 B IPv6 C IPv4 D IPv4 E IPv6 F IPv6\n\nA-to-B: IPv6\n\nB-to-C:\
    \ IPv6 inside IPv4\n\nB-to-C: IPv6 inside IPv4\n\nE-to-F: IPv6\n\nflow: X src:\
    \ A dest: F data\n\nsrc:B dest:E Flow: X Src: A Dest: F data\n\nsrc:B dest:E Flow:\
    \ X Src: A Dest: F data\n\nflow: X src: A dest: F data\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\
    \n主讲人：李全龙\n\n## RIP协议简介\n\n## AS内部路由\n\nInternet采用层次路由\n\nAS内部路由协议也称为内部网络协议 IGP\
    \ (interior gateway protocols)\n\n最常见的AS内部路由协议：\n\n- - 路由信息协议: RIP(Routing Information\
    \ Protocol)\n\n- - 开放最短路径优先: OSPF(Open Shortest Path First)\n\n- - 内部网关路由协议: IGRP(Interior\
    \ Gateway Routing Protocol)\n\n  - Cisco私有协议\n\n## RIP\n\n- - 早于1982年随BSD-UNIX操作系统发布\n\
    \  - 距离向量路由算法\n    - 距离度量：跳步数（max = 15 hops），每条链路1个跳步\n    - 每隔30秒，邻居之间交换一次DV，成为通告（advertisement）\n\
    \    - 每次通告：最多25个目的子网（IP地址形式）\n\n从路由器A到目的子网：\n\n![](img/b7a9324545f24cd4f1f7132598005229_476_0.png)\n\
    \n| subnet | hops |\n|---|---:|\n| u | 1 |\n| v | 2 |\n| w | 2 |\n| x | 3 |\n\
    | y | 3 |\n| z | 2 |\n\n## RIP: 举例\n\n![](img/b7a9324545f24cd4f1f7132598005229_477_0.png)\n\
    \n## 路由器D的路由表\n\n| destination subnet | next router | # hops to dest |\n|--------------------|-------------|----------------|\n\
    | W                  | A           | 2              |\n| Y                  |\
    \ B           | 2              |\n| z                  | B           | 7     \
    \         |\n| x                  | --          | 1              |\n| ...    \
    \            | ...         | ...            |\n\n## RIP：举例\n\nA-to-D advertisement\n\
    \n| dest | next | hops |\n|---|---|---|\n| w | - | 1 |\n| x | - | 1 |\n| z | C\
    \ | 4 |\n| .... | .... | .... |\n\n![](img/b7a9324545f24cd4f1f7132598005229_478_0.png)\n\
    \n## 路由器D的路由表\n\n| destination subnet | next router | # hops to dest |\n|---|---|---|\n\
    | w | A | 2 |\n| y | B | 2 |\n| z | B → A | 7 → 5 |\n| x | -- | 1 |\n| .... |\
    \ .... | .... |\n\n## RIP: 链路失效、恢复\n\n如果180秒没有收到通告→邻居/链路失效\n\n- - 经过该邻居的路由不可用\n\
    \  - 重新计算路由\n  - 向邻居发送新的通告\n  - 邻居再依次向外发送通告（如果转发表改变）\n  - 链路失效信息能否快速传播到全网？\n \
    \   - 可能发生无穷计数问题\n  - 毒性逆转技术用于预防乒乓(ping-pong)环路\n\n  (另外: 无穷大距离 = 16 hops)\n"
