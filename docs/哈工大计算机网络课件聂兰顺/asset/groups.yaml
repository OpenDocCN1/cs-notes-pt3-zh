  md: "\n## Rdt 2.0: 无错误场景\n\n```\nrdt_send(data)\nsndpkt = make_pkt(data, checksum)\n\
    udt_send(sndpkt)\nWait for call from above\nWait for ACK or NAK\nrdt_rcv(rcvpkt)\
    \ && isNAK(rcvpkt)\nudt_send(sndpkt)\nrdt_rcv(rcvpkt) && isACK(rcvpkt)\nrdt_rcv(rcvpkt)\
    \ && corrupt(rcvpkt)\nudt_send(NAK)\nWait for call from below\nrdt_rcv(rcvpkt)\
    \ && notcorrupt(rcvpkt)\nextract(rcvpkt,data)\ndeliver_data(data)\nudt_send(ACK)\n\
    ```\n\n## Rdt 2.0: 有错误场景\n\n![](img/b7a9324545f24cd4f1f7132598005229_181_0.png)\n\
    \n## 谢谢！\n\n## 计算机网络之探赜索隐\n\n主讲人：聂兰顺\n\n## Rdt 2.1和2.2\n\n## Rdt 2.0有什么缺陷？\n\n\
    - 如果ACK/NAK消息发生错误/被破坏(corrupted)会怎么样？\n  - 为ACK/NAK增加校验和，检错并纠错\n  - 发送方收到被破坏ACK/NAK时不知道接收方发生了什么，添加额外的控制消息\n\
    \  - 如果ACK/NAK坏掉，发送方重传\n  - 不能简单地重传：产生重复分组\n- 如何解决重复分组问题？\n  - 序列号(Sequence number):\
    \ 发送方给每个分组增加序列号\n  - 接收方丢弃重复分组\n\n`stop and wait`: Sender sends one packet, then\
    \ waits for receiver response\n\n## Rdt 2.1: 接收方，应对ACK/NAK破坏\n\n```\n# Wait for\
    \ 0 from below\nrdt_rcv(rcvpkt) && notcorrupt(rcvpkt) && has_seq0(rcvpkt)\nextract(rcvpkt,data)\n\
    deliver_data(data)\nsndpkt = make_pkt(ACK, chksum)\nudt_send(sndpkt)\n\nrdt_rcv(rcvpkt)\
    \ && corrupt(rcvpkt)\nsndpkt = make_pkt(NAK, chksum)\nudt_send(sndpkt)\n\nrdt_rcv(rcvpkt)\
    \ && notcorrupt(rcvpkt) && has_seq1(rcvpkt)\nsndpkt = make_pkt(ACK, chksum)\n\
    udt_send(sndpkt)\n\n# Wait for 1 from below\nrdt_rcv(rcvpkt) && corrupt(rcvpkt)\n\
    sndpkt = make_pkt(NAK, chksum)\nudt_send(sndpkt)\n\nrdt_rcv(rcvpkt) && notcorrupt(rcvpkt)\
    \ && has_seq0(rcvpkt)\nsndpkt = make_pkt(ACK, chksum)\nudt_send(sndpkt)\n\nrdt_rcv(rcvpkt)\
    \ && notcorrupt(rcvpkt) && has_seq1(rcvpkt)\nextract(rcvpkt,data)\ndeliver_data(data)\n\
    sndpkt = make_pkt(ACK, chksum)\nudt_send(sndpkt)\n```\n\n## Rdt 2.1 vs. Rdt 2.0\n\
    \n### 发送方\n\n- 为每个分组增加了序列号\n- 两个序列号(0, 1)就够用，为什么？\n- 需校验ACK/NAK消息是否发生错误\n- 状态数量翻倍\n\
    \  - 状态必须“记住”“当前”的分组序列号\n\n### 接收方\n\n- 需判断分组是否是重复\n  - 当前所处状态提供了期望收到分组的序列号\n\
    - 注意：接收方无法知道ACK/NAK是否被发送方正确收到\n\n![](img/b7a9324545f24cd4f1f7132598005229_188_0.png)\n\
    \n## Rdt 2.2: 无NAK消息协议\n\n- 我们真的需要两种确认消息(ACK + NAK)吗？\n- 与rdt 2.1功能相同，但是只使用ACK\n\
    - 如何实现？\n  - 接收方通过ACK告知最后一个被正确接收的分组\n  - 在ACK消息中显式地加入被确认分组的序列号\n- 发送方收到重复ACK之后，采取与收到NAK消息相同的动作\n\
    \  - 重传当前分组\n\n## Rdt 2.2 FSM片段\n\n![](img/b7a9324545f24cd4f1f7132598005229_190_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_191_0.png)\n\n## 哈尔滨工业大学\n\n规格严格，功夫到家，面向国民经济主战场\n\
    \n## 谢谢！\n\n![](img/b7a9324545f24cd4f1f7132598005229_192_0.png)\n\n## 计算机网络之探赜索隐\n\
    \n主讲人：聂兰顺\n\n## 本讲主题\n\n### Rdt 3.0\n\n## Rdt 3.0\n\n- 如果信道既可能发生错误，也可能丢失分组，怎么办？\n\
    \  - “校验和 + 序列号 + ACK + 重传” 够用吗？\n- 方法：发送方等待 “合理” 时间\n  - 如果没收到ACK，重传\n  - 如果分组或ACK只是延迟而不是丢了\n\
    \    - 重传会产生重复，序列号机制能够处理\n    - 接收方需在ACK中显式告知所确认的分组\n  - 需要定时器\n\n## Rdt 3.0发送方FSM\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_195_0.png)\n\n## Rdt 3.0示例(2)\n\n![](img/b7a9324545f24cd4f1f7132598005229_197_0.png)\n\
    \n- (c) lost ACK\n- (d) premature timeout\n\n## Rdt 3.0性能分析\n\n- ◆ Rdt 3.0能够正确工作，但性能很差\n\
    - ◆ 示例：1Gbps链路，15ms端到端传播延迟，1KB分组\n\n```\nT_transmit = L (packet length in bits)\
    \ / R (transmission rate, bps) = 8kb/pkt / 10^9 b/sec = 8 microsec\n```\n\n- 发送方利用率：发送方发送时间百分比\n\
    - 在1Gbps链路上每30毫秒才发送一个分组→33KB/sec\n- 网络协议限制了物理资源的利用\n\n```\nU_sender ≈ (L / R)\
    \ / (RTT + L / R) ≈ .008 / 30.008 ≈ 0.00027\n```\n\n## Rdt 3.0: 停等操作\n\n![](img/b7a9324545f24cd4f1f7132598005229_199_0.png)\n\
    \n```\nU_sender = (L / R) / (RTT + L / R) = .008 / 30.008 ≈ 0.00027\n```\n\n##\
    \ 哈尔滨工业大学\n\nHARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\
    \n## 计算机网络之探赜索隐\n\n主讲人：聂兰顺\n\n## Rdt 3.0: 停等操作\n\n![](img/b7a9324545f24cd4f1f7132598005229_203_0.png)\n\
    \n```\nU_sender = (L / R) / (RTT + L / R) ≈ .008 / 30.008 ≈ 0.00027\n```\n\n##\
    \ 流水线机制：提高资源利用率\n\n```\nsender\nreceiver\nfirst packet bit transmitted, t = 0\n\
    last bit transmitted, t = L / R\nRTT\nfirst packet bit arrives\nlast packet bit\
    \ arrives, send ACK\nACK arrives, send next packet, t = RTT + L / R\nIncrease\
    \ utilization by a factor of 3!\nU_sender ≈ 3*L/R / (RTT + L/R) ≈ .024 / 30.008\
    \ ≈ 0.0008\n```\n\n![](img/b7a9324545f24cd4f1f7132598005229_204_0.png)\n"
