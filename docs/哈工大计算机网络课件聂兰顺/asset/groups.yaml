  - '[PAGE 146]


    # 传输层服务和协议


    传输层协议为运行在不同Host上的进程提供了一种逻辑通信机制


    端系统运行传输层协议


    +   - 发送方：将应用递交的消息分成一个或多个的Segment，并向下传给网络层。

    +   - 接收方：将接收到的segment组装成消息，并向上交给应用层。


    传输层可以为应用提供多种协议


    +   - Internet上的TCP

    +   - Internet上的UDP


    ![](img/b7a9324545f24cd4f1f7132598005229_146_0.png)'
  - '[PAGE 147]


    # 传输层 vs. 网络层


    网络层：提供主机之间的逻辑通信机制


    传输层：提供应用进程之间的逻辑通信机制


    +   - 位于网络层之上

    +   - 依赖于网络层服务

    +   - 对网络层服务进行（可能的）增强


    家庭类比:


    12个孩子给12个孩子发信


    +   - 应用进程 = 孩子

    +   - 应用消息 = 信封里的信

    +   - 主机 = 房子

    +   - 传输层协议 = 李雷和韩梅梅

    +   - 网络层协议 = 邮政服务


    ![](img/b7a9324545f24cd4f1f7132598005229_147_0.png)'
