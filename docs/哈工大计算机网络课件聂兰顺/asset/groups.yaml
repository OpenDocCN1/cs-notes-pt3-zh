  - '[PAGE 210]


    # Go-Back-N(GBN)协议：发送方


    +   分组头部包含k-bit序列号


    +   窗口尺寸为N，最多允许N个分组未确认


    ![](img/b7a9324545f24cd4f1f7132598005229_210_0.png)


    +   ACK(n)：确认到序列号n(包含n)的分组均已被正确接收


    +   可能收到重复ACK


    +   为空中的分组设置计时器(timer)


    +   超时Timeout(n)事件：重传序列号大于等于n，还未收到ACK的所有分组'
  - "[PAGE 211]\n\n# GBN: 发送方扩展FSM\n\n```\nrdt_send(data)\nif (nextseqnum < base+N)\
