  - '[PAGE 592]


    # 交换机：帧过滤/转发


    当交换机收到帧：


    +   1. 记录帧的源MAC地址与输入链路接口

    +   2. 利用目的MAC地址检索交换表

    +   3. if 在交换表中检索到与目的MAC地址匹配的入口(entry)

    +      then {

    +         if 目的主机位于收到帧的网段

    +         then 丢弃帧

    +         else 将帧转发到该入口指向的接口

    +      }

    +      else 泛洪(flood) /* 向除收到该帧的接口之外的所有接口转发 */'
