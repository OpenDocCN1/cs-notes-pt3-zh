    ![](img/b7a9324545f24cd4f1f7132598005229_408_0.png)\n\n## NAT穿透问题\n\n## 解决方案3:\
    \ 中继(如Skype)\n\n- NAT内部的客户与中继服务器建立连接\n- 外部客户也与中继服务器建立连接\n- 中继服务器桥接两个连接的分组\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_409_0.png)\n\n# 谢谢！\n\n## 计算机网络之探幽索隐\n\
    \n主讲人：李全龙\n\n## 互联网控制报文协议(ICMP)\n\n## ICMP报文\n\n| 类型(Type) | 编码(Code) | description\
