    \n## 分层的OSPF\n\nAS边界路由器(AS boundary routers)：连接其他AS。\n\n参考：RFC 2328\n\n![](img/b7a9324545f24cd4f1f7132598005229_489_0.png)\n\
    \nAS Boundary Router (ASBR)\n\nBackbone\n\nArea 1\n\nArea 2\n\nArea 3\n\n## 哈尔滨工业大学\n\
