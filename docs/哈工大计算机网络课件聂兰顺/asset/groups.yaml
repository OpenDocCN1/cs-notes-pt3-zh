  - '[PAGE 497]


    # 路径属性与BGP路由（route）


    +   - 通告的前缀信息包括BGP属性

    +     - 前缀+属性=“路由”

    +   - 两个重要属性：

    +     - **AS-PATH(AS路径)**：包含前缀通告所经过的AS序列：e.g., AS 67, AS 17

    +     - **NEXT-HOP(下一跳)**：开始一个AS-PATH的路由器接口，指向下一跳AS。

    +       - 可能从当前AS到下一跳AS存在多条链路


    ![](img/b7a9324545f24cd4f1f7132598005229_497_0.png)'
