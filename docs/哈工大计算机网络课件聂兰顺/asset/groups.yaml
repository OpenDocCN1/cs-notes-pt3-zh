    \n## 规模(scale):\n\n- 层次路由节省路由表大小，减少路由更新流量\n- 适应大规模互联网\n\n## 性能(performance):\n\
    \n- intra-AS: 侧重性能\n- inter-AS: 策略主导\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n\
