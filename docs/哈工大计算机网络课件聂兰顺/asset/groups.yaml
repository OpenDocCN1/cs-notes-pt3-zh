    # IP编址(addressing)


    +   IP分组：

    +   - 源地址(SA)-从哪儿来

    +   - 目的地址(DA)-到哪儿去


    +   接口(interface): 主机/路由器与物理链路的连接

    +   - 实现网络层功能

    +   - 路由器通常有多个接口

    +   - 主机通常只有一个或两个接口 (e.g., 有线的以太网接口，无线的802.11接口)


    ![](img/b7a9324545f24cd4f1f7132598005229_353_0.png)'
