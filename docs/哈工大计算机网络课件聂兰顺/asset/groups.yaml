  - '[PAGE 600]


    # 交换机 vs. 路由器


    两者均为存储-转发设备：


    +   路由器：网络层设备 (检测网络层分组首部)


    +   交换机：链路层设备 (检测链路层帧的首部)


    二者均使用转发表：


    +   路由器：利用路由算法(路由协议)计算(设置), 依据IP地址


    +   交换机：利用自学习、泛洪构建转发表, 依据MAC地址


    ![](img/b7a9324545f24cd4f1f7132598005229_600_0.png)'
