    # 交换机转发表：交换表


    Q: 交换机怎么知道A’ 可以通过接口4到达，而B’ 可以通过接口5到达？


    A: 每个交换机有一个交换表 (switch table), 每个入口(entry):


    +   - (主机的MAC地址, 到达主机的接口, 时间戳)

    +   - 看起来很像路由表！


