  - '[PAGE 347]


    # IP分片过程


    +   - 假设原IP分组总长度为 $L$，待转发链路的MTU为 $M$

    +   - 若 $L > M$，且 DF=0，则可以/需要分片

    +   - 分片时每个分片的标识复制原IP分组的标识

    +   - 通常分片时，除最后一个分片，其他分片均分为MTU允许的最大分片

    +   - 一个最大分片可封装的数据应该是8的倍数，因此，一个最大分片可封装的数据为：

    +     $d = \left\lfloor \frac{M - 20}{8} \right\rfloor \times 8$

    +   - 需要的总片数为：

    +     $n = \left\lceil \frac{L - 20}{d} \right\rceil$'
  - "[PAGE 348]\n\n# IP分片过程\n\n+   每片的片偏移字段取值为：\n+   \n+   $$F_i = \\frac{d}{8} \\\
    times (i-1),\\quad 1 \\le i \\le n$$\n\n+   每片的总长度字段为：\n+   \n+   $$L_i = \\begin{cases}\
    \ d + 20 & 1 \\le i < n \\\\ L - (n-1)d & i = n \\end{cases}$$\n\n+   每片的MF标志位为：\n\
    +   \n+   $$MF_i = \\begin{cases} 1 & 1 \\le i < n \\\\ 0 & i = n \\end{cases}$$"
