  - '[PAGE 430]


    # 链路状态路由算法


    # Dijkstra 算法


    +   - 所有结点(路由器)掌握网络拓扑和链路费用

    +     - 通过“链路状态广播”

    +     - 所有结点拥有相同信息

    +   - 计算从一个结点（“源”）到达所有其他结点的最短路径

    +     - 获得该结点的转发表

    +   - 迭代：K次迭代后，得到到达K个目的结点的最短路径


    # 符号：


    +   - c(x,y)：结点x到结点y链路费用；如果x和y不直接相连，则=∞

    +   - D(v)：从源到目的v的当前路径费用值

    +   - p(v)：沿从源到v的当前路径，v的前序结点

    +   - N’：已经找到最小费用路径的结点集合'
  - "[PAGE 431]\n\n# Dijkstra 算法\n\n```\n1 初始化：\n2 N' = {u}\n3 for 所有结点v\n4   if v毗邻u\n\
    5     then D(v) = c(u,v)\n6   else D(v) = ∞\n7 \n8 Loop\n9  找出不在 N'中的w，满足D(w)最小\n\
    10 将w加入N'\n11 更新w的所有不在N'中的邻居v的D(v)：\n12   D(v) = min( D(v), D(w) + c(w,v) )\n\
    13 /*到达v的新费用或者是原先到达v的费用，或者是\n14 已知的到达w的最短路径费用加上w到v的费用 */\n15 until 所有结点在N'中\n\
    ```"
