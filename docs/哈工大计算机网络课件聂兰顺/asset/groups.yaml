  - '[PAGE 501]


    # BGP路由选择


    网关路由器收到路由通告后，利用其输入策略 (import policy) 决策接受/拒绝该路由


    +   - e.g., 从不将流量路由到 AS x

    +   - 基于策略 (policy-based) 路由


    路由器可能获知到达某目的 AS 的多条路由，基于以下准则选择：


    +   1. 本地偏好 (preference) 值属性: 策略决策 (policy decision)

    +   2. 最短 AS-PATH

    +   3. 最近 NEXT-HOP 路由器: 热土豆路由 (hot potato routing)

    +   4. 附加准则'
  - '[PAGE 502]


    # BGP路由选择策略


    ![](img/b7a9324545f24cd4f1f7132598005229_502_0.png)


    图例：


    提供商网络


    客户网络


    +   ♦ A,B,C是提供商网络/AS(provider network/AS)

    +   ♦ X,W,Y是客户网络(customer network/AS)

    +   ♦ W,Y是桩网络(stub network/AS): 只与一个其他AS相连

    +   ♦ X是双宿网络(dual-homed network/AS): 连接两个其他AS


    +   - X不期望经过他路由B到C的流量

    +   - ...因此，X不会向B通告任何一条到达C的路由'
  - '[PAGE 503]


    # # BGP路径选择策略


    ![](img/b7a9324545f24cd4f1f7132598005229_503_0.png)


    +   - A向B通告一条路径：AW

    +   - B向X通告路径：BAW

    +   - B是否应该向C通告路径BAW呢？

    +     - **绝不！** B路由CBAW的流量没有任何“收益”，因为W和C均不是B的客户。

    +     - B期望强制C通过A向W路由流量

    +     - B期望只路由去往/来自**其客户的流量**！'
  - '[PAGE 504]


    # 为什么采用不同的AS内与AS间路由协议？


    # 策略(policy):


    +   - inter-AS: 期待能够管理控制流量如何被路由，谁路由经过其网络等.

    +   - intra-AS: 单一管理，无需策略决策


    # 规模(scale):


    +   - 层次路由节省路由表大小，减少路由更新流量

    +   - 适应大规模互联网


    # 性能(performance):


    +   - intra-AS: 侧重性能

    +   - inter-AS: 策略主导'
