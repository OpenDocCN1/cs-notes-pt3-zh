  - '[PAGE 607]


    # 基于端口的VLAN


    流量隔离(traffic isolation):

    去往/来自端口1-8的帧只到达端口1-8


    +   - 也可以基于MAC地址定义VLAN, 而不是交换端口


    动态成员: 端口可以动态分配给不同VLAN


    在VLAN间转发: 通过路由(就像在独立的交换机之间)

    实践中，厂家会将交换机与路由器集成在一起


