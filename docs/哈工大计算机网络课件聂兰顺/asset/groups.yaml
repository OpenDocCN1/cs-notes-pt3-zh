    ## 以太网(ETHERNET)


    “统治地位”的有线LAN技术：


    - 造价低廉(NIC不足¥100.00)

    - 应用最广泛的LAN技术

    - 比令牌局域网和ATM等，简单、便宜

    - 满足网络速率需求：10 Mbps – 10 Gbps


    ![](img/b7a9324545f24cd4f1f7132598005229_578_0.png)


    ## 以太网：物理拓扑


    - ◆ 总线(bus): 上世纪90年代中期前流行

    - 所有节点在同一冲突域(collision domain) (可能彼此冲突)

    - ◆ 星型(star): 目前主流网络拓扑

    - 中心交换机(switch)

    - 每个节点一个单独冲突域(节点间彼此不冲突)


    ![](img/b7a9324545f24cd4f1f7132598005229_579_0.png)


    总线(bus): 同轴电缆


    ![](img/b7a9324545f24cd4f1f7132598005229_579_1.png)


    交换机(switch)


    星型(star)


    ## 以太网：不可靠、无连接服务


    - 无连接(connectionless): 发送帧的网卡与接收帧的网卡间没有“握手”过程

    - 不可靠(unreliable): 接收网卡不向发送网卡进行确认

    - 差错帧直接丢弃，丢弃帧中的数据恢复依赖高层协议 (e.g., TCP)，否则，发生数据丢失

    - 以太网的MAC协议: 采用二进制指数退避算法的CSMA/CD


    ## 以太网CSMA/CD算法


    - 1. NIC从网络层接收数据报，创建数据帧。

    - 2. 监听信道：

    - 如果NIC监听到信道空闲，则开始发送帧；

    - 如果NIC监听到信道忙，则一直等待到信道空闲，然后发送帧。

    - 3. NIC发送完整个帧，而没有检测到其他结点的数据发送，则NIC确认帧发送成功！

    - 4. 如果NIC检测到其他结点传输数据，则中止发送，并发送堵塞信号 (jam signal)

    - 5. 中止发送后，NIC进入二进制指数退避：

    - 第m次连续冲突后：

    - 取n = Min(m, 10)

    - NIC 从{0,1,2, ..., 2^n-1}中随机选择一个数K

    - NIC等待K·512比特的传输延迟时间，再返回第2步

    - 连续冲突次数越多，平均等待时间越长。


    ## 以太网帧结构


    发送端网卡将IP数据报(或其他网络层协议分组)封装到以太网帧中：


    ![](img/b7a9324545f24cd4f1f7132598005229_582_0.png)


    前导码(Preamble)(8B):


    - ◆ 7个字节的10101010，第8字节为10101011

    - ◆ 用于发送端与接收端的时钟同步


    ## 以太网帧结构


    - 目的MAC地址、源MAC地址(各6B):

    - 如果网卡的MAC地址与收到的帧的目的MAC地址匹配，或者帧的目的MAC地址为广播地址(FF-FF-FF-FF-FF-FF)，则网卡接收该帧，并将其封装的网络层分组交给相应的网络层协议。

    - 否则，网卡丢弃(不接收)该帧。

    - 类型(Type)(2B): 指示帧中封装的是哪种高层协议的分组(如，IP数据报、Novell IPX数据报、AppleTalk数据报等)

    - 数据(Data)(46-1500B): 指上层协议载荷。

    - R=10Mbps，RTTmax=512μs，Lmin / R = RTTmax

    - Lmin=512bits=64B，Datamin=Lmin-18=46B

    - CRC(4B): 循环冗余校验码

    - 丢弃差错帧


    | preamble | dest. address | source address | type | Data(46-1500B) (payload)
    | CRC |

