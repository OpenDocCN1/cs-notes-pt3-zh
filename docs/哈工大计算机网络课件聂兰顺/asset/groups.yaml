    # 交换机: 多端口间同时传输


    +   - 主机利用独享(dedicated)链路直接连接交换机

    +   - 交换机缓存帧

    +   - 交换机在每段链路上利用 CSMA/CD 收发帧，但无冲突，且可以全双工

    +     - 每段链路一个独立的冲突域

    +   - **交换(switching)：**A-A’ 与 B-B’ 的传输可以同时进行，没有冲突


