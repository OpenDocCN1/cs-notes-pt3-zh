  - '[PAGE 425]


    # 路由算法分类


    # 静态路由 vs 动态路由？


    静态路由：


    +   - 手工配置

    +   - 路由更新慢

    +   - 优先级高


    动态路由：


    +   - 路由更新快

    +     - 定期更新

    +     - 及时响应链路费用或网络拓扑变化


    # 全局信息 vs 分散信息？


    全局信息：


    +   - 所有路由器掌握完整的网络拓扑和链路费用信息

    +   - E.g. 链路状态(LS)路由算法


    分散(decentralized)信息：


    +   - 路由器只掌握物理相连的邻居以及链路费用

    +   - 邻居间信息交换、运算的迭代过程

    +   - E.g. 距离向量(DV)路由算法'
