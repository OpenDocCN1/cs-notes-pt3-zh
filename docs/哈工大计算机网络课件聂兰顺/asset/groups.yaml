    \n## SMTP协议\n\n- 使用持久性连接\n- 要求消息必须由7位ASCII码构成\n- SMTP服务器利用`CRLF.CRLF`确定消息的结束。\n\
    \n与 HTTP 对比：\n\n- HTTP: 拉式(pull)\n- SMTP: 推式(push)\n- 都使用命令/响应交互模式\n- 命令和状态代码都是ASCII码\n\
    - HTTP: 每个对象封装在独立的响应消息中\n- SMTP: 多个对象在由多个部分构成的消息中发送\n\nEmail作为互联网上的古老应用，从出现至今经过了什么样的演变过程？\n\
