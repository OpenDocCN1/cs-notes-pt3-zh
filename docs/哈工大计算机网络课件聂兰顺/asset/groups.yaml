    \n## BitTorrent (2)\n\n### 获取chunk\n\n- 给定任一时刻，不同的节点持有文件的不同chunk集合\n- 节点(Alice)定期查询每个邻居所持有的chunk列表\n\
    - 节点发送请求，请求获取缺失的chunk\n  - 稀缺优先\n\n### 发送chunk: tit-for-tat\n\n- Alice向4个邻居发送chunk:\
    \ 正在向其发送Chunk，速率最快的4个\n  - 每10秒重新评估top 4\n- 每30秒随机选择一个其他节点，向其发送chunk\n  - 新选择节点可能加入top\
    \ 4\n  - \"optimistically unchoke\"\n\n## BitTorrent: Tit-for-tat\n\n- (1) Alice\
    \ \"optimistically unchokes\" Bob\n- (2) Alice becomes one of Bob's top-four providers;\
    \ Bob reciprocates\n- (3) Bob becomes one of Alice's top-four providers\n\n上传速率高，则能够找到更好的交易伙伴，从而更快地获取文件。\n\
    \n## 思考题\n\nBitTorrent技术对网络性能有哪些潜在的危害？\n\n![](img/b7a9324545f24cd4f1f7132598005229_127_0.png)\n\
    \n## 哈尔滨工业大学\n\nHARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\
    \n## 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n## P2P应用：索引技术\n\n## P2P: 搜索信息\n\n- ◆ P2P系统的索引：信息到节点位置(IP地址+端口号)的映射\n\
    - ◆ 文件共享(电驴)\n  - 利用索引动态跟踪节点所共享的文件的位置\n  - 节点需要告诉索引它拥有哪些文件\n  - 节点搜索索引，从而获知能够得到哪些文件\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_131_0.png)\n\n- ◆ 即时消息(QQ)\n  - 索引负责将用户名映射到位置\n\
    \  - 当用户开启IM应用时，需要通知索引它的位置\n  - 节点检索索引，确定用户的IP地址\n\n![](img/b7a9324545f24cd4f1f7132598005229_131_1.png)\n\
    \n## 集中式索引\n\n### Napster最早采用这种设计\n\n- 1) 节点加入时，通知中央服务器：\n  - IP地址\n  - 内容\n-\
    \ 2) Alice查找\"Hey Jude\"\n- 3) Alice从Bob处请求文件\n\n![](img/b7a9324545f24cd4f1f7132598005229_132_0.png)\n\
    \n## 集中式索引的问题\n\n内容和文件传输是分布式的，但是内容定位是高度集中式的\n\n- 单点失效问题\n- 性能瓶颈\n- 版权问题\n\n![](img/b7a9324545f24cd4f1f7132598005229_133_0.png)\n\
    \n## 洪泛式查询: Query flooding\n\n- 完全分布式架构\n- Gnutella采用这种架构\n- 每个节点对它共享的文件进行索引，且只对它共享的文件进行索引\n\
    - 覆盖网络(overlay network): Graph\n- 节点X+Y之间如果有TCP连接，那么构成一个边\n- 所有的活动节点和边构成覆盖网络\n\
    - 边: 虚拟链路\n- 节点一般邻居数少于10个\n\n## 洪泛式查询: Query flooding\n\n- 查询消息通过已有的TCP连接发送\n\
    - 节点转发查询消息\n- 如果查询命中，则利用反向路径发回查询节点\n\n![](img/b7a9324545f24cd4f1f7132598005229_135_0.png)\n\
    \n## 层次式覆盖网络\n\n- 介于集中式索引和洪泛查询之间的方法\n- 每个节点或者是一个超级节点，或者被分配一个超级节点\n  - 节点和超级节点间维持TCP连接\n\
    \  - 某些超级节点对之间维持TCP连接\n- 超级节点负责跟踪子节点的内容\n\n![](img/b7a9324545f24cd4f1f7132598005229_136_0.png)\n\
