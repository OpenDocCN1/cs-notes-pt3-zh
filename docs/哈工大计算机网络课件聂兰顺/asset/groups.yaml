    \  - 不同于IP地址！\n\n## 相邻节点间可靠交付\n\n- 在低误码率的有线链路上很少采用(如光纤，某些双绞线等)\n- 无线链路：误码率高，需要可靠交付\n\
    \n## 链路层服务\n\n## 流量控制(flow control)\n\n- 协调(pacing)相邻的发送结点和接收\n\n## 差错检测(error\
    \ detection)\n\n- 信号衰减和噪声会引起差错。\n- 接收端检测到差错：\n  - 通知发送端重传或者直接丢弃帧\n\n## 差错纠正(error\
    \ correction)\n\n- 接收端直接纠正比特差错\n\n## 全双工和半双工通信控制\n\n- 全双工：链路两端结点同时双向传输\n- 半双工：链路两端结点交替双向传输\n\
    \n## 网卡间通信\n\n![](img/b7a9324545f24cd4f1f7132598005229_512_0.png)\n\n- 发送端：\n\
    \  - 将数据报封装成帧\n  - 增加差错检测比特，实现可靠数据传输和流量控制等。\n\n- 接收端：\n  - 检测差错，实现可靠数据传输和流量控制等\n\
    \  - 提取数据报，交付上层协议实体\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## 差错编码\n\n## 差错检测：差错编码\n\
    \n差错编码基本原理：\nD→DR，其中R为差错检测与纠正比特（冗余比特）\n\n![](img/b7a9324545f24cd4f1f7132598005229_516_0.png)\n\
    \n差错编码不能保证100%可靠！\n\n## 差错编码的检错能力\n\n- 差错编码可分为检错码与纠错码\n\n- 对于检错码，如果编码集的汉明距离 $d_s\
    \ = r + 1$，则该差错编码可以检测 $r$ 位的差错\n\n![](img/b7a9324545f24cd4f1f7132598005229_517_0.png)\n\
    \n- 例如，编码集 {0000, 0101, 1010, 1111} 的汉明距离 $d_s = 2$，可以 100% 检测 1 比特差错\n\n- 对于纠错码，如果编码集的汉明距离\
    \ $d_s = 2r + 1$，则该差错编码可以纠正 $r$ 位的差错\n\n![](img/b7a9324545f24cd4f1f7132598005229_517_1.png)\n\
    \n- 例如，编码集 {000000, 010101, 101010, 111111} 的汉明距离 $d_s = 3$，可以纠正 1 比特差错，如 100010\
    \ 纠正为 101010。\n\n## 奇偶校验码\n\n## 1比特校验位：\n\n- ◆ 检测奇数位差错\n\n![](img/b7a9324545f24cd4f1f7132598005229_518_0.png)\n\
    \n## 二维奇偶校验：\n\n- ◆ 检测奇数位差错、部分偶数位差错\n- ◆ 纠正同一行/列的奇数位错\n\n![](img/b7a9324545f24cd4f1f7132598005229_518_1.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_518_2.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_518_3.png)\n\
    \n## Internet校验和(Checksum)\n\n## 发送端：\n\n- 将“数据”(校验内容)划分为16位的二进制“整数”序列\n\n- 求和(sum)：补码求和(最高位进位的“1”，返回最低位继续加)\n\
    \n- 校验和(Checksum)：sum的反码\n\n- 放入分组(UDP、TCP、IP)的校验和字段\n\n## 接收端：\n\n- 与发送端相同算法计算\n\
    \n- 计算得到的\"checksum\":\n\n- 为16位全0（或sum为16位全1）：无错\n\n- 否则：有错\n\n## 循环冗余校验码(CRC)\n\
    \n- 检错能力更强大的差错编码\n- 将数据比特， D，视为一个二进制数\n- 选择一个 r+1 位的比特模式 (生成比特模式)， G\n- 目标：选择\
    \ r 位的 CRC 比特， R，满足\n  - <D,R> 刚好可以被 G 整除 (模 2)\n  - 接收端检错：利用 G 除 <D,R>，余式全 0，无错；否则，有错！\n\
    \  - 可以检测所有突发长度小于 r+1 位差错。\n- 广泛应用于实际网络 (以太网， 802.11 WiFi， ATM)\n\n## CRC举例\n\n\
    期望：\nD·2ʳ XOR R = nG\n相当于：\nD·2ʳ = nG XOR R\n相当于：\n如果利用G去除D·2ʳ，则\n余式即为R：\nR =\
    \ 余式[ D·2ʳ / G ]\n\n![](img/b7a9324545f24cd4f1f7132598005229_521_0.png)\n\n##\
    \ 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## 多路访问控制(MAC)协议\n\n## 多路访问控制(MAC)协议\n\n\
    两类“链路”：\n\n- ◆ 点对点链路\n  - 拨号接入的PPP\n  - 以太网交换机与主机间的点对点链路\n- ◆ 广播链路 (共享介质)\n  -\
    \ 早期的总线以太网\n  - HFC的上行链路\n  - 802.11无线局域网\n\n![](img/b7a9324545f24cd4f1f7132598005229_525_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_525_1.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_525_2.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_525_3.png)\n\n## 多路访问控制(MAC)协议\n\n\
    - ◆ 单一共享广播信道\n- ◆ 两个或者两个以上节点同时传输：干扰(interference)\n  ■ 冲突(collision)\n  • 节点同时接收到两个或者多个信号→接收失败！\n\
    \n## 多路访问控制协议(multiple access control protocol)\n\n- ◆ 采用分布式算法决定节点如何共享信道，即决策节点何时可以传输数据\n\
    - ◆ 必须基于信道本身，通信信道共享协调信息！\n  ■ 无带外信道用于协调\n\n## 理想MAC协议\n\n给定： 速率为R bps的广播信道\n\n\
    期望：\n\n- 1. 当只有一个结点希望传输数据时，它可以以速率 R发送。\n\n- 2. 当有M个结点期望发送数据时，每个节点平均发送数据的平均速率是R/M\n\
    \n- 3. 完全分散控制：\n  - 无需特定结点协调\n  - 无需时钟、时隙同步\n\n- 4. 简单\n\n## MAC协议分类\n\n三大类：\n\
    \n- 信道划分(channel partitioning)MAC协议\n  - 多路复用技术\n  - TDMA、FDMA、CDMA、WCDMA等\n-\
    \ 随机访问(random access)MAC协议\n  - 信道不划分，允许冲突\n  - 采用冲突“恢复”机制\n- 轮转(“taking turns”)MAC协议\n\
    \  - 结点轮流使用信道\n\n## 信道划分MAC协议: TDMA\n\n## TDMA: time division multiple access\n\
    \n- “周期性”接入信道\n- 每个站点在每个周期, 占用固定长度的时隙(e.g.长度=分组传输时间)\n- 未用时隙空闲(idle)\n- 例如: 6-站点LAN,\
    \ 1,3,4传输分组, 2,5,6空闲\n\n![](img/b7a9324545f24cd4f1f7132598005229_529_0.png)\n\n\
    ## 信道划分MAC协议：FDMA\n\nFDMA: frequency division multiple access\n\n- 信道频谱划分为若干频带(frequency\
    \ bands)\n- 每个站点分配一个固定的频带\n- 无传输频带空闲\n- 例如: 6站点LAN, 1,3,4频带传输数据, 2,5,6频带空闲。\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_530_0.png)\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\
    \n主讲人：李全龙\n\n## 随机访问MAC协议（1）\n"
