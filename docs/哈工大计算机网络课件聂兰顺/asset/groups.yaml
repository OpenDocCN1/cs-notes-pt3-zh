    # HTTP连接的两种类型


    # 非持久性连接(Nonpersistent HTTP)


    +   - 每个TCP连接最多允许传输一个对象

    +   - HTTP 1.0版本使用非持久性连接


    # 持久性连接(Persistent HTTP)


    +   - 每个TCP连接允许传输多个对象

    +   - HTTP 1.1版本默认使用持久性连接


    ![](img/b7a9324545f24cd4f1f7132598005229_39_0.png)'
  - '[PAGE 40]


    # 非持久性连接(1)


    假设用户在浏览器中输入URL

    www.someSchool.edu/someDepartment/home.index


    包含文本和指向10个jpeg图片的链接


    1a. HTTP客户端向地址为 www.someSchool.edu 的服务器上的HTTP服务器进程(端口80) 发起TCP连接请求。


    1b. HTTP服务器在端口80等待TCP连接请求，接受连接并通知客户端。


    2. HTTP客户端将HTTP请求消息(包含URL地址)通过TCP连接的套接字发出，消息中所含的URL表明客户端需要对象 someDepartment/home.index


    3. HTTP服务器收到请求消息，解析，产生包含所需要对象的响应消息，并通过套接字发给客户端。


    时间'
  - '[PAGE 41]


    # 非持久性连接(2)


    +   4. HTTP服务器关闭TCP连接。


    +   5. HTTP客户端收到响应消息，解析html文件，显示html文件，发现有10个指向jpeg对象的超连接。


    +   6. 为每个jpeg对象重复步骤1-5。


    时间'
  - '[PAGE 42]


    # 响应时间分析与建模


    # RTT(Round Trip Time)


    +   从客户端发送一个很小的数据包到服务器并返回所经历的时间


    # 响应时间(Response time)


    +   发起、建立TCP连接：1个RTT


    +   发送HTTP请求消息到HTTP响应消息的前几个字节到达：1个RTT


    +   响应消息中所含的文件/对象传输时间


    +   Total=2RTTs+文件发送时间


    ![](img/b7a9324545f24cd4f1f7132598005229_42_0.png)'
  - '[PAGE 43]


    # 持久性HTTP


    # 非持久性连接的问题


    +   - 每个对象需要2个RTT

    +   - 操作系统需要为每个TCP连接开销资源(overhead)

    +   - 浏览器会怎么做？

    +     - 打开多个并行的TCP连接以获取网页所需对象

    +     - 给服务器端造成什么影响呢？


    # 持久性连接


    +   - 发送响应后，服务器保持TCP连接的打开

    +   - 后续的HTTP消息可以通过这个连接发送


    # 无流水(pipelining)的持久性连接


    +   - 客户端只有收到前一个响应后才发送新的请求

    +   - 每个被引用的对象耗时1个RTT


    # 带有流水机制的持久性连接


    +   - HTTP 1.1的默认选项

    +   - 客户端只要遇到一个引用对象就尽快发出请求

    +   - 理想情况下，收到所有的引用对象只需耗时约1个RTT'
