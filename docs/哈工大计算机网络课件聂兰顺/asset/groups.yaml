  - '[PAGE 279]


    # TCP拥塞控制：总结


    +   When CongWin is below Threshold, sender in slow-start phase, window grows
    exponentially.


    +   When CongWin is above Threshold, sender is in congestion-avoidance phase,
    window grows linearly.


    +   When a triple duplicate ACK occurs, Threshold set to CongWin/2 and CongWin
    set to Threshold.


    +   When timeout occurs, Threshold set to CongWin/2 and CongWin is set to 1 MSS.'
  - '[PAGE 280]


    # TCP拥塞控制


    | State | Event | TCP Sender Action | Commentary |

    |---|---|---|---|

    | Slow Start (SS) | ACK receipt for previously unacked data | CongWin = CongWin
    + MSS, If (CongWin > Threshold) set state to “Congestion Avoidance” | Resulting
    in a doubling of CongWin every RTT |

    | Congestion Avoidance (CA) | ACK receipt for previously unacked data | CongWin
    = CongWin+MSS * (MSS/CongWin) | Additive increase, resulting in increase of CongWin
    by 1 MSS every RTT |

    | SS or CA | Loss event detected by triple duplicate ACK | Threshold = CongWin/2,
    CongWin = Threshold, Set state to “Congestion Avoidance” | Fast recovery, implementing
    multiplicative decrease. CongWin will not drop below 1 MSS. |

    | SS or CA | Timeout | Threshold = CongWin/2, CongWin = 1 MSS, Set state to “Slow
    Start” | Enter slow start |

    | SS or CA | Duplicate ACK | Increment duplicate ACK count for segment being acked
    | CongWin and Threshold not changed |'
  - "[PAGE 281]\n\n# TCP拥塞控制算法\n\n```\nTh = ?\nCongWin = 1 MSS\n/* slow start or exponential\
