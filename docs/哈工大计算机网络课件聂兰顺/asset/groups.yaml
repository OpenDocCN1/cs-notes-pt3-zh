    \n## 可靠数据传输原理\n\n## 什么是可靠？\n\n- 不错、不丢、不乱\n\n## 可靠数据传输协议\n\n- 可靠数据传输对应应用层、传输层、链路层都很重要\n\
    \n- 网络Top-10问题\n\n- 信道的不可靠特性决定了可靠数据传输协议(rdt)的复杂性\n\n![](img/b7a9324545f24cd4f1f7132598005229_170_0.png)\n\
    \n## 可靠数据传输原理\n\n## 什么是可靠？\n\n- 不错、不丢、不乱\n\n## 可靠数据传输协议\n\n- 可靠数据传输对应应用层、传输层、链路层都很重要\n\
    - 网络Top-10问题\n- 信道的不可靠特性决定了可靠数据传输协议(rdt)的复杂性\n\n![](img/b7a9324545f24cd4f1f7132598005229_171_0.png)\n\
    \n## 可靠数据传输协议基本结构:接口\n\nrdt_send(): 被上次应用调用，将数据交给rdt以发送给对方\n\ndeliver_data():\
    \ 被rdt调用，向上层应用交付数据\n\nudt_send(): 被rdt调用，在不可靠信道上向接收方传输数据\n\nrdt_rcv(): 当数据包到达接收方信道时被调用\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_172_0.png)\n\n## 可靠数据传输协议\n\n- 渐进地设计可靠数据传输协议的发送方和接收方\n\
