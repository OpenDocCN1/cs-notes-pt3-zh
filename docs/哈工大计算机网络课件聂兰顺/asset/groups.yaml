  - '[PAGE 282]


    # 例题


    +   一个TCP连接总是以1 KB的最大段长发送TCP段，发送方有足够多的数据要发送。当拥塞窗口为16 KB时发生了超时，如果接下来的4个RTT（往返时间）时间内的TCP段的传输都是成功的，那么当第4个RTT时间内发送的所有TCP段都得到肯定应答时，拥塞窗口大小是多少？


    +   解：threshold=16/2=8 KB，CongWin=1 KB，1个RTT后，CongWin=2 KB，2个RTT后，CongWin=4 KB，3个RTT后，CongWin=8
    KB，Slowstart is over；4个RTT后，CongWin=9 KB'
