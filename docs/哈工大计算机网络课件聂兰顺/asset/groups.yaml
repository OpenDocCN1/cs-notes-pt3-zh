    \n问题：从一个服务器向N个节点分发一个文件需要多长时间？\n\n![](img/b7a9324545f24cd4f1f7132598005229_119_0.png)\n\
    \nu_s: 服务器上传带宽\n\nu_i: 节点i的上传带宽\n\nd_i: 节点i的下载带宽\n\n## 文件分发：客户机/服务器\n\n- 服务器串行地发送N个副本\n\
    \  - 时间： NF/u_s\n- 客户机需要F/d_i时间下载\n\nTime to distribute F to N clients using =\
    \ d_cs = max { NF/u_s, F/min_i(d_i) } client/server approach\n\nincreases linearly\
    \ in N (for large N)\n\n![](img/b7a9324545f24cd4f1f7132598005229_120_0.png)\n\n\
    ## 文件分发：P2P\n\n- 服务器必须发送一个副本\n  - 时间： F/uₛ\n- 客户机需要 F/dᵢ 时间下载\n- 总共需要下载 NF 比特\n\
    - 最快的可能上传速率： uₛ + Σuᵢ\n\n![](img/b7a9324545f24cd4f1f7132598005229_121_0.png)\n\
    \n```\nd_P2P = max { F/u_s, F/min(d_i), NF/(u_s + Σu_i) }\n```\n\n## 客户端/服务器 vs.\
    \ P2P: 例子\n\n客户端上传速率 = u，F/u = 1小时，u_s = 10u，d_min ≥ u_s\n\n![](img/b7a9324545f24cd4f1f7132598005229_122_0.png)\n"
