    # ARP协议：同一局域网内


    +   A想要给同一局域网内的B发送数据报

    +   - B的MAC地址不在 A的 ARP 表中。


    +   A广播ARP查询分组，其中包含B的IP地址

    +   - 目的MAC地址 = FF-FF-FF-FF-FF-FF

    +   - LAN中所有结点都会接收ARP查询


    +   B接收ARP查询分组，IP地址匹配成功，向A应答B的MAC 地址

    +   - 利用单播帧向A发送应答


    +   A在其ARP表中，缓存B的IP-MAC地址对，直至超时

    +   - 超时后，再次刷新


    +   ARP是“即插即用”协议：

    +   - 结点自主创建ARP表，无需干预'
