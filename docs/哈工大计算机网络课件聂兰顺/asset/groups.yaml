    ## 计算机网络之探颐索隐\n\n主讲人：聂兰顺\n\n### TCP可靠数据传输\n\n### TCP RTT和超时\n\n- **问题：** 如何设置定时器的超时时间？\n\
    - **大于RTT**\n  - 但是RTT是变化的\n- **过短：**\n  - 不必要的重传\n- **过长：**\n  - 对段丢失事件反应慢\n\n\
    - **问题：** 如何估计RTT？\n- **SampleRTT：** 测量从段发出去到收到ACK的时间\n  - 忽略重传\n- **SampleRTT变化**\n\
    \  - 测量多个SampleRTT，求平均值，形成RTT的估计值 EstimatedRTT\n\n$EstimatedRTT = (1-\\alpha)*EstimatedRTT\
    \ + \\alpha*SampleRTT$\n\n指数加权移动平均\n典型值：0.125\n\n#### 定时器超时时间的设置：\n\n- EstimatedRTT\
    \ + “安全边界”\n- EstimatedRTT变化大⇒较大的边界\n\n#### 测量RTT的变化值: SampleRTT与EstimatedRTT的差值\n\
    \n```\nDevRTT = (1- β)*DevRTT +\n        β *|SampleRTT-EstimatedRTT|\n\n(typically,\
    \ β = 0.25)\n```\n\n#### 定时器超时时间的设置：\n\n```\nTimeoutInterval = EstimatedRTT +\
    \ 4*DevRTT\n```\n\n### TCP发送方事件\n\n- 从应用层收到数据\n  - 创建Segment\n  - 序列号是Segment第一个字节的编号\n\
    \  - 开启计时器\n  - 设置超时时间：TimeOutInterval\n- 超时\n  - 重传引起超时的Segment\n  - 重启定时器\n\
    - 收到ACK\n  - 如果确认此前未确认的Segment\n    - 更新SendBase\n    - 如果窗口中还有未被确认的分组，重新启动定时器\n\
    \n### TCP发送端程序\n\n```\nNextSeqNum = InitialSeqNum\nSendBase = InitialSeqNum\n\n\
    loop (forever) {\n    switch(event)\n\n    event: data received from application\
    \ above\n        create TCP segment with sequence number NextSeqNum\n        if\
    \ (timer currently not running)\n            start timer\n        pass segment\
    \ to IP\n        NextSeqNum = NextSeqNum + length(data)\n\n    event: timer timeout\n\
    \        retransmit not-yet-acknowledged segment with\n            smallest sequence\
    \ number\n        start timer\n\n    event: ACK received, with ACK field value\
    \ of y\n        if (y > SendBase) {\n            SendBase = y\n            if\
    \ (there are currently not-yet-acknowledged segments)\n                start timer\n\
    \        }\n} /* end of loop forever */\n```\n\n### TCP重传示例\n\nlost ACK scenario\n\
    \npremature timeout\n\nHost A\n\nHost B\n\nSeq=92, 8 bytes data\n\nACK=100\n\n\
    loss\n\nSeq=92, 8 bytes data\n\nACK=100\n\nSendBase = 100\n\nHost A\n\nHost B\n\
    \nSeq=92, 8 bytes data\n\nSeq=100, 20 bytes data\n\nACK=100\n\nACK=120\n\nSendBase\
    \ = 100\n\nSendBase = 120\n\nSeq=92 timeout\n\nHost A\n\nHost B\n\nSeq=92, 8 bytes\
    \ data\n\nACK=100\n\nSeq=100, 20 bytes data\n\nX\nloss\n\nACK=120\n\nSendBase\n\
    = 120\n\ntimeout\n\ntime\n\nCumulative ACK scenario\n\n### TCP ACK生成: RFC 1122,\
    \ RFC 2581\n\n| Event at Receiver | TCP Receiver action |\n| --- | --- |\n| Arrival\
    \ of in-order segment with expected seq #. All data up to expected seq # already\
    \ ACKed | Delayed ACK. Wait up to 500ms for next segment. If no next segment,\
    \ send ACK |\n| Arrival of in-order segment with expected seq #. One other segment\
    \ has ACK pending | Immediately send single cumulative ACK, ACKing both in-order\
    \ segments |\n| Arrival of out-of-order segment higher-than-expect seq. # . Gap\
    \ detected | Immediately send duplicate ACK, indicating seq. # of next expected\
    \ byte |\n| Arrival of segment that partially or completely fills gap | Immediate\
    \ send ACK, provided that segment starts at lower end of gap |\n\n### 快速重传机制\n\
    \n- TCP的实现中，如果发生超时，超时时间间隔将重新设置，即将超时时间间隔加倍，导致其很大\n  - 重发丢失的分组之前要等待很长时间\n- 通过重复ACK检测分组丢失\n\
    \  - Sender会背靠背地发送多个分组\n  - 如果某个分组丢失，可能会引发多个重复的ACK\n- 如果sender收到对同一数据的3个ACK，则假定该数据之后的段已经丢失\n\
    \  - 快速重传：在定时器超时之前即进行重传\n"
