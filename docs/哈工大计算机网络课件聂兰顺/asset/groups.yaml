    # SMTP协议


    +   - 使用持久性连接

    +   - 要求消息必须由7位ASCII码构成

    +   - SMTP服务器利用CRLF.CRLF确定消息的结束。


    +   与HTTP对比:

    +   - HTTP: 拉式(pull)

    +   - SMTP: 退式(push)

    +   - 都使用命令/响应交互模式

    +   - 命令和状态代码都是ASCII码

    +   - HTTP: 每个对象封装在独立的响应消息中

    +   - SMTP: 多个对象在由多个部分构成的消息中发送'
