    # Dijkstra 算法:讨论


    算法复杂性: n个结点


    +   每次迭代: 需要检测所有不在集合N''中的结点w


    +   n(n+1)/2次比较: O(n²)


    +   更高效的实现: O(nlogn)


    存在震荡(oscillations)可能:


