  - '[PAGE 343]


    # IP分片与重组


    +   - 对IP分组向较小MTU链路转发时，可以被“分片”（fragmented）

    +     - 1个IP分组分为多片IP分组

    +     - IP分片到达目的主机后进行“重组”（reassembled）


    +   - IP首部的相关字段用于标识分片以及确定分片的相对顺序

    +     - 总长度、标识、标志位和片偏移


    ![](img/b7a9324545f24cd4f1f7132598005229_343_0.png)'
