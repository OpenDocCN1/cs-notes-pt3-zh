  - '[PAGE 631]


    # 802.11：多路访问控制


    +   避免冲突: 2+结点同时传输


    +   802.11: CSMA – 发送数据前监听信道

    +   - 避免与正在进行传输的其他结点冲突


    +   802.11: 不能像CSMA/CD那样，边发送、边检测冲突！

    +   - 无线信道很难实现

    +   - 无法侦听到所有可能的冲突：隐藏站、信号衰落

    +   - 目标: 避免冲突(avoid collisions)-CSMA/C(ollision)A(voidance)


    ![](img/b7a9324545f24cd4f1f7132598005229_631_0.png)


    ![](img/b7a9324545f24cd4f1f7132598005229_631_1.png)'
  - '[PAGE 632]


    # IEEE 802.11 MAC协议: CSMA/CA


    # 802.11 sender


    +   1 if 监听到信道空闲了 DIFS 时间 then

    +   发送整个帧(无同时检测冲突，即 CD)


    +   2 if 监听到信道忙 then

    +   开始随机退避计时

    +   当信道空闲时，计时器倒计时

    +   当计时器超时时，发送帧

    +   if 没有收到 ACK then

    +   增加随机退避间隔时间

    +   重复第2步


    # 802.11 receiver


    +   - if 正确接收帧

    +   延迟 SIFS 时间后，向发送端发送 ACK

    +   (由于存在隐藏站问题)


    ![](img/b7a9324545f24cd4f1f7132598005229_632_0.png)'
  - '[PAGE 633]


    # IEEE 802.11 MAC协议: CSMA/CA


    基本思想：允许发送端“预约”(reserve)信道，而不是随机发送数据帧，从而避免长数据帧的冲突


    +   - 发送端首先利用CSMA向BS发送一个很短的RTS (request-to-send)帧

    +     - RTS帧仍然彼此冲突 (但RTS帧很短)

    +   - BS广播一个CTS(clear-to-send)帧作为对RTS的响应

    +   - CTS帧可以被所有节点接收

    +     - 消除隐藏站影响

    +     - 发送端可以发送数据帧

    +     - 其他节点推迟发送


    利用很小的预约帧彻底避免了数据帧冲突！'
  - '[PAGE 634]


    # 冲突避免(CA): RTS-CTS交换


    ![](img/b7a9324545f24cd4f1f7132598005229_634_0.png)'
  - '[PAGE 635]


    # IEEE 802.11 MAC帧


    字节 2 2 6 6 6 2 6 0 - 2312 4

    frame control duration address 1 address 2 address 3 seq control address 4 payload
    CRC

    预留传输上时间 (RTS/CTS)

    帧序号 (for RDT)


    位 2 2 4 1 1 1 1 1 1 1 1

    Protocol version Type Subtype To AP From AP More frag Retry Power mgt More data
    WEP Rsvd

    帧类型 (RTS, CTS, ACK, data)'
  - '[PAGE 636]


    # IEEE 802.11数据帧地址


    +   - 802.11数据帧有4个地址字段

    +   - 地址 4 用于自组网络

    +   - 地址 1~地址 3:


    | 去往 AP (To AP) | 来自 AP (From AP) | 地址 1 | 地址 2 | 地址 3 |

    |---|---|---|---|---|

    | 0 | 1 | 目的地址 | AP 地址 | 源地址 |

    | 1 | 0 | AP地址 | 源地址 | 目的地址 |'
