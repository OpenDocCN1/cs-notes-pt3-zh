  - '[PAGE 8]


    # 网络应用的体系结构


    +   ◆ 客户机/服务器结构(Client-Server, C/S)

    +   ◆ 点对点结构(Peer-to-peer, P2P)

    +   ◆ 混合结构(Hybrid)


    ![](img/b7a9324545f24cd4f1f7132598005229_8_0.png)'
  - '[PAGE 9]


    # 客户机/服务器结构


    # 服务器


    +   - 7*24小时提供服务

    +   - 永久性访问地址/域名

    +   - 利用大量服务器实现可扩展性


    # 客户机


    +   - 与服务器通信，使用服务器提供的服务

    +   - 间歇性接入网络

    +   - 可能使用动态IP地址

    +   - 不会与其他客户机直接通信


    ![](img/b7a9324545f24cd4f1f7132598005229_9_0.png)'
  - '[PAGE 10]


    <!-- no content -->'
  - '[PAGE 11]


    # 纯P2P结构


    +   - 没有永远在线的服务器

    +   - 任意端系统/节点之间可以直接通讯

    +   - 节点间歇性接入网络

    +   - 节点可能改变IP地址

    +   - 优点：高度可伸缩

    +   - 缺点：难于管理


    ![](img/b7a9324545f24cd4f1f7132598005229_11_0.png)'
  - '[PAGE 12]


    <!-- no content -->'
  - '[PAGE 13]


    # 思考题


    +   - 为每种体系结构找出5种以上的网络应用

    +   - 从多个方面/角度对比三种体系结构的优缺点'
