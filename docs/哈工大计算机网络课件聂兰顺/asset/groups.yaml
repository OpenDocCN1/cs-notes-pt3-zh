  md: "\n# Bellman-Ford 举例\n\n![](img/b7a9324545f24cd4f1f7132598005229_440_0.png)\n\
    \n显然： dᵥ(z) = 5, dₓ(z) = 3, d_w(z) = 3\n\n根据B-F方程：\n\ndᵤ(z) = min { c(u,v) + dᵥ(z),\n\
    \ c(u,x) + dₓ(z),\n c(u,w) + d_w(z) }\n= min {2 + 5,\n 1 + 3,\n 5 + 3} = 4\n\n\
    重点：节点获得最短路径的下一跳，该信息用于转发中！\n\n# 距离向量路由算法\n\nD_x(y) = 从结点x到结点y的最小费用估计\n\nx维护距离向量(DV):\
    \ D_x = [D_x(y): y ∈ N ]\n\n结点x:\n\n已知到达每个邻居的费用: c(x,v)\n\n维护其所有邻居的距离向量: D_v =\
    \ [D_v(y): y ∈ N ]\n\n核心思想:\n\n每个结点不定时地将其自身的DV估计发送给其邻居\n\n当x接收到邻居的新的DV估计时，即依据B-F更新其自身的距离向量估计：\n\
    \nD_x(y) = min_v{c(x,v)+D_v(y)} for each node y ∈ N\n\nD_x(y)将最终收敛于实际的最小费用 d_x(y)\n\
    \n# 距离向量路由算法\n\n# 异步迭代：\n\n+   - 触发每次局部迭代的因素\n+     - 局部链路费用改变\n+     - 来自邻居的DV更新\n\
    \n# 分布式：\n\n+   - 每个节点只当DV变化时才通告给邻居\n+     - 邻居在必要时（其DV更新后发生改变）再通告它们的邻居\n\n# 每个节点：\n\
    \n等待（本地局部链路费用变化或者收到邻居的DV更新）\n\n重新计算 DV估计\n\n如果DV中到达任一目的距离发生改变，通告所有邻居\n\n# 谢谢！\n\
