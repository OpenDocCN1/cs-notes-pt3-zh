    # TCP ACK生成: RFC 1122, RFC 2581


    | Event at Receiver | TCP Receiver action |

    | --- | --- |

    | Arrival of in-order segment with expected seq #. All data up to expected seq
    # already ACKed | Delayed ACK. Wait up to 500ms for next segment. If no next segment,
    send ACK |

    | Arrival of in-order segment with expected seq #. One other segment has ACK pending
    | Immediately send single cumulative ACK, ACKing both in-order segments |

    | Arrival of out-of-order segment higher-than-expect seq. # . Gap detected | Immediately
    send duplicate ACK, indicating seq. # of next expected byte |

    | Arrival of segment that partially or completely fills gap | Immediate send ACK,
    provided that segment starts at lower end of gap |'
  - '[PAGE 241]


    # 快速重传机制


    +   TCP的实现中，如果发生超时，超时时间间隔将重新设置，即将超时时间间隔加倍，导致其很大

    +   - 重发丢失的分组之前要等待很长时间


    +   通过重复ACK检测分组丢失

    +   - Sender会背靠背地发送多个分组

    +   - 如果某个分组丢失，可能会引发多个重复的ACK


    +   如果sender收到对同一数据的3个ACK，则假定该数据之后的段已经丢失

    +   - 快速重传：在定时器超时之前即进行重传'
  md: "\n## 计算机网络之探颐索隐\n\n主讲人：聂兰顺\n\n### TCP概述\n\nTCP概述: RFCs-793, 1122, 1323, 2018,\
