    # 滑动窗口协议


    ![](img/b7a9324545f24cd4f1f7132598005229_206_0.png)


    +   ❖ 滑动窗口协议: Sliding-window protocol

    +   ❖ 窗口

    +     - 允许使用的序列号范围

    +     - 窗口尺寸为N: 最多有N个等待确认的消息

    +   ❖ 滑动窗口

    +     - 随着协议的运行，窗口在序列号空间内向前滑动

    +   ❖ 滑动窗口协议： GBN, SR'
