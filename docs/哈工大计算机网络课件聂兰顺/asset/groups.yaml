    |---|---|---|

    | 0 | 0 | 回声应答 (ping) |

    | 3 | 0 | 目的网络不可达 |

    | 3 | 1 | 目的主机不可达 |

    | 3 | 2 | 目的协议不可达 |

    | 3 | 3 | 目的端口不可达 |

    | 3 | 6 | 目的网络未知 |

    | 3 | 7 | 目的主机未知 |

    | 4 | 0 | 源抑制(拥塞控制-未用) |

    | 8 | 0 | 回声请求(ping) |

    | 9 | 0 | 路由通告 |

    | 10 | 0 | 路由发现 |

    | 11 | 0 | TTL超时 |

    | 12 | 0 | IP首部错误 |'
