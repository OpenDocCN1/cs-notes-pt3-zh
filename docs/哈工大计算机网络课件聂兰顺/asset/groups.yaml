    +   - 转发(forwarding): 将分组从路由器的输入端口转移到合适的输出端口

    +   - 路由(routing): 确定分组从源到目的经过的路径

    +   - 路由算法（routing algorithms）


    路由算法 (routing algorithm)


    | 转发表 |  |

    |---|---|

    | 地址 | 输出链路 |

    | 0100 | 3 |

    | 0101 | 2 |

    | 0111 | 2 |

    | 1001 | 1 |


    路由算法(协议)确定通过网络的端到端路径


    转发表确定在本路由器如何转发分组


    地址


    ![](img/b7a9324545f24cd4f1f7132598005229_300_0.png)


    # 网络层核心功能-连接建立


    某些网络的重要功能：


    +   - ATM, 帧中继, X.25


    数据分组传输之前两端主机需要首先建立虚拟/逻辑连接


    +   - 网络设备（如路由器）参与连接的建立


    网络层连接与传输层连接的对比：


    +   - 网络层连接: 两个主机之间(路径上的路由器等网络设备参与其中)


    +   - 传输层连接: 两个应用进程之间（对中间网络设备透明）


    ![](img/b7a9324545f24cd4f1f7132598005229_301_0.png)


    # 网络层服务模型


    Q: 网络层为发送端（主机）到接收端（主机）的数据报传送 “通道(channel)” 提供什么样的服务模型(service model)?


    | Network Architecture | Service Model | Bandwidth | Loss | Order | Timing | Congestion
    feedback |

    |---|---|---|---|---|---|---|

    | Internet | best effort | none | no | no | no | no (inferred via loss) |

    | ATM | CBR | constant rate | yes | yes | yes | no congestion |

    | ATM | VBR | guaranteed rate | yes | yes | yes | no congestion |

    | ATM | ABR | guaranteed minimum | no | yes | no | yes |

    | ATM | UBR | none | no | yes | no | no |


    # 网络层服务模型


    +   无连接服务(connection-less service):

    +   - 不事先为系列分组的传输确定传输路径

    +   - 每个分组独立确定传输路径

    +   - 不同分组可能传输路径不同

    +   - 数据报网络(datagram network )


    +   连接服务(connection service):

    +   - 首先为系列分组的传输确定从源到目的经过的路径（建立连接）

    +   - 然后沿该路径（连接）传输系列分组

    +   - 系列分组传输路径相同

    +   - 传输结束后拆除连接

    +   - 虚电路网络(virtual-circuit network )


    # 谢谢！


    # 计算机网络之探颐索隐


    主讲人：李全龙


    # 虚电路网络


    # 连接服务与无连接服务


    +   - 数据报(datagram)网络与虚电路(virtual-circuit)网络是典型两类分组交换网络

    +   - 数据报网络提供网络层无连接服务

    +   - 虚电路网络提供网络层连接服务

    +   - 类似于传输层的无连接服务（UDP）和面向连接服务（TCP），但是网络层服务：

    +   - 主机到主机服务

    +   - 网络核心实现


    # 虚电路 (Virtual circuits)


    **虚电路**：一条从源主机到目的主机，**类似于电路**的路径（逻辑连接）


    +   - 分组交换

    +   - 每个分组的传输利用链路的全部带宽

    +   - 源到目的路径经过的网络层设备共同完成虚电路功能


    ![](img/b7a9324545f24cd4f1f7132598005229_308_0.png)


    # 虚电路(Virtual circuits)


    +   通信过程：

    +   - 呼叫建立(call setup)→数据传输→拆除呼叫


    每个分组携带虚电路标识(VC ID)，而不是目的主机地址


    虚电路经过的每个网络设备（如路由器），维护每条经过它的虚电路连接状态


    +   链路、网络设备资源(如带宽、缓存等)可以面向VC进行预分配

    +   - 预分配资源=可预期服务性能

    +   - 如ATM的电路仿真（CBR）


    ![](img/b7a9324545f24cd4f1f7132598005229_309_0.png)

