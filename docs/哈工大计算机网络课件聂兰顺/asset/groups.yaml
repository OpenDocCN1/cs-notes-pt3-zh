    # 多路访问控制(MAC)协议


    两类“链路”：


    +   ◆ 点对点链路

    +     - 拨号接入的PPP

    +     - 以太网交换机与主机间的点对点链路

    +   ◆ 广播链路 (共享介质)

    +     - 早期的总线以太网

    +     - HFC的上行链路

    +     - 802.11无线局域网


    ![](img/b7a9324545f24cd4f1f7132598005229_525_0.png)


    ![](img/b7a9324545f24cd4f1f7132598005229_525_1.png)


    ![](img/b7a9324545f24cd4f1f7132598005229_525_2.png)


    ![](img/b7a9324545f24cd4f1f7132598005229_525_3.png)'
  - '[PAGE 526]


    # 多路访问控制(MAC)协议


    +   ◆ 单一共享广播信道

    +   ◆ 两个或者两个以上节点同时传输：干扰(interference)

    +     ■ 冲突(collision)

    +     • 节点同时接收到两个或者多个信号→接收失败！


    # 多路访问控制协议(multiple access control protocol)


    +   ◆ 采用分布式算法决定节点如何共享信道，即决策节点何时可以传输数据

    +   ◆ 必须基于信道本身，通信信道共享协调信息！

    +     ■ 无带外信道用于协调'
  - '[PAGE 527]


    # 理想MAC协议


    给定： 速率为R bps的广播信道


    期望：


    +   1. 当只有一个结点希望传输数据时，它可以以速率 R发送。


    +   2. 当有M个结点期望发送数据时，每个节点平均发送数据的平均速率是R/M


    +   3. 完全分散控制：

    +     - 无需特定结点协调

    +     - 无需时钟、时隙同步


    +   4. 简单'
  - '[PAGE 528]


    # MAC协议分类


    三大类：


    +   - 信道划分(channel partitioning)MAC协议

    +     - 多路复用技术

    +     - TDMA、FDMA、CDMA、WCDMA等

    +   - 随机访问(random access)MAC协议

    +     - 信道不划分，允许冲突

    +     - 采用冲突“恢复”机制

    +   - 轮转(“taking turns”)MAC协议

    +     - 结点轮流使用信道'
  - '[PAGE 529]


    # 信道划分MAC协议: TDMA


    # TDMA: time division multiple access


    +   - “周期性”接入信道

    +   - 每个站点在每个周期, 占用固定长度的时隙(e.g.长度=分组传输时间)

    +   - 未用时隙空闲(idle)

    +   - 例如: 6-站点LAN, 1,3,4传输分组, 2,5,6空闲


    ![](img/b7a9324545f24cd4f1f7132598005229_529_0.png)'
  - '[PAGE 530]


    # 信道划分MAC协议：FDMA


    FDMA: frequency division multiple access


    +   - 信道频谱划分为若干频带(frequency bands)

    +   - 每个站点分配一个固定的频带

    +   - 无传输频带空闲

    +   - 例如: 6站点LAN, 1,3,4频带传输数据, 2,5,6频带空闲。


    ![](img/b7a9324545f24cd4f1f7132598005229_530_0.png)'
