    # UDP: User Datagram Protocol [RFC 768]


    +   基于Internet3P协议

    +   - 复用/分用

    +   - 简单的错误校验

    +   “Best effort”服务，UDP段可能

    +   - 丢失

    +   - 非按序到达

    +   无连接

    +   - UDP发送方和接收方之间不需要握手

    +   - 每个UDP段的处理独立于其他段


    +   UDP为什么存在？

    +   - 无需建立连接(减少延迟)

    +   - 实现简单：无需维护连接状态

    +   - 头部开销少

    +   - 没有拥塞控制：应用可更好地控制发送时间和速率'
