    \n## 计算机网络之探颐索隐\n\n主讲人：聂兰顺\n\n## 传输层\n\n## 传输层？\n\n理解传输层服务的基本理论和基本机制\n\n- 复用/分用\n\
    - 可靠数据传输机制\n- 流量控制机制\n- 拥塞控制机制\n\n掌握Internet的传输层协议\n\n- UDP：无连接传输服务\n- TCP：面向连接的传输服务\n\
    - TCP拥塞控制\n\n![](img/b7a9324545f24cd4f1f7132598005229_142_0.png)\n\n## 哈尔滨工业大学\n\
    HARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\
    \n主讲人：聂兰顺\n\n## 传输层服务和协议\n\n传输层协议为运行在不同Host上的进程提供了一种逻辑通信机制\n\n端系统运行传输层协议\n\n-\
    \ 发送方：将应用递交的消息分成一个或多个的Segment，并向下传给网络层。\n- 接收方：将接收到的segment组装成消息，并向上交给应用层。\n\n\
    传输层可以为应用提供多种协议\n\n- Internet上的TCP\n- Internet上的UDP\n\n![](img/b7a9324545f24cd4f1f7132598005229_146_0.png)\n\
    \n## 传输层 vs. 网络层\n\n网络层：提供主机之间的逻辑通信机制\n\n传输层：提供应用进程之间的逻辑通信机制\n\n- 位于网络层之上\n- 依赖于网络层服务\n\
    - 对网络层服务进行（可能的）增强\n\n家庭类比:\n\n12个孩子给12个孩子发信\n\n- 应用进程 = 孩子\n- 应用消息 = 信封里的信\n-\
    \ 主机 = 房子\n- 传输层协议 = 李雷和韩梅梅\n- 网络层协议 = 邮政服务\n\n![](img/b7a9324545f24cd4f1f7132598005229_147_0.png)\n\
    \n## 哈尔滨工业大学\n\nHARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\
    \n## 计算机网络之探赜索隐\n\n## 多路复用和多路分用\n\n## 多路复用/分用\n\n**Why?**\n\n如果某层的一个协议对应直接上层的多个协议实体，则需要复用/分用\n\
    \n**接收端进行多路分用：**\n\n传输层依据头部信息将收到的 Segment 交给正确的 Socket，即不同的进程\n\n**发送端进行多路复用：**\n\
    \n从多个 Socket 接收数据，为每块数据封装上头部信息，生成 Segment，交给网络层\n\n![](img/b7a9324545f24cd4f1f7132598005229_152_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_152_1.png)\n"
