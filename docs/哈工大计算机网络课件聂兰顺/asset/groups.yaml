    # Rdt 2.0: FSM规约


    sender


    receiver


    停一等协议


    rdt_send(data)

    sndpkt = make_pkt(data, checksum)

    udt_send(sndpkt)


    Wait for call from above


    Wait for ACK or NAK


    rdt_rcv(rcvpkt) && isNAK(rcvpkt)

    udt_send(sndpkt)


    rdt_rcv(rcvpkt) && isACK(rcvpkt)


    rdt_rcv(rcvpkt) && corrupt(rcvpkt)

    udt_send(NAK)


    Wait for call from below


    rdt_rcv(rcvpkt) && notcorrupt(rcvpkt)

    extract(rcvpkt,data)

    deliver_data(data)

    udt_send(ACK)'
