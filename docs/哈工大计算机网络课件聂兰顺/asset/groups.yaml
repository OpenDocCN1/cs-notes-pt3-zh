  mdcn: "\n## VC的具体实现\n\n每条虚电路包括：\n\n1. 从源主机到目的主机的一条路径\n2. 虚电路号（VCID），沿路每段链路一个编号\n\
    3. 沿路每个网络层设备（如路由器），利用转发表记录经过的每条虚电路\n\n- 沿某条虚电路传输的分组，携带对应虚电路的VCID，而不是目的地址\n- 同一条VC，在每段链路上的VCID通常不同\n\
    - 路由器转发分组时依据转发表改写/替换虚电路号\n\n## VC转发表\n\n路由器R1的VC转发表：\n\n| 输入接口 | 输入VC # | 输出接口\
    \ | 输出VC # |\n|---|---|---|---|\n| 1 | 12 | 3 | 22 |\n| 2 | 63 | 1 | 18 |\n| 3\
    \ | 7 | 2 | 17 |\n| 1 | 97 | 3 | 87 |\n| ... | ... | ... | ... |\n\nVC路径上每个路由器都需要维护VC连接的状态信息！\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_311_0.png)\n\n## 哈尔滨工业大学\nHARBIN INSTITUTE\
    \ OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\n## 计算机网络之**探赜索隐**\n\n主讲人：李全龙\n\
    \n## 数据报网络\n\n- 网络层无连接\n- 每个分组携带目的地址\n- 路由器根据分组的目的地址转发分组\n  - 基于路由协议/算法构建转发表\n\
    \  - 检索转发表\n  - 每个分组独立选路\n\n1. 发送数据报\n2. 接收数据报\n\n![](img/b7a9324545f24cd4f1f7132598005229_316_0.png)\n\
    \n## 数据报转发表\n\n路由算法（routing algorithm）\n\n路由算法（协议）确定通过网络的端到端路径。\n\n转发表确定在本路由器如何转发分组。\n\
    \n| 地址 | 输出链路 |\n|---|---|\n| 0100 | 3 |\n| 0101 | 2 |\n| 0111 | 2 |\n| 1001 |\
    \ 1 |\n\n地址 0111\n\n## 数据报转发表\n\n| 目的地地址 | 输出链路 |\n|---|---|\n| 地址1 | 3 |\n| 地址2\
    \ | 2 |\n| 地址3 | 2 |\n| 地址4 | 1 |\n\n路由算法\n\n转发表\n\n40多亿IP地址\n\nIP地址\n\n![](img/b7a9324545f24cd4f1f7132598005229_318_0.png)\n\
    \n## 数据报转发表\n\n路由算法\n\n转发表\n\n| 目的地址 | 输出链路 |\n|---|---|\n| 地址范围 1 | 3 |\n| 地址范围\
    \ 2 | 2 |\n| 地址范围 3 | 2 |\n| 地址范围 4 | 1 |\n\n列表地址范围（聚合转发表入口）\n\nIP地址\n\n## 数据报转发表\n\
    \n| 目的地址范围 | 链路接口 |\n| --- | --- |\n| 11001000 00010111 00010000 00000000<br>至<br>11001000\
    \ 00010111 00010111 11111111 | 0 |\n| 11001000 00010111 00011000 00000000<br>至<br>11001000\
    \ 00010111 00011011 11111111 | 1 |\n| 11001000 00010111 00011100 00000000<br>至<br>11001000\
    \ 00010111 00011111 11111111 | 2 |\n| 其他 | 3 |\n\n## 数据报转发表\n\n11001000 00010111\
    \ 00010000 00000000\n至\n11001000 00010111 00010111 11111111\n\n11001000 00010111\
    \ 00011000 00000000\n至\n11001000 00010111 00011011 11111111\n\n其他\n\n11001000\
    \ 00010111 00011100 00000000\n至\n11001000 00010111 00011111 11111111\n\nQ: 如果地址范围划分的不是这么“完美”会怎么样？\n\
    \n## 最长前缀匹配优先\n\n例如：\n\n| 目的地地址范围 | 链路接口 |\n|---|---|\n| 11001000 00010111 00010***\
    \ ********* | 0 |\n| 11001000 00010111 00011000 ********* | 1 |\n| 11001000 00010111\
    \ 00011*** ********* | 2 |\n| 其他 | 3 |\n\nDA: 11001000 00010111 00010110 10100001\
    \ 从哪个接口转发？ A:0\n\nDA: 11001000 00010111 00011000 10101010 从哪个接口转发？ A:1\n\n## 最长前缀匹配优先\n\
    \n在检索转发表时，优先选择与分组目的地址匹配前缀最长的入口（entry）。\n\n## 数据报网络 or VC网络？\n\n### Internet（数据报网络）\n\
    \n- 计算机之间的数据交换\n  - “弹性”服务，没有严格时间需求\n- 链路类型众多\n  - 特点、性能各异\n  - 统一服务困难\n- “智能”端系统（计算机）\n\
    \  - 可以自适应、性能控制、差错恢复\n\n简化网络，复杂“边缘”\n\n### ATM（VC网络）\n\n- 电话网络演化而来\n- 核心业务是实时对话：\n\
    \  - 严格的时间、可靠性需求\n  - 需要有保障的服务\n- “哑（dumb）”端系统（非智能）\n  - 电话机\n  - 传真机\n\n简化“边缘”，复杂网络\n\
    \n## 谢谢！\n\n## 计算机网络之**探赜索隐**\n\n主讲人：李全龙\n\n## Internet网络层\n\n主机、路由器网络层主要功能：\n\
    \n传输层: TCP, UDP\n\n- 路由协议\n  - 路径选择\n  - RIP, OSPF, BGP\n- 转发表（路由表）\n- IP协议\n\
    \  - 寻址规约(conventions)\n  - 数据报(分组)格式\n  - 分组处理规约\n- ICMP协议\n  - 差错报告\n  - 路由器“信令”\n\
    \n网络层\n\n链路层\n\n物理层\n\n## IP数据报（分组）格式\n\nIP数据报\n\n首部\n数据（e.g. TCP、UDP段）\n\n| 位\
