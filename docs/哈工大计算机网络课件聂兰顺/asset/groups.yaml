  - '[PAGE 185]


    # Rdt 2.0有什么缺陷？


    +   如果ACK/NAK消息发生错误/被破坏(corrupted)会怎么样？

    +   > 为ACK/NAK增加校验和，检错并纠错

    +   > 发送方收到被破坏ACK/NAK时不知道接收方发生了什么，添加额外的控制消息

    +   > 如果ACK/NAK坏掉，发送方重传

    +   > 不能简单的重传：产生重复分组


    +   如何解决重复分组问题？

    +   - 序列号(Sequence number): 发送方给每个分组增加序列号

    +   - 接收方丢弃重复分组


    stop and wait

    Sender sends one packet, then waits for receiver response'
