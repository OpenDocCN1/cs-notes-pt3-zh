  md: "\n## IP地址(Addresses)\n\n“有类”编址：\n\n![](img/b7a9324545f24cd4f1f7132598005229_372_0.png)\n\
    \n| 地址类 | 占比 | 位结构 | 前缀 | 地址范围 |\n|---|---|---|---|---|\n| A类 | 50% | NetID(8位)\
    \ HostID(24位) | 0 | 0.0.0.0~127.255.255.255 |\n| B类 | 25% | NetID(16位) HostID(16位)\
    \ | 10 | 128.0.0.0~191.255.255.255 |\n| C类 | 12.5% | NetID(24位) HostID(8位) | 110\
    \ | 192.0.0.0~223.255.255.255 |\n| D类 | 6.25% | 32位 | 1110 | 224.0.0.0~239.255.255.255\
    \ |\n| E类 | 6.25% | 32位 | 1111 | 240.0.0.0~255.255.255.255 |\n\n## 子网划分(Subnetting)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_373_0.png)\n\n如何区分一个IP子网？更小范围网络（子网）？\n\
    \n- 子网划分\n\nIP地址：\n\n- 网络号(NetID) – 高位比特\n- 子网号(SubID) – 原网络主机号部分比特\n- 主机号(HostID)\
    \ – 低位比特\n\n![](img/b7a9324545f24cd4f1f7132598005229_374_0.png)\n![](img/b7a9324545f24cd4f1f7132598005229_374_1.png)\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_375_0.png)\n\n如何确定是否划分了子网？利用多少位划分子网？\n\
    \n- 子网掩码\n\n## 子网掩码\n\n- 形如IP地址：\n  - 32位\n  - 点分十进制形式\n- 取值：\n  - NetID、SubID位全取1\n\
    \  - HostID位全取0\n- 例如：\n  - A网的默认子网掩码为：255.0.0.0\n  - B网的默认子网掩码为：255.255.0.0\n\
    \  - C网的默认子网掩码为：255.255.255.0\n  - 借用3比特划分子网的B网的子网掩码为：255.255.224.0\n\n![](img/b7a9324545f24cd4f1f7132598005229_376_0.png)\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_376_1.png)\n\n## 子网划分\n\n例如：\n\n子网201.2.3.0，255.255.255.0，划分为等长的4个子网：\n\
    \n| 子网地址 | 子网掩码 |\n|---|---|\n| 201.2.3.0 | 255.255.255.192 |\n| 201.2.3.64 |\
    \ 255.255.255.192 |\n| 201.2.3.128 | 255.255.255.192 |\n| 201.2.3.192 | 255.255.255.192\
    \ |\n\n![](img/b7a9324545f24cd4f1f7132598005229_377_0.png)\n\n路由器如何确定应该将IP分组转发到哪个子网？\n\
    \n## 一个C类网络划分子网举例\n\n| 子网 | SubID（二进制） | HostID取值范围（二进制） | 第4个八位组取值范围（十进制） |\n\
    |---|---|---|---|\n| 1# | 000 | 00000 thru 11111 | .0 thru .31 |\n| 2# | 001 |\
    \ 00000 thru 11111 | .32 thru .63 |\n| 3# | 010 | 00000 thru 11111 | .64 thru\
    \ .95 |\n| 4# | 011 | 00000 thru 11111 | .96 thru .127 |\n| 5# | 100 | 00000 thru\
    \ 11111 | .128 thru .159 |\n| 6# | 101 | 00000 thru 11111 | .160 thru .191 |\n\
    | 7# | 110 | 00000 thru 11111 | .192 thru .223 |\n| 8# | 111 | 00000 thru 11111\
    \ | .224 thru .255 |\n\n## 谢谢！\n\n## 计算机网络之探赜索隐\n\n主讲人：李全龙\n\n## 本讲主题\n\n### IP协议（6）-CIDR与路由聚合\n\
    \n## CIDR\n\n无类域间路由(CIDR: Classless InterDomain Routing)\n\n- 消除传统的 A 类、B 类和 C\
    \ 类地址界限\n  - NetID+SubID → Network Prefix (Prefix)可以任意长度\n- 融合子网地址与子网掩码，方便子网划分\n\
    \  - 无类地址格式: a.b.c.d/x，其中x为前缀长度\n- 例如\n\n```\nPrefix                        HostID\n\
    11001000 00010111 00010000 00000000\n200.23.16.0/23\n```\n\n- 子网201.2.3.64, 255.255.255.192\
    \ → 201.2.3.64/26\n\n## CIDR与路由聚合\n\n无类域间路由(CIDR: Classless InterDomain Routing)\n\
    \n- 提高IPv4 地址空间分配效率\n- 提高路由效率\n  - 将多个子网聚合为一个较大的子网\n  - 构造超网（supernetting）\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_385_0.png)\n\n- 路由聚合（route aggregation）\n\
    \n## 路由聚合\n\n![](img/b7a9324545f24cd4f1f7132598005229_386_0.png)\n\n转发表：\n\n|\
    \ 目的网络 | 接口 |\n|---|---|\n| 223.1.0.0/23 | 2 |\n| 223.1.2.0/24 | 2 |\n| 223.1.3.0/24\
    \ | 2 |\n| Internet | 1 |\n\n转发表：\n\n| 目的网络 | 接口 |\n|---|---|\n| 223.1.0.0/22\
    \ | 2 |\n| Internet | 1 |\n\n![](img/b7a9324545f24cd4f1f7132598005229_387_0.png)\n\
    \n层级编址使得路由信息通告更高效：\n\n- 组织0：200.23.16.0/23\n- 组织1：200.23.18.0/23\n- 组织2：200.23.20.0/23\n\
    - ...\n- 组织7：200.23.30.0/23\n\n![](img/b7a9324545f24cd4f1f7132598005229_388_0.png)\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_388_1.png)\n![](img/b7a9324545f24cd4f1f7132598005229_388_2.png)\n\
    \n选用更具体的路由：最长前缀匹配优先！\n\n组织0：200.23.16.0/23\n\n组织1：200.23.18.0/23\n\n组织2：200.23.20.0/23\n\
    \n组织7：200.23.30.0/23\n\nFly-By-Night-ISP\n\nISPs-R-Us\n\nInternet\n\n“将地址前缀为 200.23.16.0/20\
    \ 的IP分组发给我”\n\n“将地址前缀为 199.31.0.0/16或200.23.18.0/23 的IP分组发给我”\n"
