    \n## 谢谢！\n\n# 计算机网络之网尽其用\n\n主讲人：聂兰顺\n\n## 网络应用的体系结构\n\n## 你使用过哪些网络应用？\n\n![](img/b7a9324545f24cd4f1f7132598005229_6_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_6_1.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_6_2.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_6_3.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_6_4.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_6_5.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_6_6.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_6_7.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_6_8.png)\n\
    \n## 网络应用有哪些特点？\n\n与单机应用有哪些本质性的不同？\n\n![](img/b7a9324545f24cd4f1f7132598005229_7_0.png)\n\
    \n网络应用应采取什么样的体系结构？\n\n![](img/b7a9324545f24cd4f1f7132598005229_7_1.png)\n\n##\
    \ 网络应用的体系结构\n\n- ◆ 客户机/服务器结构(Client-Server, C/S)\n- ◆ 点对点结构(Peer-to-peer, P2P)\n\
    - ◆ 混合结构(Hybrid)\n\n![](img/b7a9324545f24cd4f1f7132598005229_8_0.png)\n\n## 客户机/服务器结构\n\
    \n## 服务器\n\n- 7*24小时提供服务\n- 永久性访问地址/域名\n- 利用大量服务器实现可扩展性\n\n## 客户机\n\n- 与服务器通信，使用服务器提供的服务\n\
    - 间歇性接入网络\n- 可能使用动态IP地址\n- 不会与其他客户机直接通信\n\n![](img/b7a9324545f24cd4f1f7132598005229_9_0.png)\n\
    \n## 纯P2P结构\n\n- 没有永远在线的服务器\n- 任意端系统/节点之间可以直接通讯\n- 节点间歇性接入网络\n- 节点可能改变IP地址\n-\
    \ 优点：高度可伸缩\n- 缺点：难于管理\n\n![](img/b7a9324545f24cd4f1f7132598005229_11_0.png)\n\n\
    ## 思考题\n\n- 为每种体系结构找出5种以上的网络应用\n- 从多个方面/角度对比三种体系结构的优缺点\n\n## 哈尔滨工业大学\n\nHARBIN\
    \ INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\n# 计算机网络之网尽其用\n\n\
    主讲人：聂兰顺\n\n## 网络应用进程通信\n\n## 网络应用的基础：进程间通信\n\n- ◆ 进程：\n  - 主机上运行的程序\n- ◆ 同一主机上运行的进程之间如何通信？\n\
    \  - 进程间通信机制\n  - 操作系统提供\n- ◆ 不同主机上运行的进程间如何通信？\n  - 消息交换\n\n客户机进程：发起通信的进程\n服务器进程：等待通信请求的进程\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_17_0.png)\n\n采用P2P架构的应用是否存在客户机进程/服务器进程之分？\n\
    \n## 套接字: Socket\n\n- 进程间通信利用socket发送/接收消息实现\n- 类似于寄信\n  - 发送方将消息送到门外邮箱\n  - 发送方依赖（门外的）传输基础设施将消息传到接收方所在主机，并送到接收方的门外\n\
    \  - 接收方从门外获取消息\n- 传输基础设施向进程提供API\n  - 传输协议的选择\n  - 参数的设置\n\n![](img/b7a9324545f24cd4f1f7132598005229_18_0.png)\n\
    \n## 应用层协议\n\n网络应用需遵循应用层协议\n\n公开协议\n\n- 由RFC (Request For Comments) 定义\n- 允许互操作\n\
    - HTTP, SMTP, ……\n\n私有协议\n\n- 多数P2P文件共享应用\n\n![](img/b7a9324545f24cd4f1f7132598005229_20_0.png)\n\
    \n## 应用层协议的内容\n\n- 消息的类型(type)\n  - 请求消息\n  - 响应消息\n- 消息的语法(syntax)/格式\n  - 消息中有哪些字段（field）？\n\
    \  - 每个字段如何描述\n- 字段的语义(semantics)\n  - 字段中信息的含义\n- 规则(rules)\n  - 进程何时发送/响应消息\n\
    \  - 进程如何发送/响应消息\n\n![](img/b7a9324545f24cd4f1f7132598005229_21_0.png)\n\n## 哈尔滨工业大学\n\
    \nHARBIN INSTITUTE OF TECHNOLOGY\n\n立足航天，服务国防，面向国民经济主战场\n\n## 谢谢！\n\n# 计算机网络之网尽其用\n\
    \n主讲人：聂兰顺\n\n## 网络应用的需求与传输层服务\n\n## 典型网络应用对传输服务的需求\n\n| Application | Data loss\
    \ | Bandwidth | Time Sensitive |\n|---|---|---|---|\n| file transfer | no loss\
    \ | elastic | no |\n| e-mail | no loss | elastic | no |\n| Web documents | no\
    \ loss | elastic | no |\n| real-time audio/video | loss-tolerant | audio: 5kbps-1Mbps<br>video:10kbps-5Mbps\
    \ | yes, 100's msec |\n| stored audio/video | loss-tolerant | same as above |\
    \ yes, few secs |\n| interactive games | loss-tolerant | few kbps up | yes, 100's\
    \ msec |\n| instant messaging | no loss | elastic | yes and no |\n\n## Internet提供的传输服务\n\
    \n## TCP服务\n\n- 面向连接: 客户机/服务器进程间需要建立连接\n- 可靠的传输\n- 流量控制: 发送方不会发送速度过快，超过接收方的处理能力\n\
    - 拥塞控制: 当网络负载过重时能够限制发送方的发送速度\n- 不提供时间/延迟保障\n- 不提供最小带宽保障\n\n## UDP服务\n\n- 无连接\n\
    - 不可靠的数据传输\n- 不提供:\n  - 可靠性保障\n  - 流量控制\n  - 拥塞控制\n  - 延迟保障\n  - 带宽保障\n\n![](img/b7a9324545f24cd4f1f7132598005229_27_0.png)\n\
    \n## 课后练习\n\n- 盘点你计算机上的所有网络应用，制作一个清单，包括网络应用的名字、功能、协议等。\n- 基于上述清单，制作表格，分析这些网络应用对传输服务的需求。\n\
    - 分析这些网络应用所使用的传输服务是TCP还是UDP。\n\n![](img/b7a9324545f24cd4f1f7132598005229_29_0.png)\n"
