    \ (1)\n\n## Internet AS间路由协议: BGP\n\n- ◆ 边界网关协议BGP (Border Gateway Protocol):\
    \ 事实上的标准域间路由协议\n  - 将Internet “粘合” 为一个整体的关键\n- ◆ BGP为每个AS提供了一种手段:\n  - eBGP: 从邻居AS获取子网可达性信息.\n\
    \  - iBGP: 向所有AS内部路由器传播子网可达性信息.\n  - 基于可达性信息与策略，确定到达其他网络的“好”路径.\n◆ 允许子网向Internet其余部分通告它的存在:\n\
    “我在这里！”\n\n## BGP基础\n\nBGP会话(session): 两个BGP路由器（“Peers”）交换BGP报文：\n\n- 通告去往不同目的前缀（prefix）的路径（“路径向量(path\
    \ vector)”协议）\n- 报文交换基于半永久的TCP连接\n\nBGP报文：\n\n- OPEN: 与peer建立TCP连接，并认证发送方\n- UPDATE:\
    \ 通告新路径(或撤销原路径)\n- KEEPALIVE: 在无UPDATE时，保活连接；也用于对OPEN请求的确认\n- NOTIFICATION: 报告先前报文的差错；也被用于关闭连接\n\
    \n## BGP基础\n\n- 当AS3通告一个前缀给AS1时：\n  - AS3承诺可以将数据报转发给该子网\n  - AS3在通告中会聚合网络前缀\n\n\
    ![](img/b7a9324545f24cd4f1f7132598005229_495_0.png)\n\n## 路径属性与BGP路由（route）\n\n\
    - 通告的前缀信息包括BGP属性\n  - 前缀+属性=“路由”\n- 两个重要属性：\n  - **AS-PATH(AS路径)**：包含前缀通告所经过的AS序列：e.g.,\
    \ AS 67, AS 17\n  - **NEXT-HOP(下一跳)**：开始一个AS-PATH的路由器接口，指向下一跳AS。\n    - 可能从当前AS到下一跳AS存在多条链路\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_497_0.png)\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\
    \n主讲人：李全龙\n\n## 本讲主题\n\n## BGP协议简介（2）\n\n## BGP路由选择\n\n网关路由器收到路由通告后，利用其输入策略 (import\
    \ policy) 决策接受/拒绝该路由\n\n- e.g., 从不将流量路由到 AS x\n- 基于策略 (policy-based) 路由\n\n路由器可能获知到达某目的\
    \ AS 的多条路由，基于以下准则选择：\n\n1. 本地偏好 (preference) 值属性: 策略决策 (policy decision)\n2. 最短\
    \ AS-PATH\n3. 最近 NEXT-HOP 路由器: 热土豆路由 (hot potato routing)\n4. 附加准则\n\n## BGP路由选择策略\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_502_0.png)\n\n图例：\n\n提供商网络\n\n客户网络\n\
    \n- ♦ A,B,C是提供商网络/AS(provider network/AS)\n- ♦ X,W,Y是客户网络(customer network/AS)\n\
    - ♦ W,Y是桩网络(stub network/AS): 只与一个其他AS相连\n- ♦ X是双宿网络(dual-homed network/AS): 连接两个其他AS\n\
    - X不期望经过他路由B到C的流量\n- ...因此，X不会向B通告任何一条到达C的路由\n\n## BGP路径选择策略\n\n![](img/b7a9324545f24cd4f1f7132598005229_503_0.png)\n\
