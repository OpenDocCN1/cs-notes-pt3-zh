    \n自治系统间路由任务！\n\n![](img/b7a9324545f24cd4f1f7132598005229_458_0.png)\n\n# 例: 路由器1d的转发表设置\n\
    \n+   • 假设AS1学习到(通过AS间路由协议): 子网x可以通过AS3 (网关 1c)到达, 但不能通过AS2到达\n+   \n+     - AS间路由协议向所有内部路由器传播该可达性信息\n\
    \n+   • 路由器1d: 利用AS内部路由信息, 确定其到达1c的最小费用路径接口 /\n+   \n+     - 在转发表中增加入口: (x, l)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_459_0.png)\n"
