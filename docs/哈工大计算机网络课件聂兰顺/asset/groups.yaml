    # BGP基础


    +   - 当AS3通告一个前缀给AS1时：

    +     - AS3承诺可以将数据报转发给该子网

    +     - AS3在通告中会聚合网络前缀


    ![](img/b7a9324545f24cd4f1f7132598005229_495_0.png)'
