  md: "\n## IP分片过程\n\n- 假设原IP分组总长度为 $L$，待转发链路的MTU为 $M$\n- 若 $L > M$，且 DF=0，则可以/需要分片\n\
    - 分片时每个分片的标识复制原IP分组的标识\n- 通常分片时，除最后一个分片，其他分片均分为MTU允许的最大分片\n- 一个最大分片可封装的数据应该是8的倍数，因此，一个最大分片可封装的数据为：\n\
    \n  $d = \\left\\lfloor \\frac{M - 20}{8} \\right\\rfloor \\times 8$\n\n- 需要的总片数为：\n\
    \n  $n = \\left\\lceil \\frac{L - 20}{d} \\right\\rceil$\n\n- 每片的片偏移字段取值为：\n\n\
    \  $$F_i = \\frac{d}{8} \\times (i-1),\\quad 1 \\le i \\le n$$\n\n- 每片的总长度字段为：\n\
    \n  $$L_i = \\begin{cases} d + 20 & 1 \\le i < n \\\\ L - (n-1)d & i = n \\end{cases}$$\n\
    \n- 每片的MF标志位为：\n\n  $$MF_i = \\begin{cases} 1 & 1 \\le i < n \\\\ 0 & i = n \\\
    end{cases}$$\n\n### 例如：\n\n- 4000B数据报\n- 输出链路MTU = 1500B\n- DF=0\n\n1个大数据报分片为3个小数据报（片）\n\
    \n封装1480B数据\n\n片偏移 = 1480/8\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## IP协议（3）-IP编址\n\
    \n### IP编址(addressing)\n\n- IP分组：\n  - 源地址(SA)-从哪儿来\n  - 目的地址(DA)-到哪儿去\n\n- 接口(interface):\
    \ 主机/路由器与物理链路的连接\n  - 实现网络层功能\n  - 路由器通常有多个接口\n  - 主机通常只有一个或两个接口 (e.g., 有线的以太网接口，无线的802.11接口)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_353_0.png)\n\n- IP 地址：32 比特(IPv4)\n\
    - 编号标识主机、路由器的接口\n\n11011111 00000001 00000001 00000001 =223.1.1.1\n223 1 1 1\n\
    \n- IP 地址与每个接口关联\n\n- 怎样为接口分配 IP 地址呢？\n\n![](img/b7a9324545f24cd4f1f7132598005229_354_0.png)\n\
    \n### IP子网（Subnets）\n\nIP地址：\n\n- 网络号(NetID) – 高位比特\n- 主机号(HostID) – 低位比特\n\n\
    | NetID | HostID |\n|-------|--------|\n\n![](img/b7a9324545f24cd4f1f7132598005229_355_0.png)\n\
    \nIP子网：\n\n- IP地址具有相同网络号的设备接口\n- 不跨越路由器（第三及以上层网络设备）可以彼此物理联通的接口\n\n![](img/b7a9324545f24cd4f1f7132598005229_355_1.png)\n\
    \n图中网络有多少个 IP子网？\n\n![](img/b7a9324545f24cd4f1f7132598005229_356_0.png)\n\n##\
    \ 谢谢！\n\n## 计算机网络之探颐索隐\n\n主讲人：李全龙\n\n## IP协议（4）-有类IP 地址\n\n### IP子网（Subnets）\n\
    \nIP地址：\n\n- 网络号(NetID) – 高位比特\n- 主机号(HostID) – 低位比特\n\n| NetID | HostID |\n|-------|--------|\n\
    \nIP子网：\n\n- IP地址具有相同网络号的设备接口\n- 不跨越路由器（第三及以上层网络设备）可以彼此物理联通的接口\n\n![](img/b7a9324545f24cd4f1f7132598005229_360_0.png)\n\
    \n### IP地址(Addresses)\n\n“有类”编址：\n\n![](img/b7a9324545f24cd4f1f7132598005229_361_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_362_0.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_363_0.png)\n\
    \n![](img/b7a9324545f24cd4f1f7132598005229_364_0.png)\n\n![](img/b7a9324545f24cd4f1f7132598005229_365_0.png)\n\
    \n| 类别 | 占比 | NetID/HostID | 前缀 | 地址范围 |\n|------|------|---------------|------|----------|\n\
    | A类地址 | 50% | NetID (8位) / HostID (24位) | `0` | 0.0.0.0~127.255.255.255 |\n|\
    \ B类地址 | 25% | NetID (16位) / HostID (16位) | `10` | 128.0.0.0~191.255.255.255 |\n\
    | C类地址 | 12.5% | NetID (24位) / HostID (8位) | `110` | 192.0.0.0~223.255.255.255\
    \ |\n| D类地址 | 6.25% | 32位 | `1110` | 224.0.0.0~239.255.255.255 |\n| E类地址 | 6.25%\
    \ | 32位 | `1111` | 240.0.0.0~255.255.255.255 |\n\n### 特殊IP地址\n\n| NetID | HostID\
    \ | 作为IP分组源地址 | 作为IP分组目的地址 | 用途 |\n|-------|--------|-------------------|---------------------|------|\n\
    | 全0 | 全0 | 可以 | 不可以 | 在本网范围内表示本机；在路由表中用于表示默认路由（相当于表示整个Internet网络） |\n| 全0 | 特定值\
    \ | 不可以 | 可以 | 表示本网内某个特定主机 |\n| 全1 | 全1 | 不可以 | 可以 | 本网广播地址（路由器不转发） |\n| 特定值 |\
    \ 全0 | 不可以 | 不可以 | 网络地址，表示一个网络 |\n| 特定值 | 全1 | 不可以 | 可以 | 直接广播地址，对特定网络上的所有主机进行广播\
    \ |\n| 127 | 非0或非1的任何数 | 可以 | 可以 | 用于本地软件回环测试，称为回环地址 |\n\n### 私有（Private）IP地址\n\
    \n| Class | NetIDs | Blocks |\n|---|---|---|\n| A | 10 | 1 |\n| B | 172.16 to\
    \ 172.31 | 16 |\n| C | 192.168.0 to 192.168.255 | 256 |\n\n## 谢谢！\n\n## 计算机网络之探颐索隐\n\
    \n主讲人：李全龙\n\n## IP子网（Subnets）\n\nIP地址：\n\n- 网络号(NetID) – 高位比特\n- 主机号(HostID) –\
    \ 低位比特\n\n| NetID | HostID |\n|-------|--------|\n\nIP子网：\n\n- IP地址具有相同网络号的设备接口\n\
    - 不跨越路由器（第三及以上层网络设备）可以彼此物理联通的接口\n\n![](img/b7a9324545f24cd4f1f7132598005229_371_0.png)\n"
