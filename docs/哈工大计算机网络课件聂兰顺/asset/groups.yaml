  - '[PAGE 65]


    # Web缓存/代理服务器技术


    # 功能


    +   - 在不访问服务器的前提下满足客户端的HTTP请求。


    # 为什么要发明这种技术？


    +   - 缩短客户请求的响应时间

    +   - 减少机构/组织的流量

    +   - 在大范围内(Internet)实现有效的内容分发


    ![](img/b7a9324545f24cd4f1f7132598005229_65_0.png)'
  - '[PAGE 66]


    # Web缓存/代理服务器技术


    # Web缓存/代理服务器


    +   - 用户设定浏览器通过缓存进行Web访问

    +   - 浏览器向缓存/代理服务器发送所有的 HTTP请求

    +     - 如果所请求对象在缓存中，缓存返回对象

    +     - 否则，缓存服务器向原始服务器发送HTTP请求，获取对象，然后返回给客户端并保存该对象


    +   - 缓存既充当客户端，也充当服务器


    +   - 一般由ISP(Internet服务提供商)架设


    ![](img/b7a9324545f24cd4f1f7132598005229_66_0.png)'
  - '[PAGE 67]


    # Web缓存示例(1)


    +   ❖ 假定:

    +   - 对象的平均大小=100,000比特

    +   - 机构网络中的浏览器的平均每秒有15个到原始服务器的请求

    +   - 从机构路由器到原始服务器的往返延迟=2秒


    +   ❖ 网络性能分析:

    +   - 局域网(LAN)的利用率=15%

    +   - 接入互联网的链路的利用率=100%

    +   - 总的延迟=互联网上的延迟+访问延迟+局域网延迟=2秒+几分钟+几微秒


    ![](img/b7a9324545f24cd4f1f7132598005229_67_0.png)'
  - '[PAGE 68]


    # Web缓存示例(2)


    +   解决方案1:

    +   - 提升互联网接入带宽=10Mbps


    +   网络性能分析:

    +   - 局域网(LAN)的利用率=15%

    +   - 接入互联网的链路的利用率=15%

    +   - 总的延迟=互联网上的延迟+访问延迟+局域网延迟=2秒+几微秒+几微秒


    +   问题:

    +   - 成本太高


    ![](img/b7a9324545f24cd4f1f7132598005229_68_0.png)'
  - '[PAGE 69]


    # Web缓存示例(3)


    # 解决方案2:


    +   - 安装Web缓存

    +   - 假设缓存命中率是0.4


    # 网络性能分析:


    +   - 40%的请求立刻得到满足

    +   - 60%的请求通过原始服务器满足

    +   - 接入互联网的链路的利用率下降到60%，从而其延迟可以忽略不计，例如10微秒

    +   - 总的平均延迟=互联网上的延迟+访问延迟+局域网延迟=0.6×2.01秒+0.4×n微秒<1.4秒


    ![](img/b7a9324545f24cd4f1f7132598005229_69_0.png)'
  - '[PAGE 70]


    # 条件性GET方法


    +   ❖ 目标：

    +     - 如果缓存有最新的版本，则不需要发送请求对象


    +   ❖ 缓存：

    +     - 在HTTP请求消息中声明所持有版本的日期

    +     - If-modified-since: <date>


    +   ❖ 服务器：

    +     - 如果缓存的版本是最新的，则响应消息中不包含对象

    +     - HTTP/1.0 304 Not Modified


    ![](img/b7a9324545f24cd4f1f7132598005229_70_0.png)'
