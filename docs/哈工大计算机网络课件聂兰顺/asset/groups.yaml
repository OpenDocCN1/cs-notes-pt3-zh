    <!-- no content -->'
  - '[PAGE 20]


    # 应用层协议


    网络应用需遵循应用层协议


    公开协议


    +   - 由RFC (Request For Comments) 定义

    +   - 允许互操作

    +   - HTTP, SMTP, ……


    私有协议


    +   - 多数P2P文件共享应用


    ![](img/b7a9324545f24cd4f1f7132598005229_20_0.png)'
  - '[PAGE 21]


    # 应用层协议的内容


    +   - 消息的类型(type)

    +     - 请求消息

    +     - 响应消息

    +   - 消息的语法(syntax)/格式

    +     - 消息中有哪些字段（field）？

    +     - 每个字段如何描述

    +   - 字段的语义(semantics)

    +     - 字段中信息的含义

    +   - 规则(rules)

    +     - 进程何时发送/响应消息

    +     - 进程如何发送/响应消息


    ![](img/b7a9324545f24cd4f1f7132598005229_21_0.png)'
