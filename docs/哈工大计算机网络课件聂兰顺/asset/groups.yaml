  - '[PAGE 267]


    # 拥塞控制的方法


    +   端到端拥塞控制:

    +   - 网络层不需要显式的提供支持

    +   - 端系统通过观察loss, delay等网络行为判断是否发生拥塞

    +   - TCP采取这种方法


    +   网络辅助的拥塞控制:

    +   - 路由器向发送方显式地反馈网络拥塞信息

    +   - 简单的拥塞指示(1bit): SNA, DECbit, TCP/IP ECN, ATM)

    +   - 指示发送方应该采取何种速率'
  - '[PAGE 268]


    # 案例：**ATM ABR**拥塞控制


    +   - **ABR：available bit rate**

    +     - “弹性服务”

    +     - 如果发送方路径“underloaded”

    +       - ⑩使用可用带宽

    +     - 如果发送方路径拥塞

    +       - ⑩将发送速率降到最低保障速率


    +   - **RM(resource management) cells**

    +     - 发送方发送

    +     - 交换机设置RM cell位(网络辅助)

    +       - NI bit: rate不许增长

    +       - CI bit: 拥塞指示

