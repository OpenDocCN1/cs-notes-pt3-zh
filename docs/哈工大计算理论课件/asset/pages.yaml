- pgno: 213
  md: '# Turing Machines


    +   - Example: \(B = \{w#w \mid w \in \{0,1\}^*\}\)

    +   - So when you want to **design a TM \(M_1\)** to recognize \(B\), what should
    you do?

    +   - We can do it as following:

    +     - Zigzags to the corresponding places on the two sides of the #

    +     - Determines whether they match.

    +     - Crosses off (×) each symbol as it is examined.

    +     - If it crosses off all symbols, then accept, while if it discovers a mismatch,
    reject.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Turing Machines


