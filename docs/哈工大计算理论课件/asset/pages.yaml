- pgno: 460
  md: '# Randomness


    Theorem:


    +   Let $f$ be a computable property that holds for almost all strings. Then,
    for any $b > 0$, the property $f$ is FALSE on only finitely many strings that
    are incompressible by $b$.


    Proof:


    +   Let $M$ be the following algorithm.


    ```

    M = "On input i, a binary integer:

    1. Find the i-th string s where f(s) = FALSE, considering the strings ordered
    lexicographically.

    2. Output string s."

    ```'
  merge: -1
  img_proc: true
