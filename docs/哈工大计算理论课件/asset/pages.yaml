  md: '# PDA is equivalence with CFG


    +   - Theorem: A language is context free if and only if some pushdown automaton
    recognizes it.

    +   - The proof is partitioned into two parts:

    +     - If a language is context free, then some pushdown automaton recognizes
    it.

    +     - If a pushdown automaton recognizes some language, then it is context free.'
