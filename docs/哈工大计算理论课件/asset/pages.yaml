- pgno: 40
  md: '# Proof by construction


    +   - Example 1:

    +     Prove for each even number $n$ greater than 2, there exists a 3-regular
    graph (a graph with degree 3 for all of its nodes) with $n$ nodes.

    +   - Proof:

    +     Let $n$ be an even number and $n > 2$. Construct graph $G = (V, E)$ with
    n nodes as follows. The set of nodes of $G$ is $V = \{0,1,\dots,n-1\}$, and the
    set of edges of $G$ is the set

    +     $E = \{\{i,i+1\} \mid for\ 0 \le i \le n-2\} \cup \{\{n-1,0\}\} \cup \{\{i,i+n/2\}
    \mid for\ 0 \le i \le n/2-1\}$'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Proof by construction\n\n {{ {i, i+1} | for 0 ≤ i ≤ n−2 } ∪ { {n−1,0} } }\n\
    These edges are the edges between adjacent pairs around the circle\n\n {{ {i,\
    \ i + n/2} | for 0 ≤ i ≤ n/2 −1 } }\nThese edges are the edges between nodes on\
    \ opposite sides of the circle.\n\nSo this construction satisfies that every node\
    \ in G has degree 3.\n\n![](img/505b35cb28b35d38fc29ccba74c23087_41_0.png)\n\n\
