- pgno: 779
  md: '# Time Hierarchy Theorem


    +   Proof Idea:

    +   - The important difference in the proof concerns the cost of simulating M
    while, at the same time, count the number of steps that the simulation is using.

    +   - TM D must perform this timed simulation efficiently so that D runs in O(t(n))
    while avoiding all languages decidable in o(t(n)/log t(n)) time

    +   - For space complexity, the simulation introduced a constant factor overhead

    +   - For time complexity, the simulation introduced a logarithmic factor overhead

    +     - This is why we have 1 / log t(n) factor in the theorem

    +     - No more efficient simulation is known yet'
  merge: -1
  img_proc: true
- pgno: 780
  md: '# Time Hierarchy Theorem


    +   - Proof:

    +     - D = “On input w:

    +       1. Let n be the length of w.

    +       2. Compute t(n) using time constructability and store the value ⌈t(n)/log
    t(n)⌉ in a binary counter. Decrement this counter before each step used to carry
    out stages 3, 4 and 5. If the counter hit 0, reject

    +       3. If w is not of the form <M>10* for some TM M, reject

    +       4. Simulate M on w

    +       5. If M accepts, reject. If M rejects, accept.”'
  merge: -1
  img_proc: true
- pgno: 781
  md: '# Time Hierarchy Theorem


    +   - Obviously, stages 1, 2 and 3 can be performed within $O(t(n))$ time

    +   - In stage 4, every time $D$ simulates one step of $M$, it takes $M$''s current
    state in its transition function so that it can update $M$''s tape head and looks
    up $M$''s next action in its transition function to update $M$''s tape appropriately.

    +     - All state, tape symbol and transition function of $M$ are stored somewhere
    on $D$''s tape

    +     - This will be very inefficient if they are stored far away from each other'
  merge: -1
  img_proc: true
- pgno: 782
  md: '# Time Hierarchy Theorem


    +   - We organize D’s single tape into tracks

    +     - We store content of the first track in the odd positions and content of
    the second track in the even positions

    +     - Alternatively, we may have this effect by enlarging D’s tape alphabet
    to include each pair of symbols, one from the first track, one from the other

    +     - This could be extended to multiple tracks, with more than 2 tracks

    +     - This only introduce a constant factor overhead in time

    +     - *D has 3 tracks*'
  merge: -1
  img_proc: true
- pgno: 783
  md: '# Time Hierarchy Theorem


    +   - At stages 3 and 4, *D* must decrement the step counter

    +     - *D* can do so without adding to much time to the simulation by keeping
    the counter in binary on a **third track**

    +     - And, moving it to keep it near the present head position

    +     - The magnitude of the count is about *t(n)/log t(n)*, so its length is
    log (*t(n)/log t(n)*) = *O(log t(n))*

    +     - So, it adds *O(log t(n))* to the simulation

    +     - Totally, the simulation running time is *O(t(n))*.

    +     - So, A is decidable in time *O(t(n))*'
  merge: -1
  img_proc: true
- pgno: 784
  md: '# Time Hierarchy Theorem


    +   - Is it A not decidable in $o(t(n)/\log t(n))$ ?

    +     - Assume contrary that TM $M$ decides $A$ in time $g(n)$, where $g(n)$ is
    $o(t(n)/\log t(n))$.

    +     - $D$ can simulate $M$ using time $dg(n)$ for some constant $d$

    +     - If the total simulation time is at most $t(n)/\log t(n)$, simulation will
    run to completion (without counting the counter updating)

    +     - Some constant $n_0$ exists, where $dg(n) < t(n)/\log t(n)$ for all $n
    \ge n_0$.

    +     - So, $D$’s simulation of $M$ will run to completion so long as the input
    has length $n_0$ or more'
  merge: -1
