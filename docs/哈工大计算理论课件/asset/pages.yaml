    +   \n+     $uAv \\Rightarrow u w v$\n+   - If u = v or if a sequence u₁, u₂,\
    \ ..., uₖ exists for k ≥ 0 and u ⇒ u₁ ⇒ u₂ ⇒ ... ⇒ uₖ ⇒ v we say that u derives\
    \ v, written\n+   \n+     $u \\stackrel{*}{\\Rightarrow} v$"
