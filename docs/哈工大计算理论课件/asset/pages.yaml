- pgno: 472
  md: '# Time complexity


    +   - Let $M$ be a deterministic Turing machine that halts on all inputs. The
    **running time** (**time complexity**) of $M$ is the function $f:\mathbb{N}\to\mathbb{N}$,
    where $f(n)$ is the maximum number of steps that $M$ uses on any input of length
    $n$.

    +   - If $f(n)$ is the running time of $M$, we say that $M$ runs in time $f(n)$
    and that $M$ is an $f(n)$ time Turing machine.

    +   - Customarily we use $n$ to represent the length of the input.'
  merge: -1
  img_proc: true
