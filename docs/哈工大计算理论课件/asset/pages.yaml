- pgno: 76
  md: '# Regular operations


    | | Basic objects | Tools( Operations for manipulating ) |

    |---|---|---|

    | Arithmetic | Numbers | e.g. +, / |

    | Computation theory | Languages | e.g. U, ∘, * |


    Let A and B be languages. We define the regular operations union, concatenation,
    and star as follows.


    +   - Union: A ∪ B = { x | x ∈ A or x ∈ B }


    +   - Concatenation: A ∘ B = { xy | x ∈ A and y ∈ B }


    +   - Star: A* = { x₁ x₂ ... xₙ | k ≥ 0 and each xᵢ ∈ A }


    Note: When k = 0, for * operation, empty string ε ∈ A *'
  merge: -1
  img_proc: true
