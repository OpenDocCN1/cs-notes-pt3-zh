    +   • To design a FA, put yourself in the place of the machine you are trying
    to design, see how you would do to perform the machine’s task.


    +   • So pretending yourself to be the automaton, receive an input string, see
    the symbols one by one, and then must decide whether the string seen so far is
    in the language. You (FA) don’t know when the end of the string is coming, so
    you must always be ready with the answer.'
