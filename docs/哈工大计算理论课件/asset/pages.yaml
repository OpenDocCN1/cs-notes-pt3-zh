- pgno: 202
  md: '# Non-context-free languages


    +   - Pumping lemma for context-free language: every context-free language has
    a special value called the *pumping length* such that all longer strings in the
    language can be “pumped.”

    +   - Here the definition means that the string can be divided into five parts
    so that the second part and the fourth parts may be repeated together any number
    of times and the resulting string still remains in the language.'
  merge: -1
  img_proc: true
- pgno: 203
  md: "# Non-context-free languages\n\n+   - Pumping lemma for context-free language:\n\
    +   If $A$ is a context-free language, then there is a number $p$ (the pumping\
    \ length) where, if s is any string in $A$ of length at least $p$, then s may\
    \ be divided into five pieces $s = uvxyz$ satisfying the conditions\n+   \n+ \
    \  for each $i \\ge 0$, $uv^i xy^i z \\in A$\n+   \n+   $|xy| > 0$, and\n+   \n\
    +   $|vxy| \\le p$"
  merge: -1
  img_proc: true
