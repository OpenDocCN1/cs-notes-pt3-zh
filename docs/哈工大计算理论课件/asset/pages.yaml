- pgno: 727
  md: '# Classes L and NL


    # Definition


    +   If $M$ is a TM that has a separate read-only input tape and $w$ is an input,
    a configuration of $M$ on $w$ is a setting of the state, the work tape, and the
    positions of the two tape heads. The input $w$ is not a part of the configuration
    of $M$ on $w$.


    +   If M runs in $f(n)$ space and length of $w$ is $n$, the number of configuration
    of $M$ on $w$ is $n2^{O(f(n))}$


    +   Let M has $c$ states and $g$ tape symbols, the number of possible strings
    on the work tap is $g^{f(n)}$.


    +   Input head can be in one of the n positions and working tape head can be in
    one of the $f(n)$ position


    +   So the number of configuration is $cnf(n)g^{f(n)}$ or $n2^{O(f(n))}$.'
  merge: -1
  img_proc: true
- pgno: 728
