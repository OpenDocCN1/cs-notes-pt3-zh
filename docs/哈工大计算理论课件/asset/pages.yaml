- pgno: 806
  md: '# Relativization


    +   - For example, we give the TM ability to solve the SAT problem in a single
    step for any size of Boolean formula

    +   - Never mind how we do it, imagine an attached “black-box”, we call this black-box
    an **oracle**

    +     - Oracle could correspond to any language

    +   - TM could use the oracle to solve any NP problem in polynomial time, regardless
    whether P equals NP because every NP problem is polynomial time reducible to the
    SAT problem

    +   - Such a TM is said to be computing **relative to** the SAT problem'
  merge: -1
