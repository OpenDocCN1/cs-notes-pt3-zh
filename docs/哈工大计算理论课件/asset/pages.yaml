  md: '# Chomsky normal form


    +   If we add more constrains to the CFG, then we can design and use it more easily.


    +   Chomsky normal form:

    +     - A context-free grammar is in Chomsky normal form if every rule is of the
    form

    +       A → BC

    +       A → a

    +     - where

    +       - a is any terminal

    +       - A, B, and C are any variables---except that B and C may not be the start
    variable

    +       - Permit rule S → ε , only when S is the start variable.'
