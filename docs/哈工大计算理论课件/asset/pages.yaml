- pgno: 223
  md: '# Formal definition of a Turing Machines


    +   - Let $Q''$ be $Q$ without $q_{accept}$ and $q_{reject}$.

    +   - The transition function in definition is changed to

    +     $$Q'' \times \Gamma \rightarrow Q \times \Gamma \times \{L,R\}$$

    +   - A Turing machine $M$ accepts input $w$ if a sequence of configurations $C_1,C_2,\ldots,C_k$
    exists, where

    +     - $C_1$ is the **start configuration** of $M$ on input $w$.

    +     - Each $C_i$ **yields** $C_{i+1}$, and

    +     - $C_k$ is an **accepting configuration**.'
