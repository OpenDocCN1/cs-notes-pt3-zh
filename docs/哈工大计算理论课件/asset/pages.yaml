- pgno: 458
  md: '# Incompressible string


    Theorem: Incompressible strings of every length exist.


    Proof:


    +   - The number of binary strings of length $n$ is $2^n$.

    +   - Each description is a binary string, and the number of description of length
    less than $n$ is at most the sum of the number of strings of each length up to
    $n-1$:

    +     $$\sum_{0\le i\le n-1} 2^i = 1+2+4+...+2^{n-1}=2^n-1$$


    So there is at least one string of length $n$ is incompressible.'
  merge: -1
  img_proc: true
