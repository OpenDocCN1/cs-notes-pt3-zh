- pgno: 134
  md: '# Regular expressions


    +   - The formal definition of GNFA

    +     - A generalized nondeterministic finite automaton $G$ is a 5-tuple $(Q,
    \Sigma, \delta, q_{start}, q_{accept})$, where

    +       1. $Q$ is a finite set **states**,

    +       2. $\Sigma$ is the input **alphabet**,

    +       3. $\delta : (Q - \{q_{accept}\}) \times (Q - \{q_{start}\}) \rightarrow
    R$ is the **transition function**

    +       4. $q_{start}$ is the **start state**, and

    +       5. $q_{accept}$ is the **accept state**.


    Note: $R$ is the collection of all regular expressions over the alphabet $\Sigma$'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Regular expressions


    +   - The formal definition of computation of GNFA

    +     - A GNFA accepts a string *w in* Σ* if *w = w₁ w₂ … wₙ*, where each *wᵢ
    is in* Σ* a sequence of states *q₀, q₁, … qₖ* exists such that

    +       1. *q₀ = q_start* is the start state.

    +       2. *qₖ = q_accept* is the accept state

    +       3. For each *i*, we have *wᵢ ∈ L(Rᵢ)*, where *Rᵢ = δ̂(qᵢ₋₁, qᵢ)*; in other
    words, *Rᵢ* is the expression on the arrow from *qᵢ₋₁* to *qᵢ*.'
  merge: -1
  img_proc: true
