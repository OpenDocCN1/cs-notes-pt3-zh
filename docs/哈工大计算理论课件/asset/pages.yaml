  md: '# Formal definition of computation for a TM


    +   - The start configuration of M on input w is the configuration q₀w, which
    indicates that the machine is in the start state q₀ with its head at the leftmost
    position on the tape.

    +   - In an accepting configuration the state of the configuration is q_accept
    .

    +   - In a rejecting configuration the state of the configuration is q_reject
    .

    +     - Accepting and rejecting configurations are halting configurations and
    do not yield further configurations.'
