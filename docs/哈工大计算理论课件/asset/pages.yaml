  md: '# Classes L and NL


    Remember that the Savitch’s theorem shows that we can convert NTM to DTM and increase
    the space complexity by only a square?


    +   - We extend it to hold for sublinear spce bounds down to $f(n) \geqslant \log
    n$

    +   - The proof is identical to the old one, except we use the new TM with read-only
    tape

    +   - Storing a configuration of $N$ on $w$ uses $\log(n2^{O(f(n))}) = \log n
    + O(f(n))$ space

    +   - If $f(n) \geqslant \log n$, *the storage used is $O(f(n))$* and the remainder
    of the proof remains the same'
