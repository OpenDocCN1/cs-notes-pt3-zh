  md: '# Mapping reducibility


    +   - We will define reduction here.

    +   - A simple type of reducibility is mapping reducibility.

    +   - Roughly speaking, being able to reduce problem *A* to *B* by using a mapping
    reducibility means that a computable function exists that converts instances of
    problem *A* to instances of problem *B*.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Mapping reducibility


    +   - A function $f : \Sigma^* \to \Sigma^*$ is a computable function if some
    Turing machine $M$, on every input $w$, halts with just $f(w)$ on its tape.

    +   - All usual arithmetic operations on integers are computable functions.

    +   - Then we can design a machine to take input $\langle m,n\rangle$ and give
    the result $m+n$.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Mapping reducibility


    +   - Computable functions may be transformations of machine desritions.

    +   - For example, one computable function $f$ takes input $w$ and returns the
    description of a Turing machine $\langle M'' \rangle$ if $w = \langle M \rangle$
    is an encoding of a Turing machine $M$. The machine $M''$ is a machine that recognizes
    the same language as M, but never move its head off the left-hand end of its tape.
    The function $f$ accomplishes this task by adding several states to the description
    of $M$. The function returns $\varepsilon$ if $w$ is not a legal encoding of a
    Turing machine.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Formal definition of mapping reducibility


    +   Language A is mapping reducible to language B, written A ≤_m B, if there is
    a computable function f:Σ* → Σ* where for every w,

    +    w ∈ A ⇔ f(w) ∈ B


    +   The function f is called the reduction of A to B.


