- pgno: 833
  md: '# Circuit Complexity


    +   - Besides linking circuit complexity and time complexity, we also found an
    alternative proof of Cook-Levin theorem

    +   - We say that a Boolean circuit is satisfiable if some setting of the inputs
    causes the circuit to output 1.

    +   - The circuit-satisfiability problem tests whether a circuit is satisfiable


    CIRCUIT-SAT = {<C> | C is satisfiable Boolean circuit}'
  merge: -1
  img_proc: true
- pgno: 834
  md: '# Circuit Complexity


    +   - Theorem

    +     - CIRCUIT-SAT is NP-complete

    +   - Proof:

    +     - CIRCUIT-SAT is obviously in NP

    +     - $f(w)=\langle C\rangle$ implies that

    +       $w \in A \iff$ Boolean circuit $C$ is satisfiable

    +     - Because $A$ is in NP, it has a polynomial time verifier $V$ whose input
    has the form $\langle x, c\rangle$, where c may be the certificate showing that
    $x$ is in $A$

    +     - To construct $f$, we obtain the circuit simulating $V$ using the tableau
    method in previous slides'
  merge: -1
  img_proc: true
- pgno: 835
  md: '# Circuit Complexity


    +   Proof:

    +   - The only remaining input is the circuit correspond to the certificate $c$,
    we call this circuit $C$ and output it

    +   - If $C$ is satisfiable, a certificate exists, so w is in $A$

    +   - Or, if w is in $A$, a certificate exists, so $C$ is satisfiable

    +   - Then we need to show the reduction runs in polynomial time

    +   - In the tableau method, the construction of the circuit can be done in time
    that is polynomial in n

    +   - The running time of the verifier is $n^k$ for some $k$

    +   - So, the size of the circuit is $O(n^{2k})$

    +   - So, the running time of the reduction is $O(n^{2k})$'
  merge: -1
  img_proc: true
- pgno: 836
  md: '# Circuit Complexity


    +   - Theorem:

    +     - 3SAT is NP-complete

    +   - Proof Idea:

    +     - 3SAT is obviously in NP

    +     - Then we concentrate on showing that all languages in NP reduce to 3SAT
    in polynomial time

    +       - We reduce CIRCUIT-SAT to 3SAT in polynomial time

    +     - The reduction converts a circuit C to a formula Φ,

    +       - whereby C is staisfiable iff Φ is satisfiable

    +       - The formula contains one variable for each variable and each gate in
    the circuit'
  merge: -1
  img_proc: true
- pgno: 837
  md: "# Circuit Complexity\n\n+   **Proof Idea:**\n+   \n+   - Conceptually, the\
    \ formula simulates the circuit\n+   - A satisfying assignment for φ contains\
    \ a satisfying assignment to C\n+   - If also contains the values at each of C’s\
    \ gates in C’s computation on its satisfying assignment\n+   - In effect, φ’s\
    \ satisfying assignment guess C’s entire computation on its satisfying assignment\n\
    +   - φ’s clauses check the correctness of that computation\n+   - In addition,\
    \ φ contains a clause stipulating that C’s output is 1"
  merge: -1
  img_proc: true
