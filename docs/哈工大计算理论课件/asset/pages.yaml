- pgno: 167
  md: "# Designing context-free grammars\n\n+   - **Technique one:**\n+     - To remember\
    \ the substring:\n+     - Certain CFLs contain strings with two substrings that\
    \ require the machine to remember an unbounded amount of information about one\
    \ of the substring s, in order to verify the corresponding properly to the other\
    \ substring.\n+     - Then you can construct a CFG by using a rule of the form\n\
    +       \n+       $R \\to uRv$\n+     - E.g. $\\{0^n1^n \\mid n \\ge 0\\}$   \
    \       $S_1 \\to 0S_1 1 \\mid \\varepsilon$\n+       here CFG remembers the number\
    \ of 0s in order to verify that it equals the number of 1s."
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Designing context-free grammars\n\n+   - Technique two:\n+     - Break into\
    \ simpler pieces:\n+     - Many CFLs are the union of simple CFLs. So break into\
    \ simpler pieces, then construct individual grammars for each piece. Merge them\
    \ into a grammar for the original language by combining their rule and then adding\
    \ the new rule\n+   \n+       $S \\rightarrow S_1 | S_2 | ... | S_k$\n+     -\
    \ where $S_i$ are the start variables for the individual grammars."
  merge: -1
  img_proc: true
