- pgno: 155
  md: '# Formal Definition of a context-free grammar


    +   - A context-free grammar is a 4-tuple (*V*, Σ, *R*, *S*), where

    +     - *V* is a finite set called the variables,

    +     - Σ is a finite set, disjoint from *V*, called the terminals,

    +     - *R* is a finite set of rules (production), with each rule being a variable
    and a string of variables and terminals, and

    +     - *S* ∈ *V* is the start variable.'
  merge: -1
