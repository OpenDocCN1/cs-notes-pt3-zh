    A_DFA = {⟨B, w⟩ | B is a DFA that accepts input string w}


    +   Theorem: A_DFA is a decidable language


    +   The problem of testing whether a DFA B accepts an input w is the same as the
    problem of testing whether ⟨B,w⟩ is a member of the language A_DFA .


    +   Hence this theorem shows that the problem of testing whether a given finite
    automaton accepts a given string is decidable.'
