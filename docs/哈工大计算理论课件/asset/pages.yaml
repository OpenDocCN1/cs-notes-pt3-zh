- pgno: 579
  md: '# Polynomial time reducibility


    Polynomial time reducible:


    +   - Language A is polynomial time mapping reducible, or simply polynomial time
    reducible, to language B, written $A \le_p B$, if a polynomial time computable
    function $f : \Sigma^* \to \Sigma^*$ exists, where for every $w$, $w \in A \Leftrightarrow
    f(w) \in B$


    The function $f$ is called the polynomial time reduction of $A$ to $B$.'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# Polynomial time reducibility


    Theorem:


    If A ≤ₚ B and B ∈ P, then A ∈ P.


    +   If one language is polynomial time reducible to a language already known to
    have a polynomial time solution, we obtain a polynomial time solution to the original
    language.'
