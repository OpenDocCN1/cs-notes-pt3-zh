- pgno: 70
  md: '# Formal Definition of Computation


    +   - Let $M = (Q, \Sigma, \delta, q_0, F)$ be a FA and let $w = w_1 w_2 ... w_n$
    be a string where each $w_i$ is a member of the alphabet $\Sigma$. Then $M$ accepts
    $w$ if a sequence of states $r_0, r_1, ... r_n$ in $Q$ exists with three conditions:;

    +     - $r_0 = q_0$

    +     - $\delta(r_i, w_{i+1}) = r_{i+1}$, for $i = 0, ..., n-1$, and

    +     - $r_n \in F$

    +   - So we can say that $M$ recognizes language $A$ if $A = \{w \mid M \text{
    accepts } w\}$

    +   - A language is called a regular language if some finite automaton recognizes
    it.'
  merge: -1
  img_proc: true
