- pgno: 61
  md: '# Finite Automata


    +   - **The process procedure:**

    +     - Begins in $M_1$''s **start state**

    +     - Repeat until the last symbol:

    +       - Read one **symbol** from the input string from left to right in turns.

    +       - $M_1$ moves from one state to another along the **transition** that
    has that symbol as its label.

    +     - $M_1$ produces its output, the output is **accept** if $M_1$ is now in
    an accept state and **reject** if it is not.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Finite Automata


    E.g.: We input a string 1101 to the FA M₁


    The processing proceeds:


    +   - Start in state q₁.

    +   - Read 1, follow transition from q₁ to q₂;

    +   - Read 1, follow transition from q₂ to q₂;

    +   - Read 0, follow transition from q₂ to q₃;

    +   - Read 1, follow transition from q₃ to q₂.

    +   - Accept because M₁ is in an accept state q₂ at the end of the input.


    In fact, M₁ accepts any string that ends with a 1, and also any string that ends
    with an even number of 0s following the last 1.


    ![](img/505b35cb28b35d38fc29ccba74c23087_62_0.png)'
