  md: '# NL-Completeness


    # Definition


    +   - A **log space transducer** is a TM with a read-only input tape, a write-only
    output tape, and a read/write work tape.

    +   - The work tape may contain O(log n) symbols.

    +   - A log space transducer M computes a function f: Σ* → Σ*, where f(w) is the
    string remaining on its input tape after M halts when it is stated with w on its
    input tape.

    +   - We call f a **log space computable function**.

    +   - Language A is **log space reducible** to language B, written A ≤ₗ B, if
    A is mapping reducible to B by means of a log space computable function f.'
  merge: -1
  img_proc: true
