- pgno: 153
  md: '# Context-free Grammars


    +   - Context-free grammars are a more powerful method of describing languages.

    +   - Context-free grammars can describe certain features that have a recursive
    structure.

    +   - E.g. human languages: the relationship of terms such as *noun*, *verb*,
    and *preposition* and their respective *phrases* leads to a natural recursion
    because *noun* phrases may appear inside *verb* phrases and vice versa. Context-free
    grammars can capture important aspects of these relationships'
  merge: -1
  img_proc: true
