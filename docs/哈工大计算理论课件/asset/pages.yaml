- pgno: 302
  md: '# The Diagonalization method


    Definition:


    +   - Assume that we have sets $A$ and $B$ and a function $f$ from $A$ to $B$.

    +   - Say that $f$ is *one-to-one* if it never maps two different elements to
    the same place.

    +     if $f(a) \neq f(b)$ whenever $a \neq b$

    +   - Say that $f$ is *onto* if it hits every elements of $B$

    +     if for every $b \in B$ there is an $a \in A$ such that $f(a) = b$'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# The Diagonalization method\n\n+   - Say that *A* and *B* are the same size\
    \ if there is a one-to-one, onto function (correspondence)\n+   \n+     *f* :\
    \ *A* → *B*\n\n+   - A function that is both one-to-one and onto is called a *correspondence*.\
    \ (So in a correspondence every element of *A* maps to a unique element of *B*\
    \ and each element of *B* has a unique element of *A* mapping to it.)\n\n+   -\
    \ A correspondence is simply a way of *pairing the elements of A with the elements\
    \ of B*."
  merge: -1
  img_proc: true
- pgno: 304
  md: '# The Diagonalization method


    +   - E.g. the set of even integers $E=\{2,4,6,...\}$ and the set of natural numbers
    $N=\{1,2,3,...\}$, give the relation of $|E|$ and $|N|$.

    +   - Using Cantor’s definition of size:

    +     - Correspondence:

    +       $e = f(n) = 2n$ where $n \in N$, $e \in E$

    +   - So $N$ and $E$ have the same size.


    | $n$ | $f(n)$ |

    | --- | --- |

    | 1 | 2 |

    | 2 | 4 |

    | 3 | 6 |

    | $\vdots$ | $\vdots$ |'
  merge: -1
  img_proc: true
