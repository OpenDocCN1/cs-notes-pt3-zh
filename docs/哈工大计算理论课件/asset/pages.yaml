  md: '# The Diagonalization method


    +   - Diagonalization method is discovered by Georg Cantor in order to solve the
    problem of measuring the sizes of infinite sets.

    +   - E.g. the set of even integers $E=\{2,4,6,...\}$ and the set of natural numbers
    $N=\{1,2,3,...\}$, give the relation of $|E|$ and $|N|$.

    +   - $|E| < |N|$????

    +   - Cantor uses “correspondence” to define this problem.'
