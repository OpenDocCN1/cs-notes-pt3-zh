  md: '# Winning Strategies for Games


    # Formula Game


    +   Let φ = ∃x₁∀x₂∃x₃⋯Qx_k(θ)

    +   Q means either ∃ or ∀


    +   Two players A and E, take turn to select variables x₁, ..., x_k.


    +   Player A selects values for the variables that are bound to ∀ quantifiers
    and E selects for those bound to ∃ quantifiers.


    +   The order of player is the same as the quantifiers at the beginning of the
    formula


    +   The end of the game, we use the selected variable to verify θ. If θ is TRUE,
    E wins, otherwise A wins.'
