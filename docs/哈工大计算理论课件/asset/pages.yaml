  md: '# Hierarchy Theorems


    # Definition


    +   - A function $f: N \to N$, where $f(n)$ is at least $O(\log n)$, is called
    **space constructible** if the function that maps the string $1^n$ to the binary
    representation of $f(n)$ is computable in space $O(f(n))$


    +   - i.e. $f$ is space constructible if some $O(f(n))$ space TM exists that always
    halts with the binary representation of $f(n)$ on its tape when started on input
    $1^n$'
