- pgno: 333
  md: '# Undecidable problems from language theory


    +   - $HALT_{TM} = \{\langle M, w\rangle \mid M \text{ is a TM and } M \text{
    halts on input } w\}$

    +     So $HALT_{TM}$ determine whether a Turing machine halts on a given input.


