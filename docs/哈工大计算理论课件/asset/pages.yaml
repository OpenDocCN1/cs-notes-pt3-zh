- pgno: 330
  md: '# Reducibility


    +   - In this chapter we first introduce a method called reduction, to prove that
    some problems are undecidable.

    +   - A reduction is a way of converting one problem A to another problem B in
    such a way that a solution to problem B can be used to solve the problem A.

    +   - When A is reducible to B, solving A cannot be harder than solving B because
    a solution to B gives a solution to A.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Reducibility


    +   - **Example:**

    +     - Problem *A*: measuring the area of a rectangle

    +     - Problem *B*: measuring length and width of a rectangle.

    +     - We can **reduce** *A* to *B*.

    +   - **Example 2:**

    +     - Problem *A*: solving a system of linear equations.

    +     - Problem *B*: inverting a matrix.

    +     - We can **reduce** *A* to *B*.'
  merge: -1
  img_proc: true
- pgno: 332
