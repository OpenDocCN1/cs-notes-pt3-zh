  md: '# Space Hierarchy Theorem


    # Proof Idea:


    +   - We design D to implement the diagonalization method that we used to prove
    the unsolvability of the halting problem A_TM

    +   - If M is a TM that decides a language in o(f(n)) space, D guarantees that
    A differs from M’s language in at least one place

