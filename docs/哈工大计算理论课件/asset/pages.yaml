- pgno: 703
  md: '# Generalized Geography


    Proof:


    +   - We give an algorithm that decides whether Player I has a winning strategy
    in instances of generalized geography, i.e. it decides GG

    +   - M = “On input <G, b>, where G is a directed graph and b is a node of G

    +     1. If b has outdegree 0, reject, because Player I loses immediately

    +     2. Remove node b and all connected arrows to get a new graph G₁

    +     3. For each of the nodes b₁, b₂, …, bₖ that b originally pointed at, recursively
    call M on <G₁, bᵢ>

    +     4. If all of these accept, Player II has a winning strategy in the original
    game, so reject. Otherwise, Player I has it, so accept”'
  merge: -1
  img_proc: true
