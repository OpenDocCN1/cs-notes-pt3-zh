  md: '# Why we need Mathematics?


    +   - Without Mathematics, difficult to **define behavior of an object precisely**

    +   - For software engineering, one still needs mathematical or equivalent model
    to describe the behavior or functionalities of a software

    +   - **In this course, we define the model of behavior of a computer**'
  merge: -1
