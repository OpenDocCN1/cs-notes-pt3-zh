  md: '# Time Hierarchy Theorem


    +   - Time Hierarchy Theorem

    +     - For any time constructible function $t: N \to N$, a language $A$ exists
    that is decidable in $O(t(n))$ time but not decidable in time $o(t(n)/\log t(n))$


    +   - Proof Idea:

    +     - We construct a TM $D$ that decides a language $A$ in time $O(t(n))$ where
    $A$ can not be decided in $o(t(n)/\log t(n))$

    +     - $D$ takes an input $w$ of the form $\langle M \rangle 10^*$ and simulate
    $M$ on input $w$, making sure not to use more than $tn$ time. If $M$ halts within
    that much time, $D$ gives the opposite output'
