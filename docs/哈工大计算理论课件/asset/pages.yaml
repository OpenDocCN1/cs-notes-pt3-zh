  md: '# String and languages


    +   - **Alphabet** is a finite set that is nonempty.

    +     - Σ₁ = {0,1}

    +     - Γ₁ = {a,b,c,...,x,y,z}

    +   - The members of the alphabet are the symbols.

    +   - **String** is a finite sequence of symbols from that alphabet, usually written
    next to one another and not separated by commas.

    +     - w = w₁w₂...wₙ   |w| = n

    +     - **Reverse of w**: wᴿ = wₙ wₙ₋₁...w₁

    +     - **Empty string**: ε

    +     - String z is a substring of w if z apears consecutively within w.'
