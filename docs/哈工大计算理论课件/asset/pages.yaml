- pgno: 681
  md: '# The TQBF Problem


    +   - To show how to construct $\phi$, we solve a more general problem

    +     - Using two collections of variables denoted by configurations $c_1$ and
    $c_2$ and a number $t > 0$, then we construct the formula $\phi_{c_1,c_2,t}$

    +     - If we assign actual configurations to $c_1$ and $c_2$, the formula is
    true iff $M$ can go from $c_1$ to $c_2$ in at most $t$ steps.

    +     - We can let $\phi$ be the formula $\phi_{c_{start},c_{accept},h}$, where
    $h = 2^{d f(n)}$ for a constant d chosen so that $M$ has no more than $2^{d f(n)}$
    possible configurations on input with length $n$

    +     - Here, let $f(n) = n^k$'
  merge: -1
  img_proc: true
- pgno: 682
  md: '# The TQBF Problem


    +   - The formula encodes the contents of tape cells as we did in the proof of
    the Cool-Levin Theorem

    +     - Each cell has several variables associated with it and one for each tape
    symbol and state, corresponding to the possible settings of that cell

    +     - Each configuration has $n^k$ cell, so is encoded by $O(n^k)$ variables

    +     - If $t = 1$, we design the formula to say that either $c_1$ equals $c_2$
    or $c_2$ follows from $c_1$ in a single step of $M$

    +       - **Equality**: Boolean expression for each variables in $c_1$ contains
    the same values as corresponding variables in $c_2$

    +       - **Follows**: Boolean expressions stating that the contents of each triple
    of $c_1$’s cell correctly yields the contents of corresponding triple of $c_2$’s'
  merge: -1
  img_proc: true
- pgno: 683
  md: '# The TQBF Problem


    +   - If t > 1, we construct φ_{c1,c2,t} recursively

    +   - Let φ_{c1,c2,t} = ∃m1 ( φ_{c1,m1,t/2} ∧ φ_{m1,c2,t/2} )


    +   - m1 represent a configuration of M

    +   - ∃m1 is a shorthand for ∃x1,⋯,xl, where l = O(n^k) and x1,⋯,xl are the variables
    that encodes m1

    +   - If M has configuration m1 which can be yielded from c1 within t/2 steps
    and m1 can go from m1 to c2 within t/2 steps, then we construct the formulas φ_{c1,m1,t/2}
    and φ_{m1,c2,t/2} recursively

    +   - The formula φ_{c1,c2,t} has the correct value, i.e. it is true whenever
    M can go from c1 to c2 within t steps.

    +   - But, it is too big because it doubles the size of the formula in each recursion'
  merge: -1
  img_proc: true
- pgno: 684
  md: '# The TQBF Problem


    +   The method shown in previous slide requires t = 2df(n), which is exponential.
    To reduce the size of the formula, we use the ∀ quantifier in addition to the
    ∃ quantifier


    +   Let φ_{c1,c2,t} = ∃m1 ∀(c3,c4) ∈ {(c1,m1),(m1,c2)} ( φ_{c3,c4,t/2} )


    +   The 2 new configurations allow us to “fold” the two recursive subformulas
    into a single subformula while preserving the meaning


    +   ∀(c3,c4) ∈ {(c1,m1),(m1,c2)} means that c3 and c4 may take the values of the
    variables of c1 and m1 or of m1 and c2, respectively, and the resulting formula
    φ_{c3,c4,t/2} is true in either case'
  merge: -1
  img_proc: true
- pgno: 685
  md: '# The TQBF Problem


    +   - Then, we analyze the space used by the new algorithm for the formula φ_{c_start,
    c_accept, h}, where h = 2^{d f(n)}

    +     - At each level of recursion, we add a portion to the formula which is linear
    in the size of the configuration and thus the size is O(f(n))

    +     - The number of levels of the recursion is log 2^{d f(n)}, or O(f(n))

    +     - So, the total space used is O(f^2(n))'
  merge: -1
  img_proc: true
