- pgno: 191
  md: "# Formal definition of pushdown automata\n\n+   - We define a alphabet for\
    \ stack Γ\n+   - Now for every transition, we will consider the state, the input\
    \ and the stack state. So the domain is $Q \\times \\Sigma_{\\varepsilon} \\times\
    \ \\Gamma_{\\varepsilon}$ to determine the next state and the change of stack\
    \ state $Q \\times \\Gamma_{\\varepsilon}$\n+   - As the nondeterminism in model,\
    \ finally the transition function has the form:\n+   \n+     $\\delta : Q \\times\
    \ \\Sigma_{\\varepsilon} \\times \\Gamma_{\\varepsilon} \\rightarrow \\mathrm{P}(Q\
    \ \\times \\Gamma_{\\varepsilon})$"
  merge: -1
