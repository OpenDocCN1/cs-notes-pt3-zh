- pgno: 44
  md: "# Proof by contradiction\n\n+   - Example:\n+     Prove √2 is irrational.\n\
    +   - Proof:\n+     Assume is a rational number and such that √2 = m / n where\
    \ both m and n are integers.\n+   \n+     If both m and n are divisible by the\
    \ same integer greater than 1, doing it does not change the value of the fraction.\
    \ Now, at least one of m and n must be an odd number.\n+   \n+     Then, multiply\
    \ both sides of the equation by n , n√2 = m\n+   \n+     and square both sides\
    \ to obtain 2n² = m²"
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Proof by contradiction


    Because $m^2$ is 2 times the integer $n^2$, we know that $m^2$ is even. Therefore
    $m$ is even. So we can write $m=2k$ for some integer $k$. Thus,


    $$

    2n^2=(2k)^2

    $$

    $$

    n^2=2k^2

    $$


    So $n$ is even too. This is contradict to the predict that at least one of $m$
    and $n$ must be an odd number. So $\sqrt{2}$ can’t be written as a fraction. So
    $\sqrt{2}$ is irrational.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Proof by induction


    +   - Proof by induction is an method used to show that all elements of an infinite
    set have a specified property.

    +   - Take the infinite set to be the natural numbers, N = {1,2,3,...} , and say
    that the property is called P. Our goal is to prove that P(k) is true for each
    natural number k.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Proof by induction


    +   - Steps:

    +     - Basis

    +       Proves that P(1) is true.

    +     - Induction step

    +       Proves that for each i ≥ 1, if P(i) is true, then so is P(i+1).'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Proof by induction


    +   Example:

    +   A monthly payments of home mortgages problem.


    Let P be the principal, the amount of the original loan, I be the yearly interest
    rate. Y be the monthly payment. M be the monthly multiplier ( M = 1 + I / 12 )


    P_t be the amount of loan outstanding after the t-th month.

    so we have P_0 = P and P_t = P_{t-1} M - Y


    +   To prove: for each t ≥ 0 ,


    P_t = P M^t - Y ( (M^t - 1) / (M - 1) )'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Proof by induction


    +   - Proof:

    +     **Basis:**

    +     prove that the formula is true for $t = 0$, that is

    +     (remark: $M^0=1$)

    +     $$P_0 = P M^0 - Y\left(\frac{M^0 -1}{M -1}\right)=P$$

    +     This holds true because we have defined $P_0 = P$. So, we have proved the
    basis of the induction is true.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Proof by induction


    **Induction step:**

    For each $k \ge 0$ assume that the formula is true for $t = k$ and show that it
    is true for $t = k + 1$.

    we have $P_{k+1} = P_k M - Y = \left[ P M^k - Y \left( \frac{M^k - 1}{M - 1} \right)
    \right] M - Y$

    $= P M^{k+1} - Y \left( \frac{M^{k+1} - M}{M - 1} \right) - Y \left( \frac{M -
    1}{M - 1} \right)$

    $= P M^{k+1} - Y \left( \frac{M^{k+1} - 1}{M - 1} \right)$


    Thus the formula is correct for $t = k + 1$, which proves the theorem.'
  merge: -1
  img_proc: true
