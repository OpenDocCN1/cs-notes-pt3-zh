- pgno: 319
  md: "# The Halting problem is undecidable\n\n+   - Take its own description ⟨D⟩\
    \ as input:\n+   \n+     $D(\\langle D\\rangle)=\\begin{cases} accept & \\text{if\
    \ } D \\text{ does not accept } \\langle D\\rangle \\\\ reject & \\text{if } D\
    \ \\text{ accept } \\langle D\\rangle \\end{cases}$\n+   - No matter what $D$\
    \ does, it is forced to do the opposite, which is obviously a contradiction.\n\
    +   - So neither TM $D$ nor TM $H$ can exist."
