- pgno: 581
  md: '# Polynomial time reducibility


    Proof:


    +   - Let $M$ be the polynomial time algorithm deciding $B$ and $f$ be the polynomial
    time reduction from $A$ to $B$. We describe a polynomial time algorithm $N$ deciding
    $A$ as follows.

    +   - $N$ = “ On input $w$:

    +     1. Compute $f(w)$

    +     2. Run M on input $f(w)$ and output whatever $M$ outputs.”

    +   - So if $w \in A$, then $M$ accept $f(w)$. And N runs in polynomial time because
    step 1 runs in polynomial time and stage 2 runs in the composition polynomial
    times which is still a polynomial.'
