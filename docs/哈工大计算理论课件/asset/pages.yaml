  md: '# Complexity relationship among models


    +   - Let M be a k-tape TM that runs in $t(n)$ time. We construct a single tape
    TM S that runs in $O(t^2(n))$ time.

    +   - Copy content of $M$''s $k$ tapes on $S$ consecutively, with the positions
    of $M$''s heads marked on the appropriate squares. This will take $O(n)$ time.'
