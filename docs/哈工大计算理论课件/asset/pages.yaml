  md: '# Circuit Complexity


    +   - **Size complexity** of a circuit family ($C_0$, $C_1$, $C_2$,...) is a function
    $f$: $N \rightarrow N$, where $f(n)$ is the size of $C_n$

    +   - **Depth** of a circuit is the length (number of wires) of the longest path
    from an input variable to the output gate.

    +   - Definition of **depth minimal** and **depth complexity** are similar to
    the one for circuit size, but use depth to instead of size

    +   - **Circuit size complexity of a language** is the size complexity of fa minimal
    circuit family for that language.

    +   - Circuit depth complexity is defined similar to size’s'
  merge: -1
  img_proc: true
- pgno: 827
  md: '# Circuit Complexity


    +   - The circuit complexity of a language is related to its time complexity

    +   - **Theorem**

    +     - Let $t: N \to N$ be a function, where $t(n) \ge n$

    +     - If $A \in \text{TIME}(t(n))$, then $A$ has a circuit complexity $O(t^2(n))$

    +   - This theorem gives an approach to proving that P is not equal to NP whereby
    we attempt to show that some language in NP has more than polynomial circuit complexity'
  merge: -1
  img_proc: true
- pgno: 828
  md: '# Circuit Complexity


    +   Proof Idea:

    +   - Let M be a TM that decides A in time t(n), we ignore O(t(n)) for simplicity

    +   - For each n we construct a circuit Cₙ that simulates M on inputs of length
    n

    +   - The gates of Cₙ are organized in rows, one for each of the t(n) step in
    M’s computation on an input of length n

    +   - Each row of gates represents the configuration of M at the corresponding
    step

    +   - Each row is wired into the previous row so that it can calculate its configuration
    from previous row’s configuration'
  merge: -1
  img_proc: true
- pgno: 829
  md: '# Circuit Complexity


    +   - Proof Idea:

    +     - We modify M so that the input is encoded into {0,1}

    +     - When M is about to accept, it moves its head onto the leftmost tape cell
    and writes the blank symbol on that cell prior to entering the accept state

    +     - Then, we can designate a gate in the final row of the circuit to be the
    output gate'
  merge: -1
  img_proc: true
