  md: '# Polynomial time reducibility


    # Polynomial time computable function:


    +   A function $f : \Sigma^* \to \Sigma^*$ is a polynomial time computable function
    if some polynomial time Turing machine $M$ exists that halts with just $f(w)$
    on its tape, when started on any input $w$.'
