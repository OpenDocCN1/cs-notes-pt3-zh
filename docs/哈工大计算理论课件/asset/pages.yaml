  md: '# Classes L and NL


    +   - Until now, we consider time and space complexities to be at least linear,
    i.e. f(n) is at least n

    +   - A smaller one is sublinear space bound

    +     - In time complexity, it is insufficient to scan once on the entire content
    on the tape

    +     - In sublinear space complexity, the machine reads the entire content, but
    it does not have enough space to store it

    +     - We introduce a new type of TM which has two tapes

    +       - Read-only input tape – CD-ROM or DVD-ROM

    +       - Read/write work tape – RAM

    +         - Only cells scanned on work tape contribute to space complexity'
  merge: -1
