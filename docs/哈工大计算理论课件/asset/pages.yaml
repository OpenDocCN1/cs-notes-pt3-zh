- pgno: 794
  md: '# Exponential Space Completeness


    Proof:


    +   The following nondeterministic algorithm tests whether two NFAs are inequivalent


    +   N = “On input < N₁, N₂ >, where N₁ and N₂ are NFAs:


    +   1. Place a marker on each of the start states of N₁ and N₂


    +   2. Repeat 2^{q₁+q₂} times, where q₁ and q₂ are the numbers of states in N₁
    and N₂


    +   3. Nondeterministically select an input symbol and change the positions of
    the markers on the states of N₁ and N₂ to simulate reading that symbol


    +   4. If at any point, a marker was placed on an accept state of one of the FA
    and not on any accept state of the other FA, accept. Otherwise, reject”'
  merge: -1
  img_proc: true
- pgno: 795
  md: '# Exponential Space Completeness


    +   - Proof:

    +     - If $N_1$ and $N_2$ are equivalent, $N$ clearly rejects because it only
    accepts when one accepts a string that the other does not accept

    +     - If the FA are not equivalent, some string is accepted by one, but not
    the other and such string must be of the length at most $2^{q_1+q_2}$

    +     - A string longer than that consists of repeating portion and marker will
    be placed repeatedly, so we could remove it without affecting the result

    +     - Hence, $N$ would guess this string among its nondeterministic choices
    and would accept

    +     - Thus, $N$ operate correctly'
  merge: -1
