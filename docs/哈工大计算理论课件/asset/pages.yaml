    +   - Another example:

    +     - $ALL_{NFA} = \{<A> \mid A \text{ is a NFA and } L(A) = \Sigma^*\}$

    +     - This is to determine whether a NFA accept all strings

    +     - Instead of directly implementing an algorithm to deal with it, we implement
