  md: '# Relativization


    Definition:


    +   - An oracle for a language A is device that is capable of reporting whether
    any string w is a member of A.

    +   - An oracle Turing machine M^A is a modified TM that has the additional capability
    of querying an oracle.

    +   - Whenever M^A writes a string on a special oracle tape it is informed whether
    that string is a member of A, in a single computation step

    +   - Let P^A be the class of language decidable with a polynomial time oracle
    TM that uses oracle A.

    +   - Define NPA similarly'
