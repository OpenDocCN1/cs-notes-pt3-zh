  md: '# Turing-unrecognizable language


    +   - **The set of all Turing machines is countable.**

    +     - Each Turing machine M has an encoding into a string ⟨M⟩.

    +     - Omit those strings that are not legal encodings of Turing machines, we
    can list all Turing machines.

    +   - **The set of all languages (L) is uncountable.**

    +     - The set of all infinite binary sequences (B) is uncountable.

    +     - The correspondence of the set of all languages over alphabet Σ (L) with
    B.'
