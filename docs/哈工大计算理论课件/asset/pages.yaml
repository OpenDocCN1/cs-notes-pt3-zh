- pgno: 97
  md: '# Formal definition of computation of NFA


    +   - Let $N = (Q, \Sigma, \delta, q_0, F)$ be a NFA and let $w = y_1 y_2 ...
    y_n$ be a string where each $y_i$ is a member of the alphabet $\Sigma_\varepsilon$.
    Then $N$ accepts $w$ if a sequence of states $r_0, r_1, ... r_m$ in $Q$ exists
    with three conditions:;

    +     - $r_0 = q_0$

    +     - $r_{i+1} \in \delta(r_i, y_{i+1})$, for $i = 0, ..., m-1$, and

    +     - $r_m \in F$

    +   - So we can say that $N$ recognizes language $A$ if $A = \{w \mid N \text{
    accepts } w\}$'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Equivalence of NFAs and DFAs


    +   - Two machines are equivalent if they recognize the same language.

    +   - Theorem:

    +     - Every nondeterministic finite automaton has an equivalent deterministic
    finite automaton.

    +   - Proof:

    +     - Let $N = (Q, \Sigma, \delta, q_0, F)$ be the NFA recognizing some language
    $A$. We construct a DFA $M = (Q'', \Sigma, \delta'', q_0'', F'')$ recognizing
    $A$.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Equivalence of NFAs and DFAs


    Consider the case where N has no ε arrow.


    +   - Q'' = P(Q)


    +   - δ''(R, a) = { q ∈ Q | q ∈ δ(r, a) for some r ∈ R }

    +     = δ''(R, a) = ∪_{r∈R} δ(r, a)


    +   - R is a state of M, it is also a set of states of N.


    +   - When M reads a symbol a in state R, it shows where a takes each state in
    R.


    +   - Because each state may go to a set of states, we take the union of all these
    sets.


    +   - q₀'' = {q₀}


    +   - F'' = { R ∈ Q'' | R contains an accept state of N }'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Equivalence of NFAs and DFAs


    +   - Consider the ε arrows.

    +     - For $R \subseteq Q$ (or $R \in \mathbf{P}(Q)$), let

    +     - $E(R)=\{\,q \mid q\text{ can be reached from }R\text{ by traveling along
    0 or more }\varepsilon\text{ arrows}\}$

    +     - Change

    +       - $\delta''(R, a)=\{\,q \in Q \mid q \in E(\hat{\delta}(r, a))\text{ for
    some }r \in R\}$

    +       - $q_0'' = E(\{q_0\})$


    +   - We have now completed the construction of the DFA $M$ that simulates the
    NFA $N$.


    The construction of $M$ obviously works correctly. At every step in the computation
    of $M$ on an input, it clearly enters a state that corresponds to the subset of
    states that $N$ could be in at that point. Thus, our proof is complete.'
  merge: -1
  img_proc: true
