- pgno: 656
  md: '# Space Complexity


    N = “On input <M> where M is an NFA


    +   1. Place a marker on the start state of the NFA

    +   2. Repeat 2^q times, where q is the number of states of M

    +   3. Nondeterministically select an input symbol and change the positions of
    the markers on M’s states to simulate reading that symbol

    +   4. If a marker was ever placed on an accept state, reject; otherwise accept.'
  merge: -1
  img_proc: true
- pgno: 657
  md: '# Space Complexity


    +   - If $M$ accepts any strings, it must accept one of length at most $2^q$ because
    strings longer than this length consist of repeated substring and markers are
    placed repeatedly.

    +   - The repetition part in the string could be removed to obtain a shorter accepted
    string. Hence, $N$ decides $ALL_{NFA}$.

    +   - This algorithm only needs space to store the location of the markers and
    therefore it runs in nondeterministic space $O(n)$.'
  merge: -1
  img_proc: true
- pgno: 658
  md: '# Savitch’s Theorem


    +   - One of the earliest results about space complexity

    +   - This theorem shows that deterministic machines can simulate nondeterministic
    machines by using surprisingly small amount of space

    +     - For time complexity, Savitchs’ theorem shows that DTM needs a exponential
    increase in time to simulate NTM

    +     - For space complexity, any NTM uses $f(n)$ space can be converted to a
    DTM uses only $f^2(n)$ space'
  merge: -1
  img_proc: true
- pgno: 659
  md: '# Savitch’s Theorem


    +   - Definition of Savitch’s Theorem

    +     - For any function $f: N \to R+$, where $f(n) \ge n$, NSPACE$(f(n)) \subseteq$
    SPACE$(f^2(n))$'
  merge: -1
  img_proc: true
- pgno: 660
  md: '# Savitch’s Theorem




    +   - We may simulate an f(n) spce NTM deterministically


    +   - The simplest way is try out all the branches of the NTM computation, one
    by one


    +   - Then, we keep track of the branch’s current status to resume this branch
    later


    +   - However, each branch uses f(n) space and each branch may produce another
    nondeterministic branches


    +   - We need 2^{O(f(n))} space for this approach, too bad'
  merge: -1
  img_proc: true
- pgno: 661
  md: '# Savitch’s Theorem


    +   - Instead, we consider a more general problem:

    +     - We are given 2 configurations of the NTM, $c_1$ and $c_2$, and a number
    $t$. We need to decide that can the NTM get from $c_1$ to $c_2$ within $t$ steps.

    +     - We call this problem the **Yieldability Problem**

    +     - If $c_1$ is the starting configuration and $c_2$ is the accept configuration
    and $t$ is the max. no. of the step that the nondeterministic machine can get
    from $c_1$ to $c_2$, then we can determine whether the machine accept its input'
  merge: -1
  img_proc: true
- pgno: 662
  md: "# Savitch's Theorem\n\nWe give a deterministic, recursive algorithm to solve\
    \ this problem\n\n+   • It searches an intermediate configuration c_m and recursively\
    \ testing whether:\n+   \n+   1. c1 can get to c_m within t/2 steps\n+   \n+ \
    \  2. c_m can get to c2 within t/2 steps\n\n+   • Each iteration in the loop uses\
    \ O(f(n)) to store the configuration\n\n+   • The depth of the recursion is log\
    \ t, we have t = 2^{O(f(n))} and therefore log t = O(f(n))\n\n+   • So, the total\
    \ space needed is O(f^{2}(n))"
  merge: -1
  img_proc: true
- pgno: 663
  md: '# Savitch’s Theorem


    +   - Proof:

    +     - Let $N$ be an NTM deciding a language $A$ in space $f(n)$

    +     - Then, we construct a DTM $M$ to decide language $A$

    +     - We use the procedures described in previous slide to build the procedure
    called CANYIELD

    +     - Let $w$ be an input string of $N$ and it generates two configurations
    $c_1$ and $c_2$.

    +     - CANYIELD$(c_1, c_2, t)$ outputs accept if $N$ can go from $c_1$ to $c_2$
    within $t$ steps along some nondetereministic path'
  merge: -1
  img_proc: true
- pgno: 664
  md: '# Savitch’s Theorem


    +   CANYIELD = “On input $c_1$, $c_2$ and $t$:

    +   1. If $t = 1$, then test directly whether $c_1 = c_2$ or whether $c_1$ yields
    $c_2$ in one step by $N$. Accept if either one test succeeds; reject otherwise.

    +   2. If $t > 1$, then for each configuration $c_m$ of $N$ on $w$ using space
    $f(n)$:

    +      3. Run CANYIELD($c_1$, $c_m$, $t/2$)

    +      4. Run CANYIELD($c_m$, $c_2$, $t/2$)

    +      5. If steps 3 and 4 both accept, then accept

    +   6. If have not yet accepted, reject”'
  merge: -1
  img_proc: true
- pgno: 665
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 666
  md: '# Savitch’s Theorem


    +   - **M** = “On input **w**:

    +     1. Output the result of `CANYIELD(c_start, c_accept, 2^{df(n)})`.”


    +   - CANYIELD solves the yieldability problem and hence **M** correctly simulate
    **N**


    +   - Whenever CANYIELD invokes itself recursively, the current stage number and
    *c₁*, *c₂* and *t* are stored on a stack for the use after returning from the
    recursion

    +     - So, each level uses *O(f(n))* space

    +     - And the depth of recursion is *O(log₂^{df(n)}) = O(f(n))*


    +   - Therefore, the total space needed is *O(f²(n))*'
  merge: -1
  img_proc: true
- pgno: 667
  md: "# The Class PSPACE\n\n+   - Definition:\n+     - PSPACE is the class of language\
    \ that are decidable in polynomial space on a DTM. In other words,\n+       \n\
    +       $$\\text{PSPACE}=\\bigcup_{k}\\text{SPACE}(n^{k})$$\n+     - Interestingly,\
    \ we do not need to define a counterpart for the NP class. In the light of Savitch’s\
    \ theorem:\n+       \n+       $$\\text{PSPACE}=\\text{NPSPACE}$$"
  merge: -1
  img_proc: true
- pgno: 668
  md: '# The Class PSPACE


    +   - Relationship between classes for time complexity and classes for space complexity:

    +     - A machine runs quickly can not use a lot of space

    +     - More precisely, for $t(n) \geqslant n$, any machine that operates in time
    $t(n)$ can use at most $t(n)$ space because a machine can only explore one cell
    at each step of its computation


    P ⊆ PSPACE'
  merge: -1
  img_proc: true
- pgno: 669
  md: '# The Class PSPACE


    +   - Similarly, NP ⊆ NPSPACE and so NP ⊆ PSPACE

    +   - Conversely, for f(n) ≥ n, a TM that uses f(n) space can have at most f(n)2^{O(f(n))}
    different configurations

    +     - Remember that a TM that halts may not repeat a configuration

    +     - So, TM uses f(n) space must run in time f(n)2^{O(f(n))}


    PSPACE ⊆ EXPTIME = ⋃ₖ TIME(2^{n^k})'
  merge: -1
  img_proc: true
- pgno: 670
  md: '# The Class PSPACE


    +   In summary, we have

    +   P ⊆ NP ⊆ PSPACE = NPSPACE ⊆ EXPTIME


    +   We do not know whether any these containments is actually an equality


    +   Some classes may be merged like the one Savitch’s theorem does


    +   However, P ≠ EXPTIME, so at least one the preceding containments is proper,
    but we do not know which one'
