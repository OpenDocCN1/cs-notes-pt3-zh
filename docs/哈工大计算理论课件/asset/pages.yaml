- pgno: 215
  md: '# Turing Machines


    +   - In summary, $M_1$’s algorithm is as follows.

    +   - $M_1$ =“On input string $w$:


    +   - Zigzag across the tape to corresponding positions on either positions on
    either side of the # symbol:


    +   - check whether these positions contain the same symbol.

    +   - If they not, or if no # is found, reject.

    +   - Cross off (×) symbols as they are checked to keep track of which symbols
    correspond.


    +   - When all symbols to the left of the # have been crossed off, check for any
    remaining symbols to the right of the #.


    +   - If any symbols remain, reject

    +   - otherwise, accept.”'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Formal definition of a Turing Machines


    Note before the definition:


    +   - Though we give the formal definition to a TM, in actuality we almost never
    give formal descriptions of Turing machines because they tend to be very big.

    +   - For the transition function δ in a TM definition, it takes the form: δ :
    Q × Γ → Q × Γ × {L, R}

    +     - where L or R indicates a move to the left or right.

    +     - E.g. δ(q, a) = δ(r, b, L) indicates the machine writes the symbol b replacing
    the a, and goes to state r.'
  merge: -1
