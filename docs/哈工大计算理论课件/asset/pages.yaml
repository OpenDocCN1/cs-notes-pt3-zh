- pgno: 4
  md: '# Relevance to Graduate Students


    +   - When one wants to publish a good journal paper, he/she needs to **define
    the problem and the solution precisely**

    +   - For comparing two software tools or algorithms, one can not just state that
    *A* is faster than *B* by 2 seconds in my machine. Instead, you need to state
    and **compare their computational complexity**

    +   - For a difficult problem, you need to indicate that this problem is very
    hard, by mathematical analysis, and then propose a simplified algorithm to deal
    with it

    +   - For problem that is not computable or is highly complex, one should propose
    an **computable algorithm** with a **reasonable complexity** by trading-off to
    have sub-optimal solution instead of perfect one'
  merge: -1
  img_proc: true
