  md: '# NL equals to coNL


    # Proof Idea


    +   - Let *c* be the number of nodes in *G* that are reachable from *s*

    +     - We assume that c is an input to *M*

    +   - Given *G*, *s*, *t* and *c*, the machine *M* operates as follows.

    +   - *M* goes through **all the *m* nodes in *G***, one by one, and guess whether
    each one is **reachable from *s***

    +   - Whenever a node *u* is guessed to be reachable, m attempts to verify this
    guess by guessing a path of length *m* or less from *s* to *u*. If a computation
    branch fails to verify it, *reject*

    +   - If a computation branch guesses that t is reachable, *reject*

    +   - When branches goes through all nodes and it checks the number of nodes reachable
    from *s* is equal to *c*, *accept*; otherwise, *reject*'
