- pgno: 86
  md: '# Nondeterminism


    +   - The difference between DFA and NFA

    +     1. Every state of a DFA always has exactly one exiting transition arrow
    for each symbol in the alphabet.

    +        A state of a NFA may have zero, one or many exiting arrows for each alphabet
    symbol.

    +     2. In a DFA, labels on the transition arrows are symbols from the alphabet,
    while ε is added in a NFA.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Nondeterminism


    +   NFA running mechanism:

    +   - When NFA reads a symbol and is at a state with multiple out-going arrows
    with this symbol, NFA splits into multiple copies of itself. Remember these copies
    and follows all the possibilities in parallel.

    +     - If there are subsequent choices, the machine splits again.

    +     - If the next input symbol doesn’t appear on any of the arrows exiting the
    state, that copy of the machine dies, along with the branch of the computation
    associated with it.

    +     - If any one of these copies of the machine is in an accept state at the
    end of the input, the NFA accepts the inputs string.

    +     - If a state with an ε arrow is encountered, the machine splits into multiple
    copies without reading any input, one following each of the existing ε arrow and
    one staying at the current state.


    ![](img/505b35cb28b35d38fc29ccba74c23087_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Nondeterminism


    +   - **NFA running mechanism:**

    +     - Tree of possibilities.

    +       - The root of the tree corresponds to the start of the computation.

    +       - Every branching point in the tree corresponds to a point in the computation
    at which the machine has multiple choices.

    +       - The machine accepts if at least one of the computation branches ends
    in an accept state.


