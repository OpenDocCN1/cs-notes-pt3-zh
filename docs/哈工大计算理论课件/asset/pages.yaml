  md: "# Formal definition of a Turing Machines\n\n# Yields\n\n+   - Configuration\
    \ $C_1$ yields configuration $C_2$ if the Turing machine can legally go from $C_1$\
    \ to $C_2$ in a single step.\n+   - Formally:\n+   - Suppose that we have $a$,\
    \ $b$, and $c$ in $\\Gamma$, as well as $u$ and $v$ in $\\Gamma^*$ and states\
    \ $q_1$ and $q_2$. In that case $uaq_i bv$ and $uaq_j acv$ are two configurations.\
    \ Say that\n+   \n+     $uaq_i bv$ yields $uaq_j acv$ if $\\delta(q_i,b)=(q_j,c,L)$\n\
    +   \n+     $uaq_i bv$ yields $uacq_jv$ if $\\delta(q_i,b)=(q_j,c,R)$"
