- pgno: 672
  md: '# PSPACE-Completeness


    # Definition


    +   - A language *B* is **PSPACE-complete** if it satisfies two conditions:

    +     1. *B* is in PSPACE and

    +     2. Every *A* in PSPACE is polynomial time reducible to *B*

    +   - If *B* merely satisfies condition 2, we say that it is **PSPACE-hard**'
  merge: -1
  img_proc: true
- pgno: 673
  md: '# PSPACE-Completeness


    +   - Why use polynomial time reducible?

    +     - Complete problems are important because they are the most difficult problem
    in the class

    +     - They are most difficult because all other problems in the class could
    be reduced to it

    +     - If one finds a simple solution to it, the solution can also be used to
    solve entire class’s problems

    +     - The reduction method must be simple, otherwise the simple solution to
    a complete problem may not yield a simple solution to other problems in the class'
  merge: -1
  img_proc: true
- pgno: 674
  md: '# The TQBF Problem


    +   - TQBF = {< φ > | φ is a true fully quantified Boolean formula}

    +     - E.g. For the universe of {0, 1}

    +       φ = ∀x∃y[(x ∨ y) ∧ (x̄ ∨ ȳ)]

    +     - E.g. For the universe of Natural Numbers

    +       φ = ∀x(x + 1 > x)          φ = ∃y(y + y = 3)

    +     - E.g. For the universe of Real Numbers

    +       φ = ∃y(y + y = 3)'
  merge: -1
  img_proc: true
- pgno: 675
  md: '# The TQBF Problem


    +   - Theorem:

    +     - TQBF is PSPACE-complete

    +   - Proof Idea:

    +     - We give a straightforward algorithm that assigns values to the variables
    and recursively evaluates the truth of the formula for those values

    +     - Then, we show every language A in PSPACE reduces to TQBF in polynomial
    time

    +       - We begin with a polynomial space-bounded TM for A

    +     - Then, we give a polynomial time reduction between them

    +       - The φ will be true iff the machine accepts'
  merge: -1
  img_proc: true
- pgno: 676
  md: '# The TQBF Problem


    +   - Firstly, we may try to imitate the proof of the Cook-Levin Theorem.

    +     - We construct a formula φ that simulates M on input w by expressing the
    requirements for an accepting tableau

    +     - The width of the tableau is O(n^k), the space used by M

    +     - But, its height is exponential in n^k because M can run for exponential
    time

    +     - So, this is not a good choice

    +       - A polynomial time reduction can not produce an exponential-size result'
  merge: -1
  img_proc: true
- pgno: 677
  md: '# The TQBF Problem


    +   - Instead, we use technique related to the proof of Savitch’s Theorem to construct
    the formula.

    +     - The formula divides the tableau into halves and employs the universal
    (∀) quantifier to represent each half with the same part of the formula'
  merge: -1
  img_proc: true
- pgno: 678
  md: '# The TQBF Problem


    +   - Proof:

    +     - The polynomial space algorithm deciding TQBF

    +     - T = “On input < φ >, a fully quantified Boolean formula

    +       1. If φ contains no quantifier, then it is an expression with only constants,
    so evaluate φ and *accept* if it is true; otherwise *reject*

    +       2. If ∃x θ, recursively call T on θ, first with 0 substituted for x and
    then 1 for x. If *either* result is accept, then *accept*; otherwise *reject*

    +       3. If ∀x θ, recursively call T on θ, first with 0 substituted for x and
    then 1 for x. If *both* result is accept, then *accept*; otherwise *reject*”'
  merge: -1
  img_proc: true
- pgno: 679
  md: '# The TQBF Problem


    +   - Algorithm T decides TQBF.

    +   - Total space needed for T is O(m), where m is the number of variables

    +     - The depth of recursion is at most the number of variables

    +     - In every iteration, only one variable is needed to be stored

    +     - So, T runs in linear space'
  merge: -1
  img_proc: true
- pgno: 680
  md: '# The TQBF Problem


    +   - Then, we show that TQBF is PSPACE-hard.

    +   - Let $A$ be a language decided by a TM $M$ in space $n^k$ for some constant
    $k$

    +   - We give a polynomial time reduction from $A$ to TQBF

    +     - We map a string $w$ to a quantified Boolean formula $\phi$ that is true
    iff $M$ accepts $w$'
  merge: -1
