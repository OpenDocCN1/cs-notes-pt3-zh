    we utilize the technique of reductions via computation histories


    +   - Given a TM M for A, we design a polynomial time reduction mapping an input
    w to a pair of expressions R₁ and R₂, that are equivalent exactly when M accepts
    w


    +   - The expressions R₁ and R₂ simulate the computation of M on w


    +   - Expression R₁ generates all stings over the alphabet consisting of symbols
    that may appear in computation histories


    +   - Expression R₂ generates all stings that are not rejecting computation histories'
