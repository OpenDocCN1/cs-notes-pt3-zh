- pgno: 731
  md: '# NL-Completeness


    +   - We also define an NL-complete language to be one which is in NL and any
    other language in NL is reducible to it

    +   - But we do not use polynomial time reducibility here

    +     - Because ALL problems in NL are solvable in polynomial time

    +     - Every two problems in NL except NULL and Σ* are polynomial time reducible
