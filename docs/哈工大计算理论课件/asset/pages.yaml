- pgno: 158
  md: '# Context-free Grammars


    +   - The process to generate the strings of the context-free language:

    +     1. Write down the start variable.

    +     2. Find a variable that is written down and a rule that starts with that
    variable. Replace the written variable with the right-hand side of that rule.

    +     3. Repeat step 2 until no variables remain.'
