- pgno: 217
  md: "# Formal definition of a Turing Machines\n\n+   - A Turing machine is a 7-tuple\
    \ ($Q, \\Sigma, \\Gamma, \\delta, q_0, q_{accept}, q_{reject}$) where $Q, \\Sigma$\
    \ and $\\Gamma$ are all finite sets, and\n+     - $Q$ is the set of states,\n\
    +     - $\\Sigma$ is the input alphabet not containing the blank symbol $\\sqcup$,\
    \ \n+     - $\\Gamma$ is the tape alphabet, where $\\sqcup \\in \\Gamma$ and $\\\
    Sigma \\subseteq \\Gamma$\n+     - $\\delta : Q \\times \\Gamma \\to Q \\times\
    \ \\Gamma \\times \\{L, R\\}$ is the transition function,\n+     - $q_0$ is the\
    \ start state, and\n+     - $q_{accept} \\in Q$ is the set of accept states, and\n\
    +     - $q_{reject} \\in Q$ is the set of reject states, where $q_{accept} \\\
