- pgno: 95
  md: '# Formal definition of NFA


    +   - Let **P**(*Q*) be the power set of *Q* which is the collection of all subsets
    of *Q*, Σ_ε = Σ ∪ { ε }

    +   - A nondeterministic finite automaton is a 5-tuple (*Q*, Σ, δ, *q*₀, *F*),
    where

    +     1. *Q* is a finite set of states,

    +     2. Σ is a finite alphabet,

    +     3. δ : *Q* × Σ_ε → **P**(*Q*) is the transition function

    +     4. *q*₀ ∈ *Q* is the start state, and

    +     5. *F* ⊆ *Q* is the set of accept states.'
  merge: -1
  img_proc: true
- pgno: 96
