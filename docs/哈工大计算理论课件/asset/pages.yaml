  md: '# Space Hierarchy Theorem


    +   - Proof Idea:

    +     - If M runs in *o(f(n))* space, *D* must guarantee that its language is
    different from *M*’s

    +       - However, even *M* runs in *o(f(n))* space, it may uses more than *f(n)*
    space when *n* is small

    +         - E.g. 100n²

    +       - Then *D* will miss the opportunity to avoid *M*’s language

    +       - To avoid it, instead of running *M* when *D* receives input <M>, it
