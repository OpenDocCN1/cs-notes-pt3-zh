- pgno: 722
  md: '# Classes L and NL


    Usually, CD-ROM or DVD-ROM stores much more data than RAM does.


    +   We design the sublinear space algorithm to use very few memory


    # Definition


    L is the class of languages that are decidable in logarithmic space on a DTM


    ```

    L = SPACE(log n)

    ```


    NL is the class of languages that are decidable in logarithmic space on a NTM


    ```

    NL = NSPACE(log n)

    ```'
  merge: -1
  img_proc: true
- pgno: 723
  md: '# Classes L and NL


    +   - We ignore $\sqrt{n}$ and $\log^2 n$, just similar to the reason that we
    ignore $n^2$, etc, in polynomial time and space bounds

    +   - Logarithmic space is large enough to solve a number of interesting computational
    problems

    +   - It has attractive Maths. Properties

    +     - E.g. robustness even when machine model and input encoding method change

    +     - Pointers into the input may be represented in logarithmic space

    +       - The power of log space algorithms is to consider the power of a fixed
    number of input pointers'
  merge: -1
  img_proc: true
- pgno: 724
  md: '# Classes L and NL


    +   - Example

    +     - The language $A = \{0^k1^k \mid k \ge 0\}$ is a member of L

    +       - Remember that we zigzagging back and forth across the input and crossing
    off the 0s and 1s as they are matched?

    +       - This uses linear space to record the positions have been crossed off

    +       - We may modify it to use only log space

    +     - Instead, we use our new TM which places the input on the read-only tape

    +       - The machine counts the number of 0s and, separately, the number of 1s
    in binary on the work tape

    +       - Counter uses only logarithmic space

    +       - So, the algorithm runs in $O(\log n)$ and $A \in L$'
  merge: -1
  img_proc: true
- pgno: 725
  md: '# Classes L and NL


    +   - Example

    +     - Recall the PATH problem

    +     - PATH is in P, but uses only linear space

    +     - We may construct a NTM to decide PATH with log space


    PATH = {⟨g,S,T⟩ | G is a directed graph that has a directed path from s to t}


    +   - The NTM nondeterministically guesses the path from s to t

    +   - The NTM only records the current node on the path, instead of the entire
    path

    +   - Then, the NTM nondeterministically select the next node connecting to the
    current node

    +   - It repeats until it reaches node t and accepts or it has gone on for m (the
    number of nodes in graph) steps and reject'
  merge: -1
  img_proc: true
- pgno: 726
  md: '# Classes L and NL


    +   - Example of PATH

    +     - So, the new algorithm decides PATH using only log space and therefore
    PATH is in NL


    +   - Remember that we claimed that any $f(n)$ space bounded TM runs in time $2^{O(f(n))}$?

    +     - This is no longer true for very small space bounds

    +     - E.g. a TM uses $O(1)$ space may run for $n$ steps'
  merge: -1
