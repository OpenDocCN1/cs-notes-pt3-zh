- pgno: 650
  md: '# Space Complexity


    +   - Definition of Space Complexity

    +     - Let $M$ be a **DTM** that halts on all inputs

    +     - The space complexity of M is the function $f: N \rightarrow N$

    +       - $f(n)$ is the max. no. of tape cells that $M$ scans on any input of
    length $n$

    +       - If the space complexity of $M$ is $f(n)$, we say that $M$ runs in space
    $f(n)$'
  merge: -1
  img_proc: true
- pgno: 651
  md: '# Space Complexity


    +   - **Definition of Space Complexity**

    +     - Let *M* be a **NTM** that halts on all inputs

    +     - The space complexity of M is the function

    +       *f : N → N*

    +       - *f(n)* is the max. no. of tape cells that *M* scans **on any branch
    of its computation** for any input of length *n*'
  merge: -1
  img_proc: true
- pgno: 652
  md: '# Space Complexity


    +   Definition of **Space Complexity Classes**


    +   Let f: N → R⁺ be a function


    +   SPACE(f(n)) = {L | L is a language decided by an O(f(n)) space DTM}


    +   NSPACE(f(n)) = {L | L is a language decided by an O(f(n)) space NTM}'
