- pgno: 505
  md: "# Complexity relationship among models\n\n+   - To simulate each step of M\n\
    +   \n+     I. S scans all the information stored on its tape on determine the\
    \ symbols under M's tape head\n+   \n+     II. then S make another pass over its\
    \ tape to update the tape contents and head position.\n\nNote: if one of M's heads\
    \ moves rightward onto the previously unread portion of its tape, S must increase\
