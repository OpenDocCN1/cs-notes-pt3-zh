  md: '# Finite Automata


    +   - Briefly, FA:

    +     - Current State + Input → Next State

    +   - As a computer, FA:

    +     - can read

    +     - can not write

    +     - no memory (only register to store states and input)

    +     - can not perform reasoning

    +     - no imagination

    +     - That is, computation here is to judge the last state.'
