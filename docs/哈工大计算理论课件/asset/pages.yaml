- pgno: 211
  md: '# Turing Machines


    +   - Initially the tape contains only the input string and is blank (␣) every
    where else.

    +   - Then the machine continues computing until it decides to produce an output.

    +   - The outputs *accepts* and *reject* are obtained by entering designated accepting
    and rejecting states.

    +   - Therefore, if the machine doesn’t enter accepting or a rejecting state,
    it will go on forever, never halting.'
