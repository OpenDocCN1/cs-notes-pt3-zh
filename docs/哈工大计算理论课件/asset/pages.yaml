- pgno: 147
  md: '# Nonregular languages


    +   - Using pumping lemma to prove a language B is not regular.

    +     - Assume B is regular to prove by contradiction.

    +     - Use pumping lemma to guarantee the existence of a pumping length p such
    that all strings of length p or greater in B can be pumped.

    +     - Find a string s in B that has length p or greater but that cannot be pumped.

    +     - Demonstrate that s cannot be pumped by considering all ways of dividing
    s into x, y, and z and, for each such division, finding a value i where xy^i z
    ∉ B. Therefore, there is a contradiction.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Nonregular languages


    Example:


    +   - $B = \{0^n1^n | n \geqq 0\}$ is not regular.

    +   - Proof:

    +   - Assume that $B$ is regular.


    +   - Let $p$ be the pumping length given by the pumping lemma.

    +   - Choose $s$ to be the string $0^p1^p$. Because $s$ is a member of $B$ and
    $s$ has length more than $p$, the pumping lemma guarantees that $s$ can be split
    into three pieces, $s = xyz$, where for any $i \geqq 0$ the string $x$ is in $B$.
    so


    +   - $y$ consists only of **0**s. In this case the string $xyyz$ has more **0**s
    than **1**s and so is not a member of $B$, violating condition 1.

    +   - $y$ consists only of 1s.more **1**s than **0**s.

    +   - $y$ consists both **0**s and **1**s. $xyyz$ may have the same number of
    **0**s and **1**s, but there must be a **1** before **0**, and so is not a member
    of $B$.


    +   - Thus a contradiction is unavoidable, B is not regular.'
  merge: -1
