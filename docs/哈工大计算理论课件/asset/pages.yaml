    +   - We focus almost exclusively on space bounds $f(n)$ which are at least log
    $n$.

    +   - So, our claim of a machine is at most exponential in its space complexity
    remains true for such bounds because $n2^{O(f(n))}$ is $2^{O(f(n))}$ when $f(n)
    \geqslant n$'
  merge: -1
