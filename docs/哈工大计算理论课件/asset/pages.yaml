- pgno: 349
  md: '# Reductions via computation histories


    +   - The computation history for a Turing machine on an input is simply the sequence
    of configurations that the machine goes through as it processes the input. It
    is a complete record of the computation of this machine.

    +   - The computation history method is an important technique for proving that
    $A_{TM}$ is reducible to certain languages. It is often useful when the problem
    to be shown undecidable involves testing for the existence of something.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Reductions via computation histories


    +   - Let $M$ be a Turing machine and $w$ an input string. An **accepting computation
    history** for $M$ on $w$ is a sequence of configurations, $C_1, C_2, ..., C_l,$

    +     - $C_1$ is the start configuration of $M$ on $w,$

    +     - $C_l$ is an **accepting configuration** of $M,$

    +     - each $C_{i+1}$ legally follows from $C_i$ according to the rules of $M.$

    +   - A **rejection computation history** for M on w is defined similarly, except
    that $C_l$ is a rejecting configuration.

    +   - So accepting computation histories are **finite sequences**.

    +   - If $M$ doesn’t halt on $w$, no accepting or rejecting computation history
    exists.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Reductions via computation histories


    +   A **linear bounded automaton (LBA)** is a **restricted tape** of Turing machine
    wherein the tape head isn’t permitted to move off the portion of the tape containing
    the input. **If the machine tries to move its head off either end of the input,
    the head stays where it is**, in the same way that the head will do as on the
    left-hand end of an ordinary Turing machine’s tape.'
  merge: -1
  img_proc: true
