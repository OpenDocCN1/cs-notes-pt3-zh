    $M_1$ or $M_2$ accept, it must accept if its input can be broken into two pieces,
    where $M_1$ accepts the first piece an $M_2$ accepts the second piece. But $M$
    does not need to know where to break its input.

    +     - To solve this problem , we introduce a new technique called nondeterminism.'
