  md: '# NL equals to coNL


    # Proof Idea


    +   - To determine whether a node $v$ is in $A_{i+1}$, we use an inner loop to
    go through all the nodes of $G$ and guess whether each node is in $A_i$

    +   - Each positive guess is verified by guessing the path of length at most $i$
    from $s$

    +   - For each node $u$ verified to be in $A_i$, the algorithm tests whether $(u,
    v)$ is an edge in $G$

    +     - If it is an edge, $v$ is in $A_{i+1}$

    +   - The number of nodes verified to be in $A_i$ is counted

    +   - At the completion of inner loop, if the total number of nodes verified is
    to be in $A_i$ is not $c_i$, all $A_i$ have not been found, so this computation
    branch is rejected

    +   - If the count equals $c_i$ to and $v$ has not yet been shown to be in $A_{i+1}$,
    we conclude that it is not in $A_{i+1}$ and then go on to the next $v$ in the
    outer loop'
