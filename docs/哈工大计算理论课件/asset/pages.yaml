    +   - Proof Idea:

    +     - We design a recursive algorithm similar to the one used for TQBF to determine
    which player has a winning strategy

    +     - To prove that GG is PSPACE-hard, we give a polynomial time reduction from
    FORMULA-GAME to GG.

    +       - This converts formula game to a GG graph, so that the graph mimics play
