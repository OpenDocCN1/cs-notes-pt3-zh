  md: '# Case study 1. Legacy File Update


    # How Pipe object works?


    +   - So a filter simply write some data to a pipe object by calling its write
    method. These data become then available for the next filter, which can call the
    read method of the pipe object to retrieve the data.


    ![](img/95717dc23f76db2057b9aa0c49790307_324_0.png)


    以这种方式，数据就像水流一样，从左向右不断地流动'
