- pgno: 1185
  md: '# Cloud Delivery Models


    # IaaS(基础设施即服务)


    +   - In this most basic cloud service model, cloud providers offer

    +     - computers – as physical or more often as virtual machines, 虚拟机

    +     - raw (block) storage,块存储

    +     - firewalls,防火墙

    +     - load balancers, and负载均衡

    +     - networks.网络

    +   - IaaS providers supply these resources on demand from their large pools installed
    in data centers. (按需提供)'
