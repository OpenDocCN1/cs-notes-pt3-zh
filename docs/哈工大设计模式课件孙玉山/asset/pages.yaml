  md: "# Example of design using strategy pattern\n\n```\npublic class BubbleSort\
    \ implements SortAlgorithm {\n    public int[] sort(int[] intArray, Context ct){\n\
    \        ct.startExecution();\n        for(int i = intArray.length; --i >= 0;)\n\
    \            for(int j = 0; j < i; j++){\n                if(intArray[j] > intArray[j\
    \ + 1]){\n                    int T = intArray[j];\n                    intArray[j]\
    \ = intArray[j + 1];\n                    intArray[j + 1] = T;\n             \
    \   }\n            }\n        ct.endExecution();\n        return intArray;\n \
    \   }\n}\n```"
  merge: -1
