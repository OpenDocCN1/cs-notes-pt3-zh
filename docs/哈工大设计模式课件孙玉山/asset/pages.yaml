- pgno: 1104
  md: '# Visitor Pattern-when to use?


    # 何时使用访问者模式？


    # Use the Visitor pattern when


    +   1) 对象结构包含很多个子类，而这些类有不同的接口。你需要针对不同的类进行不同的操作。An object structure contains many
    classes of objects with differing interfaces, and you want to perform operations
    on these objects that depend on their concrete classes.


    注：这就是为什么访问者类要针对每个被访问的类都设计一个不同的接口的原因。事实上，如果每个子类都有相同的接口，包括构造函数、其它方法、参数都一致，则访问者类则只需要设计一个访问方法，在该方法中，含有一个用于区别不同的被访问的子类的参数即可，例如，可以使用被访问者基类作为参数类型。'
  merge: -1
  img_proc: true
- pgno: 1105
  md: '# Visitor Pattern-when to use?


    2) 许多不同的且不相干的操作需要施加于对象结构，而你想要避免这些不同的操作污染这些类。 Many distinct and unrelated operations
    need to be performed on objects in an object structure, and you want to avoid
    “polluting” their classes with these operations.


    +   - Visitor lets you keep related operations together by defining them in one
    class (e.g., compute total price). When the object structure is shared by many
    applications, use Visitor to put operations in just those applications that need
    them.'
  merge: -1
  img_proc: true
- pgno: 1106
  md: '# Visitor Pattern-when to use?


    3)对象结构类很少改变，但是你需要经常地在这些结构体上增加新的运算。


    The classes defining the object structure rarely change, but you often want to
    define new operations over the structure.


    > – *Changing the object structure classes requires redefining the interface to
    all visitors, which is potentially costly.*'
  merge: -1
  img_proc: true
- pgno: 1107
  md: '# Visitor Pattern-Collaborations


    注：


    +   1. A client that uses the Visitor pattern must create a ConcreteVisitor object
    and then traverse the object structure, visiting each element with the visitor.

    +   2. When an element is visited, it calls the Visitor operation that corresponds
    to its class. The element supplies itself as an argument to this operation to
    let the visitor access its state, if necessary.'
  merge: -1
  img_proc: true
- pgno: 1108
  md: '# Visitor Pattern-Consequences


    # 访问者模式的优点（Advantages）


    +   1. ***Visitor makes adding new operations (in the Visitor) easy.*** Visitors
    make it easy to add operations that depend on the components of complex objects.
    You can define a new operation over an object structure simply by adding a new
    visitor.


    +   - ***In contrast, if you spread functionality over many classes, then you
    must change each class to define a new operation.***'
  merge: -1
  img_proc: true
- pgno: 1109
  md: '# Visitor Pattern-Consequences


    # Advantages


    +   2. *A visitor gathers related operations and separates unrelated ones.* (例如,将计算总价格放在一个具体的visitor类中)

    +   - *Related behavior isn''t spread over the classes defining the object structure;
    it''s localized in a visitor.*

    +   - *Unrelated sets of behavior are partitioned in their own visitor subclasses.*'
  merge: -1
  img_proc: true
- pgno: 1110
  md: '# Visitor Pattern-Consequences


    # 访问者模式的缺点（Disadvantages）


    +   1. *Adding new ConcreteElement classes is hard.*

    +      - Each new ConcreteElement gives rise to a new abstract operation on Visitor
    and a corresponding implementation in every ConcreteVisitor class.


    ConcreteElement→functionalities'
  merge: -1
  img_proc: true
- pgno: 1111
  md: '# 讨论：访问者模式的重点


    +   - 什么是访问者模式的重点？

    +   - 回答: 用于使得被访问者与访问者之间建立自动访问的accept方法是重点。该方法建立了两个层次类之间的关联。该方法使得自动访问成为可能。

    +   - 注: 另外,类objectStructure类对于批量访问很重要。另外使用此类，可以使得客户类包含较少的条件语句。能够有效地做到责任分离。

    +   - 结论: 要写好accept方法与objectStructure'
  merge: -1
