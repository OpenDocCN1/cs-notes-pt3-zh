- pgno: 1198
  md: '# Key Technologies of Cloud Computing


    # 关键技术2： 大规模分布式数据存储(big data)


    +   - **大数据概念**: Big data refers to data sets whose size is beyond the ability
    of commonly used software tools to capture, manage, and process the data within
    a tolerable elapsed time. (数据量巨大、传统软件数据处理工具无法在可接受的时间内处理完毕)


    +   - **问题：**


    +   - It’s hard to work with it using relational databases and desktop statistics/visualization
    packages,


    +   - require “massively parallel software running on hug number of servers”.(需要数以千计的服务器平行处理)'
  merge: -1
