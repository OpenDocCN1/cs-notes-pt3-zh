- pgno: 1069
  md: '# Visitor Pattern


    # 访问者模式构件的解释


    +   - **Visitor class** declares a Visit operation for each class of Element in
    the object structure.

    +     - The operation''s name and signature identifies the class that sends the
    Visit request to the visitor. For example, method visitHardDisk

    +   - Let the visitor determine the concrete class of the element being visited.
    Then the visitor can access the element directly through its particular interface.'
  merge: -1
  img_proc: true
- pgno: 1070
  md: '# Visitor Pattern


    # 访问者模式构件的解释


    # ConcreteVisitor


    +   > Implements each operation declared by Visitor.

    +   > - Each operation implements a fragment of the algorithm defined for the
    corresponding class of object in the structure.

    +   > Provides the context for the algorithm and stores its local state, which
    often accumulates results during the traversal of the structure.'
  merge: -1
  img_proc: true
- pgno: 1071
  md: '# Visitor Pattern


    # Element


    +   - Defines an Accept operation that takes a visitor as an argument.


    # ConcreteElement (ElementA, ElementB)


    +   - Implements an “accept” operation that takes a visitor as an argument.


    +   - May also implement some methods to help the visitor to realize some functionalities.
    For example, getData in Tax hierarchy'
  merge: -1
  img_proc: true
- pgno: 1072
  md: '# Visitor Pattern


    # ObjectStructure (Program) (can be omitted)


    +   - Can enumerate its elements.

    +   - May provide a high-level interface to allow the visitor to visit its elements.

    +   - May either be a composite or a collection such as a list or a set.


    +   - 该类可以使用一个聚合结构例如Java ArrayList将被访问对象集合在一起，然后再使用一个循环语句批量调用accept方法。'
