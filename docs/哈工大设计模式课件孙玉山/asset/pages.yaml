  md: '# Introduction to Factory Method Pattern


    Question: How to invoke a method in a class hierarchy that contains many subclasses
    and you don’t know exactly which one to select?


    The choice may depend on:


    +   - 运行状态. The state of the running application (input from users)

    +   - 应用配置设置. Application configuration settings


    +   - In such cases, an application object needs to use conditional statements
    to instantiate an appropriate class from the hierarchy to access its services'
