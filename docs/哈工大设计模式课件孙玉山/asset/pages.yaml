- pgno: 13
  md: '# Introduction to Software Architecture


    # Why use software patterns （为什么使用设计模式）？


    +   > 学习专家经验. **Design Patterns** capture expertise and make it accessible to
    non-experts in a standard form.

    +   > 为了交流. **Design Patterns** facilitate communication among developers by providing
    a common language.

    +   > 为了重复利用成功的设计. **Design Patterns** make it easier to reuse successful designs
    and avoid alternatives that diminish reusability.

    +   > 提供设计修改. **Design Patterns** facilitate design modifications.'
  merge: -1
