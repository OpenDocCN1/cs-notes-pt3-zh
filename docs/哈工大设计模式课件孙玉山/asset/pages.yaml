- pgno: 953
  md: '# The State Design Pattern


    关于状态的转换问题：


    +   a) 是否所有的状态子类对象都需要由客户类创建，然后再传递给Context类呢？


    +   b) 还是客户类只创建一个“种子对象”，然后，传递给Context类；再由Context类根据状态变化的情况，负责创建所有的其它的对象呢？


    回答：两种处理方法都可以，视具体情况而定'
