  md: '# Case study 2. Instrumentation Software


    2. **Separation of the user interface:** It separates the signal-processing functions
    of the oscilloscope from the user interface;


    +   - the signal-processing software makes no assumptions about how the user actually
    communicates changes to its control parameters.


    +   - Designers can therefore change the implementation of the signal-processing
    software and hardware without affecting the implementation of the user interface.'
