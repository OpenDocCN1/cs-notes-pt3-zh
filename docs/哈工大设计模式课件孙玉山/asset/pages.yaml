- pgno: 954
  md: '# The State Design Pattern


    # 状态模式的优点：Advantages


    +   a) Easy in adding a new state class

    +   Because all state-specific code lives in a State subclass, new states and
    transitions can be added easily by defining new subclasses.


    +   b) It makes state transitions explicit

    +   Introducing separate objects for different states makes the transitions more
    explicit. Also, State objects can protect the Context from inconsistent internal
    states.'
