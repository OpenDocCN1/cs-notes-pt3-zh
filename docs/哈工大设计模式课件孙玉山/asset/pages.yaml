    |+read()|

    |+write(c: int)|

    |+closeReader()|

    |+closeWriter()|



    Java API classes PipedReader and PipedWriter are used to implement data stream
    to keep data flowing continuously


    The Pipe class encapsulates the input and output streams as its private variables
    and provide just a simple public Interface for writing data to and reading data
    from a pipe object.'
