- pgno: 761
  md: '# Comparison of façade pattern and adapter pattern


    何时使用对象适配器模式？何时使用门面模式？


    +   1. An Adapter is used when the wrapper must respect a particular interface
    and must support a polymorphic behavior (当wrapper接口必须支持多态性质的时候，可以使用对象适配器模式).

    +   2. On the other hand, a facade is used when one wants an easier or simpler
    interface to work with(当你需要一个容易使用的、简单的门面类的时候，使用门面模式).'
