- pgno: 861
  md: '# Example of design using strategy pattern


    # 本设计的优点：


    +   1) 在添加或者修改属相子类的情况下都不必修改客户类的代码，


    +   a) 这是因为客户类仅仅提供一个人的生日信息，而不包含关于属相子类的条件语句。创建属相类对象的责任放到了Context类里面，


    +   b) 因此，Context子类包含一些与属相相关的条件语句。但是考虑到本问题不可能在增加子类方面进行扩展，因此不存在增加策略子类的情况；


    +   2) 在修改某个属相子类的情况下，不需要修改Context类的代码；


    +   3) 添加一个属相子类或者修改某个属相子类不影响其它的属相子类。'
