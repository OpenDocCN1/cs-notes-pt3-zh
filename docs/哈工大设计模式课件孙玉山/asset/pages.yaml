- pgno: 786
  md: '# 2. Evolution of client-server architecture


    # 2-Tier Client/Server: Typically a GUI front-end


    +   - Application or business logic either resides on the client or on the database
    server in the form of stored procedures (存储过程)

    +   - More complex applications

