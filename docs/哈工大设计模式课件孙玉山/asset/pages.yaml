- pgno: 456
  md: "# 3. Observer Pattern\n\n# Note 1:\n\n+   1. 一个主题可以有多个观察者。A subject can have\
    \ more than one such observer. Each of these observers needs to know when the\
    \ subject undergoes a change in its state.\n+   \n+   2. 主题保持一个动态列表，记录已经注册的观察者The\
    \ subject must maintain a dynamic list for registering observers.\n+   \n+   \
    \   - (The subject cannot maintain a static list of such observers as the list\
    \ of observers for a given subject could change dynamically)."
  merge: -1
  img_proc: true
- pgno: 457
  md: '# 3. Observer Pattern


    +   - How the observer pattern works?

    +   - **Observer must register itself**:

    +     - Any object with interest in the state of the subject needs to explicitly
    register itself as an observer with the subject.

    +   - **Observable must notify the observers**:

    +     - Whenever the subject undergoes a change in its state, it notifies all
    of its registered observers.

    +   - **An observer can query about the state of the obsevable**:

    +     - Upon receiving notification from the subject, each of the observers queries
    the subject to synchronize its state with that of the subject’s.'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# 3. Observer Pattern


    通知观察者的两种策略：


    +   1. **The push model(将观察者所需数据全部推给观察者，例如， update(Object a))**: The subject **should
    send the state information** that the observers may be interested in


    +   2. **The pull model(主题提供接口，供观察者访问，例如update(Observable obs))**: The subject
    should provide an interface that enables observers to query the subject for the
    required state information to update their state.


    +   • 【注】观察者模式有许多变形'
