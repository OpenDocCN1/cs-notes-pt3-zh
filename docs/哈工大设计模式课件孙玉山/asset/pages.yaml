- pgno: 84
  md: '# 3. Object-oriented Design


    # Difference Between Structured design and OO Design


    +   - **Structured design** focuses on the decomposition of software into various
    *functional components*. i.e., **program is organized into a collection of functions**,
    which will be executed in a defined order to produce the desired result.


    +   - **OO design** focuses on the organization of software into a **collection
    of components**, called *objects*, that group together

    +     - Related items of data (*properties*)

    +     - Operations that are to be performed on the data (*methods*)'
