    Model with Different Types of Pipes


    # Further Specifications


    +   - To handle these problems the model was further specialized. Instead of using
    a single kind of pipe, we introduced several "colors" of pipes.

    +     - **No copying some data:** Some of these allowed data to be processed **without
    copying**.

    +     - **Ignore incoming data:** Others permitted slow filters to **ignore**
    incoming data if they were in the middle of processing other data.'
