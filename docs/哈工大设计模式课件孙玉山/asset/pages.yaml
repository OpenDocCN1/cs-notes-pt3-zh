- pgno: 45
  md: '# 1. Evolution of Program Design


    +   - **Structured programming** is a programming paradigm aimed on improving
    the clarity, quality, and development time of a computer program by making extensive
    use of

    +     - 子程序： **subroutines**,

    +     - 块状结构： **block structures** and

    +     - 循环结构： for and **while loops**.

    +   - 结构化编程抛弃了GOTO语句。

    +   - **Language that support structured programming:** started from ALGOL68,
    C'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# 1. Evolution of Program Design\n\n- **结构化程序定理：** 只要一种编程语言可以依三个方式组合其子程序及调整控制流程，则每个可计算函数都可以用此种编程语言来表示（实现任何算法）。三个调整控制流程的方式为：\n\
    \  ◆ **序列结构：** 按照顺序执行一个子程序，然后再执行另一个子程序\n  ◆ **选择结构：** 根据布尔表达式的值，执行两个子程序中的一个子程序（if,\
    \ else if, else）；\n  ◆ **迭代结构(for, while)：** 执行子程序，直到一个布尔表达式为true"
  merge: -1
  img_proc: true
