- pgno: 135
  md: '# Characteristics of Abstract Class


    +   - Abstract classes can not be used by clients to create objects

    +   - Thus, if you want to use an abstract class with its subclasses, you need
    to create an object of one of the subclasses. Then you can use this object to
    call the methods both in the subclass or the superclass (Question: What kinds
    of methods can be called?)'
