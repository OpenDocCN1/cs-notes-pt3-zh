- pgno: 565
  md: '# # MVC Design Patterns


    +   - 解决方法：使用Model-View-Controller (MVC)设计模式。


    +   - MVC (Model-View-Controller)设计模式


    +   - MVC (Model-View-Controller)设计模式将一个互动的应用程序分成3部分，


    +   - 模型(Model)，包含核心功能与数据


    +   - 视图(View)，负责用户输入，并且为用户显示信息


    +   - 控制器(Controller)，处理用户输入。'
  merge: -1
