- pgno: 523
  md: '# When to use the Adapter pattern?


    Use the Adapter pattern when


    +   - You want to use an existing class, and its interface does not match the
    one you need or

    +   - You want to create a reusable class that cooperates with unrelated classes
    with incompatible interfaces, or

    +   - In a design, you need to change the interface of many subclasses. In this
    case, use object adapter.'
  merge: -1
  img_proc: true
