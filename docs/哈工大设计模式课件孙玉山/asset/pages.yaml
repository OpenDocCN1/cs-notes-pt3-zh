  md: '# 2. Call and Return Architecture


    +   - A system designed in call and return architecture uses divide and conquer
    strategy.

    +   - Its main idea is to divide the whole system into some smaller blocks to
    reduce the complexity and enhance the modifiability

    +   - The execution order of the Call and return system is usually controlled
    by a single thread'
