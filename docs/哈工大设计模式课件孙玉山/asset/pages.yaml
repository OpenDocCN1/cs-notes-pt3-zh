- pgno: 788
  md: '# 2. Evolution of client-server architecture


    +   - 两层客户端-服务器架构的缺点：

    +     - 它是单一服务器且以局域网为中心的，所以难以扩展至大型企业广域网或 Intranet；

    +     - 数据库厂商的lock-in，因为你的GUI代码直接与DB服务器绑定。更换其它产品困难；

    +     - 配置问题：当配置到远程的环境时候，两层的C/S结构管理起来比较困难。尤其是对于胖客户端的情况，就更难管理；

    +     - 胖客户端导致程序维护困难：用户必须在客户端安装特定的客户端应用程序，而且当越来越多的企业的业务逻辑写在客户端应用程序中的时候，程序维护变得越来越困难。

    +     - 软件升级困难：需要每个客户端都要安装新的客户端应用程序'
  merge: -1
