- pgno: 840
  md: '# Theory of the Strategy Pattern


    # 策略模式的优点 Advantages of Strategy Pattern


    +   1. Define related algorithms for reuse


    +   - Families of related algorithms. Hierarchies of Strategy classes define a
    family of algorithms or behaviors for contexts to reuse.


    +   - Inheritance can help factor out common functionality of the algorithms.'
  merge: -1
  img_proc: true
- pgno: 841
  md: '# Theory of the Strategy Pattern


    # 2. Easy extension


    Encapsulating the algorithm in separate Strategy classes lets you change the algorithm
    independently of its context, making it easier to


    +   - understand,

    +   - switch (change to a more efficient algorithm)

    +   - extend.


    +   - When an existing algorithm implementation is changed or a new algorithm
    is added to the group, both the existing strategy class hierarchy and the context
    remain unaffected.'
  merge: -1
  img_proc: true
- pgno: 842
  md: '# Theory of the Strategy Pattern


    # 策略模式的缺点 Disadvantages of the strategy pattern


    Clients must know different Strategies.


    +   - A client must understand how Strategies differ before it can select the
    appropriate one.'
  merge: -1
  img_proc: true
