- pgno: 1247
  md: '# Definition of SOA


    Definition of SOA: A service-oriented architecture (SOA) is the underlying structure
    supporting communications between services.


    +   A service is defined as a unit of work to be performed on behalf of some computing
    entity, such as a program (例如: 天气预报服务).


    +   SOA defines how two computing entities (计算实体) such as programs, interact in
    such a way as to enable one entity to perform a unit of work on behalf of another
    entity.'
  merge: -1
  img_proc: true
- pgno: 1248
  md: '# SOA Principle


    a) SOA separates the service’s implementation from its interface SOA将服务的接口与实现分离开


    b) Service consumers view a service simply as an endpoint that supports a particular
    request format or contract 服务消费者将服务视为支持特定的请求格式或合同的 终点


    c) Service consumers are not concerned with how the services are actually done
    服务消费者不关心服务是怎样实现的(代码、操作系统等)'
  merge: -1
  img_proc: true
