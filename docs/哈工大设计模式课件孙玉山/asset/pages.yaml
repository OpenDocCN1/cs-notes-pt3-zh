- pgno: 66
  md: '# 2. Main Program and Subroutine


    # 1) The functional viewpoint is difficult to evolve


    +   - The top-down approach creates a good software model for the initial requirements
    of a system.

    +   - But as that system changes and new requirements are added, the functional
    architecture becomes more and more unwieldy

    +     - Because the software is designed as tree structure, changes usually require
    extensive pruning and grafting

    +     - Maintenance becomes more and more difficult'
  merge: -1
