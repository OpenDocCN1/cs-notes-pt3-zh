- pgno: 430
  md: '# 1. Event-based, Implicit Invocation


    基于事件系统的定义：

    Definition of an event-based system:


    An event based system is such a system in which procedures are not invoked directly
    (that means, indirectly, implicitly).


    # What is a procedure（什么是过程）？


    +   - A procedure is a **module** in program **design language**, with or without
    parameters.

    +   - It is executed by procedural calls. The result will be

    +     - assigned to the calling parameter, or to

    +     - modify a gloabal variable within this subroutine.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 1. Event-based, Implicit Invocation


    # 事件广播机制


    # Event broadcast and processing mechanism:


    +   - A component can *broadcast* one or more events.

    +   - Other components in the system can *register* an interest in an event

    +   - Once an event is broadcasted, the system will *automaticaly* invoke all
    of the procedures that have registered for the event. ("implicitly ")


    事件发布者可能不负责调用'
