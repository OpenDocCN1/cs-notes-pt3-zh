- pgno: 633
  md: '# EncryptedInfo1的加密算法：折叠算法


    +   1. 将26个英文字母按照顺序排列，加密的时候，以折叠的方式进行： a←→z, b←→y, ..., m←→n


    +   2. 大写字母也是如此。大写字母加密为大写字母。


    +   3. 数字加密也以此方式进行

