- pgno: 325
  md: '# Case study 1. Legacy File Update


    # Some issues about a pipe


    +   a) **Amount of data in a pipe**: Pipe objects limit the amount of data they
    can hold.


    +   b) **Data consumption**. However, whenever clients read the data from a pipe,
    this data is considered "consumed" and the space that was occupied by the retrieved
    data is made free again.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Case study 1. Legacy File Update


    # Some issues about a pipe (cont)


    c) Pipe objects are synchronized (同步的). There can be only one thread working with
    a pipe object at a specific moment, i.e, there can be only one thread currently
    writing or reading the data from a pipe object.


    d) threads reading from an empty pipe or writing to a full pipe are blocked as
    long as there are not some data to read from the pipe, or there is no free space
    in the pipe to write the data.'
  merge: -1
  img_proc: true
