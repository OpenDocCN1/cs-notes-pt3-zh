- pgno: 903
  md: '# 3. Pure P2P Architecture – 2nd Generation P2P


    Query steps:


    +   1. 【Connect to P2P Network】 Node A is first connected to the network.


    +   2. 【Find New Nodes】 Ping Node A Pings to the other Nodes (B and C) to discover
    new nodes on the network.


    3. 【New Node Replies】 Pong A pong message is sent as a reply to a ping and provides
    information on a network node, including


    +   IP address,


    +   port number (端口号), and


    +   number of files shared.'
  merge: -1
  img_proc: true
- pgno: 904
  md: '# 3. Pure P2P Architecture – 2nd Generation P2P


    4. 【Send query message to new node】 A query message is used to search for files
    shared by other nodes on the network. It contains a query string and a minimum
    requested link speed.


    5. 【Get query reply】 A query reply message contains


    +   a list of files which match a given query,

    +   the size of each file, and

    +   the link speed of the responding node.


    6. 【Upload file】 A push message is used to upload file to clients behind a firewall
    who can not download files themselves.'
  merge: -1
