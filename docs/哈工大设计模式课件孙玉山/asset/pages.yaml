- pgno: 1210
  md: '# Key Technologies of Cloud Computing


    # Level 1 - Ad-Hoc / Custom (专门的、定制的)


    +   - Each customer has its own customized version of the hosted application and
    runs its own instance of the application on the host''s servers.


    ![](img/95717dc23f76db2057b9aa0c49790307_1210_0.png)


    每个租户都有为其专门定制的应用程序版本。例如财务系统定制版本：


    +   1）清华大学财务系统

    +   2）北京大学财务管理系统

    +   3）哈工大财务系统'
  merge: -1
  img_proc: true
- pgno: 1211
  md: '# Key Technologies of Cloud Computing


    # Level 2 – Configurable (可配置的)


    +   - Greater program flexibility through configurable metadata, so that many
    customers can use separate instances of the same application code.


    通过配置，可以使得许多租户运行同一个应用程序的不同的实例。


    ![](img/95717dc23f76db2057b9aa0c49790307_1211_0.png)'
  merge: -1
  img_proc: true
- pgno: 1212
  md: '# Key Technologies of Cloud Computing


    # Level 3 - Configurable, Multi-Tenant-Efficient

    可配置-多租户-高效率


    +   - Adds multi-tenancy so that a single program instance serves all customers.


    ![](img/95717dc23f76db2057b9aa0c49790307_1212_0.png)


    增加多租户机制，使得所有的租户运行同一个应用程序的同一个实例。


    问题：怎样区别租户？

    难度比较大'
  merge: -1
  img_proc: true
- pgno: 1213
  md: '# Key Technologies of Cloud Computing


    # Level 4 - Scalable, Configurable, Multi-Tenant-Efficient


    可伸缩的，可配置的，多用户的，高效的


    +   - Adds scalability through a multi-tier architecture supporting a load-balanced
    farm of identical application instances, running on a variable number of servers.


    ![](img/95717dc23f76db2057b9aa0c49790307_1213_0.png)


    增加了可伸缩性，使得所有的租户运行同一个应用程序的同一个实例，运行在许多服务器上。


    +   - 快速扩展

    +   - 快速释放

    +   - 快速收缩.'
  merge: -1
  img_proc: true
- pgno: 1214
  md: '# Key Technologies of Cloud Computing


    # 关键技术5：多租户架构的资源隔离模式

    (Resource Isolation Patterns of Data Tier in MTA)


    +   - 每个租户都有其独立数据库 Separate databases (SD)

    +     - Each tenant has its own database

    +     - Other resources (CPU, storage, code) shared

    +     - Easy to extend data model and recover

    +     - Expensive in maintaining many copies of DBs


    ![](img/95717dc23f76db2057b9aa0c49790307_1214_0.png)


    对于云计算提供商来讲费用太高


    (a)Separate Databases(SD)'
  merge: -1
  img_proc: true
- pgno: 1215
  md: '# Key Technologies of Cloud Computing


    # Resource Isolation Patterns of Data Tier in MTA


    +   - 所有租户共享同一个数据库，但是各个租户有其独立数据模式 (Shared database separate schemas (SDSS))

    +     - Each tenant has its own database schemas

    +     - Easy to implement and extend data model


    ![](img/95717dc23f76db2057b9aa0c49790307_1215_0.png)


    每个租户都有其独立的数据模式；容易实现和扩展数据模型'
  merge: -1
  img_proc: true
- pgno: 1216
  md: '# Key Technologies of Cloud Computing


    # Resource Isolation Patterns of Data Tier in MTA


    +   - **所有租户共享共享数据库与数据模式**（Shared database shared schemas (SDSHS)）

    +     - All tenants share the same schemas, easy to maintain

    +     - Most complex due to security reasons

    +     - Hard to restore after failures


    ![](img/95717dc23f76db2057b9aa0c49790307_1216_0.png)


    +   - 所有租户共享数据模式与数据库；

    +   - 实现起来比较困难

    +   - 失败以后不容易恢复


    (c)Shared Databases, Shared Schemas(SDSHS)


    ![](img/95717dc23f76db2057b9aa0c49790307_1216_1.png)'
  merge: -1
  img_proc: true
