  md: '# 4. Process-control Paradigms




    +   - **Process variables.** Values of Properties of the process that can be measured
    (e.g., temperature, gas amount)

    +   - **Controlled variable.** Process variable whose value the system is intended
    to control. (e.g., temperature)

    +   - **Input variable.** Process variable that measures an input to the process.
    (e.g., input temperature, set point)

    +   - **Manipulated variable.** Process variable whose value can be changed by
    the controller. (e.g., gas amount)

    +   - **Set point.** The desired value for a controlled variable.'
