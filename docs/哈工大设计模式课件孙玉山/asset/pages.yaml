    +   - 区别3: 关于控制模块(Controller)。

    +   ➤ MVC架构中存在一个专用的Controller模块；

    +   ➤ 而层次架构中通常没有这样专用的模块。事实上，很多设计者在层次架构中的应用层里面单独地指定一个类似的控制模块。'
