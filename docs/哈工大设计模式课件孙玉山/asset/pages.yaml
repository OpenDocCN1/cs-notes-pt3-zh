  md: '# Cloud Delivery Models


    # PaaS (平台即服务)


    +   - PaaS is a category of cloud computing services that provide a computing
    platform and a solution stack as a service. (将计算平台及方案栈作为服务)

    +   - PaaS模型提供了计算平台

    +   - In the PaaS model, cloud providers deliver a computing platform and/or solution
    stack typically including

