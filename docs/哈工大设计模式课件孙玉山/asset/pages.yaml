- pgno: 232
  md: '# 4. Process-control Paradigms


    # 过程控制软件模型


    # A Software Paradigm for Process Control


    An architectural style for software that controls continuous processes can be
    based on the process control model. It contains:


    +   1. **Computational elements**: separate the process of interest from the control
    policy.


    +   - **Process definition**, including mechanisms for manipulating some process
    variables. (e.g., beer: ferment temperature, acid content)


    +   - **Control algorithm**, for deciding how to manipulate process variables,
    including a model for how the process variables reflect the true state. (具体怎样控制哪些变量？)'
  merge: -1
