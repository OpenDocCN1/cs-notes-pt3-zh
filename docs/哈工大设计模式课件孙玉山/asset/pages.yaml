- pgno: 1256
  md: "# SOA Entities\n\n# 1. Service Consumer (服务消费者)\n\n+   - **定义：** The service\
    \ consumer is an application, service, or some other type of software module that\
    \ requires a service\n+   - **How Service Consumer works?**\n\n+   a) The service\
    \ consumer locates the service in the registry, binds to the service over a transport,\
    \ and execute the service function\n+   \n+   b) The service consumer executes\
    \ the service by sending it a request formatted according to the contract"
  merge: -1
  img_proc: true
- pgno: 1257
  md: '# SOA Entities




    +   - 定义： The service provider is the service, the network-addressable entity
    that accepts and executes requests from consumers. It is a software system that
    executes the service request.


    +   - How Service Provider Works?

    +   The service provider publishes its **contract** in the registry for access
    by service consumers.'
  merge: -1
  img_proc: true
- pgno: 1258
  md: '# SOA Entities


    # 3. **Service Registry** （服务注册）


    +   - A service registry is a network-based directory that contains available
    services.

    +   - A service registry accepts and stores contracts from

    +     - service providers and provides those contracts to

    +     - interested service consumers.


    ![](img/95717dc23f76db2057b9aa0c49790307_1258_0.png)'
  merge: -1
  img_proc: true
- pgno: 1259
  md: '# SOA Entities


    # 4. Service Contract （服务合同）


    +   • A contract specifies the format of

    +   1) the request (请求格式)

    +   2) response from the service (反馈格式)'
  merge: -1
  img_proc: true
- pgno: 1260
  md: '# SOA Entities


    # 5. Service Proxy (服务代理)


    +   a) The service provider supplies a service proxy to the service consumer 服务提供者给服务消费者一个代理

    +   b) The service consumer executes the request by calling an API function on
    the proxy.

    +   c) The service proxy finds a contract and a reference to the service provider
    in the registry.

    +   d) It then formats the request message and executes the request on behalf
    of the consumer.'
  merge: -1
  img_proc: true
