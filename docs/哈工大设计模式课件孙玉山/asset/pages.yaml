- pgno: 244
  md: '# Introduction to Factory Method Pattern


    # 该设计的缺点：


    This type of design has the following disadvantages:


    +   a) **High coupling（高耦合）**。


    Because every application object that intends to use the services offered by the
    class hierarchy needs to implement the class selection criteria, it results in
    a **high degree of coupling** between an application object and the service provider
    class hierarchy.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Introduction to Factory Method Pattern


    # b) Inelegant statement (难看的条件语句).


    Because class selection criteria needs to take all the factors that could affect
    the selection process into account, the implementation of an application object
    could contain inelegant conditional statements.


    # c) Client should fully know the class (客户程序需要知道服务类的全部细节).


    It requires an application object to be fully aware of the existence and the functionality
    offered by each class in the service provider class hierarchy.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Introduction to Factory Method Pattern


    +   - 怎样改善以上设计?

    +   - In such cases, use the Factory Method Pattern, which recommends

    +     - encapsulating the functionality required to select and instantiate an
    appropriate class inside a designated method called a factory method (将根据条件选择与初始化一个合适的类的功能封装在一个专门的类的一个专门的方法中).'
  merge: -1
  img_proc: true
