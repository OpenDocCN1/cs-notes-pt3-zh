  md: '# Comparison of the state design pattern and the strategy pattern


    | State pattern | Strategy pattern |

    |---|---|

    | **状态相关的行为**

    The behavior contained in each State object is specific to a given state of the
    associated object. | **不是状态相关的行为**

    The behavior contained in each Strategy object is a different algorithm to provide
    a given functionality. |

    | **状态对象可以负责更新配置给 Context类的状态对象。**

    A given State object itself can put the context into a new state.

    This makes a new State object as the current State object of the context, changing
    the behavior of the Context object. | **由客户类创建策略子类对象，并且传递给 Context对象。**

    A client application using the context needs to explicitly assign a strategy to
    the context.


    A Strategy object cannot cause the context to be configured with a different Strategy
    object. |'
  merge: -1
  img_proc: true
- pgno: 994
  md: '# Comparison of the state design pattern and the strategy pattern


    | State Pattern | Strategy Pattern |

    |---|---|

    | **状态的选择（转换）依赖于 Context或者State对象**

    The choice of a State object is dependent on the state of the Context object.
    | **由应用类选择策略子类对象**

    The choice of a Strategy object is based on the application need. Not on the state
    of the Context object. |

    | **有状态转换：可以由 Context类或者State层次类进行状态转换** | **没有状态转换** |

    | **可以将一些业务逻辑包含在 Context类中(包括状态转换)** | **可以将一些业务逻辑包含在Context类中(没有包括状态转换)** |'
  merge: -1
  img_proc: true
