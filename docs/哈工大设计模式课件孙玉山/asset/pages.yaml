- pgno: 612
  md: '# Bridge Pattern


    # 桥模式的组件（Participants）


    +   - **Abstraction**

    +     - defines the abstraction''s interface.

    +     - **maintains a reference** to an object of type Implementor.

    +   - **RefinedAbstraction**

    +     - Extends the interface defined by Abstraction.'
  merge: -1
  img_proc: true
- pgno: 613
  md: '# Bridge Pattern


    # Implementor


    +   - Defines the interface for implementation classes.

    +   - This interface doesn''t have to correspond exactly to Abstraction''s interface;
    in fact the two interfaces can be **quite different**.'
  merge: -1
  img_proc: true
- pgno: 614
  md: '# Bridge Pattern


    # Typically


    +   - The Implementor interface provides only primitive operations（实现接口仅提供原始操作）

    +   - The Abstraction defines higher-level operations based on these primitives（抽象接口定义基于原始操作的高层操作）'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# Bridge Pattern


    The ConcreteImplementors:


    +   - **ImplementorA and**

    +   - **ImplementorB**


    implement the Implementor interface and defines its concrete implementation.'
  merge: -1
  img_proc: true
- pgno: 616
  md: '# Advantages of Bridge Pattern


    # 桥模式的优点


    +   1. 将接口与实现解耦。 Decoupling interface and implementation.


    An implementation is not bound permanently to an interface


    +   - The implementation of an abstraction can be configured at run-time (实现部分动态配置)


    +   - Decoupling Abstraction and Implementor also eliminates compile-time dependencies
    on the implementation (取消编译时对实现部分的依赖)


    +   - Changing an implementation class doesn''t require recompiling the Abstraction
    class and its clients (改变实现类不需要重新编译抽象类与客户端)'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# Advantages of Bridge Pattern


    2. 改善了可扩展性。 Extensibility Improvement

    You can extend the Abstraction and Implementor hierarchies independently.


    3. 对用户隐藏实现细节。 Hiding implementation details from clients.

    You can shield clients from implementation details, like the sharing of implementor
    objects and the accompanying reference count mechanism (if any).'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# Bridge Pattern


    # 何时使用桥模式？


    # When to use the bridge pattern?


    **Applicability**: Use the Bridge pattern when you want to avoid a permanent binding
    between an abstraction and its implementation.


    +   - e. g. when the implementation must be selected or switched at run-time.'
