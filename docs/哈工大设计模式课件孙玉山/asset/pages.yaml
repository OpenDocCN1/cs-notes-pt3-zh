- pgno: 688
  md: '# 2. Case Studies


    Level 1: the lowest level, reside the robot control routines (motors, joints,
    etc.).


    Levels 2: sensor interpretation, the analysis of the data from one sensor, and


    Levels 3: sensor integration, the combined analysis of different sensor inputs


    Level 4: is concerned with maintaining the robot''s model of the world.


    Level 5: manages the navigation of the robot.


    Levels 6, 7: schedule and plan the robot''s actions. Dealing with problems and
    replanning is also part of the level-7 responsibilities.'
  merge: -1
  img_proc: true
- pgno: 689
  md: '# 2. Case Studies


    +   - **Problems:**

    +     - the layered architecture does not fit actual data and control flow patterns.

    +     - The layers suggest that services and requests are passed between adjacent
    components. Actually, information passing is less straightforward.

    +     - **Example:**

    +       - data requiring fast response may be sent directly from sensor to level
    7 to deal with the problem.

    +       - the corresponding commands may have to skip levels to reach the motors
    in time.'
  merge: -1
  img_proc: true
- pgno: 690
  md: '# 2. Case Studies


    # Summary:


    +   - Abstraction levels defined by the layered architecture

    +     - provide a framework for organizing components

    +     - framework succeeds because it is precise about the roles of the different
    layers

    +   - Major drawbacks

    +     - model breaks down when taken to the greater level of detail demanded by
    an actual implementation.

    +     - Communication patterns in a robot not likely to follow the orderly scheme
    implied by the architecture.'
  merge: -1
  img_proc: true
