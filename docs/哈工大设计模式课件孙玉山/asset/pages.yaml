- pgno: 403
  md: '# How the design works?


    1. From GUI, input parameter "super" or "medium", and call getFactory(c) to get
    a MediumFactory or SuperFactory object bf (BuildingFactory子类对象)


    2. Base on the parameter "house" or "condo" input from GUI, to get House对象: h
    = bf.getHouse(), or Condo对象 c = bf.getCondo()


    3. Using h or c to get h.getHouseInfo() c.getCondoInfo() 获得房屋信息


    h = bf.getHouse()获得了superHouse对象


    注意： AbstractFactoryGUI类只知道 House or Condo 接口，但是不知道它们的子类


    ![](img/95717dc23f76db2057b9aa0c49790307_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# Query Software of Building Features


    # Design reason:


    +   - If we don’t use the abstract factory pattern, and just call the methods
    in classes House and Condo directly,

    +   - then in the ClientGUI,

    +   - we need to write a lot of **conditional statements** and this is not good
    for extension and maintenance'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Query Software of Building Features


    +   - **Benefits of the design**:

    +   - **Responsibility separation**:

    +   - The responsibility of selecting and instantiating an appropriate House/Condo
    implementer is moved out of application objects to a separate designated abstract
    factory class.

    +   - **About BuildingFactory class**:

    +   - It simply declares the required interface, leaving the actual implementation
    details of class selection and instantiation to its implementers.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Query Software of Building Features


    +   - **About client object AbstractFactoryGUI class:**

    +   - It uses an instance of a concrete factory that implements the *BuildingFactory*
    interface to create objects representing houses of different types and categories
    without having to know the actual concrete class that needs to be instantiated.
    不需要知道初始化哪个确切的房屋子类

    +   - The client objects do not have to know about the existence of these concrete
    factory classes.不需要确切地知道初始化哪个工厂子类'
  merge: -1
