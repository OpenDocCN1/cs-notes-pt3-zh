- pgno: 1170
  md: '# Concept of Cloud Computing


    # The NIST Definition of Cloud Computing


    Cloud computing is a model for enabling


    +   - Ubiquitous （无处不在的）,

    +   - convenient, （方便的）

    +   - on-demand （按照需求的）


    network access to a shared pool of configurable computing resources, e.g.,


    +   - networks,

    +   - servers,

    +   - storage,

    +   - applications, and

    +   - services


    that can be rapidly provisioned and released with minimal management effort or
    service provider interaction.'
  merge: -1
  img_proc: true
- pgno: 1171
  md: '# Concept of Cloud Computing


    +   - 云计算应该具有的5个基本特点:

    +     1）按需自我服务 On-demand self-service.


    A consumer can unilaterally（单方面）provision computing capabilities, such as


    +   - server time and （服务器时间）

    +   - network storage, （网络存储）


    as needed automatically without requiring human interaction with each service’s
    provider.'
  merge: -1
  img_proc: true
- pgno: 1172
  md: '# Concept of Cloud Computing


    # 2）宽网访问 Broad network access.


    Capabilities are available over the network and accessed through standard mechanisms
    that promote use by heterogeneous（多样的）thin or thick client platforms, e.g.,


    +   - mobile phones;（手机）

    +   - laptops, and;（笔记本电脑）

    +   - PDAs.（个人数字助理，集中了电话、传真、网络等功能）'
  merge: -1
  img_proc: true
- pgno: 1173
  md: '# Concept of Cloud Computing


    3) 资源池Resource pooling.


    +   • The provider’s computing resources are pooled to serve multiple consumers
    using a multi-tenant model, with different physical and virtual resources dynamically
    assigned according to consumer demand.




    +   • 客户不知道自己的资源存在哪里 the customer generally doesn’t know the exact location of
    the provided resources but


    +   • 客户可以指定资源存放地区 may be able to specify location at a higher level of abstraction
    (e.g., country, state, or data center).'
  merge: -1
  img_proc: true
- pgno: 1174
  md: '# Concept of Cloud Computing


    # 4）快速弹性Rapid elasticity.


    +   - Capabilities can be rapidly and elastically provisioned, in some cases automatically,
    to

    +     - quickly scale out(快速扩展), and

    +     - rapidly released (快速释放)

    +     - quickly scale in （快速收缩）.


    +   - To the consumer, the capabilities available for provisioning often appear
    to be unlimited and can be purchased in any quantity at any time.'
  merge: -1
  img_proc: true
- pgno: 1175
  md: '# Concept of Cloud Computing


    # 5）服务度量 Measured Service.


    • Cloud systems automatically control and optimize resource use by leveraging
    a metering capability (计量能力) at some level of abstraction appropriate to the type
    of service e.g.,


    +   - storage;

    +   - processing;

    +   - bandwidth, and;

    +   - active user accounts.


    • Resource usage can be monitored, controlled, and reported, providing transparency
    for both the provider and consumer of the utilized service.


    ![](img/95717dc23f76db2057b9aa0c49790307_1175_0.png)'
  merge: -1
  img_proc: true
