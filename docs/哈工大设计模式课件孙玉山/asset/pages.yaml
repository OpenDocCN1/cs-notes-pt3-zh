- pgno: 647
  md: '# 1. Layered System


    # Advantages of Layered systems


    +   1. 支持逐层抽象。Layered architecture supports designs based on increasing levels
    of abstraction.

    +      - This allows implementers to partition a complex problem into a sequence
    of incremental steps.

    +   2. 支持更新。Layered architecture supports enhancement.

    +      - each layer interacts with at most the layers below and above,

    +      - changes to the function of one layer affect at most two other layers.'
  merge: -1
  img_proc: true
- pgno: 648
  md: '# 1. Layered System


    3. 支持复用。 Layered architecture supports reuse.


    +   - One can have different implementations of the same layer, provided they
    support the same interfaces to their adjacent layers.

    +   - With standard layer interfaces, it can be built by different software development
    teams. (like OOP)'
  merge: -1
  img_proc: true
- pgno: 649
  md: '# # 1. Layered System




    +   Not all systems are easily structured in a layered fashion.


    +   Even if a system can logically be structured in layers, considerations of
    performance may require closer coupling between


    +   logically high-level functions and their


    +   lower-level implementations.


    +   It may be quite difficult to find the right levels of abstraction.'
