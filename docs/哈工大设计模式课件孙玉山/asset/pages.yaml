- pgno: 296
  md: '# Comparison of Simple Factory Pattern and a Factory Pattern （比较）


    e) 工厂方法模式支持开闭原则，但是简单工厂方法模式不支持开闭原则。 Factory Method Pattern supports the open-closed
    principle, but simple factory method doesn’t support the open-closed principle.

    For the purpose of adding a new class, this system fully supports “open-closed
    principle” below:


    +   - 开闭原则： Open for extension and closed for modification (一个好的设计应该是可以被扩展，但是是在扩展的时候，不允许修改原有代码)


