- pgno: 590
  md: '# 网上二手车拍卖系统的设计：方案3


    # 设计方案3工作原理


    +   a) **用户输入.** 用户通过使用CarAuctionGUI中的Cars列表选择待卖的车，点击Search，以便获取车的图片；然后输入拍价，点击Bit，给出价格。


    +   b) **捕捉用户输入.** 每次点击按钮产生的事件，都被Controller对象捕捉，然后调用actionPerformed()方法。


    +   c) **更新模型数据.** 在actionPerformed()方法中，将根据事件的类型，分别使用setSelectedCar 或者setBitPrice
    方法更新CarModel的数据


    +   d) **Model通知View.** 由于CarGUIView、CarBitView与CarModel之间存在观察者/被观察者的关系，所以当CarModel的状态改变了的时候，CarGUIView和CarBitView的update()方法将被自动调用。


    +   e) **更新View.** 在update()方法中，调用CarModel的getSelectedCar 或者getBitPrice 方法得到最新的数据，然后根据数据，更新视图。'
  merge: -1
  img_proc: true
