- pgno: 370
  md: '# Case study 2. Instrumentation Software


    # Disadvantages of Parameterized Pipe and Filter Model


    +   - **poor performance .**

    +     - **Large storage:** waveforms can occupy a large amount of internal storage,
    it is simply not practical for each filter to copy waveforms every time they process
    them.

    +     - **Bottleneck of slow filter:** Further, different filters may run at radically
    different speeds: it is unacceptable to slow one filter down because another filter
    is still processing its data.'
  merge: -1
  img_proc: true
