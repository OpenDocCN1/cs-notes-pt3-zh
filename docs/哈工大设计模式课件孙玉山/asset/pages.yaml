    +   • 【注】在3层架构中，应用层与表示层之间 , 使用观察者模式。必然导致应用层对显示层的调用(notifyObservers())。这违反了层次架构的原则。但是考虑到采用观察者机制更新图形界面的效率，以上的小小的“违规”也是值得的。'
