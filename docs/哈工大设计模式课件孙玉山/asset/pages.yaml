  md: '# Comparison of Simple Factory Pattern and a Factory Pattern （比较）


    # c) 工厂方法模式的可扩展性（Extensibilities）


    If a new product is added to the product hierarchy, then what needed is to add
    a sub concrete class to the product hierarchy and a sub class to the factory hierarchy.


    +   - it is not necessary to modify the abstract factory and the existing subclasses
    of the concrete factory method (工厂类的已有源代码不需要改变)

    +   - It is not necessary to change the client class (假设client暂时不用该新功能),'
