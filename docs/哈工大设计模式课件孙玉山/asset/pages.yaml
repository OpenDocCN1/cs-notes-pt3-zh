- pgno: 567
  md: '# MVC Design Patterns


    +   - 定义： In software engineering, Model–View–Controller (MVC) is an architectural
    pattern that splits interactions between users and applications into three roles:

    +     - the Model (business logic),

    +     - the View (user interface), and

    +     - the Controller (user input).

    +   - This separation of concerns facilitates the independent development, testing,
    and maintenance of each role(关注点分离:模型、视图和控制器).'
  merge: -1
  img_proc: true
