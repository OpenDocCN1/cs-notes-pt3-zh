- pgno: 1006
  md: '# 1. Basic Concepts of Grid Computing


    +   - 资源供应技术 Provisioning of Resources. Grid computing consists of a family of
    technologies for dynamically provisioning computing power from a pool of resources.

    +   - **The resource pool can include:**

    +     - computing cycles

    +     - file and data storage

    +     - Caching

    +     - network bandwidth

    +     - databases and

    +     - data warehouses

    +     - application software'
  merge: -1
  img_proc: true
- pgno: 1007
  md: '# 1. Basic Concepts of Grid Computing


    资源的多样性 Diversity of resources.


    +   a) The resource pool can be geographically dispersed, and

    +   b) individual resources can vary widely in


    +   - Capability

    +   - Capacity, and

    +   - Availability


    Several grid-aware applications can share the resource pool.'
  merge: -1
  img_proc: true
- pgno: 1008
  md: '# 1. Basic Concepts of Grid Computing


    # 供应的内容 Contents of the provisioning:


    *Provisioning* includes methods and mechanisms for


    +   > Locating (寻找)

    +   > Authorizing (授权)

    +   > Assembling (组装)

    +   > Scheduling (计划)

    +   > Releasing, and (释放、发布)

    +   > Accounting (记账)


    for resources and their usage.'
  merge: -1
