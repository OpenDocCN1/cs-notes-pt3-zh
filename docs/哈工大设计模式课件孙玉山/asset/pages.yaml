  md: '# 3. Pipes and Filters architecture


    Comparison between batch sequential architecture and pipes-and-filters architecture


    +   - **Similarity: independent processing modules**


    In both Batch sequential and pipes and filters architectures, the processing steps
    are independent of each other, that is


    +   - one filter in pipes and filters architecture doesn’t call any other filters
    in the system


    +   - one processing step in batch sequential architecture doesn’t call any other
    processing step in the system


    处理过程之间互不调用'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 3. Pipes and Filters architecture


    Comparison between batch sequential architecture and pipes-and-filters architecture


    # Difference 1 (the way for data processing is different):


    +   1. In batch sequential Architecture, each step runs to completion before the
    next step starts, that is, data is transmitted as a whole between steps


    +   2. In pipes and filters architecture, the filters Incrementally transform
    some of the source data into sink data, that is, the filters do stream to stream
    transformation'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 3. Pipes and Filters architecture


    Comparison between batch sequential architecture and pipes-and-filters architecture


    # Difference 2 (data amount is different) :


    +   1. In batch sequential Architecture, the amount of data is limited

    +   2. In pipes and filters architecture, the amount of data can be unlimited'
  merge: -1
