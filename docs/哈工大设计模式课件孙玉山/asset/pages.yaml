  md: '# 2.Evolution of client-server architecture


    # One tier Client/Server (mainframe, -1970’s):


    +   - From 1960’s to 1970’s, mainframe computer applications were popular, regarded
    as one tire client/sever application.


    +   - There are two ways for the mainframe to work

    +     a) Batch Processing: The batch processing queues up programs so that as
    soon as one completed, the next would start.


    +   - a number of card punch would be used by programmers to write their programs
    "offline". Then


    +   - the “program” in the punched card were submitted to the operations team,
    who would schedule them for running.'
