  md: '# Abstract Factory Pattern


    +   - The Abstract Factory pattern takes the same concept as the Factory method
    pattern does.

    +   - An *abstract factory* Creator is a class that provides an interface to produce
    a family of objects.

    +   - In the Java programming language, it can be implemented either as

    +     - an interface or as

    +     - an abstract class.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# # Abstract Factory Pattern


    # Components in abstract factory pattern


    +   - 产品层次类: Families of related, dependent product classes （鞋子、西装、衬衫）

    +   - 工厂层次类: A group of concrete factory classes that implement the interface
    provided by the abstract factory class.

    +   - 工厂层次类: Each of these factories provides access to a particular suite of
    related, dependent objects and implements the abstract factory interface in a
    manner that is specific to the family of classes it controls.'
  merge: -1
  img_proc: true
