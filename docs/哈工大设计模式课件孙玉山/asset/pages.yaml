- pgno: 69
  md: '# 2. Main Program and Subroutine


    # 2) Real systems are hard to characterize functionally


    +   - Most large systems do not have a top, e.g., a database system involving
    tools for querying data, changing data, and keeping data consistent.

    +   - If there is no one function central to these diverse concerns, then define
    these systems based on a single top-level function is artificial and yields overly
    complex and non-adaptive architectures.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 2. Main Program and Subroutine


    3) The functional focus loses sight of the data


    +   - The top-down design does not capture anything about the data involved in
    the program.


    +   - Usually, the same data is shared among a number of functions (for example,
    updating, deleting, inserting, and querying a database table).


    +   - Since the decomposition only highlights the functional aspects of the problem,
    the influence of the data structures on the problem is lost'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 2. Main Program and Subroutine


    # 4) Functional orientation produces less reusable code


    +   - Top-down design works by continually refining a problem into simpler and
    simpler chunks.

    +   - Each chunk is analyzed and specified by itself, without much regard for
    the rest of the system

    +   - However, each program element is designed with only a limited set of requirements
    in mind.

    +   - Since it is unlikely that this exact set of requirements will appear in
    the next problem, the program''s design and code is not general and reusable.'
  merge: -1
  img_proc: true
