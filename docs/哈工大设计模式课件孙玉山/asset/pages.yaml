  md: '# 格斗类游戏软件


    +   - 假设我们计划一款格斗类游戏软件. 玩家与敌方士兵以及怪兽进行战斗。

    +   - 为了适应不同等级玩家的需求，游戏特地安排了三个难度级别：

    +     - 初等级别: 敌方士兵反应迟钝，怪兽步履缓慢，即便是初学者也能够很轻松地取胜

    +     - 中间级别: 敌方士兵反应适度，怪兽步履速度中等，中级玩家有可能取胜

    +     - 高难级别: 敌方士兵反映敏捷，怪兽狩狩狡诈，就算是高级玩家也难逃被击毙的厄运。

    +   请应用抽象工厂模式进行设计。'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 格斗类游戏软件


    +   - 在具体实现时可以先设计两个抽象产品类Fighter和Monster，用来代表士兵和怪兽。

    +   - Fighter: SlowFighter, MedFighter, SuperFighter

    +   - Monster: SlowMonster, MedMonster, SuperMonster

    +   - 注意: 用户有三种选择: 初级, 中级, 高级

    +   - 初级: SlowFighter, SlowMonster

    +   - 中级: MedFighter, MedMonster

