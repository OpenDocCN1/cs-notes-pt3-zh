- pgno: 1025
  md: '# 3. Comparison of Grid Computing with P2P Computing


    # P2P Computing


    +   - **Grids and P2P的相似之处：使用地理上广泛分布的资源**

    +   - Foster believes that *grids* and *P2P* computing have much in common

    +     - Both approaches have the same objective:

    +       - the use of *geographically distributed resources*'
  merge: -1
  img_proc: true
- pgno: 1026
  md: '# 3. Comparison of Grid Computing with P2P Computing


    +   - **Grids and P2P的区别**: But there is one difference between them, *each addresses
    the problem in different ways.*

    +     - Grid computing focus on top-down issues:

    +       - *resource integration*

    +       - *performance*

    +       - *service quality , and*

    +       - *security*

    +     - Peer-to-peer computing focus on bottom-up issues, such as:

    +       - *specialized services, and*

    +       - *support*

    +     - for many participants'
  merge: -1
  img_proc: true
