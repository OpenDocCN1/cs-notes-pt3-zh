- pgno: 230
  md: '# 4. Process-control Paradigms


    # Feedback control system.


    A system used to adjust the process according to measurements of the controlled
    variable.


    The important components of a feedback controller are


    +   - 过程定义。 the process definition,

    +   - 过程变量。 the process variables (e.g. input and controlled variables), a sensor
    to obtain the controlled variable from the physical output

    +   - 设定点。 the set point (target value for the controlled variable), and

    +   - 控制算法。 a control algorithm.'
  merge: -1
  img_proc: true
