- pgno: 269
  md: '# The Simple Factory Method Pattern


    # Advantages of the Simple Factory method Pattern (简单工厂方法模式的优点)


    +   a) **Some logics are put into the factory class.**

    +   The factory class contains necessary logic, which can decide which instances
    of the product class to create and when to create


    +   b) **Client is free from creating objects.**

    +   The client class doesn’t have to create object of the product classes. It
    will just act as consumer.


    +   c) **Responsibility separation** (责任分离)

    +   The simple factory pattern have realized the **responsibility separation**.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# The Simple Factory Method Pattern


    # d) Extensibility issue


    Client class is independent of the creation of the object. You don’t need to modify
    the existing source code for the client class if there is a new product to be
    added (假设此时客户类还不想将新产品加入).'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# The Simple Factory Method Pattern


    # Disadvantages of the Simple Factory method Pattern (简单工厂方法模式的缺点)


    # a) Adding a new concrete subclass to Product class hierarchy is difficult.


    +   - The factory class must know every product. It must know how to create object
    of the newly added sub classes and when to provide them to the client.


    +   - Thus, adding new sub classes in the Product class hierarchy will need to
    modify the source code of the factory class'
  merge: -1
