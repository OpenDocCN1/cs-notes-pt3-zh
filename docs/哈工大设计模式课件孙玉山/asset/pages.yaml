  md: '# 1. Basic Concepts of Grid Computing


    1. Main cluster server divides Tasks into smaller subtasks and parcel them to
    local cluster servers


    2. local cluster servers find available processing power on local PCs and distributes
    subtasks into those PCs


    3. local cluster servers gather completed tasks from local PCs and send data back
    to Main cluster servers


    4. Main cluster server aggregates complete tasks and send data back to the dadabase
    farm


