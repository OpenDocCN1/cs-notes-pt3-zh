- pgno: 1136
  md: '# Advantages of Mediator Pattern


    # Advantages of Mediator pattern:


    +   1. 参与者类重用性变得更好. Moving inter object dependencies out of individual objects
    results in enhanced object reusability.


    +   2. 参与者对象之间的关系可以由中介者子类对象调节. It becomes easier to alter the behavior of object
    inter relationships, by replacing the mediator with one of its subclasses with
    extended or altered functionality.'
