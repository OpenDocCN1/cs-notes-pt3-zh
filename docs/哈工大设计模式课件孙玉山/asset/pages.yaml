- pgno: 875
  md: '# 策略模式的可扩展与可维护性讨论


    # 情况2. Context类负责创建策略子类的对象的情况。


    +   - 将创建策略子类的对象的责任交给context类，而客户类client只提供给context类一些代表客户请求的参数。

    +   - 在此情况下，context类在创建策略子类的对象的时候，往往会使用与策略子类有关的条件语句。此时，

    +     - 修改一个策略子类不需要修改context类。

    +     - 而在添加一个新的策略子类的时候，则必须在context类中添加新的条件分支，也就是说，需要修改context类。例如，例3的设计。

    +   - 综上所述，还是由客户类创建对象的设计可扩展性好一些。这样，可以做到在context类中不出现与策略子类相关的条件语句，从而，可扩展性也得到了提高。'
  merge: -1
