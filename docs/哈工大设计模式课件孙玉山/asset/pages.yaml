- pgno: 725
  md: '# Facade Pattern-theory


    # 门面模式的意图


    # Intent of the Facade Pattern


    +   - Provide a unified interface to a set of interfaces in a subsystem.

    +     - Facade defines a higher-level interface that makes the subsystem easier
    to use.'
  merge: -1
  img_proc: true
- pgno: 726
  md: '# Facade Pattern-theory


    # 什么情况下使用门面模式？


    # When to use Facade Pattern?


    Use the Facade pattern when you want to provide a simple interface to a complex
    subsystem.


    +   - Subsystems often get more complex as they evolve.

    +   - A facade can provide a simple default (默认, 缺省) view of the subsystem that
    is good enough for most clients.'
  merge: -1
  img_proc: true
- pgno: 727
  md: '# Facade Pattern-theory


    # Façade pattern的优点(advantages)


    +   1. (解耦)Reduce couplings between a client class and the classes in use.

    +   - In case there exist many dependencies between clients and the implementation
    classes of an abstraction,

    +   - a facade pattern can be used to decouple the subsystem from clients and
    other subsystems, thereby promoting subsystem independence and portability.


    ![](img/95717dc23f76db2057b9aa0c49790307_727_0.png)'
  merge: -1
  img_proc: true
- pgno: 728
  md: '# Facade Pattern-theory


    2. (增加层次) By using a façade pattern, you can layer your subsystems.


    +   - Use a facade to define an entry point to each subsystem level.


    ![](img/95717dc23f76db2057b9aa0c49790307_728_0.png)


    In order to use bad-formed but useful classes, one can write one or several façade
    classes'
  merge: -1
  img_proc: true
- pgno: 729
  md: '# Facade Pattern-theory


    # Façade pattern的缺点(Disadvantages):


    +   - Use of the façade pattern makes the facade harder to use for clients that
    don''t need to customize it.

    +     - In this case, the client can use the subsystem directly.'
  merge: -1
  img_proc: true
