- pgno: 168
  md: '# 2. Batch sequential dataflow system


    # Definition of Batch sequential system:


    +   a) Batch sequential process is formed by a sequence of processing steps, intermediating
    by some kind of storage, such as megatapes, hard disk, etc.

    +   b) Each step will do some operation on the input storage to get some useful
    information or modify the contents of the source storage and then save the resultant
    data to its sink storage.


    ![](img/95717dc23f76db2057b9aa0c49790307_168_0.png)


    Batch sequential pattern'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 2. Batch sequential dataflow system


    # 批处理系统的性质


    # Properties of a Batch sequential system:


    +   a) Processing steps are independent programs (no interaction between any two
    processing steps)


    ![](img/95717dc23f76db2057b9aa0c49790307_169_0.png)


    Proc1，Proc2和Proc3互不调用'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 2. Batch sequential dataflow system


    # 批处理系统的性质


    b) Each step run to completion before the next step starts


    +   - Proc1完整地处理完D1中的数据→将数据存入D2

    +   - Proc2完整地处理完D2中的数据→将数据存入D3

    +   - Proc3完整地处理完D3中的数据→将数据存入D4


    c) Data is transmitted as a whole between steps'
  merge: -1
  img_proc: true
