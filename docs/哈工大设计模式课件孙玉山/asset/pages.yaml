- pgno: 851
  md: "# Example of design using strategy pattern\n\n```\npublic class InsertSort\
    \ implements SortAlgorithm {\n    public int[] sort(int[] intArray, Context ct){\n\
    \        ct.startExecution();\n        for (int i = 1; i < intArray.length; i++){\n\
    \            int j = i;\n            int numToBeInserted = intArray[i];\n    \
    \        while ((j > 0) && (intArray[j-1] > numToBeInserted)) {\n            \
    \    intArray[j] = intArray[j-1];\n                j--;\n            }\n     \
    \       intArray[j] = numToBeInserted;\n        }\n        ct.endExecution();\n\
    \        return intArray;\n    }\n}\n```"
  merge: -1
