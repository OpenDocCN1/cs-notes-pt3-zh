- pgno: 319
  md: '# Case study 1. Legacy File Update


    # Design of the pipe class:


    +   - Pipes in the Legacy file update system are represented as instances of the
    Pipe class.

    +   - An instance of the Pipe class is a composition of two streams: an input
    and an output stream.

    +   - Pipe class connects these two streams in the following way.

    +     - **The data that is written to the input stream is transmitted to the output
    stream.** In this way these data become available for reading from the output
    stream.'
