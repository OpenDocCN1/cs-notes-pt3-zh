- pgno: 947
  md: '# The State Design Pattern


    # Participants


    +   - **Context**

    +     - 定义客户程序需要的接口。 Defines the interface of interest to clients.

    +     - 保持当前状态子类对象。 Maintains an instance of a State subclass that defines the
    current state.

    +     - 可以包含部分业务逻辑'
  merge: -1
  img_proc: true
- pgno: 948
  md: '# The State Design Pattern


    +   - **State**

    +     defines an interface for encapsulating the behavior associated with a particular
    state of the Context.

    +   - **State subclasses**

    +     each subclass implements a behavior associated with a state of the Context.'
  merge: -1
  img_proc: true
- pgno: 949
  md: '# The State Design Pattern


    # When to use state pattern?


    +   a) 当对象的行为依赖于状态，而该对象必须根据其状态（在运行时）改变其行为 When an object’s behavior depends on
    its state, and it must change its behavior (at run-time) depending on that state.


    +   b) 当操作带有大量与状态相关的、多部分的条件语句 When operations have large, multipart conditional
    statements that depend on the object''s state.


    +   - The State pattern puts each branch of the conditional in a separate class.


    +   - This lets you treat the object''s state as an object in its own right that
    can vary independently from other objects.'
  merge: -1
  img_proc: true
- pgno: 950
  md: '# The State Design Pattern


    # 协作关系 (Collaborations)


    +   a) **Context代表状态相关的请求。** Context delegates state-specific requests to the
    current ConcreteState object.


    +   b) **Context可以将自己作为一个对象通过参数传递给状态子类对象，从而可以让状态对象访问Context类的方法。** A context may
    pass itself as an argument to the State object handling the request. This lets
    the State object access the context if necessary.'
  merge: -1
