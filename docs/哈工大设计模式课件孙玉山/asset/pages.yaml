- pgno: 55
  md: '# 2. Main Program and Subroutine


    +   - **Architecture**: the system is composed of a main program and some hierarchically
    organized subroutines

    +     - Main program call higher level subroutines

    +     - Higher level subroutines call lower level subroutines

    +     - The correctness of a subroutine often depends on the subroutine it calls


    【注】A **subroutine** or **subprogram** (also called **procedure**, **method**,
    **function**, or **routine**) is a portion of code within a larger program, which
    performs a specific task and is relatively independent of the remaining code.'
  merge: -1
  img_proc: true
