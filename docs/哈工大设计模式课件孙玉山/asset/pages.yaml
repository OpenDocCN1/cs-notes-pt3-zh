- pgno: 832
  md: '# Theory of the Strategy Pattern




    +   - **Strategy**

    +     - declares an interface common to all supported algorithms.

    +     - Context uses this interface to call the algorithms defined by a ConcreteStrategy.


    +   - **ConcreteStrategy**

    +     - implements the algorithm using the Strategy interface.'
  merge: -1
  img_proc: true
- pgno: 833
  md: "# Theory of the Strategy Pattern\n\n# Context\n\n+   - is configured with a\
    \ ConcreteStrategy object.\n+   - maintains a reference to a Strategy object.\n\
    +   - may define an interface that lets Strategy access its data.\n\n| Context\
    \ |\n|---| \n| -strategy: Strategy |\n| +Context(s: Strategy) |\n| +method1()\
    \ //供Strategy类调用 |\n| +method2() //供Strategy类调用 |"
  merge: -1
  img_proc: true
- pgno: 834
  md: '# Theory of the Strategy Pattern


    # When to use this pattern?


    Use the Strategy pattern in any of the following cases:


    +   1) 当你要处理一些仅仅行为不同的相关的类的时候

    +   When many related classes differ only in their behaviors. Strategies provide
    a way to configure a class with one of many behaviors.


    +   2) 当你要隐藏实现细节的时候 When you need to hide complex algorithm details

    +   When an algorithm uses data that clients shouldn''t know about. Use the Strategy
    pattern to avoid exposing complex, algorithm-specific data structures.'
  merge: -1
  img_proc: true
- pgno: 835
  md: '# Theory of the Strategy Pattern


    # When to use this pattern?


    # 3) 当你要取消许多条件语句的时候 When you want to cancel many conditional statements


    When a class defines many behaviors, and these appear as multiple conditional
    statements in its operations. Instead of many conditionals, move related conditional
    branches into their own Strategy class.'
  merge: -1
  img_proc: true
- pgno: 836
  md: '# Theory of the Strategy Pattern


    Context的实现方式:


    +   a) Pass data to Strategy


    A context may pass all data required by the algorithm to the strategy when the
    algorithm is called. 调用时，Context类将Strategy类所需要的所有数据一次性地传递完毕


    ![](img/95717dc23f76db2057b9aa0c49790307_836_0.png)'
  merge: -1
  img_proc: true
- pgno: 837
  md: '# Theory of the Strategy Pattern


    # b) Pass itself as argument to Strategy Functions


    A context may pass itself as an argument to Strategy operations. That lets the
    strategy call back on the context as required. Context将自己作为一个对象传递给Strategy类，然后Strategy类再利用该对象反过来调用Context类，以便获得某些数据与功能


    ![](img/95717dc23f76db2057b9aa0c49790307_837_0.png)'
  merge: -1
  img_proc: true
- pgno: 838
  md: '# Theory of the Strategy Pattern


    # 通常情况下策略模式的交互


    Working mechanism of the strategy pattern:


    +   Firstly, Clients usually create an object of ConcreteStrategy and pass the
    object to the context;


    +   Secondly, a context forwards requests from its clients to its strategy.


    +   Thereafter, clients interact with the context exclusively.'
  merge: -1
  img_proc: true
- pgno: 839
  md: '# Theory of the Strategy Pattern


    # Client


    main()


    ```

    Strategy stra = new ConcreteStrategyA();

    Context con = new Context(Stra);

    con.goWork();

    ```


    goWork()


    # Context


    +Context(Strategy st)

    +goWork();


    st.operation(this)


    # StrategyA


    +operation(Context c)


    ```

    st.operation(con)

    ```


    Working mechanism of the strategy pattern'
  merge: -1
