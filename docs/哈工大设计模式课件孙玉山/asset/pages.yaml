  md: '# 1.Concepts on client-server


    Definition: Client/Server software architecture is a versatile, message-based
    and modular Infrastructure that is intended to improve


    +   - **Usability** (more efficient to use, easier to learn, more satisfying to
    use)

    +   - **Flexibility** (designs that can adapt when external changes occur )

    +   - **Interoperability** (the ability of diverse systems and organizations to
    work together (inter-operate)), and

    +   - **Scalability** (from 3,000 customers to 20,000 customers)'
  merge: -1
