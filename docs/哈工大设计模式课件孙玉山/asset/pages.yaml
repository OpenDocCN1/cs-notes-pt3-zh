- pgno: 657
  md: '# 三层层次架构与MVC软件体系结构的比较


    +   - 在形式上，三层架构类似于MVC架构，都是由三部分软件模块组成的，但是实际上它们是不同的。


    +   - **两种架构相似之处如下：**

    +     a) 都是由三部分软件模块组成的

    +     b) 三层架构的显示层与MVC架构的View类似；

    +     c) 三层架构的应用层与MVC架构的Model类似。'
  merge: -1
  img_proc: true
- pgno: 658
