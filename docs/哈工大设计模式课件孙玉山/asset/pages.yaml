- pgno: 248
  md: '# Introduction to Factory Method Pattern


    # Functionalities of the factory method (工厂方法的功能):


    +   - Thus, a factory method can be defined as a method in a class that:

    +     - 选择一个类: Selects an appropriate class from a class hierarchy based on the
    application context and other influencing factors

    +     - 创建该类的对象: Instantiates the selected class and

    +     - 以超类的类型返回该对象: returns it as an instance of the parent class type'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Introduction to Factory Method Pattern


    # Advantages of the factory method

    工厂方法的优点


    +   1. Clean Client program (清洗客户程序)


    Application objects can make use of the factory method to get access to the appropriate
    class instance. This eliminates the need for an application object to deal with
    the varying class selection criteria.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Introduction to Factory Method Pattern


    # 2. Hide details in instantiating an object.


    (隐藏初始对象的细节)


    The factory method also implements any special mechanisms required to instantiate
    the selected class.


    +   - This is possible **when different classes in the hierarchy need to be instantiated
    in different ways**. The factory method hides these details from application objects
    and eliminates the need for them to deal with these intricacies.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Introduction to Factory Method Pattern


    3. Client doesn’t need to know which concrete class has been instantiated (客户类只知道哪种类型的对象被创建了，而不必知道哪个具体的子类被初始化了).


    Because the factory method returns the selected class instance as an object of
    the parent class type, a client program does not have to be aware of the existence
    of the classes in the hierarchy.'
  merge: -1
  img_proc: true
