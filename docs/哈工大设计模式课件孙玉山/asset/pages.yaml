  md: '# Java Interface(Java接口)


    # Why use interface?


    +   1) 重复利用 For reuse purpose, an interface can define a set of related functions
    for some special use

    +   2) 声明类型 An interface can be used to claim a type, with its different subclasses
    to implement its functions. The purpose is to realize dynamic binding

    +   3) 代表某个协议 A language environment may need a protocol to do something special
    and so need an interface, e.g., java interface Runnable must be implemented whenever
    a programmer wants to write a multithread program'
