- pgno: 1133
  md: '# Mediator Pattern


    # 中介者模式的主要思想：解耦


    We may use the mediator pattern to reduce the

    direct invocations among objects


    +   - The Mediator pattern suggests abstracting all

    +     object interaction details into a separate

    +     class, a Mediator

    +     - The Mediator will keep a reference of each

    +       of the interacting objects

    +     - The Mediator will provide methods to call

    +       the participating objects'
  merge: -1
  img_proc: true
- pgno: 1134
  md: '# Mediator Pattern


    +   - 两个参与者对象之间怎样实现交互？

    +   - The interaction between any two different objects is routed through the
    Mediator class.

    +     - All objects send their messages to the mediator (call methods of Mediator)

    +     - The mediator then sends messages to the appropriate objects to implement
    the application’s requirements (in the mediator then call methods every other
    objects).'
  merge: -1
