- pgno: 1202
  md: '# Key Technologies of Cloud Computing


    +   - **Master节点功能**

    +     - 存储元数据

    +     - 文件系统目录管理与加锁

    +     - 与 **ChunkServer** 进行周期性通信

    +       - 发送指令，搜集状态，跟踪数据块的完好性

    +     - 数据块创建、复制及负载均衡

    +       - 对ChunkServer的空间使用和访问速度进行负载均衡，平滑数据存储和访问请求的负载

    +       - 对数据块进行复制、分散到ChunkServer中'
  merge: -1
  img_proc: true
- pgno: 1203
  md: '# Key Technologies of Cloud Computing


    +   - **GFS特点**

    +     - 采用中心服务器模式

    +       - 可以方便地增加Chunk Server

    +       - Master掌握系统内所有Chunk Server的情况，方便进行负载均衡

    +       - 不存在元数据的一致性问题

    +     - 不缓存数据（的原因）

    +       - GFS的文件操作大部分是流式读写，不存在大量的重复读写，使用Cache对性能提高不大

    +       - Chunk Server上的数据存取使用本地文件系统，如果某个Chunk读取频繁，文件系统具有Cache

    +     - 在用户态下实现直接利用Chunk Server的文件系统存取Chunk，实现简单'
  merge: -1
  img_proc: true
