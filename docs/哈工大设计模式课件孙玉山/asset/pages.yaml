- pgno: 43
  md: '# 1. Evolution of Program Design


    # 非结构化编程的样式


    ```

    000100 statement 1

    000200 statement 2

    100200 statement 3, GO TO 100500

    100300 statement 4

    100500 statement 523, call Subroutine 1

    100600

    100700 statement 800

    100800

    100000 PROCEDURE DIVISION.

    100100 Subroutine 1 {...}

    Subroutine 2 {...}

    Subroutine 3 {...}

    Subroutine 4 {...}

    Subroutine 5 {...}

    ```


    程序执行顺序：按照顺序执行程序 序，遇go to x语句，跳转到x行


    可以在一个语句中 调用某个子程序


    子程序甚至没有参数传递，可能有几个入口和出口。仅仅是为了反复调用一段程序提供方便。'
  merge: -1
