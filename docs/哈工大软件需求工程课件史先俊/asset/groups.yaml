    # 软件风险管理


    风险管理：就是使用某些工具或步骤把项目风险限制在一个可接受的范围内。


    风险管理包括的活动包括，风险评价，风险避免，风险控制等。


    编写项目风险文档：仅仅认识到项目面临的风险是远远不够的，应该将其编写成文档并妥善进行管理，这样有利于风险承担者了解风险情况状态。


    制定风险管理计划：一张风险列表还不等于一个风险管理计划。'
