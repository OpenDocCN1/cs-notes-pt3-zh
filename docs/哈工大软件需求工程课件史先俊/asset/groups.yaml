    ## 3. 确定使用实例并编写使用实例文档


    - 1. 首先明确执行者和他们的角色，然后确定业务过程，在这一过程中每一个参与者都在为确定使用实例而努力。

    - 2. 确定系统所能反映的外部事件，然后把这些事件与参与的执行者和特定的使用实例联系起来。

    - 3. 以特定的说明形式表达业务过程或日常行为，从这些说明中获得使用实例，并确定参与到使用实例中的执行者，

    - 4. 有可能从现在的功能需求说明中获得使用实例。如果有些需求与使用实例不一致，就应考虑是否真的需要它们。

    - 当用户提出不可行的需求时，开发者总是慎重考虑这些需求的实现问题，参与需求获取的工作有助于使他们能及早认识所要开发的产品。

    - 在举行研习会内的讨论之前，每一分析者总是要求用户考虑他们使用新系统需要完成的任务或业务过程。每一个任务成为一个候选的使用实例，分析者用任务的简明说明对这些使用实例进行编号和命名。

    - 一些实例代表了相关的说明，这些说明可以合并到一个简单的抽象使用实例中。

    - 抛弃一些建议的使用实例，因为它们超出了项目的范围

    - 定义的最初集合以外的附加使用实例。

    - 用户总是趋向于首先确定最重要的使用实例，所以可以根据发现的顺序来确定优先级

    - 首先为最高优先级的实例填写细节部分，然后为余下的候选使用实例重新评估其优先级。

    - 需求获取的每一次讨论会都可以探索出多个使用实例，并根据标准化模板把它们编写成文档。

    - 首先，参与者将第一个从使用实例中获益的人定为操作者；

    - 接下来，他们定义任何满足使用实例运行的先决条件及在完成使用实例后描述系统的后续条件。预先估计的使用频度为并行使用和性能需求提供了一个早期指示。

    - 下一步，分析者询问参与者想怎样与系统交互来完成任务。操作者动作的最终对话顺序和系统响应构成一个流，这个流可视为事件的普通过程。

    - 虽然每个参与者对真正的用户接口和交互机制有不同的想法，但是在执行者—系统对话中，开发组可以在这些步骤上达成共识。

    - 分析者总是在注释中获取单个执行者动作和系统响应，这些注释位于每一个使用实例的流程单上。

    - 另一种指导工作的方法是在计算机中生成一个使用实例模板，并在讨论过程中完善模板内容。由于对话的顺序包含了复杂的逻辑或复合式决策，用诸如流程图等图形表达比用一系列标明数字的步骤表达更有启发性。


