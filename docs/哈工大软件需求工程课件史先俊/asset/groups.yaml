  md: "\n## 第19章 需求管理工具\n\n- 采用文档描述、管理、存储需求的缺点\n  - 很难保持文档与现实的一致。\n  - 通知受变更影响的设计人员是手工过程。\n\
    \  - 不太容易做到为每一个需求保存增补的信息。\n  - 很难在功能需求与相应的使用实例、设计、代码、测试和项目任务之间建立联系。\n  - 很难跟踪每个需求的状态。\n\
    \n- 需求管理工具使用多用户数据库保存与需求相关的信息，让你不必担心以上的问题。\n\n- 小一点的项目可以使用电子表格或简单的数据库管理需求，既保存需求文本，又保存它的几个属性。\n\
    \n- 大项目可以从使用商业需求管理工具中获益，其中包括让用户从源文档中产生需求，定义属性值，操作和显示数据库内容，让需求以各种各样的形式表现出来，定义跟踪能力联系链，让需求同其他软件开发工具相连等功能。\n\
    \n## 一些商业的需求管理工具\n\n有关这些需求管理工具的特性比较及其它几个工具的介绍可以查询系统工程国际委员会的网址www.incose.org /\
    \ toc.html该地址上同时还提供了如何挑选需求管理工具的指导\n\n**表19-1 一些商业的需求管理工具**\n\n| 工具 | 卖主 | 以数据库或文档为核心\
    \ |\n|------|------|------------------------|\n| Caliber-RM | Technology Builders,\
    \ Inc.,<br>http://www.tbi.com | 以数据库为核心 |\n| DOORS | Quality Systems and Software,\
    \ Inc.,<br>http://www.qssinc.com | 以数据库为核心 |\n| QSSrequireit | Quality Systems\
    \ and Software, Inc.,<br>http://www.qssrequireit.com | 以文档为核心 |\n| RequisitePro\
    \ | Rational Software Corporation<br>http://www.rational.com | 以文档为核心 |\n| RTM\
    \ Workshop | Integrated Chipware, Inc.<br>http://www.chipware.com | 以数据库为核心 |\n\
    | Vital Link | Compliance Automation, Inc.,<br>http://www.complianceautomation.com\
    \ | 以文档为核心 |\n\n### 1 使用需求管理工具的益处\n\n- 1) 管理版本和变更\n  - 项目应定义需求基线，基线是每个版本所包括的需求的集合。一些需求管理工具提供灵活的设定基线功能。这些工具可以自动维护每个需求的变更历史，这些工程师/开发者可以记录变更决定的基本原因并根据需要返回到以前的需求版本。通常这些工具包括一个内建的变动建议系统，它可以与变更请求所涉及的需求直接联系。\n\
    \n- 2) 存储需求属性\n  - 对每一个需求应该保存一些属性，正如16章描述的，有关人员应能看到这些属性，选择合适的人员更新这些属性值。需求管理工具产生几个系统定义的属性（例如，需求创建日期和版本号），同时允许定义不同数据类型的其他属性。可以通过排序、过滤，查询数据库来显示满足属性要求的需求子集。\n\
    \n- 3) 帮助影响分析\n  - 通过定义不同种类的需求、子系统的需求、单个子系统和相关系统部件——例如：例子、设计、代码和测试——等各个部分之间的联系链，工具可以确保需求跟踪。联系链可以帮助用来对特定需求所做的改进进行影响分析，即通过确定影响涉及的系统部件做到这一点。最好的\
    \ 是这些工具可以查到功能需求的来源。\n\n### 2 商业需求管理工具\n\n- 商业需求管理工具允许定义不同种类的数据库元素，例如业务需求、使用实例、功能性需求、硬件需求、非功能性需求和测试。这样就可以区分软件需求规格说明中的需求对象及其它有用信息。所有的工具提供了强大的功能用来定义每类需求的属性，这一点是它们相对于基于文本的软件需求规格说明方法的优势。\n\
    - 绝大多数需求管理工具某种程度上同 Word集成，典型的方式是在Word上添加工具条。高级的工具提供丰富的输入、输出文件格式。有些工具允许从文档中挑选特定的文本，把它们看作离散需求，就像同在数据库中添加新需求。当你挑选好作为需求的文本时，工具通常高亮显示需求然后插入到\
    \ Word书签和隐藏的文本中。还可以把文档编成不同的风格来扩展每个需求。文字处理后的文档可能不太完美，但可以通过使用文档风格和关键字来纠正。\n- 工具对每个需求不仅有统一的内部标识符，还支持层次编码的数字标签。这些标识符通常是一个短文本本首，例如UR代表用户需求（User\
    \ Requirement），之后再跟一个唯一的整数。高级的工具提供类似于Windows资源管理器的层次显示方法用来操作需求层次树。DOORS工具可以使得你看到层次结构的软件需求说明书。\n\
    \n- 在应用开发中同其他工具（例如：测试，模型设计，问题跟踪，项目管理工具）相集成。\n\n- 在RequisitePro中不仅可以建立需求与Rational\
    \ Rose的使用实例间的联系，还可以建立与Rational Team Test的测试实例间的联系。\n\n- DOORS允许建立需求与Rational Rose\
    \ 的设计元素间的联系。\n\n- RequisitePro和DOORS能够建立需求与Microsoft Project中的项目任务间的连接。\n\n###\
    \ 3 实现需求管理自动化\n\n- 在应用到关键项目前，一定要先在实验性项目上使用此工具以积累经验\n- 要花费时间先学习工具\n- 一定避免临时开发自己的需求管理工具或者用一些通用的办公自动化产品临时拼凑。似乎这个方法是一个容易的解决方案，但很快就不能适应要求的强度。\n\
    \n## 建议\n\n- 分析现有需求管理过程的缺点，从而确定是否有必要购买商业需求管理工具。确信理解现有缺点的原因，而不是想当然认为工具会纠正它们。\n\
    - 在采购工具前，先估计一下组员是否认为有必要采用工具。根据已有的经验来确定如何做才能成功。\n\n- 大作业要求的软件需求规格说明书的提交时间： 2008年1月15日17：\
    \ 30前\n- 大作业占30分，请各位重视\n\n- 大作业的图示不一定完整，但要有。\n- 至少有一个使用实例及其说明\n\n## 答疑\n\n- 2008年1月12日（本周六）\n\
    - 16:00-18:00\n- 综合楼222\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_473_0.png)\n"
