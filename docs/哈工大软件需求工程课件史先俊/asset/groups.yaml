  - '[PAGE 91]


    反对变更是由于害怕变更带来的影响，因此要指明你进行的过程变更所可能带来的影响，从而减少大家的恐惧感。


    +   - 需求变更控制过程被看成很难进行而被丢弃。要确保变更过程真正能起作用。如果新的过程不能带来更好的结果，那大家将会“绕道而行”了。==steven例子

    +   - 开发人员把编写和审查需求文档看作是浪费时间的官僚做法，妨碍他们的“真正工作”—编写代码。向他们讲清一旦发生重写代码所带来的惨重代价，开发和管理人员将更能明白为什么需要做好需求工作。

    +   - 项目费用没有和开发过程联系起来，开发小组可能会缺少变更的动力，

    +   - 如果目标是通过创建高质量产品以减少技术支持费用，技术支持管理者可能会感到受到威胁。谁希望看到自己的帝国衰败呢？'
