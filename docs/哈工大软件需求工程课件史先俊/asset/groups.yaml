    ## 建议


    - 为你当前开发的系统最核心部件建立一个15～20个需求的跟踪能力矩阵。尝试一下表18-1和18-2的方法。随着项目的开发逐步扩展矩阵。评估一下什么方法最有效以及什么样的收集和存储跟踪能力信息的方法最适合你。

