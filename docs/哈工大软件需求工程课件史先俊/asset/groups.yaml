    # 第19章 需求管理工具


    +   - 采用文档描述、管理、存储需求的缺点

    +     - 很难保持文档与现实的一致。

    +     - 通知受变更影响的设计人员是手工过程。

    +     - 不太容易做到为每一个需求保存增补的信息。

    +     - 很难在功能需求与相应的使用实例、设计、代码、测试和项目任务之间建立联系。

    +     - 很难跟踪每个需求的状态。


    +   - 需求管理工具使用多用户数据库保存与需求相关的信息，让你不必担心以上的问题。


    +   - 小一点的项目可以使用电子表格或简单的数据库管理需求，既保存需求文本，又保存它的几个属性。


    +   - 大项目可以从使用商业需求管理工具中获益，其中包括让用户从源文档中产生需求，定义属性值，操作和显示数据库内容，让需求以各种各样的形式表现出来，定义跟踪能力联系链，让需求同其他软件开发工具相连等功能。'
