  - '[PAGE 286]


    +   - 每一个过程:输入和输出数据项，还有它们的源和目的地

    +   - 数据存储相连的流可以引起建立或消耗数据存储内容的过程

    +   - 绘制数据流图的一些规则:

    +     - 把数据存储放在0层数据流图或更低层子图上，不要放在关联图上。

    +     - 过程是通过数据存储进行通讯，而不是从一个过程直接流到另一过程。类似地，数据不能直接由一个数据存储直接流到另一个数据存储，它必须通过一个过程圆圈。

    +     - 使用数据流图时，不要试图让数据流图反映处理的顺序。'
  - '[PAGE 287]


    +   - 用一个简明的动作命名过程：动词 + 对象。数据流图中所用的名字应对客户有意义，并且与业务或问题域相关。


    +   - 对过程的编号要唯一且具有层次性。在 0 层图上，每个过程的编号用整数表示。如果你为过程 3 创建子图，则子图中的过程编号应表示为 3.1, 3.2
    等等。


    +   - 不要在一个图中绘制多达 7 ~ 10 个以上的过程，否则就很难绘制、更改和理解。


    +   - 不要使某些圆圈只有输入或只有输出。数据流图中圆圈所代表的处理过程通常要求既有输入又有输出。'
  - '[PAGE 288]


    # 4 实体联系图


    +   - 分析实体联系图有助于对业务或系统数据组成的理解和交互，并暗示产品将有必要包含一个数据库

    +   - 实体（entity）是物理数据项（包括人）或者数据项的集合。用单数名词命名并在矩形框中表示。

    +   - 每一实体用几个属性（attribute）来描述；每一实体的单个实例将具有不同的属性值，数据字典中包含这些属性的详细定义

    +   - 实体联系图中的菱形框代表关系，它确定了实体对之间逻辑上和数量上的联系。关系按照关联的属性来命名。

    +   - 在实体和关系的连线上用一个数字或字母表示实体的单联系和多联系

    +     - 一对一（每一个容器历史记录跟踪一个化学制品容器）。

    +     - 多对多（每一个供应商目录中描述了许多种化学制品，并且每种化学制品可以被多个供应商目录表所描述）。'
