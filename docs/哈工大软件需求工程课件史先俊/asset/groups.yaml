    图8-4 使用实例获取方法


    分析者发现对于一些复杂的使用实例，画出图形分析模型是有益的，这些模型包括数据流程图、实体关系图、状态转化图、对象类和联系图(interaction diagram)，还有可能的用户接口机制的对话映射。这些模型描述了需求的不同观点，这样可以经常发现在文档中不易被发现的遗漏、模糊和不一致性的地方。第10章将为“化学制品跟踪系统”图示多种这样的分析模型。


    +   一天之中，在每一个专题研习会之后，分析者给出使用实例的说明和与研习会参与者的有关的功能需求，这些参与者在把他们的工作成果送至下一个研习会之前都要检查这些功能需求。这些经常性的、不正式的检查可以发现许多错误，例如先前没有发现的可选过程和例外、不正确的功能需求及在执行者一系统(actor-syetem)对话中遗失的步骤。使用实例方法通过这样渐增式的检查为提高需求质量提供了有力手段。


    +   - 对于主持高效的获取使用实例的研习会的频繁程度有一个限制。那那些每天都主持研习会的分析者发现：参与者难于在他们所检查的文档中发现错误，因为在他们的思维中这些信息太生疏了。从紧张的思维行为中脱离出来，让头脑休息一两天，可以使你从一个新的角度来看待早先的工作。如果你要从检查文档中得益，那么一周最好只主持二或三个研习会。


    ## 4. 使用实例和功能需求


    +   - 使用实例的描述并不向开发者提供他们所要开发的功能的细节。如果你在用户需求阶段停止了需求开发，你将会发现在软件的构造阶段，开发者必须询问许多问题来弥补他们的信息空白。为了减少这种不确定性，你需要把每一个使用实例叙述成详细的功能需求


    +   - 每一个使用实例可引伸出多个功能需求，这将使执行者可以执行相关的任务；并且多个使用实例可能需要相同的功能需求。例如，如果有5个使用实例需要进行用户身份的验证，你不必因此编写5个不同的代码块。可以用多种方法来编写与一个使用实例相关联的功能需求文档。采用何种方法取决于你是否希望开发组从使用实例文档、软件需求规模说明，或二者相结合来设计、构造并测试。这些方法都不完善，因此选择那些最适合你编写文档和管理项目的软件需求方法。避免在不同地方产生信息冗余，因为冗余将使需求管理变得更加困难。


    ## 1). 仅利用使用实例的方法


    +   - 虽然你仍可能需要用一个独立的软件需求规格说明来记录与特定的使用实例无关的需求，但是一种可能的方法是把功能需求包括在每一个使用实例的说明之中。你必须交叉引用在多个使用实例中重复的那些功能需求。一种方法是可以先前讨论的“包括”的关系来阐述，在这一关系中一些公共功能（如用户身份验证）被分割到一个独立的，可重用的使用实例中。


    ## 2). 利用使用实例和S R S相结合的方法


    +   - 另一种方法是把使用实例说明限制在抽象的用户需求级上，并且把从使用实例中获得的功能需求编入软件需求说明书中。在这种方法中，你将需要在使用实例和与之相关的功能需求之间建立可跟踪性。最好的方法是把所有使用实例和功能需求存入数据库或者业务需求管理工具中，这将允许你定义这些跟踪性联系（见第19章）。


    ## 3.) 仅利用软件需求规格说明的方法


    +   - 第三种方法是通过使用实例来组织软件需求规格说明，并且包括使用实例和功能需求的说明。采用这种方法，你无需独立编写详细的使用实例文档；然而，你需要确定冗余的功能需求，或者对每个功能需求仅陈述一次，并且无论需求是否重复出现在其它使用实例中，都要参考它的原始说明。


    ## 5 使用实例的益处


    +   - 使用实例方法给需求获取带来的好处来自于该方法是以任务为中心和以用户为中心的观点。比起使用以功能为中心的方法，使用实例方法可以使用户更清晰地认识到新系统允许他们做什么。在许多Web开发工程中，用户代表发现，使用实例的方法真正有助于他们弄清Web站点的访问者可以做什么。使用实例有助于分析者和开发者理解用户的业务和应用领域。认真思考执行者一系统对话的顺序，使其可以在开发过程早期发现模糊性，也有助于从使用实例中生成测试用例。


    +   - 如果开发者所编写的代码从未被使用过，这将是令人沮丧的。有了使用实例，所得到的功能需求明确规定了用户执行的特定任务。使用实例技术防止了“孤立”的功能—这些功能在需求获取阶段似乎是一个好的见解，但没有人使用它们，因为它们并没有与用户任务真正地联系在一起。


    +   - 在技术方面，使用实例的方法也带来了好处。使用实例观点揭示了域对象以及它们之间的责任。开发者运用面向对象的设计方法可以把使用实例转化为对象模型。进而，当业务过程随时间而变时，内嵌在特定的使用实例中的任务也会相应改变。如果你跟踪功能需求、设计、编码和测试以至于它们父类的使用实例—用户意见—那么这就很容易看出整个系统中业务过程的级联变化。


    ## 6.避免使用实例陷阱


    +   - 太多的使用实例

    +     - 如果你发现自己陷入使用实例的爆炸之中，你就可能不能在一个合适的抽象级上为之编写文档。不要为每一个可能的说明编写单独的使用实例。而是把普通过程、可选过程以及例外集成起来写入一个简单的使用实例。也不要把交互顺序中的每个步骤看成一个单独的使用实例。每一个使用实例都必须描述一个单独的任务。你将获得比业务需求多得多的使用实例，但你的功能需求将比使用实例还多。每一个使用实例都描述了一个方法，用户可以利用这个方法与系统进行交互，从而达到特定的目标。

    +   - 使用实例的冗余（duplication accross）

    +     - 如果相同的函数出现在多个使用实例中，那么就有可能多次重写函数的实现部分。为了避免重复，可以使用“包括”关系，在这一关系中，将公共函数分离出来并写到一个单独的使用实例中，当其它使用实例需要该函数时，可以请求调用它。


    +   - 使用实例中的用户界面的设计

    +     - 使用实例应该把重点放在用户使用系统做什么，而不是关心屏幕上是怎么显示的。强调在执行者和系统之间概念性的对话的理解，而把用户界面的细节推迟到设计阶段。任何屏幕上的画面和用户界面机制的影响只是使执行者—系统交互的可视化，而并不作为主要的设计说明。


    +   - 使用实例中包括数据定义

    +     - 见过一些包括数据项和数据结构定义的使用实例，可以在该使用实例中操纵这些数据项和数据结构，包括数据类型、长度、格式和合法值。这个方法使项目的参与者难以找到他们所需要的定义，因为使用实例中说明它所包含的每一数据定义是不明显的。这也可能导致冗余的定义，当一个使用实例改变时，其它的没有改变，但破坏了同步性。应该把数据定义集中在适用于整个项目范围的数据字典中（第9章讨论），以便在使用这些数据时减少不一致性。


    +   - 试图把每一个需求与一个使用实例相联系


    使用实例可有效地捕捉大多数所期望的系统行为，但是你可能有一些需求，这些需求与用户任务或其他执行者之间的交互没有特定的关系。这时你就需要一个独立的需要规格说明，在这个规格说明中可以编写非功能需求文档、外部接口需求文档以及一些不能由使用实例得到的功能需求支持。


    ## 7.对客户输入进行分类


    +   - 不要指望你的客户会给需求分析者提供一个简洁、完整、组织良好的需求清单。分析者必须把代表客户需求的许多信息分成不同的类型，这样他们就能合理地编写信息文档并把它们用于最合理的方式上。


    +   - 下图描述了许多这样的类型。那些不属于这些类型的信息可能代表一个非软件项目的需求，例如，为使用新系统而进行的用户培训或者它仅仅是不重要的信息。


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_239_0.png)


    图8-5 用户需求分类


    +   1) 业务需求 描述客户或开发公司可以从产品中得到的资金、市场或其它业务利润的需求就是最可能的业务需求。再听听直接或间接的软件用户得到好处，例如“市场股票价格上升x
    %”，“每年节约$ Y”，或“替代了维护费用高的老一代系统Z”。

    +   2) 使用实例或说明 有关利用系统执行的业务任务或达到用户目标的总的陈述可能就是使用实例，而特定的任务描述表示了用法说明。与客户一起商讨，把特定的任务概括成更广泛的使用实例。可以通过让客户描述他们的业务工作流活动来获取使用实例。

    +   3) 业务规则 当一个客户说，一些活动只能在特定的条件下，由一些特定的人来完成时，该用户可能在描述一个业务规则，例如，“如果一个药剂师在危险化学制品培训方面是可靠的，那么他就可以在一级危险药品清单上订购化学制品”。业务规则是有关于业务过程的操作原则。你可以用一些软件功能需求来加强规则，例如，让“化学制品跟踪系统”可以访问培训记录数据库。正如上面所说的那样，这里业务规则不是功能需求。

