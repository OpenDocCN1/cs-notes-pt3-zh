  - '[PAGE 41]


    # 例子


    +   - **Contoso** 制药公司的高级管理长官 **Gerhard**, 会见 Contoso 公司的信息系统开发小组的新管理员 **Cynthia**。

    +   - “我们需要建立一套化学制品跟踪信息系统”， **Gerhard** 说道。“该系统可以记录库房或某个实验室中已有的化学药品，这样，化学专家可以直接从楼下的某人那里拿到所需的药品，而不必再买一瓶新的。另外，卫生保健部门也得为联邦政府写些关于化学药品的使用报告。你们小组能在五个月内开发出该系统吗？”

    +   - “我已经明白这个项目的重要性了， **Gerhard**”, **Cynthia** 说, “但在我制定计划前，我们必须收集一些系统的需求。”'
  - '[PAGE 42]


    +   - **Gerhard**觉得很奇怪 “你的意思是什么？我不是刚告诉你我的需求了吗？"

    +   - “实际上，你只说明了整个项目的概念与目标，” **Cynthia**解释道，“这些高层次的业务需求并不能为我们提供足够的详细信息以确定究竟要开发什么样的软件，以及需要多长时间。我需要一些分析人员与一些知道系统使用要求的化学专家进行讨论，然后才能真正明白达到业务目标所需的各种功能和用户的要求。我们甚至并不需要开发一个新的软件系统，这样可节省许多钱。”'
  - '[PAGE 43]


    +   - **Gerhard**此前还从未遇到过与这位系统开发人员类似的看法。“那些化学专家都非常忙”他坚持道，“他们没有时间与你们详细讨论各种细节，你不能让你的手下的人说明要做的系统吗？”

    +   - **Cynthia**尽力解释从使用新系统的用户处收集需求的合理性。“如果我们只是凭空猜想用户要求，结果不会令人满意。我们只是软件开发人员，而并非化学专家。我们并不能真正明白化学专家们需要这个化学制品跟踪系统做些什么。我曾经尝试过，未真正明白这些问题就匆忙开始编码，结果没有人对产品满意。”

    +   - “行了，行了，我们没有那么多时间”**Gerhard**坚持道。“我来告诉你需求，请马上开始开发系统。随时将你们的进展情况告诉我。”'
  md: "\n- 但需求变更却越来越多。\n- 为了节省时间，客户的业务人员不再向 **Steven** 申请变更，而是直接找程序员商量。\n- 程序员疲于应付，往往直接改程序而不做任何记录，很多相关文档也忘记修改。\n\
    - 很快 **Steven** 就发现：需求、设计和代码无法保持一致，甚至没有人能说清楚现在系统“到底改成什么样了”。\n\n- 版本管理也出现了混乱，很多\
    \ 人违反配置管理规定，直接在测试环境中修改和编译程序。\n- 但在进度压力下，他也只能佯装不知此事。但因频繁出现“改好的错误又重新出现”的问题，客户已经明确表示“失去了耐心”。\n\
    \n- 而这还只是噩梦的开始。\n- 一个程序员未经许可擅自修改了核心模块，造成系统运行异常缓慢，大量应用程序超时退出。\n- 虽然最终花费了整整3天的时间解决了这个问题，但客户却投诉了，表示“无法容忍这种低下的项目管理水平”。\n\
    - 更糟糕的是，因为担心系统中还隐藏着其他类似的错误，客户高层对项目的质量也疑虑重重。\n\n- 随后发生的事情让**Steven**更加为难\n- 客户的两个负责人对界面风格的看法不一致，并为此发生了激烈争执。\n\
    - **Steven**知道如果发表意见可能会得罪其中一方，于是保持了沉默。\n- 最终客户决定调整所有界面，**Steven**只好立刻动员大家抓紧时间修改。\n\
    - 可后来当听说因修改界面而造成了项目一周的延误后，客户方原来发生争执的两人这次却非常一致，同时气愤地质问**Steven**：“为什么你不早点告诉我们要延期！早知这样才不会让你改呢！”\n\
    - **Steven**很无奈，疑惑自己到底错在哪里了。\n\n## 一、软件需求和客户的需求观\n\n- 1、软件需求的定义\n  - 1、软件需求是一个没有统一定义的名词。客户所定义的需求对开发者而言是一个较高层次的产品概念。而开发人员所说的需求对用户来说又像是详细设计了\n\
    \  - 2、IEEE软件工程中定义：\n    - （1）用户解决问题或达到目标所需的条件或权能\n    - （2）系统或系统部件要满足合同、标准、规范或其它正式规定文档所需具有的条件或权能。\n\
    \    - （3）一种反映上面（1）或（2）所描述的条件或权能的文档说明。\n  - 3、另外一种通用的观点：认为需求是用户所需要的并能触发一个程序或系统开发工作的说明。\n\
    \n## 需求的层次\n\n- 软件需求包括三个不同的层次：业务需求、用户需求、和功能需求。\n  - 1、业务需求 (business requirement)\
    \ 描述了客户对系统，产品实现某些业务流程的高层次目标要求。\n  - 2、用户需求 (user requirement) 描述了用户使用产品必须完成的任务。\n\
    \  - 3、功能需求 (functional requirement) 定义了开发人员必须实现的软件功能。\n  - 它们均应在不同位置体现在软件需求说明书中\n\
    \n## 业务需求\n\n## 项目视图与范围文档\n\n## 用户需求\n\n## 质量属性\n\n## 使用实例文档\n\n## 系统需求\n\n##\
    \ 功能需求\n\n## 其它非功能需求\n\n## 约束条件\n\n## 软件需求规格说明\n\n## 2. 每个项目都有需求\n\n- 每个项目都应该有需求\n\
    \  - 开发软件系统最为困难的部分就是准确说明开发什么，最为困难的概念性工作是编写详细技术需求。\n- 不适当需求的一些风险\n  - 比如无足够用户参与、用户需求不断增加、模棱两可的需求、不必要的特性、过于精减等等，会导致开发不顺利甚至失败\n\
    - 高质量需求的好处：\n  - 极大地减少开发后期和整个维护阶段的工作。\n\n## 3.不合格的需求\n\n- 1. 无足够用户参与\n- 2. 用户需求的不断增加\n\
    - 3. 模棱两可的需求\n- 4. 不必要的特性\n- 5. 过于精简的规格说明\n- 6. 忽略了用户分类\n- 7. 不准确的计划\n\n## 4.高质量需求的好处\n\
    \n- 最大的好处是在开发后期和整个维护阶段的重做的工作大大减少了。\n- **Boehm（1981）** 发现要改正在产品付诸应用后所发现的一个需求方面的缺陷比在需求阶段改正这个错误要多付出**68**倍的成本。\n\
    \  近来很多研究表明这种错误导致成本放大因子可以高达**200**倍。\n- 收集需求能使开发小组更好地了解市场，而市场因素是任何项目成功的一个关键因素。在产品开发前了解这些比在遭到客户批评后才意识到要节约很多成本。\n\
    \n- 让用户积极参与需求收集过程能使产品更富有吸引力，而且能拥有忠实的客户关系。通过了解用户的任务需求而不仅仅局限于一些“华丽”的特性，你能避免在无用功能上白耗精力，并且用户的参与能弥补用户期望和开发者实际开发之间的“鸿沟（期望差异）”。\n\
    - 将选定系统的需求明确地分配到各软件子系统，强调采用产品工程的系统方法。这样能简化硬软件的集成，也能确保软硬件系统功能匹配适当\n- 有效的变更控制和影响分析过程也能降低需求变更带来的负面影响。\n\
    - 将需求编写成清晰、无二义性的文档将会极大地有利于系统测试，确保产品质量，以使所有风险承担者感到满意。\n\n## 5 优秀需求具有的特性\n\n- 特性：\n\
    \  - 1、完整性\n  - 2、正确性\n  - 3、可行性\n  - 4、必要性\n  - 5、划分优先级\n  - 6、无二义性\n  - 7、可验证性\n\
    \n## 6 需求的开发和管理\n\n需求工程\n\n需求开发\n\n需求管理\n\n问题获取\n\n分析\n\n编写规格说明\n\n验证\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_37_0.png)\n\
    \n## 思考：\n\n- 记录你在当前项目或以前项目中所遇到的与需求相关的问题。指明每一个问题是需求开发问题还是需求管理问题，以及这些问题带来的影响及其产生的根本原因。\n\
    - 与你的组员和其他风险承担者（客户，市场调查人员，项目管理者）一起讨论当前或以前项目中的需求问题，其产生的根源和带来的影响。向所有参与者指明，如果想解决这些困难，必须正视它，大家是否为止做好准备了呢？\n\
    - 整理出对整个项目人员一天训练用的软件需求课程，人员要包括重要的客户，市场人员和管理人员。训练是一种有效的团队学习与合作的方法。大家将会在训练中达成术语与技术上的共识，有利于相互交流沟通与协作。\n\
    \n## 软件需求工程\n\n## Software Requirements Engineering\n\n哈尔滨工业大学软件学院\n\n主讲：史先俊\n\
