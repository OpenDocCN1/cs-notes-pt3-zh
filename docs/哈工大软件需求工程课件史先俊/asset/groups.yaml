    # 与需求有关的风险及管理


    +   - 需求获取

    +     - 1) 产品视图与范围

    +       - 没有对产品功能达成一个清晰的共识，则很可能导致项目范围的逐渐扩大。

    +       - 最好在项目早期写一份项目视图与范围将业务需求涵盖在内，并将其作为新的需求及修改需求的指导。

    +     - 2) 需求开发所需时间

    +       - 需求开发工作应占全部工作量的15 %

    +       - 不要因为工期紧张就不按要求作需求。'
