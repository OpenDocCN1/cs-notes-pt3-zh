    # 5 状态转换图


    实时系统和过程控制应用程序可以在任何给定的时间内以有限的状态存在，当满足所定义的标准时，状态就会发生改变，这样的系统是有 限状态机。


    +   - 用矩形框表示可能的系统状态。

    +   - 用箭头连接一对矩形框表示允许的状态改变或转换。

    +   - 用每个转换箭头上的文本标签表示引起每个转换的条件。标签经常既指示条件也指示相应的系统输出。'
