  - '[PAGE 315]


    # 对用户重要的属性


    +   - **1) 有效性**

    +   - 有效性指的是在预定的启动时间中，系统真正可用并且完全运行时间所占的百分比。更正式地说，有效性等于系统的平均故障时间（MTTF）除以平均故障时间与故障修复时间之和。有些任务比其它任务具有更严格的时间要求，此时，当用户要执行一个任务但系统在那一时刻不可用时，用户会感到很沮丧。询问用户需要多高的有效性，并且是否在任何时间，对满足业务或安全目标有效性都是必须的。一个有效性需求可能这样说明：“工作日期间，在当地时间早上6点到午夜，系统的有效性至少达到99.5%，在下午4点到6点，系统的有效性至少可达到99.95%。”'
  - '[PAGE 316]


    +   2) 效率


    效率是用来衡量系统如何优化处理器、磁盘空间或通信带宽的。如果系统用完了所有可用的资源，那么用户遇到的将是性能的下降，这是效率降低的一个表现。拙劣的系统性能可激怒等待数据库查询结果的用户，或者可能对系统安全性造成威胁，就像一个实时处理系统超负荷一样。为了在不可预料的条件下允许安全缓冲，你可以这样定义：“在预计的高峰负载条件下，10
    %处理器能力和15 %系统可用内存必须留出备用。”在定义性能、能力和效率目标时，考虑硬件的最小配置是很重要的。'
  - '[PAGE 317]


    +   - 3) 灵活性

    +   - 就像我们所知道的可扩充性、增加性、可延伸性和可扩展性一样，灵活性表明了在产品中增加新功能时所需工作量的大小。如果开发者预料到系统的扩展性，那么他们可以选择合适的方法来最大限度地增大系统的灵活性。灵活性对于通过一系列连续的发行版本，并采用渐增型和重复型方式开发的产品是很重要的。在我曾经参与的一个图形工程中，灵活性目标是如下设定的：“一个至少具有6个月产品支持经验的软件维护程序员可以在一个小时之内为系统添加一个新的可支持硬拷贝的输出设备。”'
  - '[PAGE 318]


    +   - **4) 完整性**

    +   - 完整性（或安全性）主要涉及：防止非法访问系统功能、防止数据丢失、防止病毒入侵并防止私人数据进入系统。完整性对于通过 WWW 执行的软件已成为一个重要的议题。电子商务系统的用户关心的是保护信用卡信息，Web
    的浏览者不愿意那些私人信息或其他他们所访问过的站点记录被非法使用。完整性的需求不能犯任何错误，即数据和访问必须通过特定的方法完全保护起来。用明确的术语陈述完整性的需求，如身份验证、用户特权级别、访问约束或者需要保护的精确数据。一个完整性的需求样本可以这样描述：

    +   “只有拥有查账员访问特权的用户才可以查看客户交易历史。”'
  - '[PAGE 319]


    # 5) 互操作性


    +   互操作性表明了产品与其它系统交换数据和服务的难易程度。为了评估互操作性是否达到要求的程度，你必须知道用户使用其它哪一种应用程序与你的产品相连接，还要知道他们要交换什么数据。“化学制品跟踪系统”的用户习惯于使用一些商业工具绘制化学制品的结构图，所以他们提出如下的互操作性需求：“化学制品跟踪系统应该能够从ChemiDraw和Chem-Struct工具中导入任何有效化学制品结构图。”'
  - '[PAGE 320]


    # 6) 可靠性


    可靠性是软件无故障执行一段时间的概率健壮性和有效性有时可看成是可靠性的 一部分。衡量软件可靠性的方法包括正确执行操作所占的比例，在发现新缺陷之前系统运行的时间长度和缺陷出现的密度。根据如果发生故障对系统有多大影响和对于最大的可靠性的费用是否合理，来定量地确定可靠性需求。如果软件满足了它的可靠性需求，那么即使该软件还存在缺陷，也可认为达到其可靠性目标。要求高可靠性的系统也是为高可测试性系统设计的。'
  - '[PAGE 321]


    +   7) 健壮性


    健壮性指的是当系统或其组成部分遇到非法输入数据、相关软件或硬件组成部分的缺陷或异常的操作情况时，能继续正确运行功能的程度。健壮的软件可以从发生问题的环境中完好地恢复并且可容忍用户的错误。当从用户那里获取健壮性的目标时，询问系统可能遇到的错误条件并且要了解用户想让系统如何响应。'
  - '[PAGE 322]


    # 8) 可用性


    可用性也称为“易用性”和“人类工程”，它所描述的是许多组成“用户友好”的因素。可用性衡量准备输入、操作和理解产品输出所花费的努力。你必须权衡易用性和学习如何操纵产品的简易性。“化学制品跟踪系统”的分析员询问用户这样的问题：“你能快速、简单地请求化学制品并浏览其它信息，这对你有多重要？”和“你请求一种化学制品大概需花多少时间？”对于定义使软件易于使用的许多特性而言，这只是一个简单的起点。对于可用性的讨论可以得出可测量的目标，例如“一个培训过的用户应该可以在平均
    3分钟或最多5分钟时间以内，完成从供应商目录表中请求一种化学制品的操作。”


    可用性还包括对于新用户或不常使用产品的用户在学习使用产品时的简易程度'
  - '[PAGE 323]


    # 对开发者重要的属性


    +   - 1) 可维护性

    +   - 可维护性表明了在软件中纠正一个缺陷或做一次更改的简易程度。可维护性取决于理解软件、更改软件和测试软件的简易程度，可维护性与灵活性密切相关。高可维护性对于那些经历周期性更改的产品或快速开发的产品很重要。你可以根据修复（fix）一个问题所花的平均时间和修复正确的百分比来衡量可维护性。'
  - '[PAGE 324]


    +   - 2) 可移植性

    +   - 可移植性是度量把一个软件从一种运行环境转移到另一种运行环境中所花费的工作量。软件可移植的设计方法与软件可重用的设计方法相似。可移植性对于工程的成功是不重要的，对工程的结果也无关紧要。可以移植的目标必须陈述产品中可以移植到其它环境的那一部分，并确定相应的目标环境。于是，开发者就能选择设计和编码方法以适当提高产品的可移植性。'
  - '[PAGE 325]


    # 3) 可重用性


    从软件开发的长远目标上看，可重用性表明了一个软件组件除了在最初开发的系统中使用之外，还可以在其它应用程序中使用的程度。比起创建一个你打算只在一个应用程序中使用的组件，开发可重用软件的费用会更大些。可重用软件必须标准化、资料齐全、不依赖于特定的应用程序和运行环境，并具有一般性。确定新系统中哪些元素需要用方便于代码重用的方法设计，或者规定作为项目副产品的可重用性组件库。'
  - '[PAGE 326]


    <!-- no content -->'
  - '[PAGE 327]


    # 4 属性的取舍


    +   - 有时，不可避免地要对一些特定的属性对进行取舍。用户和开发者必须确定哪些属性比其它属性更为重要，并定出优先级。在他们作决策时，要始终遵照那些优先级。

    +   - 一个单元格中的加号表明单元格所在行的属性增加了对其所在列的属性的积极影响。一个单元格中的减号表明单元格所在行的属性增加了对其所在列的属性的不利影响

    +   - 为了达到产品特性的最佳平衡，你必须在需求获取阶段识别、确定相关的质量属性，并且为之确定优先级'
