    - 在涉及人员或团队中交流需求的变更。\n- 跟踪和报告需求状态。\n- 定义和更新需求跟踪能力信息。\n- 尽管忽视和效率不高会随时发生，管理项目需求能确保你投资到需求的收集、归档和分析的努力没有白费。\n\
    - 有效的需求管理策略能在整个开发过程中使项目参与者获悉需求的当前状态信息，从而减少大家在需求认识上的差距。\n\n### 建议\n\n- 恰当选择用来描述功能需求生存期的状态。在软件需求规格说明中定义每个需求的当前状态并且在开发过程中不断更新它。\n\
    - 定义一个确认需求文档的版本控制计划，把这个计划编写成文档并作为需求管理过程的一部分。\n- 把组织用来管理每个项目需求的步骤描述下来。让几个分析员来起草、评审、实验并最终确定过程活动以保证可交付性。确保选择的过程步骤是实际可行和现实的，并且对这个项目有所帮助。\n\
    \n### 第17章 管理需求变更\n\n- 不被控制的变更是项目陷入混乱、不能按进度执行或软件质量低劣的共同原因。\n  - 应仔细评估已建议的变更。\n\
    \  - 挑选合适的人选对变更做出决定。\n  - 变更应及时通知所有涉及的人员。\n  - 项目要按一定的程序来采纳需求变更。\n- 需求文档中一定要反映项目的变更，要是软件需求文档同产品不一致，那它就毫无用处。\n\
    - 变更时，按从高级到低级的顺序对被影响的需求文档进行处理。\n\n### 1 控制项目范围的扩展\n\n- 扩展需求是指在软件需求基线已经确定后又要增添新的功能或进行较大改动。\n\
    - 扩展需求对百分之八十的管理信息系统项目和百分之七十的军事软件项目造成风险。\n- 迟到的需求变更会对已进行的工作有较大的影响。\n- 有些需求的改进是合理且不可避免的。\n\
    - 在你的项目进度表中应该对必要的需求改动留有余地。\n- 若不控制范围的扩展，将使我们持续不断地采纳新的功能，而且要不断地调整资源、进度、或质量目标，这样做极其有害。这儿一点小的改动，那儿一点添加，很快项目就不可能按客户预期的进度和预期质量交付使用了。\n\
    - 管理范围扩展的第一步就是把新系统的视图、范围、限制文档化并作为业务需求的一部分，评估每一项建议的需求和特性，将它与项目的视图和范围相比较决定是否应该采纳它。\n\
    - 强调客户参与的有效的需求获取方法能够减少遗漏需求的数量，只在做出提交承诺和分配资源后才采纳该需求。控制需求扩展的另一个有效的技术是原型法，这个方法能够给用户提供预览所有可能的实现，以帮助用户与开发者沟通从而准确把握用户的真实需求。\n\
    - 事实上，控制范围的扩展的方法是要敢于说“不”。很多人不喜欢说“不”，开发者只好在各种压力下接受每一项建议的需求。“客户总是对的”，“我们将使客户完全满意”这些话哲理上是正确的，一旦按此办事就要付出代价。\n\
    - 忽视代价并不能改变“变更不免费”的事实。开发管理者可以说“现在不行”。“现在不行”比简单地拒绝灵活很多，因为它暗含在后续版本中采纳其特色的希望。把客户提出的所有特色都采纳将会导致错过提交日期、质量下滑、开发人员疲劳不堪。尽管客户并不总对，但他们是上帝，所以你应该尽可能在下一版本中满足他们的需求。\n\
    - 在理想的情况下，在开始构造前应该收集到所有新系统的需求，而且在开发中基本上不变更。这就是“瀑布”型软件开发生存期模型的前提，但在实践中，它却不太有效。当然某种程度上，对特定的版本应该冻结需求，不再变更。然而，很早确定需求却忽视了有时候客户并不知道需要什么的现实，开发人员应该对用户这些需求变更作出响应。为了对付这些实际情况，你需要有根据地采纳变更过程。\n\
    \n### 变更控制策略(原则)\n\n- 所有需求变更必须遵循定义的变更过程，如果一个变更需求未被采纳，则其后的过程不再予以考虑。\n- 对于未获批准的变更，除可行性论证之外，不应再做其它设计和实现工作。\n\
    - 简单请求一个变更不能保证能实现变更，要由项目变更控制委员会（CCB）决定实现哪些变更。\n- 项目风险承担者应该能够了解变更数据库的内容。\n- 绝不能从数据库中删除或修改变更请求的原始文档。\n\
    - 每一个集成的需求变更必须能跟踪到一个经核准的变更请求。\n\n### 变更控制步骤\n\n- 简单模板：\n- 1. 绪论\n  - 1.1 目的\n\
    \  - 1.2 范围\n  - 1.3 定义\n- 2. 角色和责任\n- 3. 变更请求状态\n- 4. 开始条件\n- 5. 任务\n  - 5.1\
    \ 产生变更请求\n  - 5.2 评估变更请求\n  - 5.3 作出决策\n  - 5.4 通知变更人员\n- 6. 验证\n- 7. 结束条件\n-\
    \ 8. 变更控制状态报告\n- 附录：存储的数据项\n"
