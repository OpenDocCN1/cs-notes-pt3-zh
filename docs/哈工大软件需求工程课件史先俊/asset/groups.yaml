    # 2 商业需求管理工具


    +   - 商业需求管理工具允许定义不同种类的数据库元素，例如业务需求、使用实例、功能性需求、硬件需求、非功能性需求和测试。这样就可以区分软件需求规格说明中的需求对象及其它有用信息。所有的工具提供了强大的功能用来定义每类需求的属性，这一点是它们相对于基于文本的软件需求规格说明方法的优势。

    +   - 绝大多数需求管理工具某种程度上同 Wo r d集成，典型的的方式是在Wo r d上添加工具条。高级的工具提供丰富的输入、输出文件格式。有些工具允许从文档中挑选特定的文本，把它们看作离散需求，就像同在数据库中添加新需求。当你挑选好作为需求的文本时，工具通常高亮显示需求然后插入到
    Wo r d书签和隐藏的文本中。还可以把文档编成不同的风格来扩展每个需求。文字处理后的文档可能不太完美，但可以通过使用文档风格和关键字来纠正。

