    \n- 把理论方法付诸实践是改进软件过程（process）的核心所在。避免使用过去使用过的令人头痛的方法。\n\n- 改进之路是从失败、错误开始，还要历经诸如受人为抵制的影响及因任务的时间紧迫导致改进被搁置这样的挫折。\n\
    \n- 需求与其他主要项目过程和风险承担者之间的关系\n\n## 1. 需求与其他项目过程的关系\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_84_0.png)\n\
    \n- 1) 制定项目计划\n  - 需求是制定项目计划的基础。因为开发资源和进度安排的估计都要建立在对最终产品的真正理解之上。\n  - 通常，项目计划指出所有希望的特性不可能在允许的资源和时间内完成，因此，需要缩小项目范围或采用版本计划对功能特性进行选择。\n\
    \n- 2) 项目跟踪和控制\n  - 监控每项需求的状态，以便项目管理者能发现设计和验证是否达到预期的要求。如果没有达到，管理者通常请求变更控制过程来进行范围的缩减。\n\
    \n## 3) 变更控制\n\n在需求编写成文档并制定基线以后，所有接下来的变更都应通过确定的变更控制过程来进行。变更控制过程能确保：\n\n- * 变更的影响是可以接受的。\n\
    - * 受到变更影响的所有人都接到通知并明白这一点。\n- * 由合适的人选来作出接受变更的正式决定。\n- * 资源按需进行调整。\n- * 保持需求文档是最新的版本并是准确的更新文档。\n"
  mdcn: "\n## 1 知识技能\n\n因为需求对项目成功极为重要，所有项目的风险承担者都应该对需求工程的重要性、合理性及其方法有一个基本的了解。\n\n\
    - 1、培训需求分析人员\n- 2、培训软件需求的用户代表和管理人员\n- 3、让开发人员了解应用领域的基本概念\n- 4、编写项目术语汇编\n\n## 2\
    \ 需求获取\n\n- 获取需求的一些途径或者方法：\n  1. 确定需求开发过程\n  2. 编写项目视图和范围文档\n  3. 将用户群分类并归纳各自特点\n\
    \  4. 选择每类用户的产品代表\n  5. 建立典型用户的核心队伍\n\n## 3. 需求分析\n\n- 提炼、分析和仔细审查已收集到的需求，以确保所有的风险承担者都明白其含义并找出其中的错误、遗漏或其它不足的地方。\n\
    - 分析员通过评价来确定是否所有的需求和软件需求规格说明都达到了第1章中优秀需求说明的要求。\n- 分析的目的在于开发出高质量和具体的需求，这样你就能作出实用的项目估算并可以进行设计、构造和测试。\n\
    - 把需求中的一部分用多种形式来描述，如同时用文本和图形来描述,揭示出一些更深的问题\n- 与客户交流以澄清某些易混淆的问题，并明确哪些需求更为重要。其目的是确保所有风险承担者尽早地对项目达成共识并对将来的产品有个相同而清晰的认识。\n\
    \n- 1) 分析需求可行性\n- 2) 绘制系统关联图\n- 3) 创建用户接口原型\n- 4) 建立需求模型\n- 5) 确定需求的优先级\n- 6)\
    \ 创建数据字典\n- 7) 使用质量功能调配\n\n## 4.需求规格说明\n\n- 必须用一种统一的方式来将需求编写成可视文档。\n- 业务需求要写成项目视图和范围文档。\n\
    - 用户需求要用一种标准使用实例模板编写成文档。\n- 而软件需求规格说明SRS则包含了软件的功能需求和非功能需求。你必须为每项需求明确建立标准的惯例，并确定在SRS中采用那种惯例，以确保SRS的统一风格，同时读者也会明白怎样解释它\n\
    \n- 1) 采用S R S模板\n- 2) 指明需求的来源\n- 3) 为每项需求注上标号\n- 4) 记录业务规范\n- 5) 创建需求跟踪能力矩阵\n\
    \n## 5. 需求验证\n\n- 验证是为了确保需求说明准确、完整地表达必要的质量特点。\n- 当你阅读SRS时，可能觉得需求是对的，但实现在时，却很可能会出现问题。\n\
    - 当以需求说明为依据编写测试用例时，你可能会发现说明中的二义性。\n- 而所有这些都必须改善，因为需求说明要作为设计和最终系统验证的依据。客户的参与在需求验证（requirement\
    \ verification）中占有重要的位置。\n\n- 1) 审查需求文档\n- 2) 以需求为依据编写测试用例\n- 3) 编写用户手册\n- 4)\
    \ 确定合格的标准\n\n## 6.需求管理\n\n- 有效的变更管理需要对变更带来的潜在影响及可能的成本费用进行评估。变更控制委员会与关键的项目风险承担者要进行协商，以确定哪些需求可以变更。同时，无论是在开发阶段还是在系统测试阶段，还应跟踪每项需求的状态。\n\
    - 建立起良好的配置管理方法是进行有效需求管理的先决条件。许多开发组织使用版本控制和其它管理配置技术来管理代码，所以你也可以采用这些方法来管理你的需求文档，需求管理的改进也是将全新的管理配置方法引入项目的组织中的一种方法。\n\
    \n- 1) 确定需求变更控制过程\n- 2) 建立变更控制委员会\n- 3) 进行需求变更影响分析\n- 4) 跟踪所有受需求变更影响的工作产品\n- 5)\
    \ 建立需求基准版本和需求控制版本文档\n- 6) 维护需求变更的历史记录\n\n## 7.项目管理\n\n- 目的：在工程允许的范围内满足成本、进度和质量目标的要求，而不需要对他的进度或预算进行增补\n\
    - 项目：为达到预定的目标而从事的有时间 和资源限制的一系列活动\n- 管理：为了实现组织的目标而对组织的资源有效地进行计划、组织、领导、控制的过程\n\n\
    - ▪ 1）管理存在于组织之中，是为了实现组织目标而服务的。\n- ▪ 2）管理由计划、组织、领导、控制这一系列相互关联、连续进行的活动所构成。这些活动称为管理的职能\n\
    - ▪ 3）管理活动既强调目的又注重过程。强调目的就是去做正确的事—效果问题，注重过程就是正确地做事—效率问题。效果是本，效率是标，标本兼重----正确地去做正确的事情。\n\
