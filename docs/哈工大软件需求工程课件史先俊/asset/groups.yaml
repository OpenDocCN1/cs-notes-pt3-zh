    - 将本章所描述的设定优先级模型应用于你当前项目中十个或十五个特性或使用实例上。把计算出来的优先级与用其它方法所设定的优先级进行比较，其结果如何？把它们与你凭直觉判断的优先级相比，其结果又如何？

    - 如果模型所描述的优先级与所设想的有不符合之处，分析模型中哪一部分的结果不合理。尝试着对利润、损失、费用和风险应用不同的优先级。调整模型，直到它所提供的结果与你所期望的一致为止。

    - 一旦你校准并调整好设定需求优先级的模型，把它应用于新的项目。把计算出的优先级结合到决策过程之中，并与使用其它设定需求优先级的方法相比较，看是否所得到的结果更能使风险承担者满意。


    ## 软件开发的V字模型


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_365_0.png)


    ## 需求验证是确定如下内容


    - 软件需求规格说明**正确**描述了预期的系统行为和特征。

    - 从系统需求或其它来源中得到软件需求。

    - 需求是**完整**的和**高质量**的。

    - 所有对需求的看法是**一致**的。

    - 需求为继续进行产品设计、构造和测试提供了足够的基础。


    ## 1 需求评审


    - 非正式评审：把工作产品分发给许多其它的开发人员粗略看一看和走过场似地检查一遍，同时执行者描述产品，且征求意见。


    - 非正式评审对于培养其他人对产品的认识并获得非结构化的反馈是有利的，但非正式评审是非系统化的，不彻底的，或者在实施过程中具有不一致性。可以根据个人爱好方式进行评审。非正式评审不需要记录备案。


    - 正式评审 = 审查：遵循预先定义好的一系列步骤过程。正式评审内容需要记录在案，它包括确定材料、评审员、评审小组对产品是否完整整或是是否需要进一步工作的判定，以及对所发现的错误和所提出的问题的总结。

    - 正式评审小组的成员对评审的质量负责，而开发者则最终对他们所开发的产品 的质量负责

    - 重要的的风险高的需要详细审查，不重要部分只需要用非正式评审就能满足质量要求


    ## 审查过程


    - 1. 参与者


    - 产品的开发者和其可能的同组成员：系统分析员

    - 先前产品的开发者或正在评审的项目规格说明编写者，包括一个系统工程师或系统构造函数、真正的客户

    - 要根据正在审查的文档来开展工作的人们：包括一个开发人员、一个测试人员、一个项目经理和一个用户文档编写人员，这些审查人员将会发现不同类型的问题

    - 限制在7个人左右或者更多

    '
