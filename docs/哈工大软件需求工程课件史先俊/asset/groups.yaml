    # 2.基于用例的方法：


    +   UML: 总画面


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_185_0.png)'
  - '[PAGE 186]


    # 一般教科书定义：


    +   一个使用实例 use-case 描述了系统和一个外部“执行者”（actor）的交互顺序，它体现执行者完成一项任务并给某人带来益处。使用实例为表达用户需求提供了一种方法。


    +   执行者是指一个人，或另一个软件应用，或一个硬件，或其它一些与系统交互以实现某些目标的实体


    +   基于“使用实例”方法进行需求获取的目的在于：描述用户需要使用系统完成的所有任务。'
  - '[PAGE 187]


    +   - 东软定义的需求用例：通过描述系统的功能与外界环境的交互关系，描述出系统的

    +   主要功能。

    +   - 参与者代表系统的用户在使用系统时所扮演的一组角色,一个参与者可以是人,也可以是其它相关系统。

    +   - 用例则代表用来完成某个有业务意义的功能的动作序列

    +   - 它描述系统做什么,但不描述如何做。'
  - '[PAGE 188]


    +   - 所有和系统有交互的东西都认为是参与者。

    +   - 一个用例代表使用系统的一种方法，是系统对参与者所引发的事件的一系列的反映。

    +   - 一个用例可以由多个参与者，一个参与者通常会使用多个用例'
  - '[PAGE 189]


    +   - 除了用例图外，每个用例都要有用例说明，用例说明应该包括下列内容：

    +     - 名字：用例名

    +     - 简单描述：简单地描述用例的目的和作用

    +     - 事件流：对用例做什么的文字描述，可以有一个基本事件流和若干可选事件流

    +     - 非功能性需求：描述用例的非功能性需求，比如性能

    +     - 前置条件：定义此用例启动的先决条件，比如参与者要先登陆等

    +     - 后置条件：定一次用例执行完成后对系统的约束要求

    +     - 扩展点：描述在用例的执行流程中的一些地点，在那里可能执行扩展(extend)该用例的与该点名称相应的用例中过程。'
  - '[PAGE 190]


    # 使用实例和用法说明（UML）


    +   - 是由系统内的元素组成

    +   - 负责系统的功能和行为

    +   - 在执行者启动事件或动作时，由系统执行的事务集合在所有可能的场景中可能出现的所有可能事件'
  - '[PAGE 191]


    # UML用例的元素


    +   - “包” 形状

    +     - 包是模型元素的组合，以类似 **manila** 文件文件夹 的符号表示。您可以将整个系统说明想象为含有所有系统元素的包，包括其他的包、模型、图表和元素。


    +   - 用例

    +     - 代表当参与者使用系统来完成进程时所发生的一组事件。通常，用例是一种相对较大的进程，而不是单个步骤或事务。'
  - '[PAGE 192]


    +   - 参与者

    +     - 代表由外部对象扮演的角色。因此，一个物理对象可由多个参与者表示。通信关系指出参与者以何种方式参与到用例中来。

    +   - 接口

    +     - 指定类、组件、包或其他元素的外部可视操作，而不指定内部结构。

    +     - 接口具有操作，但没有属性、状态或关联。从表示法方面来说，接口可以用两种方式表示：

    +       - 作为一个类形状，将构造型 <<接口>> 附加到通过实现关系支持它的元素上。

    +       - 通过一个圆，附加到以一条实线支持它的元素上。'
  md: "\n## \"化学制品跟踪系统\" 中的产品代表者模型\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_172_0.png)\n\
    \n## 产品代表者的可能活动=职责\n\n- 计划（planning）\n  - * 转化产品的适用范围和局限性\n  - * 定义与其它系统的外部接口\n\
    \  - * 定义从目前用户应用程序过渡到新系统的过渡途径\n- 需求（requirement）\n  - * 访问其它用户，收集他们的需求描述\n  -\
    \ * 提出使用脚本和使用实例\n  - * 解决所建议的需求之间的冲突\n  - * 定义实现优先级\n  - * 确定质量属性和其它非功能需求\n  -\
    \ * 评估用户接口原型\n- 验证和确认（verification and validation）\n  - * 审查需求文档\n  - * 确定用户接受标准\n\
    \  - * 根据使用脚本编写测试用例\n  - * 进行beta测试\n  - * 提供测试数据集\n- 用户帮助\n  - * 编写用户手册和在线帮助\n\
    \  - * 准备教学用的培训材料\n  - * 为同行者提供产品演示\n\n## 变更管理（change management）\n\n- * 对缺陷的改正进行评估并设置其优先级\n\
    - * 对增强的请求进行评估和设置其优先级\n- * 评估需求变更给用户带来的影响\n- * 参加变更控制委员会并参与变更决策\n\n## 需求决策\n\n\
    - 模糊、不一致、超出范围的需求，要有决策。\n- 在项目早期就确定需求问题的决策者\n- 无决策，不能决策，最后落在开发者身上。这是一个非常糟糕的选择，因为开发者通常没有足够多的信息和观点来作出业务上的决策。\n\
    - 通常，应尽可能由处于公司底部的人作出决策，因为他们与问题密切相关，并能得到关于这些问题的广泛信息。\n\n## 决策的建议\n\n- 个别用户需求不一致的意见，必须由产品代表者作出决策。要给产品代表者授权。\n\
    - 不同用户类的不一致需求，那么必须决策出满足哪一类用户的需求更为重要，与产品的业务目标的关系如何。\n- 开发产品时：不同公司客户的不一致需求，运用项目的业务目标来决定那些是你最关心的客户。一个核心的客户有助于主要特性的开发，其它你认为获利较少的客户需求可能要拖延到下一个版本中去。\n\
    - 客户经理的需求与他所在部门的真正用户提出的需求相冲突。客户经理必须服从产品代表者。应避免强迫开发人员对客户不同的需求作出公断，因为这是一个十分失策的观点。\n\
    - 当开发者想象中的产品与客户需求冲突时，通常应该由客户作出决策。“客户总是对的”，百依百顺，也不对。现实中，客户并不总是对的。客户总是持有自己的观点，开发者必须理解并尊重这一观点。\n\
    - 市场部门需求与开发者想开发的系统发生冲突。作为客户的代理人，市场需求具有更重的分量。市场不要总是迁就客户需求，而不管这些需求的合理性和费用如何。市场不要提供极少的信息，而让开发者去定义产品并且由他们自己编写需求文档。\n\
    \n## 建议\n\n- 你的项目获取客户需求的路线图，是否遇到了问题，确定最短路径，将来采用\n- 确定产品代表，明确其职责\n- 谁是你项目中需求冲突解决的决策者？\
    \ 适合吗？ 业绩如何？\n\n## 软件需求工程\n\n## Software Requirements Engineering\n\n哈尔滨工业大学软件学院\n\
    \n主讲：史先俊\n\nEmail hitsxj@163.com\n\n## 第八章 聆听客户的需求\n\n- 用户需求位于软件需求三层结构中间一层。来自项目视图和范围文档的业务需求决定用户需求，它描述了用户利用系统需要完成的任务。从这些任务中，分析者能获得用于描述系统活动的特定的软件功能需求。\n\
    - 把需求获取集中在用户任务上，有助于防止开发组由于草率处理设计问题而造成的失误。\n- 需求获取、分析、编写需求规格说明和验证并不遵循线性的顺序，这些活动是相互隔开、增量和反复的。\n\
    \n## 建议需求开发过程\n\n- 1. 定义项目的视图和范围\n- 2. 确定用户类\n- 3. 在每个用户类中确定适当的代表\n- 4. 确定需求决策者他们的决策过程\n\
    - 5. 选择你所用的需求获取技术\n- 6. 运用需求获取技术对作为系统一部分的使用实例进行开发并设置优先级\n- 7. 从用户那里收集质量属性的信息和其它非功能需求\n\
    - 8. 详细拟订使用实例使其融合到必要的功能需求中\n- 9. 评审使用实例的描述和功能需求\n- 10. 如果有必要，就要开发分析模型用以澄清需求获取的参与者对需求的理解\n\
    - 11. 开发并评估用户界面原型以助想像还未知解的需求\n- 12. 从使用实例中开发出概念测试用例\n- 13. 用测试用例来论证使用实例、功能需求、分析模型和原型\n\
    - 14. 在继续进行设计和构造系统每一部分之前，重复6 ~ 13步\n\n## 1需求获取的指导方针\n\n- 需求获取只有通过有效的客户与开发者的合作才能成功。\n\
    - 对于某些功能的讨论并不意味着即将在产品中实现它。\n- 对于想到的需求必须集中处理并设定优先级，以避免一个不能带来任何益处的无限大的项目。\n- 在每一次座谈讨论之后，记下所讨论的条目，并请参与讨论的用户评论并更正。\n\
    - 流程图和决策树是描述用户执行任务时作出逻辑决策途径的好方法\n\n## 2.基于用例的方法：\n\n- UML: 总画面\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_185_0.png)\n\
    \n## 一般教科书定义：\n\n- 一个使用实例 use-case 描述了系统和一个外部“执行者”（actor）的交互顺序，它体现执行者完成一项任务并给某人带来益处。使用实例为表达用户需求提供了一种方法。\n\
    - 执行者是指一个人，或另一个软件应用，或一个硬件，或其它一些与系统交互以实现某些目标的实体\n- 基于“使用实例”方法进行需求获取的目的在于：描述用户需要使用系统完成的所有任务。\n\
    - 东软定义的需求用例：通过描述系统的功能与外界环境的交互关系，描述出系统的\n主要功能。\n- 参与者代表系统的用户在使用系统时所扮演的一组角色,一个参与者可以是人,也可以是其它相关系统。\n\
    - 用例则代表用来完成某个有业务意义的功能的动作序列\n- 它描述系统做什么,但不描述如何做。\n- 所有和系统有交互的东西都认为是参与者。\n- 一个用例代表使用系统的一种方法，是系统对参与者所引发的事件的一系列的反映。\n\
    - 一个用例可以由多个参与者，一个参与者通常会使用多个用例\n- 除了用例图外，每个用例都要有用例说明，用例说明应该包括下列内容：\n  - 名字：用例名\n\
    \  - 简单描述：简单地描述用例的目的和作用\n  - 事件流：对用例做什么的文字描述，可以有一个基本事件流和若干可选事件流\n  - 非功能性需求：描述用例的非功能性需求，比如性能\n\
    \  - 前置条件：定义此用例启动的先决条件，比如参与者要先登陆等\n  - 后置条件：定一次用例执行完成后对系统的约束要求\n  - 扩展点：描述在用例的执行流程中的一些地点，在那里可能执行扩展(extend)该用例的与该点名称相应的用例中过程。\n\
    \n## 使用实例和用法说明（UML）\n\n- 是由系统内的元素组成\n- 负责系统的功能和行为\n- 在执行者启动事件或动作时，由系统执行的事务集合在所有可能的场景中可能出现的所有可能事件\n\
    \n## UML用例的元素\n\n- “包” 形状\n  - 包是模型元素的组合，以类似 manila 文件文件夹 的符号表示。您可以将整个系统说明想象为含有所有系统元素的包，包括其他的包、模型、图表和元素。\n\
    - 用例\n  - 代表当参与者使用系统来完成进程时所发生的一组事件。通常，用例是一种相对较大的进程，而不是单个步骤或事务。\n- 参与者\n  - 代表由外部对象扮演的角色。因此，一个物理对象可由多个参与者表示。通信关系指出参与者以何种方式参与到用例中来。\n\
    - 接口\n  - 指定类、组件、包或其他元素的外部可视操作，而不指定内部结构。\n  - 接口具有操作，但没有属性、状态或关联。从表示法方面来说，接口可以用两种方式表示：\n\
    \    - 作为一个类形状，将构造型 <<接口>> 附加到通过实现关系支持它的元素上。\n    - 通过一个圆，附加到以一条实线支持它的元素上。\n"
