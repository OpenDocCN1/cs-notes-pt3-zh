    # # 第11章 软件的质量属性


    +   - 1 非功能需求

    +   - 质量属性是很难定义的

    +   - 产品的易用程度如何，执行速度如何，可靠性如何，当发生异常情况时，系统如何处理。这些被称为软件质量属性（或质量因素）的特性是系统非功能（也叫非行为）部分的需求。

    +   - 真正的现实系统中，在决定系统的成功或失败的因素中，满足非功能需求往往比满足功能需求更为重要'
