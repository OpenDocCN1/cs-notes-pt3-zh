    +   - 4. 确定需求决策者他们的决策过程

    +   - 5. 选择你所用的需求获取技术

    +   - 6. 运用需求获取技术对作为系统一部分的使用实例进行开发并设置优先级

    +   - 7. 从用户那里收集质量属性的信息和其它非功能需求'
  - "[PAGE 183]\n\n+   8. 详细拟订使用实例使其融合到必要的功能需求中\n+   \n+   9. 评审使用实例的描述和功能需求\n+  \
    \ \n+   10. 如果有必要，就要开发分析模型用以澄清需求获取的参与者对需求的理解\n+   \n+   11. 开发并评估用户界面原型以助想像还未知解的需求\n\
    +   \n+   12. 从使用实例中开发出概念测试用例\n+   \n+   13. 用测试用例来论证使用实例、功能需求、分析模型和原型\n+   \n\
    +   14. 在继续进行设计和构造系统每一部分之前，重复6 ~ 13步"
