    - 软件需求规格说明不仅是系统测试和用户文档的基础，也是所有子系列项目规划、设计和编码的基础。

    - 它应该尽可能完整地描述系统预期的外部行为和用户可视化行为。除了设计和实现上的限制，软件需求规格说明不应该包括设计、构造、测试或工程管理的细节。


    - 客户和营销部门依赖它来了解他们所能提供的产品。

    - 项目经理根据包含在软件需求规格说明中描述的产品来制定规划并预测进度安排、工作量和资源。

    - 软件开发小组依赖它来理解他们将要开发的产品。

    - 测试小组使用软件需求规格说明中对产品行为的描述制定测试计划、测试用例和试过程。


    - 软件维护和支持人员根据SRS了解产品的某部分是做什么的。

    - 产品发布组在SRS和用户界面设计的基础上编写客户文档，如用户手册和帮助屏幕等。

    - 培训人员根据SRS和用户文档编写培训材料。


    ## 注意

    - 对节、小节和单个需求的号码编排必须一致。

    - 在右边部分留下文本注释区。

    - 允许不加限制地使用空格。

    - 正确使用各种可视化强调标志（例如，黑体、下划线、斜体和其它不同字体）。

    - 创建目录表和索引表有助于读者寻找所需的信息。

    - 对所有图和表指定号码和标识号，并且可按号码进行查阅。

    - 使用字处理程序中交叉引用的功能来查阅文档中其它项或位置，而不是通过页码或节号。


    ## 3 编写需求文档的原则

    - 保持语句和段落的简短。

    - 采用主动语态的表达方式。

    - 编写具有正确的语法、拼写和标点的完整句子。

    - 使用的术语与词汇表中所定义的应该一致。

    - 需求陈述应该具有一致的样式，例如 “系统必须??”或者 “用户必须??”，并紧跟一个行为动作和可观察的结果。例如，“仓库管理子系统必须显示一张所请求的仓库中有存货的化学药品容器清单。”


    - 为了减少不确定性，必须避免模糊的、主观的术语，例如，用户友好、容易、简单、迅速、有效、支持、许多、最新技术、优越的、可接受的和健壮的。当用客说“用户友好”或者“快”或者“健壮”时，你应该明确它们的真正含义并且在需求中阐明用户的意图。


    - 避免使用比较性的词汇，例如：提高、最大化、最小化和最佳化。定量地说明所需要提高的程度或者说清一些参数可接受的最大值和最小值。当客户说明系统应该“处理”、“支持”或“管理”某些事情时，你应该能理解客户的意图。含糊的语句表达将引起需求的不可验证。


    - 不应该把多个需求集中在一个冗长的叙述段落中：不要在需求说明中使用“和/或”，“等等”之类的连词（表明了该部分集中了多个需求）。

    - 让独立性强的需求在需求管理工具或数据库中只出现一次，这样可以缓和冗余问题。


    ## 多详细为好？

    - 顶层不明确的需求向低层详细分解，直到消除不明确性为止

    - 如果评审人员对客户的意图还不甚了解，那么就需要增加额外的说明，以减少由于误解而产生返工的风险。

    - 恰如其分的需求详细程度：编写测试用例验证这个需求能够正确地实现，那么就达到了合理的详细程度。如果你预想的测试很多并且很分散，那么可能就要将一些集合在一起的需求分离开。已经建议将可测试的需求作为衡量软件产品规模大小的尺度


    ## 4.需求改进

    - 高质量需求陈述的许多特性：完整性、正确性、可行性、必要性、设定优先级、明确性和可验证性。

    - 根据上述质量特性来检查每一个需求陈述

    '
