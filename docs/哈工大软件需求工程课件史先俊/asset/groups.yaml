    # 1 知识技能


    因为需求对项目成功极为重要，所有项目的风险承担者都应该对需求工程的重要性、合理性及其方法有一个基本的了解。


    +   - 1、培训需求分析人员

    +   - 2、培训软件需求的用户代表和管理人员

    +   - 3、让开发人员了解应用领域的基本概念

    +   - 4、编写项目术语汇编'
  - '[PAGE 66]


    # 2 需求获取


    +   - 获取需求的一些途径或者方法：

    +     1. 确定需求开发过程

    +     2. 编写项目视图和范围文档

    +     3. 将用户群分类并归纳各自特点

    +     4. 选择每类用户的产品代表

    +     5. 建立典型用户的核心队伍'
  - '[PAGE 67]


    <!-- no content -->'
  - '[PAGE 68]


    # 3. 需求分析


    +   - 提炼、分析和仔细审查已收集到的需求，以确保所有的风险承担者都明白其含义并找出其中的错误、遗漏或其它不足的地方。

    +   - 分析员通过评价来确定是否所有的需求和软件需求规格说明都达到了第1章中优秀需求说明的要求。

    +   - 分析的目的在于开发出高质量和具体的需求，这样你就能作出实用的项目估算并可以进行设计、构造和测试。

    +   - 把需求中的一部分用多种形式来描述，如同时用文本和图形来描述,揭示出一些更深的问题

    +   - 与客户交流以澄清某些易混淆的问题，并明确哪些需求更为重要。其目的是确保所有风险承担者尽早地对项目达成共识并对将来的产品有个相同而清晰的认识。'
  - '[PAGE 69]


    +   - 1) 分析需求可行性

    +   - 2) 绘制系统关联图

    +   - 3) 创建用户接口原型

    +   - 4) 建立需求模型

    +   - 5) 确定需求的优先级

    +   - 6) 创建数据字典

    +   - 7) 使用质量功能调配'
  - '[PAGE 70]


    # 4.需求规格说明


    +   - 必须用一种统一的方式来将需求编写成可视文档。

    +   - 业务需求要写成项目视图和范围文档。

    +   - 用户需求要用一种标准使用实例模板编写成文档。

    +   - 而软件需求规格说明SRS则包含了软件的功能需求和非功能需求。你必须为每项需求明确建立标准的惯例，并确定在SRS中采用那种惯例，以确保SRS的统一风格，同时读者也会明白怎样解释它'
  - '[PAGE 71]


    +   - 1) 采用S R S模板

    +   - 2) 指明需求的来源

    +   - 3) 为每项需求注上标号

    +   - 4) 记录业务规范

    +   - 5) 创建需求跟踪能力矩阵'
  - '[PAGE 72]


    # 5. 需求验证


    +   - 验证是为了确保需求说明准确、完整地表达必要的质量特点。

    +   - 当你阅读SRS时，可能觉得需求是对的，但实现在时，却很可能会出现问题。

    +   - 当以需求说明为依据编写测试用例时，你可能会发现说明中的二义性。

    +   - 而所有这些都必须改善，因为需求说明要作为设计和最终系统验证的依据。客户的参与在需求验证（requirement verification）中占有重要的位置。'
  - '[PAGE 73]


