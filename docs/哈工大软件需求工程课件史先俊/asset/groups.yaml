    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_294_0.png)\n\n图10-4 “化学制品跟踪系统”中一种化学制品使用实例的对话图\n\
    \n## 7 类图\n\n- 类描述包含了属性（数据）和在属性上执行的操作。类图(class diagram)是用图形方式叙述面向对象分析所确定的类以及它们之间的关系。\n\
    - 不要把用户类和对象类相混淆，虽然它们名字相似，但并不存在特定的联系\n- 连线代表了类之间的联系。在连线上所示的数字表示了联系的复杂度，\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_296_0.png)\n\
    \n图10-5 化学制品跟踪系统中的部分类图\n\n## 8 结构化模型的不足\n\n- 传统的结构化模型的设计所建立的模型不能反应源代码，与程序设计脱节。模型与代码几乎没什么关系。这样的模型不能生成代码，代码更不能生成模型，模型大多是画给领导看或拿出作掩盖。所以不能保证软件的质量，更不易软件的维护，没什么约束力也没有检测的标准，它的弊端是显于易见的。\n\
    \n## 9.面向对象的模型设计方法\n\n- 利用面向对象方法，把应用程序分成许多小块（对象），这些对象是独立的，然后组合这些对象，建立程序\n- 特点：包装、继承、多态\n\
    - 常用的建模工具： PlayCase, Rational ROSE, Computer Association BPWin, Computer Association\
    \ ERWin, Oracle Designer/2000, Sybase PowerDesigner\n- 通过将用户的业务需求映射为代码，保证代码满足这些需求，代码能方便地回溯需求，这个过程叫建模。\n\
    \n## ROSE建模工具\n\n- 用ROSE这个工具，我们可以建立UML的软件系统的模型,可以自动生成和维护C++、JAVA、VB、PB、ORACLE等语言和系统的代码\n\
    - 核心：\n  1. 用例图use case diagram，描述系统功能\n  2. 类图class diagram，描述系统的静态结构\n  3. 对象图object\
    \ diagram，描述系统在某个时刻的静态结构\n  4. 序列图sequence diagram，按时间顺序描述系统元素间的交互\n  5. 协作图Collaboration\
    \ diagram，按照时间和空间顺序描述系统元素间的交互和它们之间的关系\n  6. 状态图state diagram，描述了系统元素的状态条件和响应\n\
    \n7. 活动图activity diagram，描述了系统元素的活动\n8. 组件图component diagram，描述了实现系统的元素的组织\n9.\
    \ 配置图deployment diagram，描述了环境元素的配置，并把实现系统的元素映射到配置上\n\n根据它们在不同架构视图的应用，可以把9种图分成：\n\
    用户模型视图：用例图\n结构模型视图：类图、对象图\n行为模型视图：序列图、协作图、状态图、活动图（动态图）\n实现模型视图：组件图\n环境模型视图：配置图\n\
    \n## 需求分析阶段\n\n- 建立用户需求和功能模块，确定系统中的角色和使用案例。利用ROSE，生成角色，使用案例和生成用例图所用到的框图：\n\n1.\
    \ Use-Case Diagrams: 显示使用案例（表示系统功能）与角色（人或系统）间的交互：在不展现一个系统或系统内部结构的情况下，对系统或系统的连贯的功能单元的定义和描述。\n\
    \n2. sequence diagram：按时间先后顺序，从上到下分析使用案例，确定案例的处理流程。\n\n超级用户\n磁盘\n文件临时存储队列数据库\n\
    隔离\n数据库\n1: 打开文件目录\n2: 列出磁文件\n3: 选择文件\n4: 文件入隔离\n5: 录入文件信息\n6: 入库\n图2.2.1 入库顺序图\n\
    \n## 3 Collaboration diagram：确定对象之间的关系的处理过程的分析流程\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_303_0.png)\n\
    \n图2.2.2 入库协作图\n\n- 概要设计阶段：通过分析Use-Case Diagrams，得到所用到的类，分析这些类的属性、操作和它们之间的关系\n\
    \n- Class Diagrams：显示系统中类与类之间的交互\n\n- 包：具有一些共性的类组合在一起的图。\n\n- 详细设计阶段：细化和个性Use-Case的描述，如类的操作和对象之间的消息相对应，填充参数及复杂的类的设计\n\
    \n1.Class Diagrams\n\n2.State Diagrams:显示一个对象从生成到删除的生命周期\n\n- 编码和测试阶段：进行软件的开发和测试，生成组件框图。组件：表示代码的物理模块\n\
    - 组件框图：表示系统中的组件及相互依赖性。\n- Delpoyment Diagrams:显示网络中的物理布局和各种组件的位置\n\n## 双向工程\n\n\
    - **1.生成代码：** 根据选择开发应用程序的语言生成对应的程序的代码。\n- 步骤：检查模型-生成组件-将类映射组件-设置代码生成属性-选择类、组件和包-生成代码\n\
    - **2.逆向转出工程：** 根据程序的代码,生成需要的模型：类图、序列图等\n- 步骤：检查模型-生成组件-将类映射组件-设置代码生成属性-选择类、组件和包-生成代码\n\
    \n## 建议\n\n- 使用一个编写完整的软件设计文档来实践本章所描述的建模技术。\n\n- 找出软件需求规格说明中读者难于理解的部分或者发现缺陷的部分。选择一个本章所描述的适于表示部分需求的分析模型。绘制模型并评估如果你在需求开发的早期阶段创建它，是否对你有帮助。\n\
    \n- 接着，需要把一些需求编写成文档，选择一种可以补充文本模型的建模技术。在纸上勾画模型一两次，以确信你的方法是正确的，然后使用支持你所使用的建模符号的商业CASE工具。逐渐地，把对这部分不断建模融合进你的标准需求开发过程。\n"
