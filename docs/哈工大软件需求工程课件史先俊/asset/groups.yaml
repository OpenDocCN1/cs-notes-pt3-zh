    \ 工作中、工作之余的伙伴，朋友。互相帮助\n- 客户是恋人！\n  - 生生死死永不分。\n\n建立正确的客户观\n\n优秀的软件产品是建立在优秀的需求的基础之上。而高质量的需求来源于客户和开发人员之间有效的交流和合作。\n\
    \n- 1、软件客户需求权利书：列出了十条关于客户在项目需求工程实施中与分析人员，开发人员交流时的合法要求。\n- 2、软件客户需求义务书：列出了十条关于客户在需求过程中应承担的义务。\n\
    \n### 软件客户需求权利书\n\n1. 要求分析人员使用符合客户语言习惯的表达。\n2. 要求分析人员了解客户系统的业务及目标。\n3. 要求分析人员组织需求获取期间所介绍的信息，并编写软件需求规格说明。\n\
    4. 要求开发人员对需求过程中所产生的工作结果进行解释说明。\n5. 要求开发人员在整个交流过程中保持和维护一种合作的职业态度。\n6. 要求开发人员对产品的实现及需求都要提供建议，拿出主意。\n\
    7. 描述产品使其具有易用、好用的特性。\n8. 可以调整需求，允许重用已有的软件组件。\n9. 当需要对需求进行变更时，对成本、影响、得失（trade-off）有个真实可信的评估。\n\
    10. 获得满足客户功能和质量要求的系统，并且这些要求是开发人员同意的。\n\n### 软件客户需求义务书\n\n1. 给分析人员讲解业务及说明业务方面的术语等专业问题。\n\
    2. 抽出时间清楚地说明需求并不断完善。\n3. 当说明系统需求时，力求准确详细。\n4. 需要时要及时对需求做出决策。\n5. 要尊重开发人员的成本估算和对需求的可行性分析。\n\
    6. 对单项需求、系统特性或使用实例划分优先级。\n7. 评审需求文档和原型。\n8. 一旦知道要对项目需求进行变更，要马上与开发人员联系。\n9. 在要求需求变更时，应遵照开发组织确定的工作过程来处理。\n\
    10. 尊重需求工程中开发人员采用的流程（过程）。\n\n### 3 签约\n\n- 重要性：为所开发产品的需求签订协议是客户与开发人员关系中的重要部分。\n\
    - 有的作为合同的一部分（附件）\n- 是开发人员设计、编程和测试的依据\n- 重大需求变更需增加开发费用\n- 是项目验收的最重要标准\n- 是双方解决分歧的起点，和最终结果形成的依据\n\
    \n### 3 片面或错误认识\n\n- 客户代表经常把“签约”看作是毫无意义的。“他们要我在一张纸的最后一行文字下面签上名字，于是我就签了，否则这些开发人员不开始编码。”这种态度将来会带来麻烦，譬如客户想更改需求或对产品有不满时。“不错，我是在需求上签署了名字，但我并没有时间去读完所有的内容。我是相信你们的，是你们非要让我签字的。”\n\
    - 同样的问题也会发生在仅把签约看作是完成文档的管理人员身上。一旦有需求变更出现，他便指着软件需求规格说明说道：“但你已经在需求上签约了，所以这些便是我们所要开发的。如果你想要别的东西，你应早些告诉我们。”\n\
    \n### 签约的涵义：\n\n1. 不可能在项目早期就预知所有的需求，而且毫无疑问需求将会出现变更。需求上签约是终止需求开发过程的正确方法——项目的一个里程碑。\n\
    2. 签约是建立在一个需求协议的基线上，需求规格说明上的签约应该这样理解： “我同意这份文档表述了目前我们对项目软件需求的了解。进一步的变更可在此基线上通过项目定义的变更过程来进行。我知道变更可能会使我们要重新协商成本、资源和项目工期任务等”。\n\
    3. 达成一定共识，减少矛盾，给初步的需求开发工作画上双方都明确的句号，会有助于形成一个持续良好的客户与开发人员的关系，为项目成功奠定基础。\n\n###\
    \ 小结\n\n- **1、软件需求的定义（有多种理解，以IEEE为主）。**\n- **2、理解软件需求的层次以及各部分组成关系。**\n- **3、优秀需求的特性和给工程实施带来的好处。**\n\
    - **4、需求工程中需求开发和需求管理的关系和层次。**\n- **5、理解客户含义以及客户的层次。**\n- **6、了解客户和开发人员之间关系以及客户需求权利书和义务书的基本内容。**\n\
    \n### 思考题：\n\n1. 软件需求的定义？\n2. 描述客户和用户概念并加以区别以及描述客户和开发人员之间的关系。\n3. 根据以往的工程经验，描述一下在做需求调研时与客户相处时发生的摩擦以及碰到一些问题。\n\
    \n### 作业\n\n- 大作业的客户有哪些？\n- 大作业的业务需求是什么？\n  - 老师课上讲的\n  - 你的客户领导要求的\n- 发电子邮件到hitsxj@163.com\n\
    \n### 第三章 需求工程的推荐方法\n\n- 需求开发方法\n  - 需求获取\n  - 需求分析\n  - 编写规格说明的方法\n  - 需求验证的方法\n\
    - 需求管理方法\n  - 知识技能\n  - 需求变更管理\n  - 项目管理\n- 方法太多，怎么用？\n  - 按实施的优先顺序和实施难度进行，循序渐进，先从那些相对容易实施而对项目有很大影响的方法开始\n\
