    +   2) 以需求为依据编写测试用例

    +   3) 编写用户手册

    +   4) 确定合格的标准'
  - '[PAGE 74]


    # 6.需求管理


    +   - 有效的变更管理需要对变更带来的潜在影响及可能的成本费用进行评估。变更控制委员会与关键的项目风险承担者要进行协商，以确定哪些需求可以变更。同时，无论是在开发阶段还是在系统测试阶段，还应跟踪每项需求的状态。

    +   - 建立起良好的配置管理方法是进行有效需求管理的先决条件。许多开发组织使用版本控制和其它管理配置技术来管理代码，所以你也可以采用这些方法来管理你的需求文档，需求管理的改进也是将全新的管理配置方法引入项目的组织中的一种方法。'
