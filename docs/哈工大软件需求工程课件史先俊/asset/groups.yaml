    # 2. 从客户需求到分析模型


    +   - 根据客户输入，把重要的名词和动词映射成特定的模型组件


    | 单词类型 | 例子 | 分析模型组件 |

    |---|---|---|

    | 名词 | • 人、组织、软件系统、数据项或者存在对象 | • 端点或数据存储（DFD）<br>• 实体或它们的属性（ERD）<br>• 类或它们的属性（类图）
    |

    | 动词 | • 行为、用户可做的事或可发生的事件 | • 过程（DFD）<br>• 关系（ERD）<br>• 转化（STD）<br>• 类操作（类图） |'
  - '[PAGE 280]


    # 3 数据流图


    +   - 确定了系统的转化过程、系统所操纵的数据或物质的收集（存储），还有过程、存储、外部世界之间的数据流或物质流。

    +   - 适用于事务处理系统和其它功能密集型应用程序。通过加入控制流元素后，数据流图技术就可以扩充到允许实时系统的建模

    +   - 层次分解法:高层数据流图对数据和处理部分提供一个整体的统筹，这是对包含在软件需求规格说明中的精确、详细叙述的补充。'
  - '[PAGE 281]


    +   - 关联图是数据流图最高层的抽象：把整个系统表示成一个简单的黑匣子的过程，并用一个圆圈表示。关联图还表示出外部实体或与系统有关的端点，以及在系统与端点之间的数据和物质流。在关联图中，元素之间的流往往代表了复杂的数据结构，这些数据结构在数据字典中定义'
  - '[PAGE 282]


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_282_0.png)'
  - '[PAGE 283]


    +   - **0层数据流图:**关联图中所有的数据流也出现在0层数据流图上

    +   - **0层数据流图**包含了许多数据存储（**data store**），它是用一对水平的平行线表示，由于数据存储在系统内部，因此它们并不出现在关联图中。从圆圈到数据存储的流表示数据放入数据存储器，从数据存储器出来的流表示一个读操作，而数据存储器和圆圈之间的双向箭头则表示一个更新操作。'
