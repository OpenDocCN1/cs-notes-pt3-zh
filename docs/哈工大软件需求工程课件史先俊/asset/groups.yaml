    - 不要从水平原型的性能推测最终产品的性能。原型可能没有运行在最终产品所处的特定环境中，并且你开发原型的工具与开发产品的工具在效率上是存在差异的。\n- 在原型屏幕显示和报表中使用合理的模拟数据。那些评价原型的用户会受不现实数据的影响而不能把原型看成真正产品的模型。\n\
    - 不要期望原型可以代替需求文档。原型只是暗示了许多后台功能，因此必须把这些功能写入软件需求规格说明，使之完善、详细并且可以有案可稽。\n\n## 建议\n\
    - 查明你的项目中引起需求混乱的部分（如使用实例）。用书面原型勾画出代表你对需求的理解和如何实现的可能用户界面。让一些用户利用你的原型模拟执行一个任务或使用实例。确定对需求的最初理解中不完整和不正确的部分。相应地更改原型并重新检验。\n\
    - 给你的原型评价者递交一份本章信息的总结。这将有助于他们理解原型背后的原理，并且使之期望原型法结果的现实。\n\n- 考试时间 21周 周一\n- 学号单号在\
    \ A103\n- 学号双号在 A12\n- 18:00~~20:00\n\n## 第13章 设定需求优先级\n- 开发组不能做到同时交付一个包罗万象并且具有高质量的产品。把首发版中必须包括的需求与可以放入以后版本的需求区分开。有一些使用实例似乎经常执行而其它的则很少有人使用。\n\
    - 最好每个人都赞成首先实现需求的子集。\n- 每一个具有有限资源的软件项目必须理解所要求的特性、使用实例和功能需求的相对优先级。\n- 设定优先级有助于项目经理解决冲突、安排阶段性交付，并且做出必要的取舍。\n\
    - 每一个需求的优先级必须写入软件需求规格说明或使用实例的说明中\n"
  mdcn: "\n- 如果软件要在多平台下运行（可移植性），那么就不要对可用性抱有乐观态度。\n- 可重用软件能普遍适用于多种环境中，因此，不能达到特定的容错（可靠性）或完整性目标。\n\
    - 对于高安全的系统，很难完全测试其完整性需求；可重用的类组件或与其它应用程序的互操作可能会破坏其安全机制。\n- 在软件中，其自身不能实现质量特性的合理平衡。在需求获取的过程中，加入对质量属性期望的讨论，并把你所了解的写入软件需求规格说明中。这样，才有可能提供使所有项目风险承担者满意的产品。\n\
    \n## 建议\n- 定性、定量的写出你的大作业中的质量属性。\n- 说明他们之间互相影响的关系\n\n## 第12章通过原型法减少项目风险\n- 原型是“什么”和“为什么”要原型\n\
    \  - 一个软件原型通常仅仅是真实系统的一部分或一个模型，并且它可能根本不能完成任何有用的事\n  - 利用这种技术减少客户对产品不满意的风险，原型可以使新产品实在化，为使用实例带来生机,并消除你在需求理解上的差异\n\
    \  - 为了解决在产品开发的早期阶段不确定的问题\n\n## 目的\n- **明确并完善需求**\n  - 原型作为一种需求工具，它初步实现所理解的系统的一部分。用户对原型的评价可以指出需求中的许多问题，在你开发真正产品之前，可以最低的费用来解决这些问题。\n\
    - **探索设计选择方案**\n  - 原型作为一种设计工具，用它可以探索不同的用户界面技术，使系统达到最佳的可用性，并且可以评价可能的技术方案。\n- **发展为最终的产品原型**\n\
    \  - 作为一种构造工具，是产品最初子集的完整功能实现，通过一系列小规模的开发循环，你可以完成整个产品的开发。\n\n- 一个模型(mock-up)展示给用户的是在原型化屏幕上可用的功能和导航选择。有一些导航可能起作用，但是用户可能仅看到描述在那一点将真正显示的内容的信息。数据库查询所响应的信息是假的或者只是一个固定不变的信息，并且报表内容也是固定不变的。虽然原型看起来似乎可以执行一些有意义的工作，但其实不然。这种模拟足以使用户判断是否有遗漏、错误或不必要的功能。原型代表了开发者对于如何实现一个特定的使用实例的一种观念。用户对原型的评价可以指出使用实例的可选过程，遗漏的过程步骤，或原先没有发现的异常情况。\n\
    \n- 垂直原型（**vertical prototype**），也叫做结构化原型或概念的证明，实现了一部分应用功能。当你不能确信所提出的构造软件的方法是否完善或者当你需要优化算法，评价一个数据库的图表或测试临界时间需求时，你就要开发一个垂直原型。垂直原型通常用在生产运行环境中的生产工具构造，使其结果一目了然（更有意义）。比起在软件的需求开发阶段，垂直原型更常用于软件的设计阶段以减少风险。\n\
    \n## 3 抛弃型原型或进化型原型\n- 在原型达到预期目的以后将它抛弃，所以可以花最小的代价尽快地建立该原型。如果你在原型上付出的努力越多，那么项目的参与者就越不愿意将它抛弃\n\
    - 当你遇到需求中的不确定性、二义性、不完整性或含糊性时，最合适的方法是建立抛弃式模型。\n\n- 进化型原型:在已经清楚地定义了需求的情况下，进化型原型为开发渐增式产品提供了坚实的构造基础.是螺旋式软件开发生存周期模型的一部分,也是一些面向对象软件开发过程的一部分\n\
    - 进化式模型一开始就必须具有健壮性和产品质量级的代码。必须设计为易于升级和优化.\n- 从测试和首次使用中获得的信息将引起下一次软件原型的更新,正是这样不断增长并更新,使软件才能从一系列进化型原型发展为实现最终完整的产品。这种原型提供了可以使用户快速获得有用功能的方法。\n\
    \n## 表12-1 软件原型的典型应用\n\n|  | 抛弃型 | 演化型 |\n|---|---|---|\n| 水平 | • 澄清并精化使用实例和功能需求<br>•\
    \ 查明遗漏的功能<br>• 探索用户界面方法 | • 实现核心的使用实例<br>• 根据优先级，实现附加的使用实例<br>• 开发并精化Web站点 |\n\
    | 垂直 | • 证明技术的可行性 | • 实现并发展核心的客户/服务器功能层和通信层<br>• 实现并优化核心算法 |\n\n- 可以利用从一系列抛弃型原型中获得的知识来精化需求，然后，通过一个进化型原型序列，可以渐增式地实现需求。\n\
    - 在最终设计用户界面之前，使用抛弃式水平原型澄清需求，而与之对应的垂直原型则使核心应用程序算法有效。\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_340_0.png)\n\
    \n## 4 书面原型和电子原型\n- 书面原型把一个系统某部分是如何实现的呈现\n- 在用户面前,书面原型有助于判断用户和开发者在需求上是否达成共识。他们可以使你在开发产品代码前，对各种可能的解决方案进行试验性的并且低风险的尝试。\n\
    - 纸张、索引卡、粘贴纸、塑料板、白板和标记器。在纸张上勾画界面。\n- 可以对屏幕布局进行构思，而并不必关心那些按钮和小装饰物应该出现在什么位置上。\n\n\
    - 基于计算机精心制作的电子原型\n  - 编程语言，例如： Microsoft Visual Basic, IBM VisualAge Smalltalk\
    \ 和 Inprise Delphi.\n  - 脚本语言，例如： Perl, Python 和 R e x x\n  - 商品化的建立原型的工具包、屏幕绘图器和图形用户界面构筑师。\n\
    \n## 5 原型评价\n- 可以从使用实例和原型描述的功能中获得评价脚本\n- 可以询问以下一般性的问题\n  - 这个原型所实现的功能与你所期望的一致吗？\n\
    \  - 有遗漏的功能吗？\n  - 你能考虑一下这个原型所没涉及的一些出错情况吗？\n  - 有多余的功能吗？\n  - 这些导航对于你意味着怎样的逻辑性和完整性？\n\
    \  - 有更简单的方法来完成这一任务吗？\n\n- 把从原型评价中获得的信息编写成文档。精化软件需求规格说明中的需求。\n- 记录好所实施的评价以及评价结果\n\
    \n## 6 原型法的最大风险\n- 用户或者经理看到一个正在运行的原型从而以为产品即将完成\n  - “哦，这看起来好像差不多了！”\n  - “这看起来真的很好，你能把它完成后交给我吗？”\n\
    \  - 如果评价者看到原型可以对一个模拟的数据库查询响应甚快，那么他们可能期望在最终的软件产品中也具有同样惊人的性能\n\n- 决不能把抛弃型原型当作可交付的产品\n\
    \n- 控制这种风险的方法：利用书面原型\n\n## 7 原型法成功的因素\n- 你的项目计划中应包括原型风险。安排好开发、评价和可能的修改原型的 时间。\n\
    - 计划开发多个原型，因为你很少能一次成功。\n- 尽快并且廉价地建立抛弃型原型。用最少的投资开发那些用于回答问题和解决需求的不确定性的原型。不要努力去完善一个抛弃型原型的用户界面。\n\
    - 在抛弃型原型中不应含有代码注释、输入数据有效性检查、保护性编码技术，或者错误处理的代码。\n- 对于已经理解的需求不要建立原型。\n\n- 不能随意地增加功能。当一个简单的抛弃型原型达到原型目的时，就不应该随便扩充它的功能。\n\
    - 不要从水平原型的性能推测最终产品的性能。原型可能没有运行在最终产品所处的特定环境中，并且你开发原型的工具与开发产品的工具在效率上是存在差异的。\n- 在原型屏幕显示和报表中使用合理的模拟数据。那些评价原型的用户会受不现实数据的影响而不能把原型看成真正产品的模型。\n\
    - 不要期望原型可以代替需求文档。原型只是暗示了许多后台功能，因此必须把这些功能写入软件需求规格说明，使之完善、详细并且可以有案可稽。\n\n## 建议\n\
    - 查明你的项目中引起需求混乱的部分（如使用实例）。用书面原型勾画出代表你对需求的理解和如何实现的可能用户界面。让一些用户利用你的原型模拟执行一个任务或使用实例。确定对需求的最初理解中不完整和不正确的部分。相应地更改原型并重新检验。\n\
    - 给你的原型评价者递交一份本章信息的总结。这将有助于他们理解原型背后的原理，并且使之期望原型法结果的现实。\n\n- 考试时间 21周 周一\n- 学号单号在\
    \ A103\n- 学号双号在 A12\n- 18:00~~20:00\n\n## 第13章 设定需求优先级\n- 开发组不能做到同时交付一个包罗万象并且具有高质量的产品。把首发版中必须包括的需求与可以放入以后版本的需求区分开。有一些使用实例似乎经常执行而其它的则很少有人使用。\n\
