  md: "\n## 软件风险管理\n\n风险管理：就是使用某些工具或步骤把项目风险限制在一个可接受的范围内。\n\n风险管理包括的活动包括：风险评价、风险避免、风险控制等。\n\
    \n编写项目风险文档：仅仅认识到项目面临的风险是远远不够的，应该将其编写成文档并妥善进行管理，这样有利于风险承担者了解风险情况状态。\n\n制定风险管理计划：一张风险列表还不等于一个风险管理计划。\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_111_0.png)\n\n图5-1 风险管理要素\n\n## 风险条目跟踪模板\n\
    \n- 序号: <顺序号>\n- 确定日期: <风险被识别出的日期>\n- 撤销日期: <撤销风险确定日期>\n- 描述: <以“条件-结果”的形式描述风险>\n\
    - 可能性: <风险转变为问题的可能性>\n- 影响: <如果风险变成了事实将造成的损失>\n- 危害值: <可能性×影响>\n- 降低风险计划: <一种或多种用来控制、避免、最小化及降低风险的方法>\n\
    - 负责人: <解决风险的责任承担者>\n- 截止日期: <完成降低风险措施的截止日期>\n\n## 风险条目样例\n\n- 序列号：1\n- 确定日期：5/4/99\n\
    - 撤销日期：\n- 描述：需求获取中无合适用户参与，导致测试之后用户界面的返工。\n- 可能性：0.6\n- 影响：7\n- 危害值：4.2\n- 降低风险计划:\n\
    \  1. 在第一阶段早期就要收集易学、易用的需求。\n  2. 与产品代表一起召开JAD会议以开发需求。\n  3. 通过与产品代表和顾问的交流，开发一个包含核心功能的用户界面原型。让产品代表和其他用户来评估此原型。\n\
    - 负责人：Helen\n- 截止日期：在6/16/99前完成JAD会议。\n\n## 与需求有关的风险及管理\n\n- 需求获取\n  - 1) 产品视图与范围\n\
    \    - 没有对产品功能达成一个清晰的共识，则很可能导致项目范围的逐渐扩大。\n    - 最好在项目早期写一份项目视图与范围将业务需求涵盖在内，并将其作为新的需求及修改需求的指导。\n\
    \  - 2) 需求开发所需时间\n    - 需求开发工作应占全部工作量的15%\n    - 不要因为工期紧张就不按要求作需求。\n  - 3) 需求规格说明的完整性和正确性\n\
    \    - 以用户的任务为中心，应用使用实例技术获取需求。\n    - 根据不同的使用情景编写需求测试用例，建立原型，使需求对用户来说更加直观，同时获取用户的反馈信息。让客户代表对需求规格说明和分析模型进行正式的评审。\n\
    \  - 4) 对革新产品的需求\n    - 有时容易忽略市场对产品的反馈信息。故要强调市场调查研究，建立原型，并运用客户核心小组来获得革新产品任务的反馈信息。\n\
    \  - 7) 未加说明的需求\n    - 客户可能会有一些隐含的期望要求，但并未说明。要尽量识别并记录这些假设。提出大量的问题来提示客户以充分表达他们的想法、主意和应关注的一切。\n\
    \  - 8) 把已有的产品作为需求基线\n    - 在升级或重做的项目中需求开发可能显得不很重要。开发人员有时被迫把已有的产品作为需求说明的来源。“只是修改一些错误和增加一些新特性”，这时的开发人员不得不通过现有产品的逆向工程(reverse\
    \ engineering)来获取需求。可是，逆向工程对收集需求是一种既不充分也不完整的方法。因此新系统很可能会有一些与现系统同样的缺陷。将在逆向工程中收集的需求编写成文档，并让客户评审以确保其正确性。\n\
    \  - 9) 给出期望的解决办法\n    - 用户推荐的解决方法往往掩盖了用户的实际需求，导致业务处理的低效，或者给开发人员带来压力以至做出很差的设计方案。因此分析人员应尽力从客户叙说的解决方法中提炼出其本质核心。\n\
    - 需求分析\n  - 1) 划分需求优先级。\n  - 2) 带来技术困难的特性\n  - 3) 不熟悉的技术、方法、语言、工具或硬件平台\n- 需求规格说明\n\
    \  - 1) 需求理解\n    - 不同理解\n    - 评审的团队应包括开发人员，测试人员和客户。\n  - 2) 时间压力对TBD的影响\n  \
    \  - 将SRS中需要将来进一步解决的需求注上TBD记号，但如果这\n  - 3) 具有二义性的术语\n  - 4) 需求说明中包括了设计\n    -\
    \ 说做什么，而不是说怎么做。\n- 需求验证\n  - 1) 未经验证的需求\n  - 2) 审查的有效性\n\n## 需求管理\n\n- 1) 变更需求\n\
    \  - 将项目视图与范围文档作为变更的参照可以减少项目范围的延伸。\n  - 用户积极合作参与可把需求变更减少近一半。\n  - 早期发现需求错误的质量控制方法可减少以后发生变更的可能。\n\
    \  - 为减少需求变更的影响，将易于变更的需求用多种方案实现，并在设计时更要注重其可修改性。\n- 2) 需求变更过程\n  - 未曾明确的变更过程或采用的变动机制无效或不按计划的过程来做出变更。\n\
    \  - 建立变更管理的纪律和氛围，变更控制委员会，工具\n- 3) 未实现的需求\n  - 需求跟踪能力矩阵\n- 4) 扩充项目范围\n  - 对阶段递增式的生存期制定计划，在早期版本中实现核心功能，并在以后的阶段中逐步增加实现需求。\n\
    \n## 建议：\n\n- 明确你当前项目面临的一些与需求有关的风险，不要把当前的问题当作风险，一定要是那些还未发生的事情。将风险因素用条件—结果形式编写成文档，为每项风险推荐至少一种可能的降低风险的方法。\n\
    - 召集代表开发、市场、客户和管理各方面的风险承担者召开风险“集体研讨”会议。尽力找出更多与需求有关的风险因素。估计每项风险发生的可能性及其影响，两者乘积就是风险危害值。通过按风险危害值降序排列找到最高的五项风险。为每项风险安排一个负责人负责实施降低风险的活动。\n\
    \n## 小结：\n\n1. 软件需求工程的一些推荐方法。\n2. 软件过程改进以及改进周期图。\n3. 软件改进过程的评估结果。\n4. 软件开发过程的风险以及编写项目风险文档。\n\
    5. 需求开发和管理的各个阶段过程中存在的与需求有关的风险。\n\n## 思考题：\n\n1. 需求工程推荐方法大致有哪些，并能联系以往参与的实际项目来描述其中用到的一些方法？\n\
    2. 理解需求过程与其他项目过程的联系。\n3. 联系以往的工程实际，说说采用活动计划模板一些优势。\n4. 软件过程中会有哪些风险？根据你的理解，同时说明小项目和大项目风险主要侧重点在哪些方面？\n\
    \n## 作业\n\n- 按照课程中给出的模版，写出大作业中的项目的风险管理计划\n- 要求至少10条以上\n- 从软件开发过程（特别是需求，5条以上）、人员、技术、质量、沟通、时间、费用、市场、政策、项目范围、变更等方面考虑。\n\
    \n## 第六章 建立项目视图与范围\n\n- “连这种功能都没有，我请你们来干啥呢？” 客户领导发脾气了！\n- 项目验收时才发现开发的软件和所要求的目标不一致的例子比比皆是\n\
    \n- 在确定详细的功能需求之前，必须很好地解决项目视图和范围问题。\n- 项目视图和项目范围概念\n  - 1. 项目视图描述了产品所涉及的各个方面在一个完美环境中最终所具有的功能。通过项目视图可以把参与者定位到一个共同和明确的方向上。\n\
    \  - 2. 项目范围则描述了产品应包括的部分和不应包括的部分。范围的说明在包括与不包括之间划清了界线，它还确定了项目的局限性。\n\n## 1 通过业务需求确定项目视图\n\
    \n- 业务需求是从不同客户那里收集来的，包括主办者（如厅长）、客户（工厂）、开发公司高级管理人员、市场人员等。\n- 他们应很清晰：为什么要从事该项目（产品）？该项目最终能为业务和客户提供哪些价值？\n\
    - 而不同层面的客户会侧重不同方向的业务目标，因而来自各个渠道的业务需求可能会发生冲突。\n- 需求工程是以相互交流为核心的\n\n## 例：自动售货亭\n\
    \n- 系统需要一个软件：嵌入式的软件\n- 开发者的业务目标\n  - 向尽可能多的商家推广并销售自动售货亭产品。\n  - 通过售货亭软件向客户销售消费品。\n\
    \  - 要吸引客户对商品的兴趣。\n  - 改变原有的开发者—客户的关系。\n- 商家\n  - 通过客户使用自动售货亭而获利。\n  - 吸引更多的客户来商店购买。\n\
    \  - 如果自动售货亭替代了人工操作，就可节省钱。\n"
