    - 流程图和决策树是描述用户执行任务时作出逻辑决策途径的好方法\n\n## 2.基于用例的方法：\n\n- UML: 总画面\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_185_0.png)\n\
    \n## 一般教科书定义：\n\n- 一个使用实例 use-case 描述了系统和一个外部“执行者”（actor）的交互顺序，它体现执行者完成一项任务并给某人带来益处。使用实例为表达用户需求提供了一种方法。\n\
    - 执行者是指一个人，或另一个软件应用，或一个硬件，或其它一些与系统交互以实现某些目标的实体\n- 基于“使用实例”方法进行需求获取的目的在于：描述用户需要使用系统完成的所有任务。\n\
    - 东软定义的需求用例：通过描述系统的功能与外界环境的交互关系，描述出系统的\n主要功能。\n- 参与者代表系统的用户在使用系统时所扮演的一组角色,一个参与者可以是人,也可以是其它相关系统。\n\
    - 用例则代表用来完成某个有业务意义的功能的动作序列\n- 它描述系统做什么,但不描述如何做。\n- 所有和系统有交互的东西都认为是参与者。\n- 一个用例代表使用系统的一种方法，是系统对参与者所引发的事件的一系列的反映。\n\
    - 一个用例可以由多个参与者，一个参与者通常会使用多个用例\n- 除了用例图外，每个用例都要有用例说明，用例说明应该包括下列内容：\n  - 名字：用例名\n\
    \  - 简单描述：简单地描述用例的目的和作用\n  - 事件流：对用例做什么的文字描述，可以有一个基本事件流和若干可选事件流\n  - 非功能性需求：描述用例的非功能性需求，比如性能\n\
    \  - 前置条件：定义此用例启动的先决条件，比如参与者要先登陆等\n  - 后置条件：定一次用例执行完成后对系统的约束要求\n  - 扩展点：描述在用例的执行流程中的一些地点，在那里可能执行扩展(extend)该用例的与该点名称相应的用例中过程。\n\
    \n## 使用实例和用法说明（UML）\n\n- 是由系统内的元素组成\n- 负责系统的功能和行为\n- 在执行者启动事件或动作时，由系统执行的事务集合在所有可能的场景中可能出现的所有可能事件\n\
    \n## UML用例的元素\n\n- “包” 形状\n  - 包是模型元素的组合，以类似 manila 文件文件夹 的符号表示。您可以将整个系统说明想象为含有所有系统元素的包，包括其他的包、模型、图表和元素。\n\
    - 用例\n  - 代表当参与者使用系统来完成进程时所发生的一组事件。通常，用例是一种相对较大的进程，而不是单个步骤或事务。\n- 参与者\n  - 代表由外部对象扮演的角色。因此，一个物理对象可由多个参与者表示。通信关系指出参与者以何种方式参与到用例中来。\n\
    - 接口\n  - 指定类、组件、包或其他元素的外部可视操作，而不指定内部结构。\n  - 接口具有操作，但没有属性、状态或关联。从表示法方面来说，接口可以用两种方式表示：\n\
    \    - 作为一个类形状，将构造型 <<接口>> 附加到通过实现关系支持它的元素上。\n    - 通过一个圆，附加到以一条实线支持它的元素上。\n"
