    - 可以根据需要生成标准的或定制的报告和图表。\n- 一些商业需求管理工具内置有简单的变更建议系统。\n\n## 3 有效率的CCB\n\n- **定义：**变更控制委员会可以由一个小组担任，也可由多个不同的组（业务、技术等）担任，负责做出决定究竟将哪一些已建议需求变更或新产品特性付诸应用。\n\
    - **组成：**保证权威性、尽可能精简\n  - 产品或计划管理部门。\n  - 项目管理部门。\n  - 开发部门。\n  - 测试或质量保证部门。\n\
    \  - 市场部或客户代表。\n  - 制作用户文档的部门。\n  - 技术支持部门。\n  - 帮助桌面或用户支持热线部门。\n  - 配置管理部门。\n\
    \n## 工作总则\n\n- 总则：描述变更控制委员会的目的、授权范围、成员构成、做出决策的过程及操作步骤。说明举行会议的频率和事由。管理范围是指该委员会能做什么样的决策，及哪种决策应上报到高一级的委员会。\n\
    \  - 1. 制定决策\n    - 变更控制委员会必须到会的人数或作出有效决定必须出席的人员数。\n    - 决策的方法，例如：投票、一致通过或其它机制。\n\
    \    - 变更控制委员会主席是否可以否决 CCB 的集体决定。\n\n## 4 测量变更活动\n\n- 是评估需求的稳定性和确定某种过程改进时机的一种方法，这种时机可以减少未来的变更请求。\n\
    - 接收、未作决定、结束处理的变更请求的数量。\n- 已实现需求变更（包括增、删、改）的合计数量（也可以用在基线上占需求总数的百分比来表示）。\n- 每个方面发出的变更请求的数量。\n\
    - 每一个已应用的需求（是指已划过基线）的建议变更和实现变更的数量。\n- 投入处理变更的人力、物力。\n\n## 变更频率\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_439_0.png)\n\
    \n**图17-3 需求变更活动的样本图**\n\n## 按来源分类的变更请求数量\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_440_0.png)\n\
    \n**图17-4 需求变更来源的样本图**\n\n## 建议\n\n- 确定决策制订者并且建立一个变更控制委员会。制订变更委员会的总则，使每个人都理解变更控制委员会的目的、组成及决策制订过程。\n\
    \n- 参见图17-2，为项目建议的需求变更生存期制订一个状态转换图。制定一个描述项目组如何处理建议变更的过程。手工地使用这些过程，直到你确信它是实用的、有效的，并且简单到你能成功使用为止。\n\
    \n- 选择合适的商业问题跟踪工具，它们能与你所处的环境密切配合并且通过裁剪工具使其可以支持以前开发出的变更控制过程。\n\n## 第18章 需求链中的联系链\n\
    \n- 一个表面上简单的软件变更往往会很复杂，花费时间很难预料。经常很难发现哪怕一个很小的修改会影响到的范围。开发过程中在同意接受建议的变更之前，要确信明白自己在做什么。\n\
    - 需求跟踪包括编制每个需求同系统元素之间的联系文档。这些元素包括别的需求、体系结构、其他设计部件、源代码模块、测试、帮助文件、文档等。\n- 需求变更影响分析：需求跟踪信息使变更影响分析十分便利，有利于确认和评估实现某个建议的需求变更所必需的工作。\n\
    \n### 1 需求跟踪\n\n- 需求跟踪能力是优秀需求规格说明书的一个特征。为了实现可跟踪，必须统一地标识出每一个需求，以便能明确地进行查阅。\n- 四类需求跟踪能力链\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_444_0.png)\n\n跟踪能力联系链记录了单个需求之间的父子、互连、依赖的关系。当某个需求变更（被删除或修改）后，这种信息能够确保正确的变更传播，并将相应的任务作出正确的调整。下图说明了许多能在项目中定义的直接跟踪能力联系链。一个项目不必拥有所有种类的跟踪能力联系链，要根据具体的情况调整。\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_446_0.png)\n\n**图18-2 一些可能的需求跟踪能力联系链**\n\
    \n### 需求跟踪好处\n\n- 需求跟踪可以改善产品质量，降低维护成本，而且很容易实现重用。\n- 需求跟踪是个要求手工操作且劳动强度很大的任务，要求组织提供支持。随着系统开发的进行和维护的执行，要保持关联链信息与实际一致。**跟踪能力信息一旦过时，可能再也不会重建它了。**由于这些原因，应该正确使用需求跟踪能力。\n\
    - **CMM3**要求具备需求跟踪能力：“在软件工作产品之间，维护一致性。工作产品包括软件计划，过程描述，分配需求，软件需求，软件设计，代码，测试计划，以及测试过程。”\n\
    \n### 好处\n\n- 审核：跟踪能力信息可以帮助审核确保所有需求被应用。\n- 变更影响分析：跟踪能力信息在增、删、改需求时可以确保不忽略每个受到影响的系统元素。\n\
    - 维护：可靠的跟踪能力信息使得维护时能正确、完整地实施变更，从而提高生产率。要是一下子不能为整个系统建立跟踪能力信息，一次可以只建立一部分，再逐渐增加。从系统的一部分着手建立，先列表需求，然后记录跟踪能力链，再逐渐拓展。\n\
    - 项目跟踪：在开发中，认真记录跟踪能力数据，就可以获得计划功能当前实现状态的记录。还未出现的联系链意味着没有相应的产品部件。\n- 再设计（重新建造）：你可以列出传统系统中将要替换的功能，记录它们在新系统的需求和软件组件中的位置。通过定义跟踪能力信息链提供一种方法收集从一个现成系统的反向工程中所学到的方法。\n\
    - 重复利用：跟踪信息可以帮助你在新系统中对相同的功能利用旧系统相关资源。例如：功能设计、相关需求、代码、测试等。\n- 减小风险：使部件互连关系文档化可减少由于一名关键成员离开项目带来的风险。\n\
    - 测试：测试模块、需求、代码段之间的联系链可以在测试出错时指出最可能有问题的代码段。\n\n### 需求跟踪能力矩阵\n\n**表18-1 一种需求跟踪能力矩阵**\n\
    \n| 使用用例 | 功能需求 | 设计元素 | 代码 | 测试用例 |\n|---|---|---|---|---|\n| UC-28 | catalog.query.sort\
    \ | class catalog | catalog.sort() | search.7 search.8 |\n| UC-29 | catalog.query.import\
    \ | class catalog | catalog.import() catalog.validate() | search.8 search.13 search.14\
    \ |\n\n- 允许：一对一，一对多，多对多关系。\n- 设计元素可以是模型中的对象：数据流图、关系数据模型中的表、或对象类。\n- 代码参考可以是类中的方法，源代码文件名、过程或函数。\n\
    - 加上更多的列项就可以拓展到与其它工作产品的关联，例如在线帮助文档。包括越多的细节就越花时间，但同时很容易得到相关联的软件元素，在做变更影响分析和维护时就可以节省时间。\n"
