    ## 系统元素对象间的联系链矩阵


    **表18-2　反映使用实例与功能需求之间联系的需求跟踪能力矩阵**


    | 功能需求 | UC-1 | UC-2 | UC-3 | UC-4 |

    | --- | --- | --- | --- | --- |

    | FR-1 | ✓ |  |  |  |

    | FR-2 | ✓ |  |  |  |

    | FR-3 |  |  | ✓ |  |

    | FR-4 |  |  | ✓ |  |

    | FR-5 |  | ✓ |  | ✓ |

    | FR-6 |  |  | ✓ |  |


    **表18-3　跟踪能力联系链可能的信息源**


    | 链的源对象种类 | 链的目的对象种类 | 信息源 |

    | --- | --- | --- |

    | 系统需求 | 软件需求 | 系统工程师 |

    | 使用实例 | 功能性需求 | 需求分析员 |

    | 功能性需求 | 功能性需求 | 需求分析员 |

    | 功能性需求 | 软件体系结构元素 | 软件体系结构（设计）者 |

    | 功能性需求 | 其他设计元素 | 开发者 |

    | 设计元素 | 代码 | 开发者 |

    | 功能性需求 | 测试实例 | 测试工程师 |


    ## 需求跟踪工具


    - 需求跟踪不能完全自动化。

    - 一旦已确定联系链，特定工具就能帮你管理巨大的跟踪能力信息。可以使用电子数据表来维护几百个需求的矩阵，商业需求管理工具能力更强。

    - 可以在工具的数据库中存储需求和其他信息，定义不同对象间的联系链，甚至包括同类需求的对等联系链。

    - 有一些工具需要区分“追溯到（跟踪进）”与“从…回溯（跟踪出）”关系，自动定义相对的联系链。

    - 还有一些工具可以在联系链某端变更后将另一端标为“可疑”。可以让你检查确保知道变更的后续效果。

    - 这些工具允许定义“跨项目”或“跨子系统”的联系链。某些高层产品需求建立在多个子系统之上。有些情况下，分配给一个子系统的需求，实际上是由另一个子系统提供的服务完成的。这样的项目采用商业需求管理工具可以成功地跟踪这些复杂的跟踪能力关系。


    ## 需求跟踪能力过程


    - 1) 决定定义哪几种联系链，参见图18-2。

    - 2) 选择使用的跟踪能力矩阵的种类，是表18-1还是表18-2。

    - 3) 确定对产品哪部分维护跟踪能力信息。由关键的核心功能、高风险部分或将来维护量大的部分开始做起。

    - 4) 通过修订过程和核对表来提醒开发者在需求完成或变更时更新联系链。

    - 5) 制定标记性的规范，用以统一标识所有的系统元素，达到可以相互联系的目的。若必要，作文字记录，这样就可以分析系统文件，便于重建或更新跟踪能力矩阵。

    - 6) 确定提供每类联系链信息的个人。

    - 7) 培训项目组成员，使其接受需求跟踪能力的概念，了解重要性、这次活动的目的、跟踪能力数据存储位置、定义联系链的技术——例如，使用需求管理工具的特点。确保与会人员明白其承担的责任。

    - 8) 一旦有人完成某项任务就要马上更新跟踪能力数据，即要立刻通知相关人员更新需求链上的联系链。

    - 9) 在开发过程中周期性地更新数据，以使跟踪信息与实际相符。要是发现跟踪能力数据没完成或不正确，那就说明没有达到效果。


    ## 需求变更代价：影响分析


    影响分析是需求管理的一个重要组成部分。


    影响分析可以提供对建议的变更的准确理解，帮助做出信息量充分的变更批准决策。通过对变更内容的检验，确定对现有的系统做出是修改还是抛弃的决定，或者创建新系统，以及评估每个任务的工作量。


    进行影响分析的能力依赖于跟踪能力数据的质量和完整性。


    没有人愿意做一个费时费力还要担心意想不到情况的需求变更。在职业生涯中，绝大多数开发人员会遇到要求添加“没有代价且不影响进度的变更”的要求。对这样令人奇怪的要求的正确回答是“不行！”变更只能在项目时间、预算、资源的限制内进行协商。


    ### 变更影响分析过程


    **图18-3　建议的变更涉及的问题核对表：确定是否可以接受变更？**


    - 基线中是否已有需求与建议的变更相冲突？

    - 是否有待解决的需求变更与已建议的变更相冲突？

    - 不采纳变更会有什么业务或技术上的后果？

    - 进行建议的变更会有什么样的负面效应或风险？

    - 建议的变更是否会不利于需求实现或其它质量属性？

    - 从技术条件和员工技能的角度看该变更是否可行？

    - 若执行变更是否会在开发、测试和许多其它环境方面提出不合理要求？

    - 实现或测试变更是否有额外的工具要求？

    - 在项目计划中，建议的变更如何影响任务的执行顺序、依赖性、工作量或进度？

    - 评审变更是否要求原型法或别的用户提供意见？

    - 采纳变更要求后，浪费了多少以前曾做的工作？

    - 建议的变更是否导致产品单元成本增加？例如增加了第三方产品使用许可证的费用。

    - 变更是否影响任何市场营销、制造、培训或用户支持计划？


    ### 图18-4　变更影响的软件元素核对表


    - 确认任何用户接口要求的变更，添加或删除。

    - 确认报告、数据库或文件中任何要求的变更，添加或删除。

    - 确认必须创建、修改或删除的设计部件。

    - 确认源代码文件中任何要求的变更。

    - 确认文件或过程中任何要求的变更。

    - 确认必须修改或删除的已有的单元、集成或系统测试用例。

    - 评估要求的新单元、集成和系统测试实例个数。

    - 确认任何必须创建或修改的帮助文件、培训素材或用户文档。

    - 确认变更影响的应用、库或硬件部件。

    - 确认须购买的第三方软件。

    - 确认在软件项目管理计划、质量保证计划和配置管理计划等中变更将产生的影响。

    - 确认在修改后必须再次检查的工作产品。


    ### 评估需求变更影响的过程


    - 1) 按图18-3进行一遍。

    - 2) 按图18-4进行一遍，要使用有效的跟踪能力信息。有一些需求管理工具包含影响分析报告并且能发现受变更影响的系统元素。

    - 3) 使用如图18-5所示的一张工单（worksheet）来评估预期任务要求的工作量，绝大多数的变更仅要求工单所列任务的一部分。

    - 4) 求评估工作量的总和。

    - 5) 确认任务执行的顺序，这些任务如何同当前的计划任务配合？

    - 6) 决定变更是否处于项目的关键路径。如果一个处于关键路径的任务延期，项目的完成之日将遥遥无期。每个变更都会消耗资源，如果能避免变更影响关键任务，则变更不会造成整个项目延期。

    - 7) 估计变更如何影响进度和费用。

    - 8) 通过与其它任意需求的收益、代价、成本和技术风险的比较来评估变更的优先级（有关详情请见第13章）。

    - 9) 向变更控制委员会报告影响分析结果，他们可以在采纳或拒绝变更的决策过程中使用这些评估信息。


