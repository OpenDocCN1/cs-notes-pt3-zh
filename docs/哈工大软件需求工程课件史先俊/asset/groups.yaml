    # 6) 外部接口需求


    这类需求描述了系统与外部的联系。软件需求规格说明必须包括用户接口和通信机制、硬件和其它软件系统需求部分。客户描述外部接口需求包括如下习惯用语：


    +   “从<某些设备> 读取信号”


    +   “给<一些其它系统>发送消息”


    +   “以<某种格式>读取文件”


    +   “能控制<一些硬件>”'
  - '[PAGE 243]


    # 7) 限制


    限制是指一些合理限制设计者和程序员选择的条件。它们代表了另一种类型的非功能需求，你必须把这些需求写入软件需求规格说明。尽量防止客户施加不必要的限制，因为这将妨碍提出一个好的解决方案。不必要的限制将会降低利用现有商业化软件集成解决方案的能力。一定的限制有助于提高产品质量属性。只利用程序语言的标准命令而不允许使用供应商的扩展，可以提高可移植性。下面是客户描述限制的一些习惯用语：


    +   - “必须使用<一个特定的数据库产品或语言>"

    +   - "不能申请多于<一定数量的内存>"

    +   - "操作必须与<其它系统>相同"

    +   - “必须与<其它应用程序>一致”'
  - '[PAGE 244]


    # 8) 数据定义


    当客户描述一个数据项或一个复杂的业务数据结构的格式、允许值或缺省值时，他们正在进行数据定义。例如，“邮政编码由5个数字组成，后跟一个可选的短划线或一个可选的四位数字，缺省为0000”就是一个数据定义。把这些集中在一个数据字典中，作为项目的参与者在整个项目的开发和维护中的主要参考文档。'
