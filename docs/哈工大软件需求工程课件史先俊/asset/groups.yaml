    # 2 测试需求


    - 通过阅读软件需求规格说明，通常很难想象在特定环境下的系统行为。

    - 以功能需求为基础或者从使用实例派生出来的测试用例可以使项目参与者看清系统的行为。

    - 在部分需求稳定时就开始开发测试用例，那么就可以及早发现问题并以较少的费用解决这些问题。

    - 是黑盒子或功能上的测试用例


    - 从使用实例中获得概念上的功能测试用例（基于模仿使用的测试用例），利用测试用例来验证文本需求规格说明和分析模型（例如对话图）并评价原型。

    - 可以把原来手工做的工作，作为测试用例来测试你的SRS或模型、原型。


    # 建议


    - 从你的项目软件需求规格说明中任意选择一页功能需求。召集代表不同风险承担者观点的一个小组并仔细审查一页需求以寻找与好的需求说明特性相偏离的那些需求。

    - 如果从随机评审中发现太多问题，以至使评审员对整个需求质量感到担忧，那么就要让用户和开发人员代表审查整个软件需求规格说明。在审查过程中要培训审查小组中的成员，使之发挥最高效率。

    - 为使用实例或软件需求规格说明中未编码的部分，定义概念上的测试用例。判断风险承担者们是否对测试用例所反映的预期的系统行为持有一致的意见。确保你已经定义了允许测试用例“执行”的所有功能需求，并且不存在多余的需求。


    # 第15章 需求开发向设计规划的转化


    - 虽然在开发的开始阶段困难重重，但是“化学制品跟踪系统”的开发工作总算进展顺利。项目的主办者 Gerhard 和化学制品仓库的产品代表者 Roxanne怀疑是否有必要花费这么多时间来收集需求。然而，他们很愿意同开发小组和其它产品代表一起参加为期一天的软件需求方面的培训。这次培训着重讲述在编写软件程序之前，使项目所有风险承担者在对需求的理解上达成共识的重要性。在培训课中，所有的成员了解了需求的术语、概念和他们要用到的方法，这可以激发他们在具体需求实施过程中采用一些改进需求的技术。


    在项目开发过程中，Gerhard收到了用户代表关于如何进行需求开发的一些良好反馈。后来，他请开发组成员和客户代表着共进午餐，以庆祝他们在“化学制品跟踪系统”确定需求基线方面达到了一个重要的里程碑。在就餐时，Gerhard满怀热情地感谢了参与获取需求的人员所做出的贡献以及他们的合作，然后他继续说，“现在你们有了完整正规的需求，我盼望开发小组很快能写出程序代码。”


    “我们并不准备马上编写程序代码”，项目经理提醒Gerhard。“我们打算分阶段交付产品，所以我们需要想出一个最好的方法来设计系统，使其能适应将来系统的扩展。我们可以从产品原型中获得关于有效技术途径的一些思想，并且产品原型有助于我们理解用户喜欢的界面特性。如果现在我们在软件的设计上多花一点时间，那么到明年我们扩充产品的更多功能时就不会遇到较大的问题。”


    这时Gerhard有一点沮丧。因为他觉得开发人员现在就可以开始编制程序了。但是Gerhard是否有点行动过早？


    # 需求开发向设计规划的转化


    - 有经验的项目经理和开发人员知道把软件需求转化为健壮的设计和合理的项目规划的重要性。


    - 通过需求和项目规划、设计、编码和测试之间的联系来探讨需求开发和一个成功发行的产品之间的转换方法。


    # 1 从需求到项目规划


    - 由于需求定义了项目预期的成果（outcome），所以你的项目规划、预测和进度安排都必须以软件需求为基础。


    - 1）需求和进度安排


    - 如果存在进度安排的约束条件，那么具有交叉功能的开发小组必须在功能、质量和费用上作出合理（trade-off）的决策


    - 软件项目可能经常不能达到预定的目标，这是因为开发人员和其他项目参与者是拙劣的规划者，倒不是因为他们是拙劣的软件工程师


    - 规划失误包括：忽略公共（用）的项目任务，低估了要花费的工作量和时间，没有考虑项目风险，并且没有考虑返工所需的时间。


    # 项目规划时需要考虑的元素


    - 根据对需求的清楚理解来估计产品规模的大小。

    - 根据历史记录了解开发小组的工作效率。

    - 需要一张综合的任务列表以完整实现和验证每一特性或使用实例。

    - 有效的预测和规划过程。

    - 经验。


    # 2）需求和预估


    - 把需求和软件产品规模的大小相联系


    # 常见的度量标准


    - 功能点和特性点的多少，或者3-D(数据，功能，控制)功能点的数量。

    - 数据难题多是MIS/商业软件的典型，而科学/工程软件是功能难题多，实时软件是控制难题多

    - 图形用户界面GUI元素的数量、类型和复杂度。

    - 用于实现特定需求所需的源代码行数。(印度300行人月)

    - 对象类的数量或者其它面向对象系统的衡量标准

    - 单个可测试需求的数量。


    关键是经验，是对以往项目的分析，总结！


    在进度安排中应包括临时的事件并要合理预算资金以适应一些需求的增加和可能的超限。


    预估工具 http://www.method-tools.com


    # 2 从需求到设计和编码


    - 需求开发和规格说明应该强调对预期系统外部行为的理解和描述。让设计者和开发者参与需求审查以判断需求是否可以作为设计的基础。

    - 编码之前，应该仔细考虑构造系统的最有效的方法。有无其它的设计方案

    - 分析模型代表了用户和开发小组对我们正在解决的问题的理解，而设计模型则描绘了我们应该如何构造系统。

    - 在把需求转化为设计时你所花的时间将是对建立高质量、健壮性产品的关键的投资。


    # 设计规划原则


    - 应该为在维护过程中起支撑作用的子系统和软件组件建立一个坚固的体系结构。

    - 明确需要创建的对象类或功能模块，定义他们的接口、功能范围以及与其它代码单元的协作。

    - 根据强内聚、松耦合和信息隐藏的良好设计原则定义每个代码单元的预期功能。

    - 确保你的设计满足了所有的功能需求并且不包括任何不必要的功能。


    # 3 从需求到测试


    - 详尽的需求（而不是设计）是系统测试的基础，反过来只能通过测试来判断软件是否满足了需求。

    - 基于代码的系统测试＝“自满足的预见”

    - 让测试人员参与需求审查以确保需求是明确的，通过验证的需求才可以作为系统测试的基础。

    - 在需求开发中，当每个需求都稳定之后，项目的系统测试人员应该编写文档，以记录他们如何验证需求—通过测试、审查，演示或分析。

    - 根据需求中的逻辑描述，利用诸如因果图等分析技术来获得测试用例，这将会揭示需求的二义性、遗漏或隐含的其它条件和其它问题。


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_403_0.png)


    # 因果图


    - 每个需求应至少由一个测试用例来测试，这样就会验证所有的系统行为。

    - 跟踪通过测试的需求所占的比例可以衡量测试进度

    - 测试设计策略： 动作驱动、数据驱动（包括边界值分析和等价类的划分）、逻辑驱动、事件驱动和状态驱动

    - 针对需求的测试必须在软件结构的每一层进行，而不只是在用户层进行

    - 针对用户需求来测试系统是系统测试的必要但非充分条件，还有一些对用户都不可见的模块


    # 4 从需求到成功


    - 把需求文档作为何时发行产品的的基础。


    开发过程中，开发人员列出了与特定代码版本相对应的需求。项目的质量保证组通过对照需求来执行测试用例从而评价其对应的代码版本。根据测试标准，如果不满足需求的话就算是错误。如果不满足的需求数量超过预先给定的一个数字，或者特定的有重大影响的需求没有被满足，那么这个代码块就被拒绝了。


    - 也不要成为需求过程的奴隶。避免陷入畸形分析的陷阱，此时，开发小组将花费大量的时间创建不必要的文档，并举行各种形式上的会议和评审，而并不编写任何软件代码，这会导致项目被取消。努力在精确的规格说明与可将产品失败的风险降至可接受程度的编码之间做出明智的选择。


    # 建议


    - 检查你的软件需求规格说明中所有需求是否与软件设计的各元素相对应。这些可能在数据流模型、实体联系图中的表、对象类或方法，或者其它设计元素中处理。如果开发人员在编写代码前，没有进行软件设计，那么他们可能要进行软件设计方面的培训。

    - 记录实现每一个产品特性或使用实例的代码行、功能点、对象类或图形用户界面（GUI）元素的数量。并且还要记录对完全实现并验证每个特性或使用实例所估计的工作量和实际的工作量。尽力获取产品大小与所花费工作量的关系，这将有助于你对将来的需求规格说明作出更精确的预估。


    # 第16章 需求管理的原则与实现


    - 需求管理包括在工程进展过程中维持需求约定集成性和精确性的所有活动

    - 控制对需求基线的变动。

    - 保持项目计划与需求一致。

    - 控制单个需求和需求文档的版本情况。

    - 管理需求和联系链之间的联系或管理单个需求和其它项目可交付品之间的依赖关系。

    - 跟踪基线中需求的状态。

    '
