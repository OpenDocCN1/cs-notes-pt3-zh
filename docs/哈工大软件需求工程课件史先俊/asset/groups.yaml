    - 所有TBD的问题已经全部解决，或者已经记录下每个待确定问题的解决过程，目标日期和提出问题的人。\n- 文档已经登记入项目的配置管理系统。\n- 检查是否已将审查过的资料送到有关收集处。\n\
    \n## 5. 需求审查清单\n\n- 审查软件需求规格说明时的清单\n- 使用实例的审查清单\n- 削减每一份清单以满足公司的需要，并修改这些清单使其能反映需求中最常发现的错误。\n\
    - 可以让不同的审查员使用完整清单的不同子集来查找错误。一个可以检查出所有文档内部的交叉引用是否正确，而另一个人可以判断这些需求是否可以作为设计的基础，并且第三个人可以专门评价可验证性\n\
    - 赋予审查员特定的查错责任，向他们提供结构化思维过程或情节以帮助他们寻找特定类型的错误，这比仅仅向审查员发放一份清单所产生的效果要好得多\n\n### 软件需求规格说明的审查清单\n\
    \n#### 1）组织和完整性\n\n- 所有对其它需求的内部交叉引用是否正确？\n- 所有需求的编写在细节上是否都一致或者合适？\n- 需求是否能为设计提供足够的基础？\n\
    - 是否包括了每个需求的实现优先级？\n- 是否定义了所有外部硬件、软件和通信接口？\n- 是否定义了功能需求内在的算法？\n- 软件需求规格说明中是否包括了所有客户代表或系统的需求？\n\
    - 是否在需求中遗漏了必要的信息？如果有的话，就把它们标记为待确定的问题。\n- 是否记录了所有可能的错误条件所产生的系统行为？\n\n#### 2）正确性\n\
    \n- 是否有需求与其它需求相冲突或重复？\n- 是否简明、简洁、无二义性地表达了每个需求？\n- 是否每个需求都能通过测试、演示、审查得以验证或分析？\n\
    - 是否每个需求都在项目的范围内？\n- 是否每个需求都没有内容上和语法上的错误？\n- 在现有的资源限制内，是否能实现所有的需求？\n- 是否任一个特定的错误信息都具有唯一性和明确的意义？\n\
    \n#### 3）质量属性\n\n- 是否合理地确定了性能目标？\n- 是否合理地确定了安全与保密方面的考虑？\n- 在确定了合理的折衷情况下，是否详实地记录了其它相关的质量属性？\n\
    \n#### 4）可跟踪性\n\n- 是否每个需求都具有唯一性并且可以正确地识别它？\n- 是否可以根据高层需求（如系统需求或使用实例）跟踪到软件功能需求？\n\
    \n#### 5）特殊的问题\n\n- 是否所有的需求都是名副其实的需求而不是设计或实现方案？\n- 是否确定了对时间要求很高的功能并且定义了它们的时间标准？\n\
    - 是否已经明确地阐述了国际化问题？\n\n### 使用实例文档审查清单\n\n- 使用实例是否是独立的分散任务？\n- 使用实例的目标或价值度量是否明确？\n\
    - 使用实例给操作者带来的益处是否明确？\n- 使用实例是否处于抽象级别上，而不具有详细的情节？\n- 使用实例中是否不包含设计和实现的细节？\n- 是否记录了所有可能的可选过程？\n\
    - 是否记录了所有可能的例外条件？\n- 是否存在一些普通的动作序列可以分解成独立的使用实例？\n- 是否简明书写、无二义性和完整地记录了每个过程的对话？\n\
    - 使用实例中的每个操作和步骤是否都与所执行的任务相关？\n- 使用实例中定义的每个过程是否都可行？\n- 使用实例中定义的每个过程是否都可验证？\n\n\
    ## 需求评审的困难\n\n- 1) 大型的需求文档：令人畏惧\n  - 只在把SRS作为基线时才进行审查\n  - 在正式审查前可以采用非正式的、渐增式的审查\n\
    \  - 让一些审查员从文档的不同位置开始检查，以确保认真地检查其中的每一页。\n  - 可以分成几个小组分别审查材料的不同部分。\n- 2) 庞大的审查小组：难于安排会议，引发题外话，难于达成一致意见\n\
    \  - 确保每个参与者都是为了寻找错误，而不是为了了解软件需求规格说明中的内容或者为了维护行政上的位置。如果一些参与者只是想大概了解审查的内容，那么就邀请他们去参加总体会议，而不是参加审查会。\n\
    \  - 理解审查员所代表的观点（例如客户、开发者或测试者），并且委婉地拒绝以相同的观点看待问题的参与者。在准备阶段，你可能要收集持有同样观点的反馈人的信息，但只要派其中的一个作为代表参加会议。\n\
    \  - 把审查组分成若干小组并行地审查软件需求规格说明，并把他们发现的错误集中起来，剔除重复的部分。研究表明：多个审查小组比起单一的大组而言，可以发现需求文档中更多的错误。审查小组总是发现错误的不同子集，所以并行审查的结果是追加的，而不是冗余的。\n\
    - 3) 审查员在地域上的分散\n  - 视频会议是一种有效的解决方案\n  - 在共享网络文件夹中的电子文件进行文档评审：**WORD**等。评审员在他所审查的文档中插入评论。每个审查员的评论都做上初始标记，这样每个审查员就能看见先前审查员所写的评论\n\
    \  - 基于 **Web** 的聊天工具可以进行实时的远程讨论：**QQ**群，聊天室\n  - 基于 **Web** 的嵌入式协作软件工具：**Review\
    \ Pro** (**http://www.sdtcorp.com**)\n"
  mdcn: "\n## 2. 审查中每个成员扮演的角色\n\n- 作者：不应该充当调解者、读者或记录员。不参与讨论。听取其它审查员的评论，思考回答他们所提出的问题，经常可以发现其它审查员没有觉察到的错误\n\
    - 调解者：审查主持者。与作者一起制订审查计划，协调各种活动，并且推进审查会的进行。提前把待审查的材料分发到各个审查员，按时召开会议，从审查员那获得审查结果，并且使会议集中在发现错误上，而不是解决提出的问题。向执行者明确说明在审查过程中提出的问题和缺陷，汇报审查结果，督促作者对规格说明做出建议性的更改\n\
    - 读者：审查员。对每个需求说明给出注解或简短评论，允许其它审查员在审查时提出问题。\n- 记录员：用标准化的形式记录在审查会中提出的问题和缺陷。记录员必须仔细审查所写的材料以确保记录的正确性。其它的审查员必须用有说服力的方式帮助记录员抓住每个问题的本质，这一方法也使作者清楚地认识到问题的所在和本质。（录音）\n\
    - 规划：作者和调解者协同对审查进行规划，以决定谁该参加审查，审查员在召开审查会之前应收到什么材料并且需要召开几次审查会。审查速度对能发现多少错误影响甚大，每小时审查4～6页是合理的。但应根据如下因素调整审查速度\n\
    \  - 一页中的文字数量\n  - 规格说明的复杂性\n  - 待审查的材料对项目成功的重要程度\n  - 以前的审查数据\n  - 软件需求规格说明作者的经验水平\n\
    - **总体会议**：为审查员提供了解会议的信息，包括他们要审查的材料的背景、作者所作的假设和作者的特定审查目标。如果所有的审查员对要审查的项目都很熟悉，那么你就可以省略本次会议\n\
    - **准备**：每个审查员以典型缺陷清单（在本章的后面部分介绍）为指导，检查产品可能出现的错误，并提出问题。审查员所发现的错误中有高达 **75%** 的错误是在准备阶段发现的。准备一定要充分。\n\
    - 审查会议：读者通过SRS指导审查小组，一次解释一个需求。当审查员提出可能的错误或其它问题时，记录员就记录这些内容，其形式可以成为需求作者的工作项列表。\n\
    \  - 尽可能多地发现需求规格说明中的重大缺陷。\n  - 审查能发现审查员在进行个人准备时没有发现的错误。\n  - 不要偏离了寻找重要错误的目标：提出肤浅的和表面的问题，讨论项目范围的问题，并且集体研讨提出问题的解决方案\n\
    \  - 审查会不应该超过两个小时；如果你需要更多的时间，就另外再安排一次会议\n  - 会议总结：审查小组将决定是否可以接受需求文档、经过少量的修改后可接受或者由于需要大量的修改重审而不被接受\n\
    - 重写（重做）：如果你不打算纠正缺陷，那么进行需求审查将是无意义的\n- 重审：调解者或指派人单独重审由作者重写的需求规格说明，确保所有提出的问题都能得到解决，并且正确修改了需求的错误：是否已满足审查的退出标准？\n\
    \n## 4. 进入和退出审查的标准\n\n### 进入审查的标准\n\n- 文档符合标准模板。\n- 文档已经做过拼写检查和语法检查。\n- 作者已经检查了文档在版面安排上所存在的错误。\n\
