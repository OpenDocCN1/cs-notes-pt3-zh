    +   - 市场人员在有了一个很不错的新产品想法后，也就自认为能充分代表产品用户的兴趣要求。

    +   - 直接从产品的实际用户处收集需求有着不可替代的必要性。导致项目失败的主要的两个原因是缺乏用户参与和不完整的需求以及不完整的规格说明。

    +   - 例子：税控收款机的电子报税系统的需求问题：到底采用那种方式，不能想当然。'
  - '[PAGE 46]


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_46_0.png)


    # 1.客户的涵义


    +   - 通常意义上，客户是指直接或者间接从产品中获得利益的个人或者组织。

    +   - 软件客户包括提出要求、支付款项、选择、具体说明或使用软件产品的项目风险承担者（Stakeholder）或是获得产品所产生结果的人。'
  - '[PAGE 47]


    # 客户的划分


    +   上层需求——业务需求，代表采购、支付或投资软件产品的这类客户，他们有义务说明业务需求。他们应阐明产品高层次概念和将发布产品的主要业务内容。


    +   下层需求——用户需求，必须从使用产品的用户处收集，因此这些用户（通常称最终用户），构成了另一种软件客户。


    +   说明业务需求的客户有时候将代替用户说话，但通常他们根本无法准确说明用户需求。因为信息系统、合同或是客户应用程序开发，业务需求应来自风险承担者，而用户需求则应来自产品的真正使用者、操作者。'
  - '[PAGE 48]


    +   - 不幸的是，这两种客户可能都觉得他们没有时间与(收集、分析与编写需求说明)需求分析者讨论。


    +   - 有时客户还希望分析人员或开发人员无须讨论和编写文档就能说出用户的需求。除非遇到的需求极为简单，否则不能这样做。如果你你的组织希望软件成功，那必须要花上数天时间来消除需求中模糊不清的地方和一些使程序人员感到困惑的方面。'
  - '[PAGE 49]


