  - '[PAGE 88]


    # 6) 构造


    +   软件项目主要产品是交付可执行软件，而不是需求说明文档。


    +   需求文档是所有设计、实现工作的基础。要根据功能要求来确定设计模块，而模块又要作为编写代码的依据。


    +   采用设计评审的方法来确保设计正确地反映了所有的需求。而代码的单元测试能确定是否满足了设计规格说明和是否满足了相关的需求。


    +   跟踪每项需求与相应的设计和软件代码。'
  - '[PAGE 89]


    # 2. 软件需求对其他项目风险承担者影响


    +   - 当软件开发队伍改变需求过程时，与其他项目风险承担者沟通的接口也会发生变化。

    +   - 要顺利地进行变更，必须与其他领域者多合作

    +     - 1、要让他们知道你的改进想法和调整计划。

    +     - 2、要向他们说明改进后的新过程会带来什么好处。

    +     - 3、向其他领域者说明你从他们那里所需要获得的信息和帮助，从而有助于成功开发出整个产品。= 列表子，给例子

    +     - 4、询问其他组织需要从开发队伍中获取什么以有助于他们的工作。也可主动提供。'
