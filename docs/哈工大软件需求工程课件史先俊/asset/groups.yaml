    # 1 需求管理和过程能力成熟度模型


    CMM五个成熟级别:一级的组织典型地以非正式的方式管理项目进度，要获得成功，主要依靠天才是从业者和管理者的英雄史诗般的奋斗。处于更高成熟度级别的组织把具有创造性、训练有素的员工同软件工程和项目管理过程结合起来，将持续不断地获得成功。


    需求管理是CMM成熟标志的KPA之一


    +   1) 把软件需求建立一个基线供软件工程和管理使用。

    +   2) 软件计划，产品和活动同软件需求保持一致。


