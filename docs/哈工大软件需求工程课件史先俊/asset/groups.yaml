  md: '

    ## 4) 功能需求

    客户所说的诸如“用户应该能<执行某些功能>”或者“系统应该<具备某些行为>”，这是最可能的功能需求。功能需求描述了系统所展示的可观察的行为，并且大多数是处于执行者—系统响应顺序的环境中。功能需求定义了系统应该做什么，它们组成了软件需求规格说明的一部分。分析者应该明确，每个人应理解系统为什么“必须”执行某一功能。所提出的功能需求有时反映了过时的或无效的业务过程，而这些过程不能加入到新系统中。


    ## 5) 质量属性

    对系统如何能很好地执行某些行为或让用户采取某一措施的陈述就是质量属性，这是一种非功能需求。听取那些描述合理特性的意见：快捷、简易、直觉性、用户友好、健壮性、可靠性、安全性和高效性。你将要和用户一起商讨精确定义他们模糊的和主观言辞的真正含义，这将在第11章描述。


    ## 6) 外部接口需求

    这类需求描述了系统与外部的联系。软件需求规格说明必须包括用户接口和通信机制、硬件和其它软件系统需求部分。客户描述外部接口需求包括如下习惯用语：


    - “从<某些设备> 读取信号”

    - “给<一些其它系统>发送消息”

    - “以<某种格式>读取文件”

    - “能控制<一些硬件>”


    ## 7) 限制

    限制是指一些合理限制设计者和程序员选择的条件。它们代表了另一种类型的非功能需求，你必须把这些需求写入软件需求规格说明。尽量防止客户施加不必要的限制，因为这将妨碍提出一个好的解决方案。不必要的限制将会降低利用现有商业化软件集成解决方案的能力。一定的限制有助于提高产品质量属性。只利用程序语言的标准命令而不允许使用供应商的扩展，可以提高可移植性。下面是客户描述限制的一些习惯用语：


    - “必须使用<一个特定的数据库产品或语言>”

    - "不能申请多于<一定数量的内存>"

    - "操作必须与<其它系统>相同"

    - “必须与<其它应用程序>一致”


    ## 8) 数据定义

    当客户描述一个数据项或一个复杂的业务数据结构的格式、允许值或缺省值时，他们正在进行数据定义。例如，“邮政编码由5个数字组成，后跟一个可选的短划线或一个可选的四位数字，缺省为0000”就是一个数据定义。把这些集中在一个数据字典中，作为项目的参与者在整个项目的开发和维护中的主要参考文档。


    ## 9) 解决思想

    - 如果一个客户描述了用户与系统交互的特定方法，以使系统产生一系列活动

    - 例如：用户从下载清单中选择一个所需要的项，这时你正在听取建议性的解决方案，而不是需求。所建议的解决方案使获取需求小组成员在潜在的真正需求上分散精力。在获取需求时，应该把重点放在需要做什么而不是新系统应该如何设计和构造。探讨客户为什么提出一个特定的实现方法，因为这可以帮助你理解真正的需求和用户对如何构造系统的隐含的期望。


    ## 小结

    - 1、项目视图和范围的含义，以及谁来决定宏观的软件项目视图和范围。

    - 2、寻找真正的需求以及需求典型的来源。

    - 3、寻找用户类和用户代表，确定获得需求的用户小组。

    - 4、确定用户类后，应该真正获取有效需求的方法，重点介绍了基于使用实例的方法。

    - 5、UML中基于用例图的相关知识。


    ## 思考题：

    - 1、回顾自己参与过的软件设计项目和工程，描述当时怎么来确定项目视图和范围，以及经历了怎么样的讨论过程？

    - 2、在内部的工作布告过程中，有空缺地区的HR头通知该地区员工及其他地区HR头。其他地区的HR头通过挂出有空缺信息的布告来通知员工。

    - 对此信息的响应，来自不同地区的员工把他们的申请送到有空缺地区的HR头。后申请者的技能要与空缺所要求的相匹配。具有所要求技能的申请被列入到缩减的申请人的名单并获得面试计划表。已列入到缩减的申请人被通知关于面试时间表。


    ## 思考题：（续上）

    - 根据面试的程序，面试的材料将被更新，所有已选的申请者给以一份新的录用信。申请者通过接受或拒绝录用信来通知有空缺地区的 HR 头。在员工接受录用信之后，转职请求被发送到该员工的当前地区
    HR 头。各个地区处理转职材料并把它发送给已被转职的员工的新地区。然后新地区更新此员工的材料，把调动的文档发送给此员工。

    - 识别内部的工作布告过程中涉及的不同用例，并描述该系统的用户视图。


    ## 第9章 编写需求文档

    需求开发的最终成果是：客户和开发小组对将要开发的产品达成一致协议。这一协议综合了业务需求、用户需求和软件功能需求。就像我们早先所看到的，项目视图和范围文档包含了业务需求，而使用实例文档则包含了用户需求。你必须编写从使用实例派生出的功能需求文档，还要编写产品的非功能需求文档，包括质量属性和外部接口需求。只有以结构化和可读性方式编写这些文档，并由项目的风险承担者评审通过后，各方面人员才能确信他们所赞同的需求是可靠的。


    ## 编写软件需求规格说明的方法

    - 用好的结构化和自然语言编写文本型文档。

    - 建立图形化模型，这些模型可以描绘转换过程、系统状态和它们之间的变化、数据关系、逻辑流或对象类和它们的关系。

    - 编写形式化规格说明，这可以通过使用数学上精确的形式化逻辑语言来定义需求。


    ## 1. 编写目的

    - 软件需求规格说明，也称为功能规格说明、需求协议以及系统规格说明。

    - 阐述一个软件系统必须提供的功能和性能以及它所要考虑的限制条件。

    - 软件需求规格说明不仅是系统测试和用户文档的基础，也是所有子系列项目规划、设计和编码的基础。

    - 它应该尽可能完整地描述系统预期的外部行为和用户可视化行为。除了设计和实现上的限制，软件需求规格说明不应该包括设计、构造、测试或工程管理的细节。


    - 客户和营销部门依赖它来了解他们所能提供的产品。

    - 项目经理根据包含在软件需求规格说明中描述的产品来制定规划并预测进度安排、工作量和资源。

    - 软件开发小组依赖它来理解他们将要开发的产品。

    - 测试小组使用软件需求规格说明中对产品行为的描述制定测试计划、测试用例和试过程。


    - 软件维护和支持人员根据SRS了解产品的某部分是做什么的。

    - 产品发布组在SRS和用户界面设计的基础上编写客户文档，如用户手册和帮助屏幕等。

    - 培训人员根据SRS和用户文档编写培训材料。


    ## 注意

    - 对节、小节和单个需求的号码编排必须一致。

    - 在右边部分留下文本注释区。

    - 允许不加限制地使用空格。

    - 正确使用各种可视化强调标志（例如，黑体、下划线、斜体和其它不同字体）。

    - 创建目录表和索引表有助于读者寻找所需的信息。

    - 对所有图和表指定号码和标识号，并且可按号码进行查阅。

    - 使用字处理程序中交叉引用的功能来查阅文档中其它项或位置，而不是通过页码或节号。


    ## 3 编写需求文档的原则

    - 保持语句和段落的简短。

    - 采用主动语态的表达方式。

    - 编写具有正确的语法、拼写和标点的完整句子。

    - 使用的术语与词汇表中所定义的应该一致。

    - 需求陈述应该具有一致的样式，例如 “系统必须??”或者 “用户必须??”，并紧跟一个行为动作和可观察的结果。例如，“仓库管理子系统必须显示一张所请求的仓库中有存货的化学药品容器清单。”


    - 为了减少不确定性，必须避免模糊的、主观的术语，例如，用户友好、容易、简单、迅速、有效、支持、许多、最新技术、优越的、可接受的和健壮的。当用客说“用户友好”或者“快”或者“健壮”时，你应该明确它们的真正含义并且在需求中阐明用户的意图。


    - 避免使用比较性的词汇，例如：提高、最大化、最小化和最佳化。定量地说明所需要提高的程度或者说清一些参数可接受的最大值和最小值。当客户说明系统应该“处理”、“支持”或“管理”某些事情时，你应该能理解客户的意图。含糊的语句表达将引起需求的不可验证。


    - 不应该把多个需求集中在一个冗长的叙述段落中：不要在需求说明中使用“和/或”，“等等”之类的连词（表明了该部分集中了多个需求）。

    - 让独立性强的需求在需求管理工具或数据库中只出现一次，这样可以缓和冗余问题。


    ## 多详细为好？

    - 顶层不明确的需求向低层详细分解，直到消除不明确性为止

    - 如果评审人员对客户的意图还不甚了解，那么就需要增加额外的说明，以减少由于误解而产生返工的风险。

    - 恰如其分的需求详细程度：编写测试用例验证这个需求能够正确地实现，那么就达到了合理的详细程度。如果你预想的测试很多并且很分散，那么可能就要将一些集合在一起的需求分离开。已经建议将可测试的需求作为衡量软件产品规模大小的尺度


    ## 4.需求改进

    - 高质量需求陈述的许多特性：完整性、正确性、可行性、必要性、设定优先级、明确性和可验证性。

    - 根据上述质量特性来检查每一个需求陈述

