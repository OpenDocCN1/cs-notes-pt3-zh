    # 1 控制项目范围的扩展


    +   - 扩展需求是指在软件需求基线已经确定后又要增添新的功能或进行较大改动。

    +   - 扩展需求对百分之八十的管理信息系统项目和百分之七十的军事软件项目造成风险。

    +   - 迟到的需求变更会对已进行的工作有较大的影响。

    +   - 有些需求的改进是合理且不可避免的。

    +   - 在你的项目进度表中应该对必要的需求改动留有余地。

