  - '[PAGE 82]


    # 第四章 改进需求过程


    +   - 革命是痛苦的！

    +     - 要流血的，要牺牲的！

    +   - 不革命更痛苦！

    +     - 明知道错了，不行，还再错一遍？

    +   - 不正确的人，或不正确的方法必然导致革命失败！

    +     - 采取正确的理论和方法进行改进

    +     - 例子：工大软件：事业部 -> 矩阵式 -> 事业部

    +   - 革命尚未成功，同志尚要努力！'
  - '[PAGE 83]


    +   - 软件开发过程的改进有以下两个目标

    +     1. 解决在以前项目或目前项目中遇到的问题

    +     2. 防止和避免你可能在将来的项目中遇到的问题


    +   - 把理论方法付诸实践是改进软件过程（process）的核心所在。避免使用过去使用过的令人头痛的方法。


    +   - 改进之路是从失败、错误开始，还要历经诸如受人为抵制的影响及因任务的时间紧迫导致改进被搁置这样的挫折。


    +   - 需求与其他主要项目过程和风险承担者之间的关系'
  - '[PAGE 84]


    # 1. 需求与其他项目过程的关系


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_84_0.png)'
  - '[PAGE 85]


    +   1) 制定项目计划

    +     - 需求是制定项目计划的基础。因为开发资源和进度安排的估计都要建立在对最终产品的真正理解之上。

    +     - 通常，项目计划指出所有希望的特性不可能在允许的资源和时间内完成，因此，需要缩小项目范围或采用版本计划对功能特性进行选择。


    +   2) 项目跟踪和控制

    +     - 监控每项需求的状态，以便项目管理者能发现设计和验证是否达到预期的要求。如果没有达到，管理者通常请求变更控制过程来进行范围的缩减。'
  - '[PAGE 86]


    # 3) 变更控制


    在需求编写成文档并制定基线以后，所有接下来的变更都应通过确定的变更控制过程来进行。变更控制过程能确保：


    +   - * 变更的影响是可以接受的。

    +   - * 受到变更影响的所有人都接到通知并明白这一点。

    +   - * 由合适的人选来作出接受变更的正式决定。

    +   - * 资源按需进行调整。

    +   - * 保持需求文档是最新的版本并是准确的更新文档。'
