  - '[PAGE 389]


    # 2 测试需求


    +   - 通过阅读软件需求规格说明，通常很难想象在特定环境下的系统行为。

    +   - 以功能需求为基础或者从使用实例派生出来的测试用例可以使项目参与者看清系统的行为。

    +   - 在部分需求稳定时就开始开发测试用例，那么就可以及早发现问题并以较少的费用解决这些问题。

    +   - 是黑盒子或功能上的测试用例'
  - '[PAGE 390]


    +   - 从使用实例中获得概念上的功能测试用例（<u>基于模仿使用的测试用例</u>），利用测试用例来验证文本需求规格说明和分析模型（例如对话图）并<u>评价原型</u>。

    +   - 可以把原来<u>手工做的工作</u>，作为测试用<u>例来测试你的SRS</u>或模型、原型。'
  - '[PAGE 391]


    # 建议


    +   - 从你的项目软件需求规格说明中任意选择一页功能需求。召集代表不同风险承担者观点的一个小组并仔细审查一页需求以寻找与好的需求说明特性相偏离的那些需求。

    +   - 如果从随机评审中发现太多问题，以至使评审员对整个需求质量感到担忧，那么就要让用户和开发人员代表审查整个软件需求规格说明。在审查过程中要培训审查小组中的成员，使之发挥最高效率。

    +   - 为使用实例或软件需求规格说明中未编码的部分，定义概念上的测试用例。判断风险承担者们是否对测试用例所反映的预期的系统行为持有一致的意见。确保你已经定义了允许测试用例“执行”的所有功能需求，并且不存在多余的需求。'
