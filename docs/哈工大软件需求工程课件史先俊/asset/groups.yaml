    \n## 1 需求建模\n- 不存在一个包罗万象的图，把所有的内容都包容进一个完整的需求描述中，分析模型应该增强自然语言的需求规格说明，而不是替换之\n-\
    \ 需求的图形化表示的模型包括数据流图（DFD）、实体关系图（ERD）、状态转化图（STD）、对话图和类图。项目规划工具\n- 作为需求分析工具，你可以用这些图对问题域进行建模，或者创建新系统的概念表示法。图形有助于分析者和客户在需求方面形成一致的、综合的理解，并且还可以发现需求的错误\n\
    \n## 是否使用模型\n- 通过建立模型来确信你理解了需求\n- 模型描述了问题域的逻辑方面，如数据组成、事务和转换、现实世界对象和允许的状态。\n- 或者可以从文本需求出发来画模型，从不同的角度来表示这些需求，\n\
    - 或者可以从所画的基于用户输入的模型来获得功能需求。\n- 在设计阶段，要从物理上而不是从逻辑上画出模型来明确说明将如何实现该系统：规划建立的数据库，将举例说明的对象类，还有你将开发的编码模块。\n\
    \n## CASE工具\n- 通过交互画图使你易于对模型进行改进。\n- 可以验证模型，并且识别人们在评审图形时没有发现的语法或逻辑错误。\n- 可以把多系统图形一起连接到数据字典中以共享数据定义\n\
    - 有助于你保持模型之间的一致性并使模型与软件需求规格说明中的功能需求保持一致\n\n## 结构化模型设计方法\n1. E-R图（实体关系图）\n   -\
    \ 实体：客观存在并可区分的事物。\n   - 属性：实体所具有的某种特性，一个实体可以有多个属性。\n   - 关系：实体之间的对应关系，可分为1：1联系、1：n联系、m：n联系\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_276_0.png)\n\n图1.1 学生-课程关系图\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_276_1.png)\n\
    \n图1.2 学生属性图\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_276_2.png)\n\n图1.3 实体关系图\n\
    \n## 数据流图\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_277_0.png)\n\n## 功能模块图\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_278_0.png)\n\n## 2. 从客户需求到分析模型\n- 根据客户输入，把重要的名词和动词映射成特定的模型组件\n\
    \n| 单词类型 | 例子 | 分析模型组件 |\n|---|---|---|\n| 名词 | • 人、组织、软件系统、数据项或者存在对象 | • 端点或数据存储（DFD）<br>•\
    \ 实体或它们的属性（ERD）<br>• 类或它们的属性（类图） |\n| 动词 | • 行为、用户可做的事或可发生的事件 | • 过程（DFD）<br>•\
    \ 关系（ERD）<br>• 转化（STD）<br>• 类操作（类图） |\n\n## 3 数据流图\n- 确定了系统的转化过程、系统所操纵的数据或物质的收集（存储），还有过程、存储、外部世界之间的数据流或物质流。\n\
    - 适用于事务处理系统和其它功能密集型应用程序。通过加入控制流元素后，数据流图技术就可以扩充到允许实时系统的建模\n- 层次分解法:高层数据流图对数据和处理部分提供一个整体的统筹，这是对包含在软件需求规格说明中的精确、详细叙述的补充。\n\
    \n- 关联图是数据流图最高层的抽象：把整个系统表示成一个简单的黑匣子的过程，并用一个圆圈表示。关联图还表示出外部实体或与系统有关的端点，以及在系统与端点之间的数据和物质流。在关联图中，元素之间的流往往代表了复杂的数据结构，这些数据结构在数据字典中定义\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_282_0.png)\n\n- **0层数据流图:**关联图中所有的数据流也出现在0层数据流图上\n\
    - **0层数据流图**包含了许多数据存储（**data store**），它是用一对水平的平行线表示，由于数据存储在系统内部，因此它们并不出现在关联图中。从圆圈到数据存储的流表示数据放入数据存储器，从数据存储器出来的流表示一个读操作，而数据存储器和圆圈之间的双向箭头则表示一个更新操作。\n\
    \n![](img/c5c47a9f28f3387f14f39dce6cf9002c_284_0.png)\n\n# 图10-1 “化学制品跟踪系统”的0层数据流图\n\
    \n- 在0层图中，每个独立的圆圈所代表的过程循序渐进细化直到最低层的图：仅描述原子过程操作\n- 原子操作可以清楚地表示所叙述文本、伪码、流程图或程序代码\n\
    - 功能需求将精确地定义每个原子过程的行为\n- 每一层数据流图必须与它上一层数据流图保持平衡和一致，因此，子图的所有输入输出流要与其父图相匹配。高层图中复杂的数据流可以分解到低层数据流图中，并把这些数据结构写入数据字典中\n"
  mdcn: "\n## 5 数据字典\n\n- 一个定义应用程序中使用的所有数据元素和结构的含义、类型、数据大小、格式、度量单位、精度以及允许取值范围的共享仓库。\n\
    - 应该为你的项目创建一个独立的数据字典，而并不是在每个需求出现的地方定义每一个数据项。\n- 数据字典的维护独立于软件需求规格说明，并且在产品的开发和维护的任何阶段，各个风险承担者都可以访问数据字典。\n\
    - 数据字典不是数据库结构，但是数据库设计的重要基础之一。\n\n### 1) 原数据元素\n- 一个原数据元素是不可分解的。可以给它赋予一个数量值。原数据的定义必须确定其数据类型、大小、允许取值的范围等等。典型的原数据元素的定义是一行注释文本，并以星号作为界限：\n\
    - 请求标识号 = * 6位系统生成的顺序整数，以1开头，并能唯一标识每个请求*\n\n## 2) 组合项\n- 一个数据结构或记录包含了多个数据项。如果数据结构中的项是可选的，就把它用括弧括起来：\n\
    - 请求的化学制品＝化学制品标识号\n  - 数量\n  - 数量单位\n  - （供应商名称）\n- （）表示可选\n\n## 3) 重复项\n\n如果一个项的多个实例将出现在数据结构中，就把该项用花括弧括起来。如果你知道可能允许的重复次数，就用“最小值：最大值”这种形式写在括号之前：\n\
    \n- 请求=请求标识号\n- 产品编号\n- 1 : 10 {请求的化学制品}\n\n### 4) 选择项\n- 如果一个原数据项元素可以取得有限的离散值，就把这些值列举出来：\n\
    - 数量单位 = [ “克” | \"千克\" | \"个\" ]\n- 文本串表示了与所请求的化学制品的量相关的单位\n\n## 建议\n- 从你的软件需求规格说明中取出一页功能需求说明。检查每个语句，看它是否与好的需求特性相符，重写那些不符合的需求。\n\
    - 如果公司对需求文档没有标准的格式，那么就召集一个小的工作组讨论决定采纳的一个标准的软件需求规格说明模板。从给出的模板开始并改编这个模板，使其最好地适合你的项目和产品。在标识需求方面也要一致。\n\
    - 召集一个由3到7个项目的风险承担者组成的小组来正式评审项目中的软件需求规格说明。确保每个需求规格说明都是清晰的、可行的、可验证的及无二义性的等等。寻找规格说明中不同需求间的冲突，以及软件需求规格说明中遗漏的部分。通过检查软件需求规格说明，确保纠正了在软件需求规格说明中及其后续产品里出现的错误。\n\
    \n## 作业\n- 设计你系统的数据字典\n- 编制大作业的软件需求规格说明书。模版采用老师给出的模版\n- 自己按照优秀需求的原则进行验收！\n- 1月8日前交Version\
    \ 1.0\n\n## 第10章 需求的图形化分析\n\n例子：\n- 用户代表1：我阅读过整个软件需求规格说明。大部分都符合我的要求，但是有几个部分我很难同意。我不能确信在化学制品请求过程中，我们是否确定了这些步骤。\n\
    - 测试专家：当一个请求通过系统时，我很难想象用于覆盖该请求状态变化的所有测试用例。我发现许多关于状态变化的需求散布在整个软件需求规格说明中，但我无法确定是否有一些需求遗漏了或存在不一致性\n\
