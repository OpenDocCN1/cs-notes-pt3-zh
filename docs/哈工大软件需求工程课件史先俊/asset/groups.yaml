    \n图4-3 软件开发过程改进的周期\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_94_0.png)\n\n#\
    \ 评估当前采用方法\n\n- 1、设计自我评价问卷是一种系统方法，见附录\n- 2、更彻底的评估方法是来自外部的顾问客观地评估你目前的软件开发方法。 CMM\n\
    \n# 制定改进活动计划\n\n- 1、将过程改进活动看做是项目，在评估后制定一个活动计划。 战略计划+战术计划\n- 2、采用简单易于获得的过程改进活动计划模板\n\
    \n# 需求活动计划模板\n\n- 项目名称：　　　　　　　　　　　　　　　　　　　　　　　　　编制日期：\n- 预计所有活动的结束日期：\n- 目标：说明业务方面的目标，而不是过程变更方面的\n\
    - 成功的标志：\n- 对组织影响的范围：\n- 参与的人：\n- 姓名 角色 时间 责任\n- 跟踪和报告过程：\n- 说明怎样跟踪计划中的活动条目进展及报告其状态结果等\n\
    - 依赖关系，风险，和约束条件：\n- 明确对计划成功有帮助或有阻碍的各种外部因素\n- （3-10个）活动编号：__ 负责人：__ 预计日期：__\n-\
    \ 活动的描述：__ 产品：__ 需要的资源：__\n\n- 建立、实验、和实施新的过程 =实施计划。\n  - 选择实验参与者 不应该对过程改进持有强烈的反对意向。\n\
    \  - 确定用于评估实验的标准，使得到的结果易于解释。\n  - 通知那些需要知道实验是什么以及为什么要实施的工程风险承担者。\n  - 考虑在不同的项目中实验新过程的不同部分。用这个方式可使更多的人尝试新方法，因此能提高认知水平，增加反馈信息。\n\
    \  - 作为评估的一部分工作，询问实验参与者，如果他们不得不回头采用他们原有工作方法，他们会觉得怎样。\n\n# 评估结果\n\n- 1、过程改进周期的最后一步就是评估已经实施的活动及取得的成果。\n\
    - 2、其中最重要的一步是评估新的实施过程是否带来了期望的结果。下次是否需要稍作变更\n- 3、要接受学习曲线的事实\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_97_0.png)\n\
    \n## 5. 需求过程的积累材料\n\n- 检查清单 清单列出各项活动，交付的结果和其它应注意或验证的条目。检查清单是用来提示记忆的，有助于确保处于忙碌中的工作人员不要忽略重要细节。\n\
    - 实例 一种特定类型工作产品的代表，积累起能在你组织中运用的更好的实例。\n- 计划 概括说明怎样完成目标与完成时需要什么样的文档。\n- 方针 确立活动期望、产品期望和交付产品期望的指导原则。过程都应遵从的方针。\n\
    \n- 过程 描述完成某个活动的任务顺序或步骤，说明要执行的任务及其在项目中所扮演的角色。不要包括示范信息。\n- 过程描述 一组完成某些目的活动文档的定义。过程描述应包括过程目标、里程碑、参与者和执行任务的适合时间、交流步骤，期望结果以及与过程相关的输入和输出数据（Caputo\
    \ 1998）。\n- 模板 一种完成整个工作产品的指导方式。重要工程文档的模板提醒你检查是否遗漏了什么。一个结构很好的模板提供了许多捕获和组织信息的栏目(slot)。模板中包含的指导信息将帮助文档作者有效地使用它。\n\
    \n# 需求开发过程的积累材料\n\n- 项目视图与范围模板\n- 需求开发过程\n- 需求分配过程\n- 使用实例模板\n- 软件需求规格说明模板\n-\
    \ 需求优先级确定过程\n- SRS和使用实例审查清单\n\n- 需求管理过程的积累材料\n  - * 变更控制过程\n  - * 变更控制委员会过程\n\
    \  - * 需求变更影响分析检查清单和模板\n  - * 需求状态跟踪过程\n  - * 需求跟踪能力矩阵模板\n\n# 6.需求过程改进路标\n\n需求工程中的培训组\n\
    \n软件评审中的培训组\n\n评审需求说明文档\n\n简化的系统测试结果\n\n采用标准SRS模板\n\n采用使用实例方法和模板\n\n采用需求优先级确定过程\n\
    \n较高的客户满意度\n\n建立CCB并把CCB过程变成文档\n\n将需求变更过程变成文档\n\n采用变更影响分析过程\n\n跟踪需求状态\n\n改进后的项目管理\n\
    \n# 建议\n\n- 完成附录中的目前需求实践自我评估。以你目前实践缺陷的影响严重程度为基础，确定需求过程的三个最佳改进机会。\n- 确定哪项需求工程的积累材料在你组织中还没有，但你认为会很有用。\n\
    - 在前面两步的基础上，建立一个需求过程改进路标。说服你组织的某个人来负责某项里程碑活动。让每位负责人写一份活动计划，用于实施活动，采用活动计划模板。当实施计划时，跟踪各活动条目的进展情况。\n\
    \n# 第五章 软件需求与风险管理\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_105_0.png)\n\n-\
    \ 风险是变更的来源！\n- 所谓风险就是可能给项目的成功带来威胁或损失的情况，而风险管理则是指在风险给项目带来损失之前就指明，评估并对风险加以控制。\n\
    - 在项目中，可能出现差错的事情常常比可能意想不到地正常运行的事情多\n- 风险无处不在：要有风险意识\n- 防患于未然：要有预防措施\n\n- 需求在软件项目总扮演着一个核心的角色\n\
    \  - 1、正因为如此，精明的项目管理者会在初期就指明与需求相关的风险并积极的控制它们。\n  - 2、典型的需求风险包括：对需求的误解，不恰当的用户参与，不确定或随意变更项目范围和目标等。\n\
    \  - 3、项目管理者只能通过与客户或客户代表（如市场人员）合作来控制需求风险。\n\n- 负责Contoso制药公司“化学制品跟踪系统”的项目管理人员Dave会见他的首席程序员Helen和首席测试员Ramesh。他们对新项目都很有兴趣，但他们也记得在以前一个称作“药品仿真”的项目中遇到的问题。\n\
    - “还记得我们直到进入测试时才发现用户对仿真程序的用户界面极为不满意吗？”Helen问道。“我们花了五周时间重新实现，重新测试，我可再不愿玩这样的死亡游戏了。”\n\
    - “的确是烦人，”Dave附和道。“同样麻烦的是那些用户提出一大堆没人用过的特性，这样的交互导致编码花费了预计时间的三倍，我们是不管好歹，编完了事，简直是废品！”\n\
    - “我们太匆忙了，以至没有时间写详细的需求说明”Ramesh回忆道。“测试人员有一半的时间都在问程序员怎样才能判断他们的程序工作正常，以便能测试它。可是程序员设计的一些功能根本就不是用户所要求的。”\n"
