    # 表16-1 建议的需求状态表


    | 状态值 | 定义 |

    |--------|------|

    | 已建议 | 该需求已由有权提出需求的人建议 |

    | 已批准 | 该需求已被分析，估计了其对项目余下部分的影响（包括成本和对项目其余部分的干扰），已用一个确定的产品版本号或创建编号分配到相关的基线中，软件开发团队已同意实现该项需求
    |

    | 已实现 | 已实现需求代码的设计、编写和单元测试 |

    | 已验证 | 使用所选择的方法已验证了实现的需求，例如测试和检测，审查需求跟踪与测试用例相符。该需求现在被认为完成 |

    | 已删除 | 计划的需求已从基线中删除，但包括一个原因说明和做出删除决定的人员 |'
