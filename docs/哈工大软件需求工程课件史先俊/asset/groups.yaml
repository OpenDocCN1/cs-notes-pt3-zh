    # 一、软件需求和客户的需求观


    +   1、软件需求的定义

    +     1、软件需求是一个没有统一定义的名词。客户所定义的需求对开发者而言是一个较高层次的产品概念。而开发人员所说的需求对用户来说又像是详细设计了

    +     2、IEEE软件工程中定义：

    +       （1）用户解决问题或达到目标所需的条件或权能

    +       （2）系统或系统部件要满足合同、标准、规范或其它正式规定文档所需具有的条件或权能。

    +       （3）一种反映上面（1）或（2）所描述的条件或权能的文档说明。

    +     3、另外一种通用的观点：认为需求是用户所需要的并能触发一个程序或系统开发工作的说明。'
  - '[PAGE 28]


    # 需求的层次


    +   - 软件需求包括三个不同的层次：业务需求、用户需求、和功能需求。

    +     - 1、业务需求 (business requirement) 描述了客户对系统，产品实现某些业务流程的高层次目标要求。

    +     - 2、用户需求 (user requirement) 描述了用户使用产品必须完成的任务。

    +     - 3、功能需求 (functional requirement) 定义了开发人员必须实现的软件功能。

    +     - 它们均应在不同位置体现在软件需求说明书中'
