    \n- 一旦建立用户组，则必须明确，这些参与者是否真正代表了各个方面的用户，而这些用户的需求是否真正可以促进产品的开发。\n\n- 用户和开发者之间可以有多种渠道来进行信息交互。非直接联系一般是无效的！\
    \ 在用户和开发者之间插入一些中间层，会增加他们之间交流信息时产生错误的可能性的。\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_169_0.png)\n\
    \n图7-1 用户和开发者之间的可能通讯路径\n\n## 4 产品的代表者\n\n- 每一个产品代表者代表了一个特定的用户类，并在那个用户类和开发者之间充当主要接口。产品代表者必须是真正的用户，而并不是用户的代理人。\n\
    - 负责协调他们所代表的用户在需求表达上的不一致性和不兼容性。为那个用户类整理出统一的需求意见。\n- 虽然分析员通常起草需求文档，但需求的收集与整理是分析员和一些核心客户的共同责任。\n\
    - 产品代表者并不是全职，但他们每个星期都要花数个小时在项目研究上\n"
  mdcn: "\n## 3.关联图\n\n- 确定了通过某一接口与系统相连的外部实体（称为“端点”或“外部实体”），同时也确定了外部实体和系统之间的数据流和物流。\n\
    - 把关联图作为按照结构化分析所形成的数据流图的最高抽象层\n- 可以把关联图写入项目视图和范围文档或软件需求规格说明中，或者作为系统数据流模型的一部分。\n\
    - 关联图来确定项目风险承担者之间清晰而精确的关系\n\n## \"化学制品跟踪系统\" 关联图\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_152_0.png)\n\
    \n- 关联图并不明确提供系统的内部过程和数据。\n- 关联图中的流可以用信息（“化学制品请求”）。或物理项（“化学制品容器”）来表示\n- 以矩形图示的端点可以表示用户类(\"\
    药剂师\")、组织（“采购部门”）或其它计算机系统（“培训用数据库”）。\n\n你可能希望把化学制品的供应商作为一个端点放入关联图中。别忘了，公司总是发购买化学制品的订单给化学制品供应商，并从供应商那里得到装有化学制品的容器和发票，而供应商则得到支票。然而，这些过程发生在“化学制品跟踪系统”范围之外，并作为购买和进货部门日常事务的一部分。关联图明确告诉我们，系统并不直接与供应商订货、进货、或付款。\n\
    \n## 4 把注意力始终集中在项目的范围上\n\n- 在项目视图和范围文档中记录业务需求为防止开发过程范围的扩展（**creep**）提供了有利的手段。项目视图和范围文档可以使你判断所提出的特性和需求改进项目是否合适。当某些人提出新的需求或改变需求或特性时，你必须问的第一个问题是：“这是否包含在项目范围之内？”\n\
    - 在项目范围之外的需求，将未来的产品与其他产品的事，我们不加入此需求\n- 在项目范围定义之内的建议与已经为某一确定产品所制定的需求相比，具有更高的优先级，则这些新的并符合要求的需求就可以加入到项目中。不过此时你必须作出权衡（**trade\
    \ off**），决定是延迟还是取消其它已经确定的需求或特性。\n\n- 在项目范围之外的需求，很有价值，可以改变项目的范围来适应这一需求。但要求你要修改项目视图和范围文档。\n\
    \  - 当改变项目的范围时，你必须重新商议计划预算、资源及进度安排，也许还有开发人员（特别是在需要新的技术和技巧时）。理想的情况是原先的安排和资源能合理地适应需求变更。然而，你必须在需求变更得到赞同后才重新进行计划安排，除非你原先对需求的预算留有余地。\n\
    \n## 建议\n\n- 无论你是正要开发一项项目或正在开发一项项目，请用课程中的模板编写一份项目视图和范围文档。（作业）\n- 如果你的开发组对项目范围各抒己见，则这一任务可能比较困难。现在开始就要解决这一问题，而不是让它模棱两可；如果你对这个问题置之不理，则这个问题就会越来越难解决。\n\
    - 这一活动也可通过修改模板来更好地满足你公司组织项目的需要。\n\n## 第七章 寻找客户的需求\n\n- 客户的参与是发布一个软件的关键因素。\n  -\
    \ 1、前面主要是讨论一种类型的客户—项目的主持者提供的商业需求（可理解为业务需求）\n  - 2、本章集中介绍需求第二级——用户需求\n- 为了征求客户的意见，必须采取以下几步：\n\
    \  - 1、明确项目用户需求的来源\n  - 2、明确使用该产品的不同类型客户\n  - 3、与产品不同用户类的代表进行沟通\n  - 4、遵从项目的最终决策者意见\n\
    \n- 客户参与是避免期望差异（expectation gap）的唯一途径，这一期望差异表现在客户期望得到的产品与开发者所设计的产品之间不相符。然而，在项目的开始阶段仅仅简单地问一两个客户的需求，然后就开始编码，这样做是不够的。如果开发者仅仅为了客户的最初需求去开发软件，那么，他们可能要重新进行开发，因为，客户常常不知道他们的真正需要，而开发者也不知道。\n\
    \n## 1 需求的来源\n\n- 需求工程是以相互交流为核心的\n\n- 1. 访问并与有潜力的用户探讨\n\n- 2. 把对目前的或竞争产品的描述写成文档\n\
    \n- 文档可以描述一种所必须遵循的标准或产品所必须遵循的政府或工业规则。\n\n- 系统需求规格说明\n\n- 一个包含软、硬件的产品需要一个高档次的系统需求规格说明以介绍整个产品。系统需求的子集被分配到每个软件子系统中。附加的详细软件功能需求将从有关软件的系统需求里获得。\n\
    \n- 4. 对当前系统的问题报告和增强要求\n- 5. 市场调查和用户问卷调查\n- 6. 观察正在工作的用户\n  - 分析员可通过观察用户与所关联的任务环境的工作流程来预见用户在使用当前系统时所遇到的问题，并能分析新的系统可有效支持工作流程的方面。\n\
    \  - 分析员必须抽象和总结用户的直接活动，以确保所获得的需求具有普遍性，而不仅仅代表单个用户。一个富有技巧的分析员还可以为改进用户的当前事务处理过程提出一些见解。\n\
    \n## ■ 7. 用户任务的内容分析\n\n■ 通常通过开发具体的情节或活动顺序（有时称作“情节”），可以确定用户利用系统需要完成的任务，分析师由此可以获得用户用于处理任务的必要的功能需求。这是使用实例方法的精髓。\n\
    \n## 2 用户类\n\n- 产品的用户在很多方面存在着差异，例如：用户使用产品的频率、他们的应用领域和计算机系统知识、他们所使用的产品特性、他们所进行的业务过程、他们在地理上的布局以及他们的访问优先级。根据这些差异，你可以把这些不同的用户分成小组。比起其他用户，其中某些用户类的需求可能对你更为重要\n\
    \n- 每一个用户类都将有自己的一系列功能和非功能要求。比如：一个没有经验或偶尔使用电脑的用户关心系统是否简单易用，因此，菜单、提示符和向导是很重要的。然而，对于那些一天使用几小时产品的用户，他们更关心产品的易用性和高效性，所以他们喜欢使用快捷键、宏以及脚本功能(scripting\
    \ facility)。\n\n- 有一些受产品影响的人并不一定是产品的直接使用者，而是通过报表或其它应用程序访问你产品的数据和服务。这些非直接的或次级的用户也有他们的需求，于是他们组成了附加的用户类。就像我的同事Kathy所说的：\
    \ “只要一日是你的用户，则终身都是你的用户。”\n- 用户类不一定都指人，你可以把其它应用程序或系统接口所用的硬件组件也看成是附加用户类的成员。以这种方式来看待应用程序接口，可以帮助你确定产品中那些与外部应用程序或组件有关的需求。\n\
    - 在项目中，要尽早为产品确定并描述出不同的用户类，这样，就能从每一个重要的用户类代表中获取不同的需求。在软件需求规格说明中，把这些用户类和他们的特征编写成文档。\n\
    \n## \"化学制品跟踪系统\" 的用户类和他们的特征\n\n表7-1 \"化学制品跟踪系统\" 的用户类\n\n|  |  |\n|---|---|\n\
    | 药剂师 | 药剂师将使用系统请求来自供应商和仓库的化学制品。药剂师每天多次使用系统，主要用于跟踪进出实验室的化学制品容器。药剂师需要在供应商目录中查找指定化学制品\
    \ |\n| 采购者 | 采购者在采购部门处理其他用户所提交的化学制品请求，他们与外部的供应商建立联系，制定并发出订单。采购者对化学制品几乎不了解，因此将需要简单的查询机制来查找供应商目录。采购者不使用系统中容器跟踪这一特性。每个采购者平均每天使用系统10次\
    \ |\n| 化学制品仓库人员 | 化学制品仓库人员包括三个技师，管理者多达 500 000种化学制品容器。他们将处理来自药剂师的请求并提供可用的容器，向供应商请求新的化学制品以及跟踪进出仓库的所有容器的流向，他们是货有清单和化学制品使用报告特性的唯一使用者。由于交易量大，化学制品仓库人员所使用的系统功能必须是自动化且高效\
    \ |\n| 卫生和安全人员 | 卫生和安全人员使用系统是为了生成符合官方关于化学制品使用和处理规则的季度报表。这些报表必须提前定义，并不需要特别查询能力，当官方的规则改变时，卫生和安全管理人员可能每年多次要求变化报表中的内容。报表变更优先级最高\
    \ |\n\n## 3 寻找用户代表\n\n- 在获取（elicitation）用户需求时挑选合适的 的用户代表来反映各类用户的需求。用户代表必须参加整个软件开发周期。\n\
    \n- 一旦建立用户组，则必须明确，这些参与者是否真正代表了各个方面的用户，而这些用户的需求是否真正可以促进产品的开发。\n\n- 用户和开发者之间可以有多种渠道来进行信息交互。非直接联系一般是无效的！\
    \ 在用户和开发者之间插入一些中间层，会增加他们之间交流信息时产生错误的可能性的。\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_169_0.png)\n\
    \n图7-1 用户和开发者之间的可能通讯路径\n\n## 4 产品的代表者\n\n- 每一个产品代表者代表了一个特定的用户类，并在那个用户类和开发者之间充当主要接口。产品代表者必须是真正的用户，而并不是用户的代理人。\n\
    - 负责协调他们所代表的用户在需求表达上的不一致性和不兼容性。为那个用户类整理出统一的需求意见。\n- 虽然分析员通常起草需求文档，但需求的收集与整理是分析员和一些核心客户的共同责任。\n\
    - 产品代表者并不是全职，但他们每个星期都要花数个小时在项目研究上\n"
