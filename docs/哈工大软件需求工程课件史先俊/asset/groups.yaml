  - '[PAGE 352]


    # 1 为什么要设定需求的优先级


    +   - 当客户的期望很高、开发时间短并且资源有限时，你必须尽早确定出所交付的产品应具备的最重要的功能。

    +   - 以最少的费用提供产品的最大功能

    +   - 渐增式开发

    +   - 一个项目经理必须权衡合理的项目范围和进度安排、预算、人力资源以及质量目标的约束：当接受一个新的高优先级的 需求或者其它项目环境变化时，删除低优先级的
    需求，或者把它们推迟到下一版本中去实现

    +   - 客户必须指明哪些需求必须包括在首发版中，而哪些需求可以延期实现：设定需求优先级是客户的责任之一'
  - '[PAGE 353]


    +   - 客户和开发者都必须为设定需求的优先级提供信息

    +   - 客户总是让可以给他们带来最大利益的需求享有最高优先级，然而，一旦开发者指出费用、难度、技术风险，或其它与特定需求相关的权衡时，客户可能会觉得他们最初所想的需求似乎变得不必要了

    +   - 开发者也可能认为在早期阶段必须先实现那些优先级较低的功能，因为它们会影响系统的体系结构

    +   - 设定优先级意味着权衡每个需求的业务利益和它的费用，以及它所牵涉到的软件结构基础和产品的未来评价。'
  - '[PAGE 354]


    # 2 不同角色的人处理优先级


    +   - 客户：“我需要所有的特性”，如果用户知道低优先级需求可能不会实现，那么就很难说服用户设定需求的优先级。

    +   - 导致：85%的需求设定为高优先级，10%的需求设定为中等优先级，5%的需求设定为低优先级。

    +   - 开发者：写入SRS的需求，会不遗余力地去实现。不关心考虑何时实现。或过分估计自己能力

    +   - 怎么好：快速软件开发：废除那些不必要的需求并且简化那些不必要的复杂部分'
  - '[PAGE 355]


    # 3 设定优先级的规模


    | 命名 | 意义 |

    | --- | --- |

    | 高 | 一个关键任务的需求；下一版本所要求的 |

    | 中 | 支持必要的系统操作；最终所要求的，但如果有必要的话，可以延迟到下一个版本 |

    | 低 | 功能或质量上的增强；如果资源允许的话，实现这些需求总有一天使产品更完美 |

    | 基本的 | 只有在这些需求上达成一致意见，软件才会被接受 |

    | 条件的 | 实现这些需求将增强产品的性能，但如果忽略这些需求，产品也是可以被接受的 |

    | 可选的 | 一个功能类，实现或不实现均可 |

    | 3 | 必须完美地实现 |

    | 2 | 需要付出努力，但不必做得太完美 |

    | 1 | 可以包含缺陷 |'
