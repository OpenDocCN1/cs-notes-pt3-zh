    # 3 定义质量属性


    +   - 你必须根据用户对系统的期望来确定质量属性。定量地确定重要属性提供了对用户期望的清晰理解，这将有助于设计者提出最合理的解决方案

    +   - 然而，大多数用户并不知道如何回答诸如“互操作性对你的重要性如何？”或者“软件应该具有怎样的可靠性？”等问题'
