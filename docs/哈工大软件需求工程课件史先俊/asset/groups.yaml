  - '[PAGE 30]


    # 2. 每个项目都有需求


    +   - 每个项目都应该有需求

    +     - 开发软件系统最为困难的部分就是准确说明开发什么，最为困难的概念性工作是编写详细技术需求。

    +   - 不适当需求的一些风险

    +     - 比如无足够用户参与、用户需求不断增加、模棱两可的需求、不必要的特性、过于精减等等，会导致开发不顺利甚至失败

    +   - 高质量需求的好处：

    +     - 极大地减少开发后期和整个维护阶段的工作。'
  - '[PAGE 31]


    # 3.不合格的需求


    +   - 1. 无足够用户参与

    +   - 2. 用户需求的不断增加

    +   - 3. 模棱两可的需求

    +   - 4. 不必要的特性

    +   - 5. 过于精简的规格说明

    +   - 6. 忽略了用户分类

    +   - 7. 不准确的计划'
  - '[PAGE 32]


    # 4.高质量需求的好处


    +   - 最大的好处是在开发后期和整个维护阶段的重做的工作大大减少了。

    +   - **Boehm（1981）** 发现要改正在产品付诸应用后所发现的一个需求方面的缺陷比在需求阶段改正这个错误要多付出**68**倍的成本。

    +     近来很多研究表明这种错误导致成本放大因子可以高达**200**倍。

    +   - 收集需求能使开发小组更好地了解市场，而市场因素是任何项目成功的一个关键因素。在产品开发前了解这些比在遭到客户批评后才意识到要节约很多成本。'
  - '[PAGE 33]


    +   - 让用户积极参与需求收集过程能使产品更富有吸引力，而且能拥有忠实的客户关系。通过了解用户的任务需求而不仅仅局限于一些“华丽”的特性，你能避免在无用功能上白耗精力，并且用户的参与能弥补用户期望和开发者实际开发之间的“鸿沟（期望差异）”。

    +   - 将选定系统的需求明确地分配到各软件子系统，强调采用产品工程的系统方法。这样能简化硬软件的集成，也能确保软硬件系统功能匹配适当

    +   - 有效的变更控制和影响分析过程也能降低需求变更带来的负面影响。

    +   - 将需求编写成清晰、无二义性的文档将会极大地有利于系统测试，确保产品质量，以使所有风险承担者感到满意。'
