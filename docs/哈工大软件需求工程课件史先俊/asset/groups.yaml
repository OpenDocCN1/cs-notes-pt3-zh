  md: '

    ## 1 为什么要设定需求的优先级


    - 当客户的期望很高、开发时间短并且资源有限时，你必须尽早确定出所交付的产品应具备的最重要的功能。

    - 以最少的费用提供产品的最大功能

    - 渐增式开发

    - 一个项目经理必须权衡合理的项目范围和进度安排、预算、人力资源以及质量目标的约束：当接受一个新的高优先级的 需求或者其它项目环境变化时，删除低优先级的 需求，或者把它们推迟到下一版本中去实现

    - 客户必须指明哪些需求必须包括在首发版中，而哪些需求可以延期实现：设定需求优先级是客户的责任之一


    - 客户和开发者都必须为设定需求的优先级提供信息

    - 客户总是让可以给他们带来最大利益的需求享有最高优先级，然而，一旦开发者指出费用、难度、技术风险，或其它与特定需求相关的权衡时，客户可能会觉得他们最初所想的需求似乎变得不必要了

    - 开发者也可能认为在早期阶段必须先实现那些优先级较低的功能，因为它们会影响系统的体系结构

    - 设定优先级意味着权衡每个需求的业务利益和它的费用，以及它所牵涉到的软件结构基础和产品的未来评价。


    ## 2 不同角色的人处理优先级


    - 客户：“我需要所有的特性”，如果用户知道低优先级需求可能不会实现，那么就很难说服用户设定需求的优先级。

    - 导致：85%的需求设定为高优先级，10%的需求设定为中等优先级，5%的需求设定为低优先级。

    - 开发者：写入SRS的需求，会不遗余力地去实现。不关心考虑何时实现。或过分估计自己能力

    - 怎么好：快速软件开发：废除那些不必要的需求并且简化那些不必要的复杂部分


    ## 3 设定优先级的规模


    | 命名 | 意义 |

    | --- | --- |

    | 高 | 一个关键任务的需求；下一版本所要求的 |

    | 中 | 支持必要的系统操作；最终所要求的，但如果有必要的话，可以延迟到下一个版本 |

    | 低 | 功能或质量上的增强；如果资源允许的话，实现这些需求总有一天使产品更完美 |

    | 基本的 | 只有在这些需求上达成一致意见，软件才会被接受 |

    | 条件的 | 实现这些需求将增强产品的性能，但如果忽略这些需求，产品也是可以被接受的 |

    | 可选的 | 一个功能类，实现或不实现均可 |

    | 3 | 必须完美地实现 |

    | 2 | 需要付出努力，但不必做得太完美 |

    | 1 | 可以包含缺陷 |


    ## 表13-2 “化学制品跟踪系统” 优先级设计的矩阵范例


    | 相对权值: | 2 | 1 | 1 | 0.5 |

    |---|---|---|---|---|

    | 特性 | 相对利润 | 相对损失 | 总价值 | 价值% | 相对费用 | 费用% | 相对风险 | 风险% | 优先级 |

    | 1. 查询供应商订单的状态 | 5 | 3 | 13 | 8.4 | 2 | 4.8 | 1 | 3.0 | 1.345 |

    | 2. 建立化学制品仓库存货清单报告 | 9 | 7 | 25 | 16.2 | 5 | 11.9 | 3 | 9.1 | 0.987 |

    | 3. 查看一个特定化学制品容器的历史记录 | 5 | 5 | 15 | 9.7 | 3 | 7.1 | 2 | 6.1 | 0.957 |

    | 4. 打印化学制品安全数据表 | 2 | 1 | 5 | 3.2 | 1 | 2.4 | 1 | 3.0 | 0.833 |

    | 5. 维护危险化学制品系列表 | 4 | 9 | 17 | 11.0 | 4 | 9.5 | 4 | 12.1 | 0.708 |

    | 6. 更改未定的化学制品请求 | 4 | 3 | 11 | 7.1 | 3 | 7.1 | 2 | 6.1 | 0.702 |

    | 7. 建立个人实验室存货清单报表 | 6 | 2 | 14 | 9.1 | 4 | 9.5 | 3 | 9.1 | 0.646 |

    | 8. 在供应商目录中查询一个特定的化学制品 | 9 | 8 | 26 | 16.9 | 7 | 16.7 | 8 | 24.2 | 0.586 |

    | 9. 在训练数据库中查询一种危险化学制品训练记录 | 3 | 4 | 10 | 6.5 | 4 | 9.5 | 2 | 6.1 | 0.517 |

    | 10. 从结构绘图工具导入化学制品的结构 | 7 | 4 | 18 | 11.7 | 9 | 21.4 | 7 | 21.2 | 0.365 |

    | 总计 | 54 | 46 | 154 | 100 | 42 | 100 | 33 | 100 | ---- |


    你只能把这个设定优先级的图解应用于非最高优先级的可变动的特性上,一旦分清对于产品交付必不可少的特性，就可以对其它的特性采用此模型来确定其相对优先级


    - **特性：** 与它所提供的价值成正比，而与实现该特性时的费用和技术风险成反比


    - 只有些具有最高的价值／费用比率的特性才应当具有最高的优先级


    ## 怎么做？


    - 1) 在一个平面中列出你要设定优先级的所需需求、特性或使用实例（要一致）

    - 2) 估计每一个特性提供给客户或业务的相关利益-价值，并用 1 ~ 9 划分等级

    - 3) 估计出如果没有把应该实现的特性包括到产品中，将会给客户或业务上带来的损失，使用 1 ~ 9 划分等级

    - 4) 总价值栏是相对利润和相对损失的总和（表中所有利润估价的权值都是损失估价权值的两倍），算出价值%


    - 5) 估计实现每个特性的相对费用，使用 1（低）~ 9（高）划分等级，算出费用百分比：根据需求的复杂度，所需求的用户界面的实现情况、重用当前代码的潜在能力、所需要的测试量和文档等等，开发者可以估算出费用

    - 6) 估计出与每个特性相关的技术或风险相对程度，并利用 1 ~ 9 划分等级，算出风险百分比

    - 7）计算出每一特性的优先级

    + 优先级 = 价值%

    + -----------------------------

    + （费用% × 费用权值） + （风险% × 风险权值）

    - 8) 按计算出的优先级的降序排列列表中的特性


    - 是一种半定量方法，不严密，受估算能力的影响。只能把结果作为一种指导策略。

    - 客户和开发者代表应该讨论整个平面图，从而在评价和优先级排序结果上达成共识


    ## 建议


    - 将本章所描述的设定优先级模型应用于你当前项目中十个或十五个特性或使用实例上。把计算出来的优先级与用其它方法所设定的优先级进行比较，其结果如何？把它们与你凭直觉判断的优先级相比，其结果又如何？

    - 如果模型所描述的优先级与所设想的有不符合之处，分析模型中哪一部分的结果不合理。尝试着对利润、损失、费用和风险应用不同的优先级。调整模型，直到它所提供的结果与你所期望的一致为止。

    - 一旦你校准并调整好设定需求优先级的模型，把它应用于新的项目。把计算出的优先级结合到决策过程之中，并与使用其它设定需求优先级的方法相比较，看是否所得到的结果更能使风险承担者满意。


    ## 软件开发的V字模型


    ![](img/c5c47a9f28f3387f14f39dce6cf9002c_365_0.png)


    ## 需求验证是确定如下内容


    - 软件需求规格说明**正确**描述了预期的系统行为和特征。

    - 从系统需求或其它来源中得到软件需求。

    - 需求是**完整**的和**高质量**的。

    - 所有对需求的看法是**一致**的。

    - 需求为继续进行产品设计、构造和测试提供了足够的基础。


    ## 1 需求评审


    - 非正式评审：把工作产品分发给许多其它的开发人员粗略看一看和走过场似地检查一遍，同时执行者描述产品，且征求意见。


    - 非正式评审对于培养其他人对产品的认识并获得非结构化的反馈是有利的，但非正式评审是非系统化的，不彻底的，或者在实施过程中具有不一致性。可以根据个人爱好方式进行评审。非正式评审不需要记录备案。


    - 正式评审 = 审查：遵循预先定义好的一系列步骤过程。正式评审内容需要记录在案，它包括确定材料、评审员、评审小组对产品是否完整整或是是否需要进一步工作的判定，以及对所发现的错误和所提出的问题的总结。

    - 正式评审小组的成员对评审的质量负责，而开发者则最终对他们所开发的产品 的质量负责

    - 重要的的风险高的需要详细审查，不重要部分只需要用非正式评审就能满足质量要求


    ## 审查过程


    - 1. 参与者


    - 产品的开发者和其可能的同组成员：系统分析员

    - 先前产品的开发者或正在评审的项目规格说明编写者，包括一个系统工程师或系统构造函数、真正的客户

    - 要根据正在审查的文档来开展工作的人们：包括一个开发人员、一个测试人员、一个项目经理和一个用户文档编写人员，这些审查人员将会发现不同类型的问题

    - 限制在7个人左右或者更多

