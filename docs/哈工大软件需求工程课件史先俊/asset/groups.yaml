    # 怎么办？


    +   - 分析员分析出对于不同的用户类可能很重要的属性，并根据每一个属性设计出许多问题。他们利用这些问题询问每一个用户类的代表，可以把每个属性分成一级（不必多加考虑的属性）到五级（极其重要的属性）。这些问题的回答有助于分析员决定哪些质量特性用作设计标准是最重要的。


    +   - 然后，分析员与用户一起为每一属性确定特定的、可测量的和可验证的需求。如果质量目标不可验证，那么就说不清你是否达到这些目标。'
