    - 将需求编写成清晰、无二义性的文档将会极大地有利于系统测试，确保产品质量，以使所有风险承担者感到满意。\n\n## 5 优秀需求具有的特性\n\n- 特性：\n\
    \  - 1、完整性\n  - 2、正确性\n  - 3、可行性\n  - 4、必要性\n  - 5、划分优先级\n  - 6、无二义性\n  - 7、可验证性\n\
    \n## 6 需求的开发和管理\n\n需求工程\n\n需求开发\n\n需求管理\n\n问题获取\n\n分析\n\n编写规格说明\n\n验证\n\n![](img/c5c47a9f28f3387f14f39dce6cf9002c_37_0.png)\n\
    \n## 思考：\n\n- 记录你在当前项目或以前项目中所遇到的与需求相关的问题。指明每一个问题是需求开发问题还是需求管理问题，以及这些问题带来的影响及其产生的根本原因。\n\
    - 与你的组员和其他风险承担者（客户，市场调查人员，项目管理者）一起讨论当前或以前项目中的需求问题，其产生的根源和带来的影响。向所有参与者指明，如果想解决这些困难，必须正视它，大家是否为止做好准备了呢？\n\
    - 整理出对整个项目人员一天训练用的软件需求课程，人员要包括重要的客户，市场人员和管理人员。训练是一种有效的团队学习与合作的方法。大家将会在训练中达成术语与技术上的共识，有利于相互交流沟通与协作。\n\
    \n## 软件需求工程\n\n## Software Requirements Engineering\n\n哈尔滨工业大学软件学院\n\n主讲：史先俊\n\
    \nEmail hitsxj@163.com\n\n## 第二章 客户的需求观\n\n- 干活不由东\n- 累死也无功！\n\n## 例子\n\n- **Contoso**\
    \ 制药公司的高级管理长官 **Gerhard**, 会见 Contoso 公司的信息系统开发小组的新管理员 **Cynthia**。\n- “我们需要建立一套化学制品跟踪信息系统”，\
    \ **Gerhard** 说道。“该系统可以记录库房或某个实验室中已有的化学药品，这样，化学专家可以直接从楼下的某人那里拿到所需的药品，而不必再买一瓶新的。另外，卫生保健部门也得为联邦政府写些关于化学药品的使用报告。你们小组能在五个月内开发出该系统吗？”\n\
    - “我已经明白这个项目的重要性了， **Gerhard**”, **Cynthia** 说, “但在我制定计划前，我们必须收集一些系统的需求。”\n\n\
    - **Gerhard**觉得很奇怪 “你的意思是什么？我不是刚告诉你我的需求了吗？\"\n- “实际上，你只说明了整个项目的概念与目标，” **Cynthia**解释道，“这些高层次的业务需求并不能为我们提供足够的详细信息以确定究竟要开发什么样的软件，以及需要多长时间。我需要一些分析人员与一些知道系统使用要求的化学专家进行讨论，然后才能真正明白达到业务目标所需的各种功能和用户的要求。我们甚至并不需要开发一个新的软件系统，这样可节省许多钱。”\n\
    \n- **Gerhard**此前还从未遇到过与这位系统开发人员类似的看法。“那些化学专家都非常忙”他坚持道，“他们没有时间与你们详细讨论各种细节，你不能让你的手下的人说明要做的系统吗？”\n\
    - **Cynthia**尽力解释从使用新系统的用户处收集需求的合理性。“如果我们只是凭空猜想用户要求，结果不会令人满意。我们只是软件开发人员，而并非化学专家。我们并不能真正明白化学专家们需要这个化学制品跟踪系统做些什么。我曾经尝试过，未真正明白这些问题就匆忙开始编码，结果没有人对产品满意。”\n\
    - “行了，行了，我们没有那么多时间”**Gerhard**坚持道。“我来告诉你需求，请马上开始开发系统。随时将你们的进展情况告诉我。”\n"
