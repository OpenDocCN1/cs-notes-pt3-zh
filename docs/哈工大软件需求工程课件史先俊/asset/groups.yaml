    +   3) 需求规格说明的完整性和正确性

    +   - 以用户的任务为中心，应用使用实例技术获取需求。

    +   - 根据不同的使用情景编写需求测试用例，建立原型，使需求对用户来说更加直观，

    +   - 同时获取用户的反馈信息。让客户代表对需求规格说明和分析模型进行正式的评审。


