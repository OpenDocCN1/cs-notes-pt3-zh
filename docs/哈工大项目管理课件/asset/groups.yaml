    # Mapping the Process Groups to the Knowledge Areas


    +   - You can map the main activities of each PM process group into the nine knowledge
    areas by using the *PMBOK® Guide 2004*.

    +   - Note that there are activities from _each_ knowledge area under the planning
    process group.

    +   - All initiating activities are part of the project integration management
    knowledge area.'
  - '[PAGE 83]


    # Table 5-1. Relationships Among Process Groups and Knowledge Areas


    | KNOWLEDGE AREA | PROJECT MANAGEMENT PROCESS GROUPS |  |  |  |  |

    |---|---|---|---|---|---|

    | | INITIATING | PLANNING | EXECUTING | MONITORING & CONTROLLING | CLOSING |

    | Project Integration Management | Develop project charter, Develop preliminary
    project scope statement | Develop project management plan | Direct and manage
    project execution | Monitor and control project work, Integrated change control
    | Close project |

    | Project Scope Management |  | Scope planning, Scope definition, Create WBS |  |
    Scope verification, Scope control |  |

    | Project Time Management |  | Activity definition, Activity sequencing, Activity
    resource estimating, Activity duration estimating, Schedule development |  | Schedule
    control |  |

    | Project Cost Management |  | Cost estimating, Cost budgeting |  | Cost control
    |  |

    | *PMBOK® Guide 2004, p. 69* |  |  |  |  |  |'
