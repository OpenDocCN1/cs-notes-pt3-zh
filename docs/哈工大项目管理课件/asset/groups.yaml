  - '[PAGE 487]


    # Learning Objectives


    +   - Understand the importance of project procurement management and the increasing
    use of outsourcing for information technology projects.

    +   - Describe the work involved in planning purchases and acquisitions for projects,
    the contents of a procurement management plan and contract statement of work,
    and calculations involved in a make-or-buy analysis.

    +   - Discuss what is involved in planning contracting, including the creation
    of various procurement documents and evaluation criteria for sellers.'
  - '[PAGE 488]


    # Learning Objectives (cont’d)


    +   - Understand the process of requesting seller responses and the difference
    between proposals and bids.

    +   - Describe the seller selection process and recognize different approaches
    for evaluating proposals or selecting suppliers.

    +   - Discuss the importance of good contract administration.

    +   - Describe the contract closure process.

    +   - Discuss types of software available to assist in project procurement management.'
  - '[PAGE 489]


    # Importance of Project Procurement Management


    +   - **Procurement** means acquiring goods and/or services from an outside source.

    +   - Other terms include purchasing and outsourcing.

    +   - Experts predict that global spending on computer software and services will
    continue to grow.

    +   - India is the leading country for U.S. offshore outsourcing.'
  - '[PAGE 490]


    # Debates on Outsourcing


    +   - Some companies, such as Wal-Mart, prefer to do no outsourcing at all, while
    others do a lot of outsourcing.

    +   - Most organizations do some form of outsourcing to meet their IT needs and
    spend most money within their own country.

    +   - The U.S. temporary workforce continues to grow as people work for temporary
    job agencies so they can more easily move from company to company.'
  - '[PAGE 491]


    # Why Outsource?


    +   - To reduce both fixed and recurrent costs.

    +   - To allow the client organization to focus on its core business.

    +   - To access skills and technologies.

    +   - To provide flexibility.

    +   - To increase accountability.'
  - '[PAGE 492]


    # Contracts


    +   - A **contract** is a mutually binding agreement that obligates the seller
    to provide the specified products or services and obligates the buyer to pay for
    them.

    +   - Contracts can clarify responsibilities and sharpen focus on key deliverables
    of a project.

    +   - Because contracts are legally binding, there is more accountability for
    delivering the work as stated in the contract.

    +   - A recent trend in outsourcing is the increasing size of contracts.'
  - '[PAGE 493]


    # Project Procurement Management Processes


    +   - **Project procurement management**: Acquiring goods and services for a project
    from outside the performing organization.

    +   - Processes include:

    +     - **Planning purchases and acquisitions**: Determining what to procure,
    when, and how.

    +     - **Planning contracting**: Describing requirements for the products or
    services desired from the procurement and identifying potential sources or **sellers**
    (contractors, suppliers, or providers who provide goods and services to other
    organizations).'
