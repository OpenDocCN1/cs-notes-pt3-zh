  - '[PAGE 4]


    # Introduction


    +   - Many organizations today have a new or renewed interest in project management.

    +   - Computer hardware, software, networks, and the use of interdisciplinary
    and global work teams have radically changed the work environment.

    +   - The U.S. spends $2.3 trillion on projects every year, or one-quarter its
    gross domestic product, and the world as a whole spends nearly $10 trillion of
    its $40.7 gross product on projects of all kinds.*


    *PMI, *The PMI Project Management Fact Book*, Second Edition, 2001.'
  - '[PAGE 5]


    # Project Management Statistics


    +   - Worldwide IT spending continues to grow, and Forrester Research predicts
    that U.S. IT spending will grow by another 5.7 percent in 2005, to reach $795
    billion.*

    +   - In 2003, the average senior project manager in the U.S. earned almost $90,000
    per year, and the average Project Management Office (PMO) Director earned more
    than the average Chief Information Officer ($118,633 vs. $103,925).**

    +   - *The Apprentice*, the number-one U.S. reality television show in 2004, portrayed
    the important role of project managers.


    *Butler, Steve, “IT Spending,” Analyst Views, February 2004.

    **PMI, Project Management Salary Survey, Third Edition, 2003.'
  - '[PAGE 6]


    # Motivation for Studying Information Technology (IT) Project Management


    +   - IT projects have a terrible track record.

    +     - A 1995 Standish Group study (CHAOS) found that only 16.2 percent of IT
    projects were successful in meeting scope, time, and cost goals.

    +     - Over 31 percent of IT projects were canceled before completion, costing
    over $81 billion in the U.S. alone.*


    *The Standish Group, “The CHAOS Report” (www.standishgroup.com) (1995). Another
    reference is Johnson, Jim, “CHAOS: The Dollar Drain of IT Project Failures,” Application
    Development Trends (January 1995).'
  - '[PAGE 7]


    # Advantages of Using Formal Project Management


    +   - Better control of financial, physical, and human resources.

    +   - Improved customer relations.

    +   - Shorter development times.

    +   - Lower costs.

    +   - Higher quality and increased reliability.

    +   - Higher profit margins.

    +   - Improved productivity.

    +   - Better internal coordination.

    +   - Higher worker morale (less stress).'
  - '[PAGE 8]


    # What Is a Project?


    +   - A **project** is “a temporary endeavor undertaken to create a unique product,
    service, or result.”*

    +   - Operations is work done to sustain the business.

    +   - A project ends when its objectives have been reached, or the project has
    been terminated.

    +   - Projects can be large or small and take a short or long time to complete.


    *PMI, *A Guide to the Project Management Body of Knowledge (PMBOK® Guide)* (2004),
    p. 5.'
  - '[PAGE 9]


