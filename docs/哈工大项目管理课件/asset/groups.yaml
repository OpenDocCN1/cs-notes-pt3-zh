  mdcn: "\n## Typical Problems with IT\n### Cost Estimates\n- Developing an estimate\
    \ for a large software project is a complex task that requires a significant amount\
    \ of effort.\n- People who develop estimates often do not have much experience.\n\
    - Human beings are biased toward underestimation.\n- Management might ask for\
    \ an estimate, but really desire a bid to win a major contract or get internal\
    \ funding.\n\n## Sample Cost Estimate\n- See pages 262-266 for a detailed example\
    \ that describes how to create a cost estimate for the Surveyor Pro project described\
    \ in the opening case.\n- Before creating an estimate, know what it will be used\
    \ for, gather as much information about the project as possible, and clarify the\
    \ ground rules and assumptions for the estimate.\n- If possible, estimate costs\
    \ by major WBS categories.\n- Create a cost model to make it easy to change and\
    \ document the estimate.\n\n## Figure 7-2. Surveyor Pro Software Development Estimate\n\
    Surveyor Pro Software Development Estimate Created October 5, 2006\n\n| 1. Labor\
    \ Estimate | # Units/Hrs. | Cost/Unit/Hr. | Subtotals | Calculations |\n| Contractor\
    \ labor estimate | 3000 | $150 | $450,000 | 3000*150 |\n| Project team member\
