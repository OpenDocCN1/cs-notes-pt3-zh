  - '[PAGE 259]


    # Cost Control


    +   - Project cost control includes:

    +     - Monitoring cost performance.

    +     - Ensuring that only appropriate project changes are included in a revised
    cost baseline.

    +     - Informing project stakeholders of authorized changes to the project that
    will affect costs.


    +   - Many organizations around the globe have problems with cost control.'
  - '[PAGE 260]


    # Media Snapshot


    +   - **Australia**: Problems with the installation of an ERP system at Crane
    Group Ltd. led to an estimated cost overrun of $11.5 million.*

    +   - **India**: As many as 274 projects currently under implementation in the
    Central sector are suffering serious cost and time overruns.**

    +   - **Pakistan**: Pakistan has sustained a cost overrun of Rs 1.798 billion
    (over $30 million U.S. dollars) in the execution of the 66.5 megawatt Jagran Hydropower
    Project in the Neelum Valley.***

    +   - **United States**: Northern California lawmakers were outraged over Governor
    Arnold Schwarzenegger''s announcement that commuters should have to pay construction
