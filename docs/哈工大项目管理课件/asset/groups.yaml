    # Maslow’s Hierarchy of Needs


    +   - Abraham Maslow argued that human beings possess unique qualities that enable
    them to make independent choices, thus giving them control of their destiny.

    +   - Maslow developed a **hierarchy of needs**, which states that people’s behaviors
    are guided or motivated by a sequence of needs.'
