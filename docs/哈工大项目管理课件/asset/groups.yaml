  - '[PAGE 62]


    # Importance of Top Management Commitment


    Several studies cite top management commitment as one of the key factors associated
    with project success.


    Top management can help project managers:


    +   • Secure adequate resources.

    +   • Get approval for unique project needs in a timely manner.

    +   • Receive cooperation from people throughout the organization.

    +   • Learn how to be better leaders.'
  - '[PAGE 63]


    # Need for Organizational Commitment to Information Technology (IT)


    +   - If the organization has a negative attitude toward IT, it will be difficult
    for an IT project to succeed.

    +   - Having a Chief Information Officer (CIO) at a high level in the organization
    helps IT projects.

    +   - Assigning non-IT people to IT projects also encourages more commitment.'
  - '[PAGE 64]


    # Need for Organizational Standards


    +   - Standards and guidelines help project managers be more effective.

    +   - Senior management can encourage:

    +     - The use of standard forms and software for project management.

    +     - The development and use of guidelines for writing project plans or providing
    status information.

    +     - The creation of a project management office or center of excellence.'
  - '[PAGE 65]


    # Project Phases and the Project Life Cycle


    +   - **A project life cycle** is a collection of project phases that defines:

    +     - What work will be performed in each phase.

    +     - What deliverables will be produced and when.

    +     - Who is involved in each phase.

    +     - How management will control and approve work produced in each phase.

    +   - **A deliverable** is a product or service produced or provided as part of
    a project.'
  - '[PAGE 66]


    # More on Project Phases


    +   - In the early phases of a project life cycle:

    +     - Resource needs are usually lowest.

    +     - The level of uncertainty (risk) is highest.

    +     - Project stakeholders have the greatest opportunity to influence the project.

    +   - In the middle phases of a project life cycle:

    +     - The certainty of completing a project increases.

    +     - More resources are needed.

    +   - In the final phase of a project life cycle:

    +     - The focus is on ensuring that project requirements were met.

    +     - The sponsor approves completion of the project.'
  - '[PAGE 67]


    # Figure 2-3. Phases of the Traditional Project Life Cycle


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_67_0.png)'
  - '[PAGE 68]


    # Product Life Cycles


    +   - Products also have life cycles.

    +   - A **systems development life cycle (SDLC)** is a framework for describing
    the phases involved in developing information systems.

    +   - Systems development projects can follow:

    +     - **Predictive life cycle:** The scope of the project can be clearly articulated
    and the schedule and cost can be predicted.

    +     - **Adaptive Software Development (ASD) life cycle:** Projects are mission
    driven and component based, and use time-based cycles to meet target dates.'
  - '[PAGE 69]


    # Predictive Life Cycle Models


    +   - **Waterfall model**: Has well-defined, linear stages of systems development
    and support.

    +   - **Spiral model**: Shows that software is developed using an iterative or
    spiral approach rather than a linear approach.

    +   - **Incremental build model**: Provides for progressive development of operational
    software.

    +   - **Prototyping model**: Used for developing prototypes to clarify user requirements.

    +   - **Rapid Application Development (RAD) model**: Used to produce systems quickly
    without sacrificing quality.'
  - '[PAGE 70]


    # Adaptive Life Cycle Models


    +   - **Extreme programming (XP)**: Developers program in pairs and must write
    the tests for their own code. XP teams include developers, managers, and users.

    +   - **Scrum**: Iterative development in which repetitions are referred to as
    sprints, which normally last thirty days. Teams often meet each day for a short
    meeting, called a scrum, to decide what to accomplish that day. Works best for
    object-oriented technology projects and require strong leadership to coordinate
    the work.'
  - '[PAGE 71]


