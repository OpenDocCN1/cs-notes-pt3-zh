  - '[PAGE 21]


    # Improved Project Performance


    +   - The Standish Group’s CHAOS studies show improvements in IT projects in the
    past decade.*


    | Measure | 1994 Data | 2002 Data | Result |

    |---|---|---|---|

    | Successful projects | 16% | 34% | Doubled |

    | Failed projects | 31% | 15% | Halved |

    | Money wasted on challenged and failed projects | $140 B out of $250 B | $55
    B out of $255 B | More than halved |


    > *The Standish Group, “Latest Standish Group CHAOS Report Shows Project Success
    Rates Have Improved by 50%” (March 25, 2003).'
  - '[PAGE 22]


    # Why the Improvements?


    > “The reasons for the increase in successful projects vary. First, the average
    cost of a project has been more than cut in half. Better tools have been created
    to monitor and control progress and **better skilled project managers with better
    management processes** are being used. The fact that there are processes is significant
    in itself.”*


    *The Standish Group, “CHAOS 2001: A Recipe for Success” (2001).'
  - '[PAGE 23]


    # Project Success Factors*


    +   1. Executive support

    +   2. User involvement

    +   3. Experienced project manager

    +   4. Clear business objectives

    +   5. Minimized scope

    +   6. Standard software infrastructure

    +   7. Firm basic requirements

    +   8. Formal methodology

    +   9. Reliable estimates

    +   10. Other criteria, such as small milestones, proper planning, competent staff,
    and ownership


    *The Standish Group, “Extreme CHAOS” (2001).'
  - '[PAGE 24]


    # What the Winners Do*


    +   - Recent research findings show that companies that excel in project delivery
    capability:

    +     - Use an integrated project management toolbox that includes standard and
    advanced tools and lots of templates.

    +     - Grow project leaders, emphasizing business and soft skills.

    +     - Develop a streamlined project delivery process.

    +     - Measure project health using metrics, including customer satisfaction
    and return on investment.


    > *Milosevic, Dragan and And Ozbay, “Delivering Projects: What the Winners Do,”
    Proceedings of the Project Management Institute Annual Seminars & Symposium (November
    2001).'
