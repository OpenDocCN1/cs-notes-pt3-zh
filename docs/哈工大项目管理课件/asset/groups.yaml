    # Individual Work Styles and Cultural Differences Cause Schedule Conflicts


    +   - One dimension of the Myers-Briggs Type Indicator focuses on people''s attitudes
    toward structure and deadline.


    +   - Some people prefer to follow schedules and meet deadlines while others do
    not.


    +   - Different cultures and even entire countries have different attitudes about
    schedules.'
  - '[PAGE 188]


    # Media Snapshot


    In contrast to the 2002 Salt Lake City Winter Olympic Games (see Chapter 4’s “Media
    Snapshot”), planning and scheduling was very different for the 2004 Summer Olympic
    Games held in Athens, Greece. Many articles were written before the opening ceremonies
    predicting that the facilities would not be ready in time…Many people were pleasantly
    surprised by the amazing opening ceremonies, beautiful new buildings, and state-of-the-art
    security and transportation systems in Athens.


    The Greeks even made fun of critics by having construction workers pretend to
    still be working as the ceremonies began.'
  - '[PAGE 189]


    # Project Time Management Processes


    +   - **Activity definition**: Identifying the specific activities that the project
    team members and stakeholders must perform to produce the project deliverables.

    +   - **Activity sequencing**: Identifying and documenting the relationships between
    project activities.

    +   - **Activity resource estimating**: Estimating how many resources a project
    team should use to perform project activities.

    +   - **Activity duration estimating**: Estimating the number of work periods
    that are needed to complete individual activities.

    +   - **Schedule development**: Analyzing activity sequences, activity resource
    estimates, and activity duration estimates to create the project schedule.

    +   - **Schedule control**: Controlling and managing changes to the project schedule.'
  - '[PAGE 190]


    <!-- no content -->'
  - '[PAGE 191]


    # Activity Lists and Attributes


    An activity list is a tabulation of activities to be included on a project schedule.
    The list should include:


    +   - The activity name

    +   - An activity identifier or number

    +   - A brief description of the activity


    Activity attributes provide more information about each activity, such as predecessors,
    successors, logical relationships, leads and lags, resource requirements, constraints,
    imposed dates, and assumptions related to the activity.'
  - '[PAGE 192]


    # Milestones


    +   - A **milestone** is a significant event that normally has no duration.

    +   - It often takes several activities and a lot of work to complete a milestone.

    +   - Milestones are useful tools for setting schedule goals and monitoring progress.

    +   - Examples include completion and customer sign-off on key documents and completion
    of specific products.'
  - '[PAGE 193]


    # Activity Sequencing


    +   - Involves reviewing activities and determining dependencies.

    +   - A **dependency** or **relationship** relates to the sequencing of project
    activities or tasks.

    +   - You *must* determine dependencies in order to use critical path analysis.'
  - '[PAGE 194]


    # Three Types of Dependencies


    +   - **Mandatory dependencies**: Inherent in the nature of the work being performed
    on a project; sometimes referred to as hard logic.

    +   - **Discretionary dependencies**: Defined by the project team; sometimes referred
    to as soft logic and should be used with care because they may limit later scheduling
    options.

    +   - **External dependencies**: Involve relationships between project and non-project
    activities.'
  md: '

    ## Importance of Project Schedules


    - Managers often cite delivering projects on time as one of their biggest challenges.

    - Fifty percent of IT projects were challenged in the 2003 CHAOS study, and their
    average time overrun increased to 82 percent from a low of 63 percent in 2000.*

    - Schedule issues are the main reason for conflicts on projects, especially during
    the second half of projects.

    - Time has the least amount of flexibility; it passes no matter what happens on
    a project.


    *The Standish Group, “Latest Standish Group CHAOS Report Shows Project Success
    Rates Have Improved by 50%,” (www.standishgroup.com) (March 25, 2003).


    ## Individual Work Styles and Cultural Differences Cause Schedule Conflicts


    - One dimension of the Myers-Briggs Type Indicator focuses on people''s attitudes
    toward structure and deadline.


    - Some people prefer to follow schedules and meet deadlines while others do not.


    - Different cultures and even entire countries have different attitudes about
    schedules.


    ## Media Snapshot


    In contrast to the 2002 Salt Lake City Winter Olympic Games (see Chapter 4’s “Media
    Snapshot”), planning and scheduling was very different for the 2004 Summer Olympic
    Games held in Athens, Greece. Many articles were written before the opening ceremonies
    predicting that the facilities would not be ready in time…Many people were pleasantly
    surprised by the amazing opening ceremonies, beautiful new buildings, and state-of-the-art
    security and transportation systems in Athens.


    The Greeks even made fun of critics by having construction workers pretend to
    still be working as the ceremonies began.


    ## Project Time Management Processes


    - **Activity definition**: Identifying the specific activities that the project
    team members and stakeholders must perform to produce the project deliverables.

    - **Activity sequencing**: Identifying and documenting the relationships between
    project activities.

    - **Activity resource estimating**: Estimating how many resources a project team
    should use to perform project activities.

    - **Activity duration estimating**: Estimating the number of work periods that
    are needed to complete individual activities.

    - **Schedule development**: Analyzing activity sequences, activity resource estimates,
    and activity duration estimates to create the project schedule.

    - **Schedule control**: Controlling and managing changes to the project schedule.


    ## Activity Lists and Attributes


    An activity list is a tabulation of activities to be included on a project schedule.
    The list should include:


    - The activity name

    - An activity identifier or number

    - A brief description of the activity


    Activity attributes provide more information about each activity, such as predecessors,
    successors, logical relationships, leads and lags, resource requirements, constraints,
    imposed dates, and assumptions related to the activity.


    ## Milestones


    - A **milestone** is a significant event that normally has no duration.

    - It often takes several activities and a lot of work to complete a milestone.

    - Milestones are useful tools for setting schedule goals and monitoring progress.

    - Examples include completion and customer sign-off on key documents and completion
    of specific products.


    ## Activity Sequencing


    - Involves reviewing activities and determining dependencies.

    - A **dependency** or **relationship** relates to the sequencing of project activities
    or tasks.

    - You *must* determine dependencies in order to use critical path analysis.


    ## Three Types of Dependencies


    - **Mandatory dependencies**: Inherent in the nature of the work being performed
    on a project; sometimes referred to as hard logic.

    - **Discretionary dependencies**: Defined by the project team; sometimes referred
    to as soft logic and should be used with care because they may limit later scheduling
    options.

    - **External dependencies**: Involve relationships between project and non-project
    activities.

    '
