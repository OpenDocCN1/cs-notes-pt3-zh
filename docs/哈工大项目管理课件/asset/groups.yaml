  - '[PAGE 185]


    # Importance of Project Schedules


    +   - Managers often cite delivering projects on time as one of their biggest
    challenges.

    +   - Fifty percent of IT projects were challenged in the 2003 CHAOS study, and
    their average time overrun increased to 82 percent from a low of 63 percent in
    2000.*

    +   - Schedule issues are the main reason for conflicts on projects, especially
    during the second half of projects.

    +   - Time has the least amount of flexibility; it passes no matter what happens
    on a project.


    *The Standish Group, “Latest Standish Group CHAOS Report Shows Project Success
    Rates Have Improved by 50%,” (www.standishgroup.com) (March 25, 2003).'
