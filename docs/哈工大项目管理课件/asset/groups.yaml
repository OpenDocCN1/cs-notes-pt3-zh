  - '[PAGE 1]


    # Learning Objectives


    +   - Understand the growing need for better project management, especially for
    information technology projects.

    +   - Explain what a project is, provide examples of information technology projects,
    list various attributes of projects, and describe the triple constraint of projects.'
  - '[PAGE 2]


    # Learning Objectives


    +   - Describe project management and discuss key elements of the project management
    framework, including project stakeholders, the project management knowledge areas,
    common tools and techniques, and project success factors.

    +   - Understand the role of the project manager by describing what project managers
    do, what skills they need, and what the career field is like for information technology
    project managers.'
