    \ accountability.\n\n### Contracts\n\n- A **contract** is a mutually binding agreement\
    \ that obligates the seller to provide the specified products or services and\
    \ obligates the buyer to pay for them.\n- Contracts can clarify responsibilities\
    \ and sharpen focus on key deliverables of a project.\n- Because contracts are\
    \ legally binding, there is more accountability for delivering the work as stated\
    \ in the contract.\n- A recent trend in outsourcing is the increasing size of\
    \ contracts.\n\n### Project Procurement Management Processes\n\n- **Project procurement\
    \ management**: Acquiring goods and services for a project from outside the performing\
    \ organization.\n- Processes include:\n    - **Planning purchases and acquisitions**:\
    \ Determining what to procure, when, and how.\n    - **Planning contracting**:\
    \ Describing requirements for the products or services desired from the procurement\
    \ and identifying potential sources or **sellers** (contractors, suppliers, or\
    \ providers who provide goods and services to other organizations).\n"
  mdcn: "\n### Using Software to Assist in Project Risk Management\n\n- Risk registers\
    \ can be created in a simple Word or Excel file or as part of a database.\n- More\
    \ sophisticated risk management software, such as Monte Carlo simulation tools,\
    \ help in analyzing project risks.\n- The PMI Risk Specific Interest Group’s Web\
    \ site at *www.risksig.com* has a detailed list of software products to assist\
    \ in risk management.\n\n### Results of Good Project Risk Management\n\n- Unlike\
    \ crisis management, good project risk management often goes unnoticed.\n- Well-run\
    \ projects appear to be almost effortless, but a lot of work goes into running\
    \ a project well.\n- Project managers should strive to make their jobs look easy\
    \ to reflect the results of well-run projects.\n\n### Chapter Summary\n\n- Project\
    \ risk management is the art and science of identifying, analyzing, and responding\
    \ to risk throughout the life of a project and in the best interests of meeting\
    \ project objectives.\n- Main processes include:\n    - Risk management planning\n\
    \    - Risk identification\n    - Qualitative risk analysis\n    - Quantitative\
    \ risk analysis\n    - Risk response planning\n    - Risk monitoring and control\n\
    \n## Chapter 12: Project Procurement Management\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_486_0.png)\n\
    \nInformation Technology Project Management, Fourth Edition\n\n### Learning Objectives\n\
    \n- Understand the importance of project procurement management and the increasing\
    \ use of outsourcing for information technology projects.\n- Describe the work\
    \ involved in planning purchases and acquisitions for projects, the contents of\
    \ a procurement management plan and contract statement of work, and calculations\
    \ involved in a make-or-buy analysis.\n- Discuss what is involved in planning\
    \ contracting, including the creation of various procurement documents and evaluation\
    \ criteria for sellers.\n\n### Learning Objectives (cont’d)\n\n- Understand the\
    \ process of requesting seller responses and the difference between proposals\
    \ and bids.\n- Describe the seller selection process and recognize different approaches\
    \ for evaluating proposals or selecting suppliers.\n- Discuss the importance of\
    \ good contract administration.\n- Describe the contract closure process.\n- Discuss\
    \ types of software available to assist in project procurement management.\n\n\
    ### Importance of Project Procurement Management\n\n- **Procurement** means acquiring\
    \ goods and/or services from an outside source.\n- Other terms include purchasing\
    \ and outsourcing.\n- Experts predict that global spending on computer software\
    \ and services will continue to grow.\n- India is the leading country for U.S.\
    \ offshore outsourcing.\n\n### Debates on Outsourcing\n\n- Some companies, such\
    \ as Wal-Mart, prefer to do no outsourcing at all, while others do a lot of outsourcing.\n\
    - Most organizations do some form of outsourcing to meet their IT needs and spend\
    \ most money within their own country.\n- The U.S. temporary workforce continues\
    \ to grow as people work for temporary job agencies so they can more easily move\
    \ from company to company.\n\n### Why Outsource?\n\n- To reduce both fixed and\
    \ recurrent costs.\n- To allow the client organization to focus on its core business.\n\
    - To access skills and technologies.\n- To provide flexibility.\n- To increase\
    \ accountability.\n\n### Contracts\n\n- A **contract** is a mutually binding agreement\
    \ that obligates the seller to provide the specified products or services and\
    \ obligates the buyer to pay for them.\n- Contracts can clarify responsibilities\
    \ and sharpen focus on key deliverables of a project.\n- Because contracts are\
    \ legally binding, there is more accountability for delivering the work as stated\
    \ in the contract.\n- A recent trend in outsourcing is the increasing size of\
    \ contracts.\n\n### Project Procurement Management Processes\n\n- **Project procurement\
    \ management**: Acquiring goods and services for a project from outside the performing\
    \ organization.\n- Processes include:\n    - **Planning purchases and acquisitions**:\
    \ Determining what to procure, when, and how.\n    - **Planning contracting**:\
    \ Describing requirements for the products or services desired from the procurement\
    \ and identifying potential sources or **sellers** (contractors, suppliers, or\
    \ providers who provide goods and services to other organizations).\n"
