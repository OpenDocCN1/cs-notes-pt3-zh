  - '[PAGE 176]


    # Scope Control


    +   - **Scope control** involves controlling changes to the project scope.

    +   - Goals of scope control are to:

    +     - Influence the factors that cause scope changes.

    +     - Ensure changes are processed according to procedures developed as part
    of integrated change control.

    +     - Manage changes when they occur.

    +   - **Variance** is the difference between planned and actual performance.'
  - '[PAGE 177]


    # Suggestions for Improving User Input


    +   Develop a good project selection process and insist that sponsors are from
    the user organization.


    +   Place users on the project team in important roles.


    +   Hold regular meetings with defined agendas, and have users sign off on key
    deliverables presented at meetings.


    +   Deliver something to users and sponsors on a regular basis.


    +   Don’t promise to deliver when you know you can’t.


    +   Co-locate users with developers.'
  - '[PAGE 178]


    # Suggestions for Reducing Incomplete and Changing Requirements


    +   - Develop and follow a requirements management process.

    +   - Use techniques such as prototyping, use case modeling, and JAD to get more
    user involvement.

    +   - Put requirements in writing and keep them current.

    +   - Create a requirements management database for documenting and controlling
    requirements.'
  - '[PAGE 179]


    # Suggestions for Reducing Incomplete and Changing Requirements (cont’d)


    +   - Conduct adequate testing throughout the project life cycle.

    +   - Review changes from a systems perspective.

    +   - Emphasize completion dates to help focus on what’s most important.

    +   - Allocate resources specifically for handling change requests and enhancements
    (as NWA did with ResNet).'
  - '[PAGE 180]


    # Using Software to Assist in Project Scope Management


    +   - Word-processing software helps create scope-related documents.

    +   - Spreadsheets help perform financial calculations and weighed scoring models,
    and help develop charts and graphs.

    +   - Communication software, such as e-mail and the Web, helps clarify and communicate
    scope information.

    +   - Project management software helps create a WBS, the basis for tasks on a
    Gantt chart.

    +   - Specialized software is available to assist in project scope management.'
