    \ for allowable performance costs plus a fixed fee payment usually based on a\
    \ percentage of estimated costs.\n- **Cost plus percentage of costs (CPPC)**:\
    \ The buyer pays the supplier for allowable performance costs plus a predetermined\
    \ percentage based on total costs.\n\n**Figure 12-2. Contract Types Versus Risk**\n\
    \n![](img/1db87b9b55fa1232e052e0dffad9e0c7_502_0.png)\n\n## Contract Clauses\n\
