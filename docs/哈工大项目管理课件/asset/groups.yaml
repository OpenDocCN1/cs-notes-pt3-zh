    \ did by using a unit pricing strategy for a large office automation project.\n\
    \n## Tools and Techniques for Planning Purchases and Acquisitions\n\n- **Make-or-buy\
    \ analysis**: General management technique used to determine whether an organization\
    \ should make or perform a particular product or service inside the organization\
    \ or buy from someone else.\n- Often involves financial analysis.\n- Experts,\
    \ both internal and external, can provide valuable inputs in procurement decisions.\n\
    \n## Make-or-Buy Example\n\n- Assume you can lease an item you need for a project\
    \ for $800/day. To purchase the item, the cost is $12,000 plus a daily operational\
    \ cost of $400/day.\n- How long will it take for the purchase cost to be the same\
    \ as the lease cost?\n\n## Make-or-Buy Solution\n\n- Set up an equation so both\
    \ options, purchase and lease, are equal.\n- In this example, use the following\
    \ equation. Let *d* be the number of days to use the item:\n  $12,000 + $400d\
    \ = $800d\n  Subtracting $400d from both sides, you get:\n  $12,000 = $400d\n\
    \  Dividing both sides by $400, you get:\n  d = 30\n- If you need the item for\
