  - '[PAGE 513]


    # Seller Selection Process


    +   - Organizations often do an initial evaluation of all proposals and bids and
    then develop a short list of potential sellers for further evaluation.

    +   - Sellers on the short list often prepare a best and final offer (BAFO).

    +   - Final output is a contract signed by the buyer and the selected seller.'
  - '[PAGE 514]


    # Media Snapshot


    +   - Many organizations realize that selecting appropriate sellers can often
    provide a win-win situation.

    +   - Several companies, including those owned by famous celebrities, work closely
    with outside sources to help both parties come out ahead.

    +   - For example, Oprah Winfrey celebrated the premiere of her show’s nineteenth
    season by giving each of her 276 audience members a new car that was donated by
    Pontiac.'
  - '[PAGE 515]


    # Administering the Contract


    +   - Ensures that the seller’s performance meets contractual requirements.

    +   - Contracts are legal relationships, so it is important that legal and contracting
    professionals be involved in writing and administering contracts.

    +   - Many project managers ignore contractual issues, which can result in serious
    problems.'
  - '[PAGE 516]


    # Suggestions for Change Control in Contracts


    +   - Changes to any part of the project need to be reviewed, approved, and documented
    by the same people in the same way that the original part of the plan was approved.

    +   - Evaluation of any change should include an impact analysis. How will the
    change affect the scope, time, cost, and quality of the goods or services being
    provided?

    +   - Changes must be documented in writing. Project team members should also
    document all important meetings and telephone phone calls.'
  - '[PAGE 517]


    # Suggestions for Change Control in Contracts (cont’d)


    +   - Project managers and teams should stay closely involved to make sure the
    new system will meet business needs and work in an operational environment.

    +   - Have backup plans.

    +   - Use tools and techniques, such as a contract change control system, buyer-conducted
    performance reviews, inspections and audits, and so on.'
  - '[PAGE 518]


    # Closing the Contract


    +   - Involves completing and settling contracts and resolving any open items.

    +   - The project team should:

    +     - Determine if all work was completed correctly and satisfactorily.

    +     - Update records to reflect final results.

    +     - Archive information for future use.

    +   - The contract itself should include requirements for formal acceptance and
    closure.'
  - '[PAGE 519]


    # Tools to Assist in Contract Closure


    +   - Procurement audits identify lessons learned in the procurement process.

    +   - A records management system provides the ability to easily organize, find,
    and archive procurement-related documents.'
  - '[PAGE 520]


    # Using Software to Assist in

    Project Procurement

    Management


    +   - Word processing software helps write proposals and contracts, spreadsheets
    help evaluate suppliers, databases help track suppliers, and presentation software
    helps present procurement-related information.

    +   - E-procurement software does many procurement functions electronically.

    +   - Organizations also use other Internet tools to find information on suppliers
    or auction goods and services.'
  - '[PAGE 521]


    # Chapter Summary


    +   - Project procurement management involves acquiring goods and services for
    a project from outside the performing organization.

    +   - Processes include:

    +     - Planning purchases and acquisitions

    +     - Planning contracting

    +     - Requesting seller responses

    +     - Selecting sellers

    +     - Administering contracts

    +     - Closing contracts'
