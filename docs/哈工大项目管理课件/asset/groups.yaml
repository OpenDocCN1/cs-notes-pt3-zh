  - '[PAGE 81]


    # Media Snapshot


    Just as information technology projects need to follow the project management
    process groups, so do other projects, such as the production of a movie. Processes
    involved in making movies might include screenwriting (initiating), producing
    (planning), acting and directing (executing), editing (monitoring and controlling),
    and releasing the movie to theaters (closing). Many people enjoy watching the
    extra features on a DVD that describe how these processes lead to the creation
    of a movie…This acted “...not as promotional filler but as a serious and meticulously
    detailed examination of the entire filmmaking process.”* Project managers in any
    field know how important it is to follow a good process.


    *Jacks, Brian, “Lord of the Rings: The Two Towers Extended Edition (New Line),”
    Underground Online (accessed from www.ugo.com August 4, 2004).'
