  - '[PAGE 291]


    # Six Sigma


    Six Sigma is “a comprehensive and flexible system for achieving, sustaining, and
    maximizing business success. Six Sigma is uniquely driven by close understanding
    of customer needs, disciplined use of facts, data, and statistical analysis, and
    diligent attention to managing, improving, and reinventing business processes.”*


    > *Pande, Peter S., Robert P. Neuman, and Roland R. Cavanagh, The Six Sigma Way,
    New York: McGraw-Hill, 2000, p. xi.'
  - '[PAGE 292]


    # Basic Information on Six Sigma


    +   - The target for perfection is the achievement of no more than **3.4 defects
    per million opportunities**.

    +   - The principles can apply to a wide variety of processes.

    +   - Six Sigma projects normally follow a five-phase improvement process called
    DMAIC.'
  - '[PAGE 293]


    # DMAIC


    +   - **DMAIC** is a systematic, closed-loop process for continued improvement
    that is scientific and fact based.

    +   - DMAIC stands for:

    +     - **Define**: Define the problem/opportunity, process, and customer requirements.

    +     - **Measure**: Define measures, then collect, compile, and display data.

    +     - **Analyze**: Scrutinize process details to find improvement opportunities.

    +     - **Improve**: Generate solutions and ideas for improving the problem.

    +     - **Control**: Track and verify the stability of the improvements and the
    predictability of the solution.'
  - '[PAGE 294]


    # How is Six Sigma Quality Control Unique?


    +   - It requires an organization-wide commitment.

    +   - Training follows the "Belt" system.

    +   - Six Sigma organizations have the ability and willingness to adopt contrary
    objectives, such as reducing errors and getting things done faster.

    +   - It is an operating philosophy that is customer focused and strives to drive
    out waste, raise levels of quality, and improve financial performance at *breakthrough*
    levels.'
  - '[PAGE 295]


    # Examples of Six Sigma Organizations


    +   - Motorola, Inc. pioneered the adoption of Six Sigma in the 1980s and saved
    about $14 billion.*

    +   - Allied Signal/Honeywell saved more than $600 million a year by reducing
    the costs of reworking defects and improving aircraft engine design processes.**

    +   - General Electric uses Six Sigma to focus on achieving customer satisfaction.


    *Pande, Peter S., Robert P. Neuman, and Roland R. Cavanagh, The Six Sigma Way.
    New York: McGraw-Hill, 2000, p. 7.


    **Ibid. p. 9.'
  - '[PAGE 296]


    # Six Sigma and Project Management


    +   - Joseph M. Juran stated, “All improvement takes place project by project,
    and in no other way.”*

    +   - It’s important to select projects carefully and apply higher quality where
    it makes sense; companies that use Six Sigma do not always boost their stock values.

    +   - As Mikel Harry puts it, “I could genetically engineer a Six Sigma goat,
    but if a rodeo is the marketplace, people are still going to buy a Four Sigma
    horse.”**

    +   - Six Sigma projects must focus on a quality problem or gap between the current
    and desired performance and not have a clearly understood problem or a predetermined
    solution.


    *“What You Need to Know About Six Sigma,” Productivity Digest (December 2001),
    p. 38.

    **Clifford, Lee, “Why You Can Safely Ignore Six Sigma,” Fortune (January 22, 2001),
    p. 140.'
  - '[PAGE 297]


    # Six Sigma Projects Use Project Management


    +   - The training for Six Sigma includes many project management concepts, tools,
    and techniques.

    +   - For example, Six Sigma projects often use business cases, project charters,
    schedules, budgets, and so on.

    +   - Six Sigma projects are done in teams; the project manager is often called
    the team leader, and the sponsor is called the champion.'
  - '[PAGE 298]


    # Six Sigma and Statistics


    +   - The term *sigma* means standard deviation.

    +   - **Standard deviation** measures how much variation exists in a distribution
    of data.

    +   - Standard deviation is a key factor in determining the acceptable number
    of defective units found in a population.

    +   - Six Sigma projects strive for no more than 3.4 defects per million opportunities,
    yet this number is confusing to many statisticians.'
