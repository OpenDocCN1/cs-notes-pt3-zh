  - '[PAGE 46]


    # Chapter Summary


    +   - As the number and complexity of projects continue to grow, it is becoming
    even more important to practice good project management.

    +   - A project has several attributes, such as being unique, temporary and developed
    incrementally.

    +   - A framework for project management includes project stakeholders, the nine
    knowledge areas, tools and techniques, and creating project portfolios to ensure
    enterprise success.

    +   - Successful project managers must possess and development many skills and
    lead their teams by example.

    +   - The project management profession continues to mature as more people become
    certified and more tools are created.'
