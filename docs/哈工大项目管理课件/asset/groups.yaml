  - '[PAGE 55]


    # What Went Wrong?


    Many enterprise resource planning (ERP) projects fail due to organizational issues,
    not technical issues. For example, Sobey’s Canadian grocery store chain abandoned
    its two-year, $90 million ERP system due to organizational problems.


    As Dalhousie University Associate Professor Sunny Marche states, “The problem
    of building an integrated system that can accommodate different people is a very
    serious challenge. You can’t divorce technology from the sociocultural issues.
    They have an equal role.” Sobey’s ERP system shut down for five days and employees
    were scrambling to stock potentially empty shelves in several stores for weeks.
    The system failure cost Sobey’s more than $90 million and caused shareholders
    to take an 82-cent after-tax hit per share.*


    *Hoare, Eva. “Software Hardships,” The Herald, Halifax, Nova Scotia (2001).'
  - '[PAGE 56]


    # Many Organizations Focus on the Structural Frame


    +   - Most people understand what organizational charts are.

    +   - Many new managers try to change organizational structure when other changes
    are needed.

    +   - Three basic organizational structures:

    +     - **Functional**: Functional managers report to the CEO.

    +     - **Project**: Program managers report to the CEO.

    +     - **Matrix**: Middle ground between functional and project structures; personnel
    often report to two or more bosses; structure can be a weak, balanced, or strong
    matrix.'
