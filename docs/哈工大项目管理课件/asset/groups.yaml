  - '[PAGE 269]


    # Project Portfolio

    Management


    +   - Many organizations collect and control an entire suite of projects or investments
    as one set of interrelated activities in a portfolio.

    +   - Project portfolio management has five levels:

    +     1. Put all your projects in one database.

    +     2. Prioritize the projects in your database.

    +     3. Divide your projects into two or three budgets based on type of investment.

    +     4. Automate the repository.

    +     5. Apply modern portfolio theory, including risk-return tools that map project
    risk on a curve.'
  - '[PAGE 270]


    # Benefits of Portfolio Management


    +   - Schlumberger saved $3 million in one year by organizing 120 information
    technology projects into a portfolio.

    +   - META Group research shows that:

    +     - Organizations that evaluate information technology projects by what their
    business impacts are and what their potential business values will be implement
    projects that result in 25 percent more improvement to the bottom line.

    +     - By 2005-2006, more than 50 percent of the CIOs for Global 2000 companies
    will adopt project portfolio management tools and techniques for IT projects,
    asset management, and budget planning and monitoring.

    +     - Business executives state that using project portfolio management allows
    managers to make decisions faster and with more confidence.*


    > *META Group, “IT Investment Management: Portfolio Management Lessons Learned,”
    A META Group White Paper (www.metagroup.com) (2002).'
