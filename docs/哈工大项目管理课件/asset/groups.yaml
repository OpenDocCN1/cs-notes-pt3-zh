    # Developing an IT Project Management Methodology


    +   - Just as projects are unique, so are approaches to project management.

    +   - Many organizations develop their own project management methodologies, especially
    for IT projects.

    +   - BlueCross BlueShield of Michigan used the *PMBOK® Guide 2000* to develop
    their IT project management methodology.

    +   - Six Sigma projects and the Rational Unified Process (RUP) framework use
    project management methodologies.'
  - '[PAGE 86]


    # What Went Right?


    Jordan Telecom (JT), Jordan’s only telecom operator, introduced new customized
    project management processes to improve efficiency and reduce costs in its Information
    Technology department…JT created three lines of processes based on the size of
    the project: high, medium, or low…Rula Ammuri, JT’s Chief Information Officer,
    believes this new methodology will result in a 40-50 percent increase in productivity.*


    Al-Tamimi, Fairooz, “Jordanian Company Uses PMI Methods to ‘Go Global’, Improve
    Productivity,” PMI Today (August 2004).'
  - '[PAGE 87]


    # Case Study: JWD Consulting’s Project Management Intranet Site


    +   - This case study provides an example of what’s involved in initiating, planning,
    executing, controlling, and closing an IT project.

    +   - You can download templates for creating your own project management documents
    from the companion Web site for this text.

    +   - This case study provides a big picture view of managing a project. Later
    chapters provide detailed information on each knowledge area.'
  - '[PAGE 88]


    # Project Initiation


    +   - Initiating a project includes recognizing and starting a new project or
    project phase.

    +   - Some organizations use a pre-initiation phase, while others include items
    such as developing a business case as part of the initiation.

    +   - The main goal is to formally select and start off projects.

    +   - Key outputs include:

    +     - Assigning the project manager.

    +     - Identifying key stakeholders.

    +     - Completing a business case.

    +     - Completing a project charter and getting signatures on it.'
