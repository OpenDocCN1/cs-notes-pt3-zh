    \ to identify risks and maintain an awareness of risks throughout the life of\
    \ a project.\n- Establish a periodic review of the top ten project risk items.\n\
    - List the current ranking, previous ranking, number of times the risk appears\
    \ on the list over a period of time, and a summary of progress made in resolving\
    \ the risk item.\n\n# Table 11-7. Example of Top Ten Risk Item Tracking\n\n| \
    \ | Monthly Ranking |  |\n|---|---|---|\n| Risk Item | This Month | Last Month\
    \ | Number of Months | Risk Resolution Progress |\n| Inadequate planning | 1 |\
    \ 2 | 4 | Working on revising the entire project plan |\n| Poor definition of\
    \ scope | 2 | 3 | 3 | Holding meetings with project customer and sponsor to clarify\
    \ scope |\n| Absence of leadership | 3 | 1 | 2 | Just assigned a new project manager\
    \ to lead the project after old one quit |\n| Poor cost estimates | 4 | 4 | 3\
    \ | Revising cost estimates |\n| Poor time estimates | 5 | 5 | 3 | Revising schedule\
    \ estimates |\n\n# Quantitative Risk Analysis\n\n- Often follows qualitative risk\
    \ analysis, but both can be done together.\n- Large, complex projects involving\
    \ leading edge technologies often require extensive quantitative risk analysis.\n\
    - Main techniques include:\n  - Decision tree analysis\n  - Simulation\n  - Sensitivity\
    \ analysis\n\n# Decision Trees and Expected Monetary Value (EMV)\n\n- A **decision\
    \ tree** is a diagramming analysis technique used to help select the best course\
    \ of action in situations in which future outcomes are uncertain.\n- **Estimated\
    \ monetary value (EMV)** is the product of a risk event probability and the risk\
    \ event’s monetary value.\n- You can draw a decision tree to help find the EMV.\n\
    \n# Figure 11-8. Expected Monetary Value (EMV) Example\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_470_0.png)\n\
    \nProject 1’s EMV = $60,000 −32,000 = $28,000\nProject 2’s EMV = −$10,000 −2,000\
    \ + 42,000 = $30,000\n\n# Simulation\n\n- Simulation uses a representation or\
    \ model of a system to analyze the expected behavior or performance of the system.\n\
    - **Monte Carlo analysis** simulates a model’s outcome many times to provide a\
    \ statistical distribution of the calculated results.\n- To use a Monte Carlo\
    \ simulation, you must have three estimates (most likely, pessimistic, and optimistic)\
    \ plus an estimate of the likelihood of the estimate being between the most likely\
    \ and optimistic values.\n\n# Steps of a Monte Carlo Analysis\n\n- 1. Assess the\
    \ range for the variables being considered.\n- 2. Determine the probability distribution\
    \ of each variable.\n- 3. For each variable, select a random value based on the\
    \ probability distribution.\n- 4. Run a deterministic analysis or one pass through\
    \ the model.\n- 5. Repeat steps 3 and 4 many times to obtain the probability distribution\
    \ of the model’s results.\n\n# Figure 11-7. Sample Monte Carlo Simulation Results\
    \ for Project Schedule\n\nDate: 4/14/02 11:13:56 AM\nNumber of Samples: 250\n\
    Unique ID: 1\nName: Widget\n\nCompletion Std Deviation: 5.2d\n95% Confidence Interval:\
    \ 0.6d\nEach bar represents 2d\n\n# Completion Probability Table\n\n| Prob | Date\
    \ | Prob | Date |\n|------|------|------|------|\n| 0.05 | 2/4/02 | 0.55 | 2/17/02\
    \ |\n| 0.10 | 2/8/02 | 0.60 | 2/18/02 |\n| 0.15 | 2/9/02 | 0.65 | 2/19/02 |\n\
    | 0.20 | 2/10/02 | 0.70 | 2/22/02 |\n| 0.25 | 2/11/02 | 0.75 | 2/22/02 |\n| 0.30\
    \ | 2/12/02 | 0.80 | 2/23/02 |\n| 0.35 | 2/15/02 | 0.85 | 2/24/02 |\n| 0.40 |\
    \ 2/15/02 | 0.90 | 2/25/02 |\n| 0.45 | 2/16/02 | 0.95 | 2/26/02 |\n| 0.50 | 2/17/02\
    \ | 1.00 | 3/10/02 |\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_473_0.png)\n\n\
    # What Went Right?\n\n- A large aerospace company used Monte Carlo simulation\
    \ to help quantify risks on several advanced-design engineering projects, such\
    \ as the National Aerospace Plan (NASP).\n- The results of the simulation were\
    \ used to determine how the company would invest its internal research and development\
    \ funds.\n- Although the NASP project was terminated, the resulting research has\
    \ helped develop more advanced materials and propulsion systems used on many modern\
    \ aircraft.\n"
