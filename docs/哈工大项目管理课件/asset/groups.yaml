    \ Hybrid of both fixed price and cost reimbursable contracts, often used by consultants.\n\
    \    - **Unit price** contracts: Require the buyer to pay the seller a predetermined\
    \ amount per unit of service.\n- A single contract can actually include all four\
    \ of these categories, if it makes sense for that particular procurement.\n\n\
    ### Cost Reimbursable Contracts\n\n- **Cost plus incentive fee (CPIF)**: The buyer\
