    # What Went Right?


    > The real improvement that I saw was in our ability to—in the words of Thomas
    Edison—know when to stop beating a dead horse...Edison''s key to success was that
    he failed fairly often; but as he said, he could recognize a dead horse before
    it started to smell...In information technology we ride dead horses—failing projects—a
    long time before we give up. But what we are seeing now is that we are able to
    get off them; able to reduce cost overrun and time overrun. That''s where the
    major impact came on the success rate."


    Many organizations, like Huntington Bancshares, Inc., use an executive steering
    committee to help keep projects on track.


    > *Cabanis, Jeannette, “A Major Impact: The Standish Group’s Jim Johnson On Project
    Management and IT Project Success,” PM Network, PMI (September 1998), p. 7.'
