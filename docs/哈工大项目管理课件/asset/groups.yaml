  md: '

    ## Media Snapshot


    Many people enjoy watching television shows like *Changing Rooms* or *Trading
    Spaces*, where participants have two days and $1,000 to update a room in their
    neighbor’s house. Because the time and cost are set, it’s the scope that has the
    most flexibility. Designers on these shows often have to change initial scope
    goals due to budget or time constraints.


    Although most homeowners are very happy with work done on the show, some are obviously
    disappointed. Unlike most projects where the project team works closely with the
    customer, homeowners have little say in what gets done and cannot inspect the
    work along the way…What happens when the homeowners don’t like the work that’s
    been done? The FAQ section of tlc.com says, “Everyone on our show is told upfront
    that there’s a chance they won’t like the final design of the room. Each applicant
    signs a release acknowledging that the show is not responsible for redecorating
    a room that isn’t to the owner’s taste.”


    Too bad you can’t get sponsors for most projects to sign a similar release form.
    It would make project scope management much easier!


    ## Creating the Work Breakdown Structure (WBS)


    - A **WBS** is a deliverable-oriented grouping of the work involved in a project
    that defines the total scope of the project.

    - A WBS is a foundation document that provides the basis for planning and managing
    project schedules, costs, resources, and changes.

    - **Decomposition** is subdividing project deliverables into smaller pieces.


    ## Figure 3-1. Sample Intranet WBS Organized by Product


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_163_0.png)


    ## Figure 3-2. Sample Intranet WBS Organized by Phase.


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_164_0.png)


    ## Figure 5-3. Intranet WBS and Gantt Chart in Project 2000


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_166_0.png)


    ## Figure 5-4. Intranet Gantt Chart Organized by Project Management Process Groups


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_167_0.png)


    ## Table 5-4. Executing Tasks for JWD Consulting’s WBS


    - 3.0 Executing

    - 3.1 Survey

    - 3.2 User inputs

    - 3.3 Intranet site content

    - 3.3.1 Templates and Tools

    - 3.3.2 Articles

    - 3.3.3 Links

    - 3.3.4 Ask the Expert

    - 3.3.5 User requests feature

    - 3.4 Intranet site design

    - 3.5 Intranet site construction

    - 3.6 Site testing

    - 3.7 Site promotion

    - 3.8 Site roll out

    - 3.9 Project benefits measurement


    ## Approaches to Developing WBSs


    - **Guidelines**: Some organizations, such as the DOD, provide guidelines for
    preparing WBSs.

    - **Analogy approach**: Review WBSs of similar projects and tailor to your project.

    - **Top-down approach**: Start with the largest items of the project and break
    them down.

    - **Bottom-up approach**: Start with the specific tasks and roll them up.

    - **Mind-mapping approach**: Write tasks in a non-linear, branching format and
    then create the WBS structure.


    ## Figure 5-5. Sample Mind-Mapping Approach


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_170_0.png)


    ## Figure 5-6. Resulting WBS in Chart Form


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_171_0.png)


    ## The WBS Dictionary and Scope Baseline


    - Many WBS tasks are vague and must be explained in more detail so people know
    what to do and can estimate how long the work will take and what it will cost.

    - A **WBS dictionary** is a document that describes detailed information about
    each WBS item.

    - The approved project scope statement and its WBS and WBS dictionary form the
    **scope baseline**, which is used to measure performance in meeting project scope
    goals.


    ## Advice for Creating a WBS and WBS Dictionary*


    - A unit of work should appear in only one place in the WBS.

    - The work content of a WBS item is the sum of the WBS items below it.

    - A WBS item is the responsibility of only one individual, even though many people
    may be working on it.

    - The WBS must be consistent with the way in which work is actually going to be
    performed; it should serve the project team first, and other purposes only if
    practical.


    *Cleland, David I., *Project Management: Strategic Design and Implementation*,
    2nd edition (New York: McGraw-Hill 1994).

    '
