  md: "\n# Procurement Management Plan\n\n- Describes how the procurement processes\
    \ will be managed, from developing documentation for making outside purchases\
    \ or acquisitions to contract closure.\n- Contents varies based on project needs.\n\
    \n# Contract Statement of Work\n(SOW)\n\n- A **statement of work** is a description\
    \ of the work required for the procurement.\n- If a SOW is used as part of a contract\
    \ to describe only the work required for that particular contract, it is called\
    \ a **contract statement of work**.\n- A SOW is a type of scope statement.\n-\
    \ A good SOW gives bidders a better understanding of the buyer’s expectations.\n\
    \n# Figure 12-2. Statement of Work (SOW) Template\n\n- I. **Scope of Work:** Describe\
    \ the work to be done to detail. Specify the hardware and software involved and\
    \ the exact nature of the work.\n- II. **Location of Work:** Describe where the\
    \ work must be performed. Specify the location of hardware and software and where\
    \ the people must perform the work\n- III. **Period of Performance:** Specify\
    \ when the work is expected to start and end, working hours, number of hours that\
    \ can be billed per week, where the work must be performed, and related schedule\
    \ information.\n- IV. **Deliverables Schedule:** List specific deliverables, describe\
    \ them in detail, and specify when they are due.\n- V. **Applicable Standards:**\
    \ Specify any company or industry-specific standards that are relevant to performing\
    \ the work.\n- VI. **Acceptance Criteria:** Describe how the buyer organization\
    \ will determine if the work is acceptable.\n- VII. **Special Requirements:**\
    \ Specify any special requirements such as hardware or software certifications,\
    \ minimum degree or experience level of personnel, travel requirements, and so\
    \ on.\n\n# Planning Contracting\n\n- Involves preparing several documents needed\
    \ for potential sellers to prepare their responses and determining the evaluation\
    \ criteria for the contract award.\n  - **Request for Proposals**: Used to solicit\
    \ proposals from prospective sellers.\n    - A **proposal** is a document prepared\
    \ by a seller when there are different approaches for meeting buyer needs.\n \
    \ - **Requests for Quotes**: Used to solicit quotes or bids from prospective suppliers.\n\
    \    - A **bid**, also called a tender or quote (short for quotation), is a document\
    \ prepared by sellers providing pricing for standard items that have been clearly\
    \ defined by the buyer.\n\n# Figure 12-3. Request for Proposal (RFP) Template\n\
    \n- I. Purpose of RFP\n- II. Organization’s Background\n- III. Basic Requirements\n\
    - IV. Hardware and Software Environment\n- V. Description of RFP Process\n- VI.\
    \ Statement of Work and Schedule Information\n- VII. Possible Appendices\n  -\
    \ A. Current System Overview\n  - B. System Requirements\n  - C. Volume and Size\
    \ Data\n  - D. Required Contents of Vendor’s Response to RFP\n  - E. Sample Contract\n\
    \n# Evaluation Criteria\n\n- It’s important to prepare some form of evaluation\
    \ criteria, preferably before issuing a formal RFP or RFQ.\n- Beware of proposals\
    \ that look good on paper; be sure to evaluate factors, such as past performance\
    \ and management approach.\n- Can require a technical presentation as part of\
    \ a proposal.\n\n# Requesting Seller Responses\n\n- Deciding whom to ask to do\
    \ the work, sending appropriate documentation to potential sellers, and obtaining\
    \ proposals or bids.\n- Organizations can advertise to procure goods and services\
    \ in several ways:\n  - Approaching the preferred vendor.\n  - Approaching several\
    \ potential vendors.\n  - Advertising to anyone interested.\n- A bidders’ conference\
    \ can help clarify the buyer’s expectations.\n\n# Selecting Sellers\n\n- Also\
    \ called source selection.\n- Involves:\n  - Evaluating proposals or bids from\
    \ sellers.\n  - Choosing the best one.\n  - Negotiating the contract.\n  - Awarding\
    \ the contract.\n"
