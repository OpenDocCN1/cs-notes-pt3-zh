    \ issues had a much greater influence on programmer productivity than the technical\
    \ environment or programming languages.\n- Programmer productivity varied by a\
    \ factor of one to ten across organizations, but only by 21 percent within the\
    \ same organization.\n- Study found no correlation between productivity and programming\
    \ language, years of experience, or salary.\n- A dedicated workspace and a quiet\
    \ work environment were key factors to improving programmer productivity.\n\n\
    ## Expectations and Cultural Differences in Quality\n\n- Project managers must\
    \ understand and manage stakeholder expectations.\n- Expectations also vary by:\n\
    \  - Organization’s culture\n  - Geographic regions\n\n## Maturity Models\n\n\
    - **Maturity models** are frameworks for helping organizations improve their processes\
    \ and systems.\n- The **Software Quality Function Deployment Model** focuses on\
    \ defining user requirements and planning software projects.\n- The Software Engineering\
    \ Institute’s **Capability Maturity Model** is a five-level model laying out a\
    \ generic path to process improvement for software development in organizations.\n\
    \n## CMM Levels and CMMI\n\n- CMM levels, from lowest to highest, are:\n  - Initial\n\
    \  - Repeatable\n  - Defined\n  - Managed\n  - Optimizing\n\n- The **Capability\
    \ Maturity Model Integration (CMMI)** is replacing the older CMM ratings and addresses\
    \ software engineering, system engineering, and program management.\n\n- Companies\
    \ may not get to bid on government projects unless they have a CMMI Level 3.\n\
    \n## PMI's Maturity Model\n\n- PMI released the Organizational Project Management\
    \ Maturity Model (OPM3) in December 2003.\n- Model is based on market research\
    \ surveys sent to more than 30,000 project management professionals and incorporates\
    \ 180 best practices and more than 2,400 capabilities, outcomes, and key performance\
    \ indicators.\n- Addresses standards for excellence in project, program, and portfolio\
    \ management best practices and explains the capabilities necessary to achieve\
    \ those best practices.\n\n## Using Software to Assist in Project Quality Management\n\
    \n- Spreadsheet and charting software helps create Pareto diagrams, fishbone diagrams,\
    \ and so on.\n- Statistical software packages help perform statistical analysis.\n\
    - Specialized software products help manage Six Sigma projects or create quality\
    \ control charts.\n- Project management software helps create Gantt charts and\
    \ other tools to help plan and track work related to quality management.\n\n##\
    \ Chapter Summary\n\n- Project quality management ensures that the project will\
    \ satisfy the needs for which it was undertaken.\n- Main processes include:\n\
    \  - Quality planning\n  - Quality assurance\n  - Quality control\n\n## Chapter\
    \ 9: Project Human Resource Management\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_331_0.png)\n\
    \nInformation Technology Project Management, Fourth Edition\n\n## Learning Objectives\n\
    \n- Discuss human resource planning and be able to create a project organizational\
    \ chart, responsibility assignment matrix, and resource histogram.\n- Understand\
    \ important issues involved in project staff acquisition and explain the concepts\
    \ of resource assignments, resource loading, and resource leveling.\n- Assist\
    \ in team development with training, team-building activities, and reward systems.\n\
    - Explain and apply several tools and techniques to help manage a project team\
    \ and summarize general advice on managing teams.\n- Describe how project management\
    \ software can assist in project human resource management.\n"
