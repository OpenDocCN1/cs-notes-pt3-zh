  - '[PAGE 261]


    # Earned Value Management

    (EVM)


    +   - **EVM** is a project performance measurement technique that integrates scope,
    time, and cost data.

    +   - Given a **baseline** (original plan plus approved changes), you can determine
    how well the project is meeting its goals.

    +   - You must enter actual information periodically to use EVM.

    +   - More and more organizations around the world are using EVM to help control
    project costs.'
  - "[PAGE 262]\n\n# Earned Value Management Terms\n\n+   - The planned value (PV),\
    \ formerly called the budgeted cost of work scheduled (BCWS), also called the\
    \ budget, is that portion of the approved total cost estimate planned to be spent\
    \ on an activity during a given period.\n+   \n+   - Actual cost (AC), formerly\
    \ called actual cost of work performed (ACWP), is the total of direct and indirect\
    \ costs incurred in accomplishing work on an activity during a given period.\n\
    +   \n+   - The earned value (EV), formerly called the budgeted cost of work performed\
    \ (BCWP), is an estimate of the value of the physical work actually completed.\n\
    +   \n+   - EV is based on the original planned costs for the project or activity\
    \ and the rate at which the team is completing work on the project or activity\
    \ to date."
  - '[PAGE 263]


    # # Rate of Performance


    +   - Rate of performance (RP) is the ratio of actual work completed to the percentage
    of work planned to have been completed at any given time during the life of the
    project or activity.


    +   - Brenda Taylor, Senior Project Manager in South Africa, suggests using this
    approach for estimating earned value.


    +   - For example, suppose the server installation was halfway completed by the
    end of week 1. The rate of performance would be 50 percent (50/100) because by
    the end of week 1, the planned schedule reflects that the task should be 100 percent
    complete and only 50 percent of that work has been completed.'
  - '[PAGE 264]


