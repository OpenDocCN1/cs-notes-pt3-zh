    \ cost, change, or contingency control; poor maintenance, security, purchasing,\
    \ etc. |\n| Quality | Poor attitude toward quality; substandard design/materials/workmanship;\
    \ inadequate quality assurance program |\n| Human Resources | Poor conflict management;\
    \ poor project organization and definition of responsibilities; absence of leadership\
    \ |\n| Communications | Carelessness in planning or communicating; lack of consultation\
    \ with key stakeholders |\n| Risk | Ignoring risk; unclear assignment of risk;\
    \ poor insurance management |\n| Procurement | Unenforceable conditions or contract\
    \ clauses; adversarial relations |\n\n## Risk Identification\n\n- **Risk identification**\
    \ is the process of understanding what potential events might hurt or enhance\
    \ a particular project.\n- Risk identification tools and techniques include:\n\
    \  - Brainstorming\n  - The Delphi Technique\n  - Interviewing\n  - SWOT analysis\n\
    \n## Brainstorming\n\n- Brainstorming is a technique by which a group attempts\
    \ to generate ideas or find a solution for a specific problem by amassing ideas\
    \ spontaneously and without judgment.\n\n- An experienced facilitator should run\
    \ the brainstorming session.\n\n- Be careful not to overuse or misuse brainstorming.\n\
    \n- Psychology literature shows that individuals produce a greater number of ideas\
    \ working alone than they do through brainstorming in small, face-to-face groups.\n\
    \n- Group effects often inhibit idea generation.\n"
