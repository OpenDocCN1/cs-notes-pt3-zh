    # Figure 12-4. Sample Proposal Evaluation Sheet


    |  |  | Proposal 1 |  | Proposal 2 |  | Proposal 3 |  |

    |---|---|---|---|---|---|---|---|

    | Criteria | Weight | Rating | Score | Rating | Score | Rating | Score |

    | Technical Approach | 30% |  |  |  |  |  |  |

    | Management Approach | 30% |  |  |  |  |  |  |

