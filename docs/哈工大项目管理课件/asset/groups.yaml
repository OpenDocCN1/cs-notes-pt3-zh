  - '[PAGE 200]


    # Figure 6-3. Task Dependency Types


    # Task dependencies


    The nature of the dependencies between linked tasks. You link tasks by defining
    a dependency between their finish and start dates. For example, the "Contact caterers"
    task must finish before the start of the "Determine menus" task. There are four
    kinds of task dependencies in Microsoft Project:


    | Task dependency | Example | Description |

    |---|---|---|

    | Finish-to-start (FS) |  | Task (B) cannot start until task (A) finishes. |

    | Start-to-start (SS) |  | Task (B) cannot start until task (A) starts. |

    | Finish-to-finish (FF) |  | Task (B) cannot finish until task (A) finishes. |

    | Start-to-finish (SF) |  | Task (B) cannot finish until task (A) starts. |'
