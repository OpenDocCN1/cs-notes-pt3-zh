  - '[PAGE 395]


    # What Went Wrong?


    A well-publicized example of misuse of e-mail comes from the 1998 Justice Department''s
    high profile, antitrust suit against Microsoft. E-mail emerged as a star witness
    in the case. Many executives sent messages that should never have been put in
    writing. The court used e-mail as evidence, even though the senders of the notes
    said the information was being interpreted out of context.*


    See the example that describes the misunderstanding of the phrase “pedagogical
    approach” on page 392.


    *Harmon, Amy, “E-mail Comes Back to Haunt Companies,” Minneapolis Star Tribune
    (from the New York Times) (November 29, 1998).'
  - '[PAGE 396]


    # Distributing Information in an Effective and Timely Manner


    +   - Don’t bury crucial information.

    +   - Don’t be afraid to report bad information.

    +   - Oral communication via meetings and informal talks helps bring important
    information—good and bad—out into the open.'
  - '[PAGE 397]


    # Importance of Face-to-Face Communication


    +   - Research says that in a face-to-face interaction:

    +     - 58 percent of communication is through body language.

    +     - 35 percent of communication is through how the words are said.

    +     - 7 percent of communication is through the content or words that are spoken.

    +   - Pay attention to more than just the actual words someone is saying.

    +   - A person’s tone of voice and body language say a lot about how he or she
    really feels.'
  - '[PAGE 398]


    # Encouraging More Face-to-Face Interactions


    +   - Short, frequent meetings are often very effective in IT projects.

    +   - Stand-up meetings force people to focus on what they really need to communicate.

    +   - Some companies have policies preventing the use of e-mail between certain
    hours or even entire days of the week.'
  - '[PAGE 399]


    <!-- no content -->'
  - '[PAGE 400]


    # Media Snapshot


    +   - Live video is a modern medium for sending information.

    +   - Microsoft says that one in every five face-to-face meetings can be replaced
    with Web conferencing tools, and they estimate it will save $70 million in reduced
    travel in one year alone.*

    +   - The medium can backfire, as in the case with the Janet Jackson wardrobe
    malfunction during the 2004 Super Bowl half-time show.


    *Lohr, Steve, “Ambitious Package to Raise Productivity (and Microsoft’s Profit),”
    The New York Times (August 16, 2004).'
  - '[PAGE 401]


    # Understanding Group and Individual Communication Needs


    +   - People are not interchangeable parts.

    +   - As illustrated in Brooks’ book *The Mythical Man-Month*, you cannot assume
    that a task originally scheduled to take two months of one person’s time can be
    done in one month by two people.

    +   - Nine women cannot produce a baby in one month!'
