  md: '

    ## Suggestions for Improving Project Communications


    - Manage conflicts effectively.

    - Develop better communication skills.

    - Run effective meetings.

    - Use e-mail effectively.

    - Use templates for project communications.


    ## Conflict Handling Modes


    1. Confrontation: Directly face a conflict using a problem-solving approach.

    2. Compromise: Use a give-and-take approach.

    3. Smoothing: De-emphasize areas of difference and emphasize areas of agreement.

    4. Forcing: The win-lose approach.

    5. Withdrawal: Retreat or withdraw from an actual or potential disagreement.


    ## Conflict Can Be Good


    - Conflict often produces important results, such as new ideas, better alternatives,
    and motivation to work harder and more collaboratively.

    - **Groupthink:** Conformance to the values or ethical standards of a group. Groupthink
    can develop if there are no conflicting viewpoints.

    - Research suggests that task-related conflict often improves team performance,
    but emotional conflict often depresses team performance.


    ## Developing Better Communication Skills


    - Companies and formal degree programs for IT professionals often neglect the
    importance of speaking, writing, and listening skills.

    - As organizations become more global, they realize they must invest in ways to
    improve communication with people from different countries and cultures.

    - It takes leadership to improve communication.


    ## Running Effective Meetings


    - Determine if a meeting can be avoided.

    - Define the purpose and intended outcome of the meeting.

    - Determine who should attend the meeting.

    - Provide an agenda to participants before the meeting.

    - Prepare handouts and visual aids, and make logistical arrangements ahead of
    time.

    - Run the meeting professionally.

    - Build relationships.


    ## Using E-Mail Effectively


    - Make sure that e-mail is an appropriate medium for what you want to communicate.

    - Be sure to send the e-mail to the right people.

    - Use meaningful subject lines.

    - Limit the content to one main subject, and be as clear and concise as possible.

    - Limit the number and size of attachments.

    - Delete e-mail you don’t need, and don’t open e-mail if you question the source.

    - Make sure your virus software is current.

    - Respond to and file e-mails quickly.

    - Learn how to use important features.


    ## Using Templates for Project Communications


    - Many technical people are afraid to ask for help.

    - Providing examples and templates for project communications saves time and money.

    - Organizations can develop their own templates, use some provided by outside
    organizations, or use samples from textbooks.

    - Recall that research shows that companies that excel in project management make
    effective use of templates.


    ## Figure 10-2. Sample Template for a Project Description


    ### Project X Description


    **Objective:** Describe the objective of the project in one or two sentences.
    Focus on the business benefits of doing the project.


    **Scope:** Briefly describe the scope of the project. What business functions
    are involved, and what are the main products the project will produce?


    **Assumptions:** Summarize the most critical assumptions for the project.


    **Cost:** Provide the total estimated cost of the project. If desired, list the
    total cost each year.


    **Schedule:** Provide summary information from the project’s Gantt chart, as shown.
    Focus on summary tasks and milestones.


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_419_0.png)


    ## Table 10-5. Sample Template for a Monthly Progress Report


    ### I. Accomplishments for Month of January (or appropriate month):


    - Describe most important accomplishments. Relate to project’s Gantt chart.

    - Describe other important accomplishments, one bullet for each. If any issues
    were resolved from the previous month, list them as accomplishments.


    ### II. Plans for February (or following month):


    - Describe most important items to be accomplished in the next month. Again, relate
    to the project’s Gantt chart.

    - Describe other important items to accomplish, one bullet for each.


    ### III. Issues: Briefly list important issues that surfaced or are still important.
    Managers hate surprises and want to help the project succeed, so be sure to list
    issues.


    ### IV. Project Changes (Date and Description): List any approved or requested
    changes to the project. Include the date of the change and a brief description.

    '
