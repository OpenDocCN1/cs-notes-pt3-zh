    # Media Snapshot*


    +   - A 2004 study by Nucleus Research Inc. estimates that spam will cost large
    companies nearly $2,000 per employee in lost productivity in 2004 alone, despite
    investments in software to block spam. Spam currently accounts for more than 70
    percent of total e-mail volume worldwide.

    +   - In just one month (August 2003), at least 50 new Internet viruses surfaced,
    and losses related to computer viruses cost North American companies about $3.5
    billion. Businesses have suffered at least $65 billion in lost productivity because
    of computer viruses since 1997.


    *McGuire, David, “Report: Spam Costs Are Rising at Work,” Washington Post (June
    7, 2004).'
  - '[PAGE 324]


    # Organizational Influences, Workplace Factors, and Quality


    +   - Study by DeMarco and Lister showed that organizational issues had a much
    greater influence on programmer productivity than the technical environment or
    programming languages.

    +   - Programmer productivity varied by a factor of one to ten across organizations,
    but only by 21 percent within the same organization.

    +   - Study found no correlation between productivity and programming language,
    years of experience, or salary.

    +   - A dedicated workspace and a quiet work environment were key factors to improving
    programmer productivity.'
  - '[PAGE 325]


    # Expectations and Cultural

    Differences in Quality


    +   - Project managers must understand and manage stakeholder expectations.

    +   - Expectations also vary by:

    +     - Organization’s culture

    +     - Geographic regions'
  - '[PAGE 326]


    # Maturity Models


    +   - **Maturity models** are frameworks for helping organizations improve their
    processes and systems.

    +   - The **Software Quality Function Deployment Model** focuses on defining user
    requirements and planning software projects.

    +   - The Software Engineering Institute’s **Capability Maturity Model** is a
    five-level model laying out a generic path to process improvement for software
    development in organizations.'
  - '[PAGE 327]


    # CMM Levels and CMMI


    +   - CMM levels, from lowest to highest, are:

    +     - Initial

    +     - Repeatable

    +     - Defined

    +     - Managed

    +     - Optimizing


    +   - The **Capability Maturity Model Integration (CMMI)** is replacing the older
    CMM ratings and addresses software engineering, system engineering, and program
    management.


    +   - Companies may not get to bid on government projects unless they have a CMMI
    Level 3.'
  - '[PAGE 328]


    # PMI''s Maturity Model


    +   - PMI released the Organizational Project Management Maturity Model (OPM3)
    in December 2003.

    +   - Model is based on market research surveys sent to more than 30,000 project
    management professionals and incorporates 180 best practices and more than 2,400
    capabilities, outcomes, and key performance indicators.

    +   - Addresses standards for excellence in project, program, and portfolio management
    best practices and explains the capabilities necessary to achieve those best practices.'
  - '[PAGE 329]


    # Using Software to Assist in Project Quality Management


    +   - Spreadsheet and charting software helps create Pareto diagrams, fishbone
    diagrams, and so on.

    +   - Statistical software packages help perform statistical analysis.

    +   - Specialized software products help manage Six Sigma projects or create quality
    control charts.

    +   - Project management software helps create Gantt charts and other tools to
    help plan and track work related to quality management.'
  - '[PAGE 330]


    # Chapter Summary


    +   - Project quality management ensures that the project will satisfy the needs
