    # Advice for Creating a WBS and WBS Dictionary (cont’d)*


    +   - Project team members should be involved in developing the WBS to ensure
    consistency and buy-in.

    +   - Each WBS item must be documented in a WBS dictionary to ensure accurate
    understanding of the scope of work that is included and not included in that item.

    +   - The WBS must be a flexible tool to accommodate inevitable changes while
    properly maintaining control of the work content in the project according to the
    scope statement.


    *Cleland, David I., Project Management: Strategic Design and Implementation, 2nd
    edition (New York: McGraw-Hill 1994).'
