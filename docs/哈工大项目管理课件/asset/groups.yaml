    | Cost Variance (CV) | -7,500 |

    | Schedule Variance (SV) | -2,500 |

    | Cost Performance Index (CPI) | 50% |

    | Schedule Performance Index (SPI) | 75% |'
  - '[PAGE 265]


    # Table 7-5. Earned Value Formulas


    | TERM | FORMULA |

    |------|---------|

    | Earned Value | EV = PV to date × RP |

    | Cost Variance | CV = EV – AC |

    | Schedule Variance | SV = EV – PV |

    | Cost Performance Index | CPI = EV/AC |

    | Schedule Performance Index | SPI = EV/PV |

    | Estimate at Completion (EAC)* | EAC = BAC/CPI |

    | Estimated Time to Complete | Original Time Estimate/SPI |'
