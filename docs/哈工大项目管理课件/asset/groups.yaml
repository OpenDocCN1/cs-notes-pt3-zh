  - '[PAGE 100]


    # Learning Objectives


    +   - Describe project management plan development, including content, using guidelines
    and templates for developing plans, and performing a stakeholder analysis to help
    manage relationships.

    +   - Explain project execution, its relationship to project planning, the factors
    related to successful results, and tools and techniques to assist in project execution.

    +   - Describe the process of monitoring and controlling project work.'
  - '[PAGE 101]


    # Learning Objectives


    +   - Understand the integrated change control process, planning for and managing
    changes on information technology projects, and developing and using a change
    control system.

    +   - Explain the importance of developing and following good procedures for closing
    projects.

    +   - Describe how software can assist in project integration management.'
  - '[PAGE 102]


    # The Key to Overall Project Success:

    Good Project Integration

    Management


    +   - Project managers must coordinate all of the other knowledge areas throughout
    a project’s life cycle.

    +   - Many new project managers have trouble looking at the “big picture” and
    want to focus on too many details. (See opening case for a real example.)

    +   - Project integration management is *not* the same thing as software integration.'
  - '[PAGE 103]


    # Project Integration Management Processes


    +   - **Develop the project charter**: Work with stakeholders to create the document
    that formally authorizes a project—the charter.

    +   - **Develop the preliminary project scope statement**: Work with stakeholders,
    especially users of the project’s products, services, or results, to develop the
    high-level scope requirements and create a preliminary project scope statement.

    +   - **Develop the project management plan**: Coordinate all planning efforts
    to create a consistent, coherent document—the project management plan.'
  - '[PAGE 104]


    # Project Integration

    Management Processes (cont’d)


    +   - **Direct and manage project execution**: Carry out the project management
    plan by performing the activities included in it.

    +   - **Monitor and control the project work**: Oversee project work to meet the
    performance objectives of the project.

    +   - **Perform integrated change control**: Coordinate changes that affect the
    project’s deliverables and organizational process assets.

    +   - **Close the project**: Finalize all project activities to formally close
    the project.'
  - '[PAGE 105]


    # Strategic Planning and Project Selection


    +   - **Strategic planning** involves determining long-term objectives, predicting
    future trends, and projecting the need for new products and services.


    +   - Organizations often perform a **SWOT analysis**:


    +   - **Strengths, Weaknesses, Opportunities, and Threats**


    +   - As part of strategic planning, organizations should:


    +   - Identify potential projects.


    +   - Use realistic methods to select which projects to work on.


    +   - Formalize project initiation by issuing a project charter.'
  - '[PAGE 106]


    # # Identifying Potential Projects


    +   - Many organizations follow a planning process for selecting IT projects.


    +   - It’s crucial to align IT projects with business strategy.


    +   - Research shows that:


    +     - Supporting explicit business objectives is the number one reason cited
    for investing in IT projects.


    +     - Companies with consolidated IT operations have a 24 percent lower operational
    cost per end user.


    +     - The consistent use of IT standards lowers application development costs
    by 41 percent per user.*


    > *Cosgrove Ware, Lorraine, “By the Numbers,” CIO Magazine (www.cio.com) (September
    1, 2002).'
  md: "\n## Chapter 4:\nProject Integration Management\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_98_0.png)\n\
    \nInformation Technology Project Management, Fourth Edition\n\n## Learning Objectives\n\
    \n- Describe an overall framework for project integration management as it relates\
    \ to the other project management knowledge areas and the project life cycle.\n\
    - Explain the strategic planning process and apply different project selection\
    \ methods.\n- Explain the importance of creating a project charter to formally\
    \ initiate projects.\n- Discuss the process of creating a preliminary project\
    \ scope statement.\n\n## Learning Objectives\n\n- Describe project management\
    \ plan development, including content, using guidelines and templates for developing\
    \ plans, and performing a stakeholder analysis to help manage relationships.\n\
    - Explain project execution, its relationship to project planning, the factors\
    \ related to successful results, and tools and techniques to assist in project\
    \ execution.\n- Describe the process of monitoring and controlling project work.\n\
    \n## Learning Objectives\n\n- Understand the integrated change control process,\
    \ planning for and managing changes on information technology projects, and developing\
    \ and using a change control system.\n- Explain the importance of developing and\
    \ following good procedures for closing projects.\n- Describe how software can\
    \ assist in project integration management.\n\n## The Key to Overall Project Success:\n\
    Good Project Integration Management\n\n- Project managers must coordinate all\
    \ of the other knowledge areas throughout a project’s life cycle.\n- Many new\
    \ project managers have trouble looking at the “big picture” and want to focus\
    \ on too many details. (See opening case for a real example.)\n- Project integration\
    \ management is *not* the same thing as software integration.\n\n## Project Integration\
    \ Management Processes\n\n- **Develop the project charter**: Work with stakeholders\
    \ to create the document that formally authorizes a project—the charter.\n- **Develop\
    \ the preliminary project scope statement**: Work with stakeholders, especially\
    \ users of the project’s products, services, or results, to develop the high-level\
    \ scope requirements and create a preliminary project scope statement.\n- **Develop\
    \ the project management plan**: Coordinate all planning efforts to create a consistent,\
    \ coherent document—the project management plan.\n\n## Project Integration Management\
    \ Processes (cont’d)\n\n- **Direct and manage project execution**: Carry out the\
    \ project management plan by performing the activities included in it.\n- **Monitor\
    \ and control the project work**: Oversee project work to meet the performance\
    \ objectives of the project.\n- **Perform integrated change control**: Coordinate\
    \ changes that affect the project’s deliverables and organizational process assets.\n\
    - **Close the project**: Finalize all project activities to formally close the\
    \ project.\n\n## Strategic Planning and Project Selection\n\n- **Strategic planning**\
    \ involves determining long-term objectives, predicting future trends, and projecting\
    \ the need for new products and services.\n\n- Organizations often perform a **SWOT\
    \ analysis**:\n\n- **Strengths, Weaknesses, Opportunities, and Threats**\n\n-\
    \ As part of strategic planning, organizations should:\n\n- Identify potential\
    \ projects.\n- Use realistic methods to select which projects to work on.\n- Formalize\
    \ project initiation by issuing a project charter.\n\n## Identifying Potential\
    \ Projects\n\n- Many organizations follow a planning process for selecting IT\
