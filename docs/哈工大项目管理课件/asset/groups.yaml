    | All tasks, completed critical tasks, incomplete tasks, and milestone tasks |

    | Current activities reports: unstarted tasks, tasks starting soon, tasks in progress,
    completed tasks, should have started tasks, and slipping tasks |  |  |

    | Assignment reports: who does what and when |  |  |


    ## Words of Caution on Using

    Project Management

    Software


    - Many people misuse project management software because they don’t understand
    important concepts and have not had training.

    - You must enter dependencies to have dates adjust automatically and to determine
    the critical path.

    - You must enter actual schedule information to compare planned and actual progress.


    ## Learning Objectives


    - Understand the importance of project cost management.

    - Explain basic project cost management principles, concepts, and terms.

    - Discuss different types of cost estimates and methods for preparing them.


    ## Learning Objectives


    - Understand the processes involved in cost budgeting and preparing a cost estimate
    and budget for an information technology project.

    - Understand the benefits of earned value management and project portfolio management
    to assist in cost control.

    - Describe how project management software can assist in project cost management.


    ## The Importance of Project Cost Management


    - IT projects have a poor track record for meeting budget goals.

    - The 2003 CHAOS studies showed the average cost **overrun** (the additional percentage
    or dollar amount by which actual costs exceed estimates) was 43 percent.

    - U.S. lost $55 billion in IT projects in 2002 from cancelled projects and overruns
    compared to $140 billion in 1994.*


    *The Standish Group, “Latest Standish Group CHAOS Report Shows Project Success
    Rates Have Improved by 50%,” A Standish Group Research Note (3/25/03).


    ## What Went Wrong?


    According to the *San Francisco Chronicle*’s front-page story, “Computer Bumbling
    Costs the State $1 Billion,” the state of California had a series of expensive
    IT project failures in the late 1990s, costing taxpayers nearly $1 billion…It
    was ironic that the state that was leading in the creation of computers was also
    the state most behind in using computer technology to improve its services.*


    The Internal Revenue Service (IRS) managed a series of project failures that cost
    taxpayers over $50 billion a year—roughly as much money as the annual net profit
    of the entire computer industry.**


    Connecticut General Life Insurance Co. sued PeopleSoft over an aborted installation
    of a finance system.***


    *Lucas, Greg, “Computer Bumbling Costs the State $1 Billion,” *San Francisco Chronicle*
    (2/21/99).

    **James, Geoffrey, “IT Fiascoes . . . and How to Avoid Them,” *Datamation* (November
    1997).

    ***Songini, Marc L., “PeopleSoft project ends in court,” *ComputerWorld* (September
    2001).


    ## What is Cost and Project

    Cost Management?


    - Cost is a resource sacrificed or foregone to achieve a specific objective, or
    something given up in exchange.

    - Costs are usually measured in monetary units, such as dollars.

    - **Project cost management** includes the processes required to ensure that the
    project is completed within an approved budget.


    ## Project Cost Management Processes


    - **Cost estimating**: Developing an approximation or estimate of the costs of
    the resources needed to complete a project.

    - **Cost budgeting**: Allocating the overall cost estimate to individual work
    items to establish a baseline for measuring performance.

    - **Cost control**: Controlling changes to the project budget.

    '
