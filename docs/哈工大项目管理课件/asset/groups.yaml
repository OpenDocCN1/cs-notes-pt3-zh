    \n## Preliminary Scope Statements\n\n- A **scope statement** is a document used\
    \ to develop and confirm a common understanding of the project scope.\n- It is\
    \ an important tool for preventing **scope creep**:\n  - The tendency for project\
    \ scope to keep getting bigger.\n- A good practice is to develop a preliminary\
    \ or initial scope statement during project initiation and a more detailed scope\
    \ statement as the project progresses.\n"
  mdcn: "\n## NPV Calculations\n\n- Determine estimated costs and benefits for the\
    \ life of the project and the products it produces.\n- Determine the discount\
    \ rate (check with your organization on what to use).\n- Calculate the NPV (see\
    \ text for details).\n- Some organizations consider the investment year as year\
    \ 0, while others consider it year 1. Some people enter costs as negative numbers,\
    \ while others do not. Make sure to identify your organization’s preferences.\n\
    \n## Return on Investment\n\n- **Return on investment (ROI)** is calculated by\
    \ subtracting the project costs from the benefits and then dividing by the costs.\n\
    \nROI = (total discounted benefits - total discounted costs) / discounted costs\n\
    - The higher the ROI, the better.\n- Many organizations have a required rate of\
    \ return or minimum acceptable rate of return on investment for projects.\n- Internal\
    \ rate of return (IRR) can be calculated by setting the NPV to zero.\n\n## Payback\
    \ Analysis\n\n- Another important financial consideration is payback analysis.\n\
    - The **payback period** is the amount of time it will take to recoup, in the\
    \ form of net cash inflows, the total dollars invested in a project.\n- Payback\
    \ occurs when the cumulative discounted benefits and costs are greater than zero.\n\
    - Many organizations want IT projects to have a fairly short payback period.\n\
    \n## Figure 4-4. Charting the Payback Period\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_118_0.png)\n\
    \n## Weighted Scoring Model\n\n- A weighted scoring model is a tool that provides\
    \ a systematic process for selecting projects based on many criteria.\n- Steps\
    \ in identifying a weighted scoring model:\n  1. Identify criteria important to\
    \ the project selection process.\n  2. Assign weights (percentages) to each criterion\
    \ so they add up to 100 percent.\n  3. Assign scores to each criterion for each\
    \ project.\n  4. Multiply the scores by the weights to get the total weighted\
    \ scores.\n- The higher the weighted score, the better.\n\n## Figure 4-5. Sample\
    \ Weighted Scoring Model for Project Selection\n\n|  | A | B | C | D | E | F |\n\
    |---|---|---|---|---|---|---|\n| 1 | Criteria | Weight | Project 1 | Project 2\
    \ | Project 3 | Project 4 |\n| 2 | Supports key business objectives | 25% | 90\
    \ | 90 | 50 | 20 |\n| 3 | Has strong internal sponsor | 15% | 70 | 90 | 50 | 20\
    \ |\n| 4 | Has strong customer support | 15% | 50 | 90 | 50 | 20 |\n| 5 | Realistic\
    \ level of technology | 10% | 25 | 90 | 50 | 70 |\n| 6 | Can be implemented in\
    \ one year or less | 5% | 20 | 20 | 50 | 90 |\n| 7 | Provides positive NPV | 20%\
    \ | 50 | 70 | 50 | 50 |\n| 8 | Has low risk in meeting scope, time, and cost goals\
    \ | 10% | 20 | 50 | 50 | 90 |\n| 9 | Weighted Project Scores | 100% | 56 | 78.5\
    \ | 50 | 41.5 |\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_120_0.png)\n\n## Implementing\
    \ a Balanced Scorecard\n\n- Drs. Robert Kaplan and David Norton developed this\
    \ approach to help select and manage projects that align with business strategy.\n\
    - A **balanced scorecard** is a methodology that converts an organization’s value\
    \ drivers, such as customer service, innovation, operational efficiency, and financial\
    \ performance, to a series of defined metrics.\n- See www.balancedscorecard.org\
    \ for more information.\n\n## Project Charters\n\n- After deciding what project\
    \ to work on, it is important to let the rest of the organization know.\n- A project\
    \ charter is a document that formally recognizes the existence of a project and\
    \ provides direction on the project's objectives and management.\n- Key project\
    \ stakeholders should sign a project charter to acknowledge agreement on the need\
    \ and intent of the project; a signed charter is a key output of project integration\
    \ management.\n\n## Figure 4-6. Project Integration Management Overview\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_123_0.png)\n\
    \n## Preliminary Scope Statements\n\n- A **scope statement** is a document used\
    \ to develop and confirm a common understanding of the project scope.\n- It is\
