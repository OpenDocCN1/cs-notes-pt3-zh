- raw:
  - '[PAGE 12]


    # Project and Program Managers


    +   - Project managers work with project sponsors, project teams, and other people
    involved in projects to meet project goals.

    +   - **Program**: “A group of related projects managed in a coordinated way to
    obtain benefits and control not available from managing them individually.”*

    +   - Program managers oversee programs and often act as bosses for project managers.


    *PMI, A Guide to the Project Management Body of Knowledge (PMBOK® Guide) (2004),
    p. 16.'
  - '[PAGE 13]


    # The Triple Constraint


    +   - Every project is constrained in different ways by its:

    +     - **Scope** goals: What work will be done?

    +     - **Time** goals: How long should it take to complete?

    +     - **Cost** goals: What should it cost?


    +   - It is the project manager’s duty to balance these three often-competing
    goals.'
  - '[PAGE 14]


    # Figure 1-1. The Triple Constraint of Project Management


    Successful project management means meeting all three goals (scope, time, and
    cost) – and satisfying the project’s sponsor!


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_14_0.png)'
  - '[PAGE 15]


    # What is Project Management?


    +   - **Project management** is “the application of knowledge, skills, tools and
    techniques to project activities to meet project requirements.”*


    *PMI, A Guide to the Project Management Body of Knowledge (PMBOK® Guide) (2004),
    p. 8.'
  - '[PAGE 16]


    # Figure 1-2. Project Management Framework


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_16_0.png)'
  - '[PAGE 17]


    # Project Stakeholders


    +   - **Stakeholders** are the people involved in or affected by project activities.

    +   - Stakeholders include:

    +     - Project sponsor

    +     - Project manager

    +     - Project team

    +     - Support staff

    +     - Customers

    +     - Users

    +     - Suppliers

    +     - Opponents to the project'
  - '[PAGE 18]


    # Nine Project Management Knowledge Areas


    +   - Knowledge areas describe the key competencies that project managers must
    develop.

    +     - Four core knowledge areas lead to specific project objectives (scope,
    time, cost, and quality).

    +     - Four facilitating knowledge areas are the means through which the project
    objectives are achieved (human resources, communication, risk, and procurement
    management).

    +     - One knowledge area (project integration management) affects and is affected
    by all of the other knowledge areas.

    +     - All knowledge areas are important!'
