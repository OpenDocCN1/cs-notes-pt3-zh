    \ of IT Projects\n- **Functionality** is the degree to which a system performs\
    \ its intended function.\n- **Features** are the system’s special characteristics\
    \ that appeal to users.\n- **System outputs** are the screens and reports the\
    \ system generates.\n- **Performance** addresses how well a product or service\
    \ performs the customer’s intended use.\n- **Reliability** is the ability of a\
    \ product or service to perform as expected under normal conditions.\n- **Maintainability**\
    \ addresses the ease of performing maintenance on a product.\n\n## Who's Responsible\
    \ for the Quality of Projects?\n- Project managers are ultimately responsible\
    \ for quality management on their projects.\n- Several organizations and references\
    \ can help project managers and their teams understand quality.\n  - International\
    \ Organization for Standardization (www.iso.org)\n  - IEEE (www.ieee.org)\n\n\
    ## Quality Assurance\n- Quality assurance includes all the activities related\
    \ to satisfying the relevant quality standards for a project.\n- Another goal\
    \ of quality assurance is continuous quality improvement.\n- **Benchmarking**\
    \ generates ideas for quality improvements by comparing specific project practices\
    \ or product characteristics to those of other projects or products within or\
    \ outside the performing organization.\n- A **quality audit** is a structured\
    \ review of specific quality management activities that help identify lessons\
    \ learned that could improve performance on current or future projects.\n\n##\
    \ Table 8-1. Table of Contents for a Quality Assurance Plan*\n- 1.0 Draft Quality\
    \ Assurance Plan\n- 1.1 Introduction\n- 1.2 Purpose\n- 1.3 Policy Statement\n\
    - 1.4 Scope\n- 2.0 Management\n- 2.1 Organizational Structure\n- 2.2 Roles and\
    \ Responsibilities\n- 2.2.1 Technical Monitor/Senior Management\n- 2.2.2 Task\
    \ Leader\n- 2.2.3 Quality Assurance Team\n- 2.2.4 Technical Staff\n- 3.0 Required\
    \ Documentation\n- 4.0 Quality Assurance Procedures\n- 4.1 Walkthrough Procedure\n\
    - 4.2 Review Process\n- 4.2.1 Review Procedures\n- 4.3 Audit Process\n- 4.3.1\
    \ Audit Procedures\n- 4.4 Evaluation Process\n- 4.5 Process Improvement\n- 5.0\
    \ Problem Reporting Procedures\n- 5.1 Noncompliance Reporting Procedures\n- 6.0\
    \ Quality Assurance Metrics\n- Appendix\n- Quality Assurance Checklist Forms\n\
    \n*U.S. Department of Energy\n\n## Quality Control\n- The main outputs of quality\
    \ control are:\n  - Acceptance decisions\n  - Rework\n  - Process adjustments\n\
    - Some tools and techniques include:\n  - Pareto analysis\n  - Statistical sampling\n\
    \  - Six Sigma\n  - Quality control charts\n\n## Pareto Analysis\n- **Pareto analysis**\
    \ involves identifying the vital few contributors that account for the most quality\
    \ problems in a system.\n- Also called the 80-20 rule, meaning that 80 percent\
    \ of problems are often due to 20 percent of the causes.\n- **Pareto diagrams**\
    \ are histograms, or column charts representing a frequency distribution, that\
    \ help identify and prioritize problem areas.\n\n## Figure 8-1. Sample Pareto\
    \ Diagram\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_289_0.png)\n\n## Statistical\
    \ Sampling and Standard Deviation\n- **Statistical sampling** involves choosing\
    \ part of a population of interest for inspection.\n- The size of a sample depends\
    \ on how representative you want the sample to be.\n- Sample size formula:\n \
    \ Sample size = .25 X (certainty factor/acceptable error)²\n- Be sure to consult\
    \ with an expert when using statistical analysis.\n"
