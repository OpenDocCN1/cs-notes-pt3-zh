  md: '

    ## The Importance of Project Risk Management


    - Project risk management is the art and science of identifying, analyzing, and
    responding to risk throughout the life of a project and in the best interests
    of meeting project objectives.

    - Risk management is often overlooked in projects, but it can help improve project
    success by helping select good projects, determining project scope, and developing
    realistic estimates.


    ## Research Shows Need to Improve Project Risk Management


    - Study by Ibbs and Kwak shows risk has the lowest maturity rating of all knowledge
    areas.

    - KLCI study shows the benefits of following good software risk management practices.

    - KPMG study found that 55 percent of **runaway projects**—projects that have
    significant cost or schedule overruns—did *no risk management* at all.*


    > *Cole, Andy, “Runaway Projects—Cause and Effects,” Software World, Vol. 26,
    no. 3, pp. 3–5 (1995).*


    ## Table 11-1. Project Management Maturity by Industry Group and Knowledge Area*


    KEY: 1 = LOWEST MATURITY RATING      5 = HIGHEST MATURITY RATING


    | Knowledge Area | Engineering/Construction | Telecommunications | Information
    Systems | Hi-Tech Manufacturing |

    |---|---|---|---|---|

    | Scope | 3.52 | 3.45 | 3.25 | 3.37 |

    | Time | 3.55 | 3.41 | 3.03 | 3.50 |

    | Cost | 3.74 | 3.22 | 3.20 | 3.97 |

    | Quality | 2.91 | 3.22 | 2.88 | 3.26 |

    | Human Resources | 3.18 | 3.20 | 2.93 | 3.18 |

    | Communications | 3.53 | 3.53 | 3.21 | 3.48 |

    | Risk | 2.93 | 2.87 | 2.75 | 2.76 |

    | Procurement | 3.33 | 3.01 | 2.91 | 3.33 |


    > *Ibbs, C. William and Young Hoon Kwak. “Assessing Project Management Maturity,”
    Project Management Journal (March 2000).


    ## Figure 11-1. Benefits from Software Risk Management Practices*


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_435_0.png)


    *Kulik, Peter and Catherine Weber, “Software Risk Management Practices – 2001,”
    KLCI Research Group (August 2001).


    ## Negative Risk


    - A dictionary definition of risk is “the possibility of loss or injury.”

    - Negative risk involves understanding potential problems that might occur in
    the project and how they might impede project success.

    - Negative risk management is like a form of insurance; it is an investment.


    ## Risk Can Be Positive


    - Positive risks are risks that result in good things happening; sometimes called
    opportunities.

    - A general definition of project **risk** is an uncertainty that can have a negative
    or positive effect on meeting project objectives.

    - The goal of project risk management is to minimize potential negative risks
    while maximizing potential positive risks.


    ## Risk Utility


    - **Risk utility** or **risk tolerance** is the amount of satisfaction or pleasure
    received from a potential payoff.

    - Utility rises at a decreasing rate for people who are risk-averse.

    - Those who are risk-seeking have a higher tolerance for risk and their satisfaction
    increases when more payoff is at stake.

    - The risk-neutral approach achieves a balance between risk and payoff.


    ## Figure 11-2. Risk Utility Function and Risk Preference.


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_439_0.png)


    ## Project Risk Management Processes


    - **Risk management planning**: Deciding how to approach and plan the risk management
    activities for the project.

    - **Risk identification**: Determining which risks are likely to affect a project
    and documenting the characteristics of each.

    - **Qualitative risk analysis**: Prioritizing risks based on their probability
    and impact of occurrence.


    ## Project Risk Management Processes (cont’d)


    - **Quantitative risk analysis:** Numerically estimating the effects of risks
    on project objectives.

    - **Risk response planning:** Taking steps to enhance opportunities and reduce
    threats to meeting project objectives.

    - **Risk monitoring and control:** Monitoring identified and residual risks, identifying
    new risks, carrying out risk response plans, and evaluating the effectiveness
    of risk strategies throughout the life of the project.

    '
