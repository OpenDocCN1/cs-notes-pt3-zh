    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_342_0.png)


    A satisfied need is no longer a motivator!'
  - '[PAGE 343]


    # Herzberg''s Motivational and Hygiene Factors


    +   - Frederick Herzberg wrote several famous books and articles about worker
    motivation. He distinguished between:

    +     - **Motivational factors**: Achievement, recognition, the work itself, responsibility,
    advancement, and growth. These factors produce job satisfaction.

    +     - **Hygiene factors**: Larger salaries, more supervision, and a more attractive
    work environment. These factors cause dissatisfaction if not present, but do not
    motivate workers to do more.'
  - '[PAGE 344]


    # McClelland’s Acquired-Needs Theory


    Specific needs are acquired or learned over time and are shaped by life experiences.
    The following are the main categories of acquired needs:


    +   - **Achievement (nAch)**: People with a high need for achievement like challenging
    projects with attainable goals and lots of feedback.

    +   - **Affiliation (nAff)**: People with high need for affiliation desire harmonious
    relationships and need to feel accepted by others, so managers should try to create
    a cooperative work environment for them.

    +   - **Power (nPow)**: People with a need for power desire either personal power
    (not good) or institutional power (good for the organization). Provide institutional
    power seekers with management opportunities.'
  - '[PAGE 345]


    # McGregor’s Theory X and Y


    +   - Douglas McGregor popularized the human relations approach to management
    in the 1960s.

    +   - **Theory X:** Assumes workers dislike and avoid work, so managers must use
    coercion, threats, and various control schemes to get workers to meet objectives.

    +   - **Theory Y:** Assumes individuals consider work as natural as play or rest
    and enjoy the satisfaction of esteem and self-actualization needs.

    +   - **Theory Z:** Introduced in 1981 by William Ouchi and is based on the Japanese
    approach to motivating workers, which emphasizes trust, quality, collective decision
    making, and cultural values.'
  - '[PAGE 346]


    # Thamhain and Wilemon’s Ways to Have Influence on Projects


    +   1. **Authority**: The legitimate hierarchical right to issue orders.

    +   2. **Assignment**: The project manager''s perceived ability to influence a
    worker''s later work assignments.

    +   3. **Budget**: The project manager''s perceived ability to authorize others''
    use of discretionary funds.

    +   4. **Promotion**: The ability to improve a worker''s position.

    +   5. **Money**: The ability to increase a worker''s pay and benefits.'
  - '[PAGE 347]


    # Thamhain and Wilemon''s Ways to Have Influence on Projects (cont''d)


    +   6. Penalty: The project manager''s ability to cause punishment.


    +   7. Work challenge: The ability to assign work that capitalizes on a worker''s
    enjoyment of doing a particular task.


    +   8. Expertise: The project manager''s perceived special knowledge that others
    deem important.


    +   9. Friendship: The ability to establish friendly personal relationships between
    the project manager and others.'
  - '[PAGE 348]


    # Ways to Influence that Help and Hurt Projects


    +   - Projects are more likely to *succeed* when project managers influence people
    using:

    +     - Expertise

    +     - Work challenge

    +   - Projects are more likely to *fail* when project managers rely too heavily
    on:

    +     - Authority

    +     - Money

    +     - Penalty'
