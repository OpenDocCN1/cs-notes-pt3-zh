  md: '

    ## Leadership and a Supportive Culture


    Project managers must lead by example to demonstrate the importance of creating
    and then following good project plans.


    Organizational culture can help project execution by:

    - Providing guidelines and templates.

    - Tracking performance based on plans.


    Project managers may still need to break the rules to meet project goals, and
    senior managers must support those actions.


    ## What Went Wrong?


    Many people have a poor view of plans based on their experiences. Top managers
    often require a project management plan, but then no one follows up on whether
    the plan was followed. For example, one project manager said he would meet with
    each project team leader within two months to review their project plans. The
    project manager created a detailed schedule for these reviews. He cancelled the
    first meeting due to another business commitment. He rescheduled the next meeting
    for unexplained personal reasons. Two months later, the project manager had still
    not met with over half of the project team leaders. Why should project members
    feel obligated to follow their own plans when the project manager obviously did
    not follow his?


    ## Important Skills for Project Execution


    - General management skills such as leadership, communication, and political skills.

    - Product, business, and application area skills and knowledge.

    - Use of specialized tools and techniques.


    ## Monitoring and Controlling Project Work


    - Changes are inevitable on most projects, so it’s important to develop and follow
    a process to monitor and control changes.

    - Monitoring project work includes collecting, measuring, and disseminating performance
    information.

    - Two important outputs of monitoring and controlling project work include recommended
    corrective and preventive actions.


    ## Media Snapshot


    The 2002 Olympic Winter Games and Paralympics took five years to plan and cost
    more than $1.9 billion. PMI awarded the Salt Lake Organizing Committee (SLOC)
    the Project of the Year award for delivering world-class games.


    Four years before the Games began, the SLOC used a Primavera software-based system
    with a cascading color-coded WBS to integrate planning...The SLOC also used an
    Executive Roadmap, a one-page list of the top 100 Games-wide activities, to keep
    executives apprised of progress. Activities were tied to detailed project information
    within each department’s schedule. A 90-day highlighter showed which managers
    were accountable for each integrated activity.


    Fraser Bullock, SLOC Chief Operating Officer and Chief, said, “We knew when we
    were on and off schedule and where we had to apply additional resources. The interrelation
    of the functions meant they could not run in isolation—it was a smoothly running
    machine.”*


    *Foti, Ross, “The Best Winter Olympics, Period,” PM Network (January 2004), p.
    23.


    ## Integrated Change Control


    Three main objectives are:

    - Influence the factors that create changes to ensure that changes are beneficial.

    - Determine that a change has occurred.

    - Manage actual changes as they occur.


    A **baseline** is the approved project management plan plus approved changes.


    ## Change Control on Information Technology Projects


    - **Former view**: The project team should strive to do exactly what was planned
    on time and within budget.

    - **Problem**: Stakeholders rarely agreed beforehand on the project scope, and
    time and cost estimates were inaccurate.

    - **Modern view**: Project management is a process of constant communication and
    negotiation.

    - **Solution**: Changes are often beneficial, and the project team should plan
    for them.


    ## Change Control Boards (CCBs)


    - A formal group of people responsible for approving or rejecting changes on a
    project.

    - CCBs provide guidelines for preparing change requests, evaluate change requests,
    and manage the implementation of approved changes.

    - CCBs include stakeholders from the entire organization.

    '
