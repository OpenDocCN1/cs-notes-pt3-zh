  mdcn: "\n## Six Sigma Uses a Conversion Table\n\n- Using a normal curve, if a process\
    \ is at six sigma, there would be no more than two defective units per billion\
    \ produced.\n- Six Sigma uses a scoring system that accounts for time, an important\
    \ factor in determining process variations.\n- **Yield** represents the number\
    \ of units handled correctly through the process steps.\n- A **defect** is any\
    \ instance where the product or service fails to meet customer requirements.\n\
    - There can be several opportunities to have a defect.\n\n## Figure 8-2. Normal\
    \ Distribution and Standard Deviation\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_300_0.png)\n\
    \nThe normal curve\n\n## Table 8-3. Sigma and Defective Units\n\n| Specification\
    \ Range (in +/- Sigmas) | Percent of Population Within Range | Defective Units\
    \ Per Million |\n|-------------------------------------|-----------------------------------|------------------------------|\n\
    | 1 | 68.27 | 317,300,000 |\n| 2 | 95.45 | 45,400,000 |\n| 3 | 99.73 | 2,700,000\
    \ |\n| 4 | 99.9937 | 63,000 |\n| 5 | 99.999943 | 57 |\n| 6 | 99.9999998 | 2 |\n\
    \n## Table 8-4: Six Sigma Conversion Table\n\n| SIGMA | YIELD | DEFECTS PER MILLION\
    \ OPPORTUNITIES (DPMO) |\n|---|---|---|\n| 1 | 31.0% | 690,000 |\n| 2 | 69.2%\
    \ | 308,000 |\n| 3 | 93.3% | 66,800 |\n| 4 | 99.4% | 6,210 |\n| 5 | 99.97% | 230\
    \ |\n| 6 | 99.99966% | 3.4 |\n\nThe Six Sigma convention for determining defects\
    \ is based on the above conversion table. It accounts for a 1.5 sigma shift to\
    \ measure the number of defects per million opportunities instead of the number\
    \ of defects per unit.\n\n## Quality Control Charts and the Seven Run Rule\n\n\
    - A control chart is a graphic display of data that illustrates the results of\
    \ a process over time. It helps prevent defects and allows you to determine whether\
    \ a process is in control or out of control.\n- The seven run rule states that\
    \ if seven data points in a row are all below the mean, above the mean, or are\
    \ all increasing or decreasing, then the process needs to be examined for non-random\
    \ problems.\n\n## Quality Control Charts\n\n- A **control chart** is a graphic\
    \ display of data that illustrates the results of a process over time.\n- The\
    \ main use of control charts is to prevent defects, rather than to detect or reject\
    \ them.\n- Quality control charts allow you to determine whether a process is\
    \ in control or out of control.\n  - When a process is in control, any variations\
    \ in the results of the process are created by random events; processes that are\
    \ in control do not need to be adjusted.\n  - When a process is out of control,\
    \ variations in the results of the process are caused by non-random events; you\
    \ need to identify the causes of those non-random events and adjust the process\
    \ to correct or eliminate them.\n\n## The Seven Run Rule\n\n- You can use quality\
    \ control charts and the seven run rule to look for patterns in data.\n- The **seven\
    \ run rule** states that if seven data points in a row are all below the mean,\
    \ above the mean, or are all increasing or decreasing, then the process needs\
    \ to be examined for non-random problems.\n\n## Figure 8-3. Sample Quality Control\
