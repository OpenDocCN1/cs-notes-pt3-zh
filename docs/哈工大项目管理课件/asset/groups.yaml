  - '[PAGE 251]


    # Cost Estimation Tools and Techniques


    +   - Basic tools and techniques for cost estimates:

    +     - **Analogous or top-down estimates**: Use the actual cost of a previous,
    similar project as the basis for estimating the cost of the current project.

    +     - **Bottom-up estimates**: Involve estimating individual work items or activities
    and summing them to get a project total.

    +     - **Parametric modeling**: Uses project characteristics (parameters) in
    a mathematical model to estimate project costs.

    +     - **Computerized tools**: Tools, such as spreadsheets and project management
    software, that can make working with different cost estimates and cost estimation
    tools easier.'
  - '[PAGE 252]


    # Constructive Cost Model

    (COCOMO)


    +   - Barry Boehm helped develop the COCOMO models for estimating software development
    costs.

    +   - Parameters include:

    +     - **Function points**: Technology-independent assessments of the functions
    involved in developing a system.

    +     - **Source Lines of Code (SLOC)**: A human-written line of code that is
    not a blank line or comment.

    +   - Boehm suggests that only parametric models do not suffer from the limits
    of human decision-making.'
