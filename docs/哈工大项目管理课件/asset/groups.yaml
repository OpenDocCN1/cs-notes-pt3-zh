  - '[PAGE 465]


    # Top Ten Risk Item Tracking


    +   - **Top Ten Risk Item Tracking** is a qualitative risk analysis tool that
    helps to identify risks and maintain an awareness of risks throughout the life
    of a project.

    +   - Establish a periodic review of the top ten project risk items.

    +   - List the current ranking, previous ranking, number of times the risk appears
    on the list over a period of time, and a summary of progress made in resolving
    the risk item.'
  - '[PAGE 466]


    # Table 11-7. Example of Top Ten Risk Item Tracking


    |  | Monthly Ranking |  |

    |---|---|---|

    | Risk Item | This Month | Last Month | Number of Months | Risk Resolution Progress
    |

    | Inadequate planning | 1 | 2 | 4 | Working on revising the entire project plan
    |

    | Poor definition of scope | 2 | 3 | 3 | Holding meetings with project customer
    and sponsor to clarify scope |

    | Absence of leadership | 3 | 1 | 2 | Just assigned a new project manager to lead
    the project after old one quit |

    | Poor cost estimates | 4 | 4 | 3 | Revising cost estimates |

    | Poor time estimates | 5 | 5 | 3 | Revising schedule estimates |'
  - '[PAGE 467]


    <!-- no content -->'
  - '[PAGE 468]


    # Quantitative Risk Analysis


    +   - Often follows qualitative risk analysis, but both can be done together.

    +   - Large, complex projects involving leading edge technologies often require
    extensive quantitative risk analysis.

    +   - Main techniques include:

    +     - Decision tree analysis

    +     - Simulation

    +     - Sensitivity analysis'
  - '[PAGE 469]


    # Decision Trees and Expected Monetary Value (EMV)


    +   - A **decision tree** is a diagramming analysis technique used to help select
    the best course of action in situations in which future outcomes are uncertain.

    +   - **Estimated monetary value (EMV)** is the product of a risk event probability
    and the risk event’s monetary value.

    +   - You can draw a decision tree to help find the EMV.'
  - '[PAGE 470]


    # Figure 11-8. Expected Monetary Value (EMV) Example


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_470_0.png)


    Project 1’s EMV = $60,000 −32,000 = $28,000

    Project 2’s EMV = −$10,000 −2,000 + 42,000 = $30,000'
  - '[PAGE 471]


    # Simulation


    +   - Simulation uses a representation or model of a system to analyze the expected
    behavior or performance of the system.

    +   - **Monte Carlo analysis** simulates a model’s outcome many times to provide
    a statistical distribution of the calculated results.

    +   - To use a Monte Carlo simulation, you must have three estimates (most likely,
    pessimistic, and optimistic) plus an estimate of the likelihood of the estimate
    being between the most likely and optimistic values.'
  - '[PAGE 472]


    # Steps of a Monte Carlo Analysis


    +   1. Assess the range for the variables being considered.

    +   2. Determine the probability distribution of each variable.

    +   3. For each variable, select a random value based on the probability distribution.

    +   4. Run a deterministic analysis or one pass through the model.

    +   5. Repeat steps 3 and 4 many times to obtain the probability distribution
    of the model’s results.'
