    \ reason cited for investing in IT projects.\n  - Companies with consolidated\
    \ IT operations have a 24 percent lower operational cost per end user.\n  - The\
    \ consistent use of IT standards lowers application development costs by 41 percent\
    \ per user.*\n\n> *Cosgrove Ware, Lorraine, “By the Numbers,” CIO Magazine (www.cio.com)\
    \ (September 1, 2002).\n"
