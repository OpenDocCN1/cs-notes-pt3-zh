    | Knowledge Area | Risk Conditions |

    |---|---|

    | Integration | Inadequate planning; poor resource allocation; poor integration
    management; lack of post-project review |

    | Scope | Poor definition of scope or work packages; incomplete definition of
    quality requirements; inadequate scope control |

    | Time | Errors in estimating time or resource availability; poor allocation and
    management of float; early release of competitive products |

    | Cost | Estimating errors; inadequate productivity, cost, change, or contingency
    control; poor maintenance, security, purchasing, etc. |

    | Quality | Poor attitude toward quality; substandard design/materials/workmanship;
    inadequate quality assurance program |

    | Human Resources | Poor conflict management; poor project organization and definition
    of responsibilities; absence of leadership |

    | Communications | Carelessness in planning or communicating; lack of consultation
    with key stakeholders |

    | Risk | Ignoring risk; unclear assignment of risk; poor insurance management
    |

    | Procurement | Unenforceable conditions or contract clauses; adversarial relations
    |'
