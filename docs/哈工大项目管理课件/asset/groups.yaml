  - '[PAGE 282]


    # Design of Experiments


    +   - **Design of experiments** is a quality planning technique that helps identify
    which variables have the most influence on the overall outcome of a process.

    +   - Also applies to project management issues, such as cost and schedule trade-offs.

    +   - Involves documenting important factors that directly contribute to meeting
    customer requirements.'
  - '[PAGE 283]


    # Scope Aspects of IT Projects


    +   - **Functionality** is the degree to which a system performs its intended
    function.

    +   - **Features** are the system’s special characteristics that appeal to users.

    +   - **System outputs** are the screens and reports the system generates.

    +   - **Performance** addresses how well a product or service performs the customer’s
    intended use.

    +   - **Reliability** is the ability of a product or service to perform as expected
    under normal conditions.

    +   - **Maintainability** addresses the ease of performing maintenance on a product.'
  - '[PAGE 284]


    # Who''s Responsible for the Quality of Projects?


    +   - Project managers are ultimately responsible for quality management on their
    projects.

    +   - Several organizations and references can help project managers and their
    teams understand quality.

    +     - International Organization for Standardization (www.iso.org)

    +     - IEEE (www.ieee.org)'
  - '[PAGE 285]


    # Quality Assurance


    +   - Quality assurance includes all the activities related to satisfying the
    relevant quality standards for a project.

    +   - Another goal of quality assurance is continuous quality improvement.

    +   - **Benchmarking** generates ideas for quality improvements by comparing specific
    project practices or product characteristics to those of other projects or products
    within or outside the performing organization.

    +   - A **quality audit** is a structured review of specific quality management
    activities that help identify lessons learned that could improve performance on
    current or future projects.'
  - '[PAGE 286]


    # Table 8-1. Table of Contents for a Quality Assurance Plan*


    +   1.0 Draft Quality Assurance Plan

    +   1.1 Introduction

    +   1.2 Purpose

    +   1.3 Policy Statement

