  - '[PAGE 299]


    # Six Sigma Uses a Conversion Table


    +   - Using a normal curve, if a process is at six sigma, there would be no more
    than two defective units per billion produced.

    +   - Six Sigma uses a scoring system that accounts for time, an important factor
    in determining process variations.

    +   - **Yield** represents the number of units handled correctly through the process
    steps.

    +   - A **defect** is any instance where the product or service fails to meet
    customer requirements.

    +   - There can be several opportunities to have a defect.'
  - '[PAGE 300]


    # Figure 8-2. Normal Distribution and Standard Deviation


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_300_0.png)


    The normal curve'
  - '[PAGE 301]


    # Table 8-3. Sigma and Defective Units


    | Specification Range (in +/- Sigmas) | Percent of Population Within Range | Defective
    Units Per Million |

    |-------------------------------------|-----------------------------------|------------------------------|

    | 1 | 68.27 | 317,300,000 |

    | 2 | 95.45 | 45,400,000 |

    | 3 | 99.73 | 2,700,000 |

    | 4 | 99.9937 | 63,000 |

    | 5 | 99.999943 | 57 |

    | 6 | 99.9999998 | 2 |'
  - '[PAGE 302]


    # Table 8-4: Six Sigma Conversion Table


    | SIGMA | YIELD | DEFECTS PER MILLION OPPORTUNITIES (DPMO) |

    |---|---|---|

    | 1 | 31.0% | 690,000 |

    | 2 | 69.2% | 308,000 |

    | 3 | 93.3% | 66,800 |

    | 4 | 99.4% | 6,210 |

    | 5 | 99.97% | 230 |

    | 6 | 99.99966% | 3.4 |


    The Six Sigma convention for determining defects is based on the above conversion
    table. It accounts for a 1.5 sigma shift to measure the number of defects per
    million opportunities instead of the number of defects per unit.'
  - '[PAGE 303]


    # Quality Control Charts and the Seven Run Rule


    +   - A control chart is a graphic display of data that illustrates the results
    of a process over time. It helps prevent defects and allows you to determine whether
    a process is in control or out of control.

    +   - The seven run rule states that if seven data points in a row are all below
    the mean, above the mean, or are all increasing or decreasing, then the process
    needs to be examined for non-random problems.'
  - '[PAGE 304]


    <!-- no content -->'
  - '[PAGE 305]


    # Quality Control Charts


    +   - A **control chart** is a graphic display of data that illustrates the results
    of a process over time.

    +   - The main use of control charts is to prevent defects, rather than to detect
    or reject them.

    +   - Quality control charts allow you to determine whether a process is in control
    or out of control.

    +     - When a process is in control, any variations in the results of the process
    are created by random events; processes that are in control do not need to be
    adjusted.

    +     - When a process is out of control, variations in the results of the process
    are caused by non-random events; you need to identify the causes of those non-random
    events and adjust the process to correct or eliminate them.'
  - '[PAGE 306]


    # The Seven Run Rule


    +   - You can use quality control charts and the seven run rule to look for patterns
    in data.


    +   - The **seven run rule** states that if seven data points in a row are all
    below the mean, above the mean, or are all increasing or decreasing, then the
    process needs to be examined for non-random problems.'
  - '[PAGE 307]


    # Figure 8-3. Sample Quality Control Chart


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_307_0.png)


    ★ Denotes violation of 7 run rule'
  - '[PAGE 308]


    # Testing


    +   - Many IT professionals think of testing as a stage that comes near the end
    of IT product development.

    +   - Testing should be done during almost every phase of the IT product development
    life cycle.'
  - '[PAGE 309]


    # Figure 8-4. Testing Tasks in the Software Development Life Cycle


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_309_0.png)'
  - '[PAGE 310]


    # Types of Tests


    +   - **Unit testing** tests each individual component (often a program) to ensure
    it is as defect-free as possible.

    +   - **Integration testing** occurs between unit and system testing to test functionally
    grouped components.

    +   - **System testing** tests the entire system as one entity.

    +   - **User acceptance testing** is an independent test performed by end users
    prior to accepting the delivered system.'
