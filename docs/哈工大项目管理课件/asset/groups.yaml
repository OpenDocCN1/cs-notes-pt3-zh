  - '[PAGE 505]


    # Contract Statement of Work

    (SOW)


    +   - A **statement of work** is a description of the work required for the procurement.

    +   - If a SOW is used as part of a contract to describe only the work required
    for that particular contract, it is called a **contract statement of work**.

    +   - A SOW is a type of scope statement.

    +   - A good SOW gives bidders a better understanding of the buyer’s expectations.'
  - "[PAGE 506]\n\n# Figure 12-2. Statement of Work (SOW) Template\n\n+   I. **Scope\
    \ of Work:** Describe the work to be done to detail. Specify the hardware and\
    \ software involved and the exact nature of the work.\n+   \n+   II. **Location\
    \ of Work:** Describe where the work must be performed. Specify the location of\
    \ hardware and software and where the people must perform the work\n+   \n+  \
    \ III. **Period of Performance:** Specify when the work is expected to start and\
    \ end, working hours, number of hours that can be billed per week, where the work\
    \ must be performed, and related schedule information.\n+   \n+   IV. **Deliverables\
    \ Schedule:** List specific deliverables, describe them in detail, and specify\
    \ when they are due.\n+   \n+   V. **Applicable Standards:** Specify any company\
    \ or industry-specific standards that are relevant to performing the work.\n+\
    \   \n+   VI. **Acceptance Criteria:** Describe how the buyer organization will\
    \ determine if the work is acceptable.\n+   \n+   VII. **Special Requirements:**\
    \ Specify any special requirements such as hardware or software certifications,\
    \ minimum degree or experience level of personnel, travel requirements, and so\
    \ on."
