    \ controlling, and closing an IT project.\n- You can download templates for creating\
    \ your own project management documents from the companion Web site for this text.\n\
    - This case study provides a big picture view of managing a project. Later chapters\
    \ provide detailed information on each knowledge area.\n\n### Project Initiation\n\
    \n- Initiating a project includes recognizing and starting a new project or project\
    \ phase.\n- Some organizations use a pre-initiation phase, while others include\
    \ items such as developing a business case as part of the initiation.\n- The main\
    \ goal is to formally select and start off projects.\n- Key outputs include:\n\
    \  - Assigning the project manager.\n  - Identifying key stakeholders.\n  - Completing\
    \ a business case.\n  - Completing a project charter and getting signatures on\
    \ it.\n"
  mdcn: "\n## Mapping the Process Groups to the Knowledge Areas\n\n- You can map the\
