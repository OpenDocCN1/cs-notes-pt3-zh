  - '[PAGE 442]


    # Risk Management Planning


    +   - The main output of risk management planning is a risk **management plan**—a
    plan that documents the procedures for managing risk throughout a project.

    +   - The project team should review project documents and understand the organization’s
    and the sponsor’s approaches to risk.

    +   - The level of detail will vary with the needs of the project.'
  - '[PAGE 443]


    # Table 11-2. Topics Addressed in a Risk Management Plan


    +   - Methodology

    +   - Roles and responsibilities

    +   - Budget and schedule

    +   - Risk categories

    +   - Risk probability and impact

    +   - Risk documentation'
  - '[PAGE 444]


    # Contingency and Fallback Plans, Contingency Reserves


    +   - **Contingency plans** are predefined actions that the project team will
    take if an identified risk event occurs.

    +   - **Fallback plans** are developed for risks that have a high impact on meeting
    project objectives, and are put into effect if attempts to reduce the risk are
    not effective.

    +   - **Contingency reserves** or **allowances** are provisions held by the project
    sponsor or organization to reduce the risk of cost or schedule overruns to an
    acceptable level.'
  - '[PAGE 445]


    # Common Sources of Risk in Information Technology Projects


    +   - Several studies show that IT projects share some common sources of risk.

    +   - The Standish Group developed an IT success potential scoring sheet based
    on potential risks.

    +   - Other broad categories of risk help identify potential risks.'
