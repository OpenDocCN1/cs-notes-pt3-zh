  - '[PAGE 483]


    # Using Software to Assist in

    Project Risk Management


    +   - Risk registers can be created in a simple Word or Excel file or as part
    of a database.

    +   - More sophisticated risk management software, such as Monte Carlo simulation
    tools, help in analyzing project risks.

    +   - The PMI Risk Specific Interest Group’s Web site at *www.risksig.com* has
    a detailed list of software products to assist in risk management.'
  - '[PAGE 484]


    # Results of Good Project Risk Management


    +   - Unlike crisis management, good project risk management often goes unnoticed.

    +   - Well-run projects appear to be almost effortless, but a lot of work goes
    into running a project well.

    +   - Project managers should strive to make their jobs look easy to reflect the
    results of well-run projects.'
  - '[PAGE 485]


    # Chapter Summary


    +   - Project risk management is the art and science of identifying, analyzing,
    and responding to risk throughout the life of a project and in the best interests
    of meeting project objectives.

    +   - Main processes include:

    +     - Risk management planning

    +     - Risk identification

    +     - Qualitative risk analysis

    +     - Quantitative risk analysis

    +     - Risk response planning

    +     - Risk monitoring and control'
