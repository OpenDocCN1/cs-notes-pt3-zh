    # Table 10-3. Expectations Management Matrix


    | Measure of Success | Priority | Expectations | Guidelines |

    |---|---|---|---|

    | Scope | 2 | The scope statement clearly defines mandatory requirements and optional
    requirements. | Focus on meeting mandatory requirements before considering optional
    ones. |

    | Time | 1 | There is no give in the project completion date. Every major deadline
    must be met, and the schedule is very realistic. | The project sponsor and program
    manager must be alerted if there are any issues that might affect meeting schedule
    goals. |

    | Cost | 3 | This project is crucial to the organization. If you can clearly justify
    the need for more funds, they can be made available. | There are strict rules
    for project expenditures and escalation procedures. Cost is very important, but
    it takes a back seat to meeting schedule and then scope goals. |

    | Etc. |  |  |  |'
