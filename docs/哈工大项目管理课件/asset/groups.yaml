  - '[PAGE 497]


    # Tools and Techniques for Planning Purchases and Acquisitions


    +   - **Make-or-buy analysis**: General management technique used to determine
    whether an organization should make or perform a particular product or service
    inside the organization or buy from someone else.

    +   - Often involves financial analysis.

    +   - Experts, both internal and external, can provide valuable inputs in procurement
    decisions.'
  - '[PAGE 498]


    # Make-or-Buy Example


    +   - Assume you can lease an item you need for a project for $800/day. To purchase
    the item, the cost is $12,000 plus a daily operational cost of $400/day.

    +   - How long will it take for the purchase cost to be the same as the lease
    cost?'
  - '[PAGE 499]


    # Make-or Buy Solution


    +   - Set up an equation so both options, purchase and lease, are equal.

    +   - In this example, use the following equation. Let *d* be the number of days
    to use the item:

    +     $12,000 + $400d = $800d

    +     Subtracting $400d from both sides, you get:

    +     $12,000 = $400d

    +     Dividing both sides by $400, you get:

    +     d = 30

    +   - If you need the item for more than 30 days, it is more economical to purchase
    it.'
  - '[PAGE 500]


    # Types of Contracts


    +   - Different types of contracts can be used in different situations:

    +     - **Fixed price** or **lump sum** contracts: Involve a fixed total price
    for a well-defined product or service.

    +     - **Cost reimbursable** contracts: Involve payment to the seller for direct
    and indirect costs.

    +     - **Time and material** contracts: Hybrid of both fixed price and cost reimbursable
    contracts, often used by consultants.

    +     - **Unit price** contracts: Require the buyer to pay the seller a predetermined
    amount per unit of service.

    +   - A single contract can actually include all four of these categories, if
    it makes sense for that particular procurement.'
  - '[PAGE 501]


    # Cost Reimbursable Contracts


    +   - **Cost plus incentive fee (CPIF)**: The buyer pays the supplier for allowable
    performance costs plus a predetermined fee and an incentive bonus.

    +   - **Cost plus fixed fee (CPFF)**: The buyer pays the supplier for allowable
    performance costs plus a fixed fee payment usually based on a percentage of estimated
    costs.

    +   - **Cost plus percentage of costs (CPPC)**: The buyer pays the supplier for
    allowable performance costs plus a predetermined percentage based on total costs.'
