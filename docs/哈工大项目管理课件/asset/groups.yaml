    \ rationals, are attracted to technology fields.\n- IT people vary most from the\
    \ general population in their tendency to not be extroverted or sensing.\n\n##\
    \ MBTI and Suitability to Project Work*\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_374_0.png)\n\
