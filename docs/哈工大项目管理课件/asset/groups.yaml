    \ projects also encourages more commitment.\n\n## Need for Organizational Standards\n\
    \n- Standards and guidelines help project managers be more effective.\n- Senior\
    \ management can encourage:\n  - The use of standard forms and software for project\
    \ management.\n  - The development and use of guidelines for writing project plans\
    \ or providing status information.\n  - The creation of a project management office\
    \ or center of excellence.\n\n## Project Phases and the Project Life Cycle\n\n\
    - **A project life cycle** is a collection of project phases that defines:\n \
    \ - What work will be performed in each phase.\n  - What deliverables will be\
    \ produced and when.\n  - Who is involved in each phase.\n  - How management will\
    \ control and approve work produced in each phase.\n- **A deliverable** is a product\
    \ or service produced or provided as part of a project.\n\n## More on Project\
    \ Phases\n\n- In the early phases of a project life cycle:\n  - Resource needs\
    \ are usually lowest.\n  - The level of uncertainty (risk) is highest.\n  - Project\
    \ stakeholders have the greatest opportunity to influence the project.\n- In the\
    \ middle phases of a project life cycle:\n  - The certainty of completing a project\
    \ increases.\n  - More resources are needed.\n- In the final phase of a project\
    \ life cycle:\n  - The focus is on ensuring that project requirements were met.\n\
    \  - The sponsor approves completion of the project.\n\n## Figure 2-3. Phases\
    \ of the Traditional Project Life Cycle\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_67_0.png)\n\
    \n## Product Life Cycles\n\n- Products also have life cycles.\n- A **systems development\
    \ life cycle (SDLC)** is a framework for describing the phases involved in developing\
    \ information systems.\n- Systems development projects can follow:\n  - **Predictive\
    \ life cycle:** The scope of the project can be clearly articulated and the schedule\
    \ and cost can be predicted.\n  - **Adaptive Software Development (ASD) life cycle:**\
    \ Projects are mission driven and component based, and use time-based cycles to\
    \ meet target dates.\n\n## Predictive Life Cycle Models\n\n- **Waterfall model**:\
    \ Has well-defined, linear stages of systems development and support.\n- **Spiral\
    \ model**: Shows that software is developed using an iterative or spiral approach\
    \ rather than a linear approach.\n- **Incremental build model**: Provides for\
    \ progressive development of operational software.\n- **Prototyping model**: Used\
    \ for developing prototypes to clarify user requirements.\n- **Rapid Application\
    \ Development (RAD) model**: Used to produce systems quickly without sacrificing\
    \ quality.\n\n## Adaptive Life Cycle Models\n\n- **Extreme programming (XP)**:\
    \ Developers program in pairs and must write the tests for their own code. XP\
    \ teams include developers, managers, and users.\n- **Scrum**: Iterative development\
    \ in which repetitions are referred to as sprints, which normally last thirty\
    \ days. Teams often meet each day for a short meeting, called a scrum, to decide\
    \ what to accomplish that day. Works best for object-oriented technology projects\
    \ and require strong leadership to coordinate the work.\n"
