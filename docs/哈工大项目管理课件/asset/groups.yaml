  - '[PAGE 222]


    # Critical Chain Scheduling


    +   - **Critical chain scheduling** is a method of scheduling that considers limited
    resources when creating a project schedule and includes buffers to protect the
    project completion date.

    +   - Uses the **Theory of Constraints (TOC)**, a management philosophy developed
    by Eliyahu M. Goldratt and introduced in his book *The Goal*.

    +   - Attempts to minimize **multitasking**, which occurs when a resource works
    on more than one task at a time.'
  - '[PAGE 223]


    # Multitasking Example


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_223_0.png)


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_223_1.png)'
  - '[PAGE 224]


    # Buffers and Critical Chain


    +   - A **buffer** is additional time to complete a task.

    +   - **Murphy’s Law** states that if something can go wrong, it will.

    +   - **Parkinson’s Law** states that work expands to fill the time allowed.

    +   - In traditional estimates, people often add a buffer to each task and use
    the additional time whether it’s needed or not.

    +   - Critical chain scheduling removes buffers from individual tasks and instead
    creates:

    +     - A **project buffer** or additional time added before the project’s due
    date.

    +     - **Feeding buffers** or additional time added before tasks on the critical
    path.'
  - '[PAGE 225]


    # Figure 6-11. Example of Critical Chain Scheduling


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_225_0.png)


    X = Tasks done by limited resource

    FB = Feeding buffer'
  - '[PAGE 226]


    # # Program Evaluation and Review Technique (PERT)


    +   - PERT is a network analysis technique used to estimate project duration when
    there is a high degree of uncertainty about the individual activity duration estimates.


    +   - PERT uses probabilistic time estimates:


    +   - Duration estimates based on using optimistic, most likely, and pessimistic
    estimates of activity durations, or a three-point estimate.'
  - '[PAGE 227]


    # PERT Formula and Example


    +   - PERT weighted average =

    +     \frac{optimistic time + 4X most likely time + pessimistic time}{6}

    +   - Example:

    +     PERT weighted average =

    +     \frac{8 workdays + 4 X 10 workdays + 24 workdays}{6} = **12 days**

    +     where:

    +     optimistic time= 8 days

    +     most likely time = **10 days**

    +     pessimistic time = 24 days

    +     Therefore, you’d use **12 days** on the network diagram instead of 10 when
    using PERT for the above example.'
  - '[PAGE 228]


    # Schedule Control


    +   - Perform reality checks on schedules.

    +   - Allow for contingencies.

    +   - Don’t plan for everyone to work at 100 percent capacity all the time.

    +   - Hold progress meetings with stakeholders and be clear and honest in communicating
    schedule issues.'
  - '[PAGE 229]


    # Schedule Control


    +   - Goals are to know the status of the schedule, influence factors that cause
    schedule changes, determine that the schedule has changed, and manage changes
    when they occur.

    +   - Tools and techniques include:

    +     - Progress reports.

    +     - A schedule change control system.

    +     - Project management software, including schedule comparison charts, such
    as the tracking Gantt chart.

    +     - Variance analysis, such as analyzing float or slack.

    +     - Performance management, such as earned value (see Chapter 7).'
  - '[PAGE 230]


    # Reality Checks on Scheduling


    +   - Review the draft schedule or estimated completion date in the project charter.

    +   - Prepare a more detailed schedule with the project team.

    +   - Make sure the schedule is realistic and followed.

    +   - Alert top management well in advance if there are schedule problems.'
  - '[PAGE 231]


    # # Working with People Issues


