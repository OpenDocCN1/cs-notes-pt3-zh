  - '[PAGE 402]


    # Personal Preferences Affect Communication Needs


    +   - Introverts like more private communications, while extroverts like to discuss
    things in public.

    +   - Intuitive people like to understand the big picture, while sensing people
    need step-by-step details.

    +   - Thinkers want to know the logic behind decisions, while feeling people want
    to know how something affects them personally.

    +   - Judging people are driven to meet deadlines while perceiving people need
    more help in developing and following plans.'
  - '[PAGE 403]


    # Other Communication Considerations


    +   - Rarely does the receiver interpret a message exactly as the sender intended.

    +   - Geographic location and cultural background affect the complexity of project
    communications.

    +     - Different working hours

    +     - Language barriers

    +     - Different cultural norms'
  - '[PAGE 404]


    # Setting the Stage for Communicating

    Bad News


    Dear Mom and Dad, or should I say Grandma & Grandpa,


    Yes, I am pregnant. No, I’m not married yet since Larry, my boyfriend, is out
    of a job. Larry’s employers just don’t seem to appreciate the skills he has learned
    since he quit high school. Larry looks much younger than you, Dad, even though
    he is three years older. I’m quitting college and getting a job so we can get
    an apartment before the baby is born. I found a beautiful apartment above a 24-hour
    auto repair garage with good insulation so the exhaust fumes and noise won’t bother
    us.


    I’m very happy. I thought you would be too.


    Love, Ashley


    P.S. There is no Larry. I’m not pregnant. I’m not getting married. I’m not quitting
    school, but I am getting a “D” in Chemistry. I just wanted you to have some perspective.'
  - '[PAGE 405]


    # Determining the Number of Communications Channels


    +   - As the number of people involved increases, the complexity of communications
    increases because there are more communications channels or pathways through which
    people can communicate.

    +   - Number of communications channels = n(n-1)/2

    +     where n is the number of people involved.'
  - '[PAGE 406]


    # Figure 10-1. The Impact of the Number of People on Communications Channels


    number of communications channels = n(n-1)/2


    2 people, 1 communications channel


    3 people, 3 communications channels


    4 people, 6 communications channels, etc.


