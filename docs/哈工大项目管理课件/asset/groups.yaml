    ## Figure 8-4. Testing Tasks in the Software Development Life Cycle\n\n![](img/1db87b9b55fa1232e052e0dffad9e0c7_309_0.png)\n\
    \n## Types of Tests\n\n- **Unit testing** tests each individual component (often\
    \ a program) to ensure it is as defect-free as possible.\n- **Integration testing**\
    \ occurs between unit and system testing to test functionally grouped components.\n\
    - **System testing** tests the entire system as one entity.\n- **User acceptance\
    \ testing** is an independent test performed by end users prior to accepting the\
