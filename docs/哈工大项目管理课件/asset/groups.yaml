    # Figure 1-5. Sample Network Diaaram


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_37_0.png)


    Each box is a project task from the WBS. Arrows show dependencies between tasks.
    The bolded tasks are on the critical path. If any task on the critical path takes
    longer to complete than planned, the whole project will slip unless something
    is done. Network diagrams were first used in 1958 on the Navy Polaris project
    before project management software was available.'
  - '[PAGE 38]


    # Project Management Office (PMO)


    A PMO is an organizational group responsible for coordinating the project management
    function throughout an organization.


    +   - Possible goals include:

    +     - Collect, organize, and integrate project data for the entire organization.

    +     - Develop and maintain templates for project documents.

    +     - Develop or coordinate training in various project management topics.

    +     - Develop and provide a formal career path for project managers.

    +     - Provide project management consulting services.

    +     - Provide a structure to house project managers while they are acting in
    those roles or are between projects.'
  - '[PAGE 39]


    # Project Management Software


    +   - Enterprise PM software integrates information from multiple projects to
    show the status of active, approved, and future projects across an entire organization.

    +   - It also provides links to more detailed information on each project.

    +   - Many managers like to see status in color – red, yellow, and green.'
