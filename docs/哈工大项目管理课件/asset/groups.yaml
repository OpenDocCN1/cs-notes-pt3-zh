  - '[PAGE 25]


    # The Role of the Project Manager


    +   - Job descriptions vary, but most include responsibilities such as planning,
    scheduling, coordinating, and working with people to achieve project goals.

    +   - Remember that 97 percent of successful projects were led by experienced
    project managers.'
  - '[PAGE 26]


    # Table 1-3. Fifteen Project Management Job Functions*


    +   - Define scope of project.

    +   - Identify stakeholders, decision-makers, and escalation procedures.

    +   - Develop detailed task list (work breakdown structures).

    +   - Estimate time requirements.

    +   - Develop initial project management flow chart.

    +   - Identify required resources and budget.

    +   - Evaluate project requirements.

    +   - Identify and evaluate risks.

    +   - Prepare contingency plan.

    +   - Identify interdependencies.

    +   - Identify and track critical milestones.

    +   - Participate in project phase review.

    +   - Secure needed resources.

    +   - Manage the change control process.

    +   - Report project status.


    > *Northwest Center for Emerging Technologies, “Building a Foundation for Tomorrow:
    Skills Standards for Information Technology,” Bellevue, WA, 1999.


    Information Technology Project Management, Fourth Edition'
  - '[PAGE 27]


    # Suggested Skills for Project Managers


    +   - Project managers need a wide variety of skills.

    +   - They should:

    +     - Be comfortable with change.

    +     - Understand the organizations they work in and with.

    +     - Lead teams to accomplish project goals.'
  - '[PAGE 28]


    # Suggested Skills for Project Managers


    +   - Project managers need both “hard” and “soft” skills.

    +     - **Hard skills** include product knowledge and knowing how to use various
    project management tools and techniques.

    +     - **Soft skills** include being able to work with various types of people.'
