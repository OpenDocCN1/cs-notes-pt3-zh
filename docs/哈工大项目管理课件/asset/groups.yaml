    +   - People seem to accept systems being down occasionally or needing to reboot
    their PCs.

    +   - But quality is very important in many IT projects.'
  - '[PAGE 278]


    # What Went Wrong?


    +   - In 1981, a small timing difference caused by a computer program caused a
    launch abort.*

    +   - In 1986, two hospital patients died after receiving fatal doses of radiation
    from a Therac 25 machine after a software problem caused the machine to ignore
    calibration data.**

    +   - Britain’s Coast Guard was unable to use its computers for several hours
    in May 2004 after being hit by the Sasser virus, which knocked out the electronic
    mapping systems, e-mail, and other computer functions, forcing workers to revert
    to pen, paper, and radios.***


    *Design News (February 1988).

    **Datamation (May 1987).

    ***Fleming, Nic, “Virus sends coastguard computers off course” (http://news.telegraph.co.uk/news/main.jhtml?xml=/news/2004/05/05/ncoast05.xml)
    (May 15, 2004).'
  - '[PAGE 279]


    # # What Is Quality?


    The International Organization for Standardization (ISO) defines quality as “the
    degree to which a set of inherent characteristics fulfils requirements” (ISO9000:2000).


    Other experts define quality based on:


    Conformance to requirements: The project’s processes and products meet written
    specifications.


    Fitness for use: A product can be used as it was intended.'
  - '[PAGE 280]


    # What Is Project Quality Management?


    +   - Project quality management ensures that the project will satisfy the needs
    for which it was undertaken.

    +   - Processes include:

    +     - **Quality planning**: Identifying which quality standards are relevant
    to the project and how to satisfy them.

    +     - **Quality assurance**: Periodically evaluating overall project performance
    to ensure the project will satisfy the relevant quality standards.

    +     - **Quality control**: Monitoring specific project results to ensure that
    they comply with the relevant quality standards.'
  - '[PAGE 281]


    # Quality Planning


    +   - Implies the ability to anticipate situations and prepare actions to bring
    about the desired outcome.

    +   - Important to prevent defects by:

    +     - Selecting proper materials.

    +     - Training and indoctrinating people in quality.

    +     - Planning a process that ensures the appropriate outcome.'
