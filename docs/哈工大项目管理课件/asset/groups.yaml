    \ distribution of resource use and reduce overallocation.\n\n## Figure 9-8. Resource\
    \ Leveling Example\n\nThe project network with Activities A, B, and C and durations\
    \ as shown. Activity A has 3 days of slack, and Activity C has 2 days of slack.\
