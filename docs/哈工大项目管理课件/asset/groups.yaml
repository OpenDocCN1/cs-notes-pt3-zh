    \ about worker motivation. He distinguished between:\n  - **Motivational factors**:\
    \ Achievement, recognition, the work itself, responsibility, advancement, and\
    \ growth. These factors produce job satisfaction.\n  - **Hygiene factors**: Larger\
    \ salaries, more supervision, and a more attractive work environment. These factors\
    \ cause dissatisfaction if not present, but do not motivate workers to do more.\n\
    \n## McClelland’s Acquired-Needs Theory\n\nSpecific needs are acquired or learned\
    \ over time and are shaped by life experiences. The following are the main categories\
    \ of acquired needs:\n\n- **Achievement (nAch)**: People with a high need for\
    \ achievement like challenging projects with attainable goals and lots of feedback.\n\
    - **Affiliation (nAff)**: People with high need for affiliation desire harmonious\
    \ relationships and need to feel accepted by others, so managers should try to\
    \ create a cooperative work environment for them.\n- **Power (nPow)**: People\
    \ with a need for power desire either personal power (not good) or institutional\
    \ power (good for the organization). Provide institutional power seekers with\
    \ management opportunities.\n\n## McGregor’s Theory X and Y\n\n- Douglas McGregor\
    \ popularized the human relations approach to management in the 1960s.\n- **Theory\
    \ X:** Assumes workers dislike and avoid work, so managers must use coercion,\
    \ threats, and various control schemes to get workers to meet objectives.\n- **Theory\
    \ Y:** Assumes individuals consider work as natural as play or rest and enjoy\
    \ the satisfaction of esteem and self-actualization needs.\n- **Theory Z:** Introduced\
    \ in 1981 by William Ouchi and is based on the Japanese approach to motivating\
    \ workers, which emphasizes trust, quality, collective decision making, and cultural\
    \ values.\n\n## Thamhain and Wilemon’s Ways to Have Influence on Projects\n\n\
    - 1. **Authority**: The legitimate hierarchical right to issue orders.\n- 2. **Assignment**:\
    \ The project manager's perceived ability to influence a worker's later work assignments.\n\
    - 3. **Budget**: The project manager's perceived ability to authorize others'\
    \ use of discretionary funds.\n- 4. **Promotion**: The ability to improve a worker's\
    \ position.\n- 5. **Money**: The ability to increase a worker's pay and benefits.\n\
    - 6. Penalty: The project manager's ability to cause punishment.\n- 7. Work challenge:\
    \ The ability to assign work that capitalizes on a worker's enjoyment of doing\
    \ a particular task.\n- 8. Expertise: The project manager's perceived special\
    \ knowledge that others deem important.\n- 9. Friendship: The ability to establish\
    \ friendly personal relationships between the project manager and others.\n\n\
    ## Ways to Influence that Help and Hurt Projects\n\n- Projects are more likely\
    \ to *succeed* when project managers influence people using:\n  - Expertise\n\
    \  - Work challenge\n- Projects are more likely to *fail* when project managers\
    \ rely too heavily on:\n  - Authority\n  - Money\n  - Penalty\n\n## Improving\
    \ Effectiveness: Covey’s Seven Habits\n\n- Project managers can apply Covey’s\
    \ seven habits to improve effectiveness on projects.\n  - Be proactive.\n  - Begin\
    \ with the end in mind.\n  - Put first things first.\n  - Think win/win.\n  -\
    \ Seek first to understand, then to be understood.\n  - Synergize.\n  - Sharpen\
    \ the saw.\n"
