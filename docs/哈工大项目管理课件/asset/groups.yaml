    +   4.0 Quality Assurance Procedures

    +   4.1 Walkthrough Procedure

    +   4.2 Review Process

    +   4.2.1 Review Procedures

    +   4.3 Audit Process

    +   4.3.1 Audit Procedures

    +   4.4 Evaluation Process

    +   4.5 Process Improvement

    +   5.0 Problem Reporting Procedures

    +   5.1 Noncompliance Reporting Procedures

    +   6.0 Quality Assurance Metrics

    +   Appendix

    +   Quality Assurance Checklist Forms


    *U.S. Department of Energy'
  - '[PAGE 287]


    # Quality Control


    +   - The main outputs of quality control are:

    +     - Acceptance decisions

    +     - Rework

    +     - Process adjustments

    +   - Some tools and techniques include:

    +     - Pareto analysis

    +     - Statistical sampling

    +     - Six Sigma

    +     - Quality control charts'
  - '[PAGE 288]


    # Pareto Analysis


    +   - **Pareto analysis** involves identifying the vital few contributors that
    account for the most quality problems in a system.

    +   - Also called the 80-20 rule, meaning that 80 percent of problems are often
    due to 20 percent of the causes.

    +   - **Pareto diagrams** are histograms, or column charts representing a frequency
    distribution, that help identify and prioritize problem areas.'
  - '[PAGE 289]


    # Figure 8-1. Sample Pareto Diagram


    ![](img/1db87b9b55fa1232e052e0dffad9e0c7_289_0.png)'
  - '[PAGE 290]


    # Statistical Sampling and Standard Deviation


    +   - **Statistical sampling** involves choosing part of a population of interest
    for inspection.

    +   - The size of a sample depends on how representative you want the sample to
    be.

    +   - Sample size formula:

    +     Sample size = .25 X (certainty factor/acceptable error)²

    +   - Be sure to consult with an expert when using statistical analysis.'
