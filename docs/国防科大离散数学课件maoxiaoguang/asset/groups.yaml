    # Definition


    A **bit** has two possible values, 0 and 1. A variable is called a **Boolean variable**
    if its value is either true or false. Hence, a Boolean variable can be represented
    by a bit. A **bit string** is a sequence of zero or more bits. The **length**
    of this string is the number of bits in the string.


    Let x = 01 1011 0110 and y = 11 0001 1101. Compute their bitwise OR, AND and XOR.

    Solution:


    01 1011 0110

    11 0001 1101

    -------------

    11 1011 1111 bitwise OR

    01 0001 0100 bitwise AND

    10 1010 1011 bitwise XOR


