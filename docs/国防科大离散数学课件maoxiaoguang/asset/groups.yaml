  - '[PAGE 502]


    # 证明、定理


    设 Γ₁ ⊢ A₁，Γ₂ ⊢ A₂，…，Γₙ ⊢ Aₙ 是形式推理关系的有限非空序列。如果其中每个 Γₖ ⊢ Aₖ（1≤k≤n），或者它本身是一条规则，或者可由
    Γᵢ₁ ⊢ Aᵢ₁，Γᵢ₂ ⊢ Aᵢ₂，…，Γᵢₘ ⊢ Aᵢₘ（1≤i₁，i₂，…，iₘ<k）按照某规则推出，则称 Γ₁ ⊢ A₁，Γ₂ ⊢ A₂，…，Γₙ
    ⊢ Aₙ 为 Γₙ ⊢ Aₙ 的一个证明。有证明的形式推理关系称为自然推理系统的定理。


    约定：要求证明 Γ ⊢ A，就是要给出它的一个证明。'
