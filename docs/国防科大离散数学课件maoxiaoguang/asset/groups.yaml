    \ listing (*professor*,*course*,*room*,*time*).\n\n## Join Example\n\n| Prof.\
    \ | Course |\n| --- | --- |\n| John | CS202 |\n| Brian | CS340 |\n| Kenny | CS220\
    \ |\n| Kemal | CS215 |\n\nR1\n\n| Course | Class | Time |\n| --- | --- | --- |\n\
