    # Reflexive closure


    +   In order to find the reflexive closure of a relation R, we add a loop at each
    node that does not have one


    +   The reflexive closure of R, r(R), is R U Π_A

    +   Where Π_A = { (a,a) | a ∈ R }

    +   Called the "diagonal relation"

    +   With matrices, we set the diagonal to all 1''s'
