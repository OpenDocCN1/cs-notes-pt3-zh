    Fall 2010


    Mao Xiaoguang'
  - '[PAGE 16]


    # Propositional (Sentential) Logic


    Propositional Logic is the logic of compound statements built from simpler statements
    using so-called Boolean connectives.


    Some applications in computer science:


    +   - Design of digital electronic circuits.

    +   - Expressing conditions in programs.

    +   - Queries to databases & search engines.'
  - '[PAGE 17]


    # Proposition


    A proposition (denoted p, q, r, ...) is simply:


    +   a statement (i.e., a declarative sentence)

    +   with some definite meaning, (not vague or ambiguous)


    +   having a truth value that’s either true (T) or false (F)

    +   it is never both, neither, or somewhere "in between!"

    +   – However, you might not know the actual truth value,

    +   – and, the truth value might depend on the situation or context.


    Later, we will study probability theory, in which we assign degrees of certainty
    ("between" T and F) to propositions.


    +   But for now: think True/False only!'
  - '[PAGE 18]


    # Examples of Propositions


    +   - "It is raining." (In a given situation.)

    +   - "Beijing is the capital of China."

    +   - "1 + 2 = 3"


    # But, the following are NOT propositions:


    +   - "Who’s there?" (interrogative, question)

    +   - "La la la la la." (meaningless interjection)

    +   - "Just do it!" (imperative, command)

    +   - "Yeah, I sorta dunno, whatever..." (vague)

    +   - "1 + 2" (expression with no truth value)'
  - '[PAGE 19]


    <!-- no content -->'
  - '[PAGE 20]


    # Further Proposition Examples


    +   □ It will rain in Changsha tomorrow.

    +   ▶ We cannot know the truth of this statement today, but it is certainly either
    true or false.


    +   □ 2+2=19

    +   ▶ false


    +   □ There are only finitely many prime numbers.

    +   ▶ false


    +   □ Every positive even integer greater than 2 can be written as the sum of
    two prime numbers.

    +   ▶ This is certainly true or false, but no one knows which.

    +   ▶ The proposition is known as Goldbach’s Conjecture.

    +   ▶ It holds for every integer yet tested – e.g, 4=2+2, 6=3+3, 8=3+5 – but no
    one has found a proof that it holds for all even integers greater than two.'
  - '[PAGE 21]


    # Counterexamples


    +   - Where is Ayres Hall?

    +     - This is neither true nor false. It is a question.

    +   - Find Ayres Hall!

    +     - This is neither true nor false. It is a command.

    +   - Blue is the best color to paint a house.

    +     - This is a matter of opinion, not truth. It may be your favorite color,
    but it is not objective truth.

    +   - Coffee tastes better than tea.

    +     - Again, this is a matter of taste, not truth.'
  - '[PAGE 22]


    # Counterexamples


    +   - The integer *n* is even.

    +     - Since *n* has no value, this statement is neither true nor false.

    +     - If *n* is given a value, this statement becomes a proposition.

    +     - Later we will call such statements predicates or propositional functions.
    They are not propositions, but they become propositions when their variables are
    assigned values.'
  - '[PAGE 23]


    # Propositional variables


    +   We use propositional variables to refer to propositions

    +   - Usually are lower case letters starting with p (i.e. *p, q, r, s, etc.*)

    +   - A propositional variable can have one of two values: true (T) or false (F)


    +   A proposition can be...

    +   - A single variable: *p*

    +   - An operation of multiple variables: *p∧(q∨¬r)*'
  - '[PAGE 24]


    # Introduction to logical connectives


    +   - An operator or connective combines one or more operand expressions into
    a larger expression. (e.g., "+" in numeric exprs.)

    +     - Unary operators take 1 operand (e.g., −3); binary operators take 2 operands
    (e.g., 3 × 4).


    +   - Logical connectives are used to form new propositions from two or more existing
    propositions.

    +     - Propositional or Boolean operators operate on propositions (or their truth
    values) instead of on numbers.'
