    \n## 例\n\nP：我们去植树\n\nQ：我们去浇水\n\nP∧Q：我们去植树并且我们去浇水\n\nP：今天下大雨\n\nQ：3+3=6\n\nP∧Q：今天下大雨并且3+3=6\
