  - '[PAGE 89]


    # Theoretical foundation:

    Functionally complete sets of truth-functional connectives?


    +   - A set of logical connectives is called **functionally complete** if every
    compound proposition is logically equivalent to a compound proposition involving
    only this set of logical connectives.

    +   - The following systems of truth-functional connectives are functionally complete:

    +     - `{¬, ∧, ∨}`

    +     - `{¬, ∧}` or `{¬, ∨}`

    +     - `{¬, →}`

    +     - `{↑}` or `{↓}`

    +   - Hence in order to express any truth-value function (and thus any PL formula)
    just one connective suffices!

    +     - Either Scheffer’s NAND ↑ or Pierce’s NOR ↓'
