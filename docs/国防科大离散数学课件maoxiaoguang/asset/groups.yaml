    \ x)Q(x)\\vdash(\\exists x)(\\exists y)(R(x)\\land R(y))$\n\n## 作业\n\n## 习题6.2\n\
    \n- 1. a)　f)　g)\n- 2. a)　e)　f)\n\n## 0812210\n\n## Sets and Graphs\n\nCh 9.1 Graphs\
    \ and Graph Models\n\nSpring 2010\n\nMao Xiaoguang\n\n## Graphs\n\n- A graph G\
    \ = (V, E) consists of V, a nonempty set of vertices, and E, a set of edges. Each\
    \ edge is associated with one or two vertices (an unordered pair of vertices),\
    \ called its endpoints.\n\n- A simple graph is a graph in which each edge connects\
    \ two different vertices and where no multiple edges connect the same pair of\
