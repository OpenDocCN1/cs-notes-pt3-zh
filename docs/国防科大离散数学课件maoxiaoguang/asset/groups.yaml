  - "[PAGE 806]\n\n# Roy-Warshall Algorithm\n\nUses only O(n³) operations!\n\n# Procedure\
    \ Warshall (M_R : rank-n 0-1 matrix)\n\n```\nW := M_R\nfor k := 1 to n\n  for\
    \ i := 1 to n\n    for j := 1 to n\n      w_ij := w_ij ∨ (w_ik ∧ w_kj)\nreturn\
    \ W  {this represents R*}\n```\n\nw_ij = 1 means there is a path from i to j going\
    \ only through nodes ≤k. Indices i and j may have index higher than k."
