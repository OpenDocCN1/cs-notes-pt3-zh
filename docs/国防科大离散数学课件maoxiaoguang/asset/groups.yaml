  - '[PAGE 748]


    # Database operators


    +   - Selection: σ(R, c) = the subset of R that satisfies condition c

    +   - Projection: π(R, {set of fields}) = a new relation identical to R except
    that it has only the specified fields

    +   - Join: J(R, S, {set of fields}) = a new relation that has records with all
    fields from both R and S constructed from matching R and S records. Matching here
    means identical values on {set of fields}.'
