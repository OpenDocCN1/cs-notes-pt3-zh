  - '[PAGE 794]


    # Transitive closure


    +   Informal definition: If there is a path from a to b, then there should be
    an edge from a to b in the transitive closure


    +   First definition:

    +     In order to find the transitive closure of a relation R, we add an edge
    from a to c, when there are edges from a to b and b to c


    +   But there is a path from 1 to 4 with no edge!


    R = { (1,2), (2,3), (3,4) }


    (1,2) & (2,3) ⇒ (1,3)

    (2,3) & (3,4) ⇒ (2,4)


    ![](img/47b87ec6fe4fa238d13429358848c545_794_0.png)


    ![](img/47b87ec6fe4fa238d13429358848c545_794_1.png)'
  - '[PAGE 795]


    # Transitive closure


    +   Informal definition: If there is a path from a to b, then there should be
    an edge from a to b in the transitive closure


    +   Second definition:


    +   In order to find the transitive closure of a relation R, we add an edge from
    a to c, when there are edges from a to b and b to c


    +   Repeat this step until no new edges are added to the relation


    +   We will study different algorithms for determining the transitive closure


    +   red means added on the first repeat


    +   teal means added on the second repeat


