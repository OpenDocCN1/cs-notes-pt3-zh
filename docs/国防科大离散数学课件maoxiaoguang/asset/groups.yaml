  - '[PAGE 871]


    # Recap


    +   - A set is an unordered collection of "objects"

    +   - $a \in S$

    +   - **N**, **Z**, **Z+**, **Q**, **R**

    +   - **U**: Universal set, $\varnothing = \{ \}$

    +   - $S \subseteq T$ if $\forall x\ (x \in S \rightarrow x \in T)$

    +   - $S = T$ if $S \subseteq T$ and $T \subseteq S.$

    +   - $|A|$: number of elements in A

    +   - Power Set: $P(S) = \{T | T \subseteq S\}$

    +   - $A \times B = \{ (a,b) \ | \ a \in A \text{ and } b \in B \}$'
  - '[PAGE 872]


    # Set operations: Union


    Formal definition for the union of two sets:

    A ∪ B = { x | x ∈ A or x ∈ B }


    # Further examples


    +   - {1, 2, 3} ∪ {3, 4, 5} = {1, 2, 3, 4, 5}

    +   - {a, b} ∪ {3, 4} = {a, b, 3, 4}

    +   - {1, 2} ∪ ∅ = {1, 2}


    # Properties of the union operation


    +   - A ∪ ∅ = A  Identity law

    +   - A ∪ U = U  Domination law

    +   - A ∪ A = A  Idempotent law

    +   - A ∪ B = B ∪ A  Commutative law

    +   - A ∪ (B ∪ C) = (A ∪ B) ∪ C  Associative law'
  - '[PAGE 873]


    # Set operations: Intersection


    Formal definition for the intersection of two sets:


    A ∩ B = { x | x ∈ A and x ∈ B }


    # Examples


    +   - {1, 2, 3} ∩ {3, 4, 5} = {3}

    +   - {a, b} ∩ {3, 4} = ∅

    +   - {1, 2} ∩ ∅ = ∅


    # Properties of the intersection operation


    +   - A ∩ U = A    Identity law

    +   - A ∩ ∅ = ∅    Domination law

    +   - A ∩ A = A    Idempotent law

    +   - A ∩ B = B ∩ A    Commutative law

    +   - A ∩ (B ∩ C) = (A ∩ B) ∩ C    Associative law'
  - '[PAGE 874]


    # Disjoint sets


    Formal definition for disjoint sets: two sets are disjoint if their intersection
    is the empty set


    # Further examples


    +   - {1, 2, 3} and {3, 4, 5} are not disjoint

    +   - {a, b} and {3, 4} are disjoint

    +   - {1, 2} and ∅ are disjoint

    +     - Their intersection is the empty set

    +   - ∅ and ∅ are disjoint!

    +     - Their intersection is the empty set'
