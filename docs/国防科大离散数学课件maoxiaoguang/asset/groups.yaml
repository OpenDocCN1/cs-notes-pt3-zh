    +   - By adding those edges, we have made a non-reflexive relation \\(R\\) into\
    \ a reflexive relation\n+   - This new relation is called the **reflexive closure**\
    \ of \\(R\\)\n\n![](img/47b87ec6fe4fa238d13429358848c545_786_0.png)\n\n## Reflexive\
    \ closure\n\n+   In order to find the reflexive closure of a relation R, we add\
    \ a loop at each node that does not have one\n\n+   The reflexive closure of R,\
    \ r(R), is R U Π_A\n+   Where Π_A = { (a,a) | a ∈ R }\n+   Called the \"diagonal\
    \ relation\"\n+   With matrices, we set the diagonal to all 1's\n\n## Rosen, section\
    \ 7.4, question 1(a)\n\n+   Let R be a relation on the set { 0, 1, 2, 3 } containing\
    \ the ordered pairs (0,1), (1,1), (1,2), (2,0), (2,2), and (3,0)\n\n+   What is\
    \ the reflexive closure of R?\n\n+   We add all pairs of edges (a,a) that do not\
    \ already exist\n\n![](img/47b87ec6fe4fa238d13429358848c545_788_0.png)\n\nWe add\
