    \n⇔ ¬P(a₁)∨¬P(a₂)∨...............∨¬P(aₙ)\n\n⇔ (∃x)¬P(x)\n\n## 量词辖域的扩展和收缩\n\n(∀x)A(x)∨P\
    \ ⇔ (∀x)(A(x)∨P)\n(∀x)A(x)∧P ⇔ (∀x)(A(x)∧P)\n(∃x)A(x)∨P ⇔ (∃x)(A(x)∨P)\n(∃x)A(x)∧P\
