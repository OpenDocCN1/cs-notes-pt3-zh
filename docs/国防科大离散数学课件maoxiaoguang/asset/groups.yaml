    ## Soundness and completeness\n\n- To prove soundness of ℋ, prove the soundness\
    \ of its axioms and inference rules (easy with truth-tables). For example:\n\n\
    | A | B | A → (B → A) |\n|---|---|---|\n| F | F | T |\n| F | T | T |\n| T | F\
    \ | T |\n| T | T | T |\n\n- Completeness – harder, but possible.\n\n## The resolution\
    \ inference system\n\n▪ The **resolution** inference rule for CNF:\n\n$$\\frac{(l\
    \ \\lor l_1 \\lor ... \\lor l_n) \\qquad (\\neg l \\lor l'_1 \\lor ... \\lor l'_n)}{(l_1\
    \ \\lor ... \\lor l_n \\lor l'_1 \\lor ... \\lor l'_n)} \\quad (\\mathrm{Resolution})$$\n\
    \n▪ Example:\n\n$$\\frac{(a \\lor b) \\qquad (\\neg a \\lor c)}{(b \\lor c)}$$\n\
    \n## Proof by resolution\n\n- Let φ = (p∨r)∧(¬p∨q∨t)∧(p∨¬q)∧(¬p∨s)∧(¬p∨¬s)\n-\
    \ We’ll try to prove φ → (r∨t)\n\n![](img/47b87ec6fe4fa238d13429358848c545_125_0.png)\n\
    \n## Resolution\n\n- Resolution is a sound and complete inference system for CNF\n\
    \  - ordering of literals in any clause is neglected\n- If the input formula is\
    \ unsatisfiable, there exists a proof of the empty clause.\n"
