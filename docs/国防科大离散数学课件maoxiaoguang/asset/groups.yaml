    ![](img/47b87ec6fe4fa238d13429358848c545_566_2.png)'
  - '[PAGE 567]


    # Complete Bipartite Graph


    The complete bipartite graph Kₘ,ₙ is the graph that has its vertex set partitioned
    into two subsets of m and n vertices, respectively. Two vertices are connected
    if and only if they are in different subsets.


    ![](img/47b87ec6fe4fa238d13429358848c545_567_0.png)


    ![](img/47b87ec6fe4fa238d13429358848c545_567_1.png)'
