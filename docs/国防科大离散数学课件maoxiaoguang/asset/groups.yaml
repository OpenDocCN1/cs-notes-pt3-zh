  - '[PAGE 110]


    # Example: incompleteness of the depth-first strategy


    +   - d ∧ e ∧ (b → a) ∧ (e → b) ∧ (d → a) ⊨ a (?)

    +   - Logic program

    +     (depth-first, top down strategy; goal driven):


    +   1. D.                 fact

    +   2. E.                 fact

    +   3. A :- B.            rule (A, if B)

    +   4. B :- E.            rule (B, if E)

    +   5. A :- D.            rule (A, if D)

    +   6. ?A                  query, goal


    - the program tries to meet the goal A by searching top down; the clause 3 meets
    the goal ⇒ generates a new goal B. Succeeds with the clause 4 ⇒ a new goal E –
    met by the clause 2. – **Yes**


    - or generates backtracking: again ?A – clause 5 – goal D – clause 1. – **Yes**'
  - '[PAGE 111]


    <!-- no content -->'
  - '[PAGE 112]


    # Summary of typical problems in PL


    +   ① A proof of a tautology / contradiction

    +   ② Prove that a set of formulas is not satisfiable

    +   ③ (Direct / indirect) proof of validity of an argument

    +   ④ Inferring consequences of assumptions


    We can solve by:


    +   A semantic method, i.e., by a truth-table or indirectly

    +   By means of equivalent transformations – using basic rules of inference (modus
    ponens, transposition, disjunction elimination)

    +   By means of normal forms: CCNF, CDNF

    +   Resolution method: clausal form (conjunctive normal form)'
  - '[PAGE 113]


    <!-- no content -->'
  - "[PAGE 114]\n\n# Deduction requires axioms and Inference rules\n\nInference rules:\n\
    \nAntecedents\nConsequent\n(rule-name)\n\nExamples:\n\nA → B   B → C\n-----------\n\
    \    A → C\n(trans)\n\nA → B   A\n-----------\n    B\n(M.P.)"
  - "[PAGE 115]\n\n# Axioms\n\n+   Axioms are inference rules with no antecedents,\
    \ e.g.,\n+   \n+   A → (B → A) (H1)\n\n+   We can turn an inference rule into\
    \ an axiom if we have `→` in the logic.\n\n+   So the difference between them\
    \ is not sharp."
  - '[PAGE 116]


    # Proofs


    +   - A proof uses a given set of inference rules and axioms.

    +   - This is called the proof system.

    +   - Let ℋ be a proof system.

    +   - Γ ⊢_ℋ φ means: there is a proof of φ in system ℋ whose premises are included
    in Γ

    +   - ⊢_ℋ is called the provability relation.'
