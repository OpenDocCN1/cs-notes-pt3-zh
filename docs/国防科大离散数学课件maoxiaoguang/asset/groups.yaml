    □ "I have neither given nor received help on this exam"


    □ Let p = "I have given help on this exam"


    □ Let q = "I have received help on this exam"


    □ ¬p ∧ ¬q'
  - '[PAGE 44]


    # Translation Example 4


    +   - You can access the Internet from campus only if you are a computer science
    major or you are not a freshman.

    +   - a → (c ∨ ¬ f)

    +   - You cannot ride the roller coaster if you are under 4 feet tall unless you
    are older than 16 years old.

    +   - (f ∧ ¬ s) → ¬ r

    +   - r → (¬ f ∨ s)'
