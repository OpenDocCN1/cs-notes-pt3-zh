    \ is the process of replacing the variables in expressions by terms to make the\
    \ modified expressions identical to each other.\n\nExample:\nLet E₁=P(x,a) , E₂=P(y,a)\
    \ , θ = {y→x}\nThen E₁θ = E₂θ = P(x,a)\n\nIn the example θ is the most general\
    \ unifier (mgu)\n\n# Resolution for FOL\n\n(A ∨ L)θ, (B ∨ ¬L)θ\n-------------------\n\
    (A ∨ B) θ\n\n- θ is the most general unifier for L.\n- The result of resolution\
    \ is called the resolvent.\n- There may be more than one possible resolvent.\n\
    - The resolvent of two complementary unit clauses is the empty clause.\n\n# Resolution\
    \ for first order logic\n\n- Resolution is refutationally complete (with factoring).\n\
    - Factoring is an additional rule that allows you to remove duplicate literals\
    \ within a clause.\n- Proving Σ |= A is equivalent to proving that Σ ∪ {¬A} is\
    \ unsatisfiable.\n- A is called the goal.\n- In a resolution proof you negate\
    \ the goal and add it to the set of hypotheses, then apply resolution until the\
    \ empty clause is produced.\n"
