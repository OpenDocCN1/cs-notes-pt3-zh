    # Semantics of ∀


    +   Let the universe be the real numbers.


    +   Let P(x) = "x/2 < x"

    +     - Not true for the negative numbers!

    +     - Thus, ∀x P(x) is false

    +       - When the domain is all the real numbers


    +   In order to prove that a universal quantification is true, it must be shown
    for ALL cases


    +   In order to prove that a universal quantification is false, it must be shown
    to be false for only ONE case


    +   ∀xP(x) is True when P(x) is true for every x.


    +   ∀xP(x) is False if there is an x for which P(x) is false.'
