    \nProof:\n\nLet formula (A ∨ l) ∧ (B ∨ ¬l) be non-contradictory. Hence there is\
    \ an interpretation I in which it is true. In this I both the conjuncts (so-called\
    \ clauses) are true: (A ∨ l) and (B ∨ ¬l).\n\nLet I(l) = F. Then I(A) = T and\
    \ I(A ∨ B) = T.\n\nLet I(l) = T. Then I(¬l) = F and I(B) = T, thus I(A ∨ B) =\
    \ T.\n\nIn both cases the formula A ∨ B is true in the model I of the original\
    \ formula, hence it is not a contradiction.\n\n## Further findings\n\nIf you realize\
    \ that the above proof is valid for any valuation \\(v\\), then you see that the\
    \ rule is truth-preserving:\n\n\\[\n(A \\lor l) \\land (B \\lor \\neg l) \\Rightarrow\
    \ (A \\lor B)\n\\]\n\nThus you also obtain a method of finding **logical consequences\
    \ of a formula.**\n\nMoreover:\n\n\\[\n(A \\lor l) \\land (B \\lor \\neg l) \\\
    Leftrightarrow (A \\lor l) \\land (B \\lor \\neg l) \\land (A \\lor B)\n\\]\n\n\
    ## Clausal form\n\nThe conjunctive normal form is called clausal form. Particular\
    \ conjuncts (i.e., elementary disjunctions) are called clauses.\n\nExample:\n\n\
    Transition of a formula into the clausal form:\n\n\\[\n\\neg[((p \\rightarrow\
    \ q) \\land (r \\lor \\neg q) \\land \\neg r) \\rightarrow \\neg p]\n\\]\n\\[\n\
    \\Leftrightarrow ((p \\rightarrow q) \\land (r \\lor \\neg q) \\land \\neg r)\
    \ \\land p\n\\]\n\\[\n\\Leftrightarrow (\\neg p \\lor q) \\land (r \\lor \\neg\
    \ q) \\land \\neg r \\land p\n\\]\n\nThe formula consists of four clauses.\n\n\
    The proof of contradiction:\n\n\\[\n(\\neg p \\lor q) \\land (r \\lor \\neg q)\
    \ \\land (\\neg p \\lor r) \\land \\neg r \\land \\neg p \\land p\n\\]\n\n## Proof\
    \ by resolution\n\n- R(F) – conjunctive extension of a formula F by all its resolvents.\n\
    - R₀(F) = F, Rᵢ(F) = R(Rᵢ₋₁(F)) – resolution closure of F. It holds that Rᵢ(F)\
    \ ⇔ F.\n- Proof: A is a contradiction (not satisfiable): there is an n such that\
    \ Rₙ(A) contains the empty clause.\n- Proof: A is a tautology: ¬A is a contradiction.\n\
    - Proof: a set of formulas {A₀, ..., Aₙ} is not satisfiable. We prove that the\
    \ formula A₁ ∧ ... ∧ Aₙ is a contradiction.\n- Infer logical consequences of {A₁,\
    \ ..., Aₙ}: infer all the resolvents.\n- Proof of validity: A₁, ..., Aₙ |= Z\n\
    \  - Direct: by step-by-step inferring resolvents from A₁, ..., Aₙ you obtain\
    \ Z.\n  - Indirect: prove that A₁ ∧ ... ∧ Aₙ → Z is a tautology, i.e., A₁ ∧ ...\
    \ ∧ Aₙ ∧ ¬Z is a contradiction, i.e., the set {A₁, ..., Aₙ, ¬Z} is not satisfiable.\n\
    \n## Example — direct proof / forward reasoning\n\nProve that (¬q → p) ∧ (p ∨\
    \ r) ∧ (q → ¬r) logically entails p.\n\nCNF: (q ∨ p) ∧ (p ∨ r) ∧ (¬q ∨ ¬r)\n\n\
    Direct proof: from facts to conclusion.\n\nProof:\n\n1. q ∨ p — fact\n2. p ∨ r\
    \ — fact\n3. ¬q ∨ ¬r — fact\n4. p ∨ ¬r — resolution: 1, 3\n5. p — resolution:\
    \ 2, 4\n\n## Example – indirect proof / backward reasoning\n\nProve that (¬q →\
    \ p) ∧ (p ∨ r) ∧ (q → ¬r) logically entails p.\n\nConvert to: Prove that the following\
    \ wff is a contradiction:\n\n\\[\n(\\neg q \\rightarrow p) \\land (p \\lor r)\
    \ \\land (q \\rightarrow \\neg r) \\land \\neg p\n\\]\n\nCNF: (q ∨ p) ∧ (p ∨ r)\
    \ ∧ (¬q ∨ ¬r) ∧ ¬p\n\nProof by resolution:\n\n1. q ∨ p\n2. p ∨ r\n3. ¬q ∨ ¬r\n\
    4. ¬p\n5. p ∨ ¬r — resolution: 1, 3\n6. p — resolution: 2, 5\n7. {} — resolution:\
    \ 4, 6\n\n## Example\n\n\\[\n(q \\lor p)\n\\]\n\n\\[\n(p \\lor r)\n\\]\n\n\\[\n\
    (\\neg q \\lor \\neg r)\n\\]\n\n\\[\n\\neg p\n\\]\n\n\\[\n(p \\lor \\neg r)\n\\\
    ]\n\n\\[\np\n\\]\n\nContradiction → {}\n\n## Logic programming\n\nStrategies of\
    \ generating resolvents:\n\n- **Breadth-first** (pursue all closest paths first)\n\
    \  - Resolution closure – generates **all** resolvents.\n  - It can be rather\
    \ inefficient due to combinatorial explosion of resolvents.\n- **Depth-first**\
    \ (top down: pursue first path to exhaustion before looking at the next path)\n\
    \  - It is very simple and efficient to implement, but it is **not complete**;\
    \ it can lead to some very odd infinite loops though there is a solution in a\
    \ neighbouring branch.\n"
