  - '[PAGE 822]


    # Introduction


    +   An equivalence relation is a relation that is reflexive, symmetric, and transitive


    +   A partial ordering (or partial order) is a relation that is reflexive, *anti*symmetric,
    and transitive


    +   Recall that antisymmetric means that if $(a,b) \in R$, then $(b,a) \notin
    R$ unless $b = a$


    +   Thus, $(a,a)$ is allowed to be in $R$


    +   But since it''s reflexive, all possible $(a,a)$ must be in $R$'
  - '[PAGE 823]


    # Partially Ordered Set (POSET)


    +   A relation R on a set S is called a partial ordering or partial order if it
    is reflexive, antisymmetric, and transitive.


    +   A set S together with a partial ordering R is called a partially ordered set,
    or poset, and is denoted by (S, R)'
  - '[PAGE 824]


    # Example


    +   - Let S = {1, 2, 3} and

    +   - let R = {(1,1), (2,2), (3,3), (1, 2), (3,1), (3,2)}


    ![](img/47b87ec6fe4fa238d13429358848c545_824_0.png)'
  - '[PAGE 825]


    # Notation≼


    +   In a poset, the notation $a \preccurlyeq b$ denotes that $(a,b) \in R$


    +   This notation is used because the “less than or equal to” relation is a paradigm
    for a partial ordering. (Note that the symbol $\preccurlyeq$ is used to denote
    the relation in any poset, not just the “less than or equals” relation.)


    +   The notation $a \prec b$ denotes that $a \preccurlyeq b$, but $a \neq b$'
