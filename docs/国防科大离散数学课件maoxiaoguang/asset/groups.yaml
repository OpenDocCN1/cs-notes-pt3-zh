    \ E = {1, 2, 3, 4, 5} and function f with f(1) = {a, b}, f(2) = {a, b}, f(3) =\
    \ {b, c}, f(4) = {c, d} and f(5) = {c, d}:\n\n![](img/47b87ec6fe4fa238d13429358848c545_541_0.png)\n\
