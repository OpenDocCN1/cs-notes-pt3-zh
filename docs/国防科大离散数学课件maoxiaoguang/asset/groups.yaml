    (\\Leftrightarrow\\quad \\neg(\\exists x)\\,(A(x)) \\land \\neg(\\exists x)\\\
    ,(B(x))\\)\n\n## 两边取非：\n\n- \\(\\neg\\neg(\\exists x)\\,(A(x) \\lor B(x))\\)\n\
    - \n- \\(\\Leftrightarrow\\ \\neg(\\neg(\\exists x)\\,(A(x)) \\land \\neg(\\exists\
    \ x)\\,(B(x)))\\)\n\n## 得到：\n\n- \\((\\exists x)\\,(A(x) \\lor B(x))\\)\n- \n\
    - \\(\\Leftrightarrow\\ (\\exists x)A(x) \\lor (\\exists x)B(x)\\)\n\n## 量词的分配公式\n\
    \nc). (∃x)(A(x)∧B(x))⇒(∃x)A(x)∧(∃x)B(x)\n\nd). (∀x)A(x)∨(∀x)B(x) ⇒ (∀x)(A(x)∨B(x))\n\
    \n## 证明：\n\nc). 因存在x使A(x)∧B(x)为真，故该x使A(x)为真，该x使B(x)为真,即∃xA(x)∧∃xB(x)为真。\n\n注意逆方向不成立\n\
    \n举反例：设论述域是整数。\n\nA(x): “x为奇数”， B(x): “x为偶数”\n\n## 量词对→及↔的处理\n\n只须应用量词对∨，∧，¬的恒等式即可推出\n\
    \n例：证明(∃x)A(x)→(∀x)B(x)⇔(∀x)(A(x)→B(x))\n\n## 一些两个量词的等价式和蕴含式\n\nB1    (∀x)(∀y)P(x,y)\
