  md: "\n## Examples\n\n- Consider the following Hasse diagram\n- Element $a$ is minimal\
    \ and least.\n- Elements $b$ and $c$ are maximal.\n- There is no greatest element.\n\
    \n![](img/47b87ec6fe4fa238d13429358848c545_840_0.png)\n\n## More examples\n\n\
    - The power set of a set A with set inclusion\n  - ∅ is least and minimal, because\
    \ it is a subset of every other set\n  - A is greatest and maximal, because it\
    \ is a superset of every other set\n- The set of positive integers with \"divides\"\
    \n  - 1 is least and minimal\n  - There is no maximal or greatest element (the\
    \ set is infinite)\n\n## Upper bound, Lower bound\n\n- Sometimes it is possible\
    \ to find an element that is greater than all the elements in a subset A of a\
    \ poset (S, ≪ ).\n\n- If u is an element of S such that a ≪ u for all elements\
    \ a ∈ A, then u is called an upper bound of A.\n\n- Likewise, there may be an\
    \ element less than all the elements in A.\n\n- If v is an element of S such that\
    \ v ≪ a for all elements a ∈ A, then v is called a lower bound of A.\n\n## Least\
    \ Upper Bound, Greatest Lower Bound\n\n- The element x is called the *least upper\
    \ bound* (lub) of the subset A if x is an upper bound that is less than every\
    \ other upper bound of A.\n- The element y is called the *greatest lower bound*\
    \ (glb) of A if y is a lower bound of A and z ≤ y whenever z is a lower bound\
    \ of A.\n\n## Example\n\n- Consider the elements 1 and 3\n  - Upper bounds of\
    \ 1 are 1, 2, 4 and 5\n  - Upper bounds of 3 are 3, 2, 4 and 5\n  - 2, 4 and 5\
    \ are upper bounds for the pair 1 and 3\n  - There is no lub since\n    - 2 is\
    \ not related to 4\n    - 4 is not related to 2\n    - 2 and 4 are both related\
    \ to 5\n  - There is no glb either\n\n![](img/47b87ec6fe4fa238d13429358848c545_844_0.png)\n\
    \n## Lattices\n\n- A special case of partially ordered sets (A, ≤) with the property\
    \ that for any pair {x, y} with x, y ∈ A, there is a least upper bound and a greatest\
    \ lower bound.\n\n- Lattices have important properties that make them suitable\
    \ for modeling\n\n  - information flow\n  - statistical dependency models\n\n\
    (P({a, b, c}), ⊆)\n\n![](img/47b87ec6fe4fa238d13429358848c545_845_0.png)\n\n##\
    \ Example lattices\n\n- Power set of a set with set inclusion\n  - least upper\
    \ bound of {A, B}: A ∪ B\n  - greatest lower bound of {A, B}: A ∩ B\n- The set\
    \ of positive integers with \"divides\"\n  - least upper bound of {n, m}: the\
    \ least common multiple of n and m\n  - greatest lower bound of {n, m}: the greatest\
    \ common divisor of n and m\n\n## Homework for Section 8.6\n\n## Section 8.6\n\
    \n- 8\n- 22\n- 32\n- 44 b) d)\n\n## 0812210\n\n## Sets and Graphs\n\n## Ch 2.1\
    \ Sets\n\nSpring 2010\n\nMao Xiaoguang\n\n## What is a set?\n\nA set is an unordered\
    \ collection of \"objects\"\n\n- People in a class: { Li, Chen, Hou }\n- Cities\
    \ in China: {Changsha, Beijing, Shanghai, ...}\n- Sets can contain non-related\
    \ elements:\n  { 3, Li, red, 离散 }\n\n## Properties\n\n- Order does not matter\n\
    \  - { 1, 2, 3, 4 } is equivalent to { 3, 2, 4, 1 }\n\n- Sets do not have duplicate\
    \ elements\n  - Consider the list of students in this class\n    - It does not\
    \ make sense to list somebody twice\n  - e.g. {a, b, c} = {a, b, a, c, c}\n\n\
    ## What is a set?\n\n## Usually\n\n- A set is a collection of (mathematical) objects,\n\
    - with the collection treated as a single mathematical object.\n\n## We will most\
    \ often use sets of numbers\n\n- All positive numbers less than or equal to 4:\n\
    \  { 1, 2, 3, 4 }\n- A few selected real numbers:\n  { 1.01, π, 0, -6.18 }\n\n\
    ## A set can be an element of another set\n\n- { 1, {2}, {3,{2}} }\n\n## Specifying\
    \ a set\n\n- Capital letters (A, B, S, ...) for sets\n\n- Italic lower-case letter\
    \ for elements (a, x, y, ...)\n\n- Easiest way: list all the elements (enumeration)\n\
    \n- A = { 1, 2, 3, 4 }, Not always feasible!\n\n- May use ellipsis (...): B =\
    \ { 0, 1, 2, 3, ... }\n\n- May cause confusion. C = { 3, 5, 7, ... }. What’s next?\n\
    \n- If the set is all odd integers greater than 2, it is 9\n\n- If the set is\
    \ all prime numbers greater than 2, it is 11\n\n- Can use set-builder notation\n\
    \n- D = {x | x is prime and x > 2}\n\n- E = {x | x is odd and x > 2}\n\n- The\
    \ vertical bar means \"such that\"\n"
