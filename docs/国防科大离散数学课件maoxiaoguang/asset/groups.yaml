    对于¬(∀x)P(x)→(∃x)(¬P(x))在任意论域D上的任意解释I，若¬(∀x)P(x)在I下为真，则(∀x)P(x)在I下为假，即有a∈D使P(a)为假，所以¬P(a)为真，故(∃x)(¬P(x))在I下为真。


    对于(∃x)(¬P(x))→¬(∀x)P(x)在任意论域D上的任意解释I，若(∃x)(¬P(x))在I下为真，则有a∈D使¬P(a)为真，即P(a)为假，所以(∀x)P(x)为假，故¬(∀x)P(x)在I下为真。'
