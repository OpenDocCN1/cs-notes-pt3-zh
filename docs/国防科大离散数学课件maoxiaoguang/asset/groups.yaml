  - '[PAGE 207]


    # Pros and cons of propositional logic


    +   - Propositional logic is declarative

    +   - Propositional logic allows partial/disjunctive/negated information

    +     - (unlike most data structures and databases)

    +   - Propositional logic is compositional:

    +     - meaning of B₁,₁ ∧ P₁,₂ is derived from meaning of B₁,₁ and of P₁,₂

    +   - Meaning in propositional logic is context-independent

    +     - (unlike natural language, where meaning depends on context)

    +   - Propositional logic has very limited expressive power (unlike natural language)

    +     - E.g., cannot say "pits cause breezes in adjacent squares"

    +       - except by writing one sentence for each square'
  - '[PAGE 208]


    # First-order logic


    +   Whereas propositional logic assumes the world contains facts,

    +   first-order logic (like natural language) assumes the world contains

    +   - Objects: people, houses, numbers, colors, baseball games, wars, ...

    +   - Relations: red, round, prime, brother of, bigger than, part of, comes between,
    ...

    +   - Functions: father of, best friend, one more than, plus, ...'
  - '[PAGE 209]


    # Symbols


    +   Logical symbols:

    +   - Truth constants: T, F

    +   - Logical connectives: ¬, ∧, ∨, →, ↔

    +   - Quantifiers: ∀, ∃

    +   - Variables: x, y, z, ...

    +   - Auxiliary symbols: ''('', '')'', '',''


    +   Non-logical symbols:

    +   - Functions: f, g, h, ...

    +     - Constants: a, b, c, ...

    +   - Predicates: P, Q, R, ...'
  - '[PAGE 210]


    # Terms


    The set of terms is inductively defined by the following rules:


    +   - Variables.

    +     - Any variable $x_i$ is a term.

    +   - Functions.

    +     - Any expression $f(t_1, ..., t_n)$ of n arguments (where each argument
    $t_i$ is a term and $f$ is a function symbol of valence $n$) is a term.


    Only expressions which can be obtained by finitely many applications of rules
    1 and 2 are terms.


    +   - e.g. No expression involving a predicate symbol is a term.'
  - '[PAGE 211]


    # Well-formed formulas


    The set of formulas (also called well-formed formulas or wffs) is inductively
    defined by the following rules:


    +   - Predicate symbols. If P is an n-ary predicate symbol and t₁, ..., tₙ are
    terms then P(t₁,...,tₙ) is a formula.

    +   - Negation. If φ is a formula, then ¬φ is a formula.

    +   - Binary connectives. If φ and ψ are formulas, then ( φ o ψ ) is a formula,
    where o is a binary logical connective.

    +   - Quantifiers. If φ is a formula and x is a variable, then ∀x φ and ∃x φ are
    formulas.


    Only expressions which can be obtained by finitely many applications of rules
    1–5 are formulas.


    The formulas obtained from the first two rules are said to be atomic formulas.'
