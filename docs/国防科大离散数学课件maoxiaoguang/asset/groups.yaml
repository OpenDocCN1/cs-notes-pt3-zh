    \ (or [4], or [784], etc.)\n  - [2] = { ..., -4, -2, 0, 2, 4, ... }\n  - 2 is\
    \ a *representative* of its equivalence class\n- There are only 2 equivalence\
    \ classes formed by this equivalence relation\n\n## More on equivalence classes\n\
    \n- Consider the relation R = {(a,b) | a=b or a=-b}\n  - Thus, every number is\
    \ related to additive inverse\n- The equivalence class for an integer a:\n  -\
    \ [7] = { 7, -7 }\n  - [0] = { 0 }\n  - [a] = { a, -a }\n- There are an infinite\
    \ number of equivalence classes formed by this equivalence relation\n\n## Partitions\n\
    \n- Consider the relation R = { (a,b) | a ≡ b (mod 2)}\n- This splits the integers\
    \ into two equivalence classes: even numbers and odd numbers\n- Those two sets\
    \ together form a partition of the integers\n- Formally, *a partition of a set\
    \ S* is a collection of non-empty disjoint subsets of S whose union is S\n- In\
    \ this example, the partition is { [0], [1] }\n- Or { {..., -3, -1, 1, 3, ...},\
    \ {..., -4, -2, 0, 2, 4, ...} }\n\n## Rosen, section 8.5, question 44\n\nWhich\
    \ are partitions of the set of integers?\n\n- • The set of even integers and the\
    \ set of odd integers\n  ✓ Yes, it’s a valid partition\n- • The set of positive\
    \ integers and the set of negative integers\n  ✗ No: 0 is in neither set\n- •\
    \ The set of integers divisible by 3, the set of integers leaving a remainder\
    \ of 1 when divided by 3, and the set of integers leaving a remainder of 2 when\
    \ divided by 3\n  ✓ Yes, it’s a valid partition\n- • The set of integers less\
    \ than -100, the set of integers with absolute value not exceeding 100, and the\
    \ set of integers greater than 100\n  ✓ Yes, it’s a valid partition\n- • The set\
    \ of integers not divisible by 3, the set of even integers, and the set of integers\
    \ that leave a remainder of 3 when divided by 6\n  ✗ The first two sets are not\
    \ disjoint (2 is in both), so it’s not a valid partition\n\n## Homework for Section\
    \ 8.5\n\n## Section 8.5\n\n- 3\n- 28\n- 45 a) b) c)\n\n## 0812210\n\n## Sets and\
    \ Graphs\n\n## Ch 8.6 Partial Orderings\n\nSpring 2010\nMao Xiaoguang\n\n## Introduction\n\
    \n- An equivalence relation is a relation that is reflexive, symmetric, and transitive\n\
    - A partial ordering (or partial order) is a relation that is reflexive, *anti*symmetric,\
    \ and transitive\n- Recall that antisymmetric means that if $(a,b) \\in R$, then\
    \ $(b,a) \\notin R$ unless $b = a$\n- Thus, $(a,a)$ is allowed to be in $R$\n\
    - But since it's reflexive, all possible $(a,a)$ must be in $R$\n\n## Partially\
    \ Ordered Set (POSET)\n\n- A relation R on a set S is called a partial ordering\
    \ or partial order if it is reflexive, antisymmetric, and transitive.\n- A set\
    \ S together with a partial ordering R is called a partially ordered set, or poset,\
    \ and is denoted by (S, R)\n\n## Example\n\n- Let S = {1, 2, 3} and\n- let R =\
    \ {(1,1), (2,2), (3,3), (1, 2), (3,1), (3,2)}\n\n![](img/47b87ec6fe4fa238d13429358848c545_824_0.png)\n\
    \n## Notation≼\n\n- In a poset, the notation $a \\preccurlyeq b$ denotes that\
    \ $(a,b) \\in R$\n- This notation is used because the “less than or equal to”\
    \ relation is a paradigm for a partial ordering. (Note that the symbol $\\preccurlyeq$\
    \ is used to denote the relation in any poset, not just the “less than or equals”\
    \ relation.)\n- The notation $a \\prec b$ denotes that $a \\preccurlyeq b$, but\
    \ $a \\neq b$\n"
