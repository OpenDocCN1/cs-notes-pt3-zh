    the vertices and edges of G are listed in arbitrary order as v₁, v₂, ..., vₙ and
    e₁, e₂, ..., eₘ, respectively.


    +   The incidence matrix of G with respect to this listing of the vertices and
    edges is the n×m zero-one matrix with 1 as its (i, j)th entry when edge eⱼ is
    incident with vᵢ, and 0 otherwise.


    +   In other words, for an incidence matrix M = [mᵢⱼ],

