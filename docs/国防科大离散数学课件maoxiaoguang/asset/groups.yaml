  - '[PAGE 696]


    # More Examples


    Prove that if an integer h> -1, then 1+nh ≤ (1+h)^n for all non-negative integer
    n.


    Prove that n² mod 8 ≡ 1 for all odd integer n.'
  - '[PAGE 697]


    # Strong induction


    +   Weak mathematical induction assumes P(k) is true, and uses that (and only
    that!) to show P(k+1) is true


    +   Strong mathematical induction assumes P(1), P(2), ..., P(k) are all true,
    and uses that to show that P(k+1) is true.

    +   [P(1) ∧ P(2) ∧ p(3) ∧ ... ∧ P(k) ] → P(k+1)'
  - '[PAGE 698]


    # Strong induction example 1


    +   Show that any number > 1 can be written as the product of primes


    +   Base case: P(2)


    +   2 is the product of 2 (remember that 1 is not prime!)


    +   Inductive hypothesis: P(2), P(3), ..., P(k) are all true


    +   Inductive step: Show that P(k+1) is true'
  - '[PAGE 699]


    # Strong induction example 1


    Inductive step: Show that P(k+1) is true


    There are two cases:


    +   - k+1 is prime

    +     - It can then be written as the product of k+1

    +   - k+1 is composite

    +     - It can be written as the product of two composites, a and b, where 2 ≤
    a ≤ b < k+1

    +     - By the inductive hypothesis, both P(a) and P(b) are true

    +     - Then P(k+1) is true'
  - '[PAGE 700]


    # Strong Induction Examples 2


    Prove that every amount of 8 yuans or more can be formed using just 3-yuan and
    5-yuan bills.


    Basis Step


    +   - 8 = 1 * 3-yuan bill + 1 * 5-yuan bill

    +   - 9 = 3 * 3-yuan bill

    +   - 10 = 2 * 5-yuan bill


    Inductive step: Suppose P(j) is true for 8 ≤ j ≤ k (k≥10). It is sufficient to
    show that P(k+1) is true.


    +   - If k is formed by at least 1 5-yuan bill, then k+1 can be formed by replacing
    this 5-yuan bill with 2 3-yuan bills.

    +   - Else, k is formed only by more than 3 3-yuan bills, then k+1 can be formed
    by replacing 3 3-yuan bills with 2 5-yuan bills.'
  - '[PAGE 701]


    # Recursion


    Recursion means defining something, such as a function, in terms of itself


    +   - For example, let f(n) = n!

    +   - We can define f(n) as

    +     - f(1) = 1

    +     - f(n) = n * f(n-1) for n > 1


    Find f(1), f(2), f(3), and f(4), where f(0) = 1


    +   - Let f(n+1) = f(n) + 2

    +     - f(1) = f(0) + 2 = 1 + 2 = 3

    +     - f(2) = f(1) + 2 = 3 + 2 = 5

    +     - f(3) = f(2) + 2 = 5 + 2 = 7

    +     - f(4) = f(3) + 2 = 7 + 2 = 9

    +   - Let f(n+1) = 3f(n)

    +     - f(1) = 3 * f(0) = 3*1 = 3

    +     - f(2) = 3 * f(1) = 3*3 = 9

    +     - f(3) = 3 * f(2) = 3*9 = 27

    +     - f(4) = 3 * f(3) = 3*27 = 81'
  - '[PAGE 702]


    # Recursion example


    # Fibonacci Sequence


    +   - f₀ = 0, f₁ = 1

    +   - fₙ = fₙ₋₁ + fₙ₋₂ for n ≥ 2

    +   - f₂ = 1, f₃ = 2, f₄ = 3, f₅ = 5, f₆ = 8, ...'
  - '[PAGE 703]


    # Homework for Chapter 4


    +   ♈ Section 4.1

    +     - 6

    +     - 38


    +   ♈ Section 4.2

    +     - 12'
