    \ tournament (which team beats which other team)?\n\nWe should use a directed\
    \ graph with an edge (a, b) indicating that team a beats team b.\n\n![](img/47b87ec6fe4fa238d13429358848c545_547_0.png)\n\
    \n# Homework for Section 9.1\n\n# Section 9.1\n\n- 2\n- 12\n- 19\n\n# 0812210\n\
    \n# Sets and Graphs\n\n# Ch 9.2 Graph Terminology and Special Types of Graphs\n\
    \nSpring 2010\n\nMao Xiaoguang\n\n# Adjacent and Endpoints\n\n- Two vertices u\
    \ and v in an undirected graph G are called **adjacent** (or **neighbors**) in\
    \ G if {u, v} is an edge in G.\n- If e = {u, v}, the edge e is called **incident\
    \ with** the vertices u and v. The edge e is also said to connect u and v.\n-\
    \ The vertices u and v are called **endpoints** of the edge {u, v}.\n\n# Degree\
    \ - deg(v)\n\n- The degree of a vertex in an undirected graph is the number of\
    \ edges incident with it, except that a loop at a vertex contributes twice to\
    \ the degree of that vertex.\n- In other words, you can determine the degree of\
    \ a vertex in a displayed graph by counting the lines that touch it.\n- The degree\
    \ of the vertex v is denoted by deg(v).\n\n# Isolated and Pendent Vertices\n\n\
    - A vertex of degree 0 is called isolated, since it is not adjacent to any vertex.\n\
    - Note: A vertex with a loop at it has at least degree 2 and, by definition, is\
    \ not isolated, even if it is not adjacent to any other vertex.\n- A vertex of\
    \ degree 1 is called pendant. It is adjacent to exactly one other vertex.\n\n\
    # Example\n\nWhich vertices in the following graph are isolated, which are pendant,\
    \ and what is the maximum degree? What type of graph is it?\n\n![](img/47b87ec6fe4fa238d13429358848c545_553_0.png)\n\
    \nVertex f is isolated, and vertices a, d and j are pendant. The maximum degree\
    \ is deg(g) = 5. This graph is a pseudograph.\n\n# Handshaking Theorem\n\n- The\
    \ Handshaking Theorem: Let G = (V, E) be an undirected graph with n edges. Then\n\
    - 2n = Σv∈V deg(v)\n- Note: This theorem holds even if multiple edges and/or loops\
    \ are present.\n- Example: How many edges are there in a graph with 10 vertices,\
    \ each of degree 6?\n- Solution: The sum of the degrees of the vertices is 6·10\
    \ = 60. According to the Handshaking Theorem, it follows that 2e = 60, so there\
    \ are 30 edges.\n\n# Theorem Proof\n\n- Theorem: An undirected graph has an even\
    \ number of vertices of odd degree.\n- Idea: There are three possibilities for\
    \ adding an edge to connect two vertices in the graph:\n- Before:\n  Both vertices\
    \ have even degree\n  Both vertices have odd degree\n  One vertex has odd degree,\
    \ the other even\n- After:\n  Both vertices have odd degree\n  Both vertices have\
    \ even degree\n  One vertex has even degree, the other odd\n\n- There are two\
    \ possibilities for adding a loop to a vertex in the graph:\n- Before:\n  The\
    \ vertex has even degree\n  The vertex has odd degree\n- After:\n  The vertex\
    \ has even degree\n  The vertex has odd degree\n\n- So if there is an even number\
    \ of vertices of odd degree in the graph, it will still be even after adding an\
    \ edge.\n- Therefore, since an undirected graph with no edges has an even number\
    \ of vertices with odd degree (zero), the same must be true for any undirected\
    \ graph.\n\n# Adjacent, Initial and Terminal Vertices\n\n- When (u, v) is an edge\
    \ of the graph G with directed edges, u is said to be adjacent to v, and v is\
    \ said to be adjacent from u.\n- The vertex u is called the initial vertex of\
    \ (u, v), and v is called the terminal vertex of (u, v).\n- The initial vertex\
    \ and terminal vertex of a loop are the same.\n\n# Example\n\nWhat are the in-degrees\
    \ and out-degrees of the vertices a, b, c, d in this graph:\n\ndeg⁻(a) = 1\ndeg⁺(a)\
    \ = 2\n\ndeg⁻(d) = 2\ndeg⁺(d) = 1\n\ndeg⁻(b) = 4\ndeg⁺(b) = 2\n\ndeg⁻(c) = 0\n\
    deg⁺(c) = 2\n\n![](img/47b87ec6fe4fa238d13429358848c545_559_0.png)\n"
  mdcn: "\n# Graph Models\n\nExample II: In a round-robin tournament, each team plays\
    \ against each other team exactly once. How can we represent the results of the\
    \ tournament (which team beats which other team)?\n\nWe should use a directed\
    \ graph with an edge (a, b) indicating that team a beats team b.\n\n![](img/47b87ec6fe4fa238d13429358848c545_547_0.png)\n\
    \n# Homework for Section 9.1\n\n# Section 9.1\n\n- 2\n- 12\n- 19\n\n# 0812210\n\
    \n# Sets and Graphs\n\n# Ch 9.2 Graph Terminology and Special Types of Graphs\n\
    \nSpring 2010\n\nMao Xiaoguang\n\n# Adjacent and Endpoints\n\n- Two vertices u\
    \ and v in an undirected graph G are called **adjacent** (or **neighbors**) in\
    \ G if {u, v} is an edge in G.\n- If e = {u, v}, the edge e is called **incident\
    \ with** the vertices u and v. The edge e is also said to connect u and v.\n-\
    \ The vertices u and v are called **endpoints** of the edge {u, v}.\n\n# Degree\
    \ - deg(v)\n\n- The degree of a vertex in an undirected graph is the number of\
    \ edges incident with it, except that a loop at a vertex contributes twice to\
    \ the degree of that vertex.\n- In other words, you can determine the degree of\
    \ a vertex in a displayed graph by counting the lines that touch it.\n- The degree\
    \ of the vertex v is denoted by deg(v).\n\n# Isolated and Pendent Vertices\n\n\
    - A vertex of degree 0 is called isolated, since it is not adjacent to any vertex.\n\
    - Note: A vertex with a loop at it has at least degree 2 and, by definition, is\
    \ not isolated, even if it is not adjacent to any other vertex.\n- A vertex of\
    \ degree 1 is called pendant. It is adjacent to exactly one other vertex.\n\n\
    # Example\n\nWhich vertices in the following graph are isolated, which are pendant,\
    \ and what is the maximum degree? What type of graph is it?\n\n![](img/47b87ec6fe4fa238d13429358848c545_553_0.png)\n\
    \nVertex f is isolated, and vertices a, d and j are pendant. The maximum degree\
    \ is deg(g) = 5. This graph is a pseudograph.\n\n# Handshaking Theorem\n\n- The\
    \ Handshaking Theorem: Let G = (V, E) be an undirected graph with n edges. Then\n\
    - 2n = Σv∈V deg(v)\n- Note: This theorem holds even if multiple edges and/or loops\
    \ are present.\n- Example: How many edges are there in a graph with 10 vertices,\
    \ each of degree 6?\n- Solution: The sum of the degrees of the vertices is 6·10\
    \ = 60. According to the Handshaking Theorem, it follows that 2e = 60, so there\
    \ are 30 edges.\n\n# Theorem Proof\n\n- Theorem: An undirected graph has an even\
    \ number of vertices of odd degree.\n- Idea: There are three possibilities for\
    \ adding an edge to connect two vertices in the graph:\n- Before:\n  Both vertices\
    \ have even degree\n  Both vertices have odd degree\n  One vertex has odd degree,\
    \ the other even\n- After:\n  Both vertices have odd degree\n  Both vertices have\
    \ even degree\n  One vertex has even degree, the other odd\n\n- There are two\
    \ possibilities for adding a loop to a vertex in the graph:\n- Before:\n  The\
    \ vertex has even degree\n  The vertex has odd degree\n- After:\n  The vertex\
    \ has even degree\n  The vertex has odd degree\n\n- So if there is an even number\
    \ of vertices of odd degree in the graph, it will still be even after adding an\
    \ edge.\n- Therefore, since an undirected graph with no edges has an even number\
    \ of vertices with odd degree (zero), the same must be true for any undirected\
    \ graph.\n\n# Adjacent, Initial and Terminal Vertices\n\n- When (u, v) is an edge\
    \ of the graph G with directed edges, u is said to be adjacent to v, and v is\
    \ said to be adjacent from u.\n- The vertex u is called the initial vertex of\
    \ (u, v), and v is called the terminal vertex of (u, v).\n- The initial vertex\
    \ and terminal vertex of a loop are the same.\n\n# Example\n\nWhat are the in-degrees\
    \ and out-degrees of the vertices a, b, c, d in this graph:\n\ndeg⁻(a) = 1\ndeg⁺(a)\
    \ = 2\n\ndeg⁻(d) = 2\ndeg⁺(d) = 1\n\ndeg⁻(b) = 4\ndeg⁺(b) = 2\n\ndeg⁻(c) = 0\n\
    deg⁺(c) = 2\n\n![](img/47b87ec6fe4fa238d13429358848c545_559_0.png)\n"
