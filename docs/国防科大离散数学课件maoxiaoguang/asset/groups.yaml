    - Thus, the following are in our relation:\n  - (Changsha, Hunan)\n  - (Wuhan,\
    \ Hubei)\n  - (Houzhou, Zhejiang)\n  - (Nanjing, Jiangsu)\n  - etc...\n\nMost\
    \ relations we will see deal with ordered pairs of integers\n\n## Representing\
    \ relations\n\nWe can represent relations graphically:\n\nWe can represent relations\
    \ in a table:\n\n![](img/47b87ec6fe4fa238d13429358848c545_716_0.png)\n\nNot valid\
    \ functions!\n\n|  | CS1901 | CS2011 | CS2021 |\n|---|---|---|---|\n| Chen | X\
    \ |  |  |\n| Li |  | X | X |\n| Hu |  |  |  |\n| Wang |  | X | X |\n\n## How many\
    \ relations are there?\n\nA relation R ⊆ A × B, |A| = m, |B| = n\n\n- A × B has\
    \ m×n elements,\n- the number of subsets of a set with q elements is 2^q,\n- so\
    \ the desired number is 2^{m×n} (= P(A×B)).\n\n## Relations vs. Functions\n\n\
    A function f : A → B is a special case of a relation from A to B\n\n- It satisfies\
    \ the property: A function takes EACH element from a set and maps it to a UNIQUE\
    \ element in another set\n- f: X → Y\n  ∀ x ∈ X, ∃ y such that f(x) = y\n\nRelations\
    \ are a generalization of functions\n\n- A binary relation R from A to B is a\
    \ subset of A × B, R ⊆ A × B\n- They allow unmapped elements from A\n- They allow\
    \ one-to-many mappings where an element from A maps to multiple elements from\
    \ B\n- They also allow many-to-one and many-to-many mappings\n\n## Relations vs.\
    \ functions\n\n- If \\(R \\subseteq X \\times Y\\) is a relation, then is \\(R\\\
    ) a function?\n- If \\(f: X \\to Y\\) is a function, then is \\(f\\) a relation?\n\
    \n## Relations on a set\n\nA binary relation R on the set A is a relation from\
    \ A to A, i.e. R ⊆ A × A = A²\n\n- In other words, the domain and co-domain are\
    \ the same set\n- We will generally be studying relations of this type\n\n## Relations\
    \ on a set\n\n- Let A be the set { 1, 2, 3, 4 }\n- Which ordered pairs are in\
    \ the relation\n  R = { (a,b) | a divides b }\n- R = {(1,1), (1,2), (1,3), (1,4),\
    \ (2,2), (2,4), (3,3), (4,4)}\n\n![](img/47b87ec6fe4fa238d13429358848c545_721_0.png)\n\
    \n| R | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|\n| 1 | X | X | X | X |\n| 2 | \
    \  | X |   | X |\n| 3 |   |   | X |   |\n| 4 |   |   |   | X |\n"
