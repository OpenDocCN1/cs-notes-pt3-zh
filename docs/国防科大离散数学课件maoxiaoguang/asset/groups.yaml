    C，才能既得到 Γ, ¬A ⊢ C，又能得到 Γ, ¬A ⊢ ¬C，从而产生矛盾（再利用 ¬- 规则得到 A）。例如：¬(A→B) ⊢ A（可选取 A→B
    作为 C）。


    - 5. （右¬策略）若要证 Γ ⊢ ¬A，可把 A 作为附加前提引入，以推出矛盾（再利用 ¬+ 规则得到 ¬A）。如果把 A 作为附加前提引入之后，仍没有明确的证明思路，此时可以观察前提，考虑一下选什么作为
    C，才能既得到 Γ, A ⊢ C，又能得到 Γ, A ⊢ ¬C，从而产生矛盾（再利用 ¬+ 规则得到 ¬A）。


    - 6. （右↔策略）若要证 Γ ⊢ A↔B，一般可先证 Γ, A ⊢ B 和 Γ, B ⊢ A，然后利用 ↔+ 规则即可得到 Γ ⊢ A↔B。


    - 7. （左¬策略）若要证 Γ, ¬A ⊢ C，如果直接使用 ¬A 进行证明有困难，可以先证 Γ, ¬A, ¬C ⊢ C，然后利用 ¬+ 和 ¬- 规则得到
    Γ, ¬A ⊢ C。


    - 8. （左→策略）若要证 Γ, A→B ⊢ ?，可先证 Γ ⊢ A，然后利用 →- 规则得到 Γ, A→B ⊢ B，从而变复杂前提 A→B 为易于使用的简单前提。或者，可直接证
    Γ, A→B, A ⊢ B 以分解复杂前提 A→B，然后想办法消除附加前提。


    - 9. （左∧策略）若要证 Γ, A∧B ⊢ C，可直接分解前提 A∧B，得到 Γ, A∧B ⊢ A 和 Γ, A∧B ⊢ B。


    - 10. （左∨策略）若要证 Γ, A∨B ⊢ C，则可分别把 A 与 B 作为前提引入，即先证 Γ, A ⊢ C 和 Γ, B ⊢ C，再由 ∨ 规则得到
    Γ, A∨B ⊢ C。


    - 11. （左↔策略）若要证 Γ, A↔B ⊢ C，可利用 ↔ 规则得到 Γ, A↔B ⊢ A→B 和 Γ, A↔B ⊢ B→A，然后利用策略 8 对 A→B
    和 B→A 加以利用。


    ## 逆向分析方法


    利用自然推演系统进行证明之前，通常需要根据待证目标进行逆向分析。


    - 首先观察待证目标的前提、结论的公式形态

    - 然后选择合适的证明策略，将待证目标转换为一个或多个相对简单的目标

    - 对新目标重复上述处理


    ## 例


    试证明 ¬(A∧B) ⊢ ¬A∨¬B


    ¬(A∧B) ⊢ ¬A∨¬B


    （右∨策略）


    ¬(A∧B), A ⊢ ¬B


    （右¬策略）


    ¬(A∧B), A, B ⊢ 矛盾


    矛盾选取 ¬(A∧B) 和 (A∧B)


    ¬(A∧B), A, B ⊢ ¬(A∧B) 且 ¬(A∧B), A, B ⊢ (A∧B)


    （右∧策略）


    ¬(A∧B), A, B ⊢ A 且 ¬(A∧B), A, B ⊢ B


    ## 例子


    - 例1：证明 ⊢ (A∧B→C)→((A→B)→(A→C))

    - 例2：证明 ⊢ A∨¬A

    - 例3：证明 A ⊢ B→A

    - 例4：证明 ¬A ⊢ A→B

    - 例5：证明 A→B ⊢ ¬B→¬A

    - 例6：证明 ¬A→A ⊢ A

    - 例7：证明 ¬(A→B) ⊢ A

    - 例8：证明 ¬(A→B) ⊢ ¬B

    - 例9：证明 A∨B ⊢ ¬A→B

    - 例10：证明 ¬(A∨B) ⊢ ¬A∧¬B

    - 例11：证明 ¬(A∧B) ⊢ ¬A∨¬B


    ## 自然推理系统的规则


    - 18. ∀引入规则（∀+）：若 Γ ⊢ A(x)，则 Γ ⊢ (∀x)A(x)，其中 x 不是 Γ 中任何公式的自由变元。

    - 19. ∀消除规则（∀-）：若 Γ ⊢ (∀x)A(x)，则 Γ ⊢ A(t)，其中项 t 对于 A(x) 中的 x 是可代入的。

    - 20. ∃引入规则（∃+）：若 Γ ⊢ A(t)，则 Γ ⊢ (∃x)A(x)，其中项 t 对于 A(x) 中的 x 是可代入的。

    - 21. ∃消除规则（∃-）：若 Γ ⊢ (∃x)A(x) 且 Γ, A(b) ⊢ C，则 Γ ⊢ C，其中 b 是在 (∃x)A(x)、C 和 Γ 的每个公式中都不出现的个体常元。


    ## 规则解释 — 可代入


    “项 t 对于 A(x) 中的 x 是可代入的”：项 t 中的变元在代入后都不会变成约束的。


    例（不可代入）：


    - A(x) 为 (∃y)(x=2·y)（x 是偶数）

    - t 取 y+1

    - A(t) 为 (∃y)(y+1=2·y)（有一个自然数是1）


    原因：t 中的变元 y 在 A(t) 中变成约束。


    ## 规则解释 — ∃-规则中的条件


    “b 是在 (∃x)A(x)、C 和 Γ 的每个公式中都不出现的个体常元”这一条件不可少。


    否则：


    - (∃x)A(x) ⊢ (∃x)A(x)

    - (∃x)A(x), A(b) ⊢ A(b)（b 在 C 中出现）

    - 由此推出 (∃x)A(x) ⊢ A(b)（不合理！）


    即存在量词不能采取形如 (∃x)A(x) ⊢ A(b) 的直接消去。


    ## 导出规则


    - 9. 左∀引入规则：若 Γ, A(x) ⊢ B(x)，则 Γ, (∀x)A(x) ⊢ B(x)。

    - 10. ∀∀引入规则（其中 x 不是 Γ 中任何公式的自由变元）：若 Γ, A(x) ⊢ B(x)，则 Γ, (∀x)A(x) ⊢ (∀x)B(x)。

    - 11. 左∃引入规则（也记为 ∃-，这两个规则可以互换）：若 Γ, A(x) ⊢ B，则 Γ, (∃x)A(x) ⊢ B，其中 x 不是 Γ、B 中任何公式的自由变元。

    - 12. ∃∃引入规则：若 Γ, A(x) ⊢ B(x)，则 Γ, (∃x)A(x) ⊢ (∃x)B(x)，其中 x 不是 Γ 中任何公式的自由变元。


    ## 常用证明策略（量词部分）


    - 1. （右∀策略）若要证 Γ ⊢ (∀x)A(x)，可证结论相对简单的 Γ ⊢ A(x)（其中 x 不是 Γ 中任何公式的自由变量），然后利用 ∀₊ 规则得到
    Γ ⊢ (∀x)A(x)。

    - 2. （右∃策略）若要证 Γ ⊢ (∃x)A(x)，可先证 Γ ⊢ A(t)（其中项 t 对于 A(x) 中的 x 是可代入的），然后利用 ∃₊ 规则得到
    Γ ⊢ (∃x)A(x)。

    - 3. （左∀策略）若要证 Γ, (∀x)A(x) ⊢ C，可根据证明的需要利用 ∀- 规则将前提 (∀x)A(x) 特殊化为 A(t)（其中项 t 对于
    A(x) 中的 x 是可代入的）。

    - 4. （左∃策略）若要证 Γ, (∃x)A(x) ⊢ C，可以引入附加前提 A(b)（其中个体常元 b 不在 Γ、(∃x)A(x) 和 C 中出现），以便证出
    C（再由 ∃- 规则即可得出 Γ, (∃x)A(x) ⊢ C）。另一种策略是先证 Γ, A(x) ⊢ C（其中 x 不是 Γ 和 C 中任何公式的自由变元），再由左∃₊规则即可得到
    Γ, (∃x)A(x) ⊢ C。后一种方法较前一种方法更易于掌握。


    ## 左∃引入规则证明


    1. Γ, A(x) ⊢ B（已知）

    2. Γ ⊢ A(x)→B（→₊，1）

    3. Γ ⊢ (∀x)(A(x)→B)（∀₊，2）

    4. Γ, (∃x)A(x) ⊢ (∃x)A(x)（∈）

    5. Γ, (∃x)A(x), A(a) ⊢ A(a)（∈）

    6. Γ, (∃x)A(x), A(a) ⊢ (∀x)(A(x)→B)（∈₊，3）

    7. Γ, (∃x)A(x), A(a) ⊢ A(a)→B（∀-，6）

    8. Γ, (∃x)A(x), A(a) ⊢ B（→-，5, 7）

    9. Γ, (∃x)A(x) ⊢ B（∃-，4, 8）


