    \n## 合取联结词 (∧)\n\n• 定义：设定P, Q, “P并且Q” 生成新命题 P∧Q。读作 “P和Q”。\n\n| p | q | p∧q |\n\
    |---|---|---|\n| F | F | F |\n| F | T | F |\n| T | F | F |\n| T | T | T |\n\n\
