    \n谓词逻辑\n\n## 谓词逻辑\n\n- 谓词逻辑是命题逻辑的扩展，能对实体集合进行精确地推理。\n- 命题逻辑将简单命题当作原子命题\n- 谓词逻辑会区分命题中的谓词和主语\n\
    \n## 谓词逻辑的应用\n\n- 形式化描述数学中的定义、公理和定理\n- 形式化描述复杂系统\n- 自动定理证明器\n- 人工智能\n- …… \n"
