    \n![](img/47b87ec6fe4fa238d13429358848c545_264_0.png)\n\n## 析取联结词（∨）\n\n- p∨q为T表示p可为T，或q可为T，或p和q可同时为T。\n\
    - “p和q可同时为T”表示析取联结词∨是“相容的”\n- ¬和∨就能够表达各种命题操作\n\n## 例\n\nP：灯泡有故障\n\nQ：开关有故障\n\n\
