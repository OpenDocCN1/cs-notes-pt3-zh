  - '[PAGE 581]


    # Isomorphism


    +   The simple graphs G₁ = (V₁, E₁) and G₂ = (V₂, E₂) are isomorphic if there
    is a bijection (an one-to-one and onto function) f from V₁ to V₂ with the property
    that a and b are adjacent in G₁ if and only if f(a) and f(b) are adjacent in G₂,
    for all a and b in V₁.


    +   Such a function f is called an isomorphism.


    +   In other words, G₁ and G₂ are isomorphic if their vertices can be ordered
    in such a way that the adjacency matrices M_G₁ and M_G₂ are identical.'
