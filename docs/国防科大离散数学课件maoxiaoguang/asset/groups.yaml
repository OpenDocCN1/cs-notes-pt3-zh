    \ (∃x)(P(x,y)∧(∀x)P(x,z))\n\nP是不含自由变元x的谓词公式。\n\n证明：\na). 因P的值与x无关。若P为真，等价式两边都真。\n\
    若P为假，两边也都为∀xA(x)。\n\n## 量词辖域的扩展和收缩\n\n例： (∀x)(∀y)(P(x)→Q(y)) ⇔ ((∃x)P(x)→(∀y)Q(y))\n\
    \n## 量词的分配公式\n\n- a). (∀x)(A(x)∧B(x)) ⇔ (∀x)A(x) ∧ (∀x)B(x)\n\n- b). (∃x)(A(x)∨B(x))\
    \ ⇔ (∃x)A(x) ∨ (∃x)B(x)\n\na). 因为对一切x，A(x)∧B(x)为真,所以对一切x, A(x)为真且对一切x, B(x)为真。\n\
    \n## 证明：\n\n- b) \\(\\neg(\\exists x)\\,(A(x) \\lor B(x))\\)\n- \n- \\(\\Leftrightarrow\\\
