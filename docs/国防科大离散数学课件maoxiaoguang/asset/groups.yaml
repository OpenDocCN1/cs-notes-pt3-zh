  - '[PAGE 123]


    # Soundness and completeness


    +   To prove soundness of ℋ, prove the soundness of its axioms and inference rules
    (easy with truth-tables). For example:


    | A | B | A → (B → A) |

    |---|---|---|

    | F | F | T |

    | F | T | T |

    | T | F | T |

    | T | T | T |


    +   Completeness – harder, but possible.'
  - '[PAGE 124]


    # The resolution inference system


    ▪ The **resolution** inference rule for CNF:


    $$\frac{(l \lor l_1 \lor ... \lor l_n) \qquad (\neg l \lor l''_1 \lor ... \lor
    l''_n)}{(l_1 \lor ... \lor l_n \lor l''_1 \lor ... \lor l''_n)} \quad (\mathrm{Resolution})$$


    ▪ Example:


    $$\frac{(a \lor b) \qquad (\neg a \lor c)}{(b \lor c)}$$'
