  mdcn: "\n## 数理逻辑\n\n数理逻辑的四大分支：\n\n- 公理集合论\n- 递归论\n- 证明论（构造性数学）\n- 模型论\n\n逻辑演算（命题逻辑和一阶谓词逻辑）构成其共同基础。\n\
    \n电子计算机 = 电子学 + 数理逻辑\n\n## 命题逻辑的应用\n\n- 数字电路设计\n- 程序中条件的表达\n- 数据库查询、搜索引擎\n- 人工智能\n\
    - ……\n\n![](img/47b87ec6fe4fa238d13429358848c545_249_0.png)\n\n## 命题和联结词\n\n推理离不开判断，判断的语言表述就是命题。\n\
    \n## 命 题\n\n- 或真或假而不能二者都是\n- 可能要根据上下文确定真值\n\n命题：称具有确定真假意义的陈述句为命题。\n\n命题词：表示命题的形式符号。大写拉丁字母，如P。既可表示真命题，又可表示假命题，故称命题变元\n\
    \nT，F：命题常元（相对于命题变元）\n\n命题的真值： T（1）或F（0）\n\nT、F两种含义\n{\n命题的真值\n命题常量\n}\n\n## 命题\n\
    \n真命题： 意义为真的命题\n\n假命题： 意义为假的命题\n\n简单命题： 由简单陈述句表示的判断\n\n## 例\n\n- (1) 10是一个整数\n\
    - 命题为真,即真值为真\n- (2) 北京是中国的首都\n- (3) 3+3=8\n- 真值为假\n- (4) x+y=4\n- 是断言,不是命题\n-\
    \ (5) 吃过饭了吗？\n- 疑问句，不是命题\n- (6) 我正在说谎\n- 是悖论\n- (7) 快跑！\n- 是祈使句，不是命题\n- (8) 啦啦啦啦！\n\
    - 感叹句，不是命题\n\n## 复合命题\n\n- 由复合陈述句表示的判断\n- 布尔： ‘The Laws of Thought’, 1854\n\n\
    ## 命题联结词\n\n- 联结词（操作符）将一个或多个操作数组合成一个更大的表达式（如数值表达式中的“+”）\n  - 一元联结词作用于一个操作数（如：\
    \ -3）\n  - 二元联结词作用于两个操作数（如： 3×4）\n- 命题联结词作用于命题词或真值（T或F）上\n\n## 命题联结词总汇\n\n| 名称\
    \ | 元数 | 符号 |\n|---|---|---|\n| 否定联结词 | 一元 | ¬ |\n| 合取联结词 | 二元 | ∧ |\n| 析取联结词\
    \ | 二元 | ∨ |\n| 异或联结词 | 二元 | ⊕ |\n| 条件（蕴涵）联结词 | 二元 | → |\n| 双条件（等值）联结词 | 二元 |\
    \ ↔ |\n\n## 命题联结词\n\n- 函数： 命题联结词可视为函数\n  - 设集合 B={T, F}\n  - 一元联结词： U: B→B\n \
    \ - 二元联结词： T: B×B→B\n\n## 否定联结词（¬）\n\n- 定义：给定命题P， ¬P表示命题P的否定。\n  读作 “非P”\n\n##\
    \ 真值表\n\n| p | ¬p |\n|---|---|\n| T | F |\n| F | T |\n\n操作数列\n\n结果列\n\n## 例\n\n\
    - P: 长沙处处清洁\n  - ¬P: 长沙不处处清洁 (注意,不是处处不清洁)\n- Q: 这些都是男同学\n  - ¬Q: 这些不都是男同学\n- R:\
    \ 我的头发是棕色的\n  - ¬R: 我的头发不是棕色的\n\n![](img/47b87ec6fe4fa238d13429358848c545_260_0.png)\n\
    \n## 合取联结词 (∧)\n\n• 定义：设定P, Q, “P并且Q” 生成新命题 P∧Q。读作 “P和Q”。\n\n| p | q | p∧q |\n\
    |---|---|---|\n| F | F | F |\n| F | T | F |\n| T | F | F |\n| T | T | T |\n\n\
    ¬和∧就能够表达各种命题操作\n\n![](img/47b87ec6fe4fa238d13429358848c545_261_0.png)\n\n![](img/47b87ec6fe4fa238d13429358848c545_261_1.png)\n\
    \n## 例\n\nP：我们去植树\n\nQ：我们去浇水\n\nP∧Q：我们去植树并且我们去浇水\n\nP：今天下大雨\n\nQ：3+3=6\n\nP∧Q：今天下大雨并且3+3=6\
    \ 逻辑上允许\n\n- ∧满足结合率和交换率\n- N个操作数时的真值表\n- ∧是与汉语中“与”、“和”、“并”的翻译，但不能一概而论。\n  例: 小王与小张是堂兄弟\n\
    \n## 析取联结词 (∨)\n\n• 定义：设定P, Q, 则 “P或Q”也是一种命题，记作P∨Q，称为P, Q的析取。读作 “P或Q”\n\n| p |\
    \ q | p∨q |\n| F | F | F |\n| F | T | T |\n| T | F | T |\n| T | T | T |\n\n注意与合取的区别\n\
    \n![](img/47b87ec6fe4fa238d13429358848c545_264_0.png)\n\n## 析取联结词（∨）\n\n- p∨q为T表示p可为T，或q可为T，或p和q可同时为T。\n\
    - “p和q可同时为T”表示析取联结词∨是“相容的”\n- ¬和∨就能够表达各种命题操作\n\n## 例\n\nP：灯泡有故障\n\nQ：开关有故障\n\n\
    P∨Q：灯泡有故障或开关有故障\n\n![](img/47b87ec6fe4fa238d13429358848c545_266_0.png)\n\n## 练习\n\
    \nP：昨晚上下雨了。\nQ：昨晚上洒水了。\nR：今天早上草坪是湿的。\n\n请问下列表达式代表什么意思？\n\n- ¬P：昨晚没有下雨\n- R ∧ ¬P：今天早上草坪是湿的，并且昨晚没有下雨\n\
    - ¬R ∨ P ∨ Q：今天早上草坪不是湿的，或者昨晚上下雨了，或者昨晚上洒水了\n\n## 异或联结词（⊕）\n\n• 定义：设定P，Q，则“P异或Q”也是一种命题，记作P⊕Q，称为P，Q的异或。读作“P异或Q”\n\
    \n• P⊕Q表示P为T，或Q为T，但P和Q不能同时为真。⊕是“不相容”或，“排斥”或。\n\n$$(P\\lor Q)\\land(\\neg(P\\land\
    \ Q))$$\n\n## 异或联结词（⊕）\n\n## 真值表\n\n| p | q | p⊕q |\n|---|---|---|\n| F | F |\
    \ F |\n| F | T | T |\n| T | F | T |\n| T | T | F |\n\n注意与析取的区别\n\n## 例\n\nP：我的《离散数学》成绩是90分。\n\
    Q：我没有修《离散数学》。\nP ⊕ Q：我的《离散数学》成绩是90分，或我没有修《离散数学》。（二者不会同时为真）\n\nP：李四是男的\nQ：李四是女的\n\
    P ⊕ Q：李四是男的，或李四是女的。（不能同时成立）\n\n## 条件（蕴涵）联结词（→）\n\n- 定义：给定P，Q，“若P则Q”也是一个命题，记为P→Q。读作“若P则Q”，P称为前提、条件、前件，Q称为结论或后件。\n\
