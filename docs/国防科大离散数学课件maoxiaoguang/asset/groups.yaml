    \n## Weighted Graphs\n\n- A weighted graph is a graph in which each edge (u, v)\
    \ has a weight w(u, v). Each weight is a real number.\n- Weights can represent\
    \ distance, cost, time, capacity, etc.\n- The length of a path in a weighted graph\
    \ is the sum of the weights on the edges.\n- Dijkstra’s Algorithm finds the shortest\
    \ path between two vertices.\n\n## Shortest-Path Problem\n\nGiven a weighted graph\
    \ and two vertices u and v, we want to find a path of minimum total weight between\
    \ u and v.\n\n- Length of a path is the sum of the weights of its edges.\n\nApplication:\n\
    \n- Internet packet routing\n- Flight reservations\n- Driving directions\n\n##\
    \ Shortest Path Properties\n\n- Property 1:\n  - A subpath of a shortest path\
    \ is itself a shortest path\n- Property 2:\n  - There is a tree of shortest paths\
    \ from a start vertex to all the other vertices\n\n## Dijkstra's Algorithm\n\n\
    - Dijkstra’s algorithm is an iterative procedure that finds the shortest path\
    \ between to vertices a and z in a weighted graph.\n- It proceeds by finding the\
    \ length of the shortest path from a to successive vertices and adding these vertices\
    \ to a distinguished set of vertices S.\n- The algorithm terminates once it reaches\
    \ the vertex z.\n"
