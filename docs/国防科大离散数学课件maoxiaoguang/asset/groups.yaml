    # Overview of Resolution Proof


    $$(\neg p \lor q \lor r) \land (s \lor \neg q) \land \neg r \land p \land \neg
    s$$


    ![](img/47b87ec6fe4fa238d13429358848c545_85_0.png)'
  - '[PAGE 86]


    # Normal forms of PL formulas


    +   - Literal is a proposition symbol or its negation: Ex.: p, ¬q, r, ...

    +   - Elementary conjunction (EC) is a conjunction of literals. Ex.: p ∧ ¬q, r
    ∧ ¬r, ...

    +   - Elementary disjunction (ED) is a disjunction of literals. Ex.: p ∨ ¬q, r
    ∨ ¬r, ...

    +   - Complete elementary conjunction (CEC) of a given set S of elementary propositional
    symbols is an elementary conjunction in which each symbol (element of S) occurs
    just once: Ex.: p ∧ ¬q

    +   - Complete elementary disjunction (CED) of a given set S of elementary propositional
    symbols is an elementary disjunction in which each symbol (element of S) occurs
    just once: Ex.: p ∨ ¬q

    +   - Disjunctive normal form (DNF) of a formula F is a formula F′ such that F′
    is equivalent to F and F′ has the form of a disjunction of elementary conjunctions.
    Ex.: DNF(p ≡ p): (p ∧ p) ∨ (¬p ∧ ¬p), p ∨ ¬p

    +   - Conjunctive normal form (CNF) of a formula F is a formula F′ such that F′
    is equivalent to F and F′ has the form of a conjunction of elementary disjunctions.
    Ex.: CNF(p ≡ p): (¬p ∨ p) ∧ (¬p ∨ p)

    +   - Complete disjunctive normal form (CDNF) of a formula F is a formula F′ equivalent
    to F such that F′ has the form of a disjunction of complete elementary conjunctions.
    Ex.: UDNF(p ≡ q): (p ∧ q) ∨ (¬p ∧ ¬q)

    +   - Complete conjunctive normal form (CCNF) of a formula F is a formula F′ equivalent
    to F such that F′ has the form of a conjunction of complete elementary disjunctions.
    Ex.: UKNF(p ≡ q): (¬p ∨ q) ∧ (¬q ∨ p)

    +   - CDNF and CCNF are called canonic (or standard) forms of a formula.'
