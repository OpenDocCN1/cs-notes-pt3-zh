  - '[PAGE 467]


    # 判定思路


    谓词逻辑，其wff的永真性是半可判定的。

    本节讨论构造其半可判定程序（算法）的基础问题。


    +   给定A → 全称闭包∀A

    +   → 否定¬∀A

    +   → 前束化

    +   → Skolem化

    +   → 范式化'
  - '[PAGE 468]


    # 第一步、第二步


    1° 若公式A（x₁，…，xₙ）中仅含自由变元x₁，…，xₙ，\n则A（x₁，…，xₙ）是永真式


    iff


    (∀x₁)…(∀xₙ)A（x₁，…，xₙ）是永真式。


    仅讨论不含自由变元的公式，简称公式（句子）。


    2° 公式A是永真式　iff　¬A是永假式。


    由1°和2°，有：**判A永真 → 判∀A永真 → 判¬∀A永假**'
  - '[PAGE 469]


    # 前束范式


    设A为公式，若


    A ⇔ (Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ)B，


    则称(Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ)B 为 A 的前束范式，并且称(Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ) 为前束词， B
    为母式。


    其中： n≥0，


    +   Q₁, Q₂, …, Qₙ 是 ∀ 或 ∃，


    +   x₁, x₂, …, xₙ 是不同的变元，


    +   B 是不含量词的公式。'
  - '[PAGE 470]


    +   - 例1：∀x∀y∃z(Q(x, y) → R(z))

    +   - 例2：∀x∀y(¬P(x, y) → Q(y))'
  - '[PAGE 471]


    任意公式都可以化为它的前束范式。'
  - '[PAGE 472]


    # 第三步


    3° 公式前束化：


    +   ① 化掉 → 和 ↔ ；

    +   ② 将 ¬ 内移至原子的紧前面；

    +   ③ 利用等价式将 ∧、∃ 前（外）移


    操作过程中可能要对约束变元进行换名'
  - '[PAGE 473]


    # 公式前束化


    (1)把否定词深入到命题变元和谓词前面


    (2)利用

    A∨∀xB(x) ⇔ ∀x(A∨B(x))

    A∧∃xB(x) ⇔ ∃x(A∧B(x))

    把量词推到前面


    (3)利用改名规则：

    ∀x A(x)∨∀xB(x)

    ⇔ ∀uA(u) ∨∀xB(x))

    ⇔ ∀u∀x (A(u)∨B(x))

    把量词推到前面'
  - '[PAGE 474]


    # 例


    求下列公式的前束范式


    +   1、 ¬((∀x)(∃y)F(a, x, y) → (∃x)(¬(∀y)G(y, b)→H(x)))

    +   2、 (∀x)(∀y)(¬((∃z)(P(x,y,z) ∧R(y,z)))→(∃u)Q(x,y,u))

    +   3、 (∀x)P(x, y) ∨ (∀x)Q(x, z)'
  - '[PAGE 475]


    # 第四步


    4° Skolem化：（消去前束范式中存在量词的方法）


    在含有存在量词的前束范式A中，


    +   1、划去最左方的存在量词∃y；

    +   2、并且当∃y的左方没有全称量词时，任取一个不在A中出现也没有在这个过程中出现过的个体常量a，并在A的母式中以a代入y的所有自由出现；

    +   3、当∃y的左方依次有全称量词∀x₁，∀x₂，…，∀xₙ出现时，任取一个不在A中出现并且在这个过程中没有出现过的n元函数f，并在A的母式中以f(x₁，x₂，…，xₙ)代入y的所有自由出现。'
