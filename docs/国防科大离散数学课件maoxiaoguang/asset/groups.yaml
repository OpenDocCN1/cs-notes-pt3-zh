    # Truth Tables of Compound Propositions


    We can use logical operators (connectives) to build up complicated compound propositions
    involving any number of propositional variables, then use truth tables to determine
    the truth value of these compound propositions.


    The Truth Table of (p v ¬q) → (p ∧ q).


    | p | q | ¬q | p v ¬q | p ∧ q | (p v ¬q) → (p ∧ q) |

    | --- | --- | --- | --- | --- | --- |

    | T | T | F | T | T | T |

    | T | F | T | T | F | F |

    | F | T | F | F | F | T |

    | F | F | T | T | F | F |'
  - '[PAGE 39]


    # Precedence of operators


    We can use parentheses to specify the order in which logical operators in a compound
    proposition are to be applied.


    To reduce the number of parentheses, the precedence order is defined for logical
    operators.


    ```

    (((p ∨ (q ∧ (¬r))) → s) ↔ t)

    ```'
  - '[PAGE 40]


    # Precedence of operators


    +   Just as in algebra, operators have precedence

    +     ▸ 4+3*2 = 4+(3*2), not (4+3)*2


    +   Precedence order (from highest to lowest):

    +     ¬ ∧ ∨ → ↔

    +     ▸ The first three are the most important


    +   This means that p ∨ q ∧ ¬r → s ↔ t yields: (((p ∨ (q ∧ (¬r))) → s) ↔ t)


    +   ¬ is always performed before any other operation'
  - '[PAGE 41]


    # Translating English Sentences


    Question 7 from Rosen, p. 17


    +   - $p$ = “It is below freezing”

    +   - $q$ = “It is snowing”


    +   - It is below freezing and it is snowing — $p \land q$

    +   - It is below freezing but not snowing — $p \land \neg q$

    +   - It is not below freezing and it is not snowing — $\neg p \land \neg q$

    +   - It is either snowing or below freezing (or both) — $p \lor q$

    +   - If it is below freezing, it is also snowing — $p \to q$

    +   - It is either below freezing or it is snowing, but it is not snowing if it
    is below freezing — $(p \lor q) \land (p \to \neg q)$

    +   - That it is below freezing is necessary and sufficient for it to be snowing
    — $p \leftrightarrow q$'
