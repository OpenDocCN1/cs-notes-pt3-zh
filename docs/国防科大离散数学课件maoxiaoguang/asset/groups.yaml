  - '[PAGE 144]


    # Indirect proofs


    +   Consider an implication: p→q

    +   - It’s contrapositive is ¬q→¬p

    +     - Is logically equivalent to the original implication!

    +   - If the antecedent (¬q) is false, then the contrapositive is always true

    +   - Thus, show that if ¬q is true, then ¬p is true


    +   To perform an indirect proof, do a direct proof on the contrapositive'
  - '[PAGE 145]


    # Indirect proof example


    +   - If n² is an odd integer then n is an odd integer

    +   - Prove the contrapositive: if n is an even integer, then n² is an even integer


    (Proof) Assume n is an even integer


    n = 2k for some integer k (def. of even numbers)


    n² = (2k)² = 4k² = 2(2k²)


    Since n² is 2 times an integer, it is even


    +   - When do you use a direct proof versus an indirect proof?'
  - '[PAGE 146]


    # Example of which to use


    +   - Prove that if n is an integer and n³+5 is odd, then n is even


    +   - Via direct proof

    +     - n³+5 = 2k+1 for some integer k (definition of odd numbers)

    +     - n³ = 2k-4

    +     - Umm...      n = ∛(2k - 4)   ???


    +   - So direct proof doesn’t work out. So: indirect proof

    +     - Contrapositive: If n is odd, then n³+5 is even

    +     - Assume n is odd, and show that n³+5 is even

    +     - n=2k+1 for some integer k (definition of odd numbers)

    +     - n³+5 = (2k+1)³+5 = 8k³+12k²+6k+6 = 2(4k³+6k²+3k+3)

    +     - As 2(4k³+6k²+3k+3) is 2 times an integer, it is even'
  - '[PAGE 147]


    # Proof by contradiction


    +   - Given a statement p, assume it is false

    +     - Assume ¬p

    +   - Prove that ¬p cannot occur

    +     - A contradiction exists

    +   - Given a statement of the form p→q

    +     - To assume it’s false, you only have to consider the case where p is true
    and q is false'
  - '[PAGE 148]


    # Proof by contradiction example 1


    Theorem (by Euclid): There are infinitely many prime numbers.


    (Proof) Assume there are finite number of primes


    List them as follows: p₁, p₂ ..., pₙ.


    Consider the number q = p₁p₂ ... pₙ + 1


    +   - This number is not divisible by any of the listed primes

    +     - If we divided pᵢ into q, there would result a remainder of 1

    +   - We must conclude that q is a prime number, not among the primes listed above

    +     - This contradicts our assumption that all primes are in the list p₁, p₂
    ..., pₙ.'
  - '[PAGE 149]


    # Proof by contradiction example 2


    +   - Prove that if n is an integer and n³+5 is odd, then n is even

    +   - Rephrased: If n³+5 is odd, then n is even


    +   - Assume p is true and q is false

    +     - Assume that n³+5 is odd, and n is odd


    +   - n=2k+1 for some integer k (definition of odd numbers)


    +   - n³+5 = (2k+1)³+5 = 8k³+12k²+6k+6 = 2(4k³+6k²+3k+3)


    +   - As 2(4k³+6k²+3k+3) is 2 times an integer, it must be even


    +   - Contradiction!'
  - '[PAGE 150]


    # Vacuous and Trivial proofs


    # Vacuous proof


    +   - Consider an implication: p→q

    +   - If it can be shown that p is false, then the implication is always true

    +     - By definition of an implication


    # Trivial Proof


    +   - Consider an implication: p→q

    +   - If it can be shown that q is true, then the implication is always true

    +     - By definition of an implication'
  - '[PAGE 151]


    # Proof by cases


    +   Show a statement is true by showing all possible cases are true


    +   Thus, you are showing a statement of the form:

    +     ▸ (p₁ ∨ p₂ ∨ ... ∨ pₙ) → q


    +   is true by showing that:

    +     ▸ [(p₁∨p₂∨...∨pₙ)→q] ≡ [(p₁→q)∧(p₂→q)∧...(pₙ→q)]


    +   Make sure you get ALL the cases

    +     ▸ The biggest mistake is to leave out some of the cases'
  - '[PAGE 152]


    # Proof by cases example


    +   Prove that |a/b| = |a|/|b|

    +   Note that b ≠ 0


    +   Cases:


    +   Case 1: a ≥ 0 and b > 0

    +   Then |a| = a, |b| = b, and

    +   |a/b| = a/b = |a|/|b|


    +   Case 2: a ≥ 0 and b < 0

    +   Then |a| = a, |b| = -b, and

    +   |a/b| = -a/-b = a/|b| = |a|/|b|


    +   Case 3: a < 0 and b > 0

    +   Then |a| = -a, |b| = b, and

    +   |a/b| = -a/b = -a/b = |a|/|b|


    +   Case 4: a < 0 and b < 0

    +   Then |a| = -a, |b| = -b, and

