  md: "\n# Combining via relational composition\n\n+   Let M be the relation \"is\
    \ mother of\"\n+   Let F be the relation \"is father of\"\n+   What is M ∘ F ?\n\
    +     - If (a,b) ∈ F, then a is the father of b\n+     - If (b,c) ∈ M, then b\
    \ is the mother of c\n+     - Thus, M ∘ F denotes the relation \"maternal grandfather\"\
    \n+   What is F ∘ M ?\n+     - If (a,b) ∈ M, then a is the mother of b\n+    \
    \ - If (b,c) ∈ F, then b is the father of c\n+     - Thus, F ∘ M denotes the relation\
    \ \"paternal grandmother\"\n+   What is M ∘ M ?\n+     - If (a,b) ∈ M, then a\
    \ is the mother of b\n+     - If (b,c) ∈ M, then b is the mother of c\n+     -\
    \ Thus, M ∘ M denotes the relation \"maternal grandmother\"\n\n# Combining via\
    \ relational composition\n\nGiven relation R\n\n+   - R ◦ R can be denoted by\
    \ R²\n+   - R² ◦ R = (R ◦ R) ◦ R = R³\n+   - Example: M³ is your mother’s mother’s\
    \ mother\n\n0812210\n\n# Sets and Graphs\n\n# Ch 8.2 n-ary Relations\nand Their\
    \ Applications\n\nSpring 2010\n\nMao Xiaoguang\n\n# n-ary Relations\n\n+   - An\
    \ *n*-ary relation *R* on sets *A*₁,...,*A*ₙ is simply a subset *R* ⊆ *A*₁ × ...\
    \ × *A*ₙ, written (with signature) *R*:*A*₁ × ... × *A*ₙ or *R*:*A*₁,...,*A*ₙ.\n\
    +   - The sets *A*ᵢ are called the *domains* of *R*.\n+   - The *degree* of *R*\
    \ is *n*.\n+   - *R* is *functional* in the *domain* *A*ᵢ if it contains at most\
    \ one *n*-tuple (..., *a*ᵢ, ...) for any value *a*ᵢ within domain *A*ᵢ.\n\n# Example\n\
    \n+   - Let R be a relation on NxNxN consisting of triples (a,b,c) where a, b,\
    \ c are integers with a < b < c.\n+     - Then (1, 2, 3) is an element of R\n\
    +     - (2, 4, 3) is not\n+   - Let R be the relation with 5-tuples (A, N, S,\
    \ D, T). A: Airline, N: flight number, S: starting point, D: destination, T: departure\
    \ time\n+     - Degree of this Relation is 5\n+     - Domain: set of all airlines,\
    \ all flight numbers, all cities, all cities, all times\n\n# Relational Databases\n\
    \n+   A *relational database* is essentially just an *n*-ary relation *R*.\n+\
    \   A domain *A_i* is a *primary key* for the database if the relation *R* is\
    \ functional in *A_i*.\n+   Combinations of domains can also uniquely identify\
    \ n-tuples : composite key\n+   A *composite key* for the database is a set of\
    \ domains {...,*A_i*,...,*A_j*,...} such that *R* contains at most 1 *n*-tuple\
    \ (... ,*a_i*,...,*a_j*,...) for each composite value (... ,*a_i*...,*a_j*...)\
    \ ∈ ... × *A_i* × ... × *A_j* × ...\n\n# Selection Operators\n\n+   We may define\
    \ operations on n-ary relations\n+   Let A be any n-ary domain A=A₁ × ... × Aₙ,\
    \ and let C:A→{T,F} be any condition (predicate) on elements (n-tuples) of A.\n\
    +   Then, the selection operator s_C is the operator that maps any (n-ary) relation\
    \ R on A to the n-ary relation of all n-tuples from R that satisfy C.\n\n> I.e.,\
    \ ∀R⊆A, s_C(R) = {a∈R | s_C(a) = T}\n\n# Projection Operators\n\n+   Let $A =\
    \ A_1 \\times \\dots \\times A_n$ be any $n$-ary domain, and let $\\{i_k\\} =\
    \ (i_1, \\dots, i_m)$ be a sequence of indices all falling in the range 1 to $n$,\n\
    +   That is, where $1 \\le i_k \\le n$ for all $1 \\le k \\le m$.\n+   Then the\
    \ *projection* operator on n-tuples is defined by:\n\n$P_{\\{i_k\\}} : A_1 \\\
    times \\dots \\times A_n \\to A_{i_1} \\times \\dots \\times A_{i_m}$\n\n$P_{\\\
    {i_k\\}}(a_1, \\dots, a_n) = (a_{i_1}, \\dots, a_{i_m})$\n\n# Projection Example\n\
    \n■ Let Rooms be the relation with attributes\n{Place, Seats, BoardType, Computer}\n\
    \nA = {(P, S, B, C)}\n\nR = {(Fan171, 80, Chalk, Yes),\n    (Lws210, 25, No, Yes),\n\
    \    (Nek138, 50, Chalk, No),\n    (Agr212, 200, No, Yes), ...}\n\nR₁ = project\
    \ (R, {P, S}) will produce a relation\n     limited to the place and number of\
    \ seats.\n\nR₁ = {(Fan171, 80), (Lws210, 25),\n     (Nek138, 50), (Agr212, 200),\
    \ ...}\n\n# Join Operator\n\n+   Puts two relations together to form a sort of\
    \ combined relation.\n+   If the tuple (A,B) appears in R₁, and the tuple (B,C)\
    \ appears in R₂, then the tuple (A,B,C) appears in the join J(R₁,R₂).\n+   A,\
    \ B, and C here can also be sequences of elements (across multiple fields), not\
    \ just single elements.\n"
