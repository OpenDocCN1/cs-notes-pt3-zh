  - '[PAGE 738]


    # n-ary Relations


    +   - An *n*-ary relation *R* on sets *A*₁,...,*A*ₙ is simply a subset *R* ⊆ *A*₁
    × ... × *A*ₙ, written (with signature) *R*:*A*₁ × ... × *A*ₙ or *R*:*A*₁,...,*A*ₙ.

    +   - The sets *A*ᵢ are called the *domains* of *R*.

    +   - The *degree* of *R* is *n*.

    +   - *R* is *functional* in the *domain* *A*ᵢ if it contains at most one *n*-tuple
    (..., *a*ᵢ, ...) for any value *a*ᵢ within domain *A*ᵢ.'
  - '[PAGE 739]


    # Example


    +   - Let R be a relation on NxNxN consisting of triples (a,b,c) where a, b, c
    are integers with a < b < c.

    +     - Then (1, 2, 3) is an element of R

    +     - (2, 4, 3) is not

    +   - Let R be the relation with 5-tuples (A, N, S, D, T). A: Airline, N: flight
    number, S: starting point, D: destination, T: departure time

    +     - Degree of this Relation is 5

    +     - Domain: set of all airlines, all flight numbers, all cities, all cities,
    all times'
  - '[PAGE 740]


    # Relational Databases


    +   A *relational database* is essentially just an *n*-ary relation *R*.


    +   A domain *A_i* is a *primary key* for the database if the relation *R* is
    functional in *A_i*.


    +   Combinations of domains can also uniquely identify n-tuples : composite key


    +   A *composite key* for the database is a set of domains {...,*A_i*,...,*A_j*,...}
