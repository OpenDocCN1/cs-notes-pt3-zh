  - '[PAGE 101]


    # Conversion to CDNF with ↔


    +   ① Eliminate ↔, replacing α ↔ β with (α→β) ∧ (β→α).

    +   ② Eliminate →, replacing α → β with ¬α ∨ β.

    +   ③ Move ¬ inwards using de Morgan''s rules and double-negation.

    +      ▸ ¬(α∨β) ⇔ ¬α∧¬β

    +      ▸ ¬(α∧β) ⇔ ¬α∨¬β

    +      ▸ ¬¬α ⇔ α

    +   ④ Apply distributive law (∨ over ∧) and flatten.

    +      ▸ α∧(β∨γ) ⇔ (α∧β) ∨ (α∧γ)

    +   □ Supplement of missing literals.

    +      ▸ α ⇔ (α∧¬γ) ∨ (α∧γ)'
  - '[PAGE 102]


    # Resolution rule in the propositional logic


    Let l be a literal. From (A ∨ l) ∧ (B ∨ ¬l) infer (A ∨ B). Notation:


    (A ∨ l) ∧ (B ∨ ¬l)

    -----------------

    (A ∨ B) resolvent


    This rule does not lead to an equivalent formula. But it preserves satisfiability.


    (Proof:)


    Let formula (A ∨ l) ∧ (B ∨ ¬l) be non-contradictory.

    Hence there is a interpretation I in which it is true.

    In this I both the disjuncts (so called clauses) are true:

    (A ∨ l) and (B ∨ ¬l).


    Let I (l) = F. Then I (A) = T and I (A ∨ B) = T.


    Let I (l) = T. Then I (¬l) = F and I (B) = T, thus I (A ∨ B)=T.


    In both cases the formula A ∨ B is true in the model I of the original formula,
    hence it is not a contradiction.'
  - "[PAGE 103]\n\n# Further findings\n\n+   If you realize that the above proof is\
    \ valid for any valuation \\(v\\), then you see that the rule is truth preserving:\n\
    +   \n+   \\[\n+   (A \\lor I) \\land (B \\lor \\neg I) \\Rightarrow (A \\lor\
    \ B)\n+   \\]\n\n+   Thus you obtained also a method of finding **logical consequences\
    \ of a formula.**\n\n+   Moreover:\n+   \n+   \\[\n+   (A \\lor I) \\land (B \\\
    lor \\neg I) \\Leftrightarrow (A \\lor I) \\land (B \\lor \\neg I) \\land (A \\\
    lor B)\n+   \\]"
  - '[PAGE 104]


    # Clausal form


    +   The conjunctive normal form is called clausal form. Particular conjuncts (i.e.,
    elementary disjunctions) are called clauses.


    +   Example:


    Transition of a formula into the clausal form:

    ¬[((p → q) ∧ (r ∨ ¬q) ∧ ¬r) → ¬p] ⇔

    ((p → q) ∧ (r ∨ ¬q) ∧ ¬r) ∧ p ⇔

    (¬p ∨ q) ∧ (r ∨ ¬q) ∧ ¬r ∧ p


    +   The formula consists of four clauses.


    The proof of contradiction:


    +   (¬p ∨ q) ∧ (r ∨ ¬q) ∧ (¬p ∨ r) ∧ ¬r ∧ ¬p ∧ p'
  - '[PAGE 105]


    # Proof by resolution


    +   R(F) – conjunctive extension of a formula F by all its resolvents


    +   R₀(F) = F, Rᵢ(F) = R(R_{i-1}(F)) – resolution closure of F. It holds that
    Rᵢ(F) ⇔ F


    +   Proof: A is a contradiction (not satisfiable): there is an n such that Rₙ(A)
    contains the empty clause:


    +   Proof: A is a tautology: ¬A is a contradiction


    +   Proof: a set of formulas {A₀,...,Aₙ} is not satisfiable. We prove that the
    formula A₁ ∧... ∧ Aₙ is a contradiction


    +   Infer logical consequences of {A₁,...,Aₙ}: infer all the resolvents.


    +   Proof of validity: A₁,...,Aₙ |= Z


    +   Direct: by step-by-step inferring resolvents from A₁,...,Aₙ you obtain Z


    +   Indirect: prove that A₁ ∧...∧ Aₙ → Z is a tautology, i.e., A₁ ∧...∧ Aₙ ∧ ¬Z
    is a contradiction, i.e., the set {A₁,...,Aₙ,¬Z} is not satisfiable'
  - '[PAGE 106]


    # Example —

    direct proof / forward reasoning


    +   Prove that (¬q → p) ∧ (p ∨ r) ∧ (q → ¬r) logically entails p.


    +   CNF: (q ∨ p) ∧ (p ∨ r) ∧ (¬q ∨ ¬r)


    +   Direct proof: from facts to conclusion


    (Proof:)


    +   1. q ∨ p        fact


    +   2. p ∨ r        fact


    +   3. ¬q ∨ ¬r      fact


    +   4. p ∨ ¬r       resolution: 1, 3


    +   5. p            resolution: 2, 4'
  - '[PAGE 107]


    # Example –

    indirect proof / backward reasoning


    +   Prove that (¬q → p) ∧ (p ∨ r) ∧ (q → ¬r) logically entails p.


    +   Convert to: Prove that the following wff is a contradiction:

    +   (¬q → p) ∧ (p ∨ r) ∧ (q → ¬r) ∧ ¬p


    +   CNF: (q ∨ p) ∧ (p ∨ r) ∧ (¬q ∨ ¬r) ∧ ¬p

    +   (Proof by resolution:)


    +   1. q ∨ p


    +   2. p ∨ r


    +   3. ¬q ∨ ¬r


    +   4. ¬p


    +   5. p ∨ ¬r        resolution: 1, 3


    +   6. p             resolution: 2, 5


    +   7.               4, 6'
  - '[PAGE 108]


    # Example


    (q ∨ p)


    (p ∨ r)


    (-q ∨ -r)


    ¬p


    (p ∨ ¬r)


    p


    Contradiction → {}'
  - '[PAGE 109]


    # Logic programming


    Strategies of generating resolvents:


    +   - **Breadth-first** (pursue all closest paths first)

    +     - Resolution closure – generates **all** resolvents

    +     - It can be rather inefficient due to combinatorial explosion of resolvents


    +   - **Depth-first** (top down: pursue first path to exhaustion before looking
    an next path)

    +     - It is very simple and efficient to implement, but it is **not complete**;
    it can lead to some very odd infinite loops though there is a solution in a neighbouring
    branch.'
