    +     - A study showed that there was a correlation between the more children
    ate dinners with their families and lower rate of substance abuse by those children

    +     - Announcer conclusions:

    +       - If children eat more meals with their families, they will have lower
    substance abuse

    +       - If they have a higher substance abuse rate, then they did not eat more
    meals with their families'
