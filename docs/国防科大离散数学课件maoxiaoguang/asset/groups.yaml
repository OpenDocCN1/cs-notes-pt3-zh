    \n对于 § 4.3中列举的命题逻辑的等价式和蕴含式，用谓词逻辑中的合式公式代替其中的命题变元就得到谓词逻辑中的等价式和蕴含式。\n\n例如， P ∧ (P→Q)\
    \ ⇒ Q 得到 (∃x)P(x) ∧ ((∃x)P(x)→(∀x)Q(x)) ⇒ (∀x)Q(x)\n\n真值表方法对于谓词逻辑中wff的永真式判定失效；但解释法仍适用。\n\
    \n## 例\n\n证明蕴含式：\n(∃x)(A(x)∧B(x)) ⇒ (∃x)A(x)∧(∃x)B(x)\n\n分析： (∃x)(A(x)∧B(x)) ⇒\
    \ (∃x)A(x)∧(∃x)B(x)\n\n(∃x)(A(x)∧B(x)) → (∃x)A(x)∧(∃x)B(x)是永真式\n\n∀I，若((∃x)(A(x)∧B(x)))I的真值为T，则((∃x)A(x)∧(∃x)B(x))I的真值也为T\n\
    \n## 例\n\n证明蕴含式：\n(∀x)A(x) ∨ (∀x)B(x) ⇒ (∀x)(A(x) ∨ B(x))\n\n分析： (∀x)A(x) ∨ (∀x)B(x)\
    \ ⇒ (∀x)(A(x) ∨ B(x))\n\n(∀x)A(x) ∨ (∀x)B(x) → (∀x)(A(x) ∨ B(x))是永真式\n\n∀I，若((∀x)A(x)\
    \ ∨ (∀x)B(x))I的真值为T，则((∀x)(A(x) ∨ B(x)))I的真值也为T\n\n∀I，若((∀x)(A(x) ∨ B(x)))I的真值为F，则((∀x)A(x)\
    \ ∨ (∀x)B(x))I的真值也为F\n\n## 例\n\n判定 (∃x)P(x) ∧ (∃x)Q(x) → (∃x)(P(x) ∧ Q(x)) 是否为永真式\n\
    \n分析： (∃x)P(x) ∧ (∃x)Q(x) → (∃x)(P(x) ∧ Q(x)) 为假\n\n(∃x)P(x) ∧ (∃x)Q(x) (∃x)(P(x)\
    \ ∧ Q(x))\n---------------------------\nT F\n\n(∃x)P(x) (∃x)Q(x) (∃x)(P(x) ∧ Q(x))\n\
    -------- -------- -------------------\nT T F\n\n证明：构造解释如下：\n\n+ i) D = {1, 2}\n\
    + ii) P(1) P(2) Q(1) Q(2)\n ----- ----\n T F F T\n\n则(∃x)P(x)，(∃x)Q(x)在I下均为真，而(∃x)(P(x)\
    \ ∧ Q(x))在I下为假。故非永真式。\n\n## 例\n\n判定(∀x)P(x)→(∃x)P(x)是否为永真式？\n\n# 分析：假设存在使上式为假的解释I（论域为D），\n\
    \n(∀x)P(x)→(∃x)P(x) 在I下为假\n\n(∀x)P(x)在I下为真 且 (∃x)P(x)在I下为假\n\n对于任何d∈D\nP(d)在I均为真\n\
    \n对于任何c∈D\n均有P(c)在I为假\n\n矛盾\n\n所以假设不成立，即(∀x)P(x)→(∃x)P(x)为永真式。\n\n## 定理5.3.2（置换定理）\n\
    \n设A为合式公式G的分子公式，B为与A等价的合式公式，R为用B取代G中A之若干出现后所得之合式公式，则G⇔R。\n\n## 例\n\n试证明等价式：\n\n\
    + 1). ¬(∀x)P(x) ⇔ (∃x)(¬P(x))\n+ 2). ¬(∃x)P(x) ⇔ (∀x)(¬P(x))\n\n证明：1). ¬(∀x)P(x)\
    \ ⇔ (∃x)(¬P(x))\n\n¬(∀x)P(x) ↔ (∃x)(¬P(x))是永真式\n\n¬(∀x)P(x)→(∃x)(¬P(x))是永真式 且\
    \ (∃x)(¬P(x))→¬(∀x)P(x)是永真式\n\n对于¬(∀x)P(x)→(∃x)(¬P(x))在任意论域D上的任意解释I，若¬(∀x)P(x)在I下为真，则(∀x)P(x)在I下为假，即有a∈D使P(a)为假，所以¬P(a)为真，故(∃x)(¬P(x))在I下为真。\n\
    \n对于(∃x)(¬P(x))→¬(∀x)P(x)在任意论域D上的任意解释I，若(∃x)(¬P(x))在I下为真，则有a∈D使¬P(a)为真，即P(a)为假，所以(∀x)P(x)为假，故¬(∀x)P(x)在I下为真。\n\
    \n## 例\n\n试证明等价式：\n\n+ 1). $(\\exists x)(A(x)\\lor B(x))\\Leftrightarrow (\\exists\
    \ x)A(x)\\lor(\\exists x)B(x)$\n+ \n+ 2). $(\\forall x)(A(x)\\land B(x))\\Leftrightarrow\
    \ (\\forall x)A(x)\\land(\\forall x)B(x)$\n\n**证明：** 1). 对于任意论域D上的任意解释，\n\n$(\\\
    exists x)(A(x)\\lor B(x))$在I下为真　　iff\n\n有$a\\in D$使$A(a)\\lor B(a)$为真　　iff\n\n\
    有$a\\in D$使$A(a)$为真或$B(a)$为真　　iff\n\n$(\\exists x)A(x)$为真或$(\\exists x)B(x)$为真　　iff\n\
    \n$(\\exists x)A(x)\\lor(\\exists x)B(x)$在I下为真\n\n## 一些重要的等价式和蕴含式\n\nE25 (∃x)(A(x)\
    \ ∨ B(x)) ⇔ (∃x)A(x) ∨ (∃x)B(x)\n\nE26 (∀x)(A(x) ∧ B(x)) ⇔ (∀x)A(x) ∧ (∀x)B(x)\n\
    \nE27 ¬(∃x)A(x) ⇔ (∀x)(¬A(x))\n\nE28 ¬(∀x)A(x) ⇔ (∃x)(¬A(x))\n\nE29 (∀x)(A(x)\
    \ ∨ P) ⇔ (∀x)A(x) ∨ P\n\nE30 (∀x)(A(x) ∧ P) ⇔ (∀x)A(x) ∧ P\n\nE31 (∃x)(A(x) ∨\
    \ P) ⇔ (∃x)A(x) ∨ P\n\nE32 (∃x)(A(x) ∧ P) ⇔ (∃x)A(x) ∧ P\n\n## 一些重要的等价式和蕴含式\n\n\
    E33 (∃x)(A(x)→P) ⇔ (∀x)A(x)→P\n\nE34 (∀x)(A(x)→P) ⇔ (∃x)A(x)→P\n\nE35 (∀x)(P→B(x))\
    \ ⇔ P→(∀x)B(x)\n\nE36 (∃x)(P→B(x)) ⇔ P→(∃x)B(x)\n\nE37 (∃x)(A(x)→B(x)) ⇔ (∀x)A(x)→(∃x)B(x)\n\
    \nI15 (∀x)A(x) ∨ (∀x)B(x) ⇒ (∀x)(A(x) ∨ B(x))\n\nI16 (∃x)(A(x) ∧ B(x)) ⇒ (∃x)A(x)\
    \ ∧ (∃x)B(x)\n\nI17 (∃x)A(x)→(∀x)B(x) ⇒ (∀x)(A(x)→B(x))\n\nI18 (∀x)A(x) ⇒ (∃x)A(x)\n"
