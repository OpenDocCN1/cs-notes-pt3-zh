    \ ↔ |\n\n## 命题联结词\n\n- 函数： 命题联结词可视为函数\n  - 设集合 B={T, F}\n  - 一元联结词： U: B→B\n \
    \ - 二元联结词： T: B×B→B\n\n## 否定联结词（¬）\n\n- 定义：给定命题P， ¬P表示命题P的否定。\n  读作 “非P”\n\n##\
