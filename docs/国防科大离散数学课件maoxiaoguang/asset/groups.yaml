  - '[PAGE 550]


    # Adjacent and Endpoints


    +   - Two vertices u and v in an undirected graph G are called **adjacent** (or
    **neighbors**) in G if {u, v} is an edge in G.

    +   - If e = {u, v}, the edge e is called **incident with** the vertices u and
    v. The edge e is also said to connect u and v.

    +   - The vertices u and v are called **endpoints** of the edge {u, v}.'
  - '[PAGE 551]


    # Degree - deg(v)


    +   The degree of a vertex in an undirected graph is the number of edges incident
    with it, except that a loop at a vertex contributes twice to the degree of that
    vertex.


    +   In other words, you can determine the degree of a vertex in a displayed graph
    by counting the lines that touch it.


    +   The degree of the vertex v is denoted by deg(v).'
  - '[PAGE 552]


    # Isolated and Pendent Vertices


    +   A vertex of degree 0 is called isolated, since it is not adjacent to any vertex.


    +   Note: A vertex with a loop at it has at least degree 2 and, by definition,
    is not isolated, even if it is not adjacent to any other vertex.


    +   A vertex of degree 1 is called pendant. It is adjacent to exactly one other
    vertex.'
  - '[PAGE 553]


    # Example


    Which vertices in the following graph are isolated, which are pendant, and what
    is the maximum degree? What type of graph is it?


    ![](img/47b87ec6fe4fa238d13429358848c545_553_0.png)


    Vertex f is isolated, and vertices a, d and j are pendant. The maximum degree
    is deg(g) = 5. This graph is a pseudograph.'
  - "[PAGE 554]\n\n# Handshaking Theorem\n\n+   The Handshaking Theorem: Let G = (V,\
    \ E) be an undirected graph with n edges. Then\n+   \n+   2n = Σv∈V deg(v)\n\n\
    +   Note: This theorem holds even if multiple edges and/or loops are present.\n\
    \n+   Example: How many edges are there in a graph with 10 vertices, each of degree\
    \ 6?\n\n+   Solution: The sum of the degrees of the vertices is 6·10 = 60. According\
    \ to the Handshaking Theorem, it follows that 2e = 60, so there are 30 edges."
  - '[PAGE 555]


    # Theorem Proof


    +   - Theorem: An undirected graph has an even number of vertices of odd degree.


    +   - Idea: There are three possibilities for adding an edge to connect two vertices
    in the graph:


    +   - Before:

    +     Both vertices have even degree

    +     Both vertices have odd degree

    +     One vertex has odd degree, the other even

    +     After:

    +     Both vertices have odd degree

    +     Both vertices have even degree

    +     One vertex has even degree, the other odd'
  - '[PAGE 556]


    # continue...


    +   There are two possibilities for adding a loop to a vertex in the graph:


    +   Before:

    +   The vertex has even degree

    +   The vertex has odd degree

    +   After:

    +   The vertex has even degree

    +   The vertex has odd degree


    +   So if there is an even number of vertices of odd degree in the graph, it will
    still be even after adding an edge.


    +   Therefore, since an undirected graph with no edges has an even number of vertices
    with odd degree (zero), the same must be true for any undirected graph.'
  - '[PAGE 557]


    # Adjacent, Initial and Terminal Vertices


    +   When (u, v) is an edge of the graph G with directed edges, u is said to be
    adjacent to v, and v is said to be adjacent from u.


    +   The vertex u is called the initial vertex of (u, v), and v is called the terminal
    vertex of (u, v).


    +   The initial vertex and terminal vertex of a loop are the same.'
