    +   - By adding those edges, we have made a non-symmetric relation R into a symmetric\
    \ relation\n+   - This new relation is called the **symmetric closure** of R\n\
    \n![](img/47b87ec6fe4fa238d13429358848c545_789_0.png)\n\n## Symmetric closure\n\
    \n+   - In order to find the symmetric closure of a relation $R$, we add an edge\
    \ from $a$ to $b$, where there is already an edge from $b$ to $a$\n+   - The symmetric\
