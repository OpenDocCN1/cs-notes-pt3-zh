    # 项


    项为按以下规则构成的有穷符号串：


    +   i) 每个个体常量是一个项；

    +   ii) 每个个体变元是一个项；

    +   iii) 如果f是一个n元(n≥1)函词且t₁, …, tₙ都是项，则f(t₁, …, tₙ)也是一个项。'
  - '[PAGE 406]


    # 原子


    原子（atf）为按以下规则构成的有穷符号串：


    +   i) 每个命题词是一个原子；


    +   ii) 若P为n元(n≥1)谓词且t₁, …, tₙ都是项，则P(t₁, …, tₙ)是一个原子。'
  - "[PAGE 407]\n\n# # 合式公式\n\n合式公式（wff），是按以下规则构成的有穷符号串：\n\n+   i) 每个原子是一个 wff；\n\
    +   \n+   ii) 如果 A 是 wff，则 (¬A) 是 wff；\n+   \n+   iii) 如果 A 和 B 都是 wff，则 (A∨B)、(A∧B)、(A→B)\
    \ 和 (A↔B) 都是 wff；\n+   \n+   iv) 如果 A 是 wff，x 为个体变元，则 (∀x)A 和 (∃x)A 都是 wff；\n\
    +   \n+   v) 只有有限次应用步骤 i)、ii)、iii) 和 iv) 构成的公式才是合式公式。\n\n分子合式公式：构造过程中的 wff。"
