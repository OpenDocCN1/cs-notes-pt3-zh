    \ last.\n\n## Semantics of FOL\n\n- Domain D: the set of all objects in the world\
    \ (of interest).\n- Interpretation I: includes\n  - Assign each constant to an\
    \ object in D;\n  - Define each function of n arguments as a mapping Dⁿ → D;\n\
    \  - Define each predicate of n arguments as a mapping Dⁿ → {T, F}.\n    - Therefore,\
    \ every ground predicate with any instantiation will have a truth value.\n   \
    \ - In general there is an infinite number of interpretations because |D| is infinite.\n\
    - A pair M = <D, I> is called a structure.\n- Define logical connectives: ¬, ∧,\
    \ ∨, →, ↔ as in PL.\n- Define semantics of (∀x) and (∃x):\n  - (∀x) P(x) is true\
    \ iff P(x) is true under all interpretations.\n  - (∃x) P(x) is true iff P(x)\
    \ is true under some interpretation.\n\n## Valuation of FOL sentences\n\n### Valuation\
    \ of truth values of FOL sentences\n\n(FOL formulas without any free variable)\n\
    \nRecursive definition for interpreting terms and evaluating truth values of formulas\
    \ (M = <D, I>):\n\n- For c ∈ {c₁,...,cₙ}: [[cᵢ]] = I(cᵢ).\n- [[fᵢ(t₁,...,tᵣ)]]\
    \ = I(fᵢ)([[t₁]],...,[[tᵣ]]).\n- [[R(t₁,...,tᵣ)]] = T iff <[[t₁]],...,[[tᵣ]]>\
    \ ∈ I(R).\n- [[φ ∧ ψ]] = T iff [[φ]] = T and [[ψ]] = T.\n- [[φ ∨ ψ]] = T iff [[φ]]\
    \ = T or [[ψ]] = T.\n- [[¬φ]] = T iff [[φ]] = F.\n- [[∀x φ(x)]] = T iff for all\
    \ d ∈ D: [[φ(x)]]_{x=d} = T.\n- [[∃x φ(x)]] = T iff there exists d ∈ D: [[φ(x)]]_{x=d}\
    \ = T.\n\n## Models and satisfiability\n\n### Models\n\n- Model\n  - If the interpretation\
    \ of a formula φ with respect to a structure M = <D, I> results in the truth value\
    \ T, M is called a model for φ (formal: M |= φ).\n- Validity\n  - If every structure\
    \ M = <D, I> is a model for φ, we call φ valid (|= φ).\n- Satisfiability\n  -\
    \ If there exists a model M = <D, I> for φ, we call φ satisfiable.\n- Logical\
    \ consequence\n  - A formula φ is a logical consequence (or a logical entailment)\
    \ of A = {A₁,...,Aₙ}, if each model for A is also a model for φ.\n  - We write\
    \ A |= φ.\n  - Notice: A |= φ can mean that A is a model for φ or that φ is a\
    \ logical consequence of A.\n    - Therefore people usually use different alphabets\
    \ or fonts to make this difference visible.\n\n## Examples\n\n∀x∀y (R(x) ∧ R(y)\
    \ → R(x) ∨ R(y)) [valid]\n\n- \"If x and y are rich, either x is rich or y is\
    \ rich.\"\n- \"If x and y are even, either x is even or y is even.\"\n\n∃x (N(x)\
    \ ∧ P(x,c)) [satisfiable]\n\n- There is a natural number that is smaller than\
    \ 17.\n- There exists someone who is a student and likes logic.\n- Notice that\
    \ there are models which make the statement false.\n\n## The electronic circuits\
    \ domain\n\n### One-bit full adder\n\n![](img/47b87ec6fe4fa238d13429358848c545_218_0.png)\n\
    \n- 1. Identify the task\n  - Does the circuit actually add properly? (circuit\
    \ verification)\n- 2. Assemble the relevant knowledge\n  - Composed of wires and\
    \ gates; types of gates (AND, OR, XOR, NOT)\n  - Irrelevant: size, shape, color,\
    \ cost of gates\n- 3. Decide on a vocabulary\n  - Alternatives:\n    - Type(X₁)\
    \ = XOR\n    - Type(X₁, XOR)\n    - XOR(X₁)\n"
  mdcn: "\n## Syntax of FOL Language\n\n- Let V be a fixed infinite set of symbols\
    \ called variables.\n- A language of FOL is a triple L = (C, F, P), where\n  -\
    \ C is a set of symbols called individual constants;\n  - F is a set of symbols\
    \ called function symbols, each with an assigned arity ≥ 1;\n  - P is a set of\
    \ symbols called predicate symbols, each with an assigned arity ≥ 1;\n  - V, C,\
    \ F, and P are pairwise disjoint.\n- A term of L is a string of symbols inductively\
    \ defined by the following formation rules:\n  - Each x ∈ V and a ∈ C is a term\
    \ of L.\n  - If f ∈ F is n-ary and t₁,...,tₙ are terms of L, then f(t₁,...,tₙ)\
    \ is a term of L.\n- A formula of L is a string of symbols inductively defined\
    \ by the following formation rules:\n  - If p ∈ P is n-ary and t₁,...,tₙ are terms\
    \ of L, then p(t₁,...,tₙ) is a formula of L.\n  - If A and B are formulas of L\
    \ and x ∈ V, then (¬A), (A∧B), (A∨B), (A→B), (A↔B), (∀x.A) and (∃x.A) are formulas\
    \ of FOL.\n\n## Notational conventions\n\n- The precedence of the logical operators\
