    # Graphs


    +   A graph G = (V, E) consists of V, a nonempty set of vertices, and E, a set
    of edges. Each edge is associated with one or two vertices (an unordered pair
    of vertices), called its endpoints.


    +   A simple graph is a graph in which each edge connects two different vertices
    and where no multiple edges connect the same pair of vertices.


    +   A multigraph is a graph that may have multiple edges connecting the same pair
    of vertices (u,v∈V, u≠v)

    +     - The edges e1 and e2 are called multiple or parallel edges if f(e1) = f(e2).

    +     - No loops are allowed in multigraphs (u ≠ v).'
