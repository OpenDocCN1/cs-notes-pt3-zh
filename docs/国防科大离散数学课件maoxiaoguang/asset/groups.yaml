  - '[PAGE 212]


    # Syntax of FOL Language


    +   Let V be a fixed infinite set of symbols called variables.


    +   A language of FOL is triple L=(C,F,P) where

    +     - C is set of symbols called individual constants

    +     - F is a set of symbols called function symbols, each with an assigned arity
    ≥ 1

    +     - P is a set of symbols called predicate symbols, each with an assigned
    arity ≥ 1.

    +     - V, C, F, and P are pairwise disjoint.


    +   A term of L is a string of symbols inductively defined by the following formation
    rules:

    +     - Each x ∈ V and a ∈ C is a term of L.

    +     - If f ∈ F is n-ary and t₁,...,tₙ are terms of L, then f(t₁...tₙ) is a term
    of L.


    +   A formula of L is a string of symbols inductively defined by the following
    formation rules:

    +     - If p ∈ P is n-ary and t₁,...,tₙ are terms of L, then p(t₁...tₙ) is formula
    of L.

    +     - If A and B are formulas of L and x ∈ V , then (¬A), (A∧B), (A∨B), (A→B),
    (A↔B), (∀x.A) and (∃x.A) are formulas of FOL.'
  - '[PAGE 213]


    # Notational conventions


    +   The precedence of the logical operators in PL

    +     ¬ ∧ ∨ → ↔


    +   A common convention is:

    +     ¬ is evaluated first;

    +     ∧ and ∨ are evaluated next;

    +     Quantifiers ∀ and ∃ are evaluated next;

    +     → and ↔ are evaluated last.'
  - '[PAGE 214]


    # Semantics of FOL


    +   Domain D: the set of all objects in the world (of interest)


    +   Interpretation I: includes

    +     - Assign each constant to an object in D

    +     - Define each function of n arguments as a mapping Dⁿ → D

    +     - Define each predicate of n arguments as a mapping Dⁿ → {T, F}

    +       - Therefore, every ground predicate with any instantiation will have a
    truth value

    +       - In general there is an infinite number of interpretations because |D|
    is infinite


    +   A pair M = <D, I> is called a structure.


    +   Define logical connectives: ~, ^, v, =>, <= > as in PL


    +   Define semantics of (∀x) and (∃x)

    +     - (∀x) P(x) is true iff P(x) is true under all interpretations

    +     - (∃x) P(x) is true iff P(x) is true under some interpretation'
  - '[PAGE 215]


    # Valuation of FOL sentences


    # Valuation of truth values of FOL sentences

    (FOL formulas without any free variable)


    Recursive definition for interpreting terms and evaluating truth values of formulas:
    (M = <D, I>)


    +   For c ∈ {c₁,...,cₙ}: [[cᵢ]] = I(cᵢ)


    +   [[fᵢ(t₁,...,tᵣ)]] = I(fᵢ)([[t₁]],...,[[tᵣ]])


    +   [[R(t₁,...,tᵣ)]] = T iff <[[t₁]],...,[[tᵣ]]> ∈ I(R)


    +   [[φ ∧ ψ]] = T iff [[φ]] = T and [[ψ]] = T


    +   [[φ ∨ ψ]] = T iff [[φ]] = T or [[ψ]] = T


    +   [[¬φ]] = T iff [[φ]] = F


    +   [[∀x φ(x)]] = T iff for all d ∈ D: [[φ(x)]]ₓ=ₔ = T


    +   [[∃x φ(x)]] = T iff there exists d ∈ D: [[φ(x)]]ₓ=ₔ = T'
  - '[PAGE 216]


    # Models and satisfiability


    # Models


    +   - Model

    +     - If the interpretation of a formula φ with respect to a structure M = <D,
    I> results in the truth value T, M is called a model for φ (formal: M |= φ)

    +   - Validity

    +     - If every structure M = <D, I> is a model for φ we call φ valid (|= φ)

    +   - Satisfiability

    +     - If there exists a model M = <D, I> for φ we call φ satisfiable

    +   - Logical consequence

    +     - A formula φ is a logical consequence (or a logical entailment) of A =
    {A₁,...,Aₙ}, if each model for A is also a model for φ.

    +     - We write A |= φ

    +     - Notice: A |= φ can mean that A is a model for φ or that φ is a logical
    consequence of A

    +       - Therefore people usually use different alphabets or fonts to make this
    difference visible'
  - '[PAGE 217]


    # Examples


    ∀x∀y (R(x) ∧ R(y) → R(x) ∨ R(y)) [valid]


    +   - "If x and y are rich, either x is rich or y is rich"

    +   - "If x and y are even, either x is even or y is even"


    ∃ x (N(x) ∧ P(x,c)) [satisfiable]


    +   - There is a natural number that is smaller than 17.

    +   - There exists someone who is a student and likes logic.

    +   - Notice that there are models which make the statement false'
  - '[PAGE 218]


    # The electronic circuits domain


    # One-bit full adder


    ![](img/47b87ec6fe4fa238d13429358848c545_218_0.png)'
  - '[PAGE 219]


    # The electronic circuits domain


    +   1. Identify the task

    +      - Does the circuit actually add properly? (circuit verification)


    +   2. Assemble the relevant knowledge

    +      - Composed of wires and gates; Types of gates (AND, OR, XOR, NOT)

    +      - Irrelevant: size, shape, color, cost of gates


    +   3. Decide on a vocabulary

    +      - Alternatives:

    +        Type(X₁) = XOR

    +            Type(X₁, XOR)

    +        XOR(X₁)'
