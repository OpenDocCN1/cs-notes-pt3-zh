    \ \U0001D4A2 is then **a model of the set {A₁,...,Aₙ}**.\n\n## Set of assignments\n\
    \n- Intuition: a formula specifies a set of truth assignments.\n- Function models:\
    \ Form ↦ 2^{2^{Prop}}\n  (a formula ↦ set of satisfying assignments)\n- Recursive\
    \ definition:\n  - models(p) = {α | α(p) = 1}, p ∈ Prop\n  - models(¬φ₁) = 2^{Prop}\
    \ − models(φ₁)\n  - models(φ₁∧φ₂) = models(φ₁) ∩ models(φ₂)\n  - models(φ₁∨φ₂)\
    \ = models(φ₁) ∪ models(φ₂)\n  - models(φ₁→φ₂) = (2^{Prop} − models(φ₁)) ∪ models(φ₂)\n\
    \n## Theorem\n\nLet φ ∈ Form and α ∈ 2^{Prop}, then the following statements are\
    \ equivalent:\n\n- α ⊨ φ\n- α ∈ models(φ)\n\n## Only the projected assignment\
    \ matters...\n\n- AP(φ) – the Atomic Propositions in φ.\n- Clearly AP(φ) ⊆ Prop.\n\
