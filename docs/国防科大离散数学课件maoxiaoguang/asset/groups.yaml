    \ all non-negative integer n.\n\nProve that n² mod 8 ≡ 1 for all odd integer n.\n\
    \n## Strong induction\n\n- Weak mathematical induction assumes P(k) is true, and\
    \ uses that (and only that!) to show P(k+1) is true\n- Strong mathematical induction\
    \ assumes P(1), P(2), ..., P(k) are all true, and uses that to show that P(k+1)\
    \ is true.\n- [P(1) ∧ P(2) ∧ P(3) ∧ ... ∧ P(k) ] → P(k+1)\n\n## Strong induction\
    \ example 1\n\n- Show that any number > 1 can be written as the product of primes\n\
    - Base case: P(2)\n- 2 is the product of 2 (remember that 1 is not prime!)\n-\
    \ Inductive hypothesis: P(2), P(3), ..., P(k) are all true\n- Inductive step:\
    \ Show that P(k+1) is true\n\nInductive step: Show that P(k+1) is true\n\nThere\
    \ are two cases:\n\n- k+1 is prime\n  - It can then be written as the product\
    \ of k+1\n- k+1 is composite\n  - It can be written as the product of two composites,\
    \ a and b, where 2 ≤ a ≤ b < k+1\n  - By the inductive hypothesis, both P(a) and\
    \ P(b) are true\n  - Then P(k+1) is true\n\n## Strong Induction Examples 2\n\n\
    Prove that every amount of 8 yuans or more can be formed using just 3-yuan and\
    \ 5-yuan bills.\n\nBasis Step\n\n- 8 = 1 * 3-yuan bill + 1 * 5-yuan bill\n- 9\
    \ = 3 * 3-yuan bill\n- 10 = 2 * 5-yuan bill\n\nInductive step: Suppose P(j) is\
    \ true for 8 ≤ j ≤ k (k≥10). It is sufficient to show that P(k+1) is true.\n\n\
    - If k is formed by at least 1 5-yuan bill, then k+1 can be formed by replacing\
    \ this 5-yuan bill with 2 3-yuan bills.\n- Else, k is formed only by more than\
    \ 3 3-yuan bills, then k+1 can be formed by replacing 3 3-yuan bills with 2 5-yuan\
    \ bills.\n\n## Recursion\n\nRecursion means defining something, such as a function,\
    \ in terms of itself\n\n- For example, let f(n) = n!\n- We can define f(n) as\n\
    \  - f(1) = 1\n  - f(n) = n * f(n-1) for n > 1\n\nFind f(1), f(2), f(3), and f(4),\
    \ where f(0) = 1\n\n- Let f(n+1) = f(n) + 2\n  - f(1) = f(0) + 2 = 1 + 2 = 3\n\
    \  - f(2) = f(1) + 2 = 3 + 2 = 5\n  - f(3) = f(2) + 2 = 5 + 2 = 7\n  - f(4) =\
    \ f(3) + 2 = 7 + 2 = 9\n- Let f(n+1) = 3f(n)\n  - f(1) = 3 * f(0) = 3*1 = 3\n\
    \  - f(2) = 3 * f(1) = 3*3 = 9\n  - f(3) = 3 * f(2) = 3*9 = 27\n  - f(4) = 3 *\
    \ f(3) = 3*27 = 81\n\n## Recursion example\n\n### Fibonacci Sequence\n\n- f₀ =\
    \ 0, f₁ = 1\n- fₙ = fₙ₋₁ + fₙ₋₂ for n ≥ 2\n- f₂ = 1, f₃ = 2, f₄ = 3, f₅ = 5, f₆\
    \ = 8, ...\n\n## Homework for Chapter 4\n\n- ♈ Section 4.1\n  - 6\n  - 38\n- ♈\
    \ Section 4.2\n  - 12\n\n## 0812210\n\n## Sets and Graphs\n\n## Ch 5.2 The Pigeonhole\
    \ Principle\n\nSpring 2010\n\nMao Xiaoguang\n\n## The pigeonhole principle\n\n\
    - Suppose a flock of pigeons fly into a set of pigeonholes to roost\n- If there\
    \ are more pigeons than pigeonholes, then there must be at least 1 pigeonhole\
    \ that has more than one pigeon in it\n- If k+1 or more objects are placed into\
    \ k boxes, then there is at least one box containing two or more of the objects\n\
    \n![](img/47b87ec6fe4fa238d13429358848c545_705_0.png)\n\n![](img/47b87ec6fe4fa238d13429358848c545_705_1.png)\n\
    \n## Pigeonhole principle examples\n\n- In a group of 367 people, there must be\
    \ two people with the same birthday\n  As there are 366 possible birthdays\n-\
    \ In a group of 27 English words, at least two words must start with the same\
    \ letter\n  As there are only 26 letters\n\n## Generalized pigeonhole principle\n\
    \n♈ If N objects are placed into k boxes, then there is at least one box containing\
    \ ⌈N/k⌉ objects\n\n## Generalized pigeonhole principle\n\nAmong 100 people, there\
    \ are at least ⌈100/12⌉ = 9 born on the same month\n\nHow many students in a class\
    \ must there be to ensure that 6 students get the same grade (one of A, B, C,\
    \ D, or E)?\n\n- The \"boxes\" are the grades. Thus, k = 5\n- Thus, we set ⌈N/5⌉\
    \ = 6\n- Lowest possible value for N is 26\n\n## Example\n\nA bowl contains 10\
    \ red and 10 yellow balls\n\nHow many balls must be selected to ensure 3 balls\
    \ of the same color?\n\n- One solution: consider the \"worst\" case\n- Consider\
    \ 2 balls of each color\n- You can’t take another ball without hitting 3, Thus,\
    \ the answer is 5\n- Via generalized pigeonhole principle\n- How many balls are\
    \ required if there are 2 colors, and one color must have 3 balls?\n- How many\
    \ pigeons are required if there are 2 pigeon holes, and one must have 3 pigeons?\n\
    - number of boxes: k = 2, We want ⌈N/k⌉ = 3\n- What is the minimum N?\n- N = 5\n"
