  - '[PAGE 627]


    # Weighted Graphs


    +   - A weighted graph is a graph in which each edge (u, v) has a weight w(u,
    v). Each weight is a real number.

    +   - Weights can represent distance, cost, time, capacity, etc.

    +   - The length of a path in a weighted graph is the sum of the weights on the
    edges.

    +   - Dijkstra’s Algorithm finds the shortest path between two vertices.'
  - '[PAGE 628]


    # Shortest-Path Problem


    Given a weighted graph and two vertices u and v, we want to find a path of minimum
    total weight between u and v.


    +   - Length of a path is the sum of the weights of its edges.


    Application:


    +   - Internet packet routing

    +   - Flight reservations

    +   - Driving directions'
  - '[PAGE 629]


    # Shortest Path Properties


    +   - Property 1:

    +     - A subpath of a shortest path is itself a shortest path

    +   - Property 2:

    +     - There is a tree of shortest paths from a start vertex to all the other
    vertices'
  - '[PAGE 630]


    # Dijkstra''s Algorithm


    +   - Dijkstra’s algorithm is an iterative procedure that finds the shortest path
    between to vertices a and z in a weighted graph.

    +   - It proceeds by finding the length of the shortest path from a to successive
    vertices and adding these vertices to a distinguished set of vertices S.

    +   - The algorithm terminates once it reaches the vertex z.'
