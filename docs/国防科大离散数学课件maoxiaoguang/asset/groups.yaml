    # Truth Table Solution


    □ (p → r) ∨ (q → r) ⇔ (p ∧ q) → r ?


    | p | q | r | p→r | q→r | (p→r)∨(q→r) | p∧q | (p∧q)→r |

    |---|---|---|-----|-----|-------------|-----|----------|

    | T | T | T | T   | T   | T           | T   | T        |

    | T | T | F | F   | F   | F           | T   | F        |

    | T | F | T | T   | T   | T           | F   | T        |

    | T | F | F | F   | T   | T           | F   | T        |

    | F | T | T | T   | T   | T           | F   | T        |

    | F | T | F | T   | F   | T           | F   | T        |

    | F | F | T | T   | T   | T           | F   | T        |

    | F | F | F | T   | T   | T           | F   | T        |'
  - '[PAGE 76]


    # Logical Equivalences


    | p ∧ T ⇔ p | Identity Laws | (p ∨ q) ∨ r ⇔ p ∨ (q ∨ r) | Associative laws |

    | p ∨ T ⇔ T | Domination Law | p ∨ (q ∧ r) ⇔ (p ∨ q) ∧ (p ∨ r) | Distributive
    laws |

    | p ∧ F ⇔ F | Domination Law | p ∧ (q ∨ r) ⇔ (p ∧ q) ∨ (p ∧ r) | Distributive
    laws |

    | p ∨ p ⇔ p | Idempotent Laws | ¬(p ∧ q) ⇔ ¬p ∨ ¬q | De Morgan''s laws |

    | p ∧ p ⇔ p | Idempotent Laws | ¬(p ∨ q) ⇔ ¬p ∧ ¬q | De Morgan''s laws |

    | ¬(¬p) ⇔ p | Double Negation law | p ∨ (p ∧ q) ⇔ p | Absorption laws |

    | p ∨ q ⇔ q ∨ p | Commutative Laws | p ∨ ¬p ⇔ T | Negation laws |

    | p ∧ q ⇔ q ∧ p | Commutative Laws | p ∧ ¬p ⇔ F | Negation laws |

    | p → q ⇔ ¬p ∨ q | Definition of Implication | p ↔ q ⇔ (p → q) ∧ (q → p) | Definition
    of Biconditional |'
  - '[PAGE 77]


    # Proof using Logical Equivalence


    (p → r) ∨ (q → r)


    ⇔ (¬ p ∨ r) ∨ (¬ q ∨ r)    Definition of implication


    ⇔ ¬ p ∨ r ∨ ¬ q ∨ r    Associative


    ⇔ ¬ p ∨ ¬ q ∨ r ∨ r    Commutative


    ⇔ (¬ p ∨ ¬ q) ∨ (r ∨ r)    Associative


    ⇔ ¬ (p ∧ q) ∨ r    De Morgan, Idempotent


    ⇔ (p ∧ q) → r    Definition of implication'
  - '[PAGE 78]


    # Example


    Show that (p ∧ q) → (p ∨ q) is a Tautology.


    (Proof)


    ```

    (p ∧ q) → (p ∨ q)

    ⇔ ¬(p ∧ q) ∨ (p ∨ q) Implication

    ⇔ (¬p ∨ ¬q) ∨ (p ∨ q) De Morgan

    ⇔ (¬p ∨ p) ∨ (¬q ∨ q) Commutative, Associative

    ⇔ T ∨ T Negation

    ⇔ T Identity

    ```'
