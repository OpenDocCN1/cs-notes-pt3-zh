    # Equivalences


    +   A logical equivalence means that the two sides always have the same truth
    values

    +     - Symbol is ⇔ or ≡ (we’ll use ⇔)


    +   REMARK: The symbol ⇔ is not a logical connective since p ≡ q is not a compound
    proposition.


    # Definition


    The propositions p and q are called logically equivalent if p ↔ p is a tautology.
    We write p ⇔ q when p and q are logically equivalent.'
