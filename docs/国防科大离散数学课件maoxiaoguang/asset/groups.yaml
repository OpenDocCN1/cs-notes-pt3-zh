    \ = T iff <[[t₁]],...,[[tᵣ]]> ∈ I(R).\n- [[φ ∧ ψ]] = T iff [[φ]] = T and [[ψ]]\
    \ = T.\n- [[φ ∨ ψ]] = T iff [[φ]] = T or [[ψ]] = T.\n- [[¬φ]] = T iff [[φ]] =\
    \ F.\n- [[∀x φ(x)]] = T iff for all d ∈ D: [[φ(x)]]_{x=d} = T.\n- [[∃x φ(x)]]\
    \ = T iff there exists d ∈ D: [[φ(x)]]_{x=d} = T.\n\n## Models and satisfiability\n\
    \n### Models\n\n- Model\n  - If the interpretation of a formula φ with respect\
    \ to a structure M = <D, I> results in the truth value T, M is called a model\
