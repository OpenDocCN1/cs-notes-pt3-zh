  - '[PAGE 13]


    # Overview


    Mathematical Logic is a tool for working with elaborate compound statements. It
    includes:


    +   A formal language for expressing them.


    +   A concise notation for writing them.


    +   A methodology for objectively reasoning about their truth or falsity.


    It is the foundation for expressing formal proofs in all branches of mathematics.'
  md: "\n# 0812235\n\n# Logic and Algebra\n\n# Introduction\n\nFall 2010\n\nMao Xiaoguang\n\
    \n## Logic Puzzles\n\n- Raymond Smullyan posed many puzzles about an island that\
    \ had two kinds of inhabitants, knights, who always tell the truth, and their\
    \ opposites, knaves, who always lie.\n\n![](img/47b87ec6fe4fa238d13429358848c545_1_0.png)\n\
    \n- You encounter two people A and B. What are A and B if A says \"B is a knight\"\
    \ and B says \"The two of us are opposite types\"?\n\n## Solution\n\nLet p denote\
    \ \"A is a knight\" and q for \"B is a knight.\" We would like to find the truth\
    \ values for p and q.\n\n- Suppose p is true. Then A tells the truth. So q is\
    \ true. But then B must also tell the truth. Since p and q are both true, B cannot\
    \ tell the truth. A contradiction.\n\n- On the other hand, Suppose p is false.\
    \ Then A lies and q is false. Since q is false, B lies. Thus both p and q must\
    \ have the same truth value. This is exactly the case. We now conclude A and B\
    \ are knaves.\n\nA says “B is a knight”\nB says “The two of us are opposite types”\n\
    \n## Logic Puzzles\n\n- A father tells his two children, a boy and a girl, to\
    \ play in their backyard without getting dirty.\n- However, while playing, both\
    \ children get mud on their foreheads.\n- When the children stop playing, the\
    \ father says “At least one of you has a muddy forehead,”\n- and then asks the\
    \ children to answer “Yes” or “No” to the question: “Do you know whether you have\
    \ a muddy forehead?” The father asks this question twice.\n- What will the children\
    \ answer each time this question is asked, assuming that a child can see whether\
    \ his or her sibling has a muddy forehead, but cannot see his or her own forehead?\n\
    - Assume that both children are honest and that the children answer each question\
    \ simultaneously.\n\n## Historical view\n\n- Philosophical Logic\n  - 500 BC to\
    \ 19th Century\n- Symbolic Logic\n  - Mid to late 19th Century\n- Mathematical\
    \ Logic\n  - Late 19th to mid 20th Century\n- Logic in Computer Science\n\n##\
    \ Philosophical Logic\n\n- 500 B.C – 19th Century\n- Logic dealt with arguments\
    \ in the natural language used by humans.\n- Example\n  - All men are mortal.\n\
    \  - Socrates is a man\n  - Therefore, Socrates is mortal.\n\n## Philosophical\
    \ Logic\n\nNatural language is very ambiguous.\n\nTom hates Jim and he likes Mary.\n\
    \nIt led to many paradoxes.\n\n> “This sentence is a lie.” (The Liar’s Paradox)\n\
    \n## The Sophist’s Paradox\n\n- A sophist is sued for his tuition by the school\
    \ that educated him.\n- He argued that he must win, since, if he loses, the school\
    \ didn’t educate him well enough, and doesn’t deserve the money.\n- The school\
    \ argue that he must lose, since, if he win, he was educated well enough therefore\
    \ should pay for it.\n\n## Symbolic Logic\n\n- Mid to late 19th Century.\n- Attempted\
    \ to **formulate logic in terms of a mathematical language**\n- Rules of inference\
    \ were modeled after various laws for manipulating algebraic expressions.\n\n\
    ## Mathematical Logic\n\n- Late 19th to mid 20th Century\n- Frege proposed logic\
    \ as a language for mathematics in 1879.\n- With the rigor of this new foundation,\
    \ Cantor was able to analyze the notion of infinity in ways that were previously\
    \ impossible. (2^N is strictly larger than N)\n- Russell’s Paradox\n  T = { S\
    \ | S ∉ S }\n\n## Logic in Computer Science\n\nIn computer science, we design\
    \ and study systems through the use of formal languages that can themselves be\
    \ interpreted by a formal system.\n\n- Boolean circuits\n- Programming languages\n\
    - Design validation and verification\n- AI, Security. Etc.\n\n## Logics in Computer\
    \ Science\n\n- Propositional Logic\n- First Order Logic\n- Higher Order Logic\n\
    - Theory of Construction\n- Real-time Logic, Temporal Logic\n- Process Algebras\n\
    - Linear Logic\n\n## Overview\n\nMathematical Logic is a tool for working with\
    \ elaborate compound statements. It includes:\n\n- A formal language for expressing\
    \ them.\n- A concise notation for writing them.\n- A methodology for objectively\
    \ reasoning about their truth or falsity.\n\nIt is the foundation for expressing\
    \ formal proofs in all branches of mathematics.\n"
