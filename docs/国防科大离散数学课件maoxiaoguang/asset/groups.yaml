  - '[PAGE 1]


    # Logic Puzzles


    +   Raymond Smullyan posed many puzzles about an island that had two kinds of
    inhabitants, knights, who always tell the truth, and their opposites, knaves,
    who always lie.


    ![](img/47b87ec6fe4fa238d13429358848c545_1_0.png)


    +   You encounter two people A and B. What are A and B if A says "B is a knight"
    and B says "The two of us are opposite types"?'
  - '[PAGE 2]


    # Solution


    Let p denote "A is a knight" and q for "B is a knight." We would like to find
    the truth values for p and q.


    +   Suppose p is true. Then A tells the truth. So q is true. But then B must also
    tell the truth. Since p and q are both true, B cannot tell the truth. A contradiction.


    +   On the other hand, Suppose p is false. Then A lies and q is false. Since q
    is false, B lies. Thus both p and q must have the same truth value. This is exactly
    the case. We know conclude A and B are knaves.


    A says “B is a knight”

    B says “The two of us are opposite types”'
  - '[PAGE 3]


    # Logic Puzzles


    +   - A father tells his two children, a boy and a girl, to play in their backyard
    without getting dirty.

    +   - However, while playing, both children get mud on their foreheads.

    +   - When the children stop playing, the father says “At least one of you has
    a muddy forehead,”

    +   - and then asks the children to answer “Yes” or “No” to the question: “Do
    you know whether you have a muddy forehead?” The father asks this question twice.

    +   - What will the children answer each time this question is asked, assuming
    that a child can see whether his or her sibling has a muddy forehead, but cannot
    see his or her own forehead?

    +   - Assume that both children are honest and that the children answer each question
    simultaneously.'
