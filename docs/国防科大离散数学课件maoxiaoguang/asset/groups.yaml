  - '[PAGE 815]


    # Equivalence classes


    +   Let R be an equivalence relation on a set A. The set of all elements that
    are related to an element a of A is called the equivalence class of a.


    +   The equivalence class of a with respect to R is denoted by [a]_R = { b | b∈A
    ∧ (a, b)∈R }


    +   When only one relation is under consideration, the subscript is often deleted,
    and [a] is used to denote the equivalence class


    +   Note that these classes are disjoint!

    +     As the equivalence relation is symmetric'
  - '[PAGE 816]


    # More on equivalence classes


    +   - Consider the relation R = {(a,b) | a ≡ b (mod 2)}

    +     - Thus, all the even numbers are related to each other

    +     - As are the odd numbers


    +   - The even numbers form an equivalence class

    +     - As do the odd numbers


    +   - The equivalence class for the even numbers is denoted by [2] (or [4], or
    [784], etc.)

    +     - [2] = { ..., -4, -2, 0, 2, 4, ... }

    +     - 2 is a *representative* of it''s equivalence class


    +   - There are only 2 equivalence classes formed by this equivalence relation'
  - '[PAGE 817]


    # More on equivalence classes


    +   Consider the relation R = {(a,b) | a=b or a=-b}

    +     - Thus, every number is related to additive inverse


    +   The equivalence class for an integer a:

    +     - [7] = { 7, -7 }

    +     - [0] = { 0 }

    +     - [a] = { a, -a }


    +   There are an infinite number of equivalence classes formed by this equivalence
    relation'
  - '[PAGE 818]


    # Partitions


    +   Consider the relation R = { (a,b) | a ≡ b (mod 2)}


    +   This splits the integers into two equivalence classes: even numbers and odd
    numbers


    +   Those two sets together form a partition of the integers


    +   Formally, *a partition of a set S* is a collection of non-empty disjoint subsets
    of S whose union is S


    +   In this example, the partition is { [0], [1] }

    +   Or { {..., -3, -1, 1, 3, ...}, {..., -4, -2, 0, 2, 4, ...} }'
  - '[PAGE 819]


    # Rosen, section 8.5, question 44


    Which are partitions of the set of integers?


    +   • The set of even integers and the set of odd integers

    +   ✓ Yes, it’s a valid partition


    +   • The set of positive integers and the set of negative integers

    +   ✗ No: 0 is in neither set


    +   • The set of integers divisible by 3, the set of integers leaving a remainder
    of 1 when divided by 3, and the set of integers leaving a remainder of 2 when
    divided by 3

    +   ✓ Yes, it’s a valid partition


    +   • The set of integers less than -100, the set of integers with absolute value
    not exceeding 100, and the set of integers greater than 100

    +   ✓ Yes, it’s a valid partition


    +   • The set of integers not divisible by 3, the set of even integers, and the
    set of integers that leave a remainder of 3 when divided by 6

    +   ✗ The first two sets are not disjoint (2 is in both), so it’s not a valid
    partition'
