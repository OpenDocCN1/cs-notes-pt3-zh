    \n## 永真式的判定\n\n![](img/47b87ec6fe4fa238d13429358848c545_466_0.png)\n\n![](img/47b87ec6fe4fa238d13429358848c545_466_1.png)\n\
    \n## 判定思路\n\n谓词逻辑，其wff的永真性是半可判定的。\n本节讨论构造其半可判定程序（算法）的基础问题。\n\n- 给定A → 全称闭包∀A\n\
    - → 否定¬∀A\n- → 前束化\n- → Skolem化\n- → 范式化\n\n## 第一步、第二步\n\n1° 若公式A（x₁，…，xₙ）中仅含自由变元x₁，…，xₙ，\n\
    则A（x₁，…，xₙ）是永真式\n\niff\n\n(∀x₁)…(∀xₙ)A（x₁，…，xₙ）是永真式。\n\n仅讨论不含自由变元的公式，简称公式（句子）。\n\
    \n2° 公式A是永真式　iff　¬A是永假式。\n\n由1°和2°，有：**判A永真 → 判∀A永真 → 判¬∀A永假**\n\n## 前束范式\n\n\
    设A为公式，若\n\nA ⇔ (Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ)B，\n\n则称(Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ)B 为\
    \ A 的前束范式，并且称(Q₁ x₁)(Q₂ x₂) ... (Qₙ xₙ) 为前束词， B 为母式。\n\n其中： n≥0，\n\n- Q₁, Q₂,\
    \ …, Qₙ 是 ∀ 或 ∃，\n- x₁, x₂, …, xₙ 是不同的变元，\n- B 是不含量词的公式。\n\n- 例1：∀x∀y∃z(Q(x, y)\
    \ → R(z))\n- 例2：∀x∀y(¬P(x, y) → Q(y))\n\n任意公式都可以化为它的前束范式。\n\n## 第三步\n\n3° 公式前束化：\n\
    \n- ① 化掉 → 和 ↔ ；\n- ② 将 ¬ 内移至原子的紧前面；\n- ③ 利用等价式将 ∧、∃ 前（外）移\n\n操作过程中可能要对约束变元进行换名\n\
    \n## 公式前束化\n\n(1)把否定词深入到命题变元和谓词前面\n\n(2)利用\nA∨∀xB(x) ⇔ ∀x(A∨B(x))\nA∧∃xB(x) ⇔\
    \ ∃x(A∧B(x))\n把量词推到前面\n\n(3)利用改名规则：\n∀x A(x)∨∀xB(x)\n⇔ ∀uA(u) ∨∀xB(x))\n⇔ ∀u∀x\
    \ (A(u)∨B(x))\n把量词推到前面\n\n## 例\n\n求下列公式的前束范式\n\n- 1、 ¬((∀x)(∃y)F(a, x, y) → (∃x)(¬(∀y)G(y,\
    \ b)→H(x)))\n- 2、 (∀x)(∀y)(¬((∃z)(P(x,y,z) ∧R(y,z)))→(∃u)Q(x,y,u))\n- 3、 (∀x)P(x,\
    \ y) ∨ (∀x)Q(x, z)\n\n## 第四步\n\n4° Skolem化：（消去前束范式中存在量词的方法）\n\n在含有存在量词的前束范式A中，\n\
    \n- 1、划去最左方的存在量词∃y；\n- 2、并且当∃y的左方没有全称量词时，任取一个不在A中出现也没有在这个过程中出现过的个体常量a，并在A的母式中以a代入y的所有自由出现；\n\
    - 3、当∃y的左方依次有全称量词∀x₁，∀x₂，…，∀xₙ出现时，任取一个不在A中出现并且在这个过程中没有出现过的n元函数f，并在A的母式中以f(x₁，x₂，…，xₙ)代入y的所有自由出现。\n"
