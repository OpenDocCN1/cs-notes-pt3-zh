    > “This sentence is a lie.” (The Liar’s Paradox)'
  - '[PAGE 8]


    # The Sophist’s Paradox


    +   - A sophist is sued for his tuition by the school that educated him.

    +   - He argued that he must win, since, if he loses, the school didn’t educated
    him well enough, and doesn’t deserve the money.

    +   - The school argue that he must loss, since, if he win, he was educated well
    enough therefore should pay for it.'
  - '[PAGE 9]


    # Symbolic Logic


    +   - Mid to late 19th Century.

    +   - Attempted to **formulate logic in terms of a mathematical language**

    +   - Rules of inference were modeled after various laws for manipulating algebraic
    expressions.'
  - '[PAGE 10]


    # Mathematical Logic


    +   - Late 19th to mid 20th Century

    +   - Frege proposed logic as a language for mathematics in 1879.

    +   - With the rigor of this new foundation, Cantor was able to analyze the notion
    of infinity in ways that were previously impossible. (2^N is strictly larger than
    N)

    +   - Russell’s Paradox

    +     T = { S | S ∉ S }'
  - '[PAGE 11]


