  md: "\n## Proofs of functional completeness\n\n- Transition to the system {¬, ∧}\
    \ or {¬, ∨}:\n  - A ∧ B ⇔ ¬(¬A ∨ ¬B),\n  - A ∨ B ⇔ ¬(¬A ∧ ¬B)\n- The system {¬,\
    \ ∧, ∨} is sufficient according to the above statement.\n- Transition to the system\
    \ {¬, →}:\n  - A ∨ B ⇔ ¬A → B,\n  - A ∧ B ⇔ ¬(A → ¬B)\n- Transition to the system\
    \ {↑} or {↓}:\n  - ¬A ⇔ A ↑ A, A ∧ B ⇔ (A ↑ B) ↑ (A ↑ B) (↑ is NAND),\n  - ¬A\
    \ ⇔ A ↓ A, A ∨ B ⇔ (A ↓ B) ↓ (A ↓ B) (↓ is NOR).\n\n## Existence of normal forms\n\
    \nFindings:\n\n### CNF\n\n- (p ∨ ¬q) ∧ (q ∨ ¬r) is F **iff**\n- at least one elementary\
    \ disjunction is F **iff**\n- all literals in that elementary disjunction are\
    \ F\n\n### DNF\n\n- (p ∧ ¬q) ∨ (q ∧ ¬r) is T **iff**\n- at least one elementary\
    \ conjunction is T **iff**\n- all literals in that elementary conjunction are\
    \ T\n\n## A simple example\n\n**Wff:** ¬(p → q)\n\n**CNF:** (¬p ∨ ¬q) ∧ (p ∨ ¬q)\
    \ ∧ (p ∨ q)\n\n**DNF:** (p ∧ ¬q)\n\nIf we construct a CCNF (CDNF) from a truth\
    \ table, we take into account only those rows where the function has the value\
    \ F (T), and construct CED (CEC) in such a way that the CED (CEC) is false (true).\n\
    \n| p | q | ¬(p → q) | CNF | DNF |\n| --- | --- | --- | --- | --- |\n| T | T |\
    \ F | ¬p ∨ ¬q |  |\n| T | F | T |  | p ∧ ¬q |\n| F | T | F | p ∨ ¬q |  |\n| F\
    \ | F | F | p ∨ q |  |\n\n## Further example\n\nFind CCNF and CDNF for the formula\
    \ A?\n\n| p | q | r | A |\n| --- | --- | --- | --- |\n| F | F | F | T |\n| F |\
    \ F | T | F |\n| F | T | F | T |\n| F | T | T | T |\n| T | F | F | F |\n| T |\
    \ F | T | T |\n| T | T | F | F |\n| T | T | T | F |\n\n## Existence of normal\
    \ forms\n\n- Each formula which is not a contradiction has a CDNF (complete disjunctive\
    \ normal form).\n  - A contradiction does not have a CDNF.\n- Each formula which\
    \ is not a tautology has a CCNF (complete conjunctive normal form).\n  - A tautology\
    \ does not have a CCNF.\n\n## Example\n\nAssume: ¬(P → Q) ∨ (R → P)\n\n- **Eliminate\
    \ ↔, →**: ¬(¬P ∨ Q) ∨ (¬R ∨ P)\n- **Reduce the scope of ¬ through de Morgan's\
    \ laws and double negation**: (P ∧ ¬Q) ∨ (¬R ∨ P)\n- **Convert to CNF using the\
    \ distributive laws and laws for flatten**: (P ∨ ¬R) ∧ (¬Q ∨ ¬R ∨ P)\n\n## Conversion\
    \ to DNF with ⇔\n\n1. Eliminate ⇔, replacing α ⇔ β with (α → β) ∧ (β → α).\n2.\
    \ Eliminate →, replacing α → β with ¬α ∨ β.\n3. Move ¬ inwards using de Morgan's\
    \ rules and double-negation.\n   - ¬(α ∨ β) ⇔ ¬α ∧ ¬β\n   - ¬(α ∧ β) ⇔ ¬α ∨ ¬β\n\
    \   - ¬¬α ⇔ α\n4. Apply distributive law (∧ over ∨) and flatten.\n   - α ∧ (β\
    \ ∨ γ) ⇔ (α ∧ β) ∨ (α ∧ γ)\n\n## Decision approaches\n\n- Satisfiability (SAT)\
    \ problem: Determine whether a sentence in normal forms (CNF or DNF) is satisfiable\
    \ (i.e. can evaluate to true).\n\nNot limited to:\n\n- Complete normal forms:\
    \ CCNF, CDNF\n\n  (P ∨ ¬R ∨ Q) ∧ (P ∨ ¬R ∨ ¬Q) ∧ (¬Q ∨ ¬R ∨ P)?\n\n- With the\
    \ resolution rule\n\n## Conversion to CNF with ⇔\n\n1. Eliminate ⇔, replacing\
    \ α ⇔ β with (α → β) ∧ (β → α).\n2. Eliminate →, replacing α → β with ¬α ∨ β.\n\
    3. Move ¬ inwards using de Morgan's rules and double-negation.\n   - ¬(α ∨ β)\
    \ ⇔ ¬α ∧ ¬β\n   - ¬(α ∧ β) ⇔ ¬α ∨ ¬β\n   - ¬¬α ⇔ α\n4. Apply distributive law\
    \ (∨ over ∧) and flatten.\n   - α ∨ (β ∧ γ) ⇔ (α ∨ β) ∧ (α ∨ γ)\n5. Supplementing\
    \ missing literals.\n   - α ⇔ (α ∨ ¬γ) ∧ (α ∨ γ)\n\n## Example\n\nAssume: ¬(P\
    \ → Q) ∨ (R → P)\n\n- **Eliminate ↔, →**: ¬(¬P ∨ Q) ∨ (¬R ∨ P)\n- **Reduce the\
    \ scope of ¬ through de Morgan's laws and double negation**: (P ∧ ¬Q) ∨ (¬R ∨\
    \ P)\n- **Convert to CNF using the distributive laws and laws for flatten**: (P\
