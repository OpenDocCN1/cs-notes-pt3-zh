    \ set and those made by adjoining something to a set:\n      ∀s set(s) <=> (s=EmptySet)\
    \ ∨ (∃x,r Set(r) ∧ s=Adjoin(s,r))\n+   2. The empty set has no elements adjoined\
    \ to it:\n      ~ ∃x,s Adjoin(x,s)=EmptySet\n+   3. Adjoining an element already\
    \ in the set has no effect:\n      ∀x,s Member(x,s) <=> s=Adjoin(x,s)\n+   4.\
    \ The only members of a set are the elements that were adjoined into it:\n   \
    \   ∀x,s Member(x,s) <=> ∃y,r (s=Adjoin(y,r) ∧ (x=y ∨ Member(x,r)))\n+   5. A\
    \ set is a subset of another iff all of the 1st set’s members are members of the\
    \ 2nd:\n      ∀s,r Subset(s,r) <=> (∀x Member(x,s) => Member(x,r))\n+   6. Two\
    \ sets are equal iff each is a subset of the other:\n      ∀s,r (s=r) <=> (subset(s,r)\
    \ ∧ subset(r,s))\n+   7. Intersection\n      ∀x,s1,s2 member(X,intersection(S1,S2))\
    \ <=> member(X,s1) ∧ member(X,s2)\n+   8. Union\n      ∃x,s1,s2 member(X,union(s1,s2))\
    \ <=> member(X,s1) ∨ member(X,s2)\n\n## Monty Python example (Russell & Norvig)\n\
    \nFIRST VILLAGER: We have found a witch. May we burn her?\nALL: A witch! Burn\
    \ her!\nBEDEVERE: Why do you think she is a witch?\nSECOND VILLAGER: She turned\
    \ me into a newt.\nB: A newt?\nV2 (after looking at himself for some time): I\
    \ got better.\nALL: Burn her anyway.\nB: Quiet! Quiet! There are ways of telling\
    \ whether she is a witch.\n\n![](img/47b87ec6fe4fa238d13429358848c545_199_0.png)\n\
    \nB: Tell me... what do you do with witches?\nALL: Burn them!\nB: And what do\
    \ you burn, apart from witches?\nV4: ...wood?\nB: So why do witches burn?\nV2\
    \ (pianissimo): because they’re made of wood?\nB: Good.\nALL: I see. Yes, of course.\n"
