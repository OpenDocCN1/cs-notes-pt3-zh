  - '[PAGE 565]


    # Special Graphs – Bipartite Graphs


    A simple graph G is called bipartite if its vertex set V can be partitioned into
    two disjoint sets V₁ and V₂ such that every edge in the graph connects a vertex
    in V₁ and a vertex in V₂ (so that no edge in G connects either two vertices in
    V₁ or two vertices in V₂).


    ![](img/47b87ec6fe4fa238d13429358848c545_565_0.png)'
  - '[PAGE 566]


    # Examples


    # Example I: Is C₃ bipartite?


    ![](img/47b87ec6fe4fa238d13429358848c545_566_0.png)


    No, because there is no way to partition the vertices into two sets so that there
    are no edges with both endpoints in the same set.


    # Example II : Is C₆ bipartite?


    ![](img/47b87ec6fe4fa238d13429358848c545_566_1.png)


