    b), h(b, a, c), h(b, b, a), h(b, b, b), h(b, b, c), h(b, c, a), h(b, c, b), h(b,
    c, c), h(c, a, a), h(c, a, b), h(c, a, c), h(c, b, a), h(c, b, b), h(c, b, c),
    h(c, c, a), h(c, c, b), h(c, c, c)}


    H₂ = H₁ ∪ {f(x)|x∈ H₁} ∪ {g(x, y)|x, y∈ H₁} ∪ {h(x, y, z)|x, y,z ∈ H₁}


    ……


    ## 例


    求无∃前束范式A=(∀x)(F(a)∧F(b)∧F(f(x)))的Herbrand域。


    解：


    - H₀ = {a, b}

    - H₁ = {a, b, f(a), f(b)}

    - H₂ = {a, b, f(a), f(b), f(f(a)), f(f(b))} 等等。


    ## Herbrand解释


    任给无∃前束范式A，若A的解释I满足以下条件：


    - i) I的论域是A的Herbrand域H；

    - ii) 对于A中的每个个体常元a，指定H中的元素a；

    - iii) 对于A中的每个n元函词f，指定H上的n元函数f_I，使得对于任意t₁, t₂, …, tₙ ∈ H皆有


    f_I(t₁, t₂, …, tₙ) = f(t₁, t₂, …, tₙ);


    则称I为A的Herbrand解释。


    - * 对于谓词Herbrand解释不作限制；因此，一般说来，无∃前束范式A的Herbrand解释不唯一。


    ## 定理5.4.2


    无∃前束范式A是永假式


    当且仅当


    A在任何Herbrand解释下均为假


    ## Herbrand定理


    无前缀范式(∀x₁)(∀x₂)...(∀xₙ)B(x₁, x₂, ..., xₙ)是永假式，


    当且仅当


    存在它的Herbrand域中的元素


    t₁₁, t₁₂, ..., t₁ₙ, t₂₁, t₂₂, ..., t₂ₙ, ..., tₘ₁, tₘ₂, ..., tₘₙ 使


    B(t₁₁, t₁₂, ..., t₁ₙ)∧B(t₂₁, t₂₂, ..., t₂ₙ)∧...∧B(tₘ₁, tₘ₂, ..., tₘₙ)


    为永假式。


    * B(t₁₁, t₁₂, ..., t₁ₙ) 称为 B(x₁, x₂, ..., xₙ) 的例式。


    ## 判定问题


    设A = (∀x₁)(∀x₂)...(∀xₙ)B(x₁, x₂, ..., xₙ)


    A是永假式当且仅当存在B(x₁, x₂, ..., xₙ)的有限个例式B₁, ..., Bₘ使得B₁ ∧ ... ∧ Bₘ为永假式。


    半可判定：


    若A是永假式，则从H₀开始总能找到Hᵢ使得Hᵢ中元素生成的B(x₁, x₂, ..., xₙ)的例式的合取是永假式；


    若A不是永假式，这个过程永远不会终止。


    ## 例


    证明：

    (∀ x)(∀ y)(P(x, y) → P(y, x)) ∧

    (∀ x)(∀ y)(∀ z)(P(x, y) ∧ P(y, z) → P(x, z)) ∧

    (∀ x)(∃ y)P(x, y)

    →

    (∀ x)P(x, x)

    是永真式


    ¬

    (∀ x)(∀ y)(¬ P(x, y) ∨ P(y, x)) ∧

    (∀ x)(∀ y)(∀ z)(¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z)) ∧

    (∀ x)(∃ y) P(x, y) ∧

    (∃ x)(¬ P(x, x))


    （¬内移）


    (∀ x)(∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧

    (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z))) ∧

    (∀ x)(∃ y) P(x, y) ∧ (∃ x)(¬ P(x, x))


    （∀前移）


    (∀ x)(∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧

    (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z))) ∧

    (∀ x)(∃ u) P(x, u) ∧ (∃ v)(¬ P(v, v))


    （换名）


    (∃ v)((∀ x)(∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧

    (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z)))

    ∧

    (∀ x)(∃ u) P(x, u) ∧ ¬ P(v, v))


    （∃前移）


    (∃ v)(∀ x)((∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧ (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z)))
    ∧ (∃ u) P(x, u) ∧ ¬ P(v, v))


    (∀前移)

    (∃ v)(∀ x)(∃ u)((∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧ (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x,
    z))) ∧ P(x, u) ∧ ¬ P(v, v))


    (∃前移)

    (∃ v)(∀ x)(∃ u)(∀ y)(∀ z)

    ((¬ P(x, y) ∨ P(y, x)) ∧ (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z)) ∧ P(x, u) ∧ ¬ P(v,
    v))


    (∀前移)


    令f为一元函数，则原公式的无∃前束范式为：

    (∀ x)(∀ y)(∀ z)((¬ P(x, y) ∨ P(y, x)) ∧

    (¬ P(x, y) ∨ ¬ P(y, z) ∨ P(x, z))

    P(x, f(x)) ∧

    ¬ P(a, a)

    )


    所以，H = {a, f(a), f(f(a)), ...}

    若将¬ X的无∃前束范式看成(∀ x)(∀ y)(∀ z) B(x, y, z)，

    B(a, f(a), a) 为

    (¬ P(a, f(a)) ∨ P(f(a), a)) ∧

    (¬ P(a, f(a)) ∨ ¬ P(f(a), a) ∨ P(a, a)) ∧

    P(a, f(a)) ∧ ¬ P(a, a)


    F


    则B(a, f(a), a)为永假式。

    根据Herbrand定理可知上述原公式的无∃前束范式为永假式，

    即¬ X为永假式。所以，X为永真式。

