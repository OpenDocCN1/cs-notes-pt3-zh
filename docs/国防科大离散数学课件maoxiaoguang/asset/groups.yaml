  - '[PAGE 224]


    # Resolution for propositional logic


    +   Ground (propositional) resolution is a single sound inference rule that is
    applied to clauses.


    +   A clause is a disjunction of literals.


    +   Example, (p ∨ ¬q ∨ r) is a clause.


    +   Resolution: (A ∨ p), (B ∨ ¬p)

    +   (A ∨ B)


    +   Example, (¬p ∨ q), (¬q ∨ r)

    +   (¬p ∨ r)'
  - '[PAGE 225]


    # Clausal form


    +   - In order to use resolution for first order logic the formulas must be converted
    into clausal form.

    +   - A clause is a disjunction of literals with no literal appearing twice, no
    existential quantifiers and all universal quantifiers are at the left.

    +   - Ex,      ∀x∀y∀z( P(x,y) ∨ ¬Q(y) ∨ R(z,y) )

    +   - The empty clause, denoted by ⊥ , is unsatisfiable.

    +   - A unit clause contains just one literal.

    +   - The universal quantifiers may be omitted.'
  - '[PAGE 226]


    # Skolemization


    +   - Process for removing existential quantifiers.

    +   - Delete each existential quantifier, then replace the resulting free variables
    by terms referred to as Skolem functions.

    +   - ∃x∀y P(x,y) becomes ∀y P(c, y)

    +   - ∀x∃y P(x,y) becomes ∀x P(x, f(x))

    +   - Skolemization preserves satisfiability.'
  - '[PAGE 227]


    # Conversion to clausal form


    +   - Eliminate ⇒ and ⇔

    +   - Move ¬ inwards

    +   - Rename variables if two quantifiers have the same bound variable name.

    +   - Eliminate existential quantifiers using Skolem functions.

    +   - Move all universal quantifiers to the left (prenex normal form).

    +   - Transform the matrix into conjunctive normal form.'
  - '[PAGE 228]


