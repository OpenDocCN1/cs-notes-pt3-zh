  md: "\n## 作业\n\n### 习题5.1\n\n- 1. d) e)\n- 2. a) b)\n- 3. b) c) d)\n- 4. a) d) e)\n\
    \n![](img/47b87ec6fe4fa238d13429358848c545_402_0.png)\n\n## 语法构成\n\n![](img/47b87ec6fe4fa238d13429358848c545_403_0.png)\n\
    \n### 语法构成：项、原子、合式公式\n\n### 项\n\n项为按以下规则构成的有穷符号串：\n\n- i) 每个个体常元是一个项；\n- ii) 每个个体变元是一个项；\n\
    - iii) 如果 f 是一个 n 元（n≥1）函词且 t₁, …, tₙ 都是项，则 f(t₁, …, tₙ) 也是一个项。\n\n### 原子\n\n\
    原子（atf）为按以下规则构成的有穷符号串：\n\n- i) 每个命题词是一个原子；\n- ii) 若 P 为 n 元（n≥1）谓词且 t₁, …, tₙ\
    \ 都是项，则 P(t₁, …, tₙ) 是一个原子。\n\n### 合式公式\n\n合式公式（wff），是按以下规则构成的有穷符号串：\n\n- i) 每个原子是一个\
    \ wff；\n- ii) 如果 A 是 wff，则 (¬A) 是 wff；\n- iii) 如果 A 和 B 都是 wff，则 (A∨B)、(A∧B)、(A→B)\
    \ 和 (A↔B) 都是 wff；\n- iv) 如果 A 是 wff，x 为个体变元，则 (∀x)A 和 (∃x)A 都是 wff；\n- v) 只有有限次应用步骤\
    \ i)、ii)、iii) 和 iv) 构成的公式才是合式公式。\n\n子合式公式：构造过程中的 wff。\n\n### 例\n\n- P(f(x), y)\n\
    - f(x, y, z)\n- (P(x)→Q(y, a))\n- ¬(∀x)P(x, y)\n- ((∀x)P(y)→(¬Q(y)))\n- (∀x)P(a,\
    \ b, f(c))\n\n### 括号省略规则\n\n与命题逻辑类似\n\n例：\n\n```\n(P(a) ∧ (∀x)((¬E(x,a))∧P(f(a)))→(∃x)P(x))\n\
    ```\n\n### 几个基本概念\n\n- 辖域\n- 约束出现和自由出现\n- 约束变元和自由变元\n- 约束变元换名\n\n![](img/47b87ec6fe4fa238d13429358848c545_410_0.png)\n\
    \n### 辖域\n\n量词的辖域：紧接其后的公式。\n\n(∀x)A : 称 A 为 (∀x) 的辖域；\n\n(∃x)A : 称 A 为 (∃x) 的辖域。\n\
    \n### 例\n\n- (∀x)P(x)→Q(x)\n  - (∀x) 的辖域是 P(x)\n- (∃x)(P(x, y)→Q(x, y)) ∨ P(y,\
    \ z)\n  - (∃x) 的辖域是 P(x, y)→Q(x, y)\n\n### 约束出现、自由出现\n\n变元 x 在公式 A 中的某次出现为：\n\n\
    - 约束出现：在 A 的子公式 (∀x)B 或 (∃x)B 中的出现；\n- 自由出现：否则。\n\n### 例子\n\n(∀x)(P(x)→(∃y)R(x,\
    \ y))\n\n约束出现\n\n(∃x)P(x) ∧ Q(x)\n\n约束出现\n\n自由出现\n\n### 例\n\n指出下列谓词公式中的自由变元和约束变元。并指明量词的辖域：\n\
    \n- 1、(∀x)(P(x) ∧ R(x))→(∀x)P(x) ∧ Q(x)\n- 2、(∀x)P(y)\n- 3、(∀x)(∃y)(P(x, y) →\
    \ Q(y))\n\n- 在一个公式中，**一个变元既可以约束出现，又可以自由出现**。为避免混淆可用改名规则对**约束变元**改名。（上例1）\n\n###\
    \ 约束变元换名\n\n设 (∀x)B 为合式公式 A 的子公式，（B 为 (∀x) 的辖域）。如果 y 在 B 中不出现，则可以将 (∀x) 换成 (∀y)，同时将\
    \ B 中所有自由出现的 x 换成 y。\n\n（不改变公式的语义）\n\n### 例\n\n(∀x)(P(x) ∧(∃x)Q(x))∨((∀x)P(x)\
    \ →Q(x))\n\n(∀y)(P(y) ∧(∃x)Q(x))∨((∀x)P(x) →Q(x))\n\n(∀y)(P(y) ∧(∃z)Q(z))∨((∀x)P(x)\
    \ →Q(x))\n\n![](img/47b87ec6fe4fa238d13429358848c545_419_0.png)\n\n### 换名原则\n\n\
    - 若要改名，则该变元在量词及该量词的辖域中的所有自由出现须**一起**更改。\n- 改名时所选用变元必须是**量词辖域内未出现**的，最好是公式中未出现的。\n\
    \n### 例\n\n- (∀x)(P(x, y)→(∃y)R(x, y))\n- (∃x)P(x) ∧ Q(x)\n- (∀x)(A(x)∨B(x, y))∨C(x)∨D(w)\n\
    \  - (∀z)(A(z)∨B(z, y)) ∨ C(x) ∨ D(w)\n  - (∀y)(A(y)∨B(y, y)) ∨C(x) ∨ D(w)\n\n\
    ## 语义解释\n\n![](img/47b87ec6fe4fa238d13429358848c545_422_0.png)\n\n![](img/47b87ec6fe4fa238d13429358848c545_422_1.png)\n\
    \n### 解释\n\n对合式公式 $G$ 的解释包括以下几点：\n\n- i) 指定一个非空集合 $D$，称为 $I$ 的论域，并称 $I$ 为 $D$\
    \ 上的解释；\n- ii) 对 $G$ 中出现的每个个体常元和自由变元，指定 $D$ 中的一个元素；\n- iii) 对 $G$ 中出现的每个 $n$ 元函词，指定一个\
    \ $D$ 上的 $n$ 元函数；\n- iv) 对 $G$ 中出现的每个命题词，指定一个真值 $T$ 或 $F$；\n- v) 对 $G$ 中出现的每个\
    \ $n$ 元谓词，指定一个从 $D^n$ 到 $\\{T,F\\}$ 的函数；\n\n$G_I$ 的真值为合式公式 $G$ 在 $I$ 下的真值。\n\n\
    ### 语法、语义对应关系\n\n| 语法 | 语义 |\n| --- | --- |\n| 个体常元 | D中的元素 |\n| 自由个体变元 | D中的元素\
    \ |\n| n元函词 | D上的n元函数 |\n| 命题词 | T 或 F |\n| n元谓词 | Dⁿ到{T, F}的函数 |\n\n- 逻辑联结词的对应关系未明确列出\n\
    \n### 例\n\n对合式公式 P(h(a, x))，取解释 I 如下：\n\n- D = {1, 2}\n- 令 x=2，a=1：\n\n| x | a\
    \ | h(1, 1) | h(1, 2) | h(2, 1) | h(2, 2) |\n|---|---|---|---|---|---|\n| 2 |\
    \ 1 | 1 | 2 | 2 | 1 |\n\n- 定义 D 上的谓词 P 如下：\n\n| P(1) | P(2) |\n|---|---|\n| F\
    \ | T |\n\n### 项的语义\n\n- 项：论域上的个体\n  - 个体常元 c： I(c) ∈ D\n  - 个体变元 x： I(x) ∈ D\n\
    \  - 项 f(t₁, ..., tₙ)： f_I(I(t₁),...,I(tₙ)) ∈ D\n\n### 原子的语义\n\n- **原子**：\\(\\\
    {T, F\\}\\)\n  - **命题词** \\(p\\)：\\(I(p) \\in \\{T, F\\}\\)\n  - **原子** \\(P(t_1,\
    \ \\ldots, t_n)\\)：\\(P_I(I(t_1), \\ldots, I(t_n)) \\in \\{T, F\\}\\)\n\n### G_I\
    \ 的真值\n\n关于 G_I 的真值定义见 P101 定义5.2.5，其中\n\n((∀x)A)_I 的真值为 T iff 对每个 d∈D，A_d^x 的真值皆为\
    \ T；\n\n((∃x)A)_I 的真值为 T iff 有 d∈D，使 A_d^x 的真值为 T。\n\n（A_d^x 表示用 d 替换 A 中 x 的每个自由出现后所得之结果）\n\
    \n### 要求\n\n- ① 计算一个合式公式的给定解释下的真值；\n- ② 给出使一个合式公式为真（假）的解释。\n\n### 计算合式公式在给定解释下的真值\n\
    \n例：对合式公式 (∀x)(∃y)P(x, y)，取解释 I 如下：\n\n- D = {1, 2}\n- 定义 D 上的二元谓词 P 为\n\n| P(1,\
    \ 1) | P(1, 2) | P(2, 1) | P(2, 2) |\n|---|---|---|---|\n| T | F | F | T |\n\n\
    (∀x)(∃y)P(x, y)\n\n- P(1, 1)、P(2, 2) 的真值为 T\n- (∃y)P(1, y)、(∃y)P(2, y) 的真值为 T\n\
    - (∀x)(∃y)P(x, y) 的真值为 T\n- (∀x)(∃y)P(x, y) 在解释 I 下的真值为 T\n\n![](img/47b87ec6fe4fa238d13429358848c545_431_0.png)\n"
