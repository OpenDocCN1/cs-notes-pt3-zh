    \ numbers\n\nℤ = {..., -2, -1, 0, 1, 2, ...} is the set of integers\n\nℤ⁺ = {1,\
    \ 2, 3, ...} is the set of positive integers (a.k.a whole numbers)\n\n- Note that\
    \ people disagree on the exact definitions of whole numbers and natural numbers\n\
    \nℚ = {p/q | p ∈ ℤ, q ∈ ℤ, q ≠ 0} is the set of rational numbers\n\n- Any number\
    \ that can be expressed as a fraction of two integers (where the bottom one is\
    \ not zero)\n\nℝ is the set of real numbers\n\n## The universal set U\n\nU is\
    \ the universal set – the set of all of elements (or the \"universe\") from which\
    \ given any set is drawn\n\n- For the set {-2, 0.4, 2}, U would be the real numbers\
    \ R\n- For the set {0, 1, 2}, U could be the N, Z, Q, R depending on the context\n\
    - For the set of the vowels of the alphabet, U would be all letters of the alphabet\n\
    \n## Venn diagrams\n\n- Represents sets graphically\n  - The box represents the\
    \ universal set\n  - Circles represent the set(s)\n- Consider set S, which is\
    \ the set of all vowels in the alphabet\n- Individual elements are usually not\
    \ written in a Venn diagram\n\n![](img/47b87ec6fe4fa238d13429358848c545_857_0.png)\n\
    \n## Sets of sets\n\nSets can contain other sets\n\n- S = { {1}, {2}, {3} }\n\
    - T = { {1}, {{2}}, {{{3}}} }\n- V = { {{1}, {{2}}}, {{{3}}}, { {1}, {{2}}, {{{3}}}\
    \ } }\n\nV has only 3 elements!\n\nNote that 1 ≠ {1} ≠ {{1}} ≠ {{{1}}}\n\n- They\
    \ are all different\n\n## The Empty Set\n\nIf a set has zero elements, it is called\
    \ the empty (or null) set\n\n- Written using the symbol ∅\n- Thus, ∅ = { } ← VERY\
    \ IMPORTANT\n\nIt can be an element of other sets\n\n- { ∅, 1, 2, 3, x } is a\
    \ valid set\n\n∅ ≠ { ∅ }\n\n- ∅ : a set of zero elements. Think of this as an\
    \ empty folder\n- {∅}: a set with one element. The element is an empty set. Think\
    \ of this as an folder with an empty folder in it.\n\nReplace ∅ by { }, and you\
    \ get: { } ≠ { { } }\n\n- It’s easier to see that they are not equal that way\n\
    \n## Recap\n\nA set is an unordered collection of “objects”\n\nSpecifying a set:\n\
    \n- enumeration\n- incomplete enumeration (...)\n- set-builder (predicate)\n-\
    \ Venn diagram\n\na ∈ S, a ∉ S\n\nN, Z, Z+, Q, R\n\nU: Universal set, ∅ = { }\n\
    \n! Sets of sets, ∅ ≠ { ∅ }\n\n## Set Equality, Subsets\n\nTwo sets are equal\
    \ if they have same elements\n\n- {1, 2, 3, 4, 5} = {5, 4, 3, 2, 1}\n- {1, 2,\
    \ 3, 2, 4, 3, 2, 1} = {4, 3, 2, 1}\n- Two sets are not equal if they do not have\
    \ same elements\n  - {1, 2, 3, 4, 5} ≠ {1, 2, 3, 4}\n\n```\nS = T ↔ ∀x (x ∈ S\
    \ ↔ x ∈ T)\n```\n\nIf all elements of a set S are also elements of a set T, then\
    \ S is a subset of T\n\n- If S = {2, 4, 6}, T = {1, 2, 3, 4, 5, 6, 7}, S is a\
    \ subset of T\n- This is specified by S ⊆ T meaning that ∀ x (x ∈ S → x ∈ T)\n\
    \n```\nS ⊆ T ↔ ∀x (x ∈ S → x ∈ T)\n```\n\n## Subsets ⊆\n\nS ⊆ T ⇔ ∀x(x ∈ S → x\
    \ ∈ T)\n\nS ⊈ T ⇔ ∃x(x ∈ S ∧ x ∉ T)\n\nFor any set S, S ⊆ S (∀S S ⊆ S)\n\nFor\
    \ any set S, ∅ ⊆ S (∀S ∅ ⊆ S)\n\nExamples:\n\n⊆ R\n\n{3} ⊆ {5,7,3}\n\n⊈ N\n\n\
    ## Proper Subsets \\(\\subset\\)\n\nIf S is a subset of T, and S is not equal\
    \ to T, then S is a proper subset of T\n\n- Let T = {0, 1, 2, 3, 4, 5}\n- If S\
    \ = {1, 2, 3}, S is not equal to T, and S is a subset of T\n- A proper subset\
    \ is written as S ⊂ T\n- Let Q = {4, 5, 6}. Q is neither a subset of T nor a proper\
    \ subset of T\n\nThe difference between “subset” and “proper subset” is like the\
    \ difference between “less than or equal to” and “less than” for numbers\n"
