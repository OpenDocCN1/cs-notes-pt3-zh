- pgno: 799
  md: '# How long are the paths in a transitive closure?


    +   Let R be a relation on set A, and let A be a set with n elements

    +     Rephrased: consider a graph G with n nodes and some number of edges


    +   Lemma 1: If there is a path (of length at least 1) from a to b in R, then
    there is a path between a and b of length not exceeding n


    +   Proof preparation:

    +     Suppose there is a path from a to b in R

    +     Let the length of that path be m

    +     Let the path be edges (x₀, x₁), (x₁, x₂), …, (xₘ₋₁, xₘ)

    +     That’s nodes x₀, x₁, x₂, …, xₘ₋₁, xₘ

    +     If a node exists twice in our path, then it’s not a shortest path

    +       As we made no progress in our path between the two occurrences of the
    repeated node

    +     Thus, each node may exist at most once in the path'
  merge: -1
  img_proc: true
- pgno: 800
  md: '# How long are the paths in a transitive closure?


    Proof by contradiction:


    +   - Assume there are more than *n* nodes in the path

    +     - Thus, *m* > *n*

    +     - Let *m* = *n*+1

    +   - By the pigeonhole principle, there are *n*+1 nodes in the path (pigeons)
    and they have to fit into the *n* nodes in the graph (pigeonholes)

    +   - Thus, there must be at least one pigeonhole that has at least two pigeons

    +   - Rephrased: there must be at least one node in the graph that has two occurrences
    in the nodes of the path

    +     - Not possible, as the path would not be the shortest path

    +   - Thus, it cannot be the case that *m* > *n*


    If there exists a path from *a* to *b*, then there is a path from *a* to *b* of
    at most length *n*'
  merge: -1
  img_proc: true
