- pgno: 252
  md: '# 命 题


    +   - 或真或假而不能二者都是

    +   - 可能要根据上下文确定真值


    命题：称具有确定真假意义的陈述句为命题。


    命题词：表示命题的形式符号。大写拉丁字母，如P。既可表示真命题，又可表示假命题，故称命题变元


    T，F：命题常元（相对于命题变元）


    命题的真值： T（1）或F（0）


    T、F两种含义

    {

    命题的真值

    命题常量

    }'
  merge: -1
