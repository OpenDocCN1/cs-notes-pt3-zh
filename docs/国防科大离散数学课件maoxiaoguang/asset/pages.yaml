- pgno: 166
  md: '# Introduction


    +   - Remember that the statement “x+1 = 3” is NOT a proposition. Why?

    +     - Can we produce a proposition from it?


    +   - The statement “x plus 1 equals 3” has two parts, namely, the *variable*
    x which is the subject of the statement, and the *property* “plus one equals 3”
    which is the *predicate*.


    +   - Grammatically, a predicate is the part of the sentence that says something
    about the subject.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Propositional function


    +   - If P denotes the predicate "plus 1 equals 3", then the proposition "x plus
    1 equals 3" can be denoted by P(x).

    +   - P(x) is called a propositional function with variable x.

    +   - Once a value is assigned to x, then P(x) becomes a proposition - it has
    a truth value.

    +     - What is the truth value of P(1), P(2), etc?'
  merge: -1
