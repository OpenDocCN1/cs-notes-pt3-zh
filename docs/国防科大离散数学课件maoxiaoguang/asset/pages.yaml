  md: '# Precedence of operators


    +   Just as in algebra, operators have precedence

    +     ▸ 4+3*2 = 4+(3*2), not (4+3)*2


    +   Precedence order (from highest to lowest):

    +     ¬ ∧ ∨ → ↔

