- pgno: 60
  md: '# Tautology, Contradiction, Contingency


    +   - Tautology: a statement that’s always true

    +     - p ∨ ¬ p will always be true


    +   - Contradiction: a statement that’s always false

    +     - p ∧ ¬ p will always be false


    +   - Let p be a proposition. Then p ∨ ¬p is a tautology. p ∧ ¬p is a contradiction.
    p and ¬p are contingencies.


    # Definition


    A compound proposition that is always true is called a tautology (valid). A compound
    proposition that is always false is called a contradiction (unsatisfiable). A
    proposition that is neither a tautology nor a contradiction is called a contingency
    (satisfiable).'
