- pgno: 829
  md: "# Comparable / Incomparable\n\n+   - The elements *a* and *b* of a poset \\\
    ((S, \\preceq)\\) are called **comparable** if either \\(a \\preceq b\\) or \\\
    (b \\preceq a\\).\n+   - When *a* and *b* are elements of *S* such that neither\
    \ \\(a \\preceq b\\) nor \\(b \\preceq a\\), *a* and *b* are called **incomparable**.\n\
    \n+   - **Example:** Consider the power set of \\(\\{a,b,c\\}\\) and the subset\
    \ relation. \\((P(\\{a,b,c\\}), \\subseteq)\\)\n+   \n+     \\(\\{a,c\\} \\nsubseteq\
    \ \\{a,b\\}\\) and \\(\\{a,b\\} \\nsubseteq \\{a,c\\}\\)\n+   \n+   - So, \\(\\\
    {a,c\\}\\) and \\(\\{a,b\\}\\) are **incomparable**."
