  md: '# Maximal and minimal elements


    +   - An element x of a poset (A, ≤ ) is called

    +     - minimal, if there is no other element that precedes it, i.e., there is
    no y ∈ A such that y < x

    +     - maximal, if there is no other element that follows it, i.e., there is
    no y ∈ A such that x < y


    +   - Existence

    +     - Guaranteed for finite sets


    +   - Uniqueness

    +     - Generally not unique'
