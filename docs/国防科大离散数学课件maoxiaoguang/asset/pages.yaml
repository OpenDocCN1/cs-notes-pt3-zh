- pgno: 886
  md: '# Set operations


    The bit string for the union is the bitwise OR of the bit string for the two sets.
    The bit string for the intersection is the bitwise AND of the bit strings for
    the two sets.


    Example:


    +   The bit strings for the sets {1,2,3,4,5} and {1,3,5,7,9} are 11 1110 0000
    and 10 1010 1010, respectively. Use bit strings to find the union and intersection
    of these sets.


    Solution:


    Union:

    11 1110 0000 V 10 1010 1010 = 11 1110 1010,

    {1,2,3,4,5,7,9}


    Intersection:

    11 1110 0000 ∧ 10 1010 1010 = 10 1010 0000, {1,3,5}'
  merge: -1
