- pgno: 588
  md: '# Paths of Undirected Graphs


    A path of length n from u to v, where n is a positive integer, in an undirected
    graph is a sequence of edges e₁, e₂, ..., eₙ of the graph such that f(e₁) = {x₀,
    x₁}, f(e₂) = {x₁, x₂}, ..., f(eₙ) = {xₙ₋₁, xₙ}, where x₀ = u and xₙ = v.


    When the graph is simple, we denote this path by its vertex sequence x₀, x₁, ...,
    xₙ, since it uniquely determines the path.


    +   The path is a circuit if it begins and ends at the same vertex, that is, if
    u = v.


    +   The path or circuit is said to pass through the vertices v₁, v₂, ..., vₙ₋₁
    or traverse the edges x₁, x₂, ..., xₙ.


    +   A path or circuit is simple if it does not contain the same edge more than
    once.'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# Paths of Directed Graphs


    +   - A path of length n from u to v, where n is a positive integer, in a directed
    multigraph is a sequence of edges e₁, e₂, ..., eₙ of the graph such that f(e₁)
    = (x₀, x₁), f(e₂) = (x₁, x₂), ..., f(eₙ) = (xₙ₋₁, xₙ), where x₀ = u and xₙ = v.

    +   - When there are no multiple edges in the path, we denote this path by its
    vertex sequence x₀, x₁, ..., xₙ, since it uniquely determines the path.

    +   - The path is a circuit if it begins and ends at the same vertex, that is,
    if u = v.

    +   - A path or circuit is called simple if it does not contain the same edge
    more than once.'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# Connected


    +   An undirected graph is called connected if there is a path between every pair
    of distinct vertices in the graph.


    +   For example, any two computers in a network can communicate if and only if
    the graph of this network is connected.


    +   Note: A graph consisting of only one vertex is always connected, because it
    does not contain any pair of distinct vertices.'
  merge: -1
  img_proc: true
