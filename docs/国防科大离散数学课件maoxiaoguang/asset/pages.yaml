- pgno: 367
  md: '# 主合取和主析取范式相互变换


    +   1. 用不出现在合式公式B的主合取范式中的极大项构造¬B的主合取范式；

    +   2. 求¬B的对偶式(¬B)*；

    +   3. 在(¬B)*中，用命题变元的否定代替命题变元，命题变元代替命题变元的否定，即可得到B的主析取范式。


