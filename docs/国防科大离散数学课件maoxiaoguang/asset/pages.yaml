  md: "# Satisfiability (SAT) Problem\n\nGiven a p, is p satisfiable?\n\n```\nSAT(p)\n\
    B:=0\nfor all τ ∈ 2^AP(p)\n    B = B ∨ Eval(p,τ)\nend\nreturn B\n```\n\nNP-Complete"
