- pgno: 877
  md: '# Set identities


    | A ∪ ∅ = A

    A ∩ U = A | Identity Law | A ∪ U = U

    A ∩ ∅ = ∅ | Domination law |

    | A ∪ A = A

    A ∩ A = A | Idempotent Law | (Aᶜ)ᶜ = A | Complemention Law |

    | A ∪ B = B ∪ A

    A ∩ B = B ∩ A | Commutative Law | (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ

    (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ | De Morgan’s Law |

    | A ∪ (B ∪ C) = (A ∪ B) ∪ C

    A ∩ (B ∩ C) = (A ∩ B) ∩ C | Associative Law | A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)

    A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C) | Distributive Law |

    | A ∪ (A ∩ B) = A

    A ∩ (A ∪ B) = A | Absorption Law | A ∪ Aᶜ = U

    A ∩ Aᶜ = ∅ | Complement Law |'
  merge: -1
  img_proc: true
