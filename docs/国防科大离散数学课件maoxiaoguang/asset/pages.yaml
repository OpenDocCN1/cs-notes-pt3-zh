- pgno: 822
  md: '# Introduction


    +   An equivalence relation is a relation that is reflexive, symmetric, and transitive


    +   A partial ordering (or partial order) is a relation that is reflexive, *anti*symmetric,
    and transitive


    +   Recall that antisymmetric means that if $(a,b) \in R$, then $(b,a) \notin
    R$ unless $b = a$


    +   Thus, $(a,a)$ is allowed to be in $R$


    +   But since it''s reflexive, all possible $(a,a)$ must be in $R$'
