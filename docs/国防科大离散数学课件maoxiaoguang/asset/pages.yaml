- pgno: 247
  md: '# 数理逻辑


    数理逻辑（又称符号逻辑）：使用特别的表意符号。

    是一门用数学方法研究推理形式的科学。是现代数学的重要基础，也是计算机科学的重要基础之一。

    （对比自然语言和计算机语言）


    数理逻辑中引入了形式语言，组成形式系统，把对形式逻辑的研究归结为对形式系统的研究。有如下优点：


    +   1) 表达准确而简练；

    +   2) 推理严格而方便；

    +   3) 概括程度高，易于分析研究。


    ![](img/47b87ec6fe4fa238d13429358848c545_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 数理逻辑


    数理逻辑的四大分支：


    +   公理集合论

    +   递归论

    +   证明论（构造性数学）

    +   模型论


    逻辑演算（命题逻辑和一阶谓词逻辑）构成其共同基础。


    电子计算机 = 电子学 + 数理逻辑'
