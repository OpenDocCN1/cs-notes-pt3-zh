- pgno: 618
  md: '# Travelling Salesman Problem


    A Hamilton circuit or path may be used to solve practical problems that require
    visiting “vertices”, such as:


    +   - road intersections

    +   - pipeline crossings

    +   - communication network nodes


    A classic example is the Travelling Salesman Problem – finding a Hamilton circuit
    in a complete graph such that the total weight of its edges is minimal.'
  merge: -1
