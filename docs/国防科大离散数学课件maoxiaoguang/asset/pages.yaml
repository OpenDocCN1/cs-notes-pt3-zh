  md: '# Cartesian products


    A Cartesian product is a set of all ordered 2-tuples where each "part" is from
    a given set


    +   - Denoted by A x B, and uses parenthesis (not curly brackets)

    +   - For example, 2-D Cartesian coordinates are the set of all ordered pairs
    Z x Z

    +     - Recall Z is the set of all integers

    +     - This is all possible coordinates in 2-D space

    +   - Example: Given A = { a, b } and B = { 0, 1 }, what is their Cartesian product?

    +     - C = A x B = { (a,0), (a,1), (b,0), (b,1) }


    Formal definition of a Cartesian product:


    +   - A x B = { (a,b) | a ∈ A and b ∈ B }'
