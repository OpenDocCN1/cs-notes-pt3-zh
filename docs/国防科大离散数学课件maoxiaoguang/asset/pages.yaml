- pgno: 89
  md: '# Theoretical foundation:

    Functionally complete sets of truth-functional connectives?


    +   - A set of logical connectives is called **functionally complete** if every
    compound proposition is logically equivalent to a compound proposition involving
    only this set of logical connectives.

    +   - The following systems of truth-functional connectives are functionally complete:

    +     - `{¬, ∧, ∨}`

    +     - `{¬, ∧}` or `{¬, ∨}`

    +     - `{¬, →}`

    +     - `{↑}` or `{↓}`

    +   - Hence in order to express any truth-value function (and thus any PL formula)
    just one connective suffices!

    +     - Either Scheffer’s NAND ↑ or Pierce’s NOR ↓'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Proofs of functionally complete


    +   - Transition to the system $\{\neg, \land\}$ or $\{\neg, \lor\}$:

    +     - $A \land B \Leftrightarrow \neg(\neg A \lor \neg B)$,

    +     - $A \lor B \Leftrightarrow \neg(\neg A \land \neg B)$


    +   - The system $\{\neg, \land, \lor\}$ is sufficient according to the above
    statement.


    +   - Transition to the system $\{\neg, \to\}$:

    +     - $A \lor B \Leftrightarrow \neg A \to B$,

    +     - $A \land B \Leftrightarrow \neg(A \to \neg B)$


    +   - Transition to the system $\{\uparrow\}$ or $\{\downarrow\}$:

    +     - $\neg A \Leftrightarrow A \uparrow A$, $A \land B \Leftrightarrow (A \uparrow
    B) \uparrow (A \uparrow B)$, ($\uparrow$ is NAND),

    +     - $\neg A \Leftrightarrow A \downarrow A$, $A \lor B \Leftrightarrow (A
    \downarrow B) \downarrow (A \downarrow B)$, ($\downarrow$ is NOR).'
  merge: -1
  img_proc: true
