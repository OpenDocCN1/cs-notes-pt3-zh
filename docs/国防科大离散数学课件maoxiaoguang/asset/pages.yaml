- pgno: 61
  md: '# Possible Worlds and Models


    +   - Logicians typically think in terms of models, which are formally structured
    worlds with respect to which truth value can be evaluated.


    +   - *m* is a model of a sentence *α* if *α* is true in *m*


    +   - *M(α)* is the set of all models of *α*


    +   - **Possible worlds ~ models**

    +     - Possible worlds: potentially real environments

    +     - Models: mathematical abstractions that establish the truth or falsity
    of every sentence


    +   - **Example:**

    +     - x + y = 4, where x = #men, y = #women

    +     - Possible models = all possible assignments of integers to x and y'
