  md: '# Satisfaction relation (⊨): intuition


    +   An assignment can either satisfy or not satisfy a given formula.


    +   α ⊨ φ means

    +   - α satisfies φ or

    +   - φ holds at α or

    +   - α is a model of φ


    PHILOSOPHER''S VIEW


    +   We will first see an example.


    +   Then we will define these notions formally.'
