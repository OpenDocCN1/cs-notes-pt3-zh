- pgno: 177
  md: '# Semantics of ∃


    +   Let P(x) = "x+1 > x"

    +     - There is a numerical value for which x+1>x

    +     - In fact, it’s true for all of the values of x!

    +     - Thus, ∃x P(x) is true


    In order to show an existential quantification is true, you only have to find
    ONE value


    In order to show an existential quantification is false, you have to show it’s
    false for ALL values


    ∃xP(x) is True if there exists an x for which P(x) is true.


    ∃xP(x) is False if P(x) is false for every x.'
