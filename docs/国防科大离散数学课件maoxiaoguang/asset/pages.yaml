    triple of numbers


    In n-dimensional space, it is a n-tuple of numbers


    +   - Two-dimensional space uses pairs, or 2-tuples

    +   - Three-dimensional space uses triples, or 3-tuples


    Note that these tuples are **ordered**, unlike sets


