- pgno: 231
  md: '# Resolution for first order logic


    +   - Resolution is refutationally complete (with factoring).

    +   - Factoring is an additional rule that allows you to remove duplicate literals
    within a clause.

    +   - Proving Σ |= A is equivalent to proving that Σ ∪ {¬A} is unsatisfiable.

    +   - A is called the goal.

    +   - In a resolution proof you negate the goal and add it to the set of hypotheses,
    then apply resolution until the empty clause is produced.'
  merge: -1
  img_proc: true
