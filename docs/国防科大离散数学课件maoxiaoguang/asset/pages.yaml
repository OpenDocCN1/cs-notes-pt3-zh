- pgno: 577
  md: '# Adjacency Matrix for Directed Graphs


    +   Let G = (V, E) be a directed graph with |V| = n. Suppose that the vertices
    of G are listed in arbitrary order as v1, v2, ..., vn.


    +   The adjacency matrix A (or AG) of G, with respect to this listing of the vertices,
    is the n×n zero-one matrix with 1 as its (i, j)th entry when there is an edge
    from vi to vj, and 0 otherwise.


    +   In other words, for an adjacency matrix A = [aij],

    +   { aij = 1    if (vi, vj) is an edge of G,

    +     aij = 0    otherwise. }'
  merge: -1
