- pgno: 842
  md: '# Upper bound, Lower bound


    +   Sometimes it is possible to find an element that is greater than all the elements
    in a subset A of a poset (S, ≪ ).


    +   If u is an element of S such that a ≪ u for all elements a ∈ A, then u is
    called an upper bound of A.


    +   Likewise, there may be an element less than all the elements in A.


    +   If v is an element of S such that v ≪ a for all elements a ∈ A, then v is
    called a lower bound of A.'
  merge: -1
  img_proc: true
- pgno: 843
  md: '# Least Upper Bound, Greatest Lower Bound


    +   - The element x is called the *least upper bound* (lub) of the subset A if
    x is an upper bound that is less than every other upper bound of A.

    +   - The element y is called the *greatest lower bound* (glb) of A if y is a
    lower bound of A and z ≤ y whenever z is a lower bound of A.'
  merge: -1
  img_proc: true
