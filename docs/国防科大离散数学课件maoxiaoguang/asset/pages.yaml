  md: '# Subsets ⊆


    S ⊆ T ⇔ ∀x(x ∈ S → x ∈ T)


    S ⊈ T ⇔ ∃x(x ∈ S ∧ x ∉ T)


    For any set S, S ⊆ S (∀S S ⊆ S)


    For any set S, ∅ ⊆ S (∀S ∅ ⊆ S)


    Examples:


    ⊆ R


    {3} ⊆ {5,7,3}


    ⊈ N'
