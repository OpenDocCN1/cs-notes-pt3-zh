  md: "# 等价变换法\n\n求 wff A 的主析取范式的算法：\n\n+   i) 利用 E16 和 E22 删去 → 和 ← 在 A 中的所有出现，得到\
    \ A₁；\n+   \n+   ii) 利用德·摩尔根律将 A₁ 中的 ¬ 内移到原子之前，并用 E₁ 使每个原子之前至多仅有一个 ¬；\n+   \n\
    +   iii) 再用分配律将 ii) 的结果化为若干个合取式的析取，其中每个合取式的因子皆为原子或原子的否定；\n+   \n+   iv) 对于 iii)\
    \ 的结果中的每个合取式 B，若命题变元 P 在 B 中不出现，利用 (B∧P)∨(B∧¬P) ⇔ B∧(P∨¬P) ⇔ B∧T ⇔ B 取代 B，直到每个合取式都变为极小项，最后删除相同项。"
