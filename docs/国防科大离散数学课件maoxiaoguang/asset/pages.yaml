    +   - Recall our example

    +     - Let φ = (p ∨ (q → r))

    +     - Let α = {p ↦ 0, q ↦ 0, r ↦ 1}


    Eval(φ, α) = Eval(p, α) ∨ Eval(q → r, α) = 0 ∨ (Eval(q, α) → Eval(r, α)) = 0 ∨
