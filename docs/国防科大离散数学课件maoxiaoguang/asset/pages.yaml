- pgno: 82
  md: '# A Famous Problem in Computer Science


    +   We have shown how to use propositional logic to write system specifications.


    +   In real world, there may be hundreds, even thousands of propositions in the
    requirements. How to find proper truth values to propositions such that all requirements
    are satisfied. This problem is called the satisfiability problem.


    +   Since there are so many propositions, one would write a program to find a
    solution for us.


    +   However, if there are 300 propositions in the specification, a brute-force
    method may try 2^300 possible combinations. It is worth noting that 2^300 ≈ 10^90
    but the number of particles in our universe is roughly 10^87. It doesn''t sound
    "efficient".


    +   Whether there is an "efficient" way to solve the problem is the famous P=NP?
    problem.'
