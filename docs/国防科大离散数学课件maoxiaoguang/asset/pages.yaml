  md: '# Introduction to logical connectives


    +   - An operator or connective combines one or more operand expressions into
    a larger expression. (e.g., "+" in numeric exprs.)

    +     - Unary operators take 1 operand (e.g., −3); binary operators take 2 operands
    (e.g., 3 × 4).


    +   - Logical connectives are used to form new propositions from two or more existing
