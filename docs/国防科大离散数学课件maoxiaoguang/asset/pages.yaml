- pgno: 407
  md: "# # 合式公式\n\n合式公式（wff），是按以下规则构成的有穷符号串：\n\n+   i) 每个原子是一个 wff；\n+   \n+   ii)\
    \ 如果 A 是 wff，则 (¬A) 是 wff；\n+   \n+   iii) 如果 A 和 B 都是 wff，则 (A∨B)、(A∧B)、(A→B)\
    \ 和 (A↔B) 都是 wff；\n+   \n+   iv) 如果 A 是 wff，x 为个体变元，则 (∀x)A 和 (∃x)A 都是 wff；\n\
    +   \n+   v) 只有有限次应用步骤 i)、ii)、iii) 和 iv) 构成的公式才是合式公式。\n\n分子合式公式：构造过程中的 wff。"
  merge: -1
