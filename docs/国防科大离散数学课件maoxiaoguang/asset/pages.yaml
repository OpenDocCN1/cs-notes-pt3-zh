- pgno: 62
  md: '# Definitions wrt Model


    +   - A **model** of a PL formula A: an interpretation 𝒢 such that A is true in
    𝒢: 𝒢(A) = T.

    +     - A formula is a **tautology** iff **any interpretation is its model**.

    +     - A formula is a **contradiction** iff **it has no model**.

    +     - A formula is a **contingency** iff **it has at least one model**.


    +   - A set of formulas {A₁,...,Aₙ} is satisfiable iff there is a interpretation
    𝒢 such that 𝒢 is a model of every formula Aᵢ, i = 1,...,n.

    +     - The interpretation 𝒢 is then **a model of the set {A₁,...,Aₙ}**.'
  merge: -1
  img_proc: true
