- pgno: 663
  md: '# Euler''s Formula


    Let G be a connected planar simple graph with e edges and v vertices. Let r be
    the number of regions in a planar representation of G.

    Then r = e - v + 2.


    ![](img/47b87ec6fe4fa238d13429358848c545_663_0.png)


    # of edges, e = 6

    # of vertices, v = 4

    # of regions, r = e - v + 2 = 4'
  merge: -1
  img_proc: true
- pgno: 664
  md: '# continue ...


    +   - Corollary 1: If *G* is a connected planar simple graph with *e* edges and
    *v* vertices where *v* ≥ 3, then *e* ≤ 3*v* − 6.


    +   - Is *K*₅ planar?


    ![](img/47b87ec6fe4fa238d13429358848c545_664_0.png)


    *K*₅'
  merge: -1
