- pgno: 872
  md: '# Set operations: Union


    Formal definition for the union of two sets:

    A ∪ B = { x | x ∈ A or x ∈ B }


    # Further examples


    +   - {1, 2, 3} ∪ {3, 4, 5} = {1, 2, 3, 4, 5}

    +   - {a, b} ∪ {3, 4} = {a, b, 3, 4}

    +   - {1, 2} ∪ ∅ = {1, 2}


    # Properties of the union operation


    +   - A ∪ ∅ = A  Identity law

    +   - A ∪ U = U  Domination law

    +   - A ∪ A = A  Idempotent law

    +   - A ∪ B = B ∪ A  Commutative law

    +   - A ∪ (B ∪ C) = (A ∪ B) ∪ C  Associative law'
  merge: -1
  img_proc: true
- pgno: 873
  md: '# Set operations: Intersection


    Formal definition for the intersection of two sets:


    A ∩ B = { x | x ∈ A and x ∈ B }


    # Examples


    +   - {1, 2, 3} ∩ {3, 4, 5} = {3}

    +   - {a, b} ∩ {3, 4} = ∅

    +   - {1, 2} ∩ ∅ = ∅


    # Properties of the intersection operation


    +   - A ∩ U = A    Identity law

    +   - A ∩ ∅ = ∅    Domination law

    +   - A ∩ A = A    Idempotent law

    +   - A ∩ B = B ∩ A    Commutative law

    +   - A ∩ (B ∩ C) = (A ∩ B) ∩ C    Associative law'
  merge: -1
  img_proc: true
- pgno: 874
  md: '# Disjoint sets


    Formal definition for disjoint sets: two sets are disjoint if their intersection
    is the empty set


    # Further examples


    +   - {1, 2, 3} and {3, 4, 5} are not disjoint

    +   - {a, b} and {3, 4} are disjoint

    +   - {1, 2} and ∅ are disjoint

    +     - Their intersection is the empty set

    +   - ∅ and ∅ are disjoint!

    +     - Their intersection is the empty set'
  merge: -1
  img_proc: true
- pgno: 875
  md: '# Set operations: Difference


    Formal definition for the difference of two sets:

    A - B = { x | x ∈ A and x ∉ B }


    # Further examples


    +   - {1, 2, 3} - {3, 4, 5} = {1, 2}

    +   - {a, b} - {3, 4} = {a, b}

    +   - {1, 2} - ∅ = {1, 2}


    The difference of any set S with the empty set will be the set S'
  merge: -1
