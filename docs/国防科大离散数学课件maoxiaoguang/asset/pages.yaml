- pgno: 244
  md: '# 形式逻辑


    形式逻辑：用自然语言研究推理形式。缺点：不准确。


    +   1) 限于主宾式语句，再按质按量分成四种：

    +   全称肯定A：凡S均为P；

    +   全称否定E：凡S均非P；

    +   特称肯定I：有的S为P；

    +   特称否定O：有的S非P。


    但人们日常使用的语句却不限于主宾式语句：


    +   “我与他争论”

    +   “我给你们上《离散数学》课”'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 形式逻辑


    2）限于三段论推理形式：两个前提，一个结论


    （凡）人总是要死的    张三是人


    张三是要死的


    但三段论不能包括一切推理形式。'
  merge: -1
