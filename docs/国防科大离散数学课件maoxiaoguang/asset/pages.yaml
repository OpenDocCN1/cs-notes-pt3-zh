    +   \n+   v) 对 $G$ 中出现的每个 $n$ 元谓词，指定一个从 $D^n$ 到 $\\{T,F\\}$ 的函数；\n\n$G_I$ 的真值为合式公式\
    \ $G$ 在 $I$ 下的真值。"
