- pgno: 296
  md: '# 括号省略规则


    约定：


    +   i) 合式公式最外层的括号可以省略；


    +   ii) 规定各逻辑联结词的运算优先级次序（从高到底）为： ¬, ∧, ∨, →, ↔，依此可省略括号；


    +   iii) 对 wff 中同一联结词的多次连续出现，按从左到右的次序运算，以此可省略中间括号。'
  merge: -1
