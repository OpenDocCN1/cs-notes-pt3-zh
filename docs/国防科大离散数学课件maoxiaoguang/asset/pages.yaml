  md: '# # Set cardinality


    The cardinality of a set is the number of elements in a set, written as |A|




    +   - Let R = {1, 2, 3, 4, 5}. Then |R| = 5

    +   - |∅| = 0

    +   - Let S = {∅, {a}, {b}, {a, b}}. Then |S| = 4'
