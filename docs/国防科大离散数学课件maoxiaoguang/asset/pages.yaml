- pgno: 186
  md: '# Binding variables


    Consider a propositional function P(x).


    A variable x is said to be bound when:


    +   - a value is assigned to x, or

    +   - a quantifier is used on x.


    Otherwise, x is said to be free.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Free and bound variables


    When all the variables of a propositional function are bound then it becomes a
    proposition.


    Let P(x, y) denote "x < y".


    +   In ∃x P(x, y), variable x is bound but y is free, and ∃x P(x, y) is not yet
    a proposition.


    +   ∃x P(x, 2) is now a proposition; all the variables are bound now.


    +   ∀x ∃y P(x, y) is also a proposition, all the variables are bound now.


    Note that once a variable is bound using a quantifier, it cannot be given a value.


    +   For example, ∃x P(3, y) does not make sense.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Examples


    +   □ (∃x P(x)) ∨ Q(x)

    +     ▸ The x in Q(x) is not bound; thus not a proposition


    +   □ (∃x P(x)) ∨ (∀x Q(x))

    +     ▸ Both x values are bound; thus it is a proposition


    +   □ (∃x (P(x) ∧ Q(x))) ∨ (∀y R(y))

    +     ▸ All variables are bound; thus it is a proposition


    +   □ (∃x (P(x) ∧ Q(y))) ∨ (∀y R(y))

    +     ▸ The y in Q(y) is not bound; this not a proposition'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Scope of quantifiers


    The *scope* of a quantifier (∃ or ∀) is the part of the expression that it applies
    to.


    +   In ∀x(S(x)→P(x)), the scope of ∀ is S(x)→P(x).


    +   In (∃x P(x))∧Q(x), the scope of ∃ is P(x).


    +   This is the same as (∃y P(y))∧Q(x).'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Nested quantifiers


    +   A statement may have multiple quantifiers.


    +   ∀x∃y P(x, y)

    +     ▸ "For all x, there exists a y such that P(x,y)"

    +     ▸ Example: ∀x∃y (x+y == 0)


    +   ∃x∀y P(x,y)

    +     ▸ There exists an x such that for all y P(x,y) is true"

    +     ▸ ∃x∀y (x*y == 0)'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Order of quantifiers


    When we have more than one variable in a propositional function, the order of
    the quantifiers is important (unless the quantifiers are of the same type).


    ∃x∀y and ∀x∃y are not equivalent!


    ∃x∀y P(x,y)


    If P(x,y) = "(x+y == 0)", it is false.


    ∀x∃y P(x,y)


    If P(x,y) = "(x+y == 0)", it is true.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Thinking of Quantification as Loops


    +   - Nested quantifiers can be thought of as nested loops.


    +   - For example, ∀x∀yP(x,y) can be thought of as a loop over x, inside of which
    we loop over y (i.e., for each value of x).


    +   - Likewise, ∃x∃yP(x,y) can be thought of as a loop over x with a loop over
    y nested inside.


    +   - This can be extended to any number of variables.'
  merge: -1
