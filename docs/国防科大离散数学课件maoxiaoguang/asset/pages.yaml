- pgno: 831
  md: '# Examples


    +   □ Is ≤ on the set of reals a total order?

    +     ▸ Yes. For any reals x and y, either x ≤ y or y ≤ x.

    +   □ | on the set of positive integers?

    +     ▸ No. Neither 2 divides 3, nor 3 divides 2.

    +   □ ⊆ on the power set of a set?

    +     ▸ No. For x ≠ y, neither {x} ⊆ {y}, nor {y} ⊆ {x}.

    +   □ Lexicographic order on English words?

    +     ▸ Yes. For any two words, either x precedes y or y precedes x (or both if
    they are the same).'
  merge: -1
  img_proc: true
- pgno: 832
  md: '# Generalized lexicographic order


    If $(A_1, \preceq_1)$, $(A_2, \preceq_2)$, ..., $(A_n, \preceq_n)$ are posets,
    the lexicographic order on the Cartesian product $A_1 \times A_2 \times \cdots
    \times A_n$ is defined recursively: $(a_1, a_2, \ldots, a_n) \preceq (b_1, b_2,
    \ldots, b_n)$ if


    +   - $a_1 \preceq_1 b_1$, or

    +   - $a_1 = b_1$ and $(a_2, \ldots, a_n) \preceq (b_2, \ldots, b_n)$'
  merge: -1
  img_proc: true
- pgno: 833
  md: '# Lexicographic order on strings


    If $x = (x_1, x_2, ..., x_n)$ and $y = (y_1, y_2, ..., y_m)$ are two strings,
    we define lexicographic order on them as an extension of the previous that takes
    care of different lengths. Let $k = \min(n, m)$; then $x \leqslant y$ if


    +   - $(x_1, x_2, ..., x_k) \leqslant (y_1, y_2, ..., y_k)$ or

    +   - $(x_1, x_2, ..., x_k) = (y_1, y_2, ..., y_k)$ and $k = n < m$'
  merge: -1
  img_proc: true
- pgno: 834
  md: '# Hasse diagrams


    What is the directed graph representation of a partial order?


    +   - There will be loops at every node

    +   - Transitivity will produce many "extra" edges

    +   - There will be a particular direction for edges


    Hasse diagrams simplify the graph by removing loops, removing extra edges implied
    by transitivity, and putting nodes in order (bottom to top) so that arrows can
    be omitted


    +   - Start with a directed graph of the relation in which all arrows point upward.
    Then eliminate:

    +     - the loops at all the vertices,

    +     - all arrows whose existence is implied by the transitive property,

    +     - the direction indicators on the arrows.'
  merge: -1
