- pgno: 325
  md: '# 代入和置换的区别


    1°（被动对象） 代入是对命题变元进行取代

    置换是对分子公式进行取代


    2°（主动对象） 可用任意合式公式代入命题变元

    仅可用与分子公式等价的wff置换该分子公式


    3°（位置） 代入必须取代该命题变元的所有出现

    置换可以取代该分子公式的部分出现


    4°（结果） 代入后得到的新公式与原公式不一定等价

    取代后得到的新公式必与原公式等价'
  merge: -1
  img_proc: true
