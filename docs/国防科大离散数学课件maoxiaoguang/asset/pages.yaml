  md: '# Proof by Set Identities


    ♈ A ∩ B = A - (A - B)

    Proof) A - (A - B) = A - (A ∩ Bᶜ)

    = A ∩ (A ∩ Bᶜ)ᶜ

    = A ∩ (Aᶜ ∪ B)

    = (A ∩ Aᶜ) ∪ (A ∩ B)

    = ∅ ∪ (A ∩ B)

    = A ∩ B'
