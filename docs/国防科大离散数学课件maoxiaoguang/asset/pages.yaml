- pgno: 497
  md: '# 形式推理、形式推理关系


    形式推理：不考虑公式的解释，依推理规则办事，如果由A₁，A₂，…，Aₙ能够形式地推出A，则A必是A₁，A₂，…，Aₙ的逻辑结果。


    形式推理关系：合式公式的有限序列与合式公式之间的一种关系。如果合式公式的有限序列A₁，A₂，…，Aₙ与合式公式A之间存在形式推理关系，则记为


    A₁，A₂，…，Aₙ ⊢ A


    * 前提中各公式的排列次序无关紧要


    合式公式的有限集


    n=0      ⊢ A      无需前提      A永真式


