- pgno: 512
  md: '# 常用证明策略（无量词部分）


    +   1. （右→策略）若要证Γ ⊢ A→B，一般可把A作为附加前提引入，以推出B（再用→₊可得A→B）。如果仍达不到目的，可再把¬B作为附加前提引入，以推出矛盾结果（再利用¬₊等规则即可得B）。

    +   2. （右∧策略）若要证Γ ⊢ A∧B，一般可先证结论相对简单的Γ ⊢ A和Γ ⊢ B，然后再由∧₊规则得到Γ ⊢ A∧B。

    +   3. （右∨策略）若要证Γ ⊢ A∨B，一般可先证Γ，¬A ⊢ B（或Γ，¬B ⊢ A）得到Γ，¬A ⊢ A∨B（或Γ，¬B ⊢ A∨B），然后利用Γ，A
    ⊢ A∨B（或Γ，B ⊢ A∨B）和∨₋规则即可得到Γ ⊢ A∨B。'
  merge: -1
  img_proc: true
- pgno: 513
  md: '# 常用证明策略（无量词部分）


    4. （右A策略）若要证Γ ⊢ A，可把¬A作为附加前提引入，以推出矛盾（再利用¬+规则得到A）。如果把¬A作为附加前提引入之后，仍没有明确的证明思路，此时可以观察前提，考虑一下选什么作为C，才能既得到
    Γ，¬A ⊢ C又能得到 Γ，¬A ⊢ ¬C，从而产生矛盾（再利用¬+规则得到A）。例如：¬(A→B) ⊢ A（可选取 A→B 作为C）。


    5. （右¬策略）若要证Γ ⊢ ¬A，可把A作为附加前提引入，以推出矛盾（再利用¬+规则得到¬A）。如果把A作为附加前提引入之后，仍没有明确的证明思路，此时可以观察前提，考虑一下选什么作为C，才能既得到Γ，A
    ⊢ C又能得到Γ，A ⊢ ¬C，从而产生矛盾（再利用¬+规则得到A）。'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# 常用证明策略（无量词部分）


    6. （右↔策略）若要证Γ ⊢ A↔B，一般可先证Γ, A ⊢ B和Γ, B ⊢ A,然后利用↔+规则即可得到Γ ⊢ A↔B


    7. （左¬策略）若要证Γ, ¬A ⊢ C，如果直接使用¬A进行证明有困难，可以先证Γ, ¬A, ¬C ⊢ C，然后利用¬+和¬-规则得到Γ, ¬A ⊢ C。


    8. （左→策略）若要证Γ, A→B ⊢ ?，可先证Γ ⊢ A，然后利用→-规则得到Γ, A→B ⊢ B，从而变复杂前提A→B为易于使用的简单前提。或者，可直接证Γ,
    A→B, A ⊢ B以分解复杂前提A→B，然后想办法消除附加前提。'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# 常用证明策略（无量词部分）


    +   9. （左∧策略）若要证 Γ, A∧B ⊢ C，可直接分解前提 A∧B 得到 Γ, A∧B ⊢ A 和 Γ, A∧B ⊢ B。


    +   10. （左∨策略）若要证 Γ, A∨B ⊢ C，则可分别把 A 与 B 作为前提引入，即先证 Γ, A ⊢ C 和 Γ, B ⊢ C，再由 ∨ 规则得到
    Γ, A∨B ⊢ C。


    +   11. （左↔策略）若要证 Γ, A↔B ⊢ C，可利用 ↔ 规则得到 Γ, A↔B ⊢ A→B 和 Γ, A↔B ⊢ B→A，然后利用策略 10
    对 A→B 和 B→A 加以利用。'
