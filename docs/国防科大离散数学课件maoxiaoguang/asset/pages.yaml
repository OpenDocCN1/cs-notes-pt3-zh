- pgno: 261
  md: '# 合取联结词 (∧)


    • 定义：设定P, Q, “P并且Q” 生成新命题 P∧Q。读作 “P和Q”。


    | p | q | p∧q |

    |---|---|---|

    | F | F | F |

    | F | T | F |

    | T | F | F |

    | T | T | T |


    ¬和∧就能够表达各种命题操作


