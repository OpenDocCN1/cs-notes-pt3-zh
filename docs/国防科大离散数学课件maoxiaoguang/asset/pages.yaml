- pgno: 142
  md: '# Terminology


    +   - Theorem: a statement that can be shown true. Sometimes called facts.

    +     - Proposition: less important theorem

    +   - Proof: Demonstration that a theorem is true.

    +   - Axiom: A statement that is assumed to be true.

    +   - Lemma: a less important theorem that is useful to prove a theorem.

    +   - Corollary: a theorem that can be proven directly from a theorem that has
    been proved.

    +   - Conjecture: a statement that is being proposed to be a true statement.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Direct proofs


    +   - Consider an implication: p→q

    +     - If p is false, then the implication is always true

    +     - Thus, show that if p is true, then q is true


    +   - To perform a direct proof, assume that p is true, and show that q must therefore
    be true


    +   - Show that the square of an even number is an even number

    +     - Rephrased: if n is even, then n² is even


    (Proof) Assume n is even

    Thus, n = 2k, for some k (definition of even numbers)

    n² = (2k)² = 4k² = 2(2k²)

    As n² is 2 times an integer, n² is thus even'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Indirect proofs


    +   Consider an implication: p→q

    +   - It’s contrapositive is ¬q→¬p

    +     - Is logically equivalent to the original implication!

    +   - If the antecedent (¬q) is false, then the contrapositive is always true

    +   - Thus, show that if ¬q is true, then ¬p is true


    +   To perform an indirect proof, do a direct proof on the contrapositive'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Indirect proof example


    +   - If n² is an odd integer then n is an odd integer

    +   - Prove the contrapositive: if n is an even integer, then n² is an even integer


    (Proof) Assume n is an even integer


    n = 2k for some integer k (def. of even numbers)


    n² = (2k)² = 4k² = 2(2k²)


    Since n² is 2 times an integer, it is even


    +   - When do you use a direct proof versus an indirect proof?'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Example of which to use


    +   - Prove that if n is an integer and n³+5 is odd, then n is even


    +   - Via direct proof

    +     - n³+5 = 2k+1 for some integer k (definition of odd numbers)

    +     - n³ = 2k-4

    +     - Umm...      n = ∛(2k - 4)   ???


    +   - So direct proof doesn’t work out. So: indirect proof

    +     - Contrapositive: If n is odd, then n³+5 is even

    +     - Assume n is odd, and show that n³+5 is even

    +     - n=2k+1 for some integer k (definition of odd numbers)

    +     - n³+5 = (2k+1)³+5 = 8k³+12k²+6k+6 = 2(4k³+6k²+3k+3)

    +     - As 2(4k³+6k²+3k+3) is 2 times an integer, it is even'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Proof by contradiction


    +   - Given a statement p, assume it is false

    +     - Assume ¬p

    +   - Prove that ¬p cannot occur

    +     - A contradiction exists

