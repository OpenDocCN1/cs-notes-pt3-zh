- pgno: 334
  md: '设A和B仅包含逻辑联结词 ¬，∧，∨。若 A ⇔ B，则 A* ⇔ B*。

    证明：设 P₁，P₂，…，Pₙ为出现在 A 和 B 中的所有命题变元，故

    A(P₁，P₂，…，Pₙ) ⇔ B(P₁，P₂，…，Pₙ) 是永真式。

    由代入定理知

    A(¬P₁，¬P₂，…，¬Pₙ) ⇔ B(¬P₁，¬P₂，…，¬Pₙ) 是永真式。

    即： A(¬P₁，¬P₂，…，¬Pₙ) ⇔ B(¬P₁，¬P₂，…，¬Pₙ)

    ¬A*(P₁，P₂，…，Pₙ) ⇔ ¬B*(P₁，P₂，…，Pₙ)

    故 A* ⇔ B*。'
  merge: -1
  img_proc: true
