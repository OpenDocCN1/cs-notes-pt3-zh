- pgno: 650
  md: '# Planar Graphs


    +   - A graph is called **planar** if it can be drawn in the plane without any
    edges crossing.

    +   - A crossing of edges is the intersection of the lines or arcs representing
    them at a point other than their common endpoint.

    +   - Such a drawing is called a **planar** representation of the graph.'
  merge: -1
  img_proc: true
