- pgno: 128
  md: '# Natural deduction system (ℳ)


    +   - Natural deduction was invented by G. Gentzen in 1934.

    +     - The idea was to have a system of derivation rules that as closely as possible
    reflect the logical steps in an informal rigorous proof.


    +   - In logic and proof theory, natural deduction is a kind of proof calculus
    in which logical reasoning is expressed by inference rules closely related to
    the "natural" way of reasoning.


    +   - This contrasts with the axiomatic systems which instead use axioms as much
    as possible to express the logical laws of deductive reasoning.'
