- pgno: 805
  md: "# Transitive closure algorithm\n\n```\nprocedure transitive_closure (M_R: zero-one\
    \ n×n matrix)\n    A := M_R\n    B := A\n    for i := 2 to n\n    begin\n    \
    \    A := A ⊙ M_R\n        B := B ∨ A\n    end { B is the zero-one matrix for\
    \ R* }\n```\n\nWhat is the time complexity?      O(n⁴)"
