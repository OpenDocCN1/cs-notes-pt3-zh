    Solution: $A_G = \begin{bmatrix}0 & 1 & 1 & 2 \\ 1 & 1 & 0 & 1 \\ 1 & 0 & 0 &
    3 \\ 2 & 1 & 3 & 0\end{bmatrix}$


    Note: Adjacency matrices of undirected graphs are always symmetric.'
  merge: -1
