- pgno: 627
  md: '# Weighted Graphs


    +   - A weighted graph is a graph in which each edge (u, v) has a weight w(u,
    v). Each weight is a real number.

    +   - Weights can represent distance, cost, time, capacity, etc.

    +   - The length of a path in a weighted graph is the sum of the weights on the
    edges.

    +   - Dijkstra’s Algorithm finds the shortest path between two vertices.'
  merge: -1
  img_proc: true
- pgno: 628
  md: '# Shortest-Path Problem


    Given a weighted graph and two vertices u and v, we want to find a path of minimum
    total weight between u and v.


    +   - Length of a path is the sum of the weights of its edges.


    Application:


    +   - Internet packet routing

    +   - Flight reservations

    +   - Driving directions'
  merge: -1
  img_proc: true
- pgno: 629
  md: '# Shortest Path Properties


    +   - Property 1:

    +     - A subpath of a shortest path is itself a shortest path

    +   - Property 2:

    +     - There is a tree of shortest paths from a start vertex to all the other
    vertices'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# Dijkstra''s Algorithm


    +   - Dijkstra’s algorithm is an iterative procedure that finds the shortest path
    between to vertices a and z in a weighted graph.

    +   - It proceeds by finding the length of the shortest path from a to successive
    vertices and adding these vertices to a distinguished set of vertices S.

    +   - The algorithm terminates once it reaches the vertex z.'
  merge: -1
  img_proc: true
- pgno: 631
  md: "# Dijkstra's Algorithm\n\n```\nprocedure Dijkstra(G: weighted connected simple\
    \ graph with vertices a = v₀, v₁, ..., vₙ = z and positive weights w(vᵢ, vⱼ),\
    \ where w(vᵢ, vⱼ) = ∞ if {vᵢ, vⱼ} is not an edge in G)\nfor i := 1 to n\n    L(vᵢ)\
    \ := ∞\nL(a) := 0\nS := ∅\n{the labels are now initialized so that the label of\
    \ a is zero and all other labels are ∞, and the distinguished set of vertices\
    \ S is empty}\n```"
  merge: -1
  img_proc: true
- pgno: 632
  md: "# Dijkstra's Algorithm\n\n```\nwhile z ∉ S\nbegin\n    u := the vertex not\
    \ in S with minimal L(u)\n    S := S ∪ {u}\n    for all vertices v not in S\n\
    \    if L(u)+w(u,v)<L(v) then L(v) := L(u) + w(u, v)\n    {this adds a vertex\
    \ to S with minimal label and updates the labels of vertices not in S}\nend {L(z)\
    \ = length of shortest path from a to z}\n```"
  merge: -1
  img_proc: true
