- pgno: 149
  md: '# Proof by contradiction example 2


    +   - Prove that if n is an integer and n³+5 is odd, then n is even

    +   - Rephrased: If n³+5 is odd, then n is even


    +   - Assume p is true and q is false

    +     - Assume that n³+5 is odd, and n is odd


    +   - n=2k+1 for some integer k (definition of odd numbers)


    +   - n³+5 = (2k+1)³+5 = 8k³+12k²+6k+6 = 2(4k³+6k²+3k+3)


    +   - As 2(4k³+6k²+3k+3) is 2 times an integer, it must be even


    +   - Contradiction!'
