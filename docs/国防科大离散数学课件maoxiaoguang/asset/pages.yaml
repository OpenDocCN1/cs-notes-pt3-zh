- pgno: 293
  md: '# 合式公式


    合式公式用wff表示，是按以下规则构成的有穷符号串：


    +   i) 若P为原子，则P为wff;

    +   ii) 若A为wff，则(¬A)为wff;

    +   iii) 若A和B都是wff，则(A∧B)、(A∨B)、(A→B)、(A↔B)都是wff。


    （类比于算术表达式的定义）


    分子合式公式：是wff 且 是某wff的一部分。'
  merge: -1
