- pgno: 109
  md: '# Logic programming


    Strategies of generating resolvents:


    +   - **Breadth-first** (pursue all closest paths first)

    +     - Resolution closure – generates **all** resolvents

    +     - It can be rather inefficient due to combinatorial explosion of resolvents


    +   - **Depth-first** (top down: pursue first path to exhaustion before looking
    an next path)

    +     - It is very simple and efficient to implement, but it is **not complete**;
    it can lead to some very odd infinite loops though there is a solution in a neighbouring
    branch.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Example: incompleteness of the depth-first strategy


    +   - d ∧ e ∧ (b → a) ∧ (e → b) ∧ (d → a) ⊨ a (?)

    +   - Logic program

    +     (depth-first, top down strategy; goal driven):


    +   1. D.                 fact

    +   2. E.                 fact

    +   3. A :- B.            rule (A, if B)

    +   4. B :- E.            rule (B, if E)

    +   5. A :- D.            rule (A, if D)

    +   6. ?A                  query, goal


    - the program tries to meet the goal A by searching top down; the clause 3 meets
    the goal ⇒ generates a new goal B. Succeeds with the clause 4 ⇒ a new goal E –
    met by the clause 2. – **Yes**


    - or generates backtracking: again ?A – clause 5 – goal D – clause 1. – **Yes**'
  merge: -1
  img_proc: true
