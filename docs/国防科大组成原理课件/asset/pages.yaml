- pgno: 167
  md: '# 不定长、定长和混合指令编码


    ![](img/0d16039e8c3308af077d6d25bb4413a8_167_0.png)


    FIGURE 2.23 Three basic variations in instruction encoding: variable length, fixed
    length, and hybrid. The variable format can support any number of operands, with
    each address specifier determining the addressing mode and the length of the specifier
    for that operand. It generally enables the smallest code representation, since
    unused fields need not be included. The fixed format always has the same number
    of operands, with the addressing modes (if options exist) specified as part of
    the opcode (see also Figure C.3 on page C-4). It generally results in the largest
    code size. Although the fields tend not to vary in their location, they will be
    used for different purposes by different instructions. The hybrid approach has
    multiple formats specified by the opcode, adding one or two fields to specify
    the addressing mode and one or two fields to specify the operand address (see
    also Figure D.7 on page D-12).'
  merge: -1
  img_proc: true
