- pgno: 223
  md: '# 异常处理准备


    +   - 精确异常：异常产生时，被异常打断的指令（eptr）前的指令都已经执行完，eptr后的指令都未执行

    +   - 硬件负责完成精确异常，并将eptr保存到协处理器寄存器中以供恢复

    +     - MIPS：EPC寄存器

    +     - Power：SRR0、CSRR0

    +     - SPARC：TPC[TL]

    +     - X86：CS、EIP'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 确定异常来源


    +   - X86：由硬件确定异常编号，并查询存放在内存中的中断描述符表（IDT），得到异常处理地址。

    +   - MIPS：将异常相关状态存放于Cause寄存器中，由软件进一步查询并区分处理，但一些常用异常有专用入口


    | 内存区域 | 入口地址 | 异常处理 |

    |---|---|---|

    | 片上调试 | 0xff200200 | EJTAG调试，映射到探测内存区域时 |

    |  | 0xbfc00480 | EJTAG调试，用普通ROM内存映射时 |

    | 重启 | 0xbfc00000 | 重启和NMI入口点 |

    | ROM中的入口点 | 0xbfc00400 | 中断专用，只有Cause[IV]有效时 |

    |  | 0xbfc00380 | 所有其他异常 |

    |  | 0xbfc00300 | 缓存错误 |

    |  | 0xbfc00200 | 简单的TLB重填 |

    | RAM中的入口点 | BASE+0x200... | 多中断入口 |

    |  | BASE+0x200 | 特殊的中断，当Cause[IV]有效时 |

    |  | BASE+0x180 | 所有其他异常 |

    |  | BASE+0x100 | 缓存错误，但通过非缓存的kseg1访问 |

    |  | BASE+0x000 | 简单的TLB重填 |'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 保存执行状态


    +   - 将被打断程序的状态保存到栈中供恢复

    +     - 除k0/k1外的所有通用寄存器

    +     - 其他需要保存的协处理器寄存器（如何优化？）

    +   - 根据中断优先级要求关闭或保留部分中断使能'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 处理异常


    +   - 根据确定好的异常处理入口地址跳转到对应的处理程序

    +   - 中断处理需要清除中断源状态

    +   - 当处理程序很长时，还需要考虑只处理较为紧急的部分，防止影响对其它中断的响应'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 恢复执行状态并返回


    +   - 从栈中恢复相关寄存器的值

    +   - 从异常返回正常的执行流

    +     - 异常返回往往包含从核心态变为用户态的模式切换，模式切换和地址变化需要同时完成（原子地），否则可能导致保护模式失效

    +     - MIPS中的ERET指令，X86中的IRET指令'
  merge: -1
  img_proc: true
