  md: '# Cache替换算法


    +   - 对直接相联Cache不存在替换算法问题

    +   - 常见的替换算法

    +     - 随机替换、LRU、FIFO

    +   - 每1000条指令失效次数统计

    +     - SPEC CPU2000中的gap, gcc, gzip, mcf, perl, applu, art, equake, lucas, swim
    10个程序

    +     - Aplha结构，块大小64B


    | | 2-way | | | 4-way | | | 8-way | | |

    | | LRU | Rand | FIFO | LRU | Rand | FIFO | LRU | Rand | FIFO |

    | 16KB | 114.1 | 117.3 | 115.5 | 111.7 | 115.1 | 113.3 | 109.0 | 111.8 | 110.4
    |

    | 64KB | 103.4 | 104.3 | 103.9 | 102.4 | 102.3 | 103.1 | 99.7 | 100.5 | 100.3
    |

