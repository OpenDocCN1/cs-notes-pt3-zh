- pgno: 521
  md: '# 迭代式硬件乘法（二）


    +   - 如果参与运算的是补码？

    +     - 先判断结果符号位

    +     - 将补码转为原码进行运算

    +     - 补上符号位，转换回补码

    +   - 太麻烦，不如自行推导补码乘法算法

    +     - 问题: 已知[X]补和[Y]补，求[X*Y]补。

    +     - [X]补 + [Y]补 = [X+Y]补（方括号内为普通加法，方括号外为补码加法）

    +     - 但[X]补 * [Y]补 != [X*Y]补

    +     - 若[Y]补 = y31 y30 …… y1 y0，

    +     - 则 Y = -y31 * 2^31 + y30 * 2^30 + …… + y1 * 2^1 + y0 * 2^0'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# 补码乘法原理


    +   已知[X]补和[Y]补，求[X*Y]补


    [X*Y]补 = [X*(-y31*2^31 + y30*2^30 + ...... + y1*2^1 + y0*2^0)]补

    = [-X*y31*2^31 + X*y30*2^30 + ...... + X*y1*2^1 + X*y0*2^0]补

    = [-X*y31*2^31]补 + [X*y30*2^30]补 + ...... + [X*y1*2^1]补 + [X*y0*2^0]补

    = -[X]补*(y31*2^31) + [X]补*(y30*2^30) + ...... + [X]补*(y1*2^1) + [X]补*(y0*2^0)
    ???


    方括号内为普通加法，方括号外为补码加减（符号位扩充到64位再加）


    定理：[X*2^k]补 = [X]补 * 2^k


    +   运算时，根据y_i取0或1，进行操作


    +   结果先置为0，[X]补扩展为64位


    +   当i = 0 ... 30，若y_i为1，将[X]补左移i位，补码加法到结果


    +   当i = 31，若y_i为1，将[X]补左移i位，补码减法到结果


    +   和原码“移位-加”算法类似（除了最高位）'
  merge: -1
  img_proc: true
