  md: "# Booth二位一乘算法\n\n+   - 对(-y₃₁*2³¹ + y₃₀*2³⁰ + ...... + y₁*2¹ + y₀*2⁰)进行变换\n\
    +   \n+     (-y₃₁*2³¹ + y₃₀*2³⁰ + ...... + y₁*2¹ + y₀*2⁰)\n+     = (y₂₉ + y₃₀\
    \ - 2*y₃₁) *2³⁰ + (y₂₇ + y₂₈ - 2*y₂₉) *2²⁸ + ...... + (y₁ + y₂ - 2*y₃) *2² + (y₋₁\
    \ + y₀ - 2*y₁) *2⁰\n\n+   - 每次循环公式相同，最高位不需额外处理，只需N/2次循环\n\n| yᵢ₊₁ | yᵢ | yᵢ₋₁\
    \ | 操作 |\n|---|---|---|---|\n| 0 | 0 | 0 | +0 |\n| 0 | 0 | 1 | +[X]补 |\n| 0 |\
    \ 1 | 0 | +[X]补 |\n| 0 | 1 | 1 | +2[X]补 |\n| 1 | 0 | 0 | -2[X]补 |\n| 1 | 0 | 1\
