- pgno: 60
  md: '# （二）计算机的成本


    +   - 性能价格比中的价格因素

    +   - 成本和性能价格比的关系比较复杂

    +     - 超级计算机：不计成本，只追求性能

    +     - 嵌入式应用：为降低功耗和成本，可以牺牲一部分性能

    +     - 介于两者之间，比如PC机，工作站，服务器等：追求性能价格比的最优设计

    +   - R&D的成本

    +     - 4%-12%

    +     - 15%-20%'
  merge: -1
