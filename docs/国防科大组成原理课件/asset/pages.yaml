- pgno: 354
  md: '# # 闪存（Flash）


    +   - 非易失性半导体存储器

    +     - 可以随机访问

    +     - 访问延迟只有磁盘的千分之一到百分之一

    +     - 但容量比磁盘小，每GB价格高


    +   - NOR Flash和NAND Flash

    +     - NOR Flash容量小，写入慢，但可靠性高，一般用作BIOS存储

    +     - NAND Flash容量大，存储单位随擦写次数多容易损坏，可通过地址重映射方式来分布写操作，称为磨损均衡（Wear Leveling），平均擦写可达10万次，U盘、SD卡、SSD固态硬盘均采用NAND
    Flash

    +     - NAND Flash比NOR Flash更容易出位交错错，需要ECC算法纠正'
  merge: -1
  img_proc: true
