- pgno: 99
  md: '# 什么是指令系统


    +   - 指令系统是计算机功能的抽象模型

    +     - 是软硬件的界面

    +     - 所有软件最终都以指令的形式运行

    +     - 一个指令系统可以有多种实现（低功耗、高性能、软件模拟...）

    +   - 指令系统结构不仅仅是关于指令功能的编码

    +     - 运行环境：地址空间、异常和中断处理、存储管理、cache管理等

    +       （思考：软件应用是否能够为所欲为）

    +     - 运行环境差异比指令功能差异大，如MIPS有5组寄存器，PPC有14组'
