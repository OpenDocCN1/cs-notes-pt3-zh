- pgno: 103
  md: '# 国际主流指令系统分析


    +   - 目前三种较流行的指令系统： X86、 ARM、 MIPS

    +     - X86： 每年几亿片，垄断PC和服务器市场，虽然受到ARM的一些威胁，但桌面的垄断地位难以动摇，并通过Atom开辟部分移动终端市场

    +     - ARM： 每年50-100亿片，在手持终端市场处于垄断地位，并不断侵蚀MIPS的数字电视、机顶盒等市场，正在往高端发展，在云服务器等领域与X86竞争。

    +     - MIPS： 每年5-10亿片，在X86和ARM的夹缝中艰难生存，但在传统优势市场如数字电视、打印机、网络等仍有一定势力，Android为MIPS带来了一些机会

    +   - 其它指令系统

    +     - PowerPC在汽车电子、工控、服务器领域还有一线生机

    +     - Alpha、 PA-RISC、 Sparc、 IA64主流市场机会不大'
  merge: -1
  img_proc: true
