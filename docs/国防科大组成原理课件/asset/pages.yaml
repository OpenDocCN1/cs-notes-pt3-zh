- pgno: 594
  md: '# 例外和流水线


    +   - 例外原因

    +     - I/O请求：外部中断

    +     - 指令例外：用户请求例外

    +       - 系统调用、断点、跟踪调试指令

    +     - 运算部件

    +       - 整数运算溢出、浮点异常

    +     - 存储管理部件

    +       - 访存地址不对齐、用户访问系统空间、TLB失效、缺页、……

    +     - 保留指令错：未实现指令

    +     - 硬件错

    +     - ……'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# 例外类别


    +   - 例外发生的流水阶段

    +     - 取指：访存例外

    +     - 译码：保留指令、中断指令如Trap、Syscall

    +     - 执行：整数溢出、浮点异常（如除零）等

    +     - 访存：访存例外

    +     - 其它：外部中断，可能在任何时候发生

    +   - 例外特征

    +     - 同步与异步

    +     - 用户请求与系统强制

    +     - 可屏蔽与不可屏蔽

    +     - 指令内与指令间

    +     - 可恢复与结束'
  merge: -1
  img_proc: true
- pgno: 596
  md: '# 例外类别


    | | 同步/异步 | 用户/强制 | 可/不可屏蔽 | 指令内/间 | 可恢复/结束 |

    |---|---|---|---|---|---|

    | I/O 请求 | 异步 | 强制 | 不可屏蔽 | 指令间 | 可恢复 |

    | 系统调用 | 同步 | 用户 | 不可屏蔽 | 指令间 | 可恢复 |

    | 跟踪调试 | 同步 | 用户 | 可屏蔽 | 指令间 | 可恢复 |

    | 断点 | 同步 | 用户 | 可屏蔽 | 指令间 | 可恢复 |

    | 整数溢出 | 同步 | 强制 | 可屏蔽 | 指令内 | 可恢复 |

    | 浮点异常 | 同步 | 强制 | 可屏蔽 | 指令内 | 可恢复 |

    | 缺页 | 同步 | 强制 | 不可屏蔽 | 指令内 | 可恢复 |

    | 访存地址不齐 | 同步 | 强制 | 可屏蔽 | 指令内 | 可恢复 |

    | 存储保护错 | 同步 | 强制 | 不可屏蔽 | 指令内 | 可恢复 |

    | 非法指令 | 同步 | 强制 | 不可屏蔽 | 指令内 | 结束 |

    | 硬件错 | 异步 | 强制 | 不可屏蔽 | 指令内 | 结束 |

    | 电源错 | 异步 | 强制 | 不可屏蔽 | 指令内 | 结束 |'
  merge: -1
  img_proc: true
- pgno: 597
  md: '# 例外处理


    +   - 在前述例外中，指令内可恢复例外的处理比较困难，条件转移指令的delay slot又增加了例外处理的难度

    +   - 精确例外：在处理例外时，发生例外指令前面的所有指令都执行完，例外指令后面的所有指令还未执行。精确例外是存储管理和IEEE运算规范的要求

    +     - 发生例外指令前面的指令继续执行完

    +     - 后面的指令不能修改机器状态，对运算状态字的修改可能在EX阶段进行

    +     - 多条指令发生例外'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# 例外处理


    +   - 简单流水线的例外处理

    +     - 任何一级流水发生例外时，在流水线中记录下发生例外的事件，直到写回阶段再处理

    +     - 如果在执行阶段要修改机器状态（如状态寄存器），保存下来直到写回阶段再修改。

    +     - 指令的PC值随指令流水前进到WB阶段例外处理专用

    +     - 外部中断作为取指的例外处理

    +     - 指定一个通用寄存器中（或一个专用寄存器）为例外处理时保存PC值专用。

    +     - 当发生例外的指令在写回阶段时:

    +       - 保存该指令的PC（也在写回阶段），有些机器还保存其它状态

    +       - 置PC值为例外处理程序入口地址'
  merge: -1
  img_proc: true
