- pgno: 43
  md: '# 冯诺依曼结构的优缺点


    +   - 本质特征

    +     - 存储程序和指令驱动执行

    +     - 目前的计算机没有能突破该特征的，都是对冯诺依曼结构的变种（如哈佛结构、并行结构等）

    +   - 优点

    +     - 自动、快速执行

    +   - 缺点

    +     - 指令驱动的顺序执行

    +     - CPU和存储器分开，而且越来越远'
  merge: -1
  img_proc: true
