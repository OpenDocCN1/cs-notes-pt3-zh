  md: '# 异常嵌套


    +   - 在异常处理中又产生了新的异常，如何处理？

    +   - 无限的异常嵌套不可取

    +   - 将异常分为多个不同的优先级，更高优先级的异常可以抢占处理，同优先级或低优先级只能等待


    ![](img/0d16039e8c3308af077d6d25bb4413a8_228_0.png)'
