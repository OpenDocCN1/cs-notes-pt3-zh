- pgno: 347
  md: '# 内存


    +   - 冯诺依曼结构中的“存储器”

    +     - 采用动态随机存储器DRAM，每个单元只要一个晶体管，通过电容充放电保存数据，需动态刷新

    +     - SDRAM、DDR SDRAM、DDR2 SDRAM、DDR3 SDRAM、DDR4 SDRAM......

    +   - 是CPU性能的决定性因素

    +     - 容量沿摩尔定律不断变大，但延迟降低非常缓慢（每年7%）

    +     - 早期内存通过北桥连接到CPU，现代CPU都直接带内存控制器

    +     - CPU内设置多级Cache来降低平均延迟


