- pgno: 691
  md: '# 存储一致性模型（Memory Consistency）


    +   - 结构设计者与应用程序员之间的一种约定

    +     - 给出正确程序的标准

    +     - 程序员不用考虑访存次序

    +     - 系统设计者有更多的提高性能的空间


    +   - 常见的存储一致性模型

    +     - 顺序一致性模型(Sequential Consistency)

    +     - 处理器一致性模型(Processor Consistency)

    +     - 弱一致性模型(Weak Ordering)

    +     - 释放一致性模型(Release Consistency)


    从某种意义上说，存储一致性模型对共享存储系统中多处处理器的访存次序作了限制，从而影响了性能'
