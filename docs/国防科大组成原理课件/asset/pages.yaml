- pgno: 722
  md: '# LL/SC原子指令对


    +   • 以MIPS的LL和SC指令为例


    +   • LL (Load Linked) 取数且置系统中LLbit为1


    +   • LL为1时，处理器检查相应单元是否被修改，如果其它处理器或设备访问了相应单元或执行了ERET操作，LLbit置0


    +   • 执行SC (Store Conditional) 时若LLbit为1，则成功，目标寄存器为1；否则存数不成功，目标寄存器为0


    +   • 如Fetch_and_increment及swap


    ```

    Try: l1 R2, 0(R1) ;load linked

    addi R2, R2, 1 ;加1

    sc R2, 0(R1) ;store cond.

    beqz R2, try ;写失败，跳转

    nop

    ```


    ```

    Try: mov R2, R1 ;送交换值

    l1 R4, 0(R3) ;load linked

    sc R2, 0(R3) ;store cond.

    beqz R2, try ;写失败，跳转

    mov R1, R4 ;将读出值送给R1

    ```'
  merge: -1
  img_proc: true
- pgno: 723
  md: '# LL/SC原子指令对的优缺点


    +   - **LL/SC原子指令对优点**

    +     - 设计简单，每条指令只需和内存交互一次，而“读-修改-写”指令需要和内存进行两次交互

    +     - 在LL和SC之间可以加入任意运算指令，可灵活实现类似“读-修改-写”的复杂原子操作

    +   - **LL/SC原子指令对缺点**

    +     - 密集共享时导致SC不容易成功

    +     - LL访问要把相应Cache行置为EXC状态，而不是SHD状态，以提高SC成功的概率'
  merge: -1
  img_proc: true
- pgno: 724
  md: "# 实现锁机制\n\n+   - 自旋锁（Spin lock）\n+     - 最基本的锁实现方式，处理器核围绕一个锁不停地旋转而请求获得该锁\n\
    +   - 自旋锁缺点：\n+     - 一个处理器核获得锁后，其他处理器核循环执行Test_and_Set指令访问锁变量，试图获取锁，从而在片上互连上产生大量的访存通信\n\
    +     - 一种简单改进措施：在Test_and_Set指令之间加入一定的延迟，减少等待阶段Test_and_Set指令自旋执行的次数以减轻访存的压力\n\
    \n```\nVoid acquire_lock(){\n    while (test_and_set(lock)!=0;\n}\n```\n\n```\n\
    Void unlock(){\n    lock=0;        //释放锁\n}\n```"
  merge: -1
  img_proc: true
- pgno: 725
  md: "# 栅障实现\n\n+   - 栅障（barrier）功能\n+     - 栅障强制要求所有处理器核上执行的线程（进程）等待，直到所有处理器核上的线程（进程）都到达栅障后，才能释放所有处理器核上的线程（进程），继续执行\n\
    \n+   - 集中式栅障的实现\n+     - 设置一个共享的栅障计数变量。当一个处理器核到达栅障，就使用原子指令将栅障的值加1，然后对该栅障值进行自旋等待\n\
    +     - 优点是简单，缺点是已到达栅障的处理器核，对栅障计数变量的自旋访问，造成很大的访存通信开销\n\n```\nBarrier(){\n    fetch_and_inc(count);\
    \  //到达栅障\n    while(count!=max);     //自旋等待\n}\n```"
  merge: -1
  img_proc: true
- pgno: 726
  md: '# 逆向栅障（Sense Reversal Barrier）


    +   - 栅障作为并行程序不同阶段的分界线可能被多次反复使用

    +   - 隐含两次同步：第一次保证所有处理器核都到达栅障；第二次保证所有处理器核都离开栅障


    P0

    P1

    P2

    Compute1();

    Compute1();

    Compute1();

    Barrier();

    Barrier();

    Barrier();

    Compute2();

    Compute2();

    Compute2();

    Barrier();

    Barrier();

    Barrier();

    第一次同步

    第二次同步


    上图为并行程序的代码片段示意图。假设当P0已经达到第二个栅障，P1还未离开第一个栅障，之前的栅障算法就会出错'
  merge: -1
  img_proc: true
- pgno: 727
  md: "# 逆向栅障（Cont.）\n\n+   - 逆向栅障的实现\n+   - 当前栅障完成的标志信号与上次不同，只需要一次同步完成栅障\n\n```\n\
    Barrier(){\n    local_flag = ~local_flag;                //逆向标志\n    if(fetch_and_inc(count)==max-1)\
    \ {   //到达栅障\n        count = 0;                          //重置栅障\n        flag\
    \ = local_flag;                  //栅障完成通知\n    } else {\n        while(flag!=local_flag);\
    \            //自旋等待\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 728
  md: '# 事务内存（Transaction Memory）


    +   - 在多处理器中，由于同步次数较少、粒度较大，采用锁同步机制是较合适的；但是多核处理器中，同步次数多、粒度小，采用锁同步机制代价较大

    +   - 事务定义：

    +     - 将对共享变量访问的代码区域声明为一个事务（transaction）

    +     - 事务执行并原子地提交所有结果到内存（如果事务成功），或中止并取消所有的结果（如果事务失败）

    +   - 事务具有原子性（Atomicity），一致性（Consistency）和隔离性（Isolation）

    +     - 原子性：事务中的所有指令，要么执行，要么不执行

    +     - 一致性：任何时刻，内存处于一个一致的状态

    +     - 隔离性：事务不能看见其他未提交事务所涉及到的内部对象的状态'
  merge: -1
  img_proc: true
