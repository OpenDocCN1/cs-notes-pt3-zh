- pgno: 707
  md: '# 访存事件次序在微结构中的实现


    +   - 指令在保留站中等待发射时检查并等待

    +     - 等到前面所有指令都提交

    +     - Store操作写到Cache、访存失效队列空

    +     - 同步操作如sync、LL、SC一般在发射时控制

    +   - Load操作能不能越过未完成（地址未确定或尚在Store Buffer中）的Store操作执行

    +     - 如果Load数据返回到寄存器并被使用了，取消起来很麻烦

    +     - 外部来的invalidate操作要查看Store Buffer也很麻烦

    +   - 为了性能和实现的简洁常使用弱一致性模型'
