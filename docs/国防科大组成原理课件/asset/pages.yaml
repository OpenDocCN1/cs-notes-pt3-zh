- pgno: 814
  md: '# 性能建模和测量技术的特性要求


    +   - 性能建模和测量结果要比较准确，直接影响设计权衡和选择

    +   - 模型的速度要比较快，反之设计空间的探索范围就会变得有限

    +   - 所执行的测试程序应该是目标代码

    +   - 能捕获用户态和内核态的行为特性

    +   - 需要能很好的利用多处理器系统资源

    +   - 应该是非侵入式的

    +   - 开销不能太大

    +   - 应该很容易修改和扩展'
  merge: -1
