- pgno: 659
  md: '# OpenMP的制导-并行域结构


    +   - 一个并行域就是一个能被多个线程执行的程序块，它是最基本的OpenMP并行结构

    +     - 当一个线程执行到parallel这个指令时，就会生成一列线程，线程号依次从0到n-1，而自己会成为主线程（线程号为0）。线程数n由下面方法确定，优先前面方法，即：（1）使用库函数
    omp_set_num_threads()来设定；（2）设置环境变量，即 OMP_NUM_THREADS；（3）所使用的默认值。


    ```

    #pragma omp parallel [if(scalar_expression) | private(list) |shared(list) | default(shared|none)
    |firstprivate(list)|reduction(operator:list) |copyin(list) newline

    ```'
