  md: '# 片上总线和交叉开关


    +   - 片上总线及环状总线

    +     - 片上各个部件间通信的公共通路，由一组线组成

    +     - 类型：数据总线、地址总线、控制总线等

    +     - 优点：简单，有利于广播通信

    +     - 缺点：独占性资源，可伸缩性差


    +   - 交叉开关

    +     - 在一个M个输入，N个输出的交叉开关中，每个输出端口都可以接任意输入端口

    +     - 优点：高带宽：并行通信，高带宽

    +     - 缺点：复杂度为M*N，可伸缩性有限


