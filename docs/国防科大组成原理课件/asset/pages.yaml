- pgno: 88
  md: '# 计算机体系结构设计的基本原则


    +   - 计算机体系结构发展很快，但在发展过程中遵循一些基本原则，这些原则包括

    +     - 平衡性：结构设计要统筹兼顾

    +     - 局部性：结构设计要重点突出

    +     - 并行性：人多力量大，开发各个层次的并行性

    +     - 虚拟化：自己麻烦点，让用户好用点'
