- pgno: 680
  md: '# 多核处理器动力二：功耗墙


    +   - 单片设计复杂的单处理器核 vs 单芯片设计多个处理器核

    +     - 后者的性能功耗比收益大

    +   - 芯片功耗=动态功耗+静态功耗，其中动态功耗为主

    +     - 动态功耗=开关功耗+短路功耗

    +     - P_switch = 1/2 C_load V² f

    +   - 提高单核性能开销比多核大

    +     - 提高主频：进一步细分流水线、提高电压

    +     - 通过微结构优化提高IPC：四发射后难以提高

    +     - 例：采用多核结构功耗和性能成线性关系；在一定范围内通过提升电压来提升主频来，功耗与性能成三次方关系'
  merge: -1
