- pgno: 210
  md: '# 外部事件


    +   - 来自CPU流水线外部的事件，也称中断

    +     - 输入输出设备

    +     - USB、网卡、键盘、鼠标

    +   - 特点

    +     - 独立于CPU指令流，纯异步

    +   - 使用中断模式后CPU计算可与I/O处理并行

    +     - 在等待键盘输入时，CPU可以解视频，或者进入低功耗模式

    +     - 对比轮询模式，为了得知I/O状态，CPU需要主动地查询

    +     - 绝大多数外设都采用中断模式（其它定时查询）'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 指令执行中的错误


    +   保留指令（Reserved Instruction）


    +   浮点除以0


    +   整数运算溢出


    +   地址不对齐, AdE


    +   用户态下的无权限访问


    +   只能在核心态下执行的指令, CpU


    +   非法地址空间访问（Kseg2）, AdE'
