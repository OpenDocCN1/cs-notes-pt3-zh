  md: '# 片上总线-AMBA


    +   - Advanced Microcontroller Bus Architecture

    +   - 开放标准，广泛应用于SoC、ASIC、AP


    |  | AXI | AHB | APB |

    |---|---|---|---|

    | 规范中含流水 | 未定义，地址与数据完全分离 | 地址周期比数据周期早一拍 |  |

    | 可增加流水级 | √ | × | × |

    | 常见数据宽度 | 32/64/128 | 32/64 | 8/32 |

    | 突发传输长度 | 1～16 | 1～16～∞ | 1 |

    | 支持outstanding | √ | × split | × |

    | 总线架构 | 交换 | 共享 | 共享 |

    | 仲裁方式 | 分布式 | 集中式 | 无 |

    | 应用范围 | 高性能处理器 | 中等性能系统 | 低带宽寄存器类 |

    | 实现代价 | 高 | 中 | 低 |'
  merge: -1
