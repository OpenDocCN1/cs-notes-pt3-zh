  md: "# 矩阵乘法的并行程序\n\n```\n• 共享存储\ndouble (*a)[N], (*b)[N], (*c)[N];\na=jia_alloc(N*N*8);\n\
    b=jia_alloc(...); c=jia_alloc(...);\nif (jiapid==0) for (i...) for (j...){ \n\
    a[i][j]=1;b[i][j]=1;\n}\njaia_barrier();\nbegin=N*jiapid/jiahosts;\nend=N*(jiapid+1)/jiahosts;\n\
    for (i=begin; i<end; i++)\nfor (j=0; j<N; j++)\nfor (k=0; k<N; k++)\nc[i][j]+=a[i][k]*b[k][j];\n\
    jaia_barrier();\nif (jiapid==0) printf C;\njaia_exit();\n```\n\n```\n• 消息传递\n\
    double (*a)[N], (*b)[N], (*c)[N];\na=malloc2(N*N*8);\nb=malloc2(...); c=malloc(...);\n\
