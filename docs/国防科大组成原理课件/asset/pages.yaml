  md: '# 例：龙芯2F的硅片成本


    +   龙芯2F面积为43平方毫米


    +   晶片成品率 = (1+b*晶片面积/a)^{-a} =78%


    +   A为衡量复杂度的参数，设为4


    +   B为单位面积缺陷数，设为0.6


    +   每个12寸晶圆的晶片数 = (晶圆的面积/晶片的面积) - (晶圆的周长/(2*晶片面积)^{1/2}) =1592


