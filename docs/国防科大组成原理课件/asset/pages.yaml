  md: "# MPI程序例子-利用梯形规则计算π\n\n```\n#include <stdio.h>\n#include \"mpi.h\"\nint main(int\
    \ argc, char **argv){\n    int num_steps=1000000;\n    double x,pi,step,sum,sumallprocs;\n\
    \    int i,start,end,temp;\n    int ID, num_procs;//进程编号及组中的进程数量,范围为0到num_procs-1\n\
    \    MPI_Status status;\n    //Initialize the MPI environment\n    MPI_Init(&argc,&argv);\n\
    \    MPI_Comm_rank(MPI_COMM_WORLD,&ID);\n    MPI_Comm_size(MPI_COMM_WORLD,&num_procs);\n\
    ```\n\n```\n//任务划分并计算\nstep = 1.0/num_steps;\nstart = ID *(num_steps/num_procs)\
    \ ;\nif (ID == num_procs-1)\n    end = num_steps;\nelse  end = start + num_steps/num_procs;\n\
    for(i=start; i<end;i++) {\n    x=(i+0.5)*step;\n    sum += 4.0/(1.0+x*x);}\nMPI_Barrier(MPI_COMM_WORLD);\n\
    MPI_Reduce(&sum,&sumallprocs,1,MPI_DOUBLE,MPI_SUM,0, MPI_COMM_WORLD);\nif(ID==0)\
    \ {\n    pi = sumallprocs*step;\n    printf(\"pi %1f\\n\", pi); }\nMPI_Finalize();\n\
    return 0;}\n```"
