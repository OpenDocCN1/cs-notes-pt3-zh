- pgno: 452
  md: '# IEEE754标准


    +   - 将浮点数标识为符号位S、尾数F和阶码E

    +     - 二进制小数 11.01₂ = (3.25₁₀)

    +     - 转为科学记数法 1.101 × 2¹

    +       （没有前导零，小数点左侧只有一个整数）

    +   - 针对此数，规定：

    +     - 符号S为0表示正数

    +     - 尾数F为101 （省略了“1.”部分）

    +     - 阶码E使用移码表示，1+shift（shift偏移值）


    | S | Exp. (8) | Fraction(23) |

    | S | Exp. (11) | Fraction(52) |'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# IEEE754标准（二）


    +   - 数的位数

    +     - 单精度：1位S，8位E，23位F，共32位

    +     - 双精度：1位S，11位E，52位F，共64位

    +     - 其他...

    +   - 尾数的设定—使用原码，后面补0

    +     - 如下例，单精度尾数为101000...000（共23bit）

    +     - 双精度尾数为101000...000（共52bit）

    +   - 阶码移码的设定

    +     - 单精度移码127

    +     - 双精度移码1023'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# IEEE754标准（三）


    +   - （11.01）₂ = （3.25）₁₀

    +   - 单精度表示：E = 1+127 = 128 = (10000000)₂

    +     - 0(S)10000000(E)10100000000000000000000(F)

    +     - 0x40500000

    +   - 双精度表示：E = 1+1023 = 1024 = (10000000000)₂

    +     - 0x400A000000000000'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# IEEE754标准（四）


    +   - 边角情况（扩展可表示范围）


    | | 单精度 | | | | 双精度 | | | |

    | | 符号位 | 阶码 | 尾数 | 值 | 符号位 | 阶码 | 尾数 | 值 |

    | 正无限 | 0 | 255 | 0 | ∞ | 0 | 2047 | 0 | ∞ |

    | 负无限 | 1 | 255 | 0 | -∞ | 1 | 2047 | 0 | -∞ |

    | Quiet NaN | 0 或 1 | 255 | 高位=0 | NaN | 0 或 1 | 2047 | 高位=0 | NaN |

    | Signaling NaN | 0 或 1 | 255 | 高位=1 | NaN | 0 或 1 | 2047 | 高位=1 | NaN |

    | 正规格化非 0 | 0 | 0<e<255 | f | 2^e-127(1.f) | 0 | 0<e<2047 | f | 2^e-1023(1.f)
    |

    | 负规格化非 0 | 1 | 0<e<255 | f | -2^e-127(1.f) | 1 | 0<e<2047 | f | -2^e-1023(1.f)
    |

    | 正非规格化非 0 | 0 | 0 | f!=0 | 2^e-126(0.f) | 0 | 0 | f!=0 | 2^e-1022(0.f) |

    | 负非规格化非 0 | 1 | 0 | f!=0 | -2^e-126(0.f) | 1 | 0 | f!=0 | -2^e-1022(0.f) |

    | 正 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | 负 0 | 1 | 0 | 0 | -0 | 1 | 0 | 0 | -0 |


    +   - 把 Singaling NaN 当作操作数引起例外，把 Quiet NaN 当作操作数结果也为 Quiet NaN，可以用尾数部分区分它们。


    +   - 非规格化数用于阶码下溢的情况，填补最小数和 0 之间的“空隙”。'
  merge: -1
  img_proc: true
