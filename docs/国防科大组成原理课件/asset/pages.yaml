- pgno: 629
  md: '# 写命中时采取的策略


    +   - 写穿透（Write Through）

    +     - 写Cache的同时写内存

    +     - 内存里的数据永远是最新的，Cache替换时直接扔掉

    +     - Cache块管理简单，只需有效位


    +   - 写回（Write-back）

    +     - 只写Cache不写内存

    +     - 替换时要把Cache块写回内存

    +     - Cache块状态复杂一些，需要有效位和脏位


    +   - 写回/写穿透的使用

    +     - L1到L2用写穿透的多，L2较快

    +     - L2到内存用写回的多，内存太慢了

    +     - 龙芯2号两级都采用写回策略'
  merge: -1
  img_proc: true
- pgno: 630
  md: '# 写失效时采取的策略


    +   - 写分配（Write Allocate）

    +     - 先把失效块读到Cache，再在Cache中写

    +     - 一般用在写命中时采用写回策略的Cache中

    +   - 写不分配（Write Non-allocate）

    +     - 写Cache失效时直接写进内存

    +     - 一般用在写命中时采用写穿透的Cache中'
  merge: -1
  img_proc: true
