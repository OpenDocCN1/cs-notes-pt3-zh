  md: '# 集体通信


    +   • 并行程序中经常需要一些进程组间的集体通信（Collective Communication）

    +   • 路障（MPI_BARRIER）：同步所有进程；

    +   • 广播（MPI_BCAST）：从一个进程发送一条数据给所有进程；

    +   • 收集（MPI_GATHER）：从所有进程收集数据到一个进程；

    +   • 散播（Scatter）：从一个进程散发多条数据给所有进程；

    +   • 归约（MPI_REDUCE、MPI_ALLREDUCE）：包括求和、求积等。'
