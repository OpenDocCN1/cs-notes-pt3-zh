  md: '# 同步与通讯


    +   - 现代操作系统的关键特性：多任务

    +   - 当同一块数据被多段代码并发访问时需要同步

    +   - 并发访问可能来自

    +     - 多处理器系统中同时运行的多个代码块

    +     - 由于中断引起并发代码段

    +     - 由于线程调度引起的多线程并发执行

    +   - 多数代码隐含原子性实现的假定

    +     - 读一改一写

    +     - 队列插入、删除

    +     - 红黑树插入、删除'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 基于锁的同步


    +   - 将可能并发访问同一块数据的代码定义为临界区

    +   - 进入临界区前先申请锁（并加锁）

    +   - 申请失败者被阻塞

    +   - 持有锁的线程离开临界区后释放锁

    +   - 锁的类型

    +     - 自旋锁：循环等待直至得到锁

    +     - 互斥锁：如果加锁失败则休眠等待

    +     - 读写锁：允许有多个读或者一个写


    ```

    selfspin:

    ll      t0, lock

    bnez    t0, selfspin

    nop

    li      t1, 0x1

    sc      t1, lock

    beqz    t1, selfspin

    nop

    <Critical section>

    sw      zero, lock

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 非阻塞的同步


    +   - 锁的问题

    +     - 若持有锁的线程死亡、阻塞或死循环

    +     - 加解锁的代价

    +     - 并发度受限，细粒度锁设计难度大

    +   - 事务内存的思想

    +     - 把临界区代码定义为事务

    +     - 尝试性地执行事务代码

    +     - 执行过程中动态检测冲突

    +     - 根据冲突检测结果提交或取消事务

    +     - *LL/SC可以理解为大小仅为一个word的事务操作*'
  merge: -1
