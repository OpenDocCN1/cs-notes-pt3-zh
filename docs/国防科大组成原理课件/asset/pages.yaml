- pgno: 254
  md: '# TLB


    +   - **TLB实际上是操作系统中页表的Cache**

    +     - TLB主要负责完成用户空间到物理空间的转化

    +     - 一般与Cache访问同时进行

    +     - TLB内容：虚地址（Cache的Tag），物理地址（Cache的Data），保护位（Cache的状态）

    +   - **TLB失效处理**

    +     - TLB失效时需要把相应页表内容从内存取到TLB

    +     - TLB失效时硬件（如X86的page walker）和软件（如MIPS的特殊例外）来填充TLB'
