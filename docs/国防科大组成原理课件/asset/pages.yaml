  md: "# OpenMP程序举例-积分法计算π值\n\n```\n#include <stdio.h>\n#include <math.h>\nint main(){\n\
    \    int i;\n    int num_steps=1000000;\n    double x,pi,step,sum=0.0;\n    step\
    \ = 1.0/(double) num_steps;\n    for(i=0;i<num_steps;i++)\n    { x=(i+0.5)*step;\n\
    \        sum = sum+4.0/(1.0+x*x);\n    }\n    pi = step*sum;\n    printf(\"pi\
    \ %1f\\n\", pi);\n    return 0;\n}\n```\n\n```\n#include <stdio.h>\n#include <omp.h>\n\
    int main(){\n    int i;\n    int num_steps=1000000;\n    double x,pi,step,sum=0.0;\n\
    \    step = 1.0/(double) num_steps;\n    #pragma omp parallel for private(i,x),reduction(+:sum)\n\
    \    for(i=0;i<num_steps;i++) {\n        x=(i+0.5)*step;\n        sum = sum+4.0/(1.0+x*x);\n\
    \    }\n    pi = step*sum;\n    printf(\"pi %1f\\n\", pi);\n    return 0;}\n```\n\
