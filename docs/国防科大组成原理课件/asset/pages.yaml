- pgno: 298
  md: '# MIPS ABI函数调用(n32)


    +   - 定点参数经扩展后放到a0-a7，超过8个的通过栈传递

    +   - 浮点参数通过浮点寄存器传递，定点+浮点共8个

    +   - 结构体视为双字序列，通过寄存器传递

    +   - 超过两个双字的返回值，用指针(a0)通过栈传递

    +   - 在栈中预留8个参数槽，对应8个参数，在必要的时候用于参数存储，其宽度固定为64位(n32)

    +   - 栈16字节对齐，指针增量为16的倍数'
