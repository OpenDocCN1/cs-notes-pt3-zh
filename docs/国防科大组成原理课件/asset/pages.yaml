    +     - 单片系统降低了系统设计灵活性，一般用于中低端设备和移动设备

    +   - 主要CPU厂商中，高端CPU采用两片方案，低端CPU采用单片方案

    +     - Intel的酷睿/至强系列

    +     - Intel的凌动系列


