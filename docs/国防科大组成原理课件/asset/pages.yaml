- pgno: 51
  md: '# （一）计算机的性能


    +   - 性能的最本质定义

    +     - 完成一个任务（如后天的天气预报）所需的时间

    +     - 以指令为基本单位


    CPUTime = Seconds / Program = Instructions / Program × Cycles / Instruction ×
    Seconds / Cycle


    | | Inst. Count | CPI | Clock Rate |

    |---|---|---|---|

    | Program | X |  |  |

    | Compiler | X | (X) |  |

    | ISA | X | X |  |

    | Organization |  | X | X |

    | Technology |  |  | X |'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 影响性能的因素


    +   - 算法影响最大

    +     - 如冒泡排序复杂度为 O(N*N)，快速排序复杂度为 O(NlogN)

    +   - 编译器影响

    +     - 一般有几倍的差距

    +   - 指令系统

    +     - 复杂指令如三角函数、FFT、AES等是否硬件实现

    +   - 微结构：IPC（Instructions per cycle）

    +     - 通过乱序执行、多发射、存储层次等提高IPC

    +   - 主频

    +     - 受工艺和微结构（流水线）的影响'
  merge: -1
  img_proc: true
