- pgno: 742
  md: '# 计算机系统的性能分析


    +   - 为什么要性能分析?

    +     - 设计阶段：预测系统性能是否达到指标

    +     - 系统选择：通过性能分析判断不同系统的优劣以选择最好系统

    +     - 系统使用：对现有系统进行性能调优

    +   - 性能分析方法

    +     - 分析：建立性能模型（如队列理论）进行理论分析

    +     - 模拟：在模拟器上运行测试程序

    +     - 测量：在真实系统上运行测试程序进行测试

    +   - 性能分析的复杂度

    +     - 什么是性能？（MIPS、MFLOPS、MBps、MHz、……）

    +     - 影响性能的因素很多（应用、算法、编译器、结构、工艺……）'
  merge: -1
  img_proc: true
- pgno: 743
  md: '# 什么是性能？


    +   - 一台机器的速度“快”，这个快怎么衡量？

    +   - 桌面计算机： CPU指挥GPU和桥片DMA干活

    +     - 对一个大文件进行压缩的时间要短

    +     - 软解码播放H.264格式文件更为流畅

    +   - Web服务器： CPU及桥片DMA干活

    +     - 每秒钟完成应答web请求数量大

    +     - 每秒钟完成的交易事物（transaction），吞吐率高

    +   - 高性能计算机： 主要是CPU自己干活

    +     - 完成一个大的并行任务的速度有多快

    +     - 高性能Linpack的实测双精度峰值'
  merge: -1
  img_proc: true
- pgno: 744
  md: '# 影响性能的因素


    +   - 应用对性能的影响最大

    +     - 如 “太湖之光” 运行 Office 不如通用处理器

    +     - 通用处理器图形计算不如 GPU

    +   - 算法影响很大

    +     - 如冒泡排序复杂度为 O(N*N)，快速排序复杂度为 O(NlogN)

    +   - 编译系统（GCC、JAVA、JS、QT 库等）影响

    +     - 一般有几倍的差距

    +   - 指令系统：复杂指令如三角函数、AES 等是否硬件实现

    +   - 微结构：IPC（Instructions per cycle）

    +     - 通过乱序执行、多发射、存储层次等提高 IPC

    +   - 主频：受工艺和微结构（流水线）的影响'
  merge: -1
  img_proc: true
