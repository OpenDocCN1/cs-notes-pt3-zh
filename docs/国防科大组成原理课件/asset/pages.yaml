- pgno: 653
  md: '# POSIX Threads（Pthread）标准


    +   - POSIX（Portable Operating System Interface）Threads：共享存储编程标准

    +     - 官方IEEE POSIX1003.1C_1995线程标准

    +     - 主要包含线程管理、线程调度、同步等原语

    +     - 体现为C语言的一套函数库


    ### pthreads中基本线程管理一览表


    | 功能 | 定义 |

    |---|---|

    | `int pthread_create(pthread_t *thread_id, pthread_attr_t *attr, (void *) (*myroutine)
    (void *), void *arg)` | 生成线程 |

    | `void pthread_exit(void *status)` | 退出线程 |

    | `int pthread_join(pthread_t thread,void ** status)` | 等待线程结束 |

    | `pthread_t pthread_self(void)` | 获得调用线程ID |'
  merge: -1
  img_proc: true
- pgno: 654
  md: '# POSIX Threads标准（Cont.）


    +   - 线程调度及同步原语


    | 定义 | 功能 |

    |---|---|

    | `int pthread_yield(void)` | 调用者放弃处理器给其它线程 |

    | `int pthread_cancel(pthread_t thread)` | 发终止信号给指定的线程 |

    | `pthread_mutex_init(...)` | 生成新的互斥变量 |

    | `pthread_mutex_destroy(...)` | 销毁互斥变量 |

    | `pthread_mutex_lock(...)` | 锁住互斥变量 |

    | `pthread_mutex_trylock(...)` | 尝试锁住互斥变量 |

    | `pthread_mutex_unlock(...)` | 解锁互斥变量 |

    | `pthread_cond_init(...)` | 生成新的条件变量 |

    | `pthread_cond_destroy(...)` | 销毁条件变量 |

    | `pthread_cond_wait(...)` | 等待（阻塞）条件变量 |

    | `pthread_cond_timedwait(...)` | 等待条件变量直至到达时限 |

    | `pthread_cond_signal(...)` | 投递一个事件，解锁一个等待进程 |

    | `pthread_cond_broadcast(...)` | 投递一个事件，解锁所有等待进程 |'
  merge: -1
