- pgno: 193
  md: '# PA-RISC的Nullification


    +   根据当前指令执行结果确定下一条指令是否执行


    +   所有的转移指令和多数算术指令可用


    +   如ADDB（Add and branch）指令在完成加法后，检查加法结果是否满足条件，如果不满足就转移。同时判断下一条指令（延迟槽）是否执行


    +   可以消除一些简单的转移指令


    ```

    if (a>b) s=a;

    else  s=b;

    ```


    | ADD | %r1, %r0, %r3 // r3 = r1(a) |

    | SUB,*> | %r1, %r2, %r0 // r1(a) - r2(b) |

    | ADD | %r2, %r0, %r3 // r3 = r2(b) |


    +   其它指令系统有条件移数指令如 “CMOV”


    +   后来演化为IA64的谓词技术


    +   运算指令通过64个谓词寄存器决定结果是否保存'
