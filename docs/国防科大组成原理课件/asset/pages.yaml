- pgno: 118
  md: '# 指令集的演变 – CISC


    +   - 早期的CPU都采用CISC结构

    +     - IBM System360、Intel 8080/8086、Motorola 68000

    +     - 一方面，昂贵的软件系统要求兼容性

    +     - 另一方面，指令集的不完善要求新增指令

    +   - 兼容性 vs. 历史包袱

    +     - Intel的辉煌和包袱

    +     - 指令集膨胀导致实现复杂，降低常用指令的运行效率

    +   - 简单指令有利于高效实现

    +     - 程序中80%的指令只占指令集的20%

    +     - X86指令通过内部译码后的微操作类似于RISC'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 指令集的演变 - RISC


    +   - 丢掉包袱，轻装上阵

    +   - 核心思路：简化

    +     - 简化指令功能：执行时间短

    +     - 简化指令编码：译码简单

    +     - 简化访存类型：访存和运算分开

    +   - Power、MIPS、ARM、SPARC、（Alpha。。）

    +   - 现代指令集对CISC和RISC的融合

    +     - 核心流水线采用RISC

    +     - 包含复杂功能的宏指令'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 指令集的演变 - VLIW


    +   - 指令级并行（Instruction Level Parallelism，简称ILP）的极端

    +     - 同一个指令字中的多条指令不存在相关

    +     - 对编译器提出了更多的要求

    +   - TRACE、Itanium（IA-64）

    +   - 应用在早期的GPU中，GPGPU发展后遭弃用

    +     - AMD转向了SIMT的GCN架构'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 指令集的演变 – 示例


    # RISC

    (MIPS)


    | bits | 6 | 5 | 5 | 5 | 5 | 6 |

    |---|---|---|---|---|---|---|

    | R-type | OP | RS1 | RS2 | RD | SA | OPX |

    | I-type | OP | RS1 | RS2 |  | Immediate |  |

    | J-type | OP |  | Target |  |  |  |


    # CISC

    (X86)


    | bytes | 1 | 1 | 1 | 1 |

    |---|---|---|---|---|

    | PREFIX | Instruction Prefix | Addr-size Prefix | Op-size Prefix | Segment Override
    |


    | bytes | 1 or 2 | 0 or 1 | 0 or 1 | 0,1,2 or 4 | 0,1,2 or 4 |

    |---|---|---|---|---|---|

    | GENERAL | OpCode | Mod-R/M | SIB | Displacement | Immediate |


    # VLIW

    (IA-64)


    | bits | 41 | 41 | 41 | 5 |

    |---|---|---|---|---|

    | BUNDLE | INST 2 | INST 1 | INST 0 | Template |


    | bits | 14 | 7 | 7 | 7 | 6 |

    |---|---|---|---|---|---|

    | INST | Op | Reg 1 | Reg2 | Reg3 | Predicate |'
  merge: -1
  img_proc: true
