- pgno: 129
  md: '# 核心态的 “特权”


    +   - 有些地方只有核心态能访问

    +     - 控制寄存器、TLB、Cache、IO空间、特定地址空间

    +     - 访问上述空间的指令在用户态运行时硬件发例外

    +   - 核心态和用户态的转换

    +     - 用户态下执行系统调用或发生例外时进入核心态

    +     - ERET从核心态回到用户态

    +   - 例如：翻一页PPT过程中

    +     - 硬件响应中断从用户态到核心态，操作系统调用PPT后回到用户态

    +     - PPT要调用通过系统调用多次进出核心态以通过IO操作完成翻页（读硬盘、显示等）'
