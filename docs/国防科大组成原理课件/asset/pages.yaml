- pgno: 6
  md: '# 大学计算机教育


    # 产业现实：国内庞大的IT产业建立在国外软硬件系统平台之上


    +   - 应用开发型人才充足，底层基础系统研发人才却极度匮乏。

    +   - JAVA程序员月薪3000元，JAVA虚拟机开发人员月薪3万也招不到。


    # 从“用”计算机到“造”计算机


    +   - 硬件（CPU）：计算机组成原理、计算机体系结构。

    +   - 软件（OS）：操作系统、编译原理。


    # 从“逻辑”思维能力到“系统”思维能力


    +   - 计算机系统具有很强的不可分割性，很难分解成一个个模块消化吸收（如人的大脑）。

    +   - 当前计算机专业系统课程的教学问题：课程独立脱节，缺乏系统实验平台。


    # 从“理论”到“实践”（M是思想、S是理论、T做样品、E做产品）


    +   - 高复杂系统只能在自主研发实践中演进出来：时间是必要因素，试错是必要过程

    +   - 实践是最好的课堂：只有动手实践，才能完成系统能力培养的螺旋式上升。

    +   - 信息技术教育需要重“E”（STEM），“创客”只能建立在大量实践基础上。'
  merge: -1
  img_proc: true
