- pgno: 811
  md: "# 从经验到方法\n\n+   - “如果曾经有那么一段时间，高性能处理器的结构完全由一个智者通过拍脑袋来决定，这段时间已经一去不复返了。现代处理器的结构是由一个队伍持续地改进和创新的结果，未来处理器的设计是受到性能建模的方法所指导的”\n\
    +   \n+     - *Pradip Bose*"
