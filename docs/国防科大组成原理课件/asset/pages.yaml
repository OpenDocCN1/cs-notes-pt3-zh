    FIGURE 2.20 Branch distances in terms of number of instructions between the target
    and the branch instruction. The most frequent branches in the integer programs
    are to targets that can be encoded in four to eight bits. This result tells us
    that short displacement fields often suffice for branches and that the designer
    can gain some encoding density by having a shorter instruction with a smaller
    branch displacement. These measurements were taken on a load-store computer (Alpha
    architecture) with all instructions aligned on word boundaries. An architecture
    that requires fewer instructions for the same program, such as a VAX, would have
    shorter branch distances. However, the number of bits needed for the displacement
    may increase if the computer has variable length instructions to be aligned on
    any byte boundary. Exercise 2.1 shows the accumulative distribution of this branch
    displacement data (see Figure 2.42 on page 173). The programs and computer used
