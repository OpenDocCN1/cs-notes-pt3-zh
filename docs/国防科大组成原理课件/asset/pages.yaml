- pgno: 657
  md: "# OpenMP的并行执行模型\n\n+   - 一个OpenMP进程由多个线程组成，使用fork-join并行模型\n+     - OpenMP程序始于一个主线程（Master\
    \ Thread），主线程串行执行，遇到一个并行域（parallel region）开始并行执行。\n+     - **Fork：**主线程创建一队并行线程，并行域的代码在不同线程中并行执行\n\
    +     - **Join：**当主线程在并行域中执行完后，它们或被同步或被中断，所计算的结果会被主线程收集，最后只有主线程在执行\n\n```\n```c\n\
    #include <omp.h>\nmain(){\n    int var1,var2,var3;\n    ......\n    #pragma omp\
    \ parallel private(var1,var2) shared(var3)\n    { ...... }\n}\n```\n```\n\nOpenMP程序的并行结构"
  merge: -1
  img_proc: true
