- pgno: 140
  md: '# 指令集类型的发展


    +   - 早期的计算机多用堆栈和累加器型指令

    +     - 出于降低硬件复杂度的考虑

    +     - 现在已经不用（Intel有点例外）


    +   - 1980年代后的机器主要是寄存器型

    +     - 访问寄存器比访问存储器快,便于编译器使用和优化

    +     - 寄存器可以用来存放变量，减少访存次数

    +     - 寄存器间的相关容易判断，易于实现流水线、多发射、乱序执行等

    +     - X86通过把复杂指令翻译成类似于RISC的内部操作并使用RISC指令流水线技术提高性能，X86的向量指令也是寄存器型


    +   - RISC的不断复杂化

    +     - 内存离寄存器越来越远，以寄存器为中心的结构增加了不必要的数据搬运开销（如memcpy）

    +     - 向量指令、超越函数指令、Transacitonal memory等'
  merge: -1
  img_proc: true
