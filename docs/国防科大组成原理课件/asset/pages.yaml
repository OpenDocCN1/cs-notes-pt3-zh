- pgno: 715
  md: '# 片上网络—路由器（Cont.）


    +   - 数据包传输的流水级

    +     - 数据包切分为： head flit（flow unit,流控单元）， body flit

    +     - 路由器的四个流水级： 路由计算（Routing Computation, RC）、虚通道分配（Virtual-channel allocation,
    VA）、交叉开关分配（switch allocation, SA）、交叉开关上传输（switch traversal, ST）

    +     - head flit必须依次经历RC、VA、SA、ST四个流水级；body flit依次经历SA、ST流水级


    | Cycle | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

    |---|---|---|---|---|---|---|---|---|

    | Head flit | RC | VA | SA | ST |  |  |  |  |

    | Body flit |  |  |  | SA | ST |  |  |  |

    | Body flit |  |  |  |  | SA | ST |  |  |

    | Body flit |  |  |  |  |  | SA | ST |  |

    | Body flit |  |  |  |  |  |  | SA | ST |'
  merge: -1
