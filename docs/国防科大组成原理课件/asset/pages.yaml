- pgno: 109
  md: '# 指令系统的设计原则


    +   - 指令系统在计算机系统中的位置

    +     - 硬件和软件的界面

    +     - 反映了结构设计者对计算机系统的认识

    +   - 设计原则

    +     - 兼容性：对软件的包容性，长时间保持不变，如X86

    +     - 通用性：对软件的易用性，编译器和程序员觉得好用

    +     - 高效性：对硬件的易用性，便于CPU设计优化和不同性能的实现

    +     - 安全性：对软硬件安全的支持，支持通用操作系统，考虑不同的安全要求'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 影响指令系统设计的因素


    +   - 工艺技术

    +     - 早期的硬件昂贵，简化硬件是指令系统设计的主要因素

    +     - 现在如何发挥存储层次的效率，如何利用芯片面积

    +   - 系统结构

    +     - 增加指令功能还是提高主频？

    +     - 并行性： SIMD、向量、多发射（兼容性好）

    +   - 操作系统

    +     - 多进程支持、虚地址空间、安全等级、虚拟机等

    +   - 编译技术与程序设计语言

    +     - 指令的表达能力

    +   - 应用程序

    +     - 应用适应性、兼容性等'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 工艺技术对指令系统的影响


    +   - 早期的指令系统设计主要考虑如何减少硬件

    +   - 后来集成度的提高使得系统结构的优化成为可能

    +     - TLB、从32位到64位、SIMD媒体运算

    +   - 由于CPU与存储器的速度差距，指令系统应能较好地利用存储层次，如通过并行或流水容忍延迟

    +     - Cache管理指令、预取指令

    +   - 随着工艺的进一步发展，由于主频极限和功耗问题引起的多核结构需要特殊指令支持

    +     - 多线程管理和同步'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 系统结构对指令系统的影 响


    +   - 指令系统本身是系统结构发展的结果

    +     - 从16位、到32位、到64位

    +     - SIMD指令、从单核到多核等

    +   - 指令系统的兼容性要求与系统结构发展的矛盾关系

    +     - 尽量不改变指令系统的前提下提高性能，如流水、多发射等

    +     - 尽量保持兼容，如Intel的做法

    +   - 增加指令功能还是提高主频

    +     - RISC vs. CISC vs. VLIW

    +   - 指令中如何体现并行性？

    +     - SIMD、多线程。。。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 操作系统对指令系统的影响


    +   - 操作系统专用的核心态指令和运行环境

    +   - 多进程和虚空间

    +     - 页表与TLB的关系

    +     - 页保护：读写权限

    +   - 系统安全等级

    +     - 核心态和用户态管理

    +   - 异常和中断的处理

    +     - 异常处理入口、ERET指令等

    +   - 访存和访问I/O的区别

    +   - 虚拟机：支持多操作系统的快速切换'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 编译技术对指令系统的影响


    +   - 指令是编译器的工作结果

    +     - 早期的指令系统主要考虑如何便于编程

    +     - 后期（如RISC）兼顾便于编程和实现效率

    +   - 指令功能

    +     - 只有简单指令，甚至乘法都由加法和移位来实现

    +     - 具有复杂指令，如除法、开方

    +     - 更复杂的函数由库函数实现

    +   - 寄存器和存储器分配

    +     - 堆栈存放局部变量，全局数据区存放静态数据，堆存放动态数据

    +     - 为有效使用graph coloring启发式算法，至少需要16个通用寄存器

    +   - 简单规整，提高编译效率

    +     - 正交性，如所有访存指令都可用所有寻址方式

    +     - 简化编译器trade-offs，如允许编译时确定常量，只提供基本的通用操作（less is more）等'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 应用对指令系统的影响


    +   - 指令系统归根到底是为应用设计的

    +     - 指令系统随着应用的发展而发展

    +     - 科学和工程技术、事务处理、网络和媒体处理等应用在指令系统上都有相应的体现

    +   - 应用要求指令系统保持兼容

    +     - 更新计算机时，兼容老的应用'
  merge: -1
  img_proc: true
