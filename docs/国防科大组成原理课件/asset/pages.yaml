- pgno: 812
  md: '# 结构的选取是复杂的过程


    +   - 系统设计的步骤:

    +     - 理解和分析机器中要执行的应用程序或工作负载的特性

    +     - 提出创新性的可选设计方案

    +     - 对所提出的方案进行性能评估，选择最好的设计

    +   - 选择是一个复杂的过程

    +     - 存在大量的可选设计方案

    +     - 这些方案又和海量的各种工作负载交织在一起


    ![](img/0d16039e8c3308af077d6d25bb4413a8_812_0.png)'
  merge: -1
  img_proc: true
- pgno: 813
  md: '# 性能分析和评估的分类


    +   - 性能分析就是测量平台及微结构和软件及数据结构之间的交互行为

    +   - 性能建模

    +     - 基于分析和统计的建模：概率模型、队列模型、马科夫模型、Petri网模型

    +     - 基于模拟的建模：踪迹驱动模拟、执行驱动模拟、全系统模拟、事件驱动模拟、统计方法模拟

    +   - 性能测量

    +     - 片上的硬件监测、片外的硬件监测、软件监测、微码插桩'
  merge: -1
