- pgno: 306
  md: '# 以网络收包为例—中断触发


    +   - 网卡

    +     - 收到一个网络包，根据接收描述符的指示，DMA写内存

    +     - 接收描述符中有中断位，在更新完描述符状态后发出中断

    +   - 中断控制器

    +     - 收到中断信号，存到状态寄存器中

    +     - 根据中断使能情况，往处理器传递中断信号

    +   - 处理器

    +     - 到达中断输入引脚，送到CP0_STATUS.IP域

    +     - 根据MASK、IE以及EXL/ERL，确定是否处理该中断

    +     - 如是，则将某条指令带上外部中断的信息，在提交时触发异常

    +     - 保存PC到EPC，切换到EXL状态，跳到0x80000180'
  merge: -1
  img_proc: true
