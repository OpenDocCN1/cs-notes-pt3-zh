- pgno: 14
  md: '# 系列课程的特点


    +   - 一是系统性，体系是“系统的系统”，很难就体系结构本身讲体系结构，需要做到对体系结构、基础软件、电路和器件的融汇贯通。

    +   - 二是基础性，计算机体系结构千变万化，但几十年发展下来沉淀下来的原理性的东西不多，希望从体系结构快速发展的很多现象中找出一些内在的本质的东西。

    +   - 三是实践性，计算机体系结构是实践性很强的学科，要设计在“硅”上运行而不是在“纸”上运行的体系结构。因此课程作业和实验强调实践性。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 什么是计算机体系结构


    +   - 计算机体系结构（Computer Architecture）是描述计算机各组成部分及其相互关系的一组规则和方法，是程序员所看到的计算机属性。

    +   - 计算机体系结构主要研究内容包括指令系统结构（Instruction Set Architecture，简称ISA）和计算机组织结构（Computer
    Organization）。

    +   - 微体系结构（Micro-architecture）是微处理器的组织结构，并行体系结构是并行计算机的组织结构。

    +   - 冯诺依曼结构的存储程序和指令驱动执行原理是现代计算机体系结构的基础。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 计算机体系结构的表现方式


    +   - 计算机体系结构可以有不同层次和形式的表现方式。

    +   - 计算机体系结构通常用指令系统手册和结构框图来表示，结构框图中的方块表示计算机的功能模块，线条和箭头表示指令和数据在功能模块中的流动，结构框图可以不断分解一直到门级或晶体管级。

    +   - 计算机体系结构也可以用高级语言如C语言来表示，形成结构模拟器，用于性能评估和分析。

    +   - 用硬件描述语言（如Verilog）描述的体系结构可以通过电子设计自动化（Electronic Design Automation，简称EDA）工具进行功能验证和性能分析，转换成门级及晶体管级网表，并通过布局布线最终转换成版图，用于芯片制造。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 本课程主要内容


    +   - 第一部分：引言（第1章）

    +     - 体系结构研究内容、主要性能指标、发展趋势以及设计原则

    +   - 第二部分：作为软硬件界面的指令系统结构（第2-6章）

    +     - 建立高级语言（如C语言）与指令系统结构的关系

    +     - 指令系统总体、指令集结构、异常与中断、存储管理、软硬件协同

    +   - 第三部分：CPU、GPU、南北桥协同的硬件结构（7-9章）

    +     - 冯诺依曼结构的具体体现

    +     - 搞清楚计算机内部包括CPU、GPU、内存、IO之间是如何协同完成软件规定的各种操作的

    +     - 计算机硬件结构、计算机接口及总线、计算机系统上电启动过程'
