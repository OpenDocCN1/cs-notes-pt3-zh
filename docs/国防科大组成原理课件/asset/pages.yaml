- pgno: 390
  md: '# 内存总线——协议层


    +   • 读操作


    ![](img/0d16039e8c3308af077d6d25bb4413a8_390_0.png)


    在当前行已被激活的情况下，读命令在T0时刻发出，经过5个周期，在T5时刻内存芯片开始通过DQ信号返回读数据。内存芯片在连续4个周期内返回数据，由于DDR内存使用双沿采样，因此一共返回8位数据。内存在返回数据的同时也驱动DQS信号，DQS信号和DQ信号是完全同步的，内存控制器使用该信号去采样DQ从而捕获DQ的值。DQS信号有一个preamble，供内存控制器过滤出有效时钟。'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# 内存总线——协议层


    +   - 写操作


    ![](img/0d16039e8c3308af077d6d25bb4413a8_391_0.png)


    DDR3 SDRAM写操作时序


    在当前行已被激活的情况下，写命令在T0时刻发出，经过5个时钟周期，内存控制器开始输出写数据，同时输出DQS。数据以burst方式传输，在BL=8的时候持续4个周期。DQ和DQS的时序是中心对齐的，DQS的上升下降沿对应数据的中心。写DQS同样也有一个preamble。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# 内存总线——协议层


    +   - 激活、读写、预充电时序


    Bank activate command cycle: tRCD = 3, AL = 2, tRP = 3, tRRD = 2, tCCD = 2


    tRCD：激活到读写延迟； AL：提前发出读写操作（内部开始的时间是一样的）； tRP：预充电到下次激活的延迟； tRRD：两个激活（针对不同bank）的延迟；
    tCCD：读写到读写（对不同bank）的延迟； tRC：对同一bank两次激活的延迟；'
  merge: -1
  img_proc: true
