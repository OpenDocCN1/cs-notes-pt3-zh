  md: '# 指令系统为什么重要


    +   - 指令系统是计算机产业的枢纽，控制产业生态

    +     - 如成千上万家企业参与到X86生态（生态是什么？）

    +     - 技术上比X86做得好的指令系统都死得差不多了

