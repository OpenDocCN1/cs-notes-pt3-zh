- pgno: 702
  md: '# ESI协议的状态


    +   - **ESI 是指Cache 行的三种一致性状态：**

    +     - **E（Exclusive，独占）**：表明对应Cache 行被当前处理器核独占，当前处理器核可以随意读写，其他处理器核如果想读写这个cache
    行需要请求占有这个cache 块的处理器核释放该Cache 行

    +     - **S（Shared，共享）**：表明当前Cache 行可能被多个处理器核共享，只能读取，不能写入

    +     - **I（Invalid，无效）**：表明当前Cache 块是无效的


