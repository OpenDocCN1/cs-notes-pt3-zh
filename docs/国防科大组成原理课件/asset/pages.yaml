- pgno: 661
  md: "# OpenMP的制导-组合并行共享任务结构\n\n+   - **parallel for编译制导语句：** 该语句表明一个并行域包含一个单独的for语句。格式如下：\n\
    +   \n+   ```\n+   #pragma omp parallel for [if(scalar_logical_expression) |default(shared|none)\
    \ |schedule(type[, chunk]) shared(list) |private(list) |firstprivate(list) |lastprivate(list)\
    \ |reduction(operator:list) |copyin(list) ] newline\n+   ```\n\n+   - **parallel\
    \ sections编译制导语句：** 该语句表明一个并行域包含单独的一个sections语句语句。格式如下：\n+   \n+   ```\n+   #pragma\
    \ omp parallel sections [default(shared|none) | shared(list) |private(list) |firstprivate(list)\
    \ |lastprivate(list) |reduction(operator:list) |copyin(list) |ordered ] newline\n\
    +   ```"
  merge: -1
