- pgno: 65
  md: '# 如何控制集成电路成本


    +   - 生产流程决定晶圆的成本、成品率以及单位面积的残次品数目，设计者唯一能够控制的是晶片的面积。（晶片成本增长的速度和晶片面积增长速度的4次方成正比关系）

    +   - 通过晶片所包含的功能和I/O管脚数目来控制晶片的大小

    +   - 通过“冗余”设计提高成品率，如片内RAM的冗余设计

    +   - 控制封装、测试的成本

    +   - 对于低产量（少于100万）的产品，掩模成本也是不可忽视的。采用可配置逻辑或选取一些门阵列来降低掩模成本。'
