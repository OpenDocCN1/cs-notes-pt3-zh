    | 换行符。表明这条制导语句结束 |

    | 对所有的OpenMP语句都需要这样的前缀 | 在制导指令前缀和子句之间必须有一个正确的OpenMP制导指令 | 子句。在没有其他约束条件下，子句可以无序，也可以任意地选择。这一部分也可以没有
