- pgno: 278
  md: '# TLB相关性能数据


    +   • TLB miss处理的时间可以占到高达40%的运行时间，

    +   占40~90%的内核运行时间


    +   • SPEC2000里大约1/4的程序有比较显著的TLB miss


    +   • 目前多数处理器的TLB是全相连的32-128项，如果每项4k，能映射的空间只有几百K，越来越难满足现代程序的需求'
