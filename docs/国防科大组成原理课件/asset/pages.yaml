- pgno: 805
  md: '# 3A2000性能分析小结


    +   - **3A2000性能**

    +     - 访存延迟偏大，访存带宽不错

    +     - 转移猜测有待改进

    +     - 定点功能部件并发操作能力稍弱

    +   - **3A3000的有限改进**

    +     - 定点发射队列从16项增加到32项

    +     - LLC从4MB增加到8MB

    +     - 内存频率随CPU频率线性提高（从500MHz提高到750MHz）

    +   - **3A4000的进一步改进**

    +     - 增加两个定点部件，增加256位向量

    +     - 大幅降低访存延迟，提高转移猜测命中率'
  merge: -1
  img_proc: true
