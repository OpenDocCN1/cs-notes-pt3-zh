- pgno: 374
  md: '# AXI关键信号


    +   - **ID: 支持读写乱序**

    +     - 每个事务都有ID标签(ARID/RID/AWID/WID/BID)

    +     - 同ID的事务必须按序

    +     - 不同ID的事务可以乱序

    +   - **BURST/LEN/SIZE: 突发传输控制**

    +     - 突发传输类型: FIXED, INCR, WRAP

    +     - 突发传输长度: 1~16

    +     - 突发传输单位: 1,2,4~BW

    +   - **WSTRB: 写掩码**

    +     - 为高的位对应的字节写有效

    +   - **RESP: 读/写响应状态**'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# AXI关键信号


    +   - ARLOCK/AWLOCK: 原子性操作

    +     - 00: 普通

    +     - 01: 独占

    +       - 独占地对某个地址先读后写，若期间无其它主设备写，则成功写入，否则失败，通过RESP返回状态。类似LL/SC

    +     - 10: 加锁

    +       - 从第一个加锁事务开始，到第一个普通事务结束

    +       - 将所访问的从设备区域加锁，阻止其它主设备访问

    +   - ARPROT/AWPROT: 访问保护

    +     - [0]: 普通/特权

    +     - [1]: 安全/非安全

    +     - [2]: 数据/指令'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# AXI关键信号


    +   - **ARCACHE/AWCACHE: 缓存控制**

    +     - [0]: 可写缓冲，未到达目的即回响应

    +     - [1]: 可缓存，cached/uncached，读预取，写合并

    +     - [2]: 读分配，如果读发生缓存缺失则分配一个缓存块

    +     - [3]: 写分配，如果写发生缓存缺失则分配一个缓存块'
  merge: -1
  img_proc: true
