- pgno: 586
  md: '# 指令相关的概念


    +   - 在流水线中，如果某指令的某个阶段必须等到它前面另一条指令的某个阶段后才能开始，则这两条指令存在相关。  - 数据相关：后面的指令使用前面指令的结果  -
    例如后面指令的源寄存器是前面指令的目的寄存器  - 控制相关：与PC有关的相关  - 例如每条指令取指用到PC，而转移指令修改PC  - 结构相关：资源冲突  -
    例如多条指令同时使用同一个功能部件 - 相关的指令要隔开足够远，否则后面的指令就必须等待，这造成了流水线阻塞'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# 控制相关


    +   - 跳转转移指令与取指PC的相关

    +     - 转移指令的跳转目标在执行流水级计算，影响后面2拍的指令

    +     - 转移指令延迟槽指令不受转移跳转与否影响，可以正常取指

    +     - 但是延迟槽下一条指令无法在第3拍完成取指


    | 时钟周期数 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---|

    | Jr $1 | PC (取指) | R1 (译码) | R2 (执行) | R3 (访存) | R4 (写回) |  |  |

    | Add $2, $1, $1 |  | PC (取指) | R1 (译码) | R2 (执行) | R3 (访存) | R4 (写回) |  |

    | Add $7, $8, $9 |  |  | PC (取指) | R1 (译码) | R2 (执行) | R3 (访存) | R4 (写回) |'
  merge: -1
