- pgno: 425
  md: '# PCI协议下的工作流程


    +   - 上世纪九十年代提出，软件结构被PCIE和HT等继承

    +     - 配置空间、IO空间、Memory空间

    +   - 通过配置空间探测总线设备

    +     - 配置空间大部分情况是对设备的属性进行刻画

    +     - 在完成设备探测之后基本不再使用配置空间

    +   - 对总线上的各个设备所需的地址空间进行分配

    +     - IO、Memory空间是真正使用设备功能时的地址空间

    +     - 对于IO和内存统一编址的CPU，两者区别不大

    +   - 使用分配好的空间对各个设备进行控制

    +     - 主要是驱动程序加载

    +   - 特点：

    +     - 总线设备发生变化时无需修改软件

    +     - 同一总线支持多个相同设备不会导致冲突'
