- pgno: 601
  md: '# 影响流水线效率的因素


    +   - 流水线效率的衡量指标：CPI（每条指令时钟周期数）或 IPC（每时钟周期指令数）

    +     - 程序运行时间 = 程序指令数 × CPI

    +     - 各类相关引发的阻塞使得实际CPI远高于理想状态

    +     - Pipeline CPI=Ideal pipeline CPI + **Structural stalls** + **RAW stalls**
    + **WAR stalls** + **WAW stalls** + **Control stalls**

    +   - 四发射处理器理想CPI值为0.25，实际在0.5~1之间'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# 提高流水线效率的技术


    | 技术 | 优化方向 |

    | --- | --- |

    | 多发射数据通路 | Idea Pipeline CPI |

    | 动态调度 | RAW、WAW、WAR stalls |

    | 转移猜测 | Control Stalls |

    | 高速缓存 | RAW stalls involving memory |'
  merge: -1
