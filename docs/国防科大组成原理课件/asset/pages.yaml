- pgno: 422
  md: "# 内存控制器配置代码\n\n+   - 将预先定义好的值写入内存控制器的相应寄存器中\n+   - 内存控制器将自动对内存进行初始化配置\n+  \
    \   - 主要设置延迟、匹配阻抗等\n+   - 初始配置之后，会再对内存信号进行训练\n\n```\nddr2_config:\n    caddiu\
    \    a2, a2, s0\n    dli       t1, DDR_PARAM_NUM\n    caddiu    v0, c8, 0x0\n\
    1:\n    ld        a1, 0x0(a2)\n    sd        a1, 0x0(v0)\n    caddiu    t1, t1,\
    \ -1\n    caddiu    a2, a2, 0x8\n    caddiu    v0, v0, 0x8\n    bnez      t1,\
    \ 1b\n    nop\n```\n\na2为调用该程序时传入的参数，与s0之间用于表示初始化参数在FLASH中的基地址\nt1用于表示内存参数的个数\n\
    t8为调用该程序时传入的参数，用于表示内存控制器的寄存器基地址\n初始化的过程就是从FLASH中取数再写入内存控制器中的寄存器的过程"
  merge: -1
