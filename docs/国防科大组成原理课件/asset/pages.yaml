  md: '# 通用多核处理器的片上Cache结构


    +   - 片内Cache种类

    +     - 私有Cache：处理器核包含私有Cache，速度快、失效率高

    +     - 片内共享Cache：多个处理器核共享Cache，速度稍慢，失效率低

    +     - 片间共享Cache：多片共享Cache，速度慢，失效率高

    +   - 片内共享LLC，片间共享内存应是一种典型结构


