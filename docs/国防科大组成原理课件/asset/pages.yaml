    +     - 操作系统(OS)：独立客户物理地址空间、控制寄存器，可管理应用程序的地址映射，转换到客户物理地址

    +     - 虚拟机(Hypervisor)：可管理客户系统的物理地址映射，转换到最终的根物理地址


