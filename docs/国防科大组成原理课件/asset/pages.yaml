  md: '# SPARC特色—寄存器窗口


    +   - 2-32个寄存器窗口，用于不同过程

    +     - 8个全局寄存器用于存放全局变量

    +     - 24个局部寄存器

    +       - 8个输入参数，8个局部变量，8个输出参数

    +     - 过程调用和退出不用把现场保留到存储器


    +   - SAVE和RESTORE指令

    +     - SAVE：功能同ADD，源寄存器来自调用过程(caller)，目标寄存器来自被调用过程(callee)，该指令自动修改寄存器窗口指针CWP--

    +     - RESTORE：功能同ADD，源寄存器来自被调用过程(callee)，目标寄存器来自调用过程(caller)，该指令自动修改寄存器窗口指针CWP++


    +   - AMD AM29000的局部寄存器窗口大小可变，全局寄存器64个


