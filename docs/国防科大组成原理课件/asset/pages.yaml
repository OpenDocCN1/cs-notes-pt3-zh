- pgno: 294
  md: '# MIPS ABI


    +   - **o32**

    +     - 传统的MIPS约定，仍广泛用于嵌入式工具链和32位Linux中。

    +   - **n64**

    +     - 在64位处理器编程使用的新的正式ABI，改变了指针和long型整数的宽度，并改变了寄存器使用的约定和参数传递的方式。

    +   - **n32**

    +     - 在64位处理器上执行的32位程序，与n64的区别在于指针和long型整数的宽度为32位。与o32相比，可以使用64位寄存器，浮点寄存器数量从16个变为32个'
