- pgno: 165
  md: '# 转移条件的的表达


    +   • 根据条件位判断转移

    +   • 直接比较寄存器内容转移


    | Name | Examples | How condition is tested | Advantages | Disadvantages |

    |------|----------|-------------------------|-----------|---------------|

    | Condition code (CC) | 80x86, ARM, PowerPC, SPARC, SuperH | Special bits are
    set by ALU operations, possibly under program control. | Sometimes condition code
    is set for free. | CC is extra state. Condition codes constrain the ordering of
    instructions since they pass information from one instruction to a branch. |

    | Condition register | Alpha, MIPS | Tests arbitrary register with the result
    of a comparison. | Simple. | Uses up a register. |

    | Compare and branch | PA-RISC, VAX | Compare is part of the branch. Often compare
    is limited to subset. | One instruction rather than two for a branch. | May be
    too much work per instruction for pipelined execution. |


    > FIGURE 2.21 The major methods for evaluating branch conditions, their advantages,
    and their disadvantages.


    Although condition codes can be set by ALU operations that are needed for other
    purposes, measurements on programs show that this rarely happens. The major implementation
    problems with condition codes arise when the condition code is set by a large
    or hazardously chosen subset of the instructions, rather than being controlled
    by a bit in the instruction. Computers with compare and branch often limit the
    set of compares and use a condition register for more complex compares. Often,
    different techniques are used for branches based on floating-point comparison
    versus those based on integer comparison. This dichotomy is reasonable since the
    number of branches that depend on floating-point comparisons is much smaller than
    the number depending on integer comparisons.'
  merge: -1
  img_proc: true
