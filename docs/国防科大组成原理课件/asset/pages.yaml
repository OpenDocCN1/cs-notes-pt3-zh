- pgno: 856
  md: '# 用Turando探索OLTP的宽发射设计空间


    +   - **结论：** 对于OLTP应用，与理想处理器配置相比

    +     - **class-order**发射引起15 to 32%的下降

    +       - **in-order**的策略还会下降多一些

    +     - 分支预测器引起15 to 26%的下降

    +     - **L1 cache(128K)**引起30 to 66%的下降

    +     - 发射宽度引起10 to 23%的下降

    +     - 超过8发射的回报率较低，主要是受到取指的影响


    | Issue policy | Width | Cache size | Branch prediction |

    |---|---|---|---|

    | Class-order | 4/4/6 | 64K, 64K, 2M | 8192 entry BHT, 4096 BTAC |

    | Out-of-order | 8/8/12 | 128K, 128K, 4M | Perfect |

    |  | 12/12/16 | 128K, 128K, Inf |  |

    |  |  | Inf, Inf, Inf |  |


    | Widths | Units | Ports | Queues | Physical registers |

    |---|---|---|---|---|

    |  | Fetch/Dispatch/Retire | FX/FP/IS/BR | Data and TLB | Issue/Retire/Buf | GPR/FPR/CCR/SPR
    |

    | 4/4/6 | 3/2/2/2 | 2 | 20(12)/128/24 | 80/80/32/64 |

    | 8/8/12 | 6/4/4/4 | 4 | 40/160/48 | 128/128/64/96 |

    | 12/12/16 | 8/4/4/4 | 6 | 60/160/72 | 128/128/64/96 |'
  merge: -1
