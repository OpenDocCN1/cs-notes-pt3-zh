- pgno: 91
  md: '# Amdahl定律


    +   - **Amdahl定律：关注短板**

    +   - 通过使用某种较快的执行方式所获得的性能的提高，受可使用这种较快执行方式的时间所占的百分比例的限制

    +   - 例如：浮点功能单元执行性能提高2倍；但是仅有10%的浮点指令，则加速比为Speedup<sub>overall</sub> = 1 ÷ 0.95
    = 1.053


    ExTime<sub>new</sub> = ExTime<sub>old</sub> × [(1 − Fraction<sub>enhanced</sub>)
    + Fraction<sub>enhanced</sub> / Speedup<sub>enhanced</sub>]


    Speedup<sub>overall</sub> = ExTime<sub>old</sub> / ExTime<sub>new</sub> = 1 /
    [(1 − Fraction<sub>enhanced</sub>) + Fraction<sub>enhanced</sub> / Speedup<sub>enhanced</sub>]'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# （二）开发局部性


    +   - 局部性是事物一个普遍存在的性质

    +     - 一个人认识宇宙的范围受限于光速和人的寿命

    +     - 一个人只能认识有限的人，其中天天打交道的熟悉的人更少

    +     - 局部性在计算机中普遍存在，是计算机性能优化的基础。


    +   - 计算机中的局部性事件

    +     - 指令局部性：指令顺序执行，循环体中的指令

    +     - 访存局部性：时间局部性和空间局部性

    +     - 转移局部性：同一条转移指令经常在同一个方向跳转

    +     - Cache、TLB、预取、转移猜测


    +   - 当结构设计基本平衡以后，优化性能要抓主要矛盾，重点改进最频繁发生事件的执行效率'
  merge: -1
