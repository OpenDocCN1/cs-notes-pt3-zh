- pgno: 446
  md: '# # 定点数的编码规则


    +   - 二进制可以表示正负号吗？


    +   - 约定数的长度（char=8bit, int=32bit等等）


    +   - 约定最左边为符号位，0为正，1为负


    +   - 原码：直接表示二进制


    +   - 将数去掉符号位，表示为二进制，对齐长度，补上符号位


    +   - Char长度下 19 = 00010011₂ -19= 10010011₂'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# 原码运算规则


    +   如何计算 19 + (-19) = 0 ？

    +       00010011

    +   + 10010011

    +   ----------

    +     10100110 (-38)  不对，0=00000000₂或10000000₂


    +   异号相加/同号相减时，要先决定符号位


    +   再使用绝对值减法算出低位


    00010010 (+18)

    +10010011 (-19)

    符号为负，加数的绝对值大于被加数


    0010011 (| -19 |)

    - 0010010 (|18|)

    ----------

    1 0000001 (-1)


    很复杂'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# 补码


    +   - 补码的定义

    +     - $[X]_{补} = 2^n + X \pmod{2^n}$

    +   - 补码的简便算法

    +     - 正数的补码就是它的二进制值    此时$[X]_{补}=X$

    +     - 负数的补码，等于值按位取反再加1    此时$[X]_{补}=\overline{X}+1$

    +       （$\overline{X}$表示X的每个bit各自取反）

    +     - $[19]_{补}=00010011$

    +     - $[-19]_{补}=11101100+1=11101101$

    +   - 最高位还是符号位

    +   - 补码转换回原码的算法相同'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# 补码(二)


    +   - 补码的好处

    +     - [X+Y]补 = [X]补 + [Y]补

    +     - [X-Y]补 = [X]补 + [Y]补̅ + 1    [Y]补̅为[Y]补每个bit取反

    +     - 比原码能多表示一个数（-2ⁿ）

    +   - 以char类型（8bit）为例

    +     - [-19]补 + [19]补 = 00010011 + 11101101 = 0（超出8bit部分舍弃）

    +     - [19]补 - [-19]补 = 00010011 + 00010010 + 1 = 00100110（38）

    +     - [-2⁸]补 = 10000000，转回原码 = 负（01111111+1）= -2⁸'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# 溢出


    +   - 有符号表示，且规定长度，运算可能溢出

    +   - 只有同号相加或者异号相减会溢出

    +   - 原码和补码运算都会溢出


    [01000011]原 (67)      [10000011]补 (-125)

    +[01000011]原 (67)      +[10000011]补 (-125)

    10000110  (-6)          00000110  (6)


    +   - 溢出就是运算的算术结果超出了表示范围

    +   - 需要软件进行介入处理（发生异常）'
  merge: -1
  img_proc: true
