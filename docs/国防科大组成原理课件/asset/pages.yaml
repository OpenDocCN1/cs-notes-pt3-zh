- pgno: 604
  md: '# 动态调度思想


    +   - 基本思想

    +     - 把相关的解决尽量往后拖延（回忆一下前递技术）

    +     - 前面指令的等待不影响后面指令继续前进

    +   - 把译码分成两个阶段：发射和读操作数

    +     - 发射：指令译码，检查结构相关

    +     - 读操作数：如果操作数准备好就读数，否则等待（在哪儿等？）

    +     - 当一条指令在读操作数阶段等待时，后面指令的发射可以继续进行

    +   - 乱序执行的基本做法

    +     - 指令进入是有序的

    +     - 执行可以乱序，只要没有相关就可执行，多条指令同时执行

    +     - 结束也是有序的（怎么把乱序变成有序？）'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 解决WAW和WAR的办法


    +   - 假设只考虑RAW相关，可能发生如下执行次序

    +     - DIV发射，F1,F2都准备好

    +     - MUL1发射，F6没准备好，所以没有读数据

    +     - ADD发射，F3,F4都准备好

    +     - MUL2发射，F8没有准备好，所以没有读数据

    +     - ADD完成，F0写回

    +     - F6准备好，MUL1读数据

    +     - DIV完成，F0写回

    +     - F8准备好，MUL2读数据


    +   - DIV F0, F1, F2

    +   - MUL F5, F0, F6

    +   - ADD F0, F3, F4

    +   - MUL F7, F0, F8'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# 解决WAW和WAR的办法


    +   - 为了避免MUL1读回ADD写的F0值，MUL2读回DIV写的F0值

    +     - 最简单的做法是在MUL读F0之前ADD不能写回，在DIV写回之前ADD不能写回，正是记分板的办法

    +     - 在上述方法中，F0成为瓶颈，它必须保证DIV写、MUL1读、ADD写、MUL2读的串行次序，这是问题的本质所在

    +     - 真正相关：MUL1用DIV的结果，MUL2用ADD的结果，F0最终的结果为ADD的结果

    +     - MUL1用DIV的结果、MUL2用ADD结果不一定通过F0


    ```

    DIV F0, F1, F2

    MUL F5, F0, F6

    ADD F0, F3, F4

    MUL F7, F0, F8

    ```'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# 解决WAW和WAR的办法


    +   - 为了避免MUL1读ADD写的F0值，MUL2读DIV写的F0值

    +     - 也可以在MUL1的输入端指定只接收DIV的输出值，在MUL2的输入端指定只接收ADD的输出值，相当于DIV直接把结果写到MUL1的输入端，ADD直接把结果写到MUL2的输入端。（记得Forward技术吗？）

    +     - 要求：(1)DIV的输出连到MUL1的输入，ADD的输出连接到MUL2的输入；(2)MUL1和MUL2的输入端有寄存器，这些寄存器能够指定接收哪个部件的输出作为自己的值


    +   - 同样，为了避免F0的最终值为DIV所写的值

    +     - 可以在F0记录它当前接收哪个功能部件所写的值

    +     - 要求F0有一个标志


    ```

    DIV F0, F1, F2

    MUL F5, F0, F6

    ADD F0, F3, F4

    MUL F7, F0, F8

    ```'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# 解决WAW和WAR的办法


    +   - 上述解决办法要求

    +     - 每个功能部件的输入端有一些寄存器

    +     - 每个寄存器（包括功能部件输入端的寄存器以及通用寄存器）都记录一个功能部件号，指定它当前接收哪个功能部件的值

    +     - 每个功能部件的输出接到每个功能部件的输入

    +   - 有了上述功能，WAR和WAW相关不用阻塞

    +     - 寄存器重命名技术


    ```

    DIV F0, F1, F2

    MUL F5, F0, F6

    ADD F0, F3, F4

    MUL F7, F0, F8

    ```


    ```

    DIV RenFa, F1, F2

    MUL F5, RenFa, F6

    ADD (F0, RenFb), F3, F4

    MUL F7, RenFb, F8

    ```'
  merge: -1
  img_proc: true
- pgno: 609
  md: '# Tomasulo算法结构


    +   - 保留站内容

    +     - Busy: 忙位

    +     - Op: 操作码

    +     - Vj, Vk: 源操作数的值

    +     - Qj, Qk: 保存没有准备好的源操作数保留站号（0表示操作数已经准备好）

    +   - 寄存器增加一个域

    +     - 结果状态域: 空表示寄存器值可用，否则保存产生寄存器结果的保留站号

    +   - 结果总线

    +     - 除了送回结果值外，还要送回产生该结果的保留站号


    ![](img/0d16039e8c3308af077d6d25bb4413a8_609_0.png)'
  merge: -1
