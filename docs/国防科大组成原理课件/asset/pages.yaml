- pgno: 212
  md: '# 数据完整性问题


    +   - 存储器发生软错误，导致ECC或奇偶校验错误

    +   - 软错误：可恢复的电位翻转

    +     - 存储器或触发器都可能产生，但由于存储器的信息密度较高，更容易产生软错误

    +     - 通常来源于高能粒子冲击，如宇宙射线、核辐射。因此卫星中使用的芯片尤其要注意减少软错误的发生。

    +     - 减少软错误的方法：使用抗辐照的工艺（如SOI）；使用纠错机制（如ECC校验、三模冗余校验）'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 地址转换异常


    +   - 从虚地址到物理地址转换时，没有有效的TLB项

    +   - TLB（Translation Lookaside Buffer）是内存中页表在处理器中的缓存（局部性）

    +   - TLB异常

    +     - TLB refill

    +     - TLB invalid

    +     - TLB modify'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 系统调用和陷入


    +   - 软件故意产生的异常

    +   - 系统调用：操作系统为用户态程序访问核心态资源准备的接口

    +   - 陷入：软件预设的断点，如MIPS的TRAP指令、整数除零检查


    ```

    li      v0, ID

    syscall


    bnez    v0, 1f

    div     zero, v1, v0

    break   0x7

    1:


    teq     v0, $0, 0x7

    div     zero, v1, v0

    ```'
  merge: -1
