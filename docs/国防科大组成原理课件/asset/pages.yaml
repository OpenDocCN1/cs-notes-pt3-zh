- pgno: 751
  md: '# 计算机性能的本质定义


    +   - 计算机性能最本质的定义： “完成一个任务所需要的时间”

    +     - 计算机系统完成某个任务所花费的时间，称为执行时间，分为墙上时间和系统时间，在单任务情况下，两者基本一致

    +     - 完成一个任务的时间包括： CPU的执行时间、磁盘的访问、内存的访问、输入输出的活动和操作系统的开销等所有的时间

    +   - CPU的执行时间（可以运行 “time ./task” 来统计）

    +     - 不包括等待I/O的时间或者执行其他程序的时间

    +     - 可以进一步用户态CPU时间（执行用户程序、动态函数调用）和系统态CPU时间（系统调用、调度和中断、同步和通讯开销）'
  merge: -1
  img_proc: true
- pgno: 752
  md: '# CPU时间的组成


    +   - 指令数：算法、编译系统、ISA

    +   - IPC：微结构、ISA、编译器

    +   - 主频：微结构、工艺技术


    ```

    CPUTime = Seconds / Program = Instructions / Program × Cycles / Instruction ×
    Seconds / Cycle

    ```


    |  | Inst. Count | CPI | Clock Rate |

    |---|---|---|---|

    | Program | X |  |  |

    | Compiler | X | (X) |  |

    | ISA | X | X |  |

    | Organization |  | X | X |

    | Technology |  |  | X |'
  merge: -1
