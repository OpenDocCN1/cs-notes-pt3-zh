- pgno: 230
  md: '# 中断


    +   - 嵌入式系统中，CPU的主要作用之一就是处理中断

    +   - 两类中断：可屏蔽（INT）、不可屏蔽（NMI）

    +     - MIPS中有八个可屏蔽中断位INT0-INT7，通常INT2-INT7可供外部的中断请求使用，INT0/1用于软中断

    +     - 使用处理器外的中断控制器来提供更多的中断输入

    +     - NMI来源于硬件预设的致命错误，其处理入口地址与复位相同，均0xbfc0000，但在寄存器中保存NMI状态位'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 中断优先级


    +   - **MIPS在内的许多指令系统将中断和异常一视同仁，但事实上确实需要有优先级的区分**

    +   - 一个软件的中断优先级方案:

    +     - 软件维护一个中断优先级（IPL），对每个中断源赋予特定的优先级

    +     - 正常执行状态，CPU在最低优先级，所有中断可触发

    +     - 处于最高中断优先级时，所有中断被屏蔽

    +     - 高优先级中断可抢占低优先级中断'
  merge: -1
  img_proc: true
- pgno: 232
  md: "# 中断处理的原子性\n\n+   - 在MIPS中，对中断的使能和屏蔽都需要通过读写协处理器寄存器SR来进行\n+   - 若在标号1和2之间被中断，可能导致SR被修改了不符合预期的值\n\
    +     - 原子指令：如MIPS的DI指令\n+     - 禁用中断\n+     - 约定中断退出时恢复原SR\n+     - 通用的临界区处理\n\
    \n```\nmfc0 t0, SR\n1:\n    or   t0, <SET>\n    and  t0, <CLR>\n2:\n    mtc0 t0,\
    \ SR\n    ehb\n```"
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 通用的原子性处理


    +   - 信号量、锁

    +   - 基本步骤：等待锁并加锁、做原子操作、打开锁

    +   - 原子性的保障在于“测试并设置”的原子性

    +   - 68000系列的测试并设置指令、x86的lock类指令

    +   - 另一种思路：先设置，只在原子性未被破坏时生效

    +     - MIPS的LL（Load Linked）、SC（store conditional）指令

    +     - Transactional memory'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 向量化中断


    +   - 在嵌入式CPU中，中断处理是CPU重要的工作内容

    +   - **MIPS向量化中断:**

