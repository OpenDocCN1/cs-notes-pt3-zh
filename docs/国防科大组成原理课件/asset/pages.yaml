- pgno: 711
  md: '# 片上网络


    +   - C. Seitz和W. Dally在本世纪初首先提出了片上网络的概念

    +     - 处理器核抽象成节点，互连网络用来在处理器核节点间传输消息数据

    +     - 数据封装成数据包，通过路由器之间的分组交换和对应的存储-转发机制来实现处理器核间的通信

    +     - 研究内容包括：拓扑结构、路由算法、流量控制（Flow Control）、服务质量


