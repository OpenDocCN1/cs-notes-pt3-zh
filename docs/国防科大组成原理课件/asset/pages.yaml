  md: '# 存储一致性模型与Cache一致性协议


    +   - 存储一致性模型对Cache一致性协议的制约作用

    +     - Cache一致性协议都是针对某种存储一致性模型而设计的

    +     - 存储一致性模型为Cache一致性协议规定了“一致性”的目标，即，什么是“一致性”

    +     - 如，顺序一致性模型要求对某处理机所写的值立即进行传播，在确保该值已经被所有处理机接受后才能继续其它指令的执行

    +     - 如，释放一致性模型允许将某处理机所写的值延迟到释放锁时进行传播'
