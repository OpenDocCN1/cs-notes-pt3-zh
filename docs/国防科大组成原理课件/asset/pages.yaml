- pgno: 600
  md: '# 提高流水线效率的技术


    +   - 指令流水线

    +     - 多发射：多车道

    +     - 动态调度：允许超车

    +   - 喂饱“饥饿”的运算器

    +     - 转移猜测：提供足够的指令

    +     - 存储管理：提供足够的数据

    +     - 冯诺依曼结构：存储程序和顺序执行'
  merge: -1
