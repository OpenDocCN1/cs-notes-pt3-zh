- pgno: 698
  md: '# Cache一致性协议


    +   - **Cache一致性协议（Cache Coherence Protocol）**：一种把新写的值传播到其他处理器核的机制

    +     - 如何传播新值：**Write Invalidate vs. Write Update**

    +     - 向何处传播新值：**Snoopy vs. Directory Protocol**

    +   - **Cache一致性协议决定系统为维护一致性所做的具体动作，因而直接影响系统性能**'
  merge: -1
  img_proc: true
- pgno: 699
  md: '# Write-Invalidate和Write Update


    +   - **Write-Invalidate**

    +     - 当一个处理机更新某共享单位（如存储行或存储页）时（之前或之后），通过某种机制使该共享单位的其它备份无效，当其它处理机访问该共享单位时，访问失效，再取得有效备份

    +   - **Write-Update**

    +     - 当一个当一个处理机更新某共享单位时，把更新的内容传播给所有拥有该共享单位备份的处理机

    +   - 比较

    +     - **Write Update**: 重复更新已不再使用的行

    +     - **Write Invalidate**: 假共享导致乒乓问题'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# 侦听协议


    +   - 通过广播维护一致性

    +     - 写数的处理机把新写的值或所需的存储行地址广播出去

    +     - 其他处理机侦听广播，当广播中的内容与自己有关时，接受新值或提供数据

    +     - 存储器和每个处理机的Cache只维护状态信息


    +   - 适合于总线结构的SMP系统中

    +     - 总线是一种廉价而有效的广播工具


    +   - 可伸缩性有限

    +     - 总线是一种独占性资源

    +     - 总线延迟随处理机数的增加而增加：仲裁、总线长度、总线阻抗'
  merge: -1
  img_proc: true
- pgno: 701
  md: '# 基于目录的协议


    +   - 每个存储行对应一个目录项

    +     - 记录拥有该行的一个副本的那些处理机

    +     - 当某个处理机写该行时,根据目录项的内容传播数据

    +     - 在COMA结构中，记录该行的Owner

    +   - 由于避免了广播，目录协议有一定的伸缩性

    +   - 目录需要大量存储空间,需要动态维护

    +   - 位向量目录: O(MN)，存储开销大

    +   - 有限指针目录： O(M logN)，指针溢出

    +   - 链目录: O(M logN)，串行更新'
  merge: -1
