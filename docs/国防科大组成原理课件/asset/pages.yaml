- pgno: 603
  md: '# 多发射数据通路


    +   - 多发射数据通路优化技术的思想

    +     - 让处理器中每级流水线都可以同时处理多条指令

    +   - 多发射数据通路设计开销

    +     - 需要流水线相关资源成倍增加

    +     - 不仅要判断流水级之间指令的相关，同一级流水的指令间也要判断相关


    | 时钟周期数 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |

    |---|---|---|---|---|---|---|---|---|---|

    | Add $2,$1,$1 | PC₀ (取指) | R1₀ (译码) | R2₀ (执行) | R3₀ (访存) | R4₀ (写回) |  |  |  |  |

    | Add $3,$1,$1 | PC₁ (取指) | R1₁ (译码) | R2₁ (执行) | R3₁ (访存) | R4₁ (写回) |  |  |  |  |

    | Add $4,$1,$1 | PC₀ | 旁同阻塞 | R1₀ | R2₀ | R3₀ | R4₀ |  |  |  |

    | Add $5,$2,$2 | PC₁ | 相关 | R1₁ | R2₁ | R3₁ | R4₁ |  |  |  |

    | Add $6,$1,$1 |  | PC₀ | 结构相关 | R1₀ | R2₀ | R3₀ | R4₀ |  |  |

    | Add $7,$6,$6 |  | PC₁ |  | 数据相关 | R1₁ | R2₁ | R3₁ | R4₁ |  |

    | Add $8,$1,$1 |  |  | PC₀ | 结构相关 | 旁同阻塞 | R1₀ | R2₀ | R3₀ | R4₀ |

    | Add $9,$1,$1 |  |  | PC₁ |  | 结构相关 | R1₁ | R2₁ | R3₁ | R4₁ |'
  merge: -1
