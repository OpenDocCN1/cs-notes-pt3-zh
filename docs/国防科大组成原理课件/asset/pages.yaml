- pgno: 368
  md: '# 片上总线的性能


    +   - 性能相关因素

    +     - 频率：能跑多快

    +       - 能否加流水级，加多少

    +     - 数据位宽：单位周期传送的数据量

    +       - 8/16/32/64/128/256/512 ...

    +     - 带宽利用率：总线事务中数据传输时间占总时间的平均值

    +       - 读：主设备发出读请求到从设备，准备数据，通过总线返回

    +       - 写：主设备发出写请求到从设备，接收数据，返回状态

    +       - 延迟不容易降低，关键是能否流水，支持outstanding

    +       - 同时进行数据传输的总线事务个数

    +   - 性能目标决定了实现代价'
  merge: -1
  img_proc: true
