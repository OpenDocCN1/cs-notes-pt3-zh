- pgno: 332
  md: '# CPU+弱北桥+南桥


    +   - 内存控制器被集成到CPU中

    +     - 大大缓解了冯诺依曼结构带来的缓存瓶颈，平均可带来30%的性能提高

    +     - 降低了对系统总线的需求（多路服务器对系统总线要求除外），使Intel系统总线专利减少了用武之地


    ![](img/0d16039e8c3308af077d6d25bb4413a8_332_0.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# CPU+南桥


    +   - **GPU被集成到处理器中**

    +     - 北桥的功能进一步减弱，和南桥合并，形成处理器+南桥两片结构

    +     - **GPU集成到处理器中减少了从内存到显存的数据传输，但显存合并到内存增加了内存压力，GPU对内存带宽要求很高，且实时性要求高**


    +   - 内存控制器集成在CPU中，**GPU集成在北桥中的两片方案也是一个不错的选择**

    +     - 独立显存有利于性能

    +     - **CPU升级方便**


    ![](img/0d16039e8c3308af077d6d25bb4413a8_333_0.png)'
  merge: -1
  img_proc: true
