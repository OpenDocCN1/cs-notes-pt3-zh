- pgno: 111
  md: '# 1. 硬盘的基本部件


    驱动器

    带动磁盘旋转，并完成对磁盘的读写。它由主轴驱动系统、磁头定位系统、信息读/写系统和状态检测系统等部分组成。


    盘片

    表面涂有磁性材料的圆盘。存储信息的原理为：通过电子方法控制磁表面的磁化方向，以此来记录0和1。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 1. 硬盘的基本部件


    一个硬盘内通常有多个盘片，它们共同连接在主轴上。


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_112_0.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 2. 硬盘上信息的存储格式


    +   1) 记录面


    每个盘片有上、下两个记录面，每个记录面都有自己的读写磁头。


    磁头数等于记录面数，常用磁头号来代替记录面号'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 2. 硬盘上信息的存储格式


    2) 磁道


    每个记录面含若干同心圆，一个同心圆为一个磁道。所有记录面的同心圆个数相等。磁道编号：最外层是0道，从外向里，磁道编号逐一增加。


    3) 扇区


    每个磁道被等分为若干个弧段，称之为扇区。每个扇区容量为512字节，读/写操作以扇区为单位进行。


    每个磁道上的扇区数相同，因此每个磁道记录的数据也是一样多。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 2. 硬盘上信息的存储格式


    # 3) 柱面


    所有记录面上同一编号的磁道在纵向上所形成的同心圆柱。


    硬盘的柱面数与一个记录面上的磁道数相等。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# # 2. 硬盘上信息的存储格式


    +   - □ 信息存储方式


    信息存储的顺序：一个个柱面存储信息，一个柱面用完，再用下一个柱面；


    在一个柱面内，按照磁道号（记录面号）一个个磁道依次存储；


    在一个磁道内，按照扇区号依次存储。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Problem


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_117_0.png)


    □ 为什么要一个柱面一个柱面的存储信息？'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 3. 硬盘存储容量


    # 计算公式：


    柱面数×磁头数×扇区数×扇区容量


    例：已知某硬盘磁头数为16，柱面数为4096，扇区数为63，则


    硬盘容量 = 4096×16×63×512

    =2.1GB'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 4. 硬盘的工作原理


    +   1) 加电后，磁盘片高速旋转

    +   2) 接收读数指令

    +   3) 按照地址寻道：通过磁头水平移动定位磁道。然后通过磁片的转动找到扇区。

    +   磁盘的地址组成：

    +   磁头号、磁道号、扇区号

    +   4) 相应磁头读信息至硬盘Cache

    +   5) 硬盘Cache与外界交换信息'
  merge: -1
  img_proc: true
