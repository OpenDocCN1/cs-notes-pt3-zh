- pgno: 402
  md: '# 五、几个注意的问题


    +   1. 写自己的东西


    论文应写自己的东西，用自己的语言论述。对别人的东西只能是“引用”，而不是“拷贝”。


    开始写论文往往是在复述别人的东西，可从文章中看到大量别的文章中的语句。


    要有本事将别人的的东西写成自己的。做法可以是：


    +   建立自己的解构结构，把别人的的东西组装进去。

    +   尽可能发明术语，对于核心概念、方法、技术，杜撰一个词，精炼、反映主题思想。

    +   尽可能用自己的语言，不要抄书或背书。


    这是能力，来源于对问题的深刻见解。'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# # 五、几个注意的问题


    2. 综述要有自己的评价体系


    综述文章主要是介绍别人的东西，但应让人看出作者是经过思考的、有自己的见解。做法有：


    重新安排解的结构，并建立自己的评价体系：

    维度、刻度。（如评价一个人的维度和刻度）。

    在这个结构中安排材料；

    从批判的角度论述；

    多使用自己的语言。'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# # 五、几个注意的问题


    # ## 3. 注明引文


    对于别人的思想或方法必须清楚地注明出处。


    这是一个好的习惯。更严重地说，这是一个学术修养问题、学术道德问题。'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # 五、几个注意的问题


    +   4. 大胆杜撰名词

    +   大胆杜撰专业术语，特别是在前沿领域的研究论文中。能否杜撰术语，反映了一个人的见识和学术造诣。术语的要求：

    +   精练

    +   能够“望词生义”

    +   富于联想

    +   形象，所谓的贴切'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # 五、几个注意的问题


    # 5. 标题词


    除了引言和结论之外，章节的标题名称应反映章节的中心思想。一般以概念、技术和方法之术语来命名。如：二叉树、图的最小生成树、A*搜索算法、α-β剪枝。


    +   忌：

    +   - 系统结构（什么结构？）

    +   - 系统的控制机制（什么机制？）

    +   - 系统的处理算法（处理方法？什么算法？）'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# # 五、几个注意的问题


    # ## 6. 段落


    文中的每个段落应聚焦于一个主旨上，总分散和倒转。相邻段落的主旨应有序和连贯。如果有跳跃或转折的话，应有铺垫的词。


    每段的结构：


    （主旨句topic sentence， 支持细节supporting details）


    主旨句：


    一般位于段落之首；


    反映该段落的中心思想；


    全段最具概括性的陈述句，小命题


    有两部分组成: (topic, one specific reason)'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# # 五、几个注意的问题


    # ## 主旨句的选取


    选择最能反映问题特征的理由。因为支持主旨的理由有大小、轻重之别。


    主旨句设置的命题应适中。太大，不聚焦，可能覆盖其他段的内容；太小，难以展开。


    # ## 主旨的安排


    不同段落的主旨不能重复或重叠。应从不同角度或侧面选取材料，论述问题或解。


    主旨的顺序有方向性：


    从重要到次要，突出重点。


    从次要到重要，重要性递增，登峰之感强烈。'
  merge: -1
  img_proc: true
