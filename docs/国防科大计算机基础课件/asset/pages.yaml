  md: '# 计算工具的进化


    # 机器分析器 (Analytical Engine)


    查尔斯·巴贝奇(Charles Babbage)1830年设计。


    巴贝奇是英国数学家、天文学家，兼发明家。


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_16_0.png)'
  merge: -1
