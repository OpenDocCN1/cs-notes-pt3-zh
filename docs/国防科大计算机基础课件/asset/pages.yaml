  md: '# 逻辑地址


    +   - （目标）程序的地址是连续的，是概念上的，并不与内存空间对应，其起始地址为0；

    +   - （目标）程序中的其他地址都是相对于起始地址计算的；

    +   - （目标）程序中地址所形成的地址范围称为地址空间；

