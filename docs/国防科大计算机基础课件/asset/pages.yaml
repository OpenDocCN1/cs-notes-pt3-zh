- pgno: 186
  md: '# 4. 补码


    若 x = +x₁x₂…xₙ₋₁，则 [x]补 = 0x₁x₂…xₙ₋₁

    若 x = −x₁x₂…xₙ₋₁，则 [x]补 = 1\overline{x₁}\overline{x₂}…\overline{xₙ₋₁} + 1


    在补码表示法中，0只有一种表示形式

    [±00…0]补 = 000…0


    [x₁ + x₂]补 = [x₁]补 + [x₂]补

    [x₁ − x₂]补 = [x₁]补 + [−x₂]补'
  merge: -1
  img_proc: true
