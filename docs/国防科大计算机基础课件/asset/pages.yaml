- pgno: 17
  md: '# 计算工具的进化


    # 机器分析机


    分析机有三个主要部件：齿轮存储器、运算装置和控制装置。巴贝奇设想用穿孔卡片送控制机器的计算过程，包括操作顺序、输入和输出等过程。该控制机制包含了顺序、分支和循环控制等特性。


    巴贝奇的主要贡献：


    +   设计了第一台具有现代意义的计算机器

    +   提出了程序控制的思想

    +   提出了程序设计的思想


    # 第一个程序员：


    Augusta Ada Lovelace'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 计算工具的进化


    # 第一台电动计算机


    1884年，美国工程师赫尔曼·霍雷斯（Herman Hollerith）制造了第一台电动计算机，采用穿孔卡和弱电流技术进行数据处理，在美国人口普查中大显身手。


    # 第一台继电器计算机


    美国哈佛大学应用数学教授霍华德·艾肯（Harvard Hathaway Aiken）在1937年开始设计“马克1号”（Mark I），并于1944年交付使用。“马克1号”是全继电器式计算器，做乘法运算一次最多需要6秒，除法10多秒。运算速度不算太快，但精确度很高（小数点后23位）。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 计算工具的进化


    # 继电器计算机 - Z3


    德国人科拉德.祖思 (Konard Zuse) 于1939年独立研制了全继电器计算机Z3。祖思对计算机技术的发展有特殊贡献，主要表现在：


    +   针对继电器的操作，研究了相当于布尔代数的“条件命题”系统。在此基础上，它从数学和逻辑两个方面，考虑了计算机的设计问题。


    +   首先提出采用二进制数的基本表示方法，以及二进制浮点数的规格化表示方法，并在其计算机中予以实现。


    +   首次提出了存储器的概念。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 计算工具的进化


    # 抽象计算模型 - 图灵机


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_20_0.png)


    英国数学家艾伦.图灵（Alan Turing）于1937年发表论文“论可计算数以及在确定性问题上的应用”，其中描述了一种计算装置—图灵机。图灵机导致了计算的形式概念，即所谓图灵
    - 可计算性。是现代计算机的通用模型。为了纪念图灵对计算机科学的杰出贡献，美国计算机博物馆于1966年设立了图灵奖，每年颁发一次，以表彰在计算机领域取得突出成就的科学家。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 计算工具的进化


    # 抽象计算模型 - 图灵机


    +   - 一条两头可无限延伸的纸带，纸带划分为小方格。方格中可包含符号集中的任意符号，也可为空。

    +   - 一个读写头，任何时刻，读写头都扫描纸带上的某个方格。读写头可执行的动作为：向左或向右移动到相邻方格；读出当前方格中的符号；向当前方格中写入一个符号。

    +   - 一个控制器，依照规则控制图灵机的执行。


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 第一台电子数字计算机


    1946年诞生在美国的宾夕法尼亚大学摩尔学院，它的名称是电子数字积分器和计算机（Electronic Numerical Integrator And Computer，ENIAC）。ENIAC使用了17,468个电子管、70,000个电阻器、10,000个电容器和1,500个继电器，包含了6,000个手动开关和5百万个焊接点。机器占地167平方米，重约30吨。工作时耗电160千瓦。ENIAC每秒钟能做5,000个加法、357个乘法或38个除法。这个速度比当时的任何机器都快一千倍。'
  merge: -1
  img_proc: true
