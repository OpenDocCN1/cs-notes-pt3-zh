- pgno: 261
  md: '# # 输入输出控制方式（一）


    +   程序直接控制方式


    +   CPU启动设备的输入输出操作，在设备输入输出操作期间，CPU通过循环执行测试程序，不断检测设备状态，直到操作完成，再继续执行下面的程序。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # 输入输出控制方式（二）


    # ## 中断控制方式


    +   > CPU向设备控制器发出指令，启动设备输入输出操作，然后继续其他工作；


    +   > 当设备完成一个单位数据的传输工作后，就向CPU发送一个中断信号；


    +   > CPU接到信号，转去处理该中断事件；


    +   > 如果一次要读入多个数据，CPU就要启动设备多次，也会被中断多次。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # 输入输出控制方式（三）


    # ## DMA控制方式


    +   基本思想是在外围设备与内存之间开辟直接的数据交流通路。


    +   CPU将需传输的数据内存首地址与字节数送给DMA控制器，然后启动设备。


    +   DMA控制器控制设备挪用CPU工作周期，在设备与内存之间传输全部数据后，向CPU发出中断信号。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# # 输入输出控制方式（四）


    # ## 通道控制方式


    +   - 通道是专门负责输入输出工作的处理机。

    +   - 通道控制方式与DMA控制方式很相象。

    +   - 通道可以编程序，并可以控制多台设备。

    +   - CPU发启动指令，指明要执行的操作、使用的设备与通道；通道接收到指令，即从内存读取通道程序并执行，控制设备与内存之间的数据传输。完成后，向CPU发中断信号。


    2022年11月3日 国防科大计算机学院 62'
  merge: -1
  img_proc: true
