  md: '# 进程管理（六）


    # —— 进程控制块


    +   - 操作系统为了管理和控制进程的运行，为每个进程定义一个进程控制块，用于记录进程的属性信息。

    +   - 进程控制块——（Process Control Block）是为实现对进程的管理而引进的专门的数据结构，也叫PCB表，它是进程存在的唯一标志。PCB随着进程的创建而建立，随着进程的撤消而撤消。'
