  md: '# 冯·诺依曼型机


    # “存储程序控制” 原理


    +   - 将计算过程描述为由多条指令按一定顺序组成的程序，并放入存储器保存；

    +   - 指令按其在存储器中存放的顺序执行；

    +   - 控制器控制整个程序的执行和数据的存取。'
