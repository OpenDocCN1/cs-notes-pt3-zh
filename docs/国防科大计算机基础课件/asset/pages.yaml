    # 如何撰写科学论文'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# ## 二、 基本问题


    +   - 科学论文的类型


    综述论文


    研究论文（技术报告）


    技术文档


    科学和技术报道


    科普文章'
  merge: -1
  img_proc: true
- pgno: 387
  md: "# ## 二、基本问题\n\n+   ### 综述论文\n+   对一个研究分支或问题的相关问题、概念和方法，进行综合和总结，给予系统的介绍。\n+\
    \   \n+   要求：\n+   - 占有大量的资料，具有索引的功能\n+   - 全面，涉及问题的各个方面，注意覆盖面。"
  merge: -1
  img_proc: true
- pgno: 388
  md: "# ## 二、基本问题\n\n+   - 研究论文  \n+     描述自己对专业问题的研究成果，介绍新概念、新方法。  \n+     要求： \
    \ \n+     - 对问题有深入的探索，有自己的见解。  \n+     - 对问题聚焦，强调“点”，围绕中心问题展开。"
  merge: -1
  img_proc: true
- pgno: 389
  md: "# 二、基本问题\n\n+   - **目标**\n+   \n+     论文的目的----解决科学问题。因此，论文是关于问题的解，是一个解决方案。撰写论文的过程是研究的过程，问题求解的过程。\n\
    \n+   - **综述论文**\n+   \n+     介绍问题的一组解，重点是对问题的解进行评价。\n\n+   - **研究论文**\n+   \n\
    +     提出问题的解，重点在解本身。"
  merge: -1
  img_proc: true
- pgno: 390
  md: '# 三、规范格式


    +   - 规范格式的作用


    必须有规范的格式。这不是“八股”，而是服务于内容。其作用大致有：


    +   - 结构化， 与非结构化对应。


    +   - 条理化，文章逻辑清晰。


    +   - 便于阅读


    +   - 便于索引和检索'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# 三、规范格式


    +   - 格式

    +     - （目录）

    +     - 摘要和关键字

    +     - 引言

    +     - 论文的主体内容

    +     - 结语

    +     - 参考文献

    +     - （附录）'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# # 四、各部分的作用


    +   1. 摘要和关键字

    +      摘要给出问题的解的要点。要求简短。包括两个方面的内容：

    +      - 简述问题，一句话。不做解释。

    +      - 方法及解决的子问题，一个或一组。可能包括未解决的问题。

    +      关键字是指反映主题或思想的专业术语。用于索引和检索。'
  merge: -1
  img_proc: true
- pgno: 393
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 394
  md: '# 四、部分的的作用


    # ● 问题解的环境


    定义问题求解的上下文。说明研究现状，以及在什么层面来解决问题。


    研究现状：哪些相关的问题已解决，由谁解决的，解决的程度，解决的方法；哪些问题未解决，理由或原因。


    解的层次：建立解的相关概念的粒度，指定在什么层面上解决该问题。'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# 四、各部分的作用


    # 解的纲要


    扼要说明论文的章节以及主要内容。作用是给出解的纲要，以便读者建立解的简要图像。'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# # 四、各部分的作用


    +   3. 解

    +   确定解的结构。分章节论述解，章节与解的结构相对应。其分解方法有多种，应选定一种：

    +   按照问题结构

    +   问题 ⇒ 子问题1，子问题2， ...

    +   解的总体结构，子问题1的解，子问题2的解， ...。形成解的层次结构。

    +   类似于软件的设计：

    +   系统结构，模块1，模块2， ...'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# # 四、各部分的作用


    +   ### 问题的不同解法

    +   同一个问题可能有多种解决方法，按照不同的解，分章节论述。

    +   判断不同解的标准：解所基于的背景假设是否不同；解所考虑的问题相关的参数是否不同。

    +   如：

    +   欧氏几何和非欧几何；

    +   机器翻译中基于语法分析与基于语料库的方法。

    +   核心公式的参数不同，等。'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# # 四、各部分的作用


    +   ## 核心概念

    +   核心概念是解的主要组成部分。可以安排章节单独描述核心概念。'
  merge: -1
