- pgno: 233
  md: '# 地址重定位 (二)


    地址重定位的不同方式体现了两种分配内存的方式。


    +   ➤ 静态重定位


    在程序装入内存的同时，将程序中的逻辑地址转换为物理地址。


    +   ➤ 动态重定位


    在程序的执行过程中，每当访问指令和数据时，将待访问指令或数据的逻辑地址转化为物理地址。'
  merge: -1
