  md: '# # 4.2 文本、文本选择


    | 功能 | 操作要领 |

    |---|---|

    | 大块文本 | 按住鼠标左键拖 |

    | 一个单词或汉字 | 在所需的中文字、词组或英文单词中双击。 |

    | 一句 | CTRL+在所需的语句中单击。 |

