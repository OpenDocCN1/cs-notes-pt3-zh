  md: '# 存储单元的地址和内容


    +   □ 地址

    +   ◆ 单元所对应的编号。

    +   地址从0开始, 依次加1。

    +   ◆ 作用是实现对单元内容寻址


    +   □ 内容

    +   存储单元中存放的数据


