  md: '# # 补码运算


    例1.　A=+1011，B=-1110，求 A+B


    解：[A+B]补=[A]补+[B]补


    [A]补=01011，[B]补=10010，


    |  | 01011 |

    |---|---|

    | +) | 10010 |

    |  | 11101 |


    [A+B]补=11101


    A+B=-11'
