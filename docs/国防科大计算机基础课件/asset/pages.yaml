- pgno: 181
  md: '# 1. 机器数


    +   - 算术运算中的数值都带有符号以表示正负

    +   - 一个带符号的二进制数由两部分组成

    +     - 数的符号部分：正“+”、负“−”

    +     - 数的数值部分


    +   - 在计算机中用0表示正，用1表示负

    +   - 将数的符号数值化的数据表示形式称为机器数

    +   - 原来带有“+”、“−”号的数据表示称为真值


    真值：N₁ = +1011　　N₂ = −1011

    机器数：N₁ = 01011　 N₂ = 11011'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 2. 原码


    +   - 符号部分用0表示“+”，用1表示“−”

    +   - 数值部分以真值形式表示


    $x_1=+1101$


    $[x_1]_{原}=01101$


    $x_2=-1101$


    $[x_2]_{原}=11101$


    +   - 数的最高位为符号位

    +   - 简单直观，容易变换，进行加减运算较为复杂

    +   - 为了简化加减运算，引进反码和补码'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 2. 原码


    +   一般规则

    +   设真值 x = + x₁x₂...x_{n-1} (0 ≤ x < 2^{n-1})

    +   或

    +   x = - x₁x₂...x_{n-1} (-2^{n-1} < x ≤ 0)


    则 [x]_原 = x (0 ≤ x < 2^{n-1}) 或

    [x]_原 = 2^{n-1} + |x| (-2^{n-1} < x ≤ 0)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# # 3. 反码


    +   - 符号部分同原码，即数的最高位为符号位，用0表示正数，用1表示负数


    +   - 数值部分与它的符号位有关


    +     - 对于正数，反码与原码相同


    +     - 对于负数，反码数值是将原码数值按位取反


    ```

    x₁ = +1101     x₂ = -1101


    [x₁]_原 = 01101   [x₂]_原 = 11101


    [x₁]_反 = 01101   [x₂]_反 = 10010

    ```'
  merge: -1
  img_proc: true
