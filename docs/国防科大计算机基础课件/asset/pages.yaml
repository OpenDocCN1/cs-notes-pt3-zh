  md: "# 2.1.1 微机系统的构成\n\n微机系统\n{ \n硬件—构成计算机系统的设备实体，是整个系统运行的物理平台\n软件—为运行、管理维护计算机系统或为实现某一功能而编写的各种程序和相关资料的总和。"
  merge: -1
