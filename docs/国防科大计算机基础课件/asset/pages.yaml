- pgno: 237
  md: '# 虚拟存储器


    程序运行并不一定需要和地址空间一样大小的存储空间；


    仅分配给程序当前需要执行部分所需要的空间；将暂时不需要的内容调出内存存储在外存中，腾出空间调入需要执行的部分；


    这种技术称为虚拟内存技术，其中保存程序暂时不用的部分的外存称为虚拟内存。


    +   • 好处：减少了程序运行对内存的需求；增加了并行进程的数量。'
  merge: -1
  img_proc: true
