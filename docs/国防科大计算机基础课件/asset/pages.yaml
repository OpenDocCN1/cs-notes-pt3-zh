    +   - 内部中断

    +   - 外部中断'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # 中断控制技术


    # □ 特点


    +   - 外设在需要时向CPU提出请求，CPU接到请求后，中断正在执行的程序，转而执行处理外设服务程序，服务结束后CPU执行被中断的程序。

    +   - 优点：CPU效率高，实时性好，速度快。

    +   - 缺点：控制程序编制较为复杂。'
  merge: -1
  img_proc: true
