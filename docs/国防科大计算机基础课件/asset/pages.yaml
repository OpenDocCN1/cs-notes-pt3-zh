- pgno: 15
  md: '# 第一台机械计算器


    舒卡德计算器能完成加减乘除运算。它有三个特点：


    +   - 以某种机械的方式保存参加运算的数及结果。

    +   - 用齿轮作为自动运算的装置。

    +   - 运算法则固化在机械中，以机械运动实现运算。'
