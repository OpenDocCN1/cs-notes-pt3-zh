- pgno: 24
  md: '# 计算工具的进化


    # 冯·诺依曼体系结构


    ![](img/cc764fab5df2f51fd95ee56d3e8b72cf_24_0.png)


    冯·诺依曼（John von Neumann）是匈牙利籍的美国人，一个天才数学家。1945年6月，冯·诺依曼在一份报告中提出了存储程序的原理，论述了存储程序计算机的基本概念，在逻辑上完整描述了新机器的结构，这就是所谓的冯·诺依曼体系结构。冯·诺依曼体系结构有如下特点：


    +   - 程序指令和数据都用二进制形式表示

    +   - 程序指令和数据共同存储在存储器中

    +   - 序列化执行程序指令'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 计算工具的进化


    # 微型计算机


    1975年，微型仪器遥测系统公司阿尔塔设计制造了 阿尔塔 (Altair) 8800计算机。阿尔塔采用8080芯片。刚开始时，它是一台简陋的机器，一个机箱里装着一个中央处理器和一个256个字节的存储器，没有终端，没有键盘。功能也十分简单，只能运行一个小游戏程序。


    微型计算机出现的意义：


    +   - 使现代信息处理装置从科学殿堂进入寻常百姓家。

    +   - 标志使用计算机已经成为一种文化、一种生活方式。'
  merge: -1
  img_proc: true
