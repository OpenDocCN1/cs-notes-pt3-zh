- pgno: 277
  md: '# # Windows2000


    # ## 主要技术特点


    +   (1) 真正的多用户多任务操作系统


    +   (2) 支持对称多处理和多线程


    +   (3) 32位页式虚拟存储管理


    +   (4) 支持多种可装卸文件系统


    +   (5) 提供“即插即用”功能


    +   (6) 新的图形化界面，较强的多媒体支持功能


    +   (7) 集成网络功能，支持联网和网络通信


    +   (8) 具有更高的安全级和容错功能


    2022年11月3日 国防科大计算机学院 75'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# UNIX


    +   (1) 多用户多任务，用C语言编写；

    +   (2) 具有分层可装卸的文件系统，提供文件保护功能；

    +   (3) 提供I / O缓冲技术，系统效率高；

    +   (4) 剥夺式动态优先级CPU调度，有力地支持分时功能；

    +   (5) 请求分页式虚拟存储管理，内存利用率高；

    +   (6) 命令语言丰富齐全，提供Shell语言；

    +   (7) 具有强大的网络与通信功能。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# # Linux


    +   (1) 继承了UNIX的优点，开放、协作的开发模式

    +   (2) 全面支持TCP / IP，内置通信联网功能

    +   (3) 是完整的UNIX开发平台，支持UNIX开发工具

    +   (4) 支持32种文件系统

    +   (5) 提供GUI，有图形用户接口：X_Window

    +   (6) 支持并行和实时处理，充分发挥硬件性能

    +   (7) 开放源代码，可自由获得


    2022年11月3日 国防科大计算机学院 77'
  merge: -1
  img_proc: true
