- pgno: 219
  md: '# 进程管理（一）

    —— 进程的定义


    +   • 进程是指一个具有一定独立功能的程序使用系统分配的资源在一个具体数据集合上的一次动态执行过程。它是系统进行资源分配和调度运行的一个独立单位。


    +   • 从软件构造的角度讲，进程是由程序、数据和进程控制块构成的。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 进程管理（二）——进程与程序的区别


    +   - 程序是指令的集合，进程是指令集合的一次执行；

    +   - 程序是静态的概念，进程是动态的概念；

    +   - 程序是永久的，进程的生命是有限的；

    +   - 程序与进程的组成不同（进程的组成包括程序、数据和进程控制块）；

    +   - 程序存储需要介质，进程执行需要处理机；

    +   - 进程与程序并不是一一对应的。'
  merge: -1
  img_proc: true
- pgno: 221
