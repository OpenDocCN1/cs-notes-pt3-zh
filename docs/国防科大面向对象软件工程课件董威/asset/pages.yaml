- pgno: 192
  md: '# § 6.3.1 顺序（Sequence）图


    +   顺序图的X轴表示不同的对象，Y轴表示时间


    +   对象间的通信表示为对象生命线之间的消息传递


    +   消息有简单、同步、异步之分


    +   消息用消息名及参数标识


    +   消息可带有条件表达式，以表示条件或分支


    +   一个对象可通过发送消息来创建或删除另一对象


    +   顺序图可显式表示对象生命的终结


    +   顺序图的左边可带有描述信息，以阐明消息发送的时刻，动作执行情况及约束信息等'
