    +   - 丢失的或不正确的动作

    +   - 多余的、丢失的或讹误状态

    +   - 潜行路径（一个不应被接受的消息被接受）

    +   - 非法消息的失效（一个不期望的消息引起的失效）

    +   - 陷阱门（实现了没有定义的消息）'
