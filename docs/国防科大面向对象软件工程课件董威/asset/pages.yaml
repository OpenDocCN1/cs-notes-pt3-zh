- pgno: 180
  md: '# 编译时的构件


    +   编译时的构件是包含工程中产生的代码的源构件。


    +   其它的构件，如链接时和运行时的构件是从编译时的构件中产生的。


    +   可被编译时的构件使用的某些版类为：


    +   《file》，表示包含源代码的文件；


    +   《page》，表示Web 页；


    +   《document》，表示文档(包含文档而不是可编译的文档)。


    +   从一个编译时的组件到其它的编译时的构件的相关性显示了它需要其它的构件中的哪一个才能得到完整的定义。'
