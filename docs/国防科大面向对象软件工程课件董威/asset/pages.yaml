- pgno: 220
  md: '# § 6.3.4 活动(Activity)图


    # 活动图与商业建模


    +   - 在商业建模时下列方面是模型要着重描述的：资源、规则、目的和动作（工作流）。

    +   - 有两类资源：物质和信息。工人（商业活动中的角色）就是资源的例子，他们是物理对象。其它的物理对象可能是生产的、消费的或处理的物品。信息对象通常是被信息系统处理的对象，信息对象携带与商务有关的信息。

    +   - 商务规则约束资源的使用，包括物品和信息。例如一条规则规定物品在搬运过程中不能损坏，另一条规则可能规定战略信息必须保密。

    +   - 这些资源的使用是真正的工作，称为工作流。


    ![](img/134871fe98cb20245c2dff1445580eb9_220_0.png)'
  merge: -1
