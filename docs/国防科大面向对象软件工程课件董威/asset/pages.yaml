- pgno: 412
  md: '# # 类的模态性


    +   - **非模态类**对接受的消息序列不强加任何限制，DateTime示例；

    +   - **单模态类**对可接受的消息序列有限制，但不管其内容，TrafficLight示例；

    +   - **准模态类**对随对象的状态而改变的可接受消息进行顺序限制，Stack示例；

    +   - **模态类**对可接受的消息序列进行消息和域的限制，Account示例。'
  merge: -1
  img_proc: true
- pgno: 413
  md: "# 不变量边界\n\n# □ 目标\n\n- 为由复杂的和原始的数据类型组成的类、接口及构件选择能高效测试的测试值组合。\n\n# □ 上下文和故障模型\n\
    \n- 在IUT的范围内为所有的变量提供值，随后运行一个测试；实例变量值的有效和无效的组合可被类的不变课指定。\n\n# □ 策略\n\n```\nassert(\
    \ (txCounter >=0 && txCount<=5000) &&\n        (creditLimit>=99.99 && creditLimit<=1000000)\
    \ &&\n        ((!account1.isClosed() || !account2.isClosed()) );\n```"
  merge: -1
  img_proc: true
- pgno: 414
  md: '# # 非模态类测试


    # ## 目标


    +   - 为不限制消息顺序的类开发一个类范围测试包。


    # ## 上下文和故障模型


    +   - 拒绝一个合法的顺序；一个合法的顺序产生一个错误的值；接受非法的修改参数导致错误状态；错误的计算导致类不变量被破坏等。


    # ## 策略


    +   - 随机序列；


    +   - 质疑序列。'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# # 准模态类测试




    - 为类产生一个类范围测试包，该类对随类状态改变而改变的消息序列进行限制。




    - 容器和收集类通常是准模态的；有效的测试必须区别决定行为的内容和不影响行为的内容。




    - 定义不变量边界，集成操作序列。'
  merge: -1
