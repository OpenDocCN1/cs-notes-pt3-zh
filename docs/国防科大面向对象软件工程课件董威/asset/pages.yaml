- pgno: 176
  md: '# # 物理架构—硬件


    # § 6.2 UML静态建模机制


    物理架构中的硬件概念可以分为：


    +   处理器。执行系统中的程序的计算机。


    +   设备。指的是支持设备，如打印机、路由器、读卡机等。它们一般被连接到控制它们的处理器上。


    +   连接。处理器之间有连接，处理器与设备之间也有连接。连接表示两个节点间的通信机制，可以用物理媒体（如光纤）和软件协议（如TCP/IP）来描述。'
  merge: -1
  img_proc: true
- pgno: 177
