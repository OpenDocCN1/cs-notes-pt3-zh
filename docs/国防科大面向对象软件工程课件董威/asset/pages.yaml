- pgno: 178
  md: '# § 6.2.5 构件 (Component) 图


    软件构件可以是：


    +   源构件。源构件只在编译时是有意义，典型情况下它是实现一个或多个类的源代码文件。


    +   二进制构件。典型情况下，二进制构件是对象代码，它是源构件的编译结果。它应该是一个对象代码文件、一个静态库文件或一个动态库文件。


    +   可执行构件。可执行构件是一个可执行的程序文件，它是链接（静态链接或动态链接）所有二进制构件所得到的结果。'
  merge: -1
  img_proc: true
