- pgno: 418
  md: '# # 六、面向对象的集成测试


    集成测试是探寻导致构件交互错误的构件错误，集成测试策略包括：


    +   - 哪些构件是集成测试的重点？

    +   - 构件接口应该以什么样的顺序进行检测？

    +   - 应该使用哪种测试设计技术检测每个接口？


    增量式集成是最有效的技术：一次增加少数几个构件，然后测试它们的互操作性。'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 范围


    面向对象开发中的集成测试开始得早，在所有范围中都会进行，并且在每个开发增量中重复：


    +   □在 一个类中

    +   □在 一个类层次中

    +   □在 一个客户和它的服务者中

    +   □在 一个相关类的簇中

    +   □在 一个子系统中

    +   □在 一个应用系统中'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# # 集成故障（1）


    +   - 配置/版本控制问题

    +   - 遗漏、重叠或冲突的函数

    +   - 文件或数据库使用不正确或不一致的数据结构

    +   - 文件或数据库使用冲突的数据视图/用法

    +   - 破坏全局存储或数据库的数据完整性

    +   - 由于编码错误或未预料到的动态绑定导致的错误方法调用

    +   - 客户发送违反服务对象前提条件的的消息

    +   - 客户发送违反服务对象的顺序约束的的消息

    +   - 错误的对象和消息的绑定（多态目标）'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# # 集成故障（2）


    +   - 错误参数或不正确的参数值

    +   - 由不正确的内存管理分配/回收引起的失败

    +   - 不正确的使用虚拟机、ORB或OS服务

    +   - 目标环境的服务已经过时

    +   - 目标环境当前不支持试图使用的新服务

    +   - 构件之间的冲突

    +   - 资源竞争'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 集成测试的设计样式 (1)


    □ 大爆炸集成: 试图通过同时测试所有的构件以论证系统稳定性的。


    □ 自底向上集成: 依据使用相依性来交错进行构件和集成测试。


    □ 自顶向下集成: 依据使用控制层次来交错进行构件和集成测试。


    □ 协作集成: 根据协作的构件和它们之间的相依性选择一个集成次序，通过一次测试一个协作组来检测接口。


    □ 基于集成: 结合了自顶向下、自底向上和大爆炸集成，以达到一个支持迭代开发的稳定系统。'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# # 集成测试的设计样式（2）


    +   - 层次集成：增量式的检测一个层次体系结构中的结构和构件。

    +   - 客户/服务器集成：检测一个构件松散连接的网络，其中所有构件使用一个公用的服务器构件。

    +   - 分布服务集成：检测一个对等构件松散连接的网络。

    +   - 高频集成：开发并重运行一个集成测试包进行每小时、每日或每周测试。'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# # 大爆炸集成


    # ## 目标


    +   - 通过少数测试运行检测整个系统来论证系统的稳定性。


    # ## 上下文和故障模型


    +   - 不考虑构件之间的相依性或风险；只有少数几个构件被加入或修改；每个构件都通过了充分的构件范围测试；无法分别对构件进行检测。


    # ## 策略


    +   - 在系统范围应用一个测试包。'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# # 自底向上集成


    # ## 目标


    +   - 从具有最少相依性的构件开始，按照使用相依性的次序将构件加入被测系统，以证实稳定性。


    # ## 上下文和故障模型


    +   - 具有最少相依性的构件最先测试，当这些构件通过测试后，用它们的客户对象替换驱动模块，再开始下一轮测试。


    # ## 策略


    +   - 以在相依性树中从叶子移动到根的方式进行，如果树有n级，则需要n个阶段。'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# 自顶向下集成


    # 目标


    +   - 从顶层控制对象开始，以控制层次的顺序向SUT增加构件以论证稳定性。


    # 上下文和故障模型


    +   - 首先测试控制对象，增量式开发，并行硬件/软件开发，并行软件开发；框架开发。


    # 策略


    +   - 从最高控制层构件开始测试，以桩的形式实现服务对象。

    +   - 每一层按宽度优先进行，用实现代替桩，并为下面低层服务对象设置桩对象，指导系统测试完。'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# # 协作集成


    # ## 目标


    +   - 通过向SUT中加入构件集合证明稳定性，该集成被要求支持一个特定的协作。


    # ## 上下文和故障模型


    +   - 检测协作参与者之间的接口并根据协作组织集成；它们的顺序可以根据相依性或顺序激活约束或根据二者共同来选择。


    # ## 策略


    +   - 为被测系统开发相依性树。

    +   - 选择应用协作的序列。

    +   - 为协作开发运行测试包。'
  merge: -1
  img_proc: true
- pgno: 428
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 429
  md: '# # 层次集成


    # ## 目标


    +   - 层次集成使用增量式的方法验证一个层次体系结构中的稳定性。


    # ## 上下文和故障模型


    +   - 为一个允许只有相邻层之间接口的层次建模；通过层间的消息传播可能必须满足一个严格的、实时的期限。


    # ## 策略


    +   - 单独测试每一层。

    +   - 层次集成可能是自顶向下或自底向上的。'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# # 客户/服务器集成


    # ## 目标


    +   - 从单独测试客户和服务对象开始，使用受控增加直到所有接口被测试。


    # ## 上下文和故障模型


    +   - 通过客户/服务器集成序列达到：并行的开发和测试是可能。


    # ## 策略


    +   - 每个客户用服务器的桩测试；该服务器用所有客户类型的桩测试，然后去掉桩进行实际测试。


    +   - 可以递归的应用于三重或n重客户/服务器体系。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# # 分布服务集成


    # ## 目标


    +   - 论证松散耦合的对等构件之间的交互的稳定性。


    # ## 上下文和故障模型


    +   - 被测系统包括许多并发运行，没有专一的控制轨迹；没有专一的服务器层。


    # ## 策略


    +   - 风险驱动，从最可能有问题的接口和构件开始。


    +   - 反风险驱动，从最不可能有问题的接口和构件开始。


    +   - 相依性驱动，从依赖最少的构件开始。


    +   - 优先驱动，从验证高优先级性能需要的接口和构件开始。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# # 高频集成




    - 频繁的将新代码和已稳定化的基线集成在一起，以免集成故障不能被发现，以及防止运行的、稳定化的基线偏差。




    - 一个稳定的增量是可得到的；大多有意义的功能增量可以在频率间隔内产生；测试和代码可并行开发；高频集成必须是自动化的；必须安装并常规使用配置管理工具。




    +   - 开发者产生要集成的代码增量和相关的测试包。


    +   - 测试员将开发者的修改汇总并运行集成测试包。


    +   - 评价结果，并立即纠正任何问题。'
  merge: -1
  img_proc: true
