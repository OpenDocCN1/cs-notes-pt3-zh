- pgno: 363
  md: '# # 一、软件测试的基本概念


    +   - 软件错误


    +   - 软件系统的功能和性能与预期的功能和性能不一致


    +   - 软件测试是发现软件错误的过程


    +   - 尽早测试，经常测试，充分测试


    +   - 目标


    +   - 发现软件中的错误，提高软件质量


    +   - 注意：软件测试中没有发现错误并不意味着软件就没有错误 => 测试不充分，潜在错误未能发现'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# # 软件测试的方法


    # ## 白盒测试


    +   - 已知程序内部工作流程，通过测试检验程序内部动作是否按规格说明书的规定正常运作


    # ## 黑盒测试


    +   - 根据已知程序的功能和性能（而不是内部细节），通过测试检验每个功能和性能是否正常'
