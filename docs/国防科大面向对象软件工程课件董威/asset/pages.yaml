- pgno: 405
  md: "# 方法范围测试：基本过程\n\n+   1. 设置测试消息的参数、类变量、全局变量为希望的状态。\n+   2. 设置被测对象为希望的状态。\n+\
    \   3. 从驱动模块向该MUT发送测试消息。\n+   4. 测试检查：\n+      1. 比较从该MUT返回的值和期望的值。若不同，记录未通过。\n\
    +      2. 比较该MUT的状态和期望的状态。若不同，记录未通过。\n+      3. 若使用按引用调用，比较测试消息参数的状态和期望的状态。若不同，记录未通过。\n\
    +      4. 捕获所有异常。假如是期望的异常，确定它是否正确。假如无异常或有一个不正确的异常，记录未通过。\n+      5. 假如一个断言的违反是期望的，确定它是否正确。若不是期望的，记录未通过。\n\
    +      6. 假如必要，比较类变量、全局变量的结果状态与期望的值，假如有不期望的，记录未通过。\n+   5. 假如发生任何未通过，诊断和矫正该问题\n\
    +   \n+   测试提示：记录所花费的时间，对度量进一步的测试预算有益。"
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # 方法范围测试设计样式


    +   1. 范畴划分


    +   2. 组合功能测试


    +   3. 递归功能测试


    +   4. 多态消息测试'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# # 范畴划分


    # ## 目标


    +   - 根据输入/输出分析，设计方法范围测试包。


    # ## 上下文和故障模型


    +   - 假定故障与消息参数和实例变量值的组合有关，也假定这种故障将导致遗漏或错误的方法输出。


    # ## 策略


    +   - 标识每个功能的输入参数的范畴，范畴必须导致不同的输出；

    +   - 把每个范畴划分为选择；

    +   - 通过枚举所有选择的组合产生测试实例。'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 组合功能测试


    # □ 目标


    - 为了根据状态和 I 或消息值的组合选择器状态，设计一个测试包。


    # □ 上下文和故障模型


    - 一个方法根据消息参数和实例变量的组合，选择很多不同动作中的一个时，选择输入组合以便适当地检测选择逻辑。


    # □ 策略


    - 对每个动作最少开发一个测试。'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 递归功能测试


    # 目标


    — 对一个调用自己的方法，设计一个测试包。


    # 上下文和故障模型


    — 递归方法接受不正常的参数值、没有足够的栈空间或基本条件不能到达时，都会使递归失败。


    # 策略


    — 零次递归；一次递归；递归最大允许的或可行的深度；破坏初始调用、下降阶段和上升阶段的前置、后置条件。'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 多态消息测试


    # □ 目标


    +   - 多态服务执行所有客户与服务器的编联，对这种多态服务的一个客户端开发测试。


    # □ 上下文和故障模型


    +   - 不能满足所有可能编联的前置条件；不希望的名字解析或指针的不正确构造，发生一个不希望的编联；服务类的实现发生了变化或扩充。


    # □ 策略


    +   - 对MUT中每个多态消息的每种可能编联最少检测一次。'
  merge: -1
  img_proc: true
