  md: '# # Detailed Iteration Life Cycle Activities


    # ## Iteration planning


    +   - Before the iteration begins, the general objectives of the iteration should
    be established based on

    +     - Results of previous iterations ( if any)

    +     - Up-to-date risk assessment for the project

    +   - Determine the evaluation criteria for this iteration

    +   - Prepare detailed iteration plan for inclusion in the development plan

    +     - Include intermediate milestones to monitor progress

    +     - Include walkthroughs and reviews


    # ## 7.3 The Iterative Development Process'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# # Detailed Iteration Life Cycle Activities (cont.)


    # ## Requirements Capture


    +   - Select/define the use cases to be implemented in this iteration

    +   - Update the object model to reflect additional domain classes and associations
    discovered

    +   - Develop a test plan for the iteration


    # ### 7.3 The Iterative Development Process'
  merge: -1
  img_proc: true
- pgno: 278
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 279
  md: '# # Detailed Iteration Life Cycle Activities (cont.)


    +   - Test

    +     - Integrate and test the developed code with the rest of the system (previous
    releases)

    +     - Capture and review test results

    +     - Evaluate test results relative to the evaluation criteria

    +     - Conduct an iteration assessment

    +   - Prepare the release description

    +     - Synchronize code and design models

    +     - Place products of the iteration in controlled libraries


    7.3 The Iterative Development Process'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# # Work Allocation Within an Iteration


    +   - Work to be accomplished within an iteration is determined by

    +     - The (new) use cases to be implemented

    +     - The rework to be done


    +   - Packages make convenient work packages for developers

    +     - High-level packages can be assigned to teams

    +     - Lower-level packages can be assigned to individual developers


    +   - Use Cases make convenient work packages for test and assessment teams


    +   - Packages are also useful in determining the granularity at which configuration
    management will be applied

    +     - For example, check-in and check-out of individual packages'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Iteration Assessment


    +   • Assess iteration results relative to the evaluation criteria established
    during iteration planning:

    +   - Functionality

    +   - Performance

    +   - Capacity

    +   - Quality measures


    +   • Consider external changes that have occurred during this iteration

    +   - For example, changes to requirements, user needs, competitor’s plans


    +   • Determine what rework, if any, is required and assign it to the remaining
    iterations'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Selecting Iterations


    +   - **How many iterations do I need?**

    +     - On projects taking 18 months or less, 3 to 6 iterations are typical

    +   - **Are all iterations on a project the same length?**

    +     - Usually

    +     - Iteration length may vary by phase. For example, elaboration iterations
    may be shorter than construction iterations'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# The First Iteration


    +   - The first iteration is usually the hardest


    +   - Requires the entire development environment and most of the development
    team to be in place


    +   - Many tool integration issues, team-building issues, staffing issues, etc.
    must be resolved


    +   - Teams new to an iterative approach are usually overly-optimistic


    +   - Be modest regarding the amount of functionality that can be achieved in
    the first iteration


    +   - Otherwise, completion of the first iteration will be delayed,


    +   - The total number of iterations reduced, and


    +   - The benefits of an iterative approach reduced'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# # There Is No Silver Bullet


    +   - Remember the main reason for using the iterative life cycle:

    +     - You do not have all the information you need up front

    +     - Things will change during the development period


    +   - You must expect that

    +     - Some risks will not be eliminated as planned

    +     - You will discover new risks along the way

    +     - Some rework will be required; some lines of code developed for an iteration
    will be thrown away

    +     - Requirements will change along the way


    7.3 The Iterative Development Process'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Summary


    # Analysis and Design Process with UML:


    +   1. Identify actors and use cases

    +   2. Realize use cases with sequence and / or collaboration diagrams

    +   3. Describe classes and their relationships in the logical view

    +   4. Create state diagrams for objects

    +   5. Illustrate the organizations and dependencies among software components
    with component diagrams

    +   6. Visualizes configuration and distribution with deployment diagrams


