  md: "# § 6.3.4 活动(Activity)图\n\n描述某一行为的动作过程  \n（例如，类的方法、用例、对象内部工作流程等）\n\n+   活动：在概念模型中，活动是某项任务或子任务。\
    \  \n+   在规范和实现层，活动对应于类的方法\n\n+   活动完成后由Trigger引发后续活动  \n+   Trigger是活动图的边  \n\
    +   Trigger中可以包含条件\n\n+   活动图用并发条（synchronization bar）表示并发和同步  \n+   多重Trigger也可以表示并发\n\
    \n+   对象可以出现在活动图中，作为活动的输入/出，  \n+   或表示对象与活动之间的相关性"
