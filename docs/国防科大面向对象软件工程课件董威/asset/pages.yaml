- pgno: 169
  md: '# 架构的分类


    # § 6.2 UML静态建模机制


    ![](img/134871fe98cb20245c2dff1445580eb9_169_0.png)


    +   - 可以用很多视图来描述架构，每一张视图集中描述系统的某一个方面。

    +   - 一个较广的分类方法将架构分解成逻辑和物理架构。

    +     - 逻辑架构主要指定系统的功能特点，通过系统的功能需求来描述；

    +     - 物理架构则描述系统的非功能部分，如可靠性、兼容性、资源使用和系统分布；'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 逻辑架构


    # § 6.2 UML静态建模机制


    +   逻辑架构处理系统的功能，将功能分配到系统的各个部分，详细说明它们是如何工作的。


    +   逻辑架构包括应用逻辑，但不是将逻辑物理上分布到不同的进程、程序或计算机。


    +   逻辑架构有助于更清楚地了解系统的结构，使得更容易管理和协调工作（尽可能有效地利用人力开发资源）。


    +   并不是逻辑架构的所有部分都需要在工程中开发。（如类库、二进制构件和模式只需购买）。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 逻辑架构


    # § 6.2 UML静态建模机制


    逻辑架构解决下面的问题


    +   系统提供什么样的功能？


    +   哪一个类存在，类之间是如何联系在一起？


    +   类和对象是如何协作来完成系统功能？


    +   什么是系统功能的时间约束？


    +   许多开发人员在开发架构时都遵循的一个合适的计划是什么样？'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# UML中的逻辑架构：


    +   - 用例;

    +   - 类;

    +   - 包;

    +   - 状态;

    +   - 活动;

    +   - 协作;

    +   - 序列。'
  merge: -1
