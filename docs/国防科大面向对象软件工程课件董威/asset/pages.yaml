- pgno: 6
  md: '# 面向对象的开发过程概览


    # 1. 问题描述


    +   - 建立自动柜员机(ATM)系统软件。整个ATM系统包括ATM、中央服务器、ATM系统软件及界面软件。


    +   - ATM系统软件的任务是处理ATM与银行电脑之间的交易：

    +     - 查账

    +     - 存款

    +     - 取款


    +   - 使用本系统的银行有多家。每家银行都有各自的电脑系统，处理其客户的帐号和交易。


    +   - 所有ATM均通过一台中央服务器与每家银行的电脑系统通信。


    +   - 对所有从ATM上发生的交易，必须记录详细的日信息。


    +   - 必须考虑系统未来的扩展，如增加Web客户端。'
  merge: -1
  img_proc: true
