- pgno: 80
  md: "# §4.3.5 标识服务和消息\n\n# 对ECS，有三种选择：\n\n+   • 集中控制方法，设置ElevatorScheduler对象，通过接收召唤事件和目的地请求事件，随时监控电梯状态，实现调度策略\n\
    +   \n+   • 每个Elevator对象自行决定下一目标楼层，多个Elevator对象之间应相互协调\n+   \n+   • 每个Floor对象在电梯到达该楼层时实现电梯调度，多个Floor对象之间应相互协调\n\
    \n# 以上方案的选择取决于以下考虑：\n\n+   • 结构简单、自然，强内聚、松耦合\n+   • 软件可扩充性、可修改性、可维护性好\n+   • 可重用性好"
  merge: -1
  img_proc: true
