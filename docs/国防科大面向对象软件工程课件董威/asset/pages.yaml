- pgno: 38
  md: '# §3.2 初步需求获取技术


    # 1 访谈和会议：


    +   - 循序渐进

    +   - 不应限制用户在回答问题时自由发挥

    +   - 问题汇总后，能反映整个(子)问题的全貌


    # 2 观察用户工作流程：


    +   - 改进手工流程，挖掘潜在需求


    # 3 用户和开发人员共同组成联合小组：


    +   - 制定并遵守工作制度和计划'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# §3.3 需求建模


    +   - 建模是刻画、分析和解决问题的有效途径

    +   - 需求模型详细、准确地描述用户对目标软件系统在功能、行为等方面的要求

    +   - 建模有助于分析人员全面、系统地了解用户需求;

    +   - 有助于发现用户需求描述中的不一致性和模糊性

    +   - 有助于确保需求规格说明书的准确、一致、全面性'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# §3.4 问题抽象、问题分解和多视点分析


    # 1 问题抽象：


    +   - 在某个层次上认识和表示事物，抽取事物的某些特性和行为

    +   - 抽象有助于控制问题的复杂度

    +   - 抽象有助于获取和分析问题本身所固有的一般——特殊关系


    # 2 问题分解：


    +   - 高内聚，低耦合原则；自然性原则

    +   - 分解有助于获取和分析问题本身所固有的部分——整体关系


    # 3 多视点分析：


    +   - 从多角度、多视点对问题进行理解、分析

    +   - 然后综合成为全面的需求模型'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# §3.5 支持需求分析的原型技术


    +   - 快速生成一个简单、初步的需求模型

    +   - 快速设计（主要关心目标软件系统的总体结构、用户界面和核心数据结构）

    +   - 实现原型（不考虑效率问题）

    +   - 将原型提交给用户评审，征询改进意见

    +   - 重复以上过程，直至需求模型一致化、完全化'
  merge: -1
  img_proc: true
