- pgno: 114
  md: '# § 6.1.1 UML的主要内容


    # 什么是UML？


    +   - UML表示Unified Modeling Language

    +   - UML把下面一些先进的技术结合起来：

    +     - 数据建模概念（实体关系图）

    +     - 商业建模（工作流）

    +     - 对象建模

    +     - 组件建模

    +     - 行为建模


    +   - UML是用来对软件相关系统进行可视化、规范、创建和建立文档的标准语言

    +   - UML可以用在所有的过程中，贯穿整个开发周期，并跨越不同的实现技术'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# § 6.1.1 UML的主要内容


    # 为什么需要UML？


    +   1. 面对众多的建模语言，用户由于没有能力区别不同语言之间的差别，因此很难找到一种比较适合其应用特点的语言；

    +   2. 众多的建模语言实际上各有千秋；

    +   3. 虽然不同的建模语言大多类同，但仍存在某些细微的差别，极大地妨碍了用户之间的交流。


    > 因此在客观上，极有必要在精心比较不同的建模语言优缺点及总结面向对象技术应用实践的基础上，组织联合设计小组，根据应用需求，取其精华，去其糟粕，求同存异，统一建模语言。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# § 6.1.1 UML的主要内容


    # § 6.1 UML概述


    +   - **UML（Unified Modelling Language）表示法**

    +     - UML的符号、文本语法、图形机制

    +     - 用来表达应用问题在需求、设计和实现级的模型


    +   - **UML语义**

    +     - 用UML表示法描述UML的元模型

    +     - 元模型为UML的所有语法元素的语义提供定义性说明


    +   - **UML的可视化建模机制**分为静态和动态：

    +     - 静态机制包括：用例图、类图、对象图、包图、构件图、配置图

    +     - 动态机制包括：顺序图、合作图、状态图、活动图'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# § 6.1 UML概述


    # § 6.1.2 UML的历史


    +   - 80年代末期到90年代，各种OO软件开发方法纷纷涌现：OOA/OOD, Booch, OMT, OOSE... ...

    +   - 1994年10月， Booch和Rumbaugh统一Booch93和OMT2， 发布UML0.8

    +   - 1995秋， Jacobson加盟Rational， 1996年6月发布UML0.9， 1996年10月发布UML0.91

    +   - 1997年UML获众多著名软件公司的支持， 11月被OMG接纳为标准

    +   - 1998年UML发展到UML1.4， 相应的软件开发环境Rational Rose正式推出

    +   - 2003年UML发展到UML2.0'
  merge: -1
  img_proc: true
