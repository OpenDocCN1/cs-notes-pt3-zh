  md: '# Risk Management Phase-by-Phase


    +   - Inception

    +   - Bracket the project’s risks by building a proof of concept


    +   - Elaboration

    +   - Develop a common understanding of the system’s scope and desired behavior
    by exploring scenarios with end users and domain experts

    +   - Establish the system’s architecture

    +   - Design common mechanisms to address system-wide issues'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# # Risk Management Phase-by-Phase (cont.)


    +   - Construction

    +     - Refine the architecture

    +     - Risk-driven iterations

    +     - Continuous integration


    +   - Transition

    +     - Facilitate user acceptance

    +     - Measure user satisfaction


    +   - Post-deployment cycles

    +     - Continue evolutionary approach

    +     - Preserve architectural integrity


    7.3 The Iterative Development Process'
  merge: -1
