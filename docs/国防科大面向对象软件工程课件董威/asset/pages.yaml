- pgno: 223
  md: '# §6.3.5 动态建模方法


    § 6.3 UML动态建模机制


    +   • 不要对系统中所有类的对象绘制状态图

    +     状态图只用于描述行为复杂的对象


    +   • 顺序图和合作图适于描述单个用例中多个对象的行为


    +   • 状态图适于描述跨越多个用例中单个对象的行为


    +   • 活动图适于描述并发的、较复杂的行为'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 第六章 UML简介


    # 对UML的批评


    UML在取得巨大成功的同时，也不断地受到批评：


    来自工业界的批评主要是，它过于庞大和复杂，用户很难全面、熟练地掌握它，大多数用户实际上只使用它一少部分的概念；它的许多概念含义不清，使用户感到困惑。


    来自学术界的批评则主要针对它在理论上的缺陷和错误，包括语言体系结构、语法、语义等方面的问题。'
  merge: -1
  img_proc: true
