- pgno: 239
  md: '# # Maintain Curriculum Flow of Events


    +   - This use case begins when the Registrar logs onto the Registration System
    and enters his/her password. The system verifies that the password is valid (E-1)
    and prompts the Registrar to select the current semester or a future semester
    (E-2). The Registrar enters the desired semester. The system prompts the registrar
    to select the desired activity: ADD, DELETE, REVIEW, or QUIT.


    +   - If the activity selected is ADD, the S-1: Add a Course subflow is performed.


    +   - If the activity selected is DELETE, the S-2: Delete a Course subflow is
    performed.


    +   - If the activity selected is REVIEW, the S-3: Review Curriculum subflow is
    performed.


    +   - If the activity selected is QUIT, the use case ends.


