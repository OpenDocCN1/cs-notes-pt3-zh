- pgno: 287
  md: '# # ATM Requirements (1)


    The software to be designed will control a simulated automated teller machine
    (ATM) having:


    +   - a magnetic stripe reader for reading an ATM card;

    +   - a customer console (keyboard and display) for interaction with the customer;

    +   - a slot for depositing envelopes;

    +   - a dispenser for cash (in multiples of $20);

    +   - a printer for printing customer receipts;

    +   - a key-operated switch to allow an operator to start or stop the machine;

    +   - and the ATM will communicate with the bank’s computer over an appropriate
    communication link.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# ATM Requirements (2)


    The ATM must be able to provide the following services to the customer:


    +   1. A customer must be able to make a cash withdrawal from any suitable account
    linked to the card, in multiples of $20.00.

    +   2. A customer must be able to make a deposit to any account linked to the
    card, consisting of cash and/or checks in an envelope.

    +   3. A customer must be able to make a transfer of money between any two accounts
    linked to the card.

    +   4. A customer must be able to make a balance inquiry of any account linked
    to the card.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# ATM Requirements (3)


    +   - A customer must be able to abort a transaction;

    +   - The ATM will communicate each transaction to the bank and obtain verification
    that it was allowed by the bank;

    +   - The ATM will provide the customer with a printed receipt for each successful
    transaction;

    +   - The ATM will have a key-operated switch that will allow an operator to start
    and stop the servicing of customers;

    +   - The ATM will also maintain an internal log of transactions.'
  merge: -1
  img_proc: true
