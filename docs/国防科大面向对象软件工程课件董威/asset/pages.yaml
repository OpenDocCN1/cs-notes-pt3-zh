  md: '# # 五、类的测试


    +   - 类的测试相对于传统单元测试。


    +   - 为什么？


    +   - 若类的测试不足，则很多错误不能被查出；


    +   - 通过客户类去测试服务类是困难的；


    +   - 错误发现得越晚，纠正的代价越大；


    +   - 有效的类测试减少开发时间，提高生产率。'
  merge: -1
