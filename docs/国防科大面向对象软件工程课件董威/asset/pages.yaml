- pgno: 374
  md: '# # 状态机


    +   - 状态机是一个系统，它的输出是由当前的输入和过去的输入决定。


    +   - 状态机的构成：


    +   - 状态


    +   - 转换


    +   - 事件


    +   - 动作'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# # 状态机的机制


    +   1. 机器开始于初态；

    +   2. 机器在一个不确定的时间间隔等待一个事件；

    +   3. 如果一个事件在当前状态没有被接受，则被忽略；

    +   4. 如果事件在当前状态被接受，则说指定的转换被触发；

    +   5. 从2开始重复这个周期，直到结果状态变成终止状态。'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 基于状态的行为建模的范围


    +   - JavaAWT, MS/Windows, Unix X-Windows等的GUI界面元素的行为；


    +   - 商业对象（类）的行为和它们的生存循环：订单，顾客，存货单等；


    +   - 通信设备：路由器，modem控制器，电话，手持无线设备等；


    +   - 具有重试、重新开始、重新恢复功能的设备驱动器；


    +   - 命令语法分析器；


    +   - 长期的数据库事务；


    +   - 移动控制系统：航空电子控制系统，自动巡航系统，机器人等。'
  merge: -1
  img_proc: true
