- pgno: 15
  md: '# §1.1 软件工程的目标


    在给定成本、进度的前提下，开发出具有：


    +   - 正确性、可靠性、有效性、

    +   - 可理解性、可修改性、可维护性、可移植性、

    +   - 可重用性和可追踪性


    的软件产品'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# §1.2 软件工程的原则


    +   - 抽象

    +   - 信息隐藏（局部化）

    +   - 模块化（高内聚，低耦合）

    +   - 一致性

    +   - 完全性

    +   - 可验证性'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# §1.3 软件质量控制


    # §1.3.1 软件质量要素


    # 1. 关于软件的运行特征


    正确性: 软件满足规格说明及完成用户目标的程度


    可靠性: 在给定时间间隔内，软件成功运行的概率


    有效性: 软件的时空效率


    完整性: 控制未被授权人员访问程序和数据的程度


    可用性: 使用软件的难易程度'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 2.关于软件承受修改的能力


    可理解性: 结构清晰, 直接反映问题需求, 易理解


    可维护性: 软件交付使用后进行修改的难易程度


    灵活性: 改变软件的功能或行为所需的工作量


    # 3.关于软件对新环境的适应能力


    可移植性: 软件从一个环境移到另一个的难易程度


    可重用性: 软件件可以在多种场合应用的程度


    可互操作性: 多个软件交换信息并相互使用已交换信息的能力'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# §1.3.2 软件质量控制方法


    +   ◆ 系统化的开发方法与工具

    +   例如， OOA, OOD & OOP


    +   ◆ 良好的软件结构：

    +   高内聚，低耦合

    +   信息隐藏

