- pgno: 173
  md: '# 物理架构


    # § 6.2 UML静态建模机制


    +   - 物理架构详细描述系统的软件、硬件。

    +   - 描述硬件结构，包括不同的节点以及节点间如何连接。

    +   - 说明实现逻辑架构中定义的概念的代码模块的物理结构和相关性。

    +   - 软件运行时进程程序和其它组件的分布。

    +   - 物理架构试图有效地利用软硬件资源。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 物理架构


    # § 6.2 UML静态建模机制


    物理架构解决下面的问题：


    +   - 类和对象物理上分布在哪一个程序或进程中？

    +   - 程序和进程在哪台计算机上运行？

    +   - 系统中有哪些计算机和其它的硬件设备？它们是如何连接在一起？

    +   - 不同的代码文件之间有可关联？如果某一文件被改变，其它的文件是否需要重新编译？


    物理架构描述软硬件的分解，将逻辑架构映射到物理架构，逻辑架构中的类和机制被映射到物理架构中的组件、进程和计算机。这种映射允许开发者根据逻辑架构中的类找到它的物理实现。反之亦然；跟踪程序或组件的描述找到它在逻辑架构中的设计。'
  merge: -1
  img_proc: true
