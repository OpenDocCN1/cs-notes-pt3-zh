    \n- 需求调查所获取和文档化(文字)的软件需求不能有效地描述软件需求\n  - 文字描述的局限性(不准确、二义、歧义、不能直观揭示关联)\n  - 不准确\n\
    \  - 不一致\n  - 不全面\n  - ......\n\n## 如何对软件需求进行建模(1/2)\n\n### 需求建模技术\n\n- 面向数据流的需求建模技术\n\
