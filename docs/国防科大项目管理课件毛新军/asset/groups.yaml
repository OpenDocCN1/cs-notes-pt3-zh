    \n- PTT会议结束。\n\n### 持续时间\n\n- 1–8小时\n\n## 步骤6：分发PTT会议记录\n\n### 任务描述\n\n- 形成PTT会议记录。\n\
    - 向PTT成员分发了会议记录。\n\n### 入口条件\n\n- PTT会议结束。\n\n### 出口条件\n\n- 形成并分发了PTT会议记录。\n\n\
    ### 持续时间\n\n- 2天\n\n## 讲授内容\n\n- 项目案例\n- 什么是软件项目跟踪？\n- 为什么需要对软件项目进行跟踪\n- 软件项目跟踪会议\n\
    - 软件项目跟踪的过程和步骤\n- CMM对软件项目跟踪的要求\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_444_0.png)\n\
    \n## CMM对软件项目跟踪的要求\n\n- 软件项目跟踪是CMM二级的关键过程域。\n- 所谓的软件项目跟踪和监督是指对软件项目的实际进展建立适当的可视性，使管理者能在软件项目实际进展明显偏离软件计划时采取有效措施。\n\
    - 软件项目跟踪和监督的任务：\n  - 对照文档化的估计、承诺和计划评审，跟踪软件完成的情况和结果，根据实际完成的情况和结果调整这些计划。\n- 软件项目的文档化的计划将作为跟踪软件活动、通报状态和修订计划的基础。\n\
    - 软件活动由管理者来监控，主要通过在所选软件工作产品完成时以及在选择的里程碑处，将实际的软件规模、工作量、成本和进度与计划相比较，来确定软件项目进展情况。\n\
    - 当确认软件项目计划未被完成时，采取纠正措施。\n\n共24个关键实践，对软件项目跟踪提出了明确的要求：\n\n| 关键实践类 | 关键实践数目 |\n\
    |---|---|\n| 制定方针政策 | 2 |\n| 确保必备条件 | 5 |\n| 实施软件过程 | 13 |\n| 度量和分析 | 1 |\n| 检查实施情况\
    \ | 3 |\n\n### 目标\n\n- 对照软件开发计划，跟踪项目实施的实际结果和性能。\n- 当实际的结果和性能明显偏离软件开发计划时，采取纠正措施，并加以管理直到结束。\n\
    - 对软件承诺的更动得到受影响组和个人的认可。\n\n### 制定方针政策\n\n- 项目软件负责人对项目的软件活动和结果负责。\n- 项目遵循一个书面的、由组织制定的用以管理软件项目的方针：\n\
    \  - 软件项目将采用并维护一个文档化的软件开发计划来作为跟踪软件项目的基础。\n  - 随时向项目负责人报告软件项目的状态和问题。\n  - 当软件计划未被实现时，采取纠正措施，或者调整性能，或者调整计划。\n\
    \  - 在受影响组参与和认可的情况下对软件承诺进行更动。\n  - 高级管理者对所有的承诺更动和软件项目对组织外的个人和组所作的新的承诺进行评审。\n\n\
    ### 确保必备条件\n\n- 项目软件的开发计划已被写成文档并已批准。\n- 项目软件负责人对软件工作产品和活动负责，并对下列内容负责：\n  - 待开发的软件工作产品和提供的服务\n\
    \  - 这些软件活动的工作量和成本\n  - 这些软件活动的进度\n  - 这些软件活动的预算\n- 为跟踪软件项目提供足够的资源和经费。\n- 对项目软件负责人进行软件项目的技术和人员管理方面的培训：\n\
    \  - 项目管理技术\n  - 跟踪和监督软件规模、工作量、成本及进度\n  - 管理人员\n- 对有关组的负责人进行软件项目技术方面的定向培训，定向培训的例子包括：\n\
    \  - 项目的软件工程标准和规程\n  - 项目的应用领域知识\n\n### 实施软件过程\n\n- 将文档化的软件开发计划用来跟踪软件活动和通报状态。\n\
    \  - 软件开发计划随着工作的进展而更新，以便反映完成情况，特别当里程碑被完成时。\n  - 软件开发计划的状态应传递到以下小组和人员：\n    - 软件工程组（包括所有的小组，例如软件设计小组）\n\
    \    - 项目软件负责人\n    - 项目负责人\n    - 高级管理者\n    - 其它受影响组\n- 按照文档化的规程，修订项目的软件开发计划。\n\
    \  - 适时地修订软件开发计划，以便对计划进行必要的细化和更动。\n  - 更新软件开发计划，以便把所有新的软件项目承诺和对承诺的更动纳入计划。\n  -\
    \ 软件开发计划在每次修订时都应进行评审。\n  - 软件开发计划应受管理和控制。\n- 将经批准的、影响软件项目承诺的更动通报软件工程组和其它软件有关组的成员，其它软件有关组的例子包括：\n\
    \  - 软件质量保证组\n  - 软件配置管理组\n  - 文档支持组\n"
