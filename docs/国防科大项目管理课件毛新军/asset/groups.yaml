    - 用户其实包含A、B两个公司，由于A是外地公司，由B公司负责系统运营，B公司偷偷提出增加能修改数据库数据的功能

    - 系统安装时发现网络设备还没到货


    - 系统财务管理由A、B两公司人员共同监控管理，但由于B公司不希望过早记录所有车辆收费信息，不配合做系统安装

    - 系统安装成功后，B公司运营人员故意破坏系统，使系统在试运行期间经常出现各种非软件故障，导致系统无法验收


    ## 4. 质量保证问题


    假设你负责项目的质量保证，当你发现项目组出现下面情况时，你要怎么处理：


    - SRS没有按照公司的规范书写；

    - 通过评审的SRS和用户的实际需求存在偏差；

    - 编程人员提交的代码和详细设计中的描述有偏差；

    - 你希望检查初步设计文档时，初步设计活动负责人以各种理由推托，拒绝提交。


    ## 6. 经验积累问题


    - 在项目实施过程中，哪些地方可能获取一些经验？

    - 如何尽可能多、尽可能快地获取经验？

    - 如何运用以前积累的经验？


