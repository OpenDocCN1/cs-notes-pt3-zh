  md: "\n\n## 软件项目管理课程之第7讲 软件需求管理\n\n毛新军  \nxjmao21@21cn.com  \nhttp://software.nudt.edu.cn/~xjmao\
    \  \n计算机科学与技术系602教研室  \n0731-(45)73649\n\n![](img/f5d721251af5f768deee90a8ee1528f0_535_0.png)\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_535_1.png)\n\n## 讲授内容\n\n- 项目案例\n-\
    \ 什么是软件需求\n- 如何进行软件需求分析\n- 软件需求管理\n- CMM对需求管理的要求\n- 本讲小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_536_0.png)\n\
    \n## 项目案例\n\n### 案例角色和人物\n\n![](img/f5d721251af5f768deee90a8ee1528f0_537_0.png)\n\
    \n- 小王：软件项目负责人\n\n![](img/f5d721251af5f768deee90a8ee1528f0_537_1.png)\n\n- 老王：公司技术老总\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_537_2.png)\n\n- 开发小组：小李，老赵，小田，小谢\n\n\
    ## 要对软件需求进行管理(2/2)\n\n- 更为糟糕的是，由于用户没有参加需求评审，使得许多软件需求没有得到用户的认可，最终所开发出的软件不能满足用户的要求，用户拒绝接收软件，并拒绝付款\n\
    - 由于软件需求的不准确性、不一致性和二义性，在软件开发阶段，软件设计人员不得不通过用户再次确认需求\n- 在开发过程中，用户的需求仍然在改变，需求分析小组负责获取改变的用户需求，然而这些改变了的需求没有得到有效的管理和控制，没能将变化的需求及时反馈给软件开发小组，导致这些需求未能在待开发的软件中得到体现\n\
    - 由于需求未能得到有效管理，在最终项目验收过程中出现了令人不愉快的情况，实际开发的软件没能完全反映用户的需求，导致用户不满意，项目延期\n\n## 案例提示我们\n\
    \n- 需求分析是极为重要的\n- 需求分析是困难和复杂的\n- 用户需求经常性的变更是正常的\n- 为了保证软件需求的质量，必须对需求分析的人、过程和产品进行有效管理\n\
    - 需求管理的不善将会导致严重后果\n\n## 项目项目管理问题\n\n- 什么是软件需求？\n- 如何进行软件需求分析？\n- 软件需求管理的内容？\n\
    - 如何对软件需求进行管理？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_541_0.png)\n\n## 讲授内容\n\
    \n1. 项目案例\n2. 什么是软件需求\n3. 如何进行软件需求分析\n4. 软件需求管理\n5. CMM对需求管理的要求\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_542_0.png)\n\
    \n## 软件需求\n\n1. 什么是软件需求？\n2. 获取软件需求的重要性\n3. 获取软件需求的复杂性和面临的问题\n4. 解决的方法和手段\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_543_0.png)\n\n## 什么是软件需求(1/4)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_544_0.png)\n\
    \n- 什么是软件需求？\n- 待开发软件产品的目标用户对该软件产品的功能、性能、设计约束和其它方面的期望和要求\n\n### 说明\n\n- 目标用户\n\
    \  - 实际操作该软件的用户(图书管理员)\n  - 用户方的负责人\n  - 用户代表(市场经理)，......\n- 必须是用户所需的\n  - 例如，网上图书借阅(想法很好，用户不需要，也不现实)\n\
    \n## 什么是软件需求(2/4)\n\n### 关于软件需求的注意事项\n\n- 软件需求关注用户的期望、要求和需要，不是解决方案\n- 要区分what和How\n\
    - 例如，要采用什么算法，不是用户需求\n- 并不是所有方面的要求都是软件需求\n- 功能、性能、设计约束、时间进度等\n- 例如，重量、软件大小等不是用户需求\n\
    - 并不是所有用户的期望和要求都是软件需求\n- 用户需求必须中肯，有意义\n- 例如，记录图书的厚度等不是用户需求\n\n## 什么是软件需求(3/4)\n\
    \n- 软件需求的表现形式\n  - 功能需求\n  - 性能需求\n    - 易用性、质量、性能、安全性，移植性、可重用性等\n  - 设计约束\n \
    \   - 运行环境\n    - 开发环境\n  - 其它要求：如开发周期\n\n## 获取软件需求的重要性\n\n- **软件开发的基础和前提**\n\
    \  - 只有在明确了软件需求之后才能开展有针对性的软件开发工作\n  - 没有需求无法进行设计和编码\n- **制定软件开发计划的基础**\n  - 只有知道你想做什么，才能知道做这些东西需要多少工作量\n\
    \  - 不知道软件需求也就不知道工作量的大小，因而不能制定计划\n- **最终目标软件系统验收的标准**\n  - 只有知道你想做什么，才能知道你最终是否做好了\n\
    \  - 没有定义明确的需求，就不知道最终基于什么进行验收\n\n## 获取软件需求的复杂性(1/2)\n\n- **系统复杂和庞大**\n  - 如何将软件需求得到？描述清楚？\n\
    - **片面，不完全**\n  - 如何保证得到了所有的软件需求？\n- **模糊，不准确**\n  - 如何保证把需求说清楚和准确？\n- **不一致，歧义**\n\
    \  - 如何保证所描述的需求是不矛盾的？\n- **及时性**\n  - 当需求变更时，如何让相关人员都知道需求已经变更？\n\n## 获取软件需求的复杂性(2/2)\n\
    \n- 软件需求变动带来的问题\n  - 波动性\n  - 放大性\n\n## 解决的方法和手段\n\n### 技术层面\n\n- 需求分析方法、技术和工具\n\
    - 方法：数据流、面向对象\n- 技术：抽象、建模、多视点、原型，......\n- 工具：UML，Rose，Word，Excel，RequisitePro\n\
    \n### 管理层面\n\n- 对需求分析中的人、活动和产品进行管理\n- 形成新的研究领域：需求工程\n\n## 讲授内容\n\n1. 项目案例\n2.\
    \ 什么是软件需求\n3. 如何进行软件需求分析\n4. 软件需求管理\n5. CMM对需求管理的要求\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_552_0.png)\n\
    \n## 软件需求分析\n\n1. 什么是软件需求分析\n2. 软件需求分析的任务\n3. 软件需求分析的目标\n4. 软件需求分析的过程\n\n![](img/f5d721251af5f768deee90a8ee1528f0_553_0.png)\n\
    \n## 什么是软件需求分析\n\n### 什么是软件需求分析？\n\n- 需求分析是指从用户处获得需求、形成与用户需求相一致的、可供阅读的软件需求规格说明书的过程\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_554_0.png)\n\n## 软件需求分析的目标\n\n- 全面性\n\
    \  - 没有遗漏\n- 一致性\n  - 没有矛盾\n- 准确性\n  - 说清楚\n- 认同\n  - 共同、相互认可\n- 文档化\n  - 书面文档\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_556_0.png)\n\n## 软件需求分析的过程\n\n![](img/f5d721251af5f768deee90a8ee1528f0_557_0.png)\n\
    \n## 步骤1:收集和获取软件需求(1/2)\n\n- 从用户处收集、获取软件需求，帮助用户发现潜在的软件需求\n- 软件用户\n- 初步需求描述\n\n"
