  - '[PAGE 6]


    # 软件危机的表现(2 of 3)


    +   - 软件质量得不到保证

    +     - 软件应用面的扩大：科学计算、军事、航空航天、工业控制、企业管理、办公、家庭

    +     - 软件越来越多的应用于安全犹关(safety critical)的系统，对软件质量提出更高的要求

    +     - 80年代欧洲亚丽安娜火箭的发射失败，原因是软件错误

    +     - 美国阿托拉斯火箭的发射失败，原因是软件故障

    +     - 英国1986年开发的办公室信息系统Folios经4年，因性能达不到要求，1989年取消

    +     - 日本第5代机因软件问题在投入50亿美元后于1993年下马


    +   - 由于软件质量问题导致失败的软件项目非常多'
  - "[PAGE 7]\n\n# 软件危机的表现(3 of 3)\n\n+   - 进度难以控制\n+     - 项目延期比比皆是\n+     - 由于进度问题而取消的软件项目较常见\n\
    +     - 只有一小部分的项目能够按期完成\n+   \n+   - 维护非常困难\n+     - 软件维护的多样性\n+     - 软件维护的复杂度\n\
    +     - 软件维护的副作用\n\n![](img/f5d721251af5f768deee90a8ee1528f0_7_0.png)"
  - '[PAGE 8]


    # # 产生软件危机的根源


    +   - 逻辑产品，不同于物理产品

    +   - 复杂性高

    +     - 逻辑产品，逻辑复杂度，远高于硬件复杂度

    +     - 软件的复杂性随规模呈指数级上升

    +   - 规模大

    +     - 应用扩大，代码量，1000万行，仍不断膨胀

    +   - 影响软件生产率和质量的因素比较复杂

    +     - 人员的能力和水平

    +     - 团队合作

    +   - 缺乏有效、系统原理、原则、方法和工具的指导和辅助'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    软件项目管理课程介绍和要求


    # 技术手段不能完全解决软件危机


    +   - 到了20世纪90年代，软件危机依然存在，甚至更为严重

    +     - 应用牵引技术的发展

    +       - 瀑布模型

    +       - 结构化软件开发方法

    +       - OO软件开发方法

    +     - 技术推动应用的深化

    +       - 应用的扩大和深入

    +     - 应用变得越来越大和复杂，技术变得更加力不从心

    +     - 错误的观念：“只要有好的软件开发方法和工具就能高效率地开发出高质量的软件”'
  - '[PAGE 11]


    # 解决危机的管理途径


    问题出在哪里？


    20世纪80年代末，美国DoD和工业界开始认识到管理的重要性


    +   - 美国DoD的一项研究表明，70%的项目由于管理不善导致难以控制进步、成本和质量；

    +   - 进一步的研究发现：管理是影响软件项目成功开发的全局性因素，而技术只影响局部

    +   - 如果软件开发组织不能对软件项目进行有效管理，就不能充分发挥软件开发方法和工具的潜力，也就不能高效率地开发出高质量的软件产品'
  - '[PAGE 12]


    # 重视管理


    +   管理是影响软件项目成败的第一要素


    +   学术界和工业界开始研究和探索针对软件企业以及软件开发所需的管理机制和措施


    +   提高企业的过程管理和发展控制能力


    +   ISO 9000系列 - 强调质量


    +   CMMI - 强调企业的过程管理和发展控制的能力


    +   强化软件项目的管理


    +   需求、质量、风险、成本、版本等的管理'
  - '[PAGE 13]


