    \ 各类编译程序等 |\n| 嵌入型     | 3.6 | 1.20| 2.5 | 0.32| 实时软件、OS 等 |\n\n### 中间CoCoMo模型\n\
    \n- E = a * (kLOC)^b * EAF\n- 其中，E表示工作量(人月)，EAF表示工作量调节因子，a,b为经验常数，其取值见下表\n\n|\
