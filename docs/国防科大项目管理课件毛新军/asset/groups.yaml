    \n- 任务\n  - 负责组织大学图书馆管理系统的开发\n- 时间限制\n  - 6个月\n- 人员\n  - 4个技术人员\n- 成本\n  - 控制在40万元之内\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_35_0.png)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_35_1.png)\n\
    \n## 项目案例(2/3)\n\n- 小王的长处\n  - 精湛的技术，尤其是软件设计和程序设计技术\n  - 丰富的软件开发经验，参加过许多项目的开发\n\
    \  - 有成功的项目开发案例，对个人技术信心十足\n- 小王的欠缺\n  - 从来没有完整组织过一个软件项目的开发，不知道如何开展软件项目的开发工作以及需要注意哪些问题\n\
    \n## 项目案例(3/3)\n\n- 小王很茫然，面临许多问题\n  - 如何着手开展工作？\n  - 能否以及如何保证在规定的时间约束范围内完成工程？\n\
    \  - 如何保证所开发的软件系统的质量？\n  - 怎么去组织手下的技术人员，让他们充满激情地工作？\n  - 如何确保项目不会失控？\n  - 如何在实施过程中处理各种应急事件？......\n\
    - 这些问题都是软件项目开发必须解决的，而且不是纯粹的技术性问题\n\n## 讲授内容\n\n- 1. 软件项目案例\n- 2. 管理是重要的\n- 3.\
    \ 什么是软件项目管理\n- 4. 与软件项目管理有关的规范和标准\n- 5. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_38_0.png)\n\
    \n## 管理是重要的(1/4)\n\n### 软件项目开发的任务\n\n- 按照预定的进度、成本和质量，开发出满足用户要求的软件产品\n  - 用户需求\n\
    \  - 确保软件质量\n  - 成本限制\n  - 进度限制\n\n![](img/f5d721251af5f768deee90a8ee1528f0_39_0.png)\n\
    \n## 管理是重要的(2/4)\n\n- 软件工程的解决方法－运用工程化的手段进行软件开发\n  - 强调过程\n  - 抽象\n  - 文档化\n  -\
    \ 规范化\n  - 工具支持\n  - ......\n\n![](img/f5d721251af5f768deee90a8ee1528f0_40_0.png)\n\
    \n## 管理是重要的(3/4)\n\n- 项目组由许多承担不同角色、承担不同任务的人员组成，这些人员构成了一个团体\n  - 项目经理、需求分析人员、设计人员、程序员、测试人员......\n\
    - 软件开发涉及到许多相互关联的活动，这些活动的实施直接关系到软件项目的成本和进度\n  - 需求分析、软件设计、编码、测试......\n- 在软件项目实施过程中会产生大量软件产品，这些软件产品相互关联、具有不同的抽象层次\n\
    \  - 软件需求规格说明书、软件设计规格说明书、源程序代码、可执行代码、测试用例......\n\n## 管理是重要的(4/4)\n\n### 管理软件开发过程\n\
    \n- 明确过程活动\n- 估算各个的工作量、成本\n- 制定计划，跟踪过程，风险控制\n\n### 管理软件产品\n\n- 有哪些产品，呈什么形式(规范文档)，如何保证它们的质量，如何控制它们的变化\n\
    \n### 管理软件开发人员\n\n- 如何组建一个好的团队、调动团队成员的积极性和激情、严明团队的纪律、促进人员之间的协调与合作\n\n## 什么是软件项目管理\n\
    \n- 对软件项目开发过程中所涉及的过程、人员、产品、成本和进度等要素进行度量、分析、规划、组织和控制的过程，以确保软件项目按照预定的成本、进度、质量要求顺利完成\n\
    \n## 软件项目管理的主要内容\n\n相互关联的管理要素\n\n- 过程管理\n  - 过程: 怎么做(How)\n- 人员管理\n  - 人员: 谁来做(Who)\n\
    - 产品管理\n  - 产品: 结果(What)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_45_0.png)\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_45_1.png)\n\n## 3.1 过程管理\n\n- 过程定义和剪裁\n\
    - 软件项目计划\n- 软件度量\n- 软件项目的跟踪和监督\n- 风险管理\n\n![](img/f5d721251af5f768deee90a8ee1528f0_46_0.png)\n\
    \n## 3.1.1 过程定义和剪裁\n\n- 在组织范围内定义、文档化软件开发过程、明确软件开发活动，得到一个良好定义、全面、灵活、简洁和可供剪裁的软件开发过程\n\
    - 如何进行根据企业特点定义软件开发过程？\n- 如何对它进行文档化？\n- 如何确保软件开发过程的有效性(包含了所有各种必须的活动)、简洁性(舍弃无关紧要的过程和活动)和灵活性(根据具体项目情况进行剪裁)？\n\
    - 如何根据项目的特点剪裁过程？......\n\n## 3.1.3 软件度量\n\n- 对软件项目的过程、产品、资源的属性的定量描述，如软件项目的规模、成本、工作量、质量等。目的是为了对软件项目进行更好的管理，如制定计划、质量保证等\n\
    \  - 需要对哪些方面进行度量？\n  - 如何进行度量？\n  - 如何将度量的结果指导软件项目的管理？\n  - 有哪些工具和模型可辅助进行软件度量......\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_49_0.png)\n\n## 3.1.4 软件项目的跟踪和监督\n\n\
    - 跟踪和及时调整软件项目开发计划，提供项目情况的可视性，保证计划的适时调整\n  - 要对哪些方面进行跟踪？\n  - 如何对软件项目进行跟踪？\n  -\
    \ 当项目不能按照预定计划实施时，如何调整计划？\n  - 当跟踪发现问题时如何进行处理\n  - 如何提供工具辅助对软件项目进行跟踪......\n\n\
    ## 3.1.5 风险管理\n\n- 对软件开发过程中各种风险进行分析、预测、评估、监控的过程\n  - 什么是软件开发风险？\n  - 软件开发可能会有哪些风险？\n\
    \  - 如何客观地预测风险？\n  - 如何评估风险带来的影响？\n  - 如何避免和消除风险？\n  - 如何提供工具支持风险分析？......\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_51_0.png)\n\n## 3.2 人员管理\n\n- 软件项目团队\n\
    - 纪律和激励机制\n\n![](img/f5d721251af5f768deee90a8ee1528f0_52_0.png)\n\n"
