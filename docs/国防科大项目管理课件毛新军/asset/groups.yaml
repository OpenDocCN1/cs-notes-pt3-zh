    \  - 将那些不符合又不能解决的问题，写成文档并递交给分管质量保证的高级管理者处理\n  - 定期评审不符合问题，直至解决它们为止\n  - 不符合问题的文档应受管理和控制\n\
    \n- 合适时，SQA组与顾客的SQA人员一起对其活动和发现进行定期评审\n\n### 度量与分析\n\n- 进行度量，并将度量结果用于确定SQA活动的成本和进度状态\n\
    \  - SQA活动的里程碑的完成情况与计划作比较\n  - 在SQA活动中完成的工作、花费的工作量和消耗的资金与计划作比较\n  - 进行产品审计和活动评审的次数与计划相比较\n"
