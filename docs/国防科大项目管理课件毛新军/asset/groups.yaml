    # # 案例提示我们


    +   - 风险在项目实施过程中大量存在

    +   - 软件风险形式多样

    +   - 软件风险事先难以确定

    +   - 软件风险会对软件项目的实施产生不良影响

    +   - 如果不对风险进行良好的管理，项目就很难保证按照计划、在成本和进度范围内，开发出高质量的软件产品，甚至会导致项目失败'
  md: "\n\n## 实施软件过程(5/13)\n\n- 跟踪软件工作产品的规模(或者软件工作产品更动的规模)，必要时采取纠正措施\n  - 跟踪所有主要软件工作产品的规模(或更动的规模)\n\
    \  - 将实际代码规模(生成的、经完全测试的和交付的)和在软件开发计划文档中估计的规模对比\n  - 将实际交付的文档单元数据与在软件开发计划文档中估计的数相比较\n\
    \  - 按正规的手续对软件工作产品的整体预测规模(与实际值相结合的估计值)进行细化、监控和调整\n  - 和受影响组一起，对那些能影响软件承诺的软件工作产品规模估计更动进行协商，并对这些更动写成文档\n\
    \n## 实施软件过程(6/13)\n\n- 跟踪项目的软件工作量和成本，必要时采取纠正措施\n  - 对照已完成的工作和过去实际的工作量及成本开销，将其与软件开发计划中文档化的估计量进行比较，以识别出潜在可能的超支和欠支\n\
    \  - 跟踪软件成本，并将其与软件开发计划中记载的估计相比较\n  - 将实际工作量及人员配置与软件开发计划中记载的估计相比较\n  - 对那些影响软件承诺的有关人员配置和其它软件成本方面的更动，与受影响组协商，并对这些更动写成文档\n\
    \n## 实施软件过程(7/13)\n\n- 跟踪项目的关键计算机资源，必要时采取纠正措施\n  - 对每个主要的软件部件，按照文档化的软件开发计划跟踪项目关键计算机资源的实际使用情况和预计使用情况，并将其与估计相比较\n\
    \  - 对那些影响软件承诺的有关关键计算机资源估计的更动，与受影响组协商，并对这些更动写成文档\n\n## 实施软件过程(8/13)\n\n- 跟踪项目的软件进度，必要时采取纠正措施\n\
    \  - 将软件活动、里程碑和其它承诺的实际完成情况与软件开发计划作比较\n  - 评价软件活动、里程碑和其它承诺等迟后和提前完成对将来的活动和里程碑的影响\n\
    \  - 对那些影响软件承诺的有关软件进度的修订，与受影响组协商，并对其写成文档\n\n## 实施软件过程(9/13)\n\n- 跟踪软件工程技术活动，必要时采取纠正措施\n\
    \  - 软件工程组的成员定期向他们的负责人报告他们的技术状态\n  - 检查为后续软件开发步骤提供的软件工作产品版本是否能按照软件开发计划的规定提供\n\
    \  - 将任何软件工作产品中发现的问题均记入文档\n  - 跟踪问题报告直至结束\n\n## 实施软件过程(10/13)\n\n- 跟踪与项目的成本、资源、进度及技术方面有关的软件风险\n\
    \  - 当有补充信息时，调整风险的优先级及风险可能性\n  - 项目经理定期参与高风险的软件产品和活动的评审\n\n## 实施软件过程(11/13)\n\n\
    - 对软件项目的实际度量数据和重新策划的数据进行记录、管理和控制\n  - 记录的信息包括估计信息、以及为重构估计和验证其合理性所必须的辅助信息\n  -\
    \ 软件重新策划的数据应受管理和控制\n  - 将软件策划数据、重新策划数据和实际度量数据归档，以供正在进行的和未来的项目使用\n\n## 实施软件过程(12/13)\n\
    \n- 软件工程组定期进行内部评审以便对照软件开发计划跟踪技术进展、计划、性能和问题\n\n## 实施软件过程(13/13)\n\n- 按照文档化的规程，在所选的项目里程碑处进行正式评审以评价软件项目的完成情况和结果\n\
    \  - 安排在对软件项目进度有意义的点上进行评审，例如在所选阶段的开头或结束处\n  - 必要时，邀请用户、最终用户(或者其代表)和组织内部受影响组参与评审\n\
    \  - 使用的材料必须经负责的项目软件负责人的评审和批准\n\n## 实施软件过程(1/13 cont.)\n\n- 分析软件活动的承诺、计划和状态\n\
    - 导致对重大问题、各项措施和决策的标识和写成文档\n- 分析软件项目风险\n- 必要时，评审的结果可导致对软件开发计划的细化和调整\n\n## 度量和分析\n\
    \n- 进行度量，并将度量结果用来确定软件跟踪和监督活动的状态\n- 度量的例子包括：\n  - 在实施跟踪和监督活动中花费的工作量和其它资源\n  - 软件开发计划的更动活动，包括对软件工作产品的规模估计，软件成本估计、关键计算机资源估计和进度的更动\n\
    \n## 验证实施(1/3)\n\n- 高级管理者定期参与软件项目跟踪和监督活动的评审\n\n## 验证实施(2/3)\n\n- 项目经理可定期或者事件驱动地参与软件项目跟踪和监督活动的评审\n\
    \n## 讲授内容\n\n- 项目案例\n- 什么是软件项目跟踪？\n- 为什么需要对软件项目进行跟踪\n- 软件项目跟踪会议\n- 软件项目跟踪的过程和步骤\n\
    - CMM对软件项目跟踪的要求\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_474_0.png)\n\
