    \n![](img/f5d721251af5f768deee90a8ee1528f0_60_0.png)\n\n## CMM 简介\n\n1. 基本概念\n\
    2. CMM的产生和发展\n3. CMM框架\n4. CMM的应用\n\n![](img/f5d721251af5f768deee90a8ee1528f0_61_0.png)\n\
    \n## 基本概念(1/6)\n\n### 软件过程\n\n开发和维护软件及其相关产品(项目计划、设计文档、代码测试用例和用户手册等)的一系列有序的活动，包括“工程活动”和“管理活动”两方面\n\
    \n- 技术活动：需求分析、软件设计、编码等\n- 管理活动：制定计划、项目跟踪和监督、质量保证等\n\n软件过程将人员、工具、方法和规程有机结合在一起\n\
    \n- 规程：有哪些活动，这些活动间的关系\n- 方法：如何来实施这些活动\n- 人员：谁来实施这些活动\n- 工具：人员利用什么工具来实施活动\n\n##\
    \ 基本概念(2/6)\n\n- 软件过程能力(Capability)\n\n  通过遵循软件过程，软件开发活动能够达到预期结果的程度\n\n  事前：预期结果（项目还没实施，用户和组织关注）\n\
    \n- 软件过程性能(Performance)\n\n  通过遵循其软件过程，软件开发活动实际得到的结果\n\n  事后：实际结果\n\n## 基本概念(3/6)\n\
    \n- 软件过程成熟度\n  - 软件过程被明确有效地定义、执行、管理、测量和控制的程度\n  - 软件过程成熟度用来表示软件过程能力的高低，成熟度高，通过软件开发达到预期结果的程度就高，否则就低\n\
    \  - 组织必须始终不断地提高软件过程的成熟度\n\n## 基本概念(4/6)\n\n- 软件(过程)能力成熟度等级\n  - 表示软件开发组织或项目所具有的软件过程成熟度的等级，即其软件工程和管理能力的等级\n\
    \  - 不同的等级表示软件过程能力成熟度的高低\n  - CMM将软件能力成熟度划分为5个等级\n    - 初始级\n    - 可重复级\n    -\
    \ 已定义级\n    - 已管理级\n    - 优化级\n\n## 基本概念(6/6)\n\n### 软件过程评估\n\n- 是由一组受过培训的专业人员作出的估价，目的在于确定机构现行软件过程的状况，确定面向机构的高优先级的软件过程问题，以得到机构对软件过程改进的支持\n\
    - 评估一般由组织内部的人员实施\n\n### 软件能力评价\n\n- 是由一组受过培训的专业人员作出的估价，目的在于确定软件开发方的资格，或者对现有软件工作中使用的软件过程状态进行监督\n\
    - 评估一般由外部独立的机构进行\n\n## CMM的产生和发展\n\n- 产生\n- 发展\n- 国际现状\n- 国内现状\n\n![](img/f5d721251af5f768deee90a8ee1528f0_68_0.png)\n\
    \n## CMM的产生\n\n- CMM由卡内基·梅隆大学(CMU)软件工程研究所(SEI)提出\n- 最初开始于1986年11月，SEI在MITRE公司的协助下，着手开展CMM的工作，为客户提供评价软件开发方能力、帮助组织改进和提高其软件过程\n\
    - 1987年SEI软件过程成熟度的简短描述[Humphrey87a]\n- 随后，开发了两种方法（软件过程评估和软件成熟度评价）和一个成熟度问卷，以估计软件过程成熟度\n\
    - 1991年SEI将成熟度框架发展为成熟度模型\n- 在应用中几经修改，最后在1993年2月正式发布了CMM 1.1版，在DoD和NASA等政府部门得到广泛应用\n\
    \n## CMM的发展\n\n- PSP(Personal Software Process)\n  - 面向个体\n- TSP(Team Software\
    \ Process)\n  - 面向软件开发团队（组）的软件过程要求\n- FAA-iCMM\n  - 美国联邦航空管理局提出的集成的CMM\n- CMMI\n\
    \  - CMMI工作计划提出的集成CMM，是一个系列标准，目前包括：CMMI-SW, CMMI-SE, CMMI-SW/SE, CMMI-SW/SE/IPPD,\
    \ CMMI-SA\n- CSCMM\n  - 一个中国的CMM\n\n## CMM的国内现状\n\n- CMM近几年在国内引起了高度重视\n  - 为了加强企业的国际竞争力，国家支持企业获得CMM的认证\n\
    \  - 一些企业通过2级以上认证，如东大阿尔派通过3级\n  - 有一些主任评估师，如北航的周伯生教授\n\n## CMM的框架\n\n- CMM的组成\n\
    - CMM的等级\n- 关键过程域\n- 关键实践\n- 关键实践类\n\n![](img/f5d721251af5f768deee90a8ee1528f0_73_0.png)\n\
    \n## CMM的组成\n\n5个\n表明\n成熟度级别\n包含\n解决\n关键过程域\n划分为\n归类\n关键实践类\n包含\n描述\n关键实践\n过程能力\n\
    主要问题\n实施或制度化\n活动或基础设施\n\n## CMM的等级\n\n1. 初始级\n2. 可重复级\n3. 已定义级\n4. 已管理级\n5. 优化级\n\
    \n- 持续改进的过程\n- 可预测、量化的过程\n- 标准、一致的过程\n- 有纪律的过程\n\n![](img/f5d721251af5f768deee90a8ee1528f0_75_0.png)\n\
    \n## 初始级(1/2)\n\n- 开发过程是无序的，有时甚至是混乱的，常常以消防模式解决问题。\n  - 出现危机时，软件项目一般会脱离计划好的软件开发过程，回到仅仅进行编码和代码调试的工作状态\n\
    - 几乎没有妥善定义和认真执行过的软件过程，软件开发缺乏必要的纪律\n- 成功往往应归功于个人或少数人的努力，软件工程化水平很差\n  - 软件项目的成功完全依赖于杰出的项目管理人员和/或有经验、有战斗力的开发队伍\n\
    \n## 初始级(2/2)\n\n- 开发很类似的项目仍有可能失败\n  - 处于级别1的组织仍能开发出成功的产品，但常常超出预算和进度\n  - 其成功依赖于有较高能力的个人和少数精英\n\
    \  - 他们离开组织后，这种能力和影响力随之消失\n  - 如果不派他们去开发下一个项目，级别1的机构不能重复已取得的成功\n- 能力是个人特征而不是项目组或者组织特征\n"
