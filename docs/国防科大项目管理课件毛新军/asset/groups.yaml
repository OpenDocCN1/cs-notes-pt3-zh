    - 评审结果\n\n## 为什么需要对软件需求进行评审？\n\n- 发现软件需求规格说明书中的问题\n  - 不全面\n  - 不一致\n  - 不准确\n\
    \  - 不可验证\n  - 书写不规范\n- 共同认可软件需求\n\n## 如何进行评审(1/3)\n\n- 参与评审人员\n  - 项目经理\n  -\
    \ 用户方(代表)\n  - 需求分析小组\n  - 软件设计小组\n  - 软件测试小组\n  - 软件质量保证小组......\n\n应该提前将SRS送给参与评审人员\n\
    \n## 如何进行评审(2/3)\n\n- 需求评审原则\n  - 多方对软件需求达成一致\n  - 正确性\n    - 软件需求是否是用户所需要的\n\
