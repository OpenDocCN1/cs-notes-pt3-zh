    - 软件需求经常变更，为了确保软件需求处于受控状态\n\n## 需求管理的内容\n\n- 参与需求分析和评审的人员\n- 软件需求文档\n- 需求分析过程\n\
    - 需求变更\n\n## 收集软件需求\n\n1. 如何收集软件需求？\n2. 文档化所收集的软件需求\n3. 软件需求收集的注意事项\n\n![](img/f5d721251af5f768deee90a8ee1528f0_570_0.png)\n\
    \n## 如何收集需求？\n\n- 确定哪些用户角色会对软件提出需求\n  - 例如图书馆的馆长，图书管理员，书库管理员，读者管理员，系统管理员；而不是图书馆的清理工\n\
