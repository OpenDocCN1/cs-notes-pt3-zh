    - 为什么需要对软件项目进行跟踪\n- 软件项目跟踪会议\n- 软件项目跟踪的过程和步骤\n- CMM对软件项目跟踪的要求\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_398_0.png)\n\
    \n## 项目案例\n\n### 案例角色和人物\n\n![](img/f5d721251af5f768deee90a8ee1528f0_399_0.png)\n\
    \n小王：软件项目负责人\n\n![](img/f5d721251af5f768deee90a8ee1528f0_399_1.png)\n\n老王：公司技术老总\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_399_2.png)\n\n开发小组：小李，老赵，小田，小谢\n\n\
    ## 项目实施需要跟踪(1/2)\n\n- 项目实施了一个月后 一切似乎正常，然而进入第二个月后出现了许多意想不到的问题，这些问题的出现将影响项目的正常实施，甚至可能导致项目失败\n\
    \  - 需求分析进行了1个半月之后，需求分析的负责人老赵开始意识到需求分析工作不能按计划完成，因为剩下的工作在半个多月的时间内完成是不切实际的。因此他把这一严重的问题告诉给项目经理小王，针对该问题小王必须采取措施；\n\
    \  - 与进度面临同样问题的是，小王从公司的财务部得到通知，项目在需求分析阶段的成本已经超支，超支的主要原因是日常的伙食费和住宿费的额度较大，因此需要对成本的预算和计划重新进行调整\n\
    \n## 项目实施需要跟踪(1/2)\n\n- 更为糟糕的是，在此关键时刻，项目组的技术骨干老赵就提出要辞职，他的辞职给项目组的开发带来了很大的风险，小王现在必须面对这个现实，并且采取有效的措施来弥补老赵离开项目组带来的问题\n\
    - 另外，根据老赵的反映，近段时间用户对需求分析小组的支持力度不够，友好程度也不够，并且开始出现闹矛盾的现象，因此和用户之间的关系应该引起关注和重视\n-\
    \ 公司高层和用户为了更加清晰地了解项目的进展情况，要求小王每周定期给他们提供项目的进展情况\n\n## 案例提示我们\n\n- 在项目实施过程中会发现许多问题和风险，\n\
    - 这些问题和风险在事先是很难预测到的\n- 在实施过程中， 项目完全按照预先制定的计划进行是比较困难的， 因此会有偏差\n- 必须了解项目的实际实施情况，\
    \ 以便清晰的知道存在哪些偏差\n- 必须针对各个问题， 提出相应的措施， 以决问题， 或者消除和避免风险\n\n## 软件项目管理问题\n\n- 什么是软件项目跟踪\n\
    - 为什么需要对软件项目进行跟踪？\n- 需要跟踪软件项目的哪些方面？\n- 如何进行跟踪？\n- 跟踪时应该注意哪些问题？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_403_0.png)\n\
    \n## 讲授内容\n\n- 项目案例\n- 什么是软件项目跟踪？\n- 为什么需要对软件项目进行跟踪\n- 软件项目跟踪会议\n- 软件项目跟踪的过程和步骤\n\
    - CMM对软件项目跟踪的要求\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_404_0.png)\n\
    \n## 什么是软件项目跟踪\n\n- 概念\n- 对象\n- 基础\n- 方式\n- 目标\n\n![](img/f5d721251af5f768deee90a8ee1528f0_405_0.png)\n\
    \n## 什么是软件项目跟踪\n\n### 什么是软件项目跟踪？\n\n- 在项目实施过程中，随时掌握项目的实际开发情况，使得当项目实施与计划相背离，或者出现问题和风险时，能够采取有效的措施\n\
    \n### 软件项目跟踪对软件项目的实施提供可视性\n\n- 知道项目的实际执行和实施情况\n\n- 知道项目实施过程中(可能)出现了哪些问题\n\n- 知道如何采取措施防止问题的出现，或者出现时该采取什么办法减少它给软件项目实施带来的影响和损失\n\
    \n## 软件项目跟踪的对象\n\n- 项目风险\n- 项目进展\n- 开发活动进展\n- 开发活动问题\n- 项目展望\n\n![](img/f5d721251af5f768deee90a8ee1528f0_407_0.png)\n\
    \n## 软件项目风险(1/3)\n\n- 软件项目在实施过程中存在各种问题和风险  \n  - 技术风险，例如某项需求尚未找到合适的技术解决途径，或者原先所制定的技术解决途径发现不合适\
    \  \n  - 进度风险，例如某项活动原先计划1个月时间完成，但是现在3个月过去了仅仅完成任务的一半  \n  - 成本风险，由于没有控制支出，实际成本已经远远超过原先计划的成本预算，并且仍然不断增长\
    \  \n  - 人员风险，项目组成员临时跳槽或者调派，人员缺乏  \n  - 工具和设备风险，所需的工具和设备不能按时提供，或者得不到，....\n\n\
    ## 软件项目风险(2/3)\n\n- 在项目跟踪过程中，识别风险以便管理风险  \n  - 通过了解项目的实际实施情况，发现风险  \n  - 详细描述风险\
    \  \n  - 将各个风险组织以风险清单形式提交讨论\n\n## 项目风险清单样例\n\n| 风险 | 负责人 | 开始日期 | 结束日期 | 风险标识\
    \ |\n|---|---|---|---|---|\n| 部分产品需求尚未得到潜在客户的验证 | 小李 | 02/10/10 | 02/10/20 | 1\
    \ |\n| 所需的软件构件和工具没有按期购买 | 小谢 | 02/10/10 | 02/10/15 | 2 |\n| 软件测试所需设备比要求时间晚了 1\
    \ 个月 | 小谢 | 02/10/15 | （02/10/10）02/10/18 | 3 |\n| 项目开销超出计划 10%，且每周按 5% 增长 | 小李\
    \ | 02/10/18 | 02/10/21 | 4 |\n\n"
