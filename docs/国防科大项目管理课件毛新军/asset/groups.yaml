    \n## 制定方针政策(2/2 cont.)\n\n- 受影响组(软件工程组、质量保证组、配置管理组等)评审软件项目的规模估算、工作量和成本估算、计算机资源和进度估计，以及其它承诺\n\
    - 高级管理者对所有向组织外的个人和组织所作的软件项目承诺进行评审\n- 项目的软件开发计划应受管理和控制\n\n## 第4讲 软件项目计划\n\n## 确保必备条件(1/4)\n\
    \n对软件项目存在文档化、经批准的工作说明 (SOW) -- 软件项目任务书，工作说明的内容包括：\n\n- 工作范围(做与不做)\n- 技术目标和指标\n\
    - 对顾客和最终用户的标识\n- 要求遵循的标准(行业和软件标准等)\n- 赋予的职责\n- 成本和进度的约束及目标\n- 软件项目和其它组织间的依赖关系如顾客、子承包商、合作伙伴等\n\
    - 资源的限制和目标\n- 对开发和(或)维护的其它约束和目标\n\n## 确保必备条件(2/4)\n\n- 指定软件开发计划的制定人员，明确其职责\n \
    \ - 项目软件负责人直接或委托代表协调项目的软件计划\n  - 将软件工作产品和活动进行分解，并以可追踪和可说明的方式将其指派给各负责人\n  - 软件工作产品的例子包括：\n\
    \    - 适时交付给外部顾客或最终用户的工作产品如软件需求规格说明书、使用手册\n    - 供其它工程组使用的工作产品，如软件接口文档\n    -\
    \ 供软件工程组内部使用的主要工作产品\n\n## 确保必备条件(3/4)\n\n- 为策划软件项目提供足够的资源和经费\n- 有专门知识的有经验的个人来制定软件开发计划\n\
    - 能得到支持软件项目策划的工具，如\n  - 电子表格程序\n  - 项目估计模型\n  - 项目策划和调度程序等\n\n## 实施过程活动(1/15)\n\
    \n- 软件工程组参加项目计划的建议和评审活动\n  - 建议和说明的准备、讨论、协商和提交\n  - 软件工程组评审所建立的项目承诺\n  - 项目的技术目标和指标\n\
    \  - 系统和软件的技术解决方案\n  - 软件标准和规程\n  - 软件预算、进度和资源\n\n## 实施过程活动(2/15)\n\n- 在整个项目计划的早期阶段就启动软件项目软件计划，此两项计划可同时进行\n\
    \n## 实施过程活动(4/15)\n\n- 按照文档化的规程，高级管理者参与对组织外的个人和组所作的软件项目承诺进行的评审\n\n## 实施过程活动(5/15)\n\
    \n- 选定合适的软件生存周期模型\n- 瀑布模型\n- 带反馈的瀑布模型\n- 螺旋模型\n- 快速原型，等等\n\n# InternVL3: Exploring\
    \ Advanced Training and Test-Time Recipes for Stronger InternVL Models\n\nJinguo\
    \ Zhu,† Xiyu Wang,† Tian Ye,† Dongfu Jiang,† Haoran Wu,† Yuepeng Hu,† Lingchen\
    \ Meng,† Wenze Liu,† Xizhou Zhu, Jifeng Dai, Yu Qiao, Lewei Lu,‡ Yikang Shen,‡\
    \ Ziwei Liu‡*\n\nShanghai AI Laboratory\n\nBeijing Academy of Artificial Intelligence\n\
    \nDepartment of Computer Science and Engineering, The Chinese University of Hong\
    \ Kong\n\nSuan Family\n\nThe University of Hong Kong\n\nTsinghua University\n\n\
    Queen Mary University of London\n\nDepartment of Computer Science, Johns Hopkins\
    \ University\n\nCorresponding authors\n\n> Abstract\n\nInternVL3 is a family of\
    \ open-source multimodal large language models designed to bridge the gap between\
    \ open-source and closed-source models in multimodal capabilities. Building upon\
    \ the architecture and progressive alignment of InternVL2, InternVL3 introduces\
    \ a series of innovative enhancements in training and test-time recipes, significantly\
    \ boosting its performance and usability. These enhancements span three key areas:\
    \ (1) Advanced Training Recipes: Our training recipes employ a novel powerful\
    \ dataset. It integrates strong data organization in curriculum learning and also\
    \ introduces a high quality dataset with data-efficient learning strategy, improving\
    \ both sample efficiency and overall performance; (2) Advanced Test-Time Recipes:\
    \ InternVL3 adopts dynamic noise reduction, guided self-distillation, and test-time\
    \ scaling strategies, which reduce error accumulation and harness the potential\
    \ of reasoning; (3) Advanced Model Capabilities: Based on our training and test-time\
    \ recipes, InternVL3 also unlocks strengths such as multi-turn interactive reasoning\
    \ and fine-grained multimodal perception. To evaluate the performance of InternVL3,\
    \ we conduct extensive experiments across a wide range of benchmarks. The results\
    \ demonstrate that InternVL3 outperforms both open-source and closed-source models\
    \ across various tasks, achieving state-of-the-art results and showcasing strong\
    \ multimodal capabilities.\n\n| Model | InternVL2.5-78B | InternVL3-78B | A/B\
    \ | Improvement |\n|-------|----------------|---------------|-----|-------------|\n\
    | MMMU val | 72.4 | 73.8 | +1.4 | +1.9% |\n| MathVista | 68.4 | 70.9 | +2.5 |\
    \ +3.7% |\n| DocVQA | 92.5 | 94.1 | +1.6 | +1.7% |\n| ChartQA | 86.1 | 88.8 |\
    \ +2.7 | +3.1% |\n| OCRBench | 85.8 | 87.2 | +1.4 | +1.6% |\n| SEED-Bench-2 |\
    \ 71.6 | 73.0 | +1.4 | +2.0% |\n| MMStar | 69.1 | 70.9 | +1.8 | +2.6% |\n| General\
    \ VQA | 76.5 | 78.0 | +1.5 | +2.0% |\n| Text VQA | 79.0 | 80.5 | +1.5 | +1.9%\
    \ |\n| Chart VQA | 84.5 | 85.9 | +1.4 | +1.7% |\n| InfoVQA | 69.1 | 70.5 | +1.4\
    \ | +2.0% |\n| Multi-discipline | 62.5 | 64.2 | +1.7 | +2.7% |\n\nInternVL3-78B\
    \ outperforms InternVL2.5-78B on various benchmarks. Both models use the same\
    \ backbone (Qwen2.5-72B-Instruct), and the improvement is solely due to our advanced\
    \ training and test-time recipes.\n\n![](img/f5d721251af5f768deee90a8ee1528f0_362_0.png)\n\
    \n"
