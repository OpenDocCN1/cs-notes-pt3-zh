    \n- 如果应用规模较大，可分成几个需求调查小组同时进行，最后对结果进行汇总\n- 一定要和用户进行充分的交流，尽可能获取足够多的信息和资料，发现问题要及时沟通\n\
    - 在该阶段要和用户打成一片，进行充分的合作，建立起良好的合作关系\n- 如果发现多个软件需求相互矛盾，要能找到仲裁人，或者决策人\n\n## 软件需求收集的注意事项(2/2)\n\
