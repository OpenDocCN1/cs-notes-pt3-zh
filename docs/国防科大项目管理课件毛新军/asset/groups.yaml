    \ - 2002/11/23结束\n\n## 软件项目计划的内容(2/3)\n\n### 资源使用和安排计划\n\n- 如何针对不同活动的特点计划分配资源(人员、资金、设备等)\n\
    - 哪些角色(项目经理、需求分析人员、软件设计人员)，哪些人(小王，小李，老赵，小田，小谢)\n- 开发人员充当什么角色、负责和参与哪些活动\n- 例如，张三作为需求分析小组负责人，负责和参与需求分析阶段工作；李四作为需求分析小组成员，参与需求分析的具体工作\n\
    - 例如，在需求分析阶段，投入3个人、预计投入资金10万元(包括人员薪水、外地出差费用)、PC机3台、PC服务器1台\n\n## 软件项目计划的内容(3/3)\n\
    \n- 活动、资源和人员、进度等方面的计划是密切相关的\n- 注意\n  - 项目进度应该是宏观的，应该保留在一定的抽象层次，不宜过细、过于具体\n  -\
    \ 对于软件开发而言，资源和人员与进度之间并不是线性关系\n\n![img/f5d721251af5f768deee90a8ee1528f0_285_0.png]\n\
    \n## 制定软件项目计划的基础和依据\n\n- 定义和剪裁的软件开发过程(及其细化)\n- 要完成的工作\n- 工作说明和软件需求\n- 历史数据和估算模型\n\
    - 估算工作量和成本\n- 约束和限制条件\n- 人员\n- 资源\n- 进度\n\n![img/f5d721251af5f768deee90a8ee1528f0_286_0.png]\n\
    \n## 制定软件项目计划的时机\n\n- 在项目开始实施之时制定计划\n  - 明确了软件开发活动\n  - 明确了约束和限制条件\n  - 不明确要完成的工作，因为需求分析工作还没开始\n\
    \n- 制定软件项目计划的时机\n  - 项目开始之时：初步计划\n  - 需求完成之时：详细计划\n\n## 初步和详细的软件项目计划(2/3)\n\n\
    - 时机：项目开始(1-2周内)但是还没有获取完整和详细的软件需求\n- 依据\n  - 项目的初步描述、用户需求的初步描述\n  - 定义和剪裁的过程\n\
