    +     - 项目经理、需求分析人员、设计人员、程序员、测试人员……


    +   - 软件开发涉及到许多相互关联的活动，这些活动的实施直接关系到软件项目的成本和进度

    +     - 需求分析、软件设计、编码、测试……


    +   - 在软件项目实施过程中会产生大量软件产品，这些软件产品相互关联、具有不同的抽象层次

