    \  - 将任何软件工作产品中发现的问题均记入文档\n  - 跟踪问题报告直至结束\n\n## 实施软件过程(10/13)\n\n- 跟踪与项目的成本、资源、进度及技术方面有关的软件风险\n\
    \  - 当有补充信息时，调整风险的优先级及风险可能性\n  - 项目经理定期参与高风险的软件产品和活动的评审\n\n## 实施软件过程(11/13)\n\n\
    - 对软件项目的实际度量数据和重新策划的数据进行记录、管理和控制\n  - 记录的信息包括估计信息、以及为重构估计和验证其合理性所必须的辅助信息\n  -\
    \ 软件重新策划的数据应受管理和控制\n  - 将软件策划数据、重新策划数据和实际度量数据归档，以供正在进行的和未来的项目使用\n\n## 实施软件过程(12/13)\n\
    \n- 软件工程组定期进行内部评审以便对照软件开发计划跟踪技术进展、计划、性能和问题\n\n## 实施软件过程(13/13)\n\n- 按照文档化的规程，在所选的项目里程碑处进行正式评审以评价软件项目的完成情况和结果\n\
    \  - 安排在对软件项目进度有意义的点上进行评审，例如在所选阶段的开头或结束处\n  - 必要时，邀请用户、最终用户(或者其代表)和组织内部受影响组参与评审\n\
    \  - 使用的材料必须经负责的项目软件负责人的评审和批准\n\n## 实施软件过程(1/13 cont.)\n\n- 分析软件活动的承诺、计划和状态\n\
    - 导致对重大问题、各项措施和决策的标识和写成文档\n- 分析软件项目风险\n- 必要时，评审的结果可导致对软件开发计划的细化和调整\n\n## 度量和分析\n\
    \n- 进行度量，并将度量结果用来确定软件跟踪和监督活动的状态\n- 度量的例子包括：\n  - 在实施跟踪和监督活动中花费的工作量和其它资源\n  - 软件开发计划的更动活动，包括对软件工作产品的规模估计，软件成本估计、关键计算机资源估计和进度的更动\n\
    \n## 验证实施(1/3)\n\n- 高级管理者定期参与软件项目跟踪和监督活动的评审\n\n## 验证实施(2/3)\n\n- 项目经理可定期或者事件驱动地参与软件项目跟踪和监督活动的评审\n\
    \n## 讲授内容\n\n- 项目案例\n- 什么是软件项目跟踪？\n- 为什么需要对软件项目进行跟踪\n- 软件项目跟踪会议\n- 软件项目跟踪的过程和步骤\n\
    - CMM对软件项目跟踪的要求\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_474_0.png)\n\
    \n## 教学目的\n\n### 理解\n\n- 为什么需要对软件项目进行跟踪？\n- 什么是软件项目跟踪？\n- 软件项目跟踪的对象、基础和目标\n\n\
    ### 掌握\n\n- 软件项目跟踪的方法\n- CMM对软件项目跟踪的要求\n\n### 运用\n\n- 在实际软件项目中能够对软件项目进行有效跟踪，提供实施视图，控制项目的实施\n\
    \n## Software Project Management\n\n## Q & A\n\n![](img/f5d721251af5f768deee90a8ee1528f0_477_0.png)\n\
    \n## Practice, Practice, and Practice\n\n## 软件项目管理课程 之\n\n## 第6讲 软件开发的风险管理\n\n\
    毛新军  \nxjmao21@21cn.com  \nhttp://software.nudt.edu.cn/~xjmao  \n计算机科学与技术系602教研室\
    \  \n0731-(45)73649\n\n![](img/f5d721251af5f768deee90a8ee1528f0_478_0.png)\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_478_1.png)\n\n## 讲授内容\n\n1. 项目案例\n2.\
    \ 什么是软件风险？\n3. 如何进行风险管理？\n4. 风险评估\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_479_0.png)\n\
    \n## 项目案例\n\n## 案例角色和人物\n\n![](img/f5d721251af5f768deee90a8ee1528f0_480_0.png)\n\
    \n- 小王：软件项目负责人\n\n![](img/f5d721251af5f768deee90a8ee1528f0_480_1.png)\n\n- 老王：公司技术老总\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_480_2.png)\n\n开发小组：小李，老赵，小田，小谢\n\n\
    ## 项目实施存在风险(1/4)\n\n- 项目已成功实施1个月，某天小谢突然告诉小王，他已办理好了去德国的签证，2周后他会辞职离开公司前往德国留学 → (人员)\n\
    - 小谢的离开显然将会影响项目组的正常运作，影响项目的进度，为此将会给项目的实施带来损失\n- 可以想象，2周以后小谢的离开将会有来一系列问题：谁来接替小谢的工作？在此之前谁来负责交接小谢的工作？如何尽可能的避免由此给项目组带来的损失(包括进度损失和工作损失等)\n\
    - 尽管还没发生，但必须考虑如何避免问题的发生，以及一旦发生后该采取得措施，以便将损失减少到最少\n\n## 项目实施存在风险(2/4)\n\n- 按照软件开发计划，需求分析应该在12月31日之前完成，然而在软件项目实施过程中项目经理发现，由于原先对工作量估算过于乐观，需求分析在12月31日之前已经不可能完成⇒\
    \ (计划)\n- 显然，原先计划制定的不科学和不准确，导致了实施过程中进度难以控制，如果强行按照计划来执行显然是不可行的，为此，必须对计划重新进行分析和调整\n\
    \n## 案例提示我们\n\n- 风险在项目实施过程中大量存在\n- 软件风险形式多样\n- 软件风险事先难以确定\n- 软件风险会对软件项目的实施产生不良影响\n\
    - 如果不对风险进行良好的管理，项目就很难保证按照计划、在成本和进度范围内，开发出高质量的软件产品，甚至会导致项目失败\n\n"
