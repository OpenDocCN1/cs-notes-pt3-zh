    \n- 概要设计\n  - 跟踪和监督\n  - 配置管理\n- 详细设计\n  - 跟踪和监督\n  - 配置管理\n- 编码\n  - 跟踪和监督\n\
    \  - 配置管理\n- 撰写用户文档\n- 用户培训\n- 集成测试\n  - 跟踪和监督\n  - 配置管理\n- 确认测试\n  - 跟踪和监督\n\
    \  - 配置管理\n- 打包交付\n\n软件开发阶段\n\n- 技术活动\n- 管理活动\n\n## 步骤3：定义和描述活动\n\n- 需求分析\n- 概要设计\n\
    - 详细设计\n- 编码\n- 集成测试\n- 确认测试\n- 撰写用户文档\n- 用户培训\n- 打包和交付\n\n![](img/f5d721251af5f768deee90a8ee1528f0_182_0.png)\n\
    \n## 活动1：需求分析和软件定义\n\n### 任务\n\n- 进行需求调查，定义软件的用户需求，撰写软件需求规格说明书(SRS)\n- 根据SRS，撰写软件确认测试计划\n\
    - 评审SRS和软件确认测试计划\n\n### 输入\n\n- 用户的初步需求描述\n\n### 输出\n\n- 软件需求规格说明书\n- 软件确认测试计划\n\
    \n### 实施\n\n- 根据用户需求描述，分析和定义软件系统的需求，按照《软件需求规格说明书编写指南》编写软件需求规格说明书(SRS)\n- 根据SRS，制定软件确认测试计划，按照《软件确认测试计划编写指南》编写软件确认测试计划文档\n\
    - 对需求分析的结果（软件需求规格说明书和软件确认测试计划）进行评审\n\n### 说明\n\n- 用户需求描述了用户对目标软件系统的期望和要求（包括功能、性能和设计约束等），因此，需求分析只需关心要解决的问题，而无需关心这些问题的解决方案\n\
    - 软件确认测试计划应该包含软件需求规格说明书中所定义的所有需求的测试内容\n\n## 活动2：概要设计\n\n### 任务\n\n- 根据SRS，进行软件的总体结构设计、接口设计和数据设计，撰写软件总体结构设计、接口设计和数据设计规格说明书\n\
    - 根据软件的概要设计，制定软件集成测试计划\n\n### 输入\n\n- 软件需求规格说明书SRS\n\n### 输出\n\n- 软件总体结构设计规格说明书\n\
    - 软件数据设计规格说明书\n- 软件接口设计规格说明书\n- 软件集成测试计划\n\n### 实施\n\n- 根据SRS来进行软件设计\n- 按照《软件总体结构设计规格说明书编写指南》编写软件总体结构设计文档\n\
    - 按照《软件数据设计规格说明书编写指南》编写软件数据设计文档\n- 按照《软件接口设计规格说明书编写指南》编写软件接口设计文档\n- 按照《软件集成测试计划编写指南》编写软件集成测试计划文档\n\
    \n### 说明\n\n- 概要设计要给出满足用户需求的软件解决方案，主要是指软件的总体结构、接口设计和数据设计，不涉及具体模块的内部细节\n\n## 活动3：详细设计\n\
    \n### 实施\n\n- 根据SRS和软件总体结构、接口和数据设计规格说明书，进行软件的详细设计，根据《软件详细设计规格说明书编写指南》撰写软件详细设计文档\n\
    - 根据每个模块的内部实现细节的设计，以及《软件单元测试计划编写指南》编写软件单元测试计划文档\n\n### 输出\n\n- 软件详细设计规格说明书\n-\
    \ 软件单元测试计划\n\n### 说明\n\n- 详细设计主要根据软件需求规格说明书，在软件总体结构设计、接口设计和数据设计的基础上，涉及软件解决方案的详细细节，尤其是模块的实现算法和思想\n\
    \n## 活动4：编码\n\n### 任务\n\n- 编写程序\n- 进行单元测试，撰写单元测试报告\n\n### 输入\n\n- 软件总体结构设计规格说明书\n\
    - 软件数据设计规格说明书\n- 软件接口设计规格说明书\n- 软件详细设计规格说明书\n- 单元测试计划\n\n©Copyright Xinjun Mao\
    \ 2005\n\n### 实施\n\n- 根据软件总体结构设计规格说明书、软件数据设计规格说明书、软件接口设计规格说明书、软件详细设计规格说明书进行编码\n\
    - 根据单元测试计划对各个模块进行单元测试\n\n### 输出\n\n- 经过单元测试的软件模块源程序\n- 单元测试报告\n\n## 活动5：集成测试\n\
    \n### 任务\n\n- 集成各个软件模块进行测试\n\n### 输入\n\n- 软件模块的程序代码\n- 软件总体结构设计规格说明书\n- 软件数据设计规格说明书\n\
    - 软件接口设计规格说明书\n- 软件集成测试计划\n\n### 实施\n\n- 根据软件总体结构设计规格说明书、软件接口设计规格说明书、软件数据设计规格说明书和软件集成测试计划，逐步组装模块进行软件的集成测试，撰写集成测试报告\n\
    \n### 输出\n\n- 可运行的、经过集成测试的目标软件系统\n- 集成测试报告\n\n## 活动6：确认测试\n\n### 实施\n\n- 根据软件需求规格说明书和确认测试计划，对软件进行确认测试，撰写确认测试报告\n\
    \n### 输出\n\n- 可运行的、经过确认测试的目标软件系统\n- 确认测试报告\n\n### 说明\n\n- 确认测试由用户进行测试\n\n## 活动7：撰写用户文档\n\
    \n### 任务\n\n- 撰写用户文档\n\n### 输入\n\n- 软件需求规格说明书\n- 软件总体结构、接口设计和数据设计规格说明书\n- 可运行的目标软件系统\n\
    \n### 实施\n\n- 根据用户软件需求规格说明书，软件总体结构、接口设计和数据设计规格说明书撰写用户文档\n- 用户文档一般包括：《用户使用手册》，《安装手册》，《软件开发手册》等等\n\
    \n### 输出\n\n- 《用户手册》\n- 《安装手册》\n- 《开发指南》\n\n## 活动8：用户培训\n\n### 任务\n\n- 对用户进行培训\n\
    \n### 输入\n\n- 软件需求规格说明书\n- 用户使用手册、安装手册、开发手册\n- 可运行的目标软件系统\n\n## 活动9：打包交付\n\n###\
    \ 任务\n\n- 对软件进行打包，并交付用户使用\n\n### 输入\n\n- 可执行的目标软件系统\n- 各种要交付的文档和资料，包括电子版和打印版\n\
    \n### 实施\n\n- 制作安装软件\n- 安装并配置目标软件系统\n- 交付安装软件、文档和资料\n\n### 输出\n\n- 安装软件\n- 交付给用户的文档和资料\n\
    \n## 讲授内容\n\n- 1. 项目案例\n- 2. 什么是软件项目开发过程\n- 3. 为什么需要定义过程\n- 4. 软件开发过程模型\n- 5.\
    \ 如何定义过程\n- 6. 如何剪裁过程\n- 7. 案例分析\n- 8. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_204_0.png)\n\
    \n## 本讲小结\n\n- 组织和项目组需要良定义的软件开发过程来支持软件开发\n- 软件开发过程定义涉及：活动的确定和描述、活动间关系的确定和描述\n\
    - 软件开发过程包括技术活动和管理活动\n- 为了适应不同项目的具体要求，需要对组织的软件开发过程进行剪裁\n- 组织的软件开发过程是不断改进和进化的\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_205_0.png)\n"
