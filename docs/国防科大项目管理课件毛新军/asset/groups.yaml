    # InternVL3: Exploring Advanced Training and Test-Time Recipes for Stronger InternVL
    Models


    Jinguo Zhu,† Xiyu Wang,† Tian Ye,† Dongfu Jiang,† Haoran Wu,† Yuepeng Hu,† Lingchen
    Meng,† Wenze Liu,† Xizhou Zhu, Jifeng Dai, Yu Qiao, Lewei Lu,‡ \u63η Yikang Shen,‡
    \u63or Ziwei Liu‡*


    Shanghai AI Laboratory


    Beijing Academy of Artificial Intelligence


    Department of Computer Science and Engineering, The Chinese University of Hong
    Kong


    Suan Family


    The University of Hong Kong


    Tsinghua University


    Queen Mary University of London


    Department of Computer Science, Johns Hopkins University


    Corresponding authors


    > Abstract


    InternVL3 is a family of open-source multimodal large language models designed
    to bridge the gap between open-source and closed-source models in multimodal capabilities.
    Building upon the architecture and progressive alignment of InternVL2, InternVL3
    introduces a series of innovative enhancements in training and test-time recipes,
    significantly boosting its performance and usability. These enhancements span
    three key areas: (1) Advanced Training Recipes: Our training recipes employ a
    novel powerful dataset. It integrates strong data organization in curriculum learning
    and also introduces a high quality dataset with data-efficient learning strategy,
    improving both sample efficiency and overall performance; (2) Advanced Test-Time
    Recipes: InternVL3 adopts dynamic noise reduction, guided self-distillation, and
    test-time scaling strategies, which reduce error accumulation and harness the
    potential of reasoning; (3) Advanced Model Capabilities: Based on our training
    and test-time recipes, InternVL3 also unlocks strengths such as multi-turn interactive
    reasoning and fine-grained multimodal perception. To evaluate the performance
    of InternVL3, we conduct extensive experiments across a wide range of benchmarks.
    The results demonstrate that InternVL3 outperforms both open-source and closed-source
    models across various tasks, achieving state-of-the-art results and showcasing
    strong multimodal capabilities.


    | Model | InternVL2.5-78B | InternVL3-78B | A/B | Improvement |

    |-------|----------------|---------------|-----|-------------|

    | MMMU val | 72.4 | 73.8 | +1.4 | +1.9% |

    | MathVista | 68.4 | 70.9 | +2.5 | +3.7% |

    | DocVQA | 92.5 | 94.1 | +1.6 | +1.7% |

    | ChartQA | 86.1 | 88.8 | +2.7 | +3.1% |

    | OCRBench | 85.8 | 87.2 | +1.4 | +1.6% |

    | SEED-Bench-2 | 71.6 | 73.0 | +1.4 | +2.0% |

    | MMStar | 69.1 | 70.9 | +1.8 | +2.6% |

    | General VQA | 76.5 | 78.0 | +1.5 | +2.0% |

    | Text VQA | 79.0 | 80.5 | +1.5 | +1.9% |

    | Chart VQA | 84.5 | 85.9 | +1.4 | +1.7% |

    | InfoVQA | 69.1 | 70.5 | +1.4 | +2.0% |

    | Multi-discipline | 62.5 | 64.2 | +1.7 | +2.7% |


    InternVL3-78B outperforms InternVL2.5-78B on various benchmarks. Both models use
    the same backbone (Qwen2.5-72B-Instruct), and the improvement is solely due to
    our advanced training and test-time recipes.


