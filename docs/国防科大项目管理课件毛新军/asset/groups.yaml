    # # 5.3.2 经验估算模型(3/7)


    # ## 基本CoCoMo模型


    +   - E = a * (kLOC)^b ;E是工作量(人月)， a和b是经验常数


    +   - D = c * E^d ;D是开发时间(月)， c和d是经验常数


    +   - 其中， a,b,c,d为经验常数， 其取值见下表


    | 软件类型   |   a |   b |   c |   d | 适用范围   |

    |------------|-----|-----|-----|-----|------------|

    | 组织型     | 2.4 | 1.05| 2.5 | 0.38| 各类应用程序 |

    | 半独立型   | 3.0 | 1.12| 2.5 | 0.35| 各类编译程序等 |

    | 嵌入型     | 3.6 | 1.20| 2.5 | 0.32| 实时软件、OS 等 |'
