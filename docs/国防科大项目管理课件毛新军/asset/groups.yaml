    \ 记录开发活动和软件产品的偏差\n- 记录所有不符合项，报告高级管理者\n\n## 正确理解用户的要求\n\n- 理解客户的要求和需要\n- 让客户参与开发，随时和客户交流，验证客户的需求\n\
    \  - 可用性测试(β版)\n  - 合作开发\n  - 伙伴关系\n  - 软件原型\n\n## 制定标准和规程\n\n在组织内部或者项目组内部制定标准和规程，限制和约束软件开发活动，有助于得到规范化的软件产品，从而提高软件质量\n\
    \n- 软件开发过程规程\n- 需求管理规程\n- 软件需求规格说明书编写规范\n- C++编码规范\n- Java编码规范, ......\n\n## 审查软件开发活动\n\
    \n- 审查每个活动是否遵循软件开发过程规范\n  - 审查每个活动的输入条件是否都得到满足\n  - 审查活动的执行是否遵循规范\n  - 审查每个活动的输出是否都已经产生\n\
    \n"
  mdcn: "\n\n## 软件项目管理课程之第8讲 软件质量保证\n\n毛新军  \nxjmao21@21cn.com  \nhttp://software.nudt.edu.cn/~xjmao\
    \  \n计算机科学与技术系602教研室  \n0731-(45)73649\n\n![](img/f5d721251af5f768deee90a8ee1528f0_615_0.png)\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_615_1.png)\n\n## 软件项目案例\n\n### 案例角色和人物\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_617_0.png)\n\n- **小王：软件项目负责人**\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_617_1.png)\n\n- **老王：公司技术老总**\n\n![](img/f5d721251af5f768deee90a8ee1528f0_617_2.png)\n\
    \n**开发小组：小李，老赵，小田，小谢**\n\n## 要确保软件系统的质量(2/4)\n\n- 各个程序员工作的非常卖力，已经编写了各个软件模块并且对所编写的各个软件模块进行了测试，认为软件已经没有什么大的问题，即使有也是微不足道的，最终将目标软件提交给了用户\n\
    - 用户在使用了该软件后发现了诸多的问题，用户对项目组的工作很有意见，于是项目组不得不重新作需求分析\n  - 软件没有完全满足他的要求\n  - 有些软件功能与他所想象的不一致\n\
    \  - 软件系统不稳定，经常出现死机现象\n- 在将用户需求了解清楚之后，设计小组对该软件重新进行改造，发现软件结构不好，要对软件进行调整和修改非常困难\n\
    \n## 要确保软件系统的质量(3/4)\n\n- 然而为了完成项目的要求，设计小组只好硬着头皮对软件设计进行修改和调整\n- 经过调整后的软件系统问题更多，系统不稳定，有大量的错误，软件变得极为脆弱，为此项目组不得不推翻原有的设计，对整个软件重新进行设计和编码\n\
    - 项目最终在拖延了8个月后交货，然而此时项目组成员已经筋疲力尽\n- 回顾整个项目的历程，项目组成员发现导致这种状况的主要原因是在整个项目实施过程中，项目组没有对项目进行有效的质量监控\n\
    - 软件开发项目如果不吸取该项目的经验教训，相信会重新犯这样的错误，经历这样的恶梦\n\n## 要确保软件系统的质量(4/4)\n\n### 有关软件质量的一些数据\n\
    \n- 20世纪80年代欧洲的“亚利安娜”火箭发射的失败\n- 由于软件出现问题，美国DoD推迟B1轰炸机的部署\n- 由于软件出现问题，美国DoD取消了耗资580亿美元的A12飞机的计划\n\
    - 大量的软件由于质量得不到保证，在交付给用户使用之后不得不被抛弃\n\n## 案例提示我们\n\n![](img/f5d721251af5f768deee90a8ee1528f0_622_0.png)\n\
    \n- 质量保证是极为重要的\n- 在软件项目实施过程中必须提供待开发软件质量的可视性\n- 缺乏质量保证，将会导致所开发的软件不能满足用户的期望和要求\n\
    - 缺乏质量保证，将会导致整个软件项目延期，甚至失败\n\n## 讲授内容\n\n1. 软件项目案例\n2. **软件质量**\n3. 软件质量保证\n4.\
    \ 软件质量保证计划及其实施\n5. CMMI对软件质量保证的要求\n6. 本讲小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_624_0.png)\n\
    \n## 软件质量\n\n1. 什么是软件质量？\n2. 为什么需要关注软件质量？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_625_0.png)\n\
    \n## 什么是软件质量(2/3)\n\n### 影响软件质量的具体因素\n\n![](img/f5d721251af5f768deee90a8ee1528f0_627_0.png)\n\
    \n正确性 可靠性 有效性 完整性 有用性\n\n## 什么是软件质量(3/3)\n\n### 用户对软件质量的评价\n\n- 没有××功能(功能)\n-\
    \ 运行速度太慢(性能)\n- 有太多的错误(故障)\n- 软件不好改动(维护)\n- 界面不美观(人机界面)\n- 这个软件不好使用(易用性)\n- ......\n\
    \n## 为什么需要关注软件质量？\n\n- 高质量的产品才能\n  - 提高客户满意度，占领市场\n  - 降低软件开发的风险\n  - 确保软件项目按照计划实施\n\
    \  - 防止软件项目由于质量问题而流产或者失败\n  - 提高企业的影响力\n\n## 讲授内容\n\n1. 软件项目案例\n2. 软件质量\n3. 软件质量保证\n\
    4. 软件质量保证计划及其实施\n5. CMM对软件质量保证的要求\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_630_0.png)\n\
    \n## 软件质量保证\n\n1. 什么是软件质量保证\n2. 从哪些方面关注软件质量\n3. 谁来保证软件质量\n4. 如何保证软件质量\n\n![](img/f5d721251af5f768deee90a8ee1528f0_631_0.png)\n\
    \n## 什么是软件质量保证(1/2)\n\n- 什么是软件质量保证\n  - 为管理层提供为获知产品质量信息所需的数据，从而获得产品质量是否符合预定目标的认识和信息\n\
    - 软件质量保证是要为软件产品的质量提供某种可视性，知道哪些地方有质量问题，便于改进方法和措施，提高软件产品的质量\n  - 例如，对软件进行测试，发现有哪些错误，这些错误的性质(严重、一般)\n\
    \n## 什么是软件质量保证(2/2)\n\n- 软件质量保证要做的事情\n  - 了解产品质量(例如，软件测试)\n  - 提交软件质量报告(例如，软件测试报告)，说明质量问题\n\
    \  - 为项目组和管理层服务(例如，告诉问题所在，便于改进管理和技术)\n\n## 从哪些方面关注软件质量(1/3)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_634_0.png)\n\
    \n## 从哪些方面关注软件质量(2/3)\n\n- 软件产品\n  - 软件需求规格说明书\n  - 软件设计规格说明书\n  - 源程序代码，....\n\
    - 开发活动\n  - 需求分析\n  - 软件设计\n  - 编码\n- 标准和规程\n\n## 从哪些方面关注软件质量(3/3)\n\n- 组织内部或者在项目开始之时要制定软件开发的标准和规程\n\
    - 软件产品\n  - 文档类: 审核, 产生审核报告\n  - 代码类: 测试, 产生测试报告\n- 开发活动\n  - 审查, 产生审查报告\n\n##\
    \ 谁来执行和实施软件质量保证\n\n- 软件项目质量保证小组(SQA小组)\n- 独立于项目开发小组\n- 具有比较大的权限\n\n![](img/f5d721251af5f768deee90a8ee1528f0_637_0.png)\n\
    \n## 如何保证软件质量\n\n- 正确理解用户的要求\n- 制定标准和规程\n- 审查软件开发活动\n- 审核软件工作产品\n- 测试源程序代码\n-\
    \ 记录开发活动和软件产品的偏差\n- 记录所有不符合项，报告高级管理者\n\n## 正确理解用户的要求\n\n- 理解客户的要求和需要\n- 让客户参与开发，随时和客户交流，验证客户的需求\n\
    \  - 可用性测试(β版)\n  - 合作开发\n  - 伙伴关系\n  - 软件原型\n\n## 制定标准和规程\n\n在组织内部或者项目组内部制定标准和规程，限制和约束软件开发活动，有助于得到规范化的软件产品，从而提高软件质量\n\
    \n- 软件开发过程规程\n- 需求管理规程\n- 软件需求规格说明书编写规范\n- C++编码规范\n- Java编码规范, ......\n\n## 审查软件开发活动\n\
    \n- 审查每个活动是否遵循软件开发过程规范\n  - 审查每个活动的输入条件是否都得到满足\n  - 审查活动的执行是否遵循规范\n  - 审查每个活动的输出是否都已经产生\n\
    \n"
