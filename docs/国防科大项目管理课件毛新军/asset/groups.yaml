  mdcn: "\n\n## 人员风险(2/3)\n\n- 项目后期，加入新的开发人员，额外的培训和沟通降低了项目组成员的开发效率\n- 项目组成员不能有效的在一起工作\n\
    - 由于项目组成员之间的冲突，导致沟通不畅，设计欠佳，接口错误和额外重复的工作\n- 有问题的项目组成员没有调离项目组，影响其他成员的积极性\n- 项目组的最佳人选没有加入项目组，或者加入项目组但没有合理使用\n\
    - 关键任务只能兼职参与\n- 项目人员不足\n\n## 人员风险(3/3)\n\n- 任务的分配和人员的技能不匹配\n- 人员工作的进展比预期的要慢\n\
    - 项目管理人员怠工导致计划和进度失效\n- 技术人员怠工导致工作遗漏、质量低下，工作需要重做\n\n## 设计和实现风险\n\n- 设计过于简单，考虑不仔细、不全面，导致重新设计和实现\n\
    - 设计过于复杂，导致一些不必要的工作，影响效率\n- 设计质量低下，导致重新设计和实现\n- 使用不熟悉的方法，导致需要额外的培训时间\n- 产品使用低级语言编写，导致效率较低\n\
    - 分别开发的模块无法有效集成，需要重新设计和实现\n\n## 过程风险\n\n- 跟踪不准确，导致无法预知项目进展是否落后于计划\n- 前期的质量保证行为不真实，导致后期的重复工作\n\
    - 质量跟踪不准确，导致无法得知影响进度的质量问题\n- 不能有效遵循标准，导致沟通不足，质量问题和重复工作\n- 风险管理粗心，导致没有发现重大的项目风险\n\
    - ......\n\n## 评估风险发生的概率(1/2)\n\n- 主观性较强，采用方法\n  - 熟悉系统、有经验的人参与评估\n  - 多人独立评估，综合折中\n\
    \  - 采用分类：非常可能(0.8-1.0)，很可能(0.6-0.8)，或许(0.4 - 0.6)，不太可能(0.2-0.4)，不可能(0-0.2)\n\n\
    ## 评估风险发生的概率(2/2)\n\n| 编号 | 风险名称 | 发生概率 |\n|---|---|---|\n| 1 | 计划过于乐观 | 50% |\n\
    | 2 | 由于要完全支持自动从主机更新数据而造成额外的需求 | 5% |\n| 3 | 由于市场变化而需额外的需求 | 35% |\n| 4 | 图形格式子系统接口不稳定\
    \ | 25% |\n| 5 | 设计欠佳，需要重新设计 | 15% |\n\n## 评估风险发生造成的损失\n\n可以基于“进度”，“成本”或者“工作量”来进行估算\n\
    \n| 编号 | 风险名称 | 发生概率 | 损失(人周) |\n|------|----------|----------|------------|\n\
    | 1 | 计划过于乐观 | 50% | 5 |\n| 2 | 由于要完全支持自动从主机更新数据而造成额外的需求 | 5% | 20 |\n| 3 | 由于市场变化而需额外的需求\
    \ | 35% | 8 |\n| 4 | 图形格式子系统接口不稳定 | 25% | 4 |\n| 5 | 设计欠佳，需要重新设计 | 15% | 15 |\n\
    \n## 计算风险危险度\n\n风险危险度 = 风险概率 × 风险损失\n\n| 编号 | 风险名称 | 发生概率 | 损失(人周) | 危险度(周) |\n\
    |------|----------|----------|------------|------------|\n| 1 | 计划过于乐观 | 50% |\
    \ 5 | 2.5 |\n| 2 | 由于要完全支持自动从主机更新新数据而造成额外的需求 | 5% | 20 | 1.0 |\n| 3 | 由于市场变化而需额外的需求\
    \ | 35% | 8 | 2.8 |\n| 4 | 图形格式子系统接口不稳定 | 25% | 4 | 1.0 |\n| 5 | 设计欠佳，需要重新设计 |\
    \ 15% | 15 | 2.25 |\n\n## 风险优先级(1/2)\n\n- 统计表明，项目80%成本用于解决20%的问题\n- 风险管理重点关注20%重要的部分\n\
    - 根据风险的危险度确定风险的重要性，忽略其他的部分\n\n## 讲授内容\n\n1. 项目案例\n2. 什么是软件风险？\n3. 如何进行风险管理？\n\
    4. 风险评估\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_523_0.png)\n\
    \n## 风险控制\n\n1. 风险管理计划\n2. 风险化解\n3. 风险监控\n\n![](img/f5d721251af5f768deee90a8ee1528f0_524_0.png)\n\
    \n## 风险管理计划(1/2)\n\n- 针对每一个重要的风险，制定一个处理该风险的计划\n  - 风险由谁引起\n  - 表现形式是什么\n  - 可能什么时候发生\n\
    \  - 为什么发生\n  - 如何避免或者消除它的发生\n  - 发生后的处理措施\n\n## 风险管理计划(2/2)\n\n- 例子，小谢将在项目实施过程中离开公司\n\
    \  - 项目组的小谢\n  - 项目组成员小谢由于出国离开公司\n  - 小谢可能会在6月1日前后出国\n  - 为了进一步学习和深造\n  - 和小谢协商能否在项目结束之后(大约7月中旬)离开\n\
    \  - 如果离开，计划让小王接替他的工作，同时让小刘分担小王的一部分工作\n\n## 风险化解(1/2)\n\n### 风险化解方式\n\n- 避免风险：推迟小谢的离开时间\n\
    - 将风险从系统的一部分转移到另一部分：让客户来做\n- 消除发生风险的根源：加薪\n- 发布风险：不会突然和惊讶\n- 接受和控制风险：接受并提供处理计划，安排小王接替小谢的工作\n\
    - 记录风险：为将来项目风险管理提供历史数据\n\n## 风险化解(2/2)\n\n| 风险描述 | 控制方法 |\n|---|---|\n| 人员薄弱 |\
    \ 招募顶级人才，培训，团队建设，项目开始前招聘或预定关键成员 |\n| 承包商失败 | 检查参考资料，外包前检查承包商的能力，积极管理承包商 |\n| 设计低劣\
    \ | 要有清晰的设计活动和设计时间，进行设计检查 |\n| 计划过于乐观 | 估算要科学，利用工具，借鉴历史数据 |\n| 质量低劣 | 制定质量保证计划，落实质量保证计划，安排专人负责质量保证\
    \ |\n\n## 风险监控(1/2)\n\n- 检查风险的化解程度及其变化(概率、损失)\n- 风险监控的方式\n  - 监控和跟踪重要的(前10个)风险，记录风险危险度的变化以及风险化解的进展\n\
    \  - 中间审查，在每个里程碑后进行小规模的走查\n  - 任命风险官员(适合于大项目)，警告项目风险，防止项目经理和开发人员忽略计划中的风险管理\n\n\
    ## 风险监控(2/2)\n\n| 本周排序 | 上周排序 | 监控周数 | 风险描述 | 化解进展 |\n|---|---|---|---|---|\n\
    | 1 | 1 | 5 | 功能蔓延 | 采取分阶段交付的方式，需和市场人员和最终用户解释 |\n| 2 | 5 | 5 | 设计低劣 | 按已定规范设计，进行审核\
    \ |\n| 3 | 2 | 4 | 测试负责人未到位 | 候选人名单已经报给公司主管，最晚将于下周确定 |\n\n## 讲授内容\n\n1. 项目案例\n\
    2. 什么是软件风险？\n3. 如何进行风险管理？\n4. 风险评价\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_531_0.png)\n\
    \n## 小结\n\n- 在项目实施过程中风险大量存在\n- 风险影响项目的成功实施，严重时可导致项目失败\n- 必须对项目中的各种可能的风险进行管理\n\
