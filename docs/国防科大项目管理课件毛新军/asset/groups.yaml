    \n## 实施过程活动(14/15)\n\n- 制定关于项目所需软件工程设施和支持工具的计划\n  - 对这些设施和支持工具的能力需求的估算应建立在对于软件工作产品的规模估计和其它特征的基础上，软件开发设施和支持工具的例子包括：\n\
