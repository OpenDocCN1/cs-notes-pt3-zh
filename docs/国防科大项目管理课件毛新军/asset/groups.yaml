    \n## 团队管理的内容(1/2)\n\n# 第10讲 软件开发团队的管理\n\n- 团队管理的目的\n  - 确保团队的战斗力\n  - 确保团队的凝聚力\n\
    \  - 确保团队的工作效率和质量\n\n## 团队管理的内容(2/2)\n\n- 团队管理的内容\n  - 团队的组织\n    - 工作效率和质量、凝聚力\n\
    \  - 团队的交流和合作\n    - 工作效率和质量、战斗力\n  - 团队的纪律\n    - 战斗力\n  - 团队的激励机制\n    - 凝聚力\n\
    \n## 讲授内容\n\n1. 什么是团队\n2. 团队管理的内容\n3. 团队的组织结构\n4. 成功团队 vs 失败团队\n5. 团队激励机制\n6.\
    \ 做一个好的项目经理\n7. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_681_0.png)\n\n\
    ## 团队的组织结构\n\n- 组建团队结构应考虑的因素\n- 团队模式\n\n## 明确团队的目标\n\n- 解决问题\n  - 开发一个具体的项目\n\
    - 创新\n  - 研发一个新的产品，具有新颖的产品目标、提供了其他产品所不具备的功能、采用了新的方法和技术\n- 战术执行\n  - 执行一个良定义的计划、问题明确，如产品升级、维护\n\
    \n## 确定团队的种类\n\n### 问题解决团队\n\n- 解决一个复杂、问题没有明确定义的问题\n- 例如，开发图书馆管理软件系统\n- 团队的成员应该是可信赖、活跃、聪明\n\
    \n### 创新团队\n\n- 探索可能性和选择性\n- 例如，研发一个智能决策软件用于诊断天然气管道的故障\n- 自我激励、自治、富于创新、百折不挠\n\n\
    ### 战术执行团队\n\n- 执行一个良定义的计划、具有明确的问题\n- 例如，一个软件维护工作\n- 紧迫感、注重行动\n\n## 高效团队的特征\n\n\
    ### 明确角色和职责\n\n- 各个成员清晰、明确地知道自己做什么\n- 项目计划\n\n### 监控个人表现和提供反馈\n\n- 让成员知道是可接受的还是有待进一步提高\n\
    - 项目跟踪、质量保证\n\n### 有效沟通\n\n- 易于获得信息、沟通的媒介、参与、记录沟通\n- 配置管理、会议、文档化\n\n### 以事实为依据提供决策\n\
    \n- 决策要依赖于事实依据，而不是主观判断\n\n## 团队的模式\n\n- 业务团队\n- 首席程序员团队\n- 臭鼬项目团队\n- 特征团队\n- 搜索救援团队\n\
    - 战术(SWAT)团队\n- 大型团队\n\n## 业务团队\n\n由一个技术领带带领的团队\n\n团队成员可能来自不用的专业领域、熟悉不同的编程语言\n\
    - 数据库、制图、交换机\n- Java, C++, TSAPI\n\n技术领导人负责技术的最终决策\n\n典型的等级层次结构\n- 技术领导人，技术决策和管理部门沟通\n\
    - 团队成员在自己的领域内工作\n\n适合于解决型、创新型、和战术型\n\n## 首席程序员团队\n\n- 产生于20世纪60年代末70年代初，IBM\n\
    - 首席程序员负责完成软件开发的主体工作：\n  完成所有的设计、编写大部分的代码、进行项目决策，其他人为首席程序员提供支持\n  - 后备程序员，批评家、联络人、研究助手\n\
    \  - 管理员，处理管理事务如财务、人员、场地和机器设备\n  - 工具员，制作首席程序员所需的工具\n- 适合于创新型和战术型团队目标\n\n## 臭鼬项目团队\n\
    \n- 由一批有才华、有创造性的产品开发者、置于一个不受组织官僚限制的机构中，使他们放手开发和创新\n- 典型的黑箱管理方式\n- 可以调动积极性、但是缺乏可视性\n\
    - 适合于创新型\n\n## 特征团队\n\n- 成员来自不同职责和功能部门，例如质量保证、配置管理、系统分析，这些人员只向本部门汇报和负责\n- 特征团队有授权、责任和平衡的优势\n\
    - 适合于解决问题和创新类型\n\n## 搜索救援团队\n\n- 专门针对特定的问题\n- 由专业人员和队伍组成\n- 短期\n- 适合于解决问题型\n\n\
    ## 战术团队\n\n- 每个成员是某个方面的专家，如人机界面、用户领域知识\n- 团队经过专门、多方面的培训\n- 协同得非常好，天衣无缝\n- 让掌握特定工具和技能的一组人员去解决与这个特定的工具和实践有关的问题\n\
    - 持久，习惯在一起工作，有明确定义、稳定的角色\n- 适合于解决问题\n\n## 大型团队\n\n- 大型团队的人员组成较多\n- 沟通膨胀， n*(n-1)/2\n\
    - 简化沟通\n- 方式：创造层次、划分小组、指定代表进行沟通\n\n"
