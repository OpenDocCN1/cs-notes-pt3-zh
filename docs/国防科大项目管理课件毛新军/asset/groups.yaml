  md: "\n\n## 实施过程活动(6/15)\n\n- 由下列人员评审软件开发计划\n  - 项目负责人\n  - 项目软件负责人\n  - 其它受影响组\n\
    - 软件开发计划应受管理和控制\n\n## 实施过程活动(7/15)\n\n- 将软件开发计划写成文档，内容包括：\n  - 项目软件的目的、范围、目标和指标\n\
    \  - 软件生存周期的选择\n  - 开发和维护软件用的规程、方法和标准的标识\n  - 待开发软件工作产品的标识\n  - 软件工作产品规模的估计\n\
    \  - 软件项目工作量和成本的估计\n  - 关键计算机资源使用情况的估计\n  - 软件项目的进度，包括各个里程碑和评审的标识\n  - 项目软件风险的标识和评估\n\
    \  - 关于项目软件工程设施和支持工具的计划\n\n## 实施过程活动(8/15)\n\n- 标识为建立和维护控制软件项目所需的工作产品\n- 参考软件配置管理关键过程域的活动\n\
    \n## 实施过程活动(9/15)\n\n- 按照文档化规程，导出软件工作产品规模(或对软件工作产品规模的更动)的估算\n  - 对所有主要的软件工作产品和活动作出规模估计\n\
    \    - 要作规模估计的工作产品和活动的类型的例子有\n      - 运行软件和支持软件\n      - 可交付的和不交付的工作产品\n     \
    \ - 软件和非软件工作产品(例如文档)\n      - 开发、验证和确认工作产品的活动\n  - 估计方法\n    - 功能点\n    - 特征点\n\
    \    - 代码行\n\n## 实施过程活动(9/15 cont.)\n\n- 将软件工作产品进行分解，直到适于进行估计的粒度\n- 在有历史资料的地方应使用历史资料\n\
    - 对规模估计写成文档，进行评审、并使之得到认可\n\n- 项目负责人\n- 项目软件负责人\n- 其它受影响组\n\n## 实施过程活动(10/15 cont.)\n\
    \n- 对工作量、人员配置和成本的估计应基于过去的经验\n- 将导出估算时所作的假定和估算结果记入文档，进行评审并使之得到认可\n\n## 实施过程活动(11/15)\n\
    \n- 按照文档化的规程，导出项目软件的关键计算机资源的估算\n  - 标识项目的关键计算机资源\n    - 计算机存储容量\n    - 计算机处理器能力\n\
    \    - 通信通道容量\n  - 关键计算机资源的估算应与下列各项的估计关联起来考虑\n    - 软件工作产品的规模、运行处理的负载、通信量\n  -\
    \ 对关键计算机资源的估算写成文档、进行评审、并使之得到认可\n\n## 实施过程活动(12/15)\n\n按照文档化的规程，导出项目的软件进度表，该规程一般规定\n\
    \n- 软件进度表的制定应与下列各项关联起来考虑\n- 软件工作产品规模(或规模更动)的估计\n- 软件工作量和成本的估计\n- 软件进度表的制定应基于过去的经验\n\
    - 可能时，利用类似项目的经验\n\n## 实施过程活动(12/15 cont.)\n\n- 软件进度表应满足设定的里程碑日期、关键的日期以及其它限制要求\n\
    - 软件进度表中的活动应有合适的持续时间，而且里程碑是以适当的时间间隔分开的，以便能支持度量软件项目进展中的精度\n- 将导出进度表时的假定记入文档\n-\
    \ 对软件进度表写成文档、进行评审、并使之得到认可\n\n## 实施过程活动(13/15)\n\n- 对与项目成本、资源、进度和技术方面相关联的软件风险进行鉴别、评估并写成文档\n\
    \  - 根据风险对项目的潜在影响，对各种风险进行分析并按优先级排序\n  - 标识导致风险的各种偶发事件\n    - 进度受阻\n    - 人员更换\n\
    \n## 实施过程活动(14/15)\n\n- 制定关于项目所需软件工程设施和支持工具的计划\n  - 对这些设施和支持工具的能力需求的估算应建立在对于软件工作产品的规模估计和其它特征的基础上，软件开发设施和支持工具的例子包括：\n\
    \    - 软件开发用的计算机和外设\n    - 软件测试用的计算机和外设\n    - 目标计算机环境中的软件\n    - 其它支持软件\n  -\
    \ 为了获得或研制这些设施和支持工具，分配职责、商谈承诺\n  - 所有受影响组评审该计划\n\n## 实施过程活动(15/15)\n\n- 记录软件策划的资料\n\
    \  - 所记录的信息包括估算以及相关信息\n  - 软件策划的资料应受管理和控制\n\n## 度量和分析\n\n- 进行度量，并将度量结果用于确定软件策划活动的状态\n\
    \  - 将软件项目策划活动的里程碑的完成情况与计划相比较\n  - 将软件项目策划活动中所完成的工作，所用的工作量和所消耗的资金与计划相比较\n\n##\
