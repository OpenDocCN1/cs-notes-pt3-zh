    # # 项目经理的技能


    # ## 管理能力


    +   - 理解、引导和设法满足项目涉众的需求和期望

    +   - 开展大量的领导、沟通和谈判活动

    +   - 不断解决问题，并对整个组织产生影响

    +   - 明确前景，合理授权，积极营造一个充满活力的工作环境


    # ## 组织和团队建议能力


    +   - 激励不同类型的组员一起为项目目标协力工作

    +   - 在团队内部以及团队与其他项目涉众之间培养团队精神

    +   - 具有一定的应变能力、灵活性、创造性、耐性


    # ## 有效使用相关技术和工具'
  - '[PAGE 725]


    # # 有效的&低效的项目经理


    | 有效的项目经理 | 低效的项目经理 |

    |---|---|

    | 有表率作用 | 表率作用差 |

    | 有洞察力 | 不自信 |

    | 技术过硬 | 缺乏专业技能和经验 |

    | 有决断力 | 不善于沟通 |

    | 善于沟通 | 不会激励他人 |

    | 善于激励他人 | |

    | 必要时能够支持上级领导 | |

    | 支持团队成员 | |

    | 鼓励新概念新思想 | |'
  - '[PAGE 726]


    # # 项目经理的职责


    +   - 确定项目范围

    +   - 识别项目涉众

    +   - 指定项目计划

    +   - 确认并跟踪项目的关键里程碑

    +   - 参与项目的阶段评审

    +   - 保障所需的资源

    +   - 管理变更控制过程

    +   - 汇报项目状态'
  - '[PAGE 727]


    # 激励组员


    +   - 了解组员的职业生涯和个人的生活情况, 根据他们的需要提供激励

    +     - 关心个人发展和晋升

    +     - 工作的认可和鼓励

    +     - 舒适的工作环境

    +     - 组织聚会和社会活动, 增加归宿感'
  - '[PAGE 728]


    # # 关心下属的成长


    +   - 公司关心的是市场竞争力和业绩

    +   - 员工关心的是个人事业的发展和对工作的满意度

    +   - 项目经理应充当好协调员，将员工个人的发展和公司的发展有机结合起来，对员工进行培训

    +   - 不能采用硬性指标'
  - '[PAGE 729]


    # # 永远支持组员


    +   - 为组员提供服务，包括训练和指导、解决问题和冲突、提供资源、建立项目目标和优先级、提供适当的技术指引。要使每个组员都能清楚的知道，你总是可以帮助他们。在你所作的事情中，对于组员要求你帮助他们这件事，应该具有非屏蔽中断的优先级'
  - '[PAGE 730]


    # # 项目经理的影响力和权力


    +   - 强制力

    +   - 合法权力

    +   - 专家权力

    +   - 奖励权力

    +     - 现金、地位、认可度、升职、富有挑战的任务...

    +   - 感召力和友谊'
  - '[PAGE 731]


    # # 正确使用权力


    +   - 让组员感知这些权力

    +   - 过分强调合法权力或权威，会导致项目失败

    +   - 过多使用资金、惩罚或威胁，会导致项目失败

    +   - 一些特定的奖励，如富有挑战性的工作，工作成就，以及认可度才能真正引导员工改变行为或者努力工作'
  - '[PAGE 732]


    # 提高办事效率


    +   - 保持积极状态

    +   - 牢记主要目标

    +   - 把最重要的 事放在最重要的位置上

    +   - 考虑双赢

    +   - 首先去理解和倾听别人，然后再被别人理解

    +   - 协同

    +   - 不断学习'
  - '[PAGE 733]


    # # 持续改进


    +   - 基于项目总结，建立短期以及长期改进的一些目标


    +   - 目标要尽可能量化


    +   - 两个强烈的原因要求改进过程：校正问题和防止问题，确保你的改进努力要围绕着已知的或可预知的可能威胁项目成功的问题


    +   - 领导你的小组找出当前正在使用的方法的长处和短处，以及项目面临的风险'
  - '[PAGE 734]


    # # 学习过去


    +   - 每个经理花时间处理每种可能的错误是非常困难的，学习过去的成功和失败是成功的开始

    +   - 项目结束后，要实施项目总结。目标不是判定责任，而是为了在以后项目中作得更好

    +   - 在每个项目的主要里程碑时，通过集体讨论或公平的组织者，用同样的方式，领导小组对其展开分析

    +   - 了解已有的软件工业的最佳准则

    +   - 建立自己的最差实践和最佳实践'
  - '[PAGE 735]


    # # 利用沟通解决冲突


    +   - Black和Mouton提出的五种冲突处理模式

    +     - 面对

    +     - 妥协

    +     - 圆滑

    +     - 强制

    +     - 侧推'
  - '[PAGE 736]


    # # 项目经理要则


    +   - 弄清项目经理所面临的问题、机会和期望

    +   - 明白冲突是团队发展中的自然之物

    +   - 弄清谁是利益关系者

    +   - 意识到组织的强烈政治色彩

    +   - 必须精于领导，但应灵活机动

    +   - 明白判断项目成功的四个标准：预算、进度、绩效标准、客户满意

    +   - 充当激励者、教练、活跃气氛者、维和人员和冲突裁决人

    +   - 注意你的情绪——团队成员培养品质的基础

    +   - 不能安于现状，经常做“如果—那么”的假设

    +   - 有效地利用好时间

    +   - 首要任务是：计划、计划、计划'
