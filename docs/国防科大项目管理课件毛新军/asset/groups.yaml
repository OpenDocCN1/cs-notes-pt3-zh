    +     - 受控：在给定时间(过去或现在)使用的工作产品的版本是已知的(即受版本控制的)，并以受控的方式进行更动(即更动控制)

    +     - “软件工程”是指软件设计、编码、测试等

    +     - “软件管理”是指项目计划制定、项目跟踪、风险等

    +   - 软件计划、产品和活动与软件需求保持一致

    +     - 所谓“保持一致”是指相吻合'
