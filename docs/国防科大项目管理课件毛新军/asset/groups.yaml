    # 什么是软件需求(1/4)


    ![](img/f5d721251af5f768deee90a8ee1528f0_544_0.png)


    +   - 什么是软件需求？

    +   待开发软件产品的目标用户对该软件产品的功能、性能、设计约束和其它方面的期望和要求


    # 说明


    +   - 目标用户

    +     - 实际操作该软件的用户(图书管理员)

    +     - 用户方的负责人

    +     - 用户代表(市场经理), .......


    +   - 必须是用户所需的

    +     - 例如，网上图书借阅(想法很好，用户不需要，也不现实)'
  - '[PAGE 545]


    # # 什么是软件需求(2/4)


    # ## 关于软件需求的注意事项


    +   - 软件需求关注用户的期望、要求和需要，不是解决方案


    +   - 要区分what和How


    +   - 例如，要采用什么算法，不是用户需求


    +   - 并不是所有方面的要求都是软件需求


    +   - 功能、性能、设计约束、时间进度等


    +   - 例如，重量、软件大小等不是用户需求


    +   - 并不是所有用户的期望和要求都是软件需求


    +   - 用户需求必须中肯，有意义


    +   - 例如，记录图书的厚度等不是用户需求'
  - '[PAGE 546]


    # # 什么是软件需求(3/4)


    +   - 软件需求的表现形式

    +     - 功能需求

    +     - 性能需求

    +       - 易用性、质量、性能、安全性，移植性、可重用性等

    +     - 设计约束

    +       - 运行环境

    +       - 开发环境

    +     - 其它要求：如开发周期'
