    \n## 为什么需要对软件需求进行管理\n\n- 软件需求非常重要\n- 获取软件需求非常复杂和困难\n- 在需求获取过程中涉及到人、活动和过程，只有对它们进行管理才能确保有效地进行需求分析，确保软件需求的质量\n\
    - 软件需求经常变更，为了确保软件需求处于受控状态\n\n## 需求管理的内容\n\n- 参与需求分析和评审的人员\n- 软件需求文档\n- 需求分析过程\n\
