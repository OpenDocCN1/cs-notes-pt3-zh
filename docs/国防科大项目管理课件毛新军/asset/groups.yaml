    \n- 是指相互关联的若干软件实践活动的集合，描述了为了达到某个成熟度等级必须解决的主要问题（所谓关键表示必不可少）\n- 要达到该级需解决的主要矛盾\n\
    - 例如，2级中的“需求管理”\n\n## 有哪些关键过程域（2/4）\n\n- 已定义级（3级）\n  - 机构过程焦点\n  - 机构过程定义\n  -\
    \ 培训大纲\n  - 综合软件管理\n  - 软件产品工程\n  - 组间协调\n  - 同行评审\n\n## 软件项目管理概述\n\n## 有哪些关键过程域（3/4）\n\
    \n- 可管理级（4级）\n  - 定量过程管理\n  - 软件质量管理\n\n## 有哪些关键过程域（4/4）\n\n- 优化级（5级）\n  - 缺陷预防\n\
    \  - 技术更新管理\n  - 过程更改管理\n\n## 关键过程域的组成\n\n### 目标\n\n- 每个关键过程域都有一组欲要达到的目标\n- 例如，2级中的“需求管理”的目标：控制指定给软件的系统需求，为软件工程和管理应用建立基线\n\
    \n### 关键实践\n\n- 每个关键过程域包含一组必须完成的关键实践，以便达到该关键过程域相应的目标\n- 例如，在分配需求被纳入软件项目之前，软件工程组对它们进行评审\n\
    - 仅当关键过程域的所有目标都已达到时，该关键过程域才算实现\n\n## 关键实践（1/2）\n\n- 每个关键过程域包含若干个关键实践，以实现该关键过程域的目标\n\
    - 什么是关键实践？\n  - 是指对所在关键过程域目标的实现和规范化实施必不可少的实践活动\n  - 例如（二级需求管理关键过程域），在分配需求被纳入软件项目之前，软件工程组对它们进行评审\n\
    \n## 关键实践（2/2）\n\n- 如何描述关键实践？\n  - 说明关键实践的基本方针、规程和活动\n  - 详细阐述\n- 关键实践只描述“做什么”，而不描述“如何做”\n\
    \n## 关键实践类（1/4）\n\n- 什么是关键实践类\n- 尽管不同的关键实践可能具有相同的特性\n- 指一组具有共同特性的软件实践活动的集合\n-\
    \ 可以利用关键实践类对关键实践重新组织\n\n## 关键实践类（2/4）\n\n### 有哪些关键实践类？\n\n#### 执行约定\n\n- 描述了组织为确保过程的建立和持续而必须采取的一些措施\n\
    - 典型内容包括机构策略和领导关系\n- 例子，项目遵循一个书面的、由组织制定的用以管理分配给软件的系统需求的方针\n\n#### 执行能力\n\n- 描述了项目和组织完整的实现软件过程所必须具备的先决条件\n\
    - 典型内容包括资源、机构和培训\n- 例子，提供足够的用以管理分配需求的资源和经费\n\n## 关键实践类（3/4）\n\n- 执行活动\n  - 描述了执行了一个关键过程域所必须的活动\n\
    \  - 典型内容包括制定计划和规程，执行和跟踪，必要时采取纠正措施\n  - 例子，在分配需求被纳入软件项目之前，软件工程组对它们进行评审\n- 度量和分析\n\
    \  - 描述了为确定与过程有关的状态所需的基本测量实践，用于改进和控制过程\n  - 典型内容包括可能采用的测量实例\n  - 例子，进行度量，并将度量结果用以确定分配需求管理活动的状态\n\
    \n©Copyright Xinjun Mao 2005\n\n61\n\n## 关键实践类（4/4）\n\n### 一 验证执行\n\n- 描述了为确保执行的活动与已建立过程一致所采取的步骤\n\
    - 典型内容包括：管理部门和软件质量保证组实施的评审和审核\n- 例子，软件质量保证组对分配需求管理活动和工作产品进行评审和（或）审计，并报告其结果\n\n\
    ## CMM的应用\n\n- 促进软件开发过程的管理和控制\n- 提高软件质量，缩短软件开发周期\n- 对软件承包商软件能力进行评估，指导选择承包商\n-\
    \ 为软件承包商提供了一种改进其软件过程和提高软件质量的有效途径\n- 为用户方提供了一种跟踪和监督软件合同执行情况的有效方法\n- CMM只回答“做什么？”，“如何做？”由开发组织自己定义\n\
    \n## 本讲小结\n\n- 软件项目的实施需要有效的管理\n- 软件项目管理涉及到过程、人员和产品等多个方面问题的解决\n- 目前有许多与软件项目管理有关的规范和标准\n\
    - CMM是一个支持软件过程能力评估、评价和提高的标准\n  - “做什么”，而不是“怎么做”\n  - 如何做要根据组织的具体情况\n  - Just Enough\n\
    \  - 不要追求形式\n\n![](img/f5d721251af5f768deee90a8ee1528f0_96_0.png)\n\n## 教学目的\n\
