    \n- 通过跟踪对软件项目的实施提供可视性\n  - 知道项目的实际执行和实施情况\n  - 知道项目实施过程中(可能)出现了哪些问题\n  - 知道如何采取措施防止问题的出现，或者出现时该采取什么办法减少它给软件项目实施带来的影响和损失\n\
    \n## 软件项目跟踪示意图\n\n- 了解项目进展\n- 发现问题和风险\n- 采取措施\n\n- 项目风险\n- 项目进展\n- 项目活动\n- 开发活动问题\n\
    - 项目展望\n\n项目计划\n\n项目实施过程\n\n- 项目跟踪小组会议\n- 项目跟踪负责人员\n\n## 为什么需要对软件项目进行跟踪\n\n- 软件项目实施相对于计划的不确定性、动态性和实施过程中问题多样性和不可预知性及其带来的风险\n\
    \  - 不现实的截至日期\n  - 对工作量和资源数量估算不足\n  - 客户需求的动态变化\n  - 交流不畅而导致的项目延期\n  - 计划没有考虑风险\n\
    \  - 事先无法预知的技术问题\n  - 事先无法预知的人力困难\n\n## 讲授内容\n\n- 项目案例\n- 什么是软件项目跟踪？\n- 为什么需要对软件项目进行跟踪\n\
    - 软件项目跟踪会议\n- 软件项目跟踪的过程和步骤\n- CMM对软件项目跟踪的要求\n- 小结\n\n## 软件项目跟踪会议\n\n- 何时召开会议\n\
    - 谁来参加会议\n- 跟踪会议的组织和召开\n- 修复计划\n- 问题升级\n\n![](img/f5d721251af5f768deee90a8ee1528f0_427_0.png)\n\
    \n## 何时召开会议\n\n- 频率：每周召开一次\n- 安排在每周的同一天、同一时间、同一地点\n- 最好安排在周2，或者周3\n  - 之前有所准备\n\
    \  - 之后有所预留\n\n## 谁来参加会议\n\n- 小项目(人数小于10人)\n  - 所有的项目组成员参与会议\n- 大项目(人数大于10人)\n\
    \  - 各个小组和产品的负责人\n\n## 跟踪会议的组织和召开\n\n- 围绕跟踪对象\n- 指定负责人，防止推卸责任\n- 限定阐述时间，言简意赅，提高效率\n\
    - 会议日程应预先安排好，预先通知有关人员\n- 确保每个人有备而来\n- 费时的问题留待会后解决\n- 鼓励开放、坦诚的报告情况\n\n## 修复计划\n\
    \n- 通过跟踪发现问题不是最终目的，必修尽快提供修补问题的措施以把问题造成的损失减少到最少范围 → 制定修复计划\n\n- 修复计划的内容\n\n- 指定负责人\n\
    \n- 确定活动次序\n\n- 决定活动的起止时间，找出依赖活动\n\n- 确保相关人员赞成该计划\n\n## 问题升级\n\n- 如果在开发过程中发现争端，该如何处理？\n\
