    \n- 由一批有才华、有创造性的产品开发者、置于一个不受组织官僚限制的机构中，使他们放手开发和创新\n- 典型的黑箱管理方式\n- 可以调动积极性、但是缺乏可视性\n\
    - 适合于创新型\n\n## 特征团队\n\n- 成员来自不同职责和功能部门，例如质量保证、配置管理、系统分析，这些人员只向本部门汇报和负责\n- 特征团队有授权、责任和平衡的优势\n\
    - 适合于解决问题和创新类型\n\n## 搜索救援团队\n\n- 专门针对特定的问题\n- 由专业人员和队伍组成\n- 短期\n- 适合于解决问题型\n\n\
    ## 战术团队\n\n- 每个成员是某个方面的专家，如人机界面、用户领域知识\n- 团队经过专门、多方面的培训\n- 协同得非常好，天衣无缝\n- 让掌握特定工具和技能的一组人员去解决与这个特定的工具和实践有关的问题\n\
    - 持久，习惯在一起工作，有明确定义、稳定的角色\n- 适合于解决问题\n\n## 大型团队\n\n- 大型团队的人员组成较多\n- 沟通膨胀， n*(n-1)/2\n\
