  - '[PAGE 234]


    # # 5.2 面向功能的度量(2/7)


    # ## 功能点计算方法


    +   - FP = (0.65 + 0.01 × ΣFᵢ) × CT


    +   - CT : 5个信息量的 “加权和”


    +   - Fᵢ: 14个因素的 “复杂性调节值” (i =1..14)


    +   - 0.65, 0.01都是经验常数'
  - '[PAGE 235]


    # # 5.2 面向功能的度量(3/7)


    # ## CT的计算方法


    +   - 用户输入数×加权因子(简单=3,平均=4,复杂=5)


    +   - 用户输出数×加权因子(简单=3,平均=4,复杂=5)


    +   - 用户查询数×加权因子(简单=3,平均=4,复杂=5)


    +   - 文件数×加权因子(简单=3,平均=4,复杂=5)


    +   - 外部界面数×加权因子(简单=3,平均=4,复杂=5)


    # ## CT = 上述计算值的总和'
  - '[PAGE 236]


    # 5.2 面向功能的度量(4/7)


    F_i的取值(0,1,2,3,4,5):0-没有影响, 1-偶有影响, 2-轻微影响, 3-平均影响, 4-较大影响, 5-严重影响


    +   - 系统需要可靠的备份和复原码？

    +   - 系统需要数据通信吗？

    +   - 系统有分布处理功能吗？

    +   - 性能是临界状态吗？

    +   - 系统是否在一个实用的操作系统下运行？

    +   - 系统需要联机数据项吗？

    +   - 联机数据项是否在多屏幕或多操作之间进行切换？'
