    # # CMM对需求管理的要求(1/3)


    +   - 需求管理是CMM 2级的的一个关键过程域

    +   - CMM对需求管理的理解和定义


    +   - 需求管理是指在用户和将处理“分配给软件的系统需求”的软件项目组之间建立对“分配给软件的系统需求”的共同理解，由软件工程组对“分配给软件的系统需求”进行分析、精化，按照规范详细描述“分配给软件的系统需求”，形成“软件需求规格说明”文档，并对该文档进行评审

    +   - “分配给软件的系统需求” 是指系统总体分配给软件的需求，也称软件需求

    +   - “用户”可解释为系统工程组或外部顾客等'
  - '[PAGE 596]


    # # CMM对需求管理的要求(2/3)


    +   - “软件工程组”：实施软件工程化开发的小组

    +   - 软件需求既包括技术需求、又包括非技术需求

    +   - 软件需求构成项目规模和工作量估算、制定项目计划和跟踪软件项目活动的基础

    +   - 每当软件需求改变时，都应调整受到影响的软件计划、工作产品和活动，使其与更新后的软件需求保持一致

    +   - 对已通过评审的软件需求的任何更改都应受到管理和控制'
