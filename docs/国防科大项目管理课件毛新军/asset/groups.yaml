    # # Practice, Practice, and Practice'
  md: "\n\n## 控制需求的变更(1/3)\n\n- 需求变更不可避免\n  - 软件需求本身是变化的\n  - 在需求分析阶段对软件需求的描述和分析不全面、不准确等\n\
    \n- 需求变更对软件项目的开发会产生巨大的影响\n  - 产品功能\n  - 开发成本\n  - 开发进度\n  - 产品质量\n\n## 控制需求的变更(2/3)\n\
    \n- 需求变更的权衡，需要和用户协商，并对计划进行变更\n\n![](img/f5d721251af5f768deee90a8ee1528f0_592_0.png)\n\
    \n## 控制需求的变更(3/3)\n\n- 如何控制需求的变更\n  - 提出软件需求变更请求\n  - 对软件需求变更进行评审\n  - 变更SRS\n\
    \  - 将变更后的SRS纳入配置\n  - 通知受影响小组和人员\n  - 变更其他产品(软件设计文档、 测试文档)和计划(软件开发计划)\n\n## 讲授内容\n\
    \n1. 项目案例\n2. 什么是软件需求\n3. 如何进行软件需求分析\n4. 软件需求管理\n5. CMM对需求管理的要求\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_594_0.png)\n\
    \n## CMM对需求管理的要求(1/3)\n\n- 需求管理是CMM 2级的的一个关键过程域\n- CMM对需求管理的理解和定义\n\n- 需求管理是指在用户和将处理“分配给软件的系统需求”的软件项目组之间建立对“分配给软件的系统需求”的共同理解，由软件工程组对“分配给软件的系统需求”进行分析、精化，按照规范详细描述“分配给软件的系统需求”，形成“软件需求规格说明”文档，并对该文档进行评审\n\
    - “分配给软件的系统需求” 是指系统总体分配给软件的需求，也称软件需求\n- “用户”可解释为系统工程组或外部顾客等\n\n## CMM对需求管理的要求(2/3)\n\
    \n- “软件工程组”：实施软件工程化开发的小组\n- 软件需求既包括技术需求、又包括非技术需求\n- 软件需求构成项目规模和工作量估算、制定项目计划和跟踪软件项目活动的基础\n\
    - 每当软件需求改变时，都应调整受到影响的软件计划、工作产品和活动，使其与更新后的软件需求保持一致\n- 对已通过评审的软件需求的任何更改都应受到管理和控制\n\
    \n## CMM对需求管理的要求(3/3)\n\n### 共12个关键实践\n\n| 关键实践类 | 关键实践数目 |\n|---|---|\n| 制定方针政策\
    \ | 1 |\n| 确保必备条件 | 4 |\n| 实施软件过程 | 3 |\n| 度量和分析 | 1 |\n| 检查实施情况 | 3 |\n\n## 目标\n\
    \n- 使软件需求受控，建立供软件工程和管理使用的基线\n  - 受控：在给定时间(过去或现在)使用的工作产品的版本是已知的(即受版本控制的)，并以受控的方式进行更动(即更动控制)\n\
    \  - “软件工程”是指软件设计、编码、测试等\n  - “软件管理”是指项目计划制定、项目跟踪、风险等\n- 软件计划、产品和活动与软件需求保持一致\n\
    \  - 所谓“保持一致”是指相吻合\n\n## 制定方针政策\n\n- 项目遵循一个书面的、由组织制定的方针用来管理软件需求\n  - 将软件需求写成规范化的文档\n\
    \  - 拟定参加需求评审的人员，包括\n    - 项目软件负责人，\n    - 其它受影响的小组，包括系统测试组，软件工程组（如软件设计小组）,软件质量保证组，软件配置管理组，文档支持组等\n\
    \  - 当软件需求发生改变时，更动软件计划、工作产品和活动，使其与软件需求的改变保持一致\n\n## 确保必备条件(1/4)\n\n- 建立和明确系统需求分析和分配的人员及其职责，明确\n\
    \  - 在整个项目生存期内，管理和分配系统需求，并将它们写成文档\n  - 实施对系统需求及其分配的更动，当系统需求发生更动时，应及时更动软件需求\n\n\
    ## 确保必备条件(2/4)\n\n- 将软件需求写成规范化的文档\n  - 技术需求，如软件功能、性能、设计约束、编程语言、界面需求\n  - 非技术性需求(即协议、条件、和(或)合同条款)，包括：要交付的产品、交付日期、里程碑等\n\
    \  - 用于确认软件产品满足软件需求的验收准则\n\n## 确保必备条件(3/4)\n\n- 提供足够的用以管理分配需求的资源和经费\n  - 指派在应用领域和软件工程方面有经验和技能的个人去管理软件需求\n\
    \  - 提供可用的、能支持软件需求管理活动的工具\n    - 电子表格程序\n    - 配置管理工具\n    - 跟踪工具\n    - 测试管理工具\n\
    \n## 实施软件过程(1/3)\n\n- 软件工程组识别、分析和细化软件需求，对它进行评审\n  - 鉴别出不完整的和遗漏的软件需求\n  - 评审软件需求，确定它们是否\n\
    \    - 用软件来实现是可行的和恰当的\n    - 已被清晰和准确地阐述\n    - 相互一致、无矛盾\n    - 可验证、可测试\n  - 对任何被识别出有潜在问题的软件需求进行评审，并作出必要的更动\n\
    \  - 和受影响组一起协商解决由软件需求引出的承诺\n\n## 实施软件过程(2/3)\n\n- 将软件需求作为软件开发计划、工作产品和过程活动的基础，软件需求：\n\
    \  - 是受管理和控制的\n  - 是软件开发计划的基础\n\n## 实施软件过程(3/3)\n\n- 对软件需求的更动进行评审，并将其纳入软件项目\n\
    \  - 评估软件需求更动对现有承诺的影响，通过协商对承诺进行适当的更改\n    - 对组织外的个人和组所作承诺的更改由高级管理者参与评审\n    -\
    \ 和受影响组协商组织内部承诺的更改\n  - 对由于软件需求的更动所造成的对软件计划、工作产品和活动必须作的更动要进行识别、评价、风险评估、写成文档、做出计划、传达到受影响组和个人、跟踪直到结束\n\
    \n## 度量和分析\n\n- 进行度量，并将度量结果用以确定软件需求管理活动的状态，度量内容包括\n  - 每个软件需求的状态(确认并批准、问题等)\n\
    \  - 关于软件需求的更动活动\n  - 对用软件需求更动的累积数，包括建议的、未解决的、已批准的并已纳入系统基线的软件需求更动的总数\n\n## 验证实施(1/3)\n\
    \n- 高级管理者定期参与对软件需求管理活动进行的评审\n  - 高级管理者参与定期评审的主要目的是在合适的抽象层次上及时地了解和洞察软件过程。评审间隔时间应该满足组织的需要，如果存在异常情况报告机制，间隔时间可以长些。\n\
    \n## 验证实施(2/3)\n\n- 项目负责人可定期或者事件驱动地参与对软件需求管理活动的评审\n\n## 验证实施(3/3)\n\n- 软件质量保证组对软件需求管理活动和工作产品进行评审和(或)审计，并报告其结果\n\
    \  - 软件需求已评审，且有关问题在软件工程组开发软件之前已得到解决\n  - 当软件需求更动时，软件计划、工作产品和活动已经适当地更动\n  - 由软件需求的更动所导致的对承诺的更动已与受影响组进行协商\n\
    \n## 讲授内容\n\n1. 项目案例\n2. 什么是软件需求\n3. 如何进行软件需求分析\n4. 软件需求管理\n5. CMM对需求管理的要求\n6.\
    \ 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_611_0.png)\n\n## 本讲小结\n\n- 获取软件需求对于软件项目的开发是十分重要的\n\
    - 一个好的软件需求应该满足许多条件\n- 必须对软件需求进行有效的管理\n\n## 教学目的\n\n### 理解\n\n- 软件需求、需求分析和需求管理等概念\n\
    - 软件需求重要性和获取软件需求复杂性\n- 为什么要进行需求管理\n\n### 掌握\n\n- 软件需求分析的过程\n- 软件需求管理的内容和手段\n\n\
    ### 运用\n\n- 运用需求分析方法、技术和工具进行需求分析，获取软件需求\n- 在软件项目开发过程中对软件需求进行必要的管理\n\n## Software\
    \ Project Management\n\n## Q & A\n\n![](img/f5d721251af5f768deee90a8ee1528f0_614_0.png)\n\
    \n## Practice, Practice, and Practice\n\n"
