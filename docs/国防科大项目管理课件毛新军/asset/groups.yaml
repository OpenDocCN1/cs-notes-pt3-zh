    \n## Software Project Management\n\n## Questions & Discussing\n\n![](img/f5d721251af5f768deee90a8ee1528f0_207_0.png)\n\
    \n## Practice, Practice, and Practice\n\n# 软件项目管理课程 之\n\n# 第3讲 软件度量\n\n毛新军  \n\
    xjmao21@21cn.com  \nhttp://software.nudt.edu.cn/~xjmao  \n计算机科学与技术系602教研室  \n\
    0731-(45)73649\n\n![](img/f5d721251af5f768deee90a8ee1528f0_208_0.png)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_208_1.png)\n\
    \n## 讲授内容\n\n1. 项目案例  \n2. 什么是软件度量？  \n3. 为什么需要软件度量？  \n4. 软件度量的内容  \n5. 软件度量的方法\
    \  \n6. 在软件开发过程中进行软件度量  \n7. 小结  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_209_0.png)\n\
    \n## 1. 项目案例\n\n### 案例角色和人物\n\n- 小王：软件项目负责人  \n- 老王：公司技术老总  \n\n## 项目管理需要定量描述(1/3)\n\
    \n- 在项目策划阶段的碰头会上  \n  - 公司技术总监咨询问小王项目开发估计需要多长时间，需要多少成本？  \n  - 小王回答说“时间估计不会太长，成本也在一个可接受的范围之内”，老王显然对这种回答不满意，他希望能够得到一个较为准确定量性的描述\
    \  \n  - 经过一番考虑后，小王确认回答说“时间7 - 8个月，成本需40 - 45万”，老王显然对这种回答也不满意，况且用户要求在6个月内完成项目。于是他进一步问道“你是如何得到这组数据的”，小王显然没有准备，也没有充分的依据，于是他哑口无言\
    \  \n\n## 项目管理需要定量描述(2/3)\n\n在制定软件项目计划时  \n\n- 小王不知如何预测项目可能所需的工作量？  \n- 小王不知如何预测项目可能所需的成本？\
    \  \n- 小王不知所制定的计划是否可行和科学？  \n- 因此，小王尽管制定了软件开发计划，但对于该计划能否得到有效的实施、实施能否遵循计划执行没有足够的信心\
    \  \n\n## 项目管理需要定量描述(3/3)\n\n- 项目已进展了2个月，各个方面进展尚可，在某周的碰头会上，老王继续向小王发问  \n  - “目前软件质量如何？”，小王回答道“不锈”\
    \  \n  - 老王对这种回答不满意，他希望能够得到一个较为准确量性的描述，但是小王又没有办法给他一个更加确切的答复，实际上连他自己也没有办法说清楚目前软件产品的质量情况，因为他只有直观的、定性的了解。\
    \  \n\n## 定量分析是重要的\n\n- 工程化的软件开发需要定量、科学的描述（实施前、实施过程中、实施完成后）  \n\n- 定量、科学的描述有助于获取软件项目以及所开发的软件的某种可视性，促进软件项目的管理\
    \  \n\n- 定量的信息描述必须在软件项目开发过程中采集  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_214_0.png)\n\
    \n## 软件项目管理问题\n\n- 在软件项目实施过程中，需要哪些方面的定量描述以促进软件项目的有效开发和管理？  \n- 如何获取这些方面的科学定量描述？\
    \  \n- 如何在软件项目开发过程中集成度量？  \n- 如何将这些定量描述用于指导软件项目的管理？  \n\n## 讲授内容\n\n- 项目案例  \n\
    - 什么是软件度量？  \n- 为什么需要软件度量？  \n- 软件度量的内容  \n- 软件度量的方法  \n- 在软件开发过程中进行软件度量  \n-\
    \ 小结  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_216_0.png)\n\n## 基本概念(1/4)\n\
    \n- 对事物属性的定性描述  \n  - 个子很高，软件的成本很高  \n\n- 对事物属性的定量描述  \n  - 高个子有1.9米，软件成本是23.5万\
    \  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_217_0.png)\n\n## 基本概念(2/4)\n\n\
    - 软件度量(Metrics)是指对软件产品、软件开发过程或者资源的简单属性的定量描述。  \n  - 产品：软件开发过程中所生成的各种文档和程序  \n\
    \  - 过程：与软件开发有关的各种活动，如软件设计等  \n  - 资源：软件开发过程中所需支持，如人员、费用等  \n\n- 注意点  \n  - 定量描述，而不是定性描述\
    \  \n  - 简单属性，无需参照其它属性便可直接获得定量描述  \n\n## 基本概念(3/4)\n\n- 软件测量(Measure)是对软件产品、软件开发过程和资源复杂属性的定量描述，它是简单属性度量值的函数，软件测量用于事后或实时状态，如软件可靠性\
    \  \n\n- 注意点  \n\n- 定量描述，而不是定性描述  \n\n- 复杂属性-不可直接获得、需参照其它属性的度量值  \n\n- 实时或者事后状态，用于对历史进行评估\
    \  \n\n## 基本概念(4/4)\n\n- 估算(Estimation)对软件产品、软件开发过程和资源复杂属性的定量描述，它是简单属性度量值的函数，软件估算用于事前，如软件开发成本\
    \  \n\n- 注意点  \n\n- 定量描述，而不是定性描述  \n\n- 复杂属性-不可直接获得、需参照其它属性的度量值  \n\n- 事前状态  \n\
    \n- 可采用经验公式，也可参考历史资料和数据。估算的结果一般用于签订合同、立项、制定工作计划等  \n\n## 讲授内容\n\n- 项目案例  \n- 什么是软件度量？\
    \  \n- 为什么需要软件度量？  \n- 软件度量的内容  \n- 软件度量的方法  \n- 在软件开发过程中进行软件度量  \n- 小结  \n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_221_0.png)\n\n## 为什么需要软件度量(1/2)\n\n-\
    \ 任何工程化的工作都需要度量，软件工程也不例外  \n  - 准确了解工程的实施情况  \n\n- 项目实施之前  \n  - 辅助制定软件项目的计划 \
    \ \n  - 估算成本和工作量，以便制定计划  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_222_0.png)\n\
    \n## 为什么需要软件度量(2/2)\n\n- 项目实施过程中  \n  - 提供软件开发的可视性  \n  - 跟踪和控制软件项目的开发  \n  -\
    \ 评估软件开发质量，进行质量控制  \n  - 加强风险管理  \n- 项目实施之后  \n  - 对项目的实施情况进行评估  \n  - 为后续项目的积累经验数据\
    \  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_223_0.png)\n\n## 讲授内容\n\n- 项目案例\
    \  \n- 什么是软件度量？  \n- 为什么需要软件度量？  \n- 软件度量的内容  \n- 软件度量的方法  \n- 在软件开发过程中进行软件度量\
    \  \n- 小结  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_224_0.png)\n\n## 软件度量的内容(1/3)\n\
    \n### 三个方面\n\n- 产品：各种文档和程序  \n- 过程：各种软件开发活动  \n- 资源：各种资源如人员、费用等  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_225_0.png)\n\
    \n## 软件度量的内容(2/3)\n\n- 二个层次  \n  - 内部属性  \n    - 软件产品、过程和资源本身所具有属性，如软件产品的复杂度、程序长度等\
    \  \n    - 易于度量  \n  - 外部属性  \n    - 软件产品、过程和资源与外部环境(用户、管理人员等)间的关系如成本、效益、可靠性、可维护性等\
    \  \n    - 难以度量，但由内部属性所决定  \n\n"
