    5. 团队激励机制  \n6. 做一个好的项目经理  \n7. 小结  \n\n![](img/f5d721251af5f768deee90a8ee1528f0_709_0.png)\n\
    \n## 团队的激励机制\n\n- 激励机制  \n- 团队成员的典型动机  \n- 士气杀手  \n\n## 激励机制\n\n- 开发人员最有可能提高生产率和质量（相比较开发过程、产品、技术）\
    \  \n- 开发人员的生产率和质量的差距达到 1:10。无论是否具有相同经验  \n- 激励是决定工作表现最重要得影响因素，对生产率的影响比任何其他因素更大\
    \  \n\n## 开发人员的激励因素\n\n- 成就感  \n- 发展机遇  \n- 工作乐趣  \n- 个人生活  \n- 成为技术主管的机会  \n\
    - 领先  \n- 同事间的人际关系  \n- 受认可程度  \n- 工资  \n- 责任感  \n- 工作保障  \n- 公司政策和经营  \n- 工作条件\
    \  \n- 地位  \n\n## 项目经理的激励因素\n\n- 成就感  \n- 工作乐趣  \n- 受认可程度  \n- 发展机遇  \n- 与下属关系\
    \  \n- 同事间的人际关系  \n- 领先  \n- 工资  \n- 公司政策和经营  \n- 工作保障  \n- 称为技术主管的机会  \n- 地位\
    \  \n- 个人生活  \n- 工作条件  \n\n## 不要用对自己有效的方式来激励开发人员\n\n## 成就感\n\n- 提供一个良好的环境，使他们能轻松进行喜欢的工作\
    \  \n- 自主权  \n  - 让开发人员自己定工作进度  \n- 设定目标  \n  - 如短期目标、风险降到最小、项目可视化程度最大  \n  -\
    \ 不要太多、公认不能实现、经常变化的目标  \n\n## 发展机遇\n\n- 职业发展原则：帮助员工决定他们自己希望如何发展技能，并提供职业发展的机会 \
    \ \n  - 提供进修机会  \n  - 提供参加培训或自学的假期  \n  - 购买专业书籍  \n  - 分配发展技能的项目工作  \n  - 为新的开发人员指定导师和教练\
    \  \n  - 避免进度太大  \n- 排名前10%的企业平均每年为软件开发人员提供2周的培训，为软件经理提供3周的培训  \n\n## 工作乐趣\n\n\
    - 工作动力的三大来源  \n  - 感受工作的意义  \n  - 对工作成果的责任  \n  - 了解工作的实际结果  \n- 影响工作动力的5个方面：\
    \  \n  - 技术的多样性、任务的完整性、任务的重要性  \n  - 自主性、工作反馈  \n- 为能够专注于工作本身创造条件  \n\n## 个人生活\n\
    \n- 安排休假  \n- 同意员工在工作日偶尔外出  \n  - 个人生活对开发人员排在第4位  \n  - 对项目经理排在第15位  \n\n## 成为技术主管的机遇\n\
    \n- 指派每个人分别作为某个特定领域的技术负责人，如负责用户界面设计、数据库、网络、模块接口  \n- 指派每个人分别作为某个任务的技术负责人，如技术评审、代码重用、工具评估、系统测试\
    \  \n- 除新手外，指定所有人为指导者  \n\n## 奖励和认可\n\n- 奖励和表彰是激励组员的一种重要手段，它向组员以及其他人展示他们所做的贡献\
    \  \n- 表彰方式（实物、金钱、荣誉）  \n- 表彰为了实现富有挑战性的目标而加班的员工，愿意帮助同事的员工  \n- 糟糕的奖励：给最佳表现者6%的奖励，同时给表现平庸者5%的奖励\
    \  \n- 使得无论大小成就的表彰活动成为小组文化  \n\n"
