    \  - 执行效率：程序的运行效率\n  - 可扩充性：对软件结构、数据设计和过程设计进行扩充的程度\n  - ……\n\n## 5.4.3 软件质量的度量\n\
    \n- 对于每个质量要素的计算\n  - \\( F_i = \\sum(C_{ik} \\times M_{ik}) \\)\n  - 其中，\\( F_i\
    \ \\) 表示第i个质量因素的度量值(i = 1,..11)，\n  - \\( M_{ik} \\) 表示第i个质量因素对于第k种评价准则的测量值，\\\
    ( M_{ik} \\)的取值共分10级，分别为0.1, ...,1.0\n  - \\( C_{ik} \\) 表示第k种评价准则对第i个质量因素影响程度的加权系数，且满足\\\
    (\\sum C_{ik} = 1.0 (k = 1,..21)\\)\n\n## 讲授内容\n\n- 项目案例\n- 什么是软件度量？\n- 为什么需要软件度量？\n\
    - 软件度量的内容\n- 软件度量的方法\n- 在软件开发过程中进行软件度量\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_265_0.png)\n\
    \n## 软件开发过程中集成度量\n\n- 度量是重要的\n- 提高组织软件开发能力成熟度的一种重要措施和有效手段\n- CMM强调用软件度量，尤其在4级\
    \ - 可管理级\n- 度量会遇到阻力\n- 度量会耗费大量的精力和时间\n- 度量的作用和效果可能是隐性和长期的，不能为开发人员所接受\n- 项目的压力经常会促使管理者和开发人员放弃度量\n\
    \n- 在软件项目实施过程中坚持度量，收集数据\n- 实施前\n  - 记录估算数据\n- 实施中\n  - 对过程、产品和资源进行度量\n  - 记录并保存其结果\n\
    - 实施完成后\n  - 对项目进行总结，记录和保存项目实际运作的信息，如成本、工作量，人员等等\n\n## 讲授内容\n\n- 项目案例\n- 什么是软件度量？\n\
    - 为什么需要软件度量？\n- 软件度量的内容\n- 软件度量的方法\n- 在软件开发过程中进行软件度量\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_268_0.png)\n\
    \n## 本讲小结\n\n- 软件项目的实施需要定量描述(前、中、后)\n- 软件度量： 定量描述\n  - 针对软件产品、过程和资源\n  - 内部属性和外部属性\n\
