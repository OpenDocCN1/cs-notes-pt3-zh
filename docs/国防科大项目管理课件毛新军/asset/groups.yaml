    # # 5.3.2 经验估算模型(1/7)


    # ## 什么是CoCoMo模型？


    +   - COCoMo是指Constructive Cost Model，构造性成本模型，Boehm于1981年提出，用于对软件开发项目的规模、成本、进度等方面进行估算


    +   - CoCoMo模型是一个综合经验模型，模型中的参数取值来至于经验值，并且综合了诸多的因素、比较全面的估算模型


    +   - 比较实用、可操作，在欧盟国家应用较为广泛'
