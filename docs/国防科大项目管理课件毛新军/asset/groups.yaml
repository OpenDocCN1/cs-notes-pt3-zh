  - "[PAGE 217]\n\n# # 基本概念(1/4)\n\n+   - 对事物属性的定性描述  \n+     - 个子很高，软件的成本很高\n\n+\
    \   - 对事物属性的定量描述  \n+     - 高个子有1.9米，软件成本是 23.5万\n\n![](img/f5d721251af5f768deee90a8ee1528f0_217_0.png)"
  - '[PAGE 218]


    # # 基本概念(2/4)


    +   - 软件度量(Metrics)是指对软件产品、软件开发过程或者资源的**简单属性**的定量描述。

    +     - 产品：软件开发过程中所生成的各种文档和程序

    +     - 过程：与软件开发有关的各种活动，如软件设计等

    +     - 资源：软件开发过程中所需支持，如人员、费用等


    +   - 注意点

    +     - 定量描述,而不是定性描述

    +     - 简单属性,无需参照其它属性便可直接获得定量描述'
  - '[PAGE 219]


    # # 基本概念(3/4)


    +   - 软件测量(Measure)是对软件产品、软件开发过程和资源复杂属性的定量描述，它是简单属性度量值的函数，软件测量用于事后或实时状态，如软件可靠性


    +   - 注意点


    +   - 定量描述,而不是定性描述


    +   - 复杂属性-不可直接获得、需参照其它属性的度量值


    +   - 实时或者事后状态,用于对历史进行评估'
  - '[PAGE 220]


    # # 基本概念(4/4)


    • 估算(Estimation)对软件产品、软件开发过程和资源复杂属性的定量描述，它是简单属性性度量值的函数，软件估算用于事前, 如软件开发成本


    +   • 注意点


    +   - 定量描述,而不是定性描述


    +   - 复杂属性-不可直接获得、需参照其它属性的度量值


    +   - 事前状态


    +   - 可采用经验公式，也可参考历史资料和数据。估算的结果一般用于签订合同、立项、制定工作计划等'
