  - '[PAGE 548]


    # 获取软件需求的重要性


    +   - **软件开发的基础和前提**

    +     - 只有在明确了软件需求之后才能开展有针对性的软件开发工作

    +     - 没有需求无法进行设计和编码

    +   - **制定软件开发计划的基础**

    +     - 只有知道你想做什么，才能知道做这些东西需要多少工作量

    +     - 不知道软件需求也就不知道工作量的大小，因而不能制定计划

    +   - **最终目标软件系统验收的标准**

    +     - 只有知道你想做什么，才能知道你最终是否做好了

    +     - 没有定义明确的需求，就不知道最终基于什么进行验收'
  - '[PAGE 549]


    # # 获取软件需求的复杂性(1/2)


    +   - **系统复杂和庞大**

    +     - 如何将软件需求得到？描述清楚？


    +   - **片面, 不完全**

    +     - 如何保证得到了所有的软件需求？


    +   - **模糊, 不准确**

    +     - 如何保证把需求说清楚和准确？


    +   - **不一致, 歧义**

