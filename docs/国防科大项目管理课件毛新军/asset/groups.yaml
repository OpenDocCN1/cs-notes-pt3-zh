    # # CMM对软件质量保证的要求(1/3)


    +   - 软件质量保证是CMM 2级的一个关键过程域


    +   - 所谓软件质量保证是指为管理者提供有关软件项目过程和产品的适当的可视性


    +   - 软件质量保证包括评审和审核软件产品和活动，以验证它们是否符合相应的规程和标准，同时给项目和其它有关负责人提供这些评审和审核的结果


    +   - 在软件项目的早期阶段，软件质量保证组就应参与制定计划、标准和规程等。它们能够降低软件项目成本，并满足项目和组织和策略的约束条件'
