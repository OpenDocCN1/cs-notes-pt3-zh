  md: "\n## 审核软件工作产品\n\n- 审核软件工作产品\n- 遵循规范\n- 正确\n- 一致\n- 准确\n- 可追踪性\n- ……\n\n## 测试源程序代码\n\
    \n- 制定测试计划对软件进行测试\n  - 单元测试\n  - 集成测试\n  - 确认测试\n  - 系统测试\n\n## 记录开发活动和软件产品的偏差\n\
    \n- 形成报告\n  - 记录软件开发活动的偏差\n  - 记录软件产品的偏差 - 软件测试报告\n- 目的\n  - 发现问题，纠正偏差，提高质量\n\n\
    ## 报告高级管理者\n\n- 目的\n  - 为管理者了解软件的质量提供可视性\n\n## 讲授内容\n\n1. 软件项目案例\n2. 软件质量\n3.\
    \ 软件质量保证\n4. 软件质量保证计划及其实施\n5. CMM对软件质量保证的要求\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_646_0.png)\n\
    \n## 软件质量保证计划及其实施\n\n为了确保软件系统的质量，在软件开发早期就要制定软件质量保证计划\n\n1. 计划和目的\n2. 参考文献\n3.\
    \ 管理\n   - 3.1 组织\n   - 3.2 任务\n   - 3.3 职责\n4. 文档\n   - 4.1 目的\n   - 4.2 所需的软件工程文档\n\
    \   - 4.3 其他文档\n5. 标准、实践和约定\n   - 5.1 目的\n   - 5.2 约定\n6. 复审和审查\n7. 测试\n8. 问题报告和改正行动\n\
    9. 工具、技术和方法学\n10. 代码控制\n11. 媒体控制\n12. 供应商控制\n13. 记录收集、维护和保留\n14. 培训\n15. 风险管理\n\
    \n## 讲授内容\n\n1. 软件项目案例\n2. 软件质量\n3. 软件质量保证\n4. 软件质量保证计划及其实施\n5. CMM对软件质量保证的要求\n\
    6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_649_0.png)\n\n## CMM对软件质量保证的要求\n\
    \n- 软件质量保证是CMM 2级的一个关键过程域\n- 所谓软件质量保证是指为管理者提供有关软件项目过程和产品的适当的可视性\n- 软件质量保证包括评审和审核软件产品和活动，以验证它们是否符合相应的规程和标准，同时给项目和其它有关负责人提供这些评审和审核的结果\n\
    - 在软件项目的早期阶段，软件质量保证组就应参与制定计划、标准和规程等。它们能够降低软件项目成本，并满足项目、组织和策略的约束条件\n\n### 共17个关键实践\n\
    \n| 关键实践类 | 关键实践数目 |\n| --- | --- |\n| 制定方针政策 | 1 |\n| 确保必备条件 | 4 |\n| 实施软件过程\
    \ | 8 |\n| 度量和分析 | 1 |\n| 检查实施情况 | 3 |\n\n### 目标\n\n- 软件质量保证活动是有计划的\n- 软件产品和活动与其适用的标准、规程和需求的一致性已得到客观地验证\n\
    - 受影响组和个人接到软件质量保证活动和结果的通知\n- 高级管理者处理在软件项目内部不能解决的不符合问题\n\n### 制定方针政策\n\n- 项目遵循一个书面的、由组织制定的实施软件质量保证(SQA)的方针，一般规定\n\
    \  - 对全部软件项目，SQA功能都应到位\n  - SQA应有一个向高级管理者报告的渠道，它独立于项目负责人和项目软件负责人\n  - 高级管理者定期地评审SQA活动和结果\n\
    \n### 确保必备条件\n\n- 存在一个SQA小组，负责协调和实施软件项目的质量保证\n- 为进行SQA活动提供足够的资源和经费\n  - 指派一个负责人专门负责项目的SQA活动\n\
    \  - 指派一个在SQA任务方面是博学的，并有权力采取适当的监督行动的高级负责人接受和处理软件的不符合问题\n  - 能得到支持SQA活动的工具\n- SQA小组的成员受到培训以便完成他们的SQA活动，培训内容包括：\n\
    \  - 软件工程技巧和实践；\n  - 软件工程组和其它软件有关组的作用及职责；\n  - 用于软件项目的标准、规程和方法；\n  - 软件项目相关的应用领域；\n\
    \  - SQA的目的、规程和方法；\n  - SQA组如何参与软件活动；\n  - SQA方法和工具的有效使用；\n  - 人员间的交流\n- 软件项目的成员接受有关SQA组的作用、职责、权力和价值等方面的定向培训\n\
    \n### 实施软件过程\n\n- 按照文档化的规程，为软件项目制订SQA计划，一般规定\n  - SQA计划的制定是在整个项目策划的早期阶段进行，并且平行于整个项目计划\n\
    \  - 受影响组和个人评审该SQA计划\n  - SQA计划应受管理和控制\n\n- 按照SQA计划进行SQA组的活动，SQA计划的内容包括\n  - SQA组的职责和权力\n\
    \  - SQA组的资源需求(包括职员、工具和设施)\n  - 项目的SQA组活动的进度表和经费\n  - SQA组参与制定项目软件计划、标准和规程的安排\n\
    \  - 将由SQA组完成的评价\n  - 将由SQA组执行的审核和评审\n  - 将用作SQA组评审和审核的标准和规程\n  - 对不符合性问题写成文档并进行跟踪直至结束的规程\n\
    \  - 要求SQA组生成的文档\n  - SQA活动给有关组提供反馈信息的方法和频率\n\n- SQA组参与准备和评审项目的软件开发计划、标准和规程\n\
    \  - SQA组就下列几个方面对计划、标准和规程提供咨询和评审\n    - 与组织制定的方针的符合性\n    - 与外部强加的标准和要求的符合性(例如工作说明所要求的标准)\n\
    \    - 适合项目使用的各种标准\n    - 应在软件开发计划中阐述的论题\n  - SQA组验证软件开发计划、标准和规程已经到位，并可用于评审与审计软件项目\n\
    \n- SQA组评审软件工程活动以验证其符合性\n  - 对照软件开发计划和指定的软件标准和规程，评价各项活动\n  - 对与软件开发计划、标准和规程的偏差进行标识和写成文档，并跟踪到结束\n\
    \  - 对纠正结果进行检查验证\n\n- SQA组审计指定软件工作产品以验证其符合性\n  - 在交付给顾客之前，评价可交付的软件产品\n  - 对照指定的软件标准、规程和合同要求，评价各种软件工作产品\n\
    \  - 对与软件开发计划、标准和规程的偏差进行标识和写成文档，并跟踪到结束\n  - 对纠正结果进行检查验证\n\n- SQA小组定期向软件工程组报告其活动的结果\n\
    \n- 按照文档化的规程，对软件活动和软件工作产品中标识出的偏差写成文档，并加以处理\n  - 将不符合软件开发计划和指定的项目标准及规程的问题写成文档，并与有关人员一起加以解决\n\
    \  - 将那些不符合又不能解决的问题，写成文档并递交给分管质量保证的高级管理者处理\n  - 定期评审不符合问题，直至解决它们为止\n  - 不符合问题的文档应受管理和控制\n\
    \n- 合适时，SQA组与顾客的SQA人员一起对其活动和发现进行定期评审\n\n### 度量与分析\n\n- 进行度量，并将度量结果用于确定SQA活动的成本和进度状态\n\
    \  - SQA活动的里程碑的完成情况与计划作比较\n  - 在SQA活动中完成的工作、花费的工作量和消耗的资金与计划作比较\n  - 进行产品审计和活动评审的次数与计划相比较\n"
