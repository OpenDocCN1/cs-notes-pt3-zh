    \n0731-(45)73649\n\n![](img/f5d721251af5f768deee90a8ee1528f0_675_0.png)\n\n##\
    \ 讲授内容\n\n1. 什么是团队\n2. 团队管理的内容\n3. 团队的组织结构\n4. 成功团队 vs 失败团队\n5. 团队激励机制\n6. 做一个好的项目经理\n\
    7. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_676_0.png)\n\n## 什么是团队？\n\n\
    - 由一组具有共同目标、相互关联、相互合作的人组成的一个集体，例如战斗小组\n  - 共同的目标\n  - 明确的任务\n  - 相互关联\n  - 相互合作\n\
    \n- 软件项目组就是一个团队\n  - 目标：开发出软件产品、完成项目\n  - 任务：需求分析、设计、管理\n  - 相互关联：工作的依赖\n  - 相互合作：解决问题\n\
