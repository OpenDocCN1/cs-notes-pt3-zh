  - '[PAGE 499]


    # # 风险识别


    # ## 风险的类别


    +   - 计划编制

    +   - 组织和管理

    +   - 开发环境

    +   - 最终用户

    +   - 客户

    +   - 承包商

    +   - 需求

    +   - 产品外部环境

    +   - 人员

    +   - 设计和实现

    +   - 过程'
  - '[PAGE 500]


    # # 计划编制风险


    +   - 计划、资源和产品的定义完全由客户或上层领导决定，忽略了项目组的意见，并且这些决定不完全一致

    +   - 计划忽略了必要的任务和活动

    +   - 计划不切实际

    +   - 计划基于特定小组成员，而这样的小组成员根本得不到

    +   - 产品规模估算过于乐观

    +   - 工作量估算过于乐观

    +   - 进度的压力造成生产率的下降

    +   - 目标日期提前，但没有相应地调整产品范围和可用资源

    +   - 一个关键任务的延迟导致其他相关任务的连锁反应

    +   - ......'
  - '[PAGE 501]


    # # 组织和管理风险


    +   - 缺乏强有力、有凝聚力的领导(项目组、企业)

    +   - 解雇员工导致项目小组能力下降

    +   - 削减预算打乱项目计划

    +   - 仅由管理层和市场人员进行技术决策，导致进度延长

    +   - 低效的项目组织结构降低生产率

    +   - 管理层审查/决策的周期比预期时间长

    +   - 管理层作出了打击项目组积极性的决定

    +   - 非技术的第三方的工作比预期要长(如，采购硬件设备)

    +   - 计划性太差，无法适应期望的开发速度

    +   - 项目计划由于压力而放弃，导致开发混乱

    +   - 管理方面的英雄主义，忽视客观确切的状态报告，降低发现和改正问题的能力'
  - '[PAGE 502]


    # # 开发环境风险


    +   - 设施不能及时到位

    +   - 设施到位，但不配套

    +   - 开发工具未能及时到位

    +   - 开发工具不如期望的那样有效，开发人员需要更多的时间，或者更换工具

    +   - 开发工具的学习期比预期的要长

    +   - 开发工具的选择不是基于技术需求，不能提供计划要求的功能'
  - '[PAGE 503]


    # # 最终用户风险


    +   - 最终用户坚持新的需求

    +   - 最终用户对最后交付的产品不满意，要求重新设计和重做

    +   - 最终用户不买进项目产品，无法提供后续支持

    +   - 最终用户的意见未被采纳，造成产品最终无法满足用户要求'
  - '[PAGE 504]


    # # 客户风险(1/2)


    +   - 客户坚持新的需求

    +   - 客户对规划、原型和规格的审核/决策超出预期

    +   - 客户没有参与规划、原型和规格的审核，导致需求不稳定，以及长时间的变更

    +   - 客户答复的时间比预期的要长

    +   - 客户坚持技术决策而导致计划延长

    +   - 客户对开发进度管理过细，导致实际进度变慢

    +   - 客户提供的组件无法与开发的产品匹配，导致需要额外的设计和集成工作

    +   - 客户提供的组件质量欠佳，导致额外的测试、设计或者功能不完善'
  - '[PAGE 505]


    # 客户风险(2/2)


    +   - 客户要求的支持工具与环境不兼容，性能差或者不完善，导致生产率降低

    +   - 客户不接受交付的软件，尽管它满足了所有的规格

    +   - 客户期望的开发速度是开发人员所无法达到的'
  - '[PAGE 506]


    # # 承包商风险


    +   - 承包商没有按照承诺交付产品

    +   - 承包商提供的产品质量低下，必须花时间改进质量

    +   - 承包商提供的产品性能达不到要求'
  - '[PAGE 507]


    # # 需求风险


    +   - 需求已经成为项目基准，但仍在变化

    +   - 需求定义欠佳：不清晰、不准确、不一致

    +   - 增加额外的需求'
  - '[PAGE 508]


    # # 产品风险


    +   - 错误发生率高的模块，需要更多的时间对它进行测试、设计和实现

    +   - 矫正质量低下的不可接受的产品需要更多的时间对它进行测试、设计和实现

    +   - 由于功能错误，导致需要重新进行设计和实现

    +   - 开发额外不需要的功能延长了进度

    +   - 要满足产品规模和速度要求，需要更多的时间

    +   - 严格要求与现有系统兼容，需要更多的时间

    +   - 要求软件重用，需要更多的时间

    +   - ......'
  - '[PAGE 509]


    # # 外部环境风险


    +   - 产品依赖政府规章，而规章的改变不可预期

    +   - 产品依赖草拟中的技术标准，而最后的标准不可预期'
  - '[PAGE 510]


    # # 人员风险(1/3)


    +   - 招聘人员所需的时间比预期要长

    +   - 作为人员参与工作的先决条件(如培训、其他项目的完成等)不能按时完成

    +   - 开发人员与管理层关系不佳导致决策迟缓、影响全局

    +   - 项目组成员没有全身心地投入到项目中，因而无法达到所需的产品功能和性能需求

    +   - 缺乏激励措施、士气低下，降低生产能力

    +   - 缺乏必要的规范，增加工作失误，重复工作，降低工作质量

    +   - 缺乏工作基础(语言、经验、工具等)

    +   - 项目结束前，项目组成员离开项目组'
  md: "\n\n## 软件项目管理问题\n\n- 什么是软件风险？\n- 有哪些形式的软件风险？\n- 如何管理软件风险？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_486_0.png)\n\
    \n## 讲授内容\n\n1. 项目案例\n2. 什么是软件风险？\n3. 如何进行风险管理？\n4. 风险评估\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_487_0.png)\n\
    \n## 什么是软件风险？\n\n- 使软件项目的实施受到影响和损失、甚至会导致失败的、可能会发生的事件\n- 例如，人员的临时流失，计划过于乐观，设计的低劣\n\
    \n## 软件风险的特点\n\n- 事先难以确定\n- 带来损失，影响项目实施，甚至会导致项目失败\n\n## 讲授内容\n\n1. 项目案例\n2. 什么是软件风险？\n\
    3. 如何进行风险管理？\n4. 风险评估\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_489_0.png)\n\
    \n## 如何进行风险管理\n\n1. 什么是风险管理？\n2. 风险进行管理的方式\n3. 如何进行风险管理？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_490_0.png)\n\
    \n## 什么是软件风险管理？\n\n- 在风险影响软件项目成功实施前，对它进行识别和处理，并预防和消除风险的发生\n  - 识别风险(会有哪些风险？)\n\
    \  - 预防和消除风险(最好别让风险发生)\n  - 制定风险发生后的处理措施(万一发生该怎么办？)\n\n## 风险管理的策略(1/2)\n\n###\
    \ 危机管理\n\n- 救火模式，风险造成麻烦后才着手进行处理\n- 例如，小谢离开公司1个月后，其他小组需要小谢所负责子系统的模块以便进行集成和测试，但是相关代码还没写，此时已经影响其他小组计划和项目进度，为此抽调其他人接替小谢工作\n\
    \n### 失败处理\n\n- 察觉到了风险之后采取措施，但只是在风险发生之后\n- 例如，小谢出走的第二天，公司决定抽调其他人员来接替\n\n### 风险缓解\n\
    \n- 识别了风险，并且事先制定好风险发生后的补救措施，但是不做任何防范措施。\n- 例如，知道不好事件可能会发生，等它发生。小谢要走，小张接替\n\n##\
    \ 风险管理的策略(2/2)\n\n- 风险预防\n  - 将风险识别和风险防范作为软件项目的一部分加以规划和执行\n  - 例如，知道哪些不好事件可能会发生，制定好了一旦发生的应对措施，同时采取措施防止它发生。\n\
    \  - 小谢要走，小张接替，同时和小谢商量，做工作，能否等到项目完成之后再走\n- 消灭根源\n  - 识别和消除可能产生风险的根源\n  - 例如，知道哪些不好事件可能会发生，制定好了一旦发生的应对措施，同时采取措施消除风险根源，杜绝风险的发生\n\
    \  - 小谢要走，小张接替，同时给小谢提供更多的学习机会\n\n## 风险管理的组成(1/3)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_494_0.png)\n\
    \n## 风险管理的组成(2/3)\n\n- 风险评估\n  - 风险识别：识别风险，形成风险列表\n  - 风险分析：判定每一个风险出现的概率、产生的影响及其重要性\n\
    \  - 风险优先级：按照每个风险的重要性排出一个风险优先级\n- 风险评估是风险控制的基础\n\n## 讲授内容\n\n1. 项目案例\n2. 什么是软件风险？\n\
    3. 如何进行风险管理？\n4. 风险评估\n5. 风险控制\n6. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_497_0.png)\n\
    \n## 风险评估\n\n1. 风险识别\n2. 风险分析\n3. 风险优先级\n\n![](img/f5d721251af5f768deee90a8ee1528f0_498_0.png)\n\
    \n## 风险识别\n\n### 风险的类别\n\n- 计划编制\n- 组织和管理\n- 开发环境\n- 最终用户\n- 客户\n- 承包商\n- 需求\n\
    - 产品外部环境\n- 人员\n- 设计和实现\n- 过程\n\n## 计划编制风险\n\n- 计划、资源和产品的定义完全由客户或上层领导决定，忽略了项目组的意见，并且这些决定不完全一致\n\
    - 计划忽略了必要的任务和活动\n- 计划不切实际\n- 计划基于特定小组成员，而这样的小组成员根本得不到\n- 产品规模估算过于乐观\n- 工作量估算过于乐观\n\
    - 进度的压力造成生产率的下降\n- 目标日期提前，但没有相应地调整产品范围和可用资源\n- 一个关键任务的延迟导致其他相关任务的连锁反应\n- ......\n\
    \n## 组织和管理风险\n\n- 缺乏强有力、有凝聚力的领导(项目组、企业)\n- 解雇员工导致项目小组能力下降\n- 削减预算打乱项目计划\n- 仅由管理层和市场人员进行技术决策，导致进度延长\n\
    - 低效的项目组织结构降低生产率\n- 管理层审查/决策的周期比预期时间长\n- 管理层作出了打击项目组积极性的决定\n- 非技术的第三方的工作比预期要长(如，采购硬件设备)\n\
    - 计划性太差，无法适应期望的开发速度\n- 项目计划由于压力而放弃，导致开发混乱\n- 管理方面的英雄主义，忽视客观确切的状态报告，降低发现和改正问题的能力\n\
    \n## 开发环境风险\n\n- 设施不能及时到位\n- 设施到位，但不配套\n- 开发工具未能及时到位\n- 开发工具不如期望的那样有效，开发人员需要更多的时间，或者更换工具\n\
    - 开发工具的学习期比预期的要长\n- 开发工具的选择不是基于技术需求，不能提供计划要求的功能\n\n## 最终用户风险\n\n- 最终用户坚持新的需求\n\
    - 最终用户对最后交付的产品不满意，要求重新设计和重做\n- 最终用户不买进项目产品，无法提供后续支持\n- 最终用户的意见未被采纳，造成产品最终无法满足用户要求\n\
    \n## 客户风险(1/2)\n\n- 客户坚持新的需求\n- 客户对规划、原型和规格的审核/决策超出预期\n- 客户没有参与规划、原型和规格的审核，导致需求不稳定，以及长时间的变更\n\
    - 客户答复的时间比预期的要长\n- 客户坚持技术决策而导致计划延长\n- 客户对开发进度管理过细，导致实际进度变慢\n- 客户提供的组件无法与开发的产品匹配，导致需要额外的设计和集成工作\n\
    - 客户提供的组件质量欠佳，导致额外的测试、设计或者功能不完善\n\n## 客户风险(2/2)\n\n- 客户要求的支持工具与环境不兼容，性能差或者不完善，导致生产率降低\n\
    - 客户不接受交付的软件，尽管它满足了所有的规格\n- 客户期望的开发速度是开发人员所无法达到的\n\n## 承包商风险\n\n- 承包商没有按照承诺交付产品\n\
    - 承包商提供的产品质量低下，必须花时间改进质量\n- 承包商提供的产品性能达不到要求\n\n## 需求风险\n\n- 需求已经成为项目基准，但仍在变化\n\
    - 需求定义欠佳：不清晰、不准确、不一致\n- 增加额外的需求\n\n## 产品风险\n\n- 错误发生率高的模块，需要更多的时间对它进行测试、设计和实现\n\
    - 矫正质量低下的不可接受的产品需要更多的时间对它进行测试、设计和实现\n- 由于功能错误，导致需要重新进行设计和实现\n- 开发额外不需要的功能延长了进度\n\
    - 要满足产品规模和速度要求，需要更多的时间\n- 严格要求与现有系统兼容，需要更多的时间\n- 要求软件重用，需要更多的时间\n- ......\n\n\
    ## 外部环境风险\n\n- 产品依赖政府规章，而规章的改变不可预期\n- 产品依赖草拟中的技术标准，而最后的标准不可预期\n\n## 人员风险(1/3)\n\
    \n- 招聘人员所需的时间比预期要长\n- 作为人员参与工作的先决条件(如培训、其他项目的完成等)不能按时完成\n- 开发人员与管理层关系不佳导致决策迟缓、影响全局\n\
    - 项目组成员没有全身心地投入到项目中，因而无法达到所需的产品功能和性能需求\n- 缺乏激励措施、士气低下，降低生产能力\n- 缺乏必要的规范，增加工作失误，重复工作，降低工作质量\n\
    - 缺乏工作基础(语言、经验、工具等)\n- 项目结束前，项目组成员离开项目组\n\n"
