  md: "\n\n## 讲授内容\n\n- 项目案例\n- 什么是软件项目计划？\n- 为什么需要软件项目计划？\n- 制定软件项目计划应考虑的因素\n- 制定软件项目计划的步骤\n\
    - CMM对软件项目计划的要求\n- 成功的和过于乐观的软件开发计划\n- 案例分析及CASE工具\n- 小结\n\n## 制定软件项目计划的方法\n\n\
    1. 计划制定的二种方式\n2. 活动关系类型\n3. 估计活动的周期\n4. 确定里程碑\n5. 活动责任矩阵\n6. 描述进度计划\n7. 关键路径\n\
    8. 参与、承诺和分发\n\n## 软件项目计划制定的方式(1/3)\n\n- 自顶向下\n- 自底向上\n\n## 软件项目计划制定的方式(2/3)\n\n\
    ### 自顶向下\n\n- 由一个或者一部分人单独完成\n- 目的是服务于高层领导和用户，而不是项目组\n- 主要依据项目进度的要求和约束，针对项目中的重大活动(如需求分析、软件设计等)而制定的一个粗略的软件项目计划\n\
    - 只能作为目标进度表，不能作为实施进度表\n\n## 软件项目计划制定的方式(3/3)\n\n- 自底向上\n  - 计划由计划制订者负责，所有项目组成员参与制定\n\
    \  - 一般供项目组，用于实际项目的实施\n  - 要求项目组成员事先了解和认可\n  - 详细定义了计划中的所有活动(不仅仅是哪些重大活动)，明确了活动的参与者、持续时间以及活动之间的关系\n\
    \n## 软件开发活动关系的类型\n\n- 什么是软件开发活动关系？\n  - 活动关系描述了活动之间的逻辑和执行时序\n- 活动之间有哪些关系？\n  -\
    \ 结束到开始\n  - 开始到开始\n  - 结束到结束\n  - 开始到结束\n\n## 结束到开始\n\n前一活动 | 后一活动\n---|---\n\
    活动 A | 活动 B\n结束之后就开始 | 结束几天之后开始\n结束几天前开始 | 活动 B\n活动 B | 活动 B\n\n## 结束到结束\n\n###\
    \ 同时结束\n\n### 结束几天后结束\n\n### 结束几天前结束\n\n## 估算活动的周期(1/4)\n\n- 细分活动\n  - 活动的粒度越小，估算的准确度就会越高\n\
    - 借鉴历史数据\n  - 积累历史数据\n- 使用估算模型\n  - 例如，CoCoMo模型\n- 考虑缓冲时间\n  - 缓冲时间保证项目按照计划有足够的时间来完成活动\n\
    \n## 估算活动的周期(2/4)\n\n缓冲时间\n\n- 意外事件的缓冲\n  - 意外事件可能会发生(如全企业的培训)\n  - 例如，需求分析计划从8.1开始共需20个工作日，应该8.29日完成，但中间公司要开展2天的全员培训，因此8.31结束\n\
    - 节假日时间的缓冲\n  - 例如，编码计划从9.31开始，工作量为10个工作日，因为国庆放假1周，因此，应该计划在10.21日完成\n\n不要在计划中考虑加班时间，加班是不可避免的，但是考虑了加班，可能会发生更多的加班\n\
    \n## 估算活动的周期(3/4)\n\n### 综合考虑其他因素\n\n- 考虑节假日\n- 以工作日(而不是星期)规定活动周期\n- 考虑参与活动团队的教育、培训、经验和技能水平\n\
    - 考虑教育和培训需要\n- 考虑评审所花的时间\n- 考虑传播时间\n- 考虑团队中成员的其他工作\n- 考虑硬件、工具和人员的效率\n- 考虑活动的迭代和重复\n\
    - 活动之间有一定的缓冲……\n\n## 估算活动的周期(4/4)\n\n### 工作量的分布\n\n## 确定里程碑(2/3)\n\n### 为什么需要关注里程碑\n\
    \n- 获取对项目实施的整体了解\n- 便于向高层管理者汇报项目进展情况\n\n### 如何获取里程碑\n\n- 来自于项目高层计划，或者从项目计划中抽取\n\
    - 确定你要关注的活动以及检查点\n\n## 确定里程碑(3/3)\n\n### 里程碑的例子\n\n- 需求分析通过评审并正式批准，标志需求分析工作的完成，后续阶段工作的开始\n\
    - 软件设计规格说明书通过评审并且得到批准，标志软件设计工作完成，后续工作的开始\n\n## 活动责任矩阵(1/4)\n\n- 在制定软件项目计划时要定义活动责任矩阵\n\
    - 什么是活动责任矩阵\n  - 一种表示方法，用于定义了执行、评审和批准软件项目活动及其相关软件产品的角色和人员\n\n## 活动责任矩阵(2/4)\n\n\
    ### 活动责任矩阵的例子\n\n| 活动    | 执行    | 负责    | 评审    | 批准    |\n|---|---|---|---|---|\n\
    | 需求分析 | 需求分析小组 | 需求分析负责人 | 用户方代表需求分析小组软件设计小组软件测试小组质量保证小组 | 用户方代表负责人软件项目负责人 |\n\
    |    |    |    |    |    |\n|    |    |    |    |    |\n|    |    |    |    |\
    \    |\n\n## 活动责任矩阵(3/4)\n\n### 活动责任矩阵的例子(续)\n\n| 角色名称    | 角色人员    |\n|---|---|\n\
    | 需求分析小组    | 小李， 老赵， 小田， 小谢    |\n| 需求分析负责人    | 老赵    |\n| 用户方代表    | 张三、李四\
    \    |\n| 用户方代表负责人    | 张三    |\n\n## 活动责任矩阵(4/4)\n\n- 为什么需要定义活动责任矩阵\n  - 是软件项目计划的一个组成部分\n\
    \  - 明确、清晰说明项目的职责区域\n  - 帮助项目组成员了解他们的任务和职责，以及要参与的工作\n  - 帮助项目组成员了解与其相关的人员\n  -\
    \ 帮助项目组成员预计其工作量\n\n## 描述项目进度计划\n\n- 甘特图\n- 网络图\n\n## 甘特图(1/2)\n\n- 甘特图是一个图形化的任务表示方式，分为二个部分来显示任务计划\n\
    \  - 左部的工作表，以文字方式显示任务信息，如任务名称，开始和结束日期等\n  - 右边的图表，以条形图方式显示任务信息\n\n## 甘特图(2/2)\n\
    \n## 网络图(1/2)\n\n- 网络图是一个图形化的任务表示方式\n  - 框表示任务，框内用文字显示任务信息，如任务名称，开始和结束日期等\n  -\
    \ 框间的连接，表示任务之间的相关性\n\n## 网络图(2/2)\n\n## 甘特图和网络图的区别\n\n- 甘特图和网络图是等价的，可以相互转换\n-\
    \ 甘特图的特点\n  - 更能直观的显示任务的进程\n- 网络图的特点\n  - 更能展示任务之间的相关性\n\n## 关键路径(1/3)\n\n###\
    \ 什么是关键路径？\n\n- 是指从起始任务开始，到结束任务为止的、具有最长长度的路径\n- 关键路径1：A-D-H；关键路径2：A-E-F-G-H\n\n"
