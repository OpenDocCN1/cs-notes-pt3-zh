    - 使得项目实施的过程得到不断优化\n\n## 步骤6：文档化如何改善过程(3/4)\n\n- Step1 & Step2 定义过程改善的规则和要求\n \
    \ - 过程改善请求的提出\n    - 提出者：组织或者项目成员\n    - 时机：项目实施过程中，项目完成之时，定期/不定期的检查\n  - 过程改善请求的类别\n\
    \    - 变更请求\n    - 背离请求\n\n## 案例1：管理过程改善\n\n过程定义文档\n\n软件开发过程管理小组\n\n负责人\n\n变更或背离请求\n\
    \n变更请求\n\n背离请求\n\n项目经理\n\n普通员工\n\n![](img/f5d721251af5f768deee90a8ee1528f0_161_0.png)\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_161_1.png)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_161_2.png)\n\
    \n![](img/f5d721251af5f768deee90a8ee1528f0_161_2.png)\n\n## 案例2：对过程变更请求的管理\n\n\
    ![](img/f5d721251af5f768deee90a8ee1528f0_162_0.png)\n\n## 案例3：对过程背离请求的管理\n\n请求发起者提出书面的背离请求\n\
    \n项目负责人审批背离请求\n\n背离请求提交给过程负责人\n\n让项目组同意背离\n\n否决\n\n结束\n\n过程负责人评审背离请求\n\n否决\n\n\
    通过\n\n过程负责人授权背离\n\n## 步骤6：文档化如何改善过程(4/4)\n\n- Step3：文档化过程改善的规则和要求\n  - 可以是过程定义的一个部分，或者\n\
    \  - 独立的文档\n\n## 步骤8：员工培训\n\n- 要对组织内相关的员工培训软件开发过程\n  - 知道为什么需要过程\n  - 知道组织内的过程是什么\n\
    \  - 知道如何剪裁、变更和调整过程\n  - 强调必须根据过程来实施项目\n\n## 软件开发过程定义注意事项(1/5)\n\n### 经验1\n\n\
    组织制定的软件开发过程应该由一个可理解的活动集组成，可以从该活动集中选择合适的子集作为新项目的过程\n\n- 组织内的软件开发过程应该被定义为一个标准\n\
    - 组织内定义的软件开发过程应该具有一定的通用性和一般性，既可满足组织内新项目的需要，也可满足组织内所经历的非传统项目的需要\n\n## 软件开发过程定义注意事项(2/5)\n\
    \n### 经验2\n\n软件开发过程不应包含一些无效或者无用的任务或者活动，软件开发过程中的任何活动和任务都是为了促进软件项目的开发和管理，确保软件项目在进度、成本的限制范围内，得到满足用户要求的高质量软件产品\n\
    \n- 软件开发过程不应复杂和教条\n- 软件开发过程不应捆绑一些无意义的规则，如必须采用某种方法和技术\n\n## 软件开发过程定义注意事项(3/5)\n\
    \n### 经验3\n\n软件开发过程应该不断地得到改善和提高\n\n- 软件开发过程有局限性和问题\n- 需要对软件开发过程经常性地进行检查，发现问题和不足\n\
    - 允许过程的使用者对过程提出改善意见，发表见解\n\n## 软件开发过程定义注意事项(4/5)\n\n### 经验4\n\n借助于其他组织的经验和成果，以及国际化标准来制定软件开发过程\n\
    \n- 借助于其他组织的经验和成果有助于少走弯路，尽快制定高质量的软件开发过程\n- 借助于国际标准有助于规范化软件开发过程，通过国际标准的认证，如ISO9001，CMM\n\
    - 遵循国际标准是有必要的，应该提倡，它能帮助提升管理水平、形象和竞争力\n- 切忌走过场\n\n## 软件开发过程定义注意事项(5/5)\n\n- 经验5\n\
    \  管理层要负责确保每个新项目完全遵循所批准的软件开发过程\n- 经验6\n  过程组要负责确保不断改善软件开发过程\n\n## 软件开发过程定义文档\n\
    \n- 项目组和组织一般要形成一个软件开发过程定义文档\n- 软件开发过程文档的格式\n\n## 讲授内容\n\n1. 项目案例\n2. 什么是软件项目开发过程\n\
    3. 为什么需要定义过程\n4. 软件开发过程模型\n5. 如何定义过程\n6. 如何剪裁过程\n7. 案例分析\n8. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_173_0.png)\n\
    \n## 如何剪裁过程\n\n- 剪裁过程的基础和依据\n  - 软件开发过程文档\n  - 项目的具体要求\n- 如何剪裁过程？\n  - 参照过程文档中的剪裁规则，根据项目的具体特点确定剔除一些活动，合并一些活动\n\
    \  - 剪裁结果应该能够促进具体项目的管理，保证所开发软件产品的质量\n  - 剪裁认可\n\n## 讲授内容\n\n1. 项目案例\n2. 什么是软件项目开发过程\n\
    3. 为什么需要定义过程\n4. 软件开发过程模型\n5. 如何定义过程\n6. 如何剪裁过程\n7. 案例分析\n8. 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_175_0.png)\n\
    \n## 案例分析\n\n- 案例假设\n  - 采用瀑布软件开发过程模型\n- 案例内容\n  - 软件开发过程框架\n  - 各个活动的描述\n  -\
    \ 活动之间的关系\n- 说明：该案例不足于用于实际应用\n  - 没有考虑组织的具体情况\n  - 不具体和详细\n\n## 步骤1：确定活动\n\n-\
    \ 技术活动\n  - 需求分析\n  - 概要设计\n  - 详细设计\n  - 编码\n  - 集成测试\n  - 撰写出版物\n  - 用户确认测试\n\
    \  - 软件发布\n- 管理活动\n  - 制定初步软件开发计划\n  - 制定详细软件开发计划\n  - 制定软件配置管理计划\n  - 制定软件质量保证计划\n\
    \  - 项目跟踪和监督\n  - 配置管理\n  - 用户培训\n\n"
