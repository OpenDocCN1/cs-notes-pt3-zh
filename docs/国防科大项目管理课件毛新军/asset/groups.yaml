    \  - 英国1986年开发的办公室信息系统Folios经4年，因性能达不到要求，1989年取消\n  - 日本第5代机因软件问题在投入50亿美元后于1993年下马\n\
    - 由于软件质量问题导致失败的软件项目非常多\n\n## 软件危机的表现(3 of 3)\n\n- 进度难以控制\n  - 项目延期比比皆是\n  - 由于进度问题而取消的软件项目较常见\n\
    \  - 只有一小部分的项目能够按期完成\n- 维护非常困难\n  - 软件维护的多样性\n  - 软件维护的复杂度\n  - 软件维护的副作用\n\n![](img/f5d721251af5f768deee90a8ee1528f0_7_0.png)\n\
    \n## 产生软件危机的根源\n\n- 逻辑产品，不同于物理产品\n- 复杂性高\n  - 逻辑产品，逻辑复杂度，远高于硬件复杂度\n  - 软件的复杂性随规模呈指数级上升\n\
    - 规模大\n  - 应用扩大，代码量，1000万行，仍不断膨胀\n- 影响软件生产率和质量的因素比较复杂\n  - 人员的能力和水平\n  - 团队合作\n\
    - 缺乏有效、系统原理、原则、方法和工具的指导和辅助\n\n## 软件项目管理课程介绍和要求\n\n### 技术手段不能完全解决软件危机\n\n- 到了20世纪90年代，软件危机依然存在，甚至更为严重\n\
    \  - 应用牵引技术的发展\n    - 瀑布模型\n    - 结构化软件开发方法\n    - OO软件开发方法\n  - 技术推动应用的深化\n \
    \   - 应用的扩大和深入\n  - 应用变得越来越大和复杂，技术变得更加力不从心\n  - 错误的观念：“只要有好的软件开发方法和工具就能高效率地开发出高质量的软件”\n\
    \n## 解决危机的管理途径\n\n问题出在哪里？\n\n20世纪80年代末，美国DoD和工业界开始认识到管理的重要性\n\n- 美国DoD的一项研究表明，70%的项目由于管理不善导致难以控制进度、成本和质量；\n\
    - 进一步的研究发现：管理是影响软件项目成功开发的全局性因素，而技术只影响局部\n- 如果软件开发组织不能对软件项目进行有效管理，就不能充分发挥软件开发方法和工具的潜力，也就不能高效率地开发出高质量的软件产品\n\
    \n## 重视管理\n\n- 管理是影响软件项目成败的第一要素\n- 学术界和工业界开始研究和探索针对软件企业以及软件开发所需的管理机制和措施\n- 提高企业的过程管理和发展控制能力\n\
    - ISO 9000系列 - 强调质量\n- CMMI - 强调企业的过程管理和发展控制的能力\n- 强化软件项目的管理\n- 需求、质量、风险、成本、版本等的管理\n\
    \n## 软件项目管理的本质\n\n- 对象\n  - 人员、成本、产品\n- 主线\n  - 过程\n- 目标\n  - 在成本和进度范围内开发出高质量的软件产品\n\
    \n## 2.教师和课件\n\n- 教师\n  - 毛新军，计算系602教研室\n  - Tel: (45)73649(o)\n  - Email: xjmao@nudt.edu.cn\n\
    - 课件下载\n  - Homepage: http://www.618.net.com\n\n![](img/f5d721251af5f768deee90a8ee1528f0_15_0.png)\n\
    \n## 理解\n\n- 什么是软件项目管理？\n- 为什么需要对软件项目进行管理？\n- 软件项目管理涉及那些方面？\n- 软件项目管理需要解决那些问题？\n\
    - 软件项目管理有关的标准和规范\n- 软件项目管理的有关概念\n\n![](img/f5d721251af5f768deee90a8ee1528f0_17_0.png)\n\
    \n## 掌握\n\n- 解决问题的具体方法和措施\n  - 问题\n  - 过程\n  - 方法\n  - 结果\n- 辅助软件解决的各种工具\n  -\
    \ CASE工具\n\n![](img/f5d721251af5f768deee90a8ee1528f0_18_0.png)\n\n## 运用\n\n- 增进组织在软件项目管理方面的能力\n\
    - 推动组织的软件项目管理\n- 制定满足标准和规范的有关规程\n- 针对企业和机构的特点，在实际的项目开发过程中运用所学的知识促进软件项目管理\n\n![](img/f5d721251af5f768deee90a8ee1528f0_19_0.png)\n\
    \n## 软件项目管理课程介绍和要求\n\n### 4. 内容组织\n\n### 课程介绍\n\n### 软件项目管理概述\n\n### 过程定义和剪裁\n\
    \n### 软件度量\n\n### 项目计划\n\n### 跟踪监督\n\n### 风险管理\n\n### 需求管理\n\n### 配置管理\n\n###\
    \ 质量保证\n\n### 团队管理\n\n## 5. 讲解方式\n\n- 案例引入，分析问题和提出问题\n- What, Why, How\n- 支持管理的CASE工具\n\
    - 针对案例解决问题\n- 小结\n\n![](img/f5d721251af5f768deee90a8ee1528f0_21_0.png)\n\n## 7.学习要求\n\
    \n- 学习和掌握先导课程\n- 理解知识点和思想\n  - 无需死记硬背\n  - 大胆提出你的想法和意见\n- 掌握方法和工具\n- 运用解决实际问题，实践，课程实习\n\
    - 阅读相关资料\n\n## 8. 考核方式\n\n- 课程实习(约60%)\n- 考试(约40%)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_24_0.png)\n\
    \n## 课程实习要求(1/2)\n\n### 内容\n- 相关课堂内容讲解完成之后\n\n### 时间\n- 2 - 3周之内\n\n### 方式\n-\
    \ 电子文档\n\n### 评价\n- 完整性、合理性、规范性\n\n## 课程实习要求(2/2)\n\n- 分组\n  - 以小组为单位，2-3人一组为宜\n\
    - 报告\n  - 正规的文档，按阶段递交和打分\n- 讲解\n  - 10个学时讲解、How & Why\n- 讨论\n  - 课堂讨论\n\n## 9.\
    \ 参考文献(1/3)\n\n- 《管理软件开发项目-通向成功的最佳实践》，[美]尼尔·怀特，电子工业出版社，2002年\n- 软件项目管理案例教程，韩万江，姜立新，机械工业出版社，2005\n\
    - 软件工程实践导论--有关方法、设计、实现、管理之三十六计，金尊和，清华大学出版社，2005.\n- 《软件开发的科学与艺术》，微软亚洲研究院，电子工业出版社，2002年\n\
    \n## 参考文献(2/3)\n\n- 软件项目管理实践，Pankaj Jalote，清华大学出版社，2003\n- 《软件工程－实践者的研究方法》，R S.Pressman，机械工业出版社\n\
    - 《超越混沌—有效管理软件开发项目》，[美]里·康斯坦丁著，雷明等译，电子工业出版社，2002年\n- 《软件项目管理：一个统一的框架》，Walker Royce，中信出版社，2002年\n\
    - 《领导软件开发团队》，Whitehead，电子工业出版社，2002年\n\n"
