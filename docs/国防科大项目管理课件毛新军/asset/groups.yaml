    \  - 无歧义性\n    - 软件需求描述是否会引起不必要的误解和认识上的偏差\n    - 例如，用户和客户\n\n## 如何进行评审(3/3)\n\n\
    - 完全性\n  - 是否所有的需求都已经包含了\n- 可验证性\n  - 是否有手段来验证需求已经实现了\n  - 例如，查询结果应该很快得到\n- 一致性\n\
