  - "[PAGE 491]\n\n# # 什么是软件风险管理？\n\n+   - 在风险影响软件项目成功实施前，对它进行识别和处理，并预防和消除风险的发生  \n\
    +     - 识别风险(会有哪些风险？)  \n+     - 预防和消除风险(最好别让风险发生)  \n+     - 制定风险发生后的处理措施(万一发生该怎么办？)"
  - '[PAGE 492]


    # # 风险管理的策略(1/2)


    # ## 危机管理


    +   - 救火模式，风险造成麻烦后才着手进行处理


    +   - 例如，小谢离开公司1个月后，其他小组需要小谢所负责子系统的模块以便进行集成和测试，但是相关代码还没写，此时已经影响其他小组计划和项目进度，为此抽调其他人接替小谢工作


    # ## 失败处理


    +   - 察觉到了风险之后采取措施，但只是在风险发生之后


    +   - 例如，小谢出走的第二天，公司决定抽调其他人员来接替


    # ## 风险缓解


    +   - 识别了风险，并且事先制定好风险发生后的补救措施，但是不做任何防范措施。


    +   - 例如，知道不好事件可能会发生，等它发生。小谢要走，小张接替'
  - '[PAGE 493]


    # 风险管理的策略(2/2)


    +   - 风险预防

    +     - 将风险识别和风险防范作为软件项目的一部分加以规划和执行

    +     - 例如，知道哪些不好事件可能会发生，制定好了一旦发生的应对措施，同时采取措施防止它发生。

    +     - 小谢要走，小张接替，同时和小谢商量，做工作，能否等到项目完成之后再走

    +   - 消灭根源

    +     - 识别和消除可能产生风险的根源

    +     - 例如，知道哪些不好事件可能会发生，制定好了一旦发生的应对措施，同时采取措施消除风险根源，杜绝风险的发生

    +     - 小谢要走，小张接替，同时给小谢提供更多的学习机会'
