    \n## 什么是软件开发过程\n\n- 什么是过程？\n- 什么是软件开发过程？\n\n![](img/f5d721251af5f768deee90a8ee1528f0_109_0.png)\n\
    \n## 2.2 什么是软件开发过程(2/2)\n\n软件开发过程的组成\n\n- 软件开发活动\n- 软件开发活动间的关系(执行和实施的序)\n\n![](img/f5d721251af5f768deee90a8ee1528f0_112_0.png)\n\
    \n## 2.3 软件开发活动(1/4)\n\n- 什么是软件开发活动？\n  - 为开发软件项目而执行的一项具有明确任务的具体工作\n  - 例如，需求分析，执行单元测试，制定软件项目开发计划等\n\
    - 软件开发过程中存在许多相互关联的软件开发活动\n  - 明确的任务\n  - 非孤立，和其他活动存在关联\n\n## 2.3 软件开发活动(3/4)\n\
