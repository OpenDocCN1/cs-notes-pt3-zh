    # 6.4 虚析构函数


    # 程序举例6.3


    +   当基类的析构函数为虚函数时，无论指针指的是同一类族的哪一个类对象，对象撤销时，系统会采用动态关联，调用相应的析构函数，完成该对象的清理工作。


    +   习惯把析构函数声明为虚函数，即使基类并不需要析构函数，以确保撤销动态存储空间时能够得到正确的处理。


    +   构造函数是不能声明为虚函数的。'
