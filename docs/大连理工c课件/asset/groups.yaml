    \n### 引用访问\n\n#### 1. 引用声明\n\n引用的声明格式：\n类型标识符 &引用名=目标变量名；\nint a;\nint &ra=a;\
    \ //定义引用ra，它是变量a的引用，即别名。\n\n说明：\n- （1）&在此不是求地址运算，而是起标识作用。\n- （2）类型标识符是指目标变量的类型。\n\
