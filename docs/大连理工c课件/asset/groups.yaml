  mdcn: "\n## 第8章 异常处理\n\n### 8.6 异常处理中的析构函数\n\n- 结束函数调用时，局部变量就会从栈中弹出，这个过程被称为“退栈”（Stack\
    \ unwinding）。\n- 但是，如果函数执行时出现异常，并且只是采用简单的显示异常信息，然后退出（exit）程序的做法，则程序的执行就会突然中断，结束函数调用时必须完成的退栈和对象释放的操作也不会进行。\n\
    - C++异常处理的真正功能，还在于它具有为异常抛掷前构造的所有局部对象自动析构的能力。\n- 异常被抛出后，从进入try块起到异常被抛出为止，这期间在栈上构造的所有对象都会被自动析构，析构的顺序与它们被构造的顺序相反。\n\
    \n#### 例8.6 异常处理中的析构函数的调用。\n\n```cpp\nclass Triangle {\npublic:\n    Triangle(int\
    \ n) : num(n) { cout << \"构造函数调用, num=\" << num << endl; }\n    ~Triangle() {\
    \ cout << \"析构函数调用, num=\" << num << endl; }\n    void set_sides(double a, double\
    \ b, double c) {\n        if (a <= 0 || b <= 0 || c <= 0) throw \"边长必须为正\";\n\
    \        if (a + b <= c || b + c <= a || c + a <= b) throw \"边长不满足三角不等式\";\n \
    \       s1 = a; s2 = b; s3 = c;\n        cout << \"三角形\" << num << \"三边设置完毕\"\
    \ << endl;\n    }\nprivate:\n    int num;\n    double s1, s2, s3;\n};\n```\n\n\
    ```cpp\nvoid test() {\n    Triangle tri1(1);\n    Triangle tri2(2);\n    tri1.set_sides(3,\
    \ 4, 5);\n    tri2.set_sides(1, 4, 5);\n}\n\nvoid main() // 主函数\n{\n    cout <<\
    \ \"main start\" << endl;\n    cout << \"call test\" << endl;\n    try {\n   \
    \     test();\n    } catch (char* c) {\n        cout << \"异常: \" << c << endl;\n\
    \    }\n    cout << \"main end\" << endl;\n}\n```\n\n- 程序运行结果如下：\n  - main start\n\
    \  - call test\n  - 构造函数调用, num=1\n  - 构造函数调用, num=2\n  - 三角形1三边设置完毕\n  - 析构函数调用,\
    \ num=2\n  - 析构函数调用, num=1\n  - 异常: 边长不满足三角不等式\n  - main end\n\n### 8.7 异常类\n\n\
    - 使用throw语句抛出的异常，可以是基本类型的，也可以用类对象来传递异常信息。\n- 专门用来传递异常的类称为异常类（Exception Class）。异常类可以是用户自定义的，本身与普通的类没有不同。\n\
    - **例8.7** C++中的数组没有提供下标越界时的访问控制，为了使用方便可以定义一个“数组下标越界异常类（ArrayIndexOutOfBounds）”，专门用于描述数组下标越界异常。每个数组下标越界异常对象中都具有一个数据成员用于描述数组越界访问的具体位置，catch块捕捉到这个异常后，可以显示出其包含的越界位置信息。\n\
    \n```cpp\nclass ArrayIndexOutOfBounds {\npublic:\n    ArrayIndexOutOfBounds(int\
    \ index) : index(index) {}\n    void show() { cout << \"数组下标越界异常 index=\" << index\
    \ << endl; }\nprivate:\n    int index;\n};\n\nclass MyArray {\nprivate:\n    int\
    \ *p;\n    int sz;\npublic:\n    MyArray(int s) : sz(s) { p = new int[sz]; }\n\
    \    ~MyArray() { delete[] p; }\n    int size() { return sz; }\n    int& operator[](int\
    \ i) {\n        if (i < 0 || i >= sz) throw ArrayIndexOutOfBounds(i);\n      \
    \  return p[i];\n    }\n};\n```\n\n```cpp\nvoid main() { // 主函数\n    MyArray a(10);\n\
    \    for (int i = 0; i < 3; i++) {\n        try {\n            if (i != 1) {\n\
    \                a[i] = i;\n                cout << \"a[\" << i << \"]=\" << a[i]\
    \ << endl;\n            } else a[a.size() + 10] = 10;\n        } catch (ArrayIndexOutOfBounds\
    \ &a) {\n            a.show();\n        }\n    }\n}\n```\n\n用类对象来描述一个异常有这样的优点：异常的类型具有专一性，一个类对应了一种特定意义的异常，这些异常具有数据成员和函数成员，表现力更加丰富，使得程序的可读性更强。\n\
    \n![](img/f89aaa55889bdc91174ae4576e90c3f2_347_0.png)\n\n### 8.7 异常的匹配\n\nC++规定，当一个异常和catch子句参数类型符合下列条件时，匹配成功：\n\
    \n1. 异常类型是基本类型时，catch参数类型应是异常的类型或其引用，此时类型必须完全一致，不支持自动类型转换。\n2. 异常类型是类类型时，catch参数类型应是异常对象的类型（或其引用）或者其公有基类类型（或其引用）。\n\
    3. 异常类型是类指针时，catch参数类型应为该类指针或者其公有基类指针。\n4. 当catch参数类型为`void*`时，异常类型可以是任何类型的指针。\n\
    5. 如果在catch子句中没有指定异常的类型，而使用了删节号“...”，则表示它可以捕捉任何类型的异常。这个语句是C++为所有不能匹配的异常提供的一个统一的处理方法。\n\
    \n#### 注意：异常处理与函数重载的不同\n\n- 异常处理是由最先匹配的catch子句处理，\n- 函数重载是由最佳匹配的函数处理，\n- 所以异常处理中catch子句顺序是很重要的。往往把较具体的异常放到前面进行捕捉，较抽象的异常放到后面进行捕捉，`catch(...)`子句应放到最后。\n\
    - 异常匹配举例：例8.8\n\n### 8.7 标准库异常类\n\n#### C++的标准异常类\n\n![](img/f89aaa55889bdc91174ae4576e90c3f2_350_0.png)\n\
    \n### 8.8 assert断言\n\n断言的作用是先计算表达式 expression，如果其值为假那么它先使用标准错误流打印一条出错信息，然后调用 abort\
    \ 来终止程序运行。如果expression表达式计算结果为真，则断言不产生任何作用。举例：\n\n```cpp\n#ifdef _DEBUG   //只能用于调试版\n\
    #include <assert.h>\nvoid main( )\n{\n    int x = 1, y = 0, z;\n    assert(y !=\
    \ 0); //一旦y==0，程序就会报错，并自动退出。\n    z = x / y;\n}\n#endif\n```\n\n## 第9章 输入输出流\n\
    \nC++语言程序设计教程—大连理工大学软件学院\n\n### 9.1 理解IO流\n\n1. 输入输出流\n2. 流类与缓冲区\n3. 使用流的优点\n\n\
    ### 9.2 标准流对象\n\n1. 标准输入流对象\n2. 标准输出流对象\n\n### 9.3 流操作\n\n1. 格式化输入输出\n2. 字符数据的读写\n\
    3. 输入输出流的错误\n\n### 9.4 文件流\n\n1. 文件流类与对象\n2. 文件打开与关闭\n3. 文本文件的读写\n4. 文件的随机读写\n\
    \n### 9.5 字符串流\n\n### 9.6 案例分析\n\n"
