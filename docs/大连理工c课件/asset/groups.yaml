    1. 指针变量定义

    指针变量是用来存放地址的，指针变量定义的一般形式为：

    类型说明符 *变量名；

    例如：

    int *p1;

    对指针变量的定义包括三个内容：

    （1）指针类型说明符，*表示这是一个指针变量；

    （2）指针变量名，p1为指针变量名；

    （3）指针所指向的变量的数据类型，int为指针变量所指向的变量的数据类型，说明p1只能储存整型变量的地址。'
