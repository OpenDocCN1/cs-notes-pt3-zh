    # ## 5.6 派生类的构造函数


    # ### 派生类构造函数的执行顺序：


    +   1. 调用基类的构造函数，如有多个基类，则按照它们被继承的顺序依次调用。


    +   2. 调用内嵌对象的构造函数，如果有多个，则按照它们在类的数据成员声明中的先后顺序依次调用。


    +   3. 执行派生类的构造函数体中的内容。


    如果派生类的构造函数没有显示声明其基类和其内嵌对象的构造方式，那么系统按照“默认”方式对它们进行初始化，也就是调用它们的默认构造函数，如果基类或者内嵌类不具有这样的构造函数，那么就会出现编译错误。'
