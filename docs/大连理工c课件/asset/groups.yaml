    ```\n\n## 9.3 流操作\n\n### 字符串输入函数\n\n```cpp\nistream& istream::getline(char* &pArray,\n\
    \    streamsize n, char delim = '\\n');\n```\n\n**作用：** 从输入流中读取 n-1 个字符，赋给指定的字符数组，如果在读取\
    \ n-1 个字符之前遇到指定的字符则读取结束。如果读取成功则函数返回非 0 值（真），否则（遇到文件结束符）则函数返回 0 值（假）。\n\n从流中提取字符串后流中删除分隔符，继续读取的字符串从分隔符后面的字符开始。\n\
