    C++中的虚函数的作用是允许在派生类中重新定义与基类同名的函数，并且可以通过基类指针或者基类引用来访问这个同名函数。虚函数成员声明的语法为：


    ```

    virtual 函数类型 函数名（参数列表）；

    ```


    注意以下两点：


