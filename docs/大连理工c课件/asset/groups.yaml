    # # 第3章 类与对象




    # static数据成员


    静态数据成员访问形式：


    <类对象>.<静态数据成员名>

    或 <类类型名>::<静态数据成员名>


    静态数据成员s可以有5种访问办法：

    X::s （没有定义对象a、b、c、d，X::s也是正确的）；

    a.s、b.s、c.s、d.s，他们都代表访问同一个变量空间，通过一个改变值，其他方式获取的值全部改变。


    静态数据成员和普通数据成员一样遵守public、protected、private访问规则，若上述X的静态数据成员是私有的，X::s、a.s、b.s、c.s、d.s访问s都是错误的，因为不可见。'
