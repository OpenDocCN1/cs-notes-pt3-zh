    # # 第2章 C++基础


    # ## 2.4 程序结构


    # ### 函数默认参数


    默认参数也称为缺省参量，函数定义中的每一个参数都可以拥有一个默认值，如果在函数调用中没有为对应默认值的参数提供实参数据，系统就直接使用默认值。


    如函数定义：

    int f (int x,long y=10, double z=20) {...}

    这样就可以采用几种等价地调用形式：

    f (3); f (3,10); f (3,10,20);'
