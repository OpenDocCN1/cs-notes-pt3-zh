    # 6.5 纯虚函数与抽象类


    +   一个具有纯虚函数的基类称为抽象类(abstract class)。


    +   抽象类中不仅包括纯虚函数，也可包括其他函数。


    +   抽象类不能被实例化，但可以声明抽象类的指针或引用。


    +   抽象类一般用作派生其他类的基类，可使用指向抽象类的指针支持运行时多态性。 如：


    ```

    Square s(10);

    TwoDimensionalShape * t1;

    t1 = & s;

    cout<<"面积为"<<t1->getArea()<<endl;

    ```


    +   派生类中应重写基类中的纯虚函数，否则它仍将被看作一个抽象类。'
