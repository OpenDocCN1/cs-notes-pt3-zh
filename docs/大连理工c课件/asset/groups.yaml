    # 类型参数化


    C++中提供了对函数重载机制的支持：

    定义重载函数时必须明确要处理什么类型的数据，如果对之后新出现的类型数据做相同操作则要再次定义重载函数。

    函数模板就解决了函数重载中多次定义函数的问题。


    由于事物的相似性，C++程序设计的类类型和函数有时也是相似的。

    类模板就是对一批仅仅成员数据类型不同的类的抽象，


    模板可以实现类型参数化，从而实现了真正的代码可重用性。C++模板包括 函数模板和类模板 两种类型。'
