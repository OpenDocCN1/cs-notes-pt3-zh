    int main() {\n    //静态成员函数、静态成员数据不定义对象，类名就可以访问\n    cout << \"sum=\" << Student::sum\
    \ << \" average=\" << Student::getAverage() << endl;\n\n    Student stud[3] =\
    \ {\n        Student(\"zhang san\", 20, 60),\n        Student(\"Li si\", 19, 70),\n\
