    # # 第1章 概述


    # ## 1.1 面向对象由来


    在面向过程的软件设计方法中存在以下问题：

    1. 基于模块的设计方式，导致软件修改困难。

    2. 功能与数据分离，不符合人们对现实世界的认识。

    要保持功能与数据的相容也十分困难。

    3. 自顶向下的设计方法，限制了软件的可重用性，降低了开发效率，也导致最后开发出来的系统难以维护。


    面向对象的技术将数据和对数据的操作作为一个相互依赖、不可分割的整体，采用数据抽象和信息隐蔽技术，力图使对现实世界问题的求解简单化。它符合人们的思维习惯，同时有助于控制软件的复杂性，提高软件的生产效率。'
  - '[PAGE 3]


    # 1.2 面向对象思想


    > 定义一：面向对象方法是一种运用对象、类、封装、继承、多态和消息等概念来构造、测试、重构软件的方法。


    > 定义二：面向对象方法是以认识论为基础，用对象来理解和分析问题空间，并设计和开发出由对象构成的软件系统（解空间）的方法。由于问题空间和解空间都是由对象组成的，这样可以消除由于问题空间和求解空间结构的的不一致带来的问题。简言之，面向对象就是面向事情本身，面向对象的分析过程就是认识客观世界的过程。'
