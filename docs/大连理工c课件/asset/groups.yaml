    # # 第3章 类与对象


    # ## 3.8 static成员


    ![](img/f89aaa55889bdc91174ae4576e90c3f2_111_0.png)


    静态数据成员初始化：

    <数据类型><类名>::<静态数据成员名>=<值>

    如：int X::s = 0 ;


    +   - 初始化在类体外进行，而前面不加static；

    +   - 初始化时不加该成员的访问权限控制符public、protected、private等；

    +   - 若未在类外初始化，程序连接时会出现错误

    +   - sizeof运算符不包含静态数据成员的空间'
