    `a.s`、`b.s`、`c.s`、`d.s`，它们都代表访问同一个变量空间，通过一个改变值，其他方式获取的值全部改变。\n\n静态数据成员和普通数据成员一样遵守public、protected、private访问规则，若上述X的静态数据成员是私有的，`X::s`、`a.s`、`b.s`、`c.s`、`d.s`访问s都是错误的，因为不可见。\n\
    \n**例3.9 计算一组学生的总成绩和平均成绩**\n\n```cpp\nclass Student {\nprivate:\n    char name[20];\n\
