    \ 根据**实参的类型**，**替换**函数模板中的**类型参数**。\n- 这个过程叫做函数模板的**实例化**（`instantiating`）。\n\
    - 函数模板实例化后称为**模板函数**。\n\n函数模板与函数重载的区别？\n\n- 函数重载时，每个函数体内可以执行不同的动作；\n- 函数模板只适用于函数的参数个数相同而类型不同、函数体相同的情况。\n\
