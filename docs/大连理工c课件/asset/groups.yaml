    class Point\n{\npublic:\n    double distance(Point & p);\n    void setX(double\
    \ i);\n    void setY(double j);\nprivate:\n    double x;\n    double y;\n};\n\
    ```\n\n源文件point.cpp包含类实现：\n\n```cpp\n//point.cpp\n#include<iostream>\n#include<cmath>\n\
    #include\"point.h\"\nusing namespace std;\ndouble Point::distance(Point & p){\n\
    \    return sqrt((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y)); \n}\nvoid Point::setX(double\
    \ i){x=i;}\nvoid Point::setY(double j){y=j;}\n```\n\n源文件main.cpp对类的使用：\n\n```cpp\n\
    //ch3_2.cpp\n#include<iostream>\n#include<cmath>\n#include\"point.h\"\nusing namespace\
