    \  int j;\n};\n```\n\n基类A与派生类B间的赋值兼容关系具体表现在以下几个方面：\n\n- 1. 派生类对象可以直接赋值给基类对象。\n\
    \n```cpp\nA a; // 基类对象\nB b; // 派生类对象\na = b; // 直接赋值\n```\n\n注意，赋值后a的数据类型依然是A，因此不要企图使用a去访问派生类的成员，因此下面的语句是错误的：\n\
    \n```cpp\na.j = 3; // 错误，A中不具有j成员\n```\n\n- 2. 派生类对象可以初始化基类的引用。\n\n```cpp\nA &\
    \ c = b; // c是基类的引用，使用派生类对象b初始化c\n```\n\n- 同样，一个函数的形式参数如果是一个基类的引用，在实际调用该函数的时候，可以传递一个派生类对象来代替基类对象。\n\
    \n假设有一函数function定义如下：\n\n```cpp\nvoid function(A & c) // 形式参数是基类A的引用\n{\n    cout<<c.i<<endl;\
