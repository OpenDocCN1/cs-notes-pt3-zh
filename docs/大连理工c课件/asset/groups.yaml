    # # 第8章 异常处理


    # ## 8.2 异常处理的语法结构


    try-catch结构的说明如下：


    +   1. 被检测的语句或者函数的调用（可能出现异常的语句）必须放在try块中，否则不起作用。


    +   2. try块和catch块作为一个整体出现，catch必须紧跟在try之后，在二者之间不能插入其他语句。


    +   3. try与catch块都是复合语句，即使块中只有一条语句也不能省略掉{}。


    +   4. 一个try-catch结构中只能有一个try块，但却可以有一个到多个catch块，以便捕捉多种不同类型的异常。catch块的异常信息类型部分指明了catch子句处理异常的种类和异常参数名称，它与函数的形式参数是类似的，可以是某个类型的值，也可以是引用，类型可以是任何有效的数据类型，包括C++的类。'
  - "[PAGE 331]\n\n# 第8章　异常处理\n\n# 8.2 异常处理的语法结构\n\n+   5. 如果在try块中没有发生异常，那么跟在try块后面的catch块就会不会被执行。\n\
    +   \n+   6. 如果在try块中有异常抛出，系统则按顺序逐一检查try块后面的catch块的“异常类型”，如果catch块的异常类型与抛出的异常一致，则此catch块捕捉到了这个异常，检查停止，系统执行此catch块中的语句。\n\
    +   \n+   7. 如果抛出的异常信息找不到与之匹配的catch块，那么异常就继续向上层函数抛出，直至被抛出到主函数，系统就会调用一个系统函数terminate，使程序终止运行。"
