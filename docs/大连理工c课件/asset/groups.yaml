    Clock clock2;\n```\n\n错误，因为此时要调用默认构造函数，而系统并没有默认构造函数，因为当显示定义一个构造函数时，系统就不再生成默认构造函数。\n\
    \n大连理工大学软件学院\n\n用有参数的构造函数， 用参数去给对象初始化或赋值，使得生成的对象具有不同的值。\n\n```cpp\nClock(int h,\
