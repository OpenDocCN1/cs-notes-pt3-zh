    # # 6.3 虚函数


    +   在同名函数中寻找匹配函数的过程称为关联（binding）。


    +   对比函数重载与虚函数：


    +   函数重载时：系统会根据参数的个数或者参数的类型去寻找与之匹配的函数。


    ```

    objA.get(''a'');

    objA.get(5);

    ```


    +   函数重载时，在编译时即可确定调用的函数是哪一个函数，所以称这种关联为静态关联（static binding），由于是在运行前进行的关联，故又称为早期关联（early
    binding）。'
  - '[PAGE 273]


    # 6.3 虚函数


    +   虚函数来说，基类与派生类同名函数的参数列表是完全相同的，唯一不同的就是函数所属的类不同，也就是调用函数的对象不同。


    ```

    for(int i=0;i<3;i++)

    members[i]->show();

    ```


    +   编译器是无法知道members[i] 在运行时指向的对象是何种类型的，因此并不执行关联。


    +   到了运行阶段，基类指针变量members[i]被赋值，指向了具体的对象，此时members[i]的类型是确定无疑的，再关联。


    +   被称为动态关联（dynamic binding），由于是在编译后执行该过程，因此也被称为滞后关联（late binding）。'
