    # 6.5 纯虚函数与抽象类


    # TwoDimensionalShape类的getArea函数该如何定义如下：


    ```

    virtual double getArea()

    { return 0;}

    ```


    函数的返回值设定为0，实际上这个函数的返回值是无法确定的。二维图形本身就是一个抽象的概念，其面积也是无法求的，将面积的值设定为0，其实是一种不得已的做法。'
