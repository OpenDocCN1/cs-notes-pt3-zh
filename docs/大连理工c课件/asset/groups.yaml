    \ void clear(int n = 0); | 恢复或设置状态字 |\n\n## 9.3.4 重载流插入和提取运算符\n\nC++ 中定义的位左移运算符“<<”和位右移的运算符“>>”进行位运算，在流类中对它们进行了重载，使之作为流插入运算符和流提取运算符，用来对各种基本类型的数据进行输出和输入操作。\n\
    \n## 9.3.4 重载流插入和提取运算符\n\n### 重载流插入运算符 <<\n\nostream 流类中为基本类型数据重载“<<”，有如下形式：\n\
    \n```cpp\nostream & ostream::operator << (int);\nostream & ostream::operator <<\
