    \ A 中重载该运算符  \nA 类中定义如下友元函数：\n\n```cpp\nfriend ostream& operator << (ostream&\
    \ out, const A&);\n```\n\n## 9.3.4 重载流插入和提取运算符\n\n### 重载流提取运算符 >>\n\nistream 类中重载了一组成员函数\
    \ operator >>（），对于各种基本类型 T 的数据，定义成员函数重载该运算符：\n\n```cpp\nistream& istream::operator>>(T&\
    \ data);\nistream& istream::operator>>(char *);\n```\n\n可以在用户自定义的类 A 中重载 >> 运算符\
    \  \nA 类中定义如下友元函数：\n\n```cpp\nfriend istream & operator >> (istream &, Type&);\n\
    ```\n\n## 9.4 文件流\n\n### 数据的层次结构\n\nBit – Byte – Field – Record – File - DBMS\n\
    \n### 文件的概念\n\n存储在外部介质中的数据集合称为文件。\n\nC++ 把文件看成有序的字节流，提供低级和高级的 I/O 功能\n\n- 一批数据通常是以文件的形式存放在外部介质上的。\n\
    - 操作系统是以文件为单位对数据进行管理。\n\n## 9.4 文件流\n\n### 知识要点\n\n- 文件以及文件流的概念\n  - 数据流方向，文本文件与二进制文件\n\
    \  - 文件流类与文件流对象\n\n- 文件的打开与关闭\n  - 打开方式\n\n- 文本文件的顺序读写操作\n  - `<<, >>, put, get(),\
    \ getline(), read(), write()`\n\n- 二进制文件的随机读写操作\n\n## 9.4 文件流\n\n### 9.4.1 文件流类与对象\n\
    \n文件流是以外存文件为输入输出对象的数据流。  \n输出文件流是从内存流向外存文件的字节序列，  \n输入文件流是从外存文件流向内存的字节序列。  \n\
    每一个文件流都有一个内存缓冲区与之对应。  \nI/O 类库中定义了以下三种文件流进行文件读写操作。\n\n1. ifstream 类  \n   从输入流\
    \ istream 类派生的，支持从磁盘文件的输入。\n\n2. ofstream 类  \n   从输出流 ostream 类派生的，支持向磁盘文件的输出。\n\
    \n3. fstream 类  \n   从输入输出流 iostream 类派生的，支持对磁盘文件的输入输出。\n\n## 9.4 文件流\n\n### 9.4.1\
    \ 文件流类与对象\n\nifstream、ofstream 和 fstream 类对象  \n用于内存与文件之间的数据传输\n\n## 9.4 文件流\n\
    \n### 9.4.1 文件流类与对象\n\nC++ 把文件看成有序的字节流，提供低级和高级的 IO 功能\n\n- 使用方式：程序文件 / 数据文件\n\
    - 存取方式：顺序读写文件 / 随机读写文件\n- 编码方式：文本文件 / 二进制文件\n\n➤ 文本模式  \n— 任何数据被解释为一系列的字符，  \n\
    \  内存中存储的二进制数据需要转换为字符的形式。  \n➤ 二进制模式  \n— 无需进行格式的转换，流中直接传送原始字节数据。\n\n## 文件操作的基本步骤：\n\
    \n1. 打开文件\n   ```cpp\n   streamclass fileObj (fileName , openMode );\n   fileObj.open(\
    \ fileName , openMode );\n   ```\n\n2. 读 / 写文件\n   ```cpp\n   << , put(),    \
    \     write()\n   >> , get(),getline(), read()\n   ```\n\n3. 关闭文件\n   ```cpp\n\
    \   fileObj.close( );\n   ```\n\n"
