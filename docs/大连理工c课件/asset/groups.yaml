    +   • 无论这个类的对象被定义了多少个，静态数据成员在程序中也只有一份拷贝，由该类型的所有对象共享访问；

    +   • 对该类的多个对象来说，静态数据成员只分配一次内存；

    +   • 静态数据成员的值对每个对象都是一样的，而非静态数据成员，每个类对象都有自己的拷贝。'
