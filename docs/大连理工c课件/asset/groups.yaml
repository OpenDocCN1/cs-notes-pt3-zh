    \ 0;`\n\n- 初始化在类体外进行，而前面不加static；\n- 初始化时不加该成员的访问权限控制符public、protected、private等；\n\
    - 若未在类外初始化，程序连接时会出现错误；\n- sizeof运算符不包含静态数据成员的空间。\n\n静态数据成员访问形式：\n\n`<类对象>.<静态数据成员名>`\n\
