    \ second(0){ }\n```\n\nClock clock1(1,2,3); //需要3个参构造函数\nClock clock2; //需要无参构造函数\n\
    \n#### 析构函数\n\n- 析构函数，在对象生命周期结束自动执行析构函数，完成清理内存工作，并可以执行指定的其他操作。\n- 析构函数是一种在结束对象调用时自动执行的特殊的成员函数，一个类中只能定义一个析构函数。\n\
    - 析构函数声明为公有成员，析构函数名由波折号 “~” 与类名组合而成，析构函数不接受参数（所以不能重载，只有一个析构函数），没有返回值。\n\n```cpp\n\
