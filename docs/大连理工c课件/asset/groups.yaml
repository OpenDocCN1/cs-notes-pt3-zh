    # 编译器如何处理函数模板？


    +   - 当函数模板被**调用时**编译器才产生代码。

    +   - 根据**实参的类型**，**替换**函数模板中的**类型参数**。

    +   - 这个过程叫做函数模板的**实例化**（`instantiating`）。

