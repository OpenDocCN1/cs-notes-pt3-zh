    # 第1章 概述


    # 1.4 C++概述


    C++表示C的累加。由于C++基于C，所以这两种语言有许多共同的语法和功能，C中所有低级编程的功能都在C++中保留下来。但是，C++比其前身丰富得多，用途也广泛得多。C++对内存管理功能进行了非常大的改进，C++还具有面向对象的功能，所以C在功能上只是C++的一个很小的子集。C++在适用范围、性能和功能上也增强很多。


    +   1. C++适用的应用程序范围极广。

    +   2. C++可以用于硬件级别的编程。

    +   3. C++从C中继承了过程化编程的高效性，并集成了面向对象编程的功能。

    +   4. C++在其标准库中提供了大量的功能。

    +   5. 有许多商业C++库。

    +   6. C++的可移植性非常强。'
