    # # 小结


    +   流对象是内存与文件（或字符串）之间数据传输的信道。


    +   数据流本身没有逻辑格式。


    数据的解释方式由应用程序的操作决定。


    流类库提供了格式化和非格式化的I/O功能。


    +   文本流I/O提供内存基本类型数据与文本之间的格式转换。


    +   处理用户定义的文件I/O要用文件流对象。'
