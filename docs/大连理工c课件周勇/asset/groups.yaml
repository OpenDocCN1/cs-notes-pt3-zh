    # ➢ 静态数据成员 vs 全局变量


    静态数据成员是各对象之间的数据沟通的渠道，\n实现数据共享。


    全局变量破坏了封装的原则，不符合面向对象程序的要求。


    公用静态数据成员与全局变量的作用域不同\n静态数据成员的作用域只限于定义该类的作用域内'
