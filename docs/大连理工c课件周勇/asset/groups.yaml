    # # 1. 面向过程程序设计OPP


    +   - Oriented Procedural Programming


    将复杂过程简单的按功能分层，从而解决问题。


    +   - 结构化：


    描述任何实体的操作的序列只需三种基本控制结构


    +   - 模块化设计：


    程序设计中各个过程体和组成部分用模块表示


    +   - 过程化设计方法：


    自顶向下，逐步细化


    ![](img/bf99340ecbaf09a3098cf7d9c4b141d1_1_0.png)'
  - '[PAGE 2]


    # 2. 面向对象程序设计OOP


    面向对象的编程思想力图使在计算机语言中对事物的的描述与现实世界中该事物的本来面目尽可能的一致。


    ![](img/bf99340ecbaf09a3098cf7d9c4b141d1_2_0.png)'
  - '[PAGE 3]


    # # 面向对象程序设计


    # ## 对象 object


    +   - 对象是实际存在的该类事物的每个个体，也称实例(instance)。


    +   - 构成世界的一个独立单位，它具有自己的静态特征（状态）和动态特征（操作）。


    +   - 静态特征即可以用某种数据来描述的特征


    +   - 动态特征即对象所表现的行为或对象所具有的功能。'
  - "[PAGE 4]\n\n# # 面向对象程序设计\n\n# ## 类 class\n\n+   - 一类事物描述， 是抽象的、概念上的定义；  \n+ \
    \    把具有相同属性的事物划分为一类，  \n+     它将具有相同状态、操作和访问机制的多个对象  \n+     抽象(abstract)成为一个类。\n\
    \n+   - 面向对象语言必需提供的用户定义的数据类型  \n+     类封装了一组数据结构和作用于此的一组方法。"
  - '[PAGE 5]


    # # 3.面向过程与面向对象


    程序 = 算法 + 数据结构

    + 程序设计方法

    + 语言工具和开发环境


    对象 = 算法 + 数据结构


    程序 = (对象+对象+对象+...) + 消息


    ![](img/bf99340ecbaf09a3098cf7d9c4b141d1_5_0.png)'
  - '[PAGE 6]


    # # 面向对象 vs 面向过程设计


    | 程序执行步骤 | 通常按顺序执行 | 在对象内执行独立其他对象 |

    |---|---|---|

    | 数据项 | 变量;独立;位于程序中 | 属性;属于一个对象;随对象而变,具有某种行为 |

    | 激活方式 | 调用函数 | 发消息给对象 |

    | 数据与函数 | 保持分离 | 结合成对象 |

    | 事件发生 | 函数执行时 | 方法执行时 |

    | 活动涉及 | 函数和参数 | 对象,消息和参数 |'
