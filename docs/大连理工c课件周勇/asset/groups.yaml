    class Time\n{\npublic:\n    Time() { }\n    void set_time(int, int, int );\n \
    \   void show_time( );\nprivate:\n    int hour;\n    int min;\n    int sec;\n\
    };\n```\n\n```cpp\n#include <iostream.h>\nint main( )\n{\n    Time t1;\n    t1.set_time(\
