    \n1. 将变量hour置为0；\n2. 这种初始化方法在构造函数执行以前进行。\n3. 如何用这种方式初始化多个成员变量？\n\n## 3.带参数的构造函数\n\
    \n带参数的构造函数可以在创建对象时，用具体数值初始化数据成员和各种数据元素。可方便实现对不同对象进行初始化。\n\n构造函数的首部：\n\n构造函数名（形参列表）；\n\
