    \n## 1. 结构一类\n\n几点\n如何调整\n\n```cpp\nint hour, minute, second;\n```\n\n```cpp\n\
    struct Clock\n{\n    int hour; // 0-23\n    int minute; // 0-59\n    int second;\
    \ // 0-59\n};\n```\n\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_44_0.png)\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_44_1.png)\n\
    \n数据类型是对同种数据的抽象\n\n```cpp\nstruct Clock\n{\n    int hour;\n    int minute;\n \
    \   int sec;\n};\n```\n\n```cpp\n#include <iostream.h>\nint main()\n{\n    Clock\
    \ t1;\n    setTime(t1);\n    showTime( t1 );\n    Clock t2;\n    setTime(t2);\n\
    \    showTime( t2 );\n    return 0;\n}\n```\n\n```cpp\nvoid setTime( Clock& t\
