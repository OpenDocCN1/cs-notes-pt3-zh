    \    Time(int h, int m, int s )\nprivate:\n    int hour;   int min;   int sec;\n\
    };\n```\n\n```cpp\n#include <iostream.h>\nint main( )\n{\n    Time t2(8, 15, 16);\n\
    \    t2.show_time( );\n    return 0;\n}\n```\n\n> 用参数初始化列表对数据成员初始化\n\n## 3.重载构造函数\n\
