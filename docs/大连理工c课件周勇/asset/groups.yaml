    \n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_126_0.png)\n\n```cpp\ncout<<sizeof(Time)<<endl;\n\
    ```\n\n## 成员函数\n\n### 成员函数 vs. 一般函数\n\n- 都有函数体，返回值和函数类型。\n- 成员函数属于一个类的成员，出现在类体中\n\
    - 成员访问说明符限制private、public\n- 注意调用它的权限以及它的作用域\n- 成员函数必须由对象句柄调用\n- 成员函数和数据成员封装成一体\n\
    \n## 类的封装性和信息隐蔽\n\n### 1. 公用接口与私有实现的分离\n\n- 类中被操作的数据是私有的，实现细节对用户是隐蔽的，这种实现称为私有实现。\n\
    - 在声明了一个类以后，用户主要是通过调用公用的成员函数来实现类提供的功能。因此，公用成员函数是用户使用类的公用接口，或者说是类的对外接口。\n- 软件工程的一个最基本的原则就是将接口与实现分离，信息隐蔽是软件工程中一个非常重要的概念。\n\
    \n## 类声明和成员函数定义的分离\n\n### 1. 自定义类库头文件.h\n\n文件中有用户自行设计的类的定义，包括类的外部接口（公有成员函数的原型）。任何需要使用这些类的源程序，只要在文件中包含这些头文件即可。\n\
    \n```cpp\n// date.h\nclass Date{\npublic:\nvoid set(int m,int d,int y);\nint isLeapYear();\n\
    void print();\nprivate:\nint month, day, year;\n};\n```\n\n### 2. 用户自定义类库的内部实现源文件\n\
    \n包括相关头文件包含和类中成员函数的定义。这就形成类的实现方法。\n\n```cpp\n//date.cpp\n#include<iostream.h>\n\
    #include \"date.h\"\nvoid Date ::set(int m,int d,int y)\n{\n    month=m; day=d;\
    \ year=y;\n}\nint Date :: isLeapYear( )\n{\n    return\n    (year%4==0&&year%100!=0)\
    \ || (year%400==0) ;\n}\nvoid Date :: print( )\n{\n    cout <<month <<\"/\" <<day\
    \ <<\"/\" <<year <<endl;\n}\n```\n\n### 3. 唯一包含主函数的源文件\n\n包括所有相关头文件及main\n\n```cpp\n\
    #include<iostream.h>\n#include\"date.h\"\nvoid main()\n{\n    Date a;\n    a.set(2,4,1998);\n\
    \    a.print();\n}\n```\n\n- 在面向对象的程序开发中，一般做法是将类的声明放在指定的头文件中，用户如果想用该类，只要把有关的头文件包含进来即可，不必在程序中重复书写类的声明，以减少工作量，节省篇幅，提高编程的效率。\n\
    - 由于在头文件中包含了类的声明，因此在程序中就可以用该类来定义对象。由于在类体中包含了对成员函数的声明，在程序中就可以调用这些对象的公用成员函数。为了实现信息隐蔽，对类成员函数的定义一般不放在头文件中，而另外放在一个文件中。\n\
    \n## 课堂练习（分离，实例）\n\n实现表示学生的类Student，属性包括名字，学号，性别和生日，行为包括：属性的设置和显示等，返回属性值。建立完整的工程，包括多个源文件和头文件。\n\
    \n| Student    |\n|------------|\n| char name[10] |\n| int no    |\n| char sex\
    \    |\n| Date birthday |\n| void set();    |\n| void set(char*, int, char); |\n\
    | void set(Date&); |\n| char* getName(); |\n| int getNo();    |\n| void print();\
    \   |\n\n"
