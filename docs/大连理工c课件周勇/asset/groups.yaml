    \n```cpp\nclass Time\n{\npublic:\n    Time();\n    void set_time(int, int, int);\n\
    \    void show_time();\nprivate:\n    int hour, min, sec;\n};\nTime::Time()\n\
    {\n    hour=0; min=0; sec = 0;\n}\n```\n\n```cpp\n#include <iostream.h>\nint main()\n\
