    class A\n{\nprivate :      // private说明符在首\n    int m_a;\npublic:        // 切换到public说明符\n\
    \    int m_b;\n    void print(){ cout<<m_a<<m_b;}\n    int getA(){ return m_a\
    \ ; }\n}\n```\n\n- 通过指向对象的指针访问对象中的成员；\n\n```cpp\nTime t, *pTime;       //定义对象t和指针变量p\n\
