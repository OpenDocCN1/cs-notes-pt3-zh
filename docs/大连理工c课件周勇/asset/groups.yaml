    ```\n\n编译系统会为这个对象分配存储空间，以存放对象中的成员。\n\n## 对象的使用\n\n- 由于类和结构是等价的，对类的五种操作对结构也同样适用：\n\
    \n（1）对象之间可以相互赋值。\n\n```cpp\nLocation locationA, locationB;\nlocationA.set (5,6);\n\
