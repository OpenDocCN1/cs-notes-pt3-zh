    \  - 定义求两点距离的友元函数distance。\n\n```cpp\nvoid main()\n{\n    Point p1 , p2( 4.0,\
    \ 6.0 ) ;\n    Point p3 = p2;\n    double d = distance ( p1, p2 ) ;\n    cout\
    \ << \"This distance is \" << d << endl ;\n}\n```\n\n## 例 计算两点之间的距离\n\n// 普通函数作友元函数\n\
    class Point\n{\npublic:\n    Point(double xi = 0, double yi = 0) ;\n    setXY(double\
    \ xx, double yy) ;\n    double getX() ;\n    double getY() ;\n    void show();\n\
    \    friend double distance ( Point& a, Point& b ) ;\nprivate:\n    double X,\
    \ Y ;\n    static int   total;\n} ;\n\n## 练习\n\n1. 若需要把一个函数“void F();”定义为一个类AB的友元函数，则应在类AB的定义中加入一条语句：____________________。\n\
    \n2. 以下关于友元函数的叙述不正确的是（ ）\n\n   A. 友元函数提供了类之间数据共享的一个途径\n   B. 一个友元函数可以访问任何类的任何成员\n\
    \   C. 友元函数破坏了数据的封装\n   D. 友元函数增加了程序设计的灵活性\n\n3. 友元函数的作用是（ ）\n\n   A. 提高程序的效率\
    \  B. 加强类的封装性\n   C. 实现数据的隐蔽性  D. 增加成员函数的种类\n\n4. 友元类中的所有成员函数可以对该类的私有成员进行存取操作。\n\
    \n## 作业: 上机实验3~ (4) (5)\n\n(4) 改写复数类，提供各种构造函数(默认/ 有参/ 拷贝构造函数), 实现两个复数的四则运算。用友元函数实现加减乘除功能。\n\
    \n(5) 定义整型数集合类和实型数集合类，每个集合中最多放10个元素。完成集合的设置，输出和复制功能。\n\n## 第十讲 类与对象小结\n\n## 问题:\
    \ 设计描述圆的类\n实现圆的各种操作\n\n## 一、面向对象\n\n- 面向对象的编程思想力图使在计算机语言中对事物的描述与现实世界中该事物的本来面目尽可能的一致。\n\
    \n- 类(class)和对象(object)\n\n  类是对一类事物描述，是抽象、概念上的定义；\n  对象是实际存在的该类事物的每个个体，也称实例。\n\
    \n## 一、面向对象类的包含关系\n\n| Point |\n| --- |\n| -x: int \\-y: int |\n| +Point (int=0,\
    \ int=0) +Point(const Point&) +print():void +getX():int +getY():int |\n\n| Circle\
    \ |\n| --- |\n| -radius:double \\-cener:Point |\n| +Circle(double, int, int) +Circle(double,\
    \ Point& ) +print():void +area():double + 《static》 pi: double |\n\n## 二、类的定义\n\
    \n- 类的概念\n\n- 类与结构体\n\n- 类的声明\n\n- 类的定义\n\n- 类成员的访问权限\n\n## 三、类的实例化\n\n- 定义对象-构造函数\n\
    \  - 默认构造函数 / 自定义构造函数\n  - 带默认参数的构造函数\n  - 复制构造函数\n- 成员引用\n- 复杂对象的操作\n\n## 对象指针与数组\n\
    \n## 四、构造函数\n\n### ➢作用\n\n- 用于初始化对象的特殊成员函数：\n- 为对象分配空间；对数据成员赋初值；请求其他资源。\n\n###\
    \ ➢特点\n\n构造函数是与类同名的成员函数\n可有任意类型的参数，但没有返回类型\n不能由程序员调用，创建对象时自动执行\n\n### ➢分类\n\n\
    重载构造函数\n\n"
