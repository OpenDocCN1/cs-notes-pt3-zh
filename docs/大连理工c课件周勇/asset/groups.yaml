    }\n```\n\n- 在类内直接定义成员函数，默认创建为内联函数。\n- 如果成员函数在类体外定义，要用 `inline` 声明为内联函数。\n\n##\
    \ 成员函数 vs. 一般函数\n\n- 都有函数体，返回值和函数类型。\n- 成员函数属于一个类的成员，可出现在类体中；在类体外定义时要加类名和作用域解析符\
    \ `::`。\n- 成员函数和数据成员封装成一体，可直接引用数据成员。\n- 成员函数只能由本类对象或者成员访问，访问说明符限制 `private`、`public`。\n\
    \n## 2. 类的声明与定义\n\n类是一种用户自定义的数据类型，它的一般定义格式如下：\n\n```cpp\nclass 类名 {\n\nprivate:\n\
    \    私有数据成员和成员函数；\n\nprotected:\n    保护数据成员和成员函数；\n\npublic:\n    公有数据成员和成员函数；\n\
    \n};\n\n各个成员函数的实现；\n```\n\n## 3. 访问控制\n\n- 成员访问说明符决定调用成员的权限以及它的作用域。\n- 公有 `public`：说明为公有的成员可以被程序中的任何代码访问。\n\
    - 私有 `private`：说明为私有的成员只能被类本身的成员函数及友元类成员函数或友元函数访问；默认情况下，类的成员是私有的。\n- 保护 `protected`：除了类本身的成员函数和说明为友元函数或友元类的成员函数可以访问保护成员外，该类的派生类的成员也可以访问。\n\
    \n```cpp\nclass A\n{\nprivate:             // 首次出现时可以省略\n    int m_a;\n    void\
    \ set(int a) { m_a = a; }\npublic:              // 公有成员\n    int m_b;\n    void\
    \ show();\n};\n\nvoid A::show() { cout << m_a << m_b << endl; }\n```\n\n```cpp\n\
    A a;    // 定义A类的对象a\na.m_a;\na.m_b;\na.show();\na.set(5);\n```\n\n- `private`\
    \ 声明的数据和函数不能在类以外访问。\n- `public` 声明的数据和函数可以在类以外访问。\n- 默认为 `private` 访问类型。\n\n```cpp\n\
    class A\n{\npublic:\n    int m_b;\n    void show();\nprivate:\n    int m_a;\n\
    \    void set(int a)\n    { m_a = a; }\n};\n```\n\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_32_0.png)\n\
    \n## 课堂练习：完成 Clock 类的定义并对其进行测试\n\n增加 `void setTime(int h, int m, int s);`，注意时间有效性的判断。\n\
    \n应注意区分什么场合用域运算符 `::`，什么场合用成员运算符 `.`，不要搞混。\n\n- 在主函数中调用两个成员函数时，应指明对象名，表示调用的是哪一个对象的成员函数。`Time\
    \ t1, t2;  t1.setTime(); t2.showTime();`\n- 在类外定义函数时，应指明成员函数的作用域 `void Clock::setTime()\
    \ { cin >> hour >> minute >> sec; }`。在成员函数引用本对象的数据成员时，只需直接写数据成员名，这时 C++ 系统会把它默认为本对象的数据成员。\n\
    \n## 总结\n\n- 类的概念\n- 类与结构体的区别\n- 类的声明\n- 类的定义\n- 访问权限\n\n## 课堂练习：声明日期类\n\n声明并定义描述日期的类，对该类进行测试。\n\
    \n```cpp\nclass Date\n{\nprivate:\n    int month, day, year;\n    int isLeapYear();\n\
    public:\n    void set(int m, int d, int y);\n    void show();\n    int getYear();\n\
    \    int getMonth();\n    int getDay();\n    int whichDay();\n};\n```\n\n## 作业与上机\n\
    \n### 1. 盒子类 BOX\n\n- 数据成员包括：`length`, `width`, `height`\n- 成员函数实现以下功能：\n  1.\
    \ 由键盘分别输入三个盒子的长宽高；\n  2. 输出盒子的属性；\n  3. 计算长方体盒子的表面积和；\n  4. 计算长方体盒子的体积。\n- 编写基于对象的程序，对该类进行测试。\n\
    \n### 2. 日期类 Date\n\n- 私有数据成员 `year`, `month`, `day`；\n- 公有成员函数实现以下功能：\n  1. 设置时间，并对该时间的有效性进行检测；\n\
    \  2. 输出时间，按 `mm/dd/yyyy` 方式打印；\n  3. 判断该日期是一年的第几天；\n  4. 判断该日期是星期几（选作）。\n- 编写一个驱动程序进行测试。\n\
    \n### 3. 时间类 Time\n\n- 私有数据成员 `int hour, minute, second`\n- 公有成员函数：自定义\n\n用一个\
    \ `tick` 成员函数将 Time 对象中存放的时间递增 1 秒。  \nTime 对象应该总是保持一致状态。编写一个驱动程序，  \n在循环中测试 `tick`\
    \ 成员函数，按标准格式打印时间，从而  \n演示 `tick` 成员函数的工作情况。要保证测试下列情况：  \na) 递增到下一分钟。  \nb) 递增到下一小时。\
    \  \nc) 递增到下一天（即 11:59:59 PM 到 12:00:00 AM）。\n\n### 4. Student 类\n\n每个学生包含姓名、年龄、学号、性别等属性，并且实现显示和设置这些属性的成员函数。\n\
    \n要求：第一次上机检查！\n\n| Student |\n| --- |\n| `char name[10]` |\n| `int no` |\n| `char\
    \ sex` |\n| `void set();` |\n| `void set(char*, int, char);` |\n| `void get();`\
    \ |\n| `char* getName();` |\n"
