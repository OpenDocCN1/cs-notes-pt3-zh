- pgno: 6
  md: '# # 面向对象 vs 面向过程设计


    | 程序执行步骤 | 通常按顺序执行 | 在对象内执行独立其他对象 |

    |---|---|---|

    | 数据项 | 变量;独立;位于程序中 | 属性;属于一个对象;随对象而变,具有某种行为 |

    | 激活方式 | 调用函数 | 发消息给对象 |

    | 数据与函数 | 保持分离 | 结合成对象 |

    | 事件发生 | 函数执行时 | 方法执行时 |

    | 活动涉及 | 函数和参数 | 对象,消息和参数 |'
  merge: -1
  img_proc: true
