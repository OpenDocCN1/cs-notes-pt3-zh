- pgno: 265
  md: '# # 友元类


    +   当两个类关系极为密切时，可以将类声明为另一个类的友元。友元类通常设计为一种对数据操作或类之间传递消息的辅助类。


    +   将一个类声明为另一个类的友元类定义的一般格式如下：


    ```

    friend class 友元类名；

    ```


    +   当一个类作为另一类的友元类时，类的所有成员函数都是另一类的友元函数。'
  merge: -1
  img_proc: true
- pgno: 266
  md: "# 友元类\n\n说明：\n\n+   - 友元关系不具有传递性。\n+   \n+     例如\n+   \n+     类A是类B的友元，类B是类C的友元，\n\
    +   \n+     但并不表示A是C的友元。\n\n+   - 友元关系不具有交换性。\n+   \n+     例如\n+   \n+     类A是类B的友元，但并不表示类B是类A的友元。"
  merge: -1
  img_proc: true
