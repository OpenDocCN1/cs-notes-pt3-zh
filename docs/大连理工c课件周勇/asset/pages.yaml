  md: '# # 第五讲 析构函数


    # ## 析构函数(destructor)


    +   - 当一个对象生命期结束时，系统自动调用析构函数进行清除对象，释放内存等。

    +   - 没有定义析构函数时，系统提供缺省版本的析构函数

    +   - 特点：

    +     - 析构函数名为：~ 类名

    +     - 没有参数，也没有返回类型'
