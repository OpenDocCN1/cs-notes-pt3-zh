- pgno: 3
  md: '# # 面向对象程序设计


    # ## 对象 object


    +   - 对象是实际存在的该类事物的每个个体，也称实例(instance)。


    +   - 构成世界的一个独立单位，它具有自己的静态特征（状态）和动态特征（操作）。


    +   - 静态特征即可以用某种数据来描述的特征


    +   - 动态特征即对象所表现的行为或对象所具有的功能。'
  merge: -1
  img_proc: true
- pgno: 4
  md: "# # 面向对象程序设计\n\n# ## 类 class\n\n+   - 一类事物描述， 是抽象的、概念上的定义；  \n+     把具有相同属性的事物划分为一类，\
    \  \n+     它将具有相同状态、操作和访问机制的多个对象  \n+     抽象(abstract)成为一个类。\n\n+   - 面向对象语言必需提供的用户定义的数据类型\
    \  \n+     类封装了一组数据结构和作用于此的一组方法。"
