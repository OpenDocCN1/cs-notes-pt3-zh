  md: '# # 面向对象程序设计


    # ## 2. 封装(encapsulate)


    +   ✓ 把全部属性和全部行为封装在一起，形成一个不可分割的独立单位（即对象）。


    +   ✓ 信息隐蔽(information hiding)


    对象的外部不能直接地存取对象属性，只能通过几个允许外部使用的服务与对象发生联系。


    +   ✓ 对象间通过发送消息进行交互。


    ![](img/bf99340ecbaf09a3098cf7d9c4b141d1_8_0.png)'
