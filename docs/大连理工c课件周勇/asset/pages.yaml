  md: '# 3.重载构造函数


    类的定义中可以有多个构造函数，但必须各个构造函数的形参个数或类型不一样，即重载构造函数。


    在创建对象时会根据实参的类型及个数自动选择相应的构造函数。每个对象创建时只调用1个构造函数


