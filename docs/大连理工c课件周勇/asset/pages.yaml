  md: '# 3. 访问控制


    决定调用成员的权限以及它的作用域


    # 成员访问说明符


    +   公有 public:


    说明为公有的成员可以被程序中的任何代码访问；


    +   私有 private:


    说明为私有的成员只能被类本身的成员函数及友元类成员函数或友元函数访问，默认类的对象的成员是私有；


    +   保护 protected:


    除了类本身的成员函数和说明为友元函数或友元类的成员函数可以访问保护成员外，该类的派生类的成员也可以访问。


