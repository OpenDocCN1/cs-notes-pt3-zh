- pgno: 10
  md: '# # 面向对象程序设计


    # ## 3. 继承 (inheritance)


    +   - 软件重用” (software reusability)


    采用继承的方法可以很方便地利用一个已有的类建立一个新的类。


    +   - 类与类之间可以组成继承层次


    一个类的定义（派生类）可以定义在另一个已定义类（基类）的基础上。


    派生类可以继承基类中的属性和操作，也可以定义自己的属性和操作。'
  merge: -1
  img_proc: true
