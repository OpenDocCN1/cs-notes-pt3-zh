- pgno: 279
  md: '# 四、构造函数


    # ➢作用


    +   • 用于初始化对象的特殊成员函数：

    +   • 为对象分配空间；对数据成员赋初值；请求其他资源。


    # ➢特点


    构造函数是与类同名的成员函数

    可有任意类型的参数，但没有返回类型

    不能由程序员调用，创建对象时自动执行


    # ➢分类


    重载构造函数'
