- pgno: 258
  md: "# 友元 (friend)\n\n+   - 友元可以访问与其有好友关系的类中的私有成员和保护成员。\n+   \n+     友元包括友元函数和友元类。\n\
    +   - 使用友员目的是基于程序的运行效率\n+   \n+     运算符重载的某些场合需要使用友员\n+   - 为了确保数据的完整性，及数据封装与隐藏的原则，建议尽量不使用或少使用友元。"
  merge: -1
  img_proc: true
- pgno: 259
  md: "# # 友元函数\n\n+   - 友元函数是在类声明中由关键字friend修饰说明的非成员函数，虽然类中有友元函数的原型，但是友元不是成员函数。\n\
    +   在它的函数体中能够通过对象名访问 private 和 protected成员\n+   \n+   - 作用：增加灵活性，使程序员可以在封装和快速性方面做合理选择。\n\
    +   \n+   - 格式如下：\n+   friend <类型> <友元函数名> （<参数表>）；"
  merge: -1
  img_proc: true
- pgno: 260
  md: "# # 友元函数\n\n```\nclass A\n{\nprivate:\n    int num ;\npublic:\n    void MemberFun(int)\
    \ ;\n    friend void FriendFun(A * , int) ;\n} ;\n```\n\n```\nvoid A:: MemberFun(\
    \ int x )\n{ this-> num = x ; }\n```\n\n```\nvoid FriendFun( A * ptr, int x )\n\
    { ptr -> num = x ; }\n```\n\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_260_0.png)\n\
    \n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_260_1.png)"
  merge: -1
  img_proc: true
- pgno: 261
  md: "# # 友元函数\n\n```\nclass A\n{\n private:\n int num ;\n public:\n void MemberFun(int)\
    \ ;\n friend void FriendFun(A & , int) ;\n } ;\nvoid FriendFun( A & a , int x\
    \ )\n{ a. num = x ; }\n```\n\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_261_0.png)\n\
    \n```\nvoid A:: MemberFun( int x )\n{ (*this). num = x ;}\n```\n\n![](img/bf99340ecbaf09a3098cf7d9c4b141d1_261_1.png)"
