    # 6. 办公自动化(OA)与电子出版技术(Electronic Publication)


    办公自动化(OA)是一种解决特定行政办公类需求的信息系统。 随着科学技术的迅速发展,在办公室繁琐的日常工作中,大量杂乱无章的文件数据分类、汇总、加工成不同要求的文字和图形报告,以及“电子邮件”通信等,都可以由价廉物美、易于操作,具有高质量的显示设备的微型计算机系统来完成。
    图形显示技术在办公自动化和事务处理中的应用,有助于数据及其相互关系的有效表达,有助于决策信息表达与传输,因而有利于人们进行正确的决策。'
