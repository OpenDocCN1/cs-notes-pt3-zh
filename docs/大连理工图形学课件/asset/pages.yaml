  md: '# # 区域填充算法——边界填充算法


    +   - 可以用于填充带有内孔的平面区域。


    +   - 把太多的像素压入堆栈，降低了效率，同时需要较大的存储空间。


    +   - 递归执行，算法简单，但效率不高，区域内每一像素都引起一次递归，进/出栈费时费内存。


    +   - 通过沿扫描线填充水平像素段，来代替处理4-邻接点和8-邻接点。'
