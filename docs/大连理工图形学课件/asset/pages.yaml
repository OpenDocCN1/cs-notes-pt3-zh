  md: '# # 改进的有效边表算法（Y连贯性算法）


    +   - 有效边（Active Edge）：指与当前扫描线相交的多边形的边，也称为活性边。


    +   - 有效边表（Active Edge Table，AET）：把有效边按与扫描线交点x坐标递增的顺序存放在一个链表中，此链表称为有效边表。


    +   - 有效边表的每个结点：

    +     - x Ymax 1/k next'
  merge: -1
