- pgno: 364
  md: "# # 区域填充算法——边界填充算法\n\n+   - 算法的输入：种子点坐标(x,y)，填充色以及边界颜色。\n+   - 利用堆栈实现简单的种子填充算法\
    \  \n+     算法从种子点开始检测相邻位置是否是边界颜色，若不是就用填充色着色，并检测该像素点的相邻位置，直到检测完区域边界颜色范围内的所有像素为止。"
