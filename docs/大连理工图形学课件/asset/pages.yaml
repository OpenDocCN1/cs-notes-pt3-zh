- pgno: 449
  md: '# 基本几何变换——旋转变换


    推导： （极坐标）


    x = r cosα   y = r sinα


    x'' = r cos(α + θ) = x cosθ - y sinθ


    y'' = r sin(α + θ) = x sinθ + y cosθ


    矩阵：逆时针旋转θ角


    [x'' y''] = [x y] . [cosθ sinθ -sinθ cosθ]'
  merge: -1
