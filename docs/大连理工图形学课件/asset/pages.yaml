- pgno: 442
  md: '# 6.2 基本几何变换


    +   - **图形的几何变换**是指对图形的几何信息经过平移、比例、旋转等变换后产生新的图形，是图形在方向、尺寸和形状方面的变换。（位置、尺寸-形状、方向）

    +   - **基本几何变换**都是相对于坐标原点和坐标轴进行的几何变换。'
  merge: -1
