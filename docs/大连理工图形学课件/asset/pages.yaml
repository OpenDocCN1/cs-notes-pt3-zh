  md: '# 1.3 计算机图形学的发展


    # 1.3.1 计算机图形学的发展简史


    自20世纪50年代以来, 计算机图形学的发展历程经历了50多年。根据其发展的特点, 这50年可以分为酝酿期 (50年代)、萌芽期 (60年代)、发展期 (70年代)、普及期
    (80年代)和提高增强期 (90年代)等五个阶段。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_31_0.png)


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ## 1.3.2 硬件设备的发展


    在计算机图形系统的硬件中，**图形显示器**是最关键的设备之一，它的发展也具有一定的代表性。 20世纪60年代中期在计算机图形系统中使用的是**随机扫描的显示器**，它具有较高的分辨率和对比度，具有良好的动态性能。'
  merge: -1
  img_proc: true
