- pgno: 27
  md: '# # 第 1 章 计算机图形学概述


    数字图像处理将客观世界中原来存在的物体映像处理成新的数字化图像。如对照片图像扫描采样、量化、模 / 数转换后送入计算机，由计算机按应用的需要，对数字图像信息进行加工处理，从而改善图像的视觉效果。其主要处理内容有图像去噪、增强、复原、分割、提取特征、重建、识别以及存储、压缩编码和传输等。'
