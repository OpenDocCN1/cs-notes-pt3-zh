  img_proc: true
- pgno: 70
  md: '# 12. 医疗卫生方面的应用


    计算机图形学在医疗卫生方面的应用包括：用来做病历的检索和统计以及医疗方案的研究；用显示设备显示病历，显示各种药物的剂量、性能；对某种病的治愈率作统计分析；对病人的医疗方案(如放射线照射)进行研究，以提高治疗效率；计算机辅助手术(Computer
    Aided Surgery)；远程医疗/手术系统等。 医学上还往往结合图像处理和计算机图形学来建模和研究物理功能。例如设计人造肢体、计划和练习手术等。 其应用示例如图1.23所示。'
