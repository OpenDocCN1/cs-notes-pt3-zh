- pgno: 345
  md: '# # 改进的有致边表算法——构造边表


    +   首先构造一个纵向链表，链表的长度为多边形所占有的最大扫描线数，链表的每个结点，称为一个桶，则对应多边形覆盖的每一条扫描线。


    +   将每条边的信息链入与该边最小y坐标（\( y_{min} \)）相对应的桶处。也就是说，若某边的较低端点为\( y_{min} \)，则该边就放在相应的扫描线桶中。'
