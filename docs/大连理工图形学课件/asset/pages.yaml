  md: '# # 第 1 章 计算机图形学概论


    科学计算可视化按其实现的功能,可以分为三个层次:


    +   (1) 结果数据的后处理, 即对计算数据或测量数据进行脱机处理, 然后用图像显示出来, 这一层次的功能对计算能力的需求相对较低。

    +   (2) 中间数据或结果数据的实时跟踪处理及显示。

    +   (3) 中间数据或结果数据的实时跟踪处理、 显示及交互控制。 这一层次的功能不但能对数据进行实时跟踪显示, 而且还可以交互式地修改原始数据、 边界条件或其它参数,
    以使计算结果更为满意。'
  merge: -1
