  md: '# 第 2 章 基本图形生成算法（I）


    # 1) Bresenham的基本原理


    Bresenham算法的构思巧妙：它引入动态误差 e，当 x 方向每次递增 1 个单位，可根据 e 的符号决定 y 方向每次递增 0 或 1。


    +   - e<0，y方向不递增

    +   - e>0，y方向递增 1

    +   - x方向每次递增 1 个单位，e = e + k'
