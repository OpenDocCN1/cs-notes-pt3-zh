    (3) 利用光照模型、光线跟踪、辐射度技术尽可能精确地模拟光源照射的物理效果，使空间物体具有像拍照片一样的光照效果和明暗层次；


    (4) 模拟透明物体的效果；


    (5) 利用图形保真技术在显示设备有限的离散精度范围内尽量保持图形具有自然的光影过渡和连续性。'
