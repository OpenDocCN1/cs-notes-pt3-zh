- pgno: 93
  md: '# # 1.5.8 并行图形处理


    图形并行处理的发展首先表现在计算机体系结构上。 并行计算机体系结构大致分为六种：单指令多数据流（SIMD）；并行向量处理机（PVP）；对称多处理机（SMP）；大规模并行处理机（MPP）；工作站集群（COW）以及分布共享存储器（DSM）多处理机。
    SIMD计算机大都为专用，其余各种模型全为MIMD计算机。 近年来，包含工作站网络(NOW-Network of Workstation)或工作站集群（Workstation
