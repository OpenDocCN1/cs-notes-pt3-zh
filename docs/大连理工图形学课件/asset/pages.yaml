- pgno: 34
  md: '# 2) 图形支撑软件（一般是开发环境本身提供的）


    图形支撑软件由一组公用的图形函数(或子程序)所组成，它扩充了原有高级语言和操作系统的图形处理功能。给用户提供描述、控制、分析和计算图形的语句，适用于用户设计有关图形方面的应用程序。如Turbo
    C中的Graphics.h等。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 3) 专用的图形系统


    对于某一种类型的设备，可以配置专用的图形生成语言。如果要求简单，可以采用在多功能子程序包的基础上加命令语言的方式。如果需要配置一个具有综合功能的较为复杂的图形生成语言，又要求有较快的执行速度，则应开发或配置一个完整的编译系统。比起简单的命令语言，它具有更强的功能；比起子程序包，它的执行速度较快，效率更高。但它的系统开发工作量大，且移植性较差。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # 第 1 章 计算机图形学概述


    计算机图形学所涉及的算法是非常丰富的，围绕着生成和表示物体的图形图像的准确性、真实性与实时性，其算法大致可分为以下几类：


    (1) 基于图形设备的基本图形元素的生成算法，如用光栅扫描图形显示器生成直线、圆弧、二次曲线、封闭边界内的填充、填图案和反走样等（光栅图形算法）。


    (2) 基本图形元素的几何变换、投影变换、窗口裁剪等（图形变换）。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '(3) 自由曲线和曲面的插值、拟合、拼接、分解、过渡、光顺、整体或局部修改等（曲线、曲面生成）。


    (4) 图形元素(点、线、环、面、体)的求交与分类以及集合运算（图形元素的布尔运算）。


    (5) 隐藏线、面消除以及具有光照颜色效果的真实图形显示（真实感图形生成）。


    (6) 不同字体的点阵表示，矢量中、西文字符的生成及变换。'
  merge: -1
  img_proc: true
