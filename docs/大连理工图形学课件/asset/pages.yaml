- pgno: 14
  md: '# 2) 计算机图形系统的工作方式


    计算机图形系统的工作方式有被动式和交互式两种。


    被动式主要以绘图机、打印机作为输出设备，通过编制一个图形程序，让计算机执行程序时控制绘图机或打印机绘制图形，在生成图形过程中，无法进行操纵和控制，若要修改所生成的图形必须修改图形程序或数据。


    交互式图形系统则由设计人员(或用户)利用键盘、光笔、数字化仪、图形显示器等交互设备的有关功能，控制和操纵模型的建立和图形的生成过程。'
  merge: -1
  img_proc: true
- pgno: 15
