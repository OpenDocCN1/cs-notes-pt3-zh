  md: '# 3. 科学计算可视化(ViSC-Visualization in Scientific Computing)


    计算机图形学应用的一个典型例子是科学计算的可视化，当然，科学计算可视化是计算机图形学的一个分支，也是当前计算机图形学的研究热点之一。传统的科学计算的结果是数据流，这种数据流不易理解也不易于检查其中的对错。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# # 第 1 章 计算机图形学概述


    科学计算的可视化可以对空间数据场构造中间几何图素或用体绘制技术在屏幕上产生可见图像。 近年来这种技术已用于有限元分析的后处理、 分子模型构造、地震数据处理、
    大气科学及生物化学等领域。 在测量数据的图形处理中,利用计算机制图精度高、速度快,用来绘制地形图、 矿藏图、 海洋图、 天气预报图、人口密度分布图等。 地理信息的绘制也是利用数据绘图的实例,它们用于显示不同的地理区域或者全球的数据统计信息。'
  merge: -1
  img_proc: true
