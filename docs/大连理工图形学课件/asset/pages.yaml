- pgno: 146
  md: '# ## 2.3.1 椭圆的扫描转换


    中点画圆法可以推广到一般二次曲线的生成，下面以中心在原点的标准椭圆的扫描转换为例说明。设椭圆的方程为


    ```

    F(x,y)=b^2x^2+a^2y^2-a^2b^2=0

    ```


    其中，\(a\)为沿\(x\)轴方向的长半轴长度，\(b\)为\(y\)轴方向的短半轴长度，\(a\)、\(b\)均为整数。不失一般性，我们只讨论第一象限椭圆弧的生成。需要注意的是，在处理这段椭圆时，必须以弧上斜率为-1的点(即法向量两个分量相等的点)作为分界把它分为上部分和下部分，如图2.6所示。'
  merge: -1
  img_proc: true
- pgno: 147
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # 第 2 章 基本图形生成算法（I）


    该椭圆上一点\((x, y)\)处的法向量为


    \(N(x, y) = \frac{\partial F}{\partial x} \boldsymbol{i} + \frac{\partial F}{\partial
    y} \boldsymbol{j} = 2b^2 x \boldsymbol{i} + 2a^2 y \boldsymbol{j}\)'
  merge: -1
  img_proc: true
- pgno: 149
  md: '其中，i和j分别为沿x轴和y轴方向的单位向量。 从图2.6可看出，在上部分，法向量的y分量更大，而在下部分，法向量的x分量更大，因而，在上部分若当前最佳逼近理想椭圆弧的像素(xp,yp)满足下列不等式


    b²(xp+1)<a²(yp-0.5)


    而确定的下一个像素不满足上述不等式，则表明椭圆弧从上部分转入下部分。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '在上部分，假设横坐标为 \(x_p\) 的像素中与椭圆弧更接近点是 \((x_p, y_p)\)，那么下一对候选像素的中点是 \((x_p+1, y_p-0.5)\)。因此判别式为


    \(d_1 = F(x_p+1, y_p-0.5) = b^2(x_p+1)^2 + a^2(y_p-0.5)^2 - a^2b^2\)


    若 \(d_1 < 0\)，中点在椭圆内，则应取正右方像素，且判别式应更新为


    \(d''_1 = F(x_p+2, y_p-0.5) = b^2(x_p+2)^2 + a^2(y_p-0.5)^2 - a^2b^2\)

    \(= d_1 + b^2(2x_p+3)\)'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # 第 2 章 基本图形生成算法（Ⅰ）


    当\(d_1 \geq 0\)，中点在椭圆之外，这时应取右下方像素，并且更新判别式为


    \(d''_1 = F(x_p + 2, y_p - 1.5) = b^2(x_p + 2)^2 + a^2(y_p - 1.5)^2 - a^2b^2\)

    \(= d_1 + b^2(2x_p + 3) + a^2(-2y_p + 2)\)


    由于弧起点为\((0, b)\)，因此，第一中点是\((1, b - 0.5)\)，对应的判别式是


    \(d_{10} = F(1, b - 0.5) = b^2 + a^2(b - 0.5)^2 - a^2b^2\)

    \(= b^2 + a^2(-b + 0.25)\)'
