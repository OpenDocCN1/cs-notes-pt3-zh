- pgno: 233
  md: '根据图案和透明度属性来填充平面区域的基本思想是：


    +   首先用模板定义各种图案。


    +   然后，修改填充的扫描转换算法：在确定了区域内一像素之后，不是马上往该像素填色而是先查询模板位图的对应位置。若是以透明方式填充图案，则当模板位图的对应位置为1时，用前景色写像素，否则，不改变该像素的值。若是以不透明方式填充图案，则视模板位图对应位置为1或0来决定是用前景色还是背景色去写像素。'
