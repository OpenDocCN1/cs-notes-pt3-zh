- pgno: 73
  md: '# # 第 1 章 计算机图形学概述


    其目的是对于空间的各种物体和自然景物，利用计算机图形生成技术产生就像拍出的照片一样的真实感效果图。为了产生图形的真实感，一般需要解决以下几方面的图形综合技术问题：


    +   (1) 利用消隐技术在图形中消除在特定观察点看不见的物体或部分物体，从而产生空间物体的层次感；


    +   (2) 利用纹理映射技术在物体表面生成各种各样的纹理，以增强物体的质感；'
  merge: -1
  img_proc: true
