  md: '# 改进的有效的边表算法——算法步骤


    +   (1)初始化: 构造边表, AET表置空;

    +   (2)将第一个不空的ET表中的边与AET表合并;

    +   (3)由AET表中取出交点对进行填充。填充之后删除

    +   y=ymax的边;

    +   (4)yi+1=yi+1,根据xi+1=xi+1/k计算并修改AET表, 同时合并并ET表中y=yi+1桶中的边, 按次序插入到AET表中, 形成新的AET表;

    +   (5)AET表不为空则转(3), 否则结束。'
