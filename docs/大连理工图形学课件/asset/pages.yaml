- pgno: 121
  md: '# ## 3)整数 Bresenham算法


    +   - 上述 Bresenham算法在计算直线斜率和误差项时要用到浮点运算和除法，采用整数算术运算和避免除法可以加快算法的速度。


    +   - 由于上述 Bresenham算法中只用到误差项（初值 Error =Δ y/Δx-0.5）的符号


    +   - 因此只需作如下的简单变换：NError = 2*Error*Δx


    +   - 即可得到整数算法，这使本算法便于硬件（固件）实现'
