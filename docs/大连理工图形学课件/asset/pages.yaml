- pgno: 512
  md: '# # Liang-Barsky算法


    # ## 直线的参数方程


    \(x = x_1 + u \cdot (x_2 - x_1)\)

    \(y = y_1 + u \cdot (y_2 - y_1)\)


    \(0 \leq u \leq 1\)


    # ## 对于直线上一点 \((x, y)\)，若它在窗口内则有


    \(wxl \leq x_1 + u \cdot (x_2 - x_1) \leq wxr\)

    \(wxb \leq y_1 + u \cdot (y_2 - y_1) \leq wyt\)'
  merge: -1
  img_proc: true
- pgno: 513
  md: '\( u \cdot (x_1 - x_2) \leq x_1 - wxl \)

    \( u \cdot (x_2 - x_1) \leq wxr - x_1 \)

    \( u \cdot (y_1 - y_2) \leq y_1 - wyb \)

    \( u \cdot (y_2 - y_1) \leq wyt - y_1 \)


    \( p_1 = -(x_2 - x_1) \qquad q_1 = x_1 - wxl \)

    \( p_2 = x_2 - x_1 \qquad q_2 = wxr - x_1 \)

    \( p_3 = -(y_2 - y_1) \qquad q_3 = y_1 - wyb \)

    \( p_4 = y_2 - y_1 \qquad q_4 = wyt - y_1 \)


    令


    则有 \( u \cdot p_k \leq q_k \)'
  merge: -1
  img_proc: true
- pgno: 514
  md: '任何平行于剪切边界之一的直线\(p_k=0\)，其中\(k\)对应于该剪切边界（\(k=1,2,3,4\)对应于左、右、下、上边界）。如果还满足\(q_k<0\)，则线段完全在边界之外，因此舍弃该线段。如果\(q_k
    \geq 0\)，则线段位于边界之内。


    当\(p_k<0\)，线段从剪切边界延长线的外部延长到内部。当\(p_k>0\)，线段从剪切边界延长线的内部延长到外部。当\(p_k \neq 0\)，可以计算出线段与边界\(k\)的延长线的交点的\(u\)值：


    \(u = \frac{q_k}{p_k}\)'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# Liang-Barsky 算法


    由 $u \cdot p_k \leq q_k$


    $\left\{\begin{aligned}

    \frac{q_k}{p_k}\;(p_k<0)\leq u\leq\frac{q_k}{p_k}\;(p_k>0)\quad k=1,2\\

    \frac{q_k}{p_k}\;(p_k<0)\leq u\leq\frac{q_k}{p_k}\;(p_k>0)\quad k=3,4\\

    0\leq u\leq 1

    \end{aligned}\right.$'
  merge: -1
  img_proc: true
