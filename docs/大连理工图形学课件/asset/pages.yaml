- pgno: 240
  md: '# # 反走样——过取样 (super sampling)


    +   过取样：在高于显示分辨率的较高分辨率下用点取样方法计算，然后对几个象素的属性进行平均得到较低分辨率下的象素属性。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 简单过取样


    在x，y方向把分辨率都提高一倍，使每个象素对应4个子象素，然后扫描转换求得各子象素的颜色亮度，再对4个象素的颜色亮度进行平均，得到较低分辨率下的象素颜色亮度。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_241_0.png)


    图3.35 简单的过取样方式'
  merge: -1
  img_proc: true
- pgno: 242
  md: '□ 重叠过取样：为了得到更好的效果，在对一个像素点进行着色处理时，不仅仅仅只对其本身的子像素进行采样，同时对其周围的多个像素的子像素进行采样，来计算该点的颜色属性。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 基于加权模板的过取样：前面在确定像素的亮度时，仅仅是对所有子像素的亮度进行简单的平均。更常见的做法是给接近像素中心的子像素赋予较大的权值，即对所有子像素的亮度进行加权平均。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_243_0.png)


