  md: '# 2) Bresenham算法的实施 —— Rogers 版


    +   通过 (0,0)的所求直线的斜率大于 0.5， 它与x=1直线的交点离 y=1直线较近， 离 y=0直线较远， 因此取光栅点 (1,1)比 (1,0)更逼近直线；


    +   如果 斜率 小于 0.5， 则反之；


    +   当 斜率 等于 0.5， 没有确定的选择标准， 但本算法选择 (1,1)。


