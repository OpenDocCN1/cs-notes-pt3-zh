- pgno: 443
  md: '# 基本几何变换——平移变换


    平移是指将p点沿直线路径从一个坐标位置移到另一个坐标位置的重定位过程。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_443_0.png)


    图6-1 平移变换'
  merge: -1
