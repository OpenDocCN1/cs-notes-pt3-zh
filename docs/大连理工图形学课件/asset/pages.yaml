  md: '# 区域填充算法——边界填充算法


    □ 扫描线种子填充算法:

    扫描线通过在任意不间断扫描线区间中只取一个种子像素的方法使堆栈的尺寸极小化。不间断区间是指在一条扫描线上的一个组相邻像素。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_368_0.png)'
