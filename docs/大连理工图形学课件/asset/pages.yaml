- pgno: 271
  md: '# # 2.1.1 DDA算法算法


    # ## 1)David F. Rogers 描述描述


    直线的基本微分方程是：


    \(\frac{dy}{dx} = \text{常数 (k)}\)


    设直线通过点 P1(x1,y1)和P2(x2,y2)，则直线方程可表示为：


    \(\frac{\Delta y}{\Delta x} = \frac{y_2 - y_1}{x_2 - x_1} = k\)


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_271_0.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: "# # 1)David F. Rogers 描述描述\n\n+   - 如果已知第 i点的坐标， 可用步长 StepX 和 StepY得到 第 i+1点的坐标为：\
    \  \n+     - xi+1=xi+ StepX  \n+     - yi+1=yi+ StepY 或 yi+1=yi+ k * StepX\n\n\
    +   - 例图中  \n+     - k<1  \n+     - StepX=1  \n+     - StepY=k\n\n+   - 将算得的直线上每个点\
    \ 的当前坐标， 按四舍五 入得到光栅点的位置\n\n![](img/5541ff2dee1295469371f6f6fbf4c05f_272_0.png)"
  merge: -1
  img_proc: true
