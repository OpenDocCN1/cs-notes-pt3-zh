  md: '# # 相关概念——内外测试


    # ## □ 奇-偶规则（Odd-even Rule）


    从任意位置p作一条射线，若与该射线相交的多边形边的数目为奇数，则p是多边形内部点，否则是外部点。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_209_0.png)'
  merge: -1
