    种子象素入栈；当栈非空时重复执行如下三步操作：


    +   (a)栈顶象素出栈；


    +   (b)将出栈象素置成填充色；


    +   (c)检查出栈象素的8-邻接点，若其中某个像素点不是边界色且未置成多边形色，则把该像素入栈。'
