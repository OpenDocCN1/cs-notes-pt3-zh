- pgno: 444
  md: '# 基本几何变换——平移变换


    推导：


    $x'' = x + T_x$


    $y'' = y + T_y$


    矩阵形式：


    $[x''\quad y''] = [x\quad y] + [T_x\quad T_y]$


    $T_x$，$T_y$称为平移矢量。'
  merge: -1
  img_proc: true
