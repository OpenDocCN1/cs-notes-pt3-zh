- pgno: 1
  md: '# # 1.1 计算机图形学及其研究内容


    # ## 1.1.1 计算机图形学


    计算机图形学(Computer Graphics)是20世纪60年代以来发展迅速、 应用广泛的综合性学科。 世界各国的专家学者对计算机图形学有着各自的定义。
    德国的Wolfgang K Giloi给出的定义是: 计算机图形学由数据结构、 图形算法和语言构成。'
  merge: -1
  img_proc: true
