  md: '# # 1) Bresenham的基本原理


    +   - 如果直线的（起）端点在整数点上，误差项 d 的初值：d0=0


    +   - x坐标每增加 1，d的值相应递增直线的斜率值 k，即：d=d+k


    +   - 一旦 d≥1，就把它减去 1，保证 d的相对性，且在 0-1之间。


