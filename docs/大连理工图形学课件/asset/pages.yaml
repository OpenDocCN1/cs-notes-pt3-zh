- pgno: 174
  md: '# # 改进的有致边表算法——构造边表


    +   首先构造一个纵向链表，链表的长度为多边形所占有的最大扫描线数，链表的每个结点，称为一个桶，则对应多边形覆盖的每一条扫描线。


    +   将每条边的信息链入与该边最小y坐标（\( y_{min} \)）相对应的桶处。也就是说，若某边的较低端点为\( y_{min} \)，则该边就放在相应的扫描线桶中。'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# # 改进的有效边表算法——构造边表\n\n+   - 每条边的数据形成一个结点，内容包括：该扫描线与该边的初始交点x（即较低端点的x值），1/k，以及该边的最大y值ymax。\n\
    +   \n+     x|ymin   Ymax   1/k   NEXT\n\n+   - 同一桶中若干条边按X|ymin由小到大排序，若X|ymin相等，则按照1/k由小到大排序。"
