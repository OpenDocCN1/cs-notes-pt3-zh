    x = xs; //首点\ny = ys;\ni = 1; // Begin main loop\nwhile (i≤ Length)\n    WritePixel\
    \ (Round(x), Round(y) ,value));\n    x = x + StepX;\n    y = y + StepY;\n    i++;\n\
