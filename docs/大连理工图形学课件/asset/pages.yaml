- pgno: 18
  md: '# 第1章 计算机图形学概述


    要在计算机屏幕上生成三维物体的一幅图像，首先必须在计算机中建立该物体的模型。构造这一模型的技术称为造型技术，包括形体的表示、构造及运算。最常用的是几何造型，即由一批几何数据及数据之间的关系来表示所要显示的形体，一般是规则形体。几何造型的可靠性及覆盖面是研究工作的重点。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_18_0.png)'
  merge: -1
  img_proc: true
