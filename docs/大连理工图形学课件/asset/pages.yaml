- pgno: 8
  md: '# 2) 参数法


    参数法用图形的形状参数和属性参数来表示图形。形状参数指的是描述图形的方程或分析表达式的系数、线段和多边形的端点坐标等。 属性参数则包括颜色、线型等。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 4. 计算机图形系统的概念


    # 1) 计算机图形系统的组成


    计算机图形系统是为了支持图形应用程序便于实现图形的输入、处理、输出而设计的计算机硬件和软件的组合体。没有绘图系统的支持，就会使图形应用程序的编写极为困难，计算机图形学潜在的用途也难以开发。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # 第 1 章 计算机图形学概述


    计算机图形系统由硬件和软件两部分组成。计算机图形系统的基本物理设备统称为硬件，它包括主机及大容量外存储器、显示处理器、图形输出和图形输入设备。其中图形显示器、打印机、绘图机、键盘、数字化仪和光笔等供系统配置时由用户选用。'
  merge: -1
