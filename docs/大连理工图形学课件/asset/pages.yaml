  md: '# 11. 用户界面(User Interface)


    介于用户与计算机之间, 完成人与计算机通信工作的部件称人机界面(HCI-Human Computer Interface), 它由软件部分和硬件部分组成。
    随着计算机技术以及图形学技术的发展, 人机界面从最原始的由指示灯和机械开关组成的操纵板界面, 过渡到由终端和键盘组成的字符界面, 并发展到现在基于多种输入设备和光栅图形显示设备的图形用户界面
    (GUI-Graphical User Interface)。 典型的图形用户界面包含一个窗口管理程序、 菜单显示和图符等。'
