  md: '# # 1.5 计算机图形学当前的研究动态


    # ## 1.5.1 真实感图形显示


    从20世纪80年代初开始，真实感图形生成与显示技术一直是计算机图形学研究的前沿领域，而且发展很快。真实感图形是一种光栅图形。


    真实感图形生成(Realistic Graphics Generation)是在计算机图形系统中生成具有**色彩**、**纹理**、**阴影**、**层次**等真实感的三维空间物体图形的技术。
    它还可以称作真实感图形综合。


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_72_0.png)


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_72_1.png)'
