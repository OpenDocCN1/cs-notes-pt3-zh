- pgno: 519
  md: '# 算法步骤:


    (1)输入直线段的两端点坐标: (x₁,y₁)和(x₂,y₂), 以及窗口的四条边界坐标: wyt, wyb, wxl和wxr。


    (2)若Δx=0, 则p₁=p₂=0。此时进一步判断是否满足q₁<0或q₂<0, 若满足, 则该直线段不在窗口内, 算法转(7)。否则, 满足q₁>0且q₂>0,
    则进一步计算u₁和u₂。算法转(5)。


    (3)若Δy=0, 则p₃=p₄=0。此时进一步判断是否满足q₃<0或q₄<0, 若满足, 则该直线段不在窗口内, 算法转(7)。否则, 满足q₁>0且q₂>0,
    则进一步计算u₁和u₂。算法转(5)。


    (4)若上述两条均不满足, 则有pₖ≠0 (k=1,2,3,4)。此时计算u₁和u₂。


    (5)求得u₁和u₂后, 进行判断: 若u₁>u₂, 则直线段在窗口外, 算法转(7)。若u₁<u₂, 利用直线的参数方程求得直线段在窗口内的两端点坐标。


    (6)利用直线的扫描转换算法绘制在窗口内的直线段。算法结束。


    (7)算法结束。'
  merge: -1
