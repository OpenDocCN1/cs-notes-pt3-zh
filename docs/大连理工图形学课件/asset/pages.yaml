- pgno: 54
  md: '# 4. 计算机模拟与仿真(CS-Computer Simulation)


    “模拟” 是人类了解世界的手段, 也是人类创造世界的方式, 模拟技术化繁为简, 将梦想变为现实, 因而成为今日科学的基础, 明日科学的趋势。 计算机模拟与仿真是利用计算机模拟某个系统、
    某种效应和过程。 把某个物理现象经数值模拟而数字模型化, 再将该模型以图像的形式显示出来, 通过模型再来研究物理现象或系统, 这是进行系统分析和仿真的有效手段。
    图形显示在计算机模拟中有着重要作用。 （如: 战场模拟、飞行仿真）


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_54_0.png)


    ![](img/5541ff2dee1295469371f6f6fbf4c05f_54_1.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # 第 1 章 计算机图形学概述


    计算机仿真可以用于研制产品或设计系统的全过程中，包括方案论证、技术指标确定、设计分析、生产制造、试验测试、维护训练、故障处理等各个阶段。当前计算机仿真的六大挑战性课题，包括核聚变反应、宇宙起源、生物基因工程、结构材料、社会经济和作战模拟等。未来十年的计算机仿真研究将集中于大规模复杂系统的仿真。战争指挥就是一类复杂系统仿真。未来的计算机仿真的主要特点是超大规模、模糊化、智能化。图1.17给出了气象过程和F16飞行仿真的示例。'
