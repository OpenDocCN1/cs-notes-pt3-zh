- pgno: 164
  md: '# # X-扫描线算法——算法步骤


    +   1. 确定多边形所占有的最大扫描线数，得到多边形顶点的最小和最大y值（ymin和ymax）。

    +   2. 从y=ymin到y=ymax，每次用一条扫描线进行填充。

    +   3. 对一条扫描线填充的过程可分为四个步骤：

    +   求交; 排序; 交点配对; 区间填色。'
