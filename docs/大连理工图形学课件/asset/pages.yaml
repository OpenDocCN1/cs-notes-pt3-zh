  md: '+   1. 栈顶像素出栈;

    +   2. 沿扫描线对出栈像素的左右像素进行填充，直至遇到边界像素为止，也就是对包含出栈像素的整个区间进行填充;

    +   3. 上述区间内最左最右的像素分别记为 x_l 和 x_r;

    +   4. 在区间 [ x_l , x_r ] 中检查与当前扫描线相邻的上下两条扫描线的有关像素是否全为边界线或已填充的像素，若存在非边界、非填充的像素，则把每一区间的最后像素入栈。'
