- pgno: 158
  md: '# # 关系完整性


    +   - 关系模型的完整性规则是对关系的某种约束条件。


    +   - 关系模型中三类完整性约束：

    +     - 实体完整性

    +     - 参照完整性

    +     - 用户定义的完整性


    +   - 实体完整性和参照完整性是关系模型必须满足的完整性约束条件，被称作是关系的两个不变性，应该由关系系统自动支持。'
