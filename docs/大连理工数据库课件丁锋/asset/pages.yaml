- pgno: 538
  md: "# 设计用户子模式\n\n# • 使用更符合用户习惯的别名\n\n+   ¤ 合并各分E-R图曾做了消除命名冲突的工作，以使数据库系统中同一关系和属性具有唯一的名字。这在设计数据库整体结构时是非常必要的。但对于某些局部应用，由于改用了不符合用户习惯的属性名，可能会使他们感到不方便，因此在设计用户的子模式时可以重新定义某些属性名，使其与用户习惯一致。\n\
    +   \n+   ¤ 当然，为了应用的规范化，我们也不应该一味地迁就用户。\n+   \n+   ¤ 例：负责学籍管理的用户习惯于称教师模式的职工号为教师编号。因此可以定义视图，在视图中职工号重定义为教师编号"
  merge: -1
