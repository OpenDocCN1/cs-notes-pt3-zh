- pgno: 107
  md: '# # 数据库系统的模式结构


    +   - 外模式 / 模式映像

    +       - 定义外模式与模式之间的对应关系

    +       - 每一个外模式都对应一个外模式 / 模式映像

    +       - 映像定义通常包含在各自外模式的描述中


    +   - 外模式 / 模式映象的用途

    +       - 保证数据的逻辑独立性

    +       - 当模式改变时，数据库管理员修改有关的外模式 / 模式映象，使外模式保持不变

    +       - 应用程序是依据数据的外模式编写的，从而应用程序不必修改，保证了数据与程序的逻辑独立性，简称数据的逻辑独立性。'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# # 数据库系统的模式结构\n\n+   - 模式 / 内模式映像  \n+     定义了数据全局逻辑结构与存储结构之间的对应关系。  \n+ \
    \    例如，说明逻辑记录和字段在内部是如何表示的。  \n+     - 数据库中模式 / 内模式映象是唯一的  \n+     - 该映象定义通常包含在模式描述中\n\
    \n+   - 模式 / 内模式映象的用途  \n+     - 保证数据的**物理独立性**  \n+     - 当数据库的存储结构改变了（例如选用了另一种存储结构），数据库管理员修改模式\
    \ / 内模式映象，使模式保持不变  \n+     - 应用程序不受影响。保证了数据与程序的物理独立性，简称数据的物理独立性。"
  merge: -1
  img_proc: true
