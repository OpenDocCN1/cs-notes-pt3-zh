- pgno: 370
  md: '# 视图


    # 基本含义


    视图是从一个或几个基本表（或视图）导出的表。


    # 视图的特点


    +   □ 虚表，是从一个或几个基本表（或视图）导出的表


    +   □ 只存放视图的定义，不会出现数据冗余


    +   □ 基表中的数据发生变化，从视图中查询出的数据也随之改变'
  merge: -1
  img_proc: true
- pgno: 371
  md: "# # 视图\n\n+   - 创建视图\n\n```\nCREATE VIEW view_name[column1[, column2]...]\n\
    AS query\n[WITH CHECK OPTION]\n```\n\n+   - DBMS执行CREATE VIEW语句时只是把视图的定义存入数据字典，并不执行其中的SELECT语句。在对视图查询时，按视图的定义从基本表中将数据查出。\n\
    \n+   - 组成视图的属性列名可以全部省略或全部指定  \n+     - 省略：由子查询中SELECT目标列中的诸字段组成  \n+     - 明确指定视图的所有列名：\
    \  \n+       - 某个目标列是集函数或列表达式  \n+       - 目标列为 *  \n+       - 多表连接时选出了几个同名列作为视图的字段\
    \  \n+       - 需要在视图中为某个列启用新的更合适的名字"
  merge: -1
  img_proc: true
- pgno: 372
