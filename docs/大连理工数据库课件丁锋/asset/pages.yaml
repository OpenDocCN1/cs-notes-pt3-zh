- pgno: 483
  md: '# 视图的集成


    +   - **属性冲突**

    +     - **属性域冲突**：属性值的类型、取值范围或取值集合不同。

    +       - 例1，由于学号是数字，因此某些部门（即局部应用）将学号定义为整数形式，而由于学号不用参与运算，因此另一些部门（即局部应用）将学号定义为字符型形式。

    +       - 例2，某些部门（即局部应用）以出生日期形式表示学生的年龄，而另一些部门（即局部应用）用整数形式表示学生的年龄。

    +     - **属性取值单位冲突**

    +       - 例：学生的身高，有的以米为单位，有的以厘米为单位，有的以尺为单位。


    +   - **属性冲突的解决方法**：通常用讨论、协商等行政手段加以解决'
  merge: -1
  img_proc: true
- pgno: 484
  md: "# # 视图的集成\n\n+   ## 两类命名冲突\n+   - 同名异义：不同意义的对象在不同的局部应用中具有相同的名字  \n+     - 例，局部应用A中将教室称为房间；局部应用B中将学生宿舍称为房间\
    \  \n+   - 异名同义（一义多名）：同一意义的对象在不同的局部应用中具有不同的名字  \n+     - 例，有的部门把教科书称为课本；有的部门则把教科书称为教材\
    \  \n+   - 命名冲突可能发生在属性级、实体级、联系级上。其中属性的命名冲突更为常见。\n\n+   ## 命名冲突的解决方法：通过讨论、协商等行政手段加以解决"
  merge: -1
  img_proc: true
- pgno: 485
  md: "# # 视图的集成\n\n+   ## 结构冲突\n+   \n+   ### 同一对象在不同应用中具有不同的抽象\n+   \n+   - 例，“课程”在某一局部应用中被当作实体，在另一局部应用中则被当作属性\n\
    +   - 解决方法：通常是把属性变换为实体或把实体变换为属性，使同一对象具有相同的抽象。变换时要遵循两个准则。\n+   \n+   ### 一实体在不同局部视图中所包含的属性不完全相同，或者属性的排列次序不完全相同。\n\
    +   \n+   - 产生原因：不同的局部应用关心的是该实体的不同侧面。\n+   - 解决方法：使该实体的属性取各分E-R图中属性的并集，再适当设计属性的次序。"
  merge: -1
  img_proc: true
