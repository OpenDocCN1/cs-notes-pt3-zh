- pgno: 98
  md: '# # 数据库系统的模式结构


    +   • 概念层


    +   ✖ 公共逻辑层，逻辑层


    +   ✖ 概念视图是整个数据库内容的视图，表示数据库的全部信息内容，其形式比数据的物理存储方式要抽象些。通常，它与任何特定用户观察数据的方式都不同。广义上讲，概念视图更接近实际数据。


    +   ✖ 概念视图由**概念模式（Conceptual schema）**定义。概念模式包括各种概念记录型的定义。


    +   ✖ 目前，大多数系统支持的“概念模式”实际上只是把单个的外模式合并起来，再加上一些安全性约束和完整性约束。但是将来的系统很可能提供更加复杂的概念模式。'
  merge: -1
  img_proc: true
