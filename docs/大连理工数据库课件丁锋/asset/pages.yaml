- pgno: 334
  md: '# 连接查询


    +   • 外连接


    +   □ 外连接与普通连接的区别


    +   • 普通连接操作只输出满足连接条件的元组


    +   • 外连接操作以指定表为连接主体，将主体表中不满足连接条件的元组一并输出


    例: 查询每个学生及其选修课程的情况，即使学生一门课也没有选也要输出学生信息。


    ```

    ```sql

    SELECT Student.Sno,Sname,Ssex,Sage,Sdept,Cno,Grade

    FROM Student LEFT JOIN SC

    ON Student.Sno = SC.Sno;

    ```

    ```'
  merge: -1
  img_proc: true
