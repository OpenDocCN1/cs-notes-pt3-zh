- pgno: 197
  md: '# # 关系代数


    +   • 专门的关系运算-连接

    +   从两个关系的笛卡儿积中选取属性间满足一定条件的元组的操作。

    +   ❖ 常用的连接

    +   θ 连接:r ⋈θs = σ θ(r × s)

    +   θ为一个条件

    +   R ⋈ S = { t̂r ts | tr ∈ R ∧ ts ∈ S ∧ tr[A]θts[B] }

    +   ❖ 等值连接

    +   当θ条件为 ‘=’时的θ连接为等值连接。

    +   ❖ 自然连接

    +   在等值连接中，如果相比较的分量是相同的属性组，并且在结果中去掉了重复的属性列，则称为自然连接。'
  merge: -1
  img_proc: true
- pgno: 198
  md: "# # 关系代数\n\n+   专门的关系运算-连接  \n+   二元运算自然连接可以将某些选择运算和笛卡儿积运算合并为一个运算，用“连接”符号⋈来表示：即r\
    \ ⋈ s  \n+   自然连接运算首先形成它的两个参数的笛卡儿积；  \n+   然后在笛卡儿积的结果上，基于两个参数的关系模式中都出现的属性进行属性相等的选择运算；\
    \  \n+   最后还要去除重复属性，即结果的关系模式中相同的属性在连接结果中只保留一个。"
  merge: -1
  img_proc: true
