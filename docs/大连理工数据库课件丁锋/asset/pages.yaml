- pgno: 163
  md: '# 关系的完整性


    +   - 参照完整性

    +     - 外码（Foreign Key）：

    +       设 $F$ 是基本关系 $R$ 的一个或一组属性，但不是关系 $R$ 的码。若 $F$ 与基本关系 $S$ 的主码 $K_S$ 相对应，则称
    $F$ 是基本关系 $R$ 的**外码**。基本关系 $R$ 为**参照关系**，$S$ 为**被参照关系**或**目标关系**。

    +     - 参照关系和被参照关系不一定是不同的关系'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # 关系的完整性


    # ## 参照完整性


    规则：

    若属性（或属性组）\( F \) 是基本关系\( R \) 的外码，

    它与基本关系\( S \) 的主码\( K_s \) 相对应，则对于\( R \) 中

    的每个元组在\( F \) 上的值必须是：


    +   1. 或者取空值（\( F \) 的每个属性均为空）；


    +   2. 或者等于\( S \) 中某个元组的主码值。'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# # 关系的完整性\n\n+   - 参照完整性  \n+     例：学生关系中每个元组的“专业号”属性只能下面两类值：\n\n+   1. 空值：该学生未分配专业\n\
    \n+   2. 非空值：该值必须是专业关系中某个元组的“专业号”值，表示该学生分配到一个存在的专业中。"
  merge: -1
  img_proc: true
- pgno: 166
  md: '# # 关系的完整性


    +   - 用户定义的完整性（User-defined Integrity）实体完整性和参照完整性是任何关系数据库系统都必须支持的。称为关系的两个不变性。


    另外，不同的关系数据库根据应用的具体情况，往往需要一些特殊的约束条件。用户定义完整性即是指的这种约束条件。


    比如某些属性间必须满足函数关系，某个属性的取值范围限定等。'
  merge: -1
  img_proc: true
