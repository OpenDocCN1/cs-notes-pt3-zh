- pgno: 134
  md: '# 小结


    +   - **内模式**

    +     - 依赖于全局逻辑结构，但独立于数据库的用户视图，即外模式，也独立于具体的存储设备。

    +     - 它将全局逻辑结构中所定义的数据结构及其联系按照一定的物理存储策略进行组织，以达到较好的时间与空间效率。'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# # 小结\n\n+   - 外模式\n+   \n+     - 面向具体的应用程序，定义在逻辑模式之上，但独立于存储模式和存储设备\n+   \n\
    +     - 设计外模式时应充分考虑到应用的扩充性。当应用需求发生较大变化，相应外模式不能满足其视图要求时，该外模式就得做相应改动\n+   \n+  \
    \   - 应用程序在外模式是描述的数据结构上编制的，它依赖于特定的外模式，与数据库的模式和存储结构独立。\n+   \n+     - 不同的应用程序有时可以共用同一个外模式。"
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # 小结


