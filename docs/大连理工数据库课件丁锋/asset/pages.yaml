- pgno: 44
  md: "# 概念模型\n\n+   - 一对一联系  \n+   如果对于实体集A中的每一个实体，实体集B中至多有一个实体与之联系，反之亦然，则称实体集A与实体集B具有一对一联系。记为1:1。\n\
    \n+   - 实例：  \n+   班级与班长之间的联系：  \n+     - 一个班级只有一个正班长  \n+     - 一个班长只在一个班中任职"
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 概念模型


    +   - **一对多联系**

    +     如果对于实体集A中的每一个实体，实体集B中有n个实体（n≥0）与之联系，反之，对于实体集B中的每一个实体，实体集A中至多只有一个实体与之联系，则称实体集A与实体集B有一对多联系，记为1:n


    +   - **实例：**

    +     班级与学生之间的联系：

    +     - 一个班级中有若干名学生，

    +     - 每个学生只在一个班级中学习'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # 概念模型


    +   • 多对多联系 (m:n)


    如果对于实体集A中的每一个实体，实体集B中有n个实体 (n≥0) 与之联系，反之，对于实体集B中的每一个实体，实体集A中有m个实体 (m≥0) 与之联系，则称实体集A与实体集B具有多对多联系，记为m:n


    +   • 实例


    课程与学生之间的联系：


    +   α 一门课程同时有若干个学生选修


    +   α 一个学生可以同时选修多门课程'
  merge: -1
  img_proc: true
- pgno: 47
  md: "# # 概念模型\n\n+   多个实体型间的一对多联系  \n+   若实体集E1， E2， ...， En存在联系，对于实体集Ei（j=1， 2，\
    \ ...， i-1， i+1， ...， n）中的给定实体，最多只和Ei中的一个实体相联系，则我们说Ei与E1， E2， ...， E<sub>i-1</sub>，\
    \ E<sub>i+1</sub>， ...， En之间的联系是一对多的。\n\n+   实例：  \n+   课程、教师与参考书三个实体型，如果一门课程可以有若干个教师讲授，使用若干本参考书，每一个教师只讲授一门课程，每一本参考书只供一门课程使用，课程与教师、参考书之间的联系是一对多的\n\
    \n+   多个实体型间的一对一联系  \n+   多个实体型间的多对多联系\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_47_0.png)"
  merge: -1
  img_proc: true
