  md: "# # 连接查询\n\n+   - 非等值连接  \n+     连接运算符 不是 = 的连接操作\n\n[<表名1>.]<列名1> <比较运算符>\
    \ [<表名2>.]<列名2>\n\n比较运算符： >、 <、 >=、 <=、 !=\n\n[<表名1>.]<列名1> BETWEEN [<表名2>.]<列名2>\
    \  \nAND [<表名2>.]<列名3>"
  merge: -1
  img_proc: true
