- pgno: 258
  md: '# # 范式示例


    +   - （仓库ID，配件ID)和(管理员ID，配件ID)都是StorehouseManage的候选码，表中唯一的非主属性为数量(QNT)，它是符合第三范式的。


    +   - 当前模式的疑惑：

    +     - 当仓库被清空后，所有“配件ID”和“数量”信息被删除的同时，“仓库ID”和“管理员ID”信息也被删除了。

    +     - 当仓库没有存储任何物品时，无法给仓库分配管理员。

    +     - 如果仓库换了管理员，则表中所有行的管理员ID都要修改。'
