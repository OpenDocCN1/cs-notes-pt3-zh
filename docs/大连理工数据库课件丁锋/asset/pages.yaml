- pgno: 715
  md: '# # 封锁粒度


    +   - X锁和S锁都是加在某一个数据对象上的

    +   - 封锁的对象:逻辑单元，物理单元


    例：在关系数据库中，封锁对象：


    +   - 逻辑单元：属性值、属性值集合、元组、关系、索引项、整个索引、整个数据库等

    +   - 物理单元：页（数据页或索引页）、物理记录等'
  merge: -1
  img_proc: true
- pgno: 716
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 717
  md: '# 封锁粒度


    +   - 一般来说

    +     - 封锁的粒度越大，越小，

    +     - 系统被封锁的对象少，多，

    +     - 并发度小，高，

    +     - 系统开销小，大，


    +   - 选择封锁粒度的原则：

    +     - 考虑封锁机构和并发度两个因素

    +     - 对系统开销与并发度进行权衡


    +   - 需要处理多个关系的大量元组的用户事务：以数据库为封锁单位；

    +   - 需要处理大量元组的用户事务：以关系为封锁单位；

    +   - 只处理少量元组的用户事务：以元组为封锁单位'
  merge: -1
  img_proc: true
