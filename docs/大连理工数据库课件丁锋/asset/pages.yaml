- pgno: 9
  md: '# # 为什么要学数据库系统


    +   - 数据库技术是以数据建模和DBMS核心技术为主，内容丰富的一门学科。


    +   - 数据库技术是计算机科学技术中发展最快的领域之一，也是应用最广的技术之一。


    +   - 数据库技术带动了一个巨大的软件产业——DBMS产品及其相关工具和解决方案。'
