- pgno: 527
  md: '# # 数据模型的优化


    +   - 数据库逻辑设计的结果不是唯一的。


    +   - 得到初步数据模型后，还应该适当地修改、调整数据模型的结构，以进一步提高数据库应用系统的性能，这就是数据模型的优化。


    +   - 关系数据模型的优化通常以规范化理论为指导。'
  merge: -1
  img_proc: true
- pgno: 528
  md: '# # 数据模型的优化


    # ## 优化数据模型的方法


    +   1. **确定数据依赖**。按需求分析阶段所得到的语义，分别写出每个关系模式内部各属性之间的数据依赖以及不同关系模式属性之间数据依赖。


    +   2. 对于各个关系模式之间的数据依赖**进行极小化处理**，消除冗余的联系。


    +   3. 按照数据依赖的理论对关系模式逐一进行分析，考查是否存在部分函数依赖、传递函数依赖、多值依赖等，**确定各关系模式分别属于第几范式**。


    +   4. 按照需求分析阶段得到的各种应用对数据处理的要求，分析对于这样的应用环境这些模式是否合适，**确定是否要对它们进行合并或分解**。


    +   5. 按照需求分析阶段得到的各种应用对数据处理的要求，对关系模式**进行必要的分解或合并**，以提高数据操作的效率和存储空间的利用率'
  merge: -1
  img_proc: true
