- pgno: 643
  md: '# 介质故障的恢复


    +   • 恢复步骤


    +   □ 1. 装入最新的后备数据库副本，使数据库恢复到最近一次传输时的一致性状态。


    • 对于静态传输的数据库副本，装入后数据库即处于一致性状态


    • 对于动态传输的数据库副本，还须同时装入传输时刻的日志文件副本，利用与恢复系统故障相同的方法（即 REDO+UNDO），才能将数据库恢复到一致性状态。'
  merge: -1
