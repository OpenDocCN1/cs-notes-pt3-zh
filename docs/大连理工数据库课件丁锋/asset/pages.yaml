- pgno: 701
  md: '# # 正确的并发调度


    +   - 什么样的并发操作调度是正确的


    +   - 如何保证并发操作的调度是正确的'
  merge: -1
  img_proc: true
- pgno: 702
  md: '# # 什么样的并发操作调度是正确的


    +   - 计算机系统对并行事务中并行操作的调度是随机的，而不同的调度可能会产生不同的结果。


    +   - 将所有事务串行起来的调度策略一定是正确的调度策略。


    +   x 如果一个事务运行过程中没有其他事务在同时运行，也就是说它没有受到其他事务的干扰，那么就可以认为该事务的运行结果是正常的或者预想的


    +   x 以不同的顺序串行执行事务也有可能会产生不同的结果，但由于不会将数据库置于不一致状态，所以都可以认为是正确的。


    +   x 几个事务的并行执行是正确的，当且仅当其结果与按某一次序串行地执行它们时的结果相同。这种并行调度策略称为可串行化（Serializable）的调度。'
  merge: -1
  img_proc: true
- pgno: 703
  md: '# # 什么样的并发操作调度是正确的


    +   - 可串行性是并行事务正确性的唯一准则


    +   - 例：现在有两个事务，分别包含下列操作：

    +     事务1：读B；A=B+1；写回A；

    +     事务2：读A；B=A+1；写回B；

    +     假设A的初值为2，B的初值为2。


    +   - 对这两个事务的不同调度策略

    +     - 串行执行

    +       - 串行调度策略1（S1）

    +       - 串行调度策略2（S2）

    +     - 交错执行

    +       - 不可串行化的调度（S3）

    +       - 可串行化的调度（S4）'
  merge: -1
  img_proc: true
- pgno: 704
  md: '# # 串行调度策略1（S1）


    # ## 串行调度策略，正确的调度


    | T₁ | T₂ |

    |---|---|

    | Slock B | |

    | Y=B=2 | |

    | Unlock B | |

    | Xlock A | |

    | A=Y+1 | |

    | 写回A(=3) | |

    | Unlock A | |

    | | Slock A |

    | | X=A=3 |

    | | Unlock A |

    | | Xlock B |

    | | B=X+1 |

    | | 写回B(=4) |

    | | Unlock B |'
  merge: -1
  img_proc: true
- pgno: 705
  md: '# # 串行调度策略2 (S2)


    • 串行调度策略，正确的调度


    | T1 | T2 |

    | --- | --- |

    | Slock B<br>Y=B=3<br>Unlock B<br>Xlock A<br>A=Y+1<br>写回A(=4)<br>Unlock A | Slock
    A<br>X=A=2<br>Unlock A<br>Xlock B<br>B=X+1<br>写回B(=3)<br>Unlock B |'
  merge: -1
  img_proc: true
- pgno: 706
  md: <!-- no content -->
  merge: -1
