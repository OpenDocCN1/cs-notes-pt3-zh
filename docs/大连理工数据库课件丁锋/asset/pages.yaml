- pgno: 423
  md: "# # 数据库各级模式的形成过程\n\n+   - 需求分析阶段  \n+     - 综合各个用户的应用需求\n\n+   - 概念设计阶段  \n\
    +     - 形成独立于机器特点，独立于各个DBMS产品的概念模式（E-R图）\n\n+   - 逻辑设计阶段  \n+     - 首先将E-R图转换成具体的数据库产品支持的数据模型，如关系模型，形成数据库逻辑模式\
    \  \n+     - 然后根据用户处理的要求、安全性的考虑，在基本表的基础上再建立必要的视图(View)，形成数据的外模式\n\n+   - 物理设计阶段\
    \  \n+     - 根据DBMS特点和处理的需要，进行物理存储安排，建立索引，形成数据库内模式"
  merge: -1
  img_proc: true
