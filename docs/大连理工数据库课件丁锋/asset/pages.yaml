    +     - DBMS实现视图更新的方法


    +       • 视图实体化法 （View Materialization）


    +       • 视图消解法 （View Resolution）


    +   - 指定WITH CHECK OPTION子句后

    +   DBMS在更新视图时会进行检查，防止用户通过视图对不属于视图范围内的基本表数据进行更新'
