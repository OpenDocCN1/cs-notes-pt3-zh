- pgno: 612
  md: '# 数据库恢复


    +   - 故障是不可避免的

    +     - 计算机硬件故障

    +     - 系统软件和应用软件的错误

    +     - 操作员的失误

    +     - 恶意的破坏

    +   - 故障的影响

    +     - 运行事务非正常中断

    +     - 破坏数据库'
  merge: -1
  img_proc: true
- pgno: 613
  md: "# # 数据库恢复\n\n+   - 数据库管理系统对故障的对策  \n+     - DBMS提供恢复子系统  \n+     - 保证故障发生后，能把数据库中的数据从错误状态恢复到某种逻辑一致的状态\
    \  \n+     - 保证事务ACID\n\n+   - 恢复技术是衡量系统优劣的重要指标"
  merge: -1
  img_proc: true
- pgno: 614
  md: '# 故障-事务故障


    +   - 事务故障


    某个事务在运行过程中由于种种原因未运行至正常终止点就夭折了


    +   - 事务故障的常见原因


    +   - 输入数据有误


    +   - 运算溢出


    +   - 违反了某些完整性限制


    +   - 某些应用程序出错


    +   - 并行事务发生死锁


    +   - ...'
  merge: -1
  img_proc: true
- pgno: 615
  md: '# 事务故障的恢复


    +   - 发生事务故障时，夭折的事务可能已把对数据库的部分修改写回磁盘


    +   - 事务故障的恢复：撤销事务（UNDO）


    +   - 强行回滚（ROLLBACK）该事务


    +   - 清除该事务对数据库的所有修改，使得这个事务象根本没有启动过一样'
  merge: -1
  img_proc: true
- pgno: 616
  md: '# # 故障-系统故障


    +   - 系统故障


    +     - 整个系统的正常运行突然被破坏


    +     - 所有正在运行的事务都非正常终止


    +     - 内存中数据库缓冲区的信息全部丢失


    +     - 外部存储设备上的数据未受影响


    +   - 系统故障的常见原因


    +     - 操作系统或DBMS代码错误


    +     - 操作员操作失误


    +     - 特定类型的硬件错误（如CPU故障）


    +     - 突然停电'
  merge: -1
  img_proc: true
- pgno: 617
  md: '# 系统故障的恢复


    +   - 清除尚未完成的事务对数据库的所有修改

    +     - 系统**重新启动**时，恢复程序要强行撤消（UNDO）所有未完成事务


    +   - 将缓冲区中已完成事务提交的结果写入数据库

    +     - 系统**重新启动**时，恢复程序需要重做（REDO）所有已提交的事务'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# # 故障-介质故障


    # 介质故障


    +   - 硬件故障使存储在外存储中的数据部分丢失或全部丢失


    +   - 介质故障比前两类故障的可能性小得多，但破坏性大得多


    # 常见原因


    +   - 硬件故障


    +   - 磁盘损坏


    +   - 磁头碰撞


    +   - 操作系统的某种潜在错误


    +   - 瞬时强磁场干扰'
  merge: -1
  img_proc: true
- pgno: 619
  md: '# # 介质故障的恢复


    +   - 装入数据库发生介质故障前某个时刻的数据副本


    +   - 重做自此时始的所有成功事务，将这些事务已提交的结果重新记入数据库'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# # 恢复的实现技术


    +   - 恢复操作的基本原理：冗余


    +   - 利用存储在系统其它地方的冗余数据来重建数据库中已被破坏或不正确的那部分数据


    +   - 恢复的实现技术：

    +   复杂，一个大型数据库产品，恢复子系统的代码要占全部代码的10%以上


    # # 未雨绸缪'
  merge: -1
  img_proc: true
