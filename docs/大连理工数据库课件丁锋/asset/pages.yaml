- pgno: 418
  md: '# # 数据库设计的基本步骤


    +   - 需求分析阶段

    +     - 准确了解与分析用户需求（包括数据与处理）

    +     - 是整个设计过程的基础，是最困难、最耗费时间的一步


    +   - 概念结构设计阶段

    +     - 是整个数据库设计的关键

    +     - 通过对用户需求进行综合、归纳与抽象，形成一个独立于具体DBMS的概念模型


    +   - 逻辑结构设计阶段

    +     - 将概念结构转换为某个DBMS所支持的数据模型并对其进行优化


    ![](img/67cf9517c4d3576174ca2f10eafe50de_418_0.png)'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# # 数据库设计的基本步骤


    +   - 数据库物理设计阶段

    +     - 为逻辑数据模型选取一个最适合应用环境的物理结构（包括存储结构和存取方法）

    +   - 数据库实施阶段

    +     - 运用DBMS提供的数据语言、工具及宿主语言，根据逻辑设计和物理设计的结果

    +       - 建立数据库

    +       - 编制与调试应用程序

    +       - 组织数据入库

    +       - 试运行

    +   - 数据库运行和维护阶段

    +     - 数据库应用系统经过试运行后即可投入正式运行。

    +     - 在数据库系统运行过程中必须不断地对其进行评价、调整与修改。'
  merge: -1
  img_proc: true
