- pgno: 395
  md: '# # 索引


    +   - 建立索引是加快查询速度的有效手段


    +   - 建立索引


    +   - DBA或表的属主（即建立表的人）根据需要建立


    +   - 有些DBMS自动建立以下列上的索引


    +   - PRIMARY KEY


    +   - UNIQUE


    +   - 维护索引


    +   - DBMS自动完成


    +   - 使用索引


    +   - DBMS自动选择是否使用索引以及使用哪些索引'
  merge: -1
  img_proc: true
