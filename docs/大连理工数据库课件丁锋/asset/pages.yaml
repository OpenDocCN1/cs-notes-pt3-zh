- pgno: 440
  md: '# 数据字典


    +   - 数据字典是各类数据描述的**集合**，是进行详细的数据收集和数据分析所**获得的主要结果**，在数据库设计中**占有很重要的地位**


    +   - **数据字典的内容**

    +     - 数据项

    +     - 数据结构

    +     - 数据流

    +     - 数据存储

    +     - 处理过程


    +   - 数据项是数据的最小组成单位，若干个数据项可以组成一个数据结构


    +   - 数据字典通过对数据项和数据结构的定义来描述数据流、数据存储的逻辑内容。'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# # 数据项


    +   - 数据项是不可再分的数据单位

    +   - 对数据项的描述

    +   - 取值范围、与其他数据项的逻辑关系定义了数据的完整性约束条件


    数据项描述 = {数据项名，数据项含义说明，别名，数据类型，长度，取值范围，取值含义，与其他数据项的逻辑关系}'
  merge: -1
  img_proc: true
- pgno: 442
