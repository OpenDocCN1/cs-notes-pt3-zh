    +   - 自底向上


    +   - 逐步扩张


    +   - 混合策略


    将自顶向下和自底向上相结合，用自顶向下策略设计一个全局概念结构的框架，以它为骨架集成由自底向上策略中设计的各局部概念结构。'
  merge: -1
