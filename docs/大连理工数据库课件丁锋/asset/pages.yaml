- pgno: 159
  md: '# # 关系完整性


    +   • 问题：实体的属性值没有或不知道怎么在数据库中表示？


    # NULL


    null表示没有，不同于空串、0，不是值，是状态


    处于培训的员工，还没有部门或表示不知道或缺失


    登记员工基本信息时，不知道他的地址'
