- pgno: 639
  md: '# 系统故障的恢复


    +   - 系统故障造成数据库不一致状态的原因

    +     - 一些未完成事务对数据库的更新已写入数据库

    +     - 一些已提交事务对数据库的更新还留在缓冲区没来得及写入数据库


    +   - 恢复方法

    +     - 1. Undo 故障发生时未完成的事务

    +     - 2. Redo 已完成的事务


    +   - 系统故障的恢复由系统在重新启动时自动完成，不需要用户干预'
