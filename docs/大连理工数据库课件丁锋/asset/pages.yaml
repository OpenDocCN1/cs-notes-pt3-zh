  md: "# # 意向锁\n\n+   • IX锁  \n+   如果对一个数据对象加IX锁，表示它的后裔结点拟（意向）加X锁。  \n+   \n+   例：要对某个元组加X锁，则要首先对关系和数据库加IX锁。"
