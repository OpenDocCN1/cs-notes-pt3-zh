  md: '# # 意向锁


    +   - 具有意向锁的多粒度封锁方法

    +     - 申请封锁时应该按自上而下的次序进行

    +     - 释放封锁时则应该按自下而上的次序进行


    +   - 例：事务T要对一个数据对象加锁，必须先对它的上层结点加意向锁'
