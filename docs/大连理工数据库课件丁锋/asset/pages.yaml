- pgno: 568
  md: '# # 确定数据库物理结构


    +   • 确定系统配置


    +   • 系统都为这些变量赋予了合理的缺省值。但是这些值不一定适合每一种应用环境，在进行物理设计时，需要根据应用环境确定这些参数值，以使系统性能最优。


    +   • 在物理设计时对系统配置变量的调整只是初步的，在系统运行时还要根据系统实际运行情况做进一步的调整，以期切实改进系统性能。


    ![](img/67cf9517c4d3576174ca2f10eafe50de_568_0.png)


