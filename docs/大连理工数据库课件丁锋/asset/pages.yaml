- pgno: 100
  md: '# 数据库系统的模式结构


    +   - 不同的视图中相应的数据行可有不同的名字。系统必须知道它们之间的关系，这种对应关系也叫**映像**。

    +   - 三级体系结构对系统是不是关系的，差别不大


    +   - 对于关系系统而言

    +     - 概念层一定是关系的

    +     - 外部视图也是关系的或接近关系的

    +     - 内部层不是关系的，该层的实体不是关系表的原样照搬。

    +       - 不管是什么系统，内部层都是一样的（如存储记录、指针、索引、索引等）。**事实上，关系模型与内部层无关，它关心的是用户的数据视图。**'
  merge: -1
  img_proc: true
