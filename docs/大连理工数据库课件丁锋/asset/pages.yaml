- pgno: 72
  md: "# 数据模型\n\n- 数据模型的组成要素\n\n+   □ 数据结构\n+   \n+   描述数据库的组成对象以及对象之间的联系，是刻画数据模型性质最重要的方面（按数据结构命名数据模型），是对系统静态特性的表述。\n\
    \n+   □ 数据操作\n+   \n+   指该数据结构上的各种实例允许操作的集合，包括相关的操作规则，是对系统动态特性的描述\n\n+   □ 数据的约束条件\n\
    +   \n+   一组完整性约束的集合。是给定的数据模型中数据及其联系所具有的约束和依赖规则，用以限定符合数据模型的数据，保证数据的正确、有效、相容。\n\
    +   \n+   数据模型应该反映和规定本数据模型必须遵守的基本的通用的完整性约束条件，也应该提供定义完整性约束条件的机制。"
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 逻辑模型


    +   - 数据库领域中最常用的逻辑数据模型：

    +     - 层次模型（Hierarchical Model）

    +     - 网状模型（Network Model）

    +     - 关系模型（Relation Model）

    +     - 面向对象的模型（Object Oriented Model）

    +     - 对象关系模型（Object Relational Model）'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# # 逻辑模型\n\n+   - 层次模型  \n+   层次数据库采用层次模型作为数据的组织方式  \n+     - 以树型结构表示各类实体及实体间的联系，满足下面两个条件的基本层次联系的集合为层次模型\
    \  \n+       - 有且仅有一个节点没有双亲节点，即根结点  \n+       - 根结点以外的其他节点有且只有一个双亲节点  \n+    \
    \ - 层次模型中，每个节点表示一个记录类型，每个记录类型可包含若干字段。  \n+     - 层次模型的一个基本特点：任何一个给定的记录值只有按其路径查看时，才能显示出它的全部意义，没有一个子女记录值能够脱离双亲记录值而独立存在。\
    \  \n+   - 代表系统  \n+     IMS(information management system)，IBM，1968"
  merge: -1
  img_proc: true
