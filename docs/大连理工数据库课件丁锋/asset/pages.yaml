  md: '# # 恢复的实现技术


    +   - 恢复机制涉及的关键问题

    +     - 1. 如何建立冗余数据

    +       - 数据转储（backup）

    +       - 登录日志文件（logging）

    +     - 2. 如何利用这些冗余数据实施数据库恢复'
  merge: -1
