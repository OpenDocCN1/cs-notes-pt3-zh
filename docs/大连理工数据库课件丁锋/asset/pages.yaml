- pgno: 437
  md: '# 结构化分析方法


    # • 2．分解处理功能和数据


    # ¤ （1）分解处理功能


    将处理功能的具体内容分解为若干子功能，再将每个子功能继续分解，直到把系统的工作过程表达清楚为止。


    # ¤ （2）分解数据


    在处理功能逐步分解的同时，其所用的数据也逐级分解，形成若干层次的数据流图。

    数据流图表达了数据和处理过程的关系


    # ¤ （3）表达方法


    +   - 处理过程：用判定表或判定树来描述

    +   - 数据：用数据字典来描述'
  merge: -1
  img_proc: true
