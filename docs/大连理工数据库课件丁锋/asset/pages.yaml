- pgno: 453
  md: '# 概念结构设计


    +   - 需求分析阶段描述的用户应用需求是现实世界的具体需求

    +   - 将需求分析得到的用户需求抽象为信息结构即概念模型的过程就是概念结构设计

    +   - 概念结构是各种数据模型的共同基础，它比数据模型更独立于机器、更抽象，从而更加稳定。

    +   - 概念结构设计是整个数据库设计的关键


    ![](img/67cf9517c4d3576174ca2f10eafe50de_453_0.png)'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# 概念结构设计的特点


    +   - 能真实、充分地反映现实世界，包括事物和事物之间的联系，能满足用户对数据的处理要求。是现实世界的一个真实模型。


    +   - 易于理解，从而可以用它和不熟悉计算机的用户交换意见，用户的积极参与是数据库的设计成功的关键。


    +   - 易于更改，当应用环境和应用要求改变时，容易对概念模型修改和扩充。


    +   - 易于向关系、网状、层次等多种数据模型转换。'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# # 概念结构设计的方法与步骤


    +   - 设计概念结构的四类方法


