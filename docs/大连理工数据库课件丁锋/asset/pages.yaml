  md: "# # 多粒度封锁\n\n+   - 多粒度树\n+     以树形结构来表示多级封锁粒度。根结点是整个数据库，表示最大的数据粒度；叶结点表示最小的数据粒度\n\
    +   \n+   - 例：三级粒度树。根结点为数据库，数据库的子结点为关系，关系的子结点为元组。\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_718_0.png)"
