  md: "# # 数据存储\n\n+   - 数据存储是数据结构停留或保存的地方，也是数据流的来源和去向之一。\n+   - 对数据存储的描述  \n+   \
    \  数据存储描述 = {数据存储名，说明，编号，流入的数据流，流出的数据流，组成：{数据结构}，数据量，存取方式}\n\n+   - 流入的数据流：指出数据来源\n\
