- pgno: 248
  md: '# # 3NF


    +   - 若R∈3NF，则R的每一个非主属性既不部分函数依赖于候选码也不传递函数依赖于候选码。

    +   - 如果R∈3NF，则R也是2NF。


    +   - 将一个2NF的关系分解为多个3NF的关系，可在一定程度上解决原关系中存在的插入异常、删除异常、数据冗余度大、修改复杂等问题。但是，这并不能完全消除关系模式中的各种异常情况和数据冗余。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# # 保持函数依赖


    +   - 思考


    +   - {Sno,Sname,Dname,Dleader}


    +   - 可以分解成


    +   ✘ {Sno,Sname,Dname},{Dname,Dleader}


    +   - 还可以分解成什么？


    +   ✘ 还可以分解成


    +   {Sno,Sname,Dname},{Sno,Dleader}


    +   ✘ 这样分解“好不好”？'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 保持函数依赖


    +   - 分解方案

    +     `{Sno,Sname,Dname},{Sno,Dleader}`

    +     **并不好**


    +   - 原因在于原有的函数依赖 `Dname→DLeader` 变成了跨越两个关系变量的数据库级约束条件。两个投影不是相互独立的。为保证不违反函数依赖
    `DName→DLeader`，更新其中任何一个投影时都必须对两个投影实行监控。


    +   - 考虑学生转系的情况。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 保持函数依赖


    +   - 投影独立性概念为从可能存在的多种分解方法中选择一个合适的分解提供了一个准则。


    +   - 具体地说，一个投影相互独立的分解比相互不独立的分解“好”。这种思想被称为“保持函数依赖”。


    +   - 当且仅当满足下列条件时，关系 R 的两个投影 R1 和 R2 相互独立：

    +     - R 中的所有函数依赖都是 R1 和 R2 的函数依赖的逻辑推论

    +     - R1 和 R2 的相同属性至少组成它们之中的一个的候选码'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# BCNF


    +   - 3NF没有很好地处理一般情况下的问题，更确切的说，是没有很好地处理具有下列特性的关系：

    +     - 只有一个或多个候选码

    +     - 候选码是复合的

    +     - 候选码之间是重叠的（即至少由一个属性是相同的）'
  merge: -1
  img_proc: true
- pgno: 253
  md: "# # BCNF\n\n+   - 假设学生姓名SName是唯一的，那么下面的关系模式是否满足3NF？\n+     {Sno,SName,Cno,Grade}\n\
    \n+   - 存不存在“问题”？\n\n+   - 存在问题，存在数据冗余，也会产生更新异常。\n\n+   - 为解决问题，可以将其分解为  \n+ \
    \    {Sno,SName} {Sno,Cno,Grade}  \n+     或  \n+     {Sno,SName} {SName,Cno,Grade}\n\
    \n![](img/67cf9517c4d3576174ca2f10eafe50de_253_0.png)"
  merge: -1
  img_proc: true
- pgno: 254
  md: '# # BCNF


    +   设关系模式R<U，F>=1NF，如果对于R的每个函数依赖X→Y，若Y不属于X，则X必含有候选码，那么R∈BCNF。


    +   当且仅当一个关系变量的所有非平凡的、左部不可约的函数依赖的决定因素是候选码，则该关系变量属于BCNF


    +   若R∈BCNF

    +   每一个决定属性集（因素）都包含（候选）码

    +   R中的所有属性（主，非主属性）都完全函数依赖于码

    +   R∈3NF（证明）

    +   若R∈3NF 则R不一定∈BCNF

    +   如果R∈3NF，且R只有一个候选码，则R必属于BCNF。'
  merge: -1
  img_proc: true
- pgno: 255
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 256
  md: '# BCNF


    • 关系变量R无损分解至一系列属于BCNF的投影集D的算法


    +   1. 初始化D为只包含R

    +   2. 对D中的每个非BCNF关系变量T，执行步骤3和4

    +   3. 设X→Y为T的不满足BCNF要求的函数依赖。

    +   4. 用T的两个投影（在X和Y上的投影及在除Y中属性上的投影）代替D中的T'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 范式示例


    假设仓库管理关系表为StorehouseManage(仓库ID, 配件ID, 管理员ID, 数量)。一个管理员只在一个仓库工作；一个仓库有多个管理员；每个仓库里一种型号的配件由专人负责，但一个人可以管理几种配件；同一种型号的配件可以分放在几个仓库中。


    | WID | PID | EID | QNT |

    |-----|-----|-----|-----|

    |     |     |     |     |


    这个数据库表中存在如下决定关系：


    +   - (WID, PID) → QNT

    +   - (WID, PID) → EID

    +   - EID → WID

    +   - (EID, PID) → QNT'
  merge: -1
