- pgno: 532
  md: '# 数据模型的优化


    • 例：


    # • 4. 确定是否需要合并或分解


    +   ¤ 并不是规范化程度越高的关系就越优。

    +     联系运算的代价是相当高的，可以说关系模型低效的主要

    +     原因就是做联接运算引起的，因此在这种情况下，第二范

    +     式甚至第一范式也许是最好的。


    +   ¤ 非BCNF的关系模式虽然从理论上分析会存在不同程度的

    +     更新异常，但如果在实际应用中对此关系模式只是查询，

    +     并不执行更新操作，则就不会产生实际影响。


    +   ¤ 对于一个具体应用来说，到底规范化进行到什么程度，需

    +     要权衡响应时间和潜在问题两者的利弊才能决定。一般说

    +     来，第三范式就足够了。'
  merge: -1
  img_proc: true
- pgno: 533
  md: "# # 数据模型的优化\n\n+   - 例：\n+   - **4. 确定是否需要合并或分解**\n+   \n+   虽然平均成绩可以由其他属性推算出来，但如果应用中需要经常查询学生的平均成绩，为提高效率，我们仍然可保留该冗余数据，对关系模式不再做进一步分解。\n\
    +   - **5. 进行合并或分解**\n+     - 常用分解方法\n+       - 水平分解\n+       - 垂直分解"
  merge: -1
  img_proc: true
- pgno: 534
  md: '# # 数据模型的优化


    +   • 模式分解方法


    +   • 水平分解


    把(基本)关系的元组分为若干子集合，定义每个子集合为一个子关系，以提高系统的效率。


    +   • 水平分解的适用范围


    +   • 满足“80/20原则”的应用


    +   • 80/20原则：一个大关系中，经常被使用的数据只是关系的一部分，约20%


    +   • 把经常使用的数据分解出来，形成一个子关系，可以减少查询的数据量。


    +   • 并发事务经常存取不相交的数据


    +   • 如果关系R上具有n个事务，而且多数事务存取的数据不相交，则R可分解为少于或等于n个子关系，使每个事务存取的数据对应一个关系。'
  merge: -1
  img_proc: true
- pgno: 535
  md: '# 数据模型的优化


    +   - 模式分解方法

    +     - **垂直分解**：把关系模式R的属性分解为若干子集合，形成若干子关系模式。

    +     - **垂直分解的原则**：经常在一起使用的属性从R中分解出来形成一个子关系模式。

    +     - **垂直分解的优点**：可以提高某些事务的效率。

    +     - **垂直分解的缺点**：可能使另一些事务不得不执行连接操作，从而降低了效率。'
  merge: -1
  img_proc: true
- pgno: 536
  md: '# # 数据模型的优化


    +   • 模式分解方法


    +   ✖ 垂直分解的适用范围


    取决于分解后R上的所有事务的总效率是否得到了提高。


    +   ✖ 进行垂直分解的方法


    +   • 简单情况：直观分解


    +   • 复杂情况：模式分解算法


    +   ✖ 垂直分解必须不损失关系模式的语义(保持无损连接性和保持函数依赖)。'
  merge: -1
  img_proc: true
