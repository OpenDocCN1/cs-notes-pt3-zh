    SELECT Sno, Sname, Sage

    FROM   Student WHERE   Sdept= ''IS'';

    ```


    +   - 从单个基本表导出，并且只是去掉了基本表的某些行和某些列，但保留了码。'
  merge: -1
  img_proc: true
- pgno: 373
  md: "# # 视图\n\n```\nCREATE VIEW view_name[column1[, column2]...]\nAS query\n[WITH\
    \ CHECK OPTION]\n```\n\n+   • **WITH CHECK OPTION**  \n+   透过视图进行增删改操作时，不得破坏视图定义中的谓词条件（即子查询中的条件表达式）"
  merge: -1
  img_proc: true
- pgno: 374
  md: '# 视图


    • 例: 建立信息系统学生的视图，并要求透过该视图进行的更新操作只涉及信息系统学生。


    ```

    CREATE VIEW IS_Student

    AS

    SELECT Sno, Sname, Sage FROM Student

    WHERE Sdept= ''IS'' WITH CHECK OPTION;

    ```


    +   • 对IS_Student视图的更新操作

    +   - 修改操作: DBMS自动加上Sdept= ''IS''的条件

    +   - 删除操作: DBMS自动加上Sdept= ''IS''的条件

    +   - 插入操作: DBMS自动检查Sdept属性值是否为''IS''

    +     • 如果不是，则拒绝该插入操作

    +     • 如果没有提供Sdept属性值，则自动定义Sdept为''IS'''
  merge: -1
  img_proc: true
