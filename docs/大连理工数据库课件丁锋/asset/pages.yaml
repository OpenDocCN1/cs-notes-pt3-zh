- pgno: 346
  md: '# 嵌套查询（子查询）


    +   - 嵌套查询分类


    # ¤ 不相关子查询


    子查询的查询条件不依赖于父查询

    处理方式：由里向外逐层处理。即每个子查询在上一级查询处理之前求解，子查询的结果用于建立其父查询的查找条件。


    # ¤ 相关子查询


    子查询的查询条件依赖于父查询

    处理方式：


    +   - 首先取外层查询中表的第一个元组，根据它与内层查询相关的属性值处理内层查询，若WHERE子句返回值为真，则取此元组放入结果表；

    +   - 然后再取外层表的下一个元组；

    +   - 重复这一过程，直至外层表全部检查完为止'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# # 嵌套查询（子查询）


    +   - 带有EXISTS谓词的子查询

    +     - EXISTS谓词

    +       - 存在量词 （∃）

    +       - 带有EXISTS谓词的子查询不返回任何数据，只产生逻辑真值 “true”或逻辑假值 “false”。

    +         - 若内层查询结果非空，则返回真值

    +         - 若内层查询结果为空，则返回假值

    +       - 由EXISTS引出的子查询，其目标列表达式通常都用*，因为带EXISTS的子查询只返回真值或假值，给出列名无实际意义'
  merge: -1
  img_proc: true
- pgno: 348
  md: "# 嵌套查询（子查询）\n\n+   - 带有EXISTS谓词的子查询\n+     例：查询所有选修了1号课程的学生姓名。\n\n```\nSELECT\
    \ Sname\nFROM Student\nWHERE EXISTS(SELECT * FROM SC\n            WHERE Sno=Student.Sno\n\
    \            AND Cno='1');\n```\n\n+   - 求解思路分析：\n+     - 本查询涉及Student和SC关系。\n\
    +       - 在Student中依次取每个元组的Sno值，用此值去检查SC关系。\n+       - 若SC中存在这样的元组，其Sno值等于此Student.Sno值，并且其Cno='1'，则取此Student.Sname送入结果关系。"
  merge: -1
  img_proc: true
