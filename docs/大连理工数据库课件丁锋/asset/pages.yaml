- pgno: 509
  md: '# # 逻辑结构设计


    +   - 逻辑结构设计的任务


    概念结构是各种数据模型的共同基础。为了能够用某一DBMS实现用户需求，还必须将概念结构进一步转化为相应的数据模型，这正是数据库逻辑结构设计所要完成的任务。'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# # 逻辑结构设计


    +   - 逻辑结构设计的步骤

    +     - 将概念结构转化为一般的关系、网状、层次模型

    +     - 将转化来的的关系、网状、层次模型向特定DBMS支持下的数据模型转换

