- pgno: 672
  md: '# 并发操作的潜在不一致性


    +   读“脏”数据


    事务1修改某一数据，并将其写回磁盘。事务2读取同一数据后，事务1由于某种原因被撤消，这时事务1已修改过的数据恢复原值，事务2读到的数据就与数据库中的数据不一致，是不正确的数据，又称为“脏”数据。


    | T1 | T2 |

    | --- | --- |

    | ① 读C=100

    C←C*2

    写回C | 读C=200 |

    | ② |  |

    | ③ ROLLBACK

    C恢复为100 |  |'
  merge: -1
  img_proc: true
- pgno: 673
  md: "# 并发操作的潜在不一致性\n\n+   - 不可重复读\n+   \n+   不可重复读是指事务1读取数据后，事务2执行更新操作，使事务1无法再现前一次读取结果。\n\
    \n+   - 三类不可重复读\n+   \n+   事务1读取某一数据后：\n+   \n+   1. 事务2对其做了修改，当事务1再次读该数据时，得到与前一次不同的值。\n\
    +   2. 事务2删除了其中部分记录，当事务1再次读取数据时，发现某些记录神秘地消失了。\n+   3. 事务2插入了一些记录，当事务1再次按相同条件读取数据时，发现多了一些记录。\n\
    \n+   - 后两种不可重复读有时也称为幻影现象（phantom row）"
  merge: -1
  img_proc: true
- pgno: 674
