- pgno: 679
  md: '# # 封锁协议


    +   - 在运用X锁和S锁对数据对象加锁时，需要约定一些规则：封锁协议（Locking Protocol）

    +     - 何时申请X锁或S锁

    +     - 持锁时间、何时释放

    +   - 不同的封锁协议，在不同的程度上为并发操作的正确调度提供一定的保证

    +   - 常用的封锁协议：3级封锁协议'
  merge: -1
  img_proc: true
- pgno: 680
  md: '# # 1级封锁协议


    +   - 事务T在修改数据R之前必须先对其加X锁，直到事务结束才释放

    +     - 正常结束（COMMIT）

    +     - 非正常结束（ROLLBACK）


    +   - 1级封锁协议可防止丢失修改


    +   - 在1级封锁协议中，如果是读数据，不需要加锁的，所以它不能保证可重复读和不读“脏”数据。'
  merge: -1
  img_proc: true
- pgno: 681
  md: '# 1级封锁协议


    | T₁ | T₂ |

    |---|---|

    | ① Xlock A<br>　获得<br>② 读A=16<br><br>③ A←A-1<br>　写回A=15<br>　Commit<br>　Unlock
    A<br><br>④<br><br>⑤ | Xlock A<br>等待<br>等待<br>等待<br>等待<br>获得Xlock A<br>读A=15<br>A←A-1<br>写回A=14<br>Commit<br>Unlock
    A |


    没有丢失修改'
  merge: -1
  img_proc: true
- pgno: 682
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 683
  md: "# # 1级封锁协议\n\n| T₁ | T₂ |\n|---|---|\n| ①读A=50  \n读B=100  \n求和=150  \n\n② \
    \ \n\n③读A=50  \n读B=200  \n求和=250  \n(验算不对) | Xlock B  \n获得  \n读B=100  \nB←B*2\
    \  \n写回B=200  \nCommit  \nUnlock B |\n\n不可重复读"
  merge: -1
  img_proc: true
- pgno: 684
  md: '# 2级封锁协议


    +   - 1级封锁协议+**事务T在读取数据R前必须先加S锁，**读完后即可释放S锁

    +   - 2级封锁协议可以防止丢失修改和读“脏”数据。

    +   - 在2级封锁协议中，由于读完数据后即可释放S锁，所以它不能保证可重复读。'
  merge: -1
  img_proc: true
- pgno: 685
  md: '# # 2级封锁协议


    | T₁ | T₂ |

    |---|---|

    | ① Slock A 获得 读A=50 Unlock A | |

    | ② Slock B 获得 读B=100 Unlock B | Xlock B 等待 等待 获得Xlock B 读B=100 B←B*2 写回B=200
    Commit Unlock B |

    | ③ 求和=150 | |


    | T₁ (续) | T₂ |

    |---|---|

    | ④Slock A 获得 读A=50 Unlock A Slock B 获得 读B=200 Unlock B 求和=250 (验算不对) | |


    不可重复读'
  merge: -1
  img_proc: true
- pgno: 686
  md: '# # 3级封锁协议


    +   - 1级封锁协议 + 事务T在读取数据R之前必须先对其加S锁，直到事务结束才释放


    +   - 3级封锁协议可防止丢失修改、读脏数据和不可重复读。'
  merge: -1
  img_proc: true
- pgno: 687
  md: '# # 3级封锁协议


    | T₁ | T₂ |

    |---|---|

    | ① Slock A 读A=50 Slock B 读B=100 求和=150 | |

    | ② | Xlock B 等待 等待 等待 等待 等待 等待 等待 等待 获得Xlock B 读B=100 B←B*2 写回B=200 Commit Unlock
    B |

    | ③ 读A=50 读B=100 求和=150 Commit Unlock A Unlock B | |

    | ④ | |

    | ⑤ | |


    # ## 可重复读'
