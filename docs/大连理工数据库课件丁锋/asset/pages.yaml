- pgno: 32
  md: "# # DBMS的主要功能\n\n+   - 数据定义功能  \n+     提供数据定义语言(DDL)，定义数据库中的数据对象\n\n+   - 数据组织、存储和管理\
    \  \n+     提高存储空间利用率和方便存取，提供多种存取方法来提高存取效率\n\n+   - 数据操纵功能  \n+     提供数据操纵语言(DML)，实现对数据库的基本操作(查询、插入、删除和修改)\n\
    \n+   - 数据库的事务管理和运行管理  \n+     保证数据的安全性、完整性，多用户对数据的并发使用，发生故障后的系统恢复\n\n+   - 数据库的建立和维护功能\
    \  \n+     数据库数据批量装载，数据库转储，介质故障恢复，数据库的重组织，性能监视等\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_32_0.png)"
  merge: -1
  img_proc: true
