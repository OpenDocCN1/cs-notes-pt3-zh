  img_proc: true
- pgno: 397
  md: '# # 索引


    +   - 例：为学生-课程数据库中的Student, Course, SC三个表建立索引。其中Student表按学号升序建唯一索引，Course表按课程号升序建唯一索引，SC表按学号升序和课程号降序建唯一索引。


    ```

    ```sql

    CREATE UNIQUE INDEX Stusno ON Student(Sno);

    CREATE UNIQUE INDEX Coucno ON Course(Cno);

    CREATE UNIQUE INDEX SCno ON SC(Sno ASC, Cno DESC);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# # 索引


    +   - 唯一值索引


    +   - 对于已含重复值的属性列不能建UNIQUE索引


    +   - 对某个列建立UNIQUE索引后，插入新记录时DBMS会自动检查新记录在该列上是否取了重复值。这相当于增加了一个UNIQUE约束'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# # 索引


    +   - 聚簇索引


    建立聚簇索引后，基表中数据也需要按指定的聚簇属性值的升序或降序存放。也即聚簇索引的索引项顺序与表中记录的物理顺序一致


    例：在Student表的Sname（姓名）列上建立一个聚簇索引，而且Student表中的记录将按照Sname值的升序存放


    ```

    CREATE CLUSTER INDEX Stusname ON Student(Sname);

    ```'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# # 索引


    +   - 聚簇索引

    +     - 在一个基本表上最多只能建立一个聚簇索引

    +     - 聚簇索引的用途：对于某些类型的查询，可以提高查询效率

    +     - 聚簇索引的适用范围

    +       - 很少对基表进行增删操作

    +       - 很少对其中的变长列进行修改操作'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# # 索引


    +   • 删除索引


    删除索引时，系统会从数据字典中删去有关该索引的描述。


    ```

    DROP INDEX vupper_idx;

    ```


    例：删除Student表的Stusname索引。


    ```

    DROP INDEX Stusname;

    ```'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# # 数据权限控制


    +   - 授权与回收


    某个用户对某类数据库对象具有何种操作权力是个政策问题而不是技术问题。数据库管理系统的功能是保证这些决定的执行。


    常用实现方法：


    SQL的GRANT语句和REVOKE语句'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# 数据权限控制


    +   • 授权与回收


    ```

    GRANT {obj_priv_1[,obj_priv_2]...}

    ON {[schema.]object[(column1[,column2])],...}

    TO {user_1[,user_2]...}

    [WITH GRANT OPTION];

    ```


    ```

    REVOKE {obj_priv_1[,obj_priv_2]...}

    ON {[schema.]object[(column1[,column2])]} }

    FROM {user_1[,user_2]...}

    [CASCADE|RESTRICT];

    ```'
  merge: -1
  img_proc: true
