- pgno: 573
  md: '# 定义数据库结构


    • 确定了数据库的逻辑结构与物理结构后，就可以用来所选用的DBMS提供的数据定义语言（DDL）来严格描述数据库结构。


    • 例，对于前面的例子，可以用SQL语句如下定义表结构：


    ```

    CREATE TABLE 学生(学号 CHAR(8),............);

    CREATE TABLE 课程(............);

    );............


    接下来是在这些基本表上定义视图：

    CREATE VIEW ....(............ );

    ```


    • 如果需要使用聚簇，在建基本表之前，应先用CREATE CLUSTER语句定义聚簇。'
  merge: -1
  img_proc: true
- pgno: 574
  md: '# 数据装载


    数据库结构建立好后，就可以向数据库中装载数据了。组织数据入库是数据库实施阶段最主要的工作。


    # 数据装载方法


    +   - 人工方法


    +   - 计算机辅助数据入库'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# # 数据装载


    +   - 人工方法：适用于小型系统

    +   - 步骤

    +     - 1) **筛选数据**。需要装入数据库中的数据通常部分散在各个部门的数据文件或原始凭证中，所以首先必须把需要入库的数据筛选出来。

    +     - 2) **转换数据格式**。筛选出来的需要入库的数据，其格式往往不符合数据库要求，还需要进行转换。这种转换有时可能很复杂。

    +     - 3) **输入数据**。将转换好的数据输入计算机中。

    +     - 4) **校验数据**。检查输入的数据是否有误。'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# # 数据装载


    +   - 计算机辅助数据入库：适用于中大型系统

    +   - 步骤


    +   - 1) 筛选数据

    +   - 2) 输入数据。由录入员将原始数据直接输入计算机中。数据输入子系统应提供输入界面。

    +   - 3) 校验数据。数据输入子系统采用多种检验技术检查输入数据的正确性。

    +   - 4) 转换数据。数据输入子系统根据数据库系统的要求，从录入的数据中抽取有用成分，对其进行分类，然后转换数据格式。抽取、分类和转换数据是数据输入子系统的主要工作，也是数据输入子系统的复杂性所在。

    +   - 5) 综合数据。数据输入子系统对转换好的数据根据系统的要求进一步综合成最终数据。'
  merge: -1
  img_proc: true
- pgno: 577
  md: '# 数据装载


    如果数据库是在老的文件系统或数据库系统的基础上设计的，则数据输入子系统只需要完成转换数据、综合数据两项工作，直接将老系统中的数据转换成新系统中需要的数据格式。


    为了保证数据能够及时入库，应在数据库物理设计的同 时编制数据输入子系统。'
  merge: -1
  img_proc: true
- pgno: 578
  md: '# 编制与调试应用程序


    +   - 数据库应用程序的设计应该与数据设计并行进行。


    +   - 在数据库实施阶段，当数据库结构建立好后，就可以开始编制与调试数据库的应用程序。调试应用程序时由于数据入库尚未完成，可先使用模拟数据。'
  merge: -1
  img_proc: true
- pgno: 579
  md: '# # 数据库试运行


    应用程序调试完成，并且已有一小部分数据入库后，就可以开始数据库的试运行。


    数据库试运行也称为联合调试，其主要工作包括：


    +   1) **功能测试**：实际运行应用程序，执行对数据库的各种操作，测试应用程序的各种功能。

    +   2) **性能测试**：测量系统的性能指标，分析是否符合设计目标。'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# # 数据库试运行


    +   - 数据库性能指标的测量


    +   - 数据库物理设计阶段在评价数据库结构估算时间、空间指标时，作了许多简化和假设，忽略了许多次要因素，因此结果必然很粗糙。


    +   - 数据库试运行则是要实际测量系统的各种性能指标（不仅是时间、空间指标），如果结果不符合设计目标，则需要返回物理设计阶段，调整物理结构，修改参数；有时甚至需要返回逻辑设计阶段，调整逻辑结构。'
  merge: -1
  img_proc: true
- pgno: 581
  md: '# 数据库试运行


    +   • 数据的分期入库


    □ 重新设计物理结构甚至逻辑结构，会导致数据重新入库。


    □ 由于数据入库工作量实在太大，所以可以采用分期输入数据的方法


    +   • 先输入小批量数据供先期联合调试使用


    +   • 待试运行基本合格后再输入大批量数据


    +   • 逐步增加数据量，逐步完成运行评价'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# 数据库试运行


    +   - 数据库的转储和恢复

    +     - 在数据库试运行阶段，系统还不稳定，硬、软件故障随时都可能发生

    +     - 系统的操作人员对新系统还不熟悉，误操作也不可避免

    +     - 因此必须做好数据库的转储和恢复工作，尽量减少对数据库的破坏。'
  merge: -1
  img_proc: true
- pgno: 583
  md: '# # 数据库运行与维护


    ![](img/67cf9517c4d3576174ca2f10eafe50de_583_0.png)'
  merge: -1
  img_proc: true
- pgno: 584
  md: '# 数据库运行与维护


    数据库试运行结果符合设计目标后，数据库就可以真正投入运行了。


    数据库投入运行标志着开发任务的基本完成和维护工作的开始


    对数据库设计进行评价、调整、修改等维护工作是一个长期的任务，也是设计工作的继续和提高。


    +   • 应用环境在不断变化

    +   • 数据库运行过程中物理存储会不断变化'
  merge: -1
  img_proc: true
- pgno: 585
  md: '# # 数据库运行与维护


    在数据库运行阶段，对数据库经常性的维护工作主要是由DBA完成的，包括：

    1. 数据库的转储和恢复


    +   转储和恢复是系统正式运行后最重要的维护工作之一。


    +   DBA要针对不同的应用要求制定不同的转储计划，定期对数据库和日志文件进行备份。


    +   一旦发生介质故障，即利用数据库备份及日志文件备份，尽快将数据库恢复到某种一致性状态。'
  merge: -1
  img_proc: true
- pgno: 586
  md: '# # 数据库运行与维护


    # 2. 数据库的安全性、完整性控制


    • DBA必须根据用户的实际需要授予不同的操作权限


    • 在数据库运行过程中，由于应用环境的变化，对安全性的要求也会发生变化，DBA需要根据实际情况修改原有的安全性控制。


    • 由于应用环境的变化，数据库的完整性约束条件也会变化，也需要DBA不断修正，以满足用户要求。'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# # 数据库运行与维护


    # ## 3. 数据库性能的监督、分析和改进


    在数据库运行过程中，DBA必须监督系统运行，对监测数据进行分析，找出改进系统性能的方法。


    +   - 利用监测工具获取系统运行过程中一系列性能参数的值


    +   - 通过仔细分析这些数据，判断当前系统是否处于最佳运行状态


    +   - 如果不是，则需要通过调整某些参数来进一步改进数据库性能'
  merge: -1
  img_proc: true
- pgno: 588
  md: '# # 数据库运行与维护


    # ## 4. 数据库的重组织和重构造


    # ### 1）数据库的重组织


    为什么要进行数据库的重组织？


    数据库运行一段时间后，由于记录的不断增、删、改，会使数据库的物理存储变坏，从而降低数据库存储空间的利用率和数据的存取效率，使数据库的性能下降。'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# 数据库运行与维护


    +   - 重组的形式

    +     - 全部重组

    +     - 部分重组：只对频繁增、删的表进行重组


    重组的目标：提高系统性能


    +   - 重组的工作：

    +     按原设计要求

    +     - 重新安排存储位置

    +     - 回收垃圾

    +     - 减少指针链


    数据库的重组不会改变原设计的数据逻辑结构和物理结构


    +   - DBMS一般都提供了供重组数据库使用的实用程序，帮忙DBA重新组织数据库。'
  merge: -1
  img_proc: true
- pgno: 590
  md: '# # 数据库运行与维护


    +   • 2）数据库的重构造


    为什么要进行数据库的重构造？


    数据库应用环境发生变化，会导致实体及实体间的联系也发生相应的变化，使原有的数据库设计不能很好地满足新的需求


    +   x 增加新的应用或新的实体


    +   x 取消某些已有应用


    +   x 改变某些已有应用'
  merge: -1
  img_proc: true
- pgno: 591
  md: '# 数据库运行与维护


    +   - 数据库重构造的主要工作

    +     根据新环境调整数据库的模式和内模式

    +     - 增加新的数据项

    +     - 改变数据项的类型

    +     - 改变数据库的容量

    +     - 增加或删除索引

    +     - 修改完整性约束条件'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# 数据库运行与维护


    +   - 重构数据库的程度是有限的

    +     - 若应用变化太大，已无法通过重构数据库来满足新的需求，或重构数据库的代价太大，则表明现有数据库应用系统的生命周期已经结束，应该重新设计新的数据库系统，开始新数据库应用系统的生命周期了。'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# # 小结


    +   - 数据库的设计过程

    +     - 需求分析

    +     - 概念结构设计

    +     - 逻辑结构设计

    +     - 物理设计

    +     - 实施

    +     - 运行维护


    +   - 设计过程中往往还会有许多反复。'
  merge: -1
  img_proc: true
- pgno: 594
  md: '# # 小结


    +   - 数据库各级模式的形成


    +   - 数据库的各级模式是在设计过程中逐步形成的


    +   - 需求分析阶段综合各个用户的应用需求（现实世界的需求）。


    +   - 概念设计阶段形成独立于机器特点、独立于各个DBMS产品的概念模式（信息世界模型），用E-R图来描述。


    +   - 在逻辑设计阶段将E-R图转换成具体的数据库产品支持的数据模型如关系模型，形成数据库逻辑模式。然后根据用户处理的要求，安全性的考虑，在基本表的基础上再建立必要的视图（VIEW）形成数据的外模式。


    +   - 在物理设计阶段根据DBMS特点和处理的需要，进行物理存储安排，设计索引，形成数据库内模式。'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# 小结


    +   - 整个数据库设计过程体现了结构特征与行为特征的紧密结合。'
  merge: -1
  img_proc: true
- pgno: 596
  md: '# # 小结


    +   - 目前很多DBMS都提供了一些辅助工具（CASE工具），为加快数据库设计速度，设计人员可根据需要选用。


    +   - 例如需求分析完成之后，设计人员可以使用ORACLE DESIGNER 2000画E-R图，将E-R图转换为关系数据模型，生成数据库结构；画数据流图，生成应用程序。


    +   - 利用CASE工具生成的仅仅是数据库应用系统的一个雏形，比较粗糙，数据库设计人员需要根据用户的应用需求进一步修改该雏形，使之成为一个完善的系统。


    +   - 早期就选择某种CASE工具固然能减少数据库设计的复杂性，加快数据库设计的速度，但往往容易将自己限制于某一个DBMS上，而不是根据概念设计的结果选择合适的DBMS。'
  merge: -1
