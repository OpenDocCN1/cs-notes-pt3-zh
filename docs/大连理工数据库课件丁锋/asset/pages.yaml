    +   - 实体之间的联系：

    +     - 由于一个宿舍可以住多个学生，而一个学生只能住在某一个宿舍中，因此宿舍与学生之间是1:n的联系。

    +     - 男女学生需要住在不同的宿舍中。

    +     - 由于一个班级往往有若干名学生，而一个学生只能属于一个班级，因此班级与学生之间也是1:n的联系。

    +     - 由于班主任同时还要教课，因此班主任与学生之间存在指导联系，一个班主任要教多名学生，而一个学生只对应一个班主任，因此班主任与学生之间也是1:n的联系。

    +     - 而学生和他自己的档案材料之间，班级与班主任之间都是1:1的联系。'
  merge: -1
