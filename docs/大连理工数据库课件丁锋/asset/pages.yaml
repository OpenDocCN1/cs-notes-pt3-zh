  md: '# 数据库系统的模式结构


    +   • 内模式


    一个数据库只有一个内模式，内模式也称存储模式，是数据物理结构和存储方式的描述，是数据在数据库内部的表示方式


    +   □ 记录的存储方式 （如顺序存储，按照B树结构存储，按hash方法存储等）


    +   □ 索引的组织方式


    +   □ 数据是否压缩存储


    +   □ 数据是否加密


    +   □ 数据存储记录结构的规定'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 数据库系统的模式结构


    +   - **模式**

    +     也称逻辑模式或概念模式，是数据库中全体数据的逻辑结构和特征的描述，是所有用户的公共数据视图，综合了所有用户的需求，**一个数据库只有一个模式**


    +   - **模式的地位**：是数据库系统模式结构的中间层，与数据的物理存储细节和硬件环境无关，与具体的应用程序、开发工具及高级程序设计语言无关


    +   - **模式的定义**

    +     - 数据的逻辑结构（数据项的名字、类型、取值范围等）

    +     - 数据之间的联系

    +     - 数据有关的安全性、完整性要求'
  merge: -1
  img_proc: true
- pgno: 104
  md: "# # 数据库系统的模式结构\n\n+   - 外模式\n+     也称子模式或用户模式，是数据库用户（包括应用程序员和最终用户）使用的局部数据的逻辑结构和特征的描述。是数据库用户的数据视图，是与某一应用有关的数据的逻辑表示\n\
    \n+   - 外模式的地位：\n+     介于模式与应用之间，通常是模式的子集（一对多）。一个数据库可以有多个外模式。反映了不同的用户的应用需求、看待数据的方式、对数据保密的要求\n\
    +   \n+     对模式中同一数据，在外模式中的结构、类型、长度、保密级别等都可以不同，同一外模式可以为某一用户的多个应用系统所使用，但一个应用程序只能使用一个外模式。\n\
    \n+   - 外模式的用途\n+     保证数据库安全性的一个有力措施。每个用户只能看见和访问所对应的外模式中的数据\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_104_0.png)"
  merge: -1
  img_proc: true
