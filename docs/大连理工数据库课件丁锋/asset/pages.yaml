- pgno: 521
  md: '# E-R图向关系模型的转换


    +   - **注意：**

    +     - 从理论上讲，1:1关系可以与任意一端对应的关系模式合并。

    +     - 但在一些情况下，与不同的关系模式合并效率会大不一样。因此究竟应该与哪端的关系模式合并需要依应用的具体情况而定。

    +     - 由于连接操作是最费时的操作，所以**一般应以尽量减少连接操作为目标**。

    +     - 例如，如果经常要查询某个班级的班主任姓名，则将管理联系与教师关系合并更好些。'
