- pgno: 344
  md: "# # 嵌套查询（子查询）\n\n+   - 带有ANY或ALL谓词的子查询  \n+     ANY与ALL与集函数的对应关系\n\n|    |\
    \ =    | <>或!= | <    | <=    | >    | >=    |\n|---|---|---|---|---|---|---|\n\
    | ANY | IN    | --    | <MAX | <=MAX | >MIN | >=MIN |\n| ALL | --    | NOT IN\
    \ | <MIN | <=MIN | >MAX | >=MAX |\n\n> > 用集函数实现子查询通常比直接用ANY或ALL查询效率要高，因为前者通常能够减少比较次数"
  merge: -1
  img_proc: true
