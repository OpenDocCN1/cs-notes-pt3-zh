- pgno: 691
  md: '# # 活锁


    +   - 一个事务总是不能在某数据项上加上锁，因此该事务也就永远不能取得进展。（锁的分配不公平）

    +   - 如何避免活锁

    +   采用先来先服务的策略：

    +   - 当多个事务请求封锁同一数据对象时，按请求封锁的先后次序对这些事务排队。该数据对象上的锁一旦释放，首先批准申请队列中第一个事务获得锁。'
  merge: -1
  img_proc: true
- pgno: 692
  md: '# 死锁


    +   • 死锁


    +   • 如：由于事务占有锁并且申请其它的锁，使得这些事务不能继续推进的这种情况。


    +   • 解决死锁的方法：两类


    +   □ 1. 预防死锁


    +   □ 2. 死锁的诊断与解除'
  merge: -1
  img_proc: true
- pgno: 693
  md: '# # 死锁的预防


    +   - 产生死锁的原因是两个或多个事务都已封锁了一些数据对象，然后又都请求对已为其他事务封锁的数据对象加锁，从而出现死等待。

    +   - 预防死锁的发生就是要破坏产生死锁的条件


    +   - 预防死锁的方法

    +     - 一次封锁法要求每个事务必须一次将所有要使用的数据全部加锁，否则不能继续执行。（预知难、等待时间长、降低并发度）

    +     - 顺序封锁预先对数据对象规定一个封锁顺序，所有的事务都按这个顺序实行封锁。'
  merge: -1
  img_proc: true
- pgno: 694
  md: '# # 死锁的预防


    +   ## 一次封锁法

    +   要求每个事务必须一次将所有要使用的数据全部加锁，否则就不能继续执行


    +   ### 一次封锁法存在的问题：降低并发度

    +   - 扩大封锁范围，将以后要用到的全部数据加锁，势必扩大了封锁的范围，从而降低了系统的并发度

    +   - 难于事先精确确定封锁对象

    +     - 数据库中数据是不断变化的，原来不要求封锁的数据，在执行过程中可能会变成封锁对象，所以很难事先精确地确定每个事务所要封锁的数据对象

    +     - 解决方法：将事务在执行过程中可能要封锁的数据对象全部加锁，这就进一步降低了并发度。'
  merge: -1
  img_proc: true
- pgno: 695
  md: "# 死锁的预防\n\n+   - **顺序封锁法**\n+   \n+     顺序封锁法是预先对数据对象规定一个封锁顺序，所有事务都按这个顺序实行封锁。\n\
    \n+   - 顺序封锁法存在的问题\n+     - 维护成本高\n+   \n+       数据库系统中可封锁的数据对象极其众多，并且随数据的插入、删除等操作而不断地变化，要维护这样极多而且变化的资源的封锁顺序非常困难，成本很高\n\
    +   \n+     - 难于实现\n+   \n+       事务的封锁请求可以随着事务的执行而动态地决定，很难事先确定每一个事务要封锁哪些对象，因此也就很难按规定的顺序去施加封锁。\n\
    +   \n+       - 例：规定数据对象的封锁顺序为A,B,C,D,E。事务T3起初要求封锁数据对象B,C,E，但当它封锁了B,C后，才发现还需封锁A，这样就破坏了封锁顺序。"
  merge: -1
  img_proc: true
- pgno: 696
  md: '# # 死锁的预防


    +   - 结论

    +     - 在操作系统中广为采用的预防死锁的策略并不很适合数据库的特点

    +     - DBMS在解决死锁的问题上更普遍采用的是诊断并解除死锁的方法'
  merge: -1
  img_proc: true
- pgno: 697
  md: '# # 死锁的诊断与解除


    +   - 允许死锁发生


    +   - 解除死锁


    +   - 由DBMS的并发控制子系统定期检测系统中是否存在死锁


    +   - 一旦检测到死锁，就要设法解除'
  merge: -1
  img_proc: true
- pgno: 698
  md: "# # 死锁的诊断与解除\n\n+   - 检测死锁： 超时法  \n+     如果一个事务的等待时间超过了规定的时限，就认为发生了死锁\n\n+\
    \   - 优点：  \n+     - 实现简单\n\n+   - 缺点：  \n+     - 有可能误判死锁  \n+     - 时限若设置得太长，死锁发生后不能及时发现"
  merge: -1
