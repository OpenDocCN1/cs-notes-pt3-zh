- pgno: 327
  md: "# # 连接查询\n\n+   - **基本含义**\n+     同时涉及多个表的查询称为连接查询\n+     - 用来连接两个表的条件称为连接条件或连接谓词\n\
    +       一般格式：\n\n```\n［<表名1>．］<列名1>  <比较运算符>  ［<表名2>．］<列名2>\n```\n\n比较运算符：=、>、<、>=、<=、!=\n\
    \n```\n［<表名1>．］<列名1> BETWEEN ［<表名2>．］<列名2>\n                         AND ［<表名2>．］<列名3>\n\
    ```\n\n+   - **连接字段**\n+     连接谓词中的列名称为连接字段\n+     连接条件中的各连接字段类型必须是可比的，但不必是相同的"
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 连接查询


    +   - SQL中连接查询的主要类型

    +     - ¤ 广义笛卡尔积

    +     - ¤ 等值连接(含自然连接)

    +     - ¤ 非等值连接查询

    +     - ¤ 自身连接查询

    +     - ¤ 外连接查询

    +     - ¤ 复合条件连接查询'
  merge: -1
  img_proc: true
