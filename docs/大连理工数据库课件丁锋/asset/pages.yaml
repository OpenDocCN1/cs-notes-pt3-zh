- pgno: 304
  md: "# # 单表查询\n\n+   - 查询满足条件的元组  \n+     Where子句常用查询条件\n\n| 查询条件 | 谓词 |\n|---|---|\n\
    | 比较 | =,<,>,<=,>=,!=,!<,!>,NOT+前述操作符 |\n| 确定范围 | BETWEEN...AND,NOT BETWEEN...AND\
    \ |\n| 确定集合 | IN,NOT IN |\n| 字符匹配 | LIKE,NOT LIKE |\n| 空值 | IS NULL, IS NOT NULL\
    \ |\n| 多重条件 | AND,OR |"
