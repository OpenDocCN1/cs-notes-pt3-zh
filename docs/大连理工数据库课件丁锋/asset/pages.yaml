    \ 唯一标识每个学生  \n别名： 学生编号  \n类型： 字符型  \n长度： 8  \n取值范围： 00000000至99999999  \n取值含义：\
    \ 前两位标别该学生所在年级，后六位按顺序编号  \n与其他数据项的逻辑关系："
  merge: -1
