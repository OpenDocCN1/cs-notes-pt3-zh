- pgno: 460
  md: '# 数据抽象


    +   - 数据抽象


    概念结构是对现实世界的一种抽象，是从实际的人、物、事和概念中抽取所关心的共同特性，忽略非本质的细节。这些共同特性被各种概念精确地加以描述，然后这些概念又组成了某种模型'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# # 数据抽象


    +   - 三种常用抽象

    +     - 1. 分类（Classification）

    +       定义某一类概念作为现实世界中一组对象的类型。这些对象具有某些共同的特性和行为。它抽象了对象值和型之间的“is member of”的语义，在E-R模型中，实体型就是这种抽象。

    +     - 2. 聚集（Aggregation）

    +       定义某一类型的组成成分。它抽象了对象内部类型和成分之间“is part of”的语义，在E-R模型中若干属性的聚集组成了实体型，就是这种抽象

    +     - 3. 概括（Generalization）

    +       定义类型之间的一种子集联系。它抽象了类型之间的“is subset of”的语义。概括有一个很重要的性质：继承性。子类继承超类上定义的所有抽象。'
  merge: -1
  img_proc: true
- pgno: 462
  md: '# 数据抽象


    +   • 数据抽象的用途


    对需求分析阶段收集到的数据进行分类、组织（聚集），形成


    +   • 实体


    +   • 实体的属性，标识实体的码


    +   • 确定实体之间的联系类型(1:1, 1:n, m:n)'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# # 局部视图设计


    +   - 设计分E-R图的步骤：


