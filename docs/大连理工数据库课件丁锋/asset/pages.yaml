- pgno: 225
  md: "# # 数据依赖\n\n+   - 函数依赖  \n+   函数依赖是最常见的一种数据依赖。\n\n+   - 两种定义  \n+     - 函数依赖：设\\\
    ( R(U) \\)是属性集\\( U \\)上的关系模式，\\( X,Y \\)是\\( U \\)的子集。若对于\\( R(U) \\)的任意一个可能的关系\\\
    ( r \\)，\\( r \\)中不可能存在两个元组在\\( X \\)上的属性值相等，而在\\( Y \\)上的属性值不等，则称\\( X \\)函数确定\\\
    ( Y \\)或\\( Y \\)函数依赖\\( X \\)。记作 \\( X \\to Y \\)。\\( X \\)称为这个函数依赖的决定属性集(Determinant)。\
    \  \n+     - 函数依赖：\\( r \\)中任意两个元组\\( t,s \\)，若\\( t[X] = s[X] \\)，则\\( t[Y] =\
    \ s[Y] \\)，则称\\( X \\to Y \\)。"
  merge: -1
  img_proc: true
