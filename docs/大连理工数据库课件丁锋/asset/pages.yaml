    \ |\n| 逻辑结构设计 | 某种数据模型<br>关系<br>非关系 | 系统结构图（模块结构） |\n| 物理设计 | 存储安排<br>方法选择<br>存取路径建立\
    \ | 模块设计<br>IPO表 |\n| 实施阶段 | 编写模式<br>装入数据<br>数据库运行 | 程序编码、<br>编译联结、<br>测试 |\n\
    | 运行维护 | 性能监测、转储/恢复<br>数据库重组和重构 | 新旧系统转换、运行、维护（修正性、适应性、改善性维护） |\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_422_0.png)\n\
    \n![](img/67cf9517c4d3576174ca2f10eafe50de_422_1.png)\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_422_2.png)\n\
