- pgno: 565
  md: '# # 确定数据库物理结构


    # ## 影响数据存放位置和存储结构的因素


    +   - 硬件环境


    +   - 应用需求


    +   - 存取时间


    +   - 存储空间利用率


    +   - 维护代价


    这三个方面常常是相互矛盾的


    +   - 消除一切冗余数据虽能够节约存储空间和减少维护代价，但往往会导致检索代价的增加，必须进行权衡，选择一个折中方案。'
  merge: -1
  img_proc: true
