- pgno: 57
  md: '# # 概念模型


    +   - ER模型基本概念

    +     - 各个属性在实体集中的地位是不一样的

    +     - 码属性与非码属性

    +       - 例：学生的学号与籍贯

    +     - 超码

    +       是一个或多个属性的集合，该组合可以在该实体集中唯一标识一个实体。

    +     - 候选码

    +       它的任意真子集都不能成为超码。（最小超码）

    +     - 主码

    +       被数据库设计者选中的，用来在同一实体集中区分不同实体的候选码。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # 概念模型


    +   - ER模型基本概念


    +   - 派生属性


    这类属性的值可以从别的相关属性或实体派生出来


    +   - 例： 假设实体集employee有两个属性hiredate和employment-duration分别表示银行员工参加工作的时间和在银行工作的年限，那么employment-duration的值可以由hiredate和当前日期得到。在这里，hiredate称为基属性或存储属性。'
  merge: -1
  img_proc: true
