- pgno: 342
  md: '# # 嵌套查询（子查询）


    +   - 带有ANY或ALL谓词的子查询

    +     - ANY: 任意一个值

    +     - ALL: 所有值

    +     - 配合使用比较运算符的含义

    +       - > ANY 大于子查询结果中的某个值

    +       - > ALL 大于子查询结果中的所有值

    +       - < ANY 小于子查询结果中的某个值

    +       - < ALL 小于子查询结果中的所有值

    +       - >= ANY 大于等于子查询结果中的某个值

    +       - >= ALL 大于等于子查询结果中的所有值

    +       - <= ANY 小于等于子查询结果中的某个值

    +       - <= ALL 小于等于子查询结果中的所有值

    +       - = ANY 等于子查询结果中的某个值

    +       - =ALL 等于子查询结果中的所有值（没有实际意义）

    +       - !=（或<>）ANY 不等于子查询结果中的某个值

    +       - !=（或<>）ALL 不等于子查询结果中的任何一个值'
  merge: -1
  img_proc: true
