- pgno: 445
  md: '# # 数据流


    +   - 数据流是数据结构在系统内传输的路径。


    +   - 对数据流的描述


    数据流描述 = {数据流名，说明，数据流来源，数据流去向，组成：{数据结构}，平均流量，高峰期流量}


    +   - 数据流来源是说明该数据流来自哪个过程


    +   - 数据流去向是说明该数据流将到哪个过程去


    +   - 平均流量是指在单位时间（每天、每周、每月等）里的传输次数


    +   - 高峰期流量则是指在高峰时期的数据流量


