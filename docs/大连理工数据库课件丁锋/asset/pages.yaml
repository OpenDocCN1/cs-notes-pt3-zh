  md: '# # 介质故障的恢复


    +   - 介质故障的恢复需要DBA介入


    +   - DBA的工作


    +   ❖ 重装最近转储的数据库副本和有关的各日志文件副本


    +   ❖ 执行系统提供的恢复命令，具体的恢复操作仍由DBMS完成


    +   - 整个恢复过程由两部分组成：


    +   ❖ 1. 重装数据库，使数据库恢复到一致性状态


    +   ❖ 2. 重做已完成的事务'
