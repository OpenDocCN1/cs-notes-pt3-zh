- pgno: 117
  md: '# 数据库系统外部的体系结构


    +   • 客户端 / 服务器结构的数据库系统


    +   □ 优点


    +   • 客户端的用户请求被传送到数据库服务器，数据库服务器进行处理后，只将结果返回给用户，从而显著减少了数据传输量

    +   • 数据库更加开放

    +   • 客户与服务器一般都能在多种不同的硬件和软件平台上运行

    +   • 可以使用不同厂商的数据库应用开发工具'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # 数据库系统外部的体系结构


    +   - 客户 / 服务器结构的数据库系统


    +   ✘ 缺点（“胖客户”问题）


    +   - 系统安装复杂，工作量大。


    +   - 应用维护困难，难于保密，造成安全性差。


    +   - 相同的应用程序要重复安装在每一台客户机上，从系统总体来看，大大浪费了系统资源。系统规模达到数百数千台客户机，它们的硬件配置、操作系统又常常不同，要为每一个客户机安装应用程序和相应的工具模块，其安装维护代价便不可接受了。'
  merge: -1
  img_proc: true
