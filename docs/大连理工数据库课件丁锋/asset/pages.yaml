- pgno: 110
  md: '# # 数据库系统外部的体系结构


    +   - 单用户数据库系统


    整个数据库系统(应用程序、DBMS、数据)装在一台计算机上，为一个用户独占，不同机器之间不能共享数据。


    例如：


    一个企业的各个部门都使用本部门的机器来管理本部门的数据，各个部门的机器是独立的。由于不同部门之间不能共享数据，因此企业内部存在大量的冗余数据。例如人事部门、会计部门、技术部门必须重复存放每一名职工的一些基本信息（职工号、姓名等）。


    > > 单用户数据库系统是早期的最简单的数据库系统'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 数据库系统外部的体系结构


    +   - **主从式结构的数据库系统**

    +     一个主机带多个终端的多用户结构，数据库系统（包括应用程序、DBMS、数据）集中存放在主机上，所有处理任务都由主机来完成，各个用户通过主机的终端并发地存取数据库，共享数据资源'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 数据库系统外部的体系结构


    +   - 主从式结构的数据库系统

    +     - 优点

    +       - 易于管理、控制与维护。

    +     - 缺点

    +       - 当终端用户数目增加到一定程度后，主机的任务会过分繁重，成为瓶颈，从而使系统性能下降。

    +       - 系统的可靠性依赖主机，当主机出现故障时，整个系统都不能使用。'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# # 数据库系统外部的体系结构\n\n+   - 分布式结构的数据库系统  \n+   数据库中的数据在逻辑上是一个整体，但物理地分布在计算机网络的不同结点上。\n\
    \n+   - 网络中的每个结点都可以独立处理本地数据库中的数据，执行局部应用\n\n+   - 同时也可以同时存取和处理多个异地数据库中的数据，执行全局应用"
  merge: -1
  img_proc: true
- pgno: 114
  md: '# # 数据库系统外部的体系结构


    +   - 分布式结构的数据库系统


    +   - 优点


    +   - 适应了地理上分散的公司、团体和组织对于数据库应用的需求。


    +   - 缺点


    +   - 数据的分布存放给数据的处理、管理与维护带来困难。


    +   - 当用户需要经常访问远程数据时，系统效率会明显地受到网络传输的制约。'
  merge: -1
  img_proc: true
