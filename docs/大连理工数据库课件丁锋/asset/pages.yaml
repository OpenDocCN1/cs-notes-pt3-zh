- pgno: 569
  md: '# 评价物理结构


    +   - **评价内容**

    +     对数据库物理设计过程中产生的多种方案进行细致的评价，从中选择一个较优的方案作为数据库的物理结构


    +   - **评价方法**

    +     - ¤ 定量估算各种方案

    +       - 存储空间

    +       - 存取时间

    +       - 维护代价

    +     - ¤ 对估算结果进行权衡、比较，选择出一个较优的合理的物理结构。如果该结构不符合用户需求，则需要修改设计'
