- pgno: 726
  md: '# # 意向锁


    +   - SIX锁


    如果对一个数据对象加SIX锁，表示对它加S锁，再加IX锁，即SIX = S + IX。


    例：对某个表加SIX锁，则表示该事务要读整个表（所以要对该表加S锁），同时会更新个别元组（所以要对该表加IX锁）。'
  merge: -1
