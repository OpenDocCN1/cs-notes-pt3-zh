- pgno: 564
  md: '# # 确定数据库物理结构


    # ## 确定数据库物理结构的内容


    +   1. 确定数据的存放位置和存储结构

    +      - 关系

    +      - 索引

    +      - 聚簇

    +      - 日志

    +      - 备份


    +   2. 确定系统配置'
  merge: -1
