- pgno: 319
  md: '# # 单表查询


    +   - 聚集函数

    +     - SUM ([DISTINCT|ALL] *)

    +     - SUM ([DISTINCT|ALL] <column>)

    +       计算值的总和并返回总数

    +     - COUNT ([DISTINCT|ALL] <column> )

    +       计算记录数

    +     - AVG ([DISTINCT|ALL] <column> )

    +       返回指定列中的平均值

    +     - MIN ([DISTINCT|ALL] <column> )

    +       返回自变量中指定列的最小值

    +     - MAX ([DISTINCT|ALL] <column> )

    +       返回自变量中指定列的最大值

    +     - DISTINCT短语：在计算时要取消指定列中的重复值

    +       ALL短语：不取消重复值

    +       ALL为缺省值'
  merge: -1
  img_proc: true
