- pgno: 443
  md: '# 数据结构


    +   - 数据结构反映了数据之间的组合关系。


    +   - 一个数据结构可以由若干个数据项组成，也可以由若干个数据结构组成，或由若干个数据项和数据结构混合组成。


    +   - 对数据结构的描述


    数据结构描述 = { 数据结构名，含义说明，组成：{ 数据项或数据结构 } }'
