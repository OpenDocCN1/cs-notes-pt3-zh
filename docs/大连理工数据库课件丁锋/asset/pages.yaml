  md: '# 视图


    +   - 查询视图错误：


    ```

    SELECT Sno, AVG(Grade)

    FROM SC

    WHERE AVG(Grade)>=90

    GROUP BY Sno;

    ```


    正确：


    ```

    SELECT Sno, AVG(Grade)

    FROM SC

    GROUP BY Sno

    HAVING AVG(Grade)>=90;

    ```


