- pgno: 236
  md: '# # 范式


    +   - 范式是符合某一种级别的关系模式的集合。

    +   - 关系数据库中的关系必须满足一定的要求。满足不同程度要求的为不同范式。

    +   - 范式的种类：

    +     - 第一范式(1NF)

    +     - 第二范式(2NF)

    +     - 第三范式(3NF)

    +     - Boyce-Codd范式(BCNF)

    +     - 第四范式(4NF)

    +     - 第五范式(5NF)'
  merge: -1
  img_proc: true
