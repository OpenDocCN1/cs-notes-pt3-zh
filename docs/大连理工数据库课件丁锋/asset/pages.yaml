- pgno: 552
  md: "# # 关系模式存取方法选择\n\n+   - 数据库系统是多用户共享的系统，对同一个关系要建立多条存取路径才能满足多用户的多种应用要求。\n\n+\
    \   - 物理设计的第一个任务就是要确定选择哪些存取方法，即建立哪些存取路径。\n\n+   - DBMS常用存取方法  \n+     - 索引方法，目前主要是B+树索引方法\
    \  \n+     - 聚簇（Cluster）方法  \n+     - HASH方法"
  merge: -1
  img_proc: true
- pgno: 553
  md: '# # 关系模式存取方法选择


    +   - 索引存取方法的选择

    +     - 选择索引存取方法的主要内容

    +       根据应用要求确定

    +       - 对哪些属性列建立索引

    +       - 对哪些属性列建立组合索引

    +       - 对哪些索引要设计为唯一索引

    +     - 选择索引存取方法的一般规则

    +       - 如果一个(或一组)属性经常在查询条件中出现，则考虑在这个(或这组)属性上建立索引(或组合索引)

    +       - 如果一个属性经常作为最大值和最小值等聚集函数的参数，则考虑在这个属性上建立索引

    +       - 如果一个(或一组)属性经常在连接操作的连接条件中出现，则考虑在这个(或这组)属性上建立索引

    +     - 关系上定义的索引数过多会带来较多的额外开销

    +       - 维护索引的开销

    +       - 查找索引的开销'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# # 关系模式存取方法选择


    +   ## 聚簇索引

    +   建立聚簇索引后，基表中数据也需要按指定的聚簇属性值的升序或降序存放。也即聚簇索引的索引项顺序与表中元组的物理顺序一致。

    +   在一个基本表上最多只能建立一个聚簇索引


    +   ## 聚簇索引的用途

    +   对于某些类型的查询，可以提高查询效率


    +   ## 聚簇索引的适用范围

    +   - 很少对基表进行增删操作

    +   - 很少对其中的变长列进行修改操作


    ![](img/67cf9517c4d3576174ca2f10eafe50de_554_0.png)'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# 关系模式存取方法选择


    +   • 聚簇


    为了提高某个属性（或属性组）的查询速度，把这个或这些属性（称为聚簇码）上具有相同值的元组集中存放在连续的物理块称为聚簇。许多关系型DBMS都提供了聚簇功能'
  merge: -1
  img_proc: true
- pgno: 556
  md: '# # 关系模式存取方法选择


    # ## 聚簇的用途


    +   - 大大提高按聚簇属性进行查询的效率


    +   - 例：假设学生关系按所在系建有索引，现在要查询信息系的所有学生名单。信息系的500名学生分布在500个不同的物理块上时，至少要执行500次I/O操作。如果将同一系的学生元组集中存放，则每读一个物理块可得到多个满足查询条件的元组，从而显著地减少了访问磁盘的次数。


    +   - 节省存储空间


    +   - 聚簇以后，聚簇码相同的元组集中在一起了，因而聚簇码值不必在每个元组中重复存储，只要在一组中存一次就行了'
  merge: -1
  img_proc: true
- pgno: 557
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 558
  md: '# 关系模式存取方法选择


    +   聚簇的适用范围

    +   □ 既适用于单个关系独立聚簇，也适用于多个关系组合聚簇


    +   例：假设用户经常要按系别查询学生成绩单，这—查询涉及学生关系和选修关系的连接操作，即需要按学号连接这两个关系，为提高连接操作的效率，可以把具有相同学号值的学生元组和选修元组在物理上聚簇在一起。这就相当于把多个关系系统按“预连接”的形式存放，从而大大提高连接操作的效率。'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# # 关系模式存取方法选择


    +   - 聚簇的适用范围


    □ 当通过聚簇码进行访问或连接是该关系的主要应用， 与聚簇码无关的其他访问很少或者是不重要的时，可以使用聚簇。


    +   - 尤其当SQL语句中包含有与聚簇码有关的ORDER BY, GROUP BY, UNION, DISTINCT等子句或短语时，使用聚簇特别有利，可以省去对结果集的排序操作'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# 关系模式存取方法选择


    +   - 选择聚簇存取方法


    # ¤ 1.设计候选聚簇


    +   - 对经常在一起进行连接操作的关系可以建立组合聚簇；

    +   - 如果一个关系的一组属性经常出现在相等比较条件中，则该单个关系可建立聚簇；

    +   - 如果一个关系的一个（或一组）属性上的值重复率很高，则此单个关系可建立聚簇。即对应每个聚簇码值的平均元组数不太少。太少了，聚簇的效果不明显。'
  merge: -1
  img_proc: true
