- pgno: 543
  md: "# 小结\n\n+   - **E-R图向关系模型的转换内容**\n+     将E-R图转换为关系模型：将实体、实体的属性和实体之间的联系转化为关系模式。\n\
    +   \n+   - **E-R图向关系模型的转换原则**\n+     - 1. 一个**实体型**转换为一个关系模式。\n+     - 2. 一个**m:n联系**转换为一个关系模式。\n\
    +     - 3. 一个**1:n联系**可以转换为一个独立的关系模式，也可以与n端对应的关系模式合并。\n+     - 4. 一个**1:1联系**可以转换为一个独立的关系模式，也可以与任意一端对应的关系模式合并。\n\
    +     - 5. 两个或两个以上实体间的一个**多元联系**转换为一个关系模式。\n+     - 6. 同一实体集的实体间的联系，即**自联系**，也可按上述1:1、1:n和m:n三种情况分别处理。\n\
    +     - 7. 具有**相同码**的关系模式可合并。"
  merge: -1
  img_proc: true
