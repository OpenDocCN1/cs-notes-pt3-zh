- pgno: 273
  md: '# # SQL数据定义语言


    # ## 基本表的创建-说明


    +   建表的同时可以定义与该表有关的完整性约束,这些约束条件被存入系统的数据字典中,当用户操作表时,DBMS会自动检查该操作是否有违背完整约束条件。


    +   建立约束的考虑：如果完整性约束条件涉及到该表的多个属性列，则必须定义在表级上；否则既可以定义在列级上也可以定义在表级上。


    +   表名、列名是不区分大小写的。


    +   对一个用户而言，表名必须唯一；一个表中，列名必须唯一。


    +   表名、列名必须以字母开头，长度不超过30个字符。'
  merge: -1
  img_proc: true
