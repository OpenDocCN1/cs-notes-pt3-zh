  md: '# 连接查询


    +   • 复合条件连接


    WHERE子句中含多个连接条件时，称为复合条件连接


    例：查询选修2号课程且其成绩在90分以上的所有学生的学号、姓名


    ```

    SELECT Student.Sno, student.SName

    FROM Student, SC

