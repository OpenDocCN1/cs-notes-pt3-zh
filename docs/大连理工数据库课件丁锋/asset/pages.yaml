- pgno: 160
  md: '# # 关系的完整性


    +   - 实体完整性（Entity Integrity）

    +   规则： 若属性A是基本关系R的主属性，则属性A 不能为NULL。

    +   如： student(name,sex,addr)中name不能为空。


    说明：

    实体完整性是对基本关系而言的。通常对应现实世界的一个实体。如学生关系。现实中，实体是可以区分的，他们具有唯一的标识。


    关系模型中用主键区分不同的元组。主码中的属性不能为“空”。“空”表示不知道或不确定。'
  merge: -1
  img_proc: true
- pgno: 161
  md: "# # 关系的完整性\n\n+   - 参照完整性（Referential Integrity）  \n+     现实中，实体间存在着某种联系，关系模型中实体和实体间的联系都是用关系来描述的。因此必然存在关系之间的相互引用。即，一个关系中某些属性的取值需要参照其他关系的属性取值\n\
    \n# ## 关系间引用的例子\n\n+   - 学生（学号，姓名，性别，专业号，年龄）\n+   - 课程（课程号，课程名，学分）\n+   - 专业（专业号，专业名）\n\
    +   - 选修（学号，课程号，成绩）"
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 关系的完整性


    +   - 参照完整性


    不仅两个或两个以上的关系间可以存在引用关系，同一关系内部属性间也可能存在引用关系


    例：


    职工（职工号，领导编号，姓名）


    ![](img/67cf9517c4d3576174ca2f10eafe50de_162_0.png)'
  merge: -1
