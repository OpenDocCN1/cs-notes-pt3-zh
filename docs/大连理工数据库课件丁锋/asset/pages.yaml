- pgno: 495
  md: '# 视图的集成


    +   • 冗余

    +   冗余包括两方面：冗余的数据是指可由基本数据导出的数据，冗余的联系是指可由其他联系导出联系。


    +   • 冗余数据和冗余联系容易破坏数据库的完整性，给数据库维护增加困难，但并不是所有的冗余数据与冗余联系都必须加以消除，有时为了提高某些应用的效率，不得不以冗余信息作为代价。


    +   • 设计数据库概念结构时，哪些冗余信息必须消除，哪些冗余信息允许存在，需要根据用户的整体需求来确定。


    +   • 消除不必要的冗余后的初步E-R图称为基本E-R图。'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# # 视图的集成


    +   - 消除冗余的方法


    +   - 分析方法


    以数据字典和数据流图为依据，根据数据字典中关于数据项之间逻辑关系的说明来消除冗余。


    +   - 比如：


    教师工资单中包括该教师的基本工资、各种补贴、应扣除的房租水电费以及实发工资。

    由于实发工资可以由前面各项推算出来，因此可以去掉，在需要查询实发工资时根据基本工资、各种补贴、应扣除的房租水电费数据临时生成。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# # 视图的集成


    +   - 消除冗余的方法


    +   - 分析方法


    +   - 如果是为了提高效率，人为地保留了一些冗余数据，则应把数据字典中数据关联的说明作为完整性约束条件。


    +   - 一种更好的方法是把冗余数据定义在视图中'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# # 视图的集成


    +   - 消除冗余的方法


    +   - 规范化理论


    函数依赖的概念提供了消除冗余联系的形式化工具


    +   - 方法


    +   1. 确定分E-R图实体之间的数据依赖FL 。实体之间一对一、一对多、多对多的联系可以用实体码之间的函数依赖来表示。例：班级和学生之间一对多的联系：学号→班级号；学生和课程之间多对多的联系：（学号，课程号）→成绩。

    +   2. 求\(F_L\)的最小覆盖\(G_L\)，差集为\(D = F_L-G_L\)。逐一考察\(D\)中的函数依赖，确定是否是冗余的联系，若是，就把它去掉。'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# # 视图的集成


    +   - 例：消除冗余


    学生实体中的年龄属性可以由出生日期推算出来，属于冗余数据，应该去掉。这样不仅可以节省存储空间，而且当某个学生的出生日期有误，进行修改后，无须相应修改年龄，减少了产生数据不一致的机会。


    学生：

    {学号，姓名，出生日期，所在系，年级，平均成绩}'
  merge: -1
