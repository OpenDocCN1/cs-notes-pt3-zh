- pgno: 271
  md: '# # SQL概述


    +   1. **SQL DDL**：定义关系模式、删除关系、建立索引以及修改关系模式；

    +   2. **SQL DML**：查询、插入、删除和修改；

    +   3. **嵌入式DML**：嵌入在Pascal、C等宿主语言；

    +   4. **视图定义**：创建视图；

    +   5. **权限管理**：对关系和视图的访问进行授权；

    +   6. **完整性**：定义数据必须满足的完整性约束条件；

    +   7. **事务控制**：定义事务的开始、提交、和结束等。


    SQL语言包括的内容'
