- pgno: 52
  md: '# # 概念模型


    +   - ER模型基本概念


    +   - 实体：

    +     实体是现实世界中可区别于其他对象的“事件”或“物体”。每个实体有一组性质，其中一部分性质的取值可以唯一地标识实体。

    +     - 例如：张三、宝马、一笔贷款、登山活动


    +   - 实体集：

    +     实体集是具有相同类型及相同性质(或属性)的实体集合。

    +     - 例：学生、机动车、贷款、体育活动'
  merge: -1
  img_proc: true
- pgno: 53
  md: "# # 概念模型\n\n+   - ER模型基本概念\n\n+   - 属性  \n+     是实体集中每个成员(实体)具有的描述性性质。  \n\
    +     - 例如：人的身高、机动车的排量、贷款的金额\n\n+   - 实体集的属性是将实体集中的实体映射到属性域的函数  \n+     - 例：张三的年龄为18岁\
    \  \n+       李四的年龄为40岁  \n+       ...的年龄为...岁"
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # 概念模型


    +   - ER模型基本概念


    +   - 属性的划分


    描述实体集的属性可以根据组成、取值和导出关系简单地划分为以下几类


    +   - 简单属性/复合属性


    +   - 单值属性/多值属性


    +   - 派生属性'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 概念模型


    +   ER模型基本概念

    +   简单属性

    +   不能再划分为更小的部分(即别的属性)的属性；

    +   复合属性

    +   可以再划分为别的属性的属性。


    +   复合属性可以将相关属性聚集起来，使模型更加清晰

    +   例：住址=省+市+县+街道'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # 概念模型


    +   - ER模型基本概念


    +   - 单值属性


    对一个特定的实体而言一个属性只有单独的一个值


    +   - 多值属性


    对某个特定的实体来说，一个属性可能对应一组值'
  merge: -1
