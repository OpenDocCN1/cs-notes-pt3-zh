- pgno: 721
  md: '# 意向锁


    +   意向锁（intention lock）


    +   对任一结点加基本锁，必须先对它的上层结点加意向锁


    +   如果对一个结点加意向锁，则说明该结点的下层结点正在被加锁


    +   引进意向锁目的


    +   提高对某个数据对象加锁时系统的检查效率'
  merge: -1
  img_proc: true
- pgno: 722
  md: '# 意向锁


    +   • 例：对任一元组 r 加锁，先关系 R 加意向锁


    ![](img/67cf9517c4d3576174ca2f10eafe50de_722_0.png)


    +   ¤ 事务 T 要对关系 R 加 X 锁，系统只要检查根结点数据库和关系 R 是否已加了不相容的锁，


    +   ¤ 不需要搜索和检查 R 中的每一个元组是否加了 X 锁'
  merge: -1
