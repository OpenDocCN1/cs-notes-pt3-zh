  md: '# 视图


    # 删除视图


    ```

    ```sql

    DROP VIEW view_name;

    ```

    ```


    +   - 该语句从数据字典中删除指定的视图定义

    +   - 由该视图导出的其他视图定义仍在数据字典中，但已不能使用，必须显式删除

