- pgno: 602
  md: "# # 事务的基本概念\n\n+   - 事务(Transaction)是用户定义的一个数据库操作序列，这些操作要么全做，要么全不做，是一个不可分割的工作单位\n\
    \n+   - 事务和程序是两个概念  \n+     - 在关系数据库中，一个事务可以是一条SQL语句，一组SQL语句或整个程序  \n+     - 一个应用程序通常包含多个事务\n\
    \n+   - 事务是恢复和并发控制的基本单位\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_602_0.png)"
  merge: -1
  img_proc: true
- pgno: 603
  md: '# # 如何定义事务


    +   - 显式定义方式


    ```

    ```

    BEGIN TRANSACTION

    SQL 语句1

    SQL 语句2

    SQL 语句3

    ......

    COMMIT

    ```

    ```


    ```

    ```

    BEGIN TRANSACTION

    SQL 语句1

    SQL 语句2

    SQL 语句3

    ......

    ROLLBACK

    ```

    ```


    +   - 隐式方式

    +   当用户没有显式地定义事务时， DBMS按缺省规定自动划分事务'
  merge: -1
  img_proc: true
- pgno: 604
  md: '# # 事务结束语句


    +   - COMMIT

    +     - 事务正常结束

    +     - 提交事务的所有操作（读+更新）

    +     - 事务中所有对数据库的更新永久生效

    +   - ROLLBACK

    +     - 事务异常终止

    +     - 事务运行的过程中发生了故障，不能继续执行

    +     - 回滚事务的所有更新操作

    +     - 事务滚回到开始时的状态'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# # 事务的特性


    +   - 事务的ACID特性：

    +     - 原子性（Atomicity）

    +     - 一致性（Consistency）

    +     - 隔离性（Isolation）

    +     - 持续性（Durability）'
  merge: -1
  img_proc: true
- pgno: 606
  md: "# 一致性与原子性\n\n+   - **原子性（Atomicity）**  \n+     事务是数据库的逻辑工作单位  \n+     事务中包括的诸操作要么都做，要么都不做\n\
    +   \n+   - **一致性（Consistency）**  \n+     事务执行的结果必须是使数据库从一个一致性状态变到另一个一致性状态\n+\
    \     - 一致性状态：数据库中只包含成功事务提交的结果\n+     - 不一致状态：数据库中包含失败事务的结果"
  merge: -1
  img_proc: true
- pgno: 607
  md: '# 一致性与原子性


    +   - 银行转账：从帐号A中取出一万元，存入帐号B。

    +   - 定义一个事务，该事务包括两个操作


    | A | B |

    |---|---|

    | A=A-1 | B=B+1 |


    +   - 这两个操作要么全做，要么全不做

    +   - 全做或者全不做，数据库都处于一致性状态。

    +   - 如果只做一个操作，数据库就处于不一致性状态。'
  merge: -1
  img_proc: true
- pgno: 608
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 609
  md: '# # 隔离性


    | T₁ | T₂ |

    |---|---|

    | ① 读A=16 | |

    | ② | 读A=16 |

    | ③ A←A-1 写回A=15 | |

    | ④ | A←A-3 写回A=13 |


    T1的修改被T2覆盖了！'
  merge: -1
  img_proc: true
- pgno: 610
  md: '# 持续性


    +   持久性也称永久性（Permanence）


    +   一个事务一旦提交，它对数据库中数据的改变就应该是永久性的。


    +   接下来的其他操作或故障不应该对其执行结果有任何影响。'
  merge: -1
  img_proc: true
- pgno: 611
  md: '# # 事务的特性


    +   - 保证事务ACID特性是事务处理的任务

    +   - 破坏事务ACID特性的因素

    +     - 多个事务并行运行时，不同事务的操作交叉执行

    +     - 事务在运行过程中被强行停止'
  merge: -1
