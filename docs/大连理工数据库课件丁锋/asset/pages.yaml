- pgno: 147
  md: '# # 关系数据结构


    +   - 关系：

    +     \( D_1 \times D_2 \times \dots \times D_n \) 的子集叫做在域 \( D_1, D_2, \dots,
    D_n \) 上的关系。

    +     记为：\( R(D_1, D_2, \dots, D_n) \)

    +     其中：

    +     - R — 表示关系名

    +     - n — 称为关系的目或度，1 单元关系，2 二元关系

    +     - t — 表示关系中的元组。


    +   - 元组：

    +     关系是笛卡尔积的有限子集，所以是一个二维表，表的每行对应一个元组，每列对应一个域。


    +   - 属性：

    +     域可以相同，为了区分域，必须对每列起一个名字，称为属性（Attribute）。


    ![](img/67cf9517c4d3576174ca2f10eafe50de_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# # 关系数据结构


    +   - **候选码（Candidate key）**：

    +   若关系中的某一（最小）属性组的值能唯一地标识一个元组，

    +   则该（最小）属性组称为候选码。


    +   - **主码（Primary key）**：

    +   若关系中有多个候选码，则选定其中的一个为主码。


    +   - **主属性（Prime attribute）**：

    +   候选码的诸属性称为主属性。


    +   - **非主属性（Nonprime attribute）**：

    +   不被任何候选码包含的属性。


    +   - **全码（All-key）**：

    +   关系模式的所有属性共同组成这个关系模式的候选码'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 关系数据结构


    +   - 认识关系--关系与表


    在数学上将关系定义为一系列域上的笛卡儿积的子集。这一定义与我们对表的定义几乎是完全相符的，从目前来看，唯一的区别在于我们给表中的属性赋予了名称，而关系则没有。由于表实际上就是关系，因此在关系模型中，用数学名词关系和元组来代表表和行。'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# # 关系数据结构\n\n+   - **认识关系**\n+   \n+     **关系和笛卡尔积**\n+   \n+     关系是笛卡尔积的有限子集。无限关系在数据库系统中是无意义的。\n\
    +   \n+     由于笛卡尔积不满足交换律：\n+   \n+     \\[\n+     (d_1,d_2,\\ldots,d_n) \\ne (d_2,d_1,\\\
    ldots,d_n)\n+     \\]\n+   \n+     但关系满足交换律，即\n+   \n+     \\[\n+     (d_1,d_2,\\\
    ldots,d_i,d_j,\\ldots,d_n)=(d_1,d_2,\\ldots,d_j,d_i,\\ldots,d_n) \\quad (i,j=1,2,\\\
    ldots,n)\n+     \\]\n\n+   - **解决方法：**为关系的每个列附加一个属性名以取消关系元组的有序性"
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 关系数据结构


    +   - 认识关系

    +     - 数学意义上的关系

    +       - 关系可以是一个无限集合。

    +       - 不满足交换律，即 `(d₁,d₂,…,dₙ) ≠ (d₂,d₁,…,dₙ)`。


    +   - 作为关系模型数据结构的关系

    +     - 关系必须是有限的集合，无限关系在数据库中没有实际意义。

    +     - 采用对关系的属性命名的方法取消关系的有序性。因此每一列属性都有一个属性名，属性的排列顺序可以互换。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 关系数据结构


    +   - 关系的类型

    +     - 基本关系

    +       通常也称为基本表或基表。

    +       这是实际存在的表，是实际存储数据的逻辑表示。

    +     - 查询表

    +       查询结果对应的表。

    +     - 视图表

    +       由基本表或其他视图导出 的表，称虚拟表。

    +       虚拟表不对应实际存储的数据。'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# # 关系数据结构\n\n+   - 关系的性质  \n+     根据对关系的扩充与限定，基本关系具有下列性质：  \n+     - 列是同质的，即每列的属性值是同一类型的数据，来自同一个域。\
    \  \n+     - 不同的列可出自同一个域，每一列称为一个属性，每个属性必须有不同的属性名。属性名可以标识不同的属性。  \n+     - 列的顺序可以任意交换。\
    \  \n+     - 任意两个元组不能完全相同，由主键标识。  \n+     - 元组的顺序可以任意交换。  \n+     - 分量必须取原子值，即每一个分量必须是不可分的数据项（1NF）。不允许表中表的情况。"
  merge: -1
  img_proc: true
- pgno: 154
