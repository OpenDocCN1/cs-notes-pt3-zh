  md: '# # 数据库的物理设计


    # ## 数据库物理设计的步骤


    +   - 确定数据库的物理结构


    +   - 对物理结构进行评价，评价的重点是时间和空间效率


    +   - 如果评价结果满足原设计要求则可进入到物理实施阶段，否则，就需要重新设计或修改物理结构，有时甚至要返回逻辑设计阶段修改数据模型。


    ![](img/67cf9517c4d3576174ca2f10eafe50de_563_0.png)'
  merge: -1
