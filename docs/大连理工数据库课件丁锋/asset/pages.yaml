- pgno: 730
  md: "# # 小结\n\n+   - 数据共享与数据一致性是一对矛盾  \n+     - 数据库的价值在很大程度上取决于它所能提供的数据共享度。  \n\
    +     - 数据共享在很大程度上取决于系统允许对数据并发操作的程度。  \n+     - 数据并发程度又取决于数据库中的并发控制机制  \n+   \
    \  - 另一方面，数据的一致性也取决于并发控制的程度。施加的并发控制愈多，数据的一致性往往愈好。"
  merge: -1
  img_proc: true
- pgno: 731
  md: '# 小结


    +   - 数据库的并发控制以事务为单位

    +   - 数据库的并发控制通常使用封锁机制

    +     - 两类最常用的封锁：共享锁和排他锁

    +   - 不同级别的封锁协议提供不同的数据一致性保证，提供不同的数据共享度。

    +     - 三级封锁协议'
  merge: -1
  img_proc: true
- pgno: 732
  md: '# # 小结


    +   - 并发控制机制调度并发事务操作是否正确的判别准则是可串行性

    +     - 并发操作的正确性则通常由两段锁协议来保证。

    +     - 两段锁协议是可串行化调度的充分条件，但不是必要条件

    +   - 对数据对象施加封锁，也会带来问题

    +     - 活锁： 先来先服务

