- pgno: 707
  md: '# 可串行化的调度（S4）


    | T₁ | T₂ |

    |---|---|

    | Slock B<br>Y=B−2<br>Unlock B<br>Xlock A<br><br>A=Y+1<br>写回A(=3)<br>Unlock A
    | Slock A<br>等待<br>等待<br>等待<br>X=A−3<br>Unlock A<br>Xlock B<br>B=X+1<br>写回B(=4)<br>Unlock
    B |


    +   - 其执行结果与串行调度S1的执行结果相同，是正确的调度。'
  merge: -1
  img_proc: true
- pgno: 708
  md: '# # 如何保证并发操作的调度是正确的


    +   - 为了保证并行操作的正确性，DBMS的并行控制机制必须提供一定的手段来保证调度是可串行化的。


    +   - 从理论上讲，在某一事务执行时禁止其他事务执行的调度策略一定是可串行化的调度，这也是最简单的调度策略，但这种方法实际上是不可行的，因为它使用户不能充分共享数据库资源。


    ![](img/67cf9517c4d3576174ca2f10eafe50de_708_0.png)'
  merge: -1
  img_proc: true
- pgno: 709
  md: '# 如何保证并发操作的调度是正确的


    +   - 保证并发操作调度正确性的方法

    +     - 封锁方法：两段锁（Two-Phase Locking，简称 2PL）协议

    +     - 时标方法

    +     - 乐观方法'
  merge: -1
  img_proc: true
- pgno: 710
  md: '# 两段锁协议


    +   - 两段锁协议的内容

    +     - 1. 在对任何数据进行读、写操作之前，事务首先要获得对该数据的封锁

    +     - 2. 在释放一个封锁之后，事务不再获得任何其他封锁。


    +   - “两段”锁的含义：事务分为两个阶段

    +     - 第一阶段是获得封锁，也称为扩展阶段；

    +     - 第二阶段是释放封锁，也称为收缩阶段。'
  merge: -1
  img_proc: true
- pgno: 711
  md: '# # 两段锁协议


    +   - 例：


    +   - T1遵守两段锁协议，而T2不遵守两段锁协议。


    | T1    | T2    |

    |---|---|

    | Slock A    | Slock A    |

    | Slock B    | Unlock A    |

    | Xlock C    | Slock B    |

    | Unlock B    | Xlock C    |

    | Unlock A    | Unlock C    |

    | Unlock C    | Unlock B    |'
  merge: -1
  img_proc: true
- pgno: 712
  md: '# # 两段锁协议


    +   - 并行执行的所有事务均遵守两段锁协议，则对这些事务的所有并行调度策略都是可串行化的。即，**所有遵守两段锁协议的事务，其并行执行的结果一定是正确的**


    +   - 事务遵守两段锁协议是可串行化调度的充分条件，而不是必要条件


    +   - 可串行化的调度中，不一定所有事务都必须符合两段锁协议。'
  merge: -1
  img_proc: true
- pgno: 713
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 714
  md: '# 两段锁协议


    +   • 两段锁协议与三级封锁协议


    +   □ 两类不同目的的的协议


    +   • 两段锁协议

    +   保证并发调度的正确性


    +   • 三级封锁协议

    +   在不同程度上保证数据一致性


