- pgno: 623
  md: '# # 转储方法-静态转储


    +   - 在系统中无运行事务时进行转储


    +   - 转储开始时数据库处于一致性状态，转储期间不允许对数据库的任何存取、修改活动


    +   - 优点：实现简单


    +   - 缺点：降低了数据库的可用性


    +   - 转储必须等用户事务结束


    +   - 新的事务必须等转储结束'
  merge: -1
  img_proc: true
- pgno: 624
  md: '# # 动态转储


    +   - 转储操作与用户事务并发进行

    +   - 转储期间允许对数据库进行存取或修改


    +   - 优点

    +     - 不用等待正在运行的用户事务结束

    +     - 不会影响新事务的运行

    +   - 缺点

    +     - 不能保证副本中的数据正确有效'
  merge: -1
  img_proc: true
- pgno: 625
  md: '# # 动态转储


    +   - 利用动态转储得到的副本进行故障恢复


    +   - 需要把动态转储期间各事务对数据库的修改活动登记下来，建立日志文件


    +   - 后备副本加上日志文件才能把数据库恢复到某一时刻的正确状态'
  merge: -1
  img_proc: true
- pgno: 626
  md: '# 海量转储与增量转储


    +   • 海量转储: 每次转储全部数据库


    +   • 增量转储: 只转储上次转储后更新过的数据


    ![](img/67cf9517c4d3576174ca2f10eafe50de_626_0.png)


    +   • 海量转储与增量转储比较


    +     - 从恢复角度看，使用海量转储得到的后备副本进行恢复往往更方便


    +     - 但如果数据库很大，事务处理又十分频繁，则增量转储方式更实用更有效'
  merge: -1
  img_proc: true
- pgno: 627
  md: '# # 恢复的实现技术


    +   - 建立冗余数据

    +     - 数据转储


    | 转储方式 | 海量转储 | 动态海量转储 | 静态海量转储 |

    |---|---|---|---|

    | 增量转储 | 动态增量转储 | 静态增量转储 |


    ![](img/67cf9517c4d3576174ca2f10eafe50de_627_0.png)


    ![](img/67cf9517c4d3576174ca2f10eafe50de_627_1.png)'
  merge: -1
  img_proc: true
- pgno: 628
  md: '# # 转储策略


    +   - 应定期进行数据转储，制作后备副本。

    +   - 但转储又是十分耗费时间和资源的，不能频繁进行。

    +   - DBA应该根据数据库使用情况确定适当的转储周期和转储方法。

    +   - 例：

    +     - 每天晚上进行动态增量转储

    +     - 每周进行一次动态海量转储

    +     - 每月进行一次静态海量转储'
  merge: -1
  img_proc: true
- pgno: 629
  md: "# # 日志文件\n\n+   - 日志文件  \n+     日志文件(log)是用来记录事务对数据库的更新操作的文件\n\n+   - 日志文件的格式\
    \  \n+     - 以记录为单位的日志文件  \n+     - 以数据块为单位的日志文件\n\n+   - 日志文件内容  \n+     - 各个事务的开始标记(BEGIN\
    \ TRANSACTION)  \n+     - 各个事务的结束标记(COMMIT或ROLLBACK)  \n+     - 各个事务的所有更新操作  \n\
    +     - 与事务有关的内部更新操作  \n+     - 日志文件中的一个日志记录 (log record)"
  merge: -1
  img_proc: true
- pgno: 630
  md: '# # 基于记录的日志文件


    +   - 每条日志记录的内容

    +     - 事务标识

    +     - 操作类型（插入、删除或修改）

    +     - 操作对象（记录ID、Block NO.）

    +     - 更新前数据的旧值（对插入操作而言，此项为空值）

    +     - 更新后数据的新值（对删除操作而言，此项为空值）'
  merge: -1
  img_proc: true
- pgno: 631
  md: '# 基于数据块的日志文件


    +   - 每条日志记录的内容

    +     - 事务标识（标明是那个事务）

    +     - 操作对象（记录 ID、Block NO.）

    +     - 更新前数据所在的整个数据块的值（对插入操作而言，此项为空值）

    +     - 更新后整个数据块的的值（对删除操作而言，此项为空值）'
  merge: -1
  img_proc: true
- pgno: 632
  md: '# # 日志文件的用途


    # ## 用途


    +   - 进行事务故障恢复

    +   - 进行系统故障恢复

    +   - 协助后备副本进行介质故障恢复

    +     - 与静态转储后备副本配合进行介质故障恢复

    +       - 静态转储的数据已是一致性的数据

    +       - 如果静态转储完成后，仍能定期转储日志文件，则在出现介质故障重装数据副本后，可以利用这些日志文件副本对已完成的事务进行重做处理

    +       - 这样不必重新运行那些已完成的事务程序就可把数据库恢复到故障前某一时刻的正确状态'
  merge: -1
  img_proc: true
- pgno: 633
  md: "# # 日志文件的用途\n\n+   - 介质故障恢复：日志文件 + 动态转储后备副本  \n+     - 动态转储数据库：同时转储同一时点的日志文件\
    \  \n+     - 后备副本与该日志文件结合起来才能将数据库恢复到一致性状态。  \n+     - 利用这些日志文件副本进一步恢复事务，避免重新运行事务程序。"
  merge: -1
  img_proc: true
- pgno: 634
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 635
  md: '# 登记日志文件的原则


    +   - 为什么要先写日志文件

    +     - 写数据库和写日志文件是两个不同的操作，在这两个操作之间可能发生故障

    +     - 如果先写了数据库修改，而在日志文件中没有登记下这个修改，则以后就无法恢复这个修改了

    +     - 如果先写日志，但没有修改数据库，按日志文件恢复时只不过是多执行一次不必要的UNDO操作，并不会影响数据库的正确性'
  merge: -1
  img_proc: true
- pgno: 636
  md: '# 恢复策略-事务故障


    +   • 事务故障：事务在运行至正常终止点前被中止


    恢复方法


    由恢复子系统利用日志文件撤销（UNDO）


    此事务已对数据库进行的修改


    +   • 事务故障的恢复由系统自动完成，不需要用户干预'
  merge: -1
  img_proc: true
- pgno: 637
  md: '# # 事务故障的恢复步骤


    +   1. 反向扫描文件日志（即从最后向前扫描日志文件），查找该事务的更新操作。


    +   2. 对该事务的更新操作执行逆操作。即将日志记录中“更新前的值”（Before Image, BI）写入数据库。

    +      - 插入操作，“更新前的值”为空，则相当于做删除操作

    +      - 删除操作，“更新后的值”为空，则相当于做插入操作

    +      - 若是修改操作，则用BI 代替 AI（After Image）


    +   3. 继续反向扫描日志文件，查找该事务的其他更新操作，并做同样处理。


    +   4. 如此处理下去，直至读到此事务的开始标记，事务故障恢复就完成了。'
  merge: -1
  img_proc: true
