- pgno: 655
  md: '# # 利用检查点的恢复步骤


    +   - 1.从重新开始文件中找到最后一个检查点记录在日志文件中的地址

    +   - 2.由该地址在日志文件中找到最后一个检查点记录

    +   - 3.由该检查点记录得到检查点建立时所有正在执行的事务清单ACTIVE-LIST

    +     - 建立两个事务队列

    +       - UNDO-LIST

    +       - REDO-LIST

    +     - 把ACTIVE-LIST暂时放入UNDO-LIST队列，REDO队列暂为空。

    +   - 4.从检查点开始正向扫描日志文件，直到日志文件结束

    +     - 如有新开始的事务Ti，把Ti暂时放入UNDO-LIST队列

    +     - 如有提交的事务Tj，把Tj从UNDO-LIST队列移到REDO-LIST队列

    +   - 5.对UNDO-LIST中的每个事务执行UNDO操作，对REDO-LIST中的每个事务执行REDO操作'
  merge: -1
  img_proc: true
