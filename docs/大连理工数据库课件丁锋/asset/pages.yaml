- pgno: 330
  md: '# # 连接查询


    +   - 等值连接


    连接运算符为 = 的连接操作


    ```

    [<表名1>.]<列名1> = [<表名2>.]<列名2>

    ```


    任何子句中引用表1和表2中同名属性时，都必须加表名前缀。引用唯一属性名时可以加也可以省略表名前缀。


    例：查询每个学生及其选修课程的情况。


    ```

    ```sql

    SELECT Student.*, SC.* FROM Student, SC

    WHERE Student.Sno = SC.Sno;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 331
  md: "# 连接查询\n\n+   - **自然连接**\n+   \n+     等值连接的一种特殊情况，把目标列中重复的属性列去掉。\n+   \n+ \
    \    例：查询每个学生及其选修课程的情况。\n\n```\nSELECT Student.Sno, Sname, Ssex, Sage,\n     \
    \  Sdept, Cno, Grade\nFROM   Student, SC WHERE Student.Sno = SC.Sno;\n```"
  merge: -1
