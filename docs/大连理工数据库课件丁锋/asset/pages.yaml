- pgno: 227
  md: '# # 数据依赖


    +   - 函数依赖-如何理解


    +   - 函数依赖不是指关系模式R的某个或某些关系实例满足的约束条件，而是指R的所有关系实例均要满足的约束条件。


    +   - 函数依赖是语义范畴的概念。只能根据数据的语义来确定函数依赖。例如，“姓名→年龄”这个函数依赖只有在不允许有同名人的条件下成立


    +   - 数据库设计者可以对现实世界作强制的规定。例如规定不允许同名人出现，函数依赖“姓名→年龄”成立。所插入的元组必须满足规定的函数依赖，若发现有同名人存在，则拒绝装入该元组。'
  merge: -1
  img_proc: true
- pgno: 228
  md: "# # 数据依赖\n\n+   - 函数依赖\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_228_0.png)\n\
    \n✽ (Sno, Cno) → Grade 非平凡的函数依赖  \n✽ (Sno, Cno) → Cno 平凡的函数依赖\n\n+   - 形式化定义 \
    \ \n+     X→Y,但Y ⊆ X则称X→Y是平凡的函数依赖。  \n+     X→Y,但Y ⊈ X则称X→Y是非平凡的函数依赖。\n\n+   -\
    \ 对于任一关系模式，平凡函数依赖都是必然成立，它不反映新的语义。因此若不特别声明，总是讨论非平凡函数依赖。\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_228_1.png)"
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # 数据依赖


    +   • 函数依赖


    ![](img/67cf9517c4d3576174ca2f10eafe50de_229_0.png)


    由于：Sno → Grade, Cno → Grade

    因此：(Sno, Cno) → Grade


    +   • 形式化定义


    在R(U)中，如果X→Y,并且对于X的任何一个真子集X'',都有X''→Y,则称Y对X完全依赖,记作：X→Y。

    若X→Y但Y不完全依赖于X,则称Y对X部分函数依赖,记作：X^P→Y。'
