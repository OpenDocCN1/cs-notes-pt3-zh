- pgno: 308
  md: '# # 单表查询


    +   - 基于文本的过滤条件


    格式: [NOT] LIKE ''<匹配串>'' [ESCAPE ''<换码字符>'']


    <匹配串>: 指定匹配模板


    匹配模板: 固定字符串或含通配符的字符串


    +   - 当匹配模板为固定字符串时


    +   - 用 = 运算符代替 LIKE 谓词


    +   - 用 != 或 <> 运算符代替 NOT LIKE 谓词


    +   - 当模糊查询时


    +   - %(百分号) 代表任意长度（长度可以为0）的字符串


    +   - _(下横线) 代表任意单个字符


    +   - 当用户要查询的字符串本身就含有 % 或 _ 时，要使用ESCAPE ''<换码字符>'' 短语对通配符进行转义。'
  merge: -1
  img_proc: true
