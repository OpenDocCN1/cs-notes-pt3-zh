- pgno: 144
  md: "# # 关系数据结构\n\n+   - **域：**\n+   具有相同数据类型的值的集合\n\n+   - **笛卡儿积：**\n+   给定一组域$D_1,D_2,...,D_n$\
    \ (可相同)，它们的笛卡儿积为：\n+   \n+   $D_1×D_2×...×D_n=\\{(d_1,d_2,...,d_n)|d_i\\in D_i,i=1,2,...,n\\\
    }$\n+   其中每一个元素$(d_1,d_2,...,d_n)$叫做一个n元组。元素中的每个值$d_i$叫做一个分量。(所有域的所有取值的一个组合,不能重复)\n\
    \n+   - **若 $D_i$ 为有限集, 其基数为 $m_i$, 则 $D_1×D_2×...×D_n$ 的基数 $M$ 为：**\n+   \n+\
    \   $M = \\prod_{i=1}^n m_i$"
  merge: -1
  img_proc: true
- pgno: 145
  md: "# # 关系数据结构\n\n+   - 笛卡尔积举例：\n\nD₁={张清玫，刘逸}  \nD₂={计算机专业，信息专业}  \nD₃={李勇，刘晨，王敏}\n\
    \n则：  \nD₁×D₂ × D₃=\n\n{（张清玫，计算机专业，李勇），  \n（张清玫，计算机专业，刘晨），  \n（张清玫，计算机专业，王敏），\
    \  \n（张清玫，信息专业，李勇），  \n（张清玫，信息专业，刘晨），  \n（张清玫，信息专业，王敏），  \n（刘逸，计算机专业，李勇），  \n\
    （刘逸，计算机专业，刘晨），  \n（刘逸，计算机专业，王敏），  \n（刘逸，信息专业，李勇），  \n（刘逸，信息专业，刘晨），  \n（刘逸，信息专业，王敏）}"
  merge: -1
  img_proc: true
