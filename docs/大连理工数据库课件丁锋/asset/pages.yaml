  md: "# 确定数据库物理结构\n\n+   - **确定数据存放位置的基本原则**\n+     根据应用情况将\n+     - 易变部分与稳定部分\n\
    +     - 存取频率较高部分与存取频率较低部分\n+   \n+     分开存放，以提高系统性能"
  merge: -1
