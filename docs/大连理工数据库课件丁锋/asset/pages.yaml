- pgno: 464
  md: '# # 局部视图设计


    +   - 选择局部应用


    +   - 需求分析阶段，已用多层数据流图和数据字典描述了整个系统。


    +   - 设计分E-R图首先需要根据系统的具体情况，在多层的数据流图中选择一个适当层次的数据流图，让这组图中每一部分对应一个局部应用，然后以这一层次的数据流图为出发点，设计分E-R图。'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# # 选择局部应用


    +   - 选择局部应用


    通常以中层数据流图作为设计分E-R图的依据。原因：


    +   - 高层数据流图只能反映系统的概貌


    +   - 中层数据流图能较好地反映系统中各局部应用的子系统组成


    +   - 低层数据流图过细'
  merge: -1
  img_proc: true
- pgno: 466
  md: "# # 逐一设计分E-R图\n\n+   - 任务  \n+   标定局部应用中的实体、属性、码，实体间的联系\n\n将各局部应用涉及的数据分别从数据字典中抽取出来，参照数据流图，标定各局部应用中的实体、实体的属性、标识实体的码，确定实体之间的联系及其类型（1:1，1:n，m:n）\n\
    \n![](img/67cf9517c4d3576174ca2f10eafe50de_466_0.png)"
  merge: -1
  img_proc: true
- pgno: 467
  md: '# # 逐一设计分E-R图


    +   - 如何抽象实体和属性

    +   - **实体**：现实世界中一组具有某些共同特性和行为的对象就可以抽象为一个实体。对象和实体之间是 “is member of”的关系。

    +   - 例：在学校环境中，可把张三、李四等对象抽象为学生实体。


    +   - **属性**：对象类型的组成成分可以抽象为实体的属性。组成成分与对象类型之间是 “is part of”的关系。

    +   - 例：学号、姓名、专业、年级等可以抽象为学生实体的属性。其中学号为标识学生实体的码。'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# # 逐一设计分E-R图


    +   - 如何区分实体和属性


    实体与属性是相对而言的。同一事物，在一种应用环境中作为“属性”，在另一种应用环境中就有可能必须作为“实体”。


    +   - 例：学校中的系，在某种应用环境中，它只是作为“学生”实体的一个属性，表明一个学生属于哪个系；而在另一种环境中，由于需要考虑一个系的系主任、教师人数、学生人数、办公地点等，这时它就需要作为实体了。'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# # 逐一设计分E-R图


    +   - 一般原则


    +   - 属性不能再具有需要描述的性质。即属性必须是不可分的数据项，不能再由另一些属性组成。


    +   - 属性不能与其他实体具有联系。联系只发生在实体之间。


    +   - 符合上述两条特性的事物一般作为属性对待。


    +   - 为了简化E-R图的处置，现实世界中的事物凡能够作为属性对待的，应尽量作为属性。'
  merge: -1
  img_proc: true
