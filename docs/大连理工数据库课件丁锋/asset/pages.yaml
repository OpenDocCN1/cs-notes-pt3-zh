- pgno: 322
  md: '# 单表查询


    +   - 查询结果分组


    ```

    SELECT

    [ALL|DISTINCT]

    <column|expression>[, <column|expression>]...

    FROM

    <table|view>[, <table|view>]...

    [WHERE <condition(s)>]

    [GROUP BY <column>[HAVING<condition(s)_1>]]

    [ORDER BY <column2>[ASC|DESC]]

    ```


    +   - 使用GROUP BY子句分组

    +     - 细化聚集函数的作用对象

    +       - 未对查询结果分组，聚集函数将作用于整个查询结果

    +       - 对查询结果分组后，聚集函数将分别作用于每个组

    +   - 只有满足HAVING短语指定条件的组才输出'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 单表查询


