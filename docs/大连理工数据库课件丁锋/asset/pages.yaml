- pgno: 339
  md: '# 嵌套查询（子查询）


    • 带有IN谓词的子查询


    例：查询选修课程名为“信息系统”的学生学号和姓名


    ```

    SELECT Sno, Sname

    FROM Student

    WHERE Sno IN(

    SELECT Sno

    FROM SC

    WHERE Cno IN(

    SELECT Cno

    FROM Course

    WHERE Cname = ''信息系统''

    ) );


    ```


    +   ① 首先找出 Course 关系中“信息系统”的课程号 (3)

    +   ② 然后在 SC 关系中找出选修了3号课程的学生学号

    +   ③ 最后在 Student 关系中取出 Sno 和 Sname'
  merge: -1
  img_proc: true
