- pgno: 97
  md: '# 数据库系统的模式结构


    +   - 外部层

    +     - 用户逻辑层

    +     - 单个用户大多只对整个数据库的某些部分感兴趣；ANSI/SPARC称单个用户视图的术语为**外部视图**。外部视图就是特定用户所看到的数据库的内容。

    +     - 每个外部视图都是通过**外模式**来定义的。外模式包括外部视图中各种外部记录类型的基本定义。'
  merge: -1
