- pgno: 354
  md: '# 嵌套查询（子查询）


    +   - 带有EXISTS谓词的子查询

    +     用EXISTS/NOT EXISTS实现逻辑蕴涵*


    +   - SQL语言中没有蕴涵(Implication)逻辑运算


    +   - 可以利用谓词演算将逻辑蕴涵谓词等价转换为：


    $p \to q \equiv \neg p \lor q$'
  merge: -1
  img_proc: true
- pgno: 355
  md: "# 嵌套查询（子查询）\n\n+   - 带有EXISTS谓词的子查询\n+     例：查询（至少）选修了学生95002选修的全部课程的学生号码。\n\
    \n+   - 解题思路\n+     用逻辑蕴函数表达：查询学号为x的学生，对所有的课程y，只要95002学生选修了课程y，则x也选修了y。形式化表示：\n\
    +   \n+     用P表示谓词“学生95002选修了课程y”\n+   \n+     用q表示谓词“学生x选修了课程y”\n+   \n+    \
    \ 则上述查询为: (∀y) p → q"
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 嵌套查询（子查询）


    +   - 带有EXISTS谓词的子查询等价变换：


    (∀y)p → q ≡ ¬(∃y(¬(p→q)))

    ≡ ¬(∃y(¬(¬p ∨ q)))

    ≡ ¬ ∃ y ( p ∧ ¬ q )


    变换后语义：不存在这样的课程y，学生95002选修了y，而学生x没有选。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 嵌套查询（子查询）


