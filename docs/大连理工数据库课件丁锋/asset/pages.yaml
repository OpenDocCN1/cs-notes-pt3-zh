- pgno: 39
  md: '# # 概念模型


    +   - 概念模型是现实世界到数据模型的一个中间层次，用于信息世界建模，是数据库设计的有力工具，是数据库设计人员和用户之间进行交流的语言


    +   - 对概念模型的基本要求

    +     - 较强的语义表达能力，能够方便、直接地表达应用中的各种语义知识

    +     - 简单、清晰、易于用户理解。


    +   - 客观对象的抽象过程---两步抽象

    +     - 现实世界中的客观对象抽象为概念模型；

    +     - 把概念模型转换为某一DBMS支持的数据模型。'
  merge: -1
  img_proc: true
- pgno: 40
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # 概念模型


    +   - **实体（Entity）**

    +   客观存在并可相互区别的事物称为实体，可以是具体的人、事、物或抽象的概念。


    +   - **属性（Attribute）**

    +   实体所具有的某一特性称为属性。一个实体可以由若干个属性来刻画。


    +   - **码（Key）**

    +   唯一标识实体的属性集称为码'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 概念模型


    +   - **域（Domain）**

    +     属性的取值范围称为该属性的域。


    +   - **实体型（Entity Type）**

    +     用实体名及其属性名集合来抽象和刻画，同类实体称为实体型


    +   - **实体集（Entity Set）**

    +     同型实体的集合称为实体集'
  merge: -1
  img_proc: true
- pgno: 43
  md: "# # 概念模型\n\n+   • 联系（Relationship）  \n+   现实世界中事物内部以及事物之间的联系在信息世界中反映为实体内部的联系和实体之间的联系\n\
    \n+   • 实体型间联系\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_43_0.png)\n\n![](img/67cf9517c4d3576174ca2f10eafe50de_43_1.png)\n\
