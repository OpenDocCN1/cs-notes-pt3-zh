- pgno: 155
  md: '# # 关系数据结构


    +   • 形式化定义


    +   □ 关系模式:


    对关系的描述称为关系模式。 可以形式化的表示为：


    ```

    R (U, D, dom, F)

    ```


    其中：


    +   R: 关系名

    +   U: 组成关系的属性名集合

    +   D: 属性来自的域

    +   dom: 属性到域的映射

    +   F: 属性间数据的依赖关系


    简记：


    ```

    R (U) ,或者R (A1,A2,...An)

    ```'
