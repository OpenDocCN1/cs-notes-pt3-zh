- pgno: 352
  md: '# # 定理7.7 设 \( R \) 是 \( A \) 上的关系，\( m, n \in \mathbb{N} \)，则


    +   1. \( R^m \circ R^n = R^{m+n} \)


    +   2. \( (R^m)^n = R^{mn} \)


    # ## 证 用归纳法


    +   1. 对于任意给定的 \( m \in \mathbb{N} \)，施归纳于 \( n \).


    若 \( n=0 \)，则有


    \( R^m \circ R^0 = R^m \circ I_A = R^m = R^{m+0} \)


    假设 \( R^m \circ R^n = R^{m+n} \)，则有


    \( R^m \circ R^{n+1} = R^m \circ (R^n \circ R) = (R^m \circ R^n) \circ R = R^{m+n+1}
    \)，


    所以对一切 \( m, n \in \mathbb{N} \) 有 \( R^m \circ R^n = R^{m+n} \)。'
  merge: -1
  img_proc: true
- pgno: 353
  md: '(2) 对于任意给定的 $m\in\mathbb{N}$，施归纳于 $n$。


    若 $n=0$，则有


    $$(R^m)^0=I_A=R^0=R^m\times 0$$


    假设 $(R^m)^n=R^{mn}$，则有


    $$(R^m)^{n+1}=(R^m)^n\circ R^m=(R^{mn})\circ R^m$$

    $$=R^{mn+m}=R^{m(n+1)}$$


    所以对一切 $m,n\in\mathbb{N}$ 有 $(R^m)^n=R^{mn}$。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# # 定理7.8 设 \( R \) 是 \( A \) 上的关系，

    若存在自然数 \( s, t \) (\( s < t \)) 使得 \( R^s = R^t \)，则


    1. 对任何 \( k \in \mathbb{N} \) 有 \( R^{s+k} = R^{t+k} \)

    2. 对任何 \( k, i \in \mathbb{N} \) 有 \( R^{s+kp+i} = R^{s+i} \)，其中 \( p = t - s
    \)

    3. 令 \( S = \{R^0, R^1, \dots, R^{t-1}\} \)，则对于任意的 \( q \in \mathbb{N} \) 有 \(
    R^q \in S \)


    证 (1) \( R^{s+k} = R^s \circ R^k = R^t \circ R^k = R^{t+k} \)


    (2) 对 \( k \) 归纳。若 \( k = 0 \)，则有 \( R^{s+0p+i} = R^{s+i} \)


    假设 \( R^{s+kp+i} = R^{s+i} \)，其中 \( p = t - s \)，则


    [R^{s+(k+1)p+i} = R^{s+kp+i+p} = R^{s+kp+i} \circ R^p]


    [= R^{s+i} \circ R^p = R^{s+p+i} = R^{s+t-s+i} = R^{t+i} = R^{s+i}]


    由归纳法命题得证。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '(3) 任取 \( q \in \mathbb{N} \)，

    若 \( q < t \)，显然有 \( R^q \in S \)，

    若 \( q \geq t \)，则存在自然数 \( k \) 和 \( i \) 使得


    \( q = s + kp + i \)，其中 \( 0 \leq i \leq p-1 \)。


    于是


    \( R^q = R^{s+kp+i} = R^{s+i} \)


    而


    \( s+i \leq s+p-1 = s+t-s-1 = t-1 \)


    从而证明了 \( R^q \in S \)。'
  merge: -1
  img_proc: true
