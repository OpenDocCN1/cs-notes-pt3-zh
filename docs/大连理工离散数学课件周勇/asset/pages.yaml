    +     - **CP规则：** 如果能从 R 和前提集合中推导出 S 来，则就能够从前提集合中推导出 $R \to S$。

    +     - 换句话说，当结论是 $R \to S$ 的形式的时候，可以把结论的前件当作一个附加前提使用，并且它和前提一起若能推出结论的后件，则问题得证。

