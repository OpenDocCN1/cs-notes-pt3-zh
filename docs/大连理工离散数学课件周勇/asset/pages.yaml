  md: "# # 斯柯林范式\n\n+   - 任何一个公式都可以化为与之等价的斯柯林范式，方法如下：\n+     - 先将给定公式化为前束范式；\n+  \
    \   - 将前束范式中的所有自由变元用全称量词（UG）约束；\n+     - 若经上述改造后的公式A中，第一个量词不是存在量词，则可以将等价变换成如下形式\
