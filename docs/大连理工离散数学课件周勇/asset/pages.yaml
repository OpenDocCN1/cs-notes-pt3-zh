- pgno: 495
  md: '# # 函数的相等


    定义： 给定函数\(f: X \to Y\)和\(g: Z \to W\)。如果\(f\)和\(g\)具有同样的定义域和陪域，亦即\(X=Z\)和\(Y=W\)，并且对于所有的\(x
    \in X\)或\(x \in Z\)都有\(f(x)=g(x)\)，则称函数\(f\)和\(g\)是相等的，记作\(f=g\)。


