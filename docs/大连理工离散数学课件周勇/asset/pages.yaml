    ```

    \( A = \begin{bmatrix} v_1 & v_2 & v_3 & v_4 & v_5 \ v_1 & 0 & 1 & 0 & 0 & 0 \
    v_2 & 0 & 0 & 1 & 0 & 0 \ v_3 & 0 & 1 & 0 & 1 & 1 \ v_4 & 1 & 0 & 0 & 0 & 0 \
    v_5 & 1 & 1 & 0 & 1 & 0 \end{bmatrix} \)

    ```'
