- pgno: 829
  md: '# # 路径和回路


    定义：如果回路（有向回路，无向回路）C是图G的子图，则称G有回路（有向回路，无向回路）C。


    定理：如果有向图G有子图G''满足：对于G''的任意结点v，\(d_{G''}^+(v) > 0\) 或\(d_{G''}^-(v) > 0\)，则G有有向回路。


    证：设\(G'' = \langle V'', E'', \psi'' \rangle\)，\(v_0 e_1 v_1 \cdots v_{n-1} e_n
    v_n\)是\(G''\)中最长的基本路径。由于\(d_{G''}^+(v_n) > 0\)，必可找到\(e_{n+1} \in E''\)和\(v_{n+1}
    \in V''\)，使\(v_0 e_1 v_1 \cdots v_{n-1} e_n v_n e_{n+1} v_{n+1}\)是\(G''\)中的简单路径，且\(v_{n+1}
    = v_i(0 \leq i \leq n)\)。\(G\)的以\(\{v_i, \cdots v_{i+1}, \cdots, v_n\}\)为结点集合，以\(\{e_{i+1},
    e_{i+2}, \cdots, e_{n+1}\}\)为边集合的子图是有向回路。'
  merge: -1
  img_proc: true
- pgno: 830
  md: '# # 路径和回路


    设v是有向图G的结点，\( d_G^+(v) = 0 \)，从G中去掉v和与之相关联的边得到有向图\( G - \{v\} \)的过程，称为w过程。G有有向回路，当且仅当\(
    G - \{v\} \)有有向回路。若n阶有向图G没有有向回路，则经过n-1次w过程得到平凡图，否则至多经过n-1次w过程得到每个结点的出度均大于0的有向图。这样，我们就找出了判断一个有向图有没有有向回路的有效办法。当然，也可以把w过程定义为去掉入度为0的结点。'
  merge: -1
  img_proc: true
