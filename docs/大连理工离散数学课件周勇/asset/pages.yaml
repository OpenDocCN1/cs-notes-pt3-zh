- pgno: 643
  md: '# # 子群判定定理1


    定理：（判定定理一）

    设 \( G \) 为群，\( H \) 是 \( G \) 的非空子集，则 \( H \) 是 \( G \) 的子群当且仅当

    (1) \( \forall a, b \in H \) 有 \( ab \in H \)

    (2) \( \forall a \in H \) 有 \( a^{-1} \in H \).


    证 必要性是显然的. 为证明充分性，只需证明 \( e \in H \). 因为 \( H \) 非空，存在 \( a \in H \). 由条件(2) 知
    \( a^{-1} \in H \)，根据条件(1) \( aa^{-1} \in H \)，即 \( e \in H \).'
  merge: -1
  img_proc: true
- pgno: 644
  md: '# # 子群判定定理2


    定理：（判定定理二）

    设 \( G \) 为群，\( H \) 是 \( G \) 的非空子集。\( H \) 是 \( G \) 的子群当且仅当 \( \forall a, b
    \in H \) 有 \( ab^{-1} \in H \)。


    证 必要性显然。只证充分性。

    因为 \( H \) 非空，必存在 \( a \in H \)。

    根据给定条件得 \( aa^{-1} \in H \)，即 \( e \in H \)。

    任取 \( a \in H \)，由 \( e, a \in H \) 得 \( ea^{-1} \in H \)，即 \( a^{-1} \in H \)。

    任取 \( a, b \in H \)，知 \( b^{-1} \in H \)。再利用给定条件得 \( a(b^{-1})^{-1} \in H \)，即
    \( ab \in H \)。

    综合上述，可知 \( H \) 是 \( G \) 的子群。'
