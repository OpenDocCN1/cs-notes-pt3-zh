    知 \( (P \leftrightarrow Q) \land (\neg P \land Q) \) 和 \( (P \leftrightarrow Q)
    \rightarrow (\neg P \lor Q) \) 互为对偶式

    由于 \( T \) 的对偶式是 \( F \)，因此由定理1. 5-1知

    \( (P \leftrightarrow Q) \land (\neg P \land Q) \Leftrightarrow F \)'
