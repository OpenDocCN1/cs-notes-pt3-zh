  md: '# # 子图


    定义：设 n 阶无向图 \( G = <V, E, \psi> \) 是 n 阶完全无向图 \( K_n \) 的生成子图，则称 \( K_n - E \)
    为 \( G \) 的补图，记为 \( \overline{G} \)。


    显然，简单无向图都有补图，并且一个简单无向图的每个补图都是同构的。对于任意两个简单无向图 \( G_1 \) 和 \( G_2 \)，如果 \( G_2 \)
    是 \( G_1 \) 的补图，那么 \( G_1 \) 也是 \( G_2 \) 的补图。


