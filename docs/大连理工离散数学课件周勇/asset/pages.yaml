- pgno: 1015
  md: '# # 图着色


    平面图的着色问题，最早起源于地图的着色。在一张地图中，若相邻国家着以不同的颜色，那么最少需要多少种颜色呢？1840年，德国数学家麦比乌斯(A.F.Möbius)在他的讲稿中第一次提出了确信用四种颜色可以对地图着色的问题(以下简称**四色猜想**)。1879年肯普(Kempe)给出了这个猜想的第一个证明，但到1890年希伍德(Hewood)发现肯普证明是有错误的，然而他指出了肯普的方法虽不能证明地图着色用四种颜色就够了，但却可以证明用五种颜色是够的，即**五色定理成立**。


    直到1976年，美国数学家阿普尔(K.I.Apple)和黑肯(W.Haken)在考西(J.koch)的帮助下，用计算机作了一百多亿次逻辑判断，花了1200多机时才证明了四色猜想是成立的，从此，**四色猜想成为四色定理**。'
  merge: -1
  img_proc: true
- pgno: 1016
  md: '# 图着色


    平面里的每幅地图都可以表示成一个图。为了建立这样的对应关系，地图的每个区域用一个点表示，若两个顶点表示的区域有公共边界，则用边连接这两个顶点。只相交于一个点的两个区域不算是相邻的。


    给地图着色的问题等价于这样一个问题：找出给对偶图 $G=\langle V,E\rangle$ 的顶点着色 $\alpha$，即找到从结点集 $V$ 到色集
    $C=\{c1,c2,\ldots,cn\}$ 上一个映射，使对任意边 $[v_i,v_j]\in E$ 均有 $\alpha(v_i)\ne\alpha(v_j)$，即对
    $G$ 的每个结点指派一种颜色，使得相邻结点都有不同的颜色。'
