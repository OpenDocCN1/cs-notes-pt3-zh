- pgno: 882
  md: '# # 可达性矩阵判断递归过程


    利用简单有向图的可达矩阵，能够确定某过程是否为递归的。


    假设\(V_{Prg}=\{p_1, p_2, ..., p_n\}\)是程序 \(Prg\)中的过程集合，做有向图\(G=<V_{Prg}, E>\)，其中\(p_i
    \in V_{Prg}\)，\(i=1, 2, ..., n\)；\(<p_i, p_j> \in E \iff p_i\)调用\(p_j\)。如果图\(G\)中有包含\(p_i\)的回路，则断言\(p_i\)是递归的。为此，由图\(G\)的邻接矩阵\(A=(a_{ij})\)计算出关系矩阵\(A^+=(a_{ij}^+)\)。如果\(A^+\)中的主对角线上的某元素\(a_{ii}^+
    = 1\)，则\(p_i\)是递归的'
  merge: -1
  img_proc: true
