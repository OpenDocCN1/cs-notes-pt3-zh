  md: '# 一些特殊的简单图


    定理：n个节点的的无向完全图 k_n 的边数为 C_n^2 。


    证明：因为在无向完全图k_n中，任意两个节点之间都有边相连，所以n个节点中任取两个点的组合数为C_n^2 ，故无向完全图的边数为C_n^2 。


    如果在 k_n 中，对每条边任意确定一个方向，就称该图为n个节点的的有向完全图。显然，有向完全图的边数也是C_n^2 。'
