- pgno: 461
  md: '# # 字母次序关系


    定义：设 \( R \) 是实数集合且 \( P = R \times R \)。假定 \( R \) 中的关系 \( \geq \) 是一般的“大于或等于”关系。对于
    \( P \) 中的任何两个序偶 \( \langle x_1, y_1 \rangle \) 和 \( \langle x_2, y_2 \rangle
    \)，可以定义一个关系 \( S \)


    \( \langle x_1, y_1 \rangle S \langle x_2, y_2 \rangle \iff (x_1 > x_2) \lor (x_1
    = x_2 \land y_1 \geq y_2) \)


    如果 \( \langle x_1, y_1 \rangle \not S \langle x_2, y_2 \rangle \)，则有 \( \langle
    x_2, y_2 \rangle S \langle x_1, y_1 \rangle \)，因此 \( S \) 是 \( P \) 中的全序关系。并称它是**字母次序关系**或**字母序**。


    例如，\( \langle 2, 2 \rangle S \langle 2, 1 \rangle \)，\( \langle 3, 1 \rangle S
    \langle 1, 5 \rangle \)

    \( \langle 2, 2 \rangle S \langle 2, 2 \rangle \)，\( \langle 3, 2 \rangle S \langle
    1, 1 \rangle \)'
  merge: -1
  img_proc: true
- pgno: 462
  md: '# 字母次序关系


    设$R$是$X$中的全序关系，并设


    $P=X\cup X^2\cup\cdots\cup X^n=\bigcup_{i=1}^{n}X^i\quad(n=1,2,\cdots)$


    这个方程式说明，$P$是由长度小于或等于$n$的元素串组成的。假定$n$取某个固定值，可把长度为$p$的元素串看成是$P$重序元。这样就可以定义$P$中的全序关系$S$，并称它是字母次序关系。为此，设$\langle
    x_1,x_2,\cdots,x_p\rangle$和$\langle y_1,y_2,\cdots,y_q\rangle$是集合中的任何两个元素串，且有$p\leq
    q$。为了满足$P$中的次序关系。首先对两个元素串进行比较。如果需要的话，把两个元素串加以交换，使得$q\leq p$。'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# # 字母次序关系


    如果要使\(\langle x_1, x_2, \cdots, x_p \rangle S \langle y_1, y_2, \cdots, y_q \rangle\)，就必须满足下列条件之一：


    +   (1) \(\langle x_1, x_2, \cdots, x_p \rangle = \langle y_1, y_2, \cdots, y_p
    \rangle\)


    +   (2) \(x_1 \neq y_1\) 且 \(X\) 中有 \(x_1 R y_1\)


    +   (3) \(x_i = y_i, i = 1, 2, \cdots, k (k < p)\) 且 \(x_{k+1} \neq y_{k+1}\)
    和 \(X\) 中有 \(x_{k+1} R y_{k+1}\)


    如果上述条件中一个也没有得到满足，则应有

    \(\langle y_1, y_2, \cdots, y_q \rangle S \langle x_1, x_2, \cdots, x_p \rangle\)'
