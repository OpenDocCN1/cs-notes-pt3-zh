- pgno: 765
  md: '# # 图论的起源


    欧拉证明了这个问题没有解，并且推广了这个问题，给出了对于一个给定的图可以某种方式走遍的判定法则。这项工作使欧拉成为图论的创始人。


    欧拉被称为图论之父，1736年也被称为“图论元年”。


    图论部分共分为三章：图的基本概念及其矩阵表示，几种图的介绍，树。本章将首先讨论图论中的一些基本概念，继之阐述图的基本性质，而后介绍图的矩阵表示方法。'
