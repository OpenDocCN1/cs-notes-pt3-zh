  md: '# 可交换半群与循环半群的定义


    # 定义7.3


    +   (1) 给定半群 $\langle S,\circ\rangle$，若 $\circ$ 是可交换的，则称 $\langle S,\circ\rangle$
    是**可交换半群**。类似地可定义**可交换独异点** $\langle M,\circ,e\rangle$。


    +   (2) 给定半群 $\langle S,\circ\rangle$ 和 $g\in S$，以及自然数集合 $N$，则 $g$ 为 $\langle
    S,\circ\rangle$ 的生成元：$(\forall x)(x\in S\to(\exists n)(n\in N\land x=g^n))$。此时也说，元素
    $g$ 生成半群 $\langle S,\circ\rangle$，而且称该半群为**循环半群**。类似地定义独异点 $\langle M,\circ,e\rangle$
    的生成元 $g$ 和**循环独异点**，并且规定 $g^0=e$。'
