  md: '# # 关联矩阵


    定义：设 \( G = (V, E) \) 是一个无环的、至少有一条有向边的有向图，

    \( V = \{v_1, v_2, \cdots, v_n\}, E = \{e_1, e_2, \cdots, e_m\} \) 。构造矩阵，其中


    \( m_{ij} = \begin{cases} 1, & \text{当 } e_j \text{ 是 } v_i \text{ 的出边} \\ -1,
    & \text{当 } e_j \text{ 是 } v_i \text{ 的入边} \\ 0, & \text{其它} \end{cases} \)


