- pgno: 810
  md: '# 图的运算


    **定义：** 设图 $G=\langle V,E,\psi\rangle$ 和 $G''=\langle V'',E'',\psi''\rangle$ 同为无向图或同为有向图。


    +   1. 如果对于任意 $e\in E\cap E''$ 具有 $\psi(e)=\psi''(e)$，则称 $G$ 和 $G''$ 是**可运算的**。

    +   2. 如果 $V\cap V''=E\cap E''=\Phi$，则称 $G$ 和 $G''$ 是**不相交的**。

    +   3. 如果 $E\cap E''=\Phi$，则称 $G$ 和 $G''$ 是**边不相交的**。'
  merge: -1
  img_proc: true
- pgno: 811
  md: '# # 图的运算


    设图 \( G_1 = \langle V_1, E_1, \psi_1 \rangle \) 和 \( G_2 = \langle V_2, E_2, \psi_2
    \rangle \) 为可运算的。


    (1) 称以 \( V_1 \cap V_2 \) 为结点集合，以 \( E_1 \cap E \) 为边集合的 \( G_1 \) 和 \( G_2 \)
    的公共子图为 \( G_1 \) 和 \( G_2 \) 的交，记为 \( G_1 \cap G_2 \)。


    (2) 称以 \( E_1 \cup E_2 \) 为边集合，以与这些边关联的结点集合为点集的 \( G_1 \) 和 \( G_2 \) 的公共母图为 \(
    G_1 \) 和 \( G_2 \) 的并，记为 \( G_1 \cup G_2 \)。


    (3) 称以 \( V_1 \cup V_2 \) 为结点集合，以 \( E_1 \oplus E_2 \) 为边集合的 \( G_1 \cup G_2 \)
    的子图为 \( G_1 \) 和 \( G_2 \) 的环和，记为 \( G_1 \oplus G_2 \)。'
