    \ \\(S\\) 上满足**结合律**。\n\n(3) 若对任意 \\(x \\in S\\) 有 \\(x \\circ x = x\\)，则称运算在\
    \ \\(S\\) 上满足**幂等律**。\n\n定义9.4 设 \\(\\circ\\) 和 \\(*\\) 为 \\(S\\) 上两个不同的二元运算，\n\
    \n(1) 若对任意 \\(x, y, z \\in S\\) 有 \\((x * y) \\circ z = (x \\circ z) * (y \\circ\
    \ z)\\)，  \n\\(z \\circ (x * y) = (z \\circ x) * (z \\circ y)\\)，则称 \\(\\circ\\\
    ) 运算对 \\(*\\) 运算满足**分配律**。\n\n(2) 若 \\(\\circ\\) 和 \\(*\\) 都可交换，且对任意 \\(x, y \\\
    in S\\) 有 \\(x \\circ (x * y) = x\\)，  \n\\(x * (x \\circ y) = x\\)，  \n则称 \\\
