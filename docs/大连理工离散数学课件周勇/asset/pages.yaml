    \Leftrightarrow \neg(P \land Q) \lor R

    $$


    $$

    \Leftrightarrow (\neg P \lor \neg Q) \lor R

    $$


    $$

    \Leftrightarrow \neg P \lor (\neg Q \lor R)

    $$


    $$

    \Leftrightarrow P \to (Q \to R)

    $$

    ```'
