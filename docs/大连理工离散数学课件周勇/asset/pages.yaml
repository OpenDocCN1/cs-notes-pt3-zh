- pgno: 804
  md: '# # 图模型


    优先图与并发处理：通过并发的执行某些语句，计算机程序可能执行的更快。但重要的是，要避免语句执行时还要用到尚未执行语句的结果。语句与前面语句的相关性可以表示成有向图。用顶点表示某个语句，若在a语句执行完之前不能执行b语句，则引出一个从a到b的有向边，这样的图称为优先图。'
