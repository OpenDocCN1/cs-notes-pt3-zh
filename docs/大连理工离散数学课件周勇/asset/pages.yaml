- pgno: 779
  md: '# 结论


    定义: 度数为奇数的结点称为奇结点, 度数为偶数的结点称为偶结点。


    定理: 任何图都有偶数个奇结点。


    证: 设 V1 = {v|v为奇点}, V2 = {v|v为偶点} , 则 ∑d(v)+∑d(v)=∑d(v)=2m , 因为∑d(v)是偶数, 所以 ∑d(v)
    也是偶数, 而 V1 中每个点的度均为奇数, 因此 |V1| 为偶数。


    定义: 度为0的结点称为孤立结点, 度为1的结点称为端点。'
