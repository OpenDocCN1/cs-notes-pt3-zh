- pgno: 511
  md: '# 函数的合成和合成函数的性质


    例：设是整数集合，并且函数 $f:I\to I$ 给定成 $f(i)=2i+1$。试求出合成函数 $f^3(i)$。


    解：合成函数 $f^3(i)$ 是一个由 $I$ 到 $I$ 的函数，于是有


    $$f^3(i)=f^2(i)\circ f(i)=(f(i)\circ f(i))\circ f(i)$$

    $$=f(f(f(i)))=f(f(2i+1))$$

    $$=f(4i+3)=2(4i+3)+1=8i+7$$'
