- pgno: 636
  md: '# # 群的性质：幂运算规则


    定理：设 \( G \) 为群，则 \( G \) 中的幂运算满足：


    (1) \(\forall a \in G\)， \( (a^{-1})^{-1} = a \)


    (2) \(\forall a, b \in G\)， \( (ab)^{-1} = b^{-1}a^{-1} \)


    (3) \(\forall a \in G\)， \( a^n a^m = a^{n+m}\)， \( n, m \in \mathbb{Z} \)


    (4) \(\forall a \in G\)， \( (a^n)^m = a^{nm}\)， \( n, m \in \mathbb{Z} \)


    (5) 若 \( G \) 为交换群，则 \( (ab)^n = a^n b^n \)。


    证 (1) \( (a^{-1})^{-1} \) 是 \( a^{-1} \) 的逆元， \( a \) 也是 \( a^{-1} \) 的逆元。根据逆元唯一性，等式得证。


    (2) \( (b^{-1}a^{-1})(ab) = b^{-1}(a^{-1}a)b = b^{-1}b = e \)，

    同理 \( (ab)(b^{-1}a^{-1}) = e \)，

    故 \( b^{-1}a^{-1} \) 是 \( ab \) 的逆元。根据逆元的唯一性等式得证。'
  merge: -1
  img_proc: true
- pgno: 637
  md: "# # 群的性质：方程存在惟一解\n\n定理：\\( G \\) 为群，\\( \\forall a,b \\in G \\)，方程 \\( ax=b\
    \ \\) 和 \\( ya=b \\) 在 \\( G \\) 中有解且仅有惟一解。\n\n证 \\( a^{-1}b \\) 代入方程左边的 \\( x\
    \ \\) 得  \n\\( a(a^{-1}b) = (aa^{-1}b) = eb = b \\)  \n所以 \\( a^{-1}b \\) 是该方程的解。下面证明惟一性。\
    \  \n假设 \\( c \\) 是方程 \\( ax=b \\) 的解，必有 \\( ac=b \\)，从而有  \n\\( c = ec = (a^{-1}a)c\
    \ = a^{-1}(ac) = a^{-1}b \\)  \n同理可证 \\( ba^{-1} \\) 是方程 \\( ya=b \\) 的惟一解。\n\n\
    例：设群 \\( G=<P(\\{a,b\\}), \\oplus> \\)，其中 \\( \\oplus \\) 为对称差。解下列群方程：  \n\\(\
    \ \\{a\\} \\oplus X = \\varnothing \\， \\quad Y \\oplus \\{a,b\\} = \\{b\\} \\\
    )\n\n解  \n\\( X = \\{a\\}^{-1} \\oplus \\varnothing = \\{a\\} \\oplus \\varnothing\
    \ = \\{a\\} \\)  \n\\( Y = \\{b\\} \\oplus \\{a,b\\}^{-1} = \\{b\\} \\oplus \\\
    {a,b\\} = \\{a\\} \\)"
  merge: -1
  img_proc: true
- pgno: 638
  md: '# 群的性质：消去律


    定理：\(G\)为群，则\(G\)中适合消去律，即对任意\(a,b,c\in G\)有


    +   1. 若 \(ab=ac\)，则 \(b=c\)。

    +   2. 若 \(ba=ca\)，则 \(b=c\)。


    证明略


    例：设 \(G=\{a_1,a_2,\ldots,a_n\}\) 是 \(n\) 阶群，令


    \[a_iG=\{a_ia_j\mid j=1,2,\ldots,n\}\]


    证明 \(a_iG=G\)。


    证 由群中运算的封闭性有 \(a_iG\subseteq G\)。假设 \(a_iG\subset G\)，即 \(|a_iG|<n\)。

    必有 \(a_j,a_k\in G\) 使得


    \[a_ia_j=a_ia_k\quad (j\ne k)\]


    由消去律得 \(a_j=a_k\)，与 \(|G|=n\) 矛盾。'
  merge: -1
  img_proc: true
- pgno: 639
  md: '# # 群的性质： 元素的阶


    定理： \( G \) 为群， \( a \in G \) 且 \( |a| = r \)。设 \( k \) 是整数，则


    +   (1) \( a^k = e \) 当且仅当 \( r \mid k \)


    +   (2) \( |a^{-1}| = |a| \)


    证 (1) 充分性。由于 \( r \mid k \)，必存在整数 \( m \) 使得 \( k = mr \)，所以有


    \( a^k = a^{mr} = (a^r)^m = e^m = e \)。


    必要性。根据除法，存在整数 \( m \) 和 \( i \) 使得


    \( k = mr + i, \ 0 \leq i \leq r-1 \)


    从而有 \( e = a^k = a^{mr+i} = (a^r)^m a^i = e a^i = a^i \)


    因为 \( |a| = r \)，必有 \( i = 0 \)。这就证明了 \( r \mid k \)。


    +   (2) 由 \( (a^{-1})^r = (a^r)^{-1} = e^{-1} = e \)


    可知 \( a^{-1} \) 的阶存在。令 \( |a^{-1}| = t \)，根据上面的证明有 \( t \mid r \)。 \( a \) 又是
    \( a^{-1} \) 的逆元，所以 \( r \mid t \)。从而证明了 \( r = t \)，即 \( |a^{-1}| = |a| \)'
  merge: -1
  img_proc: true
