- pgno: 589
  md: '# 关于子代数的术语


    +   1. **最大的子代数**：就是 $V$ 本身

    +   2. **最小的子代数**：如果令 $V$ 中所有代数常数构成的集合是 $B$，且 $B$ 对 $V$ 中所有的运算都是封闭的，则 $B$ 就构成了
    $V$ 的最小的子代数

    +   3. 最大和最小的子代数称为 $V$ 的**平凡的子代数**

    +   4. 若 $B$ 是 $S$ 的真子集，则 $B$ 构成的子代数称为 $V$ 的**真子代数**。


    例 设 $V=\langle Z,+,0\rangle$，令 $nZ=\{nz\mid z\in Z,n\text{ 为自然数}\}$，则 $nZ$ 是 $V$
    的子代数


    当 $n=1$ 和 $0$ 时，$nZ$ 是 $V$ 的平凡的子代数，其他的都是 $V$ 的非平凡的真子代数。'
