  md: '# # 四、关系的闭包运算


    定理：给定集合\(X\)，\(R\)是\(X\)中的关系。于是可有


    +   (a) 当且仅当\(r(R) = R\)，\(R\)才是自反的。

    +   (b) 当且仅当\(s(R) = R\)，\(R\)才是对称的。

    +   (c) 当且仅当\(t(R) = R\)，\(R\)才是传递的。


    证明：仅给出 \((a)\) 的证明过程


    由闭包的定义可知 \(R \subseteq r(R)\)，又由于\(R\)是包含了\(R\)的自反关系，根据自反闭包的定义有 \(r(R) \subseteq
    R\)。因此有 \(r(R) = R\)。反之，如果 \(r(R) = R\)，则由自反闭包定义可知\(R\)是自反的。'
