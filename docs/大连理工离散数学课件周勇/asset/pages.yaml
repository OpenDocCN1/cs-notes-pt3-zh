- pgno: 505
  md: '# # 函数的合成和合成函数的性质


    函数f的值域是函数g的定义域Y的子集，亦即ranf⊆domg。条件ranf⊆domg能确保合成函数g○f是非空的。否则，合成函数g○f是空集。如果g○f非空，则能保证g○f是从X到Z的函数。


    定理：设f:X→Y和g:Y→Z是两个函数：


    （1）合成函数g○f是从X→Z的函数，并且对于每一个x∈X，都有(g○f)(x)=g(f(x))


    （2）domg○f=f¹[domg], rang○f=g[ranf]


    其中f¹[domg]表示g的定义域在f下的原象集，g[ranf]表示f的值域在g下的象点集。'
