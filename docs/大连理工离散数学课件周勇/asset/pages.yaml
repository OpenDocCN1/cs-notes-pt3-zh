  md: '# # 积代数


    定义9.9 设\(V_1=<A, \circ>\)和\(V_2=<B, *>\)是同类型的代数系统，\(\circ\)和\(*\)

    为二元运算，在集合\(A \times B\)上如下定义二元运算 \(\blacksquare\)，

    \(\forall <a_1, b_1>, <a_2, b_2> \in A \times B\)，有

    [<a_1, b_1> \blacksquare <a_2, b_2> = <a_1 \circ a_2, b_1 * b_2>]

    称\(V = <A \times B, \blacksquare>\)为\(V_1\)与\(V_2\)的积代数，记作\(V_1 \times V_2\)。这时也称\(V_1\)和\(V_2\)为\(V\)的因子代数。


    实例 \(Z_2 = \{0, 1\}\)，\(V = <Z_2, \oplus>\)，\(V_1 \times V_2 = <Z_2 \times Z_2,
    \blacksquare>\)

    \(Z_2 \times Z_2 = \{<0, 0>, <1, 0>, <0, 1>, <1, 1>\}\)

    \(<0, 1> \blacksquare <1, 0> = <0, 0>\)


    注意：积代数的定义可以推广到具有多个运算的同类型的代数系统'
  merge: -1
