  md: '# # 练习5


    5. 对于以下各题给定的集合和运算判断它们是哪一类代数系统（半群、独异点、群、环、域、格、布尔代数），并说明理由。


    (1) \( S_1 = \{1, 1/2, 2, 1/3, 3, 1/4, 4\}, * \) 为普通乘法。


    (2) \( S_2 = \{a_1, a_2, \dots, a_n\}, \forall a_i, a_j \in S_2, a_i \circ a_j
    = a_i \)，这里的 \( n \) 为给定正整数，\( n > 1 \).


    (3) \( S_3 = \{0, 1\}, * \) 为普通乘法。


    (4) \( S_4 = \{1, 2, 3, 6\}, \forall x, y \in S_4, x \circ y \) 与 \( x * y \)
    分别表示 \( x \) 与 \( y \) 的最小公倍数和最大公约数。


    (5) \( S_5 = \{0, 1\}, * \) 为模2加法，\( \circ \) 为模2乘法。'
  merge: -1
  img_proc: true
- pgno: 756
  md: '# # 解答


    (1) 不是代数系统，因为乘法不封闭，例如4* 4=16.

    (2) 是半群但不是独异点，因为* 运算满足结合律，但是没有单位元.

    (3) 是独异点但不是群. 因为* 运算满足结合律，单位元是1，可是0没有乘法逆元.

    (4) 是格，也是布尔代数. 因为这两个运算满足交换律和分配律；求最小公倍数运算的单位元是1，求最大公约数运算的单位元是6，满足同一律；两个运算满足补元律.

    (5) 是域. 对于模 \( n \) 的环 \( Z_n \)，当 \( n \) 为素数时构成域.'
  merge: -1
  img_proc: true
- pgno: 757
  md: '# # 练习6


    6. 设\(<B,\wedge,\vee,\neg,0,1>\)是布尔代数，证明对于\(B\)中任意元素 \(a,b\)


    (1) \(a \vee (a \wedge b) = a \vee b\)


    (2) \(a \wedge \neg b = 0 \Leftrightarrow \neg a \vee b = 1 \Leftrightarrow a
    \leq b\)


    证 (1) \(a \vee \neg(a \wedge b) = (a \vee \neg a) \wedge (a \vee b) = 1 \wedge
    (a \vee b) = a \vee b\)


    (2) 由 \(a \wedge \neg b = 0\) 得 \(a \wedge \neg b = 1\)，即 \(\neg a \vee b = 1\)；反之也对。下面证明它们都等价于
    \(a \leq b\)。由 \(\neg a \vee b = 1\) 得


    \(a = a \wedge 1 = a \wedge (\neg a \vee b) = (a \wedge \neg a) \vee (a \wedge
    \neg b)\)


    \(= 0 \vee (a \wedge \neg b) = a \wedge \neg b\)


    即 \(a \leq b\)，又由 \(a \leq b\) 得


    \(a \wedge \neg b = (a \wedge b) \wedge \neg b = a \wedge (b \wedge \neg b) =
    a \wedge 0 = 0\)'
  merge: -1
  img_proc: true
- pgno: 758
  md: '# # 练习7


    7. 判断下述代数系统是否为格？是不是布尔代数？

    (1) \( S = \{1, 3, 4, 12\} \)；任给 \( x, y \in S \)，

    \( x \circ y = \text{lcm}(x, y) \)，\( x * y = \text{gcd}(x, y) \)，

    其中 \(\text{lcm}\) 是求最小公倍数，\(\text{gcd}\) 是求最大公约数。

    (2) \( S = \{0, 1, 2\} \)；\( \circ \) 是模3加法，\( * \) 是模3乘法

    (3) \( S = \{0, \dots, n\} \)，其中 \( n \geq 2 \)；任给 \( x, y \in S \)，

    \( x \circ y = \max(x, y) \)，\( x * y = \min(x, y) \)


    (1) 是布尔代数。

    (2) 不是格。

    (3) 是格，但不是布尔代数。'
