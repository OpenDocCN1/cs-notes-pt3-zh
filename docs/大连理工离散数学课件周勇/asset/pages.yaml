  md: '# 循环群的生成元


    定理：设 $G=\langle a\rangle$ 是循环群。


    +   1. 若 $G$ 是无限循环群，则 $G$ 只有两个生成元，即 $a$ 和 $a^{-1}$。

    +   2. 若 $G$ 是 $n$ 阶循环群，则 $G$ 含有 $\phi(n)$ 个生成元。对于任何小于 $n$ 且与 $n$ 互素的数 $r\in\{0,1,\ldots,n-1\}$，$a^r$
    是 $G$ 的生成元。


    $\phi(n)$ 成为欧拉函数，例如 $n=12$，小于或等于 12 且与 12 互素的正整数有 4 个：


