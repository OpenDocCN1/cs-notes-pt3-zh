- pgno: 1012
  md: '# 对偶图


    **定义：** 设平面图 $G$ 有 $k$ 个面 $F_0,F_1,\cdots,F_{k-1}$。对每个面 $F_i$ 在其内部指定一个新顶点 $f_i$；对
    $F_i$ 和 $F_j$ 公共的边，指定一条新边 $\{f_i,f_j\}$ 与其相交。这些新顶点和新边组成的图用来表示 $G^*$，并称 $G^*$ 为图
    $G$ 的对偶图。


    由 $G$ 求 $G^*$ 的方法：对于 $G$ 中的任何一个面 $F_i$，给 $G^*$ 指定一个结点 $f_i$；对于面 $F_i$ 和 $F_j$
    所共有的一条边，给 $G^*$ 指定一条边 $\{f_i,f_j\}$。实际上，首先在 $F_i$ 内指定每个结点 $f_i$，并且用连通 $f_i$ 和
    $f_j$ 的一条边，去交叉 $F_i$ 和 $F_j$ 所共有的边，这样就可求得对偶图 $G^*$。'
  merge: -1
  img_proc: true
