- pgno: 538
  md: '# # 反函数


    定理：给定函数\(f: X \to Y\)和\(g: Y \to Z\)，并且\(f\)和\(g\)都是可逆的。于是应有


    \((g \circ f)^{-1} = f^{-1} \circ g^{-1}\)


    证明：\((f^{-1} \circ g^{-1}) \circ (g \circ f) = f^{-1} \circ (g^{-1} \circ g) \circ
    f\)


    \(= f^{-1} \circ I_Y \circ f\)


    \(= f^{-1} \circ f = I_X\)


    \((g \circ f) \circ (f^{-1} \circ g^{-1}) = g \circ (f \circ f^{-1}) \circ g^{-1}\)


    \(= g \circ I_Y \circ g^{-1}\)


    \(= g \circ g^{-1} = I_Z\)


    得证。'
  merge: -1
  img_proc: true
