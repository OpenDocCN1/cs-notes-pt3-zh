- pgno: 414
  md: '# ## 二、等价关系


    定理：任何集合 \( X \subseteq \mathbf{Z} \) 中的模 \( m \) 相等关系，是一个等价关系。


    证明：设 \( R \) 是任何集合 \( X \subseteq I \) 中的模 \( m \) 相等价关系。如果 \( X = \Phi \)，则 \(
    R \) 是个空关系，显然有是自反的、对称的和可传递的。如果 \( X \neq \Phi \)，则需考察下列三条：


    (1) 对于任何 \( x \in X \) 来说，因为 \( x - x = 0 \cdot m \)，所以有 \( x \equiv x \pmod{m}
    \) 因此，模 \( m \) 相等关系是自反的。


    (2) 对于任何 \( x, y \in X \) 来说，如果 \( x \equiv y \pmod{m} \)，则存在某一个 \( x, y \in X
    \)，能使 \( x - y = n \cdot m \)。于是可有 \( y - x = (-n) \cdot m \)，因此有 \( y \equiv
    x \pmod{m} \)，即模 \( m \) 相等关系是对称的。


    (3) 设 \( x, y, z \in X \)，\( x \equiv y \pmod{m} \) 和 \( y \equiv x \pmod{m} \)。于是存在
    \( n_1, n_2 \in \mathbf{Z} \)，能使 \( (x - y) = n_1 \cdot m \) 和 \( (y - z) = n_2
    \cdot m \)。


    而 \( x - z = x - y + y - z = n_1 \cdot m + n_2 \cdot m = (n_1 + n_2) \cdot m \)，从而可有
    \( x \equiv z \pmod{m} \)，即模 \( m \) 相等关系是可传递的。'
  merge: -1
  img_proc: true
