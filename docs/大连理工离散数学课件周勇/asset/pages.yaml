- pgno: 357
  md: '# 关系的性质


    **(3)** 对任意的 $x,y\in A$，若 $\langle x,y\rangle\in R$，则 $\langle y,x\rangle\in R$，就称
    $R$ 为**对称的**。用式子来表述即是：


    $R$ 是对称的 $\Leftrightarrow (\forall x)(\forall y)(x,y\in A\land\langle x,y\rangle\in
    R\rightarrow\langle y,x\rangle\in R)$


    **(4)** 对任意的 $x,y\in A$，若 $\langle x,y\rangle\in R$ 且 $\langle y,x\rangle\in R$，则
    $x=y$，就称 $R$ 为**反对称的**。用式子来表述即是：


    $R$ 是反对称的 $\Leftrightarrow (\forall x)(\forall y)(x,y\in A\land\langle x,y\rangle\in
    R\land\langle y,x\rangle\in R\rightarrow x=y)$'
