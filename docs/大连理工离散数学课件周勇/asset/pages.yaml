- pgno: 878
  md: '# # 可达性矩阵


    可以用不同的方法解释矩阵\(A, A^{(2)}, A^{(3)}, \cdots\) 。在简单有向图\(G = \langle V, E, \psi \rangle\)
    中，应有\(E \subseteq V \times V\)，因此可以把集合\(E\)看成是\(V\)中的二元关系。邻接矩阵\(A\)是关系\(E\)的关系矩阵。在第四章中，曾经把合成关系\(E
    \circ E = E^2\) 定义成这样一种关系：如果存在一个结点\(v_k\)，能使\(v_i E v_k\)和\(v_k E v_j\)，则必有\(v_i
    E^2 v_j\)。换句话说，从\(v_i\)到\(v_j\)如果至少存在一条长度为2的路径的话，那么\(E^2\)的关系矩阵中的\((i, j)\)元素值是1。这就说明了，矩阵\(A^{(2)}\)是关系\(E^2\)的关系矩阵。与此类似，\(A^{(3)}\)是\(V\)中的关系\(E
    \circ E \circ E = E^3\)的关系矩阵，类推。


    设\(E_1\)和\(E_2\)是\(V\)中的两种关系，并且\(A_1\)和\(A_2\)分别是\(E_1\)和\(E_2\)的关系矩阵。于是，关系\(E_1
    \cup E_2\)和\(E_1 \circ E_2\)的关系矩阵分别是\(A_1 \lor A_2\)和\(A_1 \land A_2\)。'
  merge: -1
  img_proc: true
- pgno: 879
  md: '# # 闭包


    对于集合\( V \)中的关系\( E \)来说，\( E \)的可传递闭包\( E^+ \)应是


    \( E^+ = E \cup E^2 \cup E^3 \cup \cdots \)


    可传递闭包\( E^+ \)的关系矩阵应为：


    \( A^+ = A \lor A^{(2)} \lor A^{(3)} \lor \cdots \)


    式中的\( A \)是关系\( E \)的关系矩阵。如果\( |V| = n \)，则图中的基本路径或基本循环的长度不会超过\( n \)。因此


    \( A^+ = A \lor A^{(2)} \lor A^{(3)} \lor \cdots \lor A^{(n)} = P \)


    可见，矩阵\( A^+ \)与路径矩阵\( P \)相同。计算关系的可传递闭包等同于计算对应关系图的路径矩阵。'
  merge: -1
  img_proc: true
- pgno: 880
  md: '# 可达性矩阵判断强分图


    由路径矩阵P可以求得含有给定图的任何特定结点的强分图。


    设G=⟨V,E,ψ⟩是一个简单有向图，并且G≠Φ。P是图G的路径矩阵，PT是矩阵P的转置。设矩阵P中的(i,j)元素为Pij，而矩阵PT中的(i,j)元素为PijT。试定义一个矩阵P∧PT，使得它的(i,j)元素为PijPijT。于是，矩阵P∧PT中的第i行，就确定了含有结点vi的强分图。'
  merge: -1
  img_proc: true
