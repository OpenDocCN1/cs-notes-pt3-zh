- pgno: 496
  md: '# # 函数的扩大和缩小


    定义：给定函数\(f: X \to Y\)，且有\(A \subseteq X\)。


    (1) 试构成一个从\(A\)到\(Y\)的函数


    \(g = f \cap (A \times Y)\)


    通常称\(g\)是函数\(f\)的**缩小**，并记作\(f|A\)。


    (2) 如果\(g\)是\(f\)的缩小，则称\(f\)是\(g\)的**扩大**。


    从定义可以看出，函数\(f|A: A \to Y\)的域是集合\(A\)，而函数\(f\)的域则是集合\(X\)。\(f|A\)和\(f\)的陪域均是集合\(Y\)。于是若\(g\)是\(f\)的缩小，则应有


    \(\text{dom}g \subseteq \text{dom}f \text{ 且 } g \subseteq f\)


    并且对于任何\(x \in \text{dom}g\)都有\(g(x) = (f|A)(x) = f(x)\)。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 函数的扩大和缩小


    例：设 $X_1=\{0,1\},X_2=\{0,1,2\},Y=\{a,b,c,d\}$。定义从 $X_1^2$ 到 $Y$ 的函数为：


    $f=\{\langle 0,0,a\rangle,\langle 0,1,b\rangle,\langle 1,0,c\rangle,\langle 1,1,b\rangle\}$。


    $g=f\cup\{\langle 0,2,a\rangle,\langle 2,2,d\rangle\}$ 是从 $X_1^2\cup\{\langle
    0,2\rangle,\langle 2,2\rangle\}$ 到 $Y$ 的函数。


    于是 $f=g/X_1^2$，因此 $f$ 是 $g$ 在 $X_1^2$ 上的缩小（或称限制），$g$ 是 $f$ 到 $X_1^2\cup\{\langle
