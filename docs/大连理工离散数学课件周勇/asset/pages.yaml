- pgno: 928
  md: '# # 可达性矩阵


    可以用不同的方法解释矩阵\(A, A^{(2)}, A^{(3)}, \cdots\) 。在简单有向图\(G = \langle V, E, \psi \rangle\)
    中，应有\(E \subseteq V \times V\)，因此可以把集合\(E\)看成是\(V\)中的二元关系。邻接矩阵\(A\)是关系\(E\)的关系矩阵。在第四章中，曾经把合成关系\(E
    \circ E = E^2\) 定义成这样一种关系：如果存在一个结点\(v_k\)，能使\(v_k E v_k\)和\(v_k E v_j\)，则必有\(v_i
    E^2 v_j\)。换句话说，从\(v_i\)到\(v_j\)如果至少存在一条长度为2的路径的话，那么\(E^2\)的关系矩阵中的\((i,j)\)元素值是1。这就说明了，矩阵\(A^{(2)}\)是关系\(E^2\)的关系矩阵。与此类似，\(A^{(3)}\)是\(V\)中的关系\(E
    \circ E \circ E = E^3\)的关系矩阵，类推。


    设\(E_1\)和\(E_2\)是\(V\)中的两种关系，并且\(A_1\)和\(A_2\)分别是\(E_1\)和\(E_2\)的关系矩阵。于是，关系\(E_1
    \cup E_2\)和\(E_1 \circ E_2\)的关系矩阵分别是\(A_1 \lor A_2\)和\(A_1 \odot A_2\)。'
  merge: -1
  img_proc: true
- pgno: 929
  md: '# # 闭包


    对于集合_V_中的关系_E_来说， _E_的可传递闭包_E_<sup>+</sup>应是


    \(E^+ = E \cup E^2 \cup E^3 \cup \cdots\)


    可传递闭包_E_<sup>+</sup>的关系矩阵应为：


    \(A^+ = A \lor A^{(2)} \lor A^{(3)} \lor \cdots\)


    式中的_A_是关系_E_的关系矩阵。如果|_V_|=_n_，则图中的基本路径或基本循环的长度不会超过_n_。因此


    \(A^+ = A \lor A^{(2)} \lor A^{(3)} \lor \cdots \lor A^{(n)} = P\)


    可见，矩阵_A_<sup>+</sup>与路径矩阵_P_相同。计算关系的可传递闭包等同于计算对应关系图的路径矩阵。'
  merge: -1
  img_proc: true
- pgno: 930
  md: '# 可达性矩阵判断强分图


    由路径矩阵 $P$ 可以求得含有给定图的任何特定结点的强分图。


    设 $G=\langle V,E,\psi\rangle$ 是一个简单有向图，并且 $G\neq\Phi$。$P$ 是图 $G$ 的路径矩阵，$P^T$ 是矩阵
    $P$ 的转置。设矩阵 $P$ 中的 $(i,j)$ 元素为 $p_{ij}$，而矩阵 $P^T$ 中的 $(i,j)$ 元素为 $p^T_{ij}$。试定义一个矩阵
    $P\wedge P^T$，使得它的 $(i,j)$ 元素为 $p_{ij}p^T_{ij}$。于是，矩阵 $P\wedge P^T$ 中的第 $i$ 行，就确定了含有结点
    $v_i$ 的强分图。'
  merge: -1
