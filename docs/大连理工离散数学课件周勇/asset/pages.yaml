- pgno: 819
  md: '# 9.3路径、回路和连通性


    定义：设G =< V,E >是图, 从图中结点v0到vn的一条路径或通路是图的一个点、边的交错序列 (v0e1v1e2v2⋯vn−1envn) , 其中ei
    = (vi−1,vi) (或者ei=< vi−1,vi >) (i = 1,2, ⋯,n) , v0 , vn分别称为通路的起点和终点, 路径中包含的边数n称为路径的长度,当起点和终点重合时则称其为闭路路径。


    定义：如果G =< V,E >中出现的边e1,e2,…,en互不相同，则称该路径为简单路径。闭的简单路径称为回路。如果出现的点v1,v1,…,vn互不相同，则称该路径是基本路径。基本路径中除了起点和终点相同外，别无相同的结点，则称为圈。'
  merge: -1
  img_proc: true
