  md: '# # 积半群


    例4：给定两个半群<**S**, ○ >和<**T**, *>。称<**S×T**, ⊗>为<**S** , ○ >和<**T**, *>的**积半群**，其中**S×T**为集合**S**与**T**的笛卡儿积，运算⊗定义如下：<**s1**,
    **t1**> ⊗ <**s2**, **t2**> =<**s1**○ **s2** , **t1*** **t2**>，其中**s1**, **s2**∈**S**,
    **t1**, **t2**∈**T**。由于⊗是由○ 和*定义的，易知积半群是个半群。


    证明：⊗是一个二元运算，因为○ 和*都是二元运算。考虑：

    (**s1**, **t1**) ⊗ ( (**s2**, **t2**) ⊗ (**s3**, **t3**) )

    = (**s1**, **t1**) ⊗ (**s2**○ **s3**, **t2*** **t3**)

    = (**s1**○ (**s2**○ **s3**) , **t1*** (**t2*** **t3**) )

    = ( (**s1**○ **s2**) ○ **s3**, (**t1*** **t2**) * **t3**)

    = ( (**s1**, **t1**) ⊗ (**s2**, **t2**) ⊗ (**s3**, **t3**) )

    综上⊗是可结合的。'
