- pgno: 806
  md: '# # 9.2子图和图的运算


    定义：设 \( G = \langle V, E, \psi \rangle \) 和 \( G'' = \langle V'', E'', \psi''
    \rangle \) 为图。


    (1)如果 \( V'' \subseteq V, E'' \subseteq E, \psi'' \subseteq \psi \) ，则称 \( G''
    \) 是 \( G \) 的**子图**，记作 \( G'' \subseteq G \) ，并称 \( G \) 是 \( G'' \) 的**母图**。


    (2)如果 \( V'' \subseteq V, E'' \subset E, \psi'' \subset \psi \) ，则称 \( G'' \)
    是 \( G \) 的**真子图**，记作 \( G'' \subset G \) 。


    (3)如果 \( V'' = V, E'' \subseteq E, \psi'' \subseteq \psi \) ，则称 \( G'' \) 是 \(
    G \) 的**生成子图**。


    **平凡生成子图**：对于图 \( G = \langle V, E, \psi \rangle \)，\( G \) 本身以及零图 \( G = \langle
    V, \varnothing \rangle \) 都是 \( G \) 的平凡生成子图。'
  merge: -1
  img_proc: true
- pgno: 807
  md: '# 子图


    定义: 设图 G = <V, E, ψ>, V'' ⊆ V 且 V'' ≠ Φ. 以 V 为结点集合, 以起点和终点均在 V'' 中的边的全体为边集合的 G
    的子图, 称为由 V'' 导出的 G 的子图, 记为 G[V'']. 若 V'' ⊂ V, 导出子图 G[V - V''], 记为 G - V''.


    G - V'' 是从 G 中去掉 V'' 中的结点以及与这些结点关联的边而得到的图 G 的子图。


    定义: 设图 G = <V, E, ψ>, E'' ⊆ E 且 E'' ≠ ∅, V'' = {v | v ∈ V ∧ (∃e)(e ∈ E'' ∧ v 与
    e 关联)}. 以 V'' 为结点集合, 以 E'' 为边集合的 G 的子图称为由 E'' 导出的子图。'
  merge: -1
  img_proc: true
