  md: '# # 七、全集


    定义： 在一定范围内，如果所有集合均为某一集合的子集，则称该集合为全集，记作E。


    \( E = \{x \mid P(x) \lor \neg P(x)\} \)


    \( (\forall x)(x \in E) \) 恒真


