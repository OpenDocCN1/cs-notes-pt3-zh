- pgno: 633
  md: '# # 有关群的术语


    # ## 定义7.8


    (1) 若群\(G\)是有穷集，则称\(G\)是**有限群**，否则称为无限群。群\(G\)的基数称为群 \(G\) 的阶，有限群\(G\)的阶记作\(|G|\)。


    (2) 只含单位元的群称为**平凡群**。


    (3) 若群\(G\)中的二元运算是可交换的，则称\(G\)为**交换群**或**阿贝尔 (Abel) 群**。


    实例：


    \(<\mathbb{Z},+>\) 和 \(<\mathbb{R},+>\) 是无限群，\(<\mathbb{Z}_n,\oplus>\) 是有限群，也是
    \(n\) 阶群。

    Klein 四元群是 4 阶群。\(<\{0\},+>\) 是平凡群。


    上述群都是交换群，\(n\) 阶(\(n\ge2\))实可逆矩阵集合关于矩阵乘法构成的群是非交换群。'
