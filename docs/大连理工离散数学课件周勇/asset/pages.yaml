- pgno: 433
  md: '# 三、相容关系


    在相容关系中，**如果有** $xRy$，则称 $x$ 和 $y$ 是相容的。例如前面的例子中，$X=\{2166,243,375,648,455\}$，令
    $x_1=2166,x_2=243,x_3=375,x_4=648,x_5=455$，则 $x_1Rx_2$，$x_2Rx_3$，但是 $x_1\not R
