- pgno: 565
  md: '# # 二元运算


    定理：设*是集合X中的二元运算，且\(S_1 \subseteq X\) 和 \(S_2 \subseteq X\)。 在*运算的作用下，\(S_1\) 和
    \(S_2\) 都是封闭的。于是在*运算的作用下 \(S_1 \cap S_2\) 也是封闭的。


    证：因为\(S_1\) 和 \(S_2\) 在运算*的作用下是封闭的，所以 对于每一个序偶 \(\langle x_1, x_2 \rangle \in S_1\)
    来说，有 \(x_1 * x_2 \in S_1\)； 对于每一个序偶 \(\langle x_1, x_2 \rangle \in S_2\) 来说有 \(x_1
    * x_2 \in S_2\)。 因此， 对于每一个序偶 \(\langle x_1, x_2 \rangle \in S_1 \cap S_2\) 来说，有
    \(x_1 * x_2 \in S_1 \cap S_2\)。'
