- pgno: 852
  md: '# 9.4图的矩阵表示


    # 邻接矩阵


    定义： 设 \( G=\langle V,E,\psi\rangle \) 是一个简单有向图，其中的结点集合 \( V=\{v_1,v_2,\cdots v_n\}\)
    ，并且假定各结点已经有了从结点 \( v_1 \) 到 \( v_n \) 的次序。试定义一个 \( n \times n \) 的矩阵 \( A \)，使得其中的元素


    \( a_{ij} = \begin{cases} 1 & \text{当} \langle v_i, v_j \rangle \in E \\ 0 & \text{当}
    \langle v_i, v_j \rangle \notin E \end{cases} \) (1)


    则称这样的矩阵 \( A \) 是图 \( G \) 的邻接矩阵。'
  merge: -1
  img_proc: true
- pgno: 853
  md: '# 邻接矩阵


    **定义：** 元素或为0或为1的任何矩阵，都称为[比特矩阵](#)或[布尔矩阵](#)。


    邻接矩阵也是布尔矩阵，第行上值为1的元素的个数，等于结点 $v_i$ 的出度；第列上值为1的元素的个数，等于结点 $v_j$ 的入度。'
  merge: -1
  img_proc: true
- pgno: 854
  md: '# # 邻接矩阵


    图的邻接矩阵不具有唯一性。


    对于给定简单有向图 \( G = \langle V, E, \psi \rangle \) 来说，其邻接矩阵依赖于集合 \( V \) 中的各元素间的次序关系。


    给定两个有向图和相对应的邻接矩阵，如果首先在一个图的邻接矩阵中交换一些行，而后交换相对应的各列，从而有一个图的邻接矩阵，能够求得另外一个图的邻接矩阵，则事实上这样的两个有向图，必定是互为同构的。'
  merge: -1
  img_proc: true
- pgno: 855
  md: '# # 邻接矩阵


    例：写出下图的邻接矩阵，并计算各个节点的出度和入度。


    解：首先给各结点安排好一个次序，譬如说是\(v_1, v_2, v_3, v_4, v_5\)。得出邻接矩阵如下：


