  md: '# # 对偶原理


    +   - 定理1.3：

    +   若 \( A \Rightarrow B \)，且 \( A \)、\( B \) 为命题变元 \( P_1, P_2, \cdots, P_n \)
    及联结词 \( \land, \lor, \neg \) 构成的公式，则 \( B^* \Rightarrow A^* \)。


