- pgno: 839
  md: '# 连通图


    **定义：**设$G$是有向图。


    +   1. 如果$G$中任意两个结点都互相可达，则称$G$是**强连通的**。

    +   2. 如果对于$G$的任意两结点，必有一个结点可达另一个结点，则称$G$是**单向连通的**。

    +   3. 如果$G$的基础图是连通的，则称$G$是**弱连通的**。


    ![](img/d475a943ed426379b80e793b9fe1f17d_839_0.png)'
