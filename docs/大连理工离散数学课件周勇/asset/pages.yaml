- pgno: 750
  md: '# 第六章3 习题课




    +   - 格的两个等价定义

    +   - 格的性质

    +   - 子格

    +   - 特殊格：分配格、有界格、有补格、布尔代数




    +   - 能够判别给定偏序集或者代数系统是否构成格

    +   - 能够确定一个命题的对偶命题

