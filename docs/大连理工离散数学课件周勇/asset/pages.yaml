  md: '# 关系运算的性质


    # 定理7.5


    设 $F$ 为关系，$A,B$ 为集合，则


    +   1. $F^{\wedge}(A\cup B)=F^{\wedge}A\cup F^{\wedge}B$

    +   2. $F[A\cup B]=F[A]\cup F[B]$

    +   3. $F^{\wedge}(A\cap B)=F^{\wedge}A\cap F^{\wedge}B$

    +   4. $F[A\cap B]\subseteq F[A]\cap F[B]$'
  merge: -1
  img_proc: true
- pgno: 345
  md: '证只证 (1) 和 (4)。


    (1) 任取 `<x,y>`


    $\langle x,y\rangle\in F^{-1}(A\cup B)$


    $\Leftrightarrow\langle x,y\rangle\in F^{-1}\land x\in A\cup B$


    $\Leftrightarrow\langle x,y\rangle\in F^{-1}\land(x\in A\lor x\in B)$


    $\Leftrightarrow(\langle x,y\rangle\in F^{-1}\land x\in A)\lor(\langle x,y\rangle\in
    F^{-1}\land x\in B)$


    $\Leftrightarrow\langle x,y\rangle\in F^{-1}A\lor\langle x,y\rangle\in F^{-1}B$


    $\Leftrightarrow\langle x,y\rangle\in F^{-1}A\cup F^{-1}B$


    所以有 $F^{-1}(A\cup B)=F^{-1}A\cup F^{-1}B$。'
  merge: -1
  img_proc: true
- pgno: 346
  md: '**(4) 任取**，


    $y\in F[A\cap B]$


    $\Leftrightarrow \exists x\ (\langle x,y\rangle\in F\land x\in A\cap B)$


    $\Leftrightarrow \exists x\ (\langle x,y\rangle\in F\land x\in A\land x\in B)$


    $\Leftrightarrow \exists x\ ((\langle x,y\rangle\in F\land x\in A)\land(\langle
    x,y\rangle\in F\land x\in B))$


    $\Rightarrow \exists x\ (\langle x,y\rangle\in F\land x\in A)\land \exists x\
    (\langle x,y\rangle\in F\land x\in B)$


    $\Leftrightarrow y\in F[A]\land y\in F[B]$


    $\Leftrightarrow y\in F[A]\cap F[B]$


    所以有 $F[A\cap B]=F[A]\cap F[B]$。'
