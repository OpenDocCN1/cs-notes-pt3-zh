    = \{e\}\)。


    证 \(H_1 \cap H_2 \leq H_1\)，\(H_1 \cap H_2 \leq H_2\)。由 Lagrange 定理，\(|H_1 \cap
    H_2|\) 整除 \(r\)，也整除 \(s\)。从而 \(|H_1 \cap H_2|\) 整除 \(r\) 与 \(s\) 的最大公因子。因为 \((r,s)
