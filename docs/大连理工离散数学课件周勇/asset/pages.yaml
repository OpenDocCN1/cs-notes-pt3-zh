  md: '# # 可达性矩阵


    # ## 注意：


    对于具有n个结点的图而言，长度为n的路径不可能是基本路径。


    假定图中的每一个结点，从它本身出发总是可达的，由矩阵B<sub>n-1</sub>构成路径矩阵P，或由矩阵B<sub>n</sub>构成路径矩阵P，这两种方法都可以采纳。'
