- pgno: 10
  md: '# # 1.1 命题与命题逻辑联结词


    # ## 2.命题的真值及表示


    +   - 命题用大写的英文字母，如 \( P, Q, R \ldots \) 表示。

    +     \( P \): 今天是星期一。


    +   - 命题仅有两种可能的真值—真和假，且二者只能居其一。如果一个命题的真值是真，则用1或Ture(T)来表示；如果一个命题的真值是假，则用0或False(F)来表示。


    > > 定义：

    > > 一个命题不能再分解为更简单的命题，这个命题称为原子命题。'
  merge: -1
  img_proc: true
