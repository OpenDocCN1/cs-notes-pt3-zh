- pgno: 458
  md: '# 全序关系


    定义：设 \(\langle P,\leq\rangle\) 是个偏序集合。如果对于每一个 \(x,y\in P\)，或者 \(x\leq y\) 或者 \(y\leq
    x\)，亦即


    \[(\forall x)(\forall y)(x\in P\land y\in P\to x\leq y\lor y\leq x)\]


    则称偏序关系\(\leq\)是**全序关系**，简称**全序**，序偶 \(\langle P,\leq\rangle\) 称为**全序集合**。


    注意：\(P\)中具有全序关系的各元素，总能按线性次序 \(x_1,x_2,\cdots\) 排列起来，这里当且仅当 \(i\leq j\)，才有 \(x_i\leq
    x_j\)，故全序也称为简单序或线性序，因此，序偶 \(\langle P,\leq\rangle\) 在这种情况下也被称为**线性序集**或**链**。'
  merge: -1
  img_proc: true
- pgno: 459
  md: "# # 全序关系\n\n# ## 元素的可比性：\n\n设\\(\\le\\)是集合\\(P\\)中的偏序关系。对于 \\(x,y \\in P\\\
    )，如果有  \n\\(x \\le y\\) 或 \\(y \\le x\\)，则\\(P\\)中的元素\\(x\\)和\\(y\\)称为**可比的**。在偏序集合中，并非任何两个元素\\\
    (x\\)和\\(y\\)都存在有\\(x \\le y\\) 或 \\(y \\le x\\)的关系。事实上，对于某些\\(x\\)和\\(y\\)来说，和可能没有关系。在这种情况下，称\\\
    (x\\)和\\(y\\)是**不可比的**。正是由于这种原因，才称作“偏”序关系。在全序集合中，任何两个元素都是可比的。"
