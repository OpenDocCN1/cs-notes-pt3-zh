- pgno: 422
  md: '# # 特殊的等价关系


    全域关系：令等价关系\(R_I=X \times X\)，这里\(X\)的每一个元素与\(X\)的所有元素都有\(R_I\)的关系。按\(R_I\)划分\(X\)的商集乃是集合\(\{X\}\)。等价关系\(R_I\)是全域关系。全域关系会造成集合\(X\)的**最小划分**。


    恒等关系\(R\)：\(X\)的每一个元素仅关系到它自身，而不关系到其它元素。显然，\(R\)是个恒等关系。按\(R\)划分\(X\)的商集，仅由单元素集合组成。恒等关系\(R\)会造成集合\(X\)的**最大划分**。这些划分均称作\(X\)的**平凡划分**。'
