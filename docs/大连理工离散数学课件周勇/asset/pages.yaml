  md: '# 10.3 二部图及匹配


    **定义：** 设无向图 $G=\langle V,E,\psi\rangle$。如果存在 $V$ 的划分 $\{V_1,V_2\}$，使得 $V_i$ 中的任何两个结点都不相邻（$i=1,2$），则称
    $G$ 为**二部图**，$V_1$ 和 $V_2$ 称为 $G$ 的**互补结点子集**。


    二部图没有自圈。与二部图的一条边关联的两个结点一定分别属于两个互补结点子集。一般来说，二部图的互补结点子集的划分不是唯一的。


    ![](img/d475a943ed426379b80e793b9fe1f17d_980_0.png)'
