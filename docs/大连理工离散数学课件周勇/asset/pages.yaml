- pgno: 503
  md: '# 函数的构成


    设 $A$ 和 $B$ 都是有限集合，且 $|A|=m$ 和 $|B|=n$，因为任何函数 $f:A\to B$ 的定义域都是集合 $A$，所以每个函数中都恰有
    $m$ 个序偶。而且，任何元素 $x\in A$，都可以在 $B$ 的 $n$ 个元素中任选其一作为自己的象点。因此，应有 $n^m$ 个可能的不同函数，亦即


    $|B^A|=|B|^{|A|}=n^m$


    例：设 $A$ 为任意集合，$B$ 为任意非空集合。


    +   （1）因为存在唯一的一个从 $\Phi$ 到 $A$ 的函数，所以 $A^\Phi=\{\Phi\}$。

    +   （2）因为不存在从 $B$ 到 $\Phi$ 的函数，所以 $\Phi^B=\Phi$。'
  merge: -1
