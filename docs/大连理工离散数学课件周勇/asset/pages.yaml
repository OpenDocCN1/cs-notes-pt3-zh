- pgno: 962
  md: '# # 欧拉图


    定理： 设G为弱连通的有向图。 G是欧拉有向图， 当且仅当G有欧拉闭路。


    每个结点的出度和入度相等的连通有向图称为 欧拉有向图。


    定理： 设G为弱连通有向图。 \(v_1\)和\(v_2\)为G的两个不 同结点。 G有一条从\(v_1\)至\(v_2\)的欧拉路径， 当且仅 当 \(d_G^+(v_1)=d_G^-(v_1)+1\)，
    \(d_G^+(v_2)=d_G^-(v_2)-1\)， 且对G的其它 结点\(v\)有\(d_G^+(v)=d_G^-(v)\) 。'
  merge: -1
  img_proc: true
- pgno: 963
  md: '# 欧拉图


    **定理：** 如果 $G_1$ 和 $G_2$ 是可运算的欧拉图，则 $G_1\oplus G_2$ 是欧拉图。


    **证：** 设 $v$ 是 $G_1\oplus G_2$ 的任意结点，于是可能出现三种情况：$v$ 是 $G_1$ 的结点而不是 $G_2$ 的结点，$v$
    是 $G_2$ 的结点而不是 $G_1$ 的结点，$v$ 是 $G_1$ 和 $G_2$ 的公共结点。显然，若属于前两种情况，$v$ 是 $G_1\oplus
    G_2$ 的偶结点。设 $v$ 是 $G_1$ 和 $G_2$ 的公共结点，$G_1$ 和 $G_2$ 有 $k$ 条公共边和 $l$ 个公共自圈与 $v$
    关联，则

    $$d_{G_1\oplus G_2}(v)=d_{G_1}(v)+d_{G_2}(v)-2(k+l)，$$

    显然 $v$ 是 $G_1\oplus G_2$ 的偶结点。因此，$G_1\oplus G_2$ 是欧拉图。'
  merge: -1
  img_proc: true
