- pgno: 658
  md: '# # Lagrange定理的推论


    **推论1** 设\(G\)是\(n\)阶群，则\(\forall a \in G\)，\(|a|\)是\(n\)的因子，且有\(a^n = e\)。


    证 任取\(a \in G\)，\(<a>\)是\(G\)的子群，\(<a>\)的阶是\(n\)的因子。

    \(<a>\)是由\(a\)生成的子群，若\(|a| = r\)，则

    [<a> = \{a^0=e, a^1, a^2, \dots, a^{r-1}\}]

    即\(<a>\)的阶与\(|a|\)相等，所以\(|a|\)是\(n\)的因子。从而\(a^n = e\)。


    **推论2** 对阶为素数的群\(G\)，必存在\(a \in G\)使得\(G = <a>\)。


    证 设\(|G| = p\)，\(p\)是素数。由\(p \geq 2\)知\(G\)中必存在非单位元。

    任取\(a \in G\)，\(a \neq e\)，则\(<a>\)是\(G\)的子群。根据拉格朗日定理，\(<a>\)的阶是\(p\)的因子，即\(<a>\)的阶是\(p\)或1。显然\(<a>\)的阶不是1，这就推出\(G
    = <a>\)。'
  merge: -1
  img_proc: true
