  md: "# # 7.5 环与域\n\n定义：设 \\(<R, +, \\cdot>\\) 是代数系统，\\(+\\cdot\\) 是二元运算。如果满足以下条件：\n\
    (1) \\(<R, +>\\) 构成交换群  \n(2) \\(<R, \\cdot>\\) 构成半群  \n(3) \\(\\cdot\\) 运算关于\
    \ \\(+\\) 运算适合分配律  \n则称 \\(<R, +, \\cdot>\\) 是一个环。\n\n通常称 \\(+\\) 运算为环中的加法，\\\
    (\\cdot\\) 运算为环中的乘法。  \n环中加法单位元记作 0，乘法单位元（如果存在）记作 1。  \n对任何元素 \\(x\\)，称 \\(x\\\
    ) 的加法逆元为负元，记作 \\(-x\\)。  \n若 \\(x\\) 存在乘法逆元的话，则称之为逆元，记作 \\(x^{-1}\\)。"
