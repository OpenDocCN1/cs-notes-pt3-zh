- pgno: 8
  md: '# # 1.1 命题与命题逻辑联结词


    # ## 一、命题


    所谓命题，是指具有非真必假的陈述句。而疑问句、祈使句和感叹句等因都不能判断其真假，故都不是命题。


    定义：或者为真，或者为假而不是两者同时成立的陈述句被称为一个命题。


    或真或假，不能既真又假。


    例1:判断下面语句是否是命题


    +   - 华盛顿是美国的首都。

    +   - 多伦多是加拿大的首都。

    +   - \(1+101=110\)

    +   - 几点了？

    +   - \(x+1=3\)

    +   - 真热呀！

    +   - 坑爹

    +   - 神马都是浮云


    或真或假，不能既真又假'
  merge: -1
  img_proc: true
