    \    [\n+     \\sigma = \\begin{pmatrix} 1 & 2 & 3 & 4 \\\\ 2 & 3 & 1 & 4 \\end{pmatrix}\n\
    +     ]  \n+     \n+     可以有下面不同的对换表示：  \n+     [\n+     \\sigma = (1\\ 2)(1\\\
    \ 3), \\quad \\sigma = (1\\ 4)(2\\ 4)(3\\ 4)(1\\ 4)\n+     ]\n\n+   - 表示式中所含对换个数的奇偶性是不变的。\
    \  \n+     如果\\(n\\)元置换\\(\\sigma\\)可以表示成奇数个对换之积，则称\\(\\sigma\\)为**奇置换**，否则称为**偶置换**，不难证明奇置换和偶置换各有\\\
