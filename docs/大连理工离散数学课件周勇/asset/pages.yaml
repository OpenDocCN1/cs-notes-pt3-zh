  md: '# # 邻接矩阵


    # ## 逆图的邻接矩阵：


    如果给定的图\( G = \langle V, E, \psi \rangle \)是一个简单有向图，并且其邻接矩阵是\( A \)，则图\( G \)的逆图的邻接矩阵
    \( \widetilde{G} \) 是\( A \)的转置\( A^T \)。对于无向图或者对称的有向图来说，应有\( A^T = A \)。'
