- pgno: 540
  md: '# # 5.5特征函数


    用一种很简单的函数来确定集合与集合间的关系，这种函数就是特征函数。


    定义：设\(X\)为任意集合，\(Y\subseteq R\)，\(f\)和\(g\)是从\(X\)到\(Y\)的函数。


    (1)\(f\le g\)表示，对每个\(x\in X\)，皆有\(f(x)\le g(x)\)。


    (2)\(f+g: X\rightarrow Y\)，对每个\(x\in X\)，皆有\((f+g)(x)=f(x)+g(x)\)，称\(f+g\)为\(f\)和\(g\)的和。


    (3)\(f-g: X\rightarrow Y\)，对每个\(x\in X\)，皆有\((f-g)(x)=f(x)-g(x)\)，称\(f-g\)为\(f\)和\(g\)的差。


    (4)\(f*g: X\rightarrow Y\)，对每个\(x\in X\)，皆有\((f*g)(x)=f(x)*g(x)\)，称\(f*g\)为\(f\)和\(g\)的积。'
  merge: -1
  img_proc: true
- pgno: 541
  md: '# # 特征函数


    定义：设 \( E \) 为全集，\( A \subseteq E \)，\( \psi_A \) 为如下定义的从 \( E \) 到 \( \{0,1\}
    \) 的函数：


    \(\psi_A(x) = \begin{cases} 1 & x \in A \\ 0 & x \notin A \end{cases}\)


    称 \( \psi_A(x) \) 为集合 \( A \) 的特征函数。'
  merge: -1
  img_proc: true
- pgno: 542
  md: '# # 特征函数的性质


    +   (1) \( 0 \leq \psi_A \leq 1 \)， 对于任意的 \( A \subseteq E \) 成立


    +   (2) \( \psi_A = 0 \)， 当且仅当 \( A = \varnothing \)


    +   (3) \( \psi_A = 1 \)， 当且仅当 \( A = E \)


    +   (4) \( \psi_A \leq \psi_B \)， 当且仅当 \( A \subseteq B \)


    +   (5) \( \psi_A = \psi_B \)， 当且仅当 \( A = B \)


    +   (6) \( \psi_{\sim A} = 1 - \psi_A \)


    +   (7) \( \psi_{A \cap B} = \psi_A * \psi_B \)


    +   (8) \( \psi_{A \cup B} = \psi_A + \psi_B - \psi_A * \psi_B \)


    +   (9) \( \psi_{A - B} = \psi_A - \psi_A * \psi_B \)


    +   (10) \( \psi_A * \psi_B = \psi_A \)， 当且仅当 \( A \subseteq B \)


    +   (11) \( \psi_A * \psi_A = \psi_A \)'
  merge: -1
  img_proc: true
- pgno: 543
  md: '# # 特征函数的性质


    (8) \(\psi_{A \cup B} = \psi_A + \psi_B - \psi_A * \psi_B\)


    证明：当 \(x \in A \cup B\) 时，\(\psi_{A \cup B} = 1\)，由于 \(x \in A \cup B \Leftrightarrow
    x \in A \lor x \in B\)，于是可能有这样几种情况：


    +   a) \(x \in A\) 使 \(\psi_A = 1\)，\(x \notin B\) 使 \(\psi_B = 0\)，于是 \(\psi_A
    + \psi_B - \psi_A * \psi_B = 1\)


    +   b) \(x \in B\) 但 \(x \notin A\)，此时也有 \(\psi_A + \psi_B - \psi_A * \psi_B =
    1\)


    +   c) \(x \in A\) 并且 \(x \in B\)，此时 \(\psi_A + \psi_B - \psi_A * \psi_B = 1 +
    1 - 1 * 1 = 1\)


    即当 \(x \in A \cup B\) 时，\(\psi_{A \cup B} = \psi_A + \psi_B - \psi_A * \psi_B\)


    当 \(x \notin A \cup B\) 时，\(\psi_{A \cup B} = 0\)，而


    \(x \notin A \cup B \Leftrightarrow \neg x \in A \cup B \Leftrightarrow \neg (x
    \in A \lor x \in B) \Leftrightarrow x \notin A \land x \notin B\)


    可得 \(\psi_A + \psi_B - \psi_A * \psi_B = 0 = \psi_{A \cup B}\)


    得证。'
  merge: -1
  img_proc: true
- pgno: 544
  md: '# # 特征函数的性质


    (9) \(\psi_{A-B} = \psi_A - \psi_A * \psi_B\)


    证明：当 \(x \in A - B\) 时，\(\psi_{A-B} = 1\)，同时


    \(x \in A - B \Leftrightarrow x \in A \land x \notin B \Leftrightarrow \psi_A
    = 1 \land \psi_B = 0\)


    得 \(\psi_A - \psi_A * \psi_B = 1 - 1 * 0 = 1\)，上式成立。


    当 \(x \notin A - B\) 时，有 \(\psi_{A-B} = 0\)，同时


    \(x \notin A - B \Leftrightarrow \neg(x \in A - B) \Leftrightarrow \neg(x \in
    A \land x \notin B)\)


    \(\Leftrightarrow x \notin A \lor x \in B \Leftrightarrow \psi_A = 0 \lor \psi_B
    = 1\)


    于是有


    (a) \(\psi_A - \psi_A * \psi_B = 0 - 0 * 0 = 0\)


    (b) \(\psi_A - \psi_A * \psi_B = 1 - 1 * 1 = 0\)


    (c) \(\psi_A - \psi_A * \psi_B = 0 - 0 * 1 = 0\)


    即 \(x \notin A - B\) 时，总有 \(\psi_{A-B} = \psi_A - \psi_A * \psi_B\)。


    得证。'
  merge: -1
  img_proc: true
- pgno: 545
  md: '# # 特征函数


    # ## 例：用特征函数证明


    \( A \cup (B \cap C) = (A \cup B) \cap (A \cup C) \)


    解：

    \( \psi_{A \cup (B \cap C)} = \psi_A + \psi_{B \cap C} - \psi_A * \psi_{B \cap
    C} \)

    \( = \psi_A + \psi_B * \psi_C - \psi_A * \psi_B * \psi_C \)

    及

    \( \psi_{(A \cup B) \cap (A \cup C)} = \psi_{A \cup B} * \psi_{A \cup C} \)

    \( = (\psi_A + \psi_B - \psi_A * \psi_B) * (\psi_A + \psi_C - \psi_A * \psi_C)
    \)

    \( = \psi_A \psi_A + \psi_A \psi_C - \psi_A \psi_A \psi_C \)

    \( + \psi_B \psi_A + \psi_B \psi_C - \psi_B \psi_A \psi_C - \psi_A \psi_A \psi_B
    - \psi_A \psi_B \psi_C + \psi_A \psi_B \psi_A \psi_C \)

    \( = \psi_A + \psi_B \psi_C - \psi_A \psi_B \psi_C \)

    故

    \( \psi_{A \cup (B \cap C)} = \psi_{(A \cup B) \cap (A \cap C)} \)


    因此，\( A \cup (B \cap C) = (A \cup B) \cap (A \cap C) \)'
  merge: -1
  img_proc: true
