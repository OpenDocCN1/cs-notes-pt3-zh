  md: '# 哈密尔顿图的应用


    假定城市两两之间都直接连通，那么走法一共有\((n-1)!\)种，但是考虑相反顺序构成的哈密尔顿回路是一样的，因此只需要检查\((n-1)!/2\)条路径。


    但是，假定有25个城市，则\(24! / 2\)大约等于\(3.1*10^{23}\)，这个数目非常大，因此遍历的做法不科学。


    由于旅行商问题在实践和理论中都有重大的意义，因此已经投入了巨大的努力来解决这个问题，但是，还没有找到多项式最坏情形时间复杂度的算法。在实际中，当n的数目很多时，采用的是近似算法，找到一个近似解。'
