- pgno: 206
  md: '# # 规则5：量词的增加和删除规则


    +   - 全称特指规则**US**：从\( (\forall x)A(x) \) 可得出结论\( A(y) \)，其中\( y \)是个体域中任一个体，即：

    +     \( (\forall x)A(x) \Rightarrow A(y) \)  \( (\forall x)A(x) \Rightarrow A(a)
    \)

    +     - 注意：\( y \)不能和\( A(x) \)中其它指导变元重名。


    +   - 存在特指规则**ES**：从\( (\exists x)A(x) \) 可得出结论\( A(a) \)，其中\( a \)是\( (\exists
    x)A(x) \)和在此之前不曾出现过的个体常量，即：

    +     \( (\exists x)A(x) \Rightarrow A(a) \)

    +     - 注意：\( a \)不能和指定前提中任一自由变元同名，也不能和使用本规则以前任一推导步骤上得到的公式的自由变元同名。'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# # 规则5：量词的增加和删除规则\n\n> 存在推广规则EG：从A(a) 可得出结论(∃y)A(y) ，其中a是个体域中的某一个个体，即：  \n\
    A(a) ⇒ (∃y)A(y)  \n\n注意： y不和A(a)中其他自由变元或指导变元同名。\n\n> 全称推广规则UG：从A(x) 可得出结论(∀y)A(y)\
    \ ，其中x是个体域中的任意个体，即：  \nA(x) ⇒ (∀y)A(y)  \n\n使用条件：(1)x不是给定前提中任一公式的自由变元；  \n(2)x不是在前面推导步骤中使用ES规则引入的变元；\
    \  \n(3)若在前面推导过程中使用ES规则引入新变元u时，x是自由变元，那么在A(x)中，u应约束出现。"
  merge: -1
  img_proc: true
