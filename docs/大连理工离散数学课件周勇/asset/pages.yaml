- pgno: 865
  md: '# # 邻接矩阵的幂


    对于 \( n = 2,3,4,\cdots \) 来说，考察邻接矩阵 \( A \) 的幂 \( A^n \) 可知，邻接矩阵 \( A \) 中的第 \(
    i \) 行和第 \( j \) 列上的元素值 1，说明了图 \( G \) 中存在一条边 \( <v_i, v_j> \)，也就是说，存在一条从结点 \(
    v_i \) 到 \( v_j \) 长度为 1 的路径。试定义矩阵 \( A^2 \)，使得 \( A^2 \) 中的各元素 \( a_{ij}^2 \)
    为


    ```

    \( a_{ij}^2 = \sum_{k=1}^n a_{ik} a_{kj} \)

    ```


    元素值 \( a_{ij}^2 \) 等于从 \( v_i \) 到 \( v_j \) 长度为 2 的不同路径的数目。显然，矩阵中主对角线上的元素 \(
    a_{ii}^2 \) 的值，表示了结点 \( v_i (i=1,2,\cdots,n) \) 上长度为 2 的循环的个数。矩阵 \( A^3 \) 中的元素值
    \( (i,j) \) 依次类推。'
