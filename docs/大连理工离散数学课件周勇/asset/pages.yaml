- pgno: 116
  md: '# # 证明有效结论的方法


    +   • 2，直接证法


    在命题变元较多的情况下，真值表法显得不方便，我们采用直接证明法，为此先给出如下的定义


    定义：设S是一个命题公式的集合，从S推出命题公式C的推理过程是命题公式的一个有限序列：


    C₁， C₂， ...， Cₙ。


    其中， Cᵢ或者属于S，或者是某些Cⱼ(j<i)的有效结论，并且Cₙ就是C。


    如何构造这个推理序列以得出结论C呢？只要遵循下面的推理规则，使用列出的等价式或永真蕴涵式，就能构造出满足要求的公式序列。为了帮助大家记忆，我们把常用的等价式和永真蕴涵式再次列出来。'
