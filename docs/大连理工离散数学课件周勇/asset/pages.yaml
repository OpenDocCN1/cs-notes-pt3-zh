- pgno: 647
  md: '# 典型子群的实例·中心 C


    定义：设 $G$ 为群，令


    $$C=\{a\mid a\in G\land \forall x\in G(ax=xa)\},$$


    则 $C$ 是 $G$ 的子群，称为 $G$ 的中心。


    证 $e\in C$。$C$ 是 $G$ 的非空子集。任取 $a,b\in C$，只需证明 $ab^{-1}$ 与 $G$ 中所有的元素都可交换。$\forall
    x\in G$，有


    ```

    $$(ab^{-1})x=ab^{-1}x=ab^{-1}(x^{-1})^{-1}$$

    $$=a(x^{-1}b)^{-1}=a(bx^{-1})^{-1}=a(xb^{-1})$$

    $$=(ax)b^{-1}=(xa)b^{-1}=x(ab^{-1})$$

    ```


    由判定定理二可知 $C\leq G$。


    对于阿贝尔群 $G$，因为 $G$ 中所有的元素互相都可交换，$G$ 的中心就等于 $G$。但是对某些非交换群 $G$，它的中心是 $\{e\}$。'
  merge: -1
  img_proc: true
