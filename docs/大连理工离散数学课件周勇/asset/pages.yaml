- pgno: 563
  md: '# # 9.1 二元运算及其性质


    定义9.1 设S为集合，函数\(f: S \times S \to S\) 称为S上的二元运算（Binary Operation），简称为二元运算。


    +   - S中任何两个元素都可以进行运算，且运算的结果惟一。

    +   - S中任何两个元素的运算结果都属于S，即S对该运算封闭。


    例1 (1) 自然数集合N上的加法和乘法是N上的二元运算，但减法和除法不是。

    (2) 整数集合Z上的加法、减法和乘法都是Z上的二元运算，而除法不是。

    (3) 非零实数集合R*上的乘法和除法都是R*上的二元运算，而加法和减法不是。'
  merge: -1
  img_proc: true
