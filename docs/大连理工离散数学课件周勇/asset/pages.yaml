- pgno: 199
  md: '# # 规则1：约束变元的改名规则


    \((\forall x)P(x)\) 等价于 \((\forall y)P(y)\)


    +   - 对约束变元进行换名，使得一个变元在一个公式中只呈一种形式出现。规则如下：

    +     - 欲改名之变元应是某量词作用范围内的变元，且应同时更改该变元在此量词辖域内的所有约束出现，而公式的其余部分不变。

    +     - 新的变元符号应是此量词辖域内原先没有使用过的，最好是公式中未出现过的符号。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # 规则1：约束变元的改名规则


    +   - 例： 对公式\(\forall x(P(x, y) \rightarrow \exists yQ(x, y, z)) \wedge S(x, z)\)
    进行换名，使各变元只呈一种形式出现。


    # ## 解：


    需要对约束变元\(x\)，\(y\)进行换名


    \(\forall u(P(u, y) \rightarrow \exists vQ(u, v, z)) \wedge S(x, z)\)


    # ### 不对的：


    \(\forall u(P(u, \text{v}) \rightarrow \exists vQ(u, v, z)) \wedge S(x, z)\)


    \(\forall u(P(u, y) \rightarrow \exists zQ(u, z, z)) \wedge S(x, z)\)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 规则2：自由变元的代入规则


    +   - 对公式中自由变元的更改叫做**代入**。规则如下：

    +     - 欲改变自由变元的名，必须在公式中的每一处自由出现。

    +     - 新变元不应在原公式中以任何约束形式出现。


    例：对公式 $\forall x(P(x,y)\to\exists yQ(x,y,z))\land S(x,z)$ 的变元 $x,y$ 的自由出现用 $w,t$
    代入，得


    $$\forall x(P(x,t)\to\exists yQ(x,y,z))\land S(w,z)$$'
  merge: -1
  img_proc: true
- pgno: 202
  md: '例如 对公式


    \((\forall x)\,(P(x)\to Q(x))\lor(\forall x)\,(P(x)\to R(x))\)


    为清楚起见，可对第二个约束变元 x 进行换名


    \((\forall x)\,(P(x)\to Q(x))\lor(\forall y)\,(P(y)\to R(y))\)


    又例如 对公式


    \((\forall x)\,(P(x)\to R(x,y))\land Q(x,y)\)


    可对约束变元 x 进行换名，得


    \((\forall z)\,(P(z)\to R(z,y))\land Q(x,y)\)


    错误：\((\forall z)\,(P(z)\to R(x,y))\land Q(x,y)\)


    \((\forall y)\,(P(y)\to R(y,y))\land Q(x,y)\)'
  merge: -1
  img_proc: true
