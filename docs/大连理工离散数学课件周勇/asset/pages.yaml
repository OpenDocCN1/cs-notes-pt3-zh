- pgno: 247
  md: '# # 公理化集合论的建立


    到二十世纪初集合论已得到数学家们的赞同。数学家们为一切数学成果都可建立在集合论基础上的前景而陶醉了。他们乐观地认为从算术公理系统出发，借助集合论的概念，便可以建造起整个数学的大厦。在1900年第二次国际数学大会上，著名数学家庞加莱就曾兴高采烈地宣布“……数学已被算术化了。今天，我们可以说绝对的严格已经达到了。”


    然而这种自得的情绪并没能持续多久。不久，集合论有漏洞的消息迅速传遍了数学界。这就是1902年罗素得出的罗素悖论。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '罗素构造了一个所有不属于自身（即不包含自身作为元素）的集合R。现在在问R是否属于R？


    如果R属于R，则R满足R的定义，因此R不应用于自身，即R不属于R；另一方面，如果R不属于R，则R不满足R的定义，因此R应用于自身，即R属于R。这样，不论何种情况都存在着矛盾。


    这一仅涉及集合与属于两个最基本概念的悖论如此简单明了以致根本留不下为集合论漏洞辩解的余地。绝对严密的数学陷入了自相矛盾之中。这就是数学史上的第三次数学危机。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '1908年，策梅罗提出公理化集合论，后经改进形成无矛盾的集合论公理系统，简称ZF公理系统。原本直观的集合概念被建立在严格的公理基础之上，从而避免了悖论的出现。这就是集合论发展的第二个阶段：公理化集合论。与此相对应，在1908年以前由康托尔创立的集合论被称为朴素集合论。


    公理化集合论是对朴素集合论的严格处理。它保留了朴素集合论的有价值的成果并消除了其可能存在的悖论，因而较圆满地解决了第三次数学危机。'
  merge: -1
  img_proc: true
