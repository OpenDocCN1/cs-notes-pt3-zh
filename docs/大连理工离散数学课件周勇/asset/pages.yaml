- pgno: 768
  md: "# # 图的种类\n\n定义：设一个三元组 \\(\\langle V(G), E(G), \\psi \\rangle\\)，其中  \n\\(V(G)\\\
    ) 是一个非空的节点集合，\\(E(G)\\) 是有限的边集合，  \n\n(1) 如果 \\(\\psi: E \\to \\{\\{v_1, v_2\\\
    } \\mid v_1 \\in V \\wedge v_2 \\in V\\}\\)，则称 \\(G = \\langle V, E, \\psi \\\
    rangle\\) 为无向图。  \n\n(2) 如果 \\(\\psi: E \\to V \\times V\\)，则称 \\(G = \\langle\
    \ V, E, \\psi \\rangle\\) 为有向图。  \n\n无论是无向图还是有向图，都统称为图，其中 \\(V\\) 的元素称为图 \\(G\\\
    ) 的结点，\\(E\\) 的元素称为图 \\(G\\) 的边，图 \\(G\\) 的结点数目称为图的阶。  \n\n可以用几何图形表示上面定义的图。用小圆圈表示结点。在无向图中，若\
    \ \\(\\psi(e) = \\{v_1, v_2\\}\\)，就用连接结点 \\(v_1\\) 和 \\(v_2\\) 的无向线段表示边 \\(e\\\
    )。在有向图中，若 \\(\\psi(e) = \\langle v_1, v_2 \\rangle\\)，就用 \\(v_1\\) 指向 \\(v_2\\\
    ) 的有向线段表示边 \\(e\\)。"
  merge: -1
  img_proc: true
- pgno: 769
  md: '# # 图的基本概念


    定义：设无向图 \( G = \langle V, E, \psi \rangle \)，\( e, e_1, e_2 \in E \)，\( v_1, v_2
    \in V \)


    (1) 如果 \( \psi(e) = \{v_1, v_2\} \)，则称 \( e \) 与 \( v_1 \) (或 \( v_2 \)) 互相关联。\(
    e \) 连接 \( v_1 \) 和 \( v_2 \)，\( v_1 \) 和 \( v_2 \) 既是 \( e \) 的起点，也是 \( e \)
    的终点，也称 \( v_1 \) 和 \( v_2 \) 为 **点邻接**。


    (2) 如果两条不同的边 \( e_1 \) 和 \( e_2 \) 与同一个结点关联，则称 \( e_1 \) 和 \( e_2 \) 为 **边邻接**。


    也就是说，共边的点称为点邻接；共点的边称为边邻接。'
  merge: -1
  img_proc: true
