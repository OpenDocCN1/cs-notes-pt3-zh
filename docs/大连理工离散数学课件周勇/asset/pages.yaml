- pgno: 867
  md: '# # 邻接矩阵的幂


    定理：设\(G=\langle V,E,\psi\rangle\)是一简单有向图，并且\(A\)是\(G\)的邻接矩阵。对于\(m=1,2,3,\cdots\)来说，矩阵\(A^m\)中的元素\((i,j)\)的值，等于从\(v_i\)到\(v_j\)长度为\(m\)的路径数目。


    证：对于\(m\)进行归纳证明。当\(m=1\)时，由邻接矩阵的定义中能够得到\(A^m=A\)。设矩阵\(A^k\)中的元素\((i,j)\)值是 \(a_{ij}^k\)，且对于\(m=k\)来说结论为真。因为\(A^{k+1}=A^k
    A\)，所以应有


    \(a_{ij}^{k+1}=\sum_{k=1}^n a_{ik}^k a_{kj}\)


    \(a_{ik}^k a_{kj}\)是从结点\(v_i\)出发，经过结点\(v_k\)到\(v_j\)的长度为\(k+1\)的各条路径的数目。这里\(v_k\)是倒数第二个结点。因此，\(a_{ij}^{k+1}\)应是从结点\(v_i\)出发，经过任意的倒数第二个结点到\(v_j\)的长度为\(k+1\)的路径总数。因此，对于\(m=k+1\)，定理成立。'
  merge: -1
  img_proc: true
- pgno: 868
  md: "# # 邻接矩阵的幂\n\n根据上述定理，可得出结论：\n\n+   • 能使矩阵 \\( A^m \\) 中的元素 \\( (i,j) \\) 值是非零的最小正整数\
    \ \\( m \\)，  \n+     就是距离 \\( d\\langle v_i, v_j \\rangle \\)。\n\n+   • 对于 \\\
    ( m = 1, 2, \\cdots, n-1 \\) 和 \\( i \\neq j \\) 来说，如果矩阵 \\( A^m \\) 中的 \\( (i,j)\
    \ \\)  \n+     元素值和 \\( (j,i) \\) 元素值都为 0，那么就不会有任何路径  \n+     连通结点 \\( v_i \\\
    ) 和 \\( v_j \\)。因此，结点 \\( v_i \\) 和 \\( v_j \\) 必定是属于图 \\( G \\) 的  \n+     不同分图。"
