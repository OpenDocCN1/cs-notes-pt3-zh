- pgno: 942
  md: '自从1736年欧拉（L. Euler）利用图论的思

    想解决了哥尼斯堡（Konigsberg）七桥问题以来，

    图论经历了漫长的发展道路。在很长一段时期内，

    图论被当成是数学家的智力游戏，解决一些著名

    的难题，曾经吸引了众多的学者。图论中许多的

    概论和定理的建立都与解决这些问题有关。


    1859年，英国数学家哈密顿发明了一种游

    戏：用一个规则的实心十二面体，它的20个顶点

    标出世界著名的20个城市，要求游戏者找一条沿

    着各边通过每个顶点刚好一次的闭回路，即「绕

    行世界」。用图论的语言来说，游戏的目的是在

    十二面体的图中找出一个生成圈。这个问题后来

    就叫做哈密顿问题。由于运筹学、计算机科学和

    编码理论中的很多问题都可以化为哈密顿问题，

    从而引起广泛的关注和研究。'
  merge: -1
  img_proc: true
- pgno: 943
  md: '在图论的历史中，还有一个最著名的问 题——四色猜想。这个猜想说，在一个平面或 球面上的任何地图能够只用四种颜色来着色，使 得没有两个相邻的国家有相同的颜色。四色猜想
    有一段有趣的历史。每个地图可以导出一个图， 其中国家都是点，当相应的两个国家相邻时这两 个点用一条线来连接。所以四色猜想是图论中的 一个问题。它对图的着色理论、平面图理论、代
    数拓扑图论等分支的发展起到推动作用。


    在电子计算机问世后，图论的应用范围 更加广泛，在解决运筹学、信息论、控制论、网 络理论、博奕论、化学、社会科学、经济学、建 筑学、心理学、语言学和计算机科学中的问题时，
    扮演着越来越重要的角色，受到工程界和数学界 的特别重视，成为解决许多实际问题的基本工具 之一。'
