- pgno: 108
  md: '# 1.6 命题演算的推理理论


    数理逻辑的一个主要任务就是提供一套推理规则，给定一些前提，利用所提供的推理规则，推出一些结论来，这个过程称为演绎或证明。


    +   - **生活中：**

    +     - 倘若认定前提是真的，从前提推导出结论的论证是遵守了逻辑推理规则，则认为此结论是真的，并且认为这个论证过程是**合法的**。


    +   - **数理逻辑中：**

    +     - 不关心前提的真实真假值，把注意力集中于推理规则的研究，依据这些推理规则推导出的任何结论，称为**有效结论**，而这种论证则被称为**有效论证**。'
  merge: -1
  img_proc: true
