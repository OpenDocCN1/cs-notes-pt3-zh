- pgno: 37
  md: "# # 1.3命题变元和合式公式\n\n+   • 命题变元  \n+     一个可以表示任意原子命题，且没有确定的真值指派的抽象命题，  \n+\
    \     被称为命题变元\n\n+   • 合式公式  \n+     由命题变元、逻辑联接词及圆括号构成的有效字符串\n\n+   • 合式公式递归定义\n\
    \n+   (1) 真值T和F是合式公式。  \n+   (2) 原子命题公式是一个合式公式。  \n+   (3) 如果A是合式的公式，那么¬A是合式的公式。\
    \  \n+   (4) 如果A和B均是合式的公式，那么(A∧B)，(A∨B),(A→B)和  \n+   (A↔B)都是合式的公式。  \n+   (5)\
    \ 当且仅当有限次地应用（1）至（4）条规则由逻辑联结词、圆  \n+   括号所组成的有意义的符号串是合式的公式。\n\n上面的定义成为递归定义法，（1）和（2）称为递归定义基础，（3）\
    \  \n和（4）称为递归定义的归纳，（5）称为递归定义的界限。"
  merge: -1
  img_proc: true
