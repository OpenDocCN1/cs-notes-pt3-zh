- pgno: 547
  md: '# # 基数


    定义：设 \( A \) 和 \( B \) 为两个集合


    (a) 如果 \( A \sim B \)，就称 \( A \) 和 \( B \) 的基数相等，记为 \( |A| = |B| \)


    (b) 如果存在从 \( A \) 到 \( B \) 的单射，就称 \( A \) 的基数小于等于的基数 \( B \)，记为 \( |A| \leq |B|
    \)。


    (c) 如果 \( |A| \leq |B| \) 且 \( |A| \neq |B| \)，就称 \( A \) 的基数小于 \( B \) 的基数，记为
    \( |A| < |B| \)。


    规定：自然数集合的基数为 \( |N| = \aleph_0 \)，读作阿列夫零；


    实数集合 \( R \) 的基数为 \( |R| = \aleph_1 \)，读作阿列夫一。


    定义：等势于自然数集合 \( N \) 的任何集合，称为可数集。'
  merge: -1
  img_proc: true
