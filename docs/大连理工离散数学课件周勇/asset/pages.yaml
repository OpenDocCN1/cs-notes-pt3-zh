- pgno: 452
  md: '# # 四、次序关系


    次序关系是集合中的可传递关系，它能提供一种比较集合各元素的手段。


    定义：设\(R\)是集合\(P\)中的二元关系。如果\(R\)是自反的、反对称的和可传递的，亦即有


    +   (a) \((\forall x)(x \in P \rightarrow xRx)\)


    +   (b) \((\forall x)(\forall y)(x \in P \land y \in P \land xRy \land yRx \rightarrow
    x = y)\)


    +   (c) \((\forall x)(\forall y)(\forall z)(x \in P \land y \in P \land z \in
    P \land xRy \land yRz \rightarrow xRz)\)


    则称\(R\)是集合\(P\)中的**偏序关系**，简称**偏序**。序偶\(<P, \leq>\)称为**偏序集合**。'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# # 偏序关系


    通常用符号“≤”表示偏序。这样，符号≤就不单纯意味着实数中的“小于或等于”关系。事实上，这是从特定情况中，借用符号≤去表示更为普遍的偏序关系。对于偏序关系来说，如果有
    且\(x \leq y\)，则按不同情况称它是“小于或等于”，“包含”，“在之前”等等。


    如果\(R\)是集合\(P\)中的偏序关系，则 \(\widetilde{R}\)也是\(P\)中的偏序关系。如上所述，如果用\(\leq\)表示\(R\)，则用\(\geq\)表示
    \(\widetilde{R}\)。如果\(<P, \leq>\)是一个偏序集合，则\(<P, \geq>\)也是一个偏序集合，称\(<P, \geq>\)是\(<P,
    \leq>\)的对偶。'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# # 偏序关系


    例：设R是实数集合。“小于或等于”关系是R中的偏序关系；这个关系的逆关系“大于或等于”关系也是R中的偏序关系。


    例：设\(P(A)=X\)是\(A\)的幂集。\(X\)中的包含关系\(\subseteq\) 是个偏序关系；这个关系的逆关系\(\supseteq\) 也是个偏序关系。


    设\(\mathbf{Z}_+\)是正整数集合，且\(x,y,z \in \mathbf{Z}_+\),当且仅当存在\(z\)，能使\(xz=y\)，才有“\(x\)整除\(y\)”(可写成\(x|y\))，换言之，“\(y\)是\(x\)的整倍数”。“整除”和“整倍数”互为逆关系，它们都是\(\mathbf{Z}_+\)中的偏序关系。'
  merge: -1
