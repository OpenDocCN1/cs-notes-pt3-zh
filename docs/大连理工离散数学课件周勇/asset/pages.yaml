- pgno: 845
  md: '# # 资源分配图


    +   下面给出简单有向图的一个应用——资源分配图。


    +   在多道程序的计算机系统中，可以同时执行多个程序。实际上，程序共享计算机系统中的资源，如磁带机、磁盘设备、CPU、主存贮器和编译程序等。操作系统对这些资源负责分配给各个程序。当一个程序要求使用某种资源，它要发出请求，操作系统必须保证这一请求得到满足。'
  merge: -1
  img_proc: true
- pgno: 846
  md: '# # 死锁状态


    +   对资源的请求可能发生冲突。如程序 \( A \) 控制着资源 \( r_1 \)，请求资源 \( r_2 \)；但程序 \( B \) 控制着资源
    \( r_2 \)，请求资源 \( r_1 \)。这种情况称为处于死锁状态。然而冲突的请求必须解决，资源分配图有助发现和纠正死锁。'
  merge: -1
  img_proc: true
- pgno: 847
  md: '# 假设条件


    +   • 假设某一程序对一些资源的请求，在该程序运行完之前必须都得到满足。在请求的时间里，被请求的资源是不能利用的，程序控制着可利用的资源，但对不可利用的资源则必须等待。'
  merge: -1
  img_proc: true
