- pgno: 460
  md: '# # 全序关系


    例：设\(R\)是实数集合，\(a\)和\(b\)是\(R\)的元素。对于每一个实数\(a\)，设\(S_a = \{x \mid 0 \leq x < a\}\)和\(S\)是集合并且\(S
    = \{S_a \mid a \geq 0\}\)。如果\(a < b\)，则\(S_a \subseteq S_b\)，因此\(\langle S, \subseteq
    \rangle\)是一个全序集合。


    如果\(A\)是个含有多于一个元素的集合，则\(\langle P(A), \subseteq \rangle\)不是一个全序集合。


    例如，设\(A = \{a, b, c\}\)，\(P(A) = \{\varnothing, \{a\}, \{b\}, \{c\}, \{a, c\},
    \{b, c\}, \{a, b, c\}\}\)在\(P(A)\)上定义一个包含关系 \(\subseteq\)，可以看出\(\{a\}\)和\(\{b,
    c\}\)，\(\{a, b\}\)和\(\{a, c\}\)等等都是不可比的。'
