  md: '# # 练习5


    5. 设 \( G \) 为群，\( a \) 是 \( G \) 中的 2 阶元，证明 \( G \) 中与 \( a \) 可交换的元素构成 \( G
    \) 的子群。


    证 令 \( H = \{ x \mid x \in G \wedge xa = ax \} \)，下面证明 \( H \) 是 \( G \) 的子群。

    首先 \( e \) 属于 \( H \)，\( H \) 是 \( G \) 的非空子集。

    任取 \( x, y \in H \)，有


    \( (xy^{-1})a = x(y^{-1}a) = x(a^{-1}y)^{-1} = x(ay)^{-1} \)

    \( = x(ya)^{-1} = xa^{-1}y^{-1} = xay^{-1} = axy^{-1} = a(xy^{-1}) \)

    因此 \( xy^{-1} \) 属于 \( H \)。由判定定理命题得证。


    分析：

    证明子群可以用判定定理，特别是判定定理二。

    证明的步骤是：

    - 验证 \( H \) 非空

    - 任取 \( x, y \in H \)，证明 \( xy^{-1} \in H \)'
