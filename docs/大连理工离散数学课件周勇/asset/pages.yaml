  md: '# 4.3 关系的性质


    定义：设 $R$ 为 $A$ 上的二元关系


    +   (1) 若对每个 $x\in A$，皆有 $\langle x,x\rangle\in R$，则称 $R$ 为自反的。\n用式子来表述即是：


    $R$ 是**自反的** $\Leftrightarrow (\forall x)(x\in A\rightarrow \langle x,x\rangle\in
    R)$


    +   (2) 若对每个 $x\in A$，皆有 $\langle x,x\rangle\notin R$，则称 $R$ 为反自反的。\n用式子来表述即是：


    $R$ 是**反自反的** $\Leftrightarrow (\forall x)(x\in A\rightarrow \langle x,x\rangle\notin
    R)$'
  merge: -1
