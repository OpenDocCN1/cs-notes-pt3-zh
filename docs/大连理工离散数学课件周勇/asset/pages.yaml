- pgno: 5
  md: '+   - 15岁时，进了莱比锡大学学习法律，一进校便跟上了大学二年级标准的人文学科的课程，还广泛阅读了培根、开普勒、伽利略等人的著作，并对他们的著述进行深入的思考和评价。在听了教授讲授欧几里德的《几何原本》的课程后，莱布尼兹对数学产生了浓厚的兴趣。17岁时他在耶拿大学学习了短时期的数学，并获得了哲学硕士学位。


    +   - 19岁设计出世界第一台乘法器，被认为是现代机器数学的先驱者。


    +   - Leibniz(1646～1716年) 之梦：有一天所有的知识，包括精神和无形的真理，能够通过通用的代数演算放入一个单一的演绎系统。


    +   - 1693年，发现了机械能的能量守恒定律。


    +   - 与牛顿并称为微积分的创立者。


    +   - 系统阐述了二进制记数法，并把它和中国的八卦联系起来。'
