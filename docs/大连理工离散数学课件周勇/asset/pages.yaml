- pgno: 465
  md: "# # 五、偏序集合与哈斯图\n\n像表达相容关系时用简化关系图一样，通常使用较为简便的偏序集合图——哈斯(Hass)图来表达偏序关系。\n\n定义：设<P,≤>是一个偏序集，如果对任何\
    \ x,y∈P ，\n x≤y和x≠y，而且不存在在任何其它元素 z∈P 能使x≤z 和z≤y，即(x≤y∧x≠y∧(x≤z≤y⇒x=z∨z=y)) 成立，则称元素y盖覆x。"
  merge: -1
