- pgno: 308
  md: '# 一、序偶


    序偶的相等：


    $\langle x,y\rangle = \langle a,b\rangle \Longleftrightarrow ((x=a)\land(y=b))$


    序偶$\langle a,b\rangle$中，$a$称为第一元素，$b$称为第二元素。两个元素不一定来自同一个集合，他们可以代表不同类型的事务。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# ## 二、多重序元


    定义：\(n\)重序元是一个序偶，它的第一元素是\((n-1)\)重序元。


    3重序元：\(<<x,y>,z>\)，简单记作\(<x,y,z>\)


    \(n\)重序元：\(<<x_1,x_2,\cdots,x_{n-1}>,x_n>\)


    \(n\)重序元的相等：


    \(\langle\langle x_1,x_2\cdots,x_{n-1}\rangle,x_n\rangle=\langle\langle a_1,a_2\cdots,a_{n-1}\rangle,a_n\rangle\Leftrightarrow((x_1=a_1)\wedge(x_2=a_2)\wedge\cdots\wedge(x_n=a_n))\)'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# ## 三、笛卡尔乘积


    定义：设\(A\)和\(B\)是任意两个集合。若序偶的第一个元素是\(A\)的一个元素，第二个元素是\(B\)的一个元素，则所有这样的序偶集合，称为\(A\)和\(B\)的笛卡尔乘积，记作
    \(A \times B\) 即


    \(A \times B = \{\langle x, y \rangle \mid x \in A \land y \in B\}\)


    若\(A\)中有\(m\)个元素，\(B\)中有\(n\)个元素，\(A\)和\(B\)的笛卡尔乘积中元素个数为？'
  merge: -1
  img_proc: true
- pgno: 311
  md: '例： 设 \( A = \{\alpha, \beta\}, B = \{1, 2\}, \) 求 \( A \times B, B \times A,
    A \times A, (A \times B) \cap (B \times A) \).


    解： \( A \times B = \{\langle \alpha, 1 \rangle, \langle \alpha, 2 \rangle, \langle
    \beta, 1 \rangle, \langle \beta, 2 \rangle\} \)


    \( B \times A = \{\langle 1, \alpha \rangle, \langle 2, \alpha \rangle, \langle
    1, \beta \rangle, \langle 2, \beta \rangle\} \)


    \( A \times A = \{\langle \alpha, \alpha \rangle, \langle \beta, \beta \rangle,
