- pgno: 634
  md: '# # 群中元素的幂


    定义：设 \( G \) 是群，\( a \in G \)，\( n \in \mathbb{Z} \)，则 \( a \) 的 \( n \) 次幂。


    \( a^n = \begin{cases} e & \quad n = 0 \\ a^{n-1}a & \quad n > 0 \\ (a^{-1})^m
    & \quad n < 0, n = -m \end{cases} \)


    群中元素可以定义负整数次幂。


    在 \( <\mathbb{Z}_3, \oplus> \) 中有


    \( 2^{-3} = (2^{-1})^3 = 1^3 = 1 \oplus 1 \oplus 1 = 0 \)


    在 \( <\mathbb{Z}, +> \) 中有


    \( (-2)^{-3} = 2^3 = 2 + 2 + 2 = 6 \)'
