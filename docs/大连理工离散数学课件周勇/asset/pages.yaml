- pgno: 832
  md: '# # 连通性


    定义：设\(v_1\)和\(v_2\)是图\(G\)的结点。如果在\(G\)中存在从\(v_1\)至\(v_2\)的路径，则称在\(G\)中从\(v_1\)可达\(v_2\)或\(v_1\)和\(v_2\)是连通的，否则称在\(G\)中从\(v_1\)不可达\(v_2\)。对于图\(G\)的结点，用\(R(v)\)表示从\(v\)可达的全体结点的集合。


    注意：在无向图中，若从\(v_1\)可达\(v_2\)，则从\(v_2\)必可达\(v_1\)；而在有向图中，从\(v_1\)可达\(v_2\)不能保证从\(v_2\)必可达\(v_1\)。无论无向图还是有向图，任何节点到自身都是可达的。'
  merge: -1
  img_proc: true
- pgno: 833
  md: '# # 连通性


    定义：设v1和v2是图G的结点。如果从v1至v2是可达的，则在从v1至v2的路径中，长度最短的称为从v1至v2的测地线，并称该测地线的长度为从v1至v2的距离，记作d(v1,v2)。如果从v1不可达v2，则称从v1至v2的距离d(v1,v2)为∞。


    定义：图 \( G = \langle V, E, \psi \rangle \) 的直径定义为 \( maxd\langle v, v'' \rangle
    (v, v'' \in V) \) 。'
  merge: -1
  img_proc: true
- pgno: 834
  md: '# 连通性


    从结点vi至vj的距离d(vi,vj)具有下列性质：

    对于任何结点来vi, vj, vk ∈ V来说，都应有


    +   1. d(vi, vi) = 0

    +   2. d(vi, vj) ≥ 0

    +   3. d(vi, vj) + d(vj, vk) ≥ d(vi, vk)


    注意：不等式 (3)，通常称为三角不等式，

    如果从结点vi到vj是可达的，并且从vj到vi也是可达的，但是d(vi,vj)却不一定等于d(vj,vi)。'
  merge: -1
