  md: '# # Cantor定理的证明


    证 (1) 规定[0,1]中数的表示. 对任意的\(x \in [0,1]\), 令


    \(x = 0.x_1x_2\dots, \quad 0 \le x_i \le 9\)


    规定在 \(x\) 的表示式中不允许在某位后有无数个1的情况.

    设 \(f: \mathbb{N} \to [0,1]\) 是任何函数，列出 \(f\) 的所有函数值：


    \(f(0) = 0.a_1^{(1)}a_2^{(1)}\dots\)

    \(f(1) = 0.a_1^{(2)}a_2^{(2)}\dots\)

    \(\dots\)

    \(f(n-1) = 0.a_1^{(n)}a_2^{(n)}\dots\)

    \(\dots\)


    令 \(y\) 的表示式为 \(0.b_1b_2\dots\)，并且满足 \(b_i \neq a_i^{(i)}\), \(i=1,2,\dots\)，那么

    \(y \in [0,1]\)，且 \(y\) 与上面列出的任何函数值都不相等. 这就推出

    \(y \notin \text{ran}f\)，即 \(f\) 不是满射的.'
