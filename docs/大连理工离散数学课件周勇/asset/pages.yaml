- pgno: 257
  md: '# # 六、集合之间的关系


    # ## 1.集合的相等


    定义：若 \( A \)、\( B \) 是两个集合，当且仅当 \( A \)、\( B \) 两集合恰恰有完全相同的成员时，称 \( A \)、\( B
    \) 两集合相等，记作 \( A = B \)。


    \( A = B \Leftrightarrow (\forall x)(x \in A \leftrightarrow x \in B) \)


    例如：设 \( A = \{x \mid x \in \mathbb{N} \text{ 且 } x \text{ 能整除 } 24\} \)，

    \( B = \{1, 2, 3, 4, 6, 8, 12, 24\} \)

    则 \( A = B \)


    **注意：** 1. 集合中不考虑重复元素。

    例如：\( \{1,2,3\} = \{1,2,2,3\} \)。

    2. 集合中不考虑元素的排列顺序。

    例如：\( \{1,2,3\} = \{3,2,1\} \)。

    3. \( \{1,2,3\} \neq \{1,\{2,3\}\} \)。'
