- pgno: 859
  md: '# 邻接矩阵


    可以把简单有向图的矩阵表示的概念，推广到简单无向图、多重边图和加权图。对于简单无向图来说，这种推广会给出一个对称的邻接矩阵，在多重边图或加权图的情况下，可以令


    $$a_{ij}=w_{ij}$$


    其中的 $w_{ij}$，或者是边 $\langle v_i,v_j\rangle$ 的重数，或者是边 $\langle v_i,v_j\rangle$ 的权。另外，若
    $\langle v_i,v_j\rangle\notin E$，则 $w_{ij}=0$。


    在零图的邻接矩阵中，所有元素都应该是0，亦即其邻接矩阵是个零矩阵。'
