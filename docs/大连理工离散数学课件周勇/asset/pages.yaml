- pgno: 204
  md: '# # 规则4: 取代规则


    +   - 设A''(x₁, x₂, ..., xₙ) ⇔ B''(x₁, x₂, ..., xₙ)

    +   都是含n个自由变元的谓词公式，且A''是A的子公式。若在A中用B'' 取代A'' 的一处或多处出现后所得的新公式是B ，则有  A ⇔ B 。如果A为永真式，则B也是永真式。'
