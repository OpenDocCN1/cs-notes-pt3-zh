- pgno: 777
  md: '# # 度


    **定理：** 在无向图中，所有节点的度数之和等于边数的2倍。


    证：因为每条边给图G带来两度，设图G有m条边，所以图G共有2m度，等于图G的所有结点的度数之和。


    **定理：** 在有向图中，所有顶点的度数之和等于边的2倍；所有顶点的入度之和等于所有节点的出度之和，都等于边数。'
