- pgno: 489
  md: '# # 5.1 函数的基本概念和性质


    函数（或称映射）是满足某些条件的关系，关系又是笛卡尔乘积的子集。


    定义：设 \(X\) 和 \(Y\) 是两个任意的集合，并且 \(f\) 是从 \(X\) 到 \(Y\) 的一种关系。如果对于每一个 \(x \in X\)，都存在唯一的
    \(y \in Y\)，使得 \(<x, y> \in f\)，则称关系 \(f\) 为函数或映射，并记作 \(f: X \rightarrow Y\)。


    对于函数来说 \(f: X \rightarrow Y\)，如果有 \(<x, y> \in f\)，则称 \(x\) 是自变量；与 \(x\) 相对应的
    \(y\)，称为在 \(f\) 作用下 \(x\) 的像点，或称 \(y\) 是函数 \(f\) 在 \(x\) 处的值。通常用 \(y = f(x)\)
    表示 \(<x, y> \in f\)。'
  merge: -1
  img_proc: true
- pgno: 490
  md: "# # 函数的基本概念\n\n从_X_到_Y_的函数_f_，是具有下列性质的从_X_到_Y_的二元关系：\n\n+   (1) 每一个元素\\(x \\\
    in X\\)，都必须关系到某一个\\(y \\in Y\\)；也就是说，关系_f_的定义域是集合_X_本身，而不是_X_的真子集。 任意性\n\n+  \
    \ (2) 如果有\\(<x, y> \\in f\\)，则函数_f_在_x_处的值_y_是唯一的，亦即  \n+   \\(\\langle x, y \\\
    rangle \\in f \\land \\langle x, z \\rangle \\in f \\Rightarrow y = z\\)  唯一性"
  merge: -1
  img_proc: true
