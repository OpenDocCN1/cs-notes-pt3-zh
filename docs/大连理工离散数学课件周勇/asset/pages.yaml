- pgno: 313
  md: '# 三、笛卡尔乘积


    # 定理：设有_A,B,C_三个集合，则


    (a) \( A \times (B \cup C) = (A \times B) \cup (A \times C) \)


    (b) \( A \times (B \cap C) = (A \times B) \cap (A \times C) \)


    (c) \( (A \cup B) \times C = (A \times C) \cup (B \times C) \)


    (d) \( (A \cap B) \times C = (A \times C) \cap (B \times C) \)


    证：设 \(\langle x, y \rangle\) 是 \( A \times (B \cup C) \) 的任意元素，根据 \(\land\) 对
    \(\lor\) 的分配律，有：


    \(\langle x, y \rangle \in A \times (B \cup C)\)


    \(\Leftrightarrow x \in A \land y \in B \cup C\)


    \(\Leftrightarrow x \in A \land (y \in B \lor y \in C)\)


    \(\Leftrightarrow (x \in A \land y \in B) \lor (x \in A) \land y \in C)\)


    \(\Leftrightarrow \langle x, y \rangle \in A \times B \lor \langle x, y \rangle
    \in A \times C\)


    \(\Leftrightarrow \langle x, y \rangle \in (A \times B) \cup (A \times C)\) 得证。'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# # n个集合的笛卡尔乘积


    定义： 集合\(A_1,A_2,\cdots,A_n\)的笛卡尔乘积可以表示成


    \(X_{i \in I_n} A_i = A_1 \times A_2 \times \cdots A_n\)


    \(=((A_1 \times A_2) \times A_3) \times \cdots \times A_n\)


    \(=\{\langle x_1,x_2,\cdots,x_n \rangle | x_1 \in A_1 \wedge x_2 \in A_2 \wedge
    \cdots \wedge x_n \in A_n\}\)


    集合\(A\)的笛卡尔乘积\(A \times A\) 记作\(A^2\) ,类推


    \(A \times A \times A = A^3\)


    如果所有的集合\(A_i\)都是有限集合，则他们笛卡尔乘积的基数为：


    \(| A_1 \times A_2 \times \cdots \times A_n | \cong | A_1 || A_2 | \cdots | A_n
    |\)'
