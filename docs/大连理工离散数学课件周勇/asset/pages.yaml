- pgno: 902
  md: '# # 7.4图的矩阵表示


    # ## 一、邻接矩阵


    定义：设 \( G = \langle V, E, \psi \rangle \) 是一个简单有向图，其中的结点集合 \( V = \{v_1, v_2,
    \cdots v_n\} \)，并且假定各结点已经有了从结点 \( v_1 \) 到 \( v_n \) 的次序。试定义一个 \( n \times n \)
    的矩阵 \( A \)，使得其中的元素


    ```

    \( a_{ij} = \begin{cases} 1 & \text{当 } \langle v_i, v_j \rangle \in E \\ 0 &
    \text{当 } \langle v_i, v_j \rangle \notin E \end{cases} \quad (1)\)

    ```


    则称这样的矩阵 \( A \) 是图 \( G \) 的邻接矩阵。'
  merge: -1
  img_proc: true
- pgno: 903
  md: '# 邻接矩阵


    定义：元素或为0或为1的任何矩阵，都称为**比特矩阵**或**布尔矩阵**。


    邻接矩阵也是布尔矩阵，第$i$行上值为1的元素的个数，等于结点$v_i$的出度；第$j$列上值为1的元素的个数，等于结点$v_j$的入度。'
  merge: -1
