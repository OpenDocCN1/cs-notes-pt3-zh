- pgno: 536
  md: '# # 反函数


    定理：如果函数\(f: X \rightarrow Y\)是可逆的，则有


    \(f^{-1} \circ f = I_X\)


    \(f \circ f^{-1} = I_Y\)


    证明：设\(x \in X\)和\(y \in Y\)，如果\(f(x) = y\)，则会有\(f^{-1}(y) = x\)，于是能够得到 \((f^{-1}
    \circ f)(x) = f^{-1}(f(x)) = f^{-1}(y) = x\)


    因此应有\(f^{-1} \circ f = I_X\)。与此类似，还可得出


    \((f \circ f^{-1})(y) = f(f^{-1}(y)) = f(x) = y\)


    于是应有\(f \circ f^{-1} = I_Y\)。


    注意：函数\(f\)和\(f^{-1}\)的合成，总会生成一个恒等函数，由于合成的次序不同，合成函数的值域或者是集合\(X\)，或者是集合\(Y\)。'
  merge: -1
  img_proc: true
