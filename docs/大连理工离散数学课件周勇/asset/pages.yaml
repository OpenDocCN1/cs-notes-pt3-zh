- pgno: 840
  md: '# # 子图和分支


    定义：设G''是G的具有某种性质的子图，并且对于G的具有该性质的任意子图G''''，只要G''⊆G''''，就有G''=G''''，则称G''相对于该性质是G的**极大子图**。


    定义： 无向图G的极大连通子图称为G的**分支**。


    定义：设G是有向图：


    +   (1) G的极大强连通子图称为G的**强分支**。

    +   （2）G的极大单向连通子图称为G的**单向分支**。

    +   （3）G的极大弱连同子图称为G的**弱分支**。'
  merge: -1
