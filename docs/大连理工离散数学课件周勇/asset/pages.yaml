  md: '# 9.1 图的基本概念


    +   - 图是由一些**顶点**和**连接这些顶点的一些边**所组成的离散结构。

    +   - 根据连接顶点对的边的种类和数目的不同，图有多种类型。几乎每一门可以想到的学科，都有用图模型来解决的问题。'
