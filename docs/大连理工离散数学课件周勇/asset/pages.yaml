  md: '# 布尔代数的定义与实例


    定义8.10 如果一个格是有补分配格, 则称它为布尔格或布尔代数. 布尔代数标记为<B,∧,∨,'',0,1>, ''为求补运算.


    例8 设 S_{110} = {1, 2, 5, 10, 11, 22, 55, 110}是110的正因子集合, gcd表示求最大公约数的运算, lcm表示求最小公倍数的运算,
    问<S_{110}, gcd, lcm>是否构成布尔代数? 为什么？


    解 (1) 不难验证S_{110}关于gcd 和 lcm 运算构成格.(略)


    解 (2) 验证分配律 ∀x,y,z∈S_{110} 有 gcd(x, lcm(y, z)) = lcm(gcd(x, y), gcd(x, z))


    解 (3) 验证它是补格, 1作为S_{110}中的下界, 110为上界, 1和110互为补元, 2和55互为补元, 5和22互为补元, 10和11互为补元,
    从而证明了<S_{110}, gcd, lcm>为布尔代数.'
  merge: -1
  img_proc: true
- pgno: 743
  md: '# 实例


    例9 设B为任意集合,证明B的幂集格<P(B),∩,∪,~,∅,B>构成布尔代数,称为集合代数.


    (1) P(B)关于∩和∪构成格,因为∩和∪运算满足交换律,结合律和吸收律.


    (2) 由于∩和∪互相可分配,因此P(B)是分配格.


    (3) 全下界是空集∅,全上界是B.


    (4) 根据绝对补的定义,取全集为B,∀x∈P(B),~x是x的补元.从而证明P(B)是有补分配格,即布尔代数.'
