  md: '# # 练习4


    4. 证明偶数阶群必含2阶元。


    由 \(x^2 = e \Leftrightarrow |x| = 1\) 或2。

    换句话说，对于 \(G\) 中元素 \(x\)，如果 \(|x| > 2\)，必有 \(x^{-1} \neq x\)。

    由于 \(|x| = |x^{-1}|\)，阶大于2的元素成对出现，共有偶数个。

    那么剩下的 1 阶和 2 阶元总共应该是偶数个。

    1 阶元只有 1 个，就是单位元，从而证明了 \(G\) 中必有 2 阶元。'
