- pgno: 316
  md: '# # 4.1关系的基本概念


    # ## 一、关系的定义


    定义：设 \( n \in I_+ \) 且 \( A_1,A_2,\dots,A_n \) 为 \( n \) 个任意集合，


    \( R \subseteq \prod_{i=1}^n A_i \)


    +   (a) 称 \( R \) 为 \( A_1,A_2,\dots,A_n \) 间的 **n元关系**；


    +   (b) 若 \( n=2 \)，则称 \( R \) 为 \( A_1 \) 到 \( A_2 \) 的 **二元关系**；


    +   (c) 若 \( R = \varnothing \)，则称 \( R \) 为空关系；若 \( R = \prod_{i=1}^n A_i \)，则称
    \( R \) 为 **全关系**；


    +   (d) 若 \( A_1=A_2=\dots=A_n=A \)，则称 \( R \) 为 \( A \) 上的 **n元关系**。'
  merge: -1
  img_proc: true
