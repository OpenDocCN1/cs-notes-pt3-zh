  md: '# 连通图


    定义：设G是有向图。


    (1)如果G中任意两个结点都互相可达，则称G是强连通的。


    (2)如果对于G的任意两结点，必有一个结点可达另一个结点，则称G是单向连通的。


    (3)如果G的基础图是连通的，则称G是弱连通的。


