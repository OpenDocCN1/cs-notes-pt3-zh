- pgno: 242
  md: '# # 集合论的创立与康托尔的遭遇


    19世纪末期，数学界出现了一件引人注目的事情。一位名叫康托尔（G.Cantor， 1845—1918）的德国数学家提出一种令人费解的古怪理论----集合论。它的内容是如此与常识格格不入，以致于一出世就引起了一场轩然大波。


    自从17世纪牛顿和莱布尼茨）创立微积分理论体系之后，在近一二百年时间里，微积分理论一直缺乏一个严格的逻辑基础。它的一些基本概念的表述，还有某些混乱和自相矛盾之处。从19世纪开始，柯西、魏尔斯特拉斯等人进行了微积分理论严格化的工作。他们建立了极限理论，并把极限理论的基础归结为实数理论。那么，实数理论的基础又该是什么呢？康托尔试图用集合论来作为实数理论，以至整个微积分理论体系的基础。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '出于这一目的，康托尔用集合的观点重新考察各种数量关系，特别是无穷数量关系。他发现，无穷集合有着有穷数量关系所不具备的性质。比如，在无穷集合领域，所有整数和所有偶数之间是一一对应的，所有有理数和所有整数之间是一一对应的，平面上所有的点和线段上所有的点是一一对应的，……概言之，在无穷的世界里，整体的所有元素和部分的所有元素之间可以是一一对应的。另外，无穷集合并不都是相等的，比如所有实数和所有有理数之间就不是一一对应的。因而，无穷集合是有大小的。集合论用“基数”这个概念来表示无穷集合间的区别。


    那么，有没有一个最大的集合呢？康托尔通过研究，否定了这个想法。因为每个已知集合的所有子集所构成集合，其基数都大于已知集合的基数。既然没有最大的基数，当然也没有最大的集合。无穷世界里的这些性质，初看起来，真是令人头晕目眩。'
  merge: -1
  img_proc: true
- pgno: 244
  md: '康托尔的研究成果发表之后，马上遭致当时一些赫赫有名的数学家的激烈攻击。德国数学家克隆尼克是这些人中言辞最激烈、攻击时间最长的一个。


    克隆尼克比康托尔年轻22岁。他主张，除非一种数学对象能够用有限步骤从自然数中构造出来，否则不能认为它在数学上是存在的。他有一句“名言”：“上帝创造了自然数，其余的一切才是人做的工作”。因此，他否认无理数的存在，也否认极限理论的意义。虽然康托尔是他的学生，但由于集合论的内容同他的主张大相径庭，所以克隆尼克简直到了不能容忍的程度。他认为，康托尔关于超限数的研究，是一种非常危险的数学疯病。克隆尼克的影响还使康托尔的学术论文一再延误发表日期。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '除了克隆尼克之外，还有一些著名数学家也对集合论发表了反对意见。


    法国数学家彭加勒说：“我个人，而且还不仅只我一人，认为重要之点在于，切勿引进一些不能用有限个文字去完全定义好的东西”。他把集合论当作一个有趣的“病理学的情形”来谈，并且预测说：“后一代将把（Cantor）集合论当作一种疾病，而人们已经从中恢复过来了”。


    德国数学家魏尔认为，康托尔关于基数的等级观点是雾上之雾。


    菲利克斯·克莱因也不赞成集合论的思想。


    数学家H. A. 施瓦兹原来是康托尔的好友，但他由于反对集合论而同康托尔断交。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '尽管有希尔伯特等著名数学家赞同他的集合论，尽管他的集合论事实上已取得巨大的成功，仍未能使康托尔感到欣慰和满足。


    从1884年春天起，即在他40岁的时候，他患了严重的忧郁症，极度沮丧，神态不安。不过，在精神病发作的间歇阶段，康托尔仍然顽强地坚持集合论的研究。而且当每次从精神病发作中恢复过来的时候，他都感到自己的脑子变得格外清晰。他在集合论方面许多非常出色的成果，都是在精神病发作的间歇时期获得的。然而，长期的精神折磨所造成的危害毕竟是不容忽视的。由于健康状况逐渐恶化，1918年，他在哈勒大学附属精神病院去世。'
