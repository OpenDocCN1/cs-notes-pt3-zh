- pgno: 723
  md: '# # 8.1 格的定义与性质


    定义8.1 设\(<S, \prec>\)是偏序集，如果\(\forall x,y \in S\)，\(\{x,y\}\)都有最小上界和最大下界，则称\(S\)关于偏序\(\prec\)
    作成一个格。

    求\(\{x,y\}\) 最小上界和最大下界看成 \(x\) 与 \(y\) 的二元运算 \(\vee\) 和 \(\wedge\)，


    例1 设\(n\)是正整数，\(S_n\)是\(n\)的正因子的集合。\(D\)为整除关系，则偏序集\(<Sn,D>\)构成格。\(\forall x,y
    \in S_n\)，\(x \vee y\)是\(\text{lcm}(x,y)\)，即\(x\)与\(y\)的最小公倍数。\(x \wedge y\)是\(\text{gcd}(x,y)\)，即\(x\)与\(y\)的最大公约数。


    ![](img/d475a943ed426379b80e793b9fe1f17d_723_0.png)'
  merge: -1
  img_proc: true
- pgno: 724
  md: '# # 实例


    例2 判断下列偏序集是否构成格，并说明理由。

    (1) \( <P(B), \subseteq> \)，其中 \( P(B) \) 是集合 \( B \) 的幂集。

    (2) \( <\mathbb{Z}, \leq> \)，其中 \( \mathbb{Z} \) 是整数集，\( \leq \) 为小于或等于关系。

    (3) 偏序集的哈斯图分别在下图给出。


    ![](img/d475a943ed426379b80e793b9fe1f17d_724_0.png)


    (1) 幂集格. \( \forall x, y \in P(B), \quad x \lor y \) 就是 \( x \cup y \)，\( x \land
    y \) 就是 \( x \cap y \).

    (2) 是格. \( \forall x, y \in \mathbb{Z}, \quad x \lor y = \max(x, y), \quad x \land
    y = \min(x, y) \).

    (3) 都不是格. 可以找到两个结点缺少最大下界或最小上界。'
  merge: -1
  img_proc: true
- pgno: 725
  md: '# 实例：子群格


    例3 设 $G$ 是群，$L(G)$ 是 $G$ 的所有子群的集合。即


    $$L(G)=\{H\mid H\leq G\},$$


    对任意的 $H_1,H_2\in L(G)$，$H_1\cap H_2$ 是 $G$ 的子群，$\langle H_1\cup H_2\rangle$ 是由
    $H_1\cup H_2$ 生成的子群（即包含着 $H_1\cup H_2$ 的最小子群）。


    在 $L(G)$ 上定义包含关系，则 $L(G)$ 关于包含关系构成一个格，称为 $G$ 的子群格。在 $L(G)$ 中，


    $$H_1\wedge H_2=H_1\cap H_2$$


    $$H_1\vee H_2=\langle H_1\cup H_2\rangle$$'
