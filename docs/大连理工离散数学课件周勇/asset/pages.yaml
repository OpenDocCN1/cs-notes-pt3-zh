  md: '# # 典型子群的实例:生成子群


    定义：设 \( G \) 为群，\( a \in G \)，令 \( H = \{a^k \mid k \in \mathbb{Z}\} \)，则 \( H
    \) 是 \( G \) 的子群，称为由 \( a \) 生成的子群，记作 \( <a> \)。


    证 首先由 \( a \in <a> \) 知道 \( <a> \neq \emptyset \)。任取 \( a^m, a^l \in <a> \)，则
    \( a^m (a^l)^{-1} = a^m a^{-l} = a^{m-l} \in <a> \)。根据判定定理二可知 \( <a> \leq G \)。


    实例：例如整数加群，由 2 生成的子群是 \( <2> = \{2^k \mid k \in \mathbb{Z}\} = 2\mathbb{Z} <\mathbb{Z}_6,
    \oplus > \) 中，由 2 生成的子群 \( <2> = \{0, 2, 4\} \)。Klein 四元群 \( G = \{e, a, b, c\}
    \) 的所有生成子群是：\( <e> = \{e\}, <a> = \{e, a\}, <b> = \{e, b\}, <c> = \{e, c\} \)。'
