- pgno: 982
  md: '# 二部图


    **定理：** 设 $G$ 是阶大于 1 的无向图。$G$ 是二部图，当且仅当 $G$ 的所有回路长度均为偶数。


    **证：** 先证明必要性。设 $V_1$ 和 $V_2$ 是二部图 $G$ 的互补结点子集，$C$ 是 $G$ 的长度为 $m$ 的回路。取 $v_0$
    为 $C$ 的某一结点，在 $C$ 中存在从 $v_0$ 至 $v_0$ 长度为 $m$ 的路径，设为 $v_0e_1v_1\cdots v_{m-1}e_mv_0$，不妨设
    $v_0\in V_1$，则对于一切的 $i<m$，$v_i\in V_2$，当且仅当 $i$ 为奇数，$v_{m-1}$ 与 $v_0$ 相邻，故 $v_{m-1}\in
    V_2$，则 $m-1$ 是奇数，所以 $m$ 为偶数。


    再证充分性。'
  merge: -1
  img_proc: true
- pgno: 983
  md: '# # 二部图


    设 \( G = \langle V, E, \psi \rangle \) 是连通的。任取 \( v_0 \in V \)，做 \( V_1 = \{v_i
    \mid v_i \in V \text{且 } v_i \text{到 } v_0 \text{的距离为偶数} \} \)，\( V_2 = V - V_1
    \)，则 \( e \in E \) 必连接 \( V_1 \) 中的一点和 \( V_2 \) 中的一个点。因为若 \( u, v \in V_1 \)
    或 \( u, v \in V_2 \) 且 \( e \) 连接 \( u \) 和 \( v \)，则当 \( v_0 \) 到 \( u \) 的测地线
    \( p_1 \) 和 \( v_0 \) 到 \( v \) 的测地线 \( p_2 \) 无公共结点时，\( p_1 \)、\( p_2 \) 和 \(
    e \) 构成长度为奇数的回路，与题设矛盾。当 \( p_1 \) 和 \( p_2 \) 有公共结点时，设最后一个公共点为 \( v'' \)，\( v''
    \) 将 \( p_1 \) 分为 \( p_1'' \) 和 \( p_1'''' \)，将 \( p_2 \) 分为 \( p_2'' \) 和 \(
    p_2'''' \)，且 \( p_1'' \) 和 \( p_2'' \) 均为 \( v_0 \) 到 \( v'' \) 的测地线，长度相等。因为 \(
    p_1 \) 和 \( p_2 \) 的长度均为偶数或均为奇数，故 \( p_1'''' \) 和 \( p_2'''' \) 的长度有相同的奇偶性，\(
    p_1'''' \)、\( p_2'''' \) 和 \( e \) 构成长度为奇数的回路，与题设矛盾。若 \( G \) 不是连通的，可以用以上办法证明
    \( G \) 的每个分支是二部图，则 \( G \) 也是二部图。


    得证。'
  merge: -1
  img_proc: true
