- pgno: 205
  md: '# 谓词逻辑的推理


    在谓词逻辑中，推理的形式结构仍为


    $H_1 \land H_2 \land \ldots \land H_n \Rightarrow C$


    若 $H_1 \land H_2 \land \ldots \land H_n \to C$ 是永真式，


    则称由前提 $H_1,H_2,\ldots,H_n$ 逻辑的推出结论 $C$，


    在此 $H_1,H_2,\ldots,H_n,C$ 均为谓词公式。'
  merge: -1
