- pgno: 699
  md: '# # 环的实例


    # ## 例：


    (1) 整数集、有理数集、实数集和复数集关于普通的加法和乘法构成环，分别称为**整数环Z**， **有理数环Q**， **实数环R** 和**复数环C**。


    (2) \( n(n \geq 2) \) 阶实矩阵的集合 \( M_n(R) \) 关于矩阵的加法和乘法构成环，称为 **\( n \) 阶实矩阵环**。


    (3) 集合的幂集 \( P(B) \) 关于集合的对称差运算和交运算构成环。


    (4) 设 \( Z_n = \{0, 1, \ldots, n-1\} \)，\( \oplus \) 和 \( \otimes \) 分别表示模 \(
    n \) 的加法和乘法，则 \( <Z_n, \oplus, \otimes> \) 构成环，称为 **模 \( n \) 的整数环**。'
  merge: -1
  img_proc: true
- pgno: 700
  md: "# 环的运算性质\n\n定理：设$\\langle R,+,\\cdot\\rangle$是环，则\n\n+   (1) $\\forall a\\\
    in R,\\quad a0=0a=0$  \n+   (2) $\\forall a,b\\in R,\\quad (-a)b=a(-b)=-ab$  \n\
    +   (3) $\\forall a,b,c\\in R,\\quad a(b-c)=ab-ac,\\quad (b-c)a=ba-ca$  \n+  \
    \ (4) $\\forall a_1,a_2,\\ldots,a_n,b_1,b_2,\\ldots,b_m\\in R\\ (n,m\\ge 2)$\n\
    \n$$(\\sum_{i=1}^{n}a_i)(\\sum_{j=1}^{m}b_j)=\\sum_{i=1}^{n}\\sum_{j=1}^{m}a_i\
    \ b_j$$\n\n证 (1) $\\forall a\\in R$有  \n$a0=a(0+0)=a0+a0$  \n由环中加法的消去律得$a0=0$。同理可证$0a=0$。\n\
    \n(2) $\\forall a,b\\in R$，有  \n$$(-a)b+ab=(-a+a)b=0b=0$$  \n$$ab+(-a)b=(a+(-a))b=0b=0$$\
    \  \n$(-a)b$是$ab$的负元。由负元惟一性$(-a)b=-ab$，同理$a(-b)=-ab$。"
  merge: -1
  img_proc: true
- pgno: 701
  md: '# 证明(4)


    (4) 证明思路：用归纳法证明 ∀_a_<sub>1</sub>, _a_<sub>2</sub>, ... , _a<sub>n</sub>_ 有


    \((\sum_{i=1}^n a_i)b_j = \sum_{i=1}^n a_i b_j\)


    同理可证，∀_b_<sub>1</sub>, _b_<sub>2</sub>, ... , _b<sub>m</sub>_ 有


    \(a_i(\sum_{j=1}^m b_j) = \sum_{j=1}^m a_i b_j\)


    于是 \((\sum_{i=1}^n a_i)(\sum_{j=1}^m b_j) = \sum_{i=1}^n a_i(\sum_{j=1}^m b_j)
    = \sum_{i=1}^n \sum_{j=1}^m a_i b_j\)'
