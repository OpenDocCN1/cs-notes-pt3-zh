- pgno: 252
  md: '# 3.1 集合的概念及其表示


    # 一、集合和元素


    集合是由某些特殊对象汇集在一起构成的。一般来说这些对象具有某种共同的性质。


    组成集合的那些个体称为集合的元素。


    +   - 全体中国人

    +   - 全部整数

    +   - 全国的高校

    +   - 全部叫李明的人


    +   - 用大写字母表示集合（如 $A$），小写字母表示集合中的事物（如 $a$）


    +   - 若个体 $a$ 是集合中 $A$ 的元素，记作“$a\in A$”

    +   - 若个体 $a$ 不是集合中 $A$ 的元素，记作“$a\notin A$”'
  merge: -1
