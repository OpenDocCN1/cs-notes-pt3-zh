- pgno: 921
  md: '# ## 二、可达性矩阵


    给定一个简单有向图\(G=\langle V,E,\psi\rangle\)，并且设结点\(v_i,v_j\in V\)。可知，由图\(G\)的邻接矩阵\(A\)能够直接确定\(G\)中是否存在一条从\(v_i\)到\(v_j\)的边。设\(r\in
    I_+\)，由矩阵能够求得从结点\(v_i\)到\(v_j\)长度为\(r\)的路径数目。试构成矩阵


    \(B_r=A+A^2+\cdots+A^r\)


    矩阵\(B_r\)的\((i,j)\)元素值表示了从结点\(v_i\)到\(v_j\)长度小于或等于\(r\)的路径数目。当图中的结点数目为\(n\)时，矩阵\(B_n\)都能够提供足够的信息，以表明从图中的任何结点到其它结点的可达性。'
  merge: -1
  img_proc: true
- pgno: 922
  md: '# 可达性矩阵


    **定义：** 给定一个简单有向图 $G=\langle V,E,\psi\rangle$，其中 $|V|=n$，并且假定 $G$ 中的各结点是有序的。试定义一个
    $n\times n$ 的**路径矩阵** $P$，使得其元素为


    $$P_{ij}=\begin{cases}1,&\text{如果从 }v_i\text{ 到 }v_j\text{ 至少存在一条路径}\\0,&\text{如果从
    }v_i\text{ 到 }v_j\text{ 不存在任何路径}\end{cases}$$


    路径矩阵 $P$ 仅表明了图中的任何结点偶对之间是否至少存在一条路径，以及在任何结点上存在循环与否；它并不能指明存在的所有路径。'
  merge: -1
  img_proc: true
- pgno: 923
  md: '# # 可达性矩阵


