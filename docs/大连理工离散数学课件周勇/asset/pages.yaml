- pgno: 385
  md: '# # 四、关系的闭包运算


    定理：设 \( R \) 为 \( A \) 上的关系，则有


    (1) \( r(R) = R \cup R^0 \)


    (2) \( s(R) = R \cup R^{-1} \)


    (3) \( t(R) = R \cup R^2 \cup R^3 \cup \ldots \)


    说明：对有穷集 \( A \) (\( |A| = n \)) 上的关系，(3) 中的并最多不超过 \( R^n \)


    证 只证(1)和(3).


    (1) 由 \( I_A = R^0 \subseteq R \cup R^0 \) 知 \( R \cup R^0 \) 是自反的，且满足 \( R \subseteq
    R \cup R^0 \)


    设 \( R'''' \) 是 \( A \) 上包含 \( R \) 的自反关系，则有 \( R \subseteq R'''' \) 和 \( I_A
    \subseteq R'''' \). 从而有


    \( R \cup R^0 \subseteq R'''' \). \( R \cup R^0 \) 满足闭包定义，所以 \( r(R) = R \cup
    R^0 \).'
