- pgno: 824
  md: '# # 路径和回路


    解： 河左岸允许出现的情况有以下10种情况：人狼羊菜、人狼羊、人狼菜、人羊菜、人羊、狼菜、狼、菜、羊及空（各物品已安全渡河），我们把这10种状态视为10个点，若一种状态通过一次摆渡后变为另一种状态，则在两种状态（点）之间画一直线，得到上图。


    这样摆渡问题就转化成在图中找出以“人狼羊菜”为起点，以“空”为终点的简单路。容易看出，只有两条简单路符合要求，即：


    +   (1) 人狼羊菜、狼菜、人狼菜、菜、人羊菜、羊、人羊、空；


    +   (2) 人狼羊菜、狼菜、人狼菜、狼、人狼羊、羊、人羊、空。


    对于简单路（1）的安排为：人带羊过河；人回来；带狼过河；放下狼再将羊带回；人再带菜过河；人回来；带羊过河。


    对于简单路（2）的安排为：人带羊过河；人回来；带菜过河；放下菜再将羊带回；人再带狼过河；人回来；带羊过河。


    上述的两种方案都是去4次、回3次，且不会再有比这更少次数的渡河办法了。'
  merge: -1
  img_proc: true
- pgno: 825
  md: '# 路径和回路


    **定理：** 设$v$和$v''$是图$G$中的结点。如果存在从$v$至$v''$的路径，则存在从$v$至$v''$的基本路径。


    **证：** 设当从$v$至$v''$存在长度小于$l$的路径时，从$v$至$v''$必存在基本路径。

    如果存在路径$v_0e_1v_1\cdots v_{l-1}e_lv_l$，其中$v_0=v,v_l=v''$，并且有$i$和$j$满足$0\leq i<j\leq
    l$且$v_i=v_j$，则$v_0e_1v_1\cdots v_i e_{j+1}v_{j+1}\cdots v_{l-1}e_lv_l$是从$v$至$v''$的长度为$l-j+i$的路径。根据归纳假设，存在从$v$至$v''$的基本路径。'
  merge: -1
  img_proc: true
- pgno: 826
  md: '# 路径和回路


    定理： n阶图中的基本路径的长度小于或等于n-1。


    证： 在任何基本路径中，出现于序列中的各结点都是互不相同的。在长度为l的任何基本路径中，不同的结点数目是l+1。因为集合V仅有n个不同的结点，所以任何基本路径的长度不会大于n-1。对于长度为l的基本循环来说，序列中有l个不同的结点。因为是n阶图，所以任何基本循环的长度，都不会超过n，综上所述，在n阶图中，基本路径的长度不会超过n-1。'
  merge: -1
  img_proc: true
