  md: '# # 函数的基本概念和性质


    例：设 \( N \) 是自然数集合，函数 \( S: N \to N \) 定义成  \( S(n) = n+1 \)。显然，\( S(0)=1, S(1)=2,
    S(2)=3 \cdots \)。这样的函数，通常称为**皮亚诺后继函数**。


    注意：有时为了某种需要，要特别强调函数的任意性和唯一性性质：函数 \( f \) 的定义域 \( \text{dom} f \) 中的每一个 \( x \)，在值域
    \( \text{ran} f \) 中都恰有一个象点 \( y \)，这种性质通常被称为函数的**良定性**。'
