- pgno: 875
  md: '# # 可达性矩阵


    首先构成矩阵\(A, A^2, \cdots, A^n\)，而后由他们构成矩阵\(B_n\)，再由矩阵\(B_n\)构成路径矩阵\(P\)，太麻烦了。为了减少计算工作量，应该设法使得不产生这些不必要的信息。


    # ## 生成路径矩阵的简单方法：布尔矩阵法。


    # ### 布尔和和布尔积：


    对于两个\(n \times n\)的布尔矩阵\(A\)和\(B\)，\(A\)和\(B\)的布尔和是\(A \lor B\)，\(A\)和\(B\)的布尔积是\(A
    \land B\)，并分别称为矩阵\(C\)和\(D\)，它们也都是布尔矩阵。把矩阵\(C\)和\(D\)的元素分别定义成


    \(C_{ij} = a_{ij} \lor b_{ij}, d_{ij} = \bigvee_{k=1}^n (a_{ik} \land b_{kj})\)'
  merge: -1
  img_proc: true
