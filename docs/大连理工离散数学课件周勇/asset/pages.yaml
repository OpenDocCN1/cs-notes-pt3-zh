- pgno: 492
  md: '# 函数的定义域和值域


    设是从 $X$ 到 $Y$ 的函数，函数的定义域 $\mathrm{dom}f=X$，而不会是 $X$ 的真子集。函数的值域满足 $\mathrm{ran}f\subseteq
    Y$。对于函数 $f$，常用 $f(X)$ 表示 $\mathrm{ran}f$。集合 $Y$ 称作 $f$ 的陪域。


    ```

    $$f(X)=\operatorname{ran}f=\{y\mid y\in Y\land(\exists x)(x\in X\land y=f(x))\}$$

    ```


    也称 $f(x)$ 是函数的象点


    **注意：** 函数的象点与自变量 $x$ 的象点是不同的。我们这里给出的函数的定义是全函数的定义，所以 $\mathrm{dom}f=X$。'
  merge: -1
  img_proc: true
- pgno: 493
  md: '# 函数的基本概念和性质


    例：设 $E$ 是全集，$P(E)$ 是 $E$ 的幂集。对任何两个集合 $X,Y\in P(E)$，它们的并运算和相交运算都是从 $P(E)\times
    P(E)$ 到 $P(E)$ 的映射；对任何集合 $X\in P(E)$ 的求补运算，则是从 $P(E)$ 到 $P(E)$ 的映射。


    例：试说明下列二元关系是否是函数？


    +   1. $\mathrm{exp}=\{\langle x,e^x\rangle\mid x\in R\}$

    +   2. $\mathrm{arcsin}=\{\langle x,y\rangle\mid x,y\in R\land \sin y=x\}$


    $(1)$ 是函数，$(2)$ 不是函数'
  merge: -1
