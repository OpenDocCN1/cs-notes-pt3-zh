- pgno: 775
  md: '# # 度


    定义：\( G=<V,E> \) 。


    (1)如果\( G \)是无向图，\( G \)中与\( v \)关联的边和与\( v \)关联的自回路的数目之和称为\( v \)的度(或次)，记为\(
    d_G(v) \)。


    (1)如果\( G \)是有向图，\( G \)中以\( v \)为起点的边的数目称为\( v \)的出度，记为\( d_G^+(v) \)；\( G \)中以\(
    v \)为终点的边的数目称为\( v \)的入度，记为\( d_G^-(v) \)；\( v \)的出度与入度之和称为\( v \)的度，记为\( d_G(v)
    \)。


    注意，在计算无向图中结点的度时，自回路要考虑两遍，因为自回路也是边。'
  merge: -1
