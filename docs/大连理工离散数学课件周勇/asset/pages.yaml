- pgno: 908
  md: '# 邻接矩阵


    由邻接矩阵判断有向图的性质：


    +   • 如果有向图是自反的，则邻接矩阵的主对角线上的各元素，必定都是1。


    +   • 如果有向图是反自反的，则邻接矩阵的主对角线上的各元素，必定都是0。


    +   • 对于对称的有向图来说，其邻接矩阵也是对称的，也就是说，对于所有的 $i$ 和 $j$ 而言，都应有 $a_{ij}=a_{ji}$。


    +   • 如果给定有向图是反对称的，则对于所有的 $i$ 和 $j$，当 $i\ne j$ 时，$a_{ij}=1$ 蕴含 $a_{ji}=0$。'
  merge: -1
  img_proc: true
- pgno: 909
  md: "# 邻接矩阵\n\n可以把简单有向图的矩阵表示的概念，推广到简单无向图、多重边图和加权图。对于简单无向图来说，这种推广会给出一个对称的邻接矩阵，在多重边图或加权图的情况下，可以令\n\
    \n```\na_{ij} = w_{ij}\n```\n\n其中的w_{ij}，或者是边\\langle v_i,v_j \rangle的重数，或者是边\\\
