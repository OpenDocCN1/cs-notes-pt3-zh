- pgno: 71
  md: '# # 1.5对偶原理


    +   • 定义：


    设有公式 \( A \)，其中仅含有逻辑联结词 \( \neg, \land, \lor \) 和逻辑常值 \( T \) 和 \( F \)。在 \( A
    \) 中将 \( \land, \lor, T, F \) 分别换以 \( \lor, \land, F, T\)，得公式 \( A^* \)，则称 \(
    A^* \) 为 \( A \) 的对偶式。


    !注意：求对偶式并不要求将“非”变原，而且对偶式是相互的。


    +   • 举例：


    - 求 \( \neg P \lor (Q \lor \neg R) \) 的对偶式


    \(\neg P \land (Q \land R)\)


    - 求 \( P \lor F \) 的对偶式 \( P \land T \)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # 对偶原理


    +   • 定理1.1 ：


    设A和A*互为对偶式，P₁,P₂,…,Pₙ是出现于A和A*中的所有的命题变元，于是有：


    (1) ¬A(P₁,P₂,…,Pₙ) ⇔ A*(¬P₁,¬P₂,…,¬Pₙ)


    (2) A(¬P₁,¬P₂,…,¬Pₙ) ⇔ ¬A*(P₁,P₂,…,Pₙ)


    +   • 证明：


    -由德·摩根律


    P ∧ Q ⇔ ¬(¬P ∨ ¬Q)


    P ∨ Q ⇔ ¬(¬P ∧ ¬Q)


    -可知，对公式A求否定，直到¬深入到命题变元之前位置，在这个过程中，所有的v变^, ^变 v, T变F, F变T。得证1。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # 对偶原理


    +   - 定理1.2：

    +   若 \( A \Leftrightarrow B \)，且 \( A \)、\( B \) 为命题变元 \( P_1, P_2, \cdots, P_n
    \) 及联结词 \( \land, \lor, \neg \) 构成的公式，则 \( A^* \Leftrightarrow B^* \)。


    +   - 证明：

    +     - \( A \Leftrightarrow B \) 意味着 \( A(P_1, P_2, \cdots, P_n) \Leftrightarrow
    B(P_1, P_2, \cdots, P_n) \) 永真

    +     - 于是有 \( \neg A(P_1, P_2, \cdots, P_n) \Leftrightarrow \neg B(P_1, P_2,
    \cdots, P_n) \)

    +     - 由定理1.1知，下式也永真

    +       \( A^*(\neg P_1, \neg P_2, \cdots, \neg P_n) \Leftrightarrow B^*(\neg
    P_1, \neg P_2, \cdots, \neg P_n) \)

    +     - 利用带入规则，以 \( \neg P_i (i=1, 2, \cdots, n) \) 取代 \( P_i \)，得

    +       \( A^*(P_1, P_2, \cdots, P_n) \Leftrightarrow B^*(P_1, P_2, \cdots, P_n)
    \)

    +       永真

    +       \( A^* \Leftrightarrow B^* \)'
  merge: -1
  img_proc: true
