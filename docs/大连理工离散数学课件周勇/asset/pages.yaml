- pgno: 12
  md: '# # 六种逻辑联结词


    +   (1) 联结词 “非”，记为 “￢”，表示 “否定” 的意思。


    +   (2) 联结词 “合取”，记为 “∧”，表示 “且” 的意思。


    +   (3) 联结词 “析取”，记为 “∨”，表示 “或” 的意思。


    +   (4) 联结词 “蕴涵”，记为 “→”，表示 “如果...，则...” 的意思。


    +   (5) 联结词 “等价”，记为 “↔”，表示 “当且仅当” 的意思。


    +   (6) 联结词 “异或”，记为 “∇”，表示 “要么...，要么...” 的意思。'
  merge: -1
  img_proc: true
