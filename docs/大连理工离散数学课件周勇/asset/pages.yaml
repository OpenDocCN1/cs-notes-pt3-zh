- pgno: 147
  md: '# 2.1谓词演算


    > 本质上是把数学中的的逻辑论证加以符号化。


    +   • 原子命题被分解为谓词和个体两部分。


    +   • 个体：可以独立存在的事物 。

    +   - 老师，计算机，证书，道德，智商等。


