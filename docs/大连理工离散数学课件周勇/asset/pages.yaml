- pgno: 988
  md: '# 匹配


    **定义：** 设无向图 $G=\langle V,E,\psi\rangle$，$E''\subseteq E$。


    +   1. 如果 $E''$ 不包含自圈，并且 $E''$ 中的任何两条边都不邻接，则称 $E''$ 为 $G$ 中的**匹配**。


    +   2. 如果 $E''$ 是 $G$ 中的匹配，并且对于 $G$ 中的一切匹配 $E''''$，只要 $E''\subseteq E''''$ 必有
    $E''=E''''$，则称 $E''$ 为 $G$ 中的**极大匹配**。


    +   3. $G$ 中的边数最多的匹配称为 $G$ 中的**最大匹配**。


    +   4. $G$ 中的最大匹配包含的边数称为 $G$ 的**匹配数**。


    最大匹配一定是极大匹配，而极大匹配不一定是最大匹配。在一个无向图中，可以有多个极大匹配和最大匹配。'
  merge: -1
  img_proc: true
