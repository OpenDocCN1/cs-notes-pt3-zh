  md: '# 完美匹配


    **定义：**设 $V_1$ 和 $V_2$ 是二部图 $G$ 的互补结点子集。如果 $G$ 的匹配数等于 $|V_1|$，则称 $G$ 中的最大匹配为 $V_1$
