- pgno: 991
  md: '# # 完美匹配


    定理： 设 \(V_1\) 和 \(V_2\) 是二部图 \(G\) 的互补结点子集。存在 \(V_1\) 到 \(V_2\) 的完美匹配，当且仅当对于任意
    \(S \subseteq V_1\)，\(|N_G(S)| \geq |S|\)，其中 \(N_G(S) = \{v \mid v \in V_2 \land
    (\exists v'')(v'' \in S \land v \text{ 与 } v'' \text{ 在 } G \text{ 中相邻})\}\)


    当二部图的结点数目比较大时，上述定理用起来不太方便，下面给出存在完美匹配的一个充分条件，判断二部图是否存在完美匹配时，可以先用这个充分条件，如果得不出结论，再用上述定理。'
  merge: -1
  img_proc: true
- pgno: 992
  md: '# 完美匹配


    **定理：** 设 $V_1$ 和 $V_2$ 是二部图 $G$ 的互补结点子集，$t$ 是正整数。对于 $V_1$ 中的每个结点，在 $V_2$ 中至少有
    $t$ 个结点与其邻接。对于 $V_2$ 中的每个结点，在 $V_1$ 中至少有 $t$ 个结点与其邻接。则存在 $V_1$ 到 $V_2$ 的完美匹配。


    **证：** 因为去掉平行边不会影响 $V_1$ 到 $V_2$ 的完美匹配的存在性，因此不妨假设 $G$ 是简单图。任取 $S\subseteq V_1$，设
    $|S|=n$，$|N_c(S)|=m$。如果边 $e$ 与 $S$ 中的某结点关联，则必有 $N_c(S)$ 中的结点与 $e$ 关联，所以

    $$\sum_{v\in S}d_G(v)\leq\sum_{v\in N_c(S)}d_G(v)。$$

    故

    $$t\cdot n\leq\sum_{v\in S}d_G(v)\leq\sum_{v\in N_c(S)}d_G(v)\leq t\cdot m,$$

    则 $m\geq n$。根据前一个定理，存在 $V_1$ 到 $V_2$ 的完美匹配。'
  merge: -1
  img_proc: true
- pgno: 993
  md: '# 二部图


    **例：**有 $q$ 个委员会 $C_1,C_2,\cdots,C_q$，要从每个委员会的委员中选出该委员会的主任，并限定任何人不得兼任一个以上委员会的主任。问是否可能按照要求选出主任？


    **思路：**把这个问题化为图论的问题。令 $V_1$ 是所有委员会的集合，$V_2$ 是参加这些委员会的人的集合，若某人 $m$ 是委员会 $C$ 的委员，则在
    $m$ 和 $C$ 之间连一条边。这样就构成了以 $V_1$ 和 $V_2$ 为互补结点子集的二部图，可能按照要求选出主任，当且仅当存在 $V_1$ 到 $V_2$
    的完美匹配。每个委员会至少有 $t$ 个委员，每个委员至多参加个委员会，这时主任是可以选出的。'
