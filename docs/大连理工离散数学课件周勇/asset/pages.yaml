- pgno: 262
  md: '# # 八、幂集


    定义：给定集合\(A\)，由集合\(A\)的所有子集为元素组成的集合称为集合\(A\)的幂集，记为\(P(A)\)。


    例：设\(A=\{a\}\)

    则0个元素的子集：\(\varnothing\)

    1个元素的子集：\(\{a\}\)

    因此\(\rho(A)=\{\varnothing,\{a\}\}\)


    设\(B=\{a,b\}\)

    则0个元素的子集：\(\varnothing\)

    1个元素的子集：\(\{a\},\{b\}\)

    2个元素的子集：\(\{a,b\}\)

    因此，\(P(B)=\{\varnothing,\{a\},\{b\},\{a,b\}\}\)


    设\(C=\{a,b,c\}\)

    则0个元素的子集：\(\varnothing\)；1个元素的子集：\(\{a\},\{b\},\{c\}\)

    2个元素的子集：\(\{a,b\},\{a,c\},\{b,c\}\)

    3个元素的子集：\(\{a,b,c\}\)

    因此\(P(C)=\{\varnothing,\{a\},\{b\},\{c\},\{a,b\},\{a,c\},\{b,c\},\{a,b,c\}\}\)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # 九、幂集


    定理：如果有限集合\(A\)有\(n\)个元素，则它的幂集有\(2^n\)个元素。


    证明：\(A\)的所有\(k\)个元素组成的子集数为从\(n\)个元素中取\(k\)个的组合数。


    \(C_n^k = \frac{n(n-1)(n-2)\cdots(n-k+1)}{k!}\)


    另外，因为\(\varnothing \subseteq A\) 因此\(P(A)\) 的总数\(N\)可表示为


    \(N = 1 + C_n^1 + C_n^2 + \dots + C_n^k + \dots + C_n^n = \sum_{k=0}^n C_n^k\)


    因为 \((x+y)^n = \sum_{k=0}^n C_n^k \cdot x^k \cdot y^{n-k}\)


    令\(x=y=1\)，得 \(2^n = \sum_{k=0}^n C_n^k\)


    故集合\(A\)的幂集的元素个数为\(2^n\)'
  merge: -1
  img_proc: true
