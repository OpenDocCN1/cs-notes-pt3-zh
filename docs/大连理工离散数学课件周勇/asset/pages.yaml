  md: '# 数理逻辑的创始人——莱布尼茨 (Leibniz, Gottfried Wilhelm)


    1646.7.1-1716.11.14


    +   ➤ 德国数学家、物理学家、哲学家等，一个举世罕见的科学天才。研究领域涉及到逻辑学、数学、力学、地质学、法学、历史学、语言学、生物学以及外交、神学等诸多方面.


    +   ➤ 出生于德国东部莱比锡的一个书香之家，父亲是莱比锡大学的道德哲学教授，母亲出生在一个教授家庭。莱布尼茨的父亲在他仅6岁时便去世了，给他留下了丰富的藏书。


    ![](img/d475a943ed426379b80e793b9fe1f17d_4_0.png)'
  merge: -1
