  md: '# # 7.3子群与群的陪集分解


    定义：设 \( G \) 是群，\( H \) 是 \( G \) 的非空子集，

    (1) 如果 \( H \) 关于 \( G \) 中的运算构成群，则称 \( H \) 是 \( G \) 的子群，记作 \( H \leq G \)。

    (2) 若 \( H \) 是 \( G \) 的子群，且 \( H \subset G \)，则称 \( H \) 是 \( G \) 的真子群，记作 \(
    H < G \)。


    例如 \( n\mathbb{Z} \) (\( n \) 是自然数) 是整数加群 \( <\mathbb{Z}, +> \) 的子群。当 \( n \neq
    1 \) 时，\( n\mathbb{Z} \) 是 \( \mathbb{Z} \) 的真子群。


    对任何群 \( G \) 都存在子群。\( G \) 和 \( \{e\} \) 都是 \( G \) 的子群，称为 \( G \) 的平凡子群。'
