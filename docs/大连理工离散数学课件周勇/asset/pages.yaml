    (5) 对任意的 \(x, y, z \in A\)，若 \(\langle x, y \rangle \in R\) 且 \(\langle y, z \rangle
    \in R\)，

    则 \(\langle x, z \rangle \in R\)，就称 \(R\) 为可传递的。用式子来表述即是：


    \(R\) 是可传递的 \(\Leftrightarrow (\forall x)(\forall y)(\forall z)(x, y, z \in A
    \land \langle x, y \rangle \in R \land \langle y, z \rangle \in R \rightarrow
    \langle x, z \rangle \in R)\)


    (6) 存在 \(x, y, z \in A\)，并且 \(\langle x, y \rangle \in R \land \langle y, z \rangle
    \in R\) 而 \(\langle x, z \rangle \notin R\)，

    就称 \(R\) 为不可传递的。用式子来表述即是：


    \(R\) 是不可传递的 \(\Leftrightarrow (\exists x)(\exists y)(\exists z)(\langle x, y
    \rangle \in R \land \langle y, z \rangle \in R \land \langle x, z \rangle \notin
    R)\)'
