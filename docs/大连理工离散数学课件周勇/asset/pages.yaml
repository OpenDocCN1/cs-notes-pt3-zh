- pgno: 532
  md: '# # 5.4 反函数


    可以用关系的合成直接定义了函数的合成。那么，能否用关系的逆关系直接定义函数的反函数呢？


    例：考察函数\(f: \mathbf{Z} \rightarrow \mathbf{Z}\)；

    \(f=\{<i, i^2> | i \in \mathbf{Z}\}\)

    于是

    \(f^{-1}=\{<i^2, i> | i \in \mathbf{Z}\}\)


    显然，\(f^{-1}\)不是从\(\mathbf{Z}\)到\(\mathbf{Z}\)的函数。因此，不能直接用关系的逆关系来定义函数的反函数。'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# # 反函数


    定义：设\(f: X \to Y\)是一个双射函数。于是\(f\)的逆关系是\(f\)的**反函数**（或称**逆函数**），并记作\(f^1\)。对于\(f\)来说，如果存在\(f^1\)，则函数\(f\)是可逆的。


    注意：仅当\(f\)是双射函数时，才有对应于\(f\)的反函数\(f^1\)。


    定义：若存在函数\(g: Y \to X\)，使得\(g \circ f = I_X\)，则称\(g\)为\(f\)的**左逆**；若存在函数\(g: Y
    \to X\)，使得\(f \circ g = I_Y\)，则称\(g\)为\(f\)的**右逆**。'
  merge: -1
  img_proc: true
