- pgno: 744
  md: '# # 布尔代数的性质


    **定理8.8** 设\(<B, \land, \lor, '', 0, 1>\)是布尔代数，则


    (1) \(\forall a \in B, (a'')'' = a\) .


    (2) \(\forall a, b \in B, (a \land b)'' = a'' \lor b'', (a \lor b)'' = a'' \land
    b''\) （德摩根律）


    证 (1) \((a'')''\) 是 \(a''\) 的补元，\(a\) 也是 \(a''\) 的补元。由补元惟一性得 \((a'')'' = a\) .


    (2) 对任意 \(a, b \in B\) 有


    \((a \land b) \lor (a'' \lor b'') = (a \lor a'' \lor b'') \land (b \lor a'' \lor
    b'')\)

    \(= (1 \lor b'') \land (a'' \lor 1) = 1 \land 1 = 1\),

    \((a \land b) \land (a'' \lor b'') = (a \land b \land a'') \lor (a \land b \land
    b'')\)

    \(= (0 \land b) \lor (a \land 0) = 0 \lor 0 = 0\)


    \(a'' \lor b''\) 是 \(a \land b\) 的补元，根据补元惟一性有 \((a \land b)'' = a'' \lor b''\)，同理

    可证 \((a \lor b)'' = a'' \land b''\) .


    +   - 注意：德摩根律对有限个元素也是正确的。'
  merge: -1
  img_proc: true
- pgno: 745
  md: "# # 布尔代数作为代数系统的定义\n\n**定义8.11** 设 \\(<B, *, \\circ>\\) 是代数系统，\\(*\\) 和 \\(\\\
    circ\\) 是二元运算。若 \\(*\\) 和 \\(\\circ\\) 运算满足：\n\n(1) 交换律，即 \\(\\forall a, b \\\
    in B\\) 有 \\(a * b = b * a\\)，\\(a \\circ b = b \\circ a\\)\n\n(2) 分配律，即 \\(\\\
    forall a, b, c \\in B\\) 有  \n\\(a * (b \\circ c) = (a * b) \\circ (a * c)\\)，\\\
    (a \\circ (b * c) = (a \\circ b) * (a \\circ c)\\)\n\n(3) 同一律，即存在 \\(0, 1 \\in\
    \ B\\)，使得 \\(\\forall a \\in B\\) 有 \\(a * 1 = a\\)，\\(a \\circ 0 = a\\)\n\n(4)\
    \ 补元律，即 \\(\\forall a \\in B\\)，存在 \\(a' \\in B\\) 使得 \\(a * a' = 0\\)，\\(a \\\
    circ a' = 1\\)  \n则称 \\(<B, *, \\circ>\\) 是一个布尔代数。\n\n可以证明，布尔代数的两种定义是等价的。"
