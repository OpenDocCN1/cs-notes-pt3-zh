    P_2, \cdots, P_n) \)

    +     - 由逆反律得 \( \neg B(P_1, P_2, \cdots, P_n) \rightarrow \neg A(P_1, P_2, \cdots,
    P_n) \)

    +     - 根据定理1.1 \( B^*(\neg P_1, \neg P_2, \cdots, \neg P_n) \rightarrow A^*(\neg
    P_1, \neg P_2, \cdots, \neg P_n) \)

    +     - 永真

    +     - 利用带入规则，以 \( \neg P_i (i = 1, 2, \cdots, n) \) 取代 \( P_i \) 得 \( B^*(P_1,
    P_2, \cdots, P_n) \rightarrow A^*(P_1, P_2, \cdots, P_n) \)

    +     - 永真

