- pgno: 129
  md: '# 证明有效结论的方法


    • 3，间接证明法（反证法）


    —定义：设公式 H₁，H₂，…Hₘ 中的原子变元是 P₁，P₂，…Pₙ。如果给各原子变元 P₁，P₂，…Pₙ 指派某一个真值集合，能使 H₁∧H₂∧…∧Hₘ
    具有真值 T，则命题公式集合{H₁，H₂，…Hₘ}称为一致的（或相容的）；


    —对于各原子变元的每一个真值指派，如果命题公式 H₁，H₂，…Hₘ 中至少有一个是假，从而使得 H₁∧H₂∧…∧Hₘ 是假，则称命题公式集合是不一致的（或不相容的）。


    —例如：令 H₁=P，H₂=¬P，则 H₁∧H₂=P∧¬P 是矛盾式，所以 P，¬P 是不相容的。'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# # 反证法\n\n+   定理: 若存在一个公式R，使得 \n+   H₁∧H₂∧...∧Hₘ ⇒ R∧¬R \n+   则公式H₁, H₂, ...,Hₘ是不相容的。\n\
    \n+   证明:\n\n+   -设,  H₁∧H₂∧...∧Hₘ ⇒ R∧¬R \n\n+   -则意味着 ( H₁∧H₂∧...∧Hₘ ) → (R∧¬R)\
    \ 是重言式,\n\n+   -而R∧¬R是矛盾式, 所以前件 H₁∧H₂∧...∧Hₘ必永远假。\n\n+   -因此, H₁, H₂, ...,Hₘ是不相容的。"
  merge: -1
  img_proc: true
- pgno: 131
  md: "# # 反证法\n\n+   - **定理：** 设命题公式集合 {H₁, H₂, ..., Hₘ} 是一致的，于是从前提集合出发可以逻辑的推出公式C的充要条件的是从前提集合\
    \ {H₁, H₂, ..., Hₘ, ¬C} 出发，可以逻辑地推出一个矛盾（永假）式。\n\n+   - **证明：**\n+   \n+     必要性：由于H₁\
    \ ∧ H₂ ∧ ... ∧ Hₘ ⇒C, 即H₁ ∧ H₂ ∧ ... ∧ Hₘ → C为永真式，因而使H₁ ∧ H₂ ∧ ... ∧ Hₘ 为真的真值指派一定使C为真，¬C为假，从而使H₁\
    \ ∧ H₂ ∧ ... ∧ Hₘ ∧¬C为假。必要性证完。"
