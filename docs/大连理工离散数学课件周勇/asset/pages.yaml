- pgno: 772
  md: '# # 图的基本概念


    定义： 设图\(G = \langle V, E, \psi \rangle\)，\(e_1\)和\(e_2\)是\(G\)的两条不同的边。


    (1)如果与\(e_1\)关联的两个结点相同，则称\(e_1\)为自圈（或称环和回路）。


    (2) 如果\(\psi(e_1) = \psi(e_2)\)，则称\(e_1\)与\(e_2\)平行。


    (3)如果图\(G\)没有自圈，也没有平行边，则称\(G\)为简单图。


    (4)如果图\(G\)没有自回路，有平行边，则称\(G\)为多重边图。


    (5)如果图\(G\)既有自回路，又有平行边，则称\(G\)为伪图。'
  merge: -1
  img_proc: true
