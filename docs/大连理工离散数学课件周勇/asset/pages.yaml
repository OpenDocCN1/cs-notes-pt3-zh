- pgno: 953
  md: '# # 构造欧拉回路


    # ## 构造欧拉回路的方法：


    1、在图G中任选一个结点，找到一个基本循环a1，从G中删去a1的各边之后得到生成子图G1，G1中的每个结点仍然是偶结点；


    2、如果G1是零图，则a1即为G中的欧拉回路，退出；否则，转3；


    3、若G1不是零图，由G的连通性可知，G1中必有与a1有公共顶点的基本循环a2。这两个基本循环可以通过这个公共顶点合并成一个简单循环；


    4、从G1中去掉a2的各边，得到一个生成子图，依次执行2和3，直到G1变为零图，就得到了一条包含各边的欧拉回路。'
  merge: -1
  img_proc: true
