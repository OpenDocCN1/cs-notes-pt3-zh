    \ \\)\n+       \\( \\Leftrightarrow (\\exists x_1)...(\\exists x_n)(\\exists y)((P(x_1,\
    \ x_2, ..., x_n, y) \\land \\neg H(x_1, x_2, ..., x_n, y)) \\lor (\\forall z)H(x_1,\
