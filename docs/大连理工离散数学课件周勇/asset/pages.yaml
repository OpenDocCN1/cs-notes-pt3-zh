- pgno: 949
  md: '# 欧拉图


    **定义：** 每个结点都是偶结点的连通无向图称为[欧拉图](欧拉图)。每个结点的出度和入度相等的连通有向图称为[欧拉有向图](欧拉有向图)。（规定平凡图是欧拉图）


    欧拉给出了一个连通无向图是欧拉图的充分必要条件，这就是下面的欧拉定理。


    **定理：** 设 $G$ 是连通无向图，则 $G$ 是欧拉图，当且仅当 $G$ 有欧拉闭路。'
  merge: -1
  img_proc: true
- pgno: 950
  md: '# 欧拉定理


    **定理：**设$G$是连通无向图，则$G$是欧拉图，当且仅当$G$有欧拉闭路。


    **证：**若连通无向图$G$有欧拉闭路，则从该闭路径中任选一个节点$a$，按照闭路径的顺序依次遍历节点。在路径上每访问一个节点就给该节点增加了两度。因此，每个节点的度都是偶数，该图是欧拉图。


    **再证必要性。对$G$的边数采用归纳法。**


    若$G$没有边，即图$G$是平凡图，必要性显然成立（这里把$0$当作偶数）。'
  merge: -1
  img_proc: true
- pgno: 951
  md: '# # 欧拉定理


    令\(n \in I_+\)，设任意边数少于\(n\)的连通欧拉图有欧拉闭路。若\(G\)有\(n\)条边，由\(G\)是连通欧拉图知，它的任意结点的度大于1，可得\(G\$有回路，设\(G\$有长度为\(m\)的回路\(C\)，知在\(G\$中存在闭路径\(v_0e_1v_1
    \cdots v_{m-1}e_mv_0\)，其中\(v_0,v_1, \cdots, v_{m-1}\)互不相同，并且\(\{v_0,v_1, \cdots,
    v_{m-1}\}\)和\(\{e_1,e_2, \cdots, e_m\}\)分别是\(C\$的结点集合和边的集合。令\(G''=G-\{e_1,e_2,
    \cdots, e_m\}\)，设\(G''\$有\(k\$个分支\(G_1,G_2, \cdots, G_k\)。由于\(G\$是连通的，\(G''\$的每个分支与\(C\$都有公共结点。设\(G_i(1
    \leq i \leq k)\$与\(C\$的一个公共结点为\(v_{n_i}\)，我们还可以假定 \(0 < n_1 < n_2 < \cdots < n_k
    < m-1\)。显然，\(G_i\$为边数少于\(n\$的连通欧拉图。根据归纳假设，\(G_i\$有一条从\(n_i\$至 \(v_{n_i}\$的闭路径\(P_i\)。因此，以下的闭路径


    \(v_0e_1v_1 \cdots e_{n_1}P_{e_{n_1+1}}v_{n_1+1} \cdots e_{n_k}P_{e_{n_k+1}}v_{n_k+1}
    \cdots v_{m-1}e_mv_0\)


    就是\(G\$的一条欧拉闭路。'
  merge: -1
  img_proc: true
