- pgno: 904
  md: '# # 邻接矩阵


    图的邻接矩阵不具有唯一性。


    对于给定简单有向图 \( G = \langle V, E, \psi \rangle \) 来说，其邻接矩阵依赖于集合 \( V \) 中的各元素间的次序关系。


    给定两个有向图和相对应的邻接矩阵，如果首先在一个图的邻接矩阵中交换一些行，而后交换相对应的各列，从而有一个图的邻接矩阵，能够求得另外一个图的邻接矩阵，则事实上这样的两个有向图，必定是互为同构的。'
  merge: -1
