  md: '# 良序关系


    定义：给定集合 $X$，$R$ 是 $X$ 中的二元关系。如果 $R$ 是个全序关系，且 $X$ 的每一个非空子集都有一个最小元，则称 $R$ 是个**良序关系**。与此对应，序偶
    $\langle X,R\rangle$ 称为**良序集合**。


    每一个良序集合必定是全序集合，因为对于任何子集来说，其本身必定有一个元素是它的最小元。但是每一个全序集合不一定都是良序的，有限全序集合必定是良序的。'
