- pgno: 386
  md: '# # 四、关系的闭包运算


    (3) 先证 \( R \cup R^2 \cup \dots \subseteq t(R) \) 成立。

    用归纳法证明对任意正整数 \( n \) 有 \( R^n \subseteq t(R) \)。

    \( n=1 \) 时有 \( R^1 = R \subseteq t(R) \)。假设 \( R^n \subseteq t(R) \) 成立，那么对任意的
    \( <x,y> <x,y> \in R^{n+1} = R^n \circ R \Rightarrow \exists t \ ( <x,t> \in R^n
    \land <t,y> \in R ) \)

    \( \Rightarrow \exists t \ ( <x,t> \in t(R) \land <t,y> \in t(R) ) \Rightarrow
    <x,y> \in t(R) \)

    这就证明了 \( R^{n+1} \subseteq t(R) \)。由归纳法命题得证。

    再证 \( t(R) \subseteq R \cup R^2 \cup \dots \) 成立，为此只须证明 \( R \cup R^2 \cup \dots
    \) 传递。

    任取 \( <x,y>, <y,z> \)，则

    \( <x,y> \in R \cup R^2 \cup \dots \land <y,z> \in R \cup R^2 \cup \dots \)

    \( \Rightarrow \exists t \ ( <x,y> \in R^t ) \land \exists s \ ( <y,z> \in R^s
    ) \)

    \( \Rightarrow \exists t \exists s \ ( <x,z> \in R^t \circ R^s ) \)

    \( \Rightarrow \exists t \exists s \ ( <x,z> \in R^{t+s} ) \)

    \( \Rightarrow <x,z> \in R \cup R^2 \cup \dots \)

    从而证明了 \( R \cup R^2 \cup \dots \) 是传递的。'
  merge: -1
  img_proc: true
