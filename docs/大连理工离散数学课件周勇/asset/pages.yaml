- pgno: 306
  md: '# # 第四章 二元关系


    +   本章讨论的关系（主要是二元关系），它仍然是一种集合，但它是比前一章更为复杂的集合。


    +   关系是笛卡尔乘积的子集，它的元素是有序二元组的形式，这些有序二元组中的两个元素来自于两个不同或者相同的集合。因此，关系是建立在其它集合基础之上的集合。


    +   关系中的有序二元组反映了不同集合中元素与元素之间的关系，或者同一集合中元素之间的关系。本章首先讨论关系的基本表达形式，然后给出关系的运算，最后讨论几种常用的关系。'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # 3.5多重序元与笛卡尔乘积


    # ## 一、序偶


    定义：由两个具有固定次序的客体组成的序列，称序偶，记作<x,y>。


    ![](img/d475a943ed426379b80e793b9fe1f17d_307_0.png)


    {2,3}={3,2}

    < 2,3 >≠< 3,2 >'
