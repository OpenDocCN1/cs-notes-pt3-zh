  md: '# # 置换的对换分解


    设 \( S = \{1, 2, \dots, n\} \)，\( \sigma = (i_1 \ i_2 \ \dots \ i_k) \) 是 \( S
    \) 上的 \( k \) 阶轮换，\( \sigma \) 可以进一步表成对换之积，即

    \( (i_1 \ i_2 \ \dots \ i_k) = (i_1 \ i_2)(i_1 \ i_3) \dots (i_1 \ i_k) \)

    任何 \( n \) 元置换表示成不交的轮换之积，然后将每个轮换表成对换之积。


    例如 8 元置换

    \( \sigma = (1 \ 5 \ 2 \ 3 \ 6)(7 \ 8) = (1 \ 5)(1 \ 2)(1 \ 3)(1 \ 6)(7 \ 8) \)

    \( \tau = (1 \ 8 \ 3 \ 4 \ 2)(5 \ 6 \ 7) = (1 \ 8)(1 \ 3)(1 \ 4)(1 \ 2)(5 \ 6)(5
    \ 7) \)'
  merge: -1
  img_proc: true
