- pgno: 577
  md: '# # 惟一性定理


    定理9.1 设 \( \circ \) 为 \( S \) 上的二元运算，\( e_l \) 和 \( e_r \) 分别为 \( S \) 中关于运算的左和右单位元，则
    \( e_l = e_r = e \) 为 \( S \) 上关于 \( \circ \) 运算的惟一的单位元。


    证：

    \( e_l = e_l \circ e_r \quad (e_r \text{为右单位元}) \)

    \( e_l \circ e_r = e_r \quad (e_l \text{为左单位元}) \)


    所以 \( e_l = e_r \)，将这个单位元记作 \( e \).


    假设 \( e'' \) 也是 \( S \) 中的单位元，则有 \( e'' = e \circ e'' = e \). 惟一性得证。类似地可以证明关于零元的惟一性定理。


    # ## 注意：


    +   - 当 \( |S| \ge 2 \)，单位元与零元是不同的；

    +   - 当 \( |S| = 1 \) 时，这个元素既是单位元也是零元。'
  merge: -1
  img_proc: true
- pgno: 578
  md: '# # 定理9.2


    设 \(\circ\) 为 \(S\) 上可结合的二元运算，\(e\) 为该运算的单位元，对于 \(x \in S\) 如果存在左逆元 \(y_l\) 和右逆元
    \(y_r\)，则有 \(y_l = y_r = y\)，且 \(y\) 是 \(x\) 的惟一的逆元。


    证：由 \(y_l \circ x = e\) 和 \(x \circ y_r = e\) 得


    \(y_l = y_l \circ e = y_l \circ (x \circ y_r) = (y_l \circ x) \circ y_r = e \circ
    y_r = y_r\)


    令 \(y_l = y_r = y\)，则 \(y\) 是 \(x\) 的逆元。


    假若 \(y'' \in S\) 也是 \(x\) 的逆元，则


    \(y'' = y'' \circ e = y'' \circ (x \circ y) = (y'' \circ x) \circ y = e \circ
    y = y\)


    所以 \(y\) 是 \(x\) 惟一的逆元。


    说明：对于可结合的二元运算，可逆元素 \(x\) 只有惟一的逆元，记作 \(x^{-1}\)'
  merge: -1
  img_proc: true
