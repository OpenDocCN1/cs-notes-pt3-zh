- pgno: 285
  md: '# 四、对称差分运算


    定义：设 $A、B$ 为任意两个集合。属于 $A$ 但不属于 $B$ 的所有元素和属于 $B$ 但不属于 $A$ 的所有元素的并集，称为 $A$ 和 $B$
    的**对称差集**，记作 $A\oplus B$。


    $$A\oplus B=(A-B)\cup(B-A)$$

    $$=(A\cap\sim B)\cup(B\cap\sim A)$$

    $$=(A\cup B)-(A\cap B)$$


    **例如：** $A=\{1,2,3\}$


    $B=\{3,2,4\}$


    则 $A\oplus B=\{1,4\}$


