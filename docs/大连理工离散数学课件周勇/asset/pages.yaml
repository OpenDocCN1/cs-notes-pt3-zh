- pgno: 959
  md: '# # 欧拉图


    **定理：** 设 $G=(V,E,\psi)$ 为连通无向图，且 $v_1,v_2\in V$，则 $G$ 有一条从 $v_1$ 至 $v_2$ 的欧拉路径当且仅当
    $G$ 恰有两个奇结点 $v_1$ 和 $v_2$。


    **证：** 任取 $e\notin E$，并令 $\varphi''={e,\{v_1,v_2\}}$，则 $G$ 有一条从 $v_1$ 至 $v_2$
    的欧拉路径，当且仅当 $G''=G+\{e\}_{\psi''}$ 有一条欧拉闭路。因此，$G$ 恰有两个奇结点 $v_1$ 和 $v_2$，当且仅当 $G''$
    的结点都是偶结点。根据前面定理，知本定理成立。'
