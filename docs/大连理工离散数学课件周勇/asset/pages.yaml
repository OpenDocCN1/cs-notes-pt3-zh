  md: '# # 有关群性质的证明方法


    有关群的简单证明题的主要类型


    +   - 证明群中的元素某些运算结果相等


    +   - 证明群中的子集相等


    +   - 证明与元素的阶相关的命题.


    +   - 证明群的其它性质，如交换性等.


    常用的证明手段或工具是


    +   - 算律：结合律、消去律


    +   - 和特殊元素相关的等式，如单位元、逆元等


    +   - 幂运算规则


    +   - 和元素的阶相关的性质. 特别地，\(a\) 为1阶或2阶元的充分必要条件是\(a^{-1} = a\).'
