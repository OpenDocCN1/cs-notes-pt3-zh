    # # Probabilistic analysis


    In general, we have no control over the order in which candidates appear. We could
    assume that they come in a random order:


    +   - Assign a rank to each candidate: rank(i) is a unique integer in the range
    1 to n.

    +   - The ordered list (rank(1), rank(2), ..., rank(n)) is a permutation of the
    candidate numbers (1, 2, ..., n).

    +   - The list of ranks is equally likely to be any one of the n! permutations.

    +   - Equivalently, the ranks form a uniform random permutation: each of the possible
    n! permutations appears with equal probability.'
