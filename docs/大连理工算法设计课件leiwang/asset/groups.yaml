  mdcn: "\n\n# Solving a system of difference constraints\n\nLinear programming where\
    \ each row of $A$ contains exactly one $1$, one $-1$, and the rest $0$'s.\n\n\
    # Example:\n\n$$\\begin{aligned} x_1-x_2 &\\le 3 \\\\ x_2-x_3 &\\le -2 \\\\ x_1-x_3\
    \ &\\le 2 \\end{aligned}$$\n\n$x_j-x_i\\le w_{ij}$\n\n# Solution:\n\n$$\\begin{aligned}\
    \ x_1 &= 3 \\\\ x_2 &= 0 \\\\ x_3 &= 2 \\end{aligned}$$\n\n> (The “$A$” matrix\
    \ has dimensions $|E|\\times|V|$.)\n\n# Constraint graph:\n\n$x_j-x_i\\le w_{ij}$\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_704_0.png)\n\n# Unsatisfiable constraints\n\
    \n**Theorem.** If the constraint graph contains a negative-weight cycle, then\
    \ the system of differences is unsatisfiable.\n\n**Proof.** Suppose that the negative-weight\
    \ cycle is \\(v_1 \\rightarrow v_2 \\rightarrow \\cdots \\rightarrow v_k \\rightarrow\
    \ v_1\\). Then, we have\n\n+   \\(x_2 - x_1 \\leq w_{12}\\)\n+   \\(x_3 - x_2\
    \ \\leq w_{23}\\)\n+   \\(\\vdots\\)\n+   \\(x_k - x_{k-1} \\leq w_{k-1,k}\\)\n\
    +   \\(x_1 - x_k \\leq w_{k1}\\)\n\n# Unsatisfiable constraints\n\n**Theorem.**\
    \ If the constraint graph contains a negative-weight cycle, then the system of\
    \ differences is unsatisfiable.\n\n*Proof.* Suppose that the negative-weight cycle\
    \ is $v_1 \\to v_2 \\to \\cdots \\to v_k \\to v_1$. Then, we have\n\n$$\n\\begin{aligned}\n\
    x_2-x_1 &\\le w_{12}\\\\\nx_3-x_2 &\\le w_{23}\\\\\n&\\vdots\\\\\nx_k-x_{k-1}\
    \ &\\le w_{k-1,k}\\\\\nx_1-x_k &\\le w_{k1}\\\\\n\\hline\n0 &\\le \\text{weight\
    \ of cycle}\\\\\n&<0\n\\end{aligned}\n$$\n\nTherefore, no values for the $x_i$\
    \ can satisfy the constraints.\n\n![](img/5e59105b951890406cf98b2a964cb2f9_707_0.png)\n\
    \n# Satisfying the constraints\n\n**Theorem.** Suppose no negative-weight cycle\
    \ exists in the constraint graph. Then, the constraints are satisfiable.\n\n*Proof.*\
    \ Add a new vertex $s$ to $V$ with a 0-weight edge to each vertex $v_i \\in V$.\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_709_0.png)\n\n# Satisfying the constraints\n\
    \n**Theorem.** Suppose no negative-weight cycle exists in the constraint graph.\
    \ Then, the constraints are satisfiable.\n\n*Proof.* Add a new vertex $s$ to $V$\
    \ with a $0$-weight edge to each vertex $v_i \\in V$.\n\n![](img/5e59105b951890406cf98b2a964cb2f9_710_0.png)\n\
    \n> **Note:**\n> \n> No negative-weight cycles introduced $\\Rightarrow$ shortest\
    \ paths exist.\n\n# Bellman-Ford and linear programming\n\n**Corollary.** The\
    \ Bellman-Ford algorithm can solve a system of _m_ difference constraints on _n_\
    \ variables in _O_(_mn_) time. $\\blacksquare$\n\nSingle-source shortest paths\
    \ is a simple LP problem.\n\nIn fact, Bellman-Ford maximizes \\(x_1 + x_2 + \\\
    cdots + x_n\\) subject to the constraints \\(x_j - x_i \\le w_{ij}\\) and \\(x_i\
    \ \\le 0\\) (exercise).\n\nBellman-Ford also minimizes \\(\\max_i\\{x_i\\} - \\\
    min_i\\{x_i\\}\\) (exercise).\n\n# Application to VLSI layout compaction\n\n#\
