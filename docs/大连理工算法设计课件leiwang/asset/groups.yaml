  - '[PAGE 39]


    # The Heapsort Algorithm


    +   - Builds a max-heap from the array.

    +   - Starting with the root, the algorithm places the maximum element into the
    correct place in the array by swapping it with the last array element.

    +   - “Discard” this last node by decreasing the heap size, and calling MAX-HEAPIFY
    on the new (possibly incorrectly-placed) root.

    +   - Repeat this discarding process until only one node remains.


    ```

    HEAPSORT(A)

    1 BUILD-MAX-HEAP(A)

    2 for i ← length[A] downto 2

    3 do exchange A[1] ↔ A[i]

    4 heap-size[A] ← heap-size[A] - 1

    5 MAX-HEAPIFY(A, 1)

    ```




    +   - BUILD-MAX-HEAP: O(n)

    +   - for loop: n - 1 times

    +   - exchange elements: O(1)

    +   - MAX-HEAPIFY: O(log n)


    Total time: O(n log n)'
