    # # Correctness — Part III


    **Theorem.** Dijkstra’s algorithm terminates with $d[v] = \delta(s, v)$ for all
    $v \in V$.


    *Proof:* It suffices to show that $d[v] = \delta(s, v)$ for every $v \in V$ when
    $v$ is added to $S$. Suppose $u$ is the first vertex added to $S$ for which $d[u]
    > \delta(s, u)$. Let $v$ be the first vertex in $V-S$ along a shortest path from
    $s$ to $u$, and let $x$ be its predecessor:


    ![](img/5e59105b951890406cf98b2a964cb2f9_642_0.png)'
  - '[PAGE 643]


    # Correctness — Part III (continued)


    ![](img/5e59105b951890406cf98b2a964cb2f9_643_0.png)


    Since u is the first vertex violating the claimed invariant, we have d[x] = δ(s,
    x). When x was added to S, the edge (x, y) was relaxed, which implies that d[y]
    = δ(s, y) ≤ δ(s, u) < d[u]. But, d[u] ≤ d[y] by our choice of u. Contradiction.'
