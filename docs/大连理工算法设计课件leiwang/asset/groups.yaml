    TREE-SUCCESSOR(x)\n1 if right[x] ≠ NIL\n2 then return TREE-MINIMUM(right[x])\n\
    3 y ← p[x]\n4 while y ≠ NIL and x = right[y]\n5 do x ← y\n6 y ← p[y]\n7 return\
    \ y\n```\n\n_Time:_ Since we visit nodes on a path down the tree or up the tree,\
    \ the running time is _O_(_h_), where _h_ is the height of the tree.\n"
