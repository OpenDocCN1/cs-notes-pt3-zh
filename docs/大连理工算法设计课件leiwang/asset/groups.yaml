    \ \\end{cases}$\n\n**IDEA:** Use Floyd-Warshall, but with $(\\lor, \\land)$ instead\
    \ of $(\\min, +)$:\n\n$t_{ij}^{(k)} = t_{ij}^{(k-1)} \\lor \\left(t_{ik}^{(k-1)}\
    \ \\land t_{kj}^{(k-1)}\\right).$\n\nTime = $\\Theta(n^3)$.\n\n# Graph reweighting\n\
    \n**Theorem.** Given a function $h: V \\to \\mathbb{R}$, *reweight* each edge\
    \ $(u,v) \\in E$ by $w_h(u,v) = w(u,v) + h(u) - h(v)$. Then, for any two vertices,\
