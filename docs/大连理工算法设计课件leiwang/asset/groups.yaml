    \ not immediately consumed is stored in the **bank** for use by subsequent operations.\n\
    +   - The bank balance must not go negative! We must ensure that\n+   \n+    \
    \ \\(\\sum_{i=1}^n c_i \\leq \\sum_{i=1}^n \\hat{c}_i\\)\n+   \n+     for all\
    \ \\( n \\).\n+   - Thus, the total amortized costs provide an upper bound on\
    \ the total true costs."
