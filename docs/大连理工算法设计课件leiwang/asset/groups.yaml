  - "[PAGE 378]\n\n# Randomized divide-and-conquer algorithm\n\n```\nRANDOM-SELECT(A,\
    \ p, q, i) ▷ ith smallest of A[p...q]\n    if p = q then return A[p]\n    r ←\
    \ RANDOM-PARTITION(A, p, q)\n    k ← r − p + 1 ▷ k = rank(A[r])\n    if i = k\
    \ then return A[r]\n    if i < k\n        then return RANDOM-SELECT(A, p, r −\
    \ 1, i)\n        else return RANDOM-SELECT(A, r + 1, q, i − k)\n```\n\n![](img/5e59105b951890406cf98b2a964cb2f9_378_0.png)"
