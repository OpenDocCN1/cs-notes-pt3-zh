    ## Solving the recurrence


    \[

    T(n) = T\left(\frac{1}{5}n\right) + T\left(\frac{3}{4}n\right) + \Theta(n)

    \]


    ### Substitution


    \[

    T(n) \le cn

    \]


    \[

    T(n) \le \frac{1}{5}cn + \frac{3}{4}cn + \Theta(n)

    \]


    \[

    = \frac{19}{20}cn + \Theta(n)

    \]


    \[

    = cn - \left(\frac{1}{20}cn - \Theta(n)\right)

    \]


    \[

    \le cn,

    \]


    if \(c\) is chosen large enough to handle both the \(\Theta(n)\) and the initial
    conditions.


    ## Conclusions


    - Since the work at each level of recursion is a constant fraction (19/20) smaller,
    the work per level is a geometric series dominated by the linear work at the root.

    - In practice, this algorithm runs slowly, because the constant in front of \(n\)
    is large.

