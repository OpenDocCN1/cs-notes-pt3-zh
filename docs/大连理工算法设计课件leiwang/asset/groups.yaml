  - '[PAGE 732]


    # Transitive closure of a directed graph


    Compute $t_{ij} = \begin{cases} 1 & \text{if there exists a path from } i \text{
    to } j, \\ 0 & \text{otherwise.} \end{cases}$


    **IDEA:** Use Floyd-Warshall, but with $(\lor, \land)$ instead of $(\min, +)$:


    $t_{ij}^{(k)} = t_{ij}^{(k-1)} \lor \left(t_{ik}^{(k-1)} \land t_{kj}^{(k-1)}\right).$


    Time = $\Theta(n^3)$.'
  - '[PAGE 733]


    ![](img/5e59105b951890406cf98b2a964cb2f9_733_0.png)


    # # Graph reweighting


    **Theorem.** Given a function $h: V \to \mathbb{R}$, *reweight* each edge $(u,v)
    \in E$ by $w_h(u,v) = w(u,v) + h(u) - h(v)$. Then, for any two vertices, all paths
    between them are reweighted by the same amount.'
  - '[PAGE 734]


    # # Graph reweighting


    **Theorem.** Given a function $h: V \to \mathbb{R}$, **reweight** each edge $(u,v)
    \in E$ by $w_h(u,v)=w(u,v)+h(u)-h(v)$. Then, for any two vertices, all paths between
    them are reweighted by the same amount.


    *Proof.* Let $p=v_1 \to v_2 \to \cdots \to v_k$ be a path in $G$. We have


    $$w_h(p)=\sum_{i=1}^{k-1}w_h(v_i,v_{i+1})$$


    $$=\sum_{i=1}^{k-1}\left(w(v_i,v_{i+1})+h(v_i)-h(v_{i+1})\right)$$


    $$=\sum_{i=1}^{k-1}w(v_i,v_{i+1})+h(v_1)-h(v_k)$$


    $$=w(p)+h(v_1)-h(v_k).$$


    **Same amount!**


    ![](img/5e59105b951890406cf98b2a964cb2f9_734_0.png)'
  - '[PAGE 735]


    ![](img/5e59105b951890406cf98b2a964cb2f9_735_0.png)


    # Shortest paths in reweighted graphs


    **Corollary.** $\delta_h(u,v)=\delta(u,v)+h(u)-h(v).$'
  - '[PAGE 736]


    # # Shortest paths in reweighted graphs


    **Corollary.** \(\delta_h(u, v) = \delta(u, v) + h(u) - h(v)\).


    **IDEA:** Find a function \(h : V \rightarrow \mathbb{R}\) such that \(w_h(u,
    v) \ge 0\) for all \((u, v) \in E\). Then, run Dijkstra''s algorithm from each
    vertex on the reweighted graph.


    **NOTE:** \(w_h(u, v) \ge 0\) iff \(h(v) - h(u) \le w(u, v)\).'
  - '[PAGE 737]


    # # Johnson''s algorithm


    +   1. Find a function \( h : V \rightarrow \mathbb{R} \) such that \( w_h(u,
    v) \geq 0 \) for all \( (u, v) \in E \) by using Bellman-Ford to solve the difference
    constraints \( h(v) - h(u) \leq w(u, v) \), or determine that a negative-weight
    cycle exists.

    +      • Time = \( O(VE) \).


    +   2. Run Dijkstra''s algorithm using \( w_h \) from each vertex \( u \in V \)
    to compute \( \delta_h(u, v) \) for all \( v \in V \).

    +      • Time = \( O(VE + V^2 \lg V) \).


    +   3. For each \( (u, v) \in V \times V \), compute

    +      \( \delta(u, v) = \delta_h(u, v) - h(u) + h(v) \).

    +      • Time = \( O(V^2) \).


    **Total time** = \( O(VE + V^2 \lg V) \).'
