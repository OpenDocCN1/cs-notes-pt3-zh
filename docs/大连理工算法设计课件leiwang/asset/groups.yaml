    - Analysis\n- Breadth-first search\n\nProf. Erik Demaine\n\nNovember 14, 2005\
    \ Copyright © 2001-5 by Erik D. Demaine and Charles E. Leiserson L17.1\n\n## Paths\
    \ in graphs\n\nConsider a digraph \\( G = (V, E) \\) with edge-weight function\
    \ \\( w : E \\rightarrow \\mathbb{R} \\). The **weight** of path \\( p = v_1 \\\
    rightarrow v_2 \\rightarrow \\cdots \\rightarrow v_k \\) is defined to be\n\n\\\
    ( w(p) = \\sum_{i=1}^{k-1} w(v_i, v_{i+1}) \\).\n\n### Example:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_613_0.png)\n\
    \n\\( w(p) = -2 \\)\n\n![](img/5e59105b951890406cf98b2a964cb2f9_614_0.png)\n\n\
    ## Shortest paths\n\nA **shortest path** from *u* to *v* is a path of minimum\
    \ weight from *u* to *v*. The **shortest-path weight** from *u* to *v* is defined\
    \ as\n\n$\\delta(u, v) = \\min\\{w(p) : p\\text{ is a path from }u\\text{ to }v\\\
    }$.\n\n**Note:** $\\delta(u, v) = \\infty$ if no path from *u* to *v* exists.\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_615_0.png)\n\n## Optimal substructure\n\
    \n**Theorem.** A subpath of a shortest path is a shortest path.\n\n**Proof.**\
    \ Cut and paste:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_616_0.png)\n\n##\
    \ Triangle inequality\n\n**Theorem.** For all \\(u, v, x \\in V\\), we have\n\\\
    (\\delta(u, v) \\leq \\delta(u, x) + \\delta(x, v)\\).\n\n![](img/5e59105b951890406cf98b2a964cb2f9_618_0.png)\n\
    \n**Proof.**\n\n![](img/5e59105b951890406cf98b2a964cb2f9_619_0.png)\n\n## Well-definedness\
    \ of shortest paths\n\nIf a graph \\( G \\) contains a negative-weight cycle,\
    \ then some shortest paths may not exist.\n\n![](img/5e59105b951890406cf98b2a964cb2f9_620_0.png)\n\
    \n### Example:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_621_0.png)\n\n![](img/5e59105b951890406cf98b2a964cb2f9_622_0.png)\n\
    \n## Single-source shortest paths\n\nFrom a given source vertex $s \\in V$, find\
    \ the shortest-path weights $\\delta(s, v)$ for all $v \\in V$. If all edge weights\
    \ $w(u, v)$ are nonnegative, all shortest-path weights must exist.\n\n- Maintain\
    \ a set $S$ of vertices whose shortest-path distances from $s$ are known.\n- At\
    \ each step add to $S$ the vertex $v \\in V - S$ whose distance estimate from\
    \ $s$ is minimal.\n- Update the distance estimates of vertices adjacent to $v$.\n\
    \n## Dijkstra's algorithm\n\n```\nd[s] ← 0\nfor each v ∈ V − {s}\n    do d[v]\
    \ ← ∞\nS ← ∅\nQ ← V     ▷ Q is a priority queue maintaining V − S\n```\n\n```\n\
    d[s] ← 0\nfor each v ∈ V − {s}\n    do d[v] ← ∞\nS ← ∅\nQ ← V   ▷ Q is a priority\
    \ queue maintaining V − S\nwhile Q ≠ ∅\n    do u ← EXTRACT-MIN(Q)\n        S ←\
    \ S ∪ {u}\n        for each v ∈ Adj[u]\n            do if d[v] > d[u] + w(u, v)\n\
    \                then d[v] ← d[u] + w(u, v)\n```\n\n"
