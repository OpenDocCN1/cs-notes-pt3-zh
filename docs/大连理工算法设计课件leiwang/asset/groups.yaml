    # # The sorting problem


    **Input:** A sequence of \( n \) numbers \( \langle a_1, a_2, \ldots, a_n \rangle
    \).


    **Output:** A permutation (reordering) \( \langle a''_1, a''_2, \ldots, a''_n
    \rangle \) of the input sequence such that \( a''_1 \leq a''_2 \leq \cdots \leq
    a''_n \).


    # ## Solution


    **Algorithm:** a well-defined computational procedure that takes some value, or
    set of values, as input and produces some value, or set of values, as output.'
  - "[PAGE 5]\n\n# # Insertion sort\n\n+   - A good algorithm for sorting a small\
    \ number of elements.\n+   - It works the way you might sort a hand of playing\
    \ cards.\n\n```\nINSERTION-SORT(A)\nfor j ← 2 to length[A]\n    do key ← A[j]\n\
    \        ▹ Insert A[j] into the sorted sequence A[1.. j − 1].\n    i ← j − 1\n\
    \    while i > 0 and A[i] > key\n        do A[i + 1] ← A[i]\n            i ← i\
    \ − 1\n    A[i + 1] ← key\n```\n\nLoop invariants and the correctness of insertion\
    \ sort"
  - '[PAGE 6]


