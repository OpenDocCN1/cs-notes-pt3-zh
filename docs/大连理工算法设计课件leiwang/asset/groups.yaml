  - '[PAGE 7]


    # # Using loop invariants is like mathematical induction


    +   - To prove that a property holds, you prove a base case and an inductive step.

    +   - Showing that the invariant holds before the first iteration is like the
    base case.

    +   - Showing that the invariant holds from iteration to iteration is like the
    inductive step.

    +   - The termination part differs from the usual use of mathematical induction,
    in which the inductive step is used infinitely. We stop the “induction” when the
    loop terminates.

    +   - We can show the three parts in any order.'
  - '[PAGE 8]


    # Example for insertion sort


    # The three parts for insertion sort


    +   • Initialization: Just before the first iteration, j = 2. The subarray A[1..j-1]
    is the single element A[1], which is the element originally in A[1], and it is
    trivially sorted.


    +   • Maintenance: we note that the body of the inner while loop works by moving
    A[j-1] ← A[j-2], A[j-1] ← A[j-3], and so on, by one position to the right until
    the proper position for key (which has the value that started out in A[j]) is
    found. At that point, the value of key is placed into this position.


    +   • Termination: The outer for loop ends when j > n; this occurs when j = n
    + 1. Thus, j = 1 = n. Plugging n in for j in the loop invariant, A[1..n] consists
    of the elements originally in A[1..n] but in sorted order. The entire array is
    sorted!'
  - '[PAGE 9]


    # # Random-access machine (RAM) model


    +   - Instructions are executed one after another. No concurrent operations.

    +   - It''s too tedious to define each of the instructions and their associated
    time costs.

    +   - Instead, we recognize that we''ll use instructions commonly found in real
    computers.

    +     - Arithmetic: add, subtract, multiply, divide, remainder, floor, ceiling;
    shift left/shift right (good for multiplying/dividing by \(2^k\)).

    +     - Data movement: load, store, copy.

    +     - Control: conditional/unconditional branch, subroutine call and return.

    +   - Each of these instructions takes a constant amount of time.'
  - '[PAGE 10]


    # # Running time


    On a particular input, **_the running time_** is the number of primitive operations
    (steps) executed.


    +   - Want to define steps to be machine-independent.

    +   - Each line of pseudocode requires a constant amount of time.

    +   - One line may take a different amount of time than another, but each execution
    of line _i_ takes the same amount of time _c<sub>i</sub>_.

    +   - This is assuming that the line consists only of primitive operations.


    The running time of an algorithm is:


    \(\sum_{\text{all statements}} \text{(cost of statement)} \times \text{(# of times
    statement is executed)}\)'
  md: "\n# The Design and Analysis of Algorithms\nLecture 1\n\nLei Wang\n\nDalian\
    \ University of Technology\n\nSeptember 23, 2015\n\n## Course Info\n\n- Instructor:\
    \ Lei Wang, lei.wang@dlut.edu.cn, tel: 6227 4394\n- Textbook: **Introduction to\
    \ Algorithms**, by Thomas Cormen _et al._, aka, CLRS.\n- Courseware: MIT Open\
    \ Coursework  \n  http://ocw.mit.edu/OcwWeb/  \n  Electrical-Engineering-and-Computer-Science/\
    \  \n  6-046JFall-2005/CourseHome/index.htm\n- Call for volunteer TAs\n- LATEX\
    \ is strongly recommended\n\n## Goals\n\n- Start using frameworks for describing\
    \ and analyzing algorithms.\n- Examine two algorithms for sorting: insertion sort\
    \ and merge sort.\n- See how to describe algorithms in pseudocode.\n- Begin using\
    \ asymptotic notation to express running-time analysis.\n- Learn the technique\
    \ of \"divide and conquer\" in the context of merge sort.\n\n## The sorting problem\n\
    \n**Input:** A sequence of \\( n \\) numbers \\( \\langle a_1, a_2, \\ldots, a_n\
    \ \\rangle \\).\n\n**Output:** A permutation (reordering) \\( \\langle a'_1, a'_2,\
    \ \\ldots, a'_n \\rangle \\) of the input sequence such that \\( a'_1 \\leq a'_2\
    \ \\leq \\cdots \\leq a'_n \\).\n\n## Solution\n\n**Algorithm:** a well-defined\
    \ computational procedure that takes some value, or set of values, as input and\
    \ produces some value, or set of values, as output.\n\n## Insertion sort\n\n-\
    \ A good algorithm for sorting a small number of elements.\n- It works the way\
    \ you might sort a hand of playing cards.\n\n```\nINSERTION-SORT(A)\nfor j ← 2\
    \ to length[A]\n    do key ← A[j]\n        ▹ Insert A[j] into the sorted sequence\
    \ A[1.. j − 1].\n    i ← j − 1\n    while i > 0 and A[i] > key\n        do A[i\
    \ + 1] ← A[i]\n            i ← i − 1\n    A[i + 1] ← key\n```\n\nLoop invariants\
    \ and the correctness of insertion sort\n\n## Using loop invariants is like mathematical\
    \ induction\n\n- To prove that a property holds, you prove a base case and an\
    \ inductive step.\n- Showing that the invariant holds before the first iteration\
    \ is like the base case.\n- Showing that the invariant holds from iteration to\
    \ iteration is like the inductive step.\n- The termination part differs from the\
    \ usual use of mathematical induction, in which the inductive step is used infinitely.\
    \ We stop the “induction” when the loop terminates.\n- We can show the three parts\
    \ in any order.\n\n## Example for insertion sort\n\n## The three parts for insertion\
    \ sort\n\n- Initialization: Just before the first iteration, j = 2. The subarray\
    \ A[1..j-1] is the single element A[1], which is the element originally in A[1],\
    \ and it is trivially sorted.\n- Maintenance: we note that the body of the inner\
    \ while loop works by moving A[j-1] ← A[j-2], A[j-1] ← A[j-3], and so on, by one\
    \ position to the right until the proper position for key (which has the value\
    \ that started out in A[j]) is found. At that point, the value of key is placed\
    \ into this position.\n- Termination: The outer for loop ends when j > n; this\
    \ occurs when j = n + 1. Thus, j = 1 = n. Plugging n in for j in the loop invariant,\
    \ A[1..n] consists of the elements originally in A[1..n] but in sorted order.\
    \ The entire array is sorted!\n\n## Random-access machine (RAM) model\n\n- Instructions\
    \ are executed one after another. No concurrent operations.\n- It's too tedious\
    \ to define each of the instructions and their associated time costs.\n- Instead,\
    \ we recognize that we'll use instructions commonly found in real computers.\n\
    \  - Arithmetic: add, subtract, multiply, divide, remainder, floor, ceiling; shift\
    \ left/shift right (good for multiplying/dividing by \\(2^k\\)).\n  - Data movement:\
    \ load, store, copy.\n  - Control: conditional/unconditional branch, subroutine\
    \ call and return.\n- Each of these instructions takes a constant amount of time.\n\
    \n## Running time\n\nOn a particular input, **the running time** is the number\
    \ of primitive operations (steps) executed.\n\n- Want to define steps to be machine-independent.\n\
    - Each line of pseudocode requires a constant amount of time.\n- One line may\
    \ take a different amount of time than another, but each execution of line _i_\
    \ takes the same amount of time _c<sub>i</sub>_.\n- This is assuming that the\
    \ line consists only of primitive operations.\n\nThe running time of an algorithm\
    \ is:\n\n\\(\\sum_{\\text{all statements}} \\text{(cost of statement)} \\times\
    \ \\text{(# of times statement is executed)}\\)\n"
