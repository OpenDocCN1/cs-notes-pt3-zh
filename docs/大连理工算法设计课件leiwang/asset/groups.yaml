    \ to a vertex in _A_.\n\n```\nQ ← V\nkey[v] ← ∞ for all v ∈ V\nkey[s] ← 0 for\
    \ some arbitrary s ∈ V\nwhile Q ≠ ∅\n    do u ← EXTRACT-MIN(Q)\n        for each\
    \ v ∈ Adj[u]\n            do if v ∈ Q and w(u, v) < key[v]\n                then\
    \ key[v] ← w(u, v)   ▷ DECREASE-KEY\n                    π[v] ← u\n```\n\nAt the\
    \ end, \\(\\{(v, \\pi[v])\\}\\) forms the MST.\n\n"
