  md: "\n## Example of insertion sort\n\n8 2 4 9 3 6\n\n![](img/5e59105b951890406cf98b2a964cb2f9_128_0.png)\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_129_0.png)\n\n![](img/5e59105b951890406cf98b2a964cb2f9_130_0.png)\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_132_0.png)\n\n```text\n8 2 4 9 3 6\n\
    2 8 4 9 3 6\n2 4 8 9 3 6\n2 4 8 9 3 6\n```\n\n![](img/5e59105b951890406cf98b2a964cb2f9_134_0.png)\n\
    \n```text\n8 2 4 9 3 6\n2 8 4 9 3 6\n2 4 8 9 3 6\n2 4 8 9 3 6\n2 3 4 8 9 6\n```\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_135_0.png)\n\n| 8 | 2 | 4 | 9 | 3 |\
    \ 6 |\n|---|---|---|---|---|---|\n| 2 | 8 | 4 | 9 | 3 | 6 |\n| 2 | 4 | 8 | 9 |\
    \ 3 | 6 |\n| 2 | 4 | 8 | 9 | 3 | 6 |\n| 2 | 3 | 4 | 8 | 9 | 6 |\n| 2 | 3 | 4 |\
    \ 6 | 8 | 9 |\n\ndone\n\n*September 7, 2005*  \n*Copyright © 2001-5 Erik D. Demaine\
    \ and Charles E. Leiserson*  \n*Introduction to Algorithms*  \n*L1.8*\n\n## Running\
    \ time\n\n- The running time depends on the input: an already sorted sequence\
    \ is easier to sort.\n- Parameterize the running time by the size of the input,\
    \ since short sequences are easier to sort than long ones.\n- Generally, we seek\
    \ upper bounds on the running time, because everybody likes a guarantee.\n\n##\
    \ Kinds of analyses\n\n- T(n) = maximum time of algorithm on any input of size\
    \ n.\n\n- T(n) = expected time of algorithm over all inputs of size n.\n- Need\
    \ assumption of statistical distribution of inputs.\n\n- Cheat with a slow algorithm\
    \ that works fast on some input.\n\n## Machine-independent time\n\n### What is\
    \ insertion sort’s worst-case time?\n\n- It depends on the speed of our computer:\n\
    \  - relative speed (on the same machine),\n  - absolute speed (on different machines).\n\
    \n### BIG IDEA:\n\n- Ignore machine-dependent constants.\n- Look at *growth* of\
    \ \\(T(n)\\) as \\(n \\to \\infty\\).\n\n### “Asymptotic Analysis”\n\n![](img/5e59105b951890406cf98b2a964cb2f9_140_0.png)\n\
    \n## Θ-notation\n\n**Math:** Θ(g(n)) = { f(n) : there exist positive constants\
    \ c₁, c₂, and n₀ such that 0 ≤ c₁ g(n) ≤ f(n) ≤ c₂ g(n) for all n ≥ n₀ }\n\n-\
    \ Drop low-order terms; ignore leading constants.\n- Example: 3n³ + 90n² – 5n\
    \ + 6046 = Θ(n³)\n\n## Asymptotic performance\n\nWhen _n_ gets large enough, a\
    \ Θ(_n_<sup>2</sup>) algorithm _always_ beats a Θ(_n_<sup>3</sup>) algorithm.\n\
    \n- We shouldn’t ignore asymptotically slower algorithms, however.\n- Real-world\
    \ design situations often call for a careful balancing of engineering objectives.\n\
    - Asymptotic analysis is a useful tool to help to structure our thinking.\n\n\
    ![](img/5e59105b951890406cf98b2a964cb2f9_141_0.png)\n\n## Merge sort\n\n### MERGE-SORT\
    \ \\( A[1 \\dots n] \\)\n\n- 1. If \\( n = 1 \\), done.\n- 2. Recursively sort\
    \ \\( A[1 \\dots \\lceil n/2 \\rceil] \\) and \\( A[\\lceil n/2 \\rceil+1 \\dots\
    \ n] \\).\n- 3. **“Merge”** the 2 sorted lists.\n\n### Key subroutine: MERGE\n\
    \n*September 7, 2005*  \n*Copyright © 2001-5 Erik D. Demaine and Charles E. Leiserson*\
    \  \n*Introduction to Algorithms*  \n*L1.25*\n\n## Merging two sorted arrays\n\
    \n```text\n20 12\n13 11\n7 9\n2 1\n```\n\n![](img/5e59105b951890406cf98b2a964cb2f9_145_0.png)\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_146_0.png)\n\n```text\n20 12 | 20 12\n\
    13 11 | 13 11\n7 9 | 7 9\n2 1 | 2\n1\n```\n\n*September 7, 2005 Copyright © 2001-5\
    \ Erik D. Demaine and Charles E. Leiserson Introduction to Algorithms L1.28*\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_148_0.png)\n\n![](img/5e59105b951890406cf98b2a964cb2f9_149_0.png)\n"
