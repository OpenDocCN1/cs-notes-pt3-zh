    # # How fast can we sort?


    All the sorting algorithms we have seen so far are **comparison sorts**: only
    use comparisons to determine the relative order of elements.


    +   * E.g., insertion sort, merge sort, quicksort, heapsort.


    The best worst-case running time that we’ve seen for comparison sorting is _O_(_nlg
    n_).


    # ## Is _O_(_nlg n_) the best we can do?


    **Decision trees** can help us answer this question.'
