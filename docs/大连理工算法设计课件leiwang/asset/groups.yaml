    ## Best-case analysis


    ### _(For intuition only!)_


    If we’re lucky, PARTITION splits the array evenly:


    $T(n) = 2T(n/2) + \Theta(n)$


    $=\Theta(n lg n) \qquad \text{(same as merge sort)}$


    What if the split is always $\frac{1}{10}:\frac{9}{10}$?


    $T(n) = T(\frac{1}{10}n)+T(\frac{9}{10}n)+\Theta(n)$


    What is the solution to this recurrence?


    ## Analysis of “almost-best” case


    cn log₁₀n ≤ T(n) ≤ cn log₁₀/9n + O(n)


    September 21, 2005 Copyright © 2001-5 by Erik D. Demaine and Charles E. Leiserson
    L4.32


    ## More intuition


    Suppose we alternate lucky, unlucky,

    lucky, unlucky, lucky, ....


    L(n) = 2U(n/2) + Θ(n) lucky

    U(n) = L(n − 1) + Θ(n) unlucky


    ### Solving:


    L(n) = 2(L(n/2 − 1) + Θ(n/2)) + Θ(n)

    = 2L(n/2 − 1) + Θ(n)

    = Θ(n lg n) Lucky!


    How can we make sure we are usually lucky?


    ## Randomized quicksort


    **IDEA**: Partition around a *random* element.


    - Running time is independent of the input order.

    - No assumptions need to be made about the input distribution.

    - No specific input elicits the worst-case behavior.

    - The worst case is determined only by the output of a random-number generator.


    ## Randomized quicksort analysis


    Let \( T(n) = \) the random variable for the running time of randomized quicksort
    on an input of size \( n \), assuming random numbers are independent.


    For \( k = 0, 1, \dots, n-1 \), define the **indicator random variable**


    \( X_k = \begin{cases} 1 & \text{if PARTITION generates a } k:n-k-1 \text{ split,}
    \\ 0 & \text{otherwise.} \end{cases} \)


    \( E[X_k] = \Pr \{ X_k = 1 \} = 1/n \), since all splits are equally likely, assuming
    elements are distinct.


    ## Analysis (continued)


    $$T(n)=\begin{cases} T(0)+T(n-1)+\Theta(n) & \text{if }0:n-1\text{ split},\\ T(1)+T(n-2)+\Theta(n)
    & \text{if }1:n-2\text{ split},\\ \vdots \\ T(n-1)+T(0)+\Theta(n) & \text{if }n-1:0\text{
    split}.\end{cases}$$


    $$=\sum_{k=0}^{n-1}X_k\bigl(T(k)+T(n-k-1)+\Theta(n)\bigr)$$


    ## Calculating expectation


    Take expectations of both sides.


    Linearity of expectation.


    E[T(n)] = E[\sum_{k=0}^{n-1} X_k(T(k) + T(n-k-1) + \Theta(n))]

    = \sum_{k=0}^{n-1} E[X_k(T(k) + T(n-k-1) + \Theta(n))]


