    \n## Idea of master theorem\n\n### Recursion tree:\n\nf(n) \\\\\nf(n/b) f(n/b)\
    \ ... f(n/b) \\\\\nf(n/b²) f(n/b²) ... f(n/b²) \\\\\n... \\\\\nT(1)\n\nh = log_b\
    \ n\n\n![](img/5e59105b951890406cf98b2a964cb2f9_223_0.png)\n\nf(n) \\\\\naf(n/b)\
    \ \\\\\na²f(n/b²) \\\\\n... \\\\\nn^{log_b a} T(1)\n\n## Idea of master theorem\n\
    \n### Recursion tree:\n\nf(n) f(n/b) f(n/b) ... f(n/b) f(n/b²) f(n/b²) ... f(n/b²)\
    \ ... T(1) h = log<sub>b</sub>n\n\na f(n/b) a² f(n/b²) ... n<sup>log<sub>b</sub>a</sup>\
