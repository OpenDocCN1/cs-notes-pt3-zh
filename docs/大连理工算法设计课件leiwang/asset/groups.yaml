  md: "\n\n## Three common cases\n\nCompare _f_(_n_) with _n_log_ba_ :\n\n- 1. _f_(_n_)\
    \ = _O_(_n_log_ba_ - ε) for some constant ε > 0.\n  - • _f_(_n_) grows polynomially\
    \ slower than _n_log_ba_ (by an _n_ε factor).\n  - **Solution:** _T_(_n_) = Θ(_n_log_ba_)\
    \ .\n\n- 2. _f_(_n_) = Θ(_n_log_ba_ lg_kn_) for some constant _k_ ≥ 0.\n  - •\
    \ _f_(_n_) and _n_log_ba_ grow at similar rates.\n  - **Solution:** _T_(_n_) =\
    \ Θ(_n_log_ba_ lg<sup>_k_+1</sup>_n_) .\n\n## Three common cases (cont.)\n\nCompare\
    \ $f(n)$ with $n^{\\log_b a}$:\n\n- 3. \\( f(n) = \\Omega(n^{\\log_b a + \\epsilon})\
    \ \\) for some constant \\( \\epsilon > 0 \\).\n  - * \\( f(n) \\) grows polynomially\
    \ faster than \\( n^{\\log_b a} \\) (by an \\( n^\\epsilon \\) factor),\n  - **and**\
    \ \\( f(n) \\) satisfies the **regularity condition** that\n    \\( af(n/b) \\\
    leq cf(n) \\) for some constant \\( c < 1 \\).\n  - **Solution:** \\( T(n) = \\\
    Theta(f(n)) \\) .\n\n![](img/5e59105b951890406cf98b2a964cb2f9_216_0.png)\n\n##\
    \ Examples\n\n**Ex.** \\(T(n) = 4T(n/2) + n\\)\n\\(a = 4, b = 2 \\Rightarrow n^{\\\
    log_b a} = n^2; f(n) = n\\).\n**CASE 1:** \\(f(n) = O(n^{2 - \\varepsilon})\\\
    ) for \\(\\varepsilon = 1\\).\n\\(\\therefore T(n) = \\Theta(n^2)\\).\n\n**Ex.**\
    \ \\(T(n) = 4T(n/2) + n^2\\)\n\\(a = 4, b = 2 \\Rightarrow n^{\\log_b a} = n^2;\
    \ f(n) = n^2\\).\n**CASE 2:** \\(f(n) = \\Theta(n^2 \\lg^0 n)\\), that is, \\\
    (k = 0\\).\n\\(\\therefore T(n) = \\Theta(n^2 \\lg n)\\).\n\n**Ex.** \\(T(n) =\
    \ 4T(n/2) + n^3\\)\n\\(a = 4, b = 2 \\Rightarrow n^{\\log_b a} = n^2; f(n) = n^3\\\
    ).\n**CASE 3:** \\(f(n) = \\Omega(n^{2 + \\varepsilon})\\) for \\(\\varepsilon\
    \ = 1\\)\n**and** \\(4(n/2)^3 \\le cn^3\\) (reg. cond.) for \\(c = 1/2\\).\n\\\
    (\\therefore T(n) = \\Theta(n^3)\\).\n\n**Ex.** \\( T(n) = 4T(n/2) + n^3 \\)\n\
    \\( a = 4, b = 2 \\Rightarrow n^{\\log_b a} = n^2; f(n) = n^3 \\).\n**CASE 3:**\
    \ \\( f(n) = \\Omega(n^{2 + \\varepsilon}) \\) for \\( \\varepsilon = 1 \\)\n\
    **and** \\( 4(n/2)^3 \\le c n^3 \\) (reg. cond.) for \\( c = 1/2 \\).\n\\(\\therefore\
    \ T(n) = \\Theta(n^3)\\).\n\n**Ex.** \\( T(n) = 4T(n/2) + n^2 / \\lg n \\)\n\\\
    ( a = 4, b = 2 \\Rightarrow n^{\\log_b a} = n^2; f(n) = n^2 / \\lg n \\).\nMaster\
    \ method does not apply. In particular,\nfor every constant \\( \\varepsilon >\
    \ 0 \\), we have \\( n^\\varepsilon = \\omega(\\lg n) \\).\n\n## Idea of master\
    \ theorem\n\n### Recursion tree:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_220_0.png)\n\
    \n## Idea of master theorem\n\n### Recursion tree:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_221_0.png)\n\
    \n## Idea of master theorem\n\n### Recursion tree:\n\nf(n) f(n/b) f(n/b) ... f(n/b)\
