    # Worst-case analysis


    +   - In the worst case, we hire all *n* candidates.

    +   - This happens if each one is better than all who came before. In other words,'
  - '[PAGE 22]


    # Worst-case analysis


    +   - In the worst case, we hire all n candidates.


    +   - This happens if each one is better than all who came before. In other words,
    if the candidates appear in increasing order of quality.'
  md: "\n\n## Analysis of insertion sort\n\n### Pseudocode with cost line by line\n\
    \n```\nINSERTION-SORT(A)\nfor j <- 2 to length[A]  \n    do key <- A[j]  \n  \
    \     |> Insert A[j] into the sorted  \n          sequence A[1 .. j-1].\n    i\
    \ <- j - 1\n    while i > 0 and A[i] > key\n        do A[i + 1] <- A[i]\n    \
    \        i <- i - 1\n    A[i + 1] <- key\n```\n\n| cost | times |\n|------|-------|\n\
    | c1 | n |\n| c2 | n-1 |\n| 0 | |\n| c4 | n-1 |\n| c5 | Σt=2n tj |\n| c6 | Σt=2n\
    \ (tj - 1) |\n| c7 | Σt=2n (tj - 1) |\n| c8 | n-1 |\n\n### The running time of\
    \ Insertion-Sort\n\n```\nT(n) = c1n + c2(n - 1) + c4(n - 1) + c5 Σt=2n tj\n  \
    \  + c6 Σt=2n (tj - 1) + c7 Σt=2n (tj - 1) + c8(n - 1)\n```\n\n## Analysis of\
    \ insertion sort, (cont.)\n\n### Best case:\n\n$$T(n) = c_1n + c_2(n-1) + c_4(n-1)\
    \ + c_5(n-1) + c_8(n-1)$$\n$$\\quad = (c_1+c_2+c_4+c_5+c_8)n - (c_2+c_4+c_5+c_8)$$\n\
    $$\\quad = an+b.$$\n\n### Worst case:\n\n$$T(n) = c_1n + c_2(n-1) + c_4(n-1) +\
    \ c_5\\left(\\frac{n(n+1)}{2}-1\\right)$$\n$$\\quad + c_6\\left(\\frac{n(n-1)}{2}\\\
    right) + c_7\\left(\\frac{n(n-1)}{2}\\right) + c_8(n-1)$$\n$$\\quad = an^2+bn+c.$$\n\
    \n## Worst-case and average-case analysis\n\nWe usually concentrate on finding\
    \ the worst-case running time: the longest running time for any input of size\
    \ n.\n\n- The worst-case running time gives a guaranteed upper bound on the running\
    \ time for any input.\n- For some algorithms, the worst case occurs often. For\
    \ example, when searching, the worst case often occurs when the item being searched\
    \ for is not present, and searches for absent items may be frequent.\n- Why not\
    \ analyze the average case? Because it’s often about as bad as the worst case.\n\
    \n## Divide and conquer\n\nAnother common approach.\n\n- **Divide** the problem\
    \ into a number of subproblems.\n- **Conquer** the subproblems by solving them\
    \ recursively.\n  - **Base case:** If the subproblems are small enough, just solve\
    \ them by brute force.\n- **Combine** the subproblem solutions to give a solution\
