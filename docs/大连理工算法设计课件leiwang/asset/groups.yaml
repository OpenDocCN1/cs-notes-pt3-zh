  - '[PAGE 722]


    # # Proof of claim


    d_{ij}^{(m)} = min_k \{ d_{ik}^{(m-1)} + a_{kj} \}


    ![](img/5e59105b951890406cf98b2a964cb2f9_722_0.png)


    **Relaxation!**

