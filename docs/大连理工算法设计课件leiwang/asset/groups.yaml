  - '[PAGE 45]


    # # Search Trees


    +   - Data structures that support many dynamic-set operations.

    +   - Can be used as both a dictionary and as a priority queue.

    +   - Basic operations take time proportional to the **_height_** of the tree.

    +   - For complete binary tree with _n_ nodes: worst case \(\Theta(lgn)\).

    +   - For linear chain of _n_ nodes: worst case \(\Theta(n)\).

    +   - Different types of search trees include binary search trees, red-black trees
    (covered in Chapter 13), and B-trees (covered in Chapter 18).'
  - '[PAGE 46]


    # # Binary search trees


    Binary search trees are an important data structure for dynamic sets.


    +   - Accomplish many dynamic-set operations in O(h) time, where h = height of
    tree.


    +   - Each node contains the fields.


    +     - key (and possibly other satellite data).

    +     - left: points to left child.

    +     - right: points to right child.

    +     - p: points to parent.


    +   - Stored keys must satisfy the binary-search-tree property.


    +     - If y is in left subtree of x, then key[y] ≤ key[x].

    +     - If y is in right subtree of x, then key[y] ≥ key[x].'
  - '[PAGE 47]


    # Example


    ![](img/5e59105b951890406cf98b2a964cb2f9_47_0.png)


    ![](img/5e59105b951890406cf98b2a964cb2f9_47_1.png)


    Figure 12.1 Binary search trees. For any node x, the keys in the left subtree
    of x are at most key(x). Different binary search trees can represent the same
    set of values. The worst-case running time for most tree operations is proportional
    to the height of the tree. (a) A binary search tree on 6 nodes with height 4.
    (b) A less efficient binary search tree with 6 nodes with height 2.'
  - '[PAGE 48]


    # # Inorder tree walk


    Elements are printed in monotonically increasing order. How INORDER-TREE-WALK
    works:


    +   - Check to make sure that \( x \) is not NIL.

    +   - Recursively, print the keys of the nodes in \( x \)’s left subtree.

    +   - Print \( x \)’s key.

    +   - Recursively, print the keys of the nodes in \( x \)’s right subtree.


    ![](img/5e59105b951890406cf98b2a964cb2f9_48_0.png)


    ![](img/5e59105b951890406cf98b2a964cb2f9_48_1.png)'
  - '[PAGE 49]


    # # TREE-SEARCH


    ```

    TREE-SEARCH(x, k)

    1 if x = NIL or k = key[x]

    2 then return x

    3 if k < key[x]

    4 then return TREE-SEARCH(left[x], k)

    5 else return TREE-SEARCH(right[x], k)

    ```


    **_Time:_** The algorithm recurses, visiting nodes on a downward path from the
    root. Thus, running time is _O_(_h_), where _h_ is the height of the tree.'
  - '[PAGE 50]


    # # Minimum and Maximum


    The binary-search-tree property guarantees that:


    +   - the minimum key is located at the **leftmost** node, and

    +   - the maximum key is located at the **rightmost** node.


    # ## TREE-MINIMUM


    ```

    ```

    TREE-MINIMUM(x)

    1 while left[x] ≠ NIL

    2     do x ← left[x]

    3 return x

    ```

    ```


    # ## TREE-MAXIMUM


    ```

    ```

    TREE-MAXIMUM(x)

    1 while right[x] ≠ NIL

    2     do x ← right[x]

    3 return x

    ```

    ```


    **Time:** Both procedures visit nodes that form a downward path from the root
    to a leaf. Both procedures run in \(O(h)\) time, where \(h\) is the height of
    the tree.'
  - '[PAGE 51]


    # # Successor and predecessor


    The successor of a node x is the node y such that key[y] is the smallest key >
    key[x]. (We can find x’s successor based entirely on the tree structure. No key
    comparisons are necessary.) If x has the largest key, then x’s successor is NIL.


    ```

    TREE-SUCCESSOR(x)

    1 if right[x] ≠ NIL

    2 then return TREE-MINIMUM(right[x])

    3 y ← p[x]

    4 while y ≠ NIL and x = right[y]

    5 do x ← y

    6 y ← p[y]

    7 return y

    ```


    _Time:_ Since we visit nodes on a path down the tree or up the tree, the running
    time is _O_(_h_), where _h_ is the height of the tree.'
