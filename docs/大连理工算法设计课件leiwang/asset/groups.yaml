    # # Satisfying the constraints


    **Theorem.** Suppose no negative-weight cycle exists in the constraint graph.
    Then, the constraints are satisfiable.


    *Proof.* Add a new vertex $s$ to $V$ with a 0-weight edge to each vertex $v_i
    \in V$.


