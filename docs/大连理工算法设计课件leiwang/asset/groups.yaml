    \ for illustrative purposes only. Nodes are heavily shaded if the keys corresponding\
    \ to them are not in the tree; such nodes are present only to establish a path\
    \ to other nodes.\n\n# Introduction to Algorithms\n\n# 6.046J/18.401J\n\n![](img/5e59105b951890406cf98b2a964cb2f9_119_0.png)\n\
    \n# LECTURE 1\n\n# Analysis of Algorithms\n\n+   - Insertion sort\n+   - Asymptotic\
