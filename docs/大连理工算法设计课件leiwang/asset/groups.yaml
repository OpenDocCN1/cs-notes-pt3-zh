    considering only those we have not yet interviewed).

    +   - Instead of relying on the candidates being presented to us in a random order,
    we take control of the process and enforce a random order.'
  - '[PAGE 26]


    # What makes an algorithm randomized:


    An algorithm is randomized if its behavior is determined in part by values produced
    by a random-number generator.


    +   - **Random(a, b)** returns an integer *r*, where *a* ≤ *r* ≤ *b* and each
    of the *b* − *a* + 1 possible values of *r* is equally likely.

    +   - In practice, Random is implemented by a **pseudorandom-number generator**,
    which is a deterministic method returning numbers that “look” random and pass
    statistical tests.'
  - '[PAGE 27]


    # Indicator random variables


    Given a sample space and an event $A$, we define the **indicator random variable**


    $$I\{A\}=\begin{cases}1 & \text{if } A \text{ occurs},\\0 & \text{if } A \text{
    does not occur.}\end{cases}$$


    # Lemma


    For an event $A$, let $X_A=I\{A\}$. Then $E[X_A]=\Pr\{A\}$.


    **Proof** Letting $A$ be the complement of $A$, we have


    $$E[X_A]=E[I\{A\}]$$


    $$=1\cdot\Pr\{A\}+0\cdot\Pr\{A\}\qquad\text{(definition of expected value)}$$


    $$=\Pr\{A\}.$$


    Some examples...'
  - '[PAGE 28]


    # Analysis of the hiring problem


    Assume that the candidates arrive in a random order. Let X be a random variable
    that equals the number of times we hire a new office assistant. Define indicator
    random variables X₁, X₂, ..., Xₙ, where Xᵢ = I{candidate i is hired}.




    +   • X = X₁ + X₂ + ⋯ + Xₙ.


    +   • Lemma ⇒ E[Xᵢ] = Pr(candidate i is hired).


    +   • Pr(candidate i is the best so far) = 1/i, which implies E[Xᵢ] = 1/i.


    +   • we get E[X] = E[∑_{i=1}^n X_i] = ∑_{i=1}^n E[X_i] = ∑_{i=1}^n 1/i ≈ ln n
    + O(1)

    +   ⇒ the expected hiring cost is O(c_h ln n), much better than O(c_h n).'
