    # # Bellman-Ford and linear programming


    **Corollary.** The Bellman-Ford algorithm can solve a system of _m_ difference
    constraints on _n_ variables in _O_(_mn_) time. $\blacksquare$


    Single-source shortest paths is a simple LP problem.


    In fact, Bellman-Ford maximizes \(x_1 + x_2 + \cdots + x_n\) subject to the constraints
    \(x_j - x_i \le w_{ij}\) and \(x_i \le 0\) (exercise).


    Bellman-Ford also minimizes \(\max_i\{x_i\} - \min_i\{x_i\}\) (exercise).'
