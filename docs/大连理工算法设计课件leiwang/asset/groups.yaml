  - '[PAGE 372]


    # # Operation of the sorter


    +   - An operator inserts a card into the press.

    +   - Pins on the press reach through the punched holes to make electrical contact
    with mercury-filled cups beneath the card.

    +   - Whenever a particular digit value is punched, the lid of the corresponding
    sorting bin lifts.

    +   - The operator deposits the card into the bin and closes the lid.

    +   - When all cards have been processed, the front panel is opened, and the cards
    are collected in order, yielding one pass of a stable sort.


    ![](img/5e59105b951890406cf98b2a964cb2f9_372_0.png)


    Hollerith Tabulator, Pantograph, Press, and Sorter (http://www.columbia.edu/acis/history/census-tabulator.html)'
  - '[PAGE 373]


    # # Origin of radix sort


    Hollerith’s original 1889 patent alludes to a most-significant-digit-first radix
    sort:


    > “The most complicated combinations can readily be counted with comparatively
    few counters or relays by first assorting the cards according to the first items
    entering into the combinations, then reassorting each group according to the second
    item entering into the combination, and so on, and finally counting on a few counters
    the last item of the combination for each group of cards.”


    Least-significant-digit-first radix sort seems to be a folk invention originated
    by machine operators.'
