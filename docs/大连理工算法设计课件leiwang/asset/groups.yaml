  - '[PAGE 567]


    # # Minimum spanning trees


    **Input:** A connected, undirected graph \( G = (V, E) \) with weight function
    \( w : E \rightarrow \mathbb{R} \).


    +   - For simplicity, assume that all edge weights are distinct. (CLRS covers
    the general case.)


    **Output:** A **spanning tree** \( T \) — a tree that connects all vertices —
    of minimum weight:


    \( w(T) = \sum_{(u,v) \in T} w(u,v) \).'
