  - '[PAGE 723]


    # # Proof of claim


    $d_{ij}^{(m)}=\min_k\{d_{ik}^{(m-1)}+a_{kj}\}$


    **Relaxation!**


    for $k\leftarrow 1$ to $n$


    do if $d_{ij}>d_{ik}+a_{kj}$


    then $d_{ij}\leftarrow d_{ik}+a_{kj}$


    **Note:** No negative-weight cycles implies


    $\delta(i,j)=d_{ij}^{(n-1)}=d_{ij}^{(n)}=d_{ij}^{(n+1)}=\cdots$


    ![](img/5e59105b951890406cf98b2a964cb2f9_723_0.png)'
  - '[PAGE 724]


    # # Matrix multiplication


    Compute \( C = A \cdot B \), where \( C \), \( A \), and \( B \) are \( n \times
    n \) matrices:


    \( c_{ij} = \sum_{k=1}^{n} a_{ik} b_{kj} \).


    Time = \( \Theta(n^3) \) using the standard algorithm.'
  - '[PAGE 725]


    # # Matrix multiplication


    Compute \( C = A \cdot B \), where \( C \), \( A \), and \( B \) are \( n \times
    n \) matrices:


    \( c_{ij} = \sum_{k=1}^n a_{ik} b_{kj} \).


    Time = \( \Theta(n^3) \) using the standard algorithm.


    What if we map “+” → “min” and “·” → “+”?'
  - '[PAGE 726]


    # # Matrix multiplication


    Compute \( C = A \cdot B \), where \( C \), \( A \), and \( B \) are \( n \times
    n \) matrices:


    \( c_{ij} = \sum_{k=1}^{n} a_{ik} b_{kj} \).


    Time = \( \Theta(n^3) \) using the standard algorithm.


    What if we map "+" → "min" and "·" → "+"?


    \( c_{ij} = \min_k \{ a_{ik} + b_{kj} \} \).


    Thus, \( D^{(m)} = D^{(m-1)} \, "\times" \, A \).


    Identity matrix = I = \(\begin{pmatrix} 0 & \infty & \infty & \infty \\ \infty
    & 0 & \infty & \infty \\ \infty & \infty & 0 & \infty \\ \infty & \infty & \infty
    & 0 \end{pmatrix} = D^0 = (d_{ij}^{(0)})\).'
  - '[PAGE 727]


    # # Matrix multiplication (continued)


    The (min, +) multiplication is **associative**, and with the real numbers, it
    forms an algebraic structure called a **closed semiring**.


    Consequently, we can compute


    ```

    ```

    D^(1) = D^(0) · A = A^1

    D^(2) = D^(1) · A = A^2

    ... ...

    D^(n-1) = D^(n-2) · A = A^(n-1),

    ```

    ```


    yielding \( D^{(n-1)} = (\delta(i, j)) \).


    Time = \(\Theta(n \cdot n^3) = \Theta(n^4)\). No better than \( n \times \) B-F.'
  - '[PAGE 728]


    # # Improved matrix multiplication algorithm


    **Repeated squaring:** \( A^{2k} = A^k \times A^k \).

    Compute \( A^2, A^4, \dots, A^{2^{\lceil \lg(n-1) \rceil}} \).

    \( O(\lg n) \) squarings


    **Note:** \( A^{n-1} = A^n = A^{n+1} = \dots \).

    Time = \( \Theta(n^3 \lg n) \).


    To detect negative-weight cycles, check the diagonal for negative values in \(
    O(n) \) additional time.'
  - '[PAGE 729]


    # # Floyd-Warshall algorithm


    *Also dynamic programming, but faster!*


    Define $c_{ij}^{(k)}$ = weight of a shortest path from $i$ to $j$ with intermediate
    vertices belonging to the set ${1, 2, \ldots, k}$.


    ![](img/5e59105b951890406cf98b2a964cb2f9_729_0.png)


    Thus, $\delta(i,j)=c_{ij}^{(n)}$. Also, $c_{ij}^{(0)}=a_{ij}$.'
  - '[PAGE 730]


    # # Floyd-Warshall recurrence


    \(c_{ij}^{(k)} = \min_k \{c_{ij}^{(k-1)}, c_{ik}^{(k-1)} + c_{kj}^{(k-1)}\}\)


    ![](img/5e59105b951890406cf98b2a964cb2f9_730_0.png)


    intermediate vertices in \(\{1, 2, \dots, k\}\)'
