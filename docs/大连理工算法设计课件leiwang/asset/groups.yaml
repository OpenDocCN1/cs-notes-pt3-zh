    \ | 4   |\n\n# Introduction to Algorithms\n\n6.046J/18.401J\n\n![](img/5e59105b951890406cf98b2a964cb2f9_559_0.png)\n\
    \n# LECTURE 16\n\n# Greedy Algorithms (and Graphs)\n\n+   - Graph representation\n\
    +   - Minimum spanning trees\n+   - Optimal substructure\n+   - Greedy choice\n\
    +   - Prim’s greedy MST algorithm\n\nProf. Charles E. Leiserson\n\n## Graphs (review)\n\
    \n**Definition.** A **directed graph** (**digraph**)  \n_G_ = (_V_, _E_) is an\
    \ ordered pair consisting of  \n• a set _V_ of **vertices** (singular: **vertex**),\
    \  \n• a set \\( E \\subseteq V \\times V \\) of **edges**.  \nIn an **undirected\
    \ graph** _G_ = (_V_, _E_), the edge  \nset _E_ consists of **unordered** pairs\
    \ of vertices.  \nIn either case, we have \\( |E| = O(V^2) \\). Moreover,  \n\
    if _G_ is connected, then \\( |E| \\geq |V| - 1 \\), which  \nimplies that \\\
    ( \\lg|E| = \\Theta(\\lg V) \\).\n\n(Review CLRS, Appendix B.)\n\n## Adjacency-matrix\
    \ representation\n\nThe **adjacency matrix** of a graph \\( G = (V, E) \\), where\
    \ \\( V = \\{1, 2, \\dots, n\\} \\), is the matrix \\( A[1 \\dots n, 1 \\dots\
    \ n] \\) given by\n\n\\( A[i, j] = \\begin{cases} 1 & \\text{if } (i, j) \\in\
    \ E, \\\\ 0 & \\text{if } (i, j) \\notin E. \\end{cases} \\)\n\n|   | 1 | 2 |\
    \ 3 | 4 |\n|---|---|---|---|---|\n| 1 | 0 | 1 | 1 | 0 |\n| 2 | 0 | 0 | 1 | 0 |\n\
    | 3 | 0 | 0 | 0 | 0 |\n| 4 | 0 | 0 | 1 | 0 |\n\n![](img/5e59105b951890406cf98b2a964cb2f9_562_0.png)\n\
    \n\\(\\Theta(V^2)\\) storage ⇒ **dense** representation.\n\n## Adjacency-list\
    \ representation\n\nAn **adjacency list** of a vertex \\(v \\in V\\) is the list\
    \ \\(Adj[v]\\) of vertices adjacent to \\(v\\).\n\n![](img/5e59105b951890406cf98b2a964cb2f9_563_0.png)\n\
    \n```\nAdj[1] = {2, 3}\nAdj[2] = {3}\nAdj[3] = {}\nAdj[4] = {3}\n```\n\n## Adjacency-list\
    \ representation\n\nAn **adjacency list** of a vertex \\(v \\in V\\) is the list\
    \ \\(Adj[v]\\) of vertices adjacent to \\(v\\).\n\n![](img/5e59105b951890406cf98b2a964cb2f9_564_0.png)\n\
    \n```\nAdj[1] = {2, 3}\nAdj[2] = {3}\nAdj[3] = {}\nAdj[4] = {3}\n```\n\nFor undirected\
    \ graphs, \\(|Adj[v]| = degree(v)\\).  \nFor digraphs, \\(|Adj[v]| = out-degree(v)\\\
    ).\n\n## Adjacency-list representation\n\nAn **adjacency list** of a vertex \\\
    (v \\in V\\) is the list \\(Adj[v]\\) of vertices adjacent to \\(v\\).\n\n\\(Adj[1]\
    \ = \\{2, 3\\}\\)  \n\\(Adj[2] = \\{3\\}\\)  \n\\(Adj[3] = \\{\\}\\)  \n\\(Adj[4]\
    \ = \\{3\\}\\)\n\nFor undirected graphs, \\(|Adj[v]| = degree(v)\\).  \nFor digraphs,\
    \ \\(|Adj[v]| = out-degree(v)\\).\n\n**Handshaking Lemma:** \\(\\sum_{v \\in V}\
    \ = 2|E|\\) for undirected graphs ⇒ adjacency lists use \\(\\Theta(V + E)\\) storage\
    \ — a **sparse** representation (for either type of graph).\n\n![](img/5e59105b951890406cf98b2a964cb2f9_565_0.png)\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_566_0.png)\n\n## Minimum spanning trees\n\
