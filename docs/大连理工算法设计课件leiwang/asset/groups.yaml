  md: "\n\n## Correctness — Part III\n\n**Theorem.** Dijkstra’s algorithm terminates\
    \ with $d[v] = \\delta(s, v)$ for all $v \\in V$.\n\n*Proof:* It suffices to show\
    \ that $d[v] = \\delta(s, v)$ for every $v \\in V$ when $v$ is added to $S$. Suppose\
    \ $u$ is the first vertex added to $S$ for which $d[u] > \\delta(s, u)$. Let $v$\
    \ be the first vertex in $V-S$ along a shortest path from $s$ to $u$, and let\
    \ $x$ be its predecessor:\n\n![](img/5e59105b951890406cf98b2a964cb2f9_642_0.png)\n\
    \nSince $u$ is the first vertex violating the claimed invariant, we have $d[x]\
    \ = \\delta(s, x)$. When $x$ was added to $S$, the edge $(x, y)$ was relaxed,\
    \ which implies that $d[y] = \\delta(s, y) \\le \\delta(s, u) < d[u]$. But, $d[u]\
    \ \\le d[y]$ by our choice of $u$. Contradiction.\n\n## Analysis of Dijkstra\n\
    \nwhile \\( Q \\neq \\emptyset \\)\ndo \\( u \\leftarrow \\text{EXTRACT-MIN}(Q)\
    \ \\)\n\\( S \\leftarrow S \\cup \\{u\\} \\)\nfor each \\( v \\in Adj[u] \\)\n\
    do if \\( d[v] > d[u] + w(u, v) \\)\nthen \\( d[v] \\leftarrow d[u] + w(u, v)\
    \ \\)\n\nHandshaking Lemma ⇒ Θ(E) implicit DECREASE-KEY’s.\n\nTime = \\(\\Theta(V\
    \ \\cdot T_{\\text{EXTRACT-MIN}} + E \\cdot T_{\\text{DECREASE-KEY}})\\)\n\n**Note:**\
    \ Same formula as in the analysis of Prim’s minimum spanning tree algorithm.\n\
    \nTime = \\(\\Theta(V)\\cdot T_{\\text{EXTRACT-MIN}} + \\Theta(E)\\cdot T_{\\\
    text{DECREASE-KEY}}\\)\n\n| Q | T_EXTRACT-MIN | T_DECREASE-KEY | Total |\n|---|---|---|---|\n\
    | array | O(V) | O(1) | O(V²) |\n| binary heap | \\(O(\\lg V)\\) | \\(O(\\lg V)\\\
    ) | \\(O(E \\lg V)\\) |\n| Fibonacci heap | \\(O(\\lg V)\\) amortized | \\(O(1)\\\
    ) amortized | \\(O(E + V\\lg V)\\) worst case |\n\n## Unweighted graphs\n\nSuppose\
    \ that $w(u,v)=1$ for all $(u,v)\\in E$.  \nCan Dijkstra’s algorithm be improved?\n\
    \n- Use a simple FIFO queue instead of a priority queue.\n\n![](img/5e59105b951890406cf98b2a964cb2f9_654_0.png)\n\
    \n### Breadth-first search\n\n```\nwhile Q ≠ ∅\n    do u ← DEQUEUE(Q)\n    for\
    \ each v ∈ Adj[u]\n        do if d[v] = ∞\n            then d[v] ← d[u] + 1\n\
    \                 ENQUEUE(Q, v)\n```\n\n"
