  - '[PAGE 560]


    # # Graphs (review)


    **Definition.** A **_directed graph_ (_digraph_)**

    _G_ = (_V_, _E_) is an ordered pair consisting of

    • a set _V_ of **_vertices_** (singular: **_vertex_**),

    • a set \( E \subseteq V \times V \) of **_edges_**.

    In an **_undirected graph_** _G_ = (_V_, _E_), the edge

    set _E_ consists of **_unordered_** pairs of vertices.

    In either case, we have \( |E| = O(V^2) \). Moreover,

    if _G_ is connected, then \( |E| \geq |V| - 1 \), which

    implies that \( \lg|E| = \Theta(\lg V) \).


    (Review CLRS, Appendix B.)'
  - '[PAGE 561]


    # # Adjacency-matrix representation


    The *adjacency matrix* of a graph $G=(V,E)$, where $V=\{1,2,\ldots,n\}$, is the
    matrix $A[1\ldots n,1\ldots n]$ given by


    $$A[i,j]=\begin{cases}1 & \text{if }(i,j)\in E,\\0 & \text{if }(i,j)\notin E.\end{cases}$$'
  - '[PAGE 562]


    # # Adjacency-matrix representation


    The **adjacency matrix** of a graph \( G = (V, E) \), where \( V = \{1, 2, \dots,
    n\} \), is the matrix \( A[1 \dots n, 1 \dots n] \) given by


    \( A[i, j] = \begin{cases} 1 & \text{if } (i, j) \in E, \\ 0 & \text{if } (i,
    j) \notin E. \end{cases} \)


    |   | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|

    | 1 | 0 | 1 | 1 | 0 |

    | 2 | 0 | 0 | 1 | 0 |

    | 3 | 0 | 0 | 0 | 0 |

    | 4 | 0 | 0 | 1 | 0 |


    ![](img/5e59105b951890406cf98b2a964cb2f9_562_0.png)


    \(\Theta(V^2)\) storage \(\Rightarrow\) **dense** representation.'
