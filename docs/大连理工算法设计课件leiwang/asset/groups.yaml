    ## Merging two sorted arrays


    Time = Θ(n) to merge a total of n elements (linear time).


    ## Analyzing merge sort


    **Abuse**


    # MERGE-SORT $A[1..n]$


    +   1. If $n=1$, done.

    +   2. Recursively sort $A[1..\lfloor n/2\rfloor]$ and $A[\lfloor n/2\rfloor+1..n]$.

    +   3. “Merge” the 2 sorted lists


    **Sloppiness:** Should be $T(\lceil n/2\rceil)+T(\lfloor n/2\rfloor)$, but it
    turns out not to matter asymptotically.


    ## Recurrence for merge sort


    \(T(n) = \begin{cases} \Theta(1) \text{ if } n = 1; \\ 2T(n/2) + \Theta(n) \text{
    if } n > 1. \end{cases}\)


    - We shall usually omit stating the base case when \(T(n) = \Theta(1)\) for sufficiently
    small \(n\), but only when it has no effect on the asymptotic solution to the
    recurrence.

    - CLRS and Lecture 2 provide several ways to find a good upper bound on \(T(n)\).


    ## Recursion tree


    Solve \( T(n) = 2T(n/2) + cn \), where \( c > 0 \) is constant.


    ## Conclusions


    - \(\Theta(n \lg n)\) grows more slowly than \(\Theta(n^2)\).

    - Therefore, merge sort asymptotically beats insertion sort in the worst case.

    - In practice, merge sort beats insertion sort for \(n > 30\) or so.

    - Go test it out for yourself!


