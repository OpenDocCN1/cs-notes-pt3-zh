    \n# Course information\n\n+   1. Staff\n+   2. Distance learning\n+   3. Prerequisites\n\
    +   4. Lectures\n+   5. Recitations\n+   6. Handouts\n+   7. Textbook\n\n+   8.\
    \ Course website\n+   9. Extra help\n+   10. Registration\n+   11. Problem sets\n\
    +   12. Describing algorithms\n+   13. Grading policy\n+   14. Collaboration policy\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_121_0.png)\n\n# Analysis of algorithms\n\
    \n*The theoretical study of computer-program performance and resource usage.*\n\
    \nWhat’s more important than performance?\n\n+   - modularity\n+   - correctness\n\
    +   - maintainability\n+   - functionality\n+   - robustness\n\n+   - user-friendliness\n\
    +   - programmer time\n+   - simplicity\n+   - extensibility\n+   - reliability\n\
    \n![](img/5e59105b951890406cf98b2a964cb2f9_122_0.png)\n\n# Why study algorithms\
    \ and performance?\n\n+   - Algorithms help us to understand *scalability*.\n\
    +   - Performance often draws the line between what is feasible and what is impossible.\n\
    +   - Algorithmic mathematics provides a *language* for talking about program\
    \ behavior.\n+   - Performance is the *currency* of computing.\n+   - The lessons\
    \ of program performance generalize to other computing resources.\n+   - Speed\
    \ is fun!\n\n# Insertion sort\n\n```\nINSERTION-SORT (A, n) ▷ A[1 . . n]\nfor\
    \ j ← 2 to n\n    do key ← A[j]\n    i ← j − 1\n    while i > 0 and A[i] > key\n\
    \        do A[i+1] ← A[i]\n        i ← i − 1\n    A[i+1] = key\n```\n\n# Insertion\
    \ sort\n\n```\nINSERTION-SORT(A, n) ▷ A[1 . . n]\nfor j ← 2 to n\n    do key ←\
    \ A[j]\n    i ← j − 1\n    while i > 0 and A[i] > key\n        do A[i+1] ← A[i]\n\
    \        i ← i − 1\n    A[i+1] = key\n```\n\n![](img/5e59105b951890406cf98b2a964cb2f9_125_0.png)\n\
    \n"
  mdcn: "\n\n## ITERATIVE-TREE-SEARCH(x, k)\n\n```\nwhile x ≠ NIL and k ≠ key[x]\n\
    \   do if k < key[x]\n      then x ← left[x]\n      else x ← right[x]\nreturn\
    \ x\n```\n\n## TREE-MINIMUM(x)\n\n```\nwhile left[x] ≠ NIL\n   do x ← left[x]\n\
    return x\n```\n\n## TREE-MAXIMUM(x)\n\n```\n1 while right[x] ≠ NIL\n2 do x ← right[x]\n\
    3 return x\n```\n\n## TREE-SUCCESSOR(x)\n\n```\nif right[x] ≠ NIL\nthen return\
    \ TREE-MINIMUM(right[x])\ny ← p[x]\nwhile y ≠ NIL and x = right[y]\ndo x ← y\n\
    y ← p[y]\nreturn y\n```\n\n```\nTREE-INSERT(T, z)\n1  y ← NIL\n2  x ← root[T]\n\
    3  while x ≠ NIL\n4      do y ← x\n5         if key[z] < key[x]\n6           \
