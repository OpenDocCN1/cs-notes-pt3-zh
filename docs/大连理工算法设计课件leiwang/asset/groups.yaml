  - '[PAGE 574]


    # # Optimal substructure


    MST \( T \):


    (Other edges of \( G \)

    are not shown.)


    Remove any edge \( (u, v) \in T \). Then, \( T \) is partitioned

    into two subtrees \( T_1 \) and \( T_2 \).


    **Theorem.** The subtree \( T_1 \) is an MST of \( G_1 = (V_1, E_1) \),

    the subgraph of \( G \) **induced** by the vertices of \( T_1 \):


    \( V_1 = \text{vertices of } T_1 \),

    \( E_1 = \{ (x, y) \in E : x, y \in V_1 \} \).


    Similarly for \( T_2 \).


    ![](img/5e59105b951890406cf98b2a964cb2f9_574_0.png)'
  - '[PAGE 575]


    <!-- no content -->'
  - '[PAGE 576]


    # # Proof of optimal substructure


    Proof. Cut and paste:


    \( w(T) = w(u, v) + w(T_1) + w(T_2). \)


    If \( T_1'' \) were a lower-weight spanning tree than \( T_1 \) for \( G_1 \),
    then \( T'' = \{(u, v)\} \cup T_1'' \cup T_2 \) would be a lower-weight spanning
    tree than \( T \) for \( G \). \(\blacksquare\)


    Do we also have overlapping subproblems?


    +   - Yes.'
  - '[PAGE 577]


    # # Proof of optimal substructure


    Proof. Cut and paste:


    \(w(T) = w(u, v) + w(T_1) + w(T_2)\).


    If \(T_1''\) were a lower-weight spanning tree than \(T_1\) for \(G_1\), then
    \(T'' = \{(u, v)\} \cup T_1'' \cup T_2\) would be a lower-weight spanning tree
    than \(T\) for \(G\).


    Do we also have overlapping subproblems?


    • Yes.


    Great, then dynamic programming may work!


    • Yes, but MST exhibits another powerful property which leads to an even more
    efficient algorithm.'
  - '[PAGE 578]


    # # Hallmark for “greedy” algorithms


