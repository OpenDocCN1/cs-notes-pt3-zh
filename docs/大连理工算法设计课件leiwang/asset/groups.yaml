  - "[PAGE 622]\n\n![](img/5e59105b951890406cf98b2a964cb2f9_622_0.png)\n\n# # Single-source\
    \ shortest paths\n\nFrom a given source vertex $s \\in V$, find the shortest-path\
    \ weights $\\delta(s, v)$ for all $v \\in V$. If all edge weights $w(u, v)$ are\
    \ nonnegative, all shortest-path weights must exist.\n\n\n\n+   1. Maintain a\
    \ set $S$ of vertices whose shortest-path distances from $s$ are known.\n+   \n\
    +   2. At each step add to $S$ the vertex $v \\in V - S$ whose distance estimate\
    \ from $s$ is minimal.\n+   \n+   3. Update the distance estimates of vertices\
    \ adjacent to $v$."
