  - "[PAGE 584]\n\n# # Prim's algorithm\n\n**IDEA:** Maintain _V_ − _A_ as a priority\
    \ queue _Q_. Key each vertex in _Q_ with the weight of the least-weight edge connecting\
    \ it to a vertex in _A_.\n\n```\n```\nQ ← V\nkey[v] ← ∞ for all v ∈ V\nkey[s]\
    \ ← 0 for some arbitrary s ∈ V\nwhile Q ≠ ∅\n    do u ← EXTRACT-MIN(Q)\n     \
    \   for each v ∈ Adj[u]\n            do if v ∈ Q and w(u, v) < key[v]\n      \
    \          then key[v] ← w(u, v)   ▷ DECREASE-KEY\n                    π[v] ←\
    \ u\n```\n```\n\nAt the end, \\(\\{(v, \\pi[v])\\}\\) forms the MST."
