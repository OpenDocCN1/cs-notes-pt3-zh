    $$\\quad = an+b.$$\n\n### Worst case:\n\n$$T(n) = c_1n + c_2(n-1) + c_4(n-1) +\
    \ c_5\\left(\\frac{n(n+1)}{2}-1\\right)$$\n$$\\quad + c_6\\left(\\frac{n(n-1)}{2}\\\
    right) + c_7\\left(\\frac{n(n-1)}{2}\\right) + c_8(n-1)$$\n$$\\quad = an^2+bn+c.$$\n\
    \n## Worst-case and average-case analysis\n\nWe usually concentrate on finding\
    \ the worst-case running time: the longest running time for any input of size\
    \ n.\n\n- The worst-case running time gives a guaranteed upper bound on the running\
    \ time for any input.\n- For some algorithms, the worst case occurs often. For\
    \ example, when searching, the worst case often occurs when the item being searched\
    \ for is not present, and searches for absent items may be frequent.\n- Why not\
    \ analyze the average case? Because it’s often about as bad as the worst case.\n\
    \n## Divide and conquer\n\nAnother common approach.\n\n- **Divide** the problem\
    \ into a number of subproblems.\n- **Conquer** the subproblems by solving them\
    \ recursively.\n  - **Base case:** If the subproblems are small enough, just solve\
    \ them by brute force.\n- **Combine** the subproblem solutions to give a solution\
    \ to the original problem.\n\n## Design and Analysis of Algorithms\n\n## Lecture\
    \ 3—Randomized Algorithms\n\n## Lei Wang\n\nDalian University of Technology\n\n\
    October 7, 2008\n\n## Goals\n\n- Explain the difference between probabilistic\
    \ analysis and randomized algorithms,\n- present the technique of indicator random\
    \ variables, and\n- give another example of the analysis of a randomized algorithm\n\
    \  (permuting an array in place).\n\n## The hiring problem\n\n### Scenario:\n\n\
    - You are using an employment agency to hire a new office assistant.\n\n- The\
    \ agency sends you one candidate each day.\n\n- You interview the candidate and\
    \ must immediately decide whether or not to hire that person. But if you hire,\
    \ you must also fire your current office assistant even if it’s someone you have\
    \ recently hired.\n\n- Cost to interview is $c_i$ per candidate (interview fee\
    \ paid to agency).\n\n- Cost to hire is $c_h$ per candidate (includes cost to\
    \ fire current office assistant + hiring fee paid to agency).\n\n- You are committed\
    \ to having hired, at all times, the best candidate seen so far.\n\n## The hiring\
    \ problem (cont.)\n\nDetermine what the price of this strategy will be.\n\nPseudocode\
    \ to model this scenario: Assumes that the candidates are numbered 1 to n and\
    \ after interviewing each candidate, we can determine if it’s better than the\
    \ current office assistant.\n\n```\nHIRE-ASSISTANT(n)\n1 best ← 0 ▷ candidate\
    \ 0 is a least-qualified dummy candidate\n2 for i ← 1 to n\n3 do interview candidate\
    \ i\n4 if candidate i is better than candidate best\n5 then best ← i\n6 hire candidate\
    \ i\n```\n\n## Worst-case analysis\n\n- In the worst case, we hire all *n* candidates.\n\
    - This happens if each one is better than all who came before. In other words,\
    \ if the candidates appear in increasing order of quality.\n\n"
