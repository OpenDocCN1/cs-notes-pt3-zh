  - '[PAGE 35]


    # # Maintaining the heap property


    MAX-HEAPIFY is important for manipulating max-heaps—to maintain the max-heap property.


    +   - Before MAX-HEAPIFY, \( A[i] \) may be smaller than its children.

    +   - Assume left and right subtrees of \( i \) are max-heaps.

    +   - After MAX-HEAPIFY, subtree rooted at \( i \) is a max-heap.


    # ## MAX-HEAPIFY


    ```

    ```

    MAX-HEAPIFY(A, i)

    1  l ← LEFT(i)

    2  r ← RIGHT(i)

    3  if l ≤ heap-size[A] and A[l] > A[i]

    4      then largest ← l

    5      else largest ← i

    6  if r ≤ heap-size[A] and A[r] > A[largest]

    7      then largest ← r

    8  if largest ≠ i

    9      then exchange A[i] ↔ A[largest]

    10         MAX-HEAPIFY(A, largest)

    ```

    ```


    # ## The way MAX-HEAPIFY works


    +   - Compare \( A[i] \), \( A[\text{LEFT}(i)] \), and \( A[\text{RIGHT}(i)] \).

    +   - If necessary, swap \( A[i] \) with the larger of the two children to preserve
    heap property.

    +   - Continue until subtree rooted at \( i \) is max-heap.'
  - '[PAGE 36]


    ![](img/5e59105b951890406cf98b2a964cb2f9_36_0.png)


    Figure 6.2: The action of MAX-HEAPIFY(A, 2), where A.heap-size[A] = 10. (a) The
    initial configuration, with A[2] = 6 at node i = 2 violating the max-heap property
    since it is not larger than both children. The max-heap property is restored for
    node 2 in (b) by exchanging A[2] with A[4], which destroys the max-heap property
    for node 4. The recursive call MAX-HEAPIFY(A, 4) now has i = 4. After swapping
    A[4] with A[9], as shown in (c), node 4 is fixed up, and the recursive call MAX-HEAPIFY(A,
    9) yields no further changes to the data structure.'
