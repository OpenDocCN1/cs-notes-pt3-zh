  - '[PAGE 487]


    # # How large should a hash table be?


    **Goal:** Make the table as small as possible, but large enough so that it won’t
    overflow (or otherwise become inefficient).


    **Problem:** What if we don’t know the proper size in advance?


    **Solution:** _Dynamic tables._


    **IDEA:** Whenever the table overflows, “grow” it by allocating (via **malloc**
    or **new**) a new, larger table. Move all items from the old table into the new
    one, and free the storage for the old table.'
