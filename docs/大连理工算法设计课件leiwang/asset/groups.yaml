    \ showing parent-child relationships; parents are always to the left of their\
    \ children. The tree has height three: the node at index 4 (with value 8) has\
    \ height one.\n\n## Maintaining the heap property\n\nMAX-HEAPIFY is important\
    \ for manipulating max-heaps—to maintain the max-heap property.\n\n- Before MAX-HEAPIFY,\
    \ \\( A[i] \\) may be smaller than its children.\n- Assume left and right subtrees\
    \ of \\( i \\) are max-heaps.\n- After MAX-HEAPIFY, subtree rooted at \\( i \\\
    ) is a max-heap.\n\n## MAX-HEAPIFY\n\n```\nMAX-HEAPIFY(A, i)\n1 l ← LEFT(i)\n\
    2 r ← RIGHT(i)\n3 if l ≤ heap-size[A] and A[l] > A[i]\n4     then largest ← l\n\
    5     else largest ← i\n6 if r ≤ heap-size[A] and A[r] > A[largest]\n7     then\
    \ largest ← r\n8 if largest ≠ i\n9     then exchange A[i] ↔ A[largest]\n10   \
    \     MAX-HEAPIFY(A, largest)\n```\n\n## The way MAX-HEAPIFY works\n\n- Compare\
    \ \\( A[i] \\), \\( A[\\text{LEFT}(i)] \\), and \\( A[\\text{RIGHT}(i)] \\).\n\
    - If necessary, swap \\( A[i] \\) with the larger of the two children to preserve\
    \ heap property.\n- Continue until subtree rooted at \\( i \\) is max-heap.\n\n\
    ![](img/5e59105b951890406cf98b2a964cb2f9_36_0.png)\n\nFigure 6.2: The action of\
    \ MAX-HEAPIFY(A, 2), where A.heap-size[A] = 10. (a) The initial configuration,\
    \ with A[2] = 6 at node i = 2 violating the max-heap property since it is not\
    \ larger than both children. The max-heap property is restored for node 2 in (b)\
    \ by exchanging A[2] with A[4], which destroys the max-heap property for node\
    \ 4. The recursive call MAX-HEAPIFY(A, 4) now has i = 4. After swapping A[4] with\
    \ A[9], as shown in (c), node 4 is fixed up, and the recursive call MAX-HEAPIFY(A,\
    \ 9) yields no further changes to the data structure.\n\n## Building a heap\n\n\
    ## BUILD-MAX-HEAP\n\n```\nBUILD-MAX-HEAP(A)\n1 heap-size[A] ← length[A]\n2 for\
    \ i ← ⌊length[A]/2⌋ downto 1\n3     do MAX-HEAPIFY(A, i)\n```\n\n**Simple bound:**\
    \ _O_(_n_) calls to MAX-HEAPIFY, each of which takes _O_(lgn) time → _O_(_n_lgn).\n\
    \n## Overview Heaps\nThe Big Picture: Heaps\nHeap Implementation of Priority Queue\n\
    \n## Heap data structure: Building a heap\n\n![](img/5e59105b951890406cf98b2a964cb2f9_38_0.png)\n\
    \n## The Heapsort Algorithm\n\n- Builds a max-heap from the array.\n- Starting\
    \ with the root, the algorithm places the maximum element into the correct place\
    \ in the array by swapping it with the last array element.\n- “Discard” this last\
    \ node by decreasing the heap size, and calling MAX-HEAPIFY on the new (possibly\
    \ incorrectly-placed) root.\n- Repeat this discarding process until only one node\
    \ remains.\n\n```\nHEAPSORT(A)\n1 BUILD-MAX-HEAP(A)\n2 for i ← length[A] downto\
    \ 2\n3 do exchange A[1] ↔ A[i]\n4 heap-size[A] ← heap-size[A] - 1\n5 MAX-HEAPIFY(A,\
    \ 1)\n```\n\n- BUILD-MAX-HEAP: O(n)\n- for loop: n - 1 times\n- exchange elements:\
    \ O(1)\n- MAX-HEAPIFY: O(log n)\n\nTotal time: O(n log n)\n\n## The Heapsort Algorithm\n\
    Heap Implementation of Priority Queue\n\n![](img/5e59105b951890406cf98b2a964cb2f9_40_0.png)\n\
    \nFigure 6-4 The operation of HEAPSORT. (a) The max-heap data structure just after\
    \ it has been built by BUILD-MAX-HEAP. (b) The max-heap after one call of MAX-HEAPIFY\
    \ and line 5. The value 16 that was at the root is now at position A[3]. (c) The\
    \ resulting max-heap after line 5.\n\n## Priority queue\n\n- Maintains a dynamic\
    \ set $S$ of elements.\n- Each set element has a key—an associated value.\n- Max-priority\
    \ queue supports dynamic-set operations:\n  - $\\operatorname{INSERT}(S,x)$: inserts\
    \ element $x$ into set $S$.\n  - $\\operatorname{MAXIMUM}(S)$: returns element\
    \ of $S$ with largest key.\n  - $\\operatorname{EXTRACT\\mbox{-}MAX}(S)$: removes\
    \ and returns element of $S$ with largest key.\n  - $\\operatorname{INCREASE\\\
    mbox{-}KEY}(S,x,k)$: increases value of element $x$'s key to $k$. Assume $k \\\
    geq x$'s current key value.\n  - Example max-priority queue application: **schedule\
    \ jobs on shared computer.**\n\n"
