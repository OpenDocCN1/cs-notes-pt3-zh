    # Correctness — Part I


    **Lemma.** Initializing $d[s] \leftarrow 0$ and $d[v] \leftarrow \infty$ for all
    $v \in V - \{s\}$ establishes $d[v] \geq \delta(s,v)$ for all $v \in V$, and this
    invariant is maintained over any sequence of relaxation steps.


    # Correctness — Part I


    **Lemma.** Initializing \(d[s] \leftarrow 0\) and \(d[v] \leftarrow \infty\) for
    all \(v \in V - \{s\}\) establishes \(d[v] \geq \delta(s, v)\) for all \(v \in
    V\), and this invariant is maintained over any sequence of relaxation steps.


    **Proof.** Suppose not. Let \(v\) be the first vertex for which \(d[v] < \delta(s,
    v)\), and let \(u\) be the vertex that caused \(d[v]\) to change: \(d[v] = d[u]
    + w(u, v)\). Then,


    ```

    \(\begin{aligned}

    d[v] &< \delta(s, v) \quad \text{supposition} \\

    \leq \delta(s, u) + \delta(u, v) &\quad \text{triangle inequality} \\

    \leq \delta(s,u) + w(u, v) &\quad \text{sh. path} \leq \text{specific path} \\

    \leq d[u] + w(u, v) &\quad v \text{is first violation}

    \end{aligned}\)

    ```


    **Contradiction.** \(\blacksquare\)


    # Correctness — Part II


    **Lemma.** Let _u_ be _v_’s predecessor on a shortest path from _s_ to _v_. Then,
    if _d_[_u_] = δ(_s_, _u_) and edge (_u_, _v_) is relaxed, we have _d_[_v_] = δ(_s_,
    _v_) after the relaxation.


