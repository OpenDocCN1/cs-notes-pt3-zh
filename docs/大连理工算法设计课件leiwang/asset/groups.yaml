  - '[PAGE 381]


    # # Analysis of expected time


    The analysis follows that of randomized

    quicksort, but it’s a little different.


    Let _T_(_n_) = the random variable for the running

    time of RAND-SELECT on an input of size _n_,

    assuming random numbers are independent.


    For _k_ = 0, 1, ..., _n_-1, define the **indicator**

    **random variable**


    \(X_k = \left\{ \begin{array}{ c c }

    1 & \text{if PARTITION generates a } k : n-k-1 \text{ split,} \\

    0 & \text{otherwise.}

    \end{array}\right.\)'
  - '[PAGE 382]


    # # Analysis (continued)


    To obtain an upper bound, assume that the \(i\)th

    element always falls in the larger side of the

    partition:


    \(T(n) = \left\{\begin{array}{ c c }

    T(\max \{0, n-1\}) + \Theta(n) & \text{if } 0:n-1 \text{ split,} \\

    T(\max \{1, n-2\}) + \Theta(n) & \text{if } 1:n-2 \text{ split,} \\

    \vdots & \\

    T(\max \{n-1, 0\}) + \Theta(n) & \text{if } n-1:0 \text{ split,}

    \end{array}\right.\)


    \(=\sum_{k=0}^{n-1} X_k \left(T(\max \{k, n-k-1\}) + \Theta(n)\right).\)


