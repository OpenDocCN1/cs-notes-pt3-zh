  - '[PAGE 284]


    # # Divide and conquer


    Quicksort an \(n\)-element array:


    +   1. **Divide**: Partition the array into two subarrays around a **pivot** \(x\)
    such that elements in lower subarray \(\le x \le\) elements in upper subarray.


    ![](img/5e59105b951890406cf98b2a964cb2f9_284_0.png)


    +   2. **Conquer**: Recursively sort the two subarrays.


    +   3. **Combine**: Trivial.


    **Key**: Linear-time partitioning subroutine.'
  - '[PAGE 285]


    # # Partitioning subroutine


    PARTITION(A, p, q) ▷ A[p .. q]

    x ← A[p] ▷ pivot = A[p]

    i ← p

    for j ← p + 1 to q

    do if A[j] ≤ x

    then i ← i + 1

    exchange A[i] ↔ A[j]

    exchange A[p] ↔ A[i]

    return i


    > Running time

    > = O(n) for n

    > elements.


