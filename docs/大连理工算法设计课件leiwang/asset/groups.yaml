    # Herman Hollerith (1860-1929)


    +   - The 1880 U.S. Census took almost 10 years to process.

    +   - While a lecturer at MIT, Hollerith prototyped punched-card technology.

    +   - His machines, including a “card sorter,” allowed the 1890 census total to
    be reported in 6 weeks.

    +   - He founded the Tabulating Machine Company in 1911, which merged with other
    companies in 1924 to form International Business Machines.'
