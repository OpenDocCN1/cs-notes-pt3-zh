- pgno: 416
  md: '# # Choosing a hash function


    The assumption of simple uniform hashing is hard to guarantee, but several common
    techniques tend to work well in practice as long as their deficiencies can be
    avoided.


    # ## Desirata:


    +   - A good hash function should distribute the keys uniformly into the slots
    of the table.

    +   - Regularity in the key distribution should not affect this uniformity.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# # Division method


    Assume all keys are integers, and define

    \(h(k) = k \bmod m\).


    **Deficiency:** Don’t pick an \(m\) that has a small

    divisor \(d\). A preponderance of keys that are

    congruent modulo \(d\) can adversely affect

    uniformity.


    **Extreme deficiency:** If \(m = 2^r\), then the hash

    doesn’t even depend on all the bits of \(k\):


    • If \(k = 1011000111\underline{011010}_2\) and \(r = 6\), then

    \(h(k) = 011010_2\).

    \(h(k)\)'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# # Division method (continued)


    h(k) = k mod m.


    Pick m to be a prime not too close to a power of 2 or 10 and not otherwise used
    prominently in the computing environment.


    # ## Annoyance:


    +   • Sometimes, making the table size a prime is inconvenient.


    But, this method is popular, although the next method we’ll see is usually superior.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# # Multiplication method


    Assume that all keys are integers, \( m = 2^r \), and our computer has \( w \)-bit
    words. Define


    \( h(k) = (A \cdot k \bmod 2^w) \text{ rsh } (w - r) \),


    where rsh is the “bitwise right-shift” operator and \( A \) is an odd integer
    in the range \( 2^{w-1} < A < 2^w \).


    +   - Don’t pick \( A \) too close to \( 2^{w-1} \) or \( 2^w \).

    +   - Multiplication modulo \( 2^w \) is fast compared to division.

    +   - The rsh operator is fast.'
  merge: -1
  img_proc: true
