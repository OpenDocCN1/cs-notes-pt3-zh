- pgno: 426
  md: '# # Probing strategies




    Given an ordinary hash function h''(k), linear probing uses the hash function


    ```

    h(k,i) = (h''(k) + i) mod m.

    ```


    This method, though simple, suffers from primary clustering, where long runs of
    occupied slots build up, increasing the average search time. Moreover, the long
    runs of occupied slots tend to get longer.'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# # Probing strategies


    # ## Double hashing


    Given two ordinary hash functions \( h_1(k) \) and \( h_2(k) \), double hashing
    uses the hash function


    \( h(k,i) = (h_1(k) + i \cdot h_2(k)) \bmod m \).


    This method generally produces excellent results, but \( h_2(k) \) must be relatively
    prime to \( m \). One way is to make \( m \) a power of 2 and design \( h_2(k)
    \) to produce only odd numbers.


    ![](img/5e59105b951890406cf98b2a964cb2f9_427_0.png)'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# # Analysis of open addressing


    We make the assumption of **_uniform hashing:_**


    +   • Each key is equally likely to have any one of the \( m! \) permutations
    as its probe sequence.


    **Theorem.** Given an open-addressed hash table with load factor \( \alpha = n/m
    < 1 \), the expected number of probes in an unsuccessful search is at most \(
    1/(1-\alpha) \).'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# # Proof of the theorem


    # ## Proof.


    +   - At least one probe is always necessary.


    +   - With probability _n/m_, the first probe hits an occupied slot, and a second
    probe is necessary.


    +   - With probability (_n_-1)/(_m_-1), the second probe hits an occupied slot,
    and a third probe is necessary.


    +   - With probability (_n_-2)/(_m_-2), the third probe hits an occupied slot,
    etc.


    Observe that \(\frac{n-i}{m-i}<\frac{n}{m}=\alpha\) for _i_=1,2,...,n.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# # Proof (continued)


    Therefore, the expected number of probes is


    \(1+\frac{n}{m}\left(1+\frac{n-1}{m-1}\left(1+\frac{n-2}{m-2}\left(\cdots\left(1+\frac{1}{m-n+1}\right)\cdots\right)\right)\right)\)


    \(\le 1+\alpha(1+\alpha(1+\alpha(\cdots(1+\alpha)\cdots)))\)


    \(\le 1+\alpha+\alpha^2+\alpha^3+\cdots\)


    \(=\sum_{i=0}^\infty \alpha^i\)


    \(=\frac{1}{1-\alpha}.\)


    > The textbook has a more rigorous proof and an analysis of successful searches.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# # Implications of the theorem


    +   - If α is constant, then accessing an open-addressed hash table takes constant
    time.

    +   - If the table is half full, then the expected number of probes is 1/(1−0.5)
    = 2.

    +   - If the table is 90% full, then the expected number of probes is 1/(1−0.9)
    = 10.'
  merge: -1
  img_proc: true
