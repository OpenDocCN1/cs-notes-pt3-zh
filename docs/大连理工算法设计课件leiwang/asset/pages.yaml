- pgno: 474
  md: '# # New operations


    # ## 4. Develop new dynamic-set operations that use the information.


    INTERVAL-SEARCH(i)

    x ← root

    while x ≠ NIL and (low[i] > high[int[x]]

    or low[int[x]] > high[i])

    do ▷ i and int[x] don’t overlap

    if left[x] ≠ NIL and low[i] ≤ m[left[x]]

    then x ← left[x]

    else x ← right[x]

    return x'
