    \( T[k] = \begin{cases} x & \text{if } x \in K \text{ and } key[x] = k, \\ \text{NIL}
    & \text{otherwise.} \end{cases} \)


    Then, operations take \( \Theta(1) \) time.


    **Problem:** The range of keys can be large:

