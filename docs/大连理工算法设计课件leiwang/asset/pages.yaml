- pgno: 736
  md: '# # Shortest paths in reweighted graphs


    **Corollary.** \(\delta_h(u, v) = \delta(u, v) + h(u) - h(v)\).


    **IDEA:** Find a function \(h : V \rightarrow \mathbb{R}\) such that \(w_h(u,
    v) \ge 0\) for all \((u, v) \in E\). Then, run Dijkstra''s algorithm from each
    vertex on the reweighted graph.


    **NOTE:** \(w_h(u, v) \ge 0\) iff \(h(v) - h(u) \le w(u, v)\).'
  merge: -1
  img_proc: true
- pgno: 737
  md: '# # Johnson''s algorithm


    +   1. Find a function \( h : V \rightarrow \mathbb{R} \) such that \( w_h(u,
    v) \geq 0 \) for all \( (u, v) \in E \) by using Bellman-Ford to solve the difference
    constraints \( h(v) - h(u) \leq w(u, v) \), or determine that a negative-weight
    cycle exists.

    +      • Time = \( O(VE) \).


    +   2. Run Dijkstra''s algorithm using \( w_h \) from each vertex \( u \in V \)
    to compute \( \delta_h(u, v) \) for all \( v \in V \).

    +      • Time = \( O(VE + V^2 \lg V) \).


    +   3. For each \( (u, v) \in V \times V \), compute

    +      \( \delta(u, v) = \delta_h(u, v) - h(u) + h(v) \).

    +      • Time = \( O(V^2) \).


    **Total time** = \( O(VE + V^2 \lg V) \).'
  merge: -1
  img_proc: true
