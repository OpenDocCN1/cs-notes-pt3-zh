- pgno: 560
  md: '# # Graphs (review)


    **Definition.** A **_directed graph_ (_digraph_)**

    _G_ = (_V_, _E_) is an ordered pair consisting of

    • a set _V_ of **_vertices_** (singular: **_vertex_**),

    • a set \( E \subseteq V \times V \) of **_edges_**.

    In an **_undirected graph_** _G_ = (_V_, _E_), the edge

    set _E_ consists of **_unordered_** pairs of vertices.

    In either case, we have \( |E| = O(V^2) \). Moreover,

    if _G_ is connected, then \( |E| \geq |V| - 1 \), which

    implies that \( \lg|E| = \Theta(\lg V) \).


    (Review CLRS, Appendix B.)'
  merge: -1
  img_proc: true
