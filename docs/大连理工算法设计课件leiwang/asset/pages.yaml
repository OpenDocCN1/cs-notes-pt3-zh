  md: '# Transitive closure of a directed graph


    Compute $t_{ij} = \begin{cases} 1 & \text{if there exists a path from } i \text{
    to } j, \\ 0 & \text{otherwise.} \end{cases}$


    **IDEA:** Use Floyd-Warshall, but with $(\lor, \land)$ instead of $(\min, +)$:


    $t_{ij}^{(k)} = t_{ij}^{(k-1)} \lor \left(t_{ik}^{(k-1)} \land t_{kj}^{(k-1)}\right).$


    Time = $\Theta(n^3)$.'
