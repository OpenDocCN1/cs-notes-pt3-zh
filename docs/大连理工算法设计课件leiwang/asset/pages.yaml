  md: '# Solving a system of difference constraints


    Linear programming where each row of $A$ contains exactly one $1$, one $-1$, and
    the rest $0$''s.


    # Example:


    $$\begin{aligned} x_1-x_2 &\le 3 \\ x_2-x_3 &\le -2 \\ x_1-x_3 &\le 2 \end{aligned}$$


    $x_j-x_i\le w_{ij}$


    # Solution:


    $$\begin{aligned} x_1 &= 3 \\ x_2 &= 0 \\ x_3 &= 2 \end{aligned}$$


    > (The “$A$” matrix has dimensions $|E|\times|V|$.)


    # Constraint graph:


    $x_j-x_i\le w_{ij}$


