- pgno: 18
  md: '# # The hiring problem


    # ## Scenario:


    +   - You are using an employment agency to hire a new office assistant.


    +   - The agency sends you one candidate each day.


    +   - You interview the candidate and must immediately decide whether or not to
    hire that person. But if you hire, you must also fire your current office assistant
    even if it’s someone you have recently hired.


    +   - Cost to interview is $c_i$ per candidate (interview fee paid to agency).


    +   - Cost to hire is $c_h$ per candidate (includes cost to fire current office
    assistant + hiring fee paid to agency).


    +   - You are committed to having hired, at all times, the best candidate seen
    so far.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # The hiring problem (cont.)




    Determine what the price of this strategy will be.


    Pseudocode to model this scenario: Assumes that the candidates are numbered 1
    to n and after interviewing each candidate, we can determine if it’s better than
    the current office assistant.


    ```

    HIRE-ASSISTANT(n)

    1 best ← 0 ▷ candidate 0 is a least-qualified dummy candidate

    2 for i ← 1 to n

    3 do interview candidate i

    4 if candidate i is better than candidate best

    5 then best ← i

    6 hire candidate i

    ```'
