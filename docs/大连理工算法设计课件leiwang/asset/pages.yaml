- pgno: 696
  md: '# # Correctness


    **Theorem.** If $G=(V,E)$ contains no negative-weight cycles, then after the Bellman-Ford
    algorithm executes, $d[v]=\delta(s,v)$ for all $v\in V$.


    *Proof.* Let $v\in V$ be any vertex, and consider a shortest path $p$ from $s$
    to $v$ with the minimum number of edges.


    ![](img/5e59105b951890406cf98b2a964cb2f9_696_0.png)


    Since $p$ is a shortest path, we have


    $\delta(s,v_i)=\delta(s,v_{i-1})+w(v_{i-1},v_i)$.'
  merge: -1
  img_proc: true
- pgno: 697
  md: '# # Correctness (continued)


    ![](img/5e59105b951890406cf98b2a964cb2f9_697_0.png)


    ![](img/5e59105b951890406cf98b2a964cb2f9_697_1.png)


    Initially, \(d[v_0] = 0 = \delta(s, v_0)\), and \(d[v_0]\) is unchanged by subsequent
    relaxations (because of the lemma from Lecture 14 that \(d[v] \geq \delta(s, v)\)).


    +   - After 1 pass through \(E\), we have \(d[v_1] = \delta(s, v_1)\).

    +   - After 2 passes through \(E\), we have \(d[v_2] = \delta(s, v_2)\).

    +   - \(\vdots\)

    +   - After \(k\) passes through \(E\), we have \(d[v_k] = \delta(s, v_k)\).


    Since \(G\) contains no negative-weight cycles, \(p\) is simple. Longest simple
    path has \(\leq |V| - 1\) edges. \(\blacksquare\)'
  merge: -1
  img_proc: true
