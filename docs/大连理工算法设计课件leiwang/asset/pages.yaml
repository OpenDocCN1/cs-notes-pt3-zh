- pgno: 264
  md: '# Strassen’s idea


    +   • Multiply 2×2 matrices with only 7 recursive mults.


    $$P_1=a\cdot(f-h)$$

    $$P_2=(a+b)\cdot h$$

    $$P_3=(c+d)\cdot e$$

    $$P_4=d\cdot(g-e)$$

    $$P_5=(a+d)\cdot(e+h)$$

    $$P_6=(b-d)\cdot(g+h)$$

    $$P_7=(a-c)\cdot(e+f)$$


    $$r=P_5+P_4-P_2+P_6$$

    $$s=P_1+P_2$$

    $$t=P_3+P_4$$

    $$u=P_5+P_1-P_3-P_7$$'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# # Strassen''s idea


    +   • Multiply 2×2 matrices with only 7 recursive mults.


    P₁ = a · (f − h)

    P₂ = (a + b) · h

    P₃ = (c + d) · e

    P₄ = d · (g − e)

    P₅ = (a + d) · (e + h)

    P₆ = (b − d) · (g + h)

    P₇ = (a − c) · (e + f)


    r = P₅ + P₄ − P₂ + P₆

    s = P₁ + P₂

    t = P₃ + P₄

    u = P₅ + P₁ − P₃ − P₇


    > 7 mults, 18 adds/subs.

    > **Note:** No reliance on commutativity of mult!'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# # Strassen''s idea


    +   • Multiply 2×2 matrices with only 7 recursive mults.


    P₁ = a · (f − h)

    P₂ = (a + b) · h

    P₃ = (c + d) · e

    P₄ = d · (g − e)

    P₅ = (a + d) · (e + h)

    P₆ = (b − d) · (g + h)

    P₇ = (a − c) · (e + f )


    r = P₅ + P₄ − P₂ + P₆

    = (a + d)(e + h)

    + d(g − e) − (a + b)h

    + (b − d)(g + h)

    = ae + ah + de + dh

    + dg −de − ah − bh

    + bg + bh − dg − dh

    = ae + bg'
  merge: -1
