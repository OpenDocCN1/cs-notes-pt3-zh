- pgno: 540
  md: '# # Recursive formulation


    # ## Theorem.


    \(c[i, j] = \begin{cases} c[i-1, j-1] + 1 & \text{if } x[i] = y[j], \\ \max \{
    c[i-1, j], c[i, j-1] \} & \text{otherwise.} \end{cases}\)


    # ### Proof. Case \(x[i] = y[j]\):


    ![](img/5e59105b951890406cf98b2a964cb2f9_540_0.png)


    Let \(z[1 \dots k] = \text{LCS}(x[1 \dots i], y[1 \dots j])\), where \(c[i, j]
    = k\). Then, \(z[k] = x[i]\), or else \(z\) could be extended. Thus, \(z[1 \dots
    k-1]\) is CS of \(x[1 \dots i-1]\) and \(y[1 \dots j-1]\).'
  merge: -1
  img_proc: true
- pgno: 541
  md: '# # Proof (continued)


    **Claim:** z[1 .. k-1] = LCS(x[1 .. i-1], y[1 .. j-1]).


    Suppose w is a longer CS of x[1 .. i-1] and y[1 .. j-1], that is, |w| > k-1. Then,
    **cut and paste**: w || z[k] (w concatenated with z[k]) is a common subsequence
    of x[1 .. i] and y[1 .. j] with |w || z[k]| > k. Contradiction, proving the claim.'
  merge: -1
  img_proc: true
- pgno: 542
  md: '# Proof (continued)


    **Claim:** $z[1..k-1]=\operatorname{LCS}(x[1..i-1],y[1..j-1])$.


    Suppose $w$ is a longer CS of $x[1..i-1]$ and $y[1..j-1]$, that is, $|w|>k-1$.
    Then, **cut and paste:** $w\mathbin{||}z[k]$ ($w$ concatenated with $z[k]$) is
    a common subsequence of $x[1..i]$ and $y[1..j]$ with $|w\mathbin{||}z[k]|>k$.
    Contradiction, proving the claim.


    Thus, $c[i-1,j-1]=k-1$, which implies that $c[i,j]=c[i-1,j-1]+1$.


    Other cases are similar. □'
  merge: -1
  img_proc: true
