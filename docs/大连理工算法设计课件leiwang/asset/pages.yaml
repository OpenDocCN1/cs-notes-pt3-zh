- pgno: 336
  md: '# # Decision-tree model


    A decision tree can model the execution of any comparison sort:


    +   - One tree for each input size \(n\).


    +   - View the algorithm as splitting whenever it compares two elements.


    +   - The tree contains the comparisons along all possible instruction traces.


    +   - The running time of the algorithm = the length of the path taken.


    +   - Worst-case running time = height of tree.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# # Lower bound for decision-tree sorting


    **Theorem.** Any decision tree that can sort \( n \) elements must have height
    \( \Omega(n \lg n) \).


    **Proof.** The tree must contain \( \ge n! \) leaves, since there are \( n! \)
    possible permutations. A height-\( h \) binary tree has \( \le 2^h \) leaves.
    Thus, \( n! \le 2^h \).


    +   \(\therefore \ h \ge \lg(n!)\) (lg is mono. increasing)

    +   \(\ge \lg \left((n/e)^n\right)\) (Stirling''s formula)

    +   \(= n \lg n - n \lg e\)

    +   \(= \Omega(n \lg n)\).'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# # Lower bound for comparison sorting


    **Corollary.** Heapsort and merge sort are asymptotically optimal comparison sorting
    algorithms.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# # Sorting in linear time


    **Counting sort:** No comparisons between elements.


    +   - **Input**: \( A[1 \dots n] \), where \( A[j] \in \{1, 2, \dots, k\} \).


    +   - **Output**: \( B[1 \dots n] \), sorted.


    +   - **Auxiliary storage**: \( C[1 \dots k] \).'
  merge: -1
  img_proc: true
- pgno: 340
  md: "# # Counting sort\n\n```\nfor i ← 1 to k\ndo C[i] ← 0\nfor j ← 1 to n\ndo C[A[j]]\
    \ ← C[A[j]] + 1  ▷ C[i] = |{key = i}|\nfor i ← 2 to k\ndo C[i] ← C[i] + C[i−1]\
    \  ▷ C[i] = |{key ≤ i}|\nfor j ← n downto 1\ndo B[C[A[j]]] ← A[j]\n   C[A[j]]\
    \ ← C[A[j]] − 1\n```"
