- pgno: 726
  md: '# # Matrix multiplication


    Compute \( C = A \cdot B \), where \( C \), \( A \), and \( B \) are \( n \times
    n \) matrices:


    \( c_{ij} = \sum_{k=1}^{n} a_{ik} b_{kj} \).


    Time = \( \Theta(n^3) \) using the standard algorithm.


    What if we map "+" → "min" and "·" → "+"?


    \( c_{ij} = \min_k \{ a_{ik} + b_{kj} \} \).


    Thus, \( D^{(m)} = D^{(m-1)} \, "\times" \, A \).


    Identity matrix = I = \(\begin{pmatrix} 0 & \infty & \infty & \infty \\ \infty
    & 0 & \infty & \infty \\ \infty & \infty & 0 & \infty \\ \infty & \infty & \infty
    & 0 \end{pmatrix} = D^0 = (d_{ij}^{(0)})\).'
  merge: -1
  img_proc: true
- pgno: 727
  md: '# # Matrix multiplication (continued)


    The (min, +) multiplication is **associative**, and with the real numbers, it
    forms an algebraic structure called a **closed semiring**.


    Consequently, we can compute


    ```

    ```

    D^(1) = D^(0) · A = A^1

    D^(2) = D^(1) · A = A^2

    ... ...

    D^(n-1) = D^(n-2) · A = A^(n-1),

    ```

    ```


    yielding \( D^{(n-1)} = (\delta(i, j)) \).


    Time = \(\Theta(n \cdot n^3) = \Theta(n^4)\). No better than \( n \times \) B-F.'
  merge: -1
  img_proc: true
- pgno: 728
  md: '# # Improved matrix multiplication algorithm


    **Repeated squaring:** \( A^{2k} = A^k \times A^k \).

    Compute \( A^2, A^4, \dots, A^{2^{\lceil \lg(n-1) \rceil}} \).

    \( O(\lg n) \) squarings


    **Note:** \( A^{n-1} = A^n = A^{n+1} = \dots \).

    Time = \( \Theta(n^3 \lg n) \).


    To detect negative-weight cycles, check the diagonal for negative values in \(
    O(n) \) additional time.'
  merge: -1
