- pgno: 263
  md: '# # Strassen''s idea


    +   • Multiply 2×2 matrices with only 7 recursive mults.


    P₁ = a · (f − h)

    P₂ = (a + b) · h

    P₃ = (c + d) · e

    P₄ = d · (g − e)

    P₅ = (a + d) · (e + h)

    P₆ = (b − d) · (g + h)

    P₇ = (a − c) · (e + f )'
  merge: -1
