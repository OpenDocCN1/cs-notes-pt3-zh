- pgno: 377
  md: '# # Order statistics


    Select the \(i\)th smallest of \(n\) elements (the element with **rank** \(i\)).


    +   - \(i = 1\): **minimum**;

    +   - \(i = n\): **maximum**;

    +   - \(i = \lfloor (n+1)/2 \rfloor\) or \(\lceil (n+1)/2 \rceil\): **median**.


    **Naive algorithm**: Sort and index \(i\)th element.

    Worst-case running time = \(\Theta(n \lg n) + \Theta(1)\)

    \(= \Theta(n \lg n)\),

    using merge sort or heapsort (*not* quicksort).'
  merge: -1
  img_proc: true
- pgno: 378
  md: "# Randomized divide-and-conquer algorithm\n\n```\nRANDOM-SELECT(A, p, q, i)\
    \ ▷ ith smallest of A[p...q]\n    if p = q then return A[p]\n    r ← RANDOM-PARTITION(A,\
    \ p, q)\n    k ← r − p + 1 ▷ k = rank(A[r])\n    if i = k then return A[r]\n \
    \   if i < k\n        then return RANDOM-SELECT(A, p, r − 1, i)\n        else\
    \ return RANDOM-SELECT(A, r + 1, q, i − k)\n```\n\n![](img/5e59105b951890406cf98b2a964cb2f9_378_0.png)"
  merge: -1
  img_proc: true
- pgno: 379
  md: '# # Example


