- pgno: 157
  md: '# Analyzing merge sort


    ![](img/5e59105b951890406cf98b2a964cb2f9_157_0.png)


    $T(n)$


    $\Theta(1)$


    $2T(n/2)$


    $\Theta(n)$


    **Abuse**


    # MERGE-SORT $A[1..n]$


    +   1. If $n=1$, done.

    +   2. Recursively sort $A[1..\lfloor n/2\rfloor]$ and $A[\lfloor n/2\rfloor+1..n]$.

    +   3. “Merge” the 2 sorted lists


    **Sloppiness:** Should be $T(\lceil n/2\rceil)+T(\lfloor n/2\rfloor)$, but it
    turns out not to matter asymptotically.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# # Recurrence for merge sort


    \(T(n) = \begin{cases} \Theta(1) \text{ if } n = 1; \\ 2T(n/2) + \Theta(n) \text{
    if } n > 1. \end{cases}\)


    +   - We shall usually omit stating the base case when \(T(n) = \Theta(1)\) for
    sufficiently small \(n\), but only when it has no effect on the asymptotic solution
    to the recurrence.

    +   - CLRS and Lecture 2 provide several ways to find a good upper bound on \(T(n)\).'
  merge: -1
  img_proc: true
