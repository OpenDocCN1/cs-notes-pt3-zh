- pgno: 672
  md: '# # Negative-weight cycles


    **Recall:** If a graph \( G = (V, E) \) contains a negative-weight cycle, then
    some shortest paths may not exist.


    **Example:**


    ![](img/5e59105b951890406cf98b2a964cb2f9_672_0.png)


    **Bellman-Ford algorithm:** Finds all shortest-path lengths from a **source**
    \( s \in V \) to all \( v \in V \) or determines that a negative-weight cycle
    exists.'
  merge: -1
  img_proc: true
- pgno: 673
  md: "# # Bellman-Ford algorithm\n\n```\nd[s] ← 0\nfor each v ∈ V − {s}\n    do d[v]\
    \ ← ∞\n```\n\ninitialization\n\n```\nfor i ← 1 to |V| − 1\n    do for each edge\
    \ (u, v) ∈ E\n        do if d[v] > d[u] + w(u, v)\n            then d[v] ← d[u]\
    \ + w(u, v)\n```\n\nrelaxation step\n\n```\nfor each edge (u, v) ∈ E\n    do if\
    \ d[v] > d[u] + w(u, v)\n        then report that a negative-weight cycle exists\n\
    ```\n\nAt the end, d[v] = δ(s, v), if no negative-weight cycles.\nTime = O(VE)."
  merge: -1
  img_proc: true
