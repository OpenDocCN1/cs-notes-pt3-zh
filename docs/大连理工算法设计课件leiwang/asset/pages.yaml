- pgno: 322
  md: '# # Calculating expectation


    E[T(n)] = E[\sum_{k=0}^{n-1} X_k(T(k) + T(n-k-1) + \Theta(n))]

    = \sum_{k=0}^{n-1} E[X_k(T(k) + T(n-k-1) + \Theta(n))]

    = \sum_{k=0}^{n-1} E[X_k] \cdot E[T(k) + T(n-k-1) + \Theta(n)]

    = \frac{1}{n} \sum_{k=0}^{n-1} E[T(k)] + \frac{1}{n} \sum_{k=0}^{n-1} E[T(n-k-1)]
    + \frac{1}{n} \sum_{k=0}^{n-1} \Theta(n)

    = \frac{2}{n} \sum_{k=1}^{n-1} E[T(k)] + \Theta(n)


    Summations have identical terms.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# # Hairy recurrence


    \(E[T(n)] = \frac{2}{n} \sum_{k=2}^{n-1} E[T(k)] + \Theta(n)\)


    (The \(k=0, 1\) terms can be absorbed in the \(\Theta(n)\).)


    **Prove:** \(E[T(n)] \leq an \lg n\) for constant \(a > 0\).


    +   • Choose \(a\) large enough so that \(an \lg n\) dominates \(E[T(n)]\) for
    sufficiently small \(n \geq 2\).


    **Use fact:** \(\sum_{k=2}^{n-1} k \lg k \leq \frac{1}{2} n^2 \lg n - \frac{1}{8}
    n^2\) (exercise).'
