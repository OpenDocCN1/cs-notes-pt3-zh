- pgno: 706
  md: '# # Unsatisfiable constraints


    **Theorem.** If the constraint graph contains a negative-weight cycle, then the
    system of differences is unsatisfiable.


    **Proof.** Suppose that the negative-weight cycle is \(v_1 \rightarrow v_2 \rightarrow
    \cdots \rightarrow v_k \rightarrow v_1\). Then, we have


    +   \(x_2 - x_1 \leq w_{12}\)

    +   \(x_3 - x_2 \leq w_{23}\)

    +   \(\vdots\)

    +   \(x_k - x_{k-1} \leq w_{k-1,k}\)

    +   \(x_1 - x_k \leq w_{k1}\)'
  merge: -1
