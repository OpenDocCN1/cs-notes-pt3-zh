- pgno: 253
  md: '# # Recursive squaring


    # ## Inductive step \( (n \geq 2) \):


    \(\begin{bmatrix} F_{n+1} & F_n \\ F_n & F_{n-1} \end{bmatrix} = \begin{bmatrix}
    F_n & F_{n-1} \\ F_{n-1} & F_{n-2} \end{bmatrix} \cdot \begin{bmatrix} 1 & 1 \\
    1 & 0 \end{bmatrix}\)


    \(= \begin{bmatrix} 1 & 1 \\ 1 & 0 \end{bmatrix}^{n-1} \cdot \begin{bmatrix} 1
    & 1 \\ 1 & 0 \end{bmatrix}\)


    \(= \begin{bmatrix} 1 & 1 \\ 1 & 0 \end{bmatrix}^n\)'
  merge: -1
