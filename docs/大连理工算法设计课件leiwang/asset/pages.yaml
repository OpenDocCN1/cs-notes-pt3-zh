- pgno: 707
  md: '# # Unsatisfiable constraints


    **Theorem.** If the constraint graph contains a negative-weight cycle, then the
    system of differences is unsatisfiable.


    *Proof.* Suppose that the negative-weight cycle is $v_1 \to v_2 \to \cdots \to
    v_k \to v_1$. Then, we have


    $$

    \begin{aligned}

    x_2-x_1 &\le w_{12}\\

    x_3-x_2 &\le w_{23}\\

    &\vdots\\

    x_k-x_{k-1} &\le w_{k-1,k}\\

    x_1-x_k &\le w_{k1}\\

    \hline

    0 &\le \text{weight of cycle}\\

    &<0

    \end{aligned}

    $$


    Therefore, no values for the $x_i$ can satisfy the constraints.


    ![](img/5e59105b951890406cf98b2a964cb2f9_707_0.png)'
