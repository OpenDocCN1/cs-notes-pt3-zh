  md: '# # Dynamic order statistics


    OS-SELECT(_i_, _S_): returns the _i_th smallest element in the dynamic set _S_.


    OS-RANK(_x_, _S_): returns the rank of \(x \in S\) in the sorted order of _S_’s
    elements.


    **IDEA:** Use a red-black tree for the set _S_, but keep subtree sizes in the
    nodes.


    Notation for nodes:


    ![](img/5e59105b951890406cf98b2a964cb2f9_462_0.png)'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# # Example of an OS-tree


