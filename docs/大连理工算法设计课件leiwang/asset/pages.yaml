- pgno: 469
  md: '# # Data-structure augmentation


    **Methodology:** (_e.g., order-statistics trees_)


    +   1. Choose an underlying data structure (_red-black trees_).


    +   2. Determine additional information to be stored in the data structure (_subtree
    sizes_).


    +   3. Verify that this information can be maintained for modifying operations
    (_RB-INSERT, RB-DELETE — don’t forget rotations_).


    +   4. Develop new dynamic-set operations that use the information (_OS-SELECT
    and OS-RANK_).


    These steps are guidelines, not rigid rules.'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# # Interval trees


    **Goal:** To maintain a dynamic set of intervals, such as time intervals.


