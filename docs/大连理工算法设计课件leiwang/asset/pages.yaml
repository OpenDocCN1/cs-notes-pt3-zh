- pgno: 32
  md: '# # Heap data structure


    # ## Heap as a tree:


    Heap A (not garbage-collected storage) is a nearly complete binary tree.


    +   - **Height** of node = # of edges on a longest simple path from the node down
    to a leaf.

    +   - **Height** of heap = height of root = Θ(lgn).


    # ## Heap as a array: A heap can be stored as an array A.


    +   - Root of tree is A[1].

    +   - Parent of A[i] = A[i/2].

    +   - Left child of A[i] = A[2i].

    +   - Right child of A[i] = A[2i + 1].

    +   - Computing is fast with binary representation implementation.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Heap data structure (cont.)


    # ## Heap property:


    +   - For max-heaps (largest element at root), **max-heap property**: for all
    nodes _i_, excluding the root, _A_[PARENT(_i_)] ≥ _A_[_i_].


    +   - For min-heaps (smallest element at root), **min-heap property**: for all
    nodes _i_, excluding the root, _A_[PARENT(_i_)] ≤ _A_[_i_].


    By induction and transitivity of ≤, the max-heap property guarantees that the
    maximum element of a max-heap is **at the root**. Similar argument for min-heaps.'
  merge: -1
  img_proc: true
