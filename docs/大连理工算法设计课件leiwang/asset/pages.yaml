- pgno: 394
  md: '# # Worst-case linear-time order statistics


    # ## SELECT(i, n)


    +   1. Divide the n elements into groups of 5. Find the median of each 5-element
    group by rote.


    +   2. Recursively SELECT the median x of the ⌊n/5⌋ group medians to be the pivot.


    +   3. Partition around the pivot x. Let k = rank(x).


    +   4. if i = k then return x


    +   elseif i < k then recursively SELECT the ith smallest element in the lower
    part


    +   else recursively SELECT the (i−k)th smallest element in the upper part


    > > Same as RAND-SELECT


