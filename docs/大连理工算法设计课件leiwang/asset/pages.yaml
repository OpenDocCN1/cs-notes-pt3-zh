- pgno: 510
  md: '# # Potential method


    **IDEA:** View the bank account as the potential energy (_à la_ physics) of the
    dynamic set.

    **Framework:**


    +   - Start with an initial data structure \(D_0\).

    +   - Operation \(i\) transforms \(D_{i-1}\) to \(D_i\).

    +   - The cost of operation \(i\) is \(c_i\).

    +   - Define a **potential function** \(\Phi : \{D_i\} \rightarrow \mathbb{R}\),
    such that \(\Phi(D_0) = 0\) and \(\Phi(D_i) \ge 0\) for all \(i\).

    +   - The **amortized cost** \(\hat{c}_i\) with respect to \(\Phi\) is defined
    to be \(\hat{c}_i = c_i + \Phi(D_i) - \Phi(D_{i-1})\).'
  merge: -1
  img_proc: true
- pgno: 511
  md: '# # Understanding potentials


    \(\hat{c}_i = c_i + \Phi(D_i) - \Phi(D_{i-1})\)


    **potential difference** \(\Delta\Phi_i\)


    +   - If \(\Delta\Phi_i > 0\), then \(\hat{c}_i > c_i\). Operation \(i\) stores
    work in the data structure for later use.

    +   - If \(\Delta\Phi_i < 0\), then \(\hat{c}_i < c_i\). The data structure delivers
    up stored work to help pay for operation \(i\).'
  merge: -1
  img_proc: true
- pgno: 512
  md: '# # The amortized costs bound the true costs


    The total amortized cost of $n$ operations is


    $$\sum_{i=1}^n \hat{c}_i = \sum_{i=1}^n \left(c_i + \Phi(D_i) - \Phi(D_{i-1})\right)$$


    Summing both sides.'
  merge: -1
  img_proc: true
- pgno: 513
  md: '# # The amortized costs bound the true costs


    The total amortized cost of \( n \) operations is


    \[ \sum_{i=1}^n \hat{c}_i = \sum_{i=1}^n \left( c_i + \Phi(D_i) - \Phi(D_{i-1})
    \right) \]


    \[ = \sum_{i=1}^n c_i + \Phi(D_n) - \Phi(D_0) \]


    The series telescopes.'
