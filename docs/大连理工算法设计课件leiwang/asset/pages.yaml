- pgno: 464
  md: '# # Selection


    **Implementation trick:** Use a *sentinel* (dummy record) for `NIL` such that
    \( size[\text{NIL}] = 0 \).


    \(\text{OS-SELECT}(x, i) \triangleright i\text{th smallest element in the subtree
    rooted at } x\)


    \( k \leftarrow size[left[x]] + 1 \triangleright k = \text{rank}(x) \)


    **if** \( i = k \) **then return** \( x \)


    **if** \( i < k \)


    **then return** \(\text{OS-SELECT}(left[x], i)\)


    **else return** \(\text{OS-SELECT}(right[x], i - k)\)


    (OS-RANK is in the textbook.)'
  merge: -1
  img_proc: true
