- pgno: 10
  md: '# # Running time


    On a particular input, **_the running time_** is the number of primitive operations
    (steps) executed.


    +   - Want to define steps to be machine-independent.

    +   - Each line of pseudocode requires a constant amount of time.

    +   - One line may take a different amount of time than another, but each execution
    of line _i_ takes the same amount of time _c<sub>i</sub>_.

    +   - This is assuming that the line consists only of primitive operations.


    The running time of an algorithm is:


    \(\sum_{\text{all statements}} \text{(cost of statement)} \times \text{(# of times
    statement is executed)}\)'
  merge: -1
  img_proc: true
- pgno: 11
  md: "# # Analysis of insertion sort\n\n# ## Pseudocode with cost line by line\n\n\
    ```\nINSERTION-SORT(A)\nfor j <- 2 to length[A]  \n    do key <- A[j]  \n    \
    \   |> Insert A[j] into the sorted  \n          sequence A[1 .. j-1].\n    i <-\
    \ j - 1\n    while i > 0 and A[i] > key\n        do A[i + 1] <- A[i]\n       \
    \     i <- i - 1\n    A[i + 1] <- key\n```\n\n```\ncost   times\nc1     n\nc2\
    \     n-1\n0\nc4     n-1\nc5     Σt=2n tj\nc6     Σt=2n (tj - 1)\nc7     Σt=2n\
    \ (tj - 1)\nc8     n-1\n```\n\n# ## The running time of Insertion-Sort\n\n```\n\
    T(n) = c1n + c2(n - 1) + c4(n - 1) + c5 Σt=2n tj\n    + c6 Σt=2n (tj - 1) + c7\
    \ Σt=2n (tj - 1) + c8(n - 1)\n```"
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Analysis of insertion sort, (cont.)


    # Best case:


    $$T(n) = c_1n + c_2(n-1) + c_4(n-1) + c_5(n-1) + c_8(n-1)$$

    $$\quad = (c_1+c_2+c_4+c_5+c_8)n - (c_2+c_4+c_5+c_8)$$

    $$\quad = an+b.$$


    # Worst case:


    $$T(n) = c_1n + c_2(n-1) + c_4(n-1) + c_5\left(\frac{n(n+1)}{2}-1\right)$$

    $$\quad + c_6\left(\frac{n(n-1)}{2}\right) + c_7\left(\frac{n(n-1)}{2}\right)
    + c_8(n-1)$$

    $$\quad = an^2+bn+c.$$'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Worst-case and average-case analysis


    We usually concentrate on finding the worst-case running time: the longest running
    time for any input of size n.


    +   • The worst-case running time gives a guaranteed upper bound on the running
    time for any input.

    +   • For some algorithms, the worst case occurs often. For example, when searching,
    the worst case often occurs when the item being searched for is not present, and
    searches for absent items may be frequent.

    +   • Why not analyze the average case? Because it’s often about as bad as the
    worst case.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Divide and conquer


    Another common approach.


    +   - **Divide** the problem into a number of subproblems.

    +   - **Conquer** the subproblems by solving them recursively.

    +     - **Base case:** If the subproblems are small enough, just solve them by
    brute force.

    +   - **Combine** the subproblem solutions to give a solution to the original
    problem.'
  merge: -1
