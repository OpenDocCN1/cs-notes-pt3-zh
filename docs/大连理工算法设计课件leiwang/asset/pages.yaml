- pgno: 137
  md: '# # Running time


    +   - The running time depends on the input: an already sorted sequence is easier
    to sort.

    +   - Parameterize the running time by the size of the input, since short sequences
    are easier to sort than long ones.

    +   - Generally, we seek upper bounds on the running time, because everybody likes
    a guarantee.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Kinds of analyses




    +   - T(n) = maximum time of algorithm on any input of size n.




    +   - T(n) = expected time of algorithm over all inputs of size n.

    +   - Need assumption of statistical distribution of inputs.




    +   - Cheat with a slow algorithm that works fast on some input.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Machine-independent time


    # ## What is insertion sort’s worst-case time?


    +   - It depends on the speed of our computer:

    +     - relative speed (on the same machine),

    +     - absolute speed (on different machines).


    # ## BIG IDEA:


    +   - Ignore machine-dependent constants.

    +   - Look at *growth* of \(T(n)\) as \(n \to \infty\) .


    # ## “Asymptotic Analysis”'
  merge: -1
  img_proc: true
- pgno: 140
  md: '![](img/5e59105b951890406cf98b2a964cb2f9_140_0.png)


    # Θ-notation


    **Math:** Θ(g(n)) = { f(n) : there exist positive constants c₁, c₂, and n₀ such
    that 0 ≤ c₁ g(n) ≤ f(n) ≤ c₂ g(n) for all n ≥ n₀ }


    +   - Drop low-order terms; ignore leading constants.

    +   - Example: 3n³ + 90n² – 5n + 6046 = Θ(n³)'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # Asymptotic performance


    When _n_ gets large enough, a Θ(_n_<sup>2</sup>) algorithm _always_ beats a Θ(_n_<sup>3</sup>)
    algorithm.


    +   - We shouldn’t ignore asymptotically slower algorithms, however.

    +   - Real-world design situations often call for a careful balancing of engineering
    objectives.

    +   - Asymptotic analysis is a useful tool to help to structure our thinking.


    ![](img/5e59105b951890406cf98b2a964cb2f9_141_0.png)'
