  md: '![](img/5e59105b951890406cf98b2a964cb2f9_719_0.png)


    # # All-pairs shortest paths


    **Input:** Digraph $G=(V,E)$, where $V=\{1,2,\ldots,n\}$, with edge-weight function
    $w:E\to\mathbb{R}$.


    **Output:** $n\times n$ matrix of shortest-path lengths $\delta(i,j)$ for all
    $i,j\in V$.


    # ## IDEA:


    +   - Run Bellman-Ford once from each vertex.

    +   - Time $=O(V^2E)$.

    +   - Dense graph ($n^2$ edges) $\Rightarrow \Theta(n^4)$ time in the worst case.


    *Good first try!*'
