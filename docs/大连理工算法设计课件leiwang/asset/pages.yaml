- pgno: 482
  md: '# # Analysis


    Time = \( O(h) = O(\lg n) \), since INTERVAL-SEARCH does constant work at each
    level as it follows a simple path down the tree.


    List _all_ overlapping intervals:


    +   - Search, list, delete, repeat.

    +   - Insert them all again at the end.


    Time = \( O(k \lg n) \), where _k_ is the total number of overlapping intervals.


    This is an **output-sensitive** bound.


    Best algorithm to date: \( O(k + \lg n) \).'
  merge: -1
  img_proc: true
- pgno: 483
  md: "# # Correctness\n\n**Theorem.** Let _L_ be the set of intervals in the left\
    \ subtree of node _x_, and let _R_ be the set of intervals in _x_’s right subtree.\n\
    \n+   - If the search goes right, then\n+   \n+     \\(\\{ i' \\in L : i' \\text{\
    \ overlaps } i \\} = \\emptyset\\).\n\n+   - If the search goes left, then\n+\
    \   \n+     \\(\\{i' \\in L : i' \\text{ overlaps } i \\} = \\emptyset\\)\n+ \
    \  \n+     \\(\\Rightarrow \\{i' \\in R : i' \\text{ overlaps } i \\} = \\emptyset\\\
    ).\n\nIn other words, it’s always safe to take only 1 of the 2 children: we’ll\
    \ either find something, or nothing was to be found."
  merge: -1
  img_proc: true
- pgno: 484
  md: '# # Correctness proof


    **_Proof._** Suppose first that the search goes right.


    +   • If _left_[_x_] = NIL, then we’re done, since \( L = \varnothing \).


    +   • Otherwise, the code dictates that we must have _low_[_i_] > _m_[_left_[_x_]].
    The value _m_[_left_[_x_]] corresponds to the high endpoint of some interval \(
    j \in L \), and no other interval in _L_ can have a larger high endpoint than
    _high_[_j_].


    +   • Therefore, \(\{i'' \in L : i'' \text{ overlaps } i\} = \varnothing\).


    ![](img/5e59105b951890406cf98b2a964cb2f9_484_0.png)'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# # Proof (continued)


    Suppose that the search goes left, and assume that \(\{i'' \in L : i'' \text{
    overlaps } i \} = \emptyset\).


    +   - Then, the code dictates that \(low[i] \le m[left[x]] = high[j]\) for some
    \(j \in L\).


    +   - Since \(j \in L\), it does not overlap \(i\), and hence \(high[i] < low[j]\).


    +   - But, the binary-search-tree property implies that for all \(i'' \in R\),
    we have \(low[j] \le low[i'']\).


    +   - But then \(\{i'' \in R : i'' \text{ overlaps } i \} = \emptyset\).


    ![](img/5e59105b951890406cf98b2a964cb2f9_485_0.png)'
  merge: -1
  img_proc: true
