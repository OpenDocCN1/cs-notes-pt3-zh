  md: '# # Powering a number


    **Problem:** Compute \(a^n\), where \(n \in \mathbb{N}\).


    **Naive algorithm:** \(\Theta(n)\).


    **Divide-and-conquer algorithm:**


    \(a^n = \begin{cases} a^{n/2} \cdot a^{n/2} & \text{if } n \text{ is even;} \\
    a^{(n-1)/2} \cdot a^{(n-1)/2} \cdot a & \text{if } n \text{ is odd.} \end{cases}\)'
  merge: -1
