    \(Adj[3] = \{\}\)

    \(Adj[4] = \{3\}\)


    For undirected graphs, \(|Adj[v]| = degree(v)\).

    For digraphs, \(|Adj[v]| = out-degree(v)\).


    **Handshaking Lemma:** \(\sum_{v \in V} = 2|E|\) for undirected graphs \(\Rightarrow\)
    adjacency lists use \(\Theta(V + E)\) storage — a **sparse** representation (for
    either type of graph).


