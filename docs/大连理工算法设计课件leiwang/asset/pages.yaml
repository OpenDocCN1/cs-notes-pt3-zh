    +   2. **Conquer**: Perform 7 multiplications of \( (n/2)\times(n/2) \) submatrices
    recursively.


    +   3. **Combine**: Form \( C \) using \( + \) and \( - \) on \( (n/2)\times(n/2)
    \) submatrices.'
