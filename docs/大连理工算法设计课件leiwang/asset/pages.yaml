- pgno: 364
  md: '# Analysis of radix sort


    +   - Assume counting sort is the auxiliary stable sort.

    +   - Sort n computer words of b bits each.

    +   - Each word can be viewed as having b/r base-2^r digits.


    Example: 32-bit word


    ![](img/5e59105b951890406cf98b2a964cb2f9_364_0.png)


    r = 8 ⇒ b/r = 4 passes of counting sort on base-2^8 digits; or r = 16 ⇒ b/r =
    2 passes of counting sort on base-2^16 digits.


    > How many passes should we make?'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# Analysis (continued)


    Recall: Counting sort takes Θ(n + k) time to sort n numbers in the range from
    0 to k − 1.


    If each b-bit word is broken into r-bit pieces, each pass of counting sort takes
    Θ(n + 2^r) time. Since there are b/r passes, we have


    T(n,b) = Θ( (b/r) (n + 2^r) ).


    Choose r to minimize T(n,b):


    +   • Increasing r means fewer passes, but as r ≫ lg n, the time grows exponentially.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# # Choosing r


    \(T(n,b)=\Theta\left(\frac{b}{r}\left(n+2^r\right)\right)\)


    Minimize \(T(n,b)\) by differentiating and setting to 0.


    Or, just observe that we don’t want \(2^r \gg n\), and there’s no harm asymptotically
    in choosing \(r\) as large as possible subject to this constraint.


    Choosing \(r = \lg n\) implies \(T(n,b) = \Theta(bn/\lg n)\) .


    +   • For numbers in the range from 0 to \(n^d - 1\), we have \(b = d \lg n \Rightarrow\)
    radix sort runs in \(\Theta(dn)\) time.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# # Conclusions


    In practice, radix sort is fast for large inputs, as well as simple to code and
    maintain.


    # ## Example (32-bit numbers):


    +   • At most 3 passes when sorting ≥ 2000 numbers.


    +   • Merge sort and quicksort do at least ⌈lg 2000⌉ = 11 passes.


    **Downside:** Unlike quicksort, radix sort displays little locality of reference,
    and thus a well-tuned quicksort fares better on modern processors, which feature
    steep memory hierarchies.'
  merge: -1
  img_proc: true
