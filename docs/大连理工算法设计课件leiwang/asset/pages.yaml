- pgno: 316
  md: '# # Randomized quicksort analysis


    Let \( T(n) = \) the random variable for the running time of randomized quicksort
    on an input of size \( n \), assuming random numbers are independent.


    For \( k = 0, 1, \dots, n-1 \), define the **indicator random variable**


    \( X_k = \begin{cases} 1 & \text{if PARTITION generates a } k:n-k-1 \text{ split,}
    \\ 0 & \text{otherwise.} \end{cases} \)


    \( E[X_k] = \Pr \{ X_k = 1 \} = 1/n \), since all splits are equally likely, assuming
    elements are distinct.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# # Analysis (continued)


    $$T(n)=\begin{cases} T(0)+T(n-1)+\Theta(n) & \text{if }0:n-1\text{ split},\\ T(1)+T(n-2)+\Theta(n)
    & \text{if }1:n-2\text{ split},\\ \vdots \\ T(n-1)+T(0)+\Theta(n) & \text{if }n-1:0\text{
    split}.\end{cases}$$


    $$=\sum_{k=0}^{n-1}X_k\bigl(T(k)+T(n-k-1)+\Theta(n)\bigr)$$'
