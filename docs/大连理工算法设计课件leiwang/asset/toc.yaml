  - Figure 2.3 The operation of lines 10–17 in the call MERGE(A, 9, 12, 16), when
    the subarray A[9 . . 16] contains the sequence ⟨2, 4, 5, 7, 1, 2, 3, 6⟩. After
    copying and inserting sentinels, the array L contains ⟨2, 4, 5, 7, ∞⟩, and the
    array R contains ⟨1, 2, 3, 6, ∞⟩. Lightly shaded positions in A contain their
    final values, and lightly shaded positions in L and R contain values that have
    yet to be copied back into A. Taken together, the lightly shaded positions always
    comprise the values originally in A[9 . . 16], along with the two sentinels. Heavily
    shaded positions in A contain values that will be copied over, and heavily shaded
    positions in L and R contain values that have already been copied back into A.
