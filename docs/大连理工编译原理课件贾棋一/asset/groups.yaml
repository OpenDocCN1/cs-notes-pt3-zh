    ## 3.6 二义文法的应用


    ### 二义文法的特点


    - 二义文法决不是 LR 文法

    - 简洁、自然

    - 可以用文法以外的信息来消除二义

    - 语法分析的效率高（基于消除二义后得到的分析表）


    二义文法：


    \( E \rightarrow E + E \mid E * E \mid (E) \mid \text{id} \)


    非二义的文法：


    \( E \rightarrow E + T \mid T \)


    \( T \rightarrow T * F \mid F \)


    \( F \rightarrow (E) \mid \text{id} \)


    ### 3.6.1 使用文法以外信息来解决分析动作冲突


    二义文法：\( E \to E+E \mid E*E \mid (E) \mid id \)


    规定：`*` 优先级高于 `+`，两者都是左结合


    #### LR(0) 项目集 \(I_7\)


    ```text

    E → E + E·

    E → E· + E

    E → E· * E

    ```


    面临 `+`，归约

    '
