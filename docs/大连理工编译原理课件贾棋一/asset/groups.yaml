  - '[PAGE 170]


    # 2.5 词法分析器的生成器


    # Lex中重要的外部变量


    +   - **yyin**：`FILE*` 类型。它指向 lexer 正在解析的当前文件。

    +   - **yyout**：`FILE*` 类型。它指向记录 lexer 输出的位置。缺省情况下，yyin 和 yyout 都指向标准输入和输出。

    +   - 以上两个经常和函数 `yywrap()` 连用，如果函数的返回值是 1，就停止解析。因此它可以用来解析多个文件。代码可以写在第三段，这就能够解析多个文件。方法是使用
    yyin 文件指针指向不同的文件，直到所有的文件都被解析。最后，`yywrap()` 可以返回 1 来表示解析的结束。

    +   - **yylineno**：给出当前的行数信息'
