    \n（`((a)(b)* | (c))` 可以写成 `ab* | c`）\n\n### 2.2.3 正规定义\n\n对正规式命名，使表示简洁。\n\nd₁\
    \ → r₁  \nd₂ → r₂  \n...  \ndₙ → rₙ\n\n各个 dᵢ 的名字都不同\n\n每个 rᵢ 都是 Σ ∪ {d₁, d₂, ...,\
    \ dᵢ₋₁} 上的正规式\n\n> 这样就保证了，每个名字对应的正规式中使用的各种符号已经在前面定义了，从而可以避免递归定义的情况。\n\n### 正规定义的例子\n\
    \n**Pascal 语言的标识符集合**\n\nletter → A | B | ... | Z | a | b | ... | z\n\ndigit →\
    \ 0 | 1 | ... | 9\n\nid → letter (letter | digit)*\n\n**Pascal 无符号数集合，例：1946,\
    \ 11.28, 63.6E8, 1.99E–6**\n\ndigit → 0 | 1 | ... | 9\n\ndigits → digit digit*\n\
    \noptional_fraction → . digits | ε\n\noptional_exponent → (E ( + | – | ε ) digits\
    \ ) | ε\n\nnum → digits optional_fraction optional_exponent\n\n### 简化表示\n\nnum\
    \ → digit+ (.digit+)? (E(+|-)? digit+)?\n\n简化规则：\n\n1. `r+ = rr*`\n2. `r? = r\
    \ | ε`\n3. `[a-z] = a|b|c|...|z`\n4. `[abc] = a|b|c`\n\n> 前面所提到的词法记号，实际上就是正规式的名字！\n\
    \n- `while → while`\n- `do → do`\n- `relop → < | <= | = | <> | > | >=`\n- `id\
    \ → letter (letter | digit)*`\n- `num → digit+ (.digit+)? (E(+|-)? digit+)?`\n\
    - `delim → blank | tab | newline`\n- `ws → delim+`\n\n## 小结\n\n### 词法分析器工作原理\n\
    \n源代码  \n词法分析器  \n记号（token）流  \n\n源程序字符流  \n\n顺序组合  \n\n词法单元  \n模式  \n词法记号  \n\
    \n非形式化描述  \n形式化描述  \n正规式  \n\n字母表  \n集合  \n组合  \n字母  \n串  \n集合  \n语言  \n名字\n\n\
    ## 习题\n\n### 作业\n\n- 习题 2.3\n- 练习题（要求使用伪代码给出算法）：编写一个程序，用于统计文件中单词的总数，不同单词的数目。（假设输入文件中只包含字母和空格）\n\
    \n例：I love Dalian and I love DLUT\n\n单词总数：7  \n不同单词数目：5\n\n## 温故知新\n\n![](img/9ace97a2843cb2b456279738df7b8b56_89_0.png)\n\
    \n## 词法记号的识别\n\n- 词法记号的识别等同于对字符串的匹配过程\n- 这个匹配过程可以基于有限状态机来完成\n\n## 简单的正规式 d→a\n\
    \n![](img/9ace97a2843cb2b456279738df7b8b56_91_0.png)\n"
