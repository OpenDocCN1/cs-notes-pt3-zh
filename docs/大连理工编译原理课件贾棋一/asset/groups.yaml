  - '[PAGE 181]


    # 由偶数个0和奇数个1构成的所有0和1的串


    对于偶数个0和奇数个1构成的串，其第一个字符可能是0或1。


    +   如果是1，那么剩下的部分一定是偶数个0和偶数个1（即1 even_0_even_1）。


    +   如果是0，那么经过若干个偶数个0或偶数个1，一定会出现一个01或10，才能保证0的个数是偶数，1的个数是奇数。若串还没有结束，剩余部分一定是偶数个0和偶数个1。'
