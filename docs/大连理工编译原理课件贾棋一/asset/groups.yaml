    # # 第一章 引论


    # ## 前端和后端：


    +   - 把编译过程分成前端和后端两部分


    +   - 前端：只依赖于源程序，独立于目标机器（生成中间代码）


    +   - 后端：依赖于目标机器，与源程序无关，只与中间语言有关（从中间代码生成目标代码）


    +   - 好处：提高开发编译器的效率


    +   - 取一个编译器的前端，重写它的后端以产生同一源语言在另一机器上的编译器


    +   - 不同的前端使用同一个后端，从而得到一个机器上的几个编译器（采用同一中间语言）'
