    \n- 检查保留字表，如果在表中发现该词法单元则返回相应的记号并退出，否则转向2\n- 该词法单元是标识符，在符号表中查找，若找到该词法单元则返回该条目的指针并退出，否则执行3\n\
    - 在符号表中建立一个新的条目，把该词法单元填入，并返回此新条目的指针\n\n## 2.2 词法记号的描述与识别\n\n### 无符号数的转换图\n\n**num**\
    \ → **digit** ( . **digit** )? ( **E** ( + | − )? **digit**+ )?\n\n![](img/9ace97a2843cb2b456279738df7b8b56_99_0.png)\n\
    \n## 2.2 词法记号的描述与识别\n\n空白的转换图\n\ndelim → blank | tab | newline\n\nws → delim+\n\
    \n![](img/9ace97a2843cb2b456279738df7b8b56_100_0.png)\n\n## 2.3 有限自动机\n\n- 识别器：是一个程序，取串x作为输入，当x是语言的句子时，它回答“是”，否则回答“不是”。\n\
    - 状态转换图（有限自动机）→识别器\n- 确定/不确定有限自动机——时空权衡问题\n- 确定有限自动机：快，空间大\n\n### 2.3.1 不确定的有限自动机（简称NFA）\n\
    \n一个数学模型，它包括：\n\n- 状态集合S；\n- 输入符号集合Σ；\n- 转换函数move：S × (Σ∪{ε}) → P(S)；\n- 状态s₀是开始状态；\n\
    - F ⊆ S是接受状态集合。\n\n识别语言  \n(a|b)*ab  \n的NFA\n\n![](img/9ace97a2843cb2b456279738df7b8b56_103_0.png)\n\
    \n## 2.3 有限自动机\n\n### 例 识别aa*|bb*的NFA\n\n![](img/9ace97a2843cb2b456279738df7b8b56_105_0.png)\n\
    \n### 2.3.2 确定的有限自动机（简称DFA）\n\n一个数学模型，包括：\n\n- 状态集合S；\n- 输入字母表Σ；\n- 转换函数\\(move\
    \ : S \\times \\Sigma \\rightarrow S\\)；\n- 唯一的初态 \\(s \\in S\\)；\n- 终态集合 \\(F\
    \ \\subseteq S\\)；\n\n识别语言\n\\((a|b)^*ab\\)\n的DFA\n\n![](img/9ace97a2843cb2b456279738df7b8b56_106_0.png)\n\
    \n### 2.3.3 NFA到DFA的变换\n\n子集构造法\n\n- DFA的一个状态是NFA的一个状态集合\n- 读了输入a<sub>1</sub>\
    \ a<sub>2</sub> ... a<sub>n</sub>后，NFA能到达的所有状态： s<sub>1</sub>, s<sub>2</sub>,\
    \ ..., s<sub>k</sub>，则DFA到达状态{s<sub>1</sub>, s<sub>2</sub>, ..., s<sub>k</sub>}\n\
    \n![](img/9ace97a2843cb2b456279738df7b8b56_107_0.png)\n\n### 2.3.3 NFA到DFA的变换\n\
    \n子集构造法\n\n1. DFA的一个状态是NFA的一个状态集合\n2. 读了输入a₁ a₂ ... aₙ后，NFA能到达的所有状态： s₁, s₂, ...,\
    \ sₖ，则DFA到达状态{s₁, s₂, ..., sₖ}\n\n![](img/9ace97a2843cb2b456279738df7b8b56_108_0.png)\n\
    \n### 2.3.3 NFA到DFA的变换\n\n子集构造法\n\n1. DFA的一个状态是NFA的一个状态集合\n2. 读了输入a<sub>1</sub>a<sub>2</sub>...a<sub>n</sub>后，NFA能到达的所有状态：s<sub>1</sub>,\
    \ s<sub>2</sub>, ..., s<sub>k</sub>，则DFA到达状态{s<sub>1</sub>, s<sub>2</sub>, ...,\
    \ s<sub>k</sub>}\n\n![](img/9ace97a2843cb2b456279738df7b8b56_109_0.png)\n\n###\
    \ 2.3.3 NFA到DFA的变换\n\n子集构造法\n\n- DFA的一个状态是NFA的一个状态集合\n- 读了输入a₁ a₂ ... aₙ后，NFA能到达的所有状态：\
    \ s₁, s₂, ..., sₖ，则DFA到达状态{s₁, s₂, ..., sₖ}\n\n![](img/9ace97a2843cb2b456279738df7b8b56_110_0.png)\n\
    \n### 2.3.3 NFA到DFA的变换\n\n子集构造法\n\n- DFA的一个状态是NFA的一个状态集合\n- 读了输入a₁ a₂ ... aₙ后，NFA能到达的所有状态：\
    \ s₁, s₂, ..., sₖ，则DFA到达状态{s₁, s₂, ..., sₖ}\n\n![](img/9ace97a2843cb2b456279738df7b8b56_111_0.png)\n\
    \n### 2.3 有限自动机\n\n| 状态 | 输入符号 | |\n|---|---|---|\n| | a | b |\n| | | |\n| | |\
    \ |\n| | | |\n| | | |\n| | | |\n\n![](img/9ace97a2843cb2b456279738df7b8b56_113_0.png)\n\
    \n### 2.3 有限自动机\n\n\\( A = \\{0, 1, 2, 4, 7\\} \\)\n\n| 状态 | 输入符号 a | b |\n|---|---|---|\n\
    | A | | |\n\n![](img/9ace97a2843cb2b456279738df7b8b56_114_0.png)\n\n### 2.3 有限自动机\n\
    \nA = {0, 1, 2, 4, 7}\nB = {1, 2, 3, 4, 6, 7, 8}\n\n| 状态 | 输入符号 | |\n|---|---|---|\n\
    | | a | b |\n| A | B | |\n| B | | |\n| | | |\n| | | |\n\n![](img/9ace97a2843cb2b456279738df7b8b56_116_0.png)\n\
