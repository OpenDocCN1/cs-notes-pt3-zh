  md: "\n## 3.4 自下而上分析\n\n![](img/9ace97a2843cb2b456279738df7b8b56_325_0.png)\n\n\
    | 栈 | 输入 | 动作 |\n|---|---|---|\n| $ | id₁ * id₂ + id₃ $ | 移进 |\n| $ id₁ | * id₂\
    \ + id₃ $ | 按 E → id 归约 |\n| $E | * id₂ + id₃ $ | 移进 |\n| $E* | id₂ + id₃ $ |\
    \ 移进 |\n| $E* id₂ | + id₃ $ | 按 E → id 归约 |\n| $E*E | + id₃ $ | 移进 |\n| $E*E+\
    \ | id₃ $ | 移进 |\n| $E*E+id₃ | $ | 按 E → id 归约 |\n| $E*E+E | $ | 按 E → E+E 归约\
    \ |\n| $E*E | $ | 按 E → E*E 归约 |\n| $E | $ | 接受 |\n\n使用移进-归约方式，即使知道了应该进行归约，也还有两个问题必须解决：\n\
    \n- 确定右句型中将要归约的子串\n- 如何确定选择哪一个产生式\n\n### 3.4.4 移进-归约分析的冲突\n\n**1. 移进-归约冲突**\n\n\
    **例**\n\n```text\nstmt → if expr then stmt\n     | if expr then stmt else stmt\n\
    \     | other\n```\n\n如果移进-归约分析器处于格局：\n\n```text\n栈                         输入\n\
