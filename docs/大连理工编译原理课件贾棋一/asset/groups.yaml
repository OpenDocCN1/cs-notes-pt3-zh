    \n## 2.5 词法分析器的生成器\n\n### 用Lex建立词法分析器的步骤\n\nLex源程序lex.l → Lex编译器 → lex.yy.c\n\n\
    lex.yy.c → C编译器 → a.out\n\n输入流 → a.out → 记号序列\n\n### Lex程序包括三个部分\n\n声明  \n%% \
    \ \n翻译规则  \n%%  \n辅助过程\n\n### Lex程序的翻译规则\n\np1 {动作1}  \np2 {动作2}  \n... ...  \n\
    pn {动作n}\n\n### 例——声明部分\n\n```c\n%{\n/* 常量LT, LE, EQ, NE, GT, GE, WHILE, DO, ID,\n\
    \   NUMBER, RELOP的定义*/\n%}\n/* 正规定义 */\ndelim       [ \\t\\n ]\nws          {delim}+\n\
    letter      [A-Za-z]\ndigit       [0-9]\nid           {letter}({letter}|{digit})*\n\
    number      {digit}+(\\.{digit}+)?(E[+\\-]?{digit}+)?\n```\n\n### 例——辅助过程部分\n\n\
    ```c\ninstall_id () {\n/* 把词法单元装入符号表并返回指针。\nyytext指向该词法单元的第一个字符，\nyyleng给出的它的长度\
    \ */\n}\n\ninstall_num () {\n/* 类似上面的过程，但词法单元不是标识符而是数 */\n}\n```\n\n### 用 Lex\
    \ 定义常规表达式\n\n| 符号 | 说明 |\n|------|------|\n| . | 匹配任意字符，除了 `\\n` |\n| - | 指范围\
    \ [A-Za-z0-9] |\n| $ | 行的结尾 |\n| {} | 模式可能出现的次数，例如 A{1,3} 表示可能出现 1 次或 3 次 |\n\
    | ^ | 否定,操作符 ^ 只能出现在左中括号后的第一个字符位置处 [^abc] |\n| * ? + 等 | 常用的闭包、逻辑或等操作 |\n\n###\
    \ Lex中重要的外部变量\n\n- `yytext`：外部字符数组，其内容是当前被某个规则匹配的字符串\n- `yyleng`：当前 `yytext` 中的字符的个数\n\
    \n例：\n\n```c\n[a-zA-Z]+    printf(\"word= %s, length=%d\", yytext, yyleng);\n\
    ```\n\n```c\n另外[a-zA-Z]+ printf(\"%s\",yytext);可以简写成\n[a-zA-Z]+    ECHO;\n```\n\
    \n- **`yyin`**：`FILE*` 类型。它指向 lexer 正在解析的当前文件。\n- **`yyout`**：`FILE*` 类型。它指向记录\
    \ lexer 输出的位置。缺省情况下，`yyin` 和 `yyout` 都指向标准输入和输出。\n- 以上两个经常和函数 `yywrap()` 连用，如果函数的返回值是\
    \ 1，就停止解析。因此它可以用来解析多个文件。代码可以写在第三段，这就能够解析多个文件。方法是使用 `yyin` 文件指针指向不同的文件，直到所有的文件都被解析。最后，`yywrap()`\
    \ 可以返回 1 来表示解析的结束。\n- **`yylineno`**：给出当前的行数信息\n\n### Lex中识别规则的二义性处理\n\n- 能匹配最多字符的规则优先\n\
    - 能匹配相同数目的字符的规则，书写顺序在前的优先\n\neg:\n```text\ninteger   keyword action ...;\n[a-z]+\
    \    identifier action ...;\n```\n当输入为 `jintegers` 时，匹配 `[a-z]+`\n"
