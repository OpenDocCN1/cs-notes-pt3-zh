    \n遍\n\n第二遍：粉刷全部墙面的水泥\n\n![](img/9ace97a2843cb2b456279738df7b8b56_45_0.png)\n\n\
    遍\n\n第三遍：给整个墙面贴上瓷砖\n\n![](img/9ace97a2843cb2b456279738df7b8b56_46_0.png)\n\n网线\n\
    \n水泥\n\n瓷砖\n\n方法二：\n\n一遍：一边布网线，一边粉刷水泥，一边贴瓷砖\n\n![](img/9ace97a2843cb2b456279738df7b8b56_47_0.png)\n\
    \n![](img/9ace97a2843cb2b456279738df7b8b56_47_1.png)\n\n![](img/9ace97a2843cb2b456279738df7b8b56_47_2.png)\n\
    \n遍（趟）：\n\n- **一遍或一趟**：是指编译程序在编译时刻把源程序或源程序的等价物（中间程序）从头到尾扫描一遍并转换成另一紧邻的等价物的全过程。\n\
    - **单遍扫描与多遍扫描**：每一遍的扫描可完成上述一个阶段或多个阶段的工作。每一遍的输入都是上一遍的输出，第一遍的输入是源程序正文，最后一遍的输出是目标代码。\n\
    - **单遍与多遍的比较**：\n  - 遍数多：编译器结构清晰，但时间效率不高\n  - 遍数少：编译速度快，但对机器的内存要求高\n- **遍数的确定**：主要因素是源程序和机器（目标机）的特征。\n\
    \n## 编程语言演义\n\n### 编程语言\n\n- 机器语言\n  - **机器语言特点**\n    - 0、1串\n    - 打卡输入\n  \
    \  - `c7 06 0000 0002`\n      - ⊕ mov x, c 其中符号x的地址是0000，c=2\n    - 计算机可以直接理解机器语言程序\n\
    \  - **机器语言缺点**\n    - 可读性差\n    - 可维护性差\n- 汇编语言\n  - `mov x,2` 与 `c7 06 0000\
    \ 0002` 的对应：\n\n```\nmov x,2\n```\n\n```\nc7 06 0000 0002\n```\n\n  - 变量x的地址可以由汇编器维护，而不需要固定到某个绝对地址\n\
    - 高级语言（Fortran, C, Java, ...）\n  - **高级语言形式**\n    - 赋值语句：x=2\n    - 贴近人类思维方式，贴近实际问题描述形式\n\
    \    - 计算机无法直接理解\n    - 需要编译器辅助，将其转换为机器语言形式\n\n## 1.2 编译器技术的应用\n\n### 高级语言的实现\n\
    \n- 每一轮编程语言新特征的出现都刺激编译器优化的新研究\n- 支持用户定义的聚合数据类型和高级控制流，如数组和记录、循环和过程调用：C、Fortran\n\
    - 面向对象的主要概念是数据抽象和性质继承，使得程序更加模块化并易于维护：Smalltalk、C++、C#、Java\n- 类型安全的语言：Java没有指针，也不允许指针算术。它用无用单元收集机制来自动地释放那些不再使用的变量占据的内存\n\
    \n### 针对计算机体系结构的优化\n\n- 计算体系结构迅速演化引起对新的编译器技术一种不知足的需要\n- **并行化**\n  - 编译器重新整理指令，使得指令级并行更有效\n\
    \  - 编译器从传统的串行程序自动生成并行代码，使之运行于多处理器上\n\n### 内存分层\n\n- 编译器优化历来集中在优化处理器的执行上，但是现在更强调要使内存分层更有效\n\
    \n### 新计算机体系结构的设计\n\n- 现在计算机系统的性能不仅仅取决于它的原始速度，还取决于编译器是否能生成充分利用其特征的代码\n- 在现代计算机体系结构的研究中，在处理器的设计阶段就开发编译器，并将编译生成的代码在模拟器上运行，以评价拟采用体系结构的特征\n\
    - 编译器技术影响计算机体系结构设计的一个著名例子是精简指令集计算机（RISC）的发明\n\n### 程序翻译\n\n#### 二进制翻译\n\n编译器技术可用于把一种机器的二进制代码翻译成另一种机器的代码，以运行原先为别的指令集编译的代码\n\
    \n#### 数据库查询解释器\n\n数据库查询由一些谓词组成，这些谓词由包含关系运算的布尔表达式组成，可以被解释执行，也可以被编译成搜索数据库的命令\n\n\
