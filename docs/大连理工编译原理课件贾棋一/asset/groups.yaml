    # # BASIC年代的解释器


    +   - 功能：它将高级语言的源程序翻译成一种中间语言程序，然后对中间语言程序进行解释执行


    +   - 在那个年代，编译和解释两个功能是合在一个程序中，该程序被称为解释器


    # # Java年代的解释器


    +   - 解释器的上述两个功能分在两个程序中


    +   - 前一个叫做编译器，它把源程序翻译成一种叫做字节码的中间语言程序


    +   - 后一个叫做解释器，它对字节码程序进行解释执行'
