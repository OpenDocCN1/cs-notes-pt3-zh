    # # 1.2 编译器技术的应用


    针对计算机体系结构的优化


    +   - 计算体系结构迅速演化引起对新的编译器技术一种不知足的需要


    +   - 并行化

    +     - 编译器重新整理指令，使得指令级并行更有效

    +     - 编译器从传统的串行程序自动生成并行代码，使之运行于多处理器器上


    内存分层


    +   - 编译器优化历来集中在优化处理器的执行上，但是现在更强调要使内存分层更有效'
