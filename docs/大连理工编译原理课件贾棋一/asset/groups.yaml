    # 1.2 编译器技术的应用


    # 高级语言的实现


    +   - 每一轮编程语言新特征的出现都刺激编译器优化的新研究

    +   - 支持用户定义的聚合数据类型和高级控制流，如数组和记录、循环和过程调用：C、Fortran

    +   - 面向对象的主要概念是数据抽象和性质继承，使得程序更加模块化并易于维护：Smalltalk、C++、C#、Java

    +   - 类型安全的语言：Java没有指针，也不允许指针算术。它用无用单元收集机制来自动地释放那些不再使用的变量占据的内存'
