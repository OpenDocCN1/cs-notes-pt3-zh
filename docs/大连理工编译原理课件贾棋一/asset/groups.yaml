    \ (5 == c) then ...\n```\n\n```\nif (5 = c) then...\n```\n\n编译器报错\n\n可以肯定地说，你们中的\
    \ 95% 以上的人在一辈子的生涯中都没有机会去实现一个真正的复杂语言的编译器。但是每一个人都绝对遇到需要使用编译技术的项目。\n\n以下就是一些小的“编译器”。\n\
    \n**普通计算器**\n\n![](img/9ace97a2843cb2b456279738df7b8b56_10_0.png)\n![](img/9ace97a2843cb2b456279738df7b8b56_10_1.png)\n\
    \n**可编程计算器**\n\n![](img/9ace97a2843cb2b456279738df7b8b56_10_2.png)\n![](img/9ace97a2843cb2b456279738df7b8b56_10_3.png)\n\
    \n各种数据库查询语言及专家系统\n\n```sql\nselect 课程\nfrom table 课程表\nwhere 任课老师=贾某\n```\n\n\
    在计算机专业考研或者各大公司招聘时，必考内容。在 x86/Linux 工作站上，以下两个结构的 size 分别是 20 和 16，为什么不一样？\n\n```c\n\
    typedef struct  _a{\n    char   c1;\n    long   i;\n    char   c2;\n    double\
    \ f;\n}a;\ntypedef struct  _b{\n    char   c1;\n    char   c2;\n    long   i;\n\
    \    double f;\n}b;\n```\n\n**vc 结果 vs Linux 下 gcc 的结果**\n\n```text\nsizeof(a)=24\n\
    a 的首地址是 12ff68\na.c1 的首地址是 12ff68\na.i 的首地址是 12ff6c\na.c2 的首地址是 12ff70\na.f 的首地址是\
    \ 12ff78\nsizeof(b)=16\nb 的首地址是 12ff58\nb.c1 的首地址是 12ff58\nb.c2 的首地址是 12ff59\n\
    b.i 的首地址是 12ff5c\nb.f 的首地址是 12ff60\nPress any key to continue.\n```\n\n```text\n\
    Password for ljzl:\nlogin: Resource temporarily unavailable while getting\nLast\
    \ login: Tue Aug 19 09:30:46 from 10.4.125.95\n[ljzl@servertd1 ~]$ cd chity\n\
    [ljzl@servertd1 chity]$ cd src\n[ljzl@servertd1 src]$ st\nsizeof(a)=24\na 的首地址是\
    \ bffff750\na.c1 的首地址是 bffff750\na.i 的首地址是 bffff754\na.c2 的首地址是 bffff758\na.f\
    \ 的首地址是 bffff75c\nsizeof(b)=16\nb 的首地址是 bffff740\nb.c1 的首地址是 bffff740\nb.c2 的首地址是\
    \ bffff741\nb.i 的首地址是 bffff744\nb.f 的首地址是 bffff748\n[ljzl@servertd1 src]$\n```\n\
    \nvc6 中的编译选项有 /Zp[1|2|4|8|16]，/Zp1 表示以 1 字节边界对齐，相应的，/Zpn 表示以 n 字节边界对齐。n 字节边界对齐的意思是说，一个成员的地址必须安排在成员的尺寸的整数倍地址上或者是\
    \ n 的整数倍地址上，取它们中的最小值。\n\n要使用这个选项，可以在 vc6 中打开工程属性页，C/C++ 页，选择 Code Generation 分类，在\
    \ Struct member alignment 中可以选择。\n\n### 编译技术研究对象：编译器的构造与分析\n\nC, C++, Pascal,\
    \ Delphi, VC, BC\n\n![](img/9ace97a2843cb2b456279738df7b8b56_16_0.png)\n\n## BASIC\
    \ 年代的解释器\n\n- 功能：它将高级语言的源程序翻译成一种中间语言程序，然后对中间语言程序进行解释执行\n- 在那个年代，编译和解释两个功能是合在一个程序中，该程序被称为解释器\n\
    \n## Java 年代的解释器\n\n- 解释器的上述两个功能分在两个程序中\n- 前一个叫做编译器，它把源程序翻译成一种叫做字节码的中间语言程序\n-\
    \ 后一个叫做解释器，它对字节码程序进行解释执行\n\n## 编译器和解释器的区别\n\n### 三种奶牛三种嗜好\n\n![](img/9ace97a2843cb2b456279738df7b8b56_18_0.png)\n\
    ![](img/9ace97a2843cb2b456279738df7b8b56_18_1.png)\n\n### 改进后的方案\n\n![](img/9ace97a2843cb2b456279738df7b8b56_19_0.png)\n\
    \n牧草 = 我们的各种编程语言，C/C++/C#, Java, Pascal, PHP, Perl, JavaScript 等；切割机 = 各种编译器；奶牛\
    \ = 各种 CPU，比如 x86、ARM、MIPS 等。奶牛会有吃不同形状牧草的嗜好，这个奇怪的比喻是为了表示不同的 CPU 接受不同的机器语言。\n\n\
    - C, C++, Pascal 源代码 → 编译器 → 运行 → x86 / ARM / MIPS\n- PHP, JavaScript, Python,\
    \ Perl 源代码 → 解释器 → 运行 → x86 / ARM / MIPS\n\n![](img/9ace97a2843cb2b456279738df7b8b56_22_0.png)\n\
    \n编译器是把源程序的每一条语句都编译成机器语言，并保存成二进制文件，这样运行时计算机可以直接以机器语言来运行此程序，速度很快；而解释器则是在执行程序时，才一条一条地解释成机器语言给计算机来执行，所以运行速度不如编译后的程序运行得快。\n\
    \n## 第一章 引论\n\n- **翻译器**：把一种语言变换到另外一种语言的软件。这两种语言分别称为**源语言**和**目标语言**。\n- **编译器**：一种翻译器，它的**目标语言**比**源语言**低级。\n"
