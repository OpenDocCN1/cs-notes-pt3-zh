  md: "\n## 3.5 LR分析器\n\n### LR分析方法的特点\n\n- 栈中的文法符号总是形成一个活前缀。\n- 分析表的转移函数本质上是识别活前缀的DFA。\n\
    - 栈顶的状态符号包含了确定句柄所需要的一切信息。\n- 是已知的最一般的无回溯的移进-归约方法。\n- 能分析的文法类是预测分析法能分析的文法类的真超集。\n\
    - 能及时发现语法错误。\n\n### 缺点\n\n- 手工构造分析表的工作量太大。\n\n### LR分析方法和LL分析方法的比较\n\n|  | LR(1)方法\
    \ | LL(1)方法 |\n|---|---|---|\n| 建立分析树的方式 | 自下而上 | 自上而下 |\n| 归约还是推导 | 规范归约 | 最左推导\
    \ |\n| 决定使用产生式的时机 | 看见产生式整个右部推出的东西后才算是看准了用哪个产生式进行归约 | 看见产生式右部推出的第一个终结符后便确定用哪个产生式进行推导\
    \ |\n| 对文法的显式限制 | 对文法没有限制 | 无左递归、无公共左因子 |\n| 分析表比较 | 状态×文法符号，分析表大 | 非终结符×终结符，分析表小\
    \ |\n| 分析栈比较 | 状态栈，通常状态比文法符号包含更多信息 | 文法符号栈 |\n\n在下面的推导中，最后一步用的是 \\(A \\to \\beta\\\
    )。\n\n\\(S \\Rightarrow_{rm}^* \\gamma A b w \\Rightarrow_{rm} \\gamma \\beta\
    \ b w\\)\n\nLR(1)决定用该产生式的位置\n\nLL(1)决定用该产生式的位置\n\n### 3.5.3 构造SLR分析表\n\n**LR(0)项目（简称项目）**\n\
    \n在右部的某个地方加点的产生式。\n\n例：A→XYZ对应有四个项目\n\n- A → ·XYZ\n- A → X·YZ\n- A → XY·Z\n- A\
    \ → XYZ·\n\n例：A→ε只有一个项目\n\n- A → ·\n\n> 点的左边代表历史信息，右边代表展望信息。直观地讲，项目表示在分析过程的某一阶段，已经看到了产生式的多大部分，以及希望看到的部分。\n\
    \n### 从文法构造识别活前缀的DFA\n\n**1. 拓广文法**\n\n当且仅当分析器使用E' -> E归约时，宣告分析成功。\n\n文法：\n\n\
    E' → E  \nE → E + T | T  \nT → T * F | F  \nF → ( E ) | id\n\n推导：\n\nid + id \
    \ \nF + id  \nT + id  \nE + id  \nE + F  \nE + T  \nE\n\nE ⇒rm E+T ⇒rm E+F ⇒rm\
    \ E+id ⇒rm T+id ⇒rm F+id ⇒rm id+id\n\n**2. 构造LR(0)项目集规范族**\n\n闭包函数closure(I)：\n\
    \n1. I的每个项目均加入closure(I)\n2. 如果A→α·Bβ在closure(I)中，且B→γ是产生式，那么如果项目B→·γ还不在closure(I)中的话，那么把它加入。\n\
    \nI0：\n\n- E'→·E\n- E→·E+T\n- E→·T\n- T→·T*F\n- T→·F\n- F→·(E)\n- F→·id\n\n（核心项目\
    \ ○：E'→·E 及所有的点不在左端的项目；非核心项目，通过对核心项目求闭包而获得）\n\nI1 := goto(I0, E)\n\n- E'→E·\n\
    - E→E·+T\n\n文法：\n\nE' → E  \nE → E + T | T  \nT → T * F | F  \nF → ( E ) | id\n\
    \n## 习题\n\n3.15\n\n![](img/9ace97a2843cb2b456279738df7b8b56_374_0.png)\n\n## 温故知新\n\
    \n上下文无关文法、最左推导、自上而下、自下而上、最右推导、句柄、归约、移进-归约冲突、移进-归约分析、归约-归约冲突、递归下降预测分析、非递归的预测分析、LR文法\n\
    \n输入 a<sub>1</sub> ... a<sub>i</sub> ... a<sub>n</sub> $\n\nLR分析程序\n\n输出\n\n简单的LR方法（SLR）、规范的LR方法、向前看的LR方法（LALR）、LR分析器的模型\n\
    \n活前缀：右句型的前缀，该前缀不超过最右句柄的右端\n\nLL(1)文法、2个函数\n\n1. 句柄与某个产生式的右部符号串相同\n2. 句柄是句型的一个子串\n\
    3. 把句柄归约成非终结符代表了最右推导过程的一步\n\nSchool of Software, Dalian University of Technology\n\
    \n1/41\n\n![](img/9ace97a2843cb2b456279738df7b8b56_375_0.png)\n![](img/9ace97a2843cb2b456279738df7b8b56_375_1.png)\n\
    ![](img/9ace97a2843cb2b456279738df7b8b56_375_2.png)\n![](img/9ace97a2843cb2b456279738df7b8b56_375_3.png)\n"
