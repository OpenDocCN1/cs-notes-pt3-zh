  md: "\n## 第一章 引论\n\n### 类比：刷墙艺术中的“遍”的概念\n\n方法一：\n\n第一遍：布上全部网线\n\n![](img/9ace97a2843cb2b456279738df7b8b56_44_0.png)\n\
