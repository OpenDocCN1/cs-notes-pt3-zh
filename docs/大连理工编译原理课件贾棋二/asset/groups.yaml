    # # 标记非终结符的加入对文法的影响


    新的产生式的引入不会对LL(1)文法产生影响，因为LL(1)文法本身符合L属性定义，新加入一个产生式之后不会对分析造成影响。


    但是LR(1)文法对标记非终结符的加入比较敏感，例如文法L → Lb|a 为LR(1)文法，加了M之后为：


    +   L → MLb|a

    +   M → ε'
