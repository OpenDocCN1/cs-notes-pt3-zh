    # # 第六章 运行时存储空间的组织和管理


    过程P一次**活动的生存期**，指的是从执行该过程体第一步操作到最后一步操作之间的操作时间，包括执行P时调用其它过程花费的时间。


    +   - 过程可以是**递归的**


    +   - 一个过程可对应多个活动'
