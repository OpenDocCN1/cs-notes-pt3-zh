  md: "\n\n## 4.3 L属性定义的自上而下计算\n\n### 4.3.2 翻译方案\n\n例 把有加和减的中缀表达式翻译成后缀表达式\n如果输入是8+5−2，则输出是8\
    \ 5 + 2 −。\n\n```\nE → T R\nR → addop T {print (addop.lexeme)} R₁ | ε\nT → num\
    \ {print (num.val)}\n```\n\n```\nE ⇒ T R ⇒ num {print (8)} R\n⇒ num {print (8)}\
    \ addop T {print (+)} R\n⇒ num {print (8)} addop num {print (5)} {print (+)} R\n\
    … {print (8)} {print (5)} {print (+)} addop T {print (−)} R\n… {print (8)} {print\
    \ (5)} {print (+)} {print (2)} {print (−)}\n```\n\n### 翻译模式示例：把带加号和减号的中缀表达式翻译成相应的后缀表达式\n\
    \nE→TR\nR→addop T {print(addop.lexeme)} R₁ | ε\nT→num {print(num.val)}\n例：8+5-2\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_160_0.png)\n\n### 建立翻译模式\n\n当只需要综合属性时：为每一个语义规则建立一个包含赋值的动作，并把这个动作放在相应的产生式右边的末尾。\n\
    \n产生式    语义规则\n\nT→T₁*F    T.val:=T₁.val×F.val\n\n建立产生式和语义动作：\n\nT→T₁*F    {T.val:=T₁.val×F.val}\n\
    \n### 建立翻译模式\n\n如果既有综合属性又有继承属性，在建立翻译模式时就必须保证：\n\n- 产生式右边的符号的继承属性必须在先于这个符号的动作中计算出来。\n\
    - 一个动作不能引用这个动作右边的符号的综合属性。\n- 产生式左边非终结符的综合属性只有在它所引用的所有属性都计算出来以后才能计算。计算这种属性的动作通常可放在产生式右端的末尾。\n\
    \nS→A₁A₂ {A₁.in:=1; A₂.in:=2}  \nA→a print(A.in)\n\n### 4.3 L属性定义的自上而下计算\n\n例\
    \ 数学排版语言EQN\n\nE sub 1 .val\n\nS → B\nB → B₁ B₂\nB → B₁ sub B₂\nB → text\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_163_0.png)\n\
    \n### 4.3 L属性定义的自上而下计算\n\n例 数学排版语言EQN  \nE sub 1 .val\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_164_0.png)\n\
    \n| 产生式 | 语义规则 |\n|---|---|\n| S → B | B.ps := 10; S.ht := B.ht |\n| B → B₁ B₂\
    \ | B₁.ps := B.ps; B₂.ps := B.ps; B.ht := max(B₁.ht, B₂.ht) |\n| B → B₁ sub B₂\
    \ | B₁.ps:=B.ps; B₂.ps:= shrink(B.ps); B.ht := disp (B₁.ht, B₂.ht) |\n| B → text\
    \ | B.ht := text.h × B.ps |\n\n### 例 数学排版语言EQN\n\nS → {B.ps := 10 } B {S.ht :=\
    \ B.ht}\n\nB → {B₁.ps := B.ps } B₁ {B₂.ps := B.ps } B₂ {B.ht := max(B₁.ht, B₂.ht\
    \ ) }\n\nB → { B₁.ps :=B.ps } B₁ sub { B₂.ps := shrink(B.ps) } B₂ {B.ht := disp\
    \ (B₁.ht, B₂.ht ) }\n\nB → text{B.ht := text.h × B.ps }\n\n1. 产生式右边的符号的继承属性必须在先于这个符号的动作中计算出来。\n\
    2. 一个动作不能引用这个动作右边的符号的综合属性。\n3. 产生式左边非终结符的综合属性只有在它所引用的所有属性都计算出来以后才能计算。计算这种属性的动作通常放在产生式右端的末尾。\n\
    \n### 习题\n\n4.1, 4.3, 4.5\n\n### 课后阅读部分，不要求掌握\n\n#### 逆波兰记号\n\n逆波兰记号是最简单的一种中间代码表示形式。\n\
    \n这种表示法将运算对象写在前面，把运算符号写在后面，比如把a+b写成ab+，把a*b写成ab*，用这种表示法表示的表达式也称做后缀式。\n\n#### 逆波兰表示\n\
    \n| 程序设计语言中的表示 | 逆波兰表示 |\n|---|---|\n| a+b | ab+ |\n| a+b*c | abc*+ |\n| (a+b)*c\
    \ | ab+c* |\n| a:=b*c+b*d | abc*bd*+:= |\n\n后缀表示法表示表达式，其最大的优点是易于计算机处理表达式。常用的算法是使用一个栈，自左至右扫描算术表达式（后缀表示），每扫描到运算对象，就把它推进栈；扫描到运算符，若该运算符是二目的，则对栈顶部的两个运算对象实施该运算，并将运算结果代替这两个运算对象而进栈；若是一目运算符，则对栈顶元素执行该运算，并以运算结果代替该元素进栈，最后的结果留在栈顶。\n\
    \n例如 B@CD*+（它的中缀表示为—B+C*D，使用@表示一目减）的计值过程为：\n\n1. B进栈；\n2. 对栈顶元素施行一目减运算，并将结果代替栈顶，即一B置于栈顶；\n\
    3. C进栈；\n4. D进栈；\n5. 栈顶两元素相乘，两元素退栈，相乘结果置栈顶；\n6. 栈顶两元素相加，两元素退栈，相加结果进栈，现在栈顶存放的是整个表达式的值。\n\
    \n逆波兰表示很容易扩充到表达式以外的范围。只要遵守运算对象后直接紧跟它们的运算符的规则即可。比如把转语句GOTO L写为 “L jump ”，运算对象L为语句标号，运算符jump表示转到某个标号。再比如条件语句if\
    \ E then S1 else S2可表示为： ES1S2¥，把if then else看成三目运算符，用¥来表示。\n\n### 4.3 L属性定义的自上\n\
    \n关于算术表达式的左递归文法模式\n\n- E→E₁+T  \n- E→E₁-T  \n- E→T  \n- T→(E)  \n- T→num\n\n-\
    \ {E.val:=E₁.val+T.val}  \n- {E.val:=E₁.val-T.val}  \n- {E.val:=T.val}  \n- {T.val:=E.val}\
    \  \n- {T.val:=num.val}\n\n- E → T R  \n- R → + T R₁  \n- R → - T R₁  \n- R →\
    \ ε  \n- T → ( E )  \n- T → num\n\n### 消除左递归，构造新的翻译模式\n\nE → T　{R.i := T.val}\n\
    R　{E.val := R.s}\n\nR → +\nT　{R₁.i := R.i + T.val}\nR₁　{R.s := R₁.s}\n\nR → -\n\
    T　{R₁.i := R.i - T.val}\nR₁　{R.s := R₁.s}\n\nR → ε　{R.s := R.i}\n\nT → ( E )　{T.val\
    \ := E.val}\n\nT → num　{T.val := num.val}\n\n| 产生式 |\n|---|\n| E → T R |\n| R\
    \ → + T R₁ |\n| R → - T R₁ |\n| R → ε |\n| T → ( E ) |\n| T → num |\n\nR.i：R 前面子表达式的值\
    \  \nR.s：分析完 R 时子表达式的值\n\n### 计算表达式9 - 5 + 2\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_174_0.png)\n\
    \nE.val=6\n\nT.val=9 → R.i=9\n\nnum.val=9\n\nR.s=6\n\nT.val=5 → R.i=4\n\nnum.val=5\n\
    \nR.s=6\n\nT.val=2 → R.i=6\n\nnum.val=2\n\n| 产生式 | 语义规则 |\n|---|---|\n| `E → T`\
    \ | `{ E.val := T.val }` |\n| `R → + T` | `{ R₁.i := R.i + T.val }` |\n|  | `{\
    \ R.s := R₁.s }` |\n| `R → - T` | `{ R₁.i := R.i - T.val }` |\n|  | `{ R.s :=\
    \ R₁.s }` |\n| `R → ε` | `{ R.s := R.i }` |\n| `T → ( E )` | `{ T.val := E.val\
    \ }` |\n| `T → num` | `{ T.val := num.val }` |\n\n"
