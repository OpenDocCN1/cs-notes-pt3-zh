    \ 的执行结果使得 `a` 等于 3，进一步执行 `z:=z+x` 使得 `a=8`。\n\n- **(c)** 复写—恢复调用等价于下面的执行序列：\n\n\
    ```text\nt:=a+b;  x:=t;  y:=a;  z:=a;    ——实参的值传给形参\ny:=y+1;\nz:=z+x;\nt:=x; \
    \   a:=y;  a:=z;             ——形参的结果传给实参\n```\n\n- 如果回送形式参数值的次序反过来的话，则调用后 `a`\
    \ 的结果是 3。\n\n## 第七部分\n\n把算术表达式-(a+b)*(b+c)翻译成(a)语法树(b)无环有向图dag(c)后缀表示(d)三地址代码。\n\
