  md: "\n\n## 4.2 S属性定义的自下而上计算\n\n### 4.2.1 语法树\n\n- 语法树是分析树的浓缩表示：算符和关键字作为内部结点。\n\
    - 语法制导翻译可以基于分析树，也可基于语法树。\n- 语法树的例子：\n\n```\nS → if B then S1 else S2\n```\n\n\
