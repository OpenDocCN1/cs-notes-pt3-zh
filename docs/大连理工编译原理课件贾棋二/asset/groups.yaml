    # # 建立抽象语法树的语义规则


    | 产生式    | 语义规则    |

    |---|---|

    | E→E₁+T    | E.nptr := mknode( ‘+’, E₁.nptr, T.nptr ) |

    | E→E₁-T    | E.nptr := mknode( ‘-’, E₁.nptr, T.nptr ) |

    | E→T    | E.nptr := T.nptr    |

    | T→ (E)    | T.nptr := E.nptr    |

    | T→id    | T.nptr := mknode( id, id.entry )    |

