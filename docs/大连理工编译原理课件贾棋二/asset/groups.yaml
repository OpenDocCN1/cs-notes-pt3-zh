    | E→E₁+T    | E.nptr := mknode( ‘+’, E₁.nptr, T.nptr ) |\n| E→E₁-T    | E.nptr\
    \ := mknode( ‘-’, E₁.nptr, T.nptr ) |\n| E→T    | E.nptr := T.nptr    |\n| T→\
