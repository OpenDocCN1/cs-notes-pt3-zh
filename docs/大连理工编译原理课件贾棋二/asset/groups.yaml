    S->acS'|cS'\nS'->acS'|ε\nQ->Sa|a\n```\n\n### 自下而上分析部分知识点\n\n- SLR的DFA的构造及分析表的构成\n\
    - 初始项目集合的产生（拓广文法）\n- 能够识别同一符号的项目都转移到同一集合中\n- 求闭包过程中每一个“.”后面的非终结符都要重新考虑是否已经在状态中列出\n\
    - 对产生式A-> α 规约，“ri”写在FOLLOW(A)集合中元素对应的位置。\n\n- **LR、LALR的构造方法**（在SLR的基础上加上搜索符）\n\
    \  - 搜索符的求法，根据造成目前项目出现的那个父项目来求。\n  - 求闭包的过程中可能出现要添加的项目已经存在，但是搜索符不同的情况，相当于其父项目已经改变，此时需要再求一遍搜索符。\n\
    \n- **SLR、LR、LALR的区别及判别方法**\n  - 通过构造DFA，看其中的状态是否有冲突（“移进—规约”或“规约—规约”）若有冲突则不属于该文法类型。\n\
    \  - 通过构造分析表，看其中某项是否有冲突。\n\n文法G[S]:\n\n```text\nS->AaS | bAe | BeS | bBa\nA->d\n\
    B->d\n```\n\n判断这个文法类型是SLR(1)、LR(1)还是LALR(1)?\n\n### 补充题1\n\n下面的二义文法描述命题演算公式的语法，为它写一个等价的非二义文法\n\
    \n```text\nS → S and S | S or S | not S | p | q | (S)\n```\n\n非二义文法的产生式如下：\n\n\
    ```text\nE → E or T | T\nT → T and F | F\nF → not F | ( E) | p | q\n```\n"
