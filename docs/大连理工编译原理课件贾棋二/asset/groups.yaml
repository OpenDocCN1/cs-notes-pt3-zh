    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_320_1.png)\n\n返回值和参数  \n控制链  \n访问链和机器状态\
    \  \n局部数据临时数据  \n\n返回值和参数  \n控制链  \n访问链和机器状态  \n局部数据临时数据  \n\n8  \n4  \n\n4\n\n\
    8 4 -，即 8-4=4\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_322_0.png)\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_322_1.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_323_0.png)\n\n8 4 - 2 +，即 8-4+2=6\n\
    \n#### 7.1.2 图形表示\n\n语法树是一种图形化的中间表示\n\n(a) 语法树\n\na := (-b + c*d ) + c*d的图形表示\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_324_0.png)\n\n- 语法树是一种图形化的中间表示\n- 有向无环图也是一种中间表示\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_325_0.png)\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_325_1.png)\n\
    \na := (-b + c*d) + c*d 的图形表示\n\n**构造赋值语句语法树的语法制导定义**\n\n| 产生式 | 语义规则 |\n|---|---|\n\
    | $S \\rightarrow id := E$ | $S.nptr := mknode('assign', mkleaf(id, id.entry),\
    \ E.nptr)$ |\n| $E \\rightarrow E_1 + E_2$ | $E.nptr := mknode('+', E_1.nptr,\
    \ E_2.nptr)$ |\n| $E \\rightarrow E_1 * E_2$ | $E.nptr := mknode('*', E_1.nptr,\
    \ E_2.nptr)$ |\n| $E \\rightarrow -E_1$ | $E.nptr := mkunode('uminus', E_1.nptr)$\
    \ |\n| $E \\rightarrow (E_1)$ | $E.nptr := E_1.nptr$ |\n| $F \\rightarrow id$\
    \ | $E.nptr := mkleaf(id, id.entry)$ |\n\n#### 7.1.3 三地址代码\n\n一般形式：x := y op z\n\
    \n表达式x + y * z翻译成的三地址语句序列是\n\nt₁ := y * z\nt₂ := x + t₁\n\n> 临时变量还记得活动记录中局部变量下面的临时数据区吗？\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_327_0.png)\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_327_1.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_327_2.png)\n\n三地址代码是语法树或dag的一种线性表示\n\
    \na := (-b + c*d ) + c*d\n\n语法树的代码：\n\n```\nt₁ := -b\nt₂ := c * d\nt₃ := t₁ +\
    \ t₂\nt₄ := c * d\nt₅ := t₃ + t₄\na := t₅\n```\n\ndag的代码：\n\n```\nt₁ := -b\nt₂\
    \ := c * d\nt₃ := t₁ + t₂\nt₄ := t₃ + t₂\na := t₄\n```\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_328_0.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_328_1.png)\n\n**本节常用的三地址语句**\n\n- 赋值语句\
    \ `x := y op z`，`x := op y`，`x := y`\n- 无条件转移 `goto L`\n- 条件转移 `if x relop y goto\
    \ L`\n- 过程调用 `param x` 和 `call p, n`\n- 过程返回 `return y`\n- 索引赋值 `x := y[i]` 和\
    \ `x[i] := y`\n- 地址和指针赋值 `x := &y`，`x := *y` 和 `*x := y`\n\n## 编译原理课程总复习\n\n贾棋\n\
    \njiaqj7166@gmail.com\n\n源程序\n\n前端：依赖于源语言，独立于目标机器。\n\n符号表管理器  \n词法分析器  \n语法分析器\
    \  \n语义分析器  \n中间代码生成器  \n代码优化器  \n代码生成器  \n出错管理器  \n\n后端：依赖于目标机器，独立于源语言。\n\n目标程序\n\
    \n## 第二章 词法分析器\n\n### 词法分析器工作原理\n\n源代码 → 词法分析器 → 记号（token）流\n\n源程序字符流\n\n顺序组合\n\
    \n词法单元\n\n模式\n\n词法记号\n\n非形式化描述\n\n形式化描述\n\n正规式\n\n字母表\n\n集合\n\n组合\n\n字母\n\n串\n\
    \n集合\n\n语言\n\n名字\n\n### 词法记号的描述与识别\n\n- 正规式的例子 \\(\\Sigma = \\{a, b\\}\\)\n  -\
    \ \\(a | b\\)  \\(\\{a, b\\}\\)\n  - \\((a | b)(a | b)\\)  \\(\\{aa, ab, ba, bb\\\
    }\\)\n  - \\(aa | ab | ba | bb\\)  \\(\\{aa, ab, ba, bb\\}\\)\n  - \\(a^*\\) \
    \ 由字母 \\(a\\) 构成的所有串集\n  - \\((a | b)^*\\)  由 \\(a\\) 和 \\(b\\) 构成的所有串集\n\n- 复杂的例子\n\
    \n  \\((00 | 11 | ((01 | 10)(00 | 11)^*(01 | 10)))^*\\)\n\n  句子：010011010000100000010111001\n\
    \n### 正规定义的例子\n\nPascal语言的标识符集合\n\n- letter → A | B | … | Z | a | b | … | z\n\
    - digit → 0 | 1 | … | 9\n- id → letter (letter | digit)*\n\n### 正规定义的例子\n\nPascal无符号数集合，例1946,\
