    # 上下文无关文法


    ```

    $$E \to EAE \mid (E) \mid -E \mid id$$


    $$A \to + \mid *$$

    ```


    # 正规式定义


    +   - `letter → [A-Za-z]`

    +   - `digit → [0-9]`

    +   - `id → letter(letter|digit)*`


    +   - 上下文无关文法是一个四元组

    +   - 最左推导、最右推导

    +   - 二义性'
