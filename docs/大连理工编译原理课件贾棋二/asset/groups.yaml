    ```\n\n该文法产生的句子的形式是\n\n```\nbegin d ; d ; ... ; d ; s ; s ; ... ; s end\n```\n\
    \n修改后的文法如下：\n\n```\nprogram → begin declist statement end\ndeclist → d ; declist\
    \ | d ;\nstatement → s ; statement | s\n```\n\n## 补充题 5\n\n一个C语言的文件如下，第四行的if误写成fi：\n\
    \n```\nlong gcd(p,q)\nlong p,q;\n{\n    fi (p%q == 0)\n        return q;\n   \
    \ else\n        return gcd(q, p%q);\n}\n```\n\n基于LALR（1）方法的一个编译器的报错情况如下：\n\nparse\
    \ error before ‘return’ (line 5).\n\n是否违反了LR分析的活前缀性质\n\n## 文法类的层次图\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_62_0.png)\n\
    \n## 语法制导的翻译\n\n语义分析的任务：语义分析的输入是语法分析的输出（分析树），输出是中间代码，但同时它还完成了很多语义处理工作。\n\n- 语义检查：如，类型、运算、维数、越界等。\n\
    - 语义处理：如，变量的存储分配、表达式的求值、语句的翻译（中间代码的生成）等。\n- 总目标：生成等价的中间代码。\n\n语义分析的主流技术：语法制导翻译技术。\n\
    \n### 4.1 语法制导的翻译\n\n静态语义分析通常包括：\n\n- ① 类型检查。\n- ② 控制流检查。控制流语句必须使控制转移到合法的地方。\n\
    - ③ 一致性检查。\n- ④ 相关名字检查。有时，同一名字必须出现两次或多次。例如，Ada语言程序中，循环或程序块可以有一个名字，出现在这些结构的开头和结束，编译程序必须检查这两个地方用的名字是相同的。\n\
    - ⑤ 名字的作用域分析\n\n### 语法制导的翻译\n\n动态语义处理：如果静态语义正确，语义处理则要执行真正的翻译，即，或者将源程序翻译成程序的一种中间表示形式（中间代码），或者将源程序翻译成目标代码。\n\
    \n### 语法制导的翻译\n\n- 语义动作的计算是在对应产生式被归约时进行。\n- 语义规则和产生式相联系的两种方式\n- 语法制导定义\n- 对应每一个产生式编制一个语义子程序，当一个产生式获得匹配时，调用相应的语义子程序实现语义检查与翻译。\n\
    - 语法制导的翻译方案\n- 在产生式的右部的适当位置，插入相应的语义动作，按照分析的进程，执行遇到的语义动作。\n\n### 4.1 语法制导的定义\n\n\
    #### 例 简单台式计算器的语法制导定义\n\n| 产生式 | 语义规则 |\n|---|---|\n| \\( L \\to E n \\) | \\\
    ( \\text{print}(E.val) \\) |\n| \\( E \\to E_1 + T \\) | \\( E.val := E_1.val\
    \ + T.val \\) |\n| \\( E \\to T \\) | \\( E.val := T.val \\) |\n| \\( T \\to T_1\
    \ * F \\) | \\( T.val := T_1.val * F.val \\) |\n| \\( T \\to F \\) | \\( T.val\
    \ := F.val \\) |\n| \\( F \\to (E) \\) | \\( F.val := E.val \\) |\n| \\( F \\\
    to \\text{digit} \\) | \\( F.val := \\text{digit.lexval} \\) |\n\n### 4.1 语法制导的定义\n\
    \n#### 语法制导翻译\n\n根据语法分析中产生式对应语义规则进行翻译方法称语法制导翻译。\n\n语法制导：基于语法分析中用到的文法产生式。\n\n翻译：完成语义分析的各项功能，不仅指生成中间代码。\n\
    \n### 4.1 语法制导的定义\n\n#### 4.1.1 语法制导定义的形式\n\n- 基础文法\n- 每个文法符号有一组属性\n- 每个文法产生式\
    \ $A \\to \\alpha$ 有一种形式为 $b := f(c_1, c_2, \\ldots, c_k)$ 的语义规则，其中 $f$ 是函数，$b$\
    \ 和 $c_1, c_2, \\ldots, c_k$ 是该产生式文法符号的属性。\n- 综合属性：如果 $b$ 是 $A$ 的属性，$c_1, c_2,\
    \ \\ldots, c_k$ 是产生式右部文法符号的属性或 $A$ 的其它属性。\n- 继承属性：如果 $b$ 是产生式右部某个文法符号 $X$ 的属性。\n\
    - 以上两种情况下，都说 $b$ 依赖于属性 $c_1, c_2, \\ldots, c_k$。\n\n> 属性值由分析树中它的子结点属性值来计算\n\n\
    > 属性值由结点的兄弟结点及父结点的属性值来计算。\n\n"
