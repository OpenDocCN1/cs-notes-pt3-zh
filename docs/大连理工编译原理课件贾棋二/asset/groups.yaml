  md: "\n## 本章要点\n\n- 语义规则的两种描述方法：语法制导的定义和翻译方案。\n- 设计简单问题的语法制导定义和翻译方案，这是本章的重点和难点。\n\
    - S 属性的自下而上计算（边分析边计算）。\n- L 属性的自上而下计算（边分析边计算）。\n- L 属性的自下而上计算（边分析边计算）。\n\n## 语法制导的定义\n\
    \n### 语法制导定义的形式\n\n- 每个文法符号有一组属性\n- 每个文法产生式 \\( A \\rightarrow \\alpha \\) 有一组形式为\
    \ \\( b := f(C_1, C_2, \\ldots, C_k) \\) 的语义规则，其中 \\( f \\) 是函数，\\( b \\) 和 \\\
    ( C_1, C_2, \\ldots, C_k \\) 是该产生式文法符号的属性\n- 综合属性：如果 \\( b \\) 是 \\( A \\) 的属性，\\\
    ( C_1, C_2, \\ldots, C_k \\) 是产生式右部文法符号的属性或 \\( A \\) 的其它属性。\n- 继承属性：如果 \\( b\
    \ \\) 是产生式右部某个文法符号 \\( X \\) 的属性。\n- 以上两种情况下，都说 \\( b \\) 依赖于属性 \\( C_1, C_2,\
    \ \\ldots, C_k \\)。\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_427_0.png)\n\n\
    ![](img/4571939c0321e2c5dec9f0dd5554d04d_427_1.png)\n\n## S属性定义的自下而上计算\n\n将LR分析器增加一个域来保存综合属性值。\n\
    \n若产生式 \\( A \\rightarrow XYZ \\) 的语义规则是 \\( A.a := f(X.x, Y.y, Z.z) \\)，那么归约后：\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_429_0.png)\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_429_1.png)\n\
    \n### 台式计算器的语法制导定义改成栈操作代码\n\n| 产生式 | 语义规则 |\n|---|---|\n| \\( L \\to E n \\) |\
    \ \\( \\text{print}(E.val) \\) |\n| \\( E \\to E_1 + T \\) | \\( E.val := E_1.val\
    \ + T.val \\) |\n| \\( E \\to T \\) | \\( E.val := T.val \\) |\n| \\( T \\to T_1\
    \ * F \\) | \\( T.val := T_1.val * F.val \\) |\n| \\( T \\to F \\) | \\( T.val\
    \ := F.val \\) |\n| \\( F \\to (E) \\) | \\( F.val := E.val \\) |\n| \\( F \\\
    to \\text{digit} \\) | \\( F.val := \\text{digit}.lexval \\) |\n\n| ... | ...\
    \ |\n|---|---|\n| Z | Z. z |\n| Y | Y. y |\n| X | X.x |\n| ... | ... |\n\n| 产生式\
    \ | 代码段 |\n|---|---|\n| `L → E n` | `print (val [ top-1] )` |\n| `E → E_1 + T`\
    \ | `E.val :=E_1.val +T.val` |\n| `E → T` | `E.val := T.val` |\n| `T → T_1 * F`\
    \ | `T.val := T_1.val * F.val` |\n| `T → F` | `T.val := F.val` |\n| `F → (E)`\
    \ | `F.val := E.val` |\n| `F → \\text{digit}` | `F.val := digit.lexval` |\n\n\
    ![](img/4571939c0321e2c5dec9f0dd5554d04d_433_0.png)\n\n| 产生式 | 代码段 |\n|---|---|\n\
    | `L → E n` | `print(val[top-1])` |\n| `E → E₁ + T` | `val[top-2] := val[top-2]\
    \ + val[top]` |\n| `E → T` | `E.val := T.val` |\n| `T → T₁ * F` | `T.val := T₁.val\
    \ * F.val` |\n| `T → F` | `T.val := F.val` |\n| `F → (E)` | `F.val := E.val` |\n\
    | `F → digit` | `F.val := digit.lexval` |\n\n## L属性定义的自上而下计算\n\n### L属性定义\n\n\
    - 如果每个产生式 $A\\to X_1X_2\\cdots X_n$ 的每条语义规则计算的属性是 $A$ 的综合属性；或者是 $X_j$ 的继承属性，$1\\\
    leq j\\leq n$，但它仅依赖：\n  - 该产生式中 $X_j$ 左边符号 $X_1,X_2,\\ldots,X_{j-1}$ 的属性；\n  -\
    \ $A$ 的继承属性。\n- $S$ 属性定义属于 $L$ 属性定义。\n\n### L属性定义的例子：变量类型声明的语法制导定义\n\n| 产生式 |\
    \ 语义规则 |\n|---|---|\n| $D \\to TL$ | $L.in := T.type$ |\n| $T \\to int$ | $T.type\
    \ := integer$ |\n| $T \\to real$ | $T.type := real$ |\n| $L \\to L_1,id$ | $L_1.in\
    \ := L.in;$<br>$addtype(id.entry, L.in)$ |\n| $L \\to id$ | $addtype(id.entry,\
    \ L.in)$ |\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_435_0.png)\n\n### 翻译方案\n\
    \n语义动作（语义规则）插入到产生式右部的任何地方，以表达动作的执行时刻。\n\n```\nA→B{…}C\n```\n\nL属性定义的翻译方案的三条限制：\n\
    \n- 产生式右部符号的继承属性必须在先于这个符号的动作中计算\n- 一个动作不能引用该动作右边符号的综合属性\n- 左部非终结符的综合属性只能在它所引用的所有属性都计算完后才能计算\n\
    \n### 建立翻译模式\n\n- 如果既有**综合属性**又有**继承属性**，在建立翻译模式时就必须保证：\n  1. 产生式右边的符号的**继承属性**必须在先于这个符号的动作中计算出来。\n\
    \  2. 一个动作不能引用这个动作右边的符号的**综合属性**。\n  3. 产生式左边非终结符的**综合属性**只有在它所引用的所有属性都计算出来以后才能计算。计算这种属性的动作通常可放在产生式右端的**末尾**。\n\
    \n```\nS→A₁A₂  {A₁.in=1; A₂.in=2}\nA→a      {print(A.in)}\n```\n\n## L属性的自下而上计算\n\
    \n### L属性自下而上计算需要解决的问题\n\nA→X Y {Z.i = X.x} Z\n\n一个状态（文法符号）对应一个综合属性，该属性的值一般在处理完该文法符号之后得到。那么在Z还没有开始处理前，继承属性Z.i\
    \ 就没有对应的val条目供其使用！\n\n在栈上消除继承属性\n\n| state | val |\n|---|---|\n| ... | ... |\n\
    | | |\n| Y | Y.y |\n| X | X.x |\n| ... | ... |\n\ntop\n\n栈\n\n### 特殊情况一：删除翻译方案中嵌入的动作\n\
    \n- `E → T R`\n- `R → + T {print('+')} R₁ | − T {print('−')} R₁ | ε`\n- `T → num\
    \ {print(num.val)}`\n\n在文法中加入产生ε的标记非终结符，让每个嵌入动作由不同标记非终结符 M 代表，并把该动作放在产生式 M → ε\
    \ 的右端。\n\n- `E → T R`\n- `R → + T M R₁ | − T N R₁ | ε`\n- `T → num {print(num.val)}`\n\
    - `M → ε {print('+')}`\n- `N → ε {print('−')}`\n\n### 特殊情况二：分析栈上的继承属性\n\n- 属性位置能预测\n\
    \n例 int p, q, r\n\n```\nD → T {L.in := T.type} L\nT→ int {T.type := integer}\n\
    T→ real {T.type := real}\nL→ {L1.in := L.in}\nL1, id {addtype(id.entry, L.in)}\n\
    L→ id {addtype(id.entry, L.in)}\n```\n"
