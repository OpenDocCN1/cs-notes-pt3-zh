    \ \n+   E→T  \n+   T→(E)  \n+   T→num\n\n+   {E.val:=E₁.val+T.val}  \n+   {E.val:=E₁.val-T.val}\
    \  \n+   {E.val:=T.val}  \n+   {T.val:=E.val}  \n+   {T.val:=num.val}\n\n+   E\
