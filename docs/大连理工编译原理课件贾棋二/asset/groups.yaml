  md: "\n## 访问链\n\n- 访问链的使用及建立\n- 动态作用域和静态作用域产生的不同输出\n- 值调用、引用调用、复写—恢复调用、换名调用\n\n\
    ## 例题\n\n假定使用(a)值调用；(b)引用调用；(c)复写—恢复调用；(d)换名调用。下面程序打印的结果是什么。\n\n```pascal\nprogram\
    \ main(input,output);\nvar a,b: integer;\nprocedure p(x,y,z: integer);\nbegin\n\
    \    y:=y+1 ;\n    z:=z+x;\nend;\nbegin\n    a:=2;\n    b:=3;\n    p(a+b,a, a)\
    \ ;\n    print a;\nend.\n```\n\n- **(a)** 对值调用而言，由于被调用过程中对形式参数的赋值不会改变实在参数的值，因此对过程\
    \ `p` 的调用不改变 `a` 的值，因此 `a` 仍然是 `2`。\n\n- **(b)** 在引用调用的时候，`p(a+b, a, a)` 相当于 `p(5,\
