    \ \\text{real} \\) | \\( \\text{val}[\\text{top}] := \\text{real} \\) |\n| \\\
    ( L \\rightarrow L_1, \\text{id} \\) | \\( \\text{addtype}(\\text{val}[\\text{top}],\
    \ \\text{val}[\\text{top}-3]) \\) |\n| \\( L \\rightarrow \\text{id} \\) | \\\
    ( \\text{addtype}(\\text{val}[\\text{top}], \\text{val}[\\text{top}-1]) \\) |\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_198_0.png)\n\n### 属性的位置不能预测\n\nS →\
