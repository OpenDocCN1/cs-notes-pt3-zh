  md: "\n\n## 第六章 运行时存储空间的组织和管理\n\n编译程序在完成词法、语法和语义分析后，在生成目标代码之前，需要把程序的静态正文和实现这个程序的运行时的活动联系起来，弄清楚将在代码运行时刻，源代码中的各种变量、常量等用户定义的量是如何存放的，如何去访问它们。\n\
    \n在程序的执行过程中，程序中数据的存取是通过与之对应的存储单元来进行的。在程序语言中，程序使用的存储单元都是由标识符来表示的。它们对应的内存地址都是由编译程序在编译时或由其生成的目标程序运行时进行分配。所以对于编译程序来说，存储组织与管理是一个复杂而又十分重要的问题。\n\
    \n过程P一次活动的生存期，指的是从执行该过程体第一步操作到最后一步操作之间的操作时间，包括执行P时调用其它过程花费的时间。\n\n- 过程可以是递归的\n\
    - 一个过程可对应多个活动\n\n### 影响存储分配策略的语言特征\n\n- 过程能否递归\n- 当控制从过程的活动返回时，局部变量的值是否要保留\n-\
    \ 过程能否访问非局部变量\n- 过程调用的参数传递方式\n- 过程能否作为参数被传递\n- 过程能否作为结果值传递\n- 存储块能否在程序控制下动态地分配\n\
    - 存储块是否必须显式地释放\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_222_0.png)\n\n### 6.1（过程内部）局部存储分配策略\n\
    \n#### 6.1.1 过程\n\n过程定义、过程调用、形式参数、实在参数、活动的生存期\n\n过程定义\n\n```c\nProcedure f(a:int,\n\
    b:bool)\n{\n    int c;\n    ...\n}\n```\n\n过程调用\n\n```c\nvoid main()\n{\n    f(3,true);\n\
    \    ...\n}\n```\n\n#### 6.1.2 名字的作用域和绑定\n\n##### 名字的作用域\n\n一个声明起作用的程序部分称为该声明的作用域。\n\
    \n```c\nint a;\nFunction f(int b)\n{\n    int c;\n    ...\n}\n```\n\n```c\nvoid\
    \ main()\n{\n    a = 0;\n    c = 0;\n    f(3);\n}\n```\n\n> 正确，在a的作用域内\n\n> 错误，超出了c的作用域\n\
    \n##### 名字到存储单元的绑定\n\n- 环境把名字映射到左值（存储单元），而状态把左值映射到右值（值）。\n- 赋值改变状态，但不改变环境。\n-\
    \ 如果环境将名字x映射到存储单元s，我们就说x被绑定到s。\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_226_0.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_226_1.png)\n\n#### 静态概念和动态概念的对应\n\n\
    | 静态概念 | 动态对应 |\n|---|---|\n| 过程的定义 | 过程的活动 |\n| 名字的声明 | 名字的绑定 |\n| 声明的作用域 | 绑定的生存期\
    \ |\n\n#### 6.1.3 活动记录\n\n过程的活动中用于存放所需信息的存储空间，称为活动记录或帧。\n\n编译程序每次运行时，编译器从操作系统（OS）获得一块存储区（内存）。其内容包括：\n\
    \n- 编译后的目标代码（可执行程序 .exe）\n- 数据对象（各种静态变量和动态变量）\n- 用于管理过程活动的控制栈（活动记录）\n\n##### 例子\n\
    \n```c\nvoid p() {...}\nvoid main()\n{ ...;\np();\n....;\n}\n```\n\n| 代码 |\n|\
    \ --- |\n| 静态数据 |\n| 堆 |\n| ↓ |\n| ↑ |\n| p的活动记录 |\n| main的活动记录 |\n| 栈 |\n\n#####\
    \ 一般的活动记录的布局\n\n| 返回值 | 本过程返回给调用过程的值 |\n| --- | --- |\n| 实在参数 | 调用过程传递给本过程的参数\
    \ |\n| 控制链 | 指向调用过程的指针 |\n| 访问链 | 用于引用存于其他活动记录的非局部数据 |\n| 机器状态 | 用于保存本过程调用前的机器状态\
    \ |\n| 局部数据 | 本过程内部定义的局部变量 |\n| 临时数据 | 临时变量，中间结果 |\n\n#### 6.1.4 局部数据的安排\n\n-\
    \ 字节是可编址内存的最小单位。\n- 一个过程所声明的局部变量，按这些变量声明时出现的次序，在活动记录的局部数据区中依次分配空间。\n- 局部数据的地址可以用相对于某个位置（本过程对应的活动记录的起始位置）的偏移来表示。\n\
    - 数据对象的存储安排深受目标机器寻址方式的影响，存在对齐问题。例如，要求整数（int，long）的相对地址可以被4整除。由于对齐而引起的无用空间称为衬垫空白区。\n\
    \n### 第一部分 存储区（内存）的划分\n\n#### 例题\n\n在X86/Linux工作站上，以下两个结构的size分别是20和16，为什么不一样？\n\
    \n```c\ntypedef struct _a{\n    char c1;\n    long i;\n    char c2;\n    double\
    \ f;\n}a;\n```\n\n```c\ntypedef struct _b{\n    char c1;\n    char c2;\n    long\
    \ i;\n    double f;\n}b;\n```\n\n#### 例题解答：\n\ntypedef struct  _a{\nchar c1;\n\
    long i;\nchar c2;\ndouble f;\n}a;\n\n补垫空白区\n补垫空白区\nc1\ni\nc2\nf\n0 1 4 8 9 12\
    \ 20\n\n#### 例题解答：\n\n```c\ntypedef struct  _b{\nchar c1;\nchar c2;\nlong i;\n\
    double f;\n}b;\n```\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_235_0.png)\n\n\
    #### 6.1.5 程序块\n\n- 语法如{声明 语句}\n- 本身含有局部变量声明的语句，可以嵌套\n- 最接近的嵌套作用域规则\n- 程序块B’ 中声明的作用域包括B\n\
    - 如果名字x没有在B中声明，那么B中x的出现是在外围程序块B’ 的x声明的作用域中，且满足\n- B’ 有x的声明\n- B’ 比其他任何包含x声明的程序块更接近被嵌套的B\n\
    - 并列程序块不会同时活跃\n- 并列程序块的变量可以重叠分配。\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_236_0.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_236_1.png)\n\n```c\nmain()\n{ /* begin\
    \ of B₀ */\n    int a = 0;\n    int b = 0;\n    { /* begin of B₁ */\n        int\
    \ b = 1;\n        { /* begin of B₂ */\n            int a = 2;\n        }/* end\
    \ of B₂ */\n        { /* begin of B₃ */\n            int b = 3;\n        }/* end\
    \ of B₃ */\n    }/* end of B₁ */\n}/* end of B₀ */\n```\n\n| 声明 | 作用域 |\n|---|---|\n\
    | `int a = 0;` | `B₀-B₂` |\n| `int b = 0;` | `B₀-B₁` |\n| `int b = 1;` | `B₁-B₃`\
    \ |\n| `int a = 2;` | `B₂` |\n| `int b = 3;` | `B₃` |\n\n"
