  mdcn: "\n\n## 一般方法\n\n假设有翻译模式：\n\nA→A₁Y　　{A.a:=g(A₁.a,Y.y)}\nA→X　　　{A.a:=f(X.x)}\n\
    \n它的每个文法符号都有一个综合属性，用小写字母表示，g和f是任意函数。\n\n- 消除左递归：\n  - A→XR\n  - R→YR | ε\n\nR.i：R前面子表达式的值\
    \  \nR.s：分析完R时子表达式的值\n\n- 翻译模式变为：\n  - A → X　　{R.i:=f(X.x)}\n  - R　　　　{A.a:=R.s}\n\
    \  - R → Y　　{R₁.i:=g(R.i,Y.y)}\n  - R₁　　　 {R.s:=R₁.s}\n  - R → ε　　{R.s:=R.i}\n\
    \nXYY\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_176_0.png)\n\nA.a = g(g(f(X.x),\
    \ Y₁.y), Y₂.y)\n\nR.s = g(g(f(X.x), Y₁.y), Y₂.y)\n\nR.s = g(g(f(X.x), Y₁.y), Y₂.y)\n\
    \nR.s = g(g(f(X.x), Y₁.y), Y₂.y)\n\n| 产生式 | 语义规则 |\n|---|---|\n| A → X {R.i :=\
    \ f(X.x)} | R {A.a := R.s} |\n| R → Y {R₁.i := g(R.i, Y.y)} | R₁ {R.s := R₁.s}\
    \ |\n| R → ε {R.s := R.i} | |\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_177_0.png)\n\
    \n## 构造抽象语法树的属性文法定义转换成翻译模式\n\nE → T    {R.i:=T.nptr}\n       {E.nptr:=R.s}\n\n\
    R → + T R₁    {R₁.i:=mknode('+',R.i,T.nptr)}\n              {R.s:=R₁.s}\n\nR →\
    \ − T R₁    {R₁.i:=mknode('−',R.i,T.nptr)}\n              {R.s:=R₁.s}\n\nR → ε\
    \    {R.s:=R.i}\n\nT → ( E )    {T.nptr:=E.nptr}\n\nT → id    {T.nptr:=mkleaf(id,id.entry)}\n\
    \nT → num    {T.nptr:=mkleaf(num,num.val)}\n\n## 使用继承属性构造 a - 4 + c 的抽象语法树\n\n\
    ```\nE → T {R.i:=T.nptr} R {E.nptr:=R.s}\nR → + T {R₁.i:=mknode('+',R.i,T.nptr)}\
    \ R₁ {R.s:=R₁.s}\nR → - T {R₁.i:=mknode('-',R.i,T.nptr)} R₁ {R.s:=R.s}\nR → ε\
    \ {R.s:=R.i}\nT → ( E ) {T.nptr:=E.nptr}\nT → id {T.nptr=mkleaf(id,id.entry)}\n\
    T → num {T nptr:=mkleaf(num,num.val)}\n```\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_180_0.png)\n\
    \n## 4.3 L属性定义的自上而下计算\n\n### 例 左递归的消除引起继承属性\n\n| 产生式 | 语义规则 |\n|---|---|\n| \\\
    ( E \\rightarrow E_1 + T \\) | \\( E.nptr := mknode('+', E_1.nptr, T.nptr) \\\
    ) |\n| \\( E \\rightarrow T \\) | \\( E.nptr := T.nptr \\) |\n| \\( T \\rightarrow\
    \ T_1 * F \\) | \\( T.nptr := mknode('*', T_1.nptr, F.nptr) \\) |\n| \\( T \\\
    rightarrow F \\) | \\( T.nptr := F.nptr \\) |\n| \\( F \\rightarrow (E) \\) |\
    \ \\( F.nptr := E.nptr \\) |\n| \\( F \\rightarrow \\text{id} \\) | \\( F.nptr\
    \ := mkleaf(\\text{id}, \\text{id.entry}) \\) |\n| \\( F \\rightarrow \\text{num}\
    \ \\) | \\( F.nptr := mkleaf(\\text{num}, \\text{num.val}) \\) |\n\n## 4.3 L属性定义的自上而下计算\n\
    \n消除左递归后文法\n\nE → T\n    R\nR → + T\n    R₁\nR → ε\nT → F\n    W\nW → * F\n  \
    \  W₁\nW → ε\n\n{R.i := T.nptr}\n{E.nptr := R.s}\n\n{R₁.i := mknode( '+', R.i,\
    \ T.nptr)}\n{R.s := R₁.s}\n{R.s := R.i}\n\n{W.i := F.nptr}\n{T.nptr := W.s}\n\n\
    {W₁.i := mknode( '*', W.i, F.nptr)}\n{W.s := W₁.s}\n{W.s := W.i}\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_182_0.png)\n\
    \n## 4.3.3设计递归下降翻译器的方法\n\n- 对每个非终结符A构造一个函数过程，对A的每个继承属性设置一个形式参数  \n  函数的返回值为A的综合属性（作为记录，或指向记录的一个指针，记录中有若干域，每个属性对应一个域）。为了简单，我们假设每个非终结只有一个综合属性\
    \  \n  A对应的函数过程中，为出现在A的产生式中的每一个文法符号的每一个属性都设置一个局部变量。\n\n## 设计递归下降翻译器的方法\n\n- 非终结符A对应的函数过程中，根据当前的输入符号决定使用哪个产生式候选。\n\
    \n## 设计递归下降翻译器的方法\n\n- 每个产生式对应的程序代码中，按照从左到右的次序，对于单词符号（终结符）、非终结符和语义动作分别作以下工作：\n\
    \n  i) 对于带有综合属性 x 的终结符 X，把 x 的值存入为 X.x 设置的变量中。然后产生一个匹配 X 的调用，并继续读入一个输入符号。\n\n\
    \  ii) 对于每个非终结符 B，产生一个右边带有函数调用的赋值语句 `c=B(b1,b2,...,bk)`，其中，b1,b2,...,bk 是为 B 的继承属性设置的变量，c\
    \ 是为 B 的综合属性设置的变量。\n\n  iii) 对于语义动作，把动作的代码抄进分析器中，用代表属性的变量来代替对属性的每一次引用。\n\n## 4.3\
    \ L属性定义的自上而下计算\n\n## 4.3.3 预测翻译器的设计\n\n把递归下降的构造方法推广到翻译方案的实现\n\n产生式 R → +TR | ε\
    \ 的分析过程\n\n```\nprocedure R;\nbegin\n    if lookahead = '+' then begin\n     \
    \   match ('+'); T; R\n    end\n    else begin /* 什么也不做 */\n    end\nend\n```\n\
    \n## 4.3 L属性定义的自上而下计算\n\n产生式 R → + T R | ε 的翻译方案过程\n\n```\nR → +\n    T {R.L :=\
    \ mknode('+', R.i, T.nptr)}\n    R₁ {R.S := R₁.S}\n```\n\n```\nfunction R(i :\
    \ Tsyntax_tree_node) : Tsyntax_tree_node;\nvar      nptr, i1, s1, s : Tsyntax_tree_node;\n\
    \         addoplexeme : char;\nbegin\n    if lookahead = '+' then begin\n    \
    \    /* 产生式 R → +T R₁ */\n        addoplexeme := lexval;\n        match('+');\n\
    \        nptr := T();\n        i1 := mknode(addoplexeme, i, nptr);\n        s1\
    \ := R(i1);\n        s := s1\n    end\n    else s := i; /* 产生式 R → ε */\n    return\
    \ s\nend;\n```\n\n## 4.3 L属性定义的自上而下计算\n\n## 4.3.4（通过改写文法）用综合属性代替继承属性\n\nPascal的声明，如\
    \ m, n : integer\n\n```\nD → L : T\nT → integer | char\nL → L, id | id\n```\n\n\
    ![](img/4571939c0321e2c5dec9f0dd5554d04d_189_0.png)\n\n"
