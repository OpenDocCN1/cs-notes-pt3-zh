    \n### 建立算符表达式的语法树\n\n- mknode (op,left,right) 建立一个运算符号结点，标号是op，两个域left和right分别指向左子树和右子树。\n\
    - mkleaf (id,entry) 建立一个标识符结点，标号为id，一个域entry指向标识符在符号表中的入口。\n- mkleaf (num,val)\
    \ 建立一个数结点，标号为num，一个域val用于存放数的值。\n\n### 4.2.2 （例）用于构造语法树的语法制导定义\n\n| 产生式 | 语义规则\
    \ |\n|---|---|\n| \\( E \\rightarrow E_1 + T \\) | \\( E.nptr := mknode('+', E_1.nptr,\
    \ T.nptr) \\) |\n| \\( E \\rightarrow T \\) | \\( E.nptr := T.nptr \\) |\n| \\\
    ( T \\rightarrow T_1 * F \\) | \\( T.nptr := mknode('*', T_1.nptr, F.nptr) \\\
    ) |\n| \\( T \\rightarrow F \\) | \\( T.nptr := F.nptr \\) |\n| \\( F \\rightarrow\
    \ (E) \\) | \\( F.nptr := E.nptr \\) |\n| \\( F \\rightarrow id \\) | \\( F.nptr\
    \ := mkleaf(id, id.entry) \\) |\n| \\( F \\rightarrow num \\) | \\( F.nptr :=\
    \ mkleaf(num, num.val) \\) |\n\n### 用于构造语法树的语法制导定义\n\n#### 注意：\n\n- 同样是产生式附带语义规则，不同的语义规则产生不同的作用。\n\
    - 对算符结点，一个域存放算符并作为该结点的标记，其余两个域存放指向运算对象的指针。\n- 基本运算对象结点，一个域存放运算对象类别，另一个域存放其值。（也可用其他域保存其他属性或者指向该属性值的指针）\n\
    \n### a+5*b的语法树的构造\n\n> E→ E + T | T  \n> T→ T1 * F | F  \n> F→ ( E )  \n> F→\
    \ id | num\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_127_0.png)\n\n### `a+5*b`的语法树的构造\n\
