  mdcn: "\n\n## 继承属性和综合属性的性质\n\n- 终结符号只有综合属性，他们由词法分析器提供。\n- 非终结符号既有综合属性也可有继承属性，文法的开始符号没有继承属性，除非另外加以说明。\n\
    - 文法符号的综合属性集和继承属性集的交集应为空。\n\n对出现在产生式右边的继承属性和出现在产生式左边的综合属性都必须提供一个计算规则。属性计算规则中只能使用相应产生式中的文法符号的属性。\n\
    \n出现在产生式左边的继承属性和出现在产生式右边的综合属性不由所给的产生式的属性计算规则进行计算，它们由其它产生式的属性规则计算或者由属性计算器的参数提供。\n\
    \n语义规则所描述的工作可以包括属性计算、静态语义检查、符号表操作、代码生成等等。\n\n例，考虑非终结符A、B和C，其中，A有一个继承属性a和一个综合属性b，B有综合属性c，C有继承属性d。产生式A→BC可能有规则：\n\
    \nC.d := B.c + 1  \nA.b := A.a + B.c\n\n而属性A.a和B.c在其它地方计算。\n\n语义规则b := f(c₁, c₂,\
    \ ..., cₖ)中，函数f通常是表达式（T.val = F.val）。也有一些规则写成过程调用或程序段（打印值，输出中间代码等），称为产生副作用的操作（如：print(E.val)）可看成是产生式左部非终结符的虚拟综合属性。\n\
    \n属性文法是指语义规则函数无副作用的语法制导定义。\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_75_0.png)\n\
