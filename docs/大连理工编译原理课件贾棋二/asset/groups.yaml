    \n## 4.4 L属性的自下而上计算\n\n在自下而上语法分析的框架中实现L属性定义的方法，可以做到：\n\n- 实现任何基于LL(1)文法的L属性定义。\n\
    - 实现许多（但不是所有的）基于LR(1)的L属性定义。\n\n### L属性自下而上计算需要解决的问题：\n\nA→X Y {Z.i = X.x} Z\n\
    \n> 一个状态（文法符号）对应一个综合属性，该属性的值一般在处理完该文法符号之后得到。那么在Z还没有开始处理前，继承属性Z.i 就没有对应的val条目供其使用！\n\
    \n在栈上消除继承属性\n\n### 4.4.1 特殊情况一： 删除翻译方案中嵌入的动作\n\nE → TR\n\nR → + T {print ('+')}R₁\
    \ | - T {print ('-')}R₁ | ε\n\nT → num {print (num.val)}\n\n在文法中加入产生ε的标记非终结符，让每个嵌入动作由不同标记非终结符M代表，并把该动作放在产生式M\
    \ → ε的右端。\n\nE → TR\n\nR → + T M R₁ | - T N R₁ | ε\n\nT → num {print (num.val)}\n\
    \nM → ε {print ('+')}\n\nN → ε {print ('-')}\n\n### 4.4.2 特殊情况二： 分析栈上的继承属性\n\n\
    #### 属性位置能预测\n\n例 int p, q, r\n\nD → T {L.in := T.type} L\n\nT→ int {T. type :=\
    \ integer}\n\nT→ real {T. type := real}\n\nL→ {L1.in := L.in }\n\nL1, id {addtype\
    \ (id.entry, L.in )}\n\nL→ id {addtype (id.entry, L.in )}\n\n| 状态 | 输入 | 所用产生式\
    \ |\n|---|---|---|\n| - | int p,q,r | |\n| int | p,q,r | |\n| T | p,q,r | T→int\
    \ |\n| Tp | ,q,r | |\n| TL | ,q,r | L→id |\n| TL, | q,r | |\n| TL,q | ,r | |\n\
    | TL | ,r | L→L,id |\n| TL, | r | |\n| TL,r | | |\n| TL | | L→L.id |\n| D | |\
    \ D→TL |\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_197_0.png)\n\n- L→ id {addtype\
