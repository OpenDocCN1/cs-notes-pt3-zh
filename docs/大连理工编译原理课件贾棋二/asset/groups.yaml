  md: "\n## 第七章 中间代码生成\n\n### 本章内容\n\n- 介绍中间代码的几种常用表示方法：后缀表示、图形表示和三地址代码\n- 用语法制导定义和翻译方案的方法来说明程序设计语言的结构怎样被翻译成中间形式\n\
    \n### 7.1 中间语言\n\n#### 7.1.1 后缀表示\n\n后缀表示的最大优点是便于计算机处理表达式\n\n(8 - 4) + 2的后缀表示是\
