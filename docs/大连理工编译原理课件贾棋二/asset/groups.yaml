    一个状态（文法符号）对应一个综合属性，该属性的值一般在处理完该文法符号之后得到。那么在Z还没有开始处理前，继承属性Z.i 就没有对应的val条目供其使用！


    在栈上消除继承属性


    | state | val |

    |---|---|

    | ... | ... |

    | | |

    | Y | Y.y |

    | X | X.x |

    | ... | ... |


    top


