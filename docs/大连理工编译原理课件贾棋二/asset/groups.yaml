  md: "\n## 3.6 二义文法的应用\n\n### 3.6.1 使用文法以外信息来解决分析动作冲突\n\n二义文法：\\( E \\rightarrow\
    \ E + E \\mid E * E \\mid (E) \\mid \\text{id} \\)\n\n规定：* 优先级高于 +，两者都是左结合。\n\n\
    **LR(0) 项目集 \\(I_7\\)：**\n\n```\nE → E + E ·\nE → E · + E\nE → E · * E\n```\n\n\
    - 面临 `+`，归约\n- 面临 `*`，移进\n- 面临 `)` 和 `$`，归约\n\n**LR(0) 项目集 \\(I_8\\)：**\n\n```\n\
    E → E * E ·\nE → E · + E\nE → E · * E\n```\n\n- 面临 `+`，归约\n- 面临 `*`，归约\n- 面临 `)`\
    \ 和 `$`，归约\n\n例如：`id * id + id` 时面临 `+`，归约；`id * id * id` 时面临 `*`，归约。\n\n### 3.6.2\
    \ 特殊情况产生式引起的二义性\n\n文法：\n\n```\nE → E sub E sup E\nE → E sub E\nE → E sup E\nE\
    \ → {E}\nE → c\n```\n\n- 从定义形式语言的角度说，第一个产生式是多余的。\n- 联系到语义处理，第一个产生式是必要的。\n\n例：`a\
    \ sub i sup 2`\n\n可解释为：\n\n- `a<sub>i</sub><sup>2</sup>`\n- `a<sub>i</sub><sup>2</sup>`\n\
    - `a<sub>i<sup>2</sup></sub>`\n\nLR(0) 项目集 \\(I_{11}\\)：\n\n```\nE → E sub E sup\
    \ E ·\nE → E sup E ·\n...\n```\n\n### 3.6.3 LR分析的错误恢复\n\n#### LR分析器在什么情况下发现错误\n\
    \n- 访问动作表时若遇到出错条目。\n- 访问转移表时它决不会遇到出错条目。\n- 决不会把不正确的后继移进栈。\n- 规范的LR分析器甚至在报告错误之前决不做任何无效归约。\n\
    \n#### 紧急方式错误恢复\n\n- 退栈，直到出现状态 s，它有预先确定的 A 的转移。\n- 抛弃若干个输入符号，直到找到 a，它是 A 的合法后继。\n\
    - 再把 A 和状态 `goto[s, A]` 压进栈，恢复正常分析。\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_15_0.png)\n\
    ![](img/4571939c0321e2c5dec9f0dd5554d04d_16_0.png)\n![](img/4571939c0321e2c5dec9f0dd5554d04d_17_0.png)\n\
    ![](img/4571939c0321e2c5dec9f0dd5554d04d_18_0.png)\n\n## 3.7 分析器的生成器\n\n### 3.7.1\
    \ 分析器的生成器 Yacc\n\n#### 用 Lex 建立词法分析器的步骤\n\n| Yacc | Lex |\n|---|---|\n| Yacc 源程序\
    \ `translate.y` | Lex 源程序 `lex.l` |\n| 输入 | 输入流 |\n| Yacc 编译器 | Lex 编译器 |\n| `y.tab.c`\
    \ | `lex.yy.c` |\n| C 编译器 | C 编译器 |\n| `a.out` | `a.out` |\n| 输出 | 记号序列 |\n\n\
    #### Yacc 程序包括三个部分\n\n- 声明\n- `%%`\n- 翻译规则\n- `%%`\n- 支持例程\n\n#### 例——声明部分\n\n\
    ```c\n%{\n#include <ctype.h>\n%}\n%token DIGIT\n%%\n\n/* 常量、变量的声明 */\n```\n\n\
    对应文法：\n\n```\nE -> E + T | T\nT -> T * F | F\nF -> (E) | digit\n```\n\n#### 例——翻译规则部分\n\
    \n```yacc\nline : expr '\\n'  {printf(\"%d\\n\", $1);}\n;\nexpr : expr '+' term\
    \  {$$ = $1+$3;}\n| term\n;\nterm : term '*' factor  {$$ = $1 * $3;}\n| factor\n\
    ;\nfactor : '(' expr ')'  {$$ = $2;}\n| DIGIT\n;\n%%\n```\n\n对应文法：\n\n```\nE ->\
    \ E + T | T\nT -> T * F | F\nF -> (E) | digit\n```\n\n#### 例——支持例程部分\n\n```c\n\
    yylex(){\n    int C;\n    C = getchar();\n    if (isdigit(C)){\n        yylval\
    \ = C - '0';\n        return DIGIT;\n    }\n    return C;\n}\n```\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_24_0.png)\n\
    \n### 3.7.2 用 Yacc 处理二义文法\n\n解决分析动作冲突的两大默认规则：\n\n- 对于归约-归约冲突，选择在 Yacc 程序中最先出现的那个产生式归约。\n\
    - 对于移进-归约冲突，优先移进。\n"
