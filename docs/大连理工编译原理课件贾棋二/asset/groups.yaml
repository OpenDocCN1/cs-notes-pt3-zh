    \ y;\n    y := temp\nend\n```\n\n调用swap(i, a[i])\ntemp := i;\ni := a[i];\na[i]\
    \ := temp\n\n## 本章要点\n\n- 影响存储分配策略的语言特征\n- 各种存储分配策略，主要了解静态分配和动态栈式分配\n- 活动记录中各种数据域的作用和安排\n\
    - 非局部数据访问的实现方法\n- 各种参数传递方式及其实现\n\n## 例题 1\n\n```c\nmain()\n{\n    char *cp1, *cp2;\n\
    \n    cp1 = \"12345\";\n    cp2 = \"abcdefghij\";\n    strcpy(cp1,cp2);\n    printf(\"\
    cp1 = %s\\ncp2 = %s\\n\", cp1, cp2);\n}\n```\n\n在某些系统上的运行结果是：\n\ncp1 = abcdefghij\n\
    cp2 = ghij\n\n为什么cp2所指的串被修改了？\n\n## 例题 1\n\n因为常量串“12345”和“abcdefghij”连续分配在常数区\n\
    执行前：\n\n```\n12345\\0abcdefghij\\0\n↑              ↑\ncp1            cp2\n```\n\
    \n执行后：\n\n```\nabcdefghij\\0fghij\\0\n↑              ↑\ncp1           cp2\n```\n\
    \n现在的编译器大都把程序中的串常量单独存放在只读数据段中，因此运行时会报错\n\n## 例题 2\n\n下面的程序运行时输出3个整数。试从运行环境和printf的实现来分析，为什么此程序会有3个整数输出？\n\
    \n```c\nmain()\n{\n    printf(\"%d, %d, %d\\n\");\n}\n```\n\n## 例题 2\n\n当用传统的参数声明方式时，C语言编译器是不做实在参数和形式参数的个数和类型是否一致的检查的，由程序员自己保证它们的一致性。\n\
    \n但是，c语言的实现保证被调用函数能准确地取到第一个实在参数。因此printf的实现首先取到第一个参数——格式控制字符串，然后分析它的格式控制要求，根据格式控制中的格式说明，到栈中取第二、第三个参数等等，而不管调用者是否真正提供了这些参数。所以该程序有3个整数输出。\n\
    \n## 例题 3\n\n```c\nmain()\n{ func(); printf(\"Return from func\\n\"); }\n\nfunc()\n\
    { char s[4];\nstrcpy(s,\"12345678\"); printf(\"%s\\n\",s); }\n```\n\n## 例题 3\n\
    \n```c\nmain()\n{ func(); printf(\"Return from func\\n\"); }\n```\n\n```c\nfunc()\n\
    { char s[4];\n strcpy(s,\"12345678\");\n printf(\"%s\\n\",s);\n }\n```\n\n在X86/Linux操作系统上的运行结果如下：\n\
    \n12345678\nReturn from func\nSegmentation fault (core dumped)\n\n## 例题 3\n\n\
    ```c\nmain()\n{ func(); printf(\"Return from func\\n\"); }\n```\n\n```c\nfunc()\n\
    { char s[4];\n  strcpy(s,\"123456789\");\n  printf(\"%s\\n\",s);\n}\n```\n\n123456789\n\
    \nSegmentation fault (core dumped)\n\n## 例题 4\n\n假定使用(a)值调用；(b)引用调用；(c)复写—恢复调用；(d)换名调用。下面程序打印的结果是什么。\n\
    \n```pascal\nprogram main(input,output);\nvar a,b: integer;\nprocedure p(x,y,z:\
    \ integer);\nbegin\n    y:=y+1 ;\n    z:=z+x;\nend;\nbegin\n    a:=2;\n    b:=3;\n\
    \    p(a+b,a, a) ;\n    print a;\nend.\n```\n\n## 例题 4\n\n- (d)换名调用等价于下面的执行序列\n\
    - a:=a+1;\n- a:=a+(a+b);\n- 所以a的最后结果是9。\n\n## 第七章 中间代码生成\n\n### 中间代码：\n\n- 介乎源语言与目标代码之间，比源语言简单，比目标代码复杂。\n\
    - 区分编译器的前端与后端，方便提出针对新机器的编译器。\n- 可以设计针对中间代码的优化器。\n\n## 例：编译阶段\n\n```pascal\nprocedure\
    \ sort\nx:integer;\nvar a: array[0..9] of integer;\nBegin\nx:= a[3]+3;\nEnd;\n\
    ```\n\n## 例：编译后、运行前\n\n可执行代码\n\n> 此时只有可执行的代码，没有符号表了，更没有运行栈（活动记录栈）\n\n## 例：运行阶段\n\
    \n执行顺序\n\n```\n...\n↑15 = ↑8 + 3\n...\n```\n\n可执行代码\n\n加载\n\n代码段\n\n静态数据区\n\n\
    返回值和参数\n\n控制链\n访问链和机器状态\n\n```\na[0] a[1] a[2] ... a[9]\n\nx\n```\n\n运行栈\n\n5\n\
    \n15\n\n"
