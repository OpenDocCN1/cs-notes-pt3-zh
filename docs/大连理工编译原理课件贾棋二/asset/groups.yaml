    # 4.2 S属性定义的自下而上计算


    # 4.2.1 语法树


    +   - 语法树是分析树的浓缩表示：算符和关键字作为内部结点。

    +   - 语法制导翻译可以基于分析树，也可基于语法树

    +   - 语法树的例子：


    ```

    S → if B then S1 else S2

    ```


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_121_0.png)


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_121_1.png)'
