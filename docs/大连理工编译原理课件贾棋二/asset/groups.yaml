    \n```pascal\nprocedure swap(var x, y: integer);\nvar temp: integer;\nbegin\n \
    \   temp := x;\n    x := y;\n    y := temp\nend\n```\n"
  mdcn: "\n## 6.3 非局部名字的访问\n\n### 6.3.1 无过程嵌套的静态作用域\n\n- 过程体中的非局部引用可以直接使用静态确定的地址\n\
    - 局部变量在栈顶的活动记录中，可以通过 `base_sp` 指针来访问\n- 无须深入栈中取数据，无须访问链\n- 过程可以作为参数来传递，也可以作为结果来返回\n\
    \n### 6.3.2 有过程嵌套的静态作用域\n\n**过程嵌套深度**\n\n| 名字 | 过程嵌套深度 |\n|---|---:|\n| sort |\
    \ 1 |\n| readarray | 2 |\n| exchange | 2 |\n| quicksort | 2 |\n| partition | 3\
    \ |\n\n变量的嵌套深度：它的声明所在过程的嵌套深度作为该名字的嵌套深度\n\n1、假定过程p的嵌套深度为\\(n_p\\)，它引用嵌套深度为\\(n_a\\\
    )的变量a，\\(n_a \\le n_p\\)。如何访问a的存储单元？\n\n- 从栈顶的活动记录开始，追踪访问链\\(n_p-n_a\\)次。\n- 到达a的声明所在过程的活动记录。\n\
    - 访问链的追踪用间接操作就可完成。\n\n- sort 1\n- readarray 2\n- exchange 2\n- quicksort 2\n-\
    \ partition 3\n\n**访问非局部名字的存储单元**\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_281_0.png)\n\
    \n- sort 1\n- readarray 2\n- exchange 2\n- quicksort 2\n- partition 3\n\n过程p对变量a访问时，a的地址由下面的二元组表示：\n\
    （\\(n_p - n_a\\)，a在活动记录中的偏移）\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_282_0.png)\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_282_1.png)\n\n**2、建立访问链**\n\n假定嵌套深度为\\\
    (n_p\\)的过程p调用嵌套深度为\\(n_x\\)的过程x\n\n- \\(n_p < n_x\\) 的情况\n  - x肯定就声明在p中\n  - 被调用过程的访问链必须指向调用过程的活动记录的访问链\n\
    \n| 过程 | 嵌套深度 |\n|---|---:|\n| sort | 1 |\n| readarray | 2 |\n| exchange | 2 |\n\
    | quicksort | 2 |\n| partition | 3 |\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_284_0.png)\n\
    \n- sort 1\n- readarray 2\n- exchange 2\n- quicksort 2\n- partition 3\n\n假定嵌套深度为\\\
    (n_p\\)的过程p调用嵌套深度为\\(n_x\\)的过程x\n\n\\(n_p \\geq n_x\\)的情况\n\n- p和x的嵌套深度分别为1，2，...，\\\
    (n_x-1\\)的外围过程肯定相同\n- 追踪访问链\\(n_p-(n_x-1)\\)次，到达了静态包围x和p的且离它们最近的那个过程的最新活动记录\n\
    - 所到达的访问链就是x的活动记录中的访问链应该指向的那个访问链\n\n- sort 1\n- readarray 2\n- exchange 2\n- quicksort\
    \ 2\n- partition 3\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_287_0.png)\n\n\
    ### 6.3.3 动态作用域\n\n- 被调用过程的非局部名字a和它在调用过程中引用的是同样的存储单元。\n- 新的绑定仅为被调用过程的局部名字建立，这些名字在被调用过程的活动记录中占用存储单元。\n\
    \n```pascal\nprogram dynamic(input, output);\nvar r: real;\nprocedure show;\n\
    begin write(r: 5: 3) end;\nprocedure small;\nvar r: real;\nbegin r := 0.125; show\
    \ end;\nbegin\n  r := 0.25;\n  show; small; writeln;\n  show; small; writeln\n\
    end.\n```\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_289_0.png)\n\nshow\nsmall\n\
    show\nsmall\nshow\nshow\n\n静态作用域\n0.250 0.250\n0.250 0.250\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_291_0.png)\n\
    \n动态作用域\n0.250 0.125\n0.250 0.125\n\n**实现动态作用域的方法**\n\n- **深访问**：用控制链搜索运行栈，寻找包含该非局部名字的第一个活动记录\n\
    - **浅访问**：\n  - 为每个名字在静态分配的存储空间中保存它的当前值\n  - 当过程p的新活动出现时，p的局部名字n使用在静态数据区分配给n的存储单元。n的先前值可以保存在p的活动记录中，当p的活动结束时再恢复\n\
    \n## 6.4 参数传递\n\n### 6.4.1 值调用\n\n- 实参的右值传给被调用过程\n- 值调用可以如下实现\n  - 把形参当作所在过程的局部名看待，形参的存储单元在该过程的活动记录中。\n\
    \  - 调用过程计算实参，并把右值放入形参的存储单元中。\n\n### 6.4.2 引用调用\n\n- 实参的左值传给被调用过程\n- 引用调用可以如下实现：\n\
    \  - 把实参的左值放入形参的存储单元。\n  - 在被调用过程的目标代码中，任何对形参的引用都是通过传给该过程的指针来间接引用实参的。\n\n### 6.4.3\
    \ 复写-恢复调用\n\n值调用和引用调用的混合\n\n复写-恢复调用可以如下实现：\n\n- 实参的右值和左值同时传给被调用过程。\n- 在被调用过程中，像值调用那样使用实参的右值。\n\
    - 当控制返回调用过程时，根据传递来的实参的左值，将形参当前的值复写到实参存储单元。\n\n### 6.4.4 换名调用\n\n用实参表达式对形参进行正文替换。\n\
    \n```pascal\nprocedure swap(var x, y: integer);\nvar temp: integer;\nbegin\n \
    \   temp := x;\n    x := y;\n    y := temp\nend\n```\n"
