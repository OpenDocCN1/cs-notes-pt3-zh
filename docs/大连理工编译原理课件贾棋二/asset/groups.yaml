    # 6.2.2 静态分配


    +   - 名字在程序被编译时绑定到存储单元，不需要运行时的任何支持。

    +   - 绑定的生存期是程序的整个运行时间。

    +   - 控制每次进入该过程时，局部变量的值和控制上一次离开时的一样。

    +   - 每个活动记录的大小是固定的。

    +   - 过程调用时保存信息的地址在编译时也是已知的。'
