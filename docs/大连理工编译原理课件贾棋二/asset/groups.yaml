    # # 6.2 全局存储分配策略


    # ## 6.2.3 栈式分配


    活动树：用树来描绘控制进入和离开活动的方式


    # ### 活动树的特点


    +   - 每个结点代表某过程的一个活动

    +   - 根结点代表主程序的活动

    +   - 结点a是结点b的父结点，当且仅当控制流从a的活动进入b的活动

    +   - 结点a 处于结点b 的左边，当且仅当a的生存期先于b的生存期'
