    \n过程p调用过程q的调用序列\n\n- p在栈上留出放返回值的空间，并计算实参，依次放入栈顶，同时改变top_sp的值。\n- p把返回地址和当前base_sp的值存入q的活动记录中，建立q的访问链\n\
    - q保存寄存器的值和其它机器状态信息，将base_sp的值压栈，并将当前的top_sp作为自己的base_sp。\n- q根据局部数据域和临时数据域的大小减小top_sp的值，初始化它的局部数据，并开始执行过程体。\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_256_0.png)\n\n过程p调用过程q的返回序列\n- q把返回值置入邻近p的活动记录的地方\n\
    - q增加top_sp的值\n\nq\n- q恢复寄存器（包括base_sp）和机器状态，返回p\n- p根据参数个数与类型和返回值类型调整top_sp，然后取出返回值\n\
    \nP\n\ntop_sp\nbase_sp\n栈\n局部数据临时数据\n控制链\n访问链和机器状态\n返回值和参数\n局部数据临时数据\n控制链\n访问链和机器状态\n\
    返回值和参数\n\n39/48\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_258_0.png)\n\n过程的参数个数可变的情况\n\
    \n- 函数返回值改成用寄存器传递\n- 编译器产生将这些参数逆序进栈的代码\n- 被调用函数能准确地知道第一个参数的位置\n- 被调用函数根据第一个参数到栈中取第二、第三个参数等等\n\
    \n![](img/4571939c0321e2c5dec9f0dd5554d04d_259_0.png)\n\n![](img/4571939c0321e2c5dec9f0dd5554d04d_259_1.png)\n\
    \n- 活动记录的长度在编译时不能确定的情况\n- 局部数组的大小要等到过程激活时才能确定\n- 在活动记录中为这样的数组分别存放数组指针的单元\n- 运行时，这些指针指向分配在栈顶的存储空间\n\
    \n> 只有作用范围在一个过程中，且返回后不可访问的数据对象才能分配在栈上。\n\n"
