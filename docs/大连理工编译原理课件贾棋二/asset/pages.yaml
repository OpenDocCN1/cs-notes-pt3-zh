- pgno: 262
  md: '# 三种存储分配策略的比较


    |  | 静态分配 | 栈式分配 | 堆式分配 |

    |---|---|---|---|

    | 存储空间 | 静态数据区 | 栈区 | 堆区 |

    | 使用范围 | 外部变量、静态局部变量、常量 | 局部变量、形参 | 动态变量 |

    | 分配时间 | 程序开始前 | 进入过程前 | 用户决定 |

    | 释放时间 | 程序结束后 | 过程结束 | 用户决定 |

    | 地址计算时间 | 编译时 | 运行时 | 运行时 |

    | 存取速度 | 快 | 慢 | 慢 |'
  merge: -1
  img_proc: true
