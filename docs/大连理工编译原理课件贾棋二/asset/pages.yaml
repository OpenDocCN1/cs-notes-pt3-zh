- pgno: 256
  md: '# # 6.2 全局存储分配策略


    过程p调用过程q的调用序列


    +   - p在栈上留出放返回值的空间，并计算实参，依次放入栈顶，同时改变top_sp的值。


    +   - p把返回地址和当前base_sp的值存入q的活动记录中，建立q的访问链


    +   - q保存寄存器的值和其它机器状态信息，将base_sp的值压栈，并将当前的top_sp作为自己的base_sp。


    +   - q根据局部数据域和临时数据域的大小减小top_sp的值，初始化它的局部数据，并开始执行过程体。


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_256_0.png)'
