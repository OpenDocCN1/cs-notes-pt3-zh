    +   - 一个依赖图的任何拓扑排序都给出一个语法树中结点的语义规则计算的有效顺序。

    +   - 属性文法说明的翻译是很精确的

    +     - 基础文法用于建立输入符号串的语法分析树；

    +     - 根据语义规则建立依赖图

    +     - 从依赖图的拓扑排序中，我们可以得到计算语义规则的顺序。


    输入串 → 分析树 → 依赖图 → 语义规则计算次序'
