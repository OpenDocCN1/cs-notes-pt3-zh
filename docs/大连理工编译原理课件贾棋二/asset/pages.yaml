    # 活动记录


    # 一般的活动记录的布局


    | 活动记录字段 | 含义 |

    |---|---|

    | 返回值 | 本过程返回给调用过程的值 |

    | 实在参数 | 调用过程传递给本过程的参数 |

    | 控制链 | 指向调用过程的指针 |

    | 访问链 | 用于引用存于其他活动记录的非局部数据 |

    | 机器状态 | 用于保存本过程调用前的机器状态 |

    | 局部数据 | 本过程内部定义的局部变量 |

    | 临时数据 | 临时变量，中间结果 |'
