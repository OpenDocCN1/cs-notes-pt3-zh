- pgno: 30
  md: '# # 3.7 分析器的生成器


    # ## 3.7.3 Yacc的错误恢复


    # ### 编译器设计者的工作


    +   - 决定哪些“主要的”非终结符将有错误恢复与它们相关联


    +   - 加入\( A \rightarrow \text{error } \alpha \)的错误产生式，其中\( A \)是主要非终结符，\( \alpha
    \)是文法符号串


    +   - 为这样的产生式配上语义动作


    # ### Yacc把错误产生式当作普通产生式处理'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 3.7 分析器的生成器


    # 遇到语法错误时


    +   - 从栈中弹出状态，直到发现栈顶状态的项目集包含形为 $A \to \cdot error\ \alpha$ 的项目为止。

    +   - 把虚构的终结符 error “移进”栈。

    +   - 若 $\alpha$ 为 $\varepsilon$，直接进行产生式规约，并执行相关的语义动作，忽略若干输入符号，直至发现能回到正常处理的符号为止。

    +   - 若 $\alpha$ 不为 $\varepsilon$，找到 $\alpha$，把 $\alpha$ 移进栈，把 error $\alpha$
    归约为 $A$，恢复正常分析。


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_31_0.png)'
  merge: -1
  img_proc: true
