- pgno: 120
  md: "# 属性理解—例子\n\n```\nvoid D()\n{\n  T_temp = T();\n  L_in = T_temp;\n  L(L_in);\n\
    \  return ;\n}\n```\n\n```\nint T()\n{\n  switch lookahead\n  {\n    case INT:\
    \ return INTEGER;\n    case REAL: return REAL;\n    default: error;\n  }\n}\n\
    ```\n\n| 产生式 | 语义规则 |\n|--------|----------|\n| D → TL | L.in := T.type |\n| T\
    \ → int | T.type := integer |\n| T → real | T.type := real |\n| L → L₁, id | L₁.in\
    \ := L.in;addtype (id.entry, L.in) |\n| L → id | addtype (id.entry, L.in) |\n\n\
    ```\nvoid L(int L_in)\n{\n  L (L_in);\n  match(', ');\n  match(id);\n  addtype(id.entry,\
    \ L_in);\n}\n```\n\n```\nvoid L(int L_in)\n{\n  match (id);\n  addtype(id.entry,\
    \ L.in);\n}\n```"
  merge: -1
