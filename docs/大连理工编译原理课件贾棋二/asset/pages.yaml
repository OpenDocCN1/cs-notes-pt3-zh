- pgno: 399
  md: '# 自上而下分析


    # ■ LL(1)文法


    任何两个产生式 A → α | β 都满足下列条件：


    +   - FIRST(α) ∩ FIRST(β) = ∅

    +   - 若 β ⇒* ε，那么 FIRST(α) ∩ FOLLOW(A) = ∅


    LL(1)文法有一些明显的性质


    +   - 没有公共左因子

    +   - 不是二义的

    +   - 不含左递归'
