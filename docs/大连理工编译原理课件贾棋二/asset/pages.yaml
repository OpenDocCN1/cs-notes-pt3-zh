- pgno: 292
  md: '# # 6.3 非局部名字的访问


    # ## 实现动态作用域的方法


    +   ### 深访问


    用控制链搜索运行栈，寻找包含该非局部名字的第一个活动记录


    +   ### 浅访问


    +   为每个名字在静态分配的存储空间中保存它的当前值


    +   当过程p的新活动出现时，p的局部名字n使用在静态数据区分配给n的存储单元。n的先前值可以保存在p的活动记录中，当p的活动结束时再恢复'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 6.4 参数传递


    # 6.4.1 值调用


    +   - 实参的右值传给被调用过程

    +   - 值调用可以如下实现

    +     - 把形参当作所在过程的局部名看待，形参的存储单元在该过程的活动记录中。

    +     - 调用过程计算实参，并把右值放入形参的存储单元中。'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 6.4 参数传递


    # 6.4.2 引用调用


    +   - 实参的左值传给被调用过程

    +   - 引用调用可以如下实现：


    +   - 把实参的左值放入形参的存储单元。

    +   - 在被调用过程的目标代码中，任何对形参的引用都是通过传给该过程的指针来间接引用实参的。'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 6.4 参数传递


    # 6.4.3 复写-恢复调用


    值调用和引用调用的混合


    复写-恢复调用可以如下实现：


    +   - 实参的右值和左值同时传给被调用过程。

    +   - 在被调用过程中，像值调用那样使用实参的右值。

    +   - 当控制返回调用过程时，根据传递来的实参的左值，将形参当前的值复写到实参存储单元。'
  merge: -1
  img_proc: true
