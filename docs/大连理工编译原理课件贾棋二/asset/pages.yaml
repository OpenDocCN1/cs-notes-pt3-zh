- pgno: 357
  md: '# # 加入死状态后的DFA


    先把状态集合成非接受状态集{0, 1, 2, 3, 5}和接受状态集{4}这两个子集。

    1. 集合{4}不能再分解，我们看集合{0, 1, 2, 3, 5}。

    move({0, 1, 2, 3, 5}, a) = {1, 2, 5} move({0, 1, 2, 3, 5}, b) = {3, 4, 5}

    由于b 转换的结果{3, 4, 5}不是最初划分的某个集合的子集，因此{0, 1, 2, 3, 5}需

    要再分，由于状态1和状态2的b转换都到状态4。因此状态集合的进一步划分是：

    {1, 2}、{0, 3, 5}和{4}

    2. 由于move({1, 2}, a) = {2, 5} move({1, 2}, b) = {4}

    move({0, 3, 5}, a) = {1, 5} move({0, 3, 5}, b) = {3, 5}

    显然{1, 2}和{0, 3, 5}需要再分，分别分成：{1}和{2}以及{0, 3}和{5}

    3. 由于 move({0, 3}, a) = {1} move({0, 3}, b) = {3}

    因此不需要再分。这样状态0和状态3合并成一个状态，我们取0为代表，再删去死状

    态5，就得到该题的结果。


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_357_0.png)'
  merge: -1
  img_proc: true
