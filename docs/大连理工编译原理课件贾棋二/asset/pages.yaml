    +   - 当控制从过程的活动返回时，局部变量的值是否要保留

    +   - 过程能否访问非局部变量

    +   - 过程调用的参数传递方式

    +   - 过程能否作为参数被传递

    +   - 过程能否作为结果值传递

    +   - 存储块能否在程序控制下动态地分配

    +   - 存储块是否必须显式地释放


