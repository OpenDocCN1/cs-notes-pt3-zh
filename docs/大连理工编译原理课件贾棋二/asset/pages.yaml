- pgno: 253
  md: '# # 6.2 全局存储分配策略


    # ## 运行栈的管理：


    +   - 过程调用和过程返回都需要执行一些代码来管理活动记录栈，保存或恢复机器状态等


    +   - 过程调用序列


    +   - 过程返回序列


    过程调用时执行的分配活动记录，把信息填入它的域中的代码


    过程返回时执行的恢复机器状态，释放活动记录，使调用过程能够继续执行的代码


    调用序列和返回序列都分常常分成两部分，分处于调用过程和被调用过程中'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# # 6.2 全局存储分配策略


    即使是同一种语言，过程调用序列、返回序列和活动记录中各域的排放次序，也会因实现而异


    设计这些序列和活动记录的一些原则是


    +   - 把参数域和可能有的返回值域放在紧靠调用者活动记录的地方


    +   - 以活动记录中间的某个位置作为基地址


    +   - 长度能较早确定的域放在活动记录的中间


    +   - 一般把临时数据域放在局部数据域的后面


    +   - 用同样的代码来执行各个活动的保存和恢复'
  merge: -1
