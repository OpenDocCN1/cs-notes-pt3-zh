- pgno: 242
  md: '# 6.2 全局存储分配策略


    # 6.2.2 静态分配


    +   - 名字在程序被编译时绑定到存储单元，不需要运行时的任何支持。

    +   - 绑定的生存期是程序的整个运行时间。

    +   - 控制每次进入该过程时，局部变量的值和控制上一次离开时的一样。

    +   - 每个活动记录的大小是固定的。

    +   - 过程调用时保存信息的地址在编译时也是已知的。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # 6.2 全局存储分配策略


    静态分配的应用：


    +   Fortran语言被设计成允许静态存储分配


    +   C语言程序的外部变量和程序中出现的常量都可以静态分配。


    +   声明在函数外面


    +   外部变量


    +   声明在函数里面


    +   静态局部变量


    +   常量'
  merge: -1
  img_proc: true
- pgno: 244
  md: '像FORTRAN这样的语言，其程序是段结构的，即由主程序段和若干子程序段组成。


    各程序段中定义的名字一般是彼此独立的，也即各段的数据对象名的作用域在各段中，同一个名字在不同的程序段表示不同的存储单元，不会在不同段间互相引用、赋值。


    另外它的每个数据名所需的存储空间大小都是常量（即不许含可变体积的数据，如可变数组），且所有数据名的性质是完全确定的。


    这样，整个程序所需数据空间的总量在编译时完全确定，换句话说，一旦存储空间的某个位置分配给了某个数据名（关联起来）之后，在目标程序的整个运行过程中，此位置（地址）就属于该数据名了。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # 6.2 全局存储分配策略


