- pgno: 286
  md: '# # 6.3 非局部名字的访问


    # ## 2、建立访问链


    假定嵌套深度为\(n_p\)的过程p调用嵌套深度为\(n_x\)的过程x


    # ### \(n_p \geq n_x\)的情况


    +   - p和x的嵌套深度分别为1，2，...，\(n_x-1\)的外围过程肯定相同


    +   - 追踪访问链\(n_p-(n_x-1)\)次，到达了静态包围x和p的且离它们最近的那个过程的最新活动记录


    +   - 所到达的访问链就是x的活动记录中的访问链应该指向的那个访问链'
