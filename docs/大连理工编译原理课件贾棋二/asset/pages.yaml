  md: '# 6.3 非局部名字的访问


    # 2、建立访问链


    假定嵌套深度为 $n_p$ 的过程 p 调用嵌套深度为 $n_x$ 的过程 x


    +   - $n_p < n_x$ 的情况

    +     - x肯定就声明在p中

    +     - 被调用过程的访问链必须指向调用过程的活动记录的访问链


    | 过程 | 嵌套深度 |

    |---|---:|

    | sort | 1 |

    | readarray | 2 |

    | exchange | 2 |

