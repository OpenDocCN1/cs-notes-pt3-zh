  md: '# # 建立算符表达式的语法树


    +   mknode (op,left,right) 建立一个运算符号结点，标号是op，两个域left和right分别指向左子树和右子树。


    +   mkleaf (id,entry) 建立一个标识符结点，标号为id，一个域entry指向标识符在符号表中的入口。


