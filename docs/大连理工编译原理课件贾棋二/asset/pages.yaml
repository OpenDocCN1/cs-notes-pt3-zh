- pgno: 167
  md: '# 课后阅读部分，不要求掌握


    # 逆波兰记号


    逆波兰记号是最简单的一种中间代码表示形式。


    这种表示法将运算对象写在前面，把运算符号写在后面，比如把a+b写成ab+，把a*b写成ab*，用这种表示法表示的表达式也称做后缀式。


    # 逆波兰表示


    | 程序设计语言中的表示 | 逆波兰表示 |

    |---|---|

    | a+b | ab+ |

    | a+b*c | abc*+ |

    | (a+b)*c | ab+c* |

    | a:=b*c+b*d | abc*bd*+:= |'
  merge: -1
  img_proc: true
- pgno: 168
  md: 后缀表示法表示表达式，其最大的优点是易于计算机处理表达式。常用的算法是使用一个栈，自左至右扫描算术表达式（后缀表示），每扫描到运算对象，就把它推进栈；扫描到运算符，若该运算符是二目的，则对栈顶部的两个运算对象实施该运算，并将运算结果代替这两个运算对象而进栈；若是一目运算符，则对栈顶元素执行该运算，并以运算结果代替该元素进栈，最后的结果留在栈顶。
  merge: -1
  img_proc: true
- pgno: 169
  md: '例如 B@CD*+（它的中缀表示为—B+C*D，使用@表示一目减）的计值过程为：

    1. B进栈；

    2. 对栈顶元素施行一目减运算，并将结果代替栈顶，即一B置于栈顶；

    3. C进栈；

    4. D进栈；

    5. 栈顶两元素相乘，两元素退栈，相乘结果置栈顶；

    6. 栈顶两元素相加，两元素退栈，相加结果进栈，现在栈顶存放的是整个表达式的值。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '逆波兰表示很容易扩充到表达式以外的范围。

    只要遵守运算对象后直接紧跟它们的运算符的规

    则即可。

    比如把转语句GOTO L写为 “L jump ”，

    运算对象L为语句标号，运算符jump表示转到

    某个标号。再比如条件语句if E then S1 else S2

    可表示为： ES1S2¥，把if then else看成三目运

    算符，用¥来表示。'
