  md: '语义规则b := f(c₁, c₂, ..., cₖ )中，函数f通常是表达式（T.val=F.val）。也有一些规则写成过程调用或程序段（打印值，输出中间代码等），称为产生副作用的操作（如：print(E.val)）可看成是产生式左部非终结符的虚拟综合属性。


