  md: '# # 6.1 局部存储分配策略


    # # 6.1.3 活动记录。 。 。


    过程的活动中用于存放所需信息的存储空间，称为活动记录或帧


    编译程序每次运行时， 编译器从操作系统 （OS） 获得一块存储区 （内存） 。 其内容包括：


    +   - 编译后的目标代码 (可执行程序 .exe)


    +   - 数据对象 (各种静态变量和动态变量)


    +   - 用于管理过程活动的控制栈（活动记录）'
