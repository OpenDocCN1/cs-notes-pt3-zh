  md: '# 有限自动机


    确定的有限自动机（简称DFA）


    一个数学模型，包括：


    +   - 状态集合S；

    +   - 输入字母表Σ；

    +   - 转换函数 *move*: S × Σ → S；

    +   - 唯一的初态 s∈S；

    +   - 终态集合F⊆S；


    识别语言 (a|b)*ab 的DFA


