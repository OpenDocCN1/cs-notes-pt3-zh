- pgno: 48
  md: '# 语法分析内容总结


    +   - **LR、LALR的构造方法**（在SLR的基础上加上搜索符）

    +     - 搜索符的求法，根据造成目前项目出现的那个父项目来求。

    +     - 求闭包的过程中可能出现要添加的项目已经存在，但是搜索符不同的情况，相当于其父项目已经改变，此时需要再求一遍搜索符。


    +   - **SLR、LR、LALR的区别及判别方法**

    +     - 通过构造DFA，看其中的状态是否有冲突（“移进—规约”或“规约—规约”）若有冲突则不属于该文法类型。

    +     - 通过构造分析表，看其中某项是否有冲突。'
