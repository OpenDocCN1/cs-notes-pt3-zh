- pgno: 70
  md: '# 4.1 语法制导的定义


    # 语法制导翻译


    根据语法分析中产生式对应语义规则进行翻译方法称语法制导翻译。


    语法制导：基于语法分析中用到的文法产生式。


    翻译：完成语义分析的各项功能，不仅指生成中间代码。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 4.1 语法制导的定义


    # 4.1.1 语法制导定义的形式


    +   - 基础文法

    +   - 每个文法符号有一组属性

    +   - 每个文法产生式 $A \to \alpha$ 有一种形式为 $b := f(c_1, c_2, \ldots, c_k)$ 的语义规则，其中 $f$
    是函数，$b$ 和 $c_1, c_2, \ldots, c_k$ 是该产生式文法符号的属性。


    +   - 综合属性：如果 $b$ 是 $A$ 的属性，$c_1, c_2, \ldots, c_k$ 是产生式右部文法符号的属性或 $A$ 的其它属性。

    +   - 继承属性：如果 $b$ 是产生式右部某个文法符号 $X$ 的属性。

    +   - 以上两种情况下，都说 $b$ 依赖于属性 $c_1, c_2, \ldots, c_k$。


    > 属性值由分析树中它的子结点属性值来计算


    > 属性值由结点的兄弟结点及父结点的属性值来计算。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 继承属性和综合属性的性质




    +   - 终结符号只有综合属性，他们由词法分析器提供。

    +   - 非终结符号既有综合属性也可有继承属性，文法的开始符号没有继承属性，除非另外加以说明。

    +   - 文法符号的综合属性集和继承属性集的交集应为空。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # 继承属性和综合属性的性质


    +   对出现在产生式右边的继承属性和出现在产生式左边的综合属性都必须提供一个计算规则。属性计算规则中只能使用相应产生式中的文法符号的属性。


    +   出现在产生式左边的继承属性和出现在产生式右边的综合属性不由所给的产生式的属性计算规则进行计算，它们由其它产生式的属性规则计算或者由属性计算器的参数提供。'
  merge: -1
  img_proc: true
- pgno: 74
  md: "语义规则所描述的工作可以包括属性计算、静态语义检查、符号表操作、代码生成等等。\n\n例，考虑非终结符A，B和C，其中，A有一个继承属性a和一个综合属性b，B有综合属性c，C有继承属性d。产生式A→BC可能有规则：\n\
    \nC.d:=B.c+1  \nA.b:=A.a+B.c\n\n而属性A.a和B.c在其它地方计算。"
  merge: -1
