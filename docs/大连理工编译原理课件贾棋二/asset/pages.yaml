- pgno: 390
  md: '# # FIRST集合及FOLLOW集合的计算方法


    # ## FIRST集合计算方法


    +   - 若X→a..，则将终结符 a 加入FIRST(X)中


    +   - 若X→ε，则将ε加入FIRST(X)中


    +   - 若X→Y...，且Y属于非终结符，则将FIRST(Y)\{ε}加入到FIRST(X)中


    +   - 若X→Y1Y2..YK，且Y1,Y2,..Yi-1都是非终结符，且Y1,Y2,..Yi-1的FIRST集合中均包含ε，则将FIRST(Yj)的所有非ε元素加入到FIRST(X)中，（j=1,2,..i）。特别地，若Y1~YK均有ε产生式，则将ε加到FIRST(X)中。'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# # FIRST集合及FOLLOW集合的计算方法


    # ## FOLLOW集合计算方法


    +   - 对文法开始符号S,置$于FOLLOW(S)中。


    +   - 若有A→αBβ，则将FIRST(β)\{ε} 加入FOLLOW(B)中。（此处α 可以为空）


    +   - 若A→α B 或A→α B β,且 β ⇒* ε （即ε 属于FIRST(β)），则将 FOLLOW(A)加入FOLLOW(B)中 （此处α 可以为空）。'
  merge: -1
  img_proc: true
