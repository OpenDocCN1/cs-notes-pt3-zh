- pgno: 458
  md: "# # 例 题\n\n假定使用(a)值调用； (b)引用调用； (c)复写—恢复调用；\n(d)换名调用。 下面程序打印的结果是什么。\n\n```\n\
    program main(input,output);\nvar a,b: integer;\nprocedure p(x,y,z: integer);\n\
    begin\n    y:=y+1 ;\n    z:=z+x;\nend;\nbegin\n    a:=2;\n    b:=3;\n    p(a+b,a,\
    \ a) ;\n    print a;\nend.\n```"
  merge: -1
  img_proc: true
- pgno: 459
  md: "# 例题\n\n+   - **(a)** 对值调用而言，由于被调用过程中对形式参数的赋值不会改变实在参数的值，因此对过程 `p` 的调用不改变 `a`\
    \ 的值，因此 `a` 仍然是 `2`。\n\n+   - **(b)** 在引⽤调用的时候，`p(a+b, a, a)` 相当于 `p(5, a, a)`（注意，5\
    \ 的值存放在临时单元，传送的临时单元的地址）。在被调用过程中任何对形式参数的引用和赋值，也就是对相应实在参数的引用和赋值。因此 `y:=y+1` 的执行结果使得\
    \ `a` 等于 3，进一步执行 `z:=z+x` 使得 `a=8`。\n\n+   - **(c)** 复写—恢复调用等价于下面的执行序列：\n+   \n\
    +     ```text\n+     t:=a+b;  x:=t;  y:=a;  z:=a;    ——实参的值传给形参\n+     y:=y+1;\n\
    +     z:=z+x;\n+     t:=x;    a:=y;  a:=z;             ——形参的结果传给实参\n+     ```\n\
    \n+   - 如果回送形式参数值的次序反过来的话，则调用后 `a` 的结果是 3。"
  merge: -1
  img_proc: true
