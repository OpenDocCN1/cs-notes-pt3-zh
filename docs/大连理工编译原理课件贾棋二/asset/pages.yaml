- pgno: 114
  md: '# # 4.1 语法制导的定义


    # ## 语义规则的计算方法


    +   - 分析树方法：前面介绍的方法

    +   - 基于规则的方法：静态确定语义规则的计算次序。

    +   - 忽略规则的方法：事先确定属性的计算策略（如边分析边计算），那么语义规则的设计必须符合所选分析方法的限制。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 语义规则的计算方法


    □ 基于(语义)规则的方法


    +   - 语法分析和属性计算分开，先构造分析树，然后按预先定义的策略遍历分析树来计算属性。


    +   - 语义规则的定义和计算顺序(翻译模式)在编译器构造之前确定。


    +   - 分析树遍历策略的确定(构造编译器时)要考虑语义规则的定义及计算顺序，因此是基于规则的方法。


    +   - 优点：不构造依赖图，不对依赖图进行拓扑排序，提高了时空效率。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 语义规则的计算方法


    # 忽略（语义）规则的方法


    +   - 在进行语法分析的同时进行翻译，即边分析边计算属性，计算次序由分析方法确定而与语义规则无关。

    +   - 缺点：这样确定计算次序将限制能实现的语法制导定义的种类。

    +   - 优点：不构造依赖图，不对依赖图进行拓扑排序，提高了时空效率。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# # 加深理解


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_117_0.png)


    • 每个文法产生式 \( A \to \alpha \) 有一组形式为 \( b := f(c_1, c_2, \dots, c_k) \) 的语义规则，其中
    \( f \) 是函数，\( b \) 和 \( c_1, c_2, \dots, c_k \) 是该产生式文法符号的属性


    —综合属性：如果 \( b \) 是 \( A \) 的属性，\( c_1, c_2, \dots, c_k \) 是产生式右部文法符号的属性或 \( A
    \) 的其它属性


    —继承属性：如果 \( b \) 是产生式右部某个文法符号 \( X \) 的属性。


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_117_1.png)'
