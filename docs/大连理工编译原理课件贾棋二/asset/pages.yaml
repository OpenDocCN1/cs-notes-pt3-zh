    # ## 缓冲区溢出攻击：


    ![](img/4571939c0321e2c5dec9f0dd5554d04d_268_0.png)


    根据程序在执行函数调用时，函数返回地址与函数的局部缓冲区都位于系统栈（活动栈）这一原理，利用代码中对局部变量的边界条件疏于检查的漏洞，篡改函数返回地址，引起程序异常或者改变程序执行流程，进而获得程序控制权。'
  merge: -1
  img_proc: true
