    # # 7.9.2 估算平均无故障时间的方法


    # ## B. 分别测试法


    +   随机地给一部分错误加标记，分别测试法使用两个测试员(或测试小组)，彼此独立地测试同一个程序的两个副本，把其中一个测试员发现的错误作为有标记的错误。具体做法是，在测试过程的早期阶段，由测试员甲和测试员乙分别测试同一个程序的两个副本，由另一名分析员分析他们的测试结果。用τ表示测试时间，假设τ=0时错误总数为B₀；τ=τ₁时测试员甲发现的错误数为B₁；τ=τ₁时测试员乙发现的错误数为B₂；τ=τ₁时两个测试员发现的相同错误数为bₒ。'
  - "[PAGE 574]\n\n# # 7.9.2 估算平均无故障时间的方法\n\n+   如果认为测试员甲发现的错误是有标记的，即程序中有标记的错误总数为\\\
    ( B_1 \\)，则测试员乙发现的\\( B_2 \\)个错误中有\\( b_c \\)个是有标记的。假定测试员乙发现有标记错误和发现无标记错误的概率相同，则可以估计出测试前程序中的错误总数为\
    \  \n+   \n+   [B_0 = \\frac{B_2}{b_c} B_1]\n\n+   使用分别测试法，在测试阶段的早期，每隔一段时间分析员分析两名测试员的测试结果，并且用上式计算\\\
    ( B_0 \\)。如果几次估算的结果相差不多，则可用\\( B_0 \\)的平均值作为\\( E_T \\)的估计值。此后一名测试员可以改做其他工作，由余下的一名测试员继续完成测试工作，因为他可以继承另一名测试员的测试结果，所以分别测试法增加的测试成本并不太多"
  - '[PAGE 575]


    # 思考题


    +   在测试一个长度为48000条指令的程序时，第一个月由甲、乙两名测试员各自独立测试这个程序。经过一个月测试后，甲发现并改正了20个错误，使MTTF达到8h。与此同时，乙发现24个错误，其中的6个错误甲也发现了。以后由甲一个人继续测试这个程序。问：

    +   （1）刚开始测试时，程序总过有多少个潜藏的错误？

    +   （2）为使MTTF达到240h，必须再改正多少个错误？'
  - "[PAGE 576]\n\n# # 思考题参考答案\n\n+   - （1）本题采用了分别测试法  \n+     $$B_0 = \\frac{B_2}{b_C}\
    \ B_1 = \\frac{24}{6} * 20 = 80$$\n\n+   - （2）根据公式  \n+     $$MTTF = \\frac{1}{K(E_r\
    \ / I_T - E_C(\\tau) / I_T)}$$  \n+     得  \n+     $$8 = \\frac{1}{K(80 / 48000\
    \ - 20 / 48000)}$$  \n+     则  \n+     $$K = 100$$\n\n+   - 即，甲还需要再测试出58个错误，才能使MTTF为240h\n\
    \n+   $$E_C = E_r - \\frac{I_T}{K * MTTF}$$  \n+   $$= 80 - \\frac{48000}{100\
    \ * 240} = 78$$"
