    \n## 7.3.3 计算机测试\n\n- 驱动程序和存根程序代表**开销**\n- 为了测试必须编写测试软件，但**不作为软件产品的一部分**\n- **内聚程度**影响单元测试的复杂性\n\
    \  - 高内聚可简化测试过程\n\n## 渐增式组装\n\n### 7.4.1 自顶向下集成(Top-Down Integration)\n\n- 从**主控制模块(main\
    \ control module)**开始，沿着软件的控制层次向下移动，从而逐渐把各个模块结合起来\n- 在把附属于(以及最终附属于)主控制模块的那些模块组装到软件结构中去时，可使用**深度优先**或**宽度优先**的策略\n\
    \n## 7.4 集成测试\n\n### 7.4.2 自底向上集成(Bottom-up Integration)\n\n- 从“原子”模块(在软件结构最低层的模块)开始组装和测试。因为是从底部向上结合，总能得到需要的下层处理功能，所以**不需要存根程序**\n\
    - 用下述步骤可以实现自底向上的结合策略：\n  1. 把低层模块组合成实现某特定软件子功能的族\n  2. 写一个**驱动程序**(用于测试的控制程序)，协调测试数据的输入和输出\n\
    \  3. 对由模块组成的子功能族进行测试\n  4. 去掉驱动程序，沿软件结构自下向上移动，把子功能族组合起来形成更大的子功能族\n- 上述第2步到第4步实质上构成了一个循环\n\
    \n"
