  md: "\n## 3.2.3 简易的应用规格说明技术 FAST(Facilitated Application Specification Techniques)\n\
    \n- 提倡用户与开发者密切合作，共同标识问题，提出解决方案的要素，商讨不同的方法并指定基本的需求\n- 简易的应用规格说明技术已经成为信息系统界使用的主流技术\n\
    - 在中立地点（Neutral place）举行由开发者和用户双方出席的会议\n- 制定准备会议和参加会议的规则（Rules）\n- 提出一个议事日程（Agenda），这个日程应该足够正式，以便能够涵盖所有要点；同时这个日程应该足够非正式，以便鼓励自由思维\n\
    \  - Brainstorming encouraged\n- 由一个“协调人”（Facilitator）来主持会议\n- 达成一个共同目标（Common\
    \ Goal）\n- 标识问题、提出解决方案要素、商讨不同的方法以及在有利于实现目标的氛围中指定初步的需求\n- 起草完整的软件需求规格说明书\n\n![](img/576b58d2c10334d3487443b8cc7c5551_160_0.png)\n\
    \n## 3.2.4 快速建立软件原型\n\n- 构建原型的要点是，它应该实现用户看得见的目标系统的主要功能（例如屏幕显示或打印报表），省略目标系统的“隐含”功能（如修改文件）\n\
    - 快速原型应该具备的首要特性是“快速”\n  - 快速原型的目的是尽快向用户提供一个可在计算机上运行的目标系统的模型，以便使用户和开发者在目标系统应该“做什么”这个问题上尽可能快地达成共识\n\
    - 快速原型应该具备的第二个特性是“容易修改”\n  - 如果原型的第一版不是用户所需要的，就必须根据用户的意见迅速地修改它，构建出原型的第二版，以更好地满足用户的需求\n\
    \  - 在实际开发软件产品时，“修改—试用—反馈”的过程可能重复多遍，如果修改耗时过多，势必延误软件开发时间\n- 构建原型的方法和工具\n  - 第四代技术（4GL）\n\
    \    - DB查询及报表生成、界面生成工具\n  - 可重复的软件构件\n    - 软件体系构件(程序)、过程构件(模块)、数据结构\n  - 形式化规格说明和原型环境\n\
    \    - Z语言等（Chap. 4）\n\n## 3.3 分析建模与规格说明\n\n### 3.3.1 分析建模\n\n- 模型：是为了理解事物而对其做出的一种抽象，是对事物的一种无歧义的书面描述\n\
    - 模型=一组图形**符号**+组织这些符号的**规则**\n- 结构化分析实质是一种**创建模型**的活动，通过需求分析而建立的模型必须达到下述的三个基本目标\n\
    \  - 描述用户的需求\n  - 为软件设计工作奠定基础\n  - 定义一组需求，一旦开发出软件产品之后，就可以用这组需求为标准来验收该产品\n\n![](img/576b58d2c10334d3487443b8cc7c5551_165_0.png)\n\
    \n数据字典\nE-R图\n数据流图\n状态转换图\n数据对象描述\n数据处理规格说明\n控制规格说明\n数据建模\n功能建模\n行为建模\n\n### 3.3.2\
    \ 软件需求规格说明\n\n- 软件需求规格说明(SRS)——分析阶段的最终成果\n- 自然语言：容易书写、容易理解\n- 形式化方法：无歧义、明确、完整（Chap.\
    \ 4）\n\n## 3.4 实体—关系图（Entity-Relationship Diagram）\n\n- 数据模型包含三种相互关联的信息：**数据对象**、描述数据对象**属性**及数据对象彼此间相互连接的**关系**。\n\
    - 数据对象\n  - 数据对象是对软件必须理解的**复合信息**的表示。所谓复合信息是指具有一系列不同性质或属性的事物，因此，仅有单个值的事物（例如长度，名称）不是数据对象\n\
    \  - 数据对象可以是外部实体（产生和使用信息的事物）、事物（如报表）、角色（如教师、学生）、行为或事件（选课）、组织单位、地点或结构\n  - 数据对象只封装了数据，没有包含作用于这些数据上的操作\n\
    \n### 属性\n\n- 属性定义了数据对象的性质和特征\n- 为了唯一地标识数据对象的某一个实例，定义数据对象中的一个属性或几个属性为**关键字**，简称键\
    \ (key)\n- 应该根据对所要解决的问题的理解，来确定特定数据对象的一组合适的属性\n\n- 关系：数据对象彼此之间相互连接的方式称为关系（联系）\n\
    \  - 一对一联系（1：1）\n  - 一对多联系（1：N）\n  - 多对多联系（M：N）\n- 关系本身也可能有属性\n\n![](img/576b58d2c10334d3487443b8cc7c5551_169_0.png)\n\
    \n### ER模型表示方法\n\n- ER图中包含**实体（即数据对象）**、**关系**和**属性**三种基本成分\n- 通常用矩形框代表实体，用连接相关实体的菱形框表示关系\n\
    - 用椭圆形或圆角矩形表示实体（或关系）的属性\n- 并用无向边把实体（或关系）与其属性连接起来\n\n### 某校教学管理E-R图\n\n![](img/576b58d2c10334d3487443b8cc7c5551_171_0.png)\n\
    \n### ER图的建立过程\n\n- 对系统的数据域和功能域进行分析，确定系统中所涉及的实体\n  - 例如，在工资计算系统中，单位对职工的工作情况进行考勤，根据出勤结果、基本档案工资、奖金及扣款计算职工的实发工资\n\
    \  - 因此，工资系统中所涉及的实体就包括职工、出勤、奖励和扣款\n- 确定系统中各实体之间的关系\n  - 如工资计算系统中，一名职工一个月只有一条出勤记录，因此职工和出勤两个实体之间是一对一的关系\n\
    \  - 一名职工在一个月中对应着多项扣款，如水电费、缺勤扣款、个人所得税等，因此职工和扣款之间是一对多的关系\n  - 同理，一名职工在一个月中可以获得多项奖励，因此职工和奖金之间也是一对多的关系\n\
    - 确定各实体及关系的属性\n  - 例如，工资计算系统的职工实体具有职工号、性别、职称、年龄、部门、基本工资等属性\n\n### 工资计算系统的E-R模型\n\
    \n### 思考题\n\n- 请为某仓库的管理设计一个ER模型\n- 该仓库主要管理零件的订购和供应等事项。仓库向工程项目提供零件，并且根据需要向供应商订购零件\n\
    \n### 思考题参考答案\n\n![](img/576b58d2c10334d3487443b8cc7c5551_176_0.png)\n\n## 3.5\
    \ 数据规范化\n\n- 第一范式(1NF)\n  - 每个属性值都必须是原子值，即仅仅是一个简单值而不含内部结构\n- 第二范式(2NF)\n  - 满足第一范式的条件，而且每个非关键字属性都由整个关键字决定（而不是由关键字的一部分来决定）\n\
    - 第三范式(3NF)\n  - 符合第二范式条件，而且一个非关键字属性不能仅仅是对另一个非关键字属性的进一步描述（即一个非关键字属性值不依赖于另一个非关键字属性值）\n\
    \n### 非2NF 的示例\n\n- 现假设有一个关系所具有的属性如下：学生学号、姓名、性别、出生年月、籍贯、政治面貌、课程名称、成绩\n- 依赖关系如下：\n\
    \  - 学生学号→姓名\n  - 学生学号→性别\n  - 学生学号→出生年月\n  - 学生学号→籍贯\n  - 学生学号→政治面貌\n  - 学生学号、课程名称→成绩\n\
    \n| 学生学号 | 姓名 | 性别 | 出生年月 | 政治面貌 | 籍贯 | 课程名称 | 成绩 |\n|---|---|---|---|---|---|---|---|\n\
    \n### 非3NF 的示例\n\n- 现假设有一个关系所具有的属性如下：学生学号、姓名、性别、出生年月、籍贯、政治面貌、学生所在系、系所在地点。数据元素之间的依赖关系如下\n\
    \  - 学生学号→姓名\n  - 学生学号→性别\n  - 学生学号→出生年月\n  - 学生学号→籍贯\n  - 学生学号→政治面貌\n  - 学生学号→学生所在系\n\
    \  - 学生学号→系所在地点\n  - 学生所在系→系所在地点\n\n| 学生学号 | 姓名 | 性别 | 出生年月 | 政治面貌 | 籍贯 | 学生所在系\
    \ | 系所在地点 |\n|---|---|---|---|---|---|---|---|\n"
