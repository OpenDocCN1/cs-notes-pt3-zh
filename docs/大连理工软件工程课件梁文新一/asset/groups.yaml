    +   - (4)实现(Implementation): 建立代码的分层结构，用构件实现类和对象，把设计模型转化为实现结果，进行单元测试和系统集成


    +   - (5)测试(Test): 根据事先定义的度量和准则检查各个子系统的交互与集成，验证所有需求是否正确实现，确认系统缺陷并确保在软件部署之前消除缺陷


