    6. 部署 (Deployment): 在实际使用环境中测试软件、包装要交付的软件、发布软件产品、培训最终用户及销售人员\n\n### 核心支持工作流\n\n\
    7. 配置和变更管理 (Configuration & Change Management): 跟踪并维护在软件开发过程中产生的所有制品的完整性和一致性\n\
    8. 项目管理 (Project Management): 提供项目管理框架，为软件开发项目制定计划、人员配备、执行和监控准则，并为风险分析提供框架\n9.\
    \ 环境 (Environment): 向软件开发机构提供软件开发环境，包括过程管理和工具支持\n\n## RUP开发过程阶段\n\n- RUP把软件生命周期划分为四个连续的阶段\n\
    \  - 初始阶段 (Inception Phase)\n  - 精化阶段 (Elaboration Phase)\n  - 构建阶段 (Construction\
    \ Phase)\n  - 移交阶段 (Transition Phase)\n\n## 初始阶段 (Inception Phase)\n\n### 主要目标\n\
    \n- 建立项目的软件规模和边界条件，包括运作前景、验收标准以及希望产品中包括和不包括的内容\n- 识别系统的关键用例\n- 对比一些主要场景，展示至少一个备选构架\n\
    - 评估整个项目的总体成本和进度\n- 评估潜在的风险（源于各种不可预测因素）\n- 准备项目的支持环境\n\n### 主要成果\n\n- 产品蓝图文档，即关于项目的核心需求、关键特性、主约束的总体蓝图\n\
    - 初始的用例模型（约占总体的10%~20%）\n- 初始的项目术语表\n- 初始的商业案例，包括商业环境、验收标准等\n- 初始的风险评估\n- 项目计划\n\
    - 一个或多个原型\n\n## 精化阶段 (Elaboration Phase)\n\n### 主要目标\n\n- 确保构架、需求和计划足够稳定，充分减少风险，从而能够有预见性地确定完成开发所需的成本和进度\n\
    - 处理在构架方面具有重要意义的所有项目风险\n- 建立一个已确定基线的构架\n- 制作产品质量构件的演进式原型\n- 证明已建立基线的构架将在适当时间、以合理的成本支持系统需求\n\
    - 建立支持环境（创建开发案例、创建模板和指南、安装工具）\n\n### 主要成果\n\n- 用例模型(至少完成80%)，所有的用例和参与者都已被识别出，并完成大部分的用例描述\n\
    - 补充非功能性要求以及与特定用例没有关联的需求\n- 软件体系结构的描述\n- 可执行的软件原型\n- 修订过的风险清单和商业案例\n- 整个项目的开发计划，该开发计划应体现迭代过程和每次迭代的评价标准\n\
    - 更新的开发案例\n- 初步的用户手册\n\n## 构建阶段 (Construction Phase)\n\n### 主要目标\n\n- 完成所有所需功能的分析、开发和测试\n\
    - 迭代式、递增式地开发，为部署应用程序作好准备\n\n### 主要成果\n\n- 开发出可以交付给最终用户的产品，它至少包括：\n  - 集成于适当操作系统平台上的软件产品\n\
    \  - 用户手册\n  - 当前版本的描述\n\n## 移交阶段 (Transition Phase)\n\n### 主要目标和成果\n\n- 确保最终用户可以使用软件\n\
    - 培训用户、维护人员和销售人员\n- 根据产品的完整前景和验收标准进行评估\n\n## RUP软件开发生命周期\n\n| Phases | Inception\
    \ | Elaboration | Construction | Transition |\n|---|---|---|---|---|\n| Workflows\
    \ |  |  |  |  |\n| Business Modeling |  |  |  |  |\n| Requirements |  |  |  |\
    \  |\n| Analysis & Design |  |  |  |  |\n| Implementation |  |  |  |  |\n| Test\
    \ |  |  |  |  |\n| Deployment |  |  |  |  |\n| Configuration & Change Mgmt | \
    \ |  |  |  |\n| Project Management |  |  |  |  |\n| Environment |  |  |  |  |\n\
    | Iterations | Initial | Elab #1, Elab #2 | Const #1, Const #2, Const #N | Tran\
    \ #1, Tran #2 |\n\n## 敏捷软件开发\n\n2001年2月11-13日，17位软件开发方法专家聚集在美国Utah州东北部Wasatch\
    \ mountains里的一个叫Snowbird ski resort，一起交谈、讨论、寻找共同话题。通过交谈与会代表发现了他们所使用的方法确实存在着许多共同点，希望能将这些共同点记录下来，也希望记录下来的文档能拉响软件工业的战斗号角\n\
    \n虽然这些方法过去常被人称之为“轻载方法”（Lightweight Methods），但该名字并不足以代表这些方法的共性。会议的结果是将这些软件方法正式命名为敏捷开发方法（Agile\
    \ Development Methodology），同时组建了敏捷联盟（Agile Alliance）\n"
