  md: "\n\n## 1.4.1 瀑布模型(Waterfall Model)\n\n由W. Royce (1929-1995) 1970年提出  \n“Managing\
    \ the Development of Large Software Systems” (FTP上可下载原文)\n\n又称线性顺序模型或软件生存周期模型\n\
    \n在20世纪80年代之前，唯一被广泛采用的生命周期模型，至今仍在软件工程中得以广泛应用\n\n遵循软件生存期的划分，明确规定各个阶段的任务，各个阶段的工作自上而下、顺序展开，如同瀑布流水，逐级下落\n\
    \n传统的瀑布模型开发软件特点：\n\n### 1. 阶段间具有顺序性和依赖性\n\n- 前一阶段完成后才能开始后一阶段的工作\n- 前一阶段输出作为后一阶段输入\n\
    - 只有前一阶段有正确输出时，后一阶段才有可能正确结果\n\n### 2. 推迟实现的观点\n\n- 可避免急于求成而导致的返工\n- 将系统分析与逻辑设计同物理实现清楚分开开来\n\
    - 尽可能推迟程序的物理实现\n\n### 3. 质量保证的观点\n\n- 每个阶段都必须完成和提交规定的文档，否则则认为该阶段任务未完成\n- 每个阶段结束前都要对所完成的文档进行严格评审，以尽早发现问题，纠正错误\n\
    \n理想的瀑布模型\n\n实际的瀑布模型\n\n带“反馈环”（实线箭头表示开发过程，虚线箭头表示维护过程）  \n发现错误时，需要沿图中左侧的反馈线返回前面的阶段，修正前面阶段的产品之后再继续完成后面阶段的任务\n\
    \n### 优点\n\n- 提供了一种规范，使得分析、设计、编码、测试与维护工作可以在该规范的指导下有序地展开，避免了软件开发、维护过程中的随意状态\n-\
    \ 对于需求确定、不随时间发生变化的项目，瀑布模型仍然是一种可以考虑采用的过程模型\n\n### 缺点\n\n- 完全依赖静态文档\n- 不适应需求经常发生变更的环境（“沙滩上盖楼房”）\n\
    - 瀑布倒流→开发成本高\n- 只有到项目的开发晚期才能够得到程序的可运行版本\n- 出现“阻塞”状态\n\n## 1.4.2 快速原型模型(Rapid Prototype\
    \ Model)\n\n快速建立起可以在计算机上运行的程序，其功能往往是最终产品功能的子集  \n模型的第一步是快速建立一个能反映用户主要需求的原型系统，让用户试用，通过实践来了解目标系统的概貌\n\
    \n不带“反馈环”，线性顺序开发  \n快速原型的本质是“快速”  \n- 尽可能使用**快速开发工具**尽快地建造出原型系统，以加速软件开发过程，节约软件开发成本\
    \  \n原型的用途是获知用户的真正需求，一旦需求确定了，原型将被完全或部分抛弃\n\n### 优点\n\n- 减少由于需求的不明确而带来的开发风险\n\n\
    ### 缺点\n\n- 不适用于大型复杂系统的开发\n- 缺乏规范化的文档，内部结构可能不够好\n\n## 1.4.3 增量模型(Incremental Model)\n\
    \n增量模型，也称渐增模型  \n把软件产品作为一系列的增量构件来设计、编码、集成和测试  \n每个构件由多个相互作用的模块构成，并且能够完成特定的功能 \
    \ \n第一个增量构件往往实现软件的基本需求，提供最核心的功能  \n然后以“滚雪球”的方式逐步扩充系统功能\n\n下图描述了一种风险更大的增量模型  \n\
    - 确定了用户需求→拟定第一个构件的规格说明→拟定第二个构件的规格说明→与此同时设计组开始设计第一个构件→…  \n- 不同构件并行开发：提高开发效率，但可能带来构件无法集成到一起的风险\n\
    \n瀑布、快速原型 vs.增量模型  \n- 前者：力求一次性给用户完整的系统  \n- 后者：逐步增加系统功能\n\n### 优点\n\n- 较短时间内提交可以部分工作的产品\n\
    - 减少全新产品带给客户的冲击\n- 重要功能被首先交付使用，可以得到更多测试\n\n### 缺点\n\n集成新的增量构件时，必须保证不破坏原有系统（需要开放式架构）\n\
    \n## 1.4.4 螺旋模型(Spiral Model)\n\n螺旋模型的基本思想：使用原型和风险分析相结合来尽量降低风险  \n可以理解为在每个阶段之前都增加了风险分析过程的快速原型模型\n\
    \n螺旋模型沿着螺线旋转，在四个象限上分别表达四个方面的活动\n\n- **制定计划** 确定软件目标，选定实施方案，弄清项目开发的限制条件\n- **风险分析**\
    \ 分析所选方案，考虑如何识别和消除风险\n- **实施工程** 实施软件开发\n- **客户评估** 评价开发，提出修正建议\n\n带箭头的点划线的长度代表当前累计的开发费用\
    \  \n螺线旋过的角度值代表开发进度  \n每周对应一个开发阶段\n\n### 优点\n\n- 对可选方案和约束条件的强调有利于已有软件的重用\n- 有助于把软件质量作为软件开发的重要目标\n\
    - 减少了过多/过少测试带来的风险\n- 维护作为开发的一个周期，与开发没有本质区别\n- 风险驱动型：风险过大时能及时终止项目\n\n### 缺点\n\n\
    - 风险驱动：需要专业的风险评估人员\n\n## 1.4.5 喷泉模型(Fountain Model)\n\n以用户需求为动力，以对象为驱动的模型，是典型的面向对象生命周期模型\
    \  \n体现了面向对象软件开发过程迭代和无缝的特性\n\n- 圆圈重叠：活动之间存在交迭\n- OO方法在概念和表示方法上的一致性保证了各项开发活动间的无缝过渡\n\
    - 向下箭头：阶段内的迭代（求精）\n- 各项活动无明显边界，可同步进行  \n  - 但为避免活动开发过分无序，应把“线性过程”（快速原型模型或如图中的中轴线）作为总目标\n\
    \n## 新兴的软件过程\n\n- RUP (Rational Unified Process)\n- 敏捷过程与极限编程（Agile Software Process\
    \ & eXtreme Programming）\n- 微软过程（Microsoft Solutions Framework, MSF）\n\n"
