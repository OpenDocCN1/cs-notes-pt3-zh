    # 3.3 分析建模与规格说明


    # 3.3.1 分析建模


    +   模型： 是为了理解事物而对其做出的一种抽象， 是对事物的一种无歧义的书面描述


    +   模型=一组图形 **符号**+组织这些符号的 **规则**


    +   结构化分析实质是一种**创建模型**的活动，通过需求分析而建立的模型必须达到下述的三个基本目标


    +   描述用户的需求


    +   为软件设计工作奠定基础


    +   定义一组需求，一旦开发出软件产品之后，就可以用这组需求为标准来验收该产品'
