    # # 6.3.6 过程设计语言（PDL）


    PDL（Procedure Design Language）也称为**伪码**（Pseudocode），这是一个笼统的名称，有许多种不同的过程设计语言在使用。它是用**正文形式**表示数据和处理过程的设计工具


    PDL具有严格的关键字**外部语法**，用于定义控制结构和数据结构；另一方面，PDL表示实际操作和条件的**内部语法**通常又是灵活自由的，以便可以适应各种工程项目的需要


    因此，一般来说PDL是一种“**混杂**”语言，它使用一种语言（通常是某种自然语言）的词汇，同时却使用另一种语言（某种结构化的程序设计语言）的语法'
  - "[PAGE 388]\n\n# (1)、数据说明：其功能是定义数据的类型和作用域\n\n格式：TYPE <变量名> AS <限定词1> <限定词2>\n\n\
    说明：1. 变量名：是一个模块内部使用的变量或模块间共用的全局变量名。\n2. 限定词1：标明数据类型\n3. 限定词2：标明该变量的作用域\n\n```\n\
    TYPE number AS STRING LENGTH (12)\n```\n\n# (2)、程序块：PDL的过程成分是由块结构构成的，而块将作为一个单个的实体来执行\n\
    \n```\nBEGIN <块名>\n    <一组伪代码语句>\nEND\n```"
