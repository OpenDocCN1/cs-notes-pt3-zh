    # # 7.3 单元测试


    +   - 通常，单元测试和编码属于软件工程过程的同一个阶段


    +   - 在编写出源程序代码并通过了编译程序的语法检查之后，可以应用人工测试和计算机测试这样两种类型的测试，完成单元测试工作


    +   - 这两种类型的测试各有所长，互相补充


    +   - 单元测试主要适用白盒测试技术，可以对多个模块进行并行测试'
