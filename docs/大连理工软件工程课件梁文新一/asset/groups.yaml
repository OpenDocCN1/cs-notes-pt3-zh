    # # 输入和输出(Input & Output)


    +   - 输入和输出信息是与用户的使用直接相关的。输入和输出的方式和格式应当尽可能方便用户的使用。一定要避免因设计不当给用户带来的麻烦

    +   - 因此，在软件需求分析阶段和设计阶段，就应基本确定输入和输出的风格。系统能否被用户接受，有时就取决于输入和输出的风格'
  - '[PAGE 458]


    # # 效率(Efficiency)


    效率主要指处理机时间和存储器容量两个方面。虽然值得提出提高效率的要求，但是在进一步讨论这个问题之前应该记住三条原则：


    +   首先，效率是性能要求，因此应该在需求分析阶段确定效率方面的要求。软件应该像对它要求的那样有效，而不应该如同人类可能做到的那样有效


    +   其次，效率是靠好设计来提高的


    +   第三，程序的效率和程序的简单程度是一致的。**不要牺牲程序的清晰性和可读性来不必要地提高效率**'
  - '[PAGE 459]


    # # 效率(Efficiency)


    # ## 从三个方面考虑程序效率：


    +   1. 程序运行时间


    +   1. 直接由详细设计阶段确定的算法的效率决定


    +   2. 程序的风格也能产生影响


    +   2. 存储器效率


    +   3. 输入输出的效率


    +   1. 缓冲、二级存储器的使用'
