    # # 7.8 调试


    +   - 调试(也称为纠错, Debug)作为成功的测试的后果而出现，即调试是在测试发现错误之后排除错误的过程


    # ## 7.8.1 调试过程


    +   - 调试不是测试，但是它总是发生在测试之后


    +   - 调试过程从执行一个测试用例开始，评估测试结果


    +   - 如果发现实际结果与预期结果不一致，则这种不一致就是一个症状，它表明在软件中存在着隐藏的问题


    +   - 调试过程试图找出产生症状的原因，以便改正错误'
