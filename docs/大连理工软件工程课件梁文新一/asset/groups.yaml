    \n耦合是对一个软件结构内不同模块之间互连程度的度量。耦合的强弱取决于模块间接口的复杂程度，进入或访问一个模块的点，以及通过接口的数据\n\n在软件设计中应该追求尽可能松散耦合的系统。在这样的系统中可以研究、测试或维护任何一个模块，而不需要对系统的其他模块有很多了解\n\
    \n此外，由于模块间联系简单，发生在一处的错误传播到整个系统的可能性就很小。因此，模块间的耦合程度的强弱将直接影响系统的可理解性、可测试性、可靠性和可维护性\n\
    \n### 耦合(Coupling)\n\n无耦合/非直接耦合(No Coupling/Indirect Coupling)：任何一个模块都独立工作（现实系统中难以实现）\n\
    \n数据耦合(Data Coupling)：一个模块访问另一个模块时，彼此之间是通过简单数据参数（不是控制参数、公共数据结构或外部变量）来交换输入、输出信息的\n\
    \n标记/特征耦合(Stamp Coupling/Data-structured Coupling)：把整个数据结构作为参数传递，而被调用的模块仅需使用其中一部分数据\n\
    \n### 耦合（Coupling）\n\n- **控制耦合（Control Coupling）**：模块间通过传递控制信息（开关、标志、名字等）来完成调用\n\
    - **外部耦合（External Coupling）**：一组模块都访问同一外部变量、通信协议或设备接口\n\n### 耦合（Coupling）\n\n\
    #### 内容耦合（Content Coupling）——最不好的耦合\n\n1. 一个模块直接访问另一个模块的内部数据\n2. 一个模块不通过正常入口转到另一个模块内部\n\
    3. 两个模块有一部分程序代码重迭（只可能出现在汇编语言中）\n4. 一个模块有多个入口（一个模块有几种功能）\n\n### 接口复杂性\n\n#### 接口方式\n\
    \n接口数据的复杂性\n\n- 直接引用\n- 过程调用语句\n\n内容耦合\n\n其它耦合\n\n- 数据项作参数\n- 数据结构、变量名作参数\n- 开关量，起控制变量作用\n\
    - 全程变量，\n- 公用数据区\n\n数据耦合\n\n标记耦合\n\n控制耦合\n\n公共耦合\n\n无接口关系\n\n非直接耦合\n\n### 耦合（Coupling）\n\
    \n- 总之，耦合是影响软件复杂程度的一个重要因素，应该采取耦合度低的模块：\n  - 尽量使用数据耦合，少用控制耦合和特征耦合，限制公共环境耦合的范围，完全避免内容耦合\n\
    \n"
