    +   1. 简单条件格式：一个布尔变量或一个关系表达式，在布尔变量或关系表达式之前还可能有一个NOT算符。关系表达式的形式如下：

    +      \( E_1 < 关系算符 > E_2 \) 关系算符：\( > < \geq \leq \neq = \)


    +   2. 复合条件：复合条件由两个或多个简单条件、布尔算符和括弧组成。布尔算符有OR、AND和NOT。不包含关系表达式的条件称为布尔表达式


    +   3. 条件成分类型：包括布尔算符、布尔变量、布尔括弧、关系算符及算术表达式'
