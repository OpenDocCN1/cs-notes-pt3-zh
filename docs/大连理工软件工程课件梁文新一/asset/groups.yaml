  md: "\n## 4. 判定/条件覆盖(Decision/Condition Coverage)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_499_0.png)\n\
    \n使用下面两组测试数据就可以达到上述覆盖标准：\n\n- A=2, B=0, X=4\n  - （满足 A>1, B=0, A=2, X>1的条件，执行路径sacbed,\
    \ a=T; b=T）\n- A=1, B=1, X=1\n  - （满足 A<=1, B!=0, A!=2, X<=1的条件，执行路径sabd, a=F;\
    \ b=F）\n\n## 5. 条件组合覆盖(Multiple Condition Coverage)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_501_0.png)\n\
    \n共有8种可能的条件组合：\n\n- （1）A>1, B=0\n- （2）A>1, B!=0\n- （3）A<=1, B=0\n- （4）A<=1, B!=0\n\
