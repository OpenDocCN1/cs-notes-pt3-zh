    # ### 3.3.2 软件需求规格说明


    +   - 软件需求规格说明(SRS)——分析阶段的最终成果


    +   - 自然语言：容易书写、容易理解


    +   - 形式化方法：无歧义、明确、完整（Chap. 4）'
