    - 容易估计改变数据对其相应模块所产生的影响\n- 设计和开发数据库的第一步\n\n## 2.5 数据字典(Data Dictionary)\n\n###\
    \ 2.5.4 数据字典的实现\n\n- CASE工具\n  - PowerDesigner\n  - Visio\n- 人工卡片\n\n名字：定货报表 \
    \ \n别名：定货信息  \n描述：每天一次送给采购员的需要定货的零件表  \n定义：定货报表=零件编号+零件名称+定货数量+目前价格+主要供应者+次要供应者\
    \  \n位置：输出到打印机\n\n名字：定货数量  \n别名：  \n描述：某个零件一次定货的数量  \n定义：定货数量=1(数字)5  \n位置：定货报表\
    \  \n定货信息\n\n名字：零件编号  \n别名：  \n描述：唯一地标示库存清单中一个特定零件的关键域  \n定义：零件编号=8(字符)8  \n位置：定货报表\
    \  \n定货信息  \n库存清单  \n事物\n\n## 2.6 成本/效益分析(Cost/Profit Analysis)\n\n- 投资开发新系统目的\n\
