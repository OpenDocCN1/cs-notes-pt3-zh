    # 5.3 启发规则 (Heuristics)


    1 改进软件结构提高模块独立性


    +   ▪ 软件初步结构→审查分析→模块分解或合并→降低耦合提高内聚


    2 模块规模应该适中


    +   ▪ 规模过大：理解不充分，进行分解


    +   ▪ 规模过小：系统接口复杂


