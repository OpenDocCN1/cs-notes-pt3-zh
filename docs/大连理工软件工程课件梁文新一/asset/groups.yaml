    \n1. 问题定义\n   - “要解决的问题是什么”——问题性质、工程目标、工程规模\n\n2. 可行性研究\n   - “上一个阶段所确定的问题是否有行得通的解决办法”\n\
    \   - 预定的系统规模、时间期限\n   - 问题是否值得去解\n   - 技术、经济、法律、社会因素等多方面\n\n3. 需求分析\n   - 准确回答“目标系统必须做什么”\n\
    \   - 对系统提出完整、准确、清晰、具体的要求\n   - 用正式文档准确地记录对目标系统的需求——规格说明书(specification)\n\n###\
    \ 4. 概要设计（总体设计）\n\n- 概括地回答“怎样实现目标系统？”\n- (1)设计出实现目标系统的几种可能的方案并推荐出最佳方案\n- 至少设计出高、中、低成本的三种方案\n\
    - (2)设计程序的体系结构——程序由哪些模块组成，模块间的关系\n\n### 5. 详细设计（模块设计）\n\n- 概要设计：比较抽象概括的方式提出了解决问题的办法\n\
    - 详细设计：把解法具体化——“应该怎样具体地实现这个系统”\n- 任务：不是编写程序，而是设计出程序的详细规格说明\n- 详细设计每个模块\n- 确定实现模块功能所需的算法和数据结构\n\
    \n6. 编码和单元测试\n   - 写出正确的、容易理解、容易维护的程序模块\n   - 单元测试：对编写出的每个程序模块进行测试\n\n7. 综合测试\n\
    \   - 任务：通过各种类型的测试(及相应的调试)使软件达到预定的要求\n   - 集成测试、验收测试\n   - 根据测试结果分析系统的可靠性\n  \
    \ - 作为软件配置的一部分保留正式的文档\n     - 测试计划、详细测试方案及实际测试结果\n\n8. 软件维护：通过各种必要的维护活动使系统持久地满足用户的需要\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_36_0.png)\n\n## 1.4 软件过程\n\n- 软件过程（软件生命周期过程）：为获得高质量软件所需完成的一系列任务的框架，其规定了完成各项任务的工作步骤\n\
    \  - Who, When, What, How\n- “把输入转化为输出的一组彼此相关的资源和活动”\n  （ISO 9000）\n  - 运用方法的顺序\n\
    \  - 应该交付的文档\n  - 为确保质量协调变化所需采取的管理措施\n  - 标志各个开发阶段任务完成的里程碑\n\n- 一个良好的软件过程应当具备如下特点：\n\
    \  (1) 易理解性(understandability)\n  (2) 可见性(visibility)：每个过程活动都以得到明确的结果而告终，保证过程的进展对外可见\n\
    \  (3) 可支持性(supportability)：容易得到CASE工具的支持\n  (4) 可接受性(acceptability)：较容易被软件工程师接受和使用\n\
    \  (5) 可靠性(reliability)：避免出现过程错误，或者出现的过程错误能够在产品出错之前被发现\n  (6) 健壮性(robustness)：不受意外发生问题的干扰\n\
    \  (7) 可维护性(maintainability)：过程可以根据开发组织的需求的改变而改进\n  (8) 高效率(high-efficiency)：从给出软件规格说明起，就能够较快地完成开发而交付使用\n\
    \n- 生命周期开模型（过程模型）\n  - 规定了把软件生命周期划分成哪些阶段\n  - 各个阶段的执行顺序\n- 典型模型\n  - 瀑布模型(Waterfall\
    \ Model)\n  - 增量模型(Incremental Model)\n  - 快速原型模型(Rapid Prototype Model)\n  -\
    \ 螺旋模型(Spiral Model)\n  - 喷泉模型(Fountain Model)\n- 新兴模型\n  - RUP (Rational Unified\
    \ Process)\n  - 敏捷过程与极限编程（Agile Software Process & XP）\n  - 微软过程（MSF）\n\n"
  mdcn: "\n\n## 1.2.3 软件工程方法学\n\n- 目前使用得最广泛的软件工程方法学，分别是传统方法学和面向对象方法学\n\n![](img/576b58d2c10334d3487443b8cc7c5551_21_0.png)\n\
    \n- 传统方法学也称为生命周期方法学或结构化范型\n  - 结构化技术（结构化分析、设计和实现）\n  - 把软件生命周期分成若干个阶段，自顶向下完成软件开发的各阶段任务\n\
