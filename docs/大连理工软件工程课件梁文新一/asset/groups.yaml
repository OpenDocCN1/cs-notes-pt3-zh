    - 工作的软件是首要进度度量标准\n- 敏捷过程提可持续的开发速度。责任人、开发者和用户应该能够保持一个长期的、恒定的开发速度\n- 不断地关注优秀的技能和好的设计会增强敏捷能力\n\
