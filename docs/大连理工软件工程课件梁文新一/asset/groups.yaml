    # 3.1.5 线性子空间


    定义3.1.5 设 W 是数域 F 上线性空间 V 的一个非空子集。如果 W 对于 V 的加法与数乘两种运算也构成数域 F 上的线性空间，则称 W 是 V
    的一个**线性子空间**，简称**子空间**。


    由定义可知，线性子空间也是线性空间。因此，线性空间的一切性质对线性子空间都成立。


    定理3.1.3 设 W 是数域 F 上线性空间 V 的一个非空子集，则 W 是 V 的子空间的充分必要条件是：


    +   1. 若 α, β ∈ W，则 α + β ∈ W；

    +   2. 若 α ∈ W，k ∈ F，则 kα ∈ W。


    证明 必要性是显然的。下面证明充分性。


    由于 W 非空，所以存在 α ∈ W。由条件 2，有 0 = 0α ∈ W，-α = (-1)α ∈ W。由条件 1 和条件 2 可知，W 对于 V 的加法与数乘运算封闭。又因为加法与数乘运算满足线性空间定义中的八条运算律，所以这些运算律在
    W 中也仍然成立。因此 W 构成数域 F 上的线性空间，即 W 是 V 的子空间。证毕。


    由定理3.1.3可知，线性空间 V 的任意子空间 W 都含有 V 的零向量。并且，如果 W 是 V 的子空间，那么 W 的零向量就是 V 的零向量；W 中元素
    α 在 W 中的负向量就是 α 在 V 中的负向量。


    由单个零向量组成的集合 {0} 是 V 的一个子空间，称为**零子空间**。V 本身也是 V 的一个子空间。零子空间和 V 本身称为 V 的**平凡子空间**；其它子空间称为**非平凡子空间**。


    例3.1.5 设 V 是数域 F 上的线性空间，则 V 的零子空间 {0} 与 V 本身都是 V 的线性子空间。


    例3.1.6 设 A 是数域 F 上的 m × n 矩阵，令齐次线性方程组 Ax = 0 的解集合为


    W = { x ∈ Fⁿ | Ax = 0 }


    则 W 是 Fⁿ 的一个子空间，称 W 为齐次线性方程组 Ax = 0 的**解空间**。'
