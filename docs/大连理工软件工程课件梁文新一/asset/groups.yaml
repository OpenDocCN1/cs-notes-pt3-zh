    \n### 思考题参考答案\n\n![](img/576b58d2c10334d3487443b8cc7c5551_176_0.png)\n\n## 3.5\
    \ 数据规范化\n\n- 第一范式(1NF)\n  - 每个属性值都必须是原子值，即仅仅是一个简单值而不含内部结构\n- 第二范式(2NF)\n  - 满足第一范式的条件，而且每个非关键字属性都由整个关键字决定（而不是由关键字的一部分来决定）\n\
    - 第三范式(3NF)\n  - 符合第二范式条件，而且一个非关键字属性不能仅仅是对另一个非关键字属性的进一步描述（即一个非关键字属性值不依赖于另一个非关键字属性值）\n\
    \n### 非2NF 的示例\n\n- 现假设有一个关系所具有的属性如下：学生学号、姓名、性别、出生年月、籍贯、政治面貌、课程名称、成绩\n- 依赖关系如下：\n\
    \  - 学生学号→姓名\n  - 学生学号→性别\n  - 学生学号→出生年月\n  - 学生学号→籍贯\n  - 学生学号→政治面貌\n  - 学生学号、课程名称→成绩\n\
    \n| 学生学号 | 姓名 | 性别 | 出生年月 | 政治面貌 | 籍贯 | 课程名称 | 成绩 |\n|---|---|---|---|---|---|---|---|\n\
    \n### 非3NF 的示例\n\n- 现假设有一个关系所具有的属性如下：学生学号、姓名、性别、出生年月、籍贯、政治面貌、学生所在系、系所在地点。数据元素之间的依赖关系如下\n\
    \  - 学生学号→姓名\n  - 学生学号→性别\n  - 学生学号→出生年月\n  - 学生学号→籍贯\n  - 学生学号→政治面貌\n  - 学生学号→学生所在系\n\
    \  - 学生学号→系所在地点\n  - 学生所在系→系所在地点\n\n| 学生学号 | 姓名 | 性别 | 出生年月 | 政治面貌 | 籍贯 | 学生所在系\
    \ | 系所在地点 |\n|---|---|---|---|---|---|---|---|\n"
