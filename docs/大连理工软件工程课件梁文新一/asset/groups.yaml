    +     - 技术可行性

    +       - 现有技术能否实现目标系统？

    +     - 经济可行性

    +       - 能否收回投资并获得利润？

    +     - 操作可行性

    +       - 操作方式是否适用于用户组织？

    +     - 法律、社会效益可行性

    +       - 《中华人民共和国著作权法》（1990）

    +       - 《计算机软件保护条例》（1991）

    +   - 预期工程总成本的5%~10%'
