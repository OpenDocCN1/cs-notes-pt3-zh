  md: "\n\n## 输入和输出(Input & Output)\n\n- 输入和输出信息是与用户的使用直接相关的。输入和输出的方式和格式应当尽可能方便用户的使用。一定要避免因设计不当给用户带来的麻烦\n\
    - 因此，在软件需求分析阶段和设计阶段，就应基本确定输入和输出的风格。系统能否被用户接受，有时就取决于输入和输出的风格\n\n## 效率(Efficiency)\n\
    \n效率主要指处理机时间和存储器容量两个方面。虽然值得提出提高效率的要求，但是在进一步讨论这个问题之前应该记住三条原则：\n\n- 首先，效率是性能要求，因此应该在需求分析阶段确定效率方面的要求。软件应该像对它要求的那样有效，而不应该如同人类可能做到的那样有效\n\
    - 其次，效率是靠好设计来提高的\n- 第三，程序的效率和程序的简单程度是一致的。**不要牺牲程序的清晰性和可读性来不必要地提高效率**\n\n## 效率(Efficiency)\n\
    \n### 从三个方面考虑程序效率：\n\n- 程序运行时间\n  - 直接由详细设计阶段确定的算法的效率决定\n  - 程序的风格也能产生影响\n- 存储器效率\n\
    - 输入输出的效率\n  - 缓冲、二级存储器的使用\n\n## 7.2 软件测试基础\n\n软件测试的定义：软件测试就是在软件投入运行前，对软件需求分析、设计规格说明和编码实现的最终审查，它是软件质量保证的关键步骤。通常对软件测试的定义有两种描述：\n\
    \n- 定义1：软件测试是为了发现错误而执行程序的过程\n- 定义2：软件测试是根据软件开发各阶段的规格说明和程序的内部结构而精心设计的一批测试用例（Test\
    \ Cases），并利用这些测试用例运行程序以及发现错误的过程，即执行测试步骤\n\n![](img/576b58d2c10334d3487443b8cc7c5551_460_0.png)\n\
    \n## 7.2.1 软件测试的目标\n\n- 由于测试的目标是暴露程序中的错误，从心理学角度看，由程序的编写者自己进行测试是不恰当的\n  - 因此，在综合测试阶段通常由其他人员组成测试小组来完成测试工作\n\
    - 测试决不能证明程序是正确的。即使经过了最严格的测试之后，仍然可能还有没发现的错误潜藏在程序中\n  - 测试只能查找出程序的错误，不能证明程序中没有错误\n\
    \n发现至今为止尚未发现的错误\n\n## 7.2.2 软件测试准则\n\n- 所有测试都应该能追溯到用户需求\n- 应该在测试开始之前就制定测试计划\n\
    - 把Pareto原则(80-20法则)应用到软件测试中\n- 应该从“小规模”测试开始，并逐步进行“大规模”测试：单元测试→集成测试→系统测试\n- 不可能完成穷举测试\n\
    - 为了达到最佳的测试效果，应该由独立的第三方从事测试工作\n\n## 7.2.3 测试方法\n\n- 按照软件测试用例的设计方法来划分：\n  - 白盒/结构测试(White-box/Structural\
    \ Testing)\n  - 黑盒/功能测试(Black-box/Functional Testing)\n- 按照软件测试的策略和过程来分类，软件测试可分为\n\
    \  - 单元/模块/部件测试(Unit/Module/Component Testing)\n  - 集成/接口/组装测试(Integration/Interface/Assembly\
    \ Testing)\n  - 系统测试(System Testing)\n  - 确认/验收测试(Validation/Acceptance Testing)\n\
    \n## 7.2.4 测试步骤\n\n大型软件系统的测试过程基本上由下述几个步骤组成\n\n### 1. 模块测试（单元、部件测试）\n\n- 每个模块作为一个单独的实体来测试，目的是保证每个模块作为一个单元能正确运行\n\
    - 单元测试大量使用白盒测试技术，检查模块控制结构中的特定路径，以确保做到完全覆盖并发现最大数量的错误\n- 发现的往往是编码和详细设计的错误\n\n###\
    \ 2. 子系统测试（集成/组装/接口测试）\n\n- 把经过单元测试的模块放在一起形成一个子系统来测试\n- 着重测试模块间的协调和通信，即模块的接口\n\
    \n### 3. 系统测试\n\n- 把经过测试的子系统装配(即集成)在一起形成完整的系统来测试\n- 往往发现软件设计中的错误，也可能发现需求说明中的错误\n\
    - 不论是子系统测试还是系统测试，都兼有检测和组装两重含义，因此称为集成测试\n- 集成测试同时解决程序验证和程序构造这两个问题\n- 在集成过程中最常用的是黑盒测试用例设计技术，当然，为了保证覆盖主要的控制路径，也可能使用一定数量的白盒测试\n\
    \n### 4.验收测试（确认测试）\n\n- 把系统作为单一的实体进行测试，测试内容与系统测试基本类似，但是是在用户积极参与下进行的，而且可能主要使用实际数据\n\
    - 发现的往往是系统需求说明书中的错误\n- 是对软件满足所有功能的、行为的和性能的需求的最终保证\n- 在确认测试过程中仅使用黑盒测试技术\n\n###\
    \ 5.平行运行\n\n- 同时运行新开发出来的系统和被它取代的旧系统，以便比较新旧两个系统的处理结果\n- （1）可以在准生产环境中运行新系统而又不冒风险\n\
    - （2）用户能有一段熟悉新系统的时间\n- （3）可以验证用户指南和使用手册之类的文档\n- （4）能够以准生产模式对新系统进行全负荷测试，可以用测试结果验证性能指标\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_470_0.png)\n\n## 7.2.5 测试阶段的信息流\n\n\
    ![](img/576b58d2c10334d3487443b8cc7c5551_471_0.png)\n\n## 7.3 单元测试\n\n- 通常，单元测试和编码属于软件工程过程的同一个阶段\n\
    - 在编写出源程序代码并通过了编译程序的语法检查之后，可以应用人工测试和计算机测试这样两种类型的测试，完成单元测试工作\n- 这两种类型的测试各有所长，互相补充\n\
    - 单元测试主要适用白盒测试技术，可以对多个模块进行并行测试\n\n## 7.3.2 代码审查\n\n- **优点：** 一次审查可以发现**多个错误**，减少系统验证的**总工作量**\n\
    - 人工测试和计算机测试是**互相补充**，相辅相成的，缺少其中任何一种方法都会使查找错误的效率降低\n\n## 7.3.3 计算机测试\n\n- 模块并不是一个独立的程序，因此必须为每个单元测试开发驱动软件(drivers)和(或)存根(stubs)软件\n\
    - 通常驱动程序也就是一个“主程序”，它接收测试数据，把这些数据传送给被测试的模块，并且印出有关的结果\n- 存根程序代替被测试的模块所调用的模块。因此存根程序也可以称为“虚拟子程序”\n\
    - 使用被它代替的模块的接口，可能做最少量的数据操作，得出对入口的检验或操作结果，并且把控制和模拟结果归还给调用它的模块\n\n![](img/576b58d2c10334d3487443b8cc7c5551_477_0.png)\n\
    \n## 7.3.3 计算机测试\n\n- 驱动程序和存根程序代表**开销**\n- 为了测试必须编写测试软件，但**不作为软件产品的一部分**\n- **内聚程度**影响单元测试的复杂性\n\
    \  - 高内聚可简化测试过程\n\n## 渐增式组装\n\n### 7.4.1 自顶向下集成(Top-Down Integration)\n\n- 从**主控制模块(main\
    \ control module)**开始，沿着软件的控制层次向下移动，从而逐渐把各个模块结合起来\n- 在把附属于(以及最终附属于)主控制模块的那些模块组装到软件结构中去时，可使用**深度优先**或**宽度优先**的策略\n\
    \n## 7.4 集成测试\n\n### 7.4.2 自底向上集成(Bottom-up Integration)\n\n- 从“原子”模块(在软件结构最低层的模块)开始组装和测试。因为是从底部向上结合，总能得到需要的下层处理功能，所以**不需要存根程序**\n\
    - 用下述步骤可以实现自底向上的结合策略：\n  1. 把低层模块组合成实现某特定软件子功能的族\n  2. 写一个**驱动程序**(用于测试的控制程序)，协调测试数据的输入和输出\n\
    \  3. 对由模块组成的子功能族进行测试\n  4. 去掉驱动程序，沿软件结构自下向上移动，把子功能族组合起来形成更大的子功能族\n- 上述第2步到第4步实质上构成了一个循环\n\
    \n"
