    # 5.5.2 变换分析


    ■ 变换分析是一系列设计步骤的总称，经过这些步骤把具有变换流特点的数据流图按预先确定的模式映射成软件结构


    ![](img/576b58d2c10334d3487443b8cc7c5551_326_0.png)'
