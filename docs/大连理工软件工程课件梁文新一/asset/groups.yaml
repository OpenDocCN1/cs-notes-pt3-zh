    # # 数据流图的注意事项：适当命名


    # ## 适当命名


    +   DFD中每个基本元素都应适当命名，名字应符合被命名对象的实际含义


    +   数据流名：表单名称，如“订单”，“收款单”等


    +   加工名：动词或及物动词加宾语，如“编辑订单”等


    +   文件名：名词，如“商品库存”，“商品名册”等


    +   源或宿：实际的人员或组织，如“顾客”，“供应商”等


    # ## 命名中应注意的问题


    +   名字应反映整个对象，而非仅反映其局部


    +   避免使用空洞、含义不清的名字，如“数据”、“信息”等


    +   若发现DFD中某个元素难以命名，则往往是DFD分解不当造成的，可考虑重新分解'
