    # # 6.2 人机界面设计


    人机界面设计（User Interface(UI) Design）是接口设计（Interface Design）的一个重要组成部分


    +   对于交互式系统来说，人机界面设计和数据设计、体系结构设计、过程设计一样重要


    +   近年来，人机界面在系统中所占的比例越来越大，在个别系统中人机界面的设计工作量甚至占设计总量的一半以上


    +   人机界面的设计质量，直接影响用户对软件产品的评价，从而影响软件产品的竞争力和寿命，因此，必须对人机界面设计给以足够重视'
  - '[PAGE 354]


    # 6.2.1 设计问题(Design Issues)


    在设计用户界面的过程中，几乎总会遇到下述四个问题：系统响应时间、用户帮助设施、出错信息处理和命令交互


    # 1. 系统响应时间(System Response Time)


    +   系统响应时间是许多交互式系统用户经常抱怨的问题。一般说来，系统响应时间指从用户完成某个控制动作(例如，按回车键或点击鼠标)到软件给出预期的响应(输出或做动作)之间的这段时间


    +   系统响应时间有两个重要属性：长度和易变性'
  - '[PAGE 355]


    # 6.2.1 设计问题(Design Issues)


    # 2. 用户帮助设施(User Guidance)


    +   几乎交互式系统的每个用户都需要帮助，当遇到复杂问题时甚至需要查看用户手册以寻找答案。大多数现代软件都提供联机帮助(Online help/manual)设施，这使得用户可以不离开用户界面就解决自己的问题


    +   常见的帮助设施有集成的和附加的两类


    +   应解决以下问题：


    +   - 提供部分还是全部功能的帮助信息

    +   - 用户如何选择帮助信息：帮助菜单、特殊功能键、HELP命令

    +   - 怎样实现帮助信息：独立窗口、指出参考某文档、屏幕固定位置现实简单提示

    +   - 返回正常工作状态：屏幕上返回、功能键

    +   - 怎样组织帮助信息：平面结构、层次结构、超文本结构'
  - '[PAGE 356]


    # 6.2.1 设计问题 (Design Issues)


    # 3. 出错信息处理 (Error Message)


    +   - **出错信息和警告信息**，是出现问题时交互式系统给出的“坏消息”


    +   - 出错信息设计得不好，将向用户提供无用的或误导的信息，反而增加了用户的挫折感'
  - '[PAGE 357]


    # 6.2.1 设计问题 (Design Issues)


    # 4. 命令交互 (Command-based Interaction)


    +   - **命令行 (Command Line, CLI)** 曾经是用户和系统软件交互的最常用方式，而且也曾经广泛地用于各种应用软件中 (Unix/Linux,
    DOS)

    +   - 现在，面向窗口的、点击和拾取方式的界面已经减少了用户对命令行的依赖，但是，许多高级用户仍然偏爱面向命令的交互方式

    +   - 在多数情况下，用户既可以从菜单中选择软件功能也可以通过键盘命令序列调用软件功能'
  - '[PAGE 358]


    # 6.2.2 设计过程 (Design Process)


    UI Prototyping：用户界面设计是一个迭代的过程，也就是说，通常先创建设计模型，再用原型实现这个设计模型，并由用户试用和评估，然后根据用户的意见进行修改


    ![](img/576b58d2c10334d3487443b8cc7c5551_358_0.png)'
  - '[PAGE 359]


    # 6.2.3 人机界面设计指南


    用户界面设计主要依靠**设计者的经验**。总结众多设计者的经验而得出的设计指南，有助于设计者设计出友好、高效的人机界面。本节介绍三类人机界面设计指南


    # 1. 一般交互指南


    一般交互指南涉及信息显示、数据输入和整体系统控制，因此，这些指南是全局性的，忽略它们将承担较大风险'
  - '[PAGE 360]


    # # 6.2.3 人机界面设计指南


    # ## 2. 信息显示


    如果人机界面显示的信息是不完整，含糊或难于理解的，则应用软件显然不能满足用户需求。可以用多种不同方式“显示”信息：用文字、图片和声音；按位置、移动和大小；使用颜色、分辨率和省略。


    # ## 3. 数据输入


    用户的大部分时间用在选择命令、键入数据和向系统提供输入。在许多应用系统中，键盘仍然是主要的输入介质，但是，鼠标、数字化仪和语音识别系统正迅速地成为重要的输入手段。下面是关于数据输入的设计指南。'
  - '[PAGE 361]


    # 6.3 过程设计的工具


    描述程序处理过程的工具称为过程设计(Procedural Design)的工具，它们可以分为图形(Graphical Design Notation)、表格(Tabular
    Design Notation)和语言(PDL)三类。要求：


    +   - 对设计的无歧义描述

    +   - 指明控制流程、处理功能、数据组织以及其他方面的实现细节

    +   - 能在编码阶段把对设计的描述直接翻译成程序代码'
