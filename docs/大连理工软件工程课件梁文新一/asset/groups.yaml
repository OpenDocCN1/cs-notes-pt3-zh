  md: "\n\n## 8.1 软件维护的定义\n\n- 维护绝不仅限于纠正使用中发现的错误。\n  - 完善性维护：50-66%\n  - 改正性维护：17-21%\n\
    \  - 适应性维护：18-25%\n  - 其他维护：4%\n\n- 上述4类维护活动都必须应用于整个软件配置，维护软件文档和维护软件的可执行代码同样重要。\n\
    \n## 8.2 软件维护的特点\n\n### 8.2.1 结构化维护与非结构化维护差别巨大\n\n#### 1. 非结构化维护\n\n- 如果软件配置的唯一成分是程序代码，那么维护活动将因文档不足而非常艰难。\n\
    \  - 对于软件结构、全程数据结构、系统接口、性能和（或）设计约束容易产生误解\n  - 对程序代码所做改动的后果也难于估量（无测试文档，不能进行回归测试）\n\
    \n- 非结构化维护需要付出很大的代价，这种维护方式是没有使用良好定义的方法学开发出来的软件的必然结果。\n\n#### 2. 结构化维护\n\n- 如果有一个完整的软件配置存在，那么维护工作从评价软件设计文档开始。\n\
    \  - 确定软件重要的结构特点、性能特点以及接口特点；\n  - 估量需求的改动将带来的影响；\n\n- 然后首先修改设计并且对所做的修改进行仔细复查；\n\
    \n- 接下来修改程序源码；\n\n- 然后根据测试说明书进行回归测试；\n\n- 交付修改后的软件。\n\n| 维护请求 | 软件 | 代码 | 配置 |\
    \ 理解设计 | 方案规划 | 修改设计 | 修改代码 | 测试复审 | 理解代码功能 | 理解？ | 修改代码 | 测试复审 | 结构化维护 | 交付使用\
    \ | 非结构化维护 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | | | | | | | | | | | |\
    \ | | | |\n\n### 8.2.2 维护的代价高昂\n\n- 维护费用稳步上升\n  - 1970年，35%-40%\n  - 1980年，40%-60%\n\
    \  - 1990年，70%-80%\n- 必须占用可用资源\n- 不能及时修改，引起用户不满\n- 引入潜伏错误，降低软件质量\n- 开发人员作为维护人员，使得开发过程混乱\n\
    - 生产率大幅度下降\n  - 美国空军飞行控制软件：$75(开发)→$4000(维护)\n\n### 8.2.3 维护的问题很多\n\n- 维护的问题，大部分都可归因于软件定义和软件开发的方法有缺点。\n\
    - 理解别人写的程序通常非常困难；\n- 需要维护的软件往往没有合格的文档；\n- 当要求对软件进行维护时，不能指望由开发人员给人们仔细说明软件；\n- 绝大多数软件在设计时没有考虑将来的修改；\n\
    - 软件维护不是一项吸引人的工作。\n\n用于维护工作的劳动\n- 生产性活动（分析评价，修改设计，编写程序代码）\n- 非生产性活动（理解程序代码的功能，解释数据结构、接口特点和性能限度等）\n\
    \n维护工作量模型：\n\\( M = p + Ke^{c-d} \\)\n- M是维护中消耗的总工作量\n- p是上面描述的生产性工作量\n- K是一个经验常数\n\
    - c是因缺乏好的设计和文档而导致复杂性的度量\n- d是对软件熟悉程度的度量\n\n该模型指明，如果使用了不好的软件开发方法（未按软件工程要求做），原来参加开发的人员或小组不能参加维护，则工作量（及成本）将按指数级增加。\n\
    \n"
