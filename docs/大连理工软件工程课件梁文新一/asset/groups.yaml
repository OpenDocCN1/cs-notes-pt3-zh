    \n### 6.2.1 设计问题(Design Issues)\n\n在设计用户界面的过程中，几乎总会遇到下述四个问题：系统响应时间、用户帮助设施、出错信息处理和命令交互\n\
    \n**1. 系统响应时间(System Response Time)**\n\n- 系统响应时间是许多交互式系统用户经常抱怨的问题。一般说来，系统响应时间指从用户完成某个控制动作(例如，按回车键或点击鼠标)到软件给出预期的响应(输出或做动作)之间的这段时间\n\
    - 系统响应时间有两个重要属性：长度和易变性\n\n**2. 用户帮助设施(User Guidance)**\n\n- 几乎交互式系统的每个用户都需要帮助，当遇到复杂问题时甚至需要查看用户手册以寻找答案。大多数现代软件都提供联机帮助(Online\
    \ help/manual)设施，这使得用户可以不离开用户界面就解决自己的问题\n- 常见的帮助设施有集成的和附加的两类\n- 应解决以下问题：\n   \
    \ - 提供部分还是全部功能的帮助信息\n    - 用户如何选择帮助信息：帮助菜单、特殊功能键、HELP命令\n    - 怎样实现帮助信息：独立窗口、指出参考某文档、屏幕固定位置显示简单提示\n\
