    ### 5.2.1 模块化 (Modularity)\n\n模块化就是把程序划分成独立命名且可独立访问的模块，每个模块完成一个子功能，把这些模块集成起来构成一个整体，可以完成指定的功能满足用户的需求。\n\
    \n### 模块化的理论依据\n\n设函数C(x)定义问题x的复杂程度，函数E(x)确定解决问题x需要的工作量。对于两个问题P1和P2，如果：C(P1)>C(P2)，则显然有：\n\
    \nE(P1)>E(P2)\n\n根据人类解决一般问题的经验，有：\n\nC(P1+P2)>C(P1)+C(P2)\n\n进而获得：E(P1+P2)>E(P1)+E(P2)\n\
    \n### 5.2.1 模块化 (Modularity)\n\n- 模块化——各个击破，复杂问题简单化\n- 接口成本：不能无限制的分割问题\n- 适当模块数：总成本最低。——如何确定：\n\
    \  - 适当模块数？\n  - 模块大小？\n\n### 5.2.1 模块化 (Modularity)\n\n#### 模块化设计的优点\n\n- 采用模块化原理可以使软件结构清晰\n\
    - 不仅容易设计也容易阅读和理解\n- 因为程序错误通常局限在有关的模块及它们之间的接口中，所以模块化使软件容易测试和调试，因而有助于提高软件的可靠性\n\
