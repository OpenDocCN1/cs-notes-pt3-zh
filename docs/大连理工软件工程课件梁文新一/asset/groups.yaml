  md: "\n## 内聚（Cohesion）\n\n内聚标志着一个模块内各个元素彼此结合的紧密程度，它是信息隐蔽和局部化概念的自然扩展。简单地说，**理想内聚的模块只做一件事情**。\n\
    \n设计时应该力求做到高内聚，通常中等程度的内聚也是可以采用的，而且效果和高内聚相差不多；但是，低内聚很不好，不应使用。\n\n内聚和耦合是密切相关的，模块内的**高内聚**往往意味着模块间的**松耦合**。\n\
    \n内聚和耦合都是进行模块化设计的有力工具，但是实践表明**内聚更重要**，应该把更多注意力集中到提高模块的内聚程度上。\n\n### 低内聚\n\n- **偶然内聚（Coincidental\
    \ Cohesion）**：一个模块内任务间关系松散或者没有关系\n- **逻辑内聚（Logical Cohesion）**：一个模块完成的任务在逻辑上属于相同或者相似的一类\n\
    - **时间内聚（Temporal Cohesion）**：模块包含的任务必须在同一段时间内执行（如初始化模块）\n\n![](img/576b58d2c10334d3487443b8cc7c5551_301_0.png)\n\
    \n### 中内聚\n\n- **过程内聚（Procedural Cohesion）**：一个模块内的处理元素相关，并且以特定的次序执行，如将程序流程图中的循环、判定部分划分成模块\n\
    - **通信内聚（Communicational Cohesion）**：模块中所有元素都使用同一个输入数据和/或产生同一个输出数据\n\n### 高内聚\n\
    \n- **顺序内聚（Sequential Cohesion）**：一个模块内的处理元素和同一个功能密切相关，并且必须顺序执行（前一个处理的输出是后一个处理的输入）\n\
    - **功能内聚（Functional Cohesion）**：模块内所有处理元素属于一个整体，完成一个单一的功能\n\n### 内聚方式的判断方法\n\n\
    - 该模块只能执行一个功能吗？\n  - 是 → 功能内聚\n  - 否 → 模块内各组成部分的关系如何？\n    - 数据流 → 次序重要吗？\n  \
    \    - 是 → 顺序内聚\n      - 否 → 通信内聚\n    - 控制流 → 次序重要吗？\n      - 是 → 过程内聚\n    \
    \  - 否 → 时间内聚\n    - 两者都不是 → 逻辑相似吗？\n      - 是 → 逻辑内聚\n      - 否 → 偶然内聚\n\n设计时力争做到高内聚，并且能够辨认出低内聚的模块，有能力通过修改设计提高模块的内聚程度，降低模块间的耦合程度，从而获得较高的模块独立性。\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_304_0.png)\n\n## 思考题\n\n### 确定每个模块的内聚类型\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_305_0.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_305_1.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_305_2.png)\n\n## 5.3 启发规则（Heuristics）\n\
    \n> Heuristics: Rules and lessons learnt by system architects after long experiences\
    \ which result in sound, stable, practical systems\n\n启发规则虽然不像前两节讲述的基本原理那样普遍适用，但是在许多场合仍然能给软件工程师有益的启示，往往能帮助他们找到改进软件设计提高软件质量的途径，因此有助于实现有效的模块化。\n\
    \n- **1. 改进软件结构提高模块独立性**\n  - 软件初步结构 → 审查分析 → 模块分解或合并 → 降低耦合、提高内聚\n- **2. 模块规模应该适中**\n\
    \  - 规模过大：理解不充分，进行分解\n  - 规模过小：系统接口复杂\n  - 代码 50-100 行，不超过 1-2 页\n- **3. 深度、宽度、扇出和扇入都应适当**\n\
    \  - 深度（Depth）：软件结构中控制的层数\n  - 宽度（Width）：软件结构中同一个层次上的模块总数最大值\n  - 扇出（Fan-out）：一个模块直接控制（调用）的模块数目（一般应控制在\
    \ 7 个之内）\n  - 扇入（Fan-in）：有多少个上级模块直接调用它\n\n  ![](img/576b58d2c10334d3487443b8cc7c5551_309_0.png)\n\
    - **4. 模块的作用域应该在控制域之内**\n  - 作用域（Scope of effect）：受该模块内一个决策（如判定条件）影响的所有模块的集合\n\
    \  - 控制域（Scope of control）：这个模块本身以及所有直接或者间接从属于它的模块的集合\n\n  ![](img/576b58d2c10334d3487443b8cc7c5551_310_0.png)\n\
    - **5. 力争降低模块接口的复杂程度**\n  - 仔细设计模块接口——信息传递简单，和模块的功能一致\n  - 例：求一元二次方程的根模块 QUAD_ROOT(TBL,\
    \ X)，其中 TBL 为系数数组，X 为根数组\n  - QUAD_ROOT(A, B, C, ROOT1, ROOT2)，其中 A、B、C 为系数，ROOT1\
    \ 和 ROOT2 为根\n- **6. 设计单入口单出口的模块**\n  - 避免内容耦合\n- **7. 模块功能应该可以预测**\n  - 模块可预测：相同的输入产生相同的输出\n\
    \n## 5.4.1 层次图和 HIPO 图\n\n- **HIPO 图**是美国 IBM 公司发明的“层次图加输入/处理/输出图”的英文缩写\n- 为了使\
    \ HIPO 图具有**可追踪性**，在 H 图（即层次图）里除了顶层的方框之外，每个方框都加了**编号**\n- H 图中每个方框代表模块的处理过程，都可以有一张\
    \ **IPO 图**与之对应\n\n## 5.4.2 结构图\n\n结构图（Structure Chart）是进行软件结构设计的另一个有力工具。结构图也是描绘软件结构的图形工具。\n\
    \n- 图中一个方框代表一个模块，框内注明模块的名字或主要功能\n- 方框之间的箭头（或直线）表示模块的调用（call）关系\n\n在结构图中通常还用带注释的箭头表示模块调用过程中来回传递的信息。\n\
    \n- 可以利用注释箭头尾部的形状来区分传递的信息是数据还是控制信息\n- 尾部是空心圆表示传递的是数据\n- 实心圆表示传递的是控制信息\n\n### 结构图中的辅助符号\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_318_0.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_318_1.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_318_2.png)\n\n### 结构图示例\n\n![](img/576b58d2c10334d3487443b8cc7c5551_319_0.png)\n\
    \n## 5.5 面向数据流的设计方法\n\n面向数据流的设计方法的目标是给出设计软件结构的一个系统化的途径。\n\n在需求分析阶段，信息流是一个关键考虑因素，通常用数据流图描绘信息在系统中加工和流动情况。\n\
    \n- 面向数据流的设计方法定义了一些不同的“映射”，利用这些映射可以把数据流图变换成软件结构\n- 因为任何软件系统都可以用数据流图表示，所以面向数据流的设计方法理论上可以设计任何软件的结构\n\
    - 通常所谓的 SD 方法，也就是基于数据流的设计方法\n\n### 变换流\n\n- 输入：物理输入 → 输入信息 → 格式检查 → 正确信息 → 逻辑输入\n\
    - 变换中心：处理 → 结果\n- 输出：逻辑输出 → 显示 → 数据 → 物理输出\n\n![](img/576b58d2c10334d3487443b8cc7c5551_322_0.png)\n"
