    \ | T | T | T |\n| 68, 8,60 | F | F | T | T |\n| 8, 68,60 | F | T | F | T |\n\
    | 8, 60,68 | F | T | T | F |\n\n使用上面的测试用例，是否可以发现下面的缺陷：\n\n1. ((a<=b+c) && (b<a+c)\
    \ && (c<a+b))\n2. ((a<b+c) || (b<a+c) && (c<a+b))\n3. ((a<b+c) && (b<a+c) ||(c<a+b))\n\
    4. ((a<b+c) || (b<a+c) || (c<a+b))\n\n# 条件测试的准则\n\n条件测试的目的不仅是检测程序条件中的错误，而且是检测程序中的其他错误。如果程序P的测试集能有效地检测P中条件的错误，则它很可能也可以有效地检测P中的其他错误。\n\
    \n域测试要求对一个关系表达式执行3个或4个测试。对于形式为\n\\( E_1 < 关系算符 > E_2 \\)\n的关系表达式来说，需要3个测试分别使_E_<sub>1</sub>的值大于、等于或小于_E_<sub>2</sub>的值。如果<关系算符>错误而_E_<sub>1</sub>和_E_<sub>2</sub>正确，则这3个测试能够发现关系算符的错误。为了发现_E_<sub>1</sub>和_E_<sub>2</sub>中的错误，让_E_<sub>1</sub>值大于或小于_E_<sub>2</sub>值的测试数据应该使这两个值之间的差别尽可能小（最好能在边界上取值）。\n\
    \n# BRO条件测试\n\n- 前提：在条件中所有布尔变量和关系算符都只出现一次而且没有公共变量，则该测试保证能发现该条件中的分支错和关系算符错。\n-\
    \ 描述：包含n个简单条件的条件C的条件约束定义为(D₁， D₂， ..., Dₙ)，其中Dᵢ(0<i≤n)表示条件C中第i个简单条件的输出约束。\n- 如果在条件C的一次执行过程中，C中每个简单条件的输出都满足D中对应的约束，则称C的这次执行覆盖了C的条件约束D。\n\
    \n# 例子1\n\n- C1: B1&B2\n- 其中，B1和B2是布尔变量。C1的条件约束形式为(D1, D2)，其中D1和D2中的每一个都是“t”或“f”。值(t,\
    \ f)是C1的一个条件约束，并由使B1值为真B2值为假的测试所覆盖。BRO测试策略要求，约束集{(t, t), (f, t), (t, f)}被C1的执行所覆盖。如果C1因布尔算符错误而不正确，则至少上述约束集中的一个约束将迫使C1失败。\n\
    \n# 例子2\n\nC2：B1&(E3=E4)\n\n其中，B1是布尔变量，E3和E4是算术表达式。C2的条件约束形式为(D1， D2)，其中D1是“t”或“f”，D2是>、=或<。除了C2的第二个简单条件是关系表达式之外，C2和C1相同，因此，可以通过修改C1的约束集{(t,\
    \ t), (f, t), (t, f)}得出C2的约束集。注意，对于(E3=E4)来说，“t”意味着“=”，而“f”意味着“<”或“>”，因此，分别用(t,\
    \ =)和(f, =)替换(t, t)和(f, t)，并用(t, <)和(t, >)替换(t, f)，就得到C2的约束集{(t, =), (f, =), (t,\
    \ <), (t, >)}。覆盖上述条件约束集的测试，保证可以发现C2中布尔算符和关系算符的错误。\n\n"
