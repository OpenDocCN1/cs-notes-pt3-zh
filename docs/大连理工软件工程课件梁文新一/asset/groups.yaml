    \n![](img/576b58d2c10334d3487443b8cc7c5551_492_3.png)\n\n#### 2.判定覆盖(Decision/Branch\
    \ Coverage)\n\n判定覆盖又叫分支覆盖，它的含义是，不仅每个语句必须至少执行一次，而且每个判定的每种可能的结果都应该至少执行一次，也就是每个判定的每个分支都至少执行一次。\n\
    \n一组可用的测试用例：\n【(2, 0, 4), (2, 0, 3)】覆盖\nsacbed\n【(1, 1, 1), (1, 1, 1)】覆盖\nsabd\n\
    \n另一组可用的测试用例：\n【(2, 1, 1), (2, 1, 2)】覆盖\nsabed\n【(3, 0, 3), (3, 1, 1)】覆盖\nsacbd\n\
    \n#### 3 条件覆盖(Condition Coverage)\n\n条件覆盖的含义是，不仅每个语句至少执行一次，而且使判定表达式中的每个条件都取到各种可能的结果。\n\
    \n为了做到条件覆盖，应该选取测试数据使得：\n在a点有下述各种结果出现：\nA>1,A<=1,B=0,B!=0;\n在b点有下述各种结果出现：\nA=2,A!=2,X>1,X<=1\n\
    使用下面两组测试数据就可以达到上述覆盖标准：\nA=2， B=0， X=4\n（满足 A>1， B=0， A=2， X>1的条件，执行路径 sacbed）\n\
    A=1， B=1， X=1\n（满足 A<=1， B!=0， A!=2， X<=1的条件，执行路径sabd）\n\n#### 4.判定/条件覆盖(Decision/Condition\
    \ Coverage)\n\n- 既然判定覆盖不一定包含条件覆盖，条件覆盖也不一定包含判定覆盖，自然会提出一种能**同时满足这两种覆盖标准**的逻辑覆盖，这就是判定/条件覆盖\n\
    - 它的含义是，选取足够多的测试数据，使得判定表达式中的**每个条件**都取到各种可能的值，而且每个**判定表达式**也都取到各种可能的结果\n\n"
  mdcn: "\n\n## 3.1.5 线性子空间\n\n定义3.1.5 设 W 是数域 F 上线性空间 V 的一个非空子集。如果 W 对于 V 的加法与数乘两种运算也构成数域\
    \ F 上的线性空间，则称 W 是 V 的一个**线性子空间**，简称**子空间**。\n\n由定义可知，线性子空间也是线性空间。因此，线性空间的一切性质对线性子空间都成立。\n\
    \n定理3.1.3 设 W 是数域 F 上线性空间 V 的一个非空子集，则 W 是 V 的子空间的充分必要条件是：\n\n- 1. 若 α, β ∈ W，则\
    \ α + β ∈ W；\n- 2. 若 α ∈ W，k ∈ F，则 kα ∈ W。\n\n证明 必要性是显然的。下面证明充分性。\n\n由于 W 非空，所以存在\
    \ α ∈ W。由条件 2，有 0 = 0α ∈ W，-α = (-1)α ∈ W。由条件 1 和条件 2 可知，W 对于 V 的加法与数乘运算封闭。又因为加法与数乘运算满足线性空间定义中的八条运算律，所以这些运算律在\
    \ W 中也仍然成立。因此 W 构成数域 F 上的线性空间，即 W 是 V 的子空间。证毕。\n\n由定理3.1.3可知，线性空间 V 的任意子空间 W 都含有\
    \ V 的零向量。并且，如果 W 是 V 的子空间，那么 W 的零向量就是 V 的零向量；W 中元素 α 在 W 中的负向量就是 α 在 V 中的负向量。\n\
    \n由单个零向量组成的集合 {0} 是 V 的一个子空间，称为**零子空间**。V 本身也是 V 的一个子空间。零子空间和 V 本身称为 V 的**平凡子空间**；其它子空间称为**非平凡子空间**。\n\
    \n例3.1.5 设 V 是数域 F 上的线性空间，则 V 的零子空间 {0} 与 V 本身都是 V 的线性子空间。\n\n例3.1.6 设 A 是数域 F\
    \ 上的 m × n 矩阵，令齐次线性方程组 Ax = 0 的解集合为\n\nW = { x ∈ Fⁿ | Ax = 0 }\n\n则 W 是 Fⁿ 的一个子空间，称\
    \ W 为齐次线性方程组 Ax = 0 的**解空间**。\n\n## 7.4.3 不同集成测试策略的比较\n\n在测试实际的软件系统时，应该根据软件的**特点以及工程进度**安排，选用适当的测试策略。一般说来，纯粹自顶向下或纯粹自底向上的策略可能都不实用，人们在实践中创造出许多混合策略：\n\
    \n- 混合法\n  - 较上层使用自顶向下方法\n  - 较下层使用自底向上方法\n- 改进的自顶向下测试方法\n  - 基本上使用自顶向下测试方法，但是在早期使用自底向上的方法测试软件中的少数**关键模块**\n\
    \n## 7.4.4 回归测试\n\n每当一个新模块作为集成测试的一部分加进来的时候，软件就发生了变化：建立了新的数据流路径，可能出现了新的I/O操作，激活了新的控制逻辑。\n\
    \n这些变化可能使原来工作正常的功能出现问题。在集成测试的范畴中，所谓回归测试是指重新执行已经做过的测试的某个子集，以保证上述这些变化没有带来非预期的副作用。\n\
    \n回归测试集（已执行过的测试用例的子集）包括下述三种不同的测试用例：\n\n- 检测软件**全部功能**的代表性测试用例\n- 专门针对可能受修改影响的软件功能的**附加测试**\n\
    - 针对被**修改过**的软件成分的测试\n\n## 7.5 确认测试\n\n确认测试也称为验收测试，它的目标是验证软件的有效性。\n\n### 7.5.1\
    \ 确认测试的范围\n\n- 必须有用户积极参与，或者以用户为主进行\n- 用户应该参与设计测试方案，使用用户界面输入测试数据并且分析评价测试的输出结果\n\
    - 通常采用黑盒测试法\n\n### 7.5.2 软件配置复查\n\n- 确认测试的一个重要内容是复查软件配置\n- 保证软件配置的所有成分都齐全，质量符合要求，文档与程序完全一致，具有完成软件维护所必须的细节，而且已经编好目录\n\
    \n### 7.5.3 Alpha和Beta测试\n\n- 如果一个软件是为许多客户开发的(例如，向大众出售的盒装软件产品)，那么让每个客户都进行正式的验收测试是不现实的\n\
    - 绝大多数软件开发商使用被称为 **Alpha测试** 和 **Beta测试** 的过程，来发现那些看起来只有最终用户才能发现的错误\n\n- **α测试**由用户在开发者的场所进行，并且在开发者对用户的“指导”下进行测试\n\
    \  - 开发者负责记录错误和使用中遇到的问题\n  - **Alpha测试**是在**受控的环境**中进行的\n  - 经α测试后的软件称为**α版软件**\n\
    - **β测试**由最终用户在一(多个)个客户场所进行\n  - **Beta测试**是软件在开发者不能控制的环境中的“**真实**”应用\n  - 用户记录下在Beta测试过程中遇到的一切问题(真实的或想象的)，定期把这些问题报告给开发者\n\
    \  - 接收到Beta测试报告的问题后，软件开发者对产品进行修改，并准备向客户发布最终的软件产品\n\n## 7.6 白盒测试技术\n\n- 白盒测试法的前提是可以把程序看成装在一个透明的白盒子里，也就是完全了解程序的结构和处理过程\n\
    - 这种方法按照程序内部的逻辑测试程序，检验程序中的每条通路是否都能按预定要求正确工作\n- 白盒测试又称为结构测试（Structural Testing）\n\
    \n### 7.6.1 逻辑覆盖(Code Coverage)\n\n- 有选择地执行程序中某些最有**代表性的通路**是对穷尽测试的唯一可行的替代办法\n\
    - **逻辑覆盖**是对一系列测试过程的总称，这组测试过程逐渐进行越来越完整的通路测试\n- 测试数据执行(或叫覆盖)程序逻辑的程度可以划分成哪些不同的等级，从覆盖源程序语句的详尽程度分析，有以下一些不同的覆盖标准：\n\
    \n#### 1.语句覆盖\n\n语句覆盖的含义是，选择足够多的测试数据，使被测程序中每个语句至少执行一次。\n\n测试用例的设计格式如下  \n【输入的(A,\
    \ B, X)，输出的(A, B, X)】\n\n为图例设计满足语句覆盖的测试用例是：  \n【(2, 0, 4), (2, 0, 3)】\n\n![](img/576b58d2c10334d3487443b8cc7c5551_492_0.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_492_1.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_492_2.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_492_3.png)\n\n#### 2.判定覆盖(Decision/Branch\
    \ Coverage)\n\n判定覆盖又叫分支覆盖，它的含义是，不仅每个语句必须至少执行一次，而且每个判定的每种可能的结果都应该至少执行一次，也就是每个判定的每个分支都至少执行一次。\n\
    \n一组可用的测试用例：\n【(2, 0, 4), (2, 0, 3)】覆盖\nsacbed\n【(1, 1, 1), (1, 1, 1)】覆盖\nsabd\n\
    \n另一组可用的测试用例：\n【(2, 1, 1), (2, 1, 2)】覆盖\nsabed\n【(3, 0, 3), (3, 1, 1)】覆盖\nsacbd\n\
    \n#### 3 条件覆盖(Condition Coverage)\n\n条件覆盖的含义是，不仅每个语句至少执行一次，而且使判定表达式中的每个条件都取到各种可能的结果。\n\
    \n为了做到条件覆盖，应该选取测试数据使得：\n在a点有下述各种结果出现：\nA>1,A<=1,B=0,B!=0;\n在b点有下述各种结果出现：\nA=2,A!=2,X>1,X<=1\n\
    使用下面两组测试数据就可以达到上述覆盖标准：\nA=2， B=0， X=4\n（满足 A>1， B=0， A=2， X>1的条件，执行路径 sacbed）\n\
    A=1， B=1， X=1\n（满足 A<=1， B!=0， A!=2， X<=1的条件，执行路径sabd）\n\n#### 4.判定/条件覆盖(Decision/Condition\
    \ Coverage)\n\n- 既然判定覆盖不一定包含条件覆盖，条件覆盖也不一定包含判定覆盖，自然会提出一种能**同时满足这两种覆盖标准**的逻辑覆盖，这就是判定/条件覆盖\n\
    - 它的含义是，选取足够多的测试数据，使得判定表达式中的**每个条件**都取到各种可能的值，而且每个**判定表达式**也都取到各种可能的结果\n\n"
