    # 3.2 The Interpolation Method of Generating Training Samples


    For the terrain semantic segmentation, large amounts of samples with dense annotations
    are necessary. Sufficient diverse samples can be synthesized and automatically
    labeled through the virtual world. However, the domain gap between virtual and
    real world leads to accuracy decrease. Hence, the interpolated samples of virtual
    and real images contribute to training, and each sample has a one-dimensional
    style vector to specify the style of the image. The style codes of the real and
    virtual worlds are manually identified, and those of generated interpolated images
    are generated by the style vector interpolation.


    Specifically, the generator takes as inputs the style code vector of the sample
    and the semantic layout of anthropocentric scene, then generates the corresponding
    synthetic image. All training samples are composed of synthetic images (interpolated
    between virtual and real) and corresponding auxiliary inputs (layout and style
    vector).


    It is worth mentioning that not all the generated interpolated images are of high
    quality, some have low-level artifacts. Thus three terms of constraints are applied
    to select images with clear structures for training:


    +   1. **Structural similarity.** We apply the similarity between the semantic
    layout and the generated image by a pre-trained segmentation network. Only the
    images with high confidence are selected.

    +   2. **FR''s quality assessment.** We use the Fr''echet Inception Distance (FID)
    to measure the quality of the whole generated image set.

    +   3. **Local inconsistency suppression.** We suppress the low-level artifacts
    by a local texture comparison using the structural similarity (SSIM) between the
    generated and real images.


    Finally, the training set is constructed with the collected interpolated images
    (the distribution shown in Fig. 4), and each image is assigned with its corresponding
    style vector and semantic layout.


    The efficacy of the proposed auxiliary inputs (semantic layout and style vector)
    can be evaluated by comparing different training schemes, and the comparison results
    are shown in Table 1. Combining both style vector and semantic layout as auxiliary
    inputs yields the best accuracy.


    As shown in Table 1, when the style vector is used as an auxiliary input, the
    mIoU is improved from 61.2% to 68.7%; when additionally the semantic layout is
    used, the mIoU is further improved to 71.6%. The results verify the effectiveness
    of the two auxiliary inputs.


    | Method | mIoU |

    |:---|:---:|

    | baseline | 61.2% |

    | baseline + SV | 68.7% |

    | baseline + SV + SL | 71.6% |


    Table 1: The accuracy of different combinations of auxiliary inputs, where SV
    denotes style vector, SL denotes semantic layout.


    We find that the semantic segmentation network can benefit from the proposed generated
    training samples in three aspects. First, "unknown" instances can be learned from...'
