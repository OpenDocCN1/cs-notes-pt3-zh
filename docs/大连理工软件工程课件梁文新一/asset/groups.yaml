    # 3.2 与用户沟通获取需求的方法


    软件需求分析总是从两方或多方之间的通信开始。用户面临的问题需要用基于计算机的方案来解决；开发者应该对用户的需求作出反应，给用户提供帮助。这样就产生了相互通信的需求。


    +   - 从开始通信到真正相互理解的道路通常是充满坎坷的

    +   - 良好的通信技术有助于加快理解的过程


    # 访谈 (Interview)


    +   - 访谈（或称为会谈）是最早开始运用的获取（不是分析）用户需求的技术，也是迄今为止仍然广泛使用的主要的需求分析技术。'
  - '[PAGE 156]


    # # 访谈


    +   - 访谈有两种基本形式，分别是正式的和非正式的访谈


    +   - 在正式的访谈中，系统分析员将提出一些事先准备好的具体问题，例如，询问客户公司销售的商品种类、雇用的销售人员数目以及信息反馈时间应该多快等


    +   - 在非正式的访谈中，将提出一些可以自由回答的开放性问题，以鼓励被访问的人员表达自己的想法，例如，询问用户为什么对目前正在使用的系统感到不满意


