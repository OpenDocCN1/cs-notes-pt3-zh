    \    - 返回正常工作状态：屏幕上返回、功能键\n    - 怎样组织帮助信息：平面结构、层次结构、超文本结构\n\n**3. 出错信息处理 (Error\
    \ Message)**\n\n- **出错信息和警告信息**，是出现问题时交互式系统给出的“坏消息”\n- 出错信息设计得不好，将向用户提供无用的或误导的信息，反而增加了用户的挫折感\n\
    \n**4. 命令交互 (Command-based Interaction)**\n\n- **命令行 (Command Line, CLI)** 曾经是用户和系统软件交互的最常用方式，而且也曾经广泛地用于各种应用软件中\
    \ (Unix/Linux, DOS)\n- 现在，面向窗口的、点击和拾取方式的界面已经减少了用户对命令行的依赖，但是，许多高级用户仍然偏爱面向命令的交互方式\n\
    - 在多数情况下，用户既可以从菜单中选择软件功能也可以通过键盘命令序列调用软件功能\n\n### 6.2.2 设计过程 (Design Process)\n\
    \nUI Prototyping：用户界面设计是一个迭代的过程，也就是说，通常先创建设计模型，再用原型实现这个设计模型，并由用户试用和评估，然后根据用户的意见进行修改\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_358_0.png)\n\n### 6.2.3 人机界面设计指南\n\n\
    用户界面设计主要依靠**设计者的经验**。总结众多设计者的经验而得出的设计指南，有助于设计者设计出友好、高效的人机界面。本节介绍三类人机界面设计指南\n\n\
    **1. 一般交互指南**\n\n一般交互指南涉及信息显示、数据输入和整体系统控制，因此，这些指南是全局性的，忽略它们将承担较大风险\n\n**2. 信息显示**\n\
    \n如果人机界面显示的信息是不完整、含糊或难于理解的，则应用软件显然不能满足用户需求。可以用多种不同方式“显示”信息：用文字、图片和声音；按位置、移动和大小；使用颜色、分辨率和省略。\n\
    \n**3. 数据输入**\n\n用户的大部分时间用在选择命令、键入数据和向系统提供输入。在许多应用系统中，键盘仍然是主要的输入介质，但是，鼠标、数字化仪和语音识别系统正迅速地成为重要的输入手段。下面是关于数据输入的设计指南。\n\
    \n## 6.3 过程设计的工具\n\n描述程序处理过程的工具称为过程设计(Procedural Design)的工具，它们可以分为图形(Graphical\
    \ Design Notation)、表格(Tabular Design Notation)和语言(PDL)三类。要求：\n\n- 对设计的无歧义描述\n\
    - 指明控制流程、处理功能、数据组织以及其他方面的实现细节\n- 能在编码阶段把对设计的描述直接翻译成程序代码\n\n程序流程图五种基本控制结构\n\n![](img/576b58d2c10334d3487443b8cc7c5551_363_0.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_363_1.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_363_2.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_363_3.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_363_4.png)\n\
    \n示例\n\n![](img/576b58d2c10334d3487443b8cc7c5551_364_0.png)\n\n### 6.3.1 程序流程图\n\
    \n**优点：**\n\n- 是控制流程的直观描述，简单易学，容易理解\n\n**缺点：**\n\n- 本质上不是逐步求精的好工具，缺少全局结构的考虑\n\
    - 用箭头代表控制流，程序员不受约束，随心所欲\n- 不易表示数据结构\n\n**思考题**\n\n画出下列伪码程序的程序流程图\n\n```\nSTART\n\
    IF p THEN\n    WHILE q DO\n        f\n    END DO\nELSE\n    BLOCK\n        g\n\
    \        n\n    END BLOCK\nEND IF\nSTOP\n```\n\n![](img/576b58d2c10334d3487443b8cc7c5551_366_0.png)\n\
    \n### 6.3.2 盒图（N-S图）\n\n出于要有一种不允许违背结构程序设计精神的图形工具的考虑，I. Nassi和B. Schneiderman于1972年提出了盒图（Chapin\
    \ Charts），又称为N-S图（NSD）\n\n**特点：**\n\n- 功能域（特定控制结构的作用域）明确\n- 不可能任意转移控制\n- 很容易确定局部和全局数据的作用域\n\
    - 很容易表现嵌套关系及模块的层次结构\n\n图6.4 盒图的基本符号\n\n(a) 顺序；(b) IF-THEN-ELSE型分支；(c) CASE型多分支；(d)\
    \ 循环；(e) 调用子程序A\n\n![](img/576b58d2c10334d3487443b8cc7c5551_368_0.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_368_1.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_368_2.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_368_3.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_368_4.png)\n\n- 盒图没有箭头，因此不允许随意转移控制\n\
    - 坚持使用盒图作为详细设计的工具，可使程序员逐步养成用结构化的方式思考问题和解决问题的习惯\n\n**思考题**\n\n画出下列伪码程序的盒图\n\n```\n\
    START\nIF  p  THEN\n        WHILE  q  DO\n                f\n        END DO\n\
    ELSE\n        BLOCK\n                g\n                n\n        END BLOCK\n\
    END IF\nSTOP\n```\n\n![](img/576b58d2c10334d3487443b8cc7c5551_370_0.png)\n\n"
  mdcn: "\n## 6.1 结构程序设计 (Structured Programming)\n\n经典的结构程序设计：只允许使用顺序、IF-THEN-ELSE型分支和DO-WHILE型循环这三种基本控制结构\n\
    \n扩展的结构程序设计：除了上述三种基本控制结构之外，还允许使用DO-CASE型多分支结构和DO-UNTIL型循环结构\n\n修正的结构程序设计：再加上允许使用LEAVE\
    \ (或BREAK) 结构\n\n图6.2 其他常用的控制结构\n\n(a) DO-UNTIL型循环结构； (b)多分支结构\n\n![](img/576b58d2c10334d3487443b8cc7c5551_352_0.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_352_1.png)\n\n## 6.2 人机界面设计\n\n人机界面设计（User\
