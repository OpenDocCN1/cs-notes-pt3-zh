    \ 3.7 其他图形工具\n\n### 3.8 验证软件需求\n\n### Why Requirement Analysis?\n\n- 软件开发最为重要的目的之一就是要开发出**真正满足用户需求的软件产品**\n\
    - 为此首先必须准确、清晰、深入地理解和获取用户的真正需求\n  - 全面准确地掌握软件需求是软件开发工作获得成功的前提和关键\n  - 不论设计和编码工作做得如何出色，不能满足用户的需求则一切都失去了意义\n\
    - 需求分析是软件定义时期的最后一个阶段，它的基本任务是准确地回答“**系统必须做什么？**（What）”\n- 需求分析的任务不是确定系统怎样完成它的工作，而仅仅是确定系统必须完成哪些工作\n\
    \  - 即对目标系统提出完整、准确、清晰、具体的要求\n\n#### 用于需求分析的结构化分析方法应遵循的准则\n\n- 必须理解和表示问题的信息域，根据这条准则应该建立数据模型(Data\
    \ Model)\n- 必须定义软件应完成的功能，这条准则要求建立功能模型(Function Model)\n- 必须表示作为外部事件结果的软件行为，这条准则要求建立行为模型(Behavior\
    \ Model)\n- 必须对描述信息、功能和行为的模型进行分解，用层次的方式展示细节\n\n### 3.1 需求分析的任务\n\n#### 3.1.1 系统的综合要求\n\
    \n1. 功能需求(Functional Requirements)\n2. 性能需求(Performance Requirements/Non-functional\
    \ Requirements)\n3. 可靠性和可用性需求(Reliability & Usability)\n4. 出错处理需求(Error Processing)\n\
    \   - 对外部错误如何响应；对系统内部错误如何响应\n5. 接口需求(Interface)\n   - UI, Hardware/software, Communication,\
    \ etc.\n6. 约束(Constraints)\n   - Precision, Tools, Design, Hardware\n7. 逆向需求(Reverse\
    \ Requirements)\n   - 说明系统不应该做什么\n8. 将来可能提出的要求(Future Requirements)\n\n#### 需求分析的过程\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_154_0.png)\n\n2022-11-3 liang@computer.org\
    \ 10 (Lawrence Pfleeger & Atlee, 2006)\n\n### 3.2 与用户沟通获取需求的方法\n\n软件需求分析总是从两方或多方之间的通信开始。用户面临的问题需要用基于计算机的方案来解决；开发者应该对用户的需求作出反应，给用户提供帮助。这样就产生了相互通信的需求。\n\
    \n- 从开始通信到真正相互理解的道路通常是充满坎坷的\n- 良好的通信技术有助于加快理解的过程\n\n#### 访谈 (Interview)\n\n- 访谈（或称为会谈）是最早开始运用的获取（不是分析）用户需求的技术，也是迄今为止仍然广泛使用的主要的需求分析技术。\n\
    - 访谈有两种基本形式，分别是正式的和非正式的访谈\n- 在正式的访谈中，系统分析员将提出一些事先准备好的具体问题，例如，询问客户公司销售的商品种类、雇用的销售人员数目以及信息反馈时间应该多快等\n\
    - 在非正式的访谈中，将提出一些可以自由回答的开放性问题，以鼓励被访问的人员表达自己的想法，例如，询问用户为什么对目前正在使用的系统感到不满意\n\n![](img/576b58d2c10334d3487443b8cc7c5551_156_0.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_156_1.png)\n\n#### 某出版社系统调查表\n\n| 编号\
    \ | 提出问题 |\n| --- | --- |\n| 1 | 您在哪个部门工作？ |\n| 2 | 出版业务流程是什么？ |\n| 3 | 您每日都处理哪些文件、数据、报表？\
    \ |\n| 4 | 工作中手工处理特别麻烦的事情是什么？ |\n| 5 | 工作中手工处理什么问题解决不了？影响效率的问题有哪些？ |\n| 6 | 您认为提高工作效率，节省工作时间，减轻工作强度可采取哪些办法？\
    \ |\n| 7 | 您的部门需要成本核算和统计的内容有哪些？ |\n| 8 | 您的部门采用计算机管理工作情况如何？ |\n| 9 | 如何改进业务流程使之更合理？\
    \ |\n| 10 | 哪些问题是目前传统手工方法根本无法解决的？ |\n| 11 | 出版社计算机管理信息系统需要解决什么问题？ |\n\n#### 3.2.2\
    \ 面向数据流自顶向下求精\n\n- 数据决定了系统所需要的处理和算法，是需求分析的出发点\n- 结构化分析方法——面向数据流的自顶向下的逐步求精进行需求分析的方法\n\
    \  - 高层数据流图→细化到元素级\n  - 从输出端回溯→确定数据来源(DD)，定义算法(IPO图)\n  - 逐步细化→不断求精\n\n![](img/576b58d2c10334d3487443b8cc7c5551_159_0.png)\n"
