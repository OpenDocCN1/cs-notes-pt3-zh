    # 1.3 软件生命周期


    +   1. 问题定义

    +      - “要解决的问题是什么”——问题性质、工程目标、工程规模


    +   2. 可行性研究

    +      - “上一个阶段所确定的问题是否有行得通的解决办法”

    +      - 预定的系统规模、时间期限

    +      - 问题是否值得去解

    +      - 技术、经济、法律、社会因素等多方面'
  - '[PAGE 31]


    # 1.3 软件生命周期


    # 3. 需求分析


    +   - 准确回答“目标系统必须做什么”

    +   - 对系统提出完整、准确、清晰、具体的要求

    +   - 用正式文档准确地记录对目标系统的需求——规格说明书(specification)'
  - '[PAGE 32]


    # # 1.3 软件生命周期


    # ## 4. 概要设计（总体设计）


    +   - 概括地回答“怎样实现目标系统？”


    +   - (1)设计出实现目标系统的几种可能的方案并推荐出最佳方案


    +   - 至少设计出高、中、低成本的三种方案


    +   - (2)设计程序的体系结构——程序由哪些模块组成，模块间的关系'
  - '[PAGE 33]


    # # 1.3 软件生命周期


    # ## 5. 详细设计（模块设计）


    +   - 概要设计：比较抽象概括的方式提出了解决问题的办法


    +   - 详细设计：把解法具体化——“应该怎样具体地实现这个系统”


    +   - 任务：不是编写程序，而是设计出程序的详细规格说明


    +   - 详细设计每个模块


    +   - 确定实现模块功能所需的算法和数据结构'
  - "[PAGE 34]\n\n# 1.3 软件生命周期\n\n+   6. 编码和单元测试\n+   \n+   - 写出正确的、容易理解、容易维护的程序模块\n\
    +   - 单元测试：对编写出的每个程序模块进行测试"
