    - 向下箭头：阶段内的迭代（求精）\n- 各项活动无明显边界，可同步进行  \n  - 但为避免活动开发过分无序，应把“线性过程”（快速原型模型或如图中的中轴线）作为总目标\n\
    \n## 新兴的软件过程\n\n- RUP (Rational Unified Process)\n- 敏捷过程与极限编程（Agile Software Process\
    \ & eXtreme Programming）\n- 微软过程（Microsoft Solutions Framework, MSF）\n\n"
