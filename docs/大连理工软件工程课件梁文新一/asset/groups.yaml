    # 4.1 概述


    +   - 按照形式化的程度，可以把软件工程使用的方法划分成**非形式化、半形式化和形式化**三类

    +     - 非形式化方法（Informal）

    +       - 用自然语言描述需求规格说明

    +     - 半形式化方法（Semi-formal）

    +       - 用数据流图或实体-联系图建立模型

    +     - 形式化方法（Formal）

    +       - 是描述系统性质的基于数学的技术

    +       - 即如果一种方法有坚实的数学基础，那么它就是形式化的'
  - '[PAGE 214]


    # 4.1 概述


    # 4.1.1 非形式化方法的缺点


    +   - **矛盾**：相互冲突的陈述

    +   - **二义性**：读者可以用不同的方式理解的陈述

    +   - **含糊**：笼统的陈述

    +   - **不完整性**：最常遇到的问题

    +   - **抽象层次混乱**：非常抽象的陈述中混进了一些关于细节的低层次陈述'
  - '[PAGE 215]


    # # 4.1 概述


    # ## 4.1.2 形式化方法的优点


    +   - 把数学引入软件开发过程，形成基于数学的形式化方法


    +   - 数学最有用的一个性质是，能够简洁准确地描述物理现象、对象或动作的结果，因此是理想的建模工具。数学特别适合于表示状态，也就是表示“做什么”


    +   - 在理想情况下，分析员可以写出不含二义性的系统的数学规格说明，并可用数学方法对其进行验证，以发现存在的矛盾和不完整性，在这样的规格说明中完全没有含糊性


    +   - 事实上复杂的软件系统通常难以用几个数学公式来描述


    +   - 在软件开发过程中使用数学，可以在不同的软件工程活动之间平滑地过渡（系统规格说明、系统设计、程序代码）


    +   - 提供了高层确认的手段


    +   - 可以使用数学方法证明，设计符合规格说明，程序代码正确地实现了设计结果'
  - '[PAGE 216]


    # # 4.1 概述


    # ## 4.1.3 应用形式化方法的准则


    +   - 应该选用适当的表示方法


    +   - 应该形式化，但不要过分形式化


    +   - 用形式化方法说明系统中易出错的或关键的部分


    +   - 应该估算成本


    +   - 估算由额外培训所带来的成本并将其编入预算


    +   - 应该有形式化方法顾问随时提供咨询


    +   - 不应该放弃传统的开发方法


    +   - 形式化与SA和OOA结合，取长补短'
  - '[PAGE 217]


    # 4.1 概述


    # 4.1.3 应用形式化方法的准则


    +   - 应该建立详尽的文档

    +     - 用自然语言注释形式化的规格说明书

    +   - 不应该放弃质量标准

    +     - 形式化方法并不能完全确保软件的正确性

    +   - 不应该盲目依赖形式化方法

    +     - 无法用形式化方法证明从非形式化需求到形式化规格说明的转换是正确的，因此，必须用其他方法（例如，评审、测试）来验证软件正确性

    +   - 应该测试、测试再测试

    +   - 应该重用'
