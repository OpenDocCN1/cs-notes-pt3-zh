    选择一种适当的程序设计语言显得尤为重要'
  - '[PAGE 451]


    # 7.1.1 选择程序设计语言


    +   - **汇编语言**应仅在以下特殊应用领域中使用

    +     - 对程序执行时间和使用的空间都有很严格限制的情况

    +     - 需要产生任意的甚至非法的指令序列

    +     - 体系结构特殊的微处理机，以致在这类机器上通常不能实现高级语言编译程序

    +     - 或者大型系统中执行时间非常关键的（或直接依赖于硬件的）一小部分代码

    +   - 其他程序应该一律用**高级语言**书写'
  - "[PAGE 452]\n\n# # 选择程序设计语言应考虑的因素\n\n+   1）软件的应用领域  \n+   2）算法和数据结构的复杂性  \n+ \
    \  3）系统用户的要求  \n+   4）软件运行环境  \n+   5）软件开发的方法  \n+   6）可得到的软件工具  \n+   7）工程规模\
    \  \n+   8）软件的可移植性要求  \n+   9）程序员的知识水平"
  - '[PAGE 453]


    # 7.1.2 编码风格


    +   - 程序实际上也是一种**供人阅读的文章**，有一个文章的风格问题

    +     - 应该使程序具有良好的风格

    +     - 力图从编码原则的角度提高程序的可读性，改善程序质量

    +   - 编程风格包括以下五个方面

    +     - 源程序文档化

    +     - 数据说明

    +     - 语句结构

    +     - 输入输出

    +     - 效率'
  - '[PAGE 454]


