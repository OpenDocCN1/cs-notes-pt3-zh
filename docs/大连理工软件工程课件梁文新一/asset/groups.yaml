    \n- 【2, 0, 4】，针对（1）（5）两种组合，执行路径sacbed\n- 【2, 1, 1】，针对（2）（6）两种组合，执行路径sabed\n- 【1,\
    \ 0, 2】，针对（3）（7）两种组合，执行路径sabed\n- 【1, 1, 1】，针对（4）（8）两种组合，执行路径sabd\n\n前述几种覆盖标准中最强的，但是并不一定能使程序中的每条路径都执行到（sacbd）\n\
    \n## 6. 路径覆盖 (Path Coverage)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_503_0.png)\n\
    \n- 【(2, 0, 4)，(2, 0, 3)】覆盖 sacbed (a=T; b=T)\n- 【(1, 1, 1)，(1, 1, 1)】覆盖 sabd\
    \ (a=F; b=F)\n- 【(2, 1, 1)，(2, 1, 2)】覆盖 sabed (a=F; b=F)\n- 【(3, 0, 3)，(3, 1,\
    \ 1)】覆盖 sacbd (a=T; b=F)\n\n## 思考题1\n\n设计下列伪码程序的语句覆盖测试用例\n\n```\nSTART\nINPUT\
    \ (A, B, C)\nIF A>5\n    THEN X=10\n    ELSE X=1\nEND IF\nIF B>10\n    THEN Y=20\n\
    \    ELSE Y=2\nEND IF\nIF C>15\n    THEN Z=30\n    ELSE Z=3\nEND IF\nPRINT(X,\
    \ Y, Z)\nSTOP\n```\n\n- (1,1,1)\n- (20,40,60)\n\n同时符合判定覆盖\n\n## 思考题2\n\n设计下列伪码程序的判定覆盖、条件覆盖、判定/条件覆盖、组合覆盖用例\n\
    \n```\nSTART\nINPUT (A, B, C, D)\nIF (A>0) AND (B>0)\n    THEN X=A+B\n    ELSE\
    \ X=A-B\nEND\nIF (C>A) OR (D<B)\n    THEN Y=C-D\n    ELSE Y=C+D\nEND\nPRINT (X,\
    \ Y)\nSTOP\n```\n\n![](img/576b58d2c10334d3487443b8cc7c5551_505_0.png)\n\n## 思考题2参考答案\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_506_0.png)\n\n判定覆盖用例：\n- (1,1,2,3)\n\
    - (-1,-1,-2,0)\n\n条件覆盖用例：\n- (1,1,2,2)\n- (-1,-1,-2,-2)\n\n判定/条件覆盖：\n- (1,1,2,0)\n\
    - (-1,-1,-2,0)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_507_0.png)\n\n### 条件组合覆盖用例\n\
    \n- ① A>0, B>0\n- ② A>0, B<=0\n- ③ A<=0, B>0\n- ④ A<=0, B<=0\n- ⑤ C>A, D<B\n-\
    \ ⑥ C>A, D>=B\n- ⑦ C<=A, D<B\n- ⑧ C<=A, D>=B\n\n- 1. (1,1,2,0) 实现① ⑤\n- 2. (1,0,2,1)\
    \ 实现② ⑥\n- 3. (0,1,-1,0) 实现③ ⑦\n- 4. (0,0,-1,1) 实现④ ⑧\n\n提醒：设计测试用例的时候 别忘了预期输出\n\
    \n## 7.6.2 控制结构测试\n\n### 1 基本路径测试\n\n- **Tom McCabe提出的一种白盒测试技术**\n  - 使用这种技术设计测试用例时，首先计算过程设计结果的**逻辑复杂度**，并以该复杂度为指南定义执行路径的基本集合，从该基本集合导出的测试用例可以保证程序中每条语句至少执行一次，而且每个条件在执行时都将分别取true(真)和false(假)值\n\
    \n- 使用基本路径测试技术设计测试用例的步骤如下：\n  1. 根据过程设计结果画出相应的流程图\n  2. 计算流图的环形复杂度，环形复杂度为6\n \
    \ 3. 确定线性独立路径的基本集合\n\n```\nPROCEDURE average;\n* 最多输入 N 个值(以 -999 为输入结束标志)，计算位于给定范围内的那些值\n\
    (称为有效输入值)的平均值，以及输入值的个数和有效值的个数 *\nINTERFACE RETURNS average, total.input, total.valid;\n\
    INTERFACE ACCEPTS n, value, minimum, maximum;\nTYPE value[1, n] IS SCALAR ARRAY;\n\
    TYPE average, total.input, total.valid, minimum, maximum, sum IS SCALAR;\nTYPE\
    \ N, n, i IS INTEGER;\ni = 1;\ntotal.input = total.valid = 0;\nsum = 0\nDO WHILE\
    \ value[i] <> -999 and total.input < n\ntotal.input 加 1;\nIF value[i] >= minimum\
    \ AND value[i] <= maximum\nTHEN\ntotal.valid 加 1;\nsum = sum + value[i];\nELSE\
    \ skip\nEND IF;\ni 加 1;\nEND DO;\nIF total.valid > 0\nTHEN average = sum / total.valid;\n\
    ELSE average = -999;\nEND IF\nEND average\n```\n\n![](img/576b58d2c10334d3487443b8cc7c5551_511_0.png)\n\
    \n图7.6 求平均值过程的流图\n\n- 所谓独立路径是指至少引入程序的一个新处理语句集合或一个新条件的路径，用流图术语描述，**独立路径至少包含一条在定义该路径之前不曾用过的边**\n\
    - 使用基本路径测试法设计测试用例时，程序的**环形复杂度决定了程序中独立路径的数量**，而且这个数是确保程序中所有语句至少被执行一次所需的测试数量的上界\n\
    - 对于图7.6所描述的求平均值过程来说，由于环形复杂度为6，因此共有6条独立路径：\n  - 路径1：1-2-10-11-13\n  - 路径2：1-2-10-12-13\n\
    \  - 路径3：1-2-3-10-11-13\n  - 路径4：1-2-3-4-5-8-9-2-...\n  - 路径5：1-2-3-4-5-6-8-9-2-...\n\
    \  - 路径6：1-2-3-4-5-6-7-8-9-2-...\n\n路径4、5、6后面的省略号(...)表示，以后接通过控制结构其余部分的任意路径(10-11-13或10-12-13)\n\
    \n通常在导出测试用例时，识别出判定节点是很有必要的。本例中节点2、3、5、6和10是判定节点\n\n![](img/576b58d2c10334d3487443b8cc7c5551_514_0.png)\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_516_0.png)\n"
