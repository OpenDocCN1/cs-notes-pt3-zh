    # ## 五. 设计软件结构：将模块组织成良好的层次系统


    +   - 软件结构反映系统中模块的相互调用关系：顶层模块调用它的下层模块以实现程序的完整功能，每个下层模块再调用更下层的模块，最下层的模块完成最具体的功能


