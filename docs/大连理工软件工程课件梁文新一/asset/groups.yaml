    \ | (2)A=0 or B=0 or C=0(3)A+B<=C or B+C<=A or C+A<=B |\n| 是否等腰三角形 | (4)A=B or\
    \ B=C or C=A. | (5) A!=B and B!=C and C!=A |\n| 是否等边三角形 | (6)A=B=C | (7) A!=B\
    \ or B!=C or C!=A |\n\n用例1 (3,4,5)，输出构成三角形\n\n用例2 (0,4,4)，输出不构成三角形\n\n用例3 (3,4,10)，输出不构成三角形\n\
    \n用例4 (3,3,4)，输出构成等腰三角形\n\n用例6 (3,3,3)，输出构成等边三角形\n\n## 7.7.3 错误推测\n\n- 对于程序中可能存在哪类错误的推测，是挑选测试方案的一个重要因素\n\
    - 错误推测法在很大程度上靠直觉和经验进行。它的基本想法是列举出程序中可能有的错误和容易发生错误的特殊情况，并且根据它们选择测试方案\n- 已经发现的错误数目往往和尚未发现的错误数目成正比，因此，在进一步测试时要着重测试那些已经发现了较多错误的程序段\n\
    - 例如测试一个排序程序\n- 输入表为空表、输入表只有一个元素、输入表所有元素都相同、输入表已经排好序\n\n## 7.8 调试\n\n- 调试(也称为纠错,\
    \ Debug)作为成功的测试的后果而出现，即调试是在测试发现错误之后排除错误的过程\n\n### 7.8.1 调试过程\n\n- 调试不是测试，但是它总是发生在测试之后\n\
    - 调试过程从执行一个测试用例开始，评估测试结果\n- 如果发现实际结果与预期结果不一致，则这种不一致就是一个症状，它表明在软件中存在着隐藏的问题\n- 调试过程试图找出产生症状的原因，以便改正错误\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_559_0.png)\n\n### 7.8.2 调试途径\n\n无论采用什么方法，调试的根本目标都是寻找软件错误的原因并改正之。这个目标是通过把系统地评估、直觉和运气组合起来实现的。一般来说，有下列三种调试途径可以采用：\n\
    \n- 蛮干法：打印内存数据、关键输出、断点\n- 回溯法：由症状回推可能的原因\n- 原因排除法：对分查找、归纳、演绎等方法\n\n- 对分查找法\n \
    \ - 知道关键点的正确值，在程序中点“注入”变量的正确值，然后运行程序检查输出\n- 归纳法\n  - 从个别现象推断出一般性结论的思维方法。把和错误有关的数据组织起来进行分析，以便发现可能的错误原因。利用假设证明或排除可能的错误原因\n\
    - 演绎法\n  - 从一般原理或前提出发，经过排除和精化的过程推导出结论\n\n- 在修改错误之前需要考虑：\n  - 是否同样的错误也存在于程序的其他地方？\n\
    \  - 将要进行的修改可能会引入的“下一个错误”是什么？\n  - 为防止今后出现类似的错误，应该做什么？\n\n## 7.9 软件可靠性\n\n###\
    \ 7.9.1 基本概念\n\n#### 1. 软件可靠性的定义\n\n- 对于软件可靠性有许多不同的定义，其中多数人承认的一个定义是：\n- 软件可靠性是程序在给定的时间间隔内，按照规格说明书的规定成功地运行的概率。\n\
    \n#### 2. 软件的可用性\n\n- 通常用户也很关注软件系统可以使用的程度。一般来说，对于任何其故障是可以修复的系统，都应该同时使用可靠性和可用性来衡量它的优劣程度\n\
    - 软件可用性的一个定义是：\n- 软件可用性是程序在给定的时间点，按照规格说明书的规定，成功地运行的概率\n- 可靠性：0到t这段时间间隔内，系统没有失效\n\
    - 可用性：t时刻，系统是正常运行的\n\n如果在一段时间内，软件系统故障停机时间分别为td1，td2....，正常运行时间分别为tu1，tu2，...，则系统的稳态可用性为：\n\
    \n[A_{ss} = \\frac{T_{up}}{T_{up} + T_{down}}]\n\n- 其中 \\( T_{up} = \\sum t_{ui}\
    \ \\)，\\( T_{down} = \\sum t_{di} \\)\n- 如果引入系统平均无故障时间MTTF和平均维修时间MTTR的概念，则上式可以变成\n\
    \n[A_{ss} = \\frac{MTTF}{MTTF + MTTR}]\n\n- 平均维修时间MTTR(Mean Time To Repair/Recover)是修复一个故障平均需要用的时间，取决于维护人员的技术水平和对系统的熟悉程度，也和系统的可维护性有重要关系\n\
    - 平均无故障时间MTTF(Mean Time To Failure)是系统按规格说明书规定成功地运行的平均时间，它主要取决于系统中潜伏的错误的数目，因此和测试的关系十分密切\n\
    \n### 7.9.2 估算平均无故障时间的方法\n\n- 软件的平均无故障时间MTTF是一个重要的质量指标，往往作为对软件的一项要求由用户提出\n- 估算MTTF使用下述符号表示有关的数量：\n\
    - E<sub>T</sub>——测试之前程序中错误总数；\n- I<sub>T</sub>——程序长度(机器指令总数)；\n- τ——测试(包括调试)时间；\n\
    - E<sub>d</sub>(τ)——在0至τ期间发现的错误数\n- E<sub>c</sub>(τ)——在0至τ期间改正的错误数\n\n"
