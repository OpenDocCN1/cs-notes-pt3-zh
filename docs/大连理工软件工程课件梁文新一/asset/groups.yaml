    # 5.3 启发规则 (Heuristics)


    3 深度、宽度、扇出和扇入都应适当


    +   - 深度 (Depth)：软件结构中控制的层数

    +   - 宽度 (Width)：软件结构中同一个层次上的模块总数最大值

    +   - 扇出 (Fan-out)：一个模块直接控制（调用）的模块数目（一般应控制在7个之内）

    +   - 扇入 (Fan-in)：有多少个上级模块直接调用它


