    # # 5.2.5 间多的应用规格说明技术 FAST(Facilitated Application Specification Techniques)


    +   - 提倡用户与开发者密切合作，共同标识问题，提出解决方案的要素，商讨不同的方法并指定基本的需求


    +   - 简易的应用规格说明技术已经成为信息系统界使用的主流技术


    ![](img/576b58d2c10334d3487443b8cc7c5551_160_0.png)'
  - '[PAGE 161]


    # 5.2.3 同步判断应用规格说明技术


    FAST(Facilitated Application Specification Techniques)


    +   - 在中立地点 (Neutral place) 举行由开发者和用户双方出席的会议

    +   - 制定准备会议和参加会议的规则 (Rules)

    +   - 提出一个议事日程 (Agenda)，这个日程应该是够正式，以便能够涵盖所有要点；同时这个日程应该足够非正式，以便鼓励自由思维

    +     - Brainstorming encouraged

    +   - 由一个“协调人”(Facilitator)来主持会议

    +   - 达成一个共同目标 (Common Goal)

    +   - 标识问题、提出解决方案要素、商讨不同的方法以及在有利于实现目标的氛围中指定初步的需求

    +   - 起草完整的软件需求规格说明书'
  - '[PAGE 162]


    # 3.2.4 快速建立软件原型


    +   - 构建原型的要点是，它应该实现用户看得见的目标系统的主要功能（例如屏幕显示或打印报表），省略目标系统的“隐含”功能（如修改文件）

    +   - 快速原型应该具备的首要特性是“快速”

    +     - 快速原型的目的是尽快向用户提供一个可在计算机上运行的目标系统的模型，以便使用户和开发者在目标系统应该“做什么”这个问题上尽可能快地达成共识

    +   - 快速原型应该具备的第二个特性是“容易修改”

    +     - 如果原型的第一版不是用户所需要的，就必须根据用户的意见迅速地修改它，构建出原型的第二版，以更好地满足用户的需求

    +     - 在实际开发软件产品时，“修改—试用—反馈”的过程可能重复多遍，如果修改耗时过多，势必延误软件开发时间'
  - '[PAGE 163]


    # 3.2.4 快速建立软件原型


    +   - 构建原型的方法和工具

