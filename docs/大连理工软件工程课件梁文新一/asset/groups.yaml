    \n- ① 所设计出的测试用例能够减少为达到合理测试所需要设计的**附加测试**的数目。\n- ② 所设计出的测试用例能够告诉我们，是否存在**某些类型**的错误，而不是仅仅指出与**特定测试相关的错误**是否存在。\n\
    \n### 7.7.1 等价划分\n\n等价划分（Equivalence Partitioning）是一种黑盒测试方法，这种方法把程序的输入域划分成数据类，据此可以导出测试用例。\n\
    \n一个理想的测试用例能独自发现一类错误（例如，对所有字符数据的处理都不正确）。\n\n如果把所有可能的输入数据（有效的和无效的）划分成若干个等价类（Equivalence\
    \ Sets），则可以合理地做出下述假定：\n\n每类中的一个典型值在测试中的作用与这一类中所有其他值的作用相同。\n\n因此，可以从每个等价类中只取一组数据作为测试数据。这样选取的测试数据最有代表性，最可能发现程序中的错误。\n\
    \n使用等价划分法设计测试方案首先需要划分输入数据的等价类，为此需要研究程序的功能说明，从而确定输入数据的有效（Valid）等价类和无效（Invalid）等价类。\n\
    \n在确定输入数据的等价类时常常还需要分析输出数据的等价类，以便根据输出数据的等价类导出对应的输入数据等价类。\n\n划分等价类需要经验，下述几条启发式规则可能有助于等价类的划分：\n\
    \n- 如果规定了**输入值的范围**，则可划分出一个有效的等价类（输入值在此范围内），**两个无效的等价类**（输入值小于最小值或大于最大值）。\n- 如果规定了**输入数据的个数**，则类似地也可以划分出一个有效的等价类和两个无效的等价类。\n\
    - 如果规定了**输入数据的一组值**，而且程序对不同输入值做不同处理，则每个允许的输入值是一个有效的等价类，此外还有一个无效的等价类（任一个不允许的输入值）。\n\
    - 如果规定了输入数据必须遵循的规则，则可以划分出一个有效的等价类（**符合规则**）和若干个无效的等价类（**从各种不同角度违反规则**）。\n- 如果规定了输入数据为整型，则可以划分出正整数、零和负整数等三个有效类。\n\
    - 如果程序的处理对象是**表格**，则应该使用空表、以及含一项或多项的表。\n\n划分出等价类以后，根据等价类设计测试方案时主要使用下面两个步骤：\n\n\
    - 设计一个新的测试方案以尽可能多地覆盖尚未被覆盖的有效等价类，重复这一步骤直到所有有效等价类都被覆盖为止。\n- 设计一个新的测试方案，使它覆盖一个而且只覆盖一个尚未被覆盖的无效等价类，重复这一步骤直到所有无效等价类都被覆盖为止。\n\
    \n下面用等价划分法设计一个简单程序的测试方案。\n\n假设有一个把数字串转变成整数的函数。运行程序的计算机字长16位，用二进制补码表示整数。这个函数是用PASCAL语言编写的，它的说明如下：\n\
    \n- `function strtoint(dstr:shortstr):integer;`\n  函数的参数类型是shortstr，它的说明是：\n \
    \ `type shortstr=array [1..6] of char;`\n\n被处理的数字串是右对齐的，也就是说，如果数字串比六个字符短，则在它的左边补空格。如果数字串是负的，则负号和最高位数字紧相邻（负号在最高位数字左边一位）。\n\
    \n考虑到PASCAL编译程序固有的检错功能，测试时不需要使用长度不等于6的数组做实在参数，更不需要使用任何非字符数组类型的实在参数。\n\n分析这个程序的规格说明，可以划分出如下等价类：\n\
    \n- 1. 有效输入的等价类有\n  - 1～6个数字字符组成的数字串（最高位数字不是零）\n  - 最高位数字是零的数字串\n  - 最高位数字左邻是负号的数字串\n\
    \n- 2. 无效输入的等价类有\n  - 空字符串（全是空格）；\n  - 左部填充的字符既不是零也不是空格；\n  - 最高位数字右面由数字和空格混合组成；\n\
    \  - 最高位数字右面由数字和其他字符混合组成；\n  - 负号与最高位数字之间有空格。\n\n- 3. 合法输出的等价类有\n  - 在计算机能表示最小负整数和零之间的负整数；\n\
    \  - 零；\n  - 在零和计算机能表示最大正整数之间的正整数。\n\n- 4. 非法输出的等价类有\n  - 比计算机能表示的最小负整数还小的负整数；\n\
    \  - 比计算机能表示的最大正整数还大的正整数。\n\n因为所用的计算机字长16位，用二进制补码表示整数，所以能表示的最小负整数是-32768，能表示的最大正整数是32767。\n\
    \n根据上面划分出的等价类，可以设计出下述测试方案（注意，每个测试方案由三部分内容组成）。\n\n- 1～6个数字组成的数字串，输出是合法的正整数。\n \
    \ - 输入：`'     1'`\n  - 预期的输出：1\n\n- 最高位数字是零的数字串，输出是合法的正整数。\n  - 输入：`'000001'`\n\
    \  - 预期的输出：1\n\n- 负号与最高位数字紧相邻，输出合法的负整数。\n  - 输入：`'-00001'`\n  - 预期的输出：-1\n\n-\
    \ 最高位数字是零，输出也是零。\n  - 输入：`'000000'`\n  - 预期的输出：0\n\n- 太小的负整数。\n  - 输入：`'-47561'`\n\
    \  - 预期的输出：“错误——无效输入”\n"
  mdcn: "\n## 例子3\n\n- C3: (E1>E2)&(E3=E4)\n\n其中，E1、E2、E3和E4是算术表达式。C3的条件约束形式为(D1，D2)，而D1和D2的每一个都是>、=或<。除了C3的第一个简单条件是关系表达式之外，C3和C2相同，因此，可以通过修改C2的约束集得到C3的约束集，结果为：{(>,\
    \ =), (=, =), (<, =), (>, <), (>, >)}。覆盖上述条件约束集的测试，保证可以发现C3中关系算符的错误。\n\n## 3.循环测试\n\
    \n循环测试是一种白盒测试技术，它专注于测试循环结构的有效性。\n\n![](img/576b58d2c10334d3487443b8cc7c5551_532_0.png)\n\
    \n### (1) 简单循环\n\n应该使用下列测试集来测试简单循环，其中n是允许通过循环的最大次数：\n\n- 跳过循环\n- 只通过循环一次\n- 通过循环两次\n\
    - 通过循环m次，其中m<n-1\n- 通过循环n-1，n，n+1次\n\n### (2) 嵌套循环\n\n如果把简单循环的测试方法直接应用到嵌套循环，可能的测试数就会随嵌套层数的增加按几何级数增长，这会导致不切实际的测试数目。B.\
    \ Beizer提出了一种能减少测试数的方法：\n\n- 从最内层循环开始测试，把所有其他循环都设置为最小值。\n- 对最内层循环使用简单循环测试方法，而使外层循环的迭代参数（例如，循环计数器）取最小值，并为**越界值或非法值**增加一些额外的测试。\n\
    - 由内向外，对下一个循环进行测试，但保持所有其他外层循环为最小值，其内循环为“典型”值。\n- 继续进行下去，直到测试完所有循环。\n\n### (3)\
    \ 串接循环\n\n如果串接循环的各个循环都彼此独立，则可以使用前述的测试简单循环的方法来测试串接循环。\n\n但是，如果两个循环串接，而且第一个循环的循环计数器值是第二个循环的初始值，则这两个循环并不是独立的。当循环不独立时，建议使用测试嵌套循环的方法来测试串接循环。\n\
    \n## 7.7 黑盒测试技术\n\n- 黑盒测试着重测试软件的**功能需求**，也就是说，黑盒测试让软件工程师设计出能充分检查程序的**所有功能需求**的输入条件集。\n\
    - 黑盒测试并不能取代白盒测试技术，它是与白盒测试互补的方法，它很可能发现白盒测试不易发现的其他不同类型的错误。\n\n- 黑盒测试力图发现下述类型的错误：\n\
    \  - ① 功能不正确或遗漏了功能；\n  - ② 界面错误；\n  - ③ 数据结构错误或外部数据库访问错误；\n  - ④ 性能错误；\n  - ⑤\
    \ 初始化和终止错误。\n\n- 白盒测试在测试过程的早期阶段进行，而黑盒测试主要用于测试过程的后期。\n\n- 黑盒测试故意不考虑程序的控制结构，而把注意力集中于信息域。\n\
    \n### 黑盒测试方案应该考虑下述问题：\n\n- 1. 怎样测试功能的有效性；\n- 2. 哪些类型的输入将构成好测试用例；\n- 3. 系统是否对特定的输入值特别敏感；\n\
    - 4. 怎样划分数据类的边界；\n- 5. 系统能够承受什么样的数据率和数据量；\n- 6. 数据的特定组合将对系统运行产生什么影响。\n\n### 应该设计满足下述标准的测试用例集：\n\
