    \n(a)\n\n(b)\n\n第一层\n\n第二层\n\n第三层\n\n第四层\n\n第五层\n\n第六层\n\n### 图6.13 描绘统计空格程序结构的Jackson图\n\
    \n### Step. 3 从数据结构图导出程序结构图\n\n- 在程序结构图的第四层似乎应该是和“字符串”、“字符”及“空格数”等数据单元对应的处理框“印字符串”、“分析字符”及“印空格数”，这三个处理是顺序执行的\n\
