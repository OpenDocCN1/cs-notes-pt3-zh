  md: "\n## 3.2 The Interpolation Method of Generating Training Samples\n\nFor the\
    \ terrain semantic segmentation, large amounts of samples with dense annotations\
    \ are necessary. Sufficient diverse samples can be synthesized and automatically\
    \ labeled through the virtual world. However, the domain gap between virtual and\
    \ real world leads to accuracy decrease. Hence, the interpolated samples of virtual\
    \ and real images contribute to training, and each sample has a one-dimensional\
    \ style vector to specify the style of the image. The style codes of the real\
    \ and virtual worlds are manually identified, and those of generated interpolated\
    \ images are generated by the style vector interpolation.\n\nSpecifically, the\
    \ generator takes as inputs the style code vector of the sample and the semantic\
    \ layout of anthropocentric scene, then generates the corresponding synthetic\
    \ image. All training samples are composed of synthetic images (interpolated between\
    \ virtual and real) and corresponding auxiliary inputs (layout and style vector).\n\
    \nIt is worth mentioning that not all the generated interpolated images are of\
    \ high quality, some have low-level artifacts. Thus three terms of constraints\
    \ are applied to select images with clear structures for training:\n\n- 1. **Structural\
    \ similarity.** We apply the similarity between the semantic layout and the generated\
    \ image by a pre-trained segmentation network. Only the images with high confidence\
    \ are selected.\n- 2. **FID's quality assessment.** We use the Fréchet Inception\
    \ Distance (FID) to measure the quality of the whole generated image set.\n- 3.\
    \ **Local inconsistency suppression.** We suppress the low-level artifacts by\
    \ a local texture comparison using the structural similarity (SSIM) between the\
    \ generated and real images.\n\nFinally, the training set is constructed with\
    \ the collected interpolated images (the distribution shown in Fig. 4), and each\
    \ image is assigned with its corresponding style vector and semantic layout.\n\
    \nThe efficacy of the proposed auxiliary inputs (semantic layout and style vector)\
    \ can be evaluated by comparing different training schemes, and the comparison\
    \ results are shown in Table 1. Combining both style vector and semantic layout\
    \ as auxiliary inputs yields the best accuracy.\n\nAs shown in Table 1, when the\
    \ style vector is used as an auxiliary input, the mIoU is improved from 61.2%\
    \ to 68.7%; when additionally the semantic layout is used, the mIoU is further\
    \ improved to 71.6%. The results verify the effectiveness of the two auxiliary\
    \ inputs.\n\n| Method | mIoU |\n|:---|:---:|\n| baseline | 61.2% |\n| baseline\
    \ + SV | 68.7% |\n| baseline + SV + SL | 71.6% |\n\nTable 1: The accuracy of different\
    \ combinations of auxiliary inputs, where SV denotes style vector, SL denotes\
    \ semantic layout.\n\nWe find that the semantic segmentation network can benefit\
    \ from the proposed generated training samples in three aspects. First, \"unknown\"\
    \ instances can be learned from...\n\n## 7.1 编码\n\n### 7.1.1 选择程序设计语言\n\n- 程序设计语言是人和计算机通信的最基本的工具\n\
    - 影响人的思维和解题方式\n- 影响人和计算机通信的方式和质量\n- 影响其他人阅读和理解程序的难易程度\n\n选择一种适当的程序设计语言显得尤为重要\n\
    \n- **汇编语言**应仅在以下特殊应用领域中使用\n  - 对程序执行时间和使用的空间都有很严格限制的情况\n  - 需要产生任意的甚至非法的指令序列\n\
    \  - 体系结构特殊的微处理机，以致在这类机器上通常不能实现高级语言编译程序\n  - 或者大型系统中执行时间非常关键的（或直接依赖于硬件的）一小部分代码\n\
    - 其他程序应该一律用**高级语言**书写\n\n### 选择程序设计语言应考虑的因素\n\n- 1）软件的应用领域\n- 2）算法和数据结构的复杂性\n\
    - 3）系统用户的要求\n- 4）软件运行环境\n- 5）软件开发的方法\n- 6）可得到的软件工具\n- 7）工程规模\n- 8）软件的可移植性要求\n\
    - 9）程序员的知识水平\n\n### 7.1.2 编码风格\n\n- 程序实际上也是一种**供人阅读的文章**，有一个文章的风格问题\n  - 应该使程序具有良好的风格\n\
    \  - 力图从编码原则的角度提高程序的可读性，改善程序质量\n- 编程风格包括以下五个方面\n  - 源程序文档化\n  - 数据说明\n  - 语句构造\n\
    \  - 输入输出\n  - 效率\n\n### 数据说明(Data Description)\n\n- 在设计阶段已经确定了数据结构的组织及其复杂性。在编写程序时，则需要注意数据说明的风格\n\
    - 为了使程序中数据说明更易于理解和维护，必须注意以下几点\n  - 1.数据说明的次序应当规范化\n  - 2.说明语句中变量安排有序化\n  - 3.使用注释说明复杂数据结构\n\
    \n### 语句构造(Program Structure)\n\n- 在设计阶段确定了软件的逻辑流结构，但构造单个语句则是编码阶段的任务\n- 语句构造应力求简单，直接，**不能为了片面追求效率而使语句复杂化**\n\
    - 常用规则\n  - 一行内只写一条语句\n  - 首先考虑清晰性\n  - 直截了当说明程序员意图\n  - 其他规则\n"
