    # 7.2 软件测试基础


    软件测试的定义：软件测试就是在软件投入运行前，对软件需求分析、设计规格说明和编码实现的最终审查，它是软件质量保证的关键步骤。通常对软件测试的定义有两种描述：


    +   - 定义1：软件测试是为了发现错误而执行程序的过程

    +   - 定义2：软件测试是根据软件开发各阶段的规格说明和程序的内部结构而精心设计的一批测试用例（Test Cases），并利用这些测试用例运行程序以及发现错误的过程，即执行测试步骤


    ![](img/576b58d2c10334d3487443b8cc7c5551_460_0.png)'
  - "[PAGE 461]\n\n# # 7.2.1 软件测试的目标\n\n+   - 由于测试的目标是暴露程序中的错误，从心理学角度看，由程序的编写者自己进行测试是不恰当的\
    \  \n+     - 因此，在综合测试阶段通常由其他人员组成测试小组来完成测试工作\n\n+   - 测试决不能证明程序是正确的。即使经过了最严格的测试之后，仍然可能还有没发现的错误潜藏在程序中\
    \  \n+     - 测试只能查找出程序的错误，不能证明程序中没有错误\n\n发现至今为止尚未发现的错误"
  - '[PAGE 462]


    # 7.2.2 软件测试准则


    +   - 所有测试都应该能追溯到用户需求

    +   - 应该在测试开始之前就制定测试出计划

    +   - 把Pareto原则(80-20法则)应用到软件测试中

    +   - 应该从“小规模”测试开始，并逐步进行“大规模”测试：单元测试→集成测试→系统测试

    +   - 不可能完成穷举测试

    +   - 为了达到最佳的测试效果，应该由独立的第三方从事测试工作'
  - '[PAGE 463]


