    \n- FSM可以表示为一个5元组（J，K，T，S，F）\n  - 状态集J (finite, non-empty set of states)：{保险箱锁定，A，B，保险箱解锁，报警}\n\
    \  - 输入集K (finite, non-empty set of input)：{1L、1R、2L、2R、3L、3R}\n  - 初始态S (initial\
    \ state, an element of J, i.e. S∈J)：保险箱锁定\n  - 终态集F (final states, a (possibly\
    \ empty) subset of J, F⊆J)：{保险箱解锁，报警}\n  - 转换函数T (state-transition function, (J-F)*K→J)：如表4.1所示\n\
