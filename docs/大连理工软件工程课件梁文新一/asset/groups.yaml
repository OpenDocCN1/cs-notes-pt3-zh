  - "[PAGE 4]\n\n# # 软件的特点\n\n![](img/576b58d2c10334d3487443b8cc7c5551_4_0.png)\n\n\
    +   - 软件是一种逻辑实体，而非有形的系统元件  \n+     - 因而它具有抽象性，其开发成本和进度难以估算\n\n+   - 软件的生产与硬件不同，在它的开发过程中没有明显的制造过程\
    \  \n+     - 一旦开发成功只需复制即可使用，但维护工作量大\n\n+   - 在软件的运行和使用期间，没有硬件那样的机械磨损，老化问题  \n\
    +     - 但由于软件维护需要修改程序，从而导致故障率升高"
  - '[PAGE 5]


    # 软件的分类


    +   - **系统软件**

    +     - 最靠近计算机硬件的一层

    +     - OS、编译程序、设备驱动程序等

    +   - **支撑软件**

    +     - 支撑软件的开发和维护的软件

    +     - DBMS、软件开发工具等

    +   - **应用软件**

    +     - 应用于特定领域的软件

    +     - CAD、办公自动化软件、媒体播放软件等'
  - '[PAGE 6]


    # # 软件的规模


    | 类别 | 参加人员数 | 研制期限 | 产品规模（源程序行数） |

    |---|---|---|---|

    | 微型 | 1 | 1～4周 | 0.5k |

    | 小型 | 1 | 1～6月 | 1k～2k |

    | 中型 | 2～5 | 1～2年 | 5k～50k |

    | 大型 | 5～20 | 2～3年 | 50k～100k |

    | 甚大型 | 100～1000 | 4～5年 | 1M |

    | 极大型 | 2000～5000 | 5～10年 | 1M～10M |'
  - "[PAGE 7]\n\n# # 软件的发展\n\n+   - 程序设计阶段 —— 1946至1956年  \n+     - 低级语言：机器语言、汇编语言\
    \  \n+     - I/O小，但计算量大  \n+     - 尚未出现“软件”一词  \n+   \n+   - 程序系统阶段 —— 1956至1968年\
    \  \n+     - 高级程序语言出现  \n+     - I/O大，但计算量小  \n+     - 程序+文档+数据→“软件”→“软件危机”→软件工程\
    \  \n+   \n+   - 软件工程阶段 —— 1968年以后  \n+     - 用工程化方法开发和管理软件"
  - '[PAGE 8]


    # 1.1.1 软件危机的介绍


    ![](img/576b58d2c10334d3487443b8cc7c5551_8_0.png)


    在计算机软件的开发和维护过程中所遇到的一系列严重问题


    ![](img/576b58d2c10334d3487443b8cc7c5551_8_1.png)


    ![](img/576b58d2c10334d3487443b8cc7c5551_8_2.png)


    ![](img/576b58d2c10334d3487443b8cc7c5551_8_3.png)'
  - '[PAGE 9]


    # 软件危机所带来的严重后果


    +   - 仅有少数软件能够**及时**、**不超出预算**、**无差错**地交付，并且能**满足客户的需求**


    +   - Standish Group对2000年完成的280,000个软件项目的分析报告

    +     - 成功完成：28%

    +     - 取消：23%

    +     - 推迟完成、超出预算和/或功能缺失：49%


    +   - Cutter Consortium在2002年的报告

    +     - 有78%的信息技术组织卷入纠纷并最终以法律程序解决

    +     - 其中67%因交付的软件产品的性能或功能无法达标

    +     - 其中56%承诺的交付日期几次推迟

    +     - 其中45%所交付的软件存在严重错误以至于无法使用'
  - '[PAGE 10]


    # 软件危机的典型表现


    +   - 对软件开发成本和进度的估计常常很不准确

    +   - 时常发生用户对“已完成的”软件系统不满意的现象

    +   - 软件产品的质量不可靠

    +   - 软件常常是不可维护的

    +   - 软件通常没有适当的文档资料

    +   - 软件开发生产率提高的速度，既跟不上硬件的发展速度，也远远跟不上计算机应用迅速普及和深入的趋势

    +   - 软件成本在计算机系统总成本中所占的比例逐年上升'
  - '[PAGE 11]


    # # 软件成本在系统中的比例


    ![](img/576b58d2c10334d3487443b8cc7c5551_11_0.png)'
  - '[PAGE 12]


    # # 1.1.2 产生软件危机的原因


    # ## 与软件本身特点有关


    +   - 缺乏“可预见性”，管理和控制软件开发的过程很困难


    +   - 不可能测试出全部错误，导致软件较难维护


    +   - 规模庞大，在技术和管理上异常复杂和困难


    # ## 与开发与维护的方法不正确有关


    +   - 忽视需求分析


    +   - 轻视软件维护'
  - '[PAGE 13]


    # 错误识别的表现


    +   - **忽视软件需求分析的重要性**

    +     - 急于求成，仓促上马

    +     - 需求中的错误在需求阶段改正仅需1美元的代价，如果这一错误在交付客户时才发现，纠正该错误将付出1000美元的代价


    +   - **认为软件开发就是写程序并设法使之运行**

    +     - 典型开发：编码：10%-20%；测试：40%-50%

    +     - 软件产品的完整配置——程序、文档、数据


    +   - **轻视软件维护**

    +     - 事实上，用于软件维护的费用占总费用的55-70%

    +     - 开发每一行源代码耗资25美元，维护每一行源代码需要耗资1000美元


    ![](img/576b58d2c10334d3487443b8cc7c5551_13_0.png)


    > > 提高软件的可维护性，减少软件维护的代价'
  - '[PAGE 14]


    # 1.1.3 消除软件危机的途径


    +   - 对计算机软件正确认识：对软件就是程序 say no

    +   - 既要有技术措施（方法和工具），又要有科学的组织管理措施

    +     - 严密管理，良好组织，发扬团队精神

    +     - 推广使用在实践中总结出来的开发软件的成功的技术和方法，并且研究探索更好更有效的技术和方法，尽快消除错误概念和做法

    +     - 开发和使用更好的软件工具


    > 软件工程正是从管理和技术两方面研究如何更好地开发和维护计算机软件的一门新兴学科'
  - '[PAGE 15]


    <!-- no content -->'
  - '[PAGE 16]


    # # 软件工程的定义


    +   - Software Engineering Conference, Garmisch, Germany, NATO Science Committee,
    Oct., 1968


    +   - 软件工程就是为了经济地获得可靠的且能在实际机器上有效地运行的软件，而建立和使用完善的工程原理


    +   - ftp://210.30.96.4/PUBLIC_A_to_O/LiangWenxin_Public/Software Engineering/References'
  - "[PAGE 17]\n\n# 软件工程的定义\n\n+   - 1993年IEEE关于软件工程的一个更加综合的定义：\n+   \n+     (1) The\
    \ application of a systematic, disciplined, quantifiable approach to development,\
    \ operation and maintenance of software; that is, the application of engineering\
    \ to software\n+   \n+     (2) The study of approaches as in (1)"
  - '[PAGE 18]


    # 软件工程的本质特性


    +   1. 软件工程关注于大型程序的构造

    +   2. 软件工程的中心课题是控制复杂性

    +   3. 软件经常变化

    +   4. 开发软件的效率非常重要

    +   5. 和谐地合作是开发软件的关键

    +   6. 软件必须有效地支持它的用户

    +   7. 一种文化背景的人替另一种文化背景的人创造产品'
  - '[PAGE 19]


    # 1.2.2 软件工程的基本原理


    +   1. 用分阶段的生命周期计划严格管理


    +   2. 坚持进行阶段评审


    +   3. 实行严格的产品控制


    +   4. 采用现代程序设计技术


    +   5. 结果应能清楚地审查


    +   6. 开发小组的人员应该少而精


    +   7. 承认不断改进软件工程实践的必要性'
  - '[PAGE 20]


    # # 1.2.3 软件工程方法学


    在软件生命周期全过程中使用的一整套技术的集合称为方法学(methodology)，也称范型(paradigm)


