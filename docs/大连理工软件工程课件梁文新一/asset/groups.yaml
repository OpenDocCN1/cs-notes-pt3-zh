    ## 思考题\n\n用 jackson 图描绘一列火车的构成：\n\n- 一列火车最多有两个火车头。只有一个火车头时则位于列车最前列，若还有第二个火车头时，则第二个火车头位于列车最后面\n\
    - 火车头既可能是内燃机车也可能是电气机车，车厢分为硬座车厢、硬卧车厢和软卧车厢3种。硬座车厢在所有车厢的前面，软卧车厢在所有车厢的后面。此外，在硬卧车厢和软卧车厢之间还有一节餐车\n\
    \n## 思考题参考答案1\n\n## 思考题参考答案2\n\n## 6.5 程序复杂程度的定量度量\n\n### 如何检测模块质量\n\n- **定性度量**——软件设计的基本原理、启发规则\n\
    - **定量度量**\n  - 程序的复杂程度乘以适当常数，可估算软件中错误的数量以及软件开发需要用的工作量\n  - 可以比较两个不同设计或不同算法的优劣\n\
    \  - 也可以作为模块规模的精确限度\n\n"
  mdcn: "\n\n## 6.4.2 改进的Jackson图\n\n**(a) 顺序结构**，B、C、D 中任何一个都不能是选择出现或重复出现的数据元素（即，不能是右上角有小圆或星号标记的元素）\n\
    \n**(b) 选择结构**，S 右面括号中的数字是分支条件的编号\n\n**(c) 可选结构**，A 或者是元素 B 或者不出现（可选结构是选择结构的一种常见的特殊形式）\n\
    \n**(d) 重复结构**，循环结束条件的编号为 i\n\n## 6.4.3 Jackson方法\n\nJackson结构程序设计方法基本上由下述五个步骤组成。\n\
    \n1. 分析并确定输入数据和输出数据的逻辑结构，并用Jackson图描绘这些数据结构\n2. 找出输入数据结构和输出数据结构中有对应关系的数据单元。所谓有对应关系是指有直接的因果关系，在程序中可以同时处理的数据单元（对于重复出现的数据单元必须重复的次序和次数都相同才可能有对应关系）\n\
    3. 用下述三条规则从描绘数据结构的Jackson图导出描绘程序结构的Jackson图\n\n   - 第一，为每对有对应关系的数据单元，按照它们在数据结构图中的层次在程序结构图的相应层次画一个处理框（注意，如果这对数据单元在输入数据结构和输出数据结构中所处的层次不同，则和它们对应的处理框在程序结构图中所处的层次与它们之中在数据结构图中层次低的那个对应）\n\
    \   - 第二，根据输入数据结构中剩余的每个数据单元所处的层次，在程序结构图的相应层次分别为它们画上对应的处理框\n   - 第三，根据输出数据结构中剩余的每个数据单元所处的层次，在程序结构图的相应层次分别为它们画上对应的处理框\n\
    \n总之，描绘程序结构的Jackson图应该综合输入数据结构和输出数据结构的层次关系而导出来。\n\n在导出程序结构图的过程中，由于改进的Jackson图规定在构成顺序结构的元素中不能有重复出现或选择出现的元素，因此可能需要增加中间层次处理框\n\
    \n4. 列出所有操作和条件（包括分支条件和循环结束条件），并且把它们分配到程序结构图的适当位置\n5. 用伪码表示程序\n\n```\nA seq\nB\n\
    C\nD\nA end\n```\n\n```\nA select cond1\nB\nA or cond2\nC\nA or cond3\nD\nA end\n\
    ```\n\n```\nA iter until (或 while) cond\nB\nA end\n```\n\n## 示例\n\n一个正文文件由若干个记录组成，每个记录是一个字符串\n\
    \n要求统计每个记录中空格字符的个数，以及文件中空格字符的总个数\n\n要求的输出数据格式是，每复制一行输入字符串之后，另起一行印出这个字符串中的空格数，最后印出文件中空格的总个数\n\
    \n### Step. 3 从数据结构图导出程序结构图\n\n在描绘程序结构的Jackson图的最顶层画一个处理框“统计空格”，它与“正文文件”和“输出表格”这对最顶层的数据单元相对应\n\
    \n### 图6.13 描绘统计空格程序结构的Jackson图\n\n### Step. 3 从数据结构图导出程序结构图\n\n- 接下来还不能立即画与另一对数据单元（“字符串”和“串信息”）相对应的处理框\n\
    - 在输出数据结构中“串信息”的上层还有“表格体”和“空格总数”两个数据单元，在程序结构图的第二层应该有与这两个单元对应的处理框——“程序体”和“总数”\n\
    \n### Step. 3 从数据结构图导出程序结构图\n\n在程序结构图的第三层才是与“字符串”和“串信息”相对应的处理框——“处理字符串”\n\n统计空格\n\
    \n正文文件\n\n输出表格\n\n程序体\n\n印总数\n\n字符串*\n\n表格体\n\n空格总数\n\n处理字符串*\n\n字符*\n\n串信息*\n\
