    \n- 寻找可能的方案并推荐最佳方案\n- 对比方案设计出软件结构\n- 通过改进得到更合理的软件结构\n- 数据库设计\n- 确定测试要求并且制定测试计划\n\
    \n## 分析模型到软件设计的映射\n\n![分析模型到软件设计的映射](img/576b58d2c10334d3487443b8cc7c5551_272_0.png)\n\
    \n## 软件设计的重要性\n\n- 在软件设计期间所做出的决策，将最终决定软件开发能否成功，更重要的是，这些设计决策将决定软件维护的难易程度\n- 设计是软件开发过程中决定产品质量的关键阶段：\n\
    \  - 提供了可以进行质量评估的软件表示\n  - 把用户需求准确转变为最终产品\n  - 是后续所有软件开发与维护步骤的基础\n\n## 软件设计的重要性\n\
    \n![软件设计的重要性](img/576b58d2c10334d3487443b8cc7c5551_274_0.png)\n\n软件设计是后续开发步骤及软件维护工作的根基。\
    \  \n如果失去设计，所有后续工作就如同一只摇摇欲坠的陀螺\n\n## 5.1 设计过程\n\n三．推荐最佳方案：综合分析对比各种合理方案的利弊，推荐一个最佳的方案，并为最佳方案制定详细的实现计划（Chap.\
    \ 13）\n\n四．功能分解：对分析模型进一步细化，进行功能分解\n\n- 程序设计\n  - 结构设计：模块组成及相互关系\n  - 过程设计：各模块的处理过程→详细设计\n\
    \n## 5.1 设计过程\n\n### 五. 设计软件结构：将模块组织成良好的层次系统\n\n- 软件结构反映系统中模块的相互调用关系：顶层模块调用它的下层模块以实现程序的完整功能，每个下层模块再调用更下层的模块，最下层的模块完成最具体的功能\n\
    - 软件结构通过层次图或结构图来描绘，通过对DFD进一步细化，并用IPO图等工具描述细化后每个处理的算法\n\n### 六. 数据库设计\n\n"
