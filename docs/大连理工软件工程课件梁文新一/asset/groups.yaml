    # # 数据流图的层次结构


    +   - 按照系统的层次结构进行逐步分解，并以分层的数据流图反映这种结构关系，能清楚地表达和容易理解整个系统


    +   - 在多层数据流图中，顶层流图仅包含一个加工，它代表被开发系统


    +   - 其输入流是该系统的输入数据（一个或多个起点），输出流是系统所输出数据（一个或多个终点）


    +   - 底层流图是指其加工不需再做分解（基本加工）的数据流图，其处于分层流图的最底层


    +   - 中间层流图则表示对其上层父图的细化，其每一加工可能继续细化，形成子图'
