    # ### 2.3.1 符号


    # #### 基本符号


    | 符号 | 名称 | 说明 |

    |---|---|---|

    | 矩形 | 处理 | 能改变数据值或数据位置的加工或部件，例如，程序、处理机、人工加工等都是处理 |

    | 平行四边形 | 输入输出 | 表示输入或输出（或既输入又输出）。是一个广义的不指明具体设备的符号 |

    | 圆形 | 连接 | 指出转到图的另一部分或从图的另一部分转来，通常在同一页上 |

    | 五边形 | 换页连接 | 指出转到另一页图上或由另一页图转来 |

    | 箭头 | 数据流 | 用来连接其他符号，指明数据流动方向 |'
