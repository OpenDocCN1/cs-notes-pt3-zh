    # 渐增式组装


    # 7.4.1 自顶向下集成(Top-Down Integration)


    +   - 从**主控制模块(main control module)**开始，沿着软件的控制层次向下移动，从而逐渐把各个模块结合起来

    +   - 在把附属于(以及最终附属于)主控制模块的那些模块组装到软件结构中去时，可使用**深度优先**或**宽度优先**的策略'
