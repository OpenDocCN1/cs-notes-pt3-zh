    ## 5.5.4 设计优化(Refactoring)\n\n- Refactoring means restructuring a program to improve\
    \ its structure without changing its functionality\n- “一个不能工作的 ‘最佳设计’ 的价值是值得怀疑的”\n\
    - 软件设计人员应该致力于开发能够满足所有功能和性能要求，而且按照设计原理和启发式设计规则衡量是值得接受的软件\n- 应该在设计的早期阶段尽量对软件结构进行精化。可以导出不同的软件结构，然后对它们进行评价和比较，力求得到“最好”的结果\n\
    - 这种优化的可能，是把软件结构设计和过程设计分开的真正优点之一\n\n- 力求做到在有效的模块化的前提下使用最少量的模块\n- 在能够满足信息要求的前提下使用最简单的数据结构\n\
    - 对于时间是决定性因素的应用场合：\n- Pareto Principle(80/20原则)\n- 程序中较小的部分通常占全部处理时间的大部分\n- 在软件中孤立出那些大量占用处理器资源的模块\n\
    - 在详细设计阶段对这些最耗时的模块进行重点优化\n- 必要时重新设计和编写这些模块，以提高整体效率\n\n> “先使它能工作起来，然后再使它快起来”\n\n\
