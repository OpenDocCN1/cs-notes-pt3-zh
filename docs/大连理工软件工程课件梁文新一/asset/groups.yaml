    - 面向对象方法学的出发点和基本原则：\n  - 只可能模拟人类习惯的思维方式\n  - 使开发软件的方法与过程尽可能接近人类认识世界解决问题的方法与过程\n\
    \  - 使描述问题的问题空间（问题域）与实现解法的解空间（求解域）在结构上尽可能一致\n\n- 用面向对象方法学开发软件的过程，是一个主动地多次反复迭代的演化过程。面向对象法在概念和表示方法上的一致性，保证了在各项开发活动之间的平滑（无缝）过渡\n\
    - 面向对象方法普遍进行的对象分类过程，支持从特殊到一般的归纳思维过程；通过建立类等级而获得的继承性，支持从一般到特殊的演绎思维过程\n\n- 最终的软件产品由许多小的基本上独立的对象组成，而且大多数对象都与现实世界中的实体相对应\n\
    \  - 降低了软件产品的复杂性\n  - 提高了软件产品的可理解性\n  - 简化了软件的开发和维护工作\n\n- 由于对象是相对独立的实体，容易在以后的软件产品中重复使用，因此，面向对象范型的另一个重要优点是促进了软件重用\n\
    \n- 面向对象方法特有的继承性，也进一步提高了面向对象软件的可重用性\n\n## 1.3 软件生命周期 (Software Life Cycle)\n\n\
    ![](img/576b58d2c10334d3487443b8cc7c5551_28_0.png)\n\n![](img/576b58d2c10334d3487443b8cc7c5551_29_0.png)\n\
