  - '[PAGE 579]


    # # 概述


    +   软件产品被开发出来并交付用户使用之后，就进入了软件的运行维护阶段。


    +   软件生命周期的最后一个阶段，其基本任务是保证软件在一个相当长的时期能够正常运行。


    +   维护成本占重成本的40-90%。


    +   目前国外许多软件开发组织把60%以上的人力用于维护已有软件


    +   软件工程的主要目的就是提高软件的可维护性，减少软件维护所需要的工作量，降低软件系统总成本。'
