    # 3.4 实体—关系图（Entity-Relationship Diagram）


    +   - 数据模型包含三种相互关联的信息：**数据对象**、描述数据对象**属性**及数据对象彼此间相互连接的**关系**。


    +   - 数据对象


    +     - 数据对象是对软件必须理解的**复合信息**的表示。所谓复合信息是指具有一系列不同性质或属性的事物，因此，仅有单个值的事物（例如长度，名称）不是数据对象


    +     - 数据对象可以是外部实体（产生和使用信息的事物）、事物（如报表）、角色（如教师、学生）、行为或事件（选课）、组织单位、地点或结构


    +     - 数据对象只封装了数据，没有包含作用于这些数据上的操作'
  - '[PAGE 168]


    # # 3.4 实体—关系图 (Entity-Relationship Diagram)


    # ## 属性


    +   - 属性定义了数据对象的性质和特征


    +   - 为了唯一地标识数据对象的某一个实例，定义数据对象中的一个属性或几个属性为**关键字**，简称键 (key)


    +   - 应该根据对所要解决的问题的理解，来确定特定数据对象的一组合适的属性'
  - '[PAGE 169]


    # 3.4 实体—关系图（Entity-Relationship Diagram）


    +   - 关系：数据对象彼此之间相互连接的方式称为关系（联系）

    +     - 一对一联系（1：1）

    +     - 一对多联系（1：N）

    +     - 多对多联系（M：N）

    +   - 关系本身也可能有属性


    ![](img/576b58d2c10334d3487443b8cc7c5551_169_0.png)'
  - '[PAGE 170]


    # ER模型表示方法


    +   - ER图中包含**实体（即数据对象）**、**关系**和**属性**三种基本成分

    +   - 通常用矩形框代表实体，用连接相关实体的菱形框表示关系

    +   - 用椭圆形或圆角矩形表示实体（或关系）的属性

    +   - 并用无向边把实体（或关系）与其属性连接起来'
