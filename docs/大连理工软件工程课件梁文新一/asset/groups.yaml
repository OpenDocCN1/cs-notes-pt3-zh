  - '[PAGE 540]


    # # 7.7.1 等价划分


    +   等价划分(Equivalence Partitioning)是一种黑盒测试方法，这种方法把程序的输入域划分成数据类，据此可以导出测试用例


    +   一个理想的测试用例能独自发现一类错误(例如，对所有字符数据的处理都不正确)


    +   如果把所有可能的输入数据(有效的和无效的)划分成若干个等价类(Equivalence Sets)，则可以合理地做出下述假定：


    +   每类中的一个典型值在测试中的作用与这一类中所有其他值的作用相同


    +   因此，可以从每个等价类中只取一组数据作为测试数据。这样选取的测试数据最有代表性，最可能发现程序中的错误'
  - '[PAGE 541]


    # # 7.7.1 等价划分


    +   使用等价划分法设计测试方案首先需要划分输入数据的等价类，为此需要研究程序的功能说明，从而确定输入数据的有效(Valid)等价类和无效(Invalid)等价类


    +   在确定输入数据的等价类时常常还需要分析输出数据的等价类，以便根据输出数据的等价类导出对应的输入数据等价类


    +   划分等价类需要经验，下述几条启发式规则可能有助于等价类的划分'
  - '[PAGE 542]


    # # 7.7.1 等价划分


    +   - 如果规定了**输入值的范围**，则可划分出一个有效的等价类(输入值在此范围内)，**两个无效的等价类**(输入值小于最小值或大于最大值)


    +   - 如果规定了**输入数据的个数**，则类似地也可以划分出一个有效的等价类和两个无效的等价类


    +   - 如果规定了**输入数据的一组值**，而且程序对不同输入值做不同处理，则每个允许的输入值是一个有效的等价类，此外还有一个无效的等价类(任一个不允许的输入值)


    +   - 如果规定了输入数据必须遵循的规则，则可以划分出一个有效的等价类(**符合规则**)和若干个无效的等价类(**从各种不同角度违反规则**)


    +   - 如果规定了输入数据为整型，则可以划分出正整数、零和负整数等三个有效类


    +   - 如果程序的处理对象是**表格**，则应该使用空表、以及含一项或多项的表'
