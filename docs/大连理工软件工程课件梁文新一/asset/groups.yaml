    # # 6.1 结构程序设计 (Structured Programming)


    经典的结构程序设计：只允许使用顺序、IF-THEN-ELSE型分支和DO-WHILE型循环这三种基本控制结构


    扩展的结构程序设计：除了上述三种基本控制结构之外，还允许使用DO-CASE型多分支结构和DO-UNTIL型循环结构


    修正的结构程序设计：再加上允许使用LEAVE (或BREAK) 结构'
