    \n随机地给一部分错误加标记，分别测试法使用两个测试员（或测试小组），彼此独立地测试同一个程序的两个副本，把其中一个测试员发现的错误作为有标记的错误。具体做法是，在测试过程的早期阶段，由测试员甲和测试员乙分别测试同一个程序的两个副本，由另一名分析员分析他们的测试结果。用\
    \ \\(\\tau\\) 表示测试时间，假设 \\(\\tau=0\\) 时错误总数为 \\(B_0\\)；\\(\\tau=\\tau_1\\) 时测试员甲发现的错误数为\
    \ \\(B_1\\)；\\(\\tau=\\tau_1\\) 时测试员乙发现的错误数为 \\(B_2\\)；\\(\\tau=\\tau_1\\) 时两个测试员发现的相同错误数为\
    \ \\(b_c\\)。\n\n如果认为测试员甲发现的错误是有标记的，即程序中有标记的错误总数为 \\(B_1\\)，则测试员乙发现的 \\(B_2\\)\
    \ 个错误中有 \\(b_c\\) 个是有标记的。假定测试员乙发现有标记错误和发现无标记错误的概率相同，则可以估计出测试前程序中的错误总数为\n\\[\n\
    B_0 = \\frac{B_2}{b_c} B_1\n\\]\n使用分别测试法，在测试阶段的早期，每隔一段时间分析员分析两名测试员的测试结果，并且用上式计算\
    \ \\(B_0\\)。如果几次估算的结果相差不多，则可用 \\(B_0\\) 的平均值作为 \\(E_T\\) 的估计值。此后一名测试员可以改做其他工作，由余下的一名测试员继续完成测试工作，因为他可以继承另一名测试员的测试结果，所以分别测试法增加的测试成本并不太多。\n\
    \n## 思考题\n\n在测试一个长度为48000条指令的程序时，第一个月由甲、乙两名测试员各自独立测试这个程序。经过一个月测试后，甲发现并改正了20个错误，使MTTF达到8h。与此同时，乙发现24个错误，其中的6个错误甲也发现了。以后由甲一个人继续测试这个程序。问：\n\
    \n- （1）刚开始测试时，程序总共有多少个潜藏的错误？\n- （2）为使MTTF达到240h，必须再改正多少个错误？\n\n## 思考题参考答案\n\n\
    - （1）本题采用了分别测试法\n  \\[\n  B_0 = \\frac{B_2}{b_c} B_1 = \\frac{24}{6} \\times 20\
    \ = 80\n  \\]\n- （2）根据公式\n  \\[\n  MTTF = \\frac{1}{K(E_T / I_T - E_c(\\tau) /\
    \ I_T)}\n  \\]\n  得\n  \\[\n  8 = \\frac{1}{K(80 / 48000 - 20 / 48000)}\n  \\\
    ]\n  则\n  \\[\n  K = 100\n  \\]\n- 即，甲还需要再测试出58个错误，才能使MTTF为240h。\n  \\[\n  E_c\
    \ = E_T - \\frac{I_T}{K \\times MTTF}\n  = 80 - \\frac{48000}{100 \\times 240}\
    \ = 78\n  \\]\n\n## 软件工程导论\n\n- 梁文新\n- 办公室：综合楼105\n- 电话：87571625\n- liang@computer.org\n\
    \n## 软件的生命周期\n\n![](img/576b58d2c10334d3487443b8cc7c5551_578_0.png)\n\n## 概述\n\
    \n- 软件产品被开发出来并交付用户使用之后，就进入了软件的运行维护阶段。\n- 软件生命周期的最后一个阶段，其基本任务是保证软件在一个相当长的时期能够正常运行。\n\
    - 维护成本占总成本的40-90%。\n- 目前国外许多软件开发组织把60%以上的人力用于维护已有软件。\n- 软件工程的主要目的就是提高软件的可维护性，减少软件维护所需要的工作量，降低软件系统总成本。\n\
    \n## 第8章 维护(Maintenance)\n\n- 8.1 软件维护的定义\n- 8.2 软件维护的特点\n- 8.3 软件维护过程\n- 8.4\
    \ 软件的可维护性\n- 8.5 预防性维护\n- 8.6 软件再工程过程\n- 8.7 小结\n\n### 8.1 软件维护的定义\n\n- IEEE 1991\
    \ Definition\n  - The process of modifying the software system or component after\
    \ delivery to correct faults, improve performance or other attributes, or adapt\
    \ to a change in the environment\n- 维护分类\n  - 改正性维护(Corrective Maintenance)\n\
    \  - 适应性维护(Adaptive Maintenance)\n  - 完善性维护(Perfective/Evolutive Maintenance)\n\
    \  - 预防性维护(Preventative Maintenance)\n\n#### 改正性维护(Corrective Maintenance)\n\n\
    - 在软件交付使用后，因开发时测试的不彻底、不完全，必然会有部分隐藏的错误遗留到运行阶段。\n- 这些隐藏下来的错误在某些特定的使用环境下就会暴露出来。\n\
    - 为了识别和纠正软件错误、改正软件性能上的缺陷、排除使用中的误操作，应当进行的诊断和改正错误的过程就叫做改正性维护（纠错性维护）。\n\n#### 适应性维护(Adaptive\
    \ Maintenance)\n\n- 在使用过程中，使用环境可能发生变化\n  - 外部环境（新的硬件、软件配置）\n  - 数据环境（数据库、数据格式、数据输入/输出方式、数据存储介质）\n\
    - 为使软件适应这种变化，而去修改软件的过程就叫做适应性维护。\n\n#### 完善性维护(Perfective/Evolutive Maintenance)\n\
    \n- 在软件的使用过程中，用户往往会对软件提出新的功能与性能要求。\n- 为了满足这些要求，需要修改或再开发软件，以扩充软件功能、增强软件性能、改进加工效率、提高软件的可维护性。\n\
    - 这种情况下进行的维护活动叫做完善性维护。\n\n#### 预防性维护(Preventative Maintenance)\n\n- 预防性维护是为了提高软件将来的可维护性、可靠性等，为将来进一步改进软件打下良好基础。\n\
    - 预防性维护定义为：采用先进的软件工程方法对需要维护的软件或软件中的某一部分（重新）进行设计、编制和测试。\n"
  mdcn: "\n## 7.9.2 估算平均无故障时间的方法\n\n根据经验数据，可以作出下述假定：\n\n- 在类似的程序中，单位长度里的错误数 \\(E_T/I_T\\\
    ) 近似为常数。美国的一些统计数字表明，通常\n  \\[\n  0.5 \\times 10^{-2} \\leq E_T / I_T \\leq 2 \\\
    times 10^{-2}\n  \\]\n  也就是说，在测试之前每1000条指令中大约有5～20个错误。\n- 失效率正比于软件中剩余的（潜藏的）错误数，而平均无故障时间MTTF与剩余的错误数成反比。\n\
    \n此外，为了简化讨论，假设发现的每一个错误都立即正确地改正了（调试过程没有引入新的错误）。因此\n\\[\nE_c(\\tau) = E_d(\\tau)\n\
    \\]\n剩余的错误数为\n\\[\nE_r(\\tau) = E_T - E_c(\\tau)\n\\]\n单位长度程序中剩余的错误数为\n\\[\n\\\
    varepsilon_r(\\tau) = E_T / I_T - E_c(\\tau) / I_T\n\\]\n\n### 3. 估算平均无故障时间\n\n\
    经验表明，平均无故障时间与单位长度程序中剩余的错误数成反比，即\n\\[\nMTTF = \\frac{1}{K(E_T / I_T - E_c(\\tau)\
    \ / I_T)}\n\\]\n其中 \\(K\\) 为常数，它的值应该根据经验选取。美国的一些统计数字表明，\\(K\\) 的典型值是200。\n\n-\
    \ 估算平均无故障时间的公式，可以评价软件测试的进展情况。此外，由上式可得\n  \\[\n  E_c = E_T - \\frac{I_T}{K \\times\
    \ MTTF}\n  \\]\n- 因此，也可以根据对软件平均无故障时间的要求，估计需要改正多少个错误之后，测试工作才能结束。\n\n### 4. 估计错误总数的方法\n\
    \n#### A. 植入错误法\n\n- 在测试之前由专人在程序中随机地植入一些错误，测试之后，根据测试小组发现的错误中原有的和植入的两种错误的比例，来估计程序中原有错误的总数\
