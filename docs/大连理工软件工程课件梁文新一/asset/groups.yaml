    - 字典条目组成，每个条目描述DFD中的一个元素\n- 数据字典是所有与系统相关的数据元素的有组织的列表\n- 包含了对这些数据元素的精确、严格的定义，从而使得用户和系统分析员双方对输入、输出、存储的成分甚至中间计算结果有共同的理解\n\
    - 系统的逻辑模型由DFD和数据字典共同构成\n- 相辅相成，缺一不可\n\n## 2.5 数据字典(Data Dictionary)\n\n- 字典条目描述的主要内容\n\
    \  - DFD元素的基本信息：名称、别名、简述、注解等\n  - 定义：数据类型、数据组成等\n  - 使用特点：取值范围、使用频率、激发条件等\n  -\
    \ 控制信息：来源、去向、访问权限等\n  - 分组信息：从属结构、物理位置等\n\n## 数据流条目\n\n- 名称：数据流名（可用中文或英文名）\n-\
    \ 别名：名称的另外一个名字\n- 简述：简要介绍作用即它产生的原因和结果\n- 数据流组成：描述数据流由哪些数据项组成\n- 数据流来源：来自何方(加工或源)\n\
    - 数据流去向：去向何处(加工或宿)\n- 数据量流通量：数据量，流通量\n\n## 文件条目\n\n- 名称：数据文件名\n- 别名：文件名别名\n- 文件编号：该文件在DFD中的编号\n\
    - 简述：对文件的简单说明，如存放的是什么数据\n- 写文件的加工：描述哪些加工写此文件\n- 读文件的加工：描述哪些加工读此文件\n- 文件组织：描述文件的存储方式（顺序、索引），排序的关键字\n\
    - 使用权限：描述各类用户对文件的读、写、修改的使用权限\n- 数据量：文件的最大记录个数\n- 存取频率：描述对该文件的读写频率\n- 注解：其他说明\n\
    \n## 数据项条目\n\n- 名称：数据项名\n- 别名：数据项别名\n- 简述：对数据项的简单描述\n- 数据类型：描述数据项的类型，如整型、实型、字符串型等\n\
    - 计量单位：指明数据项值的计量单位，如厘米、公斤等\n- 取值范围：描述数据项允许的值域，如1-100\n- 与其他数据项的关系：描述该数据项与字典中其他数据项的关系\n\
    - 注解：其他补充说明\n\n## 加工条目\n\n- 名称：加工名\n- 别名：加工别名\n- 加工编号：该加工在DFD中的编号\n- 简述：对加工功能的简述\n\
    - 输入数据流：描述加工的输入数据流，包括读哪些文件\n- 输出数据流：描述加工的输出数据流，包括写哪些文件\n- 加工逻辑：简述加工逻辑，加工顺序或对加工规约的索引\n\
    - 异常处理：描述加工工程中可能出现的异常情况及其处理方式\n- 加工激发条件：描述执行加工的条件，如“身份认证正确”\n- 执行频率：描述加工的执行频率，如每小时执行一次等\n\
    - 注释：其他补充说明\n\n## 源或宿条目\n\n- 名称：源或宿的名称(外部实体名)\n- 别名：源或宿的别名\n- 简述：对源或宿的简要描述，包括指明该外部实体在DFD中是用作“源”还是“宿”，或者两者兼顾\n\
    - 输入数据流：描述源向系统提供哪些输入数据流\n- 输出数据流：描述系统向宿提供哪些输出数据流\n- 注解：其他补充说明\n\n## 2.5 数据字典(Data\
    \ Dictionary)\n\n### 2.5.2 定义数据的方法\n\n- 对数据自上而下的分解\n- 数据元素组成数据的方式\n- 顺序：分量的连接次序\n\
    - 选择：两个或多个元素中选取一个\n- 重复：可指定重复次数\n- 可选：重复0或1次\n\n| 符号 | 含义 | 解释 |\n|---|---|---|\n\
    | `=` | 被定义为 | |\n| `+` | 与 | 例如，x=a+b，表示x由a和b组成。 |\n| `[..., ...]` | 或 | 例如，x=[a,\
    \ b]，x=[a\\|b]，表示x由a或由b组成 |\n| `[...|...]` | 或 | 例如，x={a}，表示x由0个或多个a组成 |\n| `{...}`\
    \ | 重复 | 例如，x=3{a}8，表示x中至少出现3次a，至多出现8次a |\n| `m{...}n` | 重复 | 出现8次a |\n| `(...)`\
    \ | 可选 | 例如，x=(a)，表示a可在x中出现，也可不出现 |\n| `“...”` | 基本元素 | 例如，x=“a”，表示x为取值为a的数据元素\
    \ |\n| `..` | 连结符 | 例如，x=1..9，表示x可取1到9之中的任一值 |\n\n## 示例\n\n发票=单位名称+{商品名+数量+单价+金额}ⁿ+总金额+日期+(营业员)\n\
