  - '[PAGE 591]


    # # 8.2 软件维护的特点


    +   - 用于维护工作的劳动

    +     - 生产性活动（分析评价，修改设计，编写程序代码）

    +     - 非生产性活动（理解程序代码的功能，解释数据结构、接口特点和性能限度等）

    +   - 维护工作量模型：

    +     \( M = p + Ke^{c-d} \)

    +     - M是维护中消耗的总工作量

    +     - p是上面描述的生产性工作量

    +     - K是一个经验常数

