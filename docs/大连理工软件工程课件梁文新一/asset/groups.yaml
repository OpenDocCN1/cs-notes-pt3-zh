  - '[PAGE 22]


    # 1.2.3 软件工程方法学


    +   - 传统方法学也称为生命周期方法学或结构化范型

    +     - 结构化技术（结构化分析、设计和实现）

    +     - 把软件生命周期分成若干个阶段，自顶向下完成软件开发的各阶段任务

    +   - 优点

    +     - 阶段任务相对独立，因而简单且便于分工合作

    +     - 每个阶段结束前都要经过严格审查，因而保证了质量，提高了可维护性

    +   - 缺点

    +     - 不适用于软件规模较大、需求模糊或随时间变化的系统的开发

    +     - 无法将数据与行为（操作）结合起来，从而增加了开发与维护的难度'
  - '[PAGE 23]


    # 1.2.3 软件工程方法学


    +   - **面向对象方法：** 数据和行为同等重要，以数据为主线，把数据和操作紧密结合

    +     - 结构化——静态分析

    +     - 面向对象——动态分析'
  - '[PAGE 24]


    # # 1.2.3 软件工程方法学


    # ## 面向对象方法要点：


    +   - 把对象(Object)作为融合了数据及在数据上的操作行为的统一的软件构件


    +   - 把所有对象都划分成类(Class)。每个类都定义了一组数据和一组操作


    +   - 按照父类(基类)与子类(派生类)的关系，把若干个相关类组成一个层次结构的系统(类等级)


    +   - 在类等级中，下层派生类自动拥有上层基类中定义的数据和操作——继承（Inheritance）


    +   - 对象彼此之间仅能通过发送消息互相联系


    +   - 对象的所有”私有信息”都被封装在该对象内，不能从外接直接访问——封装（Encapsulation）'
  - '[PAGE 25]


    # 1.2.3 软件工程方法学


    +   - 面向对象方法学的出发点和基本原则：

    +     - 只可能模拟人类习惯的思维方式

    +     - 使开发软件的方法与过程尽可能接近人类认识世界解决问题的方法与过程

    +     - 使描述问题的问题空间（问题域）与实现解法的解空间（求解域）在结构上尽可能一致'
  - '[PAGE 26]


    # 1.2.3 软件工程方法学


    +   - 用面向对象方法学开发软件的过程，是一个主动地多次反复迭代的演化过程。面向对象法在概念和表示方法上的一致性，保证了在各项开发活动之间的平滑（无缝）过渡

    +   - 面向对象方法普遍进行的对象分类过程，支持从特殊到一般的归纳思维过程；通过建立类等级而获得的继承性，支持从一般到特殊的演绎思维过程'
  - "[PAGE 27]\n\n# # 1.2.3 软件工程方法学\n\n+   - 最终的软件产品由许多小的基本上独立的对象组成，而且大多数对象都与现实世界中的实体相对应\
    \  \n+     - 降低了软件产品的复杂性  \n+     - 提高了软件产品的可理解性  \n+     - 简化了软件的开发和维护工作\n\n\
    +   - 由于对象是相对独立的实体，容易在以后的软件产品中重复使用，因此，面向对象范型的另一个重要优点是促进了软件重用\n\n+   - 面用对象方法特有的继承性，也进一步提高了面向对象软件的可重用性"
