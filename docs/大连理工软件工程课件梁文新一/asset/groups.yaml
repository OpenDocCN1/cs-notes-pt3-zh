  - '[PAGE 441]


    # Halstead方法的缺点


    # 忽视了嵌套结构（嵌套的循环语句、嵌套IF语句、括号结构等）


    一般地，运算符的嵌套序列，总比具有相同数量的运算符和运算对象的非嵌套序列要复杂得多。解决的办法是对嵌套结果乘上一个嵌套因子


    # 没有注意调用的深度


    Halstead公式应当对调用子程序的不同深度区别对待。在计算嵌套调用的运算符和运算对象时，应乘上一个调用深度因子。这样可以增大嵌套调用时的错误预测率'
