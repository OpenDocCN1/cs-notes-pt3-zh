    # 7.3.2 代码审查


    +   - **优点：** 一次审查可以发现**多个错误**，减少系统验证的**总工作量**

    +   - 人工测试和计算机测试是**互相补充**，相辅相成的，缺少其中任何一种方法都会使查找错误的效率降低'
  - '[PAGE 476]


    # # 7.3.3 计算机测试


    +   - 模块并不是一个独立的程序，因此必须为每个单元测试开发驱动软件(drivers)和(或)存根(stubs)软件


    +   - 通常驱动程序也就是一个“主程序”，它接收测试数据，把这些数据传送给被测试的模块，并且印出有关的结果


    +   - 存根程序代替被测试的模块所调用的模块。因此存根程序也可以称为“虚拟子程序”


    +   - 使用被它代替的模块的接口，可能做最少量的数据操作，得出对入口的检验或操作结果，并且把控制和模拟结果归还给调用它的模块'
  - '[PAGE 477]


    ![](img/576b58d2c10334d3487443b8cc7c5551_477_0.png)'
