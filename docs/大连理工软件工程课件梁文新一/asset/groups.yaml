  mdcn: "\n\n## 3.6 状态转换图(STD)\n\n- 事件是在某个特定时刻发生的事情，它是对引起系统从一个状态转换到另一个状态的外界事件的抽象。简而言之，事件就是引起系统状态转换的控制信息。\n\
