    \ 自顶向下的策略\n\n### 抽象 vs. 求精\n\n抽象与求精是一对互补的概念\n\n- 抽象使得设计者能够说明过程和数据，同时却忽略低层细节\n\
    - 事实上，可以把抽象看作是一种通过忽略多余的细节同时强调有关的细节，而实现逐步求精的方法\n- 求精则帮助设计者在设计过程中揭示出低层细节\n- 这两个概念都有助于设计者在设计演化过程中创造出完整的设计模型\n\
    \n### 5.2.4 信息隐藏和局部化\n\n信息隐藏(Information hiding)原理指出：应该这样设计和确定模块，使得一个模块内包含的信息(过程和数据)对于不需要这些信息的模块来说，是不能访问的\n\
