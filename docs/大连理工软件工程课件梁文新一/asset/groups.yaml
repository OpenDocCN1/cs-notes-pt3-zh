    +     - 各个阶段的执行顺序

    +   - 典型模型

    +     - 瀑布模型(Waterfall Model)

    +     - 增量模型(Incremental Model)

    +     - 快速原型模型(Rapid Prototype Model)

    +     - 螺旋模型(Spiral Model)

    +     - 喷泉模型(Fountain Model)

    +   - 新兴模型

    +     - RUP (Rational Unified Process)

    +     - 敏捷过程与极限编程（Agile Software Process & XP）

    +     - 微软过程（MSF）'
