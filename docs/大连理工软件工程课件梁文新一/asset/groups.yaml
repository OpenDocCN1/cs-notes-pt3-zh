    +       - DB查询及报表生成、界面生成工具

    +     - 可重复的软件构件

    +       - 软件体系构件(程序)、过程构件(模块)、数据结构

    +     - 形式化规格说明和原型环境

    +       - Z语言等（Chap. 4）'
