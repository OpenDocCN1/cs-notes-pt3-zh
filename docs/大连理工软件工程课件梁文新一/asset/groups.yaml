    # # 7.2.4 测试步骤


    大型软件系统的测试过程基本上由下述几个步骤组成


    # ## 1. 模块测试（单元、部件测试）


    +   - 每个模块作为一个单独的实体来测试，目的是保证每个模块作为一个单元能正确运行


    +   - 单元测试大量使用白盒测试技术，检查模块控制结构中的特定路径，以确保做到完全覆盖并发现最大数量的错误


    +   - 发现的往往是编码和详细设计的错误


    # ## 2. 子系统测试（集成/组装/接口测试）


    +   - 把经过单元测试的模块放在一起形成一个子系统来测试


    +   - 着重测试模块间的协调和通信，即模块的接口'
  - '[PAGE 467]


    # 7.2.4 测试步骤


    # 3. 系统测试


    +   - 把经过测试的子系统装配(即集成)在一起形成完整的系统来测试

    +   - 往往发现软件设计中的错误，也可能发现需求说明中的错误

    +   - 不论是子系统测试还是系统测试，都兼有检测和组装两重含义，因此称为集成测试

    +   - 集成测试同时解决程序验证和程序构造这两个问题

    +   - 在集成过程中最常用的是黑盒测试用例设计技术，当然，为了保证覆盖主要的控制路径，也可能使用一定数量的白盒测试'
  - '[PAGE 468]


    # # 7.2.4 测试步骤


    # # 4.验收测试（确认测试）


    +   - 把系统作为单一的实体进行测试，测试内容与系统测试基本类似，但是是在用户积极参与下进行的，而且可能主要使用实际数据


    +   - 发现的往往是系统需求说明书中的错误


    +   - 是对软件满足所有功能的、行为的和性能的需求的最终保证


    +   - 在确认测试过程中仅使用黑盒测试技术'
  - '[PAGE 469]


    # # 7.2.4 测试步骤


    # ## 5.平行运行


    +   - 同时运行新开发出来的系统和被它取代的旧系统，以便比较新旧两个系统的处理结果


    +   - （1）可以在准生产环境中运行新系统而又不冒风险


    +   - （2）用户能有一段熟悉新系统的时间


    +   - （3）可以验证用户指南和使用手册之类的文档


    +   - （4）能够以准生产模式对新系统进行全负荷测试，可以用测试结果验证性能指标'
  - '[PAGE 470]


