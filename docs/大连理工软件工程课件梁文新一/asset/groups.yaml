    \n这种设计方法并不明显地使用软件结构的概念，模块是设计过程的副产品，对于模块独立原理也没有给予应有的重视。\n\n因此，这种方法最适合于在详细设计阶段使用，也就是在完成了软件结构设计之后，可以使用面向数据结构的方法来设计每个模块的处理过程。\n\
    \n## 6.4.1 Jackson图\n\n- 70年代初由英国的M. Jackson提出，在西欧率先流行\n- Jackson方法的目标是获得简单清晰的设计方案\n\
    - Jackson方法的设计原则是：使程序结构同数据结构相对应\n- 虽然程序中实际使用的数据结构种类繁多，但是它们的数据元素彼此间的逻辑关系却只有顺序、选择和重复三类，因此，逻辑数据结构也只有这三类\n\
    \n## 1. 顺序结构\n\n顺序结构的数据由一个或多个数据元素组成，每个元素按确定次序出现一次。\n\n![](img/576b58d2c10334d3487443b8cc7c5551_398_0.png)\n\
    \n对应伪码：\nA seq\nB\nC\nD\nA end\n\n图6.8 A由B、C、D三个元素顺序组成（每个元素只出现一次，出现的次序依次是B、C和D）\n\
    \n## 2. 选择结构\n\n选择结构的数据包含两个或多个数据元素，每次使用这个数据时按一定条件从这些数据元素中选择一个。\n\n对应伪码：\nA select\
    \ cond1\nB\nA or cond2\nC\nA or cond3\nD\nA end\n\n图6.9 根据条件A是B或C或D中的某一个（注意：在B、C和D的右上角有小圆圈做标记）\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_399_0.png)\n\n## 3. 重复结构\n\n重复结构的数据，根据使用时的条件由一个数据元素出现零次或多次构成。\n\
    \n对应伪码：\nA iter until (或while) cond\nB\nA end\n\n图6.10 A由B出现N次(N≥0)组成（注意：在B的右上角有星号标记）\n\
    \n![](img/576b58d2c10334d3487443b8cc7c5551_400_0.png)\n\n## Jackson图的优缺点\n\n###\
    \ 优点\n\n- 便于表示层次结构，而且是对结构进行**自顶而下**分解的有力工具\n- 形象**直观**可读性好\n- 既能表示数据结构也能表示程序结构（因为结构程序设计也只是使用上述3种基本控制结构）\n\
    \n### 缺点\n\n- 表示选择或重复结构时，结束条件不能直接在图中表示出来，影响阅读和翻译成代码\n- 框间连线为斜线，不易在行式打印机上输出\n\n"
