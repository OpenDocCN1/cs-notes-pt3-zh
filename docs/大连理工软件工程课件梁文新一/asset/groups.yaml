  - '[PAGE 149]


    # # Why Requirement Analysis?


    +   - 软件开发最为重要的目的之一就是要开发出**真正满足用户需求的软件产品**

    +   - 为此首先必须准确、清晰、深入地理解和获取用户的真正需求

    +     - 全面准确地掌握软件需求是软件开发工作获得成功的前提和关键

    +     - 不论设计和编码工作做得如何出色，不能满足用户的需求则一切都失去了意义'
  - '[PAGE 150]


    # Why Requirement Analysis?


    +   - 需求分析是软件定义时期的最后一个阶段，它的基本任务是准确地回答“**系统必须做什么？**（What）”


    +   - 需求分析的任务不是确定系统怎样完成它的工作，而仅仅是确定系统必须完成哪些工作

    +     - 即对目标系统提出完整、准确、清晰、具体的要求'
  - '[PAGE 151]


    # # Why Requirement Analysis?


    # ## 用于需求分析的结构化分析方法应遵循的准则


    +   - 必须理解和表示问题的信息域，根据这条准则应该建立数据模型(Data Model)


    +   - 必须定义软件应完成的功能，这条准则要求建立功能模型(Function Model)


    +   - 必须表示作为外部事件结果的软件行为，这条准则要求建立行为模型(Behavior Model)


    +   - 必须对描述信息、功能和行为的模型进行分解，用层次的方式展示细节'
  - '[PAGE 152]


    # 3.1 需求分析的任务


    # 3.1.1 系统的综合要求


    +   1. 功能需求(Functional Requirements)


    +   2. 性能需求(Performance Requirements/Non-functional Requirements)


    +   3. 可靠性和可用性需求(Reliability & Usability)


    +   4. 出错处理需求(Error Processing)


    +   □ 对外部错误如何响应；对系统内部错误如何响应


    +   5. 接口需求(Interface)


    +   □ UI, Hardware/software, Communication, etc.


    +   6. 约束(Constraints)


    +   □ Precision, Tools, Design, Hardware


    +   7. 逆向需求(Reverse Requirements)


    +   □ 说明系统不应该做什么


    +   8. 将来可能提出的要求(Future Requirements)'
