    \  - 设想这些问题如何去解决才能满足要求\n  - 确定的系统规模和目标是否正确，如有错误应及时纠正\n  - 对目标系统的约束和限制必须清楚的列出\n\
    - 导出系统逻辑模型→探索主要解法(实现方案)→研究其可行性\n\n## 2.1 可行性研究的任务\n\n- 主要研究四个方面的可行性\n  - 技术可行性\n\
    \    - 现有技术能否实现目标系统？\n  - 经济可行性\n    - 能否收回投资并获得利润？\n  - 操作可行性\n    - 操作方式是否适用于用户组织？\n\
    \  - 法律、社会效益可行性\n    - 《中华人民共和国著作权法》（1990）\n    - 《计算机软件保护条例》（1991）\n- 预期工程总成本的5%~10%\n\
    \n## 2.2 可行性研究过程\n\n### 1. 复查系统规模和目标\n\n- 通过访问关键人物，仔细阅读和分析相关材料，对问题阶段书写的系统规模和目标进行进一步确认和复查\n\
    - 改正含糊或不确切的叙述\n- 清晰地描述限制和约束\n- 最终确保所要解决的问题是正确无误的\n\n## 2.2 可行性研究过程\n\n### 2. 研究目前正在使用的系统\n\
    \n- 通过访问和调研，阅读相关文档和手册及实地考察等，了解系统能够做什么，为什么这样做，以及使用现有系统的代价\n- 实现现有系统的基本功能和性能要求\n\
    - 发现和解决现有系统的问题\n- 新系统应能给用户带来更多收益（增加收入或降低使用代价）\n- 绘制出高层系统数据流图并请有关人员检验\n- 掌握与其他系统的接口，作为约束条件之一\n\
    \n## 2.2 可行性研究过程\n\n### 3. 导出新系统的高层逻辑模型\n\n- 现有物理系统→现有系统的逻辑模型→设想目标系统逻辑模型→新的物理目标系统\n\
    - 定义目标系统的逻辑模型\n- 高层数据流图\n- 初步的数据字典\n"
  mdcn: "\n## 12条原则\n\n- 我们最优先要做的是通过尽早的、持续的交付有价值的软件来使客户满意\n- 即使到了开发的后期，也欢迎改变需求。敏捷过程利用变化来为客户创造竞争优势\n\
