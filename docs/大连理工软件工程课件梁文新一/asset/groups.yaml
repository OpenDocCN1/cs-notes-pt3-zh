    # # 4.2 有穷状态机 (FSM/FSA)


    # ## 4.2.1 概念


    +   - FSM (Finite-State Machine)/FSA (Finite-State Automaton) is a model of behavior
    composed of a finite number of states, transitions between those states, and actions


    +   - 一个保险箱上装了一个复合锁，锁有3个位置，分别标记为1、2、3，转盘可向左（L）或向右（R）转动


    +   - 这样，任何时刻转盘都有6种可能的运动，即1L、1R、2L、2R、3L、3R


    +   - 保险箱的组合密码是1L、3R、2L，转盘的任何其他运动都将引起报警'
