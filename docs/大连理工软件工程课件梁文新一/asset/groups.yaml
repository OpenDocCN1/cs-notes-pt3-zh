    # # 5.5.2 变换分析


    # ## 设计步骤


    +   1. 复查基本系统模型


    +   2. 复查并精化数据流图


    +   3. 确定数据流图具有变换特性还是事务特性


    +   4. 确定逻辑输入和逻辑输出的边界，从而孤立出变换中心


    +   5. 完成“第一级分解”


    +   6. 完成“第二级分解”


