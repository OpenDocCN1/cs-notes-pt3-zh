    # # 8.1 软件维护的定义


    +   - IEEE 1991 Definition

    +     - The process of modifying the software system or component after delivery
    to correct faults, improve performance or other attributes, or adapt to a change
    in the environment


    +   - 维护分类

    +     - 改正性维护(Corrective Maintenance)

    +     - 适应性维护(Adaptive Maintenance)

    +     - 完善性维护(Perfective/Evolutive Maintenance)

    +     - 预防性维护(Preventative Maintenance)'
  - '[PAGE 582]


    # # 改正性维护(Corrective Maintenance)


    +   - 在软件交付使用后，因开发时测试的不彻底、不完全，必然会有部分隐藏的错误遗留到运行阶段


    +   - 这些隐藏下来的错误在某些特定的使用环境下就会暴露出来


    +   - 为了识别和纠正软件错误、改正软件性能上的缺陷、排除实施中的误使用，应当进行的诊断和改正错误的过程就叫做改正性维护(纠错性维护)'
  - "[PAGE 583]\n\n# # 适应性维护(Adaptive Maintenance)\n\n+   - 在使用过程中，使用环境可能发生变化  \n\
    +     - 外部环境（新的硬、软件配置）  \n+     - 数据环境（数据库、数据格式、数据输入/输出方式、数据存储介质）\n\n+   - 为使软件适应这种变化，而去修改软件的过程就叫做适应性维护"
  - '[PAGE 584]


    # # 完善性维护(Perfective/Evolutive Maintenance)


    +   - 在软件的使用过程中，用户往往会对软件提出新的功能与性能要求


    +   - 为了满足这些要求，需要修改或再开发软件，以扩充软件功能、增强软件性能、改进加工效率、提高软件的可维护性


    +   - 这种情况下进行的维护活动叫做完善性维护'
  - '[PAGE 585]


    # # 预防性维护(Preventative Maintenance)


    +   - 预防性维护是为了提高软件将来的可维护性、可靠性等，为将来进一步改进软件打下良好基础


    +   - 预防性维护定义为：采用先进的软件工程方法对需要维护的软件或软件中的某一部分（重新）进行设计、编制和测试'
