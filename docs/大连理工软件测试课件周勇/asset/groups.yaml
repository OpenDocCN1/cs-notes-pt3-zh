    # 软件产品的组成


    +   - 软件产品的误区：软件产品就是编写出来的代码程序。

    +   - 软件产品是在软件开发生命周期内产生的所有文件和程序，包括交付给客户的和非交付给客户的中间结果

    +   - 所以，软件产品的生成并不仅仅是由程序员开发出来的程序

    +     - 需要在整个生命周期内的全方位投入

    +     - 包括大量看不见的努力'
