    +   - 根据软件与硬件配置的特性联系，编写用例

    +     - 初始化

    +     - 启动软件

    +     - 输入待性项

    +     - 执行步骤

    +     - 输出项与要求

    +     - 软件缺陷判定'
  - '[PAGE 362]


