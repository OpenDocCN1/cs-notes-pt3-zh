    # # 程序复杂性度量与错误之间的关系


    # ## ☆ 代码行度量


    +   - 以源代码的行数--度量程序的复杂性。

    +   - Thayer指出，程序出错率为100行源程序中可能存在0.04-7个错误


    出错率与源程序行数之间不存在简单的线性关系


    Lipow指出，对于小程序，每行代码（执行部分）的出错率为1.3%-1.8%


    对于大程序，每行代码（执行部分）的出错率为2.7%-3.2%


    对于少于100个语句的程序，出错率与源程序行数之间是线性关系的；


    随着程序的增大，出错率以非线性方式增长。'
  - '[PAGE 285]


    # # 程序复杂性度量与错误之间的关系


    # ## 环路复杂性度量-McCabe度量法


    -基于程序控制流的复杂性度量方法


    程序图：把程序流程图中的每个处理符号退化为一个结点，把连接每个处理符号的链转变为连接结点的有向弧，所得到的有向图称为程序图。


    程序图的语义：描述程序内部的控制流程，不表现对数据的具体操作以及分支和循环的具体条件。


    即该方法把简单的条件语句与复杂的循环语句的复杂性视为一样；把嵌套的IF语句与CASE语句的复杂性视为一样。'
