  - '[PAGE 287]


    根据图论，在一个强连通的有向图中，环的个数为：


    $V(G)=m-n+p$


    其中：m为图中的弧数，n为图中的结点数，p为图中强连通分量数


    程序总是连通的，但一般不是强连通的，为此，需加一条从入口到出口的虚线。


    据此，上例中的环数为：13-11+1=3


    即McCabe度量法的度量值为3。


    注：环路复杂度是可加的。


    为软件测试的难度提供了一种定量度量方法。


    McCabe发现，在276个程序中，有23%的子程序的复杂度超过10，

    而在这些子程序中发现的错误占总错误的53%，因此，他建议，如果程序的复杂度超过10，那么就应该对这一程序进行分解。'
