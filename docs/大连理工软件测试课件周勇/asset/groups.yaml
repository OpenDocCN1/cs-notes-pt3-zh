    \n## 谁做什么\n\n## OBS\n\n## WBS\n\n## 责任矩阵\n\n## 谁负责\n\n多少\n\n账目编码\n\n## 分解标准\n\n\
    1. **生存期：**\n   1. 生存期各阶段为二级，每阶段的产品为第三级...\n\n2. **功能组成**\n   1. 产品组成为二级，产品组成的分解为三级，.....\n\
    \n3. 。 。 。 。 。\n\n## WBS的指南（1）\n\n- WBS分解的规模和数量因项目而异\n- 收集与项目相关的所有信息\n- 参看一下类似的项目的WBS，与相关人员讨论\n\
