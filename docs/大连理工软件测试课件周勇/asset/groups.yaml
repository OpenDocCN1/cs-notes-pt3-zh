    # 问题处理


    当测试用例不通过时：


    +   - 对测试工作中的缺陷，记录到问题及变更报告中，并实施相应的变更。这类缺陷如：

    +     - 软件测试说明的缺陷

    +     - 测试数据的缺陷

    +     - 执行测试步骤时的缺陷

    +     - 测试环境中的缺陷

    +   - 对被测软件的缺陷，汇总到软件问题报告中。软件问题报告的格式应规范'
  - '[PAGE 73]


    # 测试执行后


    所有的测试用例都执行完毕后，应根据测试的充分性要求和有关原始记录，确定测试工作是否充分，是否需要进行补充测试：


    +   - 当测试过程正常终止时，如果发现测试工作不足，或测试未达到预期要求时，应进行补充测试。

    +   - 当测试过程异常终止时，应记录导致终止的条件、未完成的测试和未被修正的错误'
