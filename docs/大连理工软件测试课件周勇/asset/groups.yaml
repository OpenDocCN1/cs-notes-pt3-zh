  - "[PAGE 377]\n\n# 急于实现自动化测试\n\n+   新测试工具的费用投入会带来对回报的巨大期望\n\n+   不能理解：\n+   1）初期应用测试工具时，成本反而增加\
    \  \n+   2）自动化测试在后续的版本测试时才能降低成本、提高效率\n\n+   人们总是期望工具能立即降低成本和缩短工作周期"
  md: "\n## 测试应用\n\n- 配置测试\n- 兼容性测试\n\n### 配置测试\n\n- 配置测试：保证测试的软件使用尽可能多样化的硬件组合\n-\
    \ 配置：\n  - 主机\n  - 组件：主板、磁盘驱动器、CD-ROM驱动器、视频卡、声卡、调制解调器、网卡等\n  - 外设：打印机、键盘、鼠标、显示器、扫描仪、游戏杆、数码设备、U盘等\n\
    \  - 接口：内部或者外部的适配器接口，ISA、PCI、USB、PS/2、RS232等\n  - 内存：主机内存、组件内存\n  - 设备驱动程序：用来完成组件外设与操作系统和应用软件的通信\n\
    \n### 配置测试考虑什么？\n\n- 配置与软件的关系\n- 例如：\n  - 游戏软件：考虑视频和声音部分\n  - 通信软件：考虑调制解调器和网络配置\n\
    \  - 绘图软件：考虑显卡和显存、打印\n  - 嵌入式软件：考虑接口\n\n![](img/5fda969404f5a602484516ab14b14f48_352_0.png)\n\
    \n### 分离配置缺陷\n\n- 确定缺陷是配置缺陷还是普通缺陷\n- 方法：\n  - 在另一台有完全不同配置的计算机上执行导致问题的相同操作。\n \
    \ - 如果缺陷没有产生，就可能是配置问题；如果缺陷在多种配置中出现，就可能只有普通缺陷\n- 配置缺陷可能产生的情况\n  - 在多种配置中出现的缺陷\n\
    \  - 可能在某种特定配置中出现的缺陷\n  - 硬件设备或驱动程序中可能出现的由软件揭示的缺陷\n  - 硬件设备或驱动程序中可能出现的由许多其他软件揭示的缺陷\n\
    \n### 计算工作量\n\n- 配置测试工作量一般都比较大\n- 比如：\n  - 测试软件所使用的各种主要配置组件\n  - 测试软件使用的每一种组件的型号和驱动\n\
    - 原则\n  - 采用等价分配\n  - 测试目前主流的\n  - 约定测试配置的限度\n\n![](img/5fda969404f5a602484516ab14b14f48_354_0.png)\n\
    \n### 配置测试设计\n\n![](img/5fda969404f5a602484516ab14b14f48_355_0.png)\n\n1. 确定所需的硬件类型\n\
    \   - 比如\n     - 声音\n     - 图像\n     - 打印\n     - 远程访问\n\n2. 确定硬件商标、型号和驱动程序\n\
    \   - 正在流行的型号\n   - 可用的硬件\n   - 使用地域\n   - 需要支持的历史型号\n   - 划分等价区间\n   - 确定需要测试的驱动程序\n\
    \     - 可以是操作系统支持的，可以是硬件所带的，可以是网络下载的。\n\n3. 确定可能的硬件特性、模式和选项\n   - 每一种设备的选项：\n\
    \     - 最小\n     - 中间\n     - 优化\n     - 最大\n   - 选定软件需要支持的特性选项\n     - 没有必要支持全部特性\n\
    \     - 比如显卡的色彩数和分辨率\n     - 比如MODEM的波特率\n\n4. 将明确后的硬件缩减为可控制的范围\n   - 软件测试人员与开发人员共同识别\n\
    \   - 根据配置硬件的列表，选取可用的和最有价值的项目进行测试\n\n5. 明确使用硬件的软件唯一特性\n   - 确定软件中的唯一特性\n     -\
    \ 不应该也不必要在每一种配置中完全测试软件\n     - 测试那些与硬件交互方式不相同的特性\n\n![](img/5fda969404f5a602484516ab14b14f48_360_0.png)\n\
    \n6. 设计在每一种配置中执行的测试用例\n   - 选取测试的配置\n   - 根据软件与硬件配置的特性联系，编写用例\n     - 初始化\n  \
    \   - 启动软件\n     - 输入特性项\n     - 执行步骤\n     - 输出项与要求\n     - 软件缺陷判定\n\n7. 在每种配置中执行测试\n\
    \n8. 反复测试直到满意为止\n   - 有计划地从少到多测试\n   - 逐渐缩小范围，确保软件缺陷被修复\n   - 最终达到没有软件的配置缺陷\n\n\
    ### 兼容性测试\n\n检查软件之间是否正确地交互和共享信息\n\n### 举例\n\n- 从WEB页面剪贴文字，在字处理程序打开的文档中粘贴\n- 在电子表格程序保存账目数据，在另一个完全不同的电子表格程序中读入\n\
    - 使照片修饰软件在同一操作系统下的不同版本正常工作\n- 升级到新的数据库程序，读入现存所有数据库，像老程序一样对其进行处理\n\n### 兼容性测试要考虑的问题\n\
    \n- 软件设计要求与何种其他平台（操作系统、WEB浏览器或者操作系统）和应用软件保持兼容？如果要测试的软件是一个平台，那么设计要求其如何让应用程序在其上运行？\n\
    - 应该遵守何种定义软件之间交互的标准或者规范？\n- 软件使用何种数据与其他平台和软件交互和共享信息？\n\n![](img/5fda969404f5a602484516ab14b14f48_365_0.png)\n\
    \n### 平台和应用程序版本\n\n- 软件设计用于某个操作系统、WEB浏览器等，同时还要明确需要兼容的版本\n- 比如：\n  - 适用于IE5.0以上版本和Netscape4.0以上版本\n\
    \  - 可以应用于WIN9X/WINNT/WIN2000/WIN XP\n  - 使用Tomcat 3.0/3.2/4.0\n\n### 测试选择\n\n\
    - 向前和向后兼容：使用软件的版本\n- 测试多个版本：\n  1. 平台的修改带来软件的兼容性\n  2. 软件在平台不同版本的兼容性\n\n### 实际测试\n\
    \n**选择适用于软件或者平台的标准和规范**\n\n- 总体标准和规范：应用程序应该遵守兼容平台的标准和规范\n  - 比如MS\n  - 支持鼠标\n\
    \  - 支持在C:和D:以外的磁盘上安装\n  - 支持长文件名\n  - 不读写或以其他形式使用旧系统文件 win.ini、system.ini、autoexec.bat、config.sys\n\
    - 详细标准和规范\n  - 比如\n  - 文件格式符合标准格式，例如UEDIT打开各种格式文件\n  - 图形标准得到遵守\n  - 通信协议、编程语言语法和用于共享信息的任何形式要符合公开的标准和规范\n\
    - 例：AutoCAD2000中规定可以导出 *.wmf、*.3ds、*.bmp、*.dwg 文件格式，需要根据这些标准测试软件是否符合\n\n### 小结\n\
    \n- 学习了\n  - 配置测试\n  - 兼容性测试\n\n## 软件测试自动化\n\n![](img/5fda969404f5a602484516ab14b14f48_372_0.png)\n\
    \n### 议题\n\n- 自动测试的误区\n- 自动测试的设计\n- 自动测试脚本开发\n- 自动测试工具简介\n\n### 测试自动化的简介\n\n所谓自动测试，实际上是将大量的重复性工作交给计算机去完成，节约大量的人力、物力、资金、时间等资源，并且测试脚本可以重复利用（可以是不同的项目）。\n\
    \n自动测试\n\n= 一劳永逸？\n\n= 立竿见影？\n\n### 不规范的自动化测试过程中存在的风险\n\n![](img/5fda969404f5a602484516ab14b14f48_375_0.png)\n\
    \n### 测试自动化的误区\n\n**希望用自动化测试完全取代手工测试**\n\n- 努力将所有的测试用例都自动化\n- 导致某些花大力气完成的自动测试脚本只执行了少数几次、甚至一次就不再需要了\n\
    - 在制作自动测试脚本上耗费了巨大的工作量，而忽略了测试本身的目的\n\n**急于实现自动化测试**\n\n- 新测试工具的费用投入会带来对回报的巨大期望\n\
    - 不能理解：\n  1. 初期应用测试工具时，成本反而增加\n  2. 自动化测试在后续的版本测试时才能降低成本、提高效率\n- 人们总是期望工具能立即降低成本和缩短工作周期\n"
