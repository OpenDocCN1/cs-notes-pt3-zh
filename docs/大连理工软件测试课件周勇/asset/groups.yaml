    # 兼容性测试


    检查软件之间是否正确地交互和共享信息


    # 举例


    +   - 从WEB页面剪贴文字，在字处理程序打开的文档中粘贴

    +   - 在电子表格程序保存帐目数据，在另一个完全不同的电子表格程序中读入

    +   - 使照片修饰软件在同一操作系统下的不同版本正常工作

    +   - 升级到新的数据库程序，读入现存所有数据库，像老程序一样对其进行处理'
