    # 软件开发的模式——螺旋模式


    ➢ 螺旋模型也是瀑布模型的一种变化模型，其中的每个回旋代表一个特定开发阶段。它区别于瀑布式的不同点是，它在每个主要阶段结合了风险分析和原型。


    ![](img/5fda969404f5a602484516ab14b14f48_7_0.png)'
  - '[PAGE 8]


    # 软件开发的模式——迭代式


    +   - 多次执行各个开发工作流程，从而更好地理解需求、设计出强壮的构架、组建好开发组织并最终交付一系列渐趋完善的实施成果。

    +   - 每次按顺序完成这一系列工作流程就叫做一次迭代。


