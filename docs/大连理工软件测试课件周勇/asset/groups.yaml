    \n## 强一般等价类测试\n\n- 多缺陷假设  \n- 需要等价类笛卡儿积的每个元素对应的测试用例  \n- 确保完备性  \n  - 覆盖所有的等价类\
    \  \n  - 有可能的输入组合中的一个  \n\n![](img/5fda969404f5a602484516ab14b14f48_195_0.png)\n\
    \n## 弱健壮等价类测试\n\n- 单缺陷假设，弱  \n- 考虑的无效值，健壮  \n\n1. 对于有效输入，使用每个有效类的一个值，所有输入都是有效的\
    \  \n2. 对于无效输入，测试用例将拥有一个无效值，并保持其余的值是有效的  \n\n![](img/5fda969404f5a602484516ab14b14f48_196_0.png)\n\
    \n## 强健壮等价类测试\n\n- 多缺陷假设，强  \n- 考虑的无效值，健壮  \n\n- 从所有等价类笛卡儿积的每个元素中获得测试用例  \n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_197_0.png)\n\n## 等价类测试用例举例-三角形\n\n###\
    \ 等价类\n\n- R1={<a,b,c>:有三条边a，b和c的等边三角形}  \n- R2={<a,b,c>:有三条边a，b和c的等腰三角形}  \n\
    - R3={<a,b,c>:有三条边a，b和c的不等边三角形}  \n- R4={<a,b,c>:三条边a，b和c不构成三角形}  \n\n### 弱一般等价类测试用例\n\
    \n| 测试用例 | a | b | c | 预期输出 |\n|---|---|---|---|---|\n| Wn1 | 5 | 5 | 5 | 等边 |\n\
    | Wn2 | 2 | 2 | 3 | 等腰 |\n| Wn3 | 3 | 4 | 5 | 不等边 |\n| Wn4 | 4 | 1 | 2 | 非三角形\
    \ |\n\n### 弱健壮等价类增加的测试用例\n\n| 测试用例 | a | b | c | 预期输出 |\n|---|---:|---:|---:|---|\n\
    | WR1 | -1 | 5 | 5 | a非法 |\n| WR2 | 5 | -1 | 5 | b非法 |\n| WR3 | 5 | 5 | -1 | c非法\
    \ |\n| WR4 | 201 | 5 | 5 | a非法 |\n| WR5 | 5 | 201 | 5 | b非法 |\n| WR6 | 5 | 5 |\
    \ 201 | c非法 |\n\n### 强健壮等价类增加的测试用例（部分）\n\n| 测试用例 | a | b | c | 预期输出 |\n|---|---:|---:|---:|---|\n\
    | SR1 | -1 | 5 | 5 | a非法 |\n| SR2 | 5 | -1 | 5 | b非法 |\n| SR3 | 5 | 5 | -1 | c非法\
    \ |\n| SR4 | -1 | -1 | 5 | a,b非法 |\n| SR5 | 5 | -1 | -1 | b,c非法 |\n| SR6 | -1\
    \ | 5 | -1 | a,c非法 |\n| SR7 | -1 | -1 | -1 | a,b,c非法 |\n\n## 等价类测试用例设计的步骤\n\n\
    - 分析需求描述  \n- 划分测试功能的粒度  \n- 确定每个测试功能的输入和输出  \n- 对输入/输出划分等价类  \n- 选择等价类的方法，计算测试用例数量\
    \  \n- 设计测试用例  \n\n## 等价类测试总结\n\n- 等价类测试的弱形式不如强形式的测试全面  \n- 如果错误条件非常重要，有必要进行健壮形式的测试\
    \  \n- 如果输入数据以离散值区间和集合定义，则等价类测试是合适的  \n- 通过结合边界值测试，等价类测试可以得到加强  \n- 如果函数很复杂，需要做等价类测试\
    \  \n- 强等价类测试假设变量是独立的，相应的测试用例相乘会引起冗余问题。如果存在依赖关系，则常常会生成错误的测试用例  \n- 在确定合适的等价关系之前，可能需要进行多次尝试\
    \  \n- 强和弱形式的等价类测试之间的差别，有助于区分累进测试和回归测试  \n\n## 等价类划分练习\n\n这是一个航空行李托运费的算法，具体如下：\n\
    \n按规定：重量不超过30公斤的行李可免费托运；重量超过30公斤时，对超运部分，头等舱国内乘客收4元/公斤；其他舱位国内乘客收6元/公斤；外国乘客收费为国内乘客的2倍；残疾乘客的收费为正常乘客的1/2。\n\
    \n## 基于UML的系统测试\n\n![](img/5fda969404f5a602484516ab14b14f48_205_0.png)\n\n## 议题\n\
    \n- 基于UML的需求描述：用例图和用例规约  \n- 使用用例图和用例规约设计系统测试用例  \n\n## 软件需求描述\n\n- 用例图（use case\
    \ diagram），描述系统外部的执行者(Actor)与系统提供用例(Use Case)之间的关系。  \n- 用于描述系统的需求  \n- 用例规约和补充规约\
    \  \n\n## 用例图\n\n- （use case diagram），描述系统外部的执行者(Actor)与系统提供用例(Use Case)之间的关系。\
    \  \n- 用于描述系统的需求  \n\n![](img/5fda969404f5a602484516ab14b14f48_208_0.png)\n\n\
    ## 用例和参与者\n\n- 用例：（Use Case）表示从用户角度对系统的要求，因此表示系统功能  \n- 参与者：（Actor）是系统的主体，表示提供或接收系统信息的人或系统\
    \  \n\n![](img/5fda969404f5a602484516ab14b14f48_209_0.png)\n\n## 用例规约\n\n- 课程注册用例规约\
    \  \n\n## 基于用例设计系统测试用例的步骤\n\n- 分析UML面向对象生成的需求——用例和用例规约  \n- 分析并绘制出用例规约的事件流图，包括基本流和被选流\
    \  \n- 根据系统功能要求，使用基本流和被选流形成若干个需要测试的用例场景  \n- 分析确定每个测试用例场景的输入参数及其有效性  \n- 设计出每个用例场景的测试用例\
    \  \n- 用数据表格的形式或者动作-响应序列的形式书写用例  \n\n## 测试用例详细说明\n\n- ATM机的用例测试  \n\n## 练习和实验\n\
    \n- 工资支付方式选择用例的测试  \n\n## 集成测试\n\n## 集成测试方法与原理\n\n1、非渐增式测试（Big-bang testing）\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_217_0.png)\n\n## 集成测试\n\n2、Incremental\
    \ testing 的几种策略\n\n(1) Top-down testing\n\n第1步：测试顶端模块，用存根程序（stub）代替直接附属的下层模块\n\
    \nstub: to simulate the activity of the component which is not yet tested.\n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_218_0.png)\n\n"
