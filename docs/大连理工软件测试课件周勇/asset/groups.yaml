    \n软件测试的V模型\n\n## 软件测试技术\n\n不实际运行程序，而是通过检查和阅读等手段来发现错误并评估代码质量的软件测试技术。也称为静态分析技术。\n\
    \n实际运行程序，并通过观察程序运行的实际结果来发现错误的软件测试技术。\n\n### 静态测试\n\n### 动态测试\n\n- 黑盒\n- 白盒\n\n\
    - 黑盒\n- 白盒\n\n- 技术评审\n- 代码审查\n\n- 功能测试\n- 性能测试\n- 非功能测试\n\n- 语句覆盖\n- 判定覆盖\n- 条件覆盖\n\
    - 路径覆盖\n\n## 黑/白盒技术\n\n- 黑盒：在不知道程序内部结构，只知道程序规格的情况下采用的测试技术或策略。\n- 白盒：在知道程序内部结构的情况下采用的测试技术或策略。\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_130_0.png)\n\n## 测试层次阶段1：单元测试\n\n-\
    \ 单元测试：Unit Testing\n  - 目标：\n    - 检验程序最小单元有无错误\n      - 接口、数据结构、边界、覆盖、逻辑\n \
    \   - 检验单元编码与设计是否吻合\n  - 时机：\n    - 编码完成后，首先要实施的测试\n  - 方法：\n    - 静态测试\n    -\
    \ 白盒测试\n  - 责任：\n    - 开发工程师\n\n## 测试层次阶段2：集成测试\n\n- 集成测试：Integration Testing\n\
    \  - 目标：\n    - 检验组成系统的模块接口有无错误\n    - 模块的数据流是否正确\n    - 代码实现的系统设计与需求定义是否吻合\n\
    \  - 时机：\n    - 主要的单元测试完成后\n  - 方法：\n    - 黑盒测试\n  - 责任：\n    - 测试工程师\n\n## 测试层次阶段4：验收测试\n\
