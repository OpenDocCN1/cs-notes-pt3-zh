  - "[PAGE 190]\n\n# # 决策表测试总结\n\n+   - 决策表技术适用于以下特征的应用程序  \n+     - IF-THEN-ELSE逻辑突出\
    \  \n+     - 输入变量之间存在逻辑关系  \n+     - 涉及输出变量子集的计算  \n+     - 输入与输出之间存在因果关系\n\n\
    +   - 决策表不能很好地伸缩，需要使用扩展条目决策表、代数简化表，将大表分解成小表\n\n+   - 可以使用迭代技术，逐渐改进，直到得到满意的决策表"
