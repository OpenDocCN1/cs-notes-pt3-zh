    \n## 小结\n\n- 学习了\n  - 测试过程的计划\n  - 完成一个计划的内容\n\n## 软件测试的报告和分析\n\n![](img/5fda969404f5a602484516ab14b14f48_111_0.png)\n\
    \n## 议题\n\n- 使软件缺陷得以修复\n- 分离和再现软件缺陷\n- 对软件缺陷分等级\n- 软件缺陷的生命周期\n- 软件缺陷的跟踪\n- 测试的评价和分析\n\
    \n## 使软件缺陷得以修复\n\n- 软件缺陷可能不能修复\n  - 没有足够的时间\n  - 不算真正的软件缺陷\n  - 修复的风险太大\n  - 不值得修复\n\
    - 审查软件缺陷，判定是否可以修复\n- 判定依据是软件测试的缺陷报告\n\n## 分离和再现软件缺陷\n\n- 不要想当然地接受任何假设\n- 查找时间依赖和竞争条件的问题\n\
    - 与压力和负荷相关的边界条件软件缺陷、内存泄露和数据溢出等问题也许慢慢自己显现出来\n- 状态缺陷仅在特定软件状态中显露出来\n- 考虑资源依赖性和内存、网络、硬件共享的相互作用\n\
    - 不要忽视硬件\n\n## 软件缺陷分等级\n\n- 软件缺陷分出严重性和优先级\n  - 严重性表示软件缺陷的恶劣程度，反映其对产品和用户的影响\n \
    \ - 优先级表示修复缺陷的重要程度和应该何时修复\n\n| 等级 | 严重性 | 优先级 |\n|---|---|---|\n| 1 | 系统崩溃、数据丢失、数据毁坏\
    \ | 立即修复，阻止进一步测试 |\n| 2 | 操作性错误、错误结果、遗漏功能 | 在产品发布之前必须修复 |\n| 3 | 小问题、错别字、UI布局\
    \ | 如果时间允许应该修复 |\n| 4 | 建议 | 可能会修复，也可能会发布 |\n\n## 软件缺陷的生命周期\n\n![](img/5fda969404f5a602484516ab14b14f48_117_0.png)\n\
