    \n测试开发员  \n细化测试用例、开发自动测试脚本或驱动程序\n\n测试员  \n负责执行测试,记录测试结果\n\n环境支持组  \n部署被测系统、准备基础数据\n\
    \n- 确定资源\n  - 人力资源（人员数量和技能）\n  - 测试环境（包括硬件和软件）\n  - 工具\n  - 数据\n\n## 7. 确定进度,创建时间表\n\
    \n测试项目时间表可以通过工作估计和资源分配来建立。  \n将整个测试项目划分为多个阶段（测试需求分析、测试设计、脚本开发、测试环境准备、测试执行、结果分析）。\
    \  \n资源应该包括人力资源、被测环境资源、测试环境资源。\n\n| 入口条件 | 输入 | 工作 | 输出 | 出口条件 |\n|---|---|---|---|---|\n\
    | WBS和工作量和成本完成 | 1. 软件成本工作量<br>2. WBS<br>3. 进度的历史数据<br>4. 可分配资源的数量 | - 最开始是估计每个活动的时间段，对大多数活动来说，应当用估计的工作量除于用于该活动的资源的比率来计算时间段。<br>-\
    \ 下一步是确定活动之间的所有关系，可以通过画一个网络图表达。<br>- 将所有的可用资源分类，在计划能画出之前，必须考虑所需资源是否可用。<br>&nbsp;&nbsp;&nbsp;&nbsp;•\
    \ 统计每个阶段（如：周）所需资源总和<br>&nbsp;&nbsp;&nbsp;&nbsp;• 决定一个能获得的员工计划<br>&nbsp;&nbsp;&nbsp;&nbsp;•\
    \ 调整活动起始日期，使资源需求在任何时间段不超过有效范围<br>- 开发计划的最后一步是画一个Gantt图表，表示每个活动的起始和结束日期<br>- 将进度表的结果记录到测试计划中\
    \ | 1. 确定进度 | 1. 估计的过程和结果记录到测试计划文件中<br>2. 测试计划更新 |\n\n- 样例\n\n## 8. 生成测试计划\n\n\
    - 制定测试计划活动的最后步骤是生成测试计划。它通过集中收集到的所有测试信息来完成，并生成一份报告。\n- 使用测试计划模板，如果没有设计一个\n- [测试计划模板](测试计划模板)\n\
    - [测试计划的样例](测试计划的样例)\n"
