    \  - 显示的边界和有离散的边界，容易确定边界\n  - 没有显示地给出边界的，需要人为地创建边界\n- 多个独立的变量（变量之间没有依赖），受物理量（温度、压力等）的限制，比较适合边界值分析\n\
    \n## 健壮性测试\n\n- 增加极限值\n  - $\\infty$Max+, min-\n- 一个变量取极值，其他所有变量去正常值\n- 主要是观察例外处理情况，即输出结果\n\
    \nX1nom:\nX2min-, x2min, x2min+,\nx2nom,\nx2max-, x2max, x2max+\n\nX2nom:\nX1min-,\
