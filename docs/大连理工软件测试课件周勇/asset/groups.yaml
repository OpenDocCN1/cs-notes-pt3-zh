    - 逻辑覆盖测试方法：\n\n![](img/5fda969404f5a602484516ab14b14f48_268_0.png)\n\n## 单元测试流程\n\
    \n◆ 管理流程\n　主要指动态测试应用实施流程。\n\n![](img/5fda969404f5a602484516ab14b14f48_269_0.png)\n\
    \n针对测试目标，规定测试任务、资源分配、人员角色、进度安排等。\n\n根据测试计划，设计测试用例，包括：测试步骤、测试场景、测试代码、测试数据（包括预期结果）。\n\
    \n根据测试计划，配置测试环境，并手动或者自动执行测试设计。\n\n记录、分发、评估、关闭缺陷报告。\n\n分析测试过程和缺陷报告，评估测试质量和测试效果，给出是否通过测试的建议。\n\
    \n根据测试计划，忠实地记录测试执行的过程和结果。\n\n分析测试记录，如果发现与预期结果不同，确定并重现缺陷。\n\n检查测试设计是否全部执行完毕，缺陷是否全部关闭。\n\
    \n## DD_PATH测试\n\n- 在测试过程中，选择足够的测试用例，使得程序中的每一条可能执行的路径都至少执行一次\n- 参看例子\n\n## 动态白盒测试\n\
    \n## 测试方案技术—白盒测试\n\n# 2. 白盒法\n\n- ✓ 白盒法需要了解程序的功能与结构，测试用例必须根据程序内部的逻辑来设计。如果想用白盒法发现程序中的所有错误，则至少必须使程序中每种可能的路径都执行一次。\n\
    \n- ✓ “彻底地测试”是不可能的，故策略是：在一定的研制时间、研制经费的限制下，通过执行有限的测试用例，尽可能多地发现一些错误。\n\n- ✓ 白盒法又称为逻辑覆盖法，目前常用的覆盖法有：\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_272_0.png)\n\n## 测试方案技术—白盒测试\n\n###\
    \ (1)语句覆盖\n✓即每个语句至少能执行一次\n\n**Test case :**\n**A=2 , B=0 , X=4.**\n\n问题：若AND错写为OR，或X>1错写为X<1，则错误无法由上例测出。\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_273_0.png)\n\n## 测试方案技术—白盒测试\n\n# ##\
    \ (2)判定覆盖\n\n✔判定覆盖又叫分支覆盖，含义是：每个判定的分支至少执行一次。\n\nTest cases:\n\n①A=3，B=0，X=3\n\n\
    ②A=2，B=1，X=1\n\n问题：若X>1错写为X<1,仍然无法被测出。\n\n![](img/5fda969404f5a602484516ab14b14f48_274_0.png)\n\
    \n## 测试方案技术—白盒测试\n\n# ## (3)条件覆盖\n\n✓即一个判断语句中往往包含了若干条件。通过给出测试用例，使判断中的每个条件都获得各种可能的结果。\n\
    \nTest cases:\n①A=2 , B=0 , X=4\n（满足A>1, B=0; A=2, X>1）\n②A=1, B=1, X=1\n（满足A≤1,\
    \ B≠0; A≠2, X≤1）\n\n问：条件覆盖？—判定覆盖\n答：不一定。\n反例：①A=2, B=0, X=1\n②A=1, B=1, X=2\n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_275_0.png)\n\n## 测试方案技术—白盒测试\n\n# ##\
    \ (5)条件组合覆盖\n\n✓使得每个判断中条件的各种可能组合都至少出现一次。\n\n全部可能的条件组合为：\n\n① A>1, B=0  ② A>1,\
    \ B≠ 0  \n③ A≤1, B=0  ④ A≤1, B≠ 0  \n⑤ A=2, X>1  ⑥ A=2, X≤ 1  \n⑦ A ≠ 2, X>1 \
    \ ⑧ A ≠ 2,X≤ 1\n\nTest cases：\n\n① A=2, B=0, X=4 ( T T)  \n② A=2. B=1, X=1 ( F\
    \ T)  \n③ A=1, B=0, X=2 ( F T)  \n④ A=1, B=1, X=1 ( F F)\n\n问题：没有测试到（TF）的情形\n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_277_0.png)\n\n## 测试方案技术—白盒测试-路径覆盖\n\n\
    控制流程图：结点/分支/过程块/链\n\n# 路径\n\n![](img/5fda969404f5a602484516ab14b14f48_278_0.png)\n\
    \n其中：节点1、节点3、节点5、节点6、节点7为过程块\n\n节点2为分支，节点4为结点\n\n"
