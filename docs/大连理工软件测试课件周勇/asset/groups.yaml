    \n### 软件问题的原因\n\n是软件缺陷的积累和放大效应\n\n- 失之毫厘，谬以千里\n- 成本急剧增加，质量大幅下降\n- 开发过程的混乱，效率很低\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_21_0.png)\n\n### 软件缺陷案例\n\n- 千年虫　70年代的鼠目寸光\n\
