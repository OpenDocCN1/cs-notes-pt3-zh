  md: "\n\n## 响应时间的分解\n\n响应时间 = 网络响应时间 + 应用程序响应时间\n\n### 网络响应时间\n\n网络响应时间指的是数据从一个服务器到另一个服务器在网络上传输所需花费的时间。\n\
    \n### 应用程序响应时间\n\n应用程序响应时间指的是服务器处理数据所需花费的时间。\n\n## 2. 吞吐量\n\n◆ 定义\n\n吞吐量指的是单位时间内处理的客户端请求数量。\n\
    \n通常情况下，吞吐量用请求数/秒或页面数/秒来衡量。\n\n从业务角度看，吞吐量也可以用访问人数/天或页面访问量/天来衡量。\n\n### 吞吐量 vs\
    \ 负载\n\n## 3. 资源利用率\n\n+ 定义\n\n资源利用率指的是对不同系统资源的使用程度，例如服务器的CPU，内存，网络带宽等。\n\n资源利用率通常以占用最大值的百分比来衡量。\n\
    \n### 资源利用率 vs 负载\n\n+ 当某个资源利用率随着负载的增加最终在100%居高不下时，就可能意味着这个资源变成了系统的性能瓶颈所在。\n\n\
    提高这个资源的量，将会提高系统的吞吐量，同时降低交易的响应时间，即改进了系统的性能。\n\n◆ 当你要衡量或者测试的某个资源总是无法达到100%的利用时，很有可能这时其他的某个或者某些资源已经达到了最大的使用率。它们已经变成了系统的性能瓶颈。\n\
    \n+ 现象：响应时间骤增到45秒，但是CPU的利用率只达到60%。\n+ 说明：如果在测试中单独的观察CPU或者是内存的利用率，对于分析定位性能瓶颈是没有什么帮助的。\n\
    \n### 应用程序\n\n+ 绝大部分的传统应用程序是针对单个用户的，而现在的 Web 应用程序都是被设计来能够支持大量的并发用户。\n+ 性能测试已经成为部署\
    \ Web 应用程序及其他类似程序的不可或缺的步骤。\n\n### 性能测试的应用领域\n\n+ 能力规划\n+ 性能调优\n+ 缺陷修复\n\n### 能力规划\n\
    \n#### 几个问题\n\n+ 在要求平均响应时间小于5秒的前提下，你如何判断系统是否能够支持200万用户/天的访问量？\n+ 如果你的公司计划在将来的两个月内把业务量提高200%，你如何判断公司的Web应用系统是否需要升级服务器的配置或者是增加服务器的数量？\n\
    + 你的网站系统在每个月的纳税期高峰日中，能够承受往常6倍的访问量吗？\n\n#### 方法一：负载测试\n\n使用测试环境模拟不同程度的负载，收集系统在不同程度负载下的表现情况，依此来了解系统的能力（不同负载级别时的响应时间、吞吐量和资源利用率）。\n\
    \n#### 方法二：配置测试\n\n在不同硬件配置的情况下对系统进行负载测试。例如CPU数量为1，2，4，6。\n\n### 性能调优\n\n#### 问题\n\
    \n- 当系统的用户访问量在不断的快速增加时，运营小组该怎么办？\n\n#### 解决方法\n\n+ 升级服务器的硬件，换成更快、更大的机器。\n+ 增加服务器的数量。\n\
    + 还有一种方法：\n  - 对系统和应用程序进行仔细的调优，以提高响应时间、吞吐量和资源利用率的性能指标。\n\n#### 1秒的影响\n\n对于单个用户的响应时间，1秒的差距可能不显著，甚至被忽视。但是对于一个不间断的被成百上千用户同时访问的服务器来说，每个用户的响应时间都缩短1秒将是非常巨大的区别。\n\
    \n#### 调优的对象\n\n+ 应用程序\n+ 系统平台设置\n+ Web服务器设置\n\n#### 调优的方法\n\n+ 每次改变一个系统参数或者一个应用逻辑\n\
    + 使用固定的负载\n+ 测试另一个设置之前收集本次性能测试的数据。\n+ 重复测试过程，直到应用程序的性能达到了期望的状态。\n\n### 缺陷修复\n\n\
    #### 问题\n\n+ 某些缺陷只有在高负载的情况下才能暴露出来。\n  例如：内存泄露\n\n### 典型测试方法详解\n\n+ 负载/压力测试\n+\
    \ 能力测试\n+ 事务资源消耗分析测试\n\n### 负载/压力测试\n\n+ 负载测试有时也称为压力测试\n+ 负载测试的目的是在不同用户压力下检查相应的响应时间、吞吐量、资源利用和其他的指标\n\
    + 需要模拟真实的用户行为\n  - 服务器日志文件\n  - 现有的Web站点\n  - 类似业务的市场信息\n\n#### 步骤\n\n+ 第一步\n\
    \  - 根据用户活动类型定义测试脚本\n  - 定义每个测试脚本所占百分比\n  - 定义 Think Time\n  - 例如：\n\n| 活动 | 百分比\
    \ | Think Time |\n|---|---:|---:|\n| 关键字检索 | 11% | 0s |\n| 分类浏览 | 59% | 1s |\n\
    | 访问首页 | 30% | 5s |\n\n+ 第二步\n  - 使用测试工具执行测试\n  - 根据应用程序性能和系统配置情况确定虚拟用户数序列\n \
    \   `{50, 100, 200, 300, 500, 1000...}`\n  - 预先做短时间测试，估计序列的合适范围\n\n+ 第三步\n  -\
    \ 收集测试数据\n  - 制作分析图形\n    1. 响应时间 vs 负载\n    2. 吞吐量 vs 负载\n    3. 资源利用率 vs 负载\n\
    \  - 理解性能状况\n\n### 能力测试\n\n+ 目的是确定扩展系统能力以处理更多并发用户的最佳策略\n+ 方式是在不同系统配置下进行一系列的负载测试\n\
    + 每次改变一个系统配置，而保持其他的配置不变\n\n#### 举例\n\n+ 例子：CPU能力测试\n  - 避免物理拔插CPU\n  - 通过更改系统启动配置文件来改变CPU数量\n\
    \    - Windows系统\n      - 打开“开始”菜单\n      - 点击“运行”\n      - 输入“notepad C:\\boot.ini”\n\
    \      - Boot.ini文件被打开\n      - 在[operating systems]部分的最后处添加新的一行：`/NUMPROC=x`（x表示CPU的使用数量）\n\
    \n### TCA的方法\n\n+ 针对一个特定的事务进行负载测试\n+ 在测试的同时收集度量数据\n+ 根据度量数据计算单元资源消耗成本/单元事务吞吐量\n\
    + 根据计算结果，估算针对特定吞吐量目标而需要的CPU能力级别\n\n### 小结\n\n+ 性能测试的基本概念\n+ 性能测试的应用\n\n### 非功能测试应用\n\
    \n"
  mdcn: "\n\n## 响应时间的分解\n\n响应时间 = 网络响应时间 + 应用程序响应时间\n\n### 网络响应时间\n\n网络响应时间指的是数据从一个服务器到另一个服务器在网络上传输所需花费的时间。\n\
    \n### 应用程序响应时间\n\n应用程序响应时间指的是服务器处理数据所需花费的时间。\n\n## 2. 吞吐量\n\n◆ 定义\n\n吞吐量指的是单位时间内处理的客户端请求数量。\n\
    \n通常情况下，吞吐量用请求数/秒或页面数/秒来衡量。\n\n从业务角度看，吞吐量也可以用访问人数/天或页面访问量/天来衡量。\n\n### 吞吐量 vs\
    \ 负载\n\n## 3. 资源利用率\n\n+ 定义\n\n资源利用率指的是对不同系统资源的使用程度，例如服务器的CPU，内存，网络带宽等。\n\n资源利用率通常以占用最大值的百分比来衡量。\n\
    \n### 资源利用率 vs 负载\n\n+ 当某个资源利用率随着负载的增加最终在100%居高不下时，就可能意味着这个资源变成了系统的性能瓶颈所在。\n\n\
    提高这个资源的量，将会提高系统的吞吐量，同时降低交易的响应时间，即改进了系统的性能。\n\n◆ 当你要衡量或者测试的某个资源总是无法达到100%的利用时，很有可能这时其他的某个或者某些资源已经达到了最大的使用率。它们已经变成了系统的性能瓶颈。\n\
    \n+ 现象：响应时间骤增到45秒，但是CPU的利用率只达到60%。\n+ 说明：如果在测试中单独的观察CPU或者是内存的利用率，对于分析定位性能瓶颈是没有什么帮助的。\n\
