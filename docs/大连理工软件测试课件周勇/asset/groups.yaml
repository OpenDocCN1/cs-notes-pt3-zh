  - '[PAGE 351]


    # # 配置测试


    +   - 配置测试：保证测试的软件使用尽可能多样化的硬件组合

    +   - 配置：

    +     - 主机

    +     - 组件：主板、磁盘驱动器、CD-ROM驱动器、视频卡、声卡、调制解调器、网卡等

    +     - 外设：打印机、键盘、鼠标、显示器、扫描仪、游戏杆、数码设备、U-盘等

    +     - 接口：内部或者外部的适配器接口，ISA、PCI、USB、PS/2、RS232等

    +     - 内存：主机内存、组件内存

    +     - 设备驱动程序：用来完成组件外设与操作系统和应用软件的通信'
  - '[PAGE 352]


    # 配置测试考虑什么？


    +   - 配置与软件的关系

    +   - 例如：

    +     - 游戏软件：考虑视频和声音部分

    +     - 通信软件：考虑调制解调器和网络配置

    +     - 绘图软件：考虑显卡和显存、打印

    +     - 嵌入式软件：考虑接口


    ![](img/5fda969404f5a602484516ab14b14f48_352_0.png)'
  - '[PAGE 353]


    # # 分离配置缺陷


    +   - 确定缺陷是配置缺陷还是普通缺陷

    +   - 方法：

    +     - 在另一台有完全不同配置的计算机上执行导致问题的相同操作。

    +     - 如果缺陷没有产生，就可能是配置问题；如果缺陷在多种配置中出现，就可能只有普通缺陷

    +   - 配置缺陷可能产生的情况

    +     - 在多种配置中出现的缺陷

    +     - 可能在某种特定配置中出现的缺陷

    +     - 硬件设备或驱动程序中可能出现的由软件揭示的缺陷

    +     - 硬件设备或驱动程序中可能出现的由许多其他软件揭示的缺陷'
  - '[PAGE 354]


    # 计算工作量


    +   - 配置测试工作量一般都比较大

    +   - 比如：

    +     - 测试软件所使用的各种主要配置组件

    +     - 测试软件使用的每一种组件的型号和驱动

    +   - 原则

    +     - 采用等价分配

    +     - 测试目前主流的

    +     - 约定测试配置的限度


    ![](img/5fda969404f5a602484516ab14b14f48_354_0.png)'
  - '[PAGE 355]


    # # 配置测试设计


    +   1. 确定所需的硬件类型

    +   2. 确定硬件商标、型号和驱动程序

    +   3. 确定可能的硬件特性、模式和选项

    +   4. 将明确后的硬件缩减为可控制的范围

    +   5. 明确使用硬件的软件唯一特性

    +   6. 设计在每一种配置中执行的测试用例

    +   7. 在每中配置中执行测试

    +   8. 反复测试直到满意为止


    ![](img/5fda969404f5a602484516ab14b14f48_355_0.png)'
  - '[PAGE 356]


    # # 1. 确定所需的硬件类型


    +   - 比如

    +     - 声音

    +     - 图象

    +     - 打印

    +     - 远程访问'
  - '[PAGE 357]


    # 2. 确定硬件商标、型号和驱动程序


    +   - 正在流行的型号

    +   - 可用的硬件

    +   - 使用地域

    +   - 需要支持的历史型号

    +   - 划分等价区间

    +   - 确定需要测试的驱动程序

    +     - 可以是操作系统支持的，可以是硬件所带的，可以是网络下载的。'
  - '[PAGE 358]


    # 3. 确定可能的硬件特性、模式和选项


    +   - 每一种设备的选项：

    +     - 最小

    +     - 中间

    +     - 优化

    +     - 最大


    +   - 选定软件需要支持的特性选项

    +     - 没有必要支持全部特性

    +     - 比如显卡的色彩数和分辨率

    +     - 比如MODEM的波特率'
