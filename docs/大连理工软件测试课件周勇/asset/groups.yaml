    \n## 软件测试的目标\n\n- 发现软件缺陷，尽可能早地\n- 软件测试是一个寻找错误的过程\n- 测试是为了证明程序有错，而不是为了证明程序没有错误\n\
    - 一个成功的测试是指揭示了迄今为止尚未发现的错误的测试\n- 一个好的测试用例是指可能找到迄今为止尚未发现的错误的用例\n- 测试环节要严格，力求完美，要与软件测试成本、测试策略综合考虑\n\
    \n## 软件测试的原则\n\n- 所有的测试都应追溯到用户需求\n- 应该及早编写测试计划\n- 测试应从小规模开始\n- 穷举测试是不可能的\n- 为了达到最佳效果，应该由独立的第三方来构造测试\n\
