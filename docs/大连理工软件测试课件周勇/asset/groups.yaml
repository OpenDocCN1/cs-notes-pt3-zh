    - **全员参与：** 全员参与至关重要，高层管理者必须重视软件质量保证活动。\n- **把握重点：** 一定要抓住问题的重点与本质，尽可能避免陷入对细节的争论之中。\n\
    \n## SQA策略\n\n- **SQA策略主要分三个阶段：**\n  - 以检测为重：产品制成之后进行检测，只能判断产品质量，不能提高产品质量。\n \
    \ - 以过程管理为重：把质量的保证工作重点放在过程管理上，对制造过程中的每一道工序都要进行质量控制。\n  - 以新产品开发为重：在新产品的开发设计阶段，采取强有力的措施来消灭由于设计原因而产生的质量隐患。\n\
    \n## SQA与软件测试有什么关系和区别？\n\n## SQA与软件测试的关系\n\n- SQA 是管理工作、审查对象是流程、强调以预防为主\n- 测试是技术工作、测试对象是产品、主要是以事后检查\n\
    \n- SQA指导测试、监控测试\n- 测试为SQA提供依据\n\n## 测试周期\n\n![](img/5fda969404f5a602484516ab14b14f48_55_0.png)\n\
    \nWERC: WebEx Engineering Release Cycle\n\n2022-11-3\n\n## 软件质量的可靠性评估\n\n- 软件可靠性评估的概述\n\
    - 软件可靠性模型\n- 可靠性评估过程\n\n## 软件可靠性评估的概述\n\n软件可靠性评估（Software Reliability Assessment）指根据软件系统可靠性结构（单元与系统间可靠性关系）、寿命类型和各单元的可靠性试验信息，利用概率统计方法，评估出系统的可靠性特征量。\n\
    \n## 软件可靠性评估的要素\n\n- 1）规定的时间\n- 2）规定的环境条件\n- 3）规定的功能\n\n## 软件可靠性模型\n\n软件可靠性模型（Software\
    \ reliability model）是指为预计或估算软件的可靠性所建立的可靠性结构和数学模型。建立可靠性模型是为了将复杂系统的可靠性逐级分解为简单系统的可靠性，以便于定量预计、分配、估算和评价复杂系统的可靠性。\n\
    \n1）可靠性结构模型，是依据系统结构逻辑关系，对系统的可靠性特征及其发展变化规律做出可靠性评价。\n\n2）可靠性预计模型，是用来描述软件失效与软件缺陷的关系，借助这类模型，可以对软件的可靠性特征做出定量的预计或评估。依据软件缺陷与运行剖面数据，利用统计学原理建立二者之间的数学关系，获取开发过程中可靠性变化、软件在预定工作时间的可靠度、软件在任意时刻发生的失效数的平均值以及软件在规定时间间隔内发生失效次数的平均值。\n\
    \n## 可靠性评估过程\n\n### 可靠性数据收集\n\n用时间定义的软件可靠性数据可以分为四类：\n\n- 失效时间数据，记录发生一次失效所累积经历的时间；\n\
    - 失效间隔时间数据，记录本次失效与上一次失效间的间隔时间；\n- 分组数据，记录某个时间区内发生了多少次失效；\n- 分组时间内的累积失效数，记录某个区间内的累积失效数。这四类数据可以互相转化。\n\
    - 测试时间；\n- 含有测试用例的测试计划或测试说明；\n- 所有与测试有关的测试结果，包括所有测试时发生的故障；\n- 参与测试的个人身份。\n\n###\
    \ 可靠性评估报告\n\n## 软件测试过程和策划\n\n![](img/5fda969404f5a602484516ab14b14f48_60_0.png)\n\
    \n## 议题：\n\n- 软件测试的过程\n- 测试计划的目标\n- 回顾开发和测试阶段\n- 测试计划的结构\n- 测试计划模板\n- 测试计划举例\n\
    \n## 软件测试过程中的关键活动\n\n测试设计\n\n测试计划\n\n测试构建\n\n测试评估和报告\n\n测试执行\n\n测试结果分析\n\n![](img/5fda969404f5a602484516ab14b14f48_62_0.png)\n\
    \n"
