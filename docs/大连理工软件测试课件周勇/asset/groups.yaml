    \n业务流管理器\n\n数据管理器\n\n测试调度器\n\n公用函数库\n\n通用测试工具\n\n## 自动测试技术\n\n- Data-Driven Testing（数据驱动）技术\n\
    - Keyword-Driven Testing（关键字驱动）技术\n\n![](img/5fda969404f5a602484516ab14b14f48_386_0.png)\n\
    \n## Keyword-Driven Testing（关键字驱动）\n\n关键字驱动实际上是比较复杂的数据驱动技术的逻辑扩展。将数据文件变成测试用例的描述，用一系列关键字指定要执行的任务。\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_389_0.png)\n\n## QTP简介(1)\n\n![](img/5fda969404f5a602484516ab14b14f48_391_0.png)\n\
    \n基于图标的树形视图  \n业务专家和初学者即使没有编程经验也可以轻松创建自动测试用例\n\n活动屏幕  \n在录制时很好与对象的捕获相结合\n\n数据表\
    \  \n不同的数据可以同一个测试脚本所使用（替代手工测试时的反复执行）\n\n## QTP简介 (2)\n\n强大的脚本编程功能实现更加“健壮”的脚本：\n\
    用于有较强编程经验的用户\n用于解决动态数据，扩展数据表等问题\n\n![](img/5fda969404f5a602484516ab14b14f48_392_0.png)\n\
    \nWorking with the Expert View is taught in the Advanced QuickTest Professional\
    \ course.\n\n## 软件测试自动化\n\n![](img/5fda969404f5a602484516ab14b14f48_396_0.png)\n\
    \n## 纲要\n\n- 一、Rational RUP软件过程与文撑环境\n- 二、Rational Suite产品系列\n- 三、构建典型的开发支撑环境\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_398_0.png)\n\n## Rational RUP软件过程与支撑环境\n\
    \n## 软件开发项目的目标\n\n- 产品的交付时间\n- 软件的质量（功能、性能等…）\n- 开发与维护成本\n\n![](img/5fda969404f5a602484516ab14b14f48_400_0.png)\n\
    \n## 软件项目三要素\n\nArchitecture（软件构架）\n\nProcess（开发过程）\n\nOrganization（团队组织）\n\n\
    ## Rational Unified Process\n\n提供完整的软件开发过程框架，可定制、裁剪，并得到Rational公司全套CASE工具支持，实施性很强\
    \  \n用例（需求）驱动、以构架为中心、迭代的开发过程  \n基于可视化建模（UML），纯粹的OOAD方法  \nUCM统一变更管理  \n使用过程定义语言来定义RUP框架，其过程元模型process\
    \ meta-model基于OMG SPEM，具有较高的形式化结构\n\n## RUP过程的基本结构（2003版）\n\n![](img/5fda969404f5a602484516ab14b14f48_403_0.png)\n\
    \n## 迭代工作流 Iteration Workflow\n\n![](img/5fda969404f5a602484516ab14b14f48_405_0.png)\n\
    \n## 角色与活动Roles & Activities\n\n![](img/5fda969404f5a602484516ab14b14f48_408_0.png)\n\
    \n## 角色集 Role Sets\n\n- Analysts 分析人员\n- Developers 开发人员\n- Managers 管理人员\n- Production\
    \ and Support 产品与支持人员\n- Testers 测试人员\n- Additional Roles 附属人员\n\n## 工件集Artifact\
    \ Sets\n\n- Requirements Artifact Set\n- Analysis & Design Artifact Set\n- Implementation\
    \ Artifact Set\n- Test Artifact Set\n- Deployment Artifact Set\n- Configuration\
    \ & Change Management Artifact Set\n- Project Management Artifact Set\n- Environment\
    \ Artifact Set\n- Business Modeling Artifact Set\n\n![](img/5fda969404f5a602484516ab14b14f48_410_0.png)\n\
    \n## 最佳实践Best Practices\n\n![](img/5fda969404f5a602484516ab14b14f48_411_0.png)\n\
    \n## Rational Suite\n\n- Rational公司推出的Case工具套件\n- 为RUP量身定做的全套解决方案\n- 围绕各角色集（Role\
    \ Set）的工作需要而打造不同的工具集合\n- 将业界主流的曾经独立发展的Case工具集成为一体\n- RUP Tool Mentor具体说明了这些工具的应用途径\n\
    \n## Rational Suite产品系列\n\n"
