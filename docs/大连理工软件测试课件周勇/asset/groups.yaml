    # # 兼容性测试要考虑的问题


    +   - 软件设计要求与何种其他平台（操作系统、WEB浏览器或者操作系统）和应用软件保持兼容？如果要测试的软件是一个平台，那么设计要求其怎么应用程序在其上运行？

    +   - 应该遵守何种定义软件之间交互的标准或者规范？

    +   - 软件使用何种数据与其他平台和软件交互和共享信息？


