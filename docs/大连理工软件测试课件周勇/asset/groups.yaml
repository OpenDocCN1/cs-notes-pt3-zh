    \n## 自动测试的管理和组织是容易进行的\n\n认为自动测试只是把手工测试进行自动化，然后运行它就可以达到目标了\n\n自动测试不是独立存在的。它需要与项目管理、质量管理、配置管理等工作进行交互，才能在促进软件系统质量上起到真正的作用\n\
