  md: "\n## 3. 制定测试策略\n\n- 确定和描述测试方法举例：\n  - 对于每一个用例，确定并执行测试用例，包括有效和无效的输入数据。\n  -\
    \ 对于每一个用例都将设计和开发测试流程。\n  - 利用三个月的时间来实施测试过程以模拟客户账号管理。测试过程包括添加、修改和删除账号以及客户。\n  -\
    \ 实施测试过程并通过 1500 个虚拟用户来执行测试脚本，每个用户都执行功能 A、B 和 C，并且使用不同的输入数据。\n\n- 确定测试标准举例：\n\
    \  - 所有计划好的的测试用例和测试过程已被执行。\n  - 所有确定的缺陷已被解决。\n  - 所有计划好的的测试用例和测试过程已被重新执行并且没有发现新的缺陷。\n\
    \n## 4. 明确测试中的关键活动(WBS)\n\n- WBS (Work Breakdown Structure)\n\n- 任务分解的过程\n\n-\
    \ 将一个项目分解为更多的工作细目或者子项目，使项目变得更小、更易管理、更易操作。\n\n- 任务分解的结果\n\n- WBS（任务分解结构）。\n\n-\
    \ WBS\n\n- 面向可交付成果的。\n\n## WBS意义\n\n- 提供了项目范围基线，是范围变更的重要输入\n- 可以集中注意力到项目的目标上\n\
    - 对于开发项目提供了一个框架\n- 责任更明确\n- 为评估和分配任务提供具体的工作包\n- 是进行估算和编制项目进度的基础\n- 对整个项目成功的集成和控制起到非常重要的作用\n\
    \n## WBS实例\n\n![](img/5fda969404f5a602484516ab14b14f48_88_0.png)\n\n![](img/5fda969404f5a602484516ab14b14f48_88_1.png)\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_88_2.png)\n\n![](img/5fda969404f5a602484516ab14b14f48_88_3.png)\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_88_4.png)\n\n![](img/5fda969404f5a602484516ab14b14f48_88_5.png)\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_88_6.png)\n\n## 清单类型\n\n1. 变化计数器\n\
    \   - 1.1 比较两个版本的程序\n     - 1.1.1 预处理\n     - 1.1.2 文件比较\n     - 1.1.3 结果处理\n\
    \   - 1.2 找出修改后的程序中增加和删除的代码行\n     - 1.2.1 找出增加的代码行\n     - 1.2.2 找出删除的代码行\n \
    \  - 1.3 统计修改后的程序中增加和删除的代码行数\n     - 1.3.1 统计增加代码行数\n     - 1.3.2 统计删除代码行数\n \
    \  - 1.4 统计总的代码行数\n   - 1.5 设定标记以指示修改的次数\n   - 1.6 在程序的头部增加修改纪录\n\n## 图表类型\n\n\
