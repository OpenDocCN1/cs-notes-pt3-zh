    +   - 术语：defect, variance, fault, failure, problem, error, bug, inconsistency


    +   - 缺陷的类型：


    +   - 错误的： 未将规格说明书正确实现


    +   - 遗漏的： 规定的或者预期的需求没有体现在产品中


    +   - 额外的 ： 规格说明书中未规定的需求被纳入产品加 以实现'
  - '[PAGE 30]


    # 软件缺陷的定义


    +   - 简单说：软件中不满足的问题称为软件缺陷

    +   - 软件缺陷的详细定义：

    +     - 软件没有达到产品说明书表明的功能

    +     - 软件出现了产品说明书指明不会出现的问题

    +     - 软件功能超出产品说明书指明的范围

    +     - 软件没有达到产品说明书虽未指明，但应该达到的功能

    +     - 软件测试人员认为软件难以理解、不易使用、运行速度慢，或者用户认为不好。'
  - '[PAGE 31]


    # 为什么会出现软件缺陷


    +   - 软件缺陷的产生原因：

    +     - 产品规格说明书（SRS）

    +       - 没有写

    +       - 不够全面、准确、细致

    +       - 经常变更

    +     - 软件的设计（Architecture）

    +       - 这是软件的蓝图

    +       - 描述不够清楚

    +       - 框架的结合不够紧密和连贯

    +       - 软件框架经常变动，不稳定

    +     - 代码错误

    +       - 编码人员造成的，人员素质和技术水平是其中原因之一

    +       - 间接的看，来自上层的分析和设计问题'
