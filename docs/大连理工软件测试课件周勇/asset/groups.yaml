  mdcn: "\n## 软件测试方法和技术\n\n本书系统介绍了软件品质保证体系和软件测试原理。从软件工程学、质量保证、风险管理等角度阐述了软件测试以及软件测试策略的设计原则。\n\
    \n本书重点讲解软件测试的流程和技术/方法，深入剖析和探讨了各种测试类型和不同阶段比较成熟的技术以及方法，包括从单元测试到验收、安装测试，从应用服务器测试到本地化、自动化测试等。\n\
    \n本书作为软件测试的实际应用参考。从怎样组建测试队伍，搭建测试环境到测试用例组织、设计、化繁为简，将抽象理论知识变为可触摸到的实际操作，更好地理解和消化理论基础。\n\
    \n本书特色：\n\n- 系统的软件品质保证体系和软件测试原理，从软件工程学、质量保证、风险管理等角度阐述了软件测试以及软件测试策略的设计原则\n- 软件测试的流程和技术/方法，深入剖析和探讨了各种测试类型和不同阶段比较成熟的技术以及方法，包括从单元测试到验收、安装测试，从应用服务器测试到本地化、自动化测试等\n\
    - 软件测试的实际应用参考。从怎样组建测试队伍，搭建测试环境到测试用例组织、设计、化繁为简，将抽象理论知识变为可触摸到的实际操作，更好地理解和消化前面的理论基础\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_14_0.png)\n\n## 英文\n\n![](img/5fda969404f5a602484516ab14b14f48_16_0.png)\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_16_1.png)\n\n内容提要\n软件测试是确保软件产品质量的必需过程和手段。在开发面向对象软件和基于组件的软件时，同样必须设计并实施有效的测试。本书明确指出了面向对象软件和面向过程软件测试任务的不同之处，论述了面向对象软件测试所面临的机遇和挑战。书中介绍了如何将测试工作整合进软件开发的各个阶段，以及各阶段的具体测试内容是什么。本书注重结合实例来讲解对象软件测试的过程和技巧，因而具有很强的实践性和指导意义。本书内容完整，结果合理，适合软件开发、测试领域的技术人员、软件工程专业的高年级本科生和研究生阅读，也可作为相关专业人员的参考用书。\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_17_0.png)\n\n本书系统地介绍了有关软件测试的基本知识和全过程。作者从软件测试的规划和方案设计，到测试分类、各种测试技术、手动测试、测试自动化、测试报告、测试管理，以及怎样选择和使用自动化测试工具等，都进行了深入的探讨。本书的独到之处在于除介绍最新的软件测试科技外，还是有很高的实用价值。基于作者在国外从事一线软件测试的实践经验，书中介绍了这项工作所需的基础知识、测试架构的建立、测试操作的流程及测试实例。本书适合从事软件测试工作的专业人员和相关人员阅读与参考。\n\
    \n## 议题：\n\n- 软件的问题与质量\n- 软件质量的评价\n- 软件缺陷\n- 软件测试的意义\n- 软件测试工程师关注什么\n\n## 软件的问题\n\
    \n- 软件项目经常无法按期完成，超出经费的预算，软件质量难以控制。\n- 开发人员及开发过程之间管理不规范，约定不严格，文档书写不完整，软件可维护性不好。\n\
    - 缺少严密有效的质量检验手段，交付给用户的软件质量差，运行中出现许多问题，带来严重后果。\n- 系统更新换代难度大\n- 软件开发的产业模式已经不能适应信息时代。\n\
    \n### 软件问题的原因\n\n是软件缺陷的积累和放大效应\n\n- 失之毫厘，谬以千里\n- 成本急剧增加，质量大幅下降\n- 开发过程的混乱，效率很低\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_21_0.png)\n\n### 软件缺陷案例\n\n- 千年虫　70年代的鼠目寸光\n\
    - 美国航天局火星登陆　90年代的测试不协调\n- Intel CPU的浮点除法　缺陷带来的代价\n\n## 软件质量的评价\n\n- 满足客户的软件需求\n\
    - 遵循了软件开发过程所规定的各种标准\n- 已经满足了那些明文规定的需求，同时也要满足那些隐含的需求\n\n## 软件质量的评价指标\n\n### 软件的运行特性\n\
    \n- 正确性：软件能满足需求规格说明，完成客户提出任务要求的程度\n- 可靠性：软件精确地工作\n- 有效性：是否能够在一定内存和外设容量下有效地运行\n\
    - 完整性：控制各类不同用户使用软件或数据的能力\n- 可用性：软件被用户容易掌握\n\n### 软件的维护特性\n\n- 可维护性：找到错误发生的位置，加以修正的工作量\n\
    - 灵活性：是否可以修改，是否容易修改\n- 可测性：是否可以测试，是否容易测试\n\n### 软件的移植特性\n\n- 可移植性：软件可以在不同的机器或环境下运行\n\
    - 可复用性：软件的重复使用\n\n总之，软件的质量评价是比较复杂的，但是，有一条是要找到可以度量的指标来预测或评价软件的质量。\n\n## 软件测试产生的背景\n\
    \n- 首先是尽可能地保证软件的质量\n- 程序规模的爆炸式增长\n- 在程序自身与用户需求之间寻找平衡点\n- 解放程序员\n- 解放售后服务人员\n-\
    \ 推动软件工程的发展\n\n## 什么是软件测试\n\n### PDCA 持续的测试周期\n\n- Plan：定义目标、确定策略、决定方法\n- Do：创建测试环境、执行计划\n\
    - Check：检查工作进程完成的情况\n- Act：不合适，采取措施\n\n## 软件测试相关的人员\n\n- 软件客户\n- 软件的使用者\n- 软件开发者\n\
    - 软件测试人员\n- 公司高层管理机构\n- 审计和质检人员\n\n## 什么是软件缺陷（defect）\n\n- 术语：defect, variance,\
    \ fault, failure, problem, error, bug, inconsistency\n- 缺陷的类型：\n  - 错误的：未将规格说明书正确实现\n\
    \  - 遗漏的：规定的或者预期的需求没有体现在产品中\n  - 额外的：规格说明书中未规定的需求被纳入产品加以实现\n\n### 软件缺陷的定义\n\n\
    - 简单说：软件中不满足的问题称为软件缺陷\n- 软件缺陷的详细定义：\n  - 软件没有达到产品说明书表明的功能\n  - 软件出现了产品说明书指明不会出现的问题\n\
    \  - 软件功能超出产品说明书指明的范围\n  - 软件没有达到产品说明书虽未指明，但应该达到的功能\n  - 软件测试人员认为软件难以理解、不易使用、运行速度慢，或者用户认为不好。\n\
    \n### 为什么会出现软件缺陷\n\n- 软件缺陷的产生原因：\n  - 产品规格说明书（SRS）\n    - 没有写\n    - 不够全面、准确、细致\n\
    \    - 经常变更\n  - 软件的设计（Architecture）\n    - 这是软件的蓝图\n    - 描述不够清楚\n    - 框架的结合不够紧密和连贯\n\
    \    - 软件框架经常变动，不稳定\n  - 代码错误\n    - 编码人员造成的，人员素质和技术水平是其中原因之一\n    - 间接的看，来自上层的分析和设计问题\n\
    \n## 软件测试的目标\n\n- 发现软件缺陷，尽可能早地\n- 软件测试是一个寻找错误的过程\n- 测试是为了证明程序有错，而不是为了证明程序没有错误\n\
    - 一个成功的测试是指揭示了迄今为止尚未发现的错误的测试\n- 一个好的测试用例是指可能找到迄今为止尚未发现的错误的用例\n- 测试环节要严格，力求完美，要与软件测试成本、测试策略综合考虑\n\
    \n## 软件测试的原则\n\n- 所有的测试都应追溯到用户需求\n- 应该及早编写测试计划\n- 测试应从小规模开始\n- 穷举测试是不可能的\n- 为了达到最佳效果，应该由独立的第三方来构造测试\n\
    \n## 软件测试使用的技术\n\n黑盒测试、白盒测试\n\n两种测试方法从不同的角度出发，反映了软件的不同侧面，也适用于不同的开发环境\n\n## 软件测试的生命周期\n\
