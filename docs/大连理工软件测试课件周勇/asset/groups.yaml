  - '[PAGE 172]


    # # 边界值分析思想


    使用的输入变量是：min,min+,nom,max-,max


    ![](img/5fda969404f5a602484516ab14b14f48_172_0.png)'
  - '[PAGE 173]


    # 边界值分析假设


    +   - 单缺陷假设

    +   - 一个变量取极值，其他所有变量去正常值

    +     - X1mon:

    +       - x2min,x2min+,

    +       - x2nom,

    +       - x2max-,x2max

    +     - X2mon:

    +       - x1min,x1min+,

    +       - x1nom,

    +       - x1max-,x1max


    ![](img/5fda969404f5a602484516ab14b14f48_173_0.png)'
  - '[PAGE 174]


    # 边界值分析的方式


    +   - 通过变量的数量

    +     - 对于有N个变量的函数，边界值分析产生4N+1个测试用例

    +   - 通过值域的种类

    +     - 取决于变量本身的类型

    +     - 显示的边界和有离散的边界，容易确定边界

    +     - 没有显示地给出边界的，需要人为地创建边界

    +   - 多个独立的变量（变量之间没有依赖），受物理量（温度、压力等）的限制，比较适合边界值分析'
  - '[PAGE 175]


    # 健壮性测试


    +   - 增加极限值

    +     - $\infty$Max+, min-

    +   - 一个变量取极值，其他所有变量去正常值

    +   - 主要是观察例外处理情况，即输出结果


    X1mon:

    X2min-, x2min, x2min+,

    x2nom,

    x2max-, x2max, x2max+


    X2mon:

    X1min-, x1min, x1min+,

    x1nom,

    x1max-, x1max, x1max+


    ![](img/5fda969404f5a602484516ab14b14f48_175_0.png)'
  - '[PAGE 176]


    # # 最坏情况测试


    +   > 多个变量取极值

    +   > 对每个变量，包含 min,min+,nom, max-, max集合的测试

    +   > 然后再对这些集合做笛卡尔积运算，生成测试用例

    +   > N变量： 5n个测试用例


    ![](img/5fda969404f5a602484516ab14b14f48_176_0.png)'
  - '[PAGE 177]


    # # 例子


    参见书P75


