    - 遵循了软件开发过程所规定的各种标准\n- 已经满足了那些明文规定的需求，同时也要满足那些隐含的需求\n\n## 软件质量的评价指标\n\n### 软件的运行特性\n\
    \n- 正确性：软件能满足需求规格说明，完成客户提出任务要求的程度\n- 可靠性：软件精确地工作\n- 有效性：是否能够在一定内存和外设容量下有效地运行\n\
    - 完整性：控制各类不同用户使用软件或数据的能力\n- 可用性：软件被用户容易掌握\n\n### 软件的维护特性\n\n- 可维护性：找到错误发生的位置，加以修正的工作量\n\
    - 灵活性：是否可以修改，是否容易修改\n- 可测性：是否可以测试，是否容易测试\n\n### 软件的移植特性\n\n- 可移植性：软件可以在不同的机器或环境下运行\n\
    - 可复用性：软件的重复使用\n\n总之，软件的质量评价是比较复杂的，但是，有一条是要找到可以度量的指标来预测或评价软件的质量。\n\n## 软件测试产生的背景\n\
