    \n## 一般需要的软件测试\n\n- 功能测试\n- 压力/负载测试\n- 安装/卸载测试\n- 数据库测试\n- 界面测试\n- 文档测试\n\n- 可用性测试\n\
    - 配置测试\n- 安全测试\n- 其他非功能测试\n\n![](img/5fda969404f5a602484516ab14b14f48_44_0.png)\n\
    \n## 手工测试\n\n反复测试带来的倦怠情绪及其他人为因素使得测试标准前后不一，测试花费的时间越长，测试的严格性也就越低\n\n受软件分发日期、开发成本及人员等诸多因素的限制，难以进行全面的测试\n\
    \n难以对不可视对象或对象的不可视属性进行测试\n\n对测试过程中发现的大量缺陷缺乏科学、有效的管理手段，责任变的含混不清，没有人能向决策层提供精确的数据，以便度量当前的工作进度及工作效率\n\
    \n## 自动测试\n\n所谓自动测试，实际上是将大量的重复性工作交给计算机去完成，节约大量的人力、物力、资金、时间等资源，并且测试脚本可以重复利用（可以是不同的项目）。\n\
    \n## 软件质量保证\n\n![](img/5fda969404f5a602484516ab14b14f48_47_0.png)\n\n![](img/5fda969404f5a602484516ab14b14f48_47_1.png)\n\
    \n## 软件质量保证（SQA）\n\n- SQA 概述\n- SQA 活动\n- SQS 与软件测试的关系\n\n## 什么是 SQA ?\n\n软件质量保证是通过对软件产品和活动有计划的进行评审和审计来验证软件是否合乎标准的系统工程活动。\n\
    \n- 确保SQA活动要自始至有计划的进行\n- 审查软件产品和活动是否遵守适用的标准、规程和要求并得到客观验证。\n- SQA的活动和结果要保证全员参与，沟通顺畅。\n\
    - 逐级解决不符合问题\n\n## SQA活动\n\n- 技术方法的应用\n- 正式技术评审的实施\n- 软件测试\n- 标准的执行\n- 修改的控制\n\
    - 度量\n- 质量记录和记录保存\n\n## SQA活动的影响因素\n\n- **知识结构：** 专业的技术，例如质量管理与控制知识、统计学知识等。\n\
    - **经验**\n- **依据：** 如果没有这些标准，就无法准确地判断开发活动中的问题，容易引发不必要的争论，因此组织应当建立文档化的开发标准和规程。\n\
    - **全员参与：** 全员参与至关重要，高层管理者必须重视软件质量保证活动。\n- **把握重点：** 一定要抓住问题的重点与本质，尽可能避免陷入对细节的争论之中。\n\
    \n## SQA策略\n\n- **SQA策略主要分三个阶段：**\n  - 以检测为重：产品制成之后进行检测，只能判断产品质量，不能提高产品质量。\n \
    \ - 以过程管理为重：把质量的保证工作重点放在过程管理上，对制造过程中的每一道工序都要进行质量控制。\n  - 以新产品开发为重：在新产品的开发设计阶段，采取强有力的措施来消灭由于设计原因而产生的质量隐患。\n\
    \n## SQA与软件测试有什么关系和区别？\n\n## SQA与软件测试的关系\n\n- SQA 是管理工作、审查对象是流程、强调以预防为主\n- 测试是技术工作、测试对象是产品、主要是以事后检查\n\
