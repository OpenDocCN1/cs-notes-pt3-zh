    \ 构件产品的目录结构\n- 产品的管理由配置管理决定\n- 测试的缺陷要和产品的层次级别、测试用例、变更请求建立连接，用来分析产品质量\n\n比如：\n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_119_0.png)\n\n## 缺陷报告与跟踪\n\n- 可以手动记录：参见文件testreport.doc\n\
    - 可以自动记录，数据库用于存放产品测试信息，一般包含四种角色：“测试组长”、“测试员”、“开发人员”、“项目经理”。\n- 在使用数据库时，\n  - 首先由具有“测试组长”角色的用户创建项目中的产品的描述文档。\n\
    \  - 此后，测试人员应创建产品测试信息文档，并开始对产品进行测试。\n  - 如果发现此产品存在问题，则填写一份产品测试跟踪报告，利用邮件通知给开发人员，由开发人员决定是否进行修改。\n\
    \  - 如果开发人员和测试人员发生争议，可以提交给“测试组长”作出决定。\n  - 在整个流程中共有八个可能的状态：草案，提交，拒绝，接受，终止，推迟，审定，解决。\n\
    \n## 测试结果的评价分析\n\n- 评估测试的目的是生成并交付测试评估报告。\n- 这是通过复审并评估测试结果、确定并记录变更请求，以及计算主要测试评测方法来完成的。\n\
    - 测试评估摘要以组织有序的格式提供测试结果和主要测试评测方法，用于评估测试对象和测试流程的质量。\n\n## 测试分析的步骤\n\n### 步骤\n\n\
    1. 分析测试结果并提交变更请求\n2. 评估基于需求的测试覆盖\n3. 评估基于代码的测试覆盖\n4. 分析缺陷\n5. 确定是否达到了测试的完成标准和成功标准\n\
