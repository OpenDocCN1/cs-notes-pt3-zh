  - "[PAGE 254]\n\n# # 单元测试\n\n+   ## 概况\n+   \n+   ### 定义：\n+   \n+   - 检验程序最小单位有无错误。一般在编码之后，由开发人员完成。\n\
    +     - 单元：软件开发中的最小的独立部分\n+       - C语言中的单元：函数或者是子过程\n+       - C++语言中的单元：类\n\
    +   \n+   ### 目前状况：\n+   \n+   - 实施效果非常好，但是实施阻力比较大(主要是人员和管理因素)，一般只在关键的程序单元中实施\n\
    +   - 有比较系统的理论和方法，但也依赖于系统的特殊性和开发人员的经验\n+   - 有大量的辅助工具，开发人员也经常自己开发测试代码和测试工具\n+\
    \   - 主要使用白盒测试和静态分析，也使用黑盒测试"
