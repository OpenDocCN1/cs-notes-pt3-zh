    出错率与源程序行数之间不存在简单的线性关系\n\nLipow指出，对于小程序，每行代码（执行部分）的出错率为1.3%-1.8%\n\n对于大程序，每行代码（执行部分）的出错率为2.7%-3.2%\n\
    \n对于少于100个语句的程序，出错率与源程序行数之间是线性关系的；\n\n随着程序的增大，出错率以非线性方式增长。\n\n## 程序复杂性度量与错误之间的关系\n\
    \n### 环路复杂性度量-McCabe度量法\n\n-基于程序控制流的复杂性度量方法\n\n程序图：把程序流程图中的每个处理符号退化为一个结点，把连接每个处理符号的链转变为连接结点的有向弧，所得到的有向图称为程序图。\n\
    \n程序图的语义：描述程序内部的控制流程，不表现对数据的具体操作以及分支和循环的具体条件。\n\n即该方法把简单的条件语句与复杂的循环语句的复杂性视为一样；把嵌套的IF语句与CASE语句的复杂性视为一样。\n\
    \n根据图论，在一个强连通的有向图中，环的个数为：\n\n$V(G)=m-n+p$\n\n其中：m为图中的弧数，n为图中的结点数，p为图中强连通分量数\n\n\
    程序总是连通的，但一般不是强连通的，为此，需加一条从入口到出口的虚线。\n\n据此，上例中的环数为：13-11+1=3\n\n即McCabe度量法的度量值为3。\n\
    \n注：环路复杂度是可加的。\n\n为软件测试的难度提供了一种定量度量方法。\n\nMcCabe发现，在276个程序中，有23%的子程序的复杂度超过10，\n\
    而在这些子程序中发现的错误占总错误的53%，因此，他建议，如果程序的复杂度超过10，那么就应该对这一程序进行分解。\n\n## DD路径测试举例\n\n##\
    \ 小结\n\n- 动态白盒测试\n- DD路径测试\n\n## 议题\n\n- 以方法为单元的测试\n- 以类为单元的测试\n\n## OO中的单元测试\n\
    \n- 最小的测试单元是封装的类或对象\n- 类或对象包含属性和一组操作方法\n- 测试封装在类中的操作和类的状态变化\n\n## 类图（UML）\n\n\
    ![](img/5fda969404f5a602484516ab14b14f48_294_0.png)\n\n**RegistrationController**（<<Control>>）\n\
    \n- `# submit schedule()`\n- `# save schedule()`\n- `# create schedule with offerings()`\n\
    - `# get course offerings()`\n\n**ICourseCatalogSystem**（<<interface>>）\n\n- `+\
    \ getCourseOfferings(in forSemester : Semester) : CourseOfferingList`\n\n**Schedule**（<<entity>>）\n\
    \n- `- semester : Semester`\n- `+ submit()`\n- `+ save()`\n- `# any conflicts()`\n\
    - `# create with offerings()`\n\n**Student**（<<Entity>>）\n\n- `- name`\n- `- address`\n\
    - `- StudentID : int`\n- `+ addSchedule(in aSchedule : Schedule)`\n- `+ getSchedule(in\
    \ forSemester : Semester) : Schedule`\n- `+ hasPrerequisites(in forCourseOffering\
    \ : CourseOffering) : boolean`\n- `# passed(in aCourseOffering : CourseOffering)\
    \ : boolean`\n\n**CourseOffering**（<<Entity>>）\n\n- `- number : String = \"100\"\
    `\n- `- startTime : Time`\n- `- endTime : Time`\n- `- day : String`\n- `+ addStudent(in\
    \ aStudentSchedule : Schedule)`\n- `+ removeStudent(in aStudentSchedule : Schedule)`\n\
    - `+ new()`\n- `+ setData()`\n\n图中标注：`Global visibility`、`Field visibility`、`Parameter\
    \ visibility`。\n\n## 以方法为单元的测试\n\n- 将面向对象的单元测试等同于传统的单元测试\n- 方法/操作相当于过程函数\n- 需要建立相应的测试驱动程序\n\
    \n## 单元测试\n\n- 由于类的封装，使得类中方法的复杂度比较低，测试较为容易\n- 主要使用传统的测试方法\n  - 白盒测试\n    - 审查\n\
    \    - 覆盖性测试\n  - 黑盒测试\n    - 边界值\n    - 等价类\n\n## 以类为单元的测试\n\n- 实际上是类内的单元测试和集成测试\n\
    - 主要是类内部的方法和消息带来的类状态的变化\n\n- 定义类内的状态图\n- 选择基于状态图的测试覆盖指标，比如\n  - 每个事件\n  - 组件中的每个状态\n\
    \  - 组件中的每个转移\n  - 所有交互状态对偶\n  - 对应于客户定义用例的场景\n\n## 举例\n\n- ➤ 参见书17章\n\n## 类的状态图（UML）\n\
    \n![](img/5fda969404f5a602484516ab14b14f48_299_0.png)\n\n## 性能测试\n\n### 1.响应时间\n\
    \n定义：\n响应时间指的是从客户端发起一个请求开始，到客户端接收到从服务器端返回的响应结束，这个过程所耗费的时间。\n\n响应时间通常用时间单位来衡量，\n\
    \n例如\n\n秒（seconds）\n\n或者\n\n毫秒（milliseconds）\n\n## 响应时间 vs 负载\n\n![](img/5fda969404f5a602484516ab14b14f48_304_0.png)\n\
    \n## 图形中的拐点\n\n- 表示响应时间突然增加\n- 意味着一种或者多种系统资源的利用达到了极限\n\n## 例如：\n\n- 很多Web服务器可以设置固定数量的threads来处理用户同时发出的请求。\n\
    - 当这些并发的请求数量超过当前有效的threads数量时，任何新到的请求将会被放入一个队列中等待系统的处理。\n- 这个在队列中等待的时间将会使响应时间大大的增加。\n\
    \n"
