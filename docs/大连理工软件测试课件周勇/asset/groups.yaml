    2. 按照测试说明  \n3. 操作测试实例步骤  \n4. 运行测试代码、剧本  \n5. 记录测试现场（结构）  \n6. 预期与准则判定结论  \n\
    7. 处理记录与结论  \n\n## 问题处理\n\n当测试用例不通过时：  \n\n- 对测试工作中的缺陷，记录到问题及变更报告中，并实施相应的变更。这类缺陷如：\
    \  \n  - 软件测试说明的缺陷  \n  - 测试数据的缺陷  \n  - 执行测试步骤时的缺陷  \n  - 测试环境中的缺陷  \n- 对被测软件的缺陷，汇总到软件问题报告中。软件问题报告的格式应规范\
    \  \n\n## 测试执行后\n\n所有的测试用例都执行完毕后，应根据测试的充分性要求和有关原始记录，确定测试工作是否充分，是否需要进行补充测试：  \n\
    \n- 当测试过程正常终止时，如果发现测试工作不足，或测试未达到预期要求时，应进行补充测试。  \n- 当测试过程异常终止时，应记录导致终止的条件、未完成的测试和未被修正的错误\
    \  \n\n## 评估\\交付\n\n1. 分析本测评项目中积累的数据和文档，以供以后的测试使用。如：  \n   - 缺陷数据（如数量、类型、严重性）\
    \  \n   - 用例数据  \n   - 管理数据（如生产率、工作量、进度）  \n   - 文档（如好的用例设计、好的需求规格说明）  \n\n2.\
    \ 测试工作分析、评价  \n\n3. 遗留问题分析、处理报告  \n\n4. 被测软件质量分析、评价，形成测试（测评）报告  \n\n5. 评审  \n\n\
    6. 交付、善后  \n\n## 软件测试的工作流\n\n- **活动：**  \n  - 制定测试计划  \n  - 设计测试  \n  - 实施测试 \
    \ \n  - 集成和系统的测试  \n  - 评估测试  \n\n## 制定测试计划的目的\n\n- 通过准确、详细描述测试过程中的关键活动、角色、进度，以确保测试工作成功完成。\
    \  \n- 帮助组织、管理、安排测试工作  \n- 帮助设计测试用例  \n- 增强开发者和管理层的沟通  \n\n## 制定测试计划的步骤\n\n- 确定测试需求\
    \  \n- 评估风险  \n- 制定测试策略  \n- 明确测试中的关键活动(WBS)  \n- 估计测试成本和工作量  \n- 定义角色和确定资源  \n\
    - 确定进度,创建时间表  \n- 生成测试计划  \n\n## 1.确定测试需求\n\n确定测试需求是测试计划活动的开始。  \n\n测试需求确定测试对象以及测试工作的范围和作用。测试需求还用来确定整个测试工作（如安排时间表、测试设计等）并作为测试覆盖的基础。\
    \  \n\n被确定的测试需求项必须是可核实的。即，它们必须有一个可观察、可评测的结果。无法核实的需求不是测试需求  \n\n## 1. 确定测试需求\n\n\
    - 测试需求所确定的是测试内容，即测试的具体对象。  \n- 分类：  \n  - 功能性测试需求  \n  - 非功能性测试需求  \n\n## 2.评估风险\n\
    \n- 最大限度地提高测试效率并确定测试工作的优先级。  \n- 制定一个可接受的测试顺序。  \n\n## 2.评估风险\n\n- 评估风险的方法：  \n\
