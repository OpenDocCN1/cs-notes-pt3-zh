  md: "\n## BRIDGE（桥接）—对象结构型模式\n\n### 1. 意图\n\n将抽象部分与它的实现部分分离，使它们都可以独立的变化。\n\n###\
    \ 2. 动机\n\n一般情况：当一个抽象可能有多个实现时，通常用继承来协调它们。抽象类定义对该抽象的接口，而具体的子类则用不同方式加以实现。\n但是，此方法有时不够灵活。继承机制将抽象部分与它的实现部分固定在一起，使得难以对抽象部分和实现部分独立地进行修改、扩充和重用。\n\
    \n此外，继承机制还有两个不足之处（见例子）：\n\n1）扩展Window抽象使之适用于不同种类的窗口或新的系统平台很不方便。假设有Window的一个子类Icon\
    \ Window，它专门将Window抽象用于图标处理。为了使IconWindow支持两个系统平台，我们必须实现两个新类XIconWindow和PMIconWindow，使得关系复杂化。如下图所示。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_84_0.png)\n\n2）继承机制使得客户代码与平台相关。每当客户创建一个窗口时，必须要实例化一个具体的类，这个类有特定的实现部分。例如，创建Window对象会将Window抽象与XWindow的实现部分绑定起来，这使得客户程序依赖于XWindow的实现部分。这将使得很难将客户代码移植到其他平台上去。\n\
    \n最好应该：\n\n客户在创建窗口时应该不涉及到其具体实现部分。仅仅是窗口的实现部分依赖于应用运行的平台。这样客户代码在创建窗口时就不应该涉及到特定的平台。\n\
    Bridge模式解决以上问题的方法是：将Window抽象和它的实现部分分别放在独立的类层次结构中：\n\n+ 其中一个类层次结构针对窗口接口（\n+ Window，IconWindow，TransientWindow\
    \ ），\n\n+ 另外一个独立的类层次结构针对平台相关的窗口实现部分，这个类层次结构的根类为WindowImp。例如XwindowImp子类提供了一个基于XWindow系统的实现，如下图所示。\n\
    \n对Window子类的所有操作都是用WindowImp接口中的抽象操作实现的。这就将窗口的抽象与系统平台相关的实现部分分离开来。因此，我们将Window与WindowImp之间的关系称之为桥接，因为它在抽象类与它的实现之间起到了桥梁作用，使它们可以独立地变化。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_85_0.png)\n\n### 3. 适用性\n\n以下一些情况使用Bridge模式：\n\
    • 当不希望在抽象和它的实现部分之间有一个固定的绑定关系。例如这种情况可能是因为，在程序运行时刻实现部分可以被选择或者切换。\n• 类的抽象以及它的实现都应该可以通过生成子类的方法加以扩充。这时Bridge模式使你可以对不同的抽象接口和实现部分进行组合，并分别对它们进行扩充。\n\
    • 对一个抽象的实现部分的修改应对客户不产生影响，即客户的代码不必重新编译。\n\n+ （C++）想对客户完全隐藏抽象的实现部分。\n+ 想在多个对象间共享实现（可能使用引用计数），但同时要求客户并不知道这一点。\n\
    \n### 4. 结构\n\n![](img/3b4669cf00b2833fe526284506f3f342_86_0.png)\n\n### 5. 参与者\n\
    \n+ Abstraction（Window）\n  - 定义抽象类的接口。\n  - 维护一个指向Implementor类型对象的指针。\n+ RefinedAbstraction（IconWindow）\n\
    \  - 扩充由Abstraction定义的接口。\n+ Implementor（WindowImp）\n  - 定义实现类的接口，该接口不一定要与Abstraction的接口完全一致；事实上这两个接口可以完全不同。一般来讲，Implementor接口仅提供基本操作，而Abstraction则定义了基于这些基本操作的较高层次的操作。\n\
    + ConcreteImplementor（XwindowImp，PMWindowImp）\n  - 实现Implementor接口并定义它的具体实现。\n\
    \n### 6. 协作\n\n+ Abstraction将client的请求转发给它的Implementor对象。\n\n![](img/3b4669cf00b2833fe526284506f3f342_88_0.png)\n\
    \nSwitchable 是抽象类（也可以具体类），包括了 turnOn 和 turnOff 函数，Switchable 把 main 的请求转发给 Switch\
    \ Impl(被 Switchable 包含)对象，Switchable 中的 turnOn 和 turnOff 函数本身并不知道具体做什么“开”或“关”，比如是电源的开关还是水龙头的开关\
    \ Switchable 中的 turnOn 和 turnOff 函数并不知道，但通过桥接由 Aswitch 或 Bswitch 中的 turnOn 和 turnOff\
    \ 函数实现了。\n另外，阅读 book P584 飞机例子，airbus, boeing, MD\n\n### 注意：合成/聚合复用原则（Composition/Aggregation\
    \ Principle CARP）\n\n合成/聚合复用原则讲的是，要尽量使用合成/聚合，而不是继承关系达到的复用的目的。\n或者说，该原则就是在一个新的对象里面使用一些已有的对象，使之成为新对象的一部分；\n\
    从而达到复用已有功能的目的。\n\n显然，合成/聚合复用原则是与白民代换原则相辅相成的，两者又都是对实现“开-闭”原则的\n具体步骤的规范。前者要求设计师首先考虑合成/聚合关系，后者要求在使用继承关系时，必须确定\n\
    这个关系是符合一定条件的。\n遵守合成/聚合复用原则是实现“开-闭”原则的必要条件；违反这一原则就无法使系统实现\n“开-闭”原则这一目标。\n尽量使用合成/聚合，尽量不要使用继承。\n\
