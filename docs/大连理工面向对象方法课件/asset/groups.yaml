  md: "\n\n## 6. 参与者\n\n- Context（环境，如TCPConnection）\n  - 定义客户感兴趣的接口，并且保留一个具体状态类的实例，这个具体状态类的实例给出此环境对象的现有状态。\n\
    \n- State（状态，如TCPState）\n  - 定义一个接口用以封装环境（Context）对象的一个特定状态所应的行为。\n\n- ConcreteState\
    \ subclasses（具体状态子类，如TCPEstablished, TCPListen, TCPClosed）\n  - 每一子类都实现了一个Context的一个状态所对应的行为。\n\
    \n## 7. 协作\n\n- Context将与状态相关的请求委托给当前的ConcreteState对象处理。\n- Context可将自身作为一个参数传递给处理该请求的状态对象。\n\
    - Context是客户使用的主要接口。客户可用状态对象来配置一个Context，一旦一个Context配置完毕，它的客户不再需要直接与状态对象打交道。\n\
    - Context或ConcreteState子类都可决定哪个状态是另外哪个的后继者，以及是在何种条件下进行状态转换。\n\n## 8. 效果\n\nState模式有下面一些效果：\n\
    \n1. 它将与特定状态相关的行为局部化，并且将不同状态的行为分割开来，State模式将所有与一个特定的状态相关的行为都放入一个对象中。因为所有与状态相关的代码都存在于某一个State子类中，所以通过定义新的子类可以很容易的增加新的状态和转换。\n\
    \n另一个方法是使用数据值定义内部状态并且让Context操作来显式地检查这些数据。但这样将会使整个Context的实现中遍布看起来很相似的条件语句或case语句。增加一个新的状态可能需要改变若干个操作，这就使得维护变得复杂了。State模式避免了这个问题，但可能会引入另一个问题，因为该模式将不同状态的行为分布在多个State子类中。这就增加了子类的数目，相对于单个类的实现来说不够紧凑。但是如果有许多状态时这样的分布实际上更好一些，否则需要使用巨大的条件语句。\n\
    \n# Composite模式的关键是一个抽象类，它既可以代表图元，又可以代表图元的容器。\n\n在图形系统中的这个抽象类就是Graphic，它声明一些与特定图形对象相关的操作，例如Draw。同时它也声明了所有的组合对象共享的一些操作，例如一些操作用于访问和管理它的子部件。\n\
    子类Line、Rectangle和Text（参见前面的类图）定义了一些图元对象，这些类实现Draw，分别用于绘制直线、矩形和正文。由于图元都没有子图形，因此它们都不执行与子类有关的操作。\n\
    \nPicture类定义了一个Graphic对象的聚合。Picture的Draw操作是通过对它的子部件调用Draw实现的，Picture还用这种方法实现了一些与其子部件相关的操作。由于Picture接口与Graphic接口是一致的，因此Picture对象可以递归地组合其他Picture对象。\n\
    下图是一个典型的由递归组合的Graphic对象组成的组合对象结构。\n\n![](img/3b4669cf00b2833fe526284506f3f342_284_1.png)\n\
    \n## 3. 适用性\n\n以下情况使用Composite模式：\n• 想表示对象的部分-整体层次结构。\n• 希望用户忽略组合对象与单个对象的不同，用户将统一地使用组合结构中的所有对象。\n\
    \n## 4. 结构\n\n典型的Composite对象结构如下图所示。\n\n## 5. 参与者\n\n- Component (Graphic)\n \
    \ - 为组合中的对象声明接口。\n  - 声明一个接口用于访问和管理Component的子组件。\n- Leaf (Rectangle、Line、Text等)\n\
    \  - 在组合中表示叶节点对象，叶节点没有子节点。\n  - 在组合中定义图元对象的行为。\n- Composite (Picture)\n  - 定义有子部件的那些部件的行为。\n\
    \  - 存储子部件。\n  - 在Component接口中实现与子部件有关的操作。\n- Client\n  - 通过Component接口操纵组合部件的对象。\n\
    \n举例[1]：\n\n一个文件系统（树结构）就是一个典型的合成模式系统。树的节点有两种：\n1. 为树枝结点：目录节点，有内部树结构\n2. 为树叶结点：文件节点，没有内部树结构\n\
    \n显然，把目录和文件当作同一种对象同等对待和处理，这也就是合成模式的应用。\nC:\\Windows\\Program Files\\System32\\\
    System \\\\Winhelp.exe\n在根目录下C:\\boot.ini\n\n## 6. 协作关系\n\n用户使用Component类接口与组合结构中的对象进行交互：\n\
    （1）如果接收者是一个叶节点，则直接处理请求。\n（2）如果接收者是Composite，它通常将请求发送给它的子部件。\n\n## 7. 效果\n\nComposite模式\n\
    \n- 定义了包含**基本对象**和**组合对象**的类层次结构。基本对象可以被组合成更复杂的组合对象，而这个组合对象又可以被组合，这样不断的递归下去。客户代码中，任何用到基本对象的地方都可以使用组合对象。\n\
    - 简化客户代码。客户可以一致地使用组合结构和单个对象。通常用户不知道(也不关心)处理的是一个叶节点还是一个组合组件。这就简化了客户代码，因为在定义组合的那些类中**不需要写一些充斥着选择语句的函数**。\n\
    - 使得更容易增加新类型的组件。新定义的Composite或Leaf子类自动地与已有的结构和客户代码一起工作，客户程序不需因新的Component而改变。\n\
    \n使设计变得更加一般，变得更加抽象也会付出一些代码。那就是很难限制组合中的组件，有时希望一个组合只能有特定的组件。依赖Composite时，不能依赖类型系统施加这些约束，而必须在运行时进行行政控制。\n\
    \n## 8. 实现\n\n我们在实现Composite模式时需要考虑以下问题：\n\n声明管理子部件的操作。\n\n虽然Composite类实现了Add和Remove操作用于管理子部件，但在Composite模式中一个重要的问题是：在Composite类层次结构中哪一些类声明这些操作。\n\
    \n我们是应该在Component中声明这些操作，使这些操作对Leaf类有意义呢？还是只应该在Composite和它的子类中声明并定义这些操作呢？\n\n\
    这需要在安全性和透明性之间做出选择。 例子P413\n\n- 在类层次结构的根部定义子节点管理接口的方法具有良好的透明性，因为可以一致地使用所有的组件，但是这一方法是以安全性为代价的，因为客户有可能会做一些无意义的事情，例如在Leaf\
    \ 中增加和删除对象等。实质上：合成对象和树叶对象是不一致的。\n- 在Composite类中定义管理子部件的方法具有良好的安全性，因为在象C++这样的静态类型语言中，在编译时任何从Leaf中增加或删除对象的尝试都将被发现，所以这个方法解决安全性问题。但是这又损失了透明性：**接口不一致**。\n\
    在这一模式中，相对于安全性，我们比较强调透明性。\n\n一种解决办法是在Component类中声明一个操作：\nComposite* GetComposite()\n\
    \nComponent提供了一个返回空指针的缺省操作。Composite类重新定义这个操作并通过this指针返回它自身。\nclass Composite;\n\
    \nclass Component {\npublic:\n//...\nvirtual Composite* GetComposite() { return\
    \ 0; }\n};\n\nclass Composite : public Component {\npublic:\nvoid Add(Component*);\n\
    // ...\nvirtual Composite* GetComposite() { return this; }\n};\n\nclass Leaf :\
    \ public Component {\n// ...\n};\n\nGetComposite 允许查询一个组件看它是否是一个组合，可以对返回的组合安全地执行Add\
    \ 和Remove操作。\n\nComposite* aComposite = new Composite;\nLeaf* aLeaf = new Leaf;\n\
    \nComponent* aComponent;\nComposite* test;\n\naComponent = aComposite;\nif (test\
    \ = aComponent->GetComposite()) {\n    test->Add(new Leaf);\n}\n\naComponent =\
    \ aLeaf;\n\nif (test = aComponent->GetComposite()) {\n    test->Add(new Leaf);\
    \ // will not add leaf\n}\n\n图 13-13 代码\n\n"
