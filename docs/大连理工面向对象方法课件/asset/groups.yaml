  - "[PAGE 52]\n\n![](img/3b4669cf00b2833fe526284506f3f342_52_0.png)\n\n# 8. 如何实现\n\
    \nSingleton 模式使得这个唯一实例是类的一般实例，但该类被写成只有一个实例能被创建。\n\n想要做到这一点的一个常用方法是将创建这个实例的操作隐藏在一个类操作（即一个静态成员函数或者是一个类方法）里面，由它保证只有一个实例被创建。这个操作可以访问保存唯一实例的变量，而且它可以保证这个变量在返回值之前用这个唯一实例初始化。这种方法保证了单件在它的首次使用前被创建和使用。\n\
    \n如何做：在 C++中可以用 Singleton 类的静态成员函数 Instance 来定义这个类操作。 Singleton 还定义了一个静态成员变量 _instance，它包含了一个指向它的唯一实例的指针。\n\
    \nSingleton 类定义如下：\n\n```\nclass Singleton {\npublic:\n    static Singleton* Instance();\n\
    protected:\n    Singleton();\nprivate:\n    static Singleton* _instance;\n};\n\
    ```\n\n相应的实现是：\n\n```\nSingleton* Singleton::_instance = 0;\n```"
