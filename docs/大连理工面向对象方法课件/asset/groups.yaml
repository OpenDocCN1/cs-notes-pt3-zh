    # # 软件的架构与设计模式之模式的种类介绍


    来源：网友推荐


    由于[GOF95]是论述软件模式著作的第一本，也是 OO 设计范畴当中最流行的一本，因此有些人喜爱使用设计模式（Design Pattern）一词来指所有在提及软件的架构、设计、程序实现的任何种类的模式。另外一些人则想要划分出三种不同层次的模式：架构模式(Architectural
    Pattern)、设计模式(Design Pattern)、成语(idiom)，或将其称为代码模式(Coding Pattern)。


    这三者之间的区别在于三种不同的模式存在于它们各自的抽象层次和具体层次上。架构模式是一个系统的层次架构，涉及到大尺度的组件以及整体性质和力学。架构模式的好处可以影响到总体各种框架性结构。设计模式是中等尺度的结构策略，这些中等尺度的结构实现了一些大尺度组件的行为和它们之间的关系。模式代码并不一定能够对系统总体各种结构有影响。设计模式定义了子系统组件间的规则机制，代码模式（或成语）是特定编程语言中特定语言有关的编程技巧，代码模式的好处会影响到一个中等尺度组件的内部，外部的结构行为的规范性细节，但不会影响到一个组件子系统的中等尺度结构，更不会影响到系统总体各种层次尺度框架。


    # ## 代码模式或成语(Coding Pattern 或 Idiom)


    代码模式（或成语）是较较层次的模式，并与编程语言密切相关。代码模式能够利用到一个特定的编程语言特点来实现一个组件的某些特定方面或关系。


    较为著名的代码模式例子包括双检锁（Double-Check Locking）模式等。


    # ## 设计模式(Design Pattern)


    一个设计模式提供一种规范子系统或软件系统中的组件的，或者它们之间的关系的解决设计。设计模式描述普遍存在的在相互通信的组件中重复出现的结构，这种结构解决在一定的背景中具有一般性的设计问题。


    设计模式常常划分成不同的种类，常见的种类有：


    创建型设计模式：如工厂方法（Factory Method）模式、抽象工厂（Abstract Factory）模式、原型（Prototype）模式、单例（Singleton）模式、建造（Builder）模式等


    结构型设计模式：如合成（Composite）模式、装饰（Decorator）模式、代理（Proxy）模式、享元（Flyweight）模式、门面（Facade）模式、桥梁（Bridge）模式等


    行为型模式：如模板方法（Template Method）模式、观察者（Observer）模式、迭代子（Iterator）模式、责任链（Chain of Responsibility）模式、备忘录（Memento）模式、命令（Command）模式、状态（State）模式、访问者（Visitor）模式等等。


    以上是三种经典类型，实际上还有很多其他的类型，比如 Fundamental 型、Partition 型、Relation 型等等


    设计模式在特定的编程语言中实现的时，常常会用到代码模式，比如单例（Singleton）模式的实现常常涉及到双检锁（Double-Check Locking）模式等。


    # ## 架构模式(Architectural Pattern)


    一个架构模式描述软件系统里的基本的结构组织或架构。架构模式提供一些事先定义好的子系统，指定它们的责任，并给出它们包括在一起的法则和准则。有些作者把这种架构模式叫做系统模式[STELTING02]。


    一个架构模式常常可以分解成多个设计模式的联合使用。显然，MVC 模式是属于这一种模式。MVC 模式常常包括观察者（Mediator）模式、策略（Strategy）模式、合成（Composite）模式、观察者（Observer）模式等。


    此外，常见的架构模式还有：'
  - '[PAGE 276]


    -Layers（分层）模式，有时也称Tiers模式


    -Blackboard（黑板）模式


    -Broker（中介）模式


    -Distributed Process（分散进程）模式


    -Microkernel（微核）模式


    架构模式常常组合成如下的几种：


    一、From Mud to Structure 型，帮助架构师将系统合理划分，避免形成一个对象的海洋（A sea of objects）。包括Layers（分层）模式，Blackboard（黑板）模式，Pipes/Filters（管道过滤器）模式等。


    二、分散系统（Distributed Systems）型，为分散式系统提供完整的架构设计，包括Broker（中介）模式等。


    三、人机互动（Interactive Systems）型，支持包含有人机互动方面的系统的架构设计，例子包括MVC（Model-View-Controller）模式，PAC（Presentation-Abstraction-Control）模式等。


    四、Adaptable Systems 型，支持应用系统适应技术的变化，软件功能需求的变化，如Reflection（反射）模式，Microkernel（微核）模式等。'
