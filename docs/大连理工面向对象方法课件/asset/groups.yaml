    \n由于在使用多重继承时，派生类可以以不同的途径来从基类中继承成员名，因此就有可能出现二义性。如下面的例子：\n\n```cpp\n#include <iostream.h>\n\
    #include <iomanip.h>\nclass A\n{\npublic:\n    int a()\n    {\n        return\
    \ 1;\n    }\n};\nclass B\n{\npublic:\n    float a()\n    {\n        return float(1.2345);\n\
