  md: "\n人工智能、计算机辅助设计和辅助制造等，所需处理的数据也已从简单的数字和字符串发展为记录在各种介质上并且有多种格式的多媒体数据，如数字、正文、图形、声音和影像等。数据量和数据类型的空前激增导致了许多程序的规模和复杂性均接近或达到了用结构化程序设计方法无法管理的程度。\n\
    \n为了最大限度的用已有的资源并减少程序开发的工作量，需要有一种比传统的过程式结构化程序设计方法抽象能力更强的新方法，面向对象的程序设计方法正是在这种背景下诞生的。\n\
    \n## 三．面向对象的基本概念、机制和原理\n\n### 3.1 面向对象方法\n\n#### 3.1.1 什么是面向对象方法\n\n所谓方法学是指组织软件生产过程的一系列方法、技术和规范。方法学是思路不是定律。\n\
    \n面向对象的方法学认为：客观世界是由对象组成的，任何有生命历程的事物都是对象，每个对象都有自己的运动规律和内部状态。通过归纳法将系统中具有相同或相似行为的对象抽象为对象类（类class），类是对这些相似行为的对象的统一描述，每个对象都是某个类的实例对象。对象之间相互作用、相互协作构成整个世界。类之间也存在着共同的特性，抽象出来称为基类，基类体现了各个相关类的一般特性，也可认为各个相关类是通过继承基类的特征并增加新的内容而形成的派生类，类的这种继承层次充分反映了现实世界中的分类结构。在这个层次结构中，可以进一步推理，按照演绎的方法发现新的类，从而进一步完善我们对系统的了解，同时，每个类都通过一定的结构来维护其表达的知识和内部状态，并通过定义一组方法来说明其功能。对象外部只能根据其接口中提供的方法来访问对象，对象间的联系是通过传递消息相互征求、相互协作，消息就是通知对象完成一定的操作，而该对象是如何完成这一消息要求的细节将被封装在该对象类定义的内部，对外是隐藏的。\n\
    \n### 重要内容：\n\n#### 1．概念\n\n面向对象方法是比较自然的模拟了人类认识问题的过程。它利用抽象、封装等机制，借助于对象、类、继承、多态以及消息传递等概念进行软件系统构造的软件开发方法。\n\
    \n或者说，面向对象不仅是具体的软件开发技术与策略，而且是一整套关于如何看待现实世界与软件系统的关系、以什么观点来研究问题并进行求解，以及如何进行系统构造的软件方法学。\n\
    \n它包含以下重要概念：类、对象、封装、信息隐藏、消息、继承、多态性等。\n\n#### 2．思想（面向对象方法的基本思想）\n\n- （1）从现实世界中客观存在的事物（即对象）出发来构造软件系统，并在系统的构造过程中尽可能运用人类的自然思维方式。\n\
    - （2）面向对象方法强调直接以问题域中的事物为中心来思考问题、识别问题，并根据这些事物的本质特征，把他们抽象地表示为系统中的对象，作为系统中的基本构成单位。\n\
    - （3）面向对象方法更加强调运用人类在日常逻辑思维中经常采用的思想方法，如抽象、分类、继承等。\n\n### 3.1.2 为什么要用面向对象\n\n软件技术和方法的发展速度远远落后于硬件系统的发展，软件很难满足应用系统的需求，软件从诞生到现在虽然经历了几次变革，但是并没有突破原有程序的执行逻辑，发展是非常缓慢的，迫切希望有一种全新的软件及软件开发方法的出现和支持。\n\
    \n#### 1. 直接原因：硬件的发展较快；软件的发展相对落后。\n\n#### 2. 间接原因：\n\n- （1） 人机交互的用户界面与软件的重用性\n\
    \n① 人与计算机之间相互传递信息的交互能力；60年代后，虽然软件、硬件技术得到了发展，但人们却不知道如何利用这些技术去构造良好的机器界面。据统计，目前采用图形用户界面（GUI）的典型软件系统中，约有75%的程序代码与用户界面有关，只有25%的代码可用于计算。\n\
    \n② 重用：软件系统开发所进行的软件与用户进行交互作用的设计，包含了很大的重复性，界面独立于计算，面向领域的不同开发项目之间，交互接口非常相似，重复开发一些很相似但是又不通用的用户接口必然造成浪费。\n\
    \n实际上，在计算机软件系统中，重用现象比比皆是，数组、队列、栈等在软件系统的设计中都是经常使用的软件成份。但是按照软件生命周期进行的软件开发以及采用传统的结构化技术却无法重用这些软件成份，每次只能从头做起。\n\
    \n所谓重用指的是同一个事物不做任何修改或稍作修改就可多次重复使用，例如，用旧的部件装配一台新的设备，借助以往的知识解决新问题等。\n\n重用的三个层次：\n\
    \n- 知识的重用\n- 方法和标准的重用\n- 软件成分的重用\n\n在开发一个新的软件时，40%~60%的代码是重复以前的工作，个别的高达80%，显然有效利用软件重用技术将提高软件的生产率。\n\
    \n重用的基础是系统能够提供可以重用的“标准部件”，例如一个硬件工作者每天与诺顿8255芯片、内存条、CPU等各种集成电路打交道，（不）关心什么。而软件不同，软件设计者习惯了从头开始，我们很少听到谁在挑选插件、二叉数插件、队列插件、数组插件等。因此需要一种新的软件开发技术，使得在设计阶段就能采用一种基于已有成分的自底向上的软件开发，已达到最大限度地重用。\n\
    \n③ 面向对象的方法对产生可重用的软件设计具有极大的优越性，他支持由底向上的软件开发过程。在面向对象的软件开发方法中，软件系统由对象组成的，而对象则是一个能完整的反映问题域或空间本质的实体。面向对象的程序设计方法使得程序人员摆脱了具体的数据格式与过程，而集中精力去研究所要处理的对象。由于抽象、信息隐藏等机制使得对象的内部实现与外部使用相分离，从而构成了一个很好的可重用的软件成份，即使对象内部做了修改，也不会引起外部（即系统）的变化。另一方面，这种方法在创建和组合可重用软件成分的基础上，也有很大的灵活性，它可以通过继承已有对象的性质（数据和操作）产生新的对象。\n\
    \n#### （2） 多媒体技术与软件的复杂性\n\n简单讲，多媒体是以计算机为中心，利用文字、图形、图像、动画、声音、视频等不同的媒体信息，在不同的界面上组合及交流，使得此媒体信息可以在计算机上存取、转换、编辑、同步化等，以达到电脑与使用者双向的交互式及多样化环境。\n\
    \n因此出现了数据的复杂性，面向对象的程序设计为描述这种复杂性提供了良好的机制，00中的类既反映了所描述对象的结构（数据），也定义了在其上的操作；同时通过封装、隐藏、抽象等技术，为解决复杂性问题提供了强有力的手段。\n\
    \n#### ① 软件工程的观点：已经有的资源非常宝贵，应该可重用\n\n#### ② 推动软件发展的重要因素是抽象级别的提高。\n\n传统的软件不能有效、全面地支持这两个内容。\n\
    另外，在00方法中，问题求解是以对象为中心，采用消息传递机制作为对象之间相互通讯的唯一方式，对象本身具有很强的自执行和独立性，接受消息的对象将其自己的方法独立地负责并处理所接收到的消息，而与发送消息的对象无关。发送消息的对象可将同一条消息同时发送到多个接受消息的对象中，并允许这些接受同一条消息的对象按照自身的适当方法加以响应，这就使00方法很自然地与分布式并行程序、多级系统、网络通讯等领域取得一致。从而强有力地支持着重大而复杂系统的开发与研制。\n\
    \n### 〈小结〉\n\n- 一、面向对象方法是软件理论的逐步归真（去掉外在的装饰，恢复原来的质朴状态）\n- 二、研究各种软件开发方法的目的\n  -\
