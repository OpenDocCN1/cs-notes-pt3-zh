    # 13.3 工厂方法模式在农场系统中的实现


    # 系统的优化


    现在继续考察农场的管理系统。在本书的“简单工厂（Simple Factory）模式”一章里，讨论了支持水果类作物的系统。在那个系统中，有一个全知全能的园丁角色（FruitGardener），控制所有作物的种植、生长和收获。现在这个农场的规模变大了，而且涉及的是真实更加专业化了。过去的全能人物没有了，每一种农作物都有专门的园丁管理，形成规模化和专业化生产。


    # 系统的设计


    取代了过去的全能角色的是一个抽象的园丁角色，这个角色规定出具体园丁角色需要实现的具体职能，而真正负责作物管理的则是负责各种作物的具体园丁角色。


    这一章仍然考虑前面所讨论的植物，包括葡萄（Grape）、草莓（Strawberry）以及苹果（Apple）等。专业化的管理要求将有专门的园丁负责专门的水果，比如苹果由“苹果园丁”负责，草莓有“草莓园丁”负责，而葡萄由“葡萄园丁”负责。这些“苹果园丁”、“草莓园丁”以及“葡萄园丁”都是实现了抽象的“水果园丁”接口的具体工厂类，而“水果园丁”则扮演抽象工厂角色。


    这样一来，农场系统的设计图就如下图所示。


