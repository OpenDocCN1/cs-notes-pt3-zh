    # 3. 适用性


    在遇到以下情况使用Facade模式：


    +   - **当要为一个复杂子系统提供一个简单接口时。** 子系统往往因为不断演化而变得越来越复杂。大多数模式使用时都会产生更多更小的类。这使得子系统更易可重用性，也更容易对于系统进行定制，但这些细部还不需要定制子系统的用户带来一些使用上的困难。


    Facade可以提供一个简单的缺省视图，这一视图对大多数用户来说已经足够，而那些需要更多的可定制性的用户可以越过Facade层。


    +   - **客户端与抽象类的实现部分之间存在着很大的依赖性。** 引入Facade将这个子系统与其内部的子系统分离，可以提高子系统的独立性和可移植性。


    +   - **当需要构建一个层次结构的子系统时，** 使用Facade模式定义子系统中每层的入口点。


    # 4. 结构


    ![](img/3b4669cf00b2833fe526284506f3f342_112_1.png)'
  - '[PAGE 113]


    # 5. 参与者


    +   • Facade (Compiler)

    +     — 知道哪些子系统类负责处理请求。

    +     — 将客户的请求代理给适当的子系统对象。

    +   • Subsystem classes (Scanner、Parser、ProgramNode等)

    +     — 实现子系统的功能。

    +     — 处理由Facade对象指派的任务。

    +     — 没有Facade的任何相关信息；即没有指向Facade的指针。


    # 6. 协作


    +   • 客户程序通过发送请求给Facade的方式与子系统通信；

    +   • Facade将这些消息转发给适当的子系统对象；

    +   • 尽管是子系统中的有关对象在做实际工作，但Facade模式本身也必须将它的接口转换成子系统的接口。

    +   • 使用Facade的客户程序不需要直接访问子系统对象。


    # 7. 效果


    Facade模式有下面一些优点：

    1) 它对客户屏蔽子系统组件，因而减少了客户处理的对象的数目并使得子系统使用起来更加方便。

    2) 它实现了子系统与客户之间的松耦合关系，而子系统内部的功能组件往往是紧耦合的。


    松耦合关系使得子系统的组件变化不会影响到它的客户。Facade模式有助于建立层次结构系统，也有助于对对象之间的依赖关系分层。Facade模式可以消除复杂的循环依赖关系。这一点在客户程序与子系统是分别实现的时候尤为重要。

    在大型软件系统中降低编译依赖性至关重要。在子系统改变时，希望尽量减少重编译工作以节省时间。用Facade可以降低编译依赖性，限制重要系统中较小的变化所需的重编译工作。Facade模式同样也有利于简化系统在不同平台之间的移植过程，因为编译一个子系统一般不需要编译所有其他的子系统。


    # 8. 实现


    使用Facade模式时需要注意以下几点：

    1) 降低客户-子系统之间的耦合度。用抽象类实现Fa¸cade，而它的具体子类对应于不同的子系统实现，这可以进一步降低客户与子系统的耦合度。这样，客户就可以通过抽象的Facade类接口与子系统通讯。这种抽象耦合关系使得客户不知道它使用的是子系统的哪一个实现。


    2) Facade类是公共接口的一部分。

    子系统（包含若干个类）也可以有公共接口（如全部的类），子系统的其他部分通常也可以是公共的。例如，编译子系统中的Parser类和Scanner类就是公共接口的一部分。'
  - "[PAGE 114]\n\n# 注意：\n\n# 1. 迪米特法则（Law of Demeter LoD）\n\n迪米特法则讲的是，一个软件实体应当与尽可能少的其他实体发生相互作用，除非绝对需要。即使必须进行通信，也应当尽量限制通信的广度和深度。\n\
    \n当一个系统面临功能扩展的时候，其中会有一些模块，它们需要修改的压力比其他一些模块要大。最后的结果可能是这些模块需要修改或者不需要修改。但是不论哪一种情况，如果这些模块是相对独立的，那么他们就不会将修改的压力传递给其他的模块。\n\
    \n这就是说，一个软件应该设计出一个系统在功能需要扩展时，会相对更容易地做到对修改的关闭。也就是说，迪米特法则是一条通过“开-闭”原则的道路。\n\nFacade模式支持了该法则。\n\
    \n# 2. 接口隔离原则（Interface Segregation Principle ISP）\n\n接口隔离原则讲的是，应该为客户提供尽可能小的单独的接口，而不要提供大的总接口。\n\
    \n或者说：接口隔离原则——使用多个专门的接口比使用单一的总接口要好。也就是说，一个类对另外一个类的依赖性应当是建立在最小的接口上。\n\n显然，接口隔离原则与广义的迪米特法则都是对一个软件实体与其他的软件实体的通信的限制。广义的迪米特法则要求尽可能限制通信的宽度和深度。接口隔离原则所限制的是通信的宽度，\n\
    \n也就是通过接口来限制依赖的跨越。\n\nFacade模式与该法则的关系要注意。\n\n# 举例：\n\n一个保安系统由两个录像机、三个电灯、一个遥感器和一个报警器组成，操作人员需要经常开、关这些仪器，下面分别用非门面模式和门面模式进行设计。\n\
    \n+   1. 不用facade的方法\n\n```\n```cpp\nclass Client{\n    private:\n        Camera\
    \ camera1,camera2;\n        Light light1,light2,light3;\n        Sensor sensor;\n\
    ```\n```"
