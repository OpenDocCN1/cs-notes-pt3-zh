  mdcn: "\n\n## 4.如何实现晚捆绑\n\na. 晚捆绑如何发生？所有的工作都由编译器在幕后完成。当我们告诉它去晚捆绑时（用创建虚函数告诉它），编译器安装必要的晚捆绑机制。\n\
    \nb. 关键字virtual告诉编译器它不应当完成早捆绑，相反，它应当自动安装实现晚捆绑所必须的所有机制。\n\nc. 为了完成这件事，编译器对每个包含虚函数的类创建一个表（称为VTABLE）。在VTABLE中，编译器放置特定类的虚函数地址。在每个带有虚函数的类中，编译器秘密地置一指针，称为vpointer（缩写为VPTR），指向这个对象的VTABLE。通过基类指针做虚函数调用时（也就是做多态调用时），编译器静态地插入取得这个VPTR，并在VTABLE表中查找函数地址的代码，这样就能调用正确的函数使虚拟函数发生。\n\
    \nd. 为每个类设置VTABLE、初始化VPTR、为虚函数调用插入代码，所有这些都是自动发生的，所以我们不必担心这些。利用虚函数，这个对象的合适的函数就能被调用，哪怕在编译器还不知道这个对象的特定类型的情况下。以下分别阐述：\n\
    \n### (1) 存放类型信息\n\n可以看到，在任何类中，不存在显式的类型信息。而先前的例子和简单的逻辑告诉我们，必须有一些类型信息放在对象中，否则，类型不能在运行时建立。实际上，类型信息被隐藏了。为了看到它，这里有一个例子，可以测试使用虚函数的类的长度，并与没有虚函数的类比较。\n\
    \n```cpp\n//: C15:Sizes.cpp\n// Object sizes vs. virtual funcs\n#include <iostream>\n\
    using namespace std;\n\nclass NoVirtual {\n int a;\npublic:\n void x() const {}\n\
    \ int i() const { return 1; }\n};\n\nclass OneVirtual {\n int a;\npublic:\n  \
    \  virtual void x() const {}\n    int i() const { return 1; }\n};\n\nclass TwoVirtuals\
    \ {\n    int a;\npublic:\n    virtual void x() const {}\n    virtual int i() const\
    \ { return 1; }\n};\n\nint main() {\n    cout << \"int: \" << sizeof(int) << endl;\n\
    \    /*4*/\n    cout << \"NoVirtual: \"\n        << sizeof(NoVirtual) << endl;\n\
    \    /*4*/\n    cout << \"void* : \" << sizeof(void*)<< endl;\n    /*4*/\n   \
    \ cout << \"OneVirtual: \"\n        << sizeof(OneVirtual) << endl;\n    /*8*/\n\
    \    cout << \"TwoVirtuals: \"\n        << sizeof(TwoVirtuals) << endl;\n// ...\n\
    }\n```\n\n不带虚函数，对象的长度恰好就是所期望的：单个int的长度。而带有单个虚函数的one_virtual，对象的长度是no_virtual的长度加上一个void指针的长度。它反映出，如果有一个或多个虚函数，编译器在这个结构中插入一个指针（VPTR）。在one_virtual和two_virtuals之间没有区别。这是因为VPTR指向一个存放地址的表，只需要一个指针，因为所有虚函数地址都包含在这个表中。\n\
    \n### （2）对虚函数作图\n\n+ a. 为了准确地理解使用虚函数时编译器做了些什么，使屏风之后进行的活动看得见是有帮助的。这里给出WIND4.CPP中的指针数组A[]。\n\
    \n+ b. 这个instrument指针数组没有特殊类型信息，它的每一个元素指向一个类型为instrument的对象。\n\n+ c. WIND、percussion、string和brass都适合这个范围，因为它们都是从instrument派生来的（并且和instrument有相同的接口和响应相同的消息），因此，它们的地址也自然能放进这个数组里。然而，编译器并不知道它们比instrument对象更多的东西，所以，留给它们自己处理，而通常调用所有函数的基类版本。\n\
    \n+ d. 但在这里，所有这些函数都被声明为virtual声明，所以出现了不同的情况。每当创建一个包含有虚函数的类或从包含有虚函数的类派生一个类时，编译器就为这个类型创建一个VTABLE，如图所示。\n\
    \n+ e. 在这个表中，编译器放置了在这个类中或在它的基类中所有已声明为virtual函数的地址。\n\n+ f. 如果在这个派生类中没有对在基类中声明为virtual的函数进行重新定义，编译器就使用基类的这个虚函数地址。（在brass的VTABLE中，adjust的入口就是这种情况。）然后编译器在这个类中放置VPTR（同步化可在SIZE.CPP中发现）。当使用简单继承时，对于每个对象只有一个VPTR。VPTR必须被初始化为指向相应的VTABLE。（这在构造函数中发生，在稍后会看得更清楚。）\n\
    \n+ g. 一旦VPTR被初始化为指向相应的VTABLE，对象就“知道”它自己是什么类型。但只有当虚函数被调用时这种自我知识才有用。通过基类地址调用一个虚函数时（这时编译器没有能完成早捆绑的足够的信息），要特殊处理。它不是实现典型的函数调用，比如对特定地址的汇编语言CALL，而是编译器为完成这个函数调用产生不同的代码。下面看到的是通过instrument指针对brass调用adjust()。\n\
    \n可以看到，这个例子已在Wind之下增加了另外的继承层，但virtual机制正确工作，不管这里有多少层。adjust()函数不对于Brass和Woodwind重定义。当出现这种情况时，自动使用先前的定义——编译器保证虚函数总是有定义的，所以，决不会最终出现调用不与函数体捆绑的情况。\n\
    \n数组A[]存放指向基类instrument的指针，所以在数组初始化过程中发生向上映射。这个数组和函数f()将在稍后的讨论中用到。\n\n在对tune()的调用中，向上映射在对象的每一个不同的类型上完成。期望的结果总是能得到。这可以被描述为“发送消息给一对象和让这个对象考虑用它来做什么”。virtual函数是在试图分析项目时使用的透镜：基类应当出现在哪里？应当如何扩展这个程序？然而，在程序最初创建时，即便我们没有发现合适的基类接口和虚函数，在稍后甚至更晚，当我们决定扩展或维护这个程序时，我们也常常会发现它们。这不是分析或设计错误，它只意味着一开始我们还没有所有的信息。由于C++严格的模块化，这并不是大问题。因为我们对系统的一部分作了修改时，往往不会C那种波及系统的其他部分。\n\
    \n```cpp\npublic:\n    virtual void play(note) const {\n        cout << \"Instrument::play\"\
    \ << endl;\n    }\n};\n// Wind objects are Instruments\n// because they have the\
    \ same interface:\nclass Wind : public Instrument {\npublic:\n    // Redefine\
    \ interface function:\n    void play(note) const {\n        cout << \"Wind::play\"\
    \ << endl;\n    }\n};\nvoid tune(Instrument& i) {\n    // ...\n    i.play(middleC);\n\
    }\nint main() {\n    Wind flute;\n    tune(flute); // Upcasting\n} //~\n```\n\n\
    //Wind管乐器\nclass Wind : public Instrument {\npublic:\nvoid play(note) const {\n\
    cout << \"Wind::play\" << endl;\n}\nchar* what() const { return \"Wind\"; }\n\
    void adjust(int) {\ncout<< \"Wind::adjust\" << endl;\n}\n};\n\n// Percussion 打击乐器\n\
    class Percussion : public Instrument {\npublic:\nvoid play(note) const {\ncout\
    \ << \"Percussion::play\" << endl;\n}\nchar* what() const { return \"Percussion\"\
    ; }\nvoid adjust(int) {\ncout<< \"Percussion::adjust\" << endl;\n}\n};\n\n//Stringed弦乐器\n\
    class Stringed : public Instrument {\npublic:\nvoid play(note) const {\ncout <<\
    \ \"Stringed::play\" << endl;\n}\nchar* what() const { return \"Stringed\"; }\n\
    void adjust(int) {\ncout<< \"Stringed::adjust\" << endl;\n}\n};\n\n// Brass铜管乐器\n\
    class Brass : public Wind {\npublic:\nvoid play(note) const {\ncout << \"Brass::play\"\
    \ << endl;\n}\nchar* what() const { return \"Brass\"; }\n};\n\n// Woodwind木管乐器\n\
