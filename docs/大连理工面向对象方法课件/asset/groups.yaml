    ## 步骤 7： 指定原型类型


    UML 有一个原型的概念，这个概念可以用来创建新类型的建模元素。它提供了为模型添加含义的能力。因为它是一个代表 billing system 外部接口的一个类，所以我们将使用预定义的
    BillingSystem 类的接口原型。又因为这将最终成为某种 GUI 表格，所以我们将使用 RegForm 类的表格原型，如图 16 所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_7_1.png)


    双击 Main 类中的 BillingSystem 类，打开定义（Specification）窗口，点击 Stereotype 域的箭头，显示下拉菜单。选择接口原型（Interface
    stereotype），选择 OK 按钮，关闭 Specification 窗口。对 RegForm 类重复上述步骤。


    ## 步骤 8： 设置关系类型


    为了便于对象间的通信，可添加类间的关系。顺序图就是用于检查一个对象是否必须同另一个对象通信。如果是必须的，那么在它们的类之间必须有一个通信的路径。两种常见的关系类型是关联和聚合。

    关联是类间的一个双向连接。通过检查“添加流程（Add a Course）”顺序图，我们能够决定下述关联是否存在：RegForm 与 Manager、Manager
    与 Course 和 Manager 与 Bill，如图 17 所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_8_0.png)


    图 17


    在从工具条上点击**关联**图标（线条）。


    点击 *RegForm* 类，并将先拖到 *Manager* 类。


    重复上述步骤，给如下的类间添加关系：


    * Manager 与 *Course*

    * Manager 与 *BillingSystem*


    **聚合**是**关联**的一种增强形式，它体现了整体与部分之间的关系。我们将在 Course 与 CourseOffering 之间创建一个**聚合**关系（Course
    由 CourseOfferings 组成的），如图 18 所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_8_1.png)


    图 18


    + 1. 点击工具条上的**聚合**图标（带有菱形的线）

    + 2. 点击类 CourseOffering

    + 3. 拖动**聚合线**到 Course 类


    **Multiplicity indicators** 被添加到模型中的关系中，它将显示这个关系连接了多少个对象，如图 19 所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_9_0.png)


    1. 在 CourseOffering 类的聚合线附近点击鼠标右键

    2. 选择 Multiplicity： One or More 菜单命令

    3. 在 Course 类的聚合线附近点击鼠标右键

    4. 选择 Multiplicity： 1 菜单命令


    ## 步骤 9： 设置属性


    类的一系列属性显示了类的结构。这种结构是在研究需求分析问题时发现的，并经过这个领域的专家和客户转化而来。在我们的模型中，每个 CourseOffering
    被放在一个特定的地方——这是一个属性，如图 20 所示。

    在类图中的 CourseOffering 类处，点击鼠标右键。

