    同一时间，只允许一个 pair 进行整合。（整合失败是不是要退回原有状态，供其他 pair 整合？？）


    **7）共同拥有代码**

    鼓励每个人对项目中的任何人提出新的想法，任何开发人员对项目中的任何代码都可以进行增加功能，改正错误和重构。没有代码或开发人员成为瓶颈。（我的想法：这种实践很难理解，但是这确实是我梦想的目标）。为了达到这个目标，任何的代码都必须有相应的测试代码，任何代码的修改必须
    100% 通过测试。必须加强开发人员的交流和知识共享，必须坚持统一编码标准。Pair programming 可以经常交换伙伴。


    **8）优化工作放在最后**

    先使系统能够正常工作，不要猜测系统的瓶颈，要实际测量


    **9）NO overtime**

    不要长时间的加班，大多数加班并不能挽回已有的延迟，连续超过两个星期的加班说明有问题存在。向一个已经延迟的项目填加人员也是一个不好的选择。


    # 4Testing


    **1）所有的代码都有单元测试**

    单元测试是 XP 的基石，XP 中的单元测试应该是可以自动进行的，所以可以很快的进行所有的单元测试，单元测试应该在编码之前创建。单元测试的代码和代码一起在
    release，没有单元测试的代码不能够 release。使用自动单元测试可以系统整合时节省大量的发现错误和改正的时间。单元测试越完善，节省的时间越多。对面向对象的编程来说，应该对每个类都有单元测试。完善的单元测试也是共同拥有代码的保证。单元测试也是可以经常重构的保证，每次重构后的代码都要重新进行测试。

    （这里的 unit test 好象不只限于测试某个模块的功能？？？，应该可以测试整合起来的整个系统，这样才能保证整合的正确性。）


    **2）代码在 release 前必须通过所有的单元测试**


    **3）发现 bug 后，首先增加测试**

    在实际运行中发现 bug，首先增加 acceptance test，然后增加 unit test，在增加完测试后在查找和修改代码，增加的测试保证同样的错误不会再出现


    **4）acceptance test**

    acceptance test 根据 user stories 在 iteration plan 会议上创建，它也应该可以自动运行以便可以经常运行。User
    stories 是否完成应是是否通过 acceptance test 为检验标准。'
