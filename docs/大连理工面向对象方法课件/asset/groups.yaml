  md: "\n保证没有其他实例可以被创建（通过私有构造函数的办法），（2）并且它可以提供一个访问该实例的方法。这就是Singleton模式。具体方法：\n\n\
    - 1）Singleton类的构造函数是私有的或受保护的，表示外界的类不能够创建Singleton的对象，那样的话就导致编译错误。\n- 2）Singleton的子类中也不能创建Singleton的对象，那样的话就会调用Singleton的构造函数（这样就不对了，导致错误），子类中调用父类构造函数的方式是通过创建该子类的对象的方式进行的。\n\
    - 3）Static Instance()表示全局访问点，由于它是Singleton的成员函数，要访问它一般用“Singleton对象.Instance()”进行，但那样的话就等于提前创建了Singleton对象，与Singleton思想不符，所以用静态static。结论：对象的创建只能在Singleton类中进行。\n\
    \n### 5. 适用性\n\n在下面的情况下可以使用Singleton模式：\n\n- 当类只能有一个实例而且客户可以从一个众所周知的访问点访问它时。\n\
    - 这个唯一实例应该是通过子类可以扩展的，并且客户应该无需更改代码就能使用一个扩展的实例。\n\n### 6. 协作\n\n- 客户只能通过Singleton的Instance操作访问一个Singleton的实例。\n\
    \n### 7. 结构\n\n![](img/3b4669cf00b2833fe526284506f3f342_52_0.png)\n\n### 8. 如何实现\n\
    \nSingleton 模式使得这个唯一实例是类的一般实例，但该类被写成只有一个实例能被创建。\n\n想要做到这一点的一个常用方法是将创建这个实例的操作隐藏在一个类操作（即一个静态成员函数或者是一个类方法）里面，由它保证只有一个实例被创建。这个操作可以访问保存唯一实例的变量，而且它可以保证这个变量在返回值之前用这个唯一实例初始化。这种方法保证了单件在它的首次使用前被创建和使用。\n\
    \n如何做：在 C++中可以用 Singleton 类的静态成员函数 Instance 来定义这个类操作。Singleton 还定义了一个静态成员变量 _instance，它包含了一个指向它的唯一实例的指针。\n\
    \nSingleton 类定义如下：\n\n```cpp\nclass Singleton {\npublic:\n    static Singleton*\
    \ Instance();\nprotected:\n    Singleton();\nprivate:\n    static Singleton* _instance;\n\
    };\n```\n\n相应的实现是：\n\n```cpp\nSingleton* Singleton::_instance = 0;\n\nSingleton*\
    \ Singleton::Instance ()\n{\n    if (_instance == 0)\n    {\n        _instance\
    \ = new Singleton;\n    }\n    return _instance;\n}\n```\n\n客户仅通过Instance成员函数访问这个单件。变量\
    \ _instance初始化为0，而静态成员函数Instance()返回该变量值，如果其值为0则用唯一实例初始化它。Instance的返回值直到被第一次访问时才创建和保存。\n\
    \n注意构造器是保护型的。试图直接实例化Singleton的客户将得到一个编译时的错误信息。这就保证了仅有一个实例可以被创建。\n\n### 1. 课堂练习\
