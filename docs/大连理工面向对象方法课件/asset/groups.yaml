    # # 一、敏捷开发方法


    # ## （一）说明


    本文是阅读 Alistair Cockburn 的 Agile Software Development 和 William C. Wake 的 XP Explored
    的一些笔记和想法，Agile Software Development 是一组软件开发方法的总称，包括（Crystal，Extreme Programming，Adaptive
    software development 等等）。敏捷开发方法又称为“轻量级”开发方法。


    下面这段话摘自 Martin Fowler 的一篇文章：


    从无到繁重再到敏捷

    多多软件开发仍然是一个显得混乱的活动，即典型的“边写边改”（code and fix）。设计过程充斥着短期的，即时的决定，而无完整的规划。这种模式对小系统开发其实很管用，但是当系统变得越大越复杂时，要想加入新的功能就越来越困难。同时错误故障越来越多，越来越难于排除。一个典型的标志就是当系统功能完成后有一个很长的测试阶段，有时甚至有遥遥无期之意，从而对项目的完成产生严重的影响。

    我们使用这种开发模式已有很长时间了，不过我们实际上也有另外一种选择，那就是“正规方法”（methodology）。这些方法对开发过程有着严格而详尽的规定，以期使软件开发更有可预设性并提高效率，这种思路是借鉴了其他工程领域的实践。

    这些正规方法已存在了很长时间了，但是并没有取得令人瞩目的成功，甚至就没怎么引起人们的注意。对这些方法最常听见的批评就是它们的官僚繁琐，要是按照它的要求来，那有做太多的事情需要做，而延缓整个开发进程。所以它们通常被认为是“繁琐滞重型”方法，或
    Jim HighSmith 所称的“巨型”（monumental）方法。

    作为对这些方法的反叛，在过去几年中出现了一类新方法。尽管它们还没有正式的名称，但是一般被称为“敏捷型”方法。对许多人来说，这类方法的吸引之处'
