    稳定性度量公式：I=Ce/(Ca+Ce) (I:不稳定度，Ce:输入耦合度，Ca：输出耦合度)

    I取值范围在[0，1]，I=0表示具有最大稳定度；I=1标识具有最大不稳定度

    稳定抽象原则 **SAP**: Stabilization Abstract Principle


    **GOF** 说一一基于对象组合的设计会有更多的对象（而有较少的类）。

    如果单纯的看这里，你会明白似乎类较少符合面向对象的逻辑。

    但是且慢，我们知道面向对象有一条原则叫单一职责原则——SRP。

    这样好像类多又是面向对象思想的体现。

    其实最重要的是 GOF 中的这句话——且系统的行为将依赖对象间的关系而不是

    被定义在某个类中。

    所以类的多少并不是问题的关键，是否职责单一也不是大问题，

    最重要的是你现在的那些职责都是多少是不能被别的职责通过某种方式所代替

    的。

    在 BOB 大叔那里定义职责是变化的原因，因此就可以认为这些变化的原因应该

    是不可代替的，

    也可以说你不能由这个原因推导出别的原因。

    只要这个原因间可以做到相互关联，那么你就可以把由于这些变化而引起变化

    的类组合起来，

    而不是把他们规定在新的类中。


    开放封闭原则 OCP：Open—Close Principle


    一个模块在扩展性方面应该是开放的而在更改性方面应该是封闭的。


    因此在进行面向对象设计时要尽量考虑接口封装机制、抽象机制和多态技术。


    该原则同样适合于非面向对象设计的方法，是软件工程设计方法的重要原则之

    一。


    我们以收音机的例子为例，讲述面向对象的开闭原则。


    我们收听节目时需要打开收音机电源，对准电台频率和进行音量调节。


    但是对于不同的收音机，实现这三个步骤的细节往往有所不同。


    比如自动收缩电台的收音机和按钮式收缩在操作细节上并不相同。


    因此，我们不太可能针对每种不同**类型**的收音机通过一个收音机类来实现（通

    过重载）这些不同的操作方式。


    但是我们可以定义一个收音机接口，提供开机、关机、增加频率、降低频率、增加

    音量、降低音量六个抽象方法。'
