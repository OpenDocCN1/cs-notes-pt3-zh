    Specification）。


    输入新操作的名字——offeringOpen。


    点击 OK 按钮，关闭操作定义窗口。


    一旦一个新的操作被创建，那么消息将被映射到操作上，如图 23 所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_11_0.png)


    在消息“accepting students?”处，点击鼠标右键，将弹出快捷菜单，选择 offeringOpen() 操作。


