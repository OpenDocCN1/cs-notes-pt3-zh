  md: "\n派生类继承了基类1、基类2、……、基类n的**所有数据成员和成员函数**。<access>只限定紧跟其后的基类（**缺省值为private**），规则与单继承相同。\n\
    \n要定义具有两个以上基类的派生类，基本定义方法相同，只需将要继承的多个基类使用逗号分隔即可。例如：\n\n```cpp\nclass c : a, b\n\
    {\n    //……\n};\n```\n\nc是由a,b作为基类多重继承得来的派生类。在定义派生类时还可以定义它的访问控制。例如上述定义说明，**c类对于其基类a，b均为私有派生**。若将上述定义改为如下几种形式，类对于其基类将具有不同的派生类型：\n\
    \n```cpp\nclass c : public a, b\n{\n    //c类是对a类的公有派生，对b类的私有派生\n    //……\n};\n\
    ```\n\n```cpp\nclass c : a, public b\n{\n    //c类是对a类的私有派生，对b类的公有派生\n    //……\n\
    };\n```\n\n```cpp\nclass c : public a, public b\n{\n    //c类是对a类及b类均为公有派生\n  \
    \  //……\n};\n```\n\n在多继承中，公有派生和私有派生对于基类成员在派生类中的可访问性与单继承的规则相同。但要注意二义性。\n\n举例讲：\n\
    \n```cpp\n#include <iostream.h>\nclass x\n{\n    protected:\n        int a;\n\
    \    public:\n        void make(int i){ a=i; }\n};\nclass y\n{\n    protected:\n\
    \        int a;\n    public:\n        void make(int i){ a=i; }\n};\nclass z :\
