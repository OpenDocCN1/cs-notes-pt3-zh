    ## 1 UML 的历史


    UML 就是在这些技术的基础上，由三位伟大的面向对象大师——Grady Booch、Ivar Jacobson、Jim Rumbaugh 在 Rational
    公司的组织下，统一了各种方法之间不同的标准带来的混乱局面，终于在 1997 年 11 月 17 日（伟大的日子）正式由对象管理组织（OMG）批准 UML1.1
    成为世界标准建模语言。我们称之为统一建模语言——Unified Modeling Language。


    面向对象的思想为这种建模提供了强有力和直观的支持（嗯？--客观世界骨子程序吗？但是客观世界有“学生”这个对象，也有“课程”这个对象。瞧，面向对象对客观世界的描述是不是比结构化方法更直观，更好理解呢？--那当然啦！）。长期以来人们一直在试图创造一种面向对象的可视化的语言和方法，使建模人员能更加直观和严格的描述客观世界，并产生了一些流派，如
    Yourdon 和 Coad 的 OOA、OOD，Booch 的方法，Rumbaugh 的 OMT、Jacobson 的 OOSE 方法等。历史发展到今天，Booch、Rumbaugh
    和 Jacobson 一起合作，吸收了各种流派的优点和其他一些相关领域的成果，终于创造出一种较成熟全面的面向对象建模语言--UML（话说天下大势，合久必分，分久必合）。并把
    UML 融入 Rational 公司的 CASE 工具 ROSE 之中。ROSE 试图用 UML 语言支持软件开发的大部分过程（测试除外）的建模。在 ROSE
    中，只要你用 UML 描述了软件的各个成分（也就是说为软件建立了一个面向对象的模型），ROSE 就为你生成所需的大部分源代码（呀！这不是可以省很多时间吗？可以多玩会儿
    Quake 啦！--更重要的是，从此以后你就可以充分利用 OO 的诸多优点啦--象模型稳定性、重用等等，这将大大降低软件维护和升级的成本，别忘了，维护和升级成本往往会占总成本的百分之七、八十呢！）。


    ![](img/3b4669cf00b2833fe526284506f3f342_126_0.png)


    参见《UML教程》P4


    UML，Unified Modeling Language，统一建模语言，是一种面向对象的建模语言，它的主要作用是帮助我们对软件系统进行面向对象的描述和建模，它可以描述这个软件开发过程从需求分析直到实现和测试的全过程。


    如果你想要建造一个软件系统，首先必须先搞清楚用户需求，也就是你的软件系统的功能是什么。这是一切开发的基础。有了需求，接下来的工作就是分析系统的静态结构，看需要实现这些功能，我们的系统中必须要由哪些东西来。而系统的太体结构定下来之后，就要看这些系统成分是怎样相互配合实现系统功能（即系统的动态结构）的，同时还必须考虑与实现环境有关的细节，比如用什么语言啦，在什么操作系统上转啦，等等，这个工作，就是设计。设计工作细化到一定程度，就可以编码实现了。而最后的工作，毫无疑问，就是测试和维护。总之，这个顺序大体上就是“功能——静态结构——动态结构——编码——测试——维护”。


    我们通过一个简单的例子来浏览一下 UML 这种语言在软件系统建造的全过程中所起的作用。


    ## 3 UML 发明人


    ### 3.1 Grady Booch(格雷第.布屈)


    ![](img/3b4669cf00b2833fe526284506f3f342_128_0.png)


    Booch 是美国 Rational 软件工程公司的首席科学家和 Booch 方法的主创人。与 Rational 公司的 Ivar Jacobson、Jim
    Rumbaugh 共同创建了一种可视化地说明、建造软件系统的工业标准语言-统一建模语言 UML。UML 共 1997 年被对象管理组织 OMG 正式确定为国际标准。


    Booch 于一九七七年毕业于美国空军军官学校，并于一九七九年在加州大学圣.巴巴拉分校获得计算机工程硕士学位。Rational 公司成立不久，Booch 就加盟这个公司。在过去的十几年里他致不懈地在面向对象领域里研究，取得了开拓性的研究成果。他开发了面向对象的分析设计方法
    Booch Method 和可重用的、灵活的 Booch 组件。他还是 Rational 公司一些产品的开发者，包括该公司最初的软件工程环境 Rational
    Environment 及业界领先的可视化建模工具 Rational Rose。


