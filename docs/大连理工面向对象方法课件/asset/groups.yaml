    注意：尽管引用很像指针，但它却不是指针，所以不能用于像分配动态内存等应用指针的地方。\n\n### 总结：\n\n### 变量（对象）、引用、指针\n\n\
    是不同的。\n\n## 二、操作符 new 和 delete\n\n### 1. new\n\n**语法：** `<指针变量> = new <类型>[参数]`（能返回所需分配类型的指针）\n\
    \n**语义：** 按 new 后面的类型及其参数分配适当大小（sizeof（<类型>[参数]）的内存。\n\n例：\n\n```cpp\nint *p =\
    \ new int;\n\nint *p1 = new int(8);  // 将初始数据 8 装入所分配的空间\n\nint *p2 = new char[10];\
    \  // 在堆区分配含有 10 个元素的字符型空间\n```\n\n### 2. delete\n\n**语法：** `delete [参数] <指针变量>;`\n\
    \n**语义：** 释放指针变量所指的内存空间。\n\n例：\n\n```cpp\ndelete p;\n\ndelete p1;\n\ndelete [10]\
    \ p2;  // 或 delete [] p2;  注意释放形式\n```\n\n**注意：** 用 new 分配的空间，使用结束后应该用也只能用 delete\
    \ 显式地释放，否则这部分空间将不能回收而变成死空间。\n\n## 三、void 型指针\n\n- void 型作为指针的类型时，这种指针就是一种通用型指针。\n\
    - 当指针为通用型指针时，是指它可以接受任何类型指针的赋值，但对已获得的 void 型指针，对它再进行处理（如输出/传递指针值时），则必须再进行显式类型转换，否则将出错。\n\
    \n例3：\n\n```cpp\nvoid *p;\n\nint i = 100;\n\np = &i;\n\ncout << *p;  // 错误\n```\n\
    \n```cpp\ncout << *(int*)p; // 正确\n\nchar *c = \"abc\" ;\n\np = c; // c=p 则不可以\n\
    \ncout << p; // 错误\n\ncout << (char*)p; // 正确\n\nvoid **pp;\n\npp = p; // 正确\n\
    \nchar *cc;\n\ncc = p; // 错误\n```\n\n## 四、常量类型 const\n\n- 一般情况下，const 和 define\
    \ 在定义符号常量时功能几乎是一样的。\n\n例：const float pi = 3.14; // 限定 pi 为 float 型的常量；\nconst\
    \ int SIZE = 100; // 限定 SIZE 为 int 型的常量；\n\n- 但在定义指针变量时，const 却有不同的地方。例如：\n\n\
    - (1) const char *pc = \" abcd\" ;// 指向串常量的指针\n\n// 限定指针 pc 只能指向一个串常量，一旦赋值，它所指的值不能再修改。\n\
    \n但是可以把 pc 指向其他内存单元。即 pc 是一个可以用来读取值而不能用来修改值的指针（只读指针）。\n\n- (2) char *const pc\
    \ = \" abcd\" ;// 指向串的常量指针，pc 指向的值可以被修改，但是不能把 pc 指向其他内存单元。\n\n- (3) const char\
    \ *const pc = \" abcd\" //（1）、（2）的综合\n\n- (4) 另外：赋值时注意：\n\npc[1] = ' s' // 错\n\
    \npc = \" xyz\" // 正确\n\n## FACADE（外观，门面）—对象结构型模式\n\n### 1. 意图\n\n为子系统中的一组接口提供一个一致的界面，Facade\
    \ 模式定义了一个高层接口，这个接口使得这一子系统更加容易使用。\n\n### 2. 动机\n\n将一个系统划分成为若干个子系统有利于降低系统的复杂性。一个常见的设计目标是使子系统间的通信和相互依赖关系达到最小。这可以通过引入一个外观（Facade）对象，它为子系统中较一般的设施提供了一个单一而简单的界面。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_111_0.png)\n\n例如有一个编程环境，它允许应用程序访问它的编译子系统。这个编译子系统包含了若干个类，如\
    \ Scanner、Parser、ProgramNode、BytecodeStream 和 ProgramNodeBuilder，用于实现这一编译器。\n\n\
    - （1）有些特殊应用程序需要直接访问这些类；\n- （2）但是大多数编译器的用户（不需要直接访问这些类）并不关心语法分析和代码生成这样的细节；他们只是希望编译一些代码。\n\
    \n对于这些用户，编译子系统中那些功能强大但是又较低级的接口会使他们的任务复杂化。\n\n为了提供一个高层的接口并且对客户屏蔽这些类，编译子系统还包括一个\
    \ Compiler 类。\n\n这个类定义了一个编译器功能的统一接口。Compiler 类是一个外观，它给用户提供了一个单一而简单的编译子系统接口。它无需完全隐藏或实现编译功能的那些类，即可将它们结合在一起。编译器的外观可方便大多数程序员使用，同时对少数懂得如何使用底层功能的人，它并不隐藏这些功能，如下图所示。\n\
    \n"
