  - "[PAGE 217]\n\n# 行为模式\n\n行为模式涉及到算法和对象间职责的分配。行为模式不仅描述对象或类的模式，还描述它们之间的通信模式。\n\n\
    （1）**行为类模式**使用继承机制在类间分派行为。\n\n（2）**行为对象模式**使用对象复合而不是继承。一些行为对象模式描述了一组对象的对象怎样相互协作以完成其中任何一个对象都无法单独完成的任务。这里一个重要的问题是对等的对象如何互相了解对方。对等对象可以保持显式的对方的引用，但那会增加它们的耦合度。\n\
    \n**Observer模式**定义并保持对参照的依赖关系。典型的Observer的例子是Smalltalk中的模型/视图/控制器，其中一旦模型的状态发生变化，模型的所有视图都会得到通知。\n\
    \n其他的行为对象模式常将行为封装在一个对象中并将请求指派给它。\n\n**Strategy模式**将算法封装在对象中，这样可以方便地指定和改变一个对象所使用的算法。\n\
    \n**Command模式**将请求封装在对象中，这样它就可作为参数来传递，也可以被存储在历史列表里，或者以其他方式使用。\n\n**State模式**封装一个对象的状态，使得当这个对象的状态对象变化时，该对象可以改变它的行为。\n\
    \n**Iterator模式**则抽象了访问和遍历一个集合中的对象的方式。\n\n# ITERATOR(迭代器)—对象行为型模式\n\n+   1. **意图**\
    \  \n+      提供一种方法顺序访问一个聚合对象中各个元素，而又**不需暴露**该对象的内部表示。\n+   \n+   2. **别名**  \n\
    +      游标（Cursor）。\n+   \n+   3. **动机**  \n+      一个聚合对象，如**列表（list）**，应该提供一种方法来让别人可以访问它的元素，而又不需暴露它的内部结构。此外，针对不同的需要，可能要以不同的方式遍历这个列表。\n\
    \n迭代器模式可解决这些问题。这一模式的关键思想是将对列表的**访问和遍历**从列表对象中分离出来并放入一个**迭代器（iterator）对象**中。**迭代器类**定义了一个访问该列表元素的接口。迭代器对象负责跟踪当前的元素；即，它知道哪些元素已经遍历过了。"
  - '[PAGE 218]


    # 例如，


    一个列表（list）类可能需要一个列表迭代器（listiterator），它们之间的关系如下图：


    ![](img/3b4669cf00b2833fe526284506f3f342_218_0.png)


    上图中：


    在实例化列表迭代器之前，必须提供待遍历的列表。一旦有了该列表迭代器的实例，就可以顺序地访问该列表的各个元素。


    CurrentItem操作返回列表中的当前元素，

    First操作初始化迭代器，使当前元素指向列表的第一个元素，

    Next操作将当前元素指针向前推进一步，指向下一个元素，

    IsDone检查是否已越过最后一个元素，也就是完成了这次遍历。


    将遍历机制与列表对象分离使我们可以定义不同的迭代器来实现不同的遍历策略，而无需在列表接口中列举它们。


    例如，过滤表列迭代器（FilteringListIterator）可能只访问那些满足特定过滤约束条件的元素。


    注意：迭代器和列表是耦合在一起的，而且客户对象必须知道遍历的是一个列表而不是其他聚合结构。最好能有一种办法使得不需改变客户代码即可改变该聚合类。可以通过将迭代器的概念推广到多态迭代（polymorphic
    iteration）来达到这个目标。


    首先，定义一个抽象列表类AbstractList，它提供操作列表的公共接口。类似地，我们也需要一个抽象的迭代器类Iterator，它定义公共的迭代接口。然后我们可以为每个不同的列表实现定义具体的Iterator子类。这样迭代机制就与具体的聚合类无关了。'
