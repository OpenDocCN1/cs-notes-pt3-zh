    \n# 2. 模式的实现\n\n策略模式的实现有以下这些需要注意的地方。\n\n经常见到的是，所有的具体策略类都有一些公有的行为。这时候，就应当把这些公有的行为放到共同的抽象策略角色类里面。当然这时候抽象策略角色必须要用抽象类实现。[注]\
    \ 使用 Java 实现[注]。\n\n这其实也是典型的将代码向继承等级结构的上方集中的标准做法。代码集中的方向如下所示。\n\n![](img/3b4669cf00b2833fe526284506f3f342_138_0.png)\n\
