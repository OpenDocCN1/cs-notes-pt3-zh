    # ## 3.2 Dr.James Rumbaugh(詹姆斯.论伯博士)


    ![](img/3b4669cf00b2833fe526284506f3f342_129_0.png)


    詹姆斯.论伯博士是世界著名的软件开发方法学家之一。从事面向对象方法学与工具学的研究近 30 年，是 OMT 方法的主创人。与 Rational 公司的 Grady
    Booch、Ivar Jacobson 共同创建了一种可视化地说明、建造软件系统的工业标准语言--统一建模语言(UML)，UML 在 1997 年被对象管理组织(OMG)正式确定为国际标准。


    论伯毕业于麻省理工学院物理系，在麻州理工学院取得天文学硕士学位，随后又在麻省理工学院获得计算机科学的博士学位。1994 年加盟 Rational 公司之前，他曾在美国通用电器研究发展中心工作长达
    25 年以上。也就是在那里，他开发了 DSM 面向对象编程语言、OMT 对象建模符号以及 Object Modeling Tool 图形编辑器等。


