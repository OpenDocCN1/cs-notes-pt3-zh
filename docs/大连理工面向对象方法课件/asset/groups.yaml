  - "[PAGE 225]\n\n![](img/3b4669cf00b2833fe526284506f3f342_225_0.png)\n\n从上图可以看出，这个使用了工厂方法模式的系统涉及到以下的角色：\n\
    \n抽象工厂（Creator）角色：担任这个角色的是工厂方法模式的核心，它是应用程序开发的。任何模式中创建对象的工厂类必须实现这个接口。在上面的系统中这个角色由Java接口Creator扮演；在实际的系统中，这个角色也常常使用抽象Java类实现。\n\
    \n具体工厂（Concrete Creator）角色：担任这个角色的是实现了抽象工厂接口的具体Java类。具体工厂角色含有与应用密切相关的逻辑，并且受到应用程序的调用以创建产品对象。在本系统中给出了两个这样的角色，也就是具体Java类ConcreteCreator1和ConcreteCreator2。\n\
    \n抽象产品（Product）角色：工厂方法模式所创建的对象的超类型，也就是产品对象的共同父类或共同拥有的接口。在本系统中，这个角色由Java接口Product扮演；在实际的系统中，这个角色也常常使用抽象Java类实现。\n\
    \n具体产品（Concrete Product）角色：这个角色实现了抽象产品角色所声明的接口。工厂方法模式所创建的每一个对象都是某个具体产品角色的实例。在本系统中，这个角色由具体Java类ConcreteProduct1和ConcreteProduct2扮演，它们都实现了Java接口Product。\n\
    \n最后，为了说明这个系统的使用方法，特地引进了一个客户端角色Client。这个角色创建了工厂对象，然后调用工厂对象的工厂方法创建相应的产品对象。\n\n\
    # 源代码\n\n下面就是这个示意性系统的源代码。\n\n首先是抽象工厂角色的源代码，这个角色是用一个Java接口实现的，它声明了一个工厂方法，要求所有的具体工厂角色都实现这个工厂方法。\n\
    \n代码清单1：抽象工厂角色Creator类的源代码\n\n```\n```java\npackage.com.factorymethod;\npublic\
    \ interface Creator\n{\n/**\n * 工厂方法\n */\npublic Product factory();\n}\n```\n\
    ```\n\n下面是抽象产品角色的源代码。由于这里考虑的是最为简单的情形，所以抽象产品角色仅仅为具体产品角色提供一个共同的类型而已，所以是用一个Java标识接口实现的。一个没有声明任何方法的接口可做称标识接口，关于标识接口的讨论请见本书的“专题：Java接口”一章。"
  - "[PAGE 226]\n\n代码清单2：抽象产品角色Product 类的源代码\n\n```\n```java\npackage com.javapatterns.factorymethod;\n\
    public interface Product\n{\n}\n```\n```\n\n# 第13章 工厂方法（Factory Method）模式 · 169\
    \ ·\n\n下面是具体工厂角色ConcreteCreator1 的源代码。这个角色实现了抽象工厂角色Creator 所声明的工厂方法。\n\n代码清单3：具体工厂角色ConcreteCreator1\
    \ 类的源代码\n\n```\n```java\npackage com.javapatterns.factorymethod;\npublic class\
    \ ConcreteCreator1 implements Creator\n{\n/**\n * 工厂方法\n */\npublic Product factory()\n\
    {\nreturn new ConcreteProduct1();\n}\n}\n```\n```\n\n下面是具体工厂角色ConcreteCreator2\
    \ 的源代码。与ConcreteCreator1 一样，这个角色实现了抽象工厂角色Creator 所声明的工厂方法。\n\n代码清单4：具体工厂角色ConcreteCreator2\
    \ 类的源代码\n\n```\n```java\npackage com.javapatterns.factorymethod;\npublic class\
    \ ConcreteCreator2 implements Creator\n{\n/**\n * 工厂方法\n */\npublic Product factory()\n\
    {\nreturn new ConcreteProduct2();\n}\n}\n```\n```\n\n下面是具体产品角色ConcreteProduct1\
    \ 的源代码。它是此系统向客户提供的产品，在通常情况下，这个类会有复杂的商业逻辑。\n\n代码清单5：具体产品角色ConcreteProduct1 类的源代码\n\
    \n```\n```java\npackage com.javapatterns.factorymethod;\npublic class ConcreteProduct1\
    \ implements Product\n{\npublic ConcreteProduct1()\n{\n//do something\n}\n}\n\
    ```\n```\n\n类似地，下面是具体产品角色ConcreteProduct2 的源代码。\n\n代码清单6：具体产品角色ConcreteProduct2\
