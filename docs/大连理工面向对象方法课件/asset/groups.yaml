    # ## 6. 参与者


    +   - Context（环境，如TCPConnection）


    > — 定义客户感兴趣的接口，并且保留一个具体状态类的实例，这个具体状态类的实例给出此环境对象的现有状态。


    +   - State（状态，如TCPState）


    > — 定义一个接口用以封装环境（Context）对象的一个特定状态所应的行为。


    +   - ConcreteState subclasses（具体状态子类，如TCPEstablished, TCPListen, TCPClosed）


    > — 每一子类都实现了一个Context的一个状态所对应的行为。


    # ## 7. 协作


    +   - Context将与状态相关的请求委托给当前的ConcreteState对象处理。


    +   - Context可将自身作为一个参数传递给处理该请求的状态对象。


    +   - Context是客户使用的主要接口。客户可用状态对象来配置一个Context，一旦一个Context配置完毕，它的客户不再需要直接与状态对象打交道。


    +   - Context或ConcreteState子类都可决定哪个状态是另外哪个的后继者，以及是在何种条件下进行状态转换。


    # ## 8. 效果


    +   State模式有下面一些效果：


    +   1）它将与特定状态相关的行为局部化，并且将不同状态的行为分割开来，State模式将所有与一个特定的状态相关的行为都放入一个对象中。因为所有与状态相关的代码都存在于某一个State子类中，所以通过定义新的子类可以很容易的增加新的状态和转换。


    +   另一个方法是使用数据值定义内部状态并且让Context操作来显式地检查这些数据。但这样将会使整个Context的实现中遍布看起来很相似的条件语句或case语句。增加一个新的状态可能需要改变若干个操作，这就使得维护变得复杂了。State模式避免了这个问题，但可能会引入另一个问题，因为该模式将不同状态的行为分布在多个State子类中。这就增加了子类的数目，相对于单个类的实现来说不够紧凑。但是如果有许多状态时这样的分布实际上更好一些，否则需要使用巨大的条件语句。'
