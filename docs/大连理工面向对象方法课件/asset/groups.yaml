    \ test，然后增加 unit test，在增加完测试后在查找和修改代码，增加的测试保证同样的错误不会再出现\n\n**4）acceptance test**\
    \  \nacceptance test 根据 user stories 在 iteration plan 会议上创建，它也应该可以自动运行以便可以经常运行。User\
    \ stories 是否完成应是是否通过 acceptance test 为检验标准。\n\n# XP 中的角色：\n\n**1 customer** 用户\
    \  \n在 XP 中，用户是项目组的一部分，用户负责编写 use stories，确定优先级，和开发人员讨论需求，编写 accept test，运行 accept\
    \ test，用户驱动 iteration(release plan, iteration plan)\n\n**2 开发人员**  \n与用户讨论 user\
