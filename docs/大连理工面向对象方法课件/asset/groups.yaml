  md: "\n\n# （4）策略模式的结构\n\n策略模式又叫做政策（Policy）模式（GOF95）。下面以一个示意性的实现讲解策略模式实例的结构，如下图所示。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_136_1.png)\n\n这个模式涉及到三个角色：\n\n- 环境（Context）角色，持有一个\
    \ Strategy 类的指针或引用。\n- 抽象策略（Strategy）角色，这是一个抽象角色，通常由一个接口或者抽象类实现。此角色给出所有的具体策略类所需要的接口。\n\
    - 具体策略（ConcreteStrategy）角色：包装了相关的算法或行为。\n\n首先看一看环境角色的源代码，如代码清单 1 所示，这个类持有一个对策略角色的引用。\n\
    \n代码清单 1：环境类的源代码\n\n```java\npublic class Context\n{\n    private Strategy strategy;\n\
    \    /**\n     * 策略方法\n     */\n    public void contextInterface()\n    {\n  \
    \      strategy.strategyInterface();\n    }\n}\n```\n\n抽象策略类的源代码如代码清单 2 所示，这个抽象类可以用\
    \ Java 接口取代。抽象策略类规定所有具体策略类必须实现的接口。\n\n代码清单 2：抽象策略类的源代码\n\n```java\nabstract public\
