    \ shape 的对象。尝试在构造函数内调用这个纯虚函数，结果如何。\n\n## 7 虚函数和构造函数\n\n### 7.1 构造函数\n\n所有基类构造函数总是在继承类构造函数中被调用。这是有意义的，因为构造函数有一项专门的工作：确保对象被正确的建立。\n\
    \n然而，在构造函数内，必须想办法保证所有我们的成员都已经建立。保证它的唯一方法是让基类构造函数首先被调用。这样，当我们在派生类构造函数中时，在基类中我们能访问的所有成员都已经被初始化了。在构造函数中，“必须知道所有成员对象是有效的”也是下面做法的理由：只要可能，我们应当在这个构造函数初始化表达式中初始化所有的成员对象（放在合成的类中的对象）。只要我们遵从这个做法，我们就能保证所有基类成员和当前对象的成员对象已经被初始化。\n\
    \n### 7.2 虚函数在构造函数中的行为\n\n对于在构造函数中调用一个虚函数的情况，被调用的只是这个函数的本地版本。也就是说，虚拟机制在构造函数中不工作。\n\
    \n原因在于：\n\n1）在概念上，构造函数的工作是把对象变成存在物。在任何构造函数中，对象可能只是部分被形成——我们只能知道基类已被初始化了，但不知道哪个类是从这个基类继承来的。然而，虚函数是“向前”和“向外”进行调用。它能调用在派生类中的函数。假如我们在构造函数中也这样做，那么我们所调用的函数可能会导致操作那些还没有被初始化的成员，这将导致灾难的发生。\n\
    \n2）当一个构造函数被调用时，它做的首要的事情之一是初始化它的VPTR。因此，它只能知道它是“当前”类的，而完全忽视这个对象后面是否还有继承者。当编译器为这个构造函数产生代码时，它是为这个类的构造函数产生代码——既不是为基类，也不是为它的派生类（因为类不知道继承它）。所以它使用的VPTR必须是对于这个类的VTABLE。而且，只要它是最后的构造函数调用，那么在这个对象的生命期内，VPTR将保持被初始化为指向这个VTABLE。但如果接着还有一个更晚派生的构造函数被调用，这个构造函数又将设置VPTR指向它的VTABLE，等等，直到最后的构造函数结束。VPTR的状态是由被最后调用的构造函数确定的。这就是为什么构造函数调用是从基类到更加派生类顺序的另一个理由。\n\
    \n### 7.3 析构函数和虚拟析构函数\n\n构造函数不能是虚的。但析构函数能够且常常必须是虚的。\n\n构造函数有其特殊的工作：它首先调用基类构造函数，然后调用在继承顺序中的更晚派生的构造函数，如此一块一块地把对象拼起来。类似的，析构函数也有一个特殊的工作——它必须拆卸可能属于某类层次的对象。为了做这些工作，它必须按照构造函数调用相反的顺序，调用所有的析构函数。这就是，析构函数自最晚派生的类开始，并向上到基类。这是安全且合理的：当前的析构函数能知道基类成员仍是有效的，因为它知道它是从哪一个派生而来的，但不知道从它派生出哪些。\n\
    \n应当记住，构造函数和析构函数是必须遵守调用层次唯一的地方。在所有其他函数中，只是某个函数被调用，而无论它是虚的还是非虚的。同一个函数的基类版本在通常的函数中被调用（无论否）的唯一的方法是直接地调用这个函数。\n\
    \n**问题：** 通常，析构函数的活动是很正常的。但是，如果我们想通过指向某个对象的基类的指针操纵这个对象（这就是，通过它的一般接口操纵这个对象），会发生什么现象呢？这在面向对象的程序设计中确实很重要。当我们想delete在栈中已经用new创建的类的对象的指针时，就会出现这个问题。如果这个指针（将要被delete得指针）是指向基类的，编译器只能知道在delete期间调用这个析构函数的基类版本。我们已经知道，虚函数被创建恰恰是为了解决同样的问题。幸好，析构函数可以是虚函数，于是一切问题就迎刃而解了。\n\
    \n下面是例子：（见asd例子）\n\n```cpp\n//: C15:Pvdest.cpp\n// Pure virtual destructors\n\
    // require a function body.\n#include <iostream.h>\nusing namespace std;\n\nclass\
    \ Base {\npublic:\n    virtual ~Base() {\n        cout << \"~Base()\" << endl;\n\
    \    }\n};\n\nclass Derived : public Base {\npublic:\n    ~Derived() {\n     \
    \   cout << \"~Derived()\" << endl;\n    }\n};\n```\n"
