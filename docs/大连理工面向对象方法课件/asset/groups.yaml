    开发过程中所维护的文件越少越好。偶觉得应该尽量少用 UML 图写文档，只写最关键的部分。类的文档最好由 NDoc 直接生成。偶用 UML 工具的时间很少。写代码的过程就是类设计过程。不妨比较这两个流程：（1）用例分析一>采用
