    这些原理的几个结论：

    1 向一个项目增加人员要花费较大代价（constly），因为原有人员和新人员之

    间的交流要花费大量时间

    2 团队的规模经常是跳跃的，例子：需要 6 个熟练的程序员，但是只有 4 个，

    于是增加不熟练的程序员，结果团队的大量时间花费在培训不熟练的程序员上

    面，最后增加到了 20 个不熟练的程序员。

    3 应该侧重于提高团队的技能而不是扩充团队

    4 对不同的项目使用不同的过程

    5 在适用的条件下，轻量级的方法优于重量级的方法

    6 对不同的项目要裁减过程


    敏捷开发方法的原则是“刚刚好”（Light and Sufficient）


    # （三） Crystal


    Crystal 是 Alistair Cockburn 提出的一组开发方法，分为 Crystal

    Clear,Crystal Yellow,Crystal Orange 和 Crystal Red 分别适用于不同的项

    目。项目可以按照参加的人员和重要性划分。重要性根据项目中的错误引发的后

    果分为：

    C Loss of comfort （某些不舒适）

    D Loss of discretionary money (经济损失)

    E Loss of Essential Money (严重经济损失)

    L Life Critical (生命危险)

    一个项目称为 C6 说明参加人员在 6 人以下，重要性是 C 级，D20 说明人员在

    6-20 人，重要性是 D 级。


    Crystal Clear 适用于 C6,D6 项目

    Crystal Yellow 适用于 C20,D20,E20 项目

    Crystal Orange 适用于 C40,D40,E40 项目

    Crystal Red 适用于 C80,D80,E80 项目


    # Crystal Clear


    适用于一个办公室内的一个小组


    角色有： sponsor 发起人，任务下达者

    Senior Designer-Programmer 高级设计开发人员

    Designer-Programmer 设计开发人员

    User 用户

    其中一个人是项目协调者(Project Coordinator)。Senior Designer-

    Programmer 是关键人员'
  - '[PAGE 249]


    # 策略：


    +   1 软件的开发采用有规则的周期性递增方法，每 2-3 个月提交（deliver）一个版本


    +   2 使用里程碑(milestone)跟踪进度（包括 delvier 和开发期间的重大决定）


    +   3 自动回归测试（automated regression test）


    +   4 用户直接参与


    +   5 每个 release 有两个 user viewings(用户审核?)


    +   6 在上一个步骤足够稳定（stable enough to review）时立即开始下一个步骤，尽量并行开发


    +   7 在每个周期的开始和中间进行产品和过程调整


    # 过程产品（指整个过程产生的所有产品，包括软件和文档）


    +   1 软件释放顺序（release sequence）


    +   2 用户审核的计划


    +   3 用户案例（usecase）或需求描述


    +   4 设计框架和必要的说明


    +   5 界面草图


    +   6 基本的对象模型


    +   7 执行代码


    +   8 migration code


    +   9 测试用例


    +   10 用户手册


    +   11 local matters 有项目组决定：


    +   上述 product 的模块


    +   编码和用户界面的标准


    +   回归测试的标准和细节


    +   其他文档


    +   需要的工具：


    +   版本控制工具


    +   白板（最好可打印）


    # Crystal Orange


    角色： sponsor 发起人


    business export/usage export 业务专家


    technical facilitator 技术专家


    business analyst/designer 业务分析和设计人员


    project manager 项目管理员


    architect 系统架构人员


    Design Mentor 设计指导人员


    Lead Designer-Programmer 主要设计编码人员、


    Other Designer-Programmer 设计编码人员


    UI Designer 用户界面设计人员'
