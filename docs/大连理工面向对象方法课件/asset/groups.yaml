  - "[PAGE 279]\n\n# # STATE（状态）—对象行为型模式\n\n# ## 1. 意图\n\n不同的状态对应不同的行为，即每个状态有着相应的行为。\
    \  \n允许一个对象在其内部状态改变时改变它的行为。\n\n# ## 2. 别名\n\n状态对象（Objects for States）\n\n# ##\
    \ 3. 动机\n\n例子：考虑一个表示网络连接的类TCPConnection。  \n一个TCPConnection对象的状态处于若干不同状态之一：\n\n\
    连接已建立（Established）  \n正在监听（Listening）  \n连接已关闭（Closed）\n\n当一个TCPConnection对象收到其他对象的请求时，它根据自身的当前状态作出不同的反应。\n\
    \n例如，一个Open请求的结果依赖于该连接是处于连接已关闭状态还是连接已建立状态。State模式描述了TCPConnection如何在每一种状态下表现出不同的行为。\n\
    \n这一模式的关键思想：引入了一个称为TCPState的抽象类来表示网络的连接状态。\n\nTCPState类为各表示不同的操作状态的子类声明了一个公共接口。\
    \  \nTCPState的子类实现与特定状态相关的行为。例如，TCPEstablished和TCPClosed类分别实现了特定于TCPConnection的连接已建立状态和连接已关闭状态的行为。"
  - '[PAGE 280]


    ![](img/3b4669cf00b2833fe526284506f3f342_280_0.png)


    TCPConnection类维护一个表示TCP连接当前状态的状态对象（一个TCPState子类的实例）。

    (1) TCPConnection类将所有与状态相关的请求委托给这个状态对象。TCPConnection使用它的TCPState子类实例来执行特定于连接状态的操作。

    (2) 一旦连接状态改变，TCPConnection对象就会改变它所使用的状态对象。例如当连接从已建立状态转为已关闭状态时，TCPConnection 会用一个TCPClosed的实例来代替原来的TCPEstablished的实例。


    # 4. 适用性


    在下面的两种情况下均可使用State模式：

    • 一个对象的行为取决于它的状态，并且它必须在运行时刻根据状态改变它的行为。

    • 一个操作中含有庞大的多分支的条件语句，且这些分支依赖于该对象的状态。这个状态通常用一个或多个枚举常量表示。通常，有多个操作包含这一相同的条件结构。这使得你可以根据对象自身的情况将对象的状态作为一个对象，这一对象可以不依赖于其他对象而独立变化。


    State 模式适合用于“状态的切换”。我们经常会使用 If elseif else 进行状态切换，如果针对状态的这样的判断切换反复出现，我们就可以考虑是否采用
    State 模式。State 模式将每一个条件分支放入一个独立的类中。


