  - '[PAGE 239]


    目标(subject)和观察者(Observer)。

    一个目标（主题）可以有任意数目的依赖它的观察者。一旦目标的状态发生改变，所有的观察者都得到通知。作为对这个通知的响应，每个观察者都将查询目标以使其状态与目标的状态同步。


    （2）另一种理解：这种交互也称为发布-订阅（publish-subscribe）。目标是通知的发布者。它发出通知时并不需知道谁是它的观察者。可以有任意数目的观察者订阅并接收通知。


    # 4. 适用性


    在以下任一情况下可以使用观察者模式：

    • 当一个抽象模型有两个方面，其中一个方面依赖于另一方。将这二者封装在独立的对象中以使它们可以各自独立地改变和复用。

    • 当对一个对象的改变需要同时改变其它对象，而不知道具体有多少对象有待改变。

    • 当一个对象必须通知其它对象，而它又不能假定其它对象是谁。换言之，不希望这些对象是紧密耦合的。


    # 5. 结构


    ![](img/3b4669cf00b2833fe526284506f3f342_239_0.png)


    # 6. 参与者


    +   - Subject（目标）

    +     - 目标知道它的观察者。可以有任意多个观察者观察同一个目标。

    +     - 提供注册和删除观察者对象的接口。

    +   - Observer（观察者）

    +     - 为那些在目标发生改变时需获得通知的对象定义一个更新接口。

    +   - ConcreteSubject（具体目标）

    +     - 将有关状态存入各ConcreteObserver对象。

    +     - 当它的状态发生改变时，向它的各个观察者发出通知。

    +   - ConcreteObserver（具体观察者）

    +     - 维护一个指向ConcreteSubject对象的引用。

    +     - 存储有关状态，这些状态应与目标的状态保持一致。

    +     - 实现Observer的更新接口以使自身状态与目标的状态保持一致。'
  - '[PAGE 240]


    # 7. 协作


    +   • 当`ConcreteSubject`发生任何可能导致其观察者与其本身状态不一致的改变时，它将通知它的各个观察者。


    +   • 在得到一个具体目标的改变通知后，`ConcreteObserver` 对象可向目标对象查询信息。


    +   • `ConcreteObserver`使用这些信息以使它的状态与目标对象的状态一致。


    # 8. 效果


    下面是观察者模式其它一些优缺点：


    1）目标和观察者间的抽象耦合。一个目标所知道的仅仅是它有一系列观察者，每个都符合抽象的0bserver类的简单接口。目标不知道任何一个观察者属于哪一个具体的类。这样目标和观察者之间的耦合是抽象的和最小的。


    因为目标和观察者不是紧密耦合的，它们可以属于一个系统中的不同抽象层次。一个处于较低层次的目标对象可与一个处于较高层次的观察者通信并通知它，这样就保持了系统层次的完整。如果目标和观察者混在一块，那么得到的对象要么模贯两个层次(违反了层次性)，要么必须放在这两层的某一层中(这可能会损害层次抽象)。


    2）支持广播通信。不像通常的请求，目标发送的通知不需指定它的接收者。


    通知被自动广播给所有已向该目标对象登记的有关对象。目标对象并不关心到底有多少对象对自己感兴趣；它唯一的责任就是通知它的各观察者。这给了我们可以在任何时刻增加和删除观察者的自由。处理还是忽略一个通知取决于观察者。


    3）意外的更新。需要注意：在目标上一个看似无害的操作可能会引起一系列对观察者以及依赖于这些观察者的那些对象的更新。也可能引起错误的更新，这种错误通常很难捕捉。'
  - "[PAGE 241]\n\n# 5. 变化\n\n+   1）一些方法可能会改变被观察机制的内部问题。\n\n+   2）观察者不可能知道实现的全部细节。因此，观察者必须能够在不知道实现细节的情况下工作。\n\
    \n+   3）通知机制通常由观察者对象负责维护。观察者可以注册和注销，并在被观察对象发生变化时得到通知。\n\n+   4）如果通知是同步的，那么被观察对象必须等待所有观察者完成处理；如果通知是异步的，则需要额外的线程或事件机制。\n\
    \n+   5）观察者模式的一个缺点是可能导致通知链过长，从而增加系统的复杂性。\n\n```\nvoid MySubject::Operation (int\
    \ newValue) {\n    BaseClassSubject::Operation(newValue);\n    // trigger notification\n\
    \n    _myInstVar += newValue;\n        // update subclass state (too late!)\n\
    }\n```\n\n在另一个例子中，基类中的操作可能先触发通知，然后子类才更新自己的状态，这可能导致观察者得到不一致的信息。\n\n```\nvoid TextField::OnChange\
    \ (TextRange r)\n{\n    ReplaceRange(r);        // redefined in subclasses\n \
    \   Notify();\n}\n```\n\n观察到这一点，在实际中可以采用更合理的设计来避免上述问题。\n\n+   6）避免将变化聚集在单一的更新一处/触发器。观察者模式的实现通常需要注册和注销观察者。\n\
    \n它是一个很好的设计原则。目前观察者通常被分为两类：一类为观察者，另一类为被观察者。我们将之称为模型（model）和视图（view）。\n\n+   7）模型是应用程序的核心部分，直接表示应用程序的数据和逻辑；视图负责显示模型中的数据。\n\
    \n+   8）模型和视图之间通过观察者模式进行通信。模型发生变化时，视图可以得到通知并更新显示。\n\n+   a) 一个模型可以有多个视图，这些视图可以显示同一个模型的不同方面。\n\
    \n+   b) 视图不会修改模型中的数据，而是通过控制器与模型进行交互。\n\n+   c) 模型和视图之间的通信是松耦合的，模型不需要知道视图的具体实现。\n\
    \n+   9）当多个视图需要共享同一个模型时，可以使用观察者模式。模型中的变化会自动通知所有相关视图。"
