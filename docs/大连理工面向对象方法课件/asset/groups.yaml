    \  return (光盘)Class.forName(name).getInstance();\n    }\n}\n```\n\n有人要买盗版盘，怎么实现呢？\n\
    \n```java\npublic class 小子{\n    public static void main(String[] args){\n   \
    \     光盘 d=DiscFactory.getDisc(\"盗版盘\");\n        光盘.卖();\n    }\n}\n```\n\n如果有一天，这小子良心发现了，开始卖正版软件。没关系，我们只要再创建一个\"\
    光盘\"的子类\"正版软件\"就可以了。不需要修改原结构和代码。怎么样？\n\n# STATE（状态）—对象行为型模式\n\n## 1. 意图\n\n不同的状态对应不同的行为，即每个状态有着相应的行为。\
    \  \n允许一个对象在其内部状态改变时改变它的行为。\n\n## 2. 别名\n\n状态对象（Objects for States）\n\n## 3. 动机\n\
    \n例子：考虑一个表示网络连接的类TCPConnection。  \n一个TCPConnection对象的状态处于若干不同状态之一：\n\n- 连接已建立（Established）\n\
    - 正在监听（Listening）\n- 连接已关闭（Closed）\n\n当一个TCPConnection对象收到其他对象的请求时，它根据自身的当前状态作出不同的反应。\n\
    \n例如，一个Open请求的结果依赖于该连接是处于连接已关闭状态还是连接已建立状态。State模式描述了TCPConnection如何在每一种状态下表现出不同的行为。\n\
    \n这一模式的关键思想：引入了一个称为TCPState的抽象类来表示网络的连接状态。\n\nTCPState类为各表示不同的操作状态的子类声明了一个公共接口。\
    \  \nTCPState的子类实现与特定状态相关的行为。例如，TCPEstablished和TCPClosed类分别实现了特定于TCPConnection的连接已建立状态和连接已关闭状态的行为。\n\
    \nTCPConnection类维护一个表示TCP连接当前状态的状态对象（一个TCPState子类的实例）。\n\n1. TCPConnection类将所有与状态相关的请求委托给这个状态对象。TCPConnection使用它的TCPState子类实例来执行特定于连接状态的操作。\n\
    2. 一旦连接状态改变，TCPConnection对象就会改变它所使用的状态对象。例如当连接从已建立状态转为已关闭状态时，TCPConnection 会用一个TCPClosed的实例来代替原来的TCPEstablished的实例。\n\
    \n## 4. 适用性\n\n在下面的两种情况下均可使用State模式：\n\n- 一个对象的行为取决于它的状态，并且它必须在运行时刻根据状态改变它的行为。\n\
    - 一个操作中含有庞大的多分支的条件语句，且这些分支依赖于该对象的状态。这个状态通常用一个或多个枚举常量表示。通常，有多个操作包含这一相同的条件结构。这使得你可以根据对象自身的情况将对象的状态作为一个对象，这一对象可以不依赖于其他对象而独立变化。\n\
    \nState 模式适合用于“状态的切换”。我们经常会使用 If elseif else 进行状态切换，如果针对状态的这样的判断切换反复出现，我们就可以考虑是否采用\
    \ State 模式。State 模式将每一个条件分支放入一个独立的类中。\n\n## 5. 结构\n\n"
  mdcn: "\n\n# 软件的架构与设计模式之模式的种类介绍\n\n来源：网友推荐\n\n由于[GOF95]是论述软件模式著作的第一本，也是 OO 设计范畴当中最流行的一本，因此有些人喜爱使用设计模式（Design\
    \ Pattern）一词来指所有在提及软件的架构、设计、程序实现的任何种类的模式。另外一些人则想要划分出三种不同层次的模式：架构模式(Architectural\
    \ Pattern)、设计模式(Design Pattern)、成语(idiom)，或将其称为代码模式(Coding Pattern)。\n\n这三者之间的区别在于三种不同的模式存在于它们各自的抽象层次和具体层次上。架构模式是一个系统的层次架构，涉及到大尺度的组件以及整体性质和力学。架构模式的好处可以影响到总体各种框架性结构。设计模式是中等尺度的结构策略，这些中等尺度的结构实现了一些大尺度组件的行为和它们之间的关系。模式代码并不一定能够对系统总体各种结构有影响。设计模式定义了子系统组件间的规则机制，代码模式（或成语）是特定编程语言中特定语言有关的编程技巧，代码模式的好处会影响到一个中等尺度组件的内部，外部的结构行为的规范性细节，但不会影响到一个组件子系统的中等尺度结构，更不会影响到系统总体各种层次尺度框架。\n\
    \n## 代码模式或成语(Coding Pattern 或 Idiom)\n\n代码模式（或成语）是较低层次的模式，并与编程语言密切相关。代码模式能够利用到一个特定的编程语言特点来实现一个组件的某些特定方面或关系。\n\
