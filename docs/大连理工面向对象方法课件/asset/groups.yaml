    f.instrument 引用产生如下结果：编译器从这个instrument 指针开始，这个指针指向这个对象的起始地址。所有的instrument 对象或由instrument
    派生的对象都有它们的VPTR，它在对象的相同的位置（常常在对象的开头），所以编译器能够取出这个对象的VPTR。

    g.VPTR指向VTABLE的开始地址。所有的VTABLE有相同的顺序，不管何种类型的对象。play() 是第一个，what() 是第二个，adjust()
    是第三个。所以编译器知道adjust() 函 数 必 在 VPTR+ 2 处 。 这 样 ， 不 是 “ 以 instrument::adjust 地址调用这个函数”（这是早捆绑，是错误活
    动），而是产生代码，“在VPTR+ 2 处调用这个函数”。因为VPTR的效果和实际函数地址的确定发生在运行时，所以这样就得到了所希望的晚捆绑。向这个对象发送消息，这个对象能够定它应当做什么。


