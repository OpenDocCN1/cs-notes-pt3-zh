    4. 难于坚持一个习惯。\n\n#### 针对个人因素的几个建议：\n\n1. 具体的模型较抽象的模型更容易理解。\n2. 从一个例子开始是容易的。\n3.\
    \ 通过观察他人的成果学习。\n4. 要有足够的不受打扰的时间。\n5. 分配的工作要与个人意向、能力匹配。\n6. 不正确的奖励会有坏作用，从长期看个人兴趣比奖励更重要，培养在工作中的自豪感：\n\
    \   - pride in work：参与工作的自豪感，通常参与一个重要的工作会有自豪感。\n   - pride in accomplishment：完成工作的自豪感，长期未完的工作会使士气低落。\n\
    \   - pride in contribution：为他人贡献的自豪感。\n7. 鼓励关心其他人的工作和整体的工作。\n\n在一个团队之间，交流是最重要的，实践证明面对面的实时的交流是最有效的，对交流的延误会损失信息，白板是最好的交流工具，交流工具的先进并不能提高交流效果。文档的作用是记录和备忘，不能通过文档交流。\n\
    \n#### 敏捷开发方法要避免的过程设计的几个常见错误：\n\n1. 对所有的项目使用同一种过程。\n2. 没有弹性。\n3. 过于沉重。\n4. 增加不必要的“必须完成”（“should\
    \ do” is really should？）。\n5. 没有经过实践检验。\n\n#### 敏捷开发方法过程设计的几个原则：\n\n1. 交互的面对面的交流是代价最小、最迅速的交换信息的方法。\n\
    2. 超过实际需要的过程是浪费的。\n3. 大的团队需要重量级方法。\n4. 处理重大问题的项目需要重量级方法强调。\n5. 增加反馈和交流可以减少中间产品和文档的需求。\n\
    6. 轻量级方法更强调理解（understanding）、自律（discipline）和技能（skill），重量级方法更强调文档（documentation）、过程（process）和正式（formality）。\n\
    \   - understanding 指整个团队关于项目的全部知识，包括讨论的过程，documentation 只能记录其中的一部分。\n   - discipline\
    \ 是指个人主动的完成工作，process 指个人根据指令完成工作。\n   - skill 指具有良好技能的人可以省略中间的产品，formality 指必须按照规定步骤完成工作。\n\
    7. 确定开发中间的瓶径，提高它的效率。\n   - 对于瓶径处的工作应该尽量加快，减少重复，（使用更熟练的人，使用更多的人，使用更好的工具，使瓶径处的工作的深入尽量稳定）。对于非瓶径处的工作可以多一些重复，在输入还不确定的情况下也可以尽早开始。\n\
    \n"
  mdcn: "\n\n敏捷开发（agile development）概念从 2004 年初开始广为流行。Bailar 非常支持这一理论，他采取了“敏捷方式”组建团队：Capital\
    \ One 的“敏捷团队”包括 3 名业务人员、两名操作人员和 5～7 名 IT 人员，其中包括 1 个业务信息指导（实际上是业务部门和 IT 部门之间的“翻译者”）；另外，还有一个由项目经理和至少\
    \ 80 名开发人员组成的团队。这些开发人员都曾被 Bailar 送去参加过“敏捷开发”的培训，具备相关的技能。\n\n每个团队都有自己的敏捷指导（Bailar\
    \ 聘用了 20 个敏捷指导），他的工作是关注流程并提供建议和支持。最初提出的需求被归纳成一个目标、一堆记录详细需要的卡片及一些供参考的原型和模板。在整个项目阶段，团队人员密切合作，开发有规律地停顿，在\
    \ 9 周开发过程中停顿 3～4 次，以评估过程及决定需求变更是否必要。在 Capital One，大的 IT 项目会被拆分成多个子项目，安排给各“敏捷团队”，这种方式在“敏捷开发”中叫“蜂巢式（swarming）”，所有过程由一名项目总经理控制。\n\
    \n为了检验这个系统的效果，Bailar 将项目拆分，从旧的“瀑布式”开发转变为“序列式”开发，形成了“敏捷开发”所倡导的精干而灵活的开发团队，并将开发阶段分成\
    \ 30 天一个周期，进行“冲刺”，每个冲刺始于一个启动会议，到下个冲刺前结束。\n\n在 Bailar 将其与传统的开发方式做了对比后，他感到非常兴奋——“敏捷开发”使开发时间减少了\
    \ 30%～40%，有时甚至接近 50%，提高了交付产品的质量。“不过，有些需求不能用敏捷开发来处理。”Bailar 承认，“敏捷开发”也有局限性，比如对那些不明确、优先权不清楚的需求或处于“较快、较便宜、较优”的三角架构中却不能排列出三者优先级的需求。此外，他觉得大型项目或有特殊规则的需求的项目，更适宜采用传统的开发方式。尽管描述需求一直是件困难的事，但经过阵痛之后，需求处理流程会让\
    \ CIO 受益匪浅。\n\n敏捷开发是由一些业界专家针对一些企业现状提出了一些让软件开发团队具有快速工作、响应变化能力的价值观和原则，并于 2001 初成立了敏捷联盟。他们正在通过亲身实践以及帮助他人实践，揭示更好的软件开发方法。通过这项工作，他们认为：\n\
    \n- 个体和交互 胜过 过程和工具\n- 可以工作的软件 胜过 面面俱到的文档\n- 客户合作 胜过 合同谈判\n- 响应变化 胜过 遵循计划\n\n并提出了以下遵循的原则：\n\
    \n- 我们最优先要做的是通过尽早的、持续的交付有价值的软件来使客户满意。\n- 即使到了开发的后期，也欢迎改变需求。敏捷过程利用变化来为客户创造竞争优势。\n\
    - 经常性地交付可以工作的软件，交付的间隔可以从几个星期到几个月，交付的时间间隔越短越好。\n- 在整个项目开发期间，业务人员和开发人员必须天天都在一起工作。\n\
    - 围绕被激励起来的个体来构建项目。给他们提供所需的环境和支持，并且信任他们能够完成工作。\n- 在团队内部，最具有效果、富有效率的传递信息的方法，就是面对面的交谈。\n\
    - 工作的软件是首要的进度度量标准。\n- 敏捷过程提倡可持续的开发速度。责任人、开发者和用户应该能够保持一个长期的、恒定的开发速度。\n- 不断地关注优秀的技能和好的设计会增强敏捷能力。\n\
    - 简单是最根本的。\n- 最好的构架、需求和设计出于自组织团队。\n- 每隔一定时间，团队会在如何才能更有效地工作方面进行反省，然后相应地对自己的行为进行调整。\n\
    \n## 一、敏捷开发方法\n\n### （一）说明\n\n本文是阅读 Alistair Cockburn 的 Agile Software Development\
    \ 和 William C. Wake 的 XP Explored 的一些笔记和想法，Agile Software Development 是一组软件开发方法的总称，包括（Crystal，Extreme\
    \ Programming，Adaptive software development 等等）。敏捷开发方法又称为“轻量级”开发方法。\n\n下面这段话摘自\
    \ Martin Fowler 的一篇文章：\n\n从无到繁重再到敏捷\n\n多多软件开发仍然是一个显得混乱的活动，即典型的“边写边改”（code and\
    \ fix）。设计过程充斥着短期的，即时的决定，而无完整的规划。这种模式对小系统开发其实很管用，但是当系统变得越大越复杂时，要想加入新的功能就越来越困难。同时错误故障越来越多，越来越难于排除。一个典型的标志就是当系统功能完成后有一个很长的测试阶段，有时甚至有遥遥无期之意，从而对项目的完成产生严重的影响。\n\
    \n我们使用这种开发模式已有很长时间了，不过我们实际上也有另外一种选择，那就是“正规方法”（methodology）。这些方法对开发过程有着严格而详尽的规定，以期使软件开发更有可预设性并提高效率，这种思路是借鉴了其他工程领域的实践。\n\
    \n这些正规方法已存在了很长时间了，但是并没有取得令人瞩目的成功，甚至就没怎么引起人们的注意。对这些方法最常听见的批评就是它们的官僚繁琐，要是按照它的要求来，那有做太多的事情需要做，而延缓整个开发进程。所以它们通常被认为是“繁琐滞重型”方法，或\
    \ Jim HighSmith 所称的“巨型”（monumental）方法。\n\n作为对这些方法的反叛，在过去几年中出现了一类新方法。尽管它们还没有正式的名称，但是一般被称为“敏捷型”方法。对许多人来说，这类方法的吸引之处在于对繁文缛节的官僚过程的反叛。它们在无过程和过于繁琐的过程中达到了一种平衡，使得能以不多的步骤过程获取较满意的结果。\n\
    \n敏捷型与滞重型方法有一些显著的区别，其中一个显而易见的不同反映在文档上：敏捷型不是很面向文档，对于一项任务，它们通常只要求尽可能少的文档。从许多方面来看，它们更像是“面向源码”（code-oriented）。事实上，它们认为最根本的文档应该是源码。\n\
    \n但是，我并不认为文档方面的特点是敏捷型方法的根本之点。文档减少仅仅是个表象，它其实反映的是更深层的特点：\n\n- 敏捷型方法是“适配性”而非“预设性”。重型方法试图对一个软件开发项目在很长的时间跨度内作出详细的计划，然后依计划进行开发。这类方法在计划制定完成后拒绝变化。而敏捷型方法则欢迎变化。其实，它们的目的就是为适应变化的过程，甚至能允许改变自身来适应变化。\n\
    - 敏捷型方法是“面向人”（of people-oriented）而非“面向过程”的（process-oriented）。它们试图使软件开发工作顺应人的天性而非逆之。它们强调软件开发应当是一项愉快的活动。\n\
    \n我认为以上两个特点很好的概括了敏捷开发方法的核心思想：适应变化和以人为中心。\n\n### （二）方法背后的思想\n\nAlistair Cockburn\
    \ 在 Agile Software Development 中讲述了敏捷开发方法背后的思想。\n\n人们掌握过程（process）可以分为 3 个阶段：\n\
    \n1. following：遵循一个定义好的 process\n2. detaching：知道不同 process 的适用范围，在不同的场合使用不同的 process\n\
    3. fluent：不关心是否遵循特定的 process，知道在什么情况下采用什么动作\n\n软件开发是一个充满发明和交流的协作性游戏（cooperative\
    \ game of invention and communication）。软件开发的首要目标是生产出软件，遵循特定的过程和模型只是手段，只要传递了足够的信息，手段是次要的。交流的效果要远远重于交流的形式（Effect\
    \ of communication is more important than the form of communication）。\n\n一般软件开发有两个目标：1.\
    \ 尽快的生产出软件；2. 为下一个 team 或项目做准备，有时这两个目标是矛盾的，我们要在这两个目标之间寻求平衡。\n\n在软件开发中，人的因素要远远大于过程和技术。人是有缺陷的：\n\
    \n1. 容易犯错误，因此必须在错误扩散之前找到并改正错误。\n2. 当觉得可能失去较多的时候，不愿意冒险。\n3. 重新构造而不愿意重复使用已有的东西。\n\
    4. 难于坚持一个习惯。\n\n#### 针对个人因素的几个建议：\n\n1. 具体的模型较抽象的模型更容易理解。\n2. 从一个例子开始是容易的。\n3.\
    \ 通过观察他人的成果学习。\n4. 要有足够的不受打扰的时间。\n5. 分配的工作要与个人意向、能力匹配。\n6. 不正确的奖励会有坏作用，从长期看个人兴趣比奖励更重要，培养在工作中的自豪感：\n\
    \   - pride in work：参与工作的自豪感，通常参与一个重要的工作会有自豪感。\n   - pride in accomplishment：完成工作的自豪感，长期未完的工作会使士气低落。\n\
    \   - pride in contribution：为他人贡献的自豪感。\n7. 鼓励关心其他人的工作和整体的工作。\n\n在一个团队之间，交流是最重要的，实践证明面对面的实时的交流是最有效的，对交流的延误会损失信息，白板是最好的交流工具，交流工具的先进并不能提高交流效果。文档的作用是记录和备忘，不能通过文档交流。\n\
    \n#### 敏捷开发方法要避免的过程设计的几个常见错误：\n\n1. 对所有的项目使用同一种过程。\n2. 没有弹性。\n3. 过于沉重。\n4. 增加不必要的“必须完成”（“should\
    \ do” is really should？）。\n5. 没有经过实践检验。\n\n#### 敏捷开发方法过程设计的几个原则：\n\n1. 交互的面对面的交流是代价最小、最迅速的交换信息的方法。\n\
    2. 超过实际需要的过程是浪费的。\n3. 大的团队需要重量级方法。\n4. 处理重大问题的项目需要重量级方法强调。\n5. 增加反馈和交流可以减少中间产品和文档的需求。\n\
    6. 轻量级方法更强调理解（understanding）、自律（discipline）和技能（skill），重量级方法更强调文档（documentation）、过程（process）和正式（formality）。\n\
    \   - understanding 指整个团队关于项目的全部知识，包括讨论的过程，documentation 只能记录其中的一部分。\n   - discipline\
    \ 是指个人主动的完成工作，process 指个人根据指令完成工作。\n   - skill 指具有良好技能的人可以省略中间的产品，formality 指必须按照规定步骤完成工作。\n\
    7. 确定开发中间的瓶径，提高它的效率。\n   - 对于瓶径处的工作应该尽量加快，减少重复，（使用更熟练的人，使用更多的人，使用更好的工具，使瓶径处的工作的深入尽量稳定）。对于非瓶径处的工作可以多一些重复，在输入还不确定的情况下也可以尽早开始。\n\
    \n"
