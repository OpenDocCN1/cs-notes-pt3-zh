    \  \n先使系统能够正常工作，不要猜测系统的瓶颈，要实际测量\n\n**9）NO overtime**  \n不要长时间的加班，大多数加班并不能挽回已有的延迟，连续超过两个星期的加班说明有问题存在。向一个已经延迟的项目填加人员也是一个不好的选择。\n\
    \n# 4Testing\n\n**1）所有的代码都有单元测试**  \n单元测试是 XP 的基石，XP 中的单元测试应该是可以自动进行的，所以可以很快的进行所有的单元测试，单元测试应该在编码之前创建。单元测试的代码和代码一起在\
    \ release，没有单元测试的代码不能够 release。使用自动单元测试可以系统整合时节省大量的发现错误和改正的时间。单元测试越完善，节省的时间越多。对面向对象的编程来说，应该对每个类都有单元测试。完善的单元测试也是共同拥有代码的保证。单元测试也是可以经常重构的保证，每次重构后的代码都要重新进行测试。\
