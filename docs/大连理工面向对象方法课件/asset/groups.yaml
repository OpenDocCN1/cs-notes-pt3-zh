    在于对繁文缛节的官僚过程的反叛。它们在无过程和过于繁琐的过程中达到了一种平衡，使得能以不多的步骤过程获取较满意的结果。

    敏捷型与滞重型方法有一些显著的区别，其中一个显而易见的不同反映在文档上敏捷型不是很面向文档，对于一项任务，它们通常只要求尽可能少的文档。从许多方面来看，它们更像是“面向源码”（code-oriented）。事实上，它们认为最根本的文档应该是源码。

    但是，我并不认为文档方面的特点是敏捷型方法的根本之点。文档减少仅仅是个表象，它其实反映的是更深层的特点：

    ? 敏捷型方法是“适配性”而非“预设性”。重型方法试图对一个软件开发项目在很长的时间跨度内作出详细的计划，然后依计划进行开发。这类方法在计划制定完成后拒绝变化。而敏捷型方法则欢迎变化。其实，它们的目的就是为适应变化的过程，甚至能允许改变自身来适应变化。

    ? 敏捷型方法是“面向人”（ofpeople-oriented）而非“面向过程”的（process-oriented）。它们试图图使软件开发工作顺应人的天性而非逆之。它们强调软件开发应当是一项愉快的活动。

    我认为以上两个特点很好的概括了敏捷开发方法的核心思想：适应变化和以人为中心


    # （二）方法背后的思想


    Alistair Cockburn 在 Agile Software Development 中讲述了敏捷开发方法背后的思想


    人们掌握过程（process）可以分为 3 个阶段：

    1 following 遵循一个定义好的 process

    2 detaching 知道不同 process 的适用范围，在不同的场合使用不同的 process

    3 fluent 不关心是否遵循特定的 process，知道在什么情况下采用什么动作


    软件开发是一个充满发明和交流的协作性游戏(cooperative game of invention and communication)。软件开发的首要目标是生产出软件，遵循特定的过程和模型只是手段，只要传递了足够的信息，手段是次要的。交流的效果要远远重于交流的形式（Effect
    of communication is more important than the form of communication）。

    一般软件开发有两个目标：1 尽快的生产出软件 2 为下一个 team 或项目做准备，有时这两个目标是矛盾的，我们要在这两个目标之间寻求平衡


    在软件开发中，人的因素要远远大于过程和技术。人是有缺陷的：

    1 容易犯错误，因此必须在错误扩散之前找到并改正错误

    2 当觉得可能失去较多的时候，不愿意冒险

    3 重新构造而不愿意重复使用已有的东西

    4 难于坚持一个习惯'
