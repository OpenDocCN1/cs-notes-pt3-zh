    \n### (1) 存放类型信息\n\n可以看到，在任何类中，不存在显式的类型信息。而先前的例子和简单的逻辑告诉我们，必须有一些类型信息放在对象中，否则，类型不能在运行时建立。实际上，类型信息被隐藏了。为了看到它，这里有一个例子，可以测试使用虚函数的类的长度，并与没有虚函数的类比较。\n\
    \n```cpp\n//: C15:Sizes.cpp\n// Object sizes vs. virtual funcs\n#include <iostream>\n\
    using namespace std;\n\nclass NoVirtual {\n int a;\npublic:\n void x() const {}\n\
    \ int i() const { return 1; }\n};\n\nclass OneVirtual {\n int a;\npublic:\n  \
    \  virtual void x() const {}\n    int i() const { return 1; }\n};\n\nclass TwoVirtuals\
    \ {\n    int a;\npublic:\n    virtual void x() const {}\n    virtual int i() const\
    \ { return 1; }\n};\n\nint main() {\n    cout << \"int: \" << sizeof(int) << endl;\n\
    \    /*4*/\n    cout << \"NoVirtual: \"\n        << sizeof(NoVirtual) << endl;\n\
    \    /*4*/\n    cout << \"void* : \" << sizeof(void*)<< endl;\n    /*4*/\n   \
    \ cout << \"OneVirtual: \"\n        << sizeof(OneVirtual) << endl;\n    /*8*/\n\
    \    cout << \"TwoVirtuals: \"\n        << sizeof(TwoVirtuals) << endl;\n// ...\n\
    }\n```\n\n不带虚函数，对象的长度恰好就是所期望的：单个int的长度。而带有单个虚函数的one_virtual，对象的长度是no_virtual的长度加上一个void指针的长度。它反映出，如果有一个或多个虚函数，编译器在这个结构中插入一个指针（VPTR）。在one_virtual和two_virtuals之间没有区别。这是因为VPTR指向一个存放地址的表，只需要一个指针，因为所有虚函数地址都包含在这个表中。\n\
