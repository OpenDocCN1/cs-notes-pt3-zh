    典型地，actors 是从问题域的描述和与客户、领域专家的交流、讨论中获得的。


    以下问题可以帮助我们很好地找到系统的 actors：


    - 谁对该特定的需求感兴趣？

    - 使用系统的组织在什么地方？

    - 使用系统后的受益者是谁？

    - 是谁给系统提供信息、使用信息和删除信息？

    - 谁对系统进行支持和维护？

    - 系统使用了外部资源吗？

    - 一个人同时扮演几种不同的角色吗？

    - 几个人扮演相同的角色吗？

    - 系统使用遗留下来的应用吗？


    在 UML 中，actor 是用图形表示的，如图 2-1：


    ![](img/3b4669cf00b2833fe526284506f3f342_131_0.png)


    标识系统的 actors 时要特别仔细。可以证明反复的结果——第一阶段的 actors 也就往往是最终的 actors。


    例如，新生和老生是不同的 actor 吗？假设你最初的回答是 yes，下一步的工作是确定 actors 怎样和系统交互。如果新生和系统的交互方式与老生不一样，则新生和老生不是一个
    actor；如果他们和系统的交互操作是一样的，则应该是同一个 actor。


    另一个例子就是不同的人扮演同一个角色。这也是需要注意的。典型的例子就是 Eastern 州立大学课程注册系统中的助教。助教也要选课和任课（即扮演了学生和教授两个角色）。同样的角色已经被表示为学生和教授两个
    actor。因此，不必再为助教标识一个 actor 了。


    浏览 actors 和把他们如何与系统交互写成文字（即我们后面要讲的文档化角色），你就可以得到一个非常完善的 actors 设置了。


    ### Eastern 州立大学课程注册系统中的 Actors


    在课程注册系统中我们可以归纳出来的主要问题是：


