    }\n```\n\n具体策略类实现了抽象策略类所声明的接口，如代码清单 3 所示。\n\n# 代码清单 3：具体策略类的源代码\n\n```java\npublic\
    \ class ConcreteStrategy extends Strategy\n{\n    /**\n     * 策略方法\n     */\n\
    \    public void strategyInterface()\n    {\n        //write you algorithm code\
