    - （2）客户端创建一个ConcreteCreator2对象，然后调用ConcreteCreator2对象的工厂方法factory()，而后者调用ConcreteProduct2的构造子创建出产品对象，如下面的时序图所示。\n\
    \n### 工厂方法模式和简单工厂模式\n\n工厂方法模式和简单工厂模式在结构上的不同是很明显的。工厂方法模式的核心是一个抽象工厂类，而简单工厂模式把核心放在一个具体类上。工厂方法模式可以允许许多具体工厂类从抽象工厂类中将创建行为继承下来，从而可以成为多个简单工厂模式的综合，进而推广了简单工厂模式。\n\
    \n工厂方法模式退化后可以变得和简单工厂模式一样。设想如果非常确定一个系统只需要一个具体工厂类，那么就不妨把抽象工厂类合并到具体的工厂类中去。由于这只有一个具体工厂类，所以不妨将工厂方法改成为静态方法，这时候就得到了简单工厂模式。\n\
    \n与简单工厂模式中的情形一样的是，ConcreteCreator的factory()方法返回的数据类型是一个抽象类型Product，而不是哪一个具体产品类型，而客户端也不知晓所得的产品的真实类型。这种多态性设计将工厂类选择创建哪一个产品对象、如何创建这个对象的细节完全封装在具体工厂类内部。\n\
    \n工厂方法模式之所以有一个别名叫多态性工厂模式，显然是因为具体工厂类都有共同的接口，或者都有共同的抽象父类。\n\n如果系统需要加入一个新的产品，那么所需要的就是向系统中加入一个这个产品类以及它所对应的工厂类。没有必要修改客户端，也没有必要修改抽象工厂角色或者其他已有的具体工厂角色。对于增加新的产品类而言，这个系统完全支持“开-闭”原则。\n"
