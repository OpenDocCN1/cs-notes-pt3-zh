  - '[PAGE 253]


    +   7）move people around

    +   不要使每个开发人员局限于一项工作，不要使某项工作依赖于一个开发人员，增加知识共享，减少信息孤岛，多进行交流和培训。当项目中的所有人对所有模块都了解并可以进行开发时是效率最高的，鼓励开发人员在不同
    iteration 中开发不同的模块。


    +   8）stand-up meeting

    +   每天工作开始之前，开 5-10 分钟的 stand-up 会议（站立会议），站立的目的是为了强迫节省时间，会议的目的是交流，提出存在的问题，但不要在会议上解决问题。开一个所有人员参加的短会比多个小队人员参加的会议要高效。在会议上提出的问题可以由少数人讨论解决，这个少数人参加的会议如果涉及到代码，可以在[计算机]前讨论。


    +   9）fix XP when it breaks

    +   XP 并不是一成不变的，当团队觉得需要修改的时候，可以根据自己的情况进行修改，但每修改都要经过整个团队的讨论和达成一致


    # 2 Designing


    +   1）Simplicity

    +   保持简单的设计，在完成同样的功能的情况下，选择简单的设计，不要急于设计没有计划的功能，应该认识到：keeping a design simple is
    hard work


    +   2）system metaphor

    +   使用统一的术语描述系统，在用户，管理者和开发人员之间使用统一的术语。这样使交流清晰。


    +   3）CRC card

    +   使用 CRC([Class, Responsibilities, and Collaboration]) card 进行系统设计，鼓励更多的人参加设计。每个
    CRC 卡片表示系统中一个对象，写上对象的名字，责任和每个责任需要交互的其他对象。可以模拟对象之间的交互。CRC 卡片是易于理解的，但是是非正式的，如果需要正式的文档，要将卡片转换为相应的文档。


    +   4）spike solution

    +   使用 spike solution 减低风险，当遇到技术难题或设计问题时，使用简单的程序进行测试，找出问题，在不同的解决方法之间进行评估。在早期进行实验可以有效的降低风险。


    +   5）never add function early

    +   不要过早的设计没有计划的功能，在一个需求经常变化的环境中，过早的设计经常是没有用的。'
