    \ UML 文档。（2）用例分析一>撰写代码一>重构代码。第一个流程只有一个优势，就是人对图形的理解比对代码的理解更加直观，但是多了很多繁琐工作。第二个流程少了很多步骤，并且可以随时根据代码逆向工程出类图出来。\n\
    \n我还是喜欢以代码为基础的流程。撰写代码也可分为 2 个过程，第一个过程是写出一个代码框架，所有的方法都是 UNDO，写出属性，接口，写出///文档。这应该是设计过程。这个过程基本上只产生、维护源文件。类图可以通过\
    \ visio 逆向工程，类设计文档可以通过 NDoc 自动生成，并且提供了一个测试基础，可以根据这个测试基础写测试代码了。测试代码最好也只写个框架，但是要写///注释，然后生成测试文档。这应该是设计过程。第二个过程是实现过程，把类文档和代码框架提交给相关人，实现、测试、重构……一切都自动进行……整个过程中只有一份东西，就是源代码，开发过程中的交付件应该都从源代码中自动生成。\n\
    \n数据库脚本和文档用 CASE Studio 2 维护。最后提交、上线、验收都很好办，所要的东西标记一下子都出来了。要申报著作权直接从源代码和 chm 文档中弄一部分出来就够了。\n\
    \n开发的核心是源代码，所有文档应该体现在源代码的结构、关系和注释中。控制整个开发流程的核心工具是 Nant。要是能把用例分析过程体现在源代码中就好了！\n\
    \n# ## 行为模式\n\n行为模式涉及到算法和对象间职责的分配。行为模式不仅描述对象或类的模式，还描述它们之间的通信模式。\n\n行为类模式使用继承机制在类间分派行为。\n\
    \n行为对象模式使用对象复合而不是继承。一些行为对象模式描述了一组对等的对象怎样相互协作以完成其中任一个对象都无法单独完成的任务。这里一个重要的问题是对等的对象如何互相了解对方。对等对象可以保持显式的对对方的引用，但那会增加它们的耦合度。\n\
    \nObserver模式定义并保持对象间的依赖关系。典型的Observer的例子是Smalltalk中的模型/视图/控制器，其中一旦模型的状态发生变化，模型的所有视图都会得到通知。\n\
    \n其他的行为对象模式将行为封装在一个对象中并将请求指派给它。\n\nStrategy模式将算法封装在对象中，这样可以方便地指定和改变一个对象所使用的算法。\n\
    \nCommand模式将请求封装在对象中，这样它就可作为参数来传递，也可以被存储在历史列表里，或者以其他方式使用。\n\nState模式封装一个对象的状态，使得当这个对象的状态对象变化时，该对象可改变它的行为。\n\
    \nIterator模式则抽象了访问和遍历一个集合中的对象的方式。\n\n# ## COMMAND（命令）—对象行为型模式\n\n# ### 1. 意图\n\
    \n将一个请求封装为一个对象，从而可用不同的请求对客户进行参数化；对请求排队或记录请求日志，以及支持可撤消的操作。\n\n# ### 2. 别名\n\n动作（Action），事务（Transaction）\n\
    \n# ### 3. 动机\n\n有时必须向某对象提交请求，但并不知道关于被请求的操作或请求的接受者的任何信息。\n\n例如，用户界面工具箱包括按钮和菜单这样的对象，它们执行请求响应应用户输入。但工具箱不能显式的在按钮或菜单中实现该请求，因为只有使用工具箱的应用知道该由哪个对象做哪个操作。而工具箱的设计者无法知道请求的接受者或执行的操作。\n\
    \n命令模式通过将请求本身变成一个对象来使工具箱对象可向未指定的应用对象提出请求。\n\n![](img/3b4669cf00b2833fe526284506f3f342_270_0.png)\n\
    \n用 **Command** 对象可很容易的实现菜单（**Menu**），每一菜单中的选项都是一个菜单项（**MenuItem**）类的实例。一个 **Application**\
    \ 类创建这些菜单和它们的菜单项以及其余的用户界面。该 **Application** 类还跟踪用户打开的 **Document** 对象。该应用为每一个菜单项配置一个具体的\
    \ **Command** 子类的实例。当用户选择了一个菜单项时，该 **MenuItem** 对象调用它的 **Command** 对象的 **Execute**\
    \ 方法，而 **Execute** 执行相应操作。\n\n**MenuItem** 对象并不知道它们使用的是 **Command** 的哪一个子类。**Command**\
    \ 子类里存放着请求的接收者，而 **Execute** 操作将调用该接收者的一个或多个操作。\n\n例如，**PasteCommand** 支持从剪贴板向一个文档（**Document**）粘贴正文。**PasteCommand**\
    \ 的接收者是一个文档对象，该对象是实例化时提供的。**Execute** 操作将调用 **Document** 的 **Paste** 操作。\n\n![](img/3b4669cf00b2833fe526284506f3f342_270_1.png)\n\
    \n而 **OpenCommand** 的 **Execute** 操作却有所不同：它提示用户输入一个文档名，创建一个相应的文档对象，并打开该文档。\n\n\
    ![](img/3b4669cf00b2833fe526284506f3f342_271_0.png)\n\n有时一个MenuItem需要执行一系列命令。例如，使一个页面按正常大小居中的MenuItem可由一个CenterDocumentCommand对象和一个NormalSizeCommand对象构建。因为这种需将多条命令串接起来的情况很常见，我们定义一个MacroCommand类来让一个MenuItem执行任意数目的命令。MacroCommand是一个具体的Command子类。它执行一个命令序列。MacroCommand没有明确的接收者，而序列中的命令各自定义其接收者。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_271_1.png)\n\n一个应用如果想让一个菜单与一个按钮代表同一项功能，只需让它们共享相应具体Command子类的同一个实例即可。我们也可通过将几个命令组成更大的命令的形式来支持命令脚本（command\
    \ scripting）。所有这些之所以成为可能乃是因为提交一个请求的对象仅需知道如何提交它，而不需知道该请求将会被如何执行。\n\n# 4. 适用性\n\n\
    # 5. 结构\n\n![](img/3b4669cf00b2833fe526284506f3f342_272_0.png)\n\n# 6. 参与者\n\n\
    - **Command**\n  - 声明执行操作的接口。\n- **ConcreteCommand（PasteCommand，OpenCommand）**\n\
    \  - 将一个接收者对象绑定于一个动作。\n  - 调用接收者相应的操作，以实现Execute。\n- **Client（Application）**\n\
    \  - 创建一个具体命令对象并设定它的接收者。\n- **Invoker（MenuItem）**\n  - 要求该命令执行这个请求。\n- **Receiver（Document，Application）**\n\
    \  - 知道如何实施与执行一个请求相关的操作。任何类都可能作为一个接收者\n\n# 7. 协作关系\n\n- Client创建一个ConcreteCommand对象并指定它的Receiver对象。\n\
    - 某Invoker对象存储该ConcreteCommand对象。\n- 该Invoker通过调用Command对象的Execute操作来提交一个请求。\n\
    - ConcreteCommand对象调用它所绑定的Receiver的一些操作以执行该请求。\n\n# 8. 效果\n\nCommand模式有以下效果：\n\
    \n- **Command模式将调用操作的对象与知道如何实现该操作的对象解耦。**\n- **可将多个命令装配成一个复合命令。**例如是前面描述的MacroCommand类。一般说来，复合命令是Composite模式的一个实例。\n\
    - **增加新的Command很容易，**因为这无需改变已有的类。\n\n# 9. 实现\n\n实现Command模式时须考虑以下问题：\n1）一个命令对象应达到何种智能程度命令对象的能力可大可小。一个极端是它仅确定一个接收者和执行该请求的动作。另一极端是它自己实现所有功能，根本不需要额外的接收者对象。当需要定义与已有的类无关的命令，当没有合适的接收者，或当一个命令隐式地知道它的接收者时，可以使用后一极端方式。例如，创建另一个应用窗口的命令对象本身可和任何其他的对象一样有能力创建该窗口。在这两个极端间的情况是命令对象有足够的信息可以动态的找到它们的接收者。\n\
    2）支持取消（undo）和重做（redo） 如果Command提供方法逆转（reverse）它们操作的执行（例如Unexecute或Undo 操作），就可支持取消和重做功能。为达到这个目的，ConcreteCommand类可能需要存储额外的状态信息。这个状态包括：\n\
    - 接收者对象，它真正执行处理该请求的各操作。\n- 接收者上执行操作的参数。\n- 如果处理请求的操作会改变接收者对象中的某些值，那么这些值也必须先存储起来。接收者还必须提供一些操作，以使该命令可将接收者恢复到它先前的状态。\n\
    若应用只支持一次取消操作，那么只需存储最近一次被执行的命令。而若要支持多级的取消和重做，就需要有一个已被执行命令的历史表列（history list），该表列的最大长度决定了取消和重做的级数。历史表列存储了已被执行的命令序列。向后遍历该表列并逆向执行（reverse-executing）命令是取消它们的结果；向前遍历并执行命令是重执行它们。\n\
    有时可能不得不将一个可撤消的命令在它可以被放入历史表列中之前先拷贝下来。这是因为执行原来的请求的命令对象将在稍后执行其他的请求。如果命令的状态在各次调用之间会发生变化，那就必须进行拷贝以区分相同命令的不同调用。\n\
    例如，一个删除选定对象的删除命令（DeleteCommand）在它每次被执行时，必须存储不同的对象集合。因此该删除命令对象在执行后必须被拷贝，并且将该拷贝放入历史表列中。如果该命令的状态在执行时从不改变，则不需要拷贝，而仅需将一个对该命令的引用放入历史表列中。在放入历史表列中之前必须被拷贝的那些Command起着原型（参见Prototype模式（3.4））的作用。\n\
    3）避免取消操作过程中的错误积累在实现一个可靠的、能保持原先语义的取消/重做机制时，可能会遇到滞后影响问题。由于命令重复的执行、取消执行，和重执行的过程可能会积累错误，以至一个应用的状态最终偏离初始值。这就有必要在Command中存入更多的信息以保证这些对象可被精确地复原成它们的初始状态。这里可使用Memento模式（5、6）来让该Command访问这些信息而不暴露其他对象的内部信息。\n\
    4）使用C++模板对（1）不能被取消（2）不需要参数的命令，我们可使用C++模板来实现，这样可以避免为每一种动作和接收者都创建一个Command子类。我们将在代码示例一节说明这种做法。\n\
    \n# 10. 代码示例\n\n"
