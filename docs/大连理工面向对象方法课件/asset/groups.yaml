  - "[PAGE 117]\n\n# 单件继续——关于 Singleton 子类\n\n因为 instance 是一个指向 Singleton 对象的指针，Instance\
    \ 成员函数可以将一个指向 Singleton 的子类的指针赋给这个变量。\n\n关于 C++ 的实现还有一点需要注意。将单例定义为一个全局或静态的对象，然后依赖于自动的初始化，这是不够的。有如下三个原因：\n\
    \n+   - 我们不能保证静态对象只有一个实例会被声明。\n+   - 我们可能没有足够的信息在静态初始化时实例化每一个单件。单件可能需要在程序执行中稍后被计算出来的值。\n\
    +   - C++ 没有定义全局对象的构造器的调用顺序。这就意味着单件并不能在依赖关系中保证。如果有，那么错误将是不可避免的。\n+   - 使用全局/静态对象的实现方法还有另一个（尽管很小）缺点，它使得所有的单件无论何时与否都要被创建。使用静态成员函数避免了所有这些问题。\n\
    \n# 创建 Singleton 类的子类\n\n最简单的技术是在 Singleton 的 Instance 操作中决定你想使用的是哪一个单件。\n\n假定我们定义一个\
    \ MazeFactory 类用于建造所描述的迷宫。MazeFactory 定义了一个建造迷宫的不同部件的接口。子类可以重定义这些操作以返回特定产品类的实例，如用\
    \ BombedWall（被轰倒的墙）对象代替普通的 Wall 对象。\n\n此处相关的问题是 Maze 应用仅需一个工厂的一个实例，且这个实例对建造每一任何部件的代码都是可用的。这样就引入了\
    \ Singleton 模式。将 MazeFactory 作为单件我们无需借助全局变量就可使迷宫对象具有全局可访问性。\n\n**首先：** 为简单起见，我们先假定不会生成\
    \ MazeFactory 的子类。（我们随后将考虑另一个选择。）我们通过增加静态的 Instance 操作和静态的用以保存唯一实例的成员 _instance，从而在\
    \ C++ 中生成一个 Singleton 类。我们还必须保护构造器以防止意外的实例化，因为意外的实例化可能会导致多个实例。\n\n```\n```cpp\n\
    class MazeFactory {\npublic:\n    static MazeFactory* Instance();\n\n    // existing\
