    \n**4）在C++中使用多态的迭代器。**使用多态迭代器是有代价的。它们要求用一个Factory Method动态的分配迭代器对象。因此仅当必须多态时才使用它们。否则使用在栈中分配内存的具体的迭代器。\n\
    \n多态迭代器有一个缺点：客户必须负责删除它们。这容易导致错误，因为你容易忘记释放一个使用堆分配的迭代器对象，当一个操作有多个出口时尤其如此。而且其间如果有异常被触发的话，迭代器对象将永远不会被释放。\n\
    \n**6）迭代器可有特权访问** 迭代器可被看为创建它的聚合的一个扩展。迭代器和聚合紧密耦合。在 C++ 中我们讨论迭代器作为它的聚合的一个友元（friend）来表示这种紧密的关系。这样你就不需要在聚合类中定义一些仅为迭代器所使用的操作。\n\
    \n但是，这样的特权访问可能使定义新的遍历变得很难，因为它将要求改变该聚合的接口增加另一个友元。为避免这一问题，迭代器类包含一些 protected 操作来访问聚合类的重要的非公共可见的成员。这些保护类（只具有迭代器子类）可使用这些\
    \ protected 操作来得到对该聚合的特权访问。\n\n**7）用于复合对象的迭代器。** 在 Composite（4.3）模式中的那些递归聚合结构上，外部迭代器可能难以实现，因为在该结构中不同对象处于嵌套聚合的多个不同层次，因此一个外部迭代器为跟踪当前的对象必须存储一条纵贯该\
    \ Composite 的路径。有时使用一个内部迭代器会更容易一些。它仅需遍历地调用自己即可，这样就隐藏此路径给存储在调用栈中的成员，而无需显式地维护当前对象位置。\n\
    \n如果复合中的节点有一个接口可以从一个节点移到它的兄弟节点、父节点和子节点，那么基于游标的迭代器是个更好的选择。游标只需跟踪当前的节点；它可依赖这种节点接口来遍历复合对象。\n\
    \n复合常常需要用多种方法遍历。前序，后序，中序以及广度优先遍历都是常用的。你可用不同的迭代器类来支持不同的遍历。\n\n"
  mdcn: "\n\n## 行为模式\n\n行为模式涉及到算法和对象间职责的分配。行为模式不仅描述对象或类的模式，还描述它们之间的通信模式。\n\n（1）**行为类模式**使用继承机制在类间分派行为。\n\
    \n（2）**行为对象模式**使用对象复合而不是继承。一些行为对象模式描述了一组对象的对象怎样相互协作以完成其中任何一个对象都无法单独完成的任务。这里一个重要的问题是对等的对象如何互相了解对方。对等对象可以保持显式的对方的引用，但那会增加它们的耦合度。\n\
    \n**Observer模式**定义并保持对参照的依赖关系。典型的Observer的例子是Smalltalk中的模型/视图/控制器，其中一旦模型的状态发生变化，模型的所有视图都会得到通知。\n\
    \n其他的行为对象模式常将行为封装在一个对象中并将请求指派给它。\n\n**Strategy模式**将算法封装在对象中，这样可以方便地指定和改变一个对象所使用的算法。\n\
    \n**Command模式**将请求封装在对象中，这样它就可作为参数来传递，也可以被存储在历史列表里，或者以其他方式使用。\n\n**State模式**封装一个对象的状态，使得当这个对象的状态对象变化时，该对象可以改变它的行为。\n\
    \n**Iterator模式**则抽象了访问和遍历一个集合中的对象的方式。\n\n## ITERATOR(迭代器)—对象行为型模式\n\n### 1. 意图\n\
    \n提供一种方法顺序访问一个聚合对象中各个元素，而又**不需暴露**该对象的内部表示。\n\n### 2. 别名\n\n游标（Cursor）。\n\n###\
    \ 3. 动机\n\n一个聚合对象，如**列表（list）**，应该提供一种方法来让别人可以访问它的元素，而又不需暴露它的内部结构。此外，针对不同的需要，可能要以不同的方式遍历这个列表。\n\
    \n迭代器模式可解决这些问题。这一模式的关键思想是将对列表的**访问和遍历**从列表对象中分离出来并放入一个**迭代器（iterator）对象**中。**迭代器类**定义了一个访问该列表元素的接口。迭代器对象负责跟踪当前的元素；即，它知道哪些元素已经遍历过了。\n\
    \n例如，一个列表（list）类可能需要一个列表迭代器（listiterator），它们之间的关系如下图：\n\n![](img/3b4669cf00b2833fe526284506f3f342_218_0.png)\n\
    \n上图中：\n\n在实例化列表迭代器之前，必须提供待遍历的列表。一旦有了该列表迭代器的实例，就可以顺序地访问该列表的各个元素。\n\nCurrentItem操作返回列表中的当前元素，\n\
    First操作初始化迭代器，使当前元素指向列表的第一个元素，\nNext操作将当前元素指针向前推进一步，指向下一个元素，\nIsDone检查是否已越过最后一个元素，也就是完成了这次遍历。\n\
    \n将遍历机制与列表对象分离使我们可以定义不同的迭代器来实现不同的遍历策略，而无需在列表接口中列举它们。\n\n例如，过滤表列迭代器（FilteringListIterator）可能只访问那些满足特定过滤约束条件的元素。\n\
    \n注意：迭代器和列表是耦合在一起的，而且客户对象必须知道遍历的是一个列表而不是其他聚合结构。最好能有一种办法使得不需改变客户代码即可改变该聚合类。可以通过将迭代器的概念推广到多态迭代（polymorphic\
    \ iteration）来达到这个目标。\n\n首先，定义一个抽象列表类AbstractList，它提供操作列表的公共接口。类似地，我们也需要一个抽象的迭代器类Iterator，它定义公共的迭代接口。然后我们可以为每个不同的列表实现定义具体的Iterator子类。这样迭代机制就与具体的聚合类无关了。\n\
    \n余下的问题是如何创建迭代器。既然要使这些代码不依赖于具体的列表子类，就不能仅仅单地实例化一个特定的类，而要让列表对象负责创建相应的迭代器。这段需要在列表对象提供\
    \ CreateIterator 这样的操作，客户请求调用该操作以获得一个迭代器对象。\n\n## 4. 适用性\n\n迭代器模式可用来：\n\n- 访问一个聚合对象的内容而无需暴露它的内部表示。\n\
    - 支持对聚合对象的多种遍历方式。\n- 为遍历不同的聚合结构提供一个统一的接口（即，支持多态迭代）。\n\n## 5. 结构\n\n![](img/3b4669cf00b2833fe526284506f3f342_219_1.png)\n\
    \n## 6. 参与者\n\n- **Iterator（迭代器）**\n\n  —— 迭代器定义访问和遍历元素的接口。\n\n- **ConcreteIterator（具体迭代器）**\n\
    \n  - 具体迭代器实现迭代器接口。\n  - 对该聚合遍历时跟踪当前位置信息。\n\n- **Aggregate（聚合）**\n\n  - 聚合定义创建相应迭代器对象的接口。\n\
    \n- **ConcreteAggregate（具体聚合）**\n\n  - 具体聚合实现创建相应迭代器的接口，\n  - 该操作返回ConcreteIterator的一个适当的实例。\n\
    \n## 7. 协作\n\n- ConcreteIterator跟踪聚合中的当前对象，并能够计算出待遍历的后继对象。\n\n## 8. 效果\n\n迭代器模式有三个重要的作用：\n\
    \n1）**它支持以不同的方式遍历一个聚合。**复杂的聚合可用多种方式进行遍历。例如，代码生成和语义检查要遍历分析树。代码生成可以按字序或按前序来遍历语法分析树。迭代器模式使得改变遍历算法变得很容易：仅需用一个不同的迭代器的实例代替原先的实例即可。\n\
    \n也可以自己定义迭代器的子类以支持新的遍历。\n\n2）**迭代器简化了聚合的接口。**有了迭代器的遍历接口，聚合本身就不再需要类似的遍历接口了。这样就简化了聚合的接口。\n\
    \n3）**在同一个聚合上可以有多个遍历。**每个迭代器保持它自己的遍历状态。\n\n## 9. 实现\n\n迭代器在实现上有许多变化和选择。下面是一些较重要的实现。实现迭代器模式时常常需要根据所使用的语言提供的控制结构来进行权衡。\n\
    \n**1）谁控制该迭代。**一个基本的问题是决定由哪一方来控制该迭代，是迭代器还是使用该迭代器的客户。\n\n**当由客户来控制迭代时**，该迭代器称为一个外部迭代器(external\
    \ iterator)，使用外部迭代器的客户必须主动推进遍历的步伐，显式地向迭代器请求下一个元素。\n\n**当由迭代器控制迭代时**，该迭代器称为一个内部迭代器(internal\
    \ iterator)。使用内部迭代器，客户只需向其提交一个待执行的操作，而迭代器将对聚合中的每一个元素实施该操作。\n\n**外部迭代器比内部迭代器更灵活。**例如，若要比较两个集合是否相等，这个功能很容易用外部迭代器实现，而几乎无法用内部迭代器实现。\n\
    \n**2）谁定义遍历算法。**迭代器不是唯一可定义遍历算法的地方。聚合本身也可以定义遍历算法，并在遍历过程中用迭代器来存储当前迭代的状态。我们称这种迭代器为一个游标(cursor)，因为它仅用来指示当前位置。客户会以这个游标为一个参数调用该聚合的Next操作，而Next操作将改变这个指示器的状态。\n\
    \n如果迭代器负责遍历算法，那么将易于在相同的聚合上使用不同的迭代算法，同时也易于在不同的聚合上重用相同的算法。从另一方面说，遍历算法可能需要访问聚合的私有变量。如果这样，将遍历算法放入迭代器中会破坏聚合的封装性。\n\
    \n**3）迭代器健壮程度如何。**在遍历一个聚合的同时更改这个聚合可能是危险的。如果在遍历聚合的时候增加或删除该聚合元素，可能会导致两次访问同一个元素或者遗漏某个元素。\n\
    \n**一个健壮的迭代器(robust iterator)保证插入和删除操作不会干扰遍历，且不需拷贝该聚合。**\n\n**有许多方法来实现健壮的迭代器。**其中大多数需要向这个聚合注册该迭代器。当插入或删除元素时，该聚合要么调整迭代器的内部状态，要么在内部的维护额外的信息以保证正确的遍历。\n\
    \n**4）在C++中使用多态的迭代器。**使用多态迭代器是有代价的。它们要求用一个Factory Method动态的分配迭代器对象。因此仅当必须多态时才使用它们。否则使用在栈中分配内存的具体的迭代器。\n\
    \n多态迭代器有一个缺点：客户必须负责删除它们。这容易导致错误，因为你容易忘记释放一个使用堆分配的迭代器对象，当一个操作有多个出口时尤其如此。而且其间如果有异常被触发的话，迭代器对象将永远不会被释放。\n\
    \n**6）迭代器可有特权访问** 迭代器可被看为创建它的聚合的一个扩展。迭代器和聚合紧密耦合。在 C++ 中我们讨论迭代器作为它的聚合的一个友元（friend）来表示这种紧密的关系。这样你就不需要在聚合类中定义一些仅为迭代器所使用的操作。\n\
    \n但是，这样的特权访问可能使定义新的遍历变得很难，因为它将要求改变该聚合的接口增加另一个友元。为避免这一问题，迭代器类包含一些 protected 操作来访问聚合类的重要的非公共可见的成员。这些保护类（只具有迭代器子类）可使用这些\
    \ protected 操作来得到对该聚合的特权访问。\n\n**7）用于复合对象的迭代器。** 在 Composite（4.3）模式中的那些递归聚合结构上，外部迭代器可能难以实现，因为在该结构中不同对象处于嵌套聚合的多个不同层次，因此一个外部迭代器为跟踪当前的对象必须存储一条纵贯该\
    \ Composite 的路径。有时使用一个内部迭代器会更容易一些。它仅需遍历地调用自己即可，这样就隐藏此路径给存储在调用栈中的成员，而无需显式地维护当前对象位置。\n\
    \n如果复合中的节点有一个接口可以从一个节点移到它的兄弟节点、父节点和子节点，那么基于游标的迭代器是个更好的选择。游标只需跟踪当前的节点；它可依赖这种节点接口来遍历复合对象。\n\
    \n复合常常需要用多种方法遍历。前序，后序，中序以及广度优先遍历都是常用的。你可用不同的迭代器类来支持不同的遍历。\n\n"
