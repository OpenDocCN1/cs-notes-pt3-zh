    # 二、敏捷开发的设计原则


    关于敏捷开发的设计原则：

    单一职责原则 SRP：Single Responsibility Principle

    开放封闭原则 OCP：Open—Close Principle

    Liskov 替换原则 LSP：Liskov Substitution Principle

    依赖倒置原则 DIP：Dependency Invirtion Principle

    接口隔离原则 ISP：Interface Separate Principle

    关于包的设计原则：

    重用发布等价原则 REP：Reuse Equivalence Principle

    共同重用原则 CRP：Common Resue Principle

    共同封闭原则 CCP：Common Close Principle

    无环依赖原则 ADP：Acylic Dependency Principle

    稳定依赖原则 SDP：Stabilization Dependency Principle'
