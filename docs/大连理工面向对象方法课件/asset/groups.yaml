  - '[PAGE 244]


    敏捷开发（agile development）概念从 2004 年初开始广为流行。Bailar 非常支持这一理论，他采取了“敏捷方式”组建团队：Capital
    One 的“敏捷团队”包括 3 名业务人员、两名操作人员和 5～7 名 IT 人员，其中包括 1 个业务信息指导（实际上是业务部门和 IT 部门之间的“翻译者”）；另外，还有一个由项目经理和至少
    80 名开发人员组成的团队。这些开发人员都曾被 Bailar 送去参加过“敏捷开发”的培训，具备相关的技能。


    每个团队都有自己的敏捷指导（Bailar 聘用了 20 个敏捷指导），他的工作是关注流程并提供建议和支持。最初提出的需求被归纳成一个目标、一堆记录详细需要的卡片及一些供参考的原型和模板。在整个项目阶段，团队人员密切合作，开发有规律地停顿~在
    9 周开发过程中停顿 3～4 次，以评估过程及决定需求变更是否必要。在 Capital One，大的 IT 项目会被拆分成多个子项目，安排给各“敏捷团队”，这种方式在“敏捷开发”中叫“蜂巢式（swarming）”，所有过程由一名项目总经理控制。


    为了检验这个系统的效果，Bailar 将项目拆分，从旧的“瀑布式”开发转变为“序列式”开发，形成了“敏捷开发”所倡导的精干而灵活的开发团队，并将开发阶段分成
    30 天一个周期，进行“冲刺”~每个冲刺始于一个启动会议，到下个冲刺前结束。


