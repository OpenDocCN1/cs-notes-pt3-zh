    # 6. 思考题


    +   1. 什么是面向对象分析？分析问题的层次是什么？

    +   2. 试阐述面向对象分析的过程。

    +   3. 面向对象设计应该遵循哪些准则？简述每条准则的内容，并说明这些准则的必要性。

    +   4. 简述面向对象的基本设计方法。

    +   5. 试比较面向对象设计范式与过程设计范式。

    +   6. UML 的定义是什么？以及它的组成部分有哪些？

    +   7. UML 的内容包括哪些成分？它的特点是什么？'
