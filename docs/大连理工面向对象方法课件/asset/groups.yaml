    \n## 二、两种方法的初步的、概要的比较\n\n此处只给出一般的、总体的框架性的总结\n\n面向对象编程方法代表了一种新颖的计算机程序设计的思维和方法，它通过寻找共同性把软件系统划分为类，建立子类来处理具体个性，这样一步步对软件系统构造出一个合理的类和子类的层次体系结构。它与传统的面向过程的程序设计的思维和方法有很大的区别与联系。\n\
    \n### （一）了解基本内容\n\n计算机软件设计一直被两大问题所困扰：\n\n- 一是如何超越程序设计的复杂性障碍；\n- 二是如何在计算机系统中自然地表示客观世界，即对象模型。\n\
    \n一个对象像一个软件构造块，它包含了数据结构，并提供相关的行为。对象本身可为用户提供一系列的服务——可以改变对象状态、测试、传递消息等，用户无需知道服务的任何实现细节，操作完全是封闭的，也就是说对用户是透明的。\n\
    \n抽象数据类型是面向对象程序设计的中心概念之一。在大多数面向对象程序设计语言中，类的定义描述以抽象数据类型为基础的对象行为，抽象数据类型定义了能以类为基础执行所有操作的接口。类定义也指定了实现细节或类型的数据结构。通常这些实现细节仅在该类范围内存取，称这种类型为私有类型（Private）；当数据类型的全部或部分在该类范围外存取时，称之为公共（Public）类型。\n\
    \n为一个类定义的所有操作称为方法（Method），这相当于面向过程编程方法中独立定义的过程或函数。一个对象（Object）是被一个特定类说明的变量，它通过包含在类内的所有域的拷贝（Private\
    \ 或 Public 两部分）来封装。通过访问一个或几个在类上定义的方法，可以对该对象实现各种操作。每个类变量或对象表示该类的一个实例（Instance）。\n\
    \n面向对象方法通过子类提供类型的等级层次。一个子类（Subclass）定义一个对象集合的行为，该对象继承父类（Parent）的各种特征。借助建立子类的方法，可使软件开发的周期缩短，从而降低开发复杂性和费用。\n\
    \n### （二）面向对象软件系统的特点\n\n面向对象软件系统的结构建立在一系列类上，这些类刻画了系统中所有要处理的基本数据类型的行为。面向对象程序设计集中在对数据操作而不是对过程操纵。\n\
    \n比如，在我们编写的任意整数排序的程序中，不用类的方法就是面向过程的设计方法，而用类的方法就是面向对象的方法。在前者中，我们定义了数据结构后，以后的精力都集中在了函数或过程的设计、处理中，需求变化后，不仅数据结构需要修改，而且相应的过程也要修改；在后者中，对数据的操纵一直和数据密切相关，类的定义同时就包含了数据结构和相应操作的定义，而不是分开来独立进行的。\n\
    \n定义一个面向对象软件系统的结构框架和一个高层体系结构，最终只表现为一系列类（子类）及它们的定义和对象，用方法接口描述每个类的行为特征。类中定义的方法的接口可以和实现细节的定义分开，这就导致了概念（与方法接口有关的类定义）和它的实现（实现这个类的数据结构和算法的代码）的分离，这一点在面向对象的程序设计中非常重要，因为它可以提高系统的可重用性、控制维护花费。\n\
    \n可重用性使得用户无需关心类内部的方法是如何实现的，也就是说，从用户观点来说，方法实现被包含在隐藏细节的“黑盒”中。可维护性也很重要，因为改变数据结构和算法（即实现类的代码）仅局限于实现这个类或类的一部分的代码区域内，这给维护提供了极大方便。\n\
    \n面向对象的程序设计中，把密切相关的数据与过程定义为一个整体（即对象），而且一旦作为一个整体定义了之后，就可以使用它而无需了解其中的实现细节。面向对象软件系统的构造不仅局限于对象的内部结构，而仅依赖于能在对象内部数据上执行操作的方法。\n\
    \n封装和数据隐藏使软件设计者避免了许多维护问题，一旦数据（类型）结构修改了，仅对实现模型的代码局部区域作适当变化，软件系统其余部分原则上不动。\n\n用户在使用时，只需定义一个相关类的对象，通过调用其中的方法（如存储）来实现相应的操作，而不必关心存储这一方法在类中是如何定义及实现的。改变数据结构和算法时，只需修改类的定义部分，而不涉及整个软件系统。\n\
    \n再比如在我们的排序程序中，当数据结构变化时，仅需修改类 sort 的定义部分（一般不提倡，也不应该），而其他部分不用修改。而在非面向对象的设计中，我们需要修改的还包括实现排序的过程或函数。\n\
    \n在面向对象程序设计中，对象而不是函数或过程代表问题解的真正环节。\n\n面向对象程序设计的最根本的目的是使程序员更好地理解和管理庞大而复杂的程序，它在面向过程程序设计的基础上完成进一步的抽象。这种在设计方法上更高层次的抽象正是为了适应目前软件开发的特点。\n\
    \n**特点：**\n\n- （1）自然、直观；\n- （2）继承为复用提供了有效手段；\n- （3）类与对象成为基本的模块；\n- （4）多态性增强了操作的透明性、可理解性和可维护性；\n\
    - （5）吸取了结构化程序设计的优点，追求的目标是将现实世界的问题求解尽可能简单化；\n- （6）将数据和对数据的操作放在一起，作为一个不可分割的整体来处理，它采用抽象和信息隐藏技术。将对象及对象的操作抽象成一种新的数据类型——类，并且考虑了不同对象之间的联系和对类的重用性。\n\
    \n**强调：**\n\n- （1）面向对象的程序设计方法充分吸收结构化程序设计优点，引进了一些新的、强有力的概念。\n- （2）面向对象的程序设计方法把可重复使用性视为软件开发的中心问题，通过装配可重用的部件来生产软件，而不是像以前编程所用的那样，通过调用函数库中的函数来实现。\n\
    - （3）我们是基于应用程序这一个层次来阐述这些问题的。事实上，在对象内部的实现上，仍然使用面向过程的结构化程序设计方法，也常常调用 C/C++(Java)\
    \ 函数库中的很多有用的函数。但从程序的总体结构上说，它是由一系列对象构成的，对象之间能够以某种方式进行通信和协作，从而实现程序的具体功能。\n\n###\
    \ （三）面向过程程序设计的特点\n\n面向过程程序设计的主要特点是许多重要的过程和函数（子程序）的实现严格依赖于关键数据结构，如果这些关键数据结构的一个或几个数据有所变动，则涉及到整个软件系统，许多过程和函数必须重写，甚至因为几个关键数据结构变动，导致整个软件系统彻底崩溃。\n\
    \n传统的“结构化程序设计”方法是由荷兰学者 Dijkstra 在 70 年代提出的，它把面向机器代码的程序抽象为三种基本程序结构：\n\n（1）顺序结构、选择结构和重复结构；\n\
    \n（2）提出了一系列的设计原则，如自顶向下、逐步求精、模块化（树状结构）编程等。\n\n**特点：**\n\n自顶向下、逐步求精，模块化（分成子任务）编程。\n\
