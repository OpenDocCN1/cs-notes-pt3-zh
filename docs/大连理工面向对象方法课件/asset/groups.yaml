  - '[PAGE 223]


    # 简单工厂模式的优缺点


    在简单工厂模式中，一个工厂类处于对产品类实例化的中心位置上，它知道每一个产品，它决定哪一个产品类当被实例化。这个模式的优点是允许客户端相对独立于产品创建的过程，并且在系统引入新产品的时候无需修改客户端，也就是说，它在某种程度上支持“开-闭”原则。


    这个模式的缺点是对“开-闭”原则的支持不够，因为如果有新的产品加入到系统中去，就需要修改工厂类，将必要的逻辑加入到工厂类中。


    # 工厂方法模式的引进


    而本章要讨论的工厂方法模式是简单工厂模式的进一步抽象和推广。由于使用了多态性，工厂方法模式保持了简单工厂模式的优点，而且克服了它的缺点。


    首先，在工厂方法模式中，核心的工厂类不再负责所有的产品的创建，而是将具体创建的工作交给子类去做。这个核心类则摇身一变，成为了一个抽象工厂角色，仅负责给出具体工厂子类必须实现的接口，而不接触哪一个产品类应当被实例化这种细节。


    这种进一步抽象化的结果，使这种工厂方法模式可以用来允许系统在不修改具体工厂角色的情况下引进新的产品，这一特点无疑使得工厂模式具有超过简单工厂模式的优越性。下图所示是工厂方法模式的简略类图，这个类图中仅显示了一个工厂类和一个产品类，而在实际系统里面，会遇到多个产品类以及相应的工厂类。


    ![](img/3b4669cf00b2833fe526284506f3f342_223_0.png)


    # 平行的等级结构


    在一个系统设计中，常常是首先有产品角色，然后有工厂角色。还可以应用工厂方法的情形下，一般都会有一个产品的等级结构，由一个（甚至多个）抽象产品和多个具体产品组成。产品的等级结构如下图所示，构图中有阴影的是树模型节点。'
