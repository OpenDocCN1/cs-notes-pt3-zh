    \n数组A[]存放指向基类instrument的指针，所以在数组初始化过程中发生向上映射。这个数组和函数f()将在稍后的讨论中用到。\n\n在对tune()的调用中，向上映射在对象的每一个不同的类型上完成。期望的结果总是能得到。这可以被描述为“发送消息给一对象和让这个对象考虑用它来做什么”。virtual函数是在试图分析项目时使用的透镜：基类应当出现在哪里？应当如何扩展这个程序？然而，在程序最初创建时，即便我们没有发现合适的基类接口和虚函数，在稍后甚至更晚，当我们决定扩展或维护这个程序时，我们也常常会发现它们。这不是分析或设计错误，它只意味着一开始我们还没有所有的信息。由于C++严格的模块化，这并不是大问题。因为我们对系统的一部分作了修改时，往往不会C那种波及系统的其他部分。\n\
    \n```cpp\npublic:\n    virtual void play(note) const {\n        cout << \"Instrument::play\"\
    \ << endl;\n    }\n};\n// Wind objects are Instruments\n// because they have the\
