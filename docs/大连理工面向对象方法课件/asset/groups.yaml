    客户在集中订货的时候，因为订货量巨大，而且时间集中，所以造成该企业的业务人员忙的团团转，而且经常会发生排队订货的现象，同时由于是期货订货，所以该企业还得向上游供应商订货，这样一来一去，给工作带来极大的不便，也容易造成混乱和漏洞。


    因此，介于用户这样的情况，需要开发一套网上期货订货系统，将订货的整个环节都打通，真正实现24小时订货。减少人工干预，通过和几个系统之间的集成，做到实时的信息流通。但是这样一个系统对于该企业来说，毕竟是第一回，国内也没有相关成熟的案例和模型，所以实施存在极大的风险性。而且其他同行业的竞争对手也是有着手打造这样的一个系统，所以尽早建立网上订货系统，对于提高顾客的忠诚度和满意度都是大有裨益的，所以对工期的要求也非常严格。


    根据以上情况，决定采用敏捷开发技术来实施这个项目。


    ## 3.2 项目组织机构


    建立联合实施团队，由电子商务公司的项目实施人员和客户方的关键用户一起构成，统一受客户方的商务副总指挥。


    工作方式：在客户现场办公，在调研的同时做需求，根据系统架构和功能划分，边做设计边做开发。


    沟通方式：每天开班前半个小时，所有项目组成员必须座在一起沟通交流，对每天的工作进行总结和经验交流。每周召开一次推进和培训会议，在不断的开发过程中进行对用户的业务知识、系统知识和操作的培训，为将来系统的运行维护打下更好的基础。


    ## 3.3 项目实施过程


    第一轮循环实施周期两个月，不但搭建了整个应用的整体框架，还实现了两大品种的单向期货订货流程。


    第二轮循环实施周期两个月，打通了向供应商的期货订货环节，并且实现了另外两个品种的订货。同时逐步将前期做好的系统向用户推广使用，在不断完善的过程中，对本阶段的项目开发实施做修正。


    第三轮循环实施周期三个月。由开发人员和客户方的关键用户对期货订货系统进行完善和优化。


    ## 3.4 项目实施效果


    - 客户方由于实施了该项目，给订货用户和公司业务员带来很大的便利，效率大大提高，再也没有排队订货的状况，再也没有业务员通宵达旦的处理订货需求，再也不会和供应商之间发生信息失真的现象。系统的快速实施和推进，使得客户对该系统也越来越依赖，同时该公司的销售业绩也率攀新高。


    - 由于采用了敏捷开发技术，极大的降低了开发成本，大大提高了开发的效率。尽管在整个项目实施过程中存在大量的变更和修正，但是这样的开发方式可以很有效的避免带来更多负面的扯皮现象。


    - 因为项目成员由高水平的开发人员参加，所以对客户的业务理解非常深入，在实际的项目开发当中，不但承担了具体开发的工作，还向客户方提出很多好的建议并进行描述，以便业务更加优化，操作更加顺畅。一方面，客户方从中收益，另外一方面，开发人员的能力也得到了极大的提高。


