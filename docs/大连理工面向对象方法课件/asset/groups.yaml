    \n设计模式常常划分成不同的种类，常见的种类有：\n\n- 创建型设计模式：如工厂方法（Factory Method）模式、抽象工厂（Abstract Factory）模式、原型（Prototype）模式、单例（Singleton）模式、建造（Builder）模式等\n\
