  md: "\n## 简单工厂模式的优缺点\n\n在简单工厂模式中，一个工厂类处于对产品类实例化的中心位置上，它知道每一个产品，它决定哪一个产品类当被实例化。这个模式的优点是允许客户端相对独立于产品创建的过程，并且在系统引入新产品的时候无需修改客户端，也就是说，它在某种程度上支持“开-闭”原则。\n\
    \n这个模式的缺点是对“开-闭”原则的支持不够，因为如果有新的产品加入到系统中去，就需要修改工厂类，将必要的逻辑加入到工厂类中。\n\n## 工厂方法模式的引进\n\
    \n而本章要讨论的工厂方法模式是简单工厂模式的进一步抽象和推广。由于使用了多态性，工厂方法模式保持了简单工厂模式的优点，而且克服了它的缺点。\n\n首先，在工厂方法模式中，核心的工厂类不再负责所有的产品的创建，而是将具体创建的工作交给子类去做。这个核心类则摇身一变，成为了一个抽象工厂角色，仅负责给出具体工厂子类必须实现的接口，而不接触哪一个产品类应当被实例化这种细节。\n\
    \n这种进一步抽象化的结果，使这种工厂方法模式可以用来允许系统在不修改具体工厂角色的情况下引进新的产品，这一特点无疑使得工厂模式具有超过简单工厂模式的优越性。下图所示是工厂方法模式的简略类图，这个类图中仅显示了一个工厂类和一个产品类，而在实际系统里面，会遇到多个产品类以及相应的工厂类。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_223_0.png)\n\n## 平行的等级结构\n\n在一个系统设计中，常常是首先有产品角色，然后有工厂角色。还可以应用工厂方法的情形下，一般都会有一个产品的等级结构，由一个（甚至多个）抽象产品和多个具体产品组成。产品的等级结构如下图所示，构图中有阴影的是树模型节点。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_225_0.png)\n\n从上图可以看出，这个使用了工厂方法模式的系统涉及到以下的角色：\n\
    \n- 抽象工厂（Creator）角色：担任这个角色的是工厂方法模式的核心，它是应用程序开发的。任何模式中创建对象的工厂类必须实现这个接口。在上面的系统中这个角色由Java接口Creator扮演；在实际的系统中，这个角色也常常使用抽象Java类实现。\n\
    - 具体工厂（Concrete Creator）角色：担任这个角色的是实现了抽象工厂接口的具体Java类。具体工厂角色含有与应用密切相关的逻辑，并且受到应用程序的调用以创建产品对象。在本系统中给出了两个这样的角色，也就是具体Java类ConcreteCreator1和ConcreteCreator2。\n\
    - 抽象产品（Product）角色：工厂方法模式所创建的对象的超类型，也就是产品对象的共同父类或共同拥有的接口。在本系统中，这个角色由Java接口Product扮演；在实际的系统中，这个角色也常常使用抽象Java类实现。\n\
    - 具体产品（Concrete Product）角色：这个角色实现了抽象产品角色所声明的接口。工厂方法模式所创建的每一个对象都是某个具体产品角色的实例。在本系统中，这个角色由具体Java类ConcreteProduct1和ConcreteProduct2扮演，它们都实现了Java接口Product。\n\
    - 客户端（Client）角色：这个角色创建了工厂对象，然后调用工厂对象的工厂方法创建相应的产品对象。\n\n## 源代码\n\n下面就是这个示意性系统的源代码。\n\
    \n首先是抽象工厂角色的源代码，这个角色是用一个Java接口实现的，它声明了一个工厂方法，要求所有的具体工厂角色都实现这个工厂方法。\n\n代码清单1：抽象工厂角色Creator类的源代码\n\
    \n```java\npackage com.javapatterns.factorymethod;\npublic interface Creator\n\
    {\n/**\n * 工厂方法\n */\npublic Product factory();\n}\n```\n\n下面是抽象产品角色的源代码。由于这里考虑的是最为简单的情形，所以抽象产品角色仅仅为具体产品角色提供一个共同的类型而已，所以是用一个Java标识接口实现的。一个没有声明任何方法的接口可称为标识接口，关于标识接口的讨论请见本书的“专题：Java接口”一章。\n\
    \n代码清单2：抽象产品角色Product类的源代码\n\n```java\npackage com.javapatterns.factorymethod;\n\
    public interface Product\n{\n}\n```\n\n下面是具体工厂角色ConcreteCreator1的源代码。这个角色实现了抽象工厂角色Creator所声明的工厂方法。\n\
    \n代码清单3：具体工厂角色ConcreteCreator1类的源代码\n\n```java\npackage com.javapatterns.factorymethod;\n\
    public class ConcreteCreator1 implements Creator\n{\n/**\n * 工厂方法\n */\npublic\
    \ Product factory()\n{\nreturn new ConcreteProduct1();\n}\n}\n```\n\n下面是具体工厂角色ConcreteCreator2的源代码。与ConcreteCreator1一样，这个角色实现了抽象工厂角色Creator所声明的工厂方法。\n\
    \n代码清单4：具体工厂角色ConcreteCreator2类的源代码\n\n```java\npackage com.javapatterns.factorymethod;\n\
    public class ConcreteCreator2 implements Creator\n{\n/**\n * 工厂方法\n */\npublic\
    \ Product factory()\n{\nreturn new ConcreteProduct2();\n}\n}\n```\n\n下面是具体产品角色ConcreteProduct1的源代码。它是此系统向客户提供的产品，在通常情况下，这个类会有复杂的商业逻辑。\n\
    \n代码清单5：具体产品角色ConcreteProduct1类的源代码\n\n```java\npackage com.javapatterns.factorymethod;\n\
    public class ConcreteProduct1 implements Product\n{\npublic ConcreteProduct1()\n\
    {\n//do something\n}\n}\n```\n\n类似地，下面是具体产品角色ConcreteProduct2的源代码。\n\n代码清单6：具体产品角色ConcreteProduct2类的源代码\n\
    \n```java\npackage com.javapatterns.factorymethod;\npublic class ConcreteProduct2\
    \ implements Product\n{\npublic ConcreteProduct2()\n{\n//do something\n}\n}\n\
    ```\n\n这个示意性的系统只给出了两个具体工厂类和两个具体产品类。在真实的系统中，工厂方法模式一般都会涉及到更多的具体工厂类和更多的具体产品类。\n\n\
    下面就是客户端角色的源代码。\n\n代码清单7：客户端角色Client类的源代码\n\n```java\npackage com.javapatterns.factorymethod;\n\
    public class Client\n{\n    private static Creator creator1, creator2;\n    private\
    \ static Product prod1, prod2;\n    public static void main(String[] args)\n \
    \   {\n        creator1 = new ConcreteCreator1();\n        prod1 = creator1.factory();\n\
    \        creator2 = new ConcreteCreator2();\n        prod2 = creator2.factory();\n\
    \    }\n}\n```\n\n### 工厂方法模式的活动序列图\n\nClient对象的活动可以分成两部分。\n\n- （1）客户端创建ConcreteCreator1对象。这时客户端所持有变量的静态类型是Creator，而实际类型是ConcreteCreator1。然后，客户端调用ConcreteCreator1对象的工厂方法factory()，接着后者调用ConcreteProduct1的构造子创建出产品对象。如下面的时序图所示。\n\
    - （2）客户端创建一个ConcreteCreator2对象，然后调用ConcreteCreator2对象的工厂方法factory()，而后者调用ConcreteProduct2的构造子创建出产品对象，如下面的时序图所示。\n\
    \n### 工厂方法模式和简单工厂模式\n\n工厂方法模式和简单工厂模式在结构上的不同是很明显的。工厂方法模式的核心是一个抽象工厂类，而简单工厂模式把核心放在一个具体类上。工厂方法模式可以允许许多具体工厂类从抽象工厂类中将创建行为继承下来，从而可以成为多个简单工厂模式的综合，进而推广了简单工厂模式。\n\
    \n工厂方法模式退化后可以变得和简单工厂模式一样。设想如果非常确定一个系统只需要一个具体工厂类，那么就不妨把抽象工厂类合并到具体的工厂类中去。由于这只有一个具体工厂类，所以不妨将工厂方法改成为静态方法，这时候就得到了简单工厂模式。\n\
    \n与简单工厂模式中的情形一样的是，ConcreteCreator的factory()方法返回的数据类型是一个抽象类型Product，而不是哪一个具体产品类型，而客户端也不知晓所得的产品的真实类型。这种多态性设计将工厂类选择创建哪一个产品对象、如何创建这个对象的细节完全封装在具体工厂类内部。\n\
    \n工厂方法模式之所以有一个别名叫多态性工厂模式，显然是因为具体工厂类都有共同的接口，或者都有共同的抽象父类。\n\n如果系统需要加入一个新的产品，那么所需要的就是向系统中加入一个这个产品类以及它所对应的工厂类。没有必要修改客户端，也没有必要修改抽象工厂角色或者其他已有的具体工厂角色。对于增加新的产品类而言，这个系统完全支持“开-闭”原则。\n"
