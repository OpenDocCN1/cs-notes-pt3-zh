    \  cout<<c.a()<<endl;\n}\n```\n\n由于在类A和类B中都包括了名为a的公有成员函数，而类C由类A和类B通过多重继承机制派生，这样，如果我们使用了**c.a()**这样的表达式，编译器无法知道我们想调用的究竟是由类A继承过来的函数a呢，还是从类B继承过来的函数a，这样就导致了二义性。在上面的这种情况下，编译器将生成一个错误。\n\
