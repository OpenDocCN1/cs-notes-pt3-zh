    的正确性。User stories 与传统的用户需求的区别在于详细的程度，user stories 并不会确定需求的每个细节，它只是用来简单的描述系统功能，供开发人员进行估计开发进度，在开发过程中开发人员和用户会不断的交流以讨论细节问题。User
    story 应该注于功能，不应该过分注重用户界面等细节。一般一个 user story 在 1-3 周的时间完成，如果估计超过 3 周，说明 user story
    太大了，需要细分。


    # 2)release plan.


    召开一个 release plan 会议，产生 release plan。Release plan 将用于指定每个 iteration 的计划。开发人员对每个
    user story 估计开发时间（在不被打断，无其他工作情况下的开发时间，包括测试），用户对 user stories 给出优先级，release plan
    会议并不制订每个 iteration 的计划。Release plan 要用户，开发人员和管理者都同意，在完成功能范围（scope）、使用资源（resource），时间（time）和质量(quality)上达成一致（一般质量是不能改变的）


    # 3) small release


    often and small release 是 XP 的一个原则，每个 release 完成一些用户有意义的功能集合，尽快的提交给用户以获得反馈，及时调整，提交的越晚，调整越困难。


    # 4）project velocity


    团队在开发过程中要收集数据，以便于对自己的开发速度进行评估，用于以后的 release plan


    # 5)iteration


    每个 small release 的周期称为 iteration，每个 iteration 约为 1-3 周，在一个项目中保持每个 iteration 的时间相等，不要超前制定计划，每个
    iteration 的计划在 iteration 的开始时制定。这样能够更灵活的应付变化。不要急于完成本次 iteration 没有包括的功能。要注重每个
    iteration 的时间限制，当团队觉得不能按时完成 iteration 时，召开一次 iteration plan 会议，重新评估，减少一些 user
    stories。


    下面是 iteration 的图示：


    # 6）iteration plan


    在每个 iteration 开始的时候召开会议，从 release plan 中选择还没有实现的用户最迫切需要的 user stories。上一个 iteration
    中没有通过验收测试的功能也要在这个 iteration 中实现。可以根据上一个 iteration 的实践调整团队速度。User stories 和失败的测试被分解成
    programming task，task 使用技术语言编写，作为 iteration plan 的详细描述。程序员主动领取 task 并估计完成时间，每个
    task 应该在 1-3 天内完成，超过 3 天的 task 应该被细分。如果整个团队需要的时间多于或少于规定的 iteration 时间，调整 user
    stories。'
