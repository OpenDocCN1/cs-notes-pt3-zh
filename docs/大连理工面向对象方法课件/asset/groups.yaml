    Component提供了一个返回空指针的缺省操作。Composite类重新定义这个操作并通过this指针返回它自身。

    class Composite;


    class Component {

    public:

    //...

    virtual Composite* GetComposite() { return 0; }

    };


    class Composite : public Component {

    public:

