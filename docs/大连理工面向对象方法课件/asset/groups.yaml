    };\nclass C : virtual public A\n{\npublic:\n    void SetA(int i)\n    {\n    \
    \    a=i;\n    }\n    int GetA()\n    {\n        return a;\n    }\n};\nclass D\
    \ : public B, public C\n{\n};\nvoid main()\n{\n    D d;\n    d.B::SetA(3);\n \
    \   d.C::SetA(1);\n    cout<<d.B::GetA()<<endl;\n    cout<<d.C::GetA()<<endl;\n\
    }\n```\n\n上面的程序的运行结果如下：\n\n```\n1\n1\n```\n\n同学们可以看到，无论是通过B还是类C的子对象来修改成员a的值，它们实际上都是对同一个子对象进行操作。**这时，如果使用d.a的表达式是不会导致二义性的，因为在类D的实例对象中只存在一个类型A的子对象（virtual指明了间接基类与派生类的单拷贝关系）**。\n\
