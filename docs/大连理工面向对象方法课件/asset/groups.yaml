    \ eps,int wsize)\n{\n    //定义派生类的构造函数时后缀上基类的构造函数\n    //......\n}\n```\n\n在定义对象时构造函数的执行顺序是先基类，所有人（对象成员），后自己（派生类本身）。\n\
