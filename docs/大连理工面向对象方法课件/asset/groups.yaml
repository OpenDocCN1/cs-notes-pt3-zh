    - ConcreteCommand对象调用它所绑定的Receiver的一些操作以执行该请求。\n\n# 8. 效果\n\nCommand模式有以下效果：\n\
    \n- **Command模式将调用操作的对象与知道如何实现该操作的对象解耦。**\n- **可将多个命令装配成一个复合命令。**例如是前面描述的MacroCommand类。一般说来，复合命令是Composite模式的一个实例。\n\
    - **增加新的Command很容易，**因为这无需改变已有的类。\n\n# 9. 实现\n\n实现Command模式时须考虑以下问题：\n1）一个命令对象应达到何种智能程度命令对象的能力可大可小。一个极端是它仅确定一个接收者和执行该请求的动作。另一极端是它自己实现所有功能，根本不需要额外的接收者对象。当需要定义与已有的类无关的命令，当没有合适的接收者，或当一个命令隐式地知道它的接收者时，可以使用后一极端方式。例如，创建另一个应用窗口的命令对象本身可和任何其他的对象一样有能力创建该窗口。在这两个极端间的情况是命令对象有足够的信息可以动态的找到它们的接收者。\n\
    2）支持取消（undo）和重做（redo） 如果Command提供方法逆转（reverse）它们操作的执行（例如Unexecute或Undo 操作），就可支持取消和重做功能。为达到这个目的，ConcreteCommand类可能需要存储额外的状态信息。这个状态包括：\n\
    - 接收者对象，它真正执行处理该请求的各操作。\n- 接收者上执行操作的参数。\n- 如果处理请求的操作会改变接收者对象中的某些值，那么这些值也必须先存储起来。接收者还必须提供一些操作，以使该命令可将接收者恢复到它先前的状态。\n\
    若应用只支持一次取消操作，那么只需存储最近一次被执行的命令。而若要支持多级的取消和重做，就需要有一个已被执行命令的历史表列（history list），该表列的最大长度决定了取消和重做的级数。历史表列存储了已被执行的命令序列。向后遍历该表列并逆向执行（reverse-executing）命令是取消它们的结果；向前遍历并执行命令是重执行它们。\n\
    有时可能不得不将一个可撤消的命令在它可以被放入历史表列中之前先拷贝下来。这是因为执行原来的请求的命令对象将在稍后执行其他的请求。如果命令的状态在各次调用之间会发生变化，那就必须进行拷贝以区分相同命令的不同调用。\n\
    例如，一个删除选定对象的删除命令（DeleteCommand）在它每次被执行时，必须存储不同的对象集合。因此该删除命令对象在执行后必须被拷贝，并且将该拷贝放入历史表列中。如果该命令的状态在执行时从不改变，则不需要拷贝，而仅需将一个对该命令的引用放入历史表列中。在放入历史表列中之前必须被拷贝的那些Command起着原型（参见Prototype模式（3.4））的作用。\n\
    3）避免取消操作过程中的错误积累在实现一个可靠的、能保持原先语义的取消/重做机制时，可能会遇到滞后影响问题。由于命令重复的执行、取消执行，和重执行的过程可能会积累错误，以至一个应用的状态最终偏离初始值。这就有必要在Command中存入更多的信息以保证这些对象可被精确地复原成它们的初始状态。这里可使用Memento模式（5、6）来让该Command访问这些信息而不暴露其他对象的内部信息。\n\
    4）使用C++模板对（1）不能被取消（2）不需要参数的命令，我们可使用C++模板来实现，这样可以避免为每一种动作和接收者都创建一个Command子类。我们将在代码示例一节说明这种做法。\n\
    \n# 10. 代码示例\n\n"
