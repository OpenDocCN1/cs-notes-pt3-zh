    \ Singleton Pattern 扩展为控制系统只能创建某个类的有限个实例的情形。系统中大部分管理服务对象都是单实例的。例如，系统存在多个用户实例，但只有在一个用户管理者对象。\n\
    \n## OBSERVER（观察者）—对象行为型模式\n\n### 1. 意图\n\n定义对象间的一种**一对多**的依赖关系，当一个对象的状态发生改变时，\
    \  \n所有依赖于它的对象都得到通知（notify）并被自动更新（update）。\n\n### 2. 别名\n\n依赖（Dependents），发布-订阅（Publish-Subscribe）\n\
    \n### 3. 动机\n\n将一个系统分割成一系列相互协作的类有一个常见的副作用：需要维护相关  \n对象间的一致性。我们不希望为了维持一致性而使各类紧密耦合，因为这样降低\
    \  \n了它们的可重用性。\n\n定义应用数据的类和负责界面表示的类可以各自独立地复用。当然它们也  \n可一起工作。例如：一个表格对象和一个柱状图对象可使用不同的表示形式描述\
    \  \n同一个应用数据对象的信息。  \n具体为：  \n（1）表格对象和柱状图对象互相并不知道对方的存在，这样可以根据需要  \n单独复用表格或柱状图。\
    \  \n（2）当用户改变表格中的信息时，柱状图能立即反映这一变化，反过来  \n也是如此。\n\n![](img/3b4669cf00b2833fe526284506f3f342_238_0.png)\n\
    \n上图：这一行为意味着表格对象和棒状图对象都依赖于数据对象，因此数据  \n对象的任何状态改变都应立即通知它们。同时也没有理由将依赖于该数据对象的  \n\
    对象的数目限定为两个，对相同的数据可以有任意数目的不同用户界面。  \n**如何理解：**  \n（1）Observer模式描述了如何建立这种关系。这一模式中的关键对象是\n\
    \n目标(subject)和观察者(Observer)。  \n一个目标（主题）可以有任意数目的依赖它的观察者。一旦目标的状态发生改变，所有的观察者都得到通知。作为对这个通知的响应，每个观察者都将查询目标以使其状态与目标的状态同步。\n\
    \n（2）另一种理解：这种交互也称为发布-订阅（publish-subscribe）。目标是通知的发布者。它发出通知时并不需知道谁是它的观察者。可以有任意数目的观察者订阅并接收通知。\n\
    \n### 4. 适用性\n\n在以下任一情况下可以使用观察者模式：\n- 当一个抽象模型有两个方面，其中一个方面依赖于另一方。将这二者封装在独立的对象中以使它们可以各自独立地改变和复用。\n\
    - 当对一个对象的改变需要同时改变其它对象，而不知道具体有多少对象有待改变。\n- 当一个对象必须通知其它对象，而它又不能假定其它对象是谁。换言之，不希望这些对象是紧密耦合的。\n\
