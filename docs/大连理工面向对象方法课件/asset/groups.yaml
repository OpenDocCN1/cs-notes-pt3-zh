    # ## 再看例子： 女娲举绳造人<sup>(0179)</sup>


    以女娲举绳造人的故事为例，《风俗通》中说：“俗说天地开辟，未有人民。女娲转黄土为人，力不暇供，乃引绳于泥沮中，举以为人”。

    参考“简单工厂模式”，女娲造人初始使用的是简单工厂模式。然后，女娲发现她不能用这种方式造出所有的人，于是她就想出了一个聪明的办法：使用一根绳子，在泥水里搅然后一甩，所有的泥点都变成了人。当然，女娲造出的人有男女之别，是因为女娲使用的绳子有阴阳之分。在下面，读者可以看出，女娲采用了工厂方法模式来达到造人的目的。

    女娲举绳造人的故事是应用工厂方法模式的一个实例：抽象角色“女娲神绳”是系统的中心，但是它仅仅声明出“举绳造人”方法，而没有实现它。真正做这个工作的是具体工厂类，也就是“阴绳”和“阳绳”类。工厂方法模式在女娲造人系统中的实现如下图所示。


