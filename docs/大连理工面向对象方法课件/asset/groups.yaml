    \n### 注意：例中构造函数和析构函数的执行顺序\n\n- 多继承的构造函数的调用顺序与单继承的相同，也是遵从先祖先（基类），后自己（派生类）的原则。在多个基类之间则严格按照派生定义时从左到右的顺序来排列先后。而析构函数的调用顺序则与构造函数的正好相反。\n\
    \n## 3. 虚基类\n\n现在我们来看一种特殊情况，请观察下面的代码：\n\n```cpp\n#include <iostream.h>\n#include\
    \ <iomanip.h>\nclass A\n{\nprotected:\n    int a;\n};\nclass B : public A\n{\n\
    public:\n    void SetA(int i)\n    {\n        a=i;\n    }\n    int GetA()\n  \
    \  {\n        return a;\n    }\n};\nclass C : public A\n{\npublic:\n    void SetA(int\
    \ i)\n    {\n        a=i;\n    }\n    int GetA()\n    {\n        return a;\n \
    \   }\n};\nclass D : public B, public C\n{\n};\nvoid main()\n{\n    D d;\n   \
    \ d.B::SetA(3);\n    d.C::SetA(1);\n    cout<<d.B::GetA()<<endl;\n    cout<<d.C::GetA()<<endl;\n\
    }\n```\n\n上例中类的继承结构：\n\n```cpp\nclass A { ... };\nclass B : public A { ... };\n\
    class C : public A { ... };\nclass D : public B, public C { ... };\n```\n\n画出类图就是这样：\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_186_0.png)\n\n**注意：** 上面的类D可以导致成员名的二义性，这是因为在类B和类C中包含了同名成员函数GetA和SetA。关于二义性的详细讨论将在本节的后面部分进行。\n\
    \n在上面的例子中，类B和类C都从类A派生，而类D从类B和类C通过多重继承机制派生。这样，类D的内存对象中就包括了两个不同的A类子对象。上面的程序的运行结果如下：\n\
    \n```\n3\n1\n```\n\n上面的结果表明，我们分别通过类B和类C的成员函数修改从其类继承的成员的内容时，它们是分别对两个不同的子对象进行的。很自然地想到，如果我们在main函数中使用如`d.a`之类的表达式将会导致二义性，因为编译器不知道应该访问的是来自类B的成员呢，还是来自类C的成员。\n\
