    # 敏捷开发


    http://www.itisedu.com/phrase/200603291800375.html


    因业务需要，“中科永联”正式更名为“中程在线”，欢迎大家浏览新网站“[中程在线信息产业培训网](#)”


    ![](img/3b4669cf00b2833fe526284506f3f342_243_0.png)


    [敏捷开发（agile development）](#) 是一种以人为核心、迭代、循序渐进的开发方法。在敏捷开发中，[软件](#)项目的构建被切分成多个子项目，各个子项目的成果都经过测试，具备集成和可运行的特征。简言之，就是把一个大项目分为多个相互联系，但也可独立运行的小项目，并分别完成，在此过程中软件一直处于可使用状态。


    敏捷开发是全新理论吗？答案莫衷一是。细心的人们可以发现，敏捷开发其实借鉴了大量[软件工程](#)中的方法。迭代与增量开发，这两种在任何一本软件工程教材中都会被提到的方法，在敏捷开发中扮演了很重要的角色。再向前追溯我们还也可见到瀑布式与快速原型法的影子，也许还有更多。


    改善，而非创新。敏捷开发可理解为在原有[软件开发](#)方法基础上的整合——取其精华，去其糟粕。因此敏捷开发继承了不少原有方法的优势。“在敏捷软件开发的过程中，我们每两周都会得到一个可以工作的软件。”
    Fowler 介绍，“这种非常短的循环，使终端客户可以及时、快速地看到他们花钱构建的软件是一个什么样的结果。”


    也许是因为时间关系，Fowler 只说出了这些优势中的一部分。允许开发过程中的[需求](#)变化，通过早期迭代可以较早发现风险、使代码重用变得可行、减少项目返工……借鉴了众多先进方法和丰富经验，拥有的众多优势使得敏捷开发者来已经成为解决[软件危机](#)的标准答案。


    # 问题与思考


    然而，我们不得不面对的现实却是，模式与方法的优化并不意味着问题的终结。作为一种开发模式，敏捷开发同样需要面对众多挑战。


    大项目的拆分意味着更多子项目的出现，协调这些同步或异步推进的子项目，合理的资源调配都将变得更加复杂。另外，在当前项目和项目组普遍“增容”的情况下，遇到的问题同样成倍增长。人的重要性被提到了更高的高度，而缺乏有效协调手段，减少人员流动和项目变更对整个项目造成的影响也将成为一大挑战……新方法带来众多便利的同时，也相应引发了几乎同样多的问题。'
