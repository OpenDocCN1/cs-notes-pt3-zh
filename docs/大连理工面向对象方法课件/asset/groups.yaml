    \ test）\n- 4. 用户直接参与\n- 5. 每个 release 有两个 user viewings(用户审核?)\n- 6. 在上一个步骤足够稳定（stable\
    \ enough to review）时立即开始下一个步骤，尽量并行开发\n- 7. 在每个周期的开始和中间进行产品和过程调整\n\n**过程产品（指整个过程产生的所有产品，包括软件和文档）**\n\
    \n- 1. 软件释放顺序（release sequence）\n- 2. 用户审核的计划\n- 3. 用户案例（use case）或需求描述\n- 4.\
    \ 设计框架和必要的说明\n- 5. 界面草图\n- 6. 基本的对象模型\n- 7. 执行代码\n- 8. migration code\n- 9. 测试用例\n\
    - 10. 用户手册\n- 11. local matters 由项目组决定：\n  - 上述 product 的模块\n  - 编码和用户界面的标准\n\
    \  - 回归测试的标准和细节\n  - 其他文档\n\n**需要的工具：**\n\n- 版本控制工具\n- 白板（最好可打印）\n\n### Crystal\
    \ Orange\n\n角色：\n- sponsor 发起人\n- business expert/usage expert 业务专家\n- technical\
    \ facilitator 技术专家\n- business analyst/designer 业务分析和设计人员\n- project manager 项目管理员\n\
    - architect 系统架构人员\n- Design Mentor 设计指导人员\n- Lead Designer-Programmer 主要设计编码人员\n\
    - Other Designer-Programmer 设计编码人员\n- UI Designer 用户界面设计人员\n- Writer 文档写作人员\n\
    - Tester 测试人员\n\n**策略：**\n\n同 Crystal Clear（周期可以为 3-4 个月）\n\n**过程产品：**\n\n- 需求文档\n\
    - 计划\n- 状态报告\n- 用户界面设计文档\n- 基本对象模型\n- 外部接口标准\n- 用户手册\n- 源代码\n- 测试用例\n- migration\
    \ code\n- local matters 同 Crystal Clear\n\n## （四）The Agile Alliance\n\n敏捷联盟是 17\
    \ 位不同敏捷开发方法的提倡者共同成立的，目的是推进敏捷开发方法的研究和应用，他们并不要求强制使用某种开发方法，而是提出了敏捷开发的几个核心价值和基本原则：\n\
    \n**core value：**\n\n- Individuals and interactions over processes and tools \
    \ \n  个人和交流重于过程和工具\n- Working software over comprehensive documentation  \n  正在运行的软件本身重于复杂的文档\n\
    - Customer collaboration over contract negotiation  \n  与客户的沟通和交流重于使用合同约束客户\n\
    - Responding to change over following a plan  \n  对变化的快速响应重于跟随计划\n\n**principles**\n\
    \n- 1. 最高目标是通过快速的和经常的发布软件满足客户的需要\n- 2. 提交软件的周期为几个星期到几个月\n- 3. 产生正确的软件是衡量进度的首要标准\n\
    - 4. 主动接受需求的改变而不是拒绝\n- 5. 商务人员和开发人员工作在一起\n- 6. 个人必须有动力，要创造环境支持他们的要求，信任他们\n- 7.\
    \ 最有效的交流方法是面对面的交流\n- 8. 最好的结构，需求和设计来自于自组织的团队（self-organizing team），允许任何人提出想法和建议\n\
    - 9. 持续改进设计和编码\n- 10. 鼓励正常工作，减少长时间加班\n- 11. 保持简单，减少不必要的部分，认识到简单的设计比复杂的设计更难（simple\
    \ design is harder to produce）\n- 12. 定期调整过程，获得更高效率\n\n## （五）Extreme Programming\n\
    \nExtreme Programming（XP，极限编程）是一种轻量级的软件开发方法，它使用快速的反馈，大量而迅速的交流，经过保证的测试来最大限度的满足用户的需求。XP\
    \ 强调用户满意，开发人员可以对需求的变化作出快速的反应。XP 强调 team work。项目管理者，用户，开发人员都处于同一个项目中，他们之间的关系不是对立的，而是互相协作的，具有共同的目标：提交正确的软件。\n\
    \nXP 强调 4 个因素：\n\n- 交流（communication），XP 要求程序员之间以及和用户之间有大量而迅速的交流\n- 简单（simplicity），XP\
    \ 要求设计和实现简单和干净\n- 反馈（feedback）通过测试得到反馈，尽快提交软件并根据反馈修改\n- 勇气（courage）。勇敢的面对需求和技术上的变化\n\
    \nXP 特别适用于需求经常改变的领域，客户可能对系统的功能并没有清晰的认识，可能系统的需求经常需要改动。\n\nXP 也适用于风险比较高的项目，当开发人员面对一个新的领域或技术时，XP\
    \ 可以帮助减低风险。\n\nXP 适用于小的项目（人员上），人员在 2-12 人之间，XP 不适用于人员太多的项目，事实上，在需求经常变化或风险比较高的项目中，少量而有效的\
    \ XP 开发人员效率要远远高于大量的开发人员。\n\n下面是 XP 的开发流程\n\nXP 的原则和实践：\n\n### 1. Planning\n\n\
    - **user stories**：User stories 类似 use case，描述用户所见的系统功能，但避免使用大量的文档，user stories\
    \ 由用户编写（不仅限于描述用户界面）。User stories 使用用户的语言编写，不使用技术性的语言，每个 user stories 限于几句话。User\
    \ stories 用于在 release plan 会议上对开发时间进行评估，也用于产生验收测试（acceptance test），必须使用可以自动进行的验收测试保证软件的正确性。User\
    \ stories 与传统的用户需求的区别在于详细的程度，user stories 并不会确定需求的每个细节，它只是用来简单的描述系统功能，供开发人员进行估计开发进度，在开发过程中开发人员和用户会不断的交流以讨论细节问题。User\
    \ story 应该注重于功能，不应该过分注重用户界面等细节。一般一个 user story 在 1-3 周的时间完成，如果估计超过 3 周，说明 user\
    \ story 太大了，需要细分。\n\n### 2. Release Plan\n\n召开一个 release plan 会议，产生 release plan。Release\
    \ plan 将用于指定每个 iteration 的计划。开发人员对每个 user story 估计开发时间（在不被打断，无其他工作情况下的开发时间，包括测试），用户对\
    \ user stories 给出优先级，release plan 会议并不制订每个 iteration 的计划。Release plan 要用户，开发人员和管理者都同意，在完成功能范围（scope）、使用资源（resource），时间（time）和质量(quality)上达成一致（一般质量是不能改变的）\n\
    \n### 3. Small Release\n\noften and small release 是 XP 的一个原则，每个 release 完成一些用户有意义的功能集合，尽快的提交给用户以获得反馈，及时调整，提交的越晚，调整越困难。\n\
    \n### 4. Project Velocity\n\n团队在开发过程中要收集数据，以便于对自己的开发速度进行评估，用于以后的 release plan\n\
    \n### 5. Iteration\n\n每个 small release 的周期称为 iteration，每个 iteration 约为 1-3 周，在一个项目中保持每个\
    \ iteration 的时间相等，不要超前制定计划，每个 iteration 的计划在 iteration 的开始时制定。这样能够更灵活的应付变化。不要急于完成本次\
    \ iteration 没有包括的功能。要注重每个 iteration 的时间限制，当团队觉得不能按时完成 iteration 时，召开一次 iteration\
    \ plan 会议，重新评估，减少一些 user stories。\n\n### 6. Iteration Plan\n\n在每个 iteration 开始的时候召开会议，从\
    \ release plan 中选择还没有实现的用户最迫切需要的 user stories。上一个 iteration 中没有通过验收测试的功能也要在这个\
    \ iteration 中实现。可以根据上一个 iteration 的实践调整团队速度。User stories 和失败的测试被分解成 programming\
    \ task，task 使用技术语言编写，作为 iteration plan 的详细描述。程序员主动领取 task 并估计完成时间，每个 task 应该在\
    \ 1-3 天内完成，超过 3 天的 task 应该被细分。如果整个团队需要的时间多于或少于规定的 iteration 时间，调整 user stories。\n"
