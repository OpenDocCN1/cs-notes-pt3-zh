    \n当一个系统面临功能扩展的时候，其中会有一些模块，它们需要修改的压力比其他一些模块要大。最后的结果可能是这些模块需要修改或者不需要修改。但是不论哪一种情况，如果这些模块是相对独立的，那么他们就不会将修改的压力传递给其他的模块。\n\
    \n这就是说，一个软件应该设计出一个系统在功能需要扩展时，会相对更容易地做到对修改的关闭。也就是说，迪米特法则是一条通向“开-闭”原则的道路。\n\nFacade模式支持了该法则。\n\
    \n### 2. 接口隔离原则（Interface Segregation Principle ISP）\n\n接口隔离原则讲的是，应该为客户提供尽可能小的单独的接口，而不要提供大的总接口。\n\
    \n或者说：接口隔离原则——使用多个专门的接口比使用单一的总接口要好。也就是说，一个类对另外一个类的依赖性应当是建立在最小的接口上。\n\n显然，接口隔离原则与广义的迪米特法则都是对一个软件实体与其他的软件实体的通信的限制。广义的迪米特法则要求尽可能限制通信的宽度和深度。接口隔离原则所限制的是通信的宽度，也就是通过接口来限制依赖的跨越。\n\
    \nFacade模式与该法则的关系要注意。\n\n## 举例：\n\n一个保安系统由两个录像机、三个电灯、一个遥感器和一个报警器组成，操作人员需要经常开、关这些仪器，下面分别用非门面模式和门面模式进行设计。\n\
    \n1. 不用Facade的方法\n\n```cpp\nclass Client {\n    private:\n        Camera camera1,\
    \ camera2;\n        Light light1, light2, light3;\n        Sensor sensor;\n  \
    \      Alarm alarm;\n    public:\n        void activate() {\n            camera1.turnOn();\n\
    \            camera2.turnOn();\n            light1.turnOn();\n            light2.turnOn();\n\
    \            light3.turnOn();\n            sensor.turnOn();\n            alarm.activate();\n\
    \        }\n        void deactivate() {\n            camera1.turnOff();\n    \
    \        camera2.turnOff();\n            light1.turnOff();\n            light2.turnOff();\n\
    \            light3.turnOff();\n            sensor.turnOff();\n            alarm.deactivate();\n\
    \        }\n};\n```\n\n各个具体类完成的就是简单的字符串输出。\n\n## 课堂练习：\n\n分别画出以上两例的类关系图。\n\n##\
    \ 单件继续——关于 Singleton 子类\n\n因为 instance 是一个指向 Singleton 对象的指针，Instance 成员函数可以将一个指向\
    \ Singleton 的子类的指针赋给这个变量。\n\n关于 C++ 的实现还有一点需要注意。将单例定义为一个全局或静态的对象，然后依赖于自动的初始化，这是不够的。有如下三个原因：\n\
    \n- 我们不能保证静态对象只有一个实例会被声明。\n- 我们可能没有足够的信息在静态初始化时实例化每一个单件。单件可能需要在程序执行中稍后被计算出来的值。\n\
    - C++ 没有定义全局对象的构造器的调用顺序。这就意味着单件之间的依赖关系不能得到保证。如果有，那么错误将是不可避免的。\n- 使用全局/静态对象的实现方法还有另一个（尽管很小）缺点，它使得所有的单件无论它们是否被使用都要被创建。使用静态成员函数避免了所有这些问题。\n\
    \n### 创建 Singleton 类的子类\n\n最简单的技术是在 Singleton 的 Instance 操作中决定你想使用的是哪一个单件。\n\n\
    假定我们定义一个 MazeFactory 类用于建造所描述的迷宫。MazeFactory 定义了一个建造迷宫的不同部件的接口。子类可以重定义这些操作以返回特定产品类的实例，如用\
    \ BombedWall（被轰倒的墙）对象代替普通的 Wall 对象。\n\n此处相关的问题是 Maze 应用仅需一个工厂的一个实例，且这个实例对建造任何部件的代码都是可用的。这样就引入了\
    \ Singleton 模式。将 MazeFactory 作为单件，我们无需借助全局变量就可使迷宫对象具有全局可访问性。\n\n**首先：** 为简单起见，我们先假定不会生成\
    \ MazeFactory 的子类。（我们随后将考虑另一个选择。）我们通过增加静态的 Instance 操作和静态的用以保存唯一实例的成员 _instance，从而在\
    \ C++ 中生成一个 Singleton 类。我们还必须保护构造器以防止意外的实例化，因为意外的实例化可能会导致多个实例。\n\n```cpp\nclass\
    \ MazeFactory {\npublic:\n    static MazeFactory* Instance();\n\n    // existing\
    \ interface goes here\nprotected:\n    MazeFactory();\nprivate:\n    static MazeFactory*\
    \ _instance;\n};\n```\n\n相应的实现是：\n\n```cpp\nMazeFactory* MazeFactory::_instance\
    \ = 0;\n\nMazeFactory* MazeFactory::Instance () {\n    if (_instance == 0) {\n\
    \        _instance = new MazeFactory;\n    }\n    return _instance;\n}\n```\n\n\
    然后：我们考虑当存在 MazeFactory 的多个子类，而且应用必须决定使用哪一个子类时的情况。我们将通过环境变量选择适当的种类并根据该环境变量的值增加代码用于实例化适当的\
    \ MazeFactory 子类。Instance 操作是增加这些代码的好地方，因为它已经实例化了 MazeFactory：\n\n```cpp\nMazeFactory*\
    \ MazeFactory::Instance () {\n    if (_instance == 0) {\n        const char* mazeStyle\
    \ = getenv(\"MAZESTYLE\");\n\n        if (strcmp(mazeStyle, \"bombed\") == 0)\
    \ {\n            _instance = new BombedMazeFactory;\n\n        } else if (strcmp(mazeStyle,\
    \ \"enchanted\") == 0) {\n            _instance = new EnchantedMazeFactory;\n\n\
    \            // ... other possible subclasses\n\n        } else {        // default\n\
    \            _instance = new MazeFactory;\n        }\n    }\n    return _instance;\n\
    }\n```\n\n注意，每当定义一个新的 MazeFactory 的子类时，Instance 都必须被修改。在这个应用中这可能没什么关系，但对于定义在一个框架中的抽象工厂来说，这可能是一个问题。\n\
    \n一个可能的解决办法将是使用在实现一节中所描述的注册表的方法。此处动态链接可能也很有用——它使得应用不需要装载那些用不着的子类。\n\n关于多线程的情况，参见后文。\n"
  mdcn: "\n![](img/3b4669cf00b2833fe526284506f3f342_112_0.png)\n\n## 3. 适用性\n\n在遇到以下情况使用Facade模式：\n\
    \n- **当要为一个复杂子系统提供一个简单接口时。** 子系统往往因为不断演化而变得越来越复杂。大多数模式使用时都会产生更多更小的类。这使得子系统更具可重用性，也更容易对子系统进行定制，但这些细部还给不需要定制子系统的用户带来一些使用上的困难。\n\
    \n  Facade可以提供一个简单的缺省视图，这一视图对大多数用户来说已经足够，而那些需要更多的可定制性的用户可以越过Facade层。\n\n- **客户端与抽象类的实现部分之间存在着很大的依赖性。**\
    \ 引入Facade可以将子系统与客户端和其他子系统分离，可以提高子系统的独立性和可移植性。\n\n- **当需要构建一个层次结构的子系统时，** 使用Facade模式定义子系统中每层的入口点。\n\
    \n## 4. 结构\n\n![](img/3b4669cf00b2833fe526284506f3f342_112_1.png)\n\n## 5. 参与者\n\
    \n- Facade (Compiler)\n  - 知道哪些子系统类负责处理请求。\n  - 将客户的请求代理给适当的子系统对象。\n- Subsystem\
    \ classes (Scanner、Parser、ProgramNode等)\n  - 实现子系统的功能。\n  - 处理由Facade对象指派的任务。\n\
    \  - 没有Facade的任何相关信息；即没有指向Facade的指针。\n\n## 6. 协作\n\n- 客户程序通过发送请求给Facade的方式与子系统通信；\n\
    - Facade将这些消息转发给适当的子系统对象；\n- 尽管是子系统中的有关对象在做实际工作，但Facade模式本身也必须将它的接口转换成子系统的接口。\n\
    - 使用Facade的客户程序不需要直接访问子系统对象。\n\n## 7. 效果\n\nFacade模式有下面一些优点：\n\n1. 它对客户屏蔽子系统组件，因而减少了客户处理的对象的数目并使得子系统使用起来更加方便。\n\
    2. 它实现了子系统与客户之间的松耦合关系，而子系统内部的功能组件往往是紧耦合的。\n\n松耦合关系使得子系统的组件变化不会影响到它的客户。Facade模式有助于建立层次结构系统，也有助于对对象之间的依赖关系分层。Facade模式可以消除复杂的循环依赖关系。这一点在客户程序与子系统是分别实现的时候尤为重要。\n\
    \n在大型软件系统中降低编译依赖性至关重要。在子系统改变时，希望尽量减少重编译工作以节省时间。用Facade可以降低编译依赖性，减少重要系统中较小的变化所需的重编译工作。Facade模式同样也有利于简化系统在不同平台之间的移植过程，因为编译一个子系统一般不需要编译所有其他的子系统。\n\
    \n## 8. 实现\n\n使用Facade模式时需要注意以下几点：\n\n1. 降低客户-子系统之间的耦合度。用抽象类实现Facade，而它的具体子类对应于不同的子系统实现，这可以进一步降低客户与子系统的耦合度。这样，客户就可以通过抽象的Facade类接口与子系统通讯。这种抽象耦合关系使得客户不知道它使用的是子系统的哪一个实现。\n\
