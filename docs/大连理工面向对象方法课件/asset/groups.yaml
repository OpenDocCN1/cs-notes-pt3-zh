    \ for Courses”的“Add a Course”Sequence Diagram，如图 5 所示。\n\n![](img/3b4669cf00b2833fe526284506f3f342_2_1.png)\n\
    \n图 5\n\n在左侧导航栏中，在 Register for Courses 用例上单击鼠标右键出现快捷菜单。在 New 的子菜单中选择 Sequence\
    \ Diagram。这将在导航栏中添加一个名为 New 图的 Sequence Diagram。当新的图处于选中状态时，输入名字 Add a Course。\n\
    \n- 1. 我们然后将向图中添加对象和消息去执行需要的功能。我们通过在导航栏中的图处双击来打开图。既然这种情况是由 Student Actor 来创建的，我们就可以把这个\
