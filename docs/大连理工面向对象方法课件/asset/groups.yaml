    \n左边的等级结构代表工厂等级结构；\n右边的两个等级结构分别代表两个不同的产品的等级结构。\n\n抽象工厂模式可以向客户端提供一个接口，使得客户端在不必指定产品的具体类型的情况下，创建多个产品族中的产品对象。这就是抽象工厂模式的用意。\n\
    \n### 二．分三段理解：\n\n### 第一段\n\n一个系统需要消费多个抽象产品角色，这些抽象产品角色可以用接口或者抽象类实现。\n为什么不使用一个工厂类负责创建这些角色的实例呢？工厂类负责创建抽象产品的实例描述如下图所示。\n\
    \n![](img/3b4669cf00b2833fe526284506f3f342_59_1.png)\n\n但是，正如上面所指出的，这些抽象产品角色是由接口或者抽象类实现的，而一个接口或者抽象类是不能实例化的。也就是说，上面的设计是不能成立的。\n\
    \n### 第二段\n\n那么怎么满足系统的需求呢？\n"
