    # FACADE（外观，门面）—对象结构型模式


    # 1. 意图


    为子系统中的一组接口提供一个一致的界面，Facade模式定义了一个高层接口，这个接口使得这一子系统更加容易使用。


    # 2. 动机


    将一个系统划分成为若干个子系统有利于降低系统的复杂性。一个常见的设计目标是使子系统间的通信和相互依赖关系达到最小。这可以通过引入一个外观（Facade）对象，它为子系统中较一般的设施提供了一个单一而简单的界面。


    ![](img/3b4669cf00b2833fe526284506f3f342_111_0.png)


    例如有一个编程环境，它允许应用程序访问它的编译子系统。这个编译子系统包含了若干个类，如Scanner、Parser、ProgramNode、BytecodeStream和ProgramNodeBuilder，用于实现这一编译器。


    +   （1）有些特殊应用程序需要直接访问这些类；

    +   （2）但是大多数编译器的用户（不需要直接访问这些类）并不关心语法分析和代码生成这样的细节；他们只是希望编译一些代码。


    对于这些用户，编译子系统中那些功能强大但是又较低级的接口会使他们的任务复杂化。


    为了提供一个高层的接口并且对客户屏蔽这些类，编译子系统还包括一个Compiler类。


    这个类定义了一个编译器功能的统一接口。Compiler类是一个外观，它给用户提供了一个单一而简单的编译子系统接口。它无需完全隐藏或实现编译功能的那些类，即可将它们结合在一起。编译器的外观可方便大多数程序员使用，同时对少数懂得如何使用底层功能的人，它并不隐藏这些功能，如下图所示。'
