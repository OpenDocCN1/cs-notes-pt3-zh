    虚基类干什么用：


    实际上就是解决一个基类被多次继承而产生的二义性问题。那么虚基类到底由谁来调用呢？他是由产生对象的那个派生类的构造函数来调用的（! ），因此相应的虚基类必须有缺省的构造函数或者无参数的构造函数。由于在类层次结构中，虚基类的子孙都可以产生对象，所以每个子孙类的构造函数都应该有对虚基类构造函数的调用。'
