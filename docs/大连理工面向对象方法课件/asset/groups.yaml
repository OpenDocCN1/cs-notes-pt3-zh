    ![](img/3b4669cf00b2833fe526284506f3f342_129_0.png)


    詹姆斯.论伯博士是世界著名的软件开发方法学家之一。从事面向对象方法学与工具学的研究近 30 年，是 OMT 方法的主创人。与 Rational 公司的 Grady
    Booch、Ivar Jacobson 共同创建了一种可视化地说明、建造软件系统的工业标准语言--统一建模语言(UML)，UML 在 1997 年被对象管理组织(OMG)正式确定为国际标准。


    论伯毕业于麻省理工学院物理系，在麻州理工学院取得天文学硕士学位，随后又在麻省理工学院获得计算机科学的博士学位。1994 年加盟 Rational 公司之前，他曾在美国通用电器研究发展中心工作长达
    25 年以上。也就是在那里，他开发了 DSM 面向对象编程语言、OMT 对象建模符号以及 Object Modeling Tool 图形编辑器等。


    论伯是《Object-Oriented Modeling and Design and OMT Insights:Perspectives on Modeling
    from the Journal of Object-Oriented Programming》一书的主要作者。1998 年 12 月出版了《The UML
    Reference Manual》。此外，他还为面向对象的编程杂志定期做专栏。


    ### 3.3 Dr.Ivar Jacobson(依瓦.亚克生博士)


    ![](img/3b4669cf00b2833fe526284506f3f342_129_1.png)


    依瓦.亚克生博士是世界著名的软件开发方法学家之一。他是面向对象软件工程(OOSE)和使用 USE CASE 的发明人，与 Rational 公司的 Grady
    Booch、Jim Rumbaugh 共同创建了一种可视化地说明、建造软件系统的工业标准语言--统一建模语言(UML)，UML 在 1997 年被对象管理组织(OMG)正式确定为国际标准。


    作为 Rational 公司的副总裁，亚克博士负责 Rational 公司的商业和系统工程领域的合作和产品战略。在加入 Rational 公司之前，他曾在瑞典创建了
    Objectory AB 公司，1995 年与 Rational 软件公司合并。


    亚克博士的重大贡献主要在以下领域：


    + 1、1967 年在爱立信(Ericsson)首次提出结构化软件开发方法（基于协作中的子系统交互），后被通信标准 SDL 采用；

    + 2、强调 use-case(一种早期的基于组件开发的过程)开发技术；

    + 3、1987 年，将此开发过程引入到 Objectory 中；

    + 4、为了更好地理解商业过程，捕捉用户需求，1990 年他又将商业工程添加到 Objectory 中；

    + 5、在他加入 Rational 公司之后，经过多次的提炼，最终形成 Rational 公司的一套完整理论--Rational unified Process。


    亚克生博士是面向对象领域三本著名畅销书的主要作者：《Object-Oriented Software Engineering--A Use Case Driven
    Approach 》，《 The Object Advantage--Business Process Reengineering with Object
    Technology 》，《 Software Reuse:Architecture,Process,and Organization for Business
    Success》，1998 年 12 月出版了《The Unified Software Development Process》。另外，亚克生博士还在面向对象技术领域有很多论文，是世界著名的面向对象技术大师。


    ## 4 UML 的组成部分


    主要由两部分组成：UML 的语义，UML 的表示方法。


    ### 4.1 UML 的语义


    UML 的语义描述 UML 精确的元模型定义，即我们将用什么符号来表示我们要做的事情。元模型是 UML 所有元素在语法上提供的一种标记方法，为我们建立模型提供了简单一致的通用的方法，开发者可以在语义上为某一个表示取得一致的标准。从而消除了以往因人而异的表示方法。如对一个操作者，我们可以表示为一个圆，也可以表示为一个小人。UML
    给我们提供了一个标准：用一个小人来代表所有和系统发生关系但并不是系统的一部分的事物，即 actor（操作者）。


    UML 中的基本元模型有：


    #### 4.1.1 操作者(actor);


    Actors 不是系统的一部分——他们是与系统有交互作用的人或事物。通常情况下这代表了一个系统的使用者或外部通信的目标。一个 anctor 可能是：


    + 仅仅是给系统输入信息；

    + 仅仅是从系统获得信息；

    + 从系统获得或输出信息；


