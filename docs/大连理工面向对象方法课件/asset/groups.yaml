    \n再看一个例子\n\n### 例子：静态数据成员与非静态数据成员的区别\n\n`\\第三讲\\Example\\example_5\\example_5.cpp`\n\
    \n```cpp\n#include <iostream.h>\n#include <stdlib.h>\nclass counter\n{\n     \
    \   static int count;  //静态成员\n                int objnumber;//非静态成员\npublic:\n\
    \n        counter(){\n                count++;\n                objnumber=count;\n\
    \        }\n\n        void show(){\n                cout<<\"obj\"<<objnumber<<\"\
    \\n\";\n                cout<<\"count=\"<<count<<\"\\n\";\n        }\n};\nint\
    \ counter::count=0;//初始化（out of the class）\nmain()\n{\n\n        counter obj1;\n\
    \        obj1.show();\n        cout<<\"---------------\\n\";\n        counter\
    \ obj2;//需要仔细看、分析\n        obj1.show();\n        obj2.show();\n        cout<<\"\
    ------------\\n\";\n        counter obj3;\n        obj1.show();\n        obj2.show();\n\
    \        obj3.show();\n        cout<<\"------------\\n\";\n        return 0;\n\
    }\n```\n\n（the result is:）\n\n```text\nobj1 count=1\nobj1 count=2\nobj2 count=2\n\
    obj1 count=3\nobj2 count=3\nobj3 count=3\n```\n"
