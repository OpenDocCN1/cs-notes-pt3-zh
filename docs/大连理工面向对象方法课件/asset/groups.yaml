    # 何时使用工厂方法？


    在以下情况发生时可以考虑使用工厂方法模式。

    1. 有继承关系，需要创建多个子类的对象时；

    2. 类无法预计出必须创建那个类的对象。

    3. 类要使用其子类制定所要创建的对象。'
