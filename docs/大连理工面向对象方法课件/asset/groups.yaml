    工欲善其事，必先利其器，能利用工具是人与动物的最大区别。然而，大多数商业化工具价格不菲，已经加入WTO好几年了，再用盗版会给企业带来很大的不确定性，并且盗版用多了，往往会失去一种程序员的自豪感，丢掉一种文化。经过几个月的摸索，本着以下原则，偶选择了一些适合中小企业开发的工具，当作自己的工具箱：


    - （1）适用于中小型企业，中小型项目（<500万），功能适度

    - （2）易用性好，具备必要的文档

    - （3）免费或低价


    基于这些工具，慢慢形成了一套敏捷开发过程。


    ### （一）、工具简介


    下面简单介绍这些工具，这些工具有些偶已经有相当的使用经验，有些正在使用，有些只是刚选定。除直接用于.net 开发的工具中外，还包括一些开发相关的软件设计、项目管理工具。偶的主要开发经验是
    Web 开发，桌面开发和原型开发，对 Mobile 开发不熟悉，也就没这方面的推荐了。


    ### 1，运行平台


    常用的也就.net framework 1.1, 2.0, 和 mono 了，都是免费的。从功能、性能及安装基础来讲，自然.net framework 要优于
    mono 了。mono 是开源的，.net framework 类库可以反编译，从透明的角度讲两者都差不多。如果你想在非 windows 平台上开发，或者想研究运行时的实现，可以研究
    mono，否则还是用.net framework 吧。


    ### 2，服务器


    我用过的也就 IIS5.0，IIS6.0，Apache 加一个 mod，还有 mono 的 xsp，这也没啥好比较的，自然首选 IIS6.0 了。不过 IIS
    虽然免费，但是至少得 windows server 版本才运行得爽，至少得花几千元。XP 上的 IIS 很不爽，据说也能装全 IIS6.0，不过还是得折腾。开发用的话，用
    Apache 加一个 .net 的 mod，或者 mono 的 xsp，还是挺好用的。Apache 的缺点是对新版.net framework 的支持较 IIS6.0
    滞后。


    ### 3，IDE


    tnnd，这个选择空间也很小。首选自然是 VS 2003 或 2005，如果 VS 2005 速成版将来免费的话，偶就选定这个了，或者选价格并不算高的 VS
    2005 专业版。可悲速成版、专业版中没单元测试，在这里 BS 微软 10000 遍。坚决抵制 VSTS 版！


    其它可选的有 SharpDevelop 和 mono develop。对于不开发 Web 程序的初学者来说，用 SharpDevelop 其实也挺不错的，集成的
    Nant，NDoc，NUnit 都是很有用的工具。SharpDevelop 没断点调试功能，但熟用 NUnit 的话可以弥补这一不足。如果对类库理解得比较深入的话，采用
    SharpDevelop，生产力其实也挺高的——即使是进行 Web 开发。SharpDevelop 的缺点之一是暂时没重构功能，在下一个版本里会有。缺点之二是内存占用比较大，还有性能比
    VS 低得多，大项目，大程序可能不爽。我测试过，用 SharpDevelop 打开一个大于 3M 的 C#源文件（嘿嘿！是 cscgl 还是 tao 的，忘了），挂了；用
    VS 2003 打开大概要花几十秒。


    btw，我个人认为其实就用记事本写中小型（<3000 行）的 C# 程序，效率其实也挺高的，这时候会更加注意类的设计，思路会更清晰一些，当然，速度会慢一些。


    ### 4，类库和文档


    类库是.net 平台的资产。目前.net 下成熟的类库比较少，和 java 比，最大的不足就是这里了。最常用的类库当然是.net framework 了，其它各方面的类库在网上都能搜索到一些。类库的关键资产要素是
    dll 和文档。看文档要看一手资料，第一手资料就是源代码或原编译过来的代码，然后就是各类的原始文档，一般是 chm 格式的。如果看源代码习惯的话，效率会很高，并且，建议用反编译工具看代码，不建议直接看源文件，原因其一是反编译工具提供了很多有用的附加功能，其二是反编译的代码比源文件更真实。常用的反编译工具是
    Reflector。


    .net 下的文档是衰死了，比 javadoc 的 pp 多了。因此在写代码的时候应该注意，多写///注释，然后用 Ndoc 自动生成 chm 文档，多爽呀。


    很多开源项目提供源代码和少量的文档，但它的源代码中有大量的///注释，可用 NDoc 自动生成 chm 文档。即使没有///注释，采用 NDoc 生成文档也是很值的。


    ### 5，数据库


    MS SQL Server Express 版应该是免费的，但标准版和企业版价格还是不低的，还是用开源的好。对功能有要求就用 PostgreSql，没要求就用
    MySql。偶现在是 GIS 项目用 PostgreSql，一般项目用 MySql。数据库管理用 EMS MySQL Manager Lite 和 EMS
    PostgreSql Manager Lite，免费，好用，界面很豪华，性能还行。


    ### 6，设计与建模


    偶选定的 UML 建模工具是 JUDE，2M 大，免费但不开源，比 ArgoUML 功能多、好用。比 Visio 的 UML 功能不知道强大多少倍，比 Together
    也好用。缺点就是只是建模工具，和代码不同步。另一个缺点就是不能自动生成文档。不过偶喜欢这样的工具，强大、体积小，灵活，方便。并且偶觉得它在设计时用就行了，具体的类的文档用
    NDoc 生成。JUDE 是基于 java 的，得安装 java 虚拟机。好像它跨平台也不怎么样，我在 linux 下没运行成功过。


    开源或免费的数据库建模工具试过很多，感觉都不成熟不好用，最后选择了一个商业软件——CASE Studio 2，价格 100-300 美元，功能很实用，支持很多数据库，生成的文档也很
    ppo。


    ### 7，敏捷开发工具


