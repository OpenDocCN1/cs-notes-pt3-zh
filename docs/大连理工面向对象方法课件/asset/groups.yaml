    # （3）工厂方法模式和简单工厂模式


    区别：工厂方法模式和简单工厂模式在结构上的不是很明显的。

    工厂方法模式的核心：是一个抽象工厂类，具体工厂类派生于抽象工厂类；

    而简单工厂模式把核心：放在一个具体类上。


    联系：工厂方法模式可以允许很多具体工厂类从抽象工厂类中将创建行为继承下来，

