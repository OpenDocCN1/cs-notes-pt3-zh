    \ 0)\n    {\n        _instance = new Singleton;\n    }\n    return _instance;\n\
    }\n```\n\n客户仅通过Instance成员函数访问这个单件。变量  \n_instance初始化为0，而静态成员函数Instance()返回  \n\
    该变量值，如果其值为0则用唯一实例初始化它。Instance  \n的返回值直到被第一次访问时才创建和保存。\n\n注意构造器是保护型的。试图直接实例化Singleton的客户将得到一个编译时的错误信息。这就保证了仅有一个实例可以被创建。"
