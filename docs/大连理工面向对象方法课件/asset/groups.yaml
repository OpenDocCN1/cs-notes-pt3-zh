    \n+ e. 在这个表中，编译器放置了在这个类中或在它的基类中所有已声明为virtual函数的地址。\n\n+ f. 如果在这个派生类中没有对在基类中声明为virtual的函数进行重新定义，编译器就使用基类的这个虚函数地址。（在brass的VTABLE中，adjust的入口就是这种情况。）然后编译器在这个类中放置VPTR（同步化可在SIZE.CPP中发现）。当使用简单继承时，对于每个对象只有一个VPTR。VPTR必须被初始化为指向相应的VTABLE。（这在构造函数中发生，在稍后会看得更清楚。）\n\
