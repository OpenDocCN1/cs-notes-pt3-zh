    # 7 虚函数和构造函数


    # 7.1 构造函数


    所有基类构造函数总是在继承类构造函数中被调用。这是有意义的，因为构造函数有

    一项专门的工作：确保对象被正确的建立。

    然而，在构造函数内，必须想办法保证所有我们的成员都已经建立。保证它的唯

    一方法是让基类构造函数首先被调用。这样，当我们在派生类构造函数中时，在基类中

    我们能访问的所有成员都已经被初始化了。在构造函数中，“必须知道所有成员对象是有效的”也是下面做法的理由：只要可能，我们应当在这个构造函数初始化表达式中初始化

    所有的成员对象（放在合成的类中的对象）。只要我们遵从这个做法，我们就能保证所有基

    类成员和当前对象的成员对象已经被初始化。


    # 7.2 虚函数在构造函数中的行为


    对于在构造函数中调用一个虚函数的情况，被调用的只是这个函数的本地版本。也就

    是说，虚拟机制在构造函数中不工作。

    原因在于：

    1）在概念上，构造函数的工作是把对象变成存在物。在任何构造函数中，对象可

    能只是部分被形成——我们只能知道基类已被初始化了，但不知道哪个类是从这个基类继

    承来的。然而，虚函数是“向前”和“向外”进行调用。它能调用在派生类中的函数。

    假如我们在构造函数中也这样做，那么我们所调用的函数可能会导致操作那些还没有

    被初始化的成员，这将导致灾难的发生。

    2）当一个构造函数被调用时，它做的首要的事情之一是初始化它的VPTR。因此，

    它只能知道它是“当前”类的，而完全忽视这个对象后面是否还有继承者。当编译器为这个

    构造函数产生代码时，它是为这个类的构造函数产生代码——既不是为基类，也不是为它

    的派生类（因为类不知道继承它）。所以它使用的VPTR必须是对于这个类的VTABLE。

    而且，只要它是最后的构造函数调用，那么在这个对象的生命期内，VPTR将保持被初

    始化为指向这个VTABLE。但如果接着还有一个更晚派生的构造函数被调用，这个构造函数又

    将设置VPTR指向它的VTABLE，等等，直到最后的构造函数结束。VPTR的状态是由被最后调用

    的构造函数确定的。这就是为什么构造函数调用是从基类到更加派生类顺序的另一个理由。


    # 7.3 析构函数和虚拟析构函数


    构造函数不能是虚的。但析构函数能够且常常必须是虚的。

    构造函数有其特殊的工作：它首先调用基类构造函数，然后调用在继承顺序中的更晚派

    生的构造函数，如此一块一块地把对象拼起来。类似的，析构函数也有一个特殊的工作——

    它必须拆卸可能属于某类层次的对象。为了做这些工作，它必须按照构造函数调用相反的顺

    序，调用所有的析构函数。这就是，析构函数自最晚派生的类开始，并向上到基类。这是安

    全且合理的：当前的析构函数能知道基类成员仍是有效的，因为它知道它是从哪一个派生

    而来的，但不知道从它派生出哪些。

    应当记住，构造函数和析构函数是必须遵守调用层次唯一的地方。在所有其他函数中，'
