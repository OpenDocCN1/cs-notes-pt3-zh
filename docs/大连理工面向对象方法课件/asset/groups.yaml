    输入属性名—— location


    ![](img/3b4669cf00b2833fe526284506f3f342_9_1.png)


    ## 步骤 10： 设置操作


    一个类的行为是通过其一系列的操作来体现的。操作最初是通过在顺序图中将消息映射到操作而发现的。

    第一步是将顺序图中的对象指派给类，如图 21 所示。


