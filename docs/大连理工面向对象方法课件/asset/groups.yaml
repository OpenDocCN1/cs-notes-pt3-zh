    ```\n\n出现这样结果的原因：是静态数据成员和非静态数据成员的一个极大的不同之处。对于同一个类的所有对象，C++只为它们维护了一份静态变量的拷贝，通过每一个对象对这些静态变量进行操作，事实上都是对同一个数据区域进行操作。这就可以解释上面的运行结果了，无论我们使用表达式`cls1.i`还是表达式`cls2.i`，它们都是对同一个`i`进行操作，很自然，使用表达式`cls1.i`修改了静态成员`i`的值，表达式`cls2.i`的值会立即反映所作的修改。"
