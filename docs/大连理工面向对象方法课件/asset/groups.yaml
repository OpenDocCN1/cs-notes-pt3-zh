    Solutions for Object Technology》《Best of Booch:Designing Strategies for Object
    Technology》《Software Engineering with Ada》《Software Components with Ada》《The UML
    User Guide》。其中，《Object-Oriented Analysis and Design》（面向对象的分析及设计）一书描述了面向对象技术的理论和符号、过程和解决方案。该书已成为当今软件工业界最受推崇的面向对象经典著作。《The
    UML User Guide》（UML 用户指南）一书于 1998 年 12 月出版，被国际互联网上名列前茅的书籍和音像制品零售商 Amazon 评为最高等级：五星级，是网上最畅销的计算机类图书。


