    ![](img/3b4669cf00b2833fe526284506f3f342_7_0.png)


    在导航栏中双击名为 Main 的图来打开图。

    在 Query 菜单下选择 :Add Classes 。

    点击 All>> 按钮添加所有的类。

    单击 OK 按钮关闭窗口，这样就将类添加到了图中。

    通过选中类并将它拖动到新的位置来在图中按需要重新安排类。

    注意：也可以通过从导航栏中拖到图中的方法来添加类。不过这样只能一次处理一个类。


    # 步骤7： 指定原型类型


    UML 有一个原型的概念，这个概念可以用来创建新类型的建模元素。它提供了为模型添加含义的能力。因为它是一个代表billing system 外部接口的一个类，所以我们将使用预定义的BillingSystem
    类的接口原型。又因为这将最终成为某种GUI表格，所以我们将使用 RegForm 类的表格原型，如图16所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_7_1.png)


    双击 Main 类中的BillingSystem 类，打开定义（ Specification ）窗口，点击 Stereotype 域的箭头，显示下拉菜单。选择接口原型（
    Interface stereotype ），选择 OK 按钮，关闭 Specification 窗口。对RegForm类重复上述步骤


    # 步骤8： 设置关系类型


    为了便于对象间的通信，可添加类间的关系。顺序图就是用于检查一个对象是否必须同另一个对象通信。如果是必须的，那么在它们的类之间必须有一个通信的路径。两种常见的关系类型是关联和聚合。

    关联是类间的一个双向连接。通过检查“添加流程（ Add a Course ）”顺序图，我们能够决定下述关联是否存在： RegForm 与 Manager 、
    Manager 与 Course 和 Manager 与 Bill ，如图17所示。


