    # # 抽象工厂模式


    # ## 一．概念


    抽象工厂模式是所有形态的工厂模式中最为抽象和最具一般性的一种形态。


    抽象工厂模式的简略类图如下所示。


    ![](img/3b4669cf00b2833fe526284506f3f342_59_0.png)


