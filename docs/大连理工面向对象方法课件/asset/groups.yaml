    当一个语言实现晚绑缚时，必须有一种机制在运行时确定对象的类型和合适的调用函数。这就是，编译器还不知道实际的对象类型，但它插入能找到和调用正确函数体的代码。晚绑缚机制因语言而异，但可以想象，一些种类的类型信息必须装在对象自身中。


    # ## 3 虚函数


    对于特定的函数，为了引起晚绑缚，C++要求在基类中声明这个函数时使用virtual关键字。晚绑缚只对virtual起作用，而且只发生在我们使用一个基类的地址时，并且这个基类中有virtual函数，尽管它们也可以在更早的基类中定义。


    为了创建一个virtual成员函数，可以简单地在这个函数声明的前面加上关键字virtual。对于这个函数的定义不要重复，在任何派生类函数重定义中都不要重复它（虽然这样做无害）。如果一个函数在基类中被声明为virtual，那么在所有的派生类中它都是virtual的。在派生类中virtual函数的重定义通常称为越位。


    定义虚拟函数的方法是：


    virtual <返回值类型> <函数名> (<参数表>)


    在派生类中定义虚拟函数时，应该注意：

    （1）与基类的虚函数有相同的参数个数；

    （2）其参数的类型与基类的虚函数的对应参数类型相同；

    （3）返回值类型一般与基类的相同；

    （4）基类的虚函数加“virtual”，派生类可以省略。


    为了从WIND2.CPP中得到所希望的结果，只需简单地在基类中的play()之前增加virtual关键字：


    ```

    ```cpp

    //: C15:Wind3.cpp


    // Late binding with virtual

    #include <iostream>

    using namespace std;

    enum note { middleC, Csharp, Cflat }; // Etc.

    ```

    ```


    ```

    ```cpp

    class Instrument {

    ```

    ```'
