    下面是观察者模式其它一些优缺点：\n\n1）目标和观察者间的抽象耦合。一个目标所知道的仅仅是它有一系列观察者，每个都符合抽象的Observer类的简单接口。目标不知道任何一个观察者属于哪一个具体的类。这样目标和观察者之间的耦合是抽象的和最小的。\n\
    \n因为目标和观察者不是紧密耦合的，它们可以属于一个系统中的不同抽象层次。一个处于较低层次的目标对象可与一个处于较高层次的观察者通信并通知它，这样就保持了系统层次的完整。如果目标和观察者混在一块，那么得到的对象要么模贯两个层次(违反了层次性)，要么必须放在这两层的某一层中(这可能会损害层次抽象)。\n\
    \n2）支持广播通信。不像通常的请求，目标发送的通知不需指定它的接收者。\n\n通知被自动广播给所有已向该目标对象登记的有关对象。目标对象并不关心到底有多少对象对自己感兴趣；它唯一的责任就是通知它的各观察者。这给了我们可以在任何时刻增加和删除观察者的自由。处理还是忽略一个通知取决于观察者。\n\
    \n3）意外的更新。需要注意：在目标上一个看似无害的操作可能会引起一系列对观察者以及依赖于这些观察者的那些对象的更新。也可能引起错误的更新，这种错误通常很难捕捉。\n\
    \n### 9. 变化\n\n- 1）一些方法可能会改变被观察机制的内部问题。\n- 2）观察者不可能知道实现的全部细节。因此，观察者必须能够在不知道实现细节的情况下工作。\n\
    - 3）通知机制通常由观察者对象负责维护。观察者可以注册和注销，并在被观察对象发生变化时得到通知。\n- 4）如果通知是同步的，那么被观察对象必须等待所有观察者完成处理；如果通知是异步的，则需要额外的线程或事件机制。\n\
    - 5）观察者模式的一个缺点是可能导致通知链过长，从而增加系统的复杂性。\n\n```\nvoid MySubject::Operation (int newValue)\
    \ {\n    BaseClassSubject::Operation(newValue);\n    // trigger notification\n\
    \n    _myInstVar += newValue;\n        // update subclass state (too late!)\n\
    }\n```\n\n在另一个例子中，基类中的操作可能先触发通知，然后子类才更新自己的状态，这可能导致观察者得到不一致的信息。\n\n```\nvoid TextField::OnChange\
    \ (TextRange r)\n{\n    ReplaceRange(r);        // redefined in subclasses\n \
    \   Notify();\n}\n```\n\n观察到这一点，在实际中可以采用更合理的设计来避免上述问题。\n\n- 6）避免将变化聚集在单一的更新一处/触发器。观察者模式的实现通常需要注册和注销观察者。\n\
    \n它是一个很好的设计原则。目前观察者通常被分为两类：一类为观察者，另一类为被观察者。我们将之称为模型（model）和视图（view）。\n\n- 7）模型是应用程序的核心部分，直接表示应用程序的数据和逻辑；视图负责显示模型中的数据。\n\
    - 8）模型和视图之间通过观察者模式进行通信。模型发生变化时，视图可以得到通知并更新显示。\n- a) 一个模型可以有多个视图，这些视图可以显示同一个模型的不同方面。\n\
    - b) 视图不会修改模型中的数据，而是通过控制器与模型进行交互。\n- c) 模型和视图之间的通信是松耦合的，模型不需要知道视图的具体实现。\n- 9）当多个视图需要共享同一个模型时，可以使用观察者模式。模型中的变化会自动通知所有相关视图。\n\
    \n## 10. 代码示例（自己编写）\n\n## 敏捷开发\n\nhttp://www.itisedu.com/phrase/200603291800375.html\n\
    \n因业务需要，“中科永联”正式更名为“中程在线”，欢迎大家浏览新网站“[中程在线信息产业培训网](#)”\n\n![](img/3b4669cf00b2833fe526284506f3f342_243_0.png)\n\
    \n[敏捷开发（agile development）](#) 是一种以人为核心、迭代、循序渐进的开发方法。在敏捷开发中，[软件](#)项目的构建被切分成多个子项目，各个子项目的成果都经过测试，具备集成和可运行的特征。简言之，就是把一个大项目分为多个相互联系，但也可独立运行的小项目，并分别完成，在此过程中软件一直处于可使用状态。\n\
    \n敏捷开发是全新理论吗？答案莫衷一是。细心的人们可以发现，敏捷开发其实借鉴了大量[软件工程](#)中的方法。迭代与增量开发，这两种在任何一本软件工程教材中都会被提到的方法，在敏捷开发中扮演了很重要的角色。再向前追溯我们还也可见到瀑布式与快速原型法的影子，也许还有更多。\n\
    \n改善，而非创新。敏捷开发可理解为在原有[软件开发](#)方法基础上的整合——取其精华，去其糟粕。因此敏捷开发继承了不少原有方法的优势。“在敏捷软件开发的过程中，我们每两周都会得到一个可以工作的软件。”\
    \ Fowler 介绍，“这种非常短的循环，使终端客户可以及时、快速地看到他们花钱构建的软件是一个什么样的结果。”\n\n也许是因为时间关系，Fowler\
    \ 只说出了这些优势中的一部分。允许开发过程中的[需求](#)变化，通过早期迭代可以较早发现风险、使代码重用变得可行、减少项目返工……借鉴了众多先进方法和丰富经验，拥有的众多优势使得敏捷开发者来已经成为解决[软件危机](#)的标准答案。\n\
    \n## 问题与思考\n\n然而，我们不得不面对的现实却是，模式与方法的优化并不意味着问题的终结。作为一种开发模式，敏捷开发同样需要面对众多挑战。\n\n\
    大项目的拆分意味着更多子项目的出现，协调这些同步或异步推进的子项目，合理的资源调配都将变得更加复杂。另外，在当前项目和项目组普遍“增容”的情况下，遇到的问题同样成倍增长。人的重要性被提到了更高的高度，而缺乏有效协调手段，减少人员流动和项目变更对整个项目造成的影响也将成为一大挑战……新方法带来众多便利的同时，也相应引发了几乎同样多的问题。\n\
    \n"
