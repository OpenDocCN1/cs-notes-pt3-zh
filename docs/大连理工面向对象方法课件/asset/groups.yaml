    # 3 UML 发明人


    # 3.1 Grady Booch(格雷第.布屈)


    ![](img/3b4669cf00b2833fe526284506f3f342_128_0.png)


    Booch 是美国 Rational 软件工程公司的首席科学家和 Booch 方法的主创人。与 Rational 公司的 Ivar Jacobson、Jim
    Rumbaugh 共同创建了一种可视化地说明、建造软件系统的工业标准语言-统一建模语言 UML。UML 共 1997 年被对象管理组织 OMG 正式确定为国际标准。


    Booch 于一九七七年毕业于美国空军军官学校，并于一九七九年在加州大学圣.巴巴拉分校获得计算机工程硕士学位。Rational 公司成立不久，Booch 就加盟这个公司。在过去的十几年里他致不懈地在面向对象领域里研究，取得了开拓性的研究成果。他开发了面向对象的分析设计方法
    Booch Method 和可重用的、灵活的 Booch 组件。他还是 Rational 公司一些产品的开发者，包括该公司最初的软件工程环境 Rational
    Environment 及业界领先的可视化建模工具 Rational Rose。


    Booch 先后发表了上百篇有关面向对象技术和软件工程方面的学术文章，出版了六本学术著作：《Object-Oriented Analysis and Design》《Object
    Solutions for Object Technology》《Best of Booch:Designing Strategies for Object
    Technology》《Software Engineering with Ada》《Software Components with Ada》《The UML
    User Guide》。其中，《Object-Oriented Analysis and Design》（面向对象的分析及设计）一书描述了面向对象技术的理论和符号、过程和解决方案。该书已成为当今软件工业界最受推崇的面向对象经典著作。《The
    UML User Guide》（UML 用户指南）一书于 1998 年 12 月出版，被国际互联网上名列前茅的书籍和音像制品零售商 Amazon 评为最高等级：五星级，是网上最畅销的计算机类图书。


    Booch 因其卓越的科学贡献而当选为 ACM(美国计算机学会)组织的荣誉会员，他走遍世界各地，指导国际大型软件开发项目，并在各种国际学术会议上发表演讲。受他指导的公司有：U.S.Government、Alcatel（阿尔卡特）、Andersen
    Consulting(安达信咨询公司)、ATT、Banker''s Trust、Boeing（波音）、IBM、MCI、微软、Oracle、Siemens 等。'
