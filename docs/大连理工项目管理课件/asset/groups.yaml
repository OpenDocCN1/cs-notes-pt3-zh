    - 监理单位风险 供应商风险 担保方风险 保险公司风险等


    ### 5. 风险管理


    利用科学的方法去识别风险、评价风险并设计、实施有效的方法去控制风险。


    ### 5.1 案例分析


    ### 钢筋砼下水管泄漏污染地下水源的风险分析


    背景资料：90%的地下水源污染是由（水泥管）下水管泄漏造成的。


    | 故障模式 | 危害度 | 原因分析 | 发生概率 | 补救代价 | 应对方案 |

    |---|---|---|---|---|---|

    | 下水管泄漏 | 污染地下水源污染物分类：1. 生活污水洗涤剂等化学制剂2. “产业”废水 | 水泥管寿命短，到寿；水锤管抗渗透性差；水泥管耐压性差；硬接头沉降位移密封失效连接低劣接头泄漏胶片老化软接头连接低劣密封失效
    | 需统计水泥管有关技术指标的可靠性参数；地质状况；承载及环境状况； | | 水泥管替代物方案研究合同规定水泥管定点采购水泥管品质保证措施承建商管路铺设质量控制
    |


    ### 5.2 风险管理策略


    - □ 风险回避

    - □ 风险减轻

    - □ 风险自担

    - □ 风险转移

    - □ 风险共担


    风险控制


    风险“融资”


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_889_0.png)


    ### 5.3 风险管理规划


    风险管理规划是规划和设计如何进行项目风险管理的过程。该过程包括定义项目组织及成员风险管理的行动方案及方式，选择适合的风险管理方法，确定风险判断的依据等。


    ### 风险管理规划的方法及内容


    风险管理规划一般通过规划会议的形式制定。风险管理规划将针对整个项目生命周期制定如何组织和进行风险识别、风险评估、风险量化、风险应对计划及风险监控的规划。风险管理规划应包括：方法、人员、时间周期、类型级别及说明、基准、汇报形式、跟踪等。


    © 2010 School of Software, Dalian University of Technology 171


    ### 5.3 风险管理过程


    明确目标


    风险识别


    风险评价


    设计、评价、抉择风险应对方案


    实施方案


    评估与审核


    ### 5.4 风险工具技术


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_892_0.png)


    | 风险识别 | 风险分析与评估 | 风险处理 | 风险监督 |

    |---|---|---|---|

    | 识别询问 | 环境分析 | 风险处理 | 建立项目 |

    | 层次分析 | 财务分析 | 回避大的风险 | 风险管理 |

    | 历史资料统计 | 流程分析 | 损失控制 | 制度 |

    | 现场勘查 | 历史数据 | 转移（保险） | 组建风险 |

    | | 风险量测量 | 分离 | 管理小组 |

    | | 概率分布 | 分散 | |


    ### 风险识别的方法


    1、 问询法（头脑风暴法、面谈法和德尔菲法等）


    2、 财务报表法（各种财务报表和记录）


    3、 流程图法（网络图或WBS法）


    4、 现场观察


    5、 历史资料（索赔记录及其他风险信息）


    6、 环境分析法（相关方和社会环境变化趋势，可能变更的法律法规）等。


    ### 5.6 风险评估


    风险评估常用的方法有：


    1、概率分布（专家预测）


    2、外推法（使用历史数据）


    3、定性评估


    4、矩阵图分析


    5、风险发展趋势评价方法


    6、项目假设前提评价及数据准确度评估


    ### 5.7 风险量化和处理


    依据风险管理计划、风险及风险条件排序表、历史资料、专家判断及其他计划结果，利用面谈、灵敏度分析、决策分析和模拟的方法和技术、得出量化序列表、项目确认研究，以及所需应急资源等量化结果。

    风险量化后，要进行风险评价，常用方法有：

    1、 项目风险费用分析

    2、 项目风险评价准则

    3、 风险评价的策略分析法

    4、 风险评价的层次分析


    '
