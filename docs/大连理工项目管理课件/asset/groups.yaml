    \n### （5）清偿能力分析\n\n- a）偿还借款的资金来源，本案例为简化计算，在还款期间将未分配利润、折旧费、摊销费全部用来还款，但在进行实际项目的还款计算时，可根据项目的实际情况确定。\n\
