    # # 项目范围的细分


    项目范围的细分，是指将项目范围说明书中描述的项目主要提交成果，按照一定的结构层次，进一步分解为更小、更加便于控制和管理的许多组成部分。——建立项目工作分解结构（WBS）


    # ## 细分项目范围的目的


    +   - 提高项目成本、工期和资源估算的准确性

