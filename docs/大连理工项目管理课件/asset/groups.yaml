    # 可行性研究包括哪些内容？应注意哪些问题？


    项目论证是一个连续的过程，包括问题的提出、制定目标、拟定方案、分析评价，最后从多种可行的方案中选出一种比较理想的最佳方案，供投资者决策。


    +   - 可行性项目研究的主要内容：

    +   - 市场需求预测

    +   - 原材料和投入的选择供应

    +   - 产品结构和工艺方案的确定

    +   - 生产规模（或生产能力）的确定

    +   - 技术与设备选择

    +   - 坐落地点和厂址选择

    +   - 投资估算

    +   - 资金筹措

    +   - 经济评价

    +   - 国民经济评价

    +   - 不确定性与综合分析'
