    \n- 项目评估的概念\n- 项目评估与项目可行性研究的关系\n- 项目评估的依据\n- 项目评估的程序\n- 项目评估的内容\n- 项目评估报告大纲\n\n\
    ### 1. 项目评估的概念\n\n- 项目评估是指在项目可行性研究的基础上，由第三方（国家、银行或有关机构）根据国家颁布的政策、法规、方法、参数和条例等，从项目（或企业）、国民经济、社会角度出发，对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行全面评价、分析和论证，进而判断其是否可行的一个评估过程。\n\
    - 项目评估是项目投资前期进行决策管理的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门的审批决策提供科学依据。\n\
    \n### 2. 项目评估与可行性研究的关系\n\n**两者之间的关系**\n\n- 工作关系：可行性研究为项目评估提供工作基础，项目评估则是可行性研究的延伸、深化和再研究。\n\
    - 工作时点：可行性研究在项目建议书批准之后进行工作；项目评估在项目可行性研究报告批准之后进行工作。\n- 工作性质：\n  - 可行性研究系从宏观到微观逐步深入的研究过程。\n\
    \  - 评估则是将从微观问题再拿到宏观去衡量的过程。\n\n**评估与可行性研究相同之处**\n\n- 均处于项目发展周期的建设前期。\n- 项目投资之前，都是为投资决策服务的经济分析手段。\n\
    - 工作的内容基本相同。\n- 经济评价指标计算的基本原理、分析对象、分析依据、分析内容相同。\n- 基础理论基本相同。\n- 市场学、工程经济学、费用—效益分析。\n\
    - 最终工作的目标及要求相同。\n- 判断项目的可行与否，使资源得到最佳配置。\n- 在调查研究的基础上进行分析和预测，得出公正客观的结论。\n\n**评估与可行性研究不同之处**\n\
    \n| 不同点 | 可行性研究 | 项目评估 |\n|---|---|---|\n| 行为主体 | 由建设单位（即投资者）负责组织委托 | 由贷款银行或有关部门负责组织委托\
    \ |\n| 立足点 | 站在投资者的角度来考察项目 | 站在贷款银行或有关部门的角度来考察项目 |\n| 侧重点 | 侧重于项目的必要性与技术方面的论证\
    \ | 侧重于考察项目建设的可能性与借款的偿还能力 |\n| 作用 | 投资主体进行投资决策和计划部门审批项目的依据 | 贷款部门参与决策和决定贷款与否的依据，是项目投资最终决策的依据\
    \ |\n| 所处阶段 | 可行性研究在先 | 项目评估在后，工作顺序不能颠倒 |\n\n### 4. 项目评估的程序\n\n- 1）成立评估小组并进行分工\n\
    - 2）对可行性研究报告和相关资料进行审查和分析\n- 3）编写评估报告提纲\n- 4）数据调查\n- 5）分析与论证\n- 6）编写评估报告\n- 7）小组讨论\n\
    - 8）修改报告\n- 9）专家论证会\n- 10）评估报告定稿\n"
