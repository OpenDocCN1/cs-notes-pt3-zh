    # # 1. 项目验收


    +   项目验收又叫移交或范围确认。项目或项目阶段结束时，项目班子在将项目最终交付成果交给使用者或接受者之前，接受方要对已经完成的工作成果进行审查，查核项目计划规定范围内的各项工作或活动是否已经完成，应交付成果是否令人满意。


    +   如果项目提前结束或非正常结束，则应查明有哪些工作已经完成，完成到了什么程度，以及造成项目不能正常结束原因，并将核查结果记录在案，形成文件。'
