  - '[PAGE 566]


    # 挣得值方法


    +   - 挣得值方法是**对项目进度和费用进行综合控制**的一种有效方法。


    +   - 挣得值方法的三个基本参数


    +     - **计划工作量的预算费用**（BCWS，即 Budgeted Cost for Work Scheduled）。BCWS 是指项目实施过程中某阶段计划要求完成的工作量所需的预算工时（或费用）。计算公式为：BCWS
    = 计划工作量 × 预算定额。BCWS 主要是反映进度计划应当完成的工作量而不是反映应消耗的工时（或费用）。'
  - "[PAGE 567]\n\n# 挣得值方法(续1)\n\n# 挣得值方法的三个基本参数\n\n+   - **已完成工作量的实际费用（ACWP）**，即（Actual\
    \ Cost for Work Performed）。\n+   \n+     ACWP是指项目实施过程中某阶段实际完成的工作量所消耗的工时（或费用）。ACWP主要是反映项目执行的实际消耗指标。"
  - "[PAGE 568]\n\n# # 挣得值方法(续2)\n\n+   ### 挣得值方法的三个基本参数\n+   \n+   - 已完工作量的预算成本(BCWP)，即\
    \ (Budgeted Cost for Work Performed)。BCWP是指项目实施过程中某阶段按实际完成工作量及按预算定额计算出来的工时(或费用)，即挣得值(Earned\
    \ Value)。BCWP的计算公式为：BCWP=已完工作量×预算定额。"
  - '[PAGE 569]


    # # 挣得值方法(续3)


    # □ 挣得值方法的四个评价指标


    +   - **费用偏差**(Cost Variance-CV)：CV是指检查时间BCWP与ACWP之间的差异，计算公式为 CV=BCWP-ACWP。当CV为负值时表示执行效果不佳，即实际消费人工(或费用)超过预算值即超支。反之当CV为正值时表示实际消耗人工(或费用)低于预算值，表示有节余或效率高。'
  - '[PAGE 570]


    CV>0 表示完成某工作量时，实际资源消耗低于计划值（如图2.2-3）。


    CV<0 表示完成某工作量时，实际资源消耗高于计划值（如图2.2-4）。


    CV=0 表示完成某工作量时，实际资源消耗等于计划值。


