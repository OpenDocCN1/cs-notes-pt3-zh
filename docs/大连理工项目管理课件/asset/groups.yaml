    ## 马斯洛的需要层次理论


    王力是一位由部队转业的项目经理，他觉得理想的动力是巨大的，他觉得他过去就是在追求理想的动力下努力工作的。他在管理中鼓励员工树立远大理想，常用一些英雄人物如铁人王进喜等等教育员工，然而收效并没有预想的大，你能说出为什么吗？


    1. 生理的需要

    2. 安全的需要

    3. 社交的需要

    4. 尊重的需要

    5. 自我实现的需要


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_141_0.png)


    ## 赫茨伯格的双因素理论


    邱晨是一家软件企业经理，他深知“民以食为天”的道理，不断提高员工待遇，如工作环境质量改善、工资、福利水平提高，等等。但是他还是发现员工并没有他预期的满意水平。这是为什么？


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_142_0.png)


    - 保健因素是指那些与人们的不满情绪有关的因素，如企业政策，工资水平，工作环境，劳动保护，人际关系等

    - 激励因素是指那些与人们的满意情绪有关的因素，如工作表现机会，工作带来的愉快，工作上的成就感，由于好的成绩而得到的奖励，未来发展的期望，职务上的责任感


    ## 麦克利兰的成就需要理论


    郭飞在一家企业工作，他最近很烦恼，因为领导说他“权力欲望”太大，让他踏踏实实工作，否则就解雇他。他觉得我想“当官”又不是“不好好工作”，难道按领导的说法“当官的都不是好员工”吗？


    - [ ] 权力的需要

    - [ ] 社交的需要

    - [ ] 成就的需要


