    # # 示例


    +   例：假设某企业的总投资为4900万元，投产后每年的产值为990万元，企业年经营成本为450万元。试求其投资回收期？


    +   如果不考虑时间因素，投资回收期T可由总投资额和年利润值算出，即


    +   T=4900/（990-450）≈9年


    +   但是企业的投资是由银行贷款的，因此除偿还成本外，每年还要支付利息，年利率为10%。


    +   考虑这一因素，则应按动态投资回收期计算，即


    +   Td=23年


    +   不考虑时间因素的投资回收期是9年，可以认为经济效益可取，而考虑了贷款利息之后，投资回收期为23年，从经济效益看可能就是不可取了。'
  - '[PAGE 232]


