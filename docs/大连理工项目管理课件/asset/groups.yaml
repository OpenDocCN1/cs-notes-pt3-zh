    # # 3.1 冲突来源之一： 项目成员


    在项目的进行过程中，项目成员在项目的开始时间、项目进度、实施技术等方挥发生分歧。


    涉及到项目组成员的冲突主要有四个方面：


    +   1 项目成员的个性冲突；（遇到挫折的消沉）

    +   2 队员之间的冲突；（两人无法相处；一人不合团队）

    +   3 团队之间的冲突；（同一目标不同团队之间的角逐）

    +   4 团队内部的冲突；（帮派、小集体的内讧）'
  - '[PAGE 840]


