    +   - 关于IPMP认证'
  - '[PAGE 1]


    # # 7.国内项目管理专业组织


    +   - 中国项目管理研究委员会PMRC

    +     - 是中国唯一的一个全国性跨行业项目管理学术组织

    +     - 1991年成立，至今已有10年的历史

    +     - 举行了三次国内项目管理学术会议、两次国际会议

    +     - 建立了中国项目管理知识体系，引进了国际项目管理专业资质认证IPMP

    +     - 代表中国加入了国际项目管理协会IPMA，成为其会员国组织

    +     - PMRC的目标是致力于中国项目管理的专业化和国际化发展'
  - '[PAGE 2]


    # 10.关于国际项目管理专业资质认证


    +   (1）PMI的PMBOK和PMP，1991(1985)美国项目管理协会的项目管理知识体系和项目管理专业资格认证。


    +   (2）IPMA的 ICBIPMP,1996(1987,1993)


    +   (3）C-PMBOK和C-NCB


    +   (4）中国的认证体系及其组织机构'
  - '[PAGE 3]


    # # IPMA的IPMP


    # # IPMA 全球四级证书体系（IPMP）


    | Title 头衔 | Capabilities 能力 | Certification Process 认证程序 | Validity 有效期 |

    |---|---|---|---|

    | | | Stage 1 阶段 1 | Stage 2 阶段 2 | Stage 3 阶段 3 | |

    | 国际特级项目经理 (IPMA Level A) | Competence = knowledge + experience + personal attitude
    | Application, curriculum vitae, project list, references, self assessment | Projects
    director report 项目群管理 报告 | Interview 面试 | 5-years 5 年 |

    | 国际高级项目经理 (IPMA Level B) | 能力 = 知识 + 经验 + 个人素质 | Application, curriculum vitae,
    self assessment 申请 履历 项目清单 证明材料 自我评估 | Project report 项目报告 | | |

    | 国际项目经理 (IPMA Level C) | 能力 = 知识 + 经验 + 个人素质 | Application, curriculum vitae,
    self assessment 申请 履历 自我评估 | 笔试 二选一： 案例研讨或短 项目报告 | | |

    | 国际助理项目经理 (IPMA Level D) | Knowledge 知识 | Application, curriculum vitae, self
    assessment 申请 履历 自我评估 | Written exam 笔试 | 无效期 可选： 10 年 |'
  - '[PAGE 4]


    # # 11.关于IPMP考试


    +   IPMP注重能力考核，能力=知识+经验+个人素质是其基本定义


    +   IPMP C级以上考核，级别越高对于经验的要求越严格


    +   IPMP 笔试考核注重于解决实际问题的能力，并且试题考核以案例为导向


    +   WORKSHOP与案例报告是IPMP特有的考核形式，对于应试者个人素质及解决问题的能力考核非常重要


    +   IPMP面试着重于对应试者综合素质的考核，全面了解应试者从事项目管理的理念'
  - '[PAGE 5]


    # # 12.关于IPMP笔试


    +   - IPMP C级(certificated project management professional)

    +     - 以实际案例为导向

    +     - 注重项目管理核心方法的考核

    +     - 强调方法的应用

    +     - 题型为问答题


    +   - IPMP D级(certificated project management practitioner)

    +     - 注重理论与案例相结合的考核

    +     - 相对全面的综合考核

    +     - 题型以选择题和问答题相结合


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_5_0.png)'
  - '[PAGE 6]


    # # 13.IPMP的能力考核因素


    +   - 基本能力：管理，项目和项目管理，项目背景和利益相关者，系统方法和项目管理，项目管理实施，项目目标，项目成功与失败的准则，项目阶段，项目生命期，标准与指南


    +   - 社会能力：洞察力，激励，社会化结构，小组和团队，学习型组织，自我管理，领导艺术，冲突管理，特殊交流状况


    +   - 方法能力：项目结构，过程和时间管理，资源管理，成本管理，财务管理，实施测量和项目进展，项目控制，多项目管理，创新技术，解决问题


    +   - 组织能力：公司和项目组织，质量管理，合同管理，构型和更改文档管理，项目开始，风险管理，项目信息系统 / 报告，项目结束和评估，人员管理


    +   - 个人素质：沟通能力；首创精神，务实，热情，激励能力；联系的能力，开放性；灵敏，自我控制，价值鉴赏能力，乐意负责任，人格诚实；解决冲突，辩论文化，公正；解决问题能力，全面思考，公正；忠诚，坚强，乐于助人；领导艺术


    +   - 总体印象：常理（常识），逻辑和系统，语言 / 文字表达能力，综合能力，明晰，技能，知识水平，经历（阅历）'
  - "[PAGE 7]\n\n# # 14.IPMP的考核标准\n\n+   - IPMP D级  \n+     - 仅有笔试  \n+     - 笔试总分为160分\
    \  \n+     - 通过标准为110分\n\n+   - IPMP C级  \n+     - 笔试160分  \n+     - 案例讨论120分\
    \  \n+     - 面试120分  \n+     - 总分为400分  \n+     - 通过标准：  \n+       - 笔试最低100分\
    \  \n+       - 案例讨论+面试最低140分  \n+       - 总分最低为280分"
