    # 7. 项目管理为企业管理带来的经营活力


    +   企业希望通过项目形式来保证：

    +   组织的灵活性；

    +   管理责任的分散；

    +   对复杂问题的集中攻关；

    +   以目标为导向解决问题的过程；

    +   个人及组织发展的机会。'
