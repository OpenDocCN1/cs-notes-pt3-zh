  md: "\n## 天士力项目化管理成果\n\n天士力制药自2002年始，由总经理倡导，引入项目化管理的理念，将日常工作中跨部门的，涉及多人合作的，有确定完成期限的、确定预算的活动按项目进行管理，几年来，共有不同级别的249个项目立项，其中A级54个，B级80个，C级115个，主要包括研究、技改和管理三大类，有119人先后担任过项目经理，其中担任A级项目经理的有21人。\n\
    \n## 7. 项目管理为企业管理带来的经营活力\n\n企业希望通过项目形式来保证：\n\n- 组织的灵活性；\n- 管理责任的分散；\n- 对复杂问题的集中攻关；\n\
    - 以目标为导向解决问题的过程；\n- 个人及组织发展的机会。\n\n## 8. 项目管理给企业组织带来的变革\n\n- 项目管理的矩阵式组织给传统的职能式组织带来了变革的活力\n\
    - 资源的优化整合和高效率发挥是矩阵式组织形式的最大特点\n- 责、权、利的有效结合是矩阵组织的基本出发点\n- 员工成长与企业发展在矩阵组织中得到了最佳的结合\n\
    \n## 9. 项目管理的重要性\n\n- 著名管理顾问Tom Peters指出：在当今纷繁复杂的世界中，项目管理是成功的关键\n- David Cleland认为：战略管理和项目管理在这全球性的市场变化中起着关键的作用\n\
    \n## 10. 未来企业发展的三大支柱\n\n- 战略管理：面向未来，是企业发展的核心\n- 项目管理：面向过程，是企业发展的载体\n  - 项目管理是战略和营销中间的载体和过渡，它既是一种思维方式和工作方法，也是一种先进的文化理念。\n\
    - 营销管理：面向成果，是企业发展的命脉\n\n## 六、案例——AT&T公司的项目管理\n\n### 背景\n\n- 1988年AT&T公司为了应对电话行业业务的发展，重新组合公司，将公司分为19个战略单元，其商务通信系统(BCS)作为其中的一个业务单元，主要是开拓程控交换市场。\n\
    - 当时AT&T意识到传统的管理方式在新技术市场环境中，不再具有竞争力，为了更好地控制企业经营状况，提高企业竞争力，AT&T决定成为行业中项目管理的领先者。\n\
    \n### 已有的观念\n\n- AT&T已经使用了多年的项目管理方法\n- 强调协调管理，通过完成任务中的活动来达到完成项目的目的\n- 协调被看作是一种临时性的工作\n\
    - 对良好的项目参与者奖励是提升其在职能部门的位置，然后脱离项目\n- 这种管理方式有效吗？\n\n### 改革面临的问题\n\n- 项目经理候选人的选拔\n\
    - 教育和培训\n- 职业发展\n- 组织重构\n- 方法的开发\n- 解决方案呢？\n\n### 组织机构\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_67_0.png)\n\
    \n### 项目管理的职业道路\n\n- 项目管理成员：接受6个月的项目管理岗位培训\n- 成本/进度分析工程师：担任6～18个月的项目经理助理，直接向项目经理汇报\n\
    - 现场经理：做6-12个月的现场经理，负责一个大型的现场，向大项目经理汇报\n- 小项目经理：独立负责一个100～300万美元的项目\n- 项目经理：负责一个300～2500万美元的项目\n\
    - 大项目经理：负责一个长达多年的、2500万美元以上的项目\n\n### 项目经理挑选标准\n\n- 人际领导技能\n- 口头及书面沟通能力\n- 全局观念\n\
    - 政治敏感性\n- 乐观精神\n- 敢作敢为\n- 不断进取的精神\n- 统筹规划的能力\n- 责任心和可靠性\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_69_0.png)\n\
    \n### 目前的现状\n\n- 项目管理组织包括总部的行政管理人员及遍布在全球的项目经理群组\n- 负责着超过5亿美元的项目\n- 项目规模从100万美元到上亿美元不等\n\
    - 项目管理方式被认为是最适合该领域的工作方式\n\n### 讨论\n\n结合你所参加的一个典型项目，分析其处在项目实施的哪个阶段及其管理内容，讨论项目管理与一般管理的差异性，分析如何才能使得项目管理走向成功。\n\
    \n## Project Organizations and Teams / 项目组织与项目团队\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_72_0.png)\n\
    \n### 学习目标\n\n- 了解项目组织的类型和特点\n- 了解项目经理的权力和责任\n- 了解项目人力资源管理\n- 了解项目团队的概念以及如何建设和管理项目团队\n\
    - 了解企业项目管理的相关概念\n\n### 项目组织\n\n- 组织的概念(了解)\n- 项目组织特点(理解/掌握)\n- 项目组织形式(理解/掌握)\n\
    - 正式组织与非正式组织的关系(了解)\n- 项目组织的运行机制(了解)\n\n### 组织的概念\n\n> “组织：有意识形成的职务或岗位的结构”\n>\
    \ ——— [美]Harold Koontz\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_75_0.png)\n\
    \n### 为什么需要组织？\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_0.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_1.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_2.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_3.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_4.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_5.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_76_6.png)\n\n摩西的岳父注意到摩西花了太多的时间去监督太多的个人，给他提出类似部门划分的建议，摩西立刻遵从了他岳父的建议。因此他“……从全体以色列人中挑选出有能力的人来，使他们居于百姓之首，千人一长、百人一长、五十人一长，十人一长。他们按这样的原则审理百姓的事情：重大事情提交摩西，而所有的小事情，他们自己就审理了。……”\n\
    \n《出埃及记》第18章\n\n### 组织管理\n\n> “为了使人们能为实现目标而有效地工作，就必须设计和维持一种职务结构(a structure of\
    \ roles)。\n> 这就是组织管理的目的。”\n>\n> —— [美]Harold Koontz\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_79_0.png)\n\
    \n### 组织设计过程的结果\n\n- 组织图\n- 职位说明书\n- 组织手册\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_81_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_81_1.png)\n\n### 组织统一的两面\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_82_0.png)\n\
    \n静态的组织（组织结构）\n\n动态的组织（组织行为）\n\n### 怎样才算一个合理的组织？\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_83_0.png)\n\
    \n- 目标的一致性和管理的统一\n- 有效的管理幅度和层次\n- 责任和权利要对等\n- 要合理分工和密切协作\n- 集权与分权相结合\n- 纪律和秩序\n\
    - 团队精神\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_84_0.png)\n\n### 影响管理幅度和层次的因素有哪些\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_85_0.png)\n\n### 影响管理幅度和层次的因素\n\n-\
    \ 工作能力\n- 工作内容和性质\n- 工作条件\n- 工作环境\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_86_0.png)\n\
    \n### 项目管理组织的特点\n\n一般组织的特点\n\n项目及项目管理的特殊性\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_87_0.png)\n"
