    \n### 1. 项目概况\n\n- 船坞项目地处船厂东侧边区，项目业主是中国船舶工业总公司某船厂，位于新港经济开发区。\n- 项目的提出主要是满足对外开放及外贸发展的要求，建设一座10万吨级修船坞，项目总投资为19832万元。\n\
    - 船坞项目设计任务书批复的内容为：新建10万吨级船坞1座，修船码头、船体加工工场、变电所、空压站等公用设施，新增起重机等修船设备以及其它相关工程。项目建成后的生产纲领为，年修1～10万吨级船舶62艘。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_700_0.png)\n\n### 2. 项目的实施和经营情况\n\n\
    **项目进度**\n\n- 国家计委1990年9月批准项目建议书，1991年10月批准设计任务书\n- 1991年12月中船总公司批准初步设计\n- 1992年6月正式开工，1995年3月建成投产，1997年6月通过国家竣工验收\n\
    - 船坞项目建设工期两年八个月，比计划工期提前约四个月\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_702_0.png)\n\
    \n**工程技术和项目实施**\n\n- 船坞项目的准备和实施基本按国家规定的程序执行，工程设计符合规范要求，技术合理，设计和施工采用了多项较先进的技术。\n\
    - 在项目实施过程中，项目业主狠抓管理，积极推行工程监理，保证了工程质量和工程的顺利实施。\n- 船坞工程竣工验收报告的批复认定，修船坞水工建筑、绿化及大型非标设备安装工程质量优良，其余为合格。\n\
    - 项目的工程设计总体是好的，但设计管理上也存在一些问题如投资概算、预算资料不能及时到位，项目竣工图没有系统整理。\n- 船坞项目实际总投资36351万元，项目固定资产为35492万元，其中国家经营性资金12100万元，建行贷款12200万元，工厂自筹11192万元。\n\
    \n**项目经营**\n\n- 船坞工程建成后修船市场良好，尤其是大型外轮修理市场比可行性研究的分析更为广阔。\n- 1995年4月投产后，全年修船39艘，销售收入7560万元。1996年修船64艘，销售收入14838万元，提前达到预期生产目标。\n\
    - 各项经济指标均超过立项时的原定指标，经营状况良好。\n\n### 3. 主要变化及原因分析\n\n**工程地质勘探问题**\n\n- 船坞项目工程地质勘探问题主要表现在所需填砂的来源变化和土质变化。\n\
    - 初始设计时考虑用到船坞的航道中的砂，但是由于当时未对航道与调度区详细探测，使用的是70年代的资料，导致实际挖填方量多60万立方米，增加近一倍。实际开挖中还遇到少量花岗岩，需要水下炸礁、清礁，导致工程量大幅增加，增加投资1400万元。\n\
    - 工程前期勘察工作不充分是问题产生的主要原因。\n\n**机械设备配置变化**\n\n初始设计时，为了将投资规模控制在2亿元以内，人为地砍掉了实际生产中需要的高空作业车、坞壁作业车等部分机械设备，但试投产实践证明，因设备配套不足导致实际修船效率非常低，难以达到设计生产能力的要求。为此，企业不得不在项目建成后再提出补足这部分设备的投资要求。\n\
    \n按1991年不变价测算，设计时需增加2800万元投资即可。\n\n可以看出，用砍掉必要的建设内容的方法来维持一个人为的投资规模的管理办法是不可取的。\n\
    \n**增加下坞公路**\n\n初始设计时未考虑下坞公路的建设，后经考察，发现下坞公路对于方便作业、降低修船成本有积极作用，因此在施工过程中临时变更设计，增加下坞公路并比船坞主体先行完工。\n\
    \n虽然增加了一些投资，但由于船坞施工方法得以改进，方便了大型施工机械、施工材料等的运输，为船坞的提前竣工创造了条件；在船坞投资后又为各种车辆上下坞底提供了便利条件，利于降低了修船成本。\n\
    \n该项目增设下坞公路是适宜的。\n\n**投资变化**\n\n- 与1991年批准的项目初设总概算19832万元相比，1997年竣工决算的项目总投资为36351万元，增加了16515万元。\n\
    - 扣除投资方向调节税，投资增幅78.7%，主要原因为：\n  - 初步设计的工程概算不佳：主要原因是概算计算偏紧，项目概算少算3200万元，约占总增资额的19%\n\
    \  - 设计变更和工程量变化，增加工程量，增加投资3400万元，约占总增资额的21%\n  - 建设期利息增加约1199万元，约占总增资额的7%\n  -\
    \ 国家、行业和地方收费定额标准增加2500万元，约占总增资额15%\n  - 材料物价上涨增加5400万元，约占总增资额的33%\n\n### 4. 项目效益及对企业效益的影响\n\
    \n**项目财务效益**\n\n根据有无对比原则，船坞项目是该船厂的一个扩建工程，项目的财务效益要计算其增量部分的效益。\n\n| 指标 | 计量单位 |\
