    \  - 计算基础资料可比\n  - 设计深度相同\n  - 经济计算方法相同\n\n- 在投资方案优选、评价过程中，按方案之间的关系可分为：独立、互补、互斥等几类方案。应用最多的是互斥方案的比较。\n\
    \n- 方案比较以动态分析法为主。\n\n- 互斥方案经济比较方法\n  - 动态分析法\n    - 差额投资内部收益率法\n    - 现值比较法\n\
    \    - 年值比较法\n    - 最低价格法\n    - 效益/费用法\n  - 静态分析法\n    - 差额投资收益率法\n    - 差额投资回收期法\n\
    \    - 计算费用法\n\n### 4.2 差额内部收益率法\n\n差额内部收益率就是两个方案的差额净现值为零的内部收益率，差额净现值是指二方案逐年净现金流量差额折现累计值。差额内部收益率（IRR<sub>a</sub>）可由下式求得：\n\
    \nNPV<sub>1</sub>-NPV<sub>2</sub>=0，即NPV<sub>1</sub>=NPV<sub>2</sub>\n\n就是说，二方案的差额内部收益率就是二方案净现值相等时的收益率。\n\
    \n评价标准是：当标准折现率为i0时，若差额内部收益率IRR<sub>a</sub>≥i0，则投资大的方案为优，否则，若IRR<sub>a</sub> <\
    \ i0，则投资小的方案为优。\n\n### 4.3 动态追加投资回收期\n\n- 假设K₁和K₂是投资方案 I 及方案 II 的总投资额，K₁＞K₂；C₁和C₂是方案\
    \ I 和方案 II 的年生产成本，则追加投资回收期为：\n\n\\[\nT_{ad} = \\frac{-\\log[1 - \\frac{k_1 - k_2}{C_2\
    \ - C_1} i_0]}{\\log(1 + i_0)}\n\\]\n\n- 相应的追加投资收益率为E<sub>ad</sub> = 1/T<sub>ad</sub>\n\
    \n- 一般来说，如果动态追加投资回收期比标准投资回收期小或者说动态追加投资收益率较标准投资收益率大，则投资大的方案I是可选的，投资额小的方案 II 是不可选的；否则，投资小的方案较投资大的方案可取。\n\
    \n### 4.4 现值比较法\n\n现值比较法就是把方案经济寿命期内的收益和费用按行业基准收益率或社会折现率折算成单一的现值来比较方案的优劣。现值法使用的条件可分为净现值法、费用现值法。\n\
    \n#### （1）净现值法\n\n\\[\n\\Delta NPV_{I-II} = \\sum_{t=0}^{n} \\left[ (CI - CO)_{II}\
    \ - (CI - CO)_{I} \\right]_t (P/F, i,t)\n\\]\n\n当 \\(\\Delta NPV_{I-II} \\geq\
    \ i_c\\)，投资大的I方案较优，反之，投资小的II方案较优。\n\n#### （2）费用现值比较法\n\n\\[\nPC = \\sum_{t=0}^{n}\
    \ (I + C - S_W - W)_t (P/F, i,t)\n\\]\n\n当两个方案的服务年限相同时，\\(PC_I > PC_{II}\\)，则方案II优于方案I；当两个方案的服务年限不相同时，用研究期法比较两个方案的费用现值，则费用现值小的方案较优。\n"
  mdcn: "\n## 资金时间价值的计算方法\n\n### 终值\n\n复利终值是指一笔或多笔资金按照一定的利率复利计算若干年所得到的本利和，其计算公式为：\n\
    \n### 现值\n\n未来资金的现在值称作现值，其计算公式为：\n\n### 折现、折现率、折现系数\n\n折现是指将来的一笔资金，用一定的利率折算成现在的资金。\n\
    \n折现率是指折现过程所采用的利率。\n\n由于折现和复利是互逆运算，则折现系数是复利终值系数的倒数\n\n(1+i)^-n ---- 折现系数\n\nF\
    \ = P(1+i)^n 或 （F/P,i,n）\n\nP = F(1+i)^-n 或 （P/F,i,n）\n\n- 为了比较不同时期的资金价值，只有把它们折算成现在的价值(例如0年的价值)，才使得不同时期的资金有一个共同的起点，才具有可比性。通常采用现值法。\n\
    \n- 在计算现值时，如果不加说明，一般地，都把每年的资金流入或流出看作是在年末发生，而不是年初发生。\n\n### 年金现值\n\n普通年金现值计算公式：\n\
    \n推导 : \\( F_R = A \\frac{(1+i)^n - 1}{i} \\)\n\n\\( P_R = \\frac{F_R}{(1+i)^n}\
    \ = A \\frac{(1+i)^n - 1}{i(1+i)^n} \\)\n\n\\( P_R = A \\frac{(1+i)^n - 1}{i(1+i)^n}\
    \ \\)\n或： \\( (P/A, i, n) \\)\n\n如果每年发生的款项大小不等，将如何计算？\n\n© 2010 School of Software,\
    \ Dalian University of Technology 45\n\n### 不等额序列的终值、现值与年值\n\n不等额序列的终值：\n\n\\\
    ( F = \\sum_{t=1}^n A_t(1 + i)^{n-t} \\)\n\n不等额序列的现值：\n\n\\( P = \\sum_{t=1}^n\
    \ A_t(1 + i)^{-t} \\)\n\n不等额序列的年值：\n\n\\( A = \\sum_{t=1}^n A_t(1+i)^{-t}(A/P,i,n)\
    \ \\)\n\n### 3.2 净现值法\n\n- 现值（PV）即将来某一笔金的现在价值。\n\n- 净现值法是将整个项目投资过程的现金流按要求的投资收益率(折现率)，折算到时间等于零时，得到现金流的折现累计值（净现值NPV），然后加以分析和评估。\n\
    \n\\[\nNPV = \\sum_{t=0}^n (B_t - C_t) \\frac{1}{(1 + i_0)^t}\n\\]\n\n式中B为收入额\
    \ C为支出额\n\n- NPV指标的评价准则是：\n\n- 当折现率取标准值时，若NPV≥0，则该项目是合理的\n\n- 若NPV<0，则是不经济的。\n\
    \n### 3.3 内部收益率法\n\n- 内部收益率法又称贴现法，就是求出一个内部收益率（IRR），这个内部收益率使项目使用期内现金流量的现值合计等于零，即\n\
    \n- NPV = \\sum_{t=0}^{n} (B_t - C_t) \\frac{1}{(1+i_0)^t} = 0\n\n- 内部收益率的评价准则是：\n\
    \n- 当标准折现率为i0时，若IRR≥i0，则投资项目可以接受\n\n- 若IRR＜i0，项目就是不经济的。\n\n- 对两个投资相等的方案进行比较时，IRR大的方案较IRR小的方案可取。\n\
    \n### 3.4 外部收益率法\n\n外部收益率法与内部收益率法相似，所不同的是要假设投资过程每年的收入都以相当于标准折现率的收益率进行再投资，到了项目有效期末必有一笔本利和，这是投资过程的收入，然而投资过程的每一年都有一笔投资支出，把这些支出按某一利率折算到项目有效期末，若其本利和等于投资收入本利和，则投资过程对该过程投资的折算利率来说是不盈不亏的，这个利率就叫投资过程的外部收益率ERR。\n\
    \n外部收益率的评价准则是：\n\n- 当标准折现率为i0时，若ERR≥i0，则投资项目可以接受\n\n- 若ERR＜i0，项目就是不经济的。\n\n###\
    \ 示例\n\n- 例：假设某企业的总投资为4900万元，投产后每年的产值为990万元，企业年经营成本为450万元。试求其投资回收期？\n\n- 如果不考虑时间因素，投资回收期T可由总投资额和年利润值算出，即\n\
    \n- T=4900/（990-450）≈9年\n\n- 但是企业的投资是由银行贷款的，因此除偿还成本外，每年还要支付利息，年利率为10%。\n\n- 考虑这一因素，则应按动态投资回收期计算，即\n\
    \n- Td=23年\n\n- 不考虑时间因素的投资回收期是9年，可以认为经济效益可取，而考虑了贷款利息之后，投资回收期为23年，从经济效益看可能就是不可取了。\n\
    \n### 3.6 收益/成本比值法\n\n- 项目收益为B,成本为C，则收益/成本比值为 B/C\n\n- 收益/成本比值法的评判准则是：\n  - 当B/C>1时，表明这个投资过程的收益大于成本，因此对于要求的投资收益率有盈余\n\
    \  - 当B/C<1时，则这个投资过程的收益小于成本，对于要求的投资收益率是亏损的\n  - 当B/C=1时，这个投资过程的收益等于成本，对于要求的投资收益率不亏不盈。\n\
    \n### 3.7 现值指数法\n\n- 现值指数法是净现值除以投资额现值所得的比值，它是测定单位投资净现值的尺度，其计算公式为：\n\n- NP=NPV/P\n\
    \n- 式中 NP—现值指数；NPV—净现值；\n\n- P—投资额现值。\n\n- 现值指数反映的是单位投资效果优劣的一个度量指标，它比较适用于多个投资方案进行评价比较。\n\
    \n- 一般来说，现值指数越大，单位投资效果越好；反之，现值指数越小，单位投资效果越差。\n\n## 多方案经济比较\n\n### 4.1 多方案经济比较概念与原则\n\
    \n- 方案经济比较是技术政策、发展战略、规划制定和项目评价的重要内容，在建设项目可行性研究中，各项主要经济与技术决策均应对各种技术上可行的方案进行技术经济对比分析计算，并结合其他因素详细论证、比较的基础上做出抉择。\n\
    \n- 方案经济比较是项目论证与评价的一项核心内容。\n\n- 方案经济比较的原则：\n  - 效益与费用计算口径一致原则\n  - 各个方案间的可比性\n\
    \  - 计算基础资料可比\n  - 设计深度相同\n  - 经济计算方法相同\n\n- 在投资方案优选、评价过程中，按方案之间的关系可分为：独立、互补、互斥等几类方案。应用最多的是互斥方案的比较。\n\
    \n- 方案比较以动态分析法为主。\n\n- 互斥方案经济比较方法\n  - 动态分析法\n    - 差额投资内部收益率法\n    - 现值比较法\n\
    \    - 年值比较法\n    - 最低价格法\n    - 效益/费用法\n  - 静态分析法\n    - 差额投资收益率法\n    - 差额投资回收期法\n\
    \    - 计算费用法\n\n### 4.2 差额内部收益率法\n\n差额内部收益率就是两个方案的差额净现值为零的内部收益率，差额净现值是指二方案逐年净现金流量差额折现累计值。差额内部收益率（IRR<sub>a</sub>）可由下式求得：\n\
    \nNPV<sub>1</sub>-NPV<sub>2</sub>=0，即NPV<sub>1</sub>=NPV<sub>2</sub>\n\n就是说，二方案的差额内部收益率就是二方案净现值相等时的收益率。\n\
    \n评价标准是：当标准折现率为i0时，若差额内部收益率IRR<sub>a</sub>≥i0，则投资大的方案为优，否则，若IRR<sub>a</sub> <\
    \ i0，则投资小的方案为优。\n\n### 4.3 动态追加投资回收期\n\n- 假设K₁和K₂是投资方案 I 及方案 II 的总投资额，K₁＞K₂；C₁和C₂是方案\
    \ I 和方案 II 的年生产成本，则追加投资回收期为：\n\n\\[\nT_{ad} = \\frac{-\\log[1 - \\frac{k_1 - k_2}{C_2\
    \ - C_1} i_0]}{\\log(1 + i_0)}\n\\]\n\n- 相应的追加投资收益率为E<sub>ad</sub> = 1/T<sub>ad</sub>\n\
    \n- 一般来说，如果动态追加投资回收期比标准投资回收期小或者说动态追加投资收益率较标准投资收益率大，则投资大的方案I是可选的，投资额小的方案 II 是不可选的；否则，投资小的方案较投资大的方案可取。\n\
    \n### 4.4 现值比较法\n\n现值比较法就是把方案经济寿命期内的收益和费用按行业基准收益率或社会折现率折算成单一的现值来比较方案的优劣。现值法使用的条件可分为净现值法、费用现值法。\n\
    \n#### （1）净现值法\n\n\\[\n\\Delta NPV_{I-II} = \\sum_{t=0}^{n} \\left[ (CI - CO)_{II}\
    \ - (CI - CO)_{I} \\right]_t (P/F, i,t)\n\\]\n\n当 \\(\\Delta NPV_{I-II} \\geq\
    \ i_c\\)，投资大的I方案较优，反之，投资小的II方案较优。\n\n#### （2）费用现值比较法\n\n\\[\nPC = \\sum_{t=0}^{n}\
