    \n## 第三部分 项目论证与评估\n\n孔祥杰  \nxiangjie.kong@gmail.com  \n大连理工大学软件学院\n\n### 学习目标\n\
    \n- 了解项目论证在投资项目中的地位及应用\n- 掌握项目论证的基本原理\n- 熟悉可行性研究的主要内容\n- 了解项目论证中多方案的比选方法\n- 了解项目评估的主要内容\n\
    \n### 主要内容\n\n- 项目论证的概念\n- 项目论证的原理和方法\n- 项目论证的基本程序\n- 项目论证的内容\n- 项目论证报告书的格式\n\n\
    ### 一、项目论证的概念\n\n- 项目论证的概念\n- 项目论证的作用\n- 项目论证的着力点\n- 项目论证的层次\n- 项目论证的质量、时间和费用\n\
    \n#### 1. 项目论证\n\n项目论证又称可行性研究，是从市场预测开始，通过拟定多个方案进行比较论证，研究项目的规模、工艺、技术方案、原材料及能源供给、设备选型、厂址选择、投资估算、资金筹措和偿还、生产成本等各种要求与制约因素，分析评价项目：\n\
    \n- 建设上的必要性\n- 技术上的可行性\n- 经济上的合理性\n\n最后提出项目可行或不可行的结论。\n\n项目论证是一种综合分析和全面科学评价的技术经济研究活动。\n\
    \n#### 项目论证主要回答的问题\n\n- 项目在技术上是否可行？\n- 项目在经济上是否有生命力？\n- 项目在财务上是否有利可图？\n- 项目能否筹集到全部资金？\n\
    - 项目需要多少资金？\n- 项目需要多长时间能建立起来？\n- 项目需要多少物力、人力资源？\n\n#### 通过项目论证要达到的结论\n\n- 论证项目建设的条件是可靠的\n\
    - 项目采用的技术是先进的\n- 经济上是有较大的利润可图的。\n\n#### 2. 项目论证的作用\n\n- 项目论证报告可作为：\n  - 确定项目实施的依据\n\
    \  - 向银行贷款的依据\n  - 申请建设执照的依据\n  - 与有关单位签订协作的依据\n  - 项目实施基础资料的依据\n  - 项目各项工作安排的依据\n\
    \n#### 3. 项目论证的出发点\n\n- 要站在咨询的立场上\n- 应提出多种替代方案\n- 对各种方案要做经济分析\n- 决定最佳投资时期和投资规模\n\
    - 要提出可能实施的具体措施\n- 要把资源的有效利用放在中心位置。\n\n#### 5. 项目论证的层次\n\n- 机会研究\n- 初步项目论证\n- 辅助研究或功能研究\n\
    - 详细项目论证\n\n#### 5.1 机会研究\n\n机会研究是鉴定投资机会，它寻求的是投资应该用于哪些可能会有发展的部门，这种投资能给企业带来盈利，能给国民经济带来全面的或多方面的好处。\n\
    \n机会研究又分一般机会研究和特定项目机会研究两种。根据当时的条件，决定进行哪种机会研究，或两种机会研究都进行。\n\n#### 投资机会研究\n\n- 投资设想：寻找投资机会、选择机会、从各方面进行分析，提出概略的投资建议\n\
    - 着重点：投资环境分析\n- 目的和作用：鉴别投资方向，选择建设项目，为下一步的研究打下基础\n\n#### 一般机会研究\n\n一般机会研究：这种研究主要是通过国家机关或公共机构进行的，目的是通过研究指明具体的投资建议。有以下三种情况：\n\
    \n- 地区研究\n- 部门研究\n- 以资源为基础的研究\n\n#### 特定项目机会研究\n\n具体项目机会研究：一般投资机会作出最初鉴别之后，即应进行这种研究，并应向潜在的投资者散发投资简介，实际上作这项工作的往往是未来的投资者或企业集团。主要内容为：\n\
    \n- 市场研究\n- 项目意向的外部环境分析\n- 项目承办者优劣势分析\n"
