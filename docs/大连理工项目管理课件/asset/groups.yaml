  md: "\n\n## 10. 财务评价\n\n项目财务评价报表：利润表、现金流量表是用于计算项目盈利能力分析指标的报表。借款还本付息表、资金来源与运用表、资产负债表是用于计算项目清偿能力分析指标的报表。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_298_0.png)\n\n## 10. 财务评价\n\n### 财务评价方法分类\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_300_0.png)\n\n## 11. 国民经济评价及综合分析\n\n\
    ### 国民经济评价\n\n国民经济评价是从国家的角度，评价项目对实现国家经济发展战略目标及对社会福利的实际贡献。它除了对项目的直接经济效果考虑外，还要考虑项目对社会的全面的费用效益状况。与企业经济评价不同，它将工资、利息、税金作为国家收益，它所采用的产品价格为社会价格，采用的贴现率也为社会贴现率。\n\
    \n## 11. 国民经济评价\n\n- 编制国民经济评价报表\n- 如果以项目的财务评价为基础进行国民经济评价时，应从财务效益和费用中剔除“转移支付”部分，编制项目、国内投资国民经济效益费用流量表\n\
    \  - 项目的某些财务收益和支出，从国民经济角度看并没有造成资源的实际增加或减少，而是国民经济内部的“转移支付”，不计做项目的国民经济效益和费用。\n-\
    \ 转移支付的主要内容包括：\n  - 国家和地方政府的税收\n  - 国内银行借款利息\n  - 国家和地方政府给予项目的补贴\n- 计算国民经济评价指标并进行方案比选\n\
    \  - 指标：经济净现值、经济内部收益率\n\n### 1. 国民经济评价\n\n### 指标计算\n\n#### 1) 经济内部收益率\n\n对应指标：\n\
    \n$$\\sum_{t=1}^{n}(B-C)_t(1+EIRR)^{-t}=0$$\n\nEIRR ≥ 社会折现率 i_s，则投资项目可以接受；\n\n\
    - 目前 i_s = 10%\n- i_s 的作用：\n  1. 间接调控宏观投资规模\n  2. 影响项目的选优和方案的比选\n\n#### 2) 经济净现值\n\
    \n$$ENPV=\\sum_{t=1}^{n}(B-C)_t(1+i_s)^{-t}$$\n\nENPV > 0，则投资项目可以接受。\n\n## 12.\
    \ 不确定分析与综合分析\n\n### 综合分析\n\n### 不确定性分析\n\n- 产生不确定性的最普遍原因有：通货膨胀、技术变革、额定生产能力测定失实以及施工期和试车期的长短。\n\
    - 不确定分析分为三个步骤进行：盈亏平衡点分析、敏感性分析和概率分析\n\n### 综合分析\n\n- 政治和国防评估；工业配置评估；发展地区经济或部门经济的评估；提高国家、地区和部门科技水平的评估；减少进口、节约外汇和增加出口、创造外汇的评估；环境保护和生态平衡的评估；节约能源的评估；节约劳动力和提供就业机会的评估；产品质量评估；提高社会福利和人民物质文化生活的评估。\n\
