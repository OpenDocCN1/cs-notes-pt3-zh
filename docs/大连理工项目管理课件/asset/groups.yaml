    # # 投资估算计算的内容和方法


    # ## 基本预备费的内容和估算


    +   - 设计变更及施工过程中可能增加工程量的费用


    基本预备费=(建设工程费+设备工器具购置费+安装工程费+工程建设其他费用)×基本预备费率


    # ## 涨价预备费的内容和估算


    +   - 在建设期内价格上涨可能引起投资增加而预留的费用


    PC = \(\sum_{t=1}^n I_t \left[ \left(1 + f \right)^t - 1 \right]\)


    \( I_t = \) 建设工程费+设备工器具购置费+安装工程费


    # ## 建设期利息估算


    +   - 借款额在各年的年初发生：


    建设期各年应计利息=(上一年借款本息累计+本年借款额)×年利率


    +   - 借款额在各年均衡发生：（常用）


    建设期各年应计利息 = \(\left( \text{上一年借款本息累计} + \frac{1}{2} \times \text{本年借款额} \right)
    \times \text{年利率}\)'
  - "[PAGE 288]\n\n# # 投资估算计算的内容和方法\n\n# ## 流动资金的估算\n\n流动资金是指项目投产运营后，为进行正常生产运营，用于购买原材料、燃料，支付工资及其他经营费用等所必不可少的周转资金。它伴随着固定资产投资而发生的永久性流动资产投资，等于项目投产运营后所需全部流动资产扣除流动负债后的余额。\n\
    \n+   - 流动资金构成：\n+   \n+     流动资产\n+     ├── 流动资金\n+     │   ├── 现金\n+     │ \
    \  ├── 应收帐款\n+     │   └── 存货\n+     └── 流动负债：应付帐款\n\n+   - 流动资金估算方法：\n+     -\
    \ 分项详细估算法\n+     - 扩大指标估算法"
