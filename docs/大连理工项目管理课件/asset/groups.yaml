    ## 项目团队的发展阶段


    - [ ] 组建阶段（TO KNOW AND TO FIND POSITION）

    - [ ] 磨合阶段（QUESTION AND PROBLEM APPEAR）

    - [ ] 正规阶段（TO BE CO-OPERATIVE WITH OTHERS）

    - [ ] 成效阶段（TO BE OF 1+1>2）

    - [ ] 解散阶段（WHERE IS MY NEXT GROUP?）


    ## “团队”成员的基本要求


    例：假设你是一个软件开发项目经理，你希望你的项目组成员能形成一个真正意义上的团队，那么你在招聘项目组成员时有什么要求？


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_161_0.png)


    - 候选人具备项目工作所需要的技能

    - 候选人的需要可以通过参与项目而实现

    - 候选人应具有与原有员工相融的个性

    - 候选人应不反对项目工作的各种约束


    ## 建设团队的工具与方法


    - 团队建设活动

    - 一般管理技术

    - 绩效考评与奖励系统

    - 人员配置

    - 培训


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_163_0.png)


    ## “团队”发展的不同阶段


    - 形成阶段(Forming)

    - 疑问阶段(Storming)

    - 规范阶段(Norming)

    - 执行阶段(Performing)


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_164_0.png)


    ## “团队”发展不同阶段需要的领导风格


    - 形成阶段(Forming)——指导型的领导风格（Directive style）

    - 疑问阶段(Storming)——影响型的领导风格（Selling or Influence style）

    - 规范阶段(Norming)——参与型的领导风格（Participative style）

    - 执行阶段(Performing)——授权型领导风格（Delegative style）


    例：刘光是一个项目经理，他着意于建立项目团队，他认为既然项目团队成员有共同的目标，而且具有项目所需要的技术，关键是愿意为项目作出自己最大的贡献，那么在建立了团队后就要充分授权，让团队成员获得最大的自主权。然而他发现在项目一开始就遇到麻烦，甚至连团队也建立不起来，小组成员各自为政，特别是当项目中间进来新成员时，更是乱上加乱。您说刘先生应该采用什么类型的领导风格？


    ## 怎样才能使“团队”成员全身心投入于项目“团队”？


    - 成员交流经常化，使他们感觉团队的存在

    - 确保参与团队可以实现成员需要

    - 使每个成员知道项目的重要性，每个成员不希望成为“失败者”

    - 所有成员共享团队目标，“一只老鼠坏一锅汤”

    - 使团队中的竞争减低到最小，团队成员只与其他团队的成员竞争


