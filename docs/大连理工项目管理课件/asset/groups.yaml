  - '[PAGE 259]


    # # 5.3风险分析


    +   风险分析又称概率分析，它是使用概率研究预测各种不确定性因素和风险因素的发生对项目评价指标影响的一种定量分析方法。


    +   一般是计算项目净现值的期望值及净现值大于或等于零时的累计概率，累计概率值越大，说明项目承担的风险越小。也可通过模拟法测算项目评价指标（如内部收益率）的概率分析。


    +   在进行风险分析时，先对各参数的值作出概率估计，并以此为基础计算项目的经济效益，最后通过经济效益期望值、标准差、实现概率及离差系数来反映方案的风险和不确定程度。'
  - '[PAGE 260]


    # 5.3 风险分析


    不确定因素使得未来的经济活动的实际结果可能偏离预期目标，与预期的结果发生偏差，有可能使实际结果低于预期的效果，甚至遭受一定的损失。这就是项目投资的风险所在。


    设想状况 ≠ 预测基本方案 ≠ 实施后的结果


    风险大小既与损失发生的可能性（概率）成正比，也与损失的严重性成正比


    | 关系 | 内容 | 不确定分析 | 风险分析 |

    |---|---|---|---|

    | 区别 | 内容 | 各种不确定因素对项目效益的影响进行分析，确定敏感因素和敏感程度 | 确定各敏感因素发生的可能性和对项目效益影响发生的可能性 |

    | 区别 | 方法 | 敏感性分析 | 概率分析 |

    | 区别 | 作用 | 粗略估计项目风险 | 进行详细的风险分析，提出应对风险的措施 |

    | 联系 |  | 敏感性分析中敏感性因素和敏感程度是概率分析中风险因素确定的依据 |  |'
