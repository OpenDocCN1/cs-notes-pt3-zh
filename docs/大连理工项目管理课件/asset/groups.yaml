    - 现值指数法\n\n## 3.1 资金的时间价值\n\n资金的时间价值：  \n资金的价值与时间有密切关系，同等数量的资金由于处于不同的时间而产生的价值差异。\
    \  \n在投资者看来，投资的资金其价值随着时间的推移，按一定的复利率呈几何级数增长。\n\n一般地讲，代表资金时间价值的利息是以百分比，即利率来表示的。在商品经济条件下，利率是由以下三部分组成的：\n\
    \n- 时间价值：即纯粹的时间价值，随着时间的推移而发生的价值增值。\n- 风险价值：现在投入的资金，今后能否确保回收。\n- 通货膨胀：资金会由于通货膨胀而发生贬值。\n\
    \n## 资金的计息方法\n\n### 利息\n\n一般我们把通过银行借贷资金，所付出的或得到的比本金多的那部分增值叫利息，而把资金投入生产或流通领域产生的增值，称为盈利或净收益。\
    \  \n项目论证中利息是广义的概念，泛指投资净收益与贷款利息，当然这是由项目论证的任务决定的。\n\n### 单利计算 F=P(1+ni)\n\nF期末本利之和，P本金，i每一周期的利率，n计息周期数\n\
    \n### 复利计息\n\n[ F = P(1 + i)^n ]\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_218_0.png)\n\
    \n## 资金时间价值的涵义和意义\n\n在项目论证时，对比不同的被选方案，会发现其现金流量存在两种性质的差异：  \n一是现金流量大小的差异，即投入及产出数量上的差异；\
    \  \n二是现金流量时间分布上的差异，即投入及产出发生在不同的时点。\n\n如果只是简单地对比两个方案的现金流量，或将前期费用和后期收益直接作静态对比，是不可能得出正确结论的。\n\
    \n为了保证项目寿命期内不同时点发生的费用和收益具有可比性，必须运用资金时间价值的理论，将不同时点的现金流量折算成相同时点的具有可比价值的现值（或终值），才能科学判断方案优劣。\n\
    \n## 影响资金时间价值的因素\n\n(3) 折现率及利息计算方式。\n\n利息计算方式有单利法和复利法两种：\n\n单利法公式为：\n\n```\nF\
    \ = P(1+i×n)\n```\n\n复利法公式为：\n\n```\nF = P(1+i)^n\n```\n\n式中  \nF —— 期末本利和；  \n\
    P —— 本金；  \ni —— 利率；  \nn —— 期数。\n\n用单利计算的价值少于同期复利计算的价值，项目论证通常采用复利（即利滚利）的计算方法。\n\
    \n"
