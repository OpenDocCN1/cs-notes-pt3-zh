    # # 3.4 冲突来源之四：项目计划


    项目计划几乎是产生冲突的最主要因素。


    项目团队总是认为他们没有足够的时间来规划出一份完善的项目计划，时间的仓促会导致粗略的可行性分析，这不可避免的会导致决策时的争议和冲突。


    > 制定一个完美无缺的计划是每一个项目管理人员梦寐以求的，可是，这的确很难！


    除了时间因素，复杂项目的不确定因素多，许多情况在计划制定阶段是无法准确预计的，所以也导致计划的欠缺。'
  - "[PAGE 843]\n\n# # 3.5 冲突来源之五：成本\n\n在项目过程中，经常会由于某项工作需要多少成本而产生冲突。这种冲突多发生在客户和项目团队之间。\n\
    \n在签订合同时，就要考虑有关物件的涨价和降价事宜。\n\n这个涨价了，要追加费用！否则不能按期完工。\n\n#* (%¥#·! \n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_843_0.png)"
