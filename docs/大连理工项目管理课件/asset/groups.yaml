    # # 4.双代号网络计划


    +   - 这是一种用箭线表示工作、节点表示工作相互关系的网络图方法，这种技术也称为双代号网络AOA

    +   - 双代号网络计划一般仅使用结束到开始的关系表示方法，因此为了表示所有工作之间的逻辑关系往往需要引入虚工作加以表示

    +   - 在我国这种方法应用较多，国内该方面的软件较多。'
