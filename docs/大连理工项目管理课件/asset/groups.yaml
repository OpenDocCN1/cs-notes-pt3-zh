    \n- 1. 各项工作时间的估计\n- 2. 基本的估计假设\n- 3. 工作列表的更新\n\n## 网络图绘制的基本原则\n\n- 正确表达项目各工作间的逻辑关系\n\
    - 不允许出现循环回路\n- 节点之间严禁出现带双向箭头或无箭头的连线\n- 严禁出现无箭头节点或无箭尾节点的箭线\n- 网络图中，只能有一个起始节点和终止节点\n\
