    +   - 项目验收标志着项目的结束

    +   - 通过项目验收，项目当事人可以终止各自的义务与责任

    +   - 是保证合同完成，提高质量水平的最后关口

    +   - 通过项目验收，整理项目资料，保障项目的有效运行'
