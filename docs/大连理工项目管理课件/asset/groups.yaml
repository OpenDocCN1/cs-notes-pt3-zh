    \n## 费用控制的方法与技术\n\n- **费用控制改变系统**：通常是说明费用线被改变的基本步骤，这包括文书工作、跟踪系统及调整系统，费用的改变应该与其它控制系统相协调。\n\
    - **实施的度量**：主要帮助分析各种变化产生的原因，**挣得值分析法**是一种最为常用的分析方法。费用控制的一个重要工作是确定导致误差的原因以及如何弥补、纠正所出现的误差。\n\
    - **附加的计划**：很少有项目能够准确的按照期望的计划执行，不可预见的各种情况要求在项目实施过程中重新对项目的费用作出新的估计和修改。\n- **计算工具**：通常是借助相关的项目管理软件和电子制表软件来跟踪计划费用、实际费用和预测费用改变的影响。\n\
    \n## 项目的费用控制图解\n\n案例A 当天 确定需要 需求 设计 开发 系统测试\n\n案例B 当天 确定需要 需求 设计 开发 系统测试\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_1.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_2.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_3.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_4.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_565_5.png)\n\n## 挣得值方法\n\n挣得值方法是**对项目进度和费用进行综合控制**的一种有效方法。\n\
    \n挣得值方法的三个基本参数\n\n- **计划工作量的预算费用**（BCWS，即 Budgeted Cost for Work Scheduled）。BCWS\
    \ 是指项目实施过程中某阶段计划要求完成的工作量所需的预算工时（或费用）。计算公式为：BCWS = 计划工作量 × 预算定额。BCWS 主要是反映进度计划应当完成的工作量而不是反映应消耗的工时（或费用）。\n\
    \n## 挣得值方法(续1)\n\n### 挣得值方法的三个基本参数\n\n- **已完成工作量的实际费用（ACWP）**，即（Actual Cost for\
    \ Work Performed）。\n\nACWP是指项目实施过程中某阶段实际完成的工作量所消耗的工时（或费用）。ACWP主要是反映项目执行的实际消耗指标。\n\
    \n## 挣得值方法(续2)\n\n### 挣得值方法的三个基本参数\n\n- 已完工作量的预算成本(BCWP)，即 (Budgeted Cost for\
    \ Work Performed)。BCWP是指项目实施过程中某阶段按实际完成工作量及按预算定额计算出来的工时(或费用)，即挣得值(Earned Value)。BCWP的计算公式为：BCWP=已完工作量×预算定额。\n\
    \n## 挣得值方法(续3)\n\n### 挣得值方法的四个评价指标\n\n- **费用偏差**(Cost Variance-CV)：CV是指检查时间BCWP与ACWP之间的差异，计算公式为\
    \ CV=BCWP-ACWP。当CV为负值时表示执行效果不佳，即实际消费人工(或费用)超过预算值即超支。反之当CV为正值时表示实际消耗人工(或费用)低于预算值，表示有节余或效率高。\n\
    \nCV>0 表示完成某工作量时，实际资源消耗低于计划值（如图2.2-3）。\n\nCV<0 表示完成某工作量时，实际资源消耗高于计划值（如图2.2-4）。\n\
    \nCV=0 表示完成某工作量时，实际资源消耗等于计划值。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_570_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_570_1.png)\n\n## 挣得值方法(续4)\n\n### 挣得值方法的四个评价指标\n\
    \n#### 进度偏差(Schedule Variance-SV):\n\nSV是指检查日期BCWP与BCWS之间的差异。其计算公式为SV=BCWP-BCWS。当SV为正值时表示进度提前，SV为负值表示进度延误。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_572_0.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_572_1.png)\n\
    \n- **SV>0** 表示实际完成工作量超过计划预算值，即进度提前\n- **SV<0** 表示实际完成工作量小于计划预算值，即进度拖延\n- **SV=0**\
    \ 表示实际完成工作量等于计划预算值，即符合计划进度\n\n## 挣得值方法(续6)\n\n### 挣得值方法的四个评价指标\n\n#### 进度执行指标\
    \ (Schedule Performed Index-SPI)\n\nSPI 是指项目挣得值与计划值之比，即 SPI = BCWP / BCWS\n\n\
    当 SPI > 1 表示进度提前  \nSPI < 1 表示进度延误  \nSPI = 1 表示实际进度等于计划进度\n\n## 挣得值方法(续7)\n\n\
    BCWS：计划工程预算费用或计划工程投资额  \nBCWP：完成工程预算费用或实现工程投资额  \nACWP：完成工作实际费用或消耗工程投资额  \nBCWP-ACWP=费用偏差CV\
    \  \nBCWP-BCWS=进度偏差SV  \nBCWP/ACWP=CPI 费用业绩指标  \nBCWP/BCWS=SPI 进度业绩指标\n\n## 挣得值方法(续8)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_576_0.png)\n\n| 序号 | 图型 | 三参数关系 | 分析\
    \ | 措施 |\n|---|---|---|---|---|\n| 1 | 曲线图：ACWP > BCWS > BCWP | ACWP > BCWS >\
    \ BCWP<br>SV < 0　CV < 0 | 效率低<br>进度较慢<br>投入超前 | 用工作效率高的人员更换一批工作效率低的人员 |\n| 2 |\
    \ 曲线图：BCWP > BCWS > ACWP | BCWP > BCWS > ACWP<br>SV > 0　CV > 0 | 效率高<br>进度较快<br>投入延后\
    \ | 若偏离不大，维持现状 |\n| 3 | 曲线图：BCWP > ACWP > BCWS | BCWP > ACWP > BCWS<br>SV > 0　CV\
    \ > 0 | 效率较高<br>进度快<br>投入超前 | 抽出部分人员，放慢进度 |\n| 4 | 曲线图：ACWP > BCWP > BCWS | ACWP\
    \ > BCWP > BCWS<br>SV > 0　CV < 0 | 效率较低<br>进度较快<br>投入超前 | 抽出部分人员，增加少量骨干人员 |\n\
    | 5 | 曲线图：BCWS > ACWP > BCWP | BCWS > ACWP > BCWP<br>SV < 0　CV < 0 | 效率较低<br>进度慢<br>投入延后\
    \ | 增加高效人员投入 |\n| 6 | 曲线图：BCWS > BCWP > ACWP | BCWS > BCWP > ACWP<br>SV < 0　CV\
    \ > 0 | 效率较高<br>进度较慢<br>投入延后 | 迅速增加人员投入 |\n\n"
