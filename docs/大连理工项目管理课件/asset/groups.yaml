    \ 项目经理\n- 项目详细进度计划与控制 作业队、实施者\n\n计划内容、计划层次、各层编制的责任人\n多种计划如何合并、汇总、更新及变更控制\n\n##\
    \ 项目三坐标管理的概念\n\n### ——项目目标约束的反映与平衡\n\n### 项目管理的三坐标管理体系\n\n- 项目的进度管理是项目能否按期实现的基本保证\n\
    - 项目的费用管理是对实现项目所需要的经费进行合理有效的管理，使得项目的费用支出与进度相协调\n- 项目的质量管理是使所实施的项目达到设计质量及技术指标的关键，是项目得以顺利完成的基础\n\
    \n### 识别需求\n\n- 需求的产生\n  - 公共需求与公共项目\n  - 个体需求与个体项目\n- 识别需求或需求识别\n  - 起始于需求、问题或机会的产生\n\
    \  - 结束于需求建议书的发布\n  - 清晰的需求是承约商规划与实施项目的基础。\n\n### 需求识别与项目识别\n\n一两个不同角色的问题，通过与培训对象相贴近的项目实例说明更为有效\n\
    \n- 假如您感到居住多年的房屋已显得陈旧，希望将房屋重新装修一番，当装修公司询问您需要什么样的布局、风格时，您如何描述需求呢？\n- 需求的描述：“你看着办吧，只要好就行。”结果会如何呢？\n\
    - 也许你会说：“你怎么装修的如此浮华俗气，你知道我是一个知识分子，房间的布局、风格应充满书香墨气”\n- 责任呢？\n- 责任很明确：一方面是客户没有明确告诉委托人他所希望的目标，另一方面是委托人也没有进行充分调查与研究\n\
    \n## 需求建议书的内容(1)\n\n- 项目工作陈述\n  - 例：房屋装修要说明是对旧房子装修，风格及样式，装修的范围\n- 项目的目标\n  - 交付物、成本、进度\n\
    - 项目目标的规定\n  - 物理参数、操作参数，如盖房要求可能包括总计5000平方米的面积，8间卧室，2间浴室，一间双车道车库，中央空调和一个游泳池。\n\
    \n### 需求建议书的内容(2)\n\n- 客户供应\n  - 项目实施上客户提供的保障，物品供应等\n- 客户的付款方式\n  - 这是承约商最为关心的，如分期付款、一次性付款等\n\
    \  - 例：某房地产开发商在项目启动时支付给建筑公司20%的款项，项目完成50%再支付30%的款项，项目完成竣工后支付剩余50%资金。\n- 项目的进度计划\n\
    \  - 这是客户最为关心的，如装修房子的及时完成可以保证你尽早的享受舒适的居住条件\n\n### 需求建议书的内容(3)\n\n- 对交付物的评价标准\n\
    \  - 项目实施的最终标准是客户满意，否则承约商很难获得所期望的利润\n- 有关承约商投标的事项\n  - 应规定建议书的格式及投标方案的内容\n- 投标方案的评审标准\n\
    \  - 可能包括：承约商背景及经历、技术方案、项目进度、项目成本\n\n## 东方公司办公楼建设项目需求建议书\n\n有关单位：\n\n- 东方公司向具有建设部建筑一级认证企业的承约商征求办公大楼建设，项目目标是：建设1234平方米高3层框架结构的办公大楼。\n\
    \n### 1、工作表述\n\n- 承约商将执行下面任务：\n  - 主体框架工程建设、建筑设备安装、装修工程。\n\n### 2、要求\n\n- 承约商应根据国家标准建设，提供施工计划和施工方案。\n\
    \n### 3、交付物\n\n- 符合国家建设标准的办公大楼。\n\n### 4、东方公司提供的条款\n\n- 东方公司将向承约商提供办公大楼施工图纸。\n\
    \n### 5、需求信息\n\n- 承约商在执行工作之前，必须获得东方公司对施工方案的认可。\n\n### 10、申请书内容\n\n承约商的申请书至少必须包括如下内容：\n\
    \n- （1）方法。承约商能清晰地理解需求建议书，理解什么是被期望达到的要求。而且要详细描述承约商领导项目的方法，要求对每个任务的详细描述，任务如何完成的详细描述\n\
    - （2）交付物。承约商要提供交付物的详细描述\n- （3）进度计划。列出甘特图或网络图表，列出每月要执行的详细任务的时间表，以便在要求的项目完成日期内能够完成项目\n\
    - （4）经验。叙述一下承约商最近已经执行的项目，包括客户姓名、地址和电话号码\n- （5）人事安排。列出将被指定为项目主要负责人的姓名和详细简历，以及他们在类似项目中的成绩\n\
    - （6）成本。必须说明总成本并提供一份项目的预算清单。\n\n### 11、申请书评价标准\n\n- 1. 方案（30%）。承约商提出建设方案\n- 2.\
    \ 经验（30%）。被指定执行此项目的承约商和主要负责人的执行类似项目的经验\n- 3. 成本（30%）。承约商申请书中所列的固定成本\n- 4. 进度计划（10%）。为了要在项目完成之日期内或在此日期之前完成项目，承约商应提供详细的施工计划。\n\
    \n### 项目识别\n\n- 所谓项目识别就是面对客户已识别的需求，承约商从备选的项目方案中选出一种可能的项目方案来满足这种需求。\n- 项目识别与需求识别的不同：\n\
    \  - 需求识别是客户的一种行为\n  - 项目识别是承约商的行为。\n\n## 识别需求与项目识别案例讨论\n\n- 某居民区的张先生夫妇，过去一直在公共浴室洗澡，但自从喜添了小宝宝后也增加了新的忧愁：必须保证宝宝的清洁卫生，因此家里添置一套洗浴装置迫在眉睫！\n\
    - 本项目的**识别需求**和**项目识别**是什么呢？\n\n### 识别需求：\n\n- 从可能的方案有三个，在煤气管道上安装热水器、安装电热水器、安装太阳能热水器等\n\
    - 经过调查、比较及分析决定选用太阳能热水器，便可准备需求建议书。\n\n### 项目识别：\n\n- 承约商在接到需求建议书之后，虽然客户表明是安装一套太阳能热水器，但其类型、性能等差异很大\n\
    - 承约商所要作的工作就是根据具体情况确定满足客户需求的项目\n- 客户的成本预算能否足以完成满足需求的项目\n- 客户已识别的需求是否经济可行，这一点应以客户为中心\n\
    \n### 项目识别与需求识别的不同：\n\n- 需求识别是客户的一种行为\n- 项目识别是承约商的行为\n"
