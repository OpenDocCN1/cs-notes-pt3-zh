    \ 特性：实体所特有的性质，反映了实体满足需要的能力\n\n## 项目的质量\n\n### 质量的类型：\n\n- 质量，通常指产品的质量，广义的还包括工作的质量\n\
    \  - **产品质量**是指产品的使用价值及其属性；\n  - 而**工作质量**则是产品质量的保证，它反映了与产品质量直接有关的工作对产品质量的保证程度。\n\
    \n## 项目的质量\n\n- 项目的质量\n  - 从项目作为一次性的活动来看，项目质量体现在由WBS反映出的项目范围内所有的阶段、子项目、项目工作单元的质量所构成，也即**项目的工作质量**；\n\
    \  - 从项目作为一项最终产品来看，项目质量体现在其性能或者使用价值上，也即**项目的产品质量**。\n\n- 项目是应业主的要求进行的，不同的业主有着不同的质量要求，其意图已反映在项目合同中。因此，**项目合同是进行项目质量管理的主要依据。**\n\
    \n"
