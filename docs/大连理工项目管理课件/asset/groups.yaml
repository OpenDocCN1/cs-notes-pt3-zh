    # # 1.5 项目验收的结果


    +   项目验收完成后，参加项目验收的项目班子和接受方人员应在事先准备好的文件上签字，表示接受方已正式认可并验收全部或阶段性成果。


    +   一般情况下，这种认可和验收可以附有条件。如软件开发项目的移交和验收时，可规定以后发现软件有问题时仍然可以找该软件项目开发人员解决。'
