  mdcn: "\n\n## 项目范围变更控制\n\n- 变是绝对的，不变是相对的；\n- 需要考虑的问题\n\n- 分析和确定项目范围变更的因素和环境条件\n\
    - 对可能的影响因素和环境条件进行控制管理\n- 变更要求的合理性和可行性分析\n- 风险和影响程度如何？\n- 扩大发生变更带来的有利影响，控制和减少不利影响。\n\
    \n## 项目范围变更控制过程\n\n项目范围基准\n\n变更请求\n\n分析与评价\n\n批准/拒绝\n\n处理\n\n执行\n\n变更\n\n填写变更表单/登记\n\
    \n工期、成本、风险、合同\n\n变更控制委员会\n\n更新登记、计划、进度安排、预算修改、范围与合同\n\n向项目干系人通报\n\n## 项目范围变更控制举例\n\
    \n| 指标 | 基准计划 | 范围变更 | 批准的变更 | 新的基准 |\n|---|---|---|---|---|\n| 工期 | 6个月 | 1）增加A工作包<br>2）减少B包内容\
    \ | 1）+2个月<br>2）-1个月 | 7个月 |\n| 成本 | 800万元 | 1）增加A工作包<br>2）减少B包内容 | 1）+250万元<br>2）-100万元\
    \ | 950万元 |\n\n对风险、采购、资源有多大影响？\n\n## 4. 工作分解结构（WBS）的制定\n\n- WBS（Work Breakdown\
    \ Structure）主要是将一个项目分解成易于管理的一个部分或几个组目，以便确保按时完成项目工作。通过将项目分解为若干个层次，逐步明确项目范围内各项工作的内容，并按照项目发展的需要进行调整和细化。WBS的层次结构应清晰，可以具体作为组织项目实施的工作依据。\n\
    \n- WBS通常是一种面向“成果”的“树”，其最底层是细化后的“可交付成果”，该树组织确定了项目的整个范围。但WBS的形式并不限于“树”状，还有多种形式。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_405_0.png)\n\n## 项目工作分解的方法之一\n\n- 模板法\n\
    \  - 行业标准\n  - 咨询公司的商业性模板库\n  - 企业标准与惯例（知识经验库）\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_406_0.png)\n\
    \n## 项目工作分解的方法之二\n\n- 分解技术\n  - 识别主要的项目要素或项目提交成果\n  - 项目要素的构成分解，以便项目绩效度量和责任分配\n\
    \  - 检查分解结果的正确性\n    - 必要和充分性检查\n    - 完整和模糊性检查\n    - 可计划和控制性检查（分配工期、预算、资源和责任人）\n\
    \n## 项目工作分解的步骤\n\n### 一步骤一：识别项目的主要组成部分\n\n- 问题：要实现项目目标需要完成那些主要工作？\n\n- 技巧：可以按照项目生命周期的阶段、项目的主要提交成果、产品、系统或者专业。\n\
    \n- 层次：在WBS中处于第二层上，并在结构图形上标示出来。\n\n### 步骤二：判断\n\n在已经分解的基础上，判断能否快速方便地估算各个组成部分各自所需的费用和时间，以及责任分配的可能性与合理性。\n\
    \n- 如果不可以，进入第三个步骤；\n\n（一般情况下，在项目提交成果或阶段这么粗的层次上是很难进行时间或预算估算的，必须进行更细的分解。）\n\n- 如果可以，则进入第四个步骤；\n\
    \n## 项目工作分解的步骤\n——步骤四：检查工作\n\n1. 如果不进行这一层次的工作，上一层的各项工作能否完成？\n2. 完成了该层的所有工作，上一层次的工作就一定能完成吗？\n\
    3. 根据检查，对该当前层的工作进行增加、删除或者修改，或者对上层工作进行适当的整理；\n4. 本层各项工作的内容、范围和性质是否都已经明确？如果回答肯定，则需要写出了相应的范围说明书，该说明书这就是工作包的范围说明书；\n\
    5. 对“4”的否定，进行必要的修改和补充。\n\n## 项目工作分解注意要点\n\n- 将项目的**产品结构划分**、项目的**阶段划分**以及项目**组织的责任划分**有机地结合起来；\n\
    - 最底层的工作包应当便于完整无缺地分派给项目内外的组织或个人，所以各个工作包之间必须有明确的界面。**界面清楚还有利于减少实施过程中的协调工作量**；\n\
    - 最底层的工作包应该非常具体，以便承担工作的组织或个人都能明确自己的任务、努力的目标以及承担的责任。越具体越利于监督和业绩考核；\n- WBS的每个分支并不一定需要分解到相同的层次；\n\
    - 逐层分解项目或其主要可交付成果的过程，实际上就是分派角色和职责的过程。\n\n## 决定WBS详细程度和层次多少的因素\n\n- 为完成项目工作任务而分配给每个小组或个人的责任和这些责任者的能力；\n\
    \  - 责任能力越强，层次可以越少；反之就需要分解得细些，层次多一些；\n\n- 在项目运行期间管理和控制项目预算、监控和收集成本数据的水平；\n  -\
    \ 控制能力（水平）越高，层次可以越少；反之，就需要分解得细些，层次多一些，因为越细，项目就越容易管理，因而要求的能力就相对低一些。\n\n## WBS工作编码\n\
    \n- 由高层向下层用多位码编排，要求每项工作有唯一的编码\n  - 1000\n    - 1100\n      - 1110\n        - 1111\n\
    \        - 1112\n        - 1113\n      - 1120\n        - 1121\n        - 1122\n\
    \        - 1123\n    - 1200\n\n## 编制WBS的几种思路\n\n- 基于功能（系统）的分解结构\n\n- 基于成果（系统）的分解结构\n\
    \n- 基于工作过程的分解结构\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_416_0.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_416_1.png)\n\
