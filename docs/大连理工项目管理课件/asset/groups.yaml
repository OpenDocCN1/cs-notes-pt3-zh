    \ 6.87 | 9.48 |\n\n可以看出，各因素不同程度上影响内部收益率和投资回收期，其中销售收入的提高和降低最为敏感。\n\n### b. 盈亏平衡分析\n\
    \n① 以生产能力利用率表示的盈亏平衡点（BEP），其计算公式为：\n\nBEP=年固定总成本/年销售盈利×100%\n=5587/（35420-18228-2689）×100%\n\
    =39%\n\n（年销售盈利=年销售收入-年可变总成本-年销售税金及附加）\n\n② 计算结果表明，该项目只要达到设计能力的39%，也就是年产量达到0.90万吨，企业就可以保本，由此可见，该项目风险较小。\n\
