  md: "\n\n## 2.4 信息特性详解（4）\n\n可加工性\n\n信息可以进行形式上的转换\n\n- 加工分类\n  - I类\n  - II类\n\n\
    I类\n\n文字 ⇄ 语言  \nA语言 ⇄ B语言  \n一种载体 ⇄ 另一载体\n\nII类\n\n数学统计的方法加工处理得出的新的有用信息。\n\n\
    ## 2.5 信息特性详解（5）\n\n### 可共享性\n\n信息可以被不同的使用者所加以利用，而信息本身没有损耗\n\n项目相关方1  \n项目相关方2\
    \  \n信息共享  \n项目相关方N  \n项目组成员A  \n项目组成员B  \n项目组成员N\n\n信息共享促进了成员之间的协作！\n\n与干系人(项目利益相关方或项目组内成员)共享项目信息正变得越来越普遍；当项目信息共享时，就促进了干系人的协作。\n\
    \n信息共享的建议：避免自己和自己所在的环境信息闭塞\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_737_0.png)\n\
    \n企业等组织传统管理模式最大的弊端及特征就是：组织内部一般是按部门而不是按流程设定职责，于是彼此独立的各个部门就成了一个个**信息孤岛**。国家制定的以信息化带动传统产业的提升战略，除了流程的改进，另一个作用就是企业内的信息流通和共享。\n\
    \n但信息共享是有原则的，不是什么信息都要共享，不能走极端。\n\n## 2.6 信息特性详解（6）\n\n- 时效性\n\n如何有效利用信息\n\n- 价值性\n\
    \n信息就是资源，可以创造价值。许多情况下靠自己发掘！\n\n- 保密性\n\n信息=情报  \n军事机密、商业机密  \n失密和窃密的分析\n\n- 案例\n\
    \n- 案例\n\n- 举例\n\n- 案例\n\n## 2.8 目前的信息环境\n\n信息量爆炸性产生，以几何级数增长；传播方式增多，跨越了距离和时空。\n\
    \n环境特征：\n\n> “人类社会已经进入信息社会”\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_740_0.png)\n\
    \n## 2.9 信息的负面效应\n\n### 信息疲惫：\n\n人对信息大量涌来的一种穷于应付\n\n不要被信息海洋所淹没；\n\n除了以往的：信息搜集能力和敏感度、分析判断能力，在信息泛滥的环境下要求驾驭信息的能力，不能作信息的奴隶。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_741_0.png)\n\n## 3. 管理信息的含义\n\n管理信息是指在管理活动中，经过加工处理后，对管理决策和管理控制具有影响的数据。它能够反映组织活动的现状、发展趋势以及各项管理工作的实际情况，为管理者进行决策、计划、组织、领导和控制提供依据。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_742_0.png)\n\n## 3.1 对管理信息的一般要求\n\n\
    - 准确性\n\n虚假信息往往导致组织决策者决策失误！  \n不清晰的信息致使工作偏离了目标方向！\n\n- 及时性\n\n信息如果延误：失去支持决策作用！\
    \  \n信息如果迟误：影响工作进展及正确性！\n\n- 可靠性\n\n信息的可靠性与精确度和完整性有关；  \n完整性：信息收集加工全面、系统、连续性\n\
    \n- 适用性\n\n不同部门对信息的种类范围内容要求不同  \n信息的收集加工一定要有针对性，计划性\n\n## 3.2 管理信息的分类\n\n- 信息来源\n\
    \  - 内生信息、外生信息\n- 组织层次\n  - 计划信息、控制信息、作业信息\n- 产生时间\n  - 历史信息、现时信息、未来信息\n- 信息稳定性\n\
    \  - 固定信息、流动信息\n\n> 为了有效地对信息加以分析和利用，就要对信息进行科学的分类\n\n> 如何衡量分类的科学性？\n\n### 按产生时间划分\n\
    \n#### 历史信息\n\n已经发生的信息，一般已经使用过，仍具有过程记录、检查、借鉴和启发价值。\n\n以资料文档形式存在。\n\n#### 现在信息\n\
    \n反映组织当前活动情况和外部环境特征的信息。\n\n该类信息的时效性很强，是组织信息工作的重点，对于指导和控制活动具有非常重要的作用。\n\n#### 未来信息\n\
    \n在掌握前两种信息的基础上，科学预测和判断组织未来活动和环境的信息。\n\n这类信息对于高层主管人员的及时决策、尽早做出相应的准备有重大的意义。\n\n\
    ### 按组织层次划分\n\n#### 计划信息\n\n组织目标、战略、政策、规划、资源配置等信息\n\n如：经济形势资料；市场竞争对手情况；国家政策/法律/法规颁布及变更。\n\
    \n#### 控制信息\n\n组织的中层管理部门为了实现组织的经营目标而对生产经营各环节进行监控的信息。\n\n控制信息主要来自内部，要求比较具体和详细。\n\
    \n#### 作业信息\n\n组织日常活动的信息，用以保证基层管理部门切实地完成具体作业。\n\n基层主管人员是该类信息的主要使用者，其信息要求明确、具体、详细。\n\
    \n### 按信息稳定性划分\n\n#### 固定信息\n\n组织内相对稳定、可以供管理工作重复使用。\n\n以项目为例：固定信息有定额标准信息、计划信息、合同信息等。对于企业而言，固定信息约占企业管理系统中总信息流量的75%。\n\
    \n#### 流动信息\n\n又称 作业统计信息；它是由组织的劳动活动所产生，反映活动进程实际状况的信息，并随着活动而不断变化更新。\n\n例如：企业的库存量、产品的生产进度、企业的设备损耗情况等。这类信息一般只有一次性实用价值，所以时效性强。\n\
    \n## 4. 项目管理信息\n\n### 项目管理中信息的定义：\n\n经过加工处理能对人们各种具体活动有参考价值的数据资料。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_749_0.png)\n\
    \n### 项目管理信息\n\n另一种说法  \n数据和信息\n\n一个常见的错误观念是数据等于信息，这是一个很大的错误。数据只是原材料，不经过提炼它什么都不是。经过提炼，把数据构建成有意识的元素，分析其成分，将数据和已存在的标准比较，这样，数据就成为了信息。\n\
    \n> 意义  \n> 我们对任何“信息”都要先进行分析和判断，不能人云亦云，或被表象所迷惑。\n\n### 4.1 讨论\n\n请各位按照下列要求，简单将各方面需要的信息用框图画下来。\n\
    \n某产品/项目投资上线可行性需要那些信息的分析\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_751_0.png)\n\
    \n### 某产品/项目投资上线可行性分析\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_752_0.png)\n\
    \n### 4.2 项目信息管理的基本理念\n\n确保项目的所有利益相关方(包括项目组织内部)都可以定期获得相应的信息，以便更为有效地对项目工作实施控制。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_753_0.png)\n\n### 4.3 项目信息管理的缘由\n\n\
    一般来讲，对于周期短的小型项目，不必在项目管理的业务流程中单独构成一个独立的项目信息管理环节。但对于较大型项目则须导入项目管理信息系统，即需对项目实施信息化管理。\n\
    \n### 项目信息的形式\n\n- 个别谈话\n  - 分析工作\n  - 检验工作\n  - 个人建议\n  - 帮助\n- 书面材料\n  - 信件\n\
    \  - 谈话记录\n  - 工作条例\n  - 进展报告\n- 集体口头形式\n  - 会议\n  - 人员集体讨论\n  - 培训班\n  - 讲座\n\
    - 技术形式\n  - 录音\n  - 电话\n  - 广播\n  - 网络\n\n### 4.4 项目信息的来源\n\n- 记录\n- 抽样调查\n- 文件报告\n\
    - 业务会议\n- 直接观测\n- 个人交谈\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_756_0.png)\n\
    \n### 4.5 项目信息流路线\n\n- 由上而下的信息\n- 由下而上的信息\n- 横向信息\n- 与顾问室的信息关系\n\n中大型或重要的项目，在项目组织系统中一般设立顾问室。\
    \  \n其目的是为项目经理决策做准备工作或提供分析建议。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_757_0.png)\n\
    \n### 项目管理信息流向及分类\n\n由上而下\n\n项目经理\n\n子项目A  \n负责人\n\n横向\n\n子项目B  \n负责人\n\n成员A \
    \ \n成员B  \n成员C  \n成员D\n\n顾问室\n\n由下而上\n\n### 项目管理信息流向及分类\n\n- 自上而下的项目信息：\n  管理目标、命令、工作条例、办法、规定、业务指导意见等；\n\
    \n- 自下而上的项目信息：\n  目标的进度、成本质量、安全、消耗、效率情况等；\n\n- 横向流动的项目信息：\n  同一层工作部门及人员之间的交流信息，这是普遍的薄弱环节，应是项目管理重点建设的；\n\
    \n- 以顾问室或经理办公室等综合部门为中心的项目信息\n\n- 项目管理班子与环境之间进行流动的项目信息\n\n"
