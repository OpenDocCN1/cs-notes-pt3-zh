    \  |\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_525_0.png)\n\n## 项目进度安排的成果——细节说明和进度管理计划\n\
    \n- 细节说明：对于项目进度的支持细节至少应该说明有关的假设和约束，此外还应包括各种应用方面的详细说明，例如：\n  - 对于建筑项目多数情况下应该包括各种资源的直方图、费用流预测、以及订货和交货计划。\n\
    \  - 对于电子项目：通常主要包括资源直方图。\n- 进度管理计划：主要说明何种进度变化应给予处理，可以是正式的或非正式的、详细的说明或基本的框架，它是总项目计划的辅助说明。\n\
    \n## 项目的费用管理\n\n项目的费用管理主要是在批准的预算条件下确保项目的优质按期完成，其主要包括：\n\n- 资源计划\n- 费用估计\n- 费用安排\n\
    - 费用控制\n\n### 1. 资源计划\n\n资源计划涉及到决定什么样的资源（人、设备、材料）以及多少资源将用于项目的每一项工作的执行过程之中，因此它必然是与费用估计相对应起来的。\n\
    \n### ①资源计划所依赖的数据\n\n- 工作分解结构WBS\n- 项目工作进度计划\n- 历史信息：历史信息记录了先前类似工作使用资源的需求情况，这些资料一般是可以获得的。\n\
    - 范围陈述：范围陈述包括了项目工作的说明和项目目标，这些应该在项目资源计划的编制过程中应特别考虑。\n- 资源安排描述：什么资源是可能获得的，是项目资源计划所必须掌握的，特别是数量描述和资源水平对于资源安排描述是特别重要的。\n\
    - 组织策略：在资源计划的过程中还必须考虑人事组织、所需设备的租赁和购买策略。\n\n### ③资源计划的工具——资源矩阵\n\n| 任务    | 方法学家\
