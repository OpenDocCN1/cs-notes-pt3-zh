    # # 高级管理人才需要怎样的必备素质


    +   新的职业结构对高级人才的素质要求愈来愈高，未来的高级知识人才既不是单纯的技术专家，也不是精通领导艺术的专家。他们不仅要胜任卓有成效的管理工作，还要有力地领导自己的团队在同心协力完成既定目标的同时，时刻准备迎接新的挑战。'
  - '[PAGE 123]


    敏锐的洞察能力。国际交流更加频繁，竞争更加激烈，高级人才能否辨别真伪、分清得失，能否运筹帷幄、审时度势，能否居安思危、见微知著，能否沉着应对、趋利避害，很大程度上决定着我们能否掌握企业发展的主动权，有效地抵御风险。'
  - '[PAGE 124]


    +   灵敏的应变能力。 新形势下，对领导方式和作风有新要求，能否在短时间在观念、作风上转变和适应是对其应变能力的巨大考验。


    +   丰富的想像能力。 它是必需的技能。 富于想像力有利于收集并获得广泛、大量的信息和知识； 想象力可以开拓思维方法及观察的视野。 想象力在某种程度上可以带动创造性和创新能力'
  - '[PAGE 125]


    +   出色的指挥能力。越来越多的实践表明：企业需要的是能控制局面的领军人物——能够像装甲坦克一般用低沉的音调镇住整个会议室，不论有多大困难和障碍都能达到目的的人。成功的战地指挥家。'
  - '[PAGE 126]


    +   感染力和凝聚力。 能用言传身教或已有的业绩，在领导层或员工中不断增加感染力、凝聚力的人。这种人在组织决策中，不是把信任建立在地位所带来的权威之上，而是靠自身的感染力来影响大家，坚定人们的信念。


    +   培养员工的能力。努力培养员工的成长，不只是让员工感受到上司的器重，更重要的是在无形中提高企业的内在价值，实现个人、集体同升共荣的价值观'
  - '[PAGE 127]


    +   说服与交流能力。公司间的交往要求高级人才能应付越来越多的人际关系并具有愈来愈高的游说能力。在节奏本来就很快的工作环境中，内部的交流显得更加重要，尽管惜时如金，但没有交流就缺乏动力和发展的源泉'
  - '[PAGE 128]


    +   尊重别人的能力。在组织工作中不能只靠行政命令去强制人们的意志，而要努力了解别人并学会尊重别人的感情。选择人们普遍接受和认可的方式，让一颗博大的仁爱之心赢得众人的支持。'
