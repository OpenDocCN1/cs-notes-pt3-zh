  - "[PAGE 648]\n\n# 2. 项目质量验收\n\n+   - 项目质量验收是依据质量计划中在  \n+     - 范围划分  \n+     -\
    \ 指标要求  \n+     - 采购合同\n\n中的质量条款，遵循相关的质量检验评定标准，对项目的质量进行质量认可评定和办理验收交接手续的过程。质量验收是控制项目最终质量的重要手段，也是项目验收的重要内容。"
  - '[PAGE 649]


    # # 2.1 项目质量验收的范围


    +   项目概念阶段的质量验收：主要是检查项目进行可行性研究和机会研究时是否收集到足够多的和准确的信息；使用的方法是否合理；项目评估是否科学；评估的内容是否全面；是否考虑了项目的进度、成本与质量三者之间的制约关系；对客户的需求是否有科学、可行、量化的描述；对项目的质量目标与要求是否做出整体性、原则性的规定和决策。


    +   项目规划阶段的质量验收：主要检验设计文件的质量，同时项目的全部质量标准及验收依据也是在规划设计阶段完成，因此，规划阶段的质量验收也是对质量验收评定标准与依据的合理性、完备性和可操作性的检验。'
  - '[PAGE 650]


    # # 2.1 项目质量验收的范围


    +   项目实施阶段的质量验收：项目实施阶段是项目质量产生的全部过程。实施阶段的质量验收要根据范围规划、工作分解和质量规划对每一个工序进行单个的评定和验收，然后根据各单个工序质量验收结果(如可以把单项工序的质量等级分成不合格，合格，良好，优等四级)进行汇总统计，形成上级工序的质量结果(合格率或优良率)，以此类推，最终形成全部项目的质量验收结果。


    +   项目收尾阶段的质量验收：对于大型、复杂项目的质量验收，可采用对项目实施阶段中每个工序的质量验收结果进行汇总、统计、澄清，得出项目最终的、整体的质量验收结果；对于比较简单的项目和特殊要求的项目（如系统软件等），收尾阶段的质量验收要依据验收标准，彻底进行检验，以保证项目质量。'
  - '[PAGE 651]


    # ## 2.2 项目质量验收的标准与依据


    +   在项目概念阶段，必须依据项目质量目标决策，在平衡项目进度、造价与质量三者之间制约关系的基础上对项目的质量目标与要求作出总体性、原则性的规定和决策。


    +   在项目规划阶段，必须根据概念阶段决策的质量目标进行分解，在相应的设计文件是否指出达到质量目标的途径和方法，同时指明项目竣工验收时质量验收评定的范围、标准与依据，质量事故的处理程序和奖惩措施等。


    +   在项目实施阶段，质量控制关键是过程控制，质量保证与控制的过程就是根据项目规划阶段规定的质量验收范围和评定标准、依据，在下一个工序开始之前，对每一个刚完成的工序进行及时的质量检验和记录，并分发给质量保证体系中的所有单位。


    +   在项目收尾阶段，依据项目规划阶段制定的项目竣工质量验收评定的范围、标准与依据进行验收。'
  - '[PAGE 652]


    # 2.3 项目质量验收的结果


    +   - 质量验收的结果是产生质量验收评定报告和项目技术资料。

    +   - 项目最终质量报告的质量等级一般分“合格”和“优良”两级，凡不合格的项目不予验收。

    +   - 项目每一个工序的质量检验评定报告经汇总成相应的技术资料，是项目资料的重要组成内容。'
  - '[PAGE 653]


    # 3. 项目文件验收


    +   项目文件（资料）是项目竣工验收和质量保证的重要依据之一，项目资料也是项目交接、维护和后评价的重要原始凭证，在项目验收工作中起着十分重要的作用，因此，项目资料验收是项目竣工验收前提条件，只有项目资料验收合格，才能开始项目竣工验收。'
  - '[PAGE 654]


