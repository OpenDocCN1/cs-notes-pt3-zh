  mdcn: "\n\n## 需求建议书与项目建议书\n\n### --两种不同的过程和结果\n\n- 需求建议书对应于招标书，反映客户需求识别的结果。\n- 项目建议书对应于投标书，反映承约商如何去保证项目的实施，是承约商项目识别的结果。\n\
    \n## 项目投标\n\n- 客户向承约商发送需求建议书的过程就是项目的招标过程，根据客户的需求，承约商进行项目构思、可行性研究，最后向客户投送项目建议书的过程就是项目的投标。\n\
    \n## 项目投标过程(1)\n\n### 1）项目构思\n\n- 根据客户需求提出满足客户需求的各种实施方案\n- 主要的方法是头脑风暴法，即让参与项目的成员提出尽可能多的想法或方案\n\
    \n### 2）项目筛选\n\n- 从可供实施的备选方案中选择最佳的方案来满足客户的需求\n- 选择在现实中可行的、投入少、收益大的项目方案\n- 评价的标准主要有：满足客户的程度、时间和成本、实施的可行性、风险的大小\n\
    \n## 项目投标过程(2)\n\n### 3) 项目的投标\n\n- 与招标对应\n- 公开招标\n- 邀请招标\n- 混合招标\n- 协商议标\n- 投标决策\n\
    - 分析会有哪些承约商参加投标，各自的优势，同客户的关系\n- 主要考虑的因素自身的技术能力、项目风险、承约商的资源配置能力、其他因素等\n- 投标申请书\n\
    \n## 投标申请书\n\n- 一份申请书一般包括3个部分，技术的，管理的，成本的，如果一份较复杂的申请书，这三个部分可能是3个独立的册子\n- 技术部分目的是让客户认识到：承约商理解需求或问题，并且能够提供风险最低且收益最大的解决方案\n\
    - 管理部分的目的上使客户确信，承约商能够做好项目所提出的工作，并且收到预期结果\n- 成本部分的目的是使客户确信，承约商申请项目所提出的价格是现实的、合理的\n\
    \n## 二、项目计划的制定\n\n1. 第一步：项目描述\n2. 第二步：项目分解\n3. 第三步：任务描述\n4. 第四步：责任矩阵安排\n5. 第五步：工作关系确定\n\
    6. 第六步：网络图绘制\n7. 第七步：进度安排\n\n## 成功的项目计划与控制工作流程\n\n### 目标确定\n\n### 成果交付\n\n公司满意\
    \  \n老板满意  \n业主满意  \n员工满意  \n自己满意\n\n项目目标确定\n\n网络计划\n\n甘特图计划\n\n人力资源配置\n\n费用分解\n\
    \n费用预算\n\n费用累计曲线\n\n项目论证与决策\n\n组织机构\n\n工作结构分解\n\n里程碑计划\n\n责任分配,工作关系,时间估计\n\n计划实施\n\
    \n动态监控\n\n挣值分析\n\n费用控制\n\n计划偏离调整计划\n\n计划一致执行计划\n\n范围确认质量验收资料验收\n\n质量控制\n\n进度控制\n\
    \n项目进度控制项目费用控制项目风险控制项目质量管理信息沟通管理\n\n材料实际费用人工实际费用项目执行报告计算 SV / CV估算 EAC\n\n## 成功的项目计划与控制特征\n\
    \n成功的项目计划与控制方法应该具有如下的特征：\n\n- 体系化\n- 程序化\n- 可视化\n- 动态化\n\n## 三、项目目标与范围确定\n\n-\
    \ [ ] 项目目标的确定\n- [ ] 里程碑计划及其制订\n- [ ] 项目范围的确定\n- [ ] 工作分解结构WBS的制定\n\n## 1. 项目目标确定与项目描述\n\
    \n- 项目目标是项目**预期的结果或最终产品**，应明确具体，并尽量定量化，主要涉及：\n    - 时间 约束性目标\n    - 费用 约束性目标\n\
    \    - 技术 Product requirements specification\n    - 产品 满足特定需求、个性化的可交付性成果\n\n-\
    \ 目标确定的依据是项目论证报告和合同，总目标的确定通常包括：\n    - 工作范围\n    - 进度计划\n    - 成本\n    即要求在一定期限和预算内完成预定任务。\n\
    \n## 目标描述示例\n\n1.在10个月内，在200万美元的预算内，把一种新型电子家用烹调产品打入市场，并达到预先规定的性能指标。\n\n2.“建成一所房屋”的目标描述是否合理？\n\
    较好的描述应该是：在15万美元的预算内，根据5月15日的楼面布置图纸和说明书，在10月31日前建成这所房子。\n\n## 某无人驾驶的小型气象探测飞机研制生产项目\n\
    \n某飞机制造公司承担无人驾驶的小型气象探测飞机研制生产项目。项目拟于2009年7月开始实施，市场需求为50-100架，首架交付日期为2013年12月。项目目标包括飞机研制和为保证飞机性能的特种设备/设施采购，为保障小型气象探测飞机研制与试飞任务的顺利进行，项目总投资为1.2亿元人民币。\n\
    \n问题：对项目的目标进行描述？\n\n## 无人机研制项目目标\n\n- 可交付成果：研制无人驾驶小型气象探测飞机；\n- 工期：首架交付日期2013年12月，研制时间从2009年7月到2013年12月，总工期为3.5年；\n\
    - 费用：研制总经费为1.2亿元人民币。\n\n## 豪华别墅建设项目\n\n在一次福利彩票的购买中，你无意中得到了一笔500万元的头等奖金。在得到这比钱之后，你便想着手实现您过去的梦想，建造一栋豪华别墅。为了建造这座豪华别墅，你准备花费200万元，建筑面积共500平方米，包括上下两层，配有健身房、车库、卫生间、取暖设备及小花园。建设豪华别墅的工作可以于2010年5月1日开始，你希望在2011年新年到来之际搬进新房，同时要求在新房建设完成两个月后才可以搬进新房。\n\
    \n- 问题：对项目的目标进行描述？\n\n## 项目目标与描述示例\n\n### “中星22号”卫星业务管理站建设项目\n\n“中星22号”卫星业务管理站建设项目主要是负责卫星运行业务管理。其建设项目主要包括：通信、天何馈、射频网络、遥测遥控、数据处理、在轨测试和测试模拟等。\n\
    \n项目总投资1800万元。为满足05年11月发射的卫星，本项目于2004年9月初开始，2005年9月前建设完成，工程总工期为1年。\n\n## 确定项目目标\n\
    \n- 交付成果：卫星业务管理站建设项目\n- 工期目标：工程于2004年9月初开工建设，2005年9月前完成，工程总工期为1年。\n- 费用目标：总造价1800万元\n\
    - 质量目标：各单机设备合格率100%，优良率70%以上，争创一流。\n- 安全目标：杜绝人为事故。\n\n## 项目工作描述表\n\n| 项目工作描述 |\
    \ |\n|---|---|\n| 项目名称 | 卫星业务管理站建设项目 |\n| 项目目标 | 2004年9月开工，用1年的时间完成“中星22号”卫星业务管理站的建设。项目总投资1800万元。\
    \ |\n| 可交付物 | 卫星业务管理站 |\n| 交付物完成准则 | 通信、天枢馈、射频网络、遥测遥控、数据处理研制技术要求 |\n| 工作描述 | 系统分析、系统设计、系统研制、系统测试、系统交付\
    \ |\n| 工作规范 | 依据卫星在轨测试规范 |\n| 所需资源 | 人力、材料、经费、设备的需求预计 |\n| 重大里程碑 | 04年12月15日系统设计、05年5月31日系统研制、05年7月31日系统测试、05年8月31日系统交付。\
