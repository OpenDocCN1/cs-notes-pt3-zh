    # # 什么是Benchmarking?


    Benchmarking就是对产生最佳绩效的最优的经营管理实践的探索，也就是以领先组织为标准或参照，通过资料收集，分析，比较，跟踪学习等一系列的规范化的程序，改进绩效，赶上并超过竞争对手，成为市场中的领先者。


