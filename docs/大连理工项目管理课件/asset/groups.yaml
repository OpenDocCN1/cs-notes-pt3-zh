    # 投资估算计算的内容和方法


    +   - 流动资金的估算：

    +     - 分项详细估算法

    +       - 流动资金＝流动资产－流动负债

    +       - 流动资产＝应收帐款＋存货＋现金

    +       - 流动负债＝应付帐款

    +       - 流动资金本年增加额＝本年流动资金－上年流动资金


    +   - 扩大指标估算法

    +     按流动资金占某些基数的比例估算。

    +     基数：销售收入、经营成本、总成本、建设投资


    流动资金额＝年产值（年销售收入额）×产值（销售收入）资金率


    流动资金额＝年经营成本（年总成本）×经营成本资金率（总成本资金率）'
