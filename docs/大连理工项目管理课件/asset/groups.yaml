  md: "\n\n## 4.6 最低价格法\n\n对产品产量不同，产品价格收费标准又难以确定的比较方案，当其产品为单一产品或能折合为单一产品时，可采用最低价格法，分别计算各比较方案净现值等于零时的产品价格并进行比较，以产品价格较低的方案为优。\n\
    \nQt表示第t年的产品量\n\n## 5. 不确定性分析\n\n- 对投资项目风险的不确定性分析，常用的方法有：\n  - 盈亏平衡分析\n  - 敏感性分析\n\
    \  - 风险决策分析\n  - 计算机模拟\n  - 经验方法\n\n## 盈亏平衡点计算方法\n\n### 1) 公式计算法\n\n#### 用生产能力利用率表示：\n\
    \n\\( BEP_{\\text{生产能力利用率}} = [\\frac{\\text{年总固定成本 } F}{\\text{年销售收入 } S - \\\
    text{年可变成本 } C_v - \\text{年销售税金及附加 } T}] \\times 100\\% \\),\n\\( = \\frac{F}{S\
    \ - C_v - T} \\times 100\\% \\).\n\n#### 用产量表示：\n\n\\( Q_{BEP} = \\frac{\\text{年总固定成本\
    \ } F}{\\text{单位产品价格 } P - \\text{单位产品可变成本 } V - \\text{单位产品销售税金及附加 } T} \\),\n\
    \\( = \\frac{F}{P - V - T} \\),\n\\( = BEP_{\\text{生产能力利用率}} \\times \\text{设计生产能力}\
    \ \\).\n\n## 盈亏平衡点计算方法\n\n### 2) 图解法\n\n当0 < Q < Q<sub>BEP</sub>时，企业处于亏损状态。\n\n\
    当 Q > Q<sub>BEP</sub>时，企业处于盈利状态。\n\n## 示例\n\n例：假设某企业新建生产线投产后，正常年分固定成本总额为20000元，产品售价为每件10元，单位产品变动成本为6元，请计算该生产线的盈亏平衡点或保本销售量。\n\
    \n## 答案\n\n- 总成本 C(Q)=固定成本 K＋单价 D×产品产量 Q\n- 产品收入 B(Q)=销售价格 S×产品产量 Q\n- 盈亏平衡即\n\
    \  C(Q)=B(Q)　或　K＋DQ=SQ\n- 盈亏平衡点\n  Q=K/(S-D)=20000/(10-6)=5000件\n  相应的保本销售额为：B=5000×10=50000元\n\
    \n## 练习题\n\n例：某项目生产某种产品年设计生产能力为3万件，单位产品价格为3400元，单位销售税金与附加600元，总成本费为8800万元，其中固定成本2800万元，总变动成本与产品产量成正比例，请计算该生产线的盈亏平衡点或保本销售量。\n\
    \n## 5.2 敏感性分析\n\n- 敏感性分析是通过分析、预测工程项目主要因素发生关系变化时对经济评价指标的影响，从中找出敏感因素，并确定其影响程度。\n\
    \n- 在项目计算期内可能发生变化的因素有产品产量、产品价格、产品成本或主要原材料与动力价格、固定资产投资、建设工期及汇率等。\n\n- 敏感性分析通常是分析这些因素单独变化或多因素变化对内部收益率的影响。必要时也可分析对静态投资回收期和借款偿还期的影响。\n\
    \n- 项目对某因素的敏感程度可以表示为该因素按一定比例变化时引起评价指标变动的幅度，也可以表示为评价指标达到临界点（如财务内部收益率等于财务基准收益率或经济内部收益率等于社会贴现率）时允许某个因素变化的最大幅度，即极限变化，同时可绘制敏感分析图。\n\
    \n### 敏感性分析的一般内容\n\n- 改变一种或多种不确定因素的数值\n\n- 计算因素对项目效益的指标的影响\n\n- 具体通过计算敏感度系数和临界点，估计项目效益指标对临界点的敏感程度\n\
    \n- 确定关键的敏感因素\n\n### 单因素敏感性分析和多因素敏感性分析\n\n- 单因素敏感性分析：每次只改变一个因素的数值\n\n- 多因素敏感性分析：每次改变两个或两个以上因素的数值\n\
    \n- 通常多进行单因素敏感性分析\n\n- 一般只考虑不确定因素的不利变化对项目效益的影响\n\n## 敏感性分析的步骤\n\n### 确定分析指标\n\n\
    - 一般选取最基本指标内部收益率，也可以选取净现值、投资回收期。\n\n### 选定需要分析的不确定因素\n\n- 因素：建设投资、产品价格、投入物价格、可变成本、生产负荷、建设期、汇率等\n\
    \n### 不确定因素变化程度的确定\n\n- 一般选择不确定因素的百分比的变化，习惯上选取10%\n\n### 确定敏感因素\n\n## 敏感性分析的计算指标\n\
    \n- 敏感度系数：\n  定义：\n  \n  某不确定因素敏感度系数 = Δ评价指标相对基本方案 / Δ该不确定因素\n  \n  特点：关注敏感度系数的相对值，而不是其绝对值\n\
    \  \n  判别：敏感性系数高，表示项目效益对该不确定因素敏感程度高\n\n## 敏感性分析的计算指标\n\n- 临界点：\n  \n  定义：当不确定因素使IRR=i₀或NPV=0时，其极限变化值。\n\
    \  \n  临界点与基准收益率的关系：\n  \n  同一个投资项目，随着设定基准收益率i₀的提高，临界点就会降低。\n  \n  判别：在基准收益率i₀为定值时，临界点越低，说明该因素对项目效益指标影响越大，项目对该因素就越敏感\n\
    \n## 敏感性分析结果汇总\n\n| 序号 | 不确定因素 | 不确定因素变化率% | 项目财务内部收益率 | 敏感性系数 | 临界值 |\n|---|---|---:|---:|---:|---:|\n\
    |  | 基本方案 |  | 15.3% |  |  |\n| 1 | 建设投资 | 10.0% | 12.6% | 1.77 | 12.3% |\n| \
    \ |  | -10.0% | 18.4% | 2.04 |  |\n| 2 | 销售价格 | 10.0% | 19.6% | 2.84 |  |\n| \
    \ |  | -10.0% | 10.6% | 3.05 |  |\n| 3 | 原材料价格 | 10.0% | 13.8% | 0.95 | 22.4%\
    \ |\n|  |  | -10.0% | 16.7% | 0.94 |  |\n| 4 | 汇率 | 10.0% | 14.2% | 0.71 | 32.2%\
    \ |\n|  |  | -10.0% | 16.4% | 0.75 |  |\n| 5 | 生产负荷 | 10.0% | 17.9% | 1.72 | \
    \ |\n|  |  | -10.0% | 12.4% | 1.92 | 11.2% |\n\n| 敏感因素\\变动幅 | -30% | -20% | -10%\
    \ | 0% | 10% | 20% | 30% |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| 建设投资 |\
    \ 24.7% | 21.5% | 18.4% | 15.3% | 12.6% | 9.9% | 7.2% |\n| 销售价格 | 1.3% | 6.0%\
    \ | 10.6% | 15.3% | 19.6% | 24.0% | 28.3% |\n| 原材料价格 | 19.6% | 18.2% | 16.7% |\
    \ 15.3% | 13.8% | 12.4% | 10.9% |\n| 汇率 | 18.7% | 17.6% | 16.4% | 15.3% | 14.2%\
    \ | 13.1% | 12.0% |\n| 生产负荷 | 6.5% | 9.4% | 12.4% | 15.3% | 17.9% | 20.6% | 23.2%\
    \ |\n\n## 敏感性分析图\n\n纵轴：FIRR\n\n横轴：不确定因素变动百分比\n\n- 建设投资\n- 销售价格\n- 原材料价格\n- 汇率\n\
    - 生产负荷\n\n## 敏感性分析的结果在项目论证中的应用\n\n- 内部收益率随不确定因素变化的曲线与基准收益率相交的交点，就是该不确定因素的临界值\n\
    - 一般临界值用临界点所对应的不确定因素的变化率来表示\n- 敏感度系数较高或临界点较低者为较为敏感性因素\n- 基准收益率选取高低，会改变不确定因素的临界值和敏感度系数数值的大小，但不改变其相对敏感程度\n\
    \n## 讨论题\n\n例：已知某投资项目的各估算因素如下表所示：\n\n| 因素 | 投资额 | 年收入 | 年支出 | 残值 | 寿命 | 折现率 |\n\
    |---|---|---|---|---|---|---|\n| 预测值 | 170 | 35 | 3 | 20 | 10 | 12% |\n\n请对年收入、年支出、残值、寿命四个因素分别按±10%，±20%，±30%的变化，分析对该项目的净现值的影响。\n\
    \n"
