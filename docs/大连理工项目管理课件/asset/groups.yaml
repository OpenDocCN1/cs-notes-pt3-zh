  - '[PAGE 235]


    # 4.1 多方案经济比较概念与原则


    +   - 方案经济比较是技术政策、发展战略、规划制定和项目评价的重要内容，在建设项目可行性研究中，各项主要经济与技术决策均应对各种技术上可行的方案进行技术经济对比分析计算，并结合其他因素详细论证、比较的基础上做出抉择。

    +   - 方案经济比较是项目论证与评价的一项核心内容。

    +   - 方案经济比较的原则：


    +   - 效益与费用计算口径一致原则

    +   - 各个方案间的可比性

    +   - 计算基础资料可比

    +   - 设计深度相同

    +   - 经济计算方法相同'
