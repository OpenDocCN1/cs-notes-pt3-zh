  mdcn: "\n## 4.6 项目信息管理的含义\n\n对项目信息的收集、整理、处理、储存、传递、与应用等一系列活动的总称。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_760_0.png)\n\
    \n信息收集 → 信息传递 → 信息加工 → 信息使用\n\n**项目信息管理**\n\n- 项目信息收集\n  - 来源、对象、收集方法\n- 项目信息传递\n\
    \  - 专人传递、通讯方式、会议方式\n- 项目信息加工处理\n  - 判断、分类整理、分析计算、编辑归档保存\n- 项目管理信息系统（PMIS）\n\n\
    ## 4.7 项目信息的内容举例\n\n一、项目应收集并整理下列信息：\n\n1. 法律、法规与部门规章信息。\n2. 市场信息。\n3. 自然条件信息。\n\
    \n二、项目应收集并整理下列工程概况信息：\n\n1. 工程实体概况。\n2. 场地与环境概况。\n3. 参与建设的各单位概况。\n4. 施工合同。\n5.\
    \ 工程造价计算书。\n\n三、项目应收集并整理下列施工信息：\n\n1. 施工记录信息。\n2. 施工技术资料信息。\n\n四、项目应收集并整理下列项目管理信息：\n\
    \n1. 项目管理规划大纲信息和项目管理实施规划信息。\n2. 项目进度控制信息。\n3. 项目质量控制信息。\n4. 项目安全控制信息。\n5. 项目成本控制信息。\n\
    6. 项目现场管理信息。\n7. 项目合同管理信息。\n8. 项目材料管理信息、构配件管理信息和工具、器具管理信息。\n9. 项目人力资源管理信息。\n10.\
    \ 项目机械设备管理信息。\n11. 项目资金管理信息。\n12. 项目技术管理信息。\n13. 项目组织协调信息。\n14. 项目竣工验收信息。\n15.\
    \ 项目考核评价信息。\n\n## 5. 项目计划与信息系统\n\n一个项目计划可以看作是一个信息系统；\n\n它提供了一个按时间分阶段的工作包的安排，根据资源估算，按WBS的顺序排列，以在合适的时间阶段内和完成项目计划的工作范围为目标。这种基准的项目计划使监督和控制更加容易，通过提供所需的信息来确定和度量合适的控制点。当项目计划实施后，有实际的状态数据时，项目计划和网络图就得到更新，这样，就能进行项目跟踪和监控，确保项目的顺利进行。\n\
