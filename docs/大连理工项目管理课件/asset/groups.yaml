  - '[PAGE 185]


    # # 1. 项目论证


    项目论证又称可行性研究，是从市场预测开始，通过拟定多个方案进行比较论证，研究项目的规模、工艺、技术方案、原材料及能源供给、设备选型、厂址选择、投资估算、资金筹措和偿还、生产成本等各种要求与制约因素，分析评价项目：


    +   - 建设上的必要性

    +   - 技术上的可行性

    +   - 经济上的合理性


    最后提出项目可行或不可行的结论。


    项目论证是一种综合分析和全面科学评价的技术经济研究活动。'
  - '[PAGE 186]


    # # 项目论证主要回答的问题


    +   - 项目在技术上是否可行？

    +   - 项目在经济上是否有生命力？

    +   - 项目在财务上是否有利可图？

    +   - 项目能否筹集到全部资金？

    +   - 项目需要多少资金？

    +   - 项目需要多长时间能建立起来？

    +   - 项目需要多少物力、人力资源？'
  - '[PAGE 187]


    # # 通过项目论证要达到的结论


    +   - 论证项目建设的条件是可靠的

    +   - 项目采用的技术是先进的

    +   - 经济上是有较大的利润可图的。'
  - '[PAGE 188]


    # ## 2. 项目论证的作用


    +   - 项目论证报告可作为：

    +     - 确定项目实施的依据

    +     - 向银行贷款的依据

    +     - 申请建设执照的依据

    +     - 与有关单位签订协作的依据

    +     - 项目实施基础资料的依据

    +     - 项目各项工作安排的依据'
  - '[PAGE 189]


    # 3. 项目论证的出发点


    +   - 要站在咨询的立场上

    +   - 应提出多种替代方案

    +   - 对各种方案要做经济分析

    +   - 决定最佳投资时期和投资规模

    +   - 要提出可能实施的具体措施

    +   - 要把资源的有效利用放在中心位置。'
  - '[PAGE 190]


    <!-- no content -->'
  - '[PAGE 191]


    # 5. 项目论证的层次


    +   - 机会研究

    +   - 初步项目论证

    +   - 辅助研究或功能研究

    +   - 详细项目论证'
  - '[PAGE 192]


    # 5.1 机会研究


    +   机会研究是鉴定投资机会，它寻求的是投资应该用于哪些可能会有发展的部门，这种投资能给企业带来盈利，能给国民经济带来全面的或多方面的好处。


    +   机会研究又分一般机会研究和特定项目机会研究两种。根据当时的条件，决定进行哪种机会研究，或两种机会研究都进行。'
  - '[PAGE 193]


    # # 投资机会研究


    +   - 投资设想：寻找投资机会、选择机会、从各方面进行分析，提出概略的投资建议

    +   - 着重点：投资环境分析

    +   - 目的和作用：鉴别投资方向，选择建设项目，为下一步的研究打下基础'
  - '[PAGE 194]


    # # 一般机会研究


    +   - 一般机会研究：这种研究主要是通过国家机关或公共机构进行的，目的是通过研究指明具体的投资建议。有以下三种情况：

    +     - 地区研究

    +     - 部门研究

    +     - 以资源为基础的研究'
  - '[PAGE 195]


    # # 特定项目机会研究


    具体项目机会研究：一般投资机会作出最初鉴别之后，即应进行这种研究，并应向潜在的投资者散发投资简介，实际上作这项工作的往往是未来的投资者或企业集团。主要内容为：


    +   - 市场研究

    +   - 项目意向的外部环境分析

    +   - 项目承办者优劣势分析'
