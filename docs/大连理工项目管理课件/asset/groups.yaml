    \n在项目收尾阶段，依据项目规划阶段制定的项目竣工质量验收评定的范围、标准与依据进行验收。\n\n## 2.3 项目质量验收的结果\n\n- 质量验收的结果是产生质量验收评定报告和项目技术资料。\n\
    - 项目最终质量报告的质量等级一般分“合格”和“优良”两级，凡不合格的项目不予验收。\n- 项目每一个工序的质量检验评定报告经汇总成相应的技术资料，是项目资料的重要组成内容。\n\
    \n## 3. 项目文件验收\n\n项目文件（资料）是项目竣工验收和质量保证的重要依据之一，项目资料也是项目交接、维护和后评价的重要原始凭证，在项目验收工作中起着十分重要的作用，因此，项目资料验收是项目竣工验收前提条件，只有项目资料验收合格，才能开始项目竣工验收。\n\
    \n## 3.2 项目规划阶段应验收移交归档的资料\n\n- 项目描述资料（范围划分报告，详细设计报告等）\n- 项目计划资料（完整的项目进度计划，质量计划，费用计划和资源计划）\n\
    \n## 3.4 项目收尾阶段应验收移交归档的资料\n\n- 项目竣工图\n- 项目竣工报告\n- 项目质量验收报告\n- 项目后评价资料\n\n## 3.5\
    \ 项目文件验收程序\n\n- 项目资料整理\n- 自检和预验收\n- 资料装订成册，送交验收方验收\n- 验收方按合同资料清单和档案法规的要求，进行验收\n\
    - 项目资料验收报告确认和签证\n\n## 3.6 项目文件验收的结果\n\n- 项目资料档案\n- 项目资料验收报告\n\n## 4. 项目交接与清算\n\
    \n项目交接是指全部合同收尾以后，在政府项目监管部门或社会第三方中介组织协助下，项目业主与全部项目参与方之间进行项目所有权移交的过程。\n\n项目清算是项目收尾的另一种结果和方式。项目交接是正常的项目收尾过程，项目清算是非正常的项目终止过程。\n\
    \n## 4.1 项目竣工、验收、交接关系\n\n项目竣工（项目团队）\n\n竣工验收（验收班子）\n\n返工或处理（项目团队）\n\n不通过\n\n通过\n\
    \n交接（项目团队，项目接受方，项目监理等）\n\n## 4.2 项目交接的程序及结果\n\n项目经竣工验收合格后，便可办理项目交接手续即：将项目的所有权移交给建设单位。项目的移交包括项目实体移交和项目文件移交两部分。以工程项目移交为例，移交的内容如下：\n\
    \n- 工程实体移交，即建（构）筑物实体和工程项目内所包括的各种设备实体的交接。\n- 工程技术档案文件移交。\n\n结果：项目交接报告\n\n## 4.3\
    \ 项目的回访与保修\n\n### 项目回访目的\n\n- 质量问题\n- 新思想、新工艺、新材料、新技术、新设备的性能与效果\n\n### 回访的方式\n\
    \n- 季节性\n- 技术性\n- 保修期满前\n\n### 项目的保修\n\n## 1. 项目审计\n\n项目审计是指审计机构依据国家的法令和财务制度、企业的经营方针、管理标准和规章制度，对项目的活动用科学的方法和程序进行审核检查，判断其是否合法、合理和有效的一种活动。\n\
    \n特征：独立性、权威性、科学性\n\n职能：经济监督、经济评价、经济鉴证、支持\n\n## 2. 项目审计的目的\n\n确定项目的各项经济活动的合法性：项目全生命周期内各种审批手续是否完备，投资是否符合国家有关规定和政策，建设内容有无改变，项目采购与质量是否符合国家有关规定、要求，财务收支活动是否符合相应的法规与会计制度\n\
    \n项目的公允性：各项资金收支活动是否真实存在，与项目有关的各种图纸、合同、报告书等资料是否真实存在，内容是否真实\n\n项目的合理性：与项目有关的各项活动是否必要，有无不当之处\n\
    \n项目的效益性：是否用较小的投入取得较大的产出，是否存在重复建设问题\n\n## 3. 项目审计的程序\n\n- 审计准备\n  - 选择项目确定目的范围\n\
    \  - 组建班子\n  - 熟悉资料\n  - 制定计划\n- 实施审计\n  - 常规审查\n  - 详细审查\n- 报告审计结果（审计报告）\n- 后续工作\n\
    \  - 建议的实施\n  - 资料归档\n\n## 4. 项目审计的范围\n\n- 按审计的内容不同而分为：\n  - 工程质量审计\n  - 资金使用审计\n\
    \  - 合同审计\n- 按项目周期分类分为：\n  - 项目前期审计\n  - 项目实施期审计\n  - 项目竣工期审计\n\n## 5. 项目审计的任务\n\
    \n- 检查审核项目建设活动是否符合相关规章制度的规定。\n- 检查审核项目建设活动是否符合国家的政策、法律、法规和条例，有无违法乱纪、营私舞弊等现象。\n\
    - 检查审核项目活动是否合理。\n- 检查审核建设项目的效益。\n- 检查和审核各类项目报告、会计记录和财务报表等反映项目建设和管理状况的资料是否真实和公允，有无弄虚作假或文过饰非的现象。\n\
    - 在检查审核项目建设和管理状况的基础上，提出改进建议，为企业决策者提供决策依据，促使项目组织改善管理工作。\n\n"
