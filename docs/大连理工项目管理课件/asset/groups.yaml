    - 按合同要求交付\n- 运行平稳可持续发展\n\n- 主要工作：\n  - 市场综合研究市场需求&机会\n  - 项目投资初步分析\n  - 项目盈利分析\n\
    \  - 市场竞标\n  - 自开发项目研究\n- 项目投资分析\n- 项目实施方案\n- 项目可行性报告\n- 商业计划书\n- 项目范围目标组织构成\n\
    - 工作分解\n- 里程碑计划\n- 网络计划\n- 人力资源配置\n- 费用分解\n- 费用进度控制体系\n- 质量控制体系\n- 成本费用控制管理\n\
    - 质量控制管理\n- 项目信息管理\n- 项目风险管理\n- 项目可视化管理\n- 过程偏差控制\n- 项目验收成果交付\n- 项目管理文件交付\n- 资料交付\n\
    - 质量交付\n- 项目决算\n- 项目总结评价\n- 发展规划\n- 运营管理\n- 营销\n\n- 输出：\n  - 投标书\n  - 项目建议书\n\
    - 项目中标书、合同\n- 项目立项批准书\n- 项目各级实施方案\n- 过程控制报表\n- 阶段总结报告\n- 业主验收报告\n- 项目总结报告\n- 计划、报表\n\
    - 财务分析\n\n- 关键：\n  - 市场信息系统\n  - 企业核心竞争力\n  - 企业决策能力\n- 项目相关方需求细分\n- 项目目标细分\n\
    - 技术实现可行性\n- 资源需求可行度\n- 费用分解\n- 项目实施方案可行度\n- 项目相关方关关系\n- 合同管理\n- 工期、成本、质量\n- 控制方案\n\
    - 工期、成本、质量\n- 控制管理\n- 项目执行偏差分析\n- 合同完成偏差分析\n- 项目运营管理\n\n- 项目评价体系\n- 项目前评价\n- 项目中评价\n\
    - 项目后评价\n\n## 五、项目管理与企业发展\n\n- [ ] 新形势下企业管理走向何方？\n- [ ] 新商业环境的特点\n- [ ] 新商业环境企业管理所面临的问题\n\
    - [ ] 项目管理是企业迎接挑战的有力武器\n- [ ] 企业项目管理\n- [ ] 按项目进行管理\n- [ ] 项目管理给企业组织带来的变革\n\n\
    ## 背景资料\n\nIBM、花旗银行(Citybank)、摩托罗拉(Motorola)、美国运通(American Express)、AT&T等成功企业的经验是：企业项目化管理是企业迎接挑战，面向未来，增强竞争力的有力武器。\n\
    \n这些成功的企业已经学会如何驾驭项目管理的能力，并将它转换成一套组织的哲学，这些公司被视为由「项目组合」而成的动态企业，并采用项目化的管理理念处理他们日常的经营活动。\n\
    \n## 1.项目是实现企业发展战略的载体\n\n## 2.新的商业环境的特点\n\n### 特点：\n\n- 不确定性的时代--瞬息万变\n\n- 市场竞争日趋激烈化、国际化\n\
    \n- 客户类型日趋复杂化、需求日趋个性化\n\n- 技术发展日新月异。\n\n### 导致的变更：\n\n- 一种产品从创意到退出市场的全过程也就具备了项目的特性；而产品生产过程的组织也因为客户需求的个性化及外协生产方式的采用也可当作一个项目来管理。\n\
    \n- 在新的商业环境下，企业传统的运作业务日趋具备了项目的特色，运作日趋项目化。\n\n## 3.新环境下企业管理所面临的主要问题\n\n- 应变能力问题：及时调整组织，适应外部环境的变化；\n\
    \n- 降低成本问题：产品生命周期缩短，固定资产投入应慎重；\n\n- 权力分散问题：顾客的需求变化快，直接与顾客接触的人需求有决策权，以保证快速决策；\n\
    \n- 降低风险问题：产品结构多元化趋势。\n\n## 4. 项目管理是企业迎接挑战的有力武器\n\n具体的讲，项目管理能有效地解决：\n\n- 分权问题\n\
    \n- 多元化管理问题\n\n- 资源共享问题\n\n- 人员的进出问题\n\n- ......\n\n## 5. 企业项目管理（EPM）\n\n企业项目管理是伴随着项目管理方法在长期性组织中的广泛应用而逐步形成的一种以长期性组织为对象的管理方法和模式，其主导思想就是把任务当作项目以实行项目管理，即“按项目进行管理”。\n\
    \n企业项目管理就是站在企业高层管理者的角度对企业中各种各样的任务实行项目管理，是一种以“项目”为中心的长期性组织管理方式，其核心是基于项目管理的组织管理体系。\n\
    \n项目化管理模式的真正出现是在20世纪80年代末期开始的，特别是当时信息技术类企业的飞速发展和技术的急速变化使得此类企业在管理模式上出现了质的飞跃。一批信息技术类的龙头企业，诸如IBM、朗讯、AT&T等纷纷采用项目化的管理模式，并为企业带来了新的经营活力。\n\
    \n## EPM全方位观点\n\n策略性项目管理机制整合架构 S M\n\n## 6.按项目进行管理 (Management by Projects, MBP)\n\
    \n- 按项目进行管理将传统的项目管理方法应用于全面的企业运作，是传统项目管理方法和技术在企业所有项目上的综合应用，冲破了传统的管理方式和界限。\n\n-\
    \ 按项目进行管理将项目观念渗透到企业所有的业务领域，包括市场、工程、质量管理、战略规划、人力资源管理、组织变革、业务管理等。\n\n## 天士力的项目化管理--从\
    \ TPM 到 MBP\n\n从TPM到MBP带来的新理念：\n\n- 让好主意成为项目\n- 让好项目成为现实\n\n从TPM到MBP的成功实例：\n\n\
    - 天士力制药股份有限公司运用现代企业项目管理的知识和技术，使企业创新从过去的自发、自觉、自然的状态转变到了目前的规范化、制度化、系统化的体系中，形成了全员参与的项目管理文化，为企业向更高层次的发展打下了坚实的基础。\n\
    \n## 个实例—天士力的企业项目化管理\n\n## 企业项目来源和分类：\n\n## 天士力项目组织形式\n\n## 企业项目管理流程图\n\n### 图例\n\
    \n- 公司级项目,成熟度高\n- 部门级项目,成熟度中\n- 小组级项目,成熟度低\n- 可能发生的流程\n\n### A级：\n\n### B级：\n\n\
    ### C级：\n\n公司战略发展需求\n公司指定项目经理\n\n部门工作开展需要\n\nTPM好主意好点子\n\n决定立项\n立项论证\n\n部门经理申请立项\n\
    \n口头申请立项\n部门批准备案\n\n项目申请表\n\n项目立项论证\n\n批准\n部门指定项目经理\n\n项目经理制定项目计划\n\n项目经理制定项目计划\n\
    \n每季度向项目办汇总\n\n包括WBS、组织结构图、里程碑计划、责任矩阵、进度计划、网络图、资源计划、风险计划、成本费用计划\n\n包括WBS、组织结构图、里程碑计划、责任矩阵、进度计划、成本费用计划\n\
    \n项目任务书\n1、交付物\n2、工期\n3、预算\n4、验收标准\n\n项目中止申请报告\n\n变更申请报告\n重大突发性事件报告\n项目进展报告\n\
