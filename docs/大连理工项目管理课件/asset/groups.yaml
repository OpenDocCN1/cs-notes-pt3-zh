    \ manager\n\n职员 Staff\n\n职员 Staff\n\n职员 Staff\n\n项目经理  \nProject manager\n\n职员\
    \ Staff\n\n职员 Staff\n\n职员 Staff\n\n项目A协调\n\n项目B协调\n\n### 矩阵式组织形式的优缺点\n\n#### 优点\n\
    \n- 项目组织是又有有关项目活动的焦点\n- 项目经理拥有对拨给的人力、资金等资源的最大控制权\n- 职能组织中专家的储备提供了人力利用的灵活性\n- 对环境的变化及项目的需要能够迅速做出反应\n\
    - 项目人员有明确归宿\n- 关键技术人员能够为各项目共用，充分利用了人力资源\n\n#### 缺点\n\n- 职能组织与项目组织间的平衡需要持续的进行监视\n\
    - 在开始制定政策和方法时，需要花费较多的时间和工作量\n- 每个项目独立进行，容易产生重复性的劳动\n- 协调难度大，一个成员有两个上司，既难处，也难管\n\
    - 对时间、费用以及运行参数的平衡必须加以监控\n\n## 项目管理的组织形式\n\n例：某企业是以项目为基础的企业，即企业的经营活动是有许多项目活动有机构成。为了适应企业的这一特点，企业组织结构采用了矩阵式组织结构，但是在项目运作过程中，项目的资源如人员经常会受到项目经理及职能经理的双重领导，降低了运作效率和效果。某项目经理为了使项目成员在项目存续期间不受干扰，规定在项目成员进入项目组必须接受这样一条约束，即在项目组工作时不与原属职能部门发生任何联系。请分析这位项目经理的做法是否合理？\n\
    \n## 项目组织形式对项目的影响\n\n| 特征 | 职能式 | 矩阵式 | | | 项目式 |\n|---|---|---|---|---|---|\n\
    | | | 弱矩阵 | 平衡矩阵 | 强矩阵 | |\n| 项目经理的权限 | 没有 | 有限 | 小到中等 | 中等到大 | 甚至全权 |\n| 全职工作人员的比例\
    \ | 几乎没有 | 0%~25% | 15%~60% | 50%~95% | 85%~100% |\n| 项目经理投入时间 | 几乎没有 | 半职 | 全职\
    \ | 全职 | 全职 |\n| 项目经理的常用头衔 | 调员 | 调员 | 项目经理 | 项目经理 | 项目经理 |\n| 项目管理行政人员 | 兼职 |\
    \ 兼职 | 半职 | 全职 | 全职 |\n\n## 影响组织结构影响形式的因素\n\n- 不确定性\n- 所用技术\n- 复杂程度\n- 持续时间\n\
    - 规模\n- 重要性\n- 客户类型\n- 对内部依赖性\n- 对外部依赖性\n- 时间限制性\n\n## 项目管理组织结构形式选择\n\n- 职能式组织结构比较适用于规模较小、界面相对独立、偏重于技术的项目，不适应于项目的环境变化较大的项目，不适应于管理多个项目\n\
    - 当一个公司中包括许多项目或项目的规模比较大、技术复杂、进度或产品性能极为重要，开发成本相对不重要时，则应选择项目式的组织结构\n- 矩阵式组织形式融合了两种组织结构的优点，充分利用企业资源，对技术复杂、规模巨大项目的管理呈现出了明显的优势。如果项目经理有权管理资金并与职能经理有业务关系（包括正式工作承诺和项目计划制定的参与），那么矩阵结构就会很好地发挥作用；相反，如果项目经理仅仅被看成一个协调员，依靠部门经理尽力去执行项目的话，矩阵结构就会失效。\n\
    \n## 正式组织与非正式组织\n\n**正式组织**：当两个以上的人为了既定的目标而自觉协调其活动时，这样的组织就是“正式组织”\n\n## 正式组织与非正式组织\n\
    \n非正式组织：没有自觉的共同目标（即使也可能产生共同的成果）的任何联合的个人活动称为非正式组织\n\n## 问题：\n\n1. 作为一个项目经理你考虑过你的组织中的一些“小群体”吗？你觉得他们“碍事”吗？\n\
    2. 作为一项目组成员，你觉得你和一些同事能形成“小群体”吗？你觉得你们之间讨论哪些事情？领导是否有意拆散你们的“小群体”？\n\n## 非正式组织的积极性\n\
    \n- 满足员工部分需要\n- 增强合作精神\n- 互相帮助\n- 规范行为\n\n## 如何利用非正式组织？\n\n"
