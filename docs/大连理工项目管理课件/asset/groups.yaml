    # 对“范围”的定义


    项目范围管理中所指的“范围”是产品范围和项目范围两个概念的总和。


    +   产品范围：

    +   是指一个产品（服务）应该具有的特性和功能；

    +   标志产品范围完成的对比依据是产品（需求）说明。


    +   项目范围：

    +   是指为提交上述具有该特性与功能的产品所必须完成的各项活动，包括管理工作和施工活动；

    +   项目范围的完成是以项目计划的完成为对比依据的。'
  - '[PAGE 395]


    # 项目范围管理


    项目范围管理是指项目组织通过所需的管理过程，确保项目范围内的所有工作（且仅仅是这些工作，无关工作必须排除在管理范围之外）得以圆满完成，最终实现项目产品所需的特性与功能。


    > > Do what the customer asked for,no more and no less


    项目要求的提交成果可能是分阶段提交的、每一个提交成果可能包含多个辅助部分，每个辅助部分都有其相应的范围管理。


    “工作包”范围管理：项目的某个单元工程。'
  - '[PAGE 396]


    # # 范围 Vs 需求


    +   - 项目范围有时就是一系列更加详细的需求说明文件的总和；

    +   - 组织业务必须反映客户需求的变化；

    +   - 通过不断进行范围变本，以按客户所做的工作没有盲顾客户为什么总是反反复复？


    +   - “客户怎么好象总是反反复复、粘粘乎乎的”，比如，开始提需求的时候和顾问表达了三点意见，顾问开始做方案以后又告诉顾问两点详细说明，看到顾问的方案以后，客户好象受了启发，一下子又冒出了五点六点的需求要顾问实现。'
