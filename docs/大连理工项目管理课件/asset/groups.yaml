    ## 弗鲁姆的期望理论


    A企业因一客户拖欠货款而周转不灵，但利用多种方法也没催回。领导认为“重奖之下必有勇夫”，因此设重奖奖励能催回货款的人，但反应寥寥无几。为什么？


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_146_0.png)


    人们在工作中的积极性或努力程度（激发）力量M是效价V和期望值E的乘积


    M = V × E


