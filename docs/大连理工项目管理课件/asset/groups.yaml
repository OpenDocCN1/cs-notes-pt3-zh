    ## 三、项目后评价


    - [ ] 项目后评价概念

    - [ ] 项目后评价内容

    - [ ] 项目后评价程序

    - [ ] 项目后评价方法

    - [ ] 项目后评价报告


    ### 1.项目后评价概念


    项目后评价是指对已完成的项目(或规划)的目的、执行过程、效益、作用和影响所进行的系统的、客观的分析，通过项目活动实践的检查总结，确定项目预期的目标是否达到，项目或规划是否合理有效，项目的主要效益指标是否实现，通过分析评价找出成功失败的原因，总结经验教训，通过及时有效的信息反馈，为未来新项目的决策和提高完善投资决策管理水平提出建议，同时也为后评价项目实施运营中出现的问题提供改进意见，从而达到提高投资效益的目的。


    #### 项目后评价概念的理解


    - 一个学习的过程

    - 增强投资活动工作者责任心和工作水平的重要手段

    - 为投资决策服务


    ### 2. 项目后评价的内容


    项目后评价通常在项目竣工以后项目运作阶段或项目结束之前进行。它的内容包括：


    - 项目竣工验收

    - 项目效益后评价

    - 项目管理后评价。


    #### 项目后评价与前评价的区别


    | 对比项目 | 前评价 | 后评价 |

    |---|---|---|

    | 时点 | 项目的起点 | 项目建成后 |

    | 目的 | 确定项目是否可以立项 | 总结经验教训，改进决策和管理服务 |

    | 内容 | 应用预测技术来分析评价项目未来的效益，确定项目投资是否值得、可行 | 总结项目的准备、实施、完工和运营，通过预测对项目未来进行分析评价 |

    | 判别标准 | 投资者要求获得的收益率或基准收益率（社会折现率） | 与前期评估的结论对比 |


    #### 2.2 项目竣工验收


    项目的竣工验收是投资由建设转入生产、使用和运营的标志，是全面考核和检查项目实践工作是否符合设计要求和达到要求工程质量的环节，是项目业主、合同商向投资者汇报建设成果和交付新增固定资产的过程。在这阶段进行的工作将为以后开展的项目效益后评价和项目管理后评价作基础。项目竣工验收分为以下几个方面：


    - 竣工验收

    - 竣工决算

    - 技术资料的整理和移交


    #### 2.3 项目效益后评价


    项目效益后评价是项目后评价理论的重要组成部分。它以项目投产后实际取得的效益（经济、社会、环境等）及其隐含在其中的技术影响为基础，重新测算项目的各项经济数据，得到相关的投资效果指标，然后将它们与项目前评价时预测的有关经济效果值（如净现值NPV、内部收益率IRR、投资回收期等）、社会环境影响值（如环境质量值IEQ等）进行对比，评价和分析其偏差情况以及原因，吸取经验教训，从而为提高项目的投资管理水平和投资决策服务。具体包括以下几个方面：


    - 经济效益后评价

    - 环境效益和社会效益后评价

    - 项目可持续性后评价

    - 项目综合效益后评价


    #### 2.4 项目管理后评价


    项目管理后评价是以项目竣工验收和项目效益后评价为基础，在结合其它相关资料的基础上，对项目整个生命周期中各阶段管理工作进行评价。目的是通过对项目各阶段管理工作的实际情况进行分析研究，形成项目管理情况的总体概念。通过分析、比较和评价，能知道目前项目管理的水平。通过吸取经验和教训，来不断提高项目管理水平，以保证更好地完成以后的项目管理工作，促使项目预期目标很好地完成。项目管理后评价包括以下几个方面：


    - 项目的过程后评价

    - 项目综合管理的后评价

    - 项目管理者的评价


    #### 2.5 案例讨论


    如何对项目经理进行综合评价？请根据自己的经验尽可能的提出相应的评价体系和评价方法？


    #### 项目经理评价指标体系


    - 技术能力

    - 计划能力

    - 组织能力

    - 全局观

    - 控制能力

    - 预见性

    - 表达能力


    - 诚实性

    - 效率性

    - 责任心

    - 潜力

    - 判断力

    - 健康


    ### 3.项目后评价的程序


    - 后评价项目的选定

    - 确定后评价计划

    - 确定后评价范围

    - 自我评价

    - 独立后评价

    - 后评价报告


    ### 4.项目后评价的方法


    - 统计预测的原理与方法

    - 对比原则（前后对比、有无对比）

    - 逻辑框架法（LFA）

    - 项目成功度评价法


    #### 4.1 逻辑框架法


    | 层次描述 | 客观验证指标 | 验证方法 | 重要外部条件 |

    |---|---|---|---|

    | 目标 | 目标指标 | 检测和监督手段及方法 | 实现目标的主要条件 |

    | 目的 | 目的指标 | 检测和监督手段及方法 | 实现目的的主要条件 |

    | 产出 | 产出物定量指标 | 检测和监督手段及方法 | 实现产出的主要条件 |

    | 投入 | 投入物定量指标 | 检测和监督手段及方法 | 落实投入的主要条件 |

