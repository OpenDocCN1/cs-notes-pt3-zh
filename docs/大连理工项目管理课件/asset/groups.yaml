    - 提高了工作满足感\n\n## Benchmarking的类型\n\n- 内部Benchmarking（MEMBERSHIP）\n- 竞争Benchmarking（COMPETITOR）\n\
    - 行业Benchmarking（INDUSTRY）\n- 最优Benchmarking（CLOSE-RELATED）\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_172_0.png)\n\
    \n## 怎样Benchmarking？\n\n- Benchmarking计划\n- AIM-SET, AIM-FOCUS ON\n- 组建Benchmarking小组\n\
    - MANAGERS, ANALYST, VISITOR\n- 信息收集\n- 差距分析\n- 采取改进行动\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_173_0.png)\n\
    \n## Benchmarking中差距分析的5个问题\n\n- 目的为何？为什么？某些作业（动作）可否省去？\n- 在何处做？为什么？可否改变场所或放在一起做？\n\
    - 在何时做？为什么？可否改变时间、顺序或同时做？\n- 如何做？为什么？可否简化或改善工作方法？\n- 由谁做？为什么？可否更换人员或由同一人做？\n\n\
    ## Benchmarking的阻力\n\n- 骄傲自大不承认自己存在缺陷\n- 害怕暴露自己的缺陷\n- 习惯\n- Benchmarking的难度\n\
