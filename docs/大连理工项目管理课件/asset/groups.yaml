    # # 第三步：建立各种可行的技术方案


    为了达到目标通常会有多种可行的方法，因而就形成了多种可行的能够相互代替的技术方案。项目论证主要核心点是从多种可供实施的方案中选优，因此拟定相应的实施方案就是项目论证的关键一步工作。


    +   - 组成技术专家组

    +   - 提出各种可行的技术方案

    +   - 专家组论证，发现技术和工艺上可行的技术方案'
