  mdcn: "\n\n## 5.船坞项目评价逻辑框架\n\n| 原定目标 | 实际目标 | 原因分析 | 可持续条件 |\n|---|---|---|---|\n\
    | 宏观目标 | 为发展远洋海运，缓解华南地区大型修船能力不足 | 建成了船坞，填补了不足，缓解了修船矛盾 | 国家的开放政策，劳动力资源和价格优势 |\n\
    | 项目目的 | 填补了我国10万吨级船坞的空白，生产纲领：年修1-10万吨级船舶62艘 | 实际年修万吨级以上船62艘，最大为20万吨级的国外轮船，市场竞争能力大增\
    \ | 我国对外贸易的增加，远洋航运事业的发展，修船行业的发达 |\n| 项目产出 | 新建10万吨级船坞1座，配套码头，辅助设施等 | 船坞及配套辅助设施建成，工程质量和进度好，但部分设备配套不足，影响坞期\
    \ | 项目实施管理得力，方案优化，前期投资估算不足，工程受投资限制 |\n| 项目投入 | 投资1.84亿元，工期3年 | 总投资3.64亿元，超投资，工期缩短4个月\
    \ | 物价、定额收费上涨，设计施工变更，施工方案优化 |\n| | | | 设备填平补齐，加强管理，提高人员素质 |\n\n## 6. 评价结论和主要经验\n\
    \n### 评价结论\n\n- 项目布局、规模合理，有较强的市场竞争能力。\n- 项目实施顺利，提前完工投产，实现了预期的目标。\n- 项目经济效益良好，并带动了原有企业的发展，项目是成功的。\n\
    \n### 主要经验\n\n- 项目实施过程中采取了一切必要的措施，使得工期缩短，给企业带来了更多的机遇。\n- 项目实施过程中十分重视技术进步，在设计、制造、施工过程中采用了较先进的技术和方案，对后来的生产运营产生了积极效应。\n\
    - 科学严格的管理是项目成败的关键，船坞项目的机构设置、规章制度、监督监理机制及良好的项目团队是项目顺利实施的保证。\n\n### 几点教训\n\n- 项目前期的投资估算不能人为地加以“控制”，应该实事求是，否则将给项目在资金筹措、工程进度、生产运行等方面带来一系列困难。这是项目决策和初步设计时急待解决的一个重要问题。\n\
    - 工程地质勘探是项目前期工作的一个重要环节，应加强该方面的工作。\n- 设计部门的概预算应及时提供，以免影响投资的计划安排；竣工验收时，设计单位应按时提供竣工图，以利总结经验教训。\n\
    \n## 7. 建议\n\n- 现有大中型企业依靠技术进步，进行有效的扩建是实现企业经济规模，使之具有更强的市场竞争能力的关键。建议在投资建设决策中更加注重这类项目的发展。\n\
    - 该地区除该船厂外，还有不少不同规模的修、造船坞，建议通过地区跨部门的联合，组成综合修船能力，以便提高在国际市场上的竞争力。\n\n## 船坞项目成功度评价表\n\
