    \  - b）所得税前财务内部收益率为17.72%，财务净现值（i=12%时）为16309万元。\n  - c）财务内部收益率均大于行业基准收益率，说明盈利能力满足了行业最低要求，财务净现值均大于零，该项目在财务上是可以考虑接受的。\n\
    \  - d）所得税后的投资回收期为9.26年（含建设期），所得税前的投资回收期为7.8年（含建设期），均小于行业基准投资回收期10.3年，这表明项目投资能按时收回。\n\
    \n- （2）根据现金流量表（自有资金）计算以下指标：\n  - a）自有资金财务内部收益率为14.10%。\n  - b）自有资金财务净现值（i=12%）为2808万元。\n\
