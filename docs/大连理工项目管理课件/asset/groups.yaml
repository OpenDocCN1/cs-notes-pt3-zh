    # ②质量控制的方法和技术


    +   检查：包括度量、考察和测试


    +   控制图：控制图可以用来监控任何形式的输出变量，它用的最为频繁，可用于监控进度和费用的变化，范围变化的量度和频率，项目说明中的错误，以及其它管理结果。（图例）


    +   统计样本：对项目实际执行情况的统计值是项目质量控制的基础，统计样本涉及到了样本选择的代表性，合适的样本通常可以减少项目控制的费用。


