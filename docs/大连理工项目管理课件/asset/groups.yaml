    \ 过程可逆\n\n### 7.2 沟通的重要性\n\n- 决策和计划的基础\n- 组织和控制管理过程的依据和手段\n- 成功领导的重要手段\n- 建立和改善人际关系必不可少的条件\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_794_0.png)\n\n许多管理专家和知名企业家都把沟通能力看作是高层主管的第一领导力！\n\
    \n国内外众多的项目失败最主要的共性原因之一就是未能有效沟通。二十年来的国企改革始终没有突破，很重要的一点就是领导与员工没有真正意义上的沟通；领导们踌躇满志宏大的改革计划，不乏有眼光、有胆识、有魄力；但是他们往往不重视与基层员工的沟通，变革没有得到普遍的理解和认可，没有及时沟通妥善解决变革的利益损失方的阻力问题，所以往往失利。\n\
    \n### 7.3 沟通方式方法\n\n- 正式沟通、非正式沟通\n- 上行沟通、下行沟通、平行沟通\n- 单向沟通、双向沟通\n- 书面沟通、口头沟通\n\
    - 言语沟通、体语沟通\n\n## 8. 沟通渠道\n\n当项目组成员为解决某个问题和协调某一方面的事，并在明确规定的组织系统内进行协调工作时，就会选择和组建项目组织内部不同的信息沟通渠道，即信息网络。\n\
    \n在信息传递过程中，发信者并非都是直接将信息传给接收者，中间需要某些人的转承，这就导致了不同的沟通渠道和沟通网络。\n\n### 8.1 沟通渠道（正式）\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_797_0.png)\n\n### 8.2 沟通渠道（非正式）\n\n\
    ![](img/fbe32c10d6ccd4399895fe061b7ec851_798_0.png)\n\n单线式\n\n流言式\n\n### 8.3 沟通渠道（非正式）\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_799_0.png)\n\n偶然式\n\n集束式\n\n### 9.1\
    \ 有效信息沟通的障碍\n\n- 语义上的障碍\n- 知识经验水平的限制\n- 知觉的选择性\n- 心理因素的影响\n- 组织结构的影响\n- 沟通渠道的选择\n\
    - 信息量过大\n- 环境混乱\n- 无反馈\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_802_0.png)\n\
    \n### 9.3 有效的沟通行为法则\n\n一个人的成功，20%靠专业知识，40%靠人际关系，另外40%需要观察力的帮助。因此为了提升我们个人的竞争力，获得成功，就必须不断地运用有效的沟通方式和技巧，随时有效地与人接触沟通，只有这样，才有可能使你事业成功。以下提供几个有效的沟通行为法则：\n\
    \n#### 自信的态度\n\n一般经营事业相当成功的人士，他们不随波逐流或唯唯诺诺，有自己的想法与作风；且很少对别人吼叫、谩骂，甚至连争辩都极为罕见。他们对自己了解得相当清楚，并且肯定自己，他们的共同点是自信，日子过得很开心，有自信的人常常是会沟通的人。\n\
    \n#### 体谅他人的行为\n\n这其中包含体谅对方与表达自我两方面，所谓体谅是指设身处地为别人着想，并且体会对方的感受与需要。在经营人的事业过程中，当我们想对他人表示体谅与关心，惟有我们自己设身处地为对方着想。由于你的了解与尊重，对方也相对体谅你的立场与好意，因而做出积极而合适的回应。\n\
    \n#### 善用询问与倾听\n\n询问与倾听的行为，是用来控制自己的，让自己不要为了维护权力而侵犯他人。尤其是在对方行为退缩，默不作声或欲言又止的时候，可用询问行为引出对方真正的想法，了解对方的立场以及对方的需求、愿望、意见与感受。运用积极倾听的方式，来诱导对方发表意见，进而对自己产生好感。\n\
    \n问要问到对方的兴趣点上！\n\n一位优秀的沟通好手，很善于询问以及积极倾听他人的意见与感受。在许多人与人接触以及沟通的机会里，如果我们能随时随地仔细观察并且重视他人情绪上的表现，慢慢就可以清楚了解他人的想法及感受，进而加以引导激励。\n\
    \n#### 直接告诉对方是有效的方法\n\n一位知名的谈判专家谈到他谈判成功的经验时说道：“我在各个国际商谈的场合中，时常会以‘我觉得’（说出自己的感受：适用于平级沟通）‘我希望’（说出自己的要求或期望：适用于上下沟通）为开端，结果常会令人极为满意。”\n\
    \n这种行为是直言无讳地告诉对方我们的要求与感受，若能直接有效地表达你的观点，将会有效帮助我们建立良好的人际网络。但要注意时间、气氛、对象是否适宜。\n\n\
    ### 9.4 沟通时注意的问题\n\n信息传递者沟通时明确：\n\n- 信息是传递给谁的？\n- 我为什么要进行沟通？我的动机是什么？\n- 确定和明白需要沟通的是什么信息？\n\
    - 选择最佳时间\n- 使用接收者能够理解的语言，语言明确，不可含糊其词\n- 选择不妨碍信息接收、理解和接受的地点\n- 与接收者保持联系\n\n####\
    \ 信息接收者沟通时\n\n- 密切关注传递者\n- 积极倾听正传递的信息\n- 如有必要请求解释或重复\n- 与传递者保持联系\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_809_0.png)\n\
    \n"
