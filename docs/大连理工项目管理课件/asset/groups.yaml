    # 2.1 投资收益率与投资回收期


    # 投资收益率与投资回收期


    +   - **投资收益率E，又称投资利润率**，它是项目投资后所获得的年净现金收入（或利润）R与投资额K的比值，即

    +     **E=R/K**


    +   - **投资回收期T**是指用项目投产后每年的净收入（或利润）补偿原始投资所需的年限，它是投资收益率的倒数，即

    +     **T=1/E=K/R**


    若项目的年净现金收入不等，则回收期为使用累计净现金收入补偿投资所需的年限，投资收益率则是相应投资回收期的倒数。'
  - '[PAGE 211]


    # # 投资项目评价原则


    +   - 投资项目的评价原则：

    +     - 投资收益率越大，或者说投资回收期越短，经济效益就越好。

    +     - 不同部门的投资收益率E和投资回收期T都有一个规定的标准收益率E标和标准回收期T标，只有评价项目的投资收益率E≥E标，投资回收期T≤T标时项目才是可行的；否则项目就是不可行的。'
