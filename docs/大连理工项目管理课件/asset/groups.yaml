    # # 资金时间价值的涵义和意义


    在项目论证时，对比不同的被选方案，会发现其现金流量存在两种性质的差异：

    一是现金流量大小的差异，即投入及产出数量上的差异；

    二是现金流量时间分布上的差异，即投入及产出发生在不同的时点。


    如果只是简单地对比两个方案的现金流量，或将前期费用和后期收益直接作静态对比，是不可能得出正确结论的。


    为了保证项目寿命期内不同时点发生的费用和收益具有可比性，必须运用资金时间价值的理论，将不同时点的现金流量折算成相同时点的具有可比价值的现值（或终值），才能科学判断方案优劣。'
