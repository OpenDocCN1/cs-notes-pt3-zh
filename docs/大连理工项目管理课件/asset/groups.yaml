    # 2. 风险的定义


    当活动或项目具有：


    +   1 与损失或收益相关时；


    +   2 涉及到某种或然性或不确定性；


    +   3 涉及到某种选择时；


    才称为有风险。


    风险的定义：


    所有影响项目目标实现的客观不确定性事件或因素的集合，是在项目管理中不希望发生的。'
