    # 1. 项目冲突的概念


    +   1、“矛盾表面化、发生激烈争斗”（《现代汉语词典》）

    +   2、项目冲突即是项目中产生的矛盾，并引起某种程度上的争执。


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_830_0.png)'
  - '[PAGE 831]


    # # 1.1 冲突的定义


    冲突是两个或两个以上的决策者在

    在某个争端问题上的纠纷。


    从心理学的角度讲，冲突是指发生

    于两个或两个以上的当事人，因其对目

    标理解的矛盾以及对自己实现目标的妨

    碍而导致的一种激烈争斗。'
  - "[PAGE 832]\n\n# # 1.2 冲突剖析\n\n+   1 冲突是发生于两个或两个以上当事人的。\n+   \n+   2 冲突只有在所有的当事人都意识到了争议存在时才发生。\n\
    +   \n+   3 所有的冲突都存在着赢或输的潜在结局；参与冲突的各方为了达到各自的目标总会千方百计地阻碍对方实现其目标。\n+   \n+   4 冲突总是以当事人各方相互依存的关系来满足各方的需求。"
  - "[PAGE 833]\n\n# # 1.3 对待冲突有两种观念\n\n1 传统的观念是：害怕冲突，极力避免冲突，消灭冲突，回避冲突。典型表现—和为贵，拉不下面子；\n\
    \n2 现代的观念是：冲突是不可避免的，只要有人群的地方就有可能存在冲突。许多冲突本身并不可怕，可怕的是对待冲突的态度和处理的不当。\n\n有些冲突可以待其发展到一定阶段再合理加以解决\
    \  \n有些冲突如不及时处理，则可能引发混乱，导致项目的失败，危害组织的发展；"
  - '[PAGE 834]


    # # 1.4 项目冲突积极性与消极性


    处理得好，不仅可以解决矛盾问题，还可以产生创新


    处理不好，不仅本身矛盾没解决，还可能引发更多冲突


    冲突即矛盾


