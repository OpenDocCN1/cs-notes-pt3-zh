  - "[PAGE 593]\n\n# # 工作质量—项目质量的保证\n\n+   - 工作质量：参与项目的实施者，为了保证项目质量所从事工作的水平和完善程度 \
    \ \n+     - 社会工作质量  \n+     - 生产工作质量  \n+     - 管理工作质量  \n+     - 技术工作质量"
  - '[PAGE 594]


    # 2.质量管理文件


    +   质量管理文件指在项目实施过程中，为达到预期的项目质量和工作质量要求，对与管理有关的重复性事务和概念所做的规定。包括：

    +   ——质量保证大纲：

    +   ——质量工作计划

    +   ——技术文件

    +   ——质量成本'
  - '[PAGE 595]


    # ①质量保证大纲


    质量保证大纲的目标是：

    —— 提高项目实施的适用性和任务完成率

    —— 降低项目对维修和后勤保障的要求

    —— 提供基本的质量信息

    —— 提高工程实施的经济效益


    质量保证大纲的内容是：

    —— 按项目特点和有关部门的要求，提出明确的质量指标要求

    —— 明确规定工艺技术、计划、质量和物资部门的质量责任

    —— 确定各实施阶段的工作目标

    —— 针对项目特点和实际实施能力，提出质量控制点和需要进行特殊控制的要求、措施、方法及相应的完成标识和评价标准

    —— 对设计、工艺和项目质量评审要有明确规定'
  - '[PAGE 596]


    # ②质量工作计划


    +   - 质量工作计划是对特定的项目、服务、合同规定专门的质量措施、资源和活动顺序的文件。

    +   - 质量工作计划的工作内容：

    +     - 实现的质量目标

    +     - 应承担的工作项目、要求、责任以及完成的时间等

    +     - 在计划期内应达到的质量指标和用户质量要求

    +   - 计划期内质量发展的具体目标、分段进度、实现的工作内容、项目实施准备工作、重大技术改进措施、检测及技术开发等'
  - '[PAGE 597]


    # ③技术文件


    +   技术文件是设计文件、工艺文件、研究试验文件的总称，是项目实施的依据和凭证。


    +   全套技术文件应完整、准确、协调、一致；实际文件与项目技术文件状态一致；工艺文件与项目实施实际一致；研究试验文件与项目实际过程一致。全套技术文件的完整性应根据项目和工作的性质、复杂程度、研制阶段区别对待。


    +   为保证每一项目和工作技术文件的完整性，总设计师、总工程师、项目负责人应根据技术文件的管理规定，在实施工作开始时，提出技术文件完整性的具体要求，列出文件目录，并组织实施。'
  - '[PAGE 598]


    # ④质量成本


    质量成本是实施单位为了保证和提高产品质量、满足用户需要而支出的费用，以及因未达到质量标准而产生的一切损失费用的总和。


    +   质量费用的归集：承制单位应严格遵守质量成本开支范围，根据审核无误的原始凭证，按质量成本核算对象及质量成本科目，分责任单位正确归集质量费用。


    +   质量费用的分配：属于现行项目开支范围内的质量费用，应分别在项目和工作中进行核算，不属于现行项目成本开支范围的质量费用，统计归集后直接或分配计入完工项目和目前实施项目的质量成本。能够分清由哪个项目负担的费用直接计入该项目明细帐或成本质量费用统计表，不能分清的统计后，按工时分配计入。'
  - '[PAGE 599]


    # 3.质量计划


    +   质量计划的目的主要是确保项目的质量标准能够得以满意的实现，其关键是在项目的计划期内确保项目按质按期完成，同时要处理与其他项目计划之间的关系。'
  - '[PAGE 600]


    # # 质量计划的依据


    +   - 质量方针：质量方针是对项目的质量目标和方向所作出的一个指导性文件，因此项目管理工作组应制定自己的质量工作方针，同时项目的质量方针应与项目的投资者完全共享。


    +   - 范围陈述：项目的范围陈述说明了投资者的需求以及项目的主要要求和目标，因此范围陈述是项目质量计划确定的主要依据和基础。


    +   - 产品描述：尽管产品描述的相关要素可能在范围描述中予以强调，然而产品的描述通常包含更加详细的技术要求和其它的内容，它对于项目质量计划的制定非常有用。


    +   - 标准和规则：项目质量计划的制定必须考虑到任何实际应用领域的特殊的标准和规则，这些都将影响项目质量计划的制定。


    +   - 其它工作的输出：除了上述范围陈述、产品描述之外，其他方面的工作输出也会对项目计划的制定产生影响，比如说采购计划就要说明承包人的质量要求从而影响到项目质量管理的计划。'
  - '[PAGE 601]


    # ②质量计划制定的方法和技术


    +   利益/成本分析：质量计划必须综合考虑利益/成本的交换，满足质量需求的主要利益是减少重复性工作，这就意味着高的产出、低的支出及增加投资者的满意度。满足质量要求的基本费用是辅助项目质量管理活动的付出，其基本原则是利益与成本之比尽可能的大。


    +   基准：基准主要是通过比较实际或计划项目的实施与其它同类项目的实施过程，为改进项目实施过程提供思路和提供一个实施的标准。


    +   流程图：流程图是一个由任何箭线联系的若干因素关系图，流程图在质量管理中的应用主要包括如下几个方面：


    +   ——原因结果图：主要用来分析和说明各种因素和原因如何导致或者产生各种各种潜在的问题和后果。


    +   ——系统流程图：主要用来说明系统各种要素之间存在的相互关系，通过流程图可以帮助项目组提出解决所遇质量问题的相关方法。


    +   试验设计：试验设计对于分析辨明对整个项目输出结果最有影响的因素是很为有效的，但该方法的应用存在着费用进度交换的问题。'
  - '[PAGE 602]


    # 原因结果图和系统流程图


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_602_0.png)


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_602_1.png)'
  - '[PAGE 603]


    # # 质量计划的结果


    +   - 质量管理计划：质量管理计划主要描述项目管理组应该如何实施它的质量方针。


    +   - 具体操作说明：对于一些特殊条款需要附加的操作说明，包括对他们的解释及在质量控制过程中如何度量的问题。比如说满足项目进度日期不能足以说是对项目管理质量的度量，项目管理组还必须指出每一项工作是否按时开始或者按时结束，各个独立的工作是否被度量或者仅是做了一定的说明等类似情况。


    +   - 检查表格：检查表格是一种用于对项目执行情况进行分析的工具，其可能是简单的也可能是复杂的，通常的描述包括命令和询问两种形式。许多组织已经形成了标准的确保频繁执行的工作顺利执行的体系。


    +   - 其它过程的输入：质量计划过程也有助于对其它领域工作的开展。'
  - '[PAGE 604]


    # # 质量计划总结


    依据


    - 质量方针

    - 范围说明书

    - 成果(产品)描述

    - 标准与条例

    - 其它过程的结果


    工具与技术


    - 成本/效益分析

    - 比较衡量

    - 流程图

    - 实验设计


    结果


    - 质量管理计划

    - 操作规范

    - 核对表

    - 为其它过程提供的依据'
  - '[PAGE 605]


    # # 4.质量保证


    +   质量保证是所有计划和系统工作实施达到质量计划要求的基础，为项目质量系统的正常运转提供可靠的保证，它应该贯穿于项目实施的全过程之中。在ISO9000系列实施之前，质量保证通常被描述在质量计划之中。


    +   质量保证通常是由质量保证部门或者类似的组织单元提供，但是不必总是如此。质量保证通常提供给项目管理组以及实施组织（内部质量保证）或者提供给客户或项目工作涉及的其它活动（外部质量保证）。'
  - '[PAGE 606]


    # # ①质量保证的依据


    +   - 质量管理计划

    +   - 质量控制度量的结果：质量控制度量是为了比较和分析所作的质量控制测试的记录和度量。

    +   - 操作说明'
  - '[PAGE 607]


    # ②质量保证的工具和方法


    +   质量计划工具和技术


    +   质量审核：质量审核是确定质量活动及其有关结果是否符合计划安排，以及这些安排是否有效贯彻。通过质量审核：


    +   ——保证项目质量符合规定要求；


    +   ——保证设计、实施与组织过程符合规定要求；


    +   ——保证质量体系有效运行并不断完善，提高质量管理水平。


    +   质量审核的分类包括：


    +   ——质量体系审核


    +   ——过程（工序）质量审核


    +   ——内部质量审核


    +   ——项目质量审核


    +   ——监督审核


    +   ——外部质量审核


    +   质量审核可以是有计划的，也可以是随机的，它可以由专门的审计员或者是第三方质量系统注册组织审核。'
  - '[PAGE 608]


    # ③质量保证的结果


    +   质量改进：质量改进包括达到以下目的的各种行动：增加项目有效性和效率以提高项目投资者的利益。在大多数情况下，质量改进将要求改变不正确的行动以及克服这种不正确行动的过程。'
  - '[PAGE 609]


    # # 质量保证总结


    | 依 据 | 工具与技术 | 结 果 |

    |---|---|---|

    | •质量管理计划

    •质量测控结果

    •操作规范 | •质量规划的工具与技术

    •质量稽核 | •质量改进 |'
  - '[PAGE 610]


    # # 5.项目质量控制


    质量控制主要是监督项目的实施结果，将项目的结果与事先制定的质量标准进行比较，找出其存在的差距，并分析形成这一差距的原因，质量控制同样贯穿于项目实施的全过程。项目的结果包括产品结果（如交付）以及管理结果（如实施的费用和进度）。质量控制通常是由质量控制部门或类似的质量组织单元实施，但是也并非总是如此。


    项目管理组应该具有统计质量控制的工作知识，特别是抽样检查和概率方面的知识，以便帮助他们评价质量控制的输出。他们应该清楚以下几个方面的不同：


    +   ——预防和检查

    +   ——特殊原因和随机原因


    +   ——特征样本和随机样本

    +   ——偏差和控制线'
