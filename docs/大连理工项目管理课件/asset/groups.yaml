    \n# 10.3.2 讨论\n\n有则“笑话”：市上召开一个农村工作会，8点半开会，通知区上8点到，区上通知乡上7点到，乡上通知村上6点到，村上通知参加人5点到。于是参加人4点钟就起床了！\n\
    \n> 在一个研究所，开会迟到严重，如果让你拿出改进迟到的方案和措施，你会怎么做？\n\n# ## 主持人责任\n\n## 会前\n\n- 会议目的、议事日程、与会人员、时间地点、会议类型、应散发的材料\n\
    \n## 会间\n\n- 创造和谐的会议气氛，宣布开会、控制议程、鼓励讨论、总结发言、控制发言、作出决议、确认行动和责任、闭会\n\n## 会后\n\n-\
    \ 回顾会议情形，评价会议进展情况和结果\n\n# 记录员责任\n\n## 会前\n\n- 检查会场情况、通知会议参加人员、准备必要的文件、资料、饮品、座位、视听设备\n\
    \n## 会间\n\n- 记录会议备忘录、与会人数、应采取的行动、具体实施人员及实施约束\n\n## 会后\n\n- 备忘录整理成文、核对必要事实数据、向主持人递交备忘录并与之达成一致、散发备忘录\n\
    \n# ## 会议成员责任\n\n### 会前\n\n- 研究问题、记住开会时间地点、准备在会间发挥作用\n\n### 会间\n\n- 倾听他人观点、积极发表自己意见、与主持人密切配合\n\
    \n### 会后\n\n- 努力完成会议安排的各项任务\n\n# ## 项目沟通管理课后实践\n\n1. ISO9000标准中，大陆、香港、台湾  \n \
    \  有一些术语翻译使用不一致；假如你新到  \n   东莞一外资企业从事质量管理工作，你会  \n   怎么做？\n\n2. 你将要参加IPMP C级面试，请你制定\
    \  \n   小组的沟通计划。\n\n# 三、冲突管理\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_828_0.png)\n\
    \n# ## 主要内容\n\n- 项目冲突的概念\n\n- 冲突的分析\n\n- 冲突来源\n\n- 项目冲突的原因\n\n- 项目冲突的阶段\n\n- 项目冲突的管理\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_829_0.png)\n\n# 1. 项目冲突的概念\n\n1、“矛盾表面化、发生激烈争斗”（《现代汉语词典》）\n\
    2、项目冲突即是项目中产生的矛盾，并引起某种程度上的争执。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_830_0.png)\n\
    \n# ## 1.1 冲突的定义\n\n冲突是两个或两个以上的决策者在\n在某个争端问题上的纠纷。\n\n从心理学的角度讲，冲突是指发生\n于两个或两个以上的当事人，因其对目\n\
    标理解的矛盾以及对自己实现目标的妨\n碍而导致的一种激烈争斗。\n\n# ## 1.2 冲突剖析\n\n1 冲突是发生于两个或两个以上当事人的。\n\n2\
    \ 冲突只有在所有的当事人都意识到了争议存在时才发生。\n\n3 所有的冲突都存在着赢或输的潜在结局；参与冲突的各方为了达到各自的目标总会千方百计地阻碍对方实现其目标。\n\
    \n4 冲突总是以当事人各方相互依存的关系来满足各方的需求。\n\n# ## 1.3 对待冲突有两种观念\n\n1 传统的观念是：害怕冲突，极力避免冲突，消灭冲突，回避冲突。典型表现—和为贵，拉不下面子；\n\
    \n2 现代的观念是：冲突是不可避免的，只要有人群的地方就有可能存在冲突。许多冲突本身并不可怕，可怕的是对待冲突的态度和处理的不当。\n\n有些冲突可以待其发展到一定阶段再合理加以解决\
    \  \n有些冲突如不及时处理，则可能引发混乱，导致项目的失败，危害组织的发展；\n\n# ## 1.4 项目冲突积极性与消极性\n\n处理得好，不仅可以解决矛盾问题，还可以产生创新\n\
    \n处理不好，不仅本身矛盾没解决，还可能引发更多冲突\n\n冲突即矛盾\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_834_0.png)\n\
    \n# 1.5 项目冲突的良、恶分类\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_835_0.png)\n\n\
    判断界定良性/恶性的依据：对目标实现的影响、对团队建设的影响；\n\n# 2. 冲突的分析\n\n在项目环境中，冲突是不可避免的。\n\n大多数情况下，冲突总是因人而起。\n\
    \n如果采取正确的方式，这些冲突通常在不影响计划之前就化解。\n\n认识冲突的起因和来源有助于更好地识别预付冲突和解决冲突。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_836_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_836_1.png)\n\n# ## 冲突产生的起因\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_837_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_837_1.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_837_2.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_837_3.png)\n\n# ## 3.1 冲突来源之一： 项目成员\n\
    \n在项目的进行过程中，项目成员在项目的开始时间、项目进度、实施技术等方挥发生分歧。\n\n涉及到项目组成员的冲突主要有四个方面：\n\n1 项目成员的个性冲突；（遇到挫折的消沉）\n\
    2 队员之间的冲突；（两人无法相处；一人不合团队）\n3 团队之间的冲突；（同一目标不同团队之间的角逐）\n4 团队内部的冲突；（帮派、小集体的内讧）\n\n\
    # 3.3 冲突来源之三：技术问题\n\n当项目采用新技术或需要技术创新时，冲突便随技术的不确定性相伴而来。\n\n> 这种冲突应该属于一种良性冲突，技术问题只有充分的讨论，分析，验证才能有正确的结论。所谓：“不辩不明”就是这个道理。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_841_0.png)\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_841_1.png)\n\
