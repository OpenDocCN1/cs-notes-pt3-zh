    # # 项目进度安排的成果


    # ——细节说明和进度管理计划


    +   细节说明：对于项目进度的支持细节至少应该说明有关的假设和约束，此外还应包括各种应用方面的详细说明，例如：

    +   ·对于建筑项目多数情况下应该包括各种资源的直方图、费用流预测、以及订货和交货计划。

    +   ·对于电子项目：通常主要包括资源直方图。


    +   进度管理计划：主要说明何种的进度变化将应给予处理，可以是正式的或非正式的、详细的说明或基本的框架，它是总项目计划的辅助说明。'
