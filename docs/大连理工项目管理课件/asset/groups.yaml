    # 3.1 资金的时间价值


    +   资金的时间价值：

    +   资金的价值与时间有密切关系，同等数量的资金由于处于不同的时间而产生的价值差异。

    +   在投资者看来，投资的资金其价值随着时间的推移，按一定的复利率呈几何级数增长。


    +   一般地讲，代表资金时间价值的利息是以百分比，即利率来表示的。在商品经济条件下，利率是由以下三部分组成的：

    +   时间价值：即纯粹的时间价值，随着时间的推移而发生的价值增值。

    +   风险价值：现在投入的资金，今后能否确保回收。

    +   通货膨胀：资金会由于通货膨胀而发生贬值。'
