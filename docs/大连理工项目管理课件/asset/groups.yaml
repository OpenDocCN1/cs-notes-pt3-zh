    # 4.3 项目成功度评价法


    依靠评价专家或专家组的经验，综合后评价各项指标的评价结果，对项目的成功程度作出定性的结论；是用逻辑框架法分析的项目目标的实现程度和经济效益分析的评价结论为基础，以项目的目标和效益为核心所进行的全面系统的评价


    # 评价标准：


    +   - 成功的（A）：项目的各项目标都已全面实现或超过；相对成本而言，项目取得巨大的效益和影响


    +   - 部分成功的（B）：项目的大部分目标已经实现；相对成本而言，项目达到了预期的效益和影响


    +   - 不成功的（C）：项目实现的目标非常有限；相对成本而言，项目几乎没有产生什么正效益和影响


    +   - 失败的（D）：项目的目标是不现实的无法实现；相对成本而言，项目不得不终止'
