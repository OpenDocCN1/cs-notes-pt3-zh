    \ 证明材料 自我评估 | Project report 项目报告 | | |\n| 国际项目经理 (IPMA Level C) | 能力 = 知识 + 经验\
    \ + 个人素质 | Application, curriculum vitae, self assessment 申请 履历 自我评估 | 笔试 二选一：\
    \ 案例研讨或短 项目报告 | | |\n| 国际助理项目经理 (IPMA Level D) | Knowledge 知识 | Application, curriculum\
    \ vitae, self assessment 申请 履历 自我评估 | Written exam 笔试 | 无效期 可选： 10 年 |\n\n## 11.关于IPMP考试\n\
    \n- IPMP注重能力考核，能力=知识+经验+个人素质是其基本定义\n- IPMP C级以上考核，级别越高对于经验的要求越严格\n- IPMP 笔试考核注重于解决实际问题的能力，并且试题考核以案例为导向\n\
    - WORKSHOP与案例报告是IPMP特有的考核形式，对于应试者个人素质及解决问题的能力考核非常重要\n- IPMP面试着重于对应试者综合素质的考核，全面了解应试者从事项目管理的理念\n\
    \n## 12.关于IPMP笔试\n\n- IPMP C级(certificated project management professional)\n\
    \  - 以实际案例为导向\n  - 注重项目管理核心方法的考核\n  - 强调方法的应用\n  - 题型为问答题\n\n- IPMP D级(certificated\
    \ project management practitioner)\n  - 注重理论与案例相结合的考核\n  - 相对全面的综合考核\n  - 题型以选择题和问答题相结合\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_5_0.png)\n\n## 13.IPMP的能力考核因素\n\n-\
    \ 基本能力：管理，项目和项目管理，项目背景和利益相关者，系统方法和项目管理，项目管理实施，项目目标，项目成功与失败的准则，项目阶段，项目生命期，标准与指南\n\
    - 社会能力：洞察力，激励，社会化结构，小组和团队，学习型组织，自我管理，领导艺术，冲突管理，特殊交流状况\n- 方法能力：项目结构，过程和时间管理，资源管理，成本管理，财务管理，实施测量和项目进展，项目控制，多项目管理，创新技术，解决问题\n\
    - 组织能力：公司和项目组织，质量管理，合同管理，构型和更改文档管理，项目开始，风险管理，项目信息系统 / 报告，项目结束和评估，人员管理\n- 个人素质：沟通能力；首创精神，务实，热情，激励能力；联系的能力，开放性；灵敏，自我控制，价值鉴赏能力，乐意负责任，人格诚实；解决冲突，辩论文化，公正；解决问题能力，全面思考，公正；忠诚，坚强，乐于助人；领导艺术\n\
    - 总体印象：常理（常识），逻辑和系统，语言 / 文字表达能力，综合能力，明晰，技能，知识水平，经历（阅历）\n\n## 14.IPMP的考核标准\n\n\
    - IPMP D级\n  - 仅有笔试\n  - 笔试总分为160分\n  - 通过标准为110分\n\n- IPMP C级\n  - 笔试160分\n \
    \ - 案例讨论120分\n  - 面试120分\n  - 总分为400分\n  - 通过标准：\n    - 笔试最低100分\n    - 案例讨论+面试最低140分\n\
    \    - 总分最低为280分\n\n## 二、项目\n\n- 项目的概念\n- 项目与企业发展\n- 项目的定义\n- 项目定义的说明\n- 项目的主要属性\n\
    - 项目的三重约束\n- 项目的生命周期\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_8_0.png)\n\n\
    ## 1.认识项目\n\n--NEW Orleans河滩房地产开发项目\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_9_0.png)\n\
    \n## 1.认识项目\n\n# 第15届奥林匹克冬季运动会\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_10_0.png)\n\
    \n## 1.认识项目——一个残疾人的环球旅行\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_11_0.png)\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_11_1.png)\n\n## 2.典型的项目\n\n- 建造一座大楼、一座工厂或一座水库\n\
    - 举办各种类型的活动，如一次会议、一次晚宴、一次庆典等\n- 新企业、新产品、新工程的开发\n- 进行一个组织的规划、规划实施一项活动\n- 进行一次旅行、解决某个研究课题、开发一套软件\n\
    \n> 在当今社会中，一切都是项目，一切也将成为项目。\n> ——美国项目管理专业资质认证委员会主席\n> Paul Grace\n\n## 3. 项目的概念\n\
    \n- 自从有了人类，人们就开展了各种有组织的活动。\n  随着社会的发展，有组织的活动逐步分化为两种类型：\n\n- 一类是连续不断、周而复始的活动，人们称之为“**运作**”（Operations），如企业日常的生产产品的活动；\n\
    \n- 另一类是临时性、一次性的活动，人们称之为“**项目**”（Projects），如企业的技术改造活动、一项环保工程的实施。\n\n## 4. 项目与企业发展\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_14_0.png)\n\n## 5. 项目的定义\n\n项目是一个特殊的将被完成的有限任务，它是在一定时间内，满足一系列特定目标的多项相关工作的总称。\n\
    \n此定义实际包含三层含义：\n\n- 项目是一项有待完成的任务，且有特定的环境与要求\n\n- 在一定的组织机构内，利用有限资源（人力、物力、财力等）在规定的时间内完成任务\n\
    \n- 任务要满足一定性能、质量、数量、技术指标等要求。\n\n## 6. 项目定义涉及的因素\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_16_0.png)\n\
    \n## 7. 项目的主要属性\n\n- 独特性/一次性\n- 多目标属性\n- 生命周期属性\n- 相互依赖性\n- 冲突属性\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_17_0.png)\n\
    \n"
