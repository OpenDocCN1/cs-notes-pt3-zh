    项目效益后评价是项目后评价理论的重要组成部分。它以项目投产后实际取得的效益（经济、社会、环境等）及其隐含在其中的技术影响为基础，重新测算项目的各项经济数据，得到相关的投资效果指标，然后将它们与项目前评价时预测的有关经济效果值（如净现值NPV、内部收益率IRR、投资回收期等）、社会环境影响值（如环境质量值IEQ等）进行对比，评价和分析其偏差情况以及原因，吸取经验教训，从而为提高项目的投资管理水平和投资决策服务。具体包括以下几个方面：


    - 经济效益后评价

    - 环境效益和社会效益后评价

    - 项目可持续性后评价

    - 项目综合效益后评价


    #### 2.4 项目管理后评价


    项目管理后评价是以项目竣工验收和项目效益后评价为基础，在结合其它相关资料的基础上，对项目整个生命周期中各阶段管理工作进行评价。目的是通过对项目各阶段管理工作的实际情况进行分析研究，形成项目管理情况的总体概念。通过分析、比较和评价，能知道目前项目管理的水平。通过吸取经验和教训，来不断提高项目管理水平，以保证更好地完成以后的项目管理工作，促使项目预期目标很好地完成。项目管理后评价包括以下几个方面：


    - 项目的过程后评价

    - 项目综合管理的后评价

    - 项目管理者的评价


    #### 2.5 案例讨论


    如何对项目经理进行综合评价？请根据自己的经验尽可能的提出相应的评价体系和评价方法？


    #### 项目经理评价指标体系


    - 技术能力

    - 计划能力

    - 组织能力

    - 全局观

    - 控制能力

    - 预见性

    - 表达能力


    - 诚实性

    - 效率性

    - 责任心

    - 潜力

    - 判断力

    - 健康


    ### 3.项目后评价的程序


    - 后评价项目的选定

    - 确定后评价计划

    - 确定后评价范围

    - 自我评价

    - 独立后评价

    - 后评价报告


    ### 4.项目后评价的方法


    - 统计预测的原理与方法

    - 对比原则（前后对比、有无对比）

    - 逻辑框架法（LFA）

    - 项目成功度评价法


    #### 4.1 逻辑框架法


    | 层次描述 | 客观验证指标 | 验证方法 | 重要外部条件 |

    |---|---|---|---|

    | 目标 | 目标指标 | 检测和监督手段及方法 | 实现目标的主要条件 |

    | 目的 | 目的指标 | 检测和监督手段及方法 | 实现目的的主要条件 |

    | 产出 | 产出物定量指标 | 检测和监督手段及方法 | 实现产出的主要条件 |

    | 投入 | 投入物定量指标 | 检测和监督手段及方法 | 落实投入的主要条件 |

    '
