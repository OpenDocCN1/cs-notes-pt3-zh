    # 3.3 冲突来源之三：技术问题


    当项目采用新技术或需要技术创新时，冲突便随技术的不确定性相伴而来。


    > 这种冲突应该属于一种良性冲突，技术问题只有充分的讨论，分析，验证才能有正确的结论。所谓：“不辩不明”就是这个道理。


