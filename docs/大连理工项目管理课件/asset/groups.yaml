    +   作用：工作延续时间的估计是项目计划制定的一项重要的基础工作，它直接关系到各事项、各工作网络时间的计算和完成整个项目任务所需要的总时间。若工作时间估计的太短，则会在工作中造成被动紧张的局面；相反，若工作时间估计的太长，会使项目的完工期延长。


