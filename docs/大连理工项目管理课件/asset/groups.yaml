    # 二、项目论证的基本程序


    一个项目论证报告的编制，需要广泛的技术、经济和财务等方面的知识和技能。经过机会研究和初步项目论证后，才开始详细的项目论证。项目论证的目的是为投资决策提供技术、经济和财务依据，因而要分析各有关方面的因素，选择最佳方案并论证其生命力。'
