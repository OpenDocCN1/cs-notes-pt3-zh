    # 四、项目后评价案例


    +   - 项目名称：某船厂10万吨级修船坞项目

    +   - 评价背景：本案例为某船厂扩建船坞工程项目，扩建项目对原有企业产生了什么样的作用和影响是这类项目后评价的重点之一。对于此类项目多采用有无对比的方法，以便准确地分析评价项目的效益及对整个企业的影响。'
