    # # 10.未来企业发展的三大支柱


    +   - 战略管理：面向未来，是企业发展的核心

    +   - 项目管理：面向过程，是企业发展的载体

    +     - 项目管理是战略和营销中间的载体和过渡，它既是一种思维方式和工作方法，也是一种先进的文化理念。

    +   - 营销管理：面向成果，是企业发展的命脉'
