    ## 9. 项目费用决算与审计


    费用决算是指项目从筹建开始到项目结束交付使用为止的全部费用的确定。


    - 决算的依据：项目决算依据主要是合同、合同的变更。

    - 决算的内容：项目决算的内容包括项目生命周期各个阶段支付的全部费用。


    ### 9.1 费用决算的结果


    决算的结果形成项目决算书，经项目各参与方共同签字后作为项目验收的核心文件。决算书由两部分组成：文字说明和决算报表。


    - 文字说明。主要包括工程概况、设计概算、实施计划和执行情况、各项技术经济指标的完成情况，项目的成本和投资效益分析、项目实施过程中的主要经验、存在的问题、解决意见等。

    - 决算报表。分大中型项目和小型项目两种。大中型项目的决算表包括：竣工项目概况表、财务决算表、交付使用财产总表、交付使用财产明细表；小型项目决算表按上述内容并简化为小型项目决算总表和交付使用财产明细表。


    ### 9.2 费用审计


    费用审计贯穿在项目全过程中，包括：


    - 项目计划时期的费用审计

    - 项目实施过程中的费用审计

    - 项目结束时的费用审计


    #### 9.2.1 项目计划时期的费用审计


    - 审计内容：费用估算采用了哪种方法，采用的方法是否合理；费用估算的依据是否合理；费用估算的结果是否准确；费用计划采用了什么方法，方法是否科学，是粗线条还是细线条的；费用计划的依据是否充分；费用计划能否满足控制成本的要求；不可预见费用的数量是否合理等等。

    - 审计的依据：费用预算、费用计划等。

    - 审查的结果：形成审计报告。


    #### 9.2.2 项目实施过程中的费用审计


    - 成本报告的审计。包括审核成本报告的内容是否全面，报告格式是否规范；审查报告与实际发生成本的吻合情况；结合进度报告和质量报告判断成本报告的真实性。

    - 实施成本的审计。主要工作有审查成本的超出和实际支出偏低的情况，查明发生成本与计划成本的偏差幅度及其原因；审查发生的成本是否合理，有无因管理不善造成成本上升的问题；审查成本控制方法、程序是否有效，是否有严密的规章制度；审查有无擅自改变项目范围。若存在成本失控问题，应查明原因，提出整改建议。

    - 审计的依据：成本报告、进度报告、质量报告。

    - 审查的结果：形成审计报告。


    #### 9.2.3 项目结束时的费用审计


    - 项目结束阶段，项目业主要对项目进行全面审计并进行验收，这个时期的费用审计主要进行项目成本审计。其做法是对照项目预算审核实际成本的发生情况，看是超支还是节约。如果超支，要查明是因为成本控制不利还是因为擅自扩大项目范围或乱摊成本所致；如果节约，则要查明是否缩小了项目范围或降低了适宜标准。

    - 审计的依据：成本报告、进度报告、质量报告。

    - 审查的结果：形成审计报告。


    ### 9.3 现代审计特征


    - 审计成为一种社会政治和经济生活的真正需要：需要的程度决定审计发挥作用的范围程度，社会的民主与法律建设发展到一定程度需要对社会各层次的经济责任履行情况进行监督时审计才能全面发挥；市场经济化越高不同主体之间以及与政府社会公众之间经济信息交流越多对作为经济信息可靠性保证手段之一的审计的要求会随之增加。

    - 审计职业规范体系形成，审计方法适应时代需要：建立在内部控制基础上的抽样审计法，强调审计主体对审计结论的责任，用风险基础审计方法体系，计算机网络方法

    - 有一支具有现代知识素养和职业经验的审计队伍


