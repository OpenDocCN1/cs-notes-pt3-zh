    # 项目工作分解注意要点


    +   - 将项目的**产品结构划分**、项目的**阶段划分**以及项目**组织的责任划分**有机地结合起来；

    +   - 最底层的工作包应当便于完整无缺地分派给项目内外的组织或个人，所以各个工作包之间必须有明确的界面。**界面清楚还有利于减少实施过程中的协调工作量**；

    +   - 最底层的工作包应该非常具体，以便承担工作的组织或个人都能明确自己的任务、努力的目标以及承担的责任。越具体越利于监督和业绩考核；

    +   - WBS的每个分支并不一定需要分解到相同的层次；

