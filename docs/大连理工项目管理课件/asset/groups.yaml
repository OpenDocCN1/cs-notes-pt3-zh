    # # 4. 沟通管理的概念


    沟通：为了设定的**目标**，把信息，**思想**和**情感**在个人或群体间传递，并达成共同协**议**的过程。


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_784_0.png)'
  - '[PAGE 785]


    # 5. 项目沟通管理


    项目沟通管理就是要保证项目信息及其正确地提取、收集、传播、存储以及最终进行处置，保证项目信息畅通。


    # 信息编码


    项目信息产生、收集、传播、保存和配置利用的过程，要有规范的信息编码来统一沟通的标准；如作业分类码、资源费用码、WBS编码、作业代码、文件格式标准等，以便于信息汇总、分类与管理。


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_785_0.png)'
  - '[PAGE 786]


    # # 6.项目沟通计划


    项目沟通计划是项目整体计划中的一部分，它的作用非常重要，也常常容易被忽视。


    严格说来，一种高效的体系不应该只在大脑中存在，也不应该仅仅依靠口头传授，落实到规范的计划编制中很有必要。因而，在项目初始阶段也应该包含沟通计划。


    很少有人这样做，认为没必要，或者嫌麻烦！'
