    \  - 现金流量及经济财务分析\n  - 额外的效果\n\n## 第六步：编制项目论证报告\n\n- 项目论证报告其结构和内容常常有特定的要求\n\n##\
    \ 第七步：编制资金筹措计划\n\n- 项目的资金筹措在比较方案时，已作过详细考查，其中一些潜在的项目资金会在与贷款者讨论可行性研究时冒出来。实施中的期限和条件的改变也会导致资金的改变，这些都应根据项目论证报告的财务分析作出相应的调整。同时应作出一个最终的决策，以说明项目可根据协议的实施进度及预算进行。\n\
    \n## 四、项目论证的主要内容\n\n- 市场需求预测\n- 原材料和投入的选择供应\n- 产品结构和工艺方案的确定\n- 生产规模（或生产能力）的确定\n\
    - 技术与设备选择\n- 坐落地点和厂址选择\n- 投资估算\n- 资金筹措\n- 经济评价\n- 国民经济评价\n- 不确定性与综合分析\n\n## 可行性研究基本内容框图\n\
    \n| 研究课题 | 生产什么 | 资源条件 | 企业规模 | 项目方案 | 生产地点 | 三同时措施 | 项目实施 | 人员构成 | 其他 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 重点研究内容 | 市场需求价格销售量 | 原材料能源 | 产品方案建设规模 | 生产工艺设备选型 | 场址运输 | 节能环境劳动安全消防 | 实施进度安排\
    \ | 类别数量培训 | 生产组织机构设置 |\n| 方案优化 | \\multicolumn{9}{c}{产品品种规格、企业规模、工艺方案、设备选型、厂址、基建进度等}\
    \ |\n| 财务分析 | \\multicolumn{5}{c}{估算投资：总额生产收入和成本等} & \\multicolumn{4}{c}{资金筹措：方式、数额、利息等}\
    \ |\n| 经济评价与结论 | \\multicolumn{9}{c}{经济评价和分析} |\n| 财务评价 | 国民经济评价 | 环境评价 | 风险分析\
    \ | 不确定性分析 | | | | |\n\n## 1. 市场需求预测——需求分析的内容\n\n- 市场当前需求的大小与组成，该市场的地域范围\n- 市场细分，主要按以下因素确定：\n\
    \  - 最终用途（如消费者）\n  - 消费者类别（如消费者的不同收入水平）\n  - 地理区域（如区域市场、国内市场和出口市场）\n- 对整个市场及其各部分在项目使用期间的某段时期，最好是头十年的需求预测\n\
    - 拟议中项目在国内与国际竞争发展和消费者反应变化的情况下，在所预测的时期内预期达到的市场渗透率；\n- 作为预测增长与市场渗透依据的大致的订价结构。\n\n\
    ## 1. 市场需求预测——需求预测\n\n(1) 对某一种或几种产品的潜在需求的预测；\n(2) 对潜在供应的估计；\n(3) 对拟议中项目可能达到的市场渗透程度的估计；\n\
    (4) 某段时期内潜在需求的特性。需要有关于这些不同方面的数量和质量数字。\n\n## 1. 市场需求预测——预测方法\n\n- 常用的预测方法：\n  -\
    \ 时间序列预测法\n  - 因果回归预测模型\n  - 消费水平法（包括需求的收入弹性与价格弹性）\n  - 最终用途（消费系数）法\n\n## 1. 市场需求预测——预测程序\n\
    \n### 市场预测基础及预测过程\n\n- 预测基础——市场调查结果\n\n一般应预测 5—10 年。\n\n- 预测过程（预测程序）：\n\n——输入、处理、输出的动态反馈系统。全过程可分为\
    \ 7 个主要步骤和一个反馈过程。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_275_0.png)\n\n##\
    \ 2. 原材料和投入的选择供应\n\n### 原材料和投入的分类\n\n原料（未加工或半加工的）；经过加工的工业材料（中间产品）；制成品（组件）；辅助材料；工厂供应品及公用设施（水、电、气、燃料、废水和废气处理等）。\n\
    \n### 原材料投入的选择与说明\n\n在很多项目中，不同的原材料可用于同一生产，应确定哪一种原材料最为适宜。如果各种可供选择的原料都易于得到的话，问题就在于工艺与技术是否经济。\n\
    \n### 原材料和投入的特点\n\n质量性能、来源和可得数量、单位成本\n\n### 供应计划。\n\n## 2. 原材料和投入的选择供应\n\n- 方案研究内容：\n\
    \  - 确定原材料、燃料的品种、质量和数量\n  - 确定供应来源与方式\n  - 确定运输方式\n  - 选取原材料、燃料的价格\n\n- 方案比选内容：\n\
    \  - 满足生产要求的程度\n  - 采购来源的可靠程度\n  - 价格和运输费用是否经济合理\n\n- 方案比选方法：单位产品边际利润法、盈亏平衡法、原材料最低成本法；运输方式和单位运量费用。\n\
    \n## 3. 技术方案、设备方案和工程方案\n\n### 技术方案：\n\n- 技术方案主要指生产方法、工艺流程等。\n- 技术方案选择基本要求：先进性、适用性、可靠性、安全性、经济合理性\n\
    - 技术方案选择内容：\n  - 生产方法选择\n  - 工艺流程选择\n  - 技术方案比选论证\n  - 比选内容：技术的先进程度、技术的可靠程度、技术对产品质量性能的保证程度、技术对原材料的适用性以及购买技术或者专利费用等技术经济指标。\n\
    \n"
  mdcn: "\n\n## 5.3 风险分析\n\n风险分析又称概率分析，它是使用概率研究预测各种不确定性因素和风险因素的发生对项目评价指标影响的一种定量分析方法。\n\
    \n一般是计算项目净现值的期望值及净现值大于或等于零时的累计概率，累计概率值越大，说明项目承担的风险越小。也可通过模拟法测算项目评价指标（如内部收益率）的概率分析。\n\
    \n在进行风险分析时，先对各参数的值作出概率估计，并以此为基础计算项目的经济效益，最后通过经济效益期望值、标准差、实现概率及离差系数来反映方案的风险和不确定程度。\n\
    \n不确定因素使得未来的经济活动的实际结果可能偏离预期目标，与预期的结果发生偏差，有可能使实际结果低于预期的效果，甚至遭受一定的损失。这就是项目投资的风险所在。\n\
    \n设想状况 ≠ 预测基本方案 ≠ 实施后的结果\n\n风险大小既与损失发生的可能性（概率）成正比，也与损失的严重性成正比\n\n| 关系 | 内容 | 不确定分析\
    \ | 风险分析 |\n|---|---|---|---|\n| 区别 | 内容 | 各种不确定因素对项目效益的影响进行分析，确定敏感因素和敏感程度 | 确定各敏感因素发生的可能性和对项目效益影响发生的可能性\
    \ |\n| 区别 | 方法 | 敏感性分析 | 概率分析 |\n| 区别 | 作用 | 粗略估计项目风险 | 进行详细的风险分析，提出应对风险的措施 |\n\
    | 联系 | | 敏感性分析中敏感性因素和敏感程度是概率分析中风险因素确定的依据 | |\n\n## 常见风险因素的归纳和分解\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_261_0.png)\n\
    \n## 二、项目论证的基本程序\n\n一个项目论证报告的编制，需要广泛的技术、经济和财务等方面的知识和技能。经过机会研究和初步项目论证后，才开始详细的项目论证。项目论证的目的是为投资决策提供技术、经济和财务依据，因而要分析各有关方面的因素，选择最佳方案并论证其生命力。\n\
    \n## 第一步：开始阶段\n\n- 主要是要明确问题，包括\n  - 弄清评价研究的范围\n  - 雇主的目标\n\n## 第二步：资料搜集与分析\n\n\
