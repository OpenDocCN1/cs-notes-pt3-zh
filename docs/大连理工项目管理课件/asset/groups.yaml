    - **IPMP C级**\n  - 笔试160分\n  - 案例讨论120分\n  - 面试120分\n  - 总分为400分\n  - 通过标准：\n\
    \    - 笔试最低100分\n    - 案例讨论＋面试最低140分\n    - 总分最低为280分\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_939_0.png)\n\
    \n## 二、项目\n\n- 项目的概念\n- 项目与企业发展\n- 项目的定义\n- 项目定义的说明\n- 项目的主要属性\n- 项目的三重约束\n- 项目的生命周期\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_940_0.png)\n\n### 3.项目的概念\n\n自从有了人类，人们就开展了各种有组织的活动。随着社会的发展，有组织的活动逐步分化为两种类型：\n\
    \n- 一类是连续不断、周而复始的活动，人们称之为“运作”（Operations），如企业日常的生产产品的活动；\n- 另一类是临时性、一次性的活动，人们称之为“项目”（Projects），如企业的技术改造活动、一项环保工程的实施。\n\
    \n### 5. 项目的定义\n\n项目是一个特殊的将被完成的有限任务，它是在一定时间内，满足一系列特定目标的多项相关工作的总称。\n\n此定义实际包含三层含义：\n\
    \n- 项目是一项有待完成的任务，且有特定的环境与要求\n- 在一定的组织机构内，利用有限资源（人力、物力、财力等）在规定的时间内完成任务\n- 任务要满足一定性能、质量、数量、技术指标等要求。\n\
    \n### 7. 项目的主要属性\n\n- 独特性/一次性\n- 多目标属性\n- 生命周期属性\n- 相互依赖性\n- 冲突属性\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_944_0.png)\n\
    \n### 8. 项目与作业的比较\n\n| 项目 | 作业 |\n|---|---|\n| 独一无二的 | 重复的 |\n| 有限时间 | 无限时间（相对）\
    \ |\n| 革命性的改变 | 渐进性的改变 |\n| 不均衡 | 均衡 |\n| 目标之间不均衡 | 均衡 |\n| 多变的资源需求 | 稳定的资源需求\
    \ |\n| 柔性的组织 | 稳定的组织 |\n| 效果型 | 效率型 |\n| 以完成目标、目的为宗旨 | 以完成任务、指标为宗旨 |\n| 风险和确定型\
    \ | 经验型 |\n\n### 10. 项目的组成要素\n\n- 项目的(界定)范围\n- 项目的组织结构\n- 项目的质量\n- 项目的费用\n- 项目的时间进度\n\
    \n基本\n\n依附于界定和组织\n\n### 11. 项目的生命周期\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_948_0.png)\n\
    \n### 12.项目的分类原则\n\n- 大类：工程、非工程\n- 行业：建筑、制造、农业、医疗、金融、电子、纺织、交通、……\n- 性质：研制、技改、引进、风险投资、产品开发、转包生产、组织活动、……\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_949_0.png)\n\n## 三、项目管理\n\n- [ ] 项目管理的概念\n\
    - [ ] 项目管理的特点\n- [ ] 不同层次项目的管理\n- [ ] 项目管理的主要内容\n\n### 1. 项目管理的定义\n\n项目管理就是以项目为对象的系统管理方法，通过一个临时性的、专门的柔性组织，对项目进行高效率的计划、组织、指导和控制，以实现项目全过程的动态管理和项目目标的综合协调与优化。\n\
    \n### 全生命周期项目管理核心工作要点\n\n- 项目阶段：项目孵化 → 项目启动 → 项目规划 → 项目实施 → 项目交付 → 项目运营\n\n| 类别\
    \ | 项目孵化 | 项目启动 | 项目规划 | 项目实施 | 项目交付 | 项目运营 |\n|---|---|---|---|---|---|---|\n\
    | 目标 | 找到合适的项目 | 赢得项目，成功立项 | 做好项目实施方案 | 项目按计划进行 | 按合同要求交付 | 运行平稳，可持续发展 |\n| 主要工作\
    \ | 市场综合研究；市场需求和机会；项目投资初步分析；项目盈利分析；市场概标；自开发项目研究 | 项目投资分析；项目实施方案；项目可行性报告；商业计划书\
    \ | 项目范围目标；组织构成；工作分解；里程碑计划；网络计划；人力资源配置；费用分解；费用进度控制体系；质量控制体系 | 成本费用控制管理；质量控制管理；项目信息管理；项目风险管理；项目可视管理；过程偏差控制\
    \ | 项目验收；成果交付；项目管理文件交付；资料交付；质量交付；项目决算；项目总结评价 | 发展规划；运营管理；营销 |\n| 输出 | 投标书；项目建议书\
    \ | 项目中标书、合同；项目立项批准书 | 项目各级实施方案 | 过程控制报表；阶段总结报告 | 业主验收报告；项目总结报告 | 计划、报表；财务分析 |\n\
    | 关键 | 市场信息系统；企业核心竞争力；企业决策能力 | 项目相关方需求分析；项目目标细分；技术实现可行度；资源需求可行度；费用分解；项目实施方案可行度；项目相关方公关方案\
    \ | 合同管理；工期、成本、质量控制方案 | 工期、成本、质量控制管理；项目执行偏差分析 | 合同完成偏差分析 | 项目运营管理 |\n"
