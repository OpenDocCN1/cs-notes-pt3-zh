    # # 背景资料


    +   IBM、花旗银行(Citybank)、摩托罗拉(Motorola)、美国运通(American Express)、AT&T等成功企业的经验是：企业项目化管理是企业迎接挑战，面向未来，增强竞争力的有力武器。


    +   这些成功的企业已经学会如何驾驭项目管理的能力，并将它转换成一套组织的哲学，这些公司被视为由「项目组合」而成的动态企业，并采用项目化的管理理念处理他们日常的经营活动。'
