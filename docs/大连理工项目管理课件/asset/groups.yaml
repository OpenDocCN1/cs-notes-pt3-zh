    # # 盈亏平衡点计算方法


    # ## 1)公式计算法


    # ## ·用生产能力利用率表示：


    \( BEP_{\text{生产能力利用率}} = [\frac{\text{年总固定成本 } F}{\text{年销售收入 } S - \text{年可变成本
    } C_v - \text{年销售税金及附加 } T}] \times 100\% \),

    \( = \frac{F}{S - C_v - T} \times 100\% \).


    # ## ·用产量表示：


    \( Q_{BEP} = \frac{\text{年总固定成本 } F}{\text{单位产品价格 } P - \text{单位产品可变成本 } V - \text{单位产品销售税金及附加
    } T} \),

    \( = \frac{F}{P - V - T} \),

    \( = BEP_{\text{生产能力利用率}} \times \text{设计生产能力} \).'
