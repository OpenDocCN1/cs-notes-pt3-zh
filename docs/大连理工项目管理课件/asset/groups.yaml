    \n> 制定一个完美无缺的计划是每一个项目管理人员梦寐以求的，可是，这的确很难！\n\n除了时间因素，复杂项目的不确定因素多，许多情况在计划制定阶段是无法准确预计的，所以也导致计划的欠缺。\n\
    \n## 3.5 冲突来源之五：成本\n\n在项目过程中，经常会由于某项工作需要多少成本而产生冲突。这种冲突多发生在客户和项目团队之间。\n\n在签订合同时，就要考虑有关物件的涨价和降价事宜。\n\
    \n这个涨价了，要追加费用！否则不能按期完工。\n\n#* (%¥#·!\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_843_0.png)\n\
    \n## 3.6 冲突来源之六：资源分配\n\n在资源分配中，首先人员是关键，这会引起很大的冲突。\n\n此外，设备、工具、设施等资源上也是冲突的诱因。\n\
    \n> 资源配置的合理利用，也是非常重要的一个问题。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_844_0.png)\n\
    \n> 我要这个，女士优先。\n\n> 啊、啊、这个…\n\n## 3.7 冲突来源之七：组织结构\n\n在传统的组织结构里，冲突常因队员的惹事生非、自私自利而引起。这种冲突极度有害；在现代的项目组织机构里，冲突还取决于组织的系统结构和各组成部分之间的关系。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_845_0.png)\n\n## 3.8 冲突来源之八：优先权问题\n\
    \n优先权问题有两方面的冲突：工作活动的优先顺序；\n\n资源分配的优先顺序。\n\n确立优先权的责任在上层管理人员，确定的原则是：大家都感到公平和合适。\n\
    \n1 2 3 4 顺序排队\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_846_0.png)\n\n## 3.9\
    \ 冲突来源之九：管理程序\n\n在项目管理中，项目报告的数量，种类以及信息管理渠道等管理程序，也会引发冲突。如：项目成员常常会因信息的获得产生冲突。\n\n\
    为什么不给我们？！\n\n合适的原则是:大家都感到公平和合适。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_847_0.png)\n\
    \n## 4. 项目冲突的原因\n\n### [美]戴维·威尔蒙\n\n- 项目团队队员的专业技能差异越大，其间发生冲突的可能性越大\n- 项目决策人员对项目目标的理解越不一致，冲突越容易发生\n\
    - 项目团队成员的职责越不明确，冲突越容易发生\n- 项目经理的管理权利越小、威信越低，项目越容易发生冲突\n- 项目经理班子对上级目标越趋一致，项目中有害冲突的可能性越小\n\
    - 项目组织中，管理层次越高，由于某些积怨而产生冲突的可能性越大\n\n## 项目管理者就是项目冲突解决者！\n\n> [加]明茨伯格在研究管理者角色时指出管理者其中之角色为“救火员”\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_849_0.png)\n\n## 讨论\n\n企业一号公园定于9月18日晚在现场召开中华环球小姐代言42栋产业别墅活动，由于下雨，活动延期（具体日期未定），但是有一位感兴趣的北京客户不知道延期，下午来到了售楼处；如果你是销售经理，你会怎么办？\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_851_0.png)\n\n## 6. 项目冲突管理\n\n- 1、项目冲突源\n\
    - 2、项目冲突强度\n- 3、项目冲突解决方法\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_852_0.png)\n\
    \n## 6.1 项目冲突源\n\n- 人力资源冲突\n- 成本费用冲突\n- 技术冲突\n- 管理程序冲突\n- 项目优先权冲突\n- 项目进度冲突\n\
    - 项目成员个性冲突\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_853_0.png)\n\n## 6.2 项目进程中平均冲突强度\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_854_0.png)\n\n## 6.3 项目生命周期中冲突强度（项目启动）\n\
    \n| 项目优先权冲突 | 管理程序冲突 | 项目进度冲突 | 人力资源冲突 | 成本费用冲突 | 技术冲突 | 项目成员个性冲突 |\n|---|---|---|---|---|---|---|\n\
    \n## 6.4 项目生命周期中冲突强度（项目规划）\n\n- 项目优先权冲突\n- 项目进度冲突\n- 管理程序冲突\n- 技术冲突\n- 人力资源冲突\n\
    - 项目成员个性冲突\n- 成本费用冲突\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_856_0.png)\n\n\
    ## 6.5 项目生命周期中冲突强度（项目实施）\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_857_0.png)\n\
    \n## 6.6 项目生命周期中冲突强度（项目结束）\n\n项目进度冲突\n\n项目成员个性冲突\n\n人力资源冲突\n\n项目优先权冲突\n\n成本费用冲突\n\
    \n技术冲突\n\n管理程序冲突\n\n## 6.7 项目冲突解决方案\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_859_0.png)\n\
    \n## 6.7.1 回避或撤出\n\n卷入冲突的项目成员一方撤出，有时这不是一种积极的解决途径；特别是工作上的回避。\n\n意义：避免和稀泥；\n\n避免暂时的冲突和争论，没有把问题讨论清楚，认识没有统一；或者把隐患隐藏下来；\n\
    \n## 6.7.2 竞争或逼迫\n\n这种方法的实质就是：“非赢即输”。这种观点认为在冲突中一方获胜或占上风分出输赢或对错，要比“勉强”保持人际关系重要。这是一种积极的的冲突解决方式。\n\
    \n![](img/fbe32c10d6ccd4399895fe061b7ec851_861_0.png)\n\n## 6.7.4 妥协\n\n这种方法的实质是：协商并寻求争论双方在一定程度上都满意。这一冲突解决的主要特征是“妥协”，并寻求一个调和的折中方案。\n\
    \n但两个方案难分优劣时，妥协折中也许是恰当的方式；\n\n项目中A B两组一组认为费用是5万，一组认为是9万；经过妥协，双方都接受了7万，但这不是最好的预计方案。\n\
    \n## 6.7.5 正视\n\n直接面对冲突是克服分歧、解决冲突的有效途径。\n\n# 需要环境：\n\n团队之间的关系是开放的，真诚的、友善的。这样队员之间才能以积极的态度面对冲突，暴露冲突和分歧，经过分析和讨论，寻求到最好的解决方案。\n\
    \n## 6.7.6 解决冲突的5种基本模式的使用几率\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_865_0.png)\n\
    \n## 项目生命周期主要冲突源及建议\n\n(项目启动阶段)\n\n- 优先权 清楚定义的项目计划。联合决策以及与有关部门协商\n- 程序 建立详细的在项目执行中队员都要遵守的管理作业程序。建立理解说明或证明。\n\
    - 进度 在项目开始前建立进度计划。预测其他部门优先权和对项目可能带来的影响。\n\n## 项目生命周期主要冲突源及建议\n\n（项目规划阶段）\n\n|\
    \ 主题 | 建议 |\n|---|---|\n| 优先权 | 通过碰头会向项目计划需求提供反馈 |\n| 进度 | 与志能部门的合作中，完成工作任务包的进度\
    \ |\n| 程序 | 制定关键管理管理问题的预备计划。 |\n\n## 项目生命周期主要冲突源及建议\n\n# （项目实施阶段）\n\n| 冲突源 | 建议\
    \ |\n|---|---|\n| 进度 | 监控与有关部门的沟通，遇见问题并考虑替代方案，确定需要密切监督的问题或方面。 |\n| 技术 | 尽早解决项目技术问题，尽早对项目的技术方案达成共识。\
    \ |\n| 人力 | 尽早预测和协调对人力资源的需求；并确定有关优先权方案。 |\n\n## 项目生命周期主要冲突源及建议（项目结束阶段）\n\n- **进度**：在项目生命期中密切监督进度，及时解决可能影响项目进度的技术问题。\n\
    - **个性和人力**：在项目接近完成时做好人员重新分配计划，与项目班子和写作方保持和谐的工作关系，努力缓解紧张的工作环境。\n\n## 讨论\n\n请各位写下对“和”字的理解。\n\
    \n讨论：以“和”为工具的中国“儒家”传统管理  \n以“竞争”为工具的西方传统管理\n\n"
