  mdcn: "\n## 3. 技术方案、设备方案和工程方案\n\n### 设备方案\n\n- 设备方案选择是在研究和初步确定技术方案的基础上，对所需主要设备的规格型号、数量、来源价格等进行比选。\n\
    - 设备方案选择基本要求：与建设规模、产品方案相适应，设备之间相互配套，质量可靠稳定，经济合理。\n- 设备方案选择内容：\n  - 设备规格、型号、数量，设备来源与投资。\n\
    \  - 超大、超重、超高设备安装的技术措施。\n- 设备方案比选论证\n  - 比选内容：设备对建设方案的满足程度，对产品质量和生产工艺要求的保证程度，设备使用寿命，备品备件保证程度，设备投资等。\n\
    \  - 比选方法：运营成本比较、寿命周期费用比较、差额投资回收期\n\n### 工程方案\n\n- 工程方案是构成项目的实体。其选择是在建设和设备方案的基础上，研究论证主要建筑物、构筑物的建造方案。\n\
    - 工程方案选择基本要求：满足生产使用功能要求、适应已选定场址、符合工程标准规范要求、经济合理等。\n- 工程方案研究内容：\n  - 一般工业项目研究建筑物、构筑物的建筑特征、结构型式以及特殊要求，基础工程方案，抗震等\n\
    - 工程方案比选\n  - 工程方案比选后，编制推荐方案的建筑物、构筑物一览表。\n\n## 4. 生产规模（或生产能力）的确定\n\n### 生产规模或生产能力的定义\n\
    \n- 生产规模或生产能力一般是指一个工厂在一定时期内能够生产的量或单位数。\n\n### 确定可行的企业生产规模\n\n- 最小经济规模和设备限制因素\n\
    - 资金和投入的限制因素\n- 投资费用和生产成本\n\n### 预计的销售额和企业的生产规模\n\n## 5. 坐落地点和厂址选择\n\n### 地点的选择\n\
    \n- 政府政策的作用\n- 注重原材料还是注重市场\n- 当地条件：基础设施和社会经济环境\n\n### 厂址选择\n\n- 土地费用\n- 当地条件\n\
    - 场地整理和开拓\n\n## 6. 环境保护\n\n可行性研究报告中的环境保护篇章是项目建设方案设计的一部分，由可研报告编制单位统一编制，由项目业主审批。主要研究确定项目产生的污染物和污染源，并提出适当的治理措施。\n\
    \n### 环境保护方案设计主要内容\n\n- 环境质量现状调查与分析\n- 污染源和污染因素分析\n- 治理措施\n\n## 投资估算的步骤\n\n- 分别估算各单项工程所需的建设工程费、设备及工器具购置费、安装工程费；\n\
    - 在汇总各单项工程费用的基础上，估算工程建设其他费用；\n- 估算基本预备费、涨价预备费；\n- 加和求得建设投资（不含建设期利息）总额；\n- 在此基础上，计算建设期利息；\n\
    - 估算流动资金；\n- 编制投资估算表和分年度投资计划表；\n- 实际中使用“投资使用与资金筹措计划表”。\n\n## 投资估算计算的内容和方法\n\n\
    | 名称 | 内容 | 估算方法 |\n|---|---|---|\n| 建筑工程费 | 为建造永久性建筑物和构筑物所需要的费用 | 单位建筑工程投资估算法、单位实物工程量投资估算法、概算指标投资估算法\
    \ |\n| 设备 | 购置或自制国产设备 | 标准设备：带有和不带有备件原价，计算时采用带有备件原价 |\n| | 非标设备 | 成本计算估算法、系列设备插入估算法、分部组合估算法、定额估算法\
    \ |\n| 进口设备 | 进口设备货价 FOB/CIF、进口从属费用、国内运杂费 | 具体计算公式 |\n| 工器具购置费 | 不构成固定资产的设施费用\
    \ | 以设备购置费为计算基数乘以费率 |\n| 安装工程费 | 设备装配费用、装备设施工程费用、调试费用 | 按安装工程定额、取费标准和指标估算 |\n\n\
    ### 基本预备费的内容和估算\n\n- 设计变更及施工过程中可能增加工程量的费用\n\n基本预备费 = (建设工程费 + 设备工器具购置费 + 安装工程费\
    \ + 工程建设其他费用) × 基本预备费率\n\n### 涨价预备费的内容和估算\n\n- 在建设期内价格上涨可能引起投资增加而预留的费用\n\n\\(PC\
    \ = \\sum_{t=1}^{n} I_t \\left[ (1 + f)^t - 1 \\right]\\)\n\n\\(I_t =\\) 建设工程费\
    \ + 设备工器具购置费 + 安装工程费\n\n### 建设期利息估算\n\n- 借款额在各年的年初发生：\n\n建设期各年应计利息 = (上一年借款本息累计\
    \ + 本年借款额) × 年利率\n\n- 借款额在各年均衡发生：（常用）\n\n建设期各年应计利息 = (上一年借款本息累计 + 1/2 × 本年借款额)\
    \ × 年利率\n\n### 流动资金的估算\n\n流动资金是指项目投产运营后，为进行正常生产运营，用于购买原材料、燃料，支付工资及其他经营费用等所必不可少的周转资金。它是伴随着固定资产投资而发生的永久性流动资产投资，等于项目投产运营后所需全部流动资产扣除流动负债后的余额。\n\
    \n- 流动资金构成：\n  - 流动资产\n    - 现金\n    - 应收账款\n    - 存货\n  - 流动负债：应付账款\n- 流动资金估算方法：\n\
    \  - 分项详细估算法\n    - 流动资金＝流动资产－流动负债\n    - 流动资产＝应收账款＋存货＋现金\n    - 流动负债＝应付账款\n \
    \   - 流动资金本年增加额＝本年流动资金－上年流动资金\n  - 扩大指标估算法\n    - 按流动资金占某些基数的比例估算。\n    - 基数：销售收入、经营成本、总成本、建设投资\n\
    \    - 流动资金额＝年产值（年销售收入额）×产值（销售收入）资金率\n    - 流动资金额＝年经营成本（年总成本）×经营成本资金率（总成本资金率）\n\
    \n## 8. 项目融资方案\n\n- 项目投资的资金分为项目资本金和债务资金。\n- 项目资本金是指项目投资中由投资者提供的资金，对项目来说是非债务资金，也是获得债务资金的基础。国家对经营性项目试行资本金制度，规定了经营性项目的建设都要有一定数额的资本金，并提出各行业项目资本金的最低比例要求。\n\
    - 资本金筹措分为新设项目法人资本金筹措和既有法人资本金的筹措。\n- 债务资金是项目投资中除资本金外，需要从金融市场借入的资金。主要来源：\n  - 信贷融资\n\
    \  - 债券融资\n  - 融资租赁\n\n### 融资方案分析\n\n- 在初步确定项目的资金筹措方式和资金来源后，应进一步对融资方案进行分析，比选并推荐资金来源可靠、资金结构合理、融资成本低、融资风险小的方案。\n\
    - 融资方案分析包括：\n  - 资金来源可靠性分析\n  - 融资结构分析\n  - 融资成本分析\n  - 融资风险分析\n\n## 10. 财务评价\n\
    \n财务评价包括两方面内容：\n\n- 一是财务评价的准备工作——基础数据和参数的确定、估算和分析；基础数据分为两类：一类是计算用数据和参数；另一类是判别用的参数。\n\
    - 二是进行财务分析与评价，包括盈利能力分析、偿债能力分析。\n\n盈利能力分析是在现金流量表、损益表的基础上计算财务内部收益率、财务净现值、投资回收期和投资利润率等指标，分析项目的盈利能力。\n\
    \n偿债能力分析主要是编制借款还本付息计划表，计算利息备付率、偿债备付率或借款偿还期等指标来考察拟建项目的偿债能力。\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_296_0.png)\n\
    \n### 财务评价（基础数据的分析估算）\n\n![](img/fbe32c10d6ccd4399895fe061b7ec851_297_0.png)\n\
