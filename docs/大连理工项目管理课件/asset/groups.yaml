  md: "\n## （三）项目财务评价\n\n### 1. 年销售收入和年销售税金及附加估算\n\n- （1）产品产量：N产品年产2.3万吨。\n- （2）产品销售价格以近几年国内市场已实现的价格为基础，预测到生产期初的市场价格，每吨出厂按15400元计算。\n\
