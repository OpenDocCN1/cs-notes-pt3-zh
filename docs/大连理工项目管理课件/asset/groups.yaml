    # # 总时差与自由时差


    +   总时差是工作的LF与EF之差，是不影响整个工期工作可利用的机动时间，一旦某工作占用了一些时差，相关工作总时差就减少


    +   总时差为零的工作是关键工作，总时差小于零说明不能如期完工


    +   自由时差是一道工作不影响后续工作最早开工，工作可机动使用的时间自由时差=后续工作ES -紧前工作ES -D'
  - "[PAGE 506]\n\n# # 时差（机动时间）计算\n\n总时差的计算  \n总时差 = LF - EF  \n或  \n总时差 = LS - ES\
    \  \n自由时差  \n自由时差 = min{ES(紧后工作)} - EF"
