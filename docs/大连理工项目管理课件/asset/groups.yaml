    \ 转移支付的主要内容包括：\n  - 国家和地方政府的税收\n  - 国内银行借款利息\n  - 国家和地方政府给予项目的补贴\n- 计算国民经济评价指标并进行方案比选\n\
    \  - 指标：经济净现值、经济内部收益率\n\n### 1. 国民经济评价\n\n### 指标计算\n\n#### 1) 经济内部收益率\n\n对应指标：\n\
    \n$$\\sum_{t=1}^{n}(B-C)_t(1+EIRR)^{-t}=0$$\n\nEIRR ≥ 社会折现率 i_s，则投资项目可以接受；\n\n\
    - 目前 i_s = 10%\n- i_s 的作用：\n  1. 间接调控宏观投资规模\n  2. 影响项目的选优和方案的比选\n\n#### 2) 经济净现值\n\
    \n$$ENPV=\\sum_{t=1}^{n}(B-C)_t(1+i_s)^{-t}$$\n\nENPV > 0，则投资项目可以接受。\n\n## 12.\
    \ 不确定分析与综合分析\n\n### 综合分析\n\n### 不确定性分析\n\n- 产生不确定性的最普遍原因有：通货膨胀、技术变革、额定生产能力测定失实以及施工期和试车期的长短。\n\
    - 不确定分析分为三个步骤进行：盈亏平衡点分析、敏感性分析和概率分析\n\n### 综合分析\n\n- 政治和国防评估；工业配置评估；发展地区经济或部门经济的评估；提高国家、地区和部门科技水平的评估；减少进口、节约外汇和增加出口、创造外汇的评估；环境保护和生态平衡的评估；节约能源的评估；节约劳动力和提供就业机会的评估；产品质量评估；提高社会福利和人民物质文化生活的评估。\n\
    \n## 五、项目论证报告书的格式\n\n- 第一章 实施要点\n- 第二章 项目背景和历史\n- 第三章 市场和工厂生产能力\n- 第四章 原材料和投入\n\
    - 第五章 坐落地点和厂址\n- 第六章 项目设计\n- 第七章 工厂机构和管理费用\n- 第八章 人力\n- 第九章 项目执行时间安排\n- 第十章 财务和经济评价\n\
    \n## 第一章：实施要点\n\n实施要点这一章反映了项目论证报告各个章节的最关键部分及其最基本的结论，包括：\n\n- 项目背景和历史\n- 市场和工厂生产能力\n\
    - 原材料和投入\n- 座落地点和厂址\n- 项目设计\n- 工厂机构和企业管理费用\n- 人力\n- 执行时间安排\n- 财务和经济评价\n- 结论\n\n\
    ## 第三章：市场和工厂生产能力\n\n在拟定项目前，应当分门别类地确定当前市场有效需求的规模和组成情况，以便估计某一产品可能的市场渗透程度。本章主要包括以下几个方面：\n\
    \n- 需求和市场预测\n- 产品和副产品的销售预测和销售\n- 生产计划\n- 工厂的生产能力\n\n## 第四章：原材料和投入\n\n本章讨论关于制造规定的产品所需原材料和投入的选择和说明以及供应计划的确定和原材料费用的计算等。即本章主要包括以下两个方面：\n\
    \n- 原材料和投入\n- 供应计划\n\n## 第五章：座落地点和厂址\n\n项目论证报告必须说明适合于所考虑的项目的地点或厂址。应该从一个相当大的地理区域选择地点，还必须从中多考虑几个可供选择的厂址，一旦选定厂址就要研究建立和经营工厂对周围环境的影响。本章主要包括以下几个方面：\n\
    \n- 座落地点\n- 厂址\n- 当地条件\n- 对环境的影响\n\n## 第六章：项目设计\n\n本章主要包括以下几个方面：\n\n- 项目范围\n-\
    \ 项目布局\n- 技术\n- 设备\n- 土建工程\n\n## 第七章：工厂机构和管理费用\n\n制订机构规划将使得计算管理费用成为可能，而管理费用在有些项目中对项目的盈利性可以有决定意义。要对管理费用作出现实估价，必须把全厂可行地分成几个组成部分（生产、服务和行政等成本项目）。即本章主要包括以下两个方面：\n\
    \n- 工厂机构\n- 企业管理费用\n\n## 第八章：人力\n\n在工厂的生产能力及所使用的生产过程确定之后，有必要对审议中项目的各级管理部门所需人员作出规定；对生产和其它有关活动进行估价时，应同时对项目各个阶段各级人员所需要的培训进行估计。即本章主要包括以下两个方面：\n\
    \n- 工人\n- 职员\n\n## 第九章：项目执行时间安排\n\n项目执行时期是指从决定投资到开始大规模生产这段时期。这一时期包括谈判和签订合同、项目设计、施工和试运转等若干阶段。为了调节这些活动，在项目论证报告中应编制并提出最佳执行计划和时间安排。本章主要包括以下几个方面：\n\
    \n- 项目执行的基本数据和活动\n- 项目执行计划和时间安排的选择\n- 项目执行的成本估计\n\n## 第十章：财务和经济评价\n\n项目编制应当符合财务和经济评价的要求。在进行财务评价时最好采用动态评价方法，并结合采用敏感性分析。同时，还应从项目对国民经济的直接和间接影响方面对项目进行评价。\
    \ 本章主要包括以下几个方面：\n\n- 总投资费用\n- 项目筹资\n- 生产总成本\n- 财务评价\n- 国民经济评价\n\n## 六、项目论证案例\n\
    \n某化学纤维厂经济评价\n\n### （一）项目概述\n\n某化学纤维厂是新建项目，其项目经济评价是在完成市场需求预测、生产规模、工艺技术方案、原材料、燃料及动力的供应、建厂条件和厂址方案、公用工程和辅助设施，环境保护、工厂组织和劳动定员以及项目实施规划诸方面进行研究论证和多方案比较后，确定了最佳方案的基础上进行的。\n\
    \n项目生产国内外市场均较紧俏的某种化纤N产品。这种产品是纺织品不可缺少的原料，国内市场供不应求，每年需要一定数量的进口。项目投产后可以产顶进。\n\n主要技术和设备拟从国外引进。\n\
    \n厂址位于城市近郊，占地250亩，靠近铁路、公路、码头，并靠近主要原料和燃料产地，水、电供应可靠。\n\n该项目主要设施包括生产车间、与工艺生产相适应的辅助生产设施、公用工程以及有关的生产管理、生活福利等设施。\n\
    \n### （二）项目的基础数据（1）\n\n#### 1. 生产规模和产品方案\n\n生产规模为年产2.3万吨N产品。产品方案为棉型及毛型二种，以棉型为主。\n\
    \n#### 2. 实施进度\n\n项目拟三年建成，第四年投产，当年生产负荷达到设计能力的70%，第五年达到90%，第六年达到100%。生产期15年计算，计算期为18年。\n\
    \n### （二）项目的基础数据（2）\n\n#### 3. 总投资估算\n\n##### (1) 固定资产投资估算\n\na. 固定资产投资估算额为42542万元，其中外币3454万美元。外汇按国家外汇管理局1992年6月份公布的外汇牌价1美元=5.48无人民币计算\n\
    \nb. 固定资产投资方向调节税估算按国家规定本项目投资方向调节税税率为5%，投资方向调节税估算值为2127万元。\n\nc. 建设期利息估算为4319万元，其中外汇为469万美元\n\
    \n##### (2) 流动资金估算\n\n流动资金估算是按分项详细估算法进行估算，估算总额为7084万元。\n\n##### (3) 总投资=固定资产投资+固定资产投资方向调节税+建设期利息+流动资金\
    \ = 42542 + 2127 + 4319 + 7084 = 56072 万元\n\n### （二）项目的基础数据（3）\n\n#### 4. 资金来源\n\
    \n（1）项目自有资金(资本金)为16000万元，其余为借款，外汇全部通过中国银行向国外借款，70%由中国工商银行代款，年利率为8.64%。\n\n（2）投资分年使用计划按第一年20%，第二年55%，第三年25%的比例分配。\n\
    \n#### 5. 工资及福利费估算\n\n全厂职员为1140人，工资及福利费按每人2800元估算，全年工资及福利费为320万元(其中福利费按工资总额的14%计取)。\n\
    \n"
