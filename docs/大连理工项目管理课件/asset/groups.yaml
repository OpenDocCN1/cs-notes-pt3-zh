    © 2010 School of Software, Dalian University of Technology\n\n## 3. 项目范围的确定\n\n\
    ### 项目范围管理的关键术语 （按重要性排序）\n\n- WBS\n- 范围定义与分解：过程\n- 项目章程\n- 项目选择标准\n- 范围核实\n- 范围管理定义\n\
    - WBS词典\n- 目标管理（MBO）\n- 限制条件、纠偏措施、工作范围（SOW）\n\n### 案例：现实中的范围管理问题\n\n- 在某管理系统开发项目中，由于甲乙双方对文档管理与办公自动化系统两个概念的理解发生差异，在项目执行过程中产生争执，造成人员的计划调整、窝工和工期拖延，并影响团队的士气。\n\
    - 在某抽水蓄能电站中，关于隧洞灌浆要求不明（设计图纸没有针对不同的围岩类型说明灌浆的技术要求）引起的范围变更，造成工期和费用的索赔；\n- 材料或技术等级标准？\n\
    - 某建筑物承包合同有关室外场地竣工验收问题上存在模糊性，双方在场地平整的范围、是否包括排水和绿化等问题上出现分歧，造成项目的预算变更和工期推迟；\n\n\
    ### 项目范围管理的要达到的目的\n\n- 为项目实施提供任务范围的框架\n  - 项目范围及其构成（WBS及其词典）；\n  - 排除对于与完成项目目标无关的工作；\n\
    \n- 对项目的实施提供有效的控制\n  - 与确认的项目范围不断进行对比，寻找偏差；\n  - 变更控制与异常处理\n  - 根据偏差产生的损益（包括项目将产生的商业利益）情况，决定是放弃项目以免造成更大的损失，还是对范围进行调整，并采取相应的纠偏行动。\n\
    \n### 对“范围”的定义\n\n项目范围管理中所指的“范围”是产品范围和项目范围两个概念的总和。\n\n- 产品范围：\n  - 是指一个产品（服务）应该具有的特性和功能；\n\
    \  - 标志产品范围完成的对比依据是产品（需求）说明。\n\n- 项目范围：\n  - 是指为提交上述具有该特性与功能的产品所必须完成的各项活动，包括管理工作和施工活动；\n\
    \  - 项目范围的完成是以项目计划的完成为对比依据的。\n\n### 项目范围管理\n\n项目范围管理是指项目组织通过所需的管理过程，确保项目范围内的所有工作（且仅仅是这些工作，无关工作必须排除在管理范围之外）得以圆满完成，最终实现项目产品所需的特性与功能。\n\
    \n> Do what the customer asked for, no more and no less\n\n项目要求的提交成果可能是分阶段提交的，每一个提交成果可能包含多个辅助部分，每个辅助部分都有其相应的范围管理。\n\
    \n“工作包”范围管理：项目的某个单元工程。\n\n### 范围 Vs 需求\n\n- 项目范围有时就是一系列更加详细的需求说明文件的总和；\n- 组织业务必须反映客户需求的变化；\n\
    - 通过不断进行范围变更，以按客户所做的工作没有盲顾客户为什么总是反反复复？\n\n- “客户怎么好象总是反反复复、粘粘乎乎的”，比如，开始提需求的时候和顾问表达了三点意见，顾问开始做方案以后又告诉顾问两点详细说明，看到顾问的方案以后，客户好象受了启发，一下子又冒出了五点六点的需求要顾问实现。\n\
    \n### 范围管理中的三个重要概念\n\n- 项目章程（project charter）\n- 项目范围说明书\n- 产品说明书\n\n- 开展该项目的商业目的是什么？\n\
    - 产品的特性与功能，开始时可能较粗，随项目进展而逐步明确；\n- 产品（服务）与商业目的（或刺激因素）之间的关系。\n- 项目提交成果：各种中间及最终成果；\n\
    - 项目目标：至少包括成本、进度、质量等的定量指标。\n\n### 项目范围与其它项目管理领域\n\n项目范围管理过程和项目管理的其它管理领域之间有着非常密切的关系，它们之间相互交叉、相互影响。\n\
    \n- TIME\n- COST\n- QUALITY\n- RISK\n- HUMAN RESOURCE\n- PROCUREMENT\n- COMMUNICATION\n\
    \n### 制定项目范围计划\n\n- 编写一份书面的项目范围说明书（scope statement，作为未来项目或项目阶段验收决策的基础）以及项目范围管理计划的过程。\n\
    - 项目范围说明书在所有的项目干系人之间达成对项目范围共识，也是识别和决定范围变更的依据。\n\n- 项目的驱动因素\n- 项目产品说明书\n- 项目的主要提交成果\n\
    - 项目的目标\n\n### 范围定义出现问题的几种情况\n\n- 标准选择问题\n- 词汇的二意性或模糊性\n- 缺乏合格技术翻译造成误解\n- 武断地下结论\n\
    - 断章取义，忽视限制条件\n- 本身很难进行范围界定\n- 重视重点，轻视次重点\n- 缺乏应有的知识\n- 故意造成范围模糊\n\n> 肯定是。。。\n\
    > 当。。时。。。\n> 管理与自动化。。\n> 10万元承诺。。\n\n### 项目范围的细分\n\n项目范围的细分，是指将项目范围说明书中描述的项目主要提交成果，按照一定的结构层次，进一步分解为更小、更加便于控制和管理的许多组成部分。——建立项目工作分解结构（WBS）\n\
    \n#### 细分项目范围的目的\n\n- 提高项目成本、工期和资源估算的准确性\n- 为项目实施的绩效度量和控制确定基准\n- 便于明确分配任务和责任\n\
    \n"
