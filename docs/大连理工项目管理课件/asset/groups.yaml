    \n## 6. 项目论证的质量、时间和费用\n\n| 研究阶段 | 投资误差百分比（论证质量） |\n|----------|---------------------------|\n\
    | 机会研究 | ±30% |\n| 初步项目论证 | ±20% |\n| 详细项目论证 | ±10% |\n\n研究的深度与时间、费用成正比：机会研究粗略，时间可能只要一个月；项目论证复杂而且详细，有的项目论证时间可能需要一、二年。\n\
