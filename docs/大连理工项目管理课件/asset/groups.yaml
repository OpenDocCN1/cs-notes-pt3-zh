    - （2）在社会折现率为12%时，全部投资的经济净现值为8192万元，大于零。这说明国家为这个项目付出代价后，除得到符合社会折现率的社会盈余外，还可以得到8192万元现值的超额社会盈余，所以该项目是可以考虑接受的。\n\
