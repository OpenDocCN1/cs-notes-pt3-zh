    ## 四、风险管理


    - 不确定性

    - 风险的定义

    - 风险的属性

    - 风险的类型

    - 风险分析

    - 项目风险


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_872_0.png)


    ### 1. 不确定性


    不确定性，是与风险紧密联系的概念。


    由于人们对于将来活动或事件一般不能掌握全部信息，因此事先不能确知最终会产生什么样的后果，这种现象就叫不确定性。


    有关活动或事件的信息掌握的越充分，不确定性越小。


    ### 1.1 不确定性有三种类型


    说明或结构的不确定性。


    指人们由于认识不足，不能清楚地描述和说明项目的目的、内容、范围、组成和性质以及项目同环境之间的关系。


    例如：算某个项目引进投资回报率，年产50万台，70万台，100万台都卖出去算回报率8/6/4年就收回成本！


    计量的不确定性。


    指在确定项目变量数值大小时由于缺少必要的信息、尺度或准则而产生的不确定性。


    例如：准则举例：房产开发商将部分公建绿地改为停车位，这对物管和有车业主有利，但对一般住户则不一定。


    事件后果的不确定性


    - 干事情前不知道后果或程度会怎样。

    - 例如：经常没有把握，只好试一试。修理精密仪器，哑巴治成聋子。

    - 电路排故：

    - 不会进行电路分析计算，只好试不同的器件。

    - 高层决策失误的例子教训多！私利只是极小的一部分，更多的是尽往好处想；想当然。


    ### 1.2 案例分析


    慎密思维的典范：


    树上有十只鸟，开枪打死一只，还剩几只？


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_877_0.png)


    某日，老师在课堂上想看看一学生智商有没有问题，问他：


    "树上有十只鸟，开枪打死一只，还剩几只？"


    他反问：


    "是无声手枪或别的无声的枪吗？"


    "不是。"


    "枪声有多大？"


    "80—100分贝。"


    "那就是说会震的耳朵疼？"


    "是。"


    "在这个城市里打鸟犯不犯法？"


    "不犯。"


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_878_0.png)


    "您确定那只鸟真的被打死啦？"


    "确定。"老师已经不耐烦了"拜托，你告诉我还剩几只就行了，OK"


    "OK，树上的鸟里有没有雀子？"


    "没有。"


    "有没有关在笼子里的？"


    "没有。"


    "边上还有没有其他的树，树上还有没有其他鸟？"


    "没有。"


    "有没有残疾的或饿的飞不动的鸟？"


    "没有。"


    (2)


    > "会不会一枪打死两只？"

    >

    > "不会。"

    >

    > "所有的鸟都可以自由活动吗？"

    >

    > "完全可以。"

    >

    > “如果您的回答没有骗人，”学生满怀信心地说，“打死的鸟要是挂在树上没掉下来，那么就剩一只，如果掉下来，就一只不剩。”


    老师晕倒！


    （4）


    ### 2. 风险的定义


    当活动或项目具有：


    - 1 与损失或收益相关时；

    - 2 涉及到某种或然性或不确定性；

    - 3 涉及到某种选择时；


    才称为有风险。


    风险的定义：


    所有影响项目目标实现的客观不确定性事件或因素的集合，是在项目管理中不希望发生的。


    ### 2.1 风险来源


    给项目带来机会、造成损失或损坏、人员伤亡的原因就是风险。


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_883_0.png)


    ### 2.2 风险的转化条件和触发条件


    风险是潜在的，只有具备了一定条件时，才有可能发生风险事件。这一定的条件称为转化条件。即使具备了转化条件，风险也不一定演变成风险事件。只有具备了另一些条件时，风险事件才会真的发生，这后面的条件称为触发事件。


    > 了解转化条件和触发条件及其过程对于控制风险非常重要。控制风险，实际就是控制转化条件和触发条件。


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_884_0.png)


    ### 3. 风险的属性


    #### 1、风险事件的随机性


    #### 2、风险的相对性


    #### 3、风险的可变化


    风险事件的发生及其结果都具有偶然性。符合某种统计规律。


    同一风险对不同的主体有不同的影响，甚至有好坏的不同。


    风险在一定条件下可以反向转化


    风险性质变化


    风险结果发生变化


    出现新风险


    ### 4. 风险的类型


    - 纯粹风险、投机风险

    - 自然风险、人为风险

    - 可管理风险、不可管理风险

    - 总体风险、局部风险

    - 可预测风险、不可预测风险

    - 不同承担者的风险


    ![](img/fbe32c10d6ccd4399895fe061b7ec851_886_0.png)


    - 项目业主风险 政府风险 承包商风险 投资方风险 设计单位风险

    - 监理单位风险 供应商风险 担保方风险 保险公司风险等


    ### 5. 风险管理


    利用科学的方法去识别风险、评价风险并设计、实施有效的方法去控制风险。


    ### 5.1 案例分析


    ### 钢筋砼下水管泄漏污染地下水源的风险分析


    背景资料：90%的地下水源污染是由（水泥管）下水管泄漏造成的。


    | 故障模式 | 危害度 | 原因分析 | 发生概率 | 补救代价 | 应对方案 |

    |---|---|---|---|---|---|

    | 下水管泄漏 | 污染地下水源污染物分类：1. 生活污水洗涤剂等化学制剂2. “产业”废水 | 水泥管寿命短，到寿；水锤管抗渗透性差；水泥管耐压性差；硬接头沉降位移密封失效连接低劣接头泄漏胶片老化软接头连接低劣密封失效
    | 需统计水泥管有关技术指标的可靠性参数；地质状况；承载及环境状况； | | 水泥管替代物方案研究合同规定水泥管定点采购水泥管品质保证措施承建商管路铺设质量控制
    |


