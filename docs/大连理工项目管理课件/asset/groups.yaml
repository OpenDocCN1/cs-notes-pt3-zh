    # 1. 市场需求预测——需求分析的内容


    +   - 市场当前需求的大小与组成，该市场的地域范围

    +   - 市场细分，主要按以下因素确定：

    +     - 最终用途（如消费者）

    +     - 消费者类别（如消费者的不同收入水平）

    +     - 地理区域（如区域市场、国内市场和出口市场）

    +   - 对整个市场及其各部分在项目使用期间的某段时期，最好是头十年的需求预测

    +   - 拟议中项目在国内与国际竞争发展和消费者反应变化的情况下，在所预测的时期内预期达到的市场渗透率；

    +   - 作为预测增长与市场渗透依据的大致的订价结构。'
