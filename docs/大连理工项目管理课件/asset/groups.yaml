    # 1.3 项目验收的依据


    +   - 工作成果，即项目计划实施后的结果

    +   - 成果文档。进行项目验收时，项目班子必须向接收方出示说明项目（或项目阶段）成果的文档，如项目计划、技术要求说明书、技术文件、图纸等，供其审查。'
