    # 6. 评价结论和主要经验


    # 几点教训


    +   - 项目前期的投资估算不能人为地加以“控制”，应该实事求是，否则将给项目在资金筹措、工程进度、生产运行等方面带来一系列困难。这是项目决策和初步设计时急待解决的一个重要问题。

    +   - 工程地质勘探是项目前期工作的一个重要环节，应加强该方面的工作

    +   - 设计部门的概预算应及时提供，以免影响投资的计划安排；竣工验收时，设计单位应按时提供竣工图，以利总结经验教训。'
