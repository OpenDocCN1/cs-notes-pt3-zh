    # 项目三坐标管理的概念


    # ——项目目标约束的反映与平衡


    # □ 项目管理的三坐标管理体系


    +   一项目的进度管理是项目能否按期实现的基本保证


    +   一项目的费用管理是对实现项目所需要的经费进行合理有效的管理，使得项目的费用支出与进度相协调


    +   一项目的质量管理是使所实施的项目达到设计质量及技术指标的关键，是项目得以顺利完成的基础'
