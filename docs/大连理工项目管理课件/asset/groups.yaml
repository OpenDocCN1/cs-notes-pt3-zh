    ## 项目是一个特殊的将被完成的有限任务，它是在一定时间内，满足一系列特定目标的多项相关工作的总称。


    ## 此定义实际包含三层含义：


    - 项目是一项有待完成的任务，且有特定的环境与要求

    - 在一定的组织机构内，利用有限资源（人力、物力、财力等）在规定的时间内完成任务

    - 任务要满足一定性能、质量、数量、技术指标等要求。


    项目管理就是以项目为对象的系统管理方法，通过一个临时性的、专门的柔性组织，对项目进行高效率的计划、组织、指导和控制，以实现项目全过程的动态管理和项目目标的综合协调与优化。


    - 项目范围（Project Scope）是指为交付具有规定特征与功能产品、服务或成果所必须完成的工作。也可以说是产生项目产品所包括的所有工作及产生这些产品所用的过程。项目干系人必须在项目要产生什么样的产品方面达成共识，也要在如何生产这些产品方面达成一定的共识。

    - 质量是产品或服务的总体特征和特性，基于此能力来满足明确或隐含的需要。


    ## 矩阵型组织


    - 按照职能划分的纵向领导系统和按项目（任务或产品）划分的横向领导系统相结合的组织形式。这种纵横交叉的领导系统构成了矩阵结构，故名。又称任务组织或项目组织。矩阵型组织已广泛运用于行政组织和其他组织。


    - 甘特图：它是以图示的方式通过活动列表和时间刻度形象地表示出任何特定项目的活动顺序与持续时间。

    - PMI是世界领先的非营利会员协会的项目管理专业机构

    - PMP（Project Management Professional）指项目管理专业人士资格认证。美国项目管理协会（PMI）举办的项目管理专业人员（PMP）认证考试在全球180多个国家和地区推广，是目前项目管理领域含金量最高的认证。获取PMP证书，不仅提升项目经理的项目管理水平，也直接体现项目经理的个人竞争力，是项目管理专业人士身份的象征。


    项目干系人又称为项目相关利益者，是指积极参与项目、或其利益会受到项目执行或完成情况影响的个人或组织。项目干系人对项目的目的和结果施加影响。项目管理团队必须识别项目干系人，确定他们的需求和期望，尽最大可能地管理与需求相关的影响，以获得项目的成功。


    PMBOK是Project Management Body Of Knowledge的缩写，即项目管理知识体系，是美国项目管理协会（PMI）对项目管理所需的知识、技能和工具进行的概括性描述。


    ## BCWS,BCWP都是预算，ACWSP是实际


    - 指标：BCWS表示计划的任务对应的预算成本；ACWP表示实际完成的任务对应的实际成本；BCWP表示实际完成的任务对应的预算成本，就是挣值（EV）。

    - 成本差异：CV=BCWP-ACWP，都是实际完成的任务，比较预算成本和实际成本之差。

    - 进度差异：SV=BCWP-BCWS，都是预算成本，比较实际完成的任务和计划中应完成的任务。


    ## 复习纲要


    - “一切活动皆项目”，“成也项目管理，败也项目管理”，谈谈你对这些说法的看法。

    - 可行性研究包括哪些内容？应注意哪些问题？

    - 就你所知，谈谈质量管理的一些理念和技术。

    - 项目经理与职能部门经理的角色有何异同？说说项目经理应具备的技能与素质。

    - 什么是项目的“三约束”？你认为保障项目成功的最主要的因素/条件有哪些？

    - 项目前期评价与后期评价的区别是什么？

    - 项目的组织结构有几种类型？各有什么特点？

    - 项目团队发展有哪四个阶段，你认为怎样的团队是一个有效的团队？


