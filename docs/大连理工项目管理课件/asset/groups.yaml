    ## 工作相互关系确定的主要内容


    ① **强制性逻辑关系**的确定：这是工作相互关系确定的基础，工作逻辑关系的确定相对比较容易，由于它是工作之间所存在的内在关系，通常是不可调整的，主要依赖于技术方面的限制，因此确定起来较为明确，通常由技术和管理人员的交流就可完成。


    ② **组织关系**的确定：对于无逻辑关系的那些工作，由于其工作先后关系具有随意性，从而将直接影响到项目计划的总体水平。工作组织关系的确定一般比较难，它通常取决于项目管理人员的知识和经验，因此组织关系的确定对于项目的成功实施是至关重要的。


    ③ **外部制约关系**的确定：在项目的工作和非项目工作之间通常会存在一定的影响，因此在项目工作计划的安排过程中也需要考虑到外部工作对项目工作的一些制约及影响，这样才能充分把握项目的发展。


