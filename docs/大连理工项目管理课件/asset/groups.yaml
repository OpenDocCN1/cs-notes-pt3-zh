    \ |\n| 年利润总额 | 万元 | 1407 | — | 5499 |\n| 投资利润率 | % | 8.4 | — | 11.95 |\n| 内部收益率\
    \ | % | 6.34 | — | 8.35 |\n| 投资回收期 | 年 | 12.2 | — | 8.02 |\n| 借款偿还期 | 年 | 13.8\
    \ | — | 14 |\n| 年销售利润率 | % | 14.2 | — | 37 |\n\n项目的赢利能力、清偿能力和抗风险能力是比较强的。\n\n**项目对企业效益所产生影响**\n\
    \n通过评价有无对比的形式分析企业的利润指标\n\n| 单位 | 指标 | 有项目 | 无项目 | 有:无 | 项目后 | 项目前 | 后:前 |\n|---|---|---|---|---|---|---|---|\n\
    | 修船分厂 | 销售收入（万元） | 24041 | 9203 | 2.6:1 | 24041 | 13812 | 1.7:1 |\n| 修船分厂 | 销售利润率（%）\
    \ | 29 | 17 | 1.7:1 | 29 | 31 | 0.9:1 |\n| 某船厂 | 销售收入（万元） | 46731 | 31875 | 1.5:1\
    \ | 46731 | 47174 | 1.0:1 |\n| 某船厂 | 销售利润率（%） | 4 | -11 | — | 4 | 5 | 0.8:1 |\n\
    \n分析认为，由于1995年以来修船造船单价下滑20%，企业销售收入下降，如果该船厂目前没有修建新船坞的话，可能面临亏损。因此，项目的建成对于该船厂的企业效益产生了积极影响。\n"
