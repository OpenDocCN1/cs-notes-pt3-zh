    # # BCWS,BCWP都是预算，ACWSP是实际


    +   1， 指标：BCWS表示计划的任务对应的预算成本；ACWP表示实际完成的任务对应的实际成本；BCWP表示实际完成的任务对应的预算成本，就是挣值（EV）。


    +   2， 成本差异：CV=BCWP-ACWP，都是实际完成的任务，比较预算成本和实际成本之差。


