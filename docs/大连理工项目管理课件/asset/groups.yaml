    策略性项目管理机制整合架构 S M'
  - '[PAGE 53]


    # # 6.按项目进行管理 (Management by Projects, MBP)


    +   - 按项目进行管理将传统的项目管理方法应用于全面的企业运作，是传统项目管理方法和技术在企业所有项目上的综合应用，冲破了传统的管理方式和界限。


    +   - 按项目进行管理将项目观念渗透到企业所有的业务领域，包括市场、工程、质量管理、战略规划、人力资源管理、组织变革、业务管理等。'
  - "[PAGE 54]\n\n# # 天士力的项目化管理--从 TPM 到 MBP\n\n+   从TPM到MBP带来的新理念：\n+   \n+   - 让好主意成为项目\n\
