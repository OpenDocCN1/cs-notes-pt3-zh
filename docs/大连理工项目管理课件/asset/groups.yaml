    # ## 3.2净现值法


    +   - 现值（PV）即将来某一笔金的现在价值。


    +   - 净现值法是将整个项目投资过程的现金流按要求的投资收益率(折现率)，折算到时间等于零时，得到现金流的折现累计值（净现值NPV），然后加以分析和评估。


    [NPV = \sum_{t=0}^n (B_t - C_t) \frac{1}{(1 + i_0)^t}]


    式中B为收入额 C为支出额


    +   - NPV指标的评价准则是：


