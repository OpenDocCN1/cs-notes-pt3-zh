    # 项目后评价与前评价的区别


    | 对比项目 | 前评价 | 后评价 |

    |---|---|---|

    | 时点 | 项目的起点 | 项目建成后 |

    | 目的 | 确定项目是否可以立项 | 总结经验教训，改进决策和管理服务 |

    | 内容 | 应用预测技术来分析评价项目未来的效益，确定项目投资是否值得、可行 | 总结项目的准备、实施、完工和运营，通过预测对项目未来进行分析评价 |

    | 判别标准 | 投资者要求获得的收益率或基准收益率（社会折现率） | 与前期评估的结论对比 |'
  - '[PAGE 686]


    # # 2.2 项目竣工验收


    项目的竣工验收是投资由建设转入生产、使用和运营的标志，是全面考核和检查项目实践工作是否符合设计要求和达到要求工程质量的环节，是项目业主、合同商向投资者汇报建设成果和交付新增固定资产的过程。在这阶段进行的工作将为以后开展的项目效益后评价和项目管理后评价作基础。项目竣工验收分为以下几个方面：


    +   - 竣工验收

    +   - 竣工决算

    +   - 技术资料的整理和移交'
  - '[PAGE 687]


    # 2.3 项目效益后评价


    项目效益后评价是项目后评价理论的重要组成部分。它以项目投产后实际取得的效益（经济、社会、环境等）及其隐含在其中的技术影响为基础，重新测算项目的各项经济数据，得到相关的投资效果指标，然后将它们与项目前评价时预测的有关经济效果值（如净现值NPV、内部收益率IRR、投资回收期等）社会环境影响值（如环境质量值IEQ等）进行对比，评价和分析其偏差情况以及原因，吸取经验教训，从而为提高项目的投资管理水平和投资决策服务。具体包括以下几个方面：


    +   经济效益后评价


    +   环境效益和社会效益后评价


    +   项目可持续性后评价


    +   项目综合效益后评价'
  - '[PAGE 688]


    # # 2.4 项目管理后评价


    项目管理后评价是以项目竣工验收和项目效益后评价为基础，在结合其它相关资料的基础上，对项目整个生命周期中各阶段管理工作进行评价。目的是通过对项目各阶段管理工作的实际情况进行分析研究，形成项目管理情况的总体概念。通过分析、比较和评价，能知道目前项目管理的水平。通过吸取经验和教训，来不断提高项目管理水平，以保证更好地完成以后的项目管理工作，促使项目预期目标很好地完成。项目管理后评价包括以下几个方面：


    +   - 项目的过程后评价

    +   - 项目综合管理的后评价

    +   - 项目管理者的评价'
