    # 4. 工作分解结构（WBS）的制定


    +   - WBS（Work Breakdown Structure）主要是将一个项目分解成易于管理的一个部分或几个组目，以便确保按时完成项目工作。通过将项目分解为若干个层次，逐步明确项目范围内各项工作的内容，并按照项目发展的需要进行调整和细化。WBS的层次结构应清晰，可以具体作为组织项目实施的工作依据。


    +   - WBS通常是一种面向“成果”的“树”，其最底层是细化后的“可交付成果”，该树组织确定了项目的整个范围。但WBS的形式并不限于“树”状，还有多种形式。


