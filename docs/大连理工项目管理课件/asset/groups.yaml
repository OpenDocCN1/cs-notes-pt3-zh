    - c）固定资产投资国内借款偿还期（从借款开始年算起）为8.08年，能满足贷款机构要求的期限。项目具有偿还能力。\n\n### 财务敏感性分析表\n\n|\
    \ 序号 | 项目 | 基本方案 | 投资+10% | 投资-10% | 经营成本+10% | 经营成本-10% | 销售收入+10% | 销售收入-10%\
    \ |\n|---|---|---|---|---|---|---|---|---|\n| 1 | 内部收益率（%） | 17.72 | 16.19 | 19.47\
    \ | 14.47 | 20.73 | 22.35 | 12.47 |\n| 2 | 较基本方案增减（%） | | -1.53 | 1.75 | -3.25\
