    # 1. 项目评估的概念


    +   - 项目评估指在项目可行性研究的基础上，由第三方（国家、银行或有关机构）根据国家颁布的政策、法规、方法、参数和条例等，从项目（或企业）、国民经济、社会角度出发，对拟建项目建设的必要性、建设条件、生产条件、产品市场需求、工程技术、经济效益和社会效益等进行全面评价、分析和论证，进而判断其是否可行的一个评估过程。

    +   - 项目评估是项目投资前期进行决策管理的重要环节，其目的是审查项目可行性研究的可靠性、真实性和客观性，为银行的贷款决策或行政主管部门的审批决策提供科学依据。'
  - '[PAGE 338]


    # 2. 项目评估和可行性研究之间关系


    # 两者之间的关系


    +   工作关系：可行性研究为项目评估提供工作基础，项目评估则是可行性研究的延伸、深化和在研究


    +   工作时点：可行性研究在项目建议书批准之后进行工作项目评估在项目可行性研究批准之后进行工作


