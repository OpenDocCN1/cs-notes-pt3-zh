    \n## 影响资金时间价值的因素\n\n(3) 折现率及利息计算方式。\n\n利息计算方式有单利法和复利法两种：\n\n单利法公式为：\n\n```\nF\
    \ = P(1+i×n)\n```\n\n复利法公式为：\n\n```\nF = P(1+i)^n\n```\n\n式中  \nF —— 期末本利和；  \n\
    P —— 本金；  \ni —— 利率；  \nn —— 期数。\n\n用单利计算的价值少于同期复利计算的价值，项目论证通常采用复利（即利滚利）的计算方法。\n\
    \n"
