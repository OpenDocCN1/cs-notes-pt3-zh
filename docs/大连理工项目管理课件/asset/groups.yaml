    # # 4.费用控制


    +   费用管理不能脱离技术管理和进度管理独立存在，相反要在成本、技术、进度三者之间作综合平衡。及时、准确的成本、进度和技术跟踪报告，是项目经费管理和费用控制的依据。


    +   费用控制就是要保证各项工作要在它们各自的预算范围内进行。费用控制的基础是事先就对项目进行的费用预算。


    +   费用控制的基本方法是规定各部门定期上报其费用报告，再由控制部门对其进行费用审核，以保证各种支出的合法性，然后再将已经发生的费用与预算相比较，分析其是否超支，并采取相应的措施加以弥补。'
  - "[PAGE 562]\n\n# 费用控制的内容\n\n+   费用控制主要关心的是影响改变费用线的各种因素、确定费用线是否改变以及管理和调整实际的改变。费用控制包括：\n\
    +   \n+   - 监控费用执行情况以确定与计划的偏差\n+   - 确使所有发生的变化被准确记录在费用线上\n+   - 避免不正确的、不合适的或者无效的变更反映在费用线上\n\
    +   - 股东权益改变的各种信息\n\n+   费用控制还应包括寻找费用向工反两方面变化的原因，同时还必须考虑与其它控制过程（范围控制、进度控制、质量控制等）相协调，比如不合适的费用变更可能导致质量、进度方面的问题或者导致不接受的项目风险。"
