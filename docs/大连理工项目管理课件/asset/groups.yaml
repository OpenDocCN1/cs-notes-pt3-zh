    # # 5.3 风险管理规划


    风险管理规划是规划和设计如何进行项目风险管理的过程。该过程包括定义项目组织及成员风险管理的行动方案及方式，选择适合的风险管理方法，确定风险判断的依据等。


    # # 风险管理规划的方法及内容


