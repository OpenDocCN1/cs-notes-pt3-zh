    ## 网络计划技术起源与发展


    网络计划技术（*Network Planning Techniques*）是20世纪50年代中期发展起来的一种科学的**计划管理技术**。1956年杜邦.奈莫斯建筑公司与赖明顿.兰德公司开发了一种面向计算机描述工程项目的合理安排进度计划方法，称之为关键线路法（*Critical
    Path Method*），简称 CPM 。


    1958年，美国海军军械局在制定研究“北极星”导弹计划时（几十亿个管理项目、250个承包商和9000多个分包商），又研究创造出了 计划评审技术（*Program
    Evaluation and Review Technique*），即PERT。使计划10年完成的项目提前2年多，并在成本控制上取得了显著效果。


    ## 网络计划技术的优势与特点


    - 网络计划模型是一种简明直观、有逻辑关系的工程项目进展模型

    - 网络计划能反映工程项目的关键路径及其变化

    - 网络计划技术可以实现进度计划的优化

    - 网络计划技术可以根据进展对未来作出 快速的预测

    - 应用网络技术可取得显著的经济效果


    ## 1.项目计划制定的基础--工作持续时间的确定


    + 作用：工作延续时间的估计是项目计划制定的一项重要的基础工作，它直接关系到各事项、各工作网络时间的计算和完成整个项目任务所需要的总时间。若工作时间估计的太短，则会在工作中造成被动紧张的局面；相反，若工作时间估计的太长，会使项目的完工期延长。


    + 观念：项目的进度安排都是由工作的延续时间来推算，因此对延续时间的估计要做到客观正确的估计。这就要求在对工作作出时间估计时，不应受到工作重要性及工程完成期限的影响，要在考虑到各种资源、人力、物力、财力的情况下，把工作置于独立的正常状态下进行估计，要做统盘考虑，不可顾此失彼。


