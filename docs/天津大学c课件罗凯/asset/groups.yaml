    \ itself\n\n- Consider the mathematical function n!  \n  (factorial - 阶乘 jiē chéng)\n\
    \n- Consider the following definition  \n  \\(n! = 1\\), if \\(n == 1\\)  \n \
    \ \\(n! = n * (n - 1)!\\), if \\(n > 1\\)\n\n– The factorial function is defined\
    \ in by referring to itself\n\n## Using\n\n```cpp\nint factorial(int n) {\n  \
    \  if (n == 1) {\n        return 1;\n    }\n    else {\n        return n * factorial(n-1);\n\
    \    }\n}\n```\n\n- C++ function mirrors the mathematical factorial definition\n\
    \  - If the value of `n` is 1, the value 1 is returned.\n  - Otherwise, the product\
    \ of `n` and `factorial(n-1)` is returned.\n\n## Recursion Visualization\n\n+\
    \   • Consider `cout << 3! = \" << factorial(3) << endl;`\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_525_0.png)\n\
    \n## Recursion Visualization\n\n- Consider `cout << 3! = \" << factorial(3) <<\
    \ endl;`\n\n# Function memory\n\n```\n`cout << \"n! = \" << factorial(3) << endl;`\n\
    ```\n\nn = 3\n\ncall factorial(3)\n\n```\n`factorial(3) = 3 * factorial(2)`\n\
    ```\n\nn = 2\n\ncall factorial(2)\n\n```\n`factorial(2) = 2 * factorial(1)`\n\
    ```\n\n## Recursion Visualization\n\n- Consider cout << 3! = \" << factorial(3)\
    \ << endl;\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_0.png)\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_1.png)\n\
    \n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_2.png)\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_3.png)\n\
    \n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_4.png)\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_5.png)\n\
    \n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_6.png)\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_528_7.png)\n\
    \ncout << \"n! = \" << factorial(3) << endl;\n\nfactorial(3) = 3 * factorial(2)\n\
    \nfactorial(2) = 2 * factorial(1) = 2 * 1 = 2\n\nfactorial(1) =\n\n1\n\n# Abstract\n\
    \nIn the era of large language models (LLMs), modern coding agents have demonstrated\
    \ substantial advances in automating software development tasks. However, their\
    \ performance and reliability are often hindered by the quality of the code they\
    \ generate. To address this, we introduce CodeFix, a novel multi-agent framework\
    \ aimed at improving code generation accuracy through iterative feedback and refinement.\
    \ CodeFix adopts a two-stage pipeline comprising a generation agent and a review\
    \ agent. The review agent, guided by a comprehensive checklist, provides precise,\
    \ actionable feedback on the generated code. This feedback is then used by the\
    \ generation agent to iteratively refine the output. We evaluate CodeFix on three\
    \ widely used benchmarks—HumanEval, MBPP, and CodeContests—and demonstrate that\
    \ it significantly improves the performance of base models, including GPT-4o,\
    \ Llama-3.1-8B, and Qwen-2.5-7B. Our best configuration achieves pass@1 scores\
    \ of 91.2% and 88.4% on HumanEval and MBPP, respectively, surpassing existing\
    \ state-of-the-art methods by a large margin. Furthermore, we conduct extensive\
    \ analyses on the impact of different checklist designs, feedback granularity,\
    \ and the number of iteration rounds, providing valuable insights into the design\
    \ of effective code generation systems.\n\n# 1 Introduction\n\nRecent advances\
    \ in large language models (LLMs) have revolutionized the field of automated code\
    \ generation [1, 2, 3]. Models such as GPT-4 [4], Gemini [5], and Llama-3 [6]\
    \ are capable of generating code snippets that are often indistinguishable from\
    \ those written by human programmers. Despite this progress, the generated code\
    \ frequently contains subtle bugs, logical errors, or inefficiencies that require\
    \ manual inspection and correction. Consequently, the practical deployment of\
    \ these models in real-world software engineering remains limited.\n\nTo bridge\
    \ this gap, researchers have explored various strategies, including fine-tuning\
    \ on code-specific datasets [7, 8], prompting-based techniques such as chain-of-thought\
    \ [9] and self-consistency [10], and the use of external tools such as linters\
    \ and test runners [11, 12]. However, these methods often rely on a single model\
    \ that both generates and evaluates the code, leading to a bias where the model\
    \ fails to detect its own mistakes. In contrast, multi-agent systems [13, 14]\
    \ offer a more promising direction: by assigning different roles to different\
    \ agents, it is possible to introduce diversity and reduce systematic errors.\n\
    \nIn this work, we propose CodeFix, a multi-agent code generation framework that\
    \ decouples the generation and review processes. The framework consists of two\
    \ agents: (i) a generation agent that produces an initial draft based on a natural\
    \ language instruction, and (ii) a review agent that inspects the generated code\
    \ against a predefined checklist comprising correctness, efficiency, readability,\
    \ and edge-case coverage. The review agent outputs a list of issues with specific\
    \ suggestions. The generation agent then revises the code accordingly. This cycle\
    \ repeats until the review agent finds no further issues or a maximum number of\
    \ iterations is reached.\n\nWe evaluate CodeFix on three benchmarks: HumanEval\
    \ [15], MBPP [16], and CodeContests [17]. Our results show that CodeFix consistently\
    \ improves the pass@1 accuracy across different base models and benchmarks. Moreover,\
    \ we analyze the effect of several design choices, such as the content of the\
    \ checklist, the granularity of feedback, and the number of refinement rounds,\
    \ to provide practical guidelines for future work.\n\n# 2 Related Work\n\n## 2.1\
    \ Large Language Models for Code Generation\n"
