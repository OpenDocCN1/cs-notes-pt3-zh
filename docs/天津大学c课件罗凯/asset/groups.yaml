    \ 0; i < ARRSIZE; i++ ) {\n    cout << ptr[i] << endl;\n}\n```\n\n## Pointer Arithmetic\
    \ and arrays\n\n++ and -- can be use to move a pointer in an array\n\n```cpp\n\
    const int ARRSIZE = 20;\nint arr[ ARRSIZE ];\nint * ptr = arr;\n```\n\n// fill\
    \ arr with numbers\n\n```cpp\nfor( int i = 0; i < ARRSIZE; i++ ) {\n    cout <<\
