    \n```cpp\nvoid swap( int &a, int &b);\n\nint main() {\n    int number1 = promptAndReadInt();\n\
    \    int number2 = promptAndReadInt();\n    if (number1 > number2) {\n       \
    \ swap(number1, number2);\n    }\n    cout << \"The numbers in sorted order: \"\
    \n         << number1 << \", \" << number2 << endl;\n    return 0;\n}\n```\n\n\
    ## Using reference parameters\n\n```cpp\nvoid swap(int &a, int &b) {\n    int\
    \ temp = a;\n    a = b;\n    b = temp;\n}\n```\n\n> Passed by reference -- when\
    \ called the parameter becomes a second name for the argument\n\n## Constant Parameters\n\
    \n- The `const` modifier can be used with parameter declarations\n  - `const`\
    \ indicates that the function may not modify the parameter\n\n```cpp\nvoid promptAndGetInt(int\
    \ &n, const string &s){\n    cout << s ;\n    cin >> n ;\n    s = \"Got it\";\
    \        // illegal assignment\n}                         // caught by compiler\n\
    ```\n\n- Sample function call\n\n```cpp\nint x;\npromptAndGetInt( x, \"Enter number\
    \ (n): \");\n```\n\n## Constant Reference Parameters\n\n- Usefulness\n  - when\
    \ we want to pass a variable by reference,\n    but we don't want to let the variable\
    \ be changed\n\n- Question\n  - Why not just pass the variable by value?\n\n-\
    \ Answer:\n  - For large variables, making a copy of the\n    variable can take\
    \ time and be slow\n\n## Review\n\n- if we call this function, how is the parameter\
    \ “passed” in?\n\n```cpp\nint foo ( int num );\n```\n\n- if we call this function,\
    \ how is the parameter “passed” in?\n\n```cpp\nint foo ( int num );\n```\n\n \
    \ ANS: the value of the argument is copied to num\n\n- if we call this function,\
    \ how is the parameter “passed” in?\n\n```cpp\nbool baz ( int & grade );\n```\n\
    \n  ANS: grade becomes a second name for the argument\n\n- what does the const\
    \ do to the parameter “passed” in?\n\n```cpp\nstring bar ( const int & testScore\
    \ );\n```\n\n  ANS: testScore is read-only (can't be changed in the func)\n\n\
    ## Consider\n\n```cpp\nvoid printChar(char c = '~', int n = 80) {\n    for (int\
    \ i = 0; i < n; ++i)\n        cout << c;\n}\n```\n\n- What happens in the following\
    \ function calls?\n\n```cpp\nprintChar('*', 20);\nprintChar('-');\nprintChar();\n\
    ```\n\n## Default Parameters\n\n- Default parameters must appear after any normal\
    \ parameters\n  - (must be given from right to left )\n\n- **Bad example**  \n\
    \  `void trouble(int x = 5, double z, double y);`\n\n> Cannot come before normal\
    \ parameters\n\n- Default parameters must appear after any normal parameters\n\
    \  - (must be given from right to left )\n\n- **Good** example\n\n```cpp\nvoid\
    \ goodEx(int x, double z, double y = 10);\n```\n\nMust come after\nnormal parameters\n\
    \n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_506_0.png)\n\n"
