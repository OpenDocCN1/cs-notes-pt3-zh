    \ 'e';\n\nchar * const ptr1 = &c;\nptr1 = &e;      // illegal\n*ptr1 = 'k';  \
    \  // ok\n```\n\n- A **pointer to constant data** is a pointer that points to\
    \ data that can't be changed\n\n```cpp\nconst char d = 'd';\nconst char * ptr2\
    \ = &d;\n*ptr2 = 'f';      // illegal: cannot change d\n                  // through\
    \ ptr2\nptr2 = &e;       // ok\n```\n\n| C++ Code | Can point to diff data | Can\
    \ change the data pointed to |\n|---|---|---|\n| `int * iptr;` | TRUE | TRUE |\n\
    | `const int *iptr;` | TRUE | FALSE |\n| `int * const iptr;` | FALSE | TRUE |\n\
    | `const int * const iptr;` | FALSE | FALSE |\n\n> Read from right to left and\
