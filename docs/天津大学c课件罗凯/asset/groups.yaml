    \ questions (in class, while reading, while programming)\n\n- Experiment.....write\
    \ little programs to try out new ideas or questions.\n\n## Lunch\n\n- I am happy\
    \ to have lunch with students after classes\n- Where:\n  - cafeteria (I have a\
    \ meal card)\n  - other restaurants on or off campus\n- Who:\n  - groups of students\
    \ who want to talk about:\n    - C++ Programming\n    - programming in general\n\
    \    - anything....life (English practice)\n\n## Office Hours (Da Yi答疑)\n\n- To\
    \ answer programming questions\n  - there is a computer in the office\n\n- Where:\n\
    \  - Building 25B, Room 523\n\n- When:\n  - Tuesdays & Wednesday 12:20(after lunch)\
    \ - 1:40pm\n\n## What is Programming?\n\nThe giving of commands to a computer\n\
    \n## Are computers smart?\n\n## What does a program look like?\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_33_0.png)\n\
    \n```\nHello World!\n        I am a simple C++ program\nPress any key to continue\
    \ . . .\n```\n\n## Here is the code\n\n```\n// Simple program to display some\
    \ text\n\n#include <iostream>\n#include <cstdlib>\n\nint main() {\n\tstd::cout\
    \ << \"Hello World!!\\n\";\n\tstd::cout << \"\\tI am a simple C++ program\\n\"\
    ;\n\n\tsystem(\"pause\");\n\n\treturn 0;\n}\n```\n\n## Tells the compiler that\
    \ we need to use someone else's code (stored in a library file)\n\n// Simple program\
    \ to display some text\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n```\n\
    \n```cpp\nint main(){\n\nstd::cout << \"Hello World!\\n\";\nstd::cout << \"\\\
    tI am a simple C++ program\\n\";\n\nsystem(\"pause\");\n\nreturn 0;\n}\n```\n\n\
    ## Programs always start at `main()`\n\n```cpp\n// Simple program to display some\
    \ text\n#include <iostream>\n#include <cstdlib>\n\nint main(){\n    std::cout\
    \ << \"Hello World!\\n\";\n    std::cout << \"\\tI am a simple C++ program\\n\"\
    ;\n\n    system(\"pause\");\n\n    return 0;\n}\n```\n\n## Programs always start\
    \ at main()\n\n// Simple program to display some text\n\n```cpp\n#include <iostream>\n\
    #include <cstdlib>\n```\n\n```cpp\nint main() {\nstd::cout << \"Hello World!\\\
    n\";\nstd::cout << \"\\tI am a simple C++ program\\n\";\nsystem(\"pause\");\n\
    return 0;\n}\n```\n\n> What is “inside” of main?\n> { ...... }\n\n## Commands\
    \ used to display text to the screen\n\n```cpp\n// Simple program to display some\
    \ text\n#include <iostream>\n#include <cstdlib>\n\nint main(){\n    std::cout\
    \ << \"Hello World!\\n\";\n    std::cout << \"\\tI am a simple C++ program\\n\"\
