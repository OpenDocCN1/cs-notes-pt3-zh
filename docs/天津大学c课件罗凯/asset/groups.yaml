  md: "\n## Goals of an Object\n\n- Protect the data\n  - make sure it is valid (good)\n\
    \    - Example: Time object\n  - control the access to the data\n- Provide actions\
    \ so the object is useful\n\n## Example: Time Class\n\n- Simple class to hold\
    \ a time of the day\n  - Display: HH:MM\n  - Range: 00:00 – 23:59\n  - Actions:\n\
    \    - **print**: show the time in HH:MM format\n    - more actions will be added\
    \ later....\n\n## UML: Unified Modeling Language\n\n- We will use a UML class\
    \ diagram to show the information of a class\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_742_0.png)\n\
    \nName of the class\n\nData for the class\n\nActions for the class\n\n## Here\
    \ is a class definition\n\n```cpp\nclass Time {\npublic:\n    void print() {\n\
    \        cout << hour << \":\" << min;\n    }\n\n    int hour, min;\n}; // end\
    \ of the Time class\n```\n\n- Keyword to start the definition of a class (`class`)\n\
    - Name of the new class (we will **always** start the name of a class with a capital\
    \ letter)\n- Access specifier:\n  - **public**: available *inside* and *outside*\
    \ of the class\n  - **private**: available only *inside* of the class\n- Action\
    \ for the class (also known as: a function, a method or a procedure)\n- Data for\
    \ the class\n\n## UML: Unified Modeling Language\n\n- We will use a class diagram\
    \ to show the information of a class\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_750_0.png)\n\
    \nName of the class\n\n**Members** of the class (belongs to class)\n\n## Members\n\
    \n```cpp\nclass Time {\npublic:\n    void print() {\n        cout << hour << \"\
    :\" << min;\n    }\n\n    int hour, min;\n}; // end of the Time class\n```\n\n\
    - member functions\n- member data\n\n## Two Problems\n\n```cpp\nint main( ) {\n\
    \    Time t, t2;\n\n    t.hour = 12;\n    t.min = 67; // can set a bad value\n\
    \    t.print( );\n\n    t2.print( ); // can print t2 before it has good info\n\
    \    cout << \"\\n\\n\";\n    return 0;\n}\n```\n\n## New version of the class\
    \ definition\n\n```cpp\nclass Time {\npublic:\n    void print() {\n        cout\
    \ << hour << \":\" << min;\n    }\n\n    void setHour(int hr) {\n        hour\
    \ = 0;\n        if (hr >= 0 && hr <= 23 ) {\n            hour = hr;\n        }\n\
    \    } // end of setHour\n\nprivate:\n    int hour, min;\n};\n```\n\n> NOTE: setMin\
    \ is very similar to setHour but checks for 0-59 and is not shown due to space\n\
    \n## Using an instance\n\n```cpp\nint main() {\n    Time t, t2;\n\n    // t.hour\
    \ = 12;        Can't access directly\n    //                       hour is private\n\
    \    t.setHour( 12 );       // set the hour of t\n    t.setMin( 67 );\n    t.print(\
    \ );            // use the print function of t\n\n    t2.print( );           //\
    \ use the print function of t2\n    cout << \"\\n\\n\";\n    return 0;\n}\n```\n\
    \n```cpp\nint main() {\n    Time t, t2;\n\n    // t.hour = 12;\n    t.setHour(12);\n\
    \    t.setMin(67);\n    t.print();\n\n    t2.print();\n    cout << \"\\n\\n\"\
    ;\n    return 0;\n}\n```\n\n```cpp\nclass Time {\npublic:\n    void setHour( int\
    \ hr ) {\n        hour = 0;\n        if (hr >= 0 && hr <= 23)\n            hour\
    \ = hr;\n    } // end of setHour\n\nprivate:\n    int hour, min;\n};\n```\n\n\
    ![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_757_0.png)\n"
