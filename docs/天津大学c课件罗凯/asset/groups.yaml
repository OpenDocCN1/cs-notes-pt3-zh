    \ will represent a 10)\n\n```\n123456789012345................................................................67890\n\
    ```\n\n## Answer\n\n```cpp\nint count = 1, output = 1;\n\nwhile ( count <= 80\
    \ ) {\n    cout << output ;\n    count = count + 1;\n    output = output + 1;\n\
    \n    if (output > 9)        // reset output to 0 if over 9\n        output =\
    \ 0;\n}\n```\n\n## Another Answer\n\n```cpp\nint count = 1, output = 1;\n\nwhile\
    \ ( count <= 80 ) {\n    cout << output ;\n    count = count + 1;\n\n    // reset\
    \ output to 0 if over 9\n    output = ( output > 9 ? 0 : output + 1 );\n}\n```\n\
    \n## Another Answer\n\n```cpp\nint num = 1 ;\n\nwhile ( num <= 80 ) {\n    cout\
    \ << ( num % 10 ) ;\n    num = num + 1;\n}\n```\n\n## While loops\n\n- You can\
    \ put any kind of code in the code block…..\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_351_0.png)\n\
    \n## Embedded loops\n(a loop inside of another loop)\n\n- In everyday life we\
    \ have an embedded loop: **Time**\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_354_0.png)\n\
    \nhours\n\nminutes\n\nBool Exp\n\nTrue\n\nFalse\n\nBool Exp\n\nTrue\n\nFalse\n\
    \nCode Block\n\nCode Block\n\n## Creating Some Time Output\n\n```cpp\nint hour\
    \ = 0, min;\n\nwhile (hour < 24) {\n    min = 0;\n    while (min < 60) {\n   \
    \     cout << hour << ':' << min << endl;\n\n        min = min + 1;\n    }  //\
    \ end of minute loop\n    hour = hour + 1;\n}  // end of hour loop\n```\n\n##\
    \ Now What is the Output?\n\n```cpp\nint hour = 0, min;\n\nwhile ( hour < 24 )\
    \ {\n    min = 0;\n    while ( min < 60 ) {\n        cout << (hour < 10 ? '0'\
    \ : \"\") << hour;\n        cout << ':';\n        cout << (min < 10 ? '0' : \"\
    \") << min << endl;\n        min = min + 1;\n    }   // end of minute loop\n \
    \   hour = hour + 1;\n}       // end of hour loop\n```\n\n## Random Numbers\n\n\
    - Generating random numbers is often useful\n  - In a game, player do not want\
    \ the same behavior/moves each time\n  - In a simulation of a complex system,\
    \ random numbers can be used to help generate random events\n    - Car crash in\
    \ a simulation of a highway system\n    - Likelihood of a gene in cell mutation\n\
    \    - Weather simulation\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_357_0.png)\n\
    \n## Random numbers in real life\n\n### Examples\n\n- Generate a random number\
    \ sequence in the range 1 to 6\n  - Use a six-sided die（色子 shǎi zi）\n  - Each\
    \ roll represents a new random number\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_358_0.png)\n\
    \n- Generate a random number sequence in the range 1 to 2\n  - Use a fair coin\n\
    \    - Heads: 1, Tails: 2\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_358_1.png)\n\
    \n## Random Numbers\n\n- We can write an algorithm\n  for generating what looks\n\
    \  like random numbers\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_359_0.png)\n\
    \n- Because it’s an algorithm,\n  we know the rules for generating the next\n\
    \  number\n  - The generated numbers are not really random\n    - They are properly\
    \ called pseudo-random numbers\n\n## Stdlib Library\n\n- Provides functions for\
    \ generating pseudo-random numbers\n  - `rand()`\n    - Returns a pseudo-random\
    \ *unsigned int* in the range of 0 to `RAND_MAX` (32,767)\n\n```cpp\n#include\
    \ <iostream>\n#include <cstdlib>\nusing namespace std;\nint main() {\n    int\
    \ i = 1;\n    while( i <= 5) {\n        cout << rand() << endl;\n        ++i;\n\
    \    }\n    return 0;\n}\n```\n\n## Program Output\n\nOutput\n\n- 41\n- 18467\n\
    - 6334\n- 26500\n- 19169\n\n## Program Output for two runs\n\n### Output #1\n\n\
    41\n18467\n6334\n26500\n19169\n\n### Output #2\n\n41\n18467\n6334\n26500\n19169\n\
    \nEvery time the program is run we will get the same \"random\" numbers\n\n"
