  md: "\n\n## More to think about\n\n- Often we want to use a dice roll in games.\
    \ If we have a random positive number (0 - 32,000) called **rpn**, how could we\
    \ convert this into a dice roll?\n\n`rpn % 6`\n\n[ 0, 1, 2, 3, 4, 5 ]\n\n`rpn\
    \ % 6` → `[ 0, 1, 2, 3, 4, 5 ]`\n\n`( rpn % 6 ) + 1` → `[ 1, 2, 3, 4, 5, 6 ]`\n\
    \n## More Modulus Operations\n\n```cpp\n// integer division\nstd::cout << \"-6\
    \ / 4 = \" << -6 / 4 << std::endl;\n\n// modulus operation (remainder)\nstd::cout\
    \ << \"-6 % 4 = \" << -6 % 4 << std::endl;\n\nstd::cout << \"6 % -4 = \" << 6\
    \ % -4 << std::endl;\n```\n\n-6 / 4 = ??\n-6 % 4 = ??\n6 % -4 = ??\n\n// integer\
    \ division\nstd::cout << \"-6 / 4 = \" << -6 / 4 << std::endl;\n\n// modulus operation\
    \ (remainder)\nstd::cout << \"-6 % 4 = \" << -6 % 4 << std::endl;\nstd::cout <<\
    \ \"6 % -4 = \" << 6 % -4 << std::endl;\n\n## Something to think about\n\n- Let\
    \ x be some whole **negative** number then what are the answers to the following\n\
    \n- x % 1 → [ 0 ]\n\n- x % 2 → [ -1, 0 ]\n\n- x % 3 → [ -2, -1, 0 ]\n\nso if n\
    \ is some **negative** number\n\n- x % n → [ -(n - 1), ..... 0 ]\n\n## So what\
    \ is std ?\n\n```cpp\nstd::cout << 45 << std::endl;\n```\n\n- **std** is short\
    \ for **standard**\n\n- ....but what does that mean ?\n  - student example\n\n\
    std is short for **standard**\n\n....but what does that mean ?\n- student example\n\
    \nso std is a “grouping” of names (or a “holder”)\nin C++ this is called a **namespace**\n\
    \n## using std::cout\n\n```cpp\n// Simple program to display some text\n#include\
    \ <iostream>\n#include <cstdlib>\n\nusing std::cout;        // tells which cout\
    \ to use\n\nint main(){\n    cout << \"Hello World!!\" << std::endl;\n    cout\
    \ << \"\\tI am a simple C++ program\\n\";\n\n    system(\"pause\");\n\n    return\
    \ 0;\n}\n```\n\n## When do you use what?\n\n### using namespace std;\n\n- makes\
    \ all names in std available for use\n\n- a little dangerous when using more than\
    \ one code libraries (standard C++, and another company's)\n\n- for this class\
    \ we will use this way\n\n### using std::cout;\n\n- only makes cout available\
    \ for use\n\n- much safer, but more typing\n\n## Back to numbers and math\n\n\
    What will the output be?\n\n```cpp\ncout << 10 - 6 * 3 + 4 << endl;\n```\n\nWhat\
    \ will the output be?\n\n`cout << 10 - 6 * 3 + 4 << endl;`\n\nor it could be written\
    \ to be more clear\n\n`cout << 10 - ( 6 * 3 ) + 4 << endl;`\n\n-4\n\n## Back to\
    \ numbers and math\n\n20 - 4 / 5 * 2 + 3 * 5 % 4\n\nWhat is the answer for this\
    \ equation?\n\n## Back to numbers and math\n\n20 - 4 / 5 * 2 + 3 * 5 % 4\n20 -\
    \ 0 * 2 + 3 * 5 % 4\n\n## Back to numbers and math\n\n```\n20 - 4 / 5 * 2 + 3\
    \ * 5 % 4\n20 - 0   * 2 + 3 * 5 % 4\n20 -     0 + 3 * 5 % 4\n```\n\n## Back to\
    \ numbers and math\n\n20 − 4 / 5 * 2 + 3 * 5 % 4\n20 − 0 * 2 + 3 * 5 % 4\n20 −\
    \ 0 + 3 * 5 % 4\n20 − 0 + 15 % 4\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_137_0.png)\n\
    \n## Back to numbers and math\n\n```\n20 - 4 / 5 * 2 + 3 * 5 % 4\n20 - 0 * 2 +\
    \ 3 * 5 % 4\n20 - 0 + 3 * 5 % 4\n20 - 0 + 15 % 4\n20 - 0 + 3\n```\n\n![](img/844f1d9b9fc3acdef1abfe5a062e4e8f_138_0.png)\n\
    \n## Back to numbers and math\n\n20 - 4 / 5 * 2 + 3 * 5 % 4\n20 - 0 * 2 + 3 *\
    \ 5 % 4\n20 - 0 + 3 * 5 % 4\n20 - 0 + 15 % 4\n20 - 0 + 3\n20 + 3\n\n"
