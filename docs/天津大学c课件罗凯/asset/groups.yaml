    \ the dest (destination) and returns a pointer to the destination\n\nClass exercise:\
    \ With your neighbor, write this function.\n\nIt could be written like this.....\n\
    \n```c\nchar * strcpy( char * dest, const char * source ) {\n    char * start\
    \ = dest;\n    while( (*dest = *source) != '\\0' ) {\n        dest++;\n      \
    \  source++;\n    }\n    return start;\n}\n```\n\nor it could be written like\
    \ this.....\n\n```c\nchar * strcpy( char * dest, const char * source ) {\n   \
    \ char * start = dest;\n    while( *dest++ = *source++ );    // empty loop\n \
    \   return start;\n}\n```\n\n## Calling the strcpy\n\n```c\nchar original[80],\
