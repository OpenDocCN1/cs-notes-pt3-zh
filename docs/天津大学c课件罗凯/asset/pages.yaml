- pgno: 827
  md: "# # Now a deeper look at Streams\n\nWhat is a stream (in real life)?\n\n+ \
    \  - a flow of water from one place to another\n+   - iostreams are the same concept,\
    \ but are a flow of data from one point to another\n+     - istream: bring information\
    \ in (cin)\n+     - ostream: take information out (cout)\n+   \n+   - ifstream:\
    \ bring information in from a file\n+   - ofstream take information out to a file\n\
    \n**ifstream** will have the same operations as **istream**\n**ofstream** will\
    \ have the same operations as **ostream**"
