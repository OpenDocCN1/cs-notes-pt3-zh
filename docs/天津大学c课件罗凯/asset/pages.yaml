  md: "# # Fixing our Problem\n\n```\n```cpp\n// above main\nconst int END = -99;\
    \     // signal for no more scores\n\n// below main\nint averageScore ( int scores[][\
    \ NUM_STDS ],\n                   int numClasses ) {\n    int total = 0, stdCount\
    \ = 0;\n    for ( int i = 0; i < numClasses; i++ ) {\n        for ( int j = 0;\
    \ j < NUM_STDS &&\n             scores[ i ][ j ] != END ; j++ ) {\n          \
    \  total += scores [ i ] [ j ];\n            stdCount++;\n        }\n    }\n \
    \   return total / stdCount ;\n}\n```\n```"
