  md: "# # Resetting a file variable\n\n+   - if you want to reset a file variable\
    \ after it has **failed**, then you need to do....\n+     1. close the file\n\
    +     2. clear the file information\n\n```\nifstream fin;\nstring fileName = \"\
    myfile.txt\";\nfin.open( fileName.c_str( ) );\nwhile ( fin.fail() ) {\n    cout\
    \ << \"Could not open input file :\"\n    << fileName << endl;\n    fin.close();\n\
    \    fin.clear();\n    cout << \"What file would you like to open: \" ;\n    cin\
    \ >> fileName;\n    fin.open( fileName.c_str( ) );\n}\n```"
