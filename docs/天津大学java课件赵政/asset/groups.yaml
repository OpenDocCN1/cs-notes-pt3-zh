    # # 8.3 创建多级类层次


    +   - 可以建立包含任意多层继承的类层次。

    +   - 例如， C是B的一个子类， 而B又是A的一个子类。

    +   - 每个子类继承它的所有超类的属性。

    +   - super()总是引用子类最接近的超类的构造函数。

    +   - Shipment中super()调用了BoxWeight的构造函数。BoxWeight中的super()调用了Box中的构造函数。

    +   - 在类层次结构中， 如果超类构造函数需要参数， 那么不论子类它自己需不需要参数， 所有子类必须向上传递这些参数。'
