    - 每个子类继承它的所有超类的属性。\n- super() 总是引用子类最接近的超类的构造函数。\n- Shipment 中 super() 调用了 BoxWeight\
    \ 的构造函数。BoxWeight 中的 super() 调用了 Box 中的构造函数。\n- 在类层次结构中，如果超类构造函数需要参数，那么不论子类它自己需不需要参数，所有子类必须向上传递这些参数。\n\
    \n### 例 P142\n\n### Box -> BoxWeight -> Shipment\n\n```java\n// Extend BoxWeight\
    \ to include shipping costs.\n// Start with Box.\nclass Box {\n    private double\
    \ width;\n    private double height;\n    private double depth;\n    // construct\
    \ clone of an object\n    Box(Box ob) { // pass object to constructor\n      \
    \  width = ob.width;\n        height = ob.height;\n        depth = ob.depth;\n\
    \    }\n    // constructor used when all dimensions specified\n    Box(double\
    \ w, double h, double d) {\n        width = w;\n        height = h;\n        depth\
    \ = d;\n    }\n    // constructor used when no dimensions specified\n    Box()\
    \ {\n        width = -1; // use -1 to indicate\n        height = -1; // an uninitialized\n\
    \        depth = -1; // box\n    }\n    // constructor used when cube is created\n\
    \    Box(double len) {\n        width = height = depth = len;\n    }\n    // compute\
    \ and return volume\n    double volume() {\n        return width * height * depth;\n\
    \    }\n}\n```\n\n```java\n// Add weight.\nclass BoxWeight extends Box {\n   \
    \ double weight; // weight of box\n    // construct clone of an object\n    BoxWeight(BoxWeight\
    \ ob) { // pass object to constructor\n        super(ob);\n        weight = ob.weight;\n\
    \    }\n    // constructor when all parameters are specified\n    BoxWeight(double\
    \ w, double h, double d, double m) {\n        super(w, h, d); // call superclass\
    \ constructor\n        weight = m;\n    }\n    // default constructor\n    BoxWeight()\
    \ {\n        super();\n        weight = -1;\n    }\n    // constructor used when\
    \ cube is created\n    BoxWeight(double len, double m) {\n        super(len);\n\
    \        weight = m;\n    }\n}\n```\n\n```java\n// Add shipping costs\nclass Shipment\
    \ extends BoxWeight {\n    double cost;\n    // construct clone of an object\n\
    \    Shipment(Shipment ob) { // pass object to constructor\n        super(ob);\n\
    \        cost = ob.cost;\n    }\n    // constructor when all parameters are specified\n\
    \    Shipment(double w, double h, double d,\n             double m, double c)\
    \ {\n        super(w, h, d, m); // call superclass constructor\n        cost =\
    \ c;\n    }\n    // default constructor\n    Shipment() {\n        super();\n\
    \        cost = -1;\n    }\n    // constructor used when cube is created\n   \
    \ Shipment(double len, double m, double c) {\n        super(len, m);\n       \
    \ cost = c;\n    }\n}\n```\n\n```java\nclass DemoShipment {\n    public static\
    \ void main(String args[]) {\n        Shipment shipment1 =\n            new Shipment(10,\
    \ 20, 15, 10, 3.41);\n        Shipment shipment2 = new Shipment(2, 3, 4, 0.76,\
    \ 1.28);\n        double vol;\n        vol = shipment1.volume();\n        System.out.println(\"\
    Volume of shipment1 is \" + vol);\n        System.out.println(\"Weight of shipment1\
    \ is \" +\n            shipment1.weight);\n        System.out.println(\"Shipping\
    \ cost: $\" + shipment1.cost);\n        System.out.println();\n        vol = shipment2.volume();\n\
    \        System.out.println(\"Volume of shipment2 is \" + vol);\n        System.out.println(\"\
    Weight of shipment2 is \" +\n            shipment2.weight);\n        System.out.println(\"\
    Shipping cost: $\" + shipment2.cost);\n    }\n}\n```\n\n## Ans:\n\nVolume of shipment1\
    \ is 3000.0  \nWeight of shipment1 is 10.0  \nShipping cost: $3.41  \nVolume of\
    \ shipment2 is 24.0  \nWeight of shipment2 is 0.76  \nShipping cost: $1.28\n\n\
    ## 8.4 何时调用构造函数\n\n- 在类层次结构中，构造函数以派生的次序调用，从超类到子类。\n- 尽管 super() 必须是子类构造函数的第一个执行语句，无论你用到了\
    \ super() 没有，这个次序不变。\n- 如果 super() 没有被用到，每个超类的默认的或无参数的构造函数将执行。\n\n## Ans:\n\n\
    Inside A's constructor  \nInside B's constructor  \nInside C's constructor\n\n\
    ## 8.5 方法重写\n\n- 子类方法与它超类方法有相同的方法名和类型声明，称方法重写（override）。\n- 从子类中调用重写方法时，它总是引用子类定义的方法。而超类中定义的方法将被隐藏。\n\
    \n### 例 P146\n\n### 重写（override）\n\n```java\n// Method overriding.\nclass A {\n\
    \    int i, j;\n    A(int a, int b) {\n        i = a;\n        j = b;\n    }\n\
    \    // display i and j\n    void show() {\n        System.out.println(\"i and\
    \ j: \" + i + \" \" + j);\n    }\n}\n```\n\n```java\nclass B extends A {\n   \
    \ int k;\n    B(int a, int b, int c) {\n        super(a, b);\n        k = c;\n\
    \    }\n    // display k – this overrides show() in A\n    void show() {\n   \
    \     System.out.println(\"k: \" + k);\n    }\n}\nclass Override {\n    public\
    \ static void main(String args[]) {\n        B subOb = new B(1, 2, 3);\n     \
    \   subOb.show();       // this calls show() in B\n    }\n}\n```\n\nAns:\n\nk:\
    \ 3\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_377_0.png)\n\n"
