    # 11.5 使用 isAlive() 和 join()


    +   - 主线程希望最后结束。

    +   - 前例在 main() 中调用 sleep() 来实现的。

    +   - Thread 类提供一个线程如何知道另一线程已经结束的问题。

    +   - 可以在线程中调用 isAlive()：

    +     ```java

    +     final boolean isAlive() // 返回 true 或 false

    +     ```

    +   - 常用方法是调用 join() 等待线程结束：

    +     ```java

    +     final void join() throws InterruptedException

    +     // join() 方法等得所调用线程结束。

    +     // 线程等待直到指定线程参与。

    +     // 附加形式允许给指定线程结束定义最大时间。

    +     ```'
