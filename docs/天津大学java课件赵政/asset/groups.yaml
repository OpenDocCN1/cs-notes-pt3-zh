    # # 11.8 线程间通信


    +   - 多线程把任务分成离散的和合乎逻辑的单元代替了事件循环程序。

    +   - 线程远离了轮询。轮询由重复监测条件的循环实现。

    +   - 为避免轮询，Java通过wait()，notify()和notifyAll()方法实现进程间通信。

    +   - 这这三个方法是final，所有的类都含有它们。仅在synchronized方法中才能被调用。'
