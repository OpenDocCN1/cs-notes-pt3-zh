    \n### 6.2.1 深入研究 new 运算符\n\n- new 运算符的通用格式如下：\n\n```java\nclass-var = new classname();\n\
    ```\n\n- class-var 是所创建类类型的变量（对象名）。\n- classname 是被实例化的类的名字。\n- （）指定了类的构造函数。\n\
