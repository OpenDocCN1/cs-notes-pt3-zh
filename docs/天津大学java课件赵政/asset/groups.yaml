    +   - Java 允许变量在任何程序块内被声明。

    +   - 一个程序块定义了一个作用域（scope）。

    +   - 一个作用域决定了哪些对象对程序的其他部分是可见的，它也决定了这些对象的生存期。

    +   - 在一个作用域中定义的变量对于该作用域外的程序是不可见（即访问）的。

    +   - 作用域规则为封装提供了基础。

    +   - 作用域可以进行嵌套。外面的作用域包含内部的作用域。内部作用域定义的对象对于外部是不可见的。'
