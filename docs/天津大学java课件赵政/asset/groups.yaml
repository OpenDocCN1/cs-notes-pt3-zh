    ```\n\n"
  mdcn: "\n\n## 9.4.4 接口中的变量\n\n- 使用接口来引入多个类的共享常量。\n- 只需包含变量初始化简单的声明。\n- 一个类中包含那个接口（就是说当你实现了接口时），所有的这些变量名都将作为常量看待。\n\
    - 就像类在类名字空间引入常量作final变量。\n\n## 例P173\n\n## 实现一个自动的“作决策者”\n\n```java\nimport java.util.Random;\n\
    interface SharedConstants {\n    int NO = 0; int YES = 1; int MAYBE = 2; int LATER\
    \ = 3;\n    int SOON = 4; int NEVER = 5;\n}\nclass Question implements SharedConstants\
    \ {\n    Random rand = new Random();             // Random类提供伪随机机\n    int ask()\
    \ {\n        int prob = (int) (100 * rand.nextDouble()); // 返回0.0到1.0之间的随机数\n\
    \        if (prob < 30)  return NO;                  // 30%\n        else if (prob\
    \ < 60) return YES;             // 30%\n        else if (prob < 75) return LATER;\
    \           // 15%\n        else if (prob < 98) return SOON;            // 13%\n\
    \        else return NEVER;                          // 2%\n    }\n}\n\nclass\
    \ AskMe implements SharedConstants {\n    static void answer(int result) {\n \
    \       switch(result) {\n            case NO:\n                System.out.println(\"\
    No\");\n                break;\n            case YES:\n                System.out.println(\"\
    Yes\");\n                break;\n            case MAYBE:\n                System.out.println(\"\
    Maybe\");\n                break;\n            case LATER:\n                System.out.println(\"\
    Later\");\n                break;\n            case SOON:\n                System.out.println(\"\
    Soon\");\n                break;\n            case NEVER:\n                System.out.println(\"\
    Never\");\n                break;\n        }\n    }\n}\n\npublic static void main(String\
    \ args[]) {\n    Question q = new Question();\n    answer(q.ask());\n    answer(q.ask());\n\
    \    answer(q.ask());\n    answer(q.ask());\n}\n```\n\nAns:  // 注意每次运行结果不同\n\n\
    - Later\n- Soon\n- No\n- Yes\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_445_0.png)\n\
    \n## 例P174\n\n## 接口继承链表\n\n```java\n// One interface can extend another.\ninterface\
    \ A {\n    void meth1();\n    void meth2();\n}\n// B now includes meth1() and\
    \ meth2() -- it adds meth3().\ninterface B extends A {\n    void meth3();\n}\n\
    // This class must implement all of A and B\nclass MyClass implements B {\n  \
    \  public void meth1() {\n        System.out.println(\"Implement meth1().\");\n\
    \    }\n    public void meth2() {\n        System.out.println(\"Implement meth2().\"\
    );\n    }\n    public void meth3() {\n        System.out.println(\"Implement meth3().\"\
    );\n    }\n}\n\nclass IFExtend {\n    public static void main(String arg[]) {\n\
    \        MyClass ob = new MyClass();\n        ob.meth1();\n        ob.meth2();\n\
    \        ob.meth3();\n    }\n}\n```\n\nAns:\nImplement meth1().\nImplement meth2().\n\
    Implement meth3().\n\n## 第1部分 Java语言\n\n## 第10章 异常处理\n\n- 异常(exception)是在运行时，代码序列中产生一种异常情况。\n\
    - 异常是一个运行时错误。\n- 不支持异常处理的计算机语言中，错误必须被手工的检查和处理。\n- Java的异常处理避免手工的检查和处理，而且把运行时错误的管理带到了面向对象的世界。\n\
    \n![](img/489adce8323ca3a7b0e9fe701e6e665c_450_0.png)\n\n## 10.1 异常处理基础\n\n- 当异常发生，代表该异常的对象被创建，且在导致该错误的方法中被引发（throw）。\n\
    - 该方法可以选择自己处理异常或传递该异常。\n- 该异常被捕获（caught）并处理。\n- 异常可能是由Java运行时系统产生，或者是由你的手工代码产生。\n\
    - 被Java引发的异常与违反语言规范或超出Java执行环境限制的基本错误有关。\n\n## 5个关键字：try、catch、throw、throws和finally\n\
    \n- **Try：** 异常监控包含在一个try块中。\n- **Catch：** 在try块中发生异常，它被抛出。代码捕捉这个异常（用catch）并且用方法处理该异常。\n\
    - 系统产生的异常被Java运行时系统自动引发。\n- **Throw：** 手动引发一个异常，用关键字throw。\n- **Throws：** 任何被引发方法的异常须通过throws子句定义。\n\
    - **Finally：** 方法返回前绝对被执行的代码被放置在finally块中。\n\n## 异常处理块的通常形式：\n\n```java\ntry {\n\
    // block of code to monitor for errors\n} // ExceptionType 是发生异常的类型\ncatch (ExceptionType1\
    \ exOb) {\n// exception handler for ExceptionType1\n}\ncatch (ExceptionType2 exOb)\
    \ {\n// exception handler for ExceptionType2\n}\n// ...\nfinally {\n// block of\
    \ code to be executed before try block ends\n}\n```\n\n## 10.3 未被捕获的异常\n\n- 程序包括被零除错误的表达式：\n\
    \n```java\nclass Exc0 {\n    public static void main(String args[]) {\n      \
    \  int d = 0;\n        int a = 42 / d;\n    }\n}\n```\n\n- 标准javaJDK解释器执行该程序所产生的输出：\n\
    \n```\njava.lang.ArithmeticException: / by zero\nat Exc0.main(Exc0.java:4)\n```\n\
    \n## 程序的另一个版本\n\n```java\nclass Exc1 {\n    static void subroutine() {\n     \
    \   int d = 0;\n        int a = 10 / d;\n    }\n    public static void main(String\
    \ args[]) {\n        Exc1.subroutine();\n    }\n}\n```\n\n- 标准javaJDK解释器执行该程序所产生的输出：\n\
    \n```\njava.lang.ArithmeticException: / by zero\nat Exc1.subroutine(Exc1.java:4)\
    \  //该方法在第4行导致了异常。\nat Exc1.main(Exc1.java:7)       //栈底是main第7行，调用subroutine()方法\n\
    ```\n\n"
