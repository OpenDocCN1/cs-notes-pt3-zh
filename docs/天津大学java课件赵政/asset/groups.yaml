    # 11.7.1 使用同步方法


    +   - 所有对象都有它们与之对应的隐式管程。

    +   - 调用被 synchronized 修饰的方法，可进入某一对象的管程。

    +   - 当一个线程在一个同步方法内部，其他线程必须等待。

    +   - 拥有管程的线程仅需从同步方法中返回，可退出管程。'
