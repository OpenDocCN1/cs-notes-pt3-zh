    \       System.out.println(num);\n    }\n}\n// 方法print（）和方法println（）能输出Java的任何内置类型的值。\n\
    ```\n\nThis is num: 100\n\nThe value of num * 2 is 200\n\n## 2.4 两个控制语句\n\n###\
    \ 2.4.1 if 控制语句\n\n- if(condition) statement;\n\n- 运算符 含义\n\n- < 小于\n\n- > 大于\n\
    \n- == 等于\n\n### 例 P21\n\n```\n/*\n  Demonstrate the if. Call this file \"IfSample.java\"\
