    # 声明为 static 的方法有以下几条限制：


    +   - 它们仅能调用其他的 static 方法。

    +   - 它们只能访问 static 数据。

    +   - 它们不能以任何方式引用 this 或 super。


    +   - 初始化 static 变量，可以声明一个 static 块，static 块仅在该类被加载时执行一次。'
