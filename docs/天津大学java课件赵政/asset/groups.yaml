    # 3.9.2  不兼容类型的强制转换


    +   - 强制类型转换是一种显式的类型变换。

    +   - 强制类型转换通用格式如下：

    +     `(target-type)value // target-type 指定了转换成类型。`

    +   - 如果整数的值超出了 byte 型的取值范围，它的值将会因为对 byte 型值域取模而减少。例如：

    +     ```java

    +     int a;

    +     byte b;

    +     b = (byte) a;

    +     ```

    +   - 把浮点值赋给整数类型时发生了截断，浮点值的小数部分会被舍去。

    +   - 如果浮点值太大而不能适合目标整数类型，那么它的值将会因为对目标类型值域取模而减少。'
