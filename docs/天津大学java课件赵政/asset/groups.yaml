    # 8.4 何时调用构造函数


    +   在类层次结构中，构造函数以派生的次序调用，从超类到子类。


    +   尽管super()必须是子类构造函数的第一个执行语句，无论你用到了super()没有，这个次序不变。


    +   如果super()没有被用到，每个超类的默认的或无参数的构造函数将执行。'
