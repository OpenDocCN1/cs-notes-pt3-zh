    \ 2.6.4 注释（comments）\n\n单行注释、多行注释、文档注释。\n\n### 2.6.5 分隔符（separators）\n\n| 分隔符\
    \ | 名称 | 用途 |\n| :--- | :--- | :--- |\n| () | 圆括号 | 在定义和调用方法时用来容纳参数表。在控制语句或强制类型转换组成的表达式中用来表示执行或计算的优先权。\
    \ |\n| {} | 花括号、大括号 | 用来包括自动初始化的数组的值。也用来定义程序块、类、方法以及局部范围。 |\n| [] | 方括号、中括号 |\
    \ 用来声明数组的类型，也用来表示撤消对数组值的引用。 |\n| ; | 分号 | 用来终止一个语句。 |\n| ， | 逗号 | 在变量声明中，用于分隔变量表中的各个变量。在\
    \ for 控制语句中，用来将圆括号内的语句连接起来。 |\n| . | 句号（点） | 用来将软件包的名字与它的子包或类分隔。也用来将引用变量与变量或方法分隔。\
    \ |\n\n## 基本词汇（续）\n\n## 2.6.6 Java 关键字：48 个保留关键字\n\nabstract const finally int\
    \ public this boolean continue float interface return throw break default for\
    \ long short throws byte do goto native static transient Case double if new strictfp\
    \ try Catch else implements package super void char extends import private switch\
    \ volatile Class final instanceof protected synchronized while\n\nJava 还有以下保留字：true，false，null。\n\
    \n## 2.6.7 Java 类库\n\n作为一个整体，Java 是 Java 语言本身和它的标准类的组合体。\n\n类库包含许多内置的方法，用以提供对诸如输入/输出（I/O）、字符串处理、网络、图形的支持。标准的类还提供对窗口输出的支持。\n\
    \n# 第一部分 Java 语言\n\n# 第 03 章 数据类型、变量、数组\n\n## 3.1 Java 语言是强类型语言\n\n- Java 语言强类型语言。\n\
    - Java 的安全和健壮性部分来自于强类型语言。\n- 每个变量有类型，每个表达式有类型，而且每种类型是严格定义的。\n- 所有的数值传递，不管是直接的还是通过方法调用经由参数传过去的都要先进行类型相容性的检查。\n\
    - Java 编译器对所有的表达式和参数都要进行类型相容性的检查以保证类型是兼容的。\n- 任何类型的不匹配都是错误的，在编译器完成编译以前，错误必须被改正。\n\
    \n## 3.3 整数类型\n\n- Java 定义了 4 个整数类型：byte, short, int, long。\n- Java 不支持无符号的整数。\n\
    \n| 类型 | 位数 | 范围 |\n| :--- | :--- | :--- |\n| 长整型 | 64 | -9,223,372,036,854,775,808\
    \ ~ 9,223,372,036,854,775,807 |\n| 整型 | 32 | -2,147,483,648 ~ 2,147,483,647 |\n\
    | 短整型 | 16 | -32,768 ~ 32,767 |\n| 字节型 | 8 | -128 ~ 127 |\n\n## 3.3.1 字节型（byte）\n\
    \n- 有符号的 8 位类型。\n- 数的范围是 -128～127。\n- 从网络或文件处理数据流的时候，字节类型的变量特别有用。\n- 处理未加工的二进制的数据时，它们也是有用的。\n\
    - 例如：byte b, c;\n\n## 3.3.2 短整型（short）\n\n- 有符号的 16 位类型。\n- 数的范围是 -32,768 ~ 32,767。\n\
    - 可能是 Java 中使用得最少的类型。\n- 例如：\n  ```java\n  short s;\n  short t;\n  ```\n\n## 3.3.3\
    \ 整型（int）\n\n- 最常用的整数类型是 int。它是有符号的 32 位类型。\n- 数的范围是 -2,147,483,648～2,147,483,647。\n\
    - 包含 byte，short，int 及字面量数字，有进行计算以前，所有表达式的类型被提升到 int。\n- 整型是最通用并且有效的类型。\n\n## 3.3.4\
    \ 长整型（long）\n\n- 有符号的 64 位类型\n- 数的范围是 -9,223,372,036,854,775,808 ~ 9,223,372,036,854,775,807\n\
    - 对于那些整型不足以保存所要求的数值时是有用的。\n\n## 例 P30\n\n```java\n// Compute distance light travels\
    \ using long variables.\nclass Light {\n    public static void main(String args[])\
    \ {\n        int lightspeed;\n        long days;\n        long seconds;\n    \
    \    long distance;\n        // approximate speed of light in miles per second\n\
    \        lightspeed = 186000;\n        days = 1000; // specify number of days\
    \ here\n        seconds = days * 24 * 60 * 60; // convert to seconds\n       \
    \ distance = lightspeed * seconds; // compute distance\n        System.out.print(\"\
    \\n \" + days);\n        System.out.print(\" days light will travel about \");\n\
    \        System.out.println(distance + \" miles.\");\n    }\n}\n```\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_59_0.png)\n\
