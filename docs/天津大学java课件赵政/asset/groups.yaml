    # （1）封装


    +   - 封装（Encapsulation）是将代码及其处理的数据绑定在一起的一种编程机制。

    +   - 把它想成一个黑匣子，它可以阻止在外部定义的代码随意访问内部代码和数据。

    +   - 类（class）定义了将被一个对象集共享的结构和行为（数据和代码）。

    +   - 类的代码和数据称为该类的成员（members）。

    +     - 类定义的数据称为成员变量（member variables）

    +     - 操作数据的代码称为成员方法（member methods）'
