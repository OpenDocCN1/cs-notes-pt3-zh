    - 当 Java 调用一个重载方法时，参数与调用参数匹配的方法被执行。\n- 当你重载一个方法时，该方法的每个版本都能够执行你想要的任何动作。没有什么规定要求重载方法之间必须互相关联。\n\
    - 在实际的编程中，你应该只重载相互之间关系紧密的操作。\n\n```java\nclass Overload {\npublic static void\
