    # 11.7 线程同步


    +   - 当两个或两个以上线程要共享资源，它们需要某种方法来确定资源在某一刻仅被一个线程占用。达到此目的的过程叫做同步（synchronization）。

    +   - 同步的关键是管程（semaphore）。管程是一个互斥独占锁定的对象，或称互斥体（mutex）。

    +   - 在给定的时间，仅有一个线程可以获得管程。

    +   - 当一个线程需要锁定，它必须进入管程。

    +   - 其他线程试图进入已经锁定的管程，必须挂起直到第一个线程退出管程。这些其他的线程被称为等待管程。

    +   - 一个拥有管程的线程如果愿意的话可以再次进入相同的管程。'
