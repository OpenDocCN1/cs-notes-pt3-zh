    # # 第1部分 Java语言


    # ## 第02章 Java 语言概述'
  - '[PAGE 21]


    # 2.1 面向对象编程


    # 2.1.1 两种范型


    +   - 计算机程序由两类元素组成：代码和数据。


    +   - 面向过程（process-oriented model）的程序都具有线性执行的特点。面向过程的模型可以看作是代码作用于数据。程序围绕“正在发生什么”编写。


    +   - 面向对象（object-oriented programming）的编程围绕它的数据（即对象）和为这个数据严格定义的接口来组织程序。面向对象的程序实际上是用数据控制对代码的访问。程序则围绕“谁将被影响”编写。'
