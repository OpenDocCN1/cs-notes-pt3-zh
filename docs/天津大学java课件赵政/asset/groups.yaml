    \ P39\n\n```java\n// Demonstrate lifetime of a variable.\nclass LifeTime {\n \
    \ public static void main(String args[]) {\n    int x;\n    for(x = 0; x < 3;\
    \ x++) {\n      int y = -1;    // y is initialized each time block is entered\n\
    \      System.out.println(\"y is: \" + y); // this always prints -1\n      y =\
    \ 100;\n      System.out.println(\"y is now: \" + y);\n    }\n  }\n}\n```\n\n\
    ### Ans\n\n```text\ny is: -1\ny is now: 100\ny is: -1\ny is now: 100\ny is: -1\n\
    y is now: 100\n```\n\n- 尽管程序块能被嵌套，你不能将内部作用域声明的变量与其外部作用域声明的变量重名。\n- Java不同于 C 和\
    \ C++。\n- 例子：P39\n\n```java\n// This program will not compile\nclass ScopeErr\
    \ {\n    public static void main(String args[]) {\n        int bar = 1;\n    \
    \    { // creates a new scope\n            int bar = 2; // Compile-time error\
    \ – bar already defined!\n        }\n    }\n}\n```\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_88_0.png)\n\
    \n## 3.9 类型转换与强制类型转换\n\n- 编程时把一种类型的值赋给另外类型的一个变量是相当常见的。\n- 如果这2种类型是兼容的，那么Java将自动地进行转换。例如，`int`\
    \ ➔ `long`。\n- 使用强制类型转换，能完成两个不兼容的类型之间的显式变换。\n\n## 3.9.1 Java的自动转换\n\n- 下列2个条件都能满足，将执行自动类型转换（automatic\
    \ type conversion）：\n  - 这2种类型是兼容的。例如 integer 和 floating-point 彼此兼容\n  - 目的类型数的范围比来源类型的大。例如\
    \ int 型比 byte 型的范围大\n- 数字类型（包括整数和浮点）都是彼此兼容。\n- 数字类型和字符类型或布尔类型是不兼容的\n- 字符类型和布尔类型是不兼容的。\n\
    \n![](img/489adce8323ca3a7b0e9fe701e6e665c_90_0.png)\n\n## 3.9.2 不兼容类型的强制转换\n\n\
    - 强制类型转换是一种显式的类型变换。\n- 强制类型转换通用格式如下：\n\n```java\n(target-type)value // target-type\
    \ 指定了转换成类型。\n```\n\n- 如果整数的值超出了 byte 型的取值范围，它的值将会因为对 byte 型值域取模而减少。例如：\n\n```java\n\
    int a;\nbyte b;\nb = (byte) a;\n```\n\n- 把浮点值赋给整数类型时发生了截断，浮点值的小数部分会被舍去。\n- 如果浮点值太大而不能适合目标整数类型，那么它的值将会因为对目标类型值域取模而减少。\n\
    \n### 例 P41\n\n```java\n// Demonstrate casts.\nclass Conversion {\n    public\
    \ static void main(String args[]) {\n        byte b;\n        int i = 257;\n \
    \       double d = 323.142;\n        System.out.println(\"\\nConversion of int\
    \ to byte.\");\n        b = (byte) i;   // 257 -> byte , 257 mod 256 = 1\n   \
    \     System.out.println(\"i and b \" + i + \" \" + b);\n        System.out.println(\"\
    \\nConversion of double to int.\");\n        i = (int) d;    // 323.142 -> 323\n\
    \        System.out.println(\"d and i \" + d + \" \" + i);\n        System.out.println(\"\
    \\nConversion of double to byte.\");\n        b = (byte) d;   // 323.142 -> 323\
    \ mod 256 -> 67\n        System.out.println(\"d and b \" + d + \" \" + b);\n \
    \   }\n}\n```\n\n### Ans\n\n```text\nConversion of int to byte.\ni and b 257 1\n\
    Conversion of double to int.\nd and i 323.142 323\nConversion of double to byte.\n\
    d and b 323.142 67\n```\n\n## 3.10 表达式中类型的自动提升\n\n- 对中间值的精确要求有时超过任何一个操作数的范围。例如：\n\
    \n```java\nbyte a = 40;\nbyte b = 50;\nbyte c = 100;\nint d = a * b / c;  // 自动提升byte型或short型操作数到int型。\n\
    ```\n\n- 自动类型提升有好处，也会引起编译错误。例如：\n\n```java\nbyte b = 50;  // 表达式求值时自动提升为int\n\
    b = b * 2;    // Error! Cannot assign an int to a byte!\n```\n\n- 使用一个显式的强制类型转换，\n\
    \n```java\nbyte b = 50;\nb = (byte)(b * 2);\n```\n"
