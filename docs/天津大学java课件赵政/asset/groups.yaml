    \ `char`。\n- 有关 Unicode 码的更多信息可在网址 http://www.unicode.org 上找到。\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_65_0.png)\n\
    \n### 例 P32\n\n```java\n// Demonstrate char data type.\nclass CharDemo {\n   \
    \ public static void main(String args[]) {\n        char ch1, ch2;\n        ch1\
    \ = 88; // code for X\n        ch2 = 'Y';\n        System.out.print(\"ch1 and\
    \ ch2: \");\n        System.out.println(ch1 + \" \" + ch2);\n    }\n}\n```\n\n\
    ![](img/489adce8323ca3a7b0e9fe701e6e665c_66_0.png)\n\n### Ans:\n\nch1 and ch2:\
    \ X Y\n\n### 例 P33\n\n```java\n// char variables behave like integers.\nclass\
    \ CharDemo2 {\n    public static void main(String args[]) {\n        char ch1;\n\
    \        ch1 = 'X';\n        System.out.println(\"ch1 contains \" + ch1);\n  \
    \      ch1++; // increment ch1, 像整数一样进行运算操作\n        System.out.println(\"ch1\
    \ is now \" + ch1);\n    }\n}\n```\n\n### Ans:\n\nch1 contains X\n\nch1 is now\
    \ Y\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_69_0.png)\n\n## 3.6 布尔型\n\n- 表示逻辑值的简单类型。\n\
    - 值只能是真或假。\n- 当用方法 `println()` 输出布尔的值时，显示的是“true”或“false”。\n- 布尔变量的值本身就足以用来控制\
    \ `if` 语句。\n- 关系运算符（例如 `<`）的结果是布尔值。\n\n### 例 P33\n\n```java\n// Demonstrate boolean\
    \ values.\nclass BoolTest {\n    public static void main(String args[]) {\n  \
    \      boolean b;\n        b = false;\n        System.out.println(\"b is \" +\
    \ b);\n        b = true;\n        System.out.println(\"b is \" + b);\n       \
    \ // a boolean value can control the if statement\n        if(b) System.out.println(\"\
    This is executed.\");\n        b = false;\n        if(b) System.out.println(\"\
    This is not executed.\");\n        // outcome of a relational operator is a boolean\
    \ value\n        System.out.println(\"10 > 9 is \" + (10 > 9));\n    }\n}\n```\n\
    \n![](img/489adce8323ca3a7b0e9fe701e6e665c_71_0.png)\n\n## 3.7 进一步研究字面量\n\n###\
    \ 3.7.1 整数字面量\n\n- 任何一个数字的值就是一个整数字面量。\n- 十进制（decimal，基数是10）。\n- 八进制（octal，基数是8）：\n\
    \  - 前导为 0\n- 十六进制（hexadecimal，基数是16）：\n  - 前导为 `0x` 或 `0X`\n- Long 字面量：后面加 `l`\
    \ 或 `L`。\n\n### 3.7.3 布尔型字面量\n\n- 布尔型字面量仅仅有2个逻辑值，真或假。\n- Java 中，真字面量的值不等于 1，假字面量的值也不等于\
    \ 0。\n\n### 3.7.4 字符字面量\n\n- 可见的 ASCII 字符都能直接被包括在单引号之内，例如 `'a'`、`'z'` 和 `'@'`。\n\
    - 八进制记法，使用反斜线加3个阿拉伯数字。例如，`'\\141'` 是字母 `'a'`。\n- 十六进制记法，使用反斜线和 u（`\\u`）加4个十六进制阿拉伯数字。例如，`'\\\
    u0061'` 因为高位字节是零，代表 ISO-Latin-1 字符集中的 `'a'`。\n\n### 3.7.5 字符串字面量\n\n- 字符串字面量将一系列字符用双引号括起来。\n\
    - 为字符串定义的字符转义序列和八进制/十六进制记法在字符串内的工作方式一样。\n- 例如：\n  - `\"Hello World\"`\n  - `\"\
    two\\nlines\"`\n  - `\"\\\"This is in quotes\\\"\"`\n\n## 3.8 变量\n\n- 变量是 Java\
    \ 程序的一个基本存储单元。\n- 变量由一个标识符、类型及一个可选初始值的组合定义。\n- 所有的变量都有一个作用域，定义变量的可见性和生存期。\n\n\
    ### 3.8.1 声明一个变量\n\n- 所有的变量必须先声明再使用。\n- 基本的变量声明方法如下：\n\n  `type identifier [ =\
    \ value][, identifier [= value] ...] ;`\n\n- 变量声明的例子：\n\n  ```java\n  int a, b,\
    \ c; // declares three ints, a, b, and c.\n  int d = 3, e, f = 5; // declares\
    \ three more ints, initializing\n  // d and f.\n  byte z = 22; // initializes\
    \ z.\n  double pi = 3.14159; // declares an approximation of pi.\n  char x = 'x';\
    \ // the variable x has the value 'x'.\n  ```\n\n- Java 允许任何合法的标识符具有任何它们声明的类型。\n\
    \n### 3.8.2 动态初始化\n\n- 允许在变量声明时使用任何有效的表达式来动态地初始化变量。\n- 例如：例 P37\n\n```java\n//\
    \ Demonstrate dynamic initialization.\nclass DynInit {\n    public static void\
    \ main(String args[]) {\n        double a = 3.0, b = 4.0;\n        // c is dynamically\
    \ initialized\n        double c = Math.sqrt(a * a + b * b);\n        System.out.println(\"\
    Hypotenuse is \" + c);\n    }\n}\n```\n"
