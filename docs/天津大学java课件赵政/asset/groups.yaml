  md: "\n## 4.6 ? 运算符\n\n- 二元运算符用于取代某个类型的 if-then-else 语句。\n- 通用格式如下：\n\n    `expression1\
    \ ? expression2 : expression3`\n\n- exp1 是一个布尔表达式，exp2 和 exp3 是除了 void 以外的任何类型的表达式，且它们的类型必须相同。\n\
    - 例子：\n\n    `ratio = denom == 0 ? 0 : num / denom;`\n\n## 4.7 运算符优先级\n\n- 圆括号被用来改变运算的优先级。\n\
    - 方括号用来表示数组的下标。\n- 点运算符用来将对象名和成员名连接起来。\n\n### Java 运算符优先级\n\n| 运算符 |\n| --- |\n\
    | () |\n| ++ |\n| * |\n| + |\n| >> |\n| >>= |\n| == |\n| & |\n| ^ |\n| \\| |\n\
    | && |\n| \\|\\| |\n| ?: |\n| = |\n| [] |\n| -- |\n| / |\n| - |\n| >>> |\n| <<=\
    \ |\n| != |\n| . |\n| ~ |\n| % |\n| << |\n| ! |\n| op= |\n\n## 4.8 使用圆括号\n\n-\
    \ 圆括号提高了括在其中的运算的优先级。\n- 3 加到变量 b，得到一个中间结果，然后将变量 a 右移该中间结果位：\n\n    ```java\n \
    \   a >> b + 3\n    ```\n\n    或 `a >> (b + 3)` 而不是 `(a >> b) + 3`\n\n- 括号有时被用来帮助澄清表达式的含义：\n\
    \n    ```java\n    a | 4 + c >> b & 7\n    (a | ((((4 + c) >> b) & 7)))\n    ```\n\
    \n- 圆括号（不管是不是多余的）不会降低你程序的运行速度。\n\n## 第1部分 Java语言\n\n## 第05章 程序控制语句\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_168_0.png)\n\
    \n- 编程语言使用控制（control）语句来产生执行流，从而完成程序状态的改变。\n- 重复：（Iteration）语句使程序能够重复执行一个或一个以上语句（也就是说，重复语句形成循环）。\n\
    - 跳转：（Jump）语句允许你的程序以非线性的方式执行。\n- Java 的控制语句与 C/C++ 中的语句几乎完全相同。\n\n### 5.1 Java\
    \ 的选择语句\n\n### 5.1.1 if 语句\n\n- If 语句是 Java 中的条件分支语句。\n- 完整格式如下：\n\n    ```java\n\
    \    if (condition) statement1;\n    else statement2;\n    ```\n\n- 例子：\n\n  \
    \  ```java\n    int a, b;\n    // ...\n    if(a < b) a = 0;\n    else b = 0;\n\
    \    ```\n\n### 5.1.1 if 语句（续）\n\n- 建一个程序块以包含更多的语句：\n\n    ```java\n    int bytesAvailable;\n\
    \    // ...\n    if (bytesAvailable > 0) {\n      ProcessData();\n      bytesAvailable\
    \ -= n;\n    } else\n      waitForMoreData();\n    ```\n\n- 适当定义块：\n\n    ```java\n\
    \    int bytesAvailable;\n    // ...\n    if (bytesAvailable > 0) {\n      ProcessData();\n\
    \      bytesAvailable -= n;\n    } else {\n      waitForMoreData();\n      bytesAvailable\
    \ = n;\n    }\n    ```\n\n### 嵌套 if 语句\n\n- 嵌套 if 语句是指该 if 语句为另一个 if 或者 else 语句的对象。\n\
    - 一个 else 语句总是对应着和它在同一个块中的最近的 if 语句。\n- 例子：\n\n    ```java\n    if(i == 10) {\n\
    \      if(j < 20) a = b;\n      if(k > 100) c = d;  // this if is\n      else\
    \ a = c;         // associated with this else\n    }\n    else a = d;        \
    \   // this else refers to if(i == 10)\n    ```\n\n### if-else-if 阶梯\n\n- 语法如下：\n\
    \n    ```java\n    if(condition)\n      statement;\n    else if(condition)\n \
    \     statement;\n    else if(condition)\n      statement;\n    .\n    .\n   \
    \ .\n    else\n      statement;\n    ```\n\n### 例 P71 使用if-else-if阶梯来确定某个月是什么季节\n\
    \n```java\n// Demonstrate if-else-if statements.\nclass IfElse {\n    public static\
    \ void main(String args[]) {\n        int month = 4; // April\n        String\
    \ season;\n        if(month == 12 || month == 1 || month == 2)\n            season\
    \ = \"Winter\";\n        else if(month == 3 || month == 4 || month == 5)\n   \
    \         season = \"Spring\";\n        else if(month == 6 || month == 7 || month\
    \ == 8)\n            season = \"Summer\";\n        else if(month == 9 || month\
    \ == 10 || month == 11)\n            season = \"Autumn\";\n        else\n    \
    \        season = \"Bogus Month\";\n        System.out.println(\"April is in the\
    \ \" + season + \".\");\n    }\n}\n```\n\nAns:\n\nApril is in the Spring.\n\n\
    ![](img/489adce8323ca3a7b0e9fe701e6e665c_175_0.png)\n\n### 5.1.2 switch语句\n\n\
    - 基于一个表达式的值来使程序执行不同部分的简单方法。\n- 通用形式如下：\n\n    ```java\n    switch (expression)\
    \ {    // exp 必须为 byte，short，int 或 char 类型\n        case value1:          // value\
    \ 必须是与表达式类型兼容的常量\n            // statement sequence\n            break;    //\
    \ 当遇break时，程序将从switch后的第一行代码开始继续执行\n        case value2:\n            // statement\
    \ sequence\n            break;\n        .\n        .\n        case valueN:\n \
    \           // statement sequence\n            break;\n        default: // 若无case常量与值相匹配，则执行default语句。default是可选。\n\
    \        // default statement sequence\n    }\n    ```\n\n### 例 P72 使用switch语句的简单例子\n\
    \n```java\n// A simple example of the switch.\nclass SampleSwitch {\n    public\
    \ static void main(String args[]) {\n        for(int i=0; i<6; i++)\n        \
    \    switch(i) {\n                case 0:\n                    System.out.println(\"\
    i is zero.\");\n                    break;\n                case 1:\n        \
    \            System.out.println(\"i is one.\");\n                    break;\n\
    \                case 2:\n                    System.out.println(\"i is two.\"\
    );\n                    break;\n                case 3:\n                    System.out.println(\"\
    i is three.\");\n                    break;\n                default:\n      \
    \              System.out.println(\"i is greater than 3.\");\n            }\n\
    \    }\n}\n```\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_177_0.png)\n"
