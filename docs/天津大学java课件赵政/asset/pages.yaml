  md: '+   - 继承是面向对象编程技术的一块基石，因为它允许创建分等级层次的类。

    +   - 运用继承，你能够创建一个通用类，它定义了一系列相关项目的一般特性。

    +   - 该类可以被更具体的类继承，每个具体的类都增加一些自己特有的东西。

    +   - 被继承的类叫超类（superclass）。

    +   - 继承超类的类叫子类（subclass）。'
