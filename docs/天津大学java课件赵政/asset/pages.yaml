    \            System.out.println(\"Stack underflow.\");\n            return 0;\n\
    \        }\n        else    return stck[tos--];\n    }\n}\n```\n```\n\n![](img/489adce8323ca3a7b0e9fe701e6e665c_437_0.png)"
