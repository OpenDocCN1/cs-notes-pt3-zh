    +   - 最外围的try块检查是否含有一个与异常类型匹配的catch语句。如果发现了匹配的块，控制转向该语句；

    +   - 如果没有发现，次包围的try块来检查，以此类推。

    +   - 如果没有发现匹配的catch块，默认异常处理程序中断程序的执行并且打印堆栈轨迹。'
