  md: '# # 12.1.2 字节流和字符流


    +   - Java 2 定义了两种类型的流： 字节类和字符类

    +   - 字节流（byte stream）处理字节的输入和输出（二进制数据）。

    +   - 字符流（character stream）处理字符的输入和（统一的编码标准，国际化）。

    +   - 在某些场合， 字符流比字节流更有效。

    +   - Java的原始版本（Java 1.0）不包括字符流。

    +   - 在最底层， 所有的输入/输出都是字节形式的。'
