- pgno: 90
  md: '# 3.9.1 Java的自动转换


    +   - 下列2个条件都能满足，将执行自动类型转换（automatic type conversion）：

    +   - 这2种类型是兼容的。

    +     例如 integer 和 floating-point 彼此兼容

    +   - 目的类型数的范围比来源类型的大。

    +     例如 int 型比 byte 型的范围大。

    +   - 数字类型（包括整数和浮点）都是彼此兼容。

    +   - 数字类型和字符类型或布尔类型是不兼容的

    +   - 字符类型和布尔类型是不兼容的。


