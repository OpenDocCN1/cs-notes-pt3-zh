- pgno: 542
  md: '# 11.8.1 死锁


    +   - 需要避免特殊错误类型是死锁（deadlock）。

    +   - 死锁发生在当两个线程对一对同步对象有循环依赖关系时。

    +   - 假定一个线程进入了对象X的管程而另一个线程进入了对象Y的管程。

    +     如果X的线程试图调用Y的同步方法，它将像预料的一样被锁定。

    +     而Y的线程同样希望调用X的一些同步方法，线程永远等待，因为到达X，必须释放自己的Y的锁定以使第一个线程可以完成。

    +   - 死锁是很难调试的错误：

    +     （1）极少发生，只有到两线程的时间段刚好符合时才能发生。

    +     （2）可能包含多于两个的线程和同步对象'
