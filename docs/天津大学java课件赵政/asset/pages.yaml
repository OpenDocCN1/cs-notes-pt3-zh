- pgno: 16
  md: '# # 1.4 Java的魔力：字节码


    +   - Java 编译器的输出并不是可执行的代码，而是字节码（bytecode）


    +   - Java虚拟机(JavaVirtual Machine， JVM)。 是一个字节码解释器


    +   - JIT（Just In Time）是 Java 虚拟机的一部分，它根据需要、一部分一部分地将字节码实时编译为可执行代码。


    +   - JIT 不能将整个Java程序一次性全部编译为可执行的代码。'
  merge: -1
  img_proc: true
