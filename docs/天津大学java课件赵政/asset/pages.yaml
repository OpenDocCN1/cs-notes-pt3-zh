    +   - 尽管物理设备不同，所有流的行为具有同样的方式。

    +   - 一个输入流能够抽象多种不同类型的输入：从磁盘文件，从键盘或从网络套接字。

    +   - 一个输出流能抽象多种不同类型的输出：控制台，磁盘文件或相连的网络。

    +   - Java流的实现是在java.io包定义的类层次结构。

    +   - 要使用流类，必须导入Java.io包。'
