  md: '# # 7.7 理解 static


    +   - 一个类成员的使用完全独立于该类的任何对象。

    +   - 在成员的声明前面加上关键字 static（静态的）就能创建这样的成员。

    +   - 如果一个成员被声明为 static，它就能够在它的类的任何对象创建之前被访问，而不必引用任何对象。

    +   - static 成员的最常见的例子是main()。

    +   - 声明为 static 的变量实质上就是全局变量。该类所有的实例变量共用同一个 static 变量。'
