  md: '# ## 2.2.1 键入程序


    +   - 源程序文件名应该是 Example.java。

    +   - 一个源程序文件被称为一个编译单元（compilation unit）。

    +   - 它是一个包含一个或多个类定义的文本文件。

    +   - Java编译器要求源程序文件使用 .java 文件扩展名。

    +   - 类名必须与源程序的文件名相同，确保文件名的大小写字母与类名一样。'
