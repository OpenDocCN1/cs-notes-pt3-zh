    \ \n+     恢复相同对象中第一个调用 `wait()` 的线程。\n\n+   - `final void notifyAll()`  \n+  \
    \   恢复相同对象中所有调用 `wait()` 的线程。  \n+     具有最高优先级的线程最先运行。"
