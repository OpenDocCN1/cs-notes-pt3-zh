  md: '# 11.6 线程优先级


    +   线程优先级用来判定何时每个线程允许运行。


    +   优先级高的线程比优先级低的线程获得更多的CPU时间。


    +   当低优先级线程正在运行，而一个高优先级的线程被恢复，它将抢占低优先级线程所使用的CPU。


    +   在无优先级的环境下，多数线程仍然有机会运行。'
