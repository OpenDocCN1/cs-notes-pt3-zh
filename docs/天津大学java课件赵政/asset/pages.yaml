  md: '# # 10.1 异常处理基础


    +   - 当异常发生，代表该异常的对象被创建，且在导致该错误的方法中被引发（throw）。

    +   - 该方法可以选择自己处理异常或传递该异常。

    +   - 该异常被捕获（caught）并处理。

    +   - 异常可能是由Java运行时系统产生，或者是由你的手工代码产生。

    +   - 被Java引发的异常与违反语言规范或超出Java执行环境限制的基本错误有关。'
