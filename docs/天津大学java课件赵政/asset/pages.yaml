  md: "# 例P170\n\n# 该类实现一个固定长度的整数堆栈\n\n```\n```java\n// An implementation of IntStack\
    \ that uses fixed storage.\nclass FixedStack implements IntStack {\n    private\
    \ int stck[];    private int tos;\n    // allocate and initialize stack\n    FixedStack(int\
    \ size) {    stck = new int[size];    tos = -1;    }\n    // Push an item onto\
    \ the stack\n    public void push(int item) {\n        if(tos == stck.length-1)\
    \          // use length member\n            System.out.println(\"Stack is full.\"\
    );\n        else\n            stck[++tos] = item;\n    }\n    public int pop()\
