  md: '# # 11.1.3 消息传递


    +   - 程序分成若干线程后，就要定义各线程之间的联系。


    +   - Java提供了多线程间会话的简洁、低成本途径——通过调用所有对象都有的预先确定的方法。


    +   - Java的消息传递系统允许一个线程进入一个对象的一个同步方法，然后在那里等待，直到其他线程明确通知它。'
