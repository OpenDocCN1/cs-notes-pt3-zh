- pgno: 32
  md: '# 2.2.2 编译程序


    +   - 编译：`C:\>javac Example.java`

    +   - 编译器 javac 产生名为 `Example.class` 的文件，该文件包含程序的字节码。

    +   - 运行必须使用 Java 解释器：

    +     `C:\>java Example`

    +   - 输出如下内容：

    +     `This is a simple Java program.`

    +   - 当 Java 源代码被编译后，每个单独的类都被放入自己的输出文件中，并以类的名字加“.class”扩展名为其文件名。'
