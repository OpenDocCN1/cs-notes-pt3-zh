  md: '# 11.1.2 同步性


    +   - 多线程在程序中引入了异步行为，所以必须要加强同步性。

    +   - Java在进程间同步性方法：管程（monitor）。

    +   - 一旦线程进入管程，所有线程必须等待直到该线程退出了管程。管程可以用来防止共享的资源被多个线程操纵。

    +   - Java没有“Monitor”类：当对象的同步方法被调用时管程自动载入隐式管程。

    +   - 一个线程包含在一个同步方法中，没有其他线程可以调用相同对象的同步方法。'
