  md: '# 9.4 接口 (interface)


    +   - 用 interface，可以指定一个类必须做什么，而不是规定它如何去做。

    +   - 接口在语句上与类相似，但缺少实例变量，且定义的方法是不含方法体的。

    +   - 一个类可以实现多个接口。

    +   - Java允许利用多态性的“一个接口，多个方法”。

    +   - 因为接口是在和类不同的层次中，与类层次无关的类实现相同的接口是可行的。

    +   - 接口完成C++的多重继承


    ![](img/489adce8323ca3a7b0e9fe701e6e665c_426_0.png)'
