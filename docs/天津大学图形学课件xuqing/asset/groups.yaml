  - '[PAGE 76]


    # Overview of OpenGL Components


    +   - OpenGL Library - gl

    +   - OpenGL Utilities - glu

    +   - OpenGL Extension to X Windows - glx

    +   - OpenGL Programming Guide Auxiliary Library - aux

    +   - Windows Graphics Library - wgl'
  - '[PAGE 77]


    # # OpenGL Library GL


    +   - Powerful But Primitive Set Of Rendering Commands

    +     - All high level drawing is done in terms of these commands

    +     - You can write your own toolkit based on these functions

    +   - The GL Library Includes

    +     - Functions supporting drawing primitives

    +       - Lines, Points, Circles, Polygons, Characters, ...

    +     - Clipping, Viewing, Projections, Transformation

    +     - Shading, Lighting

    +     - Direct colors

    +     - 3D rendering functions such as

    +       - Antialiasing, Multi buffering, Texture, ...

    +     - Pixels manipulation (read, write, copy)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_77_0.png)'
  - '[PAGE 78]


    # # OpenGL Utility Library GLU


    +   - Utility library is a set of commonly used graphics routines

    +     - built on top of OpenGL

    +   - Uses lower level OpenGL commands for

    +     - Setting up matrixes for viewing and projection

    +     - Performing polygon tessellation

    +       - concave polygons, polygons with holes, self- intersecting polygons,
    ..

    +     - Rendering surfaces (spheres, cylinders, disks, ..)

    +     - Mipmapping

    +     - NURBS (Non-Uniform Rational B-Spline) curves

    +     - Error handling

    +   - This library is part of the OpenGL implementation


    ![](img/258e4144ed4b66c8fd4b0f298118df23_78_0.png)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_78_1.png)'
  - '[PAGE 79]


    # # OpenGL Auxiliary Library


    +   - This is a simple, platform-dependent library

    +   - Makes programming examples simpler & more complete

    +     - Managing windows

    +     - Handling input events

    +     - Drawing classic 3-D objects

    +     - Managing a background process

    +     - Running a program

    +   - Do not use them in a production application'
  - '[PAGE 80]


    # # OpenGL Command Syntax


    +   - OpenGL commands use:

    +     - the prefix `gl`

    +     - initial capital letters for each word making up the command name

    +   - OpenGL define constants

    +     - begin with `GL`

    +     - use all capital letters

    +     - use underscore to separate words

    +   - OpenGL uses command extensions for clarification

    +     - whenever the same command exists to use different arguments

    +   - Examples:

    +     - `glClearColor()`

    +     - `GL_COLOR_BUFFER_BIT`

    +     - `glColor3fv()`'
  - '[PAGE 81]


    # # OpenGL Command Syntax


    +   - glVertex3fv

    +     - v indicates vector format, if present

    +     - data type:

    +       - f float

    +       - d double float

    +       - s signed short integer

    +       - i signed integer

    +     - number of components (2, 3, or 4)


    +   - **Other data types in OpenGL commands**

    +     - **b** character

    +     - **ub** unsigned character

    +     - **us** unsigned short integer

    +     - **ui** unsigned integer'
  - '[PAGE 82]


    # # Drawing Geometry


