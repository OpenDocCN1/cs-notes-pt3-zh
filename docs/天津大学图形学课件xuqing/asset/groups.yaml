  mdcn: "\n\n## Normalizing\n\n2.6, -3.1 mapped to 0, 1 or 2.6, 2.6 mapped to 1, 1\
    \ -3.1, -3.1 mapped to 0, 0 2.6, -3.1 mapped to 1, 0\n\n2.6, -3.1 mapped to -1,\
    \ 1 or 2.6, 2.6 mapped to 1, 1 -3.1, -3.1 mapped to -1, -1 2.6, -3.1 mapped to\
    \ 1, -1\n\n- The projection plane(window) shall be mapped to a window standardized\
    \ in size - Normalized Window\n- It will make all following calculations easier.\n\
    \n## Screen Coordinates\n\n- The <u>normalized window</u> will be mapped to a\
    \ specified spot on the screen, called the Viewport.\n- Screen coordinates are\
    \ measured in pixels and are hardware specific.\n- Several viewports can be defined\
    \ on the screen.\n- Viewports can overlap.\n\n## From Window to Viewport\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_187_0.png)\n\
    \n$$\n\\begin{cases}\nx_v = A x_w + B\\\\\ny_v = C y_w + D\n\\end{cases}\n$$\n\
    \n$$\n\\begin{aligned}\nA &= \\frac{VXR - VXL}{WXR - WXL}, & B &= VXL - A \\cdot\
    \ WXL\\\\\nC &= \\frac{VYT - VYB}{WYT - WYB}, & D &= VYB - C \\cdot WYB\n\\end{aligned}\n\
    $$\n\n## Illuminating a Shadow\n\n## Illumination\n\n### Elements of object appearance:\n\
    \n- Geometry\n- Surface property\n- Light source\n\n### Basic illumination components\n\
    \n- Ambient\n  - Not from light source directly\n- Diffuse\n  - From a light source,\
    \ the reflection is spread to all hemisphere directions evenly\n- Specular\n \
    \ - From a light source, the reflection is focused to some directions\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_189_0.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_189_1.png)\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_189_2.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_189_3.png)\n\n## Local Illumination\n\
    \nA lighting model is used to determine the shade of a point on a surface using\
    \ the position, orientation and characteristics of the surface and the light source(s)\
    \ illuminating it. A typical lighting model consists of three separate components\
    \ - **ambient, diffuse and specular**.\n\n## Local Illumination\n\n### Diffuse\
    \ Reflection Model\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_191_0.png)\n\n\
    $$\nI_{dr}=I_{Lr}\\cdot K_{dr}(\\vec{L}\\cdot\\vec{N})\n$$\n$$\nI_{dg}=I_{Lg}\\\
    cdot K_{dg}(\\vec{L}\\cdot\\vec{N})\n$$\n$$\nI_{db}=I_{Lb}\\cdot K_{db}(\\vec{L}\\\
    cdot\\vec{N})\n$$\n\n$$\nI_d=K_d\\sum_{i=1}^{m}\\left[I_{L_i}\\cdot(\\vec{L_i}\\\
    cdot\\vec{N})\\right]\n$$\n\n$$\nI_d=I_L\\cdot K_d\\cos\\theta\n$$\n\n- Know as\
    \ *Lambertian reflection*\n- It is view-independent\n- Reflection coefficient\
    \ depends on the characteristics of material and input light wavelength\n- for\
    \ multiple light sources\n\n## Diffuse lighting\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_192_0.png)\n\
    \n## How to Calculate \\((\\vec{R} \\cdot \\vec{V})\\)\n\n- \\((\\vec{R} \\cdot\
    \ \\vec{V})\\) can be approximated by \\((\\vec{H} \\cdot \\vec{N})\\)\n- Suppose\
    \ the light source and the viewer are both at infinity, \\(\\vec{H}\\) is constant\n\
    \n\\(\\vec{H} = \\frac{1}{2}(\\vec{L} + \\vec{V})\\), normalized as \\(\\frac{\\\
    frac{1}{2}(\\vec{L}+\\vec{V})}{\\left|\\frac{1}{2}(\\vec{L}+\\vec{V})\\right|}\\\
    )\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_194_0.png)\n\n- \\(\\vec{H}\\) can\
    \ be thought as a normal of a virtual specular surface\n- A compensation can be\
    \ obtained by adjusting \\(n\\) *(specular reflection exponent)*\n\n## Specular\
    \ lighting\n\n- can be observed on any shiny surface\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_195_0.png)\n\
    \n## Local Illumination\n\n## Ambient Light\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_196_0.png)\n\
    \nAmbient light is assumed to be constant for all objects\n\nThe ambient - reflection\
    \ coefficient is a material property\n\nI = I_a · K_a\n\nambient reflection coefficient\n\
    \n## Ambient lighting\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_197_0.png)\n\
    \n## Local Illumination\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_198_0.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_198_1.png)\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_198_2.png)\n\
    \n| Item | Description |\n|------|-------------|\n| Point light source only |\
    \ |\n| Light source and viewer are both at infinity | |\n| Only direct illumination\
    \ is considered | |\n| Ambient light is constant | |\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_198_3.png)\n\
    \n"
