    \ the edges or/and diagonals of the cube.\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_60_1.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_60_2.png)\n\n### Color Cube\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_61_0.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_61_1.png)\n\nc=rR+gG+bB\n\n## Problems\
    \ with RGB\n\n- Only a small range of all the colors humans are capable of perceiving\
    \ (particularly for monitor RGB)\n  - Have you ever seen magenta on a monitor?\n\
    - It isn’t easy for humans to say how much of RGB to use to make a given color\n\
    \  - How much R, G and B is there in “brown”? (Answer: .64, .16, .16)\n- Negative\
    \ matches *c+rR=+gG+bB*\n- Perceptually non-linear (non-uniform)\n  - Two points\
    \ a certain distance apart in one part of the space may be perceptually different\n\
    \  - Two other points, the same distance apart in another part of the space, may\
    \ be perceptually the same\n\n## CIE XYZ Color Space\n\n- Defined in 1931 to describe\
    \ the **full space of perceptible colors**\n  - **Revisions** now used by color\
    \ professionals\n- Color matching functions are everywhere positive\n  - Man-made\
    \ primaries – non negative matches!\n  - But, can still describe a color by its\
    \ matching weights\n  - Y component intended to correspond to intensity\n\n##\
    \ Going from RGB to XYZ\n\n### Standard RGB↔XYZ\n\n## Uniform Color Spaces\n\n\
    - Color spaces in which distance in the space corresponds to perceptual “distance”\n\
