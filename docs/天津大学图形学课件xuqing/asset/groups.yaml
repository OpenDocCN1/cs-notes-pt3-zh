  - '[PAGE 97]


    # # Application of Solid Modeling


    +   - To distinguish between the inside, outside and surface of a 3D object and
    to be able to compute properties of the object that depends on this distinction.

    +   - To determine whether two objects interfere with each other.

    +   - To compute properties such as volume and center of mass.

    +   - To determine response to factors such as stress and temperature through
    finite-element analysis modeling.

    +   - Some for graphical techniques, such as modeling refractive transparency,
    depend on being able to determine where a beam of light enters and exits a solid
    object.'
