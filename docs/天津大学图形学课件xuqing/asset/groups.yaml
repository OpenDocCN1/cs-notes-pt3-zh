    ![](img/258e4144ed4b66c8fd4b0f298118df23_238_0.png)


    +   - It is also called visible-surface determination, to discover whether each
    object is visible to the viewer, or is obscured from the viewer by other objects.

    +   - Object Space Algorithm

    +     - Back-Face Removal Algorithm

    +     - Depth Sort and Painter’s Algorithm

    +   - Image Space Algorithm

    +     - Z-Buffer Algorithm

    +     - Scan-Line Algorithm'
  - '[PAGE 239]


    # # Z-Buffer Algorithm


    +   - Advantages:

    +     - easy to implement, in either hardware or software.

    +     - compatible with pipeline architectures.

    +     - can be regarded as part of the scan-conversion process.

    +   - Z-Buffer, a depth buffer with same resolution as the frame buffer, each
    element in this buffer contains the distance along the ray corresponding to this
    location of the closest intersection point on any polygon found so far.


    ![](img/258e4144ed4b66c8fd4b0f298118df23_239_0.png)


    ```

    ```

    ax + by + cz + d = 0

    Δx = x2 - x1

    Δy = y2 - y1

    Δz = z2 - z1

    aΔx + bΔy + cΔz = 0

    Δz = -a/c Δx

    ```

    ```


    Incremental!'
  - "[PAGE 240]\n\n# # The Z-buffer\n\n+   For each pixel on screen, have at least\
    \ two buffers\n+   \n+   – Color buffer stores the current color of each pixel\n\
    +   » The thing to ultimately display\n+   \n+   – Z-Buffer stores at each pixel\
    \ the depth of the nearest thing seen so far\n+   » Also called the depth buffer\n\
    \n+   Initialize this buffer to a value corresponding to the furthest point (z=1.0\
    \ for canonical and window space)\n\n+   As a polygon is filled in, compute the\
    \ depth value of each pixel that is to be filled\n+   \n+   – if depth < z-buffer\
    \ depth, fill in pixel color and new depth\n+   \n+   – else disregard"
