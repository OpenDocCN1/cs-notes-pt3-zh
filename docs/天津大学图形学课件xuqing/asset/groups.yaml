  - '[PAGE 211]


    # Raytracing


    +   - For each sample …

    +     - Construct ray from eye position through view plane

    +     - Find first surface intersected by ray through pixel

    +     - Compute color sample based on surface radiance, which is illuminated by
    light source directly and by environment **indirectly(?)**


    ![](img/258e4144ed4b66c8fd4b0f298118df23_211_0.png)'
  - '[PAGE 212]


    # # Raytracing for each eye ray


    ![](img/258e4144ed4b66c8fd4b0f298118df23_212_0.png)'
  - '[PAGE 213]


    # Ray Tracing


    +   - Cast rays out from the eye, through each pixel, and determine what they
    hit first

    +     - Builds the image pixel by pixel, one at a time

    +   - Cast additional rays from the hit point to determine the pixel color

    +     - Shadow rays toward each light. If they hit something, then the object
    is shadowed from that light, otherwise use “standard” model for the light

    +     - Reflection rays for mirror surfaces, to see what should be reflected in
    the **mirror (ideally specular reflection)**

    +     - Transmission rays to see what can be seen through **transparent objects
    (ideally refraction)**

    +     - Sum all the contributions to get the pixel color'
  - '[PAGE 214]


    # Ray Tracing


    # Lighting calculation


    If I(P₀, u) is the intensity seen from point P along direction u


    $$I(P_0,\mathbf{u}) = I_{direct} + I_{reflected} + I_{transmitted}$$


    where


    $$I_{direct} = Shade(\mathbf{N},\mathbf{L},\mathbf{u},\mathbf{R})\ \text{(e.g.
    Phong shading model)}$$


    $$I_{reflected} = k_r I(P,\mathbf{R})$$


    $$I_{transmitted} = k_t I(P,\mathbf{T})$$


    Typically, we set $k_r = k_s$ and $k_t$


