  - '[PAGE 85]


    # # Attributes


    +   - Vertex attributes:

    +     - glPointSize() point size

    +     - glColor*()/ glIndex*() current vertex color

    +     - glNormal*() current vertex normal (lighting)

    +     - glMaterial*() current material property (lighting)

    +     - glTexCoord*() current texture coordinate

    +     - glEdgeFlag*() edge status (surface primitives)

    +   - RGB colors:

    +     - glColor3f(1.0,0,0,0.0)

    +     - glClearColor(1.0,1.0,1.0,1.0)

    +   - Indexed color:

    +     - glIndexi(element)


    > > Alpha channel

    > > - opacity or transparency'
  - '[PAGE 86]


    # # Drawing Geometry


    +   - Example: Drawing a green, flat triangle strip:

    +     glBegin (GL_TRIANGLE_STRIP);

    +     glColor3f( 0. f, 1. f, 0. f);

    +     glNormal3f( 0. f, 0. f, 1. f);

    +     glVertex3f(-.5f, -.5f, -.5f);

    +     glVertex3f(.5f, -.5f, -.5f);

    +     glVertex3f(-.5f, .5f, -.5f);

    +     glVertex3f(.5f, .5f, -.5f);

    +     glEnd();


    +   - glBegin - glEnd paradigm allows great flexibility in describing primitives.


    +   - Any combination of color, normal, texture, material etc. information can
    be bound with any given vertex.'
  - '[PAGE 87]


    # # OpenGL The Statemachine


    +   - OpenGL knows about various different states or modes

    +   - These states remain in effect until you change them

    +   - Examples of states variables are:

    +     - the current color

    +     - current viewing and transformation matrix

    +     - line and polygon stipping patterns

    +     - polygon drawing modes

    +     - shading modes

    +     - pixel packing conventions

    +     - position and characteristics of light sources

    +     - material properties

    +   - Each state variable has a default value

    +   - You can query the current variable value'
  - '[PAGE 88]


    # # States


    +   - glEnable (GLenum capability)

    +   - glDisable (GLenum capability)

    +   - GLboolean glIsEnabled (GLenum cap)

    +     - turn on and off OpenGL states

    +     - capability can be one of (partial list):

