    \ type has a set of attributes\n\n## Attributes\n\n- Vertex attributes:\n  - glPointSize()\
    \ point size\n  - glColor*()/ glIndex*() current vertex color\n  - glNormal*()\
    \ current vertex normal (lighting)\n  - glMaterial*() current material property\
    \ (lighting)\n  - glTexCoord*() current texture coordinate\n  - glEdgeFlag*()\
    \ edge status (surface primitives)\n- RGB colors:\n  - glColor3f(1.0,0,0,0.0)\n\
    \  - glClearColor(1.0,1.0,1.0,1.0)\n- Indexed color:\n  - glIndexi(element)\n\n\
    > Alpha channel\n> - opacity or transparency\n\n## Drawing Geometry\n\n- Example:\
    \ Drawing a green, flat triangle strip:\n  ```\n  glBegin (GL_TRIANGLE_STRIP);\n\
    \  glColor3f( 0. f, 1. f, 0. f);\n  glNormal3f( 0. f, 0. f, 1. f);\n  glVertex3f(-.5f,\
