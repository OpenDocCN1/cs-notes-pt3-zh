    \n## CAD In Architecture\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_16_0.png)\n\
    \n## Simulation/Training\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_17_0.png)\n\
    \n## Visualization\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_19_0.png)\n\n##\
    \ Computational photography & video\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_20_0.png)\n\
    \n## Lighting Sensitive Display\n\n## Researches in Computer Graphics\n\n- Two\
    \ goals are *realism* and *real time*\n- Research topics:\n  - Complex object\
    \ modeling (geometry)\n  - Computing model for object surface detailed characteristics\
    \ (material, texture)\n  - Illumination, rendering, and so on\n  - Hardware architectures\n\
