    ## Spatial-Occupancy Enumeration


    The solid is decomposed into identical cells (called voxels) arranged in a fixed,
    regular grid.


    ![](img/258e4144ed4b66c8fd4b0f298118df23_110_0.png)


    - To represent an object, we need only to decide which cells are occupied and
    which are not.

    - The object can be encoded by a unique and unambiguous list of occupied cells.

    - Easy for set operation, but need large amount memory space for


    example


    ![](img/258e4144ed4b66c8fd4b0f298118df23_111_0.png)


    ## Octree


    ![](img/258e4144ed4b66c8fd4b0f298118df23_112_0.png)


    ### Advantages:


    - Simple data structure

    - Easy for set operation

    - Easy for inspecting collision between solid objects

    - Easy for calculating object’s properties such as volume, mass, and so on.


    ### Drawback:


    - Still need large amount memory

    - Difficult to do transformation

    - Difficult to transfer to b-reps


    ## Application Example


    ![](img/258e4144ed4b66c8fd4b0f298118df23_115_0.png)


    ## Thesaurus(Tianjin University)


    - File

    - Edit

