    \ polygons:\n    - Polygon 1: Depth=4; vertex1=(1,1); vertex2=(1,3); vertex3=(3,3);\
    \ vertex4=(3,1)\n\nThis polygon is rendered entirely as there is nothing to obscure\
    \ it.\n\n## The Z-buffer (Image Precision)\n\n- Example:\n  - Render polygons:\n\
    \    - Polygon 2: Depth=2; vertex1=(3,0); vertex1=(3,2); vertex1=(5,2); vertex1=(5,0)\n\
    \nThis polygon is nearer to the viewer than the red one, so it is drawn completely.\n\
    \n"
  mdcn: "\n\n## Scan-Line Algorithms\n\n- Four steps (for each scan line):\n  - Get\
    \ intersections\n  - Sorting along x\n  - Make pairs\n  - Filling\n- Two special\
    \ problems:\n  - Intersection choice\n  - Choice of the pixels on edge\n\n## Odd-even\
    \ fill\n\n- For each edge, color all pixels which are on the right of the edge.\n\
    - Process every edges in any order\n- Simple, but, each pixel might need many\
    \ times to be accessed.\n\n## Line-Segment Clipping\n\n- We start with 2 two-dimensional\
    \ line-segment clipper. Both can be extended directly to three-dimension and clipping\
    \ of polygon.\n  - Cohen-Sutherland Clipping\n  - Midpoint Clipping\n\n## Cohen-Sutherland\
    \ Clipping\n\n• Each region can be assigned a unique 4-bit binary number, or **outcode**\
    \ b₀b₁b₂b₃ (up, down, right, left).\n\n$b_0 = \\begin{cases}1 & \\text{if } y\
    \ > y_{max} \\\\ 0 & \\text{otherwise}\\end{cases}$\n\nLikewise for $b_1, b_2,\
    \ b_3$\n\n$o_1 = outcode(x_1,y_1);\\ o_2 = outcode(x_2,y_2)$\n\n| $b_0$ | 1001\
    \ | 1000 | 1010 |\n|---|---|---|---|\n|  | 0001 | **0000** | 0010 |\n| $b_1$ |\
    \ 0101 | 0100 | 0110 |\n\n中心区域为 0000；上方边界标记为 $y=y_{max}$，下方边界标记为 $y=y_{min}$，左侧边界为\
    \ $x=x_{min}$，右侧边界为 $x=x_{max}$。\n\n1. $o_1=o_2=0$; **AB** (inside completely)\n\
    2. $o_1\\ne0, o_2=0$; **CD** *(or vice versa)*\n3. $o_1 \\& o_2\\ne0$; **EF**\
    \ (outside completely)\n4. $o_1 \\& o_2=0$; **GH or IJ**\n\n## Hidden-Surface\
    \ Removal\n\n- It is also called visible-surface determination, to discover whether\
    \ each object is visible to the viewer, or is obscured from the viewer by other\
    \ objects.\n- Object Space Algorithm\n  - Back-Face Removal Algorithm\n  - Depth\
    \ Sort and Painter’s Algorithm\n- Image Space Algorithm\n  - Z-Buffer Algorithm\n\
    \  - Scan-Line Algorithm\n\n## Z-Buffer Algorithm\n\n- Advantages:\n  - easy to\
    \ implement, in either hardware or software.\n  - compatible with pipeline architectures.\n\
    \  - can be regarded as part of the scan-conversion process.\n- Z-Buffer, a depth\
    \ buffer with same resolution as the frame buffer, each element in this buffer\
    \ contains the distance along the ray corresponding to this location of the closest\
    \ intersection point on any polygon found so far.\n\nax + by + cz + d = 0\nΔx\
    \ = x2 - x1\nΔy = y2 - y1\nΔz = z2 - z1\naΔx + bΔy + cΔz = 0\nΔz = -a/c Δx\n\n\
    Incremental!\n\n## The Z-buffer\n\n- For each pixel on screen, have at least two\
    \ buffers\n  - Color buffer stores the current color of each pixel\n    - The\
    \ thing to ultimately display\n  - Z-Buffer stores at each pixel the depth of\
    \ the nearest thing seen so far\n    - Also called the depth buffer\n\n- Initialize\
    \ this buffer to a value corresponding to the furthest point (z=1.0 for canonical\
    \ and window space)\n\n- As a polygon is filled in, compute the depth value of\
    \ each pixel that is to be filled\n  - if depth < z-buffer depth, fill in pixel\
    \ color and new depth\n  - else disregard\n\n## The Z-buffer\n\n- **Example:**\n\
    \  With a z buffer with a range of 0 (at the image plane) to 10 (at the far clipping\
    \ plane), and a 6x6 pixel image. For simplicity, all vertices of a polygon are\
    \ at the same depth.\n\n## The Z-buffer (Image Precision)\n\n- Example:\n  - Render\
    \ polygons:\n    - Polygon 1: Depth=4; vertex1=(1,1); vertex2=(1,3); vertex3=(3,3);\
    \ vertex4=(3,1)\n\nThis polygon is rendered entirely as there is nothing to obscure\
    \ it.\n\n## The Z-buffer (Image Precision)\n\n- Example:\n  - Render polygons:\n\
    \    - Polygon 2: Depth=2; vertex1=(3,0); vertex1=(3,2); vertex1=(5,2); vertex1=(5,0)\n\
    \nThis polygon is nearer to the viewer than the red one, so it is drawn completely.\n\
    \n"
