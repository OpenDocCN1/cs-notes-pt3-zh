    ### 2D Transformation


    #### 1. Translation


    - Translation is an operation that displace points by a fixed distance in a given
    direction.


    Move point P(x,y) to P''(x'',y'')


    \(x'' = x + \Delta x, y'' = y + \Delta y\)


    Then


    \(\begin{bmatrix} x'' \\ y'' \end{bmatrix} = \begin{bmatrix} x \\ y \end{bmatrix}
    + \begin{bmatrix} \Delta x \\ \Delta y \end{bmatrix}\)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_161_0.png)


    ### 2D Transformation


    #### 2. Rotation


    Rotate (x,y), angle θ,based on origin point


    \(x''=r\cos(\theta+\phi)=r\cos\phi\cos\theta-r\sin\phi\sin\theta\)

    \(y''=r\sin(\theta+\phi)=r\cos\phi\sin\theta+r\sin\phi\cos\theta\)


    \(\therefore x=r\cos\phi,y=r\sin\phi\)


    \(\therefore x''=x\cos\theta-y\sin\theta,y''=x\sin\theta+y\cos\theta\)


    ### Then


    \(\left[\begin{array}{ c }

    x'' \\

    y''

    \end{array}\right]=\left[\begin{array}{ c c }

    \cos\theta & -\sin\theta \\

    \sin\theta & \cos\theta

    \end{array}\right]\left[\begin{array}{ c }

    x \\

    y

    \end{array}\right]\)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_162_0.png)


    ### 2D Transformation


    #### 3.Scale


    - Scaling is an non-rigid-body transformation


    \(x''=x \cdot s_x,\quad y''=y \cdot s_y\)


    Then


    \(\begin{bmatrix} x'' \\ y'' \end{bmatrix} = \begin{bmatrix} s_x & 0 \\ 0 & s_y
    \end{bmatrix} \begin{bmatrix} x \\ y \end{bmatrix}\)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_163_0.png)


    ### 3D Translation


    - Translation is an operation that displace points by a fixed distance in a given
    direction.


    $$\begin{bmatrix}x''\\y''\\z''\end{bmatrix}=\begin{bmatrix}1&0&0\\0&1&0\\0&0&1\end{bmatrix}\begin{bmatrix}x\\y\\z\end{bmatrix}+\begin{bmatrix}\Delta
    x\\\Delta y\\\Delta z\end{bmatrix}$$


    That is:


    $$\begin{bmatrix}x''\\y''\\z''\end{bmatrix}=\begin{bmatrix}x\\y\\z\end{bmatrix}+\begin{bmatrix}\Delta
    x\\\Delta y\\\Delta z\end{bmatrix}$$


    ![](img/258e4144ed4b66c8fd4b0f298118df23_164_0.png)


    ### 3D Rotation


    - For a point \( (x, y, z) = (r \cos \varphi, r \sin \varphi, z) \) the equations
    for rotation about the z axis by an angle \( \alpha \) are:


    \( x'' = r \cos(\varphi + \alpha) = x \cos \alpha - y \sin \alpha \)

    \( y'' = r \sin(\varphi + \alpha) = x \sin \alpha + y \cos \alpha \)

    \( z'' = z \)


    \[ \begin{bmatrix} x'' \\ y'' \\ z'' \end{bmatrix} = \begin{bmatrix} \cos \alpha
    & -\sin \alpha & 0 \\ \sin \alpha & \cos \alpha & 0 \\ 0 & 0 & 1 \end{bmatrix}
    \begin{bmatrix} x \\ y \\ z \end{bmatrix} \]


    - The matrices for rotation about the y and x axis are:


    \[ \begin{bmatrix} \sin \alpha & 0 & \cos \alpha \\ 0 & 1 & 0 \\ \cos \alpha &
    0 & -\sin \alpha \end{bmatrix} \quad , \quad \begin{bmatrix} 1 & 0 & 0 \\ 0 &
    \cos \alpha & -\sin \alpha \\ 0 & \sin \alpha & \cos \alpha \end{bmatrix} \]


    ![](img/258e4144ed4b66c8fd4b0f298118df23_165_0.png)


    '
