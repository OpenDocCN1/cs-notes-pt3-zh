  - "[PAGE 220]\n\n# # Algorithm Description\n\n```\nVoid TraceRay(start,direction,depth,color)\n\
    {\n    if (depth>MaxDepth) *color=Black;\n    else {\n        if(RayHit(start,direction,&hitPoint,&hitObject)=Nothing)\n\
    \            *color=BackGround;\n        else {\n            Shade(hitObject,hitPoint,&localColor);\n\
    \            CalculateReflection(hitObject,hitPoint,direction,&rDirection);\n\
    \            CalculateTransmission(hitObject,hitPoint,direction,&tDirection);\n\
    \            TraceRay(hitPoint,rDirection,depth+1,&rColor);\n            TraceRay(hitPoint,tDirection,depth+1,&tColor);\n\
    \            CombineColor(localColor,rColor,hitObject.ks,tColor,\n           \
    \              hitObject.kt,color);\n        }\n    }\n}\n```"
