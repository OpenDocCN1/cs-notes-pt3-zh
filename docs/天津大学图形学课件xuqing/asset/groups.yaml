    - Clear Twist


    # 空间曲线


    Space Curve


    ![](img/258e4144ed4b66c8fd4b0f298118df23_117_0.png)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_117_1.png)


    ## 定义


    - 术语-样条：样条指通过一组指定点集而生成平滑曲线的柔性带。

    - 计算机图形中：样条曲线指由多项式曲线段连接而成的曲线，并且每段的边界处满足特定的连续性条件。

    - 样条曲面：可以使用两组正交样条曲线进行描述。

    - 曲线控制图：连接控制点序列的折线。


    # Some definitions


    - In drafting terminology, a spline is a flexible strip used to produce a smooth
    curve through a designated set of points.

    - In computer graphics, the term spline curve now refers to any composite curve
    formed with polynomial section satisfying any specified continuity conditions
    at the boundary of the pieces.

    - A spline surface can be described with two sets of orthogonal spline curves.

    - A polyline connecting the sequence of control points for an approximation spline
    curve is usually displayed to remind a designer of the control-point positions
    and ordering. This set of connected line segments is called the control graph
    for the curve


    ## 插值和逼近样条


    - 通过控制点的位置，有两种办法选取分段连续参数多项式函数。

    - 插值样条曲线：选取的多项式使得曲线通过每个控制点。

    - 逼近样条曲线：选取的多项式使部分或全部控制点都不再生成的曲线上。


    ![](img/258e4144ed4b66c8fd4b0f298118df23_120_0.png)


    # Parametric Continuity Conditions


    - Zero-order parametric continuity, represented as $C_0$ continuity, means simply
    that the curves meet.

    - First-order parametric continuity, referred to as $C_1$ continuity, means that
    the first parametric derivatives (tangent lines) of the coordinate functions for
    two successive curve sections are equal at their joining point.

    - Second-order parametric continuity, or $C_2$ continuity, means that both the
    first and second parametric derivatives of the two curve sections are the same
    at the intersection.


    ![](img/258e4144ed4b66c8fd4b0f298118df23_123_0.png)


    # 几何连续性


    - 几何连续性：表示相邻两个曲线段的另一种连续性，并不要求两条曲线段在相交处的参数导数相等，而只要成比例即可。

    - 0阶几何连续性 $G_0$：两个曲线段在公共点处有相同的坐标位置。

    - 一阶几何连续性 $G_1$：一阶导数在两个相邻曲线段的交点处成比例（相邻曲线段在交点处的切向量大小不一定相等）。

    - 二阶几何连续性 $G_3$：表示两个曲线段在相交处的一阶和二阶导数均成比例（交点处曲率相等）。

    - 曲率：表示曲线弯曲程度的量，曲率越大，表示曲线的弯曲程度越大。


    # Geometric Continuity Conditions


    - Geometric continuity as another method for joining two successive curve sections
    is to specify conditions. Require only that the parametric derivatives of the
    two sections are proportional to each other at their common boundary, instead
    of requiring equality.

    - Zero-order geometric continuity, described as $G_0$ continuity, is the same
    as zero-order parametric continuity. That is, two successive curve sections must
    have the same coordinate position at the boundary point.

    - First-order geometric continuity, or $G_1$ continuity, means that parametric
    first derivatives are proportional at the intersection of two successive sections.

    - Second-order geometric continuity, or $G_3$ continuity, means that both the
    first and second parametric derivatives of the two curve sections are proportional
    at their boundary.


    '
