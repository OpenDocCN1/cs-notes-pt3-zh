  md: "\n\n# Computer Graphics\n\nSchool of Computer Science and Technology\n\nXU\
    \ Qing\n\nqingxu@tju.edu.cn\n\n## 1. Introduction\n\n- With the development of\
    \ computer technologies and peripherals, computer graphics is becoming more and\
    \ more important. This field is one of the fastest developing domains nowadays.\n\
    - It is a main and basic field of computer science and industry nowadays, for\
    \ instance, GUI, film production, games, etc.\n\n## 1. Introduction\n\n- Application\
    \ driven: Entertainment\n  - Example: film production\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_3_0.png)\n\
    \n## 1. Introduction\n\n- Application driven: games\n  - Example: our result by\
    \ raytracing\n\n## 1. Introduction\n\n- Application driven: Computational photography\
    \ / video: for next ten years (start from 2005).\n  - Example: photo tourism\n\
    \n## 1. Introduction\n\n- Computer graphics is the field about generating, displaying\
    \ and manipulating images by using computing technologies.\n  - Modeling\n  -\
    \ Rendering & Displaying\n  - Interactive manipulating\n\n## Introduction– main\
    \ contents\n\n- Computer Graphics contents\n  - Geometry Modeling\n    - Object(regular,\
    \ irregular) Representation\n    - Object (regular, irregular) Construction\n\
    \  - Rendering & Display\n    - 2D Graphics\n    - 3D Graphics\n      - Wire Frame\n\
    \      - “Realistic” Image\n  - Interactive\n    - Easy to learn, easy to use,\n\
    \      low error occurrence,easy to recall\n    - Mouse, window, 3D\n\n## 1. Introduction\n\
    \n- Computer graphics and computer architecture\n  - Display\n  - Multi-core\n\
    \  - Caching\n  - GPU\n  - Specific computer and computer clusters\n\n## 1. Introduction\n\
    \n- Applications of Computer Graphics\n- Researches in Computer Graphics\n- What\
    \ we will talk about in this course\n- Prerequisite\n- Reference books & textbook\n\
    \n## Introduction\n\n- **Applications of 3D Computer Graphics**\n  - User Interfaces\n\
    \  - CAD (Architecture, Products Design)\n  - Education\n  - Simulation/ Training\n\
    \  - Advertisement and Entertainment\n  - Scientific Visualization (Weather Forecast,\
    \ Bioscience )\n  - Virtual Reality/Virtual Environments\n  - ......\n\n## CAD\
    \ For Products\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_13_0.png)\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_13_1.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_13_2.png)\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_13_3.png)\n\
    \n## CAD In Architecture\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_14_0.png)\n\
    \n![](img/258e4144ed4b66c8fd4b0f298118df23_15_0.png)\n\n![](img/258e4144ed4b66c8fd4b0f298118df23_15_1.png)\n\
