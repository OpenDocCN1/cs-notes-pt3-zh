    # # An Introduction


    OpenGL, the standard software interface for graphics hardware, allows programmers
    to create interactive 2D and 3D graphics applications on a variety of systems.
    With OpenGL you can create high-quality color images. OpenGL makes it easy to
    build geometric models, change the viewing position, control the color and lighting
    of geometric primitives, and manipulate pixel and texture map images. This course
    will cover an immediately applicable subset of OpenGL, so that you can write a
    simple graphics program.'
