    \  glVertex3f(.5f, .5f, -.5f);\n  glEnd();\n  ```\n\n- glBegin - glEnd paradigm\
    \ allows great flexibility in describing primitives.\n\n- Any combination of color,\
    \ normal, texture, material etc. information can be bound with any given vertex.\n\
