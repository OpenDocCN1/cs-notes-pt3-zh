  - '[PAGE 54]


    # Pixels and the Frame Buffer


    +   - A picture is produced as an array - the **raster** - of picture elements,
    **pixels**, within the graphics system.

    +   - **Resolution** - number of pixels in the frame buffer

    +     - determines the detail that you can see in the image.

    +   - The converting of geometric entities to pixel assignments in the frame buffer
    is known as **scan conversion**, or **rasterization**.'
  - '[PAGE 55]


    # # Frame Buffer


    +   - It contains color information for each pixel


    ![](img/258e4144ed4b66c8fd4b0f298118df23_55_0.png)


    1280 X 1024 X

    1 (B/W)

    4 (16 Colors) = 0.655 M Byte

    8 (256 Colors) = 1.31 M Byte

    24 (16M Colors) = 3.932 M Byte'
