    # # Normalizing


    2.6, -3.1 mapped to 0, 1 or 2.6, 2.6 mapped to 1, 1 -3.1, -3.1 mapped to 0, 0
    2.6, -3.1 mapped to 1, 0


    2.6, -3.1 mapped to -1, 1 or 2.6, 2.6 mapped to 1, 1 -3.1, -3.1 mapped to -1,
    -1 2.6, -3.1 mapped to 1, -1


    +   - The projection plane(window) shall be mapped to a window standardized in
    size - Normalized Window

    +   - It will make all following calculations easier.'
  - '[PAGE 186]


    # # Screen Coordinates


    +   - The <u>normalized window</u> will be mapped to a specified spot on the screen,
    called the Viewport.

    +   - Screen coordinates are measured in pixels and are hardware specific.

    +   - Several viewports can be defined on the screen.

    +   - Viewports can overlap.'
  - '[PAGE 187]


    # From Window to Viewport


    ![](img/258e4144ed4b66c8fd4b0f298118df23_187_0.png)


    ```

    $$\begin{cases}

    x_v = A x_w + B\\

    y_v = C y_w + D

    \end{cases}$$


    $$\begin{aligned}

    A &= \frac{VXR - VXL}{WXR - WXL}, & B &= VXL - A \cdot WXL\\

    C &= \frac{VYT - VYB}{WYT - WYB}, & D &= VYB - C \cdot WYB

    \end{aligned}$$

    ```'
  - '[PAGE 188]


    # # Illuminating a Shadow'
  - '[PAGE 189]


    # # Illumination


    # ## Elements of object appearance:


    +   - Geometry

    +   - Surface property

    +   - Light source


    # ## Basic illumination components


    +   - Ambient

    +     - Not from light source directly

    +   - Diffuse

    +     - From a light source, the reflection is spread to all hemisphere directions
    evenly

    +   - Specular

    +     - From a light source, the reflection is focused to some directions


    ![](img/258e4144ed4b66c8fd4b0f298118df23_189_0.png)


    ![](img/258e4144ed4b66c8fd4b0f298118df23_189_1.png)


