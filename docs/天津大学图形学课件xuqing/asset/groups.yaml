    +   - First-order parametric continuity, referred to as $C_1$ continuity, means
    that the first parametric derivatives (tangent lines) of the coordinate functions
    for two successive curve sections are equal at their joining point.

    +   - Second-order parametric continuity, or $C_2$ continuity, means that both
