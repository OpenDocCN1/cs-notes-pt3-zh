  - "[PAGE 101]\n\n# # Polygon Meshes\n\n⌘ A *mesh* is a set of polygons connected\
    \ to form an object\n\n+   ⌘ A mesh has **several components**, or geometric entities:\n\
    +   \n+   - Faces\n+   - Edges, the boundary between faces\n+   - Vertices, the\
    \ boundaries between edges, or where three or more faces meet\n+   - Normals,\
    \ Texture coordinates, colors, shading coefficients, etc\n\n+   ⌘ Some components\
    \ are implicit, given the others\n+   \n+   - For instance, given faces and vertices\
    \ can determine edges\n+   - Euler’s formula: #Faces + #Vertices − #Edges = 2\
    \ − 2Genus, for *closed* polygon meshes"
