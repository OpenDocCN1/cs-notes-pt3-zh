    void consumer(void)\n{\n    int item, i;\n    message m;\n    for (i = 0; i <\
    \ N; i++) send(producer, &m); /* send N empties */\n    while (TRUE) {\n     \
    \   receive(producer, &m);       /* get message containing item */\n        item\
    \ = extract_item(&m);     /* extract item from message */\n        send(producer,\
    \ &m);          /* send back empty reply */\n        consume_item(item);     \
    \     /* do something with the item */\n    }\n}\n```\n\nThe producer-consumer\
    \ problem with N messages.\n\n## Barriers\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_159_0.png)\n\
