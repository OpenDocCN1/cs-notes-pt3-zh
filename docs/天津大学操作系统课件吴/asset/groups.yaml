    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_164_0.png)\n\n## Introduction To Deadlocks\n\
    \nDeadlock can be defined formally as follows:\n\n*A set of processes is deadlocked\
    \ if each process in the set is waiting for an event that only another process\
    \ in the set can cause.*\n\n## Conditions for Resource Deadlocks\n\n1. Mutual\
    \ exclusion condition\n2. Hold and wait condition.\n3. No preemption condition.\n\
    4. Circular wait condition.\n\n## Deadlock Modeling (2)\n\nA\nRequest R\nRequest\
    \ S\nRelease R\nRelease S\n(a)\n\nB\nRequest S\nRequest T\nRelease S\nRelease\
    \ T\n(b)\n\nC\nRequest T\nRequest R\nRelease T\nRelease R\n(c)\n\n1. A requests\
    \ R\n2. B requests S\n3. C requests T\n4. A requests S\n5. B requests T\n6. C\
    \ requests R\ndeadlock\n(d)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_168_0.png)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_168_1.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_168_2.png)\n\
    \nFigure 6-4. An example of how deadlock occurs and how it can be avoided.\n\n\
    ## Deadlock Modeling (3)\n\n1. A requests R\n2. B requests S\n3. C requests T\n\
    4. A requests S\n5. B requests T\n6. C requests R deadlock\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_169_0.png)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_169_1.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_169_2.png)\n\
