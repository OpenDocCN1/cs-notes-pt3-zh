    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_169_5.png)\n\nFigure 6-4. An example\
    \ of how deadlock occurs and how it can be avoided.\n\n## Deadlock Modeling (5)\n\
    \nStrategies for dealing with deadlocks:\n\n1. Just ignore the problem.\n2. Detection\
    \ and recovery. Let deadlocks occur, detect them, take action.\n3. Dynamic avoidance\
    \ by careful resource allocation.\n4. Prevention, by structurally negating one\
    \ of the four required conditions.\n\n## Deadlock Detection with One Resource\
    \ of Each Type (1)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_172_0.png)\n\n\
    Figure 6-5. (a) A resource graph. (b) A cycle extracted from (a).\n\n## Deadlock\
    \ Detection with One Resource of Each Type (2)\n\nAlgorithm for detecting deadlock:\n\
    \n1. For each node, N in the graph, perform the following five steps with N as\
    \ the starting node.\n2. Initialize L to the empty list, designate all arcs as\
    \ unmarked.\n3. Add current node to end of L, check to see if node now appears\
    \ in L two times. If it does, graph contains a cycle (listed in L), algorithm\
    \ terminates.\n\n## Deadlock Detection with One Resource of Each Type (3)\n\n\
    1. From given node, see if any unmarked outgoing arcs. If so, go to step 5; if\
    \ not, go to step 6.\n2. Pick an unmarked outgoing arc at random and mark it.\
    \ Then follow it to the new current node and go to step 3.\n3. If this is initial\
    \ node, graph does not contain any cycles, algorithm terminates. Otherwise, dead\
    \ end. Remove it, go back to previous node, make that one current node, go to\
    \ step 3.\n\n## Deadlock Detection with Multiple Resources of Each Type (1)\n\n\
    Resources in existence\n(E1, E2, E3, ..., Em)\n\nResources available\n(A1, A2,\
    \ A3, ..., Am)\n\nCurrent allocation matrix\n\n| C11 | C12 | C13 | ... | C1m |\n\
    |-----|-----|-----|-----|-----|\n| C21 | C22 | C23 | ... | C2m |\n| ... | ...\
    \ | ... | ... | ... |\n| Cn1 | Cn2 | Cn3 | ... | Cnm |\n\nRequest matrix\n\n|\
    \ R11 | R12 | R13 | ... | R1m |\n|-----|-----|-----|-----|-----|\n| R21 | R22\
    \ | R23 | ... | R2m |\n| ... | ... | ... | ... | ... |\n| Rn1 | Rn2 | Rn3 | ...\
    \ | Rnm |\n\nRow n is current allocation to process n\n\nRow 2 is what process\
    \ 2 needs\n\nFigure 6-6. The four data structures needed by the deadlock detection\
    \ algorithm.\n\n"
