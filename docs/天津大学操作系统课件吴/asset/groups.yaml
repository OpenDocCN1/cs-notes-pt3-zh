    \ wake it up\n    return val;\n}\nprivate void go_to_sleep() { try{wait();} catch(InterruptedException\
    \ exc) {};}\n}\n}\n```\n\nA solution to the producer-consumer problem in Java.\n\
    \n## Producer-Consumer Problem with Message Passing (1)\n\n```c\n#define N 100\
