  - '[PAGE 53]


    # # Operating Systems Structure


    Monolithic systems – basic structure:


    +   - A main program that invokes the requested service procedure.


    +   - A set of service procedures that carry out the system calls.


    +   - A set of utility procedures that help the service procedures.'
  - "[PAGE 54]\n\n# # Monolithic Systems\n\n```\n#define FALSE 0\n#define TRUE 1\n\
    #define N 2 /* number of processes */\nint turn; /* whose turn is it? */\nint\
    \ interested[N]; /* all values initially 0 (FALSE) */\nvoid enter_region(int process)\
    \ /* process is 0 or 1 */\n{\n    int other; /* number of the other process */\n\
    \    other = 1 - process; /* the opposite of process */\n    interested[process]\
    \ = TRUE; /* show that you are interested */\n    turn = process; /* set flag\
    \ */\n    while (turn == process && interested[other] == TRUE) /* null statement\
    \ */ ;\n}\nvoid leave_region(int process) /* process: who is leaving */\n{\n \
    \   interested[process] = FALSE; /* indicate departure from critical region */\n\
    }\n```\n\nFigure 1-24. A simple structuring model for a monolithic system."
