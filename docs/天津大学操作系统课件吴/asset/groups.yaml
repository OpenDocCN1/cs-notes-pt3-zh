  - "[PAGE 113]\n\n# # Peterson's Solution\n\n```\n```c\n#define FALSE 0\n#define\
    \ TRUE 1\n#define N 2            /* number of processes */\n\nint turn;      \
    \        /* whose turn is it? */\nint interested[N];     /* all values initially\
