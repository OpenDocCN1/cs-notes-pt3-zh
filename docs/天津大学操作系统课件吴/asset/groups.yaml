    \ == process && interested[other] == TRUE) /* null statement */ ;\n}\n\nvoid leave_region(int\
    \ process) /* process: who is leaving */\n{\n    interested[process] = FALSE;\
    \ /* indicate departure from critical region */\n}\n```\n```\n\nPeterson's solution\
    \ for achieving mutual exclusion."
