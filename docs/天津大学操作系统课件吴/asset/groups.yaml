  md: "\n## Introduction\n\n### What Is An Operating System (2)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_2_0.png)\n\
    \nFigure 1-1. Where the operating system fits in.\n\n### The Operating System\
    \ as an Extended Machine\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_3_0.png)\n\
    \nFigure 1-2. Operating systems turn ugly hardware into beautiful abstractions.\n\
    \n### The Operating System as a Resource Manager\n\n- Allow multiple programs\
    \ to run at the same time\n- Manage and protect memory, I/O devices, and other\
    \ resources\n- Includes multiplexing (sharing) resources in two different ways:\n\
    \  - In time\n  - In space\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_4_0.png)\n\
    \n### 1945-1955 Vacuum Tubes\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_6_0.png)\n\
    \nENIAC\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_6_1.png)\n\nAda Lovelace\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_6_2.png)\n\nJohn Von Neumann\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_6_3.png)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_6_4.png)\n\nAlan Turing\n\n### Transistors\
    \ and Batch Systems (1)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_7_0.png)\n\
    \nFigure 1-3. An early batch system. (a) Programmers bring cards to 1401. (b)\
    \ 1401 reads batch of jobs onto tape.\n\n### Transistors and Batch Systems (2)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_8_0.png)\n\nFigure 1-3. (c) Operator\
    \ carries input tape to 7094. (d) 7094 does computing. (e) Operator carries output\
    \ tape to 1401. (f) 1401 prints output.\n\n### Transistors and Batch Systems (4)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_9_0.png)\n\nFigure 1-4. Structure of\
    \ a typical FMS job.\n\n### IBM System/360\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_11_0.png)\n\
    \n- One Family\n- OS/360\n- Multiprogramming\n- SPOOLING (Simultaneous Peripheral\
    \ Operation On Line)\n\n### OS/360\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_12_0.png)\n\
    \nWritten by Fred Brooks, one of the designers of OS/360\n\n- CTSS\n  - Compatible\
    \ Time Sharing system\n  - MIT, 7094\n- MULTICS\n  - MULTiplexed Information and\
    \ Computing Service\n  - MIT, Bell Labs, General Electric\n  - Sold by Honeywell\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_13_0.png)\n\nGE-645\n\n### History\
    \ of UNIX\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_14_0.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_14_1.png)\n\
    \nDennis Ritchie\n\nKen Thompson\n\n- 1969: UNIX\n  - Ken Thompson\n  - Bell Labs\
    \ (AT&T)\n  - DEC PDP-7\n  - space travel\n  - UNICS -> UNIX\n  - Written in assembly\
    \ language\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_15_0.png)\n\nPDP - Programmed\
    \ Data Processor\n\n- 1970: PDP-11/20\n- 1971: Unix Programmer's Manual\n- 1972:\
    \ Ritchie BCPL (Basic Combined Programming Language) -> B -> C, *The C Programming\
    \ Language*\n- 1973: *The UNIX Time – Sharing System*\n- 1983 Turing Award\n\n\
    ![](img/856cffd4f5aea27d2abb1fffe70c2f49_16_0.png)\n\n### First Microcomputer\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_18_0.png)\n\n1975: MITS Altair 8800\
    \ (Intel 8080)\n\n### 1984: Motorola 68000\n\n### 1998: PowerPC\n\n### 2006: Intel\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_20_0.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_20_1.png)\n\
    \n![](img/856cffd4f5aea27d2abb1fffe70c2f49_20_2.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_20_3.png)\n\
    \n### IBM PC\n\n- 1981: IBM Personal Computer\n  - Intel 8088 (4.77MHz) 16KB\n\
    \  - MS-DOS/PC-DOS\n- 1985: Intel 80386\n- 1986: Compaq 386\n- 1987: IBM PS/2\
    \ (386, MCA)\n  - IBM OS/2\n- RISC: PowerPC vs Intel\n- 1993: Intel Pentium\n\n\
    ![](img/856cffd4f5aea27d2abb1fffe70c2f49_21_0.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_21_1.png)\n\
    \n### Microsoft Windows\n\n- 1985: Windows 1.0; 1987: 2.0\n- 1990: Windows 3.0;\
    \ 1992: 3.1\n- 1993: Windows NT 3.1\n- 1995: Windows 95; 1996: NT 4.0\n- 1998:\
    \ Windows 98\n- 2000: Windows ME; Win2000 (NT 5.0)\n- 2001: XP (NT 5.1); 2003:\
    \ Server 2003\n- 2006: Vista; 2008: Server 2008\n- 2009: Windows 7 (NT 6.1)\n\n\
    ![](img/856cffd4f5aea27d2abb1fffe70c2f49_22_0.png)\n\n![](img/856cffd4f5aea27d2abb1fffe70c2f49_22_1.png)\n"
