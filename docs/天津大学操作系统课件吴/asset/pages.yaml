- pgno: 139
  md: "# Semaphores\n\n```\n```c\n#define N 100                         /* number\
    \ of slots in the buffer */\ntypedef int semaphore;                 /* semaphores\
    \ are a special kind of int */\nsemaphore mutex = 1;                  /* controls\
    \ access to critical region */\nsemaphore empty = N;                  /* counts\
    \ empty buffer slots */\nsemaphore full = 0;                   /* counts full\
    \ buffer slots */\n\nvoid producer(void)\n{\n    int item;\n\n    while (TRUE)\
    \ {                     /* TRUE is the constant 1 */\n        item = produce_item();\
    \         /* generate something to put in buffer */\n        down(&empty);   \
    \               /* decrement empty count */\n        down(&mutex);           \
    \       /* enter critical region */\n        insert_item(item);             /*\
    \ put new item in buffer */\n        up(&mutex);                    /* leave critical\
    \ region */\n        up(&full);                     /* increment count of full\
    \ slots */\n    }\n}\n\nvoid consumer(void)\n{\n    int item;\n\n    while (TRUE)\
    \ {                     /* infinite loop */\n        down(&full);            \
    \       /* decrement full count */\n        down(&mutex);                  /*\
    \ enter critical region */\n        item = remove_item();          /* take item\
    \ from buffer */\n        up(&mutex);                    /* leave critical region\
    \ */\n        up(&empty);                    /* increment count of empty slots\
    \ */\n        consume_item(item);            /* do something with the item */\n\
    \    }\n}\n```\n```\n\nThe producer-consumer problem using semaphores."
  merge: -1
  img_proc: true
