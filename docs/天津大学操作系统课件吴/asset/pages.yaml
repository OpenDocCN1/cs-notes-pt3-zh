  md: "# # The Producer-Consumer Problem\n\n```\n#define N 100\nint count = 0;\nvoid\
    \ producer(void)\n{\n    int item;\n    while (TRUE) {\n        item = produce_item();\n\
    \        if (count == N) sleep();\n        insert_item(item);\n        count =\
    \ count + 1;\n        if (count == 1) wakeup(consumer);\n    }\n}\nvoid consumer(void)\n\
    {\n    int item;\n    while (TRUE) {\n        if (count == 0) sleep();\n     \
    \   item = remove_item();\n        count = count - 1;\n        if (count == N\
    \ - 1) wakeup(producer);\n        consume_item(item);\n    }\n}\n```\n\nThe producer-consumer\
    \ problem\nwith a fatal race condition."
  merge: -1
