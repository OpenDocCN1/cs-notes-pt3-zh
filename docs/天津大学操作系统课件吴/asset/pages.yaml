- pgno: 146
  md: "# The Readers and Writers Problem (1)\n\n```\ntypedef int semaphore;      \
    \                   /* use your imagination */\nsemaphore mutex = 1;         \
    \                   /* controls access to ’rc’ */\nsemaphore db = 1;         \
    \                      /* controls access to the database */\nint rc = 0;    \
    \                                 /* # of processes reading or wanting to */\n\
    \nvoid reader(void)\n{\n        while (TRUE) {                          /* repeat\
    \ forever */\n                down(&mutex);                   /* get exclusive\
    \ access to ’rc’ */\n                rc = rc + 1;                    /* one reader\
    \ more now */\n                if (rc == 1) down(&db);         /* if this is the\
    \ first reader ... */\n                up(&mutex);                     /* release\
    \ exclusive access to ’rc’ */\n                read_data_base();             \
    \  /* access the data */\n                down(&mutex);                   /* get\
    \ exclusive access to ’rc’ */\n                rc = rc − 1;                  \
    \  /* one reader fewer now */\n                if (rc == 0) up(&db);         \
    \   /* if this is the last reader ... */\n                up(&mutex);        \
    \             /* release exclusive access to ’rc’ */\n                use_data_read();\
    \                /* noncritical region */\n        }\n}\n```\n\n•••\n\nA solution\
    \ to the readers and writers problem."
