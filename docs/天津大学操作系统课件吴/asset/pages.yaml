- pgno: 143
  md: "# # Dining Philosophers Problem (3)\n\n```\n```c\n#define N               \
    \     5             /* number of philosophers */\n#define LEFT               \
    \  (i+N-1)%N     /* number of i's left neighbor  */\n#define RIGHT           \
    \     (i+1)%N       /* number of i's right neighbor */\n#define THINKING     \
    \        0             /* philosopher is thinking */\n#define HUNGRY         \
    \      1             /* philosopher is trying to get forks */\n#define EATING\
    \               2             /* philosopher is eating */\ntypedef int semaphore;\
    \                     /* semaphores are a special kind of int */\nint state[N];\
    \                              /* array to keep track of everyone's state */\n\
    semaphore mutex = 1;                       /* mutual exclusion for critical regions\
    \ */\nsemaphore s[N];                            /* one semaphore per philosopher\
    \ */\nvoid philosopher(int i)                    /* i: philosopher number, from\
    \ 0 to N-1 */\n{\n    while (TRUE) {\n        think();                       \
    \    /* philosopher is thinking */\n        take_forks(i);                   \
    \  /* acquire two forks or block */\n        eat();                          \
    \   /* yum-yum, spaghetti */\n        put_forks(i);                      /* put\
    \ both forks back on table */\n    }\n}\n... \n```\n```\n\nA solution to the dining\
    \ philosophers problem."
  merge: -1
  img_proc: true
- pgno: 144
  md: "# # Dining Philosophers Problem (4)\n\n```\n```c\nvoid take_forks(int i)\n\
    {\n    down(&mutex);\n    state[i] = HUNGRY;\n    test(i);\n    up(&mutex);\n\
    \    down(&s[i]);\n}\n```\n```\n\nA solution to the dining philosophers problem."
  merge: -1
