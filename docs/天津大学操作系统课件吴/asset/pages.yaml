- pgno: 184
  md: '# # The Banker''s Algorithm for Multiple Resources (2)


    Algorithm for checking to see if a state is safe:


    +   1. Look for row, R, whose unmet resource needs all ≤ A. If no such row exists,
    system will eventually deadlock since no process can run to completion


    +   2. Assume process of row chosen requests all resources it needs and finishes.
    Mark process as terminated, add all its resources to the A vector.


    +   3. Repeat steps 1 and 2 until either all processes marked terminated (initial
    state was safe) or no process left whose resource needs can be met (there is a
    deadlock).'
  merge: -1
  img_proc: true
