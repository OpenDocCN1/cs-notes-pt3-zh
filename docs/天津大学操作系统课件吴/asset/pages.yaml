  md: '# # Deadlock Detection with One Resource of Each Type (2)


    Algorithm for detecting deadlock:


    +   1. For each node, N in the graph, perform the following five steps with N
    as the starting node.


    +   2. Initialize L to the empty list, designate all arcs as unmarked.


    +   3. Add current node to end of L, check to see if node now appears in L two
    times. If it does, graph contains a cycle (listed in L), algorithm terminates.


    ...'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Deadlock Detection with\nOne Resource of Each Type (3)\n\n+   1. From given\
    \ node, see if any unmarked outgoing arcs. If so, go to step 5; if not, go to\
    \ step 6.\n+   \n+   2. Pick an unmarked outgoing arc at random and mark it. Then\
    \ follow it to the new current node and go to step 3.\n+   \n+   3. If this is\
    \ initial node, graph does not contain any cycles, algorithm terminates. Otherwise,\
    \ dead end. Remove it, go back to previous node, make that one current node, go\
    \ to step 3."
  merge: -1
  img_proc: true
