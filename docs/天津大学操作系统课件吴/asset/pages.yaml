- pgno: 52
  md: '# Windows Win32 API


    | UNIX | Win32 | Description |

    |---|---|---|

    | fork | CreateProcess | Create a new process |

    | waitpid | WaitForSingleObject | Can wait for a process to exit |

    | execve | (none) | CreateProcess = fork + execve |

    | exit | ExitProcess | Terminate execution |

    | open | CreateFile | Create a file or open an existing file |

    | close | CloseHandle | Close a file |

    | read | ReadFile | Read data from a file |

    | write | WriteFile | Write data to a file |

    | seek | SetFilePointer | Move the file pointer |

    | stat | GetFileAttributesEx | Get various file attributes |

    | mkdir | CreateDirectory | Create a new directory |

    | rmdir | RemoveDirectory | Remove an empty directory |

    | link | (none) | Win32 does not support links |

    | unlink | DeleteFile | Destroy an existing file |

    | mount | (none) | Win32 does not support mount |

    | umount | (none) | Win32 does not support mount |

    | chdir | SetCurrentDirectory | Change the current working directory |

    | chmod | (none) | Win32 does not support security (although NT does) |

    | kill | (none) | Win32 does not support signals |

    | time | GetLocalTime | Get the current time |


    Figure 1-23. The Win32 API calls that roughly correspond to the UNIX calls of
    Fig. 1-18.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Operating Systems Structure


    Monolithic systems – basic structure:


    +   - A main program that invokes the requested service procedure.


    +   - A set of service procedures that carry out the system calls.


    +   - A set of utility procedures that help the service procedures.'
  merge: -1
