- pgno: 112
  md: "# # Strict Alternation\n\n```\n```c\nwhile (TRUE) {\n    while (turn != 0)\n\
    \        /* loop */;\n    critical_region();\n    turn = 1;\n    noncritical_region();\n\
    }\n```\n```\n\n```\n```c\nwhile (TRUE) {\n    while (turn != 1)\n        /* loop\
    \ */;\n    critical_region();\n    turn = 0;\n    noncritical_region();\n}\n```\n\
    ```\n\nA proposed solution to the critical region problem. (a) Process 0. (b)\
    \ Process 1. In both cases, be sure to note the semicolons terminating the while\
    \ statements."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# # Peterson's Solution\n\n```\n```c\n#define FALSE 0\n#define TRUE 1\n#define\
    \ N 2            /* number of processes */\n\nint turn;              /* whose\
    \ turn is it? */\nint interested[N];     /* all values initially 0 (FALSE) */\n\
    \nvoid enter_region(int process) /* process is 0 or 1 */\n{\n    int other;  \
    \       /* number of the other process */\n\n    other = 1 - process; /* the opposite\
    \ of process */\n    interested[process] = TRUE; /* show that you are interested\
    \ */\n    turn = process;    /* set flag */\n    while (turn == process && interested[other]\
    \ == TRUE) /* null statement */ ;\n}\n\nvoid leave_region(int process) /* process:\
    \ who is leaving */\n{\n    interested[process] = FALSE; /* indicate departure\
    \ from critical region */\n}\n```\n```\n\nPeterson's solution for achieving mutual\
    \ exclusion."
  merge: -1
  img_proc: true
- pgno: 114
  md: "# The TSL Instruction (1)\n\n```\nenter_region:\n    TSL REGISTER,LOCK    \
    \    | copy lock to register and set lock to 1\n    CMP REGISTER,#0          |\
    \ was lock zero?\n    JNE enter_region         | if it was nonzero, lock was set,\
    \ so loop\n    RET                      | return to caller; critical region entered\n\
    \nleave_region:\n    MOVE LOCK,#0             | store a 0 in lock\n    RET   \
    \                   | return to caller\n```\n\nEntering and leaving a critical\
    \ region\nusing the TSL instruction."
  merge: -1
  img_proc: true
- pgno: 115
  md: '# # The TSL Instruction (2)


    enter_region:

    MOVE REGISTER,#1

    XCHG REGISTER,LOCK

    CMP REGISTER,#0

    JNE enter_region

    RET

    | put a 1 in the register

    | swap the contents of the register and lock variable

    was lock zero?

    | if it was non zero, lock was set, so loop

    | return to caller; critical region entered


    leave_region:

    MOVE LOCK,#0

    RET

    | store a 0 in lock

    | return to caller


    Entering and leaving a critical region

    using the XCHG instruction.'
  merge: -1
  img_proc: true
