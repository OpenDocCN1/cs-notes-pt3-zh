  md: "# Mutexes\n\n```\nmutex_lock:\n        TSL REGISTER,MUTEX       | copy mutex\
    \ to register and set mutex to 1\n        CMP REGISTER,#0          | was mutex\
    \ zero?\n        JZE ok                   | if it was zero, mutex was unlocked,\
    \ so return\n        CALL thread_yield        | mutex is busy; schedule another\
    \ thread\n        JMP mutex_lock           | try again\nok:     RET          \
    \            | return to caller; critical region entered\n\nmutex_unlock:\n  \
    \      MOVE MUTEX,#0            | store a 0 in mutex\n        RET            \
    \          | return to caller\n```\n\nImplementation of mutex lock and mutex unlock."
