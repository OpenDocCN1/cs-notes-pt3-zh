- pgno: 145
  md: "# # Dining Philosophers Problem (5)\n\n```\nvoid put_forks(i)\n{\n    down(&mutex);\n\
    \    state[i] = THINKING;\n    test(LEFT);\n    test(RIGHT);\n    up(&mutex);\n\
    }\n\nvoid test(i) /* i: philosopher number, from 0 to N−1 */\n{\n    if (state[i]\
    \ == HUNGRY && state[LEFT] != EATING && state[RIGHT] != EATING) {\n        state[i]\
    \ = EATING;\n        up(&s[i]);\n    }\n}\n```\n\nA solution to the dining philosophers\
    \ problem."
