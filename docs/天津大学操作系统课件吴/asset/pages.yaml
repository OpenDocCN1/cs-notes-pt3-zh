  md: '# Approaches to Deadlock Prevention


    | Condition | Approach |

    |---|---|

    | Mutual exclusion | Spool everything |

    | Hold and wait | Request all resources initially |

    | No preemption | Take resources away |

    | Circular wait | Order resources numerically |


