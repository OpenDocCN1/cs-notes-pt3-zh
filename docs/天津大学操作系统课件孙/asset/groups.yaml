  md: "\n## Agenda\n\n## Memory Management\n\n- Why?\n- What?\n- How?\n\n## General\
    \ Memory Problem\n\n- We have a limited (expensive) physical resource: **main\
    \ memory**\n- We want to use it as efficiently as possible\n- We have an abundant,\
    \ but slower, resource: **disk**\n\n## Lots of Variants\n\n- Many processes, total\
    \ size less than memory\n  - Technically possible to pack them together\n  - Will\
    \ programs know about each other’s existence?\n- One process, size exceeds memory\n\
    \  - Can you only keep part of the program in memory?\n- Lots of processes, total\
    \ size exceeds memory\n  - What programs are in memory, and how to decide?\n\n\
    ## Memory Manager\n\n- Its task: Manage memory hierarchy\n  - Track used and free\
    \ memory\n  - Allocate memory to processes\n  - Reclaim (De-allocate) memory\n\
    \  - **Swapping** between main memory and disk\n\n![](img/173140081d013d40ccca0b8e597b7a43_5_0.png)\n\
    \n![](img/173140081d013d40ccca0b8e597b7a43_5_1.png)\n\n![](img/173140081d013d40ccca0b8e597b7a43_5_2.png)\n\
    \n![](img/173140081d013d40ccca0b8e597b7a43_5_3.png)\n\n![](img/173140081d013d40ccca0b8e597b7a43_5_4.png)\n\
    \n### Memory Hierarchy\n\n| Typical access time | Typical capacity |\n| --- |\
    \ --- |\n| 1 nsec | <1 KB |\n| 2 nsec | 4 MB |\n| 10 nsec | 512-2048 MB |\n| 10\
    \ msec | 200-1000 GB |\n| 100 sec | 400-800 GB |\n\n![](img/173140081d013d40ccca0b8e597b7a43_6_0.png)\n\
    \nA typical memory hierarchy. The numbers are very rough approximations.\n\n##\
    \ Memory Cache\n\n- When to put a new item into the cache.\n- Which cache line\
    \ to put the new item in.\n- Which item to remove from the cache when a slot is\
    \ needed.\n- Where to put a newly evicted item in the larger memory.\n\n### Types\
    \ of Memory\n\n- **Primary Memory** (a.k.a. RAM)\n  - Holds data and programs\
    \ used by a process that is executing\n  - Only type of memory that a CPU deals\
    \ with\n- **Secondary Memory** (i.e. hard disk)\n  - Non-volatile memory used\
    \ to store data when a process is not executing\n\n## The Memory Manager (MM)\n\
    \n- **Purpose:** to manage the use of primary and secondary memory.\n- **Responsible\
    \ for:**\n  - Allocating primary memory to processes\n  - Moving processes between\
    \ primary and secondary memory\n  - Optimizing memory usage\n\n## Process Memory\n\
    \n- There are two types of memory that can be used within a process:\n- **Stack:**\
    \ used for local/automatic variables and for passing parameters to function calls\n\
    - **Heap:** used for dynamic memory allocation\n\n### Process Memory Layout\n\n\
    |  |\n| --- |\n| Environment Variables, etc. |\n| Stack Segment |\n|  |\n|  |\n\
    |  |\n| Heap Storage |\n| Data Segment (global and static variables) |\n| Text\
    \ Segment |\n\n- Allocates more memory than needed at first\n- Heap grows towards\
    \ stack for dynamic memory allocation\n- Stack grows towards heap when automatic\
    \ variables are created\n\n### Single-Partition Strategies\n\n![](img/173140081d013d40ccca0b8e597b7a43_12_0.png)\n\
    \nThree simple ways of organizing memory with an operating system and one user\
    \ process.\n\n### Fixed-Partition Strategies\n\n- Memory is divided into _fixed-size_\
    \ regions\n- Size of each region is usually not equal\n- MM will allocate a region\
    \ to a process that _best fits_ it\n- Unused memory within an allocated partition\
    \ is called _internal fragmentation_\n\n### Fixed-Partition Example\n\n![](img/173140081d013d40ccca0b8e597b7a43_14_0.png)\n\
    \n## Multiprogramming with Fixed Partitions\n\n![](img/173140081d013d40ccca0b8e597b7a43_15_0.png)\n\
    \n- **Fixed memory partitions**\n  - separate input queues for each partition\n\
    \  - single input queue\n\n### Variable-Partition Strategies\n\n- MM allocates\
    \ regions equal to the memory requirements of a process at any given time\n- As\
    \ processes die, _holes_ develop in the memory\n- MM inserts new processes into\
    \ holes\n"
