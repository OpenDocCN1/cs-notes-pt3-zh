  md: "\n## The X Window System\n\n![](img/173140081d013d40ccca0b8e597b7a43_267_0.png)\n\
    \nFigure 5-37. Clients and servers in the M.I.T. X Window System.\n\nTanenbaum,\
    \ Modern Operating Systems 3e, (c) 2008 Prentice-Hall, Inc. All rights reserved.\
    \ 0-13-6006639\n\nTypes of messages between client and server:\n\n1. Drawing commands\
    \ from the program to the workstation.\n2. Replies by the workstation to program\
    \ queries.\n3. Keyboard, mouse, and other event announcements.\n4. Error messages.\n\
    \n## Graphical User Interfaces\n\n```c\nwhile (running) {\n    XNextEvent(disp,\
    \ &event);      /* get next event */\n    switch (event.type) {\n    case Expose:\
    \   ...; break;     /* repaint window */\n    case ButtonPress: ...; break;  /*\
    \ process mouse click */\n    case KeyPress:  ...; break;    /* process keyboard\
    \ input */\n    }\n}\nXFreeGC(disp, gc);                 /* release graphic context\
    \ */\nXDestroyWindow(disp, win);         /* deallocate window's memory space */\n\
    XCloseDisplay(disp);               /* tear down network connection */\n}\n```\n\
    \nFigure 5-38. A skeleton of an X Window application program.\n\nFigure 5-39.\
    \ A sample window located at (200, 100) on an XGA display.\n\n![](img/173140081d013d40ccca0b8e597b7a43_271_0.png)\n\
    \n```c\n#include <windows.h>\n\nint WINAPI WinMain(HINSTANCE h, HINSTANCE hprev,\
    \ char *szCmd, int iCmdShow)\n{\n        WNDCLASS wndclass;                 /*\
    \ class object for this window */\n        MSG msg;                          \
    \  /* incoming messages are stored here */\n        HWND hwnd;               \
    \           /* handle (pointer) to the window object */\n\n        /* Initialize\
    \ wndclass */\n        wndclass.lpfnWndProc = WndProc;    /* tells which procedure\
    \ to call */\n        wndclass.lpszClassName = \"Program name\"; /* Text for title\
    \ bar */\n        wndclass.hIcon = LoadIcon(NULL, IDI_APPLICATION); /* load program\
    \ icon */\n        wndclass.hCursor = LoadCursor(NULL, IDC_ARROW);   /* load mouse\
    \ cursor */\n\n        RegisterClass(&wndclass);          /* tell Windows about\
    \ wndclass */\n        hwnd = CreateWindow(...);          /* allocate storage\
    \ for the window */\n        ShowWindow(hwnd, iCmdShow);        /* display the\
    \ window on the screen */\n        UpdateWindow(hwnd);                /* tell\
    \ the window to paint itself */\n        ...\n}\n```\n\nFigure 5-40. A skeleton\
    \ of a Windows main program.\n\n## Power Management\n\n### Hardware Issues\n\n\
    | Device | Li et al. (1994) | Lorch and Smith (1998) |\n|---|---|---|\n| Display\
    \ | 68% | 39% |\n| CPU | 12% | 18% |\n| Hard disk | 20% | 12% |\n| Modem | | 6%\
    \ |\n| Sound | | 2% |\n| Memory | 0.5% | 1% |\n| Other | | 22% |\n\nFigure 5-45.\
    \ Power consumption of various parts of a notebook computer.\n\n### The Display\n\
    \n![](img/173140081d013d40ccca0b8e597b7a43_275_0.png)\n\nFigure 5-46. The use\
    \ of zones for backlighting the display. (a) When window 2 is selected it is not\
    \ moved. (b) When window 1 is selected, it moves to reduce the number of zones\
    \ illuminated.\n\n### The CPU\n\n![](img/173140081d013d40ccca0b8e597b7a43_276_0.png)\n\
    \nFigure 5-47. (a) Running at full clock speed. (b) Cutting voltage by two cuts\
    \ clock speed by two and power consumption by four.\n"
