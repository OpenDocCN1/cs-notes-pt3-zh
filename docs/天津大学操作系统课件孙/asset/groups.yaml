    \ 4 KB.\n\n### Creating a filesystem\n\n- Creating a filesystem is done with an\
    \ **mkfs** variant\n  - `mke2fs`, `mke2fs -j`\n  - `mkreiserfs`\n  - `mkjfs`\n\
    \n- Typical options:\n  - `b` blocksize sets blocksize\n  - `i` bytes-per-inode\
