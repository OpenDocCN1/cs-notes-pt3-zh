    \ (a) A disk track with a bad sector. (b) Substituting a spare for the bad sector.\
    \ (c) Shifting all the sectors to bypass the bad one.\n\n## Clock Hardware\n\n\
    ![](img/173140081d013d40ccca0b8e597b7a43_262_0.png)\n\nCrystal oscillator  \n\
