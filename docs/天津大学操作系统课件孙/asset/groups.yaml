    \  \n\nFigure 5-32. A programmable clock.\n\n## Clock Software (1)\n\n### Typical\
    \ duties of a clock driver\n\n- 1. Maintaining the time of day.\n- 2. Preventing\
    \ processes from running longer than they are allowed to.\n- 3. Accounting for\
    \ CPU usage.\n- 4. Handling alarm system call made by user processes.\n- 5. Providing\
    \ watchdog timers for parts of the system itself.\n- 6. Doing profiling, monitoring,\
    \ statistics gathering.\n\n## Clock Software (2)\n\nFigure 5-33. Three ways to\
