  - '[PAGE 166]


    # Creating a filesystem


    +   - Creating a filesystem is done with an **mkfs** variant

    +     - `mke2fs`, `mke2fs -j`

    +     - `mkreiserfs`

    +     - `mkjfs`


    +   - Typical options:

    +     - `b` blocksize sets blocksize

    +     - `i` bytes-per-inode sets number of inodes

    +     - `c` checks disk for bad blocks


    • Example:


    ```

    ```shell

    # mke2fs -b 1024 -i 4096 -c /dev/sda6

    ...

    Writing inode tables: done

    Writing superblocks and filesystem accounting

    info: done

    ...

    ```

    ```'
  - '[PAGE 167]


    # # Mount


    +   - mount is the glue that logically connects file systems to the directory
    hierarchy


    +   - File systems are associated with devices represented by special files in
    /dev (the logical volume)


    +   - When a file system is mounted, the logical volume and its contents are connected
    to a directory in the hierarchical tree structure


    ```

    ```

    # mount  /dev/lv00  /home/patsie

    ```

    ```


    ![](img/173140081d013d40ccca0b8e597b7a43_167_0.png)


    ![](img/173140081d013d40ccca0b8e597b7a43_167_1.png)'
  - '[PAGE 168]


    # Comparing filesystems


    Journaled Filesystems used by Linux:


    |  | ext2 | ext3 | jfs | reiser | xfs |

    |---|---|---|---|---|---|

    | **Journal** | no | yes (10 MB default) | yes (auto resized) | yes (32 MB default)
    | yes |

    | **resizeable** | yes, but only when unmounted | yes, but only when unmounted
    | yes | yes | yes, but only when mounted |

    | **maximum size** | File: 2 TB<br>FS: 16 TB | File: 2 TB<br>FS: 16 TB | File:
    4 PB<br>FS: 32 PB | File: 16 TB<br>FS: 1 EB | File: 2 TB<br>FS: 8 EB |

    | **type** | inodes (completely block oriented) | inodes (completely block oriented)
    | inodes (allocated in a b-tree) | b-Tree | inodes (allocated in a b-tree) |'
  - '[PAGE 169]


    # SHMFS-specific information


    +   - SHMFS: POSIX compliant Shared Memory Filesystem

    +   - Filesystem stored in memory, expands when used to required size

    +   - Not persistent across reboot

    +   - Typically mounted on `/dev/shm`

    +   - Required by certain applications'
