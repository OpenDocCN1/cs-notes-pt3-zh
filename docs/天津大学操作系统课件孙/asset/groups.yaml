    \ MULTICS virtual memory. (a) The descriptor segment points to the page tables.\n\
    \n### Segmentation with Paging: MULTICS (3)\n\nWhen a memory reference occurs,\
    \ the following algorithm is carried out:\n\n- The segment number used to find\
    \ segment descriptor.\n- Check is made to see if the segment's page table is in\
    \ memory.\n  - If not, segment fault occurs.\n  - If there is a protection violation,\
    \ a fault (trap) occurs.\n\n## Segmentation with Paging: MULTICS (4)\n\n- Page\
    \ table entry for the requested virtual page examined.\n  - If the page itself\
    \ is not in memory, a page fault is triggered.\n  - If it is in memory, the main\
    \ memory address of the start of the page is extracted from the page table entry\n\
    - The offset is added to the page origin to give the main memory address where\
    \ the word is located.\n- The read or store finally takes place.\n\n"
