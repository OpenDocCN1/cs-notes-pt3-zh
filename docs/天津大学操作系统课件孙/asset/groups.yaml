    # Inodes


    +   - 128 bytes (8 inodes per 1024-Byte block)

    +   - Contains information about a file: owner, group, type, size, permissions,
    ctime, atime, mtime, ...

    +   - Contains pointers to data blocks

    +   - Contains pointers to an indirect block, a double indirect block, and a triple
    indirect block


    | Inode information |

    |---|

    | Owner / Group |

    | File Type |

    | File Size |

    | File Permissions |

    | Time Stamps: create time; access time; modification time |

    | Link Counter |

    | Additional Flags: (ACL, EXT2,_FLAGS) |

    | Pointers to Block Data |


