  - '[PAGE 29]


    # # Swapping (3)


    ![](img/173140081d013d40ccca0b8e597b7a43_29_0.png)


    +   - Allocating space for growing data segment

    +   - Allocating space for growing stack & data segment'
  - '[PAGE 30]


    # Compaction (Similar to Garbage Collection)


    +   - Assumes programs are all relocatable (how supported?)

    +   - Processes must be suspended during compaction

    +   - Needed only when fragmentation gets very bad


    ![](img/173140081d013d40ccca0b8e597b7a43_30_0.png)'
  - '[PAGE 31]


    # Memory Management Problems


    +   - Fixed partitions suffer from internal fragmentation

    +   - Variable partitions suffer from external fragmentation

    +   - Compaction suffers from overhead

    +   - Overlays are painful to program efficiently

    +   - Swapping requires writing to disk sectors'
  - '[PAGE 32]


    # # Alternative Approach:

    # Virtual Memory


    +   - Provide user with virtual memory that is as big as user needs

    +   - Store virtual memory on disk

    +   - Store in real memory those parts of virtual memory currently under use

    +   - Load and store cached virtual memory without user program intervention (“transparently”)'
  - '[PAGE 33]


    # Virtual Memory


    +   - Comes from the basis that all of a process’ address space is not needed
    at once

    +   - Thus, chop up the address space into smaller parts and only load the parts
    that are needed

    +   - These parts need not be contiguous in memory!'
  - '[PAGE 34]


    # # Benefits of Virtual Memory


    +   - Use secondary storage($)

    +     - Extend DRAM($$$) with reasonable performance

    +   - Protection

    +     - Processes do not step on each other

    +   - Convenience

    +     - Flat address space

    +     - Processes have the same view of the world

    +     - Load and store cached virtual memory without user program intervention

    +   - Reduce fragmentation:

    +     - make cacheable units all the same size (page=allocation unit)

    +   - Remove memory deadlock possibilities:

    +     - permit pre-emption of real memory'
  md: "\n## Variable-Partition Example\n\n![](img/173140081d013d40ccca0b8e597b7a43_17_0.png)\n\
    \n### More...\n\n- Results in *External Fragmentation*\n- After a while, only\
    \ small processes will be able to run due to too much external fragmentation\n\
    - MM must *compact* the memory to make more space available for larger processes\n\
    \n## Base and Limit Registers\n\n![](img/173140081d013d40ccca0b8e597b7a43_20_0.png)\n\
    \nBase and limit registers can be used to give each process a separate address\
    \ space.\n\n## Memory Management with Bitmaps\n\n![](img/173140081d013d40ccca0b8e597b7a43_21_0.png)\n\
    \n(a) A part of memory with five processes and three holes. The tick marks show\
    \ the memory allocation units. The shaded regions (0 in the bitmap) are free.\
    \ (b) The corresponding bitmap. (c) The same information as a list.\n\n## Memory\
    \ Management with Linked Lists\n\nFour neighbor combinations for the terminating\
    \ process, X.\n\n![](img/173140081d013d40ccca0b8e597b7a43_22_0.png)\n\n## Storage\
    \ Placement Strategies\n\n- **First Fit**\n  - Scan; use the first available hole\
    \ whose size is sufficient to meet the need.\n  - Problem: Creates average size\
    \ holes; more fragmentation closer to scan start.\n- **Next Fit**\n  - Minor variation\
    \ of first fit: keep track of where last search ended, restart from there.\n \
    \ - Problem: slightly worse performance than first fit.\n- **Best Fit**\n  - Use\
    \ the hole whose size is equal to the need, or if none is equal, the smallest\
    \ hole that is large enough.\n  - Problem: Creates small holes that can't be used.\n\
    - **Worst Fit**\n  - Use the largest available hole.\n  - Problem: Gets rid of\
    \ large holes, making it difficult to run large processes.\n- **Quick Fit**\n\
    \  - Maintains separate lists for some of the more common sizes requested.\n \
    \ - When a request comes for placement, it finds the closest fit.\n  - This is\
    \ a very fast scheme, but a merge is expensive. If merge is not done, memory will\
    \ quickly fragment into a large number of holes.\n\n## Modeling Multiprogramming\n\
    \n![](img/173140081d013d40ccca0b8e597b7a43_24_0.png)\n\nCPU utilization as a function\
    \ of the number of processes in memory\n\n## Chapter 3\n\n### Memory Management\n\
    \n### Virtual Memory\n\n## Swapping (1)\n\n- Comes from the basis that when a\
    \ process is blocked, it does not need to be in memory\n- Thus, it is possible\
    \ to save a process’ entire address space to disk\n- Saving to a “swap file” or\
    \ a “swap partition”\n\n## Swapping (3)\n\n![](img/173140081d013d40ccca0b8e597b7a43_29_0.png)\n\
    \n- Allocating space for growing data segment\n- Allocating space for growing\
    \ stack & data segment\n\n## Compaction (Similar to Garbage Collection)\n\n- Assumes\
    \ programs are all relocatable (how supported?)\n- Processes must be suspended\
    \ during compaction\n- Needed only when fragmentation gets very bad\n\n![](img/173140081d013d40ccca0b8e597b7a43_30_0.png)\n\
    \n## Memory Management Problems\n\n- Fixed partitions suffer from internal fragmentation\n\
    - Variable partitions suffer from external fragmentation\n- Compaction suffers\
    \ from overhead\n- Overlays are painful to program efficiently\n- Swapping requires\
    \ writing to disk sectors\n\n## Alternative Approach: Virtual Memory\n\n- Provide\
    \ user with virtual memory that is as big as the user needs\n- Store virtual memory\
    \ on disk\n- Store in real memory those parts of virtual memory currently under\
    \ use\n- Load and store cached virtual memory without user program intervention\
    \ (“transparently”)\n\n## Virtual Memory\n\n- Comes from the basis that all of\
    \ a process’ address space is not needed at once\n- Thus, chop up the address\
    \ space into smaller parts and only load the parts that are needed\n- These parts\
    \ need not be contiguous in memory!\n\n## Benefits of Virtual Memory\n\n- Use\
    \ secondary storage ($)\n  - Extend DRAM ($$$) with reasonable performance\n-\
    \ Protection\n  - Processes do not step on each other\n- Convenience\n  - Flat\
    \ address space\n  - Processes have the same view of the world\n  - Load and store\
    \ cached virtual memory without user program intervention\n- Reduce fragmentation:\n\
    \  - make cacheable units all the same size (page = allocation unit)\n- Remove\
    \ memory deadlock possibilities:\n  - permit pre-emption of real memory\n"
