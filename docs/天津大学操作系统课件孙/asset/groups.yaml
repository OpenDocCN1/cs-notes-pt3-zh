  - '[PAGE 200]


    # # Hard disk partitions


    +   - IDE and SCSI hard disks can be partitioned

    +   - Maximum of four _primary partitions_

    +   - One primary partition may be an _extended partition_

    +   - An extended partition can hold an unlimited amount of _logical partitions_
    (Linux: max 59 for IDE, 11 for SCSI)


    ![](img/173140081d013d40ccca0b8e597b7a43_200_0.png)


    +   - sda: The first sector of the disk contains the MBR and Partition Table

    +   - sda1: First primary partition holds a Windows filesystem

    +   - sda2: Second primary partition is an extended partition and holds three
    logical partitions

    +   - sda5: First logical partition holds a Linux filesystem that will be mounted
    as /

    +   - sda6: Second logical partition holds a Linux filesystem that will be mounted
    as /home

    +   - sda7: Third logical partition holds a Linux swap space'
  - '[PAGE 201]


    # # Partitioning tools


    +   - **fdisk**

    +     - Virtually every PC OS comes with a tool **fdisk** to create partitions
    for that OS

    +       - Linux, Windows, and so forth

    +   - **parted**

    +     - GPLed Linux program, available at www.gnu.org

    +     - Can create/resize/move/delete partitions

    +   - GParted, QTParted

    +     - GUI utilities that use GNU Parted

    +     - Can create/resize/move/delete partitions

    +   - Disk Druid and others

    +     - Partitioning program integrated in Linux install program'
