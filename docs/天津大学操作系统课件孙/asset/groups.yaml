    \n![](img/173140081d013d40ccca0b8e597b7a43_264_1.png)\n\n![](img/173140081d013d40ccca0b8e597b7a43_264_2.png)\n\
    \n(a)\n\n(b)\n\n(c)\n\n## Keyboard Software\n\n| Character | POSIX name | Comment\
    \ |\n|---|---|---|\n| CTRL-H | ERASE | Backspace one character |\n| CTRL-U | KILL\
    \ | Erase entire line being typed |\n| CTRL-V | LNEXT | Interpret next character\
    \ literally |\n| CTRL-S | STOP | Stop output |\n| CTRL-Q | START | Start output\
    \ |\n| DEL | INTR | Interrupt process (SIGINT) |\n| CTRL-\\\\ | QUIT | Force core\
