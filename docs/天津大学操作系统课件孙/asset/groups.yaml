    \ algorithm.\n\n## Incremental versus differential backup\n\n**Day 1**\n\n**Day\
    \ 2**\n\n**Day 3**\n\n**Day 4**\n\n## Incremental backup\n\n## Differential backup\n\
    \n## Backup devices\n\n- Tape drive\n  - Large capacity, fast\n  - Requires new\
    \ tapes regularly\n- CD-R, CD-RW, DVD\n  - Cheap but relatively slow\n- (Removable)\
    \ Hard disk\n  - Fast but expensive\n- Diskette drive\n  - Often available but\
    \ cumbersome for large backups\n- Network\n  - Useful in large installations;\
    \ usually requires commercial software (for instance, Tivoli Storage Manager)\n\
    \n## Default backup tools\n\n- **tar**\n  - Backs up individual files\n  - Widely\
    \ available\n  - Excellent for transferring data between platforms\n- **cpio**\n\
    \  - Backs up individual files\n  - Widely available\n  - Difficulties with many\
    \ symbolic links\n- **dump**\n  - Backs up whole filesystems\n  - Can handle incremental\
    \ backups (nine levels)\n- **dd**\n  - Useful for making bit-for-bit dumps of\
    \ disks and filesystems\n\n## File System Consistency\n\nFigure 4-27. File system\
    \ states. (a) Consistent. (b) Missing block. (c) Duplicate block in free list.\
    \ (d) Duplicate data block.\n\n## Caching (1)\n\nHash table\n\nFront (LRU)\n\n\
    Rear (MRU)\n\nFigure 4-28. The buffer cache data structures.\n\n## Caching (2)\n\
    \n- Some blocks, such as i-node blocks, are rarely referenced two times within\
    \ a short interval.\n- Consider a modified LRU scheme, taking two factors into\
    \ account:\n  - Is the block likely to be needed again soon?\n  - Is the block\
    \ essential to the consistency of the file system?\n\n## Reducing Disk Arm Motion\n\
    \nFigure 4-29. (a) I-nodes placed at the start of the disk. (b) Disk divided into\
    \ cylinder groups, each with its own blocks and i-nodes.\n\n## The ISO 9660 File\
    \ System\n\nFigure 4-30. The ISO 9660 directory entry.\n\n## Rock Ridge Extensions\n\
    \n### Rock Ridge extension fields:\n\n- PX - POSIX attributes.\n- PN - Major and\
    \ minor device numbers.\n- SL - Symbolic link.\n- NM - Alternative name.\n- CL\
    \ - Child location.\n- PL - Parent location.\n- RE - Relocation.\n- TF - Time\
    \ stamps.\n\n## Joliet Extensions\n\nJoliet extension fields:\n\n- Long file names.\n\
    - Unicode character set.\n- Directory nesting deeper than eight levels.\n- Directory\
    \ names with extensions\n\n## The MS-DOS File System (1)\n\nFigure 4-31. The MS-DOS\
    \ directory entry.\n\n## The MS-DOS File System (2)\n\n| Block size | FAT-12 |\
    \ FAT-16 | FAT-32 |\n|---|---|---|---|\n| 0.5 KB | 2 MB | | |\n| 1 KB | 4 MB |\
    \ | |\n| 2 KB | 8 MB | 128 MB | |\n| 4 KB | 16 MB | 256 MB | 1 TB |\n| 8 KB |\
    \ | 512 MB | 2 TB |\n| 16 KB | | 1024 MB | 2 TB |\n| 32 KB | | 2048 MB | 2 TB\
    \ |\n\nFigure 4-32. Maximum partition size for different block sizes. The empty\
    \ boxes represent forbidden combinations.\n\n## The UNIX V7 File System (1)\n\n\
    Figure 4-33. A UNIX V7 directory entry.\n\n## The UNIX V7 File System (2)\n\n\
    Figure 4-34. A UNIX i-node.\n\n## The UNIX V7 File System (3)\n\n| Root directory\
    \ |\n|---|\n| 1 . |\n| 1 .. |\n| 4 bin |\n| 7 dev |\n| 14 lib |\n| 9 etc |\n|\
    \ 6 usr |\n| 8 tmp |\n\nLooking up /usr yields i-node 6\n\n| I-node 6 is for /usr\
    \ |\n|---|\n| Mode size times |\n| 132 |\n\nI-node 6 says that /usr is in block\
    \ 132\n\n| Block 132 is /usr directory |\n|---|\n| 6 . |\n| 1 .. |\n| 19 dick\
    \ |\n| 30 erik |\n| 51 jim |\n| 26 ast |\n| 45 bal |\n\n/usr/ast is i-node 26\n\
    \n| I-node 26 is for /usr/ast |\n|---|\n| Mode size times |\n| 406 |\n\nI-node\
    \ 26 says that /usr/ast is in block 406\n\n| Block 406 is /usr/ast directory |\n\
    |---|\n| 26 . |\n| 6 .. |\n| 64 grants |\n| 92 books |\n| 60 mbox |\n| 81 minix\
    \ |\n| 17 src |\n\n/usr/ast/mbox is i-node 60\n\nFigure 4-35. The steps in looking\
    \ up /usr/ast/mbox.\n\n"
