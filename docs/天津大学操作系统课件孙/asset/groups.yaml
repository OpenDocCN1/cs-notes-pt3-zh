  md: "\n\n## Shared Pages\n\nProcess table\n\nProgram\n\nData 1\n\nData 2\n\nPage\
    \ tables\n\nTwo processes sharing same program sharing its page table\n\n## Implementation\
    \ Issues\n\n### Operating System Involvement with Paging\n\nFour times when OS\
    \ involved with paging\n\n- **Process creation**\n  - determine program size\n\
    \  - create page table\n- **Process execution**\n  - MMU reset for new process\n\
    \  - TLB flushed\n- **Page fault time**\n  - determine virtual address causing\
    \ fault\n  - swap target page out, needed page in\n- **Process termination time**\n\
    \  - release page table, pages\n\n### Page Fault Handling (1)\n\n- Hardware traps\
    \ to kernel\n- General registers saved\n- OS determines which virtual page needed\n\
    - OS checks validity of address, seeks page frame\n- If selected frame is dirty,\
    \ write it to disk\n\n### Page Fault Handling (2)\n\n- OS brings schedules new\
    \ page in from disk\n- Page tables updated\n- Faulting instruction backed up to\
    \ when it began\n- Faulting process scheduled\n- Registers restored\n- Program\
    \ continues\n\n### Instruction Backup\n\nMOVE.L #6(A1), 2(A0)\n\n16 Bits\n\n|\
    \ 1000 | MOVE |\n| --- | --- |\n| 1002 | 6 |\n| 1004 | 2 |\n\nOpcode\nFirst operand\n\
    Second operand\n\nAn instruction causing a page fault\n\n## Separation of Policy\
    \ and Mechanism\n\nPage fault handling with an external pager\n\n## 作业\n\nP 139\
    \ 页\n\n12，22，24，26，27，28\n\n## Chapter 3\n\n## Memory Management\n\n## Segmentation\n\
    \n### Separate Instruction and Data Spaces\n\n(a) One address space.\n(b) Separate\
    \ I and D spaces.\n\n## Shared Pages\n\nTwo processes sharing the same program\n\
    sharing its page table.\n\n## Segmentation (2)\n\nIn a one-dimensional address\
    \ space with growing tables, one table may bump into another.\n\n### Segmentation\
    \ (3)\n\nA segmented memory allows each table to grow or shrink independently\
    \ of the other tables.\n\n### Implementation of Pure Segmentation\n\n| Consideration\
    \ | Paging | Segmentation |\n|---|---|---|\n| Need the programmer be aware that\
    \ this technique is being used? | No | Yes |\n| How many linear address spaces\
    \ are there? | 1 | Many |\n| Can the total address space exceed the size of physical\
    \ memory? | Yes | Yes |\n| Can procedures and data be distinguished and separately\
    \ protected? | No | Yes |\n| Can tables whose size fluctuates be accommodated\
    \ easily? | No | Yes |\n| Is sharing of procedures between users facilitated?\
    \ | No | Yes |\n| Why was this technique invented? | To get a large linear address\
    \ space without having to buy more physical memory | To allow programs and data\
    \ to be broken up into logically independent address spaces and to aid sharing\
