    # What is a filesystem?


    +   - Place to store files and refer to them

    +   - Hierarchical structure through use of directories

    +   - A filesystem can be stored on any block device

    +     - Floppy disk

    +     - Hard disk

    +     - Partition

    +     - RAID, LVM volume

    +     - File (for use with a loop device)

    +     - RAM disk'
