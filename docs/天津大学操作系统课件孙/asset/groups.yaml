    \ the one pointed to by the PC have fully executed.\n3. No instruction beyond\
    \ the one pointed to by the PC has been executed.\n4. Execution state of the instruction\
    \ pointed to by the PC is known.\n\n"
  mdcn: "\n\n## RAID levels\n\n- RAID levels have different characteristics\n  - RAID-5\
    \ is not \"better\" than RAID-1\n- Use RAID level according to needs\n\n| RAID\
    \ level | Min # disks | Read performance | Write performance | Redundancy | Data\
    \ capacity with 3x1GB disk | Other remarks |\n|------------|-------------|------------------|-------------------|------------|-------------------------------|---------------|\n\
    | Linear     | 2           | Equal            | Equal             | No       \
    \  | 3 GB                          | Can be used if disks are not equal |\n| 0\
    \          | 2           | Fast             | Fast              | No         |\
    \ 3 GB                          |               |\n| 1          | 2          \
    \ | Fast             | Somewhat slower   | Yes        | 1 GB                 \
    \         | Can sustain N-1 disk crash(s) |\n| 4          | 3           | Somewhat\
    \ faster  | Slow              | Yes        | 2 GB                          | Can\
    \ sustain one disk crash Parity disk is bottleneck |\n| 5          | 3       \
    \    | Somewhat faster  | Somewhat faster   | Yes        | 2 GB              \
    \            | Can sustain one disk crash CPU intensive |\n\n(*) Performance compared\
    \ to a single disk, for data transfers greater than block size\n\n## Linux RAID\
    \ support\n\n- Software RAID\n  - Implemented in Linux kernel\n  - Needs **mdadm**\
    \ package\n  - Uses disk partitions to create RAID devices\n  - Logical device\
    \ name: /dev/mdn\n- Hardware RAID\n  - Implemented in special adapter cards\n\
    \  - Adapter needs to be supported by Linux kernel\n  - Generally specific software\
    \ needed to configure adapter correctly (might not be available under Linux)\n\
    \  - RAID devices show up as regular SCSI disk\n\n## Spare disks\n\n- To make\
    \ RAID1/RAID5 more failsafe in case of a disk failure, use spare disks!\n\n```\n\
    cat /etc/raidtab\n...\nnr-spare-disks 1\ndevice  /dev/sdd1\nspare-disk 0\n...\n\
    ```\n\n![](img/173140081d013d40ccca0b8e597b7a43_225_0.png)\n\n- Remove a failed\
    \ disk with `raidhotremove`\n- Add a new disk to the array with `raidhotadd`\n\
    \n## References\n\n- Chapter 5: Input/Output, _Modern Operating Systems .3rd ed_,\
    \ _Andrew S. Tanenbaum_\n- Unit 8: Block devices, RAID, and LVM, _Linux System\
    \ Administration I: Implementation , ERC 6.0, IBM_\n\n# Input/Output Devices\n\
    \n## I/O Devices\n\n| Device | Data rate |\n|---|---|\n| Keyboard | 10 bytes/sec\
    \ |\n| Mouse | 100 bytes/sec |\n| 56K modem | 7 KB/sec |\n| Scanner | 400 KB/sec\
    \ |\n| Digital camcorder | 3.5 MB/sec |\n| 802.11g Wireless | 6.75 MB/sec |\n\
    | 52x CD-ROM | 7.8 MB/sec |\n| Fast Ethernet | 12.5 MB/sec |\n| Compact flash\
    \ card | 40 MB/sec |\n| FireWire (IEEE 1394) | 50 MB/sec |\n| USB 2.0 | 60 MB/sec\
    \ |\n| SONET OC-12 network | 78 MB/sec |\n| SCSI Ultra 2 disk | 80 MB/sec |\n\
    | Gigabit Ethernet | 125 MB/sec |\n| SATA disk drive | 300 MB/sec |\n| Ultrium\
    \ tape | 320 MB/sec |\n| PCI bus | 528 MB/sec |\n\nFigure 5-1. Some typical device,\
    \ network, and bus data rates.\n\n## Memory-Mapped I/O (1)\n\n![](img/173140081d013d40ccca0b8e597b7a43_230_0.png)\n\
    \nFigure 5-2. (a) Separate I/O and memory space. (b) Memory-mapped I/O. (c) Hybrid.\n\
    \n## Memory-Mapped I/O (2)\n\n![](img/173140081d013d40ccca0b8e597b7a43_231_0.png)\n\
    \nFigure 5-3. (a) A single-bus architecture.\n(b) A dual-bus memory architecture.\n\
    \n## Direct Memory Access (DMA)\n\n![](img/173140081d013d40ccca0b8e597b7a43_232_0.png)\n\
    \nFigure 5-4. Operation of a DMA transfer.\n\nTanenbaum, Modern Operating Systems\
