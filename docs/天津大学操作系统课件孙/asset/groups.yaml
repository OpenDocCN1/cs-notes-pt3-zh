  mdcn: "\n\n## Demand Paging\n\n- **Demand paging**: pages are only loaded into memory\
    \ when they are demanded during execution\n  - Less I/O needed\n  - Less memory\
    \ needed\n  - Higher degree of multiprogramming\n  - Faster response\n\n- **Pager\
    \ (lazy swapper)** never swaps a page into memory unless that page will be needed.\n\
    \n- An extreme case: **Pure demand paging** starts a process with no pages in\
    \ memory ...\n\nTransfer of a Paged Memory to Contiguous Disk Space\n\n## Page\
    \ Replacement Algorithms\n\n- Page fault forces choice\n  - which page must be\
    \ removed\n  - make room for incoming page\n\n- Modified page must first be saved\n\
    \  - unmodified just over written\n\n- Better not to choose an often used page\n\
    \  - will probably need to be brought back in soon\n\n## Page Replacement Algorithms\n\
    \n- Random page replacement\n- Optimal page replacement algorithm\n- Not recently\
    \ used page replacement\n- First-In, First-Out page replacement\n- Second chance\
    \ page replacement\n- Clock page replacement\n- Least recently used page replacement\n\
    - Working set page replacement\n- WSClock page replacement\n\n## Optimal Page\
    \ Replacement Algorithm\n\n- Replace page needed at the farthest point in future\n\
    \  - Optimal but unrealizable\n\n- Estimate by …\n  - logging page use on previous\
    \ runs of process\n  - although this is impractical\n\n## Optimal Example\n\n\
    12 references, 7 faults\n\n| Page Refs | Fault? | Page Contents |\n|-----------|--------|---------------|\n\
    | A         | yes    | A             |\n| B         | yes    | B A           |\n\
    | C         | yes    | C B A         |\n| D         | yes    | D B A         |\n\
    | A         | no     | D B A         |\n| B         | no     | D B A         |\n\
    | E         | yes    | E B A         |\n| A         | no     | E B A         |\n\
    | B         | no     | E B A         |\n| C         | yes    | C E B         |\n\
    | D         | yes    | D C E         |\n| E         | no     | D C E         |\n\
    \n## Not Recently Used Page Replacement Algorithm（NRU）\n\n- Each page has Reference\
    \ bit, Modified bit\n  - bits are set when page is referenced, modified\n- Pages\
    \ are classified\n  - 0: not referenced, not modified\n  - 1: not referenced,\
    \ modified\n  - 2: referenced, not modified\n  - 3: referenced, modified\n- NRU\
    \ removes page at random\n  - from lowest numbered non empty class\n\n## FIFO\
    \ Page Replacement Algorithm\n\n- Maintain a linked list of all pages\n  - in\
    \ order they came into memory\n\n- Page at beginning of list replaced\n\n- Disadvantage\n\
    \  - page in memory the longest may be often used\n\n## FIFO\n\n12 references,\
    \ 9 faults\n\n| Page Refs | Fault? | 3 Page Frames |  |  |\n|---|---|---|---|---|\n\
    | A | yes | A |  |  |\n| B | yes | B | A |  |\n| C | yes | C | B | A |\n| D |\
    \ yes | D | C | B |\n| A | yes | A | D | C |\n| B | yes | B | A | D |\n| E | yes\
    \ | E | B | A |\n| A | no | E | B | A |\n| B | no | E | B | A |\n| C | yes | C\
    \ | E | B |\n| D | yes | D | C | E |\n| E | no | D | C | E |\n\n## Belady's Anomaly\
    \ (for FIFO)\n\nSame reference string as with 3 frames (9 page faults).\n\n12\
    \ references, 10 faults\n\n| Page Refs | Fault? | 4 Page Frames |  |  |  |\n|---|---|---|---|---|---|\n\
    | A | yes | A |  |  |  |\n| B | yes | B | A |  |  |\n| C | yes | C | B | A | \
    \ |\n| D | yes | D | C | B | A |\n| A | no | D | C | B | A |\n| B | no | D | C\
    \ | B | A |\n| E | yes | E | D | C | B |\n| A | yes | A | E | D | C |\n| B | yes\
    \ | B | A | E | D |\n| C | yes | C | B | A | E |\n| D | yes | D | C | B | A |\n\
    | E | yes | E | D | C | B |\n\nBelady’s Anomaly for FIFO: (Sometimes) as the number\
    \ of page frames increase, so does the fault rate.\n\n## Second Chance Example\n\
    \n12 references,\n9 faults\n\n| Page Refs | Fault? | Page Contents |\n|---|---|---|\n\
    | A | yes | A* |\n| B | yes | B* | A* |\n| C | yes | C* | B* | A* |\n| D | yes\
    \ | D* | C | B |\n| A | yes | A* | D* | C |\n| B | yes | B* | A* | D* |\n| E |\
    \ yes | E* | B | A |\n| A | no | E* | B | A* |\n| B | no | E* | B* | A* |\n| C\
    \ | yes | C* | E | B |\n| D | yes | D* | C* | E |\n| E | no | D* | C* | E* |\n\
    \n"
