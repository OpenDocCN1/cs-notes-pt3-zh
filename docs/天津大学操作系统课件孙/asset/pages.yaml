- pgno: 208
  md: '# LVM implementation overview


    +   - Add hard disks and/or create partitions (type 0x8e) on existing hard disks

    +   - Initialize physical volumes (disks or partitions)


    ```

    ```bash

    # pvcreate /dev/sda3

    # pvcreate /dev/sdb

    ```

    ```


    +   - Create volume group **vg00** with physical volumes


    ```

    ```bash

    # vgcreate vg00 /dev/sda3 /dev/sdb

    ```

    ```


    +   - Create logical volume **lv00** in volume group


    ```

    ```bash

    # lvcreate -L 50M -n lv00 vg00

    ```

    ```


    +   - Can now use /dev/vg00/lv00 as block device'
  merge: -1
  img_proc: true
- pgno: 209
  md: "# # Physical volume commands\n\n+   - `pvcreate <pv>`\n+     – Initializes\
    \ a physical volume by putting an (empty) volume group descriptor area at the\
    \ start of the PV\n+   \n+     VGDA ( **V**olume **G**roup **D**escriptor **A**rea)\n\
    +   \n+     ![](img/173140081d013d40ccca0b8e597b7a43_209_0.png)\n+   \n+   - `pvmove\
    \ [-n <lv>] <source pv> [<destination pv>]`\n+     – Move PEs from one PV to another\
    \ PV in the volume group\n+   \n+   - `pvdisplay <pv>`\n+     – List information\
    \ about a PV"
  merge: -1
