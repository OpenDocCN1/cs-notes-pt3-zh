- pgno: 216
  md: "# # Additional LVM considerations\n\n+   - Linux LVM implementation has \"\
    snapshot\" capability  \n+     – Can be useful for fast backups\n+   - If LVM-based\
    \ filesystems are listed in /etc/fstab, then LVM support needs to be included\
    \ in the initial root disk (initrd)\n+   - Mirroring is handled outside of the\
    \ LVM structure\n+   - LVM uses the device mapper kernel device driver\n+   -\
    \ LVM snapshots are read/write by default"
  merge: -1
