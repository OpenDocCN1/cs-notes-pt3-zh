- pgno: 46
  md: '# # Pros/Cons


    +   - Since only the necessary parts of the process are loaded, processes load
    faster and it allows much better memory utilization


    +   - Needs lots of extra hardware to accomplish the job (efficiently)


    +   - In some cases too much paging (i.e. “thrashing”) can occur, which is _very_
    slow'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Page Fault Handling (1)


    +   - The hardware traps to the kernel, saving the program counter on the stack.

    +   - An assembly code routine is started to save the general registers and other
    volatile information.

    +   - The operating system discovers that a page fault has occurred, and tries
    to discover which virtual page is needed.

    +   - Once the virtual address that caused the fault is known, the system checks
    to see if this address is valid and the protection consistent with the access'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Page Fault Handling (2)


    +   - If the page frame selected is dirty, the page is scheduled for transfer
    to the disk, and a context switch takes place.

    +   - When page frame is clean, operating system looks up the disk address where
    the needed page is, schedules a disk operation to bring it in.

    +   - When disk interrupt indicates page has arrived, page tables updated to reflect
    position, frame marked as being in normal state.'
  merge: -1
  img_proc: true
