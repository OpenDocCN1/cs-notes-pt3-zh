  md: '# Backup devices


    +   - Tape drive

    +     - Large capacity, fast

    +     - Requires new tapes regularly

    +   - CD-R, CD-RW, DVD

    +     - Cheap but relatively slow

    +   - (Removable) Hard disk

    +     - Fast but expensive

    +   - Diskette drive

    +     - Often available but cumbersome for large backups

    +   - Network

    +     - Useful in large installations; usually requires commercial software (for
    instance, Tivoli Storage Manager)'
  merge: -1
