- pgno: 170
  md: '# Quota concepts


    +   - Quotas limit the amount of data a user/group is allowed to store

    +   - Defined on a per-filesystem basis

    +   - Based on block and/or inode usage per user or group

    +   - Two limits per quota: Soft and hard

    +     - User exceeds soft limit — warning only

    +     - User exceeds hard limit — error

    +   - Grace period identifies how long the soft limit may be exceeded

    +     - After that period, a user gets errors instead of warnings


    ![](img/173140081d013d40ccca0b8e597b7a43_170_0.png)


    Each user may consume only 20 MB permanently and 25 MB temporarily'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Disk Quotas


    Figure 4-24. Quotas are kept track of on a per-user basis in a quota table.


    ![](img/173140081d013d40ccca0b8e597b7a43_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Quota implementation on Linux


    +   - Quota support compiled into the kernel

    +     - No daemon necessary

    +   - Implemented on a per-filesystem basis

    +     - A user can have different quota on different filesystems

    +     - Stored in aquota.user and aquota.groups in the root of the filesystem

    +   - Quota checking should be enabled when mounting the filesystem

    +     - Mount options: **usrquota**, **grpquota**

    +     - Can be specified in /etc/fstab

    +   - Quota checking should be turned on after mounting with the **quotaon** command

    +     - Automatically executed from bootscript after **mount -a**'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Enabling quota


    +   - Modify `/etc/fstab`


    ```

    ```text

    /dev/sda2  /          ext3    defaults                         1 1

    /dev/sda4  /home      ext3    defaults,usrquota,grpquota      1 2

    /dev/sdb   /mnt/cdrom iso9660 noauto,owner,ro                 0 0

    /dev/sda3  swap       swap    defaults                         0 0

    /dev/fd0   /mnt/floppy msdos  noauto,owner                    0 0

    none       /proc      proc    defaults                         0 0

    none       /dev/pts   devpts  gid=5,mode=620                   0 0

    ```

    ```


    +   - Create `aquota.user` and `aquota.group` in the filesystem''s root directory

    +   - Remount the partition

    +   - Calculate current usage and turn on quota checking


    ```

    ```shell

    # touch /home/aquota.user /home/aquota.group

    # mount -o remount /home

    # quotacheck /home

    # quotaon /home

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# # Configuring quota\n\n+   - Done with the **edquota** command  \n+     -\
    \ Starts $EDITOR (default: vi) in a subshell  \n+     - Only edit the block/inode\
    \ soft/hard quota numbers\n\n+   - User quota: `edquota -u username`  \n+    \
    \ ```text  \n+     Disk quotas for user tux1 (uid 501):  \n+     Filesystems \
    \  blocks   soft   hard   inodes   soft   hard  \n+     /dev/sda4     10700  \
    \  20000  25000  407    0    0  \n+     /dev/sda9     320      300    350    23\
    \     30   50  \n+     ~  \n+     ~  \n+     ~  \n+     ~  \n+     \"/tmp/Edp.a9fSEQK\"\
    \ 3L, 213C  \n+     ```\n\n+   - Group quota: `edquota -g groupname`  \n+   -\
    \ Grace period: `edquota -t`  \n+   - Copy quota: `edquota -p tux1 -u tux2 tux3\
    \ tux4`"
  merge: -1
  img_proc: true
- pgno: 175
  md: "# Quota information\n\n+   - **quota** command\n+     - Reports on the quota\
    \ of one user\n+     - Can be executed by anyone\n+     - A regular user can only\
    \ view his own quota\n\n```\ntux1$ quota\nDisk quotas for user tux1 (uid 501):\n\
    Filesystem  blocks  quota  limit  grace  files  quota  limit  grace\n/dev/sda4\
    \   10700  20000  25000         407    0      0\n```\n\n+   - **repquota** command\n\
    +     - Reports on the quota of all users and groups\n+     - Can only be executed\
    \ by root\n\n```\nroot# repquota /dev/hda4\n                 Block limits    \
    \              File limits\nUser      used   soft   hard  grace     used  soft\
    \  hard  grace\nroot       --   848804      0      0            56892     0  \
    \   0\n.\ntux1       ++     1500   1000   1500  7days      112   112   115  none\n\
    tux2       --      176   1000   1500               44     0     0\n```"
  merge: -1
  img_proc: true
