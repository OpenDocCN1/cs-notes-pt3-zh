- pgno: 115
  md: '# # File Systems (1)


    # ## Essential requirements for long-term information storage:


    +   - It must be possible to store a very large amount of information.


    +   - The information must survive the termination of the process using it.


    +   - Multiple processes must be able to access the information concurrently.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# # File & File Structure


    +   - File: a named collection of related information that is recorded on secondary
    storage

    +     - contiguous logical address space

    +     - Types:

    +       - Data: numeric, character, binary

    +       - Program

    +   - File Structure: depends on its type

    +     - None - sequence of words, bytes

    +     - Complex Structures

    +     - Simple record structure

    +       - Lines

    +       - Fixed length

    +       - Variable length

    +       - Formatted document

    +       - etc.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# File Systems (2)


    Think of a disk as a linear sequence of fixed-size blocks and supporting reading
    and writing of blocks. Questions that quickly arise:


    +   - How do you find information?

    +   - How do you keep one user from reading another’s data?

    +   - How do you know which blocks are free?'
  merge: -1
