- pgno: 212
  md: '# # Striping logical volumes


    +   - A logical volume may be striped across two or more physical volumes during
    creation

    +   - For large data transfers, this increases performance


    ```

    ```

    # lvcreate -L 300M -i 2 -I 8 -n mystripedlv vg00

    ```

    ```


    ![](img/173140081d013d40ccca0b8e597b7a43_212_0.png)


    /dev/vg00/mystripedlv'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# # Extending/reducing a volume group


    +   • To add or remove a physical volume to or from a volume group, use the `vgextend`
    and `vgreduce` commands

    +   • To move physical extents from one physical volume to another, use `pvmove`


    ```

    ```

    # vgextend vg00 /dev/sdb6

    # vgreduce vg00 /dev/sda5

    ERROR: can''t reduce volume group "vg00" by used

    physical volume "/dev/sda5"

    # pvmove /dev/sda5 /dev/sdb6

    # vgreduce vg00 /dev/sda5

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Extending/reducing a logical volume\n\n+   - To extend/shrink a logical volume\
    \ use the `lvextend`/`lvreduce` commands\n+     - Use `-L` option to specify size\
    \ in bytes\n+     - Use `-l` option to specify size in PEs\n+   - `lvextend`/`lvreduce`\
    \ do **NOT** extend/shrink a filesystem in the LV automatically!\n+   \n+    \
    \ (Extending/shrinking a filesystem will be covered later)\n\n```\n```text\n#\
    \ lvextend -L +300M /dev/vg00/mylv\nlvextend -- rounding relative size up to physical\
    \ extent boundary\nlvextend -- extending logical volume \"/dev/vg00/mylv\" to\
    \ 380 MB\nlvextend -- doing automatic backup of volume group \"system\"\nlvextend\
    \ -- logical volume \"/dev/vg00/mylv\" successfully extended\n# lvreduce -l -12\
    \ /dev/system/mystripedlv\n...\n```\n```"
  merge: -1
  img_proc: true
