- pgno: 23
  md: '# Storage Placement Strategies


    +   - **First Fit**

    +     - Scan; use the first available hole whose size is sufficient to meet the
    need.

    +     - Problem: Creates average size holes; more fragmentation closer to scan
    start.

    +   - **Next Fit**

    +     - Minor variation of first fit: keep track of where last search ended, restart
    from there.

    +     - Problem: slightly worse performance than first fit.

    +   - **Best Fit**

    +     - Use the hole whose size is equal to the need, or if none is equal, the
    smallest hole that is large enough.

    +     - Problem: Creates small holes that can''t be used.

    +   - **Worst Fit**

    +     - Use the largest available hole.

    +     - Problem: Gets rid of large holes, making it difficult to run large processes.

    +   - **Quick Fit**

    +     - maintains separate lists for some of the more common sizes requested.

    +     - When a request comes for placement, it finds the closest fit.

    +     - This is a very fast scheme, but a merge is expensive. If merge is not
    done, memory will quickly fragment into a large number of holes.'
  merge: -1
  img_proc: true
