- pgno: 157
  md: '# Inodes


    +   - 128 bytes (8 inodes per 1024-Byte block)

    +   - Contains information about a file: owner, group, type, size, permissions,
    ctime, atime, mtime, ...

    +   - Contains pointers to data blocks

    +   - Contains pointers to an indirect block, a double indirect block, and a triple
    indirect block


    | Inode information |

    |---|

    | Owner / Group |

    | File Type |

    | File Size |

    | File Permissions |

    | Time Stamps: create time; access time; modification time |

    | Link Counter |

    | Additional Flags: (ACL, EXT2,_FLAGS) |

    | Pointers to Block Data |


    ![](img/173140081d013d40ccca0b8e597b7a43_157_0.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Data blocks\n\n+   - Contain file data\n+   - File may be a directory, in\
    \ which case the data is the list of file names and inodes in that directory\n\
    +   - Multiple file names may point to the same inode!  \n+     (Or files may\
    \ have multiple names)\n\n![](img/173140081d013d40ccca0b8e597b7a43_158_0.png)\n\
