  md: "# Graphical User Interfaces (4)\n\n```\n```c\n#include <windows.h>\n\nint WINAPI\
    \ WinMain(HINSTANCE h, HINSTANCE, hprev, char *szCmd, int iCmdShow)\n{\n     \
    \   WNDCLASS wndclass;                 /* class object for this window */\n  \
    \      MSG msg;                            /* incoming messages are stored here\
    \ */\n        HWND hwnd;                          /* handle (pointer) to the window\
    \ object */\n\n        /* Initialize wndclass */\n        wndclass.lpfnWndProc\
    \ = WndProc;    /* tells which procedure to call */\n        wndclass.lpszClassName\
    \ = \"Program name\"; /* Text for title bar */\n        wndclass.hIcon = LoadIcon(NULL,\
    \ IDI_APPLICATION); /* load program icon */\n        wndclass.hCursor = LoadCursor(NULL,\
    \ IDC_ARROW);   /* load mouse cursor */\n\n        RegisterClass(&wndclass); \
    \         /* tell Windows about wndclass */\n        hwnd = CreateWindow(...)\
    \           /* allocate storage for the window */\n        ShowWindow(hwnd, iCmdShow);\
    \        /* display the window on the screen */\n        UpdateWindow(hwnd); \
    \               /* tell the window to paint itself */\n        ...\n}\n```\n```\n\
    \nFigure 5-40. A skeleton of a Windows main program."
