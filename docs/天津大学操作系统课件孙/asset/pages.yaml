    +     - Less reliable

    +     - Smaller

    +     - But less expensive

    +   - RAID uses multiple hard disks in an array to create a logical device that
    is:

    +     - Faster

    +     - More reliable

    +     - Or larger

    +     - And still relatively inexpensive'
