  md: "# Example Program Using File System Calls (1)\n\n```\n/* File copy program.\
    \ Error checking and reporting is minimal. */\n\n#include <sys/types.h>      \
    \            /* include necessary header files */\n#include <fcntl.h>\n#include\
    \ <stdlib.h>\n#include <unistd.h>\n\nint main(int argc, char *argv[]);       /*\
    \ ANSI prototype */\n\n#define BUF_SIZE 4096                    /* use a buffer\
    \ size of 4096 bytes */\n#define OUTPUT_MODE 0700                  /* protection\
    \ bits for output file */\n\nint main(int argc, char *argv[])\n{\n    int in_fd,\
    \ out_fd, rd_count, wt_count;\n    char buffer[BUF_SIZE];\n\n    if (argc != 3)\
    \ exit(1);              /* syntax error if argc is not 3 */\n\n    /* Open the\
    \ input file and create the output file */\n    in_fd = open(argv[1], O_RDONLY);\
    \     /* open the source file */\n    if (in_fd < 0) exit(2);              /*\
    \ if it cannot be opened, exit */\n    out_fd = creat(argv[2], OUTPUT_MODE); /*\
    \ create the destination file */\n    if (out_fd < 0) exit(3);             /*\
    \ if it cannot be created, exit */\n\n    ...\n```\n\nFigure 4-5. A simple program\
    \ to copy a file."
  merge: -1
  img_proc: true
- pgno: 125
  md: "# # Example Program Using File System Calls (2)\n\n```\n/* Copy loop */\nwhile\
    \ (TRUE) {\n    rd_count = read(in_fd, buffer, BUF_SIZE); /* read a block of data\
    \ */\n    if (rd_count <= 0) break; /* if end of file or error, exit loop */\n\
    \    wt_count = write(out_fd, buffer, rd_count); /* write data */\n    if (wt_count\
    \ <= 0) exit(4); /* wt_count <= 0 is an error */\n}\n\n/* Close the files */\n\
    close(in_fd);\nclose(out_fd);\nif (rd_count == 0) /* no error on last read */\n\
    \    exit(0);\nelse\n    exit(5); /* error on last read */\n}\n```\n\nFigure 4-5.\
    \ A simple program to copy a file."
  merge: -1
