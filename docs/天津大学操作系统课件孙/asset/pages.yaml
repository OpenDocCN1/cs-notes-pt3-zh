- pgno: 52
  md: "# # Thrashing\n\n+   - If a process does not have “enough” pages, the page-fault\
    \ rate is very high. This leads to:\n+   \n+     – low CPU utilization\n+   \n\
    +     – OS scheduler thinks that it needs to increase the degree of multiprogramming\
    \ → new processes are added → even less pages for each process ...\n\n+   - Thrashing\
    \ ≡ a process is busy swapping pages in and out\n+   \n+     – → Spending more\
    \ time paging than executing.\n\n![](img/173140081d013d40ccca0b8e597b7a43_52_0.png)"
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Demand Paging


    +   - **Demand paging**: pages are only loaded into memory when they are demanded
    during execution

    +     – Less I/O needed

    +     – Less memory needed

    +     – Higher degree of multiprogramming

    +     – Faster response


    +   - **Pager (lazy swapper)** never swaps a page into memory unless that page
    will be needed.


    +   - An extreme case: **Pure demand paging** starts a process with no pages in
    memory ...


    ![](img/173140081d013d40ccca0b8e597b7a43_53_0.png)


    Transfer of a Paged Memory to Contiguous Disk Space'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # Page Replacement Algorithms


    +   - Page fault forces choice

    +     - which page must be removed

    +     - make room for incoming page


    +   - Modified page must first be saved

    +     - unmodified just over written


    +   - Better not to choose an often used page

    +     - will probably need to be brought back in soon'
