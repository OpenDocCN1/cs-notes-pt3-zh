- pgno: 81
  md: '# # Page Size (2)


    # ## Overhead due to page table and internal fragmentation


    s = average process size in bytes

    p = page size in bytes

    e = page entry


    overhead = \(\frac{s \cdot e}{p} + \frac{p}{2}\)


    page table space


    internal fragmentation


    Optimized when

    \(p = \sqrt{2se}\)'
  merge: -1
