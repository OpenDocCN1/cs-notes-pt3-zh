    # Access 数据库的建立


    主要方法：数据库向导（模板）或设计视图，一般用户


    +   - 确定表的结构

    +   - 建立一个空数据库，输入文件名

    +   - 使用设计器或向导创建表，进入设计视图，输入各个字段的信息

    +   - 建立表的索引

    +   - 定义主键

    +   - 输入表的名称保存表


    +   - 字段数据类型有10种

    +   - 字段属性：大小、小数位、格式'
