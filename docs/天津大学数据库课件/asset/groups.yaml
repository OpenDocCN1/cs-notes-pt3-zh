    # 表结构的修改


    选定基本表，进入设计视图，修改表结构


    注意：


    +   - 打开的表或正在使用的表是不能修改的。

    +   - 修改字段名称不会影响到字段中所存放的数据，但是会影响到一些相关的部分。如果查询、报表、窗体等对象使用了这个更换名称的字段，那么在这些对象中也要作相应的修改。

    +   - 关系表中互相关联的字段是无法修改的，如果需要修改，必须先将关联去掉'
