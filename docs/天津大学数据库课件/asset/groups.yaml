    \nUPDATE 基本情况 SET 助学金=助学金+30\nWHERE 助学金<200\n\n## 查询与查询表的创建\n\n### 查询\n\n根据给定的条件，从一个或多个表中获取所需的数据，形成一张“虚表”（表中的记录是与数据库表链接产生的）。\n\
