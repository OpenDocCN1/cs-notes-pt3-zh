    - 关系表中互相关联的字段是无法修改的，如果需要修改，必须先将关联去掉。\n\n## SQL语言\n\n### 主要功能和动词：\n\n| SQL功能 |\
    \ 动词 |\n| --- | --- |\n| 数据查询 | SELECT |\n| 数据定义 | CREATE、DROP、ALTER |\n| 数据操作\
    \ | INSERT、UPDATE、DELETE |\n| 数据控制 | GRANT、REVOKE |\n\n## SQL中的数据更新命令\n\n结构化查询语言SQL是操作关系数据库的工业标准语言。\n\
    \n在SQL中，常用的语句有两类：\n\n- 数据查询语句 SELECT\n- 数据更新命令 INSERT、UPDATE、DELETE\n\nINSERT语句用于数据插入，其语法格式为：\n\
    \n- 插入一条记录\n\n  INSERT INTO 表名 [(字段1, ..., 字段n)] VALUES (值1, ..., 值n)\n\n- 插入查询的结果\n\
    \n  INSERT INTO 表名 (字段1, ..., 字段n) VALUES 子查询\n\n## 数据更新-INSERT语句实例\n\n### 例：向表“基本情况”中插入一条记录\n\
    \nINSERT INTO 基本情况 (学号, 姓名, 性别, 党员, 专业, 出生年月, 助学金) VALUES (\"990301\", \"杨国强\"\
    , \"男\", TRUE, \"化学\", #12/28/80#, 220)\n\n### 注意：\n\n字符型常量用单引号或双引号括起来。\n\n逻辑型字段的值是\
    \ True/False、Yes/No 或 On/Off。\n\n日期的表示形式为 MM/DD/YY 或 MM/DD/YYYY。\n\n## 数据更新-DELETE语句\n\
    \nDELETE语句用于数据删除，其语法格式为：\n\nDELETE FROM 表 [WHERE 条件]\n\n**注意：** 若 WHERE 子句缺省，则删除表中所有的记录（表还在）。\n\
    \n例：删除表“基本情况”中所有学号为 990301 的记录。\n\nDELETE FROM 基本情况 WHERE 学号=\"990301\"\n\n例：删除表“学生成绩表”中成绩低于70分的记录。\n\
    \nDELETE FROM 学生成绩表 WHERE 成绩<70\n\n## 数据更新-UPDATE语句\n\nUPDATE语句用于数据修改，其语法格式为：\n\
