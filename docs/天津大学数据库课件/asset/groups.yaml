    - 硬件：只有卡片、纸带、磁带等存储设备\n- 软件：没有操作系统，没有进行数据管理的软件\n- 应用：以科学计算为目的\n- 特点：\n  - 程序和数据放在一起\n\
    \  - 数据不能共享\n\n## 计算机数据管理技术的演变\n\n### 人工管理阶段\n\n- 计算机不能存储数据\n- 没有支持数据管理的软件，人工管理数据。\n\
    - 数据组织面向应用，数据不能共享，数据重复。\n\n![](img/64ee449b81f541cd07ff640189c87526_11_0.png)\n\
    \n### 人工管理阶段数据管理示例\n\n例：两个C语言程序，分别求10个数据之和和最大值。\n\n```c\n/* 程序1：求10个数之和 */\n#include\
    \ <stdio.h>\nmain()\n{\n    int i,s=0;\n    int a[10]={66,55,75,42,86,77,96,89,78,56};\n\
    \    for(i=0;i<10;i++)\n        s=s+a[i];\n    printf(\"%d\",s);\n}\n```\n\n```c\n\
    /* 程序2：求10个数中的最大值 */\n#include <stdio.h>\nmain()\n{\n    int i,s;\n    int a[10]={66,55,75,42,86,77,96,89,78,56};\n\
    \    s=a[0];\n    for(i=1;i<10;i++)\n        if(s<a[i]) s=a[i];\n    printf(\"\
    %d\",s);\n}\n```\n\n## 计算机数据管理技术的演变\n\n### 操作系统——文件管理阶段\n\n- 信息以文件为单位存储在外存，且由OS统一管理。\n\
    - 采用目录结构组织文件\n- 用户可以通过文件名访问文件，不必关心文件存储的细节\n- 实现了以文件为单位的保护和共享。\n\n### 问题\n\n- 文件内数据的组织与管理？\n\
    - 文件之间的联系？\n\n### 操作系统的文件管理\n\n![](img/64ee449b81f541cd07ff640189c87526_14_0.png)\n\
    \n### 文件管理阶段\n\n- 时间：20世纪60年代中期\n- 硬件：磁带、磁盘等大容量存储设备\n- 软件：有了操作系统\n- 应用：不仅用于科学计算，还用于数据管理。\n\
    - 特点：\n  - 程序与数据分离\n  - 数据有一定的独立性\n  - 实现了以文件为单位的\n  - 数据共享\n\n### 文件管理阶段数据管理示例\n\
    \n```c\n/* 程序 3：\n求文件中 10 个数之和*/\n#include <stdio.h>\nmain()\n{\n    int i,x,s=0;\n\
    \    FILE * fp;\n    /*打开文件*/\n    fp=fopen(\"c:\\\\data.dat\", \"r\");\n    for(i=0;i<10;i++)\n\
    \    {   /*文件中读数据*/\n        fscanf(fp, \"%d\",&x);\n        s=s+x;\n    }\n \
    \   printf(\"%d\",s);\n    fclose(fp); /*关闭文件*/\n}\n```\n\n```c\n/* 程序 4：\n求文件中\
    \ 10 个数的最大值*/\n#include <stdio.h>\nmain()\n{\n    int i,x,s=-32767;\n    FILE\
    \ * fp;\n    /*打开文件*/\n    fp=fopen(\"c:\\\\data.dat\", \"r\");\n    for(i=0;i<10;i++)\n\
    \    {   /*文件中读数据*/\n        fscanf(fp, \"%d\",&x);\n        if (s<x) s=x;\n \
    \   }\n    printf(\"%d\",s);\n    fclose(fp); /* 关闭文件 */\n}\n```\n\n![](img/64ee449b81f541cd07ff640189c87526_16_0.png)\n\
    \n### 数据库系统阶段\n\n- 时间：20世纪60年代后期\n- 硬件：出现了大容量且价格低廉的磁盘\n- 软件：有了数据库管理系统DBMS\n- 应用：各个方面。\n\
    - 特点：\n  - 数据结构化\n  - 数据共享性高，冗余小\n  - 数据独立性高\n  - 数据由DBMS统一管理控制\n  - 为用户提供了友好的接口\n\
    \n## 计算机数据管理技术的演变\n\n### 数据库系统阶段\n\n- 面向企业或部门、以数据为中心组织数据，形成综合性的数据库，为各应用共享。\n-\
    \ 数据冗余小，节省存储空间，有利于保持数据的一致性\n- 程序和数据有较高的独立性，数据易修改，易扩充。\n- 具有良好的用户接口，用户可方便地开发和使用数据库。\n\
    - 提供了数据的安全性、完整性，以及并发控制。\n\n## 数据库管理系统\n\nDataBase Management System\n\n![](img/64ee449b81f541cd07ff640189c87526_19_0.png)\n\
    \n## 数据库系统——数据库管理系统\n\n### DBMS\n\n是处理所有用户对数据库存取请求的软件系统，是数据库系统中的核心软件。\n\n### DBMS的功能\n\
    \n- 数据定义\n- 数据操纵功能\n- 数据库运行管理\n- 数据组织、存储和管理\n- 数据库的建立和维护\n- 数据通信接口\n\n### 数据库系统阶段\n\
    \n- 上例用数据库实现  \n  求和： `SELECT Sum(Num) FROM Data`  \n  求最大值： `SELECT Max(Num)\
    \ FROM Data`\n\n![](img/64ee449b81f541cd07ff640189c87526_21_0.png)\n"
