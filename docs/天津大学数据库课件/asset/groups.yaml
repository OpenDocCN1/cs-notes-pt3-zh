    \nDELETE语句用于数据删除，其语法格式为：\n\nDELETE FROM 表 [WHERE 条件]\n\n**注意：** 若 WHERE 子句缺省，则删除表中所有的记录（表还在）。\n\
    \n例：删除表“基本情况”中所有学号为 990301 的记录。\n\nDELETE FROM 基本情况 WHERE 学号=\"990301\"\n\n例：删除表“学生成绩表”中成绩低于70分的记录。\n\
    \nDELETE FROM 学生成绩表 WHERE 成绩<70\n\n## 数据更新-UPDATE语句\n\nUPDATE语句用于数据修改，其语法格式为：\n\
    \nUPDATE 表 SET 字段1=表达式1, ..., 字段n=表达式n\n[WHERE 条件]\n\n**注意：** 若 WHERE 子句缺省，则修改表中所有的记录。\n\
    \n例：将表“基本情况”中学生王海的姓名改为王宝球。\n\nUPDATE 基本情况 SET 姓名=\"王宝球\" WHERE 姓名=\"王海\"\n\n例：将表“基本情况”中助学金低于200的学生加30元。\n\
    \nUPDATE 基本情况 SET 助学金=助学金+30\nWHERE 助学金<200\n\n## 查询与查询表的创建\n\n### 查询\n\n根据给定的条件，从一个或多个表中获取所需的数据，形成一张“虚表”（表中的记录是与数据库表链接产生的）。\n\
    \n### 查询表的常见创建途径：\n\n- 向导（不能进行多表查询）\n- 设计视图\n- SQL语言\n\n## SQL语言\n\n- 进入SQL视图\n\
    \  - 在“查询”对象中选择“在设计视图中创建查询”，建立空查询表。\n  - 在“视图|SQL视图”下就可进入其对话框输入相应的命令。\n\n## SELECT语句\n\
    \n语法形式为：\n\nSELECT [ALL|DISTINCT] 目标列 FROM 表(或查询)\n[WHERE 条件表达式]\n[GROUP BY 列名1\
    \ HAVING 过滤表达式]\n[ORDER BY 列名2 [ASC|DESC]]\n\n功能：\n\n根据WHERE子句中的表达式，从指定的表或视图中找出满足条件的记录，按目标列显示数据。\n\
    \n![](img/64ee449b81f541cd07ff640189c87526_106_0.png)\n\n## SELECT语句示例\n\n###\
    \ 例：查询所有学生的基本情况\n\nSELECT 学号, 姓名, 性别, 党员, 专业, 出生年月, 助学金, 照片 FROM 基本情况\n\n### 例：查询学生人数、最低、最高助学金和平均助学金\n\
    \nSELECT Count(*) AS 人数, Min(助学金) AS 最低助学金, Max(助学金) AS 最高助学金, Avg(助学金) AS 平均助学金\
    \ FROM 基本情况\n\n![](img/64ee449b81f541cd07ff640189c87526_107_0.png)\n\n![](img/64ee449b81f541cd07ff640189c87526_107_1.png)\n\
    \n![](img/64ee449b81f541cd07ff640189c87526_107_2.png)\n\n例：查询所有专业，查询结果中不出现重复的记录。\n\
    \nSELECT DISTINCT 专业 FROM 基本情况\n\n![](img/64ee449b81f541cd07ff640189c87526_108_0.png)\n\
    \n![](img/64ee449b81f541cd07ff640189c87526_108_1.png)\n\n例：查询学生的人数和平均年龄。\n\nSELECT\
    \ Count(*) AS 人数, Avg(Year(Date())-Year(出生年月)) AS 平均年龄 FROM 基本情况\n\n![](img/64ee449b81f541cd07ff640189c87526_108_2.png)\n\
    \n## WHERE 子句示例\n\n例：查询计算机专业学生的学号、姓名和专业。\n\nSELECT 学号, 姓名, 专业 FROM 基本情况 WHERE\
    \ 专业=\"计算机\"\n\n例：显示所有非计算机专业学生的学号、姓名和年龄。\n\nSELECT 学号, 姓名, Year(Date())-Year(出生年月)\
    \ AS 年龄 FROM 基本情况 WHERE 专业<>\"计算机\"\n\n![](img/64ee449b81f541cd07ff640189c87526_109_0.png)\n\
    \n## SELECT语句-多表连接查询\n\n### 例：查询所有学生的学号、姓名、课程和成绩\n\nWHERE 条件：在两表中有相同的属性值。\n\n\
    SELECT 基本情况.学号, 基本情况.姓名, 学生成绩表.课程, 学生成绩表.成绩 FROM 基本情况, 学生成绩表 WHERE 基本情况.学号 = 学生成绩表.学号\n\
    \n![](img/64ee449b81f541cd07ff640189c87526_110_0.png)\n\n![](img/64ee449b81f541cd07ff640189c87526_110_1.png)\n\
    \n## 在设计视图中创建查询\n\n例：查询学生人数、最低助学金、最高助学金和平均助学金。\n\n![](img/64ee449b81f541cd07ff640189c87526_111_0.png)\n\
    \n## 创建窗体\n\n创建窗体的方法：使用向导创建窗体，使用设计视图创建窗体。\n\n### 例：创建下图所示的窗体 Scores1\n\n![](img/64ee449b81f541cd07ff640189c87526_112_0.png)\n\
    \n- 打开Student.mdb数据库\n- 选择使用向导创建窗体\n- 选定表“学生成绩表”及所有字段\n- 选定窗体布局和窗体样式\n- 输入窗体名称：Scores1\n\
    \n## 创建报表\n\n### 例：创建下图所示的报表 Scores1\n\n**Scores1**\n\n| 学号 | 课程 | 成绩 |\n| ---\
    \ | --- | ---: |\n| 990001 | 计算机文化基础 | 82 |\n| 990001 | 高等数学 | 76 |\n| 990002\
    \ | 计算机文化基础 | 90 |\n| 990101 | 高等数学 | 77 |\n| 990102 | 计算机文化基础 | 68 |\n| 990102\
    \ | C/C++程序设计 | 85 |\n| 990102 | 大学英语 | 86 |\n| 990201 | 高等数学 | 87 |\n| 990201\
    \ | 高等数学 | 67 |\n| 990202 | 计算机导论 | 53 |\n| 990203 | 英语 | 71 |\n| 990204 | 计算机导论\
    \ | 66 |\n| 990204 | 高等数学 | 75 |\n| 990204 | 英语 | 82 |\n\n- 打开Student.mdb数据库\n\
    - 选择使用向导创建报表\n- 选定表“学生成绩表”及所有字段\n- 决定是否分组（本例不分组）\n- 选择排序方式（本例按学号）\n- 选择表格布局方式\n\
    - 选择报表样式（本例为“组织”）\n- 输入报表名称：Scores1\n"
