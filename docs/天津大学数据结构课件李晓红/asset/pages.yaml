- pgno: 377
  md: '+   辅助数组 visited [] 的初始状态为 0，在图的遍历过程中，一旦某一个顶点 i 被访问，就立即让 visited [i] 为 1，防止它被多次访问。


    +   两种图的遍历方法：


    +   深度优先搜索

    +   DFS (Depth First Search)


    +   广度优先搜索

    +   BFS (Breadth First Search)'
