- pgno: 423
  md: '+   在邻接表中增设一个数组 `count[]`，记录各顶点入度。入度为零的顶点即无前驱顶点。


    +   在输入数据前，顶点表 `VexList[]` 和入度数组 `count[]` 全部初始化。在输入数据时，每输入一条边 `<j, k>`，就需要建立一个边结点，并将它链入相应边链表中，统计入度信息：


    ```

    EdgeNode * p = new EdgeNode;  // 建立边结点

    p->dest = k;

    p->link = G.VexList[j].firstAdj;

    VexList[j].firstAdj = p;  // 链入顶点 j 的边链表的前端

    count[k]++;  // 顶点 k 入度加一

    ```'
