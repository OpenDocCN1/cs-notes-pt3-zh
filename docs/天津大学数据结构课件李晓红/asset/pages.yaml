- pgno: 549
  md: '# 插入排序（Insert Sorting）


    **基本思想** 每步将一个待排序的对象，按其排序码大小，插入到前面已经排好序的一组对象的适当位置上，直到对象全部插入为止。


    # 直接插入排序（Insert Sort）


    +   - **基本思想** 当插入第 i（i ≥ 1）个对象时，前面的 V[0]，V[1]，…，V[i-1] 已经排好序。这时，用 V[i] 的排序码与
    V[i-1]，V[i-2]，…的排序码顺序进行比较，找到插入位置即将 V[i] 插入，原来位置上的对象向后顺移。'
  merge: -1
  img_proc: true
