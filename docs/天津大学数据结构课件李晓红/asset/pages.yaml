- pgno: 332
  md: '# # 霍夫曼树


    +   - 带权路径长度达到最小的二叉树即为霍夫曼树。


    +   - 在霍夫曼树中，权值大的结点离根最近。


    # # 霍夫曼算法


    (1) 由给定的 n 个权值 {w₀, w₁, w₂, ..., wₙ₋₁}，构造具有 n 棵扩充二叉树的森林 F = { T₀, T₁, T₂, ...,
    Tₙ₋₁ }，其中每棵扩充二叉树 Tᵢ 只有一个带权值 wᵢ 的根结点，其左、右子树均为空。'
  merge: -1
  img_proc: true
- pgno: 333
  md: '(2) 重复以下步骤，直到 F 中仅剩下一棵树为止：


    +   1. 在 F 中选取两棵根结点的权值最小的扩充二叉树，做为左、右子树构造一棵新的二叉树。置新的二叉树的根结点的权值为其左、右子树上根结点的权值之和。

    +   2. 在 F 中删去这两棵二叉树。

    +   3. 把新的二叉树加入 F。'
  merge: -1
  img_proc: true
