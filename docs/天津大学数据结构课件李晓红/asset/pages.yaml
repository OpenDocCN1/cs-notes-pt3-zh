  md: "# # Dijkstra算法\n\n+   ① 初始化： \\( S \\leftarrow \\{ v_0 \\} \\); \n+   \\( \\\
    text{dist}[j] \\leftarrow \\text{Edge}[0][j], \\quad j = 1, 2, \\ldots, n-1 \\\
    ); \n+   // \\( n \\) 为图中顶点个数\n\n+   ② 求出最短路径的长度： \n+   \\( \\text{dist}[k] \\\
    leftarrow \\min \\{ \\text{dist}[i] \\}, \\quad i \\in V - S \\); \n+   \\( S\
    \ \\leftarrow S \\cup \\{ k \\} \\);\n\n+   ③ 修改： \n+   \\( \\text{dist}[i] \\\
    leftarrow \\min\\{ \\text{dist}[i], \\text{dist}[k] + \\text{Edge}[k][i] \\},\
    \ \\) \n+   对于每一个 \\( i \\in V - S \\);\n\n+   ④ 判断： 若 \\( S = V \\)，则算法结束，否则转\
    \ ②。"
  merge: -1
