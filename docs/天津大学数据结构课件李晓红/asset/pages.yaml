- pgno: 453
  md: '# 查找


    根据给定的某个值，在查找表中确定一个其关键字等于给定值的数据元素或（记录）。


    若查找表中存在这样一个记录，则称“查找成功”，查找结果：给出整个记录的信息，或指示该记录在查找表中的位置；


    否则称“查找不成功”，查找结果：给出“空记录”或“空指针”。'
