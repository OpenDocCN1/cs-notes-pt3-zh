- pgno: 416
  md: '+   可以用有向图表示一个工程。在这种有向图中，用顶点表示活动，用有向边<V<sub>i</sub>, V<sub>j</sub>>表示活动V<sub>i</sub>必须先于活动V<sub>j</sub>进行。这种有向图叫做顶点表示活动的AOV网络（Activity
    On Vertices）。


    +   在AOV网络中不能出现有向回路，即有向环。如果出现了有向环，则意味着某项活动应以自己作为先决条件。


    +   因此，对给定的AOV网络，必须先判断它是否存在有向环。'
  merge: -1
  img_proc: true
- pgno: 417
  md: '+   检测有向环的一种方法是对AOV网络构造它的拓扑有序序列。即将各个顶点（代表各个活动）排列成一个线性有序的序列，使得AOV网络中所有应存在的前驱和后继关系都能得到满足。


    +   这种构造AOV网络全部顶点的拓扑有序序列的运算就叫做拓扑排序。


    +   如果通过拓扑排序能将AOV网络的所有顶点都排入一个拓扑有序的序列中，则该网络中必定不会出现有向环。'
  merge: -1
  img_proc: true
- pgno: 418
  md: '+   如果AOV网络中存在有向环，此AOV网络所代表的工程是不可行的。


    +   例如，对学生选课工程图进行拓扑排序，得到的拓扑有序序列为


    C1，C2，C3，C4，C5，C6，C8，C9，C7


    或 C1，C8，C9，C2，C5，C3，C4，C7，C6


    ![](img/04e8ddadedb998b3013c751f1cd77a21_418_0.png)'
  merge: -1
