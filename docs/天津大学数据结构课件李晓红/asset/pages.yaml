- pgno: 425
  md: '# # 拓扑排序的算法


    ```

    void TopologicalSort (AdjGraph G) {

    Stack S; StackEmpty(S); int j;

    //入度为零的顶点栈初始化

    for ( int i = 0; i < n; i++ ) //入度为零顶点

    if ( count[i] == 0 ) Push(S, i); //进栈

    for ( i = 0; i < n; i++ ) //期望输出 n 个顶点

    if ( StackEmpty(S) ) { //中途栈空,转出

    cout << “网络中有回路！" << endl;

    return;

    }

    ```'
  merge: -1
  img_proc: true
