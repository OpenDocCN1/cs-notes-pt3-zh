- pgno: 566
  md: "# 起泡排序的算法\n\n```\ntypedef int SortData;\n\nvoid BubbleSort ( SortData V[ ],\
    \ int n ) {\n    int i = 1;\n    int exchange = 1;\n    while ( i < n && exchange\
    \ ){\n        exchange = 0;  //标志置为0,假定未交换\n        for ( int j = n-1; j >= i;\
    \ j— )\n            if ( V[j-1] > V[j] ) {  //逆序\n                Swap ( V[j-1],\
    \ V[j] ); //交换\n                exchange = 1;  //标志置为1,有交换\n            }\n  \
    \      i++;\n    }\n}\n```\n\n思考题：如何实现双起泡"
  merge: -1
  img_proc: true
- pgno: 567
  md: '+   - 第i趟对待排序对象序列 V[i−1], V[i], …, V[n−1] 进行排序，结果将该序列中排序码最小的对象交换到序列的第一个位置(i−1)，其它对象也都向排序的最终位置移动。

    +   - 最多做n−1趟起泡就能把所有对象排好序。

    +   - 在对象的初始排列已经按排序码从小到大排好序时，此算法只执行一趟起泡，做n−1次排序码比较，不移动对象。这是最好的情形。'
  merge: -1
  img_proc: true
- pgno: 568
  md: '+   - 最坏的情形是算法执行 n−1 趟起泡，第 i 趟（1≤i<n）做 n−i 次排序码比较，执行 n−i 次对象交换。这样在最坏情形下总的排序码比较次数
    KCN 和对象移动次数 RMN 为：


    $$KCN=\sum_{i=1}^{n-1}(n-i)=\frac{1}{2}n(n-1)$$


    $$RMN=3\sum_{i=1}^{n-1}(n-i)=\frac{3}{2}n(n-1)$$


    +   - 起泡排序是一个稳定的排序方法。'
  merge: -1
  img_proc: true
- pgno: 569
  md: '# # 快速排序 (Quick Sort)


    基本思想是任取待排序对象序列中的某个对象（例如取第一个对象）作为基准，按照该对象的排序码大小，将整个对象序列划分为左右两个子序列：


    +   - 左侧子序列中所有对象的排序码都小于或等于基准对象的排序码


    +   - 右侧子序列中所有对象的排序码都大于基准对象的排序码'
  merge: -1
  img_proc: true
- pgno: 570
  md: '+   - 基准对象则排在这两个子序列中间(这也是该对象最终应安放的位置)。

    +   - 然后分别对这两个子序列重复施行上述方法，直到所有的对象都排在相应位置上为止。

    +   - 基准对象也称为**枢轴（或支点）记录**。'
  merge: -1
  img_proc: true
