- pgno: 239
  md: '若 $i\le j$，数组元素 $A[i][j]$ 在数组 $B$ 中的存放位置为


    $n+(n-1)+(n-2)+\cdots+(n-i+1)+j-i$


    $=(2*n-i+1)*i/2+j-i$


    $=(2*n-i-1)*i/2+j$


    若 $i>j$，数组元素 $A[i][j]$ 在矩阵的下三角部分，在数组 $B$ 中没有存放。因此，找它的对称元素 $A[j][i]$。


    $A[j][i]$ 在数组 $B$ 的第 $(2*n-j-1)*j/2+i$ 的位置中找到。'
