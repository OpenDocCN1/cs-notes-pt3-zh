    \ \\( RMN = 0 \\)，达到最少。\n+   \n+   最坏情况是每一趟都要进行交换，总的对象移动次数为 \\( RMN = 3(n-1) \\\
    )。\n+   \n+   直接选择排序是一种不稳定的排序方法。"
