- pgno: 30
  md: '# # 时间复杂度量


    +   - 运行时间 = 算法中每条语句执行时间之和。

    +   - 每条语句执行时间 = 该语句的执行次数（频度）* 语句执行一次所需时间。

    +   - 语句执行一次所需时间取决于机器的指令性能和速度和编译所产生的代码质量，很难确定。

    +   - 设每条语句执行一次所需时间为单位时间，则一个算法的运行时间就是该算法中所有语句的频度之和。'
  merge: -1
  img_proc: true
