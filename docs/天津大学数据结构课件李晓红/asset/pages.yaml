- pgno: 397
  md: '# 普里姆(Prim)算法


    +   - 普里姆算法的基本思想：从连通网络 N = {V, E} 中的某一顶点 u₀ 出发，选择与它关联的具有最小权值的边（u₀, v），将其顶点加入到生成树顶点集合
    U 中。以后每一步从一个顶点在 U 中，而另一个顶点不在 U 中的各条边中选择权值最小的边 (u, v)，把它的顶点加入到集合 U 中。如此继续下去，直到网络中的所有顶点都加入到生成树顶点集合
    U 中为止。


    +   - 采用邻接矩阵作为图的存储表示。'
  merge: -1
  img_proc: true
