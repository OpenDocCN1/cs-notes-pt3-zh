- pgno: 520
  md: '# # 数字分析法


    假设关键字集合中的每个关键字都是由 s 位数字组成 (u₁, u₂, ..., uₛ)，分析关键字集中的全体，并从中提取分布均匀的若干位或它们的组合作为地址。此法适于能预先估计出全体关键字的每一位上各种数字出现的频度。


    例 有80个记录，关键字为8位十进制数，哈希地址为2位十进制数


    ①②③④⑤⑥⑦⑧


    8 1 3 4 6 5 3 2

    8 1 3 7 2 2 4 2

    8 1 3 8 7 4 2 2

    8 1 3 0 1 3 6 7

    8 1 3 2 2 8 1 7

    8 1 3 3 8 9 6 7

    8 1 3 6 8 5 3 7

    8 1 4 1 9 3 5 5


    分析：①只取8 ②只取1 ③只取3、4 ④只取2、7、5 ④⑤⑥⑦数字分布近乎随机 所以：取④⑤⑥⑦任意两位或两位与另两位的叠加作哈希地址'
  merge: -1
  img_proc: true
- pgno: 521
  md: '# 平方取中法


    以关键字的平方值的中间几位作为存储地址。求“关键字的平方值”的目的是“扩大差别”，同时平方值的中间各位又能受到整个关键字中各位的影响。


    此方法适合于：


    +   - 关键字中的每一位都有某些数字重复出现频度很高的现象。'
  merge: -1
