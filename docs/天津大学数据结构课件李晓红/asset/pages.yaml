  md: '# # 归并排序 (Merge Sort)


    +   归并将两个或两个以上的有序表合并成一个新的有序表。


    +   两路归并 (2-way merging)原始序列initList[ ]中两个有序表 initList[l] ... initList[m]和initList[m+1]
    ... initList[n]，它们可归并成一个有序表，存于另一对象序列mergedList的 l ... n 中。'
  merge: -1
  img_proc: true
- pgno: 609
  md: '![](img/04e8ddadedb998b3013c751f1cd77a21_609_0.png)


    +   设变量 i 和 j 是表initList[l ... m]和initList [m+1... n]的当前检测指针。 k 是存放指针。


    +   当 i 和 j 都在两个表的表长内变化时，根据对应项的排序码的大小，依次把排序码小的对象排放到新表 k 所指位置中；

    +   当 i 与 j 中有一个已经超出表长时，将另一个表中的剩余部分照抄到新表中。'
  merge: -1
  img_proc: true
- pgno: 610
  md: '# # 两路归并算法


    ```

    typedef int SortData;

    void merge ( SortData InitList[ ], SortData mergedList[ ],

    int left, int mid, int right ) {

    int i = left, j = mid+1, k = left;

    while ( i <= mid && j <= right ) //两两比较将较小的并入

    if ( InitList[i] <= InitList[j] )

    { mergedList [k] = InitList[i]; i++; k++; }

    else

    { mergedList [k] = InitList[j]; j++; k++; }

    while ( i <= mid )

    { mergedList[k] = InitList[i]; i++; k++; } //将mid前剩余

    的并入

    while ( j <= right )

    { mergedList[k] = InitList[j]; j++; k++; } //将mid后剩

    余的并入

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 611
  md: '# # 一趟归并排序的情形


    +   设initList[0]到initList[n-1]中 n 个对象已经分为一些长度为 len 的归并项，将这些归并项两两归并，归并成长度为 2len
    的归并项，结果放到mergedList[ ]中。


    +   如果n不是2len的整数倍，则一趟归并到最后，可能遇到两种情形：


    +   剩下一个长度为len的归并项和另一个长度不足len的归并项，可用merge算法将它们归并成一个长度小于 2len 的归并项。


    +   只剩下一个归并项，其长度小于或等于len，将它直接抄到MergedList[ ]中。'
  merge: -1
  img_proc: true
- pgno: 612
  md: '# # 迭代的归并排序算法


    +   - 迭代的归并排序算法就是利用两路归并过程进行排序的。其基本思想是：


    +   - 假设初始对象序列有 n 个对象，首先把它看成是 n 个长度为 1 的有序子序列（归并项），先做两两归并，得到「n / 2」个长度为 2 的归并项（如果
    n 为奇数，则最后一个有序子序列的长度为1）；再做两两归并，...，如此重复，最后得到一个长度为 n 的有序序列。'
  merge: -1
  img_proc: true
