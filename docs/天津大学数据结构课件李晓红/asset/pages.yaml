  md: '# 解题思路


    +   - 安放第 i 行皇后时，需要在列的方向从 0 到 n-1 试探（j = 0, …, n-1）

    +   - 在第 j 列安放一个皇后：

    +     - 如果在列、主对角线、次对角线方向有其它皇后，则出现攻击，撤消在第 j 列安放的皇后。

    +     - 如果没有出现攻击，在第 j 列安放的皇后不动，递归安放第 i+1 行皇后。'
