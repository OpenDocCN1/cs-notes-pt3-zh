  md: '```

    int String :: Find ( String& pat ) const {

    //穷举的模式匹配

    for ( int i = 0; i <= curLen-pat.curLen;

    i++ )

    {

    //逐趟比较

    int j = 0; //从ch[i]与模式pat.ch比较

    while ( j < pat.curLen )

    if ( ch[i+j] == pat.ch[j] ) j++;

    else break;

    if ( j == pat.curLen ) return i;

    //pat扫描完, 匹配成功

    }

