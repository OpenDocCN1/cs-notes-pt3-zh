- pgno: 617
  md: '# # 基数排序


    # ## ·多关键字排序


    例 对52张扑克牌按以下次序排序：

    ♣2<♣3<......<♣A<♦2<♦3<......<♦A<

    ♥2<♥3<......<♥A<♠2<♠3<......<♠A

    两个关键字： 花色 （ ♣<♦<♥<♠ ）

    面值 （2<3<......<A）

    并且 “花色” 地位高于 “面值”


    # ## ·多关键字排序方法


    最高位优先法（MSD）： 先对最高位关键字k1（如花色）排序，将序列分成若干子序列，每个子序列有相同的k1值；然后让每个子序列对次关键字k2（如面值）排序，又分成若干更小的子序列；依次重复，直至就每个子序列对最低位关键字kd排序；最后将所有子序列依次连接在一起成为一个有序序列'
  merge: -1
  img_proc: true
- pgno: 618
  md: '最低位优先法(LSD)：从最低位关键字kd起进行排序，然后再对高一位的关键字排序，……依次重复，直至对最高位关键字k1排序后，便成为一个有序序列


    # 链式基数排序


    +   基数排序：借助“分配”和“收集”对单逻辑关键字进行排序的一种方法


    +   链式基数排序方法：用链表作存储结构的基数排序


    +   设置10个队列，f[i]和e[i]分别为第i个队列的头指针和尾指针


    +   第一趟分配对最低位关键字（个位）进行，改变记录的指针值，将链表中记录分配至10个链队列中，每个队列记录的关键字的个位相同'
  merge: -1
  img_proc: true
- pgno: 619
  md: '+   - 第一趟收集是改变所有非空队列的队尾记录的指针域，令其指向下一个非空队列的队头记录，重新将10个队列链成一个链表

    +   - 重复上述两步，进行第二趟、第三趟分配和收集，分别对十位、百位进行，最后得到一个有序序列'
  merge: -1
  img_proc: true
