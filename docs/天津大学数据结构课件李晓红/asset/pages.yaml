  md: "# 堆排序的算法\n\n```\nvoid HeapSort ( MaxHeap *H ) {\n//对表heap[0]到heap[n-1]进行排序，使得表中\n\
    //各个对象按其排序码非递减有序。\n    for ( int i = ( H->CSize-2 ) / 2; i >= 0; i-- )\n     \
    \   FilterDown ( H, i, H->CSize-1 );  //初始堆\n    for ( i = H->CSize-1; i >= 1;\
    \ i-- ) {\n        Swap ( H->data[0], H->data[i] );  //交换\n        FilterDown\
    \ ( H, 0, i-1 );         //重建最大堆\n    }\n}\n```"
