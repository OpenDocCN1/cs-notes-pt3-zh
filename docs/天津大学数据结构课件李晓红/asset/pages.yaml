- pgno: 616
  md: '+   在迭代的归并排序算法中，函数MergePass()做一趟两路归并排序，要调用merge（）函数「n/(2*len)」≈ O(n/len) 次，函数MergeSort()调用MergePass()正好「log<sub>2</sub>n」次，而每次merge（）要执行比较O(len)次，所以算法总的时间复杂度为O(nlog<sub>2</sub>n)。


    +   归并排序占用附加存储较多，需要另外一个与原待排序对象数组同样大小的辅助数组。这是这个算法的缺点。


    +   归并排序是一个稳定的排序方法。'
