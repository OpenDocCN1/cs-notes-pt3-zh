- pgno: 558
  md: '# # 算法分析


    +   - 折半搜索比顺序搜索查找快，所以折半插入排序就平均性能来说比直接插入排序要快。

    +   - 它所需的排序码比较次数与待排序对象序列的初始排列无关，仅依赖于对象个数。 在插入第 i 个对象时，需要经过⌊log₂i⌋+1 次排序码比较，才能确定它应插入的位置。
    因此，将 n 个对象(为推导方便，设为 n=2ᵏ)用折半插入排序所进行的排序码比较次数为：


    \(\sum_{i=1}^{n-1}(\lfloor\log_2 i\rfloor+1) \approx n \cdot \log_2 n\)'
  merge: -1
  img_proc: true
- pgno: 559
  md: '+   - 当 n 较大时，总排序码比较次数比直接插入排序的最坏情况要好得多，但比其最好情况要差。

    +   - 在对象的初始排列已经按排序码排好序或接近有序时，直接插入排序比折半插入排序执行的排序码比较次数要少。折半插入排序的对象移动次数与直接插入排序相同，依赖于对象的初始排列。

    +   - 折半插入排序是一个稳定的排序方法。

    +   - 折半插入排序的时间复杂度为o(n²)。'
  merge: -1
  img_proc: true
- pgno: 560
  md: '# # 希尔排序（Shell Sort）


    基本思想设待排序对象序列有 n 个对象，首先取一个整数 gap < n 作为间隔，将全部对象分为 gap 个子序列，所有距离为 gap 的对象放在同一个子序列中，在每一个子序列中分别施行直接插入排序。然后缩小间隔
    gap，例如取 gap = ⌈gap/2⌉，重复上述的子序列划分和排序工作。直到最后取 gap == 1，将所有对象放在同一个序列中排序为止。


    希尔排序方法又称为缩小增量排序。'
  merge: -1
  img_proc: true
