- pgno: 614
  md: '```

    void MergePass ( SortData initList[ ], SortData

    mergedList[ ], int len ) {

    int i = 0;

    while (i+2*len-1 <= n-1) {

    merge( initList, mergedList,

    i, i+len-1, i+2*len-1);

    i += 2 * len; //循环两两归并

    }

    if ( i+len <= n-1 )

    merge( initList, mergedList, i, i+len-1, n-1);

    else for ( int j = i; j <= n-1; j++)

    mergedList [j] = initList[j];

    }

    ```'
  merge: -1
  img_proc: true
