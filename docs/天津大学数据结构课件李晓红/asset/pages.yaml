  md: "# C语言描述\n\n```\nint Search_Bin(SSTable ST,KeyType key)\n{ // 在有序表ST中折半查找其关键字等于key的数据元素。若找到，则函数值为\n\
    \    // 该元素在表中的位置，否则为0。算法9.2\n    int low,high,mid;\n    low=1; // 置区间初值\n   \
    \ high=ST.length;\n    while(low<=high)\n    {\n        mid=(low+high)/2;\n  \
    \      if EQ(key,ST.elem[mid].key)  // 找到待查元素\n            return mid;\n     \
    \   else if LT(key,ST.elem[mid].key)\n            high=mid-1; // 继续在前半区间进行查找\n\
    \        else\n            low=mid+1; // 继续在后半区间进行查找\n    }\n    return 0; //\
    \ 顺序表中不存在待查元素\n}\n```"
