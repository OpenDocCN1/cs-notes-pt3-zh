  md: '# ## 算法


    ```

    #include <iostream.h>

    #include "strclass.h"

    void Hanoi (int n, String A, String B, String C) {

    //解决汉诺塔问题的算法

    if ( n == 1 ) printf (" move %s",A, " to %s",C);

    else { Hanoi ( n-1, A, C, B );

    printf (" move %s",A, " to %s",C);

    Hanoi ( n-1, B, A, C );

    }

    }

    ```'
