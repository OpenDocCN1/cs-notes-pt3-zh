- pgno: 428
  md: '+   为缩短完成工程所需的时间，应当加快哪些活动？


    +   从源点到各个顶点，以至从源点到汇点的有向路径可能不止一条。 这些路径的长度也可能不同。 完成不同路径的活动所需的时间虽然不同，但只有各条路径上所有活动都完成了，整个工程才算完成。


    +   因此，完成整个工程所需的时间取决于从源点到汇点的最长路径长度，即在这条路径上所有活动的持续时间之和。 这条路径长度最长的路径就叫做关键路径(Critical
    Path)。'
  merge: -1
  img_proc: true
- pgno: 429
  md: '+   要找出关键路径，必须找出关键活动，即不按期完成就会影响整个工程完成的活动。

    +   关键路径上的所有活动都是关键活动。因此，只要找到了关键活动，就可以找到关键路径。例如，下图就是一个AOE网。


    ![](img/04e8ddadedb998b3013c751f1cd77a21_429_0.png)'
  merge: -1
  img_proc: true
- pgno: 430
  md: "# 定义几个与计算关键活动有关的量：\n\n+   ① 事件 V_i 的最早可能开始时间 Ve(i)\n+   是从源点 V_0 到顶点 V_i 的最长路径长度。\n\
    \n+   ② 事件 V_i 的最迟允许开始时间 Vl[i]\n+   是在保证汇点 V_{n-1} 在 Ve[n-1] 时刻完成的前提下，事件 V_i 的允许的最迟开始时间。\n\
    \n+   ③ 活动 a_k 的最早可能开始时间 e[k]\n+   设活动 a_k 在边 <V_i, V_j> 上，则 e[k] 是从源点 V_0 到顶点\
    \ V_i 的最长路径长度。因此，\n+   \n+   e[k] = Ve[i]。\n\n+   ④ 活动 a_k 的最迟允许开始时间 l[k]"
  merge: -1
  img_proc: true
- pgno: 431
  md: 'l[k]是在不会引起时间延误的前提下，该活动允许的最迟开始时间。


    l[k] = Vl[j] - dur(<i, j>)。


    其中，dur(<i, j>)是完成 a<sub>k</sub> 所需的时间。


    # ⑤ 时间余量 l[k] - e[k]


    表示活动 a<sub>k</sub> 的最早可能开始时间和最迟允许开始时间的时间余量。l[k] == e[k] 表示活动 a<sub>k</sub> 是没有时间余量的关键活动。


    +   为找出关键活动，需要求各个活动的 e[k] 与 l[k]，以判别是否 l[k] == e[k]。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '+   为求得 $e[k]$ 与 $l[k]$，需要先求得从源点 $V_0$ 到各个顶点 $V_i$ 的 $Ve[i]$ 和 $Vl[i]$。


    +   求 $Ve[i]$ 的递推公式


    +   从 $Ve[0]=0$ 开始，向前递推


    $$Ve[i]=\max_j\{Ve[j]+dur(\langle V_j,V_i\rangle)\},\quad \langle V_j,V_i\rangle\in
    S2,\quad i=1,2,\ldots,n-1$$


    $S2$ 是所有指向 $V_i$ 的有向边 $\langle V_j,V_i\rangle$ 的集合。


    +   从 $Vl[n-1]=Ve[n-1]$ 开始，反向递推


    $$Vl[i]=\min_j\{Vl[j]-dur(\langle V_i,V_j\rangle)\},\quad \langle V_i,V_j\rangle\in
    S1,\quad i=n-2,n-3,\ldots,0$$


    $S1$ 是所有源自 $V_i$ 的有向边 $\langle V_i,V_j\rangle$ 的集合。'
  merge: -1
  img_proc: true
- pgno: 433
  md: "+   这两个递推公式的计算必须分别在拓扑有序及逆拓扑有序的前提下进行。\n\n+   设活动 $a_k\\ (k=1,2,\\ldots,e)$ 在带权有向边\
    \ $<V_i,V_j>$ 上，其持续时间用 $dur(<V_i,V_j>)$ 表示，则有：\n+   \n+   $$\n+   e[k] = Ve[i];\n\
    +   $$\n+   \n+   $$\n+   l[k] = Vl[j] - dur(<V_i,V_j>);\\quad k=1,2,\\ldots,e\n\
    +   $$\n+   \n+   这样就得到计算关键路径的算法。\n\n+   为了简化算法，假定在求关键路径之前已经对各顶点实现了拓扑排序，并按拓扑有序的顺序对各顶点重新进行了编号。"
  merge: -1
  img_proc: true
- pgno: 434
