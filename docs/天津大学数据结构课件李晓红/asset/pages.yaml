- pgno: 419
  md: '# # 拓扑排序的方法


    +   ① 输入AOV网络。令 n 为顶点个数。

    +   ② 在AOV网络中选一个没有直接前驱的顶点，并输出之；

    +   ③ 从图中删去该顶点，同时删去所有它发出的有向边；

    +   ④ 重复以上 ②、③步，直到

    +   ➤ 全部顶点均已输出，拓扑有序序列形成，拓扑排序完成； 或

    +   ➤ 图中还有未输出的顶点，但已跳出处理循环。说明图中还剩下一些顶点，它们都有直接前驱。这时网络中必存在有向环。'
