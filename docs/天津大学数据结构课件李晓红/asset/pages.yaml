  md: '+   - 引入辅助数组dist。它的每一个分量dist[i]表示当前找到的从源点 v<sub>0</sub>到终点 v<sub>i</sub> 的最短路径的长度。初始状态：

    +       - 若从源点v<sub>0</sub>到顶点 v<sub>i</sub> 有边，则dist[i]为该边上的权值；

    +       - 若从源点v<sub>0</sub>到顶点 v<sub>i</sub> 无边，则dist[i]为∞。

    +   - 假设 S 是已求得的最短路径的终点的集合，则可证明： 下一条最短路径必然是从v<sub>0</sub>出发，中间只经过 S 中的顶点便可到达的那些顶点v<sub>x</sub>
    (v<sub>x</sub>∈V-S ) 的路径中的一条。

    +   - 每次求得一条最短路径后，其终点v<sub>k</sub> 加入集合 S， 然后对所有的v<sub>i</sub> ∈V-S， 修改其 dist[i]值。'
