- pgno: 586
  md: '# # 堆排序( Heap sort )


    堆（ Heap ）设有一个关键字集合，按完全二叉树的顺序存储方式存放在一个一维数组中。对它们从根开始，自顶向下，同一层自左向右从 0开始连续编号。若满足


    K<sub>i</sub> ≤ K<sub>2i+1</sub> && K<sub>i</sub> ≤ K<sub>2i+2</sub>


    或 K<sub>i</sub> ≥ K<sub>2i+1</sub> && K<sub>i</sub> ≥ K<sub>2i+2</sub>,


    则称该关键字集合构成一个堆。


    前者成为最小堆，后者称为最大堆。'
