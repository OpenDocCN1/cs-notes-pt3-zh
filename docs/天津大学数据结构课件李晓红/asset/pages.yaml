- pgno: 553
  md: '# # 算法分析


    +   - 设待排序对象个数为 n，则该算法的主程序执行 n-1 趟。

    +   - 排序码比较次数和对象移动次数与对象排序码的初始排列有关。

    +   - 最好情况下，排序前对象已按排序码从小到大有序，每趟只需与前面有序对象序列的最后一个对象比较1次，移动2次对象，总的排序码比较次数为 n-1，对象移动次数为
    2(n-1)。'
  merge: -1
  img_proc: true
- pgno: 554
  md: "+   - 最坏情况下，第 \\(i\\) 趟时第 \\(i\\) 个对象必须与前面 \\(i\\) 个对象都做排序码比较，并且每做1次比较就要做1次数据移动。则总排序码比较次数\
    \ KCN 和对象移动次数 RMN 分别为：\n+   \n+     \\[\n+     KCN = \\sum_{i=1}^{n-1} i = n(n-1)/2\
    \ \\approx n^2/2,\n+     \\]\n+   \n+     \\[\n+     RMN = \\sum_{i=1}^{n-1} (i+2)\
    \ = (n+4)(n-1)/2 \\approx n^2/2\n+     \\]\n\n+   - 在平均情况下的排序码比较次数和对象移动次数约为 \\\
    (n^2/4\\)。因此，直接插入排序的时间复杂度为 \\(O(n^2)\\)。\n\n+   - 直接插入排序是一种稳定的排序方法。"
  merge: -1
  img_proc: true
- pgno: 555
  md: '# # 折半插入排序 (Binary Insertsort)


    基本思想 设在顺序表中有一 个对象序列 V[0], V[1], ..., V[n-1]。其中，V[0], V[1], ..., V[i-1] 是已经排好序的对象。在插入V[i]
    时，利用折半搜索法寻找V[i] 的插入位置。


    # ## 折半插入排序的算法'
  merge: -1
  img_proc: true
- pgno: 556
  md: "```\ntypedef int SortData;\nvoid BinInsSort ( SortData V[ ], int n ) {\n  \
    \  SortData temp; int Left, Right;\n    for ( int i = 1; i < n; i++ ) {\n    \
    \    Left = 0; Right = i-1; temp = V[i];\n        while ( Left <= Right ) {\n\
    \            int mid = ( Left + Right )/2;\n            if ( temp < V[mid] ) Right\
    \ = mid - 1;\n            else Left = mid + 1;\n        }\n        for ( int k\
    \ = i-1; k >= Left; k-- ) V[k+1] = V[k];//记录后移\n        V[Left] = temp; //插入\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
