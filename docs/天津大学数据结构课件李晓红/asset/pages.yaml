  md: "# 优先级队列部分成员函数的实现\n\n```\n```cpp\ntemplate <class Type>\nPQueue<Type>::PQueue\
    \ ( ) : count (-1) {\n    pqelements = new Type[maxPQSize];\n    assert ( pqelements\
    \ != 0 ); //分配断言\n}\n```\n```\n\n```\n```cpp\ntemplate <class Type> void PQueue<Type>::\n\
    PQInsert ( const Type & item ) {\n    assert ( !IsFull ( ) );           //判队满断言\n\
