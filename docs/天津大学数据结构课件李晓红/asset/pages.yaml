- pgno: 185
  md: '# 问题的解法是递归的


    例如，汉诺塔(Tower of Hanoi)问题的解法：

    如果 n = 1，则将这一个盘子直接从 A 柱移到 C 柱上。否则，执行以下三步：

    ① 用 C 柱做过渡，将 A 柱上的 (n-1) 个盘子移到 B 柱上：

    ② 将 A 柱上最后一个盘子直接移到 C 柱上；

    ③ 用 A 柱做过渡，将 B 柱上的 (n-1) 个盘子移到 C 柱上。'
  merge: -1
  img_proc: true
