- pgno: 581
  md: '# # 直接选择排序 (Select Sort)


    直接选择排序是一种简单的排序方法，它的基本步骤是：


    +   ① 在一组对象 V[i]～V[n-1] 中选择具有最小排序码的对象；


    +   ② 若它不是这组对象中的第一个对象，则将它与这组对象中的第一个对象对调；


    +   ③ 在这组对象中剔除这个具有最小排序码的对象。在剩下的对象V[i+1]～V[n-1]中重复执行第①、②步，直到剩余对象只有一个为止。'
  merge: -1
  img_proc: true
