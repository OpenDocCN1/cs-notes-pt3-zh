- pgno: 263
  md: '性质2　深度为 $k$ 的二叉树至多有 $2^k-1$ 个结点（$k\geq1$）。


    证明：由性质1可见，深度为 $k$ 的二叉树的最大结点数为


    $$\sum_{i=1}^{k}\text{（第 }i\text{ 层上的最大结点数）}$$


    $$=\sum_{i=1}^{k}2^{i-1}=2^0+2^1+\cdots+2^{k-1}=2^k-1$$'
  merge: -1
  img_proc: true
- pgno: 264
  md: '性质3　对任何一棵二叉树T，如果其叶结点数为 $n_0$，度为2的结点数为 $n_2$，则 $n_0=n_2+1$。


    证明：若度为1的结点有 $n_1$ 个，总结点个数为 $n$，总边数为 $e$，则根据二叉树的定义，


    $$n=n_0+n_1+n_2 \qquad e=2n_2+n_1=n-1$$


    因此，有 $2n_2+n_1=n_0+n_1+n_2-1$


    $$n_2=n_0-1 \quad\Longrightarrow\quad n_0=n_2+1$$'
  merge: -1
