  md: "# # 霍夫曼树 (Huffman Tree)\n\n# ## 路径长度 (Path Length)\n\n两个结点之间的路径长度 PL 是连接两结点的路径上的分支数。\
    \  \n树的外部路径长度是各叶结点(外结点)到根结点的路径长度之和 EPL。  \n树的内部路径长度是各非叶结点(内结点)到根结点的路径长度之和 IPL。\
    \  \n树的路径长度 PL = EPL + IPL"
