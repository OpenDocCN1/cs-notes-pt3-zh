- pgno: 455
  md: '# # 查找方法评价


    +   - 查找速度

    +   - 占用存储空间多少

    +   - 算法本身复杂程度

    +   - 平均查找长度ASL(Average Search Length): 为确定记录在表中的位置，需和给定值进行比较的关键字的个数的期望值叫查找算法的~


    对含有\(n\)个记录的表，\(ASL = \sum_{i=1}^n p_i c_i\)


    其中：\(p_i\)为查找表中第\(i\)个元素的概率，\(\sum_{i=1}^n p_i = 1\)


    \(c_i\)为找到表中第\(i\)个元素所需比较次数'
