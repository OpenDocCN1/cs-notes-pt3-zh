- pgno: 528
  md: "# 对增量 d<sub>i</sub> 的三种取法：\n\n+   1) 线性探测再散列\n+   \n+   d<sub>i</sub> = c×\
    \ i　最简单的情况　c=1\n\n+   2) 二次探测再散列\n+   \n+   d<sub>i</sub> = 1<sup>2</sup>, -1<sup>2</sup>,\
    \ 2<sup>2</sup>, -2<sup>2</sup>, ....\n\n+   3) 随机探测再散列\n+   \n+   d<sub>i</sub>\
    \ 是一组伪随机数列　或者\n+   \n+   d<sub>i</sub>=i× H<sub>2</sub>(key) (又称双散列函数探测)"
  merge: -1
  img_proc: true
- pgno: 529
  md: "注意：增量 d<sub>i</sub> 应具有 “完备性”  \n即：产生的 H<sub>i</sub> 均不相同，且所产生的  \ns(m-1)个\
    \ H<sub>i</sub> 值能覆盖哈希表中所有  \n地址。则要求：\n\n+   ※ 平方探测时的表长 m 必为形如 4j+3 的素数（如：7, 11,\
    \ 19, 23, ... 等）；\n\n+   ※ 随机探测时的 m 和 d<sub>i</sub> 没有公因子。"
