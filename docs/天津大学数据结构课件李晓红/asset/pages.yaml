  md: '# 树的概念和基本术语


    # 树的定义


    树是由 n（n ≥ 0）个结点的有限集合。如

    果 n = 0，称为空树；如果 n > 0，则


    +   - 有且仅有一个特定的称之为根(Root)的结点，它只有直接后继，但没有直接前驱；


    +   - 当 n > 1，除根以外的其它结点划分为 m（m > 0）个互不相交的有限集 T₁、T₂、…、Tₘ，其中每个集合本身又是一棵树，并且称为根的子树(SubTree)。'
