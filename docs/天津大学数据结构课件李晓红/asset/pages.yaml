- pgno: 462
  md: '# 顺序查找性能分析


    # 查找算法的平均查找长度（Average Search Length）：


    为确定记录在查找表中的位置，需和给定值进行比较的关键字个数的期望值。


    $$ASL=\sum_{i=1}^{n}P_iC_i$$


    其中：n 为表长


    $P_i$ 为查找表中第 $i$ 个记录的概率，$\sum_{i=1}^{n}P_i=1$


    $C_i$ 为找到该记录时，曾和给定值比较过的关键字的个数'
