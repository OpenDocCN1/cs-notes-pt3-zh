- pgno: 562
  md: "# # 希尔排序的算法\n\n```\ntypedef int SortData;\nvoid ShellSort ( SortData V[] ,\
    \ int n ) {\n    SortData temp; int gap = n / 2;   //gap是间隔\n    while ( gap !=\
    \ 0 ) {   //循环,直到gap为零\n        for ( int i = gap; i < n; i++ ) {\n          \
    \  temp = V[i];   //直接插入排序\n            for ( int j = i; j >= gap; j = j-gap )\n\
    \                if ( temp < V[j-gap] )\n                    V[j] = V[j-gap];\n\
    \                else break;\n                V[j] = temp;\n        }\n      \
    \  gap = ( int ) ( gap / 2 );\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 563
  md: '+   开始时 gap 的值较大，子序列中的对象较少，排序速度较快；随着排序进展，gap 值逐渐变小，子序列中对象个数逐渐变多，由于前面大多数对象已基本有序，所以排序速度仍然很快。


    +   Gap的取法有多种。 shell 提出取 gap =⌊n/2⌋， gap =⌊gap/2⌋， 直到gap = 1。


    +   对特定的待排序对象序列，可以准确地估算排序码的比较次数和对象移动次数。


    +   希尔排序所需的比较次数和移动次数约为n 1.3当n趋于无穷时可减少到n(log<sub>2</sub> n)<sup>2</sup>'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# 快速排序（Exchange Sort）


    基本思想是两两比较待排序对象的排序码，如发生逆序（即排列顺序与排序后的次序正好相反），则交换之，直到所有对象都排好序为止。


    # 起泡排序（Bubble Sort）


    +   - 基本方法设待排序对象序列中的对象个数为n。一般地，第i趟起泡排序从1到n−i+1依次比较相邻两个记录地关键字，如果发生逆序，则交换之，其结果是这n−i+1个记录中，关键字最大的记录被交换到第n−i+1的位置上，最多作n−1趟。'
  merge: -1
  img_proc: true
