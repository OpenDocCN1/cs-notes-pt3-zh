  md: "# # 开放定址法\n\n为产生冲突的地址 H(key) 求得一个地址序列：  \n\\( H_0, H_1, H_2, \\ldots, H_s \\\
    quad 1 \\leq s \\leq m-1 \\)  \n\n\\( H_i = ( H(key) + d_i ) \\, \\text{MOD} \\\
    , m \\)  \n\n其中：  \n\\( i = 1, 2, \\ldots, s \\)  \n\n\\( H(key) \\) 为哈希函数；\\\
    ( m \\) 为哈希表长；  \n\\( d_i \\) 为增量序列，有下列三种取法："
