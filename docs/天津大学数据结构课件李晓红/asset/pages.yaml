- pgno: 177
  md: "```\ntemplate <class Type>\nType PQueue<Type>::PQRemove () {\n    assert (\
    \ !IsEmpty () );    //判队空断言\n    Type min = pqelements[0];\n    int minindex =\
    \ 0;\n    for ( int i=1; i<count; i++ )    //寻找最小元素\n        if ( pqelements[i]\
    \ < min )    //存于min\n        { min = pqelements[i];   minindex = i; }\n    pqelements[minindex]\
    \ = pqelements[count-1];\n    //用最后一个元素填补要取走的最小值元素\n    count-- ;//优先级队列中元素个数减一\n\
    \    return min;\n}\n```"
