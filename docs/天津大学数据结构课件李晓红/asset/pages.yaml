  md: '# 图的遍历


    +   - 从图中某一顶点出发访问图中所有的顶点，且使每个顶点仅被访问一次，这一过程就叫做图的遍历（Traversing Graph）。

    +   - 图中可能存在回路，且图的任一顶点都可能与其它顶点相通，在访问完某个顶点之后可能会沿着某些边又回到了曾经访问过的顶点。

    +   - 为了避免重复访问，可设置一个标志顶点是否被访问过的辅助数组 visited [ ]。'
