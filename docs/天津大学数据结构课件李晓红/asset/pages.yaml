- pgno: 379
  md: DFS 在访问图中某一起始顶点 v 后，由 v 出发，访问它的任一邻接顶点 w₁；再从 w₁ 出发，访问与 w₁ 邻接但还没有访问过的顶点 w₂；然后再从
    w₂ 出发，进行类似的访问，... 如此进行下去，直到到达所有的邻接顶点都被访问过的顶点 u 为止。接着，退回一步，退到前一次刚访问过的顶点，看是否还有其它没有被访问的邻接顶点。如果有，则访问此顶点，之后再从此顶点出发，进行与前述类似的访问；如果没有，就再退回一步进行搜索。重复上述过程，直到连通图中所有顶点都被访问过为止。
