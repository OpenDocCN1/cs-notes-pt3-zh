  md: '# # 递归过程与递归工作栈


    +   - 递归过程在实现时，需要自己调用自己。

    +   - 层层向下递归，退出时的次序正好相反：


    递归调用

    n! → (n-1)! → (n-2)! → ... → 1! → 0!=1

    返回次序


    +   - 主程序第一次调用递归过程为外部调用；

    +   - 递归过程每次递归调用自己为内部调用。'
