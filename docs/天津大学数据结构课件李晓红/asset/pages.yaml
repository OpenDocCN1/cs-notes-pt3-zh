- pgno: 464
  md: "在不等概率查找的情况下，ASL<sub>ss</sub> 在  \n\\( P_n \\geqslant P_{n-1} \\geqslant \\\
    cdots \\geqslant P_2 \\geqslant P_1 \\)  \n时取极小值。表中记录按查找概率由小到大重新排列，以提高查找效率。  \n\
    若查找概率无法事先测定，则查找过程采取的改进办法是，在每次查找之后，将刚刚查找到的记录直接移至表尾的位置上。"
