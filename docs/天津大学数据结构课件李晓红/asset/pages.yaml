- pgno: 330
  md: '# ■带权路径长度 (Weighted Path Length, WPL)


    二叉树的带权（外部）路径长度是树的各叶结点所带的权值 \(w_i\) 与该结点到根的路径长度 \(l_i\) 的乘积的和。


    \(WPL = \sum_{i=0}^{n-1} w_i * l_i\)'
