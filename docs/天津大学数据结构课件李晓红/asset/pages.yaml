    +   - 例子：选则排序


    +   - 问题：递增排序


    +   - 解决方案：逐个选择最小数据


    +   - 算法框架：


    ```

    ```cpp

    for ( int i = 0; i < n-1; i++ ) { //n-1趟

    从a[i]检查到a[n-1];

    若最小整数在a[k], 交换a[i]与a[k];

    }

    ```

    ```


    +   - 细化：Select Sort'
