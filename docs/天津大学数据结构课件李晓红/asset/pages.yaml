- pgno: 234
  md: '为节约存储空间，只存对角线及对角线以上的元素，或者只存对角线及对角线以下的元素。前者称为上三角矩阵，后者称为下三角矩阵。


    把它们按行存放于一个一维数组 B 中，称之为对称矩阵 A 的压缩存储方式。


    数组 B 共有 n + ( n - 1 ) + ⋯ + 1 = n*(n+1)/2 个元素。'
  merge: -1
