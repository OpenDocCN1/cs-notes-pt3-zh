  md: "# 堆的建立\n\n```\n```cpp\nvoid Crt_MinHeap ( MinHeap *H,\n    HeapData arr[],\
    \ int n ) {\n    //根据给定数组中的数据和大小,建立堆\n    for ( int i = 0; i < n; i++ ) H->data[i]\
    \ = arr[i];\n    H->CSize = n;       //数组传递及当前堆大小\n    int CPos = (H->CSize-2)/2;\
    \  //最后分支结点\n    while ( CPos >= 0 ) {  //从下到上逐步扩大堆\n        FilterDown ( &H,\
    \ CPos, H->CSize-1 );\n        CPos--;\n    }\n}\n```\n```"
