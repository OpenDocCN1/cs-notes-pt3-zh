- pgno: 32
  md: '# # 线性表


    定义：n（≥0）个数据元素的有限序列，记作


    $$(a_1,\ldots,a_{i-1},a_i,a_{i+1},\ldots,a_n)$$


    其中，$a_i$是表中数据元素，n是表长度。


    # 特点：


    +   - 同一线性表中元素具有相同性。

    +   - 相邻数据元素之间存在序偶关系。

    +   - 除第一个元素外，其他每一个元素有一个且仅有一个直接前驱。

    +   - 除最后一个元素外，其他每一个元素有一个且仅有一个直接后继。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # 顺序表


    定义：将线性表中的元素相继存放在一个连续的存储空间中。


    存储结构：数组。


    特点：线性表的顺序存储方式。


    存取方式：顺序访问，可以随机存取。


