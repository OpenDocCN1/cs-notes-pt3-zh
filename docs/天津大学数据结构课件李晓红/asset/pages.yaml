- pgno: 349
  md: '# # 图的基本概念


    图定义 图是由顶点集合(vertex)及顶点间的关系集合组成的一种数据结构：

    Graph=( V, E )

    其中 V = { x | x ∈ 某个数据对象 }

    是顶点的有穷非空集合；

    E1 = {(x, y) | x, y ∈ V }

    或 E2 = {<x, y> | x, y ∈ V && Path (x, y)}

    其中， E1是顶点之间关系的有穷集合，也叫做边(edge)集合，此时的图称为无向图。 E2 表示从 x 到 y 的一条弧，且称x为弧尾， y为弧头，这样的图称为有向图。'
