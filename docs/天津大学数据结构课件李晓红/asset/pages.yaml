  md: "# # 折叠法\n\n将关键字分割成若干部分，然后取它们的叠加和为哈希地址。两种叠加处理的方法：\n\n移位叠加:将分割后的几部分低位对齐相加\n\n\
    间界叠加:从一端沿分割界来回折送，然后对齐相加\n\n此法适于关键字的数字位数特别多。\n\n例 关键字为：0442205864，哈希地址位数为4\n\n\
