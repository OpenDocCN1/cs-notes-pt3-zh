  md: '+   最大递归调用层次数与递归树的高度一致，理想情况为「log₂(n+1)」。因此，要求存储开销为 O(log₂n)。


    +   在最坏的情况，即待排序对象序列已经按其排序码从小到大排好序的情况下，其递归树成为单支树，每次划分只得到一个比上一次少一个对象的子序列。总的排序码比较次数将达


