- pgno: 507
  md: '假设 n 个关键字可能出现的 n! 种排列的可能性相同，则含 n 个关键字的二叉排序树的平均查找长度


    \(ASL = P(n) = \frac{1}{n}\sum_{k=0}^{n-1}P(n,k)\)


    在等概率查找的情况下，


    \(P(n,k) = \sum_{i=1}^n p_i C_i = \frac{1}{n}\sum_{i=1}^n C_i\)'
