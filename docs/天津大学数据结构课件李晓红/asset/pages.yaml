- pgno: 470
  md: "# 折半查找算法\n\n```\nint Search_Bin ( SSTable ST, KeyType kval ) {\n    low = 1;\
    \ high = ST.length;    // 置区间初值\n    while (low <= high) {\n        mid = (low\
    \ + high) / 2;\n        if ( kval == ST.elem[mid].key )\n            return mid;\
    \       // 找到待查元素\n        else if ( kval < ST.elem[mid].key )\n            high\
    \ = mid - 1;   // 继续在前半区间进行查找\n        else low = mid + 1; // 继续在后半区间进行查找\n  \
    \  }\n    return 0;                // 顺序表中不存在待查元素\n} // Search_Bin\n```"
