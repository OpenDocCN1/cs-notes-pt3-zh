  md: "# ## 判队空\n\n```\nint QueueEmpty ( SeqQueue *Q ) {\n    return Q->rear == Q->front;\n\
    }\n```\n\n# ## 判队满\n\n```\nint QueueFull ( SeqQueue *Q ) {\n    return (Q->rear+1)\
    \ % QueueSize == Q->front;\n}\n```\n\n# ## 入队\n\n```\nint EnQueue ( SeqQueue *Q,\
    \ QueueData x ) {\n    if ( QueueFull (Q) ) return 0;\n    Q->data[Q->rear] =\
    \ x;\n    Q->rear = ( Q->rear+1 ) % MAXSIZE;\n    return 1;\n}\n```"
