  md: '# # 边上权值非负情形的单源最短路径问题


    +   - 问题的提法： 给定一个带权有向图D与源点 v，求从 v 到D中其它顶点的最短路径。限定各边上的权值大于或等于0。


    +   - 为求得这些最短路径，Dijkstra提出按路径长度的递增次序，逐步产生最短路径的算法。首先求出长度最短的一条最短路径，再参照它求出长度次短的一条最短路径，依次类推，直到从顶点v到其它各顶点的最短路径全部求出为止。


    +   - 举例说明'
