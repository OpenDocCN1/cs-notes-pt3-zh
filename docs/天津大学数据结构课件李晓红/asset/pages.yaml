  md: '+   - **顶点的度** 一个顶点 v 的度是与它相关联的边的条数。记作 TD(v)。在有向图中，顶点的度等于该顶点的入度与出度之和。

    +   - **顶点 v 的入度** 是以 v 为终点的有向边的条数，记作 ID(v)；**顶点 v 的出度**是以 v 为始点的有向边的条数，记作 OD(v)。

    +   - **路径** 在图 G=(V, E) 中，若从顶点 vi 出发，沿一些边经过一些顶点 vp1，vp2，…，vpm，到达顶点 vj。则称顶点序列
    (vi，vp1，vp2 … vpm，vj) 为从顶点 vi 到顶点 vj 的路径。它经过的边 (vi，vp1)、(vp1，vp2)、…、(vpm，vj) 应是属于
    E 的边。'
