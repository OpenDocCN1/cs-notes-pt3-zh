- pgno: 450
  md: '# # 查找的概念


    查找表 是由同一类型的数据元素(或记录)构成的集合,由于“集合”中的数据元素之间存在着松散的关系，因此查找表是一种应用灵便的数据结构。


    # ## 对查找表的操作：


    +   - 查询某个“特定的”数据元素是否在查找表中。


    +   - 检索某个“特定的”数据元素的各种属性；


    +   - 在查找表中插入一个数据元素；


    +   - 从查找表中删去某个数据元素


    ![](img/04e8ddadedb998b3013c751f1cd77a21_450_0.png)'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# # 查找表的分类：


    # ## 静态查找表


    仅作查询和检索操作的查找表。


    # ## 动态查找表


    在查找过程中同时插入查找表中不存在的数据元素，或者从查找表中删除已存在的某个数据元素,此类表为动态查找表。'
