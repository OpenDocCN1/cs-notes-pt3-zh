  md: '# # 索引顺序查找


    # ## 又称分块查找


    查找过程：将表分成几块，块内无序，块间有序；先确定待查记录所在块，再在块内查找


    适用条件：分块有序表


    算法实现：


    用数组存放待查记录,每个数据元素至少含有关键字域


    建立索引表，每个索引表结点含有最大关键字域和指向本块第一个结点的指针'
