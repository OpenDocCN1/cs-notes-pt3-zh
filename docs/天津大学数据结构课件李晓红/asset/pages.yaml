- pgno: 584
  md: "# # 直接选择排序的算法\n\n```\ntypedef int SortData;\n\nvoid SelectSort ( SortData V[\
    \ ], int n ) {\n    for ( int i = 0; i < n-1; i++ ) {\n        int k = i;    //选择具有最小排序码的对象\n\
    \        for ( int j = i+1; j < n; j++)\n            if ( V[j] < V[k] )\n    \
    \            k = j;    //当前具最小排序码的对象\n        if ( k != i )    //对换到第 i 个位置\n\
    \            Swap ( V[i], V[k] );\n    }\n}\n```"
  merge: -1
  img_proc: true
