    B [ a00 a01 a02 a03 a11 a12 a13 a22 a23 a33 ]


    若 \( i \leq j \)，数组元素 A[i][j] 在数组 B 中的存放位置为 \( n + (n-1) + (n-2) + \cdots + (n-i+1)
    + j-i \)


    前i行元素总数 第i行第j个元素前元素个数'
