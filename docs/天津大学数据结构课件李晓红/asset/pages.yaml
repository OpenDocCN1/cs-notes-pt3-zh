  md: '# # 重连通分量 (Biconnected Component)


    +   - 在无向连通图G中，当且仅当删去G中的顶点v及所有依附于v的所有边后，可将图分割成两个或两个以上的连通分量，则称顶点v为关节点。


    +   - 没有关节点的连通图叫做重连通图。


    +   - 在重连通图上，任何一对顶点之间至少存在有两条路径，在删去某个顶点及与该顶点相关联的边时，也不破坏图的连通性。


    +   - 一个连通图G如果不是重连通图，那么它可以包括几个重连通分量。'
  merge: -1
  img_proc: true
