  md: '# 二叉排序树（二叉查找树）


    # 定义


    二叉排序树或者是一棵空树；或者是具有如下特性的二叉树：


    +   - 若它的左子树不空，则左子树上所有结点的值均小于根结点的值；

    +   - 若它的右子树不空，则右子树上所有结点的值均大于根结点的值；

    +   - 它的左、右子树也都分别是二叉排序树。'
