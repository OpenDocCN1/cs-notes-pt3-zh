  md: '# # 有序表的查找


    顺序表的查找算法简单，但平均查找长度较大，不适用于表长较大的查找表。

    若以有序表表示静态查找表，则查找过程可以基于“折半”进行。


    # # 折半查找


    查找过程：每次将待查记录所在区间缩小一半。

    适用条件：采用顺序存储结构的有序表。'
