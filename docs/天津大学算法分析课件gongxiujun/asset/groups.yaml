    \ and Z[1..k−1] is an LCS of X[1..m−1] and Y[1..n−1].\n- If xₘ ≠ yₙ, then zₖ ≠\
    \ xₘ implies that Z is an LCS of X[1..m−1] and Y.\n- If xₘ ≠ yₙ, then zₖ ≠ yₙ\
    \ implies that Z is an LCS of X and Y[1..n−1].\n\n## Recursive equation\n\nBy\
    \ the theorem, we can easily get the recursive equation\n\n$$c[i,j] = \\begin{cases}\
    \ 0 & \\text{if } i=0 \\text{ or } j=0 \\\\ c[i-1,j-1]+1 & \\text{if } x[i]=y[j]\
    \ \\\\ \\max\\{c[i-1,j],c[i,j-1]\\} & \\text{otherwise} \\end{cases} \\tag{6}$$\n\
    \n```\nLCS(X,Y,m,n,b) {\n  for i=1 to m do\n    c[i,0]=0;\n  for j=0 to n do\n\
    \    c[0,j]=0;\n  for i=1 to m do\n    for j=1 to n do\n      if x[i]=y[j] then\n\
    \        c[i,j]=c[i-1,j-1]+1;\n        b[i,j]=\"↖\";\n      else if c[i-1,j] >=\
    \ c[i,j-1] then\n        c[i,j]=c[i-1,j];\n        b[i,j]=\"↑\";\n      else\n\
    \        c[i,j]=c[i,j-1];\n        b[i,j]=\"←\";\n}\n```\n\n```\nPrintLCS(b,X,i,j)\
    \ {\n  if i==0 or j==0 then exit;\n  if b[i,j] == \"↖\" {\n    PrintLCS(b,X,i-1,j-1);\n\
    \    print x[i];\n  }\n  if b[i,j] == \"↑\" PrintLCS(b,X,i-1,j);\n  if b[i,j]\
    \ == \"←\" PrintLCS(b,X,i,j-1);\n}\n```\n\nLCS algorithm\n\nPrint LCS algorithm\n\
    \n## Coming up: Backtracking Algorithm\n\n# Chapter 05: Backtracking Algorithm\
