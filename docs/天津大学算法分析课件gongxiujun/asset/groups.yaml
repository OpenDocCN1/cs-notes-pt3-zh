  - '[PAGE 206]


    # Problem statements


    # Definition 1: Subsequence


    Given a sequence X = x₁x₂…xₘ, another sequence Z = z₁z₂…zₖ is a subsequence of
    X if there exists a strictly increasing sequence i₁ < i₂ < … < iₖ of indices of
    X such that for all j = 1, 2, …, k, we have xᵢⱼ = zⱼ.


    Example 1: If X = abcdefg, Z = abdg is a subsequence of X.


    # Definition 2: Common subsequence


    Given two sequences X and Y, a sequence Z is a common subsequence of X and Y if
    Z is a subsequence of both X and Y.


    Example 2: X = abcdefg and Y = aaadgfd. Z = adf is a common subsequence of X and
    Y.'
  - '[PAGE 207]


    # # Definitions


    # ## Definition 3: Longest common subsequence:LCS


    A **longest common subsequence** of X and Y is a common subsequence of X and Y
    with the longest length.


    +   - Longest common subsequence may not be unique, for example, strings both
    acd and abd are LCS of abcd and acbd'
