    +     $$

    +   a_{ij}=\begin{cases}

    +   w(i,j) & \text{if }(i,j)\in E\\

    +   0 & \text{if }i=j\\

    +   \infty & \text{otherwise}

    +   \end{cases}

    +   $$


    +   - **Output:** An $n\times n$ matrix of shortest-path lengths $c(i,j)$


    +   - **Assumption:** No negative-weight cycles'
