    ## An example of task scheduling


    In a weighted staged directed graph \(G\), we want to search the shortest path
    from start node \(s\) to the terminal node \(e\).


    The sub-path from a node in the Global Shortest Path (GSP) to the terminal node
    is also shortest path.


    For example, if node \(i\) is in GSP, then its neighbor is in \(\{2,3,4,6\}\),
    if it is in GSP, then sub-path of GSP from \(i\) to \(e\) is also shortest.


    Define that \(c(i)\) is the shortest distance from \(i\) to \(e\), then \(c(e)
    = 0\) and \(c(s)\) is the goal


    \[

    c(i) = \min_{j\in N(i)} \{c(j) + cost(i,j)\}

    \]


    where \(N(i)\) is the set of neighbors of \(i\)


    We call this property as the Optimal Substructure of subproblems in the procedure
    problem decomposition


    We also should noted that there are some overlapped subproblems in seeking the
    shortest paths.


    Solve \(c(i)\) in reverse order


    \(c(7) = 0\)


    ![](img/4208ee4325ab94ec0c685a689680f88f_11_0.png)


