  md: "\n## Properties of A-star\n\nIn practice, how to estimate h(x) to its real\
    \ value h*(x) is a hard point\n\n- Admissibility: the heuristic function h(x)\
    \ is admissible, meaning that it never overestimates the actual minimal cost of\
    \ reaching the goal.\n\n- Monotonicity (Consistency): the heuristic function h(x)\
    \ is monotonic, means that for any pair of adjacent nodes x and y, \\( h(x) \\\
    leq h(y) + d(x, y) \\)\n\n**Theorem**\nA-star is the optimal if h holds admissibility\
    \ and monotonicity.\n\n## An example: 8 puzzle problem\n\n**Problems statements:**\
    \ The 8 puzzle is a simple game which consists of eight sliding tiles, numbered\
    \ by digits from 1 to 8, placed in a 3 × 3 squared board of nine cells.\n\n- One\
    \ of the cells is always empty\n- Any adjacent (horizontally and vertically) tile\
    \ can be moved into the empty cell\n- The objective of the game is to start from\
    \ an initial configuration and end up in a configuration which the tiles are placed\
    \ in ascending number order.\n\n| 2 | 8 | 3 |\n|---|---|---|\n| 1 | 6 | 4 |\n\
    | 7 |   | 5 |\n\n⇒\n\n| 1 | 2 | 3 |\n|---|---|---|\n| 8 |   | 4 |\n| 7 | 6 | 5\
    \ |\n\n## Design a heuristic cost function\n\n![](img/4208ee4325ab94ec0c685a689680f88f_399_0.png)\n\
    \nFor a given state x, we need a heuristic cost function\n\n$\\hat{f}(x)=\\hat{g}(x)+\\\
    hat{h}(x)$　　　　　　　　　　　　　　　　　(6)\n\nWhere\n\n- $\\hat{g}(x)$: the number of moves\
    \ from initial state to state x.\n- $\\hat{h}(x)$: the number of tiles out of\
    \ place (compared with the goal state) (Hamming priority function)\n\n## State\
    \ space tree\n\n![](img/4208ee4325ab94ec0c685a689680f88f_400_0.png)\n\n## Pseudo\
    \ code of A-star algorithm\n\n```\nfunction A*(start,goal)\n    closedset := the\
    \ empty set    // The set of nodes already evaluated.\n    openset := {start}\
    \    // The set of tentative nodes to be evaluated, initially containing the start\
    \ node\n    came_from := the empty map    // The map of navigated nodes.\n   \
    \ g_score[start] := 0    // Cost from start along best known path.\n    // Estimated\
    \ total cost from start to goal through y.\n    f_score[start] := g_score[start]\
    \ + heuristic_cost_estimate(start, goal)\n    while openset is not empty\n   \
    \     current := the node in openset having the lowest f_score[] value\n     \
    \   if current = goal\n            return reconstruct_path(came_from, goal)\n\
    \        remove current from openset\n        add current to closedset\n     \
    \   for each neighbor in neighbor_nodes(current)\n            if neighbor in closedset\n\
    \                continue\n            tentative_g_score := g_score[current] +\
    \ dist_between(current,neighbor)\n            if neighbor not in openset or tentative_g_score\
    \ < g_score[neighbor]\n                came_from[neighbor] := current\n      \
    \          g_score[neighbor] := tentative_g_score\n                f_score[neighbor]\
    \ := heuristic_cost_estimate(neighbor,\n                    goal)\n          \
    \      if neighbor not in openset\n                    add neighbor to openset\n\
    \    return failure\nfunction reconstruct_path(came_from, current_node)\n    if\
    \ current_node in came_from\n        p := reconstruct_path(came_from,\n      \
    \      came_from[current_node])\n        return (p + current_node)\n    else\n\
    \        return current_node\n```\n\n# Coming up: NP Complete Problems\n\n# Chapter\
    \ 07: Non-deterministic Polynomial Complete Problems\n\nDesign and Analysis of\
    \ Computer Algorithms\n\nGONG Xiu-Jun\n\nSchool of Computer Science and Technology,\
    \ Tianjin University\n\nEmail: gongxj@tjtu.edu.cn\n\nMay 26, 2019\n"
