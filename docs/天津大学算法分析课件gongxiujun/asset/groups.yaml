    # # An example: 8 puzzle problem


    **Problems statements:** The 8 puzzle is a simple game which consists of eight
    sliding tiles, numbered by digits from 1 to 8, placed in a 3 × 3 squared board
    of nine cells.


    +   - One of the cells is always empty


    +   - Any adjacent (horizontally and vertically) tile can be moved into the empty
