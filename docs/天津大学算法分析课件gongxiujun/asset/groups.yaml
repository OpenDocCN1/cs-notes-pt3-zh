    \ != NoEdge &&\n                (c + a[x[n-1]][x[j]] < bestc || bestc == 0)) {\n\
    \                // search this subtree\n                swap(x[n], x[j]);\n \
    \               c += a[x[n-1]][x[n]];\n                TSP(n-1);\n           \
    \     c -= a[x[n-1]][x[n]];\n                swap(x[n], x[j]);\n            }\n\
    \        }\n    }\n}\n```\n\n```cpp\ntemplate<class T>\nvoid maxclique(int n,\
    \ TSP(int)) {\n    // Traveling salesperson\n    // Backtracking.\n\n    // Return\
