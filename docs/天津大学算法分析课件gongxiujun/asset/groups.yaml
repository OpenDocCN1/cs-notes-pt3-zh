  md: '

    ## Definition


    A decision problem is said to be in class NP (Non-deterministic Polynomial) if
    there exists a verifier V for the problem. Given any instance w of the problem,
    where the answer is "yes", there must exist a certificate (also called a witness)
    c such that, given the ordered pair (w,c) as input, V returns the answer "yes"
    in polynomial time.


    - if the answer to w is "no", the verifier will return "no" with input (w,c) for
    all possible c.

    - V could return the answer "No" even if the answer to w is "yes", if c is not
    a valid witness.

    - Notable problems in class NP include all problems in P, graph isomorphism problem,
    travelling salesman problem, and boolean satisfiability problem.


    ## Polynomial Reduction


    ### Definition


    If problem X can be reduced to problem Y (X ≤P Y) polynomially **if and only if**
    there exists a polynomial deterministic algorithm T such that


    - for each input string x, T generates a string T(x)

    - x is an admissible input and corresponds a “yes” answer for X **if and only
    if** T(x) is an admissible input and corresponds a “yes” answer for Y.


    ![](img/4208ee4325ab94ec0c685a689680f88f_448_0.png)


    ## Theorem 1


    If $X \leq_P Y$ and $Y$ is in class P, then $X$ is also in class P.


    ### Proof


    - there exists polynomial algorithm with complexity $q$ for $Y$

    - let the complexity of $T$ be polynomial $p$, then the length of $T(x)$ is $O(p(|x|))$

    - for input $T(x)$, complexity for $Y$ is $O(q(p(|x|)))$

