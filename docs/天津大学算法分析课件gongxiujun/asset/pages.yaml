  md: "# # Recursive version\n\n# ## Algorithm 1: RKnapsack\n\n**Input**: n,c,p[1..n],w[1..n]\n\
    **Output**: the optimal value f(1, c)\n\n```\n```\nFunction f(int i, int y)\n\
    1    if (i==n) then\n2        return (y<w[n]?0 : p[n]\n3        );\n4    if (y<w[i])\
    \ then\n5        return f(i+1,y) ;\n6    return max(f(i+1,y),f(i+1.y-\n    w[i])+p[i])\
    \ ;\n```\n```"
