  md: '# Definition


    +   - The term dynamic programming was originally used in the 1940s by Richard
    Bellman (Bellman equation)

    +     - DP refers specifically to nesting smaller decision problems inside larger
    decisions.

    +     - Dynamic was chosen because it sounded impressive, not because it described
    how the method worked.

    +     - Programming referred to the use of the method to find an optimal.

    +   - A method of solving complex problems by breaking them down into simpler
    steps (subproblems) in recursive manner.

    +     - the solution can be produced by combining solutions to subproblems;

    +     - the solution to each subproblem can be produced by combining solutions
    to sub-subproblems, etc;

    +     - the total number of subproblems arising recursively is polynomial.'
