  md: '# # Solution


    +   1. load the first ship as close to its capacity as possible and

    +   2. put the remaining containers into the second ship.


    To load the first ship as close to capacity as possible, we need to select a subset
    of containers with total weight as close to \( c_1 \) as possible.


    Using fixed length tuple \( x = (x_1, \cdots, x_n) \) (\( x_i = 1 \), if container
    i is loaded) as solution space representation, just need


    \[ \max \sum_{i=1}^n w_i x_i \tag{4} \]


