- pgno: 294
  md: '# Max Clique: problem statements


    A subgraph $G'' \subseteq V'', E''$ is a complete subgraph of a graph $G = \langle
    V, E \rangle$ if and only if $V'' \subseteq V$ and for $\forall u \in V'', \forall
    v \in V'', (u,v) \in E'' \subseteq E$.


    **A clique** is a complete subgraph of $G$ if no larger inclusion of other complete
    subgraphs.


    **A independent vertex set** is a subgraph of $G$ with no empty edges if no larger
    inclusion of other independent vertex sets.


    **A max clique** is a clique of the largest possible size in a given graph.


    **A max independent vertex set** is a independent vertex set of the largest possible
    size in a given graph.'
  merge: -1
  img_proc: true
