- pgno: 291
  md: "# # Backtrack algorithm for Knapsack\n\n```\n```cpp\ntemplate<class Tv, class\
    \ Tp>\nvoid KnapTv, Tp>::Knapsack(int i)\n{ // Search the i - th node\n    if\
    \ (i > n) { // Leaf node\n        bestp = cp;\n        return;\n    }\n    if\
    \ (remainweight >= w[i])\n    { // Left subtree\n        x[i] = 1; // try x[i]\
    \ = 1\n        cp += v[i];\n        remainweight -= w[i];\n        Knapsack(i\
    \ + 1);\n    }\n    if (Bound(i + 1) > bestp) // try x[i] = 0\n        Knapsack(i\
    \ + 1);\n}\n```\n```\n\n```\n```cpp\ntemplate<class Tv, class Tp>\nTp Knap<Tv,\
    \ Tp>::Bound(int i)\n{ // Return upper bound on value of\n  // best leaf in i\
    \ - subtree\n    Tp c = cp; // remaining\n    Tp bound = c; // profit bound\n\
    \    while (i <= n && c + w[i] <= W)\n    { // fill node of profit density\n \
    \       c -= w[i];\n        bound += v[i];\n        i++;\n    }\n    if (i <=\
    \ n)\n        bound += (W - c) * p[i] / w[i];\n    return bound;\n}\n```\n```\n\
    \n# ## NEW\n\nAssumed that items have been sorted by the profit density \\(\\\
    left(\\frac{p_i}{w_i}\\right)\\)"
