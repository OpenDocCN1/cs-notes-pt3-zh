- pgno: 449
  md: "# Theorem 1\n\nif $X \\leq_P Y$ and $Y$ is in class P, then $X$ is also in\
    \ class P.\n\n# Proof.\n\n+   - there exists polynomial algorithm with complexity\
    \ $q$ for $Y$  \n+   - let the complexity of $T$ be polynomial $p$, then the length\
    \ of $T(x)$ is $O(p(|x|))$  \n+   - for input $T(x)$, complexity for $Q$ is $O(q(p(|x|)))$\
    \  \n+   - so, complexity for solving $X$ is $O(p(x) + q(p(|x|)))$\n\n> $X \\\
    leq_P Y$ means that $Y$ is at least as hard as $X$."
  merge: -1
  img_proc: true
