- pgno: 83
  md: "# Recursive version\n\n```\n**Algorithm 2:** RKnapsack\n\n**Input:** n, c,\
    \ p[1..n], w[1..n]\n\n**Output:** the maximum profit value \\(f(1,c)\\)\n\n**Function**\
    \ \\(f(i, int\\ y)\\)\n\n1. `if (i == n) then`\n   `return (y < w[n] ? 0 : p[n])`\n\
    2. `if (y < w[i]) then`\n   `return f(i+1,y)`\n3. `return max(f(i+1,y), f(i+1,y-w[i])+p[i])`\n\
    ```\n\n# Algorithm complexity:\n\nWe use \\(t(n)\\) to denote the algorithm time\
    \ complexity with n items\n\n+   - \\(t(1)=a\\)\n+   - At the base case (step4),\
    \ \\(t(n)=t(n-1)+b\\), so \\(t(n)=O(n)\\)\n+   - At the worst case (step6), \\\
    (t(n)=2t(n-1)+b\\), so \\(t(n)=O(2^n)\\)"
