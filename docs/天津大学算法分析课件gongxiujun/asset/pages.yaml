- pgno: 302
  md: "# Backtrack algorithm for maxclique\n\n```\nint AdjacencyGraph::MaxClique(int\
    \ v) {\n    // Reduce size of largest clique.\n    // Return clique size\n   \
    \ if (n == 0)\n        return 0;\n    // initialize for maxClique\n    int x[n+1];\n\
    \    cn = 0;\n    bestn = 0;\n    bestv = v;\n\n    // find max clique\n    maxClique(1);\n\
    \    \n    delete [] x;\n    return bestn;\n}\n```\n\n```\nvoid AdjacencyGraph::maxClique(int\
    \ i)\n{\n    // Backtracking code to compute largest clique.\n    // (i) if a\
    \ vertex is connected to\n    // all vertices in a larger clique, update\n   \
    \ // count [j = 1; j < i; j++]\n    for (int j = 1; j < i; j++)\n        bestc[j]\
    \ = x[j];\n    return;\n\n    // see if vertex i connects to others\n    // in\
    \ current clique\n    int OK = 1;\n    for (int j = 1; j < i; j++)\n        if\
    \ (x[j] == 1 && !AdjMat[i][j])\n        {\n            OK = 0; // not connected\
    \ to j\n            break;\n        }\n\n    if (OK) { // try x[i] = 1\n     \
    \   x[i] = 1; // add i to clique\n        cn++;\n        maxClique(i+1);\n   \
    \     x[i] = 0;\n        cn--;\n    }\n\n    if (cn + n - i > bestn) { // try\
    \ x[i] = 0\n        x[i] = 0;\n        maxClique(i+1);\n    }\n}\n```"
