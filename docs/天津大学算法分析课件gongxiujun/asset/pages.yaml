  md: '# # Polynomial reduction


    # ## Definition


    If problem X can be reduced to problem Y (X ≤P Y) polynomially **if and only**
    if there exists a polynomial deterministic algorithm T such that


    +   - for each input string x, T generates a string T(x)


    +   - x is an admissible input and corresponds a “yes” answer for X **if and only**
    T(x) is an admissible input and corresponds a “yes” answer for Q.


