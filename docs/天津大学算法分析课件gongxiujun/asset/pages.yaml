  md: "# # Pseudo code of A-star algorithm\n\n```\n```\nfunction A*(start,goal)\n\
    \    closedset := the empty set    // The set of nodes already evaluated.\n  \
    \  openset := {start}    // The set of tentative nodes to be evaluated, initially\
    \ containing the start node\n    came_from := the empty map    // The map of navigated\
    \ nodes.\n    g_score[start] := 0    // Cost from start along best known path.\n\
    \    // Estimated total cost from start to goal through y.\n    f_score[start]\
    \ := g_score[start] + heuristic_cost_estimate(start, goal)\n    while openset\
    \ is not empty\n        current := the node in openset having the lowest f_score[]\
    \ value\n        if current = goal\n            return reconstruct_path(came_from,\
    \ goal)\n        remove current from openset\n        add current to closedset\n\
    \        for each neighbor in neighbor_nodes(current)\n            if neighbor\
    \ in closedset\n                continue\n            tentative_g_score := g_score[\n\
    ```\n```\n\n```\n```\ncurrent] + dist_between(current,neighbor)\n        if neighbor\
    \ not in openset or tentative_g_score < g_score[neighbor]\n            came_from[neighbor]\
    \ := current\n            g_score[neighbor] := tentative_g_score\n           \
    \ f_score[neighbor] := heuristic_cost_estimate(neighbor,\n                goal)\n\
    \            if neighbor not in openset\n                add neighbor to openset\n\
    \    return failure\nfunction reconstruct_path(came_from, current_node)\n    if\
    \ current_node in came_from\n        p := reconstruct_path(came_from,\n      \
    \      came_from[current_node])\n        return (p + current_node)\n    else\n\
    \        return current_node\n```\n```"
