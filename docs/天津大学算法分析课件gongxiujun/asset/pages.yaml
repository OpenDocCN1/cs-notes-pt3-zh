- pgno: 446
  md: '# Definition


    Class P contains all decision problems that can be solved by a deterministic Turing
    machine using a polynomial amount of computation time, or polynomial time.


    +   - Polynomial-time algorithms are closed under composition, addition and multiplication.

    +   - Any problem solved by composition, addition and multiplication of polynomial-time
    algorithms is also in class P.

    +   - Notable problems in P include greatest common divisor, prime and linear
    programming problems.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# # Definition


    A decision problem is said to be in class NP (Non-deterministic Polynomial)if
    there exists a verifier V for the problem. Given any instance w of the problem,
    where the answer is "yes", there must exist a certificate (also called a witness)
    c such that, given the ordered pair (w,c) as input, V returns the answer "yes"
    in polynomial time.


    +   - if the answer to w is "no", the verifier will return "no" with input (w,c)
    for all possible c.


    +   - V could return the answer "No" even if the answer to w is "yes", if c is
    not a valid witness.


    +   - Notable problems in class NP include al problems in P, graph isomorphism
    problem, travelling salesman problem, and boolean satisfiability problem.'
  merge: -1
  img_proc: true
