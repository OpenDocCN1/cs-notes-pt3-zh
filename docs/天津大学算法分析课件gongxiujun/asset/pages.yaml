- pgno: 346
  md: '# Procedures


    +   - **B&B** requires two subroutines

    +     - **Branch** (Splitting): given a set S of candidates, returns two or more
    smaller sets S₁, S₂, … whose union covers S

    +     - **Bounding** (Pruning): computes upper and lower bounds for the minimum
    value f(x) of x within a given subset of S


    +   - Basic ideas that B&B works:

    +     - if the lower bound for some tree node (set of candidates) A is greater
    than the upper bound for some other node B, then A may be **safely discarded**
    from the search.

    +     - This step is usually implemented by maintaining a **global variable**
    (shared among all nodes of the tree) that records the minimum upper bound seen
    among all subregions examined so far.

    +     - The recursion **stops** when the current candidate set S is reduced to
    a single element, or when the upper bound for set S matches the lower bound.'
