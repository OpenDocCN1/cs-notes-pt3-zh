    \ = max(f[i-1][y], f[i-1][y-w[i]] + p[i]);\n\t}\n\tf[n][c] = f[n-1][c];\n\tif\
    \ (c > w[n])\n\t\tf[n][c] = max(f[n-1][c], f[n-1][c-w[n]] + p[n]);\n}\n```\n```\n\
    \n+   - The algorithm saves all possible values using an array f, so that every\
    \ f(i,y) is calculated only once.\n+   - It needs Θ(nc) extra space.\n+   - Its\
    \ time complexity is Θ(nc):\n+     - It is not polynomial: to describe c need\
    \ log2c bits\n+     - but pseudo-polynomial: exponential dependence on numerical\
    \ inputs\n+   - Its disadvantage:\n+     - The capacity c must an integer\n+ \
    \    - The complexity might still be very high when c is large enough; for instance\
    \ c = 2^n."
