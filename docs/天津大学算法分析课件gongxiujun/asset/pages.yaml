    and Z[1..k-1] is an LCS of X[1..m-1] and Y[1..n-1].

    +   - If x<sub>m</sub> ≠ y<sub>n</sub>, then z<sub>k</sub> ≠ x<sub>m</sub> implies
    that Z is an LCS of X[1..m-1] and Y.

