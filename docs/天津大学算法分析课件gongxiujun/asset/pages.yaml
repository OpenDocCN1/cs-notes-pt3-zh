  md: '# Definitions


    +   - A-star was first described in 1968 by Peter Hart, Nils Nilsson, and Bertram
    Raphael.

    +   - It uses a best-first search and finds a least-cost path from a given initial
    node to one goal node.

    +   - It uses a knowledge-plus-heuristic cost function of node x: `f(x)=g(x)+h(x)`,
    to determine the order in which the search visits nodes in the tree.

    +     - `g(x)`: the **past path-cost function**, which is the known distance from
    the starting node to the current node x

    +     - `h(x)`: a **future path-cost function**, which is an admissible “heuristic
    estimate” of the distance from x to the goal

    +   - A-star vs B&B

    +     - In B&B, the node with the best (shortest) path that you''ve found so far
    is expanded first.'
