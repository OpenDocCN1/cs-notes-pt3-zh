    item to include in a collection so that the total weight is less than or equal
    to a given limit(capacity) and the total value is as large as possible.


    **Formal representation**: Given _n_ > 0, _c_ > 0 and two n-tuples of positive
    numbers: \((w_1, w_2, \cdots, w_n)\) and \((p_1, p_2, \cdots, p_n)\).


    we wish to determine the subset \( T \subset \{1 \dots n\} \) such that


    If used a n-tuple of indicator variables \((x_1, x_2, \cdots, x_n)\) , then


    Maximize: \(\sum_{i \in T} p_i\)

    Subjects to: \(\sum_{i \in T} w_i \le c\)


    Maximize: \(\sum_{i=1}^n x_i * p_i\)

    Subjects to: \(\sum_{i=1}^n x_i * w_i \le c\)'
