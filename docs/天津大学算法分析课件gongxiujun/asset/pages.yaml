  md: '# # Lower bound estimation


    Let \( f = (e_1, e_2, \cdots, e_n) \) is a TSP tour of the undirected weighted
    graph \( G = <V, E> \), \( A = (A(i,j)) \) is its cost matrix, and \( e_i \) is
    the edge from i-th row.


    # ## Theorem


    > If A is reduced to B by row number r and B is reduced to C by column number
    c, then \( cost(f) - cost(C) + r + c \geq r + c \)


    We use the reduced number \( r + c \) as the estimation of lower bounds.

    Let S be a sub node of R and \( (i,j) \) a edge from i to j:


    +   - If S is non-leaf node, then \( LB(S) = LB(R) + R(i,j) + rn \), where \(
    rn \) is the reduced number of S by

    +     - Let all numbers in i-th row and j-th column of R be \( \infty \)

    +     - Let \( R(i,j) \) be \( \infty \)

    +     - Let S=R


    +   - If S is leaf node, \( LB(S) = L(S) + A(S, root) \)'
