- pgno: 13
  md: '# An example of task scheduling


    In a weighted staged directed graph \(G\), we want to search the shortest path
    from start node \(s\) to the terminal node \(e\).


    The sub-path from a node in the Global Shortest Path (GSP) to the terminal node
    is also shortest. For the node 1, whichever of its neighbors is 2, 3, 4, 5 in
    GSP, the sub-path of GSP from it to the terminal is also shortest.


    ![](img/4208ee4325ab94ec0c685a689680f88f_13_0.png)


    We call this property as the Optimal Substructure of subproblems in the procedure
    of problem decomposition. We also should noticed that there are some overlapped
    subproblems in seeking the shortest path.


    Define that \(c(i)\) is the shortest distance from \(i\) to \(e\), then

    \(c(e)=0\) and \(c(s)\) is the goal

    \[

    c(i)=\min_{j\in N(i)}\{c(j)+\operatorname{cost}(i,j)\}

    \]

    where \(N(i)\) is the set of neighbors of \(i\).


    Solve \(c(i)\) in reverse order


    \(c(7)=0\)


    \(c(6)=1,\ c(5)=2\)


    \(c(4)=8+c(6)=9\)'
