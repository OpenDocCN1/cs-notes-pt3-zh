- pgno: 160
  md: "# # Iterative algorithm for MPC\n\n```\n```c\nvoid MatrixChain(int r[], int\
    \ q, int **c, int **key)\n{\n    //Compute costs and hay for all Mij's.\n    for\
    \ (int i = 1; i <= q; i++) c[i][i] = 0;\n    for (int i = 1; i <= q; i++) {\n\
    \        c[i][i] = 0; i <= q; i++) {\n        c[i][i+1] = r[i-1]*r[i]*r[i+2];\n\
    \        key[i][i+1] = i;\n    }\n    //c[i][j] = 0;\n    //Computing c's and\
    \ hay's\n    for (int s = 2; s <= q; s++) {\n        for (int i = 1; i <= q -\
    \ s + 1; i++) {\n            // min term for i\n            int min = c[i+1][i+s]\
    \ + c[i][i+1] * r[i-1]*r[i]*r[i+s+1];\n            key[i][i+s] = i;\n        \
    \    // min term\n            for (int k = i+1; k < i + s; k++) {\n          \
    \      int t = c[i][k] + c[k+1][i+s] +\n                    r[i-1]*r[k+1]*r[i+s+1];\n\
    \                if (t < min) { // smaller min term\n                    min =\
    \ t;\n                    key[i][i+s] = k;\n                }\n            }\n\
    \        }\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
