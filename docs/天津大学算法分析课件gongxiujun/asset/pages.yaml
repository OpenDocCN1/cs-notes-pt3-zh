- pgno: 88
  md: "# # First attempt: using array\n\n```\n```cpp\ntemplate<class T>\nvoid Knapsack(T\
    \ p[], int w[], int c, int n, T** f)\n{\n// Compute f[i][y] for all i and y.\n\
    \    // initialize f[i][0]\n    int ymax = min(w[0],c+1);\n    for (int y = 0;\
    \ y < ymax; y++)\n        f[0][y] = 0;\n    for (int y = w[0]; y <= c; y++)\n\
    \        f[0][y] = p[0];\n    // compute remaining f's\n    for (int i = 1; i\
    \ < n; i++) {\n        ymax = min(w[i],c+1);\n        for (int y = 0; y < ymax;\
    \ y++)\n            f[i][y] = f[i-1][y];\n        for (int y = w[i]; y <= c; y++)\n\
    \            f[i][y] = max(f[i-1][y], f[i-1][y-w[i]] + p[i]);\n    }\n    f[n][c]\
    \ = f[n-1][c];\n    if (c >= w[n])\n        f[n][c] = max(f[n][c], f[n-1][c-w[n]]\
    \ + p[n]);\n}\n```\n```"
  merge: -1
