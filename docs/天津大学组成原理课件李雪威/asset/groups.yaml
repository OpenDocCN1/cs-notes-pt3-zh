    | ↓ i | IF | ID | EX | MEM | WB |

    | ↓ t | | IF | ID | EX | MEM | WB |

    | | | IF | ID | EX | MEM | WB |

    | | | | IF | ID | EX | MEM | WB |

    | | | | | IF | ID | EX | MEM | WB |'
