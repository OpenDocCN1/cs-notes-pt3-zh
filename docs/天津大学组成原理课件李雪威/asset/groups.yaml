  - "[PAGE 222]\n\n# # Using Conditional Moves\n\n# ## Conditional Move Instructions\n\
    \n+   - Instruction supports:\n+     - if (Test) Dest ← Src\n\n+   - Supported\
    \ in post-1995 x86 processors\n\n+   - GCC tries to use them\n+     - But, only\
    \ when known to be safe\n\n# ## Why?\n\n+   - Branches are very disruptive to\
    \ instruction flow through pipelines\n\n+   - Conditional moves do not require\
    \ control transfer\n\n# ## C Code\n\n```\n```c\nval = Test\n  ? Then_Expr\n  :\
    \ Else_Expr;\n```\n```\n\n# ## Goto Version\n\n```\n```c\nresult = Then_Expr;\n\
    eval = Else_Expr;\nnt = !Test;\nif (nt) result = eval;\nreturn result;\n```\n\
    ```"
  - "[PAGE 223]\n\n# # Conditional Move Example\n\n```\n```c\nlong absdiff\n(long\
    \ x, long y)\n{\n    long result;\n    if (x > y)\n        result = x-y;\n   \
    \ else\n        result = y-x;\n    return result;\n}\n```\n```\n\n| Register |\
    \ Use(s) |\n|----------|--------|\n| %rdi     | Argument x |\n| %rsi     | Argument\
    \ y |\n| %rax     | Return value |\n\n```\nabsdiff:\n    movq    %rdi, %rax  \
    \  # x\n    subq    %rsi, %rax    # result = x-y\n    movq    %rsi, %rdx\n   \
    \ subq    %rdi, %rdx    # eval = y-x\n    cmpq    %rsi, %rdi    # x:y\n    cmovle\
    \  %rdx, %rax    # if <=, result = eval\n    ret\n```"
