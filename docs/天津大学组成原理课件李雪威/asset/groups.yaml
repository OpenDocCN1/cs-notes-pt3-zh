    # Bits, Bytes, and Integers


    15-213: Introduction to Computer Systems

    2nd and 3rd Lectures, Sep. 3 and Sep. 8, 2015


    # Today: Bits, Bytes, and Integers


    +   - Representing information as bits

    +   - Bit-level manipulations

    +   - Integers

    +     - Representation: unsigned and signed

    +     - Conversion, casting

    +     - Expanding, truncating

    +     - Addition, negation, multiplication, shifting

    +     - Summary

    +   - Representations in memory, pointers, strings


    # Everything is bits


    +   - Each bit is 0 or 1

    +   - By encoding/interpreting sets of bits in various ways

    +     - Computers determine what to do (instructions)

    +     - ... and represent and manipulate numbers, sets, strings, etc...

    +   - Why bits? Electronic implementation

    +     - Easy to store with bistable elements

    +     - Reliably transmitted on noisy and inaccurate wires


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_37_0.png)


    # For example, can count in binary


    +   - Base 2 Number Representation

    +     - Represent 15₁₀ as 1111₂

    +     - Represent 1.20₁₀ as 1.0011001100110011…₂

    +     - Represent 1.5213 × 10³ as 1.011110101101101₂ × 2¹⁰


    # Encoding Byte Values


    +   - Byte = 8 bits

    +     - Binary: 00000000₂ to 11111111₂

    +     - Decimal: 0₁₀ to 255₁₀

    +     - Hexadecimal 00₁₆ to FF₁₆

    +       - Base 16 number representation

    +       - Use characters ''0'' to ''9'' and ''A'' to ''F''

    +       - Write FA1D37B₁₆ in C as

    +         - 0xFA1D37B

    +         - 0xfa1d37b


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_37_1.png)


    # Example Data Representations


    | C Data Type | Typical 32-bit | Typical 64-bit | x86-64 |

    |---|---:|---:|---:|

    | char | 1 | 1 | 1 |

    | short | 2 | 2 | 2 |

    | int | 4 | 4 | 4 |

    | long | 4 | 8 | 8 |

    | float | 4 | 4 | 4 |

    | double | 8 | 8 | 8 |

    | long double | 8 | 8 | 10/16 |

    | pointer | 4 | 8 | 8 |'
  - '[PAGE 38]


    # # Today: Bits, Bytes, and Integers


    +   - Representing Information as Bits

    +   - Bit-level manipulations

    +   - Integers

    +     - Representation: unsigned and signed

    +     - Conversion, casting

    +     - Expanding, truncating

    +     - Addition, negation, multiplication, shifting

    +     - Summary

    +   - Representations in memory, pointers, strings


    # # Boolean Algebra


    +   - Developed by George Boole in 19th Century

    +     - Algebraic representation of logic

    +       - Encode "True" as 1 and "False" as 0

    +   - And

    +     - A&B = 1 when both A=1 and B=1

    +     - A&B = 0 when either A=0 or B=0

    +   - Not

    +     - ~A = 1 when A=0

    +     - ~A = 0 when A=1

    +   - Exclusive-Or (Xor)

    +     - A^B = 1 when either A=0 or B=1, but not both

    +     - A^B = 0 when A=0 or B=1, but not both


    # # General Boolean Algebras


    +   - Operate on Bit Vectors

    +     - Operations applied bitwise

    +   - All of the Properties of Boolean Algebra Apply


    # # Example: Representing & Manipulating Sets


    +   - Representation

    +     - Width w bit vector represents subsets of {0, ..., w-1}

    +     - a[j] = 1 if j ∈ A

    +       - 01101010 -> {0, 3, 5, 6}

    +       - 76543210

    +   - Operations

    +     - Intersection

    +     - Union

    +     - Symmetric difference

    +     - Complement


    # # Bit-Level Operations in C


    +   - Operations &, |, ~, ^ Available in C

    +     - Apply to any "integral" data type

    +       - long, int, short, char, unsigned

    +       - View as bit vectors

    +       - Don''t apply to float or double

    +   - Examples (Char data type)

    +     - ~0x41 -> 0xBE

    +       - ~0xA -> 0xF5

    +       - ~0x00 -> 0xFF

    +       - ~0xFF -> 0x00

    +     - 0x69 & 0x55 -> 0x49

    +       - 0x69 | 0x55 -> 0x7D

    +     - 0x69 ^ 0x55 -> 0x3C

    +       - 0xFF ^ 0xFF -> 0x00


    # # Contrast: Logic Operations in C


    +   - Contrast to Logical Operators

    +     - &&, ||, !

    +       - View 0 as "False"

    +       - Anything nonzero as "True"

    +       - Always return 0 or 1

    +       - Early termination

    +   - Examples (char data type)

    +     - !0x41 -> 0x00

    +     - !0x00 -> 0x01

    +     - !!0x41 -> 0x01

    +     - 0x69 && 0x55 -> 0x01

    +     - 0x69 || 0x55 -> 0x01

    +     - p && *p (don''t cause null pointer access)'
