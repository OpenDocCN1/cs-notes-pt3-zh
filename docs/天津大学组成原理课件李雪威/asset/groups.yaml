  md: "\n## Locality Example\n\n```c\nsum = 0;\nfor (i = 0; i < n; i++)\n    sum +=\
    \ a[i];\nreturn sum;\n```\n\n- **Data references**\n  - Reference array elements\
    \ in succession (stride-1 reference pattern) — Spatial locality.\n  - Reference\
    \ variable `sum` each iteration — Temporal locality.\n- **Instruction references**\n\
    \  - Reference instructions in sequence — Spatial locality.\n  - Cycle through\
    \ loop repeatedly — Temporal locality.\n\n### Qualitative Estimates of Locality\n\
    \n- **Claim**: Being able to look at code and get a qualitative sense of its locality\
    \ is a key skill for a professional programmer.\n\n- **Question**: Does this function\
    \ have good locality with respect to array `a`?\n\n```c\nint sum_array_rows(int\
    \ a[M][N])\n{\n    int i, j, sum = 0;\n\n    for (i = 0; i < M; i++)\n       \
    \ for (j = 0; j < N; j++)\n            sum += a[i][j];\n    return sum;\n}\n```\n\
    \n### Locality Example\n\n- **Question**: Does this function have good locality\
    \ with respect to array `a`?\n\n```c\nint sum_array_cols(int a[M][N])\n{\n   \
    \ int i, j, sum = 0;\n\n    for (j = 0; j < N; j++)\n        for (i = 0; i < M;\
    \ i++)\n            sum += a[i][j];\n    return sum;\n}\n```\n\n### Locality Example\n\
    \n- **Question**: Can you permute the loops so that the function scans the 3-D\
    \ array `a` with a stride-1 reference pattern (and thus has good spatial locality)?\n\
    \n```c\nint sum_array_3d(int a[M][N][N]) {\n    int i, j, k, sum = 0;\n\n    for\
    \ (i = 0; i < N; i++)\n        for (j = 0; j < N; j++)\n            for (k = 0;\
    \ k < M; k++)\n                sum += a[k][i][j];\n    return sum;\n}\n```\n\n\
    ## Memory Hierarchies\n\n- **Some fundamental and enduring properties of hardware\
    \ and software:**\n  - Fast storage technologies cost more per byte, have less\
    \ capacity, and require more power (heat!).\n  - The gap between CPU and main\
    \ memory speed is widening.\n  - Well-written programs tend to exhibit good locality.\n\
    \n- **These fundamental properties complement each other beautifully.**\n\n- **They\
    \ suggest an approach for organizing memory and storage systems known as a _memory\
    \ hierarchy_.**\n\n### Today\n\n- Storage technologies and trends\n- Locality\
    \ of reference\n- Caching in the memory hierarchy\n\n## Example Memory Hierarchy\n\
    \nSmaller, faster, and costlier (per byte) storage devices\n\nLarger, slower,\
    \ and cheaper (per byte) storage devices\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_546_0.png)\n\
    \n| Level | Device | Description |\n|-------|--------|-------------|\n| L0 | Registers\
    \ | CPU registers hold words retrieved from the L1 cache. |\n| L1 | L1 cache (SRAM)\
    \ | L1 cache holds cache lines retrieved from the L2 cache. |\n| L2 | L2 cache\
    \ (SRAM) | L2 cache holds cache lines retrieved from L3 cache. |\n| L3 | L3 cache\
    \ (SRAM) | L3 cache holds cache lines retrieved from main memory. |\n| L4 | Main\
    \ memory (DRAM) | Main memory holds disk blocks retrieved from local disks. |\n\
    | L5 | Local secondary storage (local disks) | Local disks hold files retrieved\
    \ from disks on remote servers. |\n| L6 | Remote secondary storage (e.g., Web\
    \ servers) | — |\n\n### Caches\n\n- **Cache**: A smaller, faster storage device\
    \ that acts as a staging area for a subset of the data in a larger, slower device.\n\
    \n- **Fundamental idea of a memory hierarchy:**\n  - For each `k`, the faster,\
    \ smaller device at level `k` serves as a cache for the larger, slower device\
    \ at level `k+1`.\n\n- **Why do memory hierarchies work?**\n  - Because of locality,\
    \ programs tend to access the data at level `k` more often than they access the\
    \ data at level `k+1`.\n  - Thus, the storage at level `k+1` can be slower, and\
    \ thus larger and cheaper per bit.\n\n- **Big Idea**: The memory hierarchy creates\
    \ a large pool of storage that costs as much as the cheap storage near the bottom,\
    \ but that serves data to programs at the rate of the fast storage near the top.\n\
    \n### General Cache Concepts\n\n- **Cache**: Smaller, faster, more expensive memory\
    \ caches a subset of the blocks.\n- Data is copied in block-sized transfer units.\n\
    - **Memory**: Larger, slower, cheaper memory viewed as partitioned into “blocks”.\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_548_0.png)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_548_1.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_548_2.png)\n\nBryant and O’Hallaron,\
    \ Computer Systems: A Programmer’s Perspective, Third Edition\n"
