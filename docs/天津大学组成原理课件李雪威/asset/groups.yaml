    \n```c\nval = Test ? Then_Expr : Else_Expr;\n```\n\n```c\nval = x>y ? x-y : y-x;\n\
    ```\n\n### Goto Version\n\n```c\ntest = !Test;\nif (ntest) goto Else;\nval = Then_Expr;\n\
    goto Done;\nElse:\nval = Else_Expr;\nDone:\n. . .\n```\n\n- Create separate code\
    \ regions for then & else expressions\n- Execute appropriate one\n\n## Using Conditional\
    \ Moves\n\n### Conditional Move Instructions\n\n- Instruction supports:\n  - if\
    \ (Test) Dest ← Src\n\n- Supported in post-1995 x86 processors\n\n- GCC tries\
    \ to use them\n  - But, only when known to be safe\n\n### Why?\n\n- Branches are\
    \ very disruptive to instruction flow through pipelines\n\n- Conditional moves\
    \ do not require control transfer\n\n### C Code\n\n```c\nval = Test\n  ? Then_Expr\n\
    \  : Else_Expr;\n```\n\n### Goto Version\n\n```c\nresult = Then_Expr;\neval =\
    \ Else_Expr;\nnt = !Test;\nif (nt) result = eval;\nreturn result;\n```\n\n## Conditional\
    \ Move Example\n\n```c\nlong absdiff\n(long x, long y)\n{\n    long result;\n\
    \    if (x > y)\n        result = x-y;\n    else\n        result = y-x;\n    return\
    \ result;\n}\n```\n\n| Register | Use(s) |\n|----------|--------|\n| %rdi    \
    \ | Argument x |\n| %rsi     | Argument y |\n| %rax     | Return value |\n\n```asm\n\
    absdiff:\n    movq    %rdi, %rax    # x\n    subq    %rsi, %rax    # result =\
    \ x-y\n    movq    %rsi, %rdx\n    subq    %rdi, %rdx    # eval = y-x\n    cmpq\
    \    %rsi, %rdi    # x:y\n    cmovle  %rdx, %rax    # if <=, result = eval\n \
    \   ret\n```\n\n## Bad Cases for Conditional Move\n\n### Expensive Computations\n\
    \n```c\nval = Test(x) ? Hard1(x) : Hard2(x);\n```\n\n- Both values get computed\n\
    - Only makes sense when computations are very simple\n\n### Risky Computations\n\
    \n```c\nval = p ? *p : 0;\n```\n\n- Both values get computed\n- May have undesirable\
    \ effects\n\n### Computations with side effects\n\n```c\nval = x > 0 ? x*=7 :\
    \ x+=3;\n```\n\n- Both values get computed\n- Must be side-effect free\n\n## Bad\
    \ Performance\n\n## Unsafe\n\n## Illegal\n\nBryant and O’Hallaron, Computer Systems:\
    \ A Programmer’s Perspective, Third Edition\n\n27\n\n## Exercise\n\n| SetX | Condition\
    \ | Description |\n|---|---|---|\n| sete | ZF | Equal / Zero |\n| setne | ~ZF\
    \ | Not Equal / Not Zero |\n| sets | SF | Negative |\n| setns | ~SF | Nonnegative\
    \ |\n| setg | ~(SF^OF) & ~ZF | Greater (Signed) |\n| setge | ~(SF^OF) | Greater\
    \ or Equal (Signed) |\n| setl | (SF^OF) | Less (Signed) |\n| setle | (SF^OF) \\\
    | ZF | Less or Equal (Signed) |\n| seta | ~CF & ~ZF | Above (unsigned) |\n| setb\
    \ | CF | Below (unsigned) |\n\n- `cmpq b,a` like computing `a-b` without setting\
    \ destination\n- **CF set** if carry out from most significant bit (used for unsigned\
    \ comparisons)\n- **ZF set** if `a == b`\n- **SF set** if `(a-b) < 0` (as signed)\n\
    - **OF set** if two’s-complement (signed) overflow\n  - `(a>0 && b<0 && (a-b)<0)\
    \ || (a<0 && b>0 && (a-b)>0)`\n\n```asm\nxor    %rax, %rax\nsub    $1, %rax\n\
    cmp    $2, %rax\nsetl   %al\nmovzbl %al, %eax\n```\n\n| %rax | SF | CF | OF |\
    \ ZF |\n|---|---|---|---|---|\n|  |  |  |  |  |\n|  |  |  |  |  |\n|  |  |  |\
    \  |  |\n|  |  |  |  |  |\n|  |  |  |  |  |\n\n## Exercise\n\n| SetX | Condition\
    \ | Description |\n|---|---|---|\n| sete | ZF | Equal / Zero |\n| setne | ~ZF\
    \ | Not Equal / Not Zero |\n| sets | SF | Negative |\n| setns | ~SF | Nonnegative\
    \ |\n| setg | ~(SF^OF) & ~ZF | Greater (Signed) |\n| setge | ~(SF^OF) | Greater\
    \ or Equal (Signed) |\n| setl | (SF^OF) | Less (Signed) |\n| setle | (SF^OF) |\
    \ Less or Equal (Signed) |\n| seta | ~CF&~ZF | Above (unsigned) |\n| setb | CF\
    \ | Below (unsigned) |\n\n- `cmpq b, a` like computing `a−b` without setting destination\n\
    - **CF set** if carry out from most significant bit (used for unsigned comparisons)\n\
    - **ZF set** if `a == b`\n- **SF set** if `(a−b) < 0` (as signed)\n- **OF set**\
    \ if two’s-complement (signed) overflow\n  - `(a>0 && b<0 && (a−b)<0) || (a<0\
    \ && b>0 && (a−b)>0)`\n\n```asm\nxor    %rax, %rax\nsub    $1, %rax\ncmp    $2,\
    \ %rax\nsetl   %al\nmovzbl %al, %eax\n```\n\n| %rax | SF | CF | OF | ZF |\n|---:|---:|---:|---:|---:|\n\
    | 0x0000 0000 0000 0000 | 0 | 0 | 0 | 1 |\n| 0xFFFF FFFF FFFF FFFF | 1 | 1 | 0\
    \ | 0 |\n| 0xFFFF FFFF FFFF FFFF | 1 | 0 | 0 | 0 |\n| 0xFFFF FFFF FFFF FF01 |\
    \ 1 | 0 | 0 | 0 |\n| 0x0000 0000 0000 0001 | 1 | 0 | 0 | 0 |\n"
