- raw:
  - '[PAGE 527]


    # # Disk Access Time Example


    +   ## Given:

    +   - Rotational rate = 7,200 RPM

    +   - Average seek time = 9 ms.

    +   - Avg # sectors/track = 400.


    +   ## Derived:

    +   - T_avg rotation = 1/2 x (60 secs/7200 RPM) x 1000 ms/sec = 4 ms.

    +   - T_avg transfer = 60/7200 RPM x 1/400 secs/track x 1000 ms/sec = 0.02 ms

    +   - T_access = 9 ms + 4 ms + 0.02 ms


    +   ## Important points:

    +   - Access time dominated by seek time and rotational latency.

    +   - First bit in a sector is the most expensive, the rest are free.

    +   - SRAM access time is about 4 ns/doubleword, DRAM about 60 ns

    +     - Disk is about 40,000 times slower than SRAM,

    +     - 2,500 times slower then DRAM.'
  - '[PAGE 528]


    # # Logical Disk Blocks


    +   - Modern disks present a simpler abstract view of the complex sector geometry:

    +     - The set of available sectors is modeled as a sequence of b-sized logical
    blocks (0, 1, 2, ...)


    +   - Mapping between logical blocks and actual (physical) sectors

    +     - Maintained by hardware/firmware device called disk controller.

    +     - Converts requests for logical blocks into (surface,track,sector) triples.


    +   - Allows controller to set aside spare cylinders for each zone.

    +     - Accounts for the difference in “formatted capacity” and “maximum capacity”.'
  - '[PAGE 529]


    # # I/O Bus


    CPU chip


    Register file


    ALU


    Bus interface


    System bus


    I/O bridge


    Memory bus


    Main memory


    I/O bus


    USB controller


    Graphics adapter


    Disk controller


    Mouse


    Keyboard


    Monitor


    Disk


    Expansion slots for other devices such as network adapters.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_529_0.png)


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_529_1.png)'
  - '[PAGE 530]


    # Reading a Disk Sector (1)


    CPU initiates a disk read by writing a command, logical block number, and destination
    memory address to a port (address) associated with disk controller.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_530_0.png)'
  - '[PAGE 531]


    # # Reading a Disk Sector (2)


    Disk controller reads the sector and performs a direct memory access (DMA) transfer
    into main memory.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_531_0.png)'
  - '[PAGE 532]


    # # Reading a Disk Sector (3)


    When the DMA transfer completes, the disk controller notifies the CPU with an
    *interrupt* (i.e., asserts a special “interrupt” pin on the CPU)


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_532_0.png)'
  - '[PAGE 533]


    # Solid State Disks (SSDs)


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_533_0.png)


    +   - Pages: 512KB to 4KB, Blocks: 32 to 128 pages

    +   - Data read/written in units of pages.

    +   - Page can be written only after its block has been erased

    +   - A block wears out after about 100,000 repeated writes.'
  - '[PAGE 534]


    <!-- no content -->'
  - '[PAGE 535]


    # # SSD Tradeoffs vs Rotating Disks


    # ## Advantages


    +   - No moving parts → faster, less power, more rugged


    # ## Disadvantages


    +   - Have the potential to wear out

    +     - Mitigated by “wear leveling logic” in flash translation layer

    +     - E.g. Intel SSD 730 guarantees 128 petabyte (128 x 10^15 bytes) of writes
    before they wear out


    +   - In 2015, about 30 times more expensive per byte


    # ## Applications


    +   - MP3 players, smart phones, laptops


    +   - Beginning to appear in desktops and servers'
  - '[PAGE 536]


    # The CPU-Memory Gap


    The gap *widens* between DRAM, disk, and CPU speeds.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_536_0.png)


    Bryant and O’Hallaron, Computer Systems: A Programmer’s Perspective, Third Edition'
  - '[PAGE 537]


