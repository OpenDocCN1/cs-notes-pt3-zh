    # # Rounding


    ▪ Rounding Modes (illustrate with $ rounding)


    | Rounding mode | $1.40 | $1.60 | $1.50 | $2.50 | −$1.50 |

    |---|---:|---:|---:|---:|---:|

    | Towards zero | $1 ↓ | $1 ↓ | $1 ↓ | $2 ↓ | −$1 ↑ |

    | Round down (−∞) | $1 ↓ | $1 ↓ | $1 ↓ | $2 ↓ | −$2 ↓ |

    | Round up (+∞) | $2 ↑ | $2 ↑ | $2 ↑ | $3 ↑ | −$1 ↑ |

    | Nearest Even (default) | $1 ↓ | $2 ↑ | $2 ↑ | $2 ↓ | −$2 ↓ |'
