    # Signed Multiplication in C


    Operands: w bits


    True Product: w× bits


    Discard w bits: w bits


    +   - **Standard Multiplication Function**

    +     - Ignores high order w bits

    +     - Some of which are different for signed vs. unsigned multiplication

    +     - Lower bits are the same


    # Power-of-2 Multiply with Shift


    +   - **Operation**

    +     - `u << k` gives `u * 2^k`

    +     - Both signed and unsigned

    +   - Operands: w bits

    +   - True Product: w+k bits

    +   - Discard k bits: w bits

    +   - **Examples**

    +     - `u << 3 == u * 8`

    +     - `(u << 5) - (u << 3) == u * 24`

    +     - Most machines shift and add faster than multiply

    +       - Compiler generates this code automatically


    # Unsigned Power-of-2 Divide with Shift


    +   - **Quotient of Unsigned by Power of 2**

    +     - `u >> k` gives `⌊u / 2^k⌋`

    +     - Uses logical shift


    | Division | Computed | Hex | Binary |

    |---|---:|---|---|

    | `x >> 1` | 756213 | 16 3B | 00000001 01110111 |

    | `x >> 2` | 950625 | 16 5B | 00000001 01011011 |

    | `x >> 3` | 9508125 | 90 03 | 00000000 10001101 |

    | `x >> 8` | 59.4257813 | 59 | 00000000 00111011 |


    # Today: Bits, Bytes, and Integers


    +   - Representing information as bits

    +   - Bit-level manipulations

    +   - **Integers**

    +     - Representation: unsigned and signed

    +     - Conversion, casting

    +     - Expanding, truncating

    +     - Addition, negation, multiplication, shifting

    +     - **Summary**

    +   - Representations in memory, pointers, strings


    # Arithmetic: Basic Rules


    +   - **Addition:**

    +     - Unsigned/signed: Normal addition followed by truncate, same operation
    on bit level

    +     - Unsigned: addition mod 2^w

    +       - Mathematical addition + possible subtraction of 2^w

    +     - Signed: modified addition mod 2^w (result in proper range)

    +       - Mathematical addition + possible addition or subtraction of 2^w

    +   - **Multiplication:**

    +     - Unsigned/signed: Normal multiplication followed by truncate, same operation
    on bit level

    +     - Unsigned: multiplication mod 2^w

    +     - Signed: modified multiplication mod 2^w (result in proper range)


