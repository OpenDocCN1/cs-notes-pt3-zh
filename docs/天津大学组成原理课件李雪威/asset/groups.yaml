    \ 16\ntypedef int fix_matrix[N][N];\n/* Get element A[i][j] */\nint fix_ele(fix_matrix\
    \ A,\n            size_t i, size_t j)\n{\n    return A[i][j];\n}\n```\n\n```c\n\
    #define IDX(n, i, j) ((i)*(n)+(j))\n/* Get element A[i][j] */\nint vec_ele(size_t\
    \ n, int *A,\n            size_t i, size_t j)\n{\n    return A[IDX(n,i,j)];\n\
    }\n```\n\n```c\n/* Get element a[i][j] */\nint var_ele(size_t n, int A[n][n],\n\
