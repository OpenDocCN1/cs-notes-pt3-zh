    Dividend:  \(x\)


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_78_0.png)


    Incremented by 1


    Binary Point


    Divisor:  \(\displaystyle /\;2^k\)


    \(\left\lceil x / 2^k \right\rceil\)


    Incremented by 1


    **Biasing adds 1 to final result**'
