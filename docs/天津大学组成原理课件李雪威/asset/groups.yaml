    # # 计算机的工作过程


    +   冯·诺依曼计算机特点基本上指出了计算机的工作过程。冯·诺依曼体系结构的基本思想是：存储程序，并且按照地址顺序自动执行。首先将指令和数据存储到计算机中，计算机启动后，就能够按顺序取出指令并依次执行，直到程序执行完毕，得到计算结果为止。


    +   冯·诺依曼体系结构计算机包含5个基本部件：运算器、控制器、存储器、输入设备和输出设备。运算器进行数据运算和数据变换；控制器为计算机的工作提供统一的时钟，对程序的各基本操作进行时序划分，产生相应的控制信号，驱动计算机的各部件有序地完成程序规定的操作内容；存储器用来存放程序、数据和运算结果；输入输出设备则完成相应的输入输出转换。


    +   一条指令操作包括：取指令、分析（译码）和执行指令3个阶段


    +   - PC→MAR，MDR →IR


    +   - OP（IR） → CU，操作数地址码→MAR，操作数→MDR，MDR →ACC


    +   - （PC）+1 →PC'
