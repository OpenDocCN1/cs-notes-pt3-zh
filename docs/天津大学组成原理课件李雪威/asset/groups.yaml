  - '[PAGE 42]


    # Sign Extension


    +   - **Task:**

    +     - Given w-bit signed integer x

    +     - Convert it to w+k-bit integer with same value

    +   - **Rule:**

    +     - Make k copies of sign bit

    +     - `X′ = x_{w−1}, …, x_{w−1}, x_{w−1}, x_{w−2}, …, x₀`


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_42_0.png)


    # Sign Extension Example


    ```

    ```c

    short int x = -15213;

    int      iy = x;

    short int y = -15213;

    int      iy = (int) y;

    ```

    ```


    |   | Decimal | Hex | Binary |

    |---|---:|---|---|

    | x | -15213 | 0x C4 93 | 1100 0100 1001 0011 |

    | ix | -15213 | 0x FF FF C4 93 | 11111111 11111111 11000100 10010011 |

    | y | -15213 | 0x C4 93 | 1100 0100 1001 0011 |

    | iy | -15213 | 0x FF FF C4 93 | 11111111 11111111 11000100 10010011 |


    +   - Converting from smaller to larger integer data type

    +   - C automatically performs sign extension


    # Summary: Expanding, Truncating: Basic Rules


    +   - **Expanding (e.g., short int to int)**

    +     - Unsigned: zeros added

    +     - Signed: sign extension

    +     - Both yield expected result

    +   - **Truncating (e.g., unsigned to unsigned short)**

    +     - Unsigned: signed bits are truncated

    +     - Result reinterpreted

    +     - Unsigned: mod operation

    +     - Signed: similar to mod

    +     - For small numbers yields expected behavior


    # Today: Bits, Bytes, and Integers


    +   - Representing information as bits

    +   - Bit-level manipulations

    +   - **Integers**

    +     - Representation: unsigned and signed

    +     - Conversion, casting

    +     - Expanding, truncating

    +     - **Addition, negation, multiplication, shifting**

    +   - Representations in memory, pointers, strings

    +   - Summary


    # Unsigned Addition


    Operands: w bits

    True Sum: w+1 bits

    Discard Carry: w bits

    `UAdd_w(u, v)`


    +   - **Standard Addition Function**

    +     - Ignores carry output

    +   - **Implements Modular Arithmetic**

    +     - `s = UAdd_w(u, v) = u + v mod 2^w`


    # Visualizing (Mathematical) Integer Addition


    +   - **Integer Addition**

    +     - 4-bit integers u, v

    +     - Compute true sum `Add₄(u, v)`

    +     - Values increase linearly with u and v

    +     - Forms planar surface


