- raw:
  - '[PAGE 511]


    # # Recording zones


    +   - Modern disks partition tracks into disjoint subsets called recording zones


    +   - Each track in a zone has the same number of sectors, determined by the circumference
    of innermost track.


    +   - Each zone has a different number of sectors/track, outer zones have more
    sectors/track than inner zones.


    +   - So we use average number of sectors/track when computing capacity.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_511_0.png)'
  - '[PAGE 512]


    # # Computing Disk Capacity


    Capacity = (# bytes/sector) x (avg. # sectors/track) x (# tracks/surface) x (#
    surfaces/platter) x (# platters/disk)


    # ## Example:


    +   - 512 bytes/sector

    +   - 300 sectors/track (on average)

    +   - 20,000 tracks/surface

    +   - 2 surfaces/platter

    +   - 5 platters/disk


    Capacity = 512 x 300 x 20,000 x 2 x 5

    = 30,720,000,000

    = 30.72 GB'
