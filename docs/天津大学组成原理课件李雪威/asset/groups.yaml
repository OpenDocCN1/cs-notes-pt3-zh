  - "[PAGE 362]\n\n# # Generating Pointer to Structure Member\n\n```\nstruct rec {\n\
    \    int a[4];\n    size_t i;\n    struct rec *next;\n};\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_362_0.png)\n\
    \n# ## Generating Pointer to Array Element\n\n+   - Offset of each structure member\
    \ determined at compile time\n+   - Compute as r + 4*idx\n\n```\nint *get_ap\n\
    (struct rec *r, size_t idx)\n{\n    return &r->a[idx];\n}\n```\n\n```\n# r in\
    \ %rdi, idx in %rsi\nleaq (%rdi,%rsi,4), %rax\nret\n```"
  - "[PAGE 363]\n\n# Following Linked List\n\n+   - C Code\n\n```\n```c\nvoid set_val\n\
    \    (struct rec *r, int val)\n{\n    while (r) {\n        int i = r->i;\n   \
    \     r->a[i] = val;\n        r = r->next;\n    }\n}\n```\n```\n\n```\n```c\n\
    struct rec {\n    int a[4];\n    int i;\n    struct rec *next;\n};\n```\n```\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_363_0.png)\n\n# Element i\n\n| Register\
    \ | Value |\n|---|---|\n| `%rdi` | `r` |\n| `%rsi` | `val` |\n\n```\n```asm\n\
    .L11:    # loop:\n    movslq  16(%rdi), %rax       # i = M[r+16]\n    movl   \
    \ %esi, (%rdi,%rax,4)   # M[r+4*i] = val\n    movq    24(%rdi), %rdi        #\
    \ r = M[r+24]\n    testq   %rdi, %rdi            # Test r\n    jne     .L11  \
    \                # if !=0 goto loop\n```\n```"
