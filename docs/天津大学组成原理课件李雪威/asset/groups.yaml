    +       - int tx, ty;

    +       - unsigned ux, uy;

    +       - tx = (int) ux;

    +       - uy = (unsigned) ty;

    +     - Implicit casting also occurs via assignments and procedure calls

    +       - tx = ty;

    +       - uy = ux;


    # # Casting Surprises


    +   - Expression Evaluation

    +     - If there is a unsigned and signed in single expression, signed values
    implicitly casted to unsigned

    +     - Including comparison operations <<, >>, <=, ==, >=, >

