  - "[PAGE 448]\n\n# # Convert Loop To Goto Form\n\n```\nvoid lower(char *s)\n{\n\
    \    size_t i = 0;\n    if (i >= strlen(s))\n        goto done;\n    loop:\n \
    \   if (s[i] >= 'A' && s[i] <= 'Z')\n        s[i] -= ('A' - 'a');\n    i++;\n\
    \    if (i < strlen(s))\n        goto loop;\n    done:\n}\n```\n\n+   - `strlen`\
