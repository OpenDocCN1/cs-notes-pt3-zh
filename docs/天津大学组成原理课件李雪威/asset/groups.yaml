    \ | Argument z |\n| %rax | Return value |\n\nNote that w not initialized here\n\
    \n## Switch Statement Example\n\n```c\nlong switch_eg(long x, long y, long z)\n\
    {\n    long w = 1;\n    switch(x) {\n    ...\n    }\n    return w;\n}\n```\n\n\
    ### Setup:\n\n```asm\nswitch_eg:\n    movq    %rdx, %rcx\n    cmpq    $6, %rdi\
    \        # x:6\n    ja      .L8             # Use default\n    jmp     *.L4(,%rdi,8)\
    \   # goto *JTab[x]\n```\n\n### Jump table\n\n```asm\n.section    .rodata\n  \
    \  .align 8\n.L4:\n    .quad   .L8             # x = 0\n    .quad   .L3      \
    \       # x = 1\n    .quad   .L5             # x = 2\n    .quad   .L9        \
    \     # x = 3\n    .quad   .L8             # x = 4\n    .quad   .L7          \
    \   # x = 5\n    .quad   .L7             # x = 6\n```\n\nBryant and O’Hallaron,\
    \ Computer Systems: A Programmer’s Perspective, Third Edition\n\n46\n\n## Assembly\
    \ Setup Explanation\n\n### Table Structure\n\n- Each target requires 8 bytes\n\
    - Base address at `.L4`\n\n### Jumping\n\n- Direct: `jmp .L8`\n- Jump target is\
    \ denoted by label `.L8`\n\n- Indirect: `jmp *.L4(,%rdi,8)`\n- Start of jump table:\
    \ `.L4`\n- Must scale by factor of 8 (addresses are 8 bytes)\n- Fetch target from\
    \ effective Address `.L4 + x*8`\n  - Only for `0 ≤ x ≤ 6`\n\n### Jump table\n\n\
    ```asm\n.section .rodata\n.align 8\n.L4:\n  .quad .L8  # x = 0\n  .quad .L3  #\
    \ x = 1\n  .quad .L5  # x = 2\n  .quad .L9  # x = 3\n  .quad .L8  # x = 4\n  .quad\
    \ .L7  # x = 5\n  .quad .L7  # x = 6\n```\n\n## Jump Table\n\n### Jump table\n\
    \n```asm\n.section .rodata\n.align 8\n.L4:\n\t.quad .L8 # x = 0\n\t.quad .L3 #\
    \ x = 1\n\t.quad .L5 # x = 2\n\t.quad .L9 # x = 3\n\t.quad .L8 # x = 4\n\t.quad\
    \ .L7 # x = 5\n\t.quad .L7 # x = 6\n```\n\n```c\nswitch(x) {\ncase 1: // .L3\n\
    w = y*z;\nbreak;\ncase 2: // .L5\nw = y/z;\n/* Fall Through */\ncase 3: // .L9\n\
    w += z;\nbreak;\ncase 5:\ncase 6: // .L7\nw -= z;\nbreak;\ndefault: // .L8\nw\
    \ = 2;\n}\n```\n\n## Code Blocks (x == 1)\n\n```c\nswitch(x) {\ncase 1: // .L3\n\
    w = y*z;\nbreak;\n... .\n}\n```\n\n```asm\n.L3:\nmovq %rsi, %rax # y\nimulq %rdx,\
    \ %rax # y*z\nret\n```\n\n| Register | Use(s) |\n|---|---|\n| %rdi | Argument\
    \ x |\n| %rsi | Argument y |\n| %rdx | Argument z |\n| %rax | Return value |\n\
    \n# Handling Fall-Through\n\n```\nlong w = 1;\n\nswitch(x) {\n  . . .\ncase 2:\n\
    \  w = y/z;\n  /* Fall Through */\ncase 3:\n  w += z;\n  break;\n  . . .\n}\n\
    ```\n\n```\ncase 2:\n  w = y/z;\n  goto merge;\n```\n\n```\ncase 3:\n  w = 1;\n\
    \nmerge:\n  w += z;\n```\n\n## Code Blocks (x == 2, x == 3)\n\n```c\nlong w =\
    \ 1;\n. . .\nswitch(x) {\n. . .\ncase 2:\n    w = y/z;\n    /* Fall Through */\n\
    case 3:\n    w += z;\n    break;\n. . .\n}\n```\n\n```asm\n.L5:              \
    \           # Case 2\n    movq   %rsi, %rax\n    cqto\n    idivq  %rcx       \
    \      # y/z\n    jmp    .L6              # goto merge\n.L9:                 \
    \        # Case 3\n    movl   $1, %eax         # w = 1\n.L6:                 \
    \        # merge:\n    addq   %rcx, %rax       # w += z\n    ret\n```\n\n| Register\
    \ | Use(s) |\n|----------|--------|\n| %rdi     | Argument x |\n| %rsi     | Argument\
    \ y |\n| %rdx     | Argument z |\n| %rax     | Return value |\n"
