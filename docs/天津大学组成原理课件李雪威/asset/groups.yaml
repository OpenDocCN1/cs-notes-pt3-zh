    # # Appendix: Cache Structure


    E = 2^e lines per set


    S = 2^s sets


    Address of word:


    t bits | s bits | b bits


    tag | set index | block offset


    data begins at this offset


    valid bit


    B = 2^b bytes per cache block (the data)


