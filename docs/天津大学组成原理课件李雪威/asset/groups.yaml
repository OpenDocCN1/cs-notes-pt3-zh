    +   - **ZF set** if `a == b`

    +   - **SF set** if `(a−b) < 0` (as signed)

    +   - **OF set** if two’s-complement (signed) overflow

    +     `(a>0 && b<0 && (a−b)<0) || (a<0 && b>0 && (a−b)>0)`


