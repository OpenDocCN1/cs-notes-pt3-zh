    # # x86-64 Linux Register Usage #1


    +   - **%rax**

    +     - Return value

    +     - Also caller-saved

    +     - Can be modified by procedure

    +   - **%rdi, ..., %r9**

    +     - Arguments

    +     - Also caller-saved

    +     - Can be modified by procedure

    +   - **%r10, %r11**

    +     - Caller-saved

    +     - Can be modified by procedure


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_310_0.png)'
  - '[PAGE 311]


    # # x86-64 Linux Register Usage #2


    +   - %rbx, %r12, %r13, %r14

    +     - Callee-saved

    +     - Callee must save & restore

    +   - %rbp

    +     - Callee-saved

    +     - Callee must save & restore

    +     - May be used as frame pointer

    +     - Can mix & match

    +   - %rsp

    +     - Special form of callee save

    +     - Restored to original value upon exit from procedure


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_311_0.png)'
