  - '[PAGE 441]


    # Limitations of Optimizing Compilers


    +   - **Operate under fundamental constraint**

    +     - Must not cause any change in program behavior

    +       - Except, possibly when program making use of nonstandard language features

    +     - Often prevents it from making optimizations that would only affect behavior
    under pathological conditions.

    +   - **Behavior that may be obvious to the programmer can be obfuscated by languages
    and coding styles**

    +     - e.g., Data ranges may be more limited than variable types suggest

    +   - **Most analysis is performed only within procedures**

    +     - Whole-program analysis is too expensive in most cases

    +     - Newer versions of GCC do interprocedural analysis within individual files

    +       - But, not between code in different files

    +   - **Most analysis is based only on *static* information**

    +     - Compiler has difficulty anticipating run-time inputs

    +   - **When in doubt, the compiler must be conservative**'
  - "[PAGE 442]\n\n# # Generally Useful Optimizations\n\n+   - Optimizations that\
