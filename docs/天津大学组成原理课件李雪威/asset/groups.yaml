    \ |\n|---|\n| `int A1[3][5]` |\n| `int *A2[3][5]` |\n| `int (*A3)[3][5]` |\n|\
    \ `int *(A4[3][5])` |\n| `int (*A5[3])[5]` |\n\nA1\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_358_0.png)\n\
    \nA2/A4\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_358_1.png)\n\nA3\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_358_2.png)\n\
    \nA5\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_358_3.png)\n\n## Understanding\
    \ Pointers & Arrays #3\n\n| Decl | An | | | *An | | | **An | | |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | | Cmp | Bad | Size | Cmp | Bad | Size | Cmp | Bad | Size |\n| int A1[3][5] |\
    \ Y | N | 60 | Y | N | 20 | Y | N | 4 |\n| int *A2[3][5] | Y | N | 120 | Y | N\
    \ | 40 | Y | N | 8 |\n| int (*A3)[3][5] | Y | N | 8 | Y | Y | 60 | Y | Y | 20\
    \ |\n| int *(A4[3][5]) | Y | N | 120 | Y | N | 40 | Y | N | 8 |\n| int (*A5[3])[5]\
    \ | Y | N | 24 | Y | N | 8 | Y | Y | 20 |\n\n- Cmp: Compiles (Y/N)\n- Bad: Possible\
    \ bad pointer reference (Y/N)\n- Size: Value returned by sizeof\n\n| Decl | ***An\
    \ | | |\n|---|---|---|---|\n| | Cmp | Bad | Size |\n| int A1[3][5] | N | – | –\
    \ |\n| int *A2[3][5] | Y | Y | 4 |\n| int (*A3)[3][5] | Y | Y | 4 |\n| int *(A4[3][5])\
    \ | Y | Y | 4 |\n| int (*A5[3])[5] | Y | Y | 4 |\n\n## Today\n\n- Arrays\n  -\
    \ One-dimensional\n  - Multi-dimensional (nested)\n  - Multi-level\n- Structures\n\
    \  - Allocation\n  - Access\n  - Alignment\n- Floating Point\n\n## Generating\
    \ Pointer to Structure Member\n\n```c\nstruct rec {\n    int a[4];\n    size_t\
    \ i;\n    struct rec *next;\n};\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_362_0.png)\n\
    \n## Generating Pointer to Array Element\n\n- Offset of each structure member\
    \ determined at compile time\n- Compute as r + 4*idx\n\n```c\nint *get_ap\n(struct\
    \ rec *r, size_t idx)\n{\n    return &r->a[idx];\n}\n```\n\n```asm\n# r in %rdi,\
    \ idx in %rsi\nleaq (%rdi,%rsi,4), %rax\nret\n```\n\n## Following Linked List\n\
    \n- C Code\n\n```c\nvoid set_val\n    (struct rec *r, int val)\n{\n    while (r)\
    \ {\n        int i = r->i;\n        r->a[i] = val;\n        r = r->next;\n   \
    \ }\n}\n```\n\n```c\nstruct rec {\n    int a[4];\n    int i;\n    struct rec *next;\n\
    };\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_363_0.png)\n\n## Element i\n\
    \n| Register | Value |\n|---|---|\n| `%rdi` | `r` |\n| `%rsi` | `val` |\n\n```asm\n\
    .L11:    # loop:\n    movslq  16(%rdi), %rax       # i = M[r+16]\n    movl   \
    \ %esi, (%rdi,%rax,4)   # M[r+4*i] = val\n    movq    24(%rdi), %rdi        #\
    \ r = M[r+24]\n    testq   %rdi, %rdi            # Test r\n    jne     .L11  \
    \                # if !=0 goto loop\n```\n\n## Structures & Alignment\n\n### Unaligned\
    \ Data\n\nstruct S1 {\nchar c;\nint i[2];\ndouble v;\n} *p;\n\n### Aligned Data\n\
    \n- Primitive data type requires $K$ bytes\n- Address must be multiple of $K$\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_364_0.png)\n\np+0\np+4\np+8\np+16\n\
    p+24\nMultiple of 4\nMultiple of 8\nMultiple of 8\nMultiple of 8\n\n## Specific\
    \ Cases of Alignment (x86-64)\n\n- **1 byte: `char`, …**\n  - no restrictions\
    \ on address\n- **2 bytes: `short`, …**\n  - lowest 1 bit of address must be 0₂\n\
    - **4 bytes: `int`, `float`, …**\n  - lowest 2 bits of address must be 00₂\n-\
    \ **8 bytes: `double`, `long`, `char *`, …**\n  - lowest 3 bits of address must\
    \ be 000₂\n\n## Satisfying Alignment with Structures\n\n- **Within structure:**\n\
    \  - Must satisfy each element’s alignment requirement\n- **Overall structure\
    \ placement**\n  - Each structure has alignment requirement K\n    - K = Largest\
    \ alignment of any element\n  - Initial address & structure length must be multiples\
    \ of K\n- **Example:**\n  - K = 8, due to **double** element\n\n```c\nstruct S1\
    \ {\n    char c;\n    int i[2];\n    double v;\n} *p;\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_367_0.png)\n\
    \n## Meeting Overall Alignment Requirement\n\n- For largest alignment requirement\
    \ K\n- Overall structure must be multiple of K\n\n```c\nstruct S2 {\n    double\
    \ v;\n    int i[2];\n    char c;\n} *p;\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_368_0.png)\n\
    \nMultiple of K=8\n\n"
