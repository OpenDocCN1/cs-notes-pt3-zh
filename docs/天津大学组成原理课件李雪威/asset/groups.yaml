  - "[PAGE 352]\n\n# # N X N Matrix\n## Code\n\n+   - **Fixed dimensions**\n+    \
    \ - Know value of *N* at compile time\n+   - **Variable dimensions, explicit indexing**\n\
    +     - Traditional way to implement dynamic arrays\n+   - **Variable dimensions,\
    \ implicit indexing**\n+     - Now supported by gcc\n\n```\n```c\n#define N 16\n\
    typedef int fix_matrix[N][N];\n/* Get element A[i][j] */\nint fix_ele(fix_matrix\
    \ A,\n            size_t i, size_t j)\n{\n    return A[i][j];\n}\n```\n```\n\n\
    ```\n```c\n#define IDX(n, i, j) ((i)*(n)+(j))\n/* Get element A[i][j] */\nint\
    \ vec_ele(size_t n, int *A,\n            size_t i, size_t j)\n{\n    return A[IDX(n,i,j)];\n\
    }\n```\n```\n\n```\n```c\n/* Get element a[i][j] */\nint var_ele(size_t n, int\
    \ A[n][n],\n            size_t i, size_t j) {\n    return A[i][j];\n}\n```\n```"
