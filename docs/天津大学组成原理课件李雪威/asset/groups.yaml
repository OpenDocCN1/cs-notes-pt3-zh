    \n- 辅助存储器（外存储器，简称辅存或外存）用来存放当前暂时不用的程序和数据，在需要时可与主存成批交换数据。常用的外存储器有磁盘机，磁带机和光盘机等。外存储器属于外部设备。\n\
    \n## 总线Bus\n\n如果说主板（Mother Board）是一座城市，那么总线就像是城市里的公共汽车（bus），能按照固定行车路线，传输来回不停运作的比特（bit）。这些线路在同一时间内都仅能负责传输一个比特。因此，必须同时采用多条线路才能传送更多数据，而总线可同时传输的数据数就称为宽度（width），以比特为单位，总线宽度愈大，传输性能就愈佳。\n\
    \n- 数据总线（Data Bus）：在CPU与RAM之间来回传送需要处理或是需要储存的数据。\n\n- 地址总线（Address Bus）：用来指定在RAM（Random\
    \ Access Memory）之中储取的数据的地址。\n\n- 控制总线（Control Bus）：将微处理器控制单元（Control Unit）的信号，传送到周边设备。\n\
    \n## 计算机的性能指标\n\n### 基本字长\n\n指计算机内，表示一个操作数或一条指令所用的基本二进制位数。\n\n- 是CPU一次能处理的数据宽度，与加法器、寄存器的位数和内部数据总线的宽度等有关。\n\
    - 字长标志着精度，字长越长，运算精度越高。\n- 影响计算机的处理能力和运行性能。\n- 通常选字节的整数倍：2、4、8倍等。\n\n### 主存容量\n\
    \n计算机主存储器所能够存储的信息的全部总量，称为主存容量。以字节数来表示存储容量的计算机称为字节编码计算机；而以字为单位编址的计算机，存储容量等于字数乘以字长。\n\
    \n### 主频\n\n每台计算机的内部都有一个不断地产生固定频率时钟脉冲的装置，称为主时钟。主时钟的频率通常是机器的主频率，主频率是衡量一台计算机速度的重要参数。\n\
    \n运算速度：运算速度通常反映计算机运算的快慢。对运算速度的衡量有以下几种方法：\n\n- 根据不同类型指令在计算过程中出现的频率乘上不同的系数，求得统计平均值，这时所指的运算速度是平均运算速度。\n\
    - 直接给出每条指令的实际执行时间。\n- 以MIPS和MFLOPS作为计量单位来衡量运算速度。MIPS表示每秒百万条指令，MFLOPS表示每秒百万次浮点运算。\n\
    \n1. 吞吐量、响应时间\n\n(1) 吞吐量：单位时间内可执行程序的个数。\n\n(2) 响应时间：从事件开始到事件结束的时间，也称执行时间。\n\n\
    ## 2. 主频、CPU时钟周期、CPI、CPU执行时间\n\n（1）主频：CPU工作主时钟的频率，机器主频f或Rc\n\n（2）CPU时钟周期：机器主频的倒数，Tc\n\
    \n（3）CPI：执行一条指令所需要的平均时钟周期\n\n（4）CPU执行时间：T<sub>CPU</sub>=In×CPI×Tc\n\nIn执行程序中指令的总数，CPI执行每条指令所需的平均时钟周期数，TC时钟周期时间的长度。\n\
    \n## 3. MIPS、MFLOPS\n\n（1）MIPS (Million Instructions Per Second)：CPU每秒钟平均执行的整数指令条数（百万条）\n\
    \nMIPS = In/(T_CPU × 10⁶)\n= In/(In × CPI × Tc × 10⁶)\n= Rc/(CPI × 10⁶)\n\nIn：执行该程序的总指令条数，T_CPU：执行该程序的总时间，Tc：CPU时钟周期，Rc：主频\
    \ Rc=1/Tc\n\nMIPS只适合评价标量机，不适合评价向量机。标量机执行一条指令，得到一个运行结果。而向量机执行一条指令，可以得到多个运算结果。\n\
    \n（2）MFLOPS(Million Floating Point Operations Per Second)：每秒钟平均执行的浮点数的运算次数(百万次)\
    \ MFLOPS=Ifn/(T_CPU×10^6) Ifn：程序中浮点数的运算次数 MFLOPS测量单位比较适合于衡量向量机的性能。一般而言，同一程序运行在不同的计算机上时往往会执行不同数量的指令数，但所执行的浮点数个数常常是相同的。\n\
    \n"
