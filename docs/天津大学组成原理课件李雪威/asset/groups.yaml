    \ Design\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_486_0.png)\n\n## Branch Outcomes\n\
    \n- When encounter conditional branch, cannot determine where to continue fetching\n\
    \  - Branch Taken: Transfer control to branch target\n  - Branch Not-Taken: Continue\
    \ with next instruction in sequence\n- Cannot resolve until outcome determined\
    \ by branch/integer unit\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_487_0.png)\n\
    \n## Branch Prediction\n\n### Idea\n\n- Guess which way branch will go\n- Begin\
    \ executing instructions at predicted position\n  - But don’t actually modify\
    \ register or memory data\n\n```\n404663:       mov     $0x0,%eax\n404668:   \
    \    cmp     (%rdi),%rsi\n40466b:       jge     404685\n40466d:       mov    \
    \ 0x8(%rdi),%rax\n        . . .\n404685:       repz retq\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_488_0.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_488_1.png)\n\n## Branch Prediction\
    \ Through Loop\n\n```\n401029: vmulsd (%rdx), %xmm0, %xmm0\n40102d: add $0x8,\
    \ %rdx\n401031: cmp %rax, %rdx\n401034: jne 401029\ni = 98\n```\n\n```\n401029:\
    \ vmulsd (%rdx), %xmm0, %xmm0\n40102d: add $0x8, %rdx\n401031: cmp %rax, %rdx\n\
    401034: jne 401029\ni = 99\n```\n\n```\n401029: vmulsd (%rdx), %xmm0, %xmm0\n\
    40102d: add $0x8, %rdx\n401031: cmp %rax, %rdx\n401034: jne 401029\ni = 100\n\
    ```\n\n```\n401029: vmulsd (%rdx), %xmm0, %xmm0\n40102d: add $0x8, %rdx\n401031:\
    \ cmp %rax, %rdx\n401034: jne 401029\ni = 101\n```\n\nAssume vector length = 100\n\
    \nPredict Taken (OK)\n\nPredict Taken (Oops)\n\nRead invalid location\n\nExecuted\n\
    \nFetched\n\nBryant and O’Hallaron, Computer Systems: A Programmer’s Perspective,\
    \ Third Edition\n\n53\n\n## Branch Misprediction Invalidation\n\n```\n401029:\
    \ vmulsd (%rdx), %xmm0, %xmm0\n40102d: add $0x8, %rdx\n401031: cmp %rax, %rdx\n\
    401034: jne 401029\n```\n\n```\n401029: vmulsd (%rdx), %xmm0, %xmm0\n40102d: add\
    \ $0x8, %rdx\n401031: cmp %rax, %rdx\n401034: jne 401029\n```\n\n```\n401029:\
    \ vmulsd (%rdx), %xmm0, %xmm0\n40102d: add $0x8, %rdx\n401031: cmp %rax, %rdx\n\
    401034: jne 401029\n```\n\n```\n401029: vmulsd (%rdx), %xmm0, %xmm0\n40102d: add\
    \ $0x8, %rdx\n401031: cmp %rax, %rdx\n401034: jne 401029\n```\n\nAssume vector\
    \ length = 100\n\ni = 98\n\nPredict Taken (OK)\n\ni = 99\n\nPredict Taken (Oops)\n\
    \ni = 100\n\nInvalidate\n\ni = 101\n\n## Branch Misprediction Recovery\n\n```\n\
    401029: vmulsd (%rdx),%xmm0,%xmm0\n40102d: add $0x8,%rdx\n401031: cmp %rax,%rdx\n\
    i = 99\n401034: jne 401029\n401036: jmp 401040\n...\n401040: vmovsd %xmm0,(%r12)\n\
    ```\n\nDefinitely not taken\n\nReload Pipeline\n\n### Performance Cost\n\n- Multiple\
