    \n### Convert Loop To Goto Form\n\n```c\nvoid lower(char *s)\n{\n    size_t i\
    \ = 0;\n    if (i >= strlen(s))\n        goto done;\n    loop:\n    if (s[i] >=\
    \ 'A' && s[i] <= 'Z')\n        s[i] -= ('A' - 'a');\n    i++;\n    if (i < strlen(s))\n\
    \        goto loop;\n    done:\n}\n```\n\n- `strlen` executed every iteration\n\
    \n### Calling Strlen\n\n```c\n/* My version of strlen */\nsize_t strlen(const\
