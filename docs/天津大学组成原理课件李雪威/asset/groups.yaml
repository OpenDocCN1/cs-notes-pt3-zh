  md: "\n## Disk Access Time Example\n\n### Given:\n\n- Rotational rate = 7,200 RPM\n\
    - Average seek time = 9 ms.\n- Avg # sectors/track = 400.\n\n### Derived:\n\n\
    - T_avg rotation = 1/2 x (60 secs/7200 RPM) x 1000 ms/sec = 4 ms.\n- T_avg transfer\
    \ = 60/7200 RPM x 1/400 secs/track x 1000 ms/sec = 0.02 ms\n- T_access = 9 ms\
    \ + 4 ms + 0.02 ms\n\n### Important points:\n\n- Access time dominated by seek\
    \ time and rotational latency.\n- First bit in a sector is the most expensive,\
    \ the rest are free.\n- SRAM access time is about 4 ns/doubleword, DRAM about\
    \ 60 ns\n  - Disk is about 40,000 times slower than SRAM,\n  - 2,500 times slower\
    \ than DRAM.\n\n## Logical Disk Blocks\n\n- Modern disks present a simpler abstract\
    \ view of the complex sector geometry:\n  - The set of available sectors is modeled\
    \ as a sequence of b-sized logical blocks (0, 1, 2, ...)\n- Mapping between logical\
    \ blocks and actual (physical) sectors\n  - Maintained by hardware/firmware device\
    \ called disk controller.\n  - Converts requests for logical blocks into (surface,track,sector)\
    \ triples.\n- Allows controller to set aside spare cylinders for each zone.\n\
    \  - Accounts for the difference in “formatted capacity” and “maximum capacity”.\n\
    \n## I/O Bus\n\nCPU chip\n\nRegister file\n\nALU\n\nBus interface\n\nSystem bus\n\
    \nI/O bridge\n\nMemory bus\n\nMain memory\n\nI/O bus\n\nUSB controller\n\nGraphics\
    \ adapter\n\nDisk controller\n\nMouse\n\nKeyboard\n\nMonitor\n\nDisk\n\nExpansion\
    \ slots for other devices such as network adapters.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_529_0.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_529_1.png)\n\n## Reading a Disk Sector\
    \ (1)\n\nCPU initiates a disk read by writing a command, logical block number,\
    \ and destination memory address to a port (address) associated with disk controller.\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_530_0.png)\n\n## Reading a Disk Sector\
    \ (2)\n\nDisk controller reads the sector and performs a direct memory access\
    \ (DMA) transfer into main memory.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_531_0.png)\n\
    \n## Reading a Disk Sector (3)\n\nWhen the DMA transfer completes, the disk controller\
    \ notifies the CPU with an *interrupt* (i.e., asserts a special “interrupt” pin\
    \ on the CPU)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_532_0.png)\n\n## Solid\
    \ State Disks (SSDs)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_533_0.png)\n\n\
    - Pages: 512B to 4KB, Blocks: 32 to 128 pages\n- Data read/written in units of\
    \ pages.\n- Page can be written only after its block has been erased\n- A block\
    \ wears out after about 100,000 repeated writes.\n\n## SSD Tradeoffs vs Rotating\
    \ Disks\n\n### Advantages\n\n- No moving parts → faster, less power, more rugged\n\
    \n### Disadvantages\n\n- Have the potential to wear out\n  - Mitigated by “wear\
    \ leveling logic” in flash translation layer\n  - E.g. Intel SSD 730 guarantees\
    \ 128 petabyte (128 x 10^15 bytes) of writes before they wear out\n- In 2015,\
    \ about 30 times more expensive per byte\n\n### Applications\n\n- MP3 players,\
    \ smart phones, laptops\n- Beginning to appear in desktops and servers\n\n## The\
    \ CPU-Memory Gap\n\nThe gap *widens* between DRAM, disk, and CPU speeds.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_536_0.png)\n\
    \nBryant and O’Hallaron, Computer Systems: A Programmer’s Perspective, Third Edition\n\
    \n## Locality to the Rescue!\n\nThe key to bridging this CPU-Memory gap is a fundamental\
    \ property of computer programs known as **locality**\n\n## Today\n\n- Storage\
    \ technologies and trends\n- **Locality of reference**\n- Caching in the memory\
    \ hierarchy\n\n## Locality\n\n- **Principle of Locality:** Programs tend to use\
    \ data and instructions with addresses near or equal to those they have used recently\n\
    \n- **Temporal locality:**\n  - Recently referenced items are likely to be referenced\
    \ again in the near future\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_539_0.png)\n\
    \n- **Spatial locality:**\n  - Items with nearby addresses tend to be referenced\
    \ close together in time\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_539_1.png)\n"
