    \ memory reads and writes\n  - To learn more... man valgrind\n\n- Finding memory\
    \ leaks\n  - `$ valgrind --leak-resolution=high --leak-check=full --show-reachable=yes\
    \ --track-fds=yes ./myProgram arg1 arg2`\n\n## Appendix: Clang / LLVM\n\n- Clang\
    \ is a (gcc equivalent) C compiler\n  - Support for code analyses and transformation\n\
    \  - Compiler will check you variable usage and declarations\n  - Compiler will\
    \ create code recording all memory accesses to a file\n  - Useful for Cache Lab\
    \ Part B (Matrix Transpose)\n\n## Appendix: Cache Structure\n\nE = 2^e lines per\
    \ set\n\nS = 2^s sets\n\nAddress of word:\n\nt bits | s bits | b bits\n\ntag |\
