    | 2147483647| -2147483647-1 | > | unsigned |

    | -1        | -2        | >        | signed   |

    | (unsigned) -1 | -2 | > | unsigned |

    | 2147483647| 2147483648U | < | unsigned |

    | 2147483647| (int) 2147483648U | > | signed |


