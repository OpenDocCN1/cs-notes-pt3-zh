  - '[PAGE 465]


    # # Superscalar Processor


    +   - **Definition**: A superscalar processor can issue and execute *multiple
    instructions in one cycle*. The instructions are retrieved from a sequential instruction
    stream and are usually scheduled dynamically.


    +   - **Benefit**: without programming effort, superscalar processor can take
    advantage of the *instruction level parallelism* that most programs have


    +   - Most modern CPUs are superscalar.


    +   - Intel: since Pentium (1993)'
  - "[PAGE 466]\n\n# # Pipelined Functional Units\n\n```\nlong mult_eg(long a, long\
    \ b, long c) {\n    long p1 = a*b;\n    long p2 = a*c;\n    long p3 = p1 * p2;\n\
    \    return p3;\n}\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_466_0.png)\n\
    \n|  | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|\n| Stage\
    \ 1 | a*b | a*c |  |  | p1*p2 |  |  |\n| Stage 2 |  | a*b | a*c |  |  | p1*p2\
    \ |  |\n| Stage 3 |  |  | a*b | a*c |  |  | p1*p2 |\n\n+   - Divide computation\
    \ into stages\n+   - Pass partial computations from stage to stage\n+   - Stage\
    \ i can start on new computation once values passed to i+1\n+   - E.g., complete\
    \ 3 multiplications in 7 cycles, even though each requires 3 cycles"
  - '[PAGE 467]


    # # Haswell CPU


    +   - 8 Total Functional Units


    +   - Multiple instructions can execute in parallel


    2 load, with address computation

    1 store, with address computation

    4 integer

    2 FP multiply

    1 FP add

    1 FP divide


    +   - Some instructions take > 1 cycle, but can be pipelined


    | Instruction | Latency | Cycles/Issue |

    |---|---|---|

    | Load / Store | 4 | 1 |

    | Integer Multiply | 3 | 1 |

    | Integer/Long Divide | 3-30 | 3-30 |

    | Single/Double FP Multiply | 5 | 1 |

    | Single/Double FP Add | 3 | 1 |

    | Single/Double FP Divide | 3-15 | 3-15 |'
