    # Properties of Unsigned Arithmetic


    +   - **Unsigned Multiplication with Addition Forms Commutative Ring**

    +     - Addition is commutative group

    +     - Closed under Multiplication

    +       - $0 \leq UMult(u,v) \leq 2^w - 1$

    +     - Multiplication Commutative

    +       - $UMult(u,v) = UMult(v,u)$

    +     - Multiplication is Associative

    +       - $UMult(u, UMult(v,w)) = UMult(UMult(u,v),w)$

    +     - 1 is multiplicative identity

    +       - $UMult(u,1) = u$

    +     - Multiplication distributes over addition

    +       - $UMult(u, UAdd(v,w)) = UAdd(UMult(u,v), UMult(u,w))$


    # Properties of Two’s Comp. Arithmetic


    +   - **Isomorphic Algebras**

    +     - Unsigned multiplication and addition

    +       - Truncating to w bits

    +     - Two’s complement multiplication and addition

    +       - Truncating to w bits

    +   - **Both Form Rings**

    +     - Isomorphic to ring of integers mod $2^w$

    +   - **Comparison to (Mathematical) Integer Arithmetic**

    +     - Both are rings

    +     - Integers obey ordering properties, e.g.,

    +       - $u \geq 0 \Rightarrow u+v \geq v$

    +       - $u \geq 0, v > 0 \Rightarrow u \cdot v > 0$

    +     - These properties are not obeyed by two’s comp. arithmetic

    +       - $TMax + 1 = TMin$

    +       - $1, 2, 3, \ldots, 2^{w-1}-1, TMin, \ldots, -2, -1, 0$ (16-bit words)


    # Reading Byte-Reversed Listings


    +   - **Disassembly**

    +     - Text representation of binary machine code

    +     - Generated by program that reads the machine code

    +   - **Example**


    | Address | Instruction Code | Assembly Rendition |

    |---|---|---|

    | 80483e5: | 5b | pop | %ebx |

    | 80483e6: | 81 c3 ab 12 00 00 | add | $0x12ab, %ebx |

    | 80483ec: | 83 2c 28 00 | subl | $0x0, (%eax, %ebp, 1) |


    +   - **Deciphering Numbers**

    +     - Value: $0x12ab$

    +     - Pad to 32 bits: $0x000012ab$

    +     - Split into bytes: $00\ 00\ 12\ ab$

    +     - Reverse: $ab\ 12\ 00\ 00$'
