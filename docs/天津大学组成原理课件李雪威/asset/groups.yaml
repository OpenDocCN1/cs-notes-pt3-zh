    \ jump\n  - Conditional move\n  - Indirect jump (via jump tables)\n  - Compiler\
    \ generates code sequence to implement more complex control\n\n- **Standard Techniques**\n\
    \  - Loops converted to do-while or jump-to-middle form\n  - Large switch statements\
    \ use jump tables\n  - Sparse switch statements may use decision trees (if-elseif-elseif-else)\n\
    \n## Mechanisms in Procedures\n\n### Passing control\n\n- To beginning of procedure\
    \ code\n- Back to return point\n\n### Passing data\n\n- Procedure arguments\n\
    - Return value\n\n### Memory management\n\n- Allocate during procedure execution\n\
    - Deallocate upon return\n\n### Mechanisms all implemented with machine instructions\n\
    \n### x86-64 implementation of a procedure uses only those mechanisms required\n\
    \nP(...) {\n  ...\n  y = Q(x);\n  print(y)\n  ...\n}\n\nint Q(int i)\n{\n  int\
    \ t = 3*i;\n  int v[10];\n  ...\n  ...\n  return v[t];\n}\n\n## Mechanisms in\
    \ Procedures\n\nMachine instructions implement the mechanisms, but the choices\
    \ are determined by designers. These choices make up the **Application Binary\
    \ Interface (ABI)**.\n\n- Deallocate upon return\n- **Mechanisms all implemented\
    \ with machine instructions**\n- **x86-64 implementation of a procedure uses only\
    \ those mechanisms required**\n\n## Today\n\n- **Procedures**\n  - **Stack Structure**\n\
    \  - Calling Conventions\n    - Passing control\n    - Passing data\n    - Managing\
    \ local data\n  - Illustration of Recursion\n\n## x86-64 Stack\n\n- Region of\
    \ memory managed with stack discipline\n  - Memory viewed as array of bytes.\n\
    \  - Different regions have different purposes.\n  - (Like ABI, a policy decision)\n\
    \n## x86-64 Stack\n\n- Region of memory managed with stack discipline\n\nStack\
    \ \"Bottom\"\n\nStack Pointer: `%rsp`\n\nStack \"Top\"\n\n"
