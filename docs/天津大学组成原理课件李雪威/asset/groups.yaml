  md: "\n\n## x86-64 Linux Register Usage #1\n\n- **%rax**\n  - Return value\n  -\
    \ Also caller-saved\n  - Can be modified by procedure\n- **%rdi, ..., %r9**\n\
    \  - Arguments\n  - Also caller-saved\n  - Can be modified by procedure\n- **%r10,\
    \ %r11**\n  - Caller-saved\n  - Can be modified by procedure\n\n## x86-64 Linux\
    \ Register Usage #2\n\n- %rbx, %r12, %r13, %r14\n  - Callee-saved\n  - Callee\
    \ must save & restore\n- %rbp\n  - Callee-saved\n  - Callee must save & restore\n\
    \  - May be used as frame pointer\n  - Can mix & match\n- %rsp\n  - Special form\
    \ of callee save\n  - Restored to original value upon exit from procedure\n\n\
    ## Small Exercise\n\n```c\nlong add5(long b0, long b1, long b2, long b3, long\
    \ b4) {\n    return b0+b1+b2+b3+b4;\n}\n\nlong add10(long a0, long a1, long a2,\
    \ long a3, long a4, long a5,\n           long a6, long a7, long a8, long a9) {\n\
    \    return add5(a0, a1, a2, a3, a4)+\n           add5(a5, a6, a7, a8, a9);\n\
    }\n```\n\n- Where are a0,..., a9 passed?\n  - rdi, rsi, rdx, rcx, r8, r9, stack\n\
    \n- Where are b0,..., b4 passed?\n  - rdi, rsi, rdx, rcx, r8\n\n- Which registers\
    \ do we need to save?\n  - Ill-posed question. Need assembly.\n  - rbx, rbp, r9\
    \ (during first call to add5)\n\n## Small Exercise\n\n```c\nlong add5(long b0,\
    \ long b1, long b2, long b3, long b4) {\n  return b0+b1+b2+b3+b4;\n}\n\nlong add10(long\
