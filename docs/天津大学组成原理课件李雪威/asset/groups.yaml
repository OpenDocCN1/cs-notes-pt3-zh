  mdcn: "\n\n## Today\n\n- Cache memory organization and operation\n- Performance\
    \ impact of caches\n- The memory mountain\n- Rearranging loops to improve spatial\
    \ locality\n- Using blocking to improve temporal locality\n\n## General Cache\
    \ Concepts\n\nCache\nSmaller, faster, more expensive memory caches a subset of\
    \ the blocks\n\nData is copied in block-sized transfer units\n\nMemory\nLarger,\
    \ slower, cheaper memory viewed as partitioned into “blocks”\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_565_0.png)\n\
    \n## General Cache Concepts: Hit\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_566_0.png)\n\
    \nData in block b is needed\n\nBlock b is in cache:\n\nHit!\n\nBryant and O'Hallaron,\
    \ Computer Systems: A Programmer's Perspective, Third Edition\n\n## General Cache\
    \ Concepts: Miss\n\nData in block b is needed\nBlock b is not in cache: **Miss!**\n\
    Block b is fetched from memory\nBlock b is stored in cache\n• Placement policy:\
    \ determines where b goes\n• Replacement policy: determines which block gets evicted\
    \ (victim)\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_567_0.png)\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_567_1.png)\n\
    \nBryant and O'Hallaron, Computer Systems: A Programmer's Perspective, Third Edition\n\
    \n7\n\n## General Caching Concepts: Types of Cache Misses\n\n### Cold (compulsory)\
    \ miss\n- Cold misses occur because the cache is empty.\n\n### Conflict miss\n\
    - Most caches limit blocks at level k+1 to a small subset (sometimes a singleton)\
    \ of the block positions at level k.\n  - E.g. Block i at level k+1 must be placed\
    \ in block (i mod 4) at level k.\n- Conflict misses occur when the level k cache\
    \ is large enough, but multiple data objects all map to the same level k block.\n\
    \  - E.g. Referencing blocks 0, 8, 0, 8, 0, 8, ... would miss every time.\n\n\
    ### Capacity miss\n- Occurs when the set of active cache blocks (working set)\
    \ is larger than the cache.\n\n## Cache Memories\n\n- Cache memories are small,\
    \ fast SRAM-based memories managed automatically in hardware\n  - Hold frequently\
    \ accessed blocks of main memory\n- CPU looks first for data in cache\n- Typical\
    \ system structure:\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_569_0.png)\n\
    \n## Recap from Lecture 10: Modern CPU Design\n\n![img](img/be2cf0737cec89669e7b18813ea2d3b7_570_0.png)\n\
