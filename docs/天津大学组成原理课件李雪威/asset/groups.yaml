    ![](img/be2cf0737cec89669e7b18813ea2d3b7_611_5.png)\n\nn/B blocks\n\nBlock size\
    \ B x B\n\nBryant and O'Hallaron, Computer Systems: A Programmer's Perspective,\
    \ Third Edition\n\n51\n\n## Cache Miss Analysis\n\n### Assume:\n- Cache block\
