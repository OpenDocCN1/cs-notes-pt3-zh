    \ + 4 |\n| &val[2] | int * | x + 8 |\n| val[5] | int | ?? |\n| *(val+1) | int\
    \ | 5 //val[1] |\n| val + i | int * | x + 4 * i //&val[i] |\n\n## Array Example\n\
    \n```c\n#define ZLEN 5\ntypedef int zip_dig[ZLEN];\n\nzip_dig cmu = { 1, 5, 2,\
    \ 1, 3 };\nzip_dig mit = { 0, 2, 1, 3, 9 };\nzip_dig ucb = { 9, 4, 7, 2, 0 };\n\
    ```\n\n`zip_dig cmu;`\n\n`zip_dig mit;`\n\n`zip_dig ucb;`\n\n- Declaration `zip_dig\
    \ cmu` equivalent to `int cmu[5]`\n- Example arrays were allocated in successive\
    \ 20 byte blocks\n- Not guaranteed to happen in general\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_336_0.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_336_1.png)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_336_2.png)\n\
    \n## Array Accessing Example\n\n`zip_dig cmu;`\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_337_0.png)\n\
    \n```c\nint get_digit(zip_dig z, int digit) {\n    return z[digit];\n}\n```\n\n\
    ### x86-64\n\n```asm\n# %rdi = z\n# %rsi = digit\nmovl (%rdi,%rsi,4), %eax # z[digit]\n\
    ```\n\n- Register `%rdi` contains starting address of array\n- Register `%rsi`\
    \ contains array index\n- Desired digit at `%rdi + 4*%rsi`\n- Use memory reference\
    \ `(%rdi,%rsi,4)`\n\nBryant and O’Hallaron, Computer Systems: A Programmer’s Perspective,\
    \ Third Edition\n\n## Array Loop Example\n\n```c\nvoid zincr(zip_dig z) {\n  \
    \  size_t i;\n    for (i = 0; i < ZLEN; i++)\n        z[i]++;\n}\n```\n\n```asm\n\
    # %rdi = z\nmovl    $0, %eax\njmp     .L3\n.L4:\naddl    $1, (%rdi,%rax,4)\naddq\
    \    $1, %rax\n.L3:\ncmpq    $4, %rax\njbe     .L4\nrep; ret\n```\n\n## Understanding\
    \ Pointers & Arrays #1\n\n| Decl | `A[n]` | | | `*A[n]` | | |\n|---|---|---|---|---|---|---|\n\
    | | Cmp | Bad | Size | Cmp | Bad | Size |\n| `int A[3]` | | | | | | |\n| `int\
    \ *A2` | | | | | | |\n\n- Cmp: Compiles (Y/N)\n- Bad: Possible bad pointer reference\
    \ (Y/N)\n- Size: Value returned by `sizeof`\n"
