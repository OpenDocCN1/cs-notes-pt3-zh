  - '[PAGE 497]


    # # SRAM vs DRAM Summary


    | Trans. per bit | Access time | Needs refresh? | Needs EDC? | Cost | Applications
    |

    |---|---|---|---|---|---|

    | SRAM | 4 or 6 | 1X | No | Maybe | 100x | Cache memories |

    | DRAM | 1 | 10X | Yes | Yes | 1X | Main memories, frame buffers |'
  - '[PAGE 498]


    # # Enhanced DRAMs


    +   - Basic DRAM cell has not changed since its invention in 1966.

    +     - Commercialized by Intel in 1970.


    +   - DRAM cores with better interface logic and faster I/O :

    +     - Synchronous DRAM (SDRAM)

    +       - Uses a conventional clock signal instead of asynchronous control

    +       - Allows reuse of the row addresses (e.g., RAS, CAS, CAS, CAS)


    +   - Double data-rate synchronous DRAM (DDR SDRAM)

    +     - Double edge clocking sends two bits per cycle per pin

    +     - Different types distinguished by size of small prefetch buffer:

    +       – DDR (2 bits), DDR2 (4 bits), DDR3 (8 bits)

    +     - By 2010, standard for most server and desktop systems

    +     - Intel Core i7 supports DDR3 and DDR4 SDRAM'
  - '[PAGE 499]


    # # Nonvolatile Memories


    +   - DRAM and SRAM are volatile memories

    +     - Lose information if powered off.

    +   - Nonvolatile memories retain value even if powered off

    +     - Read-only memory (ROM): programmed during production

    +     - Programmable ROM (PROM): can be programmed once

    +     - Eraseable PROM (EPROM): can be bulk erased (UV, X-Ray)

    +     - Electrically eraseable PROM (EEPROM): electronic erase capability

    +     - Flash memory: EEPROMs. with partial (block-level) erase capability

    +       - Wears out after about 100,000 erasures

    +   - Uses for Nonvolatile Memories

    +     - Firmware programs stored in a ROM (BIOS, controllers for disks, network
    cards, graphics accelerators, security subsystems,...)

    +     - Solid state disks (replace rotating disks in thumb drives, smart phones,
    mp3 players, tablets, laptops,...)

    +     - Disk caches'
  - '[PAGE 500]


    # # Traditional Bus Structure Connecting CPU and Memory


    +   - A bus is a collection of parallel wires that carry address, data, and control
    signals.

    +   - Buses are typically shared by multiple devices.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_500_0.png)'
  - '[PAGE 501]


    # Memory Read Transaction (1)


    +   - CPU places address A on the memory bus.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_501_0.png)'
  - '[PAGE 502]


    # Memory Read Transaction (2)


    +   - Main memory reads A from the memory bus, retrieves word x, and places it
    on the bus.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_502_0.png)


    Load operation: `movq A, %rax`'
  - '[PAGE 503]


    # Memory Read Transaction (3)


    +   - CPU read word x from the bus and copies it into register %rax.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_503_0.png)'
  - '[PAGE 504]


    # # Memory Write Transaction (1)


    +   - CPU places address A on bus. Main memory reads it and waits for the corresponding
    data word to arrive.


    Store operation: `movq %rax, A`


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_504_0.png)'
  - '[PAGE 505]


    # # Memory Write Transaction (2)


    +   - CPU places data word y on the bus.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_505_0.png)'
  - '[PAGE 506]


    # Memory Write Transaction (3)


    +   - Main memory reads data word y from the bus and stores it at address A.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_506_0.png)


    Store operation: `movq %rax, A`'
  - '[PAGE 507]


    # What’s Inside A Disk Drive?


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_507_0.png)


    Actuator


    Arm


    Spindle


    Platters


    SCSI

    connector


    Electronics

    (including a

    processor

    and memory!)


    > *Image courtesy of Seagate Technology*'
  - '[PAGE 508]


    # # Disk Geometry


    +   - Disks consist of platters, each with two surfaces.

    +   - Each surface consists of concentric rings called tracks.

    +   - Each track consists of sectors separated by gaps.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_508_0.png)'
  - '[PAGE 509]


    # Disk Geometry (Multiple-Platter View)


    +   - Aligned tracks form a cylinder.


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_509_0.png)'
  - '[PAGE 510]


    # # Disk Capacity


    +   - **Capacity**: maximum number of bits that can be stored.

    +     - Vendors express capacity in units of gigabytes (GB), where 1 GB = 10⁹
    Bytes.


    +   - **Capacity is determined by these technology factors:**

    +     - **Recording density** (bits/in): number of bits that can be squeezed into
    a 1 inch segment of a track.

    +     - **Track density** (tracks/in): number of tracks that can be squeezed into
    a 1 inch radial segment.

    +     - **Areal density** (bits/in²): product of recording and track density.'
