    \ data  \n+       - Example: `$0x400`, `$-533`  \n+       - Like C constant, but\
    \ prefixed with `$`  \n+       - Encoded with 1, 2, or 4 bytes  \n+     - **Register**:\
    \ One of 16 integer registers  \n+       - Example: `%rax`, `%r13`  \n+      \
    \ - But `%rsp` reserved for special use  \n+       - Others have special uses\
    \ for particular instructions  \n+     - **Memory**: 8 consecutive bytes of memory\
    \ at address given by register  \n+       - Simplest example: `(%rax)`  \n+  \
    \     - Various other “addressing modes”\n\n| Register   |\n|------------|\n|\
    \ `%rax`     |\n| `%rcx`     |\n| `%rdx`     |\n| `%rbx`     |\n| `%rsi`     |\n\
    | `%rdi`     |\n| `%rsp`     |\n| `%rbp`     |\n| `%rN`      |\n\n> > Warning:\
    \ Intel docs use `mov Dest, Source`"
