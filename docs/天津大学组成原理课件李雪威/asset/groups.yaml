  - "[PAGE 449]\n\n# Calling Strlen\n\n```\n/* My version of strlen */\nsize_t strlen(const\
    \ char *s)\n{\n    size_t length = 0;\n    while (*s != '\\0') {\n        s++;\n\
    \        length++;\n    }\n    return length;\n}\n```\n\n+   - **Strlen performance**\n\
    +     - Only way to determine length of string is to scan its entire length, looking\
    \ for null character.\n+   - **Overall performance, string of length N**\n+  \
    \   - N calls to strlen\n+     - Require times N, N-1, N-2, ..., 1\n+     - Overall\
    \ O(N²) performance"
  md: "\n## Aside: Worms and Viruses\n\n- **Worm: A program that**\n  - Can run by\
    \ itself\n  - Can propagate a fully working version of itself to other computers\n\
    - **Virus: Code that**\n  - Adds itself to other programs\n  - Does not run independently\n\
    - **Both are (usually) designed to spread among computers and to wreak havoc**\n\
    \n## Code Optimization\n\n15-213: Introduction to Computer Systems  \n10th Lecture,\
    \ February 16, 2017\n\n**Instructor:** Franz Franchetti and Seth C. Goldstein\n\
    \n## Today\n\n- Overview\n- Generally Useful Optimizations\n  - Code motion/precomputation\n\
    \  - Strength reduction\n  - Sharing of common subexpressions\n  - Removing unnecessary\
    \ procedure calls\n- Optimization Blockers\n  - Procedure calls\n  - Memory aliasing\n\
    - Exploiting Instruction-Level Parallelism\n- Dealing with Conditionals\n\n##\
    \ Limitations of Optimizing Compilers\n\n- **Operate under fundamental constraint**\n\
    \  - Must not cause any change in program behavior\n    - Except, possibly when\
    \ program making use of nonstandard language features\n  - Often prevents it from\
    \ making optimizations that would only affect behavior under pathological conditions.\n\
    - **Behavior that may be obvious to the programmer can be obfuscated by languages\
    \ and coding styles**\n  - e.g., Data ranges may be more limited than variable\
    \ types suggest\n- **Most analysis is performed only within procedures**\n  -\
    \ Whole-program analysis is too expensive in most cases\n  - Newer versions of\
    \ GCC do interprocedural analysis within individual files\n    - But, not between\
    \ code in different files\n- **Most analysis is based only on *static* information**\n\
    \  - Compiler has difficulty anticipating run-time inputs\n- **When in doubt,\
    \ the compiler must be conservative**\n\n## Generally Useful Optimizations\n\n\
    - Optimizations that you or the compiler should do regardless of processor / compiler\n\
    \n### Code Motion\n\n- Reduce frequency with which computation performed\n  -\
    \ If it will always produce same result\n  - Especially moving code out of loop\n\
    \n```c\nvoid set_row(double *a, double *b,\n             long i, long n)\n{\n\
    \    long j;\n    for (j = 0; j < n; j++)\n        a[n*i+j] = b[j];\n}\n```\n\n\
    ```c\nlong j;\nint ni = n*i;\nfor (j = 0; j < n; j++)\n    a[ni+j] = b[j];\n```\n\
    \n### Reduction in Strength\n\n- Replace costly operation with simpler one\n-\
    \ Shift, add instead of multiply or divide\n  - Utility is machine dependent\n\
    \  - Depends on cost of multiply or divide instruction\n    - On Intel Nehalem,\
    \ integer multiply requires 3 CPU cycles\n- Recognize sequence of products\n\n\
    ```c\nfor (i = 0; i < n; i++) {\n    int ni = n*i;\n    for (j = 0; j < n; j++)\n\
    \        a[ni + j] = b[j];\n}\n```\n\n```c\nint ni = 0;\nfor (i = 0; i < n; i++)\
    \ {\n    for (j = 0; j < n; j++)\n        a[ni + j] = b[j];\n    ni += n;\n}\n\
    ```\n\nBryant and O’Hallaron, Computer Systems: A Programmer’s Perspective, Third\
    \ Edition\n\n## Optimization Blocker #1: Procedure Calls\n\n### Procedure to Convert\
    \ String to Lower Case\n\n```c\nvoid lower(char *s)\n{\n    size_t i;\n    for\
    \ (i = 0; i < strlen(s); i++)\n        if (s[i] >= 'A' && s[i] <= 'Z')\n     \
    \       s[i] -= ('A' - 'a');\n}\n```\n\nExtracted from 213 lab submissions, Fall,\
    \ 1998\n\n### Lower Case Conversion Performance\n\n- Time quadruples when double\
    \ string length\n- Quadratic performance\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_447_0.png)\n\
    \n### Convert Loop To Goto Form\n\n```c\nvoid lower(char *s)\n{\n    size_t i\
    \ = 0;\n    if (i >= strlen(s))\n        goto done;\n    loop:\n    if (s[i] >=\
    \ 'A' && s[i] <= 'Z')\n        s[i] -= ('A' - 'a');\n    i++;\n    if (i < strlen(s))\n\
    \        goto loop;\n    done:\n}\n```\n\n- `strlen` executed every iteration\n\
    \n### Calling Strlen\n\n```c\n/* My version of strlen */\nsize_t strlen(const\
    \ char *s)\n{\n    size_t length = 0;\n    while (*s != '\\0') {\n        s++;\n\
    \        length++;\n    }\n    return length;\n}\n```\n\n- **Strlen performance**\n\
    \  - Only way to determine length of string is to scan its entire length, looking\
    \ for null character.\n- **Overall performance, string of length N**\n  - N calls\
    \ to strlen\n  - Require times N, N-1, N-2, ..., 1\n  - Overall O(N²) performance\n"
