    \ | B   | C   |\n|---|-----|-----|-----|\n|   | 1.0 | 0.0 | 1.0 |\n\nBlock size\
    \ = 32B (four doubles)\n\n## Summary of Matrix Multiplication\n\n```cpp\nfor (i=0;\
    \ i<n; i++) {\n    for (j=0; j<n; j++) {\n        sum = 0.0;\n        for (k=0;\
    \ k<n; k++)\n            sum += a[i][k] * b[k][j];\n        c[i][j] = sum;\n \
    \   }\n}\n```\n\n```cpp\nfor (k=0; k<n; k++) {\n    for (i=0; i<n; i++) {\n  \
    \      r = a[i][k];\n        for (j=0; j<n; j++)\n            c[i][j] += r * b[k][j];\n\
    \    }\n}\n```\n\n```cpp\nfor (j=0; j<n; j++) {\n    for (k=0; k<n; k++) {\n \
    \       r = b[k][j];\n        for (i=0; i<n; i++)\n            c[i][j] += a[i][k]\
    \ * r;\n    }\n}\n```\n\n### ijk (& jik):\n- 2 loads, 0 stores\n- misses/iter\
    \ = 1.25\n\n### kij (& ikj):\n- 2 loads, 1 store\n- misses/iter = 0.5\n\n### jki\
    \ (& kji):\n- 2 loads, 1 store\n- misses/iter = 2.0\n\n## Core i7 Matrix Multiply\
    \ Performance\n\nCycles per inner loop iteration\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_605_0.png)\n\
    \nArray size (n)\n\n## Today\n\n- Cache organization and operation\n- Performance\
    \ impact of caches\n  - The memory mountain\n  - Rearranging loops to improve\
    \ spatial locality\n  - Using blocking to improve temporal locality\n\n## Example:\
    \ Matrix Multiplication\n\n```c\nc = (double *) calloc(sizeof(double), n*n);\n\
    /* Multiply n x n matrices a and b */\nvoid mmm(double *a, double *b, double *c,\
    \ int n) {\n    int i, j, k;\n    for (i = 0; i < n; i++)\n        for (j = 0;\
    \ j < n; j++)\n            for (k = 0; k < n; k++)\n                c[i*n + j]\
    \ += a[i*n + k] * b[k*n + j];\n}\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_607_0.png)\n\
    \n## Cache Miss Analysis\n\n### Assume:\n- Matrix elements are doubles\n- Cache\
    \ block = 8 doubles\n- Cache size C << n (much smaller than n)\n\n### First iteration:\n\
    - n/8 + n = 9n/8 misses\n- Afterwards in cache: (schematic)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_608_0.png)\n\
    \n## Blocked Matrix Multiplication\n\n```c\nc = (double *) calloc(sizeof(double),\
    \ n*n);\n\n/* Multiply n x n matrices a and b */\nvoid mmm(double *a, double *b,\
    \ double *c, int n) {\n    int i, j, k;\n    for (i = 0; i < n; i+=B)\n      \
    \  for (j = 0; j < n; j+=B)\n            for (k = 0; k < n; k+=B)\n          \
    \      /* B x B mini matrix multiplications */\n                for (il = i; il\
    \ < i+B; i++)\n                    for (jl = j; jl < j+B; j++)\n             \
    \           for (kl = k; kl < k+B; k++)\n                            c[il*n+jl]\
    \ += a[il*n + kl]*b[kl*n + jl];\n}\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_610_0.png)\n\
    \n## Cache Miss Analysis\n\n### Assume:\n- Cache block = 8 doubles\n- Cache size\
    \ C << n (much smaller than n)\n- Three blocks fit into cache: 3B² < C\n\n###\
    \ First (block) iteration:\n- B²/8 misses for each block\n- 2n/B x B²/8 = nB/4\
    \ (omitting matrix c)\n- Afterwards in cache (schematic)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_611_0.png)\n\
