  - '[PAGE 39]


    # Contrast: Logic Operations in C


    +   - Contrast to Logical Operators

    +     - `&&`, `||`

    +       - View 0 as “False”

    +       - Anything else as “True”

    +       - Always evaluate left operand first

    +       - Early exit

    +     - Examples

    +       - `!0x41`

    +       - `!0x00`

    +       - `!0x41 && 0x55`

    +       - `0x6 && 0x55 == 0x01`

    +       - `0x6 || 0x55 == 0x01`

    +       - `p && *p` (avoids null pointer access)


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_39_0.png)


    # Shift Operations


    +   - Left Shift: `x << y`

    +     - Shift bit-vector x left y positions

    +       - Throw away extra bits on left

    +       - Fill with 0s on right

    +   - Right Shift: `x >> y`

    +     - Shift bit-vector x right y positions

    +       - Throw away extra bits on right

    +     - Logical shift

    +       - Fill with 0s on left

    +     - Arithmetic shift

    +       - Replicate most significant bit on left

    +   - Undefined Behavior

    +     - Shift amount < 0 or >= word size


    | Argument x | 01100100 |

    |---|---|

    | `x << 3` | 00100000 |

    | `Log. >> 2` | 00011001 |

    | `Arith. >> 2` | 00011001 |


    | Argument x | 10100100 |

    |---|---|

    | `x << 3` | 00100000 |

    | `Log. >> 2` | 00101001 |

    | `Arith. >> 2` | 10101001 |


    # Today: Bits, Bytes, and Integers


    +   - Representing information as bits

    +   - Bit-level manipulations

    +   - Integers

    +     - Representation: unsigned and signed

    +       - Conversion, casting

    +       - Expanding, truncating

    +       - Addition, negation, multiplication, shifting

    +       - Summary

    +   - Representations in memory, pointers, strings

    +   - Summary


    # Encoding Integers


    **Unsigned**

    `B2U(X) = Σ x_i 2^i`


    **Two’s Complement**

    `B2T(X) = -x_{w-1}2^{w-1} + Σ_{i=0}^{w-2} x_i2^i`


    ```

    short int x = 15213;

    short int y = -15213;

    ```


    +   - C short 2 bytes long

    +   - Sign Bit

    +     - For 2’s complement, most significant bit indicates sign

    +       - 0 for nonnegative

    +       - 1 for negative


    | Decimal | Hex | Binary |

    |---:|---|---|

    | 15213 | 3B 6D | 00111011 01101101 |

    | -15213 | C4 93 | 11000100 10010011 |


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_39_1.png)


    # Two-complement Encoding Example (Cont.)


    | Weight | 15213 | -15213 |

    |---:|---:|---:|

    | 1 | 1 | 1 |

    | 2 | 0 | 0 |

    | 4 | 1 | 1 |

    | 8 | 1 | 1 |

    | 16 | 0 | 0 |

    | 32 | 1 | 1 |

    | 64 | 1 | 1 |

    | 128 | 0 | 0 |

    | 256 | 1 | 1 |

    | 512 | 1 | 1 |

    | 1024 | 0 | 0 |

    | 2048 | 1 | 1 |

    | 4096 | 1 | 1 |

    | 8192 | 1 | 1 |

    | 16384 | 0 | 1 |

    | -32768 | 0 | -32768 |


    # Numeric Ranges


    +   - Unsigned Values

    +     - `UMin = 0`

    +     - `UMax = 2^w − 1`

    +   - Two’s Complement Values

    +     - `TMin = −2^{w−1}`

    +     - `TMax = 2^{w−1} − 1`

    +   - Other Values

    +     - Minus 1

    +       - `111...1`


    **Values for w = 16**


    |  | Decimal | Hex | Binary |

    |---|---:|---|---|

    | UMax | 65535 | FF FF | 11111111 11111111 |

    | UMin | 0 | 00 00 | 00000000 00000000 |

    | TMax | 32767 | 7F FF | 01111111 11111111 |

    | TMin | -32768 | 80 00 | 10000000 00000000 |

    | -1 | -1 | FF FF | 11111111 11111111 |'
