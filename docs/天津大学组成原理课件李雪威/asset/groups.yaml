  mdcn: "\n\n## Machine Words\n\n- Any given computer has a “Word Size”\n  - Nominal\
    \ size of integer-valued data\n  - and of addresses\n\n- Until recently, most\
    \ machines used 32 bits (4 bytes) as word size\n  - Limits addresses to 4GB (2^32\
    \ bytes)\n\n- Increasingly, machines have 64-bit word size\n  - Potentially, could\
    \ have 18 EB (exabytes) of addressable memory\n  - That’s 18.4 X 10^18\n\n- Machines\
    \ still support multiple data formats\n  - Fractions or multiples of word size\n\
    \  - Always integral number of bytes\n\n## Word-Oriented Memory Organization\n\
    \n- **Addresses Specify Byte Locations**\n  - Address of first byte in word\n\
    \  - Addresses of successive words differ by 4 (32-bit) or 8 (64-bit)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_88_0.png)\n\
    \n## Example Data Representations\n\n| C Data Type | Typical 32-bit | Typical\
    \ 64-bit | x86-64 |\n|---|---:|---:|---:|\n| **char** | 1 | 1 | 1 |\n| **short**\
    \ | 2 | 2 | 2 |\n| **int** | 4 | 4 | 4 |\n| **long** | 4 | 8 | 8 |\n| **float**\
    \ | 4 | 4 | 4 |\n| **double** | 8 | 8 | 8 |\n| pointer | 4 | 8 | 8 |\n\n## Byte\
    \ Ordering\n\n- So, how are the bytes within a multi-byte word ordered in memory?\n\
    \n- Conventions\n\n- Big Endian: Sun, PPC Mac, *Internet*\n\n- Least significant\
    \ byte has highest address\n\n- Little Endian: x86, ARM processors running Android,\
    \ iOS, and Windows\n\n- Least significant byte has lowest address\n\n## Byte Ordering\
    \ Example\n\n### Example\n\n- Variable x has 4-byte value of 0x01234567\n\n- Address\
    \ given by &x is 0x100\n\n### Big Endian\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_91_0.png)\n\
    \n### Little Endian\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_91_1.png)\n\n\
    ## Representing Integers\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_92_0.png)\n\
    \n`int A = 15213;`\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_92_1.png)\n\n`int\
    \ B = -15213;`\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_92_2.png)\n\n`long\
    \ int C = 15213;`\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_92_3.png)\n\nTwo’s\
    \ complement representation\n\n## Examining Data Representations\n\n### Code to\
    \ Print Byte Representation of Data\n\n- Casting pointer to unsigned char * allows\
    \ treatment as a byte array\n\n```c\ntypedef unsigned char *pointer;\n\nvoid show_bytes(pointer\
    \ start, size_t len) {\n    size_t i;\n    for (i = 0; i < len; i++)\n       \
    \ printf(\" %p\\t0x%.2x\\n\", start+i, start[i]);\n    printf(\"\\n\");\n}\n```\n\
    \n**Printf directives:**\n\n%p: Print pointer\n\n%x: Print Hexadecimal\n\n## Representing\
    \ Pointers\n\n```c\nint B = -15213;\nint *P = &B;\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_95_0.png)\n\
    \nDifferent compilers & machines assign different locations to objects\n\nEven\
    \ get different results each time run program\n\n## Representing Strings\n\n###\
