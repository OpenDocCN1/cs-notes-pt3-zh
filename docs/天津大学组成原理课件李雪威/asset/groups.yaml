    \ i--)\n      ...\n  ```\n  - Data type `size_t` defined as unsigned value with\
    \ length = word size\n  - Code will work even if `cnt = UMax`\n  - What if `cnt`\
    \ is signed and `< 0`?\n\n## Why Should I Use Unsigned? (cont.)\n\n- **Do Use\
    \ When Performing Modular Arithmetic**\n  - Multiplication arithmetic\n- **Do\
    \ Use When Using Bits to Represent Sets**\n  - Logical right shift, no sign extension\n\
    \n## Today: Bits, Bytes, and Integers\n\n- Representing information as bits\n\
    - Bit-level manipulations\n- Integers\n  - Representation: unsigned and signed\n\
    \  - Conversion, casting\n  - Expanding, truncating\n  - Addition, subtraction,\
    \ multiplication, shifting\n  - Summary\n- **Representations in memory, pointers,\
    \ strings**\n\n## Byte-Oriented Memory Organization\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_45_0.png)\n\
    \n- **Programs refer to data by address**\n  - Conceptually, envision it as a\
    \ very large array of bytes\n    - In reality, it’s not, but can think of it that\
    \ way\n  - An address is like an index into that array\n    - and, a pointer variable\
    \ stores an address\n- **Note: system provides private address spaces to each\
    \ “process”**\n  - Think of a process as a program being executed\n  - So, a program\
    \ can clobber its own data, but not that of others\n\n## Machine Words\n\n- **Any\
    \ given computer has a “Word Size”**\n  - Normal size of integer-valued data\n\
    \    - and of addresses\n  - Until recently, most machines used 32 bits (4 bytes)\
    \ as word size\n    - limits addresses to 4G (2³²) bytes\n  - Increasingly, machines\
    \ have 64-bit word size\n    - Potentially, could have 18 EB (exabytes) of addressable\
    \ memory\n    - That’s 18.4 × 10¹⁸\n  - Machines still support multiple data formats\n\
    \    - Fractions or multiples of word size\n    - Always integral number of bytes\n\
    \n## Word-Oriented Memory Organization\n\n- **Addresses Specify Byte Locations**\n\
    \  - Address of first byte in word\n  - Addresses of successive words differ by\
    \ 4 (32-bit) or 8 (64-bit)\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_45_1.png)\n\
    \n## Example Data Representations\n\n| C Data Type | Typical 32-bit | Typical\
    \ 64-bit | MIPS64 |\n|---|---|---|---|\n| char | 1 | 1 | 1 |\n| short | 2 | 2\
    \ | 2 |\n| int | 4 | 4 | 4 |\n| long | 4 | 8 | 8 |\n| float | 4 | 4 | 4 |\n| double\
    \ | 8 | 8 | 8 |\n| long double | - | - | 10/16 |\n| pointer | 4 | 8 | 8 |\n\n\
    ## Byte Ordering\n\n- So, how are the bytes within a multi-byte word ordered in\
    \ memory?\n- Conventions\n  - Big Endian: Sun, PPC Mac, Internet\n    - Least\
    \ significant byte has highest address\n  - Little Endian: x86, ARM processors\
    \ running Android, iOS, and Windows\n    - Least significant byte has lowest address\n\
    \n## Byte Ordering Example\n\n- Example\n  - Variable x is a 4-byte value of 0x1234567\n\
    \  - Address given by &x is 0x100\n\nBig Endian\n\n| 0x100 | 0x101 | 0x102 | 0x103\
    \ |\n|-------|-------|-------|-------|\n| 12 | 34 | 56 | 78 |\n\nLittle Endian\n\
    \n| 0x100 | 0x101 | 0x102 | 0x103 |\n|-------|-------|-------|-------|\n| 78 |\
    \ 56 | 34 | 12 |\n\n## Representing Integers\n\nint A = 15213;\n\nint B = -15213;\n\
    \nTwo's complement representation\n\n## Examining Data Representations\n\n- Code\
    \ to Print Byte Representation of Data\n  Casting pointer to unsigned char * allows\
    \ treatment as byte array\n\n```c\ntypedef unsigned char *byte_pointer;\n\nvoid\
    \ show_bytes(byte_pointer start, size_t len) {\n    size_t i;\n    for (i = 0;\
    \ i < len; i++)\n    fprintf(\"%.2x\", start[i]);    // Line A\n    printf(\"\\\
    n\");\n}\n```\n\n- Print directives:\n  - %p: Print pointer\n  - %x: Print hexadecimal\n\
    \  - %lx: Print hexadecimal\n\n## show_bytes Execution Example\n\n```c\nint a\
    \ = 15213;\nprintf(\"int a = %d\\n\", a);\nshow_bytes((byte_pointer) &a, sizeof(int));\n\
    ```\n\nResult (Linux x86-64):\nint a = 15213;\n69 3d 00 00\n0xf7fff7c4: 3d\n0xf7fff7c5:\
    \ 69\n0xf7fff7c6: 00\n0xf7fff7c7: 00\n\n"
