    \ Matrix Access\n\n### Array Elements\n\n- `int A[16][16];`\n- Address `A + i\
    \ * (C * K) + j * K`\n- `C = 16, K = 4`\n\n```c\n/* Get element A[i][j] */\nint\
    \ fix_ele(fix_matrix A, size_t i, size_t j) {\n    return A[i][j];\n}\n```\n\n\
    ```asm\n# A in %rdi, i in %rsi, j in %rdx\nsalq    $6, %rsi        # 64*i\naddq\
    \    %rsi, %rdi      # A + 64*i\nmovl    (%rdi,%rdx,4), %eax  # M[A + 64*i + 4*j]\n\
    ret\n```\n\n## n X n Matrix Access\n\n### Array Elements\n\n- `size_t n;`\n- `int\
    \ A[n][n];`\n- Address `A + i * (C * K) + j * K`\n- `C = n, K = 4`\n- Must perform\
