    \ integer value\n- Each representable integer has unique bit encoding\n\n### Expression\
    \ containing signed and unsigned int: int is cast to unsigned!!\n\n## Sign Extension\
    \ and Truncation\n\n### Sign Extension\n\n### Truncation\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_60_0.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_60_1.png)\n\n## Today: Bits, Bytes,\
    \ and Integers\n\n- Representing information as bits\n- Bit-level manipulations\n\
    - Integers\n  - Representation: unsigned and signed\n  - Conversion, casting\n\
    \  - Expanding, truncating\n  - Addition, negation, multiplication, shifting\n\
    - Representations in memory, pointers, strings\n- Summary\n\n## Unsigned Addition\n\
    \n- Operands: w bits\n- True Sum: w+1 bits\n- Discard Carry: w bits\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_62_0.png)\n\
    \n- **Standard Addition Function**\n  - Ignores carry output\n- **Implements Modular\
    \ Arithmetic**\n\ns = UAdd_w(u, v) = u + v mod 2^w\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_62_1.png)\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_62_2.png)\n\n## Visualizing (Mathematical)\
    \ Integer Addition\n\n### Integer Addition\n\n- 4-bit integers $u, v$\n- Compute\
    \ true sum\n  - Add$_4(u, v)$\n- Values increase linearly with $u$ and $v$\n-\
    \ Forms planar surface\n\n### Add$_4(u, v)$\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_63_0.png)\n\
    \n## Visualizing Unsigned Addition\n\n### Wraps Around\n\n- If true sum ≥ 2^w\n\
    - At most once\n\n**True Sum**\n\n**Modular Sum**\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_64_0.png)\n\
    \n## Two’s Complement Addition\n\n- Operands: w bits\n- True Sum: w+1 bits\n-\
    \ Discard Carry: w bits\n\n```text\nu\n+ v\nu + v\nTAdd_w(u, v)\n```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_65_0.png)\n\
    \n### TAdd and UAdd have Identical Bit-Level Behavior\n\n- Signed vs. unsigned\
    \ addition in C:\n\n  ```c\n  int s, t, u, v;\n  s = (int) ((unsigned) u + (unsigned)\
    \ v);\n  t = u + v;\n  ```\n\n- Will give s == t\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_65_1.png)\n\
    \n## TAdd Overflow\n\n### Functionality\n\n- True sum requires w+1 bits\n- Drop\
    \ off MSB\n- Treat remaining bits as 2’s comp. integer\n\n- 0 111...1\n- 0 100...0\n\
    - 0 000...0\n- 1 011...1\n- 1 000...0\n\n**True Sum**\n\n- 2^w-1\n- 2^(w-1)-1\n\
    - 0\n- -2^(w-1)\n- -2^w\n- PosOver\n- NegOver\n\n**TAdd Result**\n\n- 011...1\n\
    - 000...0\n- 100...0\n\n## Visualizing 2’s Complement Addition\n\n### Values\n\
    \n- 4-bit two’s comp.\n- Range from -8 to +7\n\n### Wraps Around\n\n- If sum ≥\
    \ 2<sup>w-1</sup>\n  - Becomes negative\n  - At most once\n- If sum < -2<sup>w-1</sup>\n\
    \  - Becomes positive\n  - At most once\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_67_0.png)\n\
    \n## Characterizing TAdd\n\n- **Functionality**\n  - True sum requires *w*+1 bits\n\
    \  - Drop off MSB\n  - Treat remaining bits as 2’s comp. integer\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_68_0.png)\n\
    \n$$\nTAdd_w(u,v)=\\begin{cases}\nu+v+2^w & u+v<TMin_w\\quad\\text{(NegOver)}\\\
    \\\nu+v & TMin_w\\le u+v\\le TMax_w\\\\\nu+v-2^w & TMax_w<u+v\\quad\\text{(PosOver)}\n\
    \\end{cases}\n$$\n"
