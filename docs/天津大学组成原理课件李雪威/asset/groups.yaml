    \ types such as arrays or structures**\n  - Just contiguously allocated bytes\
    \ in memory\n\n## x86-64 Integer Registers\n\n| Register | Low-order register\
    \ | Register | Low-order register |\n|---|---|---|---|\n| `%rax` | `%eax` | `%r8`\
    \ | `%r8d` |\n| `%rbx` | `%ebx` | `%r9` | `%r9d` |\n| `%rcx` | `%ecx` | `%r10`\
    \ | `%r10d` |\n| `%rdx` | `%edx` | `%r11` | `%r11d` |\n| `%rsi` | `%esi` | `%r12`\
    \ | `%r12d` |\n| `%rdi` | `%edi` | `%r13` | `%r13d` |\n| `%rsp` | `%esp` | `%r14`\
    \ | `%r14d` |\n| `%rbp` | `%ebp` | `%r15` | `%r15d` |\n\n- Can reference low-order\
    \ 4 bytes (also low-order 1 & 2 bytes)\n- Not part of memory (or cache)\n\n##\
    \ Some History: IA32 Registers\n\n| Register | Sub-registers | Origin |\n|----------|---------------|--------|\n\
    | %eax | %ax, %ah, %al | accumulate |\n| %ecx | %cx, %ch, %cl | counter |\n| %edx\
    \ | %dx, %dh, %dl | data |\n| %ebx | %bx, %bh, %bl | base |\n| %esi | %si | source\
    \ index |\n| %edi | %di | destination index |\n| %esp | %sp | stack pointer |\n\
    | %ebp | %bp | base pointer |\n\n16-bit virtual registers (backwards compatibility)\n\
    \nBryant and O'Hallaron, Computer Systems: A Programmer's Perspective, Third Edition\n\
    \n18\n\n## Moving Data\n\n- **Moving Data**\n  `movq Source, Dest`\n\n- **Operand\
    \ Types**\n  - **Immediate**: Constant integer data\n    - Example: `$0x400`,\
    \ `$-533`\n    - Like C constant, but prefixed with `$`\n    - Encoded with 1,\
    \ 2, or 4 bytes\n  - **Register**: One of 16 integer registers\n    - Example:\
    \ `%rax`, `%r13`\n    - But `%rsp` reserved for special use\n    - Others have\
    \ special uses for particular instructions\n  - **Memory**: 8 consecutive bytes\
    \ of memory at address given by register\n    - Simplest example: `(%rax)`\n \
    \   - Various other “addressing modes”\n\n| Register   |\n|------------|\n| `%rax`\
    \     |\n| `%rcx`     |\n| `%rdx`     |\n| `%rbx`     |\n| `%rsi`     |\n| `%rdi`\
    \     |\n| `%rsp`     |\n| `%rbp`     |\n| `%rN`      |\n\n> Warning: Intel docs\
    \ use `mov Dest, Source`\n\n## movq Operand Combinations\n\n| Source | Dest |\
    \ Src,Dest | C Analog |\n|---|---|---|---|\n| Imm | Reg | movq $0x4,%rax | temp\
    \ = 0x4; |\n| | Mem | movq $-147,(%rax) | *p = -147; |\n| Reg | Reg | movq %rax,%rdx\
    \ | temp2 = temp1; |\n| | Mem | movq %rax,(%rdx) | *p = temp; |\n| Mem | Reg |\
    \ movq (%rax),%rdx | temp = *p; |\n\nCannot do memory-memory transfer with a single\
    \ instruction\n\n## Simple Memory Addressing Modes\n\n- **Normal** (R) Mem[Reg[R]]\n\
    \  - Register R specifies memory address\n  - Aha! Pointer dereferencing in C\n\
    \n  ```asm\n  movq (%rcx), %rax\n  ```\n\n- **Displacement** D(R) Mem[Reg[R]+D]\n\
    \  - Register R specifies start of memory region\n  - Constant displacement D\
    \ specifies offset\n\n  ```asm\n  movq 8(%rbp), %rdx\n  ```\n"
