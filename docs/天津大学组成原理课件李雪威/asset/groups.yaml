    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_350_1.png)\n\n### Computation\n\n-\
    \ Element access **Mem[Mem[univ+8*index]+4*digit]**\n- Must do two memory reads\n\
    \  - First get pointer to row array\n  - Then access element within array\n\n\
