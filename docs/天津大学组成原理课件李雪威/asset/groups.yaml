    # IM War (cont.)


    +   - **August 1999**

    +     - Mysteriously, Messenger clients can no longer access AIM servers

    +     - Microsoft and AOL begin the IM war:

    +       - AOL changes server to disallow Messenger clients

    +       - Microsoft makes changes to clients to defeat AOL changes

    +       - At least 13 such skirmishes

    +     - What was really happening?

    +       - AOL had discovered a buffer overflow bug in their own AIM clients

    +       - They exploited it to detect and block Microsoft: the exploit code returned
    a 4-byte signature (the bytes at some location in the AIM client) to server

