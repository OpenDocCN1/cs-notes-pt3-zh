    \ controllers for disks, network cards, graphics accelerators, security subsystems,...)\n\
    \  - Solid state disks (replace rotating disks in thumb drives, smart phones,\
    \ mp3 players, tablets, laptops,...)\n  - Disk caches\n\n## Traditional Bus Structure\
    \ Connecting CPU and Memory\n\n- A bus is a collection of parallel wires that\
    \ carry address, data, and control signals.\n- Buses are typically shared by multiple\
    \ devices.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_500_0.png)\n\n## Memory\
    \ Read Transaction (1)\n\n- CPU places address A on the memory bus.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_501_0.png)\n\
    \n## Memory Read Transaction (2)\n\n- Main memory reads A from the memory bus,\
    \ retrieves word x, and places it on the bus.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_502_0.png)\n\
    \nLoad operation: `movq A, %rax`\n\n## Memory Read Transaction (3)\n\n- CPU read\
    \ word x from the bus and copies it into register %rax.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_503_0.png)\n\
    \n## Memory Write Transaction (1)\n\n- CPU places address A on bus. Main memory\
    \ reads it and waits for the corresponding data word to arrive.\n\nStore operation:\
    \ `movq %rax, A`\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_504_0.png)\n\n##\
    \ Memory Write Transaction (2)\n\n- CPU places data word y on the bus.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_505_0.png)\n\
    \n## Memory Write Transaction (3)\n\n- Main memory reads data word y from the\
    \ bus and stores it at address A.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_506_0.png)\n\
    \nStore operation: `movq %rax, A`\n\n## What’s Inside A Disk Drive?\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_507_0.png)\n\
    \nActuator\n\nArm\n\nSpindle\n\nPlatters\n\nSCSI connector\n\nElectronics (including\
    \ a processor and memory!)\n\n> *Image courtesy of Seagate Technology*\n\n## Disk\
    \ Geometry\n\n- Disks consist of platters, each with two surfaces.\n- Each surface\
    \ consists of concentric rings called tracks.\n- Each track consists of sectors\
    \ separated by gaps.\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_508_0.png)\n\n\
    ## Disk Geometry (Multiple-Platter View)\n\n- Aligned tracks form a cylinder.\n\
    \n![](img/be2cf0737cec89669e7b18813ea2d3b7_509_0.png)\n\n## Disk Capacity\n\n\
    - **Capacity**: maximum number of bits that can be stored.\n  - Vendors express\
    \ capacity in units of gigabytes (GB), where 1 GB = 10⁹ Bytes.\n- **Capacity is\
    \ determined by these technology factors:**\n  - **Recording density** (bits/in):\
    \ number of bits that can be squeezed into a 1 inch segment of a track.\n  - **Track\
    \ density** (tracks/in): number of tracks that can be squeezed into a 1 inch radial\
    \ segment.\n  - **Areal density** (bits/in²): product of recording and track density.\n\
    \n"
