  - '[PAGE 13]


    # 冯诺依曼结构


    +   - 采用存储程序方式，指令和数据不加区别混合存储在同一个存储器中。指令和数据都可以送到运算器进行运算，即由指令组成的程序是可以修改的。

    +   - 存储器是按地址访问的线性编址的一维结构，每个单元的位置是固定的。

    +   - 指令由操作码和地址组成。操作码指明本指令的操作类型，地址码指明操作数和地址。

    +   - 指令在存储器中按其执行顺序存放，由指令计数器指明要执行的指令所在的单元地址。指令计数器只有一个，一般按顺序递增，但执行顺序可按运算结果或当时的外界条件而改变。

    +   - 以运算器为中心，I/O设备与存储器间的数据传送都要经过运算器。

    +   - 数据以二进制表示。'
  - '[PAGE 14]


    # # 冯诺依曼体系结构的特点


    +   - 计算机处理的数据和指令一律用二进制数表示

    +   - 顺序执行程序


    +   - 计算机运行过程中，把要执行的程序和处理的数据首先存入主存储器（内存），计算机执行程序时，将自动地并按顺序从主存储器中取出指令一条一条地执行，这一概念称作顺序执行程序。


    +   - 计算机硬件由运算器、控制器、存储器、输入设备和输出设备五大部分组成。'
  - '[PAGE 15]


    # 图灵


    +   - 1937年，Alan Turing提出一种“通用”计算机的概念，它可以执行任何一个描述好的程序（算法），实现需要的功能，形成了“可计算性”概念的基础。

    +   - 存储程序的思想，使计算机从专用走向通用。正是这一创新，开创了计算机的新时代。

    +   - 50年代，Turing提出了“人工智能”的概念。Turing测试


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_15_0.png)'
  - '[PAGE 16]


    # # 中断


    +   纯粹冯·诺伊曼体系结构的计算机完全串行工作，程序的执行过程也完全按照事先安排好的顺序执行。


    +   1951年Presper Eckert和John Mauchly在设计UNIVAC I 计算机时，为了能够使计算机自动处理运算溢出问题，第一次设计并实现了自动处理异常情况的方法。'
  - '[PAGE 17]


    # 中断


    具体的处理方法是：


    +   在主存的0地址单元存放2条指令；


    +   当计算机系统出现程序员设定的异常情况时（如：运算溢出等），计算机就自动地执行存放在主存0地址单元的指令。


    +   如果在主存的0地址单元放入停机指令，一旦在程序运行过程中出现运算溢出等异常情况，计算机就可以停止运行。如果在主存0地址单元放入转移到异常处理程序入口的指令，一旦在程序运行过程中出现运算溢出等异常情况，计算机就可以转去执行预先设置好的异常处理程序。'
  - '[PAGE 18]


    # 中断


    +   • 这种处理异常情况的方法，就相当于在出现运算溢出等异常情况时，在正常的程序执行顺序中插入另一段处理程序。由于事先根本无法预知何时会出现运算溢出等异常情况，因此也就无法预知插入程序的位置。在无法预知程序插入位置的情况下实现一段程序的插入，正是
    UNIVAC 计算机的一项重要贡献。'
  - '[PAGE 19]


    # # 虚拟存储器


    1958年由英国曼彻斯特大学研制的Atlas 计算机，第一次使用了虚拟存储器技术，1962年Atlas 计算机投入运行。虚拟存储器的核心思想就是把当前使用的部分程序放在主存储器中，而把暂时不使用的部分程序放在辅存储器中，但是给程序员的感觉是计算机有很大的主存储器。后来出现的高速缓冲存储器（Cache
    memory）基本上使用的就是虚拟存储器的思想。'
  - '[PAGE 20]


    # # 指令流水线


    指令流水线的基本思想是把指令的执行过程划分成几个不同的阶段，并设法使几条指令分别处于不同的执行阶段，从而提高了处理器的指令吞吐量。一个五段指令流水线的指令执行过程示意如图所示。指令流水线第一次使计算机可以同时处理多条指令，第一次实现了在CPU内部的指令并行执行。


    | IF | ID | EX | MEM | WB |

