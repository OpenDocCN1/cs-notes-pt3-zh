    .type   sumstore, @function\nsumstore:\n.LFB35:\n    .cfi_startproc\n    pushq\
    \   %rbx\n    .cfi_def_cfa_offset 16\n    .cfi_offset 3, -16\n    movq    %rdx,\
    \ %rbx\n    call    plus\n    movq    %rax, (%rbx)\n    popq    %rbx\n    .cfi_def_cfa_offset\
    \ 8\n    ret\n    .cfi_endproc\n.LFE35:\n    .size   sumstore, .-sumstore\n```\n\
    \nThings that look weird and are preceded by a ’ are generally directives.\n\n\
    ```asm\nsumstore:\npushq %rbx\nmovq %rdx, %rbx\ncall plus\nmovq %rax, (%rbx)\n\
    popq %rbx\nret\n```\n\n## Assembly Characteristics: Operations\n\n- Transfer data\
    \ between memory and register\n  - Load data from memory into register\n  - Store\
    \ register data into memory\n- Perform arithmetic function on register or memory\
    \ data\n- Transfer control\n  - Unconditional jumps to/from procedures\n  - Conditional\
    \ branches\n  - Indirect branch\n\n## Object Code\n\n### Code for sumstore\n\n\
    0x400595:\n0x53\n0x48\n0x89\n0xd3\n0xe8\n0xf2\n0xff\n0xff\n0xff\n0xff\n0x48\n\
    0x89\n0x03\n0x03\n0x5b\n0xc3\n\n- Total of 14 bytes\n- Each instruction\n  - 1,\
    \ 3, or 5 bytes\n- Starts at address\n  - 0x400595\n\n### Assembler\n\n- Translates\
    \ `.s` into `.o`\n- Binary encoding of each instruction\n- Nearly-complete image\
    \ of executable code\n- Missing linkages between code in different files\n\n###\
    \ Linker\n\n- Resolves references between files\n- Combines with static run-time\
    \ libraries\n  - E.g., code for `malloc`, `printf`\n- Some libraries are *dynamically\
    \ linked*\n  - Linking occurs when program begins execution\n\n## Machine Instruction\
    \ Example\n\n### C Code\n\n- Store value `t` where designated by `dest`\n\n###\
    \ Assembly\n\n- Move 8-byte value to memory\n  - Quad words in x86-64 parlance\n\
    - Operands:\n  - `t`: Register `%rax`\n  - `dest`: Register `%rbx`\n  - `*dest`:\
    \ Memory `M[%rbx]`\n\n### Object Code\n\n- 3-byte instruction\n- Stored at address\
    \ `0x40059e`\n\n```c\n*dest = t;\n```\n\n```asm\nmovq %rax, (%rbx)\n```\n\n```\n\
    0x40059e: 48 89 03\n```\n\n## Disassembling Object Code\n\n### Disassembled\n\n\
    ```\n0000000000400595 <sumstore>:\n  400595:  53                 push   %rbx\n\
    \  400596:  48 89 d3           mov    %rdx,%rbx\n  400599:  e8 f2 ff ff ff   \
    \  callq  400590 <plus>\n  40059e:  48 89 03           mov    %rax,(%rbx)\n  4005a1:\
    \  5b                 pop    %rbx\n  4005a2:  c3                 retq\n```\n\n\
    - **Disassembler**\n  - `objdump -d sum`\n  - Useful tool for examining object\
    \ code\n  - Analyzes bit pattern of series of instructions\n  - Produces approximate\
    \ rendition of assembly code\n  - Can be run on either a `.out` (complete executable)\
    \ or `.o` file\n\n## Alternate Disassembly\n\n### Disassembled\n\n```\nDump of\
    \ assembler code for function sumstore:\n  0x0000000000400595 <+0>: push   %rbx\n\
    \  0x0000000000400596 <+1>: mov    %rdx,%rbx\n  0x0000000000400599 <+4>: callq\
    \  0x400590 <plus>\n  0x000000000040059e <+9>: mov    %rax,(%rbx)\n  0x00000000004005a1\
    \ <+12>: pop   %rbx\n  0x00000000004005a2 <+13>: retq\n```\n\n- **Within gdb Debugger**\n\
    \  - Disassemble procedure\n    ```bash\n    gdb sum\n    disassemble sumstore\n\
    \    ```\n\n"
