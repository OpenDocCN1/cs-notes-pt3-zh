    # # Example: Calling `incr` #1


    long call_incr() {

    long v1 = 15213;

    long v2 = incr(&v1, 3000);

    return v1+v2;

    }


    # ## Initial Stack Structure


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_299_0.png)


    call_incr:

    subq $16, %rsp

    movq $15213, 8(%rsp)

    movl $3000, %esi

    leaq 8(%rsp), %rdi

    call incr

    addq $8(%rsp), %rax

    addq $16, %rsp

    ret


    # ## Resulting Stack Structure


    ![](img/be2cf0737cec89669e7b18813ea2d3b7_299_1.png)'
