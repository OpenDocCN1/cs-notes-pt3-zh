    # Specific Cases of Alignment (x86-64)


    +   - **1 byte: `char`, …**

    +     - no restrictions on address

    +   - **2 bytes: `short`, …**

    +     - lowest 1 bit of address must be 0₂

    +   - **4 bytes: `int`, `float`, …**

    +     - lowest 2 bits of address must be 00₂

    +   - **8 bytes: `double`, `long`, `char *`, …**

    +     - lowest 3 bits of address must be 000₂'
  - "[PAGE 367]\n\n# Satisfying Alignment with Structures\n\n+   - **Within structure:**\n\
    +     - Must satisfy each element’s alignment requirement\n+   - **Overall structure\
    \ placement**\n+     - Each structure has alignment requirement K\n+       - K\
    \ = Largest alignment of any element\n+     - Initial address & structure length\
    \ must be multiples of K\n+   - **Example:**\n+     - K = 8, due to **double**\
    \ element\n\n```\nstruct S1 {\n    char c;\n    int i[2];\n    double v;\n} *p;\n\
    ```\n\n![](img/be2cf0737cec89669e7b18813ea2d3b7_367_0.png)"
