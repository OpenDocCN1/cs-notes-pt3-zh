    \            decimal = 1;\n        } else\n            val=10.0*val + (s[i]-'0');\n\
    \    }\n    return sign * val / power;\n}\n```\n\n![](img/1879308d3bf2ec0664445e4bc0146293_76_0.png)\n\
    \n### calling atof()\n\n```c\n#include <stdio.h>\n#define MAXLINE 100\nmain()\n\
