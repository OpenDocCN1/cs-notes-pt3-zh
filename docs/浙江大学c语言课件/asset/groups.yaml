    int getop(char []);\nint getch(void);\nvoid ungetch(int);\n```\n\n### main.c:\n\
    \n```c\n#include <stdio.h>\n#include <math.h>\n#include \"calc.h\"\n#define MAXOP\
    \ 100\nmain() {\n  ...\n}\n```\n\n### getop.c:\n\n```c\n#include <stdio.h>\n#include\
    \ <ctype.h>\n#include \"calc.h\"\ngetop() {\n  ...\n}\n```\n\n### stack.c:\n\n\
    ```c\n...\n```\n\n### getch.c\n\n```c\n...\n```\n\n## 4.6 Static Variables\n\n\
    - static:\n\n### (1) applied to an external variables or function:\n\nlimits the\
    \ scope of that object to the rest of the source file, the name is invisible outside\
    \ the file.\n\n```c\nstatic char buf[BUFSIZE]; /* buffer for ungetch */\nint getch(void)\
    \ {...}\nvoid ungetch(int c) {...}\n```\n\n### (2) applied to an internal variable:\n\
    \nthe scope is the function (as an automatic variable), but it remains in existence\
    \ as the program (not the function) is activated.\n\n```c\nvoid Example()\n{\n\
    \ static int i=1;\n printf(\"%d times\\n\", i++);\n}\n\nmain()\n{\n Example();\n\
    \ Example();\n Example();\n}\n```\n\n```text\n1 times\n2 times\n3 times\n```\n\
    \nstatic variables are initialized only the first time the function is entered.\n\
    \n## 4.7 Register Variables\n\n- **register**: advises the compiler to place the\
    \ variable in registers, in order to result in smaller and faster programs.\n\
    - **format**\n\n```c\nregister int x;\nregister char c;\n```\n\n**example:**\n\
    \n```c\nf(register unsigned m, register long n)\n{\n    register int i;\n    ...\n\
    }\n```\n\n**notice:**\n\n- ➢ *register declaration can only be applied to automatic\
    \ variables and to the formal parameters of a function*\n- ➢ *only a few variables\
    \ can be kept in registers; excess declarations will be ignored.*\n- ➢ *cannot\
    \ take the address of a register variable*\n- ➢ *there are restrictions on types\
    \ of register variables.*\n\n![](img/1879308d3bf2ec0664445e4bc0146293_89_0.png)\n\
    \n## 4.8 Block Structure\n\n- **block: `{.....}`**\n- variable can be declared\
    \ in a block (follow the left brace); the scope of the variable is the block and\
    \ remains in existence until matching the right brace.\n\n```c\nif(n>0) {\n  \
    \  int i;        /* declare a new i */\n    for (i=0;i<n; i++)\n    ...\n}\n```\n\
    \nthe scope of “i”\n\nThe variable in an inner scope will hide variables in the\
    \ outer scope of the same name.\n\n```c\nint x,y;\nf(double x)\n{  double y;\n\
    \   ...\n   x=y+1;\n   ...\n}\ng()\n...\n```\n\ninner first\n"
