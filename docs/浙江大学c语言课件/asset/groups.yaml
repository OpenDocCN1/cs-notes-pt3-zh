    \ of the variable.\n\n### file1.c\n\n```c\n#include <stdio.h>\nfloat rate;\nmain()\n\
    {\n\tint number;\n\tfloat total(int n);\n\tnumber = 10;\n\trate = 0.98;\n\tprintf(\"\
    total = %f, number = %d\\n\",\n\t\ttotal(number), number);\n}\n```\n\n### file2.c\n\
    \n```c\nfloat total(int num)\n{\n\textern float rate;\n\treturn rate * num;\n\
    }\n```\n\n## Chapter 2: Types, Operators, and Expressions\n\n### 2.1 Variable\
    \ Names\n\n- letters (including ‘_’) and digits, begin with letter.\n- Lower case\
    \ and upper case letters are distinct.\n- Keywords like if, else, int, float,\
    \ etc., are reserved.\n\n### 2.3 Constants\n\n- int: 123\n- long: 12345678l, 12345678L\n\
    - float(double): 123.4, 1.2e-2\n- char: 'a', '4', '\\013', '\\n'\n- string constant:\
    \ \"hello, world\"\n\nA string constant such as \"hello, world\" is stored as\
    \ a character array terminated by '\\0':\n\n```c\n'h' + 'e' + 'l' + 'l' + 'o'\
    \ + ' ' + 'w' + 'o' + 'r' + 'l' + 'd' + '\\0'\n```\n\n`strlen(s)` can be used\
    \ to compute its length.\n\nNOTICE!\n\n```c\nint strlen(char s[])\n{\n\tint i;\n\
    \ti = 0;\n\twhile (s[i] != '\\0') ++i;\n\treturn i;\n}\n```\n\nEnumeration constant\
    \ (枚举常量):\n\n```c\nenum boolean {NO, YES};\n/* NO=0, YES=1 */\nenum weeks {MON=1,\
    \ TUE, WED, THU, FRI, SAT, SUN}\n```\n\n### 2.4 Declarations\n\ntype var1, var2,\
    \ ..., varN;\n\n```c\nint lower, upper, step;\nchar c, line[1000];\n```\n\nis\
    \ equivalent to:\n\n```c\nint lower;\nint upper;\nint step;\nchar c;\nchar line[1000];\n\
    ```\n\nA variable may also be initialized in its declaration, e.g.:\n\n```c\n\
    char esc = '\\\\';\nint i = 0;\nint limit = MAXLINE + 1;\n```\n\nThe qualifier\
    \ const can be applied to the declaration of any variable to specify that its\
    \ value will not be changed.\n\n```c\nconst double e = 2.71828;\nconst char msg[]\
    \ = \"warning.\";\n```\n\n### 2.5 Arithmetic Operators\n\n**Arithmetic operators:**\
    \ `+`, `-`, `*`, `/`, `%`\n\n- `%` produces the remainder (求余), cannot be applied\
    \ to float, double.\n- `/`: int/int => int;\n  - 17/5 => 3;\n  - 17./5 => 3.4\n\
    \n```c\nif ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0)\n\tprintf(\"\
    %d is a leap year\\n\", year);\nelse\n\tprintf(\"%d is not a leap year\\n\", year);\n\
    ```\n\n**Precedence:**\n\n- `*`, `/`, `%` high\n- `+`, `-` low\n\n### 2.6 Relational\
    \ and Logical Operators\n\nThe relational operators: `>`, `>=`, `<`, `<=`, `==`,\
    \ `!=`\n\n**Precedence:**\n\n- `*`, `/`, `%`\n- `+`, `-`\n- `>`, `>=`, `<`, `<=`\n\
    - `==`, `!=`\n- `||`\n\nLogical operators: `&&` (与), `||` (或), `!` (非)\n\n```c\n\
    i < lim - 1 && (c = getchar()) != '\\n' && c != EOF\n(c = getchar()) != '\\n'\n\
    !valid   /* 等价于 valid == 0 */\n```\n\nResult of logical expression: true ----\
    \ 1; false ---- 0;  \n当作逻辑判断时：非0 ---- true；0 ---- false；\n\n![](img/1879308d3bf2ec0664445e4bc0146293_34_0.png)\n\
    \n### 2.7 Type Conversions\n\nchar < short int < int < unsigned < long < unsigned\
    \ long < float < double\n\n**Example 1:**\n\n```c\nint atoi(char s[])\n{\n\tint\
    \ i, n;\n\tn = 0;\n\tfor (i = 0; s[i] >= '0' && s[i] <= '9'; ++i)\n\t\tn = 10\
    \ * n + (s[i] - '0');\n\treturn n;\n}\n```\n\n**Example 2:**\n\n```c\nint lower(int\
    \ c)\n{\n\tif (c >= 'A' && c <= 'Z')\n\t\treturn c + 'a' - 'A';\n\telse\n\t\t\
    return c;\n}\n```\n\n### 2.8 Increment and Decrement Operators\n\n(increment operator)\
    \ `++`: adds 1 to its operand (自增)  \n(decrement operator) `--`: subtracts 1 from\
    \ its operand (自减)\n\n```c\nint i = 3;\ni++; /* i = i + 1 */\n```\n\n`i++` and\
    \ `++i` are different (also `i--`, `--i`).\n\nIf n is 5, then:\n\n```c\nx = n++;\
    \ /* n = 6, x = 5 */\n```\n\nbut:\n\n```c\nx = ++n; /* n = 6, x = 6 */\n```\n\n\
    ```c\nvoid squeeze(char s[], int c)\n{\n\tint i, j;\n\tfor (i = j = 0; s[i] !=\
