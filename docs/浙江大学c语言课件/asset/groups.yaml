    \    expr3;\n}\n```\n\ninfinite loop:\n\n```c\nfor (;;) { ... }\n```\n\nprocessing\
    \ the first n elements of an array:\n\n```c\nfor (i = 0; i < n; i++)\n    ...\n\
    ```\n\n### Example 1:\n\n```c\n#include <ctype.h>\n/* atoi: convert s to integer;\
