    \\t%lf\\n\", sum+= atof(line));\n    return 0;\n}\n```\n\ndeclaration (function\
    \ prototype)\n\n> or : atof();\n> in old version\n\ncalling\n\n## 4.3 External\
    \ Variables\n\n- external variables: defined outside of any function and available\
    \ to many functions (globally accessible)\n\nExample:\n\ncalculator that provides\
    \ the operators +,-,/\n\nuse reverse Polish (逆波兰) notation instead of infix (中缀).\n\
    \n1 2 - 4 5 + * <===> (1-2)*(4+5)\n\nthe main algorithm of the program:\n\n```text\n\
    while(next operator or operand is not end_of_file indicator)\n    if(number) \
    \                        push it\n    else if (operator)                 pop operands\n\
    \                                      do operation\n                        \
    \              push result\n    else if (newline)                  pop and print\
    \ top of stack\n    else error\n```\n\n```c\n#include <stdio.h>\n#include <math.h>\n\
    #define MAXOP 100 /*max size of operand or operator */\nint getop(char []);\n\
    void push(double);\n/* reverse Polish calculator */\nmain()\n{\n    int type;\n\
    \    double op2;\n    char s[MAXOP];\n\n    while((type = getop(s))!=EOF) {\n\
    \        switch (type) {\n        case NUMBER: push(atof(s)); break;\n       \
    \ case '+': push(pop() + pop()); break;\n        case '*': push(pop() * pop());\
