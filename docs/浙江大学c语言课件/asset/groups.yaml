    \ / 2;\n        if (x < v[mid])\n            high = mid - 1;\n        else if\
    \ (x > v[mid])\n            low = mid + 1;\n        else\n            return mid;\n\
    \    }\n    return -1;\n}\n```\n\n## 3.4 Switch\n\n**syntax:** see chap2_2 2.3\n\
    \n### Example:\n\n```c\n#include <stdio.h>\nmain() /* count digits, white space,\
