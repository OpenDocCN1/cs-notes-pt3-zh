    \ Chapter 7. Input and Output\n\nInput and Output are not part of the C language,\
    \ but are provided by the standard library, including a set of functions.\n\n\
    ![](img/1879308d3bf2ec0664445e4bc0146293_173_0.png)\n\n### 7.1 Standard Input\
    \ and Output\n\nAn example: converts input to lower case\n\n```c\n#include <stdio.h>\n\
    #include <ctype.h>\n\nmain() /* lower: convert input to lower case */\n{\n   \
    \ int c;\n\n    while ((c = getchar()) != EOF)\n        putchar(tolower(c));\n\
    \    return 0;\n}\n```\n\n### 7.2 Formatted Output - printf\n\n```c\nint printf(char\
    \ *format, arg1, arg2, …)\n```\n\nNote:\n\n- The printf converts, formats and\
    \ prints its arguments on the standard output under the control of the format.\n\
    - It returns the number of characters printed.\n- The format string contains two\
    \ types of objects: ordinary characters, which are copied to the output stream,\
    \ and conversion specifications, each of which causes conversion and printing\
    \ of the next successive argument to printf.\n"
