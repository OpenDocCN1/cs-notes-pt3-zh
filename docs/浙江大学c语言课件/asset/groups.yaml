  md: "\n# The C Programming Language\n\n## Introduction\n\n- C is a general-purpose\
    \ programming language\n- C provides the fundamental control-flow constructions\n\
    - C is a relatively “low-level” language\n- C provides no operations to deal directly\
    \ with composite objects\n- C offers only straightforward, single-thread control\
    \ flow\n- C is independent of any particular machine architecture\n- Some of C\
    \ operators have the wrong precedence\n- Some parts of the C syntax could be better\n\
    \n## Chapter 1. A Tutorial Introduction\n\n### Let us begin with a quick introduction\
    \ to C\n\nWriting a program in C to print the words:\n\n**hello, world**\n\nIn\
    \ C, the program to print “hello, world” is:\n\n```c\n#include <stdio.h>\nmain()\n\
    {\n    printf(\"hello, world\\n\");\n}\n```\n\nIt's easy!\n\nThe program would\
    \ be written:\n\n```c\n#include <stdio.h>\nmain()\n{\n    printf(\"hello, \");\n\
    \    printf(\"world\");\n    printf(\"\\n\");\n}\n```\n\n### 【example】Calculate\
    \ 1+2+3+ ...... + 100\n\n### How to calculate 1+2+3+......+100\n\n```c\nmain()\n\
    {\n    int i,sum;\n    i = 1;sum=0;\n    while (i <= 100) {\n        sum = sum\
    \ + i;\n        i=i+1;\n    }\n    printf(\"%d\\n\", sum);\n}\n```\n\n### If a,b\
    \ inputted from keyboard with different values ?\n\n- How to calculate a+b （if\
    \ a,b inputted）\n\n```c\nmain()\n{\n int a,b, sum ;\n scanf(\"%d %d\",&a,&b);\n\
    \ sum = a+b;\n printf(\"%d\\n\", sum);\n}\n```\n\n## 1.2 Variables and Arithmetic\
    \ Expressions\n\nIn C, all variables must be declared before they are used.\n\n\
    **Formats:**\n\ntype variables\n\n**Examples**\n\nint fahr, celsius;\nint lower,\
    \ upper, step;\nfloat total;\n\n**In C, an expression is composed with:**\n\n\
    - constants\n- variables\n- functions\n- operators\n\n**Examples:**\n\nfahr=fahr+step\n\
    \n| Fahrenheit | Celsius |\n|---:|---:|\n| 0 | -17 |\n| 20 | -6 |\n| 40 | 4 |\n\
    | 60 | 15 |\n| 80 | 26 |\n| 100 | 37 |\n| 120 | 48 |\n| 140 | 60 |\n| 160 | 71\
    \ |\n| 180 | 82 |\n| 200 | 93 |\n| 220 | 104 |\n| 260 | 126 |\n| 280 | 137 |\n\
    | 300 | 148 |\n\n```c\n#include <stdio.h>\n\n/* printf Fahrenheit-Celsius table\n\
    \   for fahr=0,20,40,...,300 */\nmain()\n{\n    int fahr, celsius;\n    int lower,\
    \ upper, step;\n    lower=0;    /*lower limit of T table*/\n    upper=300;  /*upper\
    \ limit*/\n    step=20;    /*step size*/\n    fahr=lower;\n    while(fahr<=upper)\
    \ {\n        celsius=5*(fahr-32)/9;\n        printf(\"%d\\t%d\\n\", fahr,celsius);\n\
    \        fahr=fahr+step;\n    }\n}\n```\n\n## 1.2 Variables and Arithmetic Expressions\n\
    \nThe **printf** useful format:\n\n- %d\n  print as decimal integer;\n- %6d\n\
    \  print as decimal integer, as at least 6 characters wide;\n- %f\n  print as\
    \ floating point;\n- %6f\n  print as floating point, as at least 6 characters\
    \ wide;\n- %.2f\n  print as floating point, 2 characters after decimal point;\n\
    - %6.2f\n  print as float, at least 6 wide and 2 characters after decimal point;\n\
    - %o\n  print as octal;\n- %x\n  print as hexadecimal;\n- %c\n  print as a character;\n\
    - %s\n  print as character string;\n- %%\n  print % itself\n\n## 1.3 The FOR statement\n\
    \nRewrited program of temperature converter using FOR:\n\n```c\n#include <stdio.h>\n\
    \n/* print Fahrenheit-Celsius table */\nmain()\n{\n    int fahr;\n    for (fahr=0;\
    \ fahr<=300; fahr=fahr+20)\n    printf(\"%3d %6.1f\\n\", fahr, (5.0/9.0)*(fahr-32));\n\
    }\n```\n\n## 1.4 Symbolic Constants\n\nSymbolic Constants is a particular string\
    \ of characters.\n\n**Format:**\n\n```c\n#define *name* replacement-text\n```\n\
    \n**Function:**\n\nAny occurrence of name will be replaced by the corresponding\
    \ replacement-text.\n\n**Examples:**\n\n```c\n#define LOWER 0    /* lower limit\
    \ of table */\n#define UPPER 300  /*UPPER limit of table */\n#define STEP 20 \
    \   /*step limit of table  */\n                 /* print Fahrenheit-Celsius table\
    \ */\nmain()\n{\n    int fahr;\n    for (fahr=LOWER; fahr<=UPPER; fahr=fahr+STEP)\n\
    \        printf (\"%3d %6.1f\\n\", fahr, (5.0/9.0)*(fahr-32));\n}\n```\n"
