  md: '+   Bitwise inclusive OR (|)

    +   060 | 017 = ?

    +   060=> 0011 0000

    +   017=> 0000 1111

    +   | 0011 1111 (077)

    +   i.e.,060 | 017 = 077

    +   | is used to turn bits on:

    +   x = x | SET_ON


    +   Bitwise exclusive OR (^)

    +   规则：参加运算的两个相应位相同，则结果为0，相异则为1。

    +   0011 1001 (071)

    +   (^) 0010 1010 (052)

    +   0001 0011 (023)

    +   i.e., 071^052 = 023'
