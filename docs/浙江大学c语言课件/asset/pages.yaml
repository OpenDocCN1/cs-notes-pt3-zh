    # ### Program:\n\n```\n#include <stdio.h>\n#define MAXLINE 1000 /*maximum input\
    \ line size */\nint getline(char line[], int maxline);\nvoid copy(char to[], char\
    \ from[]);\nmain()\n{\n    int len, max;\n    char line[MAXLINE], longest[MAXLINE];\n\
    \    max = 0;\n    while((len = getline(line, MAXLINE)) > 0\n    if(len > max)\n\
    \    {\n        max = len; copy (longest, line) ;}\n    if(max>0) /* there was\
