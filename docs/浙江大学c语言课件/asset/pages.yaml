    \ char *defn)\n{\n    struct nlist *np;\n    unsigned hashval;\n    if((np=lookup(name))==NULL\
    \ { /*not found */\n        np= {struct nlist *}malloc(sizeof(*np));\n       \
    \ if(np==NULL|| (np->name = strdup(name)) ==NULL) return NULL;\n    }\n    hashval\
    \ = hash(name);\n    n[->next = hashtab[hashval];\n    hashtab[hashval]=np; /*insert\
