- pgno: 18
  md: "# 1.5 Character Input and Output\n\n**Word Counting:** count lines, words and\
    \ characters in input\n\n```\n```c\n#include <stdio.h>\n#define IN 1    /*inside\
    \ a word */\n#define OUT 0   /*outside a word */\nmain()\n{\n    int c, nl, nw,\
    \ nc, state;\n    state=OUT;\n    nl=nw=nc=0;\n    while((c=getchar())!=EOF){\n\
    \        ++nc;\n        if(c=='\\n')\n            ++nl;\n        if(c==' ' ||\
    \ c=='\\n' || c=='\\t')\n            state=OUT;\n        else if(state==OUT) {\n\
    \            state=IN; ++nw; }\n    }\n    printf(\"%d %d %d\\n\",nl,nw,nc);\n\
    }\n```\n```"
