  md: '+   【Example 1】有5个人坐在一起，问第5个人多少岁？他说比第4个人大2岁。第4个人说比第3个人大2岁。第3个人说比第2个人大2岁。第2个人说比第1个人大2岁。第1个人说他10岁。请问第5个人多大？


    +   〖分析〗


    +   显然，这是一个递归问题：


    +   age(5) = age(4) + 2


    +   回 age(4) = age(3) + 2 递


    +   age(3) = age(2) + 2


    +   推 age(2) = age(1) + 2; 推


    +   age(1) = 10


    +   可表示为递归公式：


    +   10 n = 1


    +   age(n) =


    +   age(n-1)+2 n > 1


    +   使递归结束的条件： age(1) = 10;'
