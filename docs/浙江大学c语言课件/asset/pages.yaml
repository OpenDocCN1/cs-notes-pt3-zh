    \  int i, last;\n    void swap(char *v[], int i, int j);\n    if(left >= right)\
    \ return;\n    swap(v, left, (left+right)/2);\n    last=left;\n    for(i=left+1;\
    \ i<=right; i++)\n        if(strcmp(v[i],v[left]) <0)\n            swap(v, ++last,i);\n\
