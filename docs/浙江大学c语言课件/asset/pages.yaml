  md: '# 7.4 Formatted Input-Scanf


    int scanf(char *format, ...)


    int sscanf(char *string, char *format, arg1, arg2, ...);


    +   1 scanf reads characters from the standard input,

    +   interprets them according to the specification in format.


    +   2 sscanf is like scanf does, but from string, not from

    +   standard input


    +   3 the format strng is just like printf, only for ordinary

    +   characters (not %), which are expected to match the

    +   next non-white space character of the input stream.


    eg1: int day, year;

    char monthname[20];

    scanf("%d %s %d", &day, &monthname, &year);


    eg2: int a, b, c;

    char s[] = "3 4 5 6 7";

    sscanf(s, "%d*%d *%d %d %d", &a, &b, &c);

    The result is a==3 b==6 and c==7'
