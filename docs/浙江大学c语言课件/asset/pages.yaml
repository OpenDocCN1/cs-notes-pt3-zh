- pgno: 42
  md: "+   - ☆ One’s complement (~)\n\n+   - The unary operator ~ yields the one’s\
    \ complement of an integer; that is, it converts each 1-bit into a 0-bits and\
    \ vice versa.\n\n+   - `025 = 0000 0000 0010 0101`\n\n+   - `~025 = 1111 1111\
    \ 1101 1010`\n\n+   - i.e., `~025 = 0177732` (**NOT -025**)\n\n+   - Example:\
    \ `x = x & ~077` sets tha last six bits of x to zero.\n\n+   - Note: `x & ~077`\
    \ is independent of word length.  \n+     (cf: `x&0177700`)\n\n![](img/1879308d3bf2ec0664445e4bc0146293_42_0.png)"
