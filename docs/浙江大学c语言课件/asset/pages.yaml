  md: '# # 5.9 Pointers vs. Multi-dimensional Array


    Difference between a two-dimensional array and an array of pointer:


    int a[10][20];


    int *b[10];


    Although a[3][4] and b[3][4] are both syntactically legal reference to a single
    int, but:


    +   1: a is a true two-dimensional array, b is only a one-dimensional array


    +   2: a has 200 int-sized locations, b only 10 pointers.


    +   3: the rows of b may be of different lengths.


    **Because of 3, the most frequent use of arrays of pointers is to store character
    strings of diverse lengths.**'
