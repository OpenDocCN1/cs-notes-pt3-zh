  md: "# 1.2 Variables and Arithmetic Expressions\n\nProgram Examples\n\n| Fahrenheit\
    \ | Celsius |\n|---:|---:|\n| 0 | -17 |\n| 20 | -6 |\n| 40 | 4 |\n| 60 | 15 |\n\
    | 80 | 26 |\n| 100 | 37 |\n| 120 | 48 |\n| 140 | 60 |\n| 160 | 71 |\n| 180 | 82\
    \ |\n| 200 | 93 |\n| 220 | 104 |\n| 260 | 126 |\n| 280 | 137 |\n| 300 | 148 |\n\
    \n```\n```c\n#include <stdio.h>\n\n/* printf Fahrenheit-Celsius table\n   for\
    \ fahr=0,20,40,...,300 */\nmain()\n{\n    int fahr, celsius;\n    int lower, upper,\
    \ step;\n    lower=0;    /*lower limit of T table*/\n    upper=300;  /*upper limit*/\n\
    \    step=20;    /*step size*/\n    fahr=lower;\n    while(fahr<=upper) {\n  \
    \      celsius=5*(fahr-32)/9;\n        printf(\"%d\\t%d\\n\", fahr,celsius);\n\
    \        fahr=fahr+step;\n    }\n}\n```\n```"
