- pgno: 139
  md: '# 第五章　函数


    （四）当一个函数执行结束之后，系统应作如下工作：


    +   1. 如果函数有返回值，将函数的返回值放到一个临时的变量空间。

    +   2. 根据栈顶记录的信息，恢复调用函数的运行状态。

    +   3. 释放栈顶空间。

    +   4. 根据函数的返回地址，继续调用函数的运行。


    注：在不再需要所申请的内存空间时，一定要及时释放。'
