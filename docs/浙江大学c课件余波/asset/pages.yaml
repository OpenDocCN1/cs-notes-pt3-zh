  md: '# # 第14章 继承


    # ## 五、派生类对象的构造


    # ### 1、基类成员的构造


    利用派生类的构造函数的成员初始化参数表来将初始化信息传递给基类的构造函数。


    如： Derived:: Derived(int m1 ,int m2,int m3):Base(m1,m2){mem3=m3;;

    或： Derived:: Derived(int m1 ,int m2,int m3):Base(m1,m2)， mem3 （m3） { }

    注： 若基类有默认构造函数，则实现派生类的构造函数时，可以不传递参数给基类的构造函数。'
