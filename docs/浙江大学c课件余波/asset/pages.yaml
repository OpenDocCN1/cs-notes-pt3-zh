  md: '# # 第13章 运算符重载


    # ## § 13.1 可以重载的运算符


    # ## 一、运算符重载：


    对已有的运算符重新进行定义，赋予其另一种功能，以适应不同的数据类型。


    # ## 二、运算符重载通过运算符重载函数来实现。


    # ### 1、运算符重载函数的定义格式


    # #### （1）单目运算符


    类型 operator单目运算符（参数）函数体


    # #### （2）双目运算符


    类型 operator双目运算符（参数1，参数2）函数体


    如： A operator++(A&x) {.....}


    A operator+(A&x,A&y) {....}'
  merge: -1
  img_proc: true
