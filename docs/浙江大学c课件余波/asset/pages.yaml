- pgno: 430
  md: '# # 第14章 继承


    # ## 四、继承方式


    # ### 1、公有继承


    # #### （1）定义格式


    ```

    class Derived : public Base

    { Derived的成员定义};

    ```


    # #### （2）特性


    +   ☆对于公有继承，基类的所有成员的访问控制将在派生类中保持不变。


    +   ☆可以通过派生类的对象来访问基类的公有成员。


    +   ☆不能访问派生类、基类的保护和私有成员。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# # 第14章 继承


    # ## 2、保护继承


    # ### （1）定义格式


    ```

    class Derived :protected Base

    { Derived的成员定义};

    ```


    # ### （2）特性


    +   ⭐对于保护继承，基类的公有和保护成员在派生类中成为保护成员，而私有成员在派生类中不可访问。


    +   ⭐不能通过派生类对象直接访问基类的任何成员。'
  merge: -1
  img_proc: true
