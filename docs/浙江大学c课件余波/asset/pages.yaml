  md: '# # 第六章 简单程序设计


    # ## （2）特性：


    +   ★ 具有静态生存期。也就是说，它的生存期和整个程序的运行期是一样的，并且变量处于内存的全局数据区，而不在栈区；并且系统自动将其初始化为0；


    +   ★ 只被初始化一次；


    +   ★ 在函数退出以后，静态局部变量不被释放，它保留它的值。因此下一次进入函数后，静态局部变量还能保留它的值。'
