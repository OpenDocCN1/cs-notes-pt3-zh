  md: '# # 第13章 运算符重载


    # ## § 13.3 常用运算符重载


    # ### 一、函数调用运算符的重载


    （必须定义为类的成员函数）


    如：Matrix m;


    m.GetAt(i,j)=3m(i,j)=3;


    # ### 二、赋值运算符的重载


    +   1、系统会为类自动提供一个默认的赋值运算符。


    +   2、当类具有指针类型的数据成员时，需重新定义赋值运算符。


    +   3、重载赋值运算符必须定义为类的成员函数。'
