  md: '# 第13章　运算符重载


    # 2、运算符重载函数的调用格式


    # （1）单目运算符


    +   ☆ `operator`单目运算符（实参）

    +   ☆ 单目运算符　实参


    如：`operator++(x)` 或 `++x`


    # （2）双目运算符


    +   ☆ `operator`双目运算符（实参1，实参2）

    +   ☆ 实参1　双目运算符　实参2


    如：`operator+(x, y)` 或 `x+y`'
