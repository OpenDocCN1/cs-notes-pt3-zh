    一个类的友元函数或友元类可以直接访问该类的任何成员，包括私有成员和保护成员。


    # ## 三、使用场合


    +   1、一个函数需要经常而且大量地访问一个类的数据成员。


    +   2、一个类从属于另一个类，而且一般不单独使用，而是通过另一个类的对象来发挥作用。


    +   3、运算符重载'
