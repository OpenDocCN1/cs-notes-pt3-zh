    # § 13.5　类型转换函数


    一、类型转换函数是一种特殊类型的成员函数。可以自行定义从一个类对象向其他数据类型数据的转换方式。


    二、类型转换函数在类定义体中定义，格式为：`operator type()函数体`


    类型转换函数没有返回值类型，而且参数表为空。type是要转化的数据类型。


    如：`operator int(){return val;}`'
