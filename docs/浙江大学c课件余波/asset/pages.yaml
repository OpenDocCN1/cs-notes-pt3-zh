  md: '# # 第14章 继承


    # ## 2、构造函数与析构函数的执行顺序


    # ### ⭐构造函数的执行顺序：


    先调用基类的构造函数；


    再调用对象成员的构造函数；


    最后调用派生类本身的构造函数。


    # ### ⭐析构函数的执行顺序：


    先调用派生类本身的析构函数；


    再调用对象成员的析构函数；


    最后调用基类的析构函数；'
