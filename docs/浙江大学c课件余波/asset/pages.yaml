- pgno: 437
  md: '# # 第14章 继承


    # ## 三、二义性


    +   1、当派生类中有和基类同名的成员时，派生类中的同名成员将会覆盖基类的成员。（例见P376-377）


    +   2、要访问基类被覆盖的成员，可以通过在所访问的成员名前加上所属的类域标志。（例见P377-378）


    +   3、对于间接基类，必须指定所要访问的成员是从哪条路径继承而来的。（例见P378）'
