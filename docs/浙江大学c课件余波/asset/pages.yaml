  md: '# # 第五章 函数


    （三）每进行一次函数调用，系统应作如下工作：


    +   1、建立被调用函数的栈空间。

    +   2、保存调用函数的运行状态和返回地址。

    +   3、将实在参数的值传递给被调用函数。

    +   4、将程序控制交给被调用函数。'
