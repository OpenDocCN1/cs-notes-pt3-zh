  md: '# # 第六章 简单程序设计


    # ## 四、生存期


    标识符在程序运行过程中生存的时间


    # ### 1、局部生存期


    +   1. 存在于函数的执行期间


    +   2. 局部变量具有局部生存期


    # ### 2、静态生存期


    +   1. 存在于整个程序的运行期间


    +   2. 全局变量具有静态生存期


    # ### 3、动态生存期


    +   1. 从申请到释放的期间


    +   2. 动态申请的空间具有动态生存期'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# # 第六章 简单程序设计


    # ## 4、生存期与内存


    +   (1) 全局数据区存放具有静态生存期的变量


    +   (2) 堆区存放具有动态生存期的变量


    +   (3) 栈区存放具有局部生存期的变量


    # ## 5、初始化问题


    具有静态生存期的变量将由系统自动初始化为0，但不对具有局部生存期和动态生存期的变量进行初始化。'
