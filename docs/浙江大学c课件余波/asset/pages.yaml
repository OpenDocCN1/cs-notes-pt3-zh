  md: '# # 第14章 继承


    # ## 二、构造函数与析构函数


    1、在多继承中，派生类构造函数的定义和单继承类似。（在构造函数中，用成员初始化参数表来将初始化信息传递给基类的构造函数参数）（例见P374）


    2、构造函数的执行顺序：

    先依次调用各基类的构造函数；

    再调用对象成员的构造函数；

    最后调用派生类本身的构造函数。


    3、析构函数的执行顺序（与构造函数相反）'
