  md: '# # 第14章 继承


    # ## 四、虚基类


    # ### 1、作用


    当基类通过多条派生路径为派生类继承时，派生类只继承该基类一次，即派生类对象只保存一份该基类的数据成员的值。


    # ### 2、定义形式


    在基类的访问控制前加上virtual。'
