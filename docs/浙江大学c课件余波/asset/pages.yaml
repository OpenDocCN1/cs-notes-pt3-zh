- pgno: 439
  md: '# # 第14章 继承


    # ## 3、初始化


    虚基类构造函数的参数必须由最新派生出来的类负责初始化。（例见P380）


    +   ☆对于非虚基类，不允许在派生类的构造函数中初始化间接基类；而对于虚基类，则必须在派生类中对虚基类初始化。


    +   ☆为保证虚基类在派生类中只继承一次，必须在该基类的所有直接派生类中声明为虚基类。'
