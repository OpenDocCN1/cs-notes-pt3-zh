    +   解压语言包，将语言包下面的两个文件夹直接拷贝到E:\Eclipse目录下，覆盖原文件夹：


    +   features, plugins


    +   进入E:\Eclipse目录，执行Eclipse


    +   将自动搜索JDK，并建立工作区


    +   请在课程网站 上下载有关Eclipse的操作指南'
