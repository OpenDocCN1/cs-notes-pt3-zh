    // 【例3-7】命令行输入1～12之间的数字，输出对应的月份的英文名

    public class Chapter37 {

    public static void main(String[] args) {

    String str="";

    switch(Integer.parseInt(args[0])){//根据输入的值进行多选

    case 1: str="January"; break;

    case 2: str="February"; break;

