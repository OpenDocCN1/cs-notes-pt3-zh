    \n注意：类属于复合数据类型，因此，在声明对象时，系统并没有为对象分配空间，用户需要应用 new 完成分配空间的任务。\n\n```java\nP1= new\
    \ Point( );    // 给P1 对象分配存储空间\n```\n\n### 对象的引用\n\n```java\nclass Point {\n \
