    ```\n\n```java\n// 类中的主方法main，对本“类”定义并使用对象\npublic static void main(String args[]){\n\
    \    Triangle t1; //声明Triangle类对象t1\n    t1=new Triangle(3,4,5); //实例化对象t1，调用构造方法对其进行初始化\n\
    \n    /* 调用judge()方法，判断t1的成员变量是否能构成直角三角形的3个边长 */\n    if(judge(t1))\n        System.out.println(\"\
    这是一个直角三角形\");\n    else\n        System.out.println(\"这不是一个直角三角形\");\n}\n```\n\
    \n### Java实例6-4— 定义构造方法\n\n```java\nclass Student\n{\n    String name;       //\
    \ 定义类的成员变量\n    String address;\n    int grade;\n    Student(String x1,String\
    \ x2,int x3) { //定义构造方法\n        name=x1;\n        address=x2;\n        grade=x3;\n\
    \    }\n}\n```\n\n```java\npublic static void main(String args[]) {\n    Student\
    \ zhang;  //声明并创建zhang对象\n    zhang=new Student(\"张三\",\"西安市兴庆路1号\",3);\n    Student\
    \ wang;  //声明并创建wang对象\n    wang=new Student(\"王五\",\"西安市翠华路12号\",4);\n    System.out.println(zhang.name+zhang.address+zhang.grade);\n\
    \    System.out.println(wang.name+wang.address+wang.grade);\n}\n}\n```\n\n###\
    \ 缺省构造方法的使用\n\n所谓“缺省(Default)”构造方法，是在类中没有定义构造方法，Java默认的类成员方法初始化处理。\n注意：Java中变量必须初始化，即赋初值才能使用变量\n\
    \n```java\nclass Student {\n    String name;    //成员变量\n    String address; //成员变量\n\
    \    int score;      //成员变量\n    public void setMessage(String x1,String x2, int\
    \ x3) {//成员方法\n        name=x1;\n        address=x2;\n        score=x3;\n    }\n\
    }\n```\n\n```java\npublic static void main(String args[])\n{\n    Student s1=new\
    \ Student();    //创建Student类对象\n    s1;\n    System.out.println(s1.name+\" \"\
    +s1.address+\"\\n\"+s1.score);\n    //输出缺省构造方法的初始化结果\n    s1.setMessage(\"张三\"\
    ,\"西安市兴庆路1号\",75);\n    // 调用成员方法给成员变量赋值\n    System.out.println(s1.name+\" \"\
    +s1.address+\"\\n\"+s1.score);\n}\n}\n```\n"
