  md: "\n## Homework\n\n- P28 习题1-7\n- 习题8：假设摄氏温度为38度，计算相应的华氏温度值。\n- 系统9：假设半径为6.5，计算球的体积。\n\
    \n## Overview\n\n本章为课程的重点之一\n\n- 3.1 语句及程序结构\n- 3.2 顺序结构\n- 3.3 选择结构\n- 3.4 循环结构\n\
    - 3.5 跳转语句\n\n## 语句\n\n### 语句，Statement\n\n- 向计算机系统发出操作的代码\n- 程序由一系列语句组成，语句以 “;\
    \ ” 结束\n\n### Java语句类型\n\n- 表达式语句，如： total=math+phys+chem\n- 空语句，只有一个 “;”\n- 复合语句，用\
    \ “{}”将多条语句括起来作为一条语句使用，如：\n  - If (x>10)\n  - z=x+y;\n  - t=z/10;\n- 方法调用语句： 方法名(参数);\
    \ 如：\n  - System.out.println(\"Java Language\");\n- 控制语句，完成一定的控制功能，包括\n  - 选择语句\n\
    \  - 循环语句\n\n## 程序结构\n\n- 任何程序有3种基本的结构：\n  - 顺序结构\n  - 分支结构\n  - 循环结构\n- 顺序结构\n\
    \  - 最简单的一种程序结构\n  - 程序按照语句的书写次序顺序执行\n\n## 顺序结构 Demo1，【例3-1】\n\n```java\npublic\
    \ class Force {    // 计算太阳和地球之间的万有引力\npublic static void main(String args[]) {\n\
    \    double g, mSun, mEarth, f;\n\ng=6.66667E-8;\nmSun = 1.987E33;\nmEarth = 5.975E27;\n\
    f = g* mSun* mEarth /(1.495E13*1.495E13);\nSystem.out.println(\"The force is \"\
    +f);\n}\n}\n```\n\n## 顺序结构 Demo2，【例3-2】\n\n```java\n// 华氏温度转换为摄氏温度： c=5(F-32)/9\n\
    public class Conversion{\n    public static void main(String args[]) {\n     \
    \   float f, c;\n        f=70.0f;\n        c=5*(f-32)/9;\n        System.out.println(\"\
    Fahrenheit=\"+f);\n        System.out.println(\"Centigrade=\"+c);\n    }\n}\n\
    ```\n\n## 顺序结构Demo3，【例3-3】\n\n```java\npublic class Root {\n    public static\
    \ void main(String args[]) {\n        int a, b, x;\n        a=Integer.parseInt(args[0]);\
    \ //命令行输入第一个数\n        b=Float.parseFloat(args[1]); //命令行输入第二个数\n        x=-b/a;\
    \ // 求根 x\n        System.out.println(\"a=\"+a); // Out Result\n        System.out.println(\"\
    b=\"+b);\n        System.out.println(\"x=\"+x);\n    }\n}\n```\n\n## Demo3 解析：\n\
    \n其中语句：a=Float.parseFloat(args[0]);\n\n转换为浮点数\n\n这是命令行输入的第一个数\n\nEclipse“运行”——Java应用程序对话框的(x)=自变量栏中键入：\n\
    2.0 6.0\n运行程序，屏幕输出结果如下：\na=2.0\nb=6.0\nx=-3.0\n这里： 2.0和6.0分别作为第1和第2个参数传递给args[0]和args[1]。\n\
    \n## Lab 3-1\n\n- 题1：编写一个程序，计算方程 ax=b 的x，其中a、b通过命令行输入，且为长整型，但 x 为Double型。\n- 题2：程序计算：华氏温度转换为摄氏温度：\
    \ c=5(F-32)/9，其中F值通过命令行输入。\n- 选作：求解二元一次方程。系数通过命令行输入，假设输入能够有解。\n\n## 选择结构\n\n-\
    \ 选择结构，也叫分支结构\n- Java分支选择语句：\n  - **if**　 二选一\n  - **switch**　 多选一\n\n## if 语句\n\
    \n- if (布尔表达式) 语句\n- if (布尔表达式) 语句1 else 语句2\n\n## 选择结构 Demo1：\n\n```java\npublic\
    \ class MinNum {//【例3-4】命令行输入2个整数，输出较小者\npublic static void main(String args[])\
    \ {\nint x, y, min;\nx=Integer.parseInt(args[0]); //命令行第一个数\ny=Integer.parseInt(args[1]);\
