    # # 排序


    +   - 排序是将一组数按照递增或递减的顺序排列

    +   - 排序的方法很多，其中最基本的是选择法

    +   - 选择法排序基本思想


    +   ① 对于给定的 n 个数，从中选出最小（大）的数，与第1个数交换位置 → 最小（大）的数置于第1个位置

    +   ② 对第1个数外的剩下的 n−1 个数，重复步骤1，将次小（大）的数置于第2个位置

    +   ③ 对于剩下的 n−2，n−3，…，n−n+2 个数用同样的方法，分别将第3个最小（大）数置于第3个位置，第4个最小（大）数置于第4个位置，

    +   ④ ……，第 n−1 个最小（大）数置于第 n−1 个位置'
