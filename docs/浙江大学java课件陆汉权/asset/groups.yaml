    \ → x; b → y\n  - 调用前后：a、b的值没有变\n  - 交换前后：x、y的值改变了\n\n```java\nstatic void swap(int\
    \ x, int y) {\n    int temp = x; x = y; y = temp; // 交换\n}\npublic static void\
    \ main(String[] args) {\n    int a = 23, b = 10;\n    swap(a, b); // 调用“方法”\n\
    }\n```\n\n### 4.4 递归(recursion)\n\n- 递归：用自身的结构来描述自身，典型的例子是阶乘运算。\n- 简而言之：递归就是自己调用自己。\n\
    \n### 【例4-6】递归算法求n!\n\n**n!的算法**\n\nn! = n×(n-1)!\n(n-1)! = (n-1)×(n-2)!\n(n-2)!\
    \ = (n-2)×(n-3)!\n……\n2! = 2×1!\n1! = 1\n\n**递归定义**：F=n!，设计算阶乘的“方法”为fac(n)\n\n\
    fac(n) = n * fac(n-1)\n当n=1，n=0时，fac(n)=1\n\n### And More\n\n计算阶乘，也可以使用循环结构的“方法”\n\
    \n```java\nstatic long fac(int n) {\n    long m=1;\n    for (int i=1; i<=n; i++)\n\
    \        m = m*i;\n    return m;\n}\n```\n\n### Compare:\n\n```c\nstatic long\
    \ fac( int n){\n    if (n == 1)\n        return 1;\n    else\n        return n*fac(n-1);\n\
    }\n```\n\n```c\nstatic long fac(int n) {\n    long m=1,i;\n    for (i=1; i<=n;\
    \ i++)\n        m = m*i;\n    return m;\n}\n```\n\n### 递归程序设计的规范\n\n- 计算递归公式\n\
    - 确定递归出口\n- 例如：求1、1、2、3、5、8、13、21、34……第 n 项的输出\n- 递归公式：f(n) = f(n-1)+f(n-2)\n\
    - 递归出口：f(1)=1，f(2)=1\n\n### 例：梵塔（Hanoi）问题\n\n据古印度神话，在贝拿勒斯的圣庙里安放着一块铜板，板上有3根宝石针。梵天（印度教的主神）在创造世界的时候，在其中的一根针上摆放了由小到大共64片中间有空的金片。无论白天和黑夜，都有一位僧侣负责移动这些金片。移动金片的规则是：一次只能将一个金片移动到另一根针上，并且在任何时候以及任意一根针上，小片只能在大片的上面。当64个金片全部由最初的那根针上移动到另一根针上时，这世界就在一声霹雳中消失。\n\
    \n![](img/80da1d99a94a92757465da523b64f0ce_178_0.png)\n\n## 第5章 数组 Array\n\n###\
    \ Review: about Method\n\n- 编写“方法”\n- 在 **Main** 方法中调用，也可以在“方法”中调用“方法”。\n- 所有“方法”，都是“类”的一部分，且“地位”相当，因此方法不能“嵌套”\n\
    - 方法\n  - 方法类型（返回值），方法名，形式参数\n- 调用\n  - “方法”调用：方法有返回值时\n  - “方法”语句：方法没有返回值（**void**）\n\
    \n- 要求\n  - 能够解读“方法”的程序代码\n  - 编写简单的“方法”\n- 常用的方法（自定义）\n  - 水仙花数\n  - 计算阶乘；\n\
    \  - 求阶乘之和\n  - 计算多项式——例如第4章习题3\n  - 计算公约数、公倍数\n  - 判断素数\n  - **Fibonacci**数列\n\
    \n### Introduction\n\n- 数组，Array（阵列）\n- 变量：定义单个数据\n- 数组：定义多个数据\n  - 具有相同性质的一批数据\n\
    \  - Java 数组：用一个变量表示一组相同类型的数据\n"
