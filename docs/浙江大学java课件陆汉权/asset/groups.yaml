    x=\"+x+“ y=\"+y);\nSystem.out.println(\"min=\"+min);\n}\n}\n```\n\n## 选择结构 Demo2:\n\
    \n```java\npublic class Root { // [例3-5]:求解ax+b=0(a≠0)的根\npublic static void main(String\
    \ args[]) {\n    float a, b, x;\n\na=Float.parseFloat(args[0]); // 输入a\nb=Float.parseFloat(args[1]);\
    \ // 输入b\n\nif (Math.abs(a)>0.000001f) { // a!=0\n    x=-b/a;\n    System.out.println(\"\
    x=\"+x); // 输出x\n    }\n}\n}\n```\n\n## if 语句嵌套\n\nif 语句中可以包含if语句，形成嵌套\n\n```\n\
    if（布尔表达式1）\n    语句1\nelse if（布尔表达式2）\n    语句2\n\n    ……\n        else if（布尔表达式n）\n\
    \            语句n\n```\n\n```java\npublic class Function{\n    public static void\
    \ main(String args[]) {\n        float x, y;\n        x=Float.parseFloat(args[0]);\n\
    \        if ( x<0 )\n            y = 0;\n        else if ( x >=0 && x <= 10 )\n\
    \            y = x;\n        else if ( x > 10 && x <= 20 )\n            y = 10;\n\
    \        else\n            y = -0.5f * x + 20;\n        System.out.println(\"\
    x=\"+x);\n        System.out.println(\"y=\"+y);\n    }\n}\n```\n\n| 例3-6 分段函数\
    \ |  |\n|---|---|\n| x | y |\n| x<0 | 0 |\n| 0<=x<=10 | x |\n| 10<x<=20 | 10 |\n\
    | 20<x | 0.5x+20 |\n\n## Lab 3-1\n\n### 题3：计算分段函数的值\n\n| x | y |\n|---|---|\n\
    | x<0 | -1 |\n| x=0 | 0 |\n| 0<x≤10 | 1 |\n| 10<x≤20 | 2 |\n| 20<x | x/2 + 20\
    \ |\n\n## Switch语句\n\n```java\nswitch (表达式) {\n    case 值1: 语句块1; // 如果表达式值为值1，执行语句块1\n\
    \        break; // 终止，结束switch语句\n    case 值2: 语句块2;\n        break; // 终止，结束switch语句\n\
    \    ......\n    case 值n: 语句块n; // 如果表达式值为值n，执行语句块n\n        break; // 终止，结束switch语句\n\
    \    default: // 如果表达式值与值1～值n都不同，执行语句块n+1\n        语句块n+1;\n}\n```\n"
