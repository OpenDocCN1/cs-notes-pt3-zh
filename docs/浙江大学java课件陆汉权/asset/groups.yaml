    +   本质上说，子类和父类都是“类”，因此存在访问权限问题


    +   子类继承了父类的成员变量和成员方法


    +   但并非对父类所有成员变量和成员方法都有访问权限，换句话说：


    +   子类声明的方法中并不能访问父类所有成员变量或成员方法！


    +   子类访问父类成员的权限如下


    +   对父类的private成员没有访问权限。


    +   对父类的public和protected成员具有访问权限。


    +   对父类的缺省权限成员访问权限分2种情况


    +   1. 对同一包中父类的缺省权限成员具有访问权限


    +   2. 对其它包中父类的缺省权限成员没有访问权限'
