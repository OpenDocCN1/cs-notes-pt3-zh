  mdcn: "\n\n# Chapter 7\n\n## 类的继承和多态机制\n\n### 一个例子\n\n- 假设我们定义一个类 student  \n  其中包含了一个学生的所有信息，包括学号、姓名、性别、籍贯、院系、年级、专业、各课程的成绩……\n\
    \n- 现在，有部分学生还有一些其他信息，例如获奖信息\n\n- How to Do?\n\n- 这一类问题特别普遍……\n\n### In Java\n\n\
    显然，部分学生应该“继承”类 student 的所有属性，再加上一些获奖的属性\n\n```java\nclass Student {\n    ......\n\
    }\nclass ExStudent extends Student {\n    // 加上有关获奖的成员变量和方法\n}\n```\n\n### In\
    \ Java\n\n- 关键字 extends\n  - 指示所建立的新的类 ExStudent 派生于已经存在的类 Student —— 继承\n  -\
    \ 已经存在的类 Student 称为\n    - 超类 superclass，或者\n    - 基类 base class，或者\n    - 父类\
    \ parent class\n  - 新的类 ExStudent 称为\n    - 派生类 derived class，或者\n    - 子类 subclass，或者\n\
    \    - 孩子类 child class\n- 有趣的：\n  - 子类比父类具有更多的功能\n\n```java\nclass Student {\n\
    \    ......\n}\nclass ExStudent extends Student {\n    // 加上有关获奖的成员变量和方法\n}\n\
    ```\n\n### And more\n\n- Java 类是一个层次结构\n  - Java 有一个叫做 Object 的超类，是所有类的祖先\n  -\
    \ 所有类都直接或间接地继承自 Object 类\n  - 如果在定义类的时候没有指出其超类，默认继承 Object\n- 一旦定义了一个类，就自动继承了\
    \ Object 类的许多成员和成员方法，例如\n  - `hashCode()` // 获取 hash 码\n  - `equals()` // 检测是否与另外一个对象相等\n\
    \  - `toString()` // 返回表示对象值的字符串\n\n### And More\n\n- 子类继承父类的\n  - 属性和方法\n  -\
    \ 可修改父类的属性或重载父类的方法\n  - 在父类的基础上添加新的属性和方法\n- 继承的关系：\n  - 父类 —— 一般情况\n  - 子类 ——\
    \ 包含一般情况下的特殊情况\n- 多个子类共同继承一个父类，那么该父类就是多个子类的基类\n- Java 语言只支持单继承\n  - 如果要定义多继承，可以使用“接口”\n\
    \n### 定义子类的形式\n\n```\n【访问权限】 class 类名 extends 父类名{\n    类体\n}\n```\n\n- **Extends**\n\
    \  - 指明新定义子类及其继承的父类\n\n### 类的继承原则\n\n### Rules:\n\n1. 子类继承父类的成员变量\n   - 实例成员变量\n\
    \   - 类成员变量\n\n2. 子类继承父类成员方法\n   - 实例成员方法\n   - 类成员方法\n   - 但不包括构造方法\n   - 父类的构造方法\
    \ → 创建父类对象\n   - 子类需定义自己的构造方法 → 创建子类的对象\n\n3. 子类可以重新定义父类成员\n\n### 访问权限\n\n本质上说，子类和父类都是“类”，因此存在访问权限问题\n\
    \n子类继承了父类的成员变量和成员方法\n\n但并非对父类所有成员变量和成员方法都有访问权限，换句话说：\n\n子类声明的方法中并不能访问父类所有成员变量或成员方法！\n\
    \n子类访问父类成员的权限如下\n\n对父类的 private 成员没有访问权限。\n\n对父类的 public 和 protected 成员具有访问权限。\n\
    \n对父类的缺省权限成员访问权限分 2 种情况\n\n1. 对同一包中父类的缺省权限成员具有访问权限\n\n2. 对其它包中父类的缺省权限成员没有访问权限\n\
    \n### Java 实例——类的继承\n\n```java\npublic class Person1 {\n    private String name;\n\
    \    protected int age;\n\n    public void setName(String na) {\n        name\
    \ = na;\n    }\n    public void setAge(int ag) {\n        age = ag;\n    }\n \
    \   public String getName() {\n        return name;\n    }\n    public int getAge()\
    \ {\n        return age;\n    }\n}\n```\n\n### Java 实例——（续）\n\n```java\npublic\
    \ void print_p() {\n    System.out.println(\"Name:\" + name + \"  Age:\" + age);\n\
    }\n} 类 Person1 结束\n```\n\n```java\npublic class Teacher1 extends Person1 { //\
    \ 子类派生于父类\n    protected String department; // 定义了成员变量 系部\n\n    public Teacher1(String\
    \ na, int ag, String de) {\n        setName(na);\n        setAge(ag);\n      \
    \  department = de;\n    }\n```\n\n```java\npublic void print_s() {\n    print_p();\
    \ // 访问父类成员方法\n    System.out.println(\"Department:\" + department);\n}\npublic\
    \ static void main(String arg[]) {\n    Teacher1 t; // 定义子类的对象 t\n    t = new\
    \ Teacher1(\"Wang\", 40, \"Computer Science\");\n    t.print_s();\n    t.setName(\"\
    Wang Gang\");\n    t.age = 50;\n    // 可以直接访问父类中 protected 成员变量 age，但不能访问父\n \
    \   // 类的 private 成员变量 name\n    t.print_s();\n}\n} // 子类 Teacher 结束\n```\n\n\
    程序运行结果如下：\n\nName: Wang   Age: 40\n\nDepartment: Computer Science\n\nName: Wang\
    \ Gang   Age: 50\n\nDepartment: Computer Science\n\n### Java 的两个关键字\n\n- super\n\
    \  - 指父类的对象\n- this\n  - 通常指当前对象\n\n### super\n\n- 可以使用 super 引用父类成员变量\n  - `super.成员变量名`\n\
    - 调用父类成员方法\n  - `super.成员方法名(参数表)`\n- 调用父类构造方法\n  - `super(参数表)`\n\n### this\n\
    \n使用 this 引用当前对象的成员变量  \nthis.成员变量名  \n调用当前对象的成员方法  \nthis.成员方法名(参数表)  \n调用当前对象的构造方法\
    \  \nthis(参数表)\n\n### 例 7-2--利用 super 访问父类成员\n\n```java\nclass Person2 {\n   \
    \ protected String name;\n    protected int age;\n\n    public Person2(String\
    \ na, int ag) { // 构造方法\n        name = na;\n        age = ag;\n    }\n\n    public\
    \ void print() { // print 方法\n        System.out.println(\"Parent:Name=\" + name\
    \ +\n            \"Age=\" + age);\n    }\n} // 类 Person2 结束\n```\n\n```java\n\
    // Teacher2 为 Person2 的子类\npublic class Teacher2 extends Person2 {\n    String\
    \ department, name; // 子类的成员变量\n\n    public Teacher2(String na, int ag, String\
    \ de, String na1) {\n        super(na, ag); // super 关键字指出调用的是父类的构造方法\n      \
    \  department = de;\n        name = na1;\n    }\n\n    public void setName_p(String\
    \ na) {\n        super.name = na; // super 指出这里的成员变量是父类的\n    }\n\n    public\
    \ void setName_s(String na1) { // 子类的方法\n        name = na1;\n    }\n}\n```\n\n"
