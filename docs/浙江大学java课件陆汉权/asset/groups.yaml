    # # 11.3 事件处理


    # ## 开发程序时的实现方法


    +   - 向事件源注册事件监听器

    +     - 调用事件源的addXXXListener()之类的方法。

    +     - 如：向按钮butt注册单击事件监听器，需要调用：

    +       butt.addActionListener(this);

    +     - 这样单击按钮时，事件监听器创建单击事件类ActionEvent对象


    +   - 实现事件处理方法

    +     - 其方法体即为事件发生时要执行的语句序列'
