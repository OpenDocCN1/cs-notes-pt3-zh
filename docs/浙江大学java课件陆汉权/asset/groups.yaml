    \n- **System.out**：标准输出设备（显示器）\n- **System.in**：标准输入设备（键盘）\n- **System.err**：标准错误设备（屏幕）\n\
    \nSystem是Java中一个功能非常强大的类：\n\n- **System.out**\n  - PrintStream类对象，输出字节数据流。\n-\
