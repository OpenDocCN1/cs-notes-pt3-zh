    # 位运算符（理解）


    | 运算符 | 用例 | 功能 |

    |---|---|---|

    | `~` | `~a` | 将 a 逐位取反 |

    | `&` | `a & b` | a、b 逐位进行“与”操作 |

    | `|` | `a | b` | a、b 逐位进行“或”操作 |

    | `^` | `a ^ b` | a、b 逐位进行“异或”操作 |

    | `<<` | `a<<b` | a 向左移动 b 位 |

    | `>>` | `a>>b` | a 向右移动 b 位 |

    | `>>>` | `a>>>b` | a 向右移动 b 位，移动后的空位用 0 填充 |'
