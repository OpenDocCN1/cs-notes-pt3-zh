    \n### Writer和Reader\n\n以字符流方式向文件写入或从文件中读取数据，可以使用 Writer 和 Reader 类及其子类。\n\nWriter\
    \ 和 Reader 类都是抽象类，不能建立它们的对象，所以只能通过它们的子类对象对文件进行操作。常用的 Writer 类的子类包括 FileWriter\
    \ 类和 BufferedWriter 类。\n\nFileWriter 类构造方法如下：\n\n- `FileWriter(String fileName)`：参数\
    \ `fileName` 表示带路径的磁盘文件名。\n- `FileWriter(File file)`：参数 `file` 表示为磁盘文件所建立的 `File`\
    \ 对象名。\n\n注：使用 `FileWriter` 进行文件操作时，为了减少磁盘读写次数，常常使用具有缓冲功能的 `BufferedWriter` 类。\n\
