    \ 22:22:00\nt3= 0:33:33\n\n## 对象的销毁\n\n- new运算符实例化对象\n  - 过程：系统为对象分配所需的存储空间\n\
    \  - 但内存空间有限，不能存放无限多的对象\n  - 为此，Java提供了资源回收机制，自动销毁无用对象，回收其所占用的存储空间\n- 如需主动释放对象，或在释放时执行特定操作，则在类中可以定义\
    \ finalize() 方法：\n\n```java\npublic void finalize()\n{\n    方法体;\n}\n```\n\n##\
