    [例14-1]通过继承Thread类实现多线程。启动两个线程执行。它们分别相隔m毫秒输出一个字母A或B（m分别为50和100）。共输出20个A和20个B。


    ```

    public class T1 extends Thread{ //继承Thread

    String s;

    int m,count=0;

    T1(String ss,int mm){ s=ss; m=mm; }

    public void run(){

    try{

    while(true){

    System.out.print(s);

    sleep(m); //sleep m毫秒

    count++;

    if(count>=20)break;

    }

    System.out.println("finished"+s+"!");

    }

