  - '[PAGE 14]


    # Java与C/C++


    +   - 跨平台

    +     - C/C++语言编译为机器码；机器直接执行

    +     - Java语言编译为字节码，通过JVM编译为机器码

    +   - 指针

    +     - C/C++语言有指针类型；Java语言没有指针类型

    +   - 继承

    +     - C++允许多继承；Java语言仅允许单继承

    +   - 速度

    +     - C/C++运行速度快；Java运行速度较慢'
