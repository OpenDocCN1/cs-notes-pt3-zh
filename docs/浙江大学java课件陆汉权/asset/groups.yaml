    张三\";\n        aa.department=\"经理室\";\n        aa.getInfo();\n    }\n}\n```\n\n\
    ## 7.2 多态性\n\n多态性指同一名字的方法可以有多种实现，即不同的方法体。在面向对象的程序中多态表现为，可以利用重载在同一类中定义多个同名的不同方法实现多态，也可以通过子类对父类方法的覆盖实现多态。\n\
    \n### 1 方法的重载\n\n重载是指在同一类中，多个方法具有相同的方法名，但采用不同的形式参数列表，包括形参的个数、类型或顺序不同。调用方法时，系统是通过方法名和参数列表确定所调用的具体方法。\n\
    \n#### 重载：形参个数、类型、顺序\n\n重载方法中的参数表必然不同，表现为\n\n- 参数个数不同，或\n- 参数类型不同，或\n- 参数顺序不同\n\
    \n**正确的重载方法头**\n\n```java\npublic double area(double r)\npublic double area(int\
    \ a, double b)\npublic double area(double a, int b)\n```\n\n**不是正确的重载方法：**\n\n\
    ```java\npublic int volume(int a, int b)\npublic void volume(int x, int y)\n```\n\
    \n#### Example\n\n例如，计算圆、三角形和长方形的面积\n\n可以定义具有以下方法头的3个重载方法：\n\n// 圆面积\n\npublic\
    \ double area(double r)\n\n// 计算三角形面积\n\npublic double area(double a, double b,\
    \ double c)\n\n// 计算长方形面积\n\npublic double area(double a, double b)\n\n#### Java重载实例\
    \ 7-4\n\n```java\nclass Distance_p {    // 类Distance_P\n\n    public double distance(double\
    \ x, double y){\n        return Math.sqrt(x*x+y*y);\n    }\n\n    public double\
    \ distance(double x, double y, double z) {\n        return Math.sqrt(x*x+y*y+z*z);\n\
    \    }\n}\n```\n\n### 2 方法的覆盖\n\n- **覆盖**\n  - 子类定义了父类中的同名方法\n  - 覆盖表现为父类与子类之间方法的多态性。\n\
    \n- **程序运行时**\n  - 根据调用方法的对象所属的类决定执行父类中的方法还是子类中的同名方法\n\n- **寻找执行方法的原则是**\n  -\
    \ 首先从对象所属类开始，寻找匹配的方法\n  - 如果当前类中没有匹配的方法，则依此在父类（祖先类）寻找匹配方法。\n\n#### 方法覆盖举例 7-5\n\
    \n```java\nclass CCircle {\nprotected double radius;\npublic CCircle(double r)\
    \ {\nradius=r;\n}\npublic void show() {\nSystem.out.println(\"Radius=\"+radius);\n\
    }\n}\npublic class CCoin extends CCircle {\nprivate int value;\npublic CCoin(double\
    \ r, int v) {\nsuper(r);\nvalue=v;\n}\n}\n```\n\n##### 例7-5\n\n```java\npublic\
    \ void show() {\n    System.out.println(\"Radius=\"+radius+\" Value=\"+value);\n\
    }\n\npublic static void main(String[] args) {// Test 覆盖\n    CCircle circle=new\
    \ CCircle(2.0);\n    CCoin coin=new CCoin(3.0,5);\n    circle.show(); // show\
    \ , which one?\n    coin.show();\n}\n}\n```\n\n程序运行结果如下：\n\nRadius=2.0\nRadius=3.0\
    \ Value=5\n\n## 7.3 final类和final成员\n\n- Java中， 有一个非常重要的关键字final  \n  - 定义符号常量\
    \  \n- Too:  \n  - 修饰类及类中的成员变量和成员方法  \n- 特点  \n  - 用final修饰的类不能被继承  \n  - 用final修饰的成员方法不能被覆盖\
    \  \n  - 用final修饰的成员变量不能被修改。\n"
