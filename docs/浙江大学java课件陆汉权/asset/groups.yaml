    \ C1\n```\n\n^\n\n1 错误\n\n## 2 final成员方法\n\n出于安全性考虑，有些方法不允许被覆盖，称为final方法。将方法声明为final方法，可以确保调用的是正确的、原始的方法，而不是在子类中重新定义的方法。\n\
    \n### 例 覆盖final方法。\n\n```java\nclass Mother\n{\n    int x=100,y=20;\n    public\
    \ final void sum()\n    {\n        int s;\n        s=x+y;\n        System.out.println(\"\
    s=\"+s);\n    }\n}\npublic class Children extends Mother\n{\n    int m=20,n=30;\n\
    \    public void sum()\n    {\n        int f;  f=m+n;\n        System.out.println(\"\
    f=\"+f);\n    }\n    public static void main(String args[])\n    {\n        Children\
    \ aa=new Children();\n        aa.sum();\n    }\n}\n```\n\n程序编译时的错误信息如下：\nChildren中的sum()\
    \ 不能覆盖Mother中的sum(); 被覆盖的方法是 final public void sum()\n^\n1 个错误\n\n## 3 final成员变量\n\
    \n如果一个变量被final修饰，则其值不能改变，成为一个常量。如果在程序中企图改变其值，将引起编译错误。如：\n`final int i=23;`\n在程序中不能再给i赋值，否则产生编译错误。\n\
    \n## 第八章 接口和包\n\n### Overview\n\n- Java 只有单继承——For security\n- 为实现多继承\n  - 接口\n\
    - 接口是什么？\n  - 一组常量\n  - 抽象方法\n- 包\n  - Java程序的组织形式\n  - 包括一组类、接口\n\n### 8.1 抽象类和方法\n\
    \n- 建立一个类，通过这个类创建实例——常规做法\n- 抽象类是供子类继承、却不能创建实例的类\n- 抽象类中\n  - 声明只有方法头、没有方法体的抽象方法\n\
    - 抽象类用于描述抽象的概念，其中的\n  - 抽象方法约定了多个子类共用的方法头\n  - 每个子类可以根据自身实际情况，给出抽象方法的具体实现\n\n\
    ### 抽象类的子类\n\n- Java中，任何一个类都可以定义子类\n- 抽象类的子类必须完成父类定义的每一个抽象方法，除非该子类也是抽象类。\n- 它的主要用途是用来描述概念性的内容，这样可以提高开发效率，更好地统一用户“接口”\n\
    \n### 声明抽象方法\n\n[权限修饰符] abstract 返回类型 方法名(参数表);\n\n例如，计算图形面积的抽象方法 area() 可采用如下的声明：\n\
    \n```java\npublic abstract double area();\n```\n\n### 声明抽象类\n\n```java\n[权限修饰符]\
    \ abstract class 类名{\n    成员变量;\n    abstract 方法名(); //定义抽象方法\n}\n```\n\n说明：抽象类中也可以定义非抽象方法\n\
    \n### Java实例 8.1——利用抽象类表示多类图书\n\n![](img/80da1d99a94a92757465da523b64f0ce_361_0.png)\n\
    \n图8-1 各类图书的属性和行为\n\n| 科技书类 | 文艺书类 | 教材类 |\n| --- | --- | --- |\n| 页码<br>折扣<br>价格\
    \ | 页码<br>折扣<br>价格 | 页码<br>折扣<br>价格 |\n| 显示图书种类<br>计算图书价格<br>计算折扣 | 显示图书种类<br>计算图书价格<br>计算折扣\
    \ | 显示图书种类<br>计算图书价格<br>计算折扣 |\n\n### 三类图书\n\n- 相同的行为——种类、价格、折扣\n- 不同的页码、价格和折扣\n\
    \n### 处理方法1\n\n- 为每一类图书编写一个处理程序（Java 类）\n- 代码大，重用性差\n\n| 科技书类 | 文艺书类 | 教材类 |\n\
    | --- | --- | --- |\n| 页码 折扣 价格 | 页码 折扣 价格 | 页码 折扣 价格 |\n| 显示图书种类 计算图书价格 计算折扣\
    \ | 显示图书种类 计算图书价格 计算折扣 | 显示图书种类 计算图书价格 计算折扣 |\n\n### 另一种方法\n\n- 定义一个父类：抽象类声明共同的变量、成员方法\n\
    - 分别为不同的图书类定义子类，在子类中完成不同的处理“方法”\n- 程序代码——重用\n\n### （1）定义抽象类(P106)\n\n```java\n\
    abstract class Book {\n    int bookPage;    //图书页码\n    float discount;  //图书折扣\n\
    \    double price;    //图书价格\n\n    public Book(int bookPage,float discount) {\
    \ // 非抽象方法： 图书公共行为\n        this.bookPage=bookPage;    // 页码\n        this.discount=discount;\
    \    // 折扣\n    }\n\n    //抽象方法\n    abstract void show_kind();    //显示图书种类\n\
    \    abstract double getPrice(int bookPage,float discount); //计算价格\n\n    public\
    \ void show_price() {    // 非抽象方法： 显示价格\n        System.out.println(\"This book's\
    \ price is \"+price);\n    }\n}\n```\n\n### （2）各子类：定义科技书类\n\n```java\nclass Science_book\
    \ extends Book {\n\n    public Science_book(int bookPage,float discount) {\n \
    \       super(bookPage,discount);    //引用父类的构造方法\n    }\n\n    public void show_kind()\
    \ {       //实现抽象方法\n        System.out.println(\"The book's kind is science\"\
    );\n    }\n\n    public double getPrice(int bookPage,float discount) { //实现抽象类方法\n\
    \        return bookPage*0.1*discount;\n    }\n}\n```\n\n### （2）各子类：定义文艺书类\n\n\
    ```java\nclass Literature_book extends Book {\n\n    public Literature_book(int\
    \ bookPage,float discount) {\n        super(bookPage,discount);\n    }\n\n   \
    \ public void show_kind() {\n        System.out.println(\"The book's kind is literature\"\
    );\n    }\n\n    public double getPrice(int bookPage,float discount) {\n     \
    \   return bookPage*0.08*discount;\n    }\n}\n```\n\n### （2）各子类：定义教材类\n\n```java\n\
    class Teaching_book extends Book {\n\n    public Teaching_book(int bookPage,float\
    \ discount) {\n        super(bookPage,discount);\n    }\n\n    public void show_kind()\
    \ {\n        System.out.println(\"The book's kind is teaching book\");\n    }\n\
    \n    public double getPrice(int bookPage,float discount) {\n        return bookPage*0.05*discount;\n\
    \    }\n}  // 其类的结构和代码与前面的几个子类相同\n```\n"
