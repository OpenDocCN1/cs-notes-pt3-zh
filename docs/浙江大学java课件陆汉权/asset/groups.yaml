  md: "\n### 【例4-1】：计算平方的方法\n\n类型修饰符 方法名 参数\n\n`static int square(int x)`\n\n方法体 `{\
    \ int s; s=x*x; return s; }`\n\n变量声明 语句 返回语句\n\n### 方法调用\n\n- 定义了方法后，要使用“方法”→\
    \ 方法调用（Call）\n- 调用格式：\n  - 方法名（[实际参数表]）\n  - 有返回值的“方法”可作为表达式或表达式的一部分来调用，其在表达式中出现，例如\
    \ `y=square(20)`；\n\n### 【例4-2】\n\n```java\npublic class SquareC{\n    static\
    \ int square(int x) {    // 计算平方的方法\n        int s;\n        s=x*x;\n        return\
    \ s;\n    }\n\n    public static void main(String[] args){\n        int n = 5;\n\
    \        int result = square(n);    // 调用“方法”\n        System.out.println(result);\n\
    \    }\n}\n```\n\n![](img/80da1d99a94a92757465da523b64f0ce_165_0.png)\n\n### 方法语句\n\
    \n- 方法语句——使用“方法”的语句——调用\n- 以独立语句的形式调用“方法”\n  - `方法名([实际参数表])`\n- “方法语句”\n  - “方法”没有返回值时的调用\n\
    \  - 方法前面的类型修饰符为 void\n- Demo：求面积的“方法”\n\n### 例【4-3】 以方法语句方式调用方法\n\n```java\n\
    class AreaC {\n    static void area(int a , int b) {\n        int s;\n       \
    \ s = a * b;\n        System.out.println(s); // 直接输出， 没有返回值\n    }\n    public\
    \ static void main(String[] args){\n        int x = 5, y=3;\n        area(x, y);\
    \ // 调用方法AreaC\n    }\n}\n```\n\n### 无参方法\n\n有些“方法”没有输入参数，例【4-4】：\n\n```java\n\
    class SumC {\n    static void sum() { // 无参、无返回值“方法”\n        int i=3, j=6;\n\
    \        int s = i + j;\n        System.out.println(s);\n    }\n    public static\
    \ void main(String[] args) {\n        sum(); // 调用无参数“方法”\n    }\n}\n```\n\n###\
    \ 4.3 参数传递——值传递\n\n参数传递规则\n\n- 调用带形参的“方法”时，必须提供实参\n- 实参 → 形参，称为参数传递\n- 被调用的“方法”用实参执行方法体\n\
    \n在Java中，只有值传递\n\n- 参数以值的方式进行传递，即调用时将实参的值传递给“方法”的形参\n\n问题：如果形参变了，实参变吗？\n\n###\
    \ 例【4-5】：交换两个变量的值“方法”\n\n```java\npublic class Chap45Swap {\n    static void swap(int\
    \ x, int y) { // 交换x、y的值的“方法”\n        System.out.println(\"交换前：x=\"+x+\" y=\"\
    +y);\n        int temp = x; x = y; y = temp; // 交换\n        System.out.println(\"\
    交换后：x=\"+x+\" y=\"+ y);\n    }\n    public static void main(String[] args) {\n\
    \        int a = 23, b = 10;\n        System.out.println(\"调用前：a=\"+a+\" b=\"\
    +b);\n        swap(a, b); // 调用“方法”\n        System.out.println(\"调用后：a=\"+a+\"\
    \ b=\"+b);\n    }\n}\n```\n\n### 值传递的例子\n\n- **【例4-5】运行的结果**\n  - 调用前：a=23 b=10\n\
    \  - 交换前：x=23 y=10\n  - 交换后：x=10 y=23\n  - 调用后：a=23 b=10\n- **说明**\n  - 参数传递：a\
    \ → x; b → y\n  - 调用前后：a、b的值没有变\n  - 交换前后：x、y的值改变了\n\n```java\nstatic void swap(int\
    \ x, int y) {\n    int temp = x; x = y; y = temp; // 交换\n}\npublic static void\
    \ main(String[] args) {\n    int a = 23, b = 10;\n    swap(a, b); // 调用“方法”\n\
    }\n```\n\n### 4.4 递归(recursion)\n\n- 递归：用自身的结构来描述自身，典型的例子是阶乘运算。\n- 简而言之：递归就是自己调用自己。\n\
    \n### 【例4-6】递归算法求n!\n\n**n!的算法**\n\nn! = n×(n-1)!\n(n-1)! = (n-1)×(n-2)!\n(n-2)!\
    \ = (n-2)×(n-3)!\n……\n2! = 2×1!\n1! = 1\n\n**递归定义**：F=n!，设计算阶乘的“方法”为fac(n)\n\n\
    fac(n) = n * fac(n-1)\n当n=1，n=0时，fac(n)=1\n\n### And More\n\n计算阶乘，也可以使用循环结构的“方法”\n\
    \n```java\nstatic long fac(int n) {\n    long m=1;\n    for (int i=1; i<=n; i++)\n\
    \        m = m*i;\n    return m;\n}\n```\n\n### Compare:\n\n```c\nstatic long\
    \ fac( int n){\n    if (n == 1)\n        return 1;\n    else\n        return n*fac(n-1);\n\
    }\n```\n\n```c\nstatic long fac(int n) {\n    long m=1,i;\n    for (i=1; i<=n;\
    \ i++)\n        m = m*i;\n    return m;\n}\n```\n\n### 递归程序设计的规范\n\n- 计算递归公式\n\
