    \   0 1 2 4 5 6 7\n\n### 排序过程结束\n\n可见：\n\n- 对n个待排序的数，要进行n-1轮的选择和交换过程\n- 其中第 i\
    \ 轮的选择和交换过程中，要进行n-i次的比较\n- n个数的排序需要多少次排序操作？\n\n### 例一-排序\n\n```java\nimport java.io.*;\n\
