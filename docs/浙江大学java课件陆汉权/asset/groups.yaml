    \    }\n}\n```\n\n### 创建对象和使用对象调用\n\n```java\npublic static void main(String args[])\n\
    {\n    double x,y;\n    Circle1 cir=new Circle1(); //创建Circle1类的对象cir\n    cir.setR(12.35f);\
