    );\n    // 使用类成员变量 Student1.count, p1.count\n    System.out.println(p1.name+\"\
    \ \"+p1.address+\" \"+p1.count);\n    Student1.count=Student1.count+1; // count\
    \ 为3\n    System.out.println(p2.name+\" \"+p2.address+\" \"+p2.count);\n    p1.count=p1.count-1;\
    \ // count为2\n    System.out.println(p2.name+\" \"+p2.address+\" \"+p2.count);\n\
    }\n} // 类结束\n```\n\n程序运行结果如下：\n\n- 李明 杭州市西湖区 2\n- 张敏 上海市闵行区 3\n- 张敏 上海市闵行区 2\n\
    \n### 类成员方法\n\n- 没有使用static修饰的方法为实例成员方法\n- 使用static修饰的方法为类成员方法\n\n```java\n//\
    \ area 是类成员方法\npublic static double area(double r) {\n    return 3.14*r*r;\n}\n\
    ```\n\n- 类成员方法中使用——受限制\n  - 本方法中声明的局部变量\n  - 可以访问类成员变量，不能访问实例成员变量\n- 实例成员方法中使用——不受限制\n\
    \  - 本方法中声明的局部变量\n  - 可访问类成员变量\n  - 也可以访问实例成员变量\n\n◆ 类成员方法中只能调用类成员方法，不能调用实例成员方法\n\
    \n◆ 实例成员方法既可以调用类成员方法，也可以调用实例成员方法。\n\n```java\ndouble perimeter(double x, double\
    \ y) { // 实例成员方法\n    return 2*(x+y);\n}\nstatic double area(double x, double\
    \ y) { // 类成员方法\n    return x*y;\n}\nvoid print_message() { // 实例成员方法，可使用类的其他成员方法\n\
    \    System.out.println(perimeter(2.1,3.5));\n    System.out.println(area(2.1,3.5));\n\
    }\n```\n\n- 实例方法只能通过对象访问\n- 类成员方法既可以通过类名访问，也可以通过对象名访问\n\n实例成员方法的访问方式为：\n\n`对象名.实例成员方法名()`\n\
    \n类成员变量的访问方法为\n\n对象名.类成员方法名()\n\n或\n\n类名.类成员方法名()\n\n### 例：类成员方法和实例成员方法的对比\n\n\
    ```java\nclass Course {\n    String no;          //实例成员变量：课程编号\n    int score;\
    \          //实例成员变量：成绩\n    static int sum=0;   //类成员变量：总成绩\n\n    public Course(String\
    \ n, int s) { // Course的构造方法\n        no=n;\n        score=s;\n    }\n\n    //类方法：统计总成绩\n\
    \    public static void summarize(int s) { // Course的类成员方法\n        sum+=s;\n\
    \    }\n}// 类 Course结束\n```\n\n```java\npublic class Statistic {\n\n    public\
    \ static void main(String args[]) {\n        Course c1,c2;  // 定义Course对象c1、c2\n\
    \        c1=new Course(\"210\",90);  // 学号210，成绩90\n        Course.summarize(90);\n\
    \        System.out.println(\"sum=\"+c1.sum);\n        c2=new Course(\"300\",80);\
    \  // 学号300，成绩80\n        c2.summarize(80);\n        System.out.println(\"sum=\"\
    +Course.sum); // 输出累加和\n    }\n} // 类Statistic结束\n```\n\n程序运行结果如下：\n\nsum=90\n\
    \nsum=170\n\n## 数学函数类—— Math类库\n\nJava类库中的Math类提供了很多常用数学函数的实现方法，这些方法都是static方法，通过类名Math调用，其调用方式如下：\n\
    \nMath.方法名\n\n### Math类中的常用方法\n\n| 函数 | 说明 |\n| --- | --- |\n| sin(double x) |\
    \ 返回x的正弦值 |\n| cos(double x) | 返回x的余弦值 |\n| log(double x) | 返回x的自然对数 |\n| exp(double\
    \ x) | 返回e^x |\n| abs(double x) | 返回x的绝对值 |\n| max(double x, double y) | 返回x和y中的较大值\
    \ |\n| sqrt(double x) | 返回x的平方根 |\n| random(double x) | 返回[0, 1)区间内的随机数 |\n| pow(double\
    \ y, double x) | 返回y^x |\n\n### 例6-10 输出两个数中较大者\n\n```java\npublic class Max {\n\
    \n    public static void main(String args[]) {\n\n        int x,y;\n        x=Integer.parseInt(args[0]);\n\
    \        y= Integer.parseInt(args[1]);\n        System.out.println(\"最大值是\"+Math.max(x,y));\n\
    \    }\n}\n```\n\n"
