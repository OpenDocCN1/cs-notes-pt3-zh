    \ n−1 个数，重复步骤1，将次小（大）的数置于第2个位置  \n  ③ 对于剩下的 n−2，n−3，…，n−n+2 个数用同样的方法，分别将第3个最小（大）数置于第3个位置，第4个最小（大）数置于第4个位置\
    \  \n  ④ ……，第 n−1 个最小（大）数置于第 n−1 个位置\n\n### For Example\n\n假定有 7，4，0，6，2，5，1 的排序：\n\
    \n1. 7个数中，最小数是0，与第1个数7交换位置，结果为：\n   0 4 7 6 2 5 1\n\n2. 余下的6个数最小数是1，与第2个数4交换，结果为：\n\
