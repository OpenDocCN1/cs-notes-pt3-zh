    \n## 字符串赋值\n\n可以为字符串变量赋一个字符串常量，也可以将一个字符串变量或表达式的值赋给字符串变量。\n\n```java\ns=\"Chinese\
    \ people\";\ns2=s1;\ns3=\"a lot of\"+s2;\n```\n\n结果s2的值为 “Chinese people” ， s3的值为\
    \ “a lot of Chinese people” 。其中运算符 “+” 的作用是将前后的两个字符串连接起来\n\n## 字符串的输出\n\n字符串可以通过println()或print()语句输出。\n\
    \n例如，以下的语句序列为字符串变量s赋值并输出其值：\n\n```java\ns=\"All the world\";\nSystem.out.println(s);\n\
    ```\n\n输出结果为：\n\n```\nAll the world\n```\n\n## 例一字符串应用\n\n```java\npublic class\
    \ StringUse\n{\n    public static void main(String[] args)\n    {String s1, s2;\n\
    \        s1=new String(\"Students should \");\n        s2=new String();\n    \
    \    s2=\"study hard.\";\n        System.out.print(s1);\n        System.out.println(s2);\n\
    \        s2=\"learn english, too\";\n        System.out.print(s1);\n        System.out.println(s2);\n\
    \        s2=s1+s2;\n        System.out.println(s2);}}\n```\n\n该程序的运行结果如下：\n\n\
    Students should study hard.\n\nStudents should learn english, too\n\nStudents\
    \ should learn english, too\n\n## 字符串操作\n\nJava中通过String类来使用字符串\nString类用很多成员方法来对字符串进行操作。如：\
    \ 字符串访问、比较和转换等。\n\n- length(): 返回字符串的长度。\n- charAt(int index): 返回字符串中第index个字符\
    \ 。\n- indexOf(int ch): 返回字符串中字符ch第1次出现的位置。\n- indexOf(String str, int index):\
    \ 返回值是在该字符串中，从第index个位置开始，子字符串str第1次出现的位置。\n- subString (int index1, int index2):\
    \ 返回值是在该字符串中，从第index1个位置开始，到第index2-1个位置结束的子字符串。\n\n将int，long，float，double，boolean等基本类型数据转换为String类型的方法是：\n\
    \n```java\nString.valueOf(基本类型数据)\n```\n\n将字符串型数据转换为其他基本类型的方法及实例\n\n| 方法 | 返回值类型\
    \ | 返回值 |\n|---|---|---|\n| Boolean.getBoolean(\"false\") | boolean | false |\n\
    | Integer.parseInt(\"123\") | int | 123 |\n| Long.parseLong(\"375\") | long |\
    \ 375 |\n| Float.parseFloat(\"345.23\") | float | 345.23 |\n| Double.parseDouble(\"\
    67892.34\") | double | 67892.34 |\n\n- 字符串数组——多个字符串组成\n  要表示一组字符串可以用字符串数组来实现。\n\
    \n```java\nString str=new String[4];\n\nstr[0]=\"Chinese\";\nstr[1]=\"English\"\
    ;\nstr[2]=\"Tianjin\";\nstr[3]=\"Chongqing\";\n```\n\n有什么特点？\n\n# 第六章\n\n# 类和对象\n\
    \nClass and Object\n\n## 6.1 类和对象概述\n\n- 面向对象的基本概念：\n  - 面向对象技术中，将客观世界中的一个事物作为一个对象看待。每个事物都有自己的属性和行为\n\
    \  - 从程序设计的角度，事物的属性可以用变量描述，行为用方法描述。\n    - 类：定义属性和行为的模板\n    - 对象是类的实例，对象与类的关系就像变量和数据类型的关系一样\n\
    \n## 对象与类\n\n简单地说：\n对象是表示现实世界中某个具体的事物；\n类是对对象的抽象描述。\n\n张二\n\n将对象抽象为类\n\n对类进行实例化\n\
    \n类(CLASS)，如：\n“Man class”\n\n## Java的类\n\n- 面向对象的程序设计认为：程序由对象组成。\n- 程序中的每个对象有自己的属性和能够执行的操作\n\
    - 只关心对象能够完成的操作，不必关注实现功能的过程\n  - For Example： 用户买车\n\n## Java的类\n\n- Java的所有程序代码都属于某个类的内部\n\
    - Java的类分为两个部分\n  - Java类库——由Java提供的大量的、可供用户调用的各种类的各种方法（我们可以使用的）\n  - 用户编写的类（**我们需要学习的**）\n\
    \n# Java的类\n\nJava类库——我们已经使用过的……\n\n- String\n- Math\n- JOptionPane\n- Scanner\n\
    \n## Java类库\n\n### Math——数学类库\n\n- 为用户处理数学问题提供方法（函数）\n- 例如：\n  - `Math.PI`\n \
    \ - `Math.sin(double a)`\n  - `Math.sqrt(double a)`\n  - `Math.abs(int/long/float/double\
    \ a)`\n  - ……\n\n- 在Math库中，有程序处理需要的各种数学（方法）函数\n\n## 自定义类——用户编写程序\n\n- 用户程序从类开始\n\
    - 一个用户程序可以有多个类\n- 其中有且只有一个类中，有类的main()方法\n- 每一个类可以有多个方法\n- 不同的类之间的方法可以互相调用，除了main()方法\n\
    \n## 类的声明\n\n```\n[修饰符] class 类名 [extends 父类名] [implements 接口名列表]\n{\n    类的成员变量声明;\n\
    \    类的方法声明;\n}\n```\n\n这里，[]中的可以省略  \n因此，一般的类声明格式为：\n\n```\n[修饰符] class 类名\n\
    ```\n\n## 例6-1 定义一个二维平面上点的类\n\n```java\nclass Point {\nprivate int x,y;\npublic\
    \ void setPoint(int a,int b) {\nx=a;\ny=b;\n}\npublic int getX() {\nreturn x;\n\
    }\npublic int getY() {\nreturn y;\n}\npublic String toString() {\nreturn \"[\"\
    +x+\",\"+y+\"]\";\n}\n}\n```\n\n类名：Point\n\n类变量成员：x，y\n\n类的方法（1）：setPoint\n\n\
    类的方法（2）：getX取X坐标\n\n类的方法（3）：getY 取Y坐标\n\n类的方法（4）：toString 获取变量的字符串\n\n"
