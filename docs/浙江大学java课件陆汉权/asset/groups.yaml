    \n- static 是规则......\n\n1. 类成员变量\n2. 类成员方法\n\n### 类成员变量\n\n使用类创建对象：\n每个对象拥有各自的实例成员变量，不同对象的实例成员变量具有不同的值；\n\
    类成员变量被分配一个存储单元，类的所有对象共享这个类成员变量\n\n实例成员变量属于对象，只能通过对象引用：\n对象名.实例成员变量名\n\n类成员变量属于类——既可以通过类名访问，也可以通过对象名访问：\n\
    对象名.实例成员变量名\nor\n类名.实例成员变量名\n\n### 例：类成员变量和实例成员变量的对比\n\n```java\nclass Student1\
    \ {\n    String name;    //实例成员变量\n    String address; //实例成员变量\n    static int\
    \ count=0; //类成员变量\n    public Student1(String m, String a ) {\n        name=m;\n\
    \        address=a;\n        count=count+1; // count 为 2\n    }\n}\n```\n\n```java\n\
    public static void main(String args[]) {\n    // 使用实例成员变量\n    Student1 p1=new\
