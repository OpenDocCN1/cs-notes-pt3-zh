    \ 构造方法和对象的初始化\n\n- 在类（Class）中，可以定义多种成员方法\n- 类中还有一种特殊的成员方法，其方法名与类名相同，称为构造方法。\n\
    - 当使用 new 运算符实例化（定义）一个对象时，Java 做两件事：\n  1. 系统为对象创建内存区域\n  2. 自动调用构造方法初始化成员变量。\n\
    \n### 构造方法的特点\n\n- 构造方法名与类名相同；\n- 构造方法没有返回值；\n- 构造方法的主要作用是对对象初始化。\n- 构造方法不能显式地直接调用；\n\
    - 一个类中可以定义多个构造方法\n  - 用不同的参数区别不同的构造方法\n  - 或不同参数类型区别不同的构造方法\n\n### Java实例6-3——用构造方法初始化成员变量\n\
    \n```java\nclass Triangle {\n    int x,y,z;\n    public Triangle(int i,int j,int\
    \ k) { //声明构造方法，方法名和类名相同\n        x=i; y=j; z=k;                 //简单地将变量关联，i→x,\
    \ j→y, k→z\n    }\n    public static boolean judge(Triangle m) { //判断是否为直角三角形\n\
    \        //引用Math类库的sqrt()方法\n        if ( Math.sqrt(m.x*m.x+ m.y*m.y)== Math.sqrt(m.z*m.z))\n\
