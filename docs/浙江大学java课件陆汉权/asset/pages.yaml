    据古印度神话，在贝拿勒斯的圣庙里安放着一块铜板，板上有3根宝石针。梵天（印度教的主神）在创造世界的时候，在其中的一根针上摆放了由小到大共64片中间有空的金片。无论白天和黑夜，都有一位僧侣负责移动这些金片。移动金片的规则是：一次只能将一个金片移动到另一根针上，并且在任何时候以及任意一根针上，小片只能在大片的上面。当64个金片全部由最初的那根针上移动到另一根针上时，这世界就在一声霹雳中消失。


