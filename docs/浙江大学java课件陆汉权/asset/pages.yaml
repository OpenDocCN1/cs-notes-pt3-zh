    | `+  -` | 加，减 | 4 | 从左至右 |

    | `<<  >>  >>>` | 位运算 | 5 | 从左至右 |

    | `<  <=  >  >=` | 逻辑运算 | 6 | 从左至右 |

    | `==  !=` | 逻辑运算 | 7 | 从左至右 |

    | `&` | 按位与 | 8 | 从左至右 |

    | `^` | 按位异或 | 9 | 从左至右 |'
