    # ## 说明


    +   - 一个类可以实现多个接口，各个接口之间用逗号分开

    +   - 该类必须要实现接口中所有的抽象方法，即使本类中不使用的抽象方法也要实现

    +   - 对不使用的抽象方法

    +     - 空方法：方法中没有语句，实现不需要返回值的方法

    +     - 返回默认值：在方法中使用默认值返回，如0

