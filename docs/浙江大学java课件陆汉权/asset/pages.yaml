- pgno: 462
  md: '# # 1 建立File对象


    File类提供了3个不同的构造方法：


    +   ◆ File(String path)

    +   String类参数path指定所建对象对应的磁盘文件名或目录名及其路径名。


    +   ◆ File(String path, String name)

    +   此构造方法中的参数path表示文件或目录的路径，参数name表示文件或目录名。


    +   ◆ File(File dir, String name)

    +   此构造方法中的参数dir表示一个磁盘目录对应的File对象，参数name表示文件名或目录名。'
