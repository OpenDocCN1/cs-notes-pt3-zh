- pgno: 10
  md: '# # 什么是“面向过程”


    # ## How to do something?


    +   - 分解问题——步骤

    +   - 设计每一步骤的实现

    +   - 依次执行这些步骤

    +   - 得到结果/得到错误


    # ## 特点


    +   - 从用户的角度，这些步骤是“按部就班”

    +   - 从设计的角度，考虑每一步骤的细节'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # 什么是“面向对象”


    +   ### How to do something?

    +   - 分解问题为“对象”

    +   - 设计每个对象的“属性”和“行为”

    +   - 建立对象之间的联系

    +   - 执行，得到结果/错误


    +   ### 特点

    +   - 以功能划分——没有按部就班问题

    +   - 以设计角度——接近人的思维方式'
  merge: -1
  img_proc: true
