  md: "# # 【例4-6】递归算法求n!\n\n## n!的算法\nn! = n×(n-1)!  \n(n-1)! = (n-1)×(n-2)!  \n(n-2)!\
    \ = (n-2)×(n-3)!  \n……  \n2! = 2×1!  \n1! = 1;\n\n## 递归定义 F=n! ，设计算阶乘的“方法”为fac(n)\n\
    fac(n) = n * fac(n-1)  \n当n=1, n=0时，fac(n)=1"
