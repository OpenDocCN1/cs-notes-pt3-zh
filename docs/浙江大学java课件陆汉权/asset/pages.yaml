- pgno: 405
  md: '类中成员的访问权限有4种,具体规定如下：


    +   - 类中的public权限成员，能够被所有包中的类访问，与所在的包无关。

    +   - 类中的private权限成员，只能被本类访问，在类外不能访问。

    +   - 类中的缺省权限成员，能够被所在包中的所有类访问，不能在其包外访问。

    +   - 类中的protected权限成员，能够被所在包中的所有类访问，也能够被其它包中的子类访问。'
