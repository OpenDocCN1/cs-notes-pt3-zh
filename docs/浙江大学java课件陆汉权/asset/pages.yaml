  md: '# # 类的继承原则


    # ## Rules:


    +   1. 子类继承父类的成员变量

    +      - 实例成员变量

    +      - 类成员变量


    +   2. 子类继承父类成员方法

    +      - 实例成员方法

    +      - 类成员方法

    +      - 但不包括构造方法

    +      - 父类的构造方法 → 创建父类对象

    +      - 子类需定义自己的构造方法 → 创建子类的对象


    +   3. 子类可以重新定义父类成员'
