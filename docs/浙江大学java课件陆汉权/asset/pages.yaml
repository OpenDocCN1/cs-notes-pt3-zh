  md: '# ## 2 方法的覆盖


    +   ### 覆盖

    +   - 子类定义了父类中的同名方法

    +   - 覆盖表现为父类与子类之间方法的多态性。


    +   ### 程序运行时

    +   - 根据调用方法的对象所属的类决定执行父类中的方法还是子类中的同名方法


    +   ### 寻找执行方法的原则是

    +   - 首先从对象所属类开始，寻找匹配的方法

    +   - 如果当前类中没有匹配的方法，则依此在父类（祖先类）寻找匹配方法。'
