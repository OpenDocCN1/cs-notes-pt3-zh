  md: '# ## 8.2 接口


    +   - 接口(interface)可以被用来实现类间多继承结构

    +   - 接口内部只能定义 public 的抽象方法和静态的、公有常量。所有的方法需要在实现接口的类中实现

    +   - 接口提供了方法声明与实现相分离的机制

    +     - 实现接口的多个类表现出相同的行为模式

    +     - 每个实现接口的类可以根据各自要求，给出抽象方法的具体实现'
