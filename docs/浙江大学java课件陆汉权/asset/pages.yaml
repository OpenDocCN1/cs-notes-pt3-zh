- pgno: 35
  md: "# # Java 标识符\n\n+   标识符是用来标识变量、常量、方法、类、对象等元素的有效字符序列。\n\n+   Java 的标识符由字母、数字、_和$组成，长度不限，但实际命名不宜过长。\n\
    \n+   标识符的第一个字符必须为字母、 `“_”` 或 `“$”` 。标识符区分大小写。\n\n合法的标识符：name, s_no, $2, boy_number\
    \  \n非法的标识符：2y, a*b, w/"
  merge: -1
  img_proc: true
- pgno: 36
  md: "# # 标识符规则\n\n+   “见名知义”，规范大小写的使用方式\n+   \n+   1. 大多数为小写字母开头\n+      - 变量名、对象名、方法名、包名\n\
    +      - 标识符由多个单词构成，则首字母小写，其后单词的首字母大写，其余字母小写。如getAge。\n+   \n+   2. 类名首字母大写\n\
    +   \n+   3. 常量名全部字母大写\n+   \n+   规则：非强制性"
  merge: -1
  img_proc: true
