- pgno: 41
  md: '# # Java 整型


    +   - 一个整数的缺省类型为int

    +     - 表示整数为long型，在其后加L或l，

    +     - 如345L

    +   - Java提供了3种进制的整数表示：

    +     - 十进制数。0~9表示的数，首位不能为0

    +     - 八进制数。0~7表示的数，以0为前缀

    +     - 十六进制数。0~9，a~f或A~F之间的字母表示的数，以0x或0X为前缀'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 浮点数


    +   - 浮点数类型有2种表示形式：

    +     - 标准记数法

    +       - 由整数部分、小数点和小数部分组成

    +       - 如12.37

    +     - 科学记数法：由尾数、E或e及阶码组成

    +       - 也称为指数形式

    +       - 如2.5E4表示2.5×10⁴

    +     - 2种浮点数类型

    +       - float　单精度浮点数

    +       - double 双精度浮点数'
