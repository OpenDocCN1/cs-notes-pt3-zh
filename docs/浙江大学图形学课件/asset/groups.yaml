  md: "\n\n## OpenGL Perspective\n\ngluPerspective(fovy, aspect, near, far);\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_372_0.png)\n\
    \nfov is the angle between the top and bottom planes\n\n## A More Intuitive Approach\n\
    Offered by glu:\n\n```\ngluLookAt(eyex, eyey, eyez, atx, aty,\n          atz,\n\
    \              upx, upy, upz);\n```\n\n`eyex, eyey, eyez` **specify the position\
    \ of the eye point and are mapped to the origin.**\n\n`atx, aty, atz` **specify\
    \ a point being looked at, which will be rendered in center of view port. It is\
    \ mapped to the -z axis.**\n\n`upx, upy, upz` **specify components of the camera\
    \ up vector.**\n\n## gluLookAt\n\n```\n{\nfloat forward[3], side[3], up[3];\n\
    GLfloat m[4][4];\n\nforward[0] = centerx - eyex;\nforward[1] = centery - eyey;\n\
    forward[2] = centerz - eyez;\n\nup[0] = upx;\nup[1] = upy;\nup[2] = upz;\n\nnormalize(forward);\n\
    \n/* Side = forward x up */\ncross(forward, up, side);\nnormalize(side);\n\n/*\
    \ Recompute up as: up = side x forward */\n/* */\ncross(side, forward, up);\n\n\
    __gluMakeIdentityf(&m[0][0]);\nm[0][0] = side[0];\nm[1][0] = side[1];\nm[2][0]\
    \ = side[2];\n\nm[0][1] = up[0];\nm[1][1] = up[1];\nm[2][1] = up[2];\n\nm[0][2]\
    \ = -forward[0];\nm[1][2] = -forward[1];\nm[2][2] = -forward[2];\n\nglMultMatrixf(&m[0][0]);\n\
    glTranslated(-eyex, -eyey, -eyez);\n}\n```\n\n## Ex3\n\n- Switch between orthographic\
    \ and perspective camera\n- Moving the camera with arrow keys\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_376_0.png)\n\
