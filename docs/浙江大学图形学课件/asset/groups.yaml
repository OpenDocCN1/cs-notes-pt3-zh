- raw:
  - '[PAGE 389]


    # # Raster Scan


    +   1. Let the electron beam constantly loop through individual pixels (one at
    a time)


    +   2. The electron gun will either light up a pixel or leave it dark when it
    passes by


    +   3. The electron gun has to move very fast


    +   4. Why?


    This is because it takes only a small finite amount of time before a phosphor
    dot goes back to dark.'
  - '[PAGE 390]


    <!-- no content -->'
  - '[PAGE 391]


    # # Scanning Process


    The beam is turned off both during the horizontal and the vertical retrace.


    The bandwidth of a monitor is the rate at which the beam can be turned on/off.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_391_0.png)


    1000 x 1000 x 60 frames/sec would require 16 ns for drawing a pixel. Add retrace
    time and we get more like 11 ns. Or 22 ns. for the on-off cycle. This works out
    to be 45 MHz. 100 MHz monitors are not uncommon.'
  - '[PAGE 392]


    # # Non-Interlace vs. Interlace


    +   - Non-Interlace: Scan every scan line

    +   - Interlace: Scan only every other scan line

    +     (even -> odd -> even -> odd ...)

    +   - so the refresh rate becomes twice as fast


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_392_0.png)'
  - '[PAGE 393]


    # Raster Scan Control


    +   - Scan Controller (video adaptor/controller) and frame buffer


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_393_0.png)'
  - '[PAGE 394]


    # # Frame Buffer


    +   - Frame buffer: the memory to hold the pixel intensity values

    +   - Properties of a frame buffer that affect the graphics performance:

    +     - Size: screen resolution

    +     - Depth: color level

    +       - 1 bit/pixel: black and white

    +       - 8 bits/pixel: 256 levels of gray

    +       - 24 bits/pixel: 16 million colors

    +     - Speed: refresh speed'
  - '[PAGE 395]


    # Color is expensive …


    +   - At least used to be

    +   - The more color you want, the more bits you will need for each pixel

    +   - Exercise: 1024 x 1280 screen with 24 bits per pixel, how large is the frame
    buffer?


    1024 x 1280 x 24 / 8 = 4M Byte'
  - '[PAGE 396]


    # Color Lookup Table


    +   - Say I am a poor man … I only have 3 bits per pixel

    +   - But I insist on high quality …

    +   - Use Color Look Up Table (CLUT)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_396_0.png)


    3 bits/pixel frame buffer


    |   | R | G | B |

    |---|---|---|---|

    | 0 |   |   |   |

    | 1 |   |   |   |

    | 2 |   |   |   |

    | 3 |   |   |   |

    | 4 |   |   |   |

    | 5 |   |   |   |

    | 6 |   |   |   |

    | 7 |   |   |   |


    24 bit wide


    You can still have 24 bits in each of the color table entries'
  - '[PAGE 397]


    # Colour Look-up Table


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_397_0.png)


    8 bits per colour (RGB), 24 bits per pixel. Most pictures do not require all 16M
    colours. Optimised using a colour look-up table (CLUT). 8 bit frame buffer; 12
    bit screen display


    A pixel with value 67 is displayed with R = 9/15, G = 10/15 and B = 1/15 of their
    maximum intensities.'
  - '[PAGE 398]


    # Display types


    +   - 1 bit per pixel: Monochrome display.

    +   - 8 bits per pixel with no CLUT: 256 colour display

    +   - 8 bits per pixel with 24 bit CLUT: Pseudo colour display.

    +   - 24 bits per pixel: TRUE colour display.


    Even with 24 pixels, many display systems support CLUTS for each of the colours.
    This enables a number of Image Processing type of algorithms to be executed fast
    and also implemented very simply.'
  - '[PAGE 399]


