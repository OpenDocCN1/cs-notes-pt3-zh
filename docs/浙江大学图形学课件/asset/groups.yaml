  - '[PAGE 337]


    # Deriving 2D Viewing

    Transformation


    $$\frac{v_x-vx_L}{vx_R-vx_L}=\frac{w_x-wx_L}{wx_R-wx_L}$$

    $$\frac{v_y-vy_B}{vy_T-vy_B}=\frac{w_y-wy_B}{wy_T-wy_B}$$


    $$v_x=\frac{vx_R-vx_L}{wx_R-wx_L}\cdot(wx-wx_L)+vx_L$$

    $$v_y=\frac{vy_T-vy_B}{wy_T-wy_B}\cdot(wy-wy_B)+vy_B$$'
