  md: '

    ## Implicit Curves


    **Advantages of implicit curves:** To a point \((x,y)\), it is easy to detect
    whether \(f(x,y)\) is \(>0\), \(<0\), or \(=0\).


    **Disadvantages of implicit curves:** For a curve \(f(x,y)=0\), it is difficult
    to find the point on it.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_776_0.png)


    ### Display of Implicit Curves — Chain Coding


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_777_0.png)


    ### Display of Implicit Curves — Subdivision


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_778_0.png)


    ## Parametric Curves


    - The variable is a scalar, and the function is a vector: \(\mathbf{C}=\mathbf{C}(u)=[x(u),
    y(u), z(u)]\). Every element of the vector is a function of the variable (the
    parameter).


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_779_0.png)


    Given a curve \(\mathbf{C}(u)\), its tangent is \(\mathbf{T}=\mathbf{C}''(u)\).


    Difference of arc length:

    \((ds)^2=(dx)^2+(dy)^2+(dz)^2=\left((x'')^2+(y'')^2+(z'')^2\right)du^2\)


    - Arc length:

    \(s=\int_{u_0}^{u}ds=\int_{u_0}^{u}\sqrt{(x'')^2+(y'')^2+(z'')^2}\,du\)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_780_0.png)


    ## Bézier Curve


    Bézier Curve.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_781_0.png)

    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_781_1.png)

    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_781_2.png)


    \(C(t)=\sum_{i=0}^{n}P_iB_{i,n}(t), \quad t\in[0,1]\)


    where \(P_i\,(i=0,1,\dots,n)\) are control points.


    \(B_{i,n}(t)=C_n^i t^i(1-t)^{n-i},\ t\in[0,1]\) is the Bernstein basis.


    \[

    \begin{cases}

    X(t)=\sum_{i=0}^{n}x_i B_{i,n}(t)\\

    Y(t)=\sum_{i=0}^{n}y_i B_{i,n}(t)

    \end{cases}

    \]


    or, in the power basis:


    \[

    \begin{cases}

    X(t)=\sum_{i=0}^{n}a_i t^i\\

    Y(t)=\sum_{i=0}^{n}b_i t^i

    \end{cases}

    \]


    \[

    C(t)=\begin{pmatrix}X(t)\\Y(t)\end{pmatrix}, \quad P_i=\begin{pmatrix}x_i\\y_i\end{pmatrix}

    \]


    \[

    C(t)=\sum_{i=0}^{n}P_i B_{i,n}(t), \quad t\in[0,1]

    \]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_782_0.png)

    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_783_0.png)

    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_784_0.png)


    ### Properties of the Bernstein Basis \(B_{i,n}(t)=C_n^i t^i(1-t)^{n-i},\ t\in[0,1]\)


    1. \(B_{i,n}(t)\ge0,\ i=0,1,\cdots,n,\ t\in[0,1]\).

    2. \(\sum_{i=0}^{n}B_{i,n}(t)=1,\ t\in[0,1]\).

    3. \(B_{i,n}(t)=B_{n-i,n}(1-t),\ i=0,1,\cdots,n,\ t\in[0,1]\).

    4. \(B_{i,n}(0)=\begin{cases}1, & i=0,\\ 0, & \text{else};\end{cases}\quad B_{i,n}(1)=\begin{cases}1,
    & i=n,\\ 0, & \text{else}.\end{cases}\)


    \(C(t)=\sum_{i=0}^{n}P_iB_{i,n}(t),\quad t\in[0,1]\)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_785_0.png)


    5. \(B_{i,n}(t)=(1-t)B_{i,n-1}(t)+tB_{i-1,n-1}(t),\ i=0,1,\dots,n\).

    6. \(B_{i,n}''(t)=n\left[B_{i-1,n-1}(t)-B_{i,n-1}(t)\right],\ i=0,1,\dots,n\).

    7. \((1-t)B_{i,n}(t)=\left(1-\frac{i}{n+1}\right)B_{i,n+1}(t);\quad tB_{i,n}(t)=\frac{i+1}{n+1}B_{i+1,n+1}(t);\quad
    B_{i,n}(t)=\left(1-\frac{i}{n+1}\right)B_{i,n+1}(t)+\frac{i+1}{n+1}B_{i+1,n+1}(t)\).


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_786_0.png)

