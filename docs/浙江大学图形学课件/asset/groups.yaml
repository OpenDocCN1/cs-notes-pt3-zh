  - '[PAGE 171]


    # Equation of a Line


    +   - Equation of a line is **y - m.x + c = 0**

    +   - For a line segment joining points **P(x1,y2)** and **P(x2,y2)**


    *slope* \(m = \frac{y2-y1}{x2-x1} = \frac{\Delta y}{\Delta x}\)


    +   - Slope **m** means that for every unit increment in X the increment in Y
    is *m* units


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_171_0.png)'
  - "[PAGE 172]\n\n# # Digital Differential Analyzer (DDA)\n\n+   - We consider the\
    \ line in the first octant. Other cases can be easily derived.\n+   - Uses differential\
    \ equation of the line\n+   \n+   \\( y_i=m \\cdot x_i+c \\)\n+   \n+   where,\
    \ \\( m=\\frac{y2-y1}{x2-x1} \\)\n\n+   - Incrementing X-coordinate by 1\n+  \
    \ \n+   \\( x_i=x_{i\\_prev}+1 \\)\n+   \n+   \\( y_i=y_{i\\_prev}+m \\)\n\n+\
    \   - Illuminate the pixel \\( [x_i,round(y_i)] \\)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_172_0.png)\n\
    \nDiscussion1: What technique makes it faster?\nDiscussion2: Is there any problem\
