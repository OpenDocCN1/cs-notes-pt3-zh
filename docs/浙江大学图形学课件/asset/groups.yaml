- raw:
  - '[PAGE 617]


    # # Introduction


    +   - Ray Tracing is a technique for image synthesis. Helps create a 2D picture
    of a 3D world

    +   - It is an algorithm for visible surface determination, which combines in
    a single model

    +     - hidden surface removal

    +     - shading due to direct illumination

    +     - shading due to global illumination

    +     - shadows'
  - '[PAGE 618]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_618_0.png)


    Image generated using Pov-Ray (Mike Miller)'
  - '[PAGE 619]


    # Features


    +   - Best known for handling shadows, reflections and refraction

    +   - It is an algorithm that works entirely in object space, hence accurate

    +   - Partial solution to global illumination problem and is the most complete
    simulation of an illumination-reflection model in computer graphics

    +   - Ray tracing has produced some of the most realistic images in computer graphics'
  - '[PAGE 620]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_620_0.png)


    Credits: Mike Miller using Pov-Ray'
  - '[PAGE 621]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_621_0.png)


    Credits: Mike Miller using Pov-Ray'
  - '[PAGE 622]


    # # Background


    +   - Objects are visible when light from a source reflects off their surfaces
    and reaches the observer (camera)

    +   - Image is formed by all the light that reaches the camera

    +   - If light rays are traced from the source, not all will reach the camera,
    resulting in unnecessary ray following

    +   - Rays are traced in the opposite direction, from the camera to the objects'
  - '[PAGE 623]


    # # Ray Tracing


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_623_0.png)'
  - '[PAGE 624]


    # Visible Surface Determination


    +   - View window is assumed to be divided into a regular grid (based on image
    resolution)

    +   - Each element of the grid corresponds to a unique pixel on the image

    +   - For each image pixel,

    +     - a ray is fired from the eye-point and through the center of the corresponding
    grid element

    +     - ray is intersected with every object in the scene'
  - '[PAGE 625]


    +   - object with the nearest intersection is identified

    +   - light leaving the object at that intersection point is calculated by using
    an illumination model

    +   - color of this light is assigned to the image pixel

    +   - if the ray doesn''t intersect with any object in the scene then a background
    color is assigned to the image pixel'
  - '[PAGE 626]


    # Global Illumination


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_626_0.png)


    Refraction Direction


    Light Direction


    Reflection Direction


    Light reflected

    from the point


    Normal


    Eye Ray'
  - '[PAGE 627]


    # # Global Illumination


    +   - Light reaching a point of intersection which contributes maximum to the
    light reflected from that point is a combination of

    +     - light coming directly from the light source (including ambient light)

    +     - light coming from the reflection direction

    +     - light coming from the refracted direction'
  - "[PAGE 628]\n\n+   - Light reflected from the intersection point in the direction\
    \ of the viewer is a combination of  \n+     – reflected light calculated by applying\
    \ the Phong Illumination model to light coming directly from the light source(s)\
    \  \n+     – attenuating the light coming from the reflection direction with the\
    \ specular coefficients of the object surface  \n+     – attenuating the light\
    \ coming from the refraction direction with the transparency of the object volume"
  - '[PAGE 629]


    # # Classes of Rays


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_629_0.png)'
  - '[PAGE 630]


    <!-- no content -->'
  - '[PAGE 631]


    # Recursion


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_631_0.png)


    Transparency Ray


    Reflection Ray


    Normal


    Eye Ray'
  - '[PAGE 632]


    # Recursive Ray Tracing


    +   - Illumination due to reflection and transmission is computed by tracing back
    the corresponding rays

    +   - It is a recursive process and is limited by assigning a fixed depth to this
    recursion'
  - '[PAGE 633]


    # # Shadows


    +   - The illumination/shadow ray acts as a shadow feeler

    +   - Shadow ray is intersected with the objects in its path

    +   - In case the shadow ray hits an opaque object then that source does not contribute
    to any illumination

    +   - If this ray reaches the light source without hitting any object than it
    means that there is direct illumination from that source. Shadow ray now acts
    as an illumination ray'
  md: "\n\n## Introduction\n\n- Ray Tracing is a technique for image synthesis. Helps\
    \ create a 2D picture of a 3D world\n- It is an algorithm for visible surface\
    \ determination, which combines in a single model\n  - hidden surface removal\n\
