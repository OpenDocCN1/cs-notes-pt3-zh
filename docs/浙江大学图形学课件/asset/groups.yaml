    \ -eyez);\n}\n```\n\n## Ex3\n\n- Switch between orthographic and perspective camera\n\
    - Moving the camera with arrow keys\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_376_0.png)\n\
    \n## THANK YOU\n\n## Computer Graphics Hardware\n\n## Conceptual Framework for\
    \ Interactive Graphics\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_379_0.png)\n\
    \n## Vector and Raster Displays\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_380_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_380_1.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_380_2.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_380_3.png)\n\n(a) Ideal line drawing\n\
    \n(b) Random scan\n\n(c) Rasterscan with outline primitives\n\n(d) Rasterscan\
    \ with filled primitives\n\n## Examples of raster and vector device pictures\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_381_0.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_381_1.png)\n\
    \n## Basic Definitions\n\n**Raster:** An array of dots or points\n\n**Pixel:**\
    \ One dot or point of the raster\n\n**Scan line:** One row of pixels\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_382_0.png)\n\
    \n## Basic Definitions\n\n**Dot or spot size:** Diameter of a single dot on the\
    \ device surface(screen or film or paper).\n\n**Addressability:** Maximum number\
    \ of individual dots per inch (dots may overlap).\n\n**Resolution:** The number\
    \ of distinguishable lines per inch. Depends on the spot size, addressability\
    \ and also the cross-sectional intensity distribution of the spot.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_383_0.png)\n\
    \n## Hard Copy Devices\n\n**Vector Devices:** pen plotters (flat bed or drum),\
    \ random scan laser plotter.\n\n**Raster devices:** printers (dot matrix/ink jet/laser/thermal\
    \ dye transfer), film recorder.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_384_0.png)\n\
    \n## Display Technologies\n\nThe CRT is the most common as of today.\n\nFlat panel\
    \ LCD displays are gradually taking over\n\nFor more information on flat panel\
    \ display see the lecture notes available from [http://hackman.mit.edu/LHandouts/6.976.ST01.Lecture21.01.pdf](http://hackman.mit.edu/LHandouts/6.976.ST01.Lecture21.01.pdf)\n\
    \nFor Monitor gamma and gamma correction see [http://www.cgsd.com/papers/gamma.html](http://www.cgsd.com/papers/gamma.html).\n\
    \nThe CRT monitor is much the same as the home TV monitor.\n\n## Cross-section\
    \ of a CRT\n\n- A CRT phosphor’s persistence largely determines the CFF (CFF =\
    \ minimum refresh rate which avoids flicker).\n- Longer the persistence, the lower\
    \ will be the CFF.\n- Low persistence enables better dynamic pictures.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_386_0.png)\n\
    \n## A Shadow Mask Colour CRT\n\nSmall RGB phosphor dots are arranged in triads.\
    \ The dots fuse to give different colours.\n\nThrough the shadow mask hole, the\
    \ three RGB guns can selectively focus on the respective colours.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_388_0.png)\n\
    \n"
