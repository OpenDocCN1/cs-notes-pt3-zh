    \n## Basic Definitions\n\n**Dot or spot size:** Diameter of a single dot on the\
    \ device surface(screen or film or paper).\n\n**Addressability:** Maximum number\
    \ of individual dots per inch (dots may overlap).\n\n**Resolution:** The number\
    \ of distinguishable lines per inch. Depends on the spot size, addressability\
