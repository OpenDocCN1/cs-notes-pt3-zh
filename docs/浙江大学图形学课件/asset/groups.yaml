  - '[PAGE 656]


    # HOW-TO


    +   - Three steps to use vertex array

    +     - Activate (enable) up to six arrays

    +     - Put data into the array

    +     - Draw geometry with the data

    +       - Accessing individual array elements

    +       - Creating a list of individual array elements

    +       - Processing sequential array elements'
  - '[PAGE 657]


    # Step 1: Enabling Arrays


    +   - The first step is to call **glEnableClientState()** with an enumerated parameter,
    which activates the chosen array.

    +     - `void glEnableClientState(GLenum array);`

    +       - Specifies the array to enable. Symbolic constants GL_VERTEX_ARRAY, GL_COLOR_ARRAY,
    GL_INDEX_ARRAY, GL_NORMAL_ARRAY, GL_TEXTURE_COORD_ARRAY, and GL_EDGE_FLAG_ARRAY
    are acceptable parameters.

    +     - `void glDisableClientState(GLenum array);`

    +       - Specifies the array to disable. Accepts the same symbolic constants
    as glEnableClientState().'
  - '[PAGE 658]


    # # Step 1: Enabling Arrays -2


    +   - For example:

    +     - If you use lighting, you may want to define a surface normal for every
    vertex. To use vertex arrays for that case, you activate both the surface normal
    and vertex coordinate arrays:

    +       - glEnableClientState(GL_NORMAL_ARRAY);

    +         glEnableClientState(GL_VERTEX_ARRAY);

    +     - Suppose that you want to turn off lighting at some point and just draw
    the geometry using a single color. You want to call **glIDisable()** to turn off
    lighting states. Now that lighting has been deactivated, you also want to stop
    changing the values of the surface normal state, which is wasted effort. To do
    that, you call

    +       - glDisableClientState(GL_NORMAL_ARRAY);'
  - "[PAGE 659]\n\n# # Step 2: Specifying Data -1\n\n+   - There are six different\
    \ routines to specify arrays  \n+     – one routine for each kind of array  \n\
    +       • void **glVertexPointer**(GLint size, GLenum type, GLsizei stride, const\
    \ GLvoid *pointer);  \n+       • Specifies where spatial coordinate data can be\
    \ accessed. pointer is the memory address of the first coordinate of the first\
    \ vertex in the array. type specifies the data type (GL_SHORT, GL_INT, GL_FLOAT,\
    \ or GL_DOUBLE) of each coordinate in the array. size is the number of coordinates\
    \ per vertex, which must be 2, 3, or 4. stride is the byte offset between consecutive\
    \ vertexes. If stride is 0, the vertices are understood to be tightly packed in\
    \ the array"
  - '[PAGE 660]


    # Step 2: Specifying Data


    +   - To access the other five arrays, there are five similar routines:

    +     - `void glColorPointer(GLint size, GLenum type, GLsizei stride, const GLvoid
    *pointer);`

    +     - `void glIndexPointer(GLenum type, GLsizei stride, const GLvoid *pointer);`

    +     - `void glNormalPointer(GLenum type, GLsizei stride, const GLvoid *pointer);`

    +     - `void glTexCoordPointer(GLint size, GLenum type, GLsizei stride, const
    GLvoid *pointer);`

    +     - `void glEdgeFlagPointer(GLsizei stride, const GLvoid *pointer);`'
