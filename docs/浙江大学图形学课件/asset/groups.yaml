    \ Modes\n\n- `glPolygonMode( GLenum face, GLenum mode );`  \n  Faces: `GL_FRONT`,\
    \ `GL_BACK`, `GL_FRONT_AND_BACK`  \n  Modes: `GL_FILL`, `GL_LINE`, `GL_POINT`\
    \  \n  By default, both the front and back face are drawn filled\n- `glFrontFace(\
    \ GLenum mode );`  \n  Mode is either `GL_CCW` (default) or `GL_CW`\n- `glCullFace(\
