  md: "\n\n## OpenGL Primitives\n\n- GL_POINTS\n- GL_LINES\n- GL_LINE_STRIP\n- GL_LINE_LOOP\n\
    \n- GL_TRIANGLES\n- GL_QUADS\n- GL_POLYGON\n- GL_TRIANGLE_STRIP\n- GL_TRIANGLE_FAN\n\
    - GL_QUAD_STRIP\n\nGL_POLYGON and GL_TRIANGLE are the only ones in common usage;\
    \ valid OpenGL polygons are closed, convex, co-planar and non-intersecting, which\
    \ is always true for triangles!\n\n## Examples\n\n```cpp\nglBegin(GL_POLYGON);\n\
    \    glVertex2i(0,0);\n    glVertex2i(0,1);\n    glVertex2i(1,1);\n    glVertex2i(1,0);\n\
    glEnd();\n\nglBegin(GL_POINTS);\n    glVertex2i(0,0);\n    glVertex2i(0,1);\n\
    \    glVertex2i(1,1);\n    glVertex2i(1,0);\nglEnd();\n```\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_862_0.png](img/94fd648dd12ff5c2cbed197b5038ba1a_862_0.png)\n\
    \n## Examples\n\n```cpp\nGLfloat list[6][2];\n\nglBegin(GL_LINES)\n    for (int\
    \ i = 0 ; i < 6 ;i++)\n        glVertex2v(list[i]);\nglEnd();\n\nglBegin(GL_LINE_STRIP)\n\
    \    for (int i = 0 ; i < 6 ;i++)\n        glVertex2v(list[i]);\nglEnd();\n\n\
    glBegin(GL_LINE_LOOP)\n    for (int i = 0 ; i < 6 ;i++)\n        glVertex2v(list[i]);\n\
    glEnd();\n```\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_863_0.png](img/94fd648dd12ff5c2cbed197b5038ba1a_863_0.png)\n\
    \n## Examples\n\nGL_TRIANGLE_STRIP\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_865_0.png](img/94fd648dd12ff5c2cbed197b5038ba1a_865_0.png)\n\
    \nGL_TRIANGLE_FAN\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_865_1.png](img/94fd648dd12ff5c2cbed197b5038ba1a_865_1.png)\n\
    \nGL_QUAD_STRIP\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_865_2.png](img/94fd648dd12ff5c2cbed197b5038ba1a_865_2.png)\n\
    \n> Must be<br>planar convex\n\n## OpenGL Command Syntax\n\n- All command names\
    \ begin with gl\n  - Ex.: `glVertex3f( 0.0, 1.0, 1.0 );`\n- Constant names are\
    \ in all uppercase\n  - Ex.: `GL_COLOR_BUFFER_BIT`\n- Data types begin with GL\n\
    \  - Ex.: `GLfloat onevertex[ 3 ];`\n- Most commands end in two characters that\
    \ determine the data type of expected arguments\n  - Ex.: `glVertex3f( ... ) =>\
    \ 3 GLfloat arguments`\n\n## Building Objects From Vertices\n\n- Specify a primitive\
    \ mode, and enclose a set of vertices in a glBegin / glEnd block\n- glBegin( GL_POLYGON\
    \ );\n- glVertex3f( 1.0, 2.0, 0.0 );\n- glVertex3f( 0.0, 0.0, 0.0 );\n- glVertex3f(\
    \ 3.0, 0.0, 0.0 );\n- glVertex3f( 3.0, 2.0, 0.0 );\n- glEnd();\n\n## OpenGL Example\n\
    \n```c\nvoid drawOneCubeface(size)\n{\n    static GLfloat v[8][3];\n    v[0][0]\
    \ = v[3][0] = v[4][0] = v[7][0] = -size/2.0;\n    v[1][0] = v[2][0] = v[5][0]\
    \ = v[6][0] = size/2.0;\n    v[0][1] = v[1][1] = v[4][1] = v[5][1] = -size/2.0;\n\
    \    v[2][1] = v[3][1] = v[6][1] = v[7][1] = size/2.0;\n    v[0][2] = v[1][2]\
    \ = v[2][2] = v[3][2] = -size/2.0;\n    v[4][2] = v[5][2] = v[6][2] = v[7][2]\
    \ = size/2.0;\n    glBegin( GL_POLYGON );\n        glVertex3fv(v[0]);\n      \
    \  glVertex2fv(v[1]);\n        glVertex2fv(v[2]);\n        glVertex2fv(v[3]);\n\
    \    glEnd();\n}\n```\n\n![img/94fd648dd12ff5c2cbed197b5038ba1a_869_0.png](img/94fd648dd12ff5c2cbed197b5038ba1a_869_0.png)\n\
    \n## Colors\n\n- OpenGL colors are typically defined as RGB components, each of\
    \ which is a float in the range [0.0, 1.0]\n- For the screen’s background:\n \
    \ ```cpp\n  glClearColor( 0.0, 0.0, 0.0 ); // black color\n  glClear( GL_COLOR_BUFFER_BIT\
    \ );\n  ```\n- For objects:\n  ```cpp\n  glColor3f( 1.0, 1.0, 1.0 ); // white\
    \ color\n  ```\n\n## Other Commands in glBegin / glEnd blocks\n\n- Not every OpenGL\
    \ command can be located in such a block. Those that can include, among others:\n\
    \  - glColor\n  - glNormal (to define a normal vector)\n  - glTexCoord (to define\
    \ texture coordinates)\n  - glMaterial (to set material properties)\n\n## Example\n\
    \n```cpp\nglBegin( GL_POLYGON );\n glColor3f( 1.0, 1.0, 0.0 );\n glVertex3f( 0.0,\
    \ 0.0, 0.0 );\n glColor3f( 0.0, 1.0, 1.0 );\n glVertex3f( 5.0, 0.0, 0.0 );\n glColor3f(\
    \ 1.0, 0.0, 1.0 );\n glVertex3f( 0.0, 5.0, 0.0 );\n glEnd();\n```\n\n## Compiling\
    \ OpenGL Programs\n\n- To use GLUT:\n  - `#include <GL/glut.h>`\n  - This takes\
    \ care of every other include you need\n  - Make sure that glut.lib (or glut32.lib)\
    \ is in your compiler’s library directory, and that the object module or DLL is\
    \ also available\n- See *OpenGL Game Programming* or online tutorials for details.\n\
    \n"
