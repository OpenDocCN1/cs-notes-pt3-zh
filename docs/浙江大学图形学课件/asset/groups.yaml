  md: "\n\n## Representing a Ray\n\n- Ray tracing is based on ray-object intersection\
    \ algorithms\n\n### Representing a ray becomes essential\n\nA point *P* on a ray\
    \ is given by the parametric equation\n\n\\[\nP = O + t \\bullet D, \\qquad \\\
    text{for } t > 0\n\\]\n\nwhere O is the ray origin, D is the ray direction. If\
    \ the direction D is normalized then t is the distance of the point from the origin\n\
    \n- Given a ray with\n  - *origin* **O**(x₀, y₀, z₀) and direction **D**(x_d,\
    \ y_d, z_d)\n  - any point on the ray is given as\n\n$$P(x_o + t \\bullet x_d,\\\
    quad y_o + t \\bullet y_d,\\quad z_o + t \\bullet z_d)$$\n\n- This equation forms\
    \ the basis of calculating intersections with some of the common primitives like\
    \ sphere, plane etc..\n\n## Ray-Sphere Intersection\n\n- Sphere Representation\
    \ : center **C(xc, yc, zc)** , radius **r**\n\n- Equation of the sphere is\n\n\
    \\((x - x_c)^2 + (y - y_c)^2 + (z - z_c)^2 = r^2\\)\n\n- Substituting the ray\
    \ equation into the sphere equation we have\n\n\\((x_o + t \\bullet x_d - x_c)^2\
    \ + (y_o + t \\bullet y_d - y_c)^2 + (z_o + t \\bullet z_d - z_c)^2 = r^2\\)\n\
    \n- This is a quadratic equation of the form\n\n\\( A \\bullet t^2 + B \\bullet\
    \ t + C = 0 \\)\n\nwhere,\n\n\\( A = x_d^2 + y_d^2 + z_d^2 = 1 \\)\n\n\\( B =\
    \ 2 \\bullet \\left( x_d \\bullet (x_o - x_c) + y_d \\bullet (y_o - y_c) + z_d\
    \ \\bullet (z_o - z_c) \\right) \\)\n\n\\( C = (x_o - x_c)^2 + (y_o - y_c)^2 +\
    \ (z_o - z_c)^2 - r^2 \\)\n\n- the two roots are given by\n\n\\( t_1 = \\frac{-B\
    \ - \\sqrt{B^2 - 4 \\bullet C}}{2} \\quad t_2 = \\frac{-B + \\sqrt{B^2 - 4 \\\
    bullet C}}{2} \\)\n\n- The smallest positive t value gives the nearest point of\
    \ intersection\n\n## Ray-Plane Intersection\n\n- The plane is represented by the\
    \ equation\n\n\\(a \\bullet x + b \\bullet y + c \\bullet z + d = 0\\)\n\n- Substituting\
    \ the ray equation into the plane equation we have\n\n\\(a \\bullet (x_o + t \\\
    bullet x_d) + b \\bullet (y_o + t \\bullet y_d) + c \\bullet (z_o + t \\bullet\
    \ z_d) + d = 0\\)\n\n- Solving for t\n\n\\(t = \\frac{-(a \\bullet x_o + b \\\
    bullet y_o + c \\bullet z_o + d)}{(a \\bullet x_d + b \\bullet y_d + c \\bullet\
    \ z_d)}\\)\n\n## Ray-Polygon Intersection\n\n- Involves two steps\n  - Find the\
    \ point of intersection of the ray with the plane of the polygon\n  - Check if\
    \ the point is inside or outside the polygon (even-odd rule)\n\n## Efficiency\
    \ in Ray Tracing\n\n- 95% of the time is spent in ray-object intersection\n- So\
    \ to increase speed\n  - write faster intersection algorithms\n  - reduce number\
    \ of intersection calculations\n- Intersection algorithms are always written to\
    \ work efficiently. Reducing the number of intersection calculation is the key\
    \ to increase speeds\n\n## Distributed Ray tracing\n\n- Since ray tracing uses\
    \ infinitely thin rays the resulting image has *standard aliasing effects*, *sharp\
    \ shadows*, *reflections* and *refraction*\n- Distributed ray tracing uses many\
    \ rays per pixel to obtain:\n  - soft shadows due to area light sources\n  - blurry\
    \ reflections due to surface imperfections\n  - translucency due to volume scattering\n\
    \  - depth of field for camera with lenses\n  - motion blur for moving objects\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_642_0.png)\n\n## Some Observations\n\
    \n- Ray tracing is computationally intensive, and it may take hours to generate\
    \ a scene of reasonable complexity\n- Ray tracing is view dependent. For every\
    \ change in view the image has to be recomputed\n- Ray tracing in real-time is\
    \ a challenge even today\n- Use of parallel machines and dedicated ray tracing\
    \ chips are some methods being investigated to do real-time ray tracing\n\n- Ray\
    \ tracing does not handle in a natural way some behavior of light like\n  - diffused\
    \ inter-reflections, bleeding of colored light from a dull red file cabinet on\
    \ to a white carpet, giving the carpet a pink tint\n  - caustics, focussed light\
    \ like the shimmering waves at the bottom of the swimming pool\n\n"
