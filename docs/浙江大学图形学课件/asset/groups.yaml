    # # Rasterization


    +   - The task of displaying a world modelled using primitives like lines, polygons,
    filled/patterned areas, etc. can be carried out in two steps

    +     - determine the pixels through which the primitive is visible, a process
    called **Rasterization or scan conversion**

    +     - determine the color value to be assigned to each such pixel.'
