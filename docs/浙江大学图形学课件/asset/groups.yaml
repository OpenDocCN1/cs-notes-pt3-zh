    \ 200.0, 100.0, 0.0\n};\nglColorPointer(3, GL_FLOAT, 6 * sizeof(GLfloat), intertwined);\n\
    glVertexPointer(3, GL_FLOAT, 6 * sizeof(GLfloat), &intertwined[3]);\n```\n\n##\
    \ Step 3: Dereferencing & Rendering\n\n- Until the contents of the vertex arrays\
    \ are dereferenced, the arrays remain on the client side, and their contents are\
    \ easily changed.\n- In Step 3, contents of the arrays are obtained, sent down\
    \ to the server, and then sent down the graphics processing pipeline for rendering.\n\
    \n## Step 3: Dereferencing & Rendering\n\n- There are three ways to obtain data:\n\
    \  - 1. Dereference a Single Array Element\n  - 2. Dereference a List of Array\
    \ Element\n  - 3. Dereference a Sequence of Array Element\n\n## Step 3: Dereferencing\
    \ & Rendering -3\n\n- (1). Dereference a Single Array Element\n  - void **glArrayElement**(GLint\
    \ ith)\n    - Obtains the data of one (the ith) vertex for all currently enabled\
    \ arrays. For the vertex coordinate array, the corresponding command would be\
    \ **glVertex**[size][type]v(), where size is one of [2,3,4], and type is one of\
    \ [s,i,f,d] for GLshort, GLint, GLfloat, and GLdouble respectively. Both size\
    \ and type were defined by **glVertexPointer**()\n    - For other enabled arrays,\
    \ **glArrayElement**() calls **glEdgeFlagv**(), **glTexCoord**[size][type]v(),\
    \ **glColor**[size][type]v(), **glIndex**[type]v(), and **glNormal**[type]v()\n\
    \    - If the vertex coordinate array is enabled, the **glVertex\\*v**() routine\
    \ is executed last, after the execution (if enabled) of up to five corresponding\
    \ array values.\n\n## Step 3: Dereferencing & Rendering\n\n**glArrayElement()**\
    \ is usually called between **glBegin()** and **glEnd()**.\n\n```c\nglEnableClientState(GL_COLOR_ARRAY);\n\
    glEnableClientState(GL_VERTEX_ARRAY);\nglColorPointer(3, GL_FLOAT, 0, colors);\n\
