  - '[PAGE 383]


    # # Basic Definitions


    **Dot or spot size:** Diameter of a single dot on the device surface(screen or
    film or paper).


    **Addressability:** Maximum number of individual dots per inch (dots may overlap).


    **Resolution:** The number of distinguishable lines per inch. Depends on the spot
    size, addressability and also the cross-sectional intensity distribution of the
    spot.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_383_0.png)'
