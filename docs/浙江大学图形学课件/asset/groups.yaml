  md: "\n\n## Structure of GLUT-Assisted Programs\n\n- GLUT relies on user-defined\
    \ callback functions, which it calls whenever some event occurs\n  - Function\
    \ to display the screen\n  - Function to resize the viewport\n  - Functions to\
    \ handle keyboard and mouse events\n\n## Event Driven Programming\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_877_0.png)\n\
    \n## Simple GLUT Example\n\n### Displaying a square\n\n```c\nint main (int argc,\
    \ char *argv[])\n{\n    glutInit(&argc, argv);\n    glutInitDisplayMode(GLUT_RGBA\
    \ | GLUT_DOUBLE);\n    int windowHandle\n    = glutCreateWindow(\"Simple GLUT\
    \ App\");\n    glutDisplayFunc(redraw);\n    glutMainLoop();\n    return 0;\n\
