  md: "\n# Computer Graphics\n\n# Course Overview\n\n2011\n\n# Welcome to the World\
    \ of Computer Graphics\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_1_0.png)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_2_0.png)\n\n## Course Objectives\n\n\
    - This is a *foundations* course.\n- At the end of this course you will know:\n\
    \  - the fundamental problem addressed by computer graphics\n  - the basic principles\
    \ and methods used in providing solutions.\n  - the basic programming skills required\
    \ for the development of computer graphics modeling and rendering systems.\n \
    \ - To cultivate the habit and ability to solve problem on one's own legs\n\n\
    ## Course Objectives\n\n- While the course is not a graphics programming tutorial,\
    \ the assignments and active participation in projects will ensure that you acquire\
    \ very good graphics programming skills using OpenGL.\n\n### What its not about?\n\
    \n**Photoshop, AutoCAD, Maya, Renderman**\n\n## Course Text\n\n- **Fundamentals\
    \ of Computer Graphics, Peter Shirley , Steve Marschner, A K Peters**;\n- 计算机图形学——原理、方法及应用，\
    \ 潘云鹤、董金祥、陈德人， 2003。\n- OpenGL (3e) by D. Hearn, M.P. Baker. Prentice Hall, 2004.\
    \ ISBN: 0130153907.\n- 计算机图形学（第三版）, Computer Graphics with OpenGL, Third Edition,\
    \ Donald Hearn, M. Pauline Baker, 电子工业出版社。（中、英文版）\n- OpenGL 1.4 Programming Guide,\
    \ OpenGL ARB. Addison-Wesley, 2003, ISBN 0321173481.\n- OpenGL编程指南（第四版）, OpenGL\
    \ Programming Guide, Fourth Edition, 人民邮电出版社。\n- OpenGL® Distilled, Paul Martz\
    \ , Addison-Wesley, Addison-Wesley Professional; 1ST edition (February 27, 2006).\
    \ ISBN 0321336798.\n- OpenGL 2.0精髓， Paul Martz， 人民邮电出版社， 2007年7月， ISBN 7-115-14908-9。\n\
    - **http://nehe.gamedev.net - The NeHe tutorials**\n\n## Course Faculty Details\n\
    \n- Instructor:童若锋 trf@zju.edu.cn\n- 唐敏 tang_m@zju.edu.cn\n- T.A.:王振东 wangzhendong@zju.edu.cn\n\
    - Office: 曹主303（曹主401）；\n- Tel: 13858044800;\n- Office hours: Thursday, 15:00-16:00\n\
    \n## Evaluation\n\n- Assignments 30%\n- Final Exam 40%\n- In-class performance\
    \ 30% (in-class test, attendance, question-answer)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_8_0.png)\n\
    \n# Course Website\n\nftp://cgyq2014:cgyq2014@give.zju.edu.cn\n\nThe PPT files\
    \ are free for downloading\n\nAlso for uploading the homework\n\nFile name format:\n\
    \nNAME_ID_number.rar (or .zip)\n\nFor Example: 许星_30801006**_2.rar\n\nhttp://give.zju.edu.cn/cgcourse\n\
    \n## Homework today\n\nSend an e-mail containing your name, ID, e-mail, phone\
    \ number ( not necessary, but **recommended**), even a brief greeting to TA’s\
    \ email.\n\nIt’s A0.\n\n# Thank You\n\n## Computer Graphics\n\nMany different\
    \ descriptions\n\n1. The science and technology of imaging the world in pixels,\
    \ such that it provides the real experience( looks real, sounds real, feels real)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_14_0.png)\n\nAnd last\n…\n\n# Pixel\
    \ Representation Problem\n\nThe pixel has only two properties, one fixed and the\
    \ other under computer control:\n\n- area of the pixel is fixed\n- colour of the\
    \ pixel is set under program control\n\nImage: array of pixels\n\n## Computer\
    \ Graphics\n\nMany different descriptions\n2. (recommended description )\nThe\
    \ science and technology of modeling ,\nprocessing and displaying objects in the\n\
    world in a computer.\n\n# Three Fundamental Tasks\n\n- Modelling the World (World\
    \ Representation)\n- Simulating the behaviour of objects in the world\n- Displaying\
    \ the World\n\n*Geometry and Physics are the traditional tools*\n\n# Three Fundamental\
    \ Tasks\n\n- Modelling the World (World Representation)\n- Simulating the behaviour\
    \ of objects in the world\n- Displaying the World\n\n*Geometry and Physics are\
    \ the traditional tools*\n\n## Different Digital Representations of the World\n\
    \n- Digital Images\n- 3D Geometric Objects (Graphics)\n- Symbolic Descriptions\n\
    \nQuestion:\nAdvantages and disadvantages ?\n"
