    \n## Recursion\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_631_0.png)\n\nTransparency\
    \ Ray\n\nReflection Ray\n\nNormal\n\nEye Ray\n\n## Recursive Ray Tracing\n\n-\
    \ Illumination due to reflection and transmission is computed by tracing back\
    \ the corresponding rays\n- It is a recursive process and is limited by assigning\
    \ a fixed depth to this recursion\n\n## Shadows\n\n- The illumination/shadow ray\
    \ acts as a shadow feeler\n- Shadow ray is intersected with the objects in its\
