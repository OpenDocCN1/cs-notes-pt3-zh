  - '[PAGE 257]


    # Programming Transformations


    +   - In OpenGL, the transformation matrices are part of the state, they must
    be defined *prior* to any vertices to which they are to apply.

    +   - In modeling, we often have objects specified in their own coordinate systems
    and must use transformations to bring the objects into the scene.

    +   - OpenGL provides *matrix stacks* for each type of supported matrix (model-view,
    projection, texture) to store matrices.'
