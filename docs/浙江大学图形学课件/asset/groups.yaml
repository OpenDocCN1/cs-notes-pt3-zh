    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_1.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_2.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_3.png)\n\n## Multiple Light Sources\n\
    \n- In case of multiple light sources, the terms for each light source are summed.\
    \ So for **_m_** light sources the illumination equation is\n\n  \\( I = I_a k_a\
    \ + \\sum_{1 \\leq i \\leq m} I_{pi}[k_d(\\overline{N} \\bullet \\overline{L_i})\
    \ + k_s(\\overline{R_i} \\bullet \\overline{V})^n] \\)\n\n- With summation it\
    \ is possible that the value of _I_ might exceed the maximum displayable pixel\
    \ value\n  - it could be avoided with proper selection of material\n  - the resulting\
    \ value of _I_ could be clamped to the maximum value\n  - divide each pixel value\
    \ by the peak value of _I_\n\n## Colored objects\n\n- The color of objects is\
    \ set by appropriate setting of the ambient and the diffused reflection coefficients\n\
    - Specular coefficient is not decided by the color\n- There are now three intensity\
    \ equations\n\n  \\(I_r = I_a k_{ar} + I_p[k_{dr}(\\overline{N} \\bullet \\overline{L})\
    \ + k_s(\\overline{R} \\bullet \\overline{V})^n]\\)\n\n  \\(I_g = I_a k_{ag} +\
    \ I_p[k_{dg}(\\overline{N} \\bullet \\overline{L}) + k_s(\\overline{R} \\bullet\
    \ \\overline{V})^n]\\)\n\n  \\(I_b = I_a k_{ab} + I_p[k_{db}(\\overline{N} \\\
    bullet \\overline{L}) + k_s(\\overline{R} \\bullet \\overline{V})^n]\\)\n\n- Summarizing\
    \ these three equations as single expression\n\n  \\(I(r,g,b) = I_a k_a(r,g,b)\
    \ + I_p[k_d(r,g,b)(\\overline{N} \\bullet \\overline{L}) + k_s(\\overline{R} \\\
    bullet \\overline{V})^n]\\)\n\n## Lights in OpenGL\n\n- Most implementations of\
    \ OpenGL can have up to 8 lights in the scene\n  - Each light can have a diffuse\
    \ and a specular component\n  - Each light can also have an ambient component\
    \ (light that is reflected off of so many surfaces, we can’t tell where it comes\
    \ from)\n  - Lights are referred to by the macros GL_LIGHT0, GL_LIGHT1, ... ,\
    \ GL_LIGHT8\n  - We set the properties of lights with calls to the function “glLightfv”\
    \ (v stands for vector)\n\n## Lights in OpenGL\n\n- glLightfv(Light #, Property,\
    \ Array of Vals)\n  - Light # = One of GL_LIGHTi\n  - Property, one of\n    -\
    \ GL_AMBIENT\n    - GL_DIFFUSE\n    - GL_SPECULAR\n    - GL_POSITION = where is\
    \ the light?\n  - Array of values = value for the property\n\n## Shading\n\n-\
    \ Shading is the process of determining the colors of all the pixels covered by\
    \ a surface using an illumination model\n- Simplest method is to\n  - determine\
    \ surface visible at each pixel\n  - compute normal of the surface\n  - evaluate\
    \ light intensity and color using an illumination model\n- This is quite expensive.\
    \ The shading methods could be made efficient by customizing for specific surface\
    \ representation\n\n## Shading Models\n\n- Shading Models give a technique to\
    \ determine the colors of all the pixels covered by a surface using appropriate\
    \ illumination model\n- Polygonal meshes are commonly used for representing complex\
    \ surfaces\n- The geometric information is available only at the vertices of a\
    \ polygon\n- Interpolative shading models could be used to increase the efficiency\
    \ substantially\n\n## Constant Shading\n\n- It is the simplest of the shading\
    \ models and is also called as *faceted shading* or *flat shading*\n- One polygon\
    \ receives only one intensity value\n- Illumination model is applied only once\
    \ for each polygon\n- Makes the following assumptions\n  - light source is at\
    \ infinity, so \\(\\overline{N} \\mathbin{\\bullet} \\overline{L}\\) is constant\
    \ across a polygon face\n  - viewer is at infinity, so \\(\\overline{R} \\mathbin{\\\
    bullet} \\overline{V}\\) is constant across the polygon face\n  - polygon represents\
    \ the actual surface being modeled\n"
