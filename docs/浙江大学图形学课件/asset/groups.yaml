    \n| 总线类型 | 数据传输率 |\n|---|---|\n| ISA | 8.33MB/S |\n| EISA | 133MB/S |\n| VISA\
    \ | 133MB/S |\n| PCI | 133MB/S |\n| AGP-1X | 266MB/S |\n| AGP-2X | 533MB/S |\n\
    | AGP-4X | 1.066GB/S |\n| AGP-8X | 2.133GB/S |\n| PCI Express1X（双通道） | 500MB/S\
    \ |\n| PCI Express2X（双通道） | 1GB/S |\n| PCI Express4X（双通道） | 2GB/S |\n| PCI Express8X（双通道）\
    \ | 4GB/S |\n| PCI Express16X（双通道） | 8GB/S |\n\n## PCI Express Bandwidth Improvements\
    \ (NVIDIA)\n\n- Improved Write Bandwidth is Critical for Rendering Directly to\
    \ System Memory\n\n|    | Bandwidth (GB/s) |\n|---|---|\n|    | READ¹ | WRITE²\
    \ |\n| AGP-8X | 2 | 0.2 |\n| PCI Express x16 | 4 | 4 |\n\n¹ READ from system memory\
    \ to GPU  \n² WRITE from GPU to system memory\n\n## Other Input Devices\n\n###\
    \ Physical Devices:\n\nScanners: work on the same principle as laser printers.\n\
    \nVoice recognisers: speaker dependent/independent\n\n3D Sonic Tablet: for 3D\
    \ locator input\n\nPressure sensitive tablet: adds a value to location\n\n## Input\
    \ Device Access Modes\n\n### Request Mode:\n\nBlocked mode of input; synchronous\
    \ with the program. Input device status on request. Wait until input is completed.\n\
    \n### Event Mode:\n\nAsynchronous with program; supply service routines for handling\
    \ events and inputting a device status.\n\n### Sample Mode:\n\nPolling mode for\
    \ inputting a device status or an event.\n\n## Virtual Reality Devices\n\n**HMD:**\
    \ Head mounted display with two one inch CRT monitors in each eye to display stereo\
    \ images.\n\n**Cave:** using projection displays.\n\n**Stereo glasses.**\n\n**Sensors\
    \ and trackers:** 6 degree measure - (x,y,z and orientation)\n\n**Gloves:** wrist\
    \ and finger movement.\n\n**Force feedback gloves:** for haptic output.\n\nBody\
    \ suits: for sensing body movement\n\n**Video input recognisers** for movement,\
    \ gesture, facial expression, etc.\n\n## Head Mounted Display\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_414_0.png)\n\
    \nBoom Technology,  \n[http://www.fakespace.com/](http://www.fakespace.com/)\n\
    \n## CybergIove\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_414_1.png)\n\n([http://www.virtex.com](http://www.virtex.com))\n\
    \n## CAVE\n\n(http://www.pyramidsystems.com/)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_415_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_415_1.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_415_2.png)\n\
