    # # Primitive Euler Operators


    +   - Make an edge and a vertex (MEV)

    +   - Make a face and an edge (MEF)

    +   - Make a Solid, a face, and a vertex (MFVS)

    +   - Make a cavity or passage and a body (KFMRH)

    +   - Make an edge and kill a Ring (MEKR)


    Each of these five operators has a corresponding complementary operator.


    M(make) K(kill) V(vertex) E(edge) F(face) S(solid)

    H(hole) R(ring)'
  - '[PAGE 762]


    # Comparison of the representation schemes


    +   - **Accuracy:** Spatial partitioning and polygonal BREP are approximate representations,
    where as primitive instancing, CSG, & BREPs with curved surfaces are more accurate.

    +   - **Domain:** Limited for sweep representation and primitive instancing. Spatial
    partitioning schemes can represent any solid.

    +   - **Uniqueness:** Only Octree and spatial enumeration techniques guarantee
    uniqueness. If the primitives are carefully chosen primitive instancing can guarantee
    uniqueness.

    +   - **Validity:** B-REPs are difficult to validate. No checking is needed for
    spatial occupancy enumeration and local checking for CSG and Octrees.

    +   - **Closure:** Primitive instancing and sweeps are not closed under boolean
    operations. BREPs are, in general, closed.'
