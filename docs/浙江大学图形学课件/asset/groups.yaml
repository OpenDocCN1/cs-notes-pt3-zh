  md: "\n\n## Current Transformation Matrix\n\n- **Current Transformation Matrix (CTM)**\
    \  \n  Is the matrix that is applied to any vertex that is defined subsequent\
    \ to its setting.\n- If we change the CTM, we change the *state* of the system.\n\
    - CTM is a 4 x 4 matrix that can be altered by a set of functions.\n\n## Changing\
    \ CTM\n\n- Specify CTM mode : glMatrixMode (_mode_);\n  _mode = (GL_MODELVIEW|\
    \ GL_PROJECTION| GL_TEXTURE )_\n- Load CTM : glLoadIdentity ( void ); glLoadMatrix{fd}\
    \ ( * _m_ );\n  _m = 1D array of 16 elements arranged by the columns_\n- Multiply\
    \ CTM : glMultMatrix{fd} ( * _m_ );\n- Modify CTM : (multiplies CTM with appropriate\
    \ transformation matrix)\n  glTranslate {fd} (x, y, z);\n  glScale {fd} ( x, y,\
    \ z);\n  glRotate {fd} ( _angle_, x, y, z);\n  rotate counterclockwise around\
    \ ray (0,0,0) to (x, y, z)\n\n## Rotation About an Arbitrary Point\n\n**Task:**\n\
    Rotate an object by 45.0 degrees about the line from\n(4.0, 5.0, 6.0) to (5.0,\
    \ 7.0, 9.0). (T₋p₁, R₄₅, T₊p₁)\n\n```\nglMatrixMode (GL_MODELVIEW);\nglLoadIdentity\
    \ ();\nglTranslatef (4.0, 5.0, 6.0);\nglRotatef (45.0, 1.0, 2.0, 3.0);\nglTranslatef\
    \ (-4.0, -5.0, -6.0);\n```\n\n## Order of Transformations\n\n- The transformation\
    \ matrices appear in *reverse* order to that in which the transformations are\
    \ applied.\n- *In OpenGL, the transformation specified most recently is the one\
    \ applied first.*\n\n## Matrix Stacks\n\n- OpenGL uses matrix stacks mechanism\
    \ to manage modelling transformation hierarchy.\n\n  glPushMatrix ( void );\n\
    \  glPopMatrix ( void );\n\n- OpenGL provides matrix stacks for each type of supported\
    \ matrix to store matrices.\n\n  Model-view matrix stack\n  Projection matrix\
    \ stack\n  Texture matrix stack\n\n## Example of Modelling Transform hierarchy\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_263_0.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_263_1.png)\n\
    \n## Ex2 – Desk with 4 legs\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_264_0.png)\n\
    \nBy calling glutSolidCube() …\n\n## Thank You\n\n## Properties of Transformations\n\
    \n| Type Preserves | Rigid Body: | Linear | Affine | Projective |\n|---|---|---|---|---|\n\
    |  | Rotation & translation | General 3x3 matrix | Linear + translation | 4x4\
    \ matrix with last row ≠ (0,0,0,1) |\n| Lengths | Yes | No | No | No |\n| Angles\
    \ | Yes | No | No | No |\n| Parallelness | Yes | Yes | Yes | No |\n| Straight\
    \ lines | Yes | Yes | Yes | Yes |\n\n## Viewing in 2D/3D\n\n## 2D Viewing\n\n\
    - The world is infinite (2D or 3D) but the screen is finite\n- Depending on the\
    \ details the user wishes to see, he limits his view by specifying a window in\
    \ this world\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_269_0.png)\n\nBy applying\
    \ **appropriate transformations** we can map the world seen through the window\
    \ on to the screen\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_270_0.png)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_270_1.png)\n\n## 2D Viewing Transformation\n\
    \n- Mapping the 2D world seen in the **window** on to the **viewport** is 2D **viewing\
    \ transformation** also called **window to viewport transformation**\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_272_0.png)\n\
    \n## Deriving 2D Viewing Transformation\n\nx - xCenter\ny - yCenter\n\n(x - xCenter)\
    \ • scaleFactor\n(y - yCenter) • scaleFactor\nwhere,\nscaleFactor = screenSize\
    \ / windowSize\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_273_0.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_274_0.png)\n\
    \n$$\\frac{screenSize}{2}+(x-xCenter)\\bullet scaleFactor$$\n\n$$\\frac{screenSize}{2}-(y-yCenter)\\\
    bullet scaleFactor$$\n\n- Given any point in the 2D world, the above transformations\
    \ maps that point on to the screen\n\n## The Aspect Ratio\n\n- In 2D viewing transformation\
    \ the **aspect ratio** is maintained when the scaling is uniform.\n- **scaleFactor**\
    \ is same for both x and y directions\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_275_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_275_1.png)\n\n"
