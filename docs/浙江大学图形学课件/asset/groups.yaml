  md: "\n\n## Attributes modulated for texture\n\n- *Surface color* (diffuse reflection\
    \ coefficients)\n  - most commonly used parameter for texture mapping. It is used\
    \ like wrapping an image on to a surface, like a label on a bottle.\n- *Specular\
    \ and diffuse reflection* (**environment mapping**)\n  - used to capture reflection\
    \ of the environment on to a surface. Commonly used in exhibiting shiny metallic\
    \ surfaces.\n- *Normal vector perturbations* (**bump mapping**)\n  - used to generate\
    \ a rough surfaces like that of an orange.\n\n## Problems\n\n- Aliasing artifacts\n\
    \  - Due to point sampling\n- Perspective distortions\n  - Since we did not take\
    \ into account perspective transformation\n\n## Computing Color in Texture mapping\n\
    \n- Associate texture with polygon\n- Map pixel onto polygon and then into texture\
    \ map\n- Use weighted average of covered texture to compute color.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_560_0.png)\n\
    \n## Taking care of aliasing\n\n- What causes aliasing artifacts\n  - High frequency\
    \ signals\n- Typical solutions\n  - Sample at higher rates\n  - Prefilter textures\
    \ using low pass filters\n\n## Optimization\n\n- Since most of the times, textures\
    \ are known a priori, we can create various levels of these prefiltered textures\
    \ in a preprocess.\n- Then at run time, we fetch the required level of mipmap\
    \ and apply that texture\n- This is known as mipmapping\n\n## Mipmapping\n\n-\
    \ Like any other object, a texture mapped object can be viewed from many distances.\n\
    - Sometimes, that causes problems.\n  - A low-resolution texture (say, 32x32)\
    \ applied to a big polygon (say, one that occupies a 512x512 area on screen) will\
    \ appear blocky.\n  - Conversely, if you apply a high-resolution texture to a\
    \ small polygon, how do you decide which texels to show and which to ignore?\n\
    \n## Mipmapping (continued)\n\n- One solution is to provide multiple levels of\
    \ detail for the same texture and use the one that best matches the polygon’s\
    \ apparent size on screen.\n- This technique is called Mipmapping, and each texture\
    \ in the hierarchy is called a mipmap.\n- OpenGL can compute mipmaps automatically,\
    \ and it can also accept mipmaps provided from different files.\n\n## Mipmapping\
    \ Example\n\n### Original Texture\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_565_0.png)\n\
    \n### Pre-Filtered Images\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_565_1.png)\n\
    \n30\n\n## Texture Filtering\n\n- When the texture is mapped to a polygon, a single\
    \ texel rarely matches a single pixel exactly.\n- If a pixel matches only a portion\
    \ of a texel, the texel must be magnified.\n- If a pixel matches more than one\
    \ texel, the texels must be minified.\n\n## Filtering Example\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_567_0.png)\n\
    \n## Texture Matrix\n\n- Loading a texture onto the graphics card is very expensive\n\
    - But once there, a **texture matrix** can be used to “transform” the texture\n\
    \  - For example, changing the translation can select different parts of the texture\n\
    - If the texture matrix is changed from frame to frame, the texture will appear\
    \ to move on the object\n- This is particularly useful for things like flame,\
    \ or swirling vortices, …\n\n## Multitexturing\n\n- It is sometimes possible to\
    \ apply more than one texture to a polygon.\n- Examples: Light Maps, Texture Blending\n\
    - NOTE: Most, but not all, implementations of OpenGL support multitexturing!\n\
    \n## Light Maps\n\n- Instead of wallpapering a polygon with the texture’s colors,\
    \ we can blend the texture with the existing colors.\n- A “light map” is such\
    \ a black-and-white texture; white texels will cause the underlying pixels to\
    \ appear brighter and shinier, and vice versa.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_572_0.png)\n\
    \n"
