  - '[PAGE 288]


    # # The Pinhole Camera


    # ## Camera Obscura Leonardo da Vinci


    The principle upon which all camera equipment works is traced to artist / inventor
    Leonardo da Vinci who showed that all that was needed to project an image was
    a small pinhole through which light could pass. The smaller the hole the sharper
    the image.


    The basic camera, called a pinhole camera, existed in the early 17th Century.
    It took much longer for science to find a light sensitive material to record the
    image. It was not until 1826 when Joseph Niepce from France discovered that silver
    chloride （氯化 银） could be used to make bitumen sensitive to light.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_288_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_288_1.png)'
  - '[PAGE 289]


    # Transformations and Camera

    Analogy


    +   - **Modeling transformation**

    +     - Shaping, positioning and moving the objects in the world scene.

    +   - **Viewing transformation**

    +     - Positioning and pointing camera onto the scene, selecting the region of
    interest.

    +   - **Projection transformation**

    +     - Adjusting the distance of the eye

    +   - **Viewport transformation**

    +     - Enlarging or reducing the physical photograph.'
