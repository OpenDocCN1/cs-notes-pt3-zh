    +     _mode = (GL_MODELVIEW| GL_PROJECTION| GL_TEXTURE )_

    +   - Load CTM : glLoadIdentity ( void ); glLoadMatrix{fd} ( * _m_ );

    +     _m = 1D array of 16 elements arranged by the columns_

    +   - Multiply CTM : glMultMatrix{fd} ( * _m_ );

    +   - Modify CTM : (multiplies CTM with appropriate transformation matrix)

    +     glTranslate {fd} (x, y, z);

    +     glScale {fd} ( x, y, z);

    +     glRotate {fd} ( _angle_, x, y, z);

    +     rotate counterclockwise around ray (0,0,0) to (x, y, z)'
