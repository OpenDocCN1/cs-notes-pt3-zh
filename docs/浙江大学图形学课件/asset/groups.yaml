    \ by the observer. There is no such thing called color without an observer  \n\
    - Depends upon  \n  - Physics of light  \n  - Interaction of light with physical\
    \ materials  \n  - Interpretation of the resulting phenomenon by the human visual\
    \ system and the human brain\n\n"
