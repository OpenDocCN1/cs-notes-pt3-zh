  - '[PAGE 498]


    # # Illumination models


    +   - A surface point could be illuminated by

    +     - **local illumination**, light directly emitted by light sources

    +     - **global illumination**, light reflected from and transmitted through
    its own and other surfaces

    +   - **Illumination models** express the factors which determine the surface
    color at a given point on a surface

    +   - **Illumination models** compute the color at a point in terms of both local
    and global illumination'
