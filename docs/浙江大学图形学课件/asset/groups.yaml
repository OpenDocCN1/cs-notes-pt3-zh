- raw:
  - '[PAGE 603]


    # Facts about adding shadows


    +   - Algorithms for shadows deal with polygonal meshes (ray tracing is an exception).

    +   - Most of the shadows generated are hard edged generated by point light sources.
    Shadows generated by area light sources require special handling.

    +   - Adding shadows is a computational overhead and hence is not treated as a
    necessity like shading algorithms.

    +   - For 3D animation shadows are important for depth and movement perception.'
  - '[PAGE 604]


    # # Global Illumination


    _Observation_: light comes from other surfaces, not just designated light sources

    _Goal_: simulate interreflection of light in 3D scenes

    **_Difficulty:_ you can no longer shade surfaces one at a time, since they’re
    now interrelated!**


    Two general classes of algorithms:

    **1. ray tracing methods**: simulate motion of photons one by one, tracing photon
    paths either backwards or forwards

    **2. radiosity methods**: set up a system of linear equations whose solution is
    the light distribution'
  - '[PAGE 605]


    # # Radiosity


    credits: Stu Feldman & John Wallace, 1987'
  - '[PAGE 606]


    # # Radiosity Methods


    +   - Radiosity methods provide solutions for global diffused interactions

    +   - It is an object space algorithm which solves for intensity on the surface
    of each and every every object in the environment. It is view independent.

    +   - The resulting intensity solution is given to a renderer which synthesises
    an image for a specific view by removing hidden surfaces

    +   - The method is excellent for generation of realistic images of interior environments
    which are collections of non-specular objects'
  - '[PAGE 607]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_607_0.png)


    credits: John Wallace & Micheal Cohen, 1987'
  - '[PAGE 608]


    credits: Dani Lischinski & Filippo Tampieri, 1993'
  - '[PAGE 609]


    # # Radiosity Theory


    +   - Radiosity is defined as energy per unit area leaving a surface per second.

    +   - Surfaces in the environment are divided into smaller elements called patches

    +   - Each patch has surface properties like reflectivity R (positive value less
    than 1.0) , and emissivity E, which is the energy emitted per unit area

    +   - Energy leaving a patch is the sum of reflected energy and emitted energy'
  - '[PAGE 610]


    <!-- no content -->'
  - '[PAGE 611]


    # # Form Factor Calculation


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_611_0.png)'
  - "[PAGE 612]\n\n+   - The radiosity equation can now be written as\n+   \n+   \\\
    ( B_i A_i = E_i A_i + R_i \\sum_{j=1}^n B_j F_{ji} A_j \\)\n\n+   - Form factor\
    \ \\(\\mathbf{F}_{ji}\\) is a constant and depends on the geometric relationship\
    \ between the patches\n\n+   - A reciprocity relationship gives \\(\\mathbf{F}_{ij}\\\
    mathbf{A}_i=\\mathbf{F}_{ji}\\mathbf{A}_j\\)\n\n+   - Substituting this relationship\
    \ in the above radiosity equation and dividing throughout by \\(\\mathbf{A}_i\\\
    )\n+   \n+   \\( B_i = E_i + R_i \\sum_{j=1}^n B_j F_{ij} \\)"
  - '[PAGE 613]


    # The Radiosity Matrix


    $$B_i - R_i\sum_{j=1}^{n} B_jF_{ij}=E_i$$


    Such an equation exists for every patch in the scene


    $$B_1-R_1F_{11}B_1-R_1F_{12}B_2-R_1F_{13}B_3\cdots=E_1$$

    $$B_2-R_2F_{21}B_1-R_2F_{22}B_2-R_2F_{23}B_3\cdots=E_2$$

    $$B_3-R_3F_{31}B_1-R_3F_{32}B_2-R_3F_{33}B_3\cdots=E_3$$

    $$\vdots$$

    $$\vdots$$

    $$B_n-R_nF_{n1}B_1-R_nF_{n2}B_2-R_nF_{n3}B_3\cdots=E_n$$'
  - '[PAGE 614]


    # This set simultaneous of equations can be written in matrix form:


    $$\begin{bmatrix}

    1-R_1F_{11} & -R_1F_{12} & \cdots & -R_1F_{1n} \\

    -R_2F_{21} & 1-R_2F_{22} & \cdots & -R_2F_{2n} \\

    \vdots & \vdots & \ddots & \vdots \\

    -R_nF_{n1} & -R_nF_{n2} & \cdots & 1-R_nF_{nn}

    \end{bmatrix}

    \begin{bmatrix}B_1\\B_2\\\vdots\\B_n\end{bmatrix}

    =

    \begin{bmatrix}E_1\\E_2\\\vdots\\E_n\end{bmatrix}$$


    $E_i$ is non-zero only for patches of light sources


    $R_i$ is the reflectivity of the patch


    $F_{ij}$ is the form factor which can be calculated


    +   - The matrix equation is solved to calculate $B_i$''s'
  - '[PAGE 615]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_615_0.png)


    credits: Dani Lischinski & Filippo Tampieri, 1993'
