  - '[PAGE 634]


    # Representing a Ray


    +   - Ray tracing is based on ray-object intersection algorithms


    # _Representing a ray becomes essential_


    A point *P* on a ray is given by the parametric equation


    \[

    P = O + t \bullet D, \qquad \text{for } t > 0

    \]


    where O is the ray origin, D is the ray direction. If the direction D is normalized
    then t is the distance of the point from the origin'
  - '[PAGE 635]


    # ...Representing a Ray


    +   - Given a ray with

    +     *origin* **O**(x₀, y₀, z₀) and direction **D**(x_d, y_d, z_d)

    +     any point on the ray is given as


    $$P(x_o + t \bullet x_d,\quad y_o + t \bullet y_d,\quad z_o + t \bullet z_d)$$


    +   - This equation forms the basis of calculating intersections with some of
    the common primitives like sphere, plane etc..'
  - '[PAGE 636]


    # # Ray-Sphere Intersection


    +   - Sphere Representation : center **C(xc, yc, zc)** , radius **r**


    +   - Equation of the sphere is


    \((x - x_c)^2 + (y - y_c)^2 + (z - z_c)^2 = r^2\)


    +   - Substituting the ray equation into the sphere equation we have


    \((x_o + t \bullet x_d - x_c)^2 + (y_o + t \bullet y_d - y_c)^2 + (z_o + t \bullet
    z_d - z_c)^2 = r^2\)'
  - "[PAGE 637]\n\n+   - This is a quadratic equation of the form\n+   \n+     \\\
    ( A \\bullet t^2 + B \\bullet t + C = 0 \\)\n+   \n+     where,\n+   \n+     \\\
    ( A = x_d^2 + y_d^2 + z_d^2 = 1 \\)\n+   \n+     \\( B = 2 \\bullet \\left( x_d\
    \ \\bullet (x_o - x_c) + y_d \\bullet (y_o - y_c) + z_d \\bullet (z_o - z_c) \\\
    right) \\)\n+   \n+     \\( C = (x_o - x_c)^2 + (y_o - y_c)^2 + (z_o - z_c)^2\
    \ - r^2 \\)\n\n+   - the two roots are given by\n+   \n+     \\( t_1 = \\frac{-B\
    \ - \\sqrt{B^2 - 4 \\bullet C}}{2} \\quad t_2 = \\frac{-B + \\sqrt{B^2 - 4 \\\
    bullet C}}{2} \\)\n\n+   - The smallest positive t value gives the nearest point\
    \ of intersection"
  - "[PAGE 638]\n\n# # Ray-Plane Intersection\n\n+   - The plane is represented by\
    \ the equation\n+   \\(a \\bullet x + b \\bullet y + c \\bullet z + d = 0\\)\n\
    \n+   - Substituting the ray equation into the plane equation we have\n+   \n\
    +   \\(a \\bullet (x_o + t \\bullet x_d) + b \\bullet (y_o + t \\bullet y_d) +\
    \ c \\bullet (z_o + t \\bullet z_d) + d = 0\\)\n\n+   - Solving for t\n+   \n\
    +   \\(t = \\frac{-(a \\bullet x_o + b \\bullet y_o + c \\bullet z_o + d)}{(a\
    \ \\bullet x_d + b \\bullet y_d + c \\bullet z_d)}\\)"
  - '[PAGE 639]


    # # Ray-Polygon Intersection


    +   - Involves two steps

    +     - Find the point of intersection of the ray with the plane of the polygon

    +     - Check if the point is inside or outside the polygon (even-odd rule)'
  - '[PAGE 640]


    # # Efficiency in Ray Tracing


    +   - 95% of the time is spent in ray-object intersection

    +   - So to increase speed

    +     - write faster intersection algorithms

    +     - reduce number of intersection calculations

    +   - Intersection algorithms are always written to work efficiently. Reducing
    the number of intersection calculation is the key to increase speeds'
  - '[PAGE 641]


    # Distributed Ray tracing


    +   - Since ray tracing uses infinitely thin rays the resulting image has *standard
    aliasing effects*, *sharp shadows*, *reflections* and *refraction*

    +   - Distributed ray tracing uses many rays per pixel to obtain:

    +     - soft shadows due to area light sources

    +     - blurry reflections due to surface imperfections

    +     - translucency due to volume scattering

    +     - depth of field for camera with lenses

    +     - motion blur for moving objects'
  - '[PAGE 642]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_642_0.png)'
  - '[PAGE 643]


    # Some Observations


    +   - Ray tracing is computationally intensive, and it may take hours to generate
    a scene of reasonable complexity

    +   - Ray tracing is view dependent. For every change in view the image has to
    be recomputed

    +   - Ray tracing in real-time is a challenge even today

    +   - Use of parallel machines and dedicated ray tracing chips are some methods
