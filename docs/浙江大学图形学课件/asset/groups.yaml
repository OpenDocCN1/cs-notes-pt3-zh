  - '[PAGE 859]


    # # How OpenGL Works


    +   - **OpenGL is a state machine**

    +     - You give it orders to set the current state of any one of its internal
    variables, or to query for its current status.

    +     - The current state won’t change until you specify otherwise.

    +     - Ex.: if you set the current color to Red, everything you draw will be
    painted Red until you change the color explicitly.

    +     - Each of the system’s state variables has a default value.'
