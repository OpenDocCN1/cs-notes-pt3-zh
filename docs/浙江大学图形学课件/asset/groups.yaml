    \  - shadows\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_618_0.png)\n\nImage generated\
    \ using Pov-Ray (Mike Miller)\n\n## Features\n\n- Best known for handling shadows,\
    \ reflections and refraction\n- It is an algorithm that works entirely in object\
    \ space, hence accurate\n- Partial solution to global illumination problem and\
    \ is the most complete simulation of an illumination-reflection model in computer\
    \ graphics\n- Ray tracing has produced some of the most realistic images in computer\
    \ graphics\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_620_0.png)\n\nCredits:\
    \ Mike Miller using Pov-Ray\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_621_0.png)\n\
    \nCredits: Mike Miller using Pov-Ray\n\n## Background\n\n- Objects are visible\
    \ when light from a source reflects off their surfaces and reaches the observer\
    \ (camera)\n- Image is formed by all the light that reaches the camera\n- If light\
    \ rays are traced from the source, not all will reach the camera, resulting in\
    \ unnecessary ray following\n- Rays are traced in the opposite direction, from\
    \ the camera to the objects\n\n## Ray Tracing\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_623_0.png)\n\
    \n## Visible Surface Determination\n\n- View window is assumed to be divided into\
    \ a regular grid (based on image resolution)\n- Each element of the grid corresponds\
    \ to a unique pixel on the image\n- For each image pixel,\n  - a ray is fired\
    \ from the eye-point and through the center of the corresponding grid element\n\
    \  - ray is intersected with every object in the scene\n- object with the nearest\
    \ intersection is identified\n- light leaving the object at that intersection\
    \ point is calculated by using an illumination model\n- color of this light is\
    \ assigned to the image pixel\n- if the ray doesn't intersect with any object\
    \ in the scene then a background color is assigned to the image pixel\n\n## Global\
    \ Illumination\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_626_0.png)\n\nRefraction\
    \ Direction\n\nLight Direction\n\nReflection Direction\n\nLight reflected\nfrom\
    \ the point\n\nNormal\n\nEye Ray\n\n## Global Illumination\n\n- Light reaching\
    \ a point of intersection which contributes maximum to the light reflected from\
    \ that point is a combination of\n  - light coming directly from the light source\
    \ (including ambient light)\n  - light coming from the reflection direction\n\
    \  - light coming from the refracted direction\n- Light reflected from the intersection\
    \ point in the direction of the viewer is a combination of\n  - reflected light\
    \ calculated by applying the Phong Illumination model to light coming directly\
    \ from the light source(s)\n  - attenuating the light coming from the reflection\
    \ direction with the specular coefficients of the object surface\n  - attenuating\
    \ the light coming from the refraction direction with the transparency of the\
    \ object volume\n\n## Classes of Rays\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_629_0.png)\n\
    \n## Recursion\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_631_0.png)\n\nTransparency\
    \ Ray\n\nReflection Ray\n\nNormal\n\nEye Ray\n\n## Recursive Ray Tracing\n\n-\
    \ Illumination due to reflection and transmission is computed by tracing back\
    \ the corresponding rays\n- It is a recursive process and is limited by assigning\
    \ a fixed depth to this recursion\n\n## Shadows\n\n- The illumination/shadow ray\
    \ acts as a shadow feeler\n- Shadow ray is intersected with the objects in its\
    \ path\n- In case the shadow ray hits an opaque object then that source does not\
    \ contribute to any illumination\n- If this ray reaches the light source without\
    \ hitting any object than it means that there is direct illumination from that\
    \ source. Shadow ray now acts as an illumination ray\n\n"
