- raw:
  - '[PAGE 522]


    # # Constant Shading


    +   - It is a fast technique for shading as it involves very less calculations

    +   - If the polygons are very small (say one pixel large) when projected on the
    screen then the result is as good as any interpolative technique

    +   - Usually used for coarse preview of scenes


    OpenGL uses the normal of the **first vertex** of a single polygon to determine
    the color.


    ```

    ```

    glShadeModel (GL_FLAT) ;

    ```

    ```


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_522_0.png)'
  - '[PAGE 523]


    # # Gouraud Shading


    +   - It is an interpolative shading method, also called _intensity interpolation
    shading_ or _color interpolation shading_

    +   - Involves the following steps

    +     - Normals are computed at the vertex as the average of the normals of all
    the faces meeting at that vertex

    +     - Intensity at each vertex is calculated using the normal and an illumination
    model

    +     - For each polygon the intensity values for the interior pixels are calculated
    by linear interpolation of the intensities at the vertices'
  - '[PAGE 524]


    # # Gouraud Shading


    +   • Intensity I<sub>p</sub> at a point is calculated as


    \( I_a = I_1 + (I_2 - I_1) \frac{y - y_1}{y_2 - y_1} \)


    \( I_b = I_1 + (I_3 - I_1) \frac{y - y_1}{y_3 - y_1} \)


    \( I_p = I_a + (I_b - I_a) \frac{x - x_a}{x_b - x_a} \)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_524_0.png)'
  - '[PAGE 525]


    # # Gouraud Shading


    +   • Might miss specular highlights, if the highlight doesn’t fall at the vertex


    ```

    glShadeModel(GL_SMOOTH);

    ```


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_525_0.png)'
  - '[PAGE 526]


    # # Phong Shading


    +   - It is an interpolative shading method, also called **normal-vector interpolation
    shading**

    +   - Involves the following steps

    +     - Normals are computed at the vertex as the average of the normals of all
    the faces meeting at that vertex

    +     - For each polygon the value of the normal for the surface occupied by each
    interior pixel is calculated by linear interpolation of the normals at the vertices

    +   - Specular reflections are also incorporated

    +   - Interpolation of normals is done exactly like intensity interpolation in
    Gouraud shading'
  - '[PAGE 527]


