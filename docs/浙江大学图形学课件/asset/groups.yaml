    - Parametric\n- Piecewise\n\n# How would you describe this?\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_144_0.png)\n\
    \n**Explicit representation** – represents a curve with one variable as a function\
    \ of one or more other variables. $y=f(x)$\n\n# Explicit Representation: Some\
    \ Examples\n\n- **2D**\n  - y = f(x), eg. y = mx + c\n- **3D**\n  - z = f(x, y),\
    \ eg. z = ax + by + c\n\nWhat’s the representation for a 3D line?\n\n*3D Line\
    \ requires two equations: the two planes which intersect in that line.*\n\nWhat\
    \ is the “y=mx + c” form for a vertical line?\n\n*The Explicit form falls apart\
    \ here.*\n\n# Implicit Form\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_146_0.png)\n\
    \nx² - y = 0\n\n***Implicit representation*** – represents a curve as the zero\
    \ of a function of all coordinate variables: f(x, y) = 0\n\n## Implicit Representation:\
    \ Some Examples\n\n- 2D\n  - f(x, y) = 0\n  - ax + by + c = 0 Line\n  - x² + y²\
    \ − r² = 0 Circle\n\n- 3D\n  - f(x, y, z) = 0\n  - ax + by + cz + d = 0 Plane\n\
    \  - x²/a² + y²/b² + z²/c² − r² = 0 Ellipsoid\n\n## Point Classification Using\
    \ Implicit Form\n\n- The function is really a membership test\n\nf(x, y, z) =\
    \ 0   →   Is f(x,y, z) = 0 for a point?\n\nPoint classification is easy.\n\nGiven\
    \ any point (x, y, z),\n\nIf f(x, y, z) = 0, then on the surface;\n> 0, then outside/one\
    \ side of the surface;\n< 0, then inside/other side of the surface;\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_148_0.png)\n\
    \n> 0\n\n# Problems in Using Implicit Form\n\n- Point classification is easy.\n\
    - But drawing is not.\n- Impractical to test every pixel for classification.\n\
    - Need a generative form, one that allows us to compute the points on the curve/surface\
    \ by evaluation of some simple function.\n\n# Parametric Representation of Curves\n\
    \nMake x, y, z as separate functions of a parameter.\n\nA planar curve:\n\n$$x=x(u)$$\n\
    $$y=y(u)$$\n\n$$u\\in(u_0,u_1)$$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_150_0.png)\n\
    \nA space curve: $\\left(x(u),\\ y(u),\\ z(u)\\right)$\n\n# Parametric Form: Some\
    \ Examples\n\n$$x = x_0 + (x_1 - x_0) * u \\qquad y = y_0 + (y_1 - y_0) * u$$\n\
    \n$$x = r * \\cos(u) \\qquad y = r * \\sin(u)$$\n\n# Parametric Representation\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_152_0.png)\n\n# Parametric Form: More\
    \ Examples\n\n- ⇒ `x = x₀ + (x₁ − x₀) * u`　　　　`y = y₀ + (y₁ − y₀) * u`\n- ⇒ `x\
    \ = r * cos(u)`　　　　　　　`y = r * sin(u)`\n\nFunctions with two arguments are used\
    \ to obtain surface definitions.\n\nSay, $f(u,v)$ is the function.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_153_0.png)\n\
    \n**Ellipsoid**\n\n$$\n\\begin{aligned}\nx &= a\\cos(u)\\sin(v) \\\\\ny &= b\\\
    sin(u)\\sin(v) \\\\\nz &= c\\cos(v)\n\\end{aligned}\n$$\n\n# Curve Tangents\n\n\
    - Obtained by taking first derivative.\n- For explicit form: \\(\\frac{dy}{dx}\\\
    )\n- For implicit form take partial derivatives\n  \\(\\left(\\frac{\\delta f}{\\\
    delta x},\\frac{\\delta f}{\\delta y}\\right)\\)\n- For parametric form, take\
    \ the first derivative of each coordinate function\n  \\(\\left(\\frac{dx}{du},\\\
    frac{dy}{du}\\right)\\)\n\n"
