    \n```\nfor i = 0 to nRows-1\n    for j = 0 to nCols-1\n        ray = genRay(eye,\
    \ pixel(i,j))\n        castRay(ray)\n```\n\n## Ray Casting\n\n### Cast ray(ray)\n\
    \nfor every polygon in the scene\nintersect ray with polygon\nstore the color\
    \ at point of intersection\nand the distance from ray origin\n\nsort the intersection\
    \ points according to distance\ndraw_pixel(color)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_487_0.png)\n\
    \n## Ray-Triangle Intersection\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_488_0.png)\n\
    \n## Ray-Triangle Intersection\n\nStep I: Computer intersection of the Ray with\n\
    the plane containing the triangle. Let it be P.\nStep II: Find whether point P\
    \ is inside or\noutside the triangle.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_489_0.png)\n\
    \n## Illumination and Shading\n\n## Lighting & Shading\n\nWithout light ... we\
    \ don’t see much of our scene!\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_492_0.png)\n\
    \nWithout shading, objects do not look three dimensional!\n\n## Demo – Multi-light\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_493_0.png)\n\n## Illumination\n\n-\
    \ **Illumination** is the complete description of all the light striking a particular\
    \ point on a particular surface\n\n- **Color** at a point on an object is decided\
    \ by the properties of the light leaving that point\n\n- Knowing the **illumination**\
    \ and the **surface physics** at a point on a surface, we can determine the properties\
    \ of the light leaving that point\n\n- In order to generate realistic images we\
    \ need to understand how light interacts with the surface of objects\n\n## Interaction\
    \ of light with a Solid\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_495_0.png)\n\
    \n## Interaction of Light\n\n- There are two illumination phenomena of importance\n\
    \  - interaction of light with the boundaries between materials\n  - scattering\
    \ and absorption of light as it passes through the material\n- Boundaries between\
    \ materials are surfaces which make up the environment\n- Light striking a boundary\
    \ is either reflected or transmitted. For opaque materials light is absorbed on\
    \ passing through the boundary\n\n## Light interaction in a Scene\n\nTo simulate\
    \ and calculate the precise physics of light interacting with a surface is extremely\
    \ complex\n\nMost graphics applications (including ray tracing!) use an approximation\
    \ ... a lighting model or an illumination model\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_497_0.png)\n\
    \n## Illumination models\n\n- A surface point could be illuminated by\n  - **local\
    \ illumination**, light directly emitted by light sources\n  - **global illumination**,\
    \ light reflected from and transmitted through its own and other surfaces\n- **Illumination\
    \ models** express the factors which determine the surface color at a given point\
    \ on a surface\n- **Illumination models** compute the color at a point in terms\
    \ of both local and global illumination\n\n## Reflection Models\n\n- ***Illumination\
    \ models*** used for graphics initially were often approximate models\n- Main\
    \ goal was to model the interaction of light with matter in a way that appears\
    \ ***realistic*** and is ***fast***\n- ***Reflection Models*** are the simplest\
    \ of illumination models\n- ***Reflection models*** assume\n  - ***local illumination***\
    \ only. No global illumination\n  - light is only ***reflected*** from the surface.\
    \ There is no transmission through the object\n  - there is ***no propagation\
    \ media***. Surfaces are in vacuum\n\n"
