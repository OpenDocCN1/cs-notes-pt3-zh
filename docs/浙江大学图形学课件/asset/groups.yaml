    \                //    glVertex3fv(vertices+(3*2*sizeof(GLint));\n    glArrayElement(5);\
    \          // == glColor3fv(colors+(5*3*sizeof(GLfloat));\n                  \
    \                //    glVertex3fv(vertices+(5*2*sizeof(GLint));\nglEnd();\n```\n\
    \n## Step 3: Dereferencing & Rendering\n\n- (2). Dereference a List of Array Elements\n\
    \  - `void glDrawElements(GLenum mode, GLsizei count, GLenum type, void *indices);`\n\
    \    - Defines a sequence of geometric primitives using count number of elements,\
