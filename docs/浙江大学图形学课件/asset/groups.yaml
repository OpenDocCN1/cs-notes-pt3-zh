    \  - \\( R_{(z,\\theta)} \\): Applies given rotation\n  - Apply inverses of aligning\
    \ transformations\n\n## Rotation About Arbitrary Axis\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_0.png)\n\
    \nInitial Position\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_1.png)\n\n\
    Translate P1 to Origin\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_2.png)\n\
    \nRotate about X\n\n$T$\n\n$R_x(\\alpha)$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_3.png)\n\
    \n$R_y(\\beta)$\n\nRotate about Y\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_4.png)\n\
    \n$R_z(\\theta)$\n\nRotate about Z\n\n## Transformations in OpenGL\n\n- Model-view\
    \ matrix\n- Projection matrix\n- Texture matrix\n\n## Programming Transformations\n\
    \n- In OpenGL, the transformation matrices are part of the state, they must be\
    \ defined *prior* to any vertices to which they are to apply.\n- In modeling,\
    \ we often have objects specified in their own coordinate systems and must use\
