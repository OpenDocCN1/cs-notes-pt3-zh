  md: "\n\n## Demo - Materials\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_534_0.png)\n\
    \n# THANK YOU\n\n## Texture Mapping\n\n- So far, every object has been drawn either\
    \ in a solid color, or smoothly shaded between the colors at its vertices.\n \
    \ - Similar to painting\n- Texture Mapping applies a variation to the surface\
    \ properties of the object instead\n  - Similar to surface finishing, example\
    \ like wallpaper on a wall surface or sticking a label onto a bottle.\n\n## Texture\
    \ Mapping\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_539_0.png)\n\n## Texture\
    \ Mapping\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_541_0.png)\n\n## What is\
    \ texture mapping\n\n- Texture mapping is the process of transforming a texture\
    \ on to a surface of a 3D object.\n- It is like mapping a function on to a surface\
    \ in 3D.\n  - the domain of the function could be 1D, 2D or 3D.\n  - the function\
    \ could be represented by either an array or it could be an algebraic function.\n\
    \n## Image Mapping\n\n## Environment Mapping\n\n## Bump Mapping\n\n## For what\
    \ kind of objects?\n\n- In general Texture mapping for arbitrary 3D objects is\
    \ difficult\n  - E.g. Distortion (try mapping a planer texture onto sphere)\n\
    - It is easiest for polygons and parametric surfaces\n- We limit our discussion\
    \ to Texture mapping polygons\n\n## What is a typical 2D texture?\n\n- A 2D function\
    \ represented as rectangular array of data\n  - Color data\n  - Luminance data\n\
    \  - Color and alpha data\n- Each data element in a texture is called a texel;\
    \ on screen, a texel may be mapped to\n  - A single pixel\n  - Part of a pixel\
    \ (for small polygons)\n  - Several pixels (if the texture is too small or the\
    \ polygon is viewed from very close)\n\n## Example\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_547_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_547_1.png)\n\n## Assigning Texture\
    \ Coordinates\n\n- You must provide texture coordinates for each vertex.\n- The\
    \ texture image itself covers a coordinate space between 0 and 1 in two dimensions\
    \ usually called s and t to distinguish them from the x, y and z coordinates of\
    \ 3D space.\n- A vertex’s texture coordinates determine which texel(s) are mapped\
    \ to the vertex.\n\n## Assigning Texture Coordinates\n\n- Texture coordinates\
    \ for each vertex determine a portion of the texture to use on the polygon.\n\
    - The texture subset will be stretched and squeezed to fit the dimensions of the\
    \ polygon.\n\n## Texture Interpolation\n\n- Specify where the vertices in world\
    \ space are mapped to in texture space\n- Linearly interpolate the mapping for\
    \ other points in world space\n  - Straight lines in world space go to straight\
    \ lines in texture space\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_550_0.png)\n\
    \n## Polygonal texture mapping\n\n- Establish correspondences\n- Find compound\
    \ 2D-2D mapping\n- Use this mapping during polygon scan conversion to update desired\
    \ attribute (e.g. color)\n\n## Establish Correspondences\n\n- Usually we specify\
    \ texture coordinates at each vertex\n- These texture coordinates establish the\
    \ required mapping between image and polygon\n\n## Find compound 2D-2D mapping\n\
    \n- Since the texture is finally seen on screen which is 2D, it makes sense to\
    \ combine two mappings (from image to 3D space and then from 3D to screen space)\
    \ into single 2D-2D mapping\n- This avoids texture calculations in 3D completely\n\
    - This simplifies hardware implementation of graphics pipeline.\n\n## Crude texture\
    \ mapping code\n\n```\n// for each vertex we have x,y,z and u,v\nfor (x=xleft;\
    \ x < xright; x++) {\n    if (z < zbuffer[x][y] ) {\n        z[x][y] = z;\n  \
    \      raster[x][y] = texture[u][v]; // replacing color\n    }\n    z=z+dz;\n\
    \    u=u+dv;\n    v=v+dv;\n}\n```\n\n"
