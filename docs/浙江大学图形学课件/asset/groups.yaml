  mdcn: "\n\n## Using the Vertex Arrays\n\n```c\nvoid glArrayElement( ith )\nvoid\
    \ glDrawElements(mode, count, type, *indices);\n```\n\nDefines a sequence of geometric\
    \ primitives using count number of elements, whose indices are stored in the array\
    \ indices. Type indicates the data type of the indices array. Mode specifies what\
    \ kind of primitives are constructed.\n\n```c\nvoid glDrawArrays(mode, first,\
    \ count);\n```\n\nConstructs a sequence of geometric primitives using array elements\
    \ starting at first and ending at first+count-1 of each enabled array.\n\n## Which\
    \ One is Better?\n\nDepends on the Implementation\n\n## Any Question?\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_689_0.png)\n\
    \n## Display Lists\n\n### Introduction\n\n- A display list is a group of OpenGL\
    \ commands that have been stored for later execution.\n- Most OpenGL commands\
    \ can be either stored in a display list or issued in immediate mode.\n\nFor example,\
    \ suppose you want to draw a circle with 100 line segments:\n\n```c\ndrawCircle()\
    \ {\n    GLint i;\n    GLfloat cosine, sine;\n    glBegin(GL_POLYGON);\n     \
    \   for(i=0;i<100;i++){\n            cosine=cos(i*2*PI/100.0);\n            sine=sin(i*2*PI/100.0);\n\
    \            glVertex2f(cosine,sine);\n        }\n    glEnd();\n}\n```\n\nThis\
    \ method is terribly inefficient because the trigonometry has to be performed\
    \ each time the circle is rendered. Save the coordinates in a table:\n\n```c\n\
    drawCircle()\n{\n    GLint i;\n    GLfloat cosine, sine;\n    static GLfloat circcoords[100][2];\n\
    \    static GLint inited=0;\n    if(inited==0){\n        inited=1;\n        for(i=0;i<100;i++){\n\
    \            circcoords[i][0]=cos(i*2*PI/100.0);\n            circcoords[i][1]=sin(i*2*PI/100.0);\n\
    \        }\n    }\n    glBegin(GL_POLYGON);\n    for(i=0;i<100;i++)\n        glVertex2fv(&circcoords[i][0]);\n\
    \    glEnd();\n}\n```\n\nDraw the circle once and have OpenGL remember how to\
    \ draw it for later use.\n\n```c\n#define MY_CIRCLE_LIST 1\nbuildCircle() {\n\t\
    GLint i;\n\tGLfloat cosine, sine;\n\tglNewList (MY_CIRCLE_LIST, GL_COMPILE);\n\
    \tglBegin(GL_POLYGON);\n\tfor(i=0;i<100;i++){\n\t\tcosine=cos(i*2*PI/100.0);\n\
    \t\tsine=sin(i*2*PI/100.0);\n\t\tglVertex2f(cosine,sine);\n\t}\n\tglEnd();\n\t\
    glEndList ();\n}\n```\n\nMY_CIRCLE_LIST is an integer index that uniquely identifies\
    \ this display list. You can execute the display list later with this glCallList()\
    \ command: glCallList(MY_CIRCLE_LIST);\n\n- A display list contains only OpenGL\
    \ calls.\n- The coordinates and other variables are evaluated and copied into\
    \ the display list when the list is compiled.\n- You can delete a display list\
    \ and create a new one, but you can’t edit an existing display list.\n- Display\
    \ lists reside with the server and network traffic is minimized. Matrix computations,\
    \ lighting models, textures, etc.\n- Display List disadvantages: large storage;\
    \ immutability of the contents of a display list.\n\n### Use a Display List: list.c\n\
    \nIf glLoadMatrix(M); glCallList(1); are called all the time, it is better to\
    \ store the matrix in the display list:\n\n```c\nglNewList(1, GL_COMPILE);\n glLoadMatrix(M);\
    \ draw_some_geometry();\nglEndList();\nglCallList(1);\n\nglNewList (listName,\
    \ GL_COMPILE);\nglColor3f(1.0, 0.0, 0.0);\nglBegin(GL_TRIANGLES);\nglVertex2f(0.0,0.0);glVertex2f(1.0,0.0);\
    \ glVertex2f (0.0, 1.0);\nglEnd ();\nglTranslatef (1.5, 0.0, 0.0);\nglEndList\
    \ ();\nglShadeModel (GL_FLAT);\n```\n\n```c\nvoid display(void)\n{\n    GLuint\
    \ i;\n    glClear (GL_COLOR_BUFFER_BIT);\n    glColor3f(0.0, 1.0, 0.0);\n    for\
    \ (i = 0; i < 10; i++)\n        glCallList (listName);\n    drawLine (); /* color\
    \ red; affected by the 10 translate */\n    glFlush ();\n}\n```\n\nConstants are\
    \ stored and won’t change:\n\n```c\nGLfloat color_vector[3]={0.0,0.0,0.0};\nglNewList(1,GL_COMPILE);\n\
    glColor3fv(color_vector);\nglEndList();\ncolor_vector[0]=1.0; // color will be\
    \ black if you use the display list\n```\n\nUse glPushAttrib() to save a group\
    \ of state variables and glPopAttrib() to restore:\n\n```c\nglNewList(listIndex,\
    \ GL_COMPILE);\nglPushMatrix();\nglPushAttrib(GL_CURRENT_BIT);\n    glColor3f(1.0,\
    \ 0.0, 0.0);\n    glBegin(GL_POLYGON);\n        glVertex2f(0.0,0.0);\n       \
    \ glVertex2f(1.0,0.0);\n        glVertex2f(0.0,1.0);\n    glEnd();\nglTranslatef(1.5,0.0,0.0);\n\
    glPopAttrib();\nglPopMatrix();\nglEndList();\n```\n\nThe code below would draw\
    \ a green, untranslated line:\n\n```c\nvoid display(void)\n{\n    GLint i;\n \
