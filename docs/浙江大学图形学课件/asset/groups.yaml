  - '[PAGE 185]


    # # Scane Line Methods


    +   - Makes use of the _coherence_ properties

    +     – Spatial coherence : Except at the boundary edges, adjacent pixels are
    likely to have the same characteristics

    +     – Scan line coherence : Pixels in the adjacent scan lines are likely to
    have the same characteristics

    +   - Uses intersections between area boundaries and scan lines to identify pixels
    that are inside the area'
  - '[PAGE 186]


    # # Scan Line Method


    # ## From top to down


    +   - Proceeding from left to right

    +   the intersections are paired and

    +   intervening pixels are set to the

    +   specified intensity


    +   - Algorithm

    +     - Find the intersections of the scan line with all the edges in

    +   the polygon

    +     - Sort the intersections by increasing X-coordinates

