    \ and determine the corresponding intersection point\n- Replace the outside end-point\
    \ by intersection-point\n- Repeat the above steps for the new line\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_209_0.png)\n\
    \n## Sutherland-Hodgeman Polygon-Clipping Algorithm\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_210_0.png)\n\
    \n- Polygons can be clipped against each edge of the window one edge at a time.\
    \ Window/edge intersections, if any, are easy to find since the X or Y coordinates\
    \ are already known.\n- Vertices which are kept after clipping against one window\
    \ edge are saved for clipping against the remaining edges.\n\n## Pipelined Polygon\
    \ Clipping\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_211_0.png)\n\n- Because\
    \ polygon clipping does not depend on any other polygons, it is possible to arrange\
    \ the clipping stages in a **pipeline**. the input polygon is clipped against\
    \ one edge and any points that are kept are passed on as input to the next *stage*\
    \ of the pipeline.\n- This way four polygons can be at different *stages* of the\
    \ clipping process simultaneously. This is often implemented in hardware.\n\n\
    ## Sutherland-Hodgeman Polygon Clipping Algorithm\n\n- Polygon clipping is similar\
    \ to line clipping except we have to keep track of inside/outside relationships\n\
    \  - Consider a polygon as a list of vertices\n  - Note that clipping can increase\
    \ the number of vertices!\n  - Typically clip one edge at a time…\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_212_0.png)\n\
    \n## Sutherland-Hodgeman algorithm\n\n- Present the vertices in pairs\n  - $(v_n,v_1),\
    \ (v_1,v_2), (v_2,v_3), \\ldots, (v_{n-1},v_n)$\n  - For each pair, what are the\
    \ possibilities?\n  - Consider $v_1, v_2$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_213_0.png)\n\
    \n"
