  md: "\n## Facts about adding shadows\n\n- Algorithms for shadows deal with polygonal\
    \ meshes (ray tracing is an exception).\n- Most of the shadows generated are hard\
    \ edged generated by point light sources. Shadows generated by area light sources\
    \ require special handling.\n- Adding shadows is a computational overhead and\
    \ hence is not treated as a necessity like shading algorithms.\n- For 3D animation\
    \ shadows are important for depth and movement perception.\n\n## Global Illumination\n\
    \n_Observation_: light comes from other surfaces, not just designated light sources\
    \  \n_Goal_: simulate interreflection of light in 3D scenes  \n**_Difficulty:_\
    \ you can no longer shade surfaces one at a time, since they’re now interrelated!**\n\
    \nTwo general classes of algorithms:\n\n**1. ray tracing methods**: simulate motion\
    \ of photons one by one, tracing photon paths either backwards or forwards  \n\
    **2. radiosity methods**: set up a system of linear equations whose solution is\
    \ the light distribution\n\n## Radiosity\n\ncredits: Stu Feldman & John Wallace,\
    \ 1987\n\n## Radiosity Methods\n\n- Radiosity methods provide solutions for global\
    \ diffused interactions\n- It is an object space algorithm which solves for intensity\
    \ on the surface of each and every object in the environment. It is view independent.\n\
    - The resulting intensity solution is given to a renderer which synthesises an\
    \ image for a specific view by removing hidden surfaces\n- The method is excellent\
    \ for generation of realistic images of interior environments which are collections\
    \ of non-specular objects\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_607_0.png)\n\
    \ncredits: John Wallace & Micheal Cohen, 1987\n\ncredits: Dani Lischinski & Filippo\
    \ Tampieri, 1993\n\n## Radiosity Theory\n\n- Radiosity is defined as energy per\
    \ unit area leaving a surface per second.\n- Surfaces in the environment are divided\
    \ into smaller elements called patches\n- Each patch has surface properties like\
    \ reflectivity R (positive value less than 1.0), and emissivity E, which is the\
    \ energy emitted per unit area\n- Energy leaving a patch is the sum of reflected\
    \ energy and emitted energy\n\n## Form Factor Calculation\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_611_0.png)\n\
    \n- The radiosity equation can now be written as\n\n\\( B_i A_i = E_i A_i + R_i\
    \ \\sum_{j=1}^n B_j F_{ji} A_j \\)\n\n- Form factor \\(\\mathbf{F}_{ji}\\) is\
    \ a constant and depends on the geometric relationship between the patches\n\n\
    - A reciprocity relationship gives \\(\\mathbf{F}_{ij}\\mathbf{A}_i=\\mathbf{F}_{ji}\\\
    mathbf{A}_j\\)\n\n- Substituting this relationship in the above radiosity equation\
    \ and dividing throughout by \\(\\mathbf{A}_i\\)\n\n\\( B_i = E_i + R_i \\sum_{j=1}^n\
    \ B_j F_{ij} \\)\n\n## The Radiosity Matrix\n\n$$B_i - R_i\\sum_{j=1}^{n} B_jF_{ij}=E_i$$\n\
    \nSuch an equation exists for every patch in the scene\n\n$$B_1-R_1F_{11}B_1-R_1F_{12}B_2-R_1F_{13}B_3\\\
    cdots=E_1$$\n$$B_2-R_2F_{21}B_1-R_2F_{22}B_2-R_2F_{23}B_3\\cdots=E_2$$\n$$B_3-R_3F_{31}B_1-R_3F_{32}B_2-R_3F_{33}B_3\\\
    cdots=E_3$$\n$$\\vdots$$\n$$\\vdots$$\n$$B_n-R_nF_{n1}B_1-R_nF_{n2}B_2-R_nF_{n3}B_3\\\
    cdots=E_n$$\n\n## This set simultaneous of equations can be written in matrix\
    \ form:\n\n$$\\begin{bmatrix}\n1-R_1F_{11} & -R_1F_{12} & \\cdots & -R_1F_{1n}\
    \ \\\\\n-R_2F_{21} & 1-R_2F_{22} & \\cdots & -R_2F_{2n} \\\\\n\\vdots & \\vdots\
    \ & \\ddots & \\vdots \\\\\n-R_nF_{n1} & -R_nF_{n2} & \\cdots & 1-R_nF_{nn}\n\\\
    end{bmatrix}\n\\begin{bmatrix}B_1\\\\B_2\\\\\\vdots\\\\B_n\\end{bmatrix}\n=\n\\\
    begin{bmatrix}E_1\\\\E_2\\\\\\vdots\\\\E_n\\end{bmatrix}$$\n\n$E_i$ is non-zero\
    \ only for patches of light sources  \n$R_i$ is the reflectivity of the patch\
    \  \n$F_{ij}$ is the form factor which can be calculated\n\n- The matrix equation\
    \ is solved to calculate $B_i$'s\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_615_0.png)\n\
    \ncredits: Dani Lischinski & Filippo Tampieri, 1993\n\n## Ray Tracing\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_616_0.png)\n"
