    # # NURBS surface


    # ## NURBS surface


    \( S(u,v) = \frac{\sum_{i=0}^{n} \sum_{j=0}^{m} N_{i,p}(u) N_{j,q}(v) \omega_{i,j}
    P_{i,j}}{\sum_{i=0}^{n} \sum_{j=0}^{m} N_{i,p}(u) N_{j,q}(v) \omega_{i,j}} \quad
    0 \leq u, v \leq 1 \)


    \(\omega_{ij}\): weights


    \( U = \{ \underbrace{0, \dots, 0}_{p+1}, u_{p+1}, \dots, u_{r-p-1}, \underbrace{1,
