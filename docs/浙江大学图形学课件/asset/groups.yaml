  - '[PAGE 802]


    # # B-spline---de Boor algorithm


    to calculate the point of B-spline curve _C_(_u_) at _u_:


    +   1. find the interval where _u_ lies in : \(u \in [u_j, u_{j+1})\);


    +   2. curve in \(u \in [u_j, u_{j+1})\) is only determined by \(P_{j-p}, P_{j-p+1},
    \dots, P_j\);


    +   3. calculate


    \(P_i^r(u) = \begin{cases} P_i & r=0, i=j-p; j-p+1, \cdots, j; \\ \frac{u-u_i}{u_{i+k-r}-u_i}P_i^{r-1}(u)
    + \frac{u_{i+k-r}-u}{u_{i+k-r}-u_i}P_{i-1}^{r-1}(u), & r=1,2,\cdots k-1; i=j-p+r,
    j-p+r+1, \cdots, j. \end{cases}\)


    +   4. \(P_j^{k-1}(u) = C(u)\)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_802_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_802_1.png)'
