    (for different characters.) It returns the index that marks the beginning of the
    list indices


    +   • glListBase(GLuint base); the offset added to the display list indices in
    glCallLists below; it has no effect on glCallList. It is used as an offset to
    different font types


    +   • glCallLists(GLsizei n, GLenum type, const GLvoid *lists); to call all display
    lists that draw individual characters.


    n is the # of characters to be drawn, type is GL_BYTE for the font, and lists
    is an array of character codes;'
