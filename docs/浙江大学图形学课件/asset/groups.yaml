    # # Composition...


    This is an instance of a general rule: to apply transformation A to point p, and
    the transform result by transformation B, to obtain ,say, q:


    ```

    q = (B A) p = B (A p)

    ```'
  - "[PAGE 248]\n\n# # Composite Transformation\n\n+   - Resultant of a sequence of\
    \ transformations\n+   - Composite transformation matrix is equal to the product\
    \ of the sequence of the given transformation matrices\n\n```\n```text\nQ_h =\
    \ M_n * ... * M_2 * M_1 * P_h\n   = M * P_h\n```\n```"
  - '[PAGE 249]


    # # Rotation About Point P (Math)


    Point about which to rotate \( P = \begin{bmatrix} T_x \ T_y \ 1 \end{bmatrix}
    \)


    # ## Translate to Origin


    \( M_1 = \begin{bmatrix} 1 & 0 & -T_x \ 0 & 1 & -T_y \ 0 & 0 & 1 \end{bmatrix}
    \)


    # ## Rotate


    \( M_2 = \begin{bmatrix} \cos(\theta) & -\sin(\theta) & 0 \ \sin(\theta) & \cos(\theta)
    & 0 \ 0 & 0 & 1 \end{bmatrix} \)


    # ## Translate Back


    \( M_3 = \begin{bmatrix} 1 & 0 & T_x \ 0 & 1 & T_y \ 0 & 0 & 1 \end{bmatrix} \)


    Composition Maps a Point A to new Point B. \( B := M_4 A \)


    \( M_4 = \begin{bmatrix} 1 & 0 & T_x \ 0 & 1 & T_y \ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix}
    \cos(\theta) & -\sin(\theta) & 0 \ \sin(\theta) & \cos(\theta) & 0 \ 0 & 0 & 1
    \end{bmatrix} \begin{bmatrix} 1 & 0 & -T_x \ 0 & 1 & -T_y \ 0 & 0 & 1 \end{bmatrix}
    \)


    \( M_4 = \begin{bmatrix} \cos(\theta) & -\sin(\theta) & -\cos(\theta) T_x + \sin(\theta)
    T_y + T_x \ \sin(\theta) & \cos(\theta) & -\sin(\theta) T_x - \cos(\theta) T_y
    + T_y \ 0 & 0 & 1 \end{bmatrix} \)'
  - '[PAGE 250]


    # # Scaling About Point P


    +   - Scaling also operates relative to the Origin.

    +   - To make an object bigger without moving it

    +     - Translate P to origin.

    +     - Apply scaling.

    +     - Inverse translation.


    \(M_4 = \begin{bmatrix} 1 & 0 & T_x \\ 0 & 1 & T_y \\ 0 & 0 & 1 \end{bmatrix}
    \begin{bmatrix} S_x & 0 & 0 \\ 0 & S_y & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix}
    1 & 0 & -T_x \\ 0 & 1 & -T_y \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} S_x
    & 0 & -S_x T_x + T_x \\ 0 & S_y & -S_y T_y + T_y \\ 0 & 0 & 1 \end{bmatrix}\)'
