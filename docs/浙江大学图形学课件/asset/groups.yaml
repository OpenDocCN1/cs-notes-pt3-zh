    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_528_1.png)'
  - "[PAGE 529]\n\n# # Problems with Interpolated Shading\n\n+   - Polygon silhouette\
    \ : The silhouette edge of the mesh is always a polygon  \n+     Solution :  \n\
    +     - finer subdivision for the entire surface  \n+     - finer subdivision\
    \ only along silhouette (view dependent)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_529_0.png)"
  - '[PAGE 530]


    # Problems with Interpolated Shading


    +   - Perspective distortion

    +     - Solution:

    +       - smaller polygons by finer subdivision

    +       - interpolate in world space

    +   - Orientation dependence

    +     - Solution:

    +       - decomposing polygons into triangles

    +       - rotation invariant interpolation in object space


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_530_0.png)'
  - "[PAGE 531]\n\n# Problems with Interpolated Shading\n\n+   - Problems at shared\
    \ vertices\n+     - avoid such cases\n+   \n+   - Unrepresentative vertex normals\n\
    +     - subdividing the polygons\n+       before calculating normals\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_531_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_531_1.png)"
  - '[PAGE 532]


    # Lighting in OpenGL


    # Steps of specifying lighting in OpenGL


    +   - Define normal vectors for each vertex of every object.

    +   - Create, position, and enable one or more light sources.

    +   - Select a lighting model.

    +   - Define material properties for the objects in the scene.'
  - "[PAGE 533]\n\n# # Specifying Materials in OpenGL\n\n**General form:** `glMaterialf(face,\
    \ parameter,value);`  \n`glMaterialfv(face, parameter,*array);`\n\n`face` **is**\
    \ `GL_FRONT, GL_BACK, GL_FRONT_AND_BACK`\n\n`parameter` **is:**\n\n`GL_AMBIENT`\
    \ **four values that specify the ambient RGBA reflectance of the material.** `(0.2,0.2,0.2,1.0)`\n\
    \n`GL_DIFFUSE` **four values that specify the diffuse RGBA reflectance of the\
    \ material.** `(0.8,0.8,0.8,1.0)`\n\n`GL_SPECULAR` **four values that specify\
    \ the ambient RGBA reflectance of the material.** `(0.0,0.0,0.0,1.0)`\n\n`GL_SHININESS`\
    \ **specifies the specular reflectance exponent of the material.** `0.0`"
