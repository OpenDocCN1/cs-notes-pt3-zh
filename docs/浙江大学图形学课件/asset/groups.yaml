- raw:
  - '[PAGE 511]


    # Phong Illumination model


    +   - The *specular reflection exponent* **n** controls the shine/gloss of the
    surface. The surface is more glossy as n increases and the shine becomes sharper


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_511_0.png)'
  - '[PAGE 512]


    # # Difference between illumination models


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_512_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_512_1.png)


    Diffuse Illumination Model


    Phong Illumination Model'
  - '[PAGE 513]


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_1.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_2.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_513_3.png)'
  - '[PAGE 514]


    # # Multiple Light Sources


    +   - In case of multiple light sources, the terms for each light source are summed.
    So for **_m_** light sources the illumination equation is


    \( I = I_a k_a + \sum_{1 \leq i \leq m} I_{pi}[k_d(\overline{N} \bullet \overline{L_i})
    + k_s(\overline{R_i} \bullet \overline{V})^n] \)


    +   - With summation it is possible that the value of _I_ might exceed the maximum
    displayable pixel value

    +     - it could be avoided with proper selection of material

    +     - the resulting value of _I_ could be clamped to the maximum value

    +     - divide each pixel value by the peak value of _I_'
  - '[PAGE 515]


    # # Colored objects


    +   - The color of objects is set by appropriate setting of the ambient and the
    diffused reflection coefficients


    +   - Specular coefficient is not decided by the color


    +   - There are now three intensity equations


    \(I_r = I_a k_{ar} + I_p[k_{dr}(\overline{N} \bullet \overline{L}) + k_s(\overline{R}
    \bullet \overline{V})^n]\)


    \(I_g = I_a k_{ag} + I_p[k_{dg}(\overline{N} \bullet \overline{L}) + k_s(\overline{R}
    \bullet \overline{V})^n]\)


    \(I_b = I_a k_{ab} + I_p[k_{db}(\overline{N} \bullet \overline{L}) + k_s(\overline{R}
    \bullet \overline{V})^n]\)


    +   - Summarizing these three equations as single expression


    \(I(r,g,b) = I_a k_a(r,g,b) + I_p[k_d(r,g,b)(\overline{N} \bullet \overline{L})
    + k_s(\overline{R} \bullet \overline{V})^n]\)'
  - '[PAGE 516]


    <!-- no content -->'
  - '[PAGE 517]


    # # Lights in OpenGL


    +   - Most implementations of OpenGL can have up to 8 lights in the scene

    +     - Each light can have a diffuse and a specular component

    +     - Each light can also have an ambient component (light that is reflected
    off of so many surfaces, we can’t tell where it comes from)

    +     - Lights are referred to by the macros GL_LIGHT0, GL_LIGHT1, ... , GL_LIGHT8

    +     - We set the properties of lights with calls to the function “glLightfv”
    (v stands for vector)'
  - '[PAGE 518]


    # # Lights in OpenGL


    +   - glLightfv(Light #, Property, Array of Vals)

    +     – Light # = One of GL_LIGHTi

    +     – Property, one of

    +       • GL_AMBIENT

    +       • GL_DIFFUSE

    +       • GL_SPECULAR

    +       • GL_POSITION = where is the light?

    +     – Array of values = value for the property'
  - '[PAGE 519]


    # # Shading


    +   - Shading is the process of determining the colors of all the pixels covered
    by a surface using an illumination model

    +   - Simplest method is to

    +     - determine surface visible at each pixel

    +     - compute normal of the surface

    +     - evaluate light intensity and color using an illumination model

    +   - This is quite expensive. The shading methods could be made efficient by
    customizing for specific surface representation'
  - '[PAGE 520]


    # # Shading Models


    +   - Shading Models give a technique to determine the colors of all the pixels
    covered by a surface using appropriate illumination model

    +   - Polygonal meshes are commonly used for representing complex surfaces

    +   - The geometric information is available only at the vertices of a polygon

    +   - Interpolative shading models could be used to increase the efficiency substantially'
  - '[PAGE 521]


    # Constant Shading


    +   - It is the simplest of the shading models and is also called as *faceted
    shading* or *flat shading*

    +   - One polygon receives only one intensity value

    +   - Illumination model is applied only once for each polygon

    +   - Makes the following assumptions

    +     - light source is at infinity, so \(\overline{N} \mathbin{\bullet} \overline{L}\)
    is constant across a polygon face

    +     - viewer is at infinity, so \(\overline{R} \mathbin{\bullet} \overline{V}\)
    is constant across the polygon face

    +     - polygon represents the actual surface being modeled'
