  - '[PAGE 602]


    # # Z-buffer enhanced for shadows


    +   - Second step - the scene is rendered from the actual view with an enhanced
    z-buffer algorithm

    +     - if a point (x, y, z) is visible, than the view transformation of the light
    source is applied to the point which maps it to a point (x¹, y¹, z¹)

    +     - (x¹, y¹, z¹) is a view of the point (x, y, z) seen from the source

    +     - (x¹, y¹) is used to index into the shadow z-buffer and the corresponding
    depth value is compared with z¹

    +     - if z¹ is greater than the depth value then the (x, y, z) is in a shadow'
  md: "\n\n## Nuxt 3\n\nNuxt is an open source framework making web development intuitive\
    \ and powerful.\n\nCreate dynamic and performant full-stack applications with\
    \ incredible developer experience.\n\n- **Hybrid**: Different rendering modes\
    \ per route.\n- **File-based routing**: Create routes based on your Vue components.\n\
    - **Auto-imports**: Use composables and components without importing.\n- **SEO\
    \ & a11y**: Improve your website SEO and accessibility.\n\nNuxt is a free and\
    \ open-source framework with a vibrant ecosystem. It is also a fully customizable\
    \ framework with more than 50 modules to use in your application.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_590_0.png)\n\
    \n```bash\nnpm create nuxt\n```\n\nGet started in seconds with `npm create nuxt`\
    \ — no configuration needed.\n\n> Nuxt 3 is the newest version. It's fast, reliable,\
    \ and full-featured. Try it today!\n\n- Explore official documentation\n- Join\
    \ the community\n- View source code on GitHub\n\n## Cube Mapping\n\n- The map\
    \ resides on the surfaces of a cube around the object\n  - Typically, align the\
    \ faces of the cube with the coordinate axes\n- To generate the map:\n  - For\
    \ each face of the cube, render the world from the center of the object with the\
    \ cube face as the image plane\n    - Rendering can be arbitrarily complex (it’s\
    \ off-line)\n  - Or, take 6 photos of a real environment with a camera in the\
    \ object’s position\n- Assume the cube’s faces are aligned with the coordinate\
    \ axes, and have texture coordinates in [0,1]x[0,1]. Main issue is to decide\n\
    \  - which face to use, and\n  - decide which texture coordinates to use.\n  -\
    \ Use a ray from the centre; only cube corners and edges will need special attention\n\
    \n## Bump Mapping\n\nBump Mapping assumes that the Illumination model is applied\
    \ at every pixel (as in Phong Shading or ray tracing).\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_1.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_2.png)\n\
    \nSphere w/Diffuse Texture\n\nSwirly Bump Map\n\nSphere w/Diffuse Texture & Bump\
    \ Map\n\n## Displacement Mapping\n\nWe use the texture map to actually move the\
    \ surface point. This is called _displacement mapping_. How is this fundamentally\
    \ different than bump mapping?\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_593_0.png)\n\
    \nThe geometry must be displaced before visibility is determined.\n\n## Procedural\
    \ Texture Mapping\n\n- Instead of looking up an image, pass the texture coordinates\
    \ to a function that computes the texture value on the fly\n  - Renderman, the\
    \ Pixar rendering language, does this\n  - Available in a limited form with vertex\
    \ shaders on current generation hardware\n- Advantages:\n  - Near-infinite resolution\
    \ with small storage cost\n  - Idea works for many other things\n- Has the disadvantage\
    \ of being slow in many cases\n\n## THANK YOU\n\n## Global Illumination\n\nShadows,\
    \ Radiosity, Ray-tracing\n\n## Shadows\n\n## Shadows\n\n## Shadows\n\n- Shadows\
    \ eliminate the perceptual artifacts of objects floating above the ground\n- Shadows\
    \ emphasize the changing direction of the light source\n- Shadows may be *sharp\
    \ edged* or *soft edge*, can contain both an *umbra* and a *penumbra* depending\
    \ on the shape of the light source and its distance from the light source\n- An\
    \ illuminated scene without shadows could be confusing and affects realism\n\n\
    ## Shadow Z-buffer\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_601_0.png)\n\n\
    View\n\nSource\n\nShadow buffer\n\n## Z-buffer enhanced for shadows\n\n- Second\
    \ step - the scene is rendered from the actual view with an enhanced z-buffer\
    \ algorithm\n  - if a point (x, y, z) is visible, than the view transformation\
    \ of the light source is applied to the point which maps it to a point (x¹, y¹,\
    \ z¹)\n  - (x¹, y¹, z¹) is a view of the point (x, y, z) seen from the source\n\
    \  - (x¹, y¹) is used to index into the shadow z-buffer and the corresponding\
    \ depth value is compared with z¹\n  - if z¹ is greater than the depth value then\
    \ the (x, y, z) is in a shadow\n\n"
