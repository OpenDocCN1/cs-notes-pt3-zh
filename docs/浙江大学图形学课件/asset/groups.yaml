    Get started in seconds with `npm create nuxt` — no configuration needed.


    > > Nuxt 3 is the newest version. It''s fast, reliable, and full-featured. Try
    it today!


    +   - Explore official documentation

    +   - Join the community

    +   - View source code on GitHub'
  - '[PAGE 591]


    # # Cube Mapping


    +   - The map resides on the surfaces of a cube around the object

    +     - Typically, align the faces of the cube with the coordinate axes

    +   - To generate the map:

    +     - For each face of the cube, render the world from the center of the object
    with the cube face as the image plane

    +       - Rendering can be arbitrarily complex (it’s off-line)

    +     - Or, take 6 photos of a real environment with a camera in the object’s
    position

    +   - Assume the cube’s faces are aligned with the coordinate axes, and have texture
    coordinates in [0,1]x[0,1]. Main issue is to decide

    +     - which face to use, and

    +     - decide which texture coordinates to use.

    +     - Use a ray from the centre; only cube corners and edges will need special
    attention'
  - '[PAGE 592]


    # # Bump Mapping


    Bump Mapping assumes that the Illumination model is applied at every pixel (as
    in Phong Shading or ray tracing).


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_1.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_592_2.png)


    Sphere w/Diffuse Texture


    Swirly Bump Map


    Sphere w/Diffuse Texture & Bump Map'
  - '[PAGE 593]


    # # Displacement Mapping


    We use the texture map to actually move the surface point. This is called _displacement
    mapping_. How is this fundamentally different than bump mapping?


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_593_0.png)


    The geometry must be displaced before visibility is determined.'
  - '[PAGE 594]


    # # Procedural Texture Mapping


    +   - Instead of looking up an image, pass the texture coordinates to a function
    that computes the texture value on the fly

    +     - Renderman, the Pixar rendering language, does this

    +     - Available in a limited form with vertex shaders on current generation
    hardware

    +   - Advantages:

    +     - Near-infinite resolution with small storage cost

    +     - Idea works for many other things

    +   - Has the disadvantage of being slow in many cases'
