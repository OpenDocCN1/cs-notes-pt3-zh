  - '[PAGE 500]


    # Reflection Models


    +   - ***Illumination models*** used for graphics initially were often approximate
    models

    +   - Main goal was to model the interaction of light with matter in a way that
    appears ***realistic*** and is ***fast***

    +   - ***Reflection Models*** are the simplest of illumination models

    +   - ***Reflection models*** assume

    +     - ***local illumination*** only. No global illumination

    +     - light is only ***reflected*** from the surface. There is no transmission
    through the object

    +     - there is ***no propagation media***. Surfaces are in vacuum'
