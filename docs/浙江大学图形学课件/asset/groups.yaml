  md: "\n## OpenGL Texture mapping (Ref: Red book)\n\n- Create texture objects\n \
    \ - 1D, 2D, 3D\n  - Specify what does texture contain: say, color, depth, etc.\n\
    - Specify how the texture is applied\n  - Replace, modulate, or blend\n- Enable\
    \ texture mapping\n- Specify scene with both geometric coordinates as well as\
    \ texture coordinates\n\n## Specify Texture\n\n- glTexImage2D(target, level, internalformat,\
    \ width, height, border, format, type, *texels);\n- E.g.:\n  - target: GL_TEXTURE_2D\n\
    \  - Level : 0 (for no mip maps)\n  - Internalformat: GL_RGB\n  - Width,height:\
    \ 2^m+2*b, 256 by 256 with b=0\n  - Border b: 0\n  - Format: GL_RGB\n  - Type:\
    \ GL_INT\n  - texels: actual texture image\n\n## Specifying mipmaps\n\n- You need\
    \ to specify the levels for which mipmapping is being used.\n- You can also specify\
    \ scale factor (between the texture image and size of polygon).\n- You also need\
    \ to supply images for all levels.\n- You use glTexParameteri() and glTexImage2D()\n\
    \  - `glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_BASE_LEVEL, 2);`\n  - `glTexImage2D(...,2,...);`\n\
    \n## Automatic mipmap generation\n\n- If you have highest resolution image, OpenGL\
    \ can generate low level prefiltered images automatically.\n- gluBuild2DMipmaps()\n\
    - gluBuild2DMipmapsLevels()\n  - To build only a subset\n- See book for detailed\
    \ description of parameters\n\n## OpenGL filtering\n\n- We can specify the kind\
    \ of filter to be applied\n- OpenGL filtering is crude but fast\n- Specify filter\
    \ using glParameteri() with\n  GL_TEXTURE_MAG_FILTER and GL_TEXTURE_MIN_FILTER\n\
    - E.g. filters : GL_NEAREST, GL_LINEAR,\n  GL_NEAREST_MIPMAP_LINEAR (for minification)\n\
    - E.g.\n  glParameteri(GL_TEXTURE_2D,GL_TEXTURE_MAG_FILTER,GL_NEAREST);\n\n##\
    \ Other calls\n\n- glGenTextures();\n  - To generate unique names\n- glBindTexture();\n\
    \  - Creates if texture object not already created\n  - Activates the texture\
    \ object if already created\n  - Pass 0 to stop using texture objects\n- glEnable(GL_TEXTURE_2D);\n\
    \  - Enables texture mapping\n- glTexCoord2i(texcoordinate);\n\n## Tricks with\
    \ Textures\n\n- If the texture is not large enough to cover a polygon, you can\
    \ tile it using the GL_REPEAT parameter\n  - glTexParameteri( GL_TEXTURE_2D, GL_TEXTURE_WRAP_S,\
    \ GL_REPEAT );\n- You can also clamp the texture (i.e., stretch the last pixel\
    \ to cover everything)\n\n## Boundaries\n\n- You can control what happens if a\
    \ point maps to a texture coordinate outside of the texture image\n  – All textures\
    \ are assumed to go from (0,0) to (1,1) in texture space\n- Repeat: Assume the\
    \ texture is tiled\n  – glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_REPEAT)\n\
    - Clamp: Clamp to Edge: the texture coordinates are truncated to valid values,\
    \ and then used\n  – glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP)\n\
    - Can specify a special border color:\n  – glTexParameterfv(GL_TEXTURE_2D, GL_TEXTURE_BORDER_COLOR,\
    \ R,G,B,A)\n\n## Repeat Border\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_583_0.png)\n\
    \n## Clamp Border\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_584_0.png)\n\n##\
    \ Border Color\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_585_0.png)\n\n## Yet\
    \ More Texture Stuff\n\n- There is a 4x4 texture matrix: apply a matrix transformation\
    \ to texture coordinates before indexing texture\n- There are “image processing”\
    \ operations that can be applied to the pixels coming out of the texture\n\n##\
    \ Environment Mapping\n\n- Environment mapping produces reflections on shiny objects\n\
    - Texture is transferred in the direction of the reflected ray from the environment\
    \ map onto the object\n- Reflected ray: $R=2(N\\cdot V)N-V$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_588_0.png)\n"
