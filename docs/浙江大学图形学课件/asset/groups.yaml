  - '[PAGE 798]


    # # NURBS curve


    # ## B-spline curve:


    \( C(u) = \sum_{i=0}^n P_i N_{i,p}(u) \quad a \leq u \leq b \)


    Where \( P_0, P_1, \dots, P_n \) are control points, \( \mathbf{u} = [u_0=a, u_1,
    \dots, u_i, \dots, u_{n+k+1}=b] \).


    \( N_{i,0}(u) = \begin{cases} 1 & u_i \leq u < u_{i+1} \\ 0 & \text{otherwise}
    \end{cases} \)


    \( N_{i,p}(u) = \frac{u - u_i}{u_{i+p} - u_i} N_{i,p-1}(u) + \frac{u_{i+p+1} -
    u}{u_{i+p+1} - u_{i+1}} N_{i+1,p-1}(u) \)


    \( \frac{0}{0} = 0 \)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_798_0.png)'
  - '[PAGE 799]


    # # NURBS curve


    \( C(u) = \sum_{i=0}^n P_i N_{i,p}(u) \quad a \leq u \leq b \)


    # ## B-spline basis:


    \( U = \{ u_i \}_{i=-\infty}^\infty \)


    \( N_{i,0}(u) = \begin{cases} 1 & u_i \leq u < u_{i+1} \\ 0 & \text{else} \end{cases}
    \)


    \( N_{i,p}(u) = \frac{u - u_i}{u_{i+p} - u_i} N_{i,p-1}(u) + \frac{u_{i+p+1} -
    u}{u_{i+p+1} - u_{i+1}} N_{i+1,p-1}(u), \)


    \( \frac{0}{0} = 0 \)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_799_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_799_1.png)'
  - '[PAGE 800]


    # # NURBS curve


    # ## properties of B-spline basis


    +   1. localization: \( N_{i,p}(u) > 0 \) only when \( u \in [u_i, u_{i+p+1}]
    \) .


    +   \( N_{i,p}(u) = \begin{cases} > 0, & u_i \leq u < u_{i+p+1} \\ = 0, & u <
    u_i \text{ 或 } u > u_{i+p+1} \end{cases} \)


    +   2. 规范性:


    +   \( \sum_{j=-\infty}^{\infty} N_{j,p}(u) = \sum_{j=i-p}^{i} N_{j,p}(u) = 1,
    u \in [u_i, u_{i+1}] \)


    +   3. piecewise polynomial: \( N_{i,p}(u) \) is a polynomial with degree < p,
    in every \( [u_j, u_{j+1}] \)


    +   4. differential:


    +   \( N''_{i,p}(u) = \frac{p}{u_{i+p} - u_i} N_{i,p-1}(u) - \frac{p}{u_{i+p+1}
    - u_{i+1}} N_{i+1,p-1}(u) \)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_800_0.png)'
