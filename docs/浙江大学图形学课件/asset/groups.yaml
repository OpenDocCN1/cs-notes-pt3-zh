  - '[PAGE 420]


    # # Physics of Light


    +   - *Light* is a dynamic phenomenon which is difficult to observe

    +   - Research is still on in trying to model the behavior of light

    +   - Currently there are two models proposed by physicists to explain the behavior
    of light

    +     - *Wave Model*, which treats light as water waves

    +     - *Particle Model*, which assumes that light is made of tiny, invisible,
    vibrating particles called **photons**

    +   - From *color* point of view the **particle model** is used'
  - '[PAGE 421]


    <!-- no content -->'
  - '[PAGE 422]


    # Properties of Light


    +   - Distance traveled by the photon from the beginning of one cycle to the beginning
    of next is known as the wavelength, given by

    +     $$\lambda = \frac{c}{f}$$

    +     where, c is the speed of light and f is the frequency

    +   - Each photon has a wavelength associated with it and the perceived color
    of light depends on this wavelength

    +   - The intensity of light depends on the number of photons present'
  - '[PAGE 423]


    # # Spectrum(光谱) of Electomagnetic Radiation


    +   - Light is a continuous electromagnetic spectrum, which can be geometrically
    represented by a 2D graph between wavelength v/s number of particles for each
    wavelength


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_423_0.png)'
  - '[PAGE 424]


    # # Spectral Energy Distribution Curve


    +   - This is called the spectral energy distribution curve, and each photon set
    with a single wavelength is referred to as spectral component of light

    +   - Human eye is sensitive to a small subset of wavelengths within the range
    330-770nm

    +   - Relationship between spectral energy distribution curve and perceived color
    is many-to-one


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_424_0.png)'
  - '[PAGE 425]


    # # Spectral Energy Distribution Curve


    +   - Spectral energy distribution curve of a light which resulted by adding two
    light sources is the sum of the spectral energy distribution curves of individual
    lights that are being added

    +   - Light consisting of equal number of photons for each wavelength in the visible
    range is known as **_Achromatic_** light. Appears gray


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_425_0.png)'
  - '[PAGE 426]


    # # Spectral Energy Distribution Curve


    +   - Light with photons of only one wavelength is called **Monochromatic** light.
    In reality monochromatic light seldom exists


    +   - Light with different number of photons for different wavelengths is known
    as **Chromatic** light


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_426_0.png)'
  - '[PAGE 427]


    # Describing Color


    +   - *Perceived* color can be characterized by the physical properties of light

    +     - Dominant wavelength, which selects a particular color from the spectrum

    +     - Purity, measure of wavelength range within which the photons are distributed.
    Purer lights have its photons distributed in a narrow bandwidth of wavelengths

    +     - Luminance/Intensity, is the number of photons present

    +   - Perceptual counter-parts are *Hue, Saturation* and *Lightness/Brightness*
    （色调，饱和度，亮度）'
  - '[PAGE 428]


    # # Describing Color


    +   - Hue, is the perceptual property which distinguishes between color and relates
    to the dominant wavelength

    +   - Saturation, specifies how far is a color from gray and corresponds to the
    purity of light.

    +     e.g. Pure red is highly saturated and pink is less saturated

    +   - Lightness is the measure of perceived intensity. It does not specify any
    color information and quantifies the achromatic notion of intensity

    +   - Only hue and saturation quantify the color information'
  - '[PAGE 429]


    # Color Models


    +   - Color model is a geometric representation of the space of all colors such
    that any color is a point in that space

    +   - Traditionally color models for computer graphics were designed for specific
    devices

    +   - They could be classified based on

    +     - Hardware color generation i.e. **RGB** for displays, **CMY** for printers,
    **YIQ** for television transmission

    +     - Color perception i.e. **HSV** for interactive color specification.'
  - '[PAGE 430]


    <!-- no content -->'
  - '[PAGE 431]


    # CMY Color Model


    +   - Standard for ink-jet and xerographic printers

    +   - Primaries are *Cyan, Magenta* and *Yellow* (青、品红、黄)

    +   - Known as **Subtractive Model**, because the colors act as filter to subtract
    color from white light

    +   - $C = 1-R$, $M = 1-G$ and $Y = 1-B$


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_431_0.png)'
