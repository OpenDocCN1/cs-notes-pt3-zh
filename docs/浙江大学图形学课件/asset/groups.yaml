    \ |\\mathbf{PV}_{i+1}|} \\right)\\)\n\nQuestion6: How to improve ...?\n\n## Scan\
    \ Line Methods\n\n- Makes use of the _coherence_ properties\n  - Spatial coherence:\
    \ Except at the boundary edges, adjacent pixels are likely to have the same characteristics\n\
    \  - Scan line coherence: Pixels in the adjacent scan lines are likely to have\
    \ the same characteristics\n- Uses intersections between area boundaries and scan\
    \ lines to identify pixels that are inside the area\n\n## Scan Line Method\n\n\
