  - '[PAGE 196]


    <!-- no content -->'
  - '[PAGE 197]


    # # Area Sampling


    +   - A scan converted primitive occupies finite area on the screen

    +   - Intensity of the boundary pixels is adjusted depending on the percent of
    the pixel area covered by the primitive. This is called weighted area sampling


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_197_0.png)'
  - '[PAGE 198]


    # # Area Sampling


    +   - Methods to estimate percent of pixel covered by the primitive

    +     - subdivide pixel into sub-pixels and determine how many sub-pixels are
    inside the boundary

    +     - Incremental line algorithm can be extended, with area calculated as


    $$Area = m \cdot x - y + c + 0.5$$


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_198_0.png)'
  - '[PAGE 199]


    <!-- no content -->'
  - '[PAGE 200]


    # # Clipping


    +   - Why Clipping?

    +   - How Clipping?

    +     - Lines

    +     - Polygons

    +   - Note: Content from chapter 4.

    +     - Lots of stuff about rendering systems and mathematics in that chapter.'
  - '[PAGE 201]


    # # Definition


    +   - Clipping – Removal of content that is not going to be displayed

    +     - Behind camera

    +     - Too close

    +     - Too far

    +     - Off sides of the screen


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_201_0.png)'
  - '[PAGE 202]


    # How would we clip?


    +   - Points?

    +   - Lines?

    +   - Polygons?

    +   - Other objects?'
  - '[PAGE 203]


    # # We''ll start in 2D


    +   - Assume a 2D upright rectangle we are clipping against

    +     - Common in windowing systems

    +     - Points are trivial

    +       - >= minx and <= maxx and >= miny and <= maxy


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_203_0.png)'
  - '[PAGE 204]


    # # Line Segments


    +   - What can happen when a line segment is clipped?


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_204_0.png)'
  - '[PAGE 205]


    # Cohen-Sutherland Line Clipping


    +   - We’ll assign the ends of a line “outcodes”, 4 bit values that indicate if
    they are inside or outside the clip area.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_205_0.png)'
  - '[PAGE 206]


    <!-- no content -->'
  - '[PAGE 207]


    <!-- no content -->'
  - '[PAGE 208]


    # # Last case...


    – else if (o1 & o2) = 0, end points are on different sides.


    +   - Clip and recompute.

    +   - May have some inside part or may not...

    +   - May require up to 4 clips!


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_208_0.png)'
  - '[PAGE 209]


    # # Cohen-Sutherland Line-Clipping Algorithm


    +   - To do the clipping find the end point that lies outside

    +   - Test the outcode to find the edge that is crossed and determine the corresponding
    intersection point

    +   - Replace the outside end-point by intersection-point

    +   - Repeat the above steps for the new line


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_209_0.png)'
  - '[PAGE 210]


    # # Sutherland-Hodgeman Polygon-Clipping Algorithm


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_210_0.png)


    +   - Polygons can be clipped against each edge of the window one edge at a time.
    Window/edge intersections, if any, are easy to find since the X or Y coordinates
    are already known.

    +   - Vertices which are kept after clipping against one window edge are saved
    for clipping against the remaining edges.'
  - '[PAGE 211]


    # Pipelined Polygon Clipping


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_211_0.png)


    +   - Because polygon clipping does not depend on any other polygons, it is possible
    to arrange the clipping stages in a **pipeline**. the input polygon is clipped
    against one edge and any points that are kept are passed on as input to the next
    *stage* of the pipeline.

    +   - This way four polygons can be at different *stages* of the clipping process
    simultaneously. This is often implemented in hardware.'
  - '[PAGE 212]


    # Sutherland-Hodgeman Polygon Clipping Algorithm


    +   - Polygon clipping is similar to line clipping except we have to keep track
    of inside/outside relationships

    +     - Consider a polygon as a list of vertices

    +     - Note that clipping can increase the number of vertices!

    +     - Typically clip one edge at a time…


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_212_0.png)'
  - '[PAGE 213]


    # Sutherland-Hodgeman algorithm


    +   - Present the vertices in pairs

    +     - $(v_n,v_1), (v_1,v_2), (v_2,v_3), \ldots, (v_{n-1},v_n)$

    +     - For each pair, what are the possibilities?

    +     - Consider $v_1, v_2$


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_213_0.png)'
