    \ C'(0)=n(P_1-P_0),\\quad C'(1)=n(P_n-P_{n-1}).$$\n\n+   3. **Symmetry:** Let\
    \ two Bezier curves be generated by ordered Bezier (control) points labelled by\
    \ {p0,p1,...,pn} and {pn, pn−1,..., p0} respectively, then the curves corresponding\
    \ to the two different orderings of control points look the same; they differ\
