  - '[PAGE 747]


    # # Brep: Boundary Representation


    +   - Represent the object in terms of its surface boundaries, vertices, edges
    and faces.

    +   - Some of the systems support only planar faces and curves surfaces are often
    approximated by planar polygons.

    +   - Boundaries should be “2-manifold”.

    +     Every point has some arbitrary small neighborhood of points around it that
    can be considered topologically same as a disk on a plane.

    +   - Well suited for direct manipulations.

    +   - Advanced operations like boolean operations are plagued by numerical problems,
    leading to undependable results.'
