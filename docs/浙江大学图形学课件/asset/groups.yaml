  md: "\n\n## Modelling vs Viewing\n\n- **Viewing transformations** are not same as\
    \ **modelling transformations**\n- *Modeling transformations* actually position\
    \ the objects in the world, but *viewing transformations* are applied only to\
    \ make a mapping from world to the screen\n- *Viewing transformations* do not\
    \ change the actual world in any fashion\n\n## Modelling Coordinates\n\nObjects\
    \ are usually defined in their own local coordinate system (instance transformation).\n\
    \nPlace (transform) these objects in a single scene, in world coordinates (modelling\
    \ transformation).\n\n## Screen Coordinates\n\nFinally, we want to project these\
    \ objects onto the screen.\n\n## Transformations and Camera Analogy\n\n- **Modeling\
    \ transformation**\n  - Shaping, positioning and moving the objects in the world\
    \ scene.\n- **Viewing transformation**\n  - Positioning and pointing camera onto\
    \ the scene, selecting the region of interest.\n- **Projection transformation**\n\
    \  - Adjusting the distance of the eye\n- **Viewport transformation**\n  - Enlarging\
    \ or reducing the physical photograph.\n\n## Classical Viewing: Perspective Projection\n\
    \nPRP: Projection Reference Point = Eye position\nFigures extracted from Angle's\
    \ textbook\n\nPRP\n\n## Perspective Projection\n\n- Characterized by diminution\
    \ of size\n- The farther the object, the smaller the image\n- Foreshortening depends\
    \ on distance from viewer\n- Can’t be used for measurements\n\n## Engineering\
    \ Viewing: Parallel Projection\n\nDOP: Direction of Projection = Eye position\
    \ at infinity\nFigures extracted from Angle's textbook\n\n19\n\n## Orthographic\
    \ Projection\n\nDOP is perpendicular to the view plane\n\nFigures extracted from\
    \ Angle's textbook\n\n## View Specification\n\n### Specify\n\nFocus point or reference\
    \ point, typically on the object (view reference point)\ndirection of viewing\
    \ (viewDirection)\npicture's up-direction (upVector)\n\nAll the specifications\
    \ are in **world coordinates**\n\n## View Reference Coordinate System\n\nWorld\
    \ coordinates\n\n\\vec{n} = -viewDirection\n\n\\vec{u} = upVector \\times \\vec{n}\n\
    \n\\vec{v} = \\vec{n} \\times \\vec{u}\n\nView Reference Plane (view plane normal)\n\
    \n## View Up Vector\n\n- **upVector** decides the orientation of the *view window*\
    \ on the *view reference plane*\n\nOnce the view reference coordinate system is\
    \ defined, the next step is to project the 3D world on to the view reference plane\n\
    \n## Simplest Camera position\n\n- Projecting on to an arbitrary view plane looks\
    \ tedious\n- One of the simplest camera positions is one where *vrp* coincides\
    \ with the *world origin* and *u, v, n* matches *x, y, z*\n- Projection could\
    \ be as simple as ignoring the z-coordinate\n\n## World to Viewing coordinate\
    \ Transformation\n\n- The world could be transformed so that the **_view reference\
    \ coordinate system_** coincides with the **_world coordinate system_**\n- Such\
    \ a transformation is called **_world to viewing coordinate transformation_**\n\
    - The transformation matrix is also called **_view orientation matrix_**\n\n##\
    \ Deriving View Orientation Matrix\n\nThe **view orientation matrix** transforms\
    \ a point from **world coordinates** to **view coordinates**\n\nWhy?\n\n27\n\n"
