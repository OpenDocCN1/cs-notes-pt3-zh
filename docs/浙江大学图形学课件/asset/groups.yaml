    \   GLdouble m[4][4];\n    double sine, cotangent, deltaZ;\n    double radians\
    \ = fovy / 2 * __glPi /\n        180;\n\n    deltaZ = zFar - zNear;\n    sine\
    \ = sin(radians);\n    if ((deltaZ == 0) || (sine == 0) ||\n        (aspect ==\
    \ 0)) {\n        return;\n    }\n    cotangent = cos(radians) / sine;\n\n    __gluMakeIdentity(&m[0][0]);\n\
    \    m[0][0] = cotangent / aspect;\n    m[1][1] = cotangent;\n    m[2][2] = -(zFar\
    \ + zNear) / deltaZ;\n    m[2][3] = -1;\n    m[3][2] = -2 * zNear * zFar / deltaZ;\n\
    \    m[3][3] = 0;\n    glMultMatrixd(&m[0][0]);\n}\n```\n```"
