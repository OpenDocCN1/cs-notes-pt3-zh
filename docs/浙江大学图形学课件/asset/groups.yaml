  - '[PAGE 417]


    # # Color'
  - '[PAGE 418]


    # # Why study Color ?


    +   - *Synthesis of realistic images* has been the primary goal of computer graphics

    +   - In this quest for *realism* it is necessary to relate the perceptual processing
    of visual information to the image display technology

    +   - Understanding *color perception* and its relationship to both *color computation*
    and *color reproduction* becomes important'
  - '[PAGE 419]


    # What is color ?


    +   - **Color** is the brain’s reaction to a specific visual stimulus

    +   - Subjective sensation experienced by the observer. There is no such thing
    called color without an observer

    +   - Depends upon

    +     - Physics of light

    +     - Interaction of light with physical materials

    +     - Interpretation of the resulting phenomenon by the human visual system
    and the human brain'
