    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_416_1.png)\n\n## Color\n\n## Why study\
    \ Color ?\n\n- *Synthesis of realistic images* has been the primary goal of computer\
    \ graphics  \n- In this quest for *realism* it is necessary to relate the perceptual\
    \ processing of visual information to the image display technology  \n- Understanding\
    \ *color perception* and its relationship to both *color computation* and *color\
