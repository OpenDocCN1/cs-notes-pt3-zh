    +   \n+     A polygonal face with outward surface normal \\(N_f\\) is a back-face\
    \ if \\(N_f \\cdot D_p > 0\\)\n+   \n+     where \\(D_p\\) is the direction of\
    \ projection\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_461_0.png)\n\nWhat happens\
