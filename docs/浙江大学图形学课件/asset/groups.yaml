    \n- Using a stride of other than zero can be useful, especially when dealing with\
    \ interleaved arrays.\n- Ex: 6 vertices, RGB followed by XYZ\n\n```c\nstatic GLfloat\
    \ intertwined[] = {\n    1.0, 0.2, 1.0, 100.0, 100.0, 0.0,\n    1.0, 0.2, 0.2,\
