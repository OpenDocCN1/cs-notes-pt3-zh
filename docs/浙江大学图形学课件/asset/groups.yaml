  md: '


    ## Primitive Euler Operators


    - Make an edge and a vertex (MEV)

    - Make a face and an edge (MEF)

    - Make a Solid, a face, and a vertex (MFVS)

    - Make a cavity or passage and a body (KFMRH)

    - Make an edge and kill a Ring (MEKR)


    Each of these five operators has a corresponding complementary operator.


    M(make) K(kill) V(vertex) E(edge) F(face) S(solid)

    H(hole) R(ring)


    ## Comparison of the representation schemes


    - **Accuracy:** Spatial partitioning and polygonal BREP are approximate representations,
    where as primitive instancing, CSG, & BREPs with curved surfaces are more accurate.

    - **Domain:** Limited for sweep representation and primitive instancing. Spatial
    partitioning schemes can represent any solid.

    - **Uniqueness:** Only Octree and spatial enumeration techniques guarantee uniqueness.
    If the primitives are carefully chosen primitive instancing can guarantee uniqueness.

    - **Validity:** B-REPs are difficult to validate. No checking is needed for spatial
    occupancy enumeration and local checking for CSG and Octrees.

    - **Closure:** Primitive instancing and sweeps are not closed under boolean operations.
    BREPs are, in general, closed.


    ## Fractal


    1. Helge Von Koch

    2. Mandelbrot

    3. fractal dimension


    D = (log N)/log(1/S)


    N: the number of sub-shape,

    S: scale


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_763_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_763_1.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_763_2.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_764_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_764_1.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_765_0.png)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_765_1.png)


    ## Particle Systems


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_766_0.png)


    Particle systems offer a solution to modelling amorphous, dynamic and fluid objects
    like clouds, smoke, water, explosions and fire.


    ## Representing Objects with Particles


    - An object is represented as clouds of primitive particles that define its volume
    rather than by polygons or patches that define its boundary.

    - A particle system is dynamic, particles changing form and moving with the passage
    of time.

    - Object is not deterministic, its shape and form are not completely specified.
    Instead


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_767_0.png)


    ## Basic Model of Particle Systems


    1) New particles are generated into the system.

    2) Each new particle is assigned its individual attributes.

    3) Any particles that have existed past their prescribed lifetime are extinguished.

    4) The remaining particles are moved and transformed according to their dynamic
    attributes.

    5) An image of the particles is rendered in the frame buffer, often using special
    purpose algorithms.


    ## Attributes of a Particle


    - Position

    - Velocity

    - Life Span

    - Size

    - Weight

    - Representation

    - Color

    - Owner


    ## Basic Particle System

    Physics


    - Particle is a point in 3D space.

    - Forces (e.g. gravity or wind) accelerate a particle.

    - Acceleration changes velocity.

    - Velocity changes position


