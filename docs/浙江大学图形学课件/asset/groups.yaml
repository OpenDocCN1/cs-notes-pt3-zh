    \ 1.5 * (GLfloat)w / (GLfloat)h, -1.5, 1.5);\n\n    glMatrixMode(GL_MODELVIEW);\
    \ // 指明当前矩阵为 GL_MODELVIEW\n}\n```\n\n## 2D Rendering-2\n\n```c\nvoid myDisplay(void)\n\
    {\n    glClear(GL_COLOR_BUFFER_BIT); // buffer 设置为颜色可写\n\n    glBegin(GL_TRIANGLES);\
