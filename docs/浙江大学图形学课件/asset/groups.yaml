    \ + \\frac{u_{i+p+1} - u}{u_{i+p+1} - u_{i+1}} N_{i+1,p-1}(u) \\)\n\n\\( \\frac{0}{0}\
    \ = 0 \\)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_798_0.png)\n\n### B-spline\
    \ basis:\n\n\\( U = \\{ u_i \\}_{i=-\\infty}^\\infty \\)\n\n\\( N_{i,0}(u) = \\\
    begin{cases} 1 & u_i \\leq u < u_{i+1} \\\\ 0 & \\text{else} \\end{cases} \\)\n\
    \n\\( N_{i,p}(u) = \\frac{u - u_i}{u_{i+p} - u_i} N_{i,p-1}(u) + \\frac{u_{i+p+1}\
    \ - u}{u_{i+p+1} - u_{i+1}} N_{i+1,p-1}(u), \\)\n\n\\( \\frac{0}{0} = 0 \\)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_799_0.png)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_799_1.png)\n\
    \n### properties of B-spline basis\n\n- 1. localization: \\( N_{i,p}(u) > 0 \\\
    ) only when \\( u \\in [u_i, u_{i+p+1}] \\) .\n\n- \\( N_{i,p}(u) = \\begin{cases}\
    \ > 0, & u_i \\leq u < u_{i+p+1} \\\\ = 0, & u < u_i \\text{ 或 } u > u_{i+p+1}\
    \ \\end{cases} \\)\n\n- 2. 规范性:\n\n- \\( \\sum_{j=-\\infty}^{\\infty} N_{j,p}(u)\
    \ = \\sum_{j=i-p}^{i} N_{j,p}(u) = 1, u \\in [u_i, u_{i+1}] \\)\n\n- 3. piecewise\
    \ polynomial: \\( N_{i,p}(u) \\) is a polynomial with degree < p, in every \\\
    ( [u_j, u_{j+1}] \\)\n\n- 4. differential:\n\n- \\( N'_{i,p}(u) = \\frac{p}{u_{i+p}\
    \ - u_i} N_{i,p-1}(u) - \\frac{p}{u_{i+p+1} - u_{i+1}} N_{i+1,p-1}(u) \\)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_800_0.png)\n\n## B-spline---de Boor algorithm\n\
    \nto calculate the point of B-spline curve _C_(_u_) at _u_:\n\n- 1. find the interval\
    \ where _u_ lies in : \\(u \\in [u_j, u_{j+1})\\);\n\n- 2. curve in \\(u \\in\
    \ [u_j, u_{j+1})\\) is only determined by \\(P_{j-p}, P_{j-p+1}, \\dots, P_j\\\
    );\n\n- 3. calculate\n\n\\(P_i^r(u) = \\begin{cases} P_i & r=0, i=j-p; j-p+1,\
    \ \\cdots, j; \\\\ \\frac{u-u_i}{u_{i+k-r}-u_i}P_i^{r-1}(u) + \\frac{u_{i+k-r}-u}{u_{i+k-r}-u_i}P_{i-1}^{r-1}(u),\
    \ & r=1,2,\\cdots k-1; i=j-p+r, j-p+r+1, \\cdots, j. \\end{cases}\\)\n\n- 4. \\\
    (P_j^{k-1}(u) = C(u)\\)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_802_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_802_1.png)\n\n## NURBS surface\n\n\
    ### B-spline surface\n\n(n+1) × (m+1) control points: $P_{i,j}$  \ndegrees of\
    \ $u$, $v$: $p$, $q$;  \nNodes: $U=[u_0,u_1,\\ldots,u_{n+p+1}]$, $V=[v_0,v_1,\\\
    ldots,v_{m+q+1}]$, Then a tensor B-spline surface with degree $p\\times q$:\n\n\
    $$S(u,v)=\\sum_{i=0}^{n}\\sum_{j=0}^{m}N_{i,p}(u)N_{j,q}(v)P_{i,j}$$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_803_0.png)\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_803_1.png)\n\n### NURBS surface\n\n\
    \\( S(u,v) = \\frac{\\sum_{i=0}^{n} \\sum_{j=0}^{m} N_{i,p}(u) N_{j,q}(v) \\omega_{i,j}\
    \ P_{i,j}}{\\sum_{i=0}^{n} \\sum_{j=0}^{m} N_{i,p}(u) N_{j,q}(v) \\omega_{i,j}}\
    \ \\quad 0 \\leq u, v \\leq 1 \\)\n\n\\(\\omega_{ij}\\): weights\n\n\\( U = \\\
    { \\underbrace{0, \\dots, 0}_{p+1}, u_{p+1}, \\dots, u_{r-p-1}, \\underbrace{1,\
    \ \\dots, 1}_{p+1} \\} \\)\n\n\\( V = \\{ \\underbrace{0, \\dots, 0}_{q+1}, v_{q+1},\
    \ \\dots, v_{s-q-1}, \\underbrace{1, \\dots, 1}_{q+1} \\} \\)\n\n## subdivision\
    \ surface\n\n### subdivision curves:\n\n- starting from a set of points, generate\
    \ new points in every step under some rules, when such step goes on infinitely,\
    \ the points will be convergent to a smooth curve.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_806_0.png)\n\
    \n## subdivision surface\n\n## Catmull-Clerk and Doo-Sabin subdivision\n\nstart\
    \ from\n\n\\(P^i = \\left(\\cdots, p_{-1}^i, p_0^i, p_1^i, p_2^i, \\cdots\\right)\\\
    )\n\n### Catmull-Clerk rules\n\n\\(p_{2j}^{i+1} = \\frac{1}{8}p_{j-1}^i + \\frac{6}{8}p_j^i\
    \ + \\frac{1}{8}p_{j+1}^i\\)\n\\(p_{2j+1}^{i+1} = \\frac{4}{8}p_j^i + \\frac{4}{8}p_{j+1}^i\\\
    )\n\n### Doo-Sabin rules:\n\n\\(p_{2j}^{i+1} = \\frac{3}{4}p_j^i + \\frac{1}{4}p_{j+1}^i\\\
    )\n\\(p_{2j+1}^{i+1} = \\frac{1}{4}p_j^i + \\frac{3}{4}p_{j+1}^i\\)\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_808_0.png)\n\
    \nFigure 3: Subdividing an initial set of control points (upper, red) results\
    \ in additional control points (lower, black), that more closely approximate a\
    \ curve.\n\n"
