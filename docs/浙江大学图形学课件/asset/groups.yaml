  mdcn: "\n\n## Composition...\n\nThis is an instance of a general rule: to apply\
    \ transformation A to point p, and the transform result by transformation B, to\
    \ obtain ,say, q:\n\n```\nq = (B A) p = B (A p)\n```\n\n## Composite Transformation\n\
    \n- Resultant of a sequence of transformations\n- Composite transformation matrix\
    \ is equal to the product of the sequence of the given transformation matrices\n\
    \n```\n```text\nQ_h = M_n * ... * M_2 * M_1 * P_h\n   = M * P_h\n```\n```\n\n\
    ## Rotation About Point P (Math)\n\nPoint about which to rotate \\( P = \\begin{bmatrix}\
    \ T_x \\ T_y \\ 1 \\end{bmatrix} \\)\n\n### Translate to Origin\n\n\\( M_1 = \\\
    begin{bmatrix} 1 & 0 & -T_x \\ 0 & 1 & -T_y \\ 0 & 0 & 1 \\end{bmatrix} \\)\n\n\
    ### Rotate\n\n\\( M_2 = \\begin{bmatrix} \\cos(\\theta) & -\\sin(\\theta) & 0\
    \ \\ \\sin(\\theta) & \\cos(\\theta) & 0 \\ 0 & 0 & 1 \\end{bmatrix} \\)\n\n###\
    \ Translate Back\n\n\\( M_3 = \\begin{bmatrix} 1 & 0 & T_x \\ 0 & 1 & T_y \\ 0\
    \ & 0 & 1 \\end{bmatrix} \\)\n\nComposition Maps a Point A to new Point B. \\\
    ( B := M_4 A \\)\n\n\\( M_4 = \\begin{bmatrix} 1 & 0 & T_x \\ 0 & 1 & T_y \\ 0\
    \ & 0 & 1 \\end{bmatrix} \\begin{bmatrix} \\cos(\\theta) & -\\sin(\\theta) & 0\
    \ \\ \\sin(\\theta) & \\cos(\\theta) & 0 \\ 0 & 0 & 1 \\end{bmatrix} \\begin{bmatrix}\
    \ 1 & 0 & -T_x \\ 0 & 1 & -T_y \\ 0 & 0 & 1 \\end{bmatrix} \\)\n\n\\( M_4 = \\\
    begin{bmatrix} \\cos(\\theta) & -\\sin(\\theta) & -\\cos(\\theta) T_x + \\sin(\\\
    theta) T_y + T_x \\ \\sin(\\theta) & \\cos(\\theta) & -\\sin(\\theta) T_x - \\\
    cos(\\theta) T_y + T_y \\ 0 & 0 & 1 \\end{bmatrix} \\)\n\n## Scaling About Point\
    \ P\n\n- Scaling also operates relative to the Origin.\n- To make an object bigger\
    \ without moving it\n  - Translate P to origin.\n  - Apply scaling.\n  - Inverse\
    \ translation.\n\n\\(M_4 = \\begin{bmatrix} 1 & 0 & T_x \\\\ 0 & 1 & T_y \\\\\
    \ 0 & 0 & 1 \\end{bmatrix} \\begin{bmatrix} S_x & 0 & 0 \\\\ 0 & S_y & 0 \\\\\
    \ 0 & 0 & 1 \\end{bmatrix} \\begin{bmatrix} 1 & 0 & -T_x \\\\ 0 & 1 & -T_y \\\\\
    \ 0 & 0 & 1 \\end{bmatrix} = \\begin{bmatrix} S_x & 0 & -S_x T_x + T_x \\\\ 0\
    \ & S_y & -S_y T_y + T_y \\\\ 0 & 0 & 1 \\end{bmatrix}\\)\n\n## Matrix Multiplication\
    \ is Not Commutative\n\nFirst rotate, then translate =>\n\nFirst translate, then\
    \ rotate =>\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_251_0.png)\n\n## Composite\
    \ of basic transformations\n\n- Order of multiplication of the matrices is important\
    \ because matrix multiplication is not commutative\n- Most of the transformations\
    \ that we normally deal with can be obtained as composite of the 3 basic transformations,\
    \ i.e., translation, scaling, and rotation\n\n## Rotation about arbitrary axis\n\
    \n- Given:\n  - Axis: (x₁,y₁,z₁) to (x₂,y₂,z₂)\n  - Angle of rotation: θ\n- Procedure\n\
    \  1. Transform so that the given axis coincides with the Z axis\n  2. Rotate\
    \ by θ\n  3. Apply inverse of step 1. transforms\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_253_0.png)\n\
    \n## Rotation example (contd.)\n\n- Steps\n  - \\( T_{-(x_1,y_1,z_1)} \\): Makes\
    \ given axis pass through origin\n  - \\( R_{(x,\\alpha)} \\): Makes axis lie\
    \ in ZX plane\n  - \\( R_{(y,\\beta)} \\): Makes axis coincide with the Z axis\n\
    \  - \\( R_{(z,\\theta)} \\): Applies given rotation\n  - Apply inverses of aligning\
    \ transformations\n\n## Rotation About Arbitrary Axis\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_0.png)\n\
    \nInitial Position\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_1.png)\n\n\
    Translate P1 to Origin\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_2.png)\n\
    \nRotate about X\n\n$T$\n\n$R_x(\\alpha)$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_3.png)\n\
    \n$R_y(\\beta)$\n\nRotate about Y\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_255_4.png)\n\
    \n$R_z(\\theta)$\n\nRotate about Z\n\n## Transformations in OpenGL\n\n- Model-view\
    \ matrix\n- Projection matrix\n- Texture matrix\n\n## Programming Transformations\n\
    \n- In OpenGL, the transformation matrices are part of the state, they must be\
    \ defined *prior* to any vertices to which they are to apply.\n- In modeling,\
    \ we often have objects specified in their own coordinate systems and must use\
    \ transformations to bring the objects into the scene.\n- OpenGL provides *matrix\
    \ stacks* for each type of supported matrix (model-view, projection, texture)\
    \ to store matrices.\n\n"
