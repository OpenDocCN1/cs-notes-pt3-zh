  - '[PAGE 252]


    # Composite of basic transformations


    +   - Order of multiplication of the matrices is important because matrix multiplication
    is not commutative

    +   - Most of the transformations that we normally deal with can be obtained as
    composite of the 3 basic transformations, i.e., translation, scaling, and rotation'
  - '[PAGE 253]


    # # Rotation about arbitrary axis


    +   - Given:

    +     Axis: (x₁,y₁,z₁) to (x₂,y₂,z₂)

    +     Angle of rotation: θ

    +   - Procedure

    +     1. Transform so that the given axis coincides with the Z axis

    +     2. Rotate by θ

    +     3. Apply inverse of step 1. transforms


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_253_0.png)'
  - '[PAGE 254]


    # # Rotation example (contd.)


    +   - Steps

    +     - \( T_{-(x_1,y_1,z_1)} \): Makes given axis pass through origin

    +     - \( R_{(x,\alpha)} \): Makes axis lie in ZX plane

    +     - \( R_{(y,\beta)} \): Makes axis coincide with the Z axis

    +     - \( R_{(z,\theta)} \): Applies given rotation

    +     - Apply inverses of aligning transformations'
