  mdcn: "\n\n## Matrix Inverse\n\n- Inverse of Matrix: A⁻¹\n\nThis is usually used\
    \ while solving a set of linear equations.\n\nAx = B\n\nx = A⁻¹B\n\n## Thank You\n\
    \n## Introduction to OpenGL\n\n## What is OpenGL?\n\n- “A software interface to\
    \ graphics hardware”\n- A 3D graphics and modeling library\n- Very fast (a standard\
    \ to be accelerated)\n- Portable\n- Open standard\n- Was SGI’s IRIS GL\n\n## Given\
    \ 3D data, generate 2D view\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_97_0.png)\n\
    \n## OpenGL\n\n- Initially defined by Silicon Graphics Inc.\n- web site: http://www.opengl.org\n\
    - OpenGL Architecture Review Board (ARB):\n  Compaq, Evans & Sutherland, Hewlett–Packard,\
    \ IBM, Intel, Intergraph, Microsoft, and Silicon Graphics\n- Available on many\
    \ platforms (UNIX, Linux, Windows)\n- Scales from desktop PCs to very high–end\
    \ graphics engines\n- Intuitive, procedural interface with C bindings\n\n## Programming\
    \ the Graphics Pipeline\n\n- API: Application Program Interface\n- Historic APIs:\
    \ GKS, PHIGS, PHIGS++, PEX\n- Low level APIs: OpenGL, Direct3D\n- High level APIs:\
    \ Java3D\n- WWW standards: VRML (high level), X3D\n\n## OpenGL\n\n- OpenGL 1.0\
    \ (1992)\n  - GL_EXT_vertex_array\n  - GL_EXT_texture_object\n- → OpenGL 1.1 (1995)\n\
    \  - GL_EXT_texture3D\n- → OpenGL 1.2 (1998)\n  - GL_ARB_multitexture\n  - …\n\
    - → OpenGL 1.3 (2001)\n  - GL_ARB_shadow\n  - GL_EXT_secondary_color\n  - GL_ARB_vertex_program\n\
    \  - …\n- → OpenGL 1.4 (2002)\n  - GL_ARB_occlusion_query\n  - GL_ARB_vertex_buffer_object\n\
    \  - GL_ARB_fragment_program\n  - GL_ARB_point_sprite\n  - …\n- → OpenGL 1.5 (2003)\n\
    \  - GL_ARB_fragment_shader\n  - GL_ARB_shader_objects\n  - GL_ARB_shading_language_100\n\
    \  - GL_ARB_vertex_shader\n- → OpenGL 2.0 (2004)\n  - OpenGL Shading Language\
    \ 1.1\n  - FBO\n  - MRT\n- → OpenGL 2.1 (2006)\n  - GLSL 1.2\n  - PBO\n  - sRGB\
    \ texture format\n\n## OpenGL\n\n- Provides no high-level rendering functions\
    \ for complex objects; you must build your shapes from primitives (points, lines,\
    \ polygons, etc.). The utility library GLU provides some support.\n\n## What OpenGL\
    \ Does\n\nAllows definition of object shapes, material properties and lighting\n\
    \nArranges objects and interprets synthetic camera in 3D space\n\nConverts mathematical\
    \ representations of objects into pixels (rasterisation)\n\nCalculates the colour\
    \ of every object\n\n## 3 Stages in OpenGL\n\nDefine Objects in World Scene\n\n\
    Set Modeling and Viewing Transformations\n\nRender the Scene\n\n## How OpenGL\
    \ Works\n\n- **OpenGL is a state machine**\n  - You give it orders to set the\
    \ current state of any one of its internal variables, or to query for its current\
    \ status\n  - The current state won’t change until you specify otherwise\n  -\
    \ Ex.: if you set the current color to Red, everything you draw will be painted\
    \ Red until you change the color explicitly\n  - Each of the system’s state variables\
    \ has a default value\n\n## Defining OpenGL Objects\n\n- OpenGL objects are represented\
    \ as combinations of shapes, such as:\n  - Points and lines\n  - Triangles and\
    \ Quadrilaterals\n  - Polygons\n  - Quadrics (spheres, cylinders, cones, etc.)\n\
    \  - Curves and surfaces\n\n## 2D Coordinates\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_108_0.png)\n\
    \n## 3D Coordinates\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_109_0.png)\n\n\
    ## OpenGL Primitives\n\n- GL_POINTS\n- GL_LINES\n- GL_LINE_STRIP\n- GL_LINE_LOOP\n\
    \n- GL_TRIANGLES\n- GL_QUADS\n- GL_POLYGON\n- GL_TRIANGLE_STRIP\n- GL_TRIANGLE_FAN\n\
    - GL_QUAD_STRIP\n\nGL_POLYGON and GL_TRIANGLE are the only ones in common usage;\
    \ valid OpenGL polygons are closed, convex, co-planar and non-intersecting, which\
    \ is always true for triangles!\n\n## Examples\n\n```\nglBegin(GL_POLYGON);\n\
    \ glVertex2i(0,0);\n glVertex2i(0,1);\n glVertex2i(1,1);\n glVertex2i(1,0);\n\
    \ glEnd() ;\n```\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_111_0.png)\n\n```\n\
    glBegin(GL_POINTS);\n glVertex2i(0,0);\n glVertex2i(0,1);\n glVertex2i(1,1);\n\
    \ glVertex2i(1,0);\n glEnd() ;\n```\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_111_1.png)\n\
    \n"
