  - '[PAGE 599]


    # Shadows


    +   - Shadows eliminate the perceptual artifacts of objects floating above the
    ground

    +   - Shadows emphasize the changing direction of the light source

    +   - Shadows may be *sharp edged* or *soft edge*, can contain both an *umbra*
    and a *penumbra* depending on the shape of the light source and its distance from
    the light source

    +   - An illuminated scene without shadows could be confusing and affects realism'
