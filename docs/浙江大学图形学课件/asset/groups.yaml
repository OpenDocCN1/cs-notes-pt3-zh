    quad t\\in[0,1]$$\n\n+   1. **Endpoint Interpolation:** interpolating two end\
    \ points\n+   \n+      $$C(0)=P_0,\\quad C(1)=P_n.$$\n\n+   2. **tangent direction\
    \ of $P_0$:** $P_0P_1$, tangent direction of $P_n$: $P_{n-1}P_n$.\n+   \n+   \
