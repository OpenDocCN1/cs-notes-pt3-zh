    \ far);\n```\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_325_0.png)\n\n```c\n\
    glMatrixMode(GL_PROJECTION);\n```\n\n```c\nglLoadIdentity();\n```\n\n```c\nglFrustum(left,\
    \ right, bottom, top, near, far);\n```\n\n## OpenGL Perspective\n\ngluPerspective(fovy,\
    \ aspect, near, far);\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_326_0.png)\n\
    \nfov is the angle between the top and bottom planes\n\n## gluPerspective(fovy,\
    \ aspect, near, far)\n\n```c\n{\n    GLdouble m[4][4];\n    double sine, cotangent,\
    \ deltaZ;\n    double radians = fovy / 2 * __glPi /\n        180;\n\n    deltaZ\
    \ = zFar - zNear;\n    sine = sin(radians);\n    if ((deltaZ == 0) || (sine ==\
    \ 0) ||\n        (aspect == 0)) {\n        return;\n    }\n    cotangent = cos(radians)\
    \ / sine;\n\n    __gluMakeIdentity(&m[0][0]);\n    m[0][0] = cotangent / aspect;\n\
    \    m[1][1] = cotangent;\n    m[2][2] = -(zFar + zNear) / deltaZ;\n    m[2][3]\
    \ = -1;\n    m[3][2] = -2 * zNear * zFar / deltaZ;\n    m[3][3] = 0;\n    glMultMatrixd(&m[0][0]);\n\
    }\n```\n\n## A More Intuitive Approach Offered by glu:\n\n```c\ngluLookAt(eyex,\
    \ eyey, eyez, atx, aty,\natz,\nupx, upy, upz);\n```\n\neyex, eyey, eyez specify\
    \ the position of the eye point and are mapped to the origin.\n\natx, aty, atz\
    \ specify a point being looked at, which will be rendered in center of view port.\
    \ It is mapped to the -z axis.\n\nupx, upy, upz specify components of the camera\
    \ up vector.\n\n## gluLookAt\n\n```c\n{\nfloat forward[3], side[3], up[3];\nGLfloat\
    \ m[4][4];\n\nforward[0] = centerx - eyex;\nforward[1] = centery - eyey;\nforward[2]\
    \ = centerz - eyez;\nup[0] = upx;\nup[1] = upy;\nup[2] = upz;\n\nnormalize(forward);\n\
    \n/* Side = forward x up */\ncross(forward, up, side);\nnormalize(side);\n\n/*\
    \ Recompute up as: up = side x forward */\n/* */\ncross(side, forward, up);\n\n\
    __gluMakeIdentityf(&m[0][0]);\nm[0][0] = side[0];\nm[1][0] = side[1];\nm[2][0]\
    \ = side[2];\n\nm[0][1] = up[0];\nm[1][1] = up[1];\nm[2][1] = up[2];\n\nm[0][2]\
    \ = -forward[0];\nm[1][2] = -forward[1];\nm[2][2] = -forward[2];\n\nglMultMatrixf(&m[0][0]);\n\
    glTranslated(-eyex, -eyey, -eyez);\n}\n```\n\n63\n\n## Ex3\n\n- Switch between\
    \ orthographic and perspective camera\n- Moving the camera with arrow keys\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_330_0.png)\n\n## THANK YOU\n\n## Viewing\
    \ in 2D/3D\n\n## Viewing\n\n- Goal is to visualize information (3D worlds, scientific\
    \ results, mathematical functions) as images, animations and virtual walkthroughs\n\
    \n**VIEWING** becomes fundamental\n\n- By viewing we mean transforming the objects\
    \ from the world coordinates (2D, 3D .... ) to eye coordinates to device/screen\
    \ coordinates (usually 2D).\n\n## 2D Viewing\n\n- By applying **appropriate transformations**\
    \ we can map the world seen through the window on to the screen\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_335_0.png)\n\
    \n## 2D World\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_335_1.png)\n\n## Screen\n\
    \n## 2D Viewing Transformation\n\n- Mapping the 2D world seen in the **window**\
    \ on to the **viewport** is 2D **viewing transformation** also called **window\
    \ to viewport transformation**\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_336_0.png)\n\
    \n## Deriving 2D Viewing Transformation\n\n$$\\frac{v_x-vx_L}{vx_R-vx_L}=\\frac{w_x-wx_L}{wx_R-wx_L}$$\n\
    $$\\frac{v_y-vy_B}{vy_T-vy_B}=\\frac{w_y-wy_B}{wy_T-wy_B}$$\n\n$$v_x=\\frac{vx_R-vx_L}{wx_R-wx_L}\\\
    cdot(wx-wx_L)+vx_L$$\n$$v_y=\\frac{vy_T-vy_B}{wy_T-wy_B}\\cdot(wy-wy_B)+vy_B$$\n\
    \n## OpenGL Commands\n\n| Command | Description |\n|---|---|\n| **gluOrtho2D(\
    \ left, right, bottom, top )** | Creates a matrix for projecting 2D coordinates\
    \ onto the screen and multiplies the current matrix by it. |\n\n| Command | Description\
    \ |\n|---|---|\n| **glViewport( x, y, width, height )** | Define a pixel rectangle\
    \ into which the final image is mapped.  \n(x, y) specifies the lower-left corner\
    \ of the viewport.  \n(width, height) specifies the size of the viewport rectangle.\
    \ |\n\n"
