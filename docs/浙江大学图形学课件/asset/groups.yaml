  - '[PAGE 467]


    # # Z-Buffer Algorithm


    +   - Image precision algorithm

    +   - Apart from a frame buffer F in which color values are stored, it also needs
    a z-buffer, of the same size as the frame buffer, to store z values


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_467_0.png)'
  - '[PAGE 468]


    # Polygon Scan Conversion


    +   - Order of scan conversion is not important

    +   - During the scan conversion, for a pixel position (i,j), the z-buffer and
    the frame buffer record the information associated with the largest z encountered
    thus far for the pixel

    +   - Scan conversion is done one scan-line at a time, as done for filling polygons'
  - '[PAGE 469]


