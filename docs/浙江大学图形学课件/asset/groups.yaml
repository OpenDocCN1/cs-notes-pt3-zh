    ( y_i=y_{i\\_prev}+m \\)\n\n- Illuminate the pixel \\( [x_i,round(y_i)] \\)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_172_0.png)\n\nDiscussion1: What technique\
