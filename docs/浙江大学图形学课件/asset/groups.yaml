    ## Particle Systems


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_766_0.png)


    Particle systems offer a solution to modelling amorphous, dynamic and fluid objects
    like clouds, smoke, water, explosions and fire.


    ## Representing Objects with Particles


    - An object is represented as clouds of primitive particles that define its volume
    rather than by polygons or patches that define its boundary.

    - A particle system is dynamic, particles changing form and moving with the passage
    of time.

    - Object is not deterministic, its shape and form are not completely specified.
    Instead


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_767_0.png)


    ## Basic Model of Particle Systems


    1) New particles are generated into the system.

    2) Each new particle is assigned its individual attributes.

    3) Any particles that have existed past their prescribed lifetime are extinguished.

    4) The remaining particles are moved and transformed according to their dynamic
    attributes.

    5) An image of the particles is rendered in the frame buffer, often using special
    purpose algorithms.


    ## Attributes of a Particle


    - Position

    - Velocity

    - Life Span

    - Size

    - Weight

    - Representation

    - Color

    - Owner


    ## Basic Particle System

    Physics


    - Particle is a point in 3D space.

    - Forces (e.g. gravity or wind) accelerate a particle.

    - Acceleration changes velocity.

    - Velocity changes position


