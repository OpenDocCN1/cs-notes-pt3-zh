  - '[PAGE 557]


    # Attributes modulated for texture


    +   - *Surface color* (diffuse reflection coefficients)

    +     - most commonly used parameter for texture mapping. It is used like wrapping
    an image on to a surface, like a label on a bottle.

    +   - *Specular and diffuse reflection* (**environment mapping**)

    +     - used to capture reflection of the environment on to a surface. Commonly
    used in exhibiting shiny metallic surfaces.

    +   - *Normal vector perturbations* (**bump mapping**)

    +     - used to generate a rough surfaces like that of an orange.'
  - '[PAGE 558]


    <!-- no content -->'
  - '[PAGE 559]


    # # Problems


    +   - Aliasing artifacts

    +     - Due to point sampling

    +   - Perspective distortions

    +     - Since we did not take into account perspective transformation'
  - '[PAGE 560]


    # # Computing Color in Texture mapping


    +   - Associate texture with polygon

    +   - Map pixel onto polygon and then into texture map

    +   - Use weighted average of covered texture to compute color.


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_560_0.png)'
  - '[PAGE 561]


    # Taking care of aliasing


    +   - What causes aliasing artifacts

    +     - High frequency signals

    +   - Typical solutions

    +     - Sample at higher rates

    +     - Prefilter textures using low pass filters'
  - '[PAGE 562]


    # Optimization


    +   - Since most of the times, textures are known a priori, we can create various
    levels of these prefiltered textures in a preprocess.

    +   - Then at run time, we fetch the required level of mipmap and apply that texture

    +   - This is known as mipmapping'
  - '[PAGE 563]


    # # Mipmapping


    +   - Like any other object, a texture mapped object can be viewed from many distances.

    +   - Sometimes, that causes problems.

    +     - A low-resolution texture (say, 32x32) applied to a big polygon (say, one
    that occupies a 512x512 area on screen) will appear blocky.

    +     - Conversely, if you apply a high-resolution texture to a small polygon,
    how do you decide which texels to show and which to ignore?'
  - '[PAGE 564]


    # Mipmapping (continued)


    +   - One solution is to provide multiple levels of detail for the same texture
    and use the one that best matches the polygon’s apparent size on screen.

    +   - This technique is called Mipmapping, and each texture in the hierarchy is
    called a mipmap.

    +   - OpenGL can compute mipmaps automatically, and it can also accept mipmaps
    provided from different files.'
  - '[PAGE 565]


    # # Mipmapping Example


    # ## Original Texture


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_565_0.png)


    # ## Pre-Filtered Images


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_565_1.png)


    30'
  - '[PAGE 566]


    # Texture Filtering


    +   - When the texture is mapped to a polygon, a single texel rarely matches a
    single pixel exactly.

    +   - If a pixel matches only a portion of a texel, the texel must be magnified.

    +   - If a pixel matches more than one texel, the texels must be minified.'
  - '[PAGE 567]


    # # Filtering Example


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_567_0.png)'
  - '[PAGE 568]


    # # Texture Matrix


    +   - Loading a texture onto the graphics card is very expensive

    +   - But once there, a **texture matrix** can be used to “transform” the texture

    +     - For example, changing the translation can select different parts of the
    texture

    +   - If the texture matrix is changed from frame to frame, the texture will appear
    to move on the object

    +   - This is particularly useful for things like flame, or swirling vortices,
    …'
  - '[PAGE 569]


    # # Multitexturing


    +   - It is sometimes possible to apply more than one texture to a polygon.

    +   - Examples: Light Maps, Texture Blending

    +   - NOTE: Most, but not all, implementations of OpenGL support multitexturing!'
  - '[PAGE 570]


    # # Light Maps


    +   - Instead of wallpapering a polygon with the texture’s colors, we can blend
    the texture with the existing colors.

    +   - A “light map” is such a black-and-white texture; white texels will cause
    the underlying pixels to appear brighter and shinier, and vice versa.'
