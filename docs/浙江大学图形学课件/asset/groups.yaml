  md: "\n## Z-Buffer Algorithm\n\n- Image precision algorithm\n- Apart from a frame\
    \ buffer F in which color values are stored, it also needs a z-buffer, of the\
    \ same size as the frame buffer, to store z values\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_467_0.png)\n\
    \n## Polygon Scan Conversion\n\n- Order of scan conversion is not important\n\
    - During the scan conversion, for a pixel position (i,j), the z-buffer and the\
    \ frame buffer record the information associated with the largest z encountered\
    \ thus far for the pixel\n- Scan conversion is done one scan-line at a time, as\
    \ done for filling polygons\n\n## Z-Buffer Pseudo-code\n\n```\nfor ( j=0; j<SCREEN_HEIGHT;\
    \ j++ )\n    for ( i=0; i<SCREEN_WIDTH; i++ )\n        WriteToFrameBuffer(i,j,\
    \ BackgroundColor);\n        WriteToZBuffer(i,j, 0);\nfor ( each polygon )\n \
    \   for ( each pixel in polygon's projection )\n        z = polygon's z value\
    \ at (i,j)\n        if ( z >= ReadFromZBuffer(i,j) )\n            WriteToFrameBuffer(i,j,\
    \ polygon's color at (i,j));\n            WriteToZBuffer(i,j, z);\n```\n\n## OpenGL\
    \ Support\n\nglClearBuffer(red, green, blue, alpha)\nglClearDepth(depth)\nglClear(GL_COLOR_BUFFER_BIT|GL_DEPTH_BUFFER_BIT)\n\
    \nglEnable(GL_DEPTH_TEST)\nglDisable(GL_DEPTH_TEST)\n\nglDepthFunc(func)\nglDepthRange(near,\
    \ far)\n\nGL_NEVER\nGL_ALWAYS\nGL_LESS\nGL_LEQUAL\nGL_GREATER\nGL_NOTEQUAL\nGL_GEQUAL\n\
    \n## Painter's Algorithm\n\nSort all polygons according to the (farthest) z coordinates\
    \ of each\n\nWhen the polygon's z extents overlap, resolve the sorting ambiguities\
    \ by splitting the polygons\n\nDraw (fill) the polygons in the sorted order —back\
    \ to front\n\n- *Also known as Depth-sort algorithm*\n- *When can we skip step\
    \ 2 above?*\n\n## Painter's Algorithm...\n\n- Does polygon P obscures polygon\
    \ Q?\n  - Do the polygons' x extents overlap?\n  - Do the polygons' y extents\
    \ overlap?\n  - Is P entirely on the opposite side of Q's plane from the viewpoint?\n\
    \  - Is Q entirely on the same side of P's plane from the viewpoint?\n  - Do the\
    \ projections of the polygons onto screen not overlap?\n\n## Painter's Algorithm...\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_474_0.png)\n\nSome cases in which Z\
    \ extents of polygons overlap\n\n## Binary Space Partitioning Trees\n\n- Very\
    \ efficient for a static group of 3D polygons as seen from an arbitrary viewpoint\n\
    - Correct order for Painter’s algorithm is determined by a suitable traversal\
    \ of the binary tree of polygons: BSP Tree\n\n## BSP Tree\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_476_0.png)\n\
    \n## BSP Tree\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_477_0.png)\n\nA\n\n\
    B\n\nC\n\n## BSP Tree\n\n# Draw BSP Tree\n\n```\nfunction *draw*(bsptree *tree*,\
    \ point *eye*)\nif *tree.empty* then\n    return\nif *f*<sub>tree.root</sub>(*eye*)\
    \ < 0\n    draw (*tree.right*)\n    rasterize(*tree.root*)\n    draw(*tree.left*)\n\
    else\n    draw (*tree.left*)\n    rasterize(*tree.root*)\n    draw(*tree.right*)\n\
    ```\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_478_0.png)\n\n## BSP Tree\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_479_0.png)\n\n- rasterize(C)\n- rasterize(A)\n\
    - rasterize(B)\n\n- rasterize(B)\n- rasterize(A)\n- rasterize(C)\n\n## BSP Tree\n\
    \n- Code works for any view\n- Tree can be pre-computed\n- Requires evaluation\
    \ of\n  \\[\n  f_{plane\\ of\\ the\\ triangle}(eye)\n  \\]\n\n## BSP Tree\n\n\
    - Equation of the Plane\n  \n  Ax + By + Cz + D = 0\n  \n- How to compute A, B,\
    \ C and D ?\n  \n  (A, B, C) is the normal to the plane.\n  \n  normal = (b-a)\
    \ × (c-a)\n  \n  D = -(Axₐ + Byₐ + Czₐ)\n  \n  = -normal • a\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_481_0.png)\n\
    \n## BSP Tree Construction\n\n- The binary tree is constructed using the following\
    \ principle:\n  - For each polygon, we can divide the set of other polygons into\
    \ two groups\n  - One group contains those lying in front of the plane of the\
    \ given polygon\n  - The other group contains those in the back\n  - The polygons\
    \ intersecting the plane of the given polygon are split by that plane\n"
