  - '[PAGE 81]


    # # Affine Combinations


    +   • Affine combination of points \( P_i \) is given by \( P = \sum_i a_i P_i
    \quad where, \quad \sum_i a_i = 1 \)


    Consider, the equation of line \( L = P_1 + t * (P_2 - P_1) = (1-t) * P_1 + t
    * P_2 \)


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_81_0.png)'
  - '[PAGE 82]


    # Barycentric Co-ordinates


    +   - Any point on a plane can be written as affine combination of three distinct
    points


    $P = \alpha P_1 + \beta P_2 + \gamma P_3$


    where,


    $\alpha + \beta + \gamma = 1$


    Note that, if $0 < (\alpha, \beta, \gamma) < 1$


    point P lies inside the triangle


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_82_0.png)'
  - '[PAGE 83]


    # # Polygons


    +   - Polygon is a closed figure formed by an ordered set of points

    +   These corner points are usually termed as *Vertices*


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_83_0.png)


    What can be said about the affine combination of these vertices?'
  - '[PAGE 84]


    # Convex Combination


    +   - Convex combination is an affine combination, where all the *weights* are
    constrained to interval [0,1]

    +   - Given a polygon, if all convex combinations of the vertices of the polygon
    lie inside the polygon, then we say that, the polygon is *Convex* otherwise, it
    is said to be *Concave*'
