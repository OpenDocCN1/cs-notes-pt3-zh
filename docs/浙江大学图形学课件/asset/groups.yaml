    # How would you describe this?


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_144_0.png)


    **Explicit representation** – represents a curve with one variable as a function
    of one or more other variables. $y=f(x)$'
  - '[PAGE 145]


    # Explicit Representation: Some Examples


    +   - **2D**

    +     - y = f(x), eg. y = mx + c

    +   - **3D**

    +     - z = f(x, y), eg. z = ax + by + c


    What’s the representation for a 3D line?


    *3D Line requires two equations: the two planes which intersect in that line.*


    What is the “y=mx + c” form for a vertical line?


    *The Explicit form falls apart here.*'
  - '[PAGE 146]


    # Implicit Form


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_146_0.png)


    x² - y = 0


    ***Implicit representation*** – represents a curve as the zero of a function of
    all coordinate variables: f(x, y) = 0'
  - '[PAGE 147]


    # # Implicit Representation: Some Examples


    +   - 2D

    +     - f(x, y) = 0

    +     - ax + by + c = 0 Line

    +     - x² + y² − r² = 0 Circle


    +   - 3D

    +     - f(x, y, z) = 0

    +     - ax + by + cz + d = 0 Plane

    +     - x²/a² + y²/b² + z²/c² − r² = 0 Ellipsoid'
  - "[PAGE 148]\n\n# # Point Classification Using Implicit Form\n\n+   - The function\
    \ is really a membership test\n+   \n+   f(x, y, z) = 0   →   Is f(x,y, z) = 0\
    \ for a point?\n+   \n+   Point classification is easy.\n+   \n+   Given any point\
    \ (x, y, z),\n+   \n+   If f(x, y, z) = 0, then on the surface;\n+   > 0, then\
    \ outside/one side of the surface;\n+   < 0, then inside/other side of the surface;\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_148_0.png)\n\n> 0"
  - '[PAGE 149]


    # Problems in Using Implicit Form


    +   - Point classification is easy.

    +   - But drawing is not.

    +   - Impractical to test every pixel for classification.

    +   - Need a generative form, one that allows us to compute the points on the
    curve/surface by evaluation of some simple function.'
  - '[PAGE 150]


    # Parametric Representation of Curves


    Make x, y, z as separate functions of a parameter.


    A planar curve:


    $$x=x(u)$$

    $$y=y(u)$$


    $$u\in(u_0,u_1)$$


    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_150_0.png)


    A space curve: $\left(x(u),\ y(u),\ z(u)\right)$'
  - '[PAGE 151]


    # Parametric Form: Some Examples


    $$x = x_0 + (x_1 - x_0) * u \qquad y = y_0 + (y_1 - y_0) * u$$


    $$x = r * \cos(u) \qquad y = r * \sin(u)$$'
