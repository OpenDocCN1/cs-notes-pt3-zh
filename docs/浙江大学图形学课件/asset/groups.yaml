    \ like lines, polygons, filled/patterned areas, etc. can be carried out in two\
    \ steps\n  - determine the pixels through which the primitive is visible, a process\
    \ called **Rasterization or scan conversion**\n  - determine the color value to\
    \ be assigned to each such pixel.\n\n## Rasterization\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_164_0.png)\n\
    \n## Why Study these Algorithms?\n\n- Some of these algorithms are very good examples\
    \ of clever algorithmic optimization done to dramatically improve performance\
    \ using minimal hardware facilities.\n\n## Scan Converting a Line Segment\n\n\
    - The line is a powerful element used since the days of Euclid to model the edges\
    \ in the world.\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_167_0.png)\n\n- Given\
    \ a line segment defined by its endpoints determine the pixels and colour which\
    \ best model the line segment.\n\n## Scan converting lines\n\nstart from $(x_1,\
    \ y_1)$ end at $(x_2, y_2)$\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_168_0.png)\n\
    \n## Question1: How ?\n\n$(x_1, y_1), (x_2, y_2)$\n\n$y=mx+b$\n\n$x_1+1 \\rightarrow\
    \ y=?, Rounding$\n\n$x_1+2 \\rightarrow y=?, rounding \\quad \\longrightarrow\
    \ \\quad x_1+i \\rightarrow y=?, rounding$\n\n## Question2: How to speed up?\n\
    \n![](img/94fd648dd12ff5c2cbed197b5038ba1a_170_0.png)\n\n## Equation of a Line\n\
    \n- Equation of a line is **y - m.x + c = 0**\n- For a line segment joining points\
    \ **P(x1,y2)** and **P(x2,y2)**\n\n*slope* \\(m = \\frac{y2-y1}{x2-x1} = \\frac{\\\
    Delta y}{\\Delta x}\\)\n\n- Slope **m** means that for every unit increment in\
    \ X the increment in Y is *m* units\n\n![](img/94fd648dd12ff5c2cbed197b5038ba1a_171_0.png)\n\
    \n## Digital Differential Analyzer (DDA)\n\n- We consider the line in the first\
    \ octant. Other cases can be easily derived.\n- Uses differential equation of\
    \ the line\n\n\\( y_i=m \\cdot x_i+c \\)\n\nwhere, \\( m=\\frac{y2-y1}{x2-x1}\
    \ \\)\n\n- Incrementing X-coordinate by 1\n\n\\( x_i=x_{i\\_prev}+1 \\)\n\n\\\
    ( y_i=y_{i\\_prev}+m \\)\n\n- Illuminate the pixel \\( [x_i,round(y_i)] \\)\n\n\
    ![](img/94fd648dd12ff5c2cbed197b5038ba1a_172_0.png)\n\nDiscussion1: What technique\
    \ makes it faster?\nDiscussion2: Is there any problem in the algorithm?\nHow to\
    \ avoid it?\n\n"
