  mdcn: "\n## 6.1 Entity Sets (实体集)\n\nThe real world can be modeled as:\n- a collection\
    \ of entities (实体),\n- relationships (联系) among entities.\n\nAn entity is an object\
    \ that exists and is distinguishable from other objects.\n(An entity may be concrete,\
    \ or abstract)\nExample: specific student, company, event, plant\n\nEntities have\
    \ attributes (属性)\n- Example: student has id, name, age, sex and address\n\nAn\
    \ entity set is a set of entities of the same type that share the same properties.\n\
    - Example: set of all students, companies, trees, holidays, customers, accounts,\
    \ loans\n- 一个实体集包含多个同类实体\n\n### Example: Entity Sets *customer* and *loan*\n\n\
    **Attribute names:** customer-id, customer-name, customer-street, customer-city,\
    \ loan-number, amount\n\n**Attribute value:**\n\n| customer-id | customer-name\
    \ | customer-street | customer-city |\n|---|---|---|---|\n| 321-12-3123 | Jones\
    \ | Main | Harrison |\n| 019-28-3746 | Smith | North | Rye |\n| 677-89-9011 |\
    \ Hayes | Main | Harrison |\n| 555-55-5555 | Jackson | Dupont | Woodside |\n|\
    \ 244-66-8800 | Curry | North | Rye |\n| 963-96-3963 | Williams | Nassau | Princeton\
    \ |\n| 335-57-7991 | Adams | Spring | Pittsfield |\n\n| loan-number | amount |\n\
    |---|---|\n| L-17 | 1000 |\n| L-23 | 2000 |\n| L-15 | 1500 |\n| L-14 | 1500 |\n\
    | L-19 | 500 |\n| L-11 | 900 |\n| L-16 | 1300 |\n\nAn entity: *customer*, *loan*\n\
    \n### Attributes\n\nAn entity is represented by a set of attributes, that is **descriptive\
    \ properties** possessed by all members of an entity set.\n\n**Domain** (域, value\
    \ set) — the set of permitted values for each attribute\n\n**Attribute types:**\n\
    \n- **Simple** and **composite** attributes (简单和复合属性，如sex, name).\n- **Single-valued**\
    \ and **multi-valued** attributes (单值和多值属性)\n  - E.g. multivalued attribute: **phone-numbers**\
    \ (多个电话号码)\n- **Derived** attributes (派生属性)\n  - Can be computed from other attributes\n\
    \  - E.g. **age**, given date of birth\n  - **versus** **base attributes** or\
    \ **stored attributes** (基属性，存储属性)\n\n### Composite Attributes\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_348_0.png)\n\
    \nComposite Attributes:\n- name\n  - first-name\n  - middle-initial\n  - last-name\n\
    - address\n  - street\n  - city\n  - state\n  - postal-code\n\nComponent Attributes:\n\
    - street-number\n- street-name\n- apartment-number\n\n复合属性\n\n分量属性\n\n## 6.2 Relationship\
    \ Sets（联系集）\n\nA **relationship** is an association among several entities（是一个或多个不同类实体之间的关联）\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_349_0.png)\n\nA **relationship set**\
    \ is a set of relationships of the same type.\n\nExample: **borrower ( customer-name,\
    \ loan-number )**\n\n- 一个联系集包含多个同类联系（或联系实例，relationship instance）\n- 一个联系集表示一个或多个实体集之间的关联。\n\
    \nFormally, a **relationship set** is a mathematical relation among \\(n \\ge\
    \ 2\\) entities, each taken from entity sets\n\n\\[\n\\{(e_1, e_2, \\ldots, e_n)\
    \ \\mid e_1 \\in E_1, e_2 \\in E_2, \\ldots, e_n \\in E_n\\}\n\\]\n\nwhere \\\
    ((e_1, e_2, \\ldots, e_n)\\) is a relationship, \\(E_i\\) is an entity set.\n\n\
    - **Example:** \\((Jones,\\ L\\text{-}17) \\in borrower\\), where \\(Jones \\\
