  - '[PAGE 45]


    # # 1.7 Database Users


    +   - Users are differentiated by the way they expect to interact with the system


    +   - **Naïve users** - invoke one of the permanent application programs that
    have been written previously by a high level language. (普通用户)


    +     - E.g. people accessing database over the web, bank tellers, clerical staff


    +   - **Application programmers** - interact with system through SQL calls.


    +   - **Sophisticated users** - form requests in a database query language. E.g
    online analytical processing (OLAP), Data mining. (富有经验的用户)


    +   - **Specialized users** - write specialized database applications that do
    not fit into the traditional data processing framework. E.g CAD, KDB, ES. (专门用户，特殊用户)


