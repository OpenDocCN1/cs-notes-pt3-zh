    \ office-number)*\n\n- **The functional dependencies for this relation schema\
    \ are:**  \n  F = { *banker-name* → *branch-name, office-number*, *customer-name,\
    \ branch-name* → *banker-name* }\n\n- **The key is:** {*customer-name, branch-name*}\n\
    \n- **The for loop in the algorithm on the last page causes us to include the\
    \ following schemas in our decomposition:**  \n  *Banker-office-schema* = (*banker-name,\
    \ branch-name, office-number*)  \n  *Banker-schema* = (*customer-name, branch-name,\
    \ banker-name*)\n\n- Since *Banker-schema* contains a candidate key (*customer-name,\
    \ branch-name*) for *Banker-info-schema*, we are done with the decomposition process.\n\
    \n## Comparison of BCNF and 3NF\n\n- It is **always possible** to decompose a\
    \ relation into relations in **3NF** and\n  - the decomposition is lossless\n\
    \  - the dependencies are preserved\n\n- It is always possible to decompose a\
    \ relation into relations in **BCNF** and\n  - the decomposition is lossless\n\
    \  - but it may not be possible to preserve dependencies.\n"
