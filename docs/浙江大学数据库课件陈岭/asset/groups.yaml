  mdcn: "\n\n## Example\n\nR = (A, B, C)\nF = { A → B, B → C }\nKey = {A}\n\nAny relation\
    \ schema with two attributes is in BCNF.\n\nR is **not in BCNF** (∵ F⁺ = {A →\
    \ B, B → C, A → C, …}, for B → C, **B is not a key**)\n\nDecomposition R₁ = (A,\
    \ B), R₂ = (B, C)\n\n- **R₁ and R₂ in BCNF.** (A is the key for R₁, B is the key\
    \ for R₂)\n- **Lossless-join decomposition.** (R₁ ∩ R₂ = B, and B is the key for\
    \ R₂)\n- **Dependency preserving.** (F₁ = {A → B} holds on R₁, F₂ = {B → C} holds\
    \ on R₂)\n\n## Testing for BCNF\n\n- To check if a non-trivial dependency \\(\\\
    alpha \\rightarrow \\beta\\) causes a violation of BCNF:\n  1. compute \\(\\alpha^+\\\
    ) (the attribute closure of \\(\\alpha\\)), and  \n  2. verify that if \\(\\alpha^+\\\
    ) includes all attributes of \\(R\\), that is, \\(\\alpha\\) is a superkey of\
    \ \\(R\\).\n\n- Simplified test: To check if a relation schema \\(R\\) is in BCNF,\
    \ it suffices to check only the dependencies in the given set \\(F\\) for violation\
    \ of BCNF, rather than checking all dependencies in \\(F^+\\)\n  - If none of\
    \ the dependencies in \\(F\\) causes a violation of BCNF, then none of the dependencies\
    \ in \\(F^+\\) will cause a violation of BCNF either.\n\n\\(\\cdot \\cdot \\cdot\
    \ F^+\\) 是由 Armstrong 的 3 个公理从 \\(F\\) 推出的，而任何公理都不会使 \\(FD\\) 左边变小(拆分)，故如果 \\\
    (F\\) 中没有违反 BCNF 的 FD(即左边是 superkey)，则 \\(F^+\\) 中也不会。\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_465_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_465_1.png)\n\n## Testing for BCNF(cont.)\n\
    \nHowever, using only F to test for BCNF may be incorrect when testing a relation\
    \ in a decomposition of R.\n\n- E.g. Consider \\( R(A, B, C, D) \\), with \\(\
    \ F={A \\rightarrow B, B \\rightarrow C} \\)\n- R is in BCNF ? Which is candidate\
    \ key?\n- Decompose \\( R \\) into \\( R_1(A,B) \\) and \\( R_2(A,C,D) \\)\n-\
    \ Neither of the functional dependencies in \\( F \\) contain only attributes\
    \ from \\( (A,C,D) \\), so no FD violates BCNF, we might be mislead into thinking\
    \ \\( R_2 \\) satisfies BCNF.\n- In fact, dependency \\( A \\rightarrow C \\)\
    \ in \\( F^+ \\) shows \\( R_2 \\) is not in BCNF.\n\n(可在F下判别R是否违反BCNF，但须在F+下判别R的分解式是否违反BCNF.)\n\
    \n## (2) BCNF Decomposition Algorithm\n\nresult := {R};\ndone := false;\ncompute\
    \ F⁺;\nwhile (not done) do\nif (there is a schema Rᵢ in result that is not in\
    \ BCNF)\nthen begin\nlet α → β be a nontrivial functional dependency that holds\
    \ on Rᵢ such that α → Rᵢ is not in F⁺, and α ∩ β ≠ ∅;\nresult := (result − Rᵢ)\
    \ ∪ (α, β) ∪ (Rᵢ − β);\nend\nelse done := true;\n\nNote: at last, every sub-schema\
    \ is in BCNF, and the decomposition is lossless-join.\n\n> It means there is nontrivial\
    \ FD α → β in Rᵢ , and α is not a key.\n> 将Rᵢ分解为二个子模式：Rᵢ₁=(α, β )和Rᵢ₂=(Rᵢ − β)，α是\
