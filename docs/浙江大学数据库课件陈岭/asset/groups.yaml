    from (**depositor** natural full outer join **borrower**)\nwhere **account_number**\
    \ is **null** or **loan_number** is **null**\n```\n\nCustomer_name 为连接条件\n\n##\
    \ 主流商用数据库中外连接的表示\n\nSQL Server（二种形式）：\n\n```sql\n(1) SELECT loan.loan_number,\
