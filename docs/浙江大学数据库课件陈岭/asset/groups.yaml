    = loan.loan-number</sub>(borrower × loan))) − Π<sub>customer-name</sub>(depositor)


    Query2: Π<sub>customer-name</sub> (σ<sub>borrower.loan-number = loan.loan-number</sub>
    (borrower × (σ<sub>branch-name=“Perryridge”</sub>(loan)))) − Π<sub>customer-name</sub>(depositor)


    | Relation | Attributes |

    |---|---|

    | **loan** | loan-number, branch-name, amount |

    | **borrower** | customer-name, loan-number |

    | **depositor** | customer-name, account-number |


