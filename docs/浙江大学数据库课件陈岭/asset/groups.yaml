    \ 缺省，对所有用户审计。\n\n- BY SESSION每次会话期间，相同类型的需审计的SQL语句仅记录一次。\n\n- 常用的<st-opt>: table,\
    \ view, role, index, ...\n\n- 取消审计： NOAUDIT ...(其余同audit语句)\n\n### 对象(实体)审计：\n\
    \n- E.g: audit delete, update on student; -审计所有用户对student表的delete和update操作。\n\
    - 格式: AUDIT <obj-opt> ON <obj>|DEFAULT [ BY SESSION | BY ACCESS ] [ WHENEVER SUCCESSFUL|WHENEVER\
    \ NOT SUCCESSFUL ]\n  - obj-opt: insert, delete, update, select, grant,...\n-\
    \ 实体审计对所有的用户起作用。\n- ON <obj> 指出审计对象表、视图名。\n- ON DEFAULT 对其后创建的所有对象起作用。\n- 取消审计:\
    \ NOAUDIT ...\n\n### 怎样看审计结果：\n\n审计结果记录在 数据字典表: sys.aud$中，也可从dba_audit_trail,\
    \ dba_audit_statement, dba_audit_object中获得有关情况。\n上述数据字典表需在DBA用户（system）下才可见。\n\
    \n## Examples\n\n### Example 1 - The Person table is defined as following:\n\n\
    ```sql\ncreate table Person\n( id char(10) primary key,\n  name varchar(12) not\
    \ null,\n  age int,\n  gender char(1),\n  spouse char(10),\n  foreign key(spouse)\
    \ references Person\n    on update cascade\n    on delete set NULL,\n  check(gender\
    \ in {'f', 'm'}));\n```\n\n| id | ... | spouse |\n|---|---|---|\n| A | ... | E\
    \ |\n| B | ... | D |\n| C | ... |   |\n| D | ... | B |\n| E | ... | A |\n\nWrite\
    \ a constraint on **Person** to carry out the following action: **After set the\
    \ spouse attribute of a person to NULL, set the spouse attribute of the person’s\
    \ spouse to NULL accordingly.** (For example, originally Adam and Eve are a couple.\
    \ After Adam’s spouse attribute is set to NULL, Eve’s spouse attribute should\
    \ also be set to NULL.)\n\n## Example 2: Define a constraint over the relation\
    \ Person (as given in example 1) to indicate that the spouse relationship is one\
    \ to one between two heterosexual persons.\n\nCreate assertion spouse_assert1\
    \ check\n( not exists ( select * from Person as p1, Person as p2\nwhere p1.spouse\
    \ = p2.id and (p1.id != p2.spouse\nor p1.gender = p2.gender ) ) );\n\n| id | gender\
    \ | spouse |\n|---|---|---|\n| A | m | E |\n| B | f | D |\n| C | m | G |\n| D\
    \ | f | B |\n| E | f | A |\n| G | m | D |\n\ncreate assertion spouse_assert2 check\n\
    \n( not exists (select * from Person as p1, Person as p2\n              where\
    \ p1.spouse = p2.id\n                and p1.gender = p2.gender )\nand\nnot exists\
    \ (\n              select count(*) from Person\n              group by spouse\
    \ having count(*) > 1 ) );\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_309_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_309_1.png)\n\n## Following is an instance\
    \ of Person:\n\n| id | name | age | gender | spouse |\n|---|---|---|---|---|\n\
    | 01 | Zhao | 20 | m | 02 |\n| 02 | Qian | 21 | f | 01 |\n| 03 | Sun | 22 | f\
    \ | 04 |\n| 04 | Li | 20 | m | 03 |\n| 05 | Wang | 24 | m | 08 |\n| 06 | Zhang\
    \ | 24 | m |  |\n| 07 | Liu | 24 | f |  |\n| 08 | Ling | 25 | f | 05 |\n| 09 |\
    \ Jiang | 25 | m |  |\n\nWhat’s the output of executing the following two SQL\
    \ statements on the Person table above?\n\n```sql\ndelete from Person where name='Wang';\n\
    select count (spouse) from Person;\n```\n\n**Note:** All aggregate operations\
    \ except **count (*)** ignore tuples with null values. c.f. **count (columnname)**\n\
    \n## 4.5 Embedded SQL（嵌入式SQL）\n\n- SQL的功能不完备性。（计算，资源……）\n- The SQL standard defines\
    \ embeddings of SQL in a variety of programming languages such as Pascal, PL/I,\
    \ Fortran, C, and Cobol.\n- A language in which SQL queries are embedded is referred\
    \ to as a **Host language（宿主语言）**, and the SQL structures permitted in the host\
    \ language comprise *embedded SQL*.\n- **EXEC SQL** statement is used to identify\
    \ embedded SQL request to the preprocessor:\n\n  **EXEC SQL** `<embedded SQL statement>`\
    \ **END_EXEC**\n\n  Note: this varies by language. E.g. the Java embedding use:\n\
    \n  **# SQL { ... } ;**\n\n"
