  - '[PAGE 273]


    # # 4.2.3 Triggers (触发器) --- chapter 8 (8.6)


    A trigger is a statement that is executed automatically by the system as a side-effect
    of a modification to the database.


    To design a trigger mechanism, we must:

    Specify the conditions under which the trigger is to be executed.

    Specify the actions to be taken when the trigger executes.


    Triggers were introduced to SQL standard in SQL:1999, but supported even earlier
    using non-standard syntax by most databases.


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_273_0.png)


