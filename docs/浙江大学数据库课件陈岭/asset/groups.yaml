  - '[PAGE 300]


    # Revoking Authorization in SQL (Cont.)


    +   - `<privilege-list>` may be **ALL**, to revoke all privileges the revokee
    may hold.

    +   - If `<revokee-list>` includes **PUBLIC**, all users lose the privilege except
    those granted it explicitly.

    +   - If the same privilege was granted twice to the same user by different grantees,
    the user may retain the privilege after the revocation.

    +   - All privileges that depend on the privilege being revoked are also revoked.


