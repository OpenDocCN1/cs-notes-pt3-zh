    \ or a similar high level data model\n\n3. **Logical database design:**\n   -\
    \ Convert the conceptual design into a DB schema **Relation Schema**\n\n4. **Schema\
    \ refinement**\n   - Normalization of relations: Check relational schema for redundancies\
    \ and related anomalies.\n\n5. **Physical database design:**\n   - Indexing, clustering\
    \ and database tuning\n\n6. **Create/initialize the database & Security design**\n\
    \   - Load initial data, testing\n   - Identify different user groups and their\
    \ roles\n"
