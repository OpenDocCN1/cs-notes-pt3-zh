  - "[PAGE 354]\n\n# # (1) Degree of a Relationship Set\n\n+   - Refers to the number\
    \ of entity sets that participate in a relationship set.\n\n+   - Relationship\
    \ sets that **involve two entity sets** are _binary_ (or degree two). （二元联系，二度联系）\n\
    \n+   - Relationship sets may **involve more than two entity sets**.  \n+    \
    \ E.g. Suppose employees of a bank may have jobs (responsibilities) at multiple\
    \ branches, with different jobs at different branches.  \n+     Then there is\
    \ a **ternary relationship set** between entity sets(  \n+     **employee, job\
    \ , branch** ) （三元联系集）\n\n+   - Relationships between more than two entity sets\
    \ are rare. Most relationships are binary. (More on this later.)"
  - "[PAGE 355]\n\n# # (2) Mapping Cardinalities (映射基数)\n\n+   - Express the number\
