    \ in XQuery\n- find all accounts with balance > 400, with each result enclosed\
    \ in an `<account_number> .. </account_number>` tag\n\n```\nfor $x in /bank-2/account\n\
    let $acctno := $x/@account_number\nwhere $x/balance > 400\nreturn <account_number>\
    \ { $acctno }\n</account_number>\n```\n\n- Items in the return clause are XML\
    \ text unless enclosed in {}, in which case they are evaluated\n- Let clause not\
    \ really needed in this query, and selection can be done In XPath. Query can be\
    \ written as:\n\n```\nfor $x in /bank-2/account[balance>400]\nreturn <account_number>\
    \ { $x/@account_number }\n</account_number>\n```\n\n## Joins\n\n- Joins are specified\
    \ in a manner very similar to SQL\n  for $a in /bank/account,\n    $c in /bank/customer,\n\
    \    $d in /bank/depositor\n  \n  where  $a/account_number = $d/account_number\n\
    \    and $c/customer_name = $d/customer_name\n  return <cust_acct> { $c $a } </cust_acct>\n\
    \n- The same query can be expressed with the selections specified as XPath selections:\n\
    \  for $a in /bank/account\n    $c in /bank/customer\n    $d in /bank/depositor[\n\
    \      account_number = $a/account_number and\n      customer_name = $c/customer_name]\n\
    \  return <cust_acct> { $c $a } </cust_acct>\n\n## Nested Queries\n\n- The following\
    \ query converts data from the flat structure for bank information into the nested\
    \ structure used in bank-1\n<bank-1> {\nfor $c in /bank/customer\nreturn\n<customer>\n\
