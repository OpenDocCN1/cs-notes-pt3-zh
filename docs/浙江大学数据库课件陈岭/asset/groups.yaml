  mdcn: "\n## (3) XSLT\n\n- A **stylesheet** (样式表) stores formatting options for a\
    \ document, usually separately from document\n  - E.g. an HTML style sheet may\
    \ specify font colors and sizes for headings, etc.\n\n- The **XML Stylesheet Language\
    \ (XSL)** was originally designed for generating HTML from XML\n\n- XSLT is a\
    \ general-purpose transformation language\n  - Can translate XML to XML, and XML\
    \ to HTML\n\n- XSLT transformations are expressed using rules called **templates**\n\
    \  - Templates combine selection using XPath with construction of results\n\n\
    XSL is a family of recommendations for defining XML document **transformation**\
    \ and **presentation**. It consists of three parts:\n\n- XSL Transformations (**XSLT**):\
    \ a language for transforming XML\n- the XML Path Language (**XPath**): an expression\
    \ language used by XSLT to access or refer to parts of an XML document. (XPath\
    \ is also used by the XML Linking specification)\n- XSL Formatting Objects (**XSL-FO**):\
    \ an XML vocabulary for specifying formatting semantics\n\n## (3) XSLT Templates\n\
    \n- **Example of XSLT template with** `match` **and** `select` **part**\n\n```xml\n\
    <xsl:template match=\"/bank-2/customer\">\n    <xsl:value-of select=\"customer_name\"\
    />\n</xsl:template>\n<xsl:template match=\"*\"/>\n```\n\n- The `match` attribute\
    \ of `xsl:template` specifies a pattern in XPath\n\n- Elements in the XML document\
    \ matching the pattern are processed by the actions within the `xsl:template`\
    \ element\n  - `xsl:value-of` selects (outputs) specified values (here, `customer_name`)\n\
