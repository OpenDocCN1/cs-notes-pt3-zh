    \ System' and\nT.score >=\n(select max(score) from study T, course C\nwhere T.course_no=C.course_no\
    \ and\ncourse_name='Database System'\n);\n```\n\n```sql\n(3) select course_name\n\
    from course\nwhere course_no in\n(select course_no from study\ngroup by course_no\n\
    having avg(score) >= all\n(select avg(score) from study\ngroup by course_no))\n\
    );\n```\n\n## (3) method2\n\n```sql\nwith course_avg(course_no, score_avg) as\n\
