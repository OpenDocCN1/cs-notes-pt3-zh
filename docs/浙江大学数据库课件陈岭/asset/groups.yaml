    \ in the referenced table can be **explicitly specified**\n  - but must be declared\
    \ as primary/candidate keys:\n  - ... foreign key *(account-number)* references\
    \ *account (account-number)*\n\n名字可以不同\n\n## Integrity constraint in SQL – Example\n\
    \n```\ncreate table customer\n(customer-name\tchar(20),\ncustomer-street\tvarchar(30),\n\
    customer-city varchar(30),\nprimary key (customer-name));\ncreate table branch\n\
    (branch-name varchar(15),\nbranch-city\tvarchar(30),\nassets\t\tinteger,\nprimary\
    \ key (branch-name));\n```\n\n## Referential Integrity in SQL – Example\n\n```\n\
    create table *account*\n    (*account-number* char(10),\n     *branch-name* char(15),\n\
    \     *balance* integer,\n     primary key (*account-number*),\n     **foreign\
    \ key** (*branch-name*) **references** *branch*);\n```\n\n```\ncreate table *depositor*\n\
    \    (*customer-name* char(20),\n     *account-number* char(10),\n     primary\
    \ key (*customer-name*, *account-number*),\n     **foreign key** (*account-number*)\
    \ **references** *account*,\n     **foreign key** (*customer-name*) **references**\
    \ *customer*);\n```\n\n## Cascading Actions in SQL\n\n```\ncreate table *account*(\n\
    \    ...\n    foreign key(*branch-name*) references *branch*\n        [ *on delete\
    \ cascade* ]\n        [ *on update cascade* ]\n    ... );\n```\n\n- Due to the\
    \ on delete cascade clauses, if a delete of a tuple in *branch* results in referential-integrity\
    \ constraint violation, the delete “cascades” to the *account* relation, deleting\
    \ the tuple in *account* that refers to the *branch* which was deleted.\n- Cascading\
    \ updates are similar.\n\n## Cascading Actions in SQL (Cont.)\n\n- If there is\
    \ a chain of foreign-key dependencies across multiple relations, with on delete\
    \ cascade specified for each dependency, a deletion or update at one end of the\
    \ chain can propagate across the entire chain.\n- But, if a cascading update or\
    \ delete causes a constraint violation that cannot be handled by a further cascading\
    \ operation, the system aborts the transaction.\n- As a result, all the changes\
    \ caused by the transaction and its cascading actions are undone.\n\n"
