  - '[PAGE 256]


    # # 4.2.1 Referential Integrity （参照完整性约束）


    +   - In Chapter 3 the concept was mentioned.

    +   - Formal Definition


    +   - Let \( r_1(R_1) \) and \( r_2(R_2) \) be relations with primary keys \(
    K_1 \) and \( K_2 \) respectively.


    +   - The subset \( \alpha \) of \( R_2 \) is a **foreign key** referencing \(
    K_1 \) in relation \( r_1 \), if for every \( t_2 \) in \( r_2 \) there **must**
    be a tuple \( t_1 \) in \( r_1 \) such that \( t_1[K_1] = t_2[\alpha] \).


    +   - Referential integrity constraint also called **subset dependency** since
    its can be written as \( \Pi_\alpha (r_2) \subseteq \Pi_{K_1} (r_1) \).


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_256_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_256_1.png)'
  - '[PAGE 257]


    # (Recall from chapter 2 about foreign key)


    Assume there exists relation r and s: r(A, **B**, C), s(**B**, D), we say attribute
    **B** is **foreign key** from relation r, and r is called *referencing relation*
    (参照关系), and s is called *referenced relation* (被参照关系).


    +   - e.g.

    +     - ◆ 学生(学号, 姓名, 性别, **专业号**, 年龄) --参照关系

    +     - 专业(**专业号**, 专业名称) --被参照关系（目标关系）

    +     - 其中属性 **专业号** 称为关系 *学生* 的外码。


    +   - ◆ Account(**account-number**, **branch-name**, balance) --参照关系

    +     - Branch(**branch-name**, branch-city, assets) --被参照关系


    参照关系中外码的值必须在被参照关系中实际存在，或为 null。'
  - '[PAGE 258]


    # # Checking Referential Integrity on Database Modification


    The following tests must be made in order to preserve the following referential
    integrity constraint:


    \(\Pi_\alpha (r_2) \subseteq \Pi_K (r_1) \quad \alpha \text{ in } r_2 \text{ is
    FK (Foreign Key)}\)


    **Insert.** If a tuple \(t_2\) is inserted into \(r_2\), the system must ensure
    that there is a tuple \(t_1\) in \(r_1\) such that \(t_1[K] = t_2[\alpha]\). That
    is

    \(t_2[\alpha] \in \Pi_K (r_1)\)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_258_0.png)'
