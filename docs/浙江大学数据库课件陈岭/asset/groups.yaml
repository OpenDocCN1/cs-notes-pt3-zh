  - '[PAGE 41]


    # # (3) SQL


    SQL= DDL+ DML+DCL


    SQL has been widely used.


    +   SQL (Structured Query Language, 结构化查询语言), 1975. IBM. System R. Called “SEQUEL”
    (Structured English QUEr y Language).


    +   E.g. find the name of the customer with customer-id 192-83-7465


    ```

    SELECT customer-name

    FROM customer

    WHERE customer-id = ''192-83-7465''

    ```


    +   E.g. find the balances of all accounts held by the customer with customer-id
    192-83-7465


    ```

    SELECT account.balance

    FROM depositor, account

    WHERE depositor.customer-id = ''192-83-7465'' and

    depositor.account-number = account.account-number

    ```'
