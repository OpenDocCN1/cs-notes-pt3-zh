    # Weak Entity Sets (Cont.)


    **Primary key for _payment_:**


    {**loan-number, payment-number**}


    **payment-number** is **discriminator** of the **payment** entity set


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_377_0.png)


    Owner entity set


    identifying relationship


    Weak entity set'
  - '[PAGE 378]


    # # Weak Entity Sets (Cont.)


    +   - Note: the primary key of the strong entity set is **NOT explicitly stored
    with the weak entity set**, since it is implicit in the identifying relationship.


    +   - If _loan-number_ were explicitly stored, _payment_ could be made a strong
    entity, but then the relationship between _payment_ and _loan_ would be **duplicated**
    by an implicit relationship defined by the attribute _loan-number_ common to _payment_
    and _loan_'
  - '[PAGE 379]


    # 6.6 Extended E-R features


    # (1) **Stratum** (层) of the entity set


    🔴 **Specialization**(特殊化、具体化)


    +   - Top-down design process; we designate subgroupings within an entity set
    that are distinctive from other entities in the set.

    +   - These subgroupings become lower-level entity sets that have attributes or
    participate in relationships that do NOT apply to the higher-level entity set.

    +   - **Attribute inheritance** — a lower-level entity set inherits all the attributes
    and relationship participation of the higher-level entity set to which it is linked.'
  - '[PAGE 380]


    # # Specialization Example


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_380_0.png)'
  - '[PAGE 381]


    # # Generalization （泛化、普遍化）


    +   A **bottom-up design process** – combine a number of entity sets that share
    the same features into a higher-level entity set.


    +   Specialization and generalization are simple inversions of each other; they
    are represented in an E-R diagram in the same way.


    +   The terms specialization and generalization are used interchangeably.'
  - '[PAGE 382]


    # # Design Constraints on a Specialization/Generalization


    Constraint on which entities can be members of a given lower-level entity set.


    +   - condition-defined （条件定义的）

    +     - E.g. all customers over 65 years are members of senior-citizen entity
    set; senior-citizen ISA person.


    +   - user-defined （用户定义的）

    +     - e.g. employee to different teams


    Constraint on whether or not entities may belong to more than one lower-level
    entity set within a single generalization.


    +   - Disjoint （不相交）

    +     - an entity can belong to only one lower-level entity set

    +     - Noted in E-R diagram by writing disjoint next to the ISA triangle


    +   - Overlapping （可重叠）

    +     - an entity can belong to more than one lower-level entity set.


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_382_0.png)'
  - '[PAGE 383]


    # # Design Constraints on a Specialization/Generalization (Cont.)


    Completeness constraint （完全性约束） - specifies whether or not an entity in the higher-level
    entity set must belong to at least one of the lower-level entity sets within a
    generalization.


    +   - total : an entity must belong to one of the lower-level entity sets （完全泛化）


    +   - partial: an entity need not belong to one of the lower-level entity sets
    （部分泛化）


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_383_0.png)'
