    \ Oxford | London |\n\n## Problems with 4NF Schema\n\n- 4NF design requires users\
    \ to include joins in their queries.\n- 1NF relational view *flat-books* defined\
    \ by join of 4NF relations:\n  - eliminates the need for users to perform joins,\n\
    \  - but loses the one-to-one correspondence between tuples and documents.\n \
    \ - And has a large amount of redundancy\n- Nested relations representation is\
    \ much more natural here.\n"
  mdcn: "\n## Correctness of 3NF Decomposition (Contd.)\n\n### Case 1: If B in β:\n\
    \n- If γ is a superkey, the 2nd condition of 3NF is satisfied.\n- Otherwise α\
    \ must contain some attribute not in γ.\n- Since γ → B is in F+, it must be derivable\
    \ from Fc, by using attribute closure on γ.\n- Attribute closure cannot have used\
    \ α → β — if it had been used, α must be contained in the attribute closure of\
    \ γ, which is not possible, since we assumed γ is not a superkey.\n- Now, using\
    \ α → (β - {B}) and γ → B, we can derive α → B (since γ ⊆ αβ, and B ∉ γ since\
    \ γ → B is non-trivial).\n- Then, B is extraneous in the right-hand side of α\
    \ → β; which is not possible since α → β is in Fc.\n- Thus, if B is in β then\
    \ γ must be a superkey, and the second condition of 3NF must be satisfied.\n\n\
