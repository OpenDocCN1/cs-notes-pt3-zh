  - '[PAGE 24]


    # # 1.4 Levels of Data Abstraction


    # ## How to use DB - Different usage needs different level of abstraction. (e.g.
    student score management system)


    +   - **Physical level**: describes how a record is stored. **Files**

    +   - **Logical level**: describes data stored in database, and the relationships
    among the data on upper level.

    +     comparative: type student = record

    +       sid: integer;

    +       sname: string;

    +       gender: string;

    +       age: integer;

