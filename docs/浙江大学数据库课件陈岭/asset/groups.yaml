  md: "\n## User Generated Identifiers (Cont.)\n\nCan use an existing primary key\
    \ value as the identifier:\n\n```sql\ncreate type Person\n(name varchar (20) primary\
    \ key,\n address varchar(20))\nref from (name)\ncreate table people of Person\n\
    ref is person_id derived\n```\n\nWhen inserting a tuple for _departments_, we\
    \ can then use\n\n```sql\ninsert into departments\nvalues('CS', 'John')\n```\n\
    \n## Implementing O-R Features\n\n- Similar to how E-R features are mapped onto\
    \ relation schemas\n- Subtable implementation\n  - Each table stores primary key\
    \ and those attributes defined in that table\n  - or,\n  - Each table stores both\
    \ locally defined and inherited attributes\n\n## Persistent Programming Languages\n\
    \n- Languages extended with constructs to handle persistent data\n- Programmer\
    \ can manipulate persistent data directly\n  - no need to fetch it into memory\
    \ and store it back to disk (unlike embedded SQL)\n- Persistent objects:\n  -\
    \ by class - explicit declaration of persistence\n  - by creation - special syntax\
    \ to create persistent objects\n  - by marking - make objects persistent after\
    \ creation\n  - by reachability - object is persistent if it is declared explicitly\
    \ to be so or is reachable from a persistent object\n\n## Object Identity and\
    \ Pointers\n\n- Degrees of permanence of object identity\n  - Intraprocedure:\
    \ only during execution of a single procedure\n  - Intraprogram: only during execution\
    \ of a single program or query\n  - Interprogram: across program executions, but\
    \ not if data-storage format on disk changes\n  - Persistent: interprogram, plus\
    \ persistent across data reorganizations\n- Persistent versions of C++ and Java\
    \ have been implemented\n  - C++\n    - ODMG C++\n    - ObjectStore\n  - Java\n\
    \    - Java Database Objects (JDO)\n\n## Comparison of O-O and O-R Databases\n\
    \n- **Relational systems**\n  - simple data types, powerful query languages, high\
    \ protection.\n- **Persistent-programming-language-based OODBs**\n  - complex\
    \ data types, integration with programming language, high performance.\n- **Object-relational\
    \ systems**\n  - complex data types, powerful query languages, high protection.\n\
    - Note: Many real systems blur these boundaries\n  - E.g. persistent programming\
    \ language built as a wrapper on a relational database offers first two benefits,\
    \ but may have poor performance.\n\n## PL/SQL\n\nPL/SQL is Procedural Language\
    \ Extension to SQL. Allows using general programming tools with SQL, for example:\
    \ loops, conditions, functions, etc. This allows a lot more freedom than general\
    \ SQL, and is lighter-weight than JDBC. We write PL/SQL code in a regular file,\
    \ for example PL.sql, and load it with @PL in the sqlplus console.\n\nNote: Oracle\
    \ is used to illustrate PL/SQL.\n\n## PL/SQL Blocks\n\nPL/SQL code is built of\
    \ Blocks, with a unique structure.\n\nThere are two types of blocks in PL/SQL:\n\
    \n1. **Anonymous Blocks:** have no name (like scripts)\n   - can be written and\
    \ executed immediately in SQLPLUS\n   - can be used in a trigger\n2. **Named Blocks:**\n\
    \   - Procedures\n   - Functions\n\n## Anonymous Block Structure:\n\n```text\n\
    DECLARE    (optional)\n/* Here you declare the variables you will use in this\
    \ block */\n\nBEGIN    (mandatory)\n/* Here you define the executable statements\
    \ (what the block DOES!)*/\n\nEXCEPTION    (optional)\n/* Here you define the\
    \ actions that take place if an exception is thrown during the run of this block\
    \ */\n\nEND;    (mandatory)\n```\n\n> Always put a new line with only a / at the\
    \ end of a block! (This tells Oracle to run the block)\n\n> A correct completion\
    \ of a block will generate the following message:  \n> PL/SQL procedure successfully\
    \ completed\n\n## Cygwin/X - inferno\n\n### XEmacs: PL3.sql\n\nFile Edit View\
    \ Options Tools Options Buffers SQL Help\n\nPL2.sql PL3.sql PR2.sql PR.sql Pl.sql\n\
    \n```sql\nDECLARE\npi number(9,7):=3.1415926;\nradius integer(5);\narea number(14,2);\n\
    valid boolean:=true;\nex areas.rad%type;\nTYPE TestType is record (typeName varchar2(30),\
    \ typeId number);\nt1 TestType;\ncursor cc is select * from sailors;\nsailorData\
    \ sailors%ROWTYPE;\nBEGIN\nradius:=3;\narea:=pi*power(radius,2);\ninsert into\
    \ areas values(radius,area);\nt1.typeName:='bobo';\nt1.typeId:=9;\nopen cc;\n\
    fetch cc into sailorData;\nEND;\n/\n```\n\n--- XEmacs: PL3.sql 5:15 (SQL Font)\
    \ ---L8--C13--All---\n\nFont -*-Courier-medium-r-*-*-*-180-*-*-*-*-iso8859-*\n"
