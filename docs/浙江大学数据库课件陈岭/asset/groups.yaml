  - '[PAGE 228]


    # Transactions (Cont.)


    +   - The four properties of transaction are required:

    +     **atomicity, isolation, consistency, durability**

    +     (see chpt15)


    +   - By the way, in some database systems, each SQL statement that executes successfully
    is automatically committed. （但少见）

    +     - Each transaction would then consist of only a single statement

    +     - Automatic commit can usually be turned off, allowing multi_statement transactions,
    but how to do so depends on the database system

    +     - Another option in SQL:1999: enclose statements within

    +       **begin atomic**

    +       **.....**

    +       **end**'
  - '[PAGE 229]


    # 3.10 Joined Relations


    +   - Join operations take two relations and return as a result another relation.

    +   - **Join condition** — defines which tuples in the two relations match, and
    what attributes are present in the result of the join.

    +   - **Join type** — defines how tuples in each relation that do not match any
    tuple in the other relation (based on the join condition) are treated.


    | Join Types | Join Conditions |

    |---|---|

    | inner join<br>left outer join<br>right outer join<br>full outer join | natural<br>on
    <predicate><br>using (A₁, A₂, ..., Aₙ) |'
