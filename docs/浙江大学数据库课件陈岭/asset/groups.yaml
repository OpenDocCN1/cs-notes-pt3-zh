  - '[PAGE 470]


    # # 7.6 Third Normal Form: Motivation


    +   - There are some situations where

    +     - Decompose into BCNF is not dependency preserving,

    +     - But efficient checking for FD violation on updates is important.


    +   - Solution: define a weaker normal form, called Third Normal Form.

    +     - Allows some redundancy (with resultant problems).

    +     - But FDs can be checked on individual relations without computing a join
    - dependency preserving.

    +     - There is always a lossless-join, dependency preserving decomposition into
    3NF.'
  - "[PAGE 471]\n\n# # Third Normal Form\n\n■ **Definition:** A relation schema *R*\
    \ is in third normal form (3NF) if for all α → β in F⁺ at least one of the following\
    \ holds:\n\n+   1. α → β is **trivial** (i.e., β ⊆ α)\n+   2. α is a **superkey**\
    \ for *R*\n+   3. Each attribute *A* in β − α is contained in a **candidate key**\
    \ for *R*.\n+   \n+   *NOTE: each attribute may be in a different candidate key*\n\
    \n■ If a relation is in BCNF, it is in 3NF (since in BCNF one of the first two\
    \ conditions above must hold).\n\n■ Third condition is a minimal relaxation of\
    \ BCNF to ensure dependency preservation.\n\n> 讨论：国内其他教材关于3NF的定义：不存在非主属性对码的部分依赖和传递依赖。\n\
    > 。该定义实际是说，当β为非主属性时，α必须是码；但当β为主属性时，则α无限制。\n> 。二种定义本质上是一致的。"
  - '[PAGE 472]


    # # 3NF (Cont.)


    # ## Example


    +   - R = (J, K, L)

    +     F = {JK → L, L → K}


    +   - Two candidate keys: JK and JL


