  md: "\n## (1) Attribute Types\n\n- Each attribute of a relation has a name.\n- The\
    \ set of allowed values for each attribute is called the **domain (域)** of the\
    \ attribute.\n- **Attribute values** are (normally) required to be **atomic**,\
    \ that is, indivisible. (1st NF, 第一范式)\n  - E.g. **multivalued attribute** values\
    \ are **not atomic**\n  - E.g. **composite attribute** values are **not atomic**\n\
    - The special value *null* is a member of every domain.\n- The *null* value causes\
    \ complications in the definition of many operations.\n  - we shall ignore the\
    \ effect of null values for the moment and consider their effect later.\n\n##\
    \ (2) Concepts about relation\n\n- A Relation is concerned with two concepts :\
    \ relation schema and relation instance.\n\n- The relation schema describe the\
    \ structure of the relation.\n\nE.g. Student-schema= (sid : string, name: string,\
    \ sex: string, age: int, dept: string) or Student-schema= (sid, name, sex, age,\
    \ dept)\n\n- The relation instance corresponds to the snapshot of the data in\
    \ the relation at a given instant in time.\n\n- C.f.: Database schema and database\
    \ instance.\n\n## (2-a) Relation Schema\n\n- \\( A_1, A_2, \\dots, A_n \\) are\
    \ attributes\n\n- Formally expressed :\n\n\\( R = (A_1, A_2, \\dots, A_n) \\)\
    \ is a **relation schema**\n\nE.g. **Customer-schema** = (customer-name, customer-street,\
    \ customer-city)\n\n- \\( r(R) \\) is a **relation** on the **relation schema**\
    \ \\( R \\)\n\nE.g. **customer** (**Customer-schema**)\n\n= **customer** (customer-name,\
    \ customer-street, customer-city)\n\n## (2-b) Relation Instance\n\n- The current\
    \ values (_relation instance_) of a relation are specified by a table.\n\n- An\
    \ element _t_ of _r_ is a _tuple_, represented by a _row_ in a table.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_67_0.png)\n\
    \n- Let a _tuple variable_ _t_ stands for a tuple. Then _t_[_customer-name_] denotes\
    \ the value of _t_ on the _customer-name_ attribute.\n\n## (4) Keys（码、键）\n\n-\
    \ Let K ⊆ R\n\n- K is a superkey（超码）of R if values for K are sufficient to identify\
    \ a unique tuple of each possible relation r(R)\n\n- Example: { student-id, student-name\
    \ } and { student-id } are both superkeys of student.\n\n- K is a candidate key（候选码）if\
    \ K is minimal superkey. Example: {student-id} is a candidate key for student,\
    \ since it is a superkey, and no subset of it is a superkey.\n\n- K is a primary\
    \ key（主码）, if k is a candidate key and been defined by user explicitly. Primary\
    \ key is usually marked by underline.\n\n## (5) Foreign key(外键，外码)\n\nAssume there\
    \ exists relation **r**and **s**: r(**A**, **B**, C), s(**B**, D), we can say\
    \ that attribute B in relation **r** is foreign key referencing **s**, and **r**\
    \ is a referencing relation (参照关系), and **s** is a referenced relation (被参照关系).\n\
    \ne.g. ◆ 学生(学号,姓名,性别,专业号,年龄) - 参照关系 专业(专业号,专业名称) - 被参照关系 (目标关系) 其中属性 专业号称为关系 学生的外码。\n\
    \n选修(学号, 课程号, 成绩) 课程(课程号,课程名, 学分, 先修课号)\n\n◆ Account(**account-number**, branch-name,\
    \ balance) --- referenced relation depositor (customer-name, **account-number**)\
    \ --- referencing relation\n\n参照关系中外码的值必须在被参照关系中实际存在或为**null**\n\n## (6) Schema\
    \ Diagram (模式图) for the Banking Enterprise\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_71_0.png)\n\
    \n被参照关系 ← 参照关系\n\n## (7) Query Languages\n\nLanguage in which user requests information\
