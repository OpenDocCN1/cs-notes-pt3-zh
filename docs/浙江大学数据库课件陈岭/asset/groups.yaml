    \ all**, **intersect all** and **except all**.\n\n### 3.3 Set Operations (cont.)\n\
    \n- Suppose a tuple occurs _m_ times in _r_ and _n_ times in _s_, then, it occurs:\n\
    \  - _m + n_ times in ( _r_ **union all** _s_ )\n  - min(_m,n_) times in ( _r_\
    \ **intersect all** _s_ )\n  - max(0, _m - n_) times in ( _r_ **except all** _s_\
    \ )\n\n> 当M < n\n\n> 当M > n\n\n### Set Operations - examples\n\n- Example 1: Find\
    \ all customers who have a loan, (or) an account, or both:\n\n(SELECT *customer_name*\
    \ FROM *depositor*) UNION (SELECT *customer_name* FROM *borrower*);\n\n- Example\
    \ 2: Find all customers who have both a loan and an account.\n\n(SELECT customer_name\
    \ FROM depositor) INTERSECT (SELECT customer_name FROM borrower);\n\ndepositor\
    \ (customer_name, account_number)\nborrower (customer_name, loan_number)\n\n###\
    \ Set Operations (cont.)\n\n- Example 3: Find all customers who have an account\
    \ **but no loan.**\n\n```\n(SELECT *customer_name* FROM *depositor*)\n**EXCEPT**\
    \ (SELECT *customer_name* FROM *borrower*);\n```\n\n- In Oracle, use *union, union\
    \ ALL, intersect and Minus;* **but no Intersect ALL and Minus ALL.**\n\n- In SQL\
    \ Server 2000, only support *Union, Union All.*\n\n### Aggregate Functions (Cont.)\n\
    \n- example 2: Find the average account balance for each branch.\n\nSELECT branch_name,\
    \ avg(balance) avg_bal FROM account GROUP BY branch_name;\n\n| Branch name | avg\
    \ bal |\n|-------------|---------|\n| Downtown    | 600     |\n| Mianus      |\
    \ 725     |\n| Round Hill  | 350     |\n| Redwood     | 700     |\n\n| account-number\
    \ | branch-name | balance |\n|----------------|-------------|---------|\n| A-101\
    \          | Downtown    | 500     |\n| A-215          | Mianus      | 700   \
    \  |\n| A-102          | Downtown    | 400     |\n| A-305          | Round Hill\
    \  | 350     |\n| A-201          | Downtown    | 900     |\n| A-222          |\
    \ Redwood     | 700     |\n| A-217          | Mianus      | 750     |\n\n### Aggregate\
    \ functions (Cont.)\n\n- **Example3:** Find the number of depositors for each\
    \ branch.\n\n```\nSELECT branch_name, count (distinct customer_name) as tot_num\n\
    FROM depositor D, account A\nWHERE D.account_number = A.account_number\nGROUP\
    \ BY branch_name;\n```\n\n| Relation | Attributes |\n|---|---|\n| Account | account_number,\
    \ branch_name, balance |\n| Depositor | customer_name, account_number |\n\n"
