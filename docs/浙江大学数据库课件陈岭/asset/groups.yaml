  md: "\n## XML: Motivation\n\n- **Data interchange** is critical in today’s networked\
    \ world\n  - **Examples:**\n    - Banking: funds transfer\n    - Order processing\
    \ (especially inter-company orders)\n    - …\n  - Paper flow of information between\
