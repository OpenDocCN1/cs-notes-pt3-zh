- raw:
  - '[PAGE 276]


    # Triggering Events and Actions in SQL


    +   - Triggering event can be **insert**, **delete** or **update**


    +   - Triggers **on update** can be restricted to specific attributes:

    +     - E.g. create trigger *overdraft-trigger*

    +       *after update of* *balance* *on account* …


    +   - Values of attributes **before** and **after** an update can be referenced:

    +     - referencing old row as orow: for deletes and updates

    +     - referencing new row as nrow: for inserts and updates'
  - '[PAGE 277]


    # Statement Level Triggers


    Instead of executing a separate action for each affected row, a single action
    can be executed for all rows affected by a transaction.


    +   - Use *for each statement* instead of *for each row*

    +   - Use *referencing old table* or *referencing new table* to refer to temporary
    tables (called *transition tables*) containing the affected rows

    +   - Can be more efficient when dealing with SQL statements that update a large
    number of rows.'
  - '[PAGE 278]


    # # External World Actions


    We sometimes require external world actions to be triggered on a database update


    +   E.g. re-ordering an item whose quantity in a warehouse has become small, or
    turning on an alarm light. （当库存低于警戒线，增加订货或报警）


    # ## Triggers cannot be used to directly implement external-world actions, BUT


    +   Triggers can be used to record actions-to-be-taken in a separate table;


    +   Have an external process that repeatedly scans the table, carries out external-world
    actions and deletes action from table.'
  - '[PAGE 279]


    # # External World Actions(cont.)


    E.g. Suppose a warehouse has the following tables


    +   inventory(item, level): How much of each item is in the warehouse presently


