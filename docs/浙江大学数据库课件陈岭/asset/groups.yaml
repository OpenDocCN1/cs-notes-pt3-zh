  md: "\n\n## Bank DTD with Attributes\n\nBank DTD with ID and IDREF attribute types.\n\
    \n```xml\n<!DOCTYPE bank-2 [\n<!ELEMENT account (branch_name, balance)>\n<!ATTLIST\
    \ account\naccount_number ID # REQUIRED\nowners IDREFS # REQUIRED>\n<!ELEMENT\
    \ customer(customer_name,\ncustomer_street, customer_city)>\n<!ATTLIST customer\n\
    customer_id ID # REQUIRED\naccounts IDREFS # REQUIRED>\n... declarations for branch_name,\
    \ balance,\ncustomer_name, customer_street and customer_city\n] >\n<! ELEMENT\
    \ branch_name (#PCDATA)>\n<! ELEMENT balance(#PCDATA)>\n<! ELEMENT customer_name(#PCDATA)>\n\
    <! ELEMENT customer_street(#PCDATA)>\n<! ELEMENT customer_city(#PCDATA)>\n```\n\
    \n## XML data with ID and IDREF attributes\n\n```xml\n<bank-2>\n  <account account_number=\"\
    A-401\" owners=\"C100 C102\">\n    <branch_name> Downtown </branch_name>\n   \
    \ <balance> 500 </balance>\n  </account>\n  <customer customer_id=\"C100\" accounts=\"\
    A-401\">\n    <customer_name>Joe </customer_name>\n    <customer_street> Monroe\
    \ </customer_street>\n    <customer_city> Madison</customer_city>\n  </customer>\n\
    \  <customer customer_id=\"C102\" accounts=\"A-401 A-402\">\n    <customer_name>\
    \ Mary </customer_name>\n    <customer_street> Erin </customer_street>\n    <customer_city>\
    \ Newark </customer_city>\n  </customer>\n</bank-2>\n```\n\n## Example\n\n```xml\n\
    <bookstore>\n  <book ISBN=\"7-04-011049-0\">\n    <title>Dadatabase System Concepts</title>\n\
    \    <author>Abraham Silberschatz</author>\n    <author>Henry F. Korth</author>\n\
    \    <author>S.Sudarshan</author>\n    <price>59.5</price>\n  </book>\n  <book\
    \ ISBN=\"0-06-662099-6\">\n    <title>Good to Great</title>\n    <author>Jim Collins</author>\n\
    \    <price>88.9</price>\n  </book>\n</bookstore>\n```\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_608_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_608_1.png)\n\n```xml\n<!DOCTYPE bookstore\
    \ [\n<!ELEMENT bookstore ((book) + ) >\n<!ELEMENT book ( title author * price\
    \ ) >\n<!ATTLIST book\nISBN ID #REQUIRED >\n<!ELEMENT title ( #PCDATA ) >\n<!ELEMENT\
    \ author (#PCDATA )>\n<!ELEMENT price ( #PCDATA ) >\n] >\n```\n\n## Limitations\
    \ of DTDs\n\n- No typing of text elements and attributes\n  - All values are strings,\
    \ no integers, reals, etc.\n- Difficult to specify unordered sets of subelements\n\
    \  - Order is usually irrelevant in databases (unlike in the document-layout environment\
    \ from which XML evolved)\n  - `(A | B)*` allows specification of an unordered\
    \ set, but cannot ensure that **each of A and B occurs only once**\n- IDs and\
    \ IDREFs are untyped\n  - The _owners_ attribute of an account may contain a reference\
    \ to another account, which is meaningless\n    - owners attribute should ideally\
    \ be constrained to refer to customer elements\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_610_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_610_1.png)\n\n## (2) XML Schema\n\n\
    - XML Schema is a more sophisticated schema language which addresses the drawbacks\
    \ of DTDs. Supports\n  - Typing of values\n    - E.g. integer, string, etc\n \
    \   - Also, constraints on min/max values\n  - User-defined, complex types\n \
    \ - Many more features, including\n    - uniqueness and foreign key constraints,\
    \ inheritance\n- XML Schema is itself specified in XML syntax, unlike DTDs\n \
    \ - More-standard representation, but verbose\n- XML Scheme is integrated with\
    \ namespaces\n- BUT: XML Schema is significantly more complicated than DTDs.\n\
    \n## XML Schema Version of Bank DTD\n\n```xml\n<xs:schema xmlns:xs=http://www.w3.org/2001/XMLSchema>\n\
    <xs:element name=\"bank\" type=\"BankType\"/>\n<xs:element name=\"account\">\n\
    \    <xsi:complexType>\n        <xsi:sequence>\n            <xsi:element name=\"\
    account_number\" type=\"xs:string\"/>\n            <xsi:element name=\"branch_name\"\
    \    type=\"xs:string\"/>\n            <xsi:element name=\"balance\"       type=\"\
    xs:decimal\"/>\n        </xsi:sequence>\n    </xsi:complexType>\n</xs:element>\n\
    ```\n\n## XML Schema Version of Bank DTD\n\n...definitions of customer and depositor...\n\
    \n```xml\n<xs:complexType name=\"BankType\">\n  <xs:sequence>\n    <xs:element\
    \ ref=\"account\" minOccurs=\"0\"\n                maxOccurs=\"unbounded\"/>\n\
    \    <xs:element ref=\"customer\" minOccurs=\"0\"\n                maxOccurs=\"\
    unbounded\"/>\n    <xs:element ref=\"depositor\" minOccurs=\"0\"\n           \
    \     maxOccurs=\"unbounded\"/>\n  </xs:sequence>\n</xs:complexType>\n</xs:schema>\n\
    ```\n\n"
