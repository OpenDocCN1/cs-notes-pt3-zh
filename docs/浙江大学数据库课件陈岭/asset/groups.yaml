    \nAll attributes of an original schema (R) must appear in the decomposition (R1,\
    \ R2): R = R1 ∪ R2\n\nLossless-join decomposition (无损连接分解).  \nFor all possible\
    \ relations r on schema R\n\nr = ΠR1 (r) ⋈ ΠR2 (r)\n\nRequirement for decomp.\n\
    \n## Example of Non Lossless-Join Decomposition\n\n## Decomposition of R = (A,\
