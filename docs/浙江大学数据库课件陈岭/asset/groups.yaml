  md: "\n## Example of Computing a Canonical Cover\n\n- \\(R = (A, B, C)\\)\n- \\\
    (F = \\{ A \\to BC,\\ B \\to C,\\ A \\to B,\\ AB \\to C \\}\\)\n\n- Combine \\\
    (A \\to BC\\) and \\(A \\to B\\) into \\(A \\to BC\\)\n  - Set is now \\(F' =\
    \ \\{A \\to BC,\\ B \\to C,\\ AB \\to C\\}\\)\n\n- \\(A\\) is extraneous in \\\
    (AB \\to C\\)\n  - Check if the result of deleting A from \\(AB \\to C\\) is implied\
    \ by the other dependencies \\(B \\to C\\)\n  - Set is now \\(F' = \\{A \\to BC,\\\
    \ B \\to C\\}\\)\n\n- \\(C\\) is extraneous in \\(A \\to BC\\)\n  - Check if \\\
    (A \\to C\\) is logically implied by \\(A \\to B\\) and \\(B \\to C\\)\n\nThe\
    \ canonical cover is: \\(F_c = \\{A \\to B,\\ B \\to C\\}\\)\n\n## 7.4 Decomposition（分解）\n\
    \n### (1) Goals of Normalization（规范化的目标）\n\n- Judge whether a particular relation\
    \ \\(R\\) is in “good” form. （no redundant, insert/delete/update anomalies）\n\n\
    - In the case that a relation \\(R\\) is **not in “good” form**, **decompose it**\
    \ into a set of relations \\(\\{R_1, R_2, \\ldots, R_n\\}\\) such that:\n\n  -\
    \ the decomposition is a lossless-join decomposition.（无损连接分解）\n  - the decomposition\
    \ is dependency preservation.（依赖保持）\n  - each relation \\(R_i\\) is in good form\n\
    \    - BCNF or 3NF.\n\n### (2) Desirable Properties of Decomposition（分解应有的特性）\n\
    \n- 1) All attributes of an original schema (\\(R\\)) must appear in the decomposition\
    \ (\\(R_1\\), \\(R_2\\)):\n  \\(R = R_1 \\cup R_2\\)\n\n- 2) Lossless-join decomposition.\n\
    \  For all possible relations \\(r\\) on schema \\(R\\)\n  - \\(r = \\Pi_{R_1}(r)\
    \ \\Join \\Pi_{R_2}(r)\\)\n  - A decomposition of R into \\(R_1\\) and \\(R_2\\\
    ) is lossless-join if and only if at least one of the following dependencies are\
    \ held in \\(F^+\\):\n    - \\(\\{R_1 \\cap R_2\\} \\rightarrow R_1\\)\n    -\
    \ or\n    - \\(\\{R_1 \\cap R_2\\} \\rightarrow R_2\\)\n\n  无损连接分解的条件：\n  分解后的二个子模式的共同属性必须是R1或R2的码。（适用于一分为二的分解）\n\
