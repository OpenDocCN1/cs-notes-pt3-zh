    Example 5: Find the **names of all customers** who have a **loan** at the **Perryridge
    branch**.


    Query1: \(\Pi_{customer-name}(\sigma_{branch-name=\text{“Perryridge”}}(\sigma_{borrower.loan-number
    = loan.loan-number}(borrower \times loan)))\)


    Query2: \(\Pi_{customer-name}(\sigma_{borrower.loan-number = loan.loan-number}(borrower
    \times (\sigma_{branch-name=\text{“Perryridge”}}(loan))))\)


    **Query2 is better.**


    ```

    loan (loan-number, branch-name, amount)

    borrower (customer-name, loan-number)

    ```


    ## Example Queries


    ■ Example 6: Find the names of all customers who have a loan at the Perryridge
    branch but do not have an account at any branch of the bank.


