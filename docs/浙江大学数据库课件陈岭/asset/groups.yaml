    \ to another may be represented by an **authorization graph**.\n- The nodes of\
    \ this graph are the users.\n- The root of the graph is the database administrator.\n\
    - Consider the graph for update authorization on loan.\n- An edge \\(U_i \\rightarrow\
    \ U_j\\) indicates that user \\(U_i\\) has granted *update* authorization on *loan*\
    \ to \\(U_j\\).\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_293_0.png)\n\n###\
    \ (4) Security Specification in SQL\n\n- The grant statement is used to confer\
    \ authorization:\n\n```sql\nGRANT <privilege list> ON <relation name or view name>\
    \ TO <user list>;\n```\n\n- <user list> is:\n  - a **user-id**\n  - *public*,\
    \ which allows all valid users the privilege granted\n  - **A role** (more on\
    \ this later)\n\n- Granting a privilege on a view does NOT imply granting any\
    \ privileges on the underlying relations.\n- The grantor of the privilege must\
    \ already hold the privilege on the specified item (or be the database administrator).\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_295_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_295_1.png)\n"
  mdcn: "\n## Authorization\n\n### Physical level\n\n- Physical access to computers\
    \ allows destruction of data by intruders; traditional lock-and-key security is\
    \ needed.\n- Computers must also be protected from floods, fire, etc.\n- More\
    \ in Chapter 17 (Recovery).\n\n### Human level\n\n- Users must be screened to\
    \ ensure that authorized users do not give access to intruders.\n- Users should\
    \ be trained on password selection and secrecy.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_286_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_286_1.png)\n\n### (1) Authorization\n\
    \nForms of authorization on parts of the database:\n\n- **Read authorization**\
    \ – allows reading, but not modification of data.\n- **Insert authorization**\
    \ – allows insertion of new data, but not modification of existing data.\n- **Update\
    \ authorization** – allows modification, but not deletion of data.\n- **Delete\
    \ authorization** – allows deletion of data.\n\nForms of authorization to modify\
    \ the database schema:\n\n- Index authorization – allows creation and deletion\
    \ of indices.\n- Resource authorization – allows creation of new relations.\n\
    - Alteration authorization – allows addition or modification of attributes in\
    \ a relation.\n- Drop authorization – allows deletion of relations.\n\n### (2)\
    \ Authorization and Views\n\n- Users can be given **authorization on views**,\
    \ without being given any authorization on the relations used in the view definition.\n\
    - Ability of **views** to **hide data** serves both to **simplify usage** of the\
    \ system and to **enhance security** by allowing users access only to data they\
    \ need for their job.\n- A **combination of relational-level security and view-level\
    \ security** can be used to limit a user’s access to precisely the data that user\
    \ needs.\n\n### View Example\n\nSuppose a bank clerk needs to know the names of\
    \ the customers of each branch, but is not authorized to see specific loan information.\n\
    \n- Approach: Deny direct access to the *loan* relation, but grant access to the\
    \ view *cust_loan*, which consists only of the names of customers and the branches\
    \ at which they have a loan.\n\nThe *cust_loan* view is defined in SQL as follows:\n\
    \n```sql\ncreate view cust_loan as\nselect branch_name, customer_name\nfrom borrower,\
    \ loan\nwhere borrower.loan_number = loan.loan_number;\n```\n\n- The clerk is\
    \ authorized to see the result of the query:\n\n```sql\nselect *\nfrom cust_loan;\n\
    ```\n\n- When the query processor translates the query into a query on the actual\
    \ relations in the database, we obtain a query on *borrower* and *loan*.\n- Authorization\
    \ must be checked on the clerk’s query before query processing replaces a view\
    \ by the definition of the view.\n\n### Authorization on Views\n\n- Creation of\
    \ view does NOT require resource authorization since no real relation is being\
    \ created.\n- The **creator of a view** gets only those privileges that provide\
    \ no additional authorization beyond that he already had.\n  - E.g. if creator\
    \ of view *cust_loan* had only read authorization on *borrower* and *loan*, he\
    \ gets only read authorization on *cust_loan*.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_292_0.png)\n\
    \n### (3) Granting of Privileges\n\n- The passage of authorization from one user\
    \ to another may be represented by an **authorization graph**.\n- The nodes of\
    \ this graph are the users.\n- The root of the graph is the database administrator.\n\
    - Consider the graph for update authorization on loan.\n- An edge \\(U_i \\rightarrow\
    \ U_j\\) indicates that user \\(U_i\\) has granted *update* authorization on *loan*\
    \ to \\(U_j\\).\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_293_0.png)\n\n###\
    \ (4) Security Specification in SQL\n\n- The grant statement is used to confer\
    \ authorization:\n\n```sql\nGRANT <privilege list> ON <relation name or view name>\
    \ TO <user list>;\n```\n\n- <user list> is:\n  - a **user-id**\n  - *public*,\
    \ which allows all valid users the privilege granted\n  - **A role** (more on\
    \ this later)\n\n- Granting a privilege on a view does NOT imply granting any\
    \ privileges on the underlying relations.\n- The grantor of the privilege must\
    \ already hold the privilege on the specified item (or be the database administrator).\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_295_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_295_1.png)\n"
