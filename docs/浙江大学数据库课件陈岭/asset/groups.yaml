    # # (3) Union Operation (cont.)


    +   - Notation: \( r \cup s \)


    +   - Defined as: \( r \cup s = \{t \mid t \in r \text{ or } t \in s \} \)


    +   - For \( r \cup s \) to be valid:


    +   1. \( r, s \) must have the **same arity** (等目,同元,same number of attributes)


    +   2. The attribute domains must be **compatible** (e.g., 2nd column of \( r
    \) deals with the same type of values as does the 2nd column of \( s \))


    +   - E.g. to find all customers with either an account or a loan


    \(\Pi_{\text{customer-name}}(\text{depositor}) \cup \Pi_{\text{customer-name}}(\text{borrower})\)'
