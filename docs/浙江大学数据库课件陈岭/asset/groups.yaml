  md: "\n## 方法1：利用数据库管理系统提供的交互工具访问数据库\n\n如：SQL Server的查询分析器，Oracle的SQL*Plus，Worksheet\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_13_0.png)\n\n## 1.2 What is a database\n\
    \nDefinition\n\n### Database:\n\n- A collection of **interrelated data**, relevant\
    \ to an enterprise.\n- A large collection of **integrated and persistent** data\
    \ (DB). [R. Ramakrishnan, J. Gehrke]\n- A collection of information that exists\
    \ over a long period of time, often many years. [Ullman]\n- 长期存储在计算机内、有组织的、可共享的数据集合。[萨师煊，王珊]\n\
    \n### Database Management System (DBMS):\n\n**Database** + A **set of programs**\
    \ used to access, update and manage the data in database.\n\n## 1.3 DBMS—A Historical\
    \ Perspective\n\n### File processing system (1950s-1960s)\n\n### Network and hierarchical\
    \ DBMS (1960s-1970s)\n\n- 网状数据模型、层次数据模型 — 网状数据库、层次数据库（结构复杂、使用很困难）\n\n### Relational\
    \ database systems (RDBMS)\n\n- Relational model (1970, E.F. Codd)\n- Relational\
    \ database system developed (late 1970s)\n- Relational database systems on the\
    \ market (1980s)\n- Matured relational DBMS technology (1990s)\n- Object-oriented\
    \ database system (OODBMS)\n- Object-relational database systems (ORDBMS)\n- Application-oriented\
    \ database systems\n  - Spatial, temporal, multimedia, Web databases\n- Data Warehousing\
    \ (数据仓库), Online Analytical Processing (联机分析处理) and Data Mining (数据挖掘) systems\
    \ (for data analysis)\n\n## Database system versus File Processing Systems (Cont.)\n\
    \n### Drawbacks of using file systems (cont.)\n\n- **Difficulty** in accessing\
    \ data\n  - Need to write a new program to carry out each new task.\n- **Data\
    \ isolation** — multiple files and multiple formats. (Difficult to retrieve, difficult\
    \ to share)\n- **Integrity** problems\n  - Integrity constraints (e.g. account\
    \ balance > 0) become part of program code\n  - Hard to add new constraints or\
    \ change existing ones\n- **No atomicity of updates (consistent)**\n  - Failures\
    \ may leave database in an inconsistent state with partial updates carried out.\n\
    \  - E.g. transfer of funds from one account to another should either complete\
    \ or not happen at all – atomicity.\n- **Difficult to concurrent access by multiple\
    \ users**\n  - Concurrent access needed for performance\n  - Uncontrolled concurrent\
    \ accesses can lead to inconsistencies\n    - E.g. two people reading a balance\
    \ and updating it at the same time\n- **Security problems (Right person use right\
    \ data)**\n\nDatabase systems offer solutions to all the above problems!\n\n##\
    \ The DBMS Marketplace\n\n- Relational DBMS companies:\n  - Oracle, Sybase — are\
    \ among the largest database software companies in the world.\n  - IBM DB2 — is\
    \ by some accounts the largest DBMS vendor in the world.\n  - Microsoft SQL Server,\
    \ plus Microsoft Access for the cheap DBMS on the desktop, answered by “lite”\
    \ systems from other competitors.\n- Relational companies also challenged by “object-oriented\
    \ DB” companies.\n- But countered with “object-relational” systems, which retain\
    \ the relational core while allowing type extension as in OO systems.\n- Other\
    \ database products: Ingres, Paradox, Foxbase, FoxPro, dBase,...\n\n## 1.4 Levels\
    \ of Data Abstraction\n\n### How to use DB — Different usage needs different level\
    \ of abstraction. (e.g. student score management system)\n\n- **Physical level**:\
    \ describes how a record is stored. **Files**\n- **Logical level**: describes\
    \ data stored in database, and the relationships among the data on upper level.\n\
    \n  comparative:\n\n  ```pascal\n  type student = record\n      sid: integer;\n\
    \      sname: string;\n      gender: string;\n      age: integer;\n      deptno:\
    \ integer;\n  end;\n  ```\n\n- **View level**: application programs hide details\
    \ of data types. Views can also hide information (e.g., employee’s salary) for\
    \ security purposes.\n"
