    # # 7.5 Boyce-Codd Normal Form


    # ## (1) Definition


    A relation schema \( R \) is in BCNF, with respect to a set \( F \) of functional
    dependencies, if **for all functional dependencies** in \( F^+ \) of the form
    \( \alpha \rightarrow \beta \), where \( \alpha \subseteq R \) and \( \beta \subseteq
    R \), **at least one of the following holds**:


    +   - \( \alpha \rightarrow \beta \) is trivial (i.e., \( \beta \subseteq \alpha
    \) )

    +   - \( \alpha \) is a superkey for \( R \) (i.e., \( R \subseteq \alpha^+ \)
    , \( \alpha \rightarrow R \))


    > > For **all** \( \alpha \rightarrow \beta \) in \( F^+ \), where \( \alpha \subseteq
    R \) and \( \beta \subseteq R \)


