- raw:
  - '[PAGE 267]


    # # Cascading Actions in SQL (Cont.)


    # ## Note: Referential integrity is only checked at the end of a transaction !!


    +   - That is: Intermediate steps are allowed to violate referential integrity
    provided later steps remove the violation by the end of the transaction.


    +   - Otherwise it would be impossible to create some database states, e.g. insert
    two tuples whose foreign keys point to each other


    +   - E.g. spouse attribute of relation: marriedperson (name, address, spouse)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_267_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_267_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_267_2.png)'
  - '[PAGE 268]


    # Referential Integrity in SQL (Cont.)


    +   - **Alternative to cascading:**

    +     - on delete set null

    +     - on delete set default


    +   - **Null values in foreign key attributes complicate SQL referential integrity
    semantics, and are best prevented using not null.**

    +     - if any attribute of a foreign key is null, the tuple is defined to satisfy
    the foreign key constraint!'
  - '[PAGE 269]


    # # 4.2.2 Assertions (断言)


    An *assertion* is a predicate expressing a condition that we wish the database
    always to satisfy.--- for **complex check condition** on several relations !


    An assertion in SQL takes the form:

    CREATE ASSERTION <assertion-name>

    CHECK <predicate> ;


    When an assertion is made, the system tests it for validity on **every update**
    that may violate the assertion. (when the *predicate* is true, it is Ok, otherwise
    report error.)


    This testing may introduce a significant amount of overhead; hence **assertions
    should be used with great care.**


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_269_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_269_1.png)'
  - '[PAGE 270]


    # # Assertions(cont.)


    E.g. If we require “the sum of all loan amounts for each branch must be less than
    the sum of all account balances at the branch”.


    But SQL does not provide a construct for asserting:

    for all X, P(X)

    So it is achieved in a round-about fashion, using :

    not exists X, such that not P(X)


    ∴ (∀x)P(x) = ¬ (∃x) ¬ P(x)'
