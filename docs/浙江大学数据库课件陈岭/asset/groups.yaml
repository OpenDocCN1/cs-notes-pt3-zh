    # # Querying Collection-Valued Attributes


    +   To find all books that have the word “database” as a keyword,

    +   select title

    +   from books

    +   where ‘database’ in (unnest(keyword-set))


    +   We can access individual elements of an array by using indices

    +   E.g.: If we know that a particular book has three authors, we could

    +   write:

    +   select author-array[1], author-array[2], author-array[3]

    +   from books

    +   where title = ‘Database System Concepts’


    +   To get a relation containing pairs of the form “title, author-name”

    +   for each book and each author of the book

    +   select B.title, A.author

    +   from books as B, unnest (B.author-array) as A (author )


    +   To retain ordering information we add a with ordinality clause

    +   select B.title, A.author, A.position

    +   from books.as B, unnest (B.author-array) with ordinality

    +   as A (author, position’)'
  - '[PAGE 532]


    # # Unnesting


    The transformation of a nested relation into a form with fewer (or no) relation-valued
    attributes us called **unnesting**.


    +   E.g.

    +   select title, A as author, publisher.name as pub_name, publisher.branch as
    pub_branch, K.keyword

    +   from books as B, unnest(B.author_array ) as A (author ),

    +   unnest (B.keyword_set ) as K (keyword )'
  - '[PAGE 533]


    # # Nesting


    +   Nesting is the opposite of unnesting, creating a collection-valued attribute


    +   NOTE: SQL:1999 does not support nesting


    +   Nesting can be done in a manner similar to aggregation, but using the function
    collect() in place of an aggregation operation, to create a multiset


    +   To nest the flat-books relation on the attribute keyword:


    +   select title, author, Publisher (pub_name, pub_branch ) as publisher, collect
    (keyword) as keyword_set from flat-books groupby title, author, publisher


    +   To nest on both authors and keywords: select title, collect (author ) as author_set,
    Publisher (pub_name, pub_branch) as publisher, collect (keyword ) as keyword_set
    from flat-books group by title, publisher'
