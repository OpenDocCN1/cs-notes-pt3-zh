    # 6.8 Reduction of an E-R Schema to Tables


    # (逻辑设计 - 将E-R模式转化为数据库表)


    +   Converting an E-R diagram to a table format is the basis for deriving a relational
    database design from an E-R diagram.


    +   A database which conforms to an E-R diagram can be represented by a collection
    of tables.


    +   For each entity set and relationship set there is a unique table which is
    assigned the name of the corresponding entity set or relationship set.'
