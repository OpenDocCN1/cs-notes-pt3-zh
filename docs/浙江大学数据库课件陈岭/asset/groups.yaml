    \ (mandatory)\n/\n\n## Trapping Exceptions\n\nHere we define the actions that\
    \ should happen when an exception is thrown.\n\nExample Exceptions:\n\n- NO_DATA_FOUND\n\
    - TOO_MANY_ROWS\n- ZERO_DIVIDE\n\nWhen handling an exception, consider performing\
    \ a rollback\n\n```sql\nDECLARE\n    num_row   number_table%ROWTYPE;\nBEGIN\n\
    \    SELECT *\n    INTO num_row\n    FROM number_table;\n    dbms_output.put_line(1\
    \ / num_row.num);\nEXCEPTION\n    WHEN NO_DATA_FOUND THEN\n        dbms_output.put_line('No\
    \ data!' );\n    WHEN TOO_MANY_ROWS THEN\n        dbms_output.put_line('Too many!'\
    \ );\n    WHEN OTHERS THEN\n        dbms_output.put_line('Error') ;\nEND;\n```\n\
    \n"
  mdcn: "\n\n## Solution\n\n```sql\nDECLARE\n    cnt NUMBER;\nBEGIN\n    SELECT COUNT(*)\n\
    \    INTO cnt\n    FROM mylog\n    WHERE who = USER;\n    IF cnt > 0 THEN\n  \
    \      UPDATE mylog\n        SET logon_num = logon_num + 1\n        WHERE who\
    \ = USER;\n    ELSE\n        INSERT INTO mylog VALUES (USER, 1);\n    END IF;\n\
    \    COMMIT;\nEND;\n/\n```\n\n## SQL Cursor\n\nSQL cursor is automatically created\
    \ after each SQL query. It has 4 useful attributes:\n\n| Attribute | Description\
    \ |\n|---|---|\n| **SQL%ROWCOUNT** | Number of rows affected by the most recent\
    \ SQL statement (an integer value). |\n| **SQL%FOUND** | Boolean attribute that\
    \ evaluates to TRUE if the most recent SQL statement affects one or more rows.\
    \ |\n| **SQL%NOTFOUND** | Boolean attribute that evaluates to TRUE if the most\
    \ recent SQL statement does not affect any rows. |\n| **SQL%ISOPEN** | Always\
    \ evaluates to FALSE because PL/SQL closes implicit cursors immediately after\
    \ they are executed. |\n\n## Solution (2)\n\n```sql\nBEGIN\n    UPDATE mylog\n\
    \    SET logon_num = logon_num + 1\n    WHERE who = USER;\n    IF SQL%ROWCOUNT\
    \ = 0 THEN\n        INSERT INTO mylog VALUES (USER, 1);\n    END IF;\n    COMMIT;\n\
    END;\n/\n```\n\n## Loops: Simple Loop\n\n```sql\nCREATE TABLE number_table(\n\
    \    num NUMBER(10)\n);\n```\n\n```sql\nDECLARE\n    i number_table.num%TYPE :=\
    \ 1;\nBEGIN\n    LOOP\n        INSERT INTO number_table\n        VALUES(i);\n\
    \        i := i + 1;\n        EXIT WHEN i > 10;\n    END LOOP;\nEND;\n```\n\n\
    ## Loops: Simple Cursor Loop\n\n```sql\nCREATE TABLE number_table(\n    num NUMBER(10)\n\
    );\n```\n\n```sql\nDECLARE\n    CURSOR c IS SELECT * FROM number_table;\n    cVal\
    \ c%ROWTYPE;\nBEGIN\n    OPEN c;\n    LOOP\n        FETCH c INTO cVal;\n     \
    \   EXIT WHEN c%NOTFOUND;\n        INSERT INTO doubles VALUES(cVal.num * 2);\n\
    \    END LOOP;\nEND;\n```\n\n## Loops: FOR Loop\n\n```sql\nDECLARE\n    i   number_table.num%TYPE;\n\
    BEGIN\n    FOR i IN 1..10 LOOP\n        INSERT INTO number_table VALUES (i);\n\
    \    END LOOP;\nEND;\n```\n\nNotice that i is incremented automatically\n\n##\
    \ Loops: For Cursor Loops\n\n```sql\nDECLARE\n    CURSOR c IS SELECT * FROM number_table;\n\
    BEGIN\n    FOR num_row IN c LOOP\n        INSERT INTO doubles_table\n        VALUES(num_row.num\
    \ * 2);\n    END LOOP;\nEND;\n/\n```\n\nNotice that a lot is being done implicitly:\
    \ declaration of num_row, open cursor, fetch cursor, the exit condition\n\n##\
    \ Loops: WHILE Loop\n\n```sql\nDECLARE\n    TEN NUMBER := 10;\n    i   number_table.num%TYPE\
    \ := 1;\nBEGIN\n    WHILE i <= TEN LOOP\n        INSERT INTO number_table\n  \
    \      VALUES(i);\n        i := i + 1;\n    END LOOP;\nEND;\n```\n\n## Printing\
    \ Output\n\nYou need to use a function in the DBMS_OUTPUT package in order to\
    \ print to the output\n\nIf you want to see the output on the screen, you must\
    \ type the following (before starting):\n\nset serveroutput on format wrapped\
    \ size 1000000\n\nThen print using\n\ndbms_output.put_line(your_string);\n\ndbms_output.put(your_string);\n\
    \n## Input and output example\n\n```sql\nset serveroutput on format wrap size\
    \ 1000000\nACCEPT high PROMPT 'Enter a number:'\n\nDECLARE\n    i  number_table.num%TYPE\
    \ := 1;\nBEGIN\n  dbms_output.put_line('Look Ma, I can print from PL/SQL!!!');\n\
    \  WHILE i <= &high LOOP\n    INSERT INTO number_table\n    VALUES(i);\n    i\
    \ := i + 1;\n  END LOOP;\nEND;\n```\n\n## Reminder- structure of a block\n\n**DECLARE**\
    \ (optional)\n/* Here you declare the variables you will use in this block */\n\
    \n**BEGIN** (mandatory)\n/* Here you define the executable statements (what the\
    \ block DOES!)*/\n\n**EXCEPTION** (optional)\n/* Here you define the actions that\
    \ take place if an exception is thrown during the run of this block */\n\n**END;**\
    \ (mandatory)\n/\n\n## Trapping Exceptions\n\nHere we define the actions that\
    \ should happen when an exception is thrown.\n\nExample Exceptions:\n\n- NO_DATA_FOUND\n\
    - TOO_MANY_ROWS\n- ZERO_DIVIDE\n\nWhen handling an exception, consider performing\
    \ a rollback\n\n```sql\nDECLARE\n    num_row   number_table%ROWTYPE;\nBEGIN\n\
    \    SELECT *\n    INTO num_row\n    FROM number_table;\n    dbms_output.put_line(1\
    \ / num_row.num);\nEXCEPTION\n    WHEN NO_DATA_FOUND THEN\n        dbms_output.put_line('No\
    \ data!' );\n    WHEN TOO_MANY_ROWS THEN\n        dbms_output.put_line('Too many!'\
    \ );\n    WHEN OTHERS THEN\n        dbms_output.put_line('Error') ;\nEND;\n```\n\
    \n"
