    \ and\nbranch.branch_name =\naccount.branch_name and\nbranch_city = 'Needham'\
    \ ;\n```\n\n## Example Query\n\nDelete the record of all accounts with balances\
    \ below the average at the bank.\n\n```sql\nDELETE FROM account\nWHERE balance\
    \ <\n    (select avg (balance) from account);\n```\n\n- **Problem:** as we delete\
    \ tuples from *account*, the average balance changes\n- **Solution actually used\
    \ in SQL:**\n  1. First, compute avg balance and find all tuples to delete.\n\
    \  2. Next, delete all tuples found above (without recomputing avg or retesting\
    \ the tuples).\n  3. 在同一SQL语句内，除非外层查询的元组变量引入内层查询，否则内层查询只进行一次。\n"
