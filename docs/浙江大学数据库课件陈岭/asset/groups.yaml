    # # ODBC Conformance Levels


    **ODBC Conformance Levels** specify subsets of the functionality defined by the
    standard. (不同版本ODBC提供不同等级的标准)


    +   - Core level

    +   - Level 1 requires support for metadata querying

    +   - Level 2 requires ability to send and retrieve arrays of parameter values
    and more detailed catalog information.


    **SQL Call Level Interface (CLI)** standard is similar to ODBC interface, but
    with some minor differences.

    E.g. Oracle call interface (OCI)


