    \ **Aᵢ**\n\n### (3) Drop and Alter Table\n\n- The drop table command deletes all\
    \ information about the dropped relation from the database.\n\n- `DROP TABLE r;`\n\
    \n- E.g. `DROP TABLE branch2;`\n\nThe alter table command is used to add attributes\
    \ to an existing relation.\n\n```sql\nALTER TABLE r ADD A D;\nALTER TABLE r ADD\
    \ (A₁ D₁, ..., Aₙ Dₙ);\n```\n\nwhere A is the name of the attribute to be added\
    \ to relation r and D is the domain of A.\n\n- E.g. `alter table loan add loan_date\
    \ date;`\n  - All tuples in the relation are assigned null as the value for the\
    \ new attribute.\n\n- The alter table command can also be used to drop attributes\
    \ of a relation.\n  - `ALTER TABLE r DROP A`\n  - where A is the name of an attribute\
    \ of relation r\n  - But Dropping of attributes NOT supported by many databases\n\
    \n- The alter table command can also be used to modify the attributes of a relation.\n\
    \  - `ALTER TABLE branch MODIFY (branch_name char(30), assets not null);`\n"
  mdcn: "\n## Introduction to SQL\n\n### SQL includes several parts:\n\n- **DDL (Data-definition\
    \ Language)** 数据定义\n  - Create table, alter table, drop table\n  - create index,\
    \ drop index\n  - create view, drop view\n  - Create trigger, drop trigger\n \
    \ - ...\n\n- **DML (Data-manipulation Language)** 数据操纵\n  - select ... from\n\
    \  - insert, delete, update\n\n- **DCL (Data-control Language)** 数据控制\n  - grant,\
    \ revoke\n\n## Banking Example\n\n- **branch** (*branch-name*, branch-city, assets)\n\
    - **customer** (*customer-name*, customer-street, customer-city)\n- **account**\
    \ (*account-number*, branch-name, balance)\n- **loan** (*loan-number*, branch-name,\
    \ amount)\n- **depositor** (*customer-name*, account-number)\n- **borrower** (*customer-name*,\
    \ *loan-number*)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_134_0.png)\n\n##\
    \ 3.1 Data Definition Language (DDL)\n\n### Example\n\n```sql\nCREATE TABLE branch\
    \ (\n    branch_name char(15) not null,\n    branch_city varchar(30),\n    assets\
    \ numeric(8,2),\n    primary key (branch_name)\n);\n```\n\n- cf.:\n  - super-key\n\
    \  - candidate key\n  - primary key\n\n### The main functions of DDL\n\n- Define\
    \ the **schema** for each relation.\n- Define the **domain** of values associated\
    \ with each attribute.\n- Define **the integrity constraints**\n- Define the physical\
    \ **storage** structure of each relation on disk. (e.g. table space in Oracle)\n\
    - Define the **indices** to be maintained for each relations.\n- Define the **view**\
    \ on relations\n\n### (1) Domain Types in SQL (cont.)\n\n- **real, double precision.**\
    \ Floating point and double-precision floating point numbers, with machine-dependent\
    \ precision.\n- **float(n).** Floating point number, with user-specified precision\
    \ of at least _n_ digits.\n\n- **Null** values are allowed in all the domain types.\
    \ Declaring an attribute to be not null prohibits null values for that attribute.\n\
    \n- **date.** Dates, containing a (4 digits) year, month and day.\n  - E.g. date\
    \ **'2007-2-27'**\n- **time.** Time of day, in hours, minutes and seconds.\n \
    \ - E.g. time **'08:15:30'**  time **'08:15:30.75'**\n- **Timestamp.** date plus\
    \ time of day\n  - E.g. timestamp **'2007-2-27 08:15:30.75'**\n\nNote: the type\
    \ for date and time is \"**datetime**\" in SQL Server 2000.\n\n### (2) Create\
    \ Table Construct\n\nAn SQL relation is defined using the create table command:\n\
    \n```sql\nCREATE TABLE r(A₁ D₁, A₂ D₂, ..., Aₙ Dₙ,\n              (integrity constraint₁),\n\
    \              ...,\n              (integrity constraintₖ))\n```\n\n- **r** is\
    \ the name of the relation\n- each **Aᵢ** is an attribute name in the schema of\
    \ relation **r**\n- **Dᵢ** is the data type of values in the domain of attribute\
    \ **Aᵢ**\n\n### (3) Drop and Alter Table\n\n- The drop table command deletes all\
    \ information about the dropped relation from the database.\n\n- `DROP TABLE r;`\n\
    \n- E.g. `DROP TABLE branch2;`\n\nThe alter table command is used to add attributes\
    \ to an existing relation.\n\n```sql\nALTER TABLE r ADD A D;\nALTER TABLE r ADD\
    \ (A₁ D₁, ..., Aₙ Dₙ);\n```\n\nwhere A is the name of the attribute to be added\
    \ to relation r and D is the domain of A.\n\n- E.g. `alter table loan add loan_date\
    \ date;`\n  - All tuples in the relation are assigned null as the value for the\
    \ new attribute.\n\n- The alter table command can also be used to drop attributes\
    \ of a relation.\n  - `ALTER TABLE r DROP A`\n  - where A is the name of an attribute\
    \ of relation r\n  - But Dropping of attributes NOT supported by many databases\n\
    \n- The alter table command can also be used to modify the attributes of a relation.\n\
    \  - `ALTER TABLE branch MODIFY (branch_name char(30), assets not null);`\n"
