    \ | Redwood | 4000 | Smith |\n\n### Left Out Join\n\n*loan* ⟕ *borrower*\n\n|\
    \ loan_number | branch_name | amount | customer_name |\n|---|---|---|---|\n| L_170\
    \ | Downtown | 3000 | Jones |\n| L_230 | Redwood | 4000 | Smith |\n| L_260 | Perryridge\
    \ | 1700 | *null* |\n\n### Right Out Join\n\n*loan* ⟖ *borrower*\n\n| loan_number\
    \ | branch_name | amount | customer_name |\n|---|---|---|---|\n| L_170 | Downtown\
    \ | 3000 | Jones |\n| L_230 | Redwood | 4000 | Smith |\n| L_155 | *null* | *null*\
    \ | Hayes |\n\n### The concept of Join types\n\n## (4) Null values\n\n- It is\
    \ possible for tuples to have a null value, denoted by *null*, for some of their\
    \ attributes  \n- *null* signifies **an unknown** value or that a value does **NOT\
    \ exist**.  \n- The result of **any arithmetic expression involving *null* is\
    \ *null*.**  \n- **Aggregate functions simply ignore null values**  \n  - Is an\
    \ arbitrary decision. Could have returned null as result instead.  \n  - We follow\
    \ the semantics of SQL in its handling of null values  \n- For duplicate elimination\
    \ and grouping, null is treated like any other value, and two nulls are assumed\
    \ to be the same  \n  - Alternative: assume each null is different from each other\
    \  \n  - Both are arbitrary decisions, so we simply follow SQL  \n\n## Null Values\n\
    \n### Comparisons with null values return the special truth value unknown\n\n\
    - If false was used instead of unknown, then would not be equivalent to not (A\
    \ < 5) A >= 5  \n\n### Three-valued logic using the truth value unknown:\n\n-\
    \ OR: (unknown or true) = true, (unknown or false) = unknown (unknown or unknown)\
    \ = unknown  \n- AND: (true and unknown) = unknown, (false and unknown) = false,\
    \ (unknown and unknown) = unknown  \n- NOT: (not unknown) = unknown  \n- In SQL\
    \ “P is unknown” evaluates to true if predicate P evaluates to unknown  \n\n###\
    \ Result of select predicate is treated as false if it evaluates to unknown\n\n"
