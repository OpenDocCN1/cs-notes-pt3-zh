    \\6\\end{bmatrix}) = true (since 5 ≠ 4 and 5 ≠ 6)\n\n> (≠ all) = not in  \n> However,\
    \ (= all) ≠ in\n\n## Example Query\n\n- Find the names of all branches that have\
    \ **greater assets than all** branches located in Brooklyn.\n\n```sql\nQuery 1:\
    \ select *branch_name*\n          from *branch*\n          where *assets* > **all**\n\
    \                (select *assets*\n                 from *branch*\n          \
