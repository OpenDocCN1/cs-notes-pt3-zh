    # # Testing for Dependency Preservation


    To check if a dependency \(\alpha \rightarrow \beta\) is preserved in a decomposition
    of R into R₁, R₂, ..., Rₙ , we apply the following **simplified test**:


    +   - result = α

    +     while (changes to result) do

    +     for each Rᵢ in the decomposition

    +     t = (result ∩ Rᵢ)⁺ ∩ Rᵢ;

    +     result = result ∪ t

    +   - If result contains all attributes in β,

    +     then the functional dependency \(\alpha \rightarrow \beta\) is preserved.


    Apply the test on all dependencies in F to check if a decomposition is dependency
    preserving


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_462_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_462_1.png)


