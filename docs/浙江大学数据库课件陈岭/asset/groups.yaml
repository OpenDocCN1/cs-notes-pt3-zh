    \ = borrower.loan_number(+)\n\n## Synthetic examples\n\nExample 1: Consider the\
    \ following relational schema:\npart(id, name, color, weight, sub_part),\ntransfer\
    \ the following SQL query into relational algebra expression:\nSELECT part2.id\
    \ FROM part as part1, part as part2\nWHERE part1.id=part2.sub_part AND\npart1.color='red'\
    \ AND part2.color='blue' AND\npart1.weight - part2.weight >100;\nΠp2.id\n(σp1.weight-p2.weight\
