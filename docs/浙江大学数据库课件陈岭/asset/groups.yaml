    ), \\(\\sigma\\) is pronounced as sigma\n- **_p_** is called the **selection predicate**\n\
    - Defined as: \\(\\sigma_p(r) = \\{ t \\mid t \\in r \\text{ and } p(t) \\}\\\
    )\n\nWhere **_p_** is a formula in propositional calculus consisting of **terms**\
    \ connected by: \\(\\land\\) (and), \\(\\lor\\) (or), \\(\\neg\\) (not)\n\nEach\
    \ **term** is one of:\n\n`<attribute> op <attribute>` or `<constant>`\n\nwhere\
