    \ an E-R diagram to a table format is the basis for deriving a relational database\
    \ design from an E-R diagram.\n- A database which conforms to an E-R diagram can\
    \ be represented by a collection of tables.\n- For each entity set and relationship\
    \ set there is a unique table which is assigned the name of the corresponding\
    \ entity set or relationship set.\n\n### (1) Representing Entity Sets as Tables\n\
    \nA strong entity set maps to a table with the same attributes.\n\n| customer-id\
    \ | customer-name | customer-street | customer-city |\n|---|---|---|---|\n| 019-28-3746\
