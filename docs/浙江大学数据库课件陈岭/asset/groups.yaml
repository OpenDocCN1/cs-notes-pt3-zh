    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_634_1.png)\n\n## Creating XML Output\n\
    \n- Any text or tag in the XSL stylesheet that is not in the xsl namespace is\
    \ output as is\n- E.g. to wrap results in new XML elements.\n\n```xml\n<xsl:template\
    \ match=\"/bank-2/customer\">\n    <customer>\n        <xsl:value-of select=\"\
    customer_name\"/>\n    </customer>\n</xsl:template>\n<xsl:template match=\"*\"\
    />\n```\n\n- **Example output:**\n  ```xml\n  <customer> Joe   </customer>\n \
    \ <customer> Mary  </customer>\n  ```\n\n## Creating XML Output (Cont.)\n\n- Note:\
    \ Cannot directly insert a xsl:value-of tag inside another tag\n  - E.g. cannot\
    \ create an attribute for <customer> in the previous example by directly using\
    \ xsl:value-of\n  - XSLT provides a construct xsl:attribute to handle this situation\n\
    \    - xsl:attribute adds attribute to the preceding element\n    - E.g. <customer>\n\
    \      <xsl:attribute name=\"customer_id\">\n      <xsl:value-of select = \"customer_id\"\
