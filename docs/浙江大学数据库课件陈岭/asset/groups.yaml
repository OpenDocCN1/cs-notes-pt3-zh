  - '[PAGE 304]


    # # Example: Audit in Oracle


    # ## 语句审计：


    +   E.g: audit table by scott by access whenever successful; - 审计用户scott每次成功地执行有关table的语句(create
    table, drop table, alter table)。


    +   格式： AUDIT <st-opt> [ BY <users> ] [ BY SESSION\\ ACCESS ] [ WHENEVER SUCCESSFUL|
    WHENEVER NOT SUCCESSFUL ]


    +   当 BY <users> 缺省，对所有用户审计。


    +   BY SESSION每次会话期间，相同类型的需审计的SQL语句仅记录一次。


    +   常用的<st-opt>: table, view, role, index, ...


    +   取消审计： NOAUDIT ...(其余同audit语句)'
  - "[PAGE 305]\n\n# # Example: Audit in Oracle\n\n+   对象(实体)审计：\n+   \n+   * E.g:\
    \ audit delete, update on student; -审计所有用户对student表的delete和update操作。\n+   * 格式:\
    \ AUDIT <obj-opt> ON <obj>|DEFAULT [ BY SESSION | BY ACCESS ] [ WHENEVER SUCCESSFUL|WHENEVER\
    \ NOT SUCCESSFUL ]\n+     * obj-opt: insert, delete, update, select, grant,...\n\
    +   * 实体审计对所有的用户起作用。\n+   * ON <obj> 指出审计对象表、视图名。\n+   * ON DEFAULT 对其后创建的所有对象起作用。\n\
    +   * 取消审计: NOAUDIT ...\n\n+   怎样看审计结果：\n+   \n+   审计结果记录在 数据字典表: sys.aud$中，也可从dba_audit_trail,\
    \ dba_audit_statement, dba_audit_object中获得有关情况。\n+   上述数据字典表需在DBA用户（system）下才可见。"
