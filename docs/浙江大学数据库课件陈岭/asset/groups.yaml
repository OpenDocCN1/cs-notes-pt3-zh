    \ schemas from a given set of attributes.\n\n"
  mdcn: "\n\n## Theory of MVDs\n\nFrom the definition of multivalued dependency, we\
    \ can derive the following rule:\n\n- If \\(\\alpha \\rightarrow \\beta\\), then\
    \ \\(\\alpha \\rightarrow\\rightarrow \\beta\\)\n\nThat is, every functional dependency\
    \ is also a multivalued dependency\n\nThe closure D+ of D is the set of all functional\
    \ and multivalued dependencies logically implied by D.\n\n- We can compute D+\
    \ from D, using the formal definitions of functional dependencies and multivalued\
    \ dependencies.\n- We can manage with such reasoning for very simple multivalued\
    \ dependencies, which seem to be most common in practice.\n- For complex dependencies,\
    \ it is better to reason about sets of dependencies using a system of inference\
    \ rules (see Appendix C).\n\n## Fourth Normal Form\n\n- A relation schema *R*\
    \ is in 4NF with respect to a set *D* of functional and multivalued dependencies\
    \ if for **all multivalued dependencies** in *D⁺* of the form α →→ β, where α\
    \ ⊆ *R* and β ⊆ *R*, at least one of the following hold:\n  - α →→ β is trivial\
    \ (i.e., β ⊆ α or α ∪ β = *R*)\n  - α is a superkey for schema *R*\n- If a relation\
    \ is in 4NF, it is in BCNF\n\n## Requirement for decomposition\n\n### Restriction\
    \ of Multivalued Dependencies\n\n- Assume R is decomposed into R₁, R₂, …, Rₙ,\
    \ each Rᵢ is required to conform to 4NF.\n- The restriction of D to Rᵢ is the\
    \ set Dᵢ consisting of\n  - All functional dependencies in D⁺ that include only\
    \ attributes of Rᵢ\n  - All multivalued dependencies of the form α →→ (β ∩ Rᵢ),\
    \ where α ⊆ Rᵢ and α →→ β is in D⁺\n\n## 4NF Decomposition Algorithm\n\nresult:=\
    \ { R };\ndone := false;\ncompute D⁺;\nLet Dᵢ denote the restriction of D⁺ to\
    \ Rᵢ\nwhile (not done)\n  if (there is a schema Rᵢ in result that is not in 4NF)\
    \ then begin\n    let α →→ β be a nontrivial multivalued dependency that holds\
    \ on Rᵢ such that α → Rᵢ is not in Dᵢ, and α∩β=φ;\n    result := (result - Rᵢ)\
    \ ∪ (α, β) ∪ (Rᵢ - β);\n    end\n  else done:= true;\nNote: each Rᵢ is in 4NF,\
    \ and decomposition is lossless-join\n\n**The decomposition is NOT dependency\
    \ preserving!**\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_497_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_497_1.png)\n\
    \n## Example3\n\n- $R=(A, B, C, G, H, I)$\n- $F=\\{A \\twoheadrightarrow B$\n\
    \  - $B \\twoheadrightarrow H$\n  - $CG \\twoheadrightarrow H\\}$\n\n- $R$ is\
    \ not in 4NF since $A \\twoheadrightarrow B$ and $A$ is not a superkey for $R$\n\
    \n- Decomposition\n  - a) $R_1=(A, B)$                                      ($R_1$\
    \ is in 4NF)\n  - b) $R_2=(A, C, G, H, I)$                         ($R_2$ is not\
    \ in 4NF)\n  - c) $R_{21}=(C, G, H)$                              ($R_{21}$ is\
    \ in 4NF)\n  - d) $R_{22}=(A, C, G, I)$                          ($R_{22}$ is\
    \ in 4NF)\n\n## Overall Database Design Process\n\n- We have assumed schema *R*\
    \ is given\n  - *R* could have been generated when converting E-R diagram to a\
    \ set of tables.\n  - *R* could have been a single relation containing *all* attributes\
    \ that are of interest (called universal relation).\n  - Normalization breaks\
    \ *R* into smaller relations.\n  - *R* could have been the result of some ad hoc\
    \ design of relations, which we then test/convert to normal form.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_500_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_500_1.png)\n\n## Universal Relation\
    \ Approach\n\n- **Dangling (无归属) tuples** – Tuples that “disappear” in computing\
    \ a join.\n  - Let \\( r_1 (R_1), r_2 (R_2), \\dots, r_n (R_n) \\) be a set of\
    \ relations\n  - A tuple r of the relation \\( r_i \\) is a dangling tuple if\
    \ r is not in the relation:\n    \n    $$\\Pi_{Ri} (r_1 \\bowtie r_2 \\bowtie\
    \ \\dots \\bowtie r_n)$$\n\n- The relation \\( r_1 \\bowtie r_2 \\bowtie \\dots\
    \ \\bowtie r_n \\) is called a **universal relation** since it involves all the\
    \ attributes in the “universe” defined by \\( R_1 \\cup R_2 \\cup \\dots \\cup\
    \ R_n \\)\n\n- If dangling tuples are allowed in the database, instead of decomposing\
    \ a universal relation, we may prefer to synthesize a collection of normal form\
    \ schemas from a given set of attributes.\n\n"
