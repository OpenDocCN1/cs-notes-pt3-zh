    # # (8) Binary Vs. Non-Binary Relationships


    ## (a) Some relationships that appear to be non-binary may be better represented
    using binary relationships


    +   - E.g. A ternary relationship *parents*, relating a child to his/her father
    and mother, is best replaced by two binary relationships, *father* and *mother*.


    parents( he, she, child). => father (he, child), mother( she, child)


    +   - Using two binary relationships allows partial information (e.g. only mother
    being know) .


    +   - But there are **some relationships** that are naturally non-binary


    E.g. **works-on(employee, branch, job)**'
  - '[PAGE 373]


    # # *(b) Converting Non-Binary Relationships to Binary Form


    In general, any non-binary relationship can be represented using binary relationships
    by creating an **artificial entity set**.


    +   - Replace non-binary relationship _R_ between entity sets A, B and C by an
    entity set _E_, and three new relationship sets:

    +   - Create a special identifying attribute for _E_

    +   - Add any attributes of _R_ to _E_

    +   - For each relationship (_aᵢ_, _bᵢ_, _cᵢ_) in _R_, create _R<sub>A</sub>_,
    _R<sub>B</sub>_, _R<sub>C</sub>_


    E.g:


