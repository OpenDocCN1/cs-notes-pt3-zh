  md: "\n\n## View of Data\n\n### An architecture for a database system\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_25_0.png)\n\
    \n## Schemas (模式) and Instances (实例)\n\nSimilar to types and variables in programming\
    \ languages ( type ↔ schema, variable ↔ instance)\n\n### Schema - the structure\
    \ of the database on different level\n\n- Analogous to type information of a variable\
    \ in a program\n- Physical schema: database design of structure at the physical\
    \ level\n- Logical schema: database design of structure at the logical level\n\
    - Subschema: schema at view level\n\n### Instance - the actual content of the\
    \ database at a particular point in time\n\n- Analogous to the value of a variable\n\
    \n[ schema: a representation of an arrangement or plan.]\n\n## Physical Independence\
    \ vs. Logical Independence\n\n- Ability to modify a scheme definition at one level\
    \ w.o. affecting a scheme definition at a higher level.\n- **Physical Data Independence**\
    \ - The ability to modify the physical schema without changing the logical schema.\n\
    \  - Applications depend on the logical schema.\n  - Applications insulated from\
    \ how data is structured and stored.\n  - **One of the most important benefits\
    \ of using a DBMS!**\n- **Logical Data Independence** - Protect application programs\
    \ from changes in logical structure of data.\n  - Logical data independence **is\
    \ harder to achieve** as the application programs are heavily dependent on the\
    \ logical structure of data.\n\n## 1.5 Data Models\n\n### Data model is a collection\
    \ of conceptual tools for describing:\n\n- data structure\n- data relationships\n\
    - data semantics\n- data constraints\n\n### Different level of data abstraction\
    \ needs different data model to describe:\n\n- Entity-Relationship model\n- Relational\
    \ model\n- Other models:\n  - object-oriented model\n  - semi-structured data\
    \ models (XML)\n  - older models: network model and hierarchical model ...\n-\
    \ Requirement analysis\n- Conceptual design\n- Logical design\n- ......\n\n> Database\
    \ design process:\n\n## Steps of Database Design\n\n### 1) Requirement analysis\n\
    \n- What data, applications, and operations needed\n\n### 2) Conceptual database\
    \ design\n\n- A high-level description of data, constraints using E - R model\
    \ or a similar high level data model\n\n### 3) Logical database design:\n\n- Convert\
    \ the conceptual design into a DB schema\n\n### 4) Schema refinement\n\n- Normalization\
    \ of relations: Check relational schema for redundancies and related anomalies.\n\
    \n### 5) Physical database design :\n\n- Indexing, clustering and database tuning\n\
    \n### 6) Create and initialize the database & Security design\n\n- Load initial\
    \ data, testing\n- Identify different user groups and their roles\n\n## 数据库的设计步骤\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_31_0.png)\n\n## E-R model of real world\n\
    \n- Entities (objects)\n- E.g. customers, accounts, bank branch\n- Entities are\
    \ described by attributes\n- Relationships between entities\n- E.g. Account A-101\
    \ is held by customer Johnson\n- Relationship set depositor associates customers\
    \ with accounts\n\n## E-R Model is widely used for database design\n\n- Database\
    \ design in E-R model usually converted to design in the relational model .\n\
    - Was first proposed by Pete Chen.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_32_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_32_1.png)\n\n## Entity-Relationship\
    \ Model (Cont.)\n\n### Example of schema in the entity-relationship model\n\n\
    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_33_0.png)\n\n## (2) Relational Model\n\
    \n### Transfer E-R diagrams into relational schema\n\n■ Example of tabular data\
    \ in the relational model\n\nCustomer:\n\n| Customer-id | customer-name | customer-street\
    \ | customer-city | account-number |\n|---|---|---|---|---|\n| 192-83-7465 | Johnson\
