    # # Example of Non Lossless-Join Decomposition


    # ## Decomposition of R = (A, B)


    R₁ = (A), R₂ = (B)


    E.g.:


    r = | A | B |

    |---|---|

    | α | 1 |

    | α | 2 |

    | β | 1 |


    Πₐ(r) = | A |

    |---|

    | α |

    | β |


    Πᵦ(r) = | B |

    |---|

    | 1 |

    | 2 |


    Πₐ (r) ⋈ Πᵦ (r) = | A | B |

    |---|---|

    | α | 1 |

    | α | 2 |

    | β | 1 |

    | β | 2 | ≠ r


    # ## A bad decomposition !


    > It''s not lossless-join decomposition. It''s illegal !'
  - '[PAGE 430]


    # # Goal — Devise a Theory for the Following


    +   1) Decide whether a particular relation R is in “good” form. -No redundant


    +   2) In the case that a relation R is not in “good” form, decompose it into
    a set of relations {R1, R2, ..., Rn} such that

    +      - each relation is in good form

    +      - the decomposition is a lossless-join decomposition


    +   Our theory is based on:

    +      - functional dependencies (函数依赖)

    +      - multivalued dependencies (多值依赖)'
  - '[PAGE 431]


    # 7.3 Functional Dependencies


    # (1) Definition


    Let *R* be a relation schema, α and β be attributes


    α ⊆ *R* **and** β ⊆ *R*


    # ■ The functional dependency


    α → β


    holds on *R* if and only if **for any legal relations r(R)**, whenever any two
    tuples *t₁* and *t₂* of *r* agree on the attributes α, they also agree on the
    attributes β. That is:


    *t₁*[α] = *t₂*[α]  ⇒  *t₁*[β] = *t₂*[β]


    β is functionally dependent on α, α functionally determines β


    | α | β | γ |

    |---|---|---|

    | a | f | 1 |

    | b | h | 2 |

    | a | f | 3 |

    | c | f | 4 |


    > 借用了数学上的函数概念：x → f(x)


    β 函数依赖于 α，α 函数决定 β'
  - '[PAGE 432]


    # 7.3 Functional Dependences（函数依赖）


    # (1) Definition（cont.）


    **Functional dependency**: a kind of integrity **constraints**, which express
    the relationship of values on specific attributes, can be used to **judge schema
    normalization** and to suggest **refinements**.


    **Example:** Consider *r(A, B)* with the following instance of *r*.


    +   - On this instance, *A → B* does **NOT** hold,

    +   - but *B → A* **may** hold.


    > ：若B属性值确定了，则A属性值也唯一确定了。于是有 B→A


    | A | B |

    |---|---|

    | 1 | 4 |

    | 1 | 5 |

    | 3 | 7 |'
