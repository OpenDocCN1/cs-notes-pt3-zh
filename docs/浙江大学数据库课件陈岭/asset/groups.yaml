    \ application area has its own set of standards for representing information\n\
    \n- XML has become the basis for all new generation data interchange formats\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_1.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_2.png)\n\n## XML: Motivation (Cont.)\n\
    \n- Earlier generation formats were based on **plain text** with line headers\
    \ indicating the meaning of fields\n  - Similar in concept to email headers\n\
    \  - Does **not allow for nested structures, no standard “type” language**\n \
    \ - Tied too closely to low level document structure (lines, spaces, etc)\n\n\
    - Each XML based standard defines what are valid elements, using\n  - XML **type\
    \ specification languages** to specify the syntax\n    - DTD (Document Type Definition)\n\
    \    - XML Schema\n  - Plus textual descriptions of the semantics\n\n- XML allows\
    \ new tags to be defined as required\n  - However, this may be constrained by\
    \ DTDs\n\n- **A wide variety of tools is available for parsing, browsing and querying\
    \ XML documents/data**\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_1.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_2.png)\n\
    \n## Comparison with Relational Data\n\n- **Inefficient:** tags, which in effect\
    \ represent schema information, **are repeated**\n- **Better than relational tuples\
    \ as a data-exchange format**\n  - Unlike relational tuples, **XML data is self-documenting**\
    \ due to presence of tags\n  - Non-rigid format: **tags can be added**\n  - Allows\
    \ **nested structures**\n  - **Wide acceptance**, not only in database systems,\
    \ but also in browsers, tools, and applications\n\n## 10.2 Structure of XML Data\n\
    \n- Tag: label for a section of data\n\n- Element (元素): section of data beginning\
    \ with `<tagname>` and ending with matching `</tagname>`\n\n  `<tagname> ......\
    \ </tagname>`\n\n- Elements must be properly nested\n\n- Proper nesting\n  - `<account>\
    \ ... <balance> .... </balance> </account>`\n\n- Improper nesting\n  - `<account>\
    \ ... <balance> .... </account> </balance>`\n\n- Formally: every start tag must\
    \ have a unique matching end tag, that is in the context of the same parent element.\n\
    \n- Every document must have a single top-level element\n\n### Example of Nested\
    \ Elements\n\n```xml\n<bank-1>\n<customer>\n<customer_name> Hayes </customer_name>\n\
