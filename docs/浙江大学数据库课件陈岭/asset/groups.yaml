  - '[PAGE 589]


    # XML: Motivation


    +   - **Data interchange** is critical in today’s networked world

    +     - **Examples:**

    +       - Banking: funds transfer

    +       - Order processing (especially inter-company orders)

    +       - …

    +     - Paper flow of information between organizations is being replaced by electronic
    flow of information

    +     - Each application area has its own set of standards for representing information


    +   - XML has become the basis for all new generation data interchange formats


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_589_2.png)'
  - '[PAGE 590]


    # XML Motivation (Cont.)


    +   - Earlier generation formats were based on **plain text** with line headers
    indicating the meaning of fields

    +     - Similar in concept to email headers

    +     - Does **not allow for nested structures, no standard “type” language**

    +     - Tied too closely to low level document structure (lines, spaces, etc)


    +   - Each XML based standard defines what are valid elements, using

    +     - XML **type specification languages** to specify the syntax

    +       - DTD (Document Type Descriptors)

    +       - XML Schema

    +     - Plus textual descriptions of the semantics


    +   - XML allows new tags to be defined as required

    +     - However, this may be constrained by DTDs


    +   - **A wide variety of tools is available for parsing, browsing and querying
    XML documents/data**


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_590_2.png)'
  - '[PAGE 591]


    # Comparison with Relational Data


    +   - **Inefficient:** tags, which in effect represent schema information, **are
    repeated**

    +   - **Better than relational tuples as a data-exchange format**

    +     - Unlike relational tuples, **XML data is self-documenting** due to presence
    of tags

    +     - Non-rigid format: **tags can be added**

    +     - Allows **nested structures**

    +     - **Wide acceptance**, not only in database systems, but also in browsers,
    tools, and applications'
  - '[PAGE 592]


    # # 10.2 Structure of XML Data


    +   - Tag: label for a section of data


    +   - Element (元素) : section of data beginning with `<tagname>` and ending with
    matching `</tagname>`


    <tagname> ...... </tagname>


    +   - Elements must be properly nested


    +   - Proper nesting

    +     - `<account> ... <balance> .... </balance> </account>`


    +   - Improper nesting

    +     - `<account> ... <balance> .... </account> </balance>`


    +   - Formally: every start tag must have a unique matching end tag, that is in
    the context of the same parent element.


    +   - Every document must have a single top-level element'
  - '[PAGE 593]


    # # Example of Nested Elements


    ```

    ```

    <bank-1>

