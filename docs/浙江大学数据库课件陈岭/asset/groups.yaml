  md: "\n\n## Triggering Events and Actions in SQL\n\n- Triggering event can be **insert**,\
    \ **delete** or **update**\n\n- Triggers **on update** can be restricted to specific\
    \ attributes:\n  - E.g. create trigger *overdraft-trigger*\n    *after update\
    \ of* *balance* *on account* …\n\n- Values of attributes **before** and **after**\
    \ an update can be referenced:\n  - referencing old row as orow: for deletes and\
    \ updates\n  - referencing new row as nrow: for inserts and updates\n\n## Statement\
    \ Level Triggers\n\nInstead of executing a separate action for each affected row,\
    \ a single action can be executed for all rows affected by a transaction.\n\n\
    - Use *for each statement* instead of *for each row*\n- Use *referencing old table*\
    \ or *referencing new table* to refer to temporary tables (called *transition\
    \ tables*) containing the affected rows\n- Can be more efficient when dealing\
    \ with SQL statements that update a large number of rows.\n\n## External World\
    \ Actions\n\nWe sometimes require external world actions to be triggered on a\
    \ database update\n\n- E.g. re-ordering an item whose quantity in a warehouse\
    \ has become small, or turning on an alarm light. （当库存低于警戒线，增加订货或报警）\n\n## Triggers\
    \ cannot be used to directly implement external-world actions, BUT\n\n- Triggers\
    \ can be used to record actions-to-be-taken in a separate table;\n- Have an external\
    \ process that repeatedly scans the table, carries out external-world actions\
    \ and deletes action from table.\n\n## External World Actions(cont.)\n\nE.g. Suppose\
