  - '[PAGE 647]


    # Mapping XML Data to Relations


    +   - Relation created for each element type whose schema is known:

    +     - An id attribute to store a unique id for each element

    +     - A relation attribute corresponding to each element attribute

    +     - A parent_id attribute to keep track of parent element

    +       - As in the tree representation

    +       - Position information (iᵗʰ child) can be stored too

    +   - All subelements that occur only once can become relation attributes

    +     - For text-valued subelements, store the text as attribute value

    +     - For complex subelements, can store the id of the subelement

    +   - Subelements that can occur multiple times represented in a separate table

    +     - Similar to handling of multivalued attributes when converting E-R diagrams
    to tables'
  md: "\n## 10.5 Application Program Interface\n\n- There are two standard application\
    \ program interfaces to XML data:\n  - **SAX (Simple API for XML)**\n    - Based\
    \ on parser model, user provides event handlers for parsing events\n      - E.g.\
    \ start of element, end of element\n      - Not suitable for database applications\n\
    \  - **DOM (Document Object Model)**\n    - XML data is parsed into a tree representation\n\
    \    - Variety of functions provided for traversing the DOM tree\n    - E.g.:\
    \ Java DOM API provides Node class with methods\n      - `getParentNode()`, `getFirstChild()`,\
    \ `getNextSibling()`\n      - `getAttribute()`, `getData()` (for text node)\n\
    \      - `getElementsByTagName()`, …\n    - Also provides functions for updating\
    \ DOM tree\n\n## 10.6 Storage of XML Data\n\n- XML data can be stored in\n  -\
    \ **Non-relational data stores**\n    - Flat files\n      - Natural for storing\
    \ XML\n      - But has all problems discussed in Chapter 1 (no concurrency, no\
    \ recovery, …)\n    - XML database\n      - Database built specifically for storing\
    \ XML data, supporting DOM model and declarative querying\n      - Currently no\
    \ commercial-grade systems\n  - **Relational databases**\n    - Data must be translated\
    \ into relational form\n    - Advantage: mature database systems\n    - Disadvantages:\
    \ overhead of translating data and queries\n\n## Storage of XML in Relational\
    \ Databases\n\n### Alternatives:\n\n- String Representation\n- Tree Representation\n\
    - Map to relations\n\n### String Representation\n\n- Store each top level element\
    \ as a string field of a tuple in a relational database\n  - Use a single relation\
    \ to store all elements, or\n  - Use a separate relation for each top-level element\
    \ type\n    - E.g. account, customer, depositor relations\n      - Each with a\
    \ string-valued attribute to store the element\n\n- Indexing:\n  - Store values\
    \ of subelements/attributes to be indexed as extra fields of the relation, and\
    \ build indices on these fields\n    - E.g. customer_name or account_number\n\
    \  - Some database systems support function indices, which use the result of a\
    \ function as the key value.\n    - The function should return the value of the\
    \ required subelement/attribute\n\n### String Representation (Cont.)\n\n- **Benefits:**\n\
    \  - Can store any XML data even without DTD\n  - As long as there are many top-level\
    \ elements in a document, strings are small compared to full document\n    - Allows\
    \ fast access to individual elements.\n\n- **Drawback:** Need to parse strings\
    \ to access values inside the elements\n  - Parsing is slow.\n\n### Tree Representation\n\
    \n- Tree representation: model XML data as tree and store using relations  \n\
    \  nodes(id, type, label, value)  \n  child (child_id, parent_id)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_645_0.png)\n\
    \n- Each element/attribute is given a unique identifier  \n- Type indicates element/attribute\
    \  \n- Label specifies the name of the element/attribute  \n- Value is the text\
    \ value of the element/attribute  \n- The relation child notes the parent-child\
    \ relationships in the tree  \n  - Can add an extra attribute to child to record\
    \ ordering of children\n\n### Mapping XML Data to Relations\n\n- Relation created\
    \ for each element type whose schema is known:\n  - An id attribute to store a\
    \ unique id for each element\n  - A relation attribute corresponding to each element\
    \ attribute\n  - A parent_id attribute to keep track of parent element\n    -\
    \ As in the tree representation\n    - Position information (iᵗʰ child) can be\
    \ stored too\n- All subelements that occur only once can become relation attributes\n\
    \  - For text-valued subelements, store the text as attribute value\n  - For complex\
    \ subelements, can store the id of the subelement\n- Subelements that can occur\
    \ multiple times represented in a separate table\n  - Similar to handling of multivalued\
    \ attributes when converting E-R diagrams to tables\n"
