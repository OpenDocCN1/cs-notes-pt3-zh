    \ data model by including object orientation and constructs to deal with added\
    \ data types.\n- Allow attributes of tuples to have complex types, including non-atomic\
    \ values such as nested relations.\n- Preserve relational foundations, in particular\
    \ the declarative access to data, while extending modeling power.\n- Upward compatibility\
    \ with existing relational languages.\n\n## Complex Data Types\n\n- **Motivation:**\n\
    \  - Permit non-atomic domains (atomic ≡ indivisible)\n  - Example of non-atomic\
    \ domain: set of integers, or set of tuples\n  - Allows more intuitive modeling\
    \ for applications with complex data\n- **Intuitive definition:**\n  - allow relations\
    \ whenever we allow atomic (scalar) values — relations within relations\n  - Retains\
    \ mathematical foundation of relational model\n  - Violates first normal form.\n\
    \n## 4NF Decomposition of Nested Relation\n\n- Remove awkwardness of *flat-books*\
    \ by assuming that the following multivalued dependencies hold:\n  - *title* ↠\
    \ *author*\n  - *title* ↠ *keyword*\n  - *title* ↠ *pub-name*, *pub-branch*\n\
    - Decompose *flat-books* into 4NF using the schemas:\n  - (*title*, *author*)\n\
    \  - (*title*, *keyword*)\n  - (*title*, *pub-name*, *pub-branch*)\n\n## 4NF Decomposition\
    \ of flat-books\n\n| title | author |\n| --- | --- |\n| Compilers | Smith |\n\
    | Compilers | Jones |\n| Networks | Jones |\n| Networks | Frick |\n\n| title |\
