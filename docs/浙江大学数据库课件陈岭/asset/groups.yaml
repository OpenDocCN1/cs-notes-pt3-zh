  - '[PAGE 298]


    # # (b) Roles (角色)


    +   Roles permit **common privileges** for a class of users can be specified just
    once by creating a corresponding “role” .


    +   Privileges can be granted to or revoked from roles, just like user; roles
    can be assigned to users, and even to other roles.


    +   SQL:1999 supports roles


    ```

    create role teller (出纳);

    create role manager ;

    grant select on branch to teller ;

    grant update (balance) on account to teller ;

    grant all privileges on account to manager ;

    grant teller to manager ;

    grant teller to alice, bob ;

    grant manager to avi ;

    ```'
  - '[PAGE 299]


    # # (5) Revoking Authorization in SQL


    +   - The revoke statement is used to revoke authorization.


    REVOKE<privilege list> ON <relation name or view name> FROM <user list> [ restrict
    | cascade ]


    +   - Example:


    revoke select on branch from U₁, U₃ cascade;


    +   - Revocation of a privilege from a user may cause other users also to lose
    that privilege; referred to as cascading of the revoke.


    +   - We can prevent cascading by specifying restrict:


