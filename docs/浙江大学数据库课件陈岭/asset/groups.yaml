    # # Division Operation (Cont.)


    # ## Property


    +   - Let \( q = r \div s \)


    +   - Then \( q \) is the largest relation satisfying \( q \times s \subseteq
    r \)


    # ## Definition in terms of the basic algebra operation


    Let \( r(R) \) and \( s(S) \) be relations, and let \( S \subseteq R \)


    \( r \div s = \Pi_{R-S}(r) - \Pi_{R-S}((\Pi_{R-S}(r) \times s) - \Pi_{R-S,S}(r))
    \)


    To see why,


    +   - \( \Pi_{R-S,S}(r) \) simply reorders attributes of \( r \)


    +   - \( \Pi_{R-S}(\Pi_{R-S}(r) \times s) - \Pi_{R-S,S}(r) \) gives those tuples
    \( t \) in \( \Pi_{R-S}(r) \) such that for some tuple \( u \in s \), \( tu \notin
    r \).


    # # (11) Assignment Operation


    The assignment operation (←) provides a convenient way to express complex queries.


    +   Write query as a sequential program consisting of

    +   a series of assignments

    +   followed by an expression whose value is displayed as a result

    +   of the query.


    +   Assignment must always be made to a **temporary** relation variable.


    +   Example: Write \( r \div s \) as

    +   \( temp1 \leftarrow \Pi_{R-S}(r) \)

    +   \( temp2 \leftarrow \Pi_{R-S}((temp1 \times s) - \Pi_{R-S,S}(r)) \)

    +   \( result = temp1 - temp2 \)


    +   The result to the **right** of the ← is **assigned** to the relation variable

    +   on the **left** of the ←.


    +   May use variable in subsequent expressions.


    # Example Queries


    +   - Example 1: Find all customers who have an **account** from **at least**
    the “Downtown” and the “Uptown” branches.


    **Query 1**


    \[\Pi_{CN}(\sigma_{BN=\text{“Downtown”}}(depositor \bowtie account))\]

    \[\Pi_{CN}(\sigma_{BN=\text{“Uptown”}}(depositor \bowtie account))\]


    where **CN** denotes customer-name and **BN** denotes *branch-name*.


    **Query 2**


    \[\Pi_{customer-name,\ branch-name}(depositor \bowtie account)\]

    \[\div\ \rho_{temp(branch-name)}(\{(\text{“Downtown”}),\ (\text{“Uptown”})\})\]


    # Example 2: Find all customers who have an account at all branches located in
    Brooklyn city.


    Πcustomer-name, branch-name (depositor ⋈ account) ÷ Πbranch-name (σbranch-city
    = “Brooklyn” (branch))


    # example 3: 查询选修了全部课程的学生学号和姓名。


    +   涉及表: 课程信息course(cno, cname,pre-cno,score), 选课信息sc(sno,cno,grade), 学生信息student(sno,
    sname, sex, age)


    +   当涉及到求 “全部” 之类的查询， 常用 “除法”


    +   找出全部课程号： Πcno (Course)


    +   找出选修了全部课程的学生的学号：


    ΠSno, Cno (SC) ÷ Πcno (Course)


    +   与student表自然连接（连接条件Sno）获得学号、姓名


    ( ΠSno, Cno (SC) ÷ Πcno (Course)) ⋈ ΠSno,Sname(student)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_109_0.png)


    # Summary


    +   - Union, set difference, Set intersection 为双目、等元运算

    +   - Cartesian product, Natural join, Division 双目运算

    +   - Project, select 为单运算对象

    +   - Priority(关系运算的优先级):


    +   - Project

    +   - Select

    +   - Cartesian Product(times)

    +   - Join, division

    +   - Intersection

    +   - Union, difference


    # # 2.4 Extended Relational-Algebra-Operations


    +   - **Generalized Projection (广义投影)**

    +   - **Aggregate Functions (聚集函数)**

    +   - **Outer Join (外连接)**


    # # (1) Generalized Projection


    +   - Extends the projection operation by allowing arithmetic functions to be
    used in the projection list.


    Π F1, F2, ..., Fn(E)


    +   - E is any relational-algebra expression


    +   - Each of F1, F2, ..., Fn are **arithmetic expressions** involving constants
    and attributes in the schema of E.


    +   - Given relation credit-info(customer-name, limit, credit-balance), find how
    much more each person can spend:


    Π customer-name, limit - credit-balance (credit-info)


