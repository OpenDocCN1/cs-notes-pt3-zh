    \n- 3) Dependency preservation（依赖保持）\n\n  - To check updates (to ensure not violate\
    \ any FD) efficiently, allow updates validation in sub-relations \\(R_i\\) respectively,\
    \ without executing the join of them.\n\n  - Restriction of F to \\(R_i\\) is:\
    \ \\(F_i \\subseteq F^+\\), \\(F_i\\) includes only attributes of \\(R_i\\)\n\n\
    \  - \\((F_1 \\cup F_2 \\cup \\ldots \\cup F_n)^+ = F^+\\), where \\(F_i\\) be\
    \ the set of dependencies in \\(F^+\\) that include only attributes in \\(R_i\\\
