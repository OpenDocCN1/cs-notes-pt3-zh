    \n## The Use of Functional Dependencies\n\n2) specify constraints (F) on the set\
    \ of legal relations - schema.\n\nWe say that F holds on R（F在R上成立）if all legal\
    \ relations r_s on R satisfy the set of functional dependencies F.\n\n| A | B\
    \ | C | D |\n|---|---|---|---|\n| a1 | b1 | c1 | d1 |\n| a1 | b2 | c1 | d2 |\n\
    | a2 | b2 | c2 | d2 |\n| a2 | b3 | c2 | d3 |\n| a3 | b3 | c2 | d4 |\n\nr₁(R)=\n\
    \nF = { A→C, AB→D, ABC→D }\n\nr₂(R)=...\nr₃(R)=...\n.......\n\n> c.f: a relation\
    \ r satisfy F ?\n> F hold on schema R ?\n\n> 【注】：容易判别一个r是否满足给定的F。\n> 不易判别F是否在R上成立。不能仅由某个r推断出F。\n\
    > R上的函数依赖F，通常由定义R的语义决定。\n\nWe can say the relation r(R) satisfy F.\nBut we cannot,\
    \ in accordance with only a r(R), say: F holds on schema R.\n\nStudent(sno, sname,\
    \ ssex, sage)\nF={ sno →{sname, ssex, sage},\n? sname →sno, sname →sage,...}\n\
    \n## (2) Closure of a Set of Functional Dependencies（函数依赖集的闭包）\n\nGiven a set\
    \ of functional dependencies $F$, there are certain other functional dependencies\
    \ that are logically implied by $F$.\n\nE.g. If $A \\to B$ and $B \\to C$, then\
    \ we can infer that $A \\to C$.\n\nDefinition: The set of all functional dependencies\
    \ logically implied by $F$ is the closure of $F$, denoted by $F^+$.\n\nE.g. $F\
    \ = \\{A \\to B, B \\to C\\}$, $F^+ = \\{A \\to B, B \\to C, A \\to C, A \\to\
    \ A, AB \\to A, AB \\to B, AC \\to C, A \\to BC, \\ldots\\}$\n\n### How to find\
    \ $F^+$?\n\nE.g. $R = (A, B, C, G, H, I)$\n\n```\n$F = \\{\\begin{aligned} A &\\\
    to B\\\\ A &\\to C\\\\ CG &\\to H\\\\ CG &\\to I\\\\ B &\\to H \\end{aligned}\\\
    }$\n```\n\n$F^+ = ?$\n\n## (2) Closure of a Set of Functional Dependencies (cont.)\
    \ — Armstrong’s Axioms (公理)\n\n- **Armstrong’s Axioms** provide inference rules\
    \ to find F⁺\n- We can find all of F⁺ by applying **Armstrong’s Axioms**:\n  -\
    \ if β ⊆ α, then α → β (**reflexivity**, 白反律) -- trivial\n  - if α → β, then γα\
    \ → γβ (**augmentation**, 增补律)\n  - if α → β, and β → γ, then α → γ (**transitivity**,\
    \ 传递律)\n- These rules are\n  - **sound** (保真的, generate only functional dependencies\
    \ that actually hold)\n  - **complete** (完备的, generate all functional dependencies\
    \ that hold).\n\n## Example\n\nR = (A, B, C, G, H, I)\nF = { A → B\n      A →\
    \ C\n      CG → H\n      CG → I\n      B → H }\n\n(pseudotransitivity, 伪传递律)\n\
    A →C, CG→H => AG →H\n\n### some members of F⁺\n\n- A →H by transitivity from A\
    \ → B and B → H\n\n- AG →I\n\n- AG →H\n\n- CG →HI\n\n- A →BC\n\nA → C aug AG →\
    \ CG , Given CG → I , trans AG → I\n\nA → C aug AG → CG , Given CG → H trans AG\
    \ → H\n\nCG → H aug CG → CGH , trans CG → HI\nCG → I aug CGH → HI ,\n\nA → B aug\
    \ A → AB , trans A → BC\nA → C aug AB → BC ,\n\n(union, 合并律)\n\n"
